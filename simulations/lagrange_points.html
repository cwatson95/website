  const gRun=h('div',{class:'grp'},h('h3',null,'the clock'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  gRun.appendChild(slider('speed','speed',1,10,1,v=>fmt(v,0)+'×'));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ simReset(st); dirty=true; refresh(); }},'stop & reset'),
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset(st);
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Measured: GM of the seven bodies, the separations and radii, the synodic month, and the mission figures the '
      +'orbits are sized to (Wikipedia, September 2026). Everything else is computed here and pinned in selfTest to build_lagr/derive.py '
      +'(scipy brentq, solve_ivp at rtol 1e-12, numpy eig, a differential corrector on the state transition matrix).'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gSys,gPoints,gSurf,gStab,gSe,gEm,gTro,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===plain(list[i].name)) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view;
    gSys.hidden=!(v==='points'||v==='surface'||v==='stab');
    gPoints.hidden=(v!=='points');
    gSurf.hidden=(v!=='surface');
    gStab.hidden=(v!=='stab');
    gSe.hidden=(v!=='sunearth');
    gEm.hidden=(v!=='earthmoon');
    gTro.hidden=(v!=='trojan');
    gRun.hidden=!viewAnimates(v);
    rows.muLog.row.hidden=(st.sys!=='custom');
    rows.dr.row.hidden=(st.troKind!=='horseshoe');
    for(const k in rows) rows[k].sync();
    const I=sysInfo(st.sys,st.muLog);
    sysTag.innerHTML=I.note+(I.Td!==null?'; period '+sigf(I.Td,5)+' d':'')+'; &mu; = '+(I.mu<1e-3?I.mu.toExponential(3):sigf(I.mu,5));
    pointsTag.innerHTML='slide C down from C(L1): the L1 neck opens first, then L2, then L3; the shading is where a body with that C cannot go';
    surfTag.innerHTML='drag the picture to orbit it; the stretch exaggerates the relief, the tanh flattens the wells';
    stabTag.innerHTML='release integrates the full equations from rest at the offset; at a saddle it runs off along the orange line, at a stable L4 it circles';
    seTag.innerHTML='the clock moves the spacecraft along their closed orbits; nudge JWST and a copy integrated live drifts away (multiplier ~1260 per orbit)';
    emTag.innerHTML='the Queqiao halo keeps Earth in view past the Moon; the NRHO passes 1,500 km over the north pole every 6.56 d';
    troTag.innerHTML=st.troKind==='horseshoe'?'a horseshoe starts on a circle the offset larger, at its own circular speed, and drifts backward past L3; offsets above about one Hill radius are scattered, not turned':'a tadpole starts at rest in the rotating frame at the angle set; wherever it starts short of L3 it stays on that side';
    runTag.innerHTML='space runs/pauses &nbsp; <b>r</b> stops the run &nbsp; 1&ndash;6 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=camKeys(st.view)?'drag to orbit the view · space pauses · 1–6 switch views':viewAnimates(st.view)?'space pauses · r stops the run · 1–6 switch views':'1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ simReset(st); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%10===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(st); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],

    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>3&&oy>3){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
