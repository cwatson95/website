<title>Granulation &mdash; the convection that tiles the Sun&rsquo;s surface, the field it sweeps into the lanes, and the striations on the granules&rsquo; walls</title>
<!--
  ===================================================================
  granulation.html — solar granulation computed live on the GPU: a
  3-Mm patch of the Sun's surface layers, 1.5 Mm deep, as a
  radiation-magnetohydrodynamic model of the gas (hydrogen and helium
  ionising), its opacity (H-, hydrogen, scattering), the light it
  loses, and the magnetic field it carries; the granules it forms,
  the kilogauss sheets the flow sweeps into the lanes, the Wilson
  depression of the surface where they sit, and, seen from 32 degrees
  as the Inouye telescope saw it, the faculae on the granules' walls
  and the striations across them
  ===================================================================

  Four views on one clock in solar time.  THE SURFACE: the continuum
  at 430 nm from straight above, or what lies at tau = 1 under it
  (B_z, v_z, the height of the surface, its temperature).  THE WALLS:
  the same patch from above and from an inclination mu (0.85 by
  default: the geometry of Kuridze et al. 2025), magnified, with
  cross-cuts of the intensity, the field and the surface height
  across the stripes.  THE CUT: a vertical slice: the plumes, the
  tau = 1 surfaces for vertical and for inclined rays, the kilogauss
  sheets, the flow, and a fan of sightlines showing why a stripe is
  dark.  THE MODEL: the mean stratification against its start, the
  energy flux the flow carries, the histories, and the checks.

  WHAT IS TAKEN FROM THE LITERATURE
  -----------------------------------------------------------------------
  The striations and their explanation: Kuridze, Woger, Uitenbroek,
  Rempel, Tritschler, Rimmele, Fischer and Steiner (2025), ApJL, "The
  striated solar photosphere observed at 0.03 arcsec resolution"
  (arXiv:2505.03965) and the NSO release of 2025 June 3: dark striae
  20-53 km wide at granular edges in plage, away from disc centre;
  in MURaM (7 km cells, 200 G mean field) tau = 1 raised 10-30 km
  where B_z is 100-250 G weaker than in the bright neighbours.  The
  physics of granulation: Stein and Nordlund (1998); Nordlund, Stein
  and Asplund (2009).  Faculae as the hot walls of granules seen
  through evacuated flux concentrations: Spruit (1976), Keller et al.
  (2004), Carlsson et al. (2004).  The production code the paper
  compares with: MURaM (Vogler et al. 2005; Rempel 2014).  The gas:
  Asplund et al. (2009) abundances; the Saha equation.  The deep
  entropy: Model S (Christensen-Dalsgaard et al. 1996), as on
  sun.html.  The opacities:
  Gray (2005): the H- bound-free polynomial after Wishart (1979), the
  H- free-free after Bell and Berrington (1987), hydrogen bound-free
  and free-free with Gaunt factors and Unsold's tail, Rayleigh and
  Thomson scattering.  The numerics: Harten, Lax and van Leer (1983),
  van Leer (1979), the monotonized-central limiter, Dedner et al.
  (2002) for div B, the Boris correction after Gombosi et al. (2002),
  short characteristics for the transfer, the A2 angular quadrature.  The Sun: T_eff 5772 K,
  g = 274 m/s^2 (IAU 2015 B3).

  WHAT IS COMPUTED HERE (checked by selfTest, run headless under jsc,
  and by the start-up checks on the page)
  -----------------------------------------------------------------------
  The ionisation and the equation of state (p, e, T, c_s, c_v) on a
  128 x 224 table in (log rho, log e); the continuum opacity at each
  frequency from the cross-sections, its Rosseland mean by quadrature
  over 96 frequencies, and the 430-nm value; the starting
  stratification (a grey two-stream atmosphere, T^4 = 3/4 T_eff^4
  (tau + 1/sqrt 3), above tau = 1; below it a boundary layer into
  Model S's own T(p), Model S down to 700 km, then the adiabat pinned
  to Model S's point 1203 km down: 15,289 K at 3.954e6 dyn/cm^2; all
  hydrostatic with the full equation of state); the
  vertical grid (uniform above -200 km, geometric below) and the
  discretely hydrostatic reference the solver is balanced against;
  the solver itself, in GLSL on the GPU and in JavaScript on a small
  grid as its twin (compared at start-up to float32 precision): finite
  volume, MUSCL reconstruction of the hydrostatically scaled
  primitives, HLL fluxes with Dedner's GLM, the Boris-limited Lorentz
  force as a source with its work, gravity's work from the mass
  fluxes, the magnetic dissipation returned as heat, SSP-RK2; the grey
  two-stream transfer (mu = 1/sqrt 3) by short characteristics with a
  linear source, the heating as the flux divergence with a relaxation
  limiter; the images along vertical and inclined rays at 430 nm in
  LTE with the tau = 1 crossings; the closed-box energy, the rest
  state, mass and flux conservation, div B, the buoyancy sign, the
  grey flux of the starting column (all in selfTest).

  WHAT IS ASSUMED OR NOT MODELLED (and said so on the page)
  -----------------------------------------------------------------------
  Grey radiation on eight rays (no lines, scattering counted as
  absorption, the inclined rays attributed to the cell they leave); LTE and the continuum
  only for the image (not the G band's CH lines); a closed bottom at
  -1.2 Mm with the deep adiabat enforced in the lowest 100 km (in
  place of the open boundary of the production codes), a closed and
  sponged top at +300 km, periodic sides; the deep adiabat's entropy
  is Model S's (a slider shifts it), and with it the settled box
  radiates a few per cent above the Sun's 5772 K (grey transfer,
  10-30 km cells); no H2, no
  molecular opacity, no second ionisation of the metals; the Boris
  reduction above the surface and the radiative limiter in the thick
  layers break energy conservation slightly there; cells of 12-31 km
  against MURaM's 7, so the striations here are two to four cells
  wide and coarser than DKIST's 20-50 km.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* a number rounded to n places; a value that rounds to zero prints as 0, never -0.00 (toFixed keeps the sign) */
function fmt(x,n){ if(!isFinite(x)) return '—'; const s=Number(x).toFixed(n===undefined?3:n); return /^-0(\.0*)?$/.test(s)?s.slice(1):s; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* a power of ten in superscripts, never a caret: 1.768 × 10⁸, 2.5 × 10⁻⁵ */
  if(a>=1e5||a<1e-4){ const s=x.toExponential(n-1), k=s.indexOf('e'), SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return s.slice(0,k)+' × 10'+String(+s.slice(k+1)).split('').map(c=>c==='-'?'⁻':SUP[+c]).join(''); }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
function sgn(x,n){ return (x<0?'−':'')+fmt(Math.abs(x),n); }
function thou(x,n){ return fmt(x,n||0).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sci(x,n){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
  let ms=fmt(m,n===undefined?2:n), ee=e; if(Math.abs(parseFloat(ms))>=10){ ee++; ms=fmt(x/Math.pow(10,ee),n===undefined?2:n); }
  return (ee===0?ms:ms+' × 10'+String(ee).split('').map(c=>SUPS[c]).join('')).replace(/^-/,'−'); }


/* ================================================================== *
 *  granulation — the physics on the CPU: constants, the equation of   *
 *  state (hydrogen and helium ionising by Saha), the continuum        *
 *  opacity from the cross sections, the Rosseland mean, the tables    *
 *  the shaders read, the initial stratification, and a JavaScript    *
 *  twin of the solver on a small grid                                 *
 * ================================================================== */
const KB=1.380649e-16, HP=6.62607015e-27, CL=2.99792458e10, ME=9.1093837015e-28, AMU=1.66053906660e-24;
const EV=1.602176634e-12, SIG_SB=5.670374419e-5, HC_K=1.438776877;            /* hc/k, cm K */
const G_SUN=2.74e4;                                                          /* cm/s^2 */
const T_EFF_SUN=5772;
const X_H=0.7381, Y_HE=0.2485;                                               /* Asplund et al. 2009 */
const M_H=1.00784*AMU, M_HE=4.002602*AMU;
const NH_PER_G=X_H/M_H, NHE_PER_G=Y_HE/M_HE;
const CHI_H=13.598434, CHI_HE1=24.587389, CHI_HE2=54.417765;                 /* eV */
/* the electron donors below 7000 K: Mg+Si+Fe as one element, Na+Al+Ca+K as another (Asplund 2009 abundances) */
const METALS=[{eps:7.6e-5,chi:7.9},{eps:7.0e-6,chi:5.5}];
const SAHA_C=Math.pow(2*Math.PI*ME*KB/(HP*HP),1.5);                          /* 2.4147e15 cm^-3 K^-3/2 */

/* ---- ionisation: n_e from Saha for H, He (twice), the metals; bisection in log n_e ---- */
function ionisation(rho,T){
  const nH=rho*NH_PER_G, nHe=rho*NHE_PER_G, kT=KB*T, t32=SAHA_C*Math.pow(T,1.5);
  const phH=t32*Math.exp(-CHI_H*EV/kT);           /* 2 U+/U0 = 2*(1/2) */
  const phHe1=4*t32*Math.exp(-CHI_HE1*EV/kT);     /* 2*(2/1) */
  const phHe2=t32*Math.exp(-CHI_HE2*EV/kT);       /* 2*(1/2) */
  const phM=METALS.map(m=>2*t32*Math.exp(-m.chi*EV/kT));
  const ntot=nH+2*nHe+nH*METALS.reduce((s,m)=>s+m.eps,0);
  const rhs=ne=>{ const xH=phH/(ne+phH); const a=phHe1/ne, b=a*phHe2/ne, d=1+a+b; const x1=a/d, x2=b/d;
    let s=nH*xH+nHe*(x1+2*x2); for(let m=0;m<METALS.length;m++) s+=nH*METALS[m].eps*phM[m]/(ne+phM[m]); return {s,xH,x1,x2}; };
  let lo=Math.log(1e-30), hi=Math.log(ntot*1.0000001);
  for(let it=0;it<56;it++){ const mid=0.5*(lo+hi), ne=Math.exp(mid); if(rhs(ne).s>ne) lo=mid; else hi=mid; }
  const ne=Math.exp(0.5*(lo+hi)), r=rhs(ne);
  return {ne,xH:r.xH,xHe1:r.x1,xHe2:r.x2,nH,nHe};
}
/* ---- the equation of state at (rho,T): p, e per gram, c_v per gram ---- */
function eosRT(rho,T){
  const I=ionisation(rho,T), nM=I.nH*METALS.reduce((s,m)=>s+m.eps,0);
  const ntot=I.nH+I.nHe+nM+I.ne;
  const p=ntot*KB*T;
  const e=(1.5*ntot*KB*T+I.nH*I.xH*CHI_H*EV+I.nHe*(I.xHe1*CHI_HE1+I.xHe2*(CHI_HE1+CHI_HE2))*EV)/rho;
  return {p,e,ne:I.ne,xH:I.xH,xHe1:I.xHe1,xHe2:I.xHe2,ntot,nH:I.nH,nHe:I.nHe};
}
/* T from (rho,e) by bisection on eosRT (the tables do this once; the solver reads the tables) */
function tempOf(rho,e,Tlo,Thi){ Tlo=Tlo||1500; Thi=Thi||1.2e5;
  for(let it=0;it<60;it++){ const Tm=Math.sqrt(Tlo*Thi); if(eosRT(rho,Tm).e<e) Tlo=Tm; else Thi=Tm; } return Math.sqrt(Tlo*Thi); }

/* ---- the continuum opacity per gram at wavelength lam (Angstrom): H I bf+ff, H- bf+ff, Rayleigh (H), Thomson ---- */
const HM_BF=[1.99654,-1.18267e-5,2.64243e-6,-4.40524e-10,3.23992e-14,-1.39568e-18,2.78701e-23];   /* Gray 2005, Wishart 1979 */
const HM_FF=[[-2.2763,-1.6850,0.76661,-0.053346],[15.2827,-9.2846,1.99381,-0.142631],[-197.789,190.266,-67.9775,10.6913,-0.625151]]; /* Gray 2005, Bell & Berrington 1987 */
const RYD_A=1.0968e-3;                                                       /* Rydberg, 1/Angstrom */
const ALPHA0=1.0449e-26;                                                     /* Gray's alpha_0 for lambda in Angstrom */
const LOG_E=Math.LOG10E;
function hminusBF(lam){ if(lam<1500||lam>16200) return 0; let s=0, l=1; for(let i=0;i<7;i++){ s+=HM_BF[i]*l; l*=lam; } return Math.max(s,0)*1e-18; }
function hminusFFcoef(lam){ const L=Math.log10(Math.max(2600,Math.min(lam,113900))); const f=[0,0,0];
  for(let i=0;i<3;i++){ let s=0, l=1; for(let j=0;j<HM_FF[i].length;j++){ s+=HM_FF[i][j]*l; l*=L; } f[i]=s; }
  const ext=lam>113900?(lam/113900)*(lam/113900):1; return {f,ext}; }
function kappaLam(lam,rho,T,E){                                              /* E = eosRT result; returns cm^2/g */
  const th=5040/T, chiL=12398.4/lam, nHI=E.nH*(1-E.xH), Pe=E.ne*KB*T, stim=1-Math.pow(10,-chiL*th);
  /* H I bound-free (Gray eq. 8.8 with Unsold's tail) and free-free (8.10) per neutral atom */
  const lR=lam*RYD_A, n0=Math.max(1,Math.ceil(Math.sqrt(lR)-1e-9)), c13=0.3456/Math.cbrt(lR);
  let sbf=0; for(let n=n0;n<n0+3;n++){ const g=1-c13*(lR/(n*n)-0.5), chin=CHI_H*(1-1/(n*n)); sbf+=g/(n*n*n)*Math.pow(10,-th*chin); }
  const chi3=CHI_H*(1-1/((n0+3)*(n0+3)));
  sbf+=LOG_E/(2*th*CHI_H)*(Math.pow(10,-th*chi3)-Math.pow(10,-th*CHI_H));
  const kHbf=ALPHA0*lam*lam*lam*sbf;
  const gff=1+c13*(LOG_E/(th*chiL)+0.5);
  const kHff=ALPHA0*lam*lam*lam*gff*LOG_E/(2*th*CHI_H)*Math.pow(10,-th*CHI_H);
  /* H- bound-free (8.12) and free-free (8.13) per neutral H atom, P_e in dyn/cm^2 */
  const kHmbf=4.158e-10*hminusBF(lam)*Pe*Math.pow(th,2.5)*Math.pow(10,0.754*th);   /* alpha_bf in cm^2: the factor is n(H-)/n(H I) per dyn/cm^2 */
  const F=hminusFFcoef(lam), lth=Math.log10(th);
  const kHmff=1e-26*Pe*Math.pow(10,F.f[0]+F.f[1]*lth+F.f[2]*lth*lth)*F.ext;
  const l2=lam*lam, ray=5.799e-13/(l2*l2)+1.422e-6/(l2*l2*l2)+2.784/(l2*l2*l2*l2);
  return ((kHbf+kHff+kHmbf)*stim+kHmff+ray)*nHI/rho+0.6648e-24*E.ne/rho;
}
/* Rosseland mean over u = h nu / k T on a log grid */
const U_GRID=(()=>{ const u=[]; for(let i=0;i<=96;i++) u.push(0.08*Math.pow(30/0.08,i/96)); return u; })();
function rosseland(rho,T,E){ let num=0, den=0;
  for(let i=0;i<U_GRID.length-1;i++){ const u=0.5*(U_GRID[i]+U_GRID[i+1]), du=U_GRID[i+1]-U_GRID[i];
    const eu=Math.exp(u), w=u*u*u*u*eu/((eu-1)*(eu-1))*du; const lam=HC_K*1e8/(u*T);
    const k=kappaLam(lam,rho,T,E); num+=w/k; den+=w; }
  return den/num; }
function planckMeanCheck(){ let s=0; for(let i=0;i<U_GRID.length-1;i++){ const u=0.5*(U_GRID[i]+U_GRID[i+1]), du=U_GRID[i+1]-U_GRID[i]; const eu=Math.exp(u); s+=u*u*u*u*eu/((eu-1)*(eu-1))*du; } return s; }  /* 4 pi^4/15 = 25.976 */
const LAM_IMG=4300;                                                          /* the image's continuum, Angstrom */
function planck(lamA,T){ const l=lamA*1e-8; return 2*HP*CL*CL/Math.pow(l,5)/(Math.exp(HC_K/(l*T))-1); }  /* B_lambda, erg/s/cm^2/cm/sr */

/* ================================================================== *
 *  the tables: (log rho, log e) -> p, T, c_s^2, kappa_R, kappa_430, c_v, x_H *
 * ================================================================== */
const TAB={nr:128, ne:224, lr0:-10.5, lr1:-4.0, le0:11.2, le1:13.6};
function buildTables(){
  const nr=TAB.nr, ne=TAB.ne, nT=200, lT0=Math.log10(1800), lT1=Math.log10(60000);
  const out={p:new Float32Array(nr*ne), T:new Float32Array(nr*ne), cs2:new Float32Array(nr*ne), kR:new Float32Array(nr*ne),
             k430:new Float32Array(nr*ne), cv:new Float32Array(nr*ne), xH:new Float32Array(nr*ne), rho:[], e:[]};
  for(let a=0;a<nr;a++) out.rho.push(Math.pow(10,TAB.lr0+(TAB.lr1-TAB.lr0)*a/(nr-1)));
  for(let b=0;b<ne;b++) out.e.push(Math.pow(10,TAB.le0+(TAB.le1-TAB.le0)*b/(ne-1)));
  const P=new Float64Array(nr*ne), TT=new Float64Array(nr*ne);
  for(let a=0;a<nr;a++){ const rho=out.rho[a];
    /* e(T) on a fine T grid, then invert by interpolation */
    const Ts=[], es=[], Es=[]; for(let t=0;t<nT;t++){ const T=Math.pow(10,lT0+(lT1-lT0)*t/(nT-1)); const E=eosRT(rho,T); Ts.push(T); es.push(E.e); Es.push(E); }
    let t=0;
    for(let b=0;b<ne;b++){ const e=out.e[b]; while(t<nT-2&&es[t+1]<e) t++;
      const f=Math.max(0,Math.min(1,(e-es[t])/(es[t+1]-es[t]))), T=Ts[t]*Math.pow(Ts[t+1]/Ts[t],f);
      const E=eosRT(rho,T), i=a*ne+b;
      P[i]=E.p; TT[i]=T; out.p[i]=E.p; out.T[i]=T; out.xH[i]=E.xH;
      out.cv[i]=(eosRT(rho,T*1.002).e-eosRT(rho,T*0.998).e)/(0.004*T);
      out.kR[i]=rosseland(rho,T,E); out.k430[i]=kappaLam(LAM_IMG,rho,T,E); }
  }
  /* c_s^2 = (dp/drho)_e + (p/rho^2)(dp/de)_rho by centred differences on the table */
  for(let a=0;a<nr;a++) for(let b=0;b<ne;b++){ const i=a*ne+b, a0=Math.max(0,a-1), a1=Math.min(nr-1,a+1), b0=Math.max(0,b-1), b1=Math.min(ne-1,b+1);
    const dpdr=(P[a1*ne+b]-P[a0*ne+b])/(out.rho[a1]-out.rho[a0]), dpde=(P[a*ne+b1]-P[a*ne+b0])/(out.e[b1]-out.e[b0]);
    out.cs2[i]=Math.max(dpdr+P[i]/(out.rho[a]*out.rho[a])*dpde,0.3*P[i]/out.rho[a]); }
  return out;
}
/* bilinear lookup in (log rho, log e), the same arithmetic the shader does */
function tabLookup(TB,rho,e){
  const u=(Math.log10(rho)-TAB.lr0)/(TAB.lr1-TAB.lr0)*(TAB.nr-1), v=(Math.log10(e)-TAB.le0)/(TAB.le1-TAB.le0)*(TAB.ne-1);
  const uc=Math.max(0,Math.min(TAB.nr-1.0001,u)), vc=Math.max(0,Math.min(TAB.ne-1.0001,v));
  const a=Math.floor(uc), b=Math.floor(vc), fa=uc-a, fb=vc-b, i00=a*TAB.ne+b, i10=i00+TAB.ne, i01=i00+1, i11=i10+1;
  const L=arr=>(arr[i00]*(1-fa)+arr[i10]*fa)*(1-fb)+(arr[i01]*(1-fa)+arr[i11]*fa)*fb;
  const Lg=arr=>Math.exp((Math.log(arr[i00])*(1-fa)+Math.log(arr[i10])*fa)*(1-fb)+(Math.log(arr[i01])*(1-fa)+Math.log(arr[i11])*fa)*fb);
  return {p:Lg(TB.p),T:Lg(TB.T),cs2:Lg(TB.cs2),kR:Lg(TB.kR),k430:Lg(TB.k430),cv:Lg(TB.cv),xH:L(TB.xH)};
}

/* ================================================================== *
 *  the initial stratification: a grey two-stream atmosphere above    *
 *  tau = 1 (T^4 = 3/4 T_eff^4 (tau + 1/sqrt 3), the exact solution   *
 *  of the transfer the solver uses) and an adiabat below it, both    *
 *  hydrostatic with the EOS                                          *
 * ================================================================== */
function rhoOfPT(p,T){ let lo=Math.log(1e-13), hi=Math.log(1e-2);
  for(let it=0;it<60;it++){ const m=0.5*(lo+hi); if(eosRT(Math.exp(m),T).p<p) lo=m; else hi=m; } return Math.exp(0.5*(lo+hi)); }
const Q_HOPF=1/Math.sqrt(3);                                                   /* the two-stream grey atmosphere's constant (Eddington's is 2/3) */
function tEdd(tau,Teff){ return Teff*Math.pow(0.75*(tau+Q_HOPF),0.25); }
/* Model S (Christensen-Dalsgaard et al. 1996), the standard solar model sun.html is built on, below the photosphere:
   (p, T) pairs from 0 to 2500 km down; the deep adiabat is pinned to its point 1203 km down */
const MODEL_S=[[7.609e4,5778],[1.073e5,6439],[1.437e5,7904],[2.275e5,9701],[3.378e5,10694],[4.767e5,11409],[6.565e5,12015],[1.169e6,13050],[1.533e6,13533],[1.973e6,13985],[2.487e6,14409],[3.135e6,14842],[3.954e6,15289],[4.881e6,15707],[7.280e6,16539],[1.255e7,17776],[2.067e7,19039],[3.751e7,20762]];
const MODEL_S_PIN={p:3.954e6,T:15289,z:-1.203e8};
function tModelS(p){ const M=MODEL_S; if(p<=M[0][0]) return M[0][1]; for(let i=1;i<M.length;i++) if(p<=M[i][0]){ const f=Math.log(p/M[i-1][0])/Math.log(M[i][0]/M[i-1][0]); return M[i-1][1]*Math.pow(M[i][1]/M[i-1][1],f); } return M[M.length-1][1]; }
/* the adiabat through (p0, T0), integrated in ln p both ways: rows {p, rho, T, e} sorted by rho */
function adiabatThrough(p0,T0,pLo,pHi,TB){
  const pOf=(rho,e)=>TB?tabLookup(TB,rho,e).p:eosRT(rho,tempOf(rho,e)).p, TOf=(rho,e)=>TB?tabLookup(TB,rho,e).T:tempOf(rho,e), cs2Of=(rho,e)=>TB?tabLookup(TB,rho,e).cs2:csAd(rho,e);
  const march=(dir)=>{ let rho=rhoOfPT(p0,T0), e=eosRT(rho,T0).e, p=p0; const out=[]; const step=Math.exp(dir*0.01);
    while(dir>0?p<pHi:p>pLo){ const pn=p*step; let rn=rho, en=e; for(let it=0;it<6;it++){ const pp=pOf(rn,en), cs2=cs2Of(rn,en); rn+=(pn-pp)/cs2; en=e+0.5*(p/(rho*rho)+pp/(rn*rn))*(rn-rho); }
      rho=rn; e=en; p=pOf(rho,e); out.push({p,rho,T:TOf(rho,e),e}); } return out; };
  const rows=march(-1).reverse().concat([{p:p0,rho:rhoOfPT(p0,T0),T:T0,e:eosRT(rhoOfPT(p0,T0),T0).e}],march(1)); return rows; }
function tAdiabatP(A,p){ if(p<=A[0].p) return A[0].T; for(let i=1;i<A.length;i++) if(p<=A[i].p){ const f=Math.log(p/A[i-1].p)/Math.log(A[i].p/A[i-1].p); return A[i-1].T*Math.pow(A[i].T/A[i-1].T,f); } return A[A.length-1].T; }
/* opts: Teff, zBot, zTop (cm), dAd (a fractional shift of the deep adiabat's temperature at Model S's pin point),
   grey (continue the radiative atmosphere to the bottom: a column in radiative equilibrium, for the checks).
   Below tau = 1 the start follows a steep boundary layer into Model S's own stratification, then the adiabat. */
function stratify(opts,TB){
  const Teff=opts.Teff||T_EFF_SUN, dAd=opts.dAd||0, zBot=opts.zBot, zTop=opts.zTop;
  const kR=(rho,T,E)=>TB?tabLookup(TB,rho,(E||eosRT(rho,T)).e).kR:rosseland(rho,T,E||eosRT(rho,T));
  const rows=[];                                                            /* {z,rho,T,p,tau} */
  /* the atmosphere, integrated in ln tau from 1e-5 to 1 (or to the bottom when grey) */
  let tau=1e-5, T=tEdd(tau,Teff), p=G_SUN*tau/0.05;
  for(let it=0;it<30;it++){ const rho=rhoOfPT(p,T), E=eosRT(rho,T); p=G_SUN*tau/kR(rho,T,E); }
  let z=0; const dl=0.04;
  const dpdt=(tau,p)=>{ const T=tEdd(tau,Teff), rho=rhoOfPT(p,T); return {dp:G_SUN/kR(rho,T),rho}; };
  rows.push({z,rho:rhoOfPT(p,T),T,p,tau});
  let z1=null;
  while(true){ if(!opts.grey&&tau>=1-1e-12) break; if(opts.grey&&z1!==null&&z-z1<zBot-1e6) break;
    const tau2=opts.grey?tau*Math.exp(dl):Math.min(1,tau*Math.exp(dl)), dt=tau2-tau;
    const k1=dpdt(tau,p), k2=dpdt(tau2,p+dt*k1.dp); const pn=p+0.5*dt*(k1.dp+k2.dp);
    const Tn=tEdd(tau2,Teff), rhon=rhoOfPT(pn,Tn); const kr1=kR(k1.rho,tEdd(tau,Teff)), kr2=kR(rhon,Tn);
    z-=0.5*dt*(1/(kr1*k1.rho)+1/(kr2*rhon)); tau=tau2; p=pn; T=Tn; rows.push({z,rho:rhon,T,p,tau}); if(z1===null&&tau>=1-1e-12) z1=z; }
  if(z1===null) z1=z; for(const r of rows) r.z-=z1;                       /* tau = 1 at z = 0 */
  /* the deep adiabat, pinned to Model S */
  const adi=adiabatThrough(MODEL_S_PIN.p,MODEL_S_PIN.T*(1+dAd),5e4,2e8,TB);
  if(!opts.grey){
    /* below tau = 1: a boundary layer from T1 to Model S's T(2 p1) over a factor two in p, then Model S, then the adiabat */
    const p1=p, T1=T, pB=2*p1, TB2=Math.max(tModelS(pB),tAdiabatP(adi,pB)), nab=Math.log(TB2/T1)/Math.log(2);
    let rho=rhoOfPT(p,T); z=0; tau=1;
    const Tof=pp=>pp<pB?T1*Math.pow(pp/p1,nab):Math.max(tModelS(pp),tAdiabatP(adi,pp));
    while(z>zBot-2e5){ const pn=p*Math.exp(0.01), Tn=Tof(pn), rhon=rhoOfPT(pn,Tn); const dz=(pn-p)*0.5*(1/(rho*G_SUN)+1/(rhon*G_SUN)); z-=dz; tau+=0.5*(kR(rho,T)*rho+kR(rhon,Tn)*rhon)*dz; p=pn; T=Tn; rho=rhon; rows.push({z,rho,T,p,tau}); }
  }
  for(const r of rows){ r.e=eosRT(r.rho,r.T).e; }
  rows.sort((a,b)=>a.z-b.z);
  while(rows[rows.length-1].z<zTop){ const t=rows[rows.length-1], H=KB*t.T/(1.26*M_H*G_SUN), dzz=2e6; const rho2=t.rho*Math.exp(-dzz/H);
    rows.push({z:t.z+dzz,rho:rho2,T:t.T,p:eosRT(rho2,t.T).p,e:eosRT(rho2,t.T).e,tau:t.tau*Math.exp(-dzz/H)}); }
  return {rows,adi,Teff,dAd};
}
/* (dp/drho)_s at (rho,e) by differences */
function csAd(rho,e){ const d=1e-3; const L0=eosRT(rho,tempOf(rho,e)); const r1=rho*(1+d), e1=e+L0.p/(rho*rho)*(r1-rho); const L1=eosRT(r1,tempOf(r1,e1)); return (L1.p-L0.p)/(r1-rho); }
/* T on the model's adiabat at pressure p */
function tAtP(S,p){ const R=S.rows; for(let i=R.length-1;i>0;i--){ if(R[i].p<=p&&R[i-1].p>=p){ const f=Math.log(p/R[i].p)/Math.log(R[i-1].p/R[i].p); return R[i].T*Math.pow(R[i-1].T/R[i].T,f); } } return R[0].p>=p?R[R.length-1].T:R[0].T; }
function strAt(S,z,key){ const R=S.rows; let lo=0, hi=R.length-1; if(z<=R[0].z) return R[0][key]; if(z>=R[hi].z) return R[hi][key];
  while(hi-lo>1){ const m=(lo+hi)>>1; if(R[m].z<=z) lo=m; else hi=m; } const f=(z-R[lo].z)/(R[hi].z-R[lo].z);
  const a=R[lo][key], b=R[hi][key]; return (a>0&&b>0)?a*Math.pow(b/a,f):a+(b-a)*f; }
/* T on the adiabat for a density rho (for the bottom layer's relaxation) */
function tAdiabat(S,rho){ const A=S.adi; if(rho<=A[0].rho) return A[0].T; if(rho>=A[A.length-1].rho) return A[A.length-1].T;
  let lo=0, hi=A.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(A[m].rho<=rho) lo=m; else hi=m; } const f=Math.log(rho/A[lo].rho)/Math.log(A[hi].rho/A[lo].rho); return A[lo].T*Math.pow(A[hi].T/A[lo].T,f); }

/* ================================================================== *
 *  the vertical grid: uniform dz above zSw, geometric below           *
 * ================================================================== */
function zGrid(Nz,dzSurf,zBot,zTop,zSw){

function stageOf(M){ const s=M.stats, t=M.t; if(!s) return 'starting';
  if(t<30) return 'a stratified atmosphere at rest, in radiative equilibrium above τ = 1 and on an adiabat below: it radiates, and the layer below the surface starts to cool';
  if(s.rms<0.04) return 'the layer just below τ = 1 radiates faster than it is resupplied: it cools, grows dense, and the first cells begin to turn over';
  if(s.rms<0.15) return 'convection is setting in: warm gas rises in the cells, the cooled gas drains into lanes between them';
  if(s.Bmax<1000) return 'granules: broad warm upflows, narrow cool downflows; the converging flow is sweeping the field into the lanes';
  return 'granules renewing every few minutes; the field in the lanes has collapsed to kilogauss sheets, depressing the surface where it sits'; }

const SRC_LINE='The striations: Kuridze, Wöger, Uitenbroek, Rempel, Tritschler, Rimmele, Fischer &amp; Steiner (2025), ApJL, arXiv:2505.03965, and the NSO release of 2025 June 3; the production code they compare with: MURaM (Vögler et al. 2005; Rempel 2014). Granulation and its simulation: Stein &amp; Nordlund (1998), Nordlund, Stein &amp; Asplund (2009). Faculae as hot walls seen through evacuated flux tubes: Spruit (1976), Keller et al. (2004), Carlsson et al. (2004). The opacities: Gray (2005) after Wishart (1979) and Bell &amp; Berrington (1987). The gas: Asplund et al. (2009) abundances, Saha. The numerics: Harten, Lax &amp; van Leer (1983), van Leer (1979), Dedner et al. (2002), the Boris correction after Gombosi et al. (2002). The Wilson depression: Wilson (1774).';
function infoFor(v){
  if(v==='surface') return 'A '+fmt(ST.width/1e8,1)+'-Mm patch of the Sun&rsquo;s surface, 1.5 Mm deep, computed as you watch: the gas, its ionisation, its opacity, the light it loses, and the field it carries. Shown is the continuum at 430 nm seen from straight above, or, by the chips, what lies at τ&nbsp;=&nbsp;1 under each point of it. <b>Granules</b> are the tops of the rising warm gas, a megametre across; the <b>lanes</b> are where it has radiated, cooled, grown dense and turned down. Each cell lives five to ten minutes. The field, uniform and vertical at the start, is carried to the lanes by the flow converging on them and squeezed there to kilogauss by the downdraught and the cooling (the convective collapse); where it sits the gas is evacuated and the surface τ&nbsp;=&nbsp;1 sinks by one to two hundred kilometres (the Wilson depression). The model starts at rest; the layer under the surface radiates before anything stirs, and the pattern forms over the first ten minutes.';
  if(v==='walls') return 'The same surface seen from above and from '+fmt(Math.acos(ST.mu)*180/PI,0)+'&deg; off the vertical, the geometry in which the Inouye telescope found the striations (μ&nbsp;=&nbsp;0.85; the limb to the right). At an angle the line of sight crosses the walls of the granules: the walls facing the observer are seen through the cooler lane gas and look dark; those facing away are hidden. Where a line of sight passes through a kilogauss sheet it reaches deeper, because the sheet is evacuated, and sees the hot wall of the granule behind it: a <b>facula</b>, the bright edge. Along the sheet the field varies from place to place by a few hundred gauss; where it is weaker the sheet is less evacuated, τ&nbsp;=&nbsp;1 along the ray lies some tens of kilometres higher and cooler, and that part of the wall is darker. Side by side across the wall these make the <b>striations</b>, stripes running toward the limb. The cross-cuts below follow one line across them: the intensity dips where B<sub>z</sub> dips and τ&nbsp;=&nbsp;1 rises (the paper&rsquo;s figure 7). Here the stripes are two to four cells wide, '+fmt(2*ST.width/ST.res/1e5,0)+'&ndash;'+fmt(4*ST.width/ST.res/1e5,0)+' km; the telescope&rsquo;s are 20&ndash;50.';
  if(v==='cut') return 'A vertical slice along the dashed line of the surface views, the whole depth of the box. The temperature shows the plumes: broad warm upflows, narrow cool downflows that reach the bottom. The white line is where a vertical ray reaches optical depth one, the surface the overhead image shows; it sinks into the lanes and deepest into the kilogauss sheets (the contours), where the gas pressure is lowered by the field&rsquo;s. The dashed green line is τ&nbsp;=&nbsp;1 along the inclined rays, the surface the walls view shows. The fan of sightlines at μ shows the mechanism: a ray that enters a sheet travels on through the evacuated gas and ends deeper, on the hot wall behind, bright; its neighbour outside the sheet ends sooner, in cooler gas, dark; and along the sheet (into the page) the field&rsquo;s strength, and so the depth each ray reaches, vary from stripe to stripe. The trace above the panel is the intensity along this row, from above and at the inclination.';
  return 'What the model is and how it is checked. The mean temperature against the stratification it started from (the grey two-stream atmosphere above τ&nbsp;=&nbsp;1, a steep boundary layer into Model S&rsquo;s own run of temperature with pressure, and the deep adiabat below 700&nbsp;km); the energy flux carried by the flow, which must take the Sun&rsquo;s σT<sup>4</sup> up to the surface for radiation to take over; the history of the emergent temperature, the contrast and the field; and the checks that run at the start: the shader against its JavaScript twin, the rest state under gravity, the energy of a closed box, the flux of a column in radiative equilibrium. The one free number of the production codes, the entropy of the gas flowing in at the bottom, is taken here from Model S (the standard solar model sun.html is built on): the deep adiabat passes through Model S&rsquo;s temperature 1203&nbsp;km below the photosphere. With it the box settles, after fifteen to twenty minutes of solar time, to a T<sub>eff</sub> a few per cent above the Sun&rsquo;s 5772&nbsp;K and a mean temperature at τ&nbsp;=&nbsp;1 near the Sun&rsquo;s 6400&nbsp;K; the slider shifts the adiabat either way.'; }
function physFor(v){ const frac=(t,b)=>'<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>';
  const eq=(s,n)=>'<div class="eq">'+s+'<span class="n">('+n+')</span></div>';
  let s='';
  if(v==='surface'||v==='model'){
    s+='<h4>the gas</h4><p>A hydrogen&ndash;helium gas (X&nbsp;=&nbsp;0.738, Y&nbsp;=&nbsp;0.249) with hydrogen and helium ionising by Saha&rsquo;s equation, and Mg, Si, Fe, Na, Al, Ca, K (two pseudo-elements, 7.6&nbsp;×&nbsp;10<sup>&minus;5</sup> and 7&nbsp;×&nbsp;10<sup>&minus;6</sup> per hydrogen) as the electron donors below 7000&nbsp;K. The internal energy carries the ionisation energy, which is most of what a granule brings up.</p>'

      +'<h4>the opacity</h4><p>H<sup>&minus;</sup> bound-free (Wishart&rsquo;s cross-section, Gray&rsquo;s polynomial) and free-free (Bell &amp; Berrington), hydrogen bound-free from every level with Unsöld&rsquo;s tail and free-free with Gaunt factors, Rayleigh scattering on hydrogen and Thomson on the electrons, with stimulated emission; the Rosseland mean by quadrature over 96 frequencies for the transfer, and the monochromatic value at 430&nbsp;nm for the image. No lines: the real surface is somewhat more opaque, so τ&nbsp;=&nbsp;1 here sits at ρ&nbsp;≈&nbsp;4&nbsp;×&nbsp;10<sup>&minus;7</sup> g/cm³.</p>'
      +eq(frac('1','κ<sub>R</sub>')+' = '+frac('∫ κ<sub>ν</sub><sup>&minus;1</sup> ∂<sub>T</sub>B<sub>ν</sub> dν','∫ ∂<sub>T</sub>B<sub>ν</sub> dν'),'2')
      +'<h4>the radiation</h4><p>Grey, along eight rays: up and down at μ&nbsp;=&nbsp;1/√3 in four azimuths (the A2 quadrature), each ray shifted sideways by the layer&rsquo;s height times √2 as it climbs, integrated layer by layer by short characteristics with the source function linear in τ and the intensity resampled at the ray&rsquo;s entry point. What a ray loses in a cell heats the cell, so the box loses exactly what leaves its top, and the hot granules warm the lanes sideways. A cell whose radiative relaxation is faster than the time step has its exchange limited to the relaxed value. A column in radiative equilibrium, on this discretisation, radiates the Sun&rsquo;s flux to within a per cent at 10-km cells.</p>'
      +eq('Q = Σ<sub>rays</sub> '+frac('π μ','2 Δz')+' (I<sub>in</sub> &minus; I<sub>out</sub>), &nbsp; σT<sub>eff</sub><sup>4</sup> = '+frac('π','2√3')+' Σ<sub>up</sub> I<sub>top</sub>','3')
      +'<h4>the flow</h4><p>Ideal MHD in conservative form: mass, momentum, the hydrodynamic energy E&nbsp;=&nbsp;e&nbsp;+&nbsp;ρv²/2, and the induction equation with Dedner&rsquo;s cleaning of ∇·B. The Lorentz force is a source, reduced by the Boris factor f<sub>B</sub>&nbsp;=&nbsp;1/(1&nbsp;+&nbsp;v<sub>A</sub>²/c<sub>lim</sub>²) where the Alfvén speed would otherwise set the time step (c<sub>lim</sub>&nbsp;=&nbsp;20&nbsp;km/s at the surface, growing by that every 100&nbsp;km below it, so the sheets below the surface feel the full force).</p>'
      +eq('∂<sub>t</sub>E + ∇·[(E + p)<b>v</b>] = ρ<b>g</b>·<b>v</b> + f<sub>B</sub> <b>v</b>·(<b>J</b>×<b>B</b>) + Q','4')
      +'<p>Finite volume on a '+ST.res+'² × '+GRID_OF[ST.res].Nz+' grid: van Leer reconstruction of the primitives, with ρ, p and e scaled by the hydrostatic reference so that the stratified rest state is an exact solution; HLL fluxes with the fast speed; second-order Runge&ndash;Kutta at 0.45 of the Courant limit; the magnetic energy the fluxes dissipate is returned as heat, and gravity&rsquo;s work is taken from the same mass fluxes that move the mass, so the total energy of a closed box is kept. Periodic sides; closed top and bottom with the field held vertical there; a sponge for vertical motion in the top 100&nbsp;km; the bottom 100&nbsp;km relaxed in 20&nbsp;s toward the deep adiabat (Model S&rsquo;s entropy), which stands in for the open boundary of the production codes and supplies the flux.</p>';
  }
  if(v==='walls'||v==='cut'){
    s+='<h4>the image</h4><p>Along each ray, downward from the top, the optical depth at 430&nbsp;nm accumulates and the intensity is the integral of the Planck function against e<sup>&minus;τ</sup> (LTE, the source linear across each cell); the ray is shifted sideways by (z<sub>top</sub>&nbsp;&minus;&nbsp;z)&nbsp;tan&nbsp;θ at each layer, and the sky-plane image is foreshortened by μ. Where τ reaches 1 the height, the field and the velocity are recorded: the maps the chips show.</p>'
      +eq('I(μ) = ∫ B<sub>430</sub>(T) e<sup>&minus;τ</sup> dτ, &nbsp; dτ = κ<sub>430</sub> ρ dz / μ','5')
