/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
/* EXTENDED for this sim.  Two defects in the shared version were found by the
   UI-drive assertion that no entity may reach fillText:
     (1) the table had no Greek, and plain() returns an unknown entity
         UNCHANGED, so '&rho;' was drawn as six characters on the canvas;
     (2) the regex was /&[a-z]+;/g \u2014 LOWERCASE ONLY \u2014 so '&Lambda;' and
         '&Delta;' could never have matched even once they were in the table.
   plain() now also strips tags, per the Known-bad list: canvas has no markup
   parser and '<sub>' is five characters. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026',
            '&alpha;':'\u03b1','&beta;':'\u03b2','&gamma;':'\u03b3','&delta;':'\u03b4',
            '&epsilon;':'\u03b5','&eta;':'\u03b7','&kappa;':'\u03ba','&lambda;':'\u03bb',
            '&mu;':'\u03bc','&nu;':'\u03bd','&pi;':'\u03c0','&rho;':'\u03c1',
            '&sigma;':'\u03c3','&tau;':'\u03c4','&phi;':'\u03c6','&omega;':'\u03c9',
            '&Gamma;':'\u0393','&Delta;':'\u0394','&Lambda;':'\u039b','&Pi;':'\u03a0',
            '&Sigma;':'\u03a3','&Phi;':'\u03a6','&Omega;':'\u03a9',
            '&plusmn;':'\u00b1','&ne;':'\u2260','&asymp;':'\u2248','&equiv;':'\u2261',
            '&prop;':'\u221d','&radic;':'\u221a','&infin;':'\u221e','&middot;':'\u00b7',
            '&rarr;':'\u2192','&larr;':'\u2190','&ell;':'\u2113','&sup2;':'\u00b2',
            '&sup3;':'\u00b3','&frac12;':'\u00bd','&le;':'\u2264','&ge;':'\u2265'};
function plain(s){
  return String(s).replace(/&[a-zA-Z][a-zA-Z0-9]*;/g,
                           m=>ENTS[m]!==undefined?ENTS[m]:m)
                  .replace(/<\/?[a-zA-Z][^>]*>/g,'');
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}

/* ================================================================== *
 *  3-D RENDERING                                                      *
 *                                                                     *
 *  Painter's algorithm over a face list.  Backface culling is by the   *
 *  OUTWARD normal, which for a convex solid centred on the origin is   *
 *  known rather than inferred from a winding order.                    *
 *                                                                     *
 *  Faces are premixed against the page background and drawn OPAQUE     *
 *  wherever possible: abutting canvas quads leave a sub-pixel gap that *
 *  antialiases into a stripe, the fix is to expand each quad about its *
 *  own centroid, and that fix composites twice (and so shows up as a   *
 *  BRIGHTER stripe) under globalAlpha < 1.  The expansion is therefore *
 *  applied only when alpha is 1.                                       *
 * ================================================================== */

const LIGHT=v3.norm([0.35,-0.55,0.75]);

function faceListOf(A,col,alpha,scale){
  const s=(scale===undefined?1:scale);
  const out=[];
  for(let i=0;i<A.F.length;i++){
    const f=A.F[i];
    const pl=facePlane(A.V,f);
    out.push({
      pts:f.map(k=>v3.mul(A.V[k],s)),
      n:pl.n, c:v3.mul(pl.c,s), col:col, alpha:(alpha===undefined?1:alpha),
      idx:i, nsides:f.length,
    });
  }
  return out;
}

function paintFaces(rc,cam,B,list,opt){
  opt=opt||{};
  const vis=[];
  for(const F of list){
    /* outward normal against the direction to the eye */
    const toEye=v3.sub(B.eye,F.c);
    if(opt.cull!==false && v3.dot(F.n,toEye)<=0) continue;
    const pp=F.pts.map(p=>project(cam,B,p));
    if(pp.some(p=>p===null)) continue;
    const d=v3.len(toEye);
    vis.push({F:F, pp:pp, d:d});
  }
  vis.sort((a,b)=>b.d-a.d);              /* far first */
  for(const V of vis){
    const F=V.F;
    const sh=clamp(0.36+0.64*Math.max(0,v3.dot(F.n,LIGHT)),0,1);
    const base=shade(F.col,sh);
    let pp=V.pp;
    if(F.alpha>=1 && opt.expand!==false){
      /* expand about the screen centroid to close antialiasing seams —
         only safe while opaque */
      let cx=0, cy=0;
      for(const p of pp){ cx+=p.x; cy+=p.y; }
      cx/=pp.length; cy/=pp.length;
      pp=pp.map(p=>({x:cx+(p.x-cx)*1.006, y:cy+(p.y-cy)*1.006, z:p.z}));
    }
    rc.beginPath();
    rc.moveTo(pp[0].x,pp[0].y);
    for(let i=1;i<pp.length;i++) rc.lineTo(pp[i].x,pp[i].y);
    rc.closePath();
    if(F.alpha>=1){ rc.fillStyle=base; }
    else { rc.fillStyle=rgba(toHex(base),F.alpha); }
    rc.fill();
    if(opt.edges!==false){
      rc.strokeStyle=opt.edgeCol||rgba('#070b18',0.55);
      rc.lineWidth=opt.edgeWidth||1;
      rc.stroke();
    }
  }
  return vis.length;
}
function toHex(c){
  const t=toRgb(c);
  return '#'+t.map(x=>('0'+x.toString(16)).slice(-2)).join('');
}

/* wireframe: every edge, no faces */
function paintWire(rc,cam,B,A,col,scale,lw){
  const s=(scale===undefined?1:scale);
  rc.strokeStyle=col; rc.lineWidth=lw||1.4;
  rc.beginPath();
  let n=0;
  for(const e of A.E){
    const a=project(cam,B,v3.mul(A.V[e[0]],s));
    const b=project(cam,B,v3.mul(A.V[e[1]],s));
    if(!a||!b) continue;
    rc.moveTo(a.x,a.y); rc.lineTo(b.x,b.y); n++;
  }
  rc.stroke();
  return n;
}

/* a sphere, drawn as its silhouette plus three great circles */
function paintSphere(rc,cam,B,r,col,alpha){
  const sil=[];
  /* the silhouette of a sphere seen from distance D is the circle of points
     with p . eyeDir = r^2 / D — a real circle in space, so project it */
  const D=v3.len(B.eye);
  if(D<=r) return 0;
  const ax=v3.mul(B.eye,1/D);
  const cr=r*Math.sqrt(1-(r/D)*(r/D));    /* radius of the silhouette circle */
  const cc=v3.mul(ax,r*r/D);              /* its centre                      */
  let u=v3.norm(v3.cross(ax,[0,0,1]));
  if(v3.len(v3.cross(ax,[0,0,1]))<1e-6) u=v3.norm(v3.cross(ax,[1,0,0]));
  const w=v3.cross(ax,u);
  rc.save();
  rc.strokeStyle=rgba(col,alpha===undefined?0.5:alpha);
  rc.lineWidth=1.2;
  rc.beginPath();
  let started=false;
  for(let i=0;i<=96;i++){
    const t=TAU*i/96;
    const p=v3.add(cc, v3.add(v3.mul(u,cr*Math.cos(t)), v3.mul(w,cr*Math.sin(t))));
    const q=project(cam,B,p);
    if(!q){ started=false; continue; }
    if(!started){ rc.moveTo(q.x,q.y); started=true; } else rc.lineTo(q.x,q.y);
  }
  rc.stroke();
  rc.restore();
  return 1;
}

/* a great circle with the given pole — used for the mirror planes */
function paintGreatCircle(rc,cam,B,pole,col,alpha,lw,dash){
  let u=v3.norm(v3.cross(pole,[0,0,1]));
  if(v3.len(v3.cross(pole,[0,0,1]))<1e-6) u=v3.norm(v3.cross(pole,[1,0,0]));
  const w=v3.cross(pole,u);
  rc.save();
  rc.strokeStyle=rgba(col,alpha===undefined?0.7:alpha);
  rc.lineWidth=lw||1.3;
  if(dash) rc.setLineDash(dash);
  rc.beginPath();
  let started=false, n=0;
  for(let i=0;i<=160;i++){
    const t=TAU*i/160;
    const p=v3.add(v3.mul(u,Math.cos(t)), v3.mul(w,Math.sin(t)));
    /* only the near hemisphere, so the circle reads as sitting on a ball */
    if(v3.dot(p,v3.norm(B.eye))<0){ started=false; continue; }
    const q=project(cam,B,p);
    if(!q){ started=false; continue; }
    if(!started){ rc.moveTo(q.x,q.y); started=true; } else { rc.lineTo(q.x,q.y); n++; }
  }
  rc.stroke();
  rc.setLineDash([]);
  rc.restore();
  return n;
}

/* a filled spherical triangle (the fundamental domain) */
function paintSphTriangle(rc,cam,B,A1,A2,A3,col,alpha){
  const arc=(p,q,n)=>{
    const out=[];
    for(let i=0;i<=n;i++){
      const t=i/n;
      out.push(v3.norm([p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t, p[2]+(q[2]-p[2])*t]));
    }
    return out;
  };
  const pts=arc(A1,A2,14).concat(arc(A2,A3,14)).concat(arc(A3,A1,14));
  const cen=v3.norm(v3.add(v3.add(A1,A2),A3));
  if(v3.dot(cen,v3.norm(B.eye))<0) return 0;
  const pp=pts.map(p=>project(cam,B,v3.mul(p,1.001)));
  if(pp.some(p=>p===null)) return 0;
  rc.save();
  rc.fillStyle=rgba(col,alpha===undefined?0.16:alpha);
  rc.beginPath();
  rc.moveTo(pp[0].x,pp[0].y);
  for(let i=1;i<pp.length;i++) rc.lineTo(pp[i].x,pp[i].y);
  rc.closePath();
  rc.fill();
  rc.strokeStyle=rgba(col,0.85); rc.lineWidth=1.6; rc.stroke();
  rc.restore();
  return 1;
}

function paintPoint(rc,cam,B,p,col,r,label){
  const q=project(cam,B,p);
  if(!q) return 0;
  rc.save();
  rc.fillStyle=col;
  rc.beginPath(); rc.arc(q.x,q.y,r||4,0,TAU); rc.fill();
  rc.strokeStyle=rgba('#070b18',0.8); rc.lineWidth=1; rc.stroke();
  if(label){
    rc.fillStyle='#cfd4de';
    rc.font='11px -apple-system, sans-serif';
    rc.textAlign='left'; rc.textBaseline='bottom';
    rc.fillText(plain(label), q.x+7, q.y-4);
  }
  rc.restore();
  return 1;
}

/* Fit the camera distance so a solid of circumradius R fills `frac` of the
   frame.  Derived from the camera, never from a hardcoded divisor: f is
   proportional to the canvas height, so a divisor tuned at one size is wrong
   at another.

   The silhouette of a ball of radius R at distance D is not the ball's near
   point; it is the circle where the tangent cone touches, and its projected
   half-width is exactly f R / sqrt(D^2 - R^2).  Setting that equal to `want`
   inverts in closed form.  The obvious f R / (D - R) is the near-point
   approximation, and it framed every solid at 0.82 of the size it claimed. */
function fitDist(cam,R,frac){
  const f=(cam.H/2)/Math.tan(cam.fov/2);
  const want=(frac||0.42)*Math.min(cam.W,cam.H);
  return R*Math.sqrt(1+(f/want)*(f/want));
}

/* ================================================================== *
 *  VIEW: the compass                                                  *
 * ================================================================== */
function drawCompass(rc,W,H,M,S){
  const COL={mirror:'#5ac8e0', gold:'#d8b45a', face:'#b8ec4c',
             seed:'#cd35c4', dual:'#e8843a'};
  const C=M.con;
  /* lay the stage out from the bottom up so the caption cannot collide */
  const capW=Math.min(W-320, 560);
  const say=C.steps[M.step].say;
  const lines=wrapText(rc,plain(say),capW,'12.5px -apple-system, sans-serif');
  const capH=lines.length*17+14;
  const noteH=26;
  const bot=H-capH-noteH-10;
  /* fit the UNIT circle so that the widest compass arc still lands on the
     stage: conExtent() reports how far the construction really reaches */
  const ext=conExtent(C);
  const half=Math.min((bot-56)/2, (W-330)/2);
  const R=half/ext;
  const cx=Math.max(half+24, (W-300)/2), cy=44+half;
  const X=p=>cx+p[0]*R, Y=p=>cy-p[1]*R;

  /* every step up to and including the current one, earlier ones dimmed */
  for(let s=0;s<=M.step;s++){
    const cur=(s===M.step);
    const a=cur?1:0.28;
    for(const d of (C.steps[s].draw||[])){
      const col=COL[d.col||'gold']||COL.gold;
      if(d.k==='circle'){
        rc.save();
        rc.strokeStyle=rgba(col,a*(d.col==='mirror'?0.9:0.62));
        rc.lineWidth=d.col==='mirror'?1.5:1.1;
        if(!cur) rc.setLineDash([3,3]);
        rc.beginPath(); rc.arc(X(d.c),Y(d.c),d.r*R,0,TAU); rc.stroke();
        rc.restore();
      } else if(d.k==='seg'){
        rc.save();
        rc.strokeStyle=rgba(col,a*0.95);
        rc.lineWidth=d.thick?2.2:1.4;
        rc.beginPath(); rc.moveTo(X(d.a),Y(d.a)); rc.lineTo(X(d.b),Y(d.b)); rc.stroke();
        rc.restore();
      } else if(d.k==='pt'){
        rc.save();
        rc.fillStyle=rgba(d.hi?COL.face:COL.gold, a);
        rc.beginPath(); rc.arc(X(d.p),Y(d.p),d.hi?4.2:3.2,0,TAU); rc.fill();
        if(d.name && cur){
          rc.fillStyle='#cfd4de';
          rc.font='11.5px -apple-system, sans-serif';
          rc.textAlign='left'; rc.textBaseline='bottom';
          rc.fillText(plain(d.name), X(d.p)+6, Y(d.p)-5);
        }
        rc.restore();
      } else if(d.k==='poly'){
        rc.save();
        const pc=COL[d.col||'face']||COL.face;
        rc.strokeStyle=rgba(pc,d.dash?0.8:1);
        rc.lineWidth=d.thin?1.2:2.4;
        if(d.dash) rc.setLineDash([6,5]);
        rc.beginPath();
        rc.moveTo(X(d.pts[0]),Y(d.pts[0]));
        for(let i=1;i<d.pts.length;i++) rc.lineTo(X(d.pts[i]),Y(d.pts[i]));
        rc.closePath();
        if(!d.dash && !d.thin){ rc.fillStyle=rgba(pc,0.10); rc.fill(); }
        rc.stroke();
        rc.setLineDash([]);
        rc.restore();
      } else if(d.k==='lbl' && cur){
        rc.save();
        rc.fillStyle='#aeb6c6';
        rc.font='italic 12px Georgia, serif';
        rc.textAlign='center'; rc.textBaseline='bottom';
        rc.fillText(plain(d.t), X(d.p), Y(d.p));
        rc.restore();
      }
    }
  }
  /* centre mark */
  rc.save();
  rc.fillStyle='#8b93a6';
  rc.beginPath(); rc.arc(cx,cy,2.4,0,TAU); rc.fill();
  rc.font='11px -apple-system, sans-serif';
  rc.textAlign='right'; rc.textBaseline='top';
  rc.fillText('O', cx-5, cy+3);
  rc.restore();

  /* step caption, laid out from the measured height */
  rc.save();
  rc.fillStyle='#cfd4de';
  rc.font='12.5px -apple-system, sans-serif';
  rc.textAlign='left'; rc.textBaseline='top';
  let yy=H-capH-noteH;
  rc.fillStyle='#9aa2b4';
  rc.font='italic 12px Georgia, serif';
  rc.fillText('step '+(M.step+1)+' of '+M.nsteps, 22, yy-19);
  rc.fillStyle='#cfd4de';
  rc.font='12.5px -apple-system, sans-serif';
  for(const L of lines){ rc.fillText(L, 22, yy); yy+=17; }
  rc.fillStyle='#767e92';
  rc.font='11px -apple-system, sans-serif';
  rc.fillText(plain(M.constructible
      ? 'Every face of every solid in this file is a polygon the compass can reach.'
      : 'Not constructible — and no uniform polyhedron asks for it.'), 22, yy+5);
  rc.restore();
  return {cx:cx, cy:cy, R:R};
}

/* ================================================================== *
 *  VIEW: the five                                                     *
 * ================================================================== */
function drawFive(rc,W,H,M,S,cam,B){
  const A=M.solid;
  const R=A.R;
  /* the solid, inside the sphere Euclid inscribes it in */
  if(S.showSphere) paintSphere(rc,cam,B,R,'#39404f',0.55);
  const list=faceListOf(A,'#b8ec4c',S.faces?1:0);
  let nf=0;
  if(S.faces) nf=paintFaces(rc,cam,B,list,{edgeCol:rgba('#070b18',0.6)});
  if(S.wire||!S.faces) paintWire(rc,cam,B,A,rgba('#b8ec4c',S.faces?0.35:0.95),1,1.3);

  /* one edge and one diameter, drawn and labelled — this is the content of
     XIII.13-17 and the reason a/d is on the readout */
  if(S.showEuclid){
    const e=A.E[0];
    const p=A.V[e[0]], q=A.V[e[1]];
    const pa=project(cam,B,p), pb=project(cam,B,q);
    if(pa&&pb){
      rc.save();
      rc.strokeStyle='#cd35c4'; rc.lineWidth=3;
      rc.beginPath(); rc.moveTo(pa.x,pa.y); rc.lineTo(pb.x,pb.y); rc.stroke();
      rc.fillStyle='#cd35c4';
      rc.font='italic 13px Georgia, serif';
      rc.textAlign='center'; rc.textBaseline='bottom';
      rc.fillText('a', (pa.x+pb.x)/2, (pa.y+pb.y)/2-6);
      rc.restore();
    }
    /* the diameter, drawn across the sphere perpendicular to the view so it
       shows at true length rather than foreshortened to nothing */
    const ax=v3.norm(v3.cross(B.fwd,[0,0,1]));
    const d1=project(cam,B,v3.mul(ax,R)), d2=project(cam,B,v3.mul(ax,-R));
    if(d1&&d2){
      rc.save();
      rc.strokeStyle=rgba('#e8843a',0.9); rc.lineWidth=1.8;
      rc.setLineDash([7,5]);
      rc.beginPath(); rc.moveTo(d1.x,d1.y); rc.lineTo(d2.x,d2.y); rc.stroke();
      rc.setLineDash([]);
      rc.fillStyle='#e8843a';
      rc.font='italic 13px Georgia, serif';
      rc.textAlign='center'; rc.textBaseline='top';
      rc.fillText('d', (d1.x+d2.x)/2, (d1.y+d2.y)/2+5);
      rc.restore();
    }
  }

  /* the XIII.18 strip along the bottom: the five edges in order.  Euclid
     ends Book XIII by setting them side by side and proving no sixth solid
     can exist. */
  const bh=52, by=H-bh-10;
  const bw=Math.min(W-330, 520), bx=22;
  rc.save();
  rc.fillStyle='#8b93a6';
  rc.font='italic 12px Georgia, serif';
  rc.textAlign='left'; rc.textBaseline='bottom';
  rc.fillText(plain('XIII.18 — the five edges in one sphere, least first'), bx, by-6);
  const maxad=M.five[M.five.length-1].ad;
  for(let i=0;i<M.five.length;i++){
    const f=M.five[i];
    const x=bx+i*(bw/5);
    const w=(bw/5)-14;
    const hgt=(bh-20)*f.ad/maxad;
    const on=(f.name===A.name);
    rc.fillStyle=on?'#b8ec4c':'#2a2f3d';
    rc.fillRect(x, by+(bh-20)-hgt+8, w, hgt);
    rc.fillStyle=on?'#cfd4de':'#6f7789';
    rc.font='9.5px -apple-system, sans-serif';
    rc.textAlign='left'; rc.textBaseline='top';
    rc.fillText(f.name, x, by+bh-9);
    rc.textBaseline='bottom';
    rc.fillText(fmt(f.ad,4), x, by+(bh-20)-hgt+5);
  }
  rc.restore();
  return nf;
}

/* ================================================================== *
 *  VIEW: the mirrors                                                  *
 * ================================================================== */

/* barycentric coordinates of a seed against the triangle corners, so the
   flat inset can show WHERE in the fundamental domain each solid lives */
function baryOf(K,p){
  const M=[[K.A[0],K.B[0],K.C[0]],
           [K.A[1],K.B[1],K.C[1]],
           [K.A[2],K.B[2],K.C[2]]];
  const w=mulMV(inv3(M),p);
  const s=w[0]+w[1]+w[2];
  return [w[0]/s, w[1]/s, w[2]/s];
}

function drawMirrors(rc,W,H,M,S,cam,B){
  const R=M.mir, K=R.corners, N=R.N;
  /* the ball everything lives on */
  paintSphere(rc,cam,B,1,'#39404f',0.5);
  /* The mirrors, the triangle, the seed and the orbit are drawn AFTER the
     solid, not before it.  The solid's vertices sit on this sphere, so an
     opaque solid hides every one of them — geometrically correct and useless,
     since the construction is the entire subject of this view.  Everything
     structural therefore goes on top, and paintGreatCircle already restricts
     itself to the near hemisphere so the arcs still read as lying on a ball. */
  if(R.A){
    if(S.faces) paintFaces(rc,cam,B,faceListOf(R.A,'#b8ec4c',1),
                           {edgeCol:rgba('#070b18',0.6)});
    if(S.wire||!S.faces)
      paintWire(rc,cam,B,R.A,rgba('#b8ec4c',S.faces?0.35:0.95),1,1.3);
  } else {
    /* not a polyhedron — say so rather than draw nothing */
    rc.save();
    rc.fillStyle='#e8843a';
    rc.font='italic 14px Georgia, serif';
    rc.textAlign='center'; rc.textBaseline='middle';
    rc.fillText(plain('this seed does not give a polyhedron'), (W-300)/2, H/2);
    rc.restore();
  }
  if(S.showMirrors){
    for(let i=0;i<3;i++)
      paintGreatCircle(rc,cam,B,N[i],'#5ac8e0',R.active[i]?0.85:0.35,
                       R.active[i]?1.8:1.1, R.active[i]?null:[4,4]);
  }
  if(S.showTriangle){
    paintSphTriangle(rc,cam,B,K.A,K.B,K.C,'#5ac8e0',0.20);
  }
  if(S.showOrbit){
    for(const p of R.V) paintPoint(rc,cam,B,p,rgba('#cd35c4',0.55),2.6);
  }
  if(S.showSeed){
    paintPoint(rc,cam,B,R.seed,'#cd35c4',5.5,'seed');
    /* the seed's perpendicular to each ACTIVE mirror: the edge it makes */
    for(let i=0;i<3;i++){
      if(!R.active[i]) continue;
      const foot=v3.sub(R.seed, v3.mul(N[i], v3.dot(R.seed,N[i])));
      const a=project(cam,B,R.seed), b=project(cam,B,foot);
      if(a&&b){
        rc.save();
        rc.strokeStyle=rgba('#cd35c4',0.75); rc.lineWidth=1.4;
        rc.setLineDash([3,3]);
        rc.beginPath(); rc.moveTo(a.x,a.y); rc.lineTo(b.x,b.y); rc.stroke();
        rc.setLineDash([]);
        rc.restore();
      }
    }
  }
  /* say what the drawing is doing that the geometry does not: the mirrors and
     the seed are painted over the solid rather than occluded by it */
  {
    const capW=Math.min(W-560,520);
    const lines=wrapText(rc, plain(
      'The mirrors, the triangle and the seed are drawn OVER the solid. Every '
      + 'vertex of the orbit lies on this sphere, so an opaque solid would hide '
      + 'the whole construction; the arcs shown are the near hemisphere only.'),
      capW, '11px -apple-system, sans-serif');
    rc.save();
    rc.fillStyle='#6f7789';
    rc.font='11px -apple-system, sans-serif';
    rc.textAlign='left'; rc.textBaseline='top';
    let yy=H-lines.length*15-14;
    for(const L of lines){ rc.fillText(L,240,yy); yy+=15; }
    rc.restore();
  }
  drawTriangleInset(rc,W,H,M,S);
  return 1;
}

/* the flat map of the fundamental domain: where the seven solids live */
function drawTriangleInset(rc,W,H,M,S){
  const R=M.mir, K=R.corners, G=R.G;
  const w=196, hh=190;
  /* bottom LEFT: the readout panel owns the top right of the stage */
  const x0=20, y0=H-hh-16;
  rc.save();
  rc.fillStyle=rgba('#0a0c12',0.82);
  rc.strokeStyle='#2a2f3d'; rc.lineWidth=1;
  rc.beginPath(); rc.rect(x0,y0,w,hh); rc.fill(); rc.stroke();
  /* the triangle, drawn flat */
  /* the apex sits at +44, not +30: its "p-fold" label is drawn ABOVE it with
     a bottom baseline, and at +30 that label ran into the inset's own title.
     Caught by tools/audit.py, which is the only thing that can see it. */
  const PA=[x0+w/2, y0+44], PB=[x0+26, y0+hh-30], PC=[x0+w-26, y0+hh-30];
  const at=b=>[b[0]*PA[0]+b[1]*PB[0]+b[2]*PC[0],
               b[0]*PA[1]+b[1]*PB[1]+b[2]*PC[1]];
  rc.strokeStyle='#5ac8e0'; rc.lineWidth=1.5;
  rc.beginPath(); rc.moveTo(PA[0],PA[1]); rc.lineTo(PB[0],PB[1]);
  rc.lineTo(PC[0],PC[1]); rc.closePath();
  rc.fillStyle=rgba('#5ac8e0',0.07); rc.fill(); rc.stroke();
  /* the seven subset seeds */
  rc.font='9.5px -apple-system, sans-serif';
  for(let i=0;i<WSUBSETS.length;i++){
    const sp=wythoffSeed(N_of(R),WSUBSETS[i]);
    const b=baryOf(K,sp), p=at(b);
    const on=(!S.freeSeed && !S.snub && S.wsub===i);
    rc.fillStyle=on?'#b8ec4c':rgba('#8b93a6',0.75);
    rc.beginPath(); rc.arc(p[0],p[1],on?4.5:3,0,TAU); rc.fill();
  }
  /* the snub seed sits off every bisector — that is the whole point */
  try{
    const ss=snubSeed(N_of(R),G.p,G.q,G.r);
    const b=baryOf(K,ss), p=at(b);
    rc.fillStyle=S.snub?'#e8843a':rgba('#e8843a',0.6);
    rc.beginPath(); rc.arc(p[0],p[1],S.snub?4.5:3,0,TAU); rc.fill();
  }catch(e){}
  /* the live seed */
  const b=baryOf(K,R.seed), p=at(b);
  rc.fillStyle='#cd35c4';
  rc.beginPath(); rc.arc(p[0],p[1],4,0,TAU); rc.fill();
  rc.strokeStyle='#070b18'; rc.lineWidth=1; rc.stroke();
  /* corner labels */
  rc.fillStyle='#8b93a6';
  rc.font='10px -apple-system, sans-serif';
  rc.textAlign='center'; rc.textBaseline='bottom';
  rc.fillText(G.p+'-fold', PA[0], PA[1]-5);
  rc.textBaseline='top';
  rc.fillText(G.q+'-fold', PB[0], PB[1]+5);
  rc.fillText('2-fold', PC[0], PC[1]+5);
  rc.fillStyle='#aeb6c6';
  rc.font='italic 11px Georgia, serif';
  rc.textAlign='left'; rc.textBaseline='top';
  rc.fillText(plain('the fundamental domain'), x0+9, y0+7);
  rc.restore();
}
function N_of(R){ return R.N; }

/* ================================================================== *
 *  VIEW: the archimedeans / the catalans                              *
 * ================================================================== */
function drawGallery(rc,W,H,M,S,cam,B,which){
  const cat=(which==='catalan');
  const A=cat?M.dual:M.solid;
  const col=cat?'#e8843a':'#b8ec4c';
  let nf=0;
  if(S.faces) nf=paintFaces(rc,cam,B,faceListOf(A,col,1),
                            {edgeCol:rgba('#070b18',0.62)});
  if(S.wire||!S.faces)
    paintWire(rc,cam,B,A,rgba(col,S.faces?0.35:0.95),1,1.3);

  /* the family strip: all thirteen, current one lit */
  const key=cat?(a=>buildDual(CATALAN_OF[a]).dihMean*RAD)
                :(a=>buildSolid(a).nV);
  /* sort by the quantity the caption names, or the strip claims an ordering
     it does not have */
  const names=(cat?CATALANS:ARCH).slice().sort((a,b)=>key(a)-key(b));
  const cur=cat?S.cat:S.arch;
  const bw=Math.min(W-330, 560), bx=22, bh=46, by=H-bh-12;
  const vals=names.map(key);
  const vmax=Math.max.apply(null,vals), vmin=Math.min.apply(null,vals);
  rc.save();
  rc.fillStyle='#8b93a6';
  rc.font='italic 11.5px Georgia, serif';
  rc.textAlign='left'; rc.textBaseline='bottom';
  rc.fillText(plain(cat?'the thirteen Catalan solids, by dihedral angle'
                       :'the thirteen Archimedean solids, by vertex count'),
              bx, by-5);
  for(let i=0;i<names.length;i++){
    const x=bx+i*(bw/13), ww=(bw/13)-4;
    const t=(vals[i]-vmin)/((vmax-vmin)||1);
    const hgt=6+(bh-16)*t;
    const on=(names[i]===cur);
    rc.fillStyle=on?col:'#2a2f3d';
    rc.fillRect(x, by+bh-hgt-9, ww, hgt);
    if(on){
      rc.fillStyle='#cfd4de';
      rc.font='10px -apple-system, sans-serif';
      rc.textAlign='left'; rc.textBaseline='bottom';
      rc.fillText(cat?fmt(vals[i],1)+'°':String(vals[i]),
                  x, by+bh-hgt-11);
    }
  }
  rc.fillStyle='#6f7789';
  rc.font='10px -apple-system, sans-serif';
  rc.textAlign='left'; rc.textBaseline='top';
  rc.fillText(plain(cur), bx, by+bh-6);
  rc.restore();
  return nf;
}

/* ================================================================== *
 *  VIEW: duality                                                      *
 * ================================================================== */
function drawDuality(rc,W,H,M,S,cam,B){
  const A=M.solid, D=M.dual;
  /* both are scaled to unit edge on their own; rescale the dual so the two
     really do share the midsphere the reciprocation was taken about */
  const s=A.rmid/D.rmid;
  const t=clamp(S.morph,0,1);
  if(S.showMid) paintSphere(rc,cam,B,A.rmid,'#39404f',0.7);

  /* Merge both face lists and depth-sort them TOGETHER: two interpenetrating
     convex solids painted one after the other would put the whole of one in
     front of the whole of the other. */
  /* Dip the face alpha in the middle.  With both solids at 0.58 the compound
     composited to an even murk and the edges — which are what shows the
     right-angle crossing — were lost in it.  The dip is 1 at either end, so
     the single-solid cases stay solid. */
  const dip=1-0.5*4*t*(1-t);
  let list=[];
  if(t<0.999) list=list.concat(faceListOf(A,'#b8ec4c',(1-t*0.85)*dip));
  if(t>0.001) list=list.concat(faceListOf(D,'#e8843a',(0.15+t*0.85)*dip,s));
  const nf=paintFaces(rc,cam,B,list,{edgeCol:rgba('#070b18',0.5)});
  /* wireframes keep both readable where the alpha is low */
  if(t>0.05) paintWire(rc,cam,B,D,rgba('#e8843a',0.30+0.6*t),s,1.3);
  if(t<0.95) paintWire(rc,cam,B,A,rgba('#b8ec4c',0.30+0.6*(1-t)),1,1.3);

  /* one primal edge and the dual edge that crosses it, at right angles */
  const e=A.E[0];
  const owner=[];
  for(let k=0;k<A.F.length;k++) if(A.F[k].indexOf(e[0])>=0 && A.F[k].indexOf(e[1])>=0) owner.push(k);
  if(owner.length===2){
    const p1=project(cam,B,A.V[e[0]]), p2=project(cam,B,A.V[e[1]]);
    const q1=project(cam,B,v3.mul(D.V[owner[0]],s)),
          q2=project(cam,B,v3.mul(D.V[owner[1]],s));
    rc.save();
    if(p1&&p2){ rc.strokeStyle='#b8ec4c'; rc.lineWidth=3;
      rc.beginPath(); rc.moveTo(p1.x,p1.y); rc.lineTo(p2.x,p2.y); rc.stroke(); }
    if(q1&&q2){ rc.strokeStyle='#e8843a'; rc.lineWidth=3;
      rc.beginPath(); rc.moveTo(q1.x,q1.y); rc.lineTo(q2.x,q2.y); rc.stroke(); }
    rc.restore();
  }
  /* the caption states the two facts the picture is making */
  rc.save();
  const capW=Math.min(W-330,520);
  const lines=wrapText(rc, plain(
    'Every edge of the green solid and the orange edge that replaces it cross '
    + 'at right angles, and both touch the grey midsphere at the same point. '
    + 'That is what makes this the canonical dual rather than merely a solid '
    + 'with the right counts.'), capW, '11.5px -apple-system, sans-serif');
  rc.fillStyle='#8b93a6';
  rc.font='11.5px -apple-system, sans-serif';
  rc.textAlign='left'; rc.textBaseline='top';
  let yy=H-lines.length*16-14;
  for(const L of lines){ rc.fillText(L,22,yy); yy+=16; }
  rc.restore();
  return nf;
}

/* ================================================================== *
 *  DISPATCH                                                           *
 * ================================================================== */
function drawView(rc,W,H,M,S){
  rc.save();
  rc.fillStyle='#070b18';
  rc.fillRect(0,0,W,H);
  rc.restore();
  if(S.view==='compass'){ drawCompass(rc,W,H,M,S); return; }

  const cam=S.cam;
  cam.W=W; cam.H=H;
  /* frame from the object actually on screen, and from the camera, never
     from a divisor tuned at one canvas size */
  let Rf=1.2;
  if(S.view==='mirrors') Rf=1.25;
  else if(S.view==='duality') Rf=Math.max(M.solid.R, M.dual.R*(M.solid.rmid/M.dual.rmid));
  else if(S.view==='catalan') Rf=M.dual.R;
  else if(M.solid) Rf=M.solid.R;
  cam.dist=fitDist(cam,Rf,0.40)/clamp(S.zoom,0.4,3);
  const B=camBasis(cam);

  if(S.view==='five')     drawFive(rc,W,H,M,S,cam,B);
  else if(S.view==='mirrors') drawMirrors(rc,W,H,M,S,cam,B);
  else if(S.view==='arch')    drawGallery(rc,W,H,M,S,cam,B,'arch');
  else if(S.view==='catalan') drawGallery(rc,W,H,M,S,cam,B,'catalan');
  else if(S.view==='duality') drawDuality(rc,W,H,M,S,cam,B);
}

/* ================================================================== *
 *  SCENE                                                             *
 * ================================================================== */
function makeScene(){
  const S=makeState();
  let cache=null, cacheKey='';
  function model(){
    const k=[S.view,S.ngon,S.step,S.plat,S.group,S.wsub,S.snub,S.freeSeed,
             fmt(S.seedU,6),fmt(S.seedV,6),S.arch,S.dualPair,S.cat].join('|');
    if(k!==cacheKey){ cache=buildModel(S); cacheKey=k; }
    return cache;
  }
  return {
    S:S,
    model:model,
    invalidate(){ cacheKey=''; },
    reset(){
      const D=makeState();
      for(const k in D) if(k!=='cam') S[k]=D[k];
      S.cam.theta=CAM0.theta; S.cam.phi=CAM0.phi; S.cam.dist=CAM0.dist;
      cacheKey='';
    },
    resetCam(){ S.cam.theta=CAM0.theta; S.cam.phi=CAM0.phi; S.zoom=1; },
    drag(dx,dy){
      S.cam.theta-=dx*0.0075;
      S.cam.phi=clamp(S.cam.phi+dy*0.0060,-1.45,1.45);
    },
    wheel(d){ S.zoom=clamp(S.zoom*(d>0?0.93:1.075),0.4,3); },
    tick(dt){ if(S.spin){ S.cam.theta+=dt*0.28; return true; } return false; },
  };
}

/* ================================================================== *
 *  BOOT                                                               *
 * ================================================================== */
function boot(){
  const cv=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabs=document.getElementById('tabs');
  const readout=document.getElementById('readout');
  const eqbar=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hint=document.getElementById('hint');
  const errbox=document.getElementById('errbox');
  const SC=makeScene(), S=SC.S;
  let dirty=true, last=0;

  function fail(e){
    errbox.style.display='block';
    errbox.textContent=String(e&&e.stack||e);
  }

  /* ---- controls ---- */
  /* Read the control through the closure, never through e.target: the
     headless DOM stub fires handlers with a synthetic event that carries no
     target, so an e.target.value here would throw under the harness and be
     untestable in exactly the place testing matters. */
  function slider(label,key,lo,hi,stp,fmtf,enabled){
    const val=h('span',{class:'val'});
    const inp=h('input',{type:'range',min:lo,max:hi,step:stp,value:S[key]});
    inp.addEventListener('input',()=>{
      S[key]=parseFloat(inp.value); SC.invalidate();
      val.textContent=fmtf(S[key]); refresh(); });
    if(enabled===false){ inp.disabled=true; inp.setAttribute('disabled','disabled'); }
    val.textContent=fmtf(S[key]);
    const row=h('div',{class:'sliderrow'},h('label',null,label),inp,val);
    if(enabled===false) row.style.opacity='0.42';
    return row;
  }
  /* `rebuild` is for the toggles that change which OTHER controls are live —
     without it, switching the free seed off leaves its two sliders enabled
     but ignored, and a live control that is ignored is worse than none. */
  function checkbox(label,key,rebuild){
    const inp=h('input',{type:'checkbox'});
    inp.type='checkbox';
    if(S[key]) inp.setAttribute('checked','checked');
    inp.checked=!!S[key];
    inp.addEventListener('change',()=>{
      S[key]=!!inp.checked; SC.invalidate();
      if(rebuild) syncPanel();
      refresh(); });
    return h('label',null,inp,document.createTextNode(label));
  }
  function chipRow(items,key,onpick){
    const wrap=h('div',{class:'chips'});
    items.forEach(it=>{
      const v=(it.v!==undefined?it.v:it);
      const lab=(it.l!==undefined?it.l:String(it));
      const c=h('div',{class:'chip'+(S[key]===v?' on':'')},lab);
      c.addEventListener('click',()=>{ S[key]=v; if(onpick) onpick(v);
                                       SC.invalidate(); syncPanel(); refresh(); });
      wrap.appendChild(c);
    });
    return wrap;
  }
  function grp(title){
    const g=h('div',{class:'grp'});
    if(title) g.appendChild(h('h3',null,title));
    for(let i=1;i<arguments.length;i++) if(arguments[i]) g.appendChild(arguments[i]);
    return g;
  }

  function syncPanel(){
    panel.innerHTML='';
    if(S.view==='compass'){
      panel.appendChild(grp('polygon',
        chipRow(NGONS.map(n=>({v:n,l:ngonName(n)})),'ngon',
                ()=>{ S.step=99; })));
      const M=buildModel(S);
      panel.appendChild(grp('construction',
        slider('step','step',0,M.nsteps-1,1,v=>((v|0)+1)+' / '+M.nsteps)));
    } else if(S.view==='five'){
      panel.appendChild(grp('solid', chipRow(PLATONIC,'plat')));
      panel.appendChild(grp('show', h('div',{class:'checks'},
        checkbox('circumscribed sphere','showSphere'),
        checkbox('the edge and the diameter','showEuclid'),
        checkbox('faces','faces'), checkbox('edges','wire'),
        checkbox('turn','spin'))));
    } else if(S.view==='mirrors'){
      panel.appendChild(grp('symmetry group', chipRow(
        [{v:'tet',l:'(3 3 2)'},{v:'oct',l:'(4 3 2)'},{v:'ico',l:'(5 3 2)'}],
        'group', ()=>{ S.freeSeed=false; })));
      const subs=WSUBSETS.map((w,i)=>({v:i,
        l:w.map((x,j)=>x?(j+1):'').filter(Boolean).join('')}));
      panel.appendChild(grp('active mirrors', chipRow(subs,'wsub',
        ()=>{ S.snub=false; S.freeSeed=false; })));
      panel.appendChild(grp('or', h('div',{class:'checks'},
        checkbox('snub (rotations only)','snub',true),
        checkbox('move the seed freely','freeSeed',true))));
      panel.appendChild(grp('seed position',
        slider('toward '+GROUPS[S.group].p+'-fold','seedU',0.01,0.98,0.005,
               v=>fmt(v,3), S.freeSeed),
        slider('toward '+GROUPS[S.group].q+'-fold','seedV',0.01,0.98,0.005,
               v=>fmt(v,3), S.freeSeed)));
      panel.appendChild(grp('show', h('div',{class:'checks'},
        checkbox('mirrors','showMirrors'), checkbox('the triangle','showTriangle'),
        checkbox('the seed','showSeed'), checkbox('the orbit','showOrbit'),
        checkbox('faces','faces'), checkbox('turn','spin'))));
    } else if(S.view==='arch'){
      panel.appendChild(grp('solid', chipRow(ARCH,'arch')));
      panel.appendChild(grp('show', h('div',{class:'checks'},
        checkbox('faces','faces'), checkbox('edges','wire'),
        checkbox('turn','spin'))));
    } else if(S.view==='duality'){
      panel.appendChild(grp('solid', chipRow(
        CATALOGUE.map(c=>c.name),'dualPair')));
      /* a literal arrow, not "&rarr;": this label goes through
         createTextNode, which does not parse entities */
      panel.appendChild(grp('morph',
        slider('primal → dual','morph',0,1,0.01,v=>fmt(v,2))));
      panel.appendChild(grp('show', h('div',{class:'checks'},
        checkbox('the midsphere','showMid'),
        checkbox('faces','faces'), checkbox('turn','spin'))));
    } else {
      panel.appendChild(grp('solid', chipRow(CATALANS,'cat')));
      panel.appendChild(grp('show', h('div',{class:'checks'},
        checkbox('faces','faces'), checkbox('edges','wire'),
        checkbox('turn','spin'))));
    }
    panel.appendChild(grp(null, h('div',{class:'btnrow'},
      h('button',{onclick:()=>{ SC.resetCam(); dirty=true; refresh(); }},'reset view'),
      h('button',{onclick:()=>{ SC.reset(); syncPanel(); dirty=true; refresh(); }},'reset all'))));
    panel.appendChild(h('div',{id:'info',html:INFO[S.view]}));
    panel.appendChild(h('div',{class:'src',html:
      'Constructed in-file from the Coxeter diagrams (3&nbsp;3&nbsp;2), '
     +'(4&nbsp;3&nbsp;2), (5&nbsp;3&nbsp;2). No coordinate table is used. '
     +'Reference values re-derived independently in '
     +'build_polyhedra/ (numpy&nbsp;+&nbsp;scipy).'}));
  }

  function buildTabs(){
    tabs.innerHTML='';
    VIEWS.forEach(v=>{
      const b=h('button',{class:S.view===v?'active':''},VLABEL[v]);
      b.addEventListener('click',()=>{ S.view=v; SC.invalidate();
        buildTabs(); syncPanel(); dirty=true; refresh(); });
      tabs.appendChild(b);
    });
  }

  function refresh(){
    try{
      const M=SC.model();
      readout.innerHTML=readoutHTML(S,M);
      eqbar.innerHTML=eqbarHTML(S,M);
      tagEl.innerHTML=tagHTML(S,M);
      hint.textContent=(S.view==='compass')
        ? 'step through the construction with the slider'
        : 'drag to turn · scroll to zoom';
      errbox.style.display='none';
    }catch(e){ fail(e); }
    /* draw straight away rather than only marking dirty, so a tab click or a
       slider move paints synchronously.  The frame loop's dirty flag is left
       CLEAR here on purpose: it exists for the pointer and wheel handlers,
       and a repaint test is only meaningful against a proven-quiet loop. */
    dirty=false;
    draw();
  }

  function resize(){
    const r=cv.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    cv.width=Math.max(1,Math.round(r.width*dpr));
    cv.height=Math.max(1,Math.round(r.height*dpr));
    cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    dirty=true;
  }

  /* fetch the context per draw, as the sibling sims do — the headless harness
     swaps its recorder between captures, and a context cached at boot would
     keep writing into the one it happened to see first */
  function draw(){
    try{
      const rc=cv.getContext('2d');
      const r=cv.getBoundingClientRect();
      drawView(rc,r.width,r.height,SC.model(),S);
    }catch(e){ fail(e); }
  }

  function frame(ts){
    const dt=last?Math.min((ts-last)/1000,0.05):0;
    last=ts;
    if(SC.tick(dt)) dirty=true;
    if(dirty){ dirty=false; draw(); }
    window.requestAnimationFrame(frame);
  }

  /* pointer + wheel MUST set dirty, or the camera moves and nothing repaints */
  let dragging=false, px=0, py=0;
  cv.addEventListener('pointerdown',e=>{ dragging=true; px=e.clientX; py=e.clientY;
    cv.classList.add('dragging'); if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{
    if(!dragging) return;
    SC.drag(e.clientX-px, e.clientY-py);
    px=e.clientX; py=e.clientY;
    dirty=true;
  });
  cv.addEventListener('pointerup',e=>{ dragging=false; cv.classList.remove('dragging'); });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); SC.wheel(e.deltaY); dirty=true; },
                      {passive:false});
  window.addEventListener('keydown',e=>{
    const i=VIEWS.indexOf(S.view);
    if(e.key==='['||e.key==='ArrowLeft'){ S.view=VIEWS[(i+VIEWS.length-1)%VIEWS.length]; }
    else if(e.key===']'||e.key==='ArrowRight'){ S.view=VIEWS[(i+1)%VIEWS.length]; }
    else if(e.key==='r'||e.key==='R'){ SC.resetCam(); }
    else return;
    SC.invalidate(); buildTabs(); syncPanel(); dirty=true; refresh();
  });
  window.addEventListener('resize',resize);

  buildTabs(); syncPanel(); resize(); refresh();
  window.requestAnimationFrame(frame);
  return {S:S, SC:SC, refresh:refresh, resize:resize, draw:draw,
          syncPanel:syncPanel, buildTabs:buildTabs,
          isDirty:()=>dirty, clearDirty:()=>{dirty=false;},
          pump:()=>{ if(dirty){ dirty=false; draw(); return true; } return false; }};
}

/* ================================================================== *
 *  SELF TEST                                                          *
 *                                                                     *
 *  Reference values marked (scipy) come from build_polyhedra/, which   *
 *  rebuilds every solid by an independent route (a numerical search    *
 *  over seed positions, with scipy's ConvexHull for the faces) and     *
 *  are listed in build_polyhedra/refvals.txt.                          *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c){ pass++; } else { fail++; console.log('  FAIL  '+n); } };
  const close=(a,b,tol,n)=>ok(isFinite(a)&&Math.abs(a-b)<=tol,
    n+'   got '+a+' want '+b);
  const rel=(a,b,r,n)=>ok(isFinite(a)&&Math.abs(a-b)<=r*Math.max(1e-300,Math.abs(b)),
    n+'   got '+a+' want '+b);

  /* ---------- 0. the shared helpers behave as this file assumes ---- */
  close(DEG,Math.PI/180,0,'DEG converts degrees INTO radians');
  close(90*DEG,Math.PI/2,1e-15,'90 DEG is pi/2');
  close(Math.PI*RAD,180,1e-13,'RAD converts radians into degrees');
  let threw=false; try{ toRgb('not a colour'); }catch(e){ threw=true; }
  ok(threw,'toRgb throws rather than silently returning black');
  ok(toRgb(mix('#5ac8e0','#b8ec4c',0.5)).length===3,'mix output is a legal mix input');
  ok(plain('&Delta;&nu; &rsquo;').indexOf('&')<0,'plain decodes entities');
  ok(plain('<sub>x</sub>y')==='xy','plain strips tags');
  ok(plain('a<b>b</b>').indexOf('<')<0,'plain strips tags with attributes');
  ok(plain('&Delta;').charCodeAt(0)===0x0394,'ENTS carries upper-case Greek');
  ok(plain('&phi;').charCodeAt(0)===0x03c6,'ENTS carries lower-case Greek');

  /* ---------- 1. the Schwarz triangles ----------------------------- */
  const GORD={tet:24, oct:48, ico:120};
  for(const k of ['tet','oct','ico']){
    const G=GROUPS[k], N=schwarzMirrors(G.p,G.q,G.r);
    close(v3.dot(N[0],N[0]),1,1e-15,k+': n1 is a unit vector');
    close(v3.dot(N[1],N[1]),1,1e-15,k+': n2 is a unit vector');
    close(v3.dot(N[2],N[2]),1,1e-15,k+': n3 is a unit vector');
    close(v3.dot(N[0],N[1]),-Math.cos(PI/G.p),1e-15,k+': n1.n2 = -cos(pi/p)');
    close(v3.dot(N[1],N[2]),-Math.cos(PI/G.q),1e-15,k+': n2.n3 = -cos(pi/q)');
    close(v3.dot(N[0],N[2]),-Math.cos(PI/G.r),1e-15,k+': n1.n3 = -cos(pi/2) = 0');
    /* the fundamental domain's area is 4 pi / |G| (scipy) */
    const K=schwarzCorners(N);
    const ang=(P,Q,R)=>{
      const u=v3.norm(v3.cross(P,Q)), w=v3.norm(v3.cross(P,R));
      return Math.acos(clamp(v3.dot(u,w),-1,1));
    };
    const area=ang(K.A,K.B,K.C)+ang(K.B,K.C,K.A)+ang(K.C,K.A,K.B)-PI;
    close(area,4*PI/GORD[k],1e-14,k+': Girard area = 4 pi/|G| (scipy)');
    /* the corners really are p-, q- and 2-fold */
    close(ang(K.A,K.B,K.C),PI/G.p,1e-14,k+': angle at the p-fold corner');
    close(ang(K.B,K.C,K.A),PI/G.q,1e-14,k+': angle at the q-fold corner');
    close(ang(K.C,K.A,K.B),PI/G.r,1e-14,k+': angle at the 2-fold corner');
  }
  close(4*PI/24, 0.5235987755982988,1e-15,'tetrahedral fundamental area (scipy)');
  close(4*PI/48, 0.2617993877991494,1e-15,'octahedral fundamental area (scipy)');
  close(4*PI/120,0.1047197551196598,1e-15,'icosahedral fundamental area (scipy)');

  /* ---------- 2. the seven-subset rule ----------------------------- */
  for(const k of ['tet','oct','ico']){
    const G=GROUPS[k], N=schwarzMirrors(G.p,G.q,G.r);
    for(const w of WSUBSETS){
      const seed=wythoffSeed(N,w);
      close(v3.len(seed),1,1e-14,k+' w='+w.join('')+': seed is on the sphere');
      /* the defining property: M p = t w */
      const d=[0,1,2].map(i=>v3.dot(seed,N[i]));
      const act=d.filter((x,i)=>w[i]===1);
      const off=d.filter((x,i)=>w[i]===0);
      ok(spanOf(act)<1e-14, k+' w='+w.join('')+': active mirrors equidistant');
      ok(off.every(x=>Math.abs(x)<1e-14),
         k+' w='+w.join('')+': the seed lies ON every inactive mirror');
      const V=orbitByReflection(N,seed);
      const F=facesOf(V), A=analyse(V,F);
      ok(A.chi===2, k+' w='+w.join('')+': V-E+F = 2');
      ok(A.regular, k+' w='+w.join('')+': every face is regular');
      ok(A.edgeSpread<1e-13, k+' w='+w.join('')+': all edges equal');
      close(A.defectSum,4*PI,1e-12,k+' w='+w.join('')+': Descartes total defect');
      /* an edge really is twice the mirror distance */
      close(A.edge, 2*Math.max.apply(null,act.map(Math.abs)),1e-13,
            k+' w='+w.join('')+': edge = 2 x mirror distance');
    }
    /* the snub: no mirror condition, and Newton must actually converge */
    const ss=snubSeed(N,G.p,G.q,G.r);
    const K=schwarzCorners(N);
    const aa=Math.acos(clamp(v3.dot(ss,K.A),-1,1));
    const bb=Math.acos(clamp(v3.dot(ss,K.B),-1,1));
    const cc=Math.acos(clamp(v3.dot(ss,K.C),-1,1));
    const e1=2*Math.sin(PI/G.p)*Math.sin(aa), e2=2*Math.sin(PI/G.q)*Math.sin(bb),
          e3=2*Math.sin(PI/G.r)*Math.sin(cc);
    close(e1,e2,1e-12,k+' snub: p-fold and q-fold edges agree');
    close(e2,e3,1e-12,k+' snub: q-fold and 2-fold edges agree');
    const md=[0,1,2].map(i=>Math.abs(v3.dot(ss,N[i])));
    ok(spanOf(md)>0.05, k+' snub: the seed is on NO bisector (spread '
       +spanOf(md).toFixed(4)+')');
    const SV=orbitByRotation(N,ss);
    ok(SV.length===GORD[k]/2, k+' snub: orbit is the rotation subgroup ('
       +SV.length+' of '+GORD[k]+')');
    const SA=analyse(SV,facesOf(SV));
    ok(SA.chi===2, k+' snub: V-E+F = 2');
    ok(SA.regular, k+' snub: every face is regular');
  }

  /* ---------- 3. Euclid XIII: a/d, from the construction ----------- */
  /* every value here is (scipy); see build_polyhedra/refvals.txt      */
  const AD={
    'tetrahedron':0.8164965809277261, 'cube':0.5773502691896258,
    'octahedron':0.7071067811865476, 'dodecahedron':0.3568220897730897,
    'icosahedron':0.5257311121191336,
    'truncated tetrahedron':0.4264014327112207, 'cuboctahedron':0.5000000000000000,
    'truncated cube':0.2810846377148200, 'truncated octahedron':0.3162277660168381,
    'rhombicuboctahedron':0.3574067443365935,
    'truncated cuboctahedron':0.2157394052722661, 'snub cube':0.3721031655781034,
    'icosidodecahedron':0.3090169943749475,
    'truncated dodecahedron':0.1683814058867144,
    'truncated icosahedron':0.2017741061675988,
    'rhombicosidodecahedron':0.2239189797945130,
    'truncated icosidodecahedron':0.1314960875363021,
    'snub dodecahedron':0.2319284403227213,
  };
  for(const nm in AD)
    rel(buildSolid(nm).edgeOverDiam, AD[nm], 1e-12, 'a/d '+nm+' (scipy)');
  /* the five closed forms Euclid states as propositions */
  close(buildSolid('tetrahedron').edgeOverDiam, Math.sqrt(2/3),1e-14,
        'XIII.13 a/d = sqrt(2/3)');
  close(buildSolid('octahedron').edgeOverDiam, 1/Math.sqrt(2),1e-14,
        'XIII.14 a/d = 1/sqrt(2)');
  close(buildSolid('cube').edgeOverDiam, 1/Math.sqrt(3),1e-14,
        'XIII.15 a/d = 1/sqrt(3)');
  close(buildSolid('icosahedron').edgeOverDiam, 2/Math.sqrt(10+2*SQ5),1e-14,
        'XIII.16 a/d = 2/sqrt(10+2 sqrt5)');
  close(buildSolid('dodecahedron').edgeOverDiam, 1/(SQ3*PHI),1e-14,
        'XIII.17 a/d = 1/(sqrt3 phi)');
  /* stated the way Euclid states them: as ratios of squares */
  const sq=n=>1/Math.pow(buildSolid(n).edgeOverDiam,2);
  close(sq('tetrahedron'),1.5,1e-13,'XIII.13 d^2 = 3/2 a^2, in Euclid\'s words');
  close(sq('octahedron'),2,1e-13,'XIII.14 d^2 = 2 a^2');
  close(sq('cube'),3,1e-13,'XIII.15 d^2 = 3 a^2');
  close(sq('icosahedron'),PHI+2,1e-13,'XIII.16 d^2/a^2 = phi + 2');
  close(sq('dodecahedron'),3*PHI*PHI,1e-13,'XIII.17 d^2/a^2 = 3 phi^2');
  /* XIII.18 orders the five edges and proves there is no sixth solid */
  const ord=PLATONIC.slice().sort((a,b)=>buildSolid(a).edgeOverDiam
                                          -buildSolid(b).edgeOverDiam);
  ok(ord.join(',')==='dodecahedron,icosahedron,cube,octahedron,tetrahedron',
     'XIII.18 orders the edges dodeca < icosa < cube < octa < tetra');

  /* ---------- 4. the Platonic solids against their closed forms ---- */
  const PLAT={
    tetrahedron:{d:Math.acos(1/3), R:Math.sqrt(6)/4, rho:1/Math.sqrt(8),
                 r:1/Math.sqrt(24), vol:Math.sqrt(2)/12, area:SQ3, V:4,E:6,F:4},
    cube:{d:PI/2, R:SQ3/2, rho:1/Math.sqrt(2), r:0.5, vol:1, area:6, V:8,E:12,F:6},
    octahedron:{d:Math.acos(-1/3), R:1/Math.sqrt(2), rho:0.5, r:1/Math.sqrt(6),
                vol:Math.sqrt(2)/3, area:2*SQ3, V:6,E:12,F:8},
    dodecahedron:{d:Math.acos(-1/SQ5), R:SQ3*PHI/2, rho:PHI*PHI/2,
                  r:PHI*PHI/(2*Math.sqrt(3-PHI)), vol:(15+7*SQ5)/4,
                  area:3*Math.sqrt(25+10*SQ5), V:20,E:30,F:12},
    icosahedron:{d:Math.acos(-SQ5/3), R:Math.sqrt(10+2*SQ5)/4, rho:PHI/2,
                 r:PHI*PHI/(2*SQ3), vol:5*(3+SQ5)/12, area:5*SQ3, V:12,E:30,F:20},
  };
  for(const nm in PLAT){
    const A=buildSolid(nm), P=PLAT[nm];
    ok(A.nV===P.V&&A.nE===P.E&&A.nF===P.F, nm+': V,E,F');
    ok(A.dihSpread<1e-12, nm+': one dihedral angle only');
    rel(A.dihMean,P.d,1e-12,nm+': dihedral angle');
    rel(A.R,P.R,1e-12,nm+': circumradius');
    rel(A.rmid,P.rho,1e-12,nm+': midradius');
    rel(A.rin,P.r,1e-12,nm+': inradius');
    rel(A.vol,P.vol,1e-12,nm+': volume');
    rel(A.area,P.area,1e-12,nm+': surface area');
    close(A.defectSum,4*PI,1e-12,nm+': Descartes total defect = 4 pi');
    ok(A.vconf.length===1, nm+': one kind of vertex');
    /* R^2 = rho^2 + (a/2)^2 for any solid with all vertices on a sphere */
    close(A.R*A.R, A.rmid*A.rmid+0.25, 1e-12, nm+': R^2 = rho^2 + (a/2)^2');
  }
  /* the dihedrals against their own closed forms, pinned absolutely (scipy) */
  rel(buildSolid('tetrahedron').dihMean, 1.2309594173407747,1e-13,'tetra dihedral (scipy)');
  rel(buildSolid('cube').dihMean,        1.5707963267948966,1e-13,'cube dihedral (scipy)');
  rel(buildSolid('octahedron').dihMean,  1.9106332362490184,1e-13,'octa dihedral (scipy)');
  rel(buildSolid('dodecahedron').dihMean,2.0344439357957027,1e-13,'dodeca dihedral (scipy)');
  rel(buildSolid('icosahedron').dihMean, 2.4118649973628270,1e-13,'icosa dihedral (scipy)');

  /* ---------- 5. every uniform solid ------------------------------- */
  const VEF={
    'tetrahedron':[4,6,4], 'cube':[8,12,6], 'octahedron':[6,12,8],
    'dodecahedron':[20,30,12], 'icosahedron':[12,30,20],
    'truncated tetrahedron':[12,18,8], 'cuboctahedron':[12,24,14],
    'truncated cube':[24,36,14], 'truncated octahedron':[24,36,14],
    'rhombicuboctahedron':[24,48,26], 'truncated cuboctahedron':[48,72,26],
    'snub cube':[24,60,38], 'icosidodecahedron':[30,60,32],
    'truncated dodecahedron':[60,90,32], 'truncated icosahedron':[60,90,32],
    'rhombicosidodecahedron':[60,120,62],
    'truncated icosidodecahedron':[120,180,62], 'snub dodecahedron':[60,150,92],
  };
  const VCONF={
    'truncated tetrahedron':'3.6.6', 'cuboctahedron':'3.4.3.4',
    'truncated cube':'3.8.8', 'truncated octahedron':'4.6.6',
    'rhombicuboctahedron':'3.4.4.4', 'truncated cuboctahedron':'4.6.8',
    'snub cube':'3.3.3.3.4', 'icosidodecahedron':'3.5.3.5',
    'truncated dodecahedron':'3.10.10', 'truncated icosahedron':'5.6.6',
    'rhombicosidodecahedron':'3.4.5.4', 'truncated icosidodecahedron':'4.6.10',
    'snub dodecahedron':'3.3.3.3.5',
  };
  for(const c of CATALOGUE){
    const A=buildSolid(c.name), w=VEF[c.name];
    ok(A.nV===w[0]&&A.nE===w[1]&&A.nF===w[2], c.name+': V,E,F = '+w.join(',')+' (scipy)');
    ok(A.chi===2, c.name+': Euler characteristic');
    ok(A.regular, c.name+': every face regular');
    ok(A.edgeSpread<1e-12, c.name+': all edges equal');
    ok(A.Rspread<1e-12, c.name+': all vertices on one sphere');
    ok(A.rmidSpread<1e-12, c.name+': all edges tangent to one midsphere');
    ok(A.vconf.length===1, c.name+': vertex-transitive (one vertex figure)');
    close(A.defectSum,4*PI,1e-11,c.name+': Descartes total defect');
    if(VCONF[c.name])
      ok(A.vconf[0]===VCONF[c.name],
         c.name+': vertex figure '+VCONF[c.name]+' (got '+A.vconf[0]+')');
    close(A.R*A.R, A.rmid*A.rmid+0.25, 1e-11, c.name+': R^2 = rho^2 + (a/2)^2');
  }
  /* the face census across the whole file, and its constructibility */
  ok(allFaceSizes().join(',')==='3,4,5,6,8,10',
     'the only faces that occur are 3,4,5,6,8,10-gons');
  ok(allFaceSizes().every(constructibleNGon),
     'every face that occurs is constructible with ruler and compass');
  ok(!constructibleNGon(7) && !constructibleNGon(9) && !constructibleNGon(11),
     'the heptagon, enneagon and hendecagon are not constructible');
  ok(constructibleNGon(17) && constructibleNGon(15) && constructibleNGon(257),
     'Gauss-Wantzel admits 15, 17 and 257');
  ok(!constructibleNGon(25), 'a repeated Fermat prime (25 = 5x5) is excluded');

  /* ---------- 6. the Catalan solids -------------------------------- */
  const CATDIH={
    'triakis tetrahedron':129.5211963586422144, 'rhombic dodecahedron':119.9999999999999858,
    'triakis octahedron':147.3501001262095258, 'tetrakis hexahedron':143.1301023541559232,
    'deltoidal icositetrahedron':138.1179590555122729,
    'disdyakis dodecahedron':155.0821796166184754,
    'pentagonal icositetrahedron':136.3092328923242746,
    'rhombic triacontahedron':144.0000000000000000,
    'triakis icosahedron':160.6125522093703921, 'pentakis dodecahedron':156.7185537264587651,
    'deltoidal hexecontahedron':154.1213631257763552,
    'disdyakis triacontahedron':164.8878919076624641,
    'pentagonal hexecontahedron':153.1787325584497239,
  };
  const CATVEF={
    'triakis tetrahedron':[8,18,12], 'rhombic dodecahedron':[14,24,12],
    'triakis octahedron':[14,36,24], 'tetrakis hexahedron':[14,36,24],
    'deltoidal icositetrahedron':[26,48,24], 'disdyakis dodecahedron':[26,72,48],
    'pentagonal icositetrahedron':[38,60,24], 'rhombic triacontahedron':[32,60,30],
    'triakis icosahedron':[32,90,60], 'pentakis dodecahedron':[32,90,60],
    'deltoidal hexecontahedron':[62,120,60], 'disdyakis triacontahedron':[62,180,120],
    'pentagonal hexecontahedron':[92,150,60],
  };
  for(const c of CATALOGUE){
    if(c.fam!=='arch') continue;
    const D=buildDual(c.name), A=buildSolid(c.name);
    const w=CATVEF[D.name];
    ok(D.nV===w[0]&&D.nE===w[1]&&D.nF===w[2], D.name+': V,E,F (scipy)');
    ok(D.chi===2, D.name+': Euler characteristic');
    /* duality swaps the counts */
    ok(D.nV===A.nF && D.nF===A.nV && D.nE===A.nE,
       D.name+': duality swaps V and F and keeps E');
    /* the defining property of a Catalan solid */
    ok(D.dihSpread<1e-9, D.name+': face-transitive — one dihedral angle');
    rel(D.dihMean*RAD, CATDIH[D.name], 1e-11, D.name+': dihedral (scipy)');
    close(D.defectSum,4*PI,1e-10,D.name+': Descartes total defect');
    ok(D.vconf.length>1, D.name+': NOT vertex-transitive, unlike its parent');
    ok(!D.regular, D.name+': its faces are not regular polygons');
  }
  /* the two rhombic solids have famously round dihedral angles */
  rel(buildDual('cuboctahedron').dihMean*RAD,120,1e-12,'rhombic dodecahedron: exactly 120 deg');
  rel(buildDual('icosidodecahedron').dihMean*RAD,144,1e-12,'rhombic triacontahedron: exactly 144 deg');

  /* ---------- 7. duality is an involution -------------------------- */
  for(const c of CATALOGUE){
    const A=buildSolid(c.name);
    const D=dualOf(A.V,A.F,A.rmid);
    const DD=dualOf(D.V,D.F,A.rmid);
    let worst=0;
    for(let i=0;i<A.V.length;i++) worst=Math.max(worst,v3.len(v3.sub(DD.V[i],A.V[i])));
    ok(worst<1e-11, c.name+': dual of the dual returns the original ('
       +worst.toExponential(1)+')');
    /* every dual edge touches the SAME midsphere */
    const DA=analyse(D.V,D.F);
    ok(DA.rmidSpread<1e-11, c.name+': dual edges all tangent to one sphere');
    rel(DA.rmid, A.rmid, 1e-11, c.name+': and it is the primal\'s midsphere');
    /* corresponding edges cross at right angles */
    let worstPerp=0;
    for(const e of A.E){
      const inc=[];
      for(let k=0;k<A.F.length;k++)
        if(A.F[k].indexOf(e[0])>=0 && A.F[k].indexOf(e[1])>=0) inc.push(k);
      if(inc.length!==2) continue;
      const u=v3.norm(v3.sub(A.V[e[1]],A.V[e[0]]));
      const w2=v3.norm(v3.sub(D.V[inc[1]],D.V[inc[0]]));
      worstPerp=Math.max(worstPerp,Math.abs(v3.dot(u,w2)));
    }
    ok(worstPerp<1e-11, c.name+': primal and dual edges are perpendicular ('
       +worstPerp.toExponential(1)+')');
  }

  /* ---------- 8. the snubs are not constructible ------------------- */
  const cubic=t=>t*t*t-t*t-t-1;
  let lo=1, hi=2;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(cubic(m)<0) lo=m; else hi=m; }
  const tribo=(lo+hi)/2;
  close(tribo,1.8392867552141612,1e-14,'tribonacci constant (scipy)');
  ok(cubic(1)!==0 && cubic(-1)!==0,
     'the tribonacci cubic has no rational root, so it is irreducible over Q');
  {
    /* the ratio comes out of the CONSTRUCTION, and matches the cubic */
    const A=buildSolid('snub cube');
    const c=A.V[0].map(Math.abs).sort((a,b)=>a-b);
    rel(c[1]/c[0], tribo, 1e-11, 'snub cube coordinates are 1 : t : t^2 (t)');
    rel(c[2]/c[0], tribo*tribo, 1e-11, 'snub cube coordinates are 1 : t : t^2 (t^2)');
  }
  /* cos(2 pi/7) is the same kind of obstruction one dimension down */
  {
    const c7=Math.cos(TAU/7);
    close(8*c7*c7*c7+4*c7*c7-4*c7-1, 0, 1e-14,
          'cos(2 pi/7) satisfies 8x^3+4x^2-4x-1 (scipy)');
  }

  /* ---------- 9. the plane constructions --------------------------- */
  for(const n of NGONS){
    const C=construction(n);
    const a0=Math.atan2(C.verts[0][1],C.verts[0][0]);
    let worst=0;
    for(let k=0;k<C.verts.length;k++){
      const t=[Math.cos(a0+TAU*k/n),Math.sin(a0+TAU*k/n)];
      worst=Math.max(worst,Math.hypot(C.verts[k][0]-t[0],C.verts[k][1]-t[1]));
    }
    ok(worst<1e-15,'construction '+n+': vertices land exactly on the circle ('
       +worst.toExponential(1)+')');
    const rr=C.verts.map(p=>Math.hypot(p[0],p[1]));
    ok(spanOf(rr)<1e-15,'construction '+n+': all vertices on the unit circle');
    ok(C.steps.length>=3,'construction '+n+': has steps to walk through');
  }
  {
    const P5=construction(5);
    close(P5.side, 2*Math.sin(PI/5), 1e-15, 'IV.11: NQ is the pentagon side (scipy)');
    close(P5.decagon, 1/PHI, 1e-15, 'IV.11: OQ is the decagon side = 1/phi (scipy)');
    close(1/PHI,0.6180339887498948,1e-15,'1/phi (scipy)');
    close(PHI,1.6180339887498949,1e-15,'phi (scipy)');
    close(2*Math.sin(PI/5),1.1755705045849463,1e-15,'2 sin(pi/5) (scipy)');
    /* the golden section really is a section: OQ^2 = OA x QA */
    const OQ=1/PHI;
    close(OQ*OQ, 1*(1-OQ)+0, 1e-15, 'golden section: 1/phi^2 = 1 - 1/phi');
  }

  /* ---------- 10. the model builds clean for every setting --------- */
  const S=makeState();
  let panels=0, bad=0;
  for(const v of VIEWS){
    S.view=v;
    let picks=[null];
    if(v==='compass') picks=NGONS.map(n=>({k:'ngon',x:n}));
    else if(v==='five') picks=PLATONIC.map(n=>({k:'plat',x:n}));
    else if(v==='arch') picks=ARCH.map(n=>({k:'arch',x:n}));
    else if(v==='catalan') picks=CATALANS.map(n=>({k:'cat',x:n}));
    else if(v==='duality') picks=CATALOGUE.map(c=>({k:'dualPair',x:c.name}));
    else picks=[0,1,2,3,4,5,6].map(i=>({k:'wsub',x:i}));
    for(const p of picks){
      if(p) S[p.k]=p.x;
      for(const st of (v==='compass'?[0,1,2]:[0])){
        if(v==='compass') S.step=st;
        let M;
        try{ M=buildModel(S); }
        catch(e){ ok(false,'buildModel '+v+' '+(p?p.x:'')+': '+e.message); bad++; continue; }
        const html=readoutHTML(S,M)+eqbarHTML(S,M)+tagHTML(S,M);
        panels++;
        if(html.indexOf('NaN')>=0){ ok(false,'NaN in panel: '+v+' '+(p?p.x:'')); bad++; }
        if(html.indexOf('undefined')>=0){ ok(false,'undefined in panel: '+v+' '+(p?p.x:'')); bad++; }
        /* a non-finite-safe formatter renders NaN as an em dash, so the check
           above can be vacuous; assert an EXPECTED number is present too */
        if(v==='five'){
          const A=buildSolid(S.plat);
          ok(html.indexOf(fmt(A.edgeOverDiam,12))>=0,
             'five/'+S.plat+': the readout really prints a/d');
        }
      }
    }
  }
  ok(bad===0, 'all '+panels+' panel builds are clean');

  /* the mirrors view over the whole seed square, including the corners */
  {
    const T=makeState();
    T.view='mirrors'; T.freeSeed=true;
    let nonfinite=0, built=0;
    for(const g of ['tet','oct','ico'])
      for(let i=0;i<=6;i++) for(let j=0;j<=6;j++){
        T.group=g; T.seedU=0.02+0.96*i/6; T.seedV=0.02+0.96*j/6;
        let M;
        try{ M=buildModel(T); }catch(e){ nonfinite++; continue; }
        built++;
        const R=M.mir;
        if(!R.seed.every(isFinite)) nonfinite++;
        if(R.A && !isFinite(R.A.edge)) nonfinite++;
        const html=readoutHTML(T,M);
        if(html.indexOf('NaN')>=0||html.indexOf('undefined')>=0) nonfinite++;
      }
    ok(nonfinite===0, 'no seed position gives a non-finite result ('+built+' tried)');
    ok(built>=140, 'the free-seed sweep really ran ('+built+')');
  }

  /* ---------- 11. the default camera is not down a symmetry axis --- */
  {
    const cam=makeCamera(CAM0.theta,CAM0.phi,CAM0.dist);
    cam.W=900; cam.H=600;
    const B=camBasis(cam);
    const dir=v3.norm(B.eye);
    /* The rotation axes of each group are exactly the vertex, face-centre and
       edge-midpoint directions of ITS Platonic solid — the vertices of an
       Archimedean solid are not axes at all (its vertex stabiliser is
       trivial), so gathering directions off those would over-constrain. */
    let worst=0, which='';
    for(const nm of PLATONIC){
      const A=buildSolid(nm);
      const axes=A.V.map(v3.norm)
        .concat(A.F.map(f=>facePlane(A.V,f).n))
        .concat(A.E.map(e=>v3.norm(v3.add(A.V[e[0]],A.V[e[1]]))));
      for(const ax of axes){
        const c=Math.abs(v3.dot(dir,ax));
        if(c>worst){ worst=c; which=nm; }
      }
    }
    ok(worst<Math.cos(15*DEG),
       'the default camera is >15 deg off every rotation axis (worst |cos| '
       +worst.toFixed(4)+', on the '+which+')');
  }

  /* ---------- 12. the scene's own controls ------------------------- */
  {
    const SC=makeScene();
    const th0=SC.S.cam.theta, ph0=SC.S.cam.phi;
    SC.drag(40,0);
    ok(SC.S.cam.theta!==th0 && SC.S.cam.phi===ph0,'drag in x moves theta only');
    SC.drag(0,40);
    ok(SC.S.cam.phi!==ph0,'drag in y moves phi');
    SC.resetCam();
    close(SC.S.cam.theta,CAM0.theta,1e-15,'resetCam restores theta');
    close(SC.S.cam.phi,CAM0.phi,1e-15,'resetCam restores phi');
    const z0=SC.S.zoom;
    SC.wheel(-1);
    ok(SC.S.zoom>z0,'wheel up zooms in');
    SC.wheel(1); SC.wheel(1);
    ok(SC.S.zoom<z0,'wheel down zooms out');
    for(let i=0;i<200;i++) SC.wheel(-1);
    ok(SC.S.zoom<=3.0000001,'zoom is clamped above');
    for(let i=0;i<400;i++) SC.wheel(1);
    ok(SC.S.zoom>=0.3999999,'zoom is clamped below');
    /* reset must restore the camera too, not only the sliders */
    SC.S.plat='cube'; SC.drag(60,30); SC.wheel(-1);
    SC.reset();
    ok(SC.S.plat===DEFAULTS.plat,'reset restores the controls');
    close(SC.S.cam.theta,CAM0.theta,1e-15,'reset restores the camera as well');
    ok(SC.S.zoom===1,'reset restores the zoom');
    /* spin only advances while it is on */
    SC.S.spin=false;
    const t1=SC.S.cam.theta;
    ok(SC.tick(0.1)===false && SC.S.cam.theta===t1,'no drift while spin is off');
    SC.S.spin=true;
    ok(SC.tick(0.1)===true && SC.S.cam.theta!==t1,'spin advances theta');
  }

  /* ---------- 13. fitDist follows the canvas, not a constant ------- */
  {
    const c1=makeCamera(0.6,0.3,3); c1.W=800; c1.H=600;
    const c2=makeCamera(0.6,0.3,3); c2.W=400; c2.H=300;
    const d1=fitDist(c1,1,0.4), d2=fitDist(c2,1,0.4);
    close(d1,d2,1e-12,'fitDist is canvas-size independent for a fixed aspect');
    const c3=makeCamera(0.6,0.3,3); c3.W=800; c3.H=300;
    ok(fitDist(c3,1,0.4)>0 && isFinite(fitDist(c3,1,0.4)),'fitDist survives a wide canvas');
    ok(fitDist(c1,2,0.4)>fitDist(c1,1,0.4),'a bigger solid is framed from further away');
  }

  /* ---------- 14. what the mutation sweep asked for ----------------
     Every assertion below closes a mutant that survived the first
     55-mutant sweep.  Each one is a number nothing else in the file
     pinned, or a property that was true but never stated.            */

  /* the unit-edge convention has to be pinned, or scaleToEdge is free.
     This matters most for the CATALANS, whose edges are not all equal:
     every other Catalan assertion here (angles, counts, defect) is
     scale invariant, so normalising to the longest edge instead of the
     mean changed every Catalan size and nothing noticed. */
  for(const c of CATALOGUE){
    const A=buildSolid(c.name);
    close(meanOf(A.E.map(e=>v3.len(v3.sub(A.V[e[0]],A.V[e[1]])))),1,1e-12,
          c.name+': mean edge is exactly 1 after scaling');
    if(c.fam!=='arch') continue;
    const D=buildDual(c.name);
    close(meanOf(D.E.map(e=>v3.len(v3.sub(D.V[e[0]],D.V[e[1]])))),1,1e-12,
          D.name+': mean edge is exactly 1 (its edges are NOT all equal)');
    ok(D.edgeSpread>1e-6 || D.name.indexOf('rhombic')===0,
       D.name+': a Catalan has unequal edges unless it is rhombic');
  }
  /* the face SHAPE is measured, so it deserves assertions of its own */
  const SHAPE={
    'rhombic dodecahedron':'rhombus', 'rhombic triacontahedron':'rhombus',
    'deltoidal icositetrahedron':'kite', 'deltoidal hexecontahedron':'kite',
    'triakis tetrahedron':'isosceles triangle',
    'tetrakis hexahedron':'isosceles triangle',
    'triakis octahedron':'isosceles triangle',
    'triakis icosahedron':'isosceles triangle',
    'pentakis dodecahedron':'isosceles triangle',
    'disdyakis dodecahedron':'scalene triangle',
    'disdyakis triacontahedron':'scalene triangle',
    'pentagonal icositetrahedron':'irregular pentagon',
    'pentagonal hexecontahedron':'irregular pentagon',
  };
  for(const c of CATALOGUE){
    if(c.fam!=='arch') continue;
    const D=buildDual(c.name);
    ok(D.faceShape===SHAPE[D.name],
       D.name+': face is a '+SHAPE[D.name]+' (got '+D.faceShape+')');
  }
  /* a rhombus is equilateral but NOT regular, so the shape test needs the
     circumradius as well as the edges — the duals of the Platonic solids
     are the control, since theirs really are regular */
  ok(buildDual('cuboctahedron').faceShape==='rhombus',
     'the rhombic dodecahedron\'s face is a rhombus, not a square');
  ok(catalanFaceShape(buildSolid('cube'))==='square',
     'and a cube\'s face IS a square — equilateral and equiangular');
  ok(catalanFaceShape(buildSolid('dodecahedron'))==='regular pentagon',
     'a dodecahedron\'s face is a REGULAR pentagon');

  /* the projection: pin f absolutely, or the field of view is free because
     fitDist silently compensates for it */
  {
    const cam=makeCamera(0,0,10); cam.W=800; cam.H=600; cam.fov=0.78;
    const B=camBasis(cam);
    close(B.f,(600/2)/Math.tan(0.78/2),1e-12,'camera f = (H/2)/tan(fov/2)');
    close(B.f,729.8294922198,1e-9,'camera f at fov 0.78, H 600 (scipy)');
    /* the eye is at +x looking back at the origin, so right = +y and up = +z;
       a point one unit along +y at the origin's depth lands f/dist pixels to
       the RIGHT of centre and stays on the centre line */
    const q=project(cam,B,[0,1,0]);
    ok(q!==null,'a point in front of the camera projects');
    close(q.x,800/2+B.f*1/10,1e-9,'projection puts +y at +f/dist from centre');
    close(q.y,600/2,1e-9,'and leaves it on the centre line');
    ok(project(cam,B,[20,0,0])===null,'a point behind the camera does not project');
  }
  /* fitDist means "the solid spans this fraction of the frame" — assert the
     framing it actually produces, not merely that it is monotone */
  {
    const cam=makeCamera(0.3,0.2,1); cam.W=900; cam.H=700;
    for(const R of [0.5,1,2.5]) for(const frac of [0.3,0.42]){
      cam.dist=fitDist(cam,R,frac);
      const B=camBasis(cam);
      /* the silhouette of a ball of radius R subtends asin(R/dist); at the
         frame centre that is B.f * tan(asin(R/dist)) pixels */
      const px=B.f*R/Math.sqrt(cam.dist*cam.dist-R*R);
      rel(px, frac*Math.min(cam.W,cam.H), 1e-12,
          'fitDist frames R='+R+' at exactly '+frac+' of the frame');
    }
    close(fitDist(makeCameraWH(800,600,0.78),1,0.42),3.0639317466,1e-8,
          'fitDist absolute value at R=1, frac=0.42 (scipy)');
  }
  /* a slider hands over half-integers; the step indexes an array */
  {
    const T=makeState(); T.view='compass'; T.ngon=5;
    for(const st of [0,0.5,2.5,4.9,99,-3]){
      T.step=st;
      let M=null, threw=false;
      try{ M=buildModel(T); }catch(e){ threw=true; }
      ok(!threw && M && M.con.steps[M.step]!==undefined,
         'a step slider value of '+st+' indexes a real step');
    }
  }
  /* the construction has to START where its own narrative says it does — a
     rotation-invariant vertex check cannot see this, and the pentagon really
     did begin 18 degrees away from N at one point */
  for(const n of NGONS){
    const C=construction(n);
    ok(!!C.start,'construction '+n+' declares where it starts');
    close(Math.hypot(C.verts[0][0]-C.start[0],C.verts[0][1]-C.start[1]),0,1e-15,
          'construction '+n+': the polygon starts at the point the steps step from');
  }
  ok(Math.abs(construction(5).verts[0][1]-1)<1e-15,
     'IV.11 steps NQ round the circle starting from N = (0,1)');
  /* and the drawn compass opening must be the one the numbers use */
  {
    const C=construction(5);
    let hit=null;
    for(const s of C.steps) for(const d of (s.draw||[]))
      if(d.k==='circle' && Math.abs(d.c[0]-0.5)<1e-12 && d.r>1) hit=d;
    ok(!!hit,'IV.11 draws the circle centred M');
    if(hit){
      close(Math.hypot(0-hit.c[0],1-hit.c[1]),hit.r,1e-15,
            'and that drawn circle really passes through N');
      const Qx=hit.c[0]-hit.r;
      close(Math.abs(Qx),1/PHI,1e-15,'and really cuts the diameter at Q = 1/phi');
    }
  }

  /* ---- properties that were true but unstated (equivalent mutants) ---- */
  {
    /* the nearest-neighbour edge finder has a 1e-6 tolerance; report the
       margin it actually has, so a future solid with a tighter gap is a
       visible failure rather than a silent mis-mesh */
    /* the margin is the shortest NON-edge distance over the edge length.  The
       tetrahedron has no non-edge pair at all — every pair of its vertices is
       an edge — so it is skipped rather than reported as a zero margin. */
    let worstRatio=Infinity, which='none';
    for(const c of CATALOGUE){
      const A=buildSolid(c.name);
      const isEdge={};
      for(const e of A.E) isEdge[e[0]+','+e[1]]=1;
      for(let i=0;i<A.V.length;i++) for(let j=i+1;j<A.V.length;j++){
        if(isEdge[i+','+j]) continue;
        const r=v3.len(v3.sub(A.V[i],A.V[j]))/A.edge;
        if(r<worstRatio){ worstRatio=r; which=c.name; }
      }
    }
    /* measured: 1.4142 on the truncated cuboctahedron.  Anything short of a
       41% tolerance therefore provably cannot change the edge set, which is
       why widening 1e-6 to 1e-1 is an equivalent mutant rather than a hole. */
    close(worstRatio,Math.SQRT2,1e-9,
          'the nearest non-edge pair is sqrt(2) edges away (worst case, scipy)');
    ok(worstRatio>1.15,'so the 1+1e-6 neighbour tolerance has 41% of margin');
    /* the coplanarity tolerance, likewise */
    let worstGap=Infinity, which2='';
    for(const c of CATALOGUE){
      const A=buildSolid(c.name);
      for(const f of A.F){
        const pl=facePlane(A.V,f);
        for(let j=0;j<A.V.length;j++){
          if(f.indexOf(j)>=0) continue;
          const g=Math.abs(v3.dot(pl.n,A.V[j])-pl.d);
          if(g<worstGap){ worstGap=g; which2=c.name; }
        }
      }
    }
    /* measured: 0.236 on the snub dodecahedron — six orders of magnitude of
       headroom over the 1e-7 the code uses, so widening it to 1e-2 is also
       an equivalent mutant. */
    ok(worstGap>0.2,'the nearest off-plane vertex is '+worstGap.toFixed(4)
       +' away (on the '+which2+'), against a 1e-7 coplanarity tolerance');
    /* the midradius clamp never binds on a convex solid centred on the
       origin, and the raw face winding is already outward — both are
       defensive, and saying so is better than leaving them untested */
    let worstT=1, worstDot=1;
    for(const c of CATALOGUE){
      const A=buildSolid(c.name);
      for(const e of A.E){
        const a=A.V[e[0]], d=v3.sub(A.V[e[1]],a);
        const t=-v3.dot(a,d)/v3.dot(d,d);
        worstT=Math.min(worstT,Math.min(t,1-t));
      }
      for(const f of A.F){
        const pts=f.map(i=>A.V[i]);
        const raw=v3.norm(v3.cross(v3.sub(pts[1],pts[0]),v3.sub(pts[2],pts[0])));
        worstDot=Math.min(worstDot,v3.dot(raw,centroidOf(pts))>0?1:0);
      }
    }
    ok(worstT>0.1,'every edge foot is interior, so the midradius clamp never binds');
    ok(worstDot===1,'every face winding is already outward before the guard fires');
    /* a guard is invisible unless something is fed to it: feed chol3 a Gram
       matrix whose halves disagree and require it to refuse */
    let threwA=false;
    try{ chol3([[1,-0.7,0],[-0.5,1,-0.5],[0,-0.5,1]]); }catch(e){ threwA=true; }
    ok(threwA,'chol3 refuses a Gram matrix that is not symmetric');
    let threwB=false;
    try{ chol3([[1,2,0],[2,1,0],[0,0,1]]); }catch(e){ threwB=true; }
    ok(threwB,'chol3 refuses a Gram matrix that is not positive definite');
    let threwC=false;
    try{ chol3([[1,-0.5,0],[-0.5,1,-0.5],[0,-0.5,1]]); }catch(e){ threwC=true; }
    ok(!threwC,'and accepts a legitimate one');
    /* two of the three mirror-pair rotations already generate the rotation
       subgroup, which is why dropping the third changes nothing */
    for(const k of ['tet','oct','ico']){
      const G=GROUPS[k], N=schwarzMirrors(G.p,G.q,G.r);
      const s=snubSeed(N,G.p,G.q,G.r);
      ok(orbitByRotation(N,s).length===({tet:12,oct:24,ico:60})[k],
         k+': the snub orbit is the whole rotation subgroup');
    }
    /* the Gauss-Wantzel loop needs no repeated-prime guard: dividing out one
       copy leaves m > 1, and the final m===1 rejects it anyway */
    ok(!constructibleNGon(9)&&!constructibleNGon(25)&&!constructibleNGon(45)
       &&!constructibleNGon(49),
       'squares of Fermat primes are rejected by the final m===1 alone');
  }

  console.log(pass+' passed, '+fail+' failed');
  return fail;
}

/* a camera at a stated size, so the fitDist reference value is unambiguous */
function makeCameraWH(W,H,fov){
  const c=makeCamera(0,0,1); c.W=W; c.H=H; c.fov=fov; return c;
}

/* ================================================================== *
 *  ENTRY                                                              *
 * ================================================================== */
if(typeof document==='undefined'){
  /* A selfTest that logs its failures and returns cleanly makes EVERY mutant
     look like a survivor, because tools/mutate.py reads the exit code. */
  if(selfTest()>0) throw new Error('selfTest failed');
} else {
  window.__poly=boot();
}

</script>
