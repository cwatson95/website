<title>Rabi oscillations &amp; superoscillations &mdash; a driven atom flops; post-selected, it turns faster than it can, and waves oscillate faster than their fastest Fourier component</title>
<!--
  ===================================================================
  rabi_superoscillations.html — Rabi oscillations of a driven
  two-level atom, then superoscillations: the weak value of a turned
  spin, raised to the N-th power, is Berry's band-limited function
  that oscillates faster than any of its Fourier components
  ===================================================================

  Six views.  THE FLOP: the Bloch vector of a two-level atom under a
  drive, in the lab (a fast precession with a slow tilt) and in the
  frame turning with the drive (a circle about B = (Omega, 0, -Delta));
  Pe(t) integrated exactly in the lab against Rabi's formula, and the
  flop's frequency against the detuning, slowest at the Bloch-Siegert
  shifted resonance.  PULSES & FRINGES: a pulse's area, the pi, pi/2
  and 2 pi pulses (the amplitude of |g> turns over after 2 pi), a
  pulse's line, and Ramsey's fringes.  A REAL ATOM: decay (the optical
  Bloch equations: the spiral to a steady state, saturation, power
  broadening, the Mollow triplet) or photons (Jaynes-Cummings: the
  vacuum Rabi oscillation, collapse and revival, the atom's Bloch
  vector shrinking while entangled).  THE WEAK TURN: pre-select, turn,
  post-select; the amplitude <f|U|i> = <f|i>(cos th/2 - i A_w sin th/2)
  with A_w = tan(alpha/2) (the Weak value article's example): its
  phase runs A_w times faster than a turn allows.  SUPEROSCILLATION:
  f(x) = (cos(x/N) + i a sin(x/N))^N, band-limited to |k| <= 1 and
  going as e^{iax} near 0; its spectrum, local wavenumber and price.
  THE POINTER: N spins and a Gaussian pointer, which lands at A_w when
  wide (weak) and splits into the eigen-copies when narrow (strong);
  and a superoscillating focal spot against the diffraction limit.

  WHAT IS QUOTED (build_rso/data/constants.txt, checked verbatim by
  build_rso/check_sources.py against the sources fetched 2026-09-27)
  -----------------------------------------------------------------------
  Wikipedia wikitext: "Rabi cycle" (Rabi's rotating field, the rotating
  frame H~ = (hbar/2)[[-Dw, w1],[w1, Dw]] with Dw = w - w0, the formula,
  the generalized Rabi frequency, the pi pulse); "Isidor Rabi" (Nobel
  1944, the resonance method); "Rotating-wave approximation" (near
  resonance, low intensity); "Bloch-Siegert shift" (1940, two circular
  fields, dw = Omega0^2/4w0, the 2w population oscillation); "Ramsey
  interferometry" (1949, two pi/2 zones, cos^2(Delta T/2), the Rabi
  method's line and width pi/tau, the SI second's 9,192,631,770
  periods); "Norman Ramsey Jr." (Nobel 1989); "Spinor" (360 and 720
  degrees); "Resonance fluorescence" (the Mollow sidebands' widths
  Gamma/2 and 3 Gamma/4); "Jaynes-Cummings model" (1963, 2g = Omega,
  the Pe sum, collapse sqrt2/Omega, revival 4 pi sqrt<n>/Omega,
  Rempe, Walther and Klein 1987); "Vacuum Rabi oscillation"; "Weak
  value" (Aharonov, Albert and Vaidman 1988, Rice 1991, the 100, the
  Stern-Gerlach example with A_w = tan(alpha/2), the Gaussian pointer
  and its shift gamma A_w); "Superoscillation" (Aharonov, Berry 1994,
  Daubechies, Huang 2007 and 2009, 35 nm, Kempf and Ferreira's
  exponential dynamic range); "Bandlimiting"; "Diffraction-limited
  system" (Abbe's d = lambda/(2 n sin theta)).  M. V. Berry, "Faster
  than Fourier" (1994), a scan without a text layer: read for the
  model, cited through the Superoscillation article, not quoted.

  WHAT IS COMPUTED HERE AND CHECKED BY build_rso/derive.py
  --------------------------------------------------------
  Everything else, by routes that share no code with this page: the
  rotating-frame states by 40-digit matrix exponentials; the lab-frame
  drives by scipy's DOP853 (the page: fourth-order Magnus steps and
  Floquet composition); the flop's frequency and the true resonance
  from the rotating frame's Floquet states; the Ramsey fringe widths;
  the Lindblad steady state, evolution and fluorescence spectrum (an
  eigen-decomposition; the page: a resolvent); the Jaynes-Cummings
  dynamics by a truncated, diagonalised Hamiltonian (the page: the
  2x2 blocks); the weak value from explicit spinors; Berry's function
  and the pointer by 60-digit binomial sums (the page: modulus and
  phase, and a Fourier route).

  WHAT IS MODELLED
  ----------------
  A two-level system: no other levels, no motion, no light shift from
  other states.  The drive is classical except in the photons mode
  (one cavity mode, the rotating-wave Jaynes-Cummings coupling, no
  loss).  Decay is Markovian (Lindblad), with pure dephasing as one
  rate.  The pointer is the Weak value article's Gaussian with N
  identical spins; the spot is one-dimensional and scalar.

  KNOWN-BAD: DO NOT REINTRODUCE (details in the Agent repo,
  projects/simulations/CHANGELOG.md)
  ---------------------------------------------------------
  - The Bloch-Siegert shift is in the flop's frequency (the splitting
    of the Floquet states), not in period-averaged populations: the
    time average and the depth of the flop, seen through the 2w
    ripple, stay centred near w0 (they even exceed 1/2 there).
  - The lab frame's Floquet splitting is defined only modulo w: near
    W = w/2 two branches are equally near Rabi's W.  Use the rotating
    frame, whose period is T/2 (modulo 2w), and stop where W nears w.
  - The sum of the pointer's copies (or of f's Fourier terms) cancels
    a^N-fold: compute f as a modulus and a phase, and the pointer by
    whichever exact route has the smaller rounding bound.
  - Canvas text has no subscript w: write Aw, and a^N as a with a
    superscript N; never an underscore or a caret.
-->

  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];

  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];

  oMode:'decay', oOm:5, oDe:0, oGp:0, oT:0.1, oPlay:true, oPre:'own', jField:'coh', jN:3, jNbar:16, jAtom:'e', jDe:0, oTh:0.35, oPh:0.32,
  wAw:6, wTheta:0.5, wPre:'own', wTh:-1.25, wPh:0.3,
  sN:20, sA:4, sX:1.6, sPre:'berry',
  xMode:'pointer', xN:30, xA:4, xSig:1, xPre:'weak'};
const ST=Object.assign({},DEFAULTS);
const LIM={fRatio:[0.005,1], fDet:[-3,3], pTheta:[0,4], pDet:[-3,3], pR:[1,40], oOm:[0.05,30], oDe:[-10,10], oGp:[0,5],
           jN:[0,20], jNbar:[0.1,60], jDe:[-5,5], wAw:[0.1,300], wTheta:[0,TAU], sN:[1,40], sA:[1,6], sX:[0.3,5],
           xN:[1,40], xA:[1,8], xSig:[0.02,20]};
const LOGN=1000;
function logOf(v,lo,hi){ return clamp(Math.round(LOGN*Math.log(v/lo)/Math.log(hi/lo)),0,LOGN); }
function ofLog(u,lo,hi){ return lo*Math.pow(hi/lo,clamp(u,0,LOGN)/LOGN); }
const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the clocks: the flop runs at one Rabi period in 4 s over three; the atom crosses its window in 12 s ---- */
const SIM={t:0};
const FRAME=1/60;
function simReset(){ SIM.t=0; }
function viewAnimates(st){ return (st.view==='flop'&&st.fPlay)||(st.view==='atom'&&st.oPlay); }
function runStep(st){
  if(!viewAnimates(st)) return false;
  SIM.t+=FRAME;
  if(st.view==='flop') st.fT=(st.fT+FRAME/4)%3;
  else st.oT=(st.oT+FRAME/12)%1;
  return true;
}

/* ================================================================== *
 *  the view models                                                    *
 * ================================================================== */
/* the flop: w0 = 1.  The drive's frequency is held at 0.2 w0 or above (a detuning below that is clamped, here in
   the model, and the readout says so) */
function flopParams(st){
  const ratio=st.fRatio, dmin=(0.2-1)/ratio, det=Math.max(st.fDet,dmin);
  const Om=ratio, De=det*ratio, w=1+De, W=rabiW(Om,De);
  return {ratio,det,held:st.fDet<dmin,Om,De,w,W,TR:TAU/W,T:TAU/w,drive:st.fDrive};
}
function flopTraj(p){
  return memo('flopTraj',[p.ratio,p.det,p.drive].join('|'),()=>{
    const J=64, tw=3*p.TR, dt=p.T/J;
    let pts;
    if(p.drive==='lin') pts=linTraj(p.ratio,p.det,tw,J,512).pts;
    else { pts=[]; const n=Math.floor(tw/dt+1e-9); for(let s=0;s<=n;s++) pts.push({t:s*dt,v:labCirc(1,p.Om,p.De,s*dt)}); }
    const n=pts.length, t=new Float64Array(n), pe=new Float64Array(n), r=[], rr=[];
    let dev=0;
    for(let i=0;i<n;i++){ t[i]=pts[i].t; pe[i]=popE(pts[i].v); const b=blochOf(pts[i].v); r.push(b); rr.push(toRot(b,p.w,t[i]));
      dev=Math.max(dev,Math.abs(pe[i]-rabiP(p.Om,p.De,t[i]))); }
    return {t,pe,r,rr,dt,dev};
  });
}
function flopLine(p){
  return memo('flopLine',[p.ratio,p.drive].join('|'),()=>{
    const xs=[], ex=[], ok=[];
    for(let i=0;i<=80;i++){ const x=-3+6*i/80; xs.push(x);
      const valid=lineValid(p.ratio,x)&&1+x*p.ratio>=0.2; ok.push(valid);
      ex.push(!valid?NaN:(p.drive==='lin'?linWeff(p.ratio,x,512)/p.ratio:Math.sqrt(1+x*x))); }
    const res=p.drive==='lin'&&lineValid(p.ratio,p.ratio/4)?linResonance(p.ratio,512):{det:0,weff:p.ratio};
    return {xs,ex,ok,res};
  });
}
function flopView(st){
  const p=flopParams(st), tr=flopTraj(p), line=flopLine(p);
  const tnow=clamp(st.fT,0,3)*p.TR, s=clamp(Math.round(tnow/tr.dt),0,tr.t.length-1);
  return Object.assign(p,{tr,line,tnow,s,pe:tr.pe[s],peRabi:rabiP(p.Om,p.De,tr.t[s]),rNow:tr.r[s],rrNow:tr.rr[s],
    pmax:p.Om*p.Om/(p.W*p.W),bs:p.ratio/4});
}

/* pulses & fringes: Omega = 1, time in 1/Omega */
function pulseView(st){
  const x=st.pDet, th=st.pTheta*PI, R=st.pR, mode=st.pMode, tp=PI/2, T=R*tp;
  const path=[]; let U;
  if(mode==='one'){
    const n=Math.max(60,Math.ceil(90*st.pTheta)); for(let i=0;i<=n;i++) path.push(blochOf(rotState(1,x,th*i/n)));
    U=pulseU(th,x);
  } else {
    let v=KET_G.slice();
    for(let i=0;i<=40;i++) path.push(blochOf(m2app(pulseU(tp*i/40,x),v)));
    v=m2app(pulseU(tp,x),v);
    const nf=Math.max(40,Math.ceil(Math.abs(x)*T*8)); const v1=v.slice();
    for(let i=1;i<=nf;i++) path.push(blochOf(m2app(freeU(T*i/nf,x),v1)));
    v=m2app(freeU(T,x),v1); const v2=v.slice();
    for(let i=1;i<=40;i++) path.push(blochOf(m2app(pulseU(tp*i/40,x),v2)));
    U=ramseyU(x,R);
  }
  const fin=m2app(U,KET_G), P=popE(fin);
  const L=memo('pulseLine',[mode,th,R].join('|'),()=>{
    const span=mode==='one'?4:2.5, xs=[], ys=[], env=[];
    for(let i=0;i<=400;i++){ const q=-span+2*span*i/400; xs.push(q);
      ys.push(mode==='one'?pulseP(th,q):ramseyP(q,R)); env.push(mode==='one'?NaN:pulseP(PI,q)); }
    return {span,xs,ys,env};
  });
  const A=memo('pulseArea',String(x),()=>{ const ts=[], ps=[]; for(let i=0;i<=240;i++){ const t=4*PI*i/240; ts.push(t); ps.push(pulseP(t,x)); } return {ts,ps}; });
  const piHalf=memo('piHalf','',()=>piLineHalf());
  const rh=mode==='ramsey'?memo('ramseyHalf',String(R),()=>ramseyHalf(R)):NaN;
  return {x,th,R,mode,tp,T,path,fin,P,cg:[fin[2],fin[3]],ce:[fin[0],fin[1]],L,A,piFwhm:2*piHalf,rFwhm:2*rh,piOverT:PI/T,piOverTeff:PI/(T+4*tp/PI)};
}

/* a real atom: Gamma = 1 (decay); g = 1, Omega = 2g (photons) */
function jcWindow(st){ if(st.jField==='coh'||st.jField==='therm') return Math.max(12,1.35*TAU*Math.sqrt(st.jNbar)); return 12; }
function jcDistOf(st){ return memo('jcDist',[st.jField,st.jN,st.jNbar].join('|'),()=>fieldDist(st.jField==='vac'?'fock':st.jField,st.jNbar,st.jField==='vac'?0:Math.round(st.jN))); }
function atomView(st){
  if(st.oMode==='decay'){
    const Om=st.oOm, De=st.oDe, gp=st.oGp, win=12, tnow=clamp(st.oT,0,1)*win;
    const tr=memo('obeTraj',[Om,De,gp].join('|'),()=>obeTraj(Om,De,gp,win,600));
    const ss=obeSteady(Om,De,gp), eig=obeEig(Om,De,gp), r=obeAt(Om,De,gp,tnow);
    const W=rabiW(Om,De), mu=Math.abs(eig[2][1]);
    const sp=memo('mollow',[Om,De,gp].join('|'),()=>{ const span=Math.max(W,mu)+6, nus=[]; for(let i=0;i<=400;i++) nus.push(-span+2*span*i/400);
      const S=mollowS(Om,De,gp,nus); const mx=Math.max.apply(null,S); return {nus,S,mx,span}; });
    const G2=0.5+gp, lineF=d=>obeSteady(Om,d,gp).ree, peak=obeSteady(Om,0,gp).ree;
    const hw=bisect(d=>lineF(d)-peak/2,0,1e4);
    const ln=memo('obeLine',[Om,gp].join('|'),()=>{ const span=Math.max(4,2.6*hw), xs=[], ys=[]; for(let i=0;i<=300;i++){ const d=-span+2*span*i/300; xs.push(d); ys.push(lineF(d)); } return {span,xs,ys}; });
    return {mode:'decay',Om,De,gp,win,tnow,tr,ss,eig,r,pe:(1+r[2])/2,W,mu,sp,G2,hw,ln,peak};
  }
  const dist=jcDistOf(st), win=jcWindow(st), tnow=clamp(st.oT,0,1)*win, atom=st.jAtom, De=st.jDe;
  const tr=memo('jcTraj',[st.jField,st.jN,st.jNbar,atom,De].join('|'),()=>{ const ts=[], pe=[], r=[];
    for(let i=0;i<=600;i++){ const t=win*i/600, o=jcAt(dist,atom,De,t); ts.push(t); pe.push(o.pe); r.push(o.r); } return {ts,pe,r}; });
  const now=jcAt(dist,atom,De,tnow);
  let nbar=0; dist.p.forEach((q,n)=>{ nbar+=q*n; });
  return {mode:'photons',field:st.jField,dist,win,tnow,atom,De,tr,pe:now.pe,r:now.r,rlen:Math.hypot(now.r[0],now.r[1],now.r[2]),nbar,
    tc:Math.SQRT2/2,trev:2*PI*Math.sqrt(Math.max(nbar,1e-9))};
}

/* the weak turn: the Weak value article's example, A_w = tan(alpha/2) */
function weakView(st){
  const Aw=st.wAw, al=2*Math.atan(Aw), ov=Math.cos(al/2), th=st.wTheta;
  const A=wvAmp(al,th), ell=[], ph=[];
  for(let i=0;i<=240;i++){ const t=TAU*i/240; ell.push([Math.cos(t/2),-Aw*Math.sin(t/2)]); }
  for(let i=0;i<=240;i++){ const t=PI*i/240; ph.push([t,Math.atan(Aw*Math.tan(t/2))]); }
  return {Aw,al,ov,P:ov*ov,th,A,phase:wvPhase(al,th),pre:[Math.cos(al),0,Math.sin(al)],turned:wvTurned(al,th),ell,ph};
}

/* superoscillation: Berry's f(x) = (cos(x/N) + i a sin(x/N))^N */
function superView(st){
  const N=Math.round(st.sN), a=st.sA, xso=soXso(N,a), X=Math.max(st.sX*xso,PI);
  return memo('super',[N,a,X].join('|'),()=>{
    const n=Math.max(500,Math.ceil(2*X*Math.max(a,1)/TAU*28)), xs=[], re=[], ph=[], fast=[], band=[];
    /* Re f / |f| = cos(arg f): the oscillation with the growing amplitude divided out */
    for(let i=0;i<=n;i++){ const x=-X+2*X*i/n; xs.push(x); re.push(soF(N,a,x)[0]); ph.push(Math.cos(N*Math.atan2(a*Math.sin(x/N),Math.cos(x/N)))); fast.push(Math.cos(a*x)); band.push(Math.cos(x)); }
    const half=N*PI/2, kx=[], k=[], l2=[];
    for(let i=0;i<=300;i++){ const x=half*i/300; kx.push(x); k.push(soK(N,a,x)); l2.push(soLog10Abs2(N,a,x)); }
    const cs=soCoeffs(N,a); let sabs=0; cs.forEach(o=>{ sabs+=Math.abs(o.c); });
    return {N,a,xso,X,xs,re,ph,fast,band,kx,k,l2,cs,sabs,count:soCount(N,a),edge2:Math.pow(a,2*N),half,atEdge:Math.pow(a,N/2)};
  });
}

/* the pointer: N spins each with gamma = 1/N; the spot: Re f in a focal plane */
function pointerView(st){
  const N=Math.round(st.xN), a=st.xA, sig=st.xSig;
  if(st.xMode==='pointer'){
    const S=memo('ptr',[N,a,sig].join('|'),()=>ptrStats(N,a,sig));
    const sweep=memo('ptrSweep',[N,a].join('|'),()=>{ const ss=[], ms=[]; for(let i=0;i<=40;i++){ const s=0.02*Math.pow(1000,i/40); ss.push(s); ms.push(ptrStats(N,a,s).mean); } return {ss,ms}; });
    return {mode:'pointer',N,a,sig,S,sweep,sigW:Math.sqrt(Math.max(a*a-1,0)/(2*N)),lo:-1-4*sig,hi:Math.max(1,a)+4*sig};
  }
  return memo('spot',[N,a].join('|'),()=>{
    const h=spotHalf(N,a), hs=sincHalf(), half=N*PI/2, xs=[], lg=[], zx=[], zy=[], zs=[];
    for(let i=0;i<=600;i++){ const x=half*i/600, e=soF(N,a,x)[0]; xs.push(x); lg.push(Math.log10(Math.max(e*e,1e-300))); }
    const Z=Math.max(PI,4*h);
    for(let i=0;i<=500;i++){ const x=-Z+2*Z*i/500, e=soF(N,a,x)[0]; zx.push(x); zy.push(e*e); zs.push(x===0?1:Math.pow(Math.sin(x)/x,2)); }
    return {mode:'spot',N,a,fwhm:2*h,sincFwhm:2*hs,xs,lg,zx,zy,zs,Z,half,side2:Math.pow(a,2*N)};
  });
}
function buildModel(){
  const v=ST.view, M={view:v};
  if(v==='flop') M.F=flopView(ST);
  else if(v==='pulse') M.P=pulseView(ST);
  else if(v==='atom') M.O=atomView(ST);
  else if(v==='weak') M.W=weakView(ST);
  else if(v==='super') M.S=superView(ST);
  else M.X=pointerView(ST);
  return M;
}

/* ================================================================== *
 *  formatting and the panels                                          *
 * ================================================================== */
function pct(x,n){ return isFinite(x)?(x<0?'−':'')+fmt(Math.abs(100*x),n===undefined?1:n)+' %':'—'; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function presetName(list,id){ const p=(list||[]).find(q=>q.id===id); return p?p.name:'your own'; }
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹', supN=n=>String(n).split('').map(c=>c==='-'?'⁻':SUPD[+c]).join('');
/* a signed number with a true minus sign */
function sgn(x,n){ return isFinite(x)?(x<0?'−':'')+fmt(Math.abs(x),n):'—'; }
function cplx(z,n){ return sgn(z[0],n)+(z[1]<0?' − ':' + ')+fmt(Math.abs(z[1]),n)+'i'; }
function piOf(th,n){ return fmt(th/PI,n===undefined?2:n)+' &pi;'; }
function degOf(al,n){ return fmt(al*180/PI,n===undefined?2:n)+'&deg;'; }
/* 1 in N for a small probability, never a raw exponent */
function oneIn(p){ if(p>0.5) return pct(p,1); const n=1/p; return '1 in '+(n<1e6?Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','):sigf(n,3)); }

function readoutHTML(M){
  let s='';
  if(M.view==='flop'){ const F=M.F;
    s+='<div class="rname">the flop<small>'+(F.drive==='lin'?'a linear field':'Rabi&rsquo;s rotating field')+', &Omega;/&omega;<sub>0</sub> = '+sigf(F.ratio,3)+'</small></div><table>';
    s+=hd('the drive')+rrow('&Omega;/&omega;<sub>0</sub>',sigf(F.ratio,3))+rrow('&Delta;/&Omega;',sgn(F.det,2)+(F.held?' (held)':''))
      +rrow('W = &radic;(&Omega;&sup2; + &Delta;&sup2;)',sigf(F.W/F.Om,4)+' &Omega;')+rrow('one flop',sigf(F.TR/F.T,4)+' drive periods');
    s+=hd('at t = '+fmt(ST.fT,2)+' flops')+rrow('P<sub>e</sub>, exact',fmt(F.pe,4),'good')+rrow('Rabi&rsquo;s formula',fmt(F.peRabi,4))
      +rrow('the most it reaches, &Omega;&sup2;/W&sup2;',fmt(F.pmax,4));
    s+=hd('the resonance')+rrow('Bloch&ndash;Siegert, &Omega;/4&omega;<sub>0</sub>',sigf(F.bs,3)+' &Omega;')
      +rrow('the slowest flop, found',F.drive==='lin'?sgn(F.line.res.det,4)+' &Omega;':'at &Delta; = 0 (exact)','good')
      +rrow('Rabi&rsquo;s formula misses by up to',fmt(F.tr.dev,4),F.tr.dev>0.05?'bad':'');

  } else if(M.view==='pulse'){ const P=M.P;
    s+='<div class="rname">pulses &amp; fringes<small>'+(P.mode==='one'?'one pulse of area '+piOf(P.th):'Ramsey: two &pi;/2 pulses, T = '+fmt(P.R,1)+' &tau;')+'</small></div><table>';
    s+=hd('the sequence')+(P.mode==='one'?rrow('area &theta; = &Omega;&tau;',piOf(P.th)):rrow('free flight T',fmt(P.T,3)+' /&Omega;'))
      +rrow('&Delta;/&Omega;',sgn(P.x,2))+rrow('P<sub>e</sub> after it',fmt(P.P,4),'good')+rrow('c<sub>g</sub> after it',cplx(P.cg,3))+rrow('c<sub>e</sub> after it',cplx(P.ce,3));

    s+='</table><div class="note">'+noteFor('pulse')+'</div>';
  } else if(M.view==='atom'){ const O=M.O;
    if(O.mode==='decay'){
      s+='<div class="rname">a real atom<small>it decays: &Omega; = '+sigf(O.Om,3)+' &Gamma;</small></div><table>';
      s+=hd('the drive')+rrow('&Omega;/&Gamma;, &Delta;/&Gamma;',sigf(O.Om,3)+', '+sgn(O.De,2))+rrow('&gamma;<sub>&phi;</sub>/&Gamma;',fmt(O.gp,2))
        +rrow('T<sub>1</sub>, T<sub>2</sub>','1, '+fmt(1/O.G2,3)+' /&Gamma;');
      s+=hd('at &Gamma;t = '+fmt(O.tnow,2))+rrow('P<sub>e</sub>',fmt(O.pe,4),'good')+rrow('the steady state &rho;<sub>ee</sub>',fmt(O.ss.ree,4))
        +rrow('its line&rsquo;s FWHM',sigf(2*O.hw,4)+' &Gamma;');
      s+=hd('the fluorescence')+rrow('sidebands at &plusmn;',sigf(O.mu,4)+' &Gamma;')+rrow('their decay',sigf(-O.eig[2][0],3)+' &Gamma;');
    } else {
      s+='<div class="rname">a real atom<small>photons: '+presetName(FIELD_LIST,O.field).toLowerCase()+'</small></div><table>';
      s+=hd('the field')+rrow('&lang;n&rang;',fmt(O.nbar,3))+rrow('the atom starts',O.atom==='e'?'excited':'in its ground state')+rrow('&Delta;/g',sgn(O.De,2));
      s+=hd('at gt = '+fmt(O.tnow,2))+rrow('P<sub>e</sub>',fmt(O.pe,4),'good')+rrow('the atom&rsquo;s Bloch vector',fmt(O.rlen,3)+' long');
      if(O.field==='coh') s+=hd('a coherent field')+rrow('collapse &radic;2/&Omega;',fmt(O.tc,3)+' /g')+rrow('revival (4&pi;/&Omega;)&radic;&lang;n&rang;',fmt(O.trev,3)+' /g');
    }

  } else if(M.view==='weak'){ const W=M.W;

    s+=hd('turned by &theta; about z')+rrow('&theta;',fmt(W.th,3)+' rad')+rrow('&lang;f|U|i&rang;',cplx(W.A,4))

  } else if(M.view==='super'){ const S=M.S;
    s+='<div class="rname">superoscillation<small>N = '+S.N+', a = '+fmt(S.a,2)+'</small></div><table>';

    s+='</table><div class="note">'+noteFor('super')+'</div>';
  } else { const X=M.X;
    if(X.mode==='pointer'){
      s+='<div class="rname">the pointer<small>'+X.N+' spin'+(X.N>1?'s':'')+', A<sub>w</sub> = '+fmt(X.a,2)+', &sigma; = '+sigf(X.sig,3)+'</small></div><table>';
      s+=hd('the pointer')+rrow('each spin moves it by','&plusmn;1/N')+rrow('so every copy lies in','[&minus;1, 1]')
        +rrow('it lands at &lang;q&rang;',fmt(X.S.mean,3),'good')+rrow('the weak value',fmt(X.a,3))+rrow('weak when &sigma; &gt;&gt;',sigf(X.sigW,3));
      s+=hd('the price')+rrow('the post-selection succeeds',X.S.Ppost>1e-300?oneIn(X.S.Ppost):'less than 1 in 10'+supN(300),'bad')+rrow('digits kept by the sum',fmt(X.S.digits,1));

 *  drawing helpers shared by the views (y is UP in the world, so the  *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';

function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }

/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';

function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }

function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);

function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }

function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;

  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);

/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }

}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;

    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];

function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){

function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){

  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  /* the corner: an x tick at the left edge and a y tick at the bottom edge put their labels on each other
     (loop_quantum_gravity's Known-bad); the y tick gives way */
  const Xof=t=>b.x+b.w*(t-xlo)/(xhi-xlo||1), Yof=t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1);
  if(xt.some(t=>Math.abs(Xof(t)-b.x)<16)) yt=yt.filter(t=>Math.abs(Yof(t)-b.y1)>=7);
  o.xticks=xt; o.yticks=yt;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  the Bloch sphere and the plot furniture                            *
 * ================================================================== */
let HIT=[], W_STAGE=1100, H_STAGE=712;
/* marker lines (a test can see a label drawn across one) and keys that found no room */
let MARKS=[], KEY_DROPS=0;
/* a narrow stage keeps one plot under its picture, a small one (under 520 px tall) none */
const nbNarrow=H=>H<520?0:1;
/* so a narrow stage's caption describes the main picture only: the plots it names below may not be there */
const capFor=(W,c)=>isNarrow(W)?{full:c.main,short:c.mainShort}:c;

/* the sphere: a camera 3.4 radii out, so the axes (to 1.28) and their labels stay inside the box at any turn */
function sphereCam(b,th,ph){ return boxCamera(b,th,ph,3.4,[0,0,0]); }
function eyeDir(C){ const e=C.B.eye, n=Math.hypot(e[0],e[1],e[2]); return [e[0]/n,e[1]/n,e[2]/n]; }
function circ3(u,v,r,n){ const out=[]; r=r||1; n=n||96;
  for(let i=0;i<=n;i++){ const t=TAU*i/n, c=Math.cos(t)*r, s=Math.sin(t)*r; out.push([c*u[0]+s*v[0],c*u[1]+s*v[1],c*u[2]+s*v[2]]); }
  return out; }
/* a 3-D path split where it passes behind the plane through the centre facing the eye: the far part thinner and
   fainter (a depth cue that needs no z-buffer) */
function path3D(ctx,C,pts,col,lw,norec){
  const ed=eyeDir(C); let cur=null, run=[], n=0;
  const flush=()=>{ if(run.length>1) n+=poly3(ctx,C,run,cur?col:rgba(col,0.3),cur?lw:Math.max(0.8,lw*0.65),null,norec); };
  for(const p of pts){ const front=p[0]*ed[0]+p[1]*ed[1]+p[2]*ed[2]>=0;
    if(cur===null) cur=front;
    if(front!==cur){ run.push(p); flush(); cur=front; run=[p]; } else run.push(p); }
  flush(); return n;
}
function arrow3(ctx,C,a,b,col,lw){
  const p=C.P(a), q=C.P(b); if(!p||!q) return;
  arrowPx(ctx,p.x,p.y,q.x,q.y,col,lw||2);
}
/* the sphere: a faint body, the equator and two meridians, the axes; |e> at the top, |g> at the bottom */
function drawSphere(ctx,C,o){
  o=o||{};
  const B=C.B, sil=circ3(B.right,B.up,1,120);
  ctx.beginPath(); sil.forEach((p,i)=>{ const q=C.P(p); if(i===0) ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y); });
  ctx.fillStyle='rgba(90,200,224,0.045)'; ctx.fill();
  poly3(ctx,C,sil,'#2c3654',1.2,null,true);
  path3D(ctx,C,circ3([1,0,0],[0,1,0]),'#44527a',1.1,true);
  path3D(ctx,C,circ3([1,0,0],[0,0,1]),'#34405e',0.9,true);
  path3D(ctx,C,circ3([0,1,0],[0,0,1]),'#34405e',0.9,true);
  for(const a of [[1,0,0],[0,1,0],[0,0,1]]) path3D(ctx,C,[[-a[0],-a[1],-a[2]],[1.28*a[0],1.28*a[1],1.28*a[2]]],'#3f6f86',1,true);
  const L=(p,t,col)=>{ const q=C.P(p); if(q) lab(ctx,W_STAGE,H_STAGE,q.x,q.y,t,col||'#7f97b0',SM_FONT,'center','middle',PLATE); };
  if(!o.noLabels){ L([1.42,0,0],'x'); L([0,1.42,0],'y'); L([0,0,1.24],'|e⟩','#aeb6c6'); L([0,0,-1.24],'|g⟩','#aeb6c6'); }
}
/* a titled sphere in a box: the title top-left, the camera, the drag target */
function sphereBox(ctx,b,th,ph,title){
  lab(ctx,W_STAGE,H_STAGE,b.x+4,b.y+2,title,'#aeb6c6','italic 13px Georgia, serif','left','top');
  const bb=box(b.x,b.y+18,b.w,Math.max(40,b.h-18));
  const C=sphereCam(bb,th,ph); drawSphere(ctx,C);
  HIT.push({kind:'cam',b:bb});
  return C;
}
/* a key on a plot's title line, at its right: [[colour, text, dash]]; it may reach back to the end of the title
   actually drawn (titleFor picks the short one on a narrow plot) */
function keyRow(ctx,b,items,title){
  ctx.font=SM_FONT; let x=b.x1; const y=b.y-15, minX=title?b.x+plain(title).length*13*0.52+14:b.x+b.w*0.45;
  for(let i=items.length-1;i>=0;i--){ const [col,t,dash]=items[i], w=plain(t).length*10.5*0.52;
    x-=w+26;
    if(x<minX){ KEY_DROPS+=i+1; return; }
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+16,y); ctx.strokeStyle=col; ctx.lineWidth=2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    if(!lab(ctx,W_STAGE,H_STAGE,x+20,y,t,'#9aa2b4',SM_FONT,'left','middle',{fixed:true})) KEY_DROPS++;
    x-=4;
  }
}
function xOf(b,lo,hi,v){ return b.x+b.w*(v-lo)/(hi-lo||1); }
function yOf(b,lo,hi,v){ return b.y1-b.h*(v-lo)/(hi-lo||1); }
/* a vertical marker line inside a plot (recorded, so a test can find a label it crosses) */
function vmark(ctx,b,xlo,xhi,x,col,dash,lw){
  const X=xOf(b,xlo,xhi,x); if(!(X>=b.x-0.5&&X<=b.x1+0.5)) return null;
  ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.strokeStyle=col; ctx.lineWidth=lw||1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  MARKS.push({X,y0:b.y,y1:b.y1,seq:++DRAW_SEQ}); return X;
}
function hmark(ctx,b,ylo,yhi,y,col,dash,lw){
  const Y=yOf(b,ylo,yhi,y); if(!(Y>=b.y-0.5&&Y<=b.y1+0.5)) return null;
  ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.strokeStyle=col; ctx.lineWidth=lw||1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(b.x,Y,b.x1,Y); return Y;
}
/* a shaded vertical band from x0 to x1, clipped to the box */
function xband(ctx,b,xlo,xhi,x0,x1,fill){
  const X0=clamp(xOf(b,xlo,xhi,Math.min(x0,x1)),b.x,b.x1), X1=clamp(xOf(b,xlo,xhi,Math.max(x0,x1)),b.x,b.x1);
  if(X1-X0<0.5) return; ctx.fillStyle=fill; ctx.fillRect(X0,b.y,X1-X0,b.h);
}
/* every k-th sample, so a curve of any length is drawn with at most n points */
function thin(n,max){ const k=Math.max(1,Math.ceil(n/max)), out=[]; for(let i=0;i<n;i+=k) out.push(i); if(out[out.length-1]!==n-1) out.push(n-1); return out; }
/* tick labels with as many decimals as the tick step needs (half-unit steps printed as whole numbers read -1, -1, 0) */
function adFmt(lo,hi,n,signed){ const t=ticksFor(Math.min(lo,hi),Math.max(lo,hi),n), st=t.length>1?Math.abs(t[1]-t[0]):1;
  const d=clamp(-Math.floor(Math.log10(st)+1e-9),0,3); return v=>signed?sgnT(v,d):fmt(v,d); }
/* ten to an integer power, with superscript digits, never a caret */
function p10(t){ return Math.abs(t-Math.round(t))<1e-9?'10'+supN(Math.round(t)):sigf(Math.pow(10,t),2); }
/* integer ticks for a log10 axis, thinned to at most n */
function logTicksI(lo,hi,n){ const a=Math.ceil(lo-1e-9), b=Math.floor(hi+1e-9), step=Math.max(1,Math.ceil((b-a+1)/(n||6))), out=[];
  for(let t=a;t<=b;t+=step) out.push(t); return out.length?out:[Math.round(lo)]; }
/* stems from the axis floor up to each value: green where the coefficient is positive, magenta where it is negative */
function stems(ctx,b,xlo,xhi,ylo,yhi,xs,ys,signs,lw){
  for(let i=0;i<xs.length;i++){ const X=xOf(b,xlo,xhi,xs[i]); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const Y=clamp(yOf(b,ylo,yhi,ys[i]),b.y,b.y1);
    ctx.beginPath(); ctx.moveTo(X,b.y1); ctx.lineTo(X,Y); ctx.strokeStyle=signs[i]<0?COL.neg:COL.pos; ctx.lineWidth=lw||1.6; ctx.stroke();
    POLY_SEGS.push(X,b.y1,X,Y); }
}

/* ================================================================== *
 *  views 1-3: the flop, pulses & fringes, a real atom                 *
 * ================================================================== */
const TITLE_FONT='italic 13px Georgia, serif';
function sgnT(v,n){ return (v<0?'−':'')+fmt(Math.abs(v),n); }

/* ---------------- the flop ---------------- */
function flopCaption(F){
  const turns=F.W>0?F.w/F.W:0;
  const main='Left, the atom in the lab: the drive tilts its Bloch vector slowly from |g⟩ towards |e⟩ while it precesses about z, '
    +sigf(turns,3)+' turns per flop (the last 30 drawn). Right, the same vector seen from a frame turning with the drive: there it only circles the axis B = (Ω, 0, −Δ), '
    +(Math.abs(F.det)<1e-9?'on resonance a great circle through both poles.':'off resonance a smaller circle that never reaches |e⟩.');
  const full=main+' Below, the population of |e⟩ '+(F.drive==='lin'?'integrated in the lab (green) against Rabi’s formula (orange), and the flop’s own frequency against the detuning: slowest at the true resonance, which Bloch and Siegert moved by Ω²/4ω₀.'
      :'in Rabi’s rotating field, where his formula is exact, and the flop’s frequency, W = √(Ω² + Δ²).');
  return {full,short:'Left the lab, right the frame turning with the drive; below Pₑ(t) and the flop’s frequency.',main,mainShort:'Left the lab, right the frame turning with the drive.'};
}
function drawFlop(ctx,W,H,M){
  const F=M.F, cap=capFor(W,flopCaption(F)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  const m=Lay.main, hw=(m.w-16)/2;
  drawFlopSphere(ctx,box(m.x,m.y,hw,m.h),F,'lab');
  drawFlopSphere(ctx,box(m.x+hw+16,m.y,hw,m.h),F,'rot');
  if(Lay.bottom[0]) plotFlopPe(ctx,Lay.bottom[0],F);
  if(Lay.bottom[1]) plotFlopLine(ctx,Lay.bottom[1],F);
  drawCaption(ctx,Lay);
}
function drawFlopSphere(ctx,b,F,which){
  const C=sphereBox(ctx,b,ST.fTh,ST.fPh,which==='lab'?'in the lab':'turning with the drive');
  const tr=F.tr, s=F.s, t=tr.t[s];
  if(which==='lab'){
    const i0=Math.max(0,s-30*64), idx=thin(s-i0+1,1400).map(k=>k+i0);
    path3D(ctx,C,idx.map(i=>tr.r[i]),COL.pos,1.1);
    const c=Math.cos(F.w*t), sn=Math.sin(F.w*t), fld=F.drive==='lin'?[0.8*c,0,0]:[0.8*c,0.8*sn,0];
    arrow3(ctx,C,[0,0,0],fld,COL.ref,1.8);
    arrow3(ctx,C,[0,0,0],F.rNow,COL.pos,2.4);
    const q=C.P(fld); if(q) lab(ctx,W_STAGE,H_STAGE,q.x+8,q.y,'the field',COL.ref,SM_FONT,'left','middle',PLATE);
  } else {
    const idx=thin(s+1,1400);
    path3D(ctx,C,idx.map(i=>tr.rr[i]),COL.pos,1.4);
    const Bh=[F.Om/F.W,0,-F.De/F.W];
    path3D(ctx,C,[[-Bh[0],-Bh[1],-Bh[2]],[0,0,0]],COL.ref,1,true);
    arrow3(ctx,C,[0,0,0],[1.18*Bh[0],1.18*Bh[1],1.18*Bh[2]],COL.ref,1.8);
    const q=C.P([1.3*Bh[0],1.3*Bh[1],1.3*Bh[2]]); if(q) lab(ctx,W_STAGE,H_STAGE,q.x,q.y,'B',COL.ref,LAB_FONT,'center','middle',PLATE);
    arrow3(ctx,C,[0,0,0],F.rrNow,COL.pos,2.4);
  }
}
function plotFlopPe(ctx,b,F){
  const tr=F.tr, n=tr.t.length, TR=F.TR;
  const ttl=titleFor(b,'Pₑ(t), exact and by Rabi’s formula','Pₑ(t)');
  axesT(ctx,b,0,3,0,1.05,{title:ttl,xlab:'t (flops)',ylab:'Pₑ',nx:6,ny:4,xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,1),yticks:[0,0.5,1]});
  const xs=[], ys=[]; for(let i=0;i<=600;i++){ const tt=3*TR*i/600; xs.push(3*i/600); ys.push(rabiP(F.Om,F.De,tt)); }
  const idx=thin(n,2400);
  polyline(ctx,b,idx.map(i=>tr.t[i]/TR),idx.map(i=>tr.pe[i]),0,3,0,1.05,COL.pos,1.5);
  polyline(ctx,b,xs,ys,0,3,0,1.05,COL.ref,1.4,[6,4]);
  keyRow(ctx,b,[[COL.pos,'exact'],[COL.ref,'Rabi’s formula',[6,4]]],ttl);
  vmark(ctx,b,0,3,ST.fT,COL.live,[3,3]);
  marker(ctx,b,0,3,0,1.05,ST.fT,F.pe,COL.live);
  HIT.push({kind:'fT',b});
}
function plotFlopLine(ctx,b,F){
  const L=F.line, ymax=Math.sqrt(10)*1.05;
  const ttl=titleFor(b,'the flop’s frequency against the detuning','its frequency');
  axesT(ctx,b,-3,3,0,ymax,{title:ttl,xlab:'Δ/Ω',ylab:'W/Ω',nx:6,ny:3,xfmt:v=>sgnT(v,0),yfmt:v=>fmt(v,0)});
  /* where the flop is as fast as the drive itself there is no slow flop to speak of: shaded, no curve */
  let i0=-1;
  for(let i=0;i<=L.xs.length;i++){ const bad=i<L.xs.length&&!L.ok[i];
    if(bad&&i0<0) i0=i; if(!bad&&i0>=0){ xband(ctx,b,-3,3,L.xs[i0],L.xs[Math.min(i,L.xs.length-1)],'rgba(139,147,166,0.10)'); i0=-1; } }
  polyline(ctx,b,L.xs,L.xs.map(x=>Math.sqrt(1+x*x)),-3,3,0,ymax,COL.ref,1.4,[6,4]);
  if(F.drive==='lin') polyline(ctx,b,L.xs,L.ex,-3,3,0,ymax,COL.pos,1.7);
  const Xb=vmark(ctx,b,-3,3,F.bs,COL.live,[3,3]);
  vmark(ctx,b,-3,3,F.det,'#6f7789',[2,3]);
  if(F.drive==='lin') marker(ctx,b,-3,3,0,ymax,L.res.det,L.res.weff/F.ratio,COL.pos);
  if(Xb!==null) lab(ctx,W_STAGE,H_STAGE,Xb+4,b.y+9,'Ω/4ω₀','#d98fd4',SM_FONT,'left','middle',PLATE);
  keyRow(ctx,b,[[COL.pos,'exact'],[COL.ref,'Rabi’s W',[6,4]]],ttl);
  HIT.push({kind:'fDet',b});
}

/* ---------------- pulses & fringes ---------------- */
function pulseCaption(P){
  const one='The sphere turns the atom about B = (Ω, 0, −Δ) for a time τ, through the angle θ = Ωτ on resonance: a π pulse carries |g⟩ to |e⟩, a π/2 pulse to the equator, a 2π pulse back to |g⟩, where the amplitude of |g⟩ (right) has turned over to −1.';
  const ram='Ramsey’s method: a π/2 pulse, a free flight of T = '+fmt(P.R,1)+' τ in which the vector turns about z at the detuning Δ, and a second π/2 pulse.';
  const full=P.mode==='one'?one+' Below, the line such a pulse makes against the detuning, and the flop against the pulse’s area at this detuning.'
    :ram+' The fringes (below, green) sit under the line of one π pulse (orange) and are as narrow as π/T, however short the pulses.';
  return {full,short:P.mode==='one'?'One pulse turns the atom about B; below, its line and the flop against its area.':'Ramsey: two π/2 pulses T apart; below, the fringes.',
    main:P.mode==='one'?one:ram+' Right, the two amplitudes it ends with.',mainShort:P.mode==='one'?'One pulse turns the atom about B through its area θ.':'Ramsey: two π/2 pulses T apart.'};
}
function drawPulse(ctx,W,H,M){
  const P=M.P, cap=capFor(W,pulseCaption(P)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  const m=Lay.main, ws=Math.floor(m.w*0.56);
  const C=sphereBox(ctx,box(m.x,m.y,ws,m.h),ST.pTh,ST.pPh,P.mode==='one'?'one pulse':'Ramsey’s sequence');
  path3D(ctx,C,P.path,COL.pos,1.8);
  const Bv=[1,0,-P.x], Bn=Math.hypot(1,P.x), Bh=[Bv[0]/Bn,0,Bv[2]/Bn];
  arrow3(ctx,C,[0,0,0],[1.18*Bh[0],0,1.18*Bh[2]],COL.ref,1.6);
  const qb=C.P([1.3*Bh[0],0,1.3*Bh[2]]); if(qb) lab(ctx,W_STAGE,H_STAGE,qb.x,qb.y,'B',COL.ref,LAB_FONT,'center','middle',PLATE);
  arrow3(ctx,C,[0,0,0],blochOf(P.fin),COL.pos,2.4);
  drawAmps(ctx,box(m.x+ws+14,m.y,m.w-ws-14,m.h),P);
  if(Lay.bottom[0]) plotPulseLine(ctx,Lay.bottom[0],P);
  if(Lay.bottom[1]) plotPulseArea(ctx,Lay.bottom[1],P);
  drawCaption(ctx,Lay);
}
/* the two amplitudes as arrows in their unit circles (equal aspect: an angle drawn is the angle) */
function drawAmps(ctx,b,P){
  lab(ctx,W_STAGE,H_STAGE,b.x+4,b.y+2,'the amplitudes','#aeb6c6',TITLE_FONT,'left','top');
  const r=Math.max(12,Math.min((b.w-30)/4.6,(b.h-60)/2.6)), cy=b.y+20+r*1.25;
  [[P.cg,'of |g⟩',COL.struct],[P.ce,'of |e⟩',COL.pos]].forEach(([z,t,col],i)=>{
    const cx=b.x+b.w*(i===0?0.27:0.73);
    ctx.beginPath(); for(let k=0;k<=96;k++){ const a=TAU*k/96, X=cx+r*Math.cos(a), Y=cy-r*Math.sin(a); if(k===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }
    ctx.strokeStyle='#2c3654'; ctx.lineWidth=1.1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-r*1.12,cy); ctx.lineTo(cx+r*1.12,cy); ctx.moveTo(cx,cy-r*1.12); ctx.lineTo(cx,cy+r*1.12); ctx.strokeStyle='#232a3c'; ctx.lineWidth=1; ctx.stroke();
    arrowPx(ctx,cx,cy,cx+r*z[0],cy-r*z[1],col,2.2);
    lab(ctx,W_STAGE,H_STAGE,cx,cy+r*1.12+12,'the amplitude '+t,col,SM_FONT,'center','middle',PLATE);
    lab(ctx,W_STAGE,H_STAGE,cx,cy+r*1.12+27,sgnT(z[0],3)+(z[1]<0?' − ':' + ')+fmt(Math.abs(z[1]),3)+'i','#9aa2b4',SM_FONT,'center','middle',PLATE);
  });
}
function plotPulseLine(ctx,b,P){
  const L=P.L, sp=L.span;
  const ttl=titleFor(b,P.mode==='one'?'the line of one pulse':'Ramsey’s fringes','the line');
  axesT(ctx,b,-sp,sp,0,1.05,{title:ttl,xlab:'Δ/Ω',ylab:'Pₑ',nx:6,ny:4,xfmt:v=>sgnT(v,1),yfmt:v=>fmt(v,1),yticks:[0,0.5,1]});
  if(P.mode==='ramsey') polyline(ctx,b,L.xs,L.env,-sp,sp,0,1.05,COL.ref,1.3,[6,4]);
  polyline(ctx,b,L.xs,L.ys,-sp,sp,0,1.05,COL.pos,1.6);
  if(P.mode==='ramsey') keyRow(ctx,b,[[COL.pos,'two π/2'],[COL.ref,'one π',[6,4]]],ttl);
  vmark(ctx,b,-sp,sp,P.x,COL.live,[3,3]);
  marker(ctx,b,-sp,sp,0,1.05,P.x,P.P,COL.live);
  HIT.push({kind:'pDet',b,span:sp});
}
function plotPulseArea(ctx,b,P){
  const A=P.A;
  axesT(ctx,b,0,4,0,1.05,{title:titleFor(b,'the flop against the pulse’s area','against the area'),xlab:'θ/π',ylab:'Pₑ',nx:4,ny:4,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1),xticks:[0,1,2,3,4],yticks:[0,0.5,1]});
  for(const [q,t] of [[0.5,'π/2'],[1,'π'],[2,'2π']]){ const X=vmark(ctx,b,0,4,q,'#3b4560',[2,3]);
    if(X!==null) lab(ctx,W_STAGE,H_STAGE,X+3,b.y+9,t,'#7f879a',SM_FONT,'left','middle',PLATE); }
  polyline(ctx,b,A.ts.map(t=>t/PI),A.ps,0,4,0,1.05,COL.pos,1.6);
  if(P.mode==='one'){ vmark(ctx,b,0,4,ST.pTheta,COL.live,[3,3]); marker(ctx,b,0,4,0,1.05,ST.pTheta,P.P,COL.live); }
  HIT.push({kind:'pTheta',b});
}

/* ---------------- a real atom ---------------- */
function atomCaption(O){
  if(O.mode==='decay'){ const main='The atom now loses its excitation at the rate Γ and its phase at Γ/2 + γφ: the Bloch vector spirals in from |g⟩ to a steady state inside the sphere (orange), less than half excited however hard it is driven. Right, the light it scatters: '
      +(O.Om>2?'three lines, the Mollow triplet, with sidebands at the Rabi frequency.':'a single line at weak drive, which splits into the Mollow triplet as the drive grows.');
    return {full:main+' Below, Pₑ(t) against the undamped flop, and the steady state against the detuning, broadened by the drive itself.',
      short:'A decaying atom: the spiral to its steady state, the scattered light, Pₑ(t) and the line.',main,mainShort:'A decaying atom: the spiral to its steady state, and the light it scatters.'}; }
  const lead='The field is now quantized: an atom in '+presetName(FIELD_LIST,O.field)+' exchanges one photon with it at 2g√(n + 1) for n photons. '
      +(O.field==='coh'?'The photon numbers of a coherent field flop at different rates, dephase (the collapse) and rephase (the revival).':O.field==='therm'?'A thermal field’s broad spread of n makes the flops wash out.':'With a definite n the flop is clean.')
      +' The atom’s own Bloch vector (left) is shorter than 1 whenever the atom is entangled with the field';
  return {full:lead+' (its length, below right); right, the field’s photon numbers.',
    short:'An atom in a quantized field: its Bloch vector, the photon numbers, Pₑ(t) and the vector’s length.',
    main:lead+'; right, the field’s photon numbers.',mainShort:'An atom in a quantized field: its Bloch vector and the photon numbers.'};
}
function drawAtom(ctx,W,H,M){
  const O=M.O, cap=capFor(W,atomCaption(O)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  const m=Lay.main, ws=Math.floor(m.w*0.5);
  const C=sphereBox(ctx,box(m.x,m.y,ws,m.h),ST.oTh,ST.oPh,O.mode==='decay'?'the Bloch vector, decaying':'the atom’s Bloch vector');
  const rb=box(m.x+ws+62,m.y+26,m.w-ws-78,m.h-60);
  if(O.mode==='decay'){
    const n=Math.round(clamp(ST.oT,0,1)*600);
    path3D(ctx,C,O.tr.slice(0,n+1).map(p=>p.r),COL.pos,1.5);
    const Bh=[O.Om/O.W,0,-O.De/O.W];
    arrow3(ctx,C,[0,0,0],[1.15*Bh[0],0,1.15*Bh[2]],COL.ref,1.4);
    const ssq=C.P([O.ss.x,O.ss.y,O.ss.z]); if(ssq){ dot(ctx,ssq.x,ssq.y,4.5,COL.ref,'#fff'); lab(ctx,W_STAGE,H_STAGE,ssq.x+8,ssq.y,'steady',COL.ref,SM_FONT,'left','middle',PLATE); }
    arrow3(ctx,C,[0,0,0],O.r,COL.pos,2.4);
    if(rb.w>90&&rb.h>60) plotMollow(ctx,rb,O);
    if(Lay.bottom[0]) plotAtomPe(ctx,Lay.bottom[0],O);
    if(Lay.bottom[1]) plotObeLine(ctx,Lay.bottom[1],O);
  } else {
    const n=Math.round(clamp(ST.oT,0,1)*600);
    path3D(ctx,C,O.tr.r.slice(0,n+1),COL.pos,1.3);
    arrow3(ctx,C,[0,0,0],O.r,COL.pos,2.4);
    if(rb.w>90&&rb.h>60) plotPhotons(ctx,rb,O);
    if(Lay.bottom[0]) plotAtomPe(ctx,Lay.bottom[0],O);
    if(Lay.bottom[1]) plotRlen(ctx,Lay.bottom[1],O);
  }
  drawCaption(ctx,Lay);
}
function plotMollow(ctx,b,O){
  const sp=O.sp, s=sp.span;
  axesT(ctx,b,-s,s,0,1.05,{title:titleFor(b,'the light it scatters (largest 1)','the light'),xlab:'ν/Γ (from the drive)',ylab:'S',nx:5,ny:4,xfmt:v=>sgnT(v,0),yfmt:v=>fmt(v,1),yticks:[0,0.5,1]});
  for(const q of [-O.mu,O.mu]) vmark(ctx,b,-s,s,q,COL.live,[3,3]);
  polyline(ctx,b,sp.nus,sp.S.map(v=>v/sp.mx),-s,s,0,1.05,COL.pos,1.6);
}
function plotAtomPe(ctx,b,O){
  if(O.mode==='decay'){
    const ts=O.tr.map(p=>p.t), pe=O.tr.map(p=>(1+p.r[2])/2), rb=ts.map(t=>rabiP(O.Om,O.De,t));
    const ttl=titleFor(b,'Pₑ(t) with decay','Pₑ(t)');
    axesT(ctx,b,0,O.win,0,1.05,{title:ttl,xlab:'Γt',ylab:'Pₑ',nx:6,ny:4,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1),yticks:[0,0.5,1]});
    hmark(ctx,b,0,1.05,O.ss.ree,COL.struct,[2,3]);
    polyline(ctx,b,ts,rb,0,O.win,0,1.05,COL.ref,1.2,[6,4]);
    polyline(ctx,b,ts,pe,0,O.win,0,1.05,COL.pos,1.6);
    keyRow(ctx,b,[[COL.pos,'with decay'],[COL.ref,'without',[6,4]]],ttl);
  } else {
    axesT(ctx,b,0,O.win,0,1.05,{title:titleFor(b,'Pₑ(gt)','Pₑ'),xlab:'gt',ylab:'Pₑ',nx:6,ny:4,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1),yticks:[0,0.5,1]});
    if(O.field==='coh'){ const X1=vmark(ctx,b,0,O.win,O.tc,COL.live,[3,3]), X2=vmark(ctx,b,0,O.win,O.trev,COL.live,[3,3]);
      if(X2!==null) lab(ctx,W_STAGE,H_STAGE,X2+3,b.y+9,'the revival','#b98fc0',SM_FONT,'left','middle',PLATE); }
    polyline(ctx,b,O.tr.ts,O.tr.pe,0,O.win,0,1.05,COL.pos,1.3);
  }
  vmark(ctx,b,0,O.win,O.tnow,'#6f7789',[2,3]);
  marker(ctx,b,0,O.win,0,1.05,O.tnow,O.pe,COL.live);

}
function plotObeLine(ctx,b,O){
  const L=O.ln, s=L.span, top=Math.max(O.peak*1.25,0.05);
  axesT(ctx,b,-s,s,0,top,{title:titleFor(b,'the steady state against the detuning','the line'),xlab:'Δ/Γ',ylab:'ρₑₑ',nx:6,ny:3,xfmt:v=>sgnT(v,0),yfmt:v=>fmt(v,2)});
  polyline(ctx,b,L.xs,L.ys,-s,s,0,top,COL.pos,1.6);
  vmark(ctx,b,-s,s,O.De,COL.live,[3,3]);
  const Y=yOf(b,0,top,O.peak/2), X0=xOf(b,-s,s,-O.hw), X1=xOf(b,-s,s,O.hw);
  if(X1-X0>6){ ctx.beginPath(); ctx.moveTo(X0,Y); ctx.lineTo(X1,Y); ctx.strokeStyle=COL.ref; ctx.lineWidth=1.2; ctx.stroke();
    lab(ctx,W_STAGE,H_STAGE,(X0+X1)/2,Y-9,'FWHM '+sigf(2*O.hw,3)+' Γ',COL.ref,SM_FONT,'center','middle',PLATE); }
}
function plotPhotons(ctx,b,O){
  const p=O.dist.p; let nmax=0, acc=0;
  for(let n=0;n<p.length;n++){ acc+=p[n]; nmax=n; if(acc>0.999&&n>=4) break; }
  const top=Math.max.apply(null,p.slice(0,nmax+1))*1.12||1;
  axesT(ctx,b,-0.5,nmax+0.5,0,top,{title:titleFor(b,'the field’s photon numbers, pₙ','pₙ'),xlab:'n',ylab:'pₙ',nx:5,ny:3,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,2),xticks:intTicks(0,nmax).filter((t,i,a)=>a.length<=8||t%Math.ceil(a.length/6)===0)});
  const bw=Math.max(1,b.w/(nmax+1)*0.7);
  for(let n=0;n<=nmax;n++){ if(!(p[n]>0)) continue; const X=xOf(b,-0.5,nmax+0.5,n), Y=yOf(b,0,top,p[n]);
    ctx.fillStyle=COL.photon; ctx.fillRect(X-bw/2,Y,bw,b.y1-Y); }
}
function plotRlen(ctx,b,O){
  const L=O.tr.r.map(r=>Math.hypot(r[0],r[1],r[2]));
  axesT(ctx,b,0,O.win,0,1.05,{title:titleFor(b,'the length of the atom’s Bloch vector','its length'),xlab:'gt',ylab:'|r|',nx:6,ny:4,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1),yticks:[0,0.5,1]});
  polyline(ctx,b,O.tr.ts,L,0,O.win,0,1.05,COL.pos,1.4);
  vmark(ctx,b,0,O.win,O.tnow,'#6f7789',[2,3]);
  marker(ctx,b,0,O.win,0,1.05,O.tnow,O.rlen,COL.live);
}

/* ================================================================== *
 *  views 4-6: the weak turn, superoscillation, the pointer            *

/* ---------------- the weak turn ---------------- */
function weakCaption(W){
  const main='The Weak value article’s example: prepare the spin at |i⟩ (magenta, α = '+fmt(W.al*180/PI,1)+'° from +x in the x–z plane), turn it by θ about z (green), then keep only the runs that find it at |f⟩ = +x (cyan). '
      +'Right, the amplitude ⟨f|U|i⟩ in the complex plane, drawn to equal scale: it starts at cos(α/2) and, for a small turn, swings away at Aw/2 radians per radian of turn, where a turn by itself moves a phase at most 1/2.';
  return {full:main+' Below, that phase against θ inside the band a turn allows, and the weak value against its price: the post-selection succeeds with probability cos²(α/2).',
    short:'Pre-select |i⟩, turn by θ, post-select |f⟩: the amplitude’s phase runs at Aw/2.',main,mainShort:'Pre-select |i⟩, turn by θ, post-select |f⟩: the amplitude’s phase runs at Aw/2.'};
}
function drawWeak(ctx,W,H,M){
  const Wk=M.W, cap=capFor(W,weakCaption(Wk)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  const m=Lay.main, ws=Math.floor(m.w*0.52);
  const C=sphereBox(ctx,box(m.x,m.y,ws,m.h),ST.wTh,ST.wPh,'pre-select, turn, post-select');
  const arc=[]; for(let i=0;i<=60;i++){ const a=Wk.al*i/60; arc.push([Math.cos(a),0,Math.sin(a)]); }
  path3D(ctx,C,arc,'#6a5a86',1,true);
  const turn=[]; const nT=Math.max(20,Math.ceil(40*Wk.th)); for(let i=0;i<=nT;i++) turn.push(wvTurned(Wk.al,Wk.th*i/nT));
  path3D(ctx,C,turn,COL.pos,1.8);
  arrow3(ctx,C,[0,0,0],[1,0,0],COL.struct,2);
  arrow3(ctx,C,[0,0,0],Wk.pre,COL.live,2);
  arrow3(ctx,C,[0,0,0],Wk.turned,COL.pos,2.2);
  const L=(p,t,col)=>{ const q=C.P(p); if(q) lab(ctx,W_STAGE,H_STAGE,q.x,q.y,t,col,LAB_FONT,'center','middle',PLATE); };
  L([1.14,0,0.1],'|f⟩',COL.struct); L([1.16*Wk.pre[0],0,1.16*Wk.pre[2]+0.06],'|i⟩',COL.live);
  const pb=box(m.x+ws+60,m.y+26,m.w-ws-70,m.h-58);
  if(pb.w>80&&pb.h>70) plotAmpPlane(ctx,pb,Wk);
  if(Lay.bottom[0]) plotWeakPhase(ctx,Lay.bottom[0],Wk);
  if(Lay.bottom[1]) plotWeakPrice(ctx,Lay.bottom[1],Wk);
  drawCaption(ctx,Lay);
}
/* the amplitude <f|U(theta)|i> for theta in [0, 2 pi]: a square box, equal scales */
function plotAmpPlane(ctx,b0,Wk){
  const s=Math.min(b0.w,b0.h), b=box(b0.x+(b0.w-s)/2,b0.y+(b0.h-s)/2,s,s), R=1.1;
  axesT(ctx,b,-R,R,-R,R,{title:titleFor(b,'the amplitude ⟨f|U|i⟩','⟨f|U|i⟩'),xlab:'Re',ylab:'Im',nx:4,ny:4,xfmt:v=>sgnT(v,1),yfmt:v=>sgnT(v,1),xticks:[-1,0,1],yticks:[-1,0,1]});
  const cx=[], cy=[]; for(let i=0;i<=120;i++){ const a=TAU*i/120; cx.push(Math.cos(a)); cy.push(Math.sin(a)); }
  polyline(ctx,b,cx,cy,-R,R,-R,R,'#3b4560',1.1,[3,3]);
  const ov=Wk.ov, sa=Math.sin(Wk.al/2);
  polyline(ctx,b,Wk.ell.map(z=>ov*z[0]),Wk.ell.map(z=>ov*z[1]),-R,R,-R,R,COL.pos,1.6);
  const X0=xOf(b,-R,R,0), Y0=yOf(b,-R,R,0);
  arrowPx(ctx,X0,Y0,xOf(b,-R,R,Wk.A[0]),yOf(b,-R,R,Wk.A[1]),COL.live,2);
  dot(ctx,xOf(b,-R,R,ov),Y0,3.5,COL.struct,null);
  void sa;
}
function plotWeakPhase(ctx,b,Wk){
  const top=1.75;
  const ttl=titleFor(b,'the phase it gains, against the turn','its phase');
  axesT(ctx,b,0,PI,-top,top,{title:ttl,xlab:'θ (rad)',ylab:'phase (rad)',nx:4,ny:4,xfmt:v=>fmt(v,1),yfmt:v=>sgnT(v,1)});
  /* the band a turn alone allows: its eigen-phases move at +-1/2 */
  ctx.beginPath(); ctx.moveTo(xOf(b,0,PI,0),yOf(b,-top,top,0)); ctx.lineTo(xOf(b,0,PI,PI),yOf(b,-top,top,PI/2)); ctx.lineTo(xOf(b,0,PI,PI),yOf(b,-top,top,-PI/2)); ctx.closePath();
  ctx.fillStyle='rgba(90,200,224,0.08)'; ctx.fill();
  polyline(ctx,b,[0,PI],[0,PI/2],0,PI,-top,top,COL.struct,1,[3,3]);
  polyline(ctx,b,[0,PI],[0,-PI/2],0,PI,-top,top,COL.struct,1,[3,3]);
  polyline(ctx,b,[0,PI],[0,Wk.Aw*PI/2],0,PI,-top,top,COL.ref,1.2,[6,4]);
  polyline(ctx,b,Wk.ph.map(p=>p[0]),Wk.ph.map(p=>p[1]),0,PI,-top,top,COL.pos,1.7);
  const th=Math.min(Wk.th,PI);
  vmark(ctx,b,0,PI,th,COL.live,[3,3]); marker(ctx,b,0,PI,-top,top,th,Math.atan(Wk.Aw*Math.tan(th/2)),COL.live);
  keyRow(ctx,b,[[COL.pos,'post-selected'],[COL.ref,'Aw θ/2',[6,4]]],ttl);
  lab(ctx,W_STAGE,H_STAGE,xOf(b,0,PI,PI)-4,yOf(b,-top,top,-PI/2)+10,'a turn alone: ± θ/2','#7fb6c8',SM_FONT,'right','middle',PLATE);
  HIT.push({kind:'wTheta',b});
}
function plotWeakPrice(ctx,b,Wk){
  const lo=-5, hi=3, xs=[], aw=[], pp=[];
  for(let i=1;i<400;i++){ const a=PI*i/400; xs.push(a*180/PI); aw.push(Math.log10(Math.tan(a/2))); pp.push(Math.log10(Math.cos(a/2)**2)); }
  const ttl=titleFor(b,'the weak value and its price','its price');
  axesT(ctx,b,0,180,lo,hi,{title:ttl,xlab:'α (degrees)',ylab:'',nx:6,ny:4,xfmt:v=>fmt(v,0),yfmt:v=>p10(v),yticks:logTicksI(lo,hi,5)});
  polyline(ctx,b,xs,aw,0,180,lo,hi,COL.pos,1.6);
  polyline(ctx,b,xs,pp,0,180,lo,hi,COL.ref,1.4,[6,4]);
  keyRow(ctx,b,[[COL.pos,'Aw'],[COL.ref,'it succeeds',[6,4]]],ttl);
  vmark(ctx,b,0,180,Wk.al*180/PI,COL.live,[3,3]);
}

/* ---------------- superoscillation ---------------- */
function superCaption(S){
  const lead='f(x) is a sum of waves eⁱᵏˣ with |k| ≤ 1, the fastest of them cos x (cyan); yet in the window |x| < '+fmt(S.xso,2)+' (shaded) its phase runs like cos ax (orange) with a = '+fmt(S.a,2)
      +', '+fmt(S.count,1)+' oscillations where the band’s own top frequency fits '+fmt(S.xso/PI,1)+'. Drawn is Re f/|f| (green): the amplitude is divided out, for |f| grows across the window, to √(aᴺ) = '+sigf(S.atEdge,3)+' at its edge and aᴺ = '+sigf(Math.pow(S.a,S.N),3)+' beyond';
  return {full:lead+' (bottom right). Below: the spectrum, every coefficient inside ±1 and alternating in sign; the local wavenumber, a at x = 0 and falling to 1 at the window’s edge; and the price, log₁₀|f|².',
    short:'Band-limited to |k| ≤ 1, yet oscillating at a near 0; below, the spectrum, the local wavenumber and the price.',main:lead+'.',mainShort:'Band-limited to |k| ≤ 1, yet oscillating at a near 0.'};
}
function drawSuper(ctx,W,H,M){
  const S=M.S, cap=capFor(W,superCaption(S)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,3,0.4,nbNarrow(H));
  const b=box(Lay.main.x,Lay.main.y+24,Lay.main.w,Lay.main.h-50), X=S.X, top=1.35;
  const ttl=titleFor(b,'Re f / |f|: band-limited to |k| ≤ 1, and yet','Re f / |f|');
  axesT(ctx,b,-X,X,-top,top,{title:ttl,xlab:'x',ylab:'',nx:8,ny:4,xfmt:v=>sgnT(v,0),yfmt:v=>sgnT(v,1),yticks:[-1,0,1]});
  xband(ctx,b,-X,X,-S.xso,S.xso,'rgba(184,236,76,0.07)');
  polyline(ctx,b,S.xs,S.band,-X,X,-top,top,COL.struct,1.1);
  polyline(ctx,b,S.xs,S.fast,-X,X,-top,top,COL.ref,1.2,[5,4]);
  polyline(ctx,b,S.xs,S.ph,-X,X,-top,top,COL.pos,1.8);
  keyRow(ctx,b,[[COL.pos,'Re f/|f|'],[COL.ref,'cos ax',[5,4]],[COL.struct,'cos x']],ttl);
  if(Lay.bottom[0]) plotSpectrum(ctx,Lay.bottom[0],S.cs,S.a,'the spectrum: every k within ±1');
  if(Lay.bottom[1]) plotLocalK(ctx,Lay.bottom[1],S);
  if(Lay.bottom[2]) plotPrice(ctx,Lay.bottom[2],S);
  drawCaption(ctx,Lay);
}
function plotSpectrum(ctx,b,cs,a,title){
  const lg=cs.map(o=>o.c===0?-Infinity:Math.log10(Math.abs(o.c))), fin=lg.filter(isFinite);
  const hi=Math.ceil(Math.max.apply(null,fin)+0.3), lo=Math.max(Math.floor(Math.min.apply(null,fin)-0.3),hi-14);
  const xhi=Math.max(1.15,a*1.12);
  axesT(ctx,b,-1.15,xhi,lo,hi,{title:titleFor(b,title,'the spectrum'),xlab:'k',ylab:'|cₘ|',nx:5,ny:3,xfmt:v=>sgnT(v,1),yfmt:v=>p10(v),yticks:logTicksI(lo,hi,4)});
  xband(ctx,b,-1.15,xhi,-1,1,'rgba(90,200,224,0.07)');
  stems(ctx,b,-1.15,xhi,lo,hi,cs.map(o=>o.k),lg.map(v=>isFinite(v)?v:lo),cs.map(o=>o.c),cs.length>30?1.1:1.6);
  const X=vmark(ctx,b,-1.15,xhi,a,COL.ref,[5,4]);
  if(X!==null) lab(ctx,W_STAGE,H_STAGE,X+4,b.y+9,'a','#e8a25a',SM_FONT,'left','middle',PLATE);
}
function plotLocalK(ctx,b,S){
  const top=S.a*1.12;
  axesT(ctx,b,0,S.half,0,top,{title:titleFor(b,'the local wavenumber','its wavenumber'),xlab:'x',ylab:'k(x)',nx:4,ny:3,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1)});
  xband(ctx,b,0,S.half,0,S.xso,'rgba(184,236,76,0.07)');
  hmark(ctx,b,0,top,1,COL.struct,[3,3]); hmark(ctx,b,0,top,S.a,COL.ref,[5,4]);
  polyline(ctx,b,S.kx,S.k,0,S.half,0,top,COL.pos,1.6);
}
function plotPrice(ctx,b,S){
  const hi=Math.max(1,2*S.N*Math.log10(S.a))*1.05;
  axesT(ctx,b,0,S.half,-0.3,hi,{title:titleFor(b,'the price, |f|²','the price'),xlab:'x',ylab:'|f|²',nx:4,ny:3,xfmt:v=>fmt(v,0),yfmt:v=>p10(v),yticks:logTicksI(0,hi,4)});
  xband(ctx,b,0,S.half,0,S.xso,'rgba(184,236,76,0.07)');

/* ---------------- the pointer ---------------- */
function pointerCaption(X){
  if(X.mode==='pointer'){ const landed=Math.abs(X.S.mean-X.a)<0.15*Math.max(1,X.a-1), inside=Math.abs(X.S.mean)<=1;
    const main='A pointer (grey: its Gaussian, σ = '+sigf(X.sig,2)+') coupled to '+X.N+' spin'+(X.N>1?'s':'')+', each of which can only push it by ±1/N: every copy of the pointer lies inside [−1, 1] (shaded). '
      +'Post-selected with weak value Aw = '+fmt(X.a,2)+', the copies interfere with the superoscillation’s signed weights and the pointer (green) lands at ⟨q⟩ = '+fmt(X.S.mean,2)
      +(landed?', the weak value: outside every copy’s place.':inside?': the copies separate, and the pointer shows the spins’ own eigenvalues (a strong measurement).':', between: the pointer is not yet wide enough for the weak regime.');
    return {full:main+' Below, where it lands against its width, and the copies’ weights.',
      short:'N spins push a pointer by ±1/N each; post-selected, it lands at Aw. Below, where it lands against its width, and the weights.',main,mainShort:'N spins push a pointer by ±1/N each; post-selected, it lands at Aw.'}; }
  const spot=a=>'Re f as the field at a lens’s focus, its aperture passing no wavenumber above 1: the diffraction-limited spot is sinc², '+fmt(X.sincFwhm,2)+' wide at half maximum; the superoscillation makes a fringe '
      +fmt(X.fwhm,3)+' wide, '+fmt(X.sincFwhm/X.fwhm,1)+' times narrower'+a+'. The main plot is logarithmic: the sidebands outside the window are a²ᴺ = '+sigf(X.side2,3)+' times brighter than the spot.';
  return {full:spot(' (below left, to scale: its neighbours are brighter still and cut at 1.3)'),
    short:'A superoscillating focus: a fringe narrower than the diffraction limit, and sidebands far brighter.',main:spot(''),mainShort:'A superoscillating focus: a fringe narrower than the diffraction limit, and sidebands far brighter.'};

function drawPointer(ctx,W,H,M){
  const X=M.X, cap=capFor(W,pointerCaption(X)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  const b=box(Lay.main.x,Lay.main.y+24,Lay.main.w,Lay.main.h-50);
  if(X.mode==='pointer'){
    const S=X.S, lo=X.lo, hi=X.hi, pts=S.pts.filter(o=>o.q>=lo-1e-9&&o.q<=hi+1e-9);
    const dens=pts.map(o=>o.psi*o.psi/S.norm), g0=pts.map(o=>Math.exp(-o.q*o.q/(2*X.sig*X.sig))/Math.sqrt(TAU*X.sig*X.sig));
    const top=Math.max(Math.max.apply(null,dens),Math.max.apply(null,g0))*1.15;
    const ttl=titleFor(b,'the pointer after the post-selection','the pointer');
    axesT(ctx,b,lo,hi,0,top,{title:ttl,xlab:'q',ylab:'',nx:8,ny:3,xfmt:adFmt(lo,hi,8,true),yfmt:v=>sigf(v,2)});
    xband(ctx,b,lo,hi,-1,1,'rgba(90,200,224,0.08)');
    polyline(ctx,b,pts.map(o=>o.q),g0,lo,hi,0,top,'#7f879a',1.2,[4,3]);
    polyline(ctx,b,pts.map(o=>o.q),dens,lo,hi,0,top,COL.pos,1.8);
    const Xa=vmark(ctx,b,lo,hi,X.a,COL.ref,[5,4]);
    if(Xa!==null) lab(ctx,W_STAGE,H_STAGE,Xa+4,b.y+10,'Aw','#e8a25a',SM_FONT,'left','middle',PLATE);
    const Xm=vmark(ctx,b,lo,hi,S.mean,COL.live,[3,3]);
    if(Xm!==null) lab(ctx,W_STAGE,H_STAGE,Xm+4,b.y+26,'⟨q⟩','#d98fd4',SM_FONT,'left','middle',PLATE);
    keyRow(ctx,b,[[COL.pos,'after'],['#7f879a','before',[4,3]]],ttl);
    if(Lay.bottom[0]) plotSweep(ctx,Lay.bottom[0],X);
    if(Lay.bottom[1]) plotSpectrum(ctx,Lay.bottom[1],soCoeffs(X.N,X.a),X.a,'the copies’ weights: every shift within ±1');
  } else {
    const hi=Math.max(1,2*X.N*Math.log10(X.a))+1, lo=Math.min(-4,Math.floor(Math.min.apply(null,X.lg.filter(isFinite)))), lo2=Math.max(lo,-12);
    axesT(ctx,b,0,X.half,lo2,hi,{title:titleFor(b,'the focal plane, E²','E²'),xlab:'x',ylab:'',nx:6,ny:4,xfmt:v=>fmt(v,0),yfmt:v=>p10(v),yticks:logTicksI(lo2,hi,5)});
    xband(ctx,b,0,X.half,0,soXso(X.N,X.a),'rgba(184,236,76,0.07)');
    polyline(ctx,b,X.xs,X.lg,0,X.half,lo2,hi,COL.pos,1.3);
    if(Lay.bottom[0]) plotSpotZoom(ctx,Lay.bottom[0],X);
    if(Lay.bottom[1]) plotSpectrum(ctx,Lay.bottom[1],soCoeffs(X.N,X.a),X.a,'what the aperture passes: every k within ±1');
  }
  drawCaption(ctx,Lay);
}
function plotSweep(ctx,b,X){
  const sw=X.sweep, lx=sw.ss.map(Math.log10), lo=Math.log10(0.02), hi=Math.log10(20), top=Math.max(X.a,1)*1.2+0.2, bot=-1.3;

  if(X.sigW>0) vmark(ctx,b,lo,hi,Math.log10(X.sigW),'#6f7789',[2,3]);

function plotSpotZoom(ctx,b,X){

function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='flop') drawFlop(ctx,W,H,M);
  else if(M.view==='pulse') drawPulse(ctx,W,H,M);
  else if(M.view==='atom') drawAtom(ctx,W,H,M);
  else if(M.view==='weak') drawWeak(ctx,W,H,M);
  else if(M.view==='super') drawSuper(ctx,W,H,M);
  else drawPointer(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
const CAMKEY={flop:['fTh','fPh'],pulse:['pTh','pPh'],atom:['oTh','oPh'],weak:['wTh','wPh']};
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  function setFrom(hit,x,y){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1);
    if(hit.kind==='fT'){ ST.fT=3*u; return true; }
    if(hit.kind==='fDet'){ ST.fDet=clamp(-3+6*u,LIM.fDet[0],LIM.fDet[1]); ST.fPre='own'; return true; }
    if(hit.kind==='pDet'){ ST.pDet=clamp(-hit.span+2*hit.span*u,LIM.pDet[0],LIM.pDet[1]); ST.pPre='own'; return true; }
    if(hit.kind==='pTheta'){ ST.pTheta=4*u; ST.pPre='own'; return true; }
    if(hit.kind==='oT'){ ST.oT=u; return true; }
    if(hit.kind==='wTheta'){ ST.wTheta=PI*u; ST.wPre='own'; return true; }
    if(hit.kind==='xSig'){ ST.xSig=clamp(0.02*Math.pow(1000,u),LIM.xSig[0],LIM.xSig[1]); ST.xPre='own'; return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; }
      if(hit.kind==='cam'){ const k=CAMKEY[ST.view]; DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST[k[0]]; DRAG.ph=ST[k[1]]; return false; }
      DRAG.what=hit; return setFrom(hit,x,y); }
    if(type==='move'){ if(!DRAG.what) return false;
      if(DRAG.what==='cam'){ const k=CAMKEY[ST.view]; ST[k[0]]=DRAG.th-(x-DRAG.x)*0.008; ST[k[1]]=clamp(DRAG.ph+(y-DRAG.y)*0.006,-1.4,1.4); return true; }
      return setFrom(DRAG.what,x,y); }
    DRAG.what=null; return false;
  };
  return S;
}

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  /* the clock moves a slider's worth of state (the time), so the panel's time row and the readout follow it, a few
     times a second rather than every frame */
  let since=0;
  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    if(advanced&&++since>=10){ since=0; try{ syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  flop:'A two-level atom has a ground state |g&rang; (the south pole of the Bloch sphere) and an excited state |e&rang; (the north pole), &hbar;&omega;<sub>0</sub> apart. Left alone its Bloch vector precesses about z at &omega;<sub>0</sub>. A field near that frequency adds a slow torque: in a frame that turns with the field the precession disappears and the vector simply turns about a fixed axis B = (&Omega;, 0, &minus;&Delta;), at the <b>generalized Rabi frequency</b> W = &radic;(&Omega;&sup2; + &Delta;&sup2;). On resonance the turn passes through |e&rang;: the atom is fully excited after &pi;/&Omega; and back in |g&rang; after 2&pi;/&Omega;. That is <b>Rabi flopping</b>. Off resonance it circles a tilted axis and gets only &Omega;&sup2;/W&sup2; of the way. Rabi solved it for a spin in a <b>rotating</b> magnetic field, for which the rotating frame is exact. A laser or a linear radio-frequency field is two fields rotating opposite ways; the rotating-wave approximation keeps the one that turns with the atom. The one it drops makes the lab curve ripple at twice the drive frequency and moves the true resonance up by &Omega;&sup2;/4&omega;<sub>0</sub> (Bloch and Siegert, 1940): the flop is slowest there, not at &omega;<sub>0</sub>.',
  pulse:'Switching the drive on for a time &tau; turns the Bloch vector through the angle &theta; = &Omega;&tau;: the pulse&rsquo;s <b>area</b>. A &pi; pulse inverts the atom; a &pi;/2 pulse leaves it in an equal superposition; a 2&pi; pulse brings it back to |g&rang; with its amplitude multiplied by &minus;1. A spin-&frac12; is a spinor: it needs two full turns, 720&deg;, to come back to itself, and the sign shows whenever the atom interferes with a copy that was not turned. A pulse also has a <b>line</b>: detuned by &Delta; it turns about a tilted axis and misses |e&rang;, so the transfer falls off over a width of about &pi;/&tau;. Norman Ramsey (1949) split the interaction into two short &pi;/2 pulses a long time T apart. In between, the vector precesses freely at &Delta;, and the second pulse turns that phase into population: the <b>fringes</b>, cos&sup2;(&Delta;T/2), are as narrow as &pi;/T however short the pulses. It is the method of the caesium clock that defines the second (Nobel Prize, 1989).',
  atom:'A real atom also loses what it gains. Spontaneous emission empties |e&rang; at the rate &Gamma;, and anything that scrambles the phase shortens the coherence further. The flop is <b>damped</b>, and the Bloch vector spirals into a steady state inside the sphere: however hard the atom is driven, at most half of it is excited, and its resonance broadens as the drive grows (power broadening). The light it scatters carries the flop: at strong drive the spectrum splits into three lines, the <b>Mollow triplet</b>, with sidebands at the Rabi frequency. Switch to <b>photons</b> and the field itself is quantized (Jaynes and Cummings, 1963): an excited atom and n photons exchange a quantum at 2g&radic;(n + 1), so an excited atom flops even in the empty cavity, the <b>vacuum Rabi oscillation</b>. A coherent field mixes many n: their flops dephase and the oscillation collapses, then rephase and it revives, which only a quantized field can do (seen with a single-atom maser in 1987). The atom&rsquo;s own Bloch vector shows how entangled it is with the field: its length falls well below 1 as the flops dephase, and for &lang;n&rang; = 16 is back to '+fmt(PX.jcMid,2)+' halfway to the revival, where atom and field nearly come apart again.',
  weak:'Now run the flop another way. Prepare a spin in one state, turn it a little, and ask whether it is found in another; keep only the runs in which it is (<b>post-selection</b>). The Weak value article&rsquo;s example prepares |i&rang; in the x&ndash;z plane at an angle &alpha; from the post-selected state |f&rang; = +x and turns it about z. For a turn &theta; the surviving amplitude is &lang;f|i&rang;(cos &theta;/2 &minus; i A<sub>w</sub> sin &theta;/2), where A<sub>w</sub> = &lang;f|&sigma;<sub>z</sub>|i&rang;/&lang;f|i&rang; = tan(&alpha;/2) is the <b>weak value</b> of &sigma;<sub>z</sub>. The eigenvalues of &sigma;<sub>z</sub> are &plusmn;1, and a turn by itself moves a phase by at most &theta;/2; but as |i&rang; and |f&rang; become nearly opposite, A<sub>w</sub> grows without bound and the post-selected amplitude turns A<sub>w</sub> times faster. Aharonov, Albert and Vaidman (1988): a spin component can &ldquo;seem 100 times greater than its largest eigenvalue&rdquo;. The price is the post-selection itself: it succeeds with probability cos&sup2;(&alpha;/2) = 1/(1 + A<sub>w</sub>&sup2;).',
  super:'Multiply N such amplitudes (N spins, each turned through 2x/N) and you get Berry&rsquo;s function f(x) = (cos(x/N) + i a sin(x/N))<sup>N</sup>, with a the weak value. Expand the power and f is a sum of N + 1 waves e<sup>i(1 &minus; 2m/N)x</sup>: every wavenumber lies between &minus;1 and 1, so f is <b>band-limited</b>, and nothing in it oscillates faster than cos x. Yet near x = 0, f goes as e<sup>iax</sup>: it oscillates a times faster than its fastest Fourier component, for as long as the window lasts. That is a <b>superoscillation</b> (the idea Aharonov&rsquo;s, the analysis Berry&rsquo;s). The coefficients are enormous and alternate in sign, and they cancel almost perfectly inside the window; outside it f climbs to a<sup>N</sup>. That is the price: the superoscillating stretch is exponentially weak beside the rest, and the dynamic range needed grows exponentially with the number of superoscillations (Kempf and Ferreira).',

  withState({},()=>{ const F=flopView(ST); ok(F.s>0&&F.s<F.tr.t.length,'the flop\'s time index lies on its trajectory'); close(F.tr.t[F.s]/F.TR,ST.fT,F.tr.dt/F.TR,'at the chosen time'); });

      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let across=null;
      for(const L of LABELS){ if(L.seq===undefined) continue;
        for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
        if(across) break; }
      ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
      if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key fits ('+KEY_DROPS+' dropped)');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
