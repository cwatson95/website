/* ================================================================== *
 *  view 4: the meter                                                  *
 * ================================================================== */
function meterCaption(M){
  const G=M.M;
  if(G.fn==='V') return {full:'A moving-coil meter needs '+amp(G.mv.Ifs,3)+' through its coil for full scale. To read volts a resistor goes in series with it, and the coil and the resistor are a voltage divider; each range adds resistance so that its full-scale voltage drives the same current, so the meter’s own resistance is '+fmt(1/G.mv.Ifs,0).replace(/\B(?=(\d{3})+(?!\d))/g,',')+' Ω per volt of range. Across R₂ it is one more resistor in parallel and pulls the voltage down; a higher range pulls less but reads coarser, since the needle is good to 3 % of full scale. '+(G.mv.assumed?'(The coil’s 50 mV at full scale is assumed.)':''),
    short:'The meter is a divider (volts) or a current divider (amps), and it loads what it measures.'};
  return {full:'To read milliamps the coil is shunted: most of the current bypasses it and a fixed share goes through it, a current divider. Ayrton’s shunt is one chain across the coil tapped by the range switch, so the coil is never left without its shunt while the switch moves: on each range the part of the chain below the tap is the shunt and the rest rides with the coil, and tap resistance times range current is the same on every range. In the circuit the meter adds its own resistance to the loop and the current falls.',
    short:'The Ayrton shunt makes the coil one branch of a current divider on every range.'};
}
function drawMeter(ctx,W,H,M){
  const G=M.M, cap=meterCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.42,nbNarrow(H));
  const m=Lay.main, fw=Lay.narrow?m.w*0.46:Math.min(m.w*0.42,330);
  drawMeterFace(ctx,W,H,box(m.x,m.y,fw,m.h),G);
  drawMeterCircuit(ctx,W,H,box(m.x+fw+30,m.y,m.w-fw-30,m.h),G);
  const B=Lay.bottom;
  if(B[0]) plotRangeErr(ctx,W,H,B[0],G);
  if(B[1]) plotOthers(ctx,W,H,B[1],G);
  drawCaption(ctx,Lay);
}
/* the face: a scale over 100 degrees, the needle at the reading (pinned past the end when off the scale) */
function drawMeterFace(ctx,W,H,b,G){
  const cx=b.x+b.w/2, r=Math.min(b.w*0.46,b.h*0.62), cy=b.y+18+r*1.02;
  const range=G.fn==='V'?G.range:G.A.I[G.k], defl=clamp(G.defl,-0.02,1.03);
  const ang=u=>(-50+100*u)*Math.PI/180, P=(u,rr)=>[cx+rr*Math.sin(ang(u)),cy-rr*Math.cos(ang(u))];
  /* the dial plate */
  const plate=[]; for(let i=0;i<=40;i++) plate.push(P(-0.12+1.24*i/40,r*1.08)); for(let i=40;i>=0;i--) plate.push(P(-0.12+1.24*i/40,r*0.34));
  ctx.beginPath(); ctx.moveTo(plate[0][0],plate[0][1]); for(const p of plate) ctx.lineTo(p[0],p[1]); ctx.closePath(); ctx.fillStyle='#0e1324'; ctx.fill();
  const arc=[]; for(let i=0;i<=50;i++) arc.push(P(i/50,r)); sLine(ctx,arc,'#8b93a6',1.4);
  /* ticks: ten major divisions of the range, labelled by the range's own numbers */
  const unit=G.fn==='V'?1:(range<1e-3?1e-6:1e-3), un=G.fn==='V'?'V':(unit===1e-6?'µA':'mA');
  for(let i=0;i<=50;i++){ const u=i/50, major=i%5===0; sLine(ctx,[P(u,r),P(u,r*(major?0.9:0.95))],'#8b93a6',major?1.4:0.8);
    if(major&&i%10===0) lab(ctx,W,H,P(u,r*0.8)[0],P(u,r*0.8)[1],sigf(range*u/unit,2),'#aeb6c6',SM_FONT,'center','middle'); }
  /* the 3 % of full scale either side of the reading */
  const band=[]; for(let i=0;i<=12;i++){ const u=clamp(defl-0.03+0.06*i/12,0,1); band.push(P(u,r*1.03)); } sLine(ctx,band,COL.ref,3);
  const tip=P(defl,r*0.97), base=[cx,cy];
  sLine(ctx,[base,tip],G.row.on?COL.live:COL.ref,2); dot(ctx,cx,cy,5,'#1a2138','#8b93a6',1.2);
  lab(ctx,W,H,cx,cy-r*0.46,un,'#aeb6c6','italic 13px Georgia, serif','center','middle');
  const rd=G.fn==='V'?(G.row.on?volt(G.row.Vm,3):'off the scale'):(G.row.on?amp(G.row.Im,3):'off the scale');
  lab(ctx,W,H,cx,cy+16,'the '+(G.fn==='V'?volt(range,2):amp(range,2))+' range reads '+rd,G.row.on?COL.live:COL.ref,LAB_FONT,'center','top',PLATE);
  lab(ctx,W,H,cx,cy+32,'true: '+(G.fn==='V'?volt(G.Vth,3):amp(G.I,3)),COL.pos,LAB_FONT,'center','top',PLATE);
  HIT.push({kind:'face',b});
}
/* the circuit with the meter in it, drawn open: its multiplier chain and range switch, or its Ayrton chain */
function drawMeterCircuit(ctx,W,H,b,G){
  const mv=G.mv;
  if(G.fn==='V'){
    const Vs=ST.mVs, Vm=G.row.Vm; PIC.vmax=Vs;
    lab(ctx,W,H,b.x,b.y+4,titleFor(b,'the meter across R₂: multipliers and a coil','the meter across R₂'),'#aeb6c6','italic 13px Georgia, serif','left','top');
    const xb=b.x+20, xr=b.x+b.w*0.28, xm=b.x+b.w*0.62, yT=b.y+34, yB=b.y1-20, yM=(yT+yB)/2;
    sBattery(ctx,xb,yT,yB,Vs,0); sGround(ctx,xb,yB);
    sWireV(ctx,[[xb,yT],[xr,yT]],Vs); sWireV(ctx,[[xr,yB],[xb,yB]],0);
    const p1=sResV(ctx,xr,yT,xr,yM,Vs,Vm), p2=sResV(ctx,xr,yM,xr,yB,Vm,0);
    partLabel(ctx,p1,'R₁ '+ohm(ST.mR1,3),COL.text,-1,W,H); partLabel(ctx,p2,'R₂ '+ohm(ST.mR2,3),COL.text,-1,W,H);
    /* the meter: the + lead, the chain of multipliers (one per range), the switch, the coil */
    const ch=G.chain, n=ch.ranges.length, y0=yT, y1=yM+ (yB-yM)*0.35;
    sWireV(ctx,[[xr,yM],[xm-26,yM]],Vm); sDotV(ctx,xr,yM,Vm);
    /* the chain hangs from the coil at the bottom: tap k sits above segment k; the switch picks one tap */
    const ty=[]; for(let k=0;k<=n;k++) ty.push(y1-(y1-y0)*k/n);
    const ksel=ch.ranges.indexOf(G.range);
    const Ic=Vm/G.row.Rin;                          /* the current through the meter */
    const vtap=k=>{ /* the potential at tap k: the coil's drop plus the segments below the tap */ let r=mv.Rm; for(let j=0;j<k;j++) r+=ch.seg[j]; return k<=ksel+1?Ic*r:Ic*(mv.Rm+ch.seg.slice(0,ksel+1).reduce((s,x)=>s+x,0)); };
    for(let k=0;k<n;k++){ const live=k<=ksel;
      sResV(ctx,xm,ty[k],xm,ty[k+1],live?vtap(k):vtap(ksel+1),live?vtap(k+1):vtap(ksel+1),{sz:0.55,col:live?null:'#39435e'}); }
    /* the switch arm from the + lead to the selected tap */
    const tk=ty[ksel+1];
    sLine(ctx,[[xm-26,yM],[xm-8,tk]],pc(Vm),2); dot(ctx,xm-26,yM,3,pc(Vm),null);
    for(let k=1;k<=n;k++) dot(ctx,xm-6,ty[k],2.2,k===ksel+1?COL.live:'#39435e',null);
    for(let k=1;k<=n;k++) if(b.w>200&&(k===ksel+1||n<=6||k%2===1)) lab(ctx,W,H,xm+12,ty[k],volt(ch.ranges[k-1],1),k===ksel+1?COL.live:'#6f7789','10px -apple-system, sans-serif','left','middle');
    /* the coil at the bottom of the chain, its other end to ground */
    const yc=y1+(yB-y1)*0.45;
    sWireV(ctx,[[xm,y1],[xm,yc-12]],Ic*mv.Rm); sMeterSym(ctx,xm,yc,'M',COL.struct);
    sWireV(ctx,[[xm,yc+12],[xm,yB],[xr,yB]],0);
    lab(ctx,W,H,xm+16,yc,mv.name,COL.struct,SM_FONT,'left','middle',PLATE);
    HIT.push({kind:'vrange',b:box(xm-30,y0,60,y1-y0),ty:ty.slice(1),ranges:ch.ranges});
    return;
  }
  const A=G.A, k=G.k, Va=ST.mVa, Im=G.row.Im, Vt=Im*G.row.Rmeter; PIC.vmax=Va;
  lab(ctx,W,H,b.x,b.y+4,titleFor(b,'the meter in the loop: an Ayrton shunt','the meter in the loop'),'#aeb6c6','italic 13px Georgia, serif','left','top');
  const xb=b.x+20, xr=b.x+b.w*0.4, xm=b.x+b.w*0.72, yT=b.y+34, yB=b.y1-20;
  sBattery(ctx,xb,yT,yB,Va,0); sGround(ctx,xb,yB);
  sWireV(ctx,[[xb,yT],[xr-40,yT]],Va);
  const pR=sResV(ctx,xr-40,yT,xr+10,yT,Va,Vt); partLabel(ctx,pR,'R '+ohm(ST.mRa,3),COL.text,1,W,H);
  /* the Ayrton chain from the top (the coil's end) down to the common, its taps evenly spaced for legibility (the
     segments are 100 : 10 : 1 of each other) */
  const yc0=yT+12, yc3=yB-12, segs=A.seg;
  const ty=[]; for(let j=0;j<=3;j++) ty.push(yc0+(yc3-yc0)*j/3);
  const Icoil=Im*A.S[k]/(mv.Rm+A.Rsh);
  /* the potential at chain point j (0 = the coil's end, 3 = the common): below the tap the shunt current falls
     through S_k; above it the coil's current climbs the rest of the chain */
  const vAt=j=>{ if(j===3) return 0;
    const Stap=A.S[k], Rbelow=[A.Rsh,A.S[1],A.S[2]][j];
    return Rbelow<=Stap?Vt*Rbelow/Stap:Vt+Icoil*(Rbelow-Stap); };
  for(let j=0;j<3;j++) sResV(ctx,xm,ty[j],xm,ty[j+1],vAt(j),vAt(j+1),{sz:0.55});
  const xc=xm+60;
  sWireV(ctx,[[xm,ty[0]],[xc,ty[0]]],vAt(0)); sMeterSym(ctx,xc,(ty[0]+ty[3])/2,'M',COL.struct);
  sWireV(ctx,[[xc,ty[0]],[xc,(ty[0]+ty[3])/2-12]],vAt(0)); sWireV(ctx,[[xc,(ty[0]+ty[3])/2+12],[xc,ty[3]],[xm,ty[3]]],0);
  sWireV(ctx,[[xm,ty[3]],[xm,yB],[xb,yB]],0);
  /* the switch: from the + lead to the chosen tap (taps 0, 1, 2 = the 10, 100, 1000 I_fs ranges) */
  const tapY=[ty[0],ty[1],ty[2]][k];
  sWireV(ctx,[[xr+10,yT],[xm-30,yT]],Vt); sLine(ctx,[[xm-30,yT],[xm-8,tapY]],pc(Vt),2);
  for(let j=0;j<3;j++){ dot(ctx,xm-6,ty[j],2.2,j===k?COL.live:'#39435e',null);
    lab(ctx,W,H,xm-12,ty[j]+12,amp(A.I[j],1),j===k?COL.live:'#6f7789','10px -apple-system, sans-serif','right','middle'); }
  lab(ctx,W,H,xc,(ty[0]+ty[3])/2+16,mv.name,COL.struct,SM_FONT,'center','top',PLATE);
  for(let j=0;j<3;j++) lab(ctx,W,H,xm+10,(ty[j]+ty[j+1])/2,ohm(segs[j],3),'#9aa2b4','10px -apple-system, sans-serif','left','middle',PLATE);
  HIT.push({kind:'arange',b:box(xm-30,ty[0]-6,40,ty[2]-ty[0]+12),ty:ty.slice(0,3)});
}
/* the error against the range: the loading (orange) and 3 % of the range (grey), stacked; the best marked */
function plotRangeErr(ctx,W,H,b,G){
  const rows=G.rows, n=rows.length, top=Math.min(1.2,Math.max(0.1,...rows.filter(r=>r.on).map(r=>r.worst))*1.15);
  axesT(ctx,b,-0.5,n-0.5,0,top*100,{title:'',ylab:'worst error (%)',
    xticks:rows.map((_,i)=>i),xfmt:i=>G.fn==='V'?sigf(rows[i].range,2):sigf(rows[i].range*1e3,2),ny:b.h<110?3:4,yfmt:v=>sigf(v,2),xlab:G.fn==='V'?'range (V)':'range (mA)'});
  keyRow(ctx,b.x,b.y-14,[[COL.ref,G.fn==='V'?'its loading':'its burden'],['#5b6378','3 % of the range']],b.w);
  const bw=Math.min(26,b.w/n*0.6);
  rows.forEach((r,i)=>{ const X=b.x+b.w*(i+0.5)/n;
    if(!r.on){ lab(ctx,W,H,X,b.y1-10,'off',COL.ref,'10px -apple-system, sans-serif','center','middle'); return; }
    const load=(G.fn==='V'?G.Rth/(G.Rth+r.Rin):(G.I-r.Im)/G.I)*100, fs=(r.worst*100-load);
    const y=v=>b.y1-b.h*Math.min(v,top*100)/(top*100);
    ctx.fillStyle=COL.ref; ctx.fillRect(X-bw/2,y(load),bw,b.y1-y(load));
    ctx.fillStyle='#5b6378'; ctx.fillRect(X-bw/2,y(load+fs),bw,y(load)-y(load+fs));
    /* a bar that runs past the top is cut there, and a chevron says so (a clipped bar is not a short one) */
    if(load+fs>top*100){ ctx.beginPath(); ctx.moveTo(X-5,b.y+7); ctx.lineTo(X,b.y+1); ctx.lineTo(X+5,b.y+7); ctx.strokeStyle='#cfd4de'; ctx.lineWidth=1.4; ctx.stroke(); }
    if((G.fn==='V'&&r.range===G.range)||(G.fn==='A'&&i===G.k)){ ctx.strokeStyle=COL.live; ctx.lineWidth=1.6; ctx.strokeRect(X-bw/2-2,y(load+fs)-2,bw+4,b.y1-y(load+fs)+2); }
    if(G.best&&r.range===G.best.range) lab(ctx,W,H,X,Math.max(b.y+8,y(load+fs)-9),'best',COL.pos,'10px -apple-system, sans-serif','center','middle',PLATE); });
  HIT.push({kind:G.fn==='V'?'vbar':'abar',b,n,ranges:rows.map(r=>r.range)});
}
/* a century of meters on the same divider: each one's reading against the truth */
function plotOthers(ctx,W,H,b,G){
  if(G.fn!=='V'){ plotAmmBurden(ctx,W,H,b,G); return; }
  const n=G.others.length, V=G.Vth;
  axesT(ctx,b,-0.5,n-0.5,0,V*1.12,{title:titleFor(b,'the same divider, read by the meters of a century','other meters'),ylab:'reads (V)',

/* ================================================================== *
 *  view 5: the bridge                                                 *
 * ================================================================== */
function bridgeCaption(M){
  const B=M.B;
  if(B.mode==='wheat') return {full:'Two dividers from one source, a galvanometer across their middles: it reads only the difference of the two, so it can be sensitive without being accurate, and at balance the unknown is fixed by the other three arms alone, Rₓ = R₂R₃/R₁, whatever the supply or the galvanometer. Turn R₂ (the dial) until the needle stands at zero'+(ST.bHide?'; the unknown is hidden.':'.')+' Christie 1833, Wheatstone 1843.',
    short:'Balance R₂ until the galvanometer reads zero: then Rₓ = R₂R₃/R₁.'};
  if(B.mode==='strain') return {full:'A strain gauge’s resistance changes by GF × ε of itself (GF a little over 2 for metal foil). With one active gauge the bridge’s output is δ/(2(2 + δ)) of the supply, close to δ/4 but bending away from it; two gauges strained oppositely (a half bridge) give δ/2, four (a full bridge) δ, both exactly straight. A load cell’s rating in mV/V is the full bridge’s output at full load: 2 mV/V is 1000 µε at GF 2.',
    short:'One active gauge gives about GF ε/4 of the supply; two or four give exactly GF ε/2 and GF ε.'};
  return {full:'Half a bridge: a divider turns the thermistor’s resistance into a voltage. The curve is S-shaped; the fixed resistor Rf sets where it is steepest (Rf = R(Tₘ)), where it is straight (d²V/dT² = 0 at Tₘ: Rf = '+ohm(B.rules.inflect,3)+'; the constant-B textbook rule gives '+ohm(B.rules.inflectB,3)+'), or how much of the supply it spans between the range’s ends (Rf = √(Rₗₒ Rₕᵢ) = '+ohm(B.rules.swing,3)+'); the dashed curves are the choices not taken. The thermistor is Vishay’s 10 kΩ part of its NTCLE100 series, drawn with the datasheet’s own law.',
    short:'Rf sets where the thermistor divider is steepest, straightest, or widest.'};
}
function drawBridge(ctx,W,H,M){
  const B=M.B, cap=bridgeCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,B.mode==='ntc'?3:2,0.44,nbNarrow(H));
  const m=Lay.main;
  if(B.mode==='ntc') drawNtcSchem(ctx,W,H,m,B); else drawDiamond(ctx,W,H,m,B);
  const Bx=Lay.bottom;
  if(B.mode==='wheat'){ if(Bx[0]) plotNull(ctx,W,H,Bx[0],B); if(Bx[1]) plotGalvo(ctx,W,H,Bx[1],B); }
  else if(B.mode==='strain'){ if(Bx[0]) plotStrain(ctx,W,H,Bx[0],B); if(Bx[1]) plotStrainNL(ctx,W,H,Bx[1],B); }
  else { if(Bx[0]) plotNtcV(ctx,W,H,Bx[0],B); if(Bx[1]) plotNtcNL(ctx,W,H,Bx[1],B); if(Bx[2]) plotNtcB(ctx,W,H,Bx[2],B); }
  drawCaption(ctx,Lay);
}
/* the diamond: the source on the left, A at the top, C at the bottom, D (R1 over R2) left, B (R3 over Rx) right */
function drawDiamond(ctx,W,H,b,B){

  const w=wheatstoneNet(Vs,arms[0],arms[1],arms[2],arms[3],strain?null:B.Rg);
  PIC.vmax=Vs;

  const pr=[sResV(ctx,A[0],A[1],Dn[0],Dn[1],Vs,w.VD),sResV(ctx,Dn[0],Dn[1],C[0],C[1],w.VD,0),

    lab(ctx,W,H,gx,gy+18,engS(w.Ig,'A',3),Math.abs(B.defl)<0.005?COL.pos:COL.ref,SM_FONT,'center','top',PLATE); }
  lab(ctx,W,H,xs+16,cy+18,volt(Vs,3),COL.src,LAB_FONT,'left','middle',PLATE);
  lab(ctx,W,H,Dn[0]-8,Dn[1]+16,'D '+volt(w.VD,4),pc(w.VD),'10px -apple-system, sans-serif','right','top',PLATE);
  lab(ctx,W,H,Bn[0]+8,Bn[1]+16,'B '+volt(w.VB,4),pc(w.VB),'10px -apple-system, sans-serif','left','top',PLATE);
  lab(ctx,W,H,b.x,b.y-2,strain?'four arms, the active gauges marked':'Wheatstone’s bridge','#aeb6c6','italic 13px Georgia, serif','left','top');
}

/* ================================================================== *
 *  view 6: the ladder                                                 *
 * ================================================================== */
function ladderCaption(M){
  const A=M.A;
  if(A.mode==='r2r') return {full:'An R–2R ladder: every node sees 2R towards the LSB end (its R in series with the R the rest of the ladder presents) and 2R down its own leg, so a current arriving at a node splits in half, and each bit counts twice the one before. '+(ST.aOut==='I'?'In current mode the reference drives the MSB end and every leg carries half the one to its right.':'In voltage mode the bits drive the legs and the output is Vref × code/2ᴺ.')+' A 1 % error in the MSB leg alone would already make an 8-bit ladder step backwards at the major carry (0111 1111 to 1000 0000): the limit is 1/(2ᴺ⁻¹ − 1). Press a switch to flip its bit.',
    short:'Every node halves the current: each bit counts twice the one before. Press a switch to flip it.'};
  return {full:'A Kelvin–Varley divider: each decade is eleven equal resistors, two of which are bridged by the next decade, whose input resistance is made twice one of them, so the bridged pair counts as one and the decade divides into ten equal steps; its input resistance stays 10 R₁ whatever the dials say. The next decade’s resistors are a fifth of this one’s. Build the second decade wrong (the slider) and the ratio errs in a pattern over the dials; the article’s fix, a resistor across it, puts it right.',
    short:'Each decade bridges two of its eleven resistors with twice their resistance: ten equal steps.'};
}
function drawLadder(ctx,W,H,M){
  const A=M.A, cap=ladderCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.42,nbNarrow(H));
  if(A.mode==='r2r'){ drawR2R(ctx,W,H,Lay.main,A); if(Lay.bottom[0]) plotStair(ctx,W,H,Lay.bottom[0],A); if(Lay.bottom[1]) plotDNL(ctx,W,H,Lay.bottom[1],A); }
  else { drawKV(ctx,W,H,Lay.main,A); if(Lay.bottom[0]) plotKVerr(ctx,W,H,Lay.bottom[0],A); if(Lay.bottom[1]) plotKVpow(ctx,W,H,Lay.bottom[1],A); }
  drawCaption(ctx,Lay);
}
function drawR2R(ctx,W,H,b,A){

      sWireV(ctx,[[x,ys[k+2]],[x+14,ys[k+2]],[xn-14,yT],[xn,yT]],v[bb.node(i,k+2)]);

      wires.push([x-14,ys[k],k,x+40,ys[k]]); }

    if(w.length>3) lab(ctx,W,H,w[3],w[4],'out '+fmt(K.ratio,nd+1)+' × Vin',COL.live,SM_FONT,'left','middle',PLATE); }

function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='split') drawSplit(ctx,W,H,M);
  else if(M.view==='land') drawLand(ctx,W,H,M);
  else if(M.view==='load') drawLoad(ctx,W,H,M);
  else if(M.view==='meter') drawMeter(ctx,W,H,M);
  else if(M.view==='bridge') drawBridge(ctx,W,H,M);
  else drawLadder(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  function setFrom(hit,x,y,down){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1), w=clamp((hit.b.y+hit.b.h-y)/hit.b.h,0,1);
    if(hit.kind==='tap'){ let best=0; for(let k=1;k<hit.ys.length-1;k++) if(Math.abs(hit.ys[k]-y)<Math.abs(hit.ys[best+1]-y)) best=k-1; ST.sTap=best; return true; }
    if(hit.kind==='branch'){ let best=0; hit.xk.forEach((xx,k)=>{ if(Math.abs(xx-x)<Math.abs(hit.xk[best]-x)) best=k; }); ST.sBr=best; return true; }
    if(hit.kind==='rl'){ const f=hit.lo*Math.pow(hit.hi/hit.lo,u); ST.dOpen=false; ST.dRL=clamp(f*loadView(ST).L.Rth,LIM.dRL[0],LIM.dRL[1]); ST.dPre='own'; return true; }
    if(hit.kind==='x'){ ST.dx=clamp(u,0,1); ST.dPre='own'; return true; }
    if(hit.kind==='wiper'){ ST.dx=clamp((hit.yB-y)/(hit.yB-hit.yT),0,1); ST.dPre='own'; return true; }
    if(hit.kind==='vrange'){ if(!down) return false; let best=0; hit.ty.forEach((yy,k)=>{ if(Math.abs(yy-y)<Math.abs(hit.ty[best]-y)) best=k; }); ST.mRange=hit.ranges[best]; ST.mPre='own'; return true; }
    if(hit.kind==='arange'){ if(!down) return false; let best=0; hit.ty.forEach((yy,k)=>{ if(Math.abs(yy-y)<Math.abs(hit.ty[best]-y)) best=k; }); ST.mARange=best; ST.mPre='own'; return true; }
    if(hit.kind==='vbar'||hit.kind==='abar'){ if(!down) return false; const i=clamp(Math.floor(u*hit.n),0,hit.n-1);
      if(hit.kind==='vbar') ST.mRange=hit.ranges[i]; else ST.mARange=i; ST.mPre='own'; return true; }
    if(hit.kind==='r2'){ ST.bR2=clamp(hit.lo*Math.pow(hit.hi/hit.lo,u),LIM.bR[0],LIM.bR[1]); return true; }
    if(hit.kind==='eps'){ ST.gEps=clamp(Math.round(-3000+6000*u),LIM.eps[0],LIM.eps[1]); return true; }
    if(hit.kind==='tT'){ ST.tT=clamp(Math.round((-40+165*u)*2)/2,LIM.tT[0],LIM.tT[1]); return true; }
    if(hit.kind==='therm'){ ST.tT=clamp(Math.round((-40+165*clamp((hit.t1-y)/(hit.t1-hit.t0),0,1))*2)/2,LIM.tT[0],LIM.tT[1]); return true; }
    if(hit.kind==='bits'){ if(!down) return false; let best=0; hit.xs.forEach((xx,k)=>{ if(Math.abs(xx-x)<Math.abs(hit.xs[best]-x)) best=k; }); ST.aCode^=(1<<best); return true; }
    if(hit.kind==='code'){ ST.aCode=clamp(Math.floor(u*hit.M),0,hit.M-1); return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; }
      if(hit.kind==='cam'){ DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST.camTheta; DRAG.ph=ST.camPhi; return false; }
      if(hit.kind==='face'){ DRAG.what=null; return false; }
      DRAG.what=hit; return setFrom(hit,x,y,true); }
    if(type==='move'){ if(!DRAG.what) return false;
      if(DRAG.what==='cam'){ ST.camTheta=DRAG.th-(x-DRAG.x)*0.008; ST.camPhi=clamp(DRAG.ph+(y-DRAG.y)*0.006,0.08,1.45); return true; }
      return setFrom(DRAG.what,x,y,false); }
    DRAG.what=null; return false;
  };
  return S;
}

  function setView(k){

  const logSlider=(key,lab,lo,hi,fmtf,onchg)=>slider(key,lab,0,LOGN,1,fmtf,onchg,logMap(lo,hi));

      listFn().forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); }); };
    build(); DYNROWS.push(build); return wrapEl;
  }

  gSplit.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'N'),chipRow(N_LIST,'sN',()=>{ st.sPre='own'; st.sTap=Math.min(st.sTap,st.sN-2); st.sBr=Math.min(st.sBr,st.sN-1); })));
  const rRows=[1,2,3,4,5].map(k=>logSlider('sR'+k,'R'+SUBS[k-1],LIM.R[0],LIM.R[1],v=>ohm(st.sE==='any'?v:snapE(v,st.sE),3),()=>{ st.sPre='own'; }));
  rRows.forEach(r=>gSplit.appendChild(r));

  gSplit.appendChild(logSlider('sIs','I (in parallel)',LIM.Is[0],LIM.Is[1],v=>amp(v,3),()=>{ st.sPre='own'; }));

  const splitTag=h('div',{class:'tag'}); gSplit.appendChild(splitTag);

const SRC_LINE='Via Wikipedia (wikitext fetched 2026-09-27): &ldquo;Voltage divider&rdquo;, &ldquo;Current divider&rdquo;, &ldquo;Th&eacute;venin&rsquo;s theorem&rdquo;, &ldquo;Norton&rsquo;s theorem&rdquo;, &ldquo;Maximum power transfer theorem&rdquo;, &ldquo;Johnson&ndash;Nyquist noise&rdquo;, &ldquo;Multimeter&rdquo;, &ldquo;Voltmeter&rdquo;, &ldquo;Galvanometer&rdquo;, &ldquo;Ayrton shunt&rdquo;, &ldquo;Wheatstone bridge&rdquo;, &ldquo;Strain gauge&rdquo;, &ldquo;Load cell&rdquo;, &ldquo;Thermistor&rdquo;, &ldquo;Resistor ladder&rdquo;, &ldquo;Kelvin&ndash;Varley divider&rdquo;, &ldquo;E series of preferred numbers&rdquo;, &ldquo;Resistor&rdquo;, &ldquo;Kirchhoff&rsquo;s circuit laws&rdquo;, &ldquo;Ohm&rsquo;s law&rdquo;, &ldquo;Boltzmann constant&rdquo;. The Vishay NTCLE100E3 datasheet (document 29049, 07-May-2025). build_div/derive.py solves every circuit here exactly over the rationals, and selfTest pins the page to it.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const INFO={
  split:'Put resistors in <b>series</b> across a battery and the same current passes through every one of them; the battery&rsquo;s voltage is shared out, each resistor taking a share in proportion to its resistance. That is the <b>voltage divider</b>: with 1 k&Omega; over 2 k&Omega; the lower resistor takes two thirds of 9 V, the Voltage-divider article&rsquo;s own example of 9 V into 6 V. Put the same resistors in <b>parallel</b> and the roles swap: one voltage stands across all of them and the current is shared, each taking a share in proportion to its <i>conductance</i>, 1/R, so the <i>smallest</i> resistor takes the <i>largest</i> current. That is the <b>current divider</b>. The lower plots say it with straight lines: the potential falls on one straight line against the resistance passed (the slope is the current), the current builds on one straight line against the conductance passed (the slope is the voltage). The last plot shows why the current splits as it does: of all the ways to share it out, the divider&rsquo;s is the one that heats the resistors least.',
  land:'The same circuits with the potential made into <b>height</b>. Every wire is level (a wire has no resistance to fall across), every resistor is a <b>ramp</b>, and the source is a <b>lift</b> that carries the charge back to the top. A voltage divider is a staircase of ramps down one path, and its middle stands at its share of the height; a current divider is several ramps from the same top to the same bottom side by side, the gentler ones carrying more. A <b>bridge</b> is two dividers side by side with a wire across their middles: when the middles stand level nothing runs along it. The dots are the charge, moving at a speed set by the current.',
  load:'Whatever is connected to a divider&rsquo;s output is one more resistor, in parallel with the lower one, and it pulls the output down. Seen from the output, the divider behaves as a voltage V<sub>th</sub> behind a resistance R<sub>th</sub> = R<sub>1</sub>&thinsp;&Vert;&thinsp;R<sub>2</sub> (the Th&eacute;venin equivalent, Helmholtz 1853 and Th&eacute;venin 1883), and the load and R<sub>th</sub> are themselves a divider: a load ten times R<sub>th</sub> keeps 90.9 % of the output, a hundred times 99.0 %. The load takes the most power when it equals R<sub>th</sub> (Jacobi&rsquo;s law, around 1840), and then as much is lost in R<sub>th</sub> as reaches the load. A potentiometer is a divider whose tap slides; loaded, its output falls short of the wiper&rsquo;s position, most near two-thirds of the way up.',
  meter:'An analog multimeter is one moving-coil <b>movement</b> and a switch full of dividers. To read <b>volts</b> a resistor goes in series with the coil so that the range&rsquo;s full voltage drives the coil&rsquo;s full-scale current: the coil and its multiplier are a voltage divider, and the meter&rsquo;s resistance is its <b>ohms per volt</b> (the reciprocal of the full-scale current: 50 &micro;A makes 20,000 &Omega;/V) times the range. Connected across a divider it is one more load, so it reads low where the divider&rsquo;s own resistance is not small beside it. To read <b>current</b> the coil is shunted: Ayrton&rsquo;s shunt is one tapped chain, a current divider on every range that never leaves the coil unshunted as the switch moves. The comparison shows the same divider read by the meters of a century, from the first Avometer&rsquo;s 60 &Omega;/V to a digital meter&rsquo;s 10 G&Omega;.',
  bridge:'A <b>bridge</b> is two dividers across one source with a detector between their middles. The detector sees only the <i>difference</i>, so at balance (Christie 1833, Wheatstone 1843) the unknown is fixed by the other three arms alone, whatever the source and whatever the detector. Read without nulling, the same bridge turns a small change of resistance into a voltage: <b>strain gauges</b> (a quarter, half or full bridge; a load cell is a full bridge rated in mV/V) and, as half a bridge, a <b>thermistor</b> divider, whose fixed resistor decides where the output is steepest, where it is straightest and how much of the supply it spans.',
  ladder:'An <b>R&ndash;2R ladder</b> is a string of current dividers: every node sees 2R towards the least significant end and 2R down its own leg, so a current arriving there splits in half, and each bit carries twice the weight of the one before. Only two resistor values are needed, and the output resistance is R whatever the code; but the ladder is only as good as its resistors match, and the most significant bit&rsquo;s leg must be the best: a small error there makes the output step <i>backwards</i> at the major carry. The <b>Kelvin&ndash;Varley divider</b> uses loading on purpose: each decade&rsquo;s eleven resistors have two of them bridged by the next decade, built with exactly twice their resistance, so the pair acts as one and every decade divides its span into ten.'
};
const DERIV={
  split:'<h4>series: one current</h4>'
    +EQ(1,'I = '+FR('V','R<sub>1</sub> + R<sub>2</sub> + &hellip; + R<sub>N</sub>')+', &nbsp; V<sub>k</sub> = I R<sub>k</sub> = V '+FR('R<sub>k</sub>','&Sigma;R'))
    +'<p>Kirchhoff&rsquo;s voltage law (1845): the drops around the loop add up to the battery&rsquo;s V; Ohm&rsquo;s law (1827) makes each drop I R<sub>k</sub>. A tap sits at V times the resistance <i>below</i> it over the total: 1 k&Omega; over 2 k&Omega; from 9 V puts the tap at '+volt(PX.wiki.taps[0],3)+'.</p>'
    +EQ(2,'V(r) = V &minus; I r, &nbsp; r = the resistance passed from the top')
    +'<h4>parallel: one voltage</h4>'
    +EQ(3,'V = '+FR('I','G<sub>1</sub> + &hellip; + G<sub>N</sub>')+', &nbsp; I<sub>k</sub> = V G<sub>k</sub> = I '+FR('G<sub>k</sub>','&Sigma;G')+', &nbsp; G = 1/R')
    +'<p>For two branches, I<sub>1</sub> = I R<sub>2</sub>/(R<sub>1</sub> + R<sub>2</sub>): the <i>other</i> resistor stands on top. The same algebra as [1] with R and G, V and I exchanged: the two dividers are each other&rsquo;s duals.</p>'
    +EQ(4,'I(g) = V g, &nbsp; g = the conductance passed')
    +'<h4>the least heat</h4>'
    +EQ(5,'P(x) = x&sup2;R<sub>b</sub> + (I &minus; x)&sup2;R<sub>rest</sub> &nbsp;&rArr;&nbsp; '+FR('dP','dx')+' = 0 at x = I '+FR('R<sub>rest</sub>','R<sub>b</sub> + R<sub>rest</sub>'))
    +'<p>Send x through one branch and let the rest share I &minus; x as they would (as one resistor R<sub>rest</sub>): the heat is a parabola in x, lowest exactly at the divider&rsquo;s share, where it equals V I. Of all the ways to share a current, the circuit takes the one that heats least (Maxwell&rsquo;s theorem; the Current-divider article: &ldquo;in such a way as to minimize the total energy expended&rdquo;).</p>'
    +'<h4>the parts</h4><p>Resistors are sold in the E series of IEC 60063: E24&rsquo;s 24 values per decade are 5 % parts, E96&rsquo;s 96 are 1 %. The values are near 10<sup>n/24</sup> rounded, but '+PX.e24+' of E24&rsquo;s keep the older values they had before the standard (2.7 for 2.6, 3.3 for 3.2, &hellip; 8.2 for 8.3). With every resistor anywhere in its tolerance, the tap&rsquo;s extremes are at the corners: all the resistors above it high and all below it low, or the reverse. For 5 V into 3.3 V the nearest E24 pair is '+ohm(PX.logic.R1,2)+' over '+ohm(PX.logic.R2,2)+', '+volt(5*PX.logic.ratio,4)+'.</p>',
  land:'<h4>height is potential</h4>'
    +EQ(1,'&Delta;U = q &Delta;V, &nbsp; P = I &Delta;V')
    +'<p>Lifting a charge q through a potential difference &Delta;V takes q&Delta;V of work, and a current I falling through &Delta;V gives up I&Delta;V of power as heat: the landscape&rsquo;s height is energy per unit charge. A resistor&rsquo;s slope along its length is the field inside it, the current over the conductance per unit length.</p>'
    +EQ(2,'V<sub>D</sub> = V<sub>B</sub> &nbsp;&hArr;&nbsp; '+FR('R<sub>2</sub>','R<sub>1</sub> + R<sub>2</sub>')+' = '+FR('R<sub>x</sub>','R<sub>3</sub> + R<sub>x</sub>'))
    +'<p>The bridge&rsquo;s middles stand level when the two dividers divide in the same ratio; a galvanometer between level points carries nothing, whatever its own resistance.</p>',
  load:'<h4>Th&eacute;venin&rsquo;s equivalent</h4>'
    +EQ(1,'V<sub>th</sub> = V '+FR('R<sub>2</sub>','R<sub>1</sub> + R<sub>2</sub>')+', &nbsp; R<sub>th</sub> = '+FR('R<sub>1</sub>R<sub>2</sub>','R<sub>1</sub> + R<sub>2</sub>')+' = H R<sub>1</sub>')
    +'<p>V<sub>th</sub> is the output with nothing connected; R<sub>th</sub> is what the output sees looking back with the battery replaced by a wire: R<sub>1</sub> and R<sub>2</sub> in parallel. (Helmholtz 1853, Th&eacute;venin 1883; the current-source form, Norton and Mayer, 1926.)</p>'
    +EQ(2,'V<sub>L</sub> = V<sub>th</sub> '+FR('R<sub>L</sub>','R<sub>th</sub> + R<sub>L</sub>')+', &nbsp; shortfall = '+FR('R<sub>th</sub>','R<sub>th</sub> + R<sub>L</sub>'))
    +'<p>The shortfall is computed as written, not as 1 &minus; V<sub>L</sub>/V<sub>th</sub>, which loses its digits for a light load.</p>'
    +EQ(3,'P<sub>L</sub> = '+FR('V<sub>th</sub>&sup2;R<sub>L</sub>','(R<sub>th</sub> + R<sub>L</sub>)&sup2;')+' &le; '+FR('V<sub>th</sub>&sup2;','4R<sub>th</sub>')+' (at R<sub>L</sub> = R<sub>th</sub>)')
    +'<h4>the potentiometer</h4>'
    +EQ(4,FR('V','V<sub>s</sub>')+' = '+FR('x','1 + k x(1 &minus; x)')+', &nbsp; k = R<sub>p</sub>/R<sub>L</sub>')
    +'<p>The shortfall x &minus; V/V<sub>s</sub> = k x&sup2;(1 &minus; x)/(1 + k x(1 &minus; x)). Setting its derivative to zero leaves k x(1 &minus; x)&sup2; = 3x &minus; 2, whose root lies between 2/3 and 1; for a light load it is 2/3 and the shortfall there 4k/27 (at k = 0.001: x = '+fmt(PX.pot.x,4)+', '+sigf(PX.pot.err,4)+' against 4k/27 = '+sigf(0.004/27,4)+').</p>'
    +'<h4>the noise</h4>'

    +'<p>Each resistor&rsquo;s Johnson noise reaches the output through the divider the other makes, and the two add to the noise of R<sub>th</sub> alone. With k = 1.380649 &times; 10<sup>&minus;23</sup> J/K (exact) at 300 K, 10 k&Omega; gives '+eng(PX.noise10k,'V',3)+'/&radic;Hz, the article&rsquo;s &ldquo;approximately 13 nV&rdquo;.</p>',

    +'<p>The Multimeter article&rsquo;s example: a 1 mA, 500 &Omega; movement on its 10 V range needs '+ohm(PX.mult10,4)+' in series. Ohms per volt is 1/I<sub>fs</sub>: 50 &micro;A makes 20,000 &Omega;/V, and on the 300 V range that is 6 M&Omega;.</p>'

    +EQ(3,'R<sub>sh</sub> = '+FR('I<sub>fs</sub>R<sub>m</sub>','I &minus; I<sub>fs</sub>')+', &nbsp; Ayrton: S<sub>k</sub>I<sub>k</sub> = I<sub>fs</sub>(R<sub>m</sub> + R<sub>sh</sub>)')

  bridge:'<h4>the balance</h4>'
    +EQ(1,'V<sub>G</sub> = V<sub>s</sub> '+FR('R<sub>2</sub>R<sub>3</sub> &minus; R<sub>1</sub>R<sub>x</sub>','(R<sub>1</sub> + R<sub>2</sub>)(R<sub>3</sub> + R<sub>x</sub>)')+', &nbsp; I<sub>g</sub> = '+FR('V<sub>G</sub>','R<sub>1</sub>&Vert;R<sub>2</sub> + R<sub>3</sub>&Vert;R<sub>x</sub> + R<sub>g</sub>'))
    +'<p>The difference of the two dividers is written over one denominator so that it does not cancel as the bridge nears balance. The galvanometer sees the bridge as V<sub>G</sub> behind the two dividers&rsquo; Th&eacute;venin resistances in series.</p>'
    +'<h4>strain</h4>'
    +EQ(2,'&delta; = GF &epsilon;: &nbsp; '+FR('V<sub>out</sub>','V')+' = '+FR('&delta;','2(2 + &delta;)')+' (one arm), '+FR('&delta;','2')+' (two), &delta; (four)')

    +'<h4>the thermistor</h4>'
    +EQ(3,'R(T) = R<sub>25</sub>e<sup>g(T)</sup>, g = A + B/T + C/T&sup2; + D/T&sup3;; &nbsp; '+FR('d&sup2;V','dT&sup2;')+' = 0 at r = '+FR('g&prime;&sup2; + g&Prime;','g&prime;&sup2; &minus; g&Prime;'))

  ladder:'<h4>the R&ndash;2R ladder</h4>'

      S.draw(); const w=HIT.find(q=>q.kind==='wiper'); down(w.b.x+5,w.yB-(w.yB-w.yT)*0.8); up(); close(ST.dx,0.8,1e-12,'and a press on the track'); });
    withState({view:'meter'},()=>{ S.draw(); const h=HIT.find(q=>q.kind==='vbar'); down(h.b.x+h.b.w*(6.5/h.n),h.b.y+20); up(); eq(ST.mRange,h.ranges[6],'a press on a bar picks its range');
      S.draw(); const s=HIT.find(q=>q.kind==='vrange'); down(s.b.x+10,s.ty[2]); up(); eq(ST.mRange,s.ranges[2],'a press on the switch picks a range'); });
    withState({view:'meter',mFn:'A'},()=>{ S.draw(); const s=HIT.find(q=>q.kind==='arange'); down(s.b.x+10,s.ty[2]); up(); eq(ST.mARange,2,'a press on the Ayrton switch'); });
    withState({view:'bridge'},()=>{ S.draw(); const h=HIT.find(q=>q.kind==='r2'); down(h.b.x+h.b.w*0.3,h.b.y+10); up(); rel(ST.bR2,h.lo*Math.pow(h.hi/h.lo,0.3),1e-12,'a press on the null curve sets R2'); });
    withState({view:'bridge',bMode:'strain'},()=>{ S.draw(); const h=HIT.find(q=>q.kind==='eps'); down(h.b.x+h.b.w*0.75,h.b.y+10); up(); eq(ST.gEps,1500,'a press on the strain plot'); });
    withState({view:'bridge',bMode:'ntc'},()=>{ S.draw(); const h=HIT.find(q=>q.kind==='tT'); down(h.b.x+h.b.w*(80/165),h.b.y+10); up(); close(ST.tT,40,1e-9,'a press on the curve sets T');
      S.draw(); const m=HIT.find(q=>q.kind==='therm'); if(m){ down(m.b.x+5,m.t1-(m.t1-m.t0)*(65/165)); up(); close(ST.tT,25,1e-9,'and on the thermometer'); } });
    withState({view:'ladder'},()=>{ S.draw(); const h=HIT.find(q=>q.kind==='bits'); down(h.xs[0],h.b.y+20); up(); eq(ST.aCode,11,'a press on bit 0\'s switch flips it: 1010 -> 1011');
      S.draw(); { const h2=HIT.find(q=>q.kind==='bits'); down(h2.xs[0],h2.b.y+20); up(); eq(ST.aCode,10,'and a second press flips it back'); }
      S.draw(); const c=HIT.find(q=>q.kind==='code'); down(c.b.x+c.b.w*(3.5/16),c.b.y+10); up(); eq(ST.aCode,3,'a press on the staircase picks a code'); });
    withState({view:'land'},()=>{ S.draw(); const h=HIT.find(q=>q.kind==='cam'); down(h.b.x+100,h.b.y+100); S.pointer('move',h.b.x+150,h.b.y+100); up();
      close(ST.camTheta,DEFAULTS.camTheta-50*0.008,1e-12,'a drag across turns the landscape'); close(ST.camPhi,DEFAULTS.camPhi,1e-15,'and not up');
      down(h.b.x+100,h.b.y+100); S.pointer('move',h.b.x+100,h.b.y+140); up(); close(ST.camPhi,DEFAULTS.camPhi+40*0.006,1e-12,'a drag down tips it'); }); }

  /* ---------- 11. the drawing: every view and preset at four sizes ---------- */
  const shot=(over,W,H)=>withState(over,()=>{ const c=makeShot(W||1100,H||712); drawView(c,W||1100,H||712,buildModel()); return {ops:c.ops,hit:HIT.slice()}; });
  { const S=shot({view:'split'}); ok(S.hit.some(q=>q.kind==='tap')&&S.hit.some(q=>q.kind==='branch'),'the two dividers can be pressed');
    const T=S.ops.filter(q=>q.op==='text').map(q=>q.t); ok(T.includes('6.00 V')&&T.includes('2.00 mA')&&T.includes('1.00 mA'),'the tap and both branch currents are written on the picture'); }
  { const S=shot({view:'split',sN:3,sR3:1000}), T=S.ops.filter(q=>q.op==='text').map(q=>q.t).join(' '); ok(T.indexOf('the smallest resistor, R₁, takes the most')>=0,'the caption names the smallest resistor');
    const E=shot({view:'split',sPre:'equal',sR1:1e4,sR2:1e4}).ops.filter(q=>q.op==='text').map(q=>q.t).join(' '); ok(E.indexOf('equal resistors take equal shares')>=0,'and says so when they are equal'); }
  { const T=shot({view:'land',lCirc:'bridge'}).ops.filter(q=>q.op==='text').map(q=>q.t); ok(T.includes('R₁')&&T.includes('Rₓ')&&T.includes('10 V'),'the bridge landscape names its arms'); }
  { const n=o=>shot(o).ops.filter(q=>q.op==='fill'&&q.style===COL.charge).length; ok(n({view:'split'})>=4&&n({view:'land'})>=4,'the charge is drawn in both animated views'); }
  /* where the audit (text against text) is blind: a label over a curve or a wire, a line under a line, a squeezed stage */
  const segBox=(a,b,bb)=>{ const x0=bb[0]+1, y0=bb[1]+1, x1=bb[2]-1, y1=bb[3]-1, dx=b[0]-a[0], dy=b[1]-a[1]; let t0=0, t1=1;
    for(const [p,q] of [[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){
      if(p===0){ if(q<0) return false; } else { const r=q/p; if(p<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } } }
    return true; };
  const hitsBox=(op,bb)=>(op.paths||[]).some(p=>p.some((q,i)=>i>0&&segBox(p[i-1],q,bb)));
  const npts=op=>(op.paths||[]).reduce((s,p)=>s+p.length,0);
  { let n=0;
    for(const o of [{view:'split'},{view:'split',sN:5,sBr:4},{view:'split',sN:5,sBr:0},{view:'split',sPre:'thou',sR1:10,sR2:1e4,sVs:10,sIs:0.01},{view:'split',sR1:1e4,sR2:1e4},{view:'split',sN:3,sBr:1,sR2:100}])
      for(const [W,H] of [[1400,820],[1100,712],[1100,700]]){ const S=shot(o,W,H), L=S.ops.find(q=>q.op==='text'&&q.t==='the divider: the least heat');
        const curve=S.ops.filter(q=>q.op==='stroke'&&q.style===COL.heat).sort((a,b)=>npts(b)-npts(a))[0];
        if(!L||!curve){ ok(false,'the heat plot and its label are drawn: '+JSON.stringify(o)+' at '+W+'x'+H); continue; } n++;
        ok(npts(curve)>100&&!hitsBox(curve,L.bb),'the least-heat label leaves the parabola clear: '+JSON.stringify(o)+' at '+W+'x'+H); }
    eq(n,18,'the heat label checked on 18 pictures'); }
  for(const o of [{view:'split'},{view:'split',sN:5},{view:'split',sN:3,sBr:2},{view:'split',sPre:'thou',sR1:10,sR2:1e4,sVs:10,sIs:0.01},{view:'split',sN:4,sR1:1e4,sR2:1e4,sR3:1e4,sR4:1e4}])
    for(const [W,H] of [[1400,820],[1100,712],[820,520],[560,380]]){ const S=shot(o,W,H), g=S.hit.find(q=>q.kind==='branch'), par=withState(o,()=>buildModel().S.par);
      par.I.forEach((I,k)=>{ const L=S.ops.find(q=>q.op==='text'&&q.t===amp(I,3)&&Math.abs((q.bb[0]+q.bb[2])/2-g.xk[k])<2);
        ok(!!L&&!S.ops.some(q=>q.op==='stroke'&&hitsBox(q,L.bb)),'branch '+(k+1)+'\'s current is written under it, clear of every wire: '+JSON.stringify(o)+' at '+W+'x'+H); }); }
  for(const conf of ['quarter','half','full']){ const S=shot({view:'bridge',bMode:'strain',gConf:conf}), b=S.hit.find(q=>q.kind==='eps').b;
    const across=(q,col)=>q.op==='stroke'&&q.style===col&&(q.paths||[]).some(p=>p.length>1&&p.every(z=>z[0]>=b.x-2&&z[0]<=b.x1+2&&z[1]>=b.y-2&&z[1]<=b.y1+2)&&Math.abs(p[p.length-1][0]-p[0][0])>0.5*b.w);
    const iCur=S.ops.findIndex(q=>across(q,COL.pos)), iRef=S.ops.findIndex(q=>across(q,COL.ref));
    ok(iCur>=0&&iRef>iCur,conf+' bridge: the straight line GF eps/4 is drawn over the curves (within 0.3 % of the quarter bridge, beneath it it would vanish)'); }
  { const cap=withState({view:'split',sN:5},()=>splitCaption(buildModel()));
    for(const [W,H] of [[1400,820],[1100,700],[820,520],[560,380]]) for(const [nb,fr] of [[3,0.38],[2,0.44],[2,0.42],[3,0.44]]){
      const L=stageLayout(makeShot(W,H),W,H,cap.full,cap.short,nb,fr,nbNarrow(H));
      ok(L.main.h>=120&&L.bottom.every(q=>q.h>=90),W+'x'+H+', '+nb+' plots: the picture keeps '+L.main.h.toFixed(0)+' px (120 or more) and every plot 90 or more ('+(L.bottom.map(q=>q.h.toFixed(0)).join(', ')||'none')+')'); } }
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[['split',{view:'split',t:1.3}],['split n5',{view:'split',sN:5,sTap:3,sBr:4,t:0.4}],['split e24 n4',{view:'split',sN:4,sE:'E24',sTap:1,t:2}],['split thou',{view:'split',sPre:'thou',sR1:10,sR2:1e4,sVs:10,sIs:0.01}],
    ['split extremes',{view:'split',sR1:1,sR2:1e7,sVs:100,sIs:1e-5}],['split elec',{view:'split',sElec:true,sN:3,t:3.3}],['split e6 n5',{view:'split',sN:5,sE:'E6'}],
    ...LAND_LIST.map(o=>['land '+o.id,{view:'land',lCirc:o.id,t:0.8}]),['land turned',{view:'land',lCirc:'bridge',camTheta:-0.6,camPhi:1.3}],['land flat',{view:'land',lCirc:'chain',camPhi:0.08}],
    ['land ratio 20',{view:'land',lRatio:20}],['land ratio 0.05',{view:'land',lCirc:'idiv',lRatio:0.05}],['land bridge -0.9',{view:'land',lCirc:'bridge',lDelta:-0.9}],['land r2r 15',{view:'land',lCirc:'r2r',lCode:15}],['land r2r 0',{view:'land',lCirc:'r2r',lCode:0}],
    ['load',{view:'load'}],['load open',{view:'load',dOpen:true}],['load tiny',{view:'load',dRL:1}],['load huge',{view:'load',dRL:1e9}],['load dmm',{view:'load',dPre:'dmm',dR1:1e6,dR2:1e6,dRL:1e7}],
    ['pot',{view:'load',dMode:'pot'}],['pot k10',{view:'load',dMode:'pot',dRLp:1000,dx:0.9}],['pot k0.001',{view:'load',dMode:'pot',dRLp:1e7,dx:0.05}],
    ['meter',{view:'meter'}],['meter 1m',{view:'meter',mMove:'1m'}],['meter mega',{view:'meter',mR1:1e6,mR2:1e6}],['meter low',{view:'meter',mR1:1e3,mR2:1e3,mRange:3}],['meter 20u 0.1',{view:'meter',mMove:'20u',mRange:0.1}],
    ['meter 1000',{view:'meter',mRange:1000,mVs:1000}],['amps',{view:'meter',mFn:'A'}],['amps 1m',{view:'meter',mFn:'A',mMove:'1m',mARange:2}],['amps off',{view:'meter',mFn:'A',mARange:0,mRa:1}],
    ['bridge',{view:'bridge'}],['bridge bal',{view:'bridge',bR2:4321}],['bridge hide',{view:'bridge',bHide:true,bR2:1}],['bridge far',{view:'bridge',bR2:1e6,bRx:1}],
    ['strain',{view:'bridge',bMode:'strain'}],['strain half',{view:'bridge',bMode:'strain',gConf:'half',gEps:-3000}],['strain full 0',{view:'bridge',bMode:'strain',gConf:'full',gEps:0}],
    ['ntc',{view:'bridge',bMode:'ntc'}],['ntc inflect',{view:'bridge',bMode:'ntc',tRule:'inflect',tT:62}],['ntc swing bottom',{view:'bridge',bMode:'ntc',tRule:'swing',tTop:false,tT:-40,tLo:-40,tHi:125}],
    ['ntc narrow',{view:'bridge',bMode:'ntc',tLo:20,tHi:25,tRule:'slope',tT:125}],
    ['ladder',{view:'ladder'}],['ladder cur',{view:'ladder',aOut:'I',aN:5,aCode:19}],['ladder mis',{view:'ladder',aN:8,aSig:1,aCode:128}],['ladder 2',{view:'ladder',aN:2,aCode:3}],['ladder 8 bad',{view:'ladder',aN:8,aSig:5,aCode:255,aOut:'I'}],
    ['kv',{view:'ladder',aMode:'kv'}],['kv mis',{view:'ladder',aMode:'kv',kEps:0.02,kD:3,kd0:9,kd1:5,kd2:1}],['kv trim',{view:'ladder',aMode:'kv',kEps:0.5,kTrim:true,kD:2,kd0:4,kd1:6}],['kv low',{view:'ladder',aMode:'kv',kEps:-0.2,kd0:0,kd1:0,kd2:0,kd3:0}]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke');
      ok(strokes.length>=20&&texts.length>=(over.view==='land'?5:8),nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+texts.length+' texts)');
      { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/\^/.test(t.t)){ bad='a caret power: "'+t.t.slice(0,40)+'"'; break; }
        if(/\d[eE][-+]?\d/.test(t.t)){ bad='a raw exponent: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
      let across=null;
      for(const L of LABELS){ if(L.seq===undefined) continue;
        for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
        if(across) break; }
      ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
      if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key fits ('+KEY_DROPS+' dropped)');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
