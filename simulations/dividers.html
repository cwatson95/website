<title>Voltage &amp; current dividers &mdash; how two resistors share a voltage or a current, and the instruments built on it</title>
<!--
  ===================================================================
  dividers.html — the voltage divider and the current divider: how
  resistors in series split a voltage and resistors in parallel split
  a current, and what is built from those two facts: loads and their
  Thevenin equivalents, meters, bridges and ladders
  ===================================================================

  Six views.  THE TWO DIVIDERS: the same two to five resistors in
  series from a battery and in parallel from a current source, the
  wires coloured by their potential and the charge drawn moving at a
  speed set by the current; the voltage falls along the chain on one
  straight line against the resistance passed (its slope is the
  current), the current builds across the branches on one straight
  line against the conductance passed (its slope is the voltage), and
  the branches share the current in the one way that heats the least
  (Maxwell); resistors taken from an E series with its tolerance.  THE
  LANDSCAPE: the circuit laid on a board with the height of every
  wire its potential: resistors are ramps, the source a lift, and a
  bridge is balanced when its two middles stand at the same height.
  THE LOAD: a divider feeding a load, its Thevenin equivalent (the
  output falls to R_L/(R_th + R_L) of itself: the 10x rule), the power
  the load can take (most at R_L = R_th, Jacobi's law, half of it lost),
  a loaded potentiometer (its error largest near two-thirds of the
  travel) and the divider's Johnson noise, which is that of R_th alone.
  THE METER: an analog multimeter built from one movement: the chain of
  multipliers that makes it a voltmeter (a voltage divider), the
  Ayrton shunt that makes it an ammeter (a current divider), the needle
  on its scale, the reading it gives on a high-resistance divider, the
  best range once the 3 % of full scale is counted, and the same
  divider read by the meters of a century.  THE BRIDGE: two dividers
  compared: Wheatstone's null, strain gauges in a quarter, half and full
  bridge (mV/V), and a thermistor divider with the datasheet's own
  resistance law, its fixed resistor chosen for slope, for linearity
  or for the widest swing, and its self-heating.  THE LADDER: the R-2R
  ladder as a string of current dividers each halving, its staircase,
  and what resistor tolerance does to it (DNL, INL, the major carry);
  and the Kelvin-Varley divider, dividers loaded on purpose.

  WHAT IS QUOTED (build_div/data/constants.txt, checked verbatim by
  build_div/check_sources.py against the sources fetched 2026-09-27)
  -----------------------------------------------------------------------
  Wikipedia wikitext: "Voltage divider" (9 V -> 6 V needs R2 = 2 R1,
  the source resistance H Z1, 100 kV probes, 5 V and 3.3 V logic);
  "Current divider" (the least energy; the R_T form); "Kirchhoff's
  circuit laws" (1845); "Ohm's law" (1827); "Thevenin's theorem"
  (Helmholtz 1853, Thevenin 1883); "Norton's theorem" (Mayer and Norton,
  1926); "Maximum power transfer theorem" (Jacobi, around 1840; 50 %);
  "Johnson-Nyquist noise" (13 nV/sqrt(Hz) for 10 k; Johnson 1927,
  Nyquist 1928); "Boltzmann constant" (1.380649e-23 J/K, exact);
  "Multimeter" (50 uA = 20,000 ohm/V, 6 M on 300 V, 2 M on 100 V; the
  1 mA, 500 ohm movement with 9,500 ohm on 10 V and just over 0.5 ohm on
  1 A; +-3 % of full scale; DMMs 1 or 10 M, >10 G at 10 V and below;
  the Avometer's 60 and 166.6 ohm/V, 1,000 ohm/V for radio, 20,000 after
  1945, 50,000 the limit; the VTVM's 1 M); "Voltmeter" (1000 ohm/V on
  200 V is 200000 ohm; DVMs 10 M, 1 G); "Galvanometer" (100 uA, 50 mV;
  shunts are current dividers); "Ayrton shunt"; "Wheatstone bridge"
  (Christie 1833, Wheatstone 1843, Maxwell 1865, V_G and R_x); "Strain
  gauge" (Simmons and Ruge 1938, GF a little over 2, SV = EV GF eps/4,
  the dummy gauge); "Load cell" (2.96 mV/V gives 29.6 mV at 10 V, 1 to
  3 mV/V, 350 ohm, 120 and 1,000); "Thermistor" (the B equation at
  298.15 K, self-heating, 1.5 and 6.0 mW/C, Faraday 1833); "Resistor
  ladder" (V_ref D/2^n, 3.196875 and 0.103125 V, output resistance R, a
  string of current dividers, 1/32 and 1/256); "Kelvin-Varley divider"
  (eleven resistors, 2 R_i, 10 R_i, a fifth per stage, 10 k 2 k 400 80
  16, 0.2073, 0.1 ppm, 10 W 1 W 0.25 W at 1000 V, 3 k with 60 k -> 20 k,
  tempcos); "E series of preferred numbers" (the lists and their
  tolerances, the formula, eight E24 exceptions, E192's 9.20);
  "Resistor" (tempcos).  The Vishay NTCLE100E3 datasheet (document
  29049, revision 07-May-2025): the 10 k part's B25/85 = 3977 K, its
  law's constants (material A), its resistance table from -40 to
  150 C, its dissipation factor 7 mW/K and its worked example.

  WHAT IS COMPUTED HERE AND CHECKED BY build_div/derive.py
  --------------------------------------------------------
  Everything else is arithmetic on circuits, recomputed in derive.py by
  a route that shares no code with this page: every network is solved
  there by exact nodal analysis over the rationals (Python fractions),
  so its node potentials are exact, and every closed form this page
  uses is checked against those solves; exp, log and sqrt at 60 digits.
  It also recomputes what the sources print (the worked examples, the
  E-series exceptions, B25/85 from the table, the thermistor law
  against its own table, Kelvin-Varley's watts).

  WHAT IS MODELLED
  ----------------
  Ideal resistors, sources, wires and switches; DC only.  Meter
  movements are resistances with a full-scale current (the 50 and 20 uA
  coils' 50 mV drop is assumed, as the Galvanometer article's example;
  the 1 mA and 100 uA coils are the sources' own); a meter's error is
  its loading plus 3 % of full scale.  The thermistor follows the
  datasheet's law; the strain gauges are linear in strain.  Resistor
  mismatch is drawn from a seeded normal distribution.

  KNOWN-BAD: DO NOT REINTRODUCE (details in the Agent repo,
  projects/simulations/CHANGELOG.md)
  ---------------------------------------------------------
  - Cancellation: a tap as V minus the drops above it, a loaded
    divider's shortfall as 1 - V_L/V_th (half its digits gone at a
    10 G load on 1 k), a bridge's V_G as the difference of two ratios near balance.
    Sum the taps from the bottom; form Rth/(Rth + RL) and
    (R2 R3 - R1 Rx)/((R1 + R2)(R3 + Rx)) directly.
  - Wheatstone's R2 R3/R1 is the Rx the dial implies, not the R2 that
    balances (R1 Rx/R3): swapping them moves the null.
  - The Ayrton burden differs from tap to tap; what is the same on
    every tap is S_k I_k.
  - Kirchhoff on a drawn board: split every wire at every junction
    (a T mid-wire is a node), and set a leaf stub's current to exactly
    0 first, or it carries 1e-18 A and its dots crawl.  A battery's
    lift runs from its - end to its + end, or the landscape stands
    upside down.
  - The readout and the panel tags are HTML: R_th and 2^N show as
    typed.  <sub>/<sup> there; Unicode sub- and superscripts on the
    canvas.  Both suites scan for a raw X_y or caret.
  - "null" in panel text trips the NaN/null scan (the mode is 'wheat',
    the prose says balance); a part number like NTCLE100E3103 reads as
    a raw exponent.
  - The layout audit checks text against text only: a label over a
    curve or a wire, a line drawn beneath the line it annotates and a
    squeezed stage all pass it.  selfTest section 11 checks those.
  - Wikipedia's R-2R monotonicity bound 1/2^N is conservative by about 2: the
    MSB leg may be off by 1/(2^(N-1) - 1) before the major carry steps
    back.  The E series are the published lists: the formula misses
    eight E24 values and E192's 9.20.  Consecutive mulberry32 seeds
    are correlated: scramble the seed.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);

/* ================================================================== *
 *  the physics.  Every network on this page is solved twice: by the   *
 *  nodal solve below (solveNet, floating point) and by its closed     *
 *  form; selfTest pins both to build_div/derive.py, which solves the  *
 *  same networks exactly over the rationals.                          *
 * ================================================================== */
const KB=DATA.kB*1e-23, T_NOISE=300;            /* J/K (exact, SI 2019), and the noise temperature used here */

/* ---- nodal analysis.  n nodes, node 0 the ground.  R: [a, b, ohms].  V: [p, q, volts], an ideal source
   with v_p - v_q = volts; j[k] is its current, out of the + terminal into node p.  I: [a, b, amps], amps
   taken from node a through the source into node b.  Dense Gaussian elimination with partial pivoting:
   these networks have at most a few dozen nodes. ---- */
function solveNet(n,R,V,I){
  const m=(V||[]).length, N=n-1+m;
  const A=[]; for(let i=0;i<N;i++){ A.push(new Float64Array(N+1)); }
  for(const e of R){ const a=e[0], b=e[1], g=1/e[2];
    if(a){ A[a-1][a-1]+=g; if(b) A[a-1][b-1]-=g; }
    if(b){ A[b-1][b-1]+=g; if(a) A[b-1][a-1]-=g; } }
  (V||[]).forEach((s,k)=>{ const p=s[0], q=s[1], col=n-1+k;
    if(p){ A[p-1][col]-=1; A[col][p-1]+=1; }
    if(q){ A[q-1][col]+=1; A[col][q-1]-=1; }
    A[col][N]=s[2]; });
  for(const s of (I||[])){ if(s[1]) A[s[1]-1][N]+=s[2]; if(s[0]) A[s[0]-1][N]-=s[2]; }
  for(let c=0;c<N;c++){
    let p=c, best=Math.abs(A[c][c]);
    for(let r=c+1;r<N;r++){ const x=Math.abs(A[r][c]); if(x>best){ best=x; p=r; } }
    if(!(best>0)) throw new Error('solveNet: singular network');
    if(p!==c){ const t=A[p]; A[p]=A[c]; A[c]=t; }
    const row=A[c], pv=row[c];
    for(let r=c+1;r<N;r++){ const f=A[r][c]/pv; if(f!==0){ const rr=A[r]; for(let k=c;k<=N;k++) rr[k]-=f*row[k]; } }
  }
  const x=new Float64Array(N);
  for(let r=N-1;r>=0;r--){ let s=A[r][N]; for(let k=r+1;k<N;k++) s-=A[r][k]*x[k]; x[r]=s/A[r][r]; }
  const v=new Float64Array(n); for(let i=1;i<n;i++) v[i]=x[i-1];
  return {v, j:Array.from(x.slice(n-1))};
}
const parR=(...rs)=>1/rs.reduce((s,r)=>s+1/r,0);

/* ================================================================== *
 *  1. the two dividers                                                *
 * ================================================================== */
/* a chain R_1 (top, at the source) .. R_N (into the ground): the closed forms */
function seriesChain(Rs,Vs){
  const Rt=Rs.reduce((s,r)=>s+r,0), I=Vs/Rt;
  const drops=Rs.map(r=>I*r);
  /* the tap below R_(k+1) sits at Vs times the resistance BELOW it over the total: summed from the bottom, never
     as Vs minus the drops above (which cancels when the lower part is small) */
  const taps=[]; for(let k=0;k<Rs.length-1;k++){ let below=0; for(let j=k+1;j<Rs.length;j++) below+=Rs[j]; taps.push(Vs*below/Rt); }
  const v=[Vs].concat(taps,[0]);                 /* every node from the top to the ground */
  return {Rt,I,drops,taps,v,P:Vs*I};
}
/* the same chain by the nodal solve (the second route) */
function seriesChainNet(Rs,Vs){
  const N=Rs.length, R=Rs.map((r,k)=>[k+1,k<N-1?k+2:0,r]);
  const s=solveNet(N+1,R,[[1,0,Vs]]);
  return {v:Array.from(s.v.slice(1)).concat([0]), I:s.j[0]};
}
/* branches in parallel from a current source */
function parallelSet(Rs,Is){
  const Gt=Rs.reduce((s,r)=>s+1/r,0), V=Is/Gt;
  return {Gt,V,I:Rs.map(r=>V/r),P:Is*V};
}
function parallelSetNet(Rs,Is){
  const s=solveNet(2,Rs.map(r=>[1,0,r]),[],[[0,1,Is]]);
  return {V:s.v[1], I:Rs.map(r=>s.v[1]/r)};
}
/* Maxwell's least heat: all the current but x goes through the other branches, which share it their own way
   (as one resistor R_rest); P(x) = x^2 R_b + (I - x)^2 R_rest is a parabola whose lowest point is the divider's */
function heatCurve(Rs,Is,b){
  const Gt=Rs.reduce((s,r)=>s+1/r,0), Rb=Rs[b], Rrest=1/(Gt-1/Rb);
  const xstar=Is*Rrest/(Rb+Rrest);
  const P=x=>x*x*Rb+(Is-x)*(Is-x)*Rrest;
  return {Rb,Rrest,xstar,Pmin:P(xstar),P};
}
/* tolerance: each resistor anywhere in R (1 +- t).  The tap potential rises with every resistor below it and
   falls with every one above, so its extremes are corners (derive.py checks all 2^N) */
function tolBandV(Rs,tap,t,Vs){
  const f=rs=>{ let below=0,tot=0; rs.forEach((r,k)=>{ tot+=r; if(k>tap) below+=r; }); return Vs*below/tot; };
  return [f(Rs.map((r,k)=>k<=tap?r*(1+t):r*(1-t))), f(Rs.map((r,k)=>k<=tap?r*(1-t):r*(1+t)))];
}
function tolBandI(Rs,b,t,Is){
  const g=rs=>Is*(1/rs[b])/rs.reduce((s,r)=>s+1/r,0);
  return [g(Rs.map((r,k)=>k===b?r*(1+t):r*(1-t))), g(Rs.map((r,k)=>k===b?r*(1-t):r*(1+t)))];
}

/* ---- the E series (IEC 60063, as the "E series of preferred numbers" article lists them) ---- */
const ESER={E6:DATA.e6, E12:DATA.e12, E24:DATA.e24, E96:DATA.e96};
const ETOL={E6:DATA.e6_tol, E12:DATA.e12_tol, E24:DATA.e24_tol, E96:DATA.e96_tol};
/* round(10^(n/m)) to 2 or 3 figures, as the article's formula, for the exceptions */
function eFormula(m,sig){
  const out=[];
  for(let n=0;n<m;n++){ const x=Math.pow(10,n/m), q=Math.pow(10,sig-1);
    /* half-up rounding at the second or third figure; x is never within 1e-12 of a half here (derive.py
       rounds the exact decimal and gets the same lists) */
    out.push(Math.round(x*q+1e-12)/q); }
  return out;
}
function eExceptions(name){
  const m={E6:6,E12:12,E24:24,E96:96}[name], sig=name==='E96'?3:2, c=eFormula(m,sig), o=ESER[name], out=[];
  for(let n=0;n<m;n++) if(Math.abs(c[n]-o[n])>1e-9) out.push([n,c[n],o[n]]);
  return out;
}
/* the preferred value nearest R in log distance (the decade below and above searched too) */
function snapE(R,name){
  if(!ESER[name]) return R;
  const lr=Math.log10(R), dec=Math.floor(lr); let best=null, bd=Infinity;
  for(let d=dec-1;d<=dec+1;d++) for(const v of ESER[name]){ const c=v*Math.pow(10,d), dd=Math.abs(Math.log10(c)-lr);
    if(dd<bd-1e-12){ bd=dd; best=c; } }
  /* v * 10^d in floating point: 4.7 * 1000 is 4700.000000000001; round to the series' figures */
  return +best.toPrecision(name==='E96'?3:2);
}
/* the pair (R1 over R2) from one series, 1 k to 91 k (97.6 k for E96), whose ratio R2/(R1 + R2) is nearest the
   target; equal ratios go to the smaller R1 + R2, then the smaller R1 (derive.py's exact rule) */
function bestPair(target,name){
  const vals=[]; for(let d=3;d<=4;d++) for(const v of ESER[name]) vals.push(+(v*Math.pow(10,d)).toPrecision(name==='E96'?3:2));
  let best=null;
  for(const r1 of vals) for(const r2 of vals){
    const err=Math.abs(r2/(r1+r2)-target);
    if(!best||err<best.err-1e-12*target||(Math.abs(err-best.err)<=1e-12*target&&(r1+r2<best.r1+best.r2||(r1+r2===best.r1+best.r2&&r1<best.r1))))
      best={r1,r2,err}; }
  return {R1:best.r1,R2:best.r2,ratio:best.r2/(best.r1+best.r2),err:best.r2/(best.r1+best.r2)-target};
}

/* ================================================================== *
 *  3. the load                                                        *
 * ================================================================== */
const johnson=(R,T)=>Math.sqrt(4*KB*(T===undefined?T_NOISE:T)*R);
function loadModel(Vs,R1,R2,RL){
  const Vth=Vs*R2/(R1+R2), Rth=R1*R2/(R1+R2);
  const o={Vs,R1,R2,RL,Vth,Rth,noise:johnson(Rth)};
  if(!(RL<Infinity)){ Object.assign(o,{VL:Vth,err:0,IL:0,PL:0,Pmax:Vth*Vth/(4*Rth),Isrc:Vs/(R1+R2)}); o.Psrc=Vs*o.Isrc; o.eta_th=1; o.eta_src=0; return o; }
  /* the shortfall R_th/(R_th + R_L) is formed directly: 1 - V_L/V_th would cancel for a light load (a 10 G
     meter on a 1 k divider leaves 1e-7) */
  const err=Rth/(Rth+RL), VL=Vth*RL/(Rth+RL), IL=VL/RL, PL=VL*IL;
  const Isrc=(Vs-VL)/R1, Psrc=Vs*Isrc;
  return Object.assign(o,{VL,err,IL,PL,Pmax:Vth*Vth/(4*Rth),eta_th:RL/(RL+Rth),Isrc,Psrc,eta_src:PL/Psrc});
}
function loadModelNet(Vs,R1,R2,RL){
  const s=solveNet(3,[[1,2,R1],[2,0,R2],[2,0,RL]],[[1,0,Vs]]);
  return {VL:s.v[2], Isrc:s.j[0]};
}
/* the potentiometer: R_p with its wiper x of the way up, a load R_L on the wiper; k = R_p/R_L */
const potRatio=(x,k)=>x/(1+k*x*(1-x));
const potErr=(x,k)=>{ const u=k*x*(1-x); return x*u/(1+u); };          /* x - ratio, formed without the cancellation */
/* where the error is largest: d/dx [x - ratio] = 0 reduces to k x (1 - x)^2 - 3x + 2 = 0, whose root lies in
   (2/3, 1) for every k > 0 (at 2/3 the left side is 4k/27 > 0, at 1 it is -1); bisection, 60 halvings */
function potPeak(k){
  if(!(k>0)) return {x:2/3,err:0};
  let lo=2/3, hi=1;
  for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(k*m*(1-m)*(1-m)-3*m+2>=0) lo=m; else hi=m; }
  const x=(lo+hi)/2; return {x,err:potErr(x,k)};
}

/* ================================================================== *
 *  4. the meter                                                       *
 * ================================================================== */
/* four movements.  1 mA, 500 ohm: the Multimeter article's example (1,000 ohm/V, the radio standard).
   100 uA, 50 mV: the Galvanometer article's (500 ohm, 10,000 ohm/V).  50 uA (20,000 ohm/V, the standard after
   1945) and 20 uA (50,000 ohm/V, the limit): their coils' 50 mV at full scale is ASSUMED, as the Galvanometer
   example's, and the page says so. */
const MOVES={
  '1m':  {Ifs:DATA.mm_ex_ifs*1e-3, Rm:DATA.mm_ex_rm, name:'1 mA, 500 Ω', src:'the Multimeter article’s example', assumed:false},
  '100u':{Ifs:DATA.gal_100ua*1e-6, Rm:DATA.gal_50mv*1e-3/(DATA.gal_100ua*1e-6), name:'100 µA, 500 Ω', src:'the Galvanometer article’s example', assumed:false},
  '50u': {Ifs:1/DATA.mm_20k, Rm:0.05*DATA.mm_20k, name:'50 µA, 1 kΩ', src:'20,000 Ω/V; its 50 mV coil drop assumed', assumed:true},
  '20u': {Ifs:1/DATA.mm_50k, Rm:0.05*DATA.mm_50k, name:'20 µA, 2.5 kΩ', src:'50,000 Ω/V; its 50 mV coil drop assumed', assumed:true}};
const VRANGES=[0.1,0.3,1,3,10,30,100,300,1000];
const AMULT=[10,100,1000];                                    /* the Ayrton shunt's ranges, in units of I_fs */
function voltRanges(mv){ return VRANGES.filter(r=>r>mv.Ifs*mv.Rm*(1+1e-12)); }
/* the multiplier chain: the first range's series resistance, then what each further range adds */
function multChain(mv){
  const rs=voltRanges(mv), seg=[];
  rs.forEach((r,i)=>seg.push(i===0?r/mv.Ifs-mv.Rm:(r-rs[i-1])/mv.Ifs));
  return {ranges:rs,seg};
}
const voltRin=(mv,range)=>range/mv.Ifs;                        /* the ohm-per-volt rule */
/* the Ayrton shunt: a chain R_sh across the coil, tapped so that on range k the part S_k below the tap is the
   shunt and the rest rides with the coil.  S_k I_k = I_fs (R_m + R_sh) on every range (Ayrton's rule). */
function ayrton(mv){
  const I=AMULT.map(m=>m*mv.Ifs), Rsh=mv.Ifs*mv.Rm/(I[0]-mv.Ifs);
  const S=I.map(Ik=>mv.Ifs*(mv.Rm+Rsh)/Ik);
  const seg=[S[0]-S[1],S[1]-S[2],S[2]];
  const burden=S.map((s,k)=>mv.Ifs*(mv.Rm+Rsh-s));             /* the drop at full scale: I_fs (R_m + R_sh - S_k) */
  const Rmeter=S.map(s=>s*(mv.Rm+Rsh-s)/(mv.Rm+Rsh));
  return {I,Rsh,S,seg,burden,Rmeter};
}
/* the coil current on range k when I flows in, by the nodal solve (the second route) */
function ayrtonNet(mv,k,I){
  const A=ayrton(mv), up=A.Rsh-A.S[k];
  const s=up>0?solveNet(3,[[1,2,up],[2,0,mv.Rm],[1,0,A.S[k]]],[],[[0,1,I]]):solveNet(2,[[1,0,mv.Rm],[1,0,A.S[k]]],[],[[0,1,I]]);
  return {Vt:s.v[1], Icoil:(up>0?s.v[2]:s.v[1])/mv.Rm};
}
const meterReading=(Vth,Rth,Rin)=>Vth*Rin/(Rth+Rin);
/* every range of a movement on a divider (V_th behind R_th): the reading, whether it stays on the scale, and
   the worst case: the loading error plus 3 % of the range's full scale, over the true value */
function rangeTable(mv,Vth,Rth,acc){
  const a=acc===undefined?DATA.mm_acc/100:acc;
  return voltRanges(mv).map(r=>{ const Rin=voltRin(mv,r), Vm=meterReading(Vth,Rth,Rin);
    return {range:r,Rin,Vm,on:Vm<=r,worst:(Rth/(Rth+Rin)*Vth+a*r)/Vth}; });
}
function bestRange(rows){ let b=null; for(const r of rows) if(r.on&&(!b||r.worst<b.worst)) b=r; return b; }
/* the other meters of a century: [key, label, input resistance on the range that holds V (ohm/V times that
   range), or a fixed input resistance] */
const OTHER_METERS=[
  ['avo1','the first Avometer, 60 Ω/V',{opv:DATA.mm_avo1,ranges:[12,120,600]}],
  ['radio','a radio serviceman’s 1,000 Ω/V',{opv:DATA.mm_radio}],
  ['vom20k','a 20,000 Ω/V VOM (after 1945)',{opv:DATA.mm_postwar}],
  ['vom50k','the best unamplified, 50,000 Ω/V',{opv:DATA.mm_50k}],
  ['vtvm','a valve voltmeter, 1 MΩ',{fixed:DATA.mm_vtvm*1e6}],
  ['dmm','a digital multimeter, 10 MΩ',{fixed:DATA.vm_dvm*1e6}],
  ['hiz','a high-end DMM, >10 GΩ',{fixed:DATA.mm_10G*1e9}]];
/* the range a meter would be set to: the lowest of its ranges (the 1-3-10 ladder unless it has its own) that holds v */
function holdRange(v,ranges){ const rs=ranges||VRANGES; for(const r of rs) if(r>=v*(1-1e-12)) return r; return rs[rs.length-1]; }
function otherReading(spec,Vth,Rth){
  const Rin=spec.fixed!==undefined?spec.fixed:spec.opv*holdRange(Vth,spec.ranges);
  return {Rin,Vm:meterReading(Vth,Rth,Rin)};
}

 * ================================================================== */
/* the Wheatstone article's labels: R1 over R2 (the node D between them), R3 over Rx (node B), V_G = V_D - V_B.
   V_G is formed as a difference of PRODUCTS over the product of the sums: the difference of the two ratios
   cancels as the bridge nears balance. */
function wheatstone(Vs,R1,R2,R3,Rx,Rg){
  const VG=Vs*(R2*R3-R1*Rx)/((R1+R2)*(R3+Rx));
  const Rth=R1*R2/(R1+R2)+R3*Rx/(R3+Rx);
  /* rxNow: the R_x the present R2 would balance (the bridge's reading); r2Bal: the R2 that balances this R_x */
  const o={VD:Vs*R2/(R1+R2), VB:Vs*Rx/(R3+Rx), VG, Rth, rxNow:R2*R3/R1, r2Bal:R1*Rx/R3};
  if(Rg!==undefined&&Rg!==null) o.Ig=VG/(Rth+Rg);
  return o;
}
function wheatstoneNet(Vs,R1,R2,R3,Rx,Rg){
  const R=[[1,2,R1],[2,0,R2],[1,3,R3],[3,0,Rx]]; if(Rg) R.push([2,3,Rg]);
  const s=solveNet(4,R,[[1,0,Vs]]);
  return {VD:s.v[2], VB:s.v[3], VG:s.v[2]-s.v[3], Ig:Rg?(s.v[2]-s.v[3])/Rg:0, Is:s.j[0]};
}
/* the article's inversion: R_x from V_G */
const rxFromVG=(Vs,R1,R2,R3,VG)=>(R2*Vs-(R1+R2)*VG)/(R1*Vs+(R1+R2)*VG)*R3;
/* strain gauges: an active arm is R_G (1 + s delta), delta = GF eps.  Quarter: R2 (+).  Half: R2 (+), R1 (-).
   Full: R2 (+), R1 (-), R3 (+), Rx (-).  The output per volt in closed form: */
const STRAIN_SIGNS={quarter:[0,1,0,0], half:[-1,1,0,0], full:[-1,1,1,-1]};
function strainOut(conf,GF,eps){
  const d=GF*eps;
  return conf==='quarter'?d/(2*(2+d)):conf==='half'?d/2:d;
}
function strainArms(conf,GF,eps,RG){ const d=GF*eps; return STRAIN_SIGNS[conf].map(s=>RG*(1+s*d)); }
/* the linear approximation the Strain-gauge article gives (SV = EV GF eps / 4 for one active gauge) and its
   multiples for two and four active arms */
const strainLinear=(conf,GF,eps)=>GF*eps*(conf==='quarter'?0.25:conf==='half'?0.5:1);

/* ---- the thermistor: Vishay NTCLE100E3103, the datasheet's own law (material A) ---- */
const NTC={R25:DATA.ntc_r25, B:DATA.ntc_b2585, A:DATA.ntc_A, Bc:DATA.ntc_B, C:DATA.ntc_C, D:DATA.ntc_D,
           A1:DATA.ntc_A1, B1:DATA.ntc_B1, C1:DATA.ntc_C1, D1:DATA.ntc_D1, T0:DATA.th_T0, delta:DATA.ntc_delta*1e-3,
           Tmin:DATA.ntc_tmin, Tmax:DATA.ntc_tmax};
const K0C=NTC.T0-25;                                          /* 273.15, from the article's "25 C = 298.15 K" */
function ntcR(Tc){ const T=Tc+K0C; return NTC.R25*Math.exp(NTC.A+NTC.Bc/T+NTC.C/(T*T)+NTC.D/(T*T*T)); }
function ntcT(R){ const l=Math.log(R/NTC.R25); return 1/(NTC.A1+l*(NTC.B1+l*(NTC.C1+l*NTC.D1)))-K0C; }
/* the B model (one constant, fixed at 25 and 85 C) */
function ntcRbeta(Tc,B){ return NTC.R25*Math.exp((B||NTC.B)*(1/(Tc+K0C)-1/NTC.T0)); }
function ntcTbeta(R,B){ return 1/(1/NTC.T0+Math.log(R/NTC.R25)/(B||NTC.B))-K0C; }
/* g(T) = ln(R/R25): its first two derivatives, and the local B = -T^2 g' */
function ntcG(Tc){ const T=Tc+K0C;
  const g1=-NTC.Bc/(T*T)-2*NTC.C/(T*T*T)-3*NTC.D/(T*T*T*T);
  const g2=2*NTC.Bc/(T*T*T)+6*NTC.C/(T*T*T*T)+12*NTC.D/(T*T*T*T*T);
  return {g1,g2,Bl:-T*T*g1}; }
/* the divider: the thermistor on top (V rises with T) or at the bottom (V falls) */
function ntcV(Tc,Rf,Vs,top){ const Rt=ntcR(Tc); return top?Vs*Rf/(Rf+Rt):Vs*Rt/(Rf+Rt); }
/* three choices of R_f.  The steepest at T_m: R_f = R(T_m).  The inflection at T_m (d2V/dT2 = 0, the same for
   either position): R(T_m)/r with r = (g'^2 + g'')/(g'^2 - g''); with a constant B this is the textbook
   (B - 2T)/(B + 2T), which the law's B, growing with T, moves by about 4 %.  The widest swing over
   [T_lo, T_hi]: sqrt(R(T_lo) R(T_hi)). */
const rfSlope=Tm=>ntcR(Tm);
function rfInflect(Tm){ const g=ntcG(Tm), r=(g.g1*g.g1+g.g2)/(g.g1*g.g1-g.g2); return ntcR(Tm)/r; }
function rfInflectBeta(Tm,B){ const T=Tm+K0C, b=B||ntcG(Tm).Bl; return ntcR(Tm)*(b-2*T)/(b+2*T); }
const rfSwing=(lo,hi)=>Math.sqrt(ntcR(lo)*ntcR(hi));
/* the largest departure of V(T) from its chord over [lo, hi], in degrees (the deviation over the chord's slope):
   a 400-step scan, the largest refined by a parabola through its neighbours */
function ntcNonlin(Rf,lo,hi,Vs,top){
  const V=T=>ntcV(T,Rf,Vs||1,top!==false), Vlo=V(lo), Vhi=V(hi), sl=(Vhi-Vlo)/(hi-lo);
  const dev=T=>(V(T)-(Vlo+sl*(T-lo)))/sl, n=400;
  let wi=0, wv=0;
  for(let i=0;i<=n;i++){ const d=dev(lo+(hi-lo)*i/n); if(Math.abs(d)>Math.abs(wv)){ wv=d; wi=i; } }
  let at=lo+(hi-lo)*wi/n;
  if(wi>0&&wi<n){ const h=(hi-lo)/n, a=dev(at-h), c=dev(at+h), den=a-2*wv+c;
    if(den!==0){ const u=clamp(0.5*(a-c)/den,-1,1); at+=u*h; wv=dev(at); } }
  return {dev:wv,at,slope:sl};
}
/* self-heating: the power in the thermistor over the dissipation factor (7 mW/K) */
function ntcHeat(Tc,Rf,Vs){ const Rt=ntcR(Tc), I=Vs/(Rf+Rt), P=I*I*Rt; return {P,dT:P/NTC.delta}; }

 *  6. the ladder                                                      *
 * ================================================================== */
/* voltage mode: ladder nodes 1..N (LSB .. MSB = the output), node N+1+i the source of bit i (V_ref or 0).
   Rs = [termination 2R, series R_1..R_(N-1), legs 2R_0..2R_(N-1)]. */
function r2rNominal(N,R){ const out=[2*R]; for(let i=0;i<N-1;i++) out.push(R); for(let i=0;i<N;i++) out.push(2*R); return out; }
function r2rNet(N,code,Rs,Vref){
  const R=[[1,0,Rs[0]]];
  for(let i=0;i<N-1;i++) R.push([i+1,i+2,Rs[1+i]]);
  for(let i=0;i<N;i++) R.push([i+1,N+1+i,Rs[N+i]]);
  const V=[]; for(let i=0;i<N;i++) V.push([N+1+i,0,(code>>i)&1?Vref:0]);
  const s=solveNet(2*N+1,R,V);
  return {v:Array.from(s.v.slice(1,N+1)), out:s.v[N], legs:Array.from({length:N},(_,i)=>(s.v[N+1+i]-s.v[i+1])/Rs[N+i])};
}
const r2rIdeal=(N,code,Vref)=>Vref*code/Math.pow(2,N);
/* the output resistance: every bit source is a wire to the ground whatever its bit, so it is the same for every
   code; found by pushing 1 A into the output and reading the potential there */
function r2rRout(N,Rs){
  const R=[[1,0,Rs[0]]];
  for(let i=0;i<N-1;i++) R.push([i+1,i+2,Rs[1+i]]);
  for(let i=0;i<N;i++) R.push([i+1,0,Rs[N+i]]);
  return solveNet(N+1,R,[],[[0,N,1]]).v[N];
}
/* current mode: V_ref drives the MSB node, every leg to 0 V (a virtual ground or the ground); the node potentials
   halve towards the LSB and so do the legs' currents, V_ref/R 2^(i-N) */
function r2rCurrent(N,Rs,Vref){
  const R=[[1,0,Rs[0]]];
  for(let i=0;i<N-1;i++) R.push([i+1,i+2,Rs[1+i]]);
  for(let i=0;i<N;i++) R.push([i+1,0,Rs[N+i]]);
  const s=solveNet(N+1,R,[[N,0,Vref]]);
  const v=Array.from(s.v.slice(1,N+1));
  return {v, legs:v.map((x,i)=>x/Rs[N+i]), Iin:s.j[0]};
}
/* seeded mismatch.  mulberry32; the stream is re-seeded from the first draw of mulberry32(seed), because
   consecutive seeds give correlated streams (loop_quantum_gravity's Known-bad); normals by Box-Muller */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function ladderZ(N,seed){
  const rnd=mulberry32(Math.floor(mulberry32(seed)()*4294967296)), z=[];
  for(let i=0;i<2*N;i++){ const u1=rnd(), u2=rnd(); z.push(Math.sqrt(-2*Math.log(1-u1))*Math.cos(2*Math.PI*u2)); }
  return z;
}
/* the mismatched ladder: its bit weights by superposition (the network is linear), every code's output as a
   sum of weights, DNL and INL against the end-point line */
function ladderMC(N,sigma,seed,R,Vref){
  const z=ladderZ(N,seed), nom=r2rNominal(N,R), Rs=nom.map((r,k)=>r*(1+sigma*z[k]));
  const w=[]; for(let i=0;i<N;i++) w.push(r2rNet(N,1<<i,Rs,Vref).out);
  const M=1<<N, outs=new Float64Array(M);
  for(let c=0;c<M;c++){ let s=0; for(let i=0;i<N;i++) if((c>>i)&1) s+=w[i]; outs[c]=s; }
  const lsb=(outs[M-1]-outs[0])/(M-1), dnl=new Float64Array(M-1), inl=new Float64Array(M);
  let maxd=0, maxi=0, mono=true;
  for(let c=0;c<M-1;c++){ dnl[c]=(outs[c+1]-outs[c])/lsb-1; maxd=Math.max(maxd,Math.abs(dnl[c])); if(dnl[c]<=-1) mono=false; }
  for(let c=0;c<M;c++){ inl[c]=(outs[c]-outs[0])/lsb-c; maxi=Math.max(maxi,Math.abs(inl[c])); }
  return {z,Rs,w,outs,lsb,dnl,inl,maxdnl:maxd,maxinl:maxi,mono,carry:dnl[M/2-1]};
}
/* the major carry with the MSB leg alone off by delta: a = 1/(1 + delta) against the lower bits' (M-1)/M,
   M = 2^(N-1).  It steps backwards (DNL = -1) at delta = 1/(M - 1) exactly. */
function carryDNL(N,delta){ const M=Math.pow(2,N-1), a=1/(1+delta), q=(M-1)/M; return (a-q)*(2*M-1)/(a+q)-1; }
const monoLimit=N=>1/(Math.pow(2,N-1)-1);

/* ---- the Kelvin-Varley divider: len(digits) decades; the first len-1 are stages of eleven equal resistors,
   the last a Kelvin divider of ten.  Stage i+1 bridges resistors k_i and k_i + 1 (from the bottom) of stage i.
   R_(i+1) = R_i/5; eps scales the second stage and all below it by (1 + eps) (a mis-built stage), and trim puts
   R_t = 2 R_1 (1 + eps)/eps across the second stage's input (the article's 3 k resistors with 60 k: 20 k). ---- */
function kvBuild(digits,R1,eps,trim){
  const nd=digits.length, Rst=[R1];
  for(let i=1;i<nd;i++) Rst.push(Rst[i-1]/5*(i===1?1+(eps||0):1));
  /* node numbering: stage i's taps j = 0..count; stage 0's tap 0 is the ground; stage i+1's ends are stage i's
     taps k_i and k_i + 2 */
  const id={}; let next=1;
  const key=(i,j)=>i+':'+j;
  const nodeOf=(i,j)=>{ if(i===0&&j===0) return 0; const k=key(i,j); if(id[k]===undefined) id[k]=next++; return id[k]; };
  const alias=(i,j)=>{ /* resolve stage i's end taps to the tap of the stage above */
    while(i>0){ const cnt=i<nd-1?11:10; if(j===0){ j=digits[i-1]; i=i-1; } else if(j===cnt){ j=digits[i-1]+2; i=i-1; } else break; }
    return [i,j]; };
  const node=(i,j)=>{ const a=alias(i,j); return nodeOf(a[0],a[1]); };
  const R=[], stage=[];
  for(let i=0;i<nd;i++){ const cnt=i<nd-1?11:10;
    for(let j=0;j<cnt;j++) R.push([node(i,j),node(i,j+1),Rst[i],i,j]);
    stage.push({count:cnt,R:Rst[i]}); }
  let Rt=null;
  if(trim&&eps>0&&nd>1){ Rt=2*R1*(1+eps)/eps; R.push([node(0,digits[0]),node(0,digits[0]+2),Rt,-1,-1]); }
  return {nd,R,stage,top:node(0,nd>1?11:10),out:node(nd-1,digits[nd-1]),n:next,node,Rt,Rst};
}
function kvSolve(digits,R1,Vin,eps,trim){
  const b=kvBuild(digits,R1,eps,trim);
  const s=solveNet(b.n,b.R.map(e=>[e[0],e[1],e[2]]),[[b.top,0,Vin]]);
  const I=s.j[0];
  const pw=b.R.map(e=>{ const dvv=s.v[e[0]]-s.v[e[1]]; return dvv*dvv/e[2]; });
  return {b,v:s.v,ratio:s.v[b.out]/Vin,Rin:Vin/I,Iin:I,P:pw,Ptot:Vin*I};
}

function splitRs(st){ const raw=[st.sR1,st.sR2,st.sR3,st.sR4,st.sR5].slice(0,st.sN); return raw.map(r=>st.sE==='any'?r:snapE(r,st.sE)); }
function splitView(st){

/* ---- the landscape: each circuit as a netlist on a board (x, y), solved; the drawing lifts every point to the

function landCircuit(st){
  const k=st.lCirc;
  /* elements: {kind:'R'|'V'|'I'|'W'|'G', a, b (the netlist's nodes), p0, p1 (the nodes at its first and last
     point: a resistor runs a -> b, a battery from its - end b to its + end a, a current source a -> b), pts: its
     board polyline, lab}.  Wires are split at every junction, so the current law at the points sees each branch. */
  const E=[]; let n=1, V=[], I=[], title='', outs=[];
  const W=(a,pts)=>E.push({kind:'W',a,b:a,p0:a,p1:a,pts});
  const Rr=(a,b,r,pts,lab,kind)=>E.push({kind:kind||'R',a,b,p0:a,p1:b,r,pts,lab});
  const Vb=(p,q,val,pts,lab,extra)=>E.push(Object.assign({kind:'V',a:p,b:q,p0:q,p1:p,val,pts,lab},extra||{}));
  if(k==='vdiv'||k==='loaded'){
    const R1=1000, R2=1000*(k==='vdiv'?st.lRatio:1), Vs=9; n=3;
    Vb(1,0,Vs,[[0,0],[0,2]],'9 V');
    W(1,[[0,2],[2,2]]); Rr(1,2,R1,[[2,2],[2,1]],'R₁'); Rr(2,0,R2,[[2,1],[2,0]],'R₂'); W(0,[[2,0],[0,0]]);
    W(2,[[2,1],[3,1]]);
    if(k==='loaded'){ const RL=500*st.lRL; Rr(2,0,RL,[[3,1],[3,0]],'the load'); W(0,[[3,0],[2,0]]); }
    else outs.push([2,[3,1],'the middle']);
    V=[[1,0,Vs]]; title=k==='vdiv'?'9 V across R₁ and R₂ in series':'the same divider with a load of '+sigf(st.lRL,2)+' × (R₁ ‖ R₂)';
  } else if(k==='idiv'){
    const R1=1000, R2=1000*st.lRatio, Is=0.003; n=2;
    E.push({kind:'I',a:0,b:1,p0:0,p1:1,val:Is,pts:[[0,0],[0,2]],lab:'3 mA'});
    W(1,[[0,2],[1.5,2]]); W(1,[[1.5,2],[3,2]]);
    Rr(1,0,R1,[[1.5,2],[1.5,0]],'R₁'); Rr(1,0,R2,[[3,2],[3,0]],'R₂');
    W(0,[[3,0],[1.5,0]]); W(0,[[1.5,0],[0,0]]);
    I=[[0,1,Is]]; title='3 mA shared by R₁ and R₂ in parallel';
  } else if(k==='chain'){
    n=6; Vb(1,0,10,[[0,0],[0,5]],'10 V'); W(1,[[0,5],[2,5]]);
    for(let i=0;i<5;i++){ const a=i+1, b=i<4?i+2:0; Rr(a,b,1000,[[2,5-i],[2,4-i]],'R'+SUBS[i]);
      if(i<4){ W(i+2,[[2,4-i],[2.7,4-i]]); outs.push([i+2,[2.7,4-i],'']); } }
    W(0,[[2,0],[0,0]]); V=[[1,0,10]]; title='10 V down five equal resistors';
  } else if(k==='bridge'){
    n=4; const Rx=1000*(1+st.lDelta);
    Vb(1,0,10,[[0,0],[0,2]],'10 V'); W(1,[[0,2],[1,2]]); W(1,[[1,2],[3,2]]);
    Rr(1,2,1000,[[1,2],[1,1]],'R₁'); Rr(2,0,1000,[[1,1],[1,0]],'R₂');
    Rr(1,3,1000,[[3,2],[3,1]],'R₃'); Rr(3,0,Rx,[[3,1],[3,0]],'Rₓ');
    Rr(2,3,1000,[[1,1],[3,1]],null,'G'); W(0,[[3,0],[1,0]]); W(0,[[1,0],[0,0]]);
    V=[[1,0,10]]; title='two dividers from 10 V, a galvanometer between their middles';
  } else {  /* 4 bits, R = 1 k, Vref = 10 V: ladder nodes 1..4 along the top (LSB first), bit sources 5..8 rising
               from a ground bus; the terminating 2R to the left of the LSB */
    n=9; const code=clamp(Math.round(st.lCode),0,15);
    Rr(1,0,2000,[[0,2],[-1,2]],'2R'); W(0,[[-1,2],[-1,0]]); W(0,[[-1,0],[0,0]]);
    for(let i=0;i<3;i++){ Rr(i+1,i+2,1000,[[i,2],[i+1,2]],'R'); W(0,[[i,0],[i+1,0]]); }
    for(let i=0;i<4;i++){ Rr(i+1,5+i,2000,[[i,2],[i,1]],'2R');
      Vb(5+i,0,(code>>i)&1?10:0,[[i,0],[i,1]],'bit '+i+' = '+((code>>i)&1),{bit:(code>>i)&1}); }
    W(4,[[3,2],[4,2]]); outs.push([4,[4,2],'the output']);
    for(let i=0;i<4;i++) V.push([5+i,0,(code>>i)&1?10:0]);
    title='a 4-bit R–2R ladder at code '+code+' ('+code.toString(2).padStart(4,'0')+')';
  }
  const R=E.filter(e=>e.kind==='R'||e.kind==='G').map(e=>[e.a,e.b,e.r]);
  const sol=solveNet(n,R,V,I);
  const v=sol.v;
  /* every element's current along its points (p0 -> p1): a resistor's from a to b; a battery's j leaves its +
     terminal, so inside it the current runs from - (p0) to + (p1); a current source's is its value */
  E.forEach(e=>{ if(e.kind==='R'||e.kind==='G') e.i=(v[e.a]-v[e.b])/e.r;
    else if(e.kind==='V'){ const vi=V.findIndex(s=>s[0]===e.a); e.i=sol.j[vi]; }
    else if(e.kind==='I') e.i=e.val; });

}
/* the wires' currents, by Kirchhoff's current law at the board's points: every element carries its current from
   its first point to its last; the wires of one node form a tree, so a point with a single unknown wire fixes it,
   and peeling such points from the leaves settles them all (an output stub, a leaf, carries nothing) */
function landWires(E){
  const key=p=>p[0].toFixed(6)+','+p[1].toFixed(6);
  const at={};
  E.forEach(e=>{ for(const [p,end] of [[e.pts[0],0],[e.pts[e.pts.length-1],1]]){ const k=key(p); (at[k]=at[k]||[]).push([e,end]); } });
  const wires=E.filter(e=>e.kind==='W'); wires.forEach(w=>{ w.i=undefined; });
  /* a wire with an end nothing else touches (a stub to an output terminal) carries exactly nothing: settle those
     first, or the junction at their other end would hand them its rounding residue (1e-18 A) */
  for(const k in at) if(at[k].length===1&&at[k][0][0].kind==='W') at[k][0][0].i=0;
  for(let pass=0;pass<wires.length+2;pass++){
    let progress=false;
    for(const k in at){ const list=at[k], unk=list.filter(([e])=>e.i===undefined);
      if(unk.length!==1) continue;
      let out=0; for(const [e,end] of list) if(e.i!==undefined) out+=end===0?e.i:-e.i;
      const [w,end]=unk[0]; w.i=end===0?-out:out; progress=true; }
    if(!progress) break;
  }
  wires.forEach(w=>{ if(w.i===undefined) w.i=0; });
}
function landView(st){ return memo('land',JSON.stringify([st.lCirc,st.lRatio,st.lRL,st.lDelta,st.lCode]),()=>landCircuit(st)); }

function loadView(st){
  if(st.dMode==='pot'){

    const L=loadModel(Vs,Math.max(R1,1e-9*Rp),Math.max(R2,1e-9*Rp),RL);

function meterView(st){

const LAD_R=10000;
function ladderView(st){

    const mc=memo('mc',JSON.stringify([N,sig,st.aSeed,st.aVref]),()=>ladderMC(N,sig,st.aSeed,LAD_R,st.aVref));
    const net=r2rNet(N,code,mc.Rs,st.aVref), cur=r2rCurrent(N,mc.Rs,st.aVref);
    const ideal=r2rIdeal(N,code,st.aVref);

    for(let d1=0;d1<10;d1++) for(let d2=0;d2<10;d2++){ const dg=[d1,d2].concat(new Array(st.kD-2).fill(0)); const s=kvSolve(dg,1e4,1,st.kEps,st.kTrim);

function buildModel(){
  const v=ST.view, M={view:v};
  if(v==='split') M.S=splitView(ST);
  else if(v==='land') M.L=landView(ST);
  else if(v==='load') M.D=loadView(ST);
  else if(v==='meter') M.M=meterView(ST);
  else if(v==='bridge') M.B=bridgeView(ST);
  else M.A=ladderView(ST);

}

const PREFIX=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f']];
/* engineering notation: 4.7 kΩ, 3.00 mA, 13 nV */
function eng(x,unit,n){
  if(!isFinite(x)) return x>0?'∞ '+unit:'—';
  if(x===0) return '0 '+unit;
  const a=Math.abs(x), d=n||3;
  for(const [m,p] of PREFIX) if(a>=m*(1-5*Math.pow(10,-d-1))) return sigf(Number((x/m).toPrecision(d)),d)+' '+p+unit;
  return sigf(x/1e-15,d)+' f'+unit;
}
const ohm=(r,n)=>eng(r,'Ω',n), volt=(v,n)=>eng(v,'V',n), amp=(i,n)=>eng(i,'A',n), watt=(p,n)=>eng(p,'W',n);

function engS(x,unit,n){ return (x<0?'−':'')+eng(Math.abs(x),unit,n); }
function pct(x,n){ return isFinite(x)?(x<0?'−':'')+fmt(Math.abs(100*x),n===undefined?1:n)+' %':'—'; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }

const CAP_FONT='11.5px -apple-system, sans-serif';

const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);

function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){

    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }

function worldPath(ctx,map,pts,col,lw,dash,win){

    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);

    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }

/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];

  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }

function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){

let LABELS=[], DRAW_SEQ=0;
function labFits(bx){

function lab(ctx,W,H,x,y,txt,col,font,align,base,o){

  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);

  if(!pick){ KEY_DROPS+=items.length; return; }
  legendBox(ctx,pick[0],pick[1],items);
  const lb=[pick[0],pick[1],pick[0]+bw,pick[1]+bh]; lb.t='the legend'; lb.plate=true; lb.seq=++DRAW_SEQ; LABELS.push(lb);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));

}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  /* the corner: an x tick at the left edge and a y tick at the bottom edge put their labels on each other
     (loop_quantum_gravity's Known-bad); the y tick gives way */
  const Xof=t=>b.x+b.w*(t-xlo)/(xhi-xlo||1), Yof=t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1);
  if(xt.some(t=>Math.abs(Xof(t)-b.x)<16)) yt=yt.filter(t=>Math.abs(Yof(t)-b.y1)>=7);
  o.xticks=xt; o.yticks=yt;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  schematics (screen px), coloured by potential.  Drawn as explicit   *
 *  polylines (no arcs under a transform: the display-list recorder     *
 *  would lose them).  Every wire is at one potential; a resistor is     *
 *  graded from one end's to the other's.                                *
 * ================================================================== */
let HIT=[], W_STAGE=1100, H_STAGE=712;
/* marker lines (a test can see a label drawn across one) and legend items that found no room */
let MARKS=[], KEY_DROPS=0;
/* a narrow stage keeps one plot under its picture, a small one (under 520 px tall) none: the picture alone */
const nbNarrow=H=>H<520?0:1;
/* the scale every colour and dot speed in a picture is measured against */
const PIC={vmax:1, imax:1};
function pc(v){ return potCol(v/(PIC.vmax||1)); }
/* an axis's unit: the prefix that puts its largest value between 1 and 1000 (a 10 uA source is drawn in uA, not
   as 0.0100 mA) */
function axUnit(max,unit){
  for(const [m,p] of [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']]) if(Math.abs(max)>=m*0.999) return [m,p+unit];
  return [1e-12,'p'+unit];
}
function sLine(ctx,pts,col,lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
}
function sWireV(ctx,pts,v,lw){ sLine(ctx,pts,pc(v),lw||2.2); }
function sDotV(ctx,x,y,v){ dot(ctx,x,y,3.1,pc(v),null); }
function sTerm(ctx,x,y,v){ dot(ctx,x,y,3.6,'#070b18',pc(v),1.6); }
/* a resistor from (x0,y0) to (x1,y1) whose ends stand at va and vb: leads in their end colours, a zigzag body
   whose every segment takes the potential at its middle.  Returns the body's centre, unit normal and half-width. */
function sResV(ctx,x0,y0,x1,y1,va,vb,opt){
  const o=opt||{}, len=Math.hypot(x1-x0,y1-y0); if(len<2) return null;
  const ux=(x1-x0)/len, uy=(y1-y0)/len, nx=-uy, ny=ux, s=o.sz||1;
  const body=Math.min(34*s,len*0.7), a=(len-body)/2, amp=5*s, n=6;
  const P=(t,off)=>[x0+ux*t+nx*off,y0+uy*t+ny*off];
  const vAt=t=>va+(vb-va)*clamp((t-a)/body,0,1);
  sLine(ctx,[[x0,y0],P(a,0)],pc(va),2.2); sLine(ctx,[P(a+body,0),[x1,y1]],pc(vb),2.2);
  const zz=[P(a,0)];
  for(let i=0;i<n;i++) zz.push(P(a+body*(i+0.5)/n,(i%2?-1:1)*amp));
  zz.push(P(a+body,0));
  for(let i=0;i<zz.length-1;i++){ const tm=a+body*(i===0?0.25/n:i===zz.length-2?(n-0.25)/n:i/n);
    sLine(ctx,[zz[i],zz[i+1]],o.col||pc(vAt(tm)),2); }
  return {c:P(len/2,0),n:[nx,ny],half:amp+1,len,u:[ux,uy]};
}
/* a battery, + at the top: the long plate up (two cells) */
function sBattery(ctx,x,yTop,yBot,vTop,vBot){
  const yc=(yTop+yBot)/2, g=5;
  sLine(ctx,[[x,yTop],[x,yc-2*g]],pc(vTop),2.2); sLine(ctx,[[x,yc+2*g],[x,yBot]],pc(vBot),2.2);
  for(const [dy,w,col] of [[-2*g,15,COL.src],[-g+1,8,COL.src],[g-1,15,COL.src],[2*g,8,COL.src]]) sLine(ctx,[[x-w,yc+dy],[x+w,yc+dy]],col,dy===-2*g||dy===g-1?2.2:3.4);
  /* the + sign stays by the long plate or is left out (never shifted onto a title) */
  lab(ctx,W_STAGE,H_STAGE,x+18,yc-2*g-5,'+',COL.src,'11px -apple-system, sans-serif','left','middle',{fixed:true});
  return yc;
}
/* a current source: a circle with an arrow pointing the way the current leaves it */
function sCurSrc(ctx,x,yTop,yBot,vTop,vBot){
  const r=13, yc=(yTop+yBot)/2;
  sLine(ctx,[[x,yTop],[x,yc-r]],pc(vTop),2.2); sLine(ctx,[[x,yc+r],[x,yBot]],pc(vBot),2.2);
  const pts=[]; for(let i=0;i<=28;i++){ const t=TAU*i/28; pts.push([x+r*Math.cos(t),yc+r*Math.sin(t)]); }
  sLine(ctx,pts,COL.src,1.8);
  sLine(ctx,[[x,yc+8],[x,yc-8]],COL.src,1.8); sLine(ctx,[[x-4,yc-3],[x,yc-8],[x+4,yc-3]],COL.src,1.8);
  return yc;
}
function sGround(ctx,x,y){ for(let i=0;i<3;i++){ const w=9-3*i; sLine(ctx,[[x-w,y+4+4*i],[x+w,y+4+4*i]],pc(0),1.6); } sLine(ctx,[[x,y],[x,y+4]],pc(0),1.6); }
/* a round meter body with a letter in it (V, A, G) */
function sMeterSym(ctx,x,y,letter,col){
  const r=12, pts=[]; for(let i=0;i<=28;i++){ const t=TAU*i/28; pts.push([x+r*Math.cos(t),y+r*Math.sin(t)]); }
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(const p of pts) ctx.lineTo(p[0],p[1]); ctx.fillStyle='#0a0f1e'; ctx.fill();
  sLine(ctx,pts,col||COL.struct,1.6);
  ctx.font='italic 12px Georgia, serif'; ctx.fillStyle=col||COL.struct; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(letter,x,y+0.5);
}
/* a value label beside a part, on the side of its normal given (plated so a wire under it cannot cut it) */
function partLabel(ctx,part,txt,col,side,W,H){
  if(!part) return false;
  const [nx,ny]=part.n, sgn=side||1, off=part.half+8;
  const x=part.c[0]+nx*off*sgn, y=part.c[1]+ny*off*sgn;
  const al=Math.abs(nx)>0.5?(nx*sgn>0?'left':'right'):'center', bl=Math.abs(ny)>0.5?(ny*sgn>0?'top':'bottom'):'middle';
  return lab(ctx,W||W_STAGE,H||H_STAGE,x,y,txt,col||COL.text,'10.5px -apple-system, sans-serif',al,bl,PLATE);
}

/* ---- the moving charge.  An edge is a screen polyline carrying current i from its first point to its last.
   Dots sit every `gap` px of arc; at time t they have moved speed*t with speed = DOT_V * i / PIC.imax, so the
   fastest current in the picture moves DOT_V px/s and a current a thousand times smaller barely creeps.  The
   positions are a function of t alone, so a capture is reproducible. ---- */
const DOT_V=55, DOT_GAP=17;
function flowEdge(ctx,pts,i,t,elec,rad){
  if(!(Math.abs(i)>0)||!isFinite(i)) return 0;
  const seg=[]; let L=0;
  for(let k=0;k<pts.length-1;k++){ const l=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]); seg.push(l); L+=l; }
  if(L<2) return 0;
  const sp=DOT_V*i/(PIC.imax||1)*(elec?-1:1);
  let off=((sp*t)%DOT_GAP+DOT_GAP)%DOT_GAP;
  let n=0; ctx.beginPath();
  for(let s=off;s<L;s+=DOT_GAP){
    let k=0, acc=0; while(k<seg.length-1&&acc+seg[k]<s){ acc+=seg[k]; k++; }
    const f=seg[k]>0?(s-acc)/seg[k]:0, x=pts[k][0]+(pts[k+1][0]-pts[k][0])*f, y=pts[k][1]+(pts[k+1][1]-pts[k][1])*f;
    ctx.moveTo(x+(rad||2.3),y); ctx.arc(x,y,rad||2.3,0,TAU); n++;
  }
  ctx.fillStyle=elec?COL.elec:COL.charge; ctx.fill();
  return n;
}

/* ================================================================== *
 *  view 1: the two dividers                                           *
 * ================================================================== */
function splitCaption(M){
  const S=M.S;
  /* the smallest resistor takes the most current: say which, or that equal resistors share equally */
  const rmin=Math.min(...S.Rs), kmin=S.Rs.indexOf(rmin), equal=S.Rs.every(r=>Math.abs(r/rmin-1)<1e-12);
  const most=equal?'equal resistors take equal shares':'so the smallest resistor, R'+SUBS[kmin]+', takes the most';
  return {full:'Left, the resistors in series: one current '+amp(S.ser.I,3)+' passes them all and each takes a share of the '+volt(ST.sVs,3)+' in proportion to its resistance. Right, the same resistors in parallel: one voltage '+volt(S.par.V,3)+' stands across them all and each takes a share of the '+amp(ST.sIs,3)+' in proportion to its conductance: '+most+'. The wires are coloured by their potential, from dark at the ground to light at the top; the dots are '+(ST.sElec?'electrons, moving against the current':'the current (positive charge)')+', each circuit’s largest current moving at the same pace.',
          short:'Series: one current, the voltage split in proportion to R. Parallel: one voltage, the current split in proportion to 1/R.'};
}
function drawSplit(ctx,W,H,M){
  const S=M.S, cap=splitCaption(M);
  const L=stageLayout(ctx,W,H,cap.full,cap.short,3,0.38,nbNarrow(H));
  const t=SIM.t, elec=ST.sElec;
  const gap=L.narrow?18:36, bw=(L.main.w-gap)/2;
  const bS=box(L.main.x,L.main.y+18,bw,L.main.h-18), bP=box(L.main.x+bw+gap,L.main.y+18,bw,L.main.h-18);
  lab(ctx,W,H,bS.x,L.main.y+2,titleFor(bS,'in series: one current, the voltage shared','in series'),'#aeb6c6','italic 13px Georgia, serif','left','top');
  lab(ctx,W,H,bP.x,L.main.y+2,titleFor(bP,'in parallel: one voltage, the current shared','in parallel'),'#aeb6c6','italic 13px Georgia, serif','left','top');
  drawSeriesSchem(ctx,W,H,bS,S,t,elec);
  drawParallelSchem(ctx,W,H,bP,S,t,elec);
  const B=L.bottom;
  if(B[0]) plotRLine(ctx,W,H,B[0],S);
  if(B[1]) plotGLine(ctx,W,H,B[1],S);
  if(B[2]) plotHeat(ctx,W,H,B[2],S);
  drawCaption(ctx,L);
}
/* the chain from a battery: returns the geometry (for the tests) */
function drawSeriesSchem(ctx,W,H,b,S,t,elec){
  PIC.vmax=ST.sVs; PIC.imax=S.ser.I;
  const xb=b.x+26, xr=b.x+b.w*0.52, yT=b.y+14, yB=b.y1-22, N=S.N, ser=S.ser;
  const ys=[]; for(let k=0;k<=N;k++) ys.push(yT+(yB-yT)*k/N);
  sBattery(ctx,xb,yT,yB,ST.sVs,0); sGround(ctx,xb,yB);
  sWireV(ctx,[[xb,yT],[xr,yT]],ST.sVs); sWireV(ctx,[[xr,yB],[xb,yB]],0);
  const parts=[];
  for(let k=0;k<N;k++) parts.push(sResV(ctx,xr,ys[k],xr,ys[k+1],ser.v[k],ser.v[k+1]));
  /* the taps: a stub to a terminal at each junction, the chosen one live */
  const xt=Math.min(b.x1-8,xr+Math.max(34,b.w*0.2));
  for(let k=1;k<N;k++){ const v=ser.v[k];
    sWireV(ctx,[[xr,ys[k]],[xt,ys[k]]],v); sDotV(ctx,xr,ys[k],v); sTerm(ctx,xt,ys[k],v); }
  HIT.push({kind:'tap',b:box(xr-6,yT,xt-xr+22,yB-yT),ys,xt});
  /* the moving charge, one loop, one current (drawn where the clock has put it; the clock stops with the box);
     under the labels, so a label is never painted over */
  flowEdge(ctx,[[xb,yB],[xb,yT]],ser.I,t,elec); flowEdge(ctx,[[xb,yT],[xr,yT]],ser.I,t,elec);
  flowEdge(ctx,[[xr,yT],[xr,yB]],ser.I,t,elec); flowEdge(ctx,[[xr,yB],[xb,yB]],ser.I,t,elec);
  for(let k=1;k<N;k++){ const v=ser.v[k], live=(k-1)===S.tap;
    if(live) dot(ctx,xt,ys[k],6.5,null,COL.live,1.6);
    lab(ctx,W,H,xt+9,ys[k],volt(v,3),live?COL.live:'#9aa2b4','10.5px -apple-system, sans-serif','left','middle',PLATE); }
  /* each resistor: its name and value on the left, its drop below them */
  parts.forEach((p,k)=>{ if(!p) return;
    lab(ctx,W,H,xr-p.half-8,p.c[1]-6,'R'+SUBS[k]+' '+ohm(S.Rs[k],3),COL.text,'10.5px -apple-system, sans-serif','right','middle',PLATE);
    lab(ctx,W,H,xr-p.half-8,p.c[1]+8,'−'+volt(ser.drops[k],3),COL.pos,'10.5px -apple-system, sans-serif','right','middle',PLATE); });
  lab(ctx,W,H,xb+16,(yT+yB)/2+18,volt(ST.sVs,3),COL.src,'11px -apple-system, sans-serif','left','middle',PLATE);
  lab(ctx,W,H,(xb+xr)/2,yT-9,'I = '+amp(ser.I,3),COL.charge,'10.5px -apple-system, sans-serif','center','bottom',PLATE);
  return {xb,xr,yT,yB,ys};
}
function drawParallelSchem(ctx,W,H,b,S,t,elec){
  const par=S.par; PIC.vmax=par.V; PIC.imax=ST.sIs;
  const xs0=b.x+26, yT=b.y+14, yB=b.y1-22, N=S.N;
  const xk=[]; for(let k=0;k<N;k++) xk.push(b.x+b.w*(N===1?0.6:0.3+0.62*k/(N-1)));
  sCurSrc(ctx,xs0,yT,yB,par.V,0); sGround(ctx,xs0,yB);
  sWireV(ctx,[[xs0,yT],[xk[N-1],yT]],par.V); sWireV(ctx,[[xk[N-1],yB],[xs0,yB]],0);
  const parts=[];
  for(let k=0;k<N;k++){ parts.push(sResV(ctx,xk[k],yT,xk[k],yB,par.V,0)); sDotV(ctx,xk[k],yT,par.V); sDotV(ctx,xk[k],yB,0); }
  HIT.push({kind:'branch',b:box(xk[0]-18,yT,xk[N-1]-xk[0]+36,yB-yT),xk});
  /* the charge: each stretch of rail carries the branches beyond it (drawn under the labels) */
  const beyond=k=>{ let s=0; for(let j=k;j<N;j++) s+=par.I[j]; return s; };
  flowEdge(ctx,[[xs0,yB],[xs0,yT]],ST.sIs,t,elec);
  for(let k=0;k<N;k++){ const x0=k===0?xs0:xk[k-1];
    flowEdge(ctx,[[x0,yT],[xk[k],yT]],beyond(k),t,elec); flowEdge(ctx,[[xk[k],yB],[x0,yB]],beyond(k),t,elec);
    flowEdge(ctx,[[xk[k],yT],[xk[k],yB]],par.I[k],t,elec); }
  /* each branch: its name beside its body, its current under the bottom rail (the chosen one live) */
  parts.forEach((p,k)=>{ if(!p) return; const live=k===S.br;
    lab(ctx,W,H,xk[k]+p.half+5,p.c[1],'R'+SUBS[k],live?COL.live:COL.text,'10.5px -apple-system, sans-serif','left','middle',PLATE);
    lab(ctx,W,H,xk[k],yB+8,amp(par.I[k],3),live?COL.live:COL.pos,'10.5px -apple-system, sans-serif','center','top',PLATE); });
  lab(ctx,W,H,xs0+17,(yT+yB)/2+22,amp(ST.sIs,3),COL.src,'11px -apple-system, sans-serif','left','middle',PLATE);
  lab(ctx,W,H,(xs0+xk[0])/2,yT-9,'V = '+volt(par.V,3),pc(par.V),'10.5px -apple-system, sans-serif','center','bottom',PLATE);
  return {xs0,xk,yT,yB};
}

/* ================================================================== *
 *  view 2: the landscape (3-D; height = potential)                    *
 * ================================================================== */
const LAND_H=2.4;                               /* the tallest node stands this many board units high */
function landBoard(L){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const e of L.E) for(const p of e.pts){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  return {x0,x1,y0,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,r:Math.hypot(x1-x0,y1-y0,LAND_H)/2};
}
/* board (x, y) to world: the board's x along world x, its y along world y, the potential up */
function landPt(L,p,v,Bd){ return [p[0]-Bd.cx,p[1]-Bd.cy,LAND_H*v/L.vmax]; }
/* the potential along an element at fraction f of its points' arc length */
function landElemPts(L,e,Bd,n){
  const out=[], P=e.pts, va=L.v[e.p0], vb=L.v[e.p1];
  const seg=[]; let tot=0; for(let k=0;k<P.length-1;k++){ const l=Math.hypot(P[k+1][0]-P[k][0],P[k+1][1]-P[k][1]); seg.push(l); tot+=l; }
  const m=n||(e.kind==='R'||e.kind==='G'?16:Math.max(2,P.length));
  for(let i=0;i<=m;i++){ const s=tot*i/m; let k=0, acc=0; while(k<seg.length-1&&acc+seg[k]<s){ acc+=seg[k]; k++; }
    const f=seg[k]>0?(s-acc)/seg[k]:0, p=[P[k][0]+(P[k+1][0]-P[k][0])*f,P[k][1]+(P[k+1][1]-P[k][1])*f];
    const v=e.kind==='W'?va:va+(vb-va)*(i/m);
    out.push(landPt(L,p,v,Bd)); }
  return out;
}
function landCaption(M){
  const L=M.L;
  return {full:'The circuit laid on a board, every point lifted to its potential (the tallest node '+volt(L.vmax,3)+' high; the board’s own layout is only a drawing). Each resistor is a ramp the charge runs down, and the source is the lift that carries it back up: the power a resistor takes is the current times the height it falls. '+(L.k==='bridge'?'The two middles stand at different heights, so current crosses the galvanometer from the higher to the lower; at balance they would stand level.':L.k==='idiv'?'Both branches fall the same height, so the one that is easier to run down carries more.':L.k==='r2r'?'The ladder’s nodes stand at a staircase of heights set by the bits.':'The middle stands at its share of the height.')+' Drag to turn it.',
          short:'Height is potential: resistors are ramps, the source a lift. Drag to turn.'};
}
function drawLand(ctx,W,H,M){
  const L=M.L, cap=landCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,0,0,0);
  const b=Lay.main, Bd=landBoard(L);
  lab(ctx,W,H,b.x,b.y-8,L.title,'#aeb6c6','italic 13px Georgia, serif','left','bottom');
  const want=Math.min(b.w,b.h)*0.46;
  const dist=Bd.r*Math.sqrt(1+Math.pow(((b.h/2)/Math.tan(0.39))/want,2));
  const C=boxCamera(b,ST.camTheta,ST.camPhi,dist,[0,0,LAND_H*0.4]);
  HIT.push({kind:'cam',b});
  PIC.vmax=L.vmax; let imax=0; L.E.forEach(e=>{ if(isFinite(e.i)) imax=Math.max(imax,Math.abs(e.i)); }); PIC.imax=imax||1;
  /* the floor: a grid for depth, and the board's plan at zero height */
  const gx0=Bd.x0-Bd.cx-0.4, gx1=Bd.x1-Bd.cx+0.4, gy0=Bd.y0-Bd.cy-0.4, gy1=Bd.y1-Bd.cy+0.4;
  for(let x=Math.ceil(gx0*2)/2;x<=gx1+1e-9;x+=0.5) seg3(ctx,C,[x,gy0,0],[x,gy1,0],'#141a2b',0.8,null,true);
  for(let y=Math.ceil(gy0*2)/2;y<=gy1+1e-9;y+=0.5) seg3(ctx,C,[gx0,y,0],[gx1,y,0],'#141a2b',0.8,null,true);
  for(const e of L.E){ const flat=e.pts.map(p=>[p[0]-Bd.cx,p[1]-Bd.cy,0]); poly3(ctx,C,flat,'#232b44',1.2,[3,3],true); }
  /* the elements, far ones first (painter's order on the depth of their middles); each wire, resistor and
     galvanometer hangs a translucent curtain down to its plan on the floor, so its height reads at a glance */
  const items=L.E.map(e=>{ const pts=landElemPts(L,e,Bd); const mid=pts[Math.floor(pts.length/2)], q=C.P(mid); return {e,pts,z:q?q.z:0}; });
  items.sort((a,b2)=>b2.z-a.z);
  const vAlong=(e,f)=>L.v[e.p0]+(L.v[e.p1]-L.v[e.p0])*f;
  for(const it of items){ const e=it.e, pts=it.pts;
    if(e.kind==='V'||e.kind==='I'){ poly3(ctx,C,pts,COL.src,e.kind==='I'?3:3.4,null,true); continue; }
    const top=pts.map(p=>C.P(p)), bot=pts.map(p=>C.P([p[0],p[1],0]));
    if(top.every(q=>q)&&bot.every(q=>q)){ ctx.beginPath(); ctx.moveTo(top[0].x,top[0].y); for(const q of top) ctx.lineTo(q.x,q.y);
      for(let i=bot.length-1;i>=0;i--) ctx.lineTo(bot[i].x,bot[i].y); ctx.closePath(); ctx.fillStyle=rgba(pc(vAlong(e,0.5)),0.13); ctx.fill(); }
    for(let i=0;i<pts.length-1;i++){ const f=(i+0.5)/(pts.length-1);
      poly3(ctx,C,[pts[i],pts[i+1]],pc(e.kind==='W'?L.v[e.a]:vAlong(e,f)),e.kind==='W'?2.6:3.2,null,true); }
    if(e.kind==='G'){ const mq=C.P(pts[Math.floor(pts.length/2)]); if(mq) sMeterSym(ctx,mq.x,mq.y,'G',COL.struct); } }
  /* the charge: dots along every element in 3-D, each moving at a speed set by its current (along its points) */
  for(const it of items){ const i=it.e.i;
    if(!isFinite(i)||Math.abs(i)<1e-12*PIC.imax) continue;
    const scr=it.pts.map(p=>C.P(p)).filter(q=>q).map(q=>[q.x,q.y]);
    if(scr.length>1) flowEdge(ctx,scr,i,SIM.t,false,2.4); }
  /* labels last: the sources, the resistors, the outputs */
  for(const it of items){ const e=it.e; if(!e.lab) continue; const q=C.P(it.pts[Math.floor(it.pts.length/2)]); if(!q) continue;
    lab(ctx,W,H,q.x+10,q.y,e.lab,e.kind==='V'||e.kind==='I'?COL.src:COL.text,'10.5px -apple-system, sans-serif','left','middle',PLATE); }
  for(const o of L.outs){ const q=C.P(landPt(L,o[1],L.v[o[0]],Bd)); if(!q) continue; dot(ctx,q.x,q.y,4.5,COL.live,'#fff',1.2);
    lab(ctx,W,H,q.x+9,q.y-10,(o[2]?o[2]+' ':'')+volt(L.v[o[0]],3),COL.live,'10.5px -apple-system, sans-serif','left','middle',PLATE); }
  drawCaption(ctx,Lay);
  return C;
}

/* ================================================================== *
 *  plot helpers: a log-x plot, a key on the title line                 *
 * ================================================================== */
/* decade ticks, or 1-2-5 ticks inside a span of less than about three decades (a null curve over a factor of
   nine had one tick) */
function logTicks125(lo,hi){
  if(!(lo>0)||!(hi>lo)) return [];
  if(hi/lo>=1000) return logTicks(lo,hi);
  const out=[];
  for(let e=Math.floor(Math.log10(lo));e<=Math.ceil(Math.log10(hi));e++) for(const m of [1,2,5]){ const v=m*Math.pow(10,e); if(v>=lo*(1-1e-9)&&v<=hi*(1+1e-9)) out.push(v); }
  return out;
}
function logPlot(ctx,b,x0,x1,ylo,yhi,opt){
  const o=opt||{}, lx0=Math.log10(x0), lx1=Math.log10(x1);
  const xt=logTicks125(x0,x1).map(Math.log10);
  axesT(ctx,b,lx0,lx1,ylo,yhi,Object.assign({},o,{xticks:xt,xfmt:o.xfmt||(l=>sigf(Math.pow(10,l),1))}));
  return {b,lx0,lx1,ylo,yhi,X:x=>b.x+b.w*(Math.log10(x)-lx0)/(lx1-lx0),Y:v=>b.y1-b.h*(v-ylo)/(yhi-ylo),
          line:(xs,vs,col,lw,dash)=>polyline(ctx,b,xs.map(Math.log10),vs,lx0,lx1,ylo,yhi,col,lw,dash)};
}
/* a legend as one line of swatches and names above a plot's title (registered, so labels step round it); items
   that do not fit are left out, never overlapped, and counted in KEY_DROPS */
function keyRow(ctx,x,y,items,maxW){
  ctx.font=SM_FONT; let X=x;
  for(let i=0;i<items.length;i++){ const [col,txt,dash]=items[i], t=plain(txt), w=ctx.measureText(t).width+24;
    if(X+w>x+maxW){ KEY_DROPS+=items.length-i; break; }
    ctx.beginPath(); ctx.moveTo(X,y); ctx.lineTo(X+14,y); ctx.strokeStyle=col; ctx.lineWidth=2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#9aa2b4'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(t,X+18,y);
    const bx=[X,y-7,X+w-6,y+7]; bx.t=t; bx.plate=true; bx.seq=++DRAW_SEQ; LABELS.push(bx);
    X+=w; }
}
function vMark(ctx,b,X,col,dash,lw){
  if(!(X>=b.x-0.5&&X<=b.x1+0.5)) return;
  ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.strokeStyle=col; ctx.lineWidth=lw||1; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]);
  MARKS.push({X,y0:b.y,y1:b.y1,seq:++DRAW_SEQ});
}

/* ================================================================== *
 *  view 3: the load                                                   *
 * ================================================================== */
function loadCaption(M){
  const D=M.D;
  if(D.mode==='pot') return {full:'A potentiometer is a divider whose tap slides: unloaded its output is exactly the fraction x of the travel. A load on the wiper shunts the lower part of the track, so the output falls short of x, least at the ends and most a little past two-thirds of the way up ('+fmt(D.peak.x,3)+' here, where it is '+fmt(D.peak.err,3)+' of the supply short). For a light load the shortfall is k x²(1 − x), whose peak is at exactly 2/3 and 4k/27 high.',
    short:'A load on the wiper makes the output fall short of x, most near two-thirds of the way.'};
  const L=D.L;
  return {full:'To the load, the divider is a source of '+volt(L.Vth,3)+' behind R₁ ‖ R₂ = '+ohm(L.Rth,3)+' (Thévenin’s equivalent, right). The load and that resistance form a second divider, so the output falls to Rₗ/(Rₜₕ + Rₗ) of itself: a load ten times Rₜₕ leaves 90.9 %, a hundred times 99.0 %. The load takes the most power when it equals Rₜₕ (Jacobi’s law), and then half the Thévenin source’s power is lost in Rₜₕ, besides what the divider burns on its own.',
    short:'The load sees Vₜₕ behind Rₜₕ and forms a second divider with it.'};
}
function drawLoad(ctx,W,H,M){
  const D=M.D, cap=loadCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.44,nbNarrow(H));
  const m=Lay.main;
  if(D.mode==='pot') drawPotSchem(ctx,W,H,box(m.x,m.y,m.w,m.h),D);
  else { const gap=40, bw=Lay.narrow?m.w:(m.w-gap)*0.56;
    drawLoadSchem(ctx,W,H,box(m.x,m.y,bw,m.h),D);
    if(!Lay.narrow) drawThevenin(ctx,W,H,box(m.x+bw+gap,m.y,m.w-bw-gap,m.h),D); }
  const B=Lay.bottom;
  if(D.mode==='pot'){ if(B[0]) plotPotLaw(ctx,W,H,B[0],D); if(B[1]) plotPotErr(ctx,W,H,B[1],D); }
  else { if(B[0]) plotLoadV(ctx,W,H,B[0],D); if(B[1]) plotLoadP(ctx,W,H,B[1],D); }
  drawCaption(ctx,Lay);
}
function drawLoadSchem(ctx,W,H,b,D){
  const L=D.L; PIC.vmax=L.Vs;
  const xb=b.x+26, xr=b.x+b.w*0.46, xl=b.x+b.w*0.82, yT=b.y+26, yB=b.y1-22, yM=(yT+yB)/2;
  sBattery(ctx,xb,yT,yB,L.Vs,0); sGround(ctx,xb,yB);
  sWireV(ctx,[[xb,yT],[xr,yT]],L.Vs); sWireV(ctx,[[xr,yB],[xb,yB]],0);
  const p1=sResV(ctx,xr,yT,xr,yM,L.Vs,L.VL), p2=sResV(ctx,xr,yM,xr,yB,L.VL,0);
  const loaded=isFinite(L.RL);
  sWireV(ctx,[[xr,yM],[xl,yM]],L.VL); sDotV(ctx,xr,yM,L.VL);
  if(loaded){ const p3=sResV(ctx,xl,yM,xl,yB,L.VL,0,{col:null}); sWireV(ctx,[[xl,yB],[xr,yB]],0); sDotV(ctx,xr,yB,0);
    partLabel(ctx,p3,'Rₗ '+ohm(L.RL,3),COL.ref,1,W,H); }
  else { sTerm(ctx,xl,yM,L.VL); lab(ctx,W,H,xl+8,yM,'no load',COL.dim,SM_FONT,'left','middle'); }
  partLabel(ctx,p1,'R₁ '+ohm(L.R1,3),COL.text,-1,W,H); partLabel(ctx,p2,'R₂ '+ohm(L.R2,3),COL.text,-1,W,H);
  lab(ctx,W,H,xb+16,(yT+yB)/2+18,volt(L.Vs,3),COL.src,LAB_FONT,'left','middle',PLATE);
  lab(ctx,W,H,(xr+xl)/2,yM-10,'Vₗ = '+volt(L.VL,3),COL.pos,SM_FONT,'center','bottom',PLATE);
  lab(ctx,W,H,b.x,b.y+4,titleFor(b,'the divider and its load','the load'),'#aeb6c6','italic 13px Georgia, serif','left','top');
}
function drawThevenin(ctx,W,H,b,D){
  const L=D.L; PIC.vmax=L.Vs;
  lab(ctx,W,H,b.x,b.y+4,titleFor(b,'what the load sees','Thévenin'),'#aeb6c6','italic 13px Georgia, serif','left','top');
  const xb=b.x+22, xr=b.x+b.w*0.62, yT=b.y+34, yB=b.y1-22, yM=(yT+yB)/2;
  sBattery(ctx,xb,yM-34,yB,L.Vth,0); sGround(ctx,xb,yB);
  sWireV(ctx,[[xb,yM-34],[xb,yT]],L.Vth);
  const pr=sResV(ctx,xb,yT,xr,yT,L.Vth,L.VL);
  sWireV(ctx,[[xr,yT],[xr,yT+8]],L.VL);
  if(isFinite(L.RL)){ const p3=sResV(ctx,xr,yT+8,xr,yB,L.VL,0); partLabel(ctx,p3,'Rₗ',COL.ref,1,W,H); }
  else sTerm(ctx,xr,yT+8,L.VL);
  sWireV(ctx,[[xr,yB],[xb,yB]],0);
  partLabel(ctx,pr,'Rₜₕ = R₁ ‖ R₂ = '+ohm(L.Rth,3),COL.text,1,W,H);
