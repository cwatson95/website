<title>Buoyancy &mdash; Archimedes&rsquo; principle, from the spring scale to the metacentre</title>
<!--
  ===================================================================
  buoyancy.html — Archimedes' principle: the upthrust equals the weight
  of the displaced fluid, and everything that follows from it — why it
  is a pressure difference, what floats and how deep, why a square log
  floats on its corner, whether the crown was gold, and why a Cartesian
  diver can never hover
  ===================================================================

  Six views.  THE PRINCIPLE: a block hangs from a spring scale and is
  lowered into a tank; the scale reads W - rho_f g V_sub while the
  displaced fluid runs into a measuring beaker — the two agree to the
  last digit, and once the block is under the upthrust stops growing
  while both face pressures keep rising.  THE PRESSURE: the same force
  built from where it really comes from — the hydrostatic pressure on
  every face of a submerged polygon, integrated edge by edge (exactly,
  because p is linear along a straight edge): the horizontal parts
  cancel, the vertical parts sum to rho g A, and the resultant passes
  through the centroid of the submerged area, whatever the shape or its
  tilt.  FLOATING: a body of density ratio r sinks until it displaces
  its own weight — a box to r h, a cylinder or a sphere to a root of a
  segment or a cap formula — and a hollow hull carries cargo until its
  mean density reaches the fluid's; push it down and it heaves at
  2 pi sqrt(m / rho g A_wl).  STABILITY: heel a floating box and the
  centre of buoyancy moves to the centroid of the new submerged
  polygon; the righting arm GZ is exact (polygon clipping), the small-
  angle metacentric height GM = KB + BM - KG with BM = I/V, and a box
  is stable upright only if b/h > sqrt(6 r (1 - r)) — a square block of
  density 0.5 is not, and released it rolls to a corner-down 45 degrees.
  THE CROWN: Archimedes' problem done both ways — Vitruvius' overflow
  (a fraction of a millimetre of water level for a silver admixture)
  and the hydrostatic balance Galileo argued he really used (La
  Bilancetta, 1586).  THE DIVER & THE BALLOON: buoyancy in a
  compressible world — a Cartesian diver's air pocket obeys Boyle's
  law, so its equilibrium depth exists but is unstable (dF/dy < 0),
  and a balloon in the ISA troposphere rises to the altitude where the
  air's density has fallen to its own.

  WHAT IS MEASURED (sources in build_buoy/derive.py)
  --------------------------------------------------
  Densities (Wikipedia "Density" table and infoboxes): fresh water
  1000, salt water 1030, ethanol 789.45, olive oil 911, glycerol 1261,
  mercury 13546; cork 240, oak 710, ice 916.7, aluminium 2700, iron 7870,
  copper 8940, silver 10500, lead 11340, gold 19320, osmium 22570 kg/m^3.
  The ISA troposphere: 101325 Pa, 288.15 K, 1.2250 kg/m^3 at sea level,
  -6.5 K/km to 11 km, R_air = 287.0528 J/(kg K); the article's 11-km row
  (22632 Pa, 0.3639 kg/m^3) is reproduced by the closed form and pinned.
  Molar masses of He and H2 and R_u are CODATA/IUPAC values.

  WHAT IS EXACT HERE
  ------------------
  The pressure integral (per-edge, closed form, checked against a
  2000-point numerical perimeter sum), the clipped polygon's area and
  centroid (shoelace), the drafts (bisection, checked against brentq
  and against the trapezoid, segment and cap formulas), the wall-sided
  GZ = (GM + BM tan^2(phi)/2) sin(phi) check at 10 degrees, the roll and
  heave periods (RK4 zero crossings against 2 pi sqrt(I / rho g V GM) and
  2 pi sqrt(m / rho g A_wl)), the ISA closed forms and the balloon
  ceiling (brentq against the closed inverse).  Every number is pinned
  in selfTest to build_buoy/refvals.txt.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  Fluids are incompressible and at rest; air pressure is ignored except
  inside the diver (Boyle's law, isothermal); the hydrostatic balance
  ignores the pans' own buoyancy; the roll and heave dynamics carry a
  light linear damping and no added mass; the diver has quadratic drag
  with C_d = 1; the balloon's envelope volume is fixed and its gas is
  at ambient pressure (hot air at 373.15 K).  Animation advances a fixed
  1/60 s per frame so the headless suites are deterministic.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the

   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.

   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();

  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){

    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }

       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }

    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }

function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';

  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;

               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||

/* ================================================================== *
 *  the physics — densities, the pressure integral on a polygon, the   *
 *  floating drafts, the heaving and rolling bodies, the crown, the    *
 *  Cartesian diver, the ISA balloon.  Nothing here touches a canvas.  *
 *  y is UP in every world coordinate; the views flip.                 *

const DEG=PI/180;                 /* multiply DEGREES by this to get radians (asserted: 90 DEG = pi/2) */

const FLUIDS=[{id:'water',name:'fresh water',rho:1000},{id:'seawater',name:'salt water',rho:1030},
              {id:'ethanol',name:'ethanol',rho:789.45},{id:'oil',name:'olive oil',rho:911},
              {id:'glycerol',name:'glycerol',rho:1261},{id:'mercury',name:'mercury',rho:13546}];
const MATS=[{id:'cork',name:'cork',rho:240},{id:'oak',name:'oak',rho:710},{id:'ice',name:'ice',rho:916.7},
            {id:'aluminium',name:'aluminium',rho:2700},{id:'iron',name:'iron',rho:7870},{id:'copper',name:'copper',rho:8940},
            {id:'silver',name:'silver',rho:10500},{id:'lead',name:'lead',rho:11340},{id:'gold',name:'gold',rho:19320},

/* ---- polygons (CCW lists of [x, y]) ----------------------------------------- */
/* Sutherland–Hodgman against the half-plane y <= w: the submerged part */
function clipBelow(poly,w){
  const out=[], n=poly.length;

    const a=poly[i], b=poly[(i+1)%n], ain=a[1]<=w, bin=b[1]<=w;
    if(ain) out.push([a[0],a[1]]);

function polyArea(poly){ let s=0; const n=poly.length;
  for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n]; s+=a[0]*b[1]-b[0]*a[1]; } return 0.5*s; }

  const A=polyArea(poly); if(Math.abs(A)<1e-300) return [0,0];

/* the hydrostatic pressure p = rho g (w - y) pushes on each edge of the
   SUBMERGED polygon (already clipped at y = w).  p is linear along a straight
   edge, so the integral is p(mid) L exactly; the outward normal of a CCW edge
   (dx, dy) is (dy, -dx)/L and the fluid pushes inward: F = -p n L.  Per unit
   depth (2-D).  Returns the per-edge forces, their sum and the moment about
   the origin — the sum must be (0, rho g A) and the moment rho g A x_B. */
function edgeForces(sub,w,rho){
  const n=sub.length, F=[], tot=[0,0]; let torque=0;

    const a=sub[i], b=sub[(i+1)%n], dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
    if(L===0){ F.push([0,0,a,b,0]); continue; }
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2], p=rho*G*(w-mid[1]);
    const fx=-p*dy, fy=p*dx;
    F.push([fx,fy,a,b,p]); tot[0]+=fx; tot[1]+=fy;
    /* the moment of a LINEAR load is not mid x F: with r = a + t d and
       p(t) = p_a + t (p_b - p_a),  dM = p(t) (r . d) dt  integrates to */
    const pa=rho*G*(w-a[1]), dp=rho*G*(a[1]-b[1]), ad=a[0]*dx+a[1]*dy, d2=dx*dx+dy*dy;
    torque+=pa*ad+(pa*d2+dp*ad)/2+dp*d2/3;

/* the independent route the tests use: subdivide every edge and sum p n ds */

    for(let k=0;k<nsub;k++){ const t=(k+0.5)/nsub, y=a[1]+dy*t, p=rho*G*Math.max(0,w-y); tot[0]+=-p*dy/nsub; tot[1]+=p*dx/nsub; } }

  wedge:{name:'a wedge',pts:[[-1,-0.6],[1,-0.6],[0,0.8]]},
  hull:{name:'a hull',pts:[[-1.1,0.5],[-0.9,-0.3],[-0.4,-0.7],[0.4,-0.7],[0.9,-0.3],[1.1,0.5]]},
  disc:{name:'a disc (64-gon)',pts:(function(){ const o=[]; for(let k=0;k<64;k++) o.push([0.8*Math.cos(TAU*k/64),0.8*Math.sin(TAU*k/64)]); return o; })()},

  for(let i=0;i<n;i++){ const m=0.5*(lo+hi), fm=f(m); if((fm>0)===(flo>0)){ lo=m; flo=fm; } else hi=m; }
  return 0.5*(lo+hi); }

  cyl:{name:'a cylinder',dims:[0.5,1.0]},          /* radius, length (axis horizontal) */

const FSHAPE_LIST=[{id:'box',name:'a box'},{id:'cyl',name:'a cylinder'},{id:'sph',name:'a sphere'},{id:'boat',name:'a hull with cargo'}];

/* ---- the heeled box --------------------------------------------------------- */

function waterline(poly,frac){ const A=polyArea(poly); let lo=Infinity, hi=-Infinity;
  for(const p of poly){ lo=Math.min(lo,p[1]); hi=Math.max(hi,p[1]); }
  return bisect(w=>polyArea(clipBelow(poly,w))-frac*A,lo,hi,60); }

  return {th,gz,loll};
}

/* ---- the crown ------------------------------------------------------------- */
function crownFacts(m,f,rhoW){
  const rAu=matRho('gold'), rAg=matRho('silver');
  const V=m*(f/rAu+(1-f)/rAg), rho=m/V, W=m*G, Wp=W-rhoW*G*V;
  const rhoInf=rhoW*W/(W-Wp), fInf=(1/rhoInf-1/rAg)/(1/rAu-1/rAg);
  const dV=m*(1-f)*(1/rAg-1/rAu);
  return {V,rho,W,Wp,rhoInf,fInf,dV,dhMm:dV/(PI*0.1*0.1)*1000,torque:rhoW*G*dV};
}

/* ---- the Cartesian diver ------------------------------------------------------ */
const P0=101325;                                        /* Pa, the ISA sea-level pressure */
const DIVER={m:0.010,Vg:4e-6,V0:6.5e-6,H:0.30,cd:0.5*1000*1*PI*0.005*0.005};   /* glass 10 g, 4 mL glass, 6.5 mL air at the surface, a 30-cm bottle, C_d = 1 on a 1-cm tube */
function diverForce(y,dp,rho){ const p=P0+dp+rho*G*y, Va=DIVER.V0*P0/p; return {Fup:rho*G*(DIVER.Vg+Va)-DIVER.m*G,Va,p}; }
function diverEq(dp,rho){ const Va=DIVER.m/rho-DIVER.Vg; if(Va<=0) return null; const p=P0*DIVER.V0/Va; return (p-P0-dp)/(rho*G); }
function diverDFdy(dp,rho){ const y=diverEq(dp,rho); if(y===null) return null; const p=P0+dp+rho*G*y; return -rho*G*DIVER.V0*P0*rho*G/(p*p); }
function diverDpSink(rho){ return P0*DIVER.V0/(DIVER.m/rho-DIVER.Vg)-P0; }
function diverAcc(dp,rho,y,v){ const f=diverForce(y,dp,rho); return (-f.Fup-DIVER.cd*v*Math.abs(v))/DIVER.m; }   /* y measured DOWN */

/* ---- the ISA troposphere and a balloon ---------------------------------------- */
const ISA={T0:288.15,L:0.0065,R:287.0528,Ru:8.314462618,ztop:11000};
ISA.Mair=ISA.Ru/ISA.R;
const GASES=[{id:'helium',name:'helium',M:4.002602e-3},{id:'hydrogen',name:'hydrogen',M:2.01588e-3},{id:'hotair',name:'hot air (100 °C)',M:null}];
function isaT(z){ return ISA.T0-ISA.L*z; }
function isaP(z){ return P0*Math.pow(isaT(z)/ISA.T0,G/(ISA.R*ISA.L)); }
function isaRho(z){ return isaP(z)/(ISA.R*isaT(z)); }
function gasRho(z,gas){ if(gas==='hotair') return isaP(z)/(ISA.R*373.15); const g=GASES.find(x=>x.id===gas); return isaP(z)*g.M/(ISA.Ru*isaT(z)); }
function balloonLift(z,gas,V,mp){ return (isaRho(z)-gasRho(z,gas))*G*V-mp*G; }
function balloonCeiling(gas,V,mp){
  if(balloonLift(0,gas,V,mp)<=0) return 0;
  if(balloonLift(ISA.ztop,gas,V,mp)>0) return ISA.ztop;
  return bisect(z=>balloonLift(z,gas,V,mp),0,ISA.ztop,60);
}
/* the light-gas closed form: rho_air(z_c) = m_p / (V (1 - M_gas/M_air)) inverted through the ISA power law */
function balloonCeilingClosed(gas,V,mp){ const g=GASES.find(x=>x.id===gas); const rc=mp/(V*(1-g.M/ISA.Mair)), e=G/(ISA.R*ISA.L)-1;
  return (ISA.T0/ISA.L)*(1-Math.pow(rc/isaRho(0),1/e)); }

/* ================================================================== *
 *  state, the live clock and runs, the per-view model, readout, eqbar *
 * ================================================================== */
const TABS=[['prin','the principle'],['press','the pressure'],['float','floating'],
            ['stab','stability'],['crown','the crown'],['comp','the diver & the balloon']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', off:'#161c2c', edge:'#242a3a', comp:'#2a3346', gold:'#d9b44a',
           fluid:'#163a55', fluid2:'#1e4f73', body:'#4a5060', body2:'#6b7285', air:'#0d1626'};
const RO_W=300;
const COMP_LIST=[{id:'diver',name:'the Cartesian diver'},{id:'balloon',name:'the balloon'}];
const FLUID_LIST=FLUIDS.map(f=>({id:f.id,name:f.name}));
const MAT_LIST=MATS.map(m=>({id:m.id,name:m.name}));
const GAS_LIST=GASES.map(g=>({id:g.id,name:g.name}));

const DEFAULTS={view:'prin', fluid:'water', mat:'iron', rhoCustom:1500, volL:2, lowered:0.6,
                shape:'box', tilt:25, wline:0.3,
                fshape:'box', ratio:0.5, cargo:200, push:0.1,
                beam:1.0, sratio:0.5, heel:5,
                crownM:1.0, gold:0.7,
                comp:'diver', squeeze:7000, diverY:0.12, gas:'helium', balV:2000, payload:1500,
                running:true, speed:1};
const ST=Object.assign({},DEFAULTS);
const LIM={volMax:10, tiltMax:180, cargoMax:700, beamMax:3, squeezeMax:12000, balVMax:6000, payloadMax:3000};

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the live clock and the three runs --------------------------------------
   A run is an ODE integrated one 1/60 s step per frame (speed = steps per
   frame) from the state the sliders set when the button was pressed: the
   heaving body (float), the rolling box (stab), the sinking diver (comp).
   Every slider resets its view's run; nothing moves until the button. */
const SIM={t:0, key:''};
const RUN={kind:null, t:0, x:0, v:0, trace:[]};
const HEAVE_C=20, ROLL_C=0.0;                  /* damping: N s/m per m^2 of body, N m s per m of length */
function simKey(st){ return [st.view,st.fluid,st.mat,st.rhoCustom,st.volL,st.shape,st.tilt,st.wline,st.fshape,st.ratio,st.cargo,st.push,
                             st.beam,st.sratio,st.heel,st.crownM,st.gold,st.comp,st.squeeze,st.diverY,st.gas,st.balV,st.payload].join('|'); }
function simReset(st){ SIM.t=0; SIM.key=simKey(st); RUN.kind=null; RUN.t=0; RUN.x=0; RUN.v=0; RUN.trace=[]; }
function viewAnimates(v){ return v==='float'||v==='stab'||v==='comp'; }
function runActive(st){ return RUN.kind!==null&&RUN.kind===st.view; }
/* the buttons: start a run from the current sliders */
function startRun(st){
  if(SIM.key!==simKey(st)) simReset(st);
  if(st.view==='float'){ const F=floatModel(st); if(F.sinks) return false; RUN.kind='float'; RUN.x=-st.push; RUN.v=0; }
  else if(st.view==='stab'){ RUN.kind='stab'; RUN.x=st.heel*DEG; RUN.v=0; }
  else if(st.view==='comp'){ if(st.comp!=='diver') return false; RUN.kind='comp'; RUN.x=st.diverY; RUN.v=0; }
  else return false;
  RUN.t=0; RUN.trace=[[0,RUN.x]]; return true;
}
/* one frame: `speed` RK4 steps of FRAME_DT */
function runStep(st){
  if(!runActive(st)) return false;
  const n=Math.max(1,Math.round(st.speed));
  for(let k=0;k<n;k++){
    if(RUN.kind==='float'){ const F=floatModel(st); const s=rk4Step((z,v)=>heaveAcc(F.kind,F.dims,F.rho,F.m,F.d,z,v,HEAVE_C),RUN.x,RUN.v,FRAME_DT); RUN.x=s[0]; RUN.v=s[1]; }
    else if(RUN.kind==='stab'){ const Sm=stabModel(st); const s=rk4Step((th,om)=>rollAcc(Sm.b,Sm.h,Sm.r,Sm.rho,ROLL_C,th,om),RUN.x,RUN.v,FRAME_DT); RUN.x=s[0]; RUN.v=s[1]; }
    else { const C=compModel(st); const s=rk4Step((y,v)=>diverAcc(C.dp,C.rho,y,v),RUN.x,RUN.v,FRAME_DT); RUN.x=s[0]; RUN.v=s[1];
      if(RUN.x<0){ RUN.x=0; RUN.v=0; } if(RUN.x>DIVER.H){ RUN.x=DIVER.H; RUN.v=0; } }
    RUN.t+=FRAME_DT;
  }
  if(RUN.trace.length<3600) RUN.trace.push([RUN.t,RUN.x]);
  return true;
}

/* ---- the principle ------------------------------------------------------------ */
function prinModel(st){
  const rhoF=fluidRho(st.fluid), rhoB=matRho(st.mat,st.rhoCustom), V=st.volL/1000, a=Math.pow(V,1/3), s=st.lowered;
  const fSub=clamp(s,0,1), Vsub=fSub*V, W=rhoB*G*V, Fb=rhoF*G*Vsub, T=W-Fb;
  const dBot=s*a, dTop=Math.max(0,(s-1)*a);          /* depths of the bottom and top faces below the surface */
  const pBot=rhoF*G*dBot, pTop=rhoF*G*dTop, A=a*a;
  return {rhoF,rhoB,V,a,s,fSub,Vsub,W,Fb,T,slack:T<0,dBot,dTop,pBot,pTop,A,faceNet:(pBot-pTop)*A,
          floatFrac:rhoB/rhoF,wouldFloat:rhoB<rhoF,mFluidDisp:rhoF*Vsub,scaleKg:Math.max(T,0)/G};
}
/* ---- the pressure -------------------------------------------------------------- */
function pressModel(st){
  const rhoF=fluidRho(st.fluid), key=[st.shape,st.tilt,st.wline,st.fluid].join('|');
  return memo('press',key,()=>{
    const P=polyRotate(SHAPES[st.shape].pts,st.tilt*DEG), S=clipBelow(P,st.wline);
    const A=polyArea(S), Atot=polyArea(P), C=A>1e-12?polyCentroid(S):null, E=edgeForces(S,st.wline,rhoF);
    let ymin=Infinity, ymax=-Infinity; for(const p of P){ ymin=Math.min(ymin,p[1]); ymax=Math.max(ymax,p[1]); }
    return {rhoF,P,S,A,Atot,frac:A/Atot,C,F:E.F,tot:E.tot,torque:E.torque,rhogA:rhoF*G*A,
            xB:(C&&A>1e-12)?E.torque/(rhoF*G*A):null,ymin,ymax,w:st.wline,pMax:rhoF*G*(st.wline-ymin)};
  });
}
/* ---- floating ------------------------------------------------------------------- */
function floatModel(st){
  const rho=fluidRho(st.fluid), key=[st.fshape,st.ratio,st.cargo,st.fluid].join('|');
  return memo('float',key,()=>{
    const kind=shapeKind(st.fshape), dims=FSHAPES[st.fshape].dims, V=vtot(kind,dims);
    const boat=st.fshape==='boat';
    const mass=boat?BOAT.hullMass+st.cargo:st.ratio*rho*V;
    const r=mass/(rho*V);
    const sinks=r>=1;
    const d=sinks?(kind==='box'?dims[1]:2*dims[0]):draft(kind,r,dims);
    const A=sinks?0:awl(kind,d,dims), T=sinks?null:heavePeriod(mass,rho,A);
    const top=kind==='box'?dims[1]:2*dims[0];
    return {kind,dims,V,boat,m:mass,rho,r,sinks,d,A,T,freeboard:top-d,Vsub:vsub(kind,d,dims),top,
            capacity:boat?rho*BOAT.encl-BOAT.hullMass:null,rhoMean:mass/V};
  });
}
/* ---- stability ----------------------------------------------------------------- */
function stabModel(st){
  const rho=fluidRho(st.fluid), key=[st.beam,st.sratio,st.fluid].join('|');
  return memo('stab',key,()=>{
    const b=st.beam, h=1, r=st.sratio, GM=gmSmall(b,h,r), bc=criticalBeam(h,r), curve=gzCurve(b,h,r,90);
    const m=r*rho*b*h, I=m*(b*b+h*h)/12, V=r*b*h;
    return {b,h,r,rho,GM,bc,stable:GM>0,curve,loll:curve.loll,m,I,V,Troll:GM>0?rollPeriod(b,h,r,rho):null,
            d:r*h,KB:r*h/2,BM:b*b/(12*r*h),KG:h/2};
  });
}
/* ---- the crown ----------------------------------------------------------------- */
function crownModel(st){ return Object.assign({m:st.crownM,f:st.gold,rhoW:fluidRho('water')},crownFacts(st.crownM,st.gold,fluidRho('water'))); }
/* ---- the diver and the balloon ------------------------------------------------------ */
function compModel(st){
  const rho=fluidRho('water');
  if(st.comp==='diver'){
    const dp=st.squeeze, yEq=diverEq(dp,rho), dF=diverDFdy(dp,rho);
    const top=diverForce(0,dp,rho), bot=diverForce(DIVER.H,dp,rho);
    return {comp:'diver',rho,dp,yEq,inBottle:yEq!==null&&yEq>=0&&yEq<=DIVER.H,dFdy:dF,top,bot,dpSink:diverDpSink(rho),
            rhoMeanTop:DIVER.m/(DIVER.Vg+top.Va),y0:st.diverY};
  }
  const key=[st.gas,st.balV,st.payload].join('|');
  return memo('balloon',key,()=>{
    const lift0=balloonLift(0,st.gas,st.balV,st.payload), zc=balloonCeiling(st.gas,st.balV,st.payload);
    const zs=[], rs=[], ls=[]; for(let k=0;k<=44;k++){ const z=ISA.ztop*k/44; zs.push(z); rs.push(isaRho(z)); ls.push(balloonLift(z,st.gas,st.balV,st.payload)); }
    return {comp:'balloon',gas:st.gas,V:st.balV,mp:st.payload,lift0,zc,rhoC:isaRho(zc),rhoGas0:gasRho(0,st.gas),rho0:isaRho(0),
            capped:zc>=ISA.ztop,grounded:lift0<=0,zs,rs,ls,rhoNeed:st.payload/st.balV,pC:isaP(zc),TC:isaT(zc)};
  });
}

function buildModel(){
  const st=ST, view=st.view;
  const M={view,st,t:SIM.t,run:runActive(st)?{t:RUN.t,x:RUN.x,v:RUN.v,trace:RUN.trace}:null};
  if(view==='prin') M.Pr=prinModel(st);
  if(view==='press') M.Ps=pressModel(st);
  if(view==='float'){ M.Fl=floatModel(st); M.z=M.run?M.run.x:0; }
  if(view==='stab'){ M.Sb=stabModel(st); M.th=M.run?M.run.x:st.heel*DEG; M.heel=heelState(M.Sb.b,M.Sb.h,M.Sb.r,M.th); }
  if(view==='crown') M.Cr=crownModel(st);
  if(view==='comp'){ M.Cp=compModel(st); if(M.Cp.comp==='diver'){ M.y=M.run?M.run.x:st.diverY; M.now=diverForce(M.y,M.Cp.dp,M.Cp.rho); } }
  return M;
}

      s+=hd(GASES.find(g=>g.id===C.gas).name+', V = '+fmt(C.V,0)+' m&sup3;')+rrow('payload + envelope',fmt(C.mp,0)+' kg')+rrow('&rho;<sub>air</sub>, &rho;<sub>gas</sub> at sea level',sigf(C.rho0,4)+', '+sigf(C.rhoGas0,4)+' kg/m&sup3;')
        +rrow('lift at sea level',fN(C.lift0),C.lift0>0?'good':'bad');
      s+=hd('the ceiling')+rrow('needs &rho;<sub>air</sub> &minus; &rho;<sub>gas</sub> =',sigf(C.rhoNeed,4)+' kg/m&sup3;')
        +rrow('altitude',C.grounded?'it does not lift':(C.capped?'above the tropopause (11 km)':sigf(C.zc,4)+' m'),C.grounded||C.capped?'bad':'good')
        +rrow('&rho;<sub>air</sub>, p, T there',sigf(C.rhoC,4)+' kg/m&sup3;, '+sigf(C.pC/1000,4)+' kPa, '+sigf(C.TC,4)+' K');
    }
  }
  s+='</table><div class="note">Measured: the densities and the ISA constants (sources in the header). Everything else is exact and pinned in selfTest to build_buoy/derive.py.</div>';
  return s;
}

function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='prin') return E('<span class="hl">F<sub>b</sub> = &rho;<sub>f</sub> g V<sub>sub</sub></span> &nbsp;&middot;&nbsp; scale = W &minus; F<sub>b</sub> = (&rho;<sub>b</sub> &minus; &rho;<sub>f</sub>) g V &nbsp;<span class="rm">(fully under)</span>',
    'Archimedes: the upthrust is the weight of the fluid the body pushes aside — read it off the beaker and off the scale');
  if(M.view==='press') return E('F = &minus;&oint; p n dA, &nbsp; p = &rho;<sub>f</sub> g (y<sub>w</sub> &minus; y) &nbsp;&rArr;&nbsp; <span class="hl">F = &rho;<sub>f</sub> g A<sub>sub</sub> &ycirc;</span> <span class="rm">through the centroid</span>',
    'the fluid that would fill the same space is in equilibrium, so the pressure on that surface must exactly carry its weight — for any shape, at any tilt');
  if(M.view==='float') return E('<span class="hl">&rho;<sub>f</sub> V<sub>sub</sub> = m</span> &nbsp;&middot;&nbsp; V<sub>sub</sub>/V = &rho;<sub>b</sub>/&rho;<sub>f</sub> &nbsp;&middot;&nbsp; m z&Prime; = &minus;&rho;<sub>f</sub> g A<sub>wl</sub> z &nbsp;&rArr;&nbsp; T = 2&pi;&radic;(m / &rho;<sub>f</sub> g A<sub>wl</sub>)',
    'a floating body sinks until it displaces its own weight; pushed down it heaves like a mass on the spring the waterplane makes');
  if(M.view==='stab') return E('<span class="hl">GM = KB + BM &minus; KG</span>, &nbsp; BM = I/V = b&sup2;/12d &nbsp;&middot;&nbsp; GZ &asymp; GM sin &theta; &nbsp;&middot;&nbsp; stable upright iff b/h &gt; &radic;(6r(1&minus;r))',
    'heel the box and B moves outboard; if it moves past the line of G the box rights itself, if not it rolls on — the metacentre M decides');
  if(M.view==='crown') return E('<span class="hl">&rho; = &rho;<sub>w</sub> W / (W &minus; W&prime;)</span> &nbsp;&middot;&nbsp; V = m(f/&rho;<sub>Au</sub> + (1&minus;f)/&rho;<sub>Ag</sub>) &nbsp;&middot;&nbsp; &Delta;h = &Delta;V / (&pi;D&sup2;/4)',
    'weigh it in air and in water and the density falls out; the overflow method needs a fraction of a millimetre of water level');
  if(M.Cp&&M.Cp.comp==='diver') return E('V<sub>air</sub> = V<sub>0</sub> p<sub>0</sub> / (p<sub>0</sub> + &Delta;p + &rho;gy) &nbsp;&middot;&nbsp; <span class="hl">F = &rho;g(V<sub>g</sub> + V<sub>air</sub>) &minus; mg</span>, &nbsp; dF/dy &lt; 0',
    'Boyle shrinks the pocket as it sinks, so the deeper it goes the less it is buoyed: the equilibrium exists and cannot be held');
  return E('<span class="hl">L = (&rho;<sub>air</sub>(z) &minus; &rho;<sub>gas</sub>(z)) g V &minus; m<sub>p</sub> g</span> &nbsp;&middot;&nbsp; &rho;<sub>air</sub> = p/RT, &nbsp; T = T<sub>0</sub> &minus; 6.5 K/km &middot; z, &nbsp; p = p<sub>0</sub>(T/T<sub>0</sub>)<sup>g/RL</sup>',
    'the balloon climbs until the air is as light as it is: the ISA troposphere gives the ceiling in closed form');
}
function tagHTML(M){
  const st=ST;
  if(M.view==='prin') return '<b>the principle</b> — '+MATS.find(m=>m.id===st.mat).name+' in '+FLUIDS.find(f=>f.id===st.fluid).name;
  if(M.view==='press') return '<b>the pressure</b> — '+SHAPES[st.shape].name+', '+fmt(st.tilt,0)+'&deg;';
  if(M.view==='float') return '<b>floating</b> — '+FSHAPES[st.fshape].name+(M.run?', heaving':'');
  if(M.view==='stab') return '<b>stability</b> — b/h = '+fmt(st.beam,2)+', r = '+fmt(st.sratio,2)+(M.run?', released':'');
  if(M.view==='crown') return '<b>the crown</b> — '+Math.round(100*st.gold)+' % gold';
  return '<b>'+(st.comp==='diver'?'the Cartesian diver':'the balloon')+'</b>'+(st.comp==='diver'?' — squeeze '+fmt(st.squeeze/1000,1)+' kPa':' — '+GASES.find(g=>g.id===st.gas).name);
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_cycloid/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}
/* the fluid: a translucent slab from ybot up to the surface yw across [x0, x1] */
function fluidRect(ctx,map,x0,x1,ybot,yw,col){
  const X0=map.X(x0), X1=map.X(x1), Y0=map.Y(yw), Y1=map.Y(ybot);
  ctx.fillStyle=col||rgba(COL.struct,0.16); ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle=rgba(COL.struct,0.8); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y0); ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y0);
}
/* a force arrow whose world length is len x (F / Fref), with its label */
function forceArrow(ctx,W,H,map,at,F,Fref,dir,len,col,txt,labDx){
  const v=[0,dir*len*Math.min(Math.abs(F)/Math.max(Fref,1e-12),1.6)];
  arrowW(ctx,map,at,v,col,2);
  const tip=[at[0]+v[0],at[1]+v[1]];
  if(txt) lab(ctx,W,H,map.X(tip[0])+(labDx===undefined?8:labDx),map.Y(tip[1]),txt,col,LAB_FONT,labDx!==undefined&&labDx<0?'right':'left');
}
function matColour(id){
  if(id==='gold') return '#d9b44a'; if(id==='silver') return '#c8ccd6'; if(id==='copper') return '#c47a45';
  if(id==='cork'||id==='oak') return '#8a6a3e'; if(id==='ice') return '#bfe3ff'; if(id==='custom') return '#9a7fd1';
  return '#6b7285';
}

/* ================================================================== *
 *  view: the principle                                                *
 * ================================================================== */
const PRIN_CAP_FULL='A block hangs from a spring scale and is lowered into the tank (drag it, or use the slider; 1.00 sides puts its '
  +'top at the surface). The fluid it pushes aside spills into the beaker on the right, and the scale reading falls by exactly the '
  +'weight of that spilled fluid: W − F_b. Small cyan arrows are the pressure on the bottom face (and on the top face once it is '
  +'under); their difference times the face area IS the upthrust. Below: the three forces against how far the block is lowered — '
  +'the upthrust stops growing at 1.00, the weight never changes. Arrows share one force scale.';
const PRIN_CAP_SHORT='Lower the block: the scale falls by the weight of the spilled fluid. Arrows share one force scale.';
function prinGeo(ctx,W,H,M){
  const L=stageLayout(ctx,W,H,PRIN_CAP_FULL,PRIN_CAP_SHORT,1,0.34,1);
  const ext={xmin:-0.33,xmax:0.5,ymin:-0.5,ymax:0.6};
  const map=worldFitUp(L.main,ext,0.02);
  const P=M.Pr, a=P.a, y0=-P.s*a;
  return {L,map,a,y0,block:[[-a/2,y0],[a/2,y0],[a/2,y0+a],[-a/2,y0+a]]};
}
function drawPrin(ctx,W,H,M){
  const G=prinGeo(ctx,W,H,M), L=G.L, map=G.map, P=M.Pr, a=G.a, y0=G.y0, st=M.st;
  const bm=L.main;
  /* the tank and the beaker */
  fluidRect(ctx,map,-0.26,0.26,-0.45,0);
  ctx.strokeStyle=rgba(COL.struct,0.55); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(map.X(-0.26),map.Y(0.08)); ctx.lineTo(map.X(-0.26),map.Y(-0.45)); ctx.lineTo(map.X(0.26),map.Y(-0.45)); ctx.lineTo(map.X(0.26),map.Y(0.08)); ctx.stroke();
  const Ab=0.04, lvl=P.Vsub/Ab;
  ctx.beginPath(); ctx.moveTo(map.X(0.32),map.Y(-0.15)); ctx.lineTo(map.X(0.32),map.Y(-0.45)); ctx.lineTo(map.X(0.48),map.Y(-0.45)); ctx.lineTo(map.X(0.48),map.Y(-0.15)); ctx.stroke();
  if(lvl>0){ const X0=map.X(0.32), X1=map.X(0.48); ctx.fillStyle=rgba(COL.pos,0.28); ctx.fillRect(X0,map.Y(-0.45+lvl),X1-X0,map.Y(-0.45)-map.Y(-0.45+lvl)); }
  seg(ctx,map,[0.26,0],[0.32,-0.02],rgba(COL.struct,0.5),1,[3,3]);           /* the spout */
  lab(ctx,W,H,map.X(0.40),map.Y(-0.10),'spilled: '+sigf(P.Vsub*1000,3)+' L = '+sigf(P.mFluidDisp,3)+' kg',COL.pos,SM_FONT,'center');
  /* the scale and the string */
  const sc=[-0.06,0.44,0.12,0.1];
  ctx.fillStyle='#141925'; ctx.fillRect(map.X(sc[0]),map.Y(sc[1]+sc[3]),sc[2]*map.s,sc[3]*map.s);
  ctx.strokeStyle=COL.edge; ctx.strokeRect(map.X(sc[0]),map.Y(sc[1]+sc[3]),sc[2]*map.s,sc[3]*map.s);
  lab(ctx,W,H,map.X(0),map.Y(0.49),P.slack?'slack':sigf(P.T,4)+' N',P.slack?COL.ref:'#fff',LAB_FONT,'center');
  lab(ctx,W,H,map.X(0),map.Y(0.575),'spring scale',COL.dim,SM_FONT,'center');
  seg(ctx,map,[0,0.44],[0,y0+a],P.slack?rgba(COL.ref,0.6):'#c9ced8',P.slack?1:1.4,P.slack?[3,3]:null);
  /* the block, its submerged part tinted */
  const mc=matColour(st.mat);
  worldPoly(ctx,map,G.block,rgba(mc,0.55),mc,1.4);
  const sub=clipBelow(G.block,0);
  if(sub.length>=3) worldFill(ctx,map,sub,rgba(COL.struct,0.22));
  /* face pressures */
  const pref=Math.max(P.pBot,1e-9), n=4;
  for(let k=0;k<n;k++){ const x=-a/2+a*(k+0.5)/n;
    if(P.pBot>0){ const len=0.12*P.pBot/pref; arrowW(ctx,map,[x,y0-len],[0,len],COL.struct,1.2); }
    if(P.pTop>0){ const len=0.12*P.pTop/pref; arrowW(ctx,map,[x,y0+a+len],[0,-len],COL.struct,1.2); } }
  if(P.pBot>0) lab(ctx,W,H,map.X(0),map.Y(y0-0.12*P.pBot/pref-0.035),'p<sub>bot</sub> = &rho;<sub>f</sub> g d = '+sigf(P.pBot,4)+' Pa',COL.struct,SM_FONT,'center');
  if(P.pTop>0) lab(ctx,W,H,map.X(0),map.Y(y0+a+0.12*P.pTop/pref+0.035),'p<sub>top</sub> = '+sigf(P.pTop,4)+' Pa',COL.struct,SM_FONT,'center');
  /* the three forces, one scale: W -> 0.22 world */
  const Fref=P.W, len=0.22, cB=sub.length>=3?polyCentroid(sub):[0,y0+a/2];
  forceArrow(ctx,W,H,map,[a/2+0.03,y0+a/2],P.W,Fref,-1,len,COL.ref,'W = '+sigf(P.W,4)+' N');
  if(P.Fb>0) forceArrow(ctx,W,H,map,[cB[0]-a/2-0.03,cB[1]],P.Fb,Fref,1,len,COL.pos,'F<sub>b</sub> = '+sigf(P.Fb,4)+' N',-8);
  if(!P.slack&&P.T>0) forceArrow(ctx,W,H,map,[-a/2-0.03,y0+a],P.T,Fref,1,len,COL.live,'T = W &minus; F<sub>b</sub>',-8);
  else if(P.slack) lab(ctx,W,H,map.X(-a/2)-10,map.Y(y0+a+0.06),'the string cannot push: it floats',COL.ref,SM_FONT,'right');
  lab(ctx,W,H,map.X(-0.26)+5,map.Y(-0.45)-4,FLUIDS.find(f=>f.id===st.fluid).name+', '+sigf(P.rhoF,4)+' kg/m&sup3;',COL.struct,SM_FONT,'left','bottom');
  lab(ctx,W,H,map.X(0),map.Y(y0+a/2),MATS.find(m=>m.id===st.mat).name+(st.mat==='custom'?'':''),'#fff',SM_FONT,'center');
  /* the force curves against the lowering */
  if(L.bottom.length){
    const b=L.bottom[0];
    const xs=[], fb=[], tt=[]; for(let i=0;i<=60;i++){ const s=1.5*i/60; xs.push(s); const F=P.rhoF*G_or(P)*Math.min(s,1)*P.V; fb.push(F); tt.push(P.W-F); }
    const ylo=Math.min(0,Math.min.apply(null,tt))*1.1, yhi=Math.max(P.W,Math.max.apply(null,fb))*1.15;
    axesR(ctx,b,0,1.5,ylo,yhi,{title:titleFor(b,'the three forces against how far the block is lowered (sides)','forces vs lowering'),xlab:'lowered, sides',ylab:'N',nx:6,ny:4,
      yfmt:v=>sigf(v,3)});
    polyline(ctx,b,[0,1.5],[P.W,P.W],0,1.5,ylo,yhi,COL.ref,1.2,[4,4]);
    polyline(ctx,b,xs,fb,0,1.5,ylo,yhi,COL.pos,1.8);
    polyline(ctx,b,xs,tt,0,1.5,ylo,yhi,COL.live,1.6);
    polyline(ctx,b,[0,1.5],[0,0],0,1.5,ylo,yhi,'#3a4152',1,[2,3]);
    marker(ctx,b,0,1.5,ylo,yhi,P.s,P.Fb,COL.pos); marker(ctx,b,0,1.5,ylo,yhi,P.s,P.T,COL.live);
    legendAuto(ctx,b,[[COL.ref,'W = &rho;<sub>b</sub> g V'],[COL.pos,'F<sub>b</sub> = &rho;<sub>f</sub> g V<sub>sub</sub>'],[COL.live,'scale, W &minus; F<sub>b</sub>']]);
  }
  drawCaption(ctx,L);
}

  lab(ctx,W,H,mR.X(D/2)+6,mR.Y(lvl+dh/2),'&Delta;h = '+sigf(C.dhMm,3)+' mm (drawn &times;20)',COL.ref,SM_FONT,'left');
  lab(ctx,W,H,mR.X(0),mR.Y(0.66),'Vitruvius&rsquo; overflow: D = 20 cm',COL.dim,SM_FONT,'center');
  lab(ctx,W,H,mR.X(-D/2)-6,mR.Y(lvl),'gold level',COL.ref,SM_FONT,'right');
  if(L.bottom.length){
    const b=L.bottom[0], xs=[], ys=[]; for(let i=0;i<=50;i++){ const f=i/50; xs.push(f); ys.push(crownFacts(1,f,1000).rho); }
    axesR(ctx,b,0,1,10000,20000,{title:titleFor(b,'the density of a gold&ndash;silver alloy against its gold fraction by mass','alloy density vs gold fraction'),xlab:'gold, fraction by mass',ylab:'kg/m&sup3;',nx:5,ny:4,yfmt:v=>sigf(v,3)});
    polyline(ctx,b,xs,ys,0,1,10000,20000,COL.pos,1.8);

}

/* ================================================================== *
 *  view: the diver and the balloon                                    *
 * ================================================================== */
const DIVER_CAP_FULL='A sealed bottle of water; the diver is a small tube with an air pocket, and squeezing the bottle raises the '
  +'pressure everywhere by Δp. Boyle shrinks the pocket, the diver displaces less, and its upthrust falls. There is a depth y* where '
  +'it exactly balances — the dashed line — but a little deeper the pocket is smaller still and the net force points down; a '
  +'little shallower, up. Below: the net upward force against depth crosses zero with a negative slope, which is what an unstable '
  +'equilibrium looks like. Release the diver above or below y* and watch it run away (quadratic drag, walls at the top and bottom).';
const DIVER_CAP_SHORT='Boyle shrinks the pocket with depth: the equilibrium exists and is unstable. Release the diver and watch.';
const BALL_CAP_FULL='The ISA troposphere: temperature falls 6.5 K per kilometre, so pressure and density fall by the power law shown. '
  +'A balloon of fixed volume rises as long as the air it displaces outweighs its gas and payload; it stops where the air’s density '
  +'has fallen to (payload/V)/(1 − M_gas/M_air) — a closed form for a light gas, a root for hot air. The curve is the air density '
  +'against altitude with the balloon drawn at its ceiling; below, the net lift against altitude. Beyond 11 km the model stops '
  +'(the stratosphere has a different law).';
const BALL_CAP_SHORT='The balloon climbs until the air is as light as it is; the ISA troposphere gives the ceiling in closed form.';
function compGeo(ctx,W,H,M){
  const diver=M.Cp.comp==='diver';
  const L=stageLayout(ctx,W,H,diver?DIVER_CAP_FULL:BALL_CAP_FULL,diver?DIVER_CAP_SHORT:BALL_CAP_SHORT,1,0.34,1);
  const map=diver?worldFitUp(L.main,{xmin:-0.2,xmax:0.2,ymin:-0.33,ymax:0.05},0.01):null;
  return {L,map};
}
function drawComp(ctx,W,H,M){
  const G2=compGeo(ctx,W,H,M), L=G2.L, C=M.Cp;
  if(C.comp==='diver'){
    const map=G2.map, y=M.y, Hb=DIVER.H;
    fluidRect(ctx,map,-0.12,0.12,-Hb,0);
    ctx.strokeStyle=rgba(COL.struct,0.55); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(map.X(-0.12),map.Y(0.03)); ctx.lineTo(map.X(-0.12),map.Y(-Hb)); ctx.lineTo(map.X(0.12),map.Y(-Hb)); ctx.lineTo(map.X(0.12),map.Y(0.03)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(map.X(-0.12),map.Y(0.03)); ctx.lineTo(map.X(0.12),map.Y(0.03)); ctx.stroke();
    /* the squeeze: arrows on the walls */
    const sq=C.dp/LIM.squeezeMax;
    if(sq>0){ for(const yy of [-0.08,-0.16,-0.24]){ arrowW(ctx,map,[-0.19,yy],[0.05*sq+0.01,0],COL.struct,1.4); arrowW(ctx,map,[0.19,yy],[-(0.05*sq+0.01),0],COL.struct,1.4); }
      lab(ctx,W,H,map.X(-0.15),map.Y(-0.02),'squeeze &Delta;p = '+fmt(C.dp,0)+' Pa',COL.struct,SM_FONT,'left'); }
    /* the equilibrium */
    if(C.inBottle){ seg(ctx,map,[-0.12,-C.yEq],[0.12,-C.yEq],COL.live,1,[4,3]); lab(ctx,W,H,map.X(0.12)+6,map.Y(-C.yEq),'y* = '+sigf(C.yEq,3)+' m, unstable',COL.live,SM_FONT); }
    else lab(ctx,W,H,map.X(0.12)+6,map.Y(-0.15),C.yEq===null?'no equilibrium':'y* outside the bottle ('+sigf(C.yEq,3)+' m)',COL.live,SM_FONT);
    /* the diver: a 4-cm tube, its pocket height ∝ V_air */
    const yt=-y, hT=0.04, hA=0.03*M.now.Va/DIVER.V0;
    worldPoly(ctx,map,[[-0.01,yt-hT],[0.01,yt-hT],[0.01,yt],[-0.01,yt]],rgba(COL.body2,0.35),'#c9ced8',1.2);
    worldPoly(ctx,map,[[-0.009,yt-hA],[0.009,yt-hA],[0.009,yt-0.001],[-0.009,yt-0.001]],rgba('#ffffff',0.85),null);
    const Fw=DIVER.m*G, Fb=Fw+M.now.Fup;
    forceArrow(ctx,W,H,map,[0.02,yt-hT/2],Fb,Fw,1,0.06,COL.pos,'F<sub>b</sub> = '+sigf(Fb,4)+' N');
    forceArrow(ctx,W,H,map,[-0.02,yt-hT/2],Fw,Fw,-1,0.06,COL.ref,'mg = '+sigf(Fw,4)+' N',-8);
    lab(ctx,W,H,map.X(0),map.Y(yt+0.012),'air '+sigf(M.now.Va*1e6,3)+' mL',COL.dim,SM_FONT,'center');
    if(M.run) lab(ctx,W,H,map.X(-0.12)+4,map.Y(-Hb)+14,'t = '+fmt(M.run.t,2)+' s, y = '+sigf(y,3)+' m',COL.live,SM_FONT,'left');
    if(L.bottom.length){
      const b=L.bottom[0], xs=[], ys=[]; for(let i=0;i<=60;i++){ const yy=Hb*i/60; xs.push(yy); ys.push(diverForce(yy,C.dp,C.rho).Fup); }
      const fa=Math.max(1e-4,Math.max.apply(null,ys.map(Math.abs)))*1.2;
      axesR(ctx,b,0,Hb,-fa,fa,{title:titleFor(b,'net upward force on the diver against depth — the slope is negative at the crossing','net force vs depth'),xlab:'depth y (m)',ylab:'N',nx:6,ny:4,yfmt:v=>sigf(v,2)});
      polyline(ctx,b,[0,Hb],[0,0],0,Hb,-fa,fa,'#3a4152',1,[2,3]);
      polyline(ctx,b,xs,ys,0,Hb,-fa,fa,COL.pos,1.8);
      if(C.inBottle) marker(ctx,b,0,Hb,-fa,fa,C.yEq,0,COL.ref);
      marker(ctx,b,0,Hb,-fa,fa,clamp(y,0,Hb),M.now.Fup,COL.live);
    }
  } else {
    const b0=L.main, zmax=ISA.ztop/1000;
    axesR(ctx,b0,0,1.3,0,zmax,{title:titleFor(b0,'the ISA troposphere: air density against altitude, and the balloon at its ceiling','air density vs altitude'),xlab:'density (kg/m&sup3;)',ylab:'altitude (km)',nx:6,ny:6});
    polyline(ctx,b0,C.rs,C.zs.map(z=>z/1000),0,1.3,0,zmax,COL.struct,1.8);
    polyline(ctx,b0,C.zs.map(z=>gasRho(z,C.gas)),C.zs.map(z=>z/1000),0,1.3,0,zmax,rgba(COL.dim,0.7),1.2,[3,3]);
    const rn=C.rhoNeed/(C.gas==='hotair'?1:(1-GASES.find(g=>g.id===C.gas).M/ISA.Mair));
    if(C.gas!=='hotair') polyline(ctx,b0,[rn,rn],[0,zmax],0,1.3,0,zmax,COL.ref,1.2,[4,4]);
    const zc=C.zc/1000, X=b0.x+b0.w*clamp(C.rhoC,0,1.3)/1.3, Y=b0.y1-b0.h*zc/zmax;
    polyline(ctx,b0,[0,1.3],[zc,zc],0,1.3,0,zmax,rgba(COL.live,0.6),1,[3,3]);
    dot(ctx,X,Y,9,rgba(COL.pos,0.35),COL.pos,1.6); dot(ctx,X,Y+16,3,COL.ref,null);
    ctx.strokeStyle=COL.pos; ctx.beginPath(); ctx.moveTo(X,Y+9); ctx.lineTo(X,Y+16); ctx.stroke();
    lab(ctx,W,H,X+14,Y,C.grounded?'no lift at sea level':(C.capped?'still lifting at 11 km':'ceiling '+sigf(C.zc,4)+' m'),COL.pos,LAB_FONT);
    legendAuto(ctx,b0,[[COL.struct,'&rho;<sub>air</sub>(z), ISA'],[COL.dim,'&rho;<sub>gas</sub>(z)'],[COL.ref,'&rho;<sub>air</sub> needed']]);
    if(L.bottom.length){
      const b=L.bottom[0], la=Math.max(1,Math.max.apply(null,C.ls.map(Math.abs)))*1.15;
      axesR(ctx,b,0,zmax,-la,la,{title:titleFor(b,'net lift against altitude — the balloon stops where it crosses zero','net lift vs altitude'),xlab:'altitude (km)',ylab:'N',nx:6,ny:4,yfmt:v=>sigf(v,3)});
      polyline(ctx,b,[0,zmax],[0,0],0,zmax,-la,la,'#3a4152',1,[2,3]);
      polyline(ctx,b,C.zs.map(z=>z/1000),C.ls,0,zmax,-la,la,COL.pos,1.8);
      if(!C.grounded&&!C.capped) marker(ctx,b,0,zmax,-la,la,zc,0,COL.live);
    }
  }
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='prin') drawPrin(ctx,W,H,M);
  else if(M.view==='press') drawPress(ctx,W,H,M);
  else if(M.view==='float') drawFloat(ctx,W,H,M);
  else if(M.view==='stab') drawStab(ctx,W,H,M);
  else if(M.view==='crown') drawCrown(ctx,W,H,M);
  else drawComp(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame: only an active run moves anything (runStep carries the guard;
     a second one here was an equivalent mutant the sweep could not see) */
  S.step=function(){
    if(!ST.running||!viewAnimates(ST.view)) return false;
    return runStep(ST);
  };
  /* the pointer: the block in the principle view, the waterline in the pressure view */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const ctx=canvas.getContext('2d');
    if(ST.view==='prin'){
      const G2=prinGeo(ctx,S.W,S.H,buildModel()), map=G2.map;
      if(type==='down'){ const X0=map.X(-G2.a/2)-10, X1=map.X(G2.a/2)+10, Y0=map.Y(G2.y0+G2.a)-10, Y1=map.Y(G2.y0)+10;
        if(x>=X0&&x<=X1&&y>=Y0&&y<=Y1){ DRAG.what='block'; DRAG.off=(G2.y0+G2.a/2)-map.wy(y); return true; } return false; }
      if(type==='move'&&DRAG.what==='block'){ const yc=map.wy(y)+DRAG.off; ST.lowered=clamp((G2.a/2-yc)/G2.a,0,1.5); return true; }
      return false;
    }
    if(ST.view==='press'){
      const G2=pressGeo(ctx,S.W,S.H,buildModel()), map=G2.map;
      if(type==='down'){ if(Math.abs(y-map.Y(ST.wline))<12&&x>=map.X(-1.6)&&x<=map.X(1.6)){ DRAG.what='wline'; return true; } return false; }
      if(type==='move'&&DRAG.what==='wline'){ ST.wline=clamp(map.wy(y),-1.2,1.2); return true; }
      return false;
    }
    return false;
  };
  return S;
}

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    if(st.view!==k){ st.view=k; simReset(st); }
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }

  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }
  const restart=()=>{ simReset(st); };

  const gFluid=h('div',{class:'grp'},h('h3',null,'the fluid'));

  const gPrin=h('div',{class:'grp'},h('h3',null,'the block'));

  gPrin.appendChild(slider('rhoCustom','density, kg/m³',100,25000,10,v=>fmt(v,0),restart));

  gPress.appendChild(slider('tilt','tilt, degrees',0,LIM.tiltMax,1,v=>fmt(v,0)+'°',restart));

  const gStab=h('div',{class:'grp'},h('h3',null,'the box'));

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');

        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));

    prinTag.innerHTML='drag the block up and down, or use the slider; past 1.00 it is fully under';
    pressTag.innerHTML='drag the waterline; arrows are the pressure on each edge, per metre of depth';
    floatTag.innerHTML=st.fshape==='boat'?'the hull weighs '+BOAT.hullMass+' kg and encloses '+BOAT.encl+' m&sup3;: it sinks when the cargo passes '+fmt(fluidRho(st.fluid)*BOAT.encl-BOAT.hullMass,0)+' kg'
                                        :'push &amp; release starts the heave; ratio &ge; 1 sinks';
    stabTag.innerHTML='release integrates I&theta;&Prime; = &minus;&rho;gV&middot;GZ(&theta;) from the heel you set; the square block at r = 0.5 rolls to its corner';
    crownTag.innerHTML='pure gold at 100 %; Hiero&rsquo;s goldsmith is said to have swapped in silver';
    compTag.innerHTML=diver?'squeeze the bottle to move the equilibrium; release the diver above or below it':'the ceiling is where the air has thinned to the balloon&rsquo;s own mean density';
    runTag.innerHTML='space runs/pauses &nbsp; <b>r</b> stops the run &nbsp; 1&ndash;6 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='prin')?'drag the block · 1–6 switch views':(st.view==='press')?'drag the waterline · 1–6 switch views'
        :viewAnimates(st.view)?'space pauses · r stops the run · 1–6 switch views':'1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ simReset(st); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%10===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(st); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){
    Object.assign(ST,DEFAULTS,over); simReset(ST);
    if(over.runFrames){ startRun(ST); for(let k=0;k<over.runFrames;k++) runStep(ST); }
    try{ return fn(); } finally{ Object.assign(ST,stSave); simReset(ST); }
  }

  /* ---------- 0. the shared-helper fixes cannot rot ---------- */
  ok(plain('&Delta;x &theta; &#955;')==='Δx θ λ','plain() decodes named, capital and numeric entities');
  ok(plain('a<sub>B</sub>b')==='aBb','plain() strips tags');
  ok(ticksFor(0.8,0.2,5).length===1&&ticksFor(0.2,0.8,5).length>=3,'axes() range-sort is what rescues an inverted axis');
  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }
  { const stub={beginPath(){},moveTo(){},lineTo(){},stroke(){},save(){},restore(){},setLineDash(){}};
    const bb=box(100,100,200,100); POLY_SEGS=[];
    polyline(stub,bb,[-1,2],[0.5,0.5],0,1,0,1,'#fff',1);
    ok(POLY_SEGS.length===4&&Math.abs(POLY_SEGS[0]-bb.x)<1e-9&&Math.abs(POLY_SEGS[2]-bb.x1)<1e-9,'polyline clips a both-ends-outside segment to the frame edges');
    POLY_SEGS=[]; }

  for(const [dp,y,dF,Ft,Fb,Vt,Vb] of [[0,0.8610228773332,-0.005256708355839,0.004903325,0.003104747710668,6.5e-06,6.316596157777e-06],[5000,0.3511647708443,-0.005256708355839,0.00190575975194,0.0002701933371966,6.194333411709e-06,6.027552052658e-06],
      [7000,0.1472215282487,-0.005256708355839,0.0007842151453958,-0.0007922977157377,6.079967689822e-06,5.919208117376e-06],[9000,-0.0567217143469,-0.005256708355839,-0.0002966661624745,-0.001817267121596,5.969748470428e-06,5.81469032528e-06]]){
    const tag='diver dp='+dp+': ';
    const C=withState({view:'comp',comp:'diver',squeeze:dp},()=>compModel(ST));
    rel(C.yEq,y,1e-11,tag+'equilibrium depth (derive)'); rel(C.dFdy,dF,1e-11,tag+'dF/dy (derive)'); ok(C.dFdy<0,tag+'negative: unstable');
    rel(C.top.Fup,Ft,1e-11,tag+'force at the top (derive)'); rel(C.bot.Fup,Fb,1e-11,tag+'force at the bottom (derive)'); rel(C.top.Va,Vt,1e-11,tag+'pocket at the top (derive)'); rel(C.bot.Va,Vb,1e-11,tag+'pocket at the bottom (derive)');
    const e=1e-6; if(C.yEq!==null){ const num=(diverForce(C.yEq+e,dp,1000).Fup-diverForce(C.yEq-e,dp,1000).Fup)/(2*e); rel(num,C.dFdy,1e-4,tag+'dF/dy by finite differences'); close(diverForce(C.yEq,dp,1000).Fup,0,1e-12,tag+'F(y*) = 0'); }
    eq(C.inBottle,y>=0&&y<=0.3,tag+'in the bottle iff 0 <= y* <= H'); }
  ok(withState({view:'comp',comp:'diver',squeeze:0},()=>compModel(ST)).dFdy===withState({view:'comp',comp:'diver',squeeze:9000},()=>compModel(ST)).dFdy,'dF/dy at equilibrium does not depend on the squeeze (p* is fixed by m, V_g, V_0)');
  for(const [y0,y60,v60,y180,v180] of [[0.127,0.1214771958337,-0.01144456747986,0.06245499875351,-0.05436059703344],[0.167,0.172381761369,0.01115068621819,0.2297920925205,0.05278215117303]]){
    let y=y0, v=0; for(let k=1;k<=180;k++){ const s=rk4Step((yy,vv)=>diverAcc(7000,1000,yy,vv),y,v,FRAME_DT); y=s[0]; v=s[1]; if(y<0){ y=0; v=0; } if(y>DIVER.H){ y=DIVER.H; v=0; }
      if(k===60){ rel(y,y60,1e-10,'diver from '+y0+': y at frame 60 (derive)'); rel(v,v60,1e-9,'v (derive)'); } }
    rel(y,y180,1e-10,'y at frame 180 (derive)'); rel(v,v180,1e-9,'v (derive)'); ok((y0<0.1472)===(y<y0),'released above y* it rises, below it sinks'); }
  { const M=withState({view:'comp',comp:'diver',squeeze:7000,diverY:0.167,runFrames:60},()=>buildModel()); rel(M.y,0.172381761369,1e-10,'the model run reproduces the diver at frame 60 (derive)');
    const M2=withState({view:'comp',comp:'diver',squeeze:7000,diverY:0.167,runFrames:2000},()=>buildModel()); close(M2.y,DIVER.H,1e-12,'and it ends on the bottom'); }

  /* ---------- G. the ISA and the balloon ---------- */
  rel(isaP(11000),22632.03182222,1e-11,'ISA p at 11 km (derive; the article prints 22632)'); close(isaP(11000),22632,0.1,'22632 Pa'); rel(isaT(11000),216.65,1e-12,'T at 11 km = -56.5 °C'); rel(isaRho(11000),0.3639176038213,1e-11,'rho at 11 km (derive; article 0.3639)'); close(isaRho(11000),0.3639,5e-5,'0.3639 kg/m^3');
  rel(isaRho(0),1.22500031685,1e-11,'sea-level density 1.2250 (derive)'); rel(ISA.Mair,0.02896492428571,1e-11,'M_air = R_u/R_air (derive)');
  for(const [z,p,T,rho] of [[1000,89874.56028802,281.65,1.111642738881],[2000,79495.19723042,275.15,1.00649028335],[5000,54019.87990248,255.65,0.7361156139998],[10000,26436.23393095,223.15,0.4127061186074]]){
    rel(isaP(z),p,1e-11,'ISA p at '+z+' m (derive)'); rel(isaT(z),T,1e-12,'T (derive)'); rel(isaRho(z),rho,1e-11,'rho (derive)'); }
  rel(gasRho(0,'helium'),0.1692802187176,1e-11,'helium at sea level (derive)'); rel(gasRho(0,'hydrogen'),0.08525669234875,1e-11,'hydrogen (derive)'); rel(gasRho(0,'hotair'),0.9459569644922,1e-11,'hot air at 373.15 K (derive)');
  for(const [gas,V,mp,L0,zc,rc] of [['helium',2000,1500,5996.180000696,3422.104323682,0.8702593038276],['hydrogen',2000,1500,7644.158630427,4151.630941572,0.8061025461226],['hotair',2800,500,2758.820375913,9057.057207447,0.4631509333011],
      ['helium',2000,2500,-3810.469999304,0,1.22500031685],['helium',2000,500,15802.8300007,11000,0.3639176038213],['hotair',2800,900,-1163.839624087,0,1.22500031685],['hotair',2800,300,4720.150375913,11000,0.3639176038213]]){
    const tag='balloon '+gas+' '+V+' m^3, '+mp+' kg: ';
    const C=withState({view:'comp',comp:'balloon',gas,balV:V,payload:mp},()=>compModel(ST));
    rel(C.lift0,L0,1e-11,tag+'lift at sea level (derive)'); rel(C.zc,zc,1e-9,tag+'ceiling (derive brentq)'); rel(C.rhoC,rc,1e-11,tag+'air density there (derive)');
    if(gas!=='hotair'&&zc>0&&zc<11000){ rel(balloonCeilingClosed(gas,V,mp),zc,1e-9,tag+'the closed-form inverse agrees (derive CHECK)'); close(balloonLift(zc,gas,V,mp),0,1e-6,tag+'zero lift at the ceiling'); }
    eq(C.grounded,L0<=0,tag+'grounded iff no lift'); eq(C.capped,zc>=11000,tag+'capped iff still lifting at 11 km'); }

  /* ---------- H. the models, the readouts, the scene ---------- */
  for(const [v] of TABS){
    for(const over of (v==='comp'?[{comp:'diver'},{comp:'balloon'}]:v==='float'?[{fshape:'box'},{fshape:'boat',cargo:700}]:[{}])){
      const M=withState(Object.assign({view:v},over),()=>buildModel());
      const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
      ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0&&html.indexOf('Infinity')<0,'panels clean for '+v+' '+JSON.stringify(over)); } }
  { const M=withState({view:'prin'},()=>buildModel()); ok(readoutHTML(M).indexOf('11.77')>=0,'the principle readout prints F_b = 11.77 N off the model'); ok(readoutHTML(M).indexOf('142.6')>=0,'and the scale reading 142.6 N'); }
  { const M=withState({view:'stab',beam:1,sratio:0.5},()=>buildModel()); ok(readoutHTML(M).indexOf('45.00&deg;')>=0,'the stability readout prints the 45° loll'); ok(readoutHTML(M).indexOf('unstable')>=0,'and says unstable'); }
  { const M=withState({view:'comp',comp:'balloon'},()=>buildModel()); ok(readoutHTML(M).indexOf('3422')>=0,'the balloon readout prints the 3422 m ceiling'); }
  { const shot=makeShot(1100,712); const S=makeScene({getContext:()=>shot});
    Object.assign(ST,DEFAULTS); simReset(ST);
    ok(!S.step(),'the principle view has no clock'); ST.view='float'; simReset(ST); ok(!S.step(),'floating idles until a run starts');
    ok(startRun(ST),'push & release starts a run'); ok(S.step(),'then a frame advances'); close(RUN.t,FRAME_DT,1e-15,'by 1/60 s'); ok(RUN.x>-0.1,'the box has risen from the push');
    ST.running=false; ok(!S.step(),'paused: no frame'); ST.running=true; ST.speed=3; S.step(); close(RUN.t,4*FRAME_DT,1e-15,'speed 3 takes three steps per frame'); ST.speed=1;
    ST.ratio=1.1; simReset(ST); ok(!startRun(ST),'a sinking body cannot be pushed to heave');
    ST.view='comp'; ST.comp='balloon'; simReset(ST); ok(!startRun(ST),'the balloon has no run'); ST.comp='diver'; ok(startRun(ST),'the diver has'); ok(S.step(),'and steps');
    ST.view='crown'; simReset(ST); ok(!startRun(ST)&&!S.step(),'the crown is static');
    /* the pointer: the block in the principle view */
    Object.assign(ST,DEFAULTS); simReset(ST);
    const Gp=prinGeo(shot,S.W,S.H,buildModel()), map=Gp.map;
    ok(S.pointer('down',map.X(0),map.Y(Gp.y0+Gp.a/2)),'pointer-down on the block grabs it'); eq(DRAG.what,'block','it is the block');
    S.pointer('move',map.X(0),map.Y(Gp.y0+Gp.a/2-0.05)); ok(ST.lowered>0.6,'dragging down lowers it ('+ST.lowered.toFixed(3)+')');
    S.pointer('move',map.X(0),map.Y(-5)); close(ST.lowered,1.5,1e-12,'and it stops at 1.5 sides'); S.pointer('move',map.X(0),map.Y(5)); close(ST.lowered,0,1e-12,'or at 0');
    ok(S.pointer('up',0,0),'pointer-up releases'); eq(DRAG.what,null,'nothing dragged');
    ok(!S.pointer('down',map.X(0.6),map.Y(0.6)),'a pointer-down away from the block grabs nothing');
    /* the waterline in the pressure view */
    ST.view='press'; simReset(ST); const Gq=pressGeo(shot,S.W,S.H,buildModel()), mq=Gq.map;
    ok(S.pointer('down',mq.X(0),mq.Y(ST.wline)+3),'pointer-down on the waterline grabs it'); S.pointer('move',mq.X(0),mq.Y(-0.5)); close(ST.wline,-0.5,1e-9,'the waterline follows the pointer');
    S.pointer('move',mq.X(0),mq.Y(-3)); close(ST.wline,-1.2,1e-12,'clamped at -1.2'); S.pointer('up',0,0);
    ok(!S.pointer('down',mq.X(0),mq.Y(ST.wline)+60),'far from the waterline nothing is grabbed');
    ST.view='crown'; ok(!S.pointer('down',300,300),'the crown view ignores the pointer');
    Object.assign(ST,stSave); simReset(ST); }

  /* ---------- I. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['prin iron',{view:'prin'},6],['prin oak slack',{view:'prin',mat:'oak',lowered:1.0},6],['prin gold 10 L under',{view:'prin',mat:'gold',volL:10,lowered:1.4},6],['prin custom mercury',{view:'prin',fluid:'mercury',mat:'custom',rhoCustom:5000,lowered:0.3},6],['prin cork out',{view:'prin',mat:'cork',lowered:0},5],
    ['press box',{view:'press'},6],['press wedge',{view:'press',shape:'wedge',tilt:110,wline:-0.2},6],['press hull',{view:'press',shape:'hull',tilt:0,wline:0.3},6],['press disc',{view:'press',shape:'disc',tilt:60,wline:0.9},6],['press under',{view:'press',shape:'box',tilt:45,wline:1.2},6],['press dry',{view:'press',shape:'box',tilt:0,wline:-1.2},4],
    ['float box',{view:'float'},4],['float cyl',{view:'float',fshape:'cyl',ratio:0.9},4],['float sphere',{view:'float',fshape:'sph',ratio:0.3},4],['float boat',{view:'float',fshape:'boat',cargo:200},6],['float boat sinks',{view:'float',fshape:'boat',cargo:700},5],['float sinks',{view:'float',ratio:1.1},3],['float heaving',{view:'float',runFrames:90},3],
    ['stab square',{view:'stab'},6],['stab wide 30',{view:'stab',beam:1.5,heel:30},6],['stab flat -45',{view:'stab',beam:2,sratio:0.8,heel:-45},6],['stab narrow',{view:'stab',beam:0.5,sratio:0.5,heel:0},6],['stab released',{view:'stab',runFrames:120},6],['stab wide released',{view:'stab',beam:1.5,heel:20,runFrames:200},6],
    ['crown 70',{view:'crown'},6],['crown gold',{view:'crown',gold:1},6],['crown silver',{view:'crown',gold:0,crownM:2},6],
    ['diver 7000',{view:'comp'},5],['diver 0',{view:'comp',squeeze:0,diverY:0.25},4],['diver 9000 run',{view:'comp',squeeze:9000,diverY:0.02,runFrames:120},4],['diver run up',{view:'comp',diverY:0.127,runFrames:150},5],
    ['balloon helium',{view:'comp',comp:'balloon'},6],['balloon hydrogen',{view:'comp',comp:'balloon',gas:'hydrogen'},6],['balloon hot air capped',{view:'comp',comp:'balloon',gas:'hotair',balV:2800,payload:300},6],['balloon grounded',{view:'comp',comp:'balloon',payload:2500},6],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>3&&oy>3){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
