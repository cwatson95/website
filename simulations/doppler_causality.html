<title>Doppler &amp; Causality &mdash; three boundaries a wave cannot cross</title>
<!--
  ===================================================================
  doppler_causality.html — Mach cone, Cherenkov cone, Rindler horizon
  ===================================================================

  One Huygens construction, three media, three causal boundaries.

  SOUND (c_s = 1).  A moving point source leaves expanding rings behind.
  Approaching c_s the forward wavelength (1 - v/c_s) -> 0 and the forward
  frequency diverges; past c_s the rings' envelope is the Mach cone,
  sin(mu) = c_s/v — a boundary in SPACE.  Outside it: silence (the
  emission-time quadratic has no real root); inside it: TWO arrivals per
  tick; ON it: the discriminant vanishes.  All three regimes asserted.

  CHERENKOV (c = 1, wave speed c/n).  The same drawing for a charge in a
  dielectric: the cone exists iff beta > 1/n, photons leave at
  cos(theta_c) = 1/(n beta), perpendicular to the shock front
  (theta_c + mu = 90 deg, asserted).  Thresholds from CODATA rest
  energies: water n = 1.33 -> electrons above 264.06 keV, muons above
  54.60 MeV.  The 1/lambda^2 Frank-Tamm weight is why the glow is blue.

  UNRUH (c = 1, R = c^2/a).  For light in vacuum the boundary cannot be
  crossed; accelerate instead and it moves into SPACETIME.  Constant
  proper acceleration rides x^2 - (ct)^2 = R^2, asymptotic to the null
  line x = ct: a Rindler horizon, always exactly c^2/a behind in the
  observer's own frame.  A photon from (t0, x0) catches the observer iff
  x0 - ct0 > 0, at ct* = (R^2 - b^2)/(2b) — closed form asserted against
  bisection.  The Minkowski vacuum, cut by the horizon, is a two-mode
  SQUEEZED state of left/right Rindler modes (tanh r = e^{-pi omega c/a});
  tracing out the far wedge gives sinh^2 r = 1/(e^{2 pi omega c/a} - 1) —
  the Planck curve, EXACTLY (identity asserted to 1e-12) — at
  T_U = hbar a / (2 pi c k_B).  At a = g that is 3.9766e-20 K; 1 K costs
  2.47e20 m/s^2 (CODATA, derive.py).

  WHAT IS MODELLED / CHOSEN
  -------------------------
  Huygens rings at emission ticks, not a PDE solve; n is dispersionless
  and the quoted n values (1.33 water, 1.31 ice, 1.5 heavy glass,
  1.000293 air) are conventional numbers, labelled as such; runs loop
  when the source leaves the window (said on canvas).

  NOT MODELLED
  ------------
  Nonlinear acoustics (a real boom is an N-wave), n(omega) dispersion,
  radiation reaction, Hawking radiation, or any radiation from a
  uniformly moving sub-threshold charge (there is none).

  Scaffold and the fix-carrying 2-D plot layer are the verbatim
  cart_pendulum.html extracts (via build_wave_fronts/extract.py,
  2026-08-14); the drift fixes are asserted here too.  Entirely 2-D.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* ================================================================== *
 *  the physics — Huygens rings, arrival counting, the cone as a       *
 *  discriminant surface, the Rindler horizon, the Planck = squeezing  *
 *  identity.  Every function mirrors build_doppler/derive.py and is   *
 *  pinned to its printed values in selfTest.                          *
 * ================================================================== */

/* -------------------------------------------------- rings (Huygens) */
/* source starts at x = 0 at t = 0, speed v; waves at speed cw; one ring
   per integer emission tick.  Sound: cw = 1.  Cherenkov: cw = 1/n.      */
function ringsAt(v,cw,t,K){
  const out=[];
  const nMax=Math.floor(t-1e-9);
  for(let n=Math.max(0,nMax-(K||26)+1);n<=nMax;n++)
    out.push({te:n, cx:v*n, r:cw*(t-n)});
  return out;
}
function coneExists(v,cw){ return v>cw; }
function machMu(v,cw){ return v>cw?Math.asin(cw/v):NaN; }
/* the upper cone edge is the line through the source with inward unit
   normal (sin mu, cos mu); its distance to ring te's centre must equal the
   ring's radius — the envelope touches EVERY ring (derive: 2e-15). */
function coneResidual(v,cw,t,te){
  const mu=machMu(v,cw);
  if(!isFinite(mu)) return NaN;
  return Math.abs(Math.sin(mu)*(v*te-v*t))-cw*(t-te);
}

/* -------------------------------------------------- arrival counting */
/* an on-axis observer receives ring te = n at t_arr = n + |x - v n|/cw.
   Closed floor/ceil counts for the two monotone branches (the pins), and
   a direct loop that just evaluates every candidate (the live counter);
   selfTest asserts the two agree. */
function arrivalsAhead(x,v,cw,t1,t2){        /* x > v t throughout window */
  const lo=Math.ceil((t1-x/cw)/(1-v/cw));
  const hi=Math.floor((t2-x/cw)/(1-v/cw));
  return {lo,hi,count:Math.max(0,hi-lo+1)};
}
function arrivalsBehind(x,v,cw,t1,t2){       /* x < 0 */
  const lo=Math.ceil((t1+x/cw)/(1+v/cw));
  const hi=Math.floor((t2+x/cw)/(1+v/cw));
  return {lo,hi,count:Math.max(0,hi-lo+1)};
}
function arrivalsWindowed(x,v,cw,t1,t2){     /* any regime, by inspection */
  let c=0;
  const nHi=Math.floor(t2);
  for(let n=Math.max(0,Math.floor(t1-Math.abs(x)/cw-2*t2));n<=nHi;n++){
    const ta=n+Math.abs(x-v*n)/cw;
    if(ta>=t1&&ta<=t2&&ta>=n) c++;
  }
  return c;
}

/* -------------------------------------------------- the discriminant */
/* emission times whose ring passes through (x,y) at time t:
   (v^2-cw^2) te^2 - 2(x v - cw^2 t) te + (x^2+y^2-cw^2 t^2) = 0.
   D < 0 outside the cone (silence), D = 0 ON it, D > 0 inside (TWO
   arrivals).  Subsonic: exactly one physical root. */
function branchRoots(x,y,v,cw,t){
  const A=v*v-cw*cw, B=-2*(x*v-cw*cw*t), C=x*x+y*y-cw*cw*t*t;
  if(Math.abs(A)<1e-12){
    const te=-C/B;                            /* v = cw: linear */
    return {D:NaN,roots:(isFinite(te)&&te>=0&&te<=t)?[te]:[]};
  }
  const D=B*B-4*A*C;
  if(D<0) return {D,roots:[]};
  const s=Math.sqrt(D);
  const cand=[(-B-s)/(2*A),(-B+s)/(2*A)];
  const roots=cand.filter(te=>te>=0&&te<=t).sort((p,q)=>p-q);
  return {D,roots};
}

/* -------------------------------------------------- cherenkov */
function thetaC(n,b){ return n*b>1?Math.acos(1/(n*b)):NaN; }
function gammaTh(n){ return n/Math.sqrt(n*n-1); }
function gammaOf(b){ return 1/Math.sqrt(1-b*b); }
function ftFactor(n,b){ return Math.max(0,1-1/(n*n*b*b)); }
/* CODATA rest energies in MeV and SI constants (scipy.constants, derive.py
   [2]/[3]; labelled literals, pinned in selfTest) */
const CODATA={me:0.51099895069, mmu:105.6583755, mp:938.27208943,
              hbar:1.05457181765e-34, c:299792458, kB:1.380649e-23,
              gn:9.80665};
const MEDIA_N=[{id:'water',name:'water 1.33',n:1.33},
               {id:'ice',name:'ice 1.31',n:1.31},
               {id:'glass',name:'heavy glass 1.5',n:1.5},
               {id:'air',name:'air 1.000293',n:1.000293}];
function nOf(id){ return MEDIA_N.filter(m=>m.id===id)[0].n; }

/* -------------------------------------------------- rindler */
function wlX(R,t){ return Math.sqrt(R*R+t*t); }
function vOfT(R,t){ return t/Math.sqrt(R*R+t*t); }
function vOfTau(R,tau){ return Math.tanh(tau/R); }
/* rightward photon from (t0,x0): catches iff b = x0 - t0 > 0, at
   t* = (R^2 - b^2)/(2b); b <= 0 -> the gap tends to -b and it NEVER
   arrives — the null line x = t is the horizon. */
function catchTime(R,t0,x0){
  const b=x0-t0;
  if(b<=0) return null;
  const ts=(R*R-b*b)/(2*b);
  return ts>=t0?ts:null;
}
function catchTimeBisect(R,t0,x0){
  const g=t=>wlX(R,t)-(x0+(t-t0));
  if(x0-t0<=0) return null;
  let lo=t0, hi=t0+4*R*R/Math.max(1e-9,x0-t0)+4*R;
  if(g(lo)<0) return t0;                       /* emitted at/inside */
  if(g(hi)>0) return null;
  for(let i=0;i<200;i++){
    const m=(lo+hi)/2;
    if(g(m)>0) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}
/* MCRF distance to the horizon: boost by eta = tau/R; the null line x = t
   maps to itself, so the distance is the observer's boosted x — exactly R
   at every tau (derive: 1, 1, 1). */
function horizonDistMCRF(R,tau){
  const e=tau/R, ch=Math.cosh(e), sh=Math.sinh(e);
  return R*ch*ch-R*sh*sh;
}

/* -------------------------------------------------- planck = squeezing */
/* Omega = 2 pi omega c / a.  Minkowski vacuum -> two-mode squeezed Rindler
   state with tanh r = e^{-Omega/2}; tracing the far wedge: sinh^2 r =
   1/(e^Omega - 1), the Planck curve, exactly. */
function nbarOf(Om){ return 1/Math.expm1(Om); }
function rOf(Om){ return Math.atanh(Math.exp(-Om/2)); }
function S_squeeze(r){
  const c2=Math.cosh(r)*Math.cosh(r), s2=Math.sinh(r)*Math.sinh(r);
  return c2*Math.log(c2)-(s2>0?s2*Math.log(s2):0);
}
function S_thermal(nb){
  return (nb+1)*Math.log(nb+1)-(nb>0?nb*Math.log(nb):0);
}
/* the CODATA ladder (derive.py [3]) */
const UNRUH={TUg:3.97660983872e-20, a1K:2.46608301989e20,
             aCMB:6.7200762292e20, aWake:1.75882000838e20,
             TWake:0.713203892242};
const ANCHORS=[
  {id:'g',   name:'a = g',          a:9.80665,         T:3.97660983872e-20},
  {id:'wake',name:'e in 1 GV/m',    a:1.75882000838e20,T:0.713203892242},
  {id:'k1',  name:'T = 1 K',        a:2.46608301989e20,T:1.0},
  {id:'cmb', name:'T = 2.725 K',    a:6.7200762292e20, T:2.725},
];

/* the pair tower: |<n,n|0_M>|^2 = (1 - e^-Om) e^{-n Om} — the geometric
   ladder the squeezed vacuum IS.  Its mean is EXACTLY the Planck nbar
   (asserted): the causal cut is paid for in pairs, rung by rung, the way a
   stretched QCD string snaps into a quark pair rather than yield a free
   quark — the bag-model analogy, and it is an analogy (Schwinger pair
   creation and string breaking are mathematical kin). */
function towerP(n,Om){ return (1-Math.exp(-Om))*Math.exp(-n*Om); }

/* the whole boom: the burst is emitted into N sectors and is GLOBALLY pure;
   a detector holding k sectors sees Page's exact average entanglement
   entropy  S = sum_{j=n+1}^{mn} 1/j - (m-1)/(2n),  m = 2^k, n = 2^(N-k)
   (Page 1993; proven Foong-Kanno/Sen; Monte-Carlo-validated in derive.py).
   S(0) = S(N) = 0: catch EVERYTHING and the state is pure again — the
   history is recoverable in principle.  In between, each early sector adds
   almost exactly one maximally-thermal bit: incoherent, and locally
   non-unitary, because the partners are elsewhere. */
const PAGE_N=12;
function pageS(k){                      /* entropy in NATS for k sectors */
  let m=Math.pow(2,Math.min(k,PAGE_N-k)),
      n=Math.pow(2,Math.max(k,PAGE_N-k));
  if(m<=1) return 0;
  let s=0;
  for(let j=n+1;j<=m*n;j++) s+=1/j;
  return s-(m-1)/(2*n);
}
function pageBits(k){ return pageS(k)/Math.LN2; }
/* holding ONE half of one pair (purity (1-lam)/(1+lam)) vs both (pure) */
function purityHalf(Om){ const lam=Math.exp(-Om); return (1-lam)/(1+lam); }

   ct = x_p with no local drama; its signals reach the runner at
   t* = (R^2-b^2)/(2b), diverging as t_e -> x_p.  The crossing is finite;
   the STORY of it, as told to the runner, takes forever. */

  if(view==='source') return WLD.margin/Math.max(0.05,st.vso);

/* -------------------------------------------------- the model */
function lazyC(obj,name,fn){
  let has=false,v;
  Object.defineProperty(obj,name,{get(){ if(!has){ v=fn(); has=true; } return v; },
                                  configurable:true});
}
function buildModel(){
  const st=ST, view=st.view;
  const M={view, t:st.t};
  M.tmod=st.t%tLoopOf(view,st);
  if(view==='source'||view==='doppler'){
    const v=st.vso;
    M.v=v; M.cw=1;
    M.mu=machMu(v,1);
    M.exists=coneExists(v,1);
    M.lamA=1-v; M.lamB=1+v;
    M.vd=Math.min(v,0.99);              /* the doppler dial stops at the wall */
    if(view==='source'){
      lazyC(M,'rings',()=>ringsAt(v,1,M.tmod,WLD.K));
      lazyC(M,'mics',()=>{
        const t2=M.tmod, t1=Math.max(0,t2-6), w=Math.max(1e-9,t2-t1);
        const cA=arrivalsWindowed(WLD.micA,v,1,t1,t2);
        const cB=arrivalsWindowed(WLD.micB,v,1,t1,t2);
        const bA=branchRoots(WLD.micA,0,v,1,t2);
        return {cA,cB,fA:cA/w,fB:cB/w,w,nA:bA.roots.length};
      });
    }
  }
  if(view==='cheren'){
    const n=nOf(st.med), b=st.beta;
    M.n=n; M.beta=b; M.cw=1/n;
    M.exists=coneExists(b,1/n);
    M.mu=machMu(b,1/n);
    M.thc=thetaC(n,b);
    M.betaTh=1/n;
    M.gTh=gammaTh(n);
    M.keTh={e:CODATA.me*(M.gTh-1), mu:CODATA.mmu*(M.gTh-1), p:CODATA.mp*(M.gTh-1)};
    M.keE=CODATA.me*(gammaOf(Math.min(b,0.99999))-1);
    M.ft=ftFactor(n,b);
    lazyC(M,'rings',()=>ringsAt(b,1/n,M.tmod,WLD.K));
  }
  if(view==='horizon'){
    const R=1/st.aH;
    M.R=R;
    M.th=Math.min(M.tmod,RIN.tEnd)*R;   /* coordinate time, scaled with R */
    M.xObs=wlX(R,M.th);
    M.vNow=vOfT(R,M.th);
    M.dHor=horizonDistMCRF(R,1.3*R);    /* = R, any tau */
    lazyC(M,'fleet',()=>FLEET.map(e=>{
      const t0=e.t0*R, x0=e.x0*R;
      const ts=catchTime(R,t0,x0);
      return {t0,x0,tag:e.tag,ts,caught:ts!==null&&ts<=M.th};
    }));
    lazyC(M,'probe',()=>{
      const xp=PROBE.xp*R;
      return {xp, tCross:xp,
        sig:PROBE.emits.map(te0=>{
          const te=te0*R, ts=catchTime(R,te,xp);
          return {te,ts,caught:ts!==null&&ts<=M.th};
        })};
    });
  }
  if(view==='boom'){
    const k=st.kCatch;
    M.k=k; M.frac=k/PAGE_N;
    M.Sk=pageBits(k);
    M.deficit=k<=PAGE_N/2?k-M.Sk:null;
    M.pure=(k===0||k===PAGE_N);
    lazyC(M,'pageCurve',()=>{
      const out=[];
      for(let kk=0;kk<=PAGE_N;kk++) out.push(pageBits(kk));
      return out;
    });
    M.pHalf=purityHalf(1);
  }
  if(view==='thermo'){
    const A=ANCHORS.filter(a=>a.id===st.anchor)[0];
    M.anchor=A;
    M.om1=A.a/(2*Math.PI*CODATA.c);     /* the Omega = 1 angular frequency */
    M.nbar1=nbarOf(1);
    M.r1=rOf(1);
    lazyC(M,'tower',()=>{
      const P=[];
      for(let n=0;n<8;n++) P.push(towerP(n,1));
      return P;
    });
  }
  return M;
}

  return '<span class="lhs">sin &#956; = c<sub>medium</sub>/v</span> &nbsp;·&nbsp; '
    +'<span class="lhs">cos &#952;<sub>c</sub> = 1/(n&#946;)</span> &nbsp;·&nbsp; '
    +'<span class="hl">x = ct</span>'
    +'<span class="sm">three media, three limits, one construction — and only '
    +'the vacuum&rsquo;s limit cannot be crossed.</span>';
}

function tagHTML(M){
  const t={source:'the source — rings, the barrier, and the boom',
    doppler:'the doppler — the collapse of the forward wavelength',
    cheren:'the cherenkov — the threshold written as a cone',
    horizon:'the horizon — light that never catches up',
    thermo:'the thermometer — the vacuum, squeezed and thermal',
    boom:'the whole boom — you only ever catch a sliver',
    three:'three boundaries — one construction'}[M.view];
  return '<b>'+t+'</b>';
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥'};
function plain(s){
  return String(s).replace(/&[a-zA-Z][a-zA-Z0-9]*;/g,
                           m=>ENTS[m]!==undefined?ENTS[m]:m)
                  .replace(/<\/?[a-zA-Z][^>]*>/g,'');
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range (sbs_sims.html).
   A canvas ctx.clip() would fix the browser but NOT the audit — the
   display-list recorder treats clip() as a no-op, so the captured geometry
   would still lie.  Crossings are interpolated so a clipped curve still meets
   the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const inY=y=>y>=ylo&&y<=yhi;
  let started=false;
  for(let i=0;i<n-1;i++){
    let x0=xs[i], y0=ys[i], x1=xs[i+1], y1=ys[i+1];
    if(!isFinite(x0)||!isFinite(y0)||!isFinite(x1)||!isFinite(y1)){
      started=false; continue; }
    const a=inY(y0), c=inY(y1);
    if(!a&&!c){ started=false; continue; }
    if(!a){
      const yc=y0<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x0=x0+(x1-x0)*t; y0=yc; started=false;
    }
    if(!c){
      const yc=y1<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x1=x0+(x1-x0)*t; y1=yc;
    }
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(!c) started=false;
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed (an untrained dream can fill the panel): draw no
     legend rather than a lying one — the caption names the colours */
  return null;
}


function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};
}
function sparseTicks(lo,hi,hpx){
  return ticksFor(lo,hi,hpx<90?2:(hpx<140?3:5));
}
/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));
  let fit=capFit(ctx,W,H,fullTxt,capW);
  if(fit.capY>=minTop) return {capY:fit.capY,txt:fullTxt,capW};
  fit=capFit(ctx,W,H,shortTxt,capW);
  return {capY:fit.capY,txt:shortTxt,capW};
}
function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];
}

/* ---- role colours: cyan = wavefronts/rings, green = the causal boundary
   (cone, horizon — THE object of this sim), magenta = the live thing
   (source, particle, observer, markers), orange = analytic reference /
   warnings (thresholds, closed curves, "never"). ---- */
const COL={ring:'#5ac8e0', bound:'#b8ec4c', live:'#cd35c4', ref:'#e8843a',
           dim:'#8b93a6', gridtx:'#6f7789', cher:'#7db8ff'};
const RO_W=310;

/* equal-aspect world mapping: ONE scale for both axes — a cone is a shape
   and a null line is 45 degrees, or it is a different picture (Known-bad) */
function worldMap(b,X0,X1,Y0,Y1){
  const s=Math.min(b.w/(X1-X0),b.h/(Y1-Y0));
  const cx=b.x+(b.w-s*(X1-X0))/2, cy=b.y+(b.h-s*(Y1-Y0))/2;
  return {s,
    X:x=>cx+(x-X0)*s,
    Y:y=>cy+(Y1-y)*s,
    inX:X=>X0+(X-cx)/s};
}
function ringStroke(ctx,mp,cx,r,col,alpha){
  ctx.strokeStyle=col; ctx.globalAlpha=alpha; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(mp.X(cx),mp.Y(0),r*mp.s,0,TAU); ctx.stroke();
  ctx.globalAlpha=1;
}
/* draw the ring fan + source + cone for either medium; returns the map */
function drawRingWorld(ctx,b,M,rings,v,cw,ringCol){
  const mp=worldMap(b,WLD.x0,WLD.x1,-WLD.ymax,WLD.ymax);
  frame(ctx,b,'#242a3a');
  ctx.save();
  ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  const t=M.tmod;
  for(const rg of rings)
    ringStroke(ctx,mp,rg.cx,rg.r,ringCol,0.16+0.7*(rg.te-rings[0].te+1)/rings.length);
  /* the envelope: two lines from the source at pi -+ mu */
  if(coneExists(v,cw)){
    const mu=machMu(v,cw), L=60;
    const sx=mp.X(v*t), sy=mp.Y(0);
    ctx.strokeStyle=COL.bound; ctx.lineWidth=2;
    for(const sgn of [1,-1]){
      ctx.beginPath(); ctx.moveTo(sx,sy);
      ctx.lineTo(sx-L*mp.s*Math.cos(mu),sy-sgn*L*mp.s*Math.sin(mu));
      ctx.stroke();
    }
  }
  /* the source */
  ctx.fillStyle=COL.live;
  ctx.beginPath(); ctx.arc(mp.X(v*t),mp.Y(0),5.5,0,TAU); ctx.fill();
  ctx.strokeStyle=COL.live; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(mp.X(v*t)+8,mp.Y(0));
  ctx.lineTo(mp.X(v*t)+26,mp.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mp.X(v*t)+26,mp.Y(0));
  ctx.lineTo(mp.X(v*t)+19,mp.Y(0)-4); ctx.moveTo(mp.X(v*t)+26,mp.Y(0));
  ctx.lineTo(mp.X(v*t)+19,mp.Y(0)+4); ctx.stroke();
  ctx.restore();
  return mp;
}

/* ================================================================== *
 *  view: the source — rings, the barrier, the boom                    *
 * ================================================================== */
function drawSource(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-96;
  const fit=fitCaption(ctx,W,H,
    M.v<1
    ?'Every ring was emitted one tick apart and expands at c_s. Ahead of the '
     +'source they crowd to λ₀(1 − v/c_s); behind they stretch. The two mics '
     +'COUNT arrivals (readout): push v → c_s and the ahead rate diverges '
     +'while the rings pile onto the source — the sound barrier. The run '
     +'loops when the source leaves the stage.'
    :(M.v===1
    ?'Exactly at c_s every ring passes through the source at this instant — '
     +'the pile-up is total, the forward wavelength is zero, and the counted '
     +'forward frequency has no limit. This caustic IS the sound barrier.'
    :'Past c_s the rings’ envelope is the Mach cone, sin μ = c_s/v. '
     +'Outside it the emission-time equation has no real solution — silence, '
     +'not faint sound. The ahead mic hears nothing, then the boom (the cone '
     +'crosses it), then two arrivals per tick. The run loops when the '
     +'source leaves the stage.'),
    'Rings crowd ahead; past c_s their envelope is the Mach cone.',
    colW,300);
  const b=box(colX,stageTop()+30,colW,Math.max(150,fit.capY-stageTop()-44));
  const mp=drawRingWorld(ctx,b,M,M.rings,M.v,1,COL.ring);
  /* the mics */
  for(const [xm,lab] of [[WLD.micA,'mic A (ahead)'],[WLD.micB,'mic B (behind)']]){
    const X=mp.X(xm), Y=mp.Y(0);
    ctx.fillStyle=COL.ref;
    ctx.beginPath(); ctx.moveTo(X,Y-7); ctx.lineTo(X-5,Y+5); ctx.lineTo(X+5,Y+5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(lab,X,Y+9);
  }
  if(M.exists){
    ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('outside the cone: silence (no solution)',b.x+10,b.y+10);
    ctx.fillText('inside: two arrivals per tick',b.x+10,b.y+26);
  }
  if(M.v===1){
    ctx.fillStyle=COL.bound; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('every ring passes through the source — the barrier',
                 b.x+10,b.y+10);
  }
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the doppler — the forward wavelength collapses               *
 * ================================================================== */
function drawDoppler(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-96;
  const vd=M.vd;
  const fit=fitCaption(ctx,W,H,
    'Left: the apparent wavelength λ(θ)/λ₀ = 1 − (v/c_s)cosθ around the '
    +'source (orange dashes: at rest). The forward lobe collapses to ZERO as '
    +'v → c_s while the backward lobe saturates at 2. Right: the received '
    +'frequency f/f₀ = 1/(1 − (v/c_s)cosθ) for the same dial — the forward '
    +'divergence is the barrier. The magenta observer rides the circle; both '
    +'panels mark it. Past c_s this dial has nothing to show ahead: see the '
    +'source view’s silent zone.',
    'λ(θ) collapses forward; f(θ) diverges — the barrier.',
    colW,300);
  const avail=fit.capY-stageTop()-44-34;   /* 34: tick row + x-label */
  /* side by side when the column allows; stacked when it does not */
  const stacked=colW<430;
  let bp,bf;
  if(!stacked){
    bp=box(colX,stageTop()+30,Math.min(colW*0.46,avail),Math.max(140,avail));
    bf=box(bp.x1+56,bp.y,colX+colW-bp.x1-56,Math.max(140,avail));
  }else{
    const hTop=Math.max(96,Math.round(avail*0.5));
    bp=box(colX,stageTop()+30,colW,hTop);
    bf=box(colX,bp.y1+42,colW,Math.max(80,avail-hTop-42));
  }
  /* polar panel */
  const mpp=worldMap(bp,-2.3,2.3,-2.3,2.3);
  frame(ctx,bp,'#242a3a');
  ctx.save(); ctx.beginPath(); ctx.rect(bp.x,bp.y,bp.w,bp.h); ctx.clip();
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  for(const rr of [0.5,1,1.5,2]){
    ctx.beginPath(); ctx.arc(mpp.X(0),mpp.Y(0),rr*mpp.s,0,TAU); ctx.stroke();
  }
  ctx.setLineDash([5,4]); ctx.strokeStyle=COL.ref;
  ctx.beginPath(); ctx.arc(mpp.X(0),mpp.Y(0),1*mpp.s,0,TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle=COL.bound; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<=180;i++){
    const th=Math.PI*i/90, lam=1-vd*Math.cos(th);
    const X=mpp.X(lam*Math.cos(th)), Y=mpp.Y(lam*Math.sin(th));
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
  }
  ctx.stroke();
  const phi=0.35*M.t%TAU;
  const lamPhi=1-vd*Math.cos(phi);
  ctx.fillStyle=COL.live;
  ctx.beginPath();
  ctx.arc(mpp.X(lamPhi*Math.cos(phi)),mpp.Y(lamPhi*Math.sin(phi)),4.5,0,TAU);
  ctx.fill();
  ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('λ(θ)/λ₀ around the source',bp.x+8,bp.y+6);
  ctx.fillText('v → ahead',bp.x+8,bp.y+22);
  ctx.restore();
  /* frequency panel */
  const fmax=Math.min(12,1/(1-vd)*1.15+0.5);
  axes(ctx,bf,0,180,0,fmax,{title:'received frequency',
    xlab:'θ from the velocity (deg)',ylab:'f/f₀',
    xticks:bf.w<300?[0,90,180]:[0,45,90,135,180],xfmt:x=>fmt(x,0),
    yticks:sparseTicks(0,fmax,bf.h)});
  const ths=new Float64Array(181), fs=new Float64Array(181);
  for(let i=0;i<=180;i++){ ths[i]=i; fs[i]=1/(1-vd*Math.cos(Math.PI*i/180)); }
  polyline(ctx,bf,ths,fs,0,180,0,fmax,COL.bound,1.8);
  polyline(ctx,bf,Float64Array.of(0,180),Float64Array.of(1,1),
           0,180,0,fmax,COL.ref,1,[5,4]);
  const phiDeg=Math.abs(((phi/Math.PI*180)%360)-180);
  const thMark=180-phiDeg;
  polyline(ctx,bf,Float64Array.of(thMark,thMark),Float64Array.of(0,fmax),
           0,180,0,fmax,rgba(COL.live,0.6),1,[3,4]);
  dotAtD(ctx,bf,thMark,1/(1-vd*Math.cos(thMark*Math.PI/180)),0,180,0,fmax,
         COL.live,4.5);
  if(1/(1-vd)>12){
    ctx.fillStyle=COL.ref; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('peak f/f₀ = '+fmt(1/(1-vd),0)+' — off this scale',
                 bf.x+8,bf.y+8);
  }
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}
function dotAtD(ctx,b,x,y,xlo,xhi,ylo,yhi,col,r){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  if(Y<b.y-2||Y>b.y1+2) return;
  ctx.beginPath(); ctx.arc(X,Y,r||4.5,0,TAU);
  ctx.fillStyle=col; ctx.fill();
}
/* ================================================================== *
 *  view: the cherenkov — the threshold written as a cone              *
 * ================================================================== */
function drawCheren(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-96;
  const fit=fitCaption(ctx,W,H,
    M.exists
    ?'The same construction in a dielectric: wavefronts at c/n = '
     +fmt(M.cw,4)+'c, the charge at β = '+fmt(M.beta,4)+'. The envelope is '
     +'the shock front (half-angle μ) and the LIGHT leaves perpendicular to '
     +'it, at cos θc = 1/(nβ) from the track — the blue arrows. Slide β '
     +'below 1/n and the cone, and the radiation, cease to exist. The run '
     +'loops when the charge leaves the stage.'
    :'Below threshold (β < 1/n = '+fmt(M.betaTh,3)+') the rings never '
     +'overlap: no envelope forms, no coherent wave survives, no light is '
     +'emitted. A uniformly moving charge below threshold simply does not '
     +'radiate — the causal boundary states the required velocity.',
    'The cone exists only above β = 1/n — that IS the threshold.',
    colW,300);
  const gaugeH=44;
  const b=box(colX,stageTop()+30,colW,
              Math.max(140,fit.capY-stageTop()-44-gaugeH-16));
  drawRingWorld(ctx,b,M,M.rings,M.beta,M.cw,COL.cher);
  /* photon arrows: perpendicular to the cone, at theta_c from the track */
  if(M.exists){
    const mp=worldMap(b,WLD.x0,WLD.x1,-WLD.ymax,WLD.ymax);
    const t=M.tmod, mu=M.mu, thc=M.thc;
    ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
    ctx.strokeStyle=COL.cher; ctx.fillStyle=COL.cher; ctx.lineWidth=1.8;
    for(const sgn of [1,-1]) for(const s of [6,11,16]){
      const px=M.beta*t-s*Math.cos(mu), py=sgn*s*Math.sin(mu);
      const dx=Math.cos(thc), dy=sgn*Math.sin(thc), L=2.2;
      const X0=mp.X(px), Y0=mp.Y(py), X1=mp.X(px+dx*L), Y1=mp.Y(py+dy*L);
      ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1); ctx.stroke();
      const ang=Math.atan2(Y1-Y0,X1-X0);
      ctx.beginPath(); ctx.moveTo(X1,Y1);
      ctx.lineTo(X1-7*Math.cos(ang-0.4),Y1-7*Math.sin(ang-0.4));
      ctx.lineTo(X1-7*Math.cos(ang+0.4),Y1-7*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }else{
    ctx.fillStyle=COL.ref; ctx.font='11.5px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('below threshold — no envelope, no radiation',
                 b.x+b.w/2,b.y+10);
  }
  /* the threshold gauge */
  const gb=box(colX+30,b.y1+14,colW-60,gaugeH-22);
  const bx=v=>gb.x+gb.w*(v-0.3)/0.7;
  ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(gb.x,gb.y+10); ctx.lineTo(gb.x1,gb.y+10); ctx.stroke();
  ctx.strokeStyle=COL.bound; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx(M.betaTh),gb.y+2);
  ctx.lineTo(bx(M.betaTh),gb.y+18); ctx.stroke();
  ctx.fillStyle=COL.bound; ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('threshold 1/n = '+fmt(M.betaTh,3),
               clamp(bx(M.betaTh),gb.x+56,gb.x1-56),gb.y+20);
  ctx.fillStyle=COL.live;
  ctx.beginPath(); ctx.arc(bx(M.beta),gb.y+10,5,0,TAU); ctx.fill();
  if(gb.w>230){
    ctx.fillStyle=COL.gridtx; ctx.textAlign='left';
    ctx.fillText('β = 0.3',gb.x-26,gb.y+20);
    ctx.textAlign='right'; ctx.fillText('1.0',gb.x1+22,gb.y+20);
  }
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the horizon — light that never catches up                    *
 * ================================================================== */
function drawHorizon(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-96;
  const R=M.R;
  const fit=fitCaption(ctx,W,H,
    'A spacetime diagram: light runs at 45°. The observer holds constant '
    +'proper acceleration, x² − (ct)² = R² with R = c²/a, forever '
    +'approaching — never reaching — the null line x = ct. Photons launched '
    +'from b = x₀ − ct₀ > 0 catch the worldline (closed form, marked); '
    +'photons from b ≤ 0 chase forever, their gap tending to |b|: that null '
    +'line is a HORIZON, and in the observer’s own frame it stays exactly '
    +'c²/a behind at every moment. The dim vertical line is a probe at '
    +'rest: the horizon sweeps past it at ct = 0.55R — finite, uneventful — '
    +'while its signals reach the runner at t* = 0.63, 1.88, 7.1, …, never. '
    +'The infinity is in the appearance. Speed is not the cause — unending '
    +'acceleration is.',
    'x² − (ct)² = R²: photons with x₀ − ct₀ ≤ 0 never arrive.',
    colW,320);
  const b=box(colX,stageTop()+30,colW,Math.max(160,fit.capY-stageTop()-44));
  const mp=worldMap(b,RIN.x0,RIN.x1,RIN.tmin,RIN.tmax);
  frame(ctx,b,'#242a3a');
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  /* axes through the origin */
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(mp.X(RIN.x0),mp.Y(0)); ctx.lineTo(mp.X(RIN.x1),mp.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mp.X(0),mp.Y(RIN.tmin)); ctx.lineTo(mp.X(0),mp.Y(RIN.tmax)); ctx.stroke();
  /* the horizon x = ct */
  ctx.setLineDash([7,5]); ctx.strokeStyle=COL.bound; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(mp.X(RIN.tmin),mp.Y(RIN.tmin));
  ctx.lineTo(mp.X(RIN.tmax),mp.Y(RIN.tmax)); ctx.stroke();
  ctx.setLineDash([]);
  /* the worldline */
  ctx.strokeStyle=COL.bound; ctx.lineWidth=2.2;
  ctx.beginPath();
  let first=true;
  for(let i=0;i<=140;i++){
    const tt=RIN.tmin+(RIN.tmax-RIN.tmin)*i/140;
    const X=mp.X(wlX(R,tt)),Y=mp.Y(tt);
    if(first){ ctx.moveTo(X,Y); first=false; } else ctx.lineTo(X,Y);
  }
  ctx.stroke();
  /* proper-time ticks */
  ctx.strokeStyle=rgba(COL.bound,0.8); ctx.lineWidth=1.4;
  for(let k=-2;k<=8;k++){
    const tt=R*Math.sinh(0.6*k);
    if(tt<RIN.tmin||tt>RIN.tmax) continue;
    const xx=wlX(R,tt);
    const nx=1/Math.hypot(1,tt/xx), ny=(tt/xx)/Math.hypot(1,tt/xx);
    ctx.beginPath();
    ctx.moveTo(mp.X(xx)-4*nx,mp.Y(tt)-4*ny);
    ctx.lineTo(mp.X(xx)+4*nx,mp.Y(tt)+4*ny);
    ctx.stroke();
  }
  /* the photon fleet — tags stagger vertically (same-t0 events would
     collide) and flip to the right when the left edge is near */
  const th=M.th;
  let fi=0;
  for(const f of M.fleet){
    fi++;
    if(th<f.t0) continue;
    const tEnd=f.ts!==null?Math.min(th,f.ts):th;
    ctx.strokeStyle=rgba(COL.ring,0.85); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(mp.X(f.x0),mp.Y(f.t0));
    ctx.lineTo(mp.X(f.x0+(tEnd-f.t0)),mp.Y(tEnd)); ctx.stroke();
    if(f.caught){
      ctx.fillStyle=COL.live;
      ctx.beginPath(); ctx.arc(mp.X(f.x0+(f.ts-f.t0)),mp.Y(f.ts),4.5,0,TAU);
      ctx.fill();
    }else{
      ctx.fillStyle=COL.ring;
      ctx.beginPath(); ctx.arc(mp.X(f.x0+(tEnd-f.t0)),mp.Y(tEnd),3,0,TAU);
      ctx.fill();
    }
    if(mp.s>40){       /* tags only when there is honestly room for them */
      ctx.fillStyle=f.ts===null?COL.ref:COL.gridtx;
      ctx.font='9.5px -apple-system, sans-serif';
      const dy=[-11,0,11][fi%3];
      /* rightmost events label to their RIGHT, into the empty half */
      if(f.x0<=1.2*M.R&&mp.X(f.x0)-b.x>110){
        ctx.textAlign='right'; ctx.textBaseline='middle';
        ctx.fillText(plain(f.tag),mp.X(f.x0)-6,mp.Y(f.t0)+dy);
      }else{
        ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(plain(f.tag),mp.X(f.x0)+7,mp.Y(f.t0)+dy);
      }
    }
  }
  /* the at-rest probe: the horizon sweeps past it at FINITE ct = x_p and it
     notices nothing — but its signals reach the runner ever later, and the
     one from the crossing never does.  The infinity is in the appearance. */
  const pr=M.probe;
  ctx.setLineDash([2,3]); ctx.strokeStyle=rgba(COL.live,0.5); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(mp.X(pr.xp),mp.Y(RIN.tmin));
  ctx.lineTo(mp.X(pr.xp),mp.Y(RIN.tmax)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=COL.ref;
  ctx.beginPath(); ctx.arc(mp.X(pr.xp),mp.Y(pr.tCross),4,0,TAU); ctx.fill();
  for(const g of pr.sig){
    if(th<g.te) continue;
    const tEnd=g.ts!==null?Math.min(th,g.ts):th;
    ctx.strokeStyle=rgba(COL.ring,0.5); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(mp.X(pr.xp),mp.Y(g.te));
    ctx.lineTo(mp.X(pr.xp+(tEnd-g.te)),mp.Y(tEnd)); ctx.stroke();
    if(g.caught){
      ctx.fillStyle=COL.live;
      ctx.beginPath(); ctx.arc(mp.X(pr.xp+(g.ts-g.te)),mp.Y(g.ts),3.5,0,TAU);
      ctx.fill();
    }
  }
  if(mp.s>40){
    ctx.fillStyle=COL.ref; ctx.font='9.5px -apple-system, sans-serif';
    ctx.textBaseline='top';
    const probeLab='probe — swallowed at ct = 0.55R';
    if(mp.X(pr.xp)-b.x>175){   /* left of the probe line, clear of the
                                  worldline's lower sweep */
      ctx.textAlign='right';
      ctx.fillText(probeLab,mp.X(pr.xp)-8,mp.Y(RIN.tmin)-14);
    }else{
      ctx.textAlign='left';
      ctx.fillText(probeLab,mp.X(pr.xp)+6,mp.Y(RIN.tmin)-14);
    }
  }
  /* the observer now */
  ctx.fillStyle=COL.live;
  ctx.beginPath(); ctx.arc(mp.X(M.xObs),mp.Y(th),5.5,0,TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('x = ct — the horizon',b.x+10,b.y+8);
  ctx.textAlign='right';
  ctx.fillText('x →',b.x1-8,b.y1-16);
  ctx.textAlign='left';
  ctx.fillText('ct ↑',b.x+8,b.y+24);
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the thermometer — the vacuum, squeezed and thermal           *
 * ================================================================== */
function drawThermo(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-96;
  const fit=fitCaption(ctx,W,H,
    'Left: the horizon splits spacetime into two wedges; the Minkowski '
    +'vacuum is a two-mode SQUEEZED state whose Rindler quanta come in '
    +'entangled pairs straddling x = ±ct (magenta). An accelerated observer '
    +'lives in one wedge: tracing out the partners leaves sinh²r = '
    +'1/(e^Ω − 1) — exactly the Planck curve on the right, Ω = 2πωc/a, '
    +'temperature T_U = ħa/2πck_B. The entropy of the visible half (orange) '
    +'is thermal entropy, digit for digit. Pick an anchor to see real '
    +'numbers — at a = g the vacuum glows at 4×10⁻²⁰ K.',
    'Squeezed pairs across the horizon; trace one out — Planck at T_U.',
    colW,320);
  const avail=Math.max(150,fit.capY-stageTop()-44-34);  /* xlab room */
  const bw=box(colX,stageTop()+30,Math.min(colW*0.44,avail),avail);
  const rightW=colX+colW-bw.x1-58;
  const towH=Math.min(118,Math.max(0,avail-184));
  const hasTow=towH>=64&&rightW>150;
  const bp=box(bw.x1+58,bw.y,rightW,hasTow?avail-towH-58:avail);
  const bTow=hasTow?box(bp.x,bp.y1+58,rightW,towH):null;
  /* the wedges */
  const mp=worldMap(bw,-2.4,2.4,-2.1,2.1);
  frame(ctx,bw,'#242a3a');
  ctx.save(); ctx.beginPath(); ctx.rect(bw.x,bw.y,bw.w,bw.h); ctx.clip();
  ctx.fillStyle=rgba(COL.bound,0.06);
  ctx.beginPath(); ctx.moveTo(mp.X(0),mp.Y(0));
  ctx.lineTo(mp.X(2.4),mp.Y(2.4)); ctx.lineTo(mp.X(2.4),mp.Y(-2.4));
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=rgba(COL.ref,0.05);
  ctx.beginPath(); ctx.moveTo(mp.X(0),mp.Y(0));
  ctx.lineTo(mp.X(-2.4),mp.Y(2.4)); ctx.lineTo(mp.X(-2.4),mp.Y(-2.4));
  ctx.closePath(); ctx.fill();
  ctx.setLineDash([6,5]); ctx.strokeStyle=COL.bound; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(mp.X(-2.4),mp.Y(-2.4)); ctx.lineTo(mp.X(2.4),mp.Y(2.4)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mp.X(-2.4),mp.Y(2.4)); ctx.lineTo(mp.X(2.4),mp.Y(-2.4)); ctx.stroke();
  ctx.setLineDash([]);
  /* the two hyperbolae */
  for(const sgn of [1,-1]){
    ctx.strokeStyle=sgn>0?COL.bound:rgba(COL.ref,0.7); ctx.lineWidth=1.8;
    ctx.beginPath();
    let first=true;
    for(let i=0;i<=80;i++){
      const tt=-1.9+3.8*i/80, xx=sgn*Math.sqrt(1+tt*tt);
      const X=mp.X(xx),Y=mp.Y(tt);
      if(first){ ctx.moveTo(X,Y); first=false; } else ctx.lineTo(X,Y);
    }
    ctx.stroke();
  }
  /* entangled pairs sliding out along arcs over the origin */
  for(let i=0;i<3;i++){
    const xi=0.9+0.5*i;
    const B=u=>{ const q=1-u;
      return [q*q*(-xi)+2*q*u*0+u*u*xi, q*q*0+2*q*u*(xi*0.85)+u*u*0]; };
    ctx.setLineDash([3,4]); ctx.strokeStyle=rgba(COL.live,0.5); ctx.lineWidth=1.2;
    ctx.beginPath();
    for(let k=0;k<=40;k++){
      const P=B(k/40), X=mp.X(P[0]), Y=mp.Y(P[1]);
      if(k===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.stroke(); ctx.setLineDash([]);
    const uu=(0.35*M.t+i*0.33)%1;
    for(const u of [0.5+0.48*uu,0.5-0.48*uu]){
      const P=B(u);
      ctx.fillStyle=COL.live;
      ctx.beginPath(); ctx.arc(mp.X(P[0]),mp.Y(P[1]),3.5,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
  if(bw.w>230){        /* the wedge captions need room to exist honestly */
    ctx.fillStyle=COL.gridtx; ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText('this wedge',bw.x1-8,bw.y+8);
    ctx.textAlign='left';
    ctx.fillText('beyond the horizon',bw.x+8,bw.y+8);
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('entangled Rindler pairs across x = ±ct',bw.x+bw.w/2,bw.y1-6);
  }
  /* the Planck panel */
  if(bp.w>140){
    const ymax=2.3;
    axes(ctx,bp,0,6,0,ymax,{title:'trace out the far wedge',
      xlab:'Ω = 2πωc/a',yticks:sparseTicks(0,ymax,bp.h),
      xticks:[0,2,4,6],xfmt:x=>fmt(x,0)});
    const n2=120, Os=new Float64Array(n2), nb=new Float64Array(n2),
          Ss=new Float64Array(n2);
    for(let i=0;i<n2;i++){
      Os[i]=0.08+5.92*i/(n2-1);
      nb[i]=nbarOf(Os[i]);
      Ss[i]=S_squeeze(rOf(Os[i]));
    }
    polyline(ctx,bp,Os,nb,0,6,0,ymax,COL.bound,2);
    polyline(ctx,bp,Os,Ss,0,6,0,ymax,COL.ref,1.6,[5,4]);
    dotAtD(ctx,bp,1,nbarOf(1),0,6,0,ymax,COL.live,4.5);
    legendAuto(ctx,bp,[[COL.bound,'n̄(Ω) = 1/(e^Ω−1) — Planck'],
                       [COL.ref,'S(Ω) — entanglement entropy']]);
  }
  /* the pair tower: the ladder the squeezed vacuum IS — rung under rung,
     geometric, mean exactly n̄ (the bag-model analogy made quantitative) */
  if(hasTow){
    axes(ctx,bTow,-0.5,7.5,0,0.72,{title:'the pair tower P(n) = (1−e^−Ω)e^−nΩ at Ω = 1',
      xticks:[0,2,4,6],xfmt:v=>fmt(v,0),xlab:'n pairs shared across the horizon',
      yticks:[0,0.6],yfmt:v=>fmt(v,1)});
    for(let n=0;n<8;n++){
      const P=M.tower[n];
      const X0=bTow.x+bTow.w*(n-0.28+0.5)/8;
      const Wb=bTow.w*0.56/8;
      const Hb=bTow.h*(P/0.72);
      ctx.fillStyle=shade(COL.bound,0.35+0.6*(P/0.72));
      ctx.fillRect(X0,bTow.y1-Hb,Wb,Hb);
    }
    ctx.fillStyle=COL.gridtx; ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText('mean = n̄ exactly — the cut is paid in pairs',
                 bTow.x1-6,bTow.y+5);
  }
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the whole boom — you only ever catch a sliver                *
 * ================================================================== */
function drawBoom(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-96;
  const fit=fitCaption(ctx,W,H,
    'The matter boom leaves the boundary in EVERY direction: the rose is '
    +'the whole matter wavefront, the green wedge is your detector. What '
    +'you catch carries Page’s exact entropy (right): each early sector '
    +'arrives looking maximally thermal — incoherent, and locally '
    +'non-unitary, because its partners flew elsewhere. Past half the '
    +'census the correlations finally surface, and at k = 12 the entropy '
    +'returns to ZERO: the whole boom is one pure state, invertible in '
    +'principle back to the localized point that made it. Model: one qubit '
    +'per sector, Haar-random global pure state (Page 1993; Monte-Carlo '
    +'checked in derive.py).',
    'Catch a sliver: thermal. Catch it all: pure — history recoverable.',
    colW,320);
  const avail=Math.max(150,fit.capY-stageTop()-44-34);
  const bR=box(colX,stageTop()+30,Math.min(colW*0.42,avail+34),avail+34);
  const bP=box(bR.x1+58,bR.y,colX+colW-bR.x1-58,avail);
  /* the rose */
  const mp=worldMap(bR,-1.15,1.15,-1.15,1.15);
  frame(ctx,bR,'#242a3a');
  ctx.save(); ctx.beginPath(); ctx.rect(bR.x,bR.y,bR.w,bR.h); ctx.clip();
  const DEL=2*Math.PI/PAGE_N, k=M.k;
  /* the caught wedge: sectors 0..k-1, anticlockwise from +x */
  if(k>0){
    ctx.fillStyle=rgba(COL.bound,0.12);
    ctx.beginPath(); ctx.moveTo(mp.X(0),mp.Y(0));
    for(let i2=0;i2<=24*k/PAGE_N;i2++){
      const th=i2*(k*DEL)/(24*k/PAGE_N);
      ctx.lineTo(mp.X(1.04*Math.cos(th)),mp.Y(1.04*Math.sin(th)));
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=COL.bound; ctx.lineWidth=2.4;
    ctx.beginPath();
    for(let i2=0;i2<=24;i2++){
      const th=i2*(k*DEL)/24;
      const X=mp.X(1.06*Math.cos(th)),Y=mp.Y(1.06*Math.sin(th));
      if(i2===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.stroke();
  }
  /* expanding pulses — the boom, over and over */
  for(const ph of [0,0.33,0.66]){
    const rr=((0.35*M.t+ph)%1)*1.02;
    if(rr<0.03) continue;
    ctx.strokeStyle=rgba(COL.ring,0.55*(1-rr)); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(mp.X(0),mp.Y(0),rr*mp.s,0,TAU); ctx.stroke();
  }
  /* sector arrows: caught ones bright */
  for(let i2=0;i2<PAGE_N;i2++){
    const th=(i2+0.5)*DEL;
    const caught=i2<k;
    const col=caught?COL.bound:rgba(COL.ring,0.45);
    const x0=0.2*Math.cos(th),y0=0.2*Math.sin(th);
    const x1=0.92*Math.cos(th),y1=0.92*Math.sin(th);
    ctx.strokeStyle=col; ctx.lineWidth=caught?2:1.2;
    ctx.beginPath(); ctx.moveTo(mp.X(x0),mp.Y(y0));
    ctx.lineTo(mp.X(x1),mp.Y(y1)); ctx.stroke();
    const ang=Math.atan2(mp.Y(y1)-mp.Y(y0),mp.X(x1)-mp.X(x0));
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(mp.X(x1),mp.Y(y1));
    ctx.lineTo(mp.X(x1)-7*Math.cos(ang-0.4),mp.Y(y1)-7*Math.sin(ang-0.4));
    ctx.lineTo(mp.X(x1)-7*Math.cos(ang+0.4),mp.Y(y1)-7*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
  }
  /* the localized point that boomed */
  ctx.fillStyle=COL.live;
  ctx.beginPath(); ctx.arc(mp.X(0),mp.Y(0),4.5,0,TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('the matter wavefront — emitted everywhere',bR.x+8,bR.y+6);
  if(k>0){
    ctx.fillStyle=COL.bound; ctx.textBaseline='bottom';
    ctx.fillText('your detector: '+String(k)+' of '+String(PAGE_N)+' sectors',
                 bR.x+8,bR.y1-8);
  }
  /* Page's curve */
  if(bP.w>150){
    axes(ctx,bP,0,12,0,6.6,{title:'Page’s curve — entropy of the caught part',
      xlab:'sectors caught k',ylab:'S (bits)',
      xticks:[0,3,6,9,12],xfmt:v=>fmt(v,0),
      yticks:[0,2,4,6],yfmt:v=>fmt(v,0)});
    const ks=new Float64Array(13), ss=new Float64Array(13),
          tr=new Float64Array(13);
    for(let kk=0;kk<=12;kk++){
      ks[kk]=kk; ss[kk]=M.pageCurve[kk]; tr[kk]=Math.min(kk,12-kk);
    }
    polyline(ctx,bP,ks,tr,0,12,0,6.6,COL.ref,1.2,[5,4]);
    polyline(ctx,bP,ks,ss,0,12,0,6.6,COL.bound,2);
    for(let kk=0;kk<=12;kk++)
      dotAtD(ctx,bP,kk,ss[kk],0,12,0,6.6,COL.bound,2.5);
    dotAtD(ctx,bP,M.k,M.Sk,0,12,0,6.6,COL.live,5.5);
    legendAuto(ctx,bP,[[COL.bound,'S(k) — Page, exact'],
                       [COL.ref,'maximally thermal: min(k, N−k)']]);
  }
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: three boundaries — one construction                          *
 * ================================================================== */
function drawThree(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-96;
  const fit=fitCaption(ctx,W,H,
    'The same Huygens drawing three times. Sound and light-in-water have '
    +'beatable limits: the boundary is a cone trailing the source, and '
    +'crossing the limit is allowed — it just makes a boom, or a blue glow. '
    +'Light in vacuum cannot be beaten: the boundary rotates into spacetime '
    +'as the light cone, and an observer who keeps accelerating carries a '
    +'horizon and feels the vacuum as heat — the third boom is matter, '
    +'apparently born at the wall. One ladder, three rungs.',
    'Two crossable cones; one uncrossable horizon.',
    colW,300);
  const ladderH=58;
  const availH=Math.max(130,fit.capY-stageTop()-44-ladderH-12);
  const gap=22, bw3=Math.floor((colW-2*gap)/3);
  const titles=bw3>190
    ?['sound — crossable','light in water — crossable',
      'light in vacuum — a horizon']
    :['sound','light in water','light in vacuum'];
  const boxes=[];
  for(let i=0;i<3;i++)
    boxes.push(box(colX+i*(bw3+gap),stageTop()+30,bw3,availH));
  /* A: sonic, B: cherenkov */
  const cfgs=[[1.4,1,COL.ring],[0.9,1/1.33,COL.cher]];
  for(let i=0;i<2;i++){
    const [v,cw,col]=cfgs[i], b=boxes[i];
    const tl=WLD.margin/1.4, tt=(2.2*M.t)%tl;
    const mp=worldMap(b,-3,25,-9.5,9.5);
    frame(ctx,b,'#242a3a');
    ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
    for(const rg of ringsAt(v,cw,tt,14))
      ringStroke(ctx,mp,rg.cx,rg.r,col,0.15+0.7*(rg.te-Math.max(0,Math.floor(tt)-14)+1)/14);
    if(coneExists(v,cw)){
      const mu=machMu(v,cw), sx=mp.X(v*tt), sy=mp.Y(0);
      ctx.strokeStyle=COL.bound; ctx.lineWidth=1.8;
      for(const sgn of [1,-1]){
        ctx.beginPath(); ctx.moveTo(sx,sy);
        ctx.lineTo(sx-40*mp.s*Math.cos(mu),sy-sgn*40*mp.s*Math.sin(mu));
        ctx.stroke();
      }
    }
    ctx.fillStyle=COL.live;
    ctx.beginPath(); ctx.arc(mp.X(v*tt),mp.Y(0),4,0,TAU); ctx.fill();
    ctx.restore();
  }
  /* C: rindler mini */
  {
    const b=boxes[2], R=1;
    const mp=worldMap(b,-0.1,4.4,-0.5,4.1);
    frame(ctx,b,'#242a3a');
    ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
    const tt=(0.9*M.t)%4.3;
    ctx.setLineDash([6,5]); ctx.strokeStyle=COL.bound; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(mp.X(-0.5),mp.Y(-0.5));
    ctx.lineTo(mp.X(4.1),mp.Y(4.1)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle=COL.bound; ctx.lineWidth=1.8;
    ctx.beginPath();
    let first=true;
    for(let i=0;i<=80;i++){
      const t2=-0.5+4.6*i/80, X=mp.X(wlX(R,t2)), Y=mp.Y(t2);
      if(first){ ctx.moveTo(X,Y); first=false; } else ctx.lineTo(X,Y);
    }
    ctx.stroke();
    for(const f of [{t0:0,x0:0.35},{t0:0.9,x0:0.55}]){
      if(tt<f.t0) continue;
      const ts=catchTime(R,f.t0,f.x0);
      const tEnd=ts!==null?Math.min(tt,ts):tt;
      ctx.strokeStyle=rgba(COL.ring,0.85); ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(mp.X(f.x0),mp.Y(f.t0));
      ctx.lineTo(mp.X(f.x0+(tEnd-f.t0)),mp.Y(tEnd)); ctx.stroke();
      ctx.fillStyle=ts!==null&&tt>=ts?COL.live:COL.ring;
      ctx.beginPath(); ctx.arc(mp.X(f.x0+(tEnd-f.t0)),mp.Y(tEnd),3,0,TAU);
      ctx.fill();
    }
    ctx.fillStyle=COL.live;
    ctx.beginPath(); ctx.arc(mp.X(wlX(R,tt)),mp.Y(tt),4,0,TAU); ctx.fill();
    ctx.restore();
  }
  if(bw3>=120){
    ctx.font='italic 12px Georgia, serif'; ctx.fillStyle='#aeb6c6';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    for(let i=0;i<3;i++) ctx.fillText(titles[i],boxes[i].x,boxes[i].y-6);
  }
  /* the ladder of limits */
  const lb=box(colX+20,boxes[0].y1+22,colW-40,ladderH-30);
  const lg=v=>lb.x+lb.w*(Math.log10(v)-2.3)/(8.75-2.3);
  ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(lb.x,lb.y+12); ctx.lineTo(lb.x1,lb.y+12); ctx.stroke();
  const RUNGS=[[343,'sound in air — 343 m/s','below'],
               [2.254e8,'c/n water — 2.25×10⁸','below'],
               [2.998e8,'c — 3.00×10⁸ (exact: 299 792 458)','above']];
  ctx.font='10px -apple-system, sans-serif';
  for(const [vv,lab,side] of RUNGS){
    ctx.strokeStyle=COL.bound; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(lg(vv),lb.y+5); ctx.lineTo(lg(vv),lb.y+19);
    ctx.stroke();
    if(lb.w>430){
      ctx.fillStyle=COL.gridtx;
      ctx.textAlign=vv>1e8?'right':'left';
      ctx.textBaseline=side==='below'?'top':'bottom';
      ctx.fillText(plain(lab),lg(vv)+(vv>1e8?-4:4),
                   side==='below'?lb.y+22:lb.y+2);
    }
  }
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[];
  POLY_SEGS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='source') drawSource(ctx,W,H,M);
  else if(M.view==='doppler') drawDoppler(ctx,W,H,M);
  else if(M.view==='cheren') drawCheren(ctx,W,H,M);
  else if(M.view==='horizon') drawHorizon(ctx,W,H,M);
  else if(M.view==='thermo') drawThermo(ctx,W,H,M);
  else if(M.view==='boom') drawBoom(ctx,W,H,M);
  else drawThree(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){
    const ctx=canvas.getContext('2d');
    drawView(ctx,S.W,S.H,buildModel());
  };
  S.step=function(){
    if(!ST.anim) return false;
    ST.t+=0.016*ST.speed*rateFor(ST.view);
    return true;
  };
  S.pointer=function(){ return false; };   /* no view reads the pointer */
  return S;
}
/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k; st.t=0;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
    syncChips(); syncPanel(); refresh();
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',
      onclick:()=>setView(k)},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }
  const clockReset=()=>{ st.t=0; };

  const gSrc=h('div',{class:'grp'},h('h3',null,'the source'));
  const sonChips=chipRow(SONPRE,'vso',clockReset);
  gSrc.appendChild(sonChips);
  trackChips(gSrc,SONPRE,'vso');
  gSrc.appendChild(slider('vso','v / c_s',0.05,1.6,0.01,v=>fmt(v,2),clockReset));
  const srcTag=h('div',{class:'tag'}); gSrc.appendChild(srcTag);

  const gMed=h('div',{class:'grp'},h('h3',null,'the medium'));
  const medChips=chipRow(MEDIA_N,'med',clockReset);
  gMed.appendChild(medChips);
  trackChips(gMed,MEDIA_N,'med');
  gMed.appendChild(slider('beta','β = v/c',0.3,0.9999,0.0001,v=>fmt(v,4),clockReset));
  const medTag=h('div',{class:'tag'}); gMed.appendChild(medTag);

  const gObs=h('div',{class:'grp'},h('h3',null,'the observer'));
  gObs.appendChild(slider('aH','acceleration a',0.5,2,0.05,v=>fmt(v,2),clockReset));
  const ancChips=chipRow(ANCHORS,'anchor',null);
  gObs.appendChild(ancChips);
  trackChips(gObs,ANCHORS,'anchor');
  gObs.appendChild(slider('kCatch','sectors caught',0,12,1,
    v=>fmt(v,0)+' / 12',null));
  const obsTag=h('div',{class:'tag'}); gObs.appendChild(obsTag);

  const gRun=h('div',{class:'grp'},h('h3',null,'the run'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('anim','time runs')));
  gRun.appendChild(slider('speed','speed',0.1,4,0.1,v=>fmt(v,1)+'×'));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ st.t=0; dirty=true; refresh(); }},'restart clock'),
    h('button',{onclick:()=>{ const v=st.view;
      Object.assign(st,DEFAULTS); st.view=v; st.t=0;
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'CODATA rest energies and constants via '
      +'scipy.constants (build_doppler/derive.py, pinned); the n values are '
      +'conventional numbers and say so; everything else is exact closed-form '
      +'geometry, mirrored in derive.py and asserted here.'}));
  [gSrc,gMed,gObs,gRun,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++)
          if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>
            b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view;
    gSrc.hidden=!(v==='source'||v==='doppler');
    gMed.hidden=(v!=='cheren');
    gObs.hidden=!(v==='horizon'||v==='thermo'||v==='boom');
    rows.aH.row.hidden=(v!=='horizon');
    ancChips.hidden=(v!=='thermo');
    rows.kCatch.row.hidden=(v!=='boom');
    for(const k in rows) rows[k].sync();
    srcTag.innerHTML=v==='doppler'
      ?'the doppler dial reads the slider but stops at 0.99 — the wall itself '
       +'lives in <b>the source</b>'
      :'changing v restarts the run';
    medTag.innerHTML='threshold β = 1/n — watch the cone die as you cross it';
    obsTag.innerHTML=v==='horizon'
      ?'a in units of c²/x&#8320;: bigger a hugs the horizon tighter'
      :v==='boom'
      ?'slide the census — watch thermal become pure'
      :'anchors are CODATA numbers — the readout translates';
    runTag.innerHTML='space runs/pauses &nbsp; <b>r</b> restarts the clock '
      +'&nbsp; 1&ndash;7 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='source'||st.view==='cheren'
        ?'the run loops when the source leaves the stage · space pauses'
        :st.view==='boom'
        ?'slide the census from a sliver to everything · space pauses'
        :'space runs · r restarts the clock · 1–7 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ st.t=0; dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%10===0) roEl.innerHTML=readoutHTML(S.model());
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

      cases.push({view:'cheren',med:m},{view:'cheren',med:m,beta:0.6},
                 {view:'cheren',med:m,beta:0.9999});
    cases.push({view:'horizon',aH:0.5},{view:'horizon',aH:2},
               {view:'thermo',anchor:'wake'},{view:'thermo',anchor:'cmb'},
               {view:'thermo',anchor:'k1'},
               {view:'boom',kCatch:0},{view:'boom',kCatch:3},
               {view:'boom',kCatch:6},{view:'boom',kCatch:12});
    for(const so of cases){
      for(const t of [0,13.7,47.3]){
        Object.assign(ST,DEFAULTS,so,{t});
        let html='';
        try{
          const M=buildModel();
          html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
          if(M.view==='source'&&(!isFinite(M.mics.fA)||!isFinite(M.mics.fB))) bad++;
          if(M.view==='horizon'&&!isFinite(M.xObs)) bad++;
        }catch(e){ bad++; note=String(e); }
        if(html.indexOf('NaN')>=0||html.indexOf('Infinity')>=0){ bad++;
          note='NaN/Infinity at '+JSON.stringify(so); }
      }
    }
    ok(bad===0,'model+readout clean over '+cases.length*3
      +' state combinations '+note); }

  /* ---- 10. defaults reach the regime each view exists to show ---- */
  ok(DEFAULTS.beta>1/1.33,'cherenkov opens ABOVE threshold (the cone shows)');
  ok(0.3<0.6&&0.6<1/1.33,'the slider reaches the sub-threshold regime');
  ok(SONPRE.map(p2=>p2.id).join()==='0.5,0.95,1,1.4',
     'sonic presets cover sub / near / AT / super');
  { Object.assign(ST,DEFAULTS,{view:'doppler',vso:1.4});
    ok(buildModel().vd===0.99,'the doppler dial stops at 0.99, and says so'); }
  close(rateFor('horizon'),0.9,1e-12,'the horizon runs at 0.9x wall pace');

  /* ---- 11. layout: every view x size, off-canvas / collisions ---- */
  { const sizes=[[1400,820],[1100,712],[820,560],[560,380]];
    const states=[
      {view:'source',vso:0.8,t:13.7},{view:'source',vso:0.95,t:13.7},
      {view:'source',vso:1.0,t:13.7},{view:'source',vso:1.4,t:17.3},
      {view:'doppler',vso:0.5,t:3},{view:'doppler',vso:0.95,t:3},
      {view:'cheren',med:'water',beta:0.9,t:13.7},
      {view:'cheren',med:'water',beta:0.6,t:13.7},
      {view:'cheren',med:'air',beta:0.9999,t:13.7},
      {view:'horizon',aH:1,t:3.3},{view:'horizon',aH:0.5,t:3.3},
      {view:'horizon',aH:2,t:3.3},
      {view:'thermo',anchor:'g',t:2.2},{view:'thermo',anchor:'cmb',t:2.2},
      {view:'boom',kCatch:3,t:2.2},{view:'boom',kCatch:12,t:2.2},
      {view:'boom',kCatch:0,t:2.2},
      {view:'three',t:6.1},
    ];
    let badText=0,badOverlap=0,badEnt=0,note='';
    /* floors follow what THIS file emits: a ring is ONE stroke, so a young
       run is ~25 ops and still a real picture */
    const FLOORS={source:22,doppler:25,cheren:22,horizon:22,thermo:18,
                  boom:30,three:35};
    for(const [W,H] of sizes){
      for(const so of states){
        Object.assign(ST,DEFAULTS,so);
        const M=buildModel();
        const R=recCtxTest(W,H);
        let threw=null;
        try{ drawView(R.c,W,H,M); }catch(e){ threw=e; }
        ok(!threw,'drawView('+so.view+') at '+W+'x'+H
          +' draws without throwing'+(threw?': '+threw:''));
        if(threw) continue;
        ok(R.ops.n>=FLOORS[so.view],'view '+so.view+' emits a real picture ('
          +R.ops.n+' ops at '+W+'x'+H+')');
        for(const tx of R.texts){
          if(/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/.test(tx.t)){ badEnt++;
            note='entity: "'+tx.t.slice(0,40)+'"'; }
          if(tx.rot) continue;
          const b2=textBoxTest(tx);
          if(b2.x0<-2||b2.x1>W+2||b2.y0<-2||b2.y1>H+2){ badText++;
            if(badText<=10) console.log('  off-canvas: "'+tx.t.slice(0,36)
              +'" at '+fmt(b2.x0,0)+','+fmt(b2.y0,0)+' in '+so.view+'@'+W+'x'+H); }
        }
        const unrot=R.texts.filter(t2=>!t2.rot);
        for(let i=0;i<unrot.length;i++) for(let j=i+1;j<unrot.length;j++){
          const A2=textBoxTest(unrot[i]), B2=textBoxTest(unrot[j]);
          const wo=Math.min(A2.x1,B2.x1)-Math.max(A2.x0,B2.x0);
          const ho=Math.min(A2.y1,B2.y1)-Math.max(A2.y0,B2.y0);
          if(wo>3&&ho>3){ badOverlap++;
            if(badOverlap<=12) console.log('  overlap: "'+unrot[i].t.slice(0,26)
              +'" vs "'+unrot[j].t.slice(0,26)+'" in '+so.view+'@'+W+'x'+H); }
        }
        for(const L2 of LEGEND_RECTS){
          for(let s2=0;s2<POLY_SEGS.length;s2+=4){
            const x0=POLY_SEGS[s2],y0=POLY_SEGS[s2+1],
                  x1=POLY_SEGS[s2+2],y1=POLY_SEGS[s2+3];
            if(Math.max(x0,x1)<L2.x||Math.min(x0,x1)>L2.x+L2.w||
               Math.max(y0,y1)<L2.y||Math.min(y0,y1)>L2.y+L2.h) continue;
            badOverlap++;
            if(note==='') note='curve through legend in '+so.view;
            break;
          }
        }
      }
    }
    ok(badEnt===0,'no entity/tag reaches a canvas text op ('+badEnt+') '+note);
    ok(badText===0,'no text leaves the canvas at any size ('+badText+')');
    ok(badOverlap===0,'no text collisions, no curve through a legend ('
      +badOverlap+')'); }

  /* ---- leave the page exactly as a fresh boot expects it ---- */
  Object.assign(ST,DEFAULTS);

  console.log(pass+' passed, '+fail+' failed  ('
    +((Date.now()-T0)/1000).toFixed(1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}
/* the recording context + text-box helpers the layout sweep uses */
function recCtxTest(W,H){
  const st2={font:'10px x',stack:[],tx:0,ty:0,rot:0};
  const texts=[],ops={n:0};
  const c={
    canvas:{width:W,height:H},
    save(){ st2.stack.push([st2.tx,st2.ty,st2.rot]); },
    restore(){ const s=st2.stack.pop(); if(s){ st2.tx=s[0]; st2.ty=s[1]; st2.rot=s[2]; } },
    translate(x,y){ st2.tx+=x; st2.ty+=y; },
    rotate(a){ st2.rot+=a; },
    setTransform(){}, scale(){}, setLineDash(){},
    beginPath(){}, moveTo(){}, lineTo(){}, closePath(){}, arc(){}, rect(){},
    fill(){ ops.n++; }, stroke(){ ops.n++; },
    clip(){}, fillRect(){ ops.n++; }, strokeRect(){ ops.n++; }, clearRect(){},
    fillText(t,x,y){ ops.n++;
      const m=/(\d+(?:\.\d+)?)px/.exec(c.font||'10px x');
      const px=m?parseFloat(m[1]):10;
      texts.push({t:String(t),x:st2.tx+x,y:st2.ty+y,px,
                  w:String(t).length*px*0.52,
                  align:c.textAlign||'left',base:c.textBaseline||'alphabetic',
                  rot:Math.abs(st2.rot)>1e-9}); },
    strokeText(){}, measureText(t){
      const m=/(\d+(?:\.\d+)?)px/.exec(c.font||'10px x');
      return {width:String(t).length*(m?parseFloat(m[1]):10)*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  c.font='10px x'; c.textAlign='left'; c.textBaseline='alphabetic';
  c.fillStyle='#000'; c.strokeStyle='#000'; c.lineWidth=1; c.globalAlpha=1;
  c.lineJoin='miter'; c.lineCap='butt';
  return {c,texts,ops};
}
function textBoxTest(tx){
  let x0=tx.x;
  if(tx.align==='center') x0-=tx.w/2;
  else if(tx.align==='right'||tx.align==='end') x0-=tx.w;
  let y0=tx.y;
  if(tx.base==='middle') y0-=tx.px/2;
  else if(tx.base==='alphabetic'||tx.base==='bottom') y0-=tx.px;
  return {x0,y0,x1:x0+tx.w,y1:y0+tx.px};
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  /* mutate.py reads the EXIT CODE (Known-bad): selfTest throws on failure */
  selfTest();
}
