<title>Cart &amp; Pendulum &mdash; swing-up on a rail</title>
<!--
  ===================================================================
  cart_pendulum.html  —  a cart on a rail, a pendulum on the cart
  ===================================================================

  A block (the cart) slides on a horizontal rail, x in [-L, L].  From its
  centre hangs a rigid pendulum — ONE link by default, TWO links whenever
  you ask (the engine is written for n links and asserted for n = 1 and 2).
  Shove the cart back and forth and the pivot's acceleration pumps energy
  into the swing; time it right and the pendulum goes over the top.  Then
  hand the same job to the machines: an energy-pumping swing-up law and an
  LQR balance controller whose gains are solved LIVE in the page from a
  Riccati equation, so they stay correct when you move the mass sliders.

  WHAT IS EXACT
  -------------
  * The dynamics.  Euler-Lagrange for q = [x, th_1..th_n], angles from
    UPRIGHT, with closed-form mass matrix and force terms
        kappa_j = m_j a_j + l_j sum_{i>j} m_i,
        mu_jj   = m_j a_j^2 + l_j^2 sum_{i>j} m_i,  mu_jk = l_j kappa_k,
    for links that are uniform RODS (a = l/2, J = m l^2/12) or point BOBS
    (a = l, J = 0) — a chip switches the model.  The closed forms are
    verified THREE independent ways in selfTest():
      (1) a numerical Euler-Lagrange residual — finite differences of the
          implemented Lagrangian itself, which never saw the algebra —
          at random states (FD-noise floor ~1e-4 on O(1)-O(10) terms; a
          wrong sign or coefficient sits at O(1));
      (2) energy conservation to ~1e-13 over 12 000 RK4 steps, undamped;
      (3) the upright linearization against textbook closed forms for
          n = 1 (both rod and bob), to 12 digits.
  * The integrator: fixed-step RK4 at dt = 1/1200 s, bit-parity with
    build_cart/gen_cart.py (a Python twin in identical operation order,
    Gaussian elimination included) at trajectory checkpoints.
  * The LQR gains: an in-page Riccati-ODE solver, asserted against
    scipy.linalg.solve_continuous_are (residual < 1e-6, gain parity, and
    the closed loop actually catches the pendulum).

  WHAT IS MODELLED / CHOSEN
  -------------------------
  * The rail ends are stiff spring-dampers (k = 4000 N/m, c = 60 N s/m) —
    a real hard stop is non-smooth; this one is honest about compliance
    (the cart parks ~3 mm into the wall under full force) and only ever
    REMOVES energy, which is asserted.
  * The swing-up law is the classic energy-pumping form
    F = sat(kE (E - E_up) thd cos th) plus a soft cart-centering PD, with
    a handoff to LQR near the top; constants (16, 4, 6, Fmax 14 N) were
    tuned once in Python and frozen — from hanging it hands off at
    t = 1.738 s and balances.  It is written for ONE link; nobody's
    ten-line law swings up a double pendulum, and the file says so.
  * "PID (angle only)" is DELIBERATELY flawed: it regulates the angle and
    ignores the cart, so the cart random-walks into the wall — the lesson
    (asserted!) is why the balance problem needs the full state.
  * The double pendulum is chaotic: the twins view starts two copies
    1e-9 apart and shows the separation growing ~exponentially.  No claim
    of a precise Lyapunov exponent is made — the fitted slope is labelled
    as a finite-time estimate.

  NOT MODELLED
  ------------
  * Friction on the rail (a slider adds JOINT damping only), motor
    dynamics, backlash, 3-D effects, flexible links.

  Scaffold and the (fully fix-carrying) 2-D plot layer come from
  build_neural/ (2026-08-12), which consolidated the sbs_sims +
  standard_candle + drum_head helper fixes; they are asserted here too.
  No 3-D camera — the sim is entirely 2-D.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* ================================================================== *
 *  the engine — n-link cart-pendulum dynamics, integrator, control    *
 *                                                                     *
 *  Every function mirrors build_cart/gen_cart.py in the SAME          *
 *  operation order (scalar loops, the same partial-pivot Gaussian     *
 *  elimination, the same RK4), which is what makes the Python-printed *
 *  trajectory checkpoints assertable at ~1e-12 tolerances.            *
 *  Angles are measured FROM UPRIGHT: th = 0 is up, th = pi hangs.     *
 * ================================================================== */
const GRAV=9.81, DT=1/1200;
/* house PRNG — used only to generate the random test states in selfTest */
function mulberry32(seed){ let a=seed>>>0;
  return function(){ a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296; }; }
const KWALL=4000, CWALL=60;
const QD1=[8,60,4,12], QD2=[10,120,120,4,18,18], RU=1;
const KE_SU=16, KX_SU=4, KV_SU=6;
const CATCH_TH=0.35, CATCH_TD=1.8;

function makeParams(n,kind,M,m1,l1,m2,l2){
  const ms=[m1,m2].slice(0,n), ls=[l1,l2].slice(0,n);
  const aa=[],JJ=[];
  for(let i=0;i<n;i++){
    if(kind==='bob'){ aa.push(ls[i]); JJ.push(0); }
    else { aa.push(ls[i]/2); JJ.push(ms[i]*ls[i]*ls[i]/12); }
  }
  return {n,kind,M,m:ms,l:ls,a:aa,J:JJ,g:GRAV};
}
function coeffs(P){
  const n=P.n, kap=new Array(n).fill(0);
  const mu=[];
  for(let j=0;j<n;j++) mu.push(new Array(n).fill(0));
  for(let j=0;j<n;j++){
    let tail=0;
    for(let i=j+1;i<n;i++) tail+=P.m[i];
    kap[j]=P.m[j]*P.a[j]+P.l[j]*tail;
    mu[j][j]=P.m[j]*P.a[j]*P.a[j]+P.l[j]*P.l[j]*tail;
  }
  for(let j=0;j<n;j++) for(let k=j+1;k<n;k++)
    mu[j][k]=mu[k][j]=P.l[j]*kap[k];
  return {kap,mu};
}
function massmat(P,th){
  const n=P.n, {kap,mu}=coeffs(P), d=n+1;
  const Mm=[];
  for(let r=0;r<d;r++) Mm.push(new Array(d).fill(0));
  Mm[0][0]=P.M;
  for(const m of P.m) Mm[0][0]+=m;
  for(let j=0;j<n;j++){
    Mm[0][j+1]=Mm[j+1][0]=kap[j]*Math.cos(th[j]);
    for(let k=0;k<n;k++) Mm[j+1][k+1]=mu[j][k]*Math.cos(th[j]-th[k]);
    Mm[j+1][j+1]+=P.J[j];
  }
  return Mm;
}
function rhsQ(P,th,thd,F,cdamp){
  const n=P.n, {kap,mu}=coeffs(P);
  const b=new Array(n+1).fill(0);
  b[0]=F;
  for(let j=0;j<n;j++){
    b[0]+=kap[j]*Math.sin(th[j])*thd[j]*thd[j];
    let s=kap[j]*P.g*Math.sin(th[j]);
    for(let k=0;k<n;k++)
      s-=mu[j][k]*Math.sin(th[j]-th[k])*thd[k]*thd[k];
    const rel=thd[j]-(j>0?thd[j-1]:0);
    s-=cdamp*rel;
    if(j+1<n) s+=cdamp*(thd[j+1]-thd[j]);
    b[j+1]=s;
  }
  return b;
}
/* Gaussian elimination with partial pivoting — parity with gen_cart.py */
function solveLin(A,b){
  const d=b.length, M2=[];
  for(let i=0;i<d;i++) M2.push(A[i].slice().concat([b[i]]));
  for(let c=0;c<d;c++){
    let p=c;
    for(let r=c+1;r<d;r++) if(Math.abs(M2[r][c])>Math.abs(M2[p][c])) p=r;
    const tmp=M2[c]; M2[c]=M2[p]; M2[p]=tmp;
    const piv=M2[c][c];
    for(let r=c+1;r<d;r++){
      const f=M2[r][c]/piv;
      for(let k=c;k<=d;k++) M2[r][k]-=f*M2[c][k];
    }
  }
  const x=new Array(d).fill(0);
  for(let r=d-1;r>=0;r--){
    let s=M2[r][d];
    for(let k=r+1;k<d;k++) s-=M2[r][k]*x[k];
    x[r]=s/M2[r][r];
  }
  return x;
}
function wallForce(x,xd,L){
  if(x>L) return -KWALL*(x-L)-CWALL*xd;
  if(x<-L) return -KWALL*(x+L)-CWALL*xd;
  return 0;
}
/* y = [x, th..., xd, thd...] */
function derivY(P,y,F,cdamp,L){
  const n=P.n;
  const th=y.slice(1,1+n), xd=y[1+n], thd=y.slice(2+n,2+2*n);
  const Ft=F+wallForce(y[0],xd,L);
  const qdd=solveLin(massmat(P,th),rhsQ(P,th,thd,Ft,cdamp));
  const out=new Array(2*(n+1));
  out[0]=xd;
  for(let j=0;j<n;j++) out[1+j]=thd[j];
  for(let j=0;j<=n;j++) out[1+n+j]=qdd[j];
  return out;
}
function rk4Step(P,y,F,cdamp,L,dt){
  const d=y.length;
  const k1=derivY(P,y,F,cdamp,L);
  const y2=new Array(d);
  for(let i=0;i<d;i++) y2[i]=y[i]+0.5*dt*k1[i];
  const k2=derivY(P,y2,F,cdamp,L);
  const y3=new Array(d);
  for(let i=0;i<d;i++) y3[i]=y[i]+0.5*dt*k2[i];
  const k3=derivY(P,y3,F,cdamp,L);
  const y4=new Array(d);
  for(let i=0;i<d;i++) y4[i]=y[i]+dt*k3[i];
  const k4=derivY(P,y4,F,cdamp,L);
  const out=new Array(d);
  for(let i=0;i<d;i++) out[i]=y[i]+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
  return out;
}
/* RK4 with an AUGMENTED energy ledger: work, wall loss and damping loss are
   integrated as extra states by the same RK4 stages, so the identity
   E - E0 = W - wall - damp holds to integrator truncation (~1e-9), not to a
   midpoint approximation that a bang-bang force or the stiff wall breaks.
   The y-part arithmetic is IDENTICAL to rk4Step, so trajectories stay
   bit-compatible with the Python twin. */
function ledgerPowers(P,y,F,cdamp,L){
  const n=P.n, xd=y[1+n];
  const wf=wallForce(y[0],xd,L);
  let dp=0;
  for(let j=0;j<n;j++){
    const rl=y[2+n+j]-(j>0?y[2+n+j-1]:0);
    dp+=rl*rl;
  }
  return [F*xd,-wf*xd,cdamp*dp];
}
function rk4StepLedger(P,y,F,cdamp,L,dt){
  const d=y.length;
  const k1=derivY(P,y,F,cdamp,L), p1=ledgerPowers(P,y,F,cdamp,L);
  const y2=new Array(d);
  for(let i=0;i<d;i++) y2[i]=y[i]+0.5*dt*k1[i];
  const k2=derivY(P,y2,F,cdamp,L), p2=ledgerPowers(P,y2,F,cdamp,L);
  const y3=new Array(d);
  for(let i=0;i<d;i++) y3[i]=y[i]+0.5*dt*k2[i];
  const k3=derivY(P,y3,F,cdamp,L), p3=ledgerPowers(P,y3,F,cdamp,L);
  const y4=new Array(d);
  for(let i=0;i<d;i++) y4[i]=y[i]+dt*k3[i];
  const k4=derivY(P,y4,F,cdamp,L), p4=ledgerPowers(P,y4,F,cdamp,L);
  const out=new Array(d);
  for(let i=0;i<d;i++) out[i]=y[i]+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
  const led=[0,1,2].map(i=>dt/6*(p1[i]+2*p2[i]+2*p3[i]+p4[i]));
  return {y:out,dW:led[0],dWall:led[1],dDamp:led[2]};
}
function kineticOf(P,y){
  const n=P.n, {kap,mu}=coeffs(P);
  const th=y.slice(1,1+n), xd=y[1+n], thd=y.slice(2+n,2+2*n);
  let T=0.5*Mm00(P)*xd*xd;
  for(let j=0;j<n;j++){
    T+=kap[j]*Math.cos(th[j])*xd*thd[j];
    T+=0.5*P.J[j]*thd[j]*thd[j];
    for(let k=0;k<n;k++)
      T+=0.5*mu[j][k]*Math.cos(th[j]-th[k])*thd[j]*thd[k];
  }
  return T;
}
function Mm00(P){ let s=P.M; for(const m of P.m) s+=m; return s; }
function potentialOf(P,y){
  const n=P.n, {kap}=coeffs(P);
  let V=0;
  for(let j=0;j<n;j++) V+=P.g*kap[j]*Math.cos(y[1+j]);
  return V;
}
function energyOf(P,y){ return kineticOf(P,y)+potentialOf(P,y); }
function lagrangianOf(P,y){ return kineticOf(P,y)-potentialOf(P,y); }
/* the pendulum's own energy, measured in the cart's instantaneous frame:
   strike the cart velocity out of the state.  For n = 1 this equals the
   controller's 0.5(mu+J)thd^2 + g kap cos th — asserted as an identity. */
function pendEnergy(P,y){
  const y2=y.slice();
  y2[1+P.n]=0;
  return energyOf(P,y2);
}
function eUpright(P){
  const {kap}=coeffs(P);
  let s=0;
  for(const k of kap) s+=P.g*k;
  return s;
}
/* the independent check: finite differences of the IMPLEMENTED Lagrangian
   must reproduce the closed-form EOM (Q = [F,0..], no damping, no walls) */
function elResidual(P,y,F){
  const n=P.n, d=n+1, h=1e-6, ht=1e-5;
  const ydot=derivY(P,y,F,0,1e9);
  function dLdqd(state){
    const out=[];
    for(let i=0;i<d;i++){
      const yp=state.slice(); yp[1+n+i]+=h;
      const ym=state.slice(); ym[1+n+i]-=h;
      out.push((lagrangianOf(P,yp)-lagrangianOf(P,ym))/(2*h));
    }
    return out;
  }
  const ya=y.map((v,i)=>v+ht*ydot[i]);
  const yb=y.map((v,i)=>v-ht*ydot[i]);
  const da=dLdqd(ya), db=dLdqd(yb);
  let worst=0;
  for(let i=0;i<d;i++){
    const dtd=(da[i]-db[i])/(2*ht);
    const y1=y.slice(); y1[i]+=h;
    const y2=y.slice(); y2[i]-=h;
    const dq=(lagrangianOf(P,y1)-lagrangianOf(P,y2))/(2*h);
    const Q=i===0?F:0;
    worst=Math.max(worst,Math.abs(dtd-dq-Q));
  }
  return worst;
}
function wrapAngle(t){ return Math.atan2(Math.sin(t),Math.cos(t)); }

/* ---- linearization about upright (numeric, same as gen_cart.py) ---- */
function linearize(P,cdamp){
  const n=P.n, d=2*(n+1), h=1e-6;
  const y0=new Array(d).fill(0);
  const A=[];
  for(let r=0;r<d;r++) A.push(new Array(d).fill(0));
  for(let i=0;i<d;i++){
    const yp=y0.slice(); yp[i]+=h;
    const ym=y0.slice(); ym[i]-=h;
    const fp=derivY(P,yp,0,cdamp,1e9), fm=derivY(P,ym,0,cdamp,1e9);
    for(let r=0;r<d;r++) A[r][i]=(fp[r]-fm[r])/(2*h);
  }
  const fp=derivY(P,y0,h,cdamp,1e9), fm=derivY(P,y0,-h,cdamp,1e9);
  const B=[];
  for(let r=0;r<d;r++) B.push((fp[r]-fm[r])/(2*h));
  return {A,B};
}
/* ---- small dense matrix helpers (row-major arrays of rows) ---- */
function matMul(A,B){
  const r=A.length, c=B[0].length, m=B.length, out=[];
  for(let i=0;i<r;i++){
    const row=new Array(c).fill(0);
    for(let k=0;k<m;k++){
      const a=A[i][k];
      if(a===0) continue;
      for(let j=0;j<c;j++) row[j]+=a*B[k][j];
    }
    out.push(row);
  }
  return out;
}
function matT(A){
  const out=[];
  for(let j=0;j<A[0].length;j++){
    const row=[];
    for(let i=0;i<A.length;i++) row.push(A[i][j]);
    out.push(row);
  }
  return out;
}
/* Solve the CARE by integrating  Pdot = A'P + PA - P B R^-1 B' P + Q  to its
   steady state.  For a stabilizable pair this flow converges; convergence is
   CHECKED (residual), never assumed, and callers must look at .ok. */
function solveCARE(A,B,qdiag,r){
  const d=A.length;
  const Bt=[B.slice()];               /* 1 x d */
  const Bc=B.map(v=>[v]);             /* d x 1 */
  const At=matT(A);
  let Pm=[];
  for(let i=0;i<d;i++){
    Pm.push(new Array(d).fill(0));
    Pm[i][i]=qdiag[i];
  }
  const dtr=5e-4;
  let ok=false, iter=0, res=Infinity;
  function pdot(Pc){
    const t1=matMul(At,Pc), t2=matMul(Pc,A);
    const PB=matMul(Pc,Bc);                       /* d x 1 */
    const out=[];
    for(let i=0;i<d;i++){
      const row=new Array(d);
      for(let j=0;j<d;j++)
        row[j]=t1[i][j]+t2[i][j]-PB[i][0]*PB[j][0]/r+(i===j?qdiag[i]:0);
      out.push(row);
    }
    return out;
  }
  for(iter=0;iter<80000;iter++){
    const k1=pdot(Pm);
    let mx=0;
    for(let i=0;i<d;i++) for(let j=0;j<d;j++) mx=Math.max(mx,Math.abs(k1[i][j]));
    res=mx;
    if(mx<1e-9){ ok=true; break; }
    const P2=[];
    for(let i=0;i<d;i++){
      const row=new Array(d);
      for(let j=0;j<d;j++) row[j]=Pm[i][j]+0.5*dtr*k1[i][j];
      P2.push(row);
    }
    const k2=pdot(P2);
    for(let i=0;i<d;i++) for(let j=0;j<d;j++) Pm[i][j]+=dtr*k2[i][j];
    /* keep it exactly symmetric or roundoff slowly skews the flow */
    for(let i=0;i<d;i++) for(let j=i+1;j<d;j++){
      const v=0.5*(Pm[i][j]+Pm[j][i]);
      Pm[i][j]=Pm[j][i]=v;
    }
  }
  const K=new Array(d).fill(0);
  for(let j=0;j<d;j++){
    let s=0;
    for(let i=0;i<d;i++) s+=B[i]*Pm[i][j];
    K[j]=s/r;
  }
  return {P:Pm,K,ok,res,iter};
}
function careResidual(A,B,qdiag,r,Pm){
  const d=A.length, At=matT(A);
  const t1=matMul(At,Pm), t2=matMul(Pm,A);
  const Bc=B.map(v=>[v]);
  const PB=matMul(Pm,Bc);
  let mx=0;
  for(let i=0;i<d;i++) for(let j=0;j<d;j++){
    const v=t1[i][j]+t2[i][j]-PB[i][0]*PB[j][0]/r+(i===j?qdiag[i]:0);
    mx=Math.max(mx,Math.abs(v));
  }
  return mx;
}

/* ---- controllers ---- */
function swingupF(P,y,Fmax){
  const n=P.n, {kap,mu}=coeffs(P);
  const th=y[1], thd=y[2+n];
  const Ep=0.5*(mu[0][0]+P.J[0])*thd*thd+P.g*kap[0]*Math.cos(th);
  const Et=P.g*kap[0];
  const F=KE_SU*(Ep-Et)*thd*Math.cos(th)-KX_SU*y[0]-KV_SU*y[1+n];
  return Math.max(-Fmax,Math.min(Fmax,F));
}
function lqrF(K,P,y,Fmax){
  const n=P.n;
  let u=0;
  u-=K[0]*y[0];
  for(let j=0;j<n;j++) u-=K[1+j]*wrapAngle(y[1+j]);
  u-=K[1+n]*y[1+n];
  for(let j=0;j<n;j++) u-=K[2+n+j]*y[2+n+j];
  return Math.max(-Fmax,Math.min(Fmax,u));
}
function nearUpright(P,y){
  const n=P.n;
  for(let j=0;j<n;j++){
    if(Math.abs(wrapAngle(y[1+j]))>=CATCH_TH) return false;
    if(Math.abs(y[2+n+j])>=CATCH_TD) return false;
  }
  return true;
}
/* PID on the angle ALONE — deliberately incomplete (the lesson).
   Sign: +th leans toward +x, so the cart must accelerate in +x to drive the
   pivot back under the pendulum — F = +kp th + kd thd (matches the LQR row,
   whose K[1] is negative in u = -K s). */
function pidF(pid,P,y,Fmax,dt){
  const th=wrapAngle(y[1]), thd=y[2+P.n];
  pid.i+=th*dt;
  return Math.max(-Fmax,Math.min(Fmax,pid.kp*th+pid.kd*thd+pid.ki*pid.i));
}

/* ================================================================== *
 *  state, the live session, and the per-view model                    *
 *  Every number a panel prints is computed here or in the engine —    *
 *  never inside a draw call.  Heavy fields (gains, basin map,         *
 *  separatrix) hide behind lazy getters with parameter-keyed caches.  *
 * ================================================================== */
const TABS=[['rail','the rail'],['energy','the energy'],['phase','the phase plane'],
            ['ctrl','the controller'],['double','the double'],['map','the map']];
const CTRL_LIST=[{id:'manual',name:'you drive'},{id:'swing',name:'energy swing-up'},
                 {id:'lqr',name:'LQR balance'},{id:'pid',name:'PID (angle only)'},
                 {id:'off',name:'free'}];
const LINK_LIST=[{id:1,name:'single'},{id:2,name:'double'}];
const KIND_LIST=[{id:'rod',name:'uniform rod'},{id:'bob',name:'point bob'}];
const PID_KP=42, PID_KD=9, PID_KI=14;
const HOLD_GOAL=3;                     /* seconds upright = "balanced!" */

const DEFAULTS={
  view:'rail', n:1, kind:'rod', ctrl:'manual',
  M:1.0, m1:0.35, l1:0.9, m2:0.25, l2:0.6,
  damp:0, Fmax:14, L:1.6,
  speed:1, running:true, showTrail:true, showForce:true,
};
const ST=Object.assign({},DEFAULTS);

function paramsOf(st){ return makeParams(st.n,st.kind,st.M,st.m1,st.l1,st.m2,st.l2); }
function paramKey(st){
  return [st.n,st.kind,st.M,st.m1,st.l1,st.m2,st.l2,st.damp].join('|');
}

/* ---------------- the one live simulation session -------------------- */
function hangingY(n){
  const y=new Array(2*(n+1)).fill(0);
  for(let j=0;j<n;j++) y[1+j]=Math.PI-0.001;
  return y;
}
function simNew(st){
  return {
    P:paramsOf(st),
    y:hangingY(st.n),
    t:0, F:0, mode:'pump',            /* swing-up internal state */
    drag:null,                        /* pointer target x while dragging */
    key:0,                            /* -1/0/+1 from arrow keys */
    pid:{kp:PID_KP,kd:PID_KD,ki:PID_KI,i:0},
    E0:0, work:0, wallLoss:0, dampLoss:0, holdT:0, bestHold:0,
    hist:{t:[],F:[],x:[],th:[],E:[],W:[],td:[]},
    trail:[],                         /* tip positions for the ribbon */
    histEvery:4, histCount:0,
  };
}
function simStampE0(sim){ sim.E0=energyOf(sim.P,sim.y); }
function simReset(sim,st,upright){
  sim.P=paramsOf(st);
  sim.y=upright?uprightY(st.n):hangingY(st.n);
  sim.t=0; sim.F=0; sim.mode='pump'; sim.pid.i=0;
  sim.work=0; sim.wallLoss=0; sim.dampLoss=0; sim.holdT=0;
  sim.E0=energyOf(sim.P,sim.y);
  sim.hist={t:[],F:[],x:[],th:[],E:[],W:[],td:[]};
  sim.trail=[]; sim.histCount=0;
}
function uprightY(n){
  const y=new Array(2*(n+1)).fill(0);
  for(let j=0;j<n;j++) y[1+j]=0.06*(j+1);   /* a small, catchable lean */
  return y;
}
function tipPos(P,y){
  const n=P.n;
  let px=y[0], py=0;
  for(let j=0;j<n;j++){
    px+=P.l[j]*Math.sin(y[1+j]);
    py+=P.l[j]*Math.cos(y[1+j]);
  }
  return [px,py];
}

/* gains cache, keyed on the physical parameters */
const GAINS_CACHE={};
function gainsFor(st){
  const key=paramKey(st);
  if(!GAINS_CACHE[key]){
    const P=paramsOf(st);
    const {A,B}=linearize(P,st.damp);
    const qd=st.n===1?QD1:QD2;
    const sol=solveCARE(A,B,qd,RU);
    sol.resid=careResidual(A,B,qd,RU,sol.P);
    sol.A=A; sol.B=B;
    GAINS_CACHE[key]=sol;
  }
  return GAINS_CACHE[key];
}

function controllerF(sim,st,dt){
  const P=sim.P, n=P.n;
  if(st.ctrl==='off') return 0;
  if(st.ctrl==='manual'){
    if(sim.drag!==null){
      const F=120*(sim.drag-sim.y[0])-18*sim.y[1+n];
      return Math.max(-2*st.Fmax,Math.min(2*st.Fmax,F));
    }
    return sim.key*st.Fmax;
  }
  if(st.ctrl==='pid') return pidF(sim.pid,P,sim.y,st.Fmax,dt);
  const g=gainsFor(st);
  if(!g.ok) return 0;                          /* honest: no gains, no force */
  if(st.ctrl==='lqr') return lqrF(g.K,P,sim.y,st.Fmax);
  /* energy swing-up (single link only), with LQR handoff */
  if(n!==1) return 0;
  if(sim.mode==='pump'&&nearUpright(P,sim.y)) sim.mode='lqr';
  if(sim.mode==='lqr') return lqrF(g.K,P,sim.y,st.Fmax);
  return swingupF(P,sim.y,st.Fmax);
}

function simAdvance(sim,st,steps){
  const P=sim.P, n=P.n;
  for(let s=0;s<steps;s++){
    const F=controllerF(sim,st,DT);
    sim.F=F;
    /* the ledger rides INSIDE the RK4 stages (rk4StepLedger), so
       E(t)-E(0) = work - wallLoss - dampLoss holds to integrator truncation
       and is ASSERTED in selfTest — a bang-bang force or the stiff wall
       broke the naive midpoint version by ~0.1 J (found by the suite) */
    const st4=rk4StepLedger(P,sim.y,F,st.damp,st.L,DT);
    sim.y=st4.y;
    sim.t+=DT;
    sim.work+=st4.dW;
    sim.wallLoss+=st4.dWall;
    sim.dampLoss+=st4.dDamp;
    /* upright hold timer (all links) */
    let up=true;
    for(let j=0;j<n;j++)
      if(Math.abs(wrapAngle(sim.y[1+j]))>0.12||Math.abs(sim.y[2+n+j])>0.8) up=false;
    sim.holdT=up?sim.holdT+DT:0;
    if(sim.holdT>sim.bestHold) sim.bestHold=sim.holdT;
    if(++sim.histCount>=sim.histEvery){
      sim.histCount=0;
      const H=sim.hist;
      H.t.push(sim.t); H.F.push(F); H.x.push(sim.y[0]);
      H.th.push(wrapAngle(sim.y[1])); H.E.push(energyOf(P,sim.y));
      H.W.push(sim.work); H.td.push(sim.y[2+n]);
      if(H.t.length>3600)
        for(const k2 in H) H[k2]=H[k2].filter((_,i)=>i%2===0||i>=H[k2].length-8);
      sim.trail.push(tipPos(P,sim.y));
      if(sim.trail.length>420) sim.trail.shift();
    }
  }
}

/* twin session for the chaos view: two copies 1e-9 apart, force-free */
function twinsNew(st){
  const P=makeParams(2,st.kind,st.M,st.m1,st.l1,st.m2,st.l2);
  /* top link horizontal, lower link folded UP: the most chaotic of the
     five release states probed (lam ~ 1.6/s, doubling every 0.43 s).  The
     bound low-energy state first tried here was quasi-regular and the twins
     never separated — found by the suite. */
  const y0=[0,Math.PI/2,Math.PI,0,0,0];
  const y1=y0.slice();
  y1[1]+=1e-9;
  return {P,ya:y0.slice(),yb:y1,t:0,sep:[],last:0};
}
function twinsAdvance(tw,st,steps){
  for(let s=0;s<steps;s++){
    tw.ya=rk4Step(tw.P,tw.ya,0,st.damp,st.L,DT);
    tw.yb=rk4Step(tw.P,tw.yb,0,st.damp,st.L,DT);
    tw.t+=DT;
    if(tw.t-tw.last>=1/60){
      tw.last=tw.t;
      let s2=0;
      for(let i=0;i<tw.ya.length;i++){
        const d=tw.ya[i]-tw.yb[i];
        s2+=d*d;
      }
      tw.sep.push([tw.t,Math.sqrt(s2)]);
      if(tw.sep.length>1800) tw.sep.shift();
    }
  }
}

/* basin of the LQR catch, on a (th, thd) grid from x = xd = 0.
   Computed at a COARSER dt (1/240) than the live sim — it is a map, not a
   trajectory, and the caption says so.  Cached per parameter key, and filled
   PROGRESSIVELY (budgeted cells per call) so entering the view never
   freezes the page; the frame loop keeps pumping until the fill is done. */
const BASIN={key:null,grid:null,nx:44,ny:28,cell:0,run:0};
function basinCellCaught(P,g,st,th,td){
  const dtb=1/240;
  let y=P.n===2?[0,th,th,0,td,td]:[0,th,0,td];
  for(let s=0;s<Math.round(6/dtb);s++){
    const F=lqrF(g.K,P,y,st.Fmax);
    y=rk4Step(P,y,F,st.damp,st.L,dtb);
  }
  for(let q=0;q<P.n;q++)
    if(Math.abs(wrapAngle(y[1+q]))>0.05||Math.abs(y[2+P.n+q])>0.15) return 0;
  return Math.abs(y[0])<st.L?1:0;
}
function basinCompute(st,budget){
  const key=paramKey(st)+'|F'+st.Fmax+'|L'+st.L;
  if(BASIN.key!==key){
    BASIN.key=key;
    BASIN.grid=new Uint8Array(BASIN.nx*BASIN.ny);
    BASIN.cell=0;
    BASIN.run++;
  }
  const nx=BASIN.nx, ny=BASIN.ny, total=nx*ny;
  const g=gainsFor(st);
  if(!g.ok){ BASIN.cell=total; return BASIN; }   /* honest: no gains, no map */
  let left=budget===undefined?260:budget;
  while(BASIN.cell<total&&left>0){
    const i=Math.floor(BASIN.cell/ny), j=BASIN.cell%ny;
    const th=-Math.PI+(i+0.5)*(2*Math.PI/nx);
    const td=-6+(j+0.5)*(12/ny);
    BASIN.grid[BASIN.cell]=basinCellCaught(paramsOf(st),g,st,th,td);
    BASIN.cell++; left--;
  }
  return BASIN;
}
function basinDone(){ return BASIN.grid!==null&&BASIN.cell>=BASIN.nx*BASIN.ny; }

/* ---------------- session registry ---------------------------------- */
const SIM={live:null,twins:null};
function resetLive(upright){
  if(!SIM.live){ SIM.live=simNew(ST); simStampE0(SIM.live); }
  else simReset(SIM.live,ST,upright);
}
function resetTwins(){ SIM.twins=twinsNew(ST); }
resetLive(false); resetTwins();

/* 20 substeps per 60 Hz frame at 1x speed = real time at dt = 1/1200 */
function advanceActive(frames){
  const sub=Math.max(1,Math.round(20*ST.speed));
  simAdvance(SIM.live,ST,sub*frames);
  if(ST.view==='double') twinsAdvance(SIM.twins,ST,sub*frames);
}

/* ---------------- the model ----------------------------------------- */
function lazyC(obj,name,fn){
  Object.defineProperty(obj,name,{configurable:true,get(){
    const v=fn(); Object.defineProperty(obj,name,{value:v,configurable:true});
    return v; }});
}
function separatrixCurve(st,m){
  /* for the pendulum on a HELD cart (the caption says so): E_p = E_up */
  const P=paramsOf(st);
  const {kap,mu}=coeffs(P);
  const I=mu[0][0]+P.J[0];
  const xs=[],ys=[];
  for(let i=0;i<=m;i++){
    const th=-Math.PI+2*Math.PI*i/m;
    const v=Math.sqrt(Math.max(0,2*P.g*kap[0]*(1-Math.cos(th))/I));
    xs.push(th); ys.push(v);
  }
  return {xs,ys};
}
function buildModel(){
  const st=ST, sim=SIM.live, P=sim.P, n=P.n;
  const M={view:st.view,st,sim,P,n,t:sim.t,y:sim.y,F:sim.F};
  M.thw=[];
  for(let j=0;j<n;j++) M.thw.push(wrapAngle(sim.y[1+j]));
  lazyC(M,'E',()=>energyOf(P,sim.y));
  lazyC(M,'Ep',()=>pendEnergy(P,sim.y));
  lazyC(M,'T',()=>kineticOf(P,sim.y));
  lazyC(M,'V',()=>potentialOf(P,sim.y));
  M.Eup=eUpright(P);
  M.hold=sim.holdT; M.bestHold=sim.bestHold;
  M.work=sim.work; M.wallLoss=sim.wallLoss;
  M.mode=st.ctrl==='swing'?sim.mode:st.ctrl;
  lazyC(M,'gains',()=>gainsFor(st));
  lazyC(M,'tip',()=>tipPos(P,sim.y));
  if(st.view==='phase') M.sep=separatrixCurve(st,180);
  if(st.view==='double'){
    M.tw=SIM.twins;
    lazyC(M,'lyap',()=>{
      /* finite-time slope of ln(sep) over the growing segment */
      const S=SIM.twins.sep.filter(p=>p[1]>1e-8&&p[1]<0.5);
      if(S.length<10) return null;
      const a=S[0], b=S[S.length-1];
      if(b[0]-a[0]<0.5) return null;
      return Math.log(b[1]/a[1])/(b[0]-a[0]);
    });
  }
  if(st.view==='map') lazyC(M,'basin',()=>basinCompute(st,260));
  return M;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥'};
function plain(s){
  return String(s).replace(/&[a-zA-Z][a-zA-Z0-9]*;/g,
                           m=>ENTS[m]!==undefined?ENTS[m]:m)
                  .replace(/<\/?[a-zA-Z][^>]*>/g,'');
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range (sbs_sims.html).
   A canvas ctx.clip() would fix the browser but NOT the audit — the
   display-list recorder treats clip() as a no-op, so the captured geometry
   would still lie.  Crossings are interpolated so a clipped curve still meets
   the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const inY=y=>y>=ylo&&y<=yhi;
  let started=false;
  for(let i=0;i<n-1;i++){
    let x0=xs[i], y0=ys[i], x1=xs[i+1], y1=ys[i+1];
    if(!isFinite(x0)||!isFinite(y0)||!isFinite(x1)||!isFinite(y1)){
      started=false; continue; }
    const a=inY(y0), c=inY(y1);
    if(!a&&!c){ started=false; continue; }
    if(!a){
      const yc=y0<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x0=x0+(x1-x0)*t; y0=yc; started=false;
    }
    if(!c){
      const yc=y1<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x1=x0+(x1-x0)*t; y1=yc;
    }
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(!c) started=false;
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed (an untrained dream can fill the panel): draw no
     legend rather than a lying one — the caption names the colours */
  return null;
}


/* ---- this sim's role colours: green = the pendulum / the computed thing,
   orange = the reference (E_up, separatrix, targets), magenta = the live
   force / current state marker, cyan = structure (rail, cart). ---- */
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', cyan:'#5ac8e0',
           dim:'#8b93a6', gridtx:'#6f7789', cart:'#39404f'};
const RO_W=310, RO_H=560;
function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};
}
function sparseTicks(lo,hi,hpx){
  return ticksFor(lo,hi,hpx<90?2:(hpx<140?3:5));
}
/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));
  let fit=capFit(ctx,W,H,fullTxt,capW);
  if(fit.capY>=minTop) return {capY:fit.capY,txt:fullTxt,capW};
  fit=capFit(ctx,W,H,shortTxt,capW);
  return {capY:fit.capY,txt:shortTxt,capW};
}
function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];
}

/* ================================================================== *
 *  the scene renderer (shared by the rail and double views)           *
 *  EQUAL ASPECT — a pendulum is a shape.  Pure layout function so the *
 *  pointer handler maps clicks with the same numbers the drawing uses *
 * ================================================================== */
function railLayout(W,H,st,b){
  const Ltot=st.l1+(st.n===2?st.l2:0);
  const s=Math.min(b.w/(2*st.L+0.9),(b.h-30)/(2*Ltot+0.55));
  return {b,s,cx0:b.x+b.w/2,railY:b.y+b.h/2};
}
function toScr(lay,wx,wy){ return [lay.cx0+wx*lay.s,lay.railY-wy*lay.s]; }
function drawScene(ctx,lay,M,opts){
  const st=M.st, P=M.P, n=M.n, y=M.y, o=opts||{};
  const b=lay.b;
  frame(ctx,b,'#242a3a');
  /* the rail, its metre ticks, and the walls at +-L */
  const [rx0,ry]=toScr(lay,-st.L-0.12,0), [rx1]=toScr(lay,st.L+0.12,0);
  ctx.strokeStyle='#3a4254'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(rx0,ry); ctx.lineTo(rx1,ry); ctx.stroke();
  ctx.strokeStyle='#242a3a'; ctx.lineWidth=1;
  for(let m=-Math.floor(st.L*2)/2;m<=st.L;m+=0.5){
    const [tx]=toScr(lay,m,0);
    ctx.beginPath(); ctx.moveTo(tx,ry+4); ctx.lineTo(tx,ry+9); ctx.stroke();
  }
  for(const sgn of [-1,1]){
    const [wx]=toScr(lay,sgn*st.L,0);
    ctx.strokeStyle=COL.cyan; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(wx,ry-16); ctx.lineTo(wx,ry+16); ctx.stroke();
    ctx.strokeStyle='#2a3140'; ctx.lineWidth=1.4;
    for(let k=0;k<4;k++){
      ctx.beginPath();
      ctx.moveTo(wx+sgn*2,ry-14+k*8); ctx.lineTo(wx+sgn*9,ry-7+k*8);
      ctx.stroke();
    }
  }
  /* tip trail, aged toward the background */
  if(st.showTrail&&M.sim.trail.length>2){
    const T=M.sim.trail;
    for(let i=1;i<T.length;i++){
      const a=i/T.length;
      ctx.strokeStyle=rgba('#b8ec4c',0.05+0.5*a*a);
      ctx.lineWidth=1.2;
      const [ax,ay]=toScr(lay,T[i-1][0],T[i-1][1]);
      const [bx2,by2]=toScr(lay,T[i][0],T[i][1]);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx2,by2); ctx.stroke();
    }
  }
  /* the cart */
  const cw=0.30*lay.s, ch=0.16*lay.s;
  const [ccx,ccy]=toScr(lay,y[0],0);
  ctx.fillStyle=COL.cart;
  ctx.fillRect(ccx-cw/2,ccy-ch/2,cw,ch);
  ctx.strokeStyle=COL.cyan; ctx.lineWidth=1.2;
  ctx.strokeRect(ccx-cw/2,ccy-ch/2,cw,ch);
  /* the links */
  let jx=y[0], jy=0;
  for(let j=0;j<n;j++){
    const ex=jx+P.l[j]*Math.sin(y[1+j]);
    const ey=jy+P.l[j]*Math.cos(y[1+j]);
    const [sx,sy]=toScr(lay,jx,jy), [tx,ty]=toScr(lay,ex,ey);
    ctx.strokeStyle=COL.pos;
    ctx.lineWidth=st.kind==='rod'?Math.max(3,0.05*lay.s):2;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.lineCap='butt';
    ctx.beginPath(); ctx.arc(sx,sy,3.4,0,TAU);
    ctx.fillStyle='#0b0e14'; ctx.fill();
    ctx.strokeStyle=COL.cyan; ctx.lineWidth=1; ctx.stroke();
    if(st.kind==='bob'){
      ctx.beginPath(); ctx.arc(tx,ty,Math.max(4,0.055*lay.s*Math.cbrt(P.m[j])),0,TAU);
      ctx.fillStyle=shade(COL.pos,0.8); ctx.fill();
      ctx.strokeStyle='#39404f'; ctx.lineWidth=1; ctx.stroke();
    }
    jx=ex; jy=ey;
  }
  /* the force arrow */
  if(st.showForce&&Math.abs(M.F)>0.02){
    const fl=clamp(M.F/st.Fmax,-1.6,1.6)*0.5*lay.s;
    const ay2=ccy+ch/2+10;
    ctx.strokeStyle=COL.live; ctx.fillStyle=COL.live; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(ccx,ay2); ctx.lineTo(ccx+fl,ay2); ctx.stroke();
    const sgn=fl>=0?1:-1;
    ctx.beginPath();
    ctx.moveTo(ccx+fl,ay2); ctx.lineTo(ccx+fl-sgn*6,ay2-4);
    ctx.lineTo(ccx+fl-sgn*6,ay2+4); ctx.closePath(); ctx.fill();
  }
  /* the upright goal marker above the cart, and the hold banner */
  if(!o.noGoal){
    const Lt=P.l.reduce((a2,v)=>a2+v,0);
    const [gx,gy]=toScr(lay,y[0],Lt);
    ctx.strokeStyle=rgba('#e8843a',0.55); ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(ccx,ccy-ch/2); ctx.lineTo(gx,gy-6); ctx.stroke();
    ctx.setLineDash([]);
    if(M.hold>0.05){
      ctx.beginPath(); ctx.arc(gx,gy,7,0,TAU);
      ctx.strokeStyle=COL.ref; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle=COL.ref; ctx.font='11px "SF Mono", Menlo, monospace';
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(plain('holding '+fmt(M.hold,1)+' s'),gx,gy-11);
    }
  }
}

/* ================================================================== *
 *  view: the rail                                                     *
 * ================================================================== */
function drawRail(ctx,W,H,M){
  const st=M.st;
  const fit=fitCaption(ctx,W,H,railCaption(st),
    'pump with the swing, catch at the top — stretch the window for the '
    +'coaching notes',
    W-RO_W-96,stageTop()+26+170+74);
  const b=box(56,stageTop()+26,W-RO_W-96,
              Math.max(170,fit.capY-stageTop()-26-74));
  const lay=railLayout(W,H,st,b);
  drawScene(ctx,lay,M,{});
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain('the rail — '+(st.n===1?'one link':'two links')+', '
    +(st.kind==='rod'?'uniform rods':'point bobs')+', drawn to scale'),b.x,b.y-9);
  if(M.hold>=HOLD_GOAL){
    ctx.fillStyle=COL.pos; ctx.font='italic 20px Georgia, serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(plain('balanced! '+fmt(M.hold,1)+' s — best '
      +fmt(M.bestHold,1)+' s'),b.x+b.w/2,b.y+8);
  }
  /* the energy gauge: PENDULUM energy (cart frame), hanging -> upright.
     Total E is dominated by the cart's own KE mid-stroke (8 J against a
     1.5 J target) and lies about progress — found by looking at the PNG. */
  const gb=box(b.x,b.y1+16,Math.min(b.w,W-RO_W-96),14);
  const lo=-M.Eup, hi=M.Eup;
  const f=clamp((M.Ep-lo)/(hi-lo||1),0,1.35);
  ctx.fillStyle='#1b1f29'; ctx.fillRect(gb.x,gb.y,gb.w,gb.h);
  ctx.fillStyle=M.Ep>=hi*0.999?COL.ref:shade(COL.pos,0.75);
  ctx.fillRect(gb.x,gb.y,gb.w*Math.min(f,1),gb.h);
  frame(ctx,gb,'#242a3a');
  const xup=gb.x+gb.w;
  ctx.strokeStyle=COL.ref; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(xup-1,gb.y-3); ctx.lineTo(xup-1,gb.y1+3); ctx.stroke();
  ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('pendulum energy (cart frame), hanging → upright: '
    +fmt(M.Ep,2)+' / '+fmt(M.Eup,2)+' J',gb.x,gb.y1+5);
  caption(ctx,b.x,fit.capY,fit.txt,fit.capW);
}
function railCaption(st){
  return st.ctrl==='manual'
      ?'Drag the cart (or hold ←/→) and pump: push WITH the swing as the '
       +'pendulum passes the bottom, brake as it rises.  Each well-timed '
       +'shove does positive work on the pivot, and the energy gauge creeps '
       +'toward the orange upright mark.  Then try to catch it — or switch '
       +'the controller chips and watch the machines do it.'
      :st.ctrl==='swing'
      ?'The energy law F = sat(k_E (E−E_up) θ̇ cos θ) pumps exactly when '
       +'pushing adds energy, coasts through the top of each swing, and '
       +'hands off to LQR inside the catch window (|θ| < 0.35, |θ̇| < 1.8).'
      :st.ctrl==='lqr'
      ?'u = −K·[x, θ, ẋ, θ̇].  The gains are solved in-page from the Riccati '
       +'equation for YOUR current masses and lengths — move a slider and '
       +'they re-solve.  From the hanging state LQR alone does nothing '
       +'useful: it is a local controller, and the map view shows its reach.'
      :st.ctrl==='pid'
      ?'PID on the angle alone.  It balances θ beautifully — and, knowing '
       +'nothing about x, lets the cart random-walk into the wall.  That '
       +'failure is the point: the balance problem needs the full state.'
      :'No force.  With damping at zero this is a conservative system — '
       +'watch the energy gauge hold still while the motion stays wild.';
}

/* ================================================================== *
 *  view: the energy                                                   *
 * ================================================================== */
function drawEnergy(ctx,W,H,M){
  const st=M.st, sim=M.sim, Hh=sim.hist;
  const t1=Math.max(6,sim.t);
  const t0=Math.max(0,t1-12);
  const bw=Math.max(300,W-RO_W-140);
  const audit=M.E-(sim.E0+sim.work-sim.wallLoss-sim.dampLoss);
  const capTxt='The ledger balances to the digit: E \u2212 E\u2080 = work in \u2212 wall loss \u2212 '
    +'joint-damping loss.  Right now: '+fmt(M.E,3)+' J held, '
    +fmt(sim.work,3)+' J pushed in, '+fmt(sim.wallLoss,3)+' J eaten by the '
    +'walls, '+fmt(sim.dampLoss,3)+' J by damping (audit residual '
    +sigf(audit,2)+' J \u2014 the selfTest asserts it stays tiny).  Pumping is '
    +'nothing but timing F against \u1e8b so the integral \u222bF \u1e8b dt keeps growing.';
  const fit=fitCaption(ctx,W,H,capTxt,
    'E \u2212 E\u2080 = work \u2212 losses, to the digit (audit '+sigf(audit,2)
    +' J) \u2014 stretch the window for the full ledger',
    bw,stageTop()+30+56+58+44+40);
  /* panels get what the caption leaves (Known-bad: measure wrapped text) */
  const avail=fit.capY-(stageTop()+30)-58-40;
  const h1=Math.max(56,avail*0.55), h2=Math.max(44,avail*0.45-20);
  const b1=box(70,stageTop()+30,bw,h1);
  const b2=box(70,b1.y1+58,bw,h2);
  /* range from the WINDOW's extremes: the cart-KE spikes and the gap to
     the lossless line ARE the story, and a fixed range clipped both */
  let lo=-M.Eup*1.25, hi=Math.max(M.Eup*1.35,M.E+0.5);
  for(let i=0;i<Hh.t.length;i++){
    if(Hh.t[i]<t0) continue;
    hi=Math.max(hi,Hh.E[i]+0.4,Hh.W[i]+sim.E0+0.4);
    lo=Math.min(lo,Hh.E[i]-0.4);
  }
  axes(ctx,b1,t0,t1,lo,hi,{title:'energy of the whole machine',
    xfmt:t=>fmt(t,0),
    yticks:sparseTicks(lo,hi,b1.h),yfmt:t=>fmt(t,1)});
  polyline(ctx,b1,[t0,t1],[M.Eup,M.Eup],t0,t1,lo,hi,COL.ref,1.3,[5,3]);
  polyline(ctx,b1,[t0,t1],[-M.Eup,-M.Eup],t0,t1,lo,hi,'#4a5266',1,[5,3]);
  if(Hh.t.length>1){
    polyline(ctx,b1,Hh.t,Hh.E,t0,t1,lo,hi,COL.pos,1.8);
    polyline(ctx,b1,Hh.t,Hh.W.map(w=>w+sim.E0),t0,t1,lo,hi,COL.live,1.3,[2,3]);
  }
  if(b1.h>=110) legendAuto(ctx,b1,[[COL.pos,'E(t)'],
    [COL.live,'E\u2080 + work in (lossless would follow this)'],
    [COL.ref,'E_up = '+fmt(M.Eup,2)+' J']]);
  axes(ctx,b2,t0,t1,-st.Fmax*1.15,st.Fmax*1.15,{title:'the force doing the pumping',
    xlab:'t (s)',xfmt:t=>fmt(t,0),
    yticks:sparseTicks(-st.Fmax*1.15,st.Fmax*1.15,b2.h),yfmt:t=>fmt(t,0)});
  polyline(ctx,b2,[t0,t1],[0,0],t0,t1,-st.Fmax*1.15,st.Fmax*1.15,'#4a5266',1,[4,3]);
  if(Hh.t.length>1) polyline(ctx,b2,Hh.t,Hh.F,t0,t1,-st.Fmax*1.15,st.Fmax*1.15,COL.live,1.4);
  caption(ctx,b2.x,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the phase plane                                              *
 * ================================================================== */
function drawPhase(ctx,W,H,M){
  const st=M.st, Hh=M.sim.hist;
  const capFull=st.n===1
    ?'The dashed orange curve is the separatrix of the pendulum on a HELD '
     +'cart: inside it the pendulum rocks back and forth, outside it goes '
     +'over the top.  Pumping means spiralling outward from the centre of '
     +'the eye at (\u00b1\u03c0, 0) until the trajectory crosses that line with the '
     +'right timing \u2014 then the catch controller pinches it into the origin.'
    :'With two links the (\u03b8\u2081, \u03b8\u0307\u2081) projection is a shadow of a 6-D flow \u2014 '
     +'trajectories cross themselves freely here.  No separatrix is drawn '
     +'because none exists in this projection; switch to a single link for '
     +'the clean picture.';
  const fitc=fitCaption(ctx,W,H,capFull,
    'the orange eye is the over-the-top energy frontier \u2014 stretch the '
    +'window for the full story',
    W-RO_W-110,stageTop()+30+180+62);
  const side=Math.min(fitc.capY-stageTop()-30-62,W-RO_W-420,560);
  const b=box(74,stageTop()+30,Math.max(320,side*1.15),Math.max(180,side));
  const tdMax=8;
  axes(ctx,b,-Math.PI,Math.PI,-tdMax,tdMax,{title:
    'the (θ₁, θ̇₁) plane — over the top lives outside the orange eye',
    xlab:'θ₁ (wrapped; 0 = upright, ±π = hanging)',ylab:'θ̇₁ (rad/s)',
    xticks:[-Math.PI,-Math.PI/2,0,Math.PI/2,Math.PI],
    xfmt:t=>Math.abs(t)<1e-9?'0':(Math.abs(Math.abs(t)-Math.PI)<1e-9
      ?(t>0?'π':'−π'):(t>0?'π/2':'−π/2')),
    yfmt:t=>fmt(t,0)});
  if(st.n===1){
    polyline(ctx,b,M.sep.xs,M.sep.ys,-Math.PI,Math.PI,-tdMax,tdMax,COL.ref,1.5,[5,3]);
    polyline(ctx,b,M.sep.xs,M.sep.ys.map(v=>-v),-Math.PI,Math.PI,-tdMax,tdMax,
             COL.ref,1.5,[5,3]);
  }
  if(Hh.th.length>1){
    /* the trail wraps at ±π: split segments that jump */
    let seg={xs:[],ys:[]};
    const flush=()=>{ if(seg.xs.length>1)
      polyline(ctx,b,seg.xs,seg.ys,-Math.PI,Math.PI,-tdMax,tdMax,COL.pos,1.4);
      seg={xs:[],ys:[]}; };
    for(let i=0;i<Hh.th.length;i++){
      if(seg.xs.length&&Math.abs(Hh.th[i]-seg.xs[seg.xs.length-1])>3) flush();
      seg.xs.push(Hh.th[i]); seg.ys.push(Hh.td[i]);
    }
    flush();
  }
  const cx=b.x+b.w*((M.thw[0]+Math.PI)/(2*Math.PI));
  const cy=b.y1-b.h*((clamp(M.y[2+M.n],-tdMax,tdMax)+tdMax)/(2*tdMax));
  ctx.beginPath(); ctx.arc(cx,cy,4.5,0,TAU);
  ctx.fillStyle=COL.live; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
  caption(ctx,b.x,fitc.capY,fitc.txt,fitc.capW);
}

/* ================================================================== *
 *  view: the controller                                               *
 * ================================================================== */
function drawCtrl(ctx,W,H,M){
  const st=M.st, sim=M.sim, Hh=sim.hist;
  const t1=Math.max(6,sim.t), t0=Math.max(0,t1-12);
  const bw=Math.max(300,W-RO_W-150);
  const capTxt='Three synchronized strips: what the controller asked for, '
    +'where the cart went, what the angle did.  Swing-up reads as bang-bang '
    +'bursts of force timed against the swing; the LQR endgame is tiny '
    +'corrections around zero.  The term bars split u = \u2212K\u00b7s so you can '
    +'see WHICH state the controller is currently fighting.';
  const fit=fitCaption(ctx,W,H,capTxt,
    'force, cart, angle \u2014 stretch the window for the annotated strips',
    bw,stageTop()+30+62+40);
  const avail=fit.capY-(stageTop()+30)-40;
  /* how many strips honestly fit? each needs ~62 px + 44 px of separation */
  const nStrips=avail>=3*62+2*44?3:(avail>=2*62+44?2:1);
  const sh=(avail-(nStrips-1)*44)/nStrips;
  const bF=box(74,stageTop()+30,bw,sh);
  const bx=nStrips>=2?box(74,bF.y1+44,bw,sh):null;
  const bt=nStrips>=3?box(74,bx.y1+44,bw,sh):null;
  axes(ctx,bF,t0,t1,-st.Fmax*1.3,st.Fmax*1.3,{title:'the force (\u00b1 F_max band)',
    xfmt:t=>fmt(t,0),yticks:sparseTicks(-st.Fmax*1.3,st.Fmax*1.3,bF.h),
    yfmt:t=>fmt(t,0)});
  polyline(ctx,bF,[t0,t1],[st.Fmax,st.Fmax],t0,t1,-st.Fmax*1.3,st.Fmax*1.3,'#4a5266',1,[4,3]);
  polyline(ctx,bF,[t0,t1],[-st.Fmax,-st.Fmax],t0,t1,-st.Fmax*1.3,st.Fmax*1.3,'#4a5266',1,[4,3]);
  if(Hh.t.length>1) polyline(ctx,bF,Hh.t,Hh.F,t0,t1,-st.Fmax*1.3,st.Fmax*1.3,COL.live,1.5);
  if(bx){
    axes(ctx,bx,t0,t1,-st.L*1.25,st.L*1.25,{title:'the cart (\u00b1 L rail band)',
      xfmt:t=>fmt(t,0),yticks:sparseTicks(-st.L*1.25,st.L*1.25,bx.h),
      yfmt:t=>fmt(t,1)});
    polyline(ctx,bx,[t0,t1],[st.L,st.L],t0,t1,-st.L*1.25,st.L*1.25,COL.cyan,1.1,[4,3]);
    polyline(ctx,bx,[t0,t1],[-st.L,-st.L],t0,t1,-st.L*1.25,st.L*1.25,COL.cyan,1.1,[4,3]);
    if(Hh.t.length>1) polyline(ctx,bx,Hh.t,Hh.x,t0,t1,-st.L*1.25,st.L*1.25,COL.pos,1.5);
  }
  if(bt){
    axes(ctx,bt,t0,t1,-Math.PI,Math.PI,{title:'the angle (wrapped; 0 = upright)',
      xlab:'t (s)',xfmt:t=>fmt(t,0),
      yticks:[-Math.PI,0,Math.PI],
      yfmt:t=>Math.abs(t)<1e-9?'0':(t>0?'\u03c0':'\u2212\u03c0')});
    polyline(ctx,bt,[t0,t1],[0,0],t0,t1,-Math.PI,Math.PI,COL.ref,1,[4,3]);
    if(Hh.t.length>1){
      let seg={xs:[],ys:[]};
      const flush=()=>{ if(seg.xs.length>1)
        polyline(ctx,bt,seg.xs,seg.ys,t0,t1,-Math.PI,Math.PI,COL.pos,1.4);
        seg={xs:[],ys:[]}; };
      for(let i2=0;i2<Hh.t.length;i2++){
        if(seg.ys.length&&Math.abs(Hh.th[i2]-seg.ys[seg.ys.length-1])>3) flush();
        seg.xs.push(Hh.t[i2]); seg.ys.push(Hh.th[i2]);
      }
      flush();
    }
  } else {
    ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('window too short for the cart and angle strips \u2014 stretch it taller',
                 bF.x,bF.y1+26);
  }
  /* LQR anatomy: the per-term shares of u = -K s at the current state */
  const gx=bF.x1+34;
  if((st.ctrl==='lqr'||(st.ctrl==='swing'&&M.mode==='lqr'))&&W-gx-RO_W>150){
    const g=M.gains;
    if(g.ok){
      const names=st.n===1?['x','\u03b8','\u1e8b','\u03b8\u0307']
        :['x','\u03b8\u2081','\u03b8\u2082','\u1e8b','\u03b8\u0307\u2081','\u03b8\u0307\u2082'];
      const s2=[M.y[0]];
      for(let j=0;j<st.n;j++) s2.push(M.thw[j]);
      s2.push(M.y[1+st.n]);
      for(let j=0;j<st.n;j++) s2.push(M.y[2+st.n+j]);
      const parts=names.map((nm,i2)=>[-g.K[i2]*s2[i2],nm]);
      let pmax=0.5;
      for(const [v] of parts) pmax=Math.max(pmax,Math.abs(v));
      ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText('u = \u2212K\u00b7s, term by term',gx,bF.y-9);
      const bwid=Math.min(200,W-gx-RO_W-40);
      parts.forEach(([v,nm],i2)=>{
        const yy=bF.y+i2*26;
        ctx.fillStyle='#1b1f29';
        ctx.fillRect(gx,yy,bwid,12);
        const half=bwid/2, len=clamp(v/pmax,-1,1)*half;
        ctx.fillStyle=v>=0?shade(COL.pos,0.8):shade(COL.live,0.8);
        ctx.fillRect(gx+half+Math.min(0,len),yy,Math.abs(len),12);
        ctx.strokeStyle='#39404f';
        ctx.beginPath(); ctx.moveTo(gx+half+0.5,yy); ctx.lineTo(gx+half+0.5,yy+12);
        ctx.stroke();
        ctx.fillStyle=COL.dim; ctx.font='10.5px "SF Mono", Menlo, monospace';
        ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(plain(nm+' '+fmt(v,1)),gx+bwid+6,yy+6);
      });
    }
  }
  caption(ctx,74,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the double (twins + chaos)                                   *
 * ================================================================== */
function drawDouble(ctx,W,H,M){
  const st=M.st;
  const tw=M.tw, lam=M.lyap;
  const capTxt='The ghost twins \u2014 cyan and magenta \u2014 are released with the '
    +'top link horizontal and the lower link folded up, 10\u207b\u2079 rad apart in '
    +'\u03b8\u2081, with NO forcing.  Their separation climbs roughly '
    +'exponentially \u2014 '
    +(lam!==null?('the fitted finite-time slope is \u03bb \u2248 '+fmt(lam,2)
      +' /s (a doubling every '+fmt(Math.log(2)/Math.max(lam,1e-9),2)+' s), '
      +'a finite-time estimate, not a formal Lyapunov exponent')
      :'wait a few seconds for enough growth to fit a slope')
    +'.  This is why no simple law swings up a double pendulum: the target '
    +'is an unstable point reached through chaos.  LQR can still CATCH it \u2014 '
    +'press \u201cplace upright\u201d and watch \u2014 because near the top the linear '
    +'approximation is briefly honest.';
  const fit=fitCaption(ctx,W,H,capTxt,
    'a nanoradian of disagreement becomes the whole swing \u2014 stretch the '
    +'window for the story',
    W-RO_W-150,stageTop()+26+150+70);
  const avail=fit.capY-(stageTop()+26)-70;
  const b=box(56,stageTop()+26,W-RO_W-96,Math.max(150,avail*0.55));
  const lay=railLayout(W,H,st,b);
  drawScene(ctx,lay,M,{});
  /* the TWINS, drawn as ghosts over the live machine: cyan and magenta
     chains from the two force-free twin states — watching them split IS
     the chaos lesson */
  for(const [yt,col] of [[tw.ya,COL.cyan],[tw.yb,COL.live]]){
    let gx2=yt[0], gy2=0;
    ctx.globalAlpha=0.65;
    ctx.strokeStyle=col; ctx.lineWidth=2;
    for(let j=0;j<2;j++){
      const ex=gx2+tw.P.l[j]*Math.sin(yt[1+j]);
      const ey=gy2+tw.P.l[j]*Math.cos(yt[1+j]);
      const [sx,sy]=toScr(lay,gx2,gy2), [tx2,ty2]=toScr(lay,ex,ey);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(tx2,ty2); ctx.stroke();
      gx2=ex; gy2=ey;
    }
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('the double pendulum \u2014 the ghosts are the twins, splitting',
               b.x,b.y-9);
  /* the strip's x-label hangs 32 px below the frame — reserve past it */
  const ph=fit.capY-b.y1-40-42;
  if(ph>=64){
    const pb=box(74,b.y1+40,Math.min(W-RO_W-150,760),ph);
    const t1=Math.max(4,tw.t), t0=Math.max(0,t1-30);
    axes(ctx,pb,t0,t1,-9,0.5,{title:
      'two force-free twins from horizontal, 10\u207b\u2079 apart \u2014 log\u2081\u2080 separation',
      xlab:'t (s)',xfmt:t=>fmt(t,0),
      yticks:sparseTicks(-9,0.5,ph).map(Math.round),yfmt:t=>'1e'+fmt(t,0)});
    if(tw.sep.length>1)
      polyline(ctx,pb,tw.sep.map(p=>p[0]),tw.sep.map(p=>Math.log10(Math.max(p[1],1e-12))),
               t0,t1,-9,0.5,COL.pos,1.6);
  }
  caption(ctx,74,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the map (LQR basin)                                          *
 * ================================================================== */
function drawMap(ctx,W,H,M){
  const st=M.st;
  const capFull='Each cell starts the pendulum at that (\u03b8, \u03b8\u0307) with the '
    +'cart parked at the centre, turns the LQR on, and waits 6 s: green means '
    +'it ended balanced with the cart still on the rail.  The catchable set '
    +'hugs the upright point and leaks outward along the separatrix, where '
    +'the natural flow already delivers states toward the top with little '
    +'energy to shed.  Computed at a coarser step (dt = 1/240) than the live '
    +'sim \u2014 it is a map, not a trajectory.  It depends on F_max and L: '
    +'weaken the motor or shorten the rail and watch it shrink.';
  const fitc=fitCaption(ctx,W,H,capFull,
    'green = the LQR alone can catch it (dt = 1/240 map) \u2014 stretch the '
    +'window for the full story',
    W-RO_W-110,stageTop()+30+180+62);
  const side=Math.min(fitc.capY-stageTop()-30-62,W-RO_W-430,540);
  const b=box(74,stageTop()+30,Math.max(340,side*1.2),Math.max(180,side));
  const basin=M.basin, nx=basin.nx, ny=basin.ny;
  const tdMax=6;
  for(let c2=0;c2<nx*ny;c2++){
    const i=Math.floor(c2/ny), j=c2%ny;
    const x0=Math.round(b.x+i*b.w/nx), x1=Math.round(b.x+(i+1)*b.w/nx);
    const y0=Math.round(b.y1-(j+1)*b.h/ny), y1=Math.round(b.y1-j*b.h/ny);
    ctx.fillStyle=c2<basin.cell?(basin.grid[c2]?shade(COL.pos,0.55):'#10131b')
                               :'#1a1e28';
    ctx.fillRect(x0,y0,x1-x0,y1-y0);
  }
  if(basin.cell<nx*ny){
    ctx.fillStyle=COL.gridtx; ctx.font='10.5px "SF Mono", Menlo, monospace';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('computing… '+fmt(100*basin.cell/(nx*ny),0)+'%',
                 b.x+6,b.y1-5);
  }
  axes(ctx,b,-Math.PI,Math.PI,-tdMax,tdMax,{title:
    'states the LQR alone can catch (green), from x = ẋ = 0',
    xlab:'θ (wrapped)',ylab:'θ̇ (rad/s)',
    xticks:[-Math.PI,-Math.PI/2,0,Math.PI/2,Math.PI],
    xfmt:t=>Math.abs(t)<1e-9?'0':(Math.abs(Math.abs(t)-Math.PI)<1e-9
      ?(t>0?'π':'−π'):(t>0?'π/2':'−π/2')),
    yfmt:t=>fmt(t,0)});
  const sep=separatrixCurve(st,180);
  polyline(ctx,b,sep.xs,sep.ys,-Math.PI,Math.PI,-tdMax,tdMax,COL.ref,1.4,[5,3]);
  polyline(ctx,b,sep.xs,sep.ys.map(v=>-v),-Math.PI,Math.PI,-tdMax,tdMax,COL.ref,1.4,[5,3]);
  const cx=b.x+b.w*((M.thw[0]+Math.PI)/(2*Math.PI));
  const cy=b.y1-b.h*((clamp(M.y[2+M.n],-tdMax,tdMax)+tdMax)/(2*tdMax));
  ctx.beginPath(); ctx.arc(cx,cy,4.5,0,TAU);
  ctx.fillStyle=COL.live; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
  caption(ctx,b.x,fitc.capY,fitc.txt,fitc.capW);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[];
  POLY_SEGS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='rail') drawRail(ctx,W,H,M);
  else if(M.view==='energy') drawEnergy(ctx,W,H,M);
  else if(M.view==='phase') drawPhase(ctx,W,H,M);
  else if(M.view==='ctrl') drawCtrl(ctx,W,H,M);
  else if(M.view==='double') drawDouble(ctx,W,H,M);
  else drawMap(ctx,W,H,M);
}

function sceneBoxFor(view,W,H){
  if(view==='double')
    return box(56,stageTop()+26,W-RO_W-96,Math.max(240,(H-stageTop()-260)*0.52));
  return box(56,stageTop()+26,W-RO_W-96,H-stageTop()-170);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.rebuild=function(){};
  S.fit=function(){};
  S.draw=function(){
    const ctx=canvas.getContext('2d');
    drawView(ctx,S.W,S.H,buildModel());
  };
  S.step=function(){
    /* the progressive basin fill counts as animation: keep pumping frames
       until the map is complete, whether or not time runs */
    let moved=false;
    if(ST.view==='map'&&!basinDone()){ basinCompute(ST); moved=true; }
    if(ST.running){ advanceActive(1); moved=true; }
    return moved;
  };
  /* the pointer grabs the CART in the rail/double views (manual mode).
     Returns true if consumed; anything else ignores the pointer. */
  S.pointer=function(type,x,y){
    if(ST.view!=='rail'&&ST.view!=='double') return false;
    const sim=SIM.live;
    if(type==='up'){ if(sim.drag===null) return false; sim.drag=null; return true; }
    const b=sceneBoxFor(ST.view,S.W,S.H);
    const lay=railLayout(S.W,S.H,ST,b);
    const wx=(x-lay.cx0)/lay.s;
    if(type==='down'){
      const [ccx,ccy]=toScr(lay,sim.y[0],0);
      if(Math.abs(x-ccx)<34&&Math.abs(y-ccy)<30&&ST.ctrl==='manual'){
        sim.drag=clamp(wx,-ST.L,ST.L);
        return true;
      }
      return false;
    }
    if(type==='move'&&sim.drag!==null){
      sim.drag=clamp(wx,-ST.L,ST.L);
      return true;
    }
    return false;
  };
  return S;
}

  s+='<table>';
  s+=hd('the machine');

  s+=row('rail half-length L',fmt(st.L,1)+' m');
  s+=row('F_max / damping',fmt(st.Fmax,0)+' N / '+fmt(st.damp,3));
  s+=hd('the state');
  s+=row('t',fmt(M.t,1)+' s');
  s+=row('x',fmt(M.y[0],3)+' m',Math.abs(M.y[0])>st.L*0.98?'bad':'');
  for(let j=0;j<n;j++)
    s+=row('θ'+(n===2?['₁','₂'][j]:'')+' (from up)',
      fmt(M.thw[j],3)+' rad',Math.abs(M.thw[j])<0.12?'good':'');
  s+=row('ẋ',fmt(M.y[1+n],2)+' m/s');
  s+=hd('the energy');
  s+=row('E total / pendulum',fmt(M.E,2)+' / '+fmt(M.Ep,2)+' J',
         M.Ep>=M.Eup*0.999?'good':'');
  s+=row('E upright',fmt(M.Eup,3)+' J');
  s+=row('work in / walls / damping',fmt(M.work,2)+' / '

  s+=hd('the controller');
  s+=row('mode',M.mode==='pump'?'pumping energy':M.mode==='lqr'&&st.ctrl==='swing'
    ?'caught — balancing':M.mode);

    const g=M.gains;
    s+=row('riccati',g.ok?'solved (res '+sigf(g.res,1)+')':'NOT CONVERGED',
           g.ok?'good':'bad');

      s+=row('K','['+g.K.map(v=>fmt(v,1)).join(', ')+']');
  }
  s+=row('upright hold',fmt(M.hold,1)+' s (best '+fmt(M.bestHold,1)+')',
         M.hold>=HOLD_GOAL?'good':'');

  s+='<div class="note">'+(st.ctrl==='manual'
    ?'Grab the block and shake it with the beat of the swing — you are '
     +'trading the cart&rsquo;s momentum for the pendulum&rsquo;s energy. '
     +'Space pauses; ←/→ shove; <b>u</b> places it upright; <b>d</b> drops it.'
    :'The gains re-solve live when you move a mass or length slider — the '

function eqbarHTML(M){
  const v=M.view;
  if(v==='rail')
    return '<span class="lhs">M(q)q̈ + C(q,q̇)q̇ + G(q)</span> = '
      +'<span class="hl2">B F</span>'
      +'&nbsp;&nbsp;·&nbsp;&nbsp; q = [x, θ₁'+(M.n===2?', θ₂':'')+']'
      +'<span class="sm">one force on the cart is the only input — everything '
      +'the pendulum does arrives through the coupling in M(q).</span>';
  if(v==='energy')
    return '<span class="lhs">dE/dt</span> = <span class="hl">F·ẋ</span>'
      +' − c·Σ(θ̇ᵢ−θ̇ᵢ₋₁)² − wall loss'
      +'<span class="sm">only the cart term can ADD energy: pumping is making '
      +'F agree with ẋ, stroke after stroke.</span>';
  if(v==='phase')
    return '<span class="lhs">E<sub>sep</sub></span> = '

      +'rocking; outside, over the top.</span>';

    return 'swing-up: <span class="hl">F = sat(k_E (E−E_up) θ̇ cos θ)</span>'

function tagHTML(M){

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  /* the double and map views ARE their configurations: entering them binds
     the link count (a map for n=2 over a 1-D angle grid would be a fiction) */
  function setView(k){
    st.view=k;
    if(k==='double'&&st.n!==2){ st.n=2; resetLive(false); resetTwins(); }
    if(k==='map'&&st.n!==1){ st.n=1; resetLive(false); }
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
    syncChips(); syncPanel(); refresh();
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',
      onclick:()=>setView(k)},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }

  const hardReset=()=>{ resetLive(false); resetTwins(); };

  const gSys=h('div',{class:'grp'},h('h3',null,'the machine'));
  gSys.appendChild(chipRow(LINK_LIST,'n',()=>hardReset()));
  trackChips(gSys,LINK_LIST,'n');
  gSys.appendChild(chipRow(KIND_LIST,'kind',()=>hardReset()));
  trackChips(gSys,KIND_LIST,'kind');
  gSys.appendChild(slider('M','cart mass',0.4,3,0.05,v=>fmt(v,2)+' kg',hardReset));
  gSys.appendChild(slider('m1','link 1 mass',0.1,1.2,0.05,v=>fmt(v,2)+' kg',hardReset));
  gSys.appendChild(slider('l1','link 1 length',0.4,1.4,0.05,v=>fmt(v,2)+' m',hardReset));
  gSys.appendChild(slider('m2','link 2 mass',0.1,1.2,0.05,v=>fmt(v,2)+' kg',hardReset));
  gSys.appendChild(slider('l2','link 2 length',0.3,1.2,0.05,v=>fmt(v,2)+' m',hardReset));
  const sysTag=h('div',{class:'tag'}); gSys.appendChild(sysTag);

  const gCtrl=h('div',{class:'grp'},h('h3',null,'the controller'));
  gCtrl.appendChild(chipRow(CTRL_LIST,'ctrl',()=>{
    SIM.live.mode='pump'; SIM.live.pid.i=0; SIM.live.drag=null; }));
  trackChips(gCtrl,CTRL_LIST,'ctrl');
  const ctrlTag=h('div',{class:'tag'}); gCtrl.appendChild(ctrlTag);

  const gRig=h('div',{class:'grp'},h('h3',null,'the rig'));
  gRig.appendChild(slider('L','rail half-length',0.8,2.4,0.1,v=>fmt(v,1)+' m'));
  gRig.appendChild(slider('Fmax','motor force',4,30,1,v=>fmt(v,0)+' N'));
  gRig.appendChild(slider('damp','joint damping',0,0.08,0.002,v=>fmt(v,3)));

  const gRun=h('div',{class:'grp'},h('h3',null,'the run'));
  const runChecks=h('div',{class:'checks'},
    checkbox('running','time runs'),
    checkbox('showTrail','tip trail'),
    checkbox('showForce','force arrow'));
  gRun.appendChild(runChecks);
  gRun.appendChild(slider('speed','speed',0.25,4,0.25,v=>fmt(v,2)+'×'));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ resetLive(false); dirty=true; refresh(); }},'drop it'),
    h('button',{onclick:()=>{ resetLive(true); dirty=true; refresh(); }},'place upright')));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ SIM.live.y[2+st.n]+=0.8; dirty=true; refresh(); }},'nudge'),
    h('button',{onclick:()=>{ resetTwins(); dirty=true; refresh(); }},'restart twins')));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); hardReset();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
                h('div',{id:'info'}),
                h('div',{class:'src',html:'no measured data: the dynamics are '
                  +'exact Euler&ndash;Lagrange closed forms, verified against '
                  +'a finite-difference Lagrangian and pinned bit-level to '
                  +'build_cart/gen_cart.py; LQR gains solved in-page and '
                  +'checked against scipy&rsquo;s Riccati solver.'}));
  [gSys,gCtrl,gRig,gRun,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++)
          if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>
            b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    rows.m2.row.hidden=(st.n!==2);
    rows.l2.row.hidden=(st.n!==2);
    [].forEach.call(runChecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['running','showTrail','showForce'][i]];
    });
    for(const k in rows) rows[k].sync();
    sysTag.innerHTML='changing the machine <b>restarts</b> the run '
      +'(the ledger needs a clean t = 0)';
    ctrlTag.innerHTML=st.ctrl==='swing'&&st.n===2
      ?'<span class="r">the energy law is single-link only; for the double, '
       +'use manual or place-upright + LQR</span>'
      :st.ctrl==='pid'
      ?'watch the cart drift — PID never learns where the wall is'
      :'switching controllers keeps the state: grab a swing mid-flight';
    runTag.innerHTML='<b>u</b> upright &nbsp; <b>d</b> drop &nbsp; '
      +'<b>n</b> nudge &nbsp; ←/→ shove &nbsp; space pauses';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent = st.view==='rail'
        ? 'drag the block · ←/→ shove · space pauses · u/d place/drop'
        : st.view==='map'
        ? 'the map recomputes when you change the machine, the motor or the rail'
        : st.view==='double'
        ? 'restart the twins and watch the nanoradian bloom'
        : 'space runs · 1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){
      canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)) dirty=true;
  });
  const up=()=>{ canvas.classList.remove('dragging'); S.pointer('up',0,0); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); refresh(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); SIM.live.key=-1; dirty=true; }
    else if(e.key==='ArrowRight'){ e.preventDefault(); SIM.live.key=1; dirty=true; }
    else if(e.key==='u'){ resetLive(true); dirty=true; refresh(); }
    else if(e.key==='d'){ resetLive(false); dirty=true; refresh(); }
    else if(e.key==='n'){ SIM.live.y[2+st.n]+=0.8; dirty=true; refresh(); }
    else if(e.key==='r'){ Object.assign(st,DEFAULTS); hardReset();
      syncChips(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ SIM.live.key=0; dirty=true; }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%10===0) roEl.innerHTML=readoutHTML(S.model());
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

/* ================================================================== *
 *  selfTest — headless verification                                   *
 *  "(py ref)" values come from build_cart/gen_cart.py, read from its  *
 *  full output.  Trajectory tolerances are stated per checkpoint and  *
 *  grow with step count (libm drift); PRNG-free quantities pin tight. *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,tol,n)=>ok(Math.abs(a-b)<=tol,n+'  (got '+a+', want '+b+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),
    n+'  (got '+a+', want '+b+', rel '+Math.abs(a-b)/Math.abs(b||1)+')');
  const T0=Date.now();

  /* ---- 0. the shared-helper fixes cannot rot ---- */
  ok(plain('&Delta;x &theta;')==='Δx θ','plain() decodes capital+Greek entities');
  ok(plain('a<sub>B</sub>b')==='aBb','plain() strips tags');
  ok(ticksFor(0.8,0.2,5).length===1&&

    const weak=basinCompute(ST,1e9);
