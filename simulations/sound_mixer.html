    { const st0=Object.assign({},DEFAULTS,{conn:'probe',trim:TRIM_COMP});
      rel(2*cxAbs(connGain(st0,1e3)),1.99999000005000,1e-6,
        'compensated probe: x2 of set at 1 kHz too (scipy)'); }
  }

  /* ---------- G. the sound path (sound_mixer addition) ---------- */
  {
    /* the a→re, b→im mapping, pinned by the same scipy partial sums
       that pin the screen's series: audioEval + DC must equal them */
    const PSA={square:[9.82090182357003e-01,9.72877154352397e-01],
               triangle:[4.00992806525703e-01,9.24042918363069e-01],
               saw:[2.12654691556058e-01,4.53702194787869e-01],
               pulse:[9.76438986872583e-01,1.04587158063169e+00]};
    for(const k in PSA){
      const co=audioCoeffs(k,0.3,0,21);
      for(const [j,u] of [[0,0.10],[1,0.23]])
        close(audioEval(co,u)+wfDC(k,0.3),PSA[k][j],1e-11,
          'audio partial21['+k+'](u='+u+') (scipy)');
    }
    /* rotation: 90° turns the sine table into a cosine table */
    { const co=audioCoeffs('sine',0.5,PI/2,1);
      close(co.re[1],1,1e-15,'audio ph 90°: re[1] = 1');
      close(co.im[1],0,1e-15,'audio ph 90°: im[1] = 0'); }
    /* rotation = time advance — two implementations, awkward angle.
       MUST be a pulse: it is the only waveform with nonzero cosine
       coefficients, so it alone reaches the −a·sin(nφ) term (the
       mutation sweep caught square leaving that sign untested) */
    { const ph=0.7, coR=audioCoeffs('pulse',0.3,ph,33),
            co0=audioCoeffs('pulse',0.3,0,33);
      for(const u of [0.11,0.37,0.62])
        close(audioEval(coR,u),audioEval(co0,u+ph/TAU),1e-12,
          'audio rotation = time advance at u='+u); }
    /* and the 90° rotation of the pulse fundamental, pinned absolutely:
       re' = b₁, im' = −a₁ (the same scipy pair pinned in section A) */
    { const co=audioCoeffs('pulse',0.3,PI/2,1);
      close(co.re[1], 8.333461009843e-01,1e-11,'pulse ph 90°: re[1] = b₁ (scipy)');
      close(co.im[1],-6.054613829125e-01,1e-11,'pulse ph 90°: im[1] = −a₁ (scipy)'); }
    /* the mixer's null: 180° is exactly minus */
    { const cA=audioCoeffs('sine',0.5,0,1), cB=audioCoeffs('sine',0.5,PI,1);
      close(cA.re[1]+cB.re[1],0,1e-15,'ph 180° cancels: re');
      close(cA.im[1]+cB.im[1],0,1e-15,'ph 180° cancels: im'); }
    /* harmonics under the DAC's Nyquist */
    ok(audioNH(1000,24000)===24,'audioNH: 24 harmonics at 1 kHz / 48 kSa/s');
    ok(audioNH(1000,22050)===22,'audioNH: 22 at 44.1 kSa/s');
    ok(audioNH(10,24000)===HW.NHMAX,'audioNH: capped at the series cap');
    ok(audioNH(23999,24000)===1,'audioNH: a bare fundamental just under');
    ok(audioNH(24000,24000)===0,'audioNH: silence AT Nyquist');
    ok(audioNH(5e7,24000)===0,'audioNH: 50 MHz is silence, not an alias');
    /* played peaks: a sine is exactly 1; the 49-harmonic square is the
       same Gibbs maximum scipy pinned for the spectrum view; the capped
       table still sits at the (2/π) Si(π) ceiling — a σ-tapered table
       would read ~1.00 and this assertion exists to catch that "fix";
       a 5% pulse minus its DC swings to 2(1−d) plus the ear */
    close(audioPeakUnit('sine',0.5,1),1,1e-6,'audio peak[sine] = 1');
    close(audioPeakUnit('square',0.5,49),1.17911310188829e+00,2e-4,
      'audio peak[square,49] = Gibbs partial49 max (scipy)');
    close(audioPeakUnit('square',0.5,1000),1.1789797444721675,6e-3,
      'audio peak[square,capped] ≈ (2/π) Si(π), ears intact (scipy)');
    { const p=audioPeakUnit('pulse',0.05,256);
      ok(p>1.9&&p<2.12,'audio peak[pulse 5%] = 2(1−d) plus the ear ('+fmt(p,3)+')'); }
    /* the level map: the default 1 V sine peaks at exactly 1/12 FS */
    { const st0=Object.assign({},DEFAULTS);
      close(audioPeakFS(st0,24000),1/12,1e-6,'default 1 V sine peaks at 1/12 FS'); }
    { const st0=Object.assign({},DEFAULTS,{amp:5,ch2:true,wave:'square',
        wave2:'pulse',amp2:5,vol:2});
      ok(audioPeakFS(st0,24000)>1.5,'full-tilt squares at vol ×2 CLIP (peak '
        +fmt(audioPeakFS(st0,24000),2)+' FS)'); }
    { const st0=Object.assign({},DEFAULTS,{freqExp:7});
      close(audioPeakFS(st0,24000),0,1e-15,'a 10 MHz fundamental is silent'); }
    /* array shape: [0] is the ignored DC slot */
    { const co=audioCoeffs('pulse',0.3,0.4,7);
      ok(co.re.length===8&&co.im.length===8&&co.re[0]===0&&co.im[0]===0,
        'coefficient arrays are NH+1 long with an empty DC slot'); }
  }

  /* ---------- H. the keyboard (sound_mixer addition) ---------- */
  {
    close(noteFreq(69),440,1e-12,'A4 = 440 Hz exactly');
    close(noteFreq(81),880,1e-12,'A5 doubles exactly');
    close(noteFreq(60),2.61625565300599e+02,1e-9,'middle C (python)');
    close(noteFreq(48),1.30812782650299e+02,1e-9,'C3 (python)');
    close(noteFreq(132),1.67440361792383e+04,1e-8,'top key C10 (python)');
    close(noteFreq(61)/noteFreq(60),1.05946309435930e+00,1e-12,
      'a semitone is 2^(1/12) (python)');
    for(const m of [21,48,60,93])
      rel(noteFreq(m+12),2*noteFreq(m),1e-14,'noteFreq(m+12) = 2 noteFreq(m) at '+m);
    ok(octBase(3)===48&&octBase(0)===12&&octBase(8)===108,
      "octBase: the MIDI number of that octave's C");
    ok(noteName(69)==='A4'&&noteName(48)==='C3'&&noteName(70)==='A♯4'
      &&noteName(132)==='C10','noteName spells MIDI numbers');
    /* noteAt: exact keys hit; everything else honestly misses */
    for(const k of [0,7,12,24])
      ok(noteAt(Math.log10(noteFreq(48+k)),3)===k,'noteAt finds key '+k);
    ok(noteAt(3,3)===-1,'1 kHz (21 cents over B5) is off the C3–C5 board');
    ok(noteAt(Math.log10(noteFreq(60)*Math.pow(2,0.5/12)),3)===-1,
      'a quarter-tone between keys lights nothing');
    ok(noteAt(Math.log10(noteFreq(47)),3)===-1,'B2 sits below the low C');
    ok(noteAt(Math.log10(noteFreq(73)),3)===-1,'C♯5 sits above the high C');
    /* the whole shiftable board stays on the frequency slider's own
       range and under the DAC's Nyquist */
    { let lo=1e9,hi=-1e9;
      for(let o=KB_OCT_LO;o<=KB_OCT_HI;o++){
        lo=Math.min(lo,Math.log10(noteFreq(octBase(o))));
        hi=Math.max(hi,Math.log10(noteFreq(octBase(o)+KB_SPAN))); }
      close(lo,1.21356019708228e+00,1e-9,'lowest key C0 = 16.35 Hz (python)');
      close(hi,4.22386015372209e+00,1e-9,'highest key C10 (python)');
      ok(lo>=1&&hi<=7.699,'every reachable key sits inside the frequency slider');
      ok(Math.pow(10,hi)<24000,'and under the DAC Nyquist'); }
  }

  /* ---------- I. the waterfall's DSP (ported from KGLW; its scipy pins) ---------- */
  {
    close(dbOfAmp(1),0,1e-12,'0 dBFS at full scale');
    close(dbOfAmp(0.5),-6.02059991327962,1e-9,'half amplitude = −6.02 dB (scipy)');
    close(dbOfAmp(Math.SQRT1_2),-3.01029995663981,1e-9,'sine rms = −3.01 dB (scipy)');
    ok(dbOfAmp(0)<=-200,'silence clamps, no −Infinity leaks');
    const NB=8192, sine=new Float64Array(NB), ramp=new Float64Array(NB);
    for(let i=0;i<NB;i++){ sine[i]=Math.sin(TAU*16*i/NB); ramp[i]=i/(NB-1); }
    rel(rmsOf(sine,0,NB),Math.SQRT1_2,1e-6,'rms of a sine = 1/√2 (scipy)');
    rel(rmsOf(ramp,0,NB),1/Math.sqrt(3),1e-3,'rms of a ramp = 1/√3 (scipy)');
    close(peakOf(sine,0,NB),1,1e-6,'peak of the sine');
    ok(countClips(sine,0,NB,0.999)>0&&countClips(sine,0,NB,1.01)===0,
      'clip counter fires at the rail and only there');
    { const N=4096, A=0.37, k=129, x=new Float64Array(N);
      for(let i=0;i<N;i++) x[i]=A*Math.sin(TAU*k*i/N);
      rel(ampSpectrum(x,hannWin(N))[k],A,1e-9,'amplitude calibration, hann (scipy)');
      rel(ampSpectrum(x,null)[k],A,1e-9,'amplitude calibration, rect (scipy)'); }
    { const N=256, x=new Float64Array(N).fill(0.5);
      rel(ampSpectrum(x,null)[0],0.5,1e-9,'DC reads once, not twice'); }
    close(logFx(VZ.FMIN,0,100),0,1e-9,'log axis left end');
    close(logFx(VZ.FMAX,0,100),100,1e-9,'log axis right end');
    rel(logFinv(logFx(1234,0,997),0,997),1234,1e-9,'log axis round-trips');
    { const N=VZ.NSGRAM,sr=48000,nB=VZ.NBUCK, tab=bucketTable(N,sr,nB);
      ok(tab.length===nB,'bucket count');
      let mono=true,inrange=true;
      for(let i=1;i<nB;i++) if(tab[i][0]<tab[i-1][0]) mono=false;
      for(const [k0,k1] of tab) if(!(k1>=k0&&k0>=1&&k1<N/2)) inrange=false;
      ok(mono,'buckets march upward');
      ok(inrange,'bucket bins stay in range');
      const x=new Float64Array(N), f0=997;
      for(let i=0;i<N;i++) x[i]=Math.sin(TAU*f0*i/sr);
      const lv=bucketMax(ampSpectrum(x,hannWin(N)),tab);
      let bi=0; for(let i=1;i<nB;i++) if(lv[i]>lv[bi]) bi=i;
      const fLo=logFinv(bi,0,nB), fHi=logFinv(bi+1,0,nB);
      ok(f0>=fLo*0.9&&f0<=fHi*1.1,
        'a 997 Hz line lands in the 997 Hz bucket ('+fmt(fLo,0)+'–'+fmt(fHi,0)+')'); }
    { const N=VZ.NSGRAM,sr=48000, x=new Float64Array(N);
      const fbin=129*sr/N;
      for(let i=0;i<N;i++) x[i]=Math.sin(TAU*fbin*i/sr);
      rel(domFreq(ampSpectrum(x,hannWin(N)),sr,N),fbin,1e-6,'exact-bin pitch is exact');
      const y=new Float64Array(N);
      for(let i=0;i<N;i++) y[i]=Math.sin(TAU*1234.5*i/sr);
      const fh=domFreq(ampSpectrum(y,hannWin(N)),sr,N);
      ok(Math.abs(fh-1234.5)<1.2,
        'parabolic pitch within a tenth of a bin (got '+fmt(fh,2)+' Hz)');
      ok(domFreq(ampSpectrum(new Float64Array(N),hannWin(N)),sr,N)===null,
        'silence has no pitch'); }
    /* KGLW's noteOf vs this file's noteFreq/noteName: two implementations
       of 12-TET, asserted to agree (and its scipy cents pins) */
    { const a4=noteOf(440);
      ok(a4.name==='A4'&&Math.abs(a4.cents)<1e-9,'A440 is A4 +0 cents');
      ok(noteOf(466.163761518090).name==='A♯4','466.16 Hz is A♯4 (scipy)');
      close(noteOf(445).cents,19.5621747949208,1e-6,'445 Hz reads +19.56 cents (scipy)');
      close(noteOf(430).cents,-39.8002367222391,1e-6,'430 Hz reads −39.80 cents (scipy)');
      for(let m=24;m<=120;m+=7){
        const r=noteOf(noteFreq(m));
        ok(r.name===noteName(m)&&Math.abs(r.cents)<1e-9,
          'noteOf ∘ noteFreq round-trips MIDI '+m); } }
    { let s1={v:0,t:0};
      s1=stepPeakHold(s1,0.9,10);
      close(s1.v,0.9,1e-12,'peak latches');
      close(stepPeakHold(s1,0.1,10+VZ.PEAK_HOLD-0.01).v,0.9,1e-12,'holds for PEAK_HOLD');
      close(stepPeakHold(s1,0.1,10+VZ.PEAK_HOLD+0.25).v,0.9*0.562341325190349,1e-9,
        'then falls 20 dB/s (scipy: ×0.5623 in 0.25 s)');
      close(stepPeakHold(stepPeakHold(s1,0.1,10+VZ.PEAK_HOLD+0.25),0.95,11.9).v,0.95,1e-12,
        'a louder peak re-latches'); }
    { const b3=s=>{ const c=toRgb(s); return c[0]+c[1]+c[2]; };
      ok(b3(sgColor(0,96))>b3(sgColor(-96,96)),'louder is brighter');
      let last=-1,monot=true;
      for(let d=-96;d<=0;d+=8){ const v=b3(sgColor(d,96)); if(v<last-1) monot=false; last=v; }
      ok(monot,'the ramp never darkens as level rises'); }
    ok(VZ.FMIN===20&&VZ.FMAX===20000,'log axes span the audible decades');
    ok((VZ.NSGRAM&(VZ.NSGRAM-1))===0,'FFT size is a power of two');
    ok(VZ.HOP*4===VZ.NSGRAM,'75% overlap');
    /* the frame source: what the columns are made of */
    { const x=mixFrame(Object.assign({},DEFAULTS),48000,2048,2048/48000);
      close(rmsOf(x,0,2048),5.886743003071957e-02,1e-12,
        'mixFrame rms of the default 1 V sine (python)');
      ok(peakOf(x,0,2048)<=1/12+1e-9,'frame peak ≤ amp/VAFS');
      ok(countClips(x,0,2048,VZ.CLIP_AT)===0,'the default does not clip'); }
    { const st0=Object.assign({},DEFAULTS,{vol:0.5});
      close(rmsOf(mixFrame(st0,48000,2048,2048/48000),0,2048),2.9433715015359786e-02,1e-12,
        'the volume knob scales the frame (python)'); }
    { const st0=Object.assign({},DEFAULTS,{amp:5,ch2:true,wave:'square',
        wave2:'pulse',amp2:5,vol:2});
      ok(countClips(mixFrame(st0,48000,2048,2048/48000),0,2048,VZ.CLIP_AT)>0,
        'the full-tilt mix clips the frame'); }
    /* a column: an exact-bin full-scale line saturates its bucket byte */
    { const N=VZ.NSGRAM, sr=48000, f0=64*sr/N /* 1500 Hz, bin 64 */,
            x=new Float64Array(N);
      for(let i=0;i<N;i++) x[i]=Math.sin(TAU*f0*i/sr);
      const ref={};
      const c1=sgColumnOf(x,sr,ref);
      let mxB=0,bi=0;
      for(let b=0;b<VZ.NBUCK;b++) if(c1.u8[b]>mxB){mxB=c1.u8[b];bi=b;}
      ok(mxB===255,'a full-scale exact-bin line saturates its byte ('+mxB+')');
      const fLo=logFinv(bi,0,VZ.NBUCK), fHi=logFinv(bi+1,0,VZ.NBUCK);
      ok(f0>=fLo*0.9&&f0<=fHi*1.1,'and in the right bucket');
      const c0=sgColumnOf(new Float64Array(N),sr,ref);
      let all0=true; for(let b=0;b<VZ.NBUCK;b++) if(c0.u8[b]!==0) all0=false;
      ok(all0,'silence is a black column'); }
  }

  /* ---------- J. saving a sample — the WAV path ---------- */
  {
    ok(sampleFrames(Object.assign({},DEFAULTS),48000,2)===96000,
      'default 2 s snaps to 96000 frames (2000 periods)');
    ok(sampleFrames(Object.assign({},DEFAULTS,{ch2:true,ratio:'3:2'}),48000,2)===96000,
      'ratio 3:2: the common period is 2/f₀ and still lands on 96000');
    ok(sampleFrames(Object.assign({},DEFAULTS,{freqExp:2.7}),48000,2)===95964,
      '10^2.7 Hz: 1002 whole periods = 95964 frames (python)');
    ok(sampleFrames(Object.assign({},DEFAULTS,{freqExp:1}),48000,20)===48000*SAMPLE_MAXS,
      'the length cap holds at '+SAMPLE_MAXS+' s');
    { const x=new Float64Array(4); x[0]=0; x[1]=1; x[2]=-1; x[3]=1/12;
      const dv=new DataView(wavEncode(x,48000));
      const s4=o=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),
                                      dv.getUint8(o+2),dv.getUint8(o+3));
      ok(s4(0)==='RIFF'&&s4(8)==='WAVE'&&s4(12)==='fmt '&&s4(36)==='data',
        'RIFF scaffolding in place');
      ok(dv.getUint32(4,true)===36+8,'RIFF size = 36 + data bytes');
      ok(dv.getUint32(16,true)===16&&dv.getUint16(20,true)===1
        &&dv.getUint16(22,true)===1,'PCM, mono');
      ok(dv.getUint32(24,true)===48000&&dv.getUint32(28,true)===96000,
        'sample rate and byte rate');
      ok(dv.getUint16(32,true)===2&&dv.getUint16(34,true)===16,'block align, 16 bit');
      ok(dv.getUint32(40,true)===8,'data chunk = 2N bytes');
      ok(dv.getInt16(44,true)===0&&dv.getInt16(46,true)===32767
        &&dv.getInt16(48,true)===-32767,'the int16 map: 0, +32767, −32767');
      ok(dv.getInt16(50,true)===2731,'1/12 of full scale rounds to 2731 (python)'); }
    { const x=new Float64Array(2); x[0]=1.7; x[1]=-2.3;
      const dv=new DataView(wavEncode(x,48000));
      ok(dv.getInt16(44,true)===32767&&dv.getInt16(46,true)===-32767,
        'overs clamp to the rails, symmetrically'); }
    { const st0=Object.assign({},DEFAULTS);
      const fr=sampleFrames(st0,48000,2);
      const r=renderSample(st0,48000,fr);
      ok(r.clips===0,'the default render does not clip');
      close(r.x[0],0,1e-12,'the render starts at the phase-0 convention');
      const dv=new DataView(wavEncode(r.x,48000));
      ok(dv.getInt16(44+2*12,true)===2731,
        'sample 12 — a quarter period of 1 kHz at 48 k — reads 2731 (python)'); }
    { const st0=Object.assign({},DEFAULTS,{amp:5,wave:'square',vol:2});
      ok(renderSample(st0,48000,4800).clips===0,
        'one full-tilt square at vol ×2 peaks at 0.98 FS — legal, no clip');
      const st1=Object.assign({},st0,{ch2:true,wave2:'pulse',amp2:5});
      const r=renderSample(st1,48000,4800);
      ok(r.clips>0,'both channels full-tilt at vol ×2 clip, and the render says so'); }
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
