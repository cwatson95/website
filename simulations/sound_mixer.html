<title>Sound mixer — hear the function generator, watch the scope</title>
<!--
  ===================================================================
  SOUND MIXER
  a two-channel function generator driving a digital storage scope —
  and, in this file, the speakers: SPACE plays and pauses the sound
  ===================================================================

  Derived from oscilloscope.html (2026-08-04).  The generator, the
  path, the acquisition and that instrument's six views are unchanged;
  this file adds the audio output and keyboard described in (4), and
  the waterfall view and WAV sample recorder described in (5), and
  nothing else to the physics.

  Built to the same house rules as the rest of this collection: one flat
  file, no build step, no network, works opened straight off the disk as
  file://.

  ------------------------------------------------------------------
  WHAT THIS SOLVES
  ------------------------------------------------------------------
  The whole signal path from the generator's amplitude knob to the pixel,
  treated honestly as LTI circuit theory plus a real acquisition:

  (1) THE GENERATOR.  Five waveforms (sine, square, triangle, sawtooth,
      pulse with settable duty) as exact Fourier series:
        square    b_n = 4/(n pi)                      n odd
        triangle  b_n = 8 (-1)^((n-1)/2) / (n pi)^2   n odd
        sawtooth  b_n = 2 (-1)^(n+1) / (n pi)
        pulse(d)  a_n = 2 sin(2 pi n d)/(n pi),
                  b_n = 2 (1 - cos(2 pi n d))/(n pi),  DC = 2d - 1
      behind a 50 ohm source.  The amplitude knob is the INTO-50-OHM
      value, so the open-circuit EMF is twice it - which is the doubling
      trap "the path" view exists to show.

  (2) THE PATH.  Every stage is a complex transfer function applied per
      harmonic - exact LTI steady state, no time stepping anywhere.
      Loading: a 50 ohm feed-through terminator (matched, so the only
      lump left is the scope's own 15 pF), a 1x coax into 1 Mohm with
      115 pF of cable+input and its 27.68 MHz pole, or a 10x probe -
      9 Mohm against the trimmer C1, dividing against 1 Mohm and that
      same 115 pF: H = Y1/(Y1+Y2) exactly, compensated iff R1C1 = R2C2
      (C1 = 12.78 pF here).  Then AC coupling as a 10 Hz one-pole
      high-pass, and the front end as a one-pole low-pass at 100 MHz
      (20 MHz with the limit in).

  (3) THE ACQUISITION.  2500 points at fs = min(1 GSa/s, 2500/(10 t_div))
      - tied to the timebase exactly as in a real DSO, which is why a slow
      timebase aliases a fast signal: the record shows
      |f - fs round(f/fs)|.  8-bit quantisation over the 8 divisions when
      enabled.  Edge triggering is root-finding on the analytic series;
      holdoff skips crossings; AUTO free-runs at (deterministic) arbitrary
      phases when nothing crosses.  The spectrum is a radix-2 FFT of the
      record (asserted against a direct DFT), Hann or rectangular, with
      the exact series lines drawn over it - folded to where they alias
      when they do.

  (4) THE SOUND (this file's addition).  SPACE plays and pauses the
      generator through the machine's DAC.  Each channel is a WebAudio
      OscillatorNode holding a PeriodicWave built from THE SAME
      wfCoef() coefficients the screen is drawn from (normalisation
      disabled), truncated at the DAC's Nyquist and at the series cap:
      NH = min(1000, floor((fs_DAC/2)/f0)).  Past Nyquist a channel is
      SILENT, not folded - a DAC is a reconstruction, not a sampler.
      No Lanczos taper here, deliberately: the Known-bad rule is
      "taper a series that is truncated and then SAMPLED or MEASURED";
      this table is neither - it is handed to a band-limited DAC whose
      analog output genuinely carries the Gibbs ears, so the untapered
      partial sum IS the honest waveform.  What is sonified is the SET
      value (the into-50-ohm promise), not the EMF and not the screen:
      you hear the generator itself while the scope keeps showing what
      the path does to it.  DC (the offset knob, a pulse's mean) never
      reaches the speaker - real[0] of a PeriodicWave is ignored,
      which is physically an AC-coupled output stage.  Levels: +-12 V
      of summed set value = DAC full scale at volume x1, so the
      default 1 V sine sits at -21.6 dBFS; the panel prints the
      worst-case-over-phase peak (sum of channel peaks - a bound that
      can promise, not just report) and flags CLIPS past full scale.
      Phase: both oscillators are (re)started on one shared context
      time with channel 2's coefficients rotated by n*ph2, so the
      ratio/phase relations the X-Y view draws hold in the audio
      exactly; a frequency drag glides phase-continuously, then the
      phases re-lock ~180 ms after the knob settles.  Pause is
      AudioContext.suspend(): the phases freeze where they stand.
      The KEYBOARD (bottom of the screen) tunes generator 1 in equal
      temperament: 25 keys spanning 24 semitones, low C to high C
      (C3-C5 by default), A4 = 440 Hz, MIDI numbering.  A key sets the
      SAME log-frequency knob the slider drives, so channel 2 keeps its
      p:q ratio - the keyboard plays intervals through the ratio chips.
      The octave buttons (and z/x) transpose keyboard AND pitch
      together by exactly one octave, from a C0 board up to a top key
      of C10 = 16.744 kHz - still under the DAC's Nyquist.  A key
      lights only while the generator holds that key's frequency to
      within 2 cents (one slider detent is ~4 cents), so the slider
      moving off a note honestly unlights the board.

  (5) THE WATERFALL AND THE SAMPLES (this file's additions).
      "The waterfall" is the KGLW visual player's spectrogram and
      meters (KGLW/viz_build/v_dsp.js, 2026-08-04), ported mono, with
      the generator standing in for the song: 2048-point Hann columns
      at hop 512, bucketed onto a 20 Hz-20 kHz log axis over 96 dB on
      the house neon ramp; rms/peak meters with KGLW's ballistics
      (1.5 s hold, 20 dB/s fall), a clip counter against the +-1 rail,
      crest factor, and a dominant-pitch note readout (argmax bin,
      log-parabola refined, 12-TET cents).  Columns come from the mix
      SYNTHESIZED by the same series the oscillators hold (works with
      the sound off and under the harness; series capped at 256
      harmonics for speed, printed on the canvas when it bites) or,
      when the sound is playing in a real browser, from an
      AnalyserNode tap on the master bus - post-fader, the one window
      onto what the WebAudio graph actually produced.  The stereo
      instruments (goniometer, correlation) and the file machinery
      were not ported: this bus is mono and has no files.
      "Save .wav sample" renders the mix EXACTLY - the full truncated
      series through the same set-value map and volume, NOT a
      recording of the browser's wavetable approximation - as 16-bit
      PCM mono at 48 kSa/s, clamped at the +-1 rails exactly as a DAC
      clamps (the panel reports how many samples clipped).  The length
      snaps to a whole number of common periods (q/f0 with channel 2's
      p:q on, 1/f0 without, 15 s cap) so the file loops with a seam
      under half a sample.  The header, the int16 map and the snap
      arithmetic are pinned in selfTest against external recomputation.

  Truncation: the series is cut at 1000 harmonics (a sine needs 1).  For
  the worst screen case here (1 kHz square, full bandwidth) the first
  dropped harmonic is ~2.5 mV on a 15.6 mV LSB - below the ADC's own
  resolution, and selfTest asserts exactly that.

  ------------------------------------------------------------------
  WHAT IS EXACT, WHAT IS TYPICAL, WHAT IS NOT MODELLED
  ------------------------------------------------------------------
  EXACT, asserted in selfTest against values computed OUTSIDE this file
  with scipy 1.18 / numpy 2.5 (build_scope/derive.py, quoted to 12+
  digits, labelled "(scipy)"): the Fourier coefficients and partial sums;
  the RMS closed forms (sine 1/sqrt2, triangle and saw 1/sqrt3, square
  and pulse 1, pulse AC 2 sqrt(d(1-d))); the THD closed forms (square
  sqrt(pi^2/8 - 1), saw sqrt(pi^2/6 - 1), triangle sqrt(pi^4/96 - 1));
  the Gibbs limit (2/pi) Si(pi) = 1.17898; the probe constants
  kC = C1/(C1+C2), kR = R2/(R1+R2), tau = (R1||R2)(C1+C2) and the
  cal-square steady state; the one-pole rise time ln9/(2 pi f_bw) and
  the ~8% failure of the quadrature rise-time rule for two equal real
  poles; AC droop 1 - e^(-T/2 tau); the folding law; the Hann sums N/2
  and 3N/8 and ENBW = 1.5 bins; FFT = DFT; Parseval; the trigger instant
  asin(L/A)/2pi; and the loading factors 1.9999 (1 Mohm) and 1.99999
  (10 Mohm).

  TYPICAL VALUES (representative bench hardware, not one instrument's
  datasheet; used only as parameters and printed in the panel): 50 ohm
  source; 1 Mohm || 15 pF input; 100 pF of cable on the 1x path; 9 Mohm
  probe with a 3-30 pF trimmer; 100 MHz front end; 20 MHz limit switch;
  2500-point record; 1 GSa/s ceiling; 8-bit ADC.

  NOT MODELLED, deliberately: noise and trigger jitter, trigger
  hysteresis, transmission-line reflections (the terminated path is taken
  as the matched line it is built to be; the unterminated coax is lumped,
  the usual bench treatment below ~30 MHz), sin(x)/x DAC artefacts beyond
  the display interpolation shown, generator slew and output distortion,
  ADC differential nonlinearity.  Channel 2 always rides the 1x hi-Z
  path, DC-coupled, and shares channel 1's vertical scale - stated in
  the panel.  For the sound: no speaker, room or hearing model -
  "volume" is digital full scale, not SPL - and nothing ultrasonic is
  folded into band: harmonics past the DAC's Nyquist are simply not
  generated, and a fundamental past it is silence.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],

function neon(t){

  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  number formatting                                                  *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function fmtSI(x,unit,n){
  if(!isFinite(x)) return '—';
  const a=Math.abs(x);
  if(a>=1e9)    return fmt(x/1e9,n===undefined?2:n)+' G'+unit;
  if(a>=1e6)    return fmt(x/1e6,n===undefined?2:n)+' M'+unit;
  if(a>=1e3)    return fmt(x/1e3,n===undefined?2:n)+' k'+unit;
  if(a>=1||a===0) return fmt(x,n===undefined?2:n)+' '+unit;
  if(a>=1e-3)   return fmt(x*1e3,n===undefined?2:n)+' m'+unit;
  if(a>=1e-6)   return fmt(x*1e6,n===undefined?2:n)+' µ'+unit;
  if(a>=1e-9)   return fmt(x*1e9,n===undefined?2:n)+' n'+unit;
  return fmt(x*1e12,n===undefined?2:n)+' p'+unit;
}

/* ================================================================== *

  RIN:1e6, CIN:15e-12,   /* scope input: 1 Mohm in parallel with 15 pF      */
  CCABLE:100e-12,        /* a metre of coax on the 1x path                  */
  RPR:9e6,               /* the 10x probe's series resistor                 */
  FBW:100e6, FBWL:20e6,  /* front-end pole, and the 20 MHz limit switch     */
  FAC:10,                /* AC-coupling corner, Hz                          */
  NREC:2500,             /* record length, points                           */
  FSMAX:1e9,             /* the digitiser's ceiling, Sa/s                   */
  NFFT:2048, BITS:8,
  DIVH:10, DIVV:8,       /* the graticule                                   */
  NHMAX:1000,            /* series truncation — see header                  */

const C2TOT=HW.CCABLE+HW.CIN;          /* what the probe trimmer works against */
const TRIM_COMP=HW.RIN*C2TOT/HW.RPR*1e12;  /* pF; R1C1 = R2C2 => C1 = R2C2/R1 */

/* the detented knobs */
const TDIV=[1e-8,2e-8,5e-8,1e-7,2e-7,5e-7,1e-6,2e-6,5e-6,
            1e-5,2e-5,5e-5,1e-4,2e-4,5e-4,1e-3,2e-3,5e-3,1e-2];
const VDIV=[0.01,0.02,0.05,0.1,0.2,0.5,1,2,5];

/* ================================================================== *
 *  the generator's waveforms — exact samples and exact Fourier        *
 *  coefficients.  Conventions (unit amplitude, u = t/T in [0,1)):     *
 *    sine     sin(2 pi u)                                             *
 *    square   +1 for u<1/2, -1 after                                  *
 *    triangle 4u | 2-4u | 4u-4   (peak +1 at u=1/4, in phase w/ sine) *
 *    saw      2u | 2u-2          (rising, jump at u=1/2)              *
 *    pulse(d) +1 for u<d, -1 after                                    *
 * ================================================================== */
const WAVES=[
  {id:'sine',     name:'sine'},
  {id:'square',   name:'square'},
  {id:'triangle', name:'triangle'},
  {id:'saw',      name:'sawtooth'},
  {id:'pulse',    name:'pulse'},
];
function wfSample(kind,u,duty){
  u-=Math.floor(u);
  if(kind==='sine')     return Math.sin(TAU*u);
  if(kind==='square')   return u<0.5?1:-1;
  if(kind==='triangle') return u<0.25?4*u:(u<0.75?2-4*u:4*u-4);
  if(kind==='saw')      return u<0.5?2*u:2*u-2;
  if(kind==='pulse')    return u<duty?1:-1;
  throw new Error('wfSample: unknown waveform "'+kind+'"');
}
/* [a_n, b_n] of  x(u) = DC + sum a_n cos(2 pi n u) + b_n sin(2 pi n u) */
function wfCoef(kind,n,duty){
  if(kind==='sine')     return [0, n===1?1:0];
  if(kind==='square')   return [0, n%2? 4/(n*PI) : 0];
  if(kind==='triangle') return [0, n%2? 8*((n-1)/2%2?-1:1)/((n*PI)*(n*PI)) : 0];
  if(kind==='saw')      return [0, 2*(n%2?1:-1)/(n*PI)];
  if(kind==='pulse')    return [2*Math.sin(TAU*n*duty)/(n*PI),
                                2*(1-Math.cos(TAU*n*duty))/(n*PI)];
  throw new Error('wfCoef: unknown waveform "'+kind+'"');
}
function wfDC(kind,duty){ return kind==='pulse'?2*duty-1:0; }
/* rms of the zero-mean part, closed form */
function wfRmsAC(kind,duty){
  if(kind==='sine')     return Math.SQRT1_2;
  if(kind==='square')   return 1;
  if(kind==='triangle') return 1/Math.sqrt(3);
  if(kind==='saw')      return 1/Math.sqrt(3);
  if(kind==='pulse')    return 2*Math.sqrt(duty*(1-duty));
  throw new Error('wfRmsAC: unknown waveform "'+kind+'"');
}
/* total harmonic distortion, closed form where one exists (sqrt of the
   power above the fundamental over the power in it) */
function wfThd(kind,duty){
  if(kind==='sine')     return 0;
  if(kind==='square')   return Math.sqrt(PI*PI/8-1);
  if(kind==='saw')      return Math.sqrt(PI*PI/6-1);
  if(kind==='triangle') return Math.sqrt(PI*PI*PI*PI/96-1);
  if(kind==='pulse'){                     /* no closed form worth quoting */
    const [a1,b1]=wfCoef('pulse',1,duty);
    const f2=a1*a1+b1*b1;
    const tot=wfRmsAC('pulse',duty)**2*2; /* sum(a^2+b^2) = 2 rms_ac^2 */
    return f2>0?Math.sqrt(Math.max(0,tot-f2)/f2):Infinity;
  }
  throw new Error('wfThd: unknown waveform "'+kind+'"');
}

/* ================================================================== *
 *  the sound of the generator — the same series, sent to the DAC      *
 *  (sound_mixer addition: pure math here, WebAudio plumbing in boot)  *
 * ================================================================== */
const VAFS=12;   /* ±12 V of summed SET value = DAC full scale at vol ×1 */
/* harmonics that fit under the DAC's Nyquist, capped at the series cap.
   A DAC reconstructs — it cannot fold — so past Nyquist there is nothing
   to make: 0 harmonics means silence, never an alias. */
function audioNH(f0,nyq){
  if(!(f0>0)||f0>=nyq) return 0;
  return Math.min(HW.NHMAX,Math.max(1,Math.floor(nyq/f0)));
}
/* PeriodicWave coefficients for a UNIT waveform advanced by phase ph
   (radians).  WebAudio's convention is
     x(t) = sum_n  re[n] cos(2 pi n f t) + im[n] sin(2 pi n f t),
   re[0]/im[0] (the DC slot) ignored.  NOTE the sign of im is OPPOSITE
   buildSeries' internal storage (which keeps -b so its rotation is a
   plain complex multiply): here re,im ARE the cosine and sine
   coefficients.  The rotation by e^{i n ph}, written out:
     re' = a cos(n ph) + b sin(n ph),  im' = b cos(n ph) - a sin(n ph). */
function audioCoeffs(kind,duty,ph,NH){
  const re=new Float64Array(NH+1), im=new Float64Array(NH+1);
  for(let n=1;n<=NH;n++){
    const [a,b]=wfCoef(kind,n,duty);
    if(ph){ const cp=Math.cos(n*ph), sp=Math.sin(n*ph);
      re[n]=a*cp+b*sp; im[n]=b*cp-a*sp; }
    else { re[n]=a; im[n]=b; }
  }
  return {re,im};
}
/* evaluate the table at u = f0 t — the recurrence trick of seriesEval,
   but in the DAC's sign convention above */
function audioEval(co,u){
  const c1=Math.cos(TAU*u), s1=Math.sin(TAU*u);
  let cn=c1,sn=s1,x=0;
  const re=co.re,im=co.im;
  for(let n=1;n<re.length;n++){
    x+=re[n]*cn+im[n]*sn;
    const c2=cn*c1-sn*s1; sn=sn*c1+cn*s1; cn=c2;
  }
  return x;
}
/* peak of the unit waveform as played: max |partial sum| on a 16384
   grid.  Harmonics past 256 are not summed: the ears do not grow with
   more terms (the 9% is a constant — Known-bad list), the interior has
   long converged, and the duty slider must not cost 16 Mflop a detent.
   Phase drops out of a per-channel peak (a rotation is a time shift),
   so the cache key carries none. */
const _PKCACHE={};
function audioPeakUnit(kind,duty,NH){
  const NHp=Math.min(NH,256);
  const key=kind+(kind==='pulse'?'|'+duty:'')+'|'+NHp;
  if(key in _PKCACHE) return _PKCACHE[key];
  const co=audioCoeffs(kind,duty,0,NHp);
  let mx=0; const NPTS=16384;
  for(let i=0;i<NPTS;i++){
    const v=Math.abs(audioEval(co,i/NPTS));
    if(v>mx) mx=v;
  }
  return _PKCACHE[key]=mx;
}
/* the mix's worst-case peak in DAC full-scale units: channel peaks
   SUMMED — an upper bound over relative phase, so the clip readout can
   promise silence-from-clipping rather than merely report it — through
   the set-value map and the volume */
function audioPeakFS(st,nyq){
  const g1=chan1(st);
  const n1=audioNH(g1.f0,nyq);
  let p=n1>0?g1.amp*audioPeakUnit(g1.wave,g1.duty,n1):0;
  if(st.ch2){
    const g2=chan2(st), n2=audioNH(g2.f0,nyq);
    if(n2>0) p+=g2.amp*audioPeakUnit(g2.wave,g2.duty,n2);
  }
  return st.vol*p/VAFS;
}

/* ================================================================== *
 *  the keyboard — equal temperament for generator 1                   *
 *  (sound_mixer addition).  25 keys spanning KB_SPAN = 24 semitones,  *
 *  low C to high C; the octave buttons transpose keyboard AND pitch   *
 *  together by exactly one octave.  A4 = 440 Hz, MIDI numbers, C4=60. *
 * ================================================================== */
const NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const KB_SPAN=24;                       /* semitones, low C to high C  */
const KB_OCT_LO=0, KB_OCT_HI=8;         /* C0 = 16.35 Hz … top key C10 */
function octBase(oct){ return 12*(oct+1); }     /* MIDI of that low C  */
function noteFreq(m){ return 440*Math.pow(2,(m-69)/12); }
function noteName(m){ return NOTE_NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1); }
/* which key (0..KB_SPAN) the generator sits on, within ±2 cents; −1 if
   none.  One frequency-slider detent is ~4 cents, so a key stays lit
   only while the generator holds that key's own frequency. */
function noteAt(freqExp,oct){
  const f=Math.pow(10,freqExp);
  const km=69+12*Math.log(f/440)/Math.LN2-octBase(oct);
  const k=Math.round(km);
  return k>=0&&k<=KB_SPAN&&Math.abs(km-k)<=0.02?k:-1;
}

/* ================================================================== *
 *  the waterfall's DSP — ported from KGLW_visual_player.html          *
 *  (KGLW/viz_build/v_dsp.js, 2026-08-04), the mono subset: dB, level  *
 *  meters, calibrated amplitude spectrum, log-f buckets, dominant     *
 *  pitch, note-and-cents, peak-hold ballistics, the waterfall colour. *
 *  The stereo instruments (goniometer, correlation) and the file      *
 *  machinery were left behind: this bus is mono and has no files.     *
 *  Reference values in selfTest are that build's scipy pins.          *
 * ================================================================== */
const VZ={
  FMIN:20, FMAX:20000,           /* the audible decades on the log axis */
  NSGRAM:2048, HOP:512, NBUCK:192,
  DBRANGE:96,
  PEAK_HOLD:1.5, PEAK_DECAY:20,  /* meter ballistics: s of hold, dB/s   */
  CLIP_AT:0.999,
  NHWF:256,                      /* series cap for the SYNTHESIZED tap  */
};
function dbOfAmp(a){ return 20*Math.log10(Math.max(Math.abs(a),1e-12)); }
function rmsOf(x,i0,i1){
  let s=0; const a=Math.max(0,i0|0), b=Math.min(x.length,i1|0);
  if(b<=a) return 0;
  for(let i=a;i<b;i++) s+=x[i]*x[i];
  return Math.sqrt(s/(b-a));
}
function peakOf(x,i0,i1){
  let p=0; const a=Math.max(0,i0|0), b=Math.min(x.length,i1|0);
  for(let i=a;i<b;i++){ const v=Math.abs(x[i]); if(v>p)p=v; }
  return p;
}
function countClips(x,i0,i1,at){
  let n=0; const a=Math.max(0,i0|0), b=Math.min(x.length,i1|0);
  for(let i=a;i<b;i++) if(Math.abs(x[i])>=at) n++;
  return n;
}
/* one-sided amplitude spectrum, window-corrected: 2|X|/sum(w) for k>0 */
function ampSpectrum(x,win){
  const N=x.length;
  const re=new Float64Array(N), im=new Float64Array(N);
  let ws=0;
  for(let i=0;i<N;i++){ const w=win?win[i]:1; ws+=w; re[i]=x[i]*w; }
  fftRadix2(re,im);
  const half=N>>1, out=new Float64Array(half);
  for(let k=0;k<half;k++)
    out[k]=(k===0?1:2)*Math.hypot(re[k],im[k])/ws;
  return out;
}
/* log-frequency pixel mapping over [FMIN, FMAX] */
function logFx(f,x0,x1){
  const l0=Math.log(VZ.FMIN), l1=Math.log(VZ.FMAX);
  return x0+(x1-x0)*(Math.log(Math.max(f,1e-3))-l0)/(l1-l0);
}
function logFinv(x,x0,x1){
  const l0=Math.log(VZ.FMIN), l1=Math.log(VZ.FMAX);
  return Math.exp(l0+(l1-l0)*(x-x0)/(x1-x0||1));
}
/* log-spaced buckets over [FMIN,FMAX]; each owns a contiguous non-empty
   bin range (low buckets may share a bin) */
function bucketTable(N,sr,nB){
  const half=N>>1, out=[];
  for(let b=0;b<nB;b++){
    const fLo=logFinv(b,0,nB), fHi=logFinv(b+1,0,nB);
    let k0=Math.max(1,Math.floor(fLo*N/sr)), k1=Math.min(half-1,Math.ceil(fHi*N/sr));
    if(k1<k0) k1=k0;
    out.push([k0,k1]);
  }
  return out;
}
function bucketMax(amp,table){
  const out=new Float64Array(table.length);
  for(let b=0;b<table.length;b++){
    const [k0,k1]=table[b]; let m=0;
    for(let k=k0;k<=k1;k++) if(amp[k]>m)m=amp[k];
    out[b]=m;
  }
  return out;
}
/* dominant pitch: argmax bin refined by a log-magnitude parabola (Hann's
   parabolic bias ~0.02 bin — KGLW derive_visual.py); null if no clear peak */
function domFreq(amp,sr,N){
  const half=amp.length;
  const kLo=Math.max(2,Math.ceil(40*N/sr)), kHi=Math.min(half-2,Math.floor(5000*N/sr));
  let k=-1,m=0,sum=0,cnt=0;
  for(let i=kLo;i<=kHi;i++){ sum+=amp[i]; cnt++; if(amp[i]>m){m=amp[i];k=i;} }
  if(k<0||m<1e-5) return null;
  if(m<8*(sum/Math.max(1,cnt))) return null;
  const a=Math.log(Math.max(amp[k-1],1e-12)), b=Math.log(m),
        c=Math.log(Math.max(amp[k+1],1e-12));
  const den=a-2*b+c;
  const d=Math.abs(den)>1e-12?0.5*(a-c)/den:0;
  return (k+clamp(d,-0.5,0.5))*sr/N;
}
/* 12-TET name + cents against A440 — the KGLW implementation, kept as a
   SECOND implementation beside noteFreq/noteName; selfTest asserts the
   two agree (implement key identities twice) */
function noteOf(f){
  if(!(f>0)) return null;
  const n=Math.round(12*Math.log2(f/440));
  const cents=1200*Math.log2(f/440)-100*n;
  const idx=((n+9)%12+12)%12;
  const oct=4+Math.floor((n+9)/12);
  return {name:NOTE_NAMES[idx]+oct,cents,midiOff:n};
}
/* peak-hold ballistics: hold PEAK_HOLD s, then fall PEAK_DECAY dB/s */
function stepPeakHold(st,peak,now){
  if(peak>=st.v||st.v<=0){ return {v:Math.max(peak,1e-12),t:now}; }
  const dt=Math.max(0,now-st.t-VZ.PEAK_HOLD);
  const v=st.v*Math.pow(10,-VZ.PEAK_DECAY*dt/20);
  if(peak>=v) return {v:Math.max(peak,1e-12),t:now};
  return {v:v,t:st.t};
}
/* waterfall colour: dB in [-range,0] → house neon ramp on black */
function sgColor(db,range){
  const u=clamp((db+range)/range,0,1);
  return mix('#070b18',neonCss(u),Math.pow(u,0.8));
}

/* ---- the frame source: the mix, synthesized ------------------------
   The same series the oscillators hold, at the same set-value map —
   SYNTHESIZED, not recorded, so it exists with the sound off and under
   the harness.  nhCap trades top harmonics for speed: the waterfall
   display caps at VZ.NHWF (printed on the canvas when it bites); the
   SAVED sample never caps beyond the instrument's own 1000. */
function mixInto(out,st,sr,t0,nhCap){
  out.fill(0);
  const chs=[];
  const g1=chan1(st), n1=Math.min(audioNH(g1.f0,sr/2),nhCap||HW.NHMAX);
  if(n1>0) chs.push({co:audioCoeffs(g1.wave,g1.duty,g1.ph,n1),f:g1.f0,a:st.amp/VAFS});
  if(st.ch2){
    const g2=chan2(st), n2=Math.min(audioNH(g2.f0,sr/2),nhCap||HW.NHMAX);
    if(n2>0) chs.push({co:audioCoeffs(g2.wave,g2.duty,g2.ph,n2),f:g2.f0,a:st.amp2/VAFS});
  }
  for(const c of chs)
    for(let i=0;i<out.length;i++)
      out[i]+=c.a*audioEval(c.co,c.f*(t0+i/sr));
  if(st.vol!==1) for(let i=0;i<out.length;i++) out[i]*=st.vol;
  return out;
}
function mixFrame(st,sr,n,t1){
  return mixInto(new Float64Array(n),st,sr,t1-n/sr,VZ.NHWF);
}
/* one waterfall column from a frame: bucketed dB bytes + the raw amps */
function sgColumnOf(x,sr,tabRef){
  const win=tabRef.hann||(tabRef.hann=hannWin(x.length));
  const amp=ampSpectrum(x,win);
  if(!tabRef.tab||tabRef.key!==x.length+':'+sr){
    tabRef.tab=bucketTable(x.length,sr,VZ.NBUCK); tabRef.key=x.length+':'+sr;
  }
  const lv=bucketMax(amp,tabRef.tab), u8=new Uint8Array(VZ.NBUCK);
  for(let b=0;b<VZ.NBUCK;b++){
    const db=dbOfAmp(lv[b]);
    u8[b]=Math.round(clamp((db+VZ.DBRANGE)/VZ.DBRANGE,0,1)*255);
  }
  return {u8,amp};
}

/* ================================================================== *
 *  saving a sample — the mix rendered exactly, encoded as WAV         *
 *  (sound_mixer addition).  16-bit PCM mono.  The buffer is the exact *
 *  truncated series — synthesized by the same math the oscillators    *
 *  play, NOT a recording of the browser's wavetable approximation —   *
 *  and its length snaps to a whole number of common periods (q/f0     *
 *  with channel 2's p:q on, 1/f0 without) so the file loops with a    *
 *  seam under half a sample.  Values are clamped to ±1 exactly as the *
 *  DAC clamps; the panel reports how many samples clipped.            *
 * ================================================================== */
const SAMPLE_RATE=48000, SAMPLE_MAXS=15;
function sampleFrames(st,rate,durS){
  const f0=Math.pow(10,st.freqExp);
  const q=st.ch2?Number(st.ratio.split(':')[1]):1;
  const T=q/f0;
  const k=Math.max(1,Math.round(durS/T));
  return Math.min(Math.round(k*T*rate),rate*SAMPLE_MAXS);
}
function renderSample(st,rate,frames){
  const out=mixInto(new Float64Array(frames),st,rate,0,HW.NHMAX);
  let clips=0;
  for(let i=0;i<frames;i++){
    if(Math.abs(out[i])>=1){ clips++; out[i]=clamp(out[i],-1,1); }
  }
  return {x:out,clips};
}
function wavEncode(x,rate){
  const n=x.length, buf=new ArrayBuffer(44+2*n), dv=new DataView(buf);
  const tag=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  tag(0,'RIFF'); dv.setUint32(4,36+2*n,true); tag(8,'WAVE');
  tag(12,'fmt '); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true);            /* PCM      */
  dv.setUint16(22,1,true);            /* mono     */
  dv.setUint32(24,rate,true);
  dv.setUint32(28,rate*2,true);       /* byteRate */
  dv.setUint16(32,2,true);            /* block    */
  dv.setUint16(34,16,true);           /* bits     */
  tag(36,'data'); dv.setUint32(40,2*n,true);
  for(let i=0;i<n;i++)
    dv.setInt16(44+2*i,Math.round(clamp(x[i],-1,1)*32767),true);
  return buf;
}

/* ================================================================== *
 *  complex arithmetic (pairs [re,im]) and the transfer functions      *
 * ================================================================== */
const cxMul=(a,b)=>[a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const cxAbs=a=>Math.hypot(a[0],a[1]);
const cxScale=(a,s)=>[a[0]*s,a[1]*s];
function cxDiv(a,b){ const d=b[0]*b[0]+b[1]*b[1];
  return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]; }

/* one-pole low pass 1/(1 + i f/fc) and high pass (i f/fc)/(1 + i f/fc) */
function Hlp(f,fc){ const x=f/fc, d=1+x*x; return [1/d,-x/d]; }
function Hhp(f,fc){ const x=f/fc, d=1+x*x; return [x*x/d,x/d]; }
/* the exact two-impedance divider: Z2/(Z1+Z2) = Y1/(Y1+Y2),
   Y = 1/R + i w C — this is the whole 10x probe */
function Hdivider(f,R1,C1,R2,C2){
  const w=TAU*f;
  return cxDiv([1/R1,w*C1],[1/R1+1/R2,w*(C1+C2)]);
}
/* the probe's step-response constants, for the probe view and the tests */
function probeConsts(C1pF){
  const C1=C1pF*1e-12;
  const kC=C1/(C1+C2TOT), kR=HW.RIN/(HW.RPR+HW.RIN);
  const tau=(HW.RPR*HW.RIN/(HW.RPR+HW.RIN))*(C1+C2TOT);
  return {C1,kC,kR,tau};
}
/* steady state of a +-1 square of period T through the divider:
   value just after the + edge, and at the end of the + half period */
function probeCalSS(C1pF,T){
  const {kC,kR,tau}=probeConsts(C1pF);
  const E=Math.exp(-T/2/tau);
  const V1=(kR*(1-E)+2*kC*E)/(1+E);
  return {v0:-V1+2*kC, v1:V1, kC,kR,tau,E};
}

/* connection gain, generator EMF -> volts the scope displays (the 10x
   probe's front-panel factor is folded in, so a perfect path reads 1:1
   with the voltage at the tip).  f=0 is the DC branch.  */
function connGain(st,f){
  if(st.conn==='term'){
    /* feed-through terminator AT the input: a matched line, so the only
       lump left is the scope's own 15 pF against 50||50 */
    const g=50/(HW.RS+50);
    return f===0?[g,0]:cxScale(Hlp(f,1/(TAU*(HW.RS*50/(HW.RS+50))*HW.CIN)),g);
  }
  if(st.conn==='coax'){
    const g=HW.RIN/(HW.RIN+HW.RS);
    if(f===0) return [g,0];
    const Rp=HW.RS*HW.RIN/(HW.RS+HW.RIN);
    return cxScale(Hlp(f,1/(TAU*Rp*C2TOT)),g);
  }
  if(st.conn==='probe'){
    const {C1}=probeConsts(st.trim);
    const Rtip=HW.RPR+HW.RIN;
    const g=Rtip/(Rtip+HW.RS);
    if(f===0) return [g*(HW.RIN/Rtip)*10,0];
    const Ctip=C1*C2TOT/(C1+C2TOT);
    const tip=Hlp(f,1/(TAU*(HW.RS*Rtip/(HW.RS+Rtip))*Ctip));
    return cxScale(cxMul(Hdivider(f,HW.RPR,C1,HW.RIN,C2TOT),tip),g*10);
  }
  throw new Error('connGain: unknown connection "'+st.conn+'"');
}
/* the analog front end: coupling, then the one-pole bandwidth */
function frontGain(st,f){
  const fbw=st.bwlim?HW.FBWL:HW.FBW;
  if(f===0) return [st.coup==='ac'?0:1,0];
  const lp=Hlp(f,fbw);
  return st.coup==='ac'?cxMul(Hhp(f,HW.FAC),lp):lp;
}
function chainGain(st,f,stage){
  /* stage: 'emf' | 'tip' | 'screen' (default) */
  if(stage==='emf') return f===0?[1,0]:[1,0];
  const c=connGain(st,f);
  if(stage==='tip') return c;
  return f===0?[c[0]*frontGain(st,0)[0],0]:cxMul(c,frontGain(st,f));
}

/* ================================================================== *
 *  the signal as a filtered Fourier series — exact LTI steady state   *
 * ================================================================== */
/* channel descriptor from state: what the generator is set to */
function chan1(st){ return {wave:st.wave,f0:Math.pow(10,st.freqExp),
                            amp:st.amp,off:st.off,duty:st.duty,ph:0}; }
function chan2(st){
  const [p,q]=st.ratio.split(':').map(Number);
  return {wave:st.wave2,f0:Math.pow(10,st.freqExp)*p/q,
          amp:st.amp2,off:0,duty:0.5,ph:st.ph2*DEG};
}
/* Build the series SEEN ON SCREEN for a channel.  ch2 always rides the
   1x hi-Z path (stated in the panel); ch1 takes st.conn.
   x(t) = dc + sum Re( (re_n + i im_n) e^{i n w0 t} )                   */
function buildSeries(st,ch,fs,stage){
  const g=ch===2?chan2(st):chan1(st);
  const stC=ch===2?Object.assign({},st,{conn:'coax'}):st;
  const NH=g.wave==='sine'?1:
    Math.min(HW.NHMAX,Math.max(64,Math.ceil(2.5*fs/g.f0)));
  const re=new Float64Array(NH), im=new Float64Array(NH);
  /* Lanczos sigma on a TRUNCATED series (never on a complete one, i.e. a
     sine): a hard cut rings at every jump - the classic Gibbs ears - and
     the instrument's single-pole front end is monotone, so that ringing
     would be a numerical artefact wearing the costume of overshoot.  The
     untapered partial sums live in the spectrum view, where Gibbs is the
     SUBJECT rather than a bug. */
  const taper=g.wave!=='sine';
  for(let n=1;n<=NH;n++){
    const [a,b]=wfCoef(g.wave,n,g.duty);
    /* EMF is twice the set value; phase shift rotates harmonic n by n*ph */
    let c=[2*g.amp*a,-2*g.amp*b];
    if(g.ph){ const cp=Math.cos(n*g.ph),sp=Math.sin(n*g.ph);
              c=cxMul(c,[cp,sp]); }
    c=cxMul(c,chainGain(stC,n*g.f0,stage));
    if(taper){ const x=PI*n/(NH+1), sg=Math.sin(x)/x; c[0]*=sg; c[1]*=sg; }
    re[n-1]=c[0]; im[n-1]=c[1];
  }
  const dc=2*(g.off+g.amp*wfDC(g.wave,g.duty))*chainGain(stC,0,stage)[0];
  return {f0:g.f0,dc,re,im,NH};
}
function seriesEval(ser,t){
  const th=TAU*ser.f0*t;
  const c1=Math.cos(th),s1=Math.sin(th);
  let cn=c1,sn=s1,x=ser.dc;
  const re=ser.re,im=ser.im,N=re.length;
  for(let n=0;n<N;n++){
    x+=re[n]*cn-im[n]*sn;
    const c2=cn*c1-sn*s1; sn=sn*c1+cn*s1; cn=c2;
  }
  return x;
}
/* the same sum by direct trig, no recurrence — selfTest pins one
   against the other, which is what catches a typo in either */
function seriesEvalDirect(ser,t){
  const th=TAU*ser.f0*t;
  let x=ser.dc;
  for(let n=1;n<=ser.re.length;n++)
    x+=ser.re[n-1]*Math.cos(n*th)-ser.im[n-1]*Math.sin(n*th);
  return x;
}

/* ================================================================== *
 *  triggering — root finding on the analytic series                   *
 * ================================================================== */
/* rising/falling crossings of `lev` in [t0, t0+span], holdoff applied */
function findTriggers(ser,lev,slope,t0,span,holdoff){
  const NSC=2400, out=[];
  let tp=t0, xp=seriesEval(ser,t0), last=-Infinity;
  for(let i=1;i<=NSC;i++){
    const t=t0+span*i/NSC, x=seriesEval(ser,t);
    const hit=slope==='rise'?(xp<lev&&x>=lev):(xp>lev&&x<=lev);
    if(hit){
      let a=tp,b=t;
      for(let k=0;k<48;k++){
        const m=0.5*(a+b), xm=seriesEval(ser,m);
        if((slope==='rise')===(xm<lev)) a=m; else b=m;
      }
      const tc=0.5*(a+b);
      if(tc-last>=holdoff){ out.push(tc); last=tc; }
      if(out.length>=64) break;
    }
    tp=t; xp=x;
  }
  return out;
}

/* ================================================================== *
 *  acquisition — the record the scope actually digitises              *
 * ================================================================== */
function sampleRate(st){ const span=HW.DIVH*TDIV[st.tdivI];
  return Math.min(HW.FSMAX,HW.NREC/span); }
/* golden-ratio sequence: the deterministic stand-in for "whenever the
   sweep happens to restart" in free-run */
function freerunPhase(k){ const x=k*0.6180339887498949; return x-Math.floor(x); }

function acquire(st,ser,sweep){
  const tdiv=TDIV[st.tdivI], span=HW.DIVH*tdiv;
  const fs=sampleRate(st), dt=1/fs;
  const lev=st.tlev*VDIV[st.vdivI];
  const hold=st.hold>0?st.hold/ser.f0:0;
  const searchSpan=Math.max(4/ser.f0,2*span)+2*hold;
  const trigs=findTriggers(ser,lev,st.tslope,sweep.tbase,searchSpan,hold);
  const trig=trigs.length>0;
  let tref;
  if(trig) tref=trigs[0];
  else if(st.tmode==='normal') return {none:true,fs,dt,span,trigs,trig:false};
  else tref=sweep.tbase+freerunPhase(sweep.k)/ser.f0;      /* auto: free run */
  const t0=tref-(HW.DIVH/2-st.hpos)*tdiv;
  const y=new Float64Array(HW.NREC);
  for(let i=0;i<HW.NREC;i++) y[i]=seriesEval(ser,t0+i*dt);
  /* the ADC: clip to the 8 divisions, quantise to 8 bits if asked.
     vpos shifts BEFORE the converter, exactly like the front-panel knob */
  const vdiv=VDIV[st.vdivI], half=HW.DIVV/2;
  const lsbDiv=HW.DIVV/Math.pow(2,HW.BITS);
  const d=new Float64Array(HW.NREC);
  let clipped=0;
  for(let i=0;i<HW.NREC;i++){
    let dd=y[i]/vdiv+st.vpos;
    if(dd>half){dd=half;clipped++;} else if(dd<-half){dd=-half;clipped++;}
    if(st.quant8) dd=clamp(Math.round(dd/lsbDiv)*lsbDiv,-half,half);
    d[i]=dd;
  }
  return {t0,dt,fs,span,y:d,yv:y,trig,trigs,tref,clipped,
          lsb:lsbDiv*vdiv,none:false};
}

/* measurements off the record — what the scope SEES, not what was sent */
function measure(rec,st){
  if(rec.none) return null;
  const vdiv=VDIV[st.vdivI];
  const nOn=Math.min(HW.NREC,Math.max(2,Math.round(rec.span/rec.dt)));
  let mn=Infinity,mx=-Infinity,s=0,s2=0;
  const v=new Float64Array(nOn);
  for(let i=0;i<nOn;i++){
    const vv=(rec.y[i]-st.vpos)*vdiv;
    v[i]=vv; s+=vv; s2+=vv*vv;
    if(vv<mn)mn=vv; if(vv>mx)mx=vv;
  }
  const mean=s/nOn, rms=Math.sqrt(s2/nOn);
  /* frequency: rising crossings of the mean, linearly interpolated */
  const cr=[];
  for(let i=1;i<nOn;i++) if(v[i-1]<mean&&v[i]>=mean)
    cr.push((i-1+(mean-v[i-1])/(v[i]-v[i-1]))*rec.dt);
  const freq=cr.length>=2?(cr.length-1)/(cr[cr.length-1]-cr[0]):null;
  /* 10-90 rise on the first clean rising edge */
  let rise=null;
  const lo=mn+0.1*(mx-mn), hi=mn+0.9*(mx-mn);
  for(let i=1;i<nOn;i++){
    if(v[i-1]<lo&&v[i]>=lo){
      const t1=(i-1+(lo-v[i-1])/(v[i]-v[i-1]))*rec.dt;
      for(let j=i;j<nOn;j++){
        if(v[j]<lo&&v[j]<v[j-1]) break;          /* fell back: not this edge */
        if(v[j-1]<hi&&v[j]>=hi){
          rise=(j-1+(hi-v[j-1])/(v[j]-v[j-1]))*rec.dt-t1; break; }
      }
      if(rise!==null) break;
    }
  }
  return {vpp:mx-mn,mean,rms,freq,rise,nOn};
}

/* ================================================================== *
 *  aliasing and reconstruction                                        *
 * ================================================================== */
function foldFreq(f,fs){ return Math.abs(f-fs*Math.round(f/fs)); }
/* Whittaker-Shannon interpolation from the record's own samples */
function sincRecon(rec,t){
  const x=(t-rec.t0)/rec.dt;
  const i0=Math.max(0,Math.ceil(x)-24), i1=Math.min(HW.NREC-1,Math.floor(x)+24);
  let s=0;
  for(let i=i0;i<=i1;i++){
    const a=PI*(x-i);
    s+=rec.y[i]*(Math.abs(a)<1e-9?1:Math.sin(a)/a);
  }
  return s;
}

/* ================================================================== *
 *  the spectrum — radix-2 FFT, asserted against a direct DFT          *
 * ================================================================== */
function fftRadix2(re,im){
  const N=re.length;
  if(N&(N-1)) throw new Error('fftRadix2: N must be a power of two');
  for(let i=1,j=0;i<N;i++){
    let bit=N>>1;
    for(;j&bit;bit>>=1) j^=bit;
    j|=bit;
    if(i<j){ let t=re[i];re[i]=re[j];re[j]=t; t=im[i];im[i]=im[j];im[j]=t; }
  }
  for(let len=2;len<=N;len<<=1){
    const ang=-TAU/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<N;i+=len){
      let cr=1,ci=0;
      for(let k=0;k<len/2;k++){
        const j=i+k, m=i+k+len/2;
        const tr=re[m]*cr-im[m]*ci, ti=re[m]*ci+im[m]*cr;
        re[m]=re[j]-tr; im[m]=im[j]-ti;
        re[j]+=tr; im[j]+=ti;
        const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr;
      }
    }
  }
}
function dftDirect(x){
  const N=x.length, re=new Float64Array(N), im=new Float64Array(N);
  for(let k=0;k<N;k++){ let sr=0,si=0;
    for(let n=0;n<N;n++){ const a=-TAU*k*n/N;
      sr+=x[n]*Math.cos(a); si+=x[n]*Math.sin(a); }
    re[k]=sr; im[k]=si; }
  return {re,im};
}
function hannWin(N){ const w=new Float64Array(N);
  for(let n=0;n<N;n++) w[n]=0.5-0.5*Math.cos(TAU*n/N);
  return w; }
/* one-sided amplitude spectrum of the record, in volts (window-corrected) */
function spectrumOf(rec,st){
  const N=HW.NFFT, vdiv=VDIV[st.vdivI];
  const re=new Float64Array(N), im=new Float64Array(N);
  const w=st.winf==='hann'?hannWin(N):null;
  let wsum=0;
  for(let n=0;n<N;n++){
    const wn=w?w[n]:1; wsum+=wn;
    re[n]=(rec.y[n]-st.vpos)*vdiv*wn;
  }
  fftRadix2(re,im);
  const half=N>>1, amp=new Float64Array(half), binHz=rec.fs/N;
  for(let k=0;k<half;k++)
    amp[k]=(k===0?1:2)*Math.hypot(re[k],im[k])/wsum;
  return {amp,binHz,N,enbwBins:st.winf==='hann'?1.5:1};
}

/* ================================================================== *
 *  the model — everything the views and the readout print             *
 * ================================================================== */
function buildModel(st,sweep){
  sweep=sweep||{k:0,tbase:0};
  const fs=sampleRate(st);
  const g1=chan1(st);
  const ser1=buildSeries(st,1,fs);
  const xy=st.disp==='xy';
  const ser2=(st.ch2||xy)?buildSeries(st,2,fs):null;
  const rec=acquire(st,ser1,sweep);
  const vdiv=VDIV[st.vdivI], tdiv=TDIV[st.tdivI];
  /* channel 2 rides the same timebase and the same trigger — that is
     what "two channels of one scope" means */
  let y2=null;
  if(ser2&&!rec.none){
    y2=new Float64Array(HW.NREC);
    const half=HW.DIVV/2, lsb=HW.DIVV/Math.pow(2,HW.BITS);
    for(let i=0;i<HW.NREC;i++){
      let dd=seriesEval(ser2,rec.t0+i*rec.dt)/vdiv;
      dd=clamp(dd,-half,half);
      if(st.quant8) dd=clamp(Math.round(dd/lsb)*lsb,-half,half);
      y2[i]=dd;
    }
  }
  const meas=measure(rec,st);

  /* landmarks worth printing */
  const fdisp=foldFreq(g1.f0,fs);
  const aliased=g1.f0>fs/2*(1+1e-12);
  const foldH=!aliased&&g1.wave!=='sine'&&ser1.NH*g1.f0>fs/2;
  const gain0=2*cxAbs(chainGain(st,g1.f0));      /* set value -> screen */
  const fbw=st.bwlim?HW.FBWL:HW.FBW;
  const pr=probeConsts(st.trim);
  const comp=Math.abs(st.trim-TRIM_COMP);
  const droop=(st.coup==='ac')?1-Math.exp(-1/(2*g1.f0*(1/(TAU*HW.FAC)))):0;

  const warns=[];
  if(rec.none) warns.push({cls:'bad',txt:'NORMAL mode and no crossing of the level: the screen holds nothing at all.'});
  if(aliased) warns.push({cls:'bad',txt:'f exceeds f<sub>s</sub>/2 — the trace is an <b>alias</b> at '+fmtSI(fdisp,'Hz')+'. The sine is real; the frequency is fiction.'});
  else if(foldH) warns.push({cls:'bad',txt:'the fundamental fits, but harmonics beyond '+fmtSI(fs/2,'Hz')+' fold back into the record.'});
  if(rec.clipped>0) warns.push({cls:'bad',txt:rec.clipped+' samples clipped at the ADC rail — the measurements below are of the CLIPPED trace.'});
  if(st.conn==='coax') warns.push({cls:'',txt:'unterminated hi-Z load: the generator promised '+fmt(2*chan1(st).amp,2)+' V<sub>pp</sub> into 50 Ω, the screen reads ×'+fmt(gain0,3)+' of the set value.'});
  if(st.conn==='probe'&&comp>0.2) warns.push({cls:'bad',txt:'probe '+(st.trim<TRIM_COMP?'UNDER':'OVER')+'-compensated ('+fmt(st.trim,1)+' pF against '+fmt(TRIM_COMP,2)+' pF): flat only at DC and at ∞.'});
  if(st.coup==='ac'&&droop>0.005&&(g1.wave==='square'||g1.wave==='pulse'))
    warns.push({cls:'',txt:'AC coupling tilts each half-period by '+fmt(droop*100,1)+'% — the 10 Hz high-pass forgetting the level.'});
  if(cxAbs(frontGain(st,g1.f0))<0.99&&!aliased)
    warns.push({cls:'',txt:'the '+fmtSI(fbw,'Hz',0)+' front end passes only ×'+fmt(cxAbs(frontGain(st,g1.f0)),3)+' of the fundamental.'});

  const M={st,sweep,fs,g1,ser1,ser2,rec,y2,meas,vdiv,tdiv,
           fdisp,aliased,foldH,gain0,fbw,pr,comp,droop,warns,
           lsb:8*vdiv/256,
           thd:wfThd(g1.wave,g1.duty),
           setrms:Math.sqrt(Math.pow(g1.amp*wfRmsAC(g1.wave,g1.duty),2)+g1.off*g1.off)};
  if(st.view==='spectrum'&&!rec.none){
    M.spec=spectrumOf(rec,st);
    M.lines=[];
    for(let n=1;n<=ser1.NH;n++){
      const a=Math.hypot(ser1.re[n-1],ser1.im[n-1]);
      if(a<1e-5) continue;
      const f=n*g1.f0, ff=foldFreq(f,fs);
      M.lines.push({n,f,ff,amp:a,folded:f>fs/2});
      if(M.lines.length>=320) break;
    }
  }
  if(st.view==='path'){
    M.stages={emf:buildSeries(st,1,fs,'emf'),tip:buildSeries(st,1,fs,'tip')};
  }
  return M;
}

/* ================================================================== *
 *  readout / equation bar / captions                                  *

function readoutHTML(M){
  const st=M.st, meas=M.meas;
  const nm=(function(){
    if(st.view==='trigger') return {t:'the trigger',s:'why the picture stands still'};
    if(st.view==='sampling')return {t:'sampling',s:fmtSI(M.fs,'Sa/s')+' — Nyquist '+fmtSI(M.fs/2,'Hz')};
    if(st.view==='probe')   return {t:'the probe',s:'R₁C₁ = R₂C₂ or it lies'};
    if(st.view==='spectrum')return {t:'the spectrum',s:(st.winf==='hann'?'Hann':'rectangular')+' window, '+HW.NFFT+' points'};
    if(st.view==='path')    return {t:'the path',s:'what happens between the knob and the pixel'};
    if(st.view==='waterfall')return {t:'the waterfall',s:'the mix as time × log-frequency'};
    if(st.disp==='xy')      return {t:'X–Y',s:'channel 1 against channel 2'};
    return {t:'the trace',s:fmtSI(TDIV[st.tdivI],'s')+'/div · '+fmtSI(VDIV[st.vdivI],'V')+'/div'};
  })();
  let s='<div class="rname">'+nm.t+'<small>'+nm.s+'</small></div><table>';
  const r=(k,v,c)=>{ s+='<tr><td>'+k+'</td><td class="v'+(c?' '+c:'')+'">'+v+'</td></tr>'; };
  const hd=t=>{ s+='<tr><td class="hd" colspan="2">'+t+'</td></tr>'; };

  hd('the scope measures');
  if(meas){
    r('V<sub>pp</sub>',fmtSI(meas.vpp,'V'));
    r('V<sub>rms</sub>',fmtSI(meas.rms,'V'));
    r('mean',fmtSI(meas.mean,'V'));
    r('frequency',meas.freq!==null?fmtSI(meas.freq,'Hz'):'—',M.aliased?'bad':'');
    r('rise 10–90',meas.rise!==null?fmtSI(meas.rise,'s'):'—');
  } else r('screen','empty','bad');

  hd('the generator sent');
  r('waveform',WAVES.find(w=>w.id===M.g1.wave).name+(M.g1.wave==='pulse'?' ('+Math.round(M.g1.duty*100)+'%)':''));
  r('f<sub>0</sub>',fmtSI(M.g1.f0,'Hz'),M.aliased?'good':'');
  r('set amplitude','±'+fmt(M.g1.amp,2)+' V into 50 Ω');
  if(M.g1.off) r('offset',fmtSI(M.g1.off,'V'));
  r('true V<sub>rms</sub>',fmtSI(M.setrms,'V')+' into 50 Ω');
  if(M.thd>0&&isFinite(M.thd)) r('THD',fmt(M.thd*100,1)+' %');

  hd('acquisition');
  r('sample rate',fmtSI(M.fs,'Sa/s'));
  r('record',HW.NREC+' pts · '+(meas?meas.nOn:0)+' on screen');
  if(st.quant8) r('8-bit LSB',fmtSI(M.lsb,'V'));
  r('bandwidth',fmtSI(M.fbw,'Hz',0)+(st.bwlim?' (limit in)':''));

  hd('path and trigger');
  r('connection',CONNS.find(c=>c.id===st.conn).name);
  r('set → screen','×'+fmt(M.gain0,4),st.conn==='term'?'good':'');
  r('coupling',st.coup.toUpperCase());
  r('trigger',M.rec.none?'none (normal)':(M.rec.trig?'triggered':'free-run'),
    M.rec.none?'bad':(M.rec.trig?'good':'bad'));

  s+='</table>';
  for(const w of M.warns)
    s+='<div class="note">'+(w.cls==='bad'?'<b>◆</b> ':'')+w.txt+'</div>';
  return s;
}

function eqbarHTML(M){

      +'2 |FFT<sub>2048</sub>[w·x]|<sub>k</sub> / Σw';
    sm='the mix, ninety-odd columns a second — a note is a horizontal line, a glide is a curve, an octave is one ladder rung';
  } else if(v==='trace'&&xy){

  } else if(v==='trace'){
    eq='<span class="lhs">v<sub>screen</sub>(t)</span> = Σ<sub>n</sub> <span class="hl2">H(n f<sub>0</sub>)</span> <span class="hl">c<sub>n</sub></span> e<sup>i 2π n f<sub>0</sub> t</sup>';
    sm='every trace is a sum of sines; the instrument decides how many arrive, and how bent';

    sm='a stable picture is the same picture, started at the same phase every sweep — that is all a trigger is';
  } else if(v==='sampling'){

    sm='one condition makes the divider forget frequency; the trimmer is '+fmt(TRIM_COMP,2)+' pF here, and the cal square is how you find it';
  } else if(v==='spectrum'){
