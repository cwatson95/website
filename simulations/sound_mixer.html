/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
/* strips TAGS as well as decoding entities — canvas has no markup parser,
   and both holes are on the Known-bad list (drum_head.html) */
function plain(s){ return String(s).replace(/<\/?[a-z][^>]{0,24}>/gi,'')
  .replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  const xt=o.xticks||ticksFor(xlo,xhi,6), yt=o.yticks||ticksFor(ylo,yhi,5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* ================================================================== *
 *  the scope screen — graticule and trace plumbing                    *
 * ================================================================== */
const COL={ch1:'#b8ec4c',ch2:'#cd35c4',truth:'#e8843a',struct:'#5ac8e0',
           grid:'#161c29',gridC:'#25304a',screen:'#060a11'};
/* the floating readout lives top-right: about 320 px wide and up to 560
   tall including margins.  Views RESERVE that corner (Known-bad list). */
const RO_W=336, RO_H=568;

function gridBox(ctx,G,ndx,ndy){
  ctx.fillStyle=COL.screen;
  ctx.fillRect(G.x,G.y,G.w,G.h);
  ctx.lineWidth=1;
  ctx.strokeStyle=COL.grid;
  for(let i=0;i<=ndx;i++){ const X=Math.round(G.x+G.w*i/ndx)+0.5;
    ctx.beginPath(); ctx.moveTo(X,G.y); ctx.lineTo(X,G.y1); ctx.stroke(); }
  for(let j=0;j<=ndy;j++){ const Y=Math.round(G.y+G.h*j/ndy)+0.5;
    ctx.beginPath(); ctx.moveTo(G.x,Y); ctx.lineTo(G.x1,Y); ctx.stroke(); }
  /* centre crosshair with 1/5-division minor ticks, like the real glass */
  const cx0=Math.round(G.x+G.w/2)+0.5, cy0=Math.round(G.y+G.h/2)+0.5;
  ctx.strokeStyle=COL.gridC;
  ctx.beginPath(); ctx.moveTo(cx0,G.y); ctx.lineTo(cx0,G.y1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(G.x,cy0); ctx.lineTo(G.x1,cy0); ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<=ndx*5;i++){ const X=G.x+G.w*i/(ndx*5);
    ctx.moveTo(X,cy0-3); ctx.lineTo(X,cy0+3); }
  for(let j=0;j<=ndy*5;j++){ const Y=G.y+G.h*j/(ndy*5);
    ctx.moveTo(cx0-3,Y); ctx.lineTo(cx0+3,Y); }
  ctx.stroke();
  frame(ctx,G,'#2a3145');
}
const divX=(G,xd)=>G.x+G.w*xd/HW.DIVH;
const divY=(G,yd)=>G.y+G.h*(HW.DIVV/2-yd)/HW.DIVV;

/* draw one channel of a record into graticule G.  yArr is in divisions. */
function drawRecord(ctx,G,rec,yArr,col,mode){
  const nOn=Math.min(HW.NREC,Math.round(rec.span/rec.dt));
  const step=Math.max(1,Math.floor(nOn/2400));
  ctx.save();
  ctx.beginPath(); ctx.rect(G.x,G.y,G.w,G.h); ctx.clip();
  if(mode==='dots'||nOn<=64){
    ctx.fillStyle=col;
    for(let i=0;i<nOn;i+=step){
      const X=divX(G,i*rec.dt/rec.span*HW.DIVH), Y=divY(G,yArr[i]);
      ctx.fillRect(X-1.5,Y-1.5,3,3);
    }
  }
  if(mode==='sinc'){
    const xs=[],ys=[];
    const NPX=Math.min(1400,Math.round(G.w));
    for(let p=0;p<=NPX;p++){
      const t=rec.t0+rec.span*p/NPX;
      xs.push(p/NPX*HW.DIVH);
      ys.push(clamp(sincRecon(rec,t),-HW.DIVV/2,HW.DIVV/2));
    }
    polyline(ctx,G,xs,ys,0,HW.DIVH,-HW.DIVV/2,HW.DIVV/2,col,1.7);
  } else if(mode!=='dots'){
    const xs=[],ys=[];
    for(let i=0;i<nOn;i+=step){ xs.push(i*rec.dt/rec.span*HW.DIVH); ys.push(yArr[i]); }
    polyline(ctx,G,xs,ys,0,HW.DIVH,-HW.DIVV/2,HW.DIVV/2,col,1.7);
  }
  ctx.restore();
}

/* trigger-level arrow, trigger-instant caret, ground marker */
function trigMarks(ctx,G,M){
  const st=M.st;
  const yl=divY(G,st.tlev+st.vpos);
  if(yl>G.y&&yl<G.y1){
    ctx.strokeStyle=COL.truth; ctx.lineWidth=1; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(G.x,yl); ctx.lineTo(G.x1,yl); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=COL.truth;
    ctx.beginPath(); ctx.moveTo(G.x1+2,yl); ctx.lineTo(G.x1+10,yl-5);
    ctx.lineTo(G.x1+10,yl+5); ctx.closePath(); ctx.fill();
    ctx.font='10px -apple-system, sans-serif'; ctx.textAlign='left';
    ctx.textBaseline='middle'; ctx.fillText('T',G.x1+13,yl);
  }
  if(M.rec.trig){
    const xd=(M.rec.tref-M.rec.t0)/M.rec.dt*(M.rec.dt/M.rec.span)*HW.DIVH;
    const X=divX(G,xd);
    if(X>G.x&&X<G.x1){
      ctx.fillStyle=COL.truth;
      ctx.beginPath(); ctx.moveTo(X,G.y+9); ctx.lineTo(X-5,G.y+1);
      ctx.lineTo(X+5,G.y+1); ctx.closePath(); ctx.fill();
    }
  }
  const yg=divY(G,M.st.vpos);
  if(yg>G.y&&yg<G.y1){
    ctx.fillStyle=COL.ch1; ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText('1▸',G.x-3,yg);
  }
}

/* ================================================================== *
 *  view: the trace                                                    *
 * ================================================================== */
function drawTrace(ctx,W,H,M,S){
  const st=M.st;
  if(st.disp==='xy') return drawXY(ctx,W,H,M,S);
  const G=box(64,60,W-64-RO_W-34,H-60-158);
  gridBox(ctx,G,HW.DIVH,HW.DIVV);
  if(M.rec.none){
    caption(ctx,G.x+G.w*0.28,G.y+G.h*0.45,
      'NORMAL trigger mode, and the signal never crosses '+fmt(st.tlev,2)
      +' div — the scope is holding the screen blank on purpose. Drop the '
      +'level, or switch back to AUTO.',G.w*0.44,'#8b93a6',
      'italic 13px Georgia, serif');
    trigMarks(ctx,G,M);
    return;
  }
  /* free-run ghosts: what "untriggered" actually looks like */
  if(!M.rec.trig&&st.persist){
    for(let j=5;j>=1;j--){
      const ph=freerunPhase(M.sweep.k-j)/M.g1.f0;
      const xs=[],ys=[];
      for(let p=0;p<=300;p++){
        const t=M.rec.tref-(HW.DIVH/2-st.hpos)*M.tdiv+ph
               +(p/300)*M.rec.span-freerunPhase(M.sweep.k)/M.g1.f0;
        xs.push(p/300*HW.DIVH);
        ys.push(clamp(seriesEval(M.ser1,t)/M.vdiv+st.vpos,-4,4));
      }
      polyline(ctx,G,xs,ys,0,HW.DIVH,-4,4,mix(COL.screen,COL.ch1,0.10+0.07*(5-j)),1.2);
    }
  }
  drawRecord(ctx,G,M.rec,M.rec.y,COL.ch1,st.recon);
  if(M.y2) drawRecord(ctx,G,M.rec,M.y2,COL.ch2,st.recon);
  trigMarks(ctx,G,M);
  /* measurement strip, like the bottom of a real screen */
  const m=M.meas, ty=G.y1+16;
  ctx.font='12px "SF Mono", Menlo, monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle=COL.ch1;
  ctx.fillText(plain('CH1  '+fmtSI(m.vpp,'V')+'pp   '+fmtSI(m.rms,'V')+'rms   mean '
    +fmtSI(m.mean,'V')+'   f '+(m.freq!==null?fmtSI(m.freq,'Hz'):'—')
    +'   rise '+(m.rise!==null?fmtSI(m.rise,'s'):'—')),G.x,ty);
  ctx.fillStyle=M.rec.trig?'#8b93a6':COL.truth;
  ctx.fillText(plain((M.rec.trig?'Trig’d':'AUTO — free run')+'   '
    +fmtSI(M.tdiv,'s')+'/div   '+fmtSI(M.vdiv,'V')+'/div   fs '
    +fmtSI(M.fs,'Sa/s')),G.x,ty+19);
  if(M.aliased){
    ctx.fillStyle=COL.truth;
    ctx.fillText(plain('◆ ALIAS: showing '+fmtSI(M.fdisp,'Hz')+', the input is '
      +fmtSI(M.g1.f0,'Hz')),G.x,ty+38);
  } else if(M.rec.clipped>0){
    ctx.fillStyle=COL.truth;
    ctx.fillText(plain('◆ CLIPPING: '+M.rec.clipped+' samples at the rail'),G.x,ty+38);
  }
  caption(ctx,G.x,G.y-26,'the screen — '+HW.DIVH+' × '+HW.DIVV
    +' divisions, centre-triggered',G.w,'#767e92','italic 13px Georgia, serif');
}

/* ---- X-Y mode -------------------------------------------------- */
function drawXY(ctx,W,H,M,S){
  const st=M.st;
  const avail=Math.min(W-64-RO_W-40,H-60-140);
  const G=box(64+(W-64-RO_W-40-avail)/2,60,avail,avail);
  ctx.fillStyle=COL.screen; ctx.fillRect(G.x,G.y,G.w,G.h);
  ctx.lineWidth=1; ctx.strokeStyle=COL.grid;
  for(let i=0;i<=8;i++){
    const X=Math.round(G.x+G.w*i/8)+0.5, Y=Math.round(G.y+G.h*i/8)+0.5;
    ctx.beginPath(); ctx.moveTo(X,G.y); ctx.lineTo(X,G.y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(G.x,Y); ctx.lineTo(G.x1,Y); ctx.stroke();
  }
  frame(ctx,G,'#2a3145');
  const toX=v=>G.x+G.w*(v+4)/8, toY=v=>G.y+G.h*(4-v)/8;
  /* the analytic figure, closed over q cycles of channel 1 — the truth */
  const [p,q]=st.ratio.split(':').map(Number);
  ctx.save(); ctx.beginPath(); ctx.rect(G.x,G.y,G.w,G.h); ctx.clip();
  ctx.strokeStyle=mix(COL.screen,COL.truth,0.55); ctx.lineWidth=1.1;
  ctx.beginPath();
  const NP=1200, Tclose=q/M.g1.f0;
  for(let i=0;i<=NP;i++){
    const t=Tclose*i/NP;
    const X=toX(clamp(seriesEval(M.ser1,t)/M.vdiv,-4.2,4.2));
    const Y=toY(clamp(seriesEval(M.ser2,t)/M.vdiv,-4.2,4.2));
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
  }
  ctx.stroke();
  /* what the record actually holds (dots so aliasing shows) */
  if(!M.rec.none&&M.y2){
    ctx.fillStyle=COL.ch1;
    const nOn=Math.min(HW.NREC,Math.round(M.rec.span/M.rec.dt));
    const step=Math.max(1,Math.floor(nOn/1600));
    for(let i=0;i<nOn;i+=step){
      const X=toX(M.rec.y[i]-st.vpos), Y=toY(M.y2[i]);
      ctx.fillRect(X-1.4,Y-1.4,2.8,2.8);
    }
  }
  ctx.restore();
  caption(ctx,G.x,G.y-26,'X–Y — channel 1 drives x, channel 2 drives y · ratio '
    +st.ratio+' · Δφ = '+fmt(st.ph2,0)+'°',G.w+80,'#767e92',
    'italic 13px Georgia, serif');
  /* phase from the ellipse, the way it was read before counters existed */
  let ph=null;
  if(p===1&&q===1&&st.wave==='sine'&&st.wave2==='sine'){
    let xmax=0,x0=null;
    for(let i=0;i<=NP;i++){
      const t=Tclose*i/NP, x=seriesEval(M.ser1,t), y=seriesEval(M.ser2,t);
      if(Math.abs(x)>xmax) xmax=Math.abs(x);
      if(i>0){
        const tp=Tclose*(i-1)/NP, yp=seriesEval(M.ser2,tp);
        if(yp<0&&y>=0) x0=Math.abs(x);
      }
    }
    if(xmax>0&&x0!==null) ph=Math.asin(clamp(x0/xmax,0,1))*RAD;
  }
  const cy=G.y1+14;
  ctx.font='12px "SF Mono", Menlo, monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#8b93a6';
  ctx.fillText(plain(ph!==null
    ?'sin φ = x(y=0)/x_max  ⇒  φ = '+fmt(ph,1)+'° (set '
      +fmt(st.ph2>180?360-st.ph2:st.ph2,1)+'°, quadrant-folded)'
    :'lobes touching the top : lobes touching the side = f₂ : f₁ = '+st.ratio),
    G.x,cy);
}

/* ================================================================== *
 *  view: the trigger                                                  *
 * ================================================================== */
function drawTrigger(ctx,W,H,M,S){
  const st=M.st;
  const lev=st.tlev*M.vdiv;
  const wTop=W-64-RO_W-34;
  const A=box(64,66,wTop,Math.round((H-260)*0.46));
  const B=box(64,A.y1+92,wTop,H-158-(A.y1+92));
  /* -- the raw signal, running free ------------------------------- */
  const R=Math.max(3/M.g1.f0,2*M.rec.span);
  const t0=M.sweep.tbase;
  const xs=[],ys=[];
  let ymax=1e-12;
  for(let i=0;i<=900;i++){
    const v=seriesEval(M.ser1,t0+R*i/900);
    xs.push(R*i/900); ys.push(v);
    if(Math.abs(v)>ymax) ymax=Math.abs(v);
  }
  const yr=Math.max(ymax*1.15,Math.abs(lev)*1.3+1e-9);
  axes(ctx,A,0,R,-yr,yr,{title:'the signal, before anybody chooses when to look',
    xfmt:t=>fmtSI(t,'s',1),yfmt:v=>fmtSI(v,'V',1)});
  ctx.save(); ctx.beginPath(); ctx.rect(A.x,A.y,A.w,A.h); ctx.clip();
  /* holdoff shading first, trace on top */
  const hold=st.hold>0?st.hold/M.g1.f0:0;
  const trigs=M.rec.trigs;
  if(hold>0){
    ctx.fillStyle=mix(COL.screen,COL.truth,0.16);
    for(const tc of trigs){
      const x1=A.x+A.w*clamp((tc-t0)/R,0,1), x2=A.x+A.w*clamp((tc+hold-t0)/R,0,1);
      if(x2>x1) ctx.fillRect(x1,A.y,x2-x1,A.h);
    }
  }
  polyline(ctx,A,xs,ys,0,R,-yr,yr,COL.ch1,1.5);
  const yL=A.y1-A.h*(lev+yr)/(2*yr);
  ctx.strokeStyle=COL.truth; ctx.setLineDash([5,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(A.x,yL); ctx.lineTo(A.x1,yL); ctx.stroke();
  ctx.setLineDash([]);
  /* every crossing of the level, and the ones the trigger ACCEPTS */
  const all=findTriggers(M.ser1,lev,st.tslope,t0,R,0);
  ctx.fillStyle='#6f7789';
  for(const tc of all){
    const X=A.x+A.w*(tc-t0)/R;
    ctx.beginPath(); ctx.arc(X,yL,3,0,TAU); ctx.fill();
  }
  ctx.fillStyle=COL.truth;
  for(const tc of trigs){
    if(tc<t0||tc>t0+R) continue;
    const X=A.x+A.w*(tc-t0)/R;
    ctx.beginPath(); ctx.arc(X,yL,4.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(X,A.y+10); ctx.lineTo(X-4,A.y+2);
    ctx.lineTo(X+4,A.y+2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  caption(ctx,A.x,A.y1+30,'grey dots: every '+(st.tslope==='rise'?'rising':'falling')
    +' crossing of L = '+fmtSI(lev,'V')+'.  Orange: the crossings the trigger accepts'
    +(hold>0?' — holdoff '+fmtSI(hold,'s')+' (shaded) swallows the rest.':'.')
    +(st.tmode==='auto'?'  AUTO mode sweeps anyway when nothing crosses.':
      '  NORMAL mode waits, for ever if need be.'),A.w,'#767e92');
  /* -- what accumulates on the phosphor --------------------------- */
  gridBox(ctx,B,HW.DIVH,HW.DIVV);
  const NSW=7;
  for(let j=NSW-1;j>=0;j--){
    let tref;
    if(M.rec.trig&&trigs.length>0) tref=trigs[Math.min(j,trigs.length-1)];
    else if(M.rec.none) break;
    else tref=t0+freerunPhase(M.sweep.k+j)/M.g1.f0;
    const xs2=[],ys2=[];
    for(let p2=0;p2<=340;p2++){
      const t=tref-(HW.DIVH/2-st.hpos)*M.tdiv+(p2/340)*M.rec.span;
      xs2.push(p2/340*HW.DIVH);
      ys2.push(clamp(seriesEval(M.ser1,t)/M.vdiv+st.vpos,-4,4));
    }
    const c=j===0?COL.ch1:mix(COL.screen,COL.ch1,0.14+0.6*Math.pow(0.7,j));
    polyline(ctx,B,xs2,ys2,0,HW.DIVH,-4,4,c,j===0?1.8:1.2);
  }
  if(M.rec.none)
    caption(ctx,B.x+B.w*0.3,B.y+B.h*0.44,'nothing: NORMAL mode with no crossing '
      +'draws no sweep at all',B.w*0.4,'#8b93a6','italic 13px Georgia, serif');
  trigMarks(ctx,B,M);
  caption(ctx,B.x,B.y1+10,M.rec.trig
    ?'seven consecutive sweeps, every one started at the same phase — they land '
     +'exactly on top of one another, which is why the picture stands still.'
    :'seven consecutive sweeps started wherever the free-running timebase happened '
     +'to be: the same signal, smeared into ghosts. This is what "untriggered" means.',
    B.w,'#767e92');
}

/* ================================================================== *
 *  view: sampling                                                     *
 * ================================================================== */
function drawSampling(ctx,W,H,M,S){
  const st=M.st, rec=M.rec;
  const wTop=W-64-RO_W-34;
  const A=box(64,66,wTop,Math.round((H-300)*0.52));
  const yr=4*M.vdiv;
  axes(ctx,A,0,rec.span,-yr,yr,{title:'what the wire carries, and what the record keeps',
    xfmt:t=>fmtSI(t,'s',1),yfmt:v=>fmtSI(v,'V',1)});
  ctx.save(); ctx.beginPath(); ctx.rect(A.x,A.y,A.w,A.h); ctx.clip();
  /* the analog truth, densely (from t=0 if NORMAL mode kept no record) */
  const T0=rec.none?0:rec.t0;
  {
    const xs=[],ys=[];
    for(let i=0;i<=1100;i++){
      const t=T0+rec.span*i/1100;
      xs.push(t-T0); ys.push(seriesEval(M.ser1,t));
    }
    polyline(ctx,A,xs,ys,0,rec.span,-yr,yr,COL.truth,1.3);
  }
  /* the reconstruction the display draws between the dots */
  if(!rec.none){
    const nOn=Math.min(HW.NREC,Math.round(rec.span/rec.dt));
    if(st.recon==='sinc'){
      const xs=[],ys=[];
      for(let p=0;p<=1000;p++){
        const t=rec.t0+rec.span*p/1000;
        xs.push(t-rec.t0); ys.push((sincRecon(rec,t)-st.vpos)*M.vdiv);
      }
      polyline(ctx,A,xs,ys,0,rec.span,-yr,yr,COL.ch1,1.6);
    } else if(st.recon==='linear'){
      const xs=[],ys=[];
      for(let i=0;i<nOn;i++){ xs.push(i*rec.dt); ys.push((rec.y[i]-st.vpos)*M.vdiv); }
      polyline(ctx,A,xs,ys,0,rec.span,-yr,yr,COL.ch1,1.6);
    }
    ctx.fillStyle=COL.ch1;
    const step=Math.max(1,Math.floor(nOn/700));
    for(let i=0;i<nOn;i+=step){
      const X=A.x+A.w*(i*rec.dt)/rec.span, Y=A.y1-A.h*((rec.y[i]-st.vpos)*M.vdiv+yr)/(2*yr);
      ctx.fillRect(X-1.6,Y-1.6,3.2,3.2);
    }
  }
  ctx.restore();
  caption(ctx,A.x,A.y1+30,'orange: the analog signal at the front end, drawn from '
    +'the series itself.  Green dots: the '+fmtSI(M.fs,'Sa/s')+' record — '
    +(M.aliased?'and they trace out '+fmtSI(M.fdisp,'Hz')+', not '
      +fmtSI(M.g1.f0,'Hz')+'. Both curves pass through every dot; the record cannot '
      +'know which one it saw.'
     :'at this timebase they follow the signal faithfully (Nyquist is '
      +fmtSI(M.fs/2,'Hz')+').'),A.w,'#767e92');

  /* -- the folding accordion --------------------------------------- */
  const By=A.y1+96;
  const B=box(64,By,Math.round(wTop*0.56),H-140-By);
  const fmax=Math.max(3*M.fs,M.g1.f0*1.15);
  axes(ctx,B,0,fmax,0,M.fs/2,{title:'the accordion: every input frequency lands somewhere in [0, fs/2]',
    xfmt:f=>fmtSI(f,'Hz',0),yfmt:f=>fmtSI(f,'Hz',0)});
  {
    const xs=[],ys=[];
    for(let i=0;i<=800;i++){ const f=fmax*i/800; xs.push(f); ys.push(foldFreq(f,M.fs)); }
    polyline(ctx,B,xs,ys,0,fmax,0,M.fs/2,COL.struct,1.5);
    ctx.save(); ctx.beginPath(); ctx.rect(B.x,B.y,B.w,B.h); ctx.clip();
    ctx.strokeStyle='#3a4152'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    for(let k=1;k*M.fs/2<=fmax;k++){
      const X=B.x+B.w*(k*M.fs/2)/fmax;
      ctx.beginPath(); ctx.moveTo(X,B.y); ctx.lineTo(X,B.y1); ctx.stroke();
    }
    ctx.setLineDash([]);
    /* the harmonics of a non-sine input each fold on their own */
    if(M.g1.wave!=='sine'){
      ctx.fillStyle=mix(COL.screen,COL.ch2,0.55);
      for(let n=2;n<=M.ser1.NH;n++){
        const f=n*M.g1.f0; if(f>fmax) break;
        const X=B.x+B.w*f/fmax, Y=B.y1-B.h*foldFreq(f,M.fs)/(M.fs/2);
        ctx.fillRect(X-1.5,Y-1.5,3,3);
      }
    }
    ctx.restore();
    const X=B.x+B.w*Math.min(M.g1.f0,fmax)/fmax, Y=B.y1-B.h*M.fdisp/(M.fs/2);
    ctx.fillStyle=COL.ch2;
    ctx.beginPath(); ctx.arc(X,Y,5,0,TAU); ctx.fill();
  }
  const cx0=B.x1+18, cw=wTop-(B.w+18);
  let cy=By+4;
  cy+=caption(ctx,cx0,cy,'f seen = |f − fs·round(f/fs)|',cw,'#aeb6c6',
    'italic 13px Georgia, serif')+6;
  cy+=caption(ctx,cx0,cy,'fs is not a free choice: the record is '+HW.NREC
    +' points spread over 10 divisions, so fs = '+HW.NREC+' / (10 × '
    +fmtSI(M.tdiv,'s')+') = '+fmtSI(HW.NREC/(10*M.tdiv),'Sa/s')
    +(HW.NREC/(10*M.tdiv)>HW.FSMAX?', capped at the digitiser’s '
    +fmtSI(HW.FSMAX,'Sa/s')+'.':'.')
    +' Slow the timebase and the sample rate falls with it — the alias trap '
    +'is set by the most innocent knob on the panel.',cw,'#767e92')+8;
  if(M.g1.wave!=='sine')
    caption(ctx,cx0,cy,'magenta dots: each harmonic of the '
      +WAVES.find(w=>w.id===M.g1.wave).name+' folds separately — a waveform '
      +'can come back wearing a spectrum no generator would ever emit.',cw,'#767e92');
}

/* ================================================================== *
 *  view: the probe                                                    *
 * ================================================================== */
function drawProbe(ctx,W,H,M,S){
  const st=M.st;
  const wAll=W-64-RO_W-34;
  const CIR=box(64,70,Math.round(wAll*0.44),190);
  /* --- the divider, drawn ---------------------------------------- */
  frame(ctx,CIR,'#242a3a');
  ctx.save();
  const midY=CIR.y+CIR.h*0.52, nodeX=CIR.x+CIR.w*0.56;
  const rl=(x,y,w2,h2,lab,val)=>{
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1.4;
    ctx.strokeRect(x,y,w2,h2);
    ctx.fillStyle='#aeb6c6'; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(plain(lab),x+w2/2,y-4);
    ctx.textBaseline='top'; ctx.fillText(plain(val),x+w2/2,y+h2+4);
  };
  const capSym=(x,y,lab,val)=>{
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(x-9,y-5); ctx.lineTo(x+9,y-5);
    ctx.moveTo(x-9,y+5); ctx.lineTo(x+9,y+5); ctx.stroke();
    ctx.fillStyle='#aeb6c6'; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(plain(lab+' '+val),x+14,y);
  };
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(CIR.x+16,midY); ctx.lineTo(CIR.x+52,midY);
  ctx.moveTo(nodeX,midY); ctx.lineTo(CIR.x1-40,midY);
  ctx.stroke();
  ctx.fillStyle='#aeb6c6'; ctx.font='11px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('tip',CIR.x+16,midY-6);
  ctx.textAlign='right'; ctx.fillText('scope',CIR.x1-40,midY-6);
  rl(CIR.x+52,midY-13,nodeX-CIR.x-52-8,26,'R₁ 9 MΩ','');
  /* C1 in parallel below R1; its label sits BELOW the branch wire */
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(CIR.x+71,midY+39); ctx.lineTo(CIR.x+89,midY+39);
  ctx.moveTo(CIR.x+71,midY+49); ctx.lineTo(CIR.x+89,midY+49); ctx.stroke();
  ctx.fillStyle='#aeb6c6'; ctx.font='11px -apple-system, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(plain('C₁ trim '+fmt(st.trim,1)+' pF'),CIR.x+80,midY+56);
  ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(CIR.x+52,midY); ctx.lineTo(CIR.x+52,midY+44); ctx.lineTo(CIR.x+71,midY+44);
  ctx.moveTo(CIR.x+89,midY+44); ctx.lineTo(nodeX-8,midY+44); ctx.lineTo(nodeX-8,midY);
  ctx.stroke();
  /* R2 vertical, label beside it where no wire can cross it */
  ctx.strokeRect(nodeX+30,midY+18,20,28);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(plain('R₂ 1 MΩ'),nodeX+56,midY+32);
  capSym(nodeX+120,midY+37,'C₂',fmt(C2TOT*1e12,0)+' pF');
  ctx.beginPath();
  ctx.moveTo(nodeX+40,midY); ctx.lineTo(nodeX+40,midY+18);
  ctx.moveTo(nodeX+40,midY+46); ctx.lineTo(nodeX+40,midY+62);
  ctx.moveTo(nodeX+120,midY); ctx.lineTo(nodeX+120,midY+32);
  ctx.moveTo(nodeX+120,midY+42); ctx.lineTo(nodeX+120,midY+62);
  ctx.moveTo(nodeX+30,midY+62); ctx.lineTo(nodeX+144,midY+62);
  ctx.stroke();
  for(let g=0;g<3;g++){
    ctx.beginPath();
    ctx.moveTo(nodeX+87-10+g*4,midY+66+g*3); ctx.lineTo(nodeX+87+10-g*4,midY+66+g*3);
    ctx.stroke();
  }
  ctx.restore();
  caption(ctx,CIR.x,CIR.y1+8,'R₂C₂ is the scope and its cable — fixed. '
    +'R₁C₁ is the probe — and C₁ is the screw. Equal time constants: '
    +'a pure ÷10 at every frequency.',CIR.w,'#767e92');

  /* --- the cal square, from the closed form ----------------------- */
  const CAL=box(CIR.x1+64,70,wAll-CIR.w-64,H-70-330);
  const T=1/M.g1.f0;
  const ss=probeCalSS(st.trim,T);
  const A0=M.g1.amp*2*(HW.RPR+HW.RIN)/(HW.RPR+HW.RIN+HW.RS); /* EMF at the tip */
  const ymax=Math.max(ss.v0,ss.kR*1.02,0.115)*A0*10*1.25;
  axes(ctx,CAL,0,2*T,-ymax,ymax,{title:'a ±'+fmt(A0,2)+' V square at '
    +fmtSI(M.g1.f0,'Hz',0)+', through the divider (×10 shown)',
    xfmt:t=>fmtSI(t,'s',1),yfmt:v=>fmtSI(v,'V',1)});
  ctx.save(); ctx.beginPath(); ctx.rect(CAL.x,CAL.y,CAL.w,CAL.h); ctx.clip();
  {
    const xs=[],ys=[],xo=[],yo=[];
    for(let i=0;i<=1200;i++){
      const t=2*T*i/1200;
      const u=(t/T)%1, sgn=u<0.5?1:-1, tin=(u<0.5?u:u-0.5)*T;
      xo.push(t); yo.push(sgn*A0);
      const v=ss.kR+(ss.v0-ss.kR)*Math.exp(-tin/ss.tau);
      xs.push(t); ys.push(sgn*v*A0*10);
    }
    polyline(ctx,CAL,xo,yo,0,2*T,-ymax,ymax,mix(COL.screen,COL.truth,0.6),1.2,[6,4]);
    polyline(ctx,CAL,xs,ys,0,2*T,-ymax,ymax,COL.ch1,1.8);
  }
  ctx.restore();
  caption(ctx,CAL.x,CAL.y1+30,'dashed: the square at the tip.  Green: what the scope '
    +'shows (probe ×10 folded in).  Each edge jumps to the CAPACITIVE ratio '
    +'C₁/(C₁+C₂) = '+fmt(ss.kC,3)+' and settles to the RESISTIVE one '
    +'R₂/(R₁+R₂) = '+fmt(ss.kR,3)+' with τ = '+fmtSI(ss.tau,'s')
    +' — '+(M.comp<=0.2?'and they agree: compensated.'
      :(st.trim<TRIM_COMP?'the spike-and-sag of an under-compensated probe.'
        :'the overshoot of an over-compensated probe.')),CAL.w,'#767e92');

  /* --- |H| over frequency ----------------------------------------- */
  const BO=box(64,Math.max(CIR.y1,CAL.y1)+92,wAll,H-140-(Math.max(CIR.y1,CAL.y1)+92));
  const lf0=2,lf1=8;
  axes(ctx,BO,lf0,lf1,0,2,{title:'|H(f)| × 10 — what "flat" means',
    xticks:[2,3,4,5,6,7,8],xfmt:e=>fmtSI(Math.pow(10,e),'Hz',0),yfmt:v=>fmt(v,1)});
  {
    const xs=[],ys=[];
    for(let i=0;i<=700;i++){
      const lf=lf0+(lf1-lf0)*i/700;
      xs.push(lf); ys.push(cxAbs(Hdivider(Math.pow(10,lf),HW.RPR,st.trim*1e-12,HW.RIN,C2TOT))*10);
    }
    polyline(ctx,BO,xs,ys,lf0,lf1,0,2,COL.ch1,1.8);
    polyline(ctx,BO,[lf0,lf1],[1,1],lf0,lf1,0,2,mix(COL.screen,COL.truth,0.6),1,[6,4]);
    polyline(ctx,BO,[lf0,lf1],[ss.kC*10,ss.kC*10],lf0,lf1,0,2,
             mix(COL.screen,COL.truth,0.6),1,[2,4]);
  }
  caption(ctx,BO.x+10,BO.y+8,'DC asymptote 10·kR = 1.  HF asymptote 10·kC = '
    +fmt(10*ss.kC,2)+'.  The two meet only when R₁C₁ = R₂C₂, i.e. '
    +'C₁ = '+fmt(TRIM_COMP,2)+' pF.',BO.w-260,'#767e92');
}

/* ================================================================== *
 *  view: the spectrum                                                 *
 * ================================================================== */
function drawSpectrum(ctx,W,H,M,S){
  const st=M.st;
  const wAll=W-64-RO_W-34;
  const A=box(64,66,wAll,Math.round((H-300)*0.55));
  if(!M.spec){
    caption(ctx,A.x+40,A.y+40,'no record to transform (NORMAL mode, no trigger).',
      500,'#8b93a6','italic 13px Georgia, serif');
    return;
  }
  const spec=M.spec, half=spec.amp.length;
  const dbOf=v=>20*Math.log10(Math.max(v,1e-9));
  let dmax=-200;
  for(let k=1;k<half;k++) dmax=Math.max(dmax,dbOf(spec.amp[k]));
  const yTop=Math.ceil(dmax/10)*10+10, yBot=yTop-100;
  axes(ctx,A,0,M.fs/2,yBot,yTop,{title:'the record, transformed ('
    +(st.winf==='hann'?'Hann':'rectangular')+' window, '+HW.NFFT+' points)',
    xfmt:f=>fmtSI(f,'Hz',0),yfmt:v=>fmt(v,0)+' dBV'});
  ctx.save(); ctx.beginPath(); ctx.rect(A.x,A.y,A.w,A.h); ctx.clip();
  /* exact series lines first (orange), FFT on top (green) */
  for(const L of M.lines){
    const X=A.x+A.w*L.ff/(M.fs/2);
    const Y=A.y1-A.h*clamp((dbOf(L.amp)-yBot)/(yTop-yBot),0,1);
    ctx.strokeStyle=L.folded?mix(COL.screen,COL.truth,0.75):COL.truth;
    ctx.lineWidth=L.folded?1:1.6;
    if(L.folded) ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(X+1.5,A.y1); ctx.lineTo(X+1.5,Y); ctx.stroke();
    ctx.setLineDash([]);
  }
  {
    const xs=[],ys=[];
    for(let k=0;k<half;k++){ xs.push(k*spec.binHz); ys.push(dbOf(spec.amp[k])); }
    polyline(ctx,A,xs,ys,0,M.fs/2,yBot,yTop,COL.ch1,1.2);
  }
  ctx.restore();
  const cyc=M.g1.f0/spec.binHz;
  caption(ctx,A.x,A.y1+30,'orange stems: the exact series lines |cₙ| after the '
    +'analog path — dashes are lines that live ABOVE Nyquist, drawn where they '
    +'fold to.  Green: the FFT of the record.  The transform window holds '+fmt(cyc,2)
    +' cycles of f₀'+(Math.abs(cyc-Math.round(cyc))<1e-6
      ?' — an integer, so each line sits in one bin.'
      :' — not an integer, so every line LEAKS into its neighbours; the window '
       +'decides how far.'),A.w,'#767e92');

  /* --- built from lines: the partial sum -------------------------- */
  const By=A.y1+92;
  const B=box(64,By,wAll,H-140-By);
  const K=Math.max(1,Math.round(st.klines));
  axes(ctx,B,0,2,-1.5,1.5,{title:'the first '+K+' harmonics of the bare '
    +WAVES.find(w=>w.id===M.g1.wave).name+', summed — Gibbs at every jump',
    xfmt:t=>fmt(t,1)+' T',yfmt:v=>fmt(v,1)});
  ctx.save(); ctx.beginPath(); ctx.rect(B.x,B.y,B.w,B.h); ctx.clip();
  {
    const xs=[],ys=[],xf=[],yf=[];
    for(let i=0;i<=1400;i++){
      const u=2*i/1400;
      let sum=wfDC(M.g1.wave,M.g1.duty);
      for(let n=1;n<=K;n++){
        const [a,b]=wfCoef(M.g1.wave,n,M.g1.duty);
        sum+=a*Math.cos(TAU*n*u)+b*Math.sin(TAU*n*u);
      }
      xs.push(u); ys.push(sum);
      xf.push(u); yf.push(wfSample(M.g1.wave,u,M.g1.duty));
    }
    polyline(ctx,B,xf,yf,0,2,-1.5,1.5,mix(COL.screen,COL.truth,0.5),1.1,[5,4]);
    polyline(ctx,B,xs,ys,0,2,-1.5,1.5,COL.ch1,1.6);
    if(M.g1.wave==='square'){
      const gb=1.1789797444721675;   /* (2/pi) Si(pi), scipy */
      polyline(ctx,B,[0,2],[gb,gb],0,2,-1.5,1.5,'#6f7789',1,[2,4]);
      ctx.fillStyle='#6f7789'; ctx.font='10.5px -apple-system, sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText(plain('(2/π) Si(π) = 1.1790 — the ears never come down'),
        B.x+8,B.y1-B.h*(gb+1.5)/3-4);
    }
  }
  ctx.restore();
}

/* ================================================================== *
 *  view: the path                                                     *
 * ================================================================== */
function drawPath(ctx,W,H,M,S){
  const st=M.st;
  const wAll=W-64-RO_W-34;
  const gap=46;
  const pw=Math.floor((wAll-2*gap)/3);
  const ph=Math.floor((H-260)/2)-30;
  const rowY=[66,66+ph+130];
  const stages=[
    {b:box(64,rowY[0],pw,ph),ser:M.stages.emf,t:'1 · inside the generator',
     n:'EMF = 2 × the set value, behind 50 Ω. The knob assumes a 50 Ω '
      +'load will take half.'},
    {b:box(64+pw+gap,rowY[0],pw,ph),ser:M.stages.tip,t:'2 · at the scope input',
     n:CONNS.find(c=>c.id===st.conn).name+': ×'
      +fmt(2*cxAbs(chainGain(st,M.g1.f0,'tip')),3)+' of the set value at f₀'
      +(st.conn==='coax'?', one pole at '+fmtSI(1/(TAU*(HW.RS*HW.RIN/(HW.RS+HW.RIN))*C2TOT),'Hz',1)
       :st.conn==='probe'?', divider ÷10 re-multiplied by the scope':', matched: flat')+'.'},
    {b:box(64+2*(pw+gap),rowY[0],pw,ph),ser:M.ser1,t:'3 · after the front end',
     n:st.coup.toUpperCase()+' coupling, one pole at '+fmtSI(M.fbw,'Hz',0)
      +(st.bwlim?' (limit in)':'')+'. Rise time ≥ ln9/(2πf) = '
      +fmtSI(Math.log(9)/(TAU*M.fbw),'s')+'.'},
    {b:box(64,rowY[1],pw,ph),rec:true,t:'4 · the record',
     n:fmtSI(M.fs,'Sa/s')+' × '+HW.NREC+' points'
      +(st.quant8?', 8-bit steps of '+fmtSI(M.lsb,'V'):'')
      +(M.aliased?' — ALIASED':'')+'.'},
    {b:box(64+pw+gap,rowY[1],pw,ph),scr:true,t:'5 · the screen',
     n:(M.meas?fmtSI(M.meas.vpp,'V')+'pp drawn at '+fmtSI(M.vdiv,'V')+'/div — '
      +'set was '+fmt(2*M.g1.amp,2)+' Vpp into 50 Ω.':'(no trigger)')},
  ];
  const Tw=2/M.g1.f0;
  for(const sg of stages){
    const b=sg.b;
    let ymax=1e-9;
    const xs=[],ys=[];
    if(sg.rec||sg.scr){
      if(!M.rec.none){
        const nOn=Math.min(HW.NREC,Math.round(M.rec.span/M.rec.dt));
        const step=Math.max(1,Math.floor(nOn/500));
        for(let i=0;i<nOn;i+=step){
          const v=(M.rec.y[i]-st.vpos)*M.vdiv;
          xs.push(i*M.rec.dt); ys.push(v);
          if(Math.abs(v)>ymax) ymax=Math.abs(v);
        }
      }
    } else {
      for(let i=0;i<=420;i++){
        const t=Tw*i/420, v=seriesEval(sg.ser,t);
        xs.push(t); ys.push(v);
        if(Math.abs(v)>ymax) ymax=Math.abs(v);
      }
    }
    const yr=(sg.scr||sg.rec)?4*M.vdiv:ymax*1.2;
    const xspan=(sg.rec||sg.scr)?M.rec.span:Tw;
    axes(ctx,b,0,xspan,-yr,yr,{xfmt:t=>fmtSI(t,'s',1),yfmt:v=>fmtSI(v,'V',0)});
    ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
    if(sg.rec){
      ctx.fillStyle=COL.ch1;
      for(let i=0;i<xs.length;i++){
        const X=b.x+b.w*xs[i]/xspan, Y=b.y1-b.h*(ys[i]+yr)/(2*yr);
        ctx.fillRect(X-1.2,Y-1.2,2.4,2.4);
      }
    } else if(xs.length)
      polyline(ctx,b,xs,ys,0,xspan,-yr,yr,sg.scr?COL.ch1:COL.truth,1.5);
    ctx.restore();
    ctx.fillStyle='#aeb6c6'; ctx.font='italic 12.5px Georgia, serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(plain(sg.t),b.x,b.y-24);
    caption(ctx,b.x,b.y1+26,sg.n,b.w+14,'#767e92');
  }
  /* arrows along the chain */
  ctx.strokeStyle='#3a4152'; ctx.fillStyle='#3a4152'; ctx.lineWidth=1.4;
  const arrow=(x1,y1,x2,y2)=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const a=Math.atan2(y2-y1,x2-x1);
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-9*Math.cos(a-0.4),y2-9*Math.sin(a-0.4));
    ctx.lineTo(x2-9*Math.cos(a+0.4),y2-9*Math.sin(a+0.4));
    ctx.closePath(); ctx.fill();
  };
  const midr=rowY[0]+ph/2;
  arrow(stages[0].b.x1+8,midr,stages[1].b.x-34,midr);
  arrow(stages[1].b.x1+8,midr,stages[2].b.x-34,midr);
  arrow(stages[2].b.x+pw*0.55,rowY[0]+ph+74,stages[3].b.x+pw*0.8,rowY[1]-32);
  arrow(stages[3].b.x1+8,rowY[1]+ph/2,stages[4].b.x-34,rowY[1]+ph/2);
  /* the payoff line */
  caption(ctx,stages[4].b.x1+30,rowY[1]+ph/2-20,
    'five honest stages — and three of them have a knob that can quietly '
    +'change the answer.',wAll-(stages[4].b.x1+30-64)-10,'#8b93a6',
    'italic 13px Georgia, serif');
}

/* ================================================================== *
 *  view: the waterfall — ported from KGLW_visual_player.html          *
 *  (the spectrogram + the meters column, mono).  Columns come from    *
 *  the synthesized mix (always available, harness-drivable) or, when  *
 *  the sound is actually playing in a browser, from an AnalyserNode   *
 *  tap on the master bus — post-fader, the one place the otherwise    *
 *  unverifiable WebAudio graph shows its work.                        *
 * ================================================================== */
function sgEnsureCanvas(S){
  const sg=S.sg;
  if(sg.cvs!==null||typeof document==='undefined') return;
  sg.cvs=false;                       /* tried once; stub stays false  */
  const c=document.createElement('canvas');
  if(!c.getContext) return;
  c.width=512; c.height=VZ.NBUCK;
  const g=c.getContext('2d');
  if(!g||!g.getImageData) return;     /* the DOM stub's recorder: skip */
  sg.cvs=c; sg.cctx=g;
}
function sgPushCol(S,x,sr){
  const sg=S.sg;
  const col=sgColumnOf(x,sr,sg);
  sg.ring.push(col.u8);
  if(sg.ring.length>512) sg.ring.shift();
  sg.head++;
  sg.sr=sr;
  sg.lastAmp=col.amp;
  sg.rms=rmsOf(x,0,x.length);
  sg.pk=peakOf(x,0,x.length);
  sg.clips+=countClips(x,x.length-VZ.HOP,x.length,VZ.CLIP_AT);
  sg.hold=stepPeakHold(sg.hold,sg.pk,sg.t);
  if(sg.cctx){
    const W=sg.cvs.width, xw=(sg.head-1)%W;
    for(let b=0;b<VZ.NBUCK;b++){
      sg.cctx.fillStyle=sgColor(col.u8[b]/255*VZ.DBRANGE-VZ.DBRANGE,VZ.DBRANGE);
      sg.cctx.fillRect(xw,VZ.NBUCK-1-b,1,1);
    }
  }
}
/* first paint arrives full: synthesize NPRE columns of history */
function sgPrefill(S,st){
  const sg=S.sg, sr=SAMPLE_RATE, NPRE=256;
  sg.buf=new Float64Array(VZ.NSGRAM);
  sg.tS=-(NPRE-1)*VZ.HOP/sr;
  mixInto(sg.buf,st,sr,sg.tS-VZ.NSGRAM/sr,VZ.NHWF);
  sgPushCol(S,sg.buf,sr);
  const tail=new Float64Array(VZ.HOP);
  for(let c=1;c<NPRE;c++){
    sg.tS+=VZ.HOP/sr;
    sg.buf.copyWithin(0,VZ.HOP);
    mixInto(tail,st,sr,sg.tS-VZ.HOP/sr,VZ.NHWF);
    sg.buf.set(tail,VZ.NSGRAM-VZ.HOP);
    sgPushCol(S,sg.buf,sr);
  }
  sg.clips=0;                 /* the prefill is history, nothing played */
}
function sgAdvance(S,st,dt){
  const sg=S.sg;
  sgEnsureCanvas(S);
  if(!sg.head) sgPrefill(S,st);
  sg.t+=dt; sg.acc+=dt;
  const tap=S.tapRead?S.tapRead():null;
  const sr=tap?tap.sr:SAMPLE_RATE;
  sg.live=!!tap;
  const per=VZ.HOP/sr;
  let done=0;
  while(sg.acc>per&&done<4){
    sg.acc-=per; done++;
    if(tap){ sgPushCol(S,tap.x,sr); }
    else{
      /* roll the analytic window one hop; tS is the sample-exact clock,
         so consecutive tails are phase-continuous by construction */
      sg.tS+=VZ.HOP/sr;
      sg.buf.copyWithin(0,VZ.HOP);
      const tail=new Float64Array(VZ.HOP);
      mixInto(tail,st,sr,sg.tS-VZ.HOP/sr,VZ.NHWF);
      sg.buf.set(tail,VZ.NSGRAM-VZ.HOP);
      sgPushCol(S,sg.buf,sr);
    }
  }
  if(sg.acc>10*per) sg.acc=0;
}
function drawWaterfall(ctx,W,H,M,S){
  const st=M.st, sg=S.sg;
  sgEnsureCanvas(S);
  if(!sg.head) sgPrefill(S,st);
  const mh=138;
  const b=box(26,16,Math.max(220,W-RO_W-100),Math.max(120,H-mh-16-34));
  ctx.fillStyle='#080b12'; ctx.fillRect(b.x,b.y,b.w,b.h);
  const canBlit=sg.cctx&&typeof ctx.drawImage==='function';
  if(canBlit&&sg.head>0){
    const Wc=sg.cvs.width, n=Math.min(sg.head,Wc), colW=b.w/Wc;
    ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
    if(sg.head<=Wc){                    /* still filling: grow from the right */
      ctx.drawImage(sg.cvs,0,0,n,VZ.NBUCK,b.x1-n*colW,b.y,n*colW,b.h);
    } else {                            /* wrapped ring: two pieces           */
      const x=sg.head%Wc;
      ctx.drawImage(sg.cvs,x,0,Wc-x,VZ.NBUCK,b.x,b.y,(Wc-x)*colW,b.h);
      ctx.drawImage(sg.cvs,0,0,x,VZ.NBUCK,b.x+(Wc-x)*colW,b.y,x*colW,b.h);
    }
    ctx.restore();
  } else if(sg.ring.length){            /* no real canvas: rect fallback */
    const cols=Math.min(sg.ring.length,Math.max(60,Math.floor(b.w/4)));
    const cw=b.w/cols;
    for(let ci=0;ci<cols;ci++){
      const u8=sg.ring[sg.ring.length-cols+ci];
      for(let bkt=0;bkt<VZ.NBUCK;bkt+=2){
        const u=u8[bkt]/255;
        if(u<=0.02) continue;
        ctx.fillStyle=sgColor(u*VZ.DBRANGE-VZ.DBRANGE,VZ.DBRANGE);
        ctx.fillRect(b.x+ci*cw,b.y+b.h*(1-(bkt+2)/VZ.NBUCK),Math.ceil(cw),
                     b.h*2/VZ.NBUCK+0.5);
      }
    }
  }
  frame(ctx,b,'#2a2f3d');
  ctx.font='10px -apple-system, sans-serif'; ctx.fillStyle='#6f7789';
  for(const f of [50,200,1000,5000,20000]){
    const Y=b.y1-b.h*logFx(f,0,1);
    if(Y<b.y+8||Y>b.y1-2) continue;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(fmtSI(f,'Hz',0),b.x1+5,Y);
  }
  const secs=Math.min(sg.head,512)*VZ.HOP/sg.sr;
  const g1=chan1(st), capped=audioNH(g1.f0,sg.sr/2)>VZ.NHWF&&!sg.live;
  ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
  ctx.font='11px "SF Mono", Menlo, monospace';
  ctx.fillText('2048-pt Hann, hop 512 · log f 20 Hz – 20 kHz · '
    +VZ.DBRANGE+' dB range · '+fmt(secs,1)+' s across'
    +(capped?' · series shown ×'+VZ.NHWF+'-capped':''),b.x+2,b.y1+7);
  /* ---- the meters strip (KGLW's column, laid flat) ---- */
  const m=box(26,H-mh+6,W-52,mh-24);
  ctx.fillStyle='#090b11'; ctx.fillRect(m.x,m.y,m.w,m.h);
  frame(ctx,m,'#242a3a');
  const lx=m.x+14; let y=m.y+10;
  ctx.font='italic 15px Georgia, serif'; ctx.fillStyle='#fff';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('the mix',lx,y);
  ctx.font='10.5px "SF Mono", Menlo, monospace';
  ctx.fillStyle=sg.live?'#b8ec4c':'#5ac8e0';
  ctx.fillText(sg.live?'post-fader tap — what the DAC gets'
                      :'the exact series — synthesized'+(st.sound?'':' (sound off)'),lx+76,y+3);
  y+=24;
  /* the mono bar: rms lit, peak shaded, hold tick */
  ctx.fillStyle='#8b93a6'; ctx.font='10px "SF Mono", Menlo, monospace';
  ctx.fillText('mix',lx,y);
  { const bx2=lx+30, bw2=Math.min(m.w-380,520), DB=60;
    const u=v=>clamp((dbOfAmp(v)+DB)/DB,0,1);
    ctx.fillStyle='#161a24'; ctx.fillRect(bx2,y,bw2,9);
    ctx.fillStyle=mix('#080b12','#b8ec4c',0.8);
    ctx.fillRect(bx2,y,bw2*u(sg.rms),9);
    const upk=u(sg.pk), urms=u(sg.rms);
    if(upk>urms){ ctx.fillStyle=mix('#080b12','#b8ec4c',0.45);
      ctx.fillRect(bx2+bw2*urms,y,bw2*(upk-urms),9); }
    ctx.fillStyle=dbOfAmp(sg.hold.v)>-1?'#e8843a':'#e6ecf2';
    ctx.fillRect(bx2+bw2*u(sg.hold.v)-1,y-1,2,11); }
  y+=22;
  const row=(k,v,warn,dx)=>{ ctx.fillStyle='#8b93a6';
    ctx.fillText(k,lx+dx,y);
    ctx.fillStyle=warn?'#e8843a':'#cfd4de';
    ctx.fillText(v,lx+dx+112,y); };
  ctx.font='10.5px "SF Mono", Menlo, monospace';
  row('rms',fmt(dbOfAmp(sg.rms),1)+' dBFS',false,0);
  row('peak hold',fmt(dbOfAmp(sg.hold.v),1)+' dBFS',dbOfAmp(sg.hold.v)>-0.5,240);
  row('clipped',String(sg.clips),sg.clips>0,500); y+=17;
  row('crest',sg.pk>0&&sg.rms>1e-9?fmt(20*Math.log10(sg.pk/sg.rms),1)+' dB':'—',false,0);
  row('rate',fmtSI(sg.sr,'Sa/s',1),false,240);
  row('window',VZ.NSGRAM+' pt',false,500);
  /* the big note, from the last column's spectrum */
  const fDom=sg.lastAmp?domFreq(sg.lastAmp,sg.sr,VZ.NSGRAM):null;
  const note=fDom?noteOf(fDom):null;
  if(note){
    ctx.font='italic 26px Georgia, serif'; ctx.fillStyle='#cd35c4';
    ctx.textAlign='right';
    ctx.fillText(note.name,m.x1-96,m.y+16);
    ctx.font='10.5px "SF Mono", Menlo, monospace'; ctx.fillStyle='#8b93a6';
    const cs=Math.round(note.cents);
    ctx.fillText((cs>=0?'+':'')+cs+'¢ · '+fmtSI(fDom,'Hz'),m.x1-14,m.y+24);
    ctx.textAlign='left';
  }
}

/* ================================================================== *
 *  dispatch                                                           *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='trace')    return drawTrace(ctx,W,H,M,S);
  if(v==='trigger')  return drawTrigger(ctx,W,H,M,S);
  if(v==='sampling') return drawSampling(ctx,W,H,M,S);
  if(v==='probe')    return drawProbe(ctx,W,H,M,S);
  if(v==='spectrum') return drawSpectrum(ctx,W,H,M,S);
  if(v==='path')     return drawPath(ctx,W,H,M,S);
  if(v==='waterfall')return drawWaterfall(ctx,W,H,M,S);
  return drawTrace(ctx,W,H,M,S);
}

/* ================================================================== *
 *  autoset — the front-panel button                                   *
 * ================================================================== */
function autoSet(st){
  const ser=buildSeries(st,1,1e9);
  let mn=1e30,mx=-1e30;
  for(let i=0;i<512;i++){
    const v=seriesEval(ser,i/(512*ser.f0));
    if(v<mn)mn=v; if(v>mx)mx=v;
  }
  const vpp=Math.max(1e-6,mx-mn);
  let vi=VDIV.length-1;
  for(let i=0;i<VDIV.length;i++) if(vpp<=6*VDIV[i]){ vi=i; break; }
  let ti=TDIV.length-1;
  for(let i=0;i<TDIV.length;i++) if(3/ser.f0<=HW.DIVH*TDIV[i]){ ti=i; break; }
  st.vdivI=vi; st.tdivI=ti; st.vpos=0; st.hpos=0;
  st.tlev=clamp(0.5*(mn+mx)/VDIV[vi],-3.9,3.9);
  st.tmode='auto';
  return {vpp,vi,ti};
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  /* a scope's "camera" is its position knobs; cam only carries W/H */
  const cam=makeCamera(0,0.001,10,[0,0,0]);
  const sweep={k:7,tbase:0};
  /* the waterfall's rolling state (sound_mixer addition): the column
     ring, the analytic sample clock tS, the meter ballistics.  History
     survives view switches and generator changes on purpose — watching
     a keyboard melody stack up IS the view. */
  const sg={ring:[],head:0,acc:0,t:0,tS:0,buf:null,hann:null,tab:null,key:'',
            lastAmp:null,rms:0,pk:0,hold:{v:0,t:0},clips:0,sr:SAMPLE_RATE,
            live:false,cvs:null,cctx:null};
  let M=null;
  const S={
    st,cam,sweep,sg,
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st,sweep); },
    fit(){},
    resetView(){ st.hpos=0; st.vpos=0; S.rebuild(); },
    pointer(kind,d){
      if(kind!=='move') return;
      const pxDivX=Math.max(20,(cam.W-64-RO_W-34)/HW.DIVH);
      const pxDivY=Math.max(20,(cam.H-60-158)/HW.DIVV);
      st.hpos=clamp(st.hpos-d.dx/pxDivX,-5,5);
      st.vpos=clamp(st.vpos-d.dy/pxDivY,-4,4);
      S.rebuild();
    },
    wheel(dy){
      st.tdivI=clamp(st.tdivI+(dy>0?1:-1),0,TDIV.length-1);
      S.rebuild();
    },
    step(dt){
      if(st.view==='waterfall') sgAdvance(S,st,dt);
      if(!st.anim) return;
      sweep.k++;
      const m=S.model();
      sweep.tbase+=dt*st.speed*Math.max(m.rec.span,2/m.g1.f0);
      S.rebuild();
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{width:cam.W,height:cam.H};
      const Wd=r.width||cam.W, Hd=r.height||cam.H;
      cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  /* ---- the sound engine: the generator into the DAC (SPACE) ----
     The math it plays is top-level (audioCoeffs/audioNH/audioPeakFS,
     pinned in selfTest); this block is only WebAudio plumbing — the one
     part of the file no harness on this machine can execute, since the
     DOM stub has no AudioContext.  Every entry point is therefore
     guarded on AC so the headless drive still walks the code around it.
     The context is created lazily inside the first play gesture (a
     browser will not start audio outside one), and pause is
     ctx.suspend() so the oscillator phases genuinely freeze. */
  const AC=typeof AudioContext!=='undefined'?AudioContext
          :typeof webkitAudioContext!=='undefined'?webkitAudioContext:null;
  const AUD={ctx:null,master:null,ch:null,key:'',f:0,mtarget:0,
             armAt:-9,rearm:null,stimer:null};
  function audioEnsure(){
    if(AUD.ctx) return;
    AUD.ctx=new AC();
    AUD.master=AUD.ctx.createGain();
    AUD.master.gain.value=0;
    AUD.master.connect(AUD.ctx.destination);
    AUD.ch=[0,1].map(()=>{ const g=AUD.ctx.createGain();
      g.gain.value=0; g.connect(AUD.master); return {g,osc:null}; });
    /* the waterfall's post-fader tap.  The master already drains to the
       destination, so this analyser is pulled (KGLW Known-bad: a branch
       that never reaches the destination is never pulled). */
    AUD.an=AUD.ctx.createAnalyser();
    AUD.an.fftSize=VZ.NSGRAM;
    AUD.an.smoothingTimeConstant=0;
    AUD.master.connect(AUD.an);
    S.tapRead=()=>{
      if(!st.sound||!AUD.ctx||AUD.ctx.state!=='running') return null;
      const x=new Float32Array(VZ.NSGRAM);
      AUD.an.getFloatTimeDomainData(x);
      return {x,sr:AUD.ctx.sampleRate};
    };
  }
  /* (re)build both oscillators phase-locked on ONE context time, so the
     ratio/phase relations the X–Y view draws hold in the audio exactly;
     an 8 ms master dip masks the splice */
  function audioArm(){
    const ctx=AUD.ctx, nyq=ctx.sampleRate/2;
    const t0=ctx.currentTime+0.03;
    [chan1(st),chan2(st)].forEach((g,i)=>{
      const ch=AUD.ch[i];
      if(ch.osc){ try{ ch.osc.stop(t0); }catch(e){} ch.osc=null; }
      const NH=audioNH(g.f0,nyq);
      if(!NH) return;                     /* past Nyquist: silence */
      const co=audioCoeffs(g.wave,g.duty,g.ph,NH);
      const o=ctx.createOscillator();
      o.setPeriodicWave(ctx.createPeriodicWave(
        Float32Array.from(co.re),Float32Array.from(co.im),
        {disableNormalization:true}));
      o.frequency.value=g.f0;
      o.connect(ch.g); o.start(t0); ch.osc=o;
    });
    const gn=AUD.master.gain, now=ctx.currentTime;
    gn.cancelScheduledValues(now); gn.setValueAtTime(gn.value,now);
    gn.linearRampToValueAtTime(0,t0);
    gn.linearRampToValueAtTime(AUD.mtarget=st.sound?st.vol:0,t0+0.008);
    AUD.armAt=now;
  }
  /* collapse a slider's event stream to at most ~6 re-arms a second */
  function audioArmSoon(){
    if(AUD.rearm) return;
    if(AUD.ctx.currentTime-AUD.armAt>0.15) audioArm();
    else AUD.rearm=setTimeout(()=>{ AUD.rearm=null;
      if(st.sound&&AUD.ctx) audioArm(); },180);
  }
  function audioRampMaster(v){
    if(Math.abs(v-AUD.mtarget)<1e-6) return;
    AUD.mtarget=v;
    const gn=AUD.master.gain, now=AUD.ctx.currentTime;
    gn.cancelScheduledValues(now); gn.setValueAtTime(gn.value,now);
    gn.linearRampToValueAtTime(v,now+0.03);
  }
  /* idempotent: called from refresh(), so every control — sliders,
     chips, presets, reset-all — steers the audio with no wiring of its
     own.  Cheap when nothing audio-relevant changed. */
  function audioSync(){
    if(!AC) return;                       /* no DAC in this environment */
    if(!st.sound){
      if(!AUD.ctx) return;                /* never played: nothing to do */
      audioRampMaster(0);                 /* fade, then freeze the clock */
      if(!AUD.stimer) AUD.stimer=setTimeout(()=>{ AUD.stimer=null;
        if(!st.sound&&AUD.ctx&&AUD.ctx.state==='running') AUD.ctx.suspend(); },80);
      return;
    }
    audioEnsure();
    if(AUD.stimer){ clearTimeout(AUD.stimer); AUD.stimer=null; }
    if(AUD.ctx.state==='suspended') AUD.ctx.resume();
    const f1=Math.pow(10,st.freqExp);
    const key=[st.wave,st.wave==='pulse'?st.duty:'',st.ch2,
               st.ch2?st.wave2:'',st.ch2?st.ratio:'',st.ch2?st.ph2:''].join('|');
    if(key!==AUD.key){ AUD.key=key; AUD.f=f1; audioArm(); }
    else if(f1!==AUD.f){
      /* glide phase-continuously now; re-lock the phases (and refit the
         table's harmonic count) shortly after the knob settles */
      AUD.f=f1;
      const nyq=AUD.ctx.sampleRate/2, now=AUD.ctx.currentTime;
      [chan1(st),chan2(st)].forEach((g,i)=>{ const o=AUD.ch[i].osc;
        if(o) o.frequency.setTargetAtTime(Math.min(g.f0,nyq*0.999),now,0.02); });
      audioArmSoon();
    }
    const nyq=AUD.ctx.sampleRate/2, now=AUD.ctx.currentTime;
    const g1=chan1(st), g2=chan2(st);
    AUD.ch[0].g.gain.setTargetAtTime(audioNH(g1.f0,nyq)?st.amp/VAFS:0,now,0.02);
    AUD.ch[1].g.gain.setTargetAtTime(st.ch2&&audioNH(g2.f0,nyq)?st.amp2/VAFS:0,now,0.02);
    audioRampMaster(st.vol);
  }

  const TABS=[['trace','the trace'],['trigger','the trigger'],['sampling','sampling'],
              ['probe','the probe'],['spectrum','the spectrum'],['path','the path'],
              ['waterfall','the waterfall']];
  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      setView(k); S.rebuild(); syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }

  const gPre=h('div',{class:'grp'},h('h3',null,'set-ups'));
  gPre.appendChild(chipRow(PRESETS,'preset',o=>{
    Object.assign(st,o.patch); setView(st.view); syncChips(); }));

  const gGen=h('div',{class:'grp'},h('h3',null,'the generator — channel 1'));
  gGen.appendChild(chipRow(WAVES,'wave'));
  gGen.appendChild(slider('freqExp','frequency',1,7.699,0.001,
    v=>fmtSI(Math.pow(10,v),'Hz')));
  gGen.appendChild(slider('amp','amplitude',0.05,5,0.01,v=>'±'+fmt(v,2)+' V'));
  gGen.appendChild(slider('off','offset',-2.5,2.5,0.01,v=>fmt(v,2)+' V'));
  gGen.appendChild(slider('duty','duty',0.05,0.95,0.01,v=>fmt(v*100,0)+' %'));
  const genTag=h('div',{class:'tag'}); gGen.appendChild(genTag);

  const gCh2=h('div',{class:'grp'},h('h3',null,'channel 2 (1× hi-Z path)'));
  gCh2.appendChild(h('div',{class:'checks'},checkbox('ch2','channel 2 on')));
  gCh2.appendChild(chipRow(WAVES,'wave2'));
  gCh2.appendChild(chipRow(RATIOS.map(r=>({id:r,name:r})),'ratio'));
  gCh2.appendChild(slider('ph2','phase',0,360,1,v=>fmt(v,0)+'°'));
  gCh2.appendChild(slider('amp2','amplitude',0.05,5,0.01,v=>'±'+fmt(v,2)+' V'));

  const gSnd=h('div',{class:'grp'},h('h3',null,'the sound'));
  const sndInp=h('input',{type:'checkbox'}); sndInp.checked=st.sound;
  sndInp.addEventListener('change',()=>{ st.sound=sndInp.checked;
    syncPanel(); refresh(); });
  gSnd.appendChild(h('div',{class:'checks'},
    h('label',null,sndInp,'sound on (space)')));
  gSnd.appendChild(slider('vol','volume',0,2,0.01,v=>'×'+fmt(v,2)));
  const sndTag=h('div',{class:'tag'}); gSnd.appendChild(sndTag);
  /* save a sample: the mix rendered exactly (full series, not the
     ×256-capped display synth), snapped to whole common periods */
  gSnd.appendChild(slider('sdur','sample length',0.25,10,0.05,v=>fmt(v,2)+' s'));
  const savTag=h('div',{class:'tag'});
  function saveSample(){
    const frames=sampleFrames(st,SAMPLE_RATE,st.sdur);
    const r=renderSample(st,SAMPLE_RATE,frames);
    const buf=wavEncode(r.x,SAMPLE_RATE);
    const dur=frames/SAMPLE_RATE;
    const on=noteAt(st.freqExp,st.oct);
    const name='mixer_'
      +(on>=0?noteName(octBase(st.oct)+on).replace('♯','s')
             :fmtSI(Math.pow(10,st.freqExp),'Hz',0).replace(/\s/g,''))
      +'_'+st.wave+(st.ch2?'+'+st.wave2+'_'+st.ratio.replace(':','-'):'')
      +'_'+fmt(dur,2)+'s.wav';
    let saved=false;
    if(typeof Blob!=='undefined'&&typeof URL!=='undefined'&&URL.createObjectURL){
      const a=h('a',{href:URL.createObjectURL(new Blob([buf],{type:'audio/wav'})),
                     download:name});
      document.body.appendChild(a); a.click(); a.remove();
      saved=true;
    }
    savTag.innerHTML=(saved?'saved <b>'+name+'</b>'
                           :'rendered — no download in this environment')
      +'<br>'+fmt(dur,3)+' s · '+frames+' frames · '+(44+2*frames)+' bytes · '
      +(r.clips?'<span class="r">'+r.clips+' clipped samples</span>':'0 clipped')
      +'<br>loops: a whole number of common periods ('
      +(st.ch2?st.ratio.split(':')[1]:'1')+'/f₀), seam under half a sample';
  }
  gSnd.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:saveSample},'save .wav sample')));
  gSnd.appendChild(savTag);

  const gConn=h('div',{class:'grp'},h('h3',null,'the connection'));
  gConn.appendChild(chipRow(CONNS,'conn'));
  gConn.appendChild(slider('trim','trimmer C₁',3,30,0.1,v=>fmt(v,1)+' pF'));
  const connTag=h('div',{class:'tag'}); gConn.appendChild(connTag);

  const gVert=h('div',{class:'grp'},h('h3',null,'vertical'));
  gVert.appendChild(slider('vdivI','scale',0,VDIV.length-1,1,
    v=>fmtSI(VDIV[Math.round(v)],'V')+'/div'));
  gVert.appendChild(slider('vpos','position',-4,4,0.05,v=>fmt(v,2)+' div'));
  gVert.appendChild(chipRow([{id:'dc',name:'DC'},{id:'ac',name:'AC'}],'coup'));
  gVert.appendChild(h('div',{class:'checks'},
    checkbox('bwlim','20 MHz bandwidth limit')));

  const gHor=h('div',{class:'grp'},h('h3',null,'horizontal'));
  gHor.appendChild(slider('tdivI','timebase',0,TDIV.length-1,1,
    v=>fmtSI(TDIV[Math.round(v)],'s')+'/div'));
  gHor.appendChild(slider('hpos','position',-5,5,0.05,v=>fmt(v,2)+' div'));
  const horTag=h('div',{class:'tag'}); gHor.appendChild(horTag);

  const gTrig=h('div',{class:'grp'},h('h3',null,'trigger'));
  gTrig.appendChild(slider('tlev','level',-4,4,0.05,v=>fmt(v,2)+' div'));
  gTrig.appendChild(chipRow([{id:'rise',name:'rising'},{id:'fall',name:'falling'}],'tslope'));
  gTrig.appendChild(chipRow([{id:'auto',name:'auto'},{id:'normal',name:'normal'}],'tmode'));
  gTrig.appendChild(slider('hold','holdoff',0,5,0.05,v=>fmt(v,2)+' periods'));

  const gSpec=h('div',{class:'grp'},h('h3',null,'the spectrum'));
  gSpec.appendChild(chipRow([{id:'hann',name:'Hann'},{id:'rect',name:'rectangular'}],'winf'));
  gSpec.appendChild(slider('klines','harmonics drawn',1,99,1,v=>fmt(v,0)));

  const gDisp=h('div',{class:'grp'},h('h3',null,'display'));
  gDisp.appendChild(chipRow([{id:'yt',name:'Y–T'},{id:'xy',name:'X–Y'}],'disp'));
  gDisp.appendChild(chipRow([{id:'dots',name:'dots'},{id:'linear',name:'vectors'},
    {id:'sinc',name:'sin x / x'}],'recon'));
  const dchecks=h('div',{class:'checks'},
    checkbox('quant8','8-bit ADC'),
    checkbox('persist','persistence ghosts'),
    checkbox('anim','animate (run)'));
  gDisp.appendChild(dchecks);
  gDisp.appendChild(slider('speed','speed',0.2,5,0.1,v=>fmt(v,1)+'×'));
  gDisp.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ autoSet(st); S.rebuild(); syncPanel(); dirty=true; refresh(); }},'auto set'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.sweep.k=7; S.sweep.tbase=0;
      setView(st.view); S.rebuild(); S.resetView(); syncChips(); syncPanel();
      dirty=true; refresh(); }},'reset all')));
  gDisp.appendChild(h('div',{class:'src'},
    'every reference number in this file is a mathematical closed form, '
    +'checked against scipy — the hardware values (1 MΩ ‖ 15 pF input, 9 MΩ '
    +'probe, 115 pF of cable, 100 MHz front end) are typical bench parts.'));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gPre,gGen,gCh2,gSnd,gConn,gVert,gHor,gTrig,gSpec,gDisp,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  /* ---- the keyboard: 25 keys, low C to high C, bottom of the screen.
     Clicking a key sets the SAME log-frequency knob the slider drives,
     so channel 2 keeps its p:q ratio — the keyboard plays intervals
     through the ratio chips. ---- */
  const keysEl=document.getElementById('keys');
  const WHITE_OF=[0,0,1,1,2,3,3,4,4,5,5,6]; /* white index at/left of semitone */
  const IS_BLACK=[0,1,0,1,0,0,1,0,1,0,1,0];
  const NWHITE=15;
  const kbKeys=[], kbLabels=[];
  const kbDn=h('button',{class:'kbtn',title:'octave down (z)',
    onclick:()=>kbShift(-1)},'octave −');
  const kbUp=h('button',{class:'kbtn',title:'octave up (x)',
    onclick:()=>kbShift(+1)},'octave +');
  const kbRange=h('div',{class:'krange'});
  const kbInfo=h('div',{class:'kinfo'});
  const kbWrap=h('div',{id:'kbwrap'});
  for(let k=0;k<=KB_SPAN;k++){
    const w=Math.floor(k/12)*7+WHITE_OF[k%12];
    const black=k<KB_SPAN&&IS_BLACK[k%12]===1;
    const el=h('button',{class:black?'bk':'wk'},black?null:h('span'));
    if(black){ el.style.left=((w+1)/NWHITE-0.31/NWHITE)*100+'%';
               el.style.width=(0.62/NWHITE)*100+'%'; }
    else     { el.style.left=(w/NWHITE)*100+'%';
               el.style.width=(1/NWHITE)*100+'%'; }
    el.addEventListener('click',()=>kbPick(k));
    kbWrap.appendChild(el);
    kbKeys.push({el,k,black});
    if(!black&&k%12===0) kbLabels.push({sp:el.children[0],k});
  }
  keysEl.appendChild(h('div',{class:'kside'},
    h('div',{class:'krow'},kbDn,kbUp),kbRange,kbInfo));
  keysEl.appendChild(kbWrap);
  function kbPick(k){
    st.freqExp=Math.log10(noteFreq(octBase(st.oct)+k));
    S.rebuild(); syncPanel(); refresh();
  }
  function kbShift(d){
    const o=clamp(st.oct+d,KB_OCT_LO,KB_OCT_HI);
    if(o===st.oct) return;
    st.oct=o;
    /* transpose the pitch WITH the window: the lit key stays lit and
       what you hear moves by exactly one octave (1 and 7.699 are the
       frequency slider's own rails) */
    st.freqExp=clamp(st.freqExp+d*Math.log10(2),1,7.699);
    S.rebuild(); syncPanel(); refresh();
  }
  function syncKeys(){
    const on=noteAt(st.freqExp,st.oct);
    for(const K of kbKeys)
      K.el.className=(K.black?'bk':'wk')+(K.k===on?' on':'');
    for(const L of kbLabels) L.sp.textContent=noteName(octBase(st.oct)+L.k);
    kbRange.textContent='24 semitones · '+noteName(octBase(st.oct))+' … '
      +noteName(octBase(st.oct)+KB_SPAN)+' · z/x octave';
    kbDn.disabled=st.oct<=KB_OCT_LO; kbUp.disabled=st.oct>=KB_OCT_HI;
    const f=Math.pow(10,st.freqExp);
    kbInfo.innerHTML=on>=0
      ? '<b>'+noteName(octBase(st.oct)+on)+'</b> · '+fmtSI(f,'Hz')
      : fmtSI(f,'Hz')+' — between keys';
  }

  function syncChips(){
    [[gPre,PRESETS,'preset'],[gGen,WAVES,'wave'],[gConn,CONNS,'conn']].forEach(([g,list,key])=>{
      const cw=g.querySelector('.chips'); if(!cw) return;
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
    });
    /* rows with two chip groups sync coarsely: rebuild classes from state */
    const pairs=[[gCh2,[WAVES,'wave2'],[RATIOS.map(r=>({id:r})),'ratio']],
                 [gVert,[[{id:'dc'},{id:'ac'}],'coup']],
                 [gTrig,[[{id:'rise'},{id:'fall'}],'tslope'],[[{id:'auto'},{id:'normal'}],'tmode']],
                 [gSpec,[[{id:'hann'},{id:'rect'}],'winf']],
                 [gDisp,[[{id:'yt'},{id:'xy'}],'disp'],
                        [[{id:'dots'},{id:'linear'},{id:'sinc'}],'recon']]];
    for(const [g,...specs] of pairs){
      const cws=[];
      const walk=n=>{ for(const ch of n.children||[]){
        if(ch.className==='chips') cws.push(ch); walk(ch); } };
      walk(g);
      specs.forEach(([list,key],i)=>{
        const cw=cws[i]; if(!cw) return;
        [].forEach.call(cw.children,(b,j)=>
          b.className='chip'+(list[j].id===st[key]?' on':''));
      });
    }
  }
  function syncPanel(){
    const v=st.view;
    rows.duty.row.hidden = (st.wave!=='pulse');
    gCh2.hidden  = (v!=='trace');
    gSpec.hidden = (v!=='spectrum');
    gTrig.hidden = (v==='probe'||v==='spectrum'||v==='path');
    rows.trim.row.hidden = (st.conn!=='probe');
    rows.speed.row.hidden= !st.anim;
    rows.ph2.row.hidden  = rows.amp2.row.hidden = !(st.ch2||st.disp==='xy');
    sndInp.checked = st.sound;
    for(const k in rows) rows[k].sync();
    [].forEach.call(dchecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['quant8','persist','anim'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = st.view==='trace'
        ? 'space plays/pauses the sound · drag to move the trace (position knobs) · scroll to step the timebase · a auto-sets · r recentres'
        : st.view==='trigger' ? 'slide the level through the peaks and watch the picture let go'
        : st.view==='sampling' ? 'scroll the timebase slower and watch the dots stop keeping up'
        : st.view==='probe' ? 'the trimmer slider is the screw on the side of a real probe'
        : st.view==='spectrum' ? 'switch windows on a non-integer cycle count — the leakage is the window, not the signal'
        : st.view==='waterfall' ? 'play the keyboard and watch the notes stack — z/x jump the ladder an octave'
        : 'switch the connection and watch stage 2 break its promise';
      subEl.innerHTML = st.view==='path'
        ? 'the amplitude knob is a promise about a 50 Ω load &mdash; stage 2 is where it is kept or broken'
        : st.view==='spectrum'
        ? 'one record, two honest descriptions &mdash; and the window is the treaty between them'
        : M.aliased
        ? 'f<sub>s</sub>/2 = '+fmtSI(M.fs/2,'Hz')+' and the signal is past it &mdash; the trace is real, the frequency is fiction'
        : 'a generator promises, a scope reports &mdash; the path between them edits both';
      genTag.innerHTML='f₀ = <b>'+fmtSI(M.g1.f0,'Hz')+'</b> &nbsp; set <b>±'
        +fmt(M.g1.amp,2)+' V</b> into 50 Ω'
        +(M.thd>0&&isFinite(M.thd)?' &nbsp; THD <b>'+fmt(M.thd*100,1)+'%</b>':'');
      connTag.innerHTML=(st.conn==='term'
          ?'matched: <b>×1.000</b> of set, flat'
          :st.conn==='coax'
          ?'hi-Z: <b>×'+fmt(M.gain0,4)+'</b> of set &nbsp; pole <b>'
            +fmtSI(1/(TAU*(HW.RS*HW.RIN/(HW.RS+HW.RIN))*C2TOT),'Hz',1)+'</b>'
          :'probe ÷10, re-gained ×10 &nbsp; '
            +(M.comp<=0.2?'<span class="g">compensated</span>'
              :'<span class="r">'+(st.trim<TRIM_COMP?'under':'over')+'-compensated</span>'))
        +'<br>set → screen <b>×'+fmt(M.gain0,4)+'</b> at f₀';
      audioSync();
      { const nyqA=AUD.ctx?AUD.ctx.sampleRate/2:24000;
        const n1=audioNH(M.g1.f0,nyqA), g2=chan2(st), n2=audioNH(g2.f0,nyqA);
        const pk=audioPeakFS(st,nyqA);
        sndTag.innerHTML=(AC?(st.sound?'<b>▶ playing</b> — space pauses'
                                      :'<b>‖ paused</b> — space plays')
            :'<span class="r">no audio output in this environment</span>')
          +' &nbsp; DAC '+fmtSI(nyqA*2,'Sa/s',0)+(AUD.ctx?'':' (nominal)')
          +'<br>ch 1 '+(n1?'<b>'+n1+'</b> harmonic'+(n1>1?'s':'')+' under Nyquist'
                          :'<span class="r">f₀ ≥ Nyquist — silent</span>')
          +(st.ch2?' · ch 2 '+(n2?'<b>'+n2+'</b>':'<span class="r">silent</span>'):'')
          +'<br>mix peaks ≤ <b>'+fmt(pk*100,1)+'% FS</b>'
          +(pk>0?' ('+fmt(20*Math.log10(pk),1)+' dBFS)':'')
          +(pk>1?' <span class="r">CLIPS</span>':'')
          +'<br>you hear the SET value: ±'+fmt(VAFS,0)+' V of mix = full scale'
          +' · DC never reaches the speaker'; }
      syncKeys();
      horTag.innerHTML='f<sub>s</sub> = <b>'+fmtSI(M.fs,'Sa/s')+'</b> &nbsp; Nyquist <b>'
        +fmtSI(M.fs/2,'Hz')+'</b>'
        +(M.aliased?' &nbsp;<span class="r">ALIASED</span>'
          :M.foldH?' &nbsp;<span class="r">harmonics fold</span>':'');
      infoEl.innerHTML=INFO[st.view]||INFO.trace;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Interactions mark the loop dirty; the loop repaints on dirty || run.
     (Known-bad list: a camera that moves without asking for a frame.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY);
    dirty=true; refresh(); },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.sound=!st.sound; syncPanel(); refresh(); }
    else if(e.key==='z'){ kbShift(-1); }
    else if(e.key==='x'){ kbShift(+1); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='a'){ autoSet(st); S.rebuild(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='7'){ setView(TABS[+e.key-1][0]);
      S.rebuild(); syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(st.anim||dirty||st.view==='waterfall'){
      dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

/* ================================================================== *
 *  self-test                                                          *
 *                                                                     *
 *  Reference values marked (scipy) were computed OUTSIDE this file    *
 *  with scipy 1.18 / numpy 2.5 (build_scope/derive.py) and pasted in. *
 *  Values are asserted off BUILT models wherever possible, never off  *
 *  a re-typed formula (Known-bad list, drum_head.html).               *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,n)=>{ if(c){pass++;} else {fail++; console.log('FAIL: '+n);} };
  const close=(a,b,tol,n)=>ok(isFinite(a)&&Math.abs(a-b)<=tol,
    n+' ['+a+' vs '+b+' tol '+tol+']');
  const rel=(a,b,rt,n)=>ok(isFinite(a)&&Math.abs(a-b)<=rt*Math.abs(b),
    n+' ['+a+' vs '+b+' rel '+rt+']');

  /* ---------- A. waveforms and series ---------- */
  {
    const KINDS=['sine','square','triangle','saw','pulse'];
    /* RMS closed forms vs midpoint integration (scipy: same numbers) */
    const REF={sine:7.07106781186547e-01,square:1,triangle:5.77350269189626e-01,
               saw:5.77350269189626e-01,pulse:1};
    for(const k of KINDS){
      let s2=0; const N=40000;
      for(let i=0;i<N;i++){ const v=wfSample(k,(i+0.5)/N,0.3); s2+=v*v; }
      rel(Math.sqrt(s2/N),REF[k],1e-6,'rms['+k+'] closed form (scipy)');
      rel(wfRmsAC(k,0.3),k==='pulse'?9.16515138991168e-01:REF[k],1e-12,
        'wfRmsAC['+k+'] (scipy)');
    }
    /* mean of the pulse is 2d-1 */
    { let s=0; const N=40000;
      for(let i=0;i<N;i++) s+=wfSample('pulse',(i+0.5)/N,0.3);
      close(s/N,-0.4,1e-6,'pulse mean d=0.3 = 2d-1'); }
    /* Fourier coefficients: closed form vs numeric integrals */
    for(const [k,n,ai,bi] of [
      ['square',1,0, 1.273239544735e+00],['square',3,0, 4.244131815784e-01],
      ['square',2,0,0],
      ['triangle',3,0,-9.006327434874e-02],['triangle',5,0,3.242277876555e-02],
      ['saw',2,0,-3.183098861838e-01],['saw',5,0,1.273239544735e-01],
      ['pulse',1,6.054613829125e-01,8.333461009843e-01],
      ['pulse',5,0,2.546479089470e-01],
      ['pulse',8,4.677446418943e-02,1.439569983960e-01]]){
      const [a,b]=wfCoef(k,n,0.3);
      close(a,ai,1e-11,'a_'+n+'['+k+'] (scipy)');
      close(b,bi,1e-11,'b_'+n+'['+k+'] (scipy)');
      let na=0,nb=0; const N=20000;
      for(let i=0;i<N;i++){ const u=(i+0.5)/N, v=wfSample(k,u,0.3);
        na+=2*v*Math.cos(TAU*n*u)/N; nb+=2*v*Math.sin(TAU*n*u)/N; }
      close(na,a,2e-4,'a_'+n+'['+k+'] numeric integral agrees');
      close(nb,b,2e-4,'b_'+n+'['+k+'] numeric integral agrees');
    }
    /* partial sums, 21 harmonics (scipy) */
    const PS={square:[9.82090182357003e-01,9.72877154352397e-01],
              triangle:[4.00992806525703e-01,9.24042918363069e-01],
              saw:[2.12654691556058e-01,4.53702194787869e-01],
              pulse:[9.76438986872583e-01,1.04587158063169e+00]};
    for(const k in PS) for(const [j,u] of [[0,0.10],[1,0.23]]){
      let s=k==='pulse'?wfDC(k,0.3):0;
      for(let n=1;n<=21;n++){ const [a,b]=wfCoef(k,n,0.3);
        s+=a*Math.cos(TAU*n*u)+b*Math.sin(TAU*n*u); }
      close(s,PS[k][j],1e-11,'partial21['+k+'](u='+u+') (scipy)');
    }
    /* Gibbs: the 49-harmonic max on the derive.py grid, and the limit */
    { let mx=-9;
      for(let i=0;i<=4000;i++){ const u=0.5*i/4000; let s=0;
        for(let n=1;n<50;n+=2) s+=(4/(n*PI))*Math.sin(TAU*n*u);
        if(s>mx)mx=s; }
      close(mx,1.17911310188829e+00,1e-9,'Gibbs partial49 max (scipy)');
      close(mx,1.1789797444721675,3e-4,'…approaches (2/pi) Si(pi) (scipy)'); }
    /* THD closed forms vs coefficient sums */
    for(const k of ['square','saw','triangle']){
      let p1=0,pt=0;
      for(let n=1;n<=20000;n++){ const [a,b]=wfCoef(k,n,0.3);
        const p=a*a+b*b; if(n===1)p1=p; pt+=p; }
      rel(Math.sqrt((pt-p1)/p1),wfThd(k,0.3),5e-4,'THD['+k+'] closed form');
    }
    close(wfThd('square',0.5),4.83425847608679e-01,1e-9,'THD[square] value');
    close(wfThd('sine',0.5),0,1e-15,'THD[sine] = 0');
    /* the recurrence in seriesEval against direct trig */
    { const st0=Object.assign({},DEFAULTS,{wave:'square'});
      const ser=buildSeries(st0,1,120*Math.pow(10,st0.freqExp)); /* NH=300 */
      ok(ser.NH===300,'NH follows 2.5 fs/f0 ('+ser.NH+')');
      for(const t of [0,1.3e-4,7.7e-4,2.5e-3])
        close(seriesEval(ser,t),seriesEvalDirect(ser,t),1e-9,
          'recurrence = direct trig at t='+t); }
    /* phase: a sine shifted 90 deg is a cosine */
    { const st0=Object.assign({},DEFAULTS,{ch2:true,wave2:'sine',ratio:'1:1',
        ph2:90,amp2:1,conn:'term'});
      const ser=buildSeries(st0,2,1e6);
      const g=cxAbs(chainGain(Object.assign({},st0,{conn:'coax'}),1000));
      rel(seriesEval(ser,0)/(2*g),Math.cos(Math.atan2(
        -chainGain(Object.assign({},st0,{conn:'coax'}),1000)[1],
         chainGain(Object.assign({},st0,{conn:'coax'}),1000)[0])),2e-3,
        'ph2=90 deg turns sin into cos (up to the path phase)'); }
  }

  /* ---------- B. the analog path ---------- */
  {
    close(TRIM_COMP*1e-12,1.27777777777778e-11,1e-23,'compensated C1 (scipy)');
    const u6=probeConsts(6), uc=probeConsts(TRIM_COMP), o25=probeConsts(25);
    close(u6.kC,0.049586776860,1e-9,'kC at 6 pF');
    close(u6.tau,108.9e-6,1e-12,'tau at 6 pF = 108.9 us');
    close(o25.tau,126.0e-6,1e-12,'tau at 25 pF = 126.0 us');
    close(uc.kC,0.1,1e-12,'compensated: kC = kR = 1/10');
    close(uc.kR,0.1,1e-12,'kR = R2/(R1+R2) = 1/10');
    /* step responses (scipy solve_ivp cross-checked) */
    const step=(pc,t)=>pc.kR+(pc.kC-pc.kR)*Math.exp(-t/pc.tau);
    close(step(u6,1e-6),5.00475892042433e-02,1e-12,'step 6pF @1us (scipy)');
    close(step(u6,100e-6),7.98746571533423e-02,1e-12,'step 6pF @100us (scipy)');
    close(step(o25,5e-6),1.75514567864411e-01,1e-12,'step 25pF @5us (scipy)');
    close(step(uc,20e-6),0.1,1e-12,'step comp @20us stays 1/10');
    /* cal-square steady state (scipy) */
    const s6=probeCalSS(6,1e-3), s25=probeCalSS(25,1e-3);
    close(s6.v0,1.85569875408423e-04,1e-12,'cal square v(0+) 6pF (scipy)');
    close(s6.v1,9.89879838435998e-02,1e-12,'cal square v(T/2-) 6pF (scipy)');
    close(s25.v0,2.54226977813706e-01,1e-12,'cal square v(0+) 25pF (scipy)');
    close(s25.v1,1.02915879329152e-01,1e-12,'cal square v(T/2-) 25pF (scipy)');
    /* |H| of the divider (scipy) */
    close(cxAbs(Hdivider(1e5,HW.RPR,6e-12,HW.RIN,C2TOT)),
      4.96030122393664e-02,1e-12,'|H(100kHz)| 6pF (scipy)');
    close(cxAbs(Hdivider(1e5,HW.RPR,25e-12,HW.RIN,C2TOT)),
      1.78561651674701e-01,1e-12,'|H(100kHz)| 25pF (scipy)');
    /* compensated: flat over 7 decades */
    { let worst=0;
      for(let i=0;i<=70;i++){
        const f=Math.pow(10,1+6*i/70);
        worst=Math.max(worst,Math.abs(cxAbs(Hdivider(f,HW.RPR,TRIM_COMP*1e-12,
          HW.RIN,C2TOT))*10-1)); }
      ok(worst<1e-9,'compensated divider flat to 1e-9 over 10 Hz - 10 MHz ('+worst+')'); }
    /* the series through the divider lands on the closed form */
    { const T=1e-3, ss=probeCalSS(6,T);
      const re=new Float64Array(1000), im=new Float64Array(1000);
      for(let n=1;n<=1000;n++){
        const [a,b]=wfCoef('square',n,0.5);
        const c=cxMul([a,-b],Hdivider(n/T,HW.RPR,6e-12,HW.RIN,C2TOT));
        re[n-1]=c[0]; im[n-1]=c[1];
      }
      const ser={f0:1/T,dc:0,re,im};
      for(const tf of [0.05,0.2,0.45]){
        const want=ss.kR+(ss.v0-ss.kR)*Math.exp(-tf*T/ss.tau);
        rel(seriesEval(ser,tf*T),want,1e-2,
          'series through divider = closed-form exponential at t='+tf+'T'); }
    }
    /* one-pole magnitudes and phases (scipy) */
    close(cxAbs(Hlp(1e7,2e7)),8.94427190999916e-01,1e-12,'|Hlp| f=fbw/2 (scipy)');
    close(Math.atan2(Hlp(1e7,2e7)[1],Hlp(1e7,2e7)[0]),-4.63647609000806e-01,
      1e-12,'arg Hlp f=fbw/2 (scipy)');
    close(cxAbs(Hhp(10,10)),Math.SQRT1_2,1e-12,'|Hhp| at fc = 1/sqrt2');
    /* rise time: ln9/(2 pi fbw).  Built by hand, untapered, with the pole
       three decades below the truncation so the pole is all there is */
    { const fbw=2e7, f0=1e5, T=1/f0, NH=3000;
      const re=new Float64Array(NH), im=new Float64Array(NH);
      for(let n=1;n<=NH;n++){ const [a,b]=wfCoef('square',n,0.5);
        const c=cxMul([a,-b],Hlp(n*f0,fbw)); re[n-1]=c[0]; im[n-1]=c[1]; }
      const ser={f0,dc:0,re,im};
      const vset=seriesEval(ser,T/4);              /* the settled plateau */
