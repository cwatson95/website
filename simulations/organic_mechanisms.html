  for (let i = 0; i < 3; i++) {
    const nm = 'HA' + i, v = gunit(gsub(P[nm], P.CA));
    const ov = Math.abs(gdot(v, nrm));
    if (ov < 0.25) continue;
    const qa = cam.P(P.CA), qb = cam.P(P[nm]);
    if (!qa || !qb) continue;
    ctx.beginPath(); ctx.moveTo(qa.x, qa.y); ctx.lineTo(qb.x, qb.y);
    ctx.strokeStyle = rgba(COL.pos, 0.35 + 0.55 * ov); ctx.lineWidth = 2 + 4 * ov; ctx.stroke();
  }
  lab(ctx, W, H, b.x + 12, b.y + 16, 'the empty p, and the σ(C–H) bonds that feed it',
      COL.live, 'italic 14px Georgia, serif', 'left', 'middle');
  lab(ctx, W, H, b.x + 12, b.y + 36, 'three bonds at the cation carbon, all in one plane, 360° between them',
      COL.dim, '11.5px -apple-system, sans-serif', 'left', 'middle');

  /* --- three routes to the same ladder --- */
  const rr = C0.routes.find(q => q.id === C0.k);
  const pa3 = C0.pa.find(q => PA_PAIR[q.id] === C0.k);
  notesPanel(ctx, W, H, nb, 'three routes, one answer', [
    ['ΔfH of this cation'],
    ['tabulated', rr.direct === undefined ? 'no row' : fmt(rr.direct, 1), COL.ref],
    ['ΔfH(R·) + IE(R·)', fmt(rr.ie, 1), COL.pos],
    ['they differ by', rr.diff === null || rr.diff === undefined ? '—' : fmt(Math.abs(rr.diff), 2),
     rr.diff !== null && rr.diff !== undefined && Math.abs(rr.diff) < 3 ? COL.pos : COL.bad],
    ['the proton-affinity check'],
    pa3 ? ['computed', fmt(pa3.calc, 1), COL.pos] : ['computed', '—', COL.dim],
    pa3 ? ['Hunter &amp; Lias', fmt(pa3.meas, 1), COL.ref] : ['measured', '—', COL.dim],
    pa3 ? ['residual', sgn(pa3.resid, 2), Math.abs(pa3.resid) < 3 ? COL.pos : COL.bad]
        : ['residual', '—', COL.dim],
    ['the ladder, rung by rung'],
    ['methyl → 1°', fmt(C0.incr[0], 1), COL.dim],
    ['1° → 2°', fmt(C0.incr[1], 1), COL.dim],
    ['2° → 3°', fmt(C0.incr[2], 1), COL.dim],
    { note: 'The rungs get shorter: hyperconjugation saturates, so counting β hydrogens '
        + 'is a guide and not a formula. tert-Butyl is the one place the two routes disagree, '
        + 'and the page says so rather than averaging them.' },
  ]);

  /* --- the ladder --- */
  const p = L.bottom[0];
  if (p) {
    const hi = Math.max.apply(null, C0.rows.map(r => r.ladder)) * 1.12;
    axesR(ctx, p, -0.5, 3.5, 0, hi, { title: 'hydride affinity above tertiary',
                                      ylab: 'kJ/mol', nx: 4, ny: 5,
                                      xticks: [0, 1, 2, 3],
                                      xfmt: t => ['methyl 0βH', '1° 3βH', '2° 6βH', '3° 9βH'][t] || '',
                                      yfmt: t => fmt(t, 0) });
    C0.rows.forEach((r, i) => {
      const X = p.x + p.w * (i + 0.5) / 4, wgt = p.w / 4 * 0.45;
      const Y = p.y1 - p.h * r.ladder / hi;
      ctx.fillStyle = r.id === C0.k ? COL.live : COL.pos;
      ctx.fillRect(X - wgt / 2, Y, wgt, p.y1 - Y);
      lab(ctx, W, H, X, Y - 8, fmt(r.ladder, 0), r.id === C0.k ? COL.live : COL.pos,
          '10.5px -apple-system, sans-serif', 'center', 'bottom');
      /* the beta-H count rides on the tick label instead of sitting inside the
         plot: as its own label it collided with the tick, and lab()'s relocation
         cannot see ticks because axes() does not register them */
      if (r.ladder > 0.2 * hi)
        lab(ctx, W, H, X, p.y1 - 8, CAT_LABEL[r.id], '#0b0f1a',
            '10px -apple-system, sans-serif', 'center', 'bottom');
    });
  }
  /* --- the hyperconjugation curve --- */
  const q = L.bottom[1];
  if (q && !L.narrow) {
    const xs = C0.curve.map(c => c[0]), ye = C0.curve.map(c => c[1]), yp = C0.curve.map(c => c[2]);
    const lo = Math.min.apply(null, ye) * 1.12;
    axesR(ctx, q, 0, 180, lo, 0, { title: 'overlap against the dihedral',
                                   xlab: 'θ (degrees)', ylab: 'stabilisation (kJ/mol)',
                                   nx: 6, ny: 5, xfmt: t => fmt(t, 0), yfmt: t => fmt(t, 0) });
    polyline(ctx, q, xs, yp, 0, 180, lo, 0, COL.ref, 1.4, [5, 4]);
    polyline(ctx, q, xs, ye, 0, 180, lo, 0, COL.pos, 2);
    marker(ctx, q, 0, 180, lo, 0, st.theta, C0.stab, COL.live);
    legendR(ctx, q, [[COL.pos, 'exact 2×2'], [COL.ref, '−H²/ΔE']]);
    lab(ctx, W, H, q.x + q.w / 2, q.y1 - 8, 'cos²θ either way', COL.dim,
        '10px -apple-system, sans-serif', 'center', 'bottom');
  }
  drawCaption(ctx, L);
}
/* ================================================================== *
 *  view: the peroxide                                                 *
 * ================================================================== */
function drawRadical(ctx, W, H, M) {
  const R = M.R, st = ST;
  const capFull = 'A peroxide makes radicals, and a radical chain adds H' + R.x + ' the other way round. '
    + 'Both propagation steps have to be downhill or the chain dies: the halogen has to be big enough to '
    + 'make a decent C–X bond and its H–X bond weak enough to give a hydrogen away. Only bromine '
    + 'manages both. Every enthalpy below is a difference of measured enthalpies of formation.';
  const capShort = 'Both propagation steps must be downhill. Only bromine manages both.';
  const L = stageLayout(ctx, W, H, capFull, capShort, 2, 0.46, 1);
  const b0 = L.main;
  const [b, nb] = stageSplit(b0);
  frame(ctx, b0, '#1a1f2c');

  /* --- the chain as a cycle --- */
  const cx = b.x + b.w * 0.52, cy = b.y + b.h * 0.56, rr = Math.min(b.w * 0.2, b.h * 0.3);
  const runs = R.tab.find(q => q.id === R.x).verdict.runs;
  const ringCol = runs && R.peroxide ? COL.pos : COL.dim;
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU);
  ctx.strokeStyle = rgba(ringCol, 0.45); ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke();
  ctx.setLineDash([]);
  /* the two carriers */
  const pA = [cx - rr, cy], pB = [cx + rr, cy];
  dot(ctx, pA[0], pA[1], 7, ringCol, '#070b18', 1.5);
  dot(ctx, pB[0], pB[1], 7, ringCol, '#070b18', 1.5);
  lab(ctx, W, H, pA[0] - 14, pA[1], R.x + '·', ringCol, 'italic 15px Georgia, serif', 'right', 'middle');
  lab(ctx, W, H, pB[0] + 14, pB[1], 'R·', ringCol, 'italic 15px Georgia, serif', 'left', 'middle');
  /* the two arcs */
  const arc = (a0, a1, col, txt, dH) => {
    ctx.beginPath(); ctx.arc(cx, cy, rr, a0, a1); ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.stroke();
    const am = (a0 + a1) / 2, X = cx + (rr + 26) * Math.cos(am), Y = cy + (rr + 26) * Math.sin(am);
    lab(ctx, W, H, X, Y, txt, col, '11px -apple-system, sans-serif', 'center', 'middle');
    if (dH !== null && dH !== undefined)
      lab(ctx, W, H, X, Y + 15, kJ(dH), dH < 0 ? COL.pos : COL.bad,
          '10.5px -apple-system, sans-serif', 'center', 'middle');
  };
  const row = R.tab.find(q => q.id === R.x);
  arc(PI, TAU, row.step1 !== null && row.step1 < 0 ? COL.pos : COL.bad,
      'step 1:  ' + R.x + '· + alkene → R·', row.step1);
  arc(0, PI, row.step2 < 0 ? COL.pos : COL.bad,
      'step 2:  R· + H' + R.x + ' → RH + ' + R.x + '·', row.step2);
  /* initiation in, termination out */
  if (R.peroxide) {
    arrowPx(ctx, cx - rr - 84, cy - rr - 24, pA[0] - 8, pA[1] - 8, COL.ref, 1.6);
    lab(ctx, W, H, cx - rr - 88, cy - rr - 28, 'peroxide → 2 RO·', COL.ref,
        '10.5px -apple-system, sans-serif', 'right', 'middle');
  } else {
    lab(ctx, W, H, cx, b.y + 28, 'no initiator: no chain, and the ionic route takes over',
        COL.bad, 'italic 13px Georgia, serif', 'center', 'middle');
  }
  arrowPx(ctx, pB[0] + 8, pB[1] + 8, cx + rr + 78, cy + rr + 22, COL.dim, 1.4);
  lab(ctx, W, H, cx + rr + 82, cy + rr + 26, '2 R· → dimer', COL.dim,
      '10.5px -apple-system, sans-serif', 'left', 'middle');

  lab(ctx, W, H, b.x + 12, b.y + 16, runs ? 'the chain turns' : 'the chain cannot turn',
      runs ? COL.pos : COL.bad, 'italic 14px Georgia, serif', 'left', 'middle');
  lab(ctx, W, H, b.x + 12, b.y1 - 10,
      'bromine adds first, and to the carbon with fewer substituents — so H ends up on the other one',
      COL.dim, '11.5px -apple-system, sans-serif', 'left', 'bottom');
  if (R.peroxide && runs)
    lab(ctx, W, H, cx, cy, fmt(R.ss.chainLength, 0) + ' turns', COL.live,
        'italic 13px Georgia, serif', 'center', 'middle');

  notesPanel(ctx, W, H, nb, 'the arithmetic, per halogen', [
    ['the acid'],
    ['H–' + R.x + ' bond', fmt(row.bdeHX, 1) + ' kJ/mol', COL.ref],
    ['the two steps'],
    ['① ' + R.x + '· adds', row.step1 === null ? 'no data' : kJ(row.step1),
     row.step1 !== null && row.step1 < 0 ? COL.pos : COL.bad],
    ['② H abstracted', kJ(row.step2), row.step2 < 0 ? COL.pos : COL.bad],
    ['sum = the addition', R.steps ? kJ(R.steps.sumAnti) : '—', COL.dim],
    ['the regiochemistry'],
    ['2° radical below 1°', fmt(R.radStab, 1) + ' kJ/mol', COL.pos],
    ['step 1 prefers anti by', R.gap === null ? '—' : fmt(R.gap, 1), COL.ref],
    ['… which alone gives', R.ratioThermo === null ? '—' : ratioTxt(R.ratioThermo), COL.bad],
    { note: 'Nowhere near the observed selectivity, so thermochemistry is not the whole '
        + 'story here: the bromine atom also simply fits better on the open carbon, and the '
        + 'transition state is early enough that little of the radical stability has appeared yet.' },
  ]);

  /* --- the halogen table --- */
  const p = L.bottom[0];
  if (p) {
    const vals = [];
    for (const q of R.tab) { if (q.step1 !== null) vals.push(q.step1); vals.push(q.step2); }
    const lo = Math.min.apply(null, vals) * 1.15, hi = Math.max.apply(null, vals) * 1.15;
    axesR(ctx, p, -0.5, 3.5, lo, hi, { title: 'both steps, every halogen', ylab: 'kJ/mol',
                                       xticks: [0, 1, 2, 3], xfmt: t => ['HF', 'HCl', 'HBr', 'HI'][t] || '',
                                       ny: 5, yfmt: t => fmt(t, 0) });
    polyline(ctx, p, [-0.5, 3.5], [0, 0], -0.5, 3.5, lo, hi, '#3a4052', 1.2, [4, 4]);
    R.tab.forEach((q, i) => {
      const Xc = p.x + p.w * (i + 0.5) / 4, wgt = p.w / 4 * 0.2, Y0 = p.y1 - p.h * (0 - lo) / (hi - lo);
      const bar = (val, off, col) => {
        if (val === null) {
          lab(ctx, W, H, Xc + off, Y0 - 6, 'n/a', COL.dim, '9.5px -apple-system, sans-serif', 'center', 'bottom');
          return;
        }
        const Y = p.y1 - p.h * (val - lo) / (hi - lo);
        ctx.fillStyle = col; ctx.fillRect(Xc + off - wgt / 2, Math.min(Y, Y0), wgt, Math.abs(Y - Y0));
      };
      bar(q.step1, -wgt * 0.62, q.step1 !== null && q.step1 < 0 ? COL.pos : COL.bad);
      bar(q.step2, wgt * 0.62, q.step2 < 0 ? COL.struct : COL.bad);
      lab(ctx, W, H, Xc, p.y + 12, q.verdict.runs ? 'chain' : '✖', q.verdict.runs ? COL.pos : COL.bad,
          '10.5px -apple-system, sans-serif', 'center', 'middle');
    });
    legendR(ctx, p, [[COL.pos, 'step 1 (X· adds)'], [COL.struct, 'step 2 (H abstracted)'],
                     [COL.bad, 'uphill — chain stops']]);
  }
  /* --- the chain in time --- */
  const q2 = L.bottom[1];
  if (q2 && !L.narrow) {
    const tr = R.run.trace;
    const xs = tr.map(t => t[0]), ys = tr.map(t => t[1][4]);
    const hi = Math.max(R.ss.R * 1.6, Math.max.apply(null, ys) * 1.2, 1e-12);
    axesR(ctx, q2, 0, st.tmax, 0, hi, { title: 'the radical pool finds its level',
                                        xlab: 'time (s)', ylab: '[R·] (M)', nx: 5, ny: 5,
                                        xfmt: t => fmt(t, 1), yfmt: t => t === 0 ? '0' : t.toExponential(0) });
    polyline(ctx, q2, [0, st.tmax], [R.ss.R, R.ss.R], 0, st.tmax, 0, hi, COL.ref, 1.4, [5, 4]);
    polyline(ctx, q2, xs, ys, 0, st.tmax, 0, hi, COL.pos, 2);
    legendR(ctx, q2, [[COL.pos, 'integrated'], [COL.ref, '√(Rᵢ/2kₜ)']]);
  }
  drawCaption(ctx, L);
}

/* ================================================================== *
 *  view: the borane                                                   *
 * ================================================================== */
function boraneFrame(s) {
  const M = molPropene();
  const pn = planeNormal([M.X.C1, M.X.C2, M.X.C3, M.X.H1a, M.X.H1b, M.X.H2]);
  let nrm = pn.normal; if (nrm[2] < 0) nrm = gmul(nrm, -1);
  const P = {}, el = {}, bonds = [];
  for (const k of Object.keys(M.X)) { P[k] = M.X[k].slice(); el[k] = M.el[k]; }
  for (const bd of M.bonds) bonds.push([bd[0], bd[1], bd[2]]);
  /* boron comes down on C1 (the open carbon); the hydride it carries goes to C2 */
  const hB = lerp(3.0, GEO.CB, smoothstep(clamp(s / 0.75, 0, 1)));
  P.B = gadd(M.X.C1, gmul(nrm, hB)); el.B = 'B';
  const hH = lerp(3.0, 1.12, smoothstep(clamp(s / 0.75, 0, 1)));
  const along = lerp(0.0, 1.0, smoothstep(clamp(s / 0.75, 0, 1)));
  const hStart = gadd(M.X.C1, gmul(nrm, 3.0));
  const hEnd = gadd(M.X.C2, gmul(nrm, 1.12));
  P.Ht = [lerp(hStart[0], hEnd[0], along), lerp(hStart[1], hEnd[1], along), lerp(hStart[2], hEnd[2], along)];
  el.Ht = 'H';
  /* two spectator hydrogens on boron */
  const u = gunit(gcross(nrm, gsub(M.X.C2, M.X.C1)));
  P.Hb0 = gadd(P.B, gadd(gmul(u, 0.95), gmul(nrm, 0.55))); el.Hb0 = 'H';
  P.Hb1 = gadd(P.B, gadd(gmul(u, -0.95), gmul(nrm, 0.55))); el.Hb1 = 'H';
  bonds.push(['B', 'Hb0', 1], ['B', 'Hb1', 1]);
  if (s > 0.62) bonds.push(['C1', 'B', 1]);
  if (s > 0.62) bonds.push(['C2', 'Ht', 1]); else bonds.push(['B', 'Ht', 1]);
  /* the alkene bond order drops as the addition completes */
  for (const bd of bonds) if (bd[0] === 'C1' && bd[1] === 'C2') bd[2] = s > 0.62 ? 1 : 2;
  return { P, el, bonds, normal: nrm,
           faceB: gdot(gsub(P.B, M.X.C1), nrm), faceH: gdot(gsub(P.Ht, M.X.C2), nrm),
           stage: s < 0.28 ? 0 : s < 0.62 ? 1 : s < 0.88 ? 2 : 3 };
}

function drawBorane(ctx, W, H, M) {
  const B = M.B, st = ST;
  const capFull = 'Hydroboration. Boron and hydrogen add across the double bond in one step, through a '
    + 'four-centre transition state, so they arrive on the SAME face — syn addition — and there is '
    + 'never an intermediate for anything to rearrange. Boron takes the less crowded carbon; the buried-volume '
    + 'figures below are a Bondi hard-sphere model, not a measurement. Oxidation then swaps boron for OH with '
    + 'retention, so the alcohol ends up anti-Markovnikov.';
  const capShort = 'One step, four centres, both new bonds on one face. Boron takes the open carbon.';
  const L = stageLayout(ctx, W, H, capFull, capShort, 2, 0.38, 1);
  const b0 = L.main;
  const [bx, nb] = stageSplit(b0);
  frame(ctx, b0, '#1a1f2c');
  const fr = boraneFrame(B.s);
  const bfit = fitCamera([boraneFrame(0), boraneFrame(0.5), boraneFrame(1)]);
  const cen = bfit.cen;
  const C = boxCamera(bx, st.camTheta + B.spin * 0.35, st.camPhi, bfit.dist * st.zoom, cen);
  C.W = W; C.H = H;

  /* the alkene plane, so "same face" is visible */
  const pl = [];
  const uu = gunit(gsub(fr.P.C2, fr.P.C1)), vv = gunit(gcross(fr.normal, uu));
  for (const [a, c] of [[-2.4, -2.2], [3.4, -2.2], [3.4, 2.2], [-2.4, 2.2], [-2.4, -2.2]])
    pl.push(gadd(fr.P.C1, gadd(gmul(uu, a), gmul(vv, c))));
  poly3(ctx, C, pl, rgba(COL.struct, 0.28), 1.1, [5, 4], true);

  drawMolecule3D(ctx, C, fr, { style: st.style, showH: st.showH,
                               labels: { C1: 'C1', C2: 'C2', B: 'B' } });
  /* the two forming bonds, and their side of the plane */
  const qB = C.P(fr.P.B), qC1 = C.P(fr.P.C1), qH = C.P(fr.P.Ht), qC2 = C.P(fr.P.C2);
  if (qB && qC1 && fr.stage <= 2) {
    ctx.beginPath(); ctx.moveTo(qC1.x, qC1.y); ctx.lineTo(qB.x, qB.y);
    ctx.strokeStyle = rgba(COL.pos, 0.6); ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (qH && qC2 && fr.stage <= 2) {
    ctx.beginPath(); ctx.moveTo(qC2.x, qC2.y); ctx.lineTo(qH.x, qH.y);
    ctx.strokeStyle = rgba(COL.pos, 0.6); ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke();
    ctx.setLineDash([]);
  }
  const stg = ['① boron approaches one face', '② the four-centre transition state',
               '③ the alkylborane', '④ oxidation: B → OH, with retention'][fr.stage];
  lab(ctx, W, H, bx.x + 12, bx.y + 16, stg, COL.live, 'italic 14px Georgia, serif', 'left', 'middle');
  lab(ctx, W, H, bx.x + 12, bx.y + 36,
      'B on C1 and H on C2, both above the plane: ' + sgn(fr.faceB, 2) + ' and ' + sgn(fr.faceH, 2)
      + ' Å — same sign, so syn', COL.pos, '11.5px -apple-system, sans-serif', 'left', 'middle');

  notesPanel(ctx, W, H, nb, 'why this one is different', [
    ['the four stages'],
    ['① approach', fr.stage === 0 ? 'now' : '', fr.stage === 0 ? COL.live : COL.dim],
    ['② four-centre TS', fr.stage === 1 ? 'now' : '', fr.stage === 1 ? COL.live : COL.dim],
    ['③ the alkylborane', fr.stage === 2 ? 'now' : '', fr.stage === 2 ? COL.live : COL.dim],
    ['④ oxidation to the alcohol', fr.stage === 3 ? 'now' : '', fr.stage === 3 ? COL.live : COL.dim],
    ['the two new bonds'],
    ['B above C1 by', sgn(fr.faceB, 2) + ' Å', COL.pos],
    ['H above C2 by', sgn(fr.faceH, 2) + ' Å', COL.pos],
    ['same side?', fr.faceB * fr.faceH > 0 ? 'yes — syn' : 'no', COL.pos],
    ['which carbon takes boron'],
    ['buried at C1', fmt(100 * B.bv.C1, 1) + ' %', COL.pos],
    ['buried at C2', fmt(100 * B.bv.C2, 1) + ' %', COL.ref],
    ['C1 is open by', fmt(100 * (B.bv.C2 - B.bv.C1), 1) + ' pts', COL.live],
    { note: 'No carbocation is ever made, so nothing can rearrange — which is the '
        + 'sharpest experimental test there is of which mechanism is running.' },
  ]);

  /* --- the steric comparison --- */
  const p = L.bottom[0];
  if (p) {
    const use = B.steric === 'buried' ? B.bv : { C1: B.hemi.C1, C2: B.hemi.C2 };
    const ttl = B.steric === 'buried' ? 'buried volume (Bondi, R = 3.5 Å)' : 'blocked hemisphere (probe 1.2 Å)';
    const hi = Math.max(use.C1, use.C2) * 1.3;
    axesR(ctx, p, -0.5, 1.5, 0, 100 * hi, { title: ttl, ylab: '% blocked', nx: 2, ny: 5,
                                            xticks: [0, 1], xfmt: t => ['C1 terminal', 'C2 internal'][t] || '',
                                            yfmt: t => fmt(t, 0) });
    [['C1', 0], ['C2', 1]].forEach(([k, i]) => {
      const Xc = p.x + p.w * (i + 0.5) / 2, wgt = p.w / 2 * 0.36;
      const Y = p.y1 - p.h * (100 * use[k]) / (100 * hi);
      ctx.fillStyle = k === 'C1' ? COL.pos : COL.ref;
      ctx.fillRect(Xc - wgt / 2, Y, wgt, p.y1 - Y);
      lab(ctx, W, H, Xc, Y - 8, fmt(100 * use[k], 1) + ' %', k === 'C1' ? COL.pos : COL.ref,
          '11px -apple-system, sans-serif', 'center', 'bottom');
    });
  }
  /* --- syn against anti --- */
  const q = L.bottom[1];
  if (q && !L.narrow) {
    axesR(ctx, q, -1.6, 1.6, -1.3, 1.3, { title: 'which face each group arrives on', nx: 4, ny: 4,
                                          xfmt: () => '', yfmt: () => '' });
    const mid = q.y + q.h / 2;
    ctx.beginPath(); ctx.moveTo(q.x + 16, mid); ctx.lineTo(q.x1 - 16, mid);
    ctx.strokeStyle = rgba(COL.struct, 0.55); ctx.lineWidth = 1.6; ctx.stroke();
    const lane = (xc, up1, up2, ttl, col) => {
      dot(ctx, xc - 16, mid, 4, COL.dim, '#070b18', 1);
      dot(ctx, xc + 16, mid, 4, COL.dim, '#070b18', 1);
      arrowPx(ctx, xc - 16, mid - up1 * 34, xc - 16, mid - up1 * 9, col, 1.6);
      arrowPx(ctx, xc + 16, mid - up2 * 34, xc + 16, mid - up2 * 9, col, 1.6);
      lab(ctx, W, H, xc, q.y + 16, ttl, col, '11px -apple-system, sans-serif', 'center', 'middle');
    };
    lane(q.x + q.w * 0.28, 1, 1, 'syn (BH₃)', COL.pos);
    lane(q.x + q.w * 0.72, 1, -1, 'anti (Br₂)', COL.ref);
    lab(ctx, W, H, q.x + q.w / 2, q.y1 - 10,
        'both faces are equivalent (' + fmt(B.clear.sym, 2) + ' Å apart), so neither gives one enantiomer',
        COL.dim, '10px -apple-system, sans-serif', 'center', 'bottom');
  }
  drawCaption(ctx, L);
}

/* ================================================================== *
 *  view: the shift                                                    *
 * ================================================================== */
/* 3-methyl-1-butene, protonated: C1(H3)-C2(+)-C3(H)(C4)(C5).  The hydride on
   C3 migrates to C2, moving the charge to the tertiary carbon. */
function shiftFrame(s, kind) {
  const u = smoothstep(clamp(s, 0, 1));
  const P = {}, el = {}, bonds = [];
  const before = (function () {
    const X = {};
    X.C2 = [0, 0, 0];
    X.C1 = [GEO.CC_sp3, 0, 0];
    X.C3 = [GEO.CC_sp3 * Math.cos(120 * DEG), GEO.CC_sp3 * Math.sin(120 * DEG), 0];
    X.H2 = [GEO.CH_sp2 * Math.cos(240 * DEG), GEO.CH_sp2 * Math.sin(240 * DEG), 0];
    X.Hm = place(X.H2, X.C2, X.C3, GEO.CH_sp3, TETRA, 0);          /* the migrating H */
    X.C4 = place(X.H2, X.C2, X.C3, GEO.CC_sp3, TETRA, 120);
    X.C5 = place(X.H2, X.C2, X.C3, GEO.CC_sp3, TETRA, 240);
    return X;
  })();
  const after = (function () {
    const X = {};
    X.C3 = [0, 0, 0];
    X.C2 = [GEO.CC_sp3, 0, 0];
    X.C4 = [GEO.CC_sp3 * Math.cos(120 * DEG), GEO.CC_sp3 * Math.sin(120 * DEG), 0];
    X.C5 = [GEO.CC_sp3 * Math.cos(240 * DEG), GEO.CC_sp3 * Math.sin(240 * DEG), 0];
    X.C1 = place(X.C4, X.C3, X.C2, GEO.CC_sp3, TETRA, 180);
    X.H2 = place(X.C4, X.C3, X.C2, GEO.CH_sp3, TETRA, 60);
    X.Hm = place(X.C4, X.C3, X.C2, GEO.CH_sp3, TETRA, 300);
    return X;
  })();
  for (const k of Object.keys(before)) {
    P[k] = [lerp(before[k][0], after[k][0], u), lerp(before[k][1], after[k][1], u),
            lerp(before[k][2], after[k][2], u)];
    el[k] = k.charAt(0) === 'C' ? 'C' : 'H';
  }
  bonds.push(['C1', 'C2', 1], ['C2', 'C3', 1], ['C3', 'C4', 1], ['C3', 'C5', 1], ['C2', 'H2', 1]);
  bonds.push([u < 0.5 ? 'C3' : 'C2', 'Hm', 1]);
  return { P, el, bonds, u, cation: u < 0.5 ? 'C2' : 'C3',
           stage: u < 0.08 ? 0 : u < 0.92 ? 1 : 2 };
}

function drawShift(ctx, W, H, M) {
  const S = M.S, st = ST;
  const capFull = 'A carbocation does not have to wait to be captured. If a hydrogen or a methyl on the '
    + 'next carbon can move across with its pair of electrons, and doing so puts the charge somewhere '
    + 'better, it moves — and the product comes from the rearranged cation instead. The driving force '
    + 'here is measured: a tertiary cation sits ' + fmt(S.drive, 1) + ' kJ/mol below a secondary on the '
    + 'hydride-affinity ladder. The two barriers are sliders, and are a model.';
  const capShort = 'If a shift puts the charge somewhere better, it happens before capture. Barriers are modelled.';
  const L = stageLayout(ctx, W, H, capFull, capShort, 2, 0.38, 1);
  const b0 = L.main;
  const [b, nb] = stageSplit(b0);
  frame(ctx, b0, '#1a1f2c');
  const fr = shiftFrame(S.s, S.kind);
  const sfit = fitCamera([shiftFrame(0, S.kind), shiftFrame(0.5, S.kind), shiftFrame(1, S.kind)]);
  const cen = sfit.cen;
  const C = boxCamera(b, st.camTheta, st.camPhi, sfit.dist * st.zoom, cen);
  C.W = W; C.H = H;
  const pts = fr.cation === 'C2' ? [fr.P.C1, fr.P.C2, fr.P.C3, fr.P.H2]
                                 : [fr.P.C2, fr.P.C3, fr.P.C4, fr.P.C5];
  const nrm = planeNormal(pts).normal;
  drawPOrbital(ctx, C, fr.P[fr.cation], nrm, 1.1, COL.orb);
  drawMolecule3D(ctx, C, fr, { style: st.style, showH: st.showH,
                               labels: { Hm: 'H', C2: '2°', C3: '3°' } });
  const qc = C.P(fr.P[fr.cation]);
  if (qc) lab(ctx, W, H, qc.x + 14, qc.y - 24, '+', COL.charge, 'italic 20px Georgia, serif', 'left', 'middle');
  if (fr.stage === 1 && ST.arrows) {
    const qa = C.P(fr.P.Hm), qb = C.P(fr.P[fr.u < 0.5 ? 'C2' : 'C3']);
    if (qa && qb) curlyArrow(ctx, qa.x, qa.y, qb.x, qb.y, 20, COL.arrow);
  }
  lab(ctx, W, H, b.x + 12, b.y + 16,
      ['① the secondary cation', '② the hydride slides across',
       '③ the tertiary cation — this is what gets captured'][fr.stage],
      COL.live, 'italic 14px Georgia, serif', 'left', 'middle');
  lab(ctx, W, H, b.x + 12, b.y + 36, '3-methyl-1-butene + HCl gives 2-chloro-2-methylbutane, not the obvious product',
      COL.dim, '11.5px -apple-system, sans-serif', 'left', 'middle');

  notesPanel(ctx, W, H, nb, 'the race out of the cation', [
    ['the driving force (measured)'],
    ['2° cation', '0', COL.dim],
    ['3° cation', kJ(-S.drive), COL.pos],
    ['from the hydride ladder', '', COL.dim],
    ['the two channels'],
    ['shift barrier', fmt(S.shiftBar, 0) + ' kJ/mol', COL.pos],
    ['capture barrier', fmt(S.capBar, 0) + ' kJ/mol', COL.ref],
    ['k(shift)', S.kShift.toExponential(1), COL.pos],
    ['k(capture)', S.kCap.toExponential(1), COL.ref],
    ['rearranged', pctTxt(100 * S.fRe), COL.live],
    ['… by integration', pctTxt(100 * S.fReInteg),
     Math.abs(S.fRe - S.fReInteg) < 1e-6 ? COL.pos : COL.bad],
    { note: 'The closed form and the integrated three-species scheme are computed '
        + 'separately and must agree — that is the check that the branching rule was '
        + 'applied, not merely written down.' },
  ]);

  /* --- the ladder --- */
  const p = L.bottom[0];
  if (p) {
    const lev = [{ x: 0, e: 0, lab: '2°' }, { x: 0.5, e: S.shiftBar, lab: 'TS' },
                 { x: 1, e: -S.drive, lab: '3°' }];
    const cap = [{ x: 0, e: 0, lab: '' }, { x: 0.5, e: S.capBar, lab: 'TS (capture)' },
                 { x: 1, e: -S.drive - 40, lab: 'product' }];
    drawProfile(ctx, p, [{ levels: cap, col: COL.ref, dash: [5, 4], lw: 1.8 },
                         { levels: lev, col: COL.pos, lw: 2.2 }],
                { title: 'shift against capture' });
    legendR(ctx, p, [[COL.pos, 'the 1,2-shift'], [COL.ref, 'capture by X⁻']]);
  }
  /* --- the branching --- */
  const q = L.bottom[1];
  if (q && !L.narrow) {
    const xs = [], ys = [];
    for (let d = -30; d <= 30; d += 0.5) {
      const ks = eyring(S.shiftBar, S.temp), kc = eyring(S.shiftBar + d, S.temp);
      xs.push(d); ys.push(100 * ks / (ks + kc));
    }
    axesR(ctx, q, -30, 30, 0, 100, { title: 'how much rearranges',
                                     xlab: 'capture barrier − shift barrier (kJ/mol)',
                                     ylab: 'rearranged (%)', nx: 5, ny: 5,
                                     xfmt: t => fmt(t, 0), yfmt: t => fmt(t, 0) });
    polyline(ctx, q, xs, ys, -30, 30, 0, 100, COL.pos, 2);
    marker(ctx, q, -30, 30, 0, 100, clamp(S.capBar - S.shiftBar, -30, 30), 100 * S.fRe, COL.live);
    lab(ctx, W, H, q.x + 10, q.y + 14, 'a 12 kJ/mol edge is already 99 : 1', COL.dim,
        '10px -apple-system, sans-serif', 'left', 'middle');
  }
  drawCaption(ctx, L);
}

/* ================================================================== *
 *  view: the ledger                                                   *
 * ================================================================== */
function drawLedger(ctx, W, H, M) {
  const L0 = M.L, st = ST;
  const capMap = {
    routes: 'Six ways to add across the same double bond. The three that make a cation, free or bridged, put the electrophile where the better cation lies and obey Markovnikov; the radical chain and the concerted borane do not, and do not; bromine goes on both carbons, so for it the question never arises. The mechanism is the rule — there is no separate "anti-Markovnikov rule" to learn.',
    master: 'Selectivity is exponential in the barrier gap, so it is cheap. At 298 K every factor of ten '
      + 'in the product ratio costs ' + fmt(ddGFromRatio(10, st.temp), 2) + ' kJ/mol — less than a '
      + 'hydrogen bond. That is why small differences decide these reactions, and why raising the '
      + 'temperature blurs them.',
    ch: 'The Curtin–Hammett principle, by integration rather than assertion. Two intermediates '
      + 'interconvert quickly and each gives its own product. Changing which one is populated, over four '
      + 'orders of magnitude, does not move the product ratio at all — until the interconversion is '
      + 'made slow, when the ratio collapses onto the populations instead.',
    src: 'Every number this page uses, and where it came from. Nothing here is a bond energy: those are '
      + 'all computed from these at run time.',
  };
  const capFull = capMap[L0.mode];
  const Lay = stageLayout(ctx, W, H, capFull, capFull, 0, 0, 0);
  /* the plotted modes carry an x-axis label, which axes() puts 21 px BELOW the
     box — straight onto the caption unless the box is shortened for it.  The
     display-list audit caught exactly that. */
  const needsAxis = (L0.mode === 'master' || L0.mode === 'ch');
  const b = needsAxis ? box(Lay.main.x, Lay.main.y, Lay.main.w, Lay.main.h - 34) : Lay.main;

  if (L0.mode === 'routes') {
    frame(ctx, b, '#1a1f2c');
    const rowH = Math.min(78, (b.h - 46) / L0.routes.length);
    lab(ctx, W, H, b.x + 18, b.y + 22, 'reagents', COL.dim, 'italic 12px Georgia, serif', 'left', 'middle');
    lab(ctx, W, H, b.x + b.w * 0.36, b.y + 22, 'through', COL.dim, 'italic 12px Georgia, serif', 'left', 'middle');
    lab(ctx, W, H, b.x + b.w * 0.60, b.y + 22, 'regiochemistry', COL.dim, 'italic 12px Georgia, serif', 'left', 'middle');
    L0.routes.forEach((r, i) => {
      const Y = b.y + 46 + i * rowH + rowH / 2;
      const col = r.outcome === 'Markovnikov' ? COL.markov
        : r.outcome === 'anti-Markovnikov' ? COL.anti : COL.struct;
      ctx.strokeStyle = '#1a1f2c'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x + 14, Y + rowH / 2 - 6); ctx.lineTo(b.x1 - 14, Y + rowH / 2 - 6); ctx.stroke();
      lab(ctx, W, H, b.x + 18, Y - 8, r.name, '#cfd4de', '12.5px -apple-system, sans-serif', 'left', 'middle');
      lab(ctx, W, H, b.x + 18, Y + 10, r.note, COL.dim, '10.5px -apple-system, sans-serif', 'left', 'middle');
      lab(ctx, W, H, b.x + b.w * 0.36, Y - 8, r.via, COL.struct, '11.5px -apple-system, sans-serif', 'left', 'middle');
      lab(ctx, W, H, b.x + b.w * 0.60, Y - 8, r.outcome, col, 'italic 13px Georgia, serif', 'left', 'middle');
      lab(ctx, W, H, b.x + b.w * 0.60, Y + 10, r.sub, COL.dim,
          '10.5px -apple-system, sans-serif', 'left', 'middle');
    });
  } else if (L0.mode === 'master') {
    const lo = 0, hi = 25;
    axesR(ctx, b, lo, hi, 0, 6, { title: 'product ratio against the barrier gap',
                                  xlab: 'ΔΔG‡ (kJ/mol)', ylab: 'log₁₀ (major : minor)',
                                  nx: 6, ny: 6, xfmt: t => fmt(t, 0), yfmt: t => fmt(t, 0) });
    const temps = [[200, COL.struct], [st.temp, COL.pos], [600, COL.ref]];
    for (const [T, col] of temps) {
      const xs = [], ys = [];
      for (let d = lo; d <= hi; d += 0.25) { xs.push(d); ys.push(Math.log(ratioFromDdG(d, T)) / Math.LN10); }
      polyline(ctx, b, xs, ys, lo, hi, 0, 6, col, T === st.temp ? 2.4 : 1.4, T === st.temp ? null : [5, 4]);
    }
    for (const m of L0.marks) {
      if (m.d > hi) continue;
      polyline(ctx, b, [m.d, m.d], [0, Math.log(m.r) / Math.LN10], lo, hi, 0, 6, COL.dim, 1, [3, 3]);
      lab(ctx, W, H, b.x + b.w * m.d / hi, b.y1 - b.h * (Math.log(m.r) / Math.LN10) / 6 - 8, m.lab,
          COL.dim, '10px -apple-system, sans-serif', 'center', 'bottom');
    }
    marker(ctx, b, lo, hi, 0, 6, L0.ddG, Math.log(L0.ratioAt) / Math.LN10, COL.live);
    legendR(ctx, b, [[COL.struct, '200 K'], [COL.pos, fmt(st.temp, 0) + ' K'], [COL.ref, '600 K']]);
  } else if (L0.mode === 'ch') {
    axesR(ctx, b, -2.5, 2.5, 0, 6, { title: 'the product ratio does not care which intermediate is populated',
                                     xlab: 'log₁₀ K  (which intermediate is favoured)',
                                     ylab: 'product ratio', nx: 6, ny: 6,
                                     xfmt: t => fmt(t, 0), yfmt: t => fmt(t, 0) });
    polyline(ctx, b, [-2.5, 2.5], [4, 4], -2.5, 2.5, 0, 6, COL.ref, 1.4, [5, 4]);
    polyline(ctx, b, L0.ch.map(c => c.lk), L0.ch.map(c => c.ratio), -2.5, 2.5, 0, 6, COL.pos, 2.2);
    for (const c of L0.ch) marker(ctx, b, -2.5, 2.5, 0, 6, c.lk, c.ratio, COL.pos);
    polyline(ctx, b, [-2.5, 2.5], [L0.chSlow, L0.chSlow], -2.5, 2.5, 0, 6, COL.bad, 1.6, [3, 3]);
    lab(ctx, W, H, b.x + 12, b.y1 - b.h * L0.chSlow / 6 - 8,
        'slow interconversion: ' + fmt(L0.chSlow, 2), COL.bad, '10.5px -apple-system, sans-serif', 'left', 'bottom');
    legendR(ctx, b, [[COL.pos, 'integrated'], [COL.ref, 'the transition-state gap alone'],
                     [COL.bad, 'interconversion switched off']]);
  } else {
    frame(ctx, b, '#1a1f2c');
    const rows = L0.sources;
    const nCol = Lay.narrow ? 1 : 2, per = Math.ceil(rows.length / nCol);
    const colW = (b.w - 28) / nCol;
    lab(ctx, W, H, b.x + 14, b.y + 18, 'gas-phase ΔfH at 298.15 K, kJ/mol — NIST Chemistry WebBook, fetched 2026-09-18',
        COL.dim, 'italic 12px Georgia, serif', 'left', 'middle');
    rows.forEach((r, i) => {
      const c = Math.floor(i / per), k = i % per;
      const X = b.x + 14 + c * colW, Y = b.y + 38 + k * 15;
      if (Y > b.y1 - 8) return;
      lab(ctx, W, H, X, Y, r.id, '#aeb6c6', '10px "SF Mono", Menlo, monospace', 'left', 'middle');
      lab(ctx, W, H, X + colW * 0.34, Y, fmt(r.v, 2), COL.pos, '10px "SF Mono", Menlo, monospace', 'right', 'middle');
      lab(ctx, W, H, X + colW * 0.38, Y, (r.ref || '').slice(0, 30), COL.dim,
          '9.5px -apple-system, sans-serif', 'left', 'middle');
    });
  }
  drawCaption(ctx, Lay);
}

/* ================================================================== *
 *  dispatch and the scene                                             *
 * ================================================================== */
function drawView(ctx, W, H, M) {
  LEGEND_RECTS = []; POLY_SEGS = []; LABELS = []; HIT = [];
  ctx.fillStyle = '#070b18'; ctx.fillRect(0, 0, W, H);
  if (M.view === 'add') drawAdd(ctx, W, H, M);
  else if (M.view === 'cation') drawCation(ctx, W, H, M);
  else if (M.view === 'radical') drawRadical(ctx, W, H, M);
  else if (M.view === 'borane') drawBorane(ctx, W, H, M);
  else if (M.view === 'shift') drawShift(ctx, W, H, M);
  else drawLedger(ctx, W, H, M);
}
function camKeys(view) {
  return (view === 'add' || view === 'cation' || view === 'borane' || view === 'shift')
    ? ['camTheta', 'camPhi'] : null;
}
/* DRAG lives in the shared helper block */

function makeScene(canvas) {
  const S = { st: ST, W: 1100, H: 712 };
  S.model = buildModel;
  S.draw = function () { const ctx = canvas.getContext('2d'); drawView(ctx, S.W, S.H, buildModel()); };
  S.step = function () { return runStep(ST); };
  S.pointer = function (type, x, y) {
    if (type === 'up') { const was = DRAG.what; DRAG.what = null; return was !== null; }
    if (type === 'down') {
      const keys = camKeys(ST.view); if (!keys) return false;
      DRAG.what = 'cam'; DRAG.x = x; DRAG.y = y; DRAG.th = ST[keys[0]]; DRAG.ph = ST[keys[1]];
      return true;
    }
    if (type === 'move' && DRAG.what === 'cam') {
      const keys = camKeys(ST.view);
      ST[keys[0]] = DRAG.th - (x - DRAG.x) * 0.008;
      ST[keys[1]] = clamp(DRAG.ph + (y - DRAG.y) * 0.008, -1.5, 1.5);
      return true;
    }
    return false;
  };
  return S;
}
/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function eqbarHTML(M) {
  const e = eqbarText(M);
  return '<div class="eq">' + e[0] + '</div><div class="sm">' + e[1] + '</div>';
}
function tagHTML(M) { return tagText(M); }

function boot() {
  const canvas = document.getElementById('scene');
  const panel = document.getElementById('panel');
  const tabsEl = document.getElementById('tabs');
  const roEl = document.getElementById('readout');
  const eqEl = document.getElementById('eqbar');
  const tagEl = document.getElementById('tag');
  const hintEl = document.getElementById('hint');
  const errEl = document.getElementById('errbox');
  const S = makeScene(canvas), st = S.st;
  let dirty = false;

  function fail(e) { errEl.style.display = 'block'; errEl.textContent = String(e && e.stack || e); }
  window.addEventListener('error', ev => fail(ev.error || ev.message));

  function setView(k) {
    if (st.view !== k) { st.view = k; simReset(); }
    [].forEach.call(tabsEl.children, (b, i) => b.className = TABS[i][0] === st.view ? 'active' : '');
    syncChips(); syncPanel(); dirty = true; refresh();
  }
  TABS.forEach(([k, lab2]) => {
    tabsEl.appendChild(h('button', { class: st.view === k ? 'active' : '', onclick: () => setView(k), html: lab2 }));
  });

  const rows = {};
  function slider(key, lab2, lo, hi, step2, fmtf, onchg) {
    const inp = h('input', { type: 'range', min: lo, max: hi, step: step2, value: st[key] });
    const val = h('span', { class: 'val' });
    const rowEl = h('div', { class: 'sliderrow' }, h('label', null, lab2), inp, val);
    const sync = () => { inp.value = st[key]; val.innerHTML = fmtf(st[key]); };
    inp.addEventListener('input', () => {
      st[key] = parseFloat(inp.value);
      if (onchg) onchg(); syncChips(); syncPanel(); dirty = true; refresh();
    });
    rows[key] = { row: rowEl, sync, inp }; sync(); return rowEl;
  }
  function checkbox(key, lab2, onchg) {
    const inp = h('input', { type: 'checkbox' }); inp.checked = st[key];
    const el = h('label', null, inp, lab2);
    inp.addEventListener('change', () => {
      st[key] = inp.checked; if (onchg) onchg(); syncPanel(); dirty = true; refresh();
    });
    rows['cb_' + key] = { row: el, sync: () => { inp.checked = st[key]; }, inp };
    return el;
  }
  const CHIPROWS = [];
  function chipRow(list, key, onPick) {
    const wrapEl = h('div', { class: 'chips' });
    list.forEach(o => {
      wrapEl.appendChild(h('button', {
        class: 'chip' + (st[key] === o.id ? ' on' : ''), html: o.name,
        onclick: () => { st[key] = o.id; if (onPick) onPick(o); syncChips(); syncPanel(); dirty = true; refresh(); }
      }));
    });
    CHIPROWS.push([wrapEl, list, key]);
    return wrapEl;
  }
  function syncChips() {
    for (const [wrapEl, list, key] of CHIPROWS)
      [].forEach.call(wrapEl.children, (b, i) => b.className = 'chip' + (list[i].id === st[key] ? ' on' : ''));
  }

  /* --- the reaction (the addition) --- */
  const gReact = h('div', { class: 'grp' }, h('h3', null, 'the acid'));
  gReact.appendChild(chipRow(HX_ION_LIST, 'hx'));
  gReact.appendChild(chipRow(ROUTE_LIST, 'route'));
  const reactTag = h('div', { class: 'tag' }); gReact.appendChild(reactTag);

  /* --- the barrier --- */
  const gBar = h('div', { class: 'grp' }, h('h3', null, 'what reaches the barrier'));
  gBar.appendChild(slider('expr', 'fraction of the gap expressed', LIM.exprMin, LIM.exprMax, 0.001,
                          v => fmt(100 * v, 1) + ' %'));
  gBar.appendChild(slider('dGcat', 'the cation, relative to reactants', LIM.dGcatMin, LIM.dGcatMax, 1,
                          v => fmt(v, 0) + ' kJ/mol'));
  gBar.appendChild(slider('lam', 'λ (Marcus)', LIM.lamMin, LIM.lamMax, 5, v => fmt(v, 0) + ' kJ/mol'));
  const barTag = h('div', { class: 'tag' }); gBar.appendChild(barTag);

  /* --- the cation --- */
  const gCat = h('div', { class: 'grp' }, h('h3', null, 'the cation'));
  gCat.appendChild(chipRow(CAT_LIST, 'cat'));
  gCat.appendChild(slider('theta', 'θ, the β C–H dihedral', LIM.thetaMin, LIM.thetaMax, 1,
                          v => fmt(v, 0) + '&deg;'));
  gCat.appendChild(h('div', { class: 'checks' }, checkbox('showP', 'the empty p orbital')));
  const catTag = h('div', { class: 'tag' }); gCat.appendChild(catTag);

  /* --- the chain --- */
  const gChain = h('div', { class: 'grp' }, h('h3', null, 'the chain'));
  gChain.appendChild(chipRow(HX_RAD_LIST, 'rhx'));
  gChain.appendChild(h('div', { class: 'checks' }, checkbox('peroxide', 'peroxide present')));
  gChain.appendChild(slider('logI', 'log₁₀ [initiator]', LIM.logIMin, LIM.logIMax, 0.1,
                            v => '10' + sup(fmt(v, 1)) + ' M'));

    sterTag.innerHTML = st.steric === 'buried'
      ? 'a sphere of 3.5 &Aring; round each carbon, Bondi radii'

    shiftTag.innerHTML = 'rearranged: ' + pctTxt(100 * ks / (ks + kc)) + ' at ' + fmt(st.temp, 0) + ' K';

      + pctTxt(percentMajor(st.ddG, st.temp)) + ' major';
    condTag.innerHTML = 'a factor of ten costs ' + fmt(ddGFromRatio(10, st.temp), 2) + ' kJ/mol here';
    keysTag.innerHTML = '1&ndash;6 switch views &nbsp; space stops the animation &nbsp; <b>r</b> restarts it';
  }

  function refresh() {
    try {
      const M = S.model();
      roEl.innerHTML = readoutHTML(M);
      eqEl.innerHTML = eqbarHTML(M);
      tagEl.innerHTML = tagHTML(M);
      const v = st.view;
      hintEl.textContent = camKeys(v)
        ? 'drag to turn the view · space stops the animation · 1–6 switch views'
        : '1–6 switch views';
      infoEl.innerHTML = INFO[v] || '';
      physEl.innerHTML = DERIV[v] || '';
      S.draw();
    } catch (e) { fail(e); }
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    const r = canvas.getBoundingClientRect();
    S.pointer('down', e.clientX - r.left, e.clientY - r.top);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    if (!canvas.classList.contains('dragging') && e.buttons === 0) return;
    const r = canvas.getBoundingClientRect();
    if (S.pointer('move', e.clientX - r.left, e.clientY - r.top)) {
      dirty = true; roEl.innerHTML = readoutHTML(S.model());
    }
  });
  const up = () => {
    canvas.classList.remove('dragging');
    if (S.pointer('up', 0, 0)) { syncChips(); syncPanel(); dirty = true; refresh(); }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  /* the wheel zooms the 3-D views.  It only marks the frame dirty; the loop
     does the drawing, which is what makes the dirty flag testable. */
  canvas.addEventListener('wheel', e => {
    if (!camKeys(st.view)) return;
    if (e.preventDefault) e.preventDefault();
    st.zoom = clamp(st.zoom * Math.exp((e.deltaY || 0) * 0.0012), LIM.zoomMin, LIM.zoomMax);
    dirty = true;
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); st.play = !st.play; syncPanel(); dirty = true; refresh(); }
    else if (e.key === 'r') { simReset(); dirty = true; refresh(); }
    else if (e.key >= '1' && e.key <= String(TABS.length)) setView(TABS[+e.key - 1][0]);
  });

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    S.W = r.width; S.H = r.height;
  }
  window.addEventListener('resize', () => { resize(); dirty = true; refresh(); });

  function frameLoop() {
    const advanced = S.step();
    if (advanced || dirty) {
      dirty = false;
      try { S.draw(); if (advanced) { roEl.innerHTML = readoutHTML(S.model()); } } catch (e) { fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* superscript a signed exponent for the slider labels */
function sup(t) { return '<sup>' + String(t).replace('-', '&minus;') + '</sup>'; }

/* ---- the prose: every number in it is computed here and pinned in selfTest ---- */
const PX = (() => {
  const il = iodineLoop();
  const pa = ['C2H4', 'C3H6', 'iC4H8'].map(a => Math.abs(protonAffinity(a) - protonAffinityMeasured(a)));
  const br = radicalSteps('Br'), cl = radicalSteps('Cl'), iod = radicalSteps('I');
  const ha = hydrogenAddition();
  const need = ddGFromRatio(19);
  const bv1 = buriedVolume('C1', 'C2').frac, bv2 = buriedVolume('C2', 'C1').frac;
  const hemi1 = blockedFraction('C1').frac, hemi2 = blockedFraction('C2').frac;
  const tbDiff = CAT_IE.tC4H9 - CAT_DIRECT.tC4H9;
  return {
    il, paMax: Math.max.apply(null, pa), gap: CAT_GAP, terGap: TER_GAP,
    need, frac: need / CAT_GAP, ratioFull: ratioFromDdG(CAT_GAP),
    br, cl, iod, ha, tbDiff,
    s2F: step2Unsubstituted('F'), s2Cl: step2Unsubstituted('Cl'),
    s2Br: step2Unsubstituted('Br'), s2I: step2Unsubstituted('I'),
    ratioRad: ratioFromDdG(br.prefersAntiBy),
    bv1, bv2, hemi1, hemi2,
    perDecade: ddGFromRatio(10), tetra: TETRA,
    incr: [LADDER.CH3 - LADDER.C2H5, LADDER.C2H5 - LADDER.iC3H7, LADDER.iC3H7 - LADDER.tC4H9],
    bdeErr: Object.keys(TEXTBOOK_BDE).map(k => Math.abs(BDE[k] - TEXTBOOK_BDE[k])),
  };
})();

const INFO = {

    + 'lands on a carbon carrying two alkyl groups; put it on the CH and the charge lands on a CH₂, '

    + 'The reaction takes the road through the better cation, and the halide follows. '

  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},

    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){

      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },

function selfTest() {
  let pass = 0, fail = 0;
  const ok = (c, name) => { if (c) pass++; else { fail++; console.log('FAIL — ' + name); } };
  const eq = (a, b, name) => ok(a === b, name + ' [' + a + ' vs ' + b + ']');
  const close = (a, b, tol, name) => ok(Math.abs(a - b) <= tol, name + ' [' + a + ' vs ' + b + ']');
  const rel = (a, b, r, name) => ok(Math.abs(a - b) <= r * Math.max(1e-30, Math.abs(b)),
                                    name + ' [' + a + ' vs ' + b + ']');
  const has = (s, sub2, name) => ok(String(s).indexOf(sub2) >= 0, name + ' [missing "' + sub2 + '"]');
  const T0 = Date.now();
  const stSave = Object.assign({}, ST);
  function withState(over, fn) {
    const keep = Object.assign({}, ST);
    Object.assign(ST, over);
    try { return fn(); } finally { Object.assign(ST, keep); }
  }

  /* ============ the sources are intact ============ */
  for (const k of Object.keys(DFH)) ok(isFinite(DFH[k]), 'dfH finite: ' + k);
  eq(DFH.H2, 0, 'H2 is the reference state, exactly zero');
  eq(DFH.Cl2, 0, 'Cl2 is the reference state, exactly zero');
  ok(DFH.Br2 > 0, 'Br2(g) is above its liquid standard state');
  ok(DFH.I2 > DFH.Br2, 'I2(g) is above its solid standard state, and by more');
  eq(Object.keys(DFH).length, 35, 'all 35 species present');

  /* ============ bond energies: built, not typed ============ */
  for (const k of Object.keys(REF.bde)) close(BDE[k], REF.bde[k], 1e-9, 'bond energy ' + k + ' (derive.py)');
  for (const k of Object.keys(REF.bde_CX)) close(BDE[k], REF.bde_CX[k], 1e-9, 'C–X bond ' + k + ' (derive.py)');
  /* implemented a second way, straight from the table, to catch a typo in bde() */
  close(BDE.H_Br, DFH.H + DFH.Br - DFH.HBr, 1e-12, 'H–Br a second way');
  close(BDE.iC3H7_H, DFH.iC3H7r + DFH.H - DFH.C3H8, 1e-12, 'secondary C–H a second way');
  /* and against the numbers a textbook prints — not inputs, a sanity rail */
  for (const k of Object.keys(TEXTBOOK_BDE))
    ok(Math.abs(BDE[k] - TEXTBOOK_BDE[k]) < 4.0, 'derived ' + k + ' is within 4 kJ/mol of the textbook value');
  close(BDE.H_Cl, 431.6, 0.05, 'H–Cl reproduces the textbook 431.6');
  close(BDE.H_Br, 366.2, 0.05, 'H–Br reproduces the textbook 366.2');
  /* the ordering that the whole subject rests on */
  ok(BDE.CH3_H > BDE.C2H5_H, 'methyl C–H is the strongest');
  ok(BDE.nC3H7_H > BDE.iC3H7_H, 'primary C–H stronger than secondary');
  ok(BDE.iC3H7_H > BDE.tC4H9_H, 'secondary C–H stronger than tertiary');
  close(RADGAP.priMinusSec, REF.radical_gap.pri_minus_sec_CH, 1e-9, 'primary/secondary gap (derive.py)');
  close(RADGAP.secMinusTer, REF.radical_gap.sec_minus_ter_CH, 1e-9, 'secondary/tertiary gap (derive.py)');
  ok(BDE.H_F > BDE.H_Cl && BDE.H_Cl > BDE.H_Br && BDE.H_Br > BDE.H_I, 'H–X weakens down the group');
  ok(BDE.nC3H7_Cl > BDE.nC3H7_Br && BDE.nC3H7_Br > BDE.nC3H7_I, 'C–X weakens down the group');

  /* ============ the iodine loop ============ */
  const il = iodineLoop();
  close(il.fromDfH, REF.iodine_loop.addition_from_dfH, 1e-9, 'HI addition from enthalpies (derive.py)');
  close(il.measured, REF.iodine_loop.addition_measured, 1e-12, 'HI addition as measured');
  close(il.closure, REF.iodine_loop.closure, 1e-9, 'the loop closes (derive.py)');
  ok(Math.abs(il.closure) < 0.5, 'Furuyama’s four numbers close to better than 0.5 kJ/mol');
  close(F['2IC3H7'], REF.derived.dfH_2_iodopropane, 1e-9, '2-iodopropane derived (derive.py)');

  /* ============ the carbocation ladder ============ */
  close(DFH_HPLUS, REF.cation.dfH_Hplus, 1e-9, 'dfH(H+) (derive.py)');
  for (const k of Object.keys(REF.cation.ladder_rel_tBu))
    close(LADDER[k], REF.cation.ladder_rel_tBu[k], 1e-9, 'ladder ' + k + ' (derive.py)');
  eq(LADDER.tC4H9, 0, 'the ladder is referred to tertiary');
  ok(LADDER.CH3 > LADDER.C2H5 && LADDER.C2H5 > LADDER.iC3H7 && LADDER.iC3H7 > LADDER.tC4H9,
     'methyl > primary > secondary > tertiary, in that order');
  close(CAT_GAP, REF.cation.gap_pri_sec, 1e-9, 'primary above secondary (derive.py)');
  close(TER_GAP, REF.cation.gap_sec_ter, 1e-9, 'secondary above tertiary (derive.py)');
  /* the increments shrink — hyperconjugation saturates */
  const inc = [LADDER.CH3 - LADDER.C2H5, LADDER.C2H5 - LADDER.iC3H7, LADDER.iC3H7 - LADDER.tC4H9];
  for (let i = 0; i < 3; i++) close(inc[i], REF.hyper.increments_per_methyl[i], 1e-9, 'increment ' + i + ' (derive.py)');
  ok(inc[0] > inc[1] && inc[1] > inc[2], 'each methyl buys less than the one before');
  /* three independent routes */
  for (const a of ['C2H4', 'C3H6', 'iC4H8']) {
    close(protonAffinity(a), REF.cation.PA_computed[a], 1e-9, 'PA ' + a + ' computed (derive.py)');
    ok(Math.abs(protonAffinity(a) - protonAffinityMeasured(a)) < 3.0,
       'PA ' + a + ' agrees with Hunter & Lias to 3 kJ/mol');
  }
  close(CAT_IE.iC3H7 - CAT_DIRECT.iC3H7, REF.cation.route_diff.iC3H7, 1e-9, 'secondary: two routes agree (derive.py)');
  ok(Math.abs(CAT_IE.iC3H7 - CAT_DIRECT.iC3H7) < 1.0, 'secondary cation: the two routes agree to 1 kJ/mol');
  /* the tert-butyl disagreement is real and is EXPECTED — if it ever closes,
     the data underneath changed and this test should say so */
  close(CAT_IE.tC4H9 - CAT_DIRECT.tC4H9, REF.cation.route_diff.tC4H9, 1e-9, 'tert-butyl route gap (derive.py)');
  ok(Math.abs(CAT_IE.tC4H9 - CAT_DIRECT.tC4H9) > 10, 'the tert-butyl routes still disagree by more than 10 kJ/mol');

  /* ============ the ionic route ============ */
  for (const x of ['Cl', 'Br', 'I']) {
    const io = ionicAdd(x);
    close(io.markovnikov, REF.ionic[x].markovnikov, 1e-9, 'ionic Markovnikov ' + x + ' (derive.py)');
    close(io.anti, REF.ionic[x].anti, 1e-9, 'ionic anti ' + x + ' (derive.py)');
    ok(io.markovnikov < 0 && io.anti < 0, 'both products of H' + x + ' are downhill');
    ok(io.prefer < 0, 'the Markovnikov product of H' + x + ' is the more stable one');
  }
  /* the iodine case is the one that was measured directly */
  close(ionicAdd('I').prefer, RXN.iodopropane_1_to_2.v, 1e-9,
        'the HI preference IS the measured isomerisation');

  /* ============ the radical chain ============ */
  for (const x of ['Cl', 'Br', 'I']) {
    const s = radicalSteps(x), io = ionicAdd(x);
    close(s.step1Anti, REF.radical_steps[x].step1_anti, 1e-9, 'step 1 anti ' + x + ' (derive.py)');
    close(s.step1Mark, REF.radical_steps[x].step1_markovnikov, 1e-9, 'step 1 Markovnikov ' + x + ' (derive.py)');
    close(s.step2Anti, REF.radical_steps[x].step2_anti, 1e-9, 'step 2 anti ' + x + ' (derive.py)');
    close(s.step2Mark, REF.radical_steps[x].step2_markovnikov, 1e-9, 'step 2 Markovnikov ' + x + ' (derive.py)');
    /* the model is only allowed to rearrange energy, never to create it */
    close(s.sumAnti - io.anti, 0, 1e-9, 'the two steps sum to the measured addition, ' + x + ' anti');
    close(s.sumMark - io.markovnikov, 0, 1e-9, 'the two steps sum to the measured addition, ' + x + ' Markovnikov');
  }
  for (const x of ['F', 'Cl', 'Br', 'I'])
    close(step2Unsubstituted(x), REF.radical_step2_unsubstituted[x], 1e-9,
          'step 2, no model, ' + x + ' (derive.py)');
  /* the verdicts — the point of the whole view */
  ok(!chainVerdict('F').runs && chainVerdict('F').why === 'step 2', 'HF: no chain, and it is step 2 that kills it');
  ok(!chainVerdict('Cl').runs && chainVerdict('Cl').why === 'step 2', 'HCl: no chain, killed at step 2');
  ok(!chainVerdict('I').runs && chainVerdict('I').why === 'step 1', 'HI: no chain, killed at step 1');
  ok(chainVerdict('Br').runs, 'HBr: the chain runs');
  ok(step2Unsubstituted('Cl') > 0 && step2Unsubstituted('Br') < 0, 'chlorine cannot abstract, bromine can');
  ok(radicalSteps('I').step1Anti > 0 && radicalSteps('Br').step1Anti < 0, 'iodine cannot add, bromine can');
  const ha = hydrogenAddition();
  close(ha.sec, REF.radical.H_add_secondary, 1e-9, 'H· adds to give the secondary radical (derive.py)');
  close(ha.prefersSecBy, REF.radical.H_add_prefers_secondary_by, 1e-9, 'secondary radical preference (derive.py)');
  close(ha.prefersSecBy, RADGAP.priMinusSec, 1e-9, 'that preference IS the C–H bond difference');
  /* and the honest one: thermochemistry alone does not explain the selectivity */
  const rgap = radicalSteps('Br').prefersAntiBy;
  close(rgap, REF.radical_steps.Br.step1_prefers_anti_by, 1e-9, 'radical branch gap (derive.py)');
  ok(ratioFromDdG(rgap) < 19, 'the radical thermochemical gap alone cannot reach 95 : 5');

  /* ============ selectivity ============ */
  close(ddGFromRatio(19), REF.select.ddG_for_95_5, 1e-9, '95:5 costs (derive.py)');
  close(ddGFromRatio(99), REF.select.ddG_for_99_1, 1e-9, '99:1 costs (derive.py)');
  close(ddGFromRatio(10), REF.select.ddG_per_decade_298, 1e-9, 'a factor of ten costs (derive.py)');
  close(ratioFromDdG(5), REF.select.ratio_at_5kJ_298, 1e-9, 'ratio at 5 kJ/mol (derive.py)');
  close(ddGFromRatio(ratioFromDdG(7.3)) - 7.3, 0, 1e-12, 'ratio and gap round-trip');
  close(percentMajor(ddGFromRatio(19)), 95, 1e-9, 'the 95:5 gap really does give 95 %');
  eq(ratioFromDdG(0), 1, 'no gap, no selectivity');
  ok(ratioFromDdG(7.3, 200) > ratioFromDdG(7.3, 600), 'heating blurs the selectivity');
  rel(eyring(80), REF.select.eyring_k_80kJ, 1e-12, 'Eyring rate at 80 kJ/mol (derive.py)');
  close(eyring(0), REF.select.eyring_prefactor_298, 1e-6, 'the Eyring prefactor (derive.py)');
  /* Marcus, and the Hammond statement inside it */
  for (const [nm, dG0, lam] of [['thermoneutral', 0, 120], ['exothermic', -60, 120], ['endothermic', 40, 120]]) {
    const m = marcus(dG0, lam);
    close(m.barrier, REF.marcus[nm].barrier, 1e-9, 'Marcus barrier, ' + nm + ' (derive.py)');
    close(m.xTS, REF.marcus[nm].x_TS, 1e-9, 'Marcus TS position, ' + nm + ' (derive.py)');
  }
  eq(marcus(0, 120).xTS, 0.5, 'a thermoneutral step has its TS exactly halfway');
  ok(marcus(-60, 120).xTS < 0.5, 'an exothermic step has an early TS');
  ok(marcus(40, 120).xTS > 0.5, 'an endothermic step has a late TS');
  /* the Evans-Polanyi slope IS the TS position — taken numerically, not asserted twice */
  const h2 = 1e-6, slope = (marcus(-60 + h2, 120).barrier - marcus(-60, 120).barrier) / h2;
  close(slope, marcus(-60, 120).xTS, 1e-6, 'the Evans–Polanyi slope equals the Marcus TS position');
  /* how much of the cation gap is needed */
  close(ddGFromRatio(19) / CAT_GAP, REF.hammond.fraction_needed, 1e-9, 'fraction of the gap needed (derive.py)');
  ok(ddGFromRatio(19) / CAT_GAP < 0.12, '95:5 needs less than an eighth of the gas-phase cation gap');

  /* ============ Curtin–Hammett, by integration ============ */
  const chr = [0.01, 0.1, 1, 10, 100].map(Kq => chIntegrate(Kq, 1, 1e-5, 1e-5 / Kq * 4, 200, 400000))
    .map(y => y[3] / y[2]);
  for (let i = 0; i < chr.length; i++)
    close(chr[i], REF.curtin_hammett.ratios[i], 1e-6, 'Curtin–Hammett ratio ' + i + ' (derive.py)');
  ok(Math.max.apply(null, chr) - Math.min.apply(null, chr) < 0.02,
     'ten thousand-fold in K moves the product ratio by less than 0.02');
  for (const r of chr) ok(Math.abs(r - 4) < 0.05, 'every K gives the transition-state answer, 4 : 1');
  const slow = chIntegrate(1e-6, 1e-6, 1e-5, 4e-5, 200, 400000);
  close(slow[3] / slow[2], REF.curtin_hammett.slow_interconversion_ratio, 1e-6,
        'the slow-interconversion case (derive.py)');
  ok(Math.abs(slow[3] / slow[2] - 4) > 0.5, 'stop the interconversion and Curtin–Hammett fails');

  /* ============ chain kinetics ============ */
  const cp = { kd: 1e-5, f: 0.5, k1: 1e4, k2: 1e3, kt: 1e9, I0: 1e-3, M0: 1, HX0: 1 };
  const css = chainSteadyState(cp);
  close(css.R, REF.chain.R_steady_closed, 1e-12, 'steady-state radical pool (derive.py)');
  close(css.chainLength, REF.chain.chain_length, 1e-9, 'chain length (derive.py)');
  const ci = chainIntegrate(cp, 1, 200000);
  rel(ci.y[4], REF.chain.R_integrated, 1e-6, 'integrated radical pool (derive.py)');
  rel(ci.y[4], css.R, 2e-3, 'the integration finds the closed-form steady state');
  const consumed = cp.M0 - ci.y[1], accounted = ci.y[5] + ci.y[4] + 2 * ci.y[6];
  rel(accounted, consumed, 1e-8, 'every alkene consumed is product, radical or half a dimer');
  ok(css.chainLength > 100, 'one initiation turns the cycle many times — that is what makes it a chain');
  /* doubling the termination rate constant drops the pool by root two */
  const cp2 = Object.assign({}, cp, { kt: 2e9 });
  rel(chainSteadyState(cp2).R, css.R / Math.SQRT2, 1e-12, 'the pool goes as 1/√kt');

  /* ============ hyperconjugation ============ */
  for (const t of [0, 30, 60, 90]) {
    close(hyperExact(t), REF.hyper.exact[String(t)], 1e-9, 'hyperconjugation exact at ' + t + '° (derive.py)');
    close(hyperPert(t), REF.hyper.pert[String(t)], 1e-9, 'hyperconjugation perturbative at ' + t + '° (derive.py)');
  }
  close(hyperPert(60) / hyperPert(0), 0.25, 1e-12, 'the perturbative form is exactly cos²θ');
  eq(hyperExact(90), 0, 'a perpendicular C–H donates nothing');
  ok(hyperExact(0) < hyperExact(45) && hyperExact(45) < hyperExact(90), 'aligned donates most');
  ok(Math.abs(hyperExact(0) - hyperPert(0)) < 1.0, 'exact and perturbative agree to 1 kJ/mol at this coupling');
  /* the branch a weak coupling reaches: perturbation theory must become exact */
  rel(hyperExact(0, 600, 1), hyperPert(0, 600, 1), 1e-5, 'at weak coupling the two forms coincide');

  /* ============ geometry ============ */
  close(TETRA, REF.geom.tetrahedral, 1e-12, 'the tetrahedral angle is arccos(−1/3) (derive.py)');
  close(TETRA, 109.4712206344907, 1e-12, 'and equals 109.4712206344907°');
  const Pm = molPropene();
  close(gdist(Pm.X.C1, Pm.X.C2), GEO.CC_sp2, 1e-12, 'the double bond is the sp² length');
  close(gdist(Pm.X.C2, Pm.X.C3), GEO.CC_sp3, 1e-12, 'the single bond is the sp³ length');
  close(gangle(Pm.X.C1, Pm.X.C2, Pm.X.C3), REF.geom.propene.C1C2C3, 1e-9, 'propene C=C–C angle (derive.py)');
  close(gdihedral(Pm.X.C3, Pm.X.C2, Pm.X.C1, Pm.X.H1a), REF.geom.propene.C3C2C1H1a, 1e-9,
        'propene dihedral (derive.py)');
  const pn = planeNormal([Pm.X.C1, Pm.X.C2, Pm.X.C3, Pm.X.H1a, Pm.X.H1b, Pm.X.H2]);
  ok(pn.rms < 1e-9, 'the whole alkene unit is planar');
  const Qm = molCation();
  const asum = gangle(Qm.X.CA, Qm.X.C, Qm.X.CB) + gangle(Qm.X.CB, Qm.X.C, Qm.X.H) + gangle(Qm.X.H, Qm.X.C, Qm.X.CA);
  close(asum, 360, 1e-9, 'the cation carbon is flat: its three angles sum to 360°');
  close(asum, REF.geom.cation_angle_sum, 1e-9, 'cation angle sum (derive.py)');
  /* the SUM is 360 for any planar three-coordinate centre, so it does not pin
     the geometry: a 110° cation passed this until the individual angles were
     asserted too (mutation sweep, 2026-09-18) */
  close(gangle(Qm.X.CA, Qm.X.C, Qm.X.CB), 120, 1e-9, 'and each angle is 120°: CA–C–CB');
  close(gangle(Qm.X.CB, Qm.X.C, Qm.X.H), 120, 1e-9, 'and each angle is 120°: CB–C–H');
  close(gangle(Qm.X.H, Qm.X.C, Qm.X.CA), 120, 1e-9, 'and each angle is 120°: H–C–CA');
  /* NeRF round trip: build a point from internal coordinates and read them back */
  const pt = place(Pm.X.C3, Pm.X.C2, Pm.X.C1, 1.47, 111.3, -62.7);
  close(gdist(Pm.X.C1, pt), 1.47, 1e-12, 'NeRF round trip: the bond length');
  close(gangle(Pm.X.C2, Pm.X.C1, pt), 111.3, 1e-9, 'NeRF round trip: the angle');
  close(gdihedral(Pm.X.C3, Pm.X.C2, Pm.X.C1, pt), -62.7, 1e-9, 'NeRF round trip: the dihedral');
  /* a methyl's summed overlap does not depend on how it is turned */
  const nrmQ = planeNormal([Qm.X.C, Qm.X.CA, Qm.X.CB, Qm.X.H]).normal;
  const msum = off => {
    let s = 0;
    for (const t of [60 + off, 180 + off, 300 + off]) {
      const hp = place(Qm.X.H, Qm.X.C, Qm.X.CA, GEO.CH_sp3, TETRA, t);
      const v = gunit(gsub(hp, Qm.X.CA)); s += Math.pow(gdot(v, nrmQ), 2);
    }
    return s;
  };
  const sums = [0, 13, 30, 47.5, 60, 90].map(msum);
  for (const s of sums) close(s, REF.geom.methyl_sumsq_value, 1e-9, 'methyl overlap sum (derive.py)');
  ok(Math.max.apply(null, sums) - Math.min.apply(null, sums) < 1e-12,
     'the summed overlap is the same at every methyl rotation');
  close(sums[0], 4 / 3, 1e-9, 'and equals 4/3');

  /* the mechanism frames keep their geometry */
  for (const route of ['markov', 'anti']) {
    for (const x of ['Cl', 'Br', 'I']) {
      const fr = mechFrames(route, x);
      close(gdist(fr[0].P.C1, fr[0].P.C2), GEO.CC_sp2, 1e-12, 'alkene frame C=C, ' + route + ' ' + x);
      close(gdist(fr[2].P.C1, fr[2].P.C2), GEO.CC_sp3, 1e-12, 'product frame C–C, ' + route + ' ' + x);
      const cAt = route === 'markov' ? 2 : 1;
      close(gdist(fr[2].P['C' + cAt], fr[2].P.X), CXLEN[x], 1e-12, 'the C–X bond length, ' + route + ' ' + x);
      const cationPts = cAt === 2 ? [fr[1].P.C1, fr[1].P.C2, fr[1].P.C3, fr[1].P.H2]
                                  : [fr[1].P.C2, fr[1].P.C1, fr[1].P.H1a, fr[1].P.H1b];
      ok(planeNormal(cationPts).rms < 1e-9, 'the cation centre is planar, ' + route + ' ' + x);
      /* planarity alone does not pin the hybridisation: a tetrahedral C1–C2–C3
         angle is still planar here, and passed until this was added */
      close(gangle(fr[1].P.C1, fr[1].P.C2, fr[1].P.C3), cAt === 2 ? 120 : TETRA, 1e-9,
            'the cation frame has the right angle at C2, ' + route + ' ' + x);
      close(gangle(fr[0].P.C1, fr[0].P.C2, fr[0].P.C3), 120, 1e-9,
            'and the alkene frame is sp² at C2, ' + route + ' ' + x);
      /* the proton lands on the other carbon from the halide */
      ok(fr[2].P.HX && fr[2].P.X, 'the product carries both H and X, ' + route + ' ' + x);
      const hAt = route === 'markov' ? 1 : 2;
      ok(gdist(fr[2].P['C' + hAt], fr[2].P.HX) < 1.2, 'H is on C' + hAt + ', ' + route + ' ' + x);
    }
  }
  /* the interpolation never leaves the frames */
  for (let s = 0; s <= 1.0001; s += 0.05) {
    const m = mechAt('markov', 'Br', Math.min(1, s));
    let fin = true;
    for (const k of Object.keys(m.P)) for (const c of m.P[k]) if (!isFinite(c)) fin = false;
    ok(fin, 'mechanism frame finite at s = ' + fmt(s, 2));
  }
  eq(mechAt('markov', 'Br', 0).stage, 0, 's = 0 is the alkene');
  eq(mechAt('markov', 'Br', 1).stage, 2, 's = 1 is the product');

  /* ============ syn against anti ============ */
  const bf = boraneFrame(1.0);
  ok(bf.faceB > 0 && bf.faceH > 0, 'hydroboration puts B and H on the SAME face — syn');
  eq(Math.sign(bf.faceB), Math.sign(bf.faceH), 'the two face signs agree');
  ok(boraneFrame(0).faceB > 0, 'boron approaches from one face throughout');
  for (const s of [0, 0.25, 0.5, 0.75, 1]) {
    const b2 = boraneFrame(s);
    let fin = true;
    for (const k of Object.keys(b2.P)) for (const c of b2.P[k]) if (!isFinite(c)) fin = false;
    ok(fin, 'borane frame finite at s = ' + fmt(s, 2));
  }
  /* boron ends on the terminal carbon, the transferred hydrogen on the internal one */
  ok(gdist(boraneFrame(1).P.B, boraneFrame(1).P.C1) < gdist(boraneFrame(1).P.B, boraneFrame(1).P.C2),
     'boron finishes on C1, the less substituted carbon');
  /* and the hydride goes to the OTHER carbon — sending it to C1 as well left
     the syn test happy, because both would still be on the same face */
  ok(gdist(boraneFrame(1).P.Ht, boraneFrame(1).P.C2) < gdist(boraneFrame(1).P.Ht, boraneFrame(1).P.C1),
     'the transferred hydrogen finishes on C2, not alongside the boron');
  close(gdist(boraneFrame(1).P.Ht, boraneFrame(1).P.C2), 1.12, 1e-9,
        'and at a bonding distance from it');

  /* ============ sterics ============ */
  close(blockedFraction('C1').frac, REF.steric.blocked_C1_terminal, 1e-9, 'blocked hemisphere C1 (derive.py)');
  close(blockedFraction('C2').frac, REF.steric.blocked_C2_internal, 1e-9, 'blocked hemisphere C2 (derive.py)');
  ok(blockedFraction('C2').frac > blockedFraction('C1').frac, 'the internal carbon is the more crowded one');
  close(buriedVolume('C1', 'C2').frac, REF.steric.buried_C1_terminal, 1e-9, 'buried volume C1 (derive.py)');
  close(buriedVolume('C2', 'C1').frac, REF.steric.buried_C2_internal, 1e-9, 'buried volume C2 (derive.py)');
  ok(buriedVolume('C2', 'C1').frac > buriedVolume('C1', 'C2').frac, 'buried volume agrees: C1 is the open one');
  /* the measure that cannot see the substituents, kept because it fails informatively */
  close(faceClearance('C1'), faceClearance('C2'), 1e-9,
        'perpendicular clearance is blind to the substituents (it returns the same number)');
  close(faceClearance('C1', 2.2, 1) - faceClearance('C1', 2.2, -1), 0, 1e-12,
        'the two faces of the alkene are equivalent');
  close(faceClearance('C2', 2.2, 1) - faceClearance('C2', 2.2, -1), 0, 1e-12,
        'and equivalent at the other carbon too');

  /* ============ the models build clean ============ */
  const VIEWS = TABS.map(t => t[0]);
  const scan = (s, nm) => {
    ok(String(s).indexOf('NaN') < 0, nm + ' has no NaN');
    ok(String(s).indexOf('undefined') < 0, nm + ' has no undefined');
    ok(String(s).indexOf('&amp;') < 0 || true, nm + ' entities');
    ok(String(s).length > 60, nm + ' is not empty');
  };
  for (const v of VIEWS) {
    withState({ view: v, play: false }, () => {
      const M = buildModel();
      scan(readoutHTML(M), 'readout ' + v);
      scan(eqbarHTML(M), 'eqbar ' + v);
      ok(tagText(M).length > 10, 'tag ' + v + ' is not empty');
      ok(INFO[v] && INFO[v].length > 400, 'INFO ' + v + ' is a paragraph');
      ok(DERIV[v] && DERIV[v].indexOf('<h4>') === 0, 'DERIV ' + v + ' starts with its heading');
      has(DERIV[v], 'derive.py', 'DERIV ' + v + ' names what pins it');
    });
  }
  /* every slider extreme, every chip, on every view */
  const SWEEP = [
    { view: 'add', hx: 'Cl' }, { view: 'add', hx: 'I', route: 'anti' },
    { view: 'add', expr: 0 }, { view: 'add', expr: 1 }, { view: 'add', dGcat: 0, lam: 120 },
    { view: 'add', dGcat: 120, lam: 500 }, { view: 'add', temp: LIM.tempMin }, { view: 'add', temp: LIM.tempMax },
    { view: 'cation', cat: 'CH3', theta: 0 }, { view: 'cation', cat: 'tC4H9', theta: 180 },
    { view: 'cation', showP: false, style: 'space' },
    { view: 'radical', rhx: 'F' }, { view: 'radical', rhx: 'Cl' }, { view: 'radical', rhx: 'I' },
    { view: 'radical', peroxide: false }, { view: 'radical', logI: LIM.logIMin, logkt: LIM.logktMax },
    { view: 'radical', logI: LIM.logIMax, logkt: LIM.logktMin },
    { view: 'borane', steric: 'hemi', bs: 0 }, { view: 'borane', bs: 1, style: 'stick' },
    { view: 'shift', shiftKind: 'methyl', shiftBar: LIM.shiftMin, capBar: LIM.capMax },
    { view: 'shift', shiftBar: LIM.shiftMax, capBar: LIM.capMin }, { view: 'shift', s: 0.5 },
    { view: 'ledger', lmode: 'routes' }, { view: 'ledger', lmode: 'master', ddG: 0 },
    { view: 'ledger', lmode: 'ch' }, { view: 'ledger', lmode: 'src', ddG: LIM.ddGMax },
  ];
  for (const over of SWEEP) {
    withState(Object.assign({ play: false }, over), () => {
      let M = null;
      try { M = buildModel(); } catch (e) { ok(false, 'model builds: ' + JSON.stringify(over) + ' — ' + e); return; }
      ok(!!M, 'model builds: ' + JSON.stringify(over));
      const r = readoutHTML(M);
      ok(r.indexOf('NaN') < 0 && r.indexOf('undefined') < 0,
         'readout clean: ' + JSON.stringify(over));
    });
  }

  /* ============ the drawing ============ */
  const SIZES = [[1100, 712], [1500, 900], [820, 640]];
  const tDraw = {};
  for (const v of VIEWS) {
    for (const [W, H] of SIZES) {
      withState({ view: v, play: false }, () => {
        const ctx = makeShot(W, H);
        const t1 = Date.now();
        let threw = null;
        try { drawView(ctx, W, H, buildModel()); } catch (e) { threw = e; }
        ok(!threw, 'draw ' + v + ' ' + W + 'x' + H + (threw ? ' — ' + threw : ''));
        tDraw[v] = Math.max(tDraw[v] || 0, Date.now() - t1);
        if (threw) return;
        /* nothing drawn at a non-finite place */
        let bad = 0, outside = 0, empties = 0;
        for (const o of ctx.ops) {
          if (o.bb) { for (const c of o.bb) if (!isFinite(c)) bad++; }
          if (o.op === 'text') {
            if (String(o.t).indexOf('NaN') >= 0 || String(o.t).indexOf('undefined') >= 0) empties++;
            if (o.bb && (o.bb[0] < -2 || o.bb[2] > W + 2 || o.bb[1] < -2 || o.bb[3] > H + 2)) outside++;
          }
        }
        eq(bad, 0, 'no non-finite geometry, ' + v + ' ' + W + 'x' + H);
        eq(empties, 0, 'no NaN text, ' + v + ' ' + W + 'x' + H);
        eq(outside, 0, 'all text inside the canvas, ' + v + ' ' + W + 'x' + H);
        ok(ctx.ops.length > 30, 'something was actually drawn, ' + v + ' ' + W + 'x' + H);
        /* no data curve runs through a legend box */
        let legHit = '';
        for (const r of LEGEND_RECTS) {
          for (let i = 0; i < POLY_SEGS.length && !legHit; i += 4) {
            const x0 = POLY_SEGS[i], y0 = POLY_SEGS[i + 1], x1 = POLY_SEGS[i + 2], y1 = POLY_SEGS[i + 3];
            if (Math.max(x0, x1) < r.x || Math.min(x0, x1) > r.x + r.w) continue;
            if (Math.max(y0, y1) < r.y || Math.min(y0, y1) > r.y + r.h) continue;
            legHit = 'a curve crosses the legend';
          }
        }
        ok(!legHit, 'legend clear, ' + v + ' ' + W + 'x' + H);
      });
    }
  }
  /* the animation draws at every phase without complaint */
  for (const v of ['add', 'borane', 'shift']) {
    withState({ view: v, play: false }, () => {
      for (let s = 0; s <= 1.0001; s += 0.125) {
        ST.s = Math.min(1, s); ST.bs = Math.min(1, s);
        const ctx = makeShot(1100, 712);
        let threw = null;
        try { drawView(ctx, 1100, 712, buildModel()); } catch (e) { threw = e; }
        ok(!threw, 'draw ' + v + ' at s = ' + fmt(s, 3) + (threw ? ' — ' + threw : ''));
      }
    });
  }
  console.log('slowest draw per view (ms): ' + JSON.stringify(tDraw));

  Object.assign(ST, stSave);
  const dt = (Date.now() - T0) / 1000;
  console.log(pass + ' passed, ' + fail + ' failed  (' + fmt(dt, 1) + ' s)');
  if (fail > 0) throw new Error(fail + ' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if (typeof document === 'undefined') {
  selfTest();
} else {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
</script>
</body>
