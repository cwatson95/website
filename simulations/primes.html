<title>Primes &mdash; the special forms, their proofs, and the newest record</title>
<!--
  ===================================================================
  primes.html — how the largest primes are found and PROVEN: the
  special forms, the n+1 and n-1 tests, and t5k entry 141212
  ===================================================================

  Six views.  THE FORMS: Mersenne 2^p-1, Fermat 2^(2^n)+1, generalized
  Fermat b^(2^n)+1, Proth k 2^n+1, Riesel k 2^n-1, Cullen n 2^n+1 and
  Woodall n 2^n-1, every small member decided LIVE by the form's own exact
  test.  THE N+1 TESTS: Lucas-Lehmer and Lucas-Lehmer-Riesel animated
  residue by residue.  THE N-1 TESTS: Proth's theorem (the witness and the
  square-and-multiply chain), Pepin's test, and Pocklington/Theorem 2 with
  N-1 fully factored (the generalized-Fermat proof).  THE RECORD: t5k entry
  141212, 5336284^1048576+1 (7,054,022 digits, PrimeGrid, 2025-10-31) —
  its anatomy, the sieve -> PRP -> prove pipeline replayed on a small field,
  and the N-1 proof in miniature.  THE RECORDS: every record prime by year
  since 1588 on a log axis, plus the ten largest known.  THE COVERING SETS:
  why 78557 (Sierpinski) and 509203 (Riesel) can never give a prime.

  WHAT IS EXACT HERE
  ------------------
  * Every verdict on a small member is exact BigInt arithmetic by the
    form's own theorem — Lucas-Lehmer, LLR with Rodseth's starting value,
    Proth, Pepin, Pocklington with N-1 fully factored — and every one is
    cross-checked against Miller-Rabin (deterministic below 3.3e24, which
    covers every number decided here) in selfTest, and against an
    independent Python implementation in build_primes/derive.py.
  * Every DIGIT COUNT of a record prime is recomputed from its exponent
    (floor(e log10 b)+1) and matches the source's printed count — that
    check caught two garbled expressions in the fetched tables.
  * The covering sets are verified for two full periods.

  WHAT IS SOURCED (verbatim, build_primes/derive.py -> p2_data.js)
  ---------------------------------------------------------------
  t5k.org: entry 141212 (the record's every printed field), prover code
  L5543, the ten largest, records by year, the 52 Mersenne exponents, the
  Cullen / Woodall / generalized-Fermat top-20; primegrid.com: the record's
  discoverer/team/date row; Wikipedia: A005849, A080076, the LLR
  starting-value rules, the two covering sets, F5-F8 factors.

  NOT AVAILABLE
  -------------
  PrimeGrid's announcement PDF for the record returned 404 on both hosts,
  so the discovery hardware, Genefer version and PRP timings are NOT shown;
  only the t5k-verified proof (PFGW 4.0.4, N-1 BLS, 20.41 days) is.
  Nothing here is approximate; the log-axis history is a chart of exact
  digit counts.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop
   in a naive generator (sbs_sims Known-bad) — return [] instead */
function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];

    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }

function jacobi(a,n){

const MR_BASES=[2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n,41n];

function pipeline(){ return cached('pipe',()=>{

    return small.every(q=>N%BigInt(q)!==0n||N===BigInt(q)); });
  const prp=sieved.filter(b=>fermatPRP(BigInt(b)**4n+1n,3));

    lazyC(M,'mr',()=>millerRabin(M.N));
    M.maxStep=Math.max(0,M.seq.length-1);
  }
  if(view==='nminus'){
    if(st.nminus==='proth'||st.nminus==='cullen'){
      const k=st.nminus==='proth'?(st.k|1):st.cn, n=st.nminus==='proth'?st.n:st.cn;
      const applies=BigInt(k)<(1n<<BigInt(n));
      M.k=k; M.n=n; M.applies=applies;
      M.N=BigInt(k)*(1n<<BigInt(n))+1n;
      M.label=(st.nminus==='cullen'?'C'+n+' = ':'')+k+'·2^'+n+' + 1';
      if(applies){ M.test=cached('proth|'+k+'|'+n,()=>prothTest(k,n)); M.a=M.test.a;
        M.chain=cached('chain|'+k+'|'+n,()=>M.a?powChain(M.a,(M.N-1n)/2n,M.N):[]); M.verdict=M.test.prime; }
      else { M.verdict=millerRabin(M.N); M.chain=[]; }
    } else if(st.nminus==='fermat'){ const n=clamp(st.fn,1,12);
      M.n=n; M.N=fermatNumber(n); M.a=3n; M.label='F'+n+' = 2^'+Math.pow(2,n)+' + 1';
      M.test=cached('pepin|'+n,()=>pepin(n)); M.verdict=M.test.prime; M.applies=true;
      M.chain=cached('pchain|'+n,()=>n<=9?powChain(3n,(M.N-1n)/2n,M.N):[]);
      M.factors=FERMAT_FACTORS[String(n)]||null;
    } else { const b=st.gb-(st.gb%2), n=clamp(st.gn,1,GF_NMAX);
      M.b=b; M.n=n; M.N=gfNumber(b,n); M.label=b+'^'+Math.pow(2,n)+' + 1';
      M.test=cached('gf|'+b+'|'+n,()=>gfProve(b,n)); M.verdict=M.test.prime; M.applies=true;
      M.qs=M.test.qs; M.wit=M.test.wit; M.chain=[]; }
    M.stepShown=clamp(Math.floor(st.step),0,Math.max(0,M.chain.length-1));
    M.done=M.chain.length===0||M.stepShown>=M.chain.length-1;
    M.maxStep=Math.max(0,M.chain.length-1);
    lazyC(M,'mr',()=>millerRabin(M.N));
    M.det=isDeterministic(M.N);
  }
  if(view==='record'){ M.rec=recordFacts(); lazyC(M,'pipe',pipeline); }
  if(view==='history'){
    M.pts=cached('hist',()=>{
      const o=[];
      for(const r of BY_YEAR_PRE) o.push({expr:r[0],digits:r[1],year:r[2],who:r[3],how:r[4],era:'pre'});
      for(const r of BY_YEAR_ELEC) o.push({expr:r[0],digits:r[1],year:r[2],who:r[4],how:r[3],era:'elec'});
      return o; });
    if(st.hi>=0&&M.pts[st.hi]) M.hover=M.pts[st.hi];
  }
  if(view==='cover'){ M.cov=coverTable(st.cover); M.remaining=st.cover==='sierp'?SIERP.remaining:RIESEL.remaining; }
  return M;
}

function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function verdictRow(v,det){
  if(v===true) return rrow('verdict',det===false?'strong probable prime':'PRIME','good');
  if(v===false) return rrow('verdict','composite','bad');
  return rrow('verdict','undecided','');
}
function formName(id){ const f=FORMS.find(f=>f.id===id); return f?f.name:id; }

function readoutHTML(M){

    if(st.form==='cullen') s+=rrow('known Cullen primes',CULLEN_N.length+' (A005849)')+rrow('largest','6679881·2^6679881 + 1');

  else if(M.view==='nplus'){

    if(M.P!==undefined&&M.P!==null&&M.seq.length) s+=rrow('Rödseth P',M.P.toString())+rrow('u₀ = V_k(P,1)',fmtBig(M.seq[0]));
    if(M.seq.length) s+=hd('the sequence')+rrow('step shown',M.stepShown+' / '+(M.seq.length-1))
      +rrow('residue',fmtBig(M.seq[M.stepShown]));
    else s+=hd('the sequence')+rrow('settled by','trial division'+(M.small?' by '+M.small:''));
    if(M.done) s+=verdictRow(M.verdict,true)+rrow('Miller–Rabin agrees',M.mr===M.verdict?'yes':'NO',M.mr===M.verdict?'good':'bad');
    else s+=rrow('verdict','… running','');
  }
  else if(M.view==='nminus'){
    s+=hd('the number')+rrow('N',M.label)+rrow('digits',digitsOf(M.N));

    if(M.a) s+=rrow('witness a',M.a.toString())+rrow('(a | N)','−1');
    if(M.chain.length) s+=hd('the chain')+rrow('bits of (N−1)/2',M.chain.length)

    if(M.qs){ s+=hd('N − 1 = b^(2^n)')+rrow('prime factors of b',M.qs.join(', '));
      for(const q of M.qs) s+=rrow('witness for q = '+q,M.wit&&M.wit[q.toString()]!==undefined?'a = '+M.wit[q.toString()]:'—'); }
    if(M.factors) s+=rrow('known factors',M.factors.join(' × ')+(M.n===8?' × (62 digits)':''));
    if(M.done) s+=verdictRow(M.verdict,M.det)+rrow('Miller–Rabin agrees',M.mr===M.verdict?'yes':'NO',M.mr===M.verdict?'good':'bad');

    s+=hd('the proof')+rrow('N − 1 = b^(2^20), b =',R.bfac.join(' × '))
      +rrow('prime q to witness','2 and 1334071')+rrow('program',RECORD.verifier.split(',')[0])
      +rrow('test','N−1, Brillhart–Lehmer–Selfridge')+rrow('elapsed','20.41 days')

      +verdictRow(R.replica.prime,true);

  else if(M.view==='history'){
    s+=hd('record primes by year')+rrow('rows',M.pts.length+' (t5k)')
      +rrow('first','2^17 − 1, 1588')+rrow('latest','2^136279841 − 1, 2024');
    if(M.hover) s+=hd('the point')+rrow('prime',M.hover.expr)+rrow('digits',fmtInt(M.hover.digits))
      +rrow('year',M.hover.year)+rrow('who',M.hover.who)+rrow(M.hover.era==='pre'?'method':'machine',M.hover.how);
    else s+='<tr><td colspan="2"><div class="note">hover a point for its row.</div></td></tr>';
    s+=hd('the ten largest');
    TOP10.forEach((r,i)=>{ s+=rrow((i+1)+'. '+r[0],fmtInt(r[1])); });
  }
  else if(M.view==='cover'){
    const C=M.cov;
    s+=hd('k = '+C.k)+rrow('form',C.sign>0?'k·2^n + 1':'k·2^n − 1')
      +rrow('covering set',C.cover.join(', '))+rrow('period',C.period)
      +rrow('n = 1 … '+C.rows.length+' covered',C.rows.every(r=>r.hits.length>0)?'all':'NO',C.rows.every(r=>r.hits.length>0)?'good':'bad');
    s+=hd('the conjecture')+rrow('smallest such k?',C.k)
      +rrow('k still unresolved',Array.isArray(M.remaining)?M.remaining.join(', '):M.remaining);
  }
  s+='</table><div class="note">Sources: t5k.org (record entry 141212, prover code, largest.html, by_year, '
    +'Mersenne table, top-20 pages), primegrid.com, Wikipedia (A005849, A080076, LLR, covering sets). '
    +'Every digit count and every small verdict is recomputed in this file.</div>';
  return s;
}

function eqbarHTML(M){
  const st=ST;
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='forms') return E('2<sup>p</sup>&minus;1, &nbsp; 2<sup>2<sup>n</sup></sup>+1, &nbsp; b<sup>2<sup>n</sup></sup>+1, &nbsp; k&middot;2<sup>n</sup>&plusmn;1, &nbsp; n&middot;2<sup>n</sup>&plusmn;1',
    'the special forms: N&plusmn;1 factors completely, so an exact test exists — that is why every record prime has one of these shapes');
  if(M.view==='nplus') return E('s<sub>0</sub> = 4 &nbsp;(or u<sub>0</sub> = V<sub>k</sub>(P,1)), &nbsp; s<sub>i+1</sub> = s<sub>i</sub><sup>2</sup> &minus; 2 &nbsp;(mod N), &nbsp; N prime &hArr; s<sub>n&minus;2</sub> &equiv; 0',
    'Lucas 1876, Lehmer 1930, Riesel 1969: one squaring per bit of the exponent, and the last residue decides');
  if(M.view==='nminus') return E('a<sup>(N&minus;1)/2</sup> &equiv; &minus;1 (mod N), (a | N) = &minus;1 &nbsp;&rArr;&nbsp; N prime &nbsp; [Proth 1878, P&eacute;pin 1877]; &nbsp; N&minus;1 = &Pi;q<sup>e</sup>: gcd(a<sup>(N&minus;1)/q</sup>&minus;1, N) = 1 &forall;q &rArr; prime',
    'the n&minus;1 family: a square root of &minus;1 pins the order of a, and a known factorisation of N&minus;1 forces every prime factor of N above &radic;N');
  if(M.view==='record') return E('5336284<sup>1048576</sup> + 1: &nbsp; N&minus;1 = 2<sup>2097152</sup> &middot; 1334071<sup>1048576</sup>',
    'fully factored, so the N&minus;1 test needs only two witnesses — PFGW 4.0.4, 20.41 days, "is prime!" (t5k entry 141212)');
  if(M.view==='history') return E('digits(2<sup>p</sup>&minus;1) = &lfloor;p log<sub>10</sub>2&rfloor; + 1, &nbsp; digits(b<sup>2<sup>n</sup></sup>+1) = &lfloor;2<sup>n</sup> log<sub>10</sub>b&rfloor; + 1',
    'four centuries of records: every size on this chart was recomputed from its exponent and matches the source to the digit');
  return E('k&middot;2<sup>n</sup> &plusmn; 1 &equiv; 0 (mod q) for some q in a finite set, for EVERY n',
    'a covering set: 78557 and 509203 never give a prime, and the conjectures say they are the smallest such k');
}
function tagHTML(M){
  const st=ST;
  if(M.view==='forms') return '<b>the forms</b> — '+formName(st.form)+', '+M.count+' prime of '+M.total;
  if(M.view==='nplus') return '<b>the n+1 tests</b> — '+M.label;
  if(M.view==='nminus') return '<b>the n−1 tests</b> — '+M.label;
  if(M.view==='record') return '<b>the record</b> — 5336284<sup>1048576</sup> + 1, 7 054 022 digits';
  if(M.view==='history') return '<b>the records</b> — 1588 to 2024';
  return '<b>the covering sets</b> — k = '+M.cov.k;
}
/* ================================================================== *
 *  drawing helpers, geometry, the six views, dispatch, scene           *
 * ================================================================== */
function capHFor(W){ return W>=900?60:96; }
function drawCap(ctx,W,H,full,short){
  const narrow=W<900;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,H-capHFor(W),W,capHFor(W));
  caption(ctx,28,H-capHFor(W)+8,narrow?short:full,narrow?W-56:W-RO_W-60);
}
function txt(ctx,t,x,y,col,font,align,base){
  ctx.fillStyle=col||COL.dim; ctx.font=font||'11px -apple-system, sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline=base||'alphabetic';
  ctx.fillText(plain(t),x,y);
}
function ptitle(ctx,b,t){ txt(ctx,t,b.x,b.y-9,'#aeb6c6','italic 13px Georgia, serif','left','bottom'); }
function stageBox(W,H,extraTop){
  return box(24,stageTop()+(extraTop||24),(W>=900?W-RO_W-8:W-24)-24,H-capHFor(W)-16-stageTop()-(extraTop||24));
}
/* a one- or two-line header above the stage box, wrapped to the stage width */
function header(ctx,W,t){ caption(ctx,24,stageTop()+8,t,W>=900?W-RO_W-60:W-56,COL.dim); }
function cellText(c){ const [r,g2,b]=toRgb(c); return 0.2126*r+0.7152*g2+0.0722*b>110?'#0d1120':'#9aa2b4'; }
/* fraction residue/N in [0,1] without floats on the BigInt */
function frac(r,N){ return Number(r*10000n/N)/10000; }

/* ---- strip geometry: `count` square cells wrapping in rows ---- */
function stripGeo(W,H,count){
  const b=stageBox(W,H,34);
  const cols=Math.max(1,Math.min(count,Math.max(8,Math.floor(b.w/34))));
  const rows=Math.ceil(count/cols);
  const cell=Math.max(4,Math.min(Math.floor(b.w/cols),Math.floor(b.h/rows)));
  return {b,cols,rows,cell,count,X(i){ return b.x+(i%cols)*cell; },Y(i){ return b.y+Math.floor(i/cols)*cell; }};
}
function pickStrip(g,x,y){
  const c=Math.floor((x-g.b.x)/g.cell), r=Math.floor((y-g.b.y)/g.cell);
  if(c<0||c>=g.cols||r<0||r>=g.rows) return -1;
  const i=r*g.cols+c; return i<g.count?i:-1;
}
/* ---- grid geometry: nrows x ncols cells with a label gutter ---- */
function gridGeo(W,H,nrows,ncols){
  const b=stageBox(W,H,34), lm=44, tm=22;
  const cell=Math.max(3,Math.min(Math.floor((b.w-lm)/ncols),Math.floor((b.h-tm)/nrows)));
  return {b,lm,tm,cell,nrows,ncols,X(c){ return b.x+lm+c*cell; },Y(r){ return b.y+tm+r*cell; }};
}
function pickGrid(g,x,y){
  const c=Math.floor((x-g.b.x-g.lm)/g.cell), r=Math.floor((y-g.b.y-g.tm)/g.cell);
  if(c<0||c>=g.ncols||r<0||r>=g.nrows) return null;
  return {r,c};
}

/* ================================================================== *
 *  view: the forms                                                    *
 * ================================================================== */
function formsGeo(W,H,M){
  if(M.strip) return {kind:'strip',g:stripGeo(W,H,M.strip.length)};
  return {kind:'grid',g:gridGeo(W,H,M.grid.length,M.grid[0].length)};
}
function drawForms(ctx,W,H,M){
  const st=ST, fg=formsGeo(W,H,M);
  if(fg.kind==='strip'){
    const g=fg.g, S=M.strip, fs=Math.min(12,g.cell*0.34);
    ctx.font=fs+'px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<S.length;i++){
      const c=S[i].prime?COL.pos:COL.off, x=g.X(i), y=g.Y(i), d=g.cell-Math.max(1,g.cell*0.1);
      ctx.fillStyle=c; ctx.fillRect(x,y,d,d);
      if(g.cell>=22){ ctx.fillStyle=cellText(c);
        ctx.fillText(String(S[i].p!==undefined?S[i].p:(st.form==='fermat'?'F'+S[i].n:S[i].n)),x+d/2,y+d/2); }
    }
    if(st.hi>=0&&st.hi<S.length){ const d=g.cell-Math.max(1,g.cell*0.1);
      ctx.strokeStyle=COL.live; ctx.lineWidth=2; ctx.strokeRect(g.X(st.hi)-1.5,g.Y(st.hi)-1.5,d+3,d+3); }
    header(ctx,W,st.form==='mersenne'?'p = 2 … '+LL_LIVE_MAX+', every prime exponent, each 2^p − 1 decided by Lucas–Lehmer live'
      :st.form==='fermat'?'F0 … F12, each decided by Pépin live; F5 … F8 carry their known factors in the readout'
      :st.form==='cullen'?'n = 1 … '+CULLEN_MAX+', each n·2^n + 1 decided by Proth live'
      :'n = 2 … '+WOODALL_MAX+', each n·2^n − 1 decided by Lucas–Lehmer–Riesel live');
  } else {
    const g=fg.g, G=M.grid;
    for(let r=0;r<G.length;r++) for(let c=0;c<G[r].length;c++){
      const cell=G[r][c];
      const col=cell.prime?(cell.theorem?COL.pos:shade(COL.pos,0.55)):(cell.theorem?COL.off:'#0c1019');
      const d=g.cell-Math.max(0.5,g.cell*0.12);
      ctx.fillStyle=col; ctx.fillRect(g.X(c),g.Y(r),d,d);
    }
    if(st.hk>=0&&st.hn>=0&&G[st.hk]&&G[st.hk][st.hn]){ const d=g.cell-Math.max(0.5,g.cell*0.12);
      ctx.strokeStyle=COL.live; ctx.lineWidth=2; ctx.strokeRect(g.X(st.hn)-1.5,g.Y(st.hk)-1.5,d+3,d+3); }
    /* labels: rows (k or n), columns (n or b) */
    ctx.font='9.5px -apple-system, sans-serif';
    const rowLab=r=>st.form==='gf'?'n='+G[r][0].n:'k='+G[r][0].k;
    const colLab=c=>st.form==='gf'?'b='+G[0][c].b:String(G[0][c].n);
    const rstep=g.cell>=11?1:(g.cell>=6?2:4);
    for(let r=0;r<G.length;r+=rstep) txt(ctx,rowLab(r),g.b.x+g.lm-5,g.Y(r)+g.cell/2,COL.dim,'9.5px -apple-system, sans-serif','right','middle');
    const cstep=st.form==='gf'?(g.cell>=26?1:2):5;
    for(let c=0;c<G[0].length;c+=cstep) txt(ctx,colLab(c),g.X(c)+g.cell/2,g.b.y+g.tm-4,COL.dim,'9.5px -apple-system, sans-serif','center','bottom');
    header(ctx,W,st.form==='gf'?'b even 2 … 40 across, n = 1 … 4 down: every b^(2^n)+1 proven or refuted by the N−1 test on factor(b)'
      :(st.form==='proth'?'k odd down, n across: Proth\'s theorem decides where k < 2^n; the faded corner (k ≥ 2^n) is Miller–Rabin'
      :'k odd down, n across: Lucas–Lehmer–Riesel decides where k < 2^n; the faded corner is Miller–Rabin'));
  }
  drawCap(ctx,W,H,
    formName(st.form)+': '+M.count+' prime among the '+M.total+' members shown — green cells are proven by the form\'s own '
    +(st.form==='mersenne'||st.form==='riesel'||st.form==='woodall'?'N+1 test (Lucas sequences)':'N−1 test (Proth / Pépin / Pocklington)')
    +'; the readout carries the record holder from t5k',
    formName(st.form)+': '+M.count+' prime of '+M.total);
}

/* ================================================================== *
 *  view: the n+1 tests — the residue sequence, one squaring per bit   *
 * ================================================================== */
function drawSeqPanel(ctx,b,seq,shown,N,done,verdict,title,finalLabel){
  const n=seq.length;
  /* one slot per step, bars centred in their slots and capped at 40 px, so a
     three-step chain cannot spill past the frame (first PNG pass) */
  const tstep=Math.max(1,Math.ceil(n/8)), xt=[];
  for(let i=0;i<n;i+=tstep) xt.push(i);
  axes(ctx,b,-0.5,n-0.5,0,1,{xlab:'step i',ylab:'residue / N',title,ny:4,xticks:xt,
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  const slot=b.w/Math.max(1,n), bw=Math.min(40,Math.max(1,slot*0.8));
  const XofI=i=>b.x+slot*(i+0.5);
  for(let i=0;i<n;i++){
    const X=XofI(i), f=frac(seq[i],N), hgt=b.h*f;
    const on=i<=shown;
    ctx.fillStyle=on?(i===n-1&&done?(verdict?COL.pos:COL.ref):COL.pos):'#1a2030';
    if(on) ctx.fillRect(X-bw/2,b.y1-hgt,bw,Math.max(1.5,hgt));

    caption(ctx,b0.x,y,'this is the record\'s proof in miniature: 5336284^1048576 + 1 has N − 1 = 2^2097152 · 1334071^1048576, two primes to witness',b0.w);

function pickHistory(G,pts,x,y){
  let best=-1,bd=1e9;
  pts.forEach((p,i)=>{
    const X=G.b.x+G.b.w*(p.year-G.x0)/(G.x1-G.x0), Y=G.b.y1-G.b.h*(Math.log10(p.digits)-G.y0)/(G.y1-G.y0);
    const d=Math.hypot(X-x,Y-y); if(d<bd){ bd=d; best=i; } });
  return bd<=9?best:-1;
}

 *  view: the covering sets                                            *
 * ================================================================== */
function drawCover(ctx,W,H,M){
  const C=M.cov, b0=stageBox(W,H,40);
  const nrows=C.period, ncols=C.cover.length;
  const lm=40, tm=22;
  /* the table must FIT the stage: no floor on the cell, and row labels thin
     out to stay 12 px apart (first sweep: rows ran into the caption band) */
  const cell=Math.max(3,Math.min(Math.floor((b0.w*0.55-lm)/ncols),(b0.h-tm)/nrows));
  const lstep=Math.max(1,Math.ceil(12/cell));
  const X=c=>b0.x+lm+c*cell, Y=r=>b0.y+tm+r*cell;
  if(cell>=14) for(let c=0;c<ncols;c++) txt(ctx,String(C.cover[c]),X(c)+cell/2,b0.y+tm-4,COL.dim,'10px -apple-system, sans-serif','center','bottom');
  else txt(ctx,'q = '+C.cover.join(', '),b0.x+lm,b0.y+tm-4,COL.dim,'10px -apple-system, sans-serif','left','bottom');
  for(let r=0;r<nrows;r++){
    const row=C.rows[r];
    if(r%lstep===0) txt(ctx,'n='+row.n,b0.x+lm-5,Y(r)+cell/2,COL.dim,'9.5px -apple-system, sans-serif','right','middle');
    for(let c=0;c<ncols;c++){
      const q=C.cover[c], hit=row.hits.indexOf(q)>=0;
      ctx.fillStyle=hit?(row.first===q?COL.pos:shade(COL.pos,0.5)):COL.off;
      ctx.fillRect(X(c),Y(r),cell-1,cell-1);
    }
  }
  const rx=X(ncols)+30;
  let y=b0.y+tm;
  txt(ctx,'k = '+C.k+', '+(C.sign>0?'k·2^n + 1':'k·2^n − 1'),rx,y,'#fff','italic 16px Georgia, serif','left','top'); y+=28;
  caption(ctx,rx,y,'every row has a green cell: for each n some prime of the set {'+C.cover.join(', ')+'} divides the number, so no member is ever prime. The divisor pattern repeats with period '+C.period+' because the orders of 2 modulo the set primes all divide '+C.period+'.',Math.max(200,b0.x1-rx-10)); y+=90;
  caption(ctx,rx,y,(M.cover==='sierp'?'Selfridge (1962) proved 78557 is Sierpiński; the conjecture that it is the SMALLEST is what Seventeen or Bust / PrimeGrid attack by finding a Proth prime for each smaller k — five k remain: '+SIERP.remaining.join(', ')+'.'
     :'Riesel (1956) showed 509203 never gives a prime; the Riesel conjecture says it is the smallest such k — PrimeGrid hunts an LLR prime for each smaller k, and 41 remain.'),Math.max(200,b0.x1-rx-10));
  drawCap(ctx,W,H,
    'a covering set is a finite proof about infinitely many numbers: 2^n mod q cycles, so the residues of k·2^n ± 1 modulo each q cycle too, and the set is chosen so every n lands on a zero somewhere — the sim checks all '+C.rows.length+' rows exactly',
    'k = '+C.k+': every n covered by {'+C.cover.join(', ')+'}, period '+C.period);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='forms') drawForms(ctx,W,H,M);
  else if(M.view==='nplus') drawNplus(ctx,W,H,M);
  else if(M.view==='nminus') drawNminus(ctx,W,H,M);
  else if(M.view==='record') drawRecord(ctx,W,H,M);
  else if(M.view==='history') drawHistory(ctx,W,H,M);
  else drawCover(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* the animation: the test sequences advance one step per frame while `anim`
     is on and the end has not been reached; then the loop idles */
  S.step=function(){
    const st=ST;
    if(!st.anim||(st.view!=='nplus'&&st.view!=='nminus')) return false;
    const M=buildModel();
    if(st.step>=M.maxStep) return false;
    st.step=Math.min(M.maxStep,st.step+Math.max(0.25,st.speed*Math.max(1,M.maxStep)/180));
    return true;
  };
  S.hover=function(x,y){
    const st=ST, M=buildModel();
    let hk=-1,hn=-1,hi=-1;
    if(st.view==='forms'){
      const fg=formsGeo(S.W,S.H,M);
      if(fg.kind==='strip') hi=pickStrip(fg.g,x,y);
      else { const pk=pickGrid(fg.g,x,y); if(pk){ hk=pk.r; hn=pk.c; } }
    } else if(st.view==='history'){
      hi=pickHistory(historyGeo(S.W,S.H),M.pts,x,y);
    } else return false;
    if(hk===st.hk&&hn===st.hn&&hi===st.hi) return false;
    st.hk=hk; st.hn=hn; st.hi=hi; return true;
  };
  return S;
}
/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const clearHover=()=>{ st.hk=-1; st.hn=-1; st.hi=-1; };
  const retarget=()=>{ clearHover(); st.step=st.anim?0:1e9; };
  function setView(k){
    if(st.view!==k){ st.view=k; clearHover(); st.step=st.anim?0:1e9; }
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }

  const gForm=h('div',{class:'grp'},h('h3',null,'the form'));
  const formChips=chipRow(FORMS,'form',clearHover); gForm.appendChild(formChips); trackChips(gForm,FORMS,'form');
  const formTag=h('div',{class:'tag'}); gForm.appendChild(formTag);

  const gTarget=h('div',{class:'grp'},h('h3',null,'the target'));
  const nplusChips=chipRow(NPLUS,'nplus',retarget); gTarget.appendChild(nplusChips); trackChips(gTarget,NPLUS,'nplus');
  const nminusChips=chipRow(NMINUS,'nminus',retarget); gTarget.appendChild(nminusChips); trackChips(gTarget,NMINUS,'nminus');
  gTarget.appendChild(slider('pIdx','exponent p',0,LL_P.length-1,1,v=>'p = '+LL_P[clamp(v,0,LL_P.length-1)],retarget));
  gTarget.appendChild(slider('k','k (odd)',1,GRID_K,2,v=>fmt(v,0),retarget));
  gTarget.appendChild(slider('n','n',2,GRID_N,1,v=>fmt(v,0),retarget));
  gTarget.appendChild(slider('wn','Woodall n',2,WOODALL_MAX,1,v=>fmt(v,0),retarget));
  gTarget.appendChild(slider('cn','Cullen n',1,CULLEN_MAX,1,v=>fmt(v,0),retarget));
  gTarget.appendChild(slider('fn','Fermat index n',1,12,1,v=>'F'+fmt(v,0),retarget));
  gTarget.appendChild(slider('gb','base b (even)',2,GF_BMAX,2,v=>fmt(v,0),retarget));
  gTarget.appendChild(slider('gn','n  (N = b^(2^n)+1)',1,GF_NMAX,1,v=>fmt(v,0),retarget));
  const targetTag=h('div',{class:'tag'}); gTarget.appendChild(targetTag);

  const gRun=h('div',{class:'grp'},h('h3',null,'the run'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('anim','run the test step by step',()=>{ if(st.anim) st.step=0; })));
  gRun.appendChild(slider('speed','speed',0.25,4,0.25,v=>fmt(v,2)+'×'));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ st.step=0; st.anim=true; syncPanel(); dirty=true; refresh(); }},'restart'),
    h('button',{onclick:()=>{ st.step=1e9; dirty=true; refresh(); }},'finish'),
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v;
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gCover=h('div',{class:'grp'},h('h3',null,'the covering set'));
  const coverChips=chipRow(COVERS,'cover',null); gCover.appendChild(coverChips); trackChips(gCover,COVERS,'cover');
  const coverTag=h('div',{class:'tag'}); gCover.appendChild(coverTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Sources: t5k.org (entry 141212, prover code L5543, largest.html, notes/by_year, '
      +'the Mersenne table, top-20 pages 6/7/12, prove3_1), primegrid.com (mega_primes), Wikipedia '
      +'(Cullen, Proth, Fermat, LLR, Riesel, Sierpi&#324;ski, GIMPS, IBDWT). All fetched 2026-09-01 '
      +'and emitted by build_primes/derive.py; every digit count and small verdict is recomputed in '
      +'this file. PrimeGrid&rsquo;s announcement PDF was not obtainable (404).'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the number theory'),h('div',{id:'phys'}));
  [gForm,gTarget,gRun,gCover,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view;
    gForm.hidden=(v!=='forms');
    gTarget.hidden=!(v==='nplus'||v==='nminus');
    gRun.hidden=!(v==='nplus'||v==='nminus');
    gCover.hidden=(v!=='cover');
    nplusChips.hidden=(v!=='nplus'); nminusChips.hidden=(v!=='nminus');
    rows.pIdx.row.hidden=!(v==='nplus'&&st.nplus==='mersenne');
    rows.k.row.hidden=!((v==='nplus'&&st.nplus==='riesel')||(v==='nminus'&&st.nminus==='proth'));
    rows.n.row.hidden=rows.k.row.hidden;
    rows.wn.row.hidden=!(v==='nplus'&&st.nplus==='woodall');
    rows.cn.row.hidden=!(v==='nminus'&&st.nminus==='cullen');
    rows.fn.row.hidden=!(v==='nminus'&&st.nminus==='fermat');
    rows.gb.row.hidden=!(v==='nminus'&&st.nminus==='gf');
    rows.gn.row.hidden=rows.gb.row.hidden;
    rows.speed.row.hidden=!st.anim;
    for(const k in rows) rows[k].sync();
    formTag.innerHTML='green = proven prime by the form\'s own test; hover a cell';
    targetTag.innerHTML=v==='nplus'?'N + 1 factors completely — a Lucas sequence decides'
                                   :'N − 1 factors completely — a witness a decides';
    runTag.innerHTML='space runs/pauses &nbsp; <b>r</b> restarts &nbsp; 1–6 switch views';
    coverTag.innerHTML='the two smallest known covering-set k; smaller k are conjectured to give primes';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='forms'||st.view==='history')
        ?'hover for the member / the row · 1–6 switch views'
        :((st.view==='nplus'||st.view==='nminus')?'space runs the test · r restarts · 1–6 switch views':'1–6 switch views');
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; if(st.anim&&st.step>=1e8) st.step=0;
      syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ st.step=0; st.anim=true; syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });
  canvas.addEventListener('pointermove',e=>{
    const r=canvas.getBoundingClientRect();
    if(S.hover(e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%6===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:y-fh*0.8);
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

function selfTest(){

  withState({view:'nminus',nminus:'proth',k:63,n:5},()=>{ const M=buildModel(); eq(M.applies,false,'k = 63 >= 2^5: Proth does not apply'); ok(readoutHTML(M).indexOf('NO')>=0,'readout says so'); });
  withState({view:'nminus',nminus:'fermat',fn:4},()=>{ const M=buildModel(); eq(M.chain.length,16,'F4: 16-bit exponent'); eq(M.chain[15].r,65536n,'ends at F4 - 1'); eq(M.verdict,true,'F4 prime'); });
  withState({view:'nminus',nminus:'fermat',fn:5},()=>{ const M=buildModel(); eq(M.verdict,false,'F5 composite'); ok(M.factors&&M.factors[0]==='641','641 listed'); });
  withState({view:'nminus',nminus:'fermat',fn:12},()=>{ const M=buildModel(); eq(M.chain.length,0,'F12: no drawable chain'); eq(M.verdict,false,'F12 composite'); });
  withState({view:'nminus',nminus:'gf',gb:6,gn:2},()=>{ const M=buildModel(); eq(M.verdict,true,'6^4+1 prime'); eq(M.qs.join(','),'2,3','primes of 6'); ok(readoutHTML(M).indexOf('a = 5')>=0,'readout shows a witness'); });
  withState({view:'nminus',nminus:'gf',gb:10,gn:2},()=>{ eq(buildModel().verdict,false,'10^4+1 composite'); });
  withState({view:'nminus',nminus:'cullen',cn:141},()=>{ const M=buildModel(); eq(M.verdict,true,'C141 prime'); eq(M.a,5n,'witness 5'); });
  withState({view:'record'},()=>{ const M=buildModel(); const s=readoutHTML(M); ok(s.indexOf('7 054 022')>=0,'readout prints the digits'); ok(s.indexOf('20.41 days')>=0,'and the elapsed time'); ok(s.indexOf('Trotador')>=0,'and the discoverer'); eq(M.pipe.proven,204,'pipeline in the model'); });
  withState({view:'history'},()=>{ const M=buildModel(); eq(M.pts.length,44,'44 record rows'); eq(M.pts[M.pts.length-1].digits,41024320,'ends at 41 024 320');
    /* probe the LAST point: 1952 holds five near-coincident rows, so a pick
       there legitimately returns a neighbour (first run) */
    const G=historyGeo(1400,820); const li=M.pts.length-1, p=M.pts[li]; const X=G.b.x+G.b.w*(p.year-G.x0)/(G.x1-G.x0), Y=G.b.y1-G.b.h*(Math.log10(p.digits)-G.y0)/(G.y1-G.y0);
    eq(pickHistory(G,M.pts,X+2,Y-2),li,'history pick returns the point under the pointer'); eq(pickHistory(G,M.pts,G.b.x-100,G.b.y-100),-1,'and nothing far away'); });
  withState({view:'cover',cover:'riesel'},()=>{ const M=buildModel(); eq(M.cov.k,509203,'Riesel k'); eq(M.remaining,41,'41 remaining'); });
  for(const [v] of TABS) withState({view:v},()=>{ const M=buildModel(); const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
    ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0,'panels clean for '+v); });

  /* ---------- J. the scene: animation and hover ---------- */
  { const shot=makeShot(1100,712); const S=makeScene({getContext:()=>shot});
    Object.assign(ST,DEFAULTS); ST.view='nplus'; ST.anim=true; ST.step=0;
    let n=0; while(S.step()&&n<5000) n++;
    eq(ST.step,11,'the run reaches the last step'); ok(n>3&&n<5000,'over several frames ('+n+')'); ok(!S.step(),'then idles');
    /* a LONG run at a speed whose per-frame rate does not divide the step
       count: the clamp must land exactly on the end (first sweep: M13's 11
       steps are a multiple of the 0.25 floor, so an overshooting mutant and a
       rate-collapsed mutant both looked fine) */
    ST.pIdx=29; ST.speed=1.3; ST.step=0; n=0;
    while(S.step()&&n<5000) n++;
    eq(ST.step,125,'M127: the clamp lands exactly on step 125');
    ok(n>=130&&n<=145,'in about 180/1.3 = 139 frames ('+n+')');
    ST.view='forms'; ST.form='proth'; ST.anim=false;
    const fg=formsGeo(S.W,S.H,buildModel()); ok(S.hover(fg.g.X(3)+2,fg.g.Y(2)+2),'hover on the grid registers');
    eq(ST.hk+','+ST.hn,'2,3','and picks row 2, column 3');
    ST.view='cover'; ok(!S.hover(300,300),'the covering view ignores the pointer');
    Object.assign(ST,stSave); }

  /* ---------- K. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['forms mersenne',{view:'forms',form:'mersenne'},50],['forms fermat',{view:'forms',form:'fermat'},10],
    ['forms gf',{view:'forms',form:'gf'},60],['forms proth',{view:'forms',form:'proth',hk:2,hn:3},1000],
    ['forms riesel',{view:'forms',form:'riesel'},1000],['forms cullen',{view:'forms',form:'cullen',hi:140},150],
    ['forms woodall',{view:'forms',form:'woodall'},300],
    ['nplus M13 end',{view:'nplus',nplus:'mersenne',pIdx:4},8],['nplus M11 mid',{view:'nplus',nplus:'mersenne',pIdx:3,step:4},8],
    ['nplus M127',{view:'nplus',nplus:'mersenne',pIdx:29},8],['nplus riesel',{view:'nplus',nplus:'riesel',k:3,n:7},4],
    ['nplus riesel small',{view:'nplus',nplus:'riesel',k:5,n:5},1],['nplus woodall',{view:'nplus',nplus:'woodall',wn:30},8],
    ['nminus proth',{view:'nminus',nminus:'proth',k:3,n:2},3],['nminus proth big',{view:'nminus',nminus:'proth',k:63,n:40,step:10},20],
    ['nminus proth no',{view:'nminus',nminus:'proth',k:63,n:5},1],['nminus fermat 4',{view:'nminus',nminus:'fermat',fn:4},10],
    ['nminus fermat 9',{view:'nminus',nminus:'fermat',fn:9},100],['nminus fermat 12',{view:'nminus',nminus:'fermat',fn:12},1],
    ['nminus gf',{view:'nminus',nminus:'gf',gb:6,gn:2},1],['nminus gf comp',{view:'nminus',nminus:'gf',gb:10,gn:2},1],
    ['nminus cullen',{view:'nminus',nminus:'cullen',cn:141},20],
    ['record',{view:'record'},5],['history',{view:'history',hi:10},40],
    ['cover sierp',{view:'cover',cover:'sierp'},200],['cover riesel',{view:'cover',cover:'riesel'},100],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>3&&oy>3){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
