  gRun.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  gRun.appendChild(slider('speed','speed',0.25,4,0.25,v=>fmt(v,2)+'×'));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ simReset(st); dirty=true; refresh(); }},'restart'),
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset(st);
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'No measured data. Every length is a Gauss&ndash;Legendre quadrature pinned to scipy '
      +'(build_cycloid/derive.py), every area is Green&rsquo;s theorem, the caustic envelopes are intersections of '
      +'neighbouring reflected rays checked against the nephroid and cardioid closed forms, and the spirograph counts '
      +'are gcd arithmetic checked by counting.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the mathematics'),h('div',{id:'phys'}));
  [gWheel,gFam,gCau,gSpi,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view;
    gWheel.hidden=!(v==='wheel'||v==='area');
    gFam.hidden=(v!=='family');
    gCau.hidden=(v!=='caustic');
    gSpi.hidden=(v!=='spiro');
    gRun.hidden=!viewAnimates(v);
    const custom=st.named==='custom';
    rows.p.row.hidden=!custom; rows.q.row.hidden=!custom; sideChips.hidden=!custom;
    for(const k in rows) rows[k].sync();
    wheelTag.innerHTML=v==='area'?'Roberval&rsquo;s slices are drawn for d &le; r (the slider is clamped there)'
                                 :'d &lt; r curtate &middot; d = r the cycloid &middot; d &gt; r prolate, with loops';
    famTag.innerHTML=custom?'k = p/q in lowest terms: p cusps, closed after q orbits':'the named curves; choose p / q to set your own';
    cauTag.innerHTML=st.src==='point'?'drag the source inside the cup':'the envelope is computed from 240 rays; the slider only sets how many are drawn';
    spiTag.innerHTML='pen at 1.00 r is the cusped hypocycloid; beyond 1 the pen makes loops';
    runTag.innerHTML='space runs/pauses &nbsp; <b>r</b> restarts &nbsp; 1&ndash;6 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='caustic')?'drag the source when it is a point · 1–6 switch views'
        :'space pauses · r restarts · 1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ simReset(st); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%10===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(st); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  wheel:'Galileo named it (1599) and tried to weigh it; Mersenne asked everyone he knew about it; Pascal, in 1658, set a prize '

    +'— the mark a stone stuck in a tyre would make in the air. Move d off the rim and you get the trochoids: a point inside '
    +'the wheel (curtate) never stops, a point outside it (prolate, like the flange of a railway wheel) loops backwards. The one '
    +'fact that explains the shape is that the wheel is, at every instant, rotating about its contact point C: the velocity of '
    +'P is perpendicular to CP, so it vanishes at the cusp, and for the rim point the tangent passes through the top of the wheel.',
  family:'Roll the circle on a circle instead. Outside, the rim point traces an epicycloid; inside, a hypocycloid; the ratio '
    +'k = R/r decides everything. Integer k gives k cusps in one orbit — the cardioid (1), the nephroid (2), the deltoid (3, inside), '
    +'the astroid (4, inside). A fraction p/q gives p cusps spread over q orbits, and an irrational k would never close. Two '
    +'surprises: the k = 2 hypocycloid is a straight line, the Tusi couple that al-Tūsī used in 1247 to build linear motion out '
    +'of circular motion, and the hypocycloids with rolling radii r and R − r are the same curve (double generation) — the '
    +'astroid can be drawn with a wheel of radius R/4 or 3R/4. The coin paradox lives here too: a coin rolled round an equal '
    +'coin turns twice, (R + r)/r, not once.',
  evolute:'Every point of a curve has a circle that fits it best — the osculating circle — and its centre traces the evolute. '

    +'evolute is another cycloid, congruent to the first and shifted by (πr, −2r). That is why Huygens\' cycloidal pendulum works: '
    +'a string unwinding from a cycloid traces a cycloid. The same geometry gives the length. Wren showed in 1658 that the arc '

    +'has exactly the width of the chord of the generating circle at that height — d sin θ. By Cavalieri\'s principle the two '

 *  selfTest — headless verification.  Reference values labelled       *
 *  (derive) are lines of build_cycloid/refvals.txt, the printed       *
 *  output of derive.py (scipy quad / ellipe, a numerical envelope,    *

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){
    Object.assign(ST,DEFAULTS,over); simReset(ST);
    if(over.t!==undefined) SIM.t=over.t;
    try{ return fn(); } finally{ Object.assign(ST,stSave); simReset(ST); }
  }

  /* ---------- 0. the shared-helper fixes cannot rot ---------- */

    for(let m=1;m<=orb;m++) close(M.closes[m-1],closes[m-1],1e-10,tag+'distance from the start after orbit '+m+' (derive)');
    const P=spiroPt(N,n,pen,false,1); rel(P[0],px,1e-12,tag+'point at t=1 x (derive)'); rel(P[1],py,1e-12,tag+'y (derive)');
    rel(M.turns,turns,1e-12,tag+'wheel turns per orbit (derive)'); }
  { const M=withState({view:'spiro',spN:96,spn:40,pen:0.8,spOut:true},()=>spiroModel(ST));
    eq(M.orbits,5,'the epitrochoid 96/40 also closes after 5 orbits'); close(M.closes[4],0,1e-10,'(derive: 2.7e-15)'); ok(M.closes[0]>0.6,'and not after one'); rel(M.turns,136/40,1e-12,'outside: (N+n)/n turns per orbit'); }

  /* ---------- E. the models, the readouts, the scene ---------- */
  { const W=withState({view:'wheel',dr:0.5},()=>wheelModel(ST)); eq(W.kind,'curtate','d < r is curtate'); const W1=withState({view:'wheel',dr:1},()=>wheelModel(ST)); eq(W1.kind,'cycloid','d = r is the cycloid'); const W2=withState({view:'wheel',dr:1.5},()=>wheelModel(ST)); eq(W2.kind,'prolate','d > r is prolate');
    rel(W.Lq,W.Lc,1e-12,'the wheel model\'s two lengths agree'); rel(W.Aq,W.Ac,1e-12,'and its two areas'); }
  { const E=withState({view:'evolute'},()=>evoluteModel(ST,0.7)); rel(E.rho,1.371591229822,1e-12,'evolute model rho (derive)'); rel(E.rhoNumeric,E.rho,1e-6,'and the numeric route'); rel(E.sQuad,E.sCusp,1e-12,'arc: quadrature = closed'); rel(E.sVert/E.chord,2,1e-12,'arc/chord = 2 in the model'); }
  { const A=withState({view:'area',dr:1.5},()=>areaModel(ST,1.0)); rel(A.d,1,1e-15,'the area view clamps d to r'); rel(A.total,3*PI,1e-15,'3 pi r^2'); rel(A.quad,A.total,1e-12,'quadrature agrees'); rel(A.gap,0.8414709848079,1e-12,'gap at theta = 1 (derive)');
    const A6=withState({view:'area',dr:0.6},()=>areaModel(ST,2.0)); rel(A6.total,2*PI+PI*0.36,1e-15,'2 pi r^2 + pi d^2 at d = 0.6'); rel(A6.cres,PI*0.36,1e-15,'the crescents are one disc');
    rel(A6.swept,trochoidAreaTo(1,0.6,2.0),1e-15,'swept area to theta'); rel(trochoidAreaTo(1,0.6,TAU),A6.total,1e-12,'and to 2 pi it is the whole'); }
  for(const [v] of TABS){
    const M=withState({view:v,t:0.7},()=>buildModel());
    const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
    ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0&&html.indexOf('Infinity')<0,'panels clean for '+v);
  }
  { const M=withState({view:'wheel',dr:1},()=>buildModel()); ok(readoutHTML(M).indexOf('9.424778')>=0,'the wheel readout prints 3 pi r^2 = 9.424778 off the model'); ok(readoutHTML(M).indexOf('8.000000')>=0,'and 8r'); }
  { const M=withState({view:'spiro'},()=>buildModel()); ok(readoutHTML(M).indexOf('12')>=0&&readoutHTML(M).indexOf('5 orbits')>=0,'the spirograph readout prints 12 lobes and 5 orbits'); }
  { const shot=makeShot(1100,712); const S=makeScene({getContext:()=>shot});
    Object.assign(ST,DEFAULTS); simReset(ST);
    ok(S.step(),'a frame advances on the wheel'); close(SIM.t,FRAME_DT,1e-15,'by 1/60 s');
    ST.running=false; ok(!S.step(),'paused: no frame'); ST.running=true;
    ST.view='caustic'; simReset(ST); ok(!S.step(),'the caustic view has no clock');
    ST.view='wheel'; simReset(ST); SIM.t=2*TAU/WHEEL_OMEGA+0.1; S.step(); ok(SIM.t<0.1,'the wheel loops after two turns');
    ST.view='spiro'; simReset(ST); SIM.t=5; S.step(); ok(SIM.t>5,'the spirograph does not loop');
    /* the pointer: only the caustic's point source listens */
    ST.view='caustic'; ST.src='point'; ST.sx=-0.5; ST.sy=0; simReset(ST);
    const G=cauGeo(shot,S.W,S.H,buildModel()), map=G.map;
    ok(S.pointer('down',map.X(-0.5)+3,map.Y(0)-2),'pointer-down on the source grabs it'); eq(DRAG.what,'S','it is S');
    S.pointer('move',map.X(0.3),map.Y(0.4)); close(ST.sx,0.3,1e-9,'the source follows the pointer (x)'); close(ST.sy,0.4,1e-9,'(y)');
    S.pointer('move',map.X(1.5),map.Y(0)); ok(Math.hypot(ST.sx,ST.sy)<=0.92+1e-12,'and is held inside the cup');
    ok(S.pointer('up',0,0),'pointer-up releases'); eq(DRAG.what,null,'nothing dragged');
    ok(!S.pointer('down',map.X(0.9),map.Y(0.9)),'a pointer-down away from the source grabs nothing');
    ST.src='parallel'; ok(!S.pointer('down',map.X(ST.sx),map.Y(ST.sy)),'with parallel light nothing listens');
    ST.view='wheel'; ok(!S.pointer('down',300,300),'the wheel view ignores the pointer');
    Object.assign(ST,stSave); simReset(ST); }

  /* ---------- F. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['wheel cycloid',{view:'wheel',dr:1,t:1.3},4],['wheel curtate',{view:'wheel',dr:0.5,t:2.7},4],['wheel prolate',{view:'wheel',dr:1.6,t:0.4},4],['wheel start',{view:'wheel',dr:1,t:0},4],
    ['family deltoid',{view:'family',named:'deltoid',t:2},4],['family cardioid',{view:'family',named:'cardioid',t:6},4],['family nephroid',{view:'family',named:'nephroid',t:1},4],
    ['family astroid',{view:'family',named:'astroid',t:9},4],['family tusi',{view:'family',named:'tusi',t:3},3],
    ['family 5/2 epi',{view:'family',named:'custom',p:5,q:2,outside:true,t:4},4],['family 8/3 hypo',{view:'family',named:'custom',p:8,q:3,outside:false,t:12},4],
    ['evolute',{view:'evolute',t:1.1},6],['evolute late',{view:'evolute',t:5.0},6],['evolute start',{view:'evolute',t:0.05},6],
    ['area cycloid',{view:'area',dr:1,t:1.4},4],['area curtate',{view:'area',dr:0.6,t:3.1},4],
    ['caustic parallel',{view:'caustic',src:'parallel'},3],['caustic rim',{view:'caustic',src:'rim'},3],['caustic point',{view:'caustic',src:'point',sx:-0.5,sy:0.2},3],
    ['spiro 96/40',{view:'spiro',t:6},3],['spiro 84/60',{view:'spiro',spN:84,spn:60,pen:0.7,t:20},3],['spiro outside',{view:'spiro',spOut:true,t:3},3],['spiro loops',{view:'spiro',pen:1.25,t:8},3],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>3&&oy>3){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
