      /* Screen area, for the stroke test below.  A polar mesh's cells become
         sub-pixel slivers near the centre, where all NTHD of them meet at one
         point: stroking a sliver narrower than the stroke WIDENS it, and the
         painter sort flip-flops between neighbours that are at the same depth.
         Together those drew a starburst of radial spokes across the middle of
         the membrane that is not in the physics. */
      /* Abutting quads leave a sub-pixel seam that antialiases into a visible
         stripe — here, one radial spoke per angular cell, 64 of them.  The
         shading was measured smooth around every ring before this was traced
         to the seams rather than to the normals.  Each quad is expanded about
         its own centroid so neighbours overlap slightly.  That is only safe
         because these are drawn OPAQUE: under globalAlpha < 1 the overlap
         composites twice and becomes a BRIGHTER stripe in the same place,
         which is the corduroy on the Known-bad list. */
      const gx=0.25*(a0.x+a1.x+a2.x+a3.x), gy=0.25*(a0.y+a1.y+a2.y+a3.y);
      const EX=1.035;
      const grow=p=>({x:gx+(p.x-gx)*EX,y:gy+(p.y-gy)*EX});
      quads.push({z:0.25*(a0.z+a1.z+a2.z+a3.z),
                  p:[grow(a0),grow(a1),grow(a2),grow(a3)],
                  c:surfCol(um,peak,sh)});
    }
  }
  quads.sort((p,q)=>q.z-p.z);
  for(const q of quads){
    ctx.beginPath();
    ctx.moveTo(q.p[0].x,q.p[0].y);
    for(let k=1;k<4;k++) ctx.lineTo(q.p[k].x,q.p[k].y);
    ctx.closePath();
    ctx.fillStyle=q.c;
    if(st.wire){ ctx.strokeStyle=q.c; ctx.lineWidth=0.6; ctx.stroke(); }
    else ctx.fill();
  }
  /* the rim, and where it would be */
  /* `cx` matters: the rim is centred on the DRUM, but with the rim taken away
     the wave is centred on the STRIKE POINT, and drawing r = ct about the
     origin put the marker circle nowhere near the crest it is marking. */
  const ring=(rad,zz,col,dash,lw,cx)=>{
    cx=cx||0;
    ctx.beginPath();
    let started=false;
    for(let j=0;j<=NTHD;j++){
      const th=TAU*j/NTHD;
      const p=project(cam,B,[cx+rad*Math.cos(th),rad*Math.sin(th),zz]);
      if(!p){ started=false; continue; }
      if(!started){ ctx.moveTo(p.x,p.y); started=true; } else ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle=col; ctx.lineWidth=lw||2;
    if(dash) ctx.setLineDash(dash);
    ctx.stroke(); ctx.setLineDash([]);
  };
  if(st.showRim){
    if(M.open) ring(1,0,rgba(COL.rim,0.55),[5,5],1.6);
    else ring(1,0,COL.rim,null,2.2);
    if(M.open&&st.showCone){
      const rc=M.c*t/M.a;
      if(rc>0.02&&rc<R*1.6) ring(rc,0,rgba(COL.dn,0.8),[3,4],1.4,M.r0f);
    }
  }
  if(st.showGrid){
    for(let g=1;g<=3;g++) ring(R*g/3,0,rgba(COL.faint,0.5),[2,6],1);
  }
  if(st.showMarker){
    const x0=M.r0f;
    const p0=project(cam,B,[x0,0,0]), p1=project(cam,B,[x0,0,0.30]);
    if(p0&&p1){
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y);
      ctx.strokeStyle=rgba(COL.mark,0.85); ctx.lineWidth=1.4;
      ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(p1.x,p1.y,3.2,0,TAU);
      ctx.fillStyle=COL.mark; ctx.fill();
    }
  }
  return {peak:peak,exag:exag,R:R};
}

/* ------------------------------------------------------------------ *
 *  VIEW 1 — "the strike"                                              *
 * ------------------------------------------------------------------ */
function drawStrike(ctx,W,H,M,S){
  const st=M.st, t=st.t;
  const info=drawMembrane(ctx,W,H,M,S,t);

  /* The two insets sit SIDE BY SIDE along the bottom.  Stacked, the upper
     one's x tick labels landed on the lower one's title, and at x = 16 the
     y tick labels ran off the left edge of the canvas entirely (the audit
     reported ten of them at x = -17). */
  const bandY=H-168, bandH=112;
  const bw=Math.min(280,(W-140)*0.24);
  const b=box(58,bandY,bw,bandH);
  ctx.fillStyle='rgba(7, 11, 24,.78)'; ctx.fillRect(b.x-48,b.y-24,b.w+64,b.h+52);
  const xs=[], ys=[];
  const hf=heightField(M,t);
  for(let i=0;i<=NRD;i++){ xs.push(hf.R*i/NRD); ys.push(hf.H[i*NTHD]*1000); }
  let ym=1e-9;
  for(const v of ys) ym=Math.max(ym,Math.abs(v));
  axes(ctx,b,0,hf.R,-ym*1.15,ym*1.15,{xlab:'r / a',ylab:'mm',
    title:'the profile through the strike',
    yfmt:v=>fmt(v,2),xfmt:v=>fmt(v,1)});
  cpoly(ctx,b,[0,hf.R],[0,0],0,hf.R,-ym*1.15,ym*1.15,rgba(COL.faint,0.9),1);
  cpoly(ctx,b,xs,ys,0,hf.R,-ym*1.15,ym*1.15,COL.up,1.8);
  if(!M.open){
    cpoly(ctx,b,[1,1],[-ym*1.15,ym*1.15],0,hf.R,-ym*1.15,ym*1.15,COL.rim,1.4,[3,3]);
  }else{
    /* along theta = 0 the front is at r0 + ct, not ct: the free-field wave is
       centred on the strike point, and the profile is cut through the drum's
       own centre */
    const rc=M.r0f+M.c*t/M.a;
    if(rc<hf.R) cpoly(ctx,b,[rc,rc],[-ym*1.15,ym*1.15],0,hf.R,-ym*1.15,ym*1.15,
                         rgba(COL.dn,0.8),1.3,[3,3]);
    cpoly(ctx,b,[1,1],[-ym*1.15,ym*1.15],0,hf.R,-ym*1.15,ym*1.15,
             rgba(COL.rim,0.45),1.2,[2,4]);
  }

  /* the history strip — this is what "resonate" looks like */
  const hbx=b.x1+82;
  const hb=box(hbx,bandY,Math.min(420,Math.max(220,W-hbx-470)),bandH);
  ctx.fillStyle='rgba(7, 11, 24,.78)'; ctx.fillRect(hb.x-48,hb.y-24,hb.w+64,hb.h+52);
  const hist=historyOf(M);
  let hm=1e-12;
  for(const v of hist.u) hm=Math.max(hm,Math.abs(v));
  axes(ctx,hb,0,hist.tmax*1000,-hm*1000*1.1,hm*1000*1.1,
       {xlab:'t  (ms)',ylab:'mm',title:'the strike point, against time',
        yfmt:v=>fmt(v,2),xfmt:v=>fmt(v,0)});
  cpoly(ctx,hb,[0,hist.tmax*1000],[0,0],0,hist.tmax*1000,-hm*1000*1.1,hm*1000*1.1,
           rgba(COL.faint,0.9),1);
  cpoly(ctx,hb,hist.t.map(v=>v*1000),hist.u.map(v=>v*1000),
           0,hist.tmax*1000,-hm*1000*1.1,hm*1000*1.1,M.open?COL.dn:COL.up,1.5);
  if(t<=hist.tmax)
    cpoly(ctx,hb,[t*1000,t*1000],[-hm*1000*1.1,hm*1000*1.1],
             0,hist.tmax*1000,-hm*1000*1.1,hm*1000*1.1,COL.mark,1.6);

  /* captions — the exaggeration is never hidden */
  let y=bandY-6;
  const capX=hb.x1+42;
  const capW=Math.max(140,W-capX-26);
  const capL=(s2,c)=>{ y+=caption(ctx,capX,y,s2,capW,c||COL.dim)+5; };
  ctx.textAlign='left';
  capL('vertical exaggeration &times;'+fmt(info.exag,0)+' &mdash; the head moves '
      +fmtLen(info.peak)+' on a radius of '+fmtLen(M.a),COL.ink);
  capL(st.realtime
    ? 'the clock runs in real time: the head goes still in its own T&#8326;&#8320;, and each '
      +'frame is a snapshot of whatever phase it lands on'
    : 'the clock runs at 1/400 of real time'
      +(Math.abs(st.speed-1)>1e-9?' (&times;'+fmt(st.speed,2)+')':'')
      +' &mdash; a real head does this four hundred times faster');
  capL(M.open
    ? 'nothing reflects: the dashed circle is where the rim would be, and the wave '
      +'goes straight through it'
    : 'the wave reflects at the rim and interferes with itself &mdash; that is all '
      +'a resonance is');
  if(M.open&&st.showCone)
    capL('the moving dashed circle is r = ct, the wavefront',rgba(COL.dn,0.9));
  return info;
}
/* the time history at the strike point, computed once per model rather than
   once per frame: 240 samples x the mode set is a real cost at 60 Hz. */
let HIST_CACHE={key:null,val:null};
function historyOf(M){
  const key=[M.st.bc,M.B,M.M,M.N,M.r0f,M.sf,M.st.strike,M.tau,M.damp,M.t60,M.lossP,
             M.st.radLoss,M.c,M.a,M.st.ffRadius,M.amp].join('|');
  if(HIST_CACHE.key===key) return HIST_CACHE.val;
  const NT=240;
  const per=1/Math.max(M.f1,1e-6);
  const tmax=M.open?(2.6*M.st.ffRadius*M.a/M.c):(6*per);
  const ts=[], us=[];
  const Rm=[]; for(let m=0;m<=M.M;m++) Rm.push(new Float64Array(NRD+1));
  const idx=Math.round(clamp(M.r0f,0,1)*NRD);
  const prof=new Float64Array(NFR+1);
  for(let q=0;q<=NT;q++){
    const tt=tmax*q/NT;
    ts.push(tt);
    if(M.open){
      freeFieldAt(M.FF,tt,M.struck,prof,M.tau);
      us.push(sampleFF(M.FF,prof,0)*M.amp);
    }else{
      evalRadial(M,tt,Rm);
      let s=0;
      for(let m=0;m<=M.M;m++) s+=Rm[m][idx];
      us.push(s*M.amp);
    }
  }
  HIST_CACHE={key:key,val:{t:ts,u:us,tmax:tmax}};
  return HIST_CACHE.val;
}

/* ------------------------------------------------------------------ *
 *  VIEW 2 — "free field"                                              *
 *                                                                     *
 *  Three things at once, because the point only lands when they are   *
 *  side by side: the profile spreading, the space-time diagram with   *
 *  the light cone drawn on it, and the SAME strike in one, two and    *
 *  three dimensions.  In 3-D the response is exactly zero once the    *
 *  sphere r = ct has passed; in 2-D it never returns to zero; in 1-D  *
 *  it does not even decay.  Huygens' principle in its sharp form is   *
 *  an odd-dimensional accident.                                       *
 * ------------------------------------------------------------------ */
function huygens1D(M,r,t){
  /* u = 1/(2c) INT_{r-ct}^{r+ct} exp(-x^2/2s^2) dx, by composite Gauss-Legendre
     so that no error function is needed anywhere in this file */
  const s=M.ffS, c=M.c;
  /* Clip to where the integrand actually lives.  Panels spread evenly over
     [r-ct, r+ct] put the whole Gaussian inside ONE of them once ct >> s, and
     16-point Gauss-Legendre across a panel twenty sigma wide is not exact —
     it cost 5e-7 on the plateau value.  Outside +-9s the integrand is 1e-18.
     (Known-bad: never sample uniformly in a parameter the integrand does not
     spread out in.) */
  const lo=Math.max(r-c*t,-9*s), hi=Math.min(r+c*t,9*s);
  if(!(hi>lo)) return 0;
  const gl=GL16(), NP=24;
  let acc=0;
  for(let p=0;p<NP;p++){
    const a0=lo+(hi-lo)*p/NP, b0=lo+(hi-lo)*(p+1)/NP;
    const hw=0.5*(b0-a0), mid=0.5*(a0+b0);
    for(let i=0;i<16;i++){
      const x=hw*gl.x[i]+mid;
      acc+=hw*gl.w[i]*Math.exp(-x*x/(2*s*s));
    }
  }
  return acc/(2*c);
}
function huygens3D(M,r,t){
  /* u = t * <g> over the sphere of radius ct about r.  For a Gaussian source
     the spherical mean is exact:
        <g> = s^2/(2 r R) [ exp(-(r-R)^2/2s^2) - exp(-(r+R)^2/2s^2) ],  R = ct
     and its r -> 0 limit is exp(-R^2/2s^2), which is the branch below.  A
     branch no test evaluates is covered by nothing, so selfTest reaches it. */
  const s=M.ffS, R=M.c*t;
  if(!(R>0)) return 0;
  if(r<1e-9*s||r<1e-12) return t*Math.exp(-R*R/(2*s*s));
  const A=Math.exp(-(r-R)*(r-R)/(2*s*s)), Bq=Math.exp(-(r+R)*(r+R)/(2*s*s));
  return t*s*s*(A-Bq)/(2*r*R);
}
let _GL16=null;
function GL16(){ return _GL16||(_GL16=gaussLegendre(16)); }

function drawField(ctx,W,H,M,S){
  const st=M.st, t=st.t, R=M.ffR, c=M.c;
  const pad=54, gap=42;
  const colW=(topRight(W)-pad-gap)/2;
  const topH=Math.max(150,(H-150)*0.52), botH=Math.max(130,(H-160)*0.48);

  /* --- (a) the profile, at several times --- */
  const b1=box(pad,58,colW,topH);
  const prof=new Float64Array(NFR+1);
  const times=[];
  for(let q=1;q<=5;q++) times.push(t*q/5);
  let ym=1e-14;
  const curves=times.map(tt=>{
    freeFieldAt(M.FF,tt,M.struck,prof,M.tau);
    const ys=[];
    for(let j=0;j<=NFR;j++){ const v=prof[j]*M.amp*1000; ys.push(v);
      ym=Math.max(ym,Math.abs(v)); }
    return {t:tt,ys:ys.slice()};
  });
  const xs=[]; for(let j=0;j<=NFR;j++) xs.push(R*j/NFR/M.a);
  axes(ctx,b1,0,R/M.a,-ym*1.12,ym*1.12,
       {xlab:'r / a',ylab:'displacement  (mm)',title:'the pulse leaving',
        xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,3)});
  cpoly(ctx,b1,[0,R/M.a],[0,0],0,R/M.a,-ym*1.12,ym*1.12,rgba(COL.faint,0.9),1);
  curves.forEach((cv,i)=>{
    const f=(i+1)/curves.length;
    cpoly(ctx,b1,xs,cv.ys,0,R/M.a,-ym*1.12,ym*1.12,
             rgba(COL.dn,0.25+0.75*f),i===curves.length-1?2.1:1.2);
    const rc=c*cv.t/M.a;
    if(rc<=R/M.a)
      cpoly(ctx,b1,[rc,rc],[-ym*1.12,ym*1.12],0,R/M.a,-ym*1.12,ym*1.12,
               rgba(COL.up,0.20+0.5*f),1,[2,3]);
  });
  capBack(ctx,b1.x+6,b1.y+6,colW-24,30);
  caption(ctx,b1.x+6,b1.y+6,'dashed: r = ct. The crest sits on it &mdash; but look '
    +'behind: the sheet does not come back to rest.',colW-16,COL.dim,
    '10.5px -apple-system, sans-serif');

  /* --- (b) space-time --- */
  const b2=box(pad+colW+gap,58,colW,topH);
  const NTt=96, NRr=112;
  const tmax=Math.max(t,1e-9)*1.6;
  const img=[];
  let sm=1e-14;
  for(let it=0;it<NTt;it++){
    const tt=tmax*(it+0.5)/NTt;
    freeFieldAt(M.FF,tt,M.struck,prof,M.tau);
    const rowv=[];
    for(let ir=0;ir<NRr;ir++){
      const rr=R*(ir+0.5)/NRr;
      const v=sampleFF(M.FF,prof,rr)*M.amp;
      rowv.push(v); sm=Math.max(sm,Math.abs(v));
    }
    img.push(rowv);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(b2.x,b2.y,b2.w,b2.h); ctx.clip();
  const cw=b2.w/NRr+0.7, ch=b2.h/NTt+0.7;
  for(let it=0;it<NTt;it++) for(let ir=0;ir<NRr;ir++){
    ctx.fillStyle=surfCol(img[it][ir],sm,0.92,STPW);
    ctx.fillRect(b2.x+b2.w*ir/NRr,b2.y1-b2.h*(it+1)/NTt,cw,ch);
  }
  ctx.restore();
  axes(ctx,b2,0,R/M.a,0,tmax*1000,
       {xlab:'r / a',ylab:'t  (ms)',title:'space&ndash;time: the light cone and its wake',
        xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,1)});
  cpoly(ctx,b2,[0,R/M.a],[0,R/c*1000],0,R/M.a,0,tmax*1000,COL.up,1.6,[5,4]);
  cpoly(ctx,b2,[0,R/M.a],[t*1000,t*1000],0,R/M.a,0,tmax*1000,
           rgba(COL.mark,0.9),1.3);
  capBack(ctx,b2.x+8,b2.y+b2.h-50,colW-28,48);
  caption(ctx,b2.x+8,b2.y+b2.h-50,'r = ct is the straight dashed line. Everything '
    +'to its LEFT is the wake &mdash; region the wave has passed and not left alone. '
    +'Brightness is |u|<sup>'+fmt(STPW,2)+'</sup>, compressed so the late wake is '
    +'visible at all.',colW-20,COL.ink,'10.5px -apple-system, sans-serif');

  /* --- (c) one, two and three dimensions --- */
  const b3=box(pad,58+topH+60,W-2*pad,botH-26);
  const rp=M.ffS*0.0001;      /* observe essentially at the source */
  const NTc=200, tm=tmax;
  const tt=[], u1=[], u2=[], u3=[];
  for(let i=1;i<=NTc;i++){
    const T=tm*i/NTc;
    tt.push(T*1000);
    freeFieldAt(M.FF,T,M.struck,prof,M.tau);
    u1.push(huygens1D(M,rp,T));
    u2.push(sampleFF(M.FF,prof,rp));
    u3.push(huygens3D(M,rp,T));
  }
  const nrm=arr=>{ let mx=1e-30; for(const v of arr) mx=Math.max(mx,Math.abs(v));
                   return arr.map(v=>v/mx); };
  /* each curve to its OWN peak: the three differ by orders of magnitude and
     the claim being made is about SHAPE, not amplitude — the caption says so */
  const n1=nrm(u1), n2=nrm(u2), n3=nrm(u3);
  axes(ctx,b3,0,tm*1000,-0.15,1.15,
       {xlab:'t  (ms)',ylab:'response  (each scaled to its own peak)',
        title:'the same strike in one, two and three dimensions',
        xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,1)});
  cpoly(ctx,b3,[0,tm*1000],[0,0],0,tm*1000,-0.15,1.15,rgba(COL.faint,0.9),1);
  cpoly(ctx,b3,tt,n1,0,tm*1000,-0.15,1.15,COL.rim,1.8);
  cpoly(ctx,b3,tt,n2,0,tm*1000,-0.15,1.15,COL.up,2.1);
  cpoly(ctx,b3,tt,n3,0,tm*1000,-0.15,1.15,COL.mark,1.8);
  const leg=[['1-D  a plateau: it never even decays',COL.rim],
             ['2-D  a WAKE: decays as 1/t, never reaches zero',COL.up],
             ['3-D  gone — it dies as exp(−(ct)²/2s²), not as a power',COL.mark]];
  let ly=b3.y+8;
  leg.forEach(([s,c])=>{
    ctx.fillStyle=c; ctx.fillRect(b3.x+b3.w-286,ly+3,9,9);
    ctx.fillStyle=COL.ink; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(s),b3.x+b3.w-270,ly);
    ly+=15;
  });
  capBack(ctx,b3.x+8,b3.y+b3.h-34,b3.w*0.55,32);
  caption(ctx,b3.x+8,b3.y+b3.h-34,'Huygens&rsquo; principle in its sharp form &mdash; '
    +'a bang heard as a bang &mdash; holds only in odd dimensions of three or more. '
    +'On a membrane the strike is heard forever, fading as 1/t.',
    b3.w*0.55,COL.dim,'10.5px -apple-system, sans-serif');
}
/* ------------------------------------------------------------------ *
 *  VIEW 3 — "the droplet"                                             *
 *                                                                     *
 *  Identical machinery to "free field" with one line changed:         *
 *      omega = c k          ->      omega^2 = (gk + (sigf/rho)k^3)tanh kh *
 *  Non-dispersive becomes dispersive, and the single clean wavefront   *
 *  becomes a spreading train sorted by wavelength.  The two landmarks  *
 *  drawn on it are DERIVED from sigma and rho, not quoted:             *
 *      c_p minimum   (4 g sigma / rho)^1/4 = 23.13 cm/s at 17.13 mm    *
 *      c_g minimum   found by ternary search  = 17.76 cm/s at 43.6 mm  *
 *  and the second is the interesting one, because it means the region  *
 *  r < c_g,min t contains NO waves at all: an expanding calm hole.     *
 * ------------------------------------------------------------------ */
function drawDroplet(ctx,W,H,M,S){
  const st=M.st, t=st.t, R=M.ffR;
  const hh=M.med.h;
  const cg=k=>waterCg(k,hh), cp=k=>waterCp(k,hh);
  const gm=waterCgMin(hh);
  const pad=54, gap=40, colW=(topRight(W)-pad-gap)/2;
  const topH=Math.max(150,(H-160)*0.54), botH=Math.max(130,(H-170)*0.46);
  const prof=new Float64Array(NFR+1);

  /* (a) the profile at several times */
  const b1=box(pad,58,colW,topH);
  let ym=1e-14;
  const curves=[];
  for(let q=1;q<=4;q++){
    const tt=t*q/4;
    freeFieldAt(M.FF,tt,M.struck,prof,M.tau);
    const ys=[];
    for(let j=0;j<=NFR;j++){ const v=prof[j]*M.amp*1000; ys.push(v);
      ym=Math.max(ym,Math.abs(v)); }
    curves.push({t:tt,ys:ys});
  }
  const xs=[]; for(let j=0;j<=NFR;j++) xs.push(R*j/NFR*100);
  axes(ctx,b1,0,R*100,-ym*1.12,ym*1.12,
       {xlab:'r  (cm)',ylab:'surface  (mm)',title:'the ripples, sorted by wavelength',
        xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,3)});
  cpoly(ctx,b1,[0,R*100],[0,0],0,R*100,-ym*1.12,ym*1.12,rgba(COL.faint,0.9),1);
  curves.forEach((cv,i)=>{
    const f=(i+1)/curves.length;
    cpoly(ctx,b1,xs,cv.ys,0,R*100,-ym*1.12,ym*1.12,
             rgba(COL.dn,0.24+0.76*f),i===curves.length-1?2.1:1.1);
  });
  /* One line per overlaid time, not just the latest: the earlier curves have
     SMALLER holes, and with a single line their perfectly legitimate ripples
     inside it read as the picture contradicting its own caption. */
  curves.forEach((cv,i)=>{
    const rh=gm.cg*cv.t*100;
    if(rh>=R*100) return;
    const last=(i===curves.length-1);
    cpoly(ctx,b1,[rh,rh],[-ym*1.12,ym*1.12],0,R*100,-ym*1.12,ym*1.12,
          rgba(COL.mark,last?0.95:0.32),last?1.7:1.1,[4,3]);
  });
  const rFast=frontRadius(M,t)*100;
  if(rFast<R*100)
    cpoly(ctx,b1,[rFast,rFast],[-ym*1.12,ym*1.12],0,R*100,-ym*1.12,ym*1.12,
             COL.up,1.4,[2,4]);
  capBack(ctx,b1.x+8,b1.y+6,colW-26,30);
  caption(ctx,b1.x+8,b1.y+6,'one magenta line per curve: r = c<sub>g,min</sub>t, '
    +'and inside its own line each curve is flat &mdash; nothing travels slower.',colW-18,COL.ink,
    '10.5px -apple-system, sans-serif');

  /* (b) space-time with the group-velocity fan */
  const b2=box(pad+colW+gap,58,colW,topH);
  const NTt=90, NRr=112, tmax=Math.max(t,1e-9)*1.5;
  let sm=1e-14;
  const img=[];
  for(let it=0;it<NTt;it++){
    freeFieldAt(M.FF,tmax*(it+0.5)/NTt,M.struck,prof,M.tau);
    const rowv=[];
    for(let ir=0;ir<NRr;ir++){
      const v=sampleFF(M.FF,prof,R*(ir+0.5)/NRr);
      rowv.push(v); sm=Math.max(sm,Math.abs(v));
    }
    img.push(rowv);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(b2.x,b2.y,b2.w,b2.h); ctx.clip();
  const cw=b2.w/NRr+0.7, ch=b2.h/NTt+0.7;
  for(let it=0;it<NTt;it++) for(let ir=0;ir<NRr;ir++){
    ctx.fillStyle=surfCol(img[it][ir],sm,0.92,STPW);
    ctx.fillRect(b2.x+b2.w*ir/NRr,b2.y1-b2.h*(it+1)/NTt,cw,ch);
  }
  ctx.restore();
  axes(ctx,b2,0,R*100,0,tmax,
       {xlab:'r  (cm)',ylab:'t  (s)',title:'space&ndash;time: a fan, not a cone',
        xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,2)});
  /* every straight line through the origin is one group speed */
  for(const lam of [3,8,17.13,43.6,120,400]){
    const k=TAU/(lam*1e-3), v=cg(k);
    cpoly(ctx,b2,[0,R*100],[0,R/v],0,R*100,0,tmax,
             rgba(COL.faint,0.85),1,[3,4]);
  }
  cpoly(ctx,b2,[0,R*100],[0,R/gm.cg],0,R*100,0,tmax,COL.mark,1.7);
  cpoly(ctx,b2,[0,R*100],[t,t],0,R*100,0,tmax,rgba(COL.ink,0.5),1.1);
  capBack(ctx,b2.x+8,b2.y+b2.h-46,colW-28,46);
  caption(ctx,b2.x+8,b2.y+b2.h-46,'On a drum every one of those dashed lines would '
    +'lie on top of the others &mdash; one speed, one cone. Here each wavelength '
    +'gets its own, and the magenta line is the slowest of them. Brightness is '
    +'|&eta;|<sup>'+fmt(STPW,2)+'</sup>.',colW-20,COL.ink,
    '10.5px -apple-system, sans-serif');

  /* (c) the dispersion relation itself */
  const b3=box(pad,58+topH+56,W-2*pad,botH-30);
  const lamLo=0.6, lamHi=1500;                 /* mm, logarithmic */
  const NX=260, lx=[], lp=[], lg=[];
  for(let i=0;i<=NX;i++){
    const lam=lamLo*Math.pow(lamHi/lamLo,i/NX), k=TAU/(lam*1e-3);
    lx.push(Math.log10(lam)); lp.push(cp(k)*100); lg.push(cg(k)*100);
  }
  let vmax=0; for(let i=0;i<=NX;i++) vmax=Math.max(vmax,lp[i],lg[i]);
  vmax=Math.min(vmax,120);
  axes(ctx,b3,Math.log10(lamLo),Math.log10(lamHi),0,vmax,
       {xlab:'wavelength  (mm, logarithmic)',ylab:'speed  (cm/s)',
        title:'why a drop looks nothing like a drum',
        xfmt:v=>sigf(Math.pow(10,v),2),yfmt:v=>fmt(v,0),
        xticks:[-0.2,0,0.5,1,1.5,2,2.5,3,3.176]});
  cpoly(ctx,b3,lx,lp,Math.log10(lamLo),Math.log10(lamHi),0,vmax,COL.up,2.1);
  cpoly(ctx,b3,lx,lg,Math.log10(lamLo),Math.log10(lamHi),0,vmax,COL.dn,2.1);
  const mark=(lam,v,col,lab)=>{
    const X=Math.log10(lam);
    cpoly(ctx,b3,[X,X],[0,v],Math.log10(lamLo),Math.log10(lamHi),0,vmax,col,1.2,[3,3]);
    const px=b3.x+b3.w*(X-Math.log10(lamLo))/(Math.log10(lamHi)-Math.log10(lamLo));
    const py=b3.y1-b3.h*v/vmax;
    ctx.beginPath(); ctx.arc(px,py,3.4,0,TAU); ctx.fillStyle=col; ctx.fill();
    ctx.fillStyle=col; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(plain(lab),px+7,py-3);
  };
  /* the phase minimum has to follow the depth too, or the classic 23.13 cm/s
     landmark is drawn sitting ABOVE a shallow-water curve that never reaches
     it — a correct number in the wrong place, which is worse than no number */
  const pm=waterCpMin(hh), pFlat=(pm.k*hh<0.5);
  if(!pFlat)
    mark(TAU/pm.k*1e3,pm.cp*100,COL.up,
         'c'+'ₚ'+' minimum  '+fmt(pm.cp*100,2)+' cm/s at '+fmt(TAU/pm.k*1e3,2)+' mm');
  /* In shallow water c_g does not have an interior minimum at all: it is FLAT
     at sqrt(gh) for every wave long against the depth, so "the wavelength at
     the minimum" is wherever the search happened to stop — 564 metres, in
     1 mm of water, which ran the label off the canvas.  A floor is drawn as a
     floor. */
  const shallowFloor=(gm.k*hh<0.5);
  if(shallowFloor&&pFlat){
    /* both speeds flatten to the same sqrt(gh); one line, said once */
    const yv=Math.sqrt(G_ACC*hh)*100;
    cpoly(ctx,b3,[Math.log10(lamLo),Math.log10(lamHi)],[yv,yv],
          Math.log10(lamLo),Math.log10(lamHi),0,vmax,COL.mark,1.4,[5,4]);
    ctx.fillStyle=COL.mark; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(plain('&radic;(gh) = '+fmt(yv,2)+' cm/s &mdash; in '+fmt(hh*1e3,1)
      +' mm of water BOTH speeds flatten here, and long waves stop dispersing '
      +'altogether: exactly the membrane\u2019s ω = ck'),
      b3.x+10,b3.y1-b3.h*yv/vmax-5);
  } else if(shallowFloor){
    const yv=gm.cg*100;
    cpoly(ctx,b3,[Math.log10(lamLo),Math.log10(lamHi)],[yv,yv],
          Math.log10(lamLo),Math.log10(lamHi),0,vmax,COL.dn,1.3,[5,4]);
    ctx.fillStyle=COL.dn; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(plain('c'+'ᵧ'+' floor  '+fmt(yv,2)+' cm/s = &radic;(gh) &mdash; '
      +'a plateau, not a point: every wave long against '+fmt(hh*1e3,1)
      +' mm travels alike'),b3.x+10,b3.y1-b3.h*yv/vmax-5);
  } else {
    mark(TAU/gm.k*1e3,gm.cg*100,COL.dn,
         'c'+'ᵧ'+' minimum  '+fmt(gm.cg*100,2)+' cm/s at '+fmt(TAU/gm.k*1e3,1)+' mm');
  }
  let ly=b3.y+8;
  [['phase speed  c'+'ₚ'+' = &omega;/k',COL.up],
   ['group speed  c'+'ᵧ'+' = d&omega;/dk',COL.dn]].forEach(([s,c])=>{
    ctx.fillStyle=c; ctx.fillRect(b3.x+12,ly+3,9,9);
    ctx.fillStyle=COL.ink; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(s),b3.x+27,ly); ly+=15;
  });
  capBack(ctx,b3.x+b3.w-330,b3.y+8,322,62);
  caption(ctx,b3.x+b3.w-330,b3.y+8,'Left of the minimum surface tension '
    +'carries the wave and short waves are FAST; right of it gravity does and long '
    +'waves are. In DEEP water nothing travels slower than '
    +fmt(M.cMin*100,1)+' cm/s, which is why an insect under that speed leaves no '
    +'wake'
    +((TAU/(lamHi*1e-3))*hh<1.5
       ? '; but at '+fmt(hh*1e3,0)+' mm the longest waves here feel the bottom '
        +'and are held to &radic;(gh) = '+fmt(Math.sqrt(G_ACC*hh)*100,1)+' cm/s.'
       : ', and at '+fmt(hh*1e3,0)+' mm the water is deep across this whole '
        +'range, so that limit is the one in force.'),
    322,COL.dim,
    '10.5px -apple-system, sans-serif');
}

/* ------------------------------------------------------------------ *
 *  VIEW 4 — "separation"                                              *
 * ------------------------------------------------------------------ */
function drawSeparate(ctx,W,H,M,S){
  const st=M.st, m=clamp(st.mSel|0,0,12), n=clamp(st.nSel|0,1,M.N);
  const pad=48;
  /* --- the boxes: one PDE, three ODEs --- */
  const bw=Math.min(430,W*0.36);
  let y=64;
  const bx=pad;
  const drawBox=(yy,hh,title,eqn,sol,col)=>{
    ctx.fillStyle='rgba(16,19,27,.82)';
    ctx.strokeStyle=col; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.rect(bx+0.5,yy+0.5,bw,hh); ctx.fill(); ctx.stroke();
    ctx.fillStyle=col; ctx.font='italic 12px Georgia, serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(title),bx+13,yy+9);
    ctx.fillStyle='#e9e9f0'; ctx.font='15px Georgia, serif';
    ctx.fillText(plain(eqn),bx+13,yy+27);
    ctx.fillStyle=COL.dim; ctx.font='11px -apple-system, sans-serif';
    ctx.fillText(plain(sol),bx+13,yy+50);
  };
  drawBox(y,72,'the PDE &mdash; one equation, two space dimensions and time',
          'σ uₜₜ = T ∇²u',
          'c = √(T/σ) = '+sigf(M.c,4)+' m/s',COL.rim);
  const yA=y+72;
  ctx.strokeStyle=rgba(COL.rim,0.5); ctx.lineWidth=1.2;
  for(let i=0;i<3;i++){
    const yt=yA+34+i*94+26;
    ctx.beginPath();
    ctx.moveTo(bx+bw/2,yA+2); ctx.lineTo(bx+bw/2,yA+20);
    ctx.lineTo(bx-16,yA+20); ctx.lineTo(bx-16,yt); ctx.lineTo(bx-2,yt);
    ctx.stroke();
  }
  ctx.fillStyle=COL.bg; ctx.fillRect(bx+bw/2-110,yA+13,220,16);
  ctx.fillStyle=COL.rim; ctx.font='italic 11.5px Georgia, serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('separate:  u = R(r) Θ(θ) T(t)',bx+bw/2,yA+14);
  y=yA+34;
  drawBox(y,80,'ODE 1 &mdash; time','T″ + ω² T = 0',
          'T = cos ωt, sin ωt   — a harmonic oscillator, one per mode',COL.dn);
  drawBox(y+94,80,'ODE 2 &mdash; angle','Θ″ + m² Θ = 0',
          'periodic in 2π forces m INTEGER — that is where m comes from',COL.dn);
  drawBox(y+188,88,'ODE 3 &mdash; radius  (Bessel, order m)',
          'r²R″ + rR′ + (k²r² − m²)R = 0',
          'R = Jₘ(kr);  Yₘ is thrown away — infinite at r = 0',COL.up);
  ctx.textAlign='left';
  caption(ctx,bx,y+284,'Not one of those three ODEs knows how big the drum is. '
    +'k is still free, and &omega; = ck with it. The RIM is the only thing that '
    +'picks a discrete set out of the continuum &mdash; which is why taking the rim '
    +'away, in <b>free field</b>, leaves an integral over k instead of a sum.',
    bw,COL.dim,'11.5px -apple-system, sans-serif');
  /* the rim summary — what each boundary condition picks out of the continuum.
     It also fills the lower-left quadrant, which was empty. */
  {
    let yy=y+372;
    ctx.font='italic 13px Georgia, serif'; ctx.fillStyle=COL.ink;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('what each rim selects',bx,yy); yy+=23;
    for(const bcd of BCS){
      const on=(bcd.id===st.bc);
      ctx.fillStyle=on?COL.mark:COL.faint;
      ctx.fillRect(bx,yy+3,7,7);
      ctx.font='12px -apple-system, sans-serif';
      ctx.fillStyle=on?'#fff':COL.dim;
      ctx.fillText(plain(bcd.name),bx+15,yy);
      ctx.font='11.5px "SF Mono", Menlo, monospace';
      ctx.fillStyle=on?COL.ink:'#5c6478';
      ctx.fillText(plain(bcd.sym),bx+96,yy);
      ctx.font='11px -apple-system, sans-serif';
      ctx.fillStyle='#6b7284';
      ctx.fillText(plain(bcd.id==='clamped'?'k a = j(m,n)'
                        :bcd.id==='free'?"k a = j'(m,n),  and k = 0 exists"
                        :bcd.id==='springy'?"anywhere between j'(m,n) and j(m,n)"
                        :'every k \u2014 no discrete set at all'),bx+15,yy+15);
      yy+=37;
    }
  }

  /* --- J_m and its zeros --- */
  const px=bx+bw+56, pw=topRight(W)-px;
  const b=box(px,74,pw,Math.max(180,(H-190)*0.62));
  const XH=Math.max(besselZero(m,Math.min(8,M.N))*1.10,14);
  const xs=[], ys=[];
  for(let i=0;i<=600;i++){ const x=XH*i/600; xs.push(x); ys.push(besselJ(m,x)); }
  let ylo=-0.55, yhi=1.05;
  if(m>0){ let mx=0; for(const v of ys) mx=Math.max(mx,Math.abs(v));
           ylo=-mx*1.25; yhi=mx*1.25; }
  axes(ctx,b,0,XH,ylo,yhi,{xlab:'x = k a',ylab:'J'+sub(m)+'(x)',
    title:'the radial ODE’s solution, and where the rim cuts it',
    xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,2)});
  cpoly(ctx,b,[0,XH],[0,0],0,XH,ylo,yhi,rgba(COL.faint,0.95),1);
  cpoly(ctx,b,xs,ys,0,XH,ylo,yhi,COL.up,2.1);
  /* Zeros crowd together as m rises — j(9,2) and j(9,3) are 30 px apart at
     the default width — so a label is drawn only when it clears the previous
     one in its own band.  The dashed LINE is always drawn.  The j' labels sit
     just inside the top edge rather than above it, where the plot title is. */
  const lastX={u:-1e9,d:-1e9};
  const tick=(x,col,lab,up)=>{
    if(x<=0||x>XH) return;
    cpoly(ctx,b,[x,x],[ylo,yhi],0,XH,ylo,yhi,rgba(col,0.75),1.1,[3,3]);
    if(!lab) return;
    const X=b.x+b.w*x/XH, band=up?'u':'d';
    if(X-lastX[band]<46) return;
    lastX[band]=X;
    ctx.fillStyle=col; ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(plain(lab),X,up?b.y+5:b.y1+16);
  };
  for(let i=1;i<=M.N;i++){
    tick(besselZero(m,i),COL.rim,i<=3?'j('+m+','+i+')':'',false);
    const nz=neumannZero(m,i);
    if(nz>0) tick(nz,COL.dn,i<=2?'j′('+m+','+i+')':'',true);
  }
  const xc=currentX(M,m,n);
  cpoly(ctx,b,[xc,xc],[ylo,yhi],0,XH,ylo,yhi,COL.mark,2.2);
  {
    /* inside the BOTTOM edge: the top of the box is the j' label band */
    ctx.fillStyle='rgba(7, 11, 24,.86)'; ctx.fillRect(b.x1-192,b.y1-23,184,19);
    ctx.fillStyle=COL.mark; ctx.font='italic 12px Georgia, serif';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText('in force: ka = '+fmt(xc,5),b.x1-8,b.y1-6);
  }
  let ly=b.y+b.h-52;
  ctx.fillStyle='rgba(7, 11, 24,.86)'; ctx.fillRect(b.x+4,ly-5,272,50);
  [['orange: zeros of J'+sub(m)+' — the CLAMPED spectrum',COL.rim],
   ['cyan: zeros of J'+sub(m)+'′ — the FREE spectrum',COL.dn],
   ['magenta: the root actually in force',COL.mark]].forEach(([s,c])=>{
    ctx.fillStyle=c; ctx.fillRect(b.x+10,ly+3,9,9);
    ctx.fillStyle=COL.ink; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(s),b.x+25,ly); ly+=15;
  });
  /* the springy root, sliding between the two, as a function of B */
  const b2=box(px,74+b.h+52,pw,Math.max(96,H-(74+b.h+52)-72));
  const NB=200, bxs=[], bys=[];
  const dz=new Float64Array(n+1);
  for(let i=1;i<=n+1;i++) dz[i-1]=besselZero(m,i);
  const nzs=new Float64Array(n);
  for(let i=1;i<=n;i++) nzs[i-1]=besselPrimeZero(m,i,dz);
  for(let i=0;i<=NB;i++){
    const lb=-3+6*i/NB;
    bxs.push(lb); bys.push(robinRoot(m,n,Math.pow(10,lb),dz,nzs));
  }
  const lo2=Math.min(nzs[n-1],dz[n-1])-0.15, hi2=Math.max(nzs[n-1],dz[n-1])+0.15;
  axes(ctx,b2,-3,3,lo2,hi2,{xlab:'log₁₀ B    (B = κ a / T, the rim stiffness)',
    ylab:'k a',title:'the springy rim, sliding from free to clamped',
    xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,2)});
  cpoly(ctx,b2,[-3,3],[nzs[n-1],nzs[n-1]],-3,3,lo2,hi2,COL.dn,1.2,[4,3]);
  cpoly(ctx,b2,[-3,3],[dz[n-1],dz[n-1]],-3,3,lo2,hi2,COL.rim,1.2,[4,3]);
  cpoly(ctx,b2,bxs,bys,-3,3,lo2,hi2,COL.up,2.1);
  if(st.bc==='springy'){
    const lb=clamp(st.logB,-3,3);
    cpoly(ctx,b2,[lb,lb],[lo2,hi2],-3,3,lo2,hi2,COL.mark,1.8);
  }
}
function sub(m){ return '₀₁₂₃₄₅₆₇₈₉'[m]||('_'+m); }

/* ------------------------------------------------------------------ *
 *  VIEW 5 — "the modes"                                               *
 * ------------------------------------------------------------------ */
function nodalPattern(ctx,cx,cy,rad,m,n,x,alpha){
  const NG=34;
  /* J_m peaks well below 1 for m > 0 (max |J_8| is 0.26), so colouring against
     a fixed peak of 1 renders the high-m panels as near-black mud.  Each panel
     is scaled to its own extreme, which is what a nodal DIAGRAM is for. */
  let pk=1e-9;
  for(let i=0;i<=NG;i++) pk=Math.max(pk,Math.abs(besselJ(m,x*i/NG)));
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,TAU); ctx.clip();
  for(let i=0;i<NG;i++){
    const r0=rad*i/NG, r1=rad*(i+1)/NG, rm=0.5*(r0+r1);
    const jr=besselJ(m,x*rm/rad);
    const NA=Math.max(8,Math.round(TAU*rm/2.6));
    for(let j=0;j<NA;j++){
      const t0=TAU*j/NA, t1=TAU*(j+1)/NA;
      const v=jr*Math.cos(m*0.5*(t0+t1));
      ctx.beginPath();
      ctx.arc(cx,cy,r1,t0,t1); ctx.arc(cx,cy,r0,t1,t0,true); ctx.closePath();
      ctx.fillStyle=surfCol(v,pk,0.95);
      ctx.globalAlpha=alpha===undefined?1:alpha;
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha=1;
  /* the nodal lines themselves */
  ctx.strokeStyle=rgba('#070b18',0.85); ctx.lineWidth=1.1;
  for(let i=1;i<n;i++){
    const rr=rad*besselZero(m,i)/x;
    if(rr<rad){ ctx.beginPath(); ctx.arc(cx,cy,rr,0,TAU); ctx.stroke(); }
  }
  for(let i=0;i<m;i++){
    const th=PI*(2*i+1)/(2*m);
    ctx.beginPath();
    ctx.moveTo(cx-rad*Math.cos(th),cy-rad*Math.sin(th));
    ctx.lineTo(cx+rad*Math.cos(th),cy+rad*Math.sin(th));
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,TAU);
  ctx.strokeStyle=rgba(COL.rim,0.85); ctx.lineWidth=1.4; ctx.stroke();
}
function drawModes(ctx,W,H,M,S){
  const st=M.st;
  const list=M.spec.filter(z=>z.f>1e-9).slice(0,18);
  const pad=44;
  const cols=5, rows=Math.ceil(list.length/cols);
  const gw=(topRight(W)-pad)/cols, gh=Math.min(126,(H-150)/rows);
  const rad=Math.min(gw,gh)*0.34;
  ctx.textAlign='center';
  list.forEach((z,i)=>{
    const cx=pad+gw*(i%cols)+gw/2, cy=100+gh*Math.floor(i/cols)+gh/2;
    const on=(z.m===(st.mSel|0)&&z.n===(st.nSel|0));
    nodalPattern(ctx,cx,cy-6,rad,z.m,z.n,z.x,on?1:0.62);
    if(on){
      ctx.beginPath(); ctx.arc(cx,cy-6,rad+5,0,TAU);
      ctx.strokeStyle=COL.mark; ctx.lineWidth=1.6; ctx.stroke();
    }
    ctx.fillStyle=on?'#fff':COL.ink; ctx.font='italic 12px Georgia, serif';
    ctx.textBaseline='top';
    ctx.fillText('('+z.m+', '+z.n+')',cx,cy+rad+2);
    ctx.fillStyle=COL.dim; ctx.font='10px "SF Mono", Menlo, monospace';
    ctx.fillText(fmtHzPlain(z.f)+'   ×'+fmt(z.f/list[0].f,3),cx,cy+rad+17);
  });
  ctx.textAlign='left';
  ctx.fillStyle=COL.ink; ctx.font='italic 15px Georgia, serif';
  ctx.fillText('the first '+list.length+' modes of a '+bcById(st.bc).name+' disc, '
    +'in order of pitch',pad,54);
  caption(ctx,pad,74,'Green is up, cyan is down; the black lines are the nodes, '
    +'where the head never moves. m is the number of DIAMETERS, n−1 the number '
    +'of interior CIRCLES. Every m > 0 mode has an identical twin rotated by half a '
    +'lobe, so it counts twice — and a strike on that twin’s node cannot '
    +'excite it, which is what choosing where to hit a drum really does.',
    topRight(W)-pad,COL.dim,'11.5px -apple-system, sans-serif');
  /* how much of THIS strike went into each of them */
  const bh=Math.min(112,H-(100+gh*rows)-58);
  if(bh>44){
    /* x=66 leaves room for the rotated y label, which axes() puts at x-40 */
    const b=box(66,H-bh-42,W-66-46,bh);
    let mx=1e-30;
    for(const z of list) mx=Math.max(mx,Math.abs(z.C));
    axes(ctx,b,-0.5,list.length-0.5,0,1.1,
      {xlab:'',ylab:'|C| / max',title:'how much of THIS strike landed in each mode',
       xticks:[],yfmt:v=>fmt(v,1)});
    list.forEach((z,i)=>{
      const X=b.x+b.w*(i+0.5)/list.length;
      const hh=b.h*Math.abs(z.C)/mx;
      ctx.fillStyle=(z.m===(st.mSel|0)&&z.n===(st.nSel|0))?COL.mark:COL.up;
      ctx.fillRect(X-b.w/list.length*0.30,b.y1-hh,b.w/list.length*0.60,hh);
    });
    caption(ctx,b.x+8,b.y+6,'Strike at r₀/a = '+fmt(M.r0f,2)
      +': any mode with a node there gets nothing.',b.w*0.6,COL.dim,
      '10.5px -apple-system, sans-serif');
  }
}
function fmtHzPlain(f){ return f>=1000?(f/1000).toFixed(2)+'k':f.toFixed(0)+' Hz'; }

/* ------------------------------------------------------------------ *
 *  VIEW 6 — "the spectrum"                                            *
 * ------------------------------------------------------------------ */
function loadedFreq(M,x){
  /* omega^2 = T k^2 / (sigma + rho_air/k) — the incompressible added mass of
     a mode of wavenumber k, DERIVED (see the header) and not fitted.  Valid
     while the membrane wave is subsonic in air, which is printed. */
  const k=x/M.a;
  return k*Math.sqrt(M.T/(M.sigma+RHO_AIR/k))/TAU;
}
function drawSpectrum(ctx,W,H,M,S){
  const st=M.st;
  const sp=M.spec.filter(z=>z.f>1e-9);
  const base=sp[0];
  const shown=sp.slice(0,14);
  const pad=54, gap=40;
  const usable=topRight(W)-pad;
  const colW=(usable-gap)*0.52, colW2=(usable-gap)-colW;
  const topH=Math.max(160,(H-160)*0.56);

  /* (a) the ladder: drum against string */
  const b=box(pad,62,colW,topH);
  const hi=Math.min(6.2,shown[shown.length-1].f/base.f*1.05);
  axes(ctx,b,0,2,1,hi,{xlab:'',ylab:'f / f₁',title:'a drum is not a string',
    xticks:[],yfmt:v=>fmt(v,2)});
  for(let n=1;n<=Math.floor(hi);n++){
    const Y=b.y1-b.h*(n-1)/(hi-1);
    ctx.strokeStyle=rgba(COL.rim,0.75); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(b.x+b.w*0.55,Y); ctx.lineTo(b.x+b.w*0.95,Y); ctx.stroke();
    ctx.fillStyle=COL.rim; ctx.font='10px "SF Mono", Menlo, monospace';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(String(n),b.x+b.w*0.96,Y);
  }
  /* Partials crowd together as they rise, so labelling every one puts them on
     top of each other — the audit found six overlaps.  A label is drawn only
     if it clears the last one, and the LINE is always drawn either way. */
  let lastY=1e9;
  shown.forEach(z=>{
    const r=(st.airLoad?loadedFreq(M,z.x)/loadedFreq(M,base.x):z.f/base.f);
    if(r>hi) return;
    const Y=b.y1-b.h*(r-1)/(hi-1);
    ctx.strokeStyle=COL.up; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(b.x+b.w*0.18,Y); ctx.lineTo(b.x+b.w*0.46,Y); ctx.stroke();
    if(lastY-Y>16&&Y>b.y+34){
      ctx.fillStyle=COL.ink; ctx.font='10px "SF Mono", Menlo, monospace';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText('('+z.m+','+z.n+') '+fmt(r,3),b.x+b.w*0.20,Y-7);
      lastY=Y;
    }
  });
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle=COL.up; ctx.font='italic 12px Georgia, serif';
  ctx.fillText('this membrane',b.x+b.w*0.32,b.y+6);
  ctx.fillStyle=COL.rim;
  ctx.fillText('a string',b.x+b.w*0.75,b.y+6);
  ctx.textAlign='left';

  /* (b) cents from the nearest harmonic */
  const b2=box(pad+colW+gap,62,colW2,topH);
  const cents=shown.map(z=>{
    const r=(st.airLoad?loadedFreq(M,z.x)/loadedFreq(M,base.x):z.f/base.f);
    const nh=Math.max(1,Math.round(r));
    return {z:z,c:1200*Math.log2(r/nh),nh:nh};
  });
  let cm=50;
  for(const q of cents) cm=Math.max(cm,Math.abs(q.c)*1.15);
  axes(ctx,b2,-0.5,shown.length-0.5,-cm,cm,
    {xlab:'partial, in order of pitch',ylab:'cents from the nearest harmonic',
     title:'how badly it misses',xticks:[],yfmt:v=>fmt(v,0)});
  cpoly(ctx,b2,[-0.5,shown.length-0.5],[0,0],-0.5,shown.length-0.5,-cm,cm,COL.rim,1.6);
  cents.forEach((q,i)=>{
    const X=b2.x+b2.w*(i+0.5)/shown.length, hh=b2.h*q.c/(2*cm);
    const Y0=b2.y+b2.h/2;
    ctx.fillStyle=Math.abs(q.c)<50?COL.up:COL.mark;
    ctx.fillRect(X-b2.w/shown.length*0.3,Math.min(Y0,Y0-hh),
                 b2.w/shown.length*0.6,Math.abs(hh));
  });
  capBack(ctx,b2.x+8,b2.y+b2.h-42,colW2-26,32);
  caption(ctx,b2.x+8,b2.y+b2.h-42,'50 cents is a quarter tone. Nothing on a drum '
    +'lands inside it except the fundamental &mdash; which is exactly why a drum has '
    +'a thud where a string has a note.',colW2-20,COL.dim,
    '10.5px -apple-system, sans-serif');

  /* (c) Weyl's law */
  const b3=box(pad,62+topH+52,W-2*pad,Math.max(96,H-(62+topH+52)-70));
  /* the COMPLETE spectrum, not the truncated display table — see weylStaircase */
  const XH=42;
  const stx=[], sty=[];
  let cnt=0;
  stx.push(0); sty.push(0);
  for(const z of weylStaircase(XH)){
    stx.push(z.x); sty.push(cnt);
    cnt+=z.deg;
    stx.push(z.x); sty.push(cnt);
  }
  stx.push(XH); sty.push(cnt);
  const wx=[], wy=[];
  for(let i=0;i<=200;i++){ const x=XH*i/200; wx.push(x); wy.push(Math.max(0,weyl(x))); }
  const ymax=Math.max(cnt,weyl(XH))*1.08;
  axes(ctx,b3,0,XH,0,ymax,{xlab:'k a',ylab:'modes below k a',
    title:'Weyl’s law — the area sets the count, the perimeter corrects it',
    xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)});
  cpoly(ctx,b3,stx,sty,0,XH,0,ymax,COL.up,1.6);
  cpoly(ctx,b3,wx,wy,0,XH,0,ymax,COL.rim,1.8,[5,4]);
  let ly=b3.y+8;
  [['the exact staircase — every mode, not just the '+M.spec.length+' kept above',COL.up],
   ['N ≈ A k²/4π − L k/4π + χ/6',COL.rim]].forEach(([s,c])=>{
    ctx.fillStyle=c; ctx.fillRect(b3.x+12,ly+3,9,9);
    ctx.fillStyle=COL.ink; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(s),b3.x+27,ly); ly+=15;
  });
  capBack(ctx,b3.x+b3.w-350,b3.y+6,342,62);
  caption(ctx,b3.x+b3.w-350,b3.y+6,'The count depends on the AREA and the PERIMETER '
    +'and almost nothing else — which is why asking whether the spectrum '
    +'determines the shape (Kac, 1966) is a real question, and why the answer '
    +'turned out to be no.',342,COL.dim,'10.5px -apple-system, sans-serif');
  if(st.airLoad)
    caption(ctx,pad,H-30,'Air loading ON: ω² = Tk²/(σ + '
      +'ρₐᵢᵣ/k), one-sided and incompressible '
      +'(cₘₑₘ/cₐᵢᵣ = '+fmt(M.c/C_AIR,3)+', so the '
      +'approximation holds). It moves the family toward equal spacing but does not '
      +'reach the near-harmonic ratios a real kettle produces — a kettle is a '
      +'closed cavity, and this is free air on one side.',W-2*pad,COL.rim,
      '10.5px -apple-system, sans-serif');
}

/* ================================================================== *
 *  dispatch                                                           *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='field')         return drawField(ctx,W,H,M,S);
  if(v==='droplet')       return drawDroplet(ctx,W,H,M,S);
  if(v==='separate')      return drawSeparate(ctx,W,H,M,S);
  if(v==='modes')         return drawModes(ctx,W,H,M,S);
  if(v==='spectrum')      return drawSpectrum(ctx,W,H,M,S);
  return drawStrike(ctx,W,H,M,S);
}
/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.95,0.46,2.7,[0,0,-0.17]);
  let M=null;
  const S={
    st:st,cam:cam,
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    /* the target sits BELOW the membrane so the drum draws above the centre
       of the stage, clear of the two insets along the bottom */
    fit(){ cam.target=[0,0,-0.17];
      cam.dist=clamp((st.bc==='open'?st.ffRadius:1)*2.55,2.0,14); },
    resetView(){ cam.theta=-0.95; cam.phi=0.46; S.fit(); },
    lookDown(){ cam.theta=-PI/2; cam.phi=1.40; S.fit(); },
    pointer(kind,d){
      if(kind!=='move') return;
      cam.theta-=d.dx*0.006;
      cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),1.2,40); },
    step(dt){
      if(st.anim){
        st.t+=dt*st.speed*timeScale(S.model());
        const lim=timeSpan(S.model());
        /* modulo, not subtraction: in real time a free-field span is 10 ms
           and one frame can cover several of them */
        if(st.t>lim){ st.t=lim>0?st.t%lim:0; S.wrapped=true; }
      }
      if(st.spin) cam.theta+=dt*0.18;
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect()
                                          :{width:cam.W,height:cam.H};
      const Wd=r.width||cam.W, Hd=r.height||cam.H;
      cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}
/* the animation runs in real seconds of drum time, scaled so that a drum and a
   puddle are both watchable: the membrane at 1/400 of real time, water at 1/2.
   "real time" runs both at 1x: the decay is then the real one, the sound plays
   in step with it, and the picture is a strobe of whichever phase each frame
   lands on — which is what a real head looks like. */
function timeScale(M){
  if(M.st.realtime) return 1;
  return (M.st.view==='droplet')?0.5:1/400;
}
function timeSpan(M){
  if(M.st.view==='droplet') return 2.2;
  if(M.open||M.st.view==='field') return 3.0*M.ffR/M.c;
  /* slowed, eight periods of the fundamental; in real time one strike is
     left to ring 1.2 x the slowest T60 before the next */
  if(M.st.realtime) return 1.2*ringTime(M);
  return 8/Math.max(M.f1,1e-6);
}

  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['strike','the strike'],['field','free field'],['droplet','the droplet'],
              ['separate','separation'],['modes','the modes'],['spectrum','the spectrum']];
  /* Each view runs on its own clock — a snare rings for 24 ms and a puddle for
     two seconds — so a time carried over from another view can land at a point
     where the picture is legitimately empty.  Entering a view with t below a
     tenth of its span moves it to somewhere worth looking at; a time already
     inside the span is left exactly where the user put it. */
  function switchView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
    S.rebuild();
    const span=timeSpan(S.model());
    if(st.t<0.10*span||st.t>span) st.t=0.42*span;
    S.rebuild(); S.fit(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',
      onclick:()=>switchView(k)},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.innerHTML=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.innerHTML=fmtf(st[key]); S.rebuild(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:row,sync:sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];

          [].forEach.call(wrapEl.children,(b,i)=>
            b.className='chip'+(list[i].id===st[key]?' on':''));

  const gPre=h('div',{class:'grp'},h('h3',null,'the drum'));

  }));

  const gBC=h('div',{class:'grp'},h('h3',null,'the rim'));
  gBC.appendChild(chipRow(BCS,'bc'));

    v=>'10<sup>'+fmt(v,2)+'</sup>'));
  const bcTag=h('div',{class:'tag'}); gBC.appendChild(bcTag);

  const gHit=h('div',{class:'grp'},h('h3',null,'the strike'));

  const gTime=h('div',{class:'grp'},h('h3',null,'time'));

  gTime.appendChild(h('div',{class:'checks'},checkbox('anim','run'),
                                             checkbox('damp','let it decay'),
                                             checkbox('spin','auto-orbit'),
                                             checkbox('realtime','real time')));
  gTime.appendChild(slider('speed','speed',0.05,4,0.05,v=>fmt(v,2)+'&times;'));
  gTime.appendChild(slider('t60','T&#8326;&#8320; of f&#8321;',0.05,12,0.05,v=>fmt(v,2)+' s'));
  gTime.appendChild(slider('lossP','loss &prop; (f/f&#8321;)^p',0,3,0.05,v=>'p = '+fmt(v,2)));
  const radRow=h('div',{class:'checks'},checkbox('radLoss','+ radiation loss (derived)'));
  gTime.appendChild(radRow);
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  /* ---- the sound: the same mode sum, rendered at the audio rate ----
     The AudioContext is created on the first click of "hear it" (browsers
     require a gesture), and every strike is rendered as one buffer by
     renderSound(), which is DOM-free and covered by selfTest.  With no
     AudioContext (headless, or a locked-down page) the checkbox still
     toggles, the numbers are still computed, and nothing else changes. */
  const haveAudio=(typeof window!=='undefined')&&
                  !!(window.AudioContext||window.webkitAudioContext);
  let actx=null, voices=[], lastSnd=null;
  function audioCtx(){
    if(!haveAudio) return null;
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    return actx;
  }
  function soundable(){ return !(S.model().open||st.view==='field'||st.view==='droplet'); }
  function soundOpt(){
    const single=(st.view==='modes'||st.view==='separate')?selMode(S.model()):null;
    return {pickup:st.pickup,theta:st.listenDeg*DEG,micR:st.micR,single:single};
  }
  function playSound(){
    if(!st.hear||!soundable()) return;
    const ac=audioCtx();
    if(!ac) return;
    if(ac.state==='suspended'&&ac.resume) ac.resume();
    const M=S.model(), opt=soundOpt();
    const snd=renderSound(M,opt,ac.sampleRate,ringTime(M,opt.single));
    lastSnd=snd;
    if(!(snd.peak>0)) return;
    /* the loudness that reaches the speaker is normalised: a 2 Pa peak at
       1 m (100 dB SPL) or a 3 m/s head plays at the volume set, quieter
       strikes in proportion, and nothing ever clips */
    const ref=(opt.pickup==='head')?3.0:2.0;
    const g=st.volume*Math.min(1,snd.peak/ref)/snd.peak;
    const buf=ac.createBuffer(1,snd.n,ac.sampleRate);
    const ch=buf.getChannelData(0);
    for(let k=0;k<snd.n;k++) ch[k]=snd.y[k]*g;
    const src=ac.createBufferSource();
    src.buffer=buf; src.connect(ac.destination); src.start();
    src.onended=()=>{ const k=voices.indexOf(src); if(k>=0) voices.splice(k,1); };
    voices.push(src);           /* strikes overlap, as they do on a real drum */
  }
  function stopSound(){ for(const v of voices){ try{ v.stop(); }catch(e){} } voices=[]; }

  const gSnd=h('div',{class:'grp'},h('h3',null,'the sound'));
  const hearLab=checkbox('hear','hear it');
  gSnd.appendChild(h('div',{class:'checks'},hearLab));
  const hearInp=hearLab.querySelector('input');
  if(hearInp) hearInp.addEventListener('change',()=>{ if(st.hear) playSound(); else stopSound(); });
  gSnd.appendChild(chipRow([{id:'air',name:'in the air'},{id:'head',name:'on the head'}],
                           'pickup',null,true));
  gSnd.appendChild(slider('listenDeg','off the axis',0,90,1,v=>fmt(v,0)+'&deg;'));
  gSnd.appendChild(slider('micR','mic at r/a',0,0.95,0.005,v=>fmt(v,3)));
  gSnd.appendChild(slider('volume','volume',0,1,0.01,v=>fmt(100*v,0)+' %'));
  const sndBtn=h('button',{onclick:()=>{ st.t=0; playSound(); dirty=true; refresh(); }},'strike it');
  gSnd.appendChild(h('div',{class:'btnrow'},sndBtn));
  const sndTag=h('div',{class:'tag'}); gSnd.appendChild(sndTag);
  const sndSrc=h('div',{class:'src'}); gSnd.appendChild(sndSrc);

  const gDrop=h('div',{class:'grp'},h('h3',null,'the droplet'));
  gDrop.appendChild(slider('dropR','drop radius',0.6,12,0.1,v=>fmt(v,1)+' mm'));
  gDrop.appendChild(slider('depth','water depth',1,300,1,v=>fmt(v,0)+' mm'));
  const dropTag=h('div',{class:'src'}); gDrop.appendChild(dropTag);

  const gMode=h('div',{class:'grp'},h('h3',null,'pick a mode'));
  gMode.appendChild(slider('mSel','m  diameters',0,9,1,v=>fmt(v,0)));
  gMode.appendChild(slider('nSel','n  radial',1,8,1,v=>fmt(v,0)));
  const modeTag=h('div',{class:'tag'}); gMode.appendChild(modeTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'display'));
  const dchecks=h('div',{class:'checks'},
    checkbox('showRim','the rim'),
    checkbox('showGrid','radius rings'),
    checkbox('showMarker','the strike point'),
    checkbox('showCone','the wavefront r = ct'),
    checkbox('wire','wireframe'),
    checkbox('exagAuto','auto vertical scale'),
    checkbox('airLoad','air loading (a model)'));
  gShow.appendChild(dchecks);
  gShow.appendChild(slider('exag','exaggeration',5,2000,5,v=>'&times;'+fmt(v,0)));
  gShow.appendChild(slider('ffRadius','how far out',1.2,6,0.1,v=>fmt(v,1)+' a'));
  gShow.appendChild(chipRow(QUAL,'quality'));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.lookDown(); dirty=true; refresh(); }},'look down'),
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view')));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ st.t=0; playSound(); dirty=true; refresh(); }},'re-strike'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); stopSound(); S.rebuild(); S.resetView();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const showTag=h('div',{class:'src'}); gShow.appendChild(showTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
                h('div',{id:'info'}));
  [gPre,gBC,gHit,gTime,gSnd,gDrop,gMode,gShow,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    [[gPre,PRESETS,'preset'],[gBC,BCS,'bc'],
     [gHit,[{id:'struck'},{id:'pressed'}],'strike'],[gShow,QUAL,'quality'],
     [gSnd,[{id:'air'},{id:'head'}],'pickup']]
      .forEach(([g,list,key])=>{
        const cw=g.querySelector('.chips'); if(!cw) return;
        [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      });
  }
  function syncPanel(){
    const v=st.view, M=S.model();
    gPre.hidden  = (v==='droplet');
    gBC.hidden   = (v==='field'||v==='droplet');
    gHit.hidden  = (v==='separate'||v==='spectrum'||v==='droplet');
    gTime.hidden = (v==='separate'||v==='spectrum'||v==='modes');
    gDrop.hidden = (v!=='droplet');
    gMode.hidden = !(v==='separate'||v==='modes');
    gSnd.hidden  = (v==='field'||v==='droplet');
    rows.listenDeg.row.hidden = (st.pickup==='head');
    rows.micR.row.hidden      = (st.pickup!=='head');
    radRow.hidden = !st.damp;
    sndBtn.textContent = (v==='modes'||v==='separate')?'sound this mode':'strike it';
    rows.tau.row.hidden    = (st.strike!=='struck');
    rows.logB.row.hidden   = (st.bc!=='springy'||v==='field'||v==='droplet');
    rows.exag.row.hidden   = (st.exagAuto||v!=='strike');
    rows.ffRadius.row.hidden = !(v==='field'||(v==='strike'&&st.bc==='open'));
    rows.speed.row.hidden  = !st.anim;
    rows.t60.row.hidden    = !st.damp;
    rows.lossP.row.hidden  = !st.damp;
    rows.t.row.hidden      = false;
    /* the time slider is in SECONDS of drum time and its range must follow the
       drum, or a 300 Hz snare and a 2 s puddle cannot share one control */
    const span=timeSpan(M);
    const inp=rows.t.row.querySelector('input');
    inp.max=span; inp.step=span/2000;
    if(st.t>span) st.t=span;
    for(const k in rows) rows[k].sync();
    [].forEach.call(dchecks.querySelectorAll('input'),(inp2,i)=>{
      inp2.checked=st[['showRim','showGrid','showMarker','showCone','wire',
                       'exagAuto','airLoad'][i]]; });
    const tchecks=gTime.querySelector('.checks');
    if(tchecks) [].forEach.call(tchecks.querySelectorAll('input'),(inp2,i)=>{
      inp2.checked=st[['anim','damp','spin','realtime'][i]]; });
    const rinp=radRow.querySelector('input'); if(rinp) rinp.checked=st.radLoss;
    if(hearInp) hearInp.checked=st.hear;
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = (st.view==='strike')
        ? 'drag to orbit · scroll to zoom · space runs it · t real time · h hear it · 1-6 switch views'
        : st.view==='field'
        ? 'move the time slider and watch what is left BEHIND the front'
        : st.view==='droplet'
        ? 'shrink the drop until the ripples are capillary and watch the order reverse'
        : st.view==='separate'
        ? 'change the rim and watch which zeros the magenta line snaps to'
        : st.view==='modes'
        ? 'move the strike and watch which modes stop being excited'
        : 'switch air loading on and watch the family move toward equal spacing';
      subEl.innerHTML = (st.view==='droplet')
        ? 'the same solver &mdash; only &omega;(k) changed'
        : (st.bc==='open'
          ? 'no rim: the sum over n has become an integral over k, and nothing comes back'
          : 'one PDE, three ODEs, and a rim that decides which frequencies exist');
      preTag.innerHTML=presetById(st.preset).src;
      bcTag.innerHTML=bcById(st.bc).blurb
        +(st.bc==='springy'?'<br>B = <b>'+sigf(M.B,4)+'</b>':'');
      hitTag.innerHTML='captured <b'+(M.CO.captured>0.97?' class="g"':' class="r"')+'>'
        +fmt(100*M.CO.captured,1)+'%</b> of the strike energy in '
        +M.spec.length+' modes<br>peak <b>'+fmtLen(peakOf(M,st.t))+'</b>'
        +(M.tau>0?'<br>a '+fmt(M.tau*1e3,1)+' ms half-sine push: partials above '
          +fmtHz(1/(2*M.tau))+' are softened':'<br>an instantaneous push: the textbook strike');
      timeTag.innerHTML='f&#8321; = <b>'+fmtHz(M.spec.find(z=>z.f>1e-9).f)+'</b>'
        +' &nbsp; period <b>'+sigf(1000/M.spec.find(z=>z.f>1e-9).f,3)+' ms</b>'
        +'<br>clock: '+(st.realtime?'<b class="g">real time</b>':'<b>1/400</b> of real time')
        +(M.damp?' &nbsp; rings <b>'+sigf(ringTime(M),3)+' s</b> to &minus;60 dB':'')
        +(M.damp&&M.alphaRad?radTagHTML(M):'');
      /* the sound: what the listener gets, from a 40 ms render (the peak of a
         strike sits inside the first few milliseconds) */
      if(!soundable()){
        sndTag.innerHTML='no rim, no notes: the strike leaves as one pulse and nothing '
          +'rings, so there is no note to render';
        sndSrc.innerHTML='';
      }else{
        const opt=soundOpt(), air=(opt.pickup!=='head');
        const q=renderSound(M,opt,48000,0.04);
        let s3=(opt.single?'('+opt.single.m+','+opt.single.n+') alone, 1 mm peak,':'the strike')
          +(air?' heard <b>1 m</b> away, <b>'+fmt(st.listenDeg,0)+'&deg;</b> off the axis'
               :' under a contact mic at r/a = <b>'+fmt(st.micR,3)+'</b>')+'<br>';
        s3+=air?'peak <b>'+sigf(q.peak,3)+' Pa</b> = <b>'
                +fmt(20*Math.log10(Math.max(q.peak,1e-12)/2e-5),0)+' dB</b> SPL'
               :'peak <b>'+sigf(q.peak,3)+' m/s</b>';
        s3+=' &nbsp; '+q.used+' mode'+(q.used===1?'':'s')
          +(q.dropped?' <span class="r">(+'+q.dropped+' above the audio band, dropped)</span>':'');
        if(air&&st.listenDeg===0)
          s3+='<br><span class="r">straight above the drum only m = 0 is heard</span>';
        if(lastSnd) s3+='<br>last strike rendered: '+sigf(lastSnd.n/lastSnd.fs,3)+' s, '
          +lastSnd.used+' modes';
        sndTag.innerHTML=s3;
        sndSrc.innerHTML=(air
          ? 'the far field of a head set in an infinite baffle (Rayleigh), in the plane of '
            +'the strike; a kettle or a closed shell is roughly that, a bare hoop is not'
          : 'the membrane velocity at one point, as a piezo pickup reports it')
          +(haveAudio?'':' &mdash; <span class="r">no AudioContext in this browser</span>, '
            +'so the numbers are all you get');
      }
      dropTag.innerHTML='c<sub>min</sub> = '+fmt(M.cMin*100,2)+' cm/s at '
        +fmt(M.lamMin*1e3,2)+' mm &mdash; both derived from &sigma; and &rho;';
      const z=selMode(M);
      modeTag.innerHTML='('+z.m+','+z.n+') &nbsp; ka = <b>'+fmt(z.x,6)+'</b>'
        +' &nbsp; f = <b>'+fmtHz(z.f)+'</b><br>'+z.m+' diameter'+(z.m===1?'':'s')+', '
        +(z.n-1)+' interior circle'+(z.n===2?'':'s');
      showTag.innerHTML=(st.view==='strike')
        ? 'the vertical exaggeration is printed on the canvas &mdash; a head moves '
          +'less than a millimetre'
        : 'quality sets how many modes are kept: '+(M.M+1)+'&times;'+M.N;
      infoEl.innerHTML=INFO[st.view]||INFO.strike;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it. (Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='d'){ S.lookDown(); dirty=true; refresh(); }
    else if(e.key==='0'){ st.t=0; playSound(); dirty=true; refresh(); }
    else if(e.key==='t'){ st.realtime=!st.realtime; S.rebuild(); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='h'){ st.hear=!st.hear; if(st.hear) playSound(); else stopSound();
      syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ switchView(TABS[+e.key-1][0]); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(S.wrapped){ S.wrapped=false; if(st.anim) playSound(); }
    if(st.anim||st.spin||dirty){
      dirty=false;
      if(st.anim) rows.t.sync();
      try{ S.draw(); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

const INFO={
  strike:'The surface <b>is</b> the solution — a sum over modes, each a Bessel '
    +'function in radius times a cosine in angle times a sine in time. Watch the '
    +'rim. With a <b>clamped</b> edge the pulse runs out, reflects, comes back, and '
    +'meets itself: that interference is the entire content of the word '
    +'<i>resonance</i>. Switch the rim to <b>open</b> and the reflection never '
    +'happens — the wave leaves and the head goes quiet, slowly. The strip along '
    +'the bottom is the strike point against time, which is what you would actually '
    +'hear. The vertical is exaggerated by the factor printed on the canvas; a real '
    +'head moves a fraction of a millimetre. Switch on <b>hear it</b> and the same sum '
    +'is rendered as sound: in the air it is the pressure a baffled head radiates, so '
    +'straight above the drum only the m = 0 modes are heard and the (1,1) note needs '
    +'you off the axis; on the head it is the velocity under a contact mic. '
    +'<b>Real time</b> runs the clock at 1× so the head goes still in its own T₆₀, '
    +'with the sound in step. <b>Radiation loss</b> adds the decay that same far '
    +'field implies — derived, and it is the kettledrum’s thump-then-note.',
  field:'Take the rim away and the mode sum has nothing to sum over — the spectrum '
    +'becomes continuous and the Fourier–Bessel series becomes a <b>Hankel '
    +'transform</b>. It is the same expansion with an integral where the sum was. '
    +'The surprise is on the right: in two dimensions the wave does not pass '
    +'cleanly. Everything inside the light cone stays disturbed, decaying only as '
    +'1/t. That is a <b>wake</b>, and it is why <b>Huygens’ principle</b> in its '
    +'sharp form is an odd-dimensional accident. A bang is a bang in three '
    +'dimensions and a long fading smear in two. Strictly, the 3-D response is '
    +'<i>identically</i> zero after the sphere passes only for a source of compact '
    +'support; this mallet is a Gaussian, so it dies as exp(−(ct)²/2s²) instead — '
    +'fifteen orders below the 2-D wake by the time the front is ten mallet-widths '
    +'out, which is the same statement for any purpose but the pedantic one.',
  droplet:'Exactly the same solver as <b>free field</b>, with one line changed: '
    +'ω = ck becomes ω² = (gk + σk³/ρ)tanh kh. That single substitution is the '
    +'difference between a drum and a puddle. On the drum every wavelength travels '
    +'at c and the pulse keeps its shape. On water each travels at its own speed, '
    +'so the disturbance <b>sorts itself out</b> into a spreading train — short '
    +'capillary ripples racing ahead, long gravity waves behind. And because the '
    +'group speed has a minimum, there is an expanding circle inside which the '
    +'water is perfectly flat.',
  separate:'This is the whole method on one screen. The wave equation is a '
    +'<b>partial</b> differential equation; assuming the solution is a product of '
    +'one-variable functions turns it into three <b>ordinary</b> ones, each of which '
    +'you can solve. Two are harmonic oscillators. The third is Bessel’s equation, '
    +'and its solution is drawn on the right. Notice what the ODEs do <i>not</i> '
    +'contain: the size of the drum. k is free, and every k solves them. The rim is '
    +'the only thing that selects — which zeros it selects is exactly what the '
    +'boundary condition means.',
  modes:'Each panel is one solution of the separated problem, drawn as its sign: '
    +'green up, cyan down, black where it never moves. <b>m</b> counts nodal '
    +'diameters and <b>n−1</b> nodal circles inside the rim. The bars below say how '
    +'much of the current strike went into each — and that is the practical point. '
    +'A mode with a node under the mallet gets nothing at all, which is why hitting '
    +'a timpano a third of the way in sounds like a note and hitting it dead centre '
    +'sounds like a thud: the centre strike can only excite the m = 0 family.',
  spectrum:'A string’s partials are 1, 2, 3, 4 — integers, because its modes are '
    +'zeros of a sine. A membrane’s are ratios of <b>Bessel zeros</b>, and they are '
    +'not commensurate with anything: 1, 1.593, 2.136, 2.295. Nothing lands near a '
    +'harmonic, which is why an ideal drum has a thud rather than a pitch. Below, '
    +'<b>Weyl’s law</b>: the number of modes below a given frequency depends on the '
    +'area and the perimeter and almost nothing else. That near-blindness to shape '
    +'is what makes Kac’s question — <i>can one hear the shape of a drum?</i> — '
    +'worth asking, and the answer, found in 1992, is no.'};
