<title>Drum head — the wave equation on a disc, with and without a rim</title>
<!--
  ===================================================================
  DRUM HEAD
  the two-dimensional wave equation: struck, radiating, and resonant
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, shock_flow.html,
  wind_tunnel.html, pulsar.html and diffraction.html: one flat file, no build
  step, no network, works opened straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS SOLVES
  ------------------------------------------------------------------
  One PDE — the transverse wave equation on a membrane of areal density
  sigma under uniform tension T,

      sigma u_tt = T ( u_rr + u_r / r + u_thth / r^2 ),   c = sqrt(T/sigma)

  and the whole file is about what separating it does.  Writing
  u = R(r) Th(th) Ti(t) turns that one partial differential equation into
  three ORDINARY ones,

      Ti'' + w^2 Ti = 0                           harmonic
      Th'' + m^2 Th = 0,  m integer               harmonic, periodic in 2 pi
      r^2 R'' + r R' + (k^2 r^2 - m^2) R = 0      BESSEL

  with w = c k.  Regularity at the centre discards Y_m and leaves
  R = J_m(k r).  Nothing so far has mentioned the edge, and that is the
  point: the PDE does not know how big the drum is.  The RIM is what
  quantises k, and this file lets you change which rim you have:

      clamped   Dirichlet   J_m(ka) = 0            k = j(m,n) / a
      free      Neumann     J_m'(ka) = 0           k = j'(m,n) / a
      springy   Robin       ka J_m'(ka) + B J_m(ka) = 0,  B = kappa a / T
      open      radiating   NOT quantised — the sum over n becomes an
                            integral over k, and the wave leaves and does
                            not come back

  "Open" is the same expansion with a continuous spectrum: the Fourier-Bessel
  SERIES becomes the Hankel TRANSFORM.  That is the honest way to draw a wave
  going off to infinity, and it is why "free field" and "the strike" are the
  same solver with the sum replaced by a quadrature.

  ------------------------------------------------------------------
  WHAT IS EXACT, WHAT IS MODELLED, WHAT IS NOT MODELLED
  ------------------------------------------------------------------
  EXACT, and asserted in selfTest against values computed OUTSIDE this file
  (scipy 1.18 / numpy 2.5, run separately; every such assertion is labelled
  (scipy) and has a routine behind it that produced it):

    j(0,1) = 2.404825557695773      the fundamental of a clamped disc
    j(1,1) = 3.831705970207512      and the note a kettledrum actually plays
    the eigenvalue tables j(m,n) and j'(m,n) to 5.7e-14 for m<=20, n<=20
    the Robin roots between them to 3.6e-15, monotone in B
    J_m(x) to 1.2e-14 over 98000 points, m <= 32, x in [0.02, 140]
    e^-z I_m(z) to 1.1e-16 for z <= 361, which is what the strike needs
    the strike coefficients C_mn to 1e-14 against the closed-form projection
    the free-field solution to 3.4e-10 against a 200000-point Hankel integral
    ...and, by a COMPLETELY independent route, to 5e-11 against Poisson's
    formula in two dimensions, whose constant is pinned by the exact case
    g == 1 (for which u == t)
    the 2-D wake u(0,t) -> s^2 / (c^2 t), confirmed to 4e-5 at ct/s = 160

  MEASURED, and cited: the material constants only.  Water at 20 C,
  sigma = 0.0728 N/m and rho = 998.2071 kg/m^3, from which the phase-speed
  minimum 23.127 cm/s at 17.13 mm is DERIVED rather than quoted; air at
  20 C and 101.325 kPa, rho = 1.204 kg/m^3; BoPET (Mylar) 1390 kg/m^3 and
  drum-head gauges in mils.  The head TENSION is not measured — it is solved
  from the pitch you ask for, and the file says so.

  MODELLED, and labelled as such on the canvas:
    - the decay.  A two-parameter loss: the fundamental's 60 dB time is set
      directly and the overtones lose energy as (f/f1)^p.  Real heads lose
      it to the air, the shell and the bearing edge in different proportions
      at different frequencies.  Nothing here is fitted to a drum.
    - the air loading in "the spectrum".  The incompressible added mass
      rho_air/k for a mode of wavenumber k is derived, not fitted, and it
      moves the kettledrum family the right way but does NOT reach the
      nearly-harmonic 1:1.5:2:2.5 a real kettle produces.  Saying that is
      the honest outcome; a fitted parameter would not have been.
    - the SOUND (added 2026-09-15).  "Hear it" renders the same mode sum at
      the audio rate, two ways.  "In the air" is the far-field pressure of
      the head set in an infinite rigid baffle (Rayleigh's integral): each
      mode reaches the listener with the gain 2 pi i^m cos(m phi) a^2
      LAMBDA_m(x, k0 a sin theta) times its acceleration, where
      LAMBDA_m(x,y) = int_0^1 J_m(x r) J_m(y r) r dr is Lommel's integral
      in closed form and k0 = omega / c_air.  It is evaluated 1 m away at
      the angle you choose, in the plane of the strike.  Straight above
      the drum only the m = 0 modes are heard at all; the (1,n) family
      needs you off the axis.  A kettle or a closed shell is roughly a
      baffle; a bare hoop is not, and would radiate its m = 0 modes far
      more weakly.  "On the head" is the velocity under a contact
      microphone.  The pressure at 1 m is printed in pascals and dB SPL;
      the loudness sent to the speaker is normalised, and only the impact
      speed scales it.  Every piece is asserted in selfTest: LAMBDA against
      scipy quadrature of the integrand, the far field against a brute-
      force two-dimensional Rayleigh integral (phase included), the render
      against a direct evaluation of the same sum.
    - the RADIATION LOSS, off by default.  Integrating that same far field
      over the hemisphere gives each mode's radiated power, and P / 2E is a
      decay rate that is DERIVED, not fitted:
          alpha = rho_air w^2 a^2 I / (2 c_air sigma LAMBDA_m(x,x)),
          I = int_0^pi/2 LAMBDA_m(x, k0 a sin theta)^2 sin theta dtheta.
      For the 26" timpani it takes (0,1) to -60 dB in 0.085 s and (1,1) in
      0.67 s (scipy-checked): the kettledrum's thump, then its note, from
      one line.  But the air's added mass is not in E, and a kettle is not
      an infinite baffle, so the rates are indicative and the switch is a
      switch — with it on, the T60 slider sets only the intrinsic part.
    - REAL TIME.  The clock normally runs at 1/400 (the head) or 1/2 (the
      puddle) so the motion is watchable.  The toggle runs it at 1x: the
      picture becomes a strobe of whichever phase each frame lands on, but
      the decay is the real one and the sound plays in step with it.

  NOT MODELLED at all: bending stiffness (a real head is a membrane plus a
  small plate term, which lifts the highest partials), the kettle cavity as
  a resonator, the back of the head (the sound model's baffle is one-sided
  by construction), the snares, large-amplitude tension modulation, and any
  in-plane motion.  For water: viscosity, finite amplitude, and the crater
  and jet a real drop makes — the initial shape here is a Gaussian, and the
  interesting physics on show is the DISPERSION, not the splash.

  ------------------------------------------------------------------
  SPECIAL FUNCTIONS
  ------------------------------------------------------------------
  J_m(x): ascending series below x = 8, Hankel asymptotic (A&S 9.2.5 /
  9.2.9 / 9.2.10, five terms of P and four of Q) above x = 45 when
  x >= 3.2 m^2, and Miller downward recurrence everywhere else.  Both
  thresholds were MEASURED against scipy on a dense grid, not guessed: the
  series holds 1e-15 to x = 6 and decays to 4e-14 by x = 10 as its own
  cancellation eats the mantissa, and at x = 30 its largest term is 1.1e11
  against a result of -0.086, which is twelve digits of cancellation.

  e^-z I_m(z): the same downward recurrence, normalised by
  e^z = I_0 + 2(I_1 + I_2 + ...).  It is computed SCALED and never as
  exp(...) * I_m(...), because at the default mallet z reaches 340, where
  I_0 is 1e146 and the Gaussian prefactor that cancels it is 1e-146.

  Zeros: McMahon (A&S 9.5.12) then Newton for j(m,n).  For j'(m,n) there is
  no second asymptotic series — Rolle puts exactly one zero of J_m' between
  consecutive zeros of J_m, so bisection inside a bracket already in hand
  is both safe and enough.  Note j'(0,1) = 0, the rigid vertical
  translation of a membrane with a free rim; scipy's jnp_zeros omits that
  root, and leaving it out inverts the m = 0 bracket and breaks the Robin
  solver, which is exactly what happened while this was being built.

  ------------------------------------------------------------------
  WHY THE STRIKE IS A CLOSED FORM
  ------------------------------------------------------------------
  A mallet contact of width s at radius r0 projects onto the modes through
  an integral whose ANGULAR half is exact:

      int_0^2pi exp(z cos th) cos(m th) dth = 2 pi I_m(z)

  so a two-dimensional projection collapses to one radial quadrature per
  mode, and the modified Bessel function turns up as the angular content of
  a Gaussian.  selfTest re-does the same integral by brute-force
  two-dimensional midpoint rule and asserts the two agree.

  A truncated mode set cannot reproduce a narrow mallet, and the file does
  not pretend otherwise: the fraction of the strike energy the modes
  actually captured is computed and displayed, and it falls to 70% for a
  small mallet near the rim.  The DISPLACEMENT converges far faster than
  that number suggests, because the 1/w weight in sin(w t)/w suppresses
  exactly the modes the truncation is missing — measured at 0.11% for
  20x20 against a 44x44 reference, against 0.1% of the strike energy.

  The strike also has a CONTACT TIME (added 2026-09-15 with the sound).
  An instantaneous velocity is fine for the displacement, but the pressure
  a listener hears is the head's acceleration, and with an instantaneous
  strike that is set by nothing but the mallet's width.  So the mallet's
  force is a half-sine over a time tau carrying the same impulse: during
  contact each mode is driven, and afterwards it rings as the impulsive
  answer delayed by tau/2 and filtered by S = cos(w tau/2)/(1 - (w tau/pi)^2),
  which is what makes a felt mallet round and a stick sharp.  Both phases
  are closed forms (timeFactorPulse), checked against direct numerical
  convolution, and tau = 0 is the old impulsive strike exactly.  The
  presets carry 2.5 ms (felt), 0.5 ms (a stick on a snare), 1.0 ms (a tom)
  and 0 (the ideal membrane).

  ------------------------------------------------------------------
  CAMERA / RENDERING
  ------------------------------------------------------------------
  Hand-rolled z-up orbit camera and perspective projection, painter's
  algorithm, canvas 2-D — identical to lattice.html, steam_carnot_cycle.html
  and diffraction.html.  Mathematica NeonColors for scalar ramps.

  A drum head moves by a fraction of a millimetre on a third of a metre of
  radius, so the vertical is exaggerated by a factor of order a hundred.
  That factor is PRINTED on the canvas, never hidden, and so is the real
  peak displacement in millimetres.
-->

  <h1>Drum head</h1>
  <span class="sub" id="sub">one PDE, three ODEs, and a rim that decides which frequencies exist</span>
  <nav id="tabs"></nav>

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  special functions                                                  *
 *                                                                     *
 *  Everything here is hand-rolled because the file loads nothing, and *
 *  everything here is asserted in selfTest against values computed     *
 *  OUTSIDE it (scipy 1.18 / numpy 2.5).                                *
 *                                                                     *
 *  J_m(x) has three regimes and the interesting failures are always    *
 *  at the joins, so selfTest checks each regime against scipy AND      *
 *  checks that neighbouring regimes agree where both are valid:        *
 *                                                                     *
 *    ascending series   x small against the order — every term the     *
 *                       same sign until k ~ x/2, so no cancellation    *
 *    Hankel asymptotic  x large against m^2 (A&S 9.2.5/9.2.9/9.2.10)   *
 *    Miller recurrence  everywhere else — downward recursion from an   *
 *                       order well above both m and x, normalised by   *
 *                       J_0 + 2(J_2 + J_4 + ...) = 1.                  *
 *                                                                     *
 *  The series is NOT usable as the general method: at x = 30 its       *
 *  largest term is 1.1e11 against a result of -0.086, which is twelve  *
 *  digits of cancellation out of the sixteen a double has.             *
 * ================================================================== */
function besselSeries(m,x){
  let t=1;
  for(let i=1;i<=m;i++){ t*=(x/2)/i; if(t===0) return 0; }
  const q=-x*x/4;
  let sum=t, term=t;
  for(let k=1;k<400;k++){
    term*=q/(k*(m+k));
    sum+=term;
    if(Math.abs(term)<=1e-19*Math.abs(sum)) break;
  }
  return sum;
}
function besselAsym(m,x){
  const mu=4*m*m, z=8*x, z2=z*z;
  const a1=mu-1, a3=mu-9, a5=mu-25, a7=mu-49, a9=mu-81, a11=mu-121,
        a13=mu-169, a15=mu-225;
  const P=1 - a1*a3/(2*z2) + a1*a3*a5*a7/(24*z2*z2)
            - a1*a3*a5*a7*a9*a11/(720*z2*z2*z2)
            + a1*a3*a5*a7*a9*a11*a13*a15/(40320*z2*z2*z2*z2);
  const Q=a1/z - a1*a3*a5/(6*z*z2) + a1*a3*a5*a7*a9/(120*z*z2*z2)
            - a1*a3*a5*a7*a9*a11*a13/(5040*z*z2*z2*z2);
  const chi=x-(m/2+0.25)*PI;
  return Math.sqrt(2/(PI*x))*(P*Math.cos(chi)-Q*Math.sin(chi));
}
/* Miller: recur DOWNWARD from a start order well above both m and x, which
   is the direction in which J is the growing solution and therefore the
   stable one, then fix the scale with the Neumann sum.  The start order is
   deliberately generous — the cost is linear and the accuracy is not. */
function besselMiller(m,x){
  const top=Math.max(m,Math.ceil(x));
  let N=2*Math.ceil((top+30+8*Math.sqrt(top))/2);
  const tox=2/x;
  let bj=1e-260, bjp=0, ans=0, sum=0, even=false;
  for(let j=N;j>0;j--){
    const bjm=j*tox*bj-bjp;
    bjp=bj; bj=bjm;
    if(Math.abs(bj)>1e250){ bj*=1e-250; bjp*=1e-250; ans*=1e-250; sum*=1e-250; }
    if(even) sum+=bj;
    even=!even;
    if(j===m) ans=bjp;
  }
  sum=2*sum-bj;
  if(m===0) ans=bj;
  return ans/sum;
}
/* Bessel function of the first kind, integer order m >= 0.
   The two thresholds were MEASURED against scipy over a 31200-point grid,
   not guessed.  The series holds ~1e-15 to x=6 and decays to 4e-14 by x=10
   as its own cancellation eats the mantissa, so it hands over at 8; the
   asymptotic reaches 1e-14 by x=45 for m<=3 and needs x >= 3.2 m^2 beyond
   that.  Miller covers the whole middle at 7e-16 and is the fallback. */
function besselJ(m,x){
  m=m|0;
  if(m<0) throw new Error('besselJ: negative order '+m);
  if(x<0) return (m&1)?-besselJ(m,-x):besselJ(m,-x);
  if(x===0) return m===0?1:0;
  if(x<8) return besselSeries(m,x);
  if(x>=45&&x>=3.2*m*m) return besselAsym(m,x);
  return besselMiller(m,x);
}
/* J_m'(x).  J_0' = -J_1; otherwise the standard (J_{m-1} - J_{m+1})/2. */
function besselJp(m,x){
  m=m|0;
  if(m===0) return -besselJ(1,x);
  return 0.5*(besselJ(m-1,x)-besselJ(m+1,x));
}

/* ------------------------------------------------------------------ *
 *  zeros                                                              *
 *                                                                     *
 *  DIRICHLET  j(m,n): McMahon (A&S 9.5.12) then Newton.  The McMahon   *
 *    guess was checked in python to land strictly between the          *
 *    neighbouring zeros for every m<=10, n<=12, so Newton cannot walk  *
 *    to the wrong root; its worst error there is 0.088, at (10,1).     *
 *  NEUMANN j'(m,n): NOT a second asymptotic series.  By Rolle there is *
 *    exactly one zero of J_m' between consecutive zeros of J_m, so it  *
 *    is found by bisection inside a bracket already in hand.  Note     *
 *    that j'(0,1) = 0 — the rigid vertical translation of a free       *
 *    membrane.  scipy's jnp_zeros OMITS that root, and leaving it out  *
 *    inverts the m=0 bracket.                                          *
 *  ROBIN x J_m'(x) + B J_m(x) = 0: bracketed by [j'(m,n), j(m,n)],     *
 *    monotone in B, so plain bisection is both safe and enough.        *
 * ------------------------------------------------------------------ */
function mcMahon(m,n){
  const b=(n+m/2-0.25)*PI, mu=4*m*m, b8=8*b;
  return b - (mu-1)/b8
           - 4*(mu-1)*(7*mu-31)/(3*b8*b8*b8)
           - 32*(mu-1)*(83*mu*mu-982*mu+3779)/(15*b8*b8*b8*b8*b8)
           - 64*(mu-1)*(6949*mu*mu*mu-153855*mu*mu+1585743*mu-6277237)
             /(105*b8*b8*b8*b8*b8*b8*b8);
}
function besselZero(m,n){
  let x=mcMahon(m,n);
  for(let i=0;i<60;i++){
    const f=besselJ(m,x), d=besselJp(m,x);
    if(d===0) break;
    const dx=f/d;
    x-=dx;
    if(Math.abs(dx)<=1e-15*Math.abs(x)) break;
  }
  return x;
}
/* bisection on f inside [lo,hi]; the bracket is guaranteed by construction
   so this cannot fail to converge, and 200 halvings is machine precision. */
function bisect(f,lo,hi){
  let flo=f(lo);
  if(flo===0) return lo;
  for(let i=0;i<200;i++){
    const mid=0.5*(lo+hi);
    if(mid<=lo||mid>=hi) break;
    const fm=f(mid);
    if(fm===0) return mid;
    if((fm<0)===(flo<0)){ lo=mid; flo=fm; } else hi=mid;
  }
  return 0.5*(lo+hi);
}
function besselPrimeZero(m,n,dz){
  if(m===0&&n===1) return 0;
  const lo=(n>1)?dz[n-2]:0, hi=dz[n-1];
  return bisect(x=>besselJp(m,x),lo+1e-12,hi);
}
function robinRoot(m,n,B,dz,nz){
  if(!(B>0)) return nz[n-1];
  if(!isFinite(B)||B>1e12) return dz[n-1];
  const lo=Math.max(nz[n-1],1e-12), hi=dz[n-1];
  return bisect(x=>x*besselJp(m,x)+B*besselJ(m,x),lo,hi);
}

/* ------------------------------------------------------------------ *
 *  Gauss-Legendre nodes, computed rather than tabulated                *
 *  (Newton on P_n; selfTest asserts them against numpy's leggauss)     *
 * ------------------------------------------------------------------ */
function gaussLegendre(n){
  const x=new Float64Array(n), w=new Float64Array(n), half=(n+1)>>1;
  for(let i=0;i<half;i++){
    let z=Math.cos(PI*(i+0.75)/(n+0.5)), pp=0;
    for(let it=0;it<100;it++){
      let p1=1,p2=0;
      for(let j=0;j<n;j++){ const p3=p2; p2=p1; p1=((2*j+1)*z*p2-j*p3)/(j+1); }
      pp=n*(z*p1-p2)/(z*z-1);
      const z1=z; z=z1-p1/pp;
      if(Math.abs(z-z1)<=1e-16) break;
    }
    x[i]=-z; x[n-1-i]=z;
    w[i]=2/((1-z*z)*pp*pp); w[n-1-i]=w[i];
  }
  return {x:x,w:w};
}
/* ================================================================== *
 *  the membrane                                                       *
 *                                                                     *
 *      sigma u_tt = T ( u_rr + u_r / r + u_thth / r^2 )               *
 *                                                                     *
 *  separating u = R(r) Th(th) Ti(t) turns that one PDE into three     *
 *  ODEs, which is the whole point of the "separation" view:           *
 *                                                                     *
 *      Ti'' + w^2 Ti = 0                        harmonic              *
 *      Th'' + m^2 Th = 0   m integer            harmonic + periodic   *
 *      r^2 R'' + r R' + (k^2 r^2 - m^2) R = 0   BESSEL                *
 *                                                                     *
 *  with w = c k and c = sqrt(T/sigma).  Regularity at r = 0 kills Y_m *
 *  and leaves R = J_m(kr); the RIM then quantises k, and which        *
 *  boundary condition is imposed decides how:                         *
 *                                                                     *
 *      clamped (Dirichlet)   J_m(ka) = 0            k = j(m,n)/a      *
 *      free    (Neumann)     J_m'(ka) = 0           k = j'(m,n)/a     *
 *      springy (Robin)       ka J_m'(ka) + B J_m(ka) = 0              *
 *      open    (radiating)   no quantisation at all — the sum over n  *
 *                            becomes an INTEGRAL over k, which is the *
 *                            Hankel transform used in "free field".   *
 *                                                                     *
 *  B = kappa a / T is the rim stiffness in units of the tension, so   *
 *  B = 0 is Neumann and B -> inf is Dirichlet, continuously.          *
 * ================================================================== */
const RHO_AIR=1.204, C_AIR=343.0;      /* 20 C, 101.325 kPa */
const G_ACC=9.80665;
const WATER_SIGMA=0.0728, WATER_RHO=998.2071;   /* 20 C, clean water/air */
const MYLAR_RHO=1390.0;                /* BoPET */

const NRD=60;      /* display radial samples on 0..a          */
const NTHD=64;     /* display angular samples                  */
const NQP=32;      /* projection: composite Gauss-Legendre panels */
const NFR=96;      /* free-field radial samples                */
const NFP=48;      /* free-field k panels                      */

/* ------------------------------------------------------------------ *
 *  e^-z I_m(z) for m = 0..M in ONE downward pass.                     *
 *                                                                     *
 *  The projection below needs the SCALED modified Bessel and never    *
 *  I_m alone.  At the default mallet z reaches 260, where I_0 is      *
 *  1e111 and the Gaussian prefactor that cancels it is 1e-111:        *
 *  forming them separately computes the answer and then throws it     *
 *  away.  Downward recurrence is the stable direction for I (it is    *
 *  the decreasing solution in m), and the normalisation is the        *
 *  companion of the Neumann sum used for J:                           *
 *      e^z = I_0(z) + 2 (I_1 + I_2 + ...)                             *
 *  every term of which is positive, so there is no cancellation in    *
 *  the normalisation either.                                          *
 * ------------------------------------------------------------------ */
function iveAll(z,M,out){
  out=out||new Float64Array(M+1);
  for(let q=0;q<=M;q++) out[q]=0;
  if(!(z>0)){ out[0]=1; return out; }        /* I_m(0) = delta(m,0) */
  const top=Math.max(M,z);
  const N=2*Math.ceil((top+32+8*Math.sqrt(top))/2);
  const tox=2/z;
  let bi=1e-260, bip=0, sum=0;
  for(let j=N;j>0;j--){
    const bim=bip+j*tox*bi;
    bip=bi; bi=bim;
    if(bi>1e250){
      const sc=1e-250;
      bi*=sc; bip*=sc; sum*=sc;
      for(let q=0;q<=M;q++) out[q]*=sc;
    }
    sum+=bi;
    if(j-1<=M) out[j-1]=bi;
  }
  const norm=2*sum-out[0];                   /* = e^z, in the same scale */
  for(let q=0;q<=M;q++) out[q]/=norm;
  return out;
}

/* ------------------------------------------------------------------ *
 *  the eigenvalue table                                               *
 *                                                                     *
 *  Everything here is in units of the radius: x = k a, and the mode    *
 *  SHAPES J_m(x rho) are functions of rho = r/a alone.  So the whole   *
 *  table is independent of a, T and sigma — changing the tension or    *
 *  the size cannot invalidate it, only changing the boundary can.      *
 *  That is what makes the tension slider free.                         *
 * ------------------------------------------------------------------ */
function lommelNorm(m,x){
  /* int_0^1 J_m(x rho)^2 rho drho = [ J_m'(x)^2 + (1 - m^2/x^2) J_m(x)^2 ] / 2
     For the k = 0 rigid mode (m = 0, free rim) J_0 == 1 and this is 1/2,
     which the formula gives directly because the m^2/x^2 term is exactly 0
     at m = 0 rather than 0/0. */
  if(x===0) return m===0?0.5:0;
  const jp=besselJp(m,x), j=besselJ(m,x);
  return 0.5*(jp*jp+(m===0?1:1-m*m/(x*x))*j*j);
}
let MODE_CACHE={key:null,val:null};
function modeTable(bc,B,M,N){
  const key=bc+'|'+((bc==='springy')?(+B).toPrecision(12):'')+'|'+M+'|'+N;
  if(MODE_CACHE.key===key) return MODE_CACHE.val;
  const gl=gaussLegendre(16);
  /* projection nodes: composite 16-point Gauss-Legendre, NQP panels on 0..1.
     Each panel is 1/32 wide and the fastest mode oscillates with wavelength
     2 pi / x ~ 0.1, so a panel holds a third of a period — 16-point GL is
     machine-exact there, which Simpson on the same node count is not. */
  const nq=NQP*16, qx=new Float64Array(nq), qw=new Float64Array(nq);
  for(let p=0;p<NQP;p++){
    const lo=p/NQP, hi=(p+1)/NQP, hw=0.5*(hi-lo), mid=0.5*(hi+lo);
    for(let i=0;i<16;i++){ qx[p*16+i]=hw*gl.x[i]+mid; qw[p*16+i]=hw*gl.w[i]; }
  }
  const modes=[];
  for(let m=0;m<=M;m++){
    const dz=new Float64Array(N+1);
    for(let n=1;n<=N+1;n++) dz[n-1]=besselZero(m,n);
    const nz=new Float64Array(N+1);
    for(let n=1;n<=N;n++) nz[n-1]=besselPrimeZero(m,n,dz);
    for(let n=1;n<=N;n++){
      let x;
      if(bc==='free') x=nz[n-1];
      else if(bc==='springy') x=robinRoot(m,n,B,dz,nz);
      else x=dz[n-1];
      const disp=new Float64Array(NRD+1);
      for(let i=0;i<=NRD;i++) disp[i]=besselJ(m,x*i/NRD);
      const quad=new Float64Array(nq);
      for(let i=0;i<nq;i++) quad[i]=besselJ(m,x*qx[i]);
      modes.push({m:m,n:n,x:x,disp:disp,quad:quad,
                  nr:lommelNorm(m,x),eps:(m===0?TAU:PI)});
    }
  }
  const val={modes:modes,qx:qx,qw:qw,nq:nq,M:M,N:N,bc:bc,B:B};
  MODE_CACHE={key:key,val:val};
  return val;
}

/* ------------------------------------------------------------------ *
 *  projecting the strike onto the modes                               *
 *                                                                     *
 *  The mallet contact is a Gaussian of width s centred at (r0, 0):     *
 *      v(r,th) = exp( -d^2 / 2 s^2 ),  d^2 = r^2 + r0^2 - 2 r r0 cos th *
 *  and its ANGULAR integral is exact —                                *
 *      int_0^2pi exp(z cos th) cos(m th) dth = 2 pi I_m(z)            *
 *  so only a one-dimensional radial quadrature is left:                *
 *      A_m(r) = 2 pi exp(-(r-r0)^2/2s^2) [e^-z I_m(z)],  z = r r0/s^2  *
 *      C_mn   = int_0^1 A_m J_m(x rho) rho drho / (eps_m * norm)       *
 *  with eps_m = int cos^2(m th) dth = 2 pi (m=0) or pi.               *
 *                                                                     *
 *  selfTest re-does the same integral with a brute-force TWO-          *
 *  dimensional midpoint rule and asserts the two agree — and both are  *
 *  asserted against scipy values computed outside this file.           *
 * ------------------------------------------------------------------ */
let COEF_CACHE={key:null,val:null};
function strikeCoeffs(MT,r0,ss){
  const key=MT.bc+'|'+MT.B+'|'+MT.M+'|'+MT.N+'|'+r0.toPrecision(12)+'|'+ss.toPrecision(12);
  if(COEF_CACHE.key===key) return COEF_CACHE.val;
  const M=MT.M, nq=MT.nq, qx=MT.qx, qw=MT.qw;
  const A=[]; for(let m=0;m<=M;m++) A.push(new Float64Array(nq));
  const iv=new Float64Array(M+1);
  const inv2s2=1/(2*ss*ss), zsc=r0/(ss*ss);
  let zmax=0;
  for(let i=0;i<nq;i++){
    const rho=qx[i], dr=rho-r0, z=rho*zsc;
    if(z>zmax) zmax=z;
    const pref=TAU*Math.exp(-dr*dr*inv2s2);
    iveAll(z,M,iv);
    for(let m=0;m<=M;m++) A[m][i]=pref*iv[m];
  }
  const C=new Float64Array(MT.modes.length);
  let energy=0;
  for(let q=0;q<MT.modes.length;q++){
    const md=MT.modes[q], Am=A[md.m], sh=md.quad;
    let acc=0;
    for(let i=0;i<nq;i++) acc+=qw[i]*Am[i]*sh[i]*qx[i];
    const den=md.eps*md.nr;
    C[q]=(den!==0&&isFinite(den))?acc/den:0;
    energy+=C[q]*C[q]*den;
  }
  /* the energy the strike actually put into the membrane, for comparison
     with what the truncation captured:  int v^2 dA, same identity with
     s -> s/sqrt2 (v^2 is a Gaussian of half the variance) */
  let tot=0;
  const iv0=new Float64Array(1);
  for(let i=0;i<nq;i++){
    const rho=qx[i], dr=rho-r0;
    /* v^2 = exp(-d^2/s^2) expands with z = 2 r r0 / s^2, NOT r r0 / s^2 —
       halving that argument silently inflates the denominator (ive falls
       like 1/sqrt(2 pi z)) and pins the reported capture near 70% for every
       mallet width, which is how the slip was caught. */
    iveAll(2*rho*r0/(ss*ss),0,iv0);
    tot+=qw[i]*TAU*Math.exp(-dr*dr/(ss*ss))*iv0[0]*rho;
  }
  const val={C:C,captured:tot>0?energy/tot:0,zmax:zmax,eTot:tot,eMode:energy};
  COEF_CACHE={key:key,val:val};
  return val;
}

/* ------------------------------------------------------------------ *
 *  the time factor                                                    *
 *                                                                     *
 *  struck  u(0) = 0, u_t(0) = v   ->   sin(w t) / w                   *
 *  pressed u(0) = f, u_t(0) = 0   ->   cos(w t)                       *
 *                                                                     *
 *  sin(w t)/w -> t as w -> 0 is not a decoration: a membrane with a    *
 *  FREE rim really does have a k = 0 mode, and struck, it drifts.      *
 *  The series branch below is reached by that mode and by nothing      *
 *  else, so selfTest evaluates it at arguments that reach it.          *
 * ------------------------------------------------------------------ */
function timeFactor(w,t,struck){
  if(!struck) return Math.cos(w*t);
  const a=w*t;
  if(Math.abs(a)<1e-4){ const a2=a*a; return t*(1-a2/6*(1-a2/20)); }
  return Math.sin(a)/w;
}
/* The mallet stays in contact for a time tau, and its force is taken as a
   half-sine over that time carrying the SAME impulse as the instantaneous
   velocity V above:  g(t) = A sin(b t), b = pi/tau, A = pi/(2 tau).  Both
   phases are closed forms.  During contact the mode is driven,
       u = A [ w sin(bt) - b sin(wt) ] / ( w (w^2 - b^2) ),
   and after it rings freely as the impulsive answer delayed by tau/2 and
   filtered by
       S(w tau) = cos(w tau/2) / ( 1 - (w tau/pi)^2 ),
   which rolls the high partials off — a felt mallet against a wooden stick.
   The two agree at t = tau (checked), S -> 1 as tau -> 0 so tau = 0 IS the
   impulsive strike, and the two removable points (w = 0, the free rim's
   drift; w = b, the pulse's own frequency) are taken as limits.  The
   pressure a listener hears is the membrane's ACCELERATION, and with an
   instantaneous strike that is set by nothing but the mallet's width;
   the contact time is what makes the attack — and its loudness — physical. */
function pulseFilter(w,tau){
  const x=w*tau;
  if(x===0) return 1;
  const r=x/PI, d=1-r*r;
  if(Math.abs(d)<1e-6) return (PI/4)*(1-0.5*(r-1));     /* the w tau = pi limit */
  return Math.cos(0.5*x)/d;
}
function timeFactorPulse(w,t,tau){
  if(!(tau>0)) return timeFactor(w,t,true);
  if(t>=tau) return pulseFilter(w,tau)*timeFactor(w,t-0.5*tau,true);
  const b=PI/tau, A=0.5*b, bt=b*t;
  if(w<1e-6) return A*(bt-Math.sin(bt))/(b*b);           /* w -> 0 */
  const d=w*w-b*b;
  if(Math.abs(d)<1e-9*b*b) return A*(Math.sin(bt)-bt*Math.cos(bt))/(2*b*b);  /* w -> b */
  return A*(w*Math.sin(bt)-b*Math.sin(w*t))/(w*d);
}
/* A two-parameter loss, and it is a MODEL, not a measurement: the
   fundamental's 60 dB decay is set directly and the overtones are given a
   loss growing as (f/f1)^p.  Real heads lose energy to the air, to the
   shell and to the bearing edge in different proportions at different
   frequencies; nothing here is fitted to a drum. */
function decayRate(fr,f1,t60,p){
  if(!(t60>0)) return 0;
  const base=6.907755278982137/t60;          /* ln(1000) = 60 dB */
  return base*Math.pow(Math.max(fr,1e-9)/Math.max(f1,1e-9),p);
}

/* ------------------------------------------------------------------ *
 *  the sound — the far field of a membrane set in a rigid baffle      *
 *                                                                     *
 *  Rayleigh's integral for a surface in an infinite baffle,           *
 *    p(X,t) = (rho_air/2pi) INT u_tt(x', t - |X-x'|/c_air) / |X-x'| dA' *
 *  in the far field R >> a, for one mode J_m(kr) cos(m th) e^{iwt}:   *
 *    p = (rho_air/2pi R) (iw)^2 e^{iw(t - R/c_air)}                    *
 *        INT_0^a INT_0^2pi J_m(kr) cos(m th') e^{i k0 r sinTH cos(ph-th')} r dth' dr *
 *  with (TH, ph) the listener's polar and azimuthal angles and        *
 *  k0 = w/c_air.  The angular integral is exact —                     *
 *    INT_0^2pi cos(m th') e^{i z cos(ph-th')} dth' = 2pi i^m J_m(z) cos(m ph) *
 *  (the strike's identity again, with iz for z) — and the radial one  *
 *  is Lommel's:                                                       *
 *    LAMBDA_m(x,y) = INT_0^1 J_m(x r) J_m(y r) r dr                    *
 *                  = [ y J_m(x) J_m'(y) - x J_m'(x) J_m(y) ] / (x^2-y^2), *
 *  which at y = x is the norm already in lommelNorm().  So each mode  *
 *  reaches the ear with the complex gain                              *
 *    G_mn = i^m cos(m ph) 2pi a^2 LAMBDA_m(x_mn, k0 a sinTH)            *
 *  times its ACCELERATION.  Straight above the drum sinTH = 0 and     *
 *  LAMBDA_m(x,0) = 0 for every m > 0: only the axisymmetric modes are *
 *  heard there, and the (1,n) family — the kettledrum's note — needs  *
 *  the listener off the axis.  y < x whenever the membrane wave is    *
 *  subsonic in air, so the denominator cannot vanish for a real drum; *
 *  the head can be tuned supersonic here, and then the y -> x limit   *
 *  is taken.  The listener stands in the vertical plane through the   *
 *  strike, ph = 0, where every mode is loudest.                       *
 *                                                                     *
 *  Integrating |p|^2 over the hemisphere gives each mode's radiated   *
 *  power, and P/2E is a decay rate that is DERIVED, not fitted:       *
 *    alpha_rad = rho_air w^2 a^2 I / (2 c_air sigma LAMBDA_m(x,x)),    *
 *    I = INT_0^pi/2 LAMBDA_m(x, k0 a sinTH)^2 sinTH dTH.                *
 *  The baffle is one-sided by construction — a kettle or a closed     *
 *  shell is roughly that, a bare hoop is not — and the air's added    *
 *  mass is not in E, so the rates are indicative and the switch is a  *
 *  switch.  The contact-microphone pickup is simply the membrane      *
 *  velocity at one point.                                             *
 * ------------------------------------------------------------------ */
const R_LISTEN=1.0;                 /* the far-field pressure is quoted at 1 m */
function lommelCross(m,x,y){
  /* LAMBDA_m(x,y) = INT_0^1 J_m(x rho) J_m(y rho) rho drho.  The y -> x
     limit is lommelNorm and is taken inside 1e-8, where the closed form's
     cancellation has cost about what the limit's slope would. */
  if(x===0&&y===0) return m===0?0.5:0;
  return lommelCrossX(m,x,besselJ(m,x),besselJp(m,x),y);
}
function lommelCrossX(m,x,jx,jpx,y){
  /* the same with J_m(x) and J_m'(x) already in hand — the radiation
     quadrature evaluates one mode at many y — and J_m'(y) by the recurrence
     J_m' = J_{m-1} - (m/y) J_m, two Bessel calls a node instead of six.
     selfTest holds this route to lommelCross's own. */
  if(y===0) return m===0?(x===0?0.5:-jpx/x):0;      /* J_1(x)/x = -J_0'(x)/x */
  if(Math.abs(x-y)<=1e-8*Math.max(x,y)) return lommelNorm(m,x);
  const jy=besselJ(m,y);
  const jpy=(m===0)?-besselJ(1,y):(besselJ(m-1,y)-(m/y)*jy);
  return (y*jx*jpy-x*jpx*jy)/(x*x-y*y);
}
function farGain(m,x,y,ph){
  /* 2pi i^m cos(m ph) LAMBDA_m(x,y) as [re, im]: the far-field gain of one
     mode per unit a^2, before its acceleration */
  const g=TAU*Math.cos(m*ph)*lommelCross(m,x,y);
  const q=m&3;                      /* i^m cycles 1, i, -1, -i */
  return q===0?[g,0]:q===1?[0,g]:q===2?[-g,0]:[0,-g];
}
let _GLR=null;
function radAlpha(m,x,omega,a,sigma,c0){
  /* the derived radiation decay rate (amplitude, 1/s) of mode (m,x).
     Composite 16-point Gauss-Legendre in the polar angle: y = k0 a sinTH
     runs up to k0 a, J_m(y) turns once per 2pi of it, and one panel per 8
     units keeps 12+ nodes on every turn. */
  c0=c0||C_AIR;
  if(!(omega>0)) return 0;
  const nrm=lommelNorm(m,x);
  if(!(nrm>0)) return 0;
  const k0a=omega*a/c0;
  const gl=_GLR||(_GLR=gaussLegendre(16));
  const np=clamp(Math.ceil(k0a/8)+1,2,24);
  const jx=besselJ(m,x), jpx=besselJp(m,x);
  let I=0;
  for(let p=0;p<np;p++){
    const lo=(PI/2)*p/np, hi=(PI/2)*(p+1)/np, hw=0.5*(hi-lo), mid=0.5*(hi+lo);
    for(let i=0;i<16;i++){
      const th=hw*gl.x[i]+mid, sn=Math.sin(th);
      const L=lommelCrossX(m,x,jx,jpx,k0a*sn);
      I+=hw*gl.w[i]*L*L*sn;
    }
  }
  return RHO_AIR*omega*omega*a*a*I/(2*c0*sigma*nrm);
}
let RAD_CACHE={key:null,val:null};
function radAlphaTable(MT,c,a,sigma){
  const key=MT.bc+'|'+MT.B+'|'+MT.M+'|'+MT.N+'|'+c.toPrecision(12)+'|'
           +a.toPrecision(12)+'|'+sigma.toPrecision(12);
  if(RAD_CACHE.key===key) return RAD_CACHE.val;
  const out=new Float64Array(MT.modes.length);
  for(let i=0;i<MT.modes.length;i++){
    const md=MT.modes[i];
    out[i]=radAlpha(md.m,md.x,c*md.x/a,a,sigma);
  }
  RAD_CACHE={key:key,val:out};
  return out;
}
function ringTime(M,single){
  /* how long the slowest-decaying mode with any amplitude takes to fall
     60 dB, clamped to [0.3, 12] s; 3 s stands in for "never" when the loss
     is switched off.  For one mode sounded alone, that mode's own T60. */
  if(!M.damp) return 3.0;
  let t=0;
  for(let q=0;q<M.alpha.length;q++){
    const md=M.MT.modes[q];
    if(single?!(md.m===single.m&&md.n===single.n):(M.CO.C[q]===0)) continue;
    if(!(M.w[q]>1e-6)) continue;
    const al=M.alpha[q];
    t=Math.max(t,al>0?6.907755278982137/al:3.0);
  }
  return clamp(t,0.3,12);
}
function soundModes(M,opt){
  /* the mode sum as the listener receives it.  Each entry is the complex
     amplitude Z of  Z e^{(iw - alpha) t}: the struck head sends Im, the
     released one Re.  opt.pickup 'air' is the pressure at R_LISTEN, opt.theta
     off the axis; 'head' the velocity under a contact mic at opt.micR (r/a).
     opt.single sounds one mode alone, at a peak displacement of 1 mm. */
  const out=[];
  if(M.open) return out;
  const mds=M.MT.modes, C=M.CO.C;
  const air=(opt.pickup!=='head');
  const sT=air?Math.sin(clamp(opt.theta||0,0,PI/2)):0;
  const pre=air?RHO_AIR*M.a*M.a/R_LISTEN:1;
  const rho=clamp(opt.micR||0,0,1);
  const one=opt.single||null;
  for(let q=0;q<mds.length;q++){
    const md=mds[q];
    if(one&&!(md.m===one.m&&md.n===one.n)) continue;
    const w=M.w[q];
    if(!(w>1e-6)) continue;         /* the k = 0 drift of a free rim makes no sound */
    const al=M.damp?M.alpha[q]:0;
    let cq;
    if(one){
      let jm=0;
      for(let i=0;i<md.disp.length;i++) jm=Math.max(jm,Math.abs(md.disp[i]));
      cq=jm>0?(1e-3/jm)*(M.struck?w:1):0;
    } else cq=C[q]*M.amp;
    if(cq===0) continue;
    let gr,gi;
    if(air){ const g=farGain(md.m,md.x,w*M.a/C_AIR*sT,0); gr=g[0]*pre; gi=g[1]*pre; }
    else { gr=besselJ(md.m,md.x*rho); gi=0; }
    /* times (iw - alpha): the velocity level, kept because the push's own
       term in the pressure needs it — and once more for the pressure, which
       is an acceleration */
    const vr=-gr*al-gi*w, vi=gr*w-gi*al;
    if(air){ gr=-vr*al-vi*w; gi=vr*w-vi*al; } else { gr=vr; gi=vi; }
    const sc=cq/(M.struck?w:1);
    out.push({m:md.m,n:md.n,f:w/TAU,w:w,alpha:al,zr:gr*sc,zi:gi*sc,zvr:vr*sc,zvi:vi*sc});
  }
  return out;
}
function tailEnd(amp,alpha,zmax,cut,fs,n,nmin){
  /* the sample at which amp e^{-alpha t} has fallen to zmax e^{-cut} */
  if(!(alpha>0)||!(zmax>0)||!(amp>0)) return n;
  const t=(cut+Math.log(amp/zmax))/alpha;
  if(!(t>0)) return nmin;
  return Math.max(nmin,Math.min(n,Math.ceil(t*fs)+1));
}
function renderSound(M,opt,fs,dur){
  /* the modal sum at the audio rate: each mode a rotating phasor z <- z r
     with r = e^{(iw - alpha)/fs}, exact for a damped sinusoid at four
     multiplies a sample.  Modes above 0.45 fs are dropped and counted rather
     than aliased.  The peak is taken BEFORE the 30 ms raised-cosine tail
     that keeps a cut-off ring from clicking.  Returns the samples, the peak
     (Pa in the air, m/s on the head) and the counts. */
  const modes=soundModes(M,opt);
  const n=Math.max(1,Math.round(dur*fs));
  const y=new Float64Array(n);
  let used=0, dropped=0, top=0;
  const im=M.struck;
  /* a mode is followed only until its own envelope is 160 dB below the
     loudest mode's start — 272 modes x 115 000 samples is a real cost, and
     most of them are gone long before the fundamental is */
  let zmax=0;
  for(const md of modes){ const z=Math.hypot(md.zr,md.zi); if(z>zmax) zmax=z; }
  const CUT=Math.log(1e8);
  /* the mallet's contact time, as the EXACT convolution of each mode's
     impulse response  h = Im{Z e^{lam t}}, lam = iw - alpha,  with the
     half-sine push g = A sin(bt) on 0 < t < tau:
       t < tau :  A [ b e^{lam t} - lam sin(bt) - b cos(bt) ] / (lam^2 + b^2)
       t >= tau:  A b (1 + e^{-lam tau}) e^{lam t} / (lam^2 + b^2)
     — for alpha = 0 the second line is S(w tau) e^{iw(t - tau/2)}, the same
     filter and delay the picture uses (timeFactorPulse), and selfTest holds
     the two to each other.  The PRESSURE is an acceleration, and the
     acceleration's impulse response carries a delta at t = 0 of weight
     h_v(0+) = Im Z_v, so in the air the push itself is heard during contact:
     + g(t) Im Z_v.  (For m > 0 the i^m phase of a transient is only defined
     mode by mode at its own frequency; that is the one approximation here,
     and it lives inside the first few milliseconds.)  One mode sounded
     alone is left impulsive. */
  const air=(opt.pickup!=='head');
  const tau=(im&&!opt.single&&M.tau>0)?M.tau:0;
  const nt=tau>0?Math.min(n,Math.ceil(tau*fs)):0;
  const b=tau>0?PI/tau:0, A=0.5*b;
  let sb=null, cb=null;
  if(nt>0){ sb=new Float64Array(nt); cb=new Float64Array(nt);
    for(let k=0;k<nt;k++){ sb[k]=Math.sin(b*k/fs); cb[k]=Math.cos(b*k/fs); } }
  for(const md of modes){
    if(md.f>0.45*fs){ dropped++; continue; }
    if(md.zr===0&&md.zi===0) continue;
    used++; if(md.f>top) top=md.f;
    const g=Math.exp(-md.alpha/fs), rr=g*Math.cos(md.w/fs), ri=g*Math.sin(md.w/fs);
    let zr=md.zr, zi=md.zi;
    if(tau>0){
      /* complex constants for this mode: lam, D = A/(lam^2+b^2), Db = D b,
         E1 = D Z lam, E2 = D Z b, F = D b (1 + e^{-lam tau}) */
      const lr=-md.alpha, li=md.w;
      let bb=b;
      let dr=lr*lr-li*li+bb*bb, di=2*lr*li;
      if(dr*dr+di*di<1e-18*bb*bb*bb*bb){ bb=b*(1+1e-6); dr=lr*lr-li*li+bb*bb; }
      const dd=dr*dr+di*di, Dr=A*dr/dd, Di=-A*di/dd;
      const Dbr=Dr*bb, Dbi=Di*bb;
      const zlr=zr*lr-zi*li, zli=zr*li+zi*lr;              /* Z lam */
      const E1i=Dr*zli+Di*zlr, E2i=(Dr*zi+Di*zr)*bb;       /* Im parts only */
      const et=Math.exp(-lr*tau), er=et*Math.cos(li*tau), ei=-et*Math.sin(li*tau);
      const Fr=Dbr*(1+er)-Dbi*ei, Fi=Dbr*ei+Dbi*(1+er);
      const dv=air?A*md.zvi:0;                             /* the push itself */
      const amp=Math.hypot(zr,zi)*Math.hypot(Fr,Fi);
      const nq=tailEnd(amp,md.alpha,zmax,CUT,fs,n,nt);
      let k=0;
      for(;k<nt;k++){
        y[k]+=(Dbr*zi+Dbi*zr)-E1i*sb[k]-E2i*cb[k]+dv*sb[k];
        const t=zr*rr-zi*ri; zi=zr*ri+zi*rr; zr=t;
      }
      for(;k<nq;k++){
        y[k]+=Fr*zi+Fi*zr;
        const t=zr*rr-zi*ri; zi=zr*ri+zi*rr; zr=t;
      }
    }
    else {
      const nq=tailEnd(Math.hypot(zr,zi),md.alpha,zmax,CUT,fs,n,0);
      if(im) for(let k=0;k<nq;k++){ y[k]+=zi; const t=zr*rr-zi*ri; zi=zr*ri+zi*rr; zr=t; }
      else   for(let k=0;k<nq;k++){ y[k]+=zr; const t=zr*rr-zi*ri; zi=zr*ri+zi*rr; zr=t; }
    }
  }
  let peak=0;
  for(let k=0;k<n;k++){ const v=Math.abs(y[k]); if(v>peak) peak=v; }
  const nf=Math.min(Math.round(0.03*fs),Math.floor(n/4));
  for(let j=0;j<nf;j++) y[n-nf+j]*=0.5*(1+Math.cos(PI*(j+1)/nf));
  return {y:y,peak:peak,n:n,fs:fs,used:used,dropped:dropped,top:top,modes:modes};
}

/* ------------------------------------------------------------------ *
 *  the bounded membrane, evaluated                                    *
 *                                                                     *
 *  u(rho,th,t) = SUM_m [ SUM_n C_mn J_m(x_mn rho) T_mn(t) ] cos(m th) *
 *                                                                     *
 *  The strike is put on the +x axis, so only cos(m th) appears and the *
 *  sin(m th) half of every degenerate pair has zero amplitude — that   *
 *  is exact, not an approximation, and it halves the work.  Summing    *
 *  the radial part FIRST turns an (Nr x Nth x modes) cost into         *
 *  (Nr x modes) + (Nr x Nth x m), which is what makes this animate.    *
 * ------------------------------------------------------------------ */
function evalRadial(M,t,Rm){
  const MT=M.MT, CO=M.CO, mm=MT.M, mds=MT.modes, C=CO.C;
  for(let m=0;m<=mm;m++) Rm[m].fill(0);
  for(let q=0;q<mds.length;q++){
    const cq=C[q];
    if(cq===0) continue;
    const md=mds[q], w=M.w[q];
    let tf=(M.tau>0&&M.struck)?timeFactorPulse(w,t,M.tau):timeFactor(w,t,M.struck);
    if(M.damp) tf*=Math.exp(-M.alpha[q]*t);
    if(tf===0) continue;
    const row=Rm[md.m], sh=md.disp, g=cq*tf;
    for(let i=0;i<=NRD;i++) row[i]+=g*sh[i];
  }
  return Rm;
}
function cosTable(M,nth){
  /* CT[j][m] = cos(m th_j).  Built once; the surface evaluation is the
     inner loop of every animated frame and must not call cos(). */
  const T=[];
  for(let j=0;j<nth;j++){
    const th=TAU*j/nth, row=new Float64Array(M+1);
    for(let m=0;m<=M;m++) row[m]=Math.cos(m*th);
    T.push(row);
  }
  return T;
}
function evalSurface(M,Rm,CT,out){
  /* out[i*NTHD+j] = u at (rho_i, th_j) */
  const mm=M.MT.M;
  for(let j=0;j<NTHD;j++){
    const cm=CT[j];
    for(let i=0;i<=NRD;i++){
      let s=Rm[0][i];
      for(let m=1;m<=mm;m++) s+=Rm[m][i]*cm[m];
      out[i*NTHD+j]=s;
    }
  }
  return out;
}

/* ------------------------------------------------------------------ *
 *  the UNBOUNDED membrane, and the water surface                      *
 *                                                                     *
 *  Take the rim away and the sum over n becomes an integral over k —   *
 *  the same expansion, with a continuous spectrum:                     *
 *                                                                     *
 *    u(r,t) = INT_0^inf [ F(k) cos(w t) + G(k) sin(w t)/w ] J_0(kr) k dk *
 *                                                                     *
 *  For a Gaussian of width s the transform is a Gaussian again,        *
 *  G(k) = V s^2 exp(-k^2 s^2 / 2), so there is nothing to approximate  *
 *  in the source; only the quadrature is numerical, and it is a        *
 *  composite 16-point Gauss-Legendre which was checked in python       *
 *  against a 200 000-point reference (2e-10) and against a completely  *
 *  independent evaluation by POISSON'S FORMULA in 2-D (1e-8).          *
 *                                                                     *
 *  w(k) = c k        membrane — non-dispersive, every k travels alike  *
 *  w(k) = sqrt( (g k + (sig/rho) k^3) tanh(k h) )     water            *
 *                                                                     *
 *  which is the one line that turns the drum into a puddle.            *
 * ------------------------------------------------------------------ */
function omegaOf(k,md){
  if(md.kind==='membrane') return md.c*k;
  const kk=k*k;
  return Math.sqrt(Math.max(0,(G_ACC*k+md.T*k*kk)*Math.tanh(k*md.h)));
}
let FF_CACHE={key:null,val:null};
/* The integrand oscillates as exp(i(omega(k)t +- kr)), so the PHASE EXCURSION
   over the k-range — not the range itself — decides how many panels are
   needed.  A fixed 48 is right for the membrane, where omega = ck and the
   phase reaches ~900 rad; it is badly wrong for water, where omega grows as
   k^{3/2} and the phase reaches 3400 rad at the default drop.  Under-resolved,
   the quadrature filled the calm hole inside r = c_g,min t with oscillation
   that is not there — contradicting this file's own caption, which is how it
   was caught.  Panels now scale with the phase, at ~2.2 oscillations each. */
function freeField(md,ss,Rmax,tmax){
  tmax=tmax||1;
  const K=8.5/ss;
  const phase=omegaOf(K,md)*tmax+K*Rmax;
  const NP=clamp(Math.ceil(phase/TAU/2.2),NFP,420);
  const key=md.kind+'|'+(md.kind==='membrane'?md.c:md.h)+'|'
           +ss.toPrecision(12)+'|'+Rmax.toPrecision(12)+'|'+NP;
  if(FF_CACHE.key===key) return FF_CACHE.val;
  const gl=gaussLegendre(16), nk=NP*16;
  const kk=new Float64Array(nk), wt=new Float64Array(nk), om=new Float64Array(nk);
  for(let p=0;p<NP;p++){
    const lo=K*p/NP, hi=K*(p+1)/NP, hw=0.5*(hi-lo), mid=0.5*(hi+lo);
    for(let i=0;i<16;i++){
      const idx=p*16+i, k=hw*gl.x[i]+mid;
      kk[idx]=k;
      /* the k here is the Hankel measure k dk; the Gaussian is its transform */
      wt[idx]=hw*gl.w[i]*k*ss*ss*Math.exp(-k*k*ss*ss/2);
      om[idx]=omegaOf(k,md);
    }
  }
  const P=new Float64Array(nk*(NFR+1));
  for(let i=0;i<nk;i++){
    const k=kk[i], base=i*(NFR+1);
    for(let j=0;j<=NFR;j++) P[base+j]=besselJ(0,k*Rmax*j/NFR);
  }
  const val={k:kk,w:wt,om:om,P:P,nk:nk,Rmax:Rmax,K:K,panels:NP};
  FF_CACHE={key:key,val:val};
  return val;
}
function freeFieldAt(FF,t,struck,out,tau){
  const nk=FF.nk, P=FF.P;
  const pulse=(tau>0&&struck);
  for(let j=0;j<=NFR;j++) out[j]=0;
  for(let i=0;i<nk;i++){
    const g=FF.w[i]*(pulse?timeFactorPulse(FF.om[i],t,tau):timeFactor(FF.om[i],t,struck));
    if(g===0) continue;
    const base=i*(NFR+1);
    for(let j=0;j<=NFR;j++) out[j]+=g*P[base+j];
  }
  return out;
}
/* Poisson's formula in two dimensions — the independent check on all of the
   above, and the thing that makes the WAKE inevitable rather than surprising:
   the integral runs over the whole DISC |y| <= ct, not over its boundary, so
   everything the strike ever did is still inside the light cone.  In three
   dimensions the same construction integrates over the SPHERE only, which is
   why a bang is a bang there and a smear here.  Substituting |y| = ct sin(ph)
   removes the 1/sqrt singularity; the constant is pinned by g == 1, for which
   u == t exactly. */
function poisson2D(r,t,ss,c,Nph,Nps){
  Nph=Nph||400; Nps=Nps||400;
  let acc=0;
  for(let i=0;i<Nph;i++){
    const ph=(i+0.5)*(PI/2)/Nph, rho=c*t*Math.sin(ph), sp=Math.sin(ph);
    for(let j=0;j<Nps;j++){
      const ps=(j+0.5)*TAU/Nps;
      const d2=r*r+rho*rho-2*r*rho*Math.cos(ps);
      acc+=Math.exp(-d2/(2*ss*ss))*sp;
    }
  }
  return (t/TAU)*acc*((PI/2)/Nph)*(TAU/Nps);
}

function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'&mdash;'; }
/* NOTE the name: `sig` collides with the display-list signature helper in
   tools/ui_drive.js, and `const sig` there against `function sig` here is a
   hard SyntaxError when the two files are concatenated for the headless UI
   run.  Renamed on this side so the shared harness stays usable unmodified. */
function sigf(x,n){
  if(!isFinite(x)) return '&mdash;';
  if(x===0) return '0';
  n=n||3;
  const e=Math.floor(Math.log10(Math.abs(x)));
  if(e<-4||e>=6) return x.toExponential(n-1);
  return x.toFixed(Math.max(0,n-1-e));
}
function fmtHz(f){ return f>=1000?sigf(f/1000,4)+' kHz':sigf(f,4)+' Hz'; }
function fmtLen(x){
  const a=Math.abs(x);
  if(a<1e-6) return sigf(x*1e9,3)+' nm';
  if(a<1e-3) return sigf(x*1e6,3)+' &micro;m';
  if(a<1)    return sigf(x*1e3,3)+' mm';
  return sigf(x,3)+' m';
}
function noteName(f){
  /* nearest equal-tempered name and the cents error, A4 = 440 */
  if(!(f>0)) return '';
  const NAMES=['C','C&sharp;','D','E&flat;','E','F','F&sharp;','G','A&flat;','A','B&flat;','B'];
  const n=12*Math.log2(f/440)+69;
  const k=Math.round(n), cents=Math.round(100*(n-k));
  return NAMES[((k%12)+12)%12]+(Math.floor(k/12)-1)
        +(cents?' <span class="'+(Math.abs(cents)>25?'bad':'dim')+'">'
          +(cents>0?'+':'')+cents+'&cent;</span>':'');
}

/* ------------------------------------------------------------------ *
 *  the model                                                          *
 * ------------------------------------------------------------------ */
function buildModel(st){
  const q=qualById(st.quality), M=q.M, N=q.N;
  const a=st.dia*0.0254/2;
  const sigma=MYLAR_RHO*st.gauge*2.54e-5;
  /* The tension is SOLVED from the pitch, always against the CLAMPED
     eigenvalue, so that changing the boundary condition changes the
     frequencies (which is the physics on show) rather than silently
     retuning the drum underneath you. */
  const xPitch=(st.pmode==='11')?besselZero(1,1):besselZero(0,1);
  const c=TAU*a*st.pitch/xPitch;
  const T=sigma*c*c;

  const B=Math.pow(10,st.logB);
  const MT=modeTable(st.bc==='open'?'clamped':st.bc,B,M,N);
  const r0f=clamp(st.r0f,0,0.97), sf=clamp(st.sf,0.05,0.35);
  const CO=strikeCoeffs(MT,r0f,sf);

  /* per-mode frequency and loss */
  const nm=MT.modes.length;
  const w=new Float64Array(nm), fr=new Float64Array(nm), alpha=new Float64Array(nm);
  let f1=Infinity;
  for(let i=0;i<nm;i++){
    w[i]=c*MT.modes[i].x/a; fr[i]=w[i]/TAU;
    if(fr[i]>1e-9&&fr[i]<f1) f1=fr[i];
  }
  if(!isFinite(f1)) f1=1;
  for(let i=0;i<nm;i++) alpha[i]=decayRate(fr[i],f1,st.t60,st.lossP);
  /* the derived radiation loss, added on top when asked for */
  const alphaRad=st.radLoss?radAlphaTable(MT,c,a,sigma):null;
  if(alphaRad) for(let i=0;i<nm;i++) alpha[i]+=alphaRad[i];

  /* the strike sets the SCALE.  struck: u_t(0) = V at the contact, so the
     coefficients carry V.  pressed: u(0) = A.
     A DROP is neither: it leaves a crater, which is an initial DISPLACEMENT,
     and the depth is taken as 0.6 of the drop radius — a modelled initial
     condition, stated as such, and the thing on show is the dispersion rather
     than the splash.  Running the droplet as an impulsive VELOCITY instead
     (which is what it did until the pictures were looked at) gives a
     mathematically fine but physically different answer: sin(wt)/w with
     w -> 0 as k -> 0 puts enormous weight on the longest waves, and they
     swamp the ripples the view exists to show. */
  const drop=(st.view==='droplet');
  const struck=drop?false:(st.strike==='struck');
  const amp=drop?(0.6*st.dropR*1e-3)
                :(struck?st.vel:st.vel*sf*a/c);

  /* the sorted spectrum, for the ladder and the mode gallery */
  const spec=[];
  for(let i=0;i<nm;i++)
    spec.push({m:MT.modes[i].m,n:MT.modes[i].n,x:MT.modes[i].x,f:fr[i],
               C:CO.C[i],i:i,deg:MT.modes[i].m>0?2:1});
  spec.sort((p,r)=>p.x-r.x);

  /* the medium for "free field" and "the droplet" */
  const med=(st.view==='droplet')
    ? {kind:'water',T:WATER_SIGMA/WATER_RHO,h:st.depth*1e-3,c:0}
    : {kind:'membrane',c:c};
  /* water landmarks — derived from sigma and rho, not quoted */
  const kMin=Math.sqrt(WATER_RHO*G_ACC/WATER_SIGMA);
  const cMin=Math.pow(4*G_ACC*WATER_SIGMA/WATER_RHO,0.25);

  const Md={
    st:st,q:q,M:M,N:N,a:a,sigma:sigma,c:c,T:T,B:B,MT:MT,CO:CO,
    w:w,fr:fr,alpha:alpha,alphaRad:alphaRad,f1:f1,spec:spec,amp:amp,
    struck:struck,damp:st.damp,t60:st.t60,lossP:st.lossP,drop:drop,
    tau:(struck&&!drop)?Math.max(0,st.tau||0)*1e-3:0,
    r0f:r0f,sf:sf,med:med,kMin:kMin,cMin:cMin,
    lamMin:TAU/kMin,
    xPitch:xPitch,
    open:(st.bc==='open'),
  };
  /* the free-field solver, when it is the one in force */
  if(st.bc==='open'||st.view==='field'||st.view==='droplet'){
    const ss=(st.view==='droplet')?st.dropR*1e-3:sf*a;
    const R =(st.view==='droplet')?Math.max(0.12,60*ss):st.ffRadius*a;
    /* the quadrature resolution follows the phase, so it needs to know how
       late the view will ever be asked to draw */
    const tmax=(st.view==='droplet')?2.4:(3.2*R/c);
    Md.FF=freeField(med,ss,R,tmax);
    Md.ffS=ss; Md.ffR=R;
  }
  return Md;
}

/* peak displacement of the bounded solution at time t, used both for the
   vertical exaggeration and for the readout — the number a drummer would
   recognise, in millimetres. */
function peakOf(M,t){
  const Rm=M._Rm||(M._Rm=(function(){const r=[];for(let m=0;m<=M.M;m++)
    r.push(new Float64Array(NRD+1)); return r;})());
  evalRadial(M,t,Rm);
  let p=0;
  for(let i=0;i<=NRD;i++){
    let s=0;
    for(let m=0;m<=M.M;m++) s+=Math.abs(Rm[m][i]);
    if(s>p) p=s;
  }
  return p*M.amp;
}

    row('&lambda; there', sigf(M.lamMin*1e3,4)+' mm');
    const gmn=waterCgMin(M.med.h), flat=(gmn.k*M.med.h<0.5);
    row(flat?'c<sub>g</sub> floor':'c<sub>g</sub> minimum', sigf(gmn.cg*100,4)+' cm/s');
    row('&lambda; there', flat?'&mdash; <span class="dim">a plateau</span>'

    row('deep-water limit', 'c<sub>g</sub> = c<sub>p</sub>/2');
    row('capillary limit', 'c<sub>g</sub> = 3c<sub>p</sub>/2');
    hd('the drop');
    row('radius', fmt(st.dropR,2)+' mm');

    s+='</table><div class="note"><b>Everything here is derived.</b> '
      +'c<sub>min</sub> = (4g&sigma;/&rho;)<sup>1/4</sup> and k<sub>min</sub> = '
      +'&radic;(&rho;g/&sigma;) come out of the two measured constants above &mdash; '
      +'no number in this panel was typed in.</div>'
      +'<div class="note">A disturbance slower than c<sub>min</sub> makes '
      +'<b>no waves at all</b>. That is why a water strider leaves nothing behind.</div>';
    return s;
  }

  if(st.view==='separate'){

    row('n (radial order)', String(n));

    s+='</table><div class="note"><b>The rim is the only thing that quantises k.</b> '

      row('('+sp[i].m+','+sp[i].n+')', fmtHz(sp[i].f)+' &nbsp; &times;'

  s+='</table>';
  if(M.CO.captured<0.97)
    s+='<div class="note"><b class="bad">Truncation.</b> A mallet this small needs '
      +'more modes than are being kept &mdash; '+fmt(100*M.CO.captured,1)+'% of the '
      +'strike energy landed in them. The <i>displacement</i> converges much faster '
      +'than that, because sin(&omega;t)/&omega; suppresses exactly what is missing, '
      +'but the number is shown rather than hidden.</div>';
  s+='<div class="note"><b>The tension is not measured.</b> &sigma; comes from the '
    +'gauge and Mylar&rsquo;s density; T is solved from the pitch, which is what '
