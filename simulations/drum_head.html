/* a regression pin, computed by THIS file (not independent): the peak pressure
   of the default timpani stroke, 3 m/s, 1 m away at 45 degrees */
const PIN_SPL_PA=23.162887219933797;

function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,t,n)=>ok(Math.abs(a-b)<=t,n+'  (got '+a+', want '+b+', tol '+t+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.max(Math.abs(b),1e-300),
                          n+'  (got '+a+', want '+b+', reltol '+t+')');

  /* ---------- 1. J_m, against scipy ---------------------------------- */
  for(const [m,x,v] of JREF) close(besselJ(m,x),v,3e-14,'J'+m+'('+x+') (scipy)');
  for(const [m,x,v] of JPREF) close(besselJp(m,x),v,3e-14,"J'"+m+'('+x+') (scipy)');
  ok(besselJ(0,-3)===besselJ(0,3),'J0 is even');
  ok(besselJ(1,-3)===-besselJ(1,3),'J1 is odd');
  ok(besselJ(4,-2.5)===besselJ(4,2.5),'J4 is even');
  ok(besselJ(5,-2.5)===-besselJ(5,2.5),'J5 is odd');
  ok(besselJ(0,0)===1&&besselJ(1,0)===0&&besselJ(7,0)===0,'J_m(0) = delta(m,0)');
  /* the three regimes must AGREE where they overlap — a hand-rolled special
     function breaks at its own joins and nowhere else */
  for(const x of [7.7,7.9,7.99,8.0,8.01,8.3]) for(const m of [0,1,2,5])
    close(besselSeries(m,x),besselMiller(m,x),4e-14,
          'series and Miller agree at m='+m+', x='+x);
  for(const x of [44.5,44.9,45.0,45.1,46,60]) for(const m of [0,1,2,3])
    close(besselAsym(m,x),besselMiller(m,x),3e-13,
          'asymptotic and Miller agree at m='+m+', x='+x);
  /* the small-argument branch, at arguments that actually reach it */
  for(const m of [0,1,2,5,9]){
    let lead=1;
    for(let i=1;i<=m;i++) lead*=(1e-6/2)/i;
    rel(besselJ(m,1e-6),lead,1e-11,'J'+m+' reaches its leading term at x=1e-6');
  }
  /* J_m' by two routes */
  for(const [m,x] of [[0,2.2],[1,5.5],[4,9.0],[9,20.0]]){
    const e=1e-5, num=(besselJ(m,x+e)-besselJ(m,x-e))/(2*e);
    close(besselJp(m,x),num,1e-9,'J'+m+"' matches a central difference at x="+x);
  }
  /* the recurrence the whole construction rests on */
  for(const [m,x] of [[3,4.5],[7,11.0],[12,30.0]])
    close(besselJ(m-1,x)+besselJ(m+1,x),2*m/x*besselJ(m,x),1e-13,
          'the J recurrence holds at m='+m+', x='+x);

  /* ---------- 2. Gauss-Legendre, against numpy ----------------------- */
  {
    const gl=gaussLegendre(16);
    let wx=0, ww=0, sw=0;
    for(let i=0;i<16;i++){
      wx=Math.max(wx,Math.abs(gl.x[i]-GLREF[i][0]));
      ww=Math.max(ww,Math.abs(gl.w[i]-GLREF[i][1]));
      sw+=gl.w[i];
    }
    close(wx,0,2e-15,'Gauss-Legendre nodes (numpy leggauss)');
    close(ww,0,2e-15,'Gauss-Legendre weights (numpy leggauss)');
    close(sw,2,1e-15,'the weights sum to 2');
    /* it must be exact on polynomials of degree 31 and not on degree 32 */
    let e31=0, e32=0;
    for(let i=0;i<16;i++){ e31+=gl.w[i]*Math.pow(gl.x[i],30); e32+=gl.w[i]*Math.pow(gl.x[i],32); }
    close(e31,2/31,1e-14,'16-point GL is exact on x^30 (degree 30 <= 2n-1)');
    close(e32,0.060606059885598945,1e-15,
          'and is NOT exact on x^32 — it misses by 7.2e-10 (numpy)');
  }

  /* ---------- 3. e^-z I_m(z), against scipy -------------------------- */
  {
    const buf=new Float64Array(13);
    for(const [m,z,v] of IVEREF){
      iveAll(z,12,buf);
      rel(buf[m],v,3e-14,'ive('+m+','+z+') (scipy)');
    }
    iveAll(0,4,buf);
    ok(buf[0]===1&&buf[1]===0&&buf[4]===0,'I_m(0) = delta(m,0)');
    /* the identity that normalises it, checked independently */
    iveAll(9.0,60,buf.length>=61?new Float64Array(61):new Float64Array(61));
    const big=new Float64Array(61); iveAll(9.0,60,big);
    let s=big[0]; for(let m=1;m<=60;m++) s+=2*big[m];
    close(s,1,1e-13,'e^-z (I_0 + 2 sum I_m) = 1');
    /* the recurrence, as a second route */
    const b2=new Float64Array(9); iveAll(14.0,8,b2);
    for(const m of [2,4,6])
      close(b2[m-1]-b2[m+1],2*m/14*b2[m],1e-14,'the I recurrence holds at m='+m);
  }

  /* ---------- 4. the eigenvalues ------------------------------------- */
  for(const [m,n,v] of ZREF) close(besselZero(m,n),v,2e-12,'j('+m+','+n+') (scipy)');
  for(const [m,n,v] of NZREF){
    const dz=new Float64Array(n+1);
    for(let i=1;i<=n+1;i++) dz[i-1]=besselZero(m,i);
    close(besselPrimeZero(m,n,dz),v,2e-12,"j'("+m+','+n+') (scipy)');
  }
  /* round-trip: a zero is where the function vanishes, not where a series says */
  for(const [m,n] of [[0,1],[1,1],[3,4],[9,2],[16,6]]){
    close(besselJ(m,besselZero(m,n)),0,2e-13,'J'+m+' vanishes at j('+m+','+n+')');
    const dz=new Float64Array(n+1);
    for(let i=1;i<=n+1;i++) dz[i-1]=besselZero(m,i);
    const z=besselPrimeZero(m,n,dz);
    if(z>0) close(besselJp(m,z),0,2e-13,"J'"+m+" vanishes at j'("+m+','+n+')');
  }
  ok(besselPrimeZero(0,1,new Float64Array([besselZero(0,1),besselZero(0,2)]))===0,
     "j'(0,1) = 0 exactly — the rigid mode scipy's jnp_zeros omits");
  /* interlacing, which is what makes the bracketed solvers safe */
  {
    let bad=0;
    for(let m=0;m<=10;m++){
      const dz=new Float64Array(13);
      for(let i=1;i<=13;i++) dz[i-1]=besselZero(m,i);
      for(let n=1;n<=11;n++){
        const a=besselPrimeZero(m,n,dz), b=dz[n-1], c=besselPrimeZero(m,n+1,dz);
        if(!(a<b&&b<c)) bad++;
      }
    }
    ok(bad===0,"j'(m,n) < j(m,n) < j'(m,n+1) for every m<=10, n<=11");
  }
  /* J_0' = -J_1, so j'(0,n+1) must BE j(1,n) */
  {
    const dz=new Float64Array(9);
    for(let i=1;i<=9;i++) dz[i-1]=besselZero(0,i);
    for(let n=1;n<=6;n++)
      close(besselPrimeZero(0,n+1,dz),besselZero(1,n),2e-12,
            "j'(0,"+(n+1)+') = j(1,'+n+')');
  }

  /* ---------- 5. the Robin rim -------------------------------------- */
  {
    const mk=(m,n)=>{
      const dz=new Float64Array(n+2), nz=new Float64Array(n+1);
      for(let i=1;i<=n+2;i++) dz[i-1]=besselZero(m,i);
      for(let i=1;i<=n+1;i++) nz[i-1]=besselPrimeZero(m,i,dz);
      return {dz:dz,nz:nz};
    };
    for(const [m,n,B,v] of ROBREF){
      const t=mk(m,n);
      close(robinRoot(m,n,B,t.dz,t.nz),v,2e-12,
            'Robin root (m='+m+',n='+n+',B='+B+') (scipy)');
    }
    /* it must SOLVE its own equation */
    for(const [m,n,B] of [[0,1,0.3],[2,2,4.0],[5,3,40.0]]){
      const t=mk(m,n), x=robinRoot(m,n,B,t.dz,t.nz);
      close(x*besselJp(m,x)+B*besselJ(m,x),0,2e-12,
            'the Robin root solves x J\' + B J = 0 (m='+m+')');
    }
    /* the two limits, taken NUMERICALLY rather than asserted as a formula */
    for(const [m,n] of [[0,1],[1,2],[4,3]]){
      const t=mk(m,n);
      /* m=0,n=1 approaches its Neumann root (which is 0) as sqrt(2B), not
         linearly, so it needs a smaller B to reach the same tolerance */
      const Bsmall=(m===0&&n===1)?1e-18:1e-9;
      close(robinRoot(m,n,Bsmall,t.dz,t.nz),t.nz[n-1],1e-8,
            'B -> 0 recovers the Neumann root (m='+m+')');
      close(robinRoot(m,n,1e11,t.dz,t.nz),t.dz[n-1],1e-8,
            'B -> inf recovers the Dirichlet root (m='+m+')');
    }
    /* monotone in B — the slider must not fold the spectrum back on itself */
    {
      const t=mk(1,2);
      let mono=true, prev=-1;
      for(let e=-3;e<=3;e+=0.25){
        const x=robinRoot(1,2,Math.pow(10,e),t.dz,t.nz);
        if(x<=prev) mono=false;
        prev=x;
      }
      ok(mono,'the Robin root increases strictly with B');
    }
    /* B = 0 EXACTLY is a separate branch: the bracket [j'(m,n), j(m,n)] has its
       root at the lower end, where bisection has no sign change to work with,
       so the Neumann root is returned directly.  Nothing in the UI can produce
       B = 0 (it is 10^slider), so no test reached that line and the mutation
       sweep reported it as a survivor — which is exactly what a survivor is
       for.  It is a real guard, not dead code, so it gets a real test. */
    for(const [m,n] of [[0,1],[1,1],[3,4]]){
      const t=mk(m,n);
      ok(robinRoot(m,n,0,t.dz,t.nz)===t.nz[n-1],
         'B = 0 exactly returns the Neumann root (m='+m+',n='+n+')');
      ok(robinRoot(m,n,-1,t.dz,t.nz)===t.nz[n-1],'and so does a negative B');
      ok(robinRoot(m,n,Infinity,t.dz,t.nz)===t.dz[n-1],
         'B = Infinity returns the Dirichlet root (m='+m+')');
    }
    /* the small-B branch: x ~ sqrt(2B) for m=0,n=1, which is the only place a
       drum with a nearly-free rim gets its lowest breathing mode */
    {
      const t=mk(0,1);
      for(const B of [1e-6,1e-4]){
        const x=robinRoot(0,1,B,t.dz,t.nz);
        rel(x,Math.sqrt(2*B),2e-3,'the nearly-free m=0 root follows sqrt(2B), B='+B);
      }
    }
  }

  /* ---------- 6. the norm, two ways --------------------------------- */
  for(const [m,x,v] of LOMREF){
    close(lommelNorm(m,x),v,1e-14,'Lommel norm (m='+m+', x='+x+') (scipy)');
    /* and by direct quadrature — the identity is not assumed */
    const NQ=6000;
    let acc=0;
    for(let i=0;i<NQ;i++){
      const r=(i+0.5)/NQ, j=besselJ(m,x*r);
      acc+=j*j*r;
    }
    close(lommelNorm(m,x),acc/NQ,1e-7,
          'the Lommel identity matches a direct integral (m='+m+')');
  }
  close(lommelNorm(0,0),0.5,0,'the k=0 rigid mode has norm 1/2');

  /* ---------- 7. the strike, two ways -------------------------------- */
  {
    const MT=modeTable('clamped',0,10,7);
    const byPair={};
    for(let q=0;q<MT.modes.length;q++) byPair[MT.modes[q].m+','+MT.modes[q].n]=q;
    for(const [m,n,r0,s,v] of CREF){
      const CO=strikeCoeffs(MT,r0,s);
      close(CO.C[byPair[m+','+n]],v,2e-11,
            'C('+m+','+n+') at r0='+r0+', s='+s+' (scipy)');
    }
    for(const [r0,s,v] of EREF){
      const CO=strikeCoeffs(MT,r0,s);
      rel(CO.eTot,v,1e-9,'int v^2 dA at r0='+r0+', s='+s+' (scipy)');
    }
    /* the SAME projection by brute-force 2-D midpoint rule.  The closed form
       collapses the angular integral with I_m; this does not, so agreement
       tests the identity rather than the arithmetic. */
    const r0=0.55, s=0.09, Nr=1500, Nth=192;
    for(const [m,n] of [[0,1],[1,1],[3,2],[6,3]]){
      const x=besselZero(m,n), eps=(m===0?TAU:PI);
      let num=0;
      for(let i=0;i<Nr;i++){
        const r=(i+0.5)/Nr;
        let ang=0;
        for(let j=0;j<Nth;j++){
          const th=TAU*(j+0.5)/Nth;
          const d2=r*r+r0*r0-2*r*r0*Math.cos(th);
          ang+=Math.exp(-d2/(2*s*s))*Math.cos(m*th);
        }
        num+=ang*(TAU/Nth)*besselJ(m,x*r)*r;
      }
      num/=Nr;
      const want=num/(eps*lommelNorm(m,x));
      const got=strikeCoeffs(MT,r0,s).C[byPair[m+','+n]];
      rel(got,want,3e-6,'the closed-form projection matches a brute-force 2-D one, ('
          +m+','+n+')');
    }
    /* a strike dead centre can excite NOTHING with angular structure */
    {
      const CO=strikeCoeffs(MT,0,0.12);
      let worst=0;
      for(let q=0;q<MT.modes.length;q++)
        if(MT.modes[q].m>0) worst=Math.max(worst,Math.abs(CO.C[q]));
      ok(worst===0,'a centred strike excites no m>0 mode at all');
    }
    /* and the m=0 coefficients then have a closed form of their own:
       int_0^inf exp(-r^2/2s^2) J_0(kr) r dr = s^2 exp(-k^2 s^2/2)   */
    {
      const s0=0.12, CO=strikeCoeffs(MT,0,s0);
      for(const n of [1,2,3]){
        const k=besselZero(0,n);
        const want=TAU*s0*s0*Math.exp(-k*k*s0*s0/2)/(TAU*lommelNorm(0,k));
        rel(CO.C[byPair['0,'+n]],want,1e-9,
            'the centred m=0 coefficient matches its closed form, n='+n);
      }
    }
    /* energy: what went in must be what the modes hold, once enough are kept */
    {
      const MTb=modeTable('clamped',0,22,20);
      const CO=strikeCoeffs(MTb,0.3,0.22);
      rel(CO.captured,1,3e-3,'a wide mallet is captured essentially completely');
      const CO2=strikeCoeffs(MTb,0.85,0.05);
      ok(CO2.captured>0.5&&CO2.captured<0.99,
         'a small mallet near the rim is NOT, and the number says so');
    }
  }

  /* ---------- 8. the free field ------------------------------------- */
  {
    const md={kind:'membrane',c:1.0};
    const FF=freeField(md,0.10,3.0,2.5);
    const prof=new Float64Array(NFR+1);
    for(const [j,t,v] of FFREF){
      freeFieldAt(FF,t,true,prof);
      close(prof[j],v,3e-9,'free field u(r='+(j/32)+',t='+t+') (scipy)');
    }
    /* and the linear interpolation between grid points, which is what the
       drawing actually uses, is bounded — it is NOT at quadrature accuracy,
       and asserting it at 3e-9 was the first thing this suite got wrong */
    {
      freeFieldAt(FF,1.2,true,prof);
      let worst=0;
      for(let j=0;j+1<=NFR;j++){
        const rmid=3.0*(j+0.5)/NFR;
        worst=Math.max(worst,Math.abs(sampleFF(FF,prof,rmid)
                                      -0.5*(prof[j]+prof[j+1])));
      }
      ok(worst<1e-18,'sampleFF at a midpoint IS the mean of its neighbours');
      const r=29/32;
      close(sampleFF(FF,prof,r),prof[29],1e-15,'and is exact on grid points');
    }
    /* the composite quadrature against the SAME integral done finely, so the
       quadrature is tested and not just the formula */
    {
      freeFieldAt(FF,0.6,true,prof);
      const r=0.5, s=0.10, N=120000, K=9.5/s;
      let acc=0;
      for(let i=0;i<N;i++){
        const k=(i+0.5)*K/N;
        acc+=Math.exp(-k*k*s*s/2)*besselJ(0,k*r)*Math.sin(k*0.6);
      }
      close(sampleFF(FF,prof,r),s*s*acc*(K/N),1e-9,
            '48x16 Gauss-Legendre matches a 120000-point Riemann sum');
    }
    /* POISSON'S FORMULA — a completely different construction.  Its constant
       is pinned by g == 1, for which u == t exactly, so this is not circular. */
    {
      let acc=0;
      const Nf=500, Np=500;
      for(let i=0;i<Nf;i++){
        const ph=(i+0.5)*(PI/2)/Nf;
        acc+=Math.sin(ph)*Np;
      }
      close((0.7/TAU)*acc*((PI/2)/Nf)*(TAU/Np),0.7,1e-5,
            'Poisson: a uniform initial velocity gives u = t exactly');
      for(const [r,t] of [[0.5,0.6],[1.5,1.2],[0.0,0.3]]){
        freeFieldAt(FF,t,true,prof);
        rel(poisson2D(r,t,0.10,1.0,600,600),sampleFF(FF,prof,r),
            r===0?4e-5:2e-5,
            'the Hankel transform matches Poisson\'s formula at r='+r+', t='+t);
      }
    }
    /* THE WAKE.  Behind the front u -> s^2/(c^2 t), and the point of the test
       is that it does NOT go to zero — which is Huygens failing in 2-D. */
    for(const t of [4.0,8.0,16.0]){
      const FF2=freeField(md,0.10,0.02,17);
      const p2=new Float64Array(NFR+1);
      freeFieldAt(FF2,t,true,p2);
      rel(p2[0],0.01/t,3e-3,'the 2-D wake follows s^2/(c^2 t) at t='+t);
    }
    /* The free-field wave is centred on the STRIKE POINT, not on the drum, so
       the crest along theta = 0 is at r0 + ct.  The 3-D view drew its r = ct
       circle about the origin instead, nowhere near the ring it was marking. */
    {
      const Mo=buildModel(Object.assign({},DEFAULTS,{bc:'open',quality:'coarse'}));
      const t=0.006, prof2=new Float64Array(NFR+1);
      freeFieldAt(Mo.FF,t,Mo.struck,prof2);
      /* find the crest of |u| along theta = 0, measured from the DRUM centre */
      let best=-1, bestR=0;
      for(let j=1;j<NFR;j++){
        const r=Mo.ffR*j/NFR, d=Math.abs(r-Mo.r0f*Mo.a);
        const v=Math.abs(sampleFF(Mo.FF,prof2,d));
        if(v>best){ best=v; bestR=r; }
      }
      const want=(Mo.r0f*Mo.a+Mo.c*t)/Mo.a;
      close(bestR/Mo.a,want,0.08,'the crest sits at r0 + ct along theta = 0');
      ok(Math.abs(bestR/Mo.a-Mo.c*t/Mo.a)>0.5,
         'and NOT at ct, which is where the marker used to be drawn');
    }
    /* the other two dimensions, for contrast */
    {
      const Mfake={ffS:0.10,c:1.0};
      /* 1-D: u -> (1/2c) INT g = s sqrt(2 pi) / 2c.  An ABSOLUTE value, so
         mutating the constant is caught; and it must be reached and then held. */
      const plateau=0.10*Math.sqrt(TAU)/2;
      for(const t of [1.0,4.0,16.0]){
        close(huygens1D(Mfake,0,t),plateau,1e-13,
              '1-D sits on the plateau s sqrt(2 pi)/2c at t='+t);
      }
      ok(huygens1D(Mfake,0,0.05)<0.4*plateau,'and has not reached it early');
      /* 3-D.  For a source of COMPACT support the response is identically zero
         once the sphere r = ct has cleared it; a Gaussian has no compact
         support, so what is true here is that it dies as exp(-(ct)^2/2s^2) —
         a Gaussian, not a power.  Asserting "=== 0" would have been asserting
         the underflow threshold of a double, which is not physics. */
      {
        const md={kind:'membrane',c:1.0};
        const FFw=freeField(md,0.10,0.02,17), pw=new Float64Array(NFR+1);
        for(const t of [1.0,2.0]){
          freeFieldAt(FFw,t,true,pw);
          /* 1e-12, not 1e-15: at t=2 the exponent is -200, and 2*s*s with
             s=0.10 differs from 0.02 by one ulp, which moves exp() by 4e-14.
             Tightening this would be asserting how a double rounds. */
          rel(huygens3D(Mfake,0,t),t*Math.exp(-t*t/(2*0.01)),1e-12,
              '3-D follows t exp(-(ct)^2/2s^2) at t='+t);
          ok(huygens3D(Mfake,0,t)/pw[0]<1e-15,
             'and is 15+ orders below the 2-D wake at the same instant, t='+t);
        }
        /* the SHAPES of the two decays, which is the whole claim */
        const r2=(function(){ freeFieldAt(FFw,8,true,pw); const a=pw[0];
                              freeFieldAt(FFw,16,true,pw); return a/pw[0]; })();
        rel(r2,2,3e-3,'the 2-D wake halves when t doubles — a power law');
        const r3=huygens3D(Mfake,0,0.5)/huygens3D(Mfake,0,1.0);
        ok(r3>1e15,'the 3-D response falls by 15+ orders over the same doubling');
      }
      /* and the r -> 0 branch of the spherical mean, which nothing else reaches */
      for(const t of [0.05,0.12]){
        const R=t;
        close(huygens3D(Mfake,0,t),t*Math.exp(-R*R/(2*0.01)),1e-15,
              'the 3-D r->0 branch is t exp(-(ct)^2/2s^2), t='+t);
        const eps=1e-7;
        rel(huygens3D(Mfake,eps,t),huygens3D(Mfake,0,t),1e-6,
            'and it joins the general form, t='+t);
      }
    }
  }

  /* ---------- 9. water ---------------------------------------------- */
  {
    const T=WATER_SIGMA/WATER_RHO;
    /* These come off a BUILT MODEL, not from re-typing the formula here.
       Three mutants survived the first sweep — the c_min exponent, its
       leading 4, and the k_min ratio — because the test computed its own copy
       and asserted that, while buildModel's kMin/cMin (the numbers the readout
       and the droplet view actually print) were never touched by any
       assertion.  A test that re-derives the thing it is testing tests
       nothing. */
    const Mw=buildModel(Object.assign({},DEFAULTS,{view:'droplet'}));
    const kmin=Mw.kMin, cmin=Mw.cMin;
    rel(kmin,WREF.kmin,1e-14,'the model\'s k_min = sqrt(rho g / sigma) (scipy)');
    rel(cmin,WREF.cmin,1e-14,'the model\'s c_min = (4 g sigma / rho)^1/4 (scipy)');
    rel(Mw.lamMin,WREF.lam,1e-14,'the model\'s lambda there is 17.13 mm (scipy)');
    ok(!Mw.struck,'a drop is an initial DISPLACEMENT, not an impulse');
    rel(Mw.amp,0.6*DEFAULTS.dropR*1e-3,1e-15,'and its crater is 0.6 drop radii deep');
    const cp=k=>Math.sqrt(G_ACC/k+T*k);
    const cg=k=>(G_ACC+3*T*k*k)/(2*Math.sqrt(G_ACC*k+T*k*k*k));
    close(cp(kmin),cmin,1e-15,'c_p at k_min IS c_min');
    /* at a stationary point of c_p the group speed equals it — a genuine
       identity, and a check that both are differentiated consistently */
    close(cg(kmin),cp(kmin),1e-12,'c_g = c_p at the phase-speed minimum');
    /* c_p really is minimal there, taken numerically */
    let below=0;
    for(let i=0;i<400;i++){
      const k=kmin*Math.pow(10,-1.5+3*i/399);
      if(cp(k)<cmin-1e-12) below++;
    }
    ok(below===0,'nothing is slower than c_min, over three decades of k');
    const gm=waterCgMin();
    /* 1e-4, not 1e-6, and the reason is worth stating: c_g is now a symmetric
       DIFFERENCE of omega, good to ~1e-10, and a minimum located by a function
       carrying noise eps is only located to sqrt(eps) — 1e-5 here.  The VALUE
       at the minimum keeps the full 1e-10 precisely because it is a minimum,
       so the two tolerances differ by four orders and both are right. */
    rel(gm.k,WREF.kcg,1e-4,'the group-speed minimum is at k = 144.23 /m (scipy)');
    rel(gm.cg,WREF.cgmin,1e-10,'and c_g,min = 17.76 cm/s (scipy)');
    ok(gm.cg<cmin,'the group minimum is slower than the phase minimum');
    /* the deep-water limits, taken numerically */
    rel(cg(1e-3)/cp(1e-3),0.5,1e-5,'deep gravity: c_g/c_p -> 1/2');
    rel(cg(1e6)/cp(1e6),1.5,1e-5,'deep capillary: c_g/c_p -> 3/2');
    /* shallow water is NON-dispersive — the same limit as the membrane */
    for(const hh of [0.002,0.01]){
      const md={kind:'water',T:T,h:hh};
      const k=1e-4;
      rel(omegaOf(k,md)/k,Math.sqrt(G_ACC*hh),1e-9,
          'shallow water gives c = sqrt(gh) at h='+hh);
    }
    for(const [k,hh,v] of WOMREF)
      rel(omegaOf(k,{kind:'water',T:T,h:hh}),v,1e-13,
          'omega('+k+') at h='+hh+' (scipy)');
    /* DEPTH.  waterCp/waterCg take the depth, because the depth slider has to
       mean something on the dispersion curve as well as in the propagation —
       drawn deep, the curve showed 87 cm/s gravity waves on 1 mm of water. */
    for(const hh of [0.001,0.005,0.02]){
      const k=1e-3;                      /* kh << 1: shallow, non-dispersive */
      rel(waterCp(k,hh),Math.sqrt(G_ACC*hh),2e-6,
          'shallow c_p -> sqrt(gh) at h='+hh);
      rel(waterCg(k,hh),Math.sqrt(G_ACC*hh),2e-5,
          'and c_g -> sqrt(gh) too: NON-dispersive, at h='+hh);
      rel(waterCg(k,hh)/waterCp(k,hh),1,2e-5,'so c_g/c_p -> 1 there, h='+hh);
    }
    for(const k of [10,300,3000]){
      rel(waterCp(k),cp(k),1e-14,'the default depth is deep, c_p at k='+k);
      rel(waterCg(k),cg(k),1e-8,'and c_g matches the closed deep form at k='+k);
      rel(waterCp(k,50),cp(k),1e-12,'h = 50 m is deep too, k='+k);
    }
    ok(waterCgMin(0.002).cg<waterCgMin().cg,
       'and in 2 mm of water the slowest group speed is slower than deep water');
    rel(waterCgMin(0.002).cg,Math.sqrt(G_ACC*0.002),0.02,
       'in fact it approaches sqrt(gh)');
    /* THE CALM HOLE: no group speed is below c_g,min, so inside r = c_g,min t
       the surface must be quiet.  This is a prediction, so test it. */
    {
      const hh=0.06;
      const md={kind:'water',T:T,h:hh};
      const ss=0.003, FF=freeField(md,ss,1.2,1.5);
      const p=new Float64Array(NFR+1);
      const t=1.4;
      freeFieldAt(FF,t,false,p);
      const rHole=waterCgMin(hh).cg*t;
      let inn=0, ni=0, out=0, no=0;
      for(let j=0;j<=NFR;j++){
        const r=1.2*j/NFR, v=p[j];
        if(r>0.25*rHole&&r<0.75*rHole){ inn+=v*v; ni++; }
        else if(r>1.25*rHole&&r<2.2*rHole){ out+=v*v; no++; }
      }
      const ri=Math.sqrt(inn/Math.max(ni,1)), ro=Math.sqrt(out/Math.max(no,1));
      ok(ri<0.12*ro,'inside r = c_g,min t the water is calm (rms '
        +ri.toExponential(2)+' against '+ro.toExponential(2)+')');
    }
    /* ...and again at the settings the VIEW actually uses.  The first version
       of this test picked its own s, R and t and passed while the default
       droplet was visibly full of quadrature noise inside the hole, because
       48 panels cannot resolve a 3400-radian phase.  Test what ships. */
    {
      const Mv=buildModel(Object.assign({},DEFAULTS,{view:'droplet'}));
      const p=new Float64Array(NFR+1), t=0.5;
      freeFieldAt(Mv.FF,t,Mv.struck,p);   /* NOT a hardcoded false: test what ships */
      const rHole=waterCgMin(Mv.med.h).cg*t;
      let inn=0,ni=0,out=0,no=0;
      for(let j=0;j<=NFR;j++){
        const r=Mv.ffR*j/NFR, v=p[j];
        if(r>0.25*rHole&&r<0.75*rHole){ inn+=v*v; ni++; }
        else if(r>1.25*rHole&&r<Mv.ffR){ out+=v*v; no++; }
      }
      const ri=Math.sqrt(inn/Math.max(ni,1)), ro=Math.sqrt(out/Math.max(no,1));
      ok(ni>4&&no>4,'the default droplet view spans the hole and beyond it');
      ok(ri<0.15*ro,'and at the DEFAULT drop the hole is calm too (rms '
        +ri.toExponential(2)+' vs '+ro.toExponential(2)+', '+Mv.FF.panels+' panels)');
      ok(Mv.FF.panels>100,'which needs more than 100 k-panels, not the fixed 48');
    }
  }

  /* ---------- 10. the time factor and the loss ---------------------- */
  for(const t of [0.3,0.7,2.0]){
    close(timeFactor(0,t,true),t,0,'sin(wt)/w is exactly t at w=0, t='+t);
    for(const w of [1e-5,1e-4,3e-4]) /* straddles the series branch at 1e-4 */
      rel(timeFactor(w,t,true),Math.sin(w*t)/w,1e-13,
          'the small-w branch joins sin(wt)/w at w='+w+', t='+t);
    /* ...and OUTSIDE the branch it must be the direct form, to a tolerance the
       series could not meet.  The series carries terms to a^4, so it departs
       from sin(a)/w by a^6/5040 — 1e-10 at a = 0.09.  Without this, widening
       the branch threshold from 1e-4 to 1e-1 changed nothing any test saw. */
    for(const a of [0.02,0.09]){
      const w=a/t;
      rel(timeFactor(w,t,true),Math.sin(a)/w,1e-12,
          'above the branch it is sin(wt)/w exactly, wt='+a);
      const ser=t*(1-a*a/6*(1-a*a/20));
      ok(Math.abs(ser-Math.sin(a)/w)>1e-13*t||a<0.03,
         'and the series would have been measurably wrong there, wt='+a);
    }
  }
  close(timeFactor(3.0,0,true),0,0,'a struck membrane starts at rest');
  close(timeFactor(3.0,0,false),1,0,'a released one starts displaced');
  {
    const e=1e-7;
    rel((timeFactor(5.0,e,true)-timeFactor(5.0,0,true))/e,1,1e-6,
        'and the struck one starts with unit velocity');
  }
  close(decayRate(100,100,1.5,2),Math.log(1000)/1.5,1e-12,
        'T60 means 60 dB: alpha = ln(1000)/T60');
  close(Math.exp(-decayRate(100,100,1.5,2)*1.5),0.001,1e-15,
        'and after T60 the amplitude is exactly 1/1000');
  close(decayRate(200,100,1.5,2),4*Math.log(1000)/1.5,1e-12,
        'the loss exponent p=2 quadruples alpha at twice the frequency');
  close(decayRate(500,100,1.5,0),Math.log(1000)/1.5,1e-12,'p=0 is uniform loss');

  /* ---------- 11. the model ----------------------------------------- */
  {
    /* the tuning must be a round trip: ask for a pitch, get that pitch */
    for(const [pm,f] of [['11',146.832],['01',330.0],['11',73.4],['01',880.0]]){
      const st=Object.assign({},DEFAULTS,{pmode:pm,pitch:f,bc:'clamped',quality:'coarse'});
      const M=buildModel(st);
      const want=(pm==='11')?besselZero(1,1):besselZero(0,1);
      const got=M.spec.find(z=>Math.abs(z.x-want)<1e-9);
      rel(got.f,f,1e-12,'the head is tuned to exactly the pitch asked for ('+f+' Hz)');
    }
    /* THE HEAD ITSELF, against absolute numbers.  Three mutants survived the
       first sweep — dropping the /2 that turns diameter into radius, the inch
       and the mil — because every FREQUENCY in this file is invariant to both:
       the tension is solved from the pitch, so a doubles c and cancels, and
       sigma cancels through T = sigma c^2.  Nothing that only checks
       frequencies can ever see those errors.  What they DO change is the
       tension, the wave speed and every length on the canvas. */
    {
      const M=buildModel(Object.assign({},DEFAULTS,{quality:'coarse'}));
      rel(M.a,0.3302,1e-15,'a 26 inch head has radius 0.3302 m exactly');
      rel(2*M.a/0.0254,26,1e-13,'and converting back gives 26 inches');
      rel(M.sigma,0.264795,1e-15,'7.5 mil Mylar is 0.264795 kg/m^2');
      rel(M.c,79.50335865002671,1e-12,'so c is 79.503 m/s (scipy)');
      rel(M.T,1673.7120089807058,1e-11,'and the tension is 1673.7 N/m (scipy)');
      rel(M.T,M.sigma*M.c*M.c,1e-12,'T = sigma c^2, closed');
      const Ms=buildModel(Object.assign({},DEFAULTS,{dia:14,gauge:10,pitch:330,
        pmode:'01',quality:'coarse'}));
      rel(Ms.a,0.17779999999999999,1e-15,'a 14 inch head is 0.1778 m');
      rel(Ms.sigma,0.35306,1e-15,'10 mil Mylar is 0.35306 kg/m^2');
      rel(Ms.c,153.2999404192514,1e-12,'and c is 153.30 m/s (scipy)');
      rel(Ms.T,8297.217773892702,1e-11,'tension 8297.2 N/m (scipy)');
    }
    /* the invariance those mutants exploited, asserted deliberately so that it
       is a stated property rather than a blind spot */
    {
      const A=buildModel(Object.assign({},DEFAULTS,{dia:26,gauge:7.5,quality:'coarse'}));
      const Bm=buildModel(Object.assign({},DEFAULTS,{dia:13,gauge:15,quality:'coarse'}));
      for(let i=0;i<8;i++)
        rel(Bm.spec[i].f,A.spec[i].f,1e-12,
            'the spectrum is invariant to radius and density once tuned, i='+i);
      rel(Bm.a/A.a,0.5,1e-15,'even though the radius halved');
      rel(Bm.T/A.T,0.5,1e-12,'and the tension did not follow it');
    }
    /* one water speed, defined once */
    {
      const k=300;
      rel(waterCp(k),Math.sqrt(G_ACC/k+WATER_SIGMA/WATER_RHO*k),1e-15,'c_p');
      const e=1e-4, T2=WATER_SIGMA/WATER_RHO;
      const om=q=>Math.sqrt(G_ACC*q+T2*q*q*q);
      rel(waterCg(k),(om(k+e)-om(k-e))/(2*e),1e-8,
          'c_g really is d(omega)/dk, by finite difference');
    }
    /* and the mode SHAPES do not depend on the tuning at all */
    {
      const A=buildModel(Object.assign({},DEFAULTS,{pitch:100,quality:'coarse'}));
      const B=buildModel(Object.assign({},DEFAULTS,{pitch:700,quality:'coarse'}));
      let w=0;
      for(let q=0;q<A.MT.modes.length;q++)
        for(let i=0;i<=NRD;i++)
          w=Math.max(w,Math.abs(A.MT.modes[q].disp[i]-B.MT.modes[q].disp[i]));
      close(w,0,0,'the mode shapes are independent of the tension');
      rel(B.c/A.c,7,1e-12,'and c scales exactly with the pitch');
      rel(B.T/A.T,49,1e-12,'so the tension scales with its square');
    }
    /* the ratios ARE the Bessel zeros — the headline claim of the whole file */
    {
      const M=buildModel(Object.assign({},DEFAULTS,{quality:'normal',bc:'clamped'}));
      const sp=M.spec.filter(z=>z.f>1e-9);
      const want=[1,1.593340505695,2.135548786649,2.295417267428,2.653066404549,
                  2.917295455117,3.155464815408,3.500147490309];
      for(let i=0;i<want.length;i++)
        rel(sp[i].f/sp[0].f,want[i],1e-12,'overtone ratio '+(i+1)+' (scipy)');
    }
    /* Weyl's law against the exact staircase */
    {
      for(const [k,N] of WEYLREF){
        const got=countBelowExact(k);
        ok(got===N,'the complete mode count below ka='+k+' is '+N+' (scipy), got '+got);
        ok(Math.abs(got-weyl(k))<3.0,'and Weyl is within 3 of it at ka='+k);
      }
      /* the TRUNCATED table must NOT be used for this, and the file knows how
         far it is complete.  At ka=40 the fine table misses 42 modes of 380. */
      const M=buildModel(Object.assign({},DEFAULTS,{quality:'fine'}));
      const lim=completeTo(M);
      rel(lim,Math.min(besselZero(M.M+1,1),besselZero(0,M.N+1)),0,
          'completeTo is the first eigenvalue the table lacks');
      ok(countBelow(M,lim-0.01)===countBelowExact(lim-0.01),
         'below that bound the truncated table agrees with the complete one');
      ok(countBelow(M,40)<countBelowExact(40),
         'and above it the truncated table under-counts, as it must');
    }
    /* air loading: derived, so its own limits must hold */
    {
      const M=buildModel(Object.assign({},DEFAULTS,{quality:'coarse'}));
      const x=besselZero(1,1);
      /* for sigma >> rho_air/k the shift is (1/2) rho_air/(sigma k) to leading
         order — asserting the FORM pins the model, where a bare limit does not */
      for(const sc of [1e3,1e5]){
        const heavy=Object.assign({},M,{sigma:M.sigma*sc,T:M.T*sc});
        const bare=x/M.a*Math.sqrt(heavy.T/heavy.sigma)/TAU;
        const k=x/M.a;
        rel((bare-loadedFreq(heavy,x))/bare,0.5*RHO_AIR/(heavy.sigma*k),3e-3,
            'the air-load shift is rho_air/(2 sigma k) to leading order, x'+sc);
      }
      ok(loadedFreq(M,x)<x*M.c/(TAU*M.a),'and it always lowers the frequency');
      const r1=loadedFreq(M,besselZero(2,1))/loadedFreq(M,x);
      const r0v=besselZero(2,1)/x;

  /* ---------- 13. the sound, and the clock ---------------------------- */
  {
    /* LAMBDA_m(x,y) against scipy quadrature of the integrand itself */
    for(const [m,x,y,v] of LAMREF)
      close(lommelCross(m,x,y),v,2e-13,'Lambda_'+m+'('+x+','+y+') (scipy)');
    /* and against composite Gauss-Legendre of the integrand in THIS file —
       a route through besselJ alone, never through the closed form */
    {
      const gl=gaussLegendre(16); let worst=0;
      for(const [m,x,y] of [[0,2.404825557695773,0.4],[1,3.831705970207512,3.0],
                            [3,9.761023129981668,8.0],[4,20,15],[7,40,25],[2,12,11.5]]){
        let acc=0; const NP=24;

    {
      let worst=0;
      for(const [m,x,y] of [[0,2.404825557695773,0.4],[1,3.831705970207512,0.63],[2,5.135622301840683,4.9],

      rel(lommelCross(0,x,0),besselJ(1,x)/x,1e-14,'Lambda_0(x,0) = J_1(x)/x, the mode\'s volume');

      ok(lommelCross(m,besselZero(m,1),0)===0,'straight above the drum m='+m+' is silent');

      for(const [m,n,x,al] of RADREF)

      const a01=radAlpha(0,RADREF[0][2],c*RADREF[0][2]/a,a,sigma);
      const a11=radAlpha(1,RADREF[1][2],c*RADREF[1][2]/a,a,sigma);
      ok(a01>7*a11,'(0,1) radiates its energy several times faster than (1,1): the thump, then the note');
      /* a supersonic head, where y crosses x inside the integral */

      const x=besselZero(0,1), w=c*x/a, cbig=1e6;

      const E=0.5*sigma*w*w*TAU*a*a*lommelNorm(0,x);
      rel(radAlpha(0,x,w,a,sigma,cbig),P/(2*E),1e-7,'k0 a -> 0: the baffled monopole, P/2E');
      /* and the model carries it: with the switch on every alpha grows, by the table */
      const st0=Object.assign({},DEFAULTS,{quality:'coarse'});
      const M0=buildModel(st0), M1=buildModel(Object.assign({},st0,{radLoss:true}));
      let grew=true, exact=true;
      for(let q=0;q<M0.alpha.length;q++){

      ok(grew&&exact,'radiation loss adds to every mode\'s decay and changes nothing else');
      ok(M0.alphaRad===null,'and is absent when the switch is off');
      const z01=M1.spec.find(q=>q.m===0&&q.n===1), z11=M1.spec.find(q=>q.m===1&&q.n===1);
      rel(M1.alphaRad[z01.i],RADREF[0][3],1e-9,'the model\'s (0,1) rate is the table\'s');

    {
      const st=Object.assign({},DEFAULTS,{preset:'pad',dia:26,gauge:7.5,pitch:100,pmode:'01',

      const M=buildModel(st);
      const z=M.spec.find(q=>q.m===0&&q.n===1);

      const snd2=renderSound(M,{pickup:'air',theta:0,micR:0,single:z},fs,0.1);
      const P0=RHO_AIR*M.a*M.a/R_LISTEN*TAU*lommelCross(0,z.x,0)*Math.pow(z.f*TAU,2)*1e-3;
      rel(snd2.peak,P0,2e-6,'in the air the same mode arrives as rho a^2 2pi Lambda_0 w^2 u / R');
      const z2=M.spec.find(q=>q.m===1&&q.n===1);
      const snd3=renderSound(M,{pickup:'air',theta:0,micR:0,single:z2},fs,0.05);
      ok(snd3.used===0&&snd3.peak===0,'and an m = 1 mode is silent on the axis');
      const snd4=renderSound(M,{pickup:'air',theta:45*DEG,micR:0,single:z2},fs,0.05);
      ok(snd4.used===1&&snd4.peak>0,'but is heard 45 degrees off it');
      /* the 1 mm rule for a mode whose J_m peaks below 1 */
      const snd7=renderSound(M,{pickup:'head',theta:0,micR:0.4,single:z2},fs,0.05);
      let jm=0; for(const v of M.MT.modes[z2.i].disp) jm=Math.max(jm,Math.abs(v));
      rel(snd7.peak,1e-3*z2.f*TAU*Math.abs(besselJ(1,z2.x*0.4))/jm,2e-6,
          '(1,1) alone at 1 mm: velocity 1e-3 w J_1(0.4 x) / max|J_1|');
      /* released rather than struck: the head starts from rest, so the mic
         hears nothing at t = 0 while the pressure — an acceleration — peaks */
      const Mp=buildModel(Object.assign({},st,{strike:'pressed'}));
      const snd5=renderSound(Mp,{pickup:'head',theta:0,micR:0.4,single:z},fs,0.05);
      ok(Math.abs(snd5.y[0])<1e-6*snd5.peak,'a released head starts from rest under the mic');
      const snd6=renderSound(Mp,{pickup:'air',theta:0,micR:0,single:z},fs,0.05);
      rel(Math.abs(snd6.y[0]),snd6.peak,1e-6,'and its pressure is at its peak at t = 0');
      ok(Math.abs(snd.y[0]-A)<2e-6*A,'a struck one starts at peak velocity');
    }
    /* the whole strike: the recurrence agrees with a direct evaluation of the
       same sum, damped, at scattered samples — two routes to one signal */
    {
      const st=Object.assign({},DEFAULTS,{quality:'coarse',radLoss:true,tau:0});
      const M=buildModel(st);
      const fs=44100, opt={pickup:'air',theta:0.7,micR:0,single:null};
      const snd=renderSound(M,opt,fs,0.25);
      const mds=snd.modes; let worst=0;
      const n0=snd.n-Math.round(0.03*fs);
      for(const k of [0,1,17,500,3333,7000,n0-1]){

         +(worst/snd.peak).toExponential(1)+' of the peak)');
      ok(snd.used+snd.dropped===mds.filter(md=>md.zr!==0||md.zi!==0).length,

         picture, and the air the exact second derivative — real algebra
         against the complex (iw - alpha)^d in the code */
      const Md=buildModel(Object.assign({},DEFAULTS,{quality:'coarse',tau:0}));
      const rho=0.61, hs=2e-8;
      const sh=renderSound(Md,{pickup:'head',theta:0,micR:rho,single:null},fs,0.1);
      const ud=t=>{ let u=0;
        for(let q=0;q<Md.MT.modes.length;q++){ const md=Md.MT.modes[q];
          if(Md.CO.C[q]===0) continue;
          u+=Md.CO.C[q]*Md.amp*besselJ(md.m,md.x*rho)*timeFactor(Md.w[q],t,true)*Math.exp(-Md.alpha[q]*t); }

      ok(w4<3e-5*sh.peak,'damped, the mic hears d/dt of the damped picture ('+(w4/sh.peak).toExponential(1)+')');
      const sa=renderSound(Md,{pickup:'air',theta:0,micR:0,single:null},fs,0.1);
      const pd=t=>{ let p=0;
        for(let q=0;q<Md.MT.modes.length;q++){ const md=Md.MT.modes[q];
          if(md.m!==0||Md.CO.C[q]===0) continue;

      /* the tail: the last sample is faded to nothing, the sample before the
         fade is not touched, and an undamped mode is not cut short */
      const Mu=buildModel(Object.assign({},DEFAULTS,{quality:'coarse',damp:false,tau:0}));
      const su=renderSound(Mu,{pickup:'head',theta:0,micR:rho,single:null},fs,0.2);
      ok(Math.abs(su.y[su.n-1])<1e-9*su.peak,'the last sample is faded to nothing');
      const nfd=Math.min(Math.round(0.03*fs),Math.floor(su.n/4)), kb=su.n-nfd-1;
      let vb=0; for(const md of su.modes) vb+=md.zr*Math.sin(md.w*kb/fs)+md.zi*Math.cos(md.w*kb/fs);
      ok(Math.abs(su.y[kb]-vb)<1e-6*su.peak,'and the sample before the fade is the full sum');
      ok(Math.abs(su.y[kb-1])>1e-3*su.peak,'which is still ringing there, undamped');
      ok(DEFAULTS.tau===2.5&&Md.tau===0&&buildModel(Object.assign({},DEFAULTS,{quality:'coarse'})).tau===2.5e-3,

      /* a physical number: the default timpani, 3 m/s, 1 m away at 45 degrees */
      const M2=buildModel(Object.assign({},DEFAULTS));
      const s2=renderSound(M2,{pickup:'air',theta:45*DEG,micR:0,single:null},48000,0.05);
      const spl=20*Math.log10(s2.peak/2e-5);
      ok(spl>85&&spl<125,'a 3 m/s felt stroke at 1 m is a loud but sane '+spl.toFixed(1)+' dB SPL peak');
      const M2i=buildModel(Object.assign({},DEFAULTS,{tau:0}));
      const s2i=renderSound(M2i,{pickup:'air',theta:45*DEG,micR:0,single:null},48000,0.05);
      ok(s2i.peak>1.5*s2.peak,'the instantaneous strike is harsher: '
         +(20*Math.log10(s2i.peak/s2.peak)).toFixed(1)+' dB louder at the peak');
      if(PIN_SPL_PA!==null) rel(s2.peak,PIN_SPL_PA,1e-6,'regression pin: that peak is '+PIN_SPL_PA+' Pa');
      /* the peak of a strike sits in the first milliseconds, which is what
         lets the panel quote it from a 40 ms render */
      const s3=renderSound(M2,{pickup:'air',theta:45*DEG,micR:0,single:null},48000,0.6);
      let k3=0; for(let k=0;k<s3.n;k++) if(Math.abs(s3.y[k])===s3.peak){ k3=k; break; }
      ok(k3/48000<0.04&&Math.abs(s3.peak-s2.peak)<=1e-6*s2.peak,

    }
    /* the contact time, three ways.  (i) the picture's closed form against a

    {
      const gl=gaussLegendre(16);
      const conv=(w,t,tau)=>{                   /* INT_0^min(t,tau) A sin(bt') sin(w(t-t'))/w dt' */
        const b=PI/tau, A=0.5*b, hi=Math.min(t,tau); let acc=0; const NP=12;
        for(let p=0;p<NP;p++){ const lo=hi*p/NP, up=hi*(p+1)/NP, hw=0.5*(up-lo), mid=0.5*(up+lo);
          for(let i=0;i<16;i++){ const tp=hw*gl.x[i]+mid;
            acc+=hw*gl.w[i]*A*Math.sin(b*tp)*Math.sin(w*(t-tp))/w; } }
        return acc; };
      let worst=0;

        for(const t of [0.1*tau,0.5*tau,0.999*tau,tau,1.7*tau,0.02]){

      rel(timeFactorPulse(b*(1+3e-10),0.4*tau,tau),timeFactorPulse(b,0.4*tau,tau),1e-8,

      rel(timeFactorPulse(1e-9,0.4*tau,tau),conv(1e-9,0.4*tau,tau),1e-8,'and at w -> 0, the free drift');
      rel(timeFactorPulse(922,tau,tau),timeFactorPulse(922,tau*(1-1e-12),tau),1e-8,
          'the driven and free phases meet at t = tau');
      rel(pulseFilter(b,tau),PI/4,1e-6,'S(pi) = pi/4');
      for(const [w,t] of [[922,0.003],[0,0.01],[3000,0.0001]])
        ok(timeFactorPulse(w,t,0)===timeFactor(w,t,true),'tau = 0 is the impulsive strike exactly, w='+w);
      rel(timeFactorPulse(922,0.02,1e-9),timeFactor(922,0.02,true),1e-5,'and tau -> 0 approaches it');
      /* the sound against the picture: undamped, so the two closed forms must agree */
      const st=Object.assign({},DEFAULTS,{quality:'coarse',damp:false,tau:2.5});
      const M=buildModel(st);
      const fs=48000, rho=0.61;
      const snd=renderSound(M,{pickup:'head',theta:0,micR:rho,single:null},fs,0.1);
      const uAt=t=>{ let u=0;
        for(let q=0;q<M.MT.modes.length;q++){ const md=M.MT.modes[q];
          if(M.CO.C[q]===0) continue;
          u+=M.CO.C[q]*M.amp*besselJ(md.m,md.x*rho)*timeFactorPulse(M.w[q],t,M.tau); }
        return u; };
      let w2=0; const hstep=2e-8;
      for(const k of [3,40,119,120,121,200,700,2500]){
        const t=k/fs, v=(uAt(t+hstep)-uAt(t-hstep))/(2*hstep);
        w2=Math.max(w2,Math.abs(snd.y[k]-v)); }
      ok(w2<3e-5*snd.peak,'the contact mic hears d/dt of the picture, through and past the contact ('
         +(w2/snd.peak).toExponential(1)+' of the peak)');
      ok(Math.abs(snd.y[0])<1e-6*snd.peak,'and with a contact time the head starts from rest');
      /* in the air, by the ODE route instead of the convolution: on the axis
         only m = 0 is heard, and each mode's acceleration is g(t) - w^2 u —
         the push itself included */
      const s0=renderSound(M,{pickup:'air',theta:0,micR:0,single:null},fs,0.1);
      const pre=RHO_AIR*M.a*M.a/R_LISTEN, bb=PI/M.tau, AA=0.5*bb;
      const pAt=t=>{ let p=0;
        for(let q=0;q<M.MT.modes.length;q++){ const md=M.MT.modes[q];
          if(md.m!==0||M.CO.C[q]===0) continue;
          const w=M.w[q], gq=(t<M.tau)?AA*Math.sin(bb*t):0;
          p+=M.CO.C[q]*M.amp*TAU*lommelCross(0,md.x,0)*(gq-w*w*timeFactorPulse(w,t,M.tau)); }
        return pre*p; };
      let w3=0;
      for(const k of [0,5,60,119,120,121,400,2500]) w3=Math.max(w3,Math.abs(s0.y[k]-pAt(k/fs)));
      ok(w3<3e-5*s0.peak,'in the air the push itself is heard: p = g - w^2 u mode by mode ('
         +(w3/s0.peak).toExponential(1)+' of the peak)');
      /* and without that term the contact phase would be wrong by g(t) itself */
      let gmax=0; for(let k=0;k<120;k++) gmax=Math.max(gmax,Math.abs(pAt(k/fs)));
      ok(gmax>0.2*s0.peak,'the contact phase carries real pressure ('+(gmax/s0.peak).toFixed(2)+' of the peak)');
    }
    /* nothing non-finite for any preset x rim x pickup, a supersonic head included */
    {
      let bad=0, n=0;
      const cases=[];
      for(const p of PRESETS) for(const bc of ['clamped','free','springy']) for(const pk of ['air','head'])
        cases.push(Object.assign({},DEFAULTS,{preset:p.id,dia:p.dia,gauge:p.gauge,pitch:p.pitch,
          pmode:p.pmode,bc:bc,r0f:p.r0f,sf:p.sf,t60:p.t60,lossP:p.lossP,quality:'coarse',
          radLoss:true,pickup:pk}));
      cases.push(Object.assign({},DEFAULTS,{dia:36,gauge:10,pitch:900,pmode:'01',quality:'coarse',radLoss:true}));
      cases.push(Object.assign({},DEFAULTS,{dia:36,gauge:10,pitch:900,pmode:'01',quality:'coarse',
        radLoss:true,pickup:'head',strike:'pressed'}));
      cases.push(Object.assign({},DEFAULTS,{quality:'coarse',tau:0}));
      cases.push(Object.assign({},DEFAULTS,{quality:'coarse',tau:6,bc:'free'}));
      cases.push(Object.assign({},DEFAULTS,{quality:'coarse',tau:0.1,damp:false,pickup:'head'}));
      for(const st of cases){
        const M=buildModel(st); n++;
        for(let q=0;q<M.alpha.length;q++) if(!isFinite(M.alpha[q])||M.alpha[q]<0) bad++;
        const snd=renderSound(M,{pickup:st.pickup,theta:st.listenDeg*DEG,micR:st.micR,single:null},8000,0.1);
        for(let k=0;k<snd.n;k++) if(!isFinite(snd.y[k])) bad++;
        if(!(snd.peak>0)) bad++;
        const rt=ringTime(M);
        if(!isFinite(rt)||rt<0.3||rt>12) bad++;
      }
      ok(bad===0,'no preset x rim x pickup renders a non-finite or silent strike ('+n+' cases)');
      /* the free rim's k = 0 drift is skipped, not divided by */
      const Mf=buildModel(Object.assign({},DEFAULTS,{bc:'free',quality:'coarse'}));
      const mf=soundModes(Mf,{pickup:'air',theta:0.5,micR:0,single:null});
      ok(mf.length>0&&mf.every(md=>md.w>1e-6),'the rigid drift of a free rim makes no sound');
      /* the Nyquist guard: a snare at fine quality has partials above 3.6 kHz */
      const Ms=buildModel(Object.assign({},DEFAULTS,{preset:'snare14',dia:14,gauge:10,pitch:330,
        pmode:'01',r0f:0.3,sf:0.06,quality:'fine'}));
      const ss=renderSound(Ms,{pickup:'air',theta:0.5,micR:0,single:null},8000,0.05);
      ok(ss.dropped>0&&ss.top<=3600,'modes above 0.45 fs are dropped, not aliased ('+ss.dropped+' dropped)');
    }
    /* the clock */
    {
      const st0=Object.assign({},DEFAULTS,{quality:'coarse'});
      const M0=buildModel(st0);
      ok(timeScale(M0)===1/400,'the head is watched at 1/400 of real time');
      const M1=buildModel(Object.assign({},st0,{realtime:true}));
      ok(timeScale(M1)===1,'and at 1x in real time');
      ok(timeScale(buildModel(Object.assign({},st0,{view:'droplet'})))===0.5,'the puddle at 1/2');
      ok(timeScale(buildModel(Object.assign({},st0,{view:'droplet',realtime:true})))===1,
         'and at 1x in real time');
      rel(timeSpan(M0),8/M0.f1,1e-12,'slowed, one loop is eight periods of the fundamental');
      rel(timeSpan(M1),1.2*ringTime(M1),1e-12,'in real time one strike rings 1.2 T60 before the next');
      rel(ringTime(M1),2.4,1e-9,'the slowest mode of the timpani is its fundamental: T60 = 2.4 s as set');
      ok(ringTime(buildModel(Object.assign({},st0,{damp:false})))===3,'undamped, the sound is cut at 3 s');
      ok(ringTime(buildModel(Object.assign({},st0,{t60:0.05,lossP:3})))===0.3,'and never shorter than 0.3 s');
      ok(ringTime(buildModel(Object.assign({},st0,{radLoss:true})))<ringTime(M1),'radiation shortens the ring');
      /* the wrap is a modulo, so a frame longer than the span cannot run away */
      const S=makeScene({getContext(){ return null; }});
      Object.assign(S.st,{quality:'coarse',realtime:true,view:'field',anim:true,speed:4});
      S.rebuild();
      const lim=timeSpan(S.model());
      S.st.t=0.99*lim; S.step(0.05);
      ok(S.st.t>=0&&S.st.t<lim&&S.wrapped===true,'a 200 ms real-time step across a '
         +(lim*1000).toFixed(1)+' ms span wraps by modulo and raises the flag');
    }
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
