function sonCaption(S){
  if(S.mode==='poly') return {full:'The Sonine polynomials of index m = '+par(S.m)+', degrees 0 to '+S.n+' (degree '+S.n+' in green), each drawn as √(xᵐe⁻ˣ) Sₘ⁽ⁿ⁾(x) so that they share one scale; the yellow dots are the zeros of the last. In kinetic theory x = C² is the reduced kinetic energy and the index says what the polynomial multiplies: ½ a scalar, 3/2 the vector C (heat flow), 5/2 the tensor C°C (shear). Below, their overlaps ∫ xᵐe⁻ˣ SᵢSⱼ dx / √(hᵢhⱼ), computed with Gauss–Laguerre: the identity.',
    short:'Sonine polynomials S'+sub('m')+sup('(k)')+', k ≤ '+S.n+' (degree '+S.n+' green), and their overlaps below.'};
  if(S.mode==='gas') return {full:'The thermal conductivity (green) and viscosity (blue) of a hard-sphere gas in the Chapman–Enskog theory, as multiples of the first approximation, when the distribution is expanded in N Sonine terms. Orange dashes: Pekeris & Alterman’s solution of the integral equation (1957); orange rings: the four approximations Chapman & Cowling print. The brackets were integrated by derive.py; the page solves the N × N systems. Left below: the second approximation for a repulsion falling as the power ν of the distance (Maxwell molecules, ν = 5, need no correction at all). Right below: the heat-flow function A(C) at N = 1 … '+S.N+' terms (N = '+S.N+' green) and at '+CE_NMAX+' (orange dashes).',
    short:'Hard spheres: conductivity (green) and viscosity (blue) against the number of Sonine terms; orange, Pekeris & Alterman.'};
  return {full:'The velocity distribution in a gas carrying '+(S.kind==='heat'?'heat along z':'a shear C'+sub('x')+'C'+sub('z')+'')+', the Chapman–Enskog correction f₀εφ in the plane C'+sub('y')+' = 0 (green where molecules are added, magenta where they are removed), with φ from '+CE_NMAX+' Sonine terms for hard spheres. '+(S.kind==='heat'?'Fast molecules move towards the cold side and slow ones the other way, so there is no net flow of matter but a net flow of energy.':'The flow along x is faster below: molecules climbing from below bring extra x-momentum, so the distribution leans along the diagonal C'+sub('x')+' = C'+sub('z')+', and that lean is the shear stress.')+' Below: the cut along the C'+sub('z')+' axis, the Maxwellian (orange dashes) and the corrected distribution at ε = '+numF(S.eps,2)+' (green), exaggerated to be seen.',
    short:'The Chapman–Enskog distortion of the Maxwellian, exaggerated ×'+numF(S.eps,2)+'.'};
}
function drawSon(ctx,W,H,M){
  const S=M.S, cap=sonCaption(S);
  const L=stageLayout(ctx,W,H,cap.full,cap.short,S.mode==='gas'?2:1,0.36,nbNarrow(H));
  if(S.mode==='poly') drawSonPoly(ctx,W,H,L,S); else if(S.mode==='gas') drawSonGas(ctx,W,H,L,S); else drawSonDist(ctx,W,H,L,S);
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  view 5: the zeros                                                  *
 * ================================================================== */
function zeroCaption(Z){
  if(Z.mode==='charges'){ const f=Z.f;
    const fixed=f.id==='hermite'?'in the harmonic field x²/2':f.id==='laguerre'?'in the field x/2 with a fixed charge '+par(Z.fd.q)+' at the origin':'between fixed charges '+par(Z.fd.qa)+' at +1 and '+par(Z.fd.qb)+' at −1';
    return {full:Z.n+' unit charges (magenta) on the line, repelling one another as −ln|x − y|, '+fixed+' (the grey curve is the field’s potential V). They start scattered and slide downhill in energy; they come to rest on the '+Z.n+' zeros of the '+f.name.replace(' (Sonine)','')+' polynomial (green ticks, from the Jacobi matrix), whose graph is drawn faintly behind. Below: the excess energy E − E'+sub('*')+' as they settle, and the Gauss weights, the same '+Z.n+' zeros used as quadrature nodes. Press scatter for another start.',
      short:'Charges in the weight’s field come to rest on the zeros (green ticks).'};}
  if(Z.mode==='quad') return {full:'∫ '+Z.Q.name+' dx over (−1, 1) by Gauss–Legendre with '+Z.n+' points: each node x'+sub('i')+' (a zero of P'+sub(Z.n)+') carries a bar as wide as its weight w'+sub('i')+' and as tall as the integrand there, so the bars’ area is the estimate. Below: the error against the number of points for Gauss (green), the trapezoid (blue) and Simpson (orange). A smooth integrand gives Gauss a geometric fall; '+({abs:'here the kink at 0 slows Gauss to a power law, while the trapezoid and Simpson are exact whenever a point sits on the kink (odd n), |x| being a straight line on each side of it',
      abs3:'here the jump in the third derivative at 0 slows every rule to a power law',semi:'here the square-root ends slow every rule',runge:'here the poles at ±i/5 set Gauss’s rate',
      exp:'here all three fall fast, Gauss fastest',cos10:'here Gauss needs about ten points before it resolves the oscillation, then falls fastest'})[Z.Q.id]+'.',
    short:'Gauss–Legendre: bars as wide as the weights; below, the error against the number of points.'};

/* the map: nodes with the hypergeometric parents above, arrows for the eight limits */
const FAMNODES={jac:['Jacobi',0.12,0.25], geg:['Gegenbauer',0.12,0.62], leg:['Legendre',0.12,0.95], lag:['Laguerre',0.5,0.25],
  her:['Hermite',0.5,0.62], cos:['cos z',0.5,0.95], bes:['Bessel J',0.88,0.25], ai:['Airy Ai',0.88,0.62]};
const FAMEDGES={legbes:['leg','bes'], lagbes:['lag','bes'], hermcos:['her','cos'], hermai:['her','ai'], besai:['bes','ai'],
  jaclag:['jac','lag'], geghe:['geg','her'], laghe:['lag','her']};
function famCaption(F){ const L=F.L;

    short:L.name+': the scaled function (green) and its limit (orange); below, the gap against '+L.par+'.'}; }

      xticks:intTicks(Math.ceil(xlo),Math.floor(xhi)),xfmt:t=>'10'+sup(Math.round(t)),yticks:intTicks(Math.ceil(ylo2),Math.floor(yhi2))});
    const k=lx.length-1; polyline(ctx,b1,[xlo,xhi],[ly[k]+L0.rate*(xlo-lx[k]),ly[k]+L0.rate*(xhi-lx[k])],xlo,xhi,ylo2,yhi2,COL.ref,1.1,[5,4]);

    dot(ctx,xOf(b1,Math.log10(F.par),xlo,xhi),yOf(b1,Math.log10(Math.max(F.sup,1e-16)),ylo2,yhi2),4.5,COL.live,'#fff');

function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='rod') drawRod(ctx,W,H,M);
  else if(M.view==='leg') drawLeg(ctx,W,H,M);
  else if(M.view==='airy') drawAiry(ctx,W,H,M);
  else if(M.view==='son') drawSon(ctx,W,H,M);
  else if(M.view==='zeros') drawZeros(ctx,W,H,M);
  else drawFam(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  function setFrom(hit,x,y,down){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1), w=clamp((hit.b.y+hit.b.h-y)/hit.b.h,0,1);
    if(hit.kind==='rung'){ if(!down) return false; ST.rK=clamp(Math.floor((y-hit.top)/(hit.hh+hit.gap)),0,hit.n); ST.rPlay=false; return true; }
    if(hit.kind==='lx'){ ST.lX=clamp(-1+2*u,LIM.lX[0],LIM.lX[1]); return true; }
    if(hit.kind==='lnu'){ ST.lNu=clamp(Math.round(10*u*100)/100,LIM.lNu[0],LIM.lNu[1]); return true; }
    if(hit.kind==='beta'){ ST.lBeta=clamp(Math.round(180*u*10)/10,LIM.lBeta[0],LIM.lBeta[1]); return true; }
    if(hit.kind==='ray'){ ST.lGam=clamp(Math.round(Math.atan2(Math.abs(x-hit.cx),hit.cy-y)*180/PI),0,180); return true; }
    if(hit.kind==='ax'){ ST.aX=clamp(Math.round((hit.x0+(hit.x1-hit.x0)*u)*100)/100,LIM.aX[0],LIM.aX[1]); return true; }
    if(hit.kind==='level'){ if(!down) return false; const E=hit.E1*w; const M=airyView(ST); let best=1, d=Infinity;
      M.lev.forEach(lv=>{ const dd=Math.abs(lv.E/hit.peV-E); if(dd<d){ d=dd; best=lv.n; } }); ST.aLev=clamp(best,1,8); return true; }
    if(hit.kind==='gnu'){ ST.gNu=clamp(5+55*u,5,60); return true; }
    if(hit.kind==='qn'){ ST.qN=clamp(Math.round(1+29*u),1,30); return true; }
    if(hit.kind==='fpar'){ const L=LIMITS.find(q=>q.id===ST.fLim); ST.fPar=hit.lo*Math.pow(hit.hi/hit.lo,u); if(L.integer) ST.fPar=Math.round(ST.fPar); return true; }
    if(hit.kind==='fmap'){ if(!down) return false; let best=null, d=Infinity; for(const q of hit.hits){ const dd=Math.hypot(q.x-x,q.y-y); if(dd<d){ d=dd; best=q.id; } }
      if(best&&d<60){ ST.fLim=best; ST.fPar=LIMITS.find(q=>q.id===best).def; return true; } return false; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; }
      if(hit.kind==='cam'){ DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST.camTheta; DRAG.ph=ST.camPhi; return false; }
      DRAG.what=hit; return setFrom(hit,x,y,true); }
    if(type==='move'){ if(!DRAG.what) return false;
      if(DRAG.what==='cam'){ ST.camTheta=DRAG.th-(x-DRAG.x)*0.008; ST.camPhi=clamp(DRAG.ph+(y-DRAG.y)*0.006,-1.45,1.45); return true; }
      return setFrom(DRAG.what,x,y,false); }
    DRAG.what=null; return false;
  };
  return S;
}

/* ================================================================== *

  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg,map){
    const m=map||{to:v=>v,from:v=>v};

    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){

    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')); }
  const btn=(lab,fn)=>h('button',{onclick:()=>{ fn(); syncChips(); syncPanel(); dirty=true; refresh(); }},lab);

  /* ---- the Rodrigues ladder ---- */
  const gRod=h('div',{class:'grp'},h('h3',null,'the Rodrigues ladder'));
  gRod.appendChild(chipRow(FAM_LIST,'rFam',()=>{ st.rK=st.rN; st.rPlay=false; }));
  gRod.appendChild(slider('rN','degree n',1,10,1,v=>String(v),()=>{ st.rK=st.rN; st.rPlay=false; }));
  const rKRow=slider('rK','the step shown, k',0,10,1,v=>String(v),()=>{ st.rPlay=false; }); gRod.appendChild(rKRow);
  const rJaRow=slider('rJa','α',LIM.rJ[0],LIM.rJ[1],0.05,v=>par(v)); gRod.appendChild(rJaRow);

    airyTag.innerHTML=st.aMode==='real'?'press the plot to move the probe':st.aMode==='complex'?'white dots: the zeros':'press a level to choose it';
    sonTag.innerHTML=st.sMode==='gas'?'press the lower-left plot to set ν':st.sMode==='poly'?'½, 3/2 and 5/2 are the indices of kinetic theory':'the distortion is exaggerated ×'+fmt(st.dEps,2);
    zeroTag.innerHTML=st.zMode==='charges'?'space stops or starts the charges':st.zMode==='quad'?'press the lower plot to set n':'n from 5 to 400';
    famTag.innerHTML='press an arrow of the map to follow it';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space starts or stops the ladder or the charges';

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='rod'?'press a rung to stop there · space builds the ladder · 1–6 switch views'
        :v==='leg'?(st.lMode==='harm'?'drag to turn the sphere · 1–6 switch views':'press the plots · 1–6 switch views')
        :v==='airy'?'press the plots · 1–6 switch views':v==='son'?'press the plots · 1–6 switch views'
        :v==='zeros'?'space stops or starts the charges · 1–6 switch views':'press an arrow of the map · 1–6 switch views';
      infoEl.innerHTML=infoFor(M);

    }catch(e){ fail(e); }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ syncChips(); syncPanel(); dirty=true; refresh(); }
    if(DRAG.what) canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  /* a drag updates only the readout and the picture as it goes: the prose and the calculation catch up on release
     (they printed the value from the press until the next control moved) */
  const up=()=>{ const was=!!DRAG.what; canvas.classList.remove('dragging'); S.pointer('up',0,0); if(was){ syncChips(); syncPanel(); refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    const tg=e.target&&e.target.tagName;
    if(e.key===' '&&tg!=='INPUT'&&tg!=='BUTTON'){ e.preventDefault();
      if(st.view==='rod'){ if(st.rPlay) st.rPlay=false; else { if(st.rK>=st.rN) st.rK=0; st.rPlay=true; } }
      else if(st.view==='zeros') st.zRun=!st.zRun;
      syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)&&tg!=='INPUT') setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    const advanced=S.step();
    if(advanced){ dirty=false; refresh(); if(!viewAnimates(st)) syncPanel(); }
    else if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const SRC_LINE='Formulas: the NIST Digital Library of Mathematical Functions (release 1.2.8, 2026-09-15), chapters 9 (Airy), 10.19 (Bessel near its transition), 14 (Legendre and Ferrers) and 18 (the classical polynomials). Kinetic theory: Chapman &amp; Cowling, <i>The Mathematical Theory of Non-Uniform Gases</i> (2nd ed., 1952), secs 7.5 and 10.21; Pekeris &amp; Alterman, PNAS 43, 998 (1957); E. L. Tipton, PhD dissertation (Missouri, 2008); N. Sonine, Math. Ann. 16, 1 (1880), p. 41. The neutron: CODATA 2022 (NIST) for its mass; Cronenberg et al., Nature Physics 14, 1022 (2018) for g at Grenoble and the qBounce frequencies; Nesvizhevsky et al., Eur. Phys. J. C 40, 479 (2005) for the heights. Stieltjes, Acta Math. 6, 321 (1885), as surveyed by Marcell&aacute;n, Mart&iacute;nez-Finkelshtein &amp; Mart&iacute;nez-Gonz&aacute;lez, J. Comput. Appl. Math. 207, 258 (2007). Airy, Trans. Camb. Phil. Soc. 6, 379 (1838). The cone&rsquo;s approximations as in Jackson, <i>Classical Electrodynamics</i>, sec. 3.4. build_sf/derive.py recomputes every value here (mpmath at 40 digits, sympy, the collision integrals by exact quadrature) and selfTest pins the page to it.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }

function infoFor(M){
  const v=M.view;
  if(v==='rod') return 'Every classical orthogonal polynomial comes out of one recipe. Take the family&rsquo;s weight w(x) and a polynomial F(x) of degree at most two (1 &minus; x&sup2; on (&minus;1, 1), x on (0, &infin;), 1 on the whole line), form w F<sup>n</sup>, differentiate n times and divide by w: what is left is a polynomial of degree n. That is <b>Rodrigues&rsquo; formula</b> (Rodrigues found it for Legendre&rsquo;s polynomials in 1816; DLMF 18.5.5 has the general form). The ladder shows why the n zeros are real, simple and inside the interval: w F<sup>n</sup> vanishes at both ends, so by <b>Rolle&rsquo;s theorem</b> its derivative vanishes somewhere between; the derivative still vanishes at the ends, so the next derivative has two zeros inside, and so on down. The same recipe gives each family its differential equation, F p&Prime; + &tau; p&prime; + &lambda;<sub>n</sub> p = 0, and Bochner (1929) showed that these are the only polynomial families with one: F with two roots gives Jacobi and its special cases, F of degree one Laguerre, a constant F Hermite.';
  if(v==='leg'){ const G=M.G;
    if(G.mode==='pq') return 'Separate Laplace&rsquo;s or Schr&ouml;dinger&rsquo;s equation in spherical coordinates and the polar part obeys <b>Legendre&rsquo;s equation</b>, x = cos &theta;. For any degree &nu; it has two solutions, the <b>Ferrers functions</b> P<sub>&nu;</sub><sup>m</sup> and Q<sub>&nu;</sub><sup>m</sup>. P is finite at the north pole (x = 1); at the south pole it grows like ln((1 + x)/2), with the coefficient sin(&nu;&pi;)/&pi;, unless &nu; is a whole number. So a function finite over the whole sphere needs an integer degree, and that is why the angular momentum quantum number &ell; is an integer. Q is singular at both poles for every &nu;. Slide &nu; through 2 and watch the logarithm disappear and return.';
    if(G.mode==='cone') return 'Cut the sphere with a cone and the degree need not be an integer any more: the potential near the apex of a conducting cone of half-angle &beta; is r<sup>&nu;</sup>P<sub>&nu;</sub>(cos &theta;), with &nu; the first root of P<sub>&nu;</sub>(cos &beta;) = 0. The field then goes as r<sup>&nu;&minus;1</sup>. In a conical hole (&beta; &lt; 90&deg;) &nu; &gt; 1 and the field dies away into the hole; at &beta; = 90&deg; the cone is a plane and &nu; = 1, a uniform field; outside a sharp point (&beta; &gt; 90&deg;) &nu; &lt; 1 and the field grows without bound towards the tip. That is the lightning rod, and the reason sharp electrodes spark.';
    if(G.mode==='multi') return 'The <b>generating function</b> of the Legendre polynomials, (1 &minus; 2xt + t&sup2;)<sup>&minus;&frac12;</sup> = &Sigma; P<sub>&ell;</sub>(x) t<sup>&ell;</sup>, is the potential of a point charge: put the charge at distance d on the axis and the potential at r is 1/|r &minus; d| = &Sigma; r<sub>&lt;</sub><sup>&ell;</sup>/r<sub>&gt;</sub><sup>&ell;+1</sup> P<sub>&ell;</sub>(cos &gamma;), the <b>multipole expansion</b>. Near the origin it is a power series in r/d, far away one in d/r, and each converges like a geometric series; on the sphere r = d, which passes through the charge, neither does. The picture shows how far a given number of terms reaches.';
    return 'The <b>spherical harmonics</b> are the Ferrers functions of integer degree times e<sup>im&phi;</sup>, normalised over the sphere. Their nodal lines are circles: &ell; &minus; |m| latitudes where P<sub>&ell;</sub><sup>|m|</sup>(cos &theta;) vanishes and |m| great circles through the poles, &ell; circles in all. Summed over m, |Y<sub>&ell;</sub><sup>m</sup>|&sup2; is the same everywhere (Uns&ouml;ld&rsquo;s theorem): a filled shell of an atom is round.';
  }
  if(v==='airy'){ const A=M.A;
    if(A.mode==='real') return 'Airy&rsquo;s function was made for light. In 1838 Airy worked out the intensity near a <b>caustic</b>, the bright edge of a rainbow, as the integral &int; cos(&pi;/2 (w&sup3; &minus; m w)) dw, and tabulated it. The same function solves w&Prime; = x w, the Schr&ouml;dinger equation where a linear potential crosses the energy: a <b>turning point</b>. On the allowed side the wave oscillates with the WKB amplitude; on the forbidden side Ai decays and Bi grows, both like e<sup>&plusmn;&zeta;</sup>, &zeta; = &#8532;|x|<sup>3/2</sup>. Every WKB connection formula is read off from Ai. Its asymptotic series diverges: at a fixed x the error first falls and then climbs, and the best it can do is about the size of the exponentially small e<sup>&minus;2&zeta;</sup> that the series cannot see.';
    if(A.mode==='complex') return 'Over the complex plane Ai is a single exponential, e<sup>&minus;&zeta;</sup>, everywhere except near the negative real axis, where the growing exponential it hides becomes as large as the decaying one and the two interfere: there, and only there, Ai has zeros. Bi carries both exponentials with comparable weight along the rays arg z = &plusmn;60&deg;, and so has complex zeros near them as well as real ones. Where the colours all meet is a zero; the phase winds once around it.';
    return 'A neutron falling at a few metres per second onto a horizontal mirror cannot bounce at any height it likes. The mirror is a wall and gravity a ramp, so the Schr&ouml;dinger equation is Airy&rsquo;s and the wavefunctions are pieces of Ai, each shifted until one of its zeros sits on the mirror: the energies are E<sub>n</sub> = &minus;a<sub>n</sub>E&#8320; with a<sub>n</sub> the zeros of Ai. The first level is '+numF(M.A.lev[0].E/(M.A.eV*1e-12),3)+' peV and its classical height '+numF(M.A.lev[0].z*1e6,1)+' &micro;m. The quantum levels were seen at the ILL in Grenoble by letting neutrons pass under an absorbing ceiling lowered towards the mirror (Nesvizhevsky et al.), and their spacings were later measured as frequencies by shaking the mirror (the qBounce experiment, Cronenberg et al.).';
  }
  if(v==='son'){ const S=M.S;
    if(S.mode==='poly') return '<b>Sonine polynomials</b> are the generalised Laguerre polynomials under the name kinetic theory gives them. Chapman &amp; Cowling (sec. 7.5) define S<sub>m</sub><sup>(n)</sup>(x) as the coefficient of s<sup>n</sup> in (1 &minus; s)<sup>&minus;m&minus;1</sup>e<sup>&minus;xs/(1&minus;s)</sup>, which is L<sub>n</sub><sup>(m)</sup>(x) with no extra sign or factor. They are orthogonal with the weight x<sup>m</sup>e<sup>&minus;x</sup>, and with x = C&sup2; that is the Maxwellian e<sup>&minus;C&sup2;</sup> times the powers of C that a scalar, a vector or a tensor moment brings: m = &frac12;, 3/2 and 5/2. The same functions times C<sup>&ell;</sup>Y<sub>&ell;m</sub> are the states of the three-dimensional harmonic oscillator.';
    if(S.mode==='gas') return 'A gas with a temperature gradient carries heat, one with a velocity gradient carries momentum, and the Chapman&ndash;Enskog theory finds the small departure of each molecule&rsquo;s velocity distribution from the Maxwellian that does it. That departure is expanded in Sonine polynomials: A(C) = &Sigma;<sub>p</sub> a<sub>p</sub>S<sub>3/2</sub><sup>(p)</sup>(C&sup2;) for the heat flow, B(C) = &Sigma;<sub>p</sub> b<sub>p</sub>S<sub>5/2</sub><sup>(p)</sup>(C&sup2;) for the shear. One term gives the textbook conductivity and viscosity; each further term corrects them. For hard spheres the corrections are small and fast: '+numF((M.S.lam[1]-1)*100,2)+' % and '+numF((M.S.eta[1]-1)*100,2)+' % at the second term, converging to the 2.5 % and 1.6 % of the exact solution. For Maxwell molecules, whose force falls as r<sup>&minus;5</sup>, the Sonine polynomials are exact eigenfunctions and the first term is the answer.';
    return 'The shape of the distribution that carries the heat or the momentum: the Maxwellian f&#8320; times 1 + &epsilon;&phi;, with &phi; from the Sonine expansion for hard spheres. In a heat flow the fast molecules drift towards the cold side and the slow ones towards the hot, so no matter moves but energy does. In a shear the distribution is stretched along one diagonal of the (C<sub>x</sub>, C<sub>z</sub>) plane. Real gradients make &epsilon; tiny; here it is exaggerated so that the shape can be seen.';
  }
  if(v==='zeros'){ const Z=M.Z;
    if(Z.mode==='charges') return 'Stieltjes (1885) found an electrostatic meaning for the zeros. Put n unit charges on the line, let them repel one another as &minus;ln|x &minus; y| (the potential of parallel line charges), and place them in the weight&rsquo;s own field: for Jacobi, fixed charges (&alpha;+1)/2 at +1 and (&beta;+1)/2 at &minus;1; for Laguerre, a charge (&alpha;+1)/2 at the origin and the pull x/2; for Hermite, the harmonic well x&sup2;/2. Let them slide downhill in energy. Where they come to rest is exactly on the zeros of the family&rsquo;s degree-n polynomial, because the equilibrium condition at a charge is the polynomial&rsquo;s own differential equation at a zero.';
    if(Z.mode==='quad') return 'The zeros are also the best places to sample a function. <b>Gauss</b>&rsquo;s rule (1814) with n nodes at the zeros of P<sub>n</sub> and the right weights integrates every polynomial of degree up to 2n &minus; 1 exactly, twice what n equally spaced points manage. For a smooth integrand the error then falls faster than any power of n; a kink or an endpoint singularity brings every rule back to a power law. The nodes and weights here come from the eigenvalues and eigenvectors of the Jacobi matrix (Golub and Welsch, 1969).';
    return 'As the degree grows the zeros fill their interval with a fixed density: the semicircle for Hermite (scaled by &radic;(2n)), the Marchenko&ndash;Pastur law for Laguerre (scaled by 4n), the arcsine law for Jacobi and Legendre, which crowds the zeros to the ends. The semicircle is also Wigner&rsquo;s law for the eigenvalues of large random matrices: the Hermite polynomial is the average characteristic polynomial of such a matrix.';
  }
  return 'The families are one family. Jacobi&rsquo;s polynomials are hypergeometric <sub>2</sub>F<sub>1</sub> series; let a parameter run off to infinity and they become Laguerre&rsquo;s (<sub>1</sub>F<sub>1</sub>), and Laguerre&rsquo;s become Hermite&rsquo;s. Let the degree grow while zooming in and a polynomial becomes a Bessel function (Mehler&ndash;Heine), and zooming in at the edge of the zeros turns Hermite&rsquo;s functions, and Bessel&rsquo;s near its transition, into Airy&rsquo;s function: the turning point again. Each limit is drawn with the rate at which it is reached.';
}

function derivFor(M){
  const v=M.view;
  if(v==='rod'){ const R=M.R, f=R.f, fs=famStrings(f,R.p), n=R.n;
    return '<h4>Rodrigues&rsquo; formula</h4>'
      +EQ(1,'p<sub>n</sub>(x) = '+FR('1','&kappa;<sub>n</sub> w(x)')+' '+FR('d<sup>n</sup>','dx<sup>n</sup>')+' [w(x) F(x)<sup>n</sup>]')
      +'<p>DLMF 18.5.5 with Table 18.5.1. Here w = '+fs.w+', F = '+fs.F+' and &kappa;<sub>'+n+'</sub> = '+num(R.kappa,8)+'.</p>'
      +'<h4>the rungs</h4>'
      +EQ(2,'(F w)&prime; = &tau; w &nbsp;&rArr;&nbsp; (w F<sup>n&minus;k</sup> Q<sub>k</sub>)&prime; = w F<sup>n&minus;k&minus;1</sup> [(&tau; + (n&minus;k&minus;1)F&prime;) Q<sub>k</sub> + F Q<sub>k</sub>&prime;]')
      +'<p>Pearson&rsquo;s equation (here &tau; = '+fs.tau+') makes every derivative of w F<sup>n</sup> a power of F times w times a polynomial Q<sub>k</sub> of degree k, and gives Q<sub>k+1</sub> from Q<sub>k</sub> exactly: no numerical derivative is taken. The last rung is Q<sub>n</sub> = &kappa;<sub>n</sub> p<sub>n</sub>.</p>'
      +EQ(3,'F p&Prime; + &tau; p&prime; + &lambda;<sub>n</sub> p = 0, &nbsp; &lambda;<sub>n</sub> = &minus;n(&tau;&prime; + &frac12;(n&minus;1)F&Prime;) = '+num(R.lam,6))
      +'<p>The polynomial&rsquo;s leading coefficient is k<sub>'+n+'</sub> = '+num(R.kn,6)+' and &int;p<sub>'+n+'</sub>&sup2;w dx = h<sub>'+n+'</sub> = '+num(R.h,6)+' (DLMF Table 18.3.1). The three-term recurrence (DLMF 18.9.1) builds the same polynomial another way; the two agree to '+sigf(Math.max(R.gap,1e-17),1)+'.</p>';
  }
  if(v==='leg'){ const G=M.G;
    if(G.mode==='pq') return '<h4>the two solutions</h4>'
      +EQ(1,'(1 &minus; x&sup2;)y&Prime; &minus; 2xy&prime; + [&nu;(&nu;+1) &minus; '+FR('m&sup2;','1 &minus; x&sup2;')+'] y = 0')
      +'<p>The page computes P and Q from their power series about x = 0 (the values and slopes there are DLMF 14.5.1&ndash;14.5.4), from the hypergeometric series 14.3.4 near x = 1, and for Q near either end by integrating the equation in s = ln tan(&theta;/2), where it becomes y<sub>ss</sub> = (m&sup2; &minus; &nu;(&nu;+1) sech&sup2;s) y. Negative x comes from the reflections</p>'
      +EQ(2,'P(&minus;x) = cos((&nu;+m)&pi;) P(x) &minus; '+FR('2','&pi;')+' sin((&nu;+m)&pi;) Q(x), &nbsp; Q(&minus;x) = &minus;cos((&nu;+m)&pi;) Q(x) &minus; '+FR('&pi;','2')+' sin((&nu;+m)&pi;) P(x)')
      +'<p>with cos and sin of (&nu; + m)&pi; taken exactly at half-integers: the rounding of cos(5.5&pi;) times a Q of a million was a visible error.</p>'
      +'<h4>the logarithm at x = &minus;1</h4>'
      +EQ(3,'P<sub>&nu;</sub>(x) = '+FR('sin &nu;&pi;','&pi;')+' ln'+FR('1 + x','2')+' + cos &nu;&pi; + '+FR('2','&pi;')+' sin &nu;&pi; (&gamma; + &psi;(&nu;+1)) + &hellip;')
      +'<p>From DLMF 14.8.3 and the connection formulas 14.9.8 and 14.9.10 (DLMF prints no form at x = &minus;1); at &nu; = '+numF(G.nu,2)+' the coefficient is '+num(G.logCoef,6)+(G.logConst!==null?' and the constant '+num(G.logConst,6):'')+'.</p>';
    if(G.mode==='cone') return '<h4>the degree of a cone</h4>'
      +EQ(1,'&Phi; = r<sup>&nu;</sup>P<sub>&nu;</sub>(cos &theta;), &nbsp; P<sub>&nu;</sub>(cos &beta;) = 0')
      +'<p>The page scans &nu; up from 0 (P<sub>0</sub> = 1 and P<sub>&nu;</sub>(cos &beta;) stays positive until the first root) and bisects: at &beta; = '+numF(G.beta*180/PI,1)+'&deg;, &nu;<sub>1</sub> = '+numF(G.nu,8)+'.</p>'
      +EQ(2,'&nu;<sub>1</sub> &asymp; '+FR('j<sub>0,1</sub>','&beta;')+' &minus; &frac12; &nbsp;(narrow), &nbsp; &nu;<sub>1</sub> &asymp; '+FR('1','2 ln(2/(&pi; &minus; &beta;))')+' &nbsp;(a needle)')
      +'<p>The first from J<sub>0</sub>, since near the axis P<sub>&nu;</sub>(cos &theta;) &asymp; J<sub>0</sub>((&nu; + &frac12;)&theta;), with j<sub>0,1</sub> = '+numF(J01,10)+' found on the page; the second from the logarithm, P<sub>&nu;</sub>(x) &asymp; 1 + &nu; ln((1 + x)/2) for small &nu;.</p>';
    if(G.mode==='multi') return '<h4>the generating function</h4>'
      +EQ(1,FR('1','&radic;(1 &minus; 2xt + t&sup2;)')+' = &Sigma;<sub>&ell;&ge;0</sub> P<sub>&ell;</sub>(x) t<sup>&ell;</sup>, &nbsp; |t| &lt; 1')
      +'<p>DLMF 14.7.19 (and 14.7.21 for |t| &gt; 1). With t = r/d or d/r and x = cos &gamma; it is the potential of a charge at distance d. The terms fall like t<sup>&ell;</sup>, so '+(G.L+1)+' terms leave an error near t<sup>'+(G.L+1)+'</sup>: '+sigf(Math.pow(0.5,G.L+1),2)+' at r = d/2.</p>';
    return '<h4>the harmonics</h4>'
      +EQ(1,'Y<sub>&ell;</sub><sup>m</sup> = &radic;('+FR('(2&ell;+1)(&ell;&minus;m)!','4&pi;(&ell;+m)!')+') P<sub>&ell;</sub><sup>m</sup>(cos &theta;) e<sup>im&phi;</sup>, &nbsp; Y<sub>&ell;</sub><sup>&minus;m</sup> = (&minus;1)<sup>m</sup> Y&#772;<sub>&ell;</sub><sup>m</sup>')
      +'<p>DLMF 14.30.1, the Condon&ndash;Shortley phase (&minus;1)<sup>m</sup> inside the Ferrers function (14.6.1). P<sub>&ell;</sub><sup>m</sup> comes from the stable recurrence in &ell; upward from P<sub>m</sub><sup>m</sup> = (&minus;1)<sup>m</sup>(2m&minus;1)!!(1 &minus; x&sup2;)<sup>m/2</sup>.</p>'
      +EQ(2,'&Sigma;<sub>m=&minus;&ell;</sub><sup>&ell;</sup> |Y<sub>&ell;</sub><sup>m</sup>|&sup2; = '+FR('2&ell; + 1','4&pi;')+' = '+num((2*G.l+1)/(4*PI),6));
  }
  if(v==='airy'){ const A=M.A;
    if(A.mode==='bouncer'){ const peV=A.eV*1e-12;
      return '<h4>the scales</h4>'
      +EQ(1,'z&#8320; = ('+FR('&#8463;&sup2;','2m&sup2;g')+')<sup>1/3</sup> = '+numF(A.z0*1e6,4)+' &micro;m, &nbsp; E&#8320; = m g z&#8320; = '+numF(A.E0/peV,4)+' peV')
      +'<p>With m = '+sigf(A.m,12)+' kg (CODATA 2022), h exact and g = '+A.g+' m/s&sup2;, the local value at Grenoble that Cronenberg et al. quote. In units of z&#8320; the equation is &psi;&Prime; = (z/z&#8320; &minus; E/E&#8320;)&psi;, whose solution decaying upward is Ai; &psi;(0) = 0 then puts E/E&#8320; at &minus;a<sub>n</sub>.</p>'
      +EQ(2,'&nu;<sub>13</sub> = '+FR('E<sub>3</sub> &minus; E<sub>1</sub>','h')+' = '+numF(A.nu13,2)+' Hz, &nbsp; &nu;<sub>14</sub> = '+numF(A.nu14,2)+' Hz')
      +'<p>qBounce measured 464.8 &plusmn; 1.3 Hz and 649.8 &plusmn; 1.8 Hz. The frequencies scale as g<sup>2/3</sup>, so the measured &nu;<sub>13</sub> alone asks for g = '+numF(A.gfit,3)+' m/s&sup2;, inside their fitted 9.866 &plusmn; 0.042 and '+numF((SRC.qbounce.nu13[0]-A.nu13)/SRC.qbounce.nu13[1],2)+' standard deviations from the value at g<sub>local</sub>.</p>'
      +EQ(3,'&int;<sub>0</sub><sup>z<sub>n</sub></sup> k dz = (n &minus; &frac14;)&pi; &nbsp;&rArr;&nbsp; E<sub>n</sub> &asymp; (3&pi;/2 (n &minus; &frac14;))<sup>2/3</sup> E&#8320;')
      +'<p>WKB: the wave leaves the soft turning point with phase &pi;/4, and the mirror asks for a node. The error is '+numF((A.lev[0].Ewkb/A.lev[0].E-1)*100,2)+' % for the first level and '+numF(Math.abs(A.lev[7].Ewkb/A.lev[7].E-1)*100,3)+' % for the eighth; it is the leading term of the zeros&rsquo; own expansion (DLMF 9.9.6).</p>'; }
    return '<h4>the equation and its values at 0</h4>'
      +EQ(1,'w&Prime; = x w, &nbsp; Ai(0) = '+FR('1','3<sup>2/3</sup>&Gamma;(&#8532;)')+' = '+numF(AIRY0.ai,12)+', &nbsp; Bi(0) = '+FR('1','3<sup>1/6</sup>&Gamma;(&#8532;)')+' = '+numF(AIRY0.bi,12))
      +'<p>DLMF 9.2.3&ndash;9.2.6, with the page&rsquo;s own &Gamma; (Stirling&rsquo;s series, its Bernoulli numbers generated by their recurrence). The Wronskian Ai Bi&prime; &minus; Ai&prime; Bi = 1/&pi; is checked at every point drawn.</p>'
      +'<h4>how the page computes them</h4>'
      +'<p>For x &le; 0 by Taylor steps of the equation itself from x = 0, each step&rsquo;s coefficients from c<sub>k+2</sub> = (x&#8320;c<sub>k</sub> + c<sub>k&minus;1</sub>)/((k+1)(k+2)); for x &gt; 0.5, Ai from K<sub>1/3</sub>(&zeta;) (DLMF 9.6.2) by the trapezoid rule on &int;e<sup>&minus;&zeta; cosh t</sup>cosh(t/3) dt, and Bi from its Maclaurin series, whose terms are all positive there. In the complex plane: the Maclaurin series inside |z| = 5.75, the asymptotic series beyond, and the connection formula DLMF 9.2.12 near the negative axis.</p>'
      +EQ(2,'a<sub>k</sub> = &minus;T('+FR('3&pi;','8')+'(4k &minus; 1)), &nbsp; T(t) ~ t<sup>2/3</sup>(1 + '+FR('5','48')+'t<sup>&minus;2</sup> &minus; '+FR('5','36')+'t<sup>&minus;4</sup> + &hellip;)')
      +'<p>DLMF 9.9.6 and 9.9.18, used as the first guess and polished by Newton&rsquo;s method: a<sub>1</sub> = '+numF(A.mode==='real'?A.a[0]:airyZeroA(1),10)+'.</p>';
  }
  if(v==='son'){ const S=M.S;
    if(S.mode==='poly') return '<h4>the definition</h4>'
      +EQ(1,'(1 &minus; s)<sup>&minus;m&minus;1</sup> e<sup>&minus;xs/(1&minus;s)</sup> = &Sigma;<sub>n</sub> S<sub>m</sub><sup>(n)</sup>(x) s<sup>n</sup>, &nbsp; S<sub>m</sub><sup>(n)</sup>(x) = &Sigma;<sub>p=0</sub><sup>n</sup> '+FR('(m+p+1)<sub>n&minus;p</sub>','(n&minus;p)! p!')+' (&minus;x)<sup>p</sup>')
      +'<p>Chapman &amp; Cowling sec. 7.5, identical to DLMF 18.12.13 and 18.5.12 for L<sub>n</sub><sup>(m)</sup>. For half-integer m the coefficients are fractions, computed here in exact integer arithmetic.</p>'
      +EQ(2,'&int;<sub>0</sub><sup>&infin;</sup> x<sup>m</sup> e<sup>&minus;x</sup> S<sub>m</sub><sup>(p)</sup> S<sub>m</sub><sup>(q)</sup> dx = '+FR('&Gamma;(m + p + 1)','p!')+' &delta;<sub>pq</sub>')
      +'<p>Sonine&rsquo;s own polynomial (1880, p. 41) is T<sub>m</sub><sup>n</sup> = (&minus;1)<sup>n</sup>S<sub>m</sub><sup>(n)</sup>/&Gamma;(m+n+1): its leading term is y<sup>n</sup>/(n! &Gamma;(m+n+1)) and its norm 1/(n! &Gamma;(m+n+1)). Chapman &amp; Cowling&rsquo;s footnote to sec. 7.5 writes it as &Gamma;(m+n+1)(&minus;1)<sup>n</sup>S<sub>m</sub><sup>(n)</sup>, the gamma function on the wrong side.</p>';
    if(S.mode==='gas'){ const p2=cePower2(S.nu);
      return '<h4>the Sonine expansion</h4>'
      +EQ(1,'&Sigma;<sub>q=1</sub><sup>N</sup> a<sub>pq</sub> c<sub>q</sub> = &delta;<sub>p1</sub>, &nbsp; [&lambda;]<sub>N</sub>/[&lambda;]<sub>1</sub> = a<sub>11</sub>c<sub>1</sub> = a<sub>11</sub>(A<sub>N</sub><sup>&minus;1</sup>)<sub>11</sub>')
      +'<p>The right-hand side of the linearised Boltzmann equation for heat flow is f&#8320;(C&sup2; &minus; 5/2)C = &minus;f&#8320;S<sub>3/2</sub><sup>(1)</sup>(C&sup2;)C, so only the first Sonine term is driven; the bracket integrals a<sub>pq</sub> couple the rest. For viscosity the same with S<sub>5/2</sub><sup>(p)</sup>(C&sup2;)C&deg;C, p from 0.</p>'
      +'<h4>the hard-sphere brackets</h4>'
      +'<p>derive.py integrates each bracket over the pair&rsquo;s centre-of-mass and relative velocities and the scattering angle. For hard spheres the scattering is isotropic and the integrand a polynomial times a Gaussian, so product Gauss rules integrate it exactly; it returns Chapman &amp; Cowling&rsquo;s a<sub>12</sub> = &minus;&frac14;a<sub>11</sub>, a<sub>22</sub> = 45/16 a<sub>11</sub>, a<sub>33</sub> = 5657/1024 a<sub>11</sub> and b<sub>22</sub> = 205/48 b<sub>11</sub> to 13 digits, and Tipton&rsquo;s exact second to fifth approximations. With '+CE_NMAX+' terms the factors are '+numF(S.lam[CE_NMAX-1],9)+' and '+numF(S.eta[CE_NMAX-1],9)+'.</p>'
      +EQ(2,'[&lambda;]<sub>2</sub>/[&lambda;]<sub>1</sub> = 1 + '+FR('(2&epsilon; &minus; 1)&sup2;','44 &minus; 4&epsilon;')+', &nbsp; [&eta;]<sub>2</sub>/[&eta;]<sub>1</sub> = 1 + '+FR('3(2&epsilon; &minus; 1)&sup2;','202 &minus; 12&epsilon;')+', &nbsp; &epsilon; = '+FR('2','&nu; &minus; 1'))
      +'<p>For a repulsion r<sup>&minus;&nu;</sup> the second approximation needs only the ratios &Omega;<sup>(2)</sup>(3)/&Omega;<sup>(2)</sup>(2) = 4 &minus; &epsilon; and &Omega;<sup>(2)</sup>(4)/&Omega;<sup>(2)</sup>(2) = (4 &minus; &epsilon;)(5 &minus; &epsilon;). At &nu; = 5 (Maxwell molecules) the correction vanishes; at &nu; = '+(S.nu>=59.99?'&infin;':numF(S.nu,1))+' it is '+numF((p2.lam-1)*100,3)+' % and '+numF((p2.eta-1)*100,3)+' %; hard spheres (&epsilon; = 0) give 1/44 and 3/202. Chapman &amp; Cowling&rsquo;s fourth viscosity approximation, 1&middot;01600, is their sum of rounded increments; the approximation itself is '+numF(S.eta[3],6)+'.</p>'; }
    return '<h4>the distribution</h4>'
      +EQ(1,'f = f&#8320;(1 + &epsilon;&phi;), &nbsp; f&#8320; = &pi;<sup>&minus;3/2</sup>e<sup>&minus;C&sup2;</sup>, &nbsp; &phi; = '+(S.kind==='heat'?'&minus;A(C) C<sub>z</sub>':'B(C) C<sub>x</sub>C<sub>z</sub>'))
      +'<p>A and B from the '+CE_NMAX+'-term hard-sphere solution, normalised so that A = S<sub>3/2</sub><sup>(1)</sup>(C&sup2;) = 5/2 &minus; C&sup2; and B = 1 at the first order. '+(S.kind==='heat'?'&int;f&#8320;&phi; C d&sup3;C = 0: no net flow of molecules, since &phi; is orthogonal to S<sub>3/2</sub><sup>(0)</sup>; the heat flux &int;f&#8320;&phi; C&sup2; C d&sup3;C is not zero.':'The stress is the moment &int;f&#8320;&phi; C<sub>x</sub>C<sub>z</sub> d&sup3;C.')+'</p>'
      +'<p>No strength keeps f&#8320;(1 + &epsilon;&phi;) positive everywhere: &phi; is a polynomial in C, so far enough out &epsilon;&phi; passes &minus;1. '
      +(S.neg===null?'':'At &epsilon; = '+numF(S.eps,2)+' that happens first at '+(S.kind==='heat'?'C<sub>z</sub> = '+num(S.neg,3):'|C| = '+numF(Math.abs(S.neg),3)+' along the diagonal C<sub>x</sub> = &minus;C<sub>z</sub>')+', where f&#8320; is '+sigf(Math.exp(-S.neg*S.neg),2)+' of its peak. ')
      +'The expansion is asymptotic in the Knudsen number: it holds where &epsilon;&phi; is small, which is where the molecules are.</p>';
  }
  if(v==='zeros'){ const Z=M.Z;
    if(Z.mode==='charges') return '<h4>the energy and its minimum</h4>'
      +EQ(1,'E = &minus;&Sigma;<sub>i&lt;j</sub> ln|x<sub>i</sub> &minus; x<sub>j</sub>| + &Sigma;<sub>i</sub> V(x<sub>i</sub>), &nbsp; '+FR('&part;E','&part;x<sub>i</sub>')+' = V&prime;(x<sub>i</sub>) &minus; &Sigma;<sub>j&ne;i</sub>'+FR('1','x<sub>i</sub> &minus; x<sub>j</sub>'))
      +'<p>At a zero x<sub>i</sub> of p = &Pi;(x &minus; x<sub>j</sub>), p&Prime;/p&prime; = 2&Sigma;<sub>j&ne;i</sub>1/(x<sub>i</sub> &minus; x<sub>j</sub>), and the differential equation F p&Prime; + &tau; p&prime; = 0 there makes that sum &minus;&tau;/(2F), which is exactly V&prime; for each family (for Hermite, &Sigma;<sub>j</sub> 1/(x<sub>i</sub> &minus; x<sub>j</sub>) = x<sub>i</sub>). So the zeros are a critical point of E; and E is convex over the ordered configurations (its Hessian is diagonally dominant with V&Prime; &gt; 0), so it is the minimum.</p>'
      +EQ(2,'x&#775;<sub>i</sub> = &minus;&part;E/&part;x<sub>i</sub>, &nbsp; &Delta;t &le; 1/&lambda;<sub>max</sub>, &nbsp; &lambda;<sub>max</sub> &le; max<sub>i</sub>(V&Prime; + 2&Sigma;<sub>j</sub>(x<sub>i</sub> &minus; x<sub>j</sub>)<sup>&minus;2</sup>)')
      +'<p>The charges follow the downhill flow, each step held under the stability limit that Gershgorin&rsquo;s bound on the Hessian gives, and short of any neighbour. Settle finishes with Newton&rsquo;s method on &nabla;E = 0.</p>';
    if(Z.mode==='quad') return '<h4>Gauss&rsquo;s rule</h4>'
      +EQ(1,'&int;<sub>&minus;1</sub><sup>1</sup> f dx &asymp; &Sigma;<sub>i=1</sub><sup>n</sup> w<sub>i</sub> f(x<sub>i</sub>), &nbsp; P<sub>n</sub>(x<sub>i</sub>) = 0, &nbsp; exact for deg f &le; 2n &minus; 1')
      +'<p>Divide a polynomial of degree 2n &minus; 1 by P<sub>n</sub>: the quotient has degree n &minus; 1 and is orthogonal to P<sub>n</sub>, so only the remainder is integrated, and at the zeros of P<sub>n</sub> the remainder equals the polynomial.</p>'
      +EQ(2,'J = tridiag(&radic;B<sub>k</sub>, A<sub>k</sub>, &radic;B<sub>k</sub>): &nbsp; x<sub>i</sub> = eig(J), &nbsp; w<sub>i</sub> = &mu;&#8320; z<sub>1i</sub>&sup2;')
      +'<p>Golub&ndash;Welsch, from the monic three-term recurrence x p<sub>k</sub> = p<sub>k+1</sub> + A<sub>k</sub>p<sub>k</sub> + B<sub>k</sub>p<sub>k&minus;1</sub>; the page diagonalises J by the implicit QL algorithm, carrying only the first row of the eigenvectors.</p>';
    return '<h4>the limiting densities</h4>'
      +EQ(1,'&rho;<sub>H</sub>(t) = '+FR('2','&pi;')+'&radic;(1 &minus; t&sup2;), &nbsp; &rho;<sub>L</sub>(t) = '+FR('2','&pi;')+'&radic;'+FR('1 &minus; t','t')+', &nbsp; &rho;<sub>P</sub>(t) = '+FR('1','&pi;&radic;(1 &minus; t&sup2;)'))
      +'<p>For the Hermite zeros scaled by &radic;(2n), the Laguerre zeros by 4n and the Legendre zeros as they stand. The Kolmogorov distance is the largest gap between the zeros&rsquo; counting function and the integral of &rho;; it falls like 1/n.</p>';
  }
  const F=M.F, L=F.L;
  return '<h4>'+L.name+'</h4>'+EQ(1,L.formula)
    +'<p>DLMF '+L.dlmf+'. The window runs over '+L.xlab+' from '+numF(L.x0,0)+' to '+numF(L.x1,0)+'; the largest gap there falls like '+L.par+'<sup>'+numF(L.rate,2)+'</sup>, and the page measures '+numF(F.rate,2)+' from its own sweep.</p>'
    +'<h4>the map</h4><p>Jacobi = (&alpha;+1)<sub>n</sub>/n! &middot; <sub>2</sub>F<sub>1</sub>(&minus;n, n+&alpha;+&beta;+1; &alpha;+1; (1&minus;x)/2) (DLMF 18.5.7); Laguerre = (&alpha;+1)<sub>n</sub>/n! &middot; <sub>1</sub>F<sub>1</sub>(&minus;n; &alpha;+1; x) (18.5.12); J<sub>&nu;</sub> = (z/2)<sup>&nu;</sup>/&Gamma;(&nu;+1) &middot; <sub>0</sub>F<sub>1</sub>(; &nu;+1; &minus;z&sup2;/4) (10.16.9); and Ai(z) = Ai(0) <sub>0</sub>F<sub>1</sub>(; &#8532;; z&sup3;/9) + Ai&prime;(0) z <sub>0</sub>F<sub>1</sub>(; 4/3; z&sup3;/9), which is DLMF 9.4.1 term by term.</p>';
}


/* ================================================================== *
 *  selfTest — headless verification.  REF is build_cg/refvals.json,   *
 *  the printed output of derive.py (sympy, numpy, mpmath), read in    *
 *  full.  makeShot: the recording context (build_aa lineage).          *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];

/* ================================================================== *
 *  selfTest — headless verification.  REF is build_sf/refvals.json,   *
 *  the printed output of derive.py (mpmath at 40 digits, sympy, the   *
 *  bracket quadrature), read in full.  Every computed quantity is     *
 *  pinned to it; each series or asymptotic branch is tested at its    *
 *  join; each limit by its rate; the drawing at four sizes.           *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol*Math.max(Math.abs(b),1e-300),name+' ['+a+' vs '+b+']');
  const mixd=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol*Math.max(Math.abs(b),1),name+' ['+a+' vs '+b+']');
  const has=(s,sub2,name)=>ok(String(s).indexOf(sub2)>=0,name+' [missing "'+sub2+'"]');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){ Object.assign(ST,DEFAULTS,over); simReset(); for(const k in MEMO) delete MEMO[k];
    try{ return fn(); } finally{ Object.assign(ST,stSave); simReset(); } }

  /* ---------- 0. the shared helpers ---------- */
  ok(plain('&Delta;V &omega; &#955; &nu;&#8321; &frac58;')==='ΔV ω λ ν₁ &frac58;','plain() decodes named and numeric entities and passes unknown ones through for the audit');
  ok(ticksFor(0.8,0.2,5).length===1&&ticksFor(0.2,0.8,5).length>=3,'axes() range-sort is what rescues an inverted axis');
  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }
  eq(sigf(1.768e8,4),'1.768 × 10⁸','sigf writes a power of ten in superscripts'); eq(sigf(2.5e-5,2),'2.5 × 10⁻⁵','and a negative power');
  eq(num(-0.001234,3),'−0.00123','num: a proper minus and three figures'); eq(numF(-0.0004,2),'0.00','numF drops the sign of a rounded zero');
  eq(autoFmt([0,5,10])(5),'5','ticks five apart print whole numbers'); eq(autoFmt([0,0.25,0.5])(-0.25),'−0.25','a quarter step prints two decimals, with a minus');
  eq(autoFmt([0,2.5,5])(2.5),'2.5','a step of 2.5 prints one decimal'); eq(autoFmt([0.1,0.2,0.30000000000000004])(0.30000000000000004),'0.3','a tick with float noise still prints briefly');
  eq(autoFmt([-1e-17,0.5,1])(-1e-17),'0.0','a rounded zero loses its minus');
  eq(sub('k')+sub(10)+sup('(n)')+sup('−2'),'ₖ₁₀⁽ⁿ⁾⁻²','the super- and subscript glyphs');
  eq(par(0.5)+','+par(-0.3)+','+par(2)+','+par(1.25),'0.5,−0.3,2,1.25','parameters print as briefly as they are set');
  /* Bernoulli numbers by the page's recurrence; Gamma from Stirling's series with them */
  REF.misc.bern.forEach((b,n)=>{ if(n%2===0||n===1) rel(BERN[n],b,n>=16?1e-12:1e-14,'B_'+n+' (sympy)'); });
  for(const [x,g] of REF.misc.gamma) rel(gammaFn(x),g,4e-15,'Gamma('+x+') (mpmath)');
  /* ln Gamma below 2 is the log of Gamma (4e-15 relative), so its error is absolute there */
  for(const [x,g] of REF.misc.lgamma) mixd(lgammaPos(x),g,x<2?5e-15:3e-16,'ln Gamma('+x+')');
  eq(rgamma(-3),0,'1/Gamma at a pole is exactly 0'); rel(rgamma(0.5),1/Math.sqrt(PI),1e-15,'1/Gamma(1/2)');
  { const a=gammaFn(7-1e-12), b2=gammaFn(7+1e-12); rel(a,720,1e-11,'Gamma just below 7 (the product branch)'); rel(b2,720,1e-11,'and just above (Stirling)'); rel(a,b2,1e-11,'continuous across the join'); }
  for(const [x,d] of REF.misc.digamma) rel(digamma(x),d,5e-15,'psi('+x+')');
  rel(EULER_GAMMA,REF.misc.euler,1e-15,'Euler’s constant from Euler–Maclaurin');
  eq(cospi(5.5),0,'cos(5.5 pi) is exactly 0'); eq(sinpi(3),0,'sin(3 pi) is exactly 0'); eq(cospi(7),-1,'cos(7 pi) = -1'); rel(cospi(1/3),0.5,1e-15,'cos(pi/3)');

  /* ---------- 1. the Rodrigues ladder and the families ---------- */
  const famOf=c=>FAMS[c.fam], parOf=c=>c.fam==='gegen'?{lam:c.a}:c.fam==='jacobi'?{a:c.a,b:c.b}:c.fam==='laguerre'?{a:c.a}:{};
  for(const c of REF.rod.cases){ const f=famOf(c), p=parOf(c), tag=c.fam+JSON.stringify(p);
    for(let n=0;n<=8;n++){ const L=rodLadder(f,n,p);
      c.p[n].forEach((v,i)=>close(L.pn[i]||0,v,1e-11*Math.max(1,Math.abs(v)),tag+' p'+n+' coefficient '+i+' by Rodrigues (sympy)'));
      rel(f.kappa(n,p),c.kap[n],1e-14,tag+' kappa_'+n+' (Table 18.5.1)'); rel(f.h(n,p),c.h[n],3e-14,tag+' h_'+n+' (Table 18.3.1)');
      rel(f.k(n,p),c.k[n],1e-14,tag+' k_'+n); close(f.lam(n,p),c.lam[n],1e-12,tag+' lambda_'+n);
      /* the polynomial satisfies its differential equation, F p'' + tau p' + lambda p = 0, as a polynomial identity */
      if(n>0){ const d1=polyDeriv(L.pn), d2=polyDeriv(d1), r=polyAdd(polyAdd(polyMul(f.F,d2),polyMul(f.tau(p),d1)),polyScale(L.pn,f.lam(n,p)));
        let big=0, sc=0; r.forEach(v=>big=Math.max(big,Math.abs(v))); L.pn.forEach(v=>sc=Math.max(sc,Math.abs(v)));
        ok(big<=1e-11*sc*Math.max(1,f.lam(n,p)),tag+' n='+n+': the ODE residual '+big.toExponential(1)); } }
    const L5=rodLadder(f,5,p);
    c.rungs5.forEach((co,k)=>co.forEach((v,i)=>close(L5.Q[k][i]||0,v,1e-11*Math.max(1,Math.abs(v)),tag+' rung '+k+' coefficient '+i)));
    c.zeros5.forEach((zs,k)=>{ eq(L5.Z[k].length,k,tag+' rung '+k+' has '+k+' zeros inside'); zs.forEach((v,i)=>close(L5.Z[k][i],v,2e-12*Math.max(1,Math.abs(v)),tag+' rung '+k+' zero '+i+' (mpmath)')); });
    /* Rolle: each rung's zeros interlace the one above's, the ends included */
    for(let k=1;k<5;k++){ const lo=isFinite(f.lo)?f.lo:-1e9, hi=isFinite(f.hi)?f.hi:1e9, a=[lo].concat(L5.Z[k],[hi]);
      ok(L5.Z[k+1].every((z,i)=>z>a[i]&&z<a[i+1]),tag+' Rolle: rung '+(k+1)+' zeros lie between rung '+k+'’s'); }
  }
  const FM={jacobi:(n,x,p)=>jacobiP(n,p[0],p[1],x),gegen:(n,x,p)=>gegenC(n,p[0],x),laguerre:(n,x,p)=>laguerreL(n,p[0],x),hermite:(n,x)=>hermiteH(n,x),legendre:(n,x)=>legendreP(n,x),chebT:(n,x)=>chebT(n,x),chebU:(n,x)=>chebU(n,x)};
  for(const [fn,pars,n,t,v] of REF.rod.vals) close(FM[fn](n,t,pars),v,1e-12*Math.max(1,Math.abs(v)),fn+' '+JSON.stringify(pars)+' n='+n+' x='+t+' by the recurrence (mpmath)');
  /* the view: Rodrigues and the recurrence agree for every family at n = 10 */
  for(const id of FAM_ORDER) withState({view:'rod',rFam:id,rN:10,rK:10},()=>{ const R=rodView(ST); ok(R.gap<1e-12,id+' n=10: Rodrigues and the recurrence agree to '+R.gap.toExponential(1)); });
  withState({view:'rod',rFam:'jacobi',rN:7,rJa:-0.9,rJb:3.7},()=>{ const R=rodView(ST); ok(R.gap<1e-11&&R.rungs.every(r=>r.bal.every(isFinite)),'Jacobi at a = -0.9: every rung finite (the ends are never sampled), gap '+R.gap.toExponential(1)); });
  withState({view:'rod',rFam:'laguerre',rN:6,rLa:-0.9},()=>{ const R=rodView(ST); ok(R.rungs.every(r=>r.bal.every(isFinite)),'Laguerre at a = -0.9: every rung finite'); });

  /* ---------- 2. Legendre functions: the grid, the joins, a recurrence in the degree ---------- */
  const LG=REF.leg;
  LG.nu.forEach((nu,i)=>LG.m.forEach((m,j)=>LG.x.forEach((x,k)=>{
    mixd(ferrers(nu,m,x,'P'),LG.P[i][j][k],2e-10,'P nu='+nu+' m='+m+' x='+x+' (mpmath legenp)');
    mixd(ferrers(nu,m,x,'Q'),LG.Q[i][j][k],2e-10,'Q nu='+nu+' m='+m+' x='+x+' (mpmath legenq)'); })));
  /* the joins at |x| = 0.85: the series against the hypergeometric (P) and the ODE (Q) just past it, where the series
     still converges; and each branch as used on either side */

    ok(Z.E.every((e,i)=>i===0||e<=Z.E[i-1]+1e-9*Math.abs(Z.E[i-1])+1e-13),'the energy never rises'); ok(!runStep(ST),'and at rest nothing moves'); });
  withState({view:'zeros',zRun:false},()=>{ buildModel(); ok(!runStep(ST),'the charges wait while unticked'); });
  for(const v of ['leg','airy','son','fam']) withState({view:v},()=>{ ok(!runStep(ST),v+' stands still'); });
  withState({view:'rod'},()=>{ ok(!runStep(ST),'the ladder stands still until asked to build'); });

  /* ---------- 10. the pointer ---------- */
  const shot=(over,W,H)=>withState(over,()=>{ const c=makeShot(W||1100,H||712); drawView(c,W||1100,H||712,buildModel()); return {ops:c.ops,hit:HIT.slice()}; });
  const pressAt=(over,kind,fx,fy)=>withState(over,()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const h2=HIT.find(q=>q.kind===kind);
    if(!h2) return {}; const S=makeScene({getContext:()=>c}); S.pointer('down',h2.b.x+h2.b.w*fx,h2.b.y+h2.b.h*fy); S.pointer('up',0,0); return Object.assign({},ST); });
  { const r=pressAt({view:'leg'},'lx',0.3,0.5); rel(r.lX,-1+2*0.3,1e-9,'a press on the P, Q plot sets the probe'); }
  { const r=pressAt({view:'leg'},'lnu',0.437,0.5); close(r.lNu,4.37,0.011,'a press on sin(nu pi)/pi sets nu to the hundredth'); }
  { const r=pressAt({view:'leg',lMode:'cone'},'beta',0.3,0.5); close(r.lBeta,54,0.051,'a press on nu(beta) sets beta'); }
  { const r=pressAt({view:'airy'},'ax',0.6315,0.5); close(r.aX,-15+20*0.6315,0.006,'a press on the Airy plot moves the probe'); }
  { const r=pressAt({view:'airy',aMode:'bouncer'},'level',0.5,1-2.46/7.2); eq(r.aLev,2,'a press at the second level’s height picks it'); }
  { const r=pressAt({view:'son',sMode:'gas'},'gnu',0.25,0.5); close(r.gNu,5+55*0.25,1e-9,'a press on the power-law plot sets nu'); }
  { const r=pressAt({view:'zeros',zMode:'quad'},'qn',0.52,0.5); eq(r.qN,Math.round(1+29*0.52),'a press on the error plot sets n'); }
  { const r=pressAt({view:'fam'},'fpar',0.5,0.5); eq(r.fPar,Math.round(2*Math.pow(1000,0.5)),'a press on the gap plot sets the degree'); }
  { const r=withState({view:'fam'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const h2=HIT.find(q=>q.kind==='fmap'), e=h2.hits.find(q=>q.id==='besai');
      const S=makeScene({getContext:()=>c}); S.pointer('down',e.x+2,e.y-1); S.pointer('up',0,0); return Object.assign({},ST); }); eq(r.fLim,'besai','a press on an arrow of the map follows it'); eq(r.fPar,LIMITS.find(q=>q.id==='besai').def,'at its default parameter'); }
  /* the middle of each rung's row picks that rung, exactly */
  for(const k of [0,2,5,6]){ const r=withState({view:'rod',rN:6,rK:6,rPlay:true},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const h2=HIT.find(q=>q.kind==='rung'), S=makeScene({getContext:()=>c});
      S.pointer('down',h2.b.x+h2.b.w/2,h2.top+(k+0.5)*(h2.hh+h2.gap)); S.pointer('up',0,0); return Object.assign({},ST); });
    eq(r.rK,k,'a press on rung '+k+'’s row stops the ladder there'); ok(!r.rPlay,'and stops the building'); }
  { const r=withState({view:'leg',lMode:'harm'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const h2=HIT.find(q=>q.kind==='cam'), S=makeScene({getContext:()=>c});
      const th0=ST.camTheta, x0=h2.b.x+h2.b.w/2, y0=h2.b.y+h2.b.h/2; S.pointer('down',x0,y0); S.pointer('move',x0+50,y0+30); S.pointer('up',0,0); return {dth:ST.camTheta-th0,ph:ST.camPhi}; });
    close(r.dth,-50*0.008,1e-12,'a drag turns the sphere about the axis'); close(r.ph,DEFAULTS.camPhi+30*0.006,1e-12,'and tilts it'); }

  /* ---------- 11. the drawing: every view and mode at four sizes ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[['rod',{view:'rod'}],['rod jacobi',{view:'rod',rFam:'jacobi',rN:7,rK:4}],['rod laguerre',{view:'rod',rFam:'laguerre',rN:6,rK:6}],['rod hermite true',{view:'rod',rFam:'hermite',rN:10,rK:10,rTrue:true}],
    ['rod chebT n1',{view:'rod',rFam:'chebT',rN:1,rK:1}],['rod gegen',{view:'rod',rFam:'gegen',rN:8,rK:8,rGl:0.05}],
    ['leg pq',{view:'leg'}],['leg pq int',{view:'leg',lNu:3,lM:2}],['leg pq m4',{view:'leg',lNu:0.3,lM:4,lQ:false}],['leg pq nu0',{view:'leg',lNu:0}],
    ['leg cone',{view:'leg',lMode:'cone'}],['leg cone narrow',{view:'leg',lMode:'cone',lBeta:5}],['leg cone needle',{view:'leg',lMode:'cone',lBeta:179.5}],
    ['leg multi',{view:'leg',lMode:'multi'}],['leg multi 0',{view:'leg',lMode:'multi',lL:0,lGam:0}],['leg multi 40',{view:'leg',lMode:'multi',lL:40,lGam:180}],
    ['leg harm',{view:'leg',lMode:'harm'}],['leg harm abs',{view:'leg',lMode:'harm',hShow:'abs',hL:7,hM:-3}],['leg harm sum',{view:'leg',lMode:'harm',hShow:'sum',hL:10,hM:0}],['leg harm 00',{view:'leg',lMode:'harm',hL:0,hM:0}],
    ['airy real',{view:'airy'}],['airy real +',{view:'airy',aX:3.7}],['airy real 0',{view:'airy',aX:0.2}],['airy real -15',{view:'airy',aX:-15}],
    ['airy cx ai',{view:'airy',aMode:'complex'}],['airy cx bi',{view:'airy',aMode:'complex',aFn:'bi'}],
    ['airy bouncer',{view:'airy',aMode:'bouncer'}],['airy bouncer 8',{view:'airy',aMode:'bouncer',aLev:8}],
    ['son poly',{view:'son'}],['son poly m',{view:'son',sM:-0.9,sN:8}],['son poly n0',{view:'son',sM:2.5,sN:0}],
    ['son gas',{view:'son',sMode:'gas'}],['son gas 12',{view:'son',sMode:'gas',gN:12,gNu:5}],['son dist heat',{view:'son',sMode:'dist'}],['son dist shear',{view:'son',sMode:'dist',dKind:'shear',dEps:0.5}],
    ['zeros charges',{view:'zeros'}],['zeros lag',{view:'zeros',zFam:'laguerre',zN:12,zA:-0.9}],['zeros jac',{view:'zeros',zFam:'jacobi',zN:24,zA:4,zB:-0.9}],['zeros cheb 2',{view:'zeros',zFam:'chebT',zN:2}],
    ['zeros quad',{view:'zeros',zMode:'quad'}],['zeros quad abs 1',{view:'zeros',zMode:'quad',qFn:'abs',qN:1}],['zeros quad 30',{view:'zeros',zMode:'quad',qFn:'semi',qN:30}],
    ['zeros many',{view:'zeros',zMode:'many'}],['zeros many lag',{view:'zeros',zMode:'many',mFam:'laguerre',mN:400}],['zeros many leg',{view:'zeros',zMode:'many',mFam:'legendre',mN:5}],
    ...LIMITS.map(L=>['fam '+L.id,{view:'fam',fLim:L.id,fPar:L.def}]),['fam lo',{view:'fam',fLim:'hermai',fPar:4}],['fam hi',{view:'fam',fLim:'laghe',fPar:1e6}]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[nm]=Math.max(tDraw[nm]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke'), fills=c.ops.filter(o=>o.op==='fill');
      /* a colour field is fills, not strokes: the floor counts what the ops carry (pascals_triangle's lesson) */
      ok(strokes.length+fills.length>=10&&texts.length>=4,nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+fills.length+' fills, '+texts.length+' texts)');
      { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/\^/.test(t.t)){ bad='a caret power: "'+t.t.slice(0,40)+'"'; break; }
        if(/\d[eE][-+]?\d/.test(t.t)){ bad='a raw exponent: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
      let across=null;
      for(const L of LABELS){ if(L.seq===undefined) continue;
        for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
        if(across) break; }
      ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
    });
  }
  /* where the text audit is blind: labels against lines, the stage floors */
  const segBox=(a,b,bb)=>{ const x0=bb[0]+1, y0=bb[1]+1, x1=bb[2]-1, y1=bb[3]-1, dx=b[0]-a[0], dy=b[1]-a[1]; let t0=0, t1=1;
    for(const [p,q] of [[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){
      if(p===0){ if(q<0) return false; } else { const r=q/p; if(p<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } } }
    return true; };
  const hitsBox=(op,bb)=>(op.paths||[]).some(p=>p.some((q,i)=>i>0&&segBox(p[i-1],q,bb)));
  for(const [W,H] of [[1400,820],[1100,700]]){
    { const S=shot({view:'leg',lMode:'cone'},W,H), L=S.ops.find(q=>q.op==='text'&&q.t==='the apex'); ok(!!L&&!S.ops.some(q=>q.op==='stroke'&&hitsBox(q,L.bb)),'the apex’s label is clear of every line at '+W+'x'+H); }
    { const S=shot({view:'airy',aMode:'bouncer'},W,H), labs=S.ops.filter(q=>q.op==='text'&&/^n = \d$/.test(q.t)); eq(labs.length,8,'eight levels named at '+W+'x'+H);
      ok(labs.every(L=>!S.ops.some(q=>q.op==='stroke'&&hitsBox(q,L.bb))),'the level names are clear of every line'); }
    { const S=shot({view:'rod'},W,H), labs=S.ops.filter(q=>q.op==='text'&&/^\(w F|^w F|^P₅$/.test(q.t)); eq(labs.length,6,'six rungs named');
      const h2=S.hit.find(q=>q.kind==='rung'); ok(labs.every(L=>L.bb[2]<h2.b.x-2),'every rung’s name sits left of the rungs'); }
  }
  for(const [W,H] of SIZES) for(const nb of [0,1,2]){ const L=stageLayout(makeShot(W,H),W,H,'x '.repeat(200),'x',nb,0.36,nbNarrow(H));
    ok(L.main.h>=120&&L.bottom.every(q=>q.h>=60),W+'x'+H+', '+nb+' plots: the picture keeps '+L.main.h.toFixed(0)+' px and every plot 60 or more'); }
  let slow=Object.entries(tDraw).sort((a,b)=>b[1]-a[1]).slice(0,5);
  console.log('slowest draws (ms): '+JSON.stringify(slow));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
