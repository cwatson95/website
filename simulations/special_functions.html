<title>Special functions &mdash; Rodrigues&rsquo; formula, Legendre, Airy and Sonine, their zeros and their limits</title>
<!--
  ===================================================================
  special_functions.html — the classical special functions: how
  Rodrigues' formula builds the orthogonal polynomials, the Legendre
  functions on the sphere and the cone, the Airy functions at a
  turning point and under a bouncing neutron, the Sonine polynomials
  in the kinetic theory of gases, the zeros as charges and as Gauss
  nodes, and the limits that join the families
  ===================================================================

  Six views.  THE RODRIGUES LADDER: w F^n differentiated n times,
  one rung per derivative, for Legendre, Chebyshev T and U,
  Gegenbauer, Jacobi, Laguerre (Sonine) and Hermite; each rung gains
  one zero inside the interval (Rolle), and the last, divided by
  kappa_n w, is the polynomial, which the three-term recurrence
  reproduces.  LEGENDRE FUNCTIONS: the Ferrers functions P and Q of
  any real degree (the logarithm at x = -1 unless the degree is an
  integer), the degree a conducting cone chooses (the lightning rod),
  the multipole expansion of a point charge and where it converges,
  and the spherical harmonics with their nodal circles.  THE TURNING
  POINT: Ai and Bi on the line with their asymptotic forms and the
  optimal truncation of Ai's divergent series, both in the complex
  plane (the zeros, Bi's complex ones), and the quantum levels of a
  neutron above a mirror against the GRANIT and qBounce
  measurements.  SONINE AND THE GAS: the Sonine polynomials (exact
  coefficients), the Chapman-Enskog conductivity and viscosity of a
  hard-sphere gas in 1 to 12 Sonine terms against Pekeris & Alterman,
  the second approximation for any repulsion r^-nu, and the distorted
  Maxwellian that carries heat or shear.  THE ZEROS: unit charges in
  the weight's field settling onto the zeros (Stieltjes), Gauss
  quadrature against the trapezoid and Simpson, and the limiting
  densities of many zeros.  THE FAMILY: eight limit transitions with
  their measured rates (Mehler-Heine, the Hermite edge, the Bessel
  transition, Jacobi to Laguerre to Hermite).

  WHAT IS EXACT, WHAT IS MEASURED, WHAT IS MODELLED
  -------------------------------------------------------------------
  Nearly everything here is mathematics, computed on the page and
  pinned in selfTest to build_sf/derive.py (mpmath at 40 digits,
  sympy for the exact polynomials): the polynomials, their zeros,
  norms and recurrences; the Ferrers functions (series, DLMF 14.3.4,
  an ODE sweep in s = ln tan(theta/2), and the reflections); the Airy
  functions (Taylor steps, K_(1/3), Maclaurin, the asymptotic series
  and DLMF 9.2.10/9.2.12 in the complex plane); Bessel J (Miller's
  algorithm); the limits and their rates.
  The one piece of data the page takes from derive.py is the table of
  hard-sphere Chapman-Enskog brackets (HSDATA): the five-dimensional
  collision integrals, which derive.py integrates exactly by product
  Gauss rules.  It reproduces Chapman & Cowling's printed ratios
  (a12 = -a11/4, a22 = 45 a11/16, a33 = 5657 a11/1024, b22 = 205
  b11/48, b33 = 11889 b11/1024) and Tipton's exact 2nd to 5th
  approximations (45/44, 60989/59512, ...; 205/202, 1178769/1160344,
  ...), and converges to 1.025218 and 1.016034 (Pekeris & Alterman).
  Measured, and quoted with their sources (build_sf/data/sources.json,
  every needle checked by check_sources.py): the neutron mass (CODATA
  2022), g at Grenoble 9.80507 m/s^2 and the qBounce frequencies
  nu13 = 464.8 +- 1.3 Hz, nu14 = 649.8 +- 1.8 Hz (Cronenberg et al.,
  Nature Physics 14, 1022, 2018), the critical heights z1 = 12.2 +-
  1.8 +- 0.7 um and z2 = 21.6 +- 2.2 +- 0.7 um (Nesvizhevsky et al.,
  Eur. Phys. J. C 40, 479, 2005).
  Modelled: the neutron sees only m g z and a perfect mirror; the
  gas is hard spheres (or an inverse-power repulsion, second
  approximation only); the Chapman-Enskog distribution is drawn at an
  exaggerated strength, and to first order it turns negative in the
  far tail at every strength, since phi is a polynomial in C (the
  readout names where).
  Not modelled: the absorber and the finite slit of the real neutron
  experiments, and any real gas's attraction.

  FOUND IN THE LITERATURE (in the prose, not changed)
  - Chapman & Cowling's footnote to sec. 7.5 writes Sonine's own
    polynomial as Gamma(m+n+1)(-1)^n S_m^(n); Sonine's p. 41 series
    is (-1)^n S_m^(n) / Gamma(m+n+1) (its norm confirms it).
  - Chapman & Cowling's [mu]_4 = 1.01600 is the sum of their rounded
    increments; the fourth approximation is 1.016006.
  - Nesvizhevsky et al. print z4 = 39.9 um, the product of rounded
    inputs (6.79 x 5.87); the Airy zero gives 39.8 um.
-->

const clamp=(x,a,b)=>x<a?a:x>b?b:x;

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }

}

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow

   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){

    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.

   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }

let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';

  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });

/* pick the first corner of panel b that no already-recorded curve segment

   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }

     caption names the colours */
  return null;

 *  the numerical core, part 1: the gamma function, exact cos(pi t),  *

 *  Rodrigues ladder and the Gauss rules (Golub-Welsch)               *

/* ---- the Bernoulli numbers by their recurrence (never typed): sum_{k<=m} C(m+1,k) B_k = 0 ---- */
const BERN=(()=>{ const B=[1]; for(let m=1;m<=20;m++){ let s=0, c=1;           /* c = C(m+1, k) */
  for(let k=0;k<m;k++){ s+=c*B[k]; c=c*(m+1-k)/(k+1); } B.push(-s/(m+1)); } return B; })();
/* Stirling's correction S(x) = sum_k B_2k / (2k(2k-1) x^(2k-1)), k = 1..10: below 1e-17 of the whole from x = 7 */
function stirlingS(x){ let s=0, xp=x; const x2=x*x; for(let k=1;k<=10;k++){ s+=BERN[2*k]/(2*k*(2*k-1)*xp); xp*=x2; } return s; }
/* ln Gamma(x) for x > 0; below 7 through Gamma(x) = Gamma(x+N) / (x (x+1) ... (x+N-1)), the product taken whole */
function lgammaPos(x){
  if(!(x>0)||!isFinite(x)) return x===Infinity?Infinity:NaN;
  if(x>=7) return (x-0.5)*Math.log(x)-x+0.5*Math.log(2*PI)+stirlingS(x);
  let prod=1; while(x<7){ prod*=x; x+=1; }
  return (x-0.5)*Math.log(x)-x+0.5*Math.log(2*PI)+stirlingS(x)-Math.log(prod);
}
/* Gamma(x) for x >= 7 without taking exp of a large logarithm: sqrt(2 pi) (x^((x-1/2)/2) e^(-x/2))^2 e^S; the power is
   halved so that it cannot overflow before Gamma does (x^(x-1/2) passes 1.8e308 at x = 143) */
function gammaStirling(x){ const h=Math.pow(x,(x-0.5)/2)*Math.exp(-x/2); return Math.sqrt(2*PI)*h*h*Math.exp(stirlingS(x)); }
/* exact cos(pi t), sin(pi t): t reduced exactly (subtracting an integer is exact), so a half-integer gives an exact
   0 and an integer an exact +-1; Math.cos(5.5*PI) is -1.8e-16, which times a Q of 3e6 is a visible error */
function cospi(t){
  const r=t-2*Math.floor(t/2);
  if(r===0.5||r===1.5) return 0; if(r===0) return 1; if(r===1) return -1;
  return Math.cos(PI*r);

/* Gamma(x): a pole is Infinity; negative non-integers by reflection, Gamma(x) Gamma(1-x) = pi / sin(pi x) */
function gammaFn(x){
  if(isNonPosInt(x)) return Infinity;
  if(x<0.5) return PI/(sinpi(x)*gammaFn(1-x));
  if(x>171.6) return Infinity;
  if(x>=7) return gammaStirling(x);

  if(isNonPosInt(x)) return 0;

function jacobiP(n,a,b,x){                       /* DLMF 18.9.2; A_0, B_0 by continuity at a + b = 0 or -1 */
  if(n===0) return 1;

  for(let k=1;k<n;k++){

/* the monic Jacobi-family recurrence x p_k = p_{k+1} + A_k p_k + B_k p_{k-1} (A_0 and B_1 by continuity) */
function monicJacobi(n,a,b){
  const A=[], B=[];
  for(let k=0;k<n;k++){ const s=2*k+a+b; A.push(k===0?(b-a)/(a+b+2):(b*b-a*a)/(s*(s+2))); }
  for(let k=1;k<n;k++){ const s=2*k+a+b;
    B.push(k===1?4*(1+a)*(1+b)/((2+a+b)*(2+a+b)*(3+a+b)):4*k*(k+a)*(k+b)*(k+a+b)/(s*s*(s+1)*(s-1))); }
  return {A,B,mu0:Math.pow(2,a+b+1)*gammaFn(a+1)*gammaFn(b+1)*rgamma(a+b+2)};

/* ================================================================== *
 *  the Rodrigues ladder: rung k is (w F^n)^(k) = w F^(n-k) Q_k, with *
 *  Q_0 = 1 and Q_{k+1} = (tau + (n-k-1) F') Q_k + F Q_k' — exact     *
 *  polynomial arithmetic, never a numerical n-th derivative.  The    *

 *  gap between the zeros of rung k and the ends of the interval.     *
 * ================================================================== */

    /* an infinite end is replaced by Cauchy's bound: every root has |x| < 1 + max |c_i / c_k| */
    let cb=0; for(let i=0;i<k;i++) cb=Math.max(cb,Math.abs(c[i]/c[k])); cb+=1;

/* ================================================================== *
 *  Gauss rules by Golub-Welsch: the eigenvalues of the Jacobi matrix *

 *  carried along) are the nodes; the weights are mu_0 z_j^2.         *
 * ================================================================== */

      if(m===l) break;

/* ---- the Ferrers functions P_nu^m(x), Q_nu^m(x) on (-1, 1), integer m >= 0, real nu >= 0 (DLMF 14.3, 14.6: the

   hypergeometric series 14.3.4 in (1-x)/2, Q by RK4 in s = ln tan(theta/2), where the equation is the smooth
   y_ss = (m^2 - nu(nu+1) sech^2 s) y and Q is the growing solution; at negative x the reflections

/* ---- Sonine polynomials S_m^(n)(x) = L_n^(m)(x): Chapman & Cowling sec. 7.5, the coefficient of s^n in
   (1-s)^(-m-1) exp(-xs/(1-s)) (DLMF 18.12.13); m is the index, n the degree ---- */
function sonine(m,n,x){ return laguerreL(n,m,x); }
/* the coefficients, lowest power first: S = sum_p (m+p+1)_(n-p) (-x)^p / ((n-p)! p!)  (DLMF 18.5.12) */
function sonineCoefs(m,n){ const c=[]; for(let p=0;p<=n;p++) c.push(poch(m+p+1,n-p)/(factorial(n-p)*factorial(p))*(p%2?-1:1)); return c; }
/* exact coefficients for a half-integer index m = M/2, as fractions num/den (BigInt): the readout prints them */
function gcdBig(a,b){ a=a<0n?-a:a; b=b<0n?-b:b; while(b){ const t=a%b; a=b; b=t; } return a; }
function sonineExact(M2,n){
  /* (m+p+1)_(n-p) with m = M2/2: prod_{j=0}^{n-p-1} (M2 + 2p + 2 + 2j)/2 */
  const out=[];
  for(let p=0;p<=n;p++){
    let num=1n, den=1n;
    for(let j=0;j<n-p;j++){ num*=BigInt(M2+2*p+2+2*j); den*=2n; }
    let f=1n; for(let i=2;i<=n-p;i++) f*=BigInt(i); for(let i=2;i<=p;i++) f*=BigInt(i);
    den*=f; if(p%2) num=-num;
    const g=gcdBig(num,den); out.push([num/g,den/g]);
  }
  return out;
}
function fracStr(fr){ const [a,b]=fr; return b===1n?String(a):String(a)+'/'+String(b); }

/* ---- Chapman-Enskog, hard spheres: f^(N) = M_11 (M_N^-1)_11 over the first N Sonine terms (HSDATA: A for heat
   conduction, B for viscosity), and the perturbation function's coefficients c = M_11 M_N^-1 e_1 ---- */
function solveSym(M,rhs){                       /* Gaussian elimination with partial pivoting, on copies */
  const n=rhs.length, A=M.map(r=>r.slice(0,n)), b=rhs.slice();
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]]; [b[c],b[p]]=[b[p],b[c]];
    for(let r=c+1;r<n;r++){ const f=A[r][c]/A[c][c]; if(f===0) continue; for(let k=c;k<n;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; }
  }
  const x=new Array(n).fill(0);
  for(let r=n-1;r>=0;r--){ let s=b[r]; for(let k=r+1;k<n;k++) s-=A[r][k]*x[k]; x[r]=s/A[r][r]; }
  return x;
}
function ceSolve(M,N){
  const e=new Array(N).fill(0); e[0]=1;
  const c=solveSym(M,e).map(v=>v*M[0][0]);
  return {f:c[0],c};
}
const CE_NMAX=12;
const CE=(()=>{ const lam=[], eta=[], cA=[], cB=[];
  for(let N=1;N<=CE_NMAX;N++){ const a=ceSolve(HSDATA.A,N), b=ceSolve(HSDATA.B,N); lam.push(a.f); eta.push(b.f); cA.push(a.c); cB.push(b.c); }
  return {lam,eta,cA,cB}; })();
/* the heat-flow function A(C) (index 3/2, p = 1..N) and the shear function B(C) (index 5/2, p = 0..N-1) at order N,
   normalised so that A = S_3/2^(1)(C^2) = 5/2 - C^2 and B = 1 at the first order */
function ceA(N,C){ const c=CE.cA[N-1]; let s=0; for(let p=0;p<N;p++) s+=c[p]*sonine(1.5,p+1,C*C); return s; }
function ceB(N,C){ const c=CE.cB[N-1]; let s=0; for(let p=0;p<N;p++) s+=c[p]*sonine(2.5,p,C*C); return s; }
/* where the first-order distribution first turns negative along a cut. phi is a polynomial in C, so for every
   eps > 0 the factor 1 + eps phi passes zero somewhere. Heat: along C_z, phi = -A(|C_z|) C_z. Shear: along the
   diagonal C_x = -C_z, where phi = -B(C) C^2/2 (on the drawn diagonal C_x = C_z, phi >= 0). Scanned outward on
   both sides in steps of 0.01 to |C| = 8, the first crossing refined by Illinois */
function distPhi(kind,c){ return kind==='heat'?-ceA(CE_NMAX,Math.abs(c))*c:-ceB(CE_NMAX,Math.abs(c))*c*c/2; }
function distNeg(kind,eps){
  if(!(eps>0)) return null;
  const g=c=>1+eps*distPhi(kind,c); let best=null;
  for(const sg of [1,-1]){ let c0=0, g0=1;
    for(let i=1;i<=800;i++){ const c1=sg*i/100, g1=g(c1);
      if(g1<=0){ const r=rootIllinois(g,c0,c1,g0,g1); if(best===null||Math.abs(r)<Math.abs(best)) best=r; break; }
      c0=c1; g0=g1; } }
  return best;
}
/* the second approximation for a repulsion ~ r^-nu (Maxwell nu = 5; hard spheres nu -> oo): only the ratios
   Omega^(2)(3)/Omega^(2)(2) = 4 - eps and Omega^(2)(4)/Omega^(2)(2) = (4 - eps)(5 - eps), eps = 2/(nu-1), enter:
   a_11 : a_12 : a_22 = 4 : 7 - 2(4-eps) : 77/4 - 7(4-eps) + (4-eps)(5-eps), and 301/12 in place of 77/4 for b */
function cePower2(nu){
  const e=isFinite(nu)?2/(nu-1):0, r3=4-e, r4=(4-e)*(5-e);
  const a11=4, a12=7-2*r3, a22=77/4-7*r3+r4, b22=301/12-7*r3+r4;
  return {eps:e, lam:1+a12*a12/(a11*a22-a12*a12), eta:1+a12*a12/(a11*b22-a12*a12)};
}
/* the pseudo-Maxwell gas (isotropic, rate independent of speed): the Burnett functions are eigenfunctions, with
   lambda_rl = int_0^pi [cos^(2r+l)(chi/2) P_l(cos chi/2) + sin^(2r+l)(chi/2) P_l(sin chi/2) - 1 - d_r0 d_l0] sin chi dchi */
function wcuEigen(r,l){
  const G=gaussRule(FAMS.legendre,24); let s=0;
  for(let i=0;i<G.x.length;i++){ const chi=PI/2*(G.x[i]+1), c=Math.cos(chi/2), sn=Math.sin(chi/2);
    s+=G.w[i]*PI/2*(Math.pow(c,2*r+l)*legendreP(l,c)+Math.pow(sn,2*r+l)*legendreP(l,sn)-1-(r===0&&l===0?1:0))*Math.sin(chi); }
  return s;
}

/* ================================================================== *
 *  Stieltjes: n unit charges on the line, repelling as -ln|x_i-x_j|, *
 *  in the weight's field V: Hermite x^2/2; Laguerre x/2 - ((a+1)/2)  *
 *  ln x; Jacobi -((a+1)/2) ln(1-x) - ((b+1)/2) ln(1+x).  At rest they *
 *  sit exactly on the zeros of the family's degree-n polynomial.      *
 * ================================================================== */
function stField(f,p){
  if(f.id==='hermite') return {V:x=>x*x/2, dV:x=>x, d2V:()=>1, lo:-Infinity, hi:Infinity};
  if(f.id==='laguerre'){ const q=(p.a+1)/2; return {V:x=>x/2-q*Math.log(x), dV:x=>0.5-q/x, d2V:x=>q/(x*x), lo:0, hi:Infinity, q}; }
  const ab=f.jab(p), qa=(ab[0]+1)/2, qb=(ab[1]+1)/2;
  return {V:x=>-qa*Math.log(1-x)-qb*Math.log(1+x), dV:x=>qa/(1-x)-qb/(1+x), d2V:x=>qa/((1-x)*(1-x))+qb/((1+x)*(1+x)), lo:-1, hi:1, qa, qb};
}
function stEnergy(xs,fd){ let E=0; for(let i=0;i<xs.length;i++){ E+=fd.V(xs[i]); for(let j=i+1;j<xs.length;j++) E-=Math.log(Math.abs(xs[i]-xs[j])); } return E; }
function stGrad(xs,fd){ return xs.map((x,i)=>{ let s=fd.dV(x); for(let j=0;j<xs.length;j++) if(j!==i) s-=1/(x-xs[j]); return s; }); }
/* mulberry32 with a scrambled seed (consecutive seeds give correlated first draws: dividers' Known-bad) */
function rng32(seed){ let a=(Math.imul(seed^0x9e3779b9,0x85ebca6b)^0xc2b2ae35)>>>0;
  return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function stStart(f,n,p,seed){
  const r=rng32(seed), w=famWindow(f,n,p), lo=f.id==='laguerre'?0.05:w[0], hi=w[1], xs=[];
  const a=f.id==='hermite'?lo*0.8:lo+0.02*(hi-lo), b=f.id==='hermite'?hi*0.8:hi-0.02*(hi-lo);
  for(let i=0;i<n;i++) xs.push(a+(b-a)*r());
  xs.sort((u,v)=>u-v);
  for(let i=1;i<n;i++) if(xs[i]-xs[i-1]<1e-3*(b-a)) xs[i]=xs[i-1]+1e-3*(b-a);
  return xs;
}
/* the Hessian of E: H_ii = V''(x_i) + sum_j 1/(x_i - x_j)^2, H_ij = -1/(x_i - x_j)^2 */
function stHess(xs,fd){
  const n=xs.length, H=[];
  for(let i=0;i<n;i++){ const row=new Array(n).fill(0); let d=fd.d2V(xs[i]);
    for(let j=0;j<n;j++) if(j!==i){ const q=1/((xs[i]-xs[j])*(xs[i]-xs[j])); row[j]=-q; d+=q; }
    row[i]=d; H.push(row); }
  return H;
}
/* one explicit step of the overdamped flow dx/dt = -dE/dx.  The step is held under the stability limit 2/lambda_max
   (Gershgorin: lambda_max <= max_i V'' + 2 sum_j 1/(x_i - x_j)^2) and short of any neighbour or wall; a fixed
   step oscillated about the zeros for 200 000 steps */
function stStep(xs,fd,dtMax){
  const g=stGrad(xs,fd), n=xs.length;
  let lmax=0;
  for(let i=0;i<n;i++){ let r=fd.d2V(xs[i]); for(let j=0;j<n;j++) if(j!==i) r+=2/((xs[i]-xs[j])*(xs[i]-xs[j])); lmax=Math.max(lmax,r); }
  let dt=Math.min(dtMax,1/lmax);
  for(let i=0;i<n;i++){
    const room=Math.min(i>0?xs[i]-xs[i-1]:(isFinite(fd.lo)?xs[i]-fd.lo:Infinity), i<n-1?xs[i+1]-xs[i]:(isFinite(fd.hi)?fd.hi-xs[i]:Infinity));
    if(Math.abs(g[i])>0) dt=Math.min(dt,0.3*room/Math.abs(g[i]));
  }
  let gn=0; for(const v of g) gn=Math.max(gn,Math.abs(v));
  return {xs:xs.map((x,i)=>x-dt*g[i]),dt,gnorm:gn};
}
/* Newton on grad E = 0, halved until the charges keep their order and their walls: quadratic at the end */
function stNewton(xs,fd){
  const g=stGrad(xs,fd), d=solveSym(stHess(xs,fd),g.map(v=>-v)), n=xs.length;
  let t=1;
  for(let k=0;k<60;k++){
    const y=xs.map((x,i)=>x+t*d[i]);
    let ok=true;
    for(let i=0;ok&&i<n;i++){ if(i>0&&y[i]<=y[i-1]) ok=false; if(isFinite(fd.lo)&&y[i]<=fd.lo) ok=false; if(isFinite(fd.hi)&&y[i]>=fd.hi) ok=false; }
    if(ok&&stEnergy(y,fd)<=stEnergy(xs,fd)+1e-12*Math.abs(stEnergy(xs,fd))) return y;
    t/=2;
  }
  return xs;
}
function stSettle(xs,fd){ for(let k=0;k<60;k++){ const y=stNewton(xs,fd); let dm=0; y.forEach((v,i)=>dm=Math.max(dm,Math.abs(v-xs[i]))); xs=y; if(dm<1e-15) break; } return xs; }

/* P_n(cos theta) for small theta: cos(z/n) carries a rounding error that P_n' ~ n^2/2 multiplies (5e-11 at n = 1000),
   so the recurrence runs on e_k = 1 - P_k with the versine u = 1 - cos theta = 2 sin^2(theta/2):
   e_(k+1) = ((2k+1) e_k + (2k+1) u (1 - e_k) - k e_(k-1)) / (k+1) */
function legendreTheta(n,th){
  const sh=Math.sin(th/2), u=2*sh*sh;
  if(n===0) return 1;
  let e0=0, e1=u;
  for(let k=1;k<n;k++){ const e2=((2*k+1)*e1+(2*k+1)*u*(1-e1)-k*e0)/(k+1); e0=e1; e1=e2; }
  return 1-e1;
}

/* the largest gap between the scaled function and its limit, on a grid of the window */
function limitSup(L,par,opt){
  const o=opt||{}, a=L.alpha!==undefined?(o.alpha!==undefined?o.alpha:L.alpha):0, n=L.n||0, N=o.grid||241;
  let e=0;

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the clock: the ladder's stages step on their own, the charges flow ---- */
const SIM={t:0, acc:0, xs:null, E:[], steps:0, key:'', rest:false};
const FRAME=1/60, STAGE_S=0.7, FLOW_PER_FRAME=6;
function simReset(){ SIM.t=0; SIM.acc=0; SIM.xs=null; SIM.E=[]; SIM.steps=0; SIM.key=''; SIM.rest=false; }
function viewAnimates(st){ return (st.view==='rod'&&st.rPlay)||(st.view==='zeros'&&st.zMode==='charges'&&st.zRun&&!SIM.rest); }
function runStep(st){
  if(!viewAnimates(st)) return false;
  SIM.t+=FRAME;
  if(st.view==='rod'){
    SIM.acc+=FRAME;
    if(SIM.acc>=STAGE_S){ SIM.acc=0; if(st.rK<st.rN) st.rK++; if(st.rK>=st.rN) st.rPlay=false; }
    return true;
  }
  const Z=chargesState(st);
  for(let i=0;i<FLOW_PER_FRAME&&!SIM.rest;i++){
    const r=stStep(SIM.xs,Z.fd,1); SIM.xs=r.xs; SIM.steps++;
    SIM.E.push(stEnergy(SIM.xs,Z.fd)-Z.Estar);
    if(r.gnorm<1e-9) SIM.rest=true;
  }
  return true;
}

function rodPar(st){ const id=st.rFam; return id==='jacobi'?{a:st.rJa,b:st.rJb}:id==='gegen'?{lam:st.rGl}:id==='laguerre'?{a:st.rLa}:{}; }
function rodView(st){
  const f=FAMS[st.rFam], p=rodPar(st), n=st.rN;
  const base=memo('rod',JSON.stringify([st.rFam,n,p]),()=>{
    const L=rodLadder(f,n,p), win=famWindow(f,n,p), NS=360, xs=[];
    /* a finite interval is sampled at Chebyshev points, never at +-1 (the weight blows up there when a < 0 or b < 0),
       denser towards the ends where the rungs' zeros crowd */
    if(isFinite(f.lo)&&isFinite(f.hi)) for(let i=0;i<NS;i++) xs.push(-Math.cos(PI*(i+0.5)/NS));
    else for(let i=0;i<=NS;i++) xs.push(win[0]+(win[1]-win[0])*(i===0&&f.id==='laguerre'?1e-4:i)/NS);
    const rungs=[];
    for(let k=0;k<=n;k++){
      const bal=[], tru=[];
      for(const x of xs){
        const q=polyEval(L.Q[k],x);
        if(k===n){ bal.push(q/L.kappa); tru.push(q/L.kappa); continue; }
        const wF=f.w(x,p)*Math.pow(polyEval(f.F,x),n-k);
        bal.push(Math.sqrt(wF)*q); tru.push(wF*q);
      }
      rungs.push({bal,tru,zeros:L.Z[k]});
    }
    /* the recurrence's p_n on the same grid: Rodrigues and the recurrence are two roads to one polynomial */
    const rec=xs.map(x=>f.ev(n,x,p));
    let gap=0, scale=0;
    xs.forEach((x,i)=>{ gap=Math.max(gap,Math.abs(rungs[n].bal[i]-rec[i])); scale=Math.max(scale,Math.abs(rec[i])); });
    /* on an infinite interval the bare polynomial is all x^n at the window's ends: the last rung is drawn as
       sqrt(w) p_n there (the Hermite and Laguerre functions), and the recurrence's curve with it */
    const inf=!(isFinite(f.lo)&&isFinite(f.hi)), recShow=inf?rec.map((v,i)=>v*Math.sqrt(f.w(xs[i],p))):rec;
    if(inf) rungs[n].bal=rungs[n].bal.map((v,i)=>v*Math.sqrt(f.w(xs[i],p)));
    return {L,win,xs,rungs,rec,recShow,inf,gap:scale>0?gap/scale:0,kappa:L.kappa,h:f.h(n,p),kn:f.k(n,p),lam:f.lam(n,p),tau:f.tau(p)};
  });
  return Object.assign({f,p,n,k:clamp(st.rK,0,n),trueScale:st.rTrue},base);
}

/* nu(beta) over the whole range: state-free, so computed once and kept outside MEMO (which the tests clear) */
const CONE_CURVE={v:null};
function coneCurve(){ if(!CONE_CURVE.v){ const out=[]; for(let bd=2;bd<=178;bd+=2) out.push([bd,coneNu(bd*PI/180)]); CONE_CURVE.v=out; } return CONE_CURVE.v; }
function legView(st){
  const M={mode:st.lMode};
  if(st.lMode==='pq'){
    const nu=st.lNu, m=st.lM;
    Object.assign(M,memo('legpq',JSON.stringify([nu,m]),()=>{
      const NS=640, xs=[]; for(let i=0;i<NS;i++) xs.push(-Math.cos(PI*(i+0.5)/NS));
      const c=ferrersCurve(nu,m,xs);
      const integer=Math.abs(nu-Math.round(nu))<1e-9, nI=Math.round(nu);
      /* the zeros of P_nu^m in (-1, 1): sign changes on the grid, refined by bisection */
      const zeros=[];
      for(let i=1;i<NS;i++) if(isFinite(c.P[i])&&isFinite(c.P[i-1])&&c.P[i]!==0&&(c.P[i]<0)!==(c.P[i-1]<0))
        zeros.push(bisectRoot(x=>ferrers(nu,m,x,'P'),xs[i-1],xs[i],ferrers(nu,m,xs[i-1],'P')));
      return {nu,m,xs,P:c.P,Q:c.Q,integer,vanishes:integer&&m>nI,
        P0:ferrersInit(nu,m,'P'),Q0:ferrersInit(nu,m,'Q'),logCoef:sinpi(nu)/PI,logConst:m===0?ferrersLogConst(nu):null,zeros};
    }));
    M.probe={x:st.lX,P:ferrers(nu,m,st.lX,'P'),Q:ferrers(nu,m,st.lX,'Q')};
  } else if(st.lMode==='cone'){
    const beta=st.lBeta*PI/180;
    M.curve=coneCurve();
    Object.assign(M,memo('cone',String(st.lBeta),()=>{
      const nu=coneNu(beta), nu2=coneNu(beta,2), th=[], NS=240;
      for(let i=0;i<NS;i++) th.push(beta*i/(NS-1)*0.9995);
      const c=ferrersCurve(nu,0,th.map(Math.cos));
      return {beta,nu,nu2,th,P:c.P,needle:1/(2*Math.log(2/(PI-beta))),hole:J01/beta-0.5};
    }));
  } else if(st.lMode==='multi'){
    Object.assign(M,memo('multi',String(st.lL),()=>multipoleGrid(st.lL)));
    M.ray=multipoleRay(st.lL,st.lGam*PI/180);
  } else {
    Object.assign(M,memo('harm',JSON.stringify([st.hL,st.hM,st.hShow]),()=>harmonicsMesh(st.hL,st.hM,st.hShow)));
  }
  return M;
}
/* the potential of a unit charge at z = 1 on the axis and its first L + 1 multipole terms,
   1/|r - z| = sum_l r_<^l / r_>^(l+1) P_l(cos gamma) (DLMF 14.7.19 and 14.7.21), on a grid of the x-z plane */
const MP_EXT=2.2, MP_N=120;
function multipoleAt(L,x,z){
  const r=Math.hypot(x,z), cg=r>0?z/r:1, rl=Math.min(r,1), rg=Math.max(r,1), t=rl/rg;
  let p0=1, p1=cg, s=1/rg, tl=1/rg;
  if(L>=1){ tl*=t; s+=tl*p1; }
  for(let l=1;l<L;l++){ const p2=((2*l+1)*cg*p1-l*p0)/(l+1); p0=p1; p1=p2; tl*=t; s+=tl*p1; }
  return s;
}
function multipoleGrid(L){
  const E=[], V=[];
  for(let j=0;j<MP_N;j++){ const er=[], vr=[]; const z=MP_EXT-2*MP_EXT*(j+0.5)/MP_N;
    for(let i=0;i<MP_N;i++){ const x=-MP_EXT+2*MP_EXT*(i+0.5)/MP_N, ex=1/Math.hypot(x,z-1), ap=multipoleAt(L,x,z);
      vr.push(ap); er.push(Math.log10(Math.max(Math.abs(ap-ex)/ex,1e-16))); }
    E.push(er); V.push(vr); }
  return {L,E,V};
}
function multipoleRay(L,g){
  const rs=[], err=[], err0=[];
  for(let i=1;i<=300;i++){ const r=3*i/300; rs.push(r);
    const x=r*Math.sin(g), z=r*Math.cos(g), ex=1/Math.hypot(x,z-1);
    err.push(Math.abs(multipoleAt(L,x,z)-ex)/ex); }
  return {g,rs,err};
}
/* the sphere, coloured by Re Y_l^m, |Y_l^m|^2 or the sum over m; the nodal circles */
const SPH_NT=36, SPH_NP=72;
function harmonicsMesh(l,m,show){
  const val=[], am=Math.abs(m);
  let vmax=0, vmin=Infinity, smax=-Infinity;
  for(let i=0;i<=SPH_NT;i++){ const th=PI*i/SPH_NT, row=[];
    for(let j=0;j<=SPH_NP;j++){ const ph=2*PI*j/SPH_NP; let v;
      if(show==='sum'){ v=0; for(let mm=-l;mm<=l;mm++){ const y=ylm(l,mm,th,ph); v+=y[0]*y[0]+y[1]*y[1]; } }
      else { const y=ylm(l,m,th,ph); v=show==='re'?y[0]:y[0]*y[0]+y[1]*y[1]; }
      row.push(v); vmax=Math.max(vmax,Math.abs(v)); vmin=Math.min(vmin,v); smax=Math.max(smax,v); }
    val.push(row); }
  /* nodal latitudes: the l - |m| zeros of P_l^|m|(cos theta) in (0, pi) */
  const lat=[], NS=2000; let prev=assocLegendre(l,am,1-1e-12);
  for(let i=1;i<=NS;i++){ const th=PI*i/NS*(1-1e-9), v=assocLegendre(l,am,Math.cos(th));
    if(v!==0&&(v<0)!==(prev<0)){ const t0=PI*(i-1)/NS, g=t=>assocLegendre(l,am,Math.cos(t)); lat.push(bisectRoot(g,t0,th,g(t0))); }
    prev=v; }
  /* nodal meridians of Re Y (cos m phi = 0): |m| great circles; |Y|^2 has none */
  const mer=[]; if(show==='re'&&am>0) for(let k=0;k<2*am;k++) mer.push((2*k+1)*PI/(2*am));
  const prof=[]; for(let i=0;i<=240;i++){ const th=PI*i/240; prof.push([th,ylmNorm(l,am)*assocLegendre(l,am,Math.cos(th))]); }
  return {l,m,show,val,vmax,vmin,smax,lat,mer,prof,unsold:(2*l+1)/(4*PI)};
}

function airyView(st){
  const M={mode:st.aMode};
  if(st.aMode==='real'){
    Object.assign(M,memo('airyreal','all',()=>{
      const xs=[], ai=[], bi=[]; for(let i=0;i<=1400;i++){ const x=-15+20*i/1400; const r=airy(x); xs.push(x); ai.push(r.ai); bi.push(r.bi); }
      const a=[], b=[]; for(let k=1;k<=14;k++){ const z=airyZeroA(k); if(z>-15) a.push(z); const w=airyZeroB(k); if(w>-15) b.push(w); }
      return {xs,ai,bi,a,b};
    }));
    const x=st.aX, r=airy(x);
    M.probe=Object.assign({x},r);
    M.zeta=2/3*Math.pow(Math.abs(x),1.5);
    M.series=Math.abs(x)>=0.5?airySeriesErrors(x,30):null;
  } else if(st.aMode==='complex'){
    Object.assign(M,memo('airycx',st.aFn,()=>airyComplexGrid(st.aFn)));
  } else Object.assign(M,bouncerModel(st));
  return M;
}
/* the oscillatory asymptotic series on the negative axis, DLMF 9.7.9, with its first n terms (powers of 1/zeta) */
function airyAsymAiNeg(x,n){
  const t=-x, z=2/3*t*Math.sqrt(t); let c=0, s=0, zk=1;
  for(let k=0;k<n;k++){ const term=AIRY_U[k]/zk*((Math.floor(k/2))%2?-1:1); if(k%2===0) c+=term; else s+=term; zk*=z; }
  return (Math.cos(z-PI/4)*c+Math.sin(z-PI/4)*s)/(Math.sqrt(PI)*Math.pow(t,0.25));
}
/* the relative error of the n-term series at x against the page's own Ai, n = 1..N; the best n and its error */
function airySeriesErrors(x,N){
  const ai=airy(x).ai, err=[];
  for(let n=1;n<=N;n++){ const s=x>0?airyAsymAi(x,n):airyAsymAiNeg(x,n); err.push(Math.abs(s-ai)/Math.abs(ai)); }
  let nb=1; for(let n=2;n<=N;n++) if(err[n-1]<err[nb-1]) nb=n;
  return {err,nbest:nb,best:err[nb-1],floor:Math.exp(-2*2/3*Math.pow(Math.abs(x),1.5))};
}
const AC_EXT=8, AC_N=150;
function airyComplexGrid(fn){
  const re=[], im=[];
  for(let j=0;j<AC_N;j++){ const y=AC_EXT-2*AC_EXT*(j+0.5)/AC_N, rr=[], ii=[];
    for(let i=0;i<AC_N;i++){ const x=-AC_EXT+2*AC_EXT*(i+0.5)/AC_N, v=fn==='ai'?airyAiC([x,y]).ai:airyBiC([x,y]).bi; rr.push(v[0]); ii.push(v[1]); }
    re.push(rr); im.push(ii); }
  const zr=[], zc=[];
  if(fn==='ai'){ for(let k=1;k<=6;k++) zr.push(airyZeroA(k)); }
  else { for(let k=1;k<=6;k++) zr.push(airyZeroB(k)); for(let k=1;k<=4;k++){ const z=airyZeroBc(k); zc.push(z,[z[0],-z[1]]); } }
  return {fn,re,im,zr,zc};
}
/* the bouncing neutron: V = m g z over a mirror at z = 0.  psi_n = Ai(z/z0 + a_n), E_n = -a_n m g z0,
   z0 = (hbar^2 / (2 m^2 g))^(1/3) */
function bouncerModel(st){
  return memo('bouncer','all',()=>{
    const m=SRC.neutron.m_n, h=SRC.neutron.h, g=SRC.neutron.g, hb=h/(2*PI), eV=1.602176634e-19;
    const z0=Math.cbrt(hb*hb/(2*m*m*g)), E0=m*g*z0, a=[], lev=[];
    for(let k=1;k<=12;k++) a.push(airyZeroA(k));
    for(let k=0;k<12;k++) lev.push({n:k+1,a:a[k],E:-a[k]*E0,z:-a[k]*z0,norm:1/(Math.sqrt(z0)*Math.abs(airy(a[k]).aip)),
                                     Ewkb:Math.pow(1.5*PI*(k+1-0.25),2/3)*E0});
    const nu=(i,j)=>(lev[j-1].E-lev[i-1].E)/h;
    return {m,h,g,z0,E0,eV,lev,nu13:nu(1,3),nu14:nu(1,4),nu12:nu(1,2),gfit:g*Math.pow(SRC.qbounce.nu13[0]/nu(1,3),1.5)};
  });
}

function sonView(st){
  const M={mode:st.sMode};
  if(st.sMode==='poly'){
    const m=st.sM, n=st.sN;
    Object.assign(M,memo('sonpoly',JSON.stringify([m,n]),()=>{
      const X=Math.max(10,4*n+2*m+12), xs=[]; for(let i=0;i<=500;i++) xs.push(X*i/500);
      const curves=[]; for(let k=0;k<=n;k++) curves.push(xs.map(x=>sonine(m,k,x)*Math.sqrt(Math.pow(x,m)*Math.exp(-x))));
      const G=gaussRule(FAMS.laguerre,n+2,{a:m}), gram=[];
      for(let i=0;i<=n;i++){ const row=[];
        for(let j=0;j<=n;j++){ let s=0; for(let q=0;q<G.x.length;q++) s+=G.w[q]*sonine(m,i,G.x[q])*sonine(m,j,G.x[q]);
          row.push(s/Math.sqrt(FAMS.laguerre.h(i,{a:m})*FAMS.laguerre.h(j,{a:m}))); }
        gram.push(row); }
      const zeros=n>0?gaussRule(FAMS.laguerre,n,{a:m}).x:[];
      const M2=Math.round(2*m), exact=Math.abs(2*m-M2)<1e-9&&M2>=-1&&M2<=12?sonineExact(M2,n):null;
      return {m,n,X,xs,curves,gram,zeros,exact,coefs:sonineCoefs(m,n),norm:FAMS.laguerre.h(n,{a:m})};
    }));
  } else if(st.sMode==='gas'){
    M.N=st.gN; M.lam=CE.lam; M.eta=CE.eta; M.p2=cePower2(st.gNu); M.nu=st.gNu;
    M.curve=memo('powcurve','all',()=>{ const o=[]; for(let i=0;i<=220;i++){ const nu=5+55*i/220; o.push([nu,cePower2(nu)]); } return o; });
    M.A=memo('ceA','all',()=>{ const Cs=[], rows=[]; for(let i=0;i<=200;i++) Cs.push(3.5*i/200);
      for(let N=1;N<=CE_NMAX;N++) rows.push(Cs.map(C=>ceA(N,C))); return {Cs,rows}; });
  } else {
    M.kind=st.dKind; M.eps=st.dEps; M.neg=memo('distneg',JSON.stringify([st.dKind,st.dEps]),()=>distNeg(st.dKind,st.dEps));
    /* the cut drawn under the map: heat along C_z; shear along the diagonal C_x = C_z, where phi = +B C^2/2 */
    M.cut=(()=>{ const cz=[], f0=[], f1=[];
      for(let i=0;i<=300;i++){ const c=-3.2+6.4*i/300, F0=Math.exp(-c*c)/Math.pow(PI,1.5), ph=st.dKind==='heat'?distPhi('heat',c):-distPhi('shear',c);
        cz.push(c); f0.push(F0); f1.push(F0*(1+st.dEps*ph)); }
      return {cz,f0,f1}; })();
    Object.assign(M,memo('dist',JSON.stringify([st.dKind]),()=>{
      const N=96, E=3.2, phi=[]; let mx=0;
      for(let j=0;j<N;j++){ const cz=E-2*E*(j+0.5)/N, row=[];
        for(let i=0;i<N;i++){ const cxv=-E+2*E*(i+0.5)/N, C=Math.hypot(cxv,cz), f0=Math.exp(-C*C)/Math.pow(PI,1.5);
          const ph=st.dKind==='heat'?-ceA(CE_NMAX,C)*cz:ceB(CE_NMAX,C)*cxv*cz;
          row.push(f0*ph); mx=Math.max(mx,Math.abs(f0*ph)); }
        phi.push(row); }
      return {N,E,phi,mx};
    }));
  }
  return M;
}

function zeroPar(st,fid){ return fid==='jacobi'?{a:st.zA,b:st.zB}:fid==='laguerre'?{a:st.zA}:{}; }
function chargesState(st){
  const f=FAMS[st.zFam], p=zeroPar(st,st.zFam), n=st.zN, key=JSON.stringify([st.zFam,n,p,st.zSeed]);
  const base=memo('charges',key,()=>{ const fd=stField(f,p), G=gaussRule(f,n,p);
    return {f,p,n,fd,G,Estar:stEnergy(G.x,fd),win:famWindow(f,n,p)}; });
  if(SIM.key!==key){ SIM.key=key; SIM.xs=stStart(f,n,p,st.zSeed); SIM.E=[stEnergy(SIM.xs,base.fd)-base.Estar]; SIM.steps=0; SIM.rest=false; }
  return base;
}
function zeroView(st){
  const M={mode:st.zMode};
  if(st.zMode==='charges'){
    const Z=chargesState(st);
    Object.assign(M,Z);
    M.xs=SIM.xs.slice(); M.E=SIM.E; M.steps=SIM.steps; M.rest=SIM.rest;
    let d=0; M.xs.forEach((x,i)=>d=Math.max(d,Math.abs(x-Z.G.x[i]))); M.dist=d;
  } else if(st.zMode==='quad'){
    const Q=QFN.find(q=>q.id===st.qFn);
    Object.assign(M,memo('quad',st.qFn,()=>{
      const ex=Q.exact(), g=[], tr=[], si=[];
      for(let n=1;n<=30;n++){
        const G=gaussRule(FAMS.legendre,n); let s=0; for(let i=0;i<n;i++) s+=G.w[i]*Q.f(G.x[i]); g.push(Math.abs(s-ex));
        if(n>=2){ const h=2/(n-1); let t=0; for(let i=0;i<n;i++) t+=Q.f(-1+i*h)*(i===0||i===n-1?0.5:1); tr.push(Math.abs(h*t-ex)); } else tr.push(NaN);
        if(n>=3&&n%2===1){ const h=2/(n-1); let t=Q.f(-1)+Q.f(1); for(let i=1;i<n-1;i++) t+=Q.f(-1+i*h)*(i%2?4:2); si.push(Math.abs(h/3*t-ex)); } else si.push(NaN);
      }
      return {Q,exact:ex,g,tr,si};
    }));
    const G=gaussRule(FAMS.legendre,st.qN); let s=0; for(let i=0;i<st.qN;i++) s+=G.w[i]*M.Q.f(G.x[i]);
    M.n=st.qN; M.G=G; M.gauss=s;
  } else {
    Object.assign(M,memo('many',JSON.stringify([st.mFam,st.mN]),()=>manyZeros(st.mFam,st.mN)));
  }
  return M;
}
/* the zeros of a large-degree polynomial against their limiting density: Hermite scaled by sqrt(2n) (the semicircle
   (2/pi) sqrt(1 - t^2)), Laguerre (a = 0) by 4n (Marchenko-Pastur (2/pi) sqrt((1-t)/t)), Legendre (the arcsine
   1/(pi sqrt(1 - t^2))); the Kolmogorov distance of the zeros' counting function from the limit's */
const MANY_DENS={
  hermite:{lo:-1,hi:1,scale:n=>Math.sqrt(2*n),rho:t=>2/PI*Math.sqrt(Math.max(0,1-t*t)),cdf:t=>0.5+(t*Math.sqrt(Math.max(0,1-t*t))+Math.asin(clamp(t,-1,1)))/PI},
  laguerre:{lo:0,hi:1,scale:n=>4*n,rho:t=>t>0&&t<1?2/PI*Math.sqrt((1-t)/t):0,cdf:t=>{ t=clamp(t,0,1); return 2/PI*(Math.asin(Math.sqrt(t))+Math.sqrt(t*(1-t))); }},
  legendre:{lo:-1,hi:1,scale:()=>1,rho:t=>Math.abs(t)<1?1/(PI*Math.sqrt(1-t*t)):0,cdf:t=>0.5+Math.asin(clamp(t,-1,1))/PI}};
/* the Kolmogorov distance between the counting function of the sorted points t (a step of 1/n at each) and a CDF:
   at each point both the step's foot i/n and its top (i+1)/n */
function ksDistance(t,cdf){ const n=t.length; let ks=0; t.forEach((v,i)=>{ const c=cdf(v); ks=Math.max(ks,Math.abs(c-i/n),Math.abs(c-(i+1)/n)); }); return ks; }
function manyZeros(fid,n){
  const f=FAMS[fid], p=fid==='laguerre'?{a:0}:{}, G=gaussRule(f,n,p), D=MANY_DENS[fid], s=D.scale(n), t=G.x.map(x=>x/s);
  const ks=ksDistance(t,D.cdf);
  const nb=30, hist=new Array(nb).fill(0); t.forEach(v=>{ const b=clamp(Math.floor((v-D.lo)/(D.hi-D.lo)*nb),0,nb-1); hist[b]++; });
  return {fid,n,t,D,ks,hist:hist.map(c=>c/(n*(D.hi-D.lo)/nb)),nb,edge:G.x[G.x.length-1]};
}

function famView(st){
  const L=LIMITS.find(q=>q.id===st.fLim), a=L.alpha!==undefined?st.fAlpha:0, nn=L.n||0;
  let par=clamp(st.fPar,L.lo,L.hi); if(L.integer) par=Math.round(par);
  const zs=[]; for(let i=0;i<=400;i++) zs.push(L.x0+(L.x1-L.x0)*i/400);
  const cur=zs.map(z=>L.scaled(par,z,a,nn)), lim=zs.map(z=>L.limit(z,a,nn));
  const earlier=[par/4,par/2].map(q=>L.integer?Math.max(L.lo,Math.round(q)):Math.max(L.lo,q)).filter(q=>q<par).map(q=>({par:q,y:zs.map(z=>L.scaled(q,z,a,nn))}));
  const sweep=memo('famsweep',JSON.stringify([L.id,a]),()=>{ const out=[];
    for(let i=0;i<=14;i++){ let q=L.lo*Math.pow(L.hi/L.lo,i/14); if(L.integer) q=Math.round(q); out.push([q,limitSup(L,q,{alpha:a})]); } return out; });
  const k=sweep.length, rate=Math.log(sweep[k-1][1]/sweep[k-3][1])/Math.log(sweep[k-1][0]/sweep[k-3][0]);
  let sup=0; cur.forEach((v,i)=>sup=Math.max(sup,Math.abs(v-lim[i])));
  return {L,a,nn,par,zs,cur,lim,earlier,sweep,rate,sup};
}

function buildModel(){
  const v=ST.view, M={view:v};
  if(v==='rod') M.R=rodView(ST);
  else if(v==='leg') M.G=legView(ST);
  else if(v==='airy') M.A=airyView(ST);
  else if(v==='son') M.S=sonView(ST);
  else if(v==='zeros') M.Z=zeroView(ST);
  else M.F=famView(ST);
  return M;
}

/* ================================================================== *
 *  number formatting, readout / equation bar / tag                    *
 * ================================================================== */
/* a signed number with a proper minus sign and n significant figures (superscript powers of ten) */
function num(x,n){ if(!isFinite(x)) return '—'; const s=sigf(Math.abs(x),n||4); return (x<0&&s!=='0'?'−':'')+s; }
function numF(x,d){ if(!isFinite(x)) return '—'; const s=Math.abs(x).toFixed(d); return (x<0&&Number(s)!==0?'−':'')+s; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
/* the super- and subscript glyphs Unicode has: digits, signs, parentheses and a few letters (there is no
   subscript nu: canvas labels say "degree nu" in words instead) */
const SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','−':'⁻','+':'⁺','(':'⁽',')':'⁾','.':'·',
  'n':'ⁿ','m':'ᵐ','k':'ᵏ','i':'ⁱ','j':'ʲ','x':'ˣ','l':'ˡ'};
const SUBD2={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','-':'₋','−':'₋','(':'₍',')':'₎',
  'k':'ₖ','n':'ₙ','m':'ₘ','i':'ᵢ','j':'ⱼ','x':'ₓ','a':'ₐ','e':'ₑ','o':'ₒ','p':'ₚ','s':'ₛ','t':'ₜ','l':'ₗ','h':'ₕ','r':'ᵣ','u':'ᵤ','v':'ᵥ'};
const sup=s=>String(s).split('').map(c=>SUPD[c]||c).join(''), sub=s=>String(s).split('').map(c=>SUBD2[c]||c).join('');
/* a parameter printed briefly: 0.5, −0.3, 1.25 */
function par(x){ return numF(x,Math.abs(x*100-Math.round(x*100))<1e-9?(Math.abs(x*10-Math.round(x*10))<1e-9?(x===Math.round(x)?0:1):2):3); }
/* the family's w, F and tau written out, parameters in */
function famStrings(f,p){
  const pw=(b,e)=>e===0?'':b+'<sup>'+par(e)+'</sup>';
  switch(f.id){
    case 'legendre': return {w:'1',F:'1 − x²',tau:'−2x',iv:'(−1, 1)'};
    case 'chebT': return {w:'(1 − x²)<sup>−½</sup>',F:'1 − x²',tau:'−x',iv:'(−1, 1)'};
    case 'chebU': return {w:'(1 − x²)<sup>½</sup>',F:'1 − x²',tau:'−3x',iv:'(−1, 1)'};
    case 'gegen': return {w:'(1 − x²)<sup>'+par(p.lam-0.5)+'</sup>',F:'1 − x²',tau:'−'+par(2*p.lam+1)+'x',iv:'(−1, 1)'};
    case 'jacobi': { const w=(pw('(1 − x)',p.a)+pw('(1 + x)',p.b))||'1', c0=p.b-p.a;
      return {w,F:'1 − x²',tau:(c0!==0?par(c0)+' ':'')+(c0!==0?'− ':'−')+par(p.a+p.b+2)+'x',iv:'(−1, 1)'}; }
    case 'laguerre': return {w:(p.a!==0?'x<sup>'+par(p.a)+'</sup> ':'')+'e<sup>−x</sup>',F:'x',tau:par(p.a+1)+' − x',iv:'(0, ∞)'};
    default: return {w:'e<sup>−x²</sup>',F:'1',tau:'−2x',iv:'(−∞, ∞)'};
  }
}
function famPar(f,p){ return f.id==='jacobi'?'α = '+par(p.a)+', β = '+par(p.b):f.id==='gegen'?'λ = '+par(p.lam):f.id==='laguerre'?'α = '+par(p.a):''; }
function zerosStr(zs,d,max){ const m=max||8, s=zs.slice(0,m).map(z=>numF(z,d||4)).join(', '); return zs.length>m?s+', …':s; }
/* a polynomial written from its coefficients (lowest power first): exact fractions where given */
function polyHTML(coefs,exact,v){
  const x=v||'x', terms=[];
  for(let p=0;p<coefs.length;p++){
    let mag, neg;
    if(exact){ const [a,b]=exact[p]; neg=a<0n; const A=neg?-a:a; mag=b===1n?String(A):String(A)+'/'+String(b); if(p>0&&A===1n) mag=b===1n?'':'1/'+String(b); }
    else { neg=coefs[p]<0; mag=sigf(Math.abs(coefs[p]),4); if(p>0&&Math.abs(Math.abs(coefs[p])-1)<1e-15) mag=''; }
    const pw=p===0?'':(p===1?x:x+'<sup>'+p+'</sup>');
    /* 7 x/2 for 7/2 x, and x²/2 (not 1 x²/2) for 1/2 x² */
    const body=mag&&pw?(mag.indexOf('/')>=0&&exact?(mag.slice(0,2)==='1/'?pw+mag.slice(1):mag.replace('/',' '+pw+'/')):mag+pw):(mag||pw);
    terms.push({neg,body});
  }
  return terms.map((t,i)=>(i===0?(t.neg?'−':''):(t.neg?' − ':' + '))+t.body).join('');
}

      s+=rrow('Pekeris &amp; Alterman (1957)',numF(pk.f_lam,6)+' and '+numF(pk.f_eta,6),'good');
      s+=rrow('λ/(η c<sub>v</sub>) at N = '+S.N,numF(2.5*S.lam[S.N-1]/S.eta[S.N-1],4));
      s+=hd('a force ∝ r<sup>−ν</sup>, ν = '+(S.nu>=59.99?'∞':numF(S.nu,1))+', second approximation')
        +rrow('[λ]₂/[λ]₁, [η]₂/[η]₁',numF(S.p2.lam,6)+', '+numF(S.p2.eta,6));
      s+='</table><div class="note">'+noteFor('songas',S)+'</div>';
    } else {
      s+='<div class="rname">the distribution<small>'+(S.kind==='heat'?'a Maxwellian carrying heat along z':'a Maxwellian in a shear flow')+'</small></div><table>';
      s+=hd('f = f₀(1 + ε φ), the φ of '+CE_NMAX+' Sonine terms')+rrow('ε (the strength)',numF(S.eps,2))
        +rrow('φ',S.kind==='heat'?'−A(C) C<sub>z</sub>':'B(C) C<sub>x</sub>C<sub>z</sub>')+rrow('A(0) and B(0)',numF(ceA(CE_NMAX,0),4)+', '+numF(ceB(CE_NMAX,0),4))
        +rrow('1 + εφ first negative',S.neg===null?'nowhere at ε = 0':(S.kind==='heat'?'C<sub>z</sub> = '+num(S.neg,3):'|C| = '+numF(Math.abs(S.neg),3)+' on C<sub>x</sub> = −C<sub>z</sub>')+', where f₀ is '+sigf(Math.exp(-S.neg*S.neg),2)+' of its peak');
      s+='</table><div class="note">'+noteFor('sondist',S)+'</div>';
    }
  } else if(M.view==='zeros'){ const Z=M.Z;
    if(Z.mode==='charges'){ const f=Z.f;
      s+='<div class="rname">the charges<small>'+Z.n+' unit charges in the field of '+f.name.replace(' (Sonine)','')+(famPar(f,Z.p)?', '+famPar(f,Z.p):'')+'</small></div><table>';
      s+=hd('the field')+rrow('V(x)',f.id==='hermite'?'x²/2':f.id==='laguerre'?'x/2 − '+par((Z.p.a+1)/2)+' ln x':'−'+par(Z.fd.qa)+' ln(1−x) − '+par(Z.fd.qb)+' ln(1+x)');
      if(f.id==='laguerre') s+=rrow('fixed charge at 0',par(Z.fd.q)); else if(f.id!=='hermite') s+=rrow('fixed charges at +1, −1',par(Z.fd.qa)+', '+par(Z.fd.qb));
      s+=hd('the flow')+rrow('steps taken',String(Z.steps))+rrow('E − E<sub>*</sub>',sigf(Math.max(Z.E[Z.E.length-1],0),2))
        +rrow('farthest from a zero',sigf(Z.dist,2),Z.dist<1e-6?'good':'')+rrow(Z.rest?'at rest':'moving',Z.rest?'yes':'no');
      s+=hd('the zeros (Golub–Welsch)')+rrow('x<sub>k</sub>',zerosStr(Z.G.x,4,6));
      s+='</table><div class="note">'+noteFor('charges',Z)+'</div>';
    } else if(Z.mode==='quad'){ const tr=Z.tr[Z.n-1], si=Z.si[Z.n-1];
      s+='<div class="rname">the quadrature<small>∫ '+Z.Q.name+' dx over (−1, 1), '+Z.n+' points</small></div><table>';
      s+=hd('the value')+rrow('exact',numF(Z.exact,12))+rrow('Gauss–Legendre',numF(Z.gauss,12));
      s+=hd('the error with '+Z.n+' points')+rrow('Gauss',sigf(Math.max(Z.g[Z.n-1],1e-17),2),'good')+rrow('trapezoid',isFinite(tr)?sigf(tr,2):'needs 2 points')+rrow('Simpson',isFinite(si)?sigf(si,2):(Z.n<3?'needs 3 points':'odd n only'));
      s+=hd('the rule')+rrow('nodes',zerosStr(Z.G.x,4,5))+rrow('weights',zerosStr(Z.G.w,4,5));
      s+='</table><div class="note">'+noteFor('quad',Z)+'</div>';
    } else {
      s+='<div class="rname">many zeros<small>'+Z.n+' zeros of the '+MFAM_LIST.find(q=>q.id===Z.fid).name+' polynomial</small></div><table>';
      s+=hd('against the limiting density')+rrow('Kolmogorov distance',sigf(Z.ks,2))+rrow('n × distance',numF(Z.ks*Z.n,3));
      if(Z.fid==='hermite') s+=rrow('the largest zero',numF(Z.edge,4)+' (√(2n) = '+numF(Math.sqrt(2*Z.n),4)+')');
      s+='</table><div class="note">'+noteFor('many',Z)+'</div>';
    }
  } else { const F=M.F, L=F.L;
    s+='<div class="rname">the family<small>'+L.name+'</small></div><table>';
    s+=hd('the limit (DLMF '+L.dlmf+')')+'<tr><td class="v" colspan="2" style="text-align:left">'+L.formula+'</td></tr>';
    s+=rrow(L.par+' now',L.integer?String(F.par):sigf(F.par,3));
    if(L.alpha!==undefined) s+=rrow('α',par(F.a));
    s+=rrow('the largest gap on the window',sigf(F.sup,3));
    s+=rrow('the gap falls like '+L.par+'<sup>p</sup>, p measured',numF(F.rate,2)+' (expected '+numF(L.rate,2)+')',Math.abs(F.rate-L.rate)<0.1?'good':'bad');
    s+='</table><div class="note">'+noteFor('fam',F)+'</div>';
  }
  return s;
}

/* the notes: short, computed from the model, never a hard-coded number */
function noteFor(k,M){
  switch(k){
    case 'rod': return '<b>Rolle&rsquo;s theorem</b> does the work: w F<sup>n</sup> vanishes at both ends of the interval, so its derivative vanishes at least once between; each derivative that still vanishes at the ends gains one more zero, and after n steps the n zeros of the polynomial are all inside.';
    case 'legpq': return M.integer?'At an integer degree the logarithm is gone and P is regular at both poles: the only degrees a whole sphere allows.':'The coefficient of the logarithm, sin(νπ)/π, vanishes only at integer ν: a function regular at both poles of a sphere needs an integer degree.';
    case 'cone': return M.nu<1?'Outside a sharp point (β &gt; 90°) ν &lt; 1 and the field grows without bound towards the tip, like r<sup>ν−1</sup>: why a lightning rod is pointed.':'Inside a conical hole (β &lt; 90°) ν &gt; 1 and the field dies away towards the apex.';
    case 'multi': return 'The series converges inside the sphere through the charge and outside it, geometrically in r/d or d/r, and nowhere on it.';
    case 'harm': return M.show==='sum'?'Unsöld&rsquo;s theorem: summed over m the harmonics of one ℓ fill the sphere evenly, whatever the axis.':'P<sub>ℓ</sub><sup>|m|</sup>(cos θ) has ℓ − |m| zeros in latitude and cos mφ has 2|m| in longitude: ℓ nodal circles in all.';
    case 'airyreal': return 'Left of the turning point the kinetic energy is positive and Ai oscillates with the WKB amplitude π<sup>−½</sup>|x|<sup>−¼</sup>; right of it Ai decays like e<sup>−ζ</sup> and Bi grows like e<sup>ζ</sup>.';
    case 'airycx': return M.fn==='ai'?'Ai vanishes only on the negative real axis, where the growing and decaying exponentials match in size.':'Bi also vanishes off the axis, near arg z = ±60°, where its two exponentials match.';
    case 'bouncer': return 'The mirror is the wall and gravity the ramp, so each state is a piece of Ai shifted until its zero lands on the mirror.';
    case 'sonpoly': return 'Chapman &amp; Cowling&rsquo;s S<sub>m</sub><sup>(n)</sup> is the generalised Laguerre polynomial exactly, with no extra sign or factor.';
    case 'songas': return 'Maxwell molecules (ν = 5) are the exception: there the first Sonine term is exact.';
    case 'sondist': return 'The distortion is drawn at strength ε, far beyond any real gradient, so that it can be seen.';
    case 'charges': return 'Each charge feels the others through −ln|x − y| and the weight through V; where the forces balance, it sits on a zero.';
    case 'quad': return 'Gauss&rsquo;s n nodes integrate every polynomial of degree 2n − 1 exactly, so for a smooth integrand the error falls faster than any power of n.';
    case 'many': return 'The zeros of a large-degree polynomial fill their interval with a fixed density: the semicircle, the Marchenko–Pastur and the arcsine laws.';
    default: return 'The scaled polynomial or Bessel function is drawn beside its limit; the gap falls as a power of the parameter, measured here.';
  }
}

function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='rod') return E('<span class="hl">p<sub>n</sub>(x) = '+'(κ<sub>n</sub> w(x))<sup>−1</sup> dⁿ/dxⁿ [w(x) F(x)<sup>n</sup>]</span> &nbsp;·&nbsp; <span class="hl2">(F w)′ = τ w</span>',
    'Rodrigues&rsquo; formula (DLMF 18.5.5): n derivatives of the weight times Fⁿ, divided by the weight, leave a polynomial of degree n');
  if(M.view==='leg'){ const G=M.G;
    if(G.mode==='pq') return E('<span class="hl">(1 − x²) y″ − 2x y′ + [ν(ν+1) − m²/(1 − x²)] y = 0</span>','Legendre&rsquo;s equation: P<sub>ν</sub><sup>m</sup> is finite at x = 1, and at x = −1 only when ν is a whole number');
    if(G.mode==='cone') return E('<span class="hl">Φ = r<sup>ν</sup> P<sub>ν</sub>(cos θ)</span>, &nbsp; <span class="hl2">P<sub>ν</sub>(cos β) = 0</span>','the potential near the apex of a conducting cone: the boundary picks the degree, and the degree sets how the field behaves at the tip');
    if(G.mode==='multi') return E('<span class="hl">1/|r − r′| = Σ<sub>ℓ</sub> r<sub>&lt;</sub><sup>ℓ</sup>/r<sub>&gt;</sub><sup>ℓ+1</sup> P<sub>ℓ</sub>(cos γ)</span>','the generating function of the Legendre polynomials, (1 − 2xt + t²)<sup>−½</sup> = Σ P<sub>ℓ</sub>(x) t<sup>ℓ</sup> (DLMF 14.7.19), is the potential of a point charge');
    return E('<span class="hl">Y<sub>ℓ</sub><sup>m</sup>(θ, φ) = √((2ℓ+1)(ℓ−m)!/(4π(ℓ+m)!)) P<sub>ℓ</sub><sup>m</sup>(cos θ) e<sup>imφ</sup></span>','DLMF 14.30.1, with the Condon–Shortley (−1)<sup>m</sup> inside P<sub>ℓ</sub><sup>m</sup>');
  }
  if(M.view==='airy'){ const A=M.A;
    if(A.mode==='bouncer') return E('<span class="hl">−(ℏ²/2m) ψ″ + m g z ψ = E ψ</span>, &nbsp; <span class="hl2">ψ(0) = 0 ⇒ E<sub>n</sub> = −a<sub>n</sub> (ℏ² m g²/2)<sup>1/3</sup></span>','in units of z₀ the Schrödinger equation is Airy&rsquo;s, and the mirror asks for a zero of Ai');
    if(A.mode==='complex') return E('<span class="hl">Ai(z) ~ e<sup>−ζ</sup>/(2√π z<sup>1/4</sup>) Σ (−1)<sup>k</sup> u<sub>k</sub> ζ<sup>−k</sup></span>, &nbsp; ζ = ⅔ z<sup>3/2</sup>','DLMF 9.7.5: one exponential in |arg z| &lt; π; the colour is the phase, the brightness the size');
    return E('<span class="hl">w″ = x w</span> &nbsp;·&nbsp; <span class="hl2">Ai(x) = π<sup>−1</sup>∫<sub>0</sub><sup>∞</sup> cos(t³/3 + x t) dt</span>','Airy&rsquo;s equation (DLMF 9.2.1): the Schrödinger equation of a particle meeting a linear potential, and Airy&rsquo;s 1838 integral for the light near a caustic');
  }
  if(M.view==='son'){ const S=M.S;
    if(S.mode==='gas') return E('<span class="hl">[λ]<sub>N</sub>/[λ]₁ = a₁₁ (A<sub>N</sub><sup>−1</sup>)₁₁</span>, &nbsp; <span class="hl2">a<sub>pq</sub> = [S<sub>3/2</sub><sup>(p)</sup>(C²)C, S<sub>3/2</sub><sup>(q)</sup>(C²)C]</span>','the heat flow solved in N Sonine terms (the shear the same way with S<sub>5/2</sub>): each bracket is a collision integral, and A<sub>N</sub> is their N × N table');
    if(S.mode==='dist') return E('<span class="hl">f = f₀ [1 − ε A(C) C·∇ln T]</span> &nbsp;or&nbsp; <span class="hl2">f₀ [1 + ε B(C) C<sub>x</sub>C<sub>z</sub>]</span>','the Chapman–Enskog distribution: a Maxwellian tilted towards the hot side, or sheared');
    return E('<span class="hl">S<sub>m</sub><sup>(n)</sup>(x) = Σ<sub>p</sub> (m+p+1)<sub>n−p</sub> (−x)<sup>p</sup>/((n−p)! p!)</span>','the coefficient of sⁿ in (1 − s)<sup>−m−1</sup> e<sup>−xs/(1−s)</sup>: orthogonal with the weight x<sup>m</sup>e<sup>−x</sup>');
  }
  if(M.view==='zeros'){ const Z=M.Z;
    if(Z.mode==='quad') return E('<span class="hl">∫ f w dx ≈ Σ<sub>i</sub> w<sub>i</sub> f(x<sub>i</sub>)</span>, &nbsp; p<sub>n</sub>(x<sub>i</sub>) = 0','Gauss: the nodes are the zeros, the weights the Christoffel numbers, and the rule is exact to degree 2n − 1');
    if(Z.mode==='many') return E('<span class="hl">ρ(t) = (2/π)√(1 − t²)</span>','the semicircle: Wigner&rsquo;s law for random matrices is the Hermite zeros&rsquo; density');
    return E('<span class="hl">E = −Σ<sub>i&lt;j</sub> ln|x<sub>i</sub> − x<sub>j</sub>| + Σ<sub>i</sub> V(x<sub>i</sub>)</span>','Stieltjes (1885): the minimum is at the zeros of the family&rsquo;s polynomial');
  }
  return E('<span class="hl">'+M.F.L.formula+'</span>','the limit transitions knit the families together; DLMF '+M.F.L.dlmf);
}

function tagHTML(M){
  if(M.view==='rod') return '<b>the Rodrigues ladder</b> — '+M.R.f.name+' '+M.R.f.sym+'<sub>'+M.R.n+'</sub>, step '+M.R.k+' of '+M.R.n;
  if(M.view==='leg'){ const G=M.G; return '<b>Legendre functions</b> — '+(G.mode==='pq'?'ν = '+numF(G.nu,2)+', m = '+G.m:G.mode==='cone'?'β = '+numF(G.beta*180/PI,1)+'°, ν = '+numF(G.nu,4):G.mode==='multi'?(G.L+1)+' terms':'ℓ = '+G.l+', m = '+G.m); }
  if(M.view==='airy'){ const A=M.A; return '<b>the turning point</b> — '+(A.mode==='real'?'x = '+numF(A.probe.x,2):A.mode==='complex'?(A.fn==='ai'?'Ai':'Bi')+' in the complex plane':'level '+ST.aLev+' of the neutron'); }
  if(M.view==='son'){ const S=M.S; return '<b>Sonine and the gas</b> — '+(S.mode==='poly'?'m = '+par(S.m)+', n = '+S.n:S.mode==='gas'?'N = '+S.N+' Sonine terms':(S.kind==='heat'?'heat flow':'shear')); }
  if(M.view==='zeros'){ const Z=M.Z; return '<b>the zeros</b> — '+(Z.mode==='charges'?Z.n+' charges, '+(Z.rest?'at rest':'step '+Z.steps):Z.mode==='quad'?Z.n+' Gauss points':'n = '+Z.n); }
  return '<b>the family</b> — '+M.F.L.name+', '+M.F.L.par+' = '+(M.F.L.integer?M.F.par:sigf(M.F.par,3));
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_lagr/p4_views.js (lineage build_buoy); the camera block from     *
 *  pulsar.html (v3, makeCamera, camBasis, project)                    *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y1);
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* does the segment a-c, or the polyline p (a list of [x, y]), pass through the box bb = [x0, y0, x1, y1]? (Liang-Barsky) */
function segHitsBox(a,c,bb){ const dx=c[0]-a[0], dy=c[1]-a[1]; let t0=0, t1=1;
  for(const [p,q] of [[-dx,a[0]-bb[0]],[dx,bb[2]-a[0]],[-dy,a[1]-bb[1]],[dy,bb[3]-a[1]]]){
    if(p===0){ if(q<0) return false; } else { const r=q/p; if(p<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } } }
  return true; }
function polyHitsBox(p,bb){ for(let i=1;i<p.length;i++) if(segHitsBox(p[i-1],p[i],bb)) return true; return false; }
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
/* tick labels with as many decimals as the spacing needs, and a proper minus: 5 not 5.00, 0.25 not 0.3 */
function autoFmt(ts){ let step=Infinity; for(let i=1;i<ts.length;i++) step=Math.min(step,Math.abs(ts[i]-ts[i-1]));
  /* the fewest decimals that print every tick exactly: a step of 0.25 needs two and 2.5 needs one (the ceiling of
     -log10(step) gave one and none, and printed -0.25 as -0.3 and 2.5 as 3) */
  let d=0; if(isFinite(step)) while(d<6&&ts.some(t=>Math.abs(Math.round(t*Math.pow(10,d))/Math.pow(10,d)-t)>1e-9*step)) d++;
  return t=>{ const s=Math.abs(t).toFixed(d); return (t<0&&Number(s)!==0?'−':'')+s; }; }
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  if(!o.xfmt) o.xfmt=autoFmt(xt);
  if(!o.yfmt) o.yfmt=autoFmt(yt);
  /* the corner: an x tick at the left edge and a y tick at the bottom edge put their labels on each other
     (loop_quantum_gravity's Known-bad); the y tick gives way */
  const Xof=t=>b.x+b.w*(t-xlo)/(xhi-xlo||1), Yof=t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1);
  if(xt.some(t=>Math.abs(Xof(t)-b.x)<16)) yt=yt.filter(t=>Math.abs(Yof(t)-b.y1)>=7);
  o.xticks=xt; o.yticks=yt;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  the drawing: shared state, colour fields, the ladder, Legendre     *

let HIT=[], W_STAGE=1100, H_STAGE=712, MARKS=[], KEY_DROPS=0;
const nbNarrow=H=>H<520?0:1;
function sLine(ctx,pts,col,lw,dash){
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
}
/* a vertical marker line, registered so that the tests can check it never crosses a label drawn after it */
function vMark(ctx,b,X,col,y0,y1){ const a=y0===undefined?b.y:y0, c=y1===undefined?b.y1:y1;
  sLine(ctx,[[X,a],[X,c]],col||COL.live,1,[3,3]); MARKS.push({X,y0:a,y1:c,seq:++DRAW_SEQ}); }
const xOf=(b,v,lo,hi)=>b.x+b.w*(v-lo)/(hi-lo), yOf=(b,v,lo,hi)=>b.y1-b.h*(v-lo)/(hi-lo);

/* ---- colour fields.  In a browser: one image, putImageData on an offscreen canvas drawn scaled into the box.
   Under the display-list recorder and the DOM stub (no image data): a grid of at most 48 x 48 fillRects of the
   same colours, so the capture and the tests see the picture the browser shows ---- */
const HEAT_CACHE={};
function heatField(ctx,b,nx,ny,colorAt,key){
  let off=null;
  if(typeof document!=='undefined'&&ctx.drawImage){
    try{
      if(key&&HEAT_CACHE[key]) off=HEAT_CACHE[key];
      else { const c=document.createElement('canvas'); c.width=nx; c.height=ny; const oc=c.getContext('2d');
        if(oc&&oc.createImageData&&oc.putImageData){ const img=oc.createImageData(nx,ny);
          for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const col=colorAt(i,j), k=4*(j*nx+i); img.data[k]=col[0]; img.data[k+1]=col[1]; img.data[k+2]=col[2]; img.data[k+3]=255; }
          oc.putImageData(img,0,0); off=c; if(key){ for(const k in HEAT_CACHE) delete HEAT_CACHE[k]; HEAT_CACHE[key]=c; } } }
    }catch(e){ off=null; }
  }
  if(off){ ctx.save(); ctx.imageSmoothingEnabled=nx<b.w; ctx.drawImage(off,b.x,b.y,b.w,b.h); ctx.restore(); return 'image'; }
  const cx=Math.min(nx,48), cy=Math.min(ny,48), sx=nx/cx, sy=ny/cy;
  for(let j=0;j<cy;j++) for(let i=0;i<cx;i++){
    const col=colorAt(Math.min(nx-1,Math.floor((i+0.5)*sx)),Math.min(ny-1,Math.floor((j+0.5)*sy)));
    ctx.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')';
    ctx.fillRect(b.x+b.w*i/cx,b.y+b.h*j/cy,b.w/cx+0.6,b.h/cy+0.6);
  }
  return 'cells';
}
/* a signed value in [-1, 1]: green above, magenta below, faded towards the page by its own size (waveguides' rule:
   neon(0) is a bright colour, not the background) */
const BG=[7,11,24];
function divCol(t){ t=clamp(isFinite(t)?t:0,-1,1); const a=toRgb(t>=0?COL.pos:COL.live), s=Math.pow(Math.abs(t),0.7);
  return [0,1,2].map(i=>Math.round(BG[i]+(a[i]-BG[i])*s)); }
/* a magnitude in [0, 1] on a ramp whose lightness rises all the way (navy, blue, cyan, lime, orange) */
const SEQ_STOPS=[[0,'#0d1a33'],[0.3,'#2f6fa0'],[0.55,'#5ac8e0'],[0.8,'#c8ee6a'],[1,'#f0a060']];
function seqCol(t){ t=clamp(isFinite(t)?t:0,0,1); let i=0; while(i<SEQ_STOPS.length-2&&t>SEQ_STOPS[i+1][0]) i++;
  const a=toRgb(SEQ_STOPS[i][1]), c=toRgb(SEQ_STOPS[i+1][1]), u=(t-SEQ_STOPS[i][0])/(SEQ_STOPS[i+1][0]-SEQ_STOPS[i][0]);
  return [0,1,2].map(k=>Math.round(a[k]+(c[k]-a[k])*u)); }
/* domain colouring: the hue is the phase, the lightness the size on a logarithmic scale, 0.5 at |f| = 1, with faint
   bands at every factor of 10 in |f| */
function hslRgb(h,s,l){ const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return [Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))]; }
function domainCol(re,im){
  const r=Math.hypot(re,im), ph=Math.atan2(im,re);
  if(!(r>0)) return [0,0,0];
  const lg=Math.log10(r), band=0.9+0.1*(lg-Math.floor(lg));
  const l=clamp(0.5+Math.atan(lg/2)/PI*0.8,0.08,0.92)*band;
  return hslRgb(((ph*180/PI)+360)%360,0.75,l);

/* ================================================================== *
 *  view 1: the Rodrigues ladder                                       *
 * ================================================================== */
const PRIME=['','′','″','‴'];
function rungName(n,k){ const top='w F'+sup(n);
  if(k===0) return top;
  return '('+top+')'+(k<4?PRIME[k]:sup('('+k+')')); }
function rodCaption(R){
  const f=R.f, n=R.n, fin=isFinite(f.lo)&&isFinite(f.hi);
  const ends=fin?'vanishes at both ends of the interval to order '+n+(f.id==='jacobi'||f.id==='gegen'||f.id==='chebT'||f.id==='chebU'?' (times the weight)':''):
    f.id==='laguerre'?'vanishes at x = 0 to order n + α and decays at infinity':'decays at both infinities';
  return {full:'Rodrigues’ formula as a ladder, top to bottom. The top rung is w F'+sup(n)+', which '+ends+'. Each rung is the derivative of the one above, and each gains one zero inside the interval, between two neighbouring zeros of the rung above or between the outermost zero and the end (Rolle’s theorem): the brackets on each rung show where the next rung’s zeros must fall. After '+n+' steps, dividing by κ'+sub(n)+' w leaves the polynomial '+f.sym+sub(n)+' (green'+(R.inf&&!R.trueScale?', drawn times √w so that its oscillations show':'')+'), and the three-term recurrence gives the same polynomial (orange dashes). '+(R.trueScale?'Each rung is the derivative itself, drawn to its own height.':'Each rung is drawn as √(w F'+sup('n−k')+') Q'+sub('k')+', which has the derivative’s zeros and stays on the page, and to its own height.'),
          short:'Rodrigues’ formula: each derivative gains one zero inside the interval (Rolle), and after n steps the polynomial '+f.sym+sub(n)+' appears (green; the recurrence, orange dashes).'};
}
function drawRod(ctx,W,H,M){
  const R=M.R, n=R.n, cap=rodCaption(R);
  const L=stageLayout(ctx,W,H,cap.full,cap.short,0,0,0);
  const lw=L.narrow?78:112, bx=L.main.x+lw, bw=L.main.x1-bx-4, gap=8;
  const top=L.main.y+22, hh=(L.main.y1-24-top-gap*n)/(n+1);
  lab(ctx,W,H,L.main.x,L.main.y+2,titleFor(box(L.main.x,0,L.main.w,1),n+(n===1?' derivative':' derivatives')+' of w F'+sup(n)+', one rung each','the ladder'),'#aeb6c6','italic 13px Georgia, serif','left','top');
  const x0=R.xs[0], x1=R.xs[R.xs.length-1], lo=isFinite(R.f.lo)?-1:R.win[0], hi=isFinite(R.f.hi)?1:R.win[1];
  const X=x=>bx+bw*(x-lo)/(hi-lo);
  const rows=[];
  for(let k=0;k<=n;k++){
    const b=box(bx,top+k*(hh+gap),bw,hh), shown=k<=R.k, yc=b.y+b.h/2;
    rows.push({b,yc});
    frame(ctx,b,'#1b2030');
    sLine(ctx,[[b.x,yc],[b.x1,yc]],'#262c3c',1);
    const ys=(R.trueScale?R.rungs[k].tru:R.rungs[k].bal);
    let s=0; ys.forEach(v=>{ if(isFinite(v)) s=Math.max(s,Math.abs(v)); }); s=s||1;
    const col=k===n?COL.pos:(k===R.k?COL.live:COL.struct);
    const name=k===n?R.f.sym+sub(n):rungName(n,k);
    lab(ctx,W,H,L.main.x,yc,name,shown?(k===n?COL.pos:'#aeb6c6'):'#4a5266',L.narrow?'10px -apple-system, sans-serif':'11px -apple-system, sans-serif','left','middle',{fixed:true});
    if(!shown) continue;
    polyline(ctx,b,R.xs,ys.map(v=>v/s),lo,hi,-1.08,1.08,col,k===n?2:1.4);
    if(k===n){ polyline(ctx,b,R.xs,(R.trueScale?R.rec:R.recShow).map(v=>v/s),lo,hi,-1.08,1.08,COL.ref,1.4,[5,4]); }
    /* Rolle's brackets: the gaps between this rung's zeros (and the ends), each of which holds one zero of the next */
    if(k<R.k&&k<n){ const zs=[x0].concat(R.rungs[k].zeros,[x1]);
      for(let i=0;i+1<zs.length;i++){ const a=X(Math.max(zs[i],lo)), c=X(Math.min(zs[i+1],hi)), yb=b.y1-3;
        sLine(ctx,[[a+2,yb-3],[a+2,yb],[c-2,yb],[c-2,yb-3]],i%2?'#6f7789':'#8b93a6',1); } }
    for(const z of R.rungs[k].zeros) if(z>=lo&&z<=hi) dot(ctx,X(z),yc,3,COL.zero);
  }
  /* the axis under the last rung */
  const bl=rows[n].b;
  ctx.fillStyle='#6f7789'; ctx.font=SM_FONT; ctx.textAlign='center'; ctx.textBaseline='top';
  for(const t of ticksFor(lo,hi,L.narrow?4:6)){ const Xt=X(t); if(Xt<bl.x-0.5||Xt>bl.x1+0.5) continue; sLine(ctx,[[Xt,bl.y1],[Xt,bl.y1+3]],'#39405a',1);
    ctx.fillText(fmt(t,Math.abs(t)<10&&t!==Math.round(t)?1:0),Xt,bl.y1+5); LABELS.push([Xt-10,bl.y1+5,Xt+10,bl.y1+17]); }
  HIT.push({kind:'rung',b:box(bx,top,bw,rows[n].b.y1-top),top,hh,gap,n});
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  view 2: Legendre functions                                         *
 * ================================================================== */
function legCaption(G){
  if(G.mode==='pq') return {full:'The Ferrers functions P (green) and Q (blue) of degree ν and order m on −1 < x < 1, for any real ν. P is finite at x = 1; at x = −1 it is finite only when ν is a whole number, and otherwise grows like the logarithm (orange dashes'+(G.m===0&&!G.integer?', the leading two terms':'')+'). Q is singular at both ends for every ν. Below, the coefficient of the logarithm, sin(νπ)/π, which vanishes only at the integers. Press the upper plot to move the probe, the lower one to set ν.',
    short:'P (green) is finite at x = −1 only for whole ν; Q (blue) is singular at both ends. Below: sin(νπ)/π.'};

function drawLegCone(ctx,W,H,L,G){

/* the sphere: a quad mesh sorted far to near, the far half culled by the outward radius, the nodal circles on top */

function drawBouncer(ctx,W,H,L,A){
  const b=box(L.main.x,L.main.y+22,L.main.w-44,L.main.h-58), peV=A.eV*1e-12, um=1e-6, z1=62, E1=7.2;

  sLine(ctx,[[xOf(b,0,0,z1),b.y],[xOf(b,0,0,z1),b.y1]],'#c9ced9',3);
  const zs=[], vs=[]; for(let i=0;i<=100;i++){ const z=z1*i/100; zs.push(z); vs.push(A.m*A.g*z*um/peV); }
  polyline(ctx,b,zs,vs,0,z1,0,E1,'#8b93a6',1.4);
  const amp=0.55;
  for(let k=0;k<A.lev.length;k++){ const lv=A.lev[k], En=lv.E/peV; if(En>E1*0.97) break;
    const sel=lv.n===ST.aLev, col=sel?COL.pos:'#4e5a74';
    sLine(ctx,[[xOf(b,0,0,z1),yOf(b,En,0,E1)],[xOf(b,Math.min(lv.z/um,z1),0,z1),yOf(b,En,0,E1)]],sel?'#9aa3b8':'#39405a',1);
    const zz=[], yy=[]; for(let i=0;i<=260;i++){ const z=Math.min(z1,1.35*lv.z/um+12)*i/260; zz.push(z); const ps=airy(z*um/A.z0+lv.a).ai*lv.norm;
      yy.push(En+amp*ps*ps*A.z0/0.6); }
    polyline(ctx,b,zz,yy,0,z1,0,E1,col,sel?1.8:1.1);
    lab(ctx,W,H,b.x1+6,yOf(b,En,0,E1),'n = '+lv.n,sel?COL.pos:'#8b93a6',SM_FONT,'left','middle',{fixed:true});
  }
  /* the measurements: Nesvizhevsky's critical heights (the systematic bar) and qBounce's two transitions */
  const gr=SRC.granit;
  [[gr.z1exp,0],[gr.z2exp,1]].forEach(([m,k])=>{ const Y=yOf(b,A.lev[k].E/peV,0,E1)-7;

  const q=SRC.qbounce, xa=xOf(b,z1*0.84,0,z1), xb=xOf(b,z1*0.92,0,z1);
  arrowPx(ctx,xa,yOf(b,A.lev[0].E/peV,0,E1),xa,yOf(b,A.lev[2].E/peV,0,E1),COL.ref,1.4);
  arrowPx(ctx,xb,yOf(b,A.lev[0].E/peV,0,E1),xb,yOf(b,A.lev[3].E/peV,0,E1),COL.ref,1.4);
  lab(ctx,W,H,xa-4,yOf(b,(A.lev[0].E+A.lev[2].E)/2/peV,0,E1),numF(q.nu13[0],1)+' Hz',COL.ref,SM_FONT,'right','middle');
  lab(ctx,W,H,xb+4,yOf(b,(A.lev[2].E+A.lev[3].E)/2/peV,0,E1),numF(q.nu14[0],1)+' Hz',COL.ref,SM_FONT,'left','middle');
  HIT.push({kind:'level',b,z1,E1,peV});
  const bb=L.bottom[0];
  if(bb){ const lv=A.lev[ST.aLev-1], zn=lv.z/um, zmax=1.5*zn, zz=[], ps=[], cl=[];
    for(let i=0;i<=400;i++){ const z=zmax*i/400; zz.push(z/zn); const p=airy(z*um/A.z0+lv.a).ai*lv.norm; ps.push(p*p*lv.z); cl.push(z<zn?lv.z/(2*Math.sqrt(lv.z*(lv.z-z*um))):NaN); }
    let Y=0; ps.forEach(v=>Y=Math.max(Y,v)); Y*=1.25;
    axesT(ctx,bb,0,1.5,0,Y,{title:titleFor(bb,'level '+lv.n+': |ψ|² against the classical 1/(2√(z'+sub('n')+'(z'+sub('n')+' − z)))','quantum and classical'),xlab:'z/z'+sub('n'),ny:2,yfmt:t=>fmt(t,1)});
    polyline(ctx,bb,zz,cl,0,1.5,0,Y,COL.ref,1.2,[5,4]);
