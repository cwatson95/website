<title>Solar Winds &mdash; a loop pinches off, a cloud crosses to the Earth, the sky lights up</title>
<!--
  ===================================================================
  solar_winds.html — one coronal mass ejection from start to finish:
  a closed arcade of loops on the Sun pinches off round a flux rope
  that erupts, crosses to the Earth on the solar wind behind its own
  shock, opens the Earth's field and comes down as the aurora
  ===================================================================

  Four views on one clock (the journey plays them in turn).  THE
  PINCH-OFF: an arcade (a line dipole under a flattened surface) and a
  flux rope (a line current with its image) in the plane of the
  Sun-Earth line and solar north; the rope's flux is raised until its
  equilibrium curve has no more room (the nose), then it erupts, and
  the contours of the flux function show the X-point where the loops
  pinch off.  THE CROSSING: the rope as a magnetic cloud seen end on,
  growing as it goes, dragged toward the wind's speed beyond 20 R,
  with its shock and sheath; what a spacecraft at the Earth measures.
  THE MAGNETOSPHERE: Shue et al.'s magnetopause, the dipole's lines
  closed and open, the Dungey cycle's reconnection opening flux by
  Milan et al.'s rate and closing it again; Dst by O'Brien and
  McPherron.  THE AURORA: the oval round the open flux from above the
  magnetic pole, with night and the cities turning under it; the
  curtain as a chosen city sees it; the three lines by height.

  WHAT IS TAKEN FROM THE LITERATURE
  -----------------------------------------------------------------------
  Shue et al. (1998) for the magnetopause; O'Brien & McPherron (2000)
  for Dst; Milan et al. (2012) for the dayside reconnection voltage;
  Vrsnak et al. (2013) for the drag-based model's form and range of
  gamma; Lundquist (1950) for the cloud's field; Kliem & Torok (2006)
  for keeping the rope's flux; Rees (1964) for the electrons' range;
  JPL's kinetics evaluation for the quenching of O(1D) and O(1S); the
  US Standard Atmosphere 1976, approximately, for the thermosphere;
  the 2025 dipole (IGRF-14 / WMM2025) for magnetic coordinates.

  WHAT IS COMPUTED HERE (checked by selfTest, run headless under jsc)
  -----------------------------------------------------------------------
  The equilibrium curve and its nose; the eruption by RK4 from the
  nose with gravity and drag (energy kept to 2e-4 out to 20 R); the
  shock's compression by Rankine-Hugoniot; the cloud's field and the
  time series at the Earth; the polar cap's flux and Dst integrated
  exactly step by step; the column mass, the energy deposited and the
  three lines' emission with quenching; geomagnetic latitude and local
  time; the elevation of the curtain from a city.

  WHAT IS ASSUMED OR NOT MODELLED (and said so on the page)
  -----------------------------------------------------------------------
  The arcade's depth (0.05 R), the rope's radius and length, three
  hours of build-up; the eruption in a plane over a flat surface; no
  current sheet (the X-point stands in for it); the cloud's radius 0.1
  r, the sheath 0.6 cloud radii thick, its draped field with no
  north-south part; a 60 km/s fast-mode speed; the quiet wind of 6
  cm^-3 and 5 nT; the polar cap's quiet flux (0.4 GWb) and the night
  side's one-hour relaxation; the oval's width (6 deg) and shift (3
  deg); the lines' relative yields; an
  equinox; a centred dipole; no continents on the dial.
  The precipitating electrons are a Maxwellian; the colours are shown on a
  square-root scale.
-->

   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input

  const s=''+c;

  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];

  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');

  lab(ctx,W,H,bx0+sbp+6,by0,(sb>=R_SUN?'1 R☉':fmt(sb/R_SUN,2)+' R☉')+' = '+thou(sb/1e3)+' km','#aeb6c6',SM_FONT,'left','middle',PLATE);
  legendBox(ctx,b.x+8,b.y1-4-15*4-14,[[COL.arcade,'closed, tied at both ends'],[COL.live,'pinched off round the rope'],[COL.flare,'reconnected below'],[COL.struct,'the separatrix']]);

/* the equilibrium curve: the flux the rope holds against its height; the nose is the most it can */
function plotNose(ctx,W,H,b,M){ const R=M.rope, P=R.P, x0=Math.log10(0.1), x1=Math.log10(40);

/* the rope's speed against its distance from the Sun, out past the Earth */
function plotSpeed(ctx,W,H,b,M){ const T=trajectory(ST), x0=0, x1=Math.log10(250);

/* ================================================================== *
 *  the crossing                                                       *
 * ================================================================== */
function crossCaption(M){ const ev=M.ev;
  return {full:'The Sun (left) and the Earth at 1 AU, north up, in the plane of the eruption. The wind blows out at '+fmt(ST.w,0)+' km/s (the grey parcels). '+
    'The cloud (magenta) is the rope seen end on, its axis east–west, growing as it goes; '+(ev.shock?'ahead of it a shock (orange) and the compressed sheath. ':'it is too slow to drive a shock. ')+
    'Below: what a spacecraft at the Earth measures — the field, its north–south part (B<sub>z</sub>), and the speed — as the shock and then the cloud go by.',
    short:'The cloud and its shock cross to the Earth. Below: the field and the speed at the Earth.'}; }
function drawCross(ctx,W,H,M){
  const R=M.rope, ev=M.ev, q=M.q, cap=crossCaption(M), nb=isNarrow(W)?nbNarrow(H):2, L=stageLayout(ctx,W,H,cap.full,cap.short,nb,0.36,nbNarrow(H)), b=L.main;
  lab(ctx,W,H,b.x,b.y-8,'from the Sun to the Earth','#aeb6c6','italic 13px Georgia, serif','left','bottom');
  const xmin=-0.06, xmax=1.14, s=Math.min(b.w/(xmax-xmin),b.h/0.5), ox=b.x+(b.w-s*(xmax-xmin))/2-xmin*s, oy=b.y+b.h/2;
  const X=x=>ox+x*s, Y=z=>oy-z*s, zh=b.h/2/s;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  ctx.fillStyle='#080c1a'; ctx.fillRect(b.x,b.y,b.w,b.h);
  /* the wind: radial lines and parcels moving at w */
  const tsec=Math.max(0,M.t)*3600;
  for(let k=-6;k<=6;k++){ const a=k*0.07; ctx.strokeStyle='rgba(139,147,166,0.13)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(1.3*Math.cos(a)),Y(1.3*Math.sin(a))); ctx.stroke();
    for(let j=0;j<10;j++){ const r=((ST.w*1e3*tsec/AU+j*0.13+k*0.031)%1.3+1.3)%1.3; if(r<0.02) continue; ctx.fillStyle='rgba(170,178,196,0.55)'; ctx.fillRect(X(r*Math.cos(a))-1,Y(r*Math.sin(a))-1,2,2); } }
  const rc=(R_SUN+R.h)/AU, Rc=K_CLOUD*rc;
  if(M.t>=0){
    /* the shock and the sheath */
    if(ev.shock){ const rs=rc+Rc*(1+SHEATH), half=Math.asin(Math.min(0.99,Rc*1.35/rs));
      ctx.fillStyle=rgba(COL.sheath,0.12); ctx.beginPath(); ctx.arc(X(0),Y(0),rs*s,-half,half); ctx.arc(X(rc),Y(0),Rc*s,0.5*PI,-0.5*PI,true); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=COL.sheath; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(X(0),Y(0),rs*s,-half,half); ctx.stroke();
      if(rs<1.12) lab(ctx,W,H,X(rs)+6,Y(Rc*1.1),'the shock','#f2b27a',SM_FONT,'left','middle',PLATE); }
    /* the cloud: circles of its azimuthal field, brighter where it is strong */
    for(let k=1;k<=5;k++){ const r=k/5, Bz=besselJ(1,J0_ZERO*r); ctx.strokeStyle=rgba(COL.live,0.35+0.9*Bz); ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(X(rc),Y(0),Math.max(1.5,r*Rc*s),0,TAU); ctx.stroke(); }
    ctx.fillStyle=rgba(COL.live,0.15); ctx.beginPath(); ctx.arc(X(rc),Y(0),Math.max(2,Rc*s),0,TAU); ctx.fill();
    dot(ctx,X(rc),Y(0),2.4,'#f6d8f4');
    /* the field's sense at the cloud's front and back */
    const sg=ST.lead==='S'?-1:1, ar=Math.max(8,Math.min(18,Rc*s*0.5));
    /* screen y runs down: a southward field at the front is an arrow pointing down */
    if(Rc*s>10){ const dn=-sg; arrowPx(ctx,X(rc+Rc*0.6),Y(0)-dn*ar/2,X(rc+Rc*0.6),Y(0)+dn*ar/2,'#f6d8f4',1.4);
      arrowPx(ctx,X(rc-Rc*0.6),Y(0)+dn*ar/2,X(rc-Rc*0.6),Y(0)-dn*ar/2,'#f6d8f4',1.4); }
  }
  /* the Sun and the Earth */
  const gs=ctx.createRadialGradient(X(0),Y(0),0,X(0),Y(0),14); gs.addColorStop(0,'#fff4d6'); gs.addColorStop(0.35,'#f9b64c'); gs.addColorStop(1,'rgba(249,182,76,0)');
  ctx.fillStyle=gs; ctx.beginPath(); ctx.arc(X(0),Y(0),14,0,TAU); ctx.fill();
  dot(ctx,X(1),Y(0),4.5,'#5ac8e0','#e9f6ff');
  ctx.restore();
  ctx.strokeStyle='#242a3a'; ctx.lineWidth=1; ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
  lab(ctx,W,H,X(0),Y(0)+22,'the Sun','#f9d68a',SM_FONT,'center','middle',PLATE);
  lab(ctx,W,H,X(1),Y(0)+16,'the Earth','#9fe3f2',SM_FONT,'center','middle',PLATE);
  if(M.t>=0&&Rc*s>14) lab(ctx,W,H,X(rc),Y(Rc)-10,'the cloud, '+fmt(R.v/1e3,0)+' km/s','#f0b8ec',SM_FONT,'center','middle',PLATE);
  lab(ctx,W,H,b.x+8,b.y+12,'north ↑','#8b93a6',SM_FONT,'left','middle');
  /* 0.1 AU scale */
  const sbp=0.1*s; ctx.strokeStyle='#cfd4de'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(b.x1-12-sbp,b.y1-12); ctx.lineTo(b.x1-12,b.y1-12); ctx.stroke();
  lab(ctx,W,H,b.x1-16-sbp,b.y1-12,'0.1 AU','#aeb6c6',SM_FONT,'right','middle');
  HIT.push({kind:'none',b});
  if(L.bottom[0]) plotField(ctx,W,H,L.bottom[0],M);
  if(L.bottom[1]) plotVel(ctx,W,H,L.bottom[1],M);
  drawCaption(ctx,L);
}
function earthWindow(M){ const ev=M.ev; return [Math.max(0,ev.tSh-12),ev.tEnd]; }
function plotField(ctx,W,H,b,M){ const S=M.S, [t0,t1]=earthWindow(M);
  let ym=10; for(let i=0;i<S.t.length;i++) if(S.t[i]>=t0&&S.t[i]<=t1) ym=Math.max(ym,S.B[i]); ym=Math.ceil(ym*1.15/10)*10;

  hline(ctx,b,-ym,ym,0,'#3a4256',[]);

function plotVel(ctx,W,H,b,M){ const S=M.S, [t0,t1]=earthWindow(M);
  let ym=500; for(let i=0;i<S.t.length;i++) if(S.t[i]>=t0&&S.t[i]<=t1) ym=Math.max(ym,S.v[i]); ym=Math.ceil(ym*1.1/100)*100;
  axesT(ctx,b,t0,t1,0,ym,{title:titleFor(b,'at the Earth: the wind&rsquo;s speed, km/s, and its density × 20, cm⁻³','speed'),xlab:'hours after the eruption',nx:4,ny:2,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)});

/* ================================================================== *
 *  the magnetosphere                                                  *
 * ================================================================== */
function magCaption(M){ const q=M.q;
  return {full:'The Earth in the noon–midnight plane, the Sun to the left, '+REG_NAME[q.reg]+' arriving. The magnetopause (Shue et al.&rsquo;s shape) stands where the wind&rsquo;s pressure meets the field; outside it the bow shock. '+
    (q.Bz<-0.5?'The field arriving points south, opposite the Earth&rsquo;s on the nose: they reconnect there (×), the opened lines are swept into the tail and reconnect again on the night side, and electrons from there run down the lines into the oval (the dots). ':
      'The field arriving does not point south, so little reconnects on the nose and the polar cap stays small. ')+
    'Field lines are a dipole, open (orange) poleward of the polar cap&rsquo;s edge; the tail is drawn schematically. Below: Dst, the storm&rsquo;s ring current, and the magnetopause&rsquo;s distance.',
    short:'The wind meets the magnetosphere; a southward field opens flux. Below: Dst and the magnetopause.'}; }
function drawMagneto(ctx,W,H,M){
  const q=M.q, cap=magCaption(M), nb=isNarrow(W)?nbNarrow(H):2, L=stageLayout(ctx,W,H,cap.full,cap.short,nb,0.34,nbNarrow(H)), b=L.main;
  lab(ctx,W,H,b.x,b.y-8,'the magnetosphere, noon to midnight','#aeb6c6','italic 13px Georgia, serif','left','bottom');
  /* world in R_E: x tailward, z north; the window -18..42 wide, height by aspect */
  const xmin=-16, xmax=32, s=Math.min(b.w/(xmax-xmin),b.h/30), ox=b.x+(b.w-s*(xmax-xmin))/2-xmin*s, oy=b.y+b.h/2;
  const X=x=>ox+x*s, Y=z=>oy-z*s, zt=b.h/2/s;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  ctx.fillStyle='#080c1a'; ctx.fillRect(b.x,b.y,b.w,b.h);
  const r0=M.r0, al=M.al, mp=th=>r0*Math.pow(2/(1+Math.cos(th)),al);
  const Mach=Math.max(2,q.v/60), bsr=r0*(1+1.1*((5/3-1)*Mach*Mach+2)/((5/3+1)*Mach*Mach)), bs=th=>bsr*Math.pow(2/(1+Math.cos(th)),Math.min(1.2,al+0.3));
  /* the wind's field outside: vertical lines carried along at the wind's speed, coloured by what is arriving */
  const imfCol=q.reg==='cloud'?COL.live:q.reg==='sheath'?COL.sheath:COL.wind, sp=4, off=((SIM.tReal*q.v/80)%sp+sp)%sp;
  for(let x=xmin-sp+off;x<xmax;x+=sp){ ctx.strokeStyle=rgba(imfCol,Math.abs(q.Bz)>0.5?0.55:0.22); ctx.lineWidth=1; ctx.beginPath(); let on=false;
    for(let z=-zt;z<=zt;z+=0.4){ const r=Math.hypot(x,z), th=Math.atan2(Math.abs(z),-x), inside=r<mp(th)*1.02&&th<2.7;
      if(inside){ on=false; continue; } if(!on){ ctx.moveTo(X(x),Y(z)); on=true; } else ctx.lineTo(X(x),Y(z)); } ctx.stroke();
    if(Math.abs(q.Bz)>0.5&&x<-r0-2){ const zz=zt*0.8, d=q.Bz<0?1:-1; arrowPx(ctx,X(x),Y(zz+d*1.2),X(x),Y(zz-d*1.2),rgba(imfCol,0.9),1.2); } }
  /* the bow shock and the magnetopause */
  const curve=(f,col,lw,dash,fill)=>{ ctx.beginPath(); for(let i=0;i<=120;i++){ const th=-2.6+5.2*i/120, r=f(Math.abs(th)), x=-r*Math.cos(th), z=r*Math.sin(th);
      if(i===0) ctx.moveTo(X(x),Y(z)); else ctx.lineTo(X(x),Y(z)); }
    if(fill){ ctx.fillStyle=fill; ctx.fill(); } ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); };
  curve(bs,'rgba(232,132,58,0.65)',1.3,[5,4]);
  curve(mp,'#5ac8e0',1.8,null,'rgba(20,32,58,0.65)');
  /* the field lines: closed dipole lines, dayside ones squeezed under the magnetopause; open ones into the lobes */
  const capR=M.cap*PI/180;
  /* the magnetopause's half-width far down the tail (where x = 26): the outermost lobe line runs just inside it */
  let zTail=r0; for(let th=PI/2;th<2.6;th+=0.005){ const r=mp(th); if(-r*Math.cos(th)>=26){ zTail=r*Math.sin(th); break; } }
  for(const hemi of [1,-1]) for(let c=4;c<=40;c+=3){ const th0=c*PI/180, Lsh=1/Math.pow(Math.sin(th0),2);
    for(const side of [-1,1]){ /* side -1: dayside (x < 0) */
      if(th0>=capR){ ctx.beginPath(); let first=true;
        for(let i=0;i<=90;i++){ const th=th0+(PI/2-th0)*i/90; let r=Lsh*Math.pow(Math.sin(th),2);
          if(side<0){ const f=Math.min(1,0.94*r0/Lsh); r*=1-(1-f)*Math.pow(Math.sin(th),4); }
          const x=side*r*Math.sin(th), z=hemi*r*Math.cos(th); if(first){ ctx.moveTo(X(x),Y(z)); first=false; } else ctx.lineTo(X(x),Y(z)); }
        ctx.strokeStyle=c<Math.round(M.cap)+OVAL_W&&c>=M.cap?'rgba(141,255,90,0.75)':COL.arcade; ctx.lineWidth=1; ctx.stroke();
      } else if(side>0){ /* open: up the dipole to 3 R_E, then out along the lobe */
        const f=th0/capR, zt2=hemi*(1.6+(1-f)*(0.9*zTail-1.6)); ctx.beginPath();
        let lx=0, lz=0; for(let i=0;i<=40;i++){ const th=th0+0.5*th0*i/40, r=Lsh*Math.pow(Math.sin(th),2); if(r>3.2) break; lx=r*Math.sin(th); lz=hemi*r*Math.cos(th); if(i===0) ctx.moveTo(X(lx),Y(lz)); else ctx.lineTo(X(lx),Y(lz)); }
        ctx.bezierCurveTo(X(lx+6),Y(lz),X(lx+8),Y(zt2),X(lx+18),Y(zt2)); ctx.lineTo(X(xmax+2),Y(zt2*1.08));
        ctx.strokeStyle='rgba(242,196,106,0.75)'; ctx.lineWidth=1; ctx.stroke(); } } }
  /* the plasma sheet's reconnection site and the dayside one */
  const xmark=(x,z,txt)=>{ ctx.strokeStyle='#e9edf5'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(X(x)-5,Y(z)-5); ctx.lineTo(X(x)+5,Y(z)+5); ctx.moveTo(X(x)-5,Y(z)+5); ctx.lineTo(X(x)+5,Y(z)-5); ctx.stroke(); };
  if(q.Bz<-0.5){ xmark(-r0,0); xmark(24,0); }
  /* electrons down the oval's lines into both hemispheres, as many as the nightside releases */
  const nE=Math.round(clamp(M.phiN/1e4,1,40)), Lo=1/Math.pow(Math.sin((M.cap+OVAL_W/2)*PI/180),2);
  for(let k=0;k<nE;k++){ const ph=((SIM.tReal*0.35+k/nE)%1), hemi=k%2?1:-1, th=PI/2-(PI/2-Math.asin(1/Math.sqrt(Lo))-0.02)*ph, r=Lo*Math.pow(Math.sin(th),2);
    ctx.fillStyle='rgba(190,255,150,0.9)'; ctx.fillRect(X(r*Math.sin(th))-1.5,Y(hemi*r*Math.cos(th))-1.5,3,3); }
  /* the Earth, day side lit */
  ctx.fillStyle='#1d3a5a'; ctx.beginPath(); ctx.arc(X(0),Y(0),Math.max(3,s),0,TAU); ctx.fill();
  ctx.fillStyle='#dfeefc'; ctx.beginPath(); ctx.arc(X(0),Y(0),Math.max(3,s),0.5*PI,1.5*PI); ctx.fill();
  /* geosynchronous orbit */
  ctx.strokeStyle='rgba(205,212,222,0.35)'; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.arc(X(0),Y(0),6.62*s,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  ctx.strokeStyle='#242a3a'; ctx.lineWidth=1; ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
  lab(ctx,W,H,X(-r0)-6,Y(0)-14,'magnetopause '+fmt(r0,1)+' R<sub>E</sub>','#9fe3f2',SM_FONT,'right','middle',PLATE);
  lab(ctx,W,H,X(-bsr)-6,Y(0)+16,'bow shock','#f2b27a',SM_FONT,'right','middle',PLATE);
  if(q.Bz<-0.5) lab(ctx,W,H,X(24),Y(0)+14,'tail reconnection','#cfd4de',SM_FONT,'center','middle',PLATE);
  lab(ctx,W,H,X(0),Y(-7.5),'geosynchronous','#8b93a6',SM_FONT,'center','middle',PLATE);
  lab(ctx,W,H,b.x+8,b.y+12,'← to the Sun','#8b93a6',SM_FONT,'left','middle');
  legendBox(ctx,b.x1-170,b.y1-4-15*4-10,[[COL.arcade,'closed'],['rgba(242,196,106,0.9)','open (into the lobes)'],['rgba(141,255,90,0.9)','the oval&rsquo;s lines'],[imfCol,'the wind&rsquo;s field']]);
  HIT.push({kind:'none',b});
  if(L.bottom[0]) plotDst(ctx,W,H,L.bottom[0],M);
  if(L.bottom[1]) plotR0(ctx,W,H,L.bottom[1],M);
  drawCaption(ctx,L);
}
function plotDst(ctx,W,H,b,M){ const S=M.S, [t0,t1]=earthWindow(M), ylo=Math.min(-60,Math.floor(S.dstMin*1.15/50)*50), yhi=40;
  axesT(ctx,b,t0,t1,ylo,yhi,{title:titleFor(b,'Dst, nT: the ring current&rsquo;s field at the equator (O&rsquo;Brien & McPherron 2000)','Dst, nT'),xlab:'hours after the eruption',nx:4,ny:3,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)});
  hline(ctx,b,ylo,yhi,-50,rgba(COL.ref,0.6)); hline(ctx,b,ylo,yhi,-250,rgba(COL.ref,0.6));
  polyline(ctx,b,S.t,S.dst,t0,t1,ylo,yhi,COL.pos,1.7);
  timeLine(ctx,b,t0,t1,M.t);

}
function plotR0(ctx,W,H,b,M){ const S=M.S, [t0,t1]=earthWindow(M);
  axesT(ctx,b,t0,t1,4,14,{title:titleFor(b,'the magnetopause&rsquo;s nose, R<sub>E</sub> (dotted: geosynchronous orbit)','magnetopause, R<sub>E</sub>'),xlab:'hours after the eruption',nx:4,ny:3,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)});
  hline(ctx,b,4,14,6.62,rgba('#cfd4de',0.6),[2,3]);
  polyline(ctx,b,S.t,S.r0,t0,t1,4,14,COL.struct,1.7);

}

/* ================================================================== *
 *  the aurora                                                         *
 * ================================================================== */
const DIAL_MAX=55;
function auroraCaption(M){ const C=M.city;
  return {full:'Left: the northern hemisphere from above the magnetic pole, the Sun at the top (noon) and midnight below, magnetic latitude 90° to 35°; night is dark, and the oval glows where the electrons come down. The cities turn under it with the Earth. '+
    'Right: the view along the magnetic meridian of '+C.c.name+': the curtain where it truly stands, 100 to 400 km up, and the line of sight to it. '+
    'Below: where each colour is made for electrons of a '+fmt(ST.E0,1)+' keV Maxwellian, and how far toward the equator the oval reaches.',
    short:'The oval over the pole, and the curtain as '+C.c.name+' sees it. Below: the colours by height, and the oval&rsquo;s reach.'}; }
function drawAurora(ctx,W,H,M){
  const cap=auroraCaption(M), nb=isNarrow(W)?nbNarrow(H):2, L=stageLayout(ctx,W,H,cap.full,cap.short,nb,0.36,nbNarrow(H)), b=L.main;
  const wide=b.w>b.h*1.45, dw=wide?Math.min(b.h,b.w*0.5):Math.min(b.w,b.h), db=box(b.x,b.y,dw,b.h);
  drawDial(ctx,W,H,db,M);
  if(wide) drawMeridian(ctx,W,H,box(b.x+dw+24,b.y,b.w-dw-24,b.h),M);
  if(L.bottom[0]) plotEmission(ctx,W,H,L.bottom[0],M);
  if(L.bottom[1]) plotReach(ctx,W,H,L.bottom[1],M);
  drawCaption(ctx,L);
}
function drawDial(ctx,W,H,b,M){
  const R=Math.min(b.w,b.h)/2-18, cx=b.x+b.w/2, cy=b.y+b.h/2, ut=M.ut, sH=sunHat(ut), bright=brightOf(M.phiN);
  const pos=(colat,mlt)=>{ const a=(mlt-12)*15*PI/180, r=R*colat/DIAL_MAX; return [cx-r*Math.sin(a),cy-r*Math.cos(a)]; };
  lab(ctx,W,H,b.x,b.y-8,'the oval from above','#aeb6c6','italic 13px Georgia, serif','left','bottom');
  /* night and day, and the oval, cell by cell */
  const cell=4;
  for(let y=cy-R;y<cy+R;y+=cell) for(let x=cx-R;x<cx+R;x+=cell){ const dx=x+cell/2-cx, dy=y+cell/2-cy, r=Math.hypot(dx,dy); if(r>R) continue;
    const colat=r/R*DIAL_MAX, mlt=12+Math.atan2(-dx,-dy)*180/PI/15, u=fromMag(colat,mlt,ut), se=v3.dot(u,sH);
    const dark=clamp((-se-0.0)/0.12,0,1), ov=ovalAt(M.cap,mlt);
    let g=0; if(colat>ov.p&&colat<ov.q){ const f=(colat-ov.p)/OVAL_W, ang=(mlt-12)*15*PI/180; g=Math.sin(PI*f)*(0.45+0.55*(1-Math.cos(ang))/2)*bright; }
    const day=1-dark, base=[18+30*day,26+44*day,46+70*day], gl=g*(0.25+0.75*dark);
    ctx.fillStyle='rgb('+Math.round(Math.min(255,base[0]+70*gl))+','+Math.round(Math.min(255,base[1]+230*gl))+','+Math.round(Math.min(255,base[2]+90*gl))+')';
    ctx.fillRect(x,y,cell,cell); }
  /* the graticule of magnetic latitude and local time */
  ctx.strokeStyle='rgba(205,212,222,0.22)'; ctx.lineWidth=1;
  for(const c of [10,20,30,40,50]){ ctx.beginPath(); ctx.arc(cx,cy,R*c/DIAL_MAX,0,TAU); ctx.stroke(); }
  for(let h=0;h<24;h+=6){ const p=pos(DIAL_MAX,h); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p[0],p[1]); ctx.stroke(); }
  ctx.strokeStyle='#5ac8e0'; ctx.setLineDash([3,3]); ctx.beginPath();
  for(let i=0;i<=96;i++){ const m=24*i/96, p=pos(ovalAt(M.cap,m).p,m); if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); } ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#2a3044'; ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.stroke();
  lab(ctx,W,H,cx,cy-R-9,'noon','#f9d68a',SM_FONT,'center','middle'); lab(ctx,W,H,cx,cy+R+9,'midnight','#8b93a6',SM_FONT,'center','middle');
  lab(ctx,W,H,cx-R-6,cy,'18','#8b93a6',SM_FONT,'right','middle'); lab(ctx,W,H,cx+R+6,cy,'06','#8b93a6',SM_FONT,'left','middle');
  for(const c of [20,40]){ const p=pos(c,9); lab(ctx,W,H,p[0]+3,p[1],fmt(90-c,0)+'°','#6f7789','10px -apple-system, sans-serif','left','middle'); }
  /* the cities */
  for(const C of CITIES){ const u=unitLL(C.lat,C.lon), mg=magOf(u), colat=90-mg.mlat; if(colat>DIAL_MAX) continue;
    const p=pos(colat,mltOf(u,ut)), on=C.id===ST.city; dot(ctx,p[0],p[1],on?4:2.6,on?COL.live:'#e9edf5',on?'#fff':null);
    lab(ctx,W,H,p[0]+6,p[1],C.name,on?'#f0b8ec':'#cfd4de',SM_FONT,'left','middle',PLATE); }
  HIT.push({kind:'dial',b,cx,cy,R});
}
/* the magnetic meridian through the city: the ground, the curtain at its true height, the line of sight */
function drawMeridian(ctx,W,H,b,M){
  const C=M.city, E=M.E, lp=90-C.ov.p, lq=90-C.ov.q, bright=brightOf(M.phiN), dark=C.dark?1:clamp(-C.sunEl/6,0.15,1);
  const far=Math.max(Math.abs(lp-C.mlat),Math.abs(lq-C.mlat))*PI/180*R_E_KM, span=clamp(far+500,1200,4200);
  lab(ctx,W,H,b.x,b.y-8,'the curtain as '+C.c.name+' sees it','#aeb6c6','italic 13px Georgia, serif','left','bottom');
  const s=Math.min(b.w/(2*span),b.h/(900)), ox=b.x+b.w/2, oy=b.y+b.h*0.78;
  const P=(D,z)=>{ const Rz=R_E_KM+z; return [ox+Rz*Math.sin(D)*s, oy-(Rz*Math.cos(D)-R_E_KM)*s]; };
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  ctx.fillStyle=C.dark?'#060914':C.sunEl<0?'#0f1730':'#25406a'; ctx.fillRect(b.x,b.y,b.w,b.h);
  /* the curtain: cells of latitude and height, coloured by the three lines */
  const d0=(lq-C.mlat)*PI/180, d1=(lp-C.mlat)*PI/180, nD=60;
  for(let i=0;i<nD;i++){ const D=d0+(d1-d0)*(i+0.5)/nD, f=(i+0.5)/nD, w=Math.sin(PI*f)*bright*(0.3+0.7*dark);
    for(let z=Z_LO;z<Z_HI;z+=6){ const em=emisAt(E,z+3), c=lightRGB(em[0],em[1],em[2],0.9*w); if(c[0]+c[1]+c[2]<6) continue;
      const a=P(D-(d1-d0)/nD/2,z), bb=P(D+(d1-d0)/nD/2,z+6); ctx.fillStyle='rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+clamp(0.15+0.7*w,0,0.95)+')';
      ctx.fillRect(Math.min(a[0],bb[0]),Math.min(a[1],bb[1]),Math.abs(bb[0]-a[0])+1,Math.abs(bb[1]-a[1])+1); } }
  /* the ground, and the observer's horizon */
  ctx.fillStyle='#11141c'; ctx.beginPath(); const g0=P(-span/R_E_KM*1.2,0); ctx.moveTo(g0[0],g0[1]);
  for(let i=0;i<=80;i++){ const p=P((-1.2+2.4*i/80)*span/R_E_KM,0); ctx.lineTo(p[0],p[1]); } ctx.lineTo(b.x1,b.y1); ctx.lineTo(b.x,b.y1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(205,212,222,0.4)'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(b.x,oy); ctx.lineTo(b.x1,oy); ctx.stroke(); ctx.setLineDash([]);
  /* the line of sight to the curtain's top over the near edge */
  const see=C.see;
  if(see.where!=='overhead'){ const Dn=(see.where==='north'?lq:lp)-C.mlat, t=P(Dn*PI/180,300);
    ctx.strokeStyle=see.elev>0?'rgba(233,237,245,0.8)':'rgba(232,132,58,0.8)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(t[0],t[1]); ctx.stroke(); }
  dot(ctx,ox,oy,3.5,COL.live,'#fff');
  ctx.restore();
  ctx.strokeStyle='#242a3a'; ctx.lineWidth=1; ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
  lab(ctx,W,H,ox,oy+14,C.c.name+(C.dark?'':C.sunEl<0?' (twilight)':' (daylight)'),'#f0b8ec',SM_FONT,'center','middle',PLATE);
  lab(ctx,W,H,b.x1-6,b.y+12,'magnetic north →','#8b93a6',SM_FONT,'right','middle');
  const msg=see.where==='overhead'?'overhead':see.elev>0?fmt(see.elev,0)+'° over the '+see.where+'ern horizon':'below the horizon';
  lab(ctx,W,H,b.x+6,b.y+12,'the aurora: '+msg,see.elev>0?'#b8ec4c':'#e8843a',SM_FONT,'left','middle',PLATE);
  /* a height scale */
  const z1=P(0,300); ctx.strokeStyle='#8b93a6'; ctx.beginPath(); ctx.moveTo(b.x+10,oy); ctx.lineTo(b.x+10,oy-(oy-z1[1])); ctx.stroke();
  lab(ctx,W,H,b.x+14,oy-(oy-z1[1]),'300 km','#8b93a6','10px -apple-system, sans-serif','left','middle');
}
function plotEmission(ctx,W,H,b,M){ const E=M.E;
  axesT(ctx,b,0,1.05,Z_LO,Z_HI,{title:titleFor(b,'where each line is made, a '+fmt(ST.E0,1)+' keV Maxwellian; height, km','the colours by height'),xlab:'emission, each line scaled to its own peak',ylab:'height, km',nx:2,ny:4,xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,0)});
  polyline(ctx,b,E.dep.map(v=>v),E.zs,0,1.05,Z_LO,Z_HI,'rgba(205,212,222,0.55)',1.1,[4,3]);
  polyline(ctx,b,E.blue,E.zs,0,1.05,Z_LO,Z_HI,COL.blue,1.7);
  polyline(ctx,b,E.green,E.zs,0,1.05,Z_LO,Z_HI,COL.green,1.7);
  polyline(ctx,b,E.red,E.zs,0,1.05,Z_LO,Z_HI,COL.red,1.7);
  legendR(ctx,b,[[COL.green,'557.7 nm O'],[COL.red,'630.0 nm O'],[COL.blue,'427.8 nm N₂⁺'],['rgba(205,212,222,0.7)','energy deposited']]);
}
function plotReach(ctx,W,H,b,M){ const S=M.S, [t0,t1]=earthWindow(M), C=M.city;
  const eq=S.F.map(F=>90-ovalAt(capColat(F),0).q), po=S.F.map(F=>90-ovalAt(capColat(F),0).p);
  const ylo=Math.min(40,Math.floor(Math.min(C.mlat,Math.min.apply(null,eq))/5)*5-5), yhi=80;
  axesT(ctx,b,t0,t1,ylo,yhi,{title:titleFor(b,'the oval at midnight, magnetic latitude; dashed, '+C.c.name,'the oval&rsquo;s reach'),xlab:'hours after the eruption',nx:4,ny:3,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)+'°'});
  polyline(ctx,b,S.t,po,t0,t1,ylo,yhi,'rgba(141,255,90,0.6)',1.2);
  polyline(ctx,b,S.t,eq,t0,t1,ylo,yhi,COL.green,1.8);
  hline(ctx,b,ylo,yhi,C.mlat,COL.live);
  timeLine(ctx,b,t0,t1,M.t);
}

/* ================================================================== *
 *  the frame                                                          *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='erupt') drawErupt(ctx,W,H,M);
  else if(M.view==='cross') drawCross(ctx,W,H,M);
  else if(M.view==='magneto') drawMagneto(ctx,W,H,M);
  else drawAurora(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  /* pressing the dial picks the nearest city */
  S.pointer=function(type,x,y){ if(type!=='down') return false; const hit=hitAt(x,y); if(!hit||hit.kind!=='dial') return false;
    let best=null, bd=24; const ut=utAt(ST,ST.t);
    for(const C of CITIES){ const u=unitLL(C.lat,C.lon), colat=90-magOf(u).mlat; if(colat>DIAL_MAX) continue;
      const a=(mltOf(u,ut)-12)*15*PI/180, r=hit.R*colat/DIAL_MAX, px=hit.cx-r*Math.sin(a), py=hit.cy-r*Math.cos(a), d=Math.hypot(px-x,py-y);
      if(d<bd){ bd=d; best=C; } }
    if(best){ ST.city=best.id; return true; } return false; };
  return S;
}

/* ================================================================== *
 *  the prose                                                          *
 * ================================================================== */
const SRC_LINE='The eruption: a line current over a line dipole with its image under the surface (Forbes & Isenberg 1991; Lin & Forbes 2000), the rope&rsquo;s flux kept as in Kliem &amp; T&ouml;r&ouml;k (2006). The drag: Vr&scaron;nak et al. (2013). The cloud: Lundquist (1950), as Burlaga and others fit magnetic clouds. The magnetopause: Shue et al. (1998). Reconnection: Milan et al. (2012). Dst: O&rsquo;Brien &amp; McPherron (2000), Burton et al. (1975). The atmosphere: the US Standard Atmosphere 1976 (approximately); quenching: JPL&rsquo;s kinetics evaluation; electron range: Rees (1964). The dipole: IGRF-14 / WMM2025.';
function infoFor(v){
  const ev=events(ST), R=trajectory(ST), S=series(ST);
  if(v==='erupt') return 'Over an active region the Sun&rsquo;s field arches from one polarity to the other in closed loops, an <b>arcade</b>. Shearing and cancelling at the surface wind some of that flux into a twisted <b>flux rope</b> under it. The rope carries a current, and a current over a conducting surface is pushed away from its image below; the arcade&rsquo;s field pushes it back down. While the rope&rsquo;s flux is small it sits where the two balance, rising slowly as it grows, until the <b>nose</b> of that balance: past it no height holds it, and it erupts. As it goes, the arcade&rsquo;s loops are stretched under it and meet at an X-point, where they <b>reconnect</b>: the upper parts close round the rope and leave with it (the pinch-off), the lower parts snap back onto the Sun as flare loops. Here the rope passes its nose at '+fmt(R.N.h/R_SUN,3)+' R above the surface and leaves at '+fmt(rope(ST,ev.t20).v/1e3,0)+' km/s by 20 R.';
  if(v==='cross') return 'The ejected rope, now a <b>magnetic cloud</b>, crosses to the Earth through the <b>solar wind</b>. Faster than the wind, it is dragged toward the wind&rsquo;s speed; faster than the wind&rsquo;s own waves (about '+V_MS+' km/s), it drives a <b>shock</b>, the propagating wave that reaches the Earth first, with a hot compressed <b>sheath</b> behind it. Here the shock arrives '+hrs(ev.tSh)+' after the eruption'+(ev.shock?' (Mach '+fmt(ev.mach,1)+')':'')+', and the Earth is inside the cloud from '+hrs(ev.tIn)+' to '+hrs(ev.tOut)+'. Inside, the field turns smoothly: an east–west rope whose field over it pointed '+(ST.lead==='S'?'south shows its southward part first':'north shows its northward part first')+'.';
  if(v==='magneto') return 'The Earth&rsquo;s field holds the wind off at the <b>magnetopause</b>, about 10 Earth radii out on the day side, where the wind&rsquo;s pressure balances the field&rsquo;s; a <b>bow shock</b> stands outside it. When the field arriving points <b>south</b>, opposite to the Earth&rsquo;s at the nose, the two reconnect there: Earth field lines are opened to the wind, swept over the poles into the tail, and reconnected again on the night side (Dungey&rsquo;s cycle). The opened flux is the <b>polar cap</b>; the more is opened, the larger it is. Particles accelerated in the tail run down the closed lines just outside it. In this storm the magnetopause comes in to '+fmt(S.r0Min,1)+' R<sub>E</sub> and Dst falls to '+sgn(S.dstMin,0)+' nT.';
  return 'Electrons from the tail, a few keV each, run down the field into the upper atmosphere and stop there, losing their energy in collisions. They excite oxygen and nitrogen, which glow: the <b>green</b> 557.7 nm line of oxygen near '+fmt(emission(ST.E0).zGreen,0)+' km, the <b>red</b> 630.0 nm line of oxygen higher up, and the <b>blue-violet</b> line of ionized nitrogen low down. The red line comes from a state that lives about 110 s before it radiates; lower down a collision takes its energy first, so red only shows high up, where the air is thin. The band where this happens rings the polar cap: the <b>auroral oval</b>. The more flux the storm opens, the wider the cap and the farther toward the equator the oval reaches.';
}
function physFor(v){
  if(v==='erupt') return '<h4>the force on the rope</h4><p>A straight current I at height h over a surface that keeps its flux sees an image &minus;I at &minus;h; it repels the rope with B = &mu;₀I/4&pi;h. The arcade, a line dipole at depth d, gives B = M/(h+d)² at the rope, pulling it down:</p>'
    +'<span class="eq">&lambda; d²h/dt² = I(&mu;₀I/4&pi;h &minus; M/(h+d)²) &minus; &lambda;GM☉/(R☉+h)²<span class="n">(1)</span></span>'
    +'<p>The rope&rsquo;s own flux LI is kept (L &prop; ln(2h/a)), so I = C/ln(2h/a). Equilibria are where (1) vanishes; C against h rises to a <b>nose</b> and falls. Raise C past it and there is none. M = 4B<sub>d</sub>d², B<sub>d</sub> the arcade&rsquo;s field at h = d.</p>'
    +'<h4>the pinch-off</h4><p>The field lines are the contours of A = M(y+d)/(x²+(y+d)²) + (&mu;₀I/2&pi;) ln(r<sub>image</sub>/r<sub>rope</sub>). On the axis the field changes sign under the rope: an X-point, and the separatrix through it divides the loops that leave from those that stay. This ideal model has the X-point; a real eruption makes a current sheet there, and reconnection in it lets the rope go.</p>'
    +'<p class="cite">'+SRC_LINE+'</p>';
  if(v==='cross') return '<h4>drag</h4><span class="eq">dv/dt = &minus;&gamma;(v &minus; w)|v &minus; w|<span class="n">(2)</span></span><p>beyond 20 R, with &gamma; = '+fmt(ST.gam,2)+' × 10⁻⁷ km⁻¹ and w = '+fmt(ST.w,0)+' km/s (Vr&scaron;nak et al. 2013 find &gamma; ~ 0.1&ndash;2 × 10⁻⁷ km⁻¹).</p>'
    +'<h4>the cloud&rsquo;s field</h4><span class="eq">B<sub>axis</sub> = B₀J₀(&alpha;r), &nbsp; B<sub>&phi;</sub> = &plusmn;B₀J₁(&alpha;r), &nbsp; &alpha;R = 2.405<span class="n">(3)</span></span><p>Lundquist&rsquo;s force-free field (&nabla;×B = &alpha;B). B₀ falls as r⁻² as the cloud (radius 0.1 r) grows. The Earth&rsquo;s path through it gives the north&ndash;south turn of B<sub>z</sub>.</p>'
    +'<h4>the shock</h4><span class="eq">&rho;₂/&rho;₁ = 4M²/(M² + 3)<span class="n">(4)</span></span><p>for &gamma; = 5/3 and the cloud&rsquo;s Mach number against a 60 km/s fast-mode speed (assumed); the sheath is '+SHEATH+' cloud radii thick (assumed).</p><p class="cite">'+SRC_LINE+'</p>';
  if(v==='magneto') return '<h4>the magnetopause</h4><span class="eq">r = r₀(2/(1 + cos&theta;))<sup>&alpha;</sup><span class="n">(5)</span></span><p>with r₀ and &alpha; from B<sub>z</sub> (nT) and the pressure (nPa), Shue et al. (1998).</p>'
    +'<h4>opening and closing flux</h4><span class="eq">&Phi;<sub>D</sub> = L<sub>eff</sub> v B<sub>yz</sub> sin<sup>9/2</sup>(&theta;/2), &nbsp; L<sub>eff</sub> = 3.8R<sub>E</sub>(v/400 km s⁻¹)<sup>1/3</sup><span class="n">(6)</span></span>'
    +'<span class="eq">dF/dt = &Phi;<sub>D</sub> &minus; (F &minus; F₀)/&tau;<span class="n">(7)</span></span><p>&theta; the clock angle of the field (0 north, 180° south). F₀ = 0.4 GWb and &tau; = 1 h are assumed.</p>'
    +'<h4>the ring current</h4><span class="eq">dDst*/dt = Q(VB<sub>s</sub>) &minus; Dst*/&tau;, &nbsp; &tau; = 2.4 exp(9.74/(4.69 + VB<sub>s</sub>)) h<span class="n">(8)</span></span><p>Q = &minus;4.4(VB<sub>s</sub> &minus; 0.49) nT/h, VB<sub>s</sub> in mV/m; Dst = Dst* + 7.26&radic;P &minus; 11 (O&rsquo;Brien &amp; McPherron 2000).</p><p class="cite">'+SRC_LINE+'</p>';
  return '<h4>the polar cap and the oval</h4><span class="eq">F = 2&pi;B₀R<sub>E</sub>² sin²&theta;<sub>pc</sub><span class="n">(9)</span></span><p>The dipole&rsquo;s flux poleward of colatitude &theta;; the oval is a band '+OVAL_W+'° wide outside it, '+OVAL_SHIFT+'° nearer the equator at midnight (assumed).</p>'
    +'<h4>where the light comes from</h4><p>Electrons of a Maxwellian of characteristic energy E₀ (number flux &prop; E e<sup>&minus;E/E₀</sup>); one of energy E stops within a column mass R(E) = 4.30 × 10⁻⁷ + 5.36 × 10⁻⁶ E<sup>1.67</sup> g/cm² (Rees 1964), depositing their energy as a bell in depth (simplified). Each line&rsquo;s emission is that deposit times its species&rsquo; share, times</p>'
    +'<span class="eq">1 / (1 + &tau; &Sigma; k<sub>i</sub> n<sub>i</sub>(z))<span class="n">(10)</span></span><p>the fraction that radiates before a collision: &tau; = 110 s for O(¹D) (red), 0.74 s for O(¹S) (green), with N₂ and O₂ quenching (JPL). The yields 1 : 2.5 : 1 (blue : green : red) are assumed. The colours are drawn on a square-root scale.</p><p class="cite">'+SRC_LINE+'</p>';
}
const HINTS={erupt:'space plays or pauses · 1–4 switch views',cross:'space plays or pauses · 1–4 switch views',magneto:'space plays or pauses · 1–4 switch views',aurora:'press a city on the dial · space plays or pauses · 1–4 switch views'};

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene'), panel=document.getElementById('panel'), tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout'), eqEl=document.getElementById('eqbar'), tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint'), errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;
  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));
  let lastView=null;
  function setView(k,byHand){ st.view=k; if(byHand) st.follow=false; syncAll(); }
  TABS.forEach(([k,l])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k,true),html:l})); });
  const rows={};
  function slider(key,l,lo,hi,step2,fmtf,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])}), val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,l),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value)); if(key!=='t'){ const ev=events(st); st.t=Math.min(st.t,ev.tEnd); } syncAll(); });
    let rk=key; while(rows[rk]) rk+='+'; rows[rk]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  function checkbox(key,l){ const inp=h('input',{type:'checkbox'}); inp.checked=st[key]; const el=h('label',null,inp,l);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; syncAll(); }); rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp}; return el; }
  const CHIPROWS=[];
  function chipRow(list,key){ const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip',html:o.name,onclick:()=>{ st[key]=o.id; syncAll(); }})); });
    CHIPROWS.push([wrapEl,list,key]); return wrapEl; }

  const gJ=h('div',{class:'grp'},h('h3',null,'the journey'));
  const playBtn=h('button',{onclick:()=>{ const ev=events(st); if(st.t>=ev.tEnd-1e-9){ st.t=-T_BUILD; if(st.follow) st.view='erupt'; } st.play=!st.play; syncAll(); }},'pause');
  gJ.appendChild(h('div',{class:'btnrow'},playBtn,h('button',{onclick:()=>{ st.t=-T_BUILD; st.play=true; st.follow=true; st.view='erupt'; syncAll(); }},'from the start')));
  gJ.appendChild(slider('t','time',0,1000,1,v=>v<0?'−'+fmt(-v,1)+' h':'+'+fmt(v,1)+' h',
    {to:u=>{ const ev=events(st); return -T_BUILD+(ev.tEnd+T_BUILD)*u/1000; },from:v=>{ const ev=events(st); return 1000*(v+T_BUILD)/(ev.tEnd+T_BUILD); }}));
  gJ.appendChild(h('div',{class:'checks'},checkbox('follow','follow the CME from view to view')));
  const jTag=h('div',{class:'tag'}); gJ.appendChild(jTag);

  const gE=h('div',{class:'grp'},h('h3',null,'the eruption'));
  gE.appendChild(slider('bG','arcade field, G',LIM.bG[0],LIM.bG[1],0.1,v=>fmt(v,1)));
  gE.appendChild(slider('mass','the CME’s mass, kg',0,LOGN,1,v=>sci(v,1),logMap(LIM.mass[0],LIM.mass[1])));
  gE.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'Bz'),chipRow(LEAD_LIST,'lead')));
  const eTag=h('div',{class:'tag'}); gE.appendChild(eTag);

  const gC=h('div',{class:'grp'},h('h3',null,'the crossing'));
  gC.appendChild(slider('w','wind speed, km/s',LIM.w[0],LIM.w[1],5,v=>fmt(v,0)));
  gC.appendChild(slider('gam','drag γ, 10⁻⁷/km',LIM.gam[0],LIM.gam[1],0.01,v=>fmt(v,2)));
  gC.appendChild(slider('Bc','cloud field at 1 AU, nT',LIM.Bc[0],LIM.Bc[1],1,v=>fmt(v,0)));
  gC.appendChild(slider('off','Earth off the axis',LIM.off[0],LIM.off[1],0.01,v=>fmt(v,2)+' R'));

  const gA=h('div',{class:'grp'},h('h3',null,'the aurora'));
  gA.appendChild(chipRow(CITIES,'city'));
  gA.appendChild(slider('E0','electron energy, keV',0,LOGN,1,v=>fmt(v,1),logMap(LIM.E0[0],LIM.E0[1])));
  gA.appendChild(slider('ut0','the eruption at, UT',LIM.ut0[0],LIM.ut0[1],0.25,v=>utStr(v)));

  const gR=h('div',{class:'grp'},h('div',{class:'btnrow'},h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); syncAll(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gR.appendChild(keysTag);
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at')), infoEl=h('div',{id:'info'}); gInfo.appendChild(infoEl);
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation')), physEl=h('div',{id:'phys'}); gPhys.appendChild(physEl);
  [gJ,gE,gC,gA,gR,gInfo,gPhys].forEach(g=>panel.appendChild(g));

  function syncAll(){ dirty=true; refreshPanel(); }
  function refreshPanel(){
    try{
      const v=st.view;
      [].forEach.call(tabsEl.children,(bt,i)=>bt.className=TABS[i][0]===v?'active':'');
      for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(bt,i)=>bt.className='chip'+(list[i].id===st[key]?' on':''));
      for(const k in rows) rows[k].sync();
      playBtn.textContent=st.play?'pause':(st.t>=events(st).tEnd-1e-9?'play again':'play');
      const ev=events(st);
      jTag.innerHTML='the shock reaches the Earth <b>'+fmt(ev.tSh,1)+' h</b> after the eruption; the cloud from '+fmt(ev.tIn,1)+' h to '+fmt(ev.tOut,1)+' h';
      eTag.innerHTML='the field over the rope points '+(st.lead==='S'?'south':'north')+': the cloud&rsquo;s B<sub>z</sub> turns '+(st.lead==='S'?'south then north':'north then south');
      keysTag.innerHTML='1&ndash;4 switch views &nbsp; space plays or pauses';
      const M=S.model();
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M); hintEl.textContent=HINTS[v];
      if(v!==lastView){ infoEl.innerHTML=infoFor(v); physEl.innerHTML=physFor(v); lastView=v; }
      else if(!st.play) infoEl.innerHTML=infoFor(v);
    }catch(e){ fail(e); }
  }
  canvas.addEventListener('pointerdown',e=>{ const r=canvas.getBoundingClientRect(); if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)) syncAll(); });
  window.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')) return;
    if(e.key===' '){ e.preventDefault(); playBtn.click(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0],true);
  });
  function resize(){ const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr); canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0); S.W=r.width; S.H=r.height; }
  window.addEventListener('resize',()=>{ resize(); dirty=true; });
  let frames=0;
  function frameLoop(){
    const wasView=st.view, wasPlay=st.play;
    S.step();
    try{ S.draw(); }catch(e){ fail(e); }
    if(st.view!==wasView||st.play!==wasPlay||dirty||(++frames%8===0)){ dirty=false; refreshPanel(); }
    requestAnimationFrame(frameLoop);
  }
  resize(); refreshPanel(); requestAnimationFrame(frameLoop);
  return S;
}

/* ================================================================== *
 *  selfTest — headless (jsc): the physics against its own limits, and  *
 *  every view drawn at four sizes and several times                    *
 * ================================================================== */
function stubCtx(){ const g={addColorStop(){}}; const c={measureText:t=>({width:String(t).length*6}),createRadialGradient:()=>g,createLinearGradient:()=>g};
  for(const k of ['fillRect','strokeRect','beginPath','moveTo','lineTo','arc','closePath','fill','stroke','fillText','save','restore','setLineDash','translate','scale','rotate','clip','rect','bezierCurveTo','setTransform']) c[k]=function(){};
  return c; }
function selfTest(){
  let pass=0, fail=0; const T0=Date.now();
  const ok=(c,m)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+m); } };
  const rel=(a,b,tol,m)=>ok(Math.abs(a/b-1)<tol,m+' ('+a+' vs '+b+')');
  /* Bessel functions against their tabulated values */
  rel(besselJ(0,1),0.7651976865579666,1e-14,'J0(1)'); rel(besselJ(1,1),0.44005058574493355,1e-14,'J1(1)');
  ok(Math.abs(besselJ(0,J0_ZERO))<1e-14,'J0 vanishes at its first zero');
  /* the eruption: the nose, and the balance on the lower branch */
  withState({},()=>{ const P=eruptP(ST), N=noseOf(P);
    ok(N.h>P.d&&N.h<4*P.d,'the nose lies between d and 4d ('+fmt(N.h/P.d,3)+' d)');
    const hm=hEqBelow(P,0.6*N.C,N.h); rel(cEq(P,hm),0.6*N.C,1e-9,'the lower branch holds the flux it is asked for');
    const net=forceL(P,0.6*N.C,hm)-P.lam*gSun(hm); ok(Math.abs(net)<1e-6*Math.abs(forceL(P,0.6*N.C,hm))+1e-9,'and the forces balance there');
    let mono=true; for(let i=1;i<200;i++){ const a=P.a/2*(1+1e-4)*Math.pow(N.h/(P.a/2),(i-1)/199), b=P.a/2*(1+1e-4)*Math.pow(N.h/(P.a/2),i/199); if(cEq(P,b)<cEq(P,a)) mono=false; } ok(mono,'the lower branch rises to the nose');
    ok(cEq(P,1.5*N.h)<N.C&&cEq(P,0.7*N.h)<N.C,'the nose is the most flux any height holds');
    const R=trajectory(ST); ok(!R.fell,'the default rope escapes');
    let m=true; for(let i=1;i<R.H.length;i++) if(R.H[i]<R.H[i-1]) m=false; ok(m,'it never falls back');
    /* energy below 20 R: the kinetic energy equals the work of the magnetic force and gravity */
    let i20=0; while(R_SUN+R.H[i20+1]<R_DRAG&&i20<R.H.length-2) i20++;   /* the last step before the drag starts */
    let W=0; const n=40000, h0=R.H[0], h1=R.H[i20];
    for(let k=0;k<n;k++){ const ha=h0+(h1-h0)*k/n, hb=h0+(h1-h0)*(k+1)/n, hm2=(ha+hb)/2; W+=(forceL(P,R.C,hm2)-P.lam*gSun(hm2))*(hb-ha); }
    rel(0.5*P.lam*R.V[i20]*R.V[i20],W,1e-5,'energy is conserved out to 20 R');
    const v20=R.V[i20]/1e3; ok(v20>800&&v20<2500,'the default leaves at '+fmt(v20,0)+' km/s'); });
  withState({bG:12},()=>{ const a=rope(ST,events(ST).t20).v; withState({bG:4},()=>{ ok(a>rope(ST,events(ST).t20).v,'a stronger arcade throws it faster'); }); });
  withState({},()=>{ const ev=events(ST); ok(ev.tSh<=ev.tIn&&ev.tIn<ev.tOut,'shock, then the cloud in, then out');
    ok(ev.tSh>15&&ev.tSh<80,'the shock arrives in '+fmt(ev.tSh,1)+' h');
    const vE=rope(ST,ev.tIn).v/1e3; ok(vE>ST.w&&vE<rope(ST,ev.t20).v/1e3,'dragged toward the wind: '+fmt(vE,0)+' km/s at the Earth'); });
  /* the cloud: the leading field's sign, and the field's peak on the axis */
  for(const [lead,s] of [['S',-1],['N',1]]) withState({lead},()=>{ const ev=events(ST), a=insitu(ST,ev.tIn+0.1*(ev.tOut-ev.tIn)), b=insitu(ST,ev.tIn+0.9*(ev.tOut-ev.tIn));
    ok(a.reg==='cloud'&&b.reg==='cloud','inside the cloud'); ok(Math.sign(a.Bz)===s&&Math.sign(b.Bz)===-s,'lead '+lead+': B_z turns '+(s<0?'south then north':'north then south')); });
  withState({off:0},()=>{ const ev=events(ST); let best=0; for(let k=0;k<=400;k++){ const q=insitu(ST,ev.tIn+(ev.tOut-ev.tIn)*k/400); best=Math.max(best,q.B); }
    const tc=tWhenRc(ST,AU); rel(best,ST.Bc,0.03,'|B| peaks at B0 on the axis'); });
  /* the empirical laws, at points worked by hand */
  rel(shueR0(0,2),(10.22+1.29*Math.tanh(0.184*8.14))*Math.pow(2,-1/6.6),1e-15,'Shue at Bz = 0, 2 nPa');
  ok(shueR0(-20,10)<shueR0(0,2),'pressure and a southward field push it in');
  rel(obrienTau(0),2.4*Math.exp(9.74/4.69),1e-15,"O'Brien's decay time at rest"); ok(obrienQ(0.3)===0,'no injection below 0.49 mV/m');
  rel(Math.sin(capColat(0.5e9)*PI/180)**2*FLUX_HEMI,0.5e9,1e-12,'the polar cap holds the flux it is given');
  withState({},()=>{ const S=series(ST); ok(S.dstMin<-50,'the default storm reaches Dst '+fmt(S.dstMin,0)+' nT'); ok(S.Fmax>F0,'and opens flux'); });
  withState({lead:'N',Bc:5},()=>{ const S=series(ST); withState({lead:'S',Bc:40},()=>{ ok(series(ST).dstMin<S.dstMin,'a strong southward cloud makes the bigger storm'); }); });
  /* the dipole: Tromsø about 67 degrees magnetic, Austin about 39 */
  const mlat=c=>magOf(unitLL(c.lat,c.lon)).mlat;
  ok(Math.abs(mlat(CITIES[0])-66.7)<1.5,'Tromsø at '+fmt(mlat(CITIES[0]),1)+'° magnetic'); ok(Math.abs(mlat(CITIES[7])-39.5)<2.5,'Austin at '+fmt(mlat(CITIES[7]),1)+'° magnetic');
  ok(Math.abs(mltOf(sunHat(7.3),7.3)-12)<1e-9,'the subsolar point is at magnetic noon');
  { const u=fromMag(23,3.5,5); ok(Math.abs(90-magOf(u).mlat-23)<1e-9&&Math.abs(mltOf(u,5)-3.5)<1e-9,'magnetic coordinates go there and back'); }
  /* the aurora: green below red, blue lowest; a harder spectrum stops deeper */
  { const E=emission(5); ok(E.zBlue<=E.zGreen&&E.zGreen<E.zRed,'blue '+E.zBlue+', green '+E.zGreen+', red '+E.zRed+' km'); ok(E.zRed>=180,'the red line lives high up');
    ok(emission(20).zDep<emission(1).zDep,'harder electrons stop deeper ('+emission(20).zDep+' vs '+emission(1).zDep+' km)');
    ok(survive1D(120)<0.01&&survive1D(350)>0.5,'O(1D) is quenched low and survives high'); ok(survive1S(110)>0.8,'O(1S) radiates at 110 km'); }
  ok(Math.abs(elevOf(0.05,300)-elevOf(0.05,300))<1e-12&&elevOf(1e-6,100)>89,'straight up overhead');
  /* every view at four sizes and at times through the journey: no throw, no NaN in the text */
  const sizes=[[1400,820],[1100,712],[820,520],[560,380]];
  const ev=withState({},()=>events(ST));
  const times=[-3,-1.5,0,0.3,1,ev.tExit+1,0.5*(ev.tExit+ev.tSh),ev.tSh,ev.tIn+2,0.5*(ev.tIn+ev.tOut),ev.tOut,ev.tEnd];
  for(const v of ['erupt','cross','magneto','aurora']) for(const t of times) for(const [W,H] of sizes){
    withState({view:v,t},()=>{ let err=null; try{ drawView(stubCtx(),W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,v+' at '+fmt(t,1)+' h, '+W+'x'+H+(err?': '+err:''));
      const M=buildModel(), txt=readoutHTML(M)+eqbarHTML(M)+tagHTML(M)+infoFor(v)+physFor(v);
      ok(!/NaN|undefined|Infinity/.test(txt),v+' at '+fmt(t,1)+' h: the text is clean'); }); }
  for(const over of [{lead:'N'},{bG:3,mass:1e13},{bG:15,mass:3e11},{w:700,gam:2},{off:0.9},{E0:0.5,city:'austin'},{E0:20,city:'tromso'}])
    withState(over,()=>{ const e=events(ST); for(const v of ['erupt','cross','magneto','aurora']) for(const t of [0.2,e.tSh,0.5*(e.tIn+e.tOut)]) withState({view:v,t},()=>{
      let err=null; try{ drawView(stubCtx(),1100,712,buildModel()); }catch(x){ err=x; } ok(!err,JSON.stringify(over)+' '+v+(err?': '+err:''));
      ok(!/NaN|undefined|Infinity/.test(readoutHTML(buildModel())),JSON.stringify(over)+' '+v+' readout clean'); }); });
  console.log(pass+' passed, '+fail+' failed ('+(Date.now()-T0)+' ms)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}
if(typeof document==='undefined'){ if(typeof SKIP_SELFTEST==='undefined') selfTest(); }
else { if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot(); }
</script>
