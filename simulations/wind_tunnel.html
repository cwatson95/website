<title>Wind tunnel — a lattice-Boltzmann test section</title>
<!--
  A WORKING WIND TUNNEL.  NOT A PICTURE OF ONE.

  Every streamline, every vortex, every number in this file comes out of a
  Navier-Stokes solver running in the page.  There is no drawn wake, no canned
  flow field, no fitted drag curve.  Put a body in the test section, set the
  Reynolds number, and the vortex street that appears is the one the equations
  produce -- which is why it can be wrong, and why the file spends most of its
  length proving that it is not.

  THE SOLVER.  D2Q9 lattice Boltzmann with a TWO-RELAXATION-TIME collision
  (Ginzburg & d'Humieres) and a Smagorinsky sub-grid model for the turbulence
  the lattice cannot resolve.  Lattice Boltzmann is Navier-Stokes: a
  Chapman-Enskog expansion of the discrete Boltzmann equation returns the
  incompressible momentum equation with

        nu  =  c_s^2 (tau - 1/2),        c_s^2 = 1/3                       (*)

  and that identity is not asserted from the literature here, it is MEASURED:
  selfTest decays a shear wave and recovers nu, and shows the residual error
  falling as k^2 when the wavelength is doubled -- i.e. that the gap is the
  discretisation and not the model.

  WHY TRT AND NOT PLAIN BGK -- this is the one design decision worth reading.
  With half-way bounce-back on a solid, the wall does not sit exactly half a
  cell outside the last fluid node unless the "magic parameter"

        Lambda  =  (tau_+ - 1/2)(tau_- - 1/2)  =  3/16                    (**)

  is held fixed.  Single-relaxation-time BGK forces tau_- = tau_+, so Lambda
  drifts with the viscosity and the effective wall position drifts with it: the
  measured drag then depends on the Reynolds number through the SCHEME, which is
  indistinguishable from physics unless you look for it.  Fixing Lambda = 3/16
  removes it.  The difference is measured, not argued: driven plane Poiseuille
  flow between bounce-back walls comes out exact to 1e-11 at every tau under TRT
  (tau = 0.6, 0.8, 1.2, 2.0, 5.0), while the same test under BGK is wrong by
  2.0e-3, 3.7e-3, 6.3e-3 and 4.3e-2 -- an error that grows with tau and would
  have been read as a Reynolds-number trend.  selfTest runs BOTH and asserts the
  BGK version is still bad, so the reason for the choice cannot rot.

  WHAT IS MEASURED -- the numbers this file is checked against.

    Circular cylinder, the one 2-D geometry with a settled literature.  Cui,
    Wang, Yao, Liu & Yu, "A Coupled Two-relaxation-time Lattice Boltzmann-Volume
    Penalization method for Flows Past Obstacles", arXiv:1901.08766v2, Tables 1
    and 2, which collect five independent studies:

      Re =  20   C_d 2.09 - 2.144    L_s/D 0.93 - 0.945   theta_s 42.8 - 43.0 deg
      Re =  40   C_d 1.539 - 1.589   L_s/D 2.20 - 2.26    theta_s 52.9 - 53.86 deg
      Re = 100   C_d 1.325 - 1.46    C_l +-0.28 - +-0.38  St 0.163 - 0.170
      Re = 200   C_d 1.327 - 1.45    C_l +-0.60 - +-0.75  St 0.193 - 0.196

    (Niu et al. 2006; Wu & Shu 2009; Cui et al. 2017; Benson et al. 1989;
    Ding et al. 2004.)  They are drawn as RINGED points on the sweep view and
    everything between them is the solver, not a fit.

    Roshko's St-Re formula is deliberately NOT used.  NACA TN 2913 is available
    only as a scan, and this collection's rule is that a number read off an OCR
    of a scan is not a measured number.  Discrete cited anchors, no fitted curve.

  DOES IT GET THE RIGHT ANSWER?  Measured, at three grid spacings and four
  channel heights, and the chain is short enough to check.

    Re = 100, the shedding case.  Cylinder resolved by 10, 16 and 24 cells,
    section 20 D tall (5% blockage), run 35-60 shedding periods:

              C_D            C_L amplitude       St
      D = 10  1.4230         0.309               0.16466
      D = 16  1.4287         0.344               0.16879
      D = 24  1.4227         0.349               0.16857
      measured 1.325 - 1.460   0.280 - 0.380     0.163 - 0.170

    All three quantities are inside the published spread at every resolution.
    (The lift amplitude is the rms times sqrt 2; the table quotes amplitudes.)

    Re = 40, the steady case, is the interesting one, because it does NOT land
    inside on its own and the reason is measurable:

      D = 10   C_D 1.6566   L_s/D 2.4100
      D = 16   C_D 1.6283   L_s/D 2.3362
      D = 24   C_D 1.6227   L_s/D 2.3313      -> Richardson: C_D 1.618

    1.618 is 2% above the published 1.539 - 1.589, and the missing 2% is the
    tunnel, not the solver: holding D = 10 and opening the section from 20 D to
    70 D gives C_D 1.6566, 1.6336, 1.6278, 1.6267, i.e. 5% blockage inflates the
    drag by 1.8%.  Taking that out of the grid-converged value leaves

          C_D = 1.618 x 0.982 = 1.589    against a measured 1.539 - 1.589.

    The bubble length is less good: grid-converged 2.33 against a measured
    2.20 - 2.26, about 3% long, and no blockage correction for it was measured,
    so that 3% is simply not accounted for.  Said plainly rather than rounded off.

  THE STAIRCASE.  A body rasterised onto the lattice is a staircase, and
  half-way bounce-back puts the no-slip surface half a cell outside the
  outermost solid node.  There is no fudge factor for this anywhere in the file:
  the reference length is the frontal height in cells, printed on the canvas,
  and the residual error is the 1/D trend measured above.  If you want a
  believable number from this or any other CFD, that table is the work.

  WHAT IS NOT MODELLED -- read this before quoting a drag coefficient.

    THIS IS TWO-DIMENSIONAL, AND TWO DIMENSIONS IS NOT THREE.  It is the single
    biggest limitation and no amount of resolution repairs it:
      - there is no vortex stretching, so the turbulent energy cascade runs
        BACKWARDS.  3-D turbulence hands energy down to the dissipation scale
        (Kolmogorov, E(k) ~ k^-5/3); 2-D turbulence hands energy UP to large
        scales and cascades enstrophy down instead, with E(k) ~ k^-3.  The
        spectrum view draws both slopes so the difference is visible rather
        than asserted.
      - there are no trailing vortices, so there is no induced drag, so a wing
        section here has no drag due to lift at all.
      - a car and a rocket are three-dimensional.  The C_D this file reports for
        them is the drag of an INFINITE-SPAN EXTRUSION of that silhouette, which
        is a different object with a different number.  The model view draws the
        extrusion in 3-D precisely so that this is impossible to forget, and the
        readout labels every bluff-body C_D as 2-D.  Published road-car drag
        coefficients are not comparable and none are quoted.
    Also absent: compressibility (the lattice runs at Ma < 0.1 by construction
    and the readout warns if a setting breaks that), heat transfer, wall
    functions (the near-wall layer is resolved, badly, at high Re -- the readout
    says when the boundary layer is thinner than a cell), and surface roughness.

  THE TURBULENCE, three separate things that are easy to confuse:
    1. RESOLVED unsteadiness -- vortex shedding and the wake.  Solved directly.
    2. FREESTREAM turbulence -- what a turbulence grid in the settling chamber
       puts into the flow.  Injected at the inlet as a seeded, band-limited,
       divergence-free-by-construction perturbation with a prescribed intensity
       Tu = u'/U, and the sim measures Tu back out of the flow to confirm it.
    3. SUB-GRID turbulence -- the eddies smaller than a cell, which the lattice
       cannot see.  Smagorinsky eddy viscosity, closed in terms of the local
       non-equilibrium momentum flux Q_ab = sum_i c_ia c_ib (f_i - f_i^eq):

         tau = 1/2 ( tau_0 + sqrt( tau_0^2 + 2 (Cs*Delta)^2 |Q| / (rho c_s^4) ) )

       derived in the file rather than quoted, and asserted by checking that the
       tau it returns satisfies nu_total - nu_0 = (Cs*Delta)^2 |S| exactly.

  THE TRIP, and why the wake used to take three minutes to appear.  The
  symmetric steady wake behind a cylinder at Re = 100 IS a solution of these
  equations; it is simply an unstable one.  Started from a perfectly uniform
  field the only asymmetry present is floating-point round-off, so the
  Karman instability has about fourteen decades to climb before anything is
  visible.  Measured at the default settings (D = 9, Re = 100), growth rate
  0.18 per convective time:

      untripped   C_L amplitude 0.080 at t = 69 U/L, and still growing;
                  reaching the limit cycle takes of order 170 convective times
      tripped     0.193 at t = 17,  0.304 at t = 46,  0.333 at t = 69
      measured    0.280 - 0.380  (Cui et al., five studies)

  So the tripped run is inside the published spread by t ~ 46 and the street is
  plainly visible within about 2000 steps, which is seconds rather than
  minutes.  The trip is a single vortex blob in the near wake, applied ONLY to
  the INITIAL CONDITION and built as the curl of a Gaussian stream function so
  it is divergence-free by construction and injects no acoustic pulse.  No term
  is added to the equations: for every t > 0 the solver being integrated is
  bit-for-bit the one validated above.  A limit cycle does not remember which
  initial condition reached it, and that is asserted rather than argued --
  selfTest runs a steady Re 40 cylinder from a tripped and an untripped start
  and requires the converged C_D to agree to 0.2% and the bubble length to
  0.5%.  It can be switched off, and then you can watch the slow version.

  THE WAKE GEOMETRY, now measured instead of only quoted.  L_s/D, the length of
  the closed recirculation bubble, and theta_s, the separation angle, used to
  exist in this file only as stored literature anchors.  Both are now measured
  out of the running flow:
    - L_s is the reverse-flow extent on the wake centreline, from the SURFACE
      at the back of the body -- not the last solid node, because half-way
      bounce-back puts the wall half a cell outside it and measuring from the
      node biases every reading by 0.5/D, which is 3% at D = 16.  The crossing
      is linearly interpolated, so the answer is not quantised to the lattice.
    - theta_s is the sign change of the tangential velocity on a ring 1.2 cells
      outside the nominal radius, reported FROM THE BASE, which is the
      convention Cui et al. Table 1 uses.  It is not the wall shear, and its
      error is O(1/D) like everything else here.
  DO THEY CONVERGE?  Measured, the same way the drag was.  Re 40 cylinder, slip
  walls, section held at 14 D tall so the blockage stays 7.1% and the only
  thing changing is the resolution; each case run to a stationary reading
  (the last two windows agree to the digits shown):

      D       C_D        L_s/D      theta_s
       8    1.7802      2.5079      39.85 deg
      12    1.7522      2.3927      44.47 deg
      16    1.7324      2.3300      45.63 deg
      unbounded, measured:  1.539-1.589   2.200-2.260   52.9-53.86 deg

  L_s/D falls monotonically towards the published band and is 3% above the top
  of it at D = 16.  theta_s rises monotonically towards its band and is still
  about 15% low there -- it is the slowest-converging of the three, which is
  what you would expect of a quantity read off a ring OUTSIDE the wall: the
  further from the surface the sample sits, the later the reversal appears and
  the smaller the angle reads.  A 1/D extrapolation of the last two points puts
  it near 49 deg and of the outer two near 51 deg, and the fact that those two
  extrapolations disagree by 2 deg is itself the honest statement about how
  well 1/D describes it.  Nothing here is corrected by a factor; the numbers
  are what the solver gives.
  CAVEAT ON THAT TABLE: it was run at u_lat = 0.09, i.e. lattice Mach 0.156,
  which is above the 0.12 this file's own panel warns at.  The D-trend is the
  point and is unaffected, but the absolute values carry a compressibility
  error on top of everything else and should not be read as three-digit truth.

  Both are steady-flow quantities and the file refuses to print them once the
  wake is shedding, because there is then no closed bubble to have a length.
  The measurement functions are pinned by exact tests rather than by plausible
  output: the bubble length against a synthetic field with an analytic zero
  crossing (machine precision), and the separation angle against a uniform
  field whose tangential component vanishes at a chosen angle -- which is the
  assertion that catches the convention being taken from the nose instead of
  the base, an error of 74 degrees that would still look plausible on a panel.

  Q, BECAUSE VORTICITY IS NOT A VORTEX.  Plane shear has vorticity everywhere
  and no vortex anywhere, which is why the tunnel's own wall boundary layers
  paint as brightly as the vortex street does on the vorticity field.  The Q
  field draws the second invariant of the velocity gradient, positive where
  rotation beats strain.  It is asserted at machine precision on three fields
  whose answer is known in closed form -- solid-body rotation (Q = Omega^2),
  plane shear (Q = 0 EXACTLY) and plane strain (Q = -a^2) -- and the closed
  form used in the code is checked against an independent recomputation from
  the tensor definition it was derived from.  The incompressible shortcut
  S_yy = -S_xx is deliberately not taken: the lattice is weakly compressible.

  STREAMLINES ARE NOT STREAKLINES, and the file now draws both.  The smoke rake
  gives streaklines, which is what a real tunnel's smoke shows.  What smoke
  cannot show is the closed recirculation bubble, because tracers never enter
  it.  The streamlines are integrated on the UNIT tangent by midpoint RK2 so
  the arc-length step is uniform: integrating on u itself puts nearly every
  sample in the fast freestream and steps straight over the slow interior of
  the vortex, which is the one region the line exists to resolve.

  TWO INDEPENDENT DRAG MEASUREMENTS, because one is not a measurement.  The
  balance reads the force by Ladd momentum exchange over the body links.  The
  rake closes a control volume between the inlet plane and a plane behind the
  model and MEASURES BOTH, which the textbook rake formula does not: it
  substitutes ambient pressure for the inlet plane, and in a duct with a blocked
  test section the inlet is not at ambient.  Making that substitution here
  returned C_D = -0.76 against a balance reading of +2.01.

  The control volume is also closed by the TUNNEL WALLS, and they carry
  friction.  A rake that ignores it hands the tunnel's drag to the model: at the
  default settings the uncorrected control volume read C_D 3.47 against a
  balance reading of 1.57.  The enclosed wall force is therefore measured too,
  by the same momentum exchange, and subtracted.  That term is EXACT and is
  tested as such: in a steady force-driven channel every newton the body force
  puts in comes back out through the walls, and the wall momentum exchange
  equals the applied force to 1.000000 at four different viscosities.
  With free-slip walls it is identically zero, because specular reflection
  preserves streamwise momentum exactly.

  With slip walls the two readings agree to about 1% at every survey station.
  With no-slip walls they agree to under 10%, and the residual is honest rather
  than mysterious: the tunnel's own boundary layers thicken on a diffusive
  timescale of order 160 000 steps, so the control volume has a genuine unsteady
  term over any run anyone will actually watch.  The sim time-averages both
  readings over the same window and prints the difference.

  THE REYNOLDS-NUMBER CEILING, which is the difference between this file and
  the one that crashed.  Lattice Boltzmann has a viscosity floor at tau = 1/2:
  tau = 1/2 + u_lat L_ref / (Re c_s^2), so a high enough Reynolds number leaves
  the lattice with no viscosity to damp the grid-scale mode, and the run blows
  up.  The first build computed a floor, returned it in the model and never
  applied it -- the solver got whatever tau the slider implied, and the slider
  goes to Re = 2e6.  Measured: the default cylinder died at Re 300 (step 1376),
  Re 1000 (step 416), Re 3000 and up (step 288), with no warning until ~2200.

  What actually sets the limit is the CELL Reynolds number u_lat/nu_lat -- how
  far the flow moves in one cell before viscosity can respond -- not tau on its
  own, and the ceiling that follows is

      Re_max  =  (reference length in CELLS)  x  (largest stable u_lat/nu_lat)

  in which the lattice Mach number cancels: raising it buys nothing.  Only a
  bigger model or a finer grid raises the ceiling, which is the honest answer
  and the same one a sub-scale tunnel gives.  So the floor is enforced, and
  when the request is over the ceiling the panel prints BOTH numbers -- the
  Reynolds number asked for and the one being run.  Below the bare lattice's
  limit the sub-grid model is engaged automatically and says so, because an
  under-resolved run with no model for what it is missing is not a simulation,
  it is a pending crash.  Both limits are measured, in selfTest, not guessed.

  It still checks density and velocity every 32 steps and stops on divergence
  rather than keep running on NaN -- an earlier build painted a solid magenta
  test section and reported a drag coefficient of NaN, which is worse than an
  error -- but now any control at all restarts a stopped run, because a tunnel
  that stays dead until you find the right button reads as a crash.

  Single file, no dependencies, works over file://.  Canvas 2-D only; the field
  is blitted through ImageData where that exists and falls back to blocks where
  it does not, so the headless harnesses see the same picture at lower
  resolution.  Palette and layout are shared with the rest of this collection.

  Headless self-test: extract the script body (between the LAST script
  open/close tags, cf. rindex) and run it with
      osascript -l JavaScript wind_tunnel_test.js
  -- with `document` undefined it runs the assertion suite instead of booting
  the UI.  `globalThis.SLOW = 1` before it adds a cut-down cylinder benchmark, which
  takes a few minutes and reproduces the Re 100 row of the table above.
-->
<style>
  :root{
    --bg:#070b18; --panel:#0a0c12; --panel2:#10131b; --text:#cfd4de; --dim:#8b93a6;
    --accent:#5ac8e0; --edge:#1e222c; --edge2:#2a2f3d;
    --neon-a:#b8ec4c; --neon-b:#cd35c4;
    --wall:#3a4152; --body:#5ac8e0; --wake:#cd35c4; --free:#b8ec4c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{background:var(--bg); color:var(--text); display:flex; flex-direction:column;
       font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
  header{height:48px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 15px;
         background:var(--panel); border-bottom:1px solid var(--edge);}
  header h1{font-size:15px; font-weight:600; letter-spacing:.2px; white-space:nowrap;}
  header .sub{color:var(--dim); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header .sub .r{color:#e8843a;}     /* the Reynolds ceiling, when it is biting */
  nav{margin-left:auto; display:flex; gap:6px; flex-shrink:0;}
  nav button{background:transparent; color:var(--dim); border:1px solid transparent;
             padding:5px 13px; border-radius:15px; font-size:12.5px; cursor:pointer;
             font-family:Georgia, "Times New Roman", serif; letter-spacing:.4px;}
  nav button:hover{color:var(--text);}
  nav button.active{color:#fff; border-color:#556; background:rgba(255,255,255,.06);}

  #wrap{display:flex; flex:1; min-height:0;}
  #stage{position:relative; flex:1; min-width:0;}
  #scene{position:absolute; inset:0; width:100%; height:100%; display:block;
         touch-action:none; cursor:grab;}
  #scene.dragging{cursor:grabbing;}

  #readout{position:absolute; top:11px; right:13px; width:278px; pointer-events:none;
           user-select:none; -webkit-user-select:none; text-align:left;
           background:linear-gradient(180deg, rgba(10,12,18,.86), rgba(10,12,18,.66));
           border:1px solid var(--edge2); border-radius:9px; padding:10px 12px 11px;
           text-shadow:0 1px 3px rgba(0,0,0,.8); backdrop-filter:blur(2px);}
  #readout .rname{font:italic 19px Georgia, serif; color:#fff; line-height:1.15;}
  #readout .rname small{font-size:11.5px; color:var(--dim); font-style:normal; display:block;
                        margin-top:2px; letter-spacing:.3px;}
  #readout table{width:100%; border-collapse:collapse; margin-top:8px; font-size:11.5px;}
  #readout td{padding:1.5px 0; color:var(--dim); white-space:nowrap;}
  #readout td.v{color:var(--text); text-align:right; font-variant-numeric:tabular-nums;}
  #readout td.hd{color:#6f7789; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                 padding-top:8px;}
  #readout .bar{height:7px; border-radius:4px; background:#1b1f29; overflow:hidden; margin-top:4px;
                box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); position:relative;}
  #readout .fill{height:100%; border-radius:4px; background:linear-gradient(90deg,#4a7f3a,#b8ec4c);}
  #readout .fill.r{background:linear-gradient(90deg,#7a2f70,#cd35c4);}
  #readout .tick{position:absolute; top:-2px; bottom:-2px; width:1px; background:#e8e8f0; opacity:.75;}
  #readout .note{margin-top:9px; font-size:10.5px; color:#767e92; line-height:1.5;}
  #readout .note b{color:var(--dim); font-weight:600;}
  #readout .good{color:var(--neon-a);} #readout .bad{color:#e8843a;}
  #readout .legend{margin-top:9px; display:flex; flex-wrap:wrap; gap:3px 10px; font-size:10.5px; color:var(--dim);}
  #readout .legend span{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
  #readout .legend i{width:9px; height:9px; border-radius:2px; display:inline-block;
                     box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);}

  #hint{position:absolute; left:14px; bottom:11px; color:var(--dim); font-size:11px;
        pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9);}
  #tag{position:absolute; left:14px; top:11px; color:var(--dim); font:italic 13px Georgia,serif;
       pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9); max-width:52%;}
  #tag b{color:var(--text); font-style:normal; font-weight:600;
         font-family:-apple-system,sans-serif; font-size:12px;}
  #errbox{position:absolute; left:12px; top:40px; max-width:70%; background:#3a1220; color:#ffb3c0;
          border:1px solid #7c2338; border-radius:6px; padding:8px 12px; font:12px monospace;
          display:none; white-space:pre-wrap; z-index:9;}

  #eqbar{flex-shrink:0; background:var(--panel); border-top:1px solid var(--edge);
         padding:9px 16px 11px; text-align:center; overflow-x:auto; white-space:nowrap;
         font:italic 16px Georgia, "Times New Roman", serif; color:#e9e9f0; line-height:1.55;}
  #eqbar .lhs{color:#fff;}
  #eqbar .hl{color:var(--neon-a); font-style:normal;}
  #eqbar .hl2{color:var(--neon-b); font-style:normal;}
  #eqbar .sm{font:11.5px -apple-system,sans-serif; font-style:normal; color:var(--dim);
             display:block; margin-top:3px; letter-spacing:.2px;}
  #eqbar sup{font-size:10.5px;} #eqbar sub{font-size:10.5px;}

  #panel{width:300px; background:var(--panel); border-left:1px solid var(--edge);
         padding:12px 14px 24px; overflow-y:auto; flex-shrink:0;}
  .grp{margin-bottom:14px;}
  .grp h3{font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
          color:#777f90; margin-bottom:7px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:var(--panel2); border:1px solid var(--edge2); color:var(--text);
        border-radius:14px; padding:4px 11px; cursor:pointer; font-size:12.5px;
        font-family:Georgia, serif; font-style:italic; transition:.12s;}
  .chip:hover{border-color:var(--accent);}
  .chip.on{border-color:var(--neon-a); color:var(--neon-a); background:rgba(184,236,76,.09);}
  .sliderrow{display:flex; align-items:center; gap:8px; margin:7px 0;}
  .sliderrow label{font-size:12px; color:var(--dim); width:96px; flex-shrink:0;}
  .sliderrow .val{font:11.5px "SF Mono", Menlo, monospace; color:var(--text); width:66px;
                  text-align:right; flex-shrink:0;}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; min-width:0; height:3px;
                    background:#2a2e38; border-radius:2px; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
                    width:13px; height:13px; border-radius:50%; background:var(--text);
                    border:1px solid #555; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb:hover{background:#fff;}
  .checks{display:flex; flex-direction:column; gap:5px; margin-top:4px;}
  .checks label{font-size:12.5px; color:var(--text); display:flex; align-items:center;
                gap:7px; cursor:pointer;}
  .checks input{accent-color:var(--accent); width:13px; height:13px;}
  .btnrow{display:flex; gap:8px; margin-top:9px;}
  .btnrow button{flex:1; background:var(--panel2); border:1px solid var(--edge2); color:var(--text);
                 border-radius:6px; padding:6px 0; cursor:pointer; font-size:12.5px;}

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* velocity ramp: fast = pale green (free stream), slow = magenta (deep wake).
   Lightness is monotone in speed so it reads as a magnitude, not a category. */
function speedCol(u){ return mix('#cd35c4','#d8f59a',clamp(u,0,1)); }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  AIR                                                                *
 *  Sutherland's law for viscosity, ideal gas for density — the two    *
 *  properties that turn a lattice Reynolds number into a real one.    *
 * ================================================================== */
const R_AIR=287.058;                     // J/(kg K)
function airDensity(P,T){ return P/(R_AIR*T); }          // P in Pa
function airViscosity(T){                // Sutherland, mu_ref at 273.15 K
  const mu0=1.716e-5, T0=273.15, S=110.4;
  return mu0*Math.pow(T/T0,1.5)*(T0+S)/(T+S);
}
function airKinematic(P,T){ return airViscosity(T)/airDensity(P,T); }

/* ================================================================== *
 *  D2Q9 LATTICE                                                       *
 *  The whole scheme rests on these sums, so selfTest checks them:     *
 *    sum w = 1,  sum w c = 0,  sum w c c = c_s^2 I,                   *
 *    sum w c c c = 0,  sum w c c c c = c_s^4 (dd + dd + dd).          *
 *  Those are what make the Chapman-Enskog expansion return            *
 *  Navier-Stokes; without the fourth-moment isotropy it returns an    *
 *  anisotropic equation that is not the physics anyone wants.         *
 * ================================================================== */
const CX=[0, 1, 0,-1, 0, 1,-1,-1, 1];
const CY=[0, 0, 1, 0,-1, 1, 1,-1,-1];
const LW=[4/9, 1/9,1/9,1/9,1/9, 1/36,1/36,1/36,1/36];
const OPP=[0, 3,4,1,2, 7,8,5,6];
const MIRY=[0, 1,4,3,2, 8,7,6,5];        // c_y -> -c_y : specular reflection
const CS2=1/3;

/* node types */
const N_FLUID=0, N_BODY=1, N_WALL=2, N_SLIP=3, N_BELT=4;

/* The magic parameter.  Lambda = (tau_+ - 1/2)(tau_- - 1/2) fixes where the
   bounce-back wall actually is; at 3/16 it sits exactly half a cell outside the
   last fluid node for EVERY viscosity, which is what makes the drag a function
   of the Reynolds number rather than of tau.  See the header. */
let TRT_LAMBDA=3/16;      // `let` only so selfTest can put it back to BGK and
                         // show that the Poiseuille profile then stops being exact

/* Guo's forcing term, split for TRT.  ONE definition, called by the collision
   and asserted by selfTest — a test that retypes the formula tests the typing,
   which is how the first version of this let a wrong prefactor through.
     F_i^+ = w_i [ -3 u.F + 9 (c_i.u)(c_i.F) ]     even in c
     F_i^- = w_i [ 3 c_i.F ]                       odd in c
     F_i   = (1 - om_+/2) F_i^+ + (1 - om_-/2) F_i^-
   The body force is only used by the Poiseuille validation — the tunnel is
   inlet-driven — but that validation is the file's spine, so it is pinned. */
function guoForce(i,ux,uy,gx,taup,taum){
  const cx=CX[i], cy=CY[i];
  const pp=1-0.5/taup, pm=1-0.5/taum;     // the prefactors live HERE, once
  const Fp=LW[i]*(-3*ux+9*(cx*ux+cy*uy)*cx)*gx;
  const Fm=LW[i]*(3*cx)*gx;
  return pp*Fp+pm*Fm;
}

/* nu = c_s^2 (tau - 1/2), inverted both ways.  These two must round-trip. */
function nuOfTau(tau){ return CS2*(tau-0.5); }
function tauOfNu(nu){ return nu/CS2+0.5; }

/* ------------------------------------------------------------------ *
 *  THE VISCOSITY FLOOR — the numbers that decide whether this thing
 *  runs or blows up.
 *
 *  tau = 1/2 + nu_lat/c_s^2 and nu_lat = u_lat L_ref / Re, so pushing
 *  Re up drives tau onto 1/2, where the lattice has no viscosity left
 *  to damp the grid-scale mode and the run diverges.  The first
 *  version of this file computed a floor, returned it in the model —
 *  and then never used it.  The solver was handed whatever tau the
 *  Reynolds slider implied, and that slider goes to 2e6.  Measured on
 *  the default cylinder: Re 300 killed the run (density out of range
 *  at step 1376), Re 1000 at step 416, Re 3000 and above at step 288,
 *  with no warning until Re ~ 2200.  It crashed on an ordinary slider
 *  move, which is exactly what was reported.
 *
 *  The limit is not a viscosity, it is the CELL REYNOLDS NUMBER
 *
 *        Re_cell = u_lat dx / nu_lat = u_lat / nu_lat        (dx = 1)
 *
 *  — how far the flow moves in a cell before viscosity can respond.
 *  Writing it this way matters, because a fixed nu floor would scale
 *  the ceiling with the lattice Mach number and it does not:
 *
 *        Re_max = u_lat L_ref / nu_floor = L_ref * Re_cell_max
 *
 *  the Mach number cancels.  Only a bigger model or a finer grid
 *  raises the ceiling.  Both limits below are MEASURED, on a ladder
 *  run against the worst bodies in the collection until each diverged
 *  — see the selfTest section "the viscosity floor holds", which
 *  reruns the flows that used to die.
 *
 *    RE_CELL_STAB  the most the BARE lattice will take.  Past it the
 *                  flow is under-resolved and the sub-grid model is
 *                  not optional: it is switched on automatically and
 *                  the panel says so, because an under-resolved run
 *                  with no model for what it is missing is not a
 *                  simulation, it is a pending crash.
 *    RE_CELL_LES   the most it will take WITH that model.  This one is
 *                  a hard ceiling: ask for a Reynolds number past it
 *                  and the tunnel runs at the one it can reach and
 *                  prints both, which is what a sub-scale tunnel does
 *                  — none of them reach flight Reynolds number either.
 * ------------------------------------------------------------------ */
const RE_CELL_STAB = 16;
const RE_CELL_LES  = 3200;
/* The model only holds a run up if it is given a coefficient that can.  With
   Cs at the bottom of its slider the sub-grid viscosity is too small to do the
   job — measured, it died at a cell Reynolds number of 100 where the same flow
   at Cs 0.14 survived 6400 — so when the model is what is keeping the run
   alive, Cs is held at the value that was measured to do it.  The panel says
   when that is happening; it is not a silent override. */
const CS_STAB = 0.14;
/* The raw ladders, so a later edit cannot move a floor without the measurement
   moving with it.  Coarse section, 2000-2500 steps, cell Reynolds number
   u_lat/nu_lat.  The bare limit FALLS as the lattice Mach rises, which is why
   there is one constant for the whole slider and it is the worst case. */
const RE_CELL_MEASURED = {
  bare:{survived:18, died:26, atMach:'0.12 and 0.16 (worst of the range)',
        alsoSurvived:'26 at Ma 0.09, 50 at Ma 0.02',
        bodies:'cylinder, plate at 45 deg, rocket, wedge'},
  les:{survived:6400, atCs:0.14,
       bodies:'cylinder, square, and a 10% turbulence grid, at Ma 0.09 and 0.16',
       weakCs:{Cs:0.05, died:100}},
};

/* Smagorinsky closure, derived rather than quoted:
     S_ab   = -Q_ab / (2 rho c_s^2 tau)          (Chapman-Enskog, with tau the
     |S|    = sqrt(2 S_ab S_ab)                   TOTAL relaxation time)
     nu_t   = (Cs Delta)^2 |S|
     nu_tot = c_s^2 (tau - 1/2) = nu_0 + nu_t
   Substituting and clearing the fraction gives a quadratic in tau whose
   positive root is                                                          */
function tauSmagorinsky(tau0,Qabs,rho,Cs){
  if(!(Cs>0)||!(Qabs>0)) return tau0;
  return 0.5*(tau0+Math.sqrt(tau0*tau0+2*Cs*Cs*Qabs/(rho*CS2*CS2)));
}
/* ...and the identity that must hold if the algebra above is right: */
function smagResidual(tau0,Qabs,rho,Cs){
  const tau=tauSmagorinsky(tau0,Qabs,rho,Cs);
  const Smod=Qabs/(2*rho*CS2*tau);       // |S|
  return (nuOfTau(tau)-nuOfTau(tau0)) - Cs*Cs*Smod;
}

/* ================================================================== *
 *  BODIES                                                             *
 *  Every shape is ONE closed outline in body coordinates: x along the *
 *  chord in [0,1], y across it.  The same outline is rasterised onto  *
 *  the lattice and drawn on the canvas, so the picture cannot drift   *
 *  from the thing being solved.                                       *
 * ================================================================== */

/* NACA 4-digit symmetric half-thickness, closed trailing edge.
   Section area = 0.680883333... * t * c^2 exactly (integrates term by term);
   selfTest asserts the numeric quadrature against that rational value. */
function nacaThickness(x,t){
  return 5*t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*x*x*x-0.1036*x*x*x*x);
}
const NACA_AREA_COEF=40853/60000;        // = 0.6808833..., area/(t c^2)

function outlineNaca(t,n){
  const N=n||80, pts=[];
  for(let i=0;i<=N;i++){ const x=0.5*(1-Math.cos(Math.PI*i/N));   // cosine spacing
    pts.push([x, nacaThickness(x,t)]); }
  for(let i=N-1;i>=1;i--){ const x=0.5*(1-Math.cos(Math.PI*i/N));
    pts.push([x,-nacaThickness(x,t)]); }
  return pts;
}
function outlineCircle(n){
  const N=n||96, pts=[];
  for(let i=0;i<N;i++){ const a=TAU*i/N; pts.push([0.5+0.5*Math.cos(a),0.5*Math.sin(a)]); }
  return pts;
}
function outlineSquare(){ return [[0,-0.5],[1,-0.5],[1,0.5],[0,0.5]]; }
/* A plate thinner than a cell rasterises to NOTHING — the cell centres all miss
   it — and a body of zero cells has zero drag and no error message.  The
   thickness is therefore floored at PLATE_MIN_CELLS lattice units, and the
   model view prints the thickness in cells so the floor is visible. */
const PLATE_MIN_CELLS=3;
/* The same argument, one direction over: a car or a wedge sitting on the
   moving belt needs a channel under it that the lattice can actually carry.
   Below this the body shares an edge with the belt and the solver dies —
   measured, at a cell Reynolds number of 50 where a cylinder survives 6400. */
const RIDE_MIN_CELLS=3;
function outlinePlate(t,Lcells){
  const h=Math.max(t,PLATE_MIN_CELLS/Math.max(Lcells||1e9,1))/2;
  return [[0.5-h,-0.5],[0.5+h,-0.5],[0.5+h,0.5],[0.5-h,0.5]];
}

/* A squareback bluff body with a slanted rear — the shape automotive
   aerodynamics argues about.  `slant` is the rear-window angle in degrees from
   the horizontal; the length of the slant is fixed at 0.35 of the height, so
   changing the angle changes the shape the way it does on a real model. */
function outlineWedge(slantDeg,hRatio){
  const H=hRatio||0.45, s=Math.max(0,Math.min(70,slantDeg))*DEG;
  const Ls=0.35*H/Math.max(Math.tan(Math.max(s,1e-3)),1e-3);
  const Lx=Math.min(Ls,0.55);
  const noseR=0.12*H;
  const pts=[];
  for(let i=0;i<=8;i++){ const a=Math.PI/2+Math.PI/2*i/8;   // rounded nose, lower
    pts.push([noseR+noseR*Math.cos(a),-H/2+noseR+ -noseR*Math.sin(a)]); }
  pts.push([1-Lx,-H/2]); pts.push([1,-H/2]);
  pts.push([1,H/2-0.35*H]);
  pts.push([1-Lx,H/2]);
  for(let i=0;i<=8;i++){ const a=0+Math.PI/2*i/8;
    pts.push([noseR-noseR*Math.sin(a),H/2-noseR+noseR*Math.cos(a)]); }
  return pts;
}

/* A car silhouette: a fastback saloon in side view, wheels included, drawn from
   proportions rather than traced from a photograph.  It is a SHAPE, not a
   model of any particular car, and the file never compares its 2-D C_D with a
   published road-car figure — see the header. */
function outlineCar(){
  const P=[
    [0.00,-0.28],[0.02,-0.05],[0.06, 0.02],[0.14, 0.05],[0.26, 0.07],
    [0.36, 0.20],[0.50, 0.30],[0.66, 0.31],[0.80, 0.22],[0.90, 0.10],
    [0.97, 0.04],[1.00,-0.02],[1.00,-0.16],[0.97,-0.28],
    [0.78,-0.28],[0.78,-0.20],[0.62,-0.20],[0.62,-0.28],
    [0.34,-0.28],[0.34,-0.20],[0.18,-0.20],[0.18,-0.28]];
  return P;
}

/* A sounding rocket in side view: tangent-ogive nose, cylindrical body,
   boat-tail, and one pair of fins.  The ogive is the real curve — a circular
   arc tangent to the body at the shoulder — not an ellipse or a cone. */
function outlineRocket(fineness,finSpan){
  const R=0.5/Math.max(fineness,2);              // body radius in chord units
  const Ln=3.2*R;                                // nose length, 3.2 calibres
  const rho=(Ln*Ln+R*R)/(2*R);                   // tangent-ogive radius
  const pts=[], N=22;
  for(let i=0;i<=N;i++){ const x=Ln*i/N;
    pts.push([x, Math.sqrt(rho*rho-(Ln-x)*(Ln-x))+R-rho]); }
  const xf=0.70, cf=0.22, sp=finSpan*R;
  pts.push([xf,R]); pts.push([xf+cf*0.45,R+sp]); pts.push([xf+cf,R+sp]); pts.push([xf+cf,R]);
  pts.push([1.0,R*0.72]);
  pts.push([1.0,-R*0.72]);
  pts.push([xf+cf,-R]); pts.push([xf+cf,-R-sp]); pts.push([xf+cf*0.45,-R-sp]); pts.push([xf,-R]);
  for(let i=N;i>=0;i--){ const x=Ln*i/N;
    pts.push([x,-(Math.sqrt(rho*rho-(Ln-x)*(Ln-x))+R-rho)]); }
  return pts;
}

const BODIES=[
  {id:'cylinder',name:'circular cylinder',refBy:'height',
   outline:(st,Lc)=>outlineCircle(96), bluff:true,
   note:'the one 2-D shape with a settled literature — the sweep view compares against it'},
  {id:'square',name:'square section',refBy:'height',
   outline:(st,Lc)=>outlineSquare(), bluff:true,
   note:'fixed separation at the sharp corners: no drag crisis, no Reynolds dependence to speak of'},
  {id:'plate',name:'flat plate',refBy:'height',
   outline:(st,Lc)=>outlinePlate(0.04,Lc), bluff:true,
   note:'normal to the flow it is the canonical bluff body; rotate it and the drag collapses'},
  {id:'naca',name:'NACA section',refBy:'chord',
   outline:(st,Lc)=>outlineNaca(st.thick,80), bluff:false,
   note:'a streamlined section: attached flow, small drag, lift that grows with angle until it stalls'},
  {id:'car',name:'car silhouette',refBy:'height',
   outline:(st,Lc)=>outlineCar(), bluff:true,
   note:'a 2-D side section of a car-like shape — NOT a car, see the model view. Try it over a <b>moving belt</b>: a stationary tunnel floor grows a boundary layer the road never has, and the underbody flow is wrong without it'},
  {id:'wedge',name:'slant-back body',refBy:'height',
   outline:(st,Lc)=>outlineWedge(st.slant,0.45), bluff:true,
   note:'the rear slant angle is the parameter automotive aerodynamics argues about — watch where the flow lets go of the slant as you open it'},
  {id:'rocket',name:'rocket',refBy:'chord',
   outline:(st,Lc)=>outlineRocket(st.fineness,st.finSpan), bluff:false,
   note:'tangent-ogive nose and fins, in side view — a real rocket is axisymmetric and this is not'},
];
function bodyById(id){ return BODIES.find(b=>b.id===id)||BODIES[0]; }

/* place the outline in lattice coordinates: scale to `L` cells along the chord,
   rotate by the angle of attack, put the reference point at (x0,y0). */
function placeOutline(pts,L,alphaDeg,x0,y0){
  const c=Math.cos(-alphaDeg*DEG), s=Math.sin(-alphaDeg*DEG), out=[];
  for(const p of pts){
    const X=(p[0]-0.25)*L, Y=p[1]*L;      // rotate about the quarter-chord
    out.push([x0+X*c-Y*s, y0+X*s+Y*c]);
  }
  return out;
}
function polyBounds(poly){
  let x0=1e30,x1=-1e30,y0=1e30,y1=-1e30;
  for(const p of poly){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0];
                        if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  return {x0,x1,y0,y1,w:x1-x0,h:y1-y0};
}
/* ray casting; the half-open convention keeps a vertex exactly on a scanline
   from being counted twice, which otherwise punches single-cell holes in a
   rasterised body and leaks flow through it. */
function pointInPoly(poly,x,y){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}
function polyArea(poly){
  let a=0;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++)
    a+=(poly[j][0]+poly[i][0])*(poly[j][1]-poly[i][1]);
  return Math.abs(a)/2;
}

/* ================================================================== *
 *  SYNTHETIC FREESTREAM TURBULENCE                                    *
 *  What a turbulence grid in the settling chamber puts into the flow. *
 *  Built from a STREAM FUNCTION, so the injected field is             *
 *  divergence-free by construction rather than by accident:           *
 *      psi = sum_m A_m cos(kx_m x + ky_m y + phi_m)                   *
 *      u = ( dpsi/dy , -dpsi/dx )                                     *
 *  and Taylor's frozen hypothesis carries the plane through the modes *
 *  at the mean speed, x -> -U t, which is exactly how a grid's wake    *
 *  is convected past the model.                                       *
 *  Seeded, therefore reproducible, therefore testable: selfTest        *
 *  measures the rms it actually produces against the Tu asked for.    *
 * ================================================================== */
function mulberry32(a){                  // small, fast, well-mixed 32-bit PRNG
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function makeTurbulence(seed,nModes,Lint,ny){
  const rnd=mulberry32(seed>>>0), M=Math.max(1,nModes|0), modes=[];
  const kMin=TAU/Math.max(Lint,2), kMax=TAU/6;         // 6 cells: below that the
  let norm=0;                                          // lattice cannot carry it
  for(let m=0;m<M;m++){
    const t=M>1?m/(M-1):0;
    const k=kMin*Math.pow(kMax/kMin,t);
    const th=TAU*rnd();
    /* E(k) ~ k^-5/3 in the inertial range => velocity amplitude ~ k^-1/3 per
       octave; the modes are log-spaced so each carries one octave's share. */
    const amp=Math.pow(k/kMin,-1/3);
    modes.push({kx:k*Math.cos(th), ky:k*Math.sin(th), a:amp, ph:TAU*rnd()});
    norm+=0.5*amp*amp*k*k;                              // <u'^2> for random phase
  }
  const scale=1/Math.sqrt(Math.max(norm,1e-30));
  for(const m of modes) m.a*=scale;      // now rms(u') = 1 per unit amplitude
  return {modes,
    /* velocity fluctuation at transverse position y, time t, mean speed U */
    at(y,t,U,out){
      let ux=0, uy=0;
      for(const m of modes){
        const ph=m.kx*(-U*t)+m.ky*y+m.ph;
        const s=Math.sin(ph);
        ux+= -m.a*m.ky*s;
        uy+=  m.a*m.kx*s;
      }
      out[0]=ux; out[1]=uy; return out;
    }};
}

/* ================================================================== *
 *  STREAMLINES — the instantaneous picture, which is NOT the smoke.   *
 *                                                                     *
 *  These three curves are the same curve only in steady flow, and the *
 *  whole point of a shedding wake is that it is not steady:           *
 *    STREAMLINE  — tangent to the velocity field at ONE instant.      *
 *    PATHLINE    — where one particle actually goes over time.        *
 *    STREAKLINE  — the locus of particles released from one point;    *
 *                  this is what the smoke rake draws, and what a real *
 *                  tunnel's smoke actually shows you.                 *
 *  The smoke already gives the streaklines.  What it cannot show is   *
 *  the instantaneous topology -- above all the CLOSED recirculation   *
 *  bubble behind a bluff body, whose boundary is a streamline and     *
 *  which no streakline ever traces out because tracers do not enter   *
 *  it.  That is what these are for.                                   *
 *                                                                     *
 *  Integrated on the UNIT tangent by midpoint RK2, so the arc-length  *
 *  step is uniform and a line is drawn with the same resolution in    *
 *  the fast freestream and in the nearly-stagnant bubble.  Integrating *
 *  on u itself instead puts almost every sample in the freestream and *
 *  walks straight through the slow interior of the vortex, which is   *
 *  precisely the region the line exists to resolve.                   *
 * ================================================================== */
function fluidAt(S,x,y){
  const xi=Math.round(x), yi=Math.round(y);
  if(xi<0||xi>S.nx-1||yi<0||yi>S.ny-1) return false;
  return S.node[xi*S.ny+yi]===N_FLUID;
}
function streamline(S,px,py,sign,ds,maxPts){
  const pts=[];
  let x=px, y=py;
  if(!fluidAt(S,x,y)) return pts;
  pts.push([x,y]);
  for(let n=0;n<maxPts;n++){
    const u=S.sample(S.ux,x,y), v=S.sample(S.uy,x,y);
    const m=Math.sqrt(u*u+v*v);
    if(!(m>1e-12)) break;                       // stagnation: the line ends
    const hx=x+sign*0.5*ds*u/m, hy=y+sign*0.5*ds*v/m;
    if(!fluidAt(S,hx,hy)) break;
    const u2=S.sample(S.ux,hx,hy), v2=S.sample(S.uy,hx,hy);
    const m2=Math.sqrt(u2*u2+v2*v2);
    if(!(m2>1e-12)) break;
    x+=sign*ds*u2/m2; y+=sign*ds*v2/m2;
    if(x<1||x>S.nx-2||y<1||y>S.ny-2) break;
    if(!fluidAt(S,x,y)) break;
    pts.push([x,y]);
  }
  return pts;
}
/* Seeds: a comb across the inlet for the through-flow, plus a deliberate
   cluster in the near wake.  Without the second group the bubble is empty --
   every inlet streamline sweeps past the body and none of them ever enters a
   closed recirculation, which is the definition of one. */
function streamSeeds(S,M){
  const seeds=[];
  const ny=S.ny;
  for(let i=0;i<17;i++) seeds.push([2.5,2+(ny-4)*(i+0.5)/17]);
  const D=Math.max(M.href,3);
  const xr=M.bb.x1, yc=0.5*(M.bb.y0+M.bb.y1);
  for(let i=0;i<7;i++){
    const a=TAU*i/7;
    seeds.push([xr+0.9*D+0.55*D*Math.cos(a), yc+0.55*D*Math.sin(a)]);
  }
  for(let i=0;i<5;i++) seeds.push([xr+0.35*D+0.5*D*i, yc]);
  return seeds;
}

/* ================================================================== *
 *  THE TRIP — why you do not have to wait three minutes for a wake.   *
 *                                                                     *
 *  A cylinder in a uniform stream at Re = 100 is LINEARLY UNSTABLE:    *
 *  the symmetric steady wake is a solution, it is just not a stable    *
 *  one, and any asymmetry grows exponentially until it saturates into  *
 *  the Karman street.  Started from a perfectly uniform field the only *
 *  asymmetry available is floating-point round-off, so the instability *
 *  has to climb about fourteen decades before anything is visible.     *
 *  Measured here, at the default settings: the growth rate is 0.18 per *
 *  convective time, the lift amplitude was still only 0.08 against a   *
 *  saturated 0.28-0.38 after 69 convective times, and reaching the     *
 *  limit cycle from round-off takes of order 170 -- minutes of         *
 *  watching a picture that looks like nothing is happening.  Seeding   *
 *  the asymmetry at 5% instead of 1e-14 leaves ln(6)/0.18 ~ 10         *
 *  convective times of growth, which is seconds.                      *
 *                                                                     *
 *  WHAT THIS DOES AND DOES NOT CHANGE.  It is applied ONLY to the      *
 *  INITIAL CONDITION.  No term is added to the equations, so for every *
 *  t > 0 the solver being integrated is bit-for-bit the one that was   *
 *  validated against the literature.  A limit cycle is an attractor:   *
 *  it does not remember which initial condition reached it, so C_D,    *
 *  C_L and the Strouhal number are unchanged and the only thing that   *
 *  moves is how long the transient takes.  That is asserted rather     *
 *  than argued -- selfTest runs a steady Re 40 cylinder from a tripped *
 *  and an untripped start and requires the converged drag and bubble   *
 *  length to agree to a tenth of a percent.                            *
 *                                                                     *
 *  The perturbation is a single vortex blob sitting in the near wake,  *
 *  built as the CURL OF A STREAM FUNCTION so it is divergence-free by  *
 *  construction and injects no spurious acoustic pulse:                *
 *                                                                     *
 *     psi = C exp(-s^2 - t^2),   s = (x-x0)/Lx,  t = (y-yc)/Ly         *
 *     u' =  d psi/dy = -2C t/Ly exp(...)                               *
 *     v' = -d psi/dx = +2C s/Lx exp(...)                               *
 *                                                                     *
 *  C is fixed so that max|v'| is exactly `amp` times the freestream:   *
 *  along y = yc the transverse component peaks at s = 1/sqrt2, where   *
 *  |v'| = C sqrt2 e^(-1/2) / Lx, so C = amp U Lx / (sqrt2 e^(-1/2)).   *
 *  Both the realised peak and the discrete divergence are measured in  *
 *  selfTest rather than taken on trust.                                *
 * ================================================================== */
const TRIP_PEAK=Math.SQRT2*Math.exp(-0.5);      // 0.857763..., see above
function makeTrip(M,amp){
  /* the blob sits just behind the body, on its centreline, and is scaled by
     the reference length so it is the same shape for a 9-cell cylinder and a
     40-cell one */
  const D=Math.max(M.href,3);
  const x0=M.bb.x1+0.75*D, yc=0.5*(M.bb.y0+M.bb.y1);
  const Lx=1.5*D, Ly=0.75*D;
  const C=amp*M.uLat*Lx/TRIP_PEAK;
  return {
    x0,yc,Lx,Ly,C,amp,
    /* the velocity perturbation at a lattice point, exactly the curl above */
    at(x,y,out){
      const s=(x-x0)/Lx, t=(y-yc)/Ly;
      const e=Math.exp(-s*s-t*t);
      out[0]=-2*C*t/Ly*e;
      out[1]= 2*C*s/Lx*e;
      return out;
    },
  };
}
/* The initial condition the solver is actually handed: freestream plus the
   blob, at rest density.  `trip` may be null, which gives back exactly the
   uniform field setEquilibrium(1,U,0) produces -- so "trip off" is not a
   different code path, it is this one with a zero perturbation. */
function tripIC(M,trip){
  const U=M.uLat, o=[0,0];
  return function(x,y,dst){
    dst[0]=1;
    if(!trip){ dst[1]=U; dst[2]=0; return dst; }
    trip.at(x,y,o);
    dst[1]=U+o[0]; dst[2]=o[1];
    return dst;
  };
}

/* ================================================================== *
 *  THE SOLVER                                                         *
 * ================================================================== */
function makeSolver(nx,ny){
  const N=nx*ny;
  const S={
    nx,ny,N,
    f:new Float64Array(9*N), g:new Float64Array(9*N),
    rho:new Float64Array(N), ux:new Float64Array(N), uy:new Float64Array(N),
    node:new Uint8Array(N),
    tau:0.6, Cs:0, uw:0, gx:0, tauLocal:null,
    tauMax:0.6, tauSum:0,
    Fx:0, Fy:0,
    diverged:false, divReason:'',
    links:new Int32Array(0),             // [fluidIndex, i] pairs on body links
    wlinks:new Int32Array(0),            // [fluidIndex, i, wallIndex, type, x]
    wallFx:null,                         // streamwise wall force, per column
    steps:0,
  };

  /* per-node initial condition: fn(x,y) returns [rho,ux,uy].  Used by the
     Taylor-Green and shear-wave tests, which need a field, not a constant. */
  S.initFrom=function(fn){
    const o=[1,0,0];
    for(let x=0;x<nx;x++) for(let y=0;y<ny;y++){
      const k=x*ny+y, v=fn(x,y,o)||o;
      const r=v[0], X=v[1], Y=v[2], usq=1.5*(X*X+Y*Y);
      for(let i=0;i<9;i++){
        const cu=3*(CX[i]*X+CY[i]*Y);
        S.f[i*N+k]=LW[i]*r*(1+cu+0.5*cu*cu-usq);
      }
      S.rho[k]=r; S.ux[k]=X; S.uy[k]=Y;
    }
    S.steps=0;
  };
  S.enableTauField=function(){ if(!S.tauLocal) S.tauLocal=new Float64Array(N); };

  S.setEquilibrium=function(rho0,ux0,uy0){
    for(let k=0;k<N;k++){
      const r=rho0, X=ux0, Y=uy0, usq=1.5*(X*X+Y*Y);
      for(let i=0;i<9;i++){
        const cu=3*(CX[i]*X+CY[i]*Y);
        S.f[i*N+k]=LW[i]*r*(1+cu+0.5*cu*cu-usq);
      }
      S.rho[k]=r; S.ux[k]=X; S.uy[k]=Y;
    }
    S.steps=0;
  };

  /* the body links, precomputed: every (fluid node, direction) whose neighbour
     is a body node.  The momentum-exchange force is a sum over exactly these. */
  S.buildLinks=function(){
    const acc=[], wacc=[];
    for(let x=0;x<nx;x++) for(let y=0;y<ny;y++){
      const k=x*ny+y;
      if(S.node[k]!==N_FLUID) continue;
      for(let i=1;i<9;i++){
        const xs=(x+CX[i]+nx)%nx, ys=(y+CY[i]+ny)%ny;
        const nk=xs*ny+ys, t=S.node[nk];
        if(t===N_BODY) acc.push(k,i);
        else if(t!==N_FLUID) wacc.push(k,i,nk,t,x);   // wall / slip / belt
      }
    }
    S.links=Int32Array.from(acc);
    S.wlinks=Int32Array.from(wacc);
    S.wallFx=new Float64Array(nx);
  };

  /* Recompute the macroscopic fields WITHOUT colliding.  collide() does both,
     which is what the time step wants, but a test that reads rho after a run
     must not advance the state to do it — and tau_max belongs to the step that
     produced it, not to an extra collision afterwards. */
  S.macro=function(){
    const f=S.f, node=S.node;
    for(let k=0;k<N;k++){
      let r=0;
      for(let i=0;i<9;i++) r+=f[i*N+k];
      S.rho[k]=r;
      if(node[k]!==N_FLUID){ S.ux[k]=0; S.uy[k]=0; continue; }
      let X=(f[N+k]+f[5*N+k]+f[8*N+k]-f[3*N+k]-f[6*N+k]-f[7*N+k])/r;
      const Y=(f[2*N+k]+f[5*N+k]+f[6*N+k]-f[4*N+k]-f[7*N+k]-f[8*N+k])/r;
      if(S.gx) X+=0.5*S.gx/r;
      S.ux[k]=X; S.uy[k]=Y;
    }
  };

  /* ---- one time step: macro+collide, reflect+force, stream, boundaries ---- */
  S.collide=function(){
    const f=S.f, node=S.node, rho=S.rho, ux=S.ux, uy=S.uy;
    const tau0=S.tau, Cs=S.Cs, gx=S.gx;
    let tauMax=0, tauSum=0, nFluid=0;
    for(let k=0;k<N;k++){
      if(node[k]!==N_FLUID){ rho[k]=1; ux[k]=0; uy[k]=0; continue; }
      const f0=f[k],       f1=f[N+k],   f2=f[2*N+k], f3=f[3*N+k], f4=f[4*N+k],
            f5=f[5*N+k],   f6=f[6*N+k], f7=f[7*N+k], f8=f[8*N+k];
      const r=f0+f1+f2+f3+f4+f5+f6+f7+f8;
      let X=(f1+f5+f8-f3-f6-f7)/r, Y=(f2+f5+f6-f4-f7-f8)/r;
      if(gx) X+=0.5*gx/r;                       // Guo: half the force in u
      rho[k]=r; ux[k]=X; uy[k]=Y;

      const usq=1.5*(X*X+Y*Y);
      const e0=LW[0]*r*(1-usq);
      const cu1=3*X,   e1=LW[1]*r*(1+cu1+0.5*cu1*cu1-usq);
      const cu2=3*Y,   e2=LW[2]*r*(1+cu2+0.5*cu2*cu2-usq);
      const cu3=-3*X,  e3=LW[3]*r*(1+cu3+0.5*cu3*cu3-usq);
      const cu4=-3*Y,  e4=LW[4]*r*(1+cu4+0.5*cu4*cu4-usq);
      const cu5=3*(X+Y),  e5=LW[5]*r*(1+cu5+0.5*cu5*cu5-usq);
      const cu6=3*(-X+Y), e6=LW[6]*r*(1+cu6+0.5*cu6*cu6-usq);
      const cu7=3*(-X-Y), e7=LW[7]*r*(1+cu7+0.5*cu7*cu7-usq);
      const cu8=3*(X-Y),  e8=LW[8]*r*(1+cu8+0.5*cu8*cu8-usq);

      let taup=tau0;
      if(Cs>0){
        /* |Q| from the non-equilibrium part; c_x c_x etc. are 0 or 1 here */
        const n1=f1-e1,n2=f2-e2,n3=f3-e3,n4=f4-e4,n5=f5-e5,n6=f6-e6,n7=f7-e7,n8=f8-e8;
        const Qxx=n1+n3+n5+n6+n7+n8;
        const Qyy=n2+n4+n5+n6+n7+n8;
        const Qxy=n5-n6+n7-n8;
        const Qabs=Math.sqrt(2*(Qxx*Qxx+2*Qxy*Qxy+Qyy*Qyy));
        taup=0.5*(tau0+Math.sqrt(tau0*tau0+2*Cs*Cs*Qabs/(r*CS2*CS2)));
      }
      if(taup>tauMax) tauMax=taup;
      tauSum+=taup; nFluid++;
      if(S.tauLocal) S.tauLocal[k]=taup;
      const taum=0.5+TRT_LAMBDA/(taup-0.5);
      const op=1/taup, om=1/taum;

      /* TRT: relax the symmetric and antisymmetric parts of each pair
         separately.  op sets the viscosity; om is fixed by Lambda.
         Written out four times rather than through a helper: a closure
         allocated per cell in the hot loop costs more than the collision. */
      f[k]=f0-op*(f0-e0);
      let sp,sm,dp,dm;
      sp=0.5*(f1+f3)-0.5*(e1+e3); sm=0.5*(f1-f3)-0.5*(e1-e3);
      dp=op*sp; dm=om*sm;  f[N+k]=f1-dp-dm;   f[3*N+k]=f3-dp+dm;
      sp=0.5*(f2+f4)-0.5*(e2+e4); sm=0.5*(f2-f4)-0.5*(e2-e4);
      dp=op*sp; dm=om*sm;  f[2*N+k]=f2-dp-dm; f[4*N+k]=f4-dp+dm;
      sp=0.5*(f5+f7)-0.5*(e5+e7); sm=0.5*(f5-f7)-0.5*(e5-e7);
      dp=op*sp; dm=om*sm;  f[5*N+k]=f5-dp-dm; f[7*N+k]=f7-dp+dm;
      sp=0.5*(f6+f8)-0.5*(e6+e8); sm=0.5*(f6-f8)-0.5*(e6-e8);
      dp=op*sp; dm=om*sm;  f[6*N+k]=f6-dp-dm; f[8*N+k]=f8-dp+dm;

      if(gx){
        for(let i=0;i<9;i++) f[i*N+k]+=guoForce(i,X,Y,gx,taup,taum);
      }
    }
    S.tauMax=tauMax||tau0;
    S.tauAvg=nFluid?tauSum/nFluid:tau0;
  };

  S.reflect=function(){
    const f=S.f, node=S.node, L=S.links, rho=S.rho;
    /* force first: it needs the POST-COLLISION populations on the fluid side */
    let Fx=0, Fy=0;
    for(let t=0;t<L.length;t+=2){
      const k=L[t], i=L[t+1], v=f[i*N+k];
      Fx+=2*CX[i]*v; Fy+=2*CY[i]*v;
    }
    S.Fx=Fx; S.Fy=Fy;

    /* The same momentum exchange on the TUNNEL WALLS, kept per column.
       A control volume closed on the tunnel walls carries their friction, and
       without this the wake rake hands the wall drag to the model: at the
       default settings it read C_D 3.47 against a balance reading of 1.57.
       Streamwise momentum delivered to the wall per link, by reflection rule:
         no-slip   2 c_x f
         free-slip 0            (specular reflection preserves c_x exactly)
         belt      2 c_x f + 2 w_i rho c_x^2 u_w / c_s^2
       so the slip case is a real zero, not a small number. */
    const WL=S.wlinks, wf=S.wallFx;
    if(wf){
      wf.fill(0);
      for(let t=0;t<WL.length;t+=5){
        const k=WL[t], i=WL[t+1], nk=WL[t+2], ty=WL[t+3], xc=WL[t+4];
        if(ty===N_SLIP) continue;
        const v=f[i*N+k];
        let d=2*CX[i]*v;
        if(ty===N_BELT){
          /* the same rho_w as the reflection uses, for the same reason — and
             here it is simply the fluid node's own density, since k IS the
             fluid side of the link */
          d+=2*LW[i]*rho[k]*CX[i]*CX[i]*S.uw/CS2;
        }
        wf[xc]+=d;
      }
    }
    /* then the reflections, out of a snapshot so the swap is simultaneous */
    for(let k=0;k<N;k++){
      const t=node[k];
      if(t===N_FLUID) continue;
      const a0=f[k],a1=f[N+k],a2=f[2*N+k],a3=f[3*N+k],a4=f[4*N+k],
            a5=f[5*N+k],a6=f[6*N+k],a7=f[7*N+k],a8=f[8*N+k];
      if(t===N_BODY||t===N_WALL){
        f[N+k]=a3; f[3*N+k]=a1; f[2*N+k]=a4; f[4*N+k]=a2;
        f[5*N+k]=a7; f[7*N+k]=a5; f[6*N+k]=a8; f[8*N+k]=a6;
      } else if(t===N_SLIP){
        f[2*N+k]=a4; f[4*N+k]=a2; f[5*N+k]=a8; f[8*N+k]=a5;
        f[6*N+k]=a7; f[7*N+k]=a6;
      } else if(t===N_BELT){
        /* rho_w IS THE DENSITY OF THE FLUID AT THE WALL, and not the sum of
           the populations parked on the solid node.  Those are not the same
           number, and the difference is what made the moving belt blow up.

           Solid nodes never collide, so nothing on them ever relaxes toward
           equilibrium.  Streaming wraps in y, so the bottom row and the top
           row trade populations: what leaves the belt going down arrives in
           the roof row, bounces, and comes back.  A static wall is a pure
           permutation and that loop is harmless — which is why the comment
           on stream() said the wrap was safe, and why it was safe for eight
           of the nine directions.  A BELT is not a permutation: it adds
           momentum on every pass, with no dissipation anywhere in the loop,
           and the sum picked that up and fed it back into the injection.

           Measured, empty test section, no body at all: identical to the
           closed-wall control (u_max 1.137 U) out to step 1200, then the peak
           jumps into the first fluid row above the belt and runs away —
           1.63, 3.54, 10.26 U at steps 1600/1800/2000.  Independent of
           viscosity, as a loop through nodes that never collide must be: it
           died just as fast at a cell Reynolds number of 2 (tau = 0.578) as
           at 16.  Reading rho off the adjacent fluid closes the path. */
        const above=k+1;                          // the belt is the y = 0 row
        const r=(node[above]===N_FLUID)?rho[above]:1, uw=S.uw;
        const add=i=>2*LW[i]*r*(CX[i]*uw)/CS2;   // c_x is 0 for i = 2 and 4
        f[N+k]=a3+add(1); f[3*N+k]=a1+add(3);
        f[2*N+k]=a4; f[4*N+k]=a2;
        f[5*N+k]=a7+add(5); f[7*N+k]=a5+add(7);
        f[6*N+k]=a8+add(6); f[8*N+k]=a6+add(8);
      }
    }
  };

  /* Streaming wraps in both directions.  The x-wrap is harmless because the
     inlet and outlet columns are overwritten immediately afterwards.  The
     y-wrap trades populations between the bottom row and the top row, and
     that is harmless ONLY because both are solid and their populations reach
     the fluid through the reflection, which rebuilds every outgoing
     population from an incoming one.  It is not harmless for anything that
     ADDS to the reflection: see the rho_w note on the belt above, where
     reading the wall density off this circulating pool instead of off the
     fluid turned the wrap into an undamped momentum loop. */
  S.stream=function(){
    const f=S.f, g=S.g;
    for(let i=0;i<9;i++){
      const cx=CX[i], cy=CY[i], base=i*N;
      for(let x=0;x<nx;x++){
        const xs=(x+cx+nx)%nx;
        const src=base+x*ny, dst=base+xs*ny;
        if(cy===0){ for(let y=0;y<ny;y++) g[dst+y]=f[src+y]; }
        else if(cy===1){ g[dst]=f[src+ny-1];
                         for(let y=1;y<ny;y++) g[dst+y]=f[src+y-1]; }
        else { for(let y=0;y<ny-1;y++) g[dst+y]=f[src+y+1];
               g[dst+ny-1]=f[src]; }
      }
    }
    const t=S.f; S.f=g; S.g=t;
  };

  /* Zou/He velocity inlet.  rho is not prescribed — it is whatever the known
     populations plus the wanted velocity imply — and the resulting node
     reproduces (ux,uy) exactly, which selfTest checks to 1e-14. */
  S.inlet=function(uProf,vProf){
    const f=S.f, node=S.node;
    for(let y=0;y<ny;y++){
      const k=y;                                   // x = 0
      if(node[k]!==N_FLUID) continue;
      const ux=uProf[y], uy=vProf?vProf[y]:0;
      const f0=f[k], f2=f[2*N+k], f3=f[3*N+k], f4=f[4*N+k],
            f6=f[6*N+k], f7=f[7*N+k];
      const r=(f0+f2+f4+2*(f3+f6+f7))/(1-ux);
      const f1=f3+(2/3)*r*ux;
      const rest=r-(f0+f1+f2+f3+f4+f6+f7);         // = f5 + f8
      const diff=r*uy-f2-f6+f4+f7;                 // = f5 - f8
      f[N+k]=f1; f[5*N+k]=0.5*(rest+diff); f[8*N+k]=0.5*(rest-diff);
    }
  };
  S.outlet=function(){
    const f=S.f, o=(nx-1)*ny, p=(nx-2)*ny;
    for(const i of [3,6,7]){ const b=i*N;
      for(let y=0;y<ny;y++) f[b+o+y]=f[b+p+y]; }
  };

  /* Lattice Boltzmann goes unstable when tau approaches 1/2 — the viscosity
     floor — and a body corner one cell off a moving wall will find it.  A
     solver that keeps running on NaN paints a screen of garbage and reports a
     drag coefficient of NaN; this one stops and says which limit it hit.
     Checked every few dozen steps, because an O(N) scan every step is not
     free and divergence takes more than one step to develop. */
  S.check=function(){
    const lim=0.5;                       // well under c_s = 0.577
    for(let k=0;k<N;k++){
      if(S.node[k]!==N_FLUID) continue;
      const r=S.rho[k], a=S.ux[k], b=S.uy[k];
      if(!(r>0.2&&r<5)){ S.diverged=true; S.divReason='density'; return true; }
      if(!(a*a+b*b<lim*lim)){ S.diverged=true; S.divReason='velocity'; return true; }
    }
    return false;
  };

  S.step=function(uProf,vProf){
    S.collide(); S.reflect(); S.stream();
    if(uProf){ S.inlet(uProf,vProf); S.outlet(); }
    S.steps++;
  };

  /* ---------------- diagnostics ---------------- */
  S.vorticity=function(x,y){
    /* central differences; one-sided at the edges.  omega = dv/dx - du/dy */
    const xm=Math.max(x-1,0), xp=Math.min(x+1,nx-1);
    const ym=Math.max(y-1,0), yp=Math.min(y+1,ny-1);
    const dvdx=(S.uy[xp*ny+y]-S.uy[xm*ny+y])/Math.max(xp-xm,1);
    const dudy=(S.ux[x*ny+yp]-S.ux[x*ny+ym])/Math.max(yp-ym,1);
    return dvdx-dudy;
  };
  /* The full velocity gradient, on the same stencil vorticity uses, so the two
     cannot disagree about what a derivative is.  out = [du/dx, du/dy, dv/dx,
     dv/dy].  Body and wall nodes carry u = 0, so a stencil that reaches into
     one reads the no-slip condition rather than garbage -- which is what makes
     the shear layer show up at the surface at all. */
  S.velGrad=function(x,y,out){
    const xm=Math.max(x-1,0), xp=Math.min(x+1,nx-1);
    const ym=Math.max(y-1,0), yp=Math.min(y+1,ny-1);
    const hx=Math.max(xp-xm,1), hy=Math.max(yp-ym,1);
    out[0]=(S.ux[xp*ny+y]-S.ux[xm*ny+y])/hx;
    out[1]=(S.ux[x*ny+yp]-S.ux[x*ny+ym])/hy;
    out[2]=(S.uy[xp*ny+y]-S.uy[xm*ny+y])/hx;
    out[3]=(S.uy[x*ny+yp]-S.uy[x*ny+ym])/hy;
    return out;
  };
  /* THE Q-CRITERION, and why vorticity alone is not a vortex.
     Vorticity cannot tell a rotating core from a straight shear layer: plane
     shear u = (gamma*y, 0) has omega = -gamma everywhere and no vortex
     anywhere, which is exactly why the boundary layer on the tunnel wall
     paints as brightly as the vortex street does.  Hunt, Wray & Moin's Q is
     the second invariant of the velocity gradient,

         Q  =  1/2 ( |Omega|^2 - |S|^2 ),

     with Omega and S the antisymmetric and symmetric parts of grad u and
     |A|^2 = A_ij A_ij.  Q > 0 is where rotation beats strain -- a core.
     In two dimensions Omega has the single component -omega/2, so
     |Omega|^2 = omega^2/2, and

         Q  =  omega^2/4  -  1/2 (S_xx^2 + S_yy^2)  -  S_xy^2.

     The INCOMPRESSIBLE shortcut S_yy = -S_xx would collapse the middle term to
     S_xx^2, and it is deliberately not taken: lattice Boltzmann is only weakly
     compressible, div u is O(Ma^2) rather than 0, and near the body -- which is
     precisely where the answer matters -- that is not a rounding error.  The
     general form costs one multiply.
     Exact values it is asserted against, all three independent of the lattice:
       solid-body rotation (-Wy, Wx):  S = 0,        Q = +W^2
       plane shear        (gamma*y,0):  omega^2/4 = S_xy^2, Q = 0 exactly
       plane strain      (a*x, -a*y):  omega = 0,    Q = -a^2                */
  const _vg=[0,0,0,0];
  S.qcrit=function(x,y){
    S.velGrad(x,y,_vg);
    const dudx=_vg[0], dudy=_vg[1], dvdx=_vg[2], dvdy=_vg[3];
    const om=dvdx-dudy, sxy=0.5*(dudy+dvdx);
    return 0.25*om*om-0.5*(dudx*dudx+dvdy*dvdy)-sxy*sxy;
  };
  /* bilinear sample of any lattice field.  Solid nodes carry u = 0, so a
     stencil straddling the surface interpolates towards no-slip rather than
     off the edge of the array. */
  S.sample=function(arr,x,y){
    const x0=Math.floor(x), y0=Math.floor(y);
    const fx=x-x0, fy=y-y0;
    const xa=clamp(x0,0,nx-1), xb=clamp(x0+1,0,nx-1);
    const ya=clamp(y0,0,ny-1), yb=clamp(y0+1,0,ny-1);
    return arr[xa*ny+ya]*(1-fx)*(1-fy)+arr[xb*ny+ya]*fx*(1-fy)
          +arr[xa*ny+yb]*(1-fx)*fy   +arr[xb*ny+yb]*fx*fy;
  };

  /* THE RECIRCULATION BUBBLE.
     L_s is the classical quantity: the distance from the BACK OF THE BODY to
     the point on the wake centreline where the streamwise velocity changes
     sign back to positive -- the closed end of the standing pair of vortices.
     The literature quotes it as L_s/D and it only exists while the wake is
     steady; once the street sheds there is no closed bubble to measure and
     this returns nothing rather than a number that means nothing.

     THE HALF-CELL.  `xRear` is the SURFACE, not the last solid node.  Half-way
     bounce-back puts the no-slip wall half a cell outside the outermost body
     node, and measuring from the node instead would bias every L_s by 0.5/D --
     3% at D = 16, which is the size of the discrepancy the file is trying to
     resolve.  The caller passes the surface and this asserts nothing about it.
     The crossing itself is linearly interpolated, so the answer is not
     quantised to the lattice. */
  S.wakeBubble=function(xRear,yc){
    const y=Math.round(yc);
    let prev=NaN, prevX=NaN, sawNeg=false;
    for(let x=Math.max(1,Math.floor(xRear));x<nx-1;x++){
      const k=x*ny+y;
      if(S.node[k]!==N_FLUID){ if(sawNeg) break; continue; }
      if(x<xRear) continue;
      const u=S.ux[k];
      if(u<0) sawNeg=true;
      else if(sawNeg&&isFinite(prev)&&prev<0){
        const f=prev/(prev-u);                    // zero crossing, prevX -> x
        const xz=prevX+f*(x-prevX);
        return {ls:xz-xRear, x:xz, found:true};
      }
      prev=u; prevX=x;
    }
    return {ls:NaN, x:NaN, found:false};
  };

  /* THE SEPARATION ANGLE, for a circular cylinder.
     Parametrise the surface by phi measured FROM THE FRONT STAGNATION POINT
     along the upper side: p(phi) = c + r(-cos phi, sin phi), so phi = 0 is the
     nose, 90 deg the shoulder and 180 deg the base.  The tangent in the
     direction of increasing phi is (sin phi, cos phi); attached flow
     accelerating around the shoulder has u_theta > 0, and SEPARATION is where
     it first goes negative.  The literature (and Cui et al. Table 1, which
     this file's anchors come from) quotes the angle FROM THE BASE, so the
     returned value is 180 - phi_sep.

     WHY IT IS SAMPLED OFF THE WALL.  The wall shear itself lives inside the
     bounce-back layer, where the staircase makes it meaningless at these
     resolutions.  u_theta is read on a ring `dr` cells outside the nominal
     radius instead.  That is NOT the wall shear, and the location of its sign
     change approaches the true separation point only as the body is resolved:
     the error is O(1/D), the same 1/D that governs everything else here, and
     it is measured in selfTest across D rather than assumed small. */
  S.separationAngle=function(cx,cy,R,dr){
    const rr=R+(dr===undefined?1.2:dr);
    const N=540;
    let prev=NaN;
    for(let i=0;i<=N;i++){
      const phi=Math.PI*i/N;
      const c=Math.cos(phi), s=Math.sin(phi);
      const px=cx-rr*c, py=cy+rr*s;
      if(px<1||px>nx-2||py<1||py>ny-2) return NaN;
      const ut=S.sample(S.ux,px,py)*s+S.sample(S.uy,px,py)*c;
      if(i>0&&isFinite(prev)&&prev>0&&ut<=0){
        const f=prev/(prev-ut);                   // interpolate in phi
        const phiSep=Math.PI*((i-1)+f)/N;
        return 180-phiSep*180/Math.PI;
      }
      prev=ut;
    }
    return NaN;                                   // never separated
  };
  /* Drag from a wake survey.  The control volume runs from the inlet plane to
     the survey plane and is closed by the tunnel walls, which carry no
     streamwise force when they are slip walls:

        D  =  Int p1 dy - Int p2 dy  +  Int rho u^2 |1 dy - Int rho u^2 |2 dy

     Both planes are MEASURED.  The textbook rake formula replaces Int p1 dy
     with the ambient pressure and Int rho u1^2 dy with U times the mass flux;
     in a duct with a blocked section the inlet pressure is NOT ambient, and
     making that substitution here gave C_D = -0.76 against a balance reading of
     +2.01 -- stubbornly constant across every survey station, which is the
     giveaway that the control volume was closing on the wrong reference rather
     than failing to converge.  With both planes measured the two readings agree
     to about 1%.

     In UNSTEADY flow this identity is only true in the mean: the momentum
     stored between the planes changes over a shedding cycle, and an
     instantaneous snapshot at Re 100 misses by tens of percent.  That is why
     the sim time-averages the rake over the same window as the balance. */
  /* The reference static pressure is the MEASURED inlet plane.  In a duct with
     a blocked test section the inlet is not at ambient, and referencing C_p to
     rho = 1 instead put the front stagnation point at C_p = 1.5 instead of 1 —
     the same mistake, in a different place, as the wake-rake one below. */
  S.refState=function(){
    let r=0, c=0;
    for(let y=0;y<ny;y++){ const k=1*ny+y;
      if(S.node[k]===N_FLUID){ r+=S.rho[k]; c++; } }
    return c?r/c:1;
  };
  S.wakeDrag=function(x2,U,x1){
    const xa=x1===undefined?1:x1;
    let p1=0,p2=0,m1=0,m2=0;
    for(let y=0;y<ny;y++){
      const ka=xa*ny+y;
      if(S.node[ka]===N_FLUID){ p1+=S.rho[ka]*CS2; m1+=S.rho[ka]*S.ux[ka]*S.ux[ka]; }
      const kb=x2*ny+y;
      if(S.node[kb]===N_FLUID){ p2+=S.rho[kb]*CS2; m2+=S.rho[kb]*S.ux[kb]*S.ux[kb]; }
    }
    let wall=0;
    if(S.wallFx) for(let x=xa;x<x2;x++) wall+=S.wallFx[x];
    return {pres:p1-p2, mom:m1-m2, wall, total:(p1-p2)+(m1-m2)-wall};
  };
  /* velocity profile down a column, for the wake view */
  S.column=function(x){
    const out=new Float64Array(ny);
    for(let y=0;y<ny;y++) out[y]=S.ux[x*ny+y];
    return out;
  };
  return S;
}

/* ================================================================== *
 *  SIGNAL TOOLS — one radix-2 FFT, used by the force spectrum and by  *
 *  the hot-wire spectrum.  In-place, decimation in time.              *
 * ================================================================== */
function fft(re,im){
  const n=re.length;
  if(n<2||(n&(n-1))) throw new Error('fft: length must be a power of two, got '+n);
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1;
    for(;j&bit;bit>>=1) j^=bit;
    j^=bit;
    if(i<j){ const tr=re[i]; re[i]=re[j]; re[j]=tr;
             const ti=im[i]; im[i]=im[j]; im[j]=ti; }
  }
  for(let len=2;len<=n;len<<=1){
    const ang=-TAU/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cr=1, ci=0;
      for(let k=0;k<len/2;k++){
        const ur=re[i+k], ui=im[i+k];
        const vr=re[i+k+len/2]*cr-im[i+k+len/2]*ci;
        const vi=re[i+k+len/2]*ci+im[i+k+len/2]*cr;
        re[i+k]=ur+vr; im[i+k]=ui+vi;
        re[i+k+len/2]=ur-vr; im[i+k+len/2]=ui-vi;
        const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr;
      }
    }
  }
}
/* power spectrum of a real signal, Hann-windowed, mean removed */
function spectrum(sig){
  let n=1; while(n*2<=sig.length) n*=2;
  if(n<8) return {P:new Float64Array(0),n:0};
  const off=sig.length-n;
  let mean=0; for(let i=0;i<n;i++) mean+=sig[off+i]; mean/=n;
  const re=new Float64Array(n), im=new Float64Array(n);
  let wsum=0;
  for(let i=0;i<n;i++){ const w=0.5-0.5*Math.cos(TAU*i/n);
    re[i]=(sig[off+i]-mean)*w; wsum+=w*w; }
  fft(re,im);
  const H=n>>1, P=new Float64Array(H);
  for(let i=0;i<H;i++) P[i]=(re[i]*re[i]+im[i]*im[i])/Math.max(wsum,1e-30);
  return {P,n};
}
/* Dominant frequency in cycles per sample, parabolically interpolated —
   without the interpolation the resolution is 1/n and a Strouhal number comes
   out quantised.

   `frac` turns this into a FUNDAMENTAL estimator rather than a peak finder:
