   it returns the lowest bin carrying at least `frac` of the largest power,
   not the largest bin.  A vortex-shedding lift signal is not a sine — it has
   strong harmonics, and on a short record a harmonic can outrank the
   fundamental.  That is not hypothetical: with a 2048-sample window covering
   2.5 shedding periods this file reported St = 0.516 for a cylinder at Re 100,
   which is three times the right answer. */
function peakFreq(sig,frac){
  const {P,n}=spectrum(sig);
  if(!n) return 0;
  let kBest=0, best=-1;
  for(let i=1;i<P.length-1;i++) if(P[i]>best){ best=P[i]; kBest=i; }
  if(frac>0){
    for(let i=1;i<kBest;i++){
      if(P[i]>=frac*best&&P[i]>=P[i-1]&&P[i]>=P[i+1]){ kBest=i; break; }
    }
  }
  if(kBest<1||kBest>=P.length-1) return kBest/n;
  const a=P[kBest-1], b=P[kBest], c=P[kBest+1], den=a-2*b+c;
  const d=den!==0?0.5*(a-c)/den:0;
  return (kBest+d)/n;
}

/* ================================================================== *
 *  MEASURED ANCHORS                                                   *
 *  Cui, Wang, Yao, Liu & Yu, arXiv:1901.08766v2, Tables 1 and 2 —      *
 *  a circular cylinder, collected across five independent studies.    *
 *  These are the only measured numbers in the file.  Ranges, not      *
 *  single values, because that is what the literature actually says.  *
 * ================================================================== */
/* the published anchor for a Reynolds number, if this is one of the four the
   literature was collected at.  Within 2% so a slider that lands on 100.4
   still compares against the Re = 100 row. */
function cylAnchor(Re){
  for(const r of CYL_REF) if(Math.abs(Re-r.Re)<=0.02*r.Re) return r;
  return null;
}
const CYL_REF=[
  {Re:20,  cd:[2.090,2.144], Ls:[0.930,0.945], sep:[42.8,43.0]},
  {Re:40,  cd:[1.539,1.589], Ls:[2.200,2.260], sep:[52.9,53.86]},
  {Re:100, cd:[1.325,1.460], cl:[0.280,0.380], st:[0.163,0.170]},
  {Re:200, cd:[1.327,1.450], cl:[0.600,0.750], st:[0.193,0.196]},
];
const CYL_SRC='cylinder anchors: Cui et al., arXiv:1901.08766v2, Tables 1–2 '
             +'(Niu 2006; Wu &amp; Shu 2009; Cui 2017; Benson 1989; Ding 2004)';

/* What this file's own solver returned on those cases, run offline to
   convergence, at three grid spacings and 5% blockage (slip walls, section
   20 D tall, 40 D long).  Reproduce with globalThis.SLOW = 1, or read the
   header for the full chain.  These are drawn on the sweep view. */
const OWN_BENCH=[
  {Re:40,  D:10, cd:1.6566, Ls:2.4100},
  {Re:40,  D:16, cd:1.6283, Ls:2.3362},
  {Re:40,  D:24, cd:1.6227, Ls:2.3313},
  {Re:100, D:10, cd:1.4230, clr:0.2185, st:0.16466},
  {Re:100, D:16, cd:1.4287, clr:0.2431, st:0.16879},
  {Re:100, D:24, cd:1.4227, clr:0.2469, st:0.16857},
];
/* and the blockage sensitivity, measured the same way: Re 40, D = 10, four
   channel heights.  This is what turns the grid-converged number into a
   free-air one. */
const OWN_BLOCKAGE=[
  {b:1/20, cd:1.6566}, {b:1/30, cd:1.6336},
  {b:1/45, cd:1.6278}, {b:1/70, cd:1.6267},
];

/* ================================================================== *
 *  NUMBER FORMATTING                                                  *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function fmtPct(x){ return isFinite(x)?(100*x).toFixed(1)+'%':'—'; }
function sigFig(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const d=Math.max(0,(n||3)-1-Math.floor(Math.log10(Math.abs(x))));
  return x.toFixed(Math.min(d,10));
}
function fmtRe(Re){
  if(!isFinite(Re)) return '—';
  if(Re<1e4) return Math.round(Re).toLocaleString('en-US');
  const e=Math.floor(Math.log10(Re));
  return (Re/Math.pow(10,e)).toFixed(2)+'×10'+sup(e);
}
function sup(n){
  const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return String(n).split('').map(c=>m[c]||c).join('');
}
function fmtTime(s){
  if(!isFinite(s)) return '—';
  if(s<1e-3) return (s*1e6).toFixed(1)+' µs';
  if(s<1) return (s*1e3).toFixed(2)+' ms';
  return s.toFixed(3)+' s';
}

/* ================================================================== *
 *  THE MODEL — every derived scalar, pure and cacheable               *
 * ================================================================== */
const RESOLUTIONS=[
  {id:'coarse',name:'coarse',ny:78},
  {id:'medium',name:'medium',ny:110},
  {id:'fine',  name:'fine',  ny:146},
];
const WALLS=[
  {id:'closed',name:'closed walls'},
  {id:'slip',  name:'slip walls'},
  {id:'belt',  name:'moving belt'},
];

function buildModel(st){
  const res=RESOLUTIONS.find(r=>r.id===st.res)||RESOLUTIONS[1];
  const ny=res.ny, nx=Math.round(ny*2.6);
  const body=bodyById(st.body);

  /* the outline, in body coordinates, then placed on the lattice.  The chord
     in cells is computed FIRST because a shape may need it: a flat plate has to
     know how thin it is allowed to be before it stops existing. */
  const Lc=Math.max(4,st.size*ny);                 // chord in cells
  const outline=body.outline(st,Lc);
  /* the model sits one chord-and-a-bit downstream of the inlet so the inlet
     plane is not inside the body's own upstream influence */
  const x0=Math.round(0.28*nx);
  const groundBody=(body.id==='car'||body.id==='wedge');
  const bb0=polyBounds(outline);
  /* THE GAP UNDER A GROUND BODY HAS TO EXIST ON THE LATTICE.
     The ride-height slider starts at 0.5% of the span, which on the coarse
     grid is 0.39 of a cell: the car was being rasterised straight onto the
     moving belt with no clear row between them, and a body cell sharing an
     edge with a belt cell is a singular point the solver cannot carry.
     Measured — car on a belt at minimum ride, sub-grid model on, diverged at
     a cell Reynolds number of 50, where a cylinder survives 6400.  It is the
     same bug the flat plate had (PLATE_MIN_CELLS): a control whose bottom end
     asks for a feature thinner than the grid.  So the gap is floored, and the
     ride height the readout prints is the one the lattice actually has. */
  const rideCells=Math.max(st.ride*ny,RIDE_MIN_CELLS);
  const rideClamped=groundBody&&rideCells>st.ride*ny*(1+1e-12);
  const ride=rideCells/ny;                         // as a fraction, after flooring
  const y0=groundBody
    ? Math.round(1+rideCells + (-bb0.y0)*Lc)       // ride height above the floor
    : Math.round(ny/2);
  const poly=placeOutline(outline,Lc,st.alpha,x0,y0);
  const bb=polyBounds(poly);

  /* rasterise: a cell is body if its CENTRE is inside the outline */
  const node=new Uint8Array(nx*ny);
  const wallType = st.wall==='slip' ? N_SLIP : N_WALL;
  for(let x=0;x<nx;x++){
    node[x*ny+0]      = st.wall==='belt' ? N_BELT : wallType;
    node[x*ny+(ny-1)] = st.wall==='slip' ? N_SLIP : N_WALL;
  }
  let nBody=0;
  const ix0=Math.max(1,Math.floor(bb.x0)-1), ix1=Math.min(nx-2,Math.ceil(bb.x1)+1);
  const iy0=Math.max(1,Math.floor(bb.y0)-1), iy1=Math.min(ny-2,Math.ceil(bb.y1)+1);
  for(let x=ix0;x<=ix1;x++) for(let y=iy0;y<=iy1;y++){
    if(pointInPoly(poly,x,y)){ node[x*ny+y]=N_BODY; nBody++; }
  }
  /* frontal height actually presented to the flow: count occupied rows */
  const rows=new Uint8Array(ny);
  for(let x=0;x<nx;x++) for(let y=0;y<ny;y++) if(node[x*ny+y]===N_BODY) rows[y]=1;
  let frontal=0; for(let y=0;y<ny;y++) if(rows[y]) frontal++;

  /* TWO lengths, and conflating them is a physics error.

     `reLen` defines the Reynolds number and therefore the lattice viscosity.
     It is the CHORD, which does not depend on the angle of attack — because
     rotating a body does not change its Reynolds number.  Using the frontal
     height here (the first version did) meant turning a flat plate edge-on
     took its reference length from 9 cells to 3 and its tau from 0.514 to
     0.5047, hard against the viscosity floor: the solver blew up on an
     ordinary slider move, and it blew up for a reason that was not physical.

     `href` normalises the force coefficients, and there the convention really
     does differ: chord for a streamlined section, frontal height for a bluff
     body.  The readout prints which is in force. */
  const reLen = Lc;
  const href = body.refBy==='chord' ? Lc : Math.max(frontal,1);

  /* -------- the air -------- */
  const T=st.T, P=st.P*1000;
  const rhoAir=airDensity(P,T), muAir=airViscosity(T), nuAir=muAir/rhoAir;
  const Lphys=st.Lphys;

  /* -------- the lattice mapping, and the ceiling it imposes --------

     The Reynolds number asked for and the Reynolds number the section can
     actually run are two different numbers, and conflating them is what made
     this file crash.  See RE_CELL_STAB / RE_CELL_LES above.

       nu_want  what the requested Re implies at this size and Mach
       nuStab   the bare lattice's floor, u_lat / RE_CELL_STAB
       nuLes    the floor with the sub-grid model, u_lat / RE_CELL_LES
       les      the model: on because it was asked for, OR because the flow
                is too under-resolved to run without one
       nuLat    nu_want raised to whichever floor is in force
       Re       the Reynolds number that nuLat actually delivers

     Everything downstream — the air speed, the time step, the coefficients —
     is built from Re, the one being run, never from the one on the slider. */
  const uLat=st.mach*CS2Sqrt();                    // lattice speed from Mach
  const ReAsk=Math.max(1,st.Re);
  const nuWant=uLat*reLen/ReAsk;
  const nuStab=uLat/RE_CELL_STAB;                  // both floors are cell
  const nuLes =uLat/RE_CELL_LES;                   // Reynolds numbers, not nu
  const lesAuto=!st.les&&nuWant<nuStab;            // engaged for us, not by us
  const les=st.les||lesAuto;
  /* is the model LOAD-BEARING here, or just switched on in a flow that would
     run without it?  Only in the first case does Cs get held up. */
  const lesCarrying=les&&nuWant<nuStab;
  const CsUsed=les?(lesCarrying?Math.max(st.Cs,CS_STAB):st.Cs):0;
  const CsHeld=lesCarrying&&st.Cs<CS_STAB;
  const nuFloor=les?nuLes:nuStab;
  const nuLat=Math.max(nuWant,nuFloor);
  const gridLimited=nuLat>nuWant*(1+1e-12);
  const Re=uLat*reLen/nuLat;                       // == ReAsk unless limited
  const ReCeil=uLat*reLen/nuFloor;
  const tau=tauOfNu(nuLat);

  const Uphys=Re*nuAir/Lphys;
  const aSound=Math.sqrt(1.4*R_AIR*T);
  const machPhys=Uphys/aSound;
  const dxPhys=Lphys/reLen;                        // metres per cell
  const dtPhys=uLat*dxPhys/Math.max(Uphys,1e-9);   // seconds per step
  const tauFloor=tauOfNu(nuFloor);

  /* -------- blockage and resolution warnings -------- */
  const blockage=frontal/(ny-2);
  /* laminar boundary-layer thickness at the reference length, Blasius:
     delta/L = 5/sqrt(Re).  If that is under a cell the wall layer is not
     resolved and the drag is being carried by the sub-grid model. */
  const deltaCells=5*reLen/Math.sqrt(Re);
  const warn=[];
  /* The two that describe what the tunnel just did to the request come first,
     because they change what the numbers on the panel MEAN. */
  /* The ceiling is reLen (in CELLS) times the largest stable cell Reynolds
     number, so the lattice Mach number cancels out of it and turning that
     slider up would be a waste of the user's time.  Only cells help. */
  if(gridLimited) warn.push('this section tops out at Re '+fmtRe(ReCeil)
    +' — it is running there, not at the '+fmtRe(ReAsk)+' you asked for. '
    +'The ceiling is '+fmt(reLen,1)+' cells of model × '+RE_CELL_LES
    +', so a bigger model or a finer grid raises it and the lattice Mach does not');
  else if(lesAuto) warn.push('the sub-grid model was switched on for you — at Re '
    +fmtRe(Re)+' this grid cannot resolve the flow, and without a model for the '
    +'scales it is missing the run would go unstable');
  if(CsHeld) warn.push('C<sub>s</sub> is being held at '+fmt(CS_STAB,2)+' rather than the '
    +fmt(st.Cs,2)+' asked for — the sub-grid model is carrying this flow, and at '
    +'the bottom of that slider it cannot');
  if(rideClamped) warn.push('the ride height is '+fmt(rideCells,1)+' cells, not the '
    +fmt(st.ride*ny,1)+' asked for — under about '+RIDE_MIN_CELLS
    +' the gap is thinner than the grid and the model sits on the belt');
  if(deltaCells<1) warn.push('the boundary layer is '+fmt(deltaCells,2)
    +' cells thick — thinner than the grid, so skin friction is not resolved');
  if(blockage>0.10) warn.push('blockage '+fmtPct(blockage)
    +' — above about 10% the walls are in the answer and C_D reads high');
  if(st.mach>0.12) warn.push('lattice Mach '+fmt(st.mach,3)
    +' — the D2Q9 equilibrium is only accurate to O(Ma³); keep it under ~0.1');
  if(machPhys>0.3) warn.push('the equivalent real speed is Mach '+fmt(machPhys,2)
    +' — real air would be compressible here and this solver is not');

  return {st,body,outline,poly,bb,node,nx,ny,Lc,x0,y0,href,reLen,frontal,nBody,
          blockage,groundBody,ride,rideCells,rideClamped,
          Re,ReAsk,ReCeil,gridLimited,les,lesAuto,lesCarrying,CsHeld,nuFloor,
          Uphys,Lphys,rhoAir,muAir,nuAir,aSound,machPhys,
          uLat,nuLat,tau,dxPhys,dtPhys,deltaCells,tauFloor,warn,
          Cs:CsUsed,
          wallType:st.wall};
}
function CS2Sqrt(){ return Math.sqrt(CS2); }   // c_s, so Ma = u/c_s

/* ================================================================== *
 *  READOUT / EQUATION BAR / TAG                                       *
 *  `live` carries what only a running solver knows.  It is optional   *
 *  so the panels can be built and tested without one.                 *
 * ================================================================== */
function liveDefaults(){
  return {cd:NaN,cl:NaN,cdMean:NaN,cdRms:NaN,clRms:NaN,st:NaN,cdWake:NaN,
          cdWakeInst:NaN,cdWakeMom:NaN,tauMax:NaN,tuMeas:NaN,cycles:0,
          steps:0,tconv:0,flushes:0,samples:0,settled:false,
          stationary:true,cdWall:NaN,diverged:false,
          ls:NaN,lsD:NaN,sep:NaN,steady:false,revCells:0};
}
function readoutHTML(M,live){
  const L=live||liveDefaults();
  const st=M.st, b=M.body;
  const hd=t=>'<tr><td class="hd" colspan="2">'+t+'</td></tr>';
  const row=(a,v,cls)=>'<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>';
  let s='<div class="rname">'+b.name+'<small>'
    +(b.refBy==='chord'?'coefficients on the chord':'coefficients on the frontal height')
    +'</small></div><table>';
  s+=hd('the flow');
  s+=row('Reynolds number','<b>'+fmtRe(M.Re)+'</b>',M.gridLimited?'bad':'good');
  /* When the request is over the ceiling BOTH numbers go on the panel.  A
     tunnel that quietly ran a different Reynolds number from the one on the
     dial would be worse than one that crashed. */
  if(M.gridLimited) s+=row('you asked for',fmtRe(M.ReAsk)+' — over the ceiling','bad');
  s+=row('equivalent air speed',fmt(M.Uphys,1)+' m/s');
  s+=row('model length',fmt(M.Lphys,3)+' m');
  s+=row('Re length / C ref',M.reLen+' / '+M.href+' cells');
  s+=row('blockage',fmtPct(M.blockage),M.blockage>0.10?'bad':'good');
  s+=hd('the balance');
  /* Until the start-up has been flushed out of the tunnel there is no mean to
     report, and printing one anyway is how a simulation lies.  The
     instantaneous force is shown instead, labelled as such. */
  s+= L.settled
    ? row('C<sub>D</sub> (2-D)','<b>'+fmt(L.cdMean,3)+'</b> ± '+fmt(L.cdRms,3),'good')
    : row('C<sub>D</sub> this instant', isFinite(L.cd)?fmt(L.cd,3):'—');
  s+=row('C<sub>L</sub> rms', L.settled&&isFinite(L.clRms)?fmt(L.clRms,3):'—');
  s+=row('C<sub>D</sub> from the rake', isFinite(L.cdWake)?fmt(L.cdWake,3):'—');
  s+=row('Strouhal number', isFinite(L.st)?fmt(L.st,4):'—');

  /* THE WAKE GEOMETRY.  Two quantities the literature quotes and this file
     used to carry only as stored anchors — now measured out of the running
     flow, so they can be wrong, which is the point. */
  s+=hd('the wake');
  const anc=(b.id==='cylinder')?cylAnchor(M.Re):null;
  if(!L.settled){
    s+=row('recirculation','—');
  } else if(!L.steady){
    s+=row('recirculation','shedding');
  } else {
    /* The published anchors are for an UNBOUNDED cylinder.  This section is
       blocked and the body is a handful of cells across, so the two are not
       the same measurement and a traffic light between them would be lying
       about which one is wrong — exactly the reason C_D is not colour-coded
       against the literature here either.  Both numbers are shown; the sweep
       view is where the comparison is made honestly, at fixed conditions. */
    s+=row('bubble L<sub>s</sub>/D', isFinite(L.lsD)?'<b>'+fmt(L.lsD,3)+'</b>':'attached');
    if(anc) s+=row('&nbsp;&nbsp;unbounded, Re '+anc.Re,
                   fmt(anc.Ls[0],3)+'–'+fmt(anc.Ls[1],3));
    if(b.id==='cylinder'){
      s+=row('separation θ<sub>s</sub>', isFinite(L.sep)?'<b>'+fmt(L.sep,1)+'°</b>':'none');
      if(anc) s+=row('&nbsp;&nbsp;unbounded, Re '+anc.Re,
                     fmt(anc.sep[0],1)+'–'+fmt(anc.sep[1],1)+'°');
    }
  }
  s+=row('reverse-flow cells', L.revCells?L.revCells:'—');
  s+=hd('the lattice');
  s+=row('grid',M.nx+' × '+M.ny+' cells');
  s+=row('body',M.nBody+' cells, '+M.frontal+' across');
  s+=row('τ₊',fmt(M.tau,5)+(M.gridLimited?' (floor)':''),
         M.gridLimited?'bad':'good');
  s+=row('τ max (sub-grid)',isFinite(L.tauMax)?fmt(L.tauMax,5):'—');
  s+=row('lattice Mach',fmt(st.mach,3),st.mach>0.12?'bad':'');
  s+=row('one step',fmtTime(M.dtPhys));
  s+=row('flow time',fmt(L.tconv,1)+' L/U');
  s+=row('tunnel flushed',fmt(L.flushes||0,1)+'×',L.settled?'good':'bad');
  s+='</table>';
  if(L.diverged) s+='<div class="note"><b class="warn">The solver went unstable</b> '
         +'at τ₊ = '+fmt(M.tau,5)+', and stopped rather than paint a screen of NaN. '
         +'Nothing on this panel is a measurement. Move any control and it restarts.</div>';
  else if(M.warn.length) s+='<div class="note"><b class="warn">'+M.warn[0]+'</b></div>';
  else if(!L.settled) s+='<div class="note"><b class="warn">Still settling.</b> '
         +'Nothing above is a measurement until the impulsive start has crossed '
         +'the section twice.</div>';
  else s+='<div class="note">Two independent drag measurements: the <b>balance</b> '
         +'sums momentum exchange over the body links, the <b>rake</b> closes a '
         +'control volume on the inlet plane. They share no data.</div>';
  if(L.steady&&cylAnchor(M.Re)&&b.id==='cylinder')
    s+='<div class="note">The unbounded values are what an <i>unconfined</i> cylinder '
      +'does. This section is <b>'+fmtPct(M.blockage)+' blocked</b> with the body '
      +M.href+' cells across, and the two effects pull opposite ways — measured, '
      +'at Re 40: coarse resolution makes L<sub>s</sub> read <i>high</i> '
      +'(2.51 at D = 8 against 2.33 at D = 16, falling towards the published '
      +'2.20–2.26), while confinement and the no-slip walls pull it <i>low</i>. '
      +'θ<sub>s</sub> reads low on both counts and converges slowest. Widen the '
      +'section, switch the walls to slip and refine the grid, and all three move '
      +'the way the header table says they do.</div>';
  return s;
}
function eqbarHTML(M){
  const v=M.st.view;
  /* the section view is about the scheme, except when you have asked it to
     paint Q — then the question on the screen is what Q is */
  if(v==='section'&&M.st.field==='q')
    return '<span class="lhs">Q</span> = ½(‖<span class="hl2">Ω</span>‖² − ‖<span class="hl">S</span>‖²) '
    +'= ¼ω² − ½(S<sub>xx</sub>² + S<sub>yy</sub>²) − S<sub>xy</sub>²'
    +'<span class="sm">the second invariant of ∇u. <b>Ω</b> is rotation, <b>S</b> is strain, '
    +'and Q &gt; 0 is where rotation wins — a vortex core. Plane shear has vorticity '
    +'everywhere and Q = 0 exactly, which is why the tunnel wall layers vanish here '
    +'and the shed cores do not.</span>';
  if(v==='section') return '<span class="lhs">f<sub>i</sub>(x+c<sub>i</sub>, t+1) − f<sub>i</sub>(x,t)</span> = '
    +'−ω<sub><span class="hl">+</span></sub>(f<sub>i</sub><sup>+</sup>−f<sub>i</sub><sup>eq+</sup>) '
    +'− ω<sub><span class="hl2">−</span></sub>(f<sub>i</sub><sup>−</sup>−f<sub>i</sub><sup>eq−</sup>)'
    +'<span class="sm">the two-relaxation-time lattice Boltzmann equation. '
    +'ω₊ sets the viscosity, ν = c<sub>s</sub>²(τ₊ − ½); ω₋ is fixed by Λ = 3/16 so the wall stays put.</span>';
  if(v==='model') return '<span class="lhs">Re</span> = U L / ν '
    +'&nbsp;&nbsp; <span class="hl">ν<sub>lattice</sub></span> = u<sub>lat</sub> L<sub>cells</sub> / Re '
    +'&nbsp;&nbsp; τ₊ = 3ν<sub>lattice</sub> + ½'
    +'<span class="sm">the only mapping between the real tunnel and the lattice: match the Reynolds '
    +'number, and the lattice viscosity follows from the size of the model in cells.</span>';
  if(v==='balance') return '<span class="lhs">F</span> = Σ<sub>links</sub> 2 c<sub>i</sub> f<sub>i</sub>(x<sub>f</sub>) '
    +'&nbsp;&nbsp;&nbsp; <span class="hl2">D</span> = ∮<sub>1</sub>(p + ρu²) dy − ∮<sub>2</sub>(p + ρu²) dy'
    +'<span class="sm">the balance and the rake. Both planes of the control volume are '
    +'measured — the textbook form replaces plane 1 with ambient, and in a duct that '
    +'is not the same thing. Two readings, no shared data.</span>';
  if(v==='wake') return '<span class="lhs">D</span> = ∮<sub>1</sub>(p + ρu²) dy − ∮<sub>2</sub>(p + ρu²) dy '
    +'&nbsp;&nbsp;&nbsp; <span class="hl">ω</span> = ∂v/∂x − ∂u/∂y'
    +'<span class="sm">the drag, from the momentum that never came out the other side. '
    +'Every survey station closes the same control volume, so in steady flow they must '
    +'all read the same number.</span>';
  if(v==='spectrum') return '<span class="lhs">E(k)</span> ∼ '
    +'<span class="hl">k<sup>−5/3</sup></span> in 3-D &nbsp;&nbsp; '
    +'<span class="hl2">k<sup>−3</sup></span> in 2-D'
    +'<span class="sm">without vortex stretching the cascade reverses: energy goes to LARGE scales '
    +'and enstrophy goes down. This solver is two-dimensional, so it lives on the right-hand slope.</span>';
  return '<span class="lhs">C<sub>D</sub></span> = F<sub>x</sub> / (½ ρ U² L<sub>ref</sub>)'
    +'<span class="sm">the ringed points are measured, from five independent studies. '
    +'Everything else on this plot is this solver.</span>';
}
function eqbarText(M){
  return eqbarHTML(M).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
}
function tagHTML(M,live){
  const L=live||liveDefaults();
  const v=M.st.view, b=M.body;
  if(v==='section') return '<b>'+b.name+'</b> at Re '+fmtRe(M.Re)
    +' — '+(M.les?(M.lesAuto?'sub-grid model on automatically':'sub-grid model on')
                 :'no sub-grid model')
    +(M.st.tu>0?', '+fmt(100*M.st.tu,1)+'% freestream turbulence':'')
    +'<br>the field is solved, not drawn';
  if(v==='model') return '<b>the model</b> — and the extrusion it really is'
    +'<br>2-D: no trailing vortices, no induced drag, no 3-D wake';
  if(v==='balance') return '<b>the balance and the rake</b> — two independent readings'
    +(L.settled?'':'<br>still settling: the mean is not trustworthy yet');
  if(v==='wake') return '<b>the wake</b> — deficit profiles and the vortex street';
  if(v==='spectrum') return '<b>the spectrum</b> — hot-wire, and the lift signal';
  return '<b>the sweep</b> — measured anchors, ringed; this solver, filled';
}
/* ================================================================== *
 *  2-D axes helper                                                    *
 * ================================================================== */
function makeAxes(x0,y0,w,hgt,xlo,xhi,ylo,yhi){
  return {x0,y0,w,h:hgt,xlo,xhi,ylo,yhi,
    X:v=>x0+(v-xlo)/((xhi-xlo)||1)*w,
    Y:v=>y0+hgt-(v-ylo)/((yhi-ylo)||1)*hgt};
}
function ticks(lo,hi,n){
  const raw=(hi-lo)/Math.max(n,1);
  const mag=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1e-12))));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(v);
  return out;
}
function tickLabel(v){
  if(Math.abs(v)<1e-12) return '0';
  const a=Math.abs(v);
  if(a>=1000||a<0.01) return v.toExponential(0);
  return String(Math.round(v*1000)/1000);
}
/* Clip 2-D plot data to the axes frame — curves that leave the box must not be
   drawn through the tick labels.  (Known-bad list, steam_carnot_cycle.html.) */
function frameClip(ctx,ax,pad){
  const p=pad||0;
  ctx.beginPath(); ctx.rect(ax.x0-p,ax.y0-p,ax.w+2*p,ax.h+2*p); ctx.clip();
}
function drawFrame(ctx,ax,xlab,ylab,opt){
  const o=opt||{};
  ctx.save();
  ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=1;
  ctx.strokeRect(ax.x0,ax.y0,ax.w,ax.h);
  ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#767e92';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(const t of ticks(ax.xlo,ax.xhi,o.nx||6)){
    const X=ax.X(t); if(X<ax.x0-1||X>ax.x0+ax.w+1) continue;
    ctx.strokeStyle='#1b1f29'; ctx.beginPath();
    ctx.moveTo(X,ax.y0); ctx.lineTo(X,ax.y0+ax.h); ctx.stroke();
    ctx.fillText(tickLabel(t),X,ax.y0+ax.h+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of ticks(ax.ylo,ax.yhi,o.ny||5)){
    const Y=ax.Y(t); if(Y<ax.y0-1||Y>ax.y0+ax.h+1) continue;
    ctx.strokeStyle='#1b1f29'; ctx.beginPath();
    ctx.moveTo(ax.x0,Y); ctx.lineTo(ax.x0+ax.w,Y); ctx.stroke();
    ctx.fillText(tickLabel(t),ax.x0-6,Y);
  }
  ctx.fillStyle='#8b93a6'; ctx.font='italic 12px Georgia, serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(xlab,ax.x0+ax.w/2,ax.y0+ax.h+20);
  ctx.save(); ctx.translate(ax.x0-42,ax.y0+ax.h/2); ctx.rotate(-Math.PI/2);
  ctx.textBaseline='bottom'; ctx.fillText(ylab,0,0); ctx.restore();
  ctx.restore();
}
function plotLine(ctx,ax,pts,col,lw,dash){
  if(pts.length<2) return;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  ctx.setLineDash(dash||[]); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); let started=false;
  for(const p of pts){
    if(!isFinite(p[0])||!isFinite(p[1])){ started=false; continue; }
    const X=ax.X(p[0]), Y=ax.Y(p[1]);
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.stroke(); ctx.restore();
}
function plotDot(ctx,ax,x,y,col,r,ring){
  const X=ax.X(x), Y=ax.Y(y);
  ctx.save();
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X,Y,r||3.2,0,TAU); ctx.fill();
  if(ring){ ctx.strokeStyle=ring; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(X,Y,(r||3.2)+3,0,TAU); ctx.stroke(); }
  ctx.restore();
}
/* Wrap on MEASURED width, not on a character count: a 30-character budget is
   not a width, and at 10.5 px the legend column overran the canvas edge.  */
function wrapText(ctx,txt,maxW,font){
  ctx.save(); ctx.font=font||'10px -apple-system, sans-serif';
  const words=(''+txt).split(' '); const out=[]; let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ out.push(line); line=w; }
    else line=test;
  }
  if(line) out.push(line);
  ctx.restore(); return out;
}
function label(ctx,x,y,txt,col,align,font){
  ctx.save(); ctx.fillStyle=col||'#8b93a6';
  ctx.font=font||'11px -apple-system, sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.fillText(txt,x,y); ctx.restore();
}

/* HTML entities -> text, for fillText (canvas does not decode them) */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }

/* ================================================================== *
 *  FIELD RENDERING                                                    *
 *  Fast path: build an ImageData at lattice resolution and blit it    *
 *  scaled.  Where there is no real canvas (the headless harnesses)    *
 *  it falls back to blocks, so the captured display list shows the    *
 *  same picture at lower resolution instead of showing nothing.       *
 * ================================================================== */
const FIELDS=[
  {id:'vort', name:'vorticity'},
  /* `key` is what goes under the colour bar when the chip label is too long
     for it — the bar is 180px and the two scale numbers eat both ends. */
  {id:'q',    name:'Q — cores, not shear', key:'Q'},
  {id:'speed',name:'speed'},
  {id:'cp',   name:'pressure'},
  {id:'turb', name:'turbulence'},
  {id:'eddy', name:'eddy viscosity  νₜ/ν'},
];
/* diverging ramps go dark at zero: on this background that reads as "nothing
   happening here", which is what zero vorticity means. */
function divergeCol(t){                  // t in [-1,1]
  const a=clamp(Math.abs(t),0,1);
  const c=t>=0?'#5ac8e0':'#cd35c4';
  const r=toRgb(c);
  const g=Math.pow(a,0.65);
  return [Math.round(r[0]*g+5*(1-g)), Math.round(r[1]*g+7*(1-g)), Math.round(r[2]*g+12*(1-g))];
}
function rampCol(t){                     // t in [0,1] — the house scalar ramp
  const c=neon(clamp(t,0,1));
  const g=Math.pow(clamp(t,0,1),0.55);
  return [Math.round(255*c[0]*g+5*(1-g)), Math.round(255*c[1]*g+7*(1-g)),
          Math.round(255*c[2]*g+12*(1-g))];
}
const BODY_RGB=[58,66,84], WALL_RGB=[34,38,48];

function makeFieldPainter(){
  let cv=null, c2=null, img=null, W=0, H=0, broken=false;
  return function paint(ctx,S,M,kind,scale,dx,dy,dw,dh){
    const nx=S.nx, ny=S.ny;
    const rRef=S.refState();          // ambient is the inlet plane, not rho = 1
    const val=(x,y)=>{
      const k=x*ny+y;
      const t=S.node[k];
      if(t===N_BODY) return null;
      if(t!==N_FLUID) return undefined;
      if(kind==='vort')  return divergeCol(S.vorticity(x,y)/scale);
      if(kind==='q')     return divergeCol(S.qcrit(x,y)/scale);
      if(kind==='speed'){ const u=S.ux[k],v=S.uy[k];
        return rampCol(Math.sqrt(u*u+v*v)/scale); }
      if(kind==='cp')    return divergeCol((S.rho[k]-rRef)*CS2/scale);
      if(kind==='turb'){ const u=S.ux[k]-M.uLat, v=S.uy[k];
        return rampCol(Math.sqrt(u*u+v*v)/scale); }
      /* nu_t / nu_0, NOT tau/tau_0 - 1.  tau is dominated by the constant 1/2,
         so at the viscosity floor an eddy viscosity fourteen times the
         molecular one shows up as a tau ratio of 8e-4 and the field reads as
         empty.  The ratio of the VISCOSITIES is the physical quantity and the
         one the legend claims to be showing. */
      const t0=M.tau, tl=S.tauLocal?S.tauLocal[k]:t0;
      return rampCol((tl-0.5)/Math.max(t0-0.5,1e-12)-1);
    };
    if(!broken && typeof document!=='undefined' && document.createElement){
      try{
        if(!cv||W!==nx||H!==ny){
          cv=document.createElement('canvas'); cv.width=nx; cv.height=ny;
          c2=cv.getContext('2d'); img=c2.createImageData(nx,ny); W=nx; H=ny;
        }
        const d=img.data;
        for(let y=0;y<ny;y++) for(let x=0;x<nx;x++){
          const c=val(x,y);
          const o=4*((ny-1-y)*nx+x);     // canvas y grows downward
          const rgb=c===null?BODY_RGB:(c===undefined?WALL_RGB:c);
          d[o]=rgb[0]; d[o+1]=rgb[1]; d[o+2]=rgb[2]; d[o+3]=255;
        }
        c2.putImageData(img,0,0);
        ctx.save();
        ctx.imageSmoothingEnabled=true;
        ctx.drawImage(cv,dx,dy,dw,dh);
        ctx.restore();
        return 'image';
      }catch(e){ broken=true; }
    }
    /* fallback: blocks, coarse enough to stay a sane number of ops */
    const bs=Math.max(1,Math.ceil(nx/72));
    const sw=dw/nx*bs, sh=dh/ny*bs;
    ctx.save();
    for(let x=0;x<nx;x+=bs) for(let y=0;y<ny;y+=bs){
      const c=val(Math.min(x+(bs>>1),nx-1),Math.min(y+(bs>>1),ny-1));
      const rgb=c===null?BODY_RGB:(c===undefined?WALL_RGB:c);
      ctx.fillStyle='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
      ctx.fillRect(dx+x/nx*dw, dy+dh-(y+bs)/ny*dh, sw+0.6, sh+0.6);
    }
    ctx.restore();
    return 'blocks';
  };
}

/* the colour key that goes under a field */
/* which fields are signed, and therefore get the diverging ramp and a two-ended
   key.  Q is signed on purpose: its NEGATIVE half is the strain-dominated
   shear layer, which is exactly the thing vorticity cannot distinguish from a
   vortex, so hiding it would throw away the reason the field is here. */
function isDiverging(kind){ return kind==='vort'||kind==='cp'||kind==='q'; }
function drawKey(ctx,x,y,w,kind,scale,unitLabel){
  const n=48, h=8;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const c=isDiverging(kind)?divergeCol(2*t-1):rampCol(t);
    ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
    ctx.fillRect(x+t*w-0.5,y,w/n+1.2,h);
  }
  ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
  const div=isDiverging(kind);
  /* Q is the square of a velocity gradient, so its scale is ~1e-5 in lattice
     units and sigFig writes it as "0.000011" — nine characters at each end of
     a 180px bar, which collided with the label in the middle.  Anything below
     a thousandth goes to exponential. */
  const num=v=>Math.abs(v)<1e-3?v.toExponential(1):sigFig(v,2);
  label(ctx,x,y+h+9,div?'−'+num(scale):'0','#767e92','left','10px -apple-system, sans-serif');
  label(ctx,x+w,y+h+9,'+'+num(scale),'#767e92','right','10px -apple-system, sans-serif');
  label(ctx,x+w/2,y+h+9,unitLabel,'#8b93a6','center','italic 10.5px Georgia, serif');
}

/* ================================================================== *
 *  SMOKE — the tracer rake                                            *
 *  A real tunnel injects smoke from a comb of tubes upstream of the   *
 *  model.  These are passive tracers on the SOLVED field: they carry  *
 *  no physics of their own and are drawn as streaks so the eye can    *
 *  see the direction, which is the whole point of a smoke rake.       *
 * ================================================================== */
function makeSmoke(n,seed){
  const TRAIL=8;                         // positions kept per particle
  const P={x:new Float64Array(n),y:new Float64Array(n),
           hx:new Float64Array(n*TRAIL),hy:new Float64Array(n*TRAIL),
           len:new Int32Array(n),age:new Float64Array(n),
           n,TRAIL,rnd:mulberry32(seed||1)};
  P.reset=function(S,seedRows){
    for(let i=0;i<n;i++) P.seed(i,S,seedRows,true);
  };
  P.seed=function(i,S,rows,spread){
    const r=rows[i%rows.length];
    P.x[i]=spread?(2+P.rnd()*(S.nx-4)):2.0;
    P.y[i]=r+(P.rnd()-0.5)*0.9;
    P.len[i]=0;
    P.age[i]=spread?P.rnd()*0.5:0;
    P.push(i);
  };
  P.push=function(i){
    const b=i*TRAIL, L=P.len[i];
    if(L<TRAIL){ P.hx[b+L]=P.x[i]; P.hy[b+L]=P.y[i]; P.len[i]=L+1; }
    else {
      for(let k=0;k<TRAIL-1;k++){ P.hx[b+k]=P.hx[b+k+1]; P.hy[b+k]=P.hy[b+k+1]; }
      P.hx[b+TRAIL-1]=P.x[i]; P.hy[b+TRAIL-1]=P.y[i];
    }
  };
  /* bilinear sample of a lattice field */
  P.sample=function(S,arr,x,y){
    const nx=S.nx, ny=S.ny;
    const x0=Math.floor(x), y0=Math.floor(y);
    const fx=x-x0, fy=y-y0;
    const xa=clamp(x0,0,nx-1), xb=clamp(x0+1,0,nx-1);
    const ya=clamp(y0,0,ny-1), yb=clamp(y0+1,0,ny-1);
    return (arr[xa*ny+ya]*(1-fx)*(1-fy)+arr[xb*ny+ya]*fx*(1-fy)
           +arr[xa*ny+yb]*(1-fx)*fy   +arr[xb*ny+yb]*fx*fy);
  };
  /* Advance by exactly the number of lattice steps the solver took, in a few
     sub-steps so a particle cannot jump over the body.  The drawn streak is
     the particle's OWN recent path — it is a streakline, not a stretched
     arrow, so its length carries real information about the local speed. */
  P.step=function(S,rows,steps){
    const sub=Math.max(1,Math.min(6,Math.ceil(steps/6)));
    const dt=steps/sub;
    for(let i=0;i<n;i++){
      for(let q=0;q<sub;q++){
        const u=P.sample(S,S.ux,P.x[i],P.y[i]);
        const v=P.sample(S,S.uy,P.x[i],P.y[i]);
        P.x[i]+=u*dt; P.y[i]+=v*dt;
      }
      P.age[i]+=steps*0.00015;
      const k=Math.round(clamp(P.x[i],0,S.nx-1))*S.ny+Math.round(clamp(P.y[i],0,S.ny-1));
      if(P.x[i]>S.nx-2||P.x[i]<1||P.y[i]<1||P.y[i]>S.ny-2||P.age[i]>1||
         S.node[k]!==N_FLUID){
        P.seed(i,S,rows,false);
      } else P.push(i);
    }
  };
  return P;
}

/* ================================================================== *
 *  SCENE                                                              *
 * ================================================================== */
const DEFAULTS={
  view:'section',
  body:'cylinder', size:0.09, alpha:0.0, thick:0.12, slant:25, ride:0.06,
  fineness:9, finSpan:1.6,
  res:'medium', wall:'closed', belt:true,
  Re:100, Lphys:0.10, T:293.15, P:101.325, mach:0.09,
  les:false, Cs:0.14, tu:0.0, tuScale:24, seed:7,
  field:'vort', smoke:true, outline:true, rake:true, anim:true,
  speed:1.0, rakeX:0.62,
  trip:true, lines:false, bubble:true,
};
/* 5% of the freestream.  Big enough to skip most of the exponential growth,
   small enough to be a perturbation of the steady wake rather than a
   replacement for it -- and it is a transient either way, see makeTrip. */
const TRIP_AMP=0.05;

function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-2.05,0.34,5.4,[0,0,0]);
  let cached=null, cacheKey='', S=null, smoke=null, tuGen=null, trip=null;
  const paintField=makeFieldPainter();
  /* long enough to hold many shedding periods: a Strouhal number read off two
     periods is a guess, and the buffer is what bounds the window */
  const HIST=16384;
  let cdH=new Float64Array(HIST), clH=new Float64Array(HIST),
      cwH=new Float64Array(HIST), nH=0;
  let live=liveDefaults();
  let collected=[];
  let uProf=null, vProf=null, tOut=[0,0];
  let lastPaintMode='image';
  let SCALE={};

  function keyOf(){
    return [st.body,st.size,st.alpha,st.thick,st.slant,st.ride,st.fineness,
            st.finSpan,st.res,st.wall,st.Re,st.Lphys,st.T,st.P,st.mach,
            st.les,st.Cs,st.trip].join('|');
  }
  function model(){
    const k=keyOf();
    if(cached&&cacheKey===k) return cached;
    cached=buildModel(st); cacheKey=k;
    return cached;
  }
  /* the solver is rebuilt whenever the model that defines it changes */
  function ensure(){
    const M=model();
    if(S&&S.nx===M.nx&&S.ny===M.ny&&S._key===cacheKey) return M;
    S=makeSolver(M.nx,M.ny);
    S._key=cacheKey;
    S.node.set(M.node);
    S.buildLinks();
    S.tau=M.tau; S.Cs=M.Cs; S.uw=(st.wall==='belt')?M.uLat:0;
    S.enableTauField();
    S.diverged=false; S.divReason='';
    trip=st.trip?makeTrip(M,TRIP_AMP):null;
    S.initFrom(tripIC(M,trip));
    uProf=new Float64Array(M.ny); vProf=new Float64Array(M.ny);
    smoke=makeSmoke(620,st.seed*7919+13);
    smoke.reset(S,smokeRows(M));
    tuGen=makeTurbulence(st.seed,14,st.tuScale,M.ny);
    nH=0; live=liveDefaults(); SCALE={};
    return M;
  }
  function reset(){ cacheKey=''; S=null; }
  function smokeRows(M){
    const rows=[];
    for(let i=0;i<13;i++) rows.push(2+(M.ny-4)*(i+0.5)/13);
    return rows;
  }
  /* the body's centreline, in lattice units */
  function bodyMidY(M){ return 0.5*(M.bb.y0+M.bb.y1); }
  /* The SURFACE at the back of the body on that centreline — deliberately not
     the last solid node.  Half-way bounce-back puts the no-slip wall half a
     cell outside the outermost body cell, so measuring L_s from the node
     biases every reading by 0.5/D: 3% at D = 16, which is the same size as
     the discrepancy against the literature this file is trying to explain. */
  function rearSurfaceX(M){
    const y=Math.round(bodyMidY(M));
    let last=-1;
    for(let x=0;x<M.nx;x++) if(M.node[x*M.ny+y]===N_BODY) last=x;
    return last<0?M.bb.x1:last+0.5;
  }

  /* --------------- running the solver --------------- */
  function inletProfile(M,t){
    const ny=M.ny, U=M.uLat;
    for(let y=0;y<ny;y++){ uProf[y]=U; vProf[y]=0; }
    if(st.tu>0&&tuGen){
      const amp=st.tu*U;
      for(let y=0;y<ny;y++){
        tuGen.at(y,t,U,tOut);
        uProf[y]=U+amp*tOut[0];
        vProf[y]=amp*tOut[1];
      }
    }
    /* the wall rows are solid; a prescribed velocity there is meaningless and
       the Zou/He formula divides by (1-u), so clamp the ends to zero */
    uProf[0]=0; vProf[0]=0; uProf[ny-1]=0; vProf[ny-1]=0;
    return uProf;
  }
  function advance(n){
    const M=ensure();
    if(S.diverged) return;
    for(let i=0;i<n;i++){
      inletProfile(M,S.steps);
      S.step(uProf,vProf);
      record(M);
      if((S.steps&31)===0&&S.check()) break;
    }
    if(smoke&&st.smoke) smoke.step(S,smokeRows(M),n);
  }
  function record(M){
    const q=0.5*M.uLat*M.uLat*M.href;
    const cd=S.Fx/q, cl=S.Fy/q;
    /* the rake is read EVERY step and averaged over the same window as the
       balance: in unsteady flow the control-volume identity only holds in the
       mean, because momentum is stored and released between the two planes
       over a shedding cycle.  An instantaneous rake reading at Re 100 is out
       by tens of percent and is not a measurement of anything. */
    const cw=S.wakeDrag(Math.round(st.rakeX*S.nx),M.uLat).total/q;
    cdH[nH%HIST]=cd; clH[nH%HIST]=cl; cwH[nH%HIST]=cw; nH++;
    live.cd=cd; live.cl=cl;
    live.steps=S.steps;
    live.tconv=S.steps*M.uLat/M.href;
    live.tauMax=S.tauMax;
    live.diverged=S.diverged;
  }
  function histView(arr){
    const n=Math.min(nH,HIST);
    const out=new Float64Array(n);
    for(let i=0;i<n;i++) out[i]=arr[(nH-n+i)%HIST];
    return out;
  }
  /* statistics over the settled part of the record only.  "Settled" means at
     least 12 convective times have passed; before that the mean is the
     start-up transient and reporting it would be a lie. */
  function stats(M){
    const n=Math.min(nH,HIST);
    if(n<16) return;
    const cd=histView(cdH), cl=histView(clH), cw=histView(cwH);
    const tconv=live.tconv;
    /* "Settled" has to mean the START-UP has left the tunnel, and the natural
       length for that is the DOMAIN, not the body.  Twelve body lengths at a
       9% blockage is barely half a domain flush, and the first version of this
       test called a run settled while the impulsive-start transient was still
       inside the box: the rake then disagreed with the balance by 141% and the
       lift spectrum peaked at St = 2.5.  Both conditions now have to hold. */
    live.flushes=S.steps*M.uLat/M.nx;
    const settled=tconv>12&&live.flushes>2.0;
    const i0=settled?Math.floor(n*0.5):0;
    let s=0,s2=0,l2=0,m=n-i0;
    let sw=0;
    for(let i=i0;i<n;i++){ s+=cd[i]; sw+=cw[i]; }
    const mean=s/m;
    for(let i=i0;i<n;i++){ const d=cd[i]-mean; s2+=d*d; l2+=cl[i]*cl[i]; }
    live.cdWake=settled?sw/m:NaN;
    live.cdMean=mean; live.cdRms=Math.sqrt(s2/m); live.clRms=Math.sqrt(l2/m);
    live.settled=settled; live.samples=m;

    /* THE WAKE GEOMETRY.  L_s and theta_s are STEADY-FLOW quantities and the
       literature only quotes them below the shedding threshold: once the
       street starts there is no closed bubble to measure the length of, and
       the "separation point" sweeps back and forth over a cycle.  So they are
       measured only while the record says the wake is actually steady, and
       reported as absent rather than as a number otherwise.  The threshold is
       on the lift fluctuation, which is what shedding IS -- a body with a
       steady wake carries no oscillating side force. */
    const steady=settled&&live.clRms<0.02;
    live.steady=steady;
    if(steady){
      const b=S.wakeBubble(rearSurfaceX(M),bodyMidY(M));
      live.ls=b.found?b.ls:NaN;
      live.lsD=b.found?b.ls/M.href:NaN;
      live.sep=(M.st.body==='cylinder')
        ? S.separationAngle(0.5*(M.bb.x0+M.bb.x1),bodyMidY(M),0.5*M.href)
        : NaN;
    } else { live.ls=NaN; live.lsD=NaN; live.sep=NaN; }
    let rev=0;
    for(let x=1;x<M.nx-1;x++) for(let y=1;y<M.ny-1;y++){
      const k=x*M.ny+y;
      if(S.node[k]===N_FLUID&&S.ux[k]<0) rev++;
    }
    live.revCells=rev;
    /* A Strouhal number needs several cycles inside the averaging window or
       the "peak" is whatever noise the FFT happened to like — at six cycles
       the frequency is resolved to better than a percent, at one it is not
       resolved at all. */
    const seg=cl.slice(i0);
    const fr=settled?peakFreq(seg,0.12):0;
    const cycles=fr*seg.length;
    live.cycles=cycles;
    const stNum=fr>0?fr*M.href/M.uLat:NaN;
    /* Stationarity.  A shedding instability that is still GROWING has its
       energy piled up at the end of the record, the fundamental leaks, and the
       peak lands on a harmonic — which is how a cylinder at Re 100 came out at
       St = 0.516.  Compare the lift rms over the two halves of the window and
       refuse to report a frequency until they agree. */
    let a2=0,b2=0; const mid=i0+((n-i0)>>1);
    for(let i=i0;i<mid;i++) a2+=cl[i]*cl[i];
    for(let i=mid;i<n;i++) b2+=cl[i]*cl[i];
    const ra=Math.sqrt(a2/Math.max(mid-i0,1)), rb=Math.sqrt(b2/Math.max(n-mid,1));
    const stationary=(ra+rb)>1e-12 ? Math.abs(rb-ra)/Math.max(ra,rb,1e-30)<0.25 : true;
    live.stationary=stationary;
    live.st=(stationary&&cycles>=8&&stNum>0.02&&stNum<1.2)?stNum:NaN;
    const w=S.wakeDrag(Math.round(st.rakeX*M.nx),M.uLat);
    const qq=0.5*M.uLat*M.uLat*M.href;
    live.cdWakeMom=w.mom/qq;
    live.cdWakeInst=w.total/qq;
    live.cdWall=w.wall/qq;
    /* measure the freestream turbulence back OUT of the flow, upstream of the
       model, so the number quoted is the one the tunnel actually has */
    const xs=Math.max(2,Math.round(0.10*M.nx));
    let su=0,sv=0,c=0;
    for(let y=2;y<M.ny-2;y++){ const k=xs*M.ny+y;
      if(S.node[k]!==N_FLUID) continue;
      su+=(S.ux[k]-M.uLat)*(S.ux[k]-M.uLat); sv+=S.uy[k]*S.uy[k]; c++; }
    live.tuMeas=c?Math.sqrt(0.5*(su+sv)/c)/M.uLat:NaN;
  }

  /* surface pressure, ordered around the body.  The surface point of a link is
     half a cell beyond the fluid node, which is exactly where half-way
     bounce-back puts the wall. */
  function surfaceCp(M){
    const out=[], q=0.5*M.uLat*M.uLat, ny=M.ny;
    const rRef=S.refState();
    let cx=0, cy=0, n=0;
    for(let x=0;x<M.nx;x++) for(let y=0;y<ny;y++)
      if(M.node[x*ny+y]===N_BODY){ cx+=x; cy+=y; n++; }
    if(!n) return {pts:[],cx:0,cy:0};
    cx/=n; cy/=n;
    const L=S.links, seen=new Set();
    for(let t=0;t<L.length;t+=2){
      const k=L[t], i=L[t+1];
      if(seen.has(k)) continue;
      seen.add(k);
      const x=Math.floor(k/ny), y=k%ny;
      const sx=x+0.5*CX[i], sy=y+0.5*CY[i];
      const cp=(S.rho[k]-rRef)*CS2/q;
      out.push({x:sx,y:sy,cp,ang:Math.atan2(sy-cy,sx-cx)});
    }
    out.sort((a,b)=>a.ang-b.ang);
    return {pts:out,cx,cy};
  }

  /* The readout panel floats over the top-right of the stage — 278 px wide
     with a 13 px margin, about 470 px tall — so anything a view draws in that
     rectangle is invisible.  Every side column is therefore placed to the LEFT
     of RO_X, and anything that has to be wide waits until below RO_Y.  The
     layout audit reports "under the readout panel" hits, which is how the
     first version of the balance view was caught hiding 26 labels. */
  const RO_W=302, RO_Y=486;
  const roX=W=>Math.max(420,W-RO_W);

  /* ---------------- the field rect for a given stage ---------------- */
  function fieldRect(W,H,M,topPad){
    const padL=26, padR=26, padT=topPad===undefined?52:topPad, padB=76;
    const aw=W-padL-padR, ah=H-padT-padB;
    const ar=M.nx/M.ny;
    let w=aw, h=w/ar;
    if(h>ah){ h=ah; w=h*ar; }
    return {x:padL+(aw-w)/2, y:padT+(ah-h)/2, w, h};
  }
  const L2S=(R,M)=>({X:x=>R.x+x/M.nx*R.w, Y:y=>R.y+R.h-y/M.ny*R.h,
                     s:R.w/M.nx});

  /* ================= view A : the test section ================= */
  function drawSection(ctx,W,H,M){
    const R=fieldRect(W,H,M);
    const T=L2S(R,M);
    const sc=fieldScale(M,st.field);
    lastPaintMode=paintField(ctx,S,M,st.field,sc,R.x,R.y,R.w,R.h);

    /* THE REVERSE-FLOW REGION.  Everywhere the streamwise velocity has
       actually changed sign -- which is the recirculation bubble behind a
       steady body, and the alternating pair of shed vortices once the street
       starts.  Drawn at cell resolution and nothing is interpolated, so the
       ragged edge IS the lattice: the boundary of this patch is the u_x = 0
       contour to within one cell, and that is said on the canvas rather than
       smoothed over. */
    if(st.bubble){
      const cw=R.w/M.nx, ch=R.h/M.ny;
      ctx.save(); ctx.fillStyle=rgba('#e8843a',0.20);
      for(let x=1;x<M.nx-1;x+=2) for(let y=1;y<M.ny-1;y+=2){
        const k=x*M.ny+y;
        if(S.node[k]!==N_FLUID) continue;
        if(S.ux[k]>=0) continue;
        ctx.fillRect(R.x+x*cw, R.y+R.h-(y+2)*ch, 2*cw+0.5, 2*ch+0.5);
      }
      ctx.restore();
    }

    /* THE STREAMLINES — instantaneous, and not the same curve as the smoke. */
    if(st.lines){
      const D=Math.max(M.href,3);
      ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.strokeStyle=rgba('#5ac8e0',0.62); ctx.lineWidth=1.0;
      for(const [sx,sy] of streamSeeds(S,M)){
        const fwd=streamline(S,sx,sy,+1,0.7,Math.round(60*D));
        const bwd=streamline(S,sx,sy,-1,0.7,Math.round(12*D));
        const path=bwd.slice(1).reverse().concat(fwd);
        if(path.length<3) continue;
        ctx.beginPath();
        ctx.moveTo(T.X(path[0][0]),T.Y(path[0][1]));
        for(let i=1;i<path.length;i++) ctx.lineTo(T.X(path[i][0]),T.Y(path[i][1]));
        ctx.stroke();
      }
      ctx.restore();
    }

    /* the smoke rake */
    if(st.smoke&&smoke){
      ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
      const TR=smoke.TRAIL;
      for(let i=0;i<smoke.n;i++){
        const L=smoke.len[i];
        if(L<2) continue;
        const a=1-smoke.age[i];
        if(a<=0) continue;
        ctx.strokeStyle=rgba('#e8ecf4',0.12+0.6*a*a);
        ctx.lineWidth=1.1;
        ctx.beginPath();
        const b=i*TR;
        ctx.moveTo(T.X(smoke.hx[b]),T.Y(smoke.hy[b]));
        for(let q=1;q<L;q++) ctx.lineTo(T.X(smoke.hx[b+q]),T.Y(smoke.hy[b+q]));
        ctx.stroke();
      }
      ctx.restore();
    }
    /* the body, from the SAME outline the rasteriser used */
    if(st.outline) strokePoly(ctx,M.poly,T,'#e8ecf4',1.6);

    /* the section: walls, contraction and diffuser cues, the belt */
    ctx.save();
    ctx.strokeStyle='#3a4152'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(R.x,R.y); ctx.lineTo(R.x+R.w,R.y);
    ctx.moveTo(R.x,R.y+R.h); ctx.lineTo(R.x+R.w,R.y+R.h); ctx.stroke();
    if(st.wall==='belt'){
      ctx.strokeStyle=rgba('#b8ec4c',0.75); ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(R.x,R.y+R.h); ctx.lineTo(R.x+R.w,R.y+R.h); ctx.stroke();
      const ph=(S.steps*0.9)%26;
      ctx.lineWidth=1.2; ctx.strokeStyle=rgba('#b8ec4c',0.5);
      for(let x=R.x+ph;x<R.x+R.w;x+=26){
        ctx.beginPath(); ctx.moveTo(x,R.y+R.h+5); ctx.lineTo(x+9,R.y+R.h+5); ctx.stroke(); }
      label(ctx,R.x+6,R.y+R.h+15,'moving belt — the ground is not stationary in the car’s frame',
            '#b8ec4c','left','10px -apple-system, sans-serif');
    } else if(st.wall==='slip'){
      label(ctx,R.x+6,R.y-9,'slip walls — no wall boundary layer, so no wall blockage growth',
            '#767e92','left','10px -apple-system, sans-serif');
    } else {
      label(ctx,R.x+6,R.y-9,'the bands along the top and bottom are the tunnel’s own '
            +'boundary layers — real, and a real wind tunnel’s problem too; switch '
            +'to slip walls and they go','#767e92','left',
            '10px -apple-system, sans-serif');
    }
    ctx.restore();

    /* the turbulence grid, drawn where a real one sits: upstream, in the
       settling chamber, ahead of the contraction */
    if(st.tu>0){
      ctx.save(); ctx.strokeStyle=rgba('#5ac8e0',0.55); ctx.lineWidth=1.3;
      for(let i=0;i<9;i++){ const y=R.y+R.h*(i+0.5)/9;
        ctx.beginPath(); ctx.moveTo(R.x-13,y-4); ctx.lineTo(R.x-13,y+4); ctx.stroke(); }
      ctx.restore();
      label(ctx,R.x-16,R.y-25,'turbulence grid',rgba('#5ac8e0',0.8),'left',
            'italic 10.5px Georgia, serif');
    }
    /* the wake rake */
    if(st.rake){
      const xr=T.X(Math.round(st.rakeX*M.nx));
      ctx.save(); ctx.strokeStyle=rgba('#cd35c4',0.75); ctx.lineWidth=1.2;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(xr,R.y); ctx.lineTo(xr,R.y+R.h); ctx.stroke();
      ctx.restore();
      label(ctx,xr+4,R.y+12,'rake','#cd35c4','left','italic 11px Georgia, serif');
    }

    /* the key and the captions */
    const ffield=FIELDS.find(f=>f.id===st.field)||FIELDS[0];
    const fname=ffield.key||ffield.name;
    drawKey(ctx,R.x,R.y+R.h+30,180,st.field,sc,fname);
    const cap=[
      M.nx+' × '+M.ny+' lattice · '+(lastPaintMode==='image'?'blitted':'block fallback')
        +' · τ₊ = '+fmt(M.tau,5)+(M.Cs?' · sub-grid Cs = '+fmt(M.Cs,2):''),
      'blockage '+fmtPct(M.blockage)+' · reference length '+M.href+' cells'
        +' · '+fmt(live.tconv,1)+' convective times',
      /* say what has been done to the picture, including the scale the
         reverse-flow patch is quantised to */
      (st.trip?'wake tripped at t = 0 by a '+fmtPct(TRIP_AMP)
               +' divergence-free blob — a transient, not a forcing'
             :'not tripped — shedding has to grow out of round-off, which takes '
              +'~170 convective times')
        +(st.bubble?' · reverse flow shaded at 2-cell resolution':'')
        +(st.lines?' · streamlines are instantaneous, the smoke is not':''),
    ];
    let cy=R.y+R.h+30;
    for(const c of cap){ label(ctx,R.x+200,cy+6,c,'#767e92','left',
      '10.5px -apple-system, sans-serif'); cy+=15; }
    if(S.diverged){
      ctx.save();
      ctx.fillStyle='rgba(58,18,32,0.92)';
      ctx.fillRect(R.x+R.w/2-300,R.y+R.h/2-52,600,104);
      ctx.strokeStyle='#7c2338'; ctx.lineWidth=1; ctx.strokeRect(R.x+R.w/2-300,R.y+R.h/2-52,600,104);
      label(ctx,R.x+R.w/2,R.y+R.h/2-28,'the solver went unstable','#ffb3c0','center',
        'italic 17px Georgia, serif');
      let yy=R.y+R.h/2-6;
      for(const ln of wrapText(ctx,'The '+S.divReason+' field left its physical range at τ₊ = '
        +fmt(M.tau,5)+'. Lattice Boltzmann has a viscosity floor at τ = ½, and this '
        +'setting is against it. Turn the sub-grid model on, drop the Reynolds '
        +'number, or raise the lattice Mach number — all three raise τ.',
        560,'11.5px -apple-system, sans-serif')){
        label(ctx,R.x+R.w/2,yy,ln,'#ffd9df','center','11.5px -apple-system, sans-serif');
        yy+=16;
      }
      ctx.restore();
    } else if(M.warn.length) label(ctx,R.x+200,cy+6,plain(M.warn[0]),'#e8843a','left',
      '10.5px -apple-system, sans-serif');

    /* the live balance, as two bars */
    drawGauge(ctx,W-300,H-74,244,M,live);   /* -74: the settling note is two lines */
  }
  /* The colour scale is MEASURED off the field, not guessed from a constant.
     A fixed multiple of u/L was 18x too large at the default settings and
     painted the whole test section black; and any fixed choice is wrong the
     moment the Reynolds number moves two decades.  A high quantile of the
     field is taken (excluding the rows next to the walls, whose boundary-layer
     vorticity would otherwise set the scale for the whole picture) and then
     smoothed in time so the image does not flicker between frames.  The number
     it lands on is printed on the colour key. */
  function fieldScale(M,kind){
    const nx=S.nx, ny=S.ny, vals=[];
    const yLo=Math.min(5,ny>>2), yHi=ny-1-yLo;
    for(let x=2;x<nx;x+=3) for(let y=yLo;y<yHi;y+=2){
      const k=x*ny+y;
      if(S.node[k]!==N_FLUID) continue;
      let v;
      if(kind==='vort') v=Math.abs(S.vorticity(x,y));
      else if(kind==='q') v=Math.abs(S.qcrit(x,y));
      else if(kind==='speed'){ const u=S.ux[k],w=S.uy[k]; v=Math.sqrt(u*u+w*w); }
      else if(kind==='cp') v=Math.abs((S.rho[k]-S.refState())*CS2);
      else if(kind==='turb'){ const u=S.ux[k]-M.uLat,w=S.uy[k]; v=Math.sqrt(u*u+w*w); }
      else v=((S.tauLocal?S.tauLocal[k]:M.tau)-0.5)/Math.max(M.tau-0.5,1e-12)-1;
      if(isFinite(v)) vals.push(v);   // a diverged cell must not set the scale
    }
    vals.sort((a,b)=>a-b);
    let q=vals.length?vals[Math.min(vals.length-1,Math.floor(0.985*vals.length))]:0;
    const floor={vort:0.02*M.uLat,speed:1.15*M.uLat,cp:0.05*M.uLat*M.uLat,
                 turb:0.01*M.uLat,eddy:0.02,
                 /* Q goes as the square of a velocity gradient, so its floor is
                    the vorticity floor squared over four — not a new guess. */
                 q:0.25*(0.02*M.uLat)*(0.02*M.uLat)}[kind]||1e-6;
    q=Math.max(q,floor);
    const prev=SCALE[kind];
    const sm=(prev&&isFinite(prev))?prev*0.85+q*0.15:q;
    SCALE[kind]=sm;
    return sm;
  }
  function strokePoly(ctx,poly,T,col,lw){
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||1.5;
    ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(T.X(poly[0][0]),T.Y(poly[0][1]));
    for(let i=1;i<poly.length;i++) ctx.lineTo(T.X(poly[i][0]),T.Y(poly[i][1]));
    ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  function drawGauge(ctx,x,y,w,M,L){
    ctx.save();
    const rows=[['C_D',L.cdMean,'#b8ec4c',2.6],['C_L rms',L.clRms,'#cd35c4',1.2]];
    let yy=y;
    for(const [name,v,col,full] of rows){
      label(ctx,x,yy+5,name,'#8b93a6','left','italic 11.5px Georgia, serif');
      ctx.fillStyle='#1b1f29'; ctx.fillRect(x+56,yy,w-56-52,9);
      if(isFinite(v)){
        ctx.fillStyle=col;
        ctx.fillRect(x+56,yy,(w-56-52)*clamp(Math.abs(v)/full,0,1),9);
      }
      label(ctx,x+w,yy+5,isFinite(v)?fmt(v,3):'—','#cfd4de','right',
            '11.5px "SF Mono", Menlo, monospace');
      yy+=17;
    }
    /* Two lines, not one.  As a single line this ran from x = 1100 to 1428 on
       a 1400-wide stage — 28px of it off the canvas, in every view, whenever
       the run was not yet settled, which is most of the time anyone is
       looking.  Found by tools/audit.py, which is what it is for. */
    if(!L.settled){
      label(ctx,x,yy+4,'still settling — '+fmt(L.tconv,1)+' of 12 L/U',
        '#e8843a','left','10px -apple-system, sans-serif');
      label(ctx,x,yy+16,'tunnel flushed '+fmt(L.flushes||0,2)+' of 2 times',
        '#e8843a','left','10px -apple-system, sans-serif');
    }
    ctx.restore();
  }

  /* ================= view B : the model ================= */
  function drawModel(ctx,W,H,M){
    const rx=Math.min(600,W*0.42)+40;
    const rw=Math.max(240,roX(W)-rx-20);
    const boxW=rx-48, boxH=H-140;

    /* --- left: what the solver really has, an infinite extrusion ---
       Clipped to its own box: the extrusion is deliberately long, and without
       a clip it ran under the right-hand column and through the C_p plot. */
    ctx.save();
    ctx.beginPath(); ctx.rect(24,56,boxW,boxH); ctx.clip();
    cam.W=boxW; cam.H=boxH;
    const B=camBasis(cam);
    const ox=24, oy=56;
    const bb=polyBounds(M.outline);
    const sc=1.4/Math.max(bb.w,bb.h,1e-6);
    const span=1.5;
    const quads=[];
    const P=M.outline;
    for(let i=0;i<P.length;i++){
      const a=P[i], b=P[(i+1)%P.length];
      const q=[[(a[0]-0.5)*sc,-span,a[1]*sc],[(b[0]-0.5)*sc,-span,b[1]*sc],
               [(b[0]-0.5)*sc, span,b[1]*sc],[(a[0]-0.5)*sc, span,a[1]*sc]];
      const pr=q.map(p=>project(cam,B,p));
      if(pr.some(p=>!p)) continue;
      const n=[-(b[1]-a[1]),0,(b[0]-a[0])];
      const mid=[(a[0]+b[0])/2*sc-0.5*sc,0,(a[1]+b[1])/2*sc];
      const toEye=v3.norm(v3.sub(B.eye,mid));
      const sh=clamp(0.30+0.55*Math.abs(v3.dot(v3.norm(n),toEye)),0,1);
      quads.push({z:(pr[0].z+pr[1].z+pr[2].z+pr[3].z)/4,pr,col:shade('#5ac8e0',sh)});
    }
    quads.sort((a,b)=>b.z-a.z);
    ctx.translate(ox,oy);
    for(const q of quads){
      ctx.fillStyle=q.col; ctx.beginPath();
      ctx.moveTo(q.pr[0].x,q.pr[0].y);
      for(let k=1;k<4;k++) ctx.lineTo(q.pr[k].x,q.pr[k].y);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle=rgba('#b8ec4c',0.9); ctx.lineWidth=1.8;
    ctx.beginPath();
    let started=false;
    for(let i=0;i<=P.length;i++){
      const a=P[i%P.length];
      const p=project(cam,B,[(a[0]-0.5)*sc,0,a[1]*sc]);
      if(!p){ started=false; continue; }
      if(!started){ ctx.moveTo(p.x,p.y); started=true; } else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
    ctx.restore();
    label(ctx,24+boxW/2,56+boxH+8,'the solver sees this — an infinite-span extrusion',
      '#8b93a6','center','italic 12.5px Georgia, serif');
    { let yy=56+boxH+26;
      for(const ln of wrapText(ctx,'The green outline is the one plane it solves in. '
        +'A real '+(M.body.id==='car'?'car':M.body.id==='rocket'?'rocket':'body')
        +' ends, and the flow goes round the end — which is where a third of a '
        +'road vehicle’s drag lives, and all of a wing’s induced drag.',
        boxW,'10.5px -apple-system, sans-serif')){
        label(ctx,24,yy,ln,'#767e92','left','10.5px -apple-system, sans-serif'); yy+=14; } }

    /* --- right top: the rasterised mask --- */
    const bbp=M.bb;
    const pad=Math.max(3,M.Lc*0.30);
    const gx0=Math.max(0,Math.floor(bbp.x0-pad)), gx1=Math.min(M.nx-1,Math.ceil(bbp.x1+pad));
    const gy0=Math.max(0,Math.floor(bbp.y0-pad)), gy1=Math.min(M.ny-1,Math.ceil(bbp.y1+pad));
    const gw=gx1-gx0+1, gh=gy1-gy0+1;
    const cellsz=Math.min(rw/gw,240/gh);
    const mx=rx, my=68;
    ctx.save();
    for(let x=gx0;x<=gx1;x++) for(let y=gy0;y<=gy1;y++){
      const t=M.node[x*M.ny+y];
      if(t===N_FLUID) continue;
      ctx.fillStyle=t===N_BODY?'#3a4152':'#242832';
      ctx.fillRect(mx+(x-gx0)*cellsz,my+(gy1-y)*cellsz,cellsz+0.5,cellsz+0.5);
    }
    if(cellsz>3.2){
      ctx.strokeStyle=rgba('#2a2f3d',0.55); ctx.lineWidth=0.5;
      for(let x=0;x<=gw;x++){ ctx.beginPath();
        ctx.moveTo(mx+x*cellsz,my); ctx.lineTo(mx+x*cellsz,my+gh*cellsz); ctx.stroke(); }
      for(let y=0;y<=gh;y++){ ctx.beginPath();
        ctx.moveTo(mx,my+y*cellsz); ctx.lineTo(mx+gw*cellsz,my+y*cellsz); ctx.stroke(); }
    }
    ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.6; ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<=M.poly.length;i++){
      const p=M.poly[i%M.poly.length];
      ctx.lineTo(mx+(p[0]-gx0)*cellsz,my+(gy1-p[1])*cellsz);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
    label(ctx,mx,my-12,'the body as the lattice has it','#8b93a6','left',
      'italic 12.5px Georgia, serif');
    label(ctx,mx+rw,my-12,M.nBody+' cells, '+M.frontal+' across the front',
      '#cfd4de','right','11px "SF Mono", Menlo, monospace');
    { let yy=my+gh*cellsz+18;
      const txt='Half-way bounce-back puts the no-slip surface half a cell outside '
        +'each solid node, so the staircase is a real surface — just a rough one. '
        +'The error it leaves shrinks with resolution: at Re 40 this solver returns '
        +'C_D 1.657, 1.628 and 1.623 at 10, 16 and 24 cells across the cylinder, '
        +'extrapolating to 1.618. Measuring the blockage away as well (1.8% at the '
        +'5% used there) gives 1.589, against a published 1.539–1.589.';
      for(const ln of wrapText(ctx,txt,rw,'10.5px -apple-system, sans-serif')){
        label(ctx,mx,yy,ln,'#767e92','left','10.5px -apple-system, sans-serif'); yy+=14; } }

    /* --- right bottom: surface pressure, below the floating readout --- */
    const sy=Math.max(RO_Y+24,my+gh*cellsz+110);
    const ah=Math.max(90,H-sy-64);
    const scp=surfaceCp(M);
    const axw=Math.max(200,W-(rx+44)-56);
    const ax=makeAxes(rx+44,sy,axw,ah,-180,180,-2.4,1.5);
    drawFrame(ctx,ax,'angle around the body, from the tail (deg)','C_p',{nx:6,ny:5});
    ctx.save(); frameClip(ctx,ax,1);
    plotLine(ctx,ax,[[-180,0],[180,0]],'#2a2f3d',1,[3,3]);
    plotLine(ctx,ax,[[-180,1],[180,1]],rgba('#e8843a',0.5),1,[3,3]);
    if(scp.pts.length) plotLine(ctx,ax,scp.pts.map(p=>[p.ang*RAD,p.cp]),'#b8ec4c',1.5);
    ctx.restore();
    label(ctx,ax.x0,sy-8,'surface pressure, read at the wall cells','#8b93a6','left',
      'italic 12.5px Georgia, serif');
    label(ctx,ax.x0+axw,sy-8,'C_p = 1 at a stagnation point','#e8843a','right',
      '10px -apple-system, sans-serif');
  }

  /* ================= view C : the balance ================= */
  function drawBalance(ctx,W,H,M){
    const cd=histView(cdH), cl=histView(clH), cw=histView(cwH);
    const n=cd.length;
    const pad=64, top=58;
    const plotW=Math.max(320,roX(W)-pad-30);
    const hh=(H-top-140)/2;
    const t0=(live.steps-n)*M.uLat/M.href, t1=live.steps*M.uLat/M.href;
    /* Fit the axis to the AVERAGING WINDOW, not to the whole record: an
       impulsive start throws C_D to twenty and would squash the signal the
       view exists to show into one pixel.  The transient is still drawn and
       is clipped by the frame. */
    const i0=Math.floor(n*(live.settled?0.5:0.35));
    let lo=1e30,hi=-1e30;
    for(let i=i0;i<n;i++){ const v=cd[i];
      if(v<lo)lo=v; if(v>hi)hi=v;
      if(isFinite(cw[i])&&live.settled){ if(cw[i]<lo)lo=cw[i]; if(cw[i]>hi)hi=cw[i]; } }
    if(!(lo<hi)){ lo=0; hi=2; }
    const m=0.25*(hi-lo)+1e-3;
    const ax1=makeAxes(pad,top,plotW,hh,t0,Math.max(t1,t0+1),lo-m,hi+m);
    drawFrame(ctx,ax1,'convective times  t U / L','C_D',{nx:6,ny:4});
    ctx.save(); frameClip(ctx,ax1,1);
    plotLine(ctx,ax1,Array.from(cw,(v,i)=>[t0+(i+0.5)*(t1-t0)/n,v]),rgba('#cd35c4',0.5),1.0);
    plotLine(ctx,ax1,Array.from(cd,(v,i)=>[t0+(i+0.5)*(t1-t0)/n,v]),'#b8ec4c',1.2);
    if(isFinite(live.cdMean))
      plotLine(ctx,ax1,[[t0,live.cdMean],[t1,live.cdMean]],'#e8ecf4',1.2,[5,4]);
    if(isFinite(live.cdWake))
      plotLine(ctx,ax1,[[t0,live.cdWake],[t1,live.cdWake]],'#cd35c4',1.4,[2,3]);
    if(n>i0){
      const tS=t0+(t1-t0)*i0/n;
      plotLine(ctx,ax1,[[tS,lo-m],[tS,hi+m]],rgba('#5ac8e0',0.45),1,[2,4]);
    }
    ctx.restore();
    label(ctx,ax1.x0+ax1.w-4,top-8,'balance (momentum exchange)','#b8ec4c','right',
      '10.5px -apple-system, sans-serif');
    label(ctx,ax1.x0+4,top-8,'rake (control volume) · averaging starts at the dotted line',
      '#cd35c4','left','10.5px -apple-system, sans-serif');

    let clo=1e30,chi=-1e30;
    for(let i=i0;i<n;i++){ if(cl[i]<clo)clo=cl[i]; if(cl[i]>chi)chi=cl[i]; }
    if(!(clo<chi)){ clo=-0.5; chi=0.5; }
    const cm=0.25*(chi-clo)+1e-3;
    const ax2=makeAxes(pad,top+hh+62,plotW,hh,t0,Math.max(t1,t0+1),clo-cm,chi+cm);
    drawFrame(ctx,ax2,'convective times  t U / L','C_L',{nx:6,ny:4});
    ctx.save(); frameClip(ctx,ax2,1);
    plotLine(ctx,ax2,[[t0,0],[t1,0]],'#2a2f3d',1);
    plotLine(ctx,ax2,Array.from(cl,(v,i)=>[t0+(i+0.5)*(t1-t0)/n,v]),'#cd35c4',1.2);
    ctx.restore();

    /* the comparison box sits BELOW the floating readout */
    const bx=roX(W)+4, by=RO_Y+16, bw=W-bx-24;
    const rows=[
      ['balance, mean',isFinite(live.cdMean)?fmt(live.cdMean,4):'—','#b8ec4c'],
      ['balance, rms',isFinite(live.cdRms)?fmt(live.cdRms,4):'—','#8b93a6'],
      ['rake, mean',isFinite(live.cdWake)?fmt(live.cdWake,4):'—','#cd35c4'],
      ['rake, this instant',isFinite(live.cdWakeInst)?fmt(live.cdWakeInst,4):'—','#8b93a6'],
      ['tunnel-wall friction removed',isFinite(live.cdWall)?fmt(live.cdWall,4):'—','#8b93a6'],
      ['difference',(isFinite(live.cdMean)&&isFinite(live.cdWake))
        ?fmtPct(Math.abs(live.cdWake-live.cdMean)/Math.max(Math.abs(live.cdMean),1e-9)):'—',
        '#e8ecf4'],
      ['C_L rms',isFinite(live.clRms)?fmt(live.clRms,4):'—','#cd35c4'],
      ['Strouhal',isFinite(live.st)?fmt(live.st,4)
        :(live.settled&&live.stationary===false?'still growing':'—'),'#5ac8e0'],
      ['tunnel flushed',fmt(live.flushes||0,1)+'×','#8b93a6'],
    ];
    ctx.save();
    label(ctx,bx,by,'two independent readings','#e8ecf4','left','italic 13px Georgia, serif');
    let yy=by+22;
    for(const [k,v,c] of rows){
      label(ctx,bx,yy,k,'#8b93a6','left','11.5px -apple-system, sans-serif');
      label(ctx,bx+bw,yy,v,c,'right','11.5px "SF Mono", Menlo, monospace');
      yy+=18;
    }
    yy+=6;
    const note=live.settled
      ? 'The balance sums 2 c_i f_i over the body links; the rake closes a control '
        +'volume between the inlet plane and a plane behind the model, measuring '
        +'both. No common data, so agreement is evidence.'
      : 'Nothing here is a measurement yet. The start-up transient has to leave '
        +'the tunnel first — the counter above is how many times the flow has '
        +'crossed the section, and the means open at two.';
    for(const ln of wrapText(ctx,note,bw,'10.5px -apple-system, sans-serif')){
      label(ctx,bx,yy,ln,live.settled?'#767e92':'#e8843a','left',
        '10.5px -apple-system, sans-serif'); yy+=14;
    }
    ctx.restore();
  }

  /* ================= view D : the wake ================= */
  function drawWake(ctx,W,H,M){
    /* the strip is laid out explicitly rather than by halving a centred rect,
       which left a 90 px hole above it and pushed the table under the readout */
    const sx=26, sw=W-52;
    const sh=Math.min(sw/M.nx*M.ny, 250);
    const R={x:sx+(sw-sh*M.nx/M.ny)/2, y:52, w:sh*M.nx/M.ny, h:sh};
    const T=L2S(R,M);
    paintField(ctx,S,M,'vort',fieldScale(M,'vort'),R.x,R.y,R.w,R.h);
    if(st.outline) strokePoly(ctx,M.poly,T,'#e8ecf4',1.4);
    const stations=[0.10,0.25,0.45,0.70,0.92];
    ctx.save();
    for(const f of stations){
      const X=T.X(Math.round(f*M.nx));
      ctx.strokeStyle=rgba('#b8ec4c',0.5); ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(X,R.y); ctx.lineTo(X,R.y+R.h); ctx.stroke();
    }
    ctx.restore();
    label(ctx,R.x,R.y-8,'vorticity, with the survey stations marked','#8b93a6','left',
      'italic 12.5px Georgia, serif');

    const py=R.y+R.h+44, ph=H-py-72;
    const pw=Math.max(300,roX(W)-70-30);
    const ax=makeAxes(70,py,pw,Math.max(90,ph),0,1.3,0,M.ny);
    drawFrame(ctx,ax,'u / U₀','y (cells)',{nx:5,ny:5});
    ctx.save(); frameClip(ctx,ax,1);
    plotLine(ctx,ax,[[1,0],[1,M.ny]],'#2a2f3d',1,[3,3]);
    let i=0;
    for(const f of stations){
      const c=S.column(Math.round(f*M.nx)), pts=[];
      for(let y=0;y<M.ny;y++) pts.push([c[y]/M.uLat,y]);
      plotLine(ctx,ax,pts,neonCss(0.12+0.75*i/(stations.length-1)),1.4);
      i++;
    }
    ctx.restore();

    const bx=roX(W)+4, bw=W-bx-24;
    ctx.save();
    let yy=RO_Y+16;
    label(ctx,bx,yy,'drag from each station, this instant','#e8ecf4','left',
      'italic 13px Georgia, serif');
    yy+=22;
    label(ctx,bx,yy,'x / L','#8b93a6','left','10.5px -apple-system, sans-serif');
    label(ctx,bx+bw-88,yy,'C_D (rake)','#8b93a6','right','10.5px -apple-system, sans-serif');
    label(ctx,bx+bw,yy,'pressure part','#8b93a6','right','10.5px -apple-system, sans-serif');
    yy+=17; i=0;
    for(const f of stations){
      const w=S.wakeDrag(Math.round(f*M.nx),M.uLat), q=0.5*M.uLat*M.uLat*M.href;
      const col=neonCss(0.12+0.75*i/(stations.length-1));
      label(ctx,bx,yy,fmt(f,2),col,'left','11.5px "SF Mono", Menlo, monospace');
      label(ctx,bx+bw-88,yy,fmt(w.total/q,3),'#cfd4de','right','11.5px "SF Mono", Menlo, monospace');
      label(ctx,bx+bw,yy,fmt(w.pres/q,3),'#8b93a6','right','11.5px "SF Mono", Menlo, monospace');
      yy+=17; i++;
    }
    yy+=8;
    for(const ln of wrapText(ctx,'The control volume closes on the inlet plane, so '
      +'every station should read the same drag — and in steady flow they do, to '
      +'about 1%. Where they scatter, the flow is unsteady: momentum is stored '
      +'between the planes and given back, and only the time average on the '
      +'balance view is a drag.',bw,'10.5px -apple-system, sans-serif')){
      label(ctx,bx,yy,ln,'#767e92','left','10.5px -apple-system, sans-serif'); yy+=14;
    }
    ctx.restore();
  }

  /* ================= view E : the spectrum ================= */
  function hotWire(M){
    /* a streamwise line of u, downstream in the wake — what a hot wire on a
       traverse would give.  Sampled from the current field, not in time,
       which is Taylor's frozen hypothesis and is what a real 1-D spectrum
       assumes too. */
    const y=Math.round(M.y0+0.6*M.frontal);
    const x0=Math.round(0.42*M.nx);
    let n=1; while(x0+n*2<=M.nx-2) n*=2;
    const out=new Float64Array(n);
    for(let i=0;i<n;i++){
      const k=(x0+i)*M.ny+clamp(y,1,M.ny-2);
      out[i]=S.node[k]===N_FLUID?S.ux[k]:M.uLat;
    }
    return out;
  }
  function drawSpectrum(ctx,W,H,M){
    const pad=72, top=58;
    /* both panels stay left of the floating readout: a plot frame drawn under
       it is a plot nobody can read */
    const hw=Math.max(220,(roX(W)-pad-70)/2);
    /* --- left: the hot-wire spectrum --- */
    const sigl=hotWire(M);
    const {P,n}=spectrum(sigl);
    const pts=[];
    for(let i=1;i<P.length;i++){
      const k=TAU*i/n;                    // per cell
      if(P[i]>0) pts.push([Math.log10(k),Math.log10(P[i])]);
    }
    let ylo=1e30,yhi=-1e30;
    for(const p of pts){ if(p[1]<ylo)ylo=p[1]; if(p[1]>yhi)yhi=p[1]; }
    if(!(ylo<yhi)){ ylo=-8; yhi=0; }
    const axh=H-top-214;
    const ax=makeAxes(pad,top,hw,axh,Math.log10(TAU/n),Math.log10(Math.PI),
                      Math.max(ylo,yhi-7),yhi+0.6);
    drawFrame(ctx,ax,'log₁₀ k  (per cell)','log₁₀ E(k)',{nx:5,ny:5});
    ctx.save(); frameClip(ctx,ax,1);
    plotLine(ctx,ax,pts,'#b8ec4c',1.2);
    /* the two slopes, anchored at the same point so only the slope differs */
    const kA=ax.xlo+0.28*(ax.xhi-ax.xlo), eA=yhi-0.7;
    const line=(m,col)=>plotLine(ctx,ax,
      [[ax.xlo,eA+m*(ax.xlo-kA)],[ax.xhi,eA+m*(ax.xhi-kA)]],col,1.3,[6,4]);
    line(-5/3,'#5ac8e0');
    line(-3,'#e8843a');
    ctx.restore();
    label(ctx,ax.x0+ax.w-6,top-8,'k^(−5/3) 3-D   ·   k^(−3) 2-D','#8b93a6','right',
      '10.5px -apple-system, sans-serif');
    label(ctx,ax.x0,top-8,'hot wire in the wake','#8b93a6','left','italic 12.5px Georgia, serif');
    /* the reference slopes only mean something if there is a cascade to compare
       them with; at Re 100 in a laminar wake there is not, and saying so beats
       drawing two authoritative-looking dashed lines against a smooth signal */
    const turbulent=(M.Re>=2000)||st.tu>0;
    label(ctx,ax.x0,top+axh+52,turbulent
      ? 'the dashed lines are slopes, not fits — only their gradient means anything'
      : 'at Re '+fmtRe(M.Re)+' the wake is laminar: there is no inertial range here, '
        +'and the dashed slopes are drawn only for comparison',
      turbulent?'#767e92':'#e8843a','left','10.5px -apple-system, sans-serif');

    /* --- right: the lift spectrum --- */
    const cl=histView(clH);
    const bx=pad+hw+62;
    const sp=cl.length>=64?spectrum(cl):{P:new Float64Array(0),n:0};
    let pmax=1e-30;
    for(let i=1;i<sp.P.length;i++) if(sp.P[i]>pmax) pmax=sp.P[i];
    const pts2=[];
    for(let i=1;i<sp.P.length;i++){
      const fr=i/sp.n;                    // cycles per step
      pts2.push([fr*M.href/M.uLat,sp.P[i]/pmax]);   // -> Strouhal
    }
    const ax2b=makeAxes(bx,top,hw,axh,0,0.5,0,1.08);
    drawFrame(ctx,ax2b,'Strouhal number  f L / U','power (normalised)',{nx:5,ny:5});
    ctx.save(); frameClip(ctx,ax2b,1);
    if(pts2.length) plotLine(ctx,ax2b,pts2,'#cd35c4',1.2);
    if(isFinite(live.st)&&live.st>0){
      plotLine(ctx,ax2b,[[live.st,0],[live.st,1.08]],'#e8ecf4',1.2,[4,4]);
      plotDot(ctx,ax2b,live.st,1.0,'#e8ecf4',3.2);
    }
    if(M.body.id==='cylinder'){
      const ref=CYL_REF.find(r=>Math.abs(Math.log(r.Re/M.Re))<0.35&&r.st);
      if(ref){
        plotLine(ctx,ax2b,[[ref.st[0],0],[ref.st[0],1.08]],rgba('#b8ec4c',0.55),1.1,[2,3]);
        plotLine(ctx,ax2b,[[ref.st[1],0],[ref.st[1],1.08]],rgba('#b8ec4c',0.55),1.1,[2,3]);
      }
    }
    ctx.restore();
    label(ctx,bx,top-8,'the lift signal','#8b93a6','left','italic 12.5px Georgia, serif');
    label(ctx,bx+hw-26,top-8,isFinite(live.st)
      ?'peak at St = '+fmt(live.st,4)
      :(live.settled?'no periodic peak — this wake is not shedding'
                    :'still settling'),'#e8ecf4','right',
      '10.5px -apple-system, sans-serif');
    if(M.body.id==='cylinder')
      label(ctx,ax.x0,top+axh+68,'on the right, green marks the measured Strouhal '
        +'band at this Reynolds number','#b8ec4c','left',
        '10.5px -apple-system, sans-serif');

    /* the caption that is the whole point of this view */
    const cy=H-84;
    const txt='Two dimensions is not three. With no vortex stretching there is no '
      +'forward energy cascade: energy travels UP to large scales and enstrophy '
      +'travels down, so the inertial range steepens from k^(−5/3) to k^(−3). '
      +'That is a property of the equations being solved, not of the resolution — '
      +'refining the grid will not turn this into three-dimensional turbulence.';
    let yy=cy;
    for(const ln of wrapText(ctx,txt,W-2*pad,'11px -apple-system, sans-serif')){
      label(ctx,pad,yy,ln,'#767e92','left','11px -apple-system, sans-serif'); yy+=15;
    }
  }

  /* ================= view F : the sweep ================= */
  function drawSweep(ctx,W,H,M){
    const pad=76, top=58;
    const hw=Math.max(220,(roX(W)-pad-80)/2);
    const hh=H-top-150;
    /* --- C_D vs Re --- */
    const ax=makeAxes(pad,top,hw,hh,1,3.2,0,3.0);
    drawFrame(ctx,ax,'log₁₀ Re','C_D',{nx:5,ny:5});
    ctx.save(); frameClip(ctx,ax,1);
    for(const r of CYL_REF){
      const x=Math.log10(r.Re);
      plotLine(ctx,ax,[[x,r.cd[0]],[x,r.cd[1]]],'#e8843a',2.4);
      plotDot(ctx,ax,x,(r.cd[0]+r.cd[1])/2,'#e8843a',3.0,'#e8843a');
    }
    for(const b of OWN_BENCH)
      plotDot(ctx,ax,Math.log10(b.Re),b.cd,'#5ac8e0',3.0);
    for(const c of collected) if(c.body==='cylinder'&&isFinite(c.cd))
      plotDot(ctx,ax,Math.log10(c.Re),c.cd,'#b8ec4c',3.4);
    if(isFinite(live.cdMean)&&live.settled)
      plotDot(ctx,ax,Math.log10(M.Re),live.cdMean,'#e8ecf4',4.0,'#b8ec4c');
    ctx.restore();
    label(ctx,ax.x0,top-8,'drag','#8b93a6','left','italic 12px Georgia, serif');

    /* --- St vs Re --- */
    const bx=pad+hw+72;
    const ax2=makeAxes(bx,top,hw,hh,1,3.2,0,0.30);
    drawFrame(ctx,ax2,'log₁₀ Re','Strouhal number',{nx:5,ny:5});
    ctx.save(); frameClip(ctx,ax2,1);
    for(const r of CYL_REF){
      if(!r.st) continue;
      const x=Math.log10(r.Re);
      plotLine(ctx,ax2,[[x,r.st[0]],[x,r.st[1]]],'#e8843a',2.4);
      plotDot(ctx,ax2,x,(r.st[0]+r.st[1])/2,'#e8843a',3.0,'#e8843a');
    }
    for(const b of OWN_BENCH) if(isFinite(b.st))
      plotDot(ctx,ax2,Math.log10(b.Re),b.st,'#5ac8e0',3.0);
    for(const c of collected) if(c.body==='cylinder'&&isFinite(c.st)&&c.st>0)
      plotDot(ctx,ax2,Math.log10(c.Re),c.st,'#b8ec4c',3.4);
    if(isFinite(live.st)&&live.st>0&&live.settled)
      plotDot(ctx,ax2,Math.log10(M.Re),live.st,'#e8ecf4',4.0,'#b8ec4c');
    ctx.restore();
    label(ctx,ax2.x0,top-8,'shedding','#8b93a6','left','italic 12px Georgia, serif');

    /* legend + provenance */
    let yy=top+hh+56;
    const leg=[['#e8843a','measured — the published range, five studies'],
               ['#5ac8e0','this solver, run offline to convergence at three grid spacings'],
               ['#b8ec4c','points you have recorded in this session'],
               ['#e8ecf4','the run happening now (only once it has settled)']];
    for(const [c,t] of leg){
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(pad+5,yy-4,3.4,0,TAU); ctx.fill();
      label(ctx,pad+16,yy-4,t,'#8b93a6','left','11px -apple-system, sans-serif');
      yy+=16;
    }
    yy+=4;
    label(ctx,pad,yy,plain(CYL_SRC),'#6b7284','left','10px "SF Mono", Menlo, monospace');
    yy+=15;
    if(M.body.id!=='cylinder')
      label(ctx,pad,yy,'The anchors are for a circular cylinder. You are running a '
        +M.body.name+', so only the green and white points belong to it.',
        '#e8843a','left','10.5px -apple-system, sans-serif');
  }

  /* ---------------- dispatch ---------------- */
  function draw(){
    const ctx=canvas.getContext('2d');
    const W=cam0.W, Hh=cam0.H;
    ctx.clearRect(0,0,W,Hh);
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,Hh);
    drawView(ctx,W,Hh,ensure());
  }
