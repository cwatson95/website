  const cam0={W:1000,H:640};
  function drawView(ctx,W,Hh,M){
    M=M||ensure();
    const v=(M&&M.st?M.st.view:st.view);
    if(v==='section')       drawSection(ctx,W,Hh,M);
    else if(v==='model')    drawModel(ctx,W,Hh,M);
    else if(v==='balance')  drawBalance(ctx,W,Hh,M);
    else if(v==='wake')     drawWake(ctx,W,Hh,M);
    else if(v==='spectrum') drawSpectrum(ctx,W,Hh,M);
    else                    drawSweep(ctx,W,Hh,M);
  }

  return {
    st, cam, cam0, model, reset, draw, drawView, advance, ensure,
    /* A tunnel that has gone unstable stays dead until the flow is rebuilt,
       and a dead tunnel reads as a crash whatever the panel says.  Every
       control now clears it, so touching anything at all is the way out. */
    clearDivergence(){ if(S&&S.diverged){ reset(); return true; } return false; },
    solver:()=>S, live:()=>live, stats:()=>stats(model()),
    /* exposed so the half-cell convention can be asserted directly rather than
       only through a settled run — it is one character and it biases every
       bubble length by 0.5/D if it is wrong */
    rearX:()=>rearSurfaceX(model()), midY:()=>bodyMidY(model()),
    hist:()=>({cd:histView(cdH),cl:histView(clH),cw:histView(cwH)}),
    collected:()=>collected,
    collect(){ const M=model();
      if(!isFinite(live.cdMean)||!live.settled) return false;
      collected.push({Re:M.Re,cd:live.cdMean,st:live.st,body:st.body,D:M.href});
      if(collected.length>60) collected.shift();
      return true; },
    clearCollected(){ collected=[]; },
    readout:()=>readoutHTML(model(),live),
    eqbar:()=>eqbarHTML(model()),
    tag:()=>tagHTML(model(),live),
    step(dt){
      if(!st.anim) return;
      const M=ensure();
      /* keep the work per frame bounded: bigger grids take fewer steps */
      const budget=Math.max(1,Math.round(st.speed*260000/(M.nx*M.ny)));
      advance(budget);
      stats(M);
    },
    pointer(kind,d){
      if(kind!=='move') return;
      if(st.view!=='model') return;
      cam.theta-=d.dx*0.006;
      cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ if(st.view==='model') cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),2.0,20); },
    resetView(){ cam.theta=-2.05; cam.phi=0.34; cam.dist=5.4; },
  };
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['section','the test section'],['model','the model'],
              ['balance','the balance'],['wake','the wake'],
              ['spectrum','the spectrum'],['sweep','the sweep']];
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf,onDone){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onDone) onDone(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  /* a decade slider: the control is log10(value) but the state stays linear,
     because everything downstream wants the Reynolds number, not its log */
  function logSlider(key,lab,loDec,hiDec,fmtf,onDone){
    const inp=h('input',{type:'range',min:loDec,max:hiDec,step:0.01,
                         value:Math.log10(st[key])});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=Math.log10(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=Math.pow(10,parseFloat(inp.value));
      val.textContent=fmtf(st[key]); if(onDone) onDone(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab,onDone){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    /* the checkbox carries its own state key.  syncPanel used to recover it
       from a hardcoded name list indexed by DOM position, which silently
       mismatches the moment a box is inserted anywhere but the end. */
    inp._k=key;
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onDone) onDone(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); refresh(); }},o.name));
    });
    return wrapEl;
  }
  const reflow=()=>{ S.reset(); dirty=true; };

  const gBody=h('div',{class:'grp'},h('h3',null,'the model'));
  gBody.appendChild(chipRow(BODIES,'body',reflow));
  gBody.appendChild(slider('size','size',0.05,0.30,0.005,v=>fmtPct(v)+' of span',reflow));
  gBody.appendChild(slider('alpha','angle of attack',-24,24,0.5,v=>v.toFixed(1)+'°',reflow));
  gBody.appendChild(slider('thick','thickness t/c',0.06,0.24,0.005,v=>v.toFixed(3),reflow));
  gBody.appendChild(slider('slant','rear slant',0,60,1,v=>v.toFixed(0)+'°',reflow));
  gBody.appendChild(slider('ride','ride height',0.005,0.20,0.005,v=>fmtPct(v),reflow));
  gBody.appendChild(slider('fineness','fineness ratio',4,16,0.5,v=>v.toFixed(1),reflow));
  gBody.appendChild(slider('finSpan','fin span',0,3,0.1,v=>v.toFixed(1)+' cal',reflow));
  const bodyTag=h('div',{class:'tag'}); gBody.appendChild(bodyTag);

  const gFlow=h('div',{class:'grp'},h('h3',null,'the flow'));
  gFlow.appendChild(logSlider('Re','Reynolds',1,6.3,v=>fmtRe(v),reflow));
  gFlow.appendChild(slider('Lphys','model length',0.01,3,0.005,v=>v.toFixed(3)+' m',reflow));
  gFlow.appendChild(slider('T','temperature',233,333,0.5,v=>(v-273.15).toFixed(1)+' °C',reflow));
  gFlow.appendChild(slider('P','pressure',20,120,0.5,v=>v.toFixed(1)+' kPa',reflow));
  gFlow.appendChild(slider('mach','lattice Mach',0.02,0.16,0.005,v=>v.toFixed(3),reflow));
  const flowTag=h('div',{class:'tag'}); gFlow.appendChild(flowTag);

  const gTun=h('div',{class:'grp'},h('h3',null,'the tunnel'));
  gTun.appendChild(chipRow(WALLS,'wall',reflow));
  gTun.appendChild(chipRow(RESOLUTIONS,'res',reflow));
  gTun.appendChild(slider('tu','turbulence grid',0,0.14,0.002,
    v=>v>0?fmtPct(v)+' Tu':'off'));
  gTun.appendChild(slider('tuScale','grid scale',8,60,1,v=>v.toFixed(0)+' cells',reflow));
  gTun.appendChild(h('div',{class:'checks'},
    checkbox('trip','trip the wake at t = 0',reflow)));
  const tunTag=h('div',{class:'tag'}); gTun.appendChild(tunTag);

  const gLes=h('div',{class:'grp'},h('h3',null,'sub-grid model'));
  gLes.appendChild(h('div',{class:'checks'},
    checkbox('les','Smagorinsky eddy viscosity',reflow)));
  gLes.appendChild(slider('Cs','C_s',0.05,0.25,0.005,v=>v.toFixed(3),reflow));
  const lesTag=h('div',{class:'tag'}); gLes.appendChild(lesTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'show'));
  gShow.appendChild(chipRow(FIELDS,'field'));
  const checks=h('div',{class:'checks'},
    checkbox('smoke','smoke rake'),
    checkbox('lines','streamlines'),
    checkbox('bubble','reverse flow'),
    checkbox('outline','body outline'),
    checkbox('rake','wake rake plane'),
    checkbox('anim','run'));
  gShow.appendChild(checks);
  gShow.appendChild(slider('rakeX','rake position',0.35,0.95,0.01,v=>fmtPct(v)+' of the section'));
  gShow.appendChild(slider('speed','steps per frame',0.2,4,0.1,v=>v.toFixed(1)+'×'));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.reset(); dirty=true; refresh(); }},'restart the flow'),
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view')));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const okd=S.collect();
      recTag.innerHTML=okd?'recorded — <b>'+S.collected().length+'</b> point(s)'
        :'<span class="r">not settled yet — let it run past 12 L/U</span>';
      dirty=true; refresh(); }},'record this point'),
    h('button',{onclick:()=>{ S.clearCollected(); recTag.innerHTML='';
      dirty=true; refresh(); }},'clear')));
  const recTag=h('div',{class:'tag'}); gShow.appendChild(recTag);
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.reset(); S.resetView();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gBody,gFlow,gTun,gLes,gShow,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    [[gBody,BODIES,'body'],[gTun,WALLS,'wall'],[gShow,FIELDS,'field']].forEach(
      ([g,list,key])=>{
        const cw=g.querySelector('.chips'); if(!cw) return;
        [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      });
    const cws=gTun.querySelectorAll('.chips');
    if(cws[1]) [].forEach.call(cws[1].children,(b,i)=>
      b.className='chip'+(RESOLUTIONS[i].id===st.res?' on':''));
  }
  function syncPanel(){
    const v=st.view, b=st.body;
    rows.thick.row.hidden   = b!=='naca';
    rows.slant.row.hidden   = b!=='wedge';
    rows.ride.row.hidden    = !(b==='car'||b==='wedge');
    rows.fineness.row.hidden= b!=='rocket';
    rows.finSpan.row.hidden = b!=='rocket';
    rows.alpha.row.hidden   = (b==='cylinder');
    rows.Cs.row.hidden      = !st.les;
    rows.tuScale.row.hidden = !(st.tu>0);
    rows.rakeX.row.hidden   = !(v==='section'||v==='balance');
    rows.speed.row.hidden   = !st.anim;
    gShow.hidden=false;
    for(const k in rows) rows[k].sync();
    /* every checkbox in the panel, wherever it lives, from its own key */
    [].forEach.call(panel.querySelectorAll('input[type=checkbox]'),inp=>{
      if(inp._k!==undefined) inp.checked=st[inp._k]; });
  }

  function refresh(){
    try{
      S.clearDivergence();          // any control at all restarts a dead run
      const M=S.model(); S.ensure();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      const L=S.live();
      hintEl.textContent = st.view==='model'
        ? 'drag to orbit the extrusion · scroll to zoom'
        : st.view==='section'
        ? 'space runs and pauses · r restarts the flow · 1–6 switch views'
        : st.view==='sweep' ? 'let a run settle, then “record this point” drops it on the plot'
        : st.view==='spectrum' ? 'the two dashed lines are slopes, not fits — only their gradient means anything'
        : 'the two drag readings come from disjoint data; they should agree';
      subEl.innerHTML='Re = <b>'+fmtRe(M.Re)+'</b>'
        +(M.gridLimited?' <span class="r">(ceiling — you asked for '+fmtRe(M.ReAsk)
                        +')</span>':'')
        +' &middot; '+M.nx+'×'+M.ny+' lattice &middot; '
        +'τ₊ = '+fmt(M.tau,5)
        +(M.Cs?' &middot; sub-grid '+(M.lesAuto?'on automatically':'on'):'');
      bodyTag.innerHTML=M.body.note
        +(M.rideClamped?'<br><span class="r">ride height held at '+fmt(M.rideCells,1)
          +' cells</span> — thinner than that and the model rasterises onto the belt':'');
      /* the ceiling goes next to the slider that runs into it, so it is not a
         surprise discovered by dragging into a dead zone */
      flowTag.innerHTML='ν<sub>air</sub> = <b>'+M.nuAir.toExponential(3)+'</b> m²/s &nbsp; '
        +'that Re is <b>'+fmt(M.Uphys,1)+'</b> m/s on a <b>'+fmt(M.Lphys,3)+'</b> m model'
        +' (M '+fmt(M.machPhys,3)+')<br>one step = <b>'+fmtTime(M.dtPhys)+'</b>'
        +' &nbsp; this section tops out at Re <b'+(M.gridLimited?' class="r"':'')+'>'
        +fmtRe(M.ReCeil)+'</b>';
      tunTag.innerHTML='blockage <b'+(M.blockage>0.10?' class="r"':' class="g"')+'>'
        +fmtPct(M.blockage)+'</b>'
        +(st.tu>0?' &nbsp; Tu asked <b>'+fmtPct(st.tu)+'</b>, measured <b>'
          +(isFinite(L.tuMeas)?fmtPct(L.tuMeas):'—')+'</b>':'');
      lesTag.innerHTML=M.les
        ? (M.lesAuto?'<b class="r">on automatically</b> — this Reynolds number is past '
                    +'what the bare lattice can carry &nbsp; ':'')
          +(M.CsHeld?'<b class="r">C<sub>s</sub> held at '+fmt(M.Cs,2)+'</b> &nbsp; ':'')
          +'ν<sub>t</sub>/ν up to <b>'+(isFinite(L.tauMax)
            ?fmt((L.tauMax-0.5)/Math.max(M.tau-0.5,1e-12)-1,2):'—')+'</b>'
        : 'off — every eddy the grid can carry is resolved, and the ones it cannot are simply missing';
      infoEl.innerHTML=INFO[st.view]||INFO.section;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* every interaction that changes what is drawn must ask for a frame:
     the loop only draws on its own while the solver is running.
     (steam_carnot_cycle.html Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.reset(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam0.W=r.width; S.cam0.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0, tick=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    if(st.anim){ S.step(dt); dirty=true;
      if((++tick%12)===0){ roEl.innerHTML=S.readout(); tagEl.innerHTML=S.tag(); } }
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

const INFO={
  section:'The picture is the answer, not an illustration of it. Every frame is several '
    +'hundred lattice-Boltzmann steps, and the vortex street, the separation and the '
    +'recirculation behind the body are what the discrete Navier–Stokes equations do '
    +'when you give them this shape at this <b>Reynolds number</b>. Change Re and watch '
    +'the wake change character: steady and symmetric below about 47 for a cylinder, then '
    +'periodic shedding, then a wake that never repeats. The <b>smoke</b> is passive '
    +'tracers on the solved field — the same thing a smoke rake is in a real tunnel. '
    +'The <b>streamlines</b> are a different curve entirely: tangent to the velocity at '
    +'one instant, where the smoke is the streakline a tracer actually leaves behind. '
    +'They coincide only in steady flow, and the point of a shedding wake is that it is '
    +'not steady. Turn them on to see the closed <b>recirculation bubble</b>, which the '
    +'smoke can never show you because tracers do not enter it. The orange patch is '
    +'exactly where the streamwise velocity has changed sign. '
    +'The wake is <b>tripped</b> at t = 0 — see the tunnel panel; without it you would '
    +'wait about three minutes for the street to appear.',
  model:'Two things the flow sees that are easy to forget. First, the solver is '
    +'<b>two-dimensional</b>: the body it has is an infinite extrusion of this outline, '
    +'so there are no wingtips, no trailing vortices and no induced drag. A road car&rsquo;s '
    +'drag coefficient is not comparable to anything on this page. Second, the body is '
    +'<b>rasterised</b>: the lattice can only place a wall half-way between nodes, so a '
    +'curved surface becomes a staircase. That error is real and it falls as 1/D — which '
    +'is why the same case is run at three grid spacings before any number is believed.',
  balance:'A real tunnel does not trust one instrument. The <b>balance</b> here is the '
    +'momentum exchanged across the body links each step — the force the fluid actually '
    +'delivers to the solid. The <b>rake</b> is a survey of the wake a body-length or two '
    +'downstream, converting the momentum the flow lost into a drag. The two share no '
    +'data and no assumptions, so their agreement is a genuine check on both. Watch the '
    +'trace settle: the mean over a start-up transient is not a measurement, and the '
    +'averaging window here refuses to open before twelve convective times have passed.',
  wake:'Drag is momentum that went missing. The profiles are the streamwise velocity '
    +'across the section at five stations, and the hole in them behind the body is the '
    +'<b>momentum deficit</b> — integrate it and you have the drag, which is the third '
    +'column in the table. The pressure column is the part the classical rake formula '
    +'throws away: it is only small once the wake has spread and the static pressure has '
    +'come back to freestream, which is precisely why a rake is never put right behind '
    +'the model.',
  spectrum:'The left plot is a hot wire in the wake and the right one is the lift signal. '
    +'The lift spectrum has a sharp peak because vortex shedding is periodic, and its '
    +'position is the <b>Strouhal number</b>. The hot-wire spectrum is where the honesty '
    +'lives: real three-dimensional turbulence hands energy down to the small scales with '
    +'a k<sup>−5/3</sup> inertial range, but a two-dimensional flow has no vortex '
    +'stretching, so energy goes the other way and it is <b>enstrophy</b> that cascades, '
    +'giving k<sup>−3</sup>. No amount of grid refinement changes which of those two '
    +'slopes this solver is on.',
  sweep:'The orange bars are measured — the published spread across five independent '
    +'studies of a circular cylinder, drawn as ranges because that is what the literature '
    +'actually agrees on. The blue points are this solver run offline to convergence at '
    +'three grid spacings. Let a case settle and press <b>record this point</b> and your '
    +'own run joins them. The interesting thing is not that they agree, it is <b>where</b> '
    +'they stop agreeing: coarsen the grid, raise the blockage, or push the Reynolds '
    +'number past what the lattice can resolve, and you can watch a plausible-looking '
    +'simulation walk off the measured band.'};

/* ================================================================== *
 *  self-test                                                          *
 *  Reference values marked (numpy) come from an independent NumPy     *
 *  implementation of the same scheme, written first; values marked    *
 *  (exact) are closed forms.  A test that recomputed nothing is not   *
 *  a test, so every solver assertion is against one or the other.     *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond){ pass++; } else { fail++; console.log('FAIL — '+name); } };
  const chk=(name,got,want,tol,rel)=>{
    const e=rel?Math.abs(got-want)/Math.abs(want):Math.abs(got-want);
    if(e<=tol) pass++; else { fail++;
      console.log('FAIL — '+name+': got '+Number(got).toPrecision(14)
                  +' want '+Number(want).toPrecision(14)+' err '+e.toExponential(3)); } };

  /* ---------- colour parsing: mix() output must be legal mix() input ------- */
  ok(toRgb('#b8ec4c').join()==='184,236,76','toRgb parses #rrggbb');
  ok(toRgb('rgb(58,111,142)').join()==='58,111,142','toRgb parses rgb()');
  ok(toRgb(mix('#070b18','#b8ec4c',0.4)).length===3,'mix output re-parses');
  { let threw=false; try{ toRgb('chartreuse'); }catch(e){ threw=true; }
    ok(threw,'toRgb THROWS on an unparseable colour rather than defaulting to black'); }
  { const c=toRgb(shade(mix('#cd35c4','#d8f59a',0.5),0.9));
    ok(c[0]+c[1]+c[2]>150,'two-stage blend stays bright (not the rgb(0,0,0) failure)'); }
  { /* the field ramps must stay in gamut and must actually move */
    let bad=0, dark=0;
    for(let i=0;i<=20;i++){
      const a=divergeCol(2*i/20-1), b=rampCol(i/20);
      for(const v of a.concat(b)) if(!(v>=0&&v<=255)) bad++;
      if(i===10&&a[0]+a[1]+a[2]>90) dark++;
    }
    ok(bad===0,'both field ramps stay inside 0..255');
    ok(dark===0,'the diverging ramp is dark at zero, so zero reads as "nothing here"');
    ok(rampCol(1)[0]+rampCol(1)[1]+rampCol(1)[2]>rampCol(0)[0]+rampCol(0)[1]+rampCol(0)[2]+150,
       'the scalar ramp gets brighter with the value'); }

  /* ---------- D2Q9 lattice moments: these ARE the scheme ------------------ */
  { const S=(px,py)=>{ let s=0;
      for(let i=0;i<9;i++) s+=LW[i]*Math.pow(CX[i],px)*Math.pow(CY[i],py); return s; };
    chk('sum w = 1 (exact)',S(0,0),1,1e-15,false);
    chk('sum w c_x = 0 (exact)',S(1,0),0,1e-16,false);
    chk('sum w c_y = 0 (exact)',S(0,1),0,1e-16,false);
    chk('sum w c_x c_x = c_s^2 (exact)',S(2,0),CS2,1e-16,false);
    chk('sum w c_y c_y = c_s^2 (exact)',S(0,2),CS2,1e-16,false);
    chk('sum w c_x c_y = 0 (exact)',S(1,1),0,1e-16,false);
    chk('sum w c_x^3 = 0 (exact)',S(3,0),0,1e-16,false);
    chk('sum w c_x^2 c_y = 0 (exact)',S(2,1),0,1e-16,false);
    chk('sum w c_x^4 = 3 c_s^4 (exact)',S(4,0),3*CS2*CS2,1e-16,false);
    chk('sum w c_x^2 c_y^2 = c_s^4 (exact)',S(2,2),CS2*CS2,1e-16,false);
    chk('sum w c_x^3 c_y = 0 (exact)',S(3,1),0,1e-16,false);
    /* opposite/mirror tables must be involutions and must really reverse */
    let bad=0;
    for(let i=0;i<9;i++){
      if(OPP[OPP[i]]!==i) bad++;
      if(CX[OPP[i]]!==-CX[i]||CY[OPP[i]]!==-CY[i]) bad++;
      if(MIRY[MIRY[i]]!==i) bad++;
      if(CX[MIRY[i]]!==CX[i]||CY[MIRY[i]]!==-CY[i]) bad++;
      if(LW[OPP[i]]!==LW[i]||LW[MIRY[i]]!==LW[i]) bad++;
    }
    ok(bad===0,'OPP reverses c and MIRY reflects c_y, both involutions, weights preserved'); }

  /* ---------- the truncated equilibrium: moments 0,1,2 are EXACT ---------- */
  { const feq=(r,X,Y)=>{ const usq=1.5*(X*X+Y*Y), o=[];
      for(let i=0;i<9;i++){ const cu=3*(CX[i]*X+CY[i]*Y);
        o.push(LW[i]*r*(1+cu+0.5*cu*cu-usq)); } return o; };
    let w0=0,w1=0,w2=0,w3=0;
    for(let a=-3;a<=3;a++) for(let b=-3;b<=3;b++){
      const X=a/12, Y=b/12, r=1.1, f=feq(r,X,Y);
      let m0=0,mx=0,my=0,mxx=0,mxy=0,myy=0,mxxx=0;
      for(let i=0;i<9;i++){ m0+=f[i]; mx+=f[i]*CX[i]; my+=f[i]*CY[i];
        mxx+=f[i]*CX[i]*CX[i]; mxy+=f[i]*CX[i]*CY[i]; myy+=f[i]*CY[i]*CY[i];
        mxxx+=f[i]*CX[i]*CX[i]*CX[i]; }
      w0=Math.max(w0,Math.abs(m0-r));
      w1=Math.max(w1,Math.abs(mx-r*X),Math.abs(my-r*Y));
      w2=Math.max(w2,Math.abs(mxx-(r*CS2+r*X*X)),Math.abs(myy-(r*CS2+r*Y*Y)),
                     Math.abs(mxy-r*X*Y));
      /* c_x^3 = c_x on this lattice, so the third moment is rho*u_x and the
         continuum value rho(u_x^3 + 3 c_s^2 u_x) is missed by exactly rho u_x^3 */
      w3=Math.max(w3,Math.abs(mxxx-r*X));
    }

  /* ---------- plane Poiseuille: exact under TRT, NOT exact under BGK ------ */
  function poiseuille(nyf,tau,G,steps,lambda){
    const save=TRT_LAMBDA;
    if(lambda!==undefined) TRT_LAMBDA=lambda;
    const ny=nyf+2, S=mkSolver(3,ny);
    for(let x=0;x<3;x++){ S.node[x*ny+0]=N_WALL; S.node[x*ny+ny-1]=N_WALL; }
    S.buildLinks(); S.tau=tau; S.gx=G;
    S.setEquilibrium(1,0,0);
    for(let i=0;i<steps;i++) S.step();
    S.macro();
    const nu=nuOfTau(tau), h=nyf;
    let worst=0, centre=0;
    for(let y=1;y<=nyf;y++){
      const yc=y-(ny-1)/2;
      const ex=(G/(2*nu))*(h*h/4-yc*yc);
      const got=S.ux[1*ny+y];
      if(y===((nyf>>1)+1)) centre=got;
      worst=Math.max(worst,Math.abs(got-ex));
    }
    const umax=G*h*h/(8*nu);
    TRT_LAMBDA=save;
    return {worst:worst/umax,centre,umax};

  /* ---------- nu = c_s^2 (tau - 1/2): measured, and second order ---------- */
  function shearWave(ny,tau){
    const S=mkSolver(3,ny);
    S.tau=tau;
    const k=TAU/ny, A=1e-3;
    S.initFrom((x,y,o)=>{ o[0]=1; o[1]=A*Math.sin(k*(y+0.5)); o[2]=0; return o; });
    /* the initial amplitude must be MEASURED, not assumed: a sine sampled at
       integer y does not reach A, and using A as the reference puts a bias of
       -ln(max|sin|) into the decay rate that has nothing to do with viscosity */
    let a0=0;
    for(let y=0;y<ny;y++) a0=Math.max(a0,Math.abs(S.ux[1*ny+y]));
    const steps=Math.max(20,Math.round(0.4/(nuOfTau(tau)*k*k)));
    for(let i=0;i<steps;i++) S.step();
    S.macro();
    let a1=0;
    for(let y=0;y<ny;y++) a1=Math.max(a1,Math.abs(S.ux[1*ny+y]));
    return Math.abs(-Math.log(a1/a0)/(k*k*steps)/nuOfTau(tau)-1);
  }

  /* ---------- Taylor-Green: an exact unsteady solution of 2-D NS ---------- */
  function taylorGreen(n,tau,U,steps){
    const S=mkSolver(n,n);
    S.tau=tau;
    const k=TAU/n;
    S.initFrom((x,y,o)=>{ o[0]=1;
      o[1]=-U*Math.cos(k*(x+0.5))*Math.sin(k*(y+0.5));
      o[2]= U*Math.sin(k*(x+0.5))*Math.cos(k*(y+0.5)); return o; });
    for(let i=0;i<steps;i++) S.step();
    S.macro();
    return S;
  }

    for(let k=0;k<S.N;k++){ sr+=S.rho[k]; su+=S.ux[k]*S.ux[k]+S.uy[k]*S.uy[k]; }
    chk('Taylor-Green 16^2, 25 steps: sum rho (numpy)',sr,2.559999999999995e+02,1e-10,false);
    chk('   sum |u|^2 (numpy)',su,3.959899915577093e-02,1e-11,true);
    chk('   u_x[3][5] (numpy)',S.ux[3*16+5],-2.905530963930406e-03,1e-11,true);
    chk('   u_y[11][2] (numpy)',S.uy[11*16+2],-9.706876965365483e-03,1e-11,true);
    /* and against the analytic decay, which is the physics rather than a port */
    const n=48, tau=0.8, U=0.02, k=TAU/n;
    const nu=nuOfTau(tau), steps=Math.round(0.5/(nu*2*k*k));
    const T=taylorGreen(n,tau,U,steps);
    let amp=0;
    for(let i=0;i<T.N;i++) amp=Math.max(amp,Math.abs(T.ux[i]));
    const exact=U*Math.exp(-nu*2*k*k*steps);
    chk('Taylor-Green amplitude follows exp(-2 nu k^2 t) (exact NS solution)',
        amp,exact,0.02,true);
    /* the spatial pattern, not just the amplitude */
    let l2=0, ref=0;
    for(let x=0;x<n;x++) for(let y=0;y<n;y++){
      const ex=-exact*Math.cos(k*(x+0.5))*Math.sin(k*(y+0.5));
      const ey= exact*Math.sin(k*(x+0.5))*Math.cos(k*(y+0.5));
      const dx=T.ux[x*n+y]-ex, dy=T.uy[x*n+y]-ey;
      l2+=dx*dx+dy*dy; ref+=ex*ex+ey*ey;

    for(let x=0;x<nx;x++){ S.node[x*ny+0]=wallType; S.node[x*ny+ny-1]=wallType; }

    for(let x=0;x<nx;x++) for(let y=0;y<ny;y++)
      if((x-30)*(x-30)+(y-24)*(y-24)<=(D/2)*(D/2)) S.node[x*ny+y]=N_BODY;
    S.buildLinks();

    for(let i=0;i<12000;i++){ S.step(up,vp); if(i>=11000){ fs+=S.Fx; n++; } }
    S.macro();
    return {S,u0,D,q:0.5*u0*u0*D,cdBal:fs/n/(0.5*u0*u0*D),nx};

  { const nx=24, ny=24, S=mkSolver(nx,ny);
    const set=(fn)=>{ for(let x=0;x<nx;x++) for(let y=0;y<ny;y++){

    const qTensor=(x,y)=>{ const g=[0,0,0,0]; S.velGrad(x,y,g);

    chk('   and the closed form equals the tensor definition',

    chk('   tensor definition agrees',S.qcrit(6,15),qTensor(6,15),1e-16,false);
    chk('   and that field is irrotational',S.vorticity(6,15),0,1e-16,false);

       which is exactly the sort of assertion that passes while the code is

    set((x,y)=>[2*A*(x-cx), A*(y-cy)]);                 // S_xx = 2A, S_yy = A

    set((x,y)=>[-W*(y-cy), W*(x-cx)]);                 // solid-body rotation

    const setUniform=(a,b)=>{ for(let k=0;k<nx*ny;k++){ S.ux[k]=a; S.uy[k]=b; } };
    for(const phiStar of [127,140,95]){
      const p=phiStar*Math.PI/180;
      setUniform(1,-Math.tan(p));
      const got=S.separationAngle(cx,cy,R);
      chk('separation angle: sign change put at phi = '+phiStar
          +' deg reads theta_s = '+(180-phiStar)+' deg from the BASE',
          got,180-phiStar,0.02,false);
    }
    setUniform(1,0);
    ok(!isFinite(S.separationAngle(cx,cy,R)),
       '   and an unseparated field returns nothing, not an endpoint'); }

  /* ---------- the trip: divergence-free, correctly scaled, and local ------ */
  { const M={href:16, bb:{x0:40,x1:56,y0:40,y1:56}, uLat:0.05, nx:200, ny:100};
    const T=makeTrip(M,TRIP_AMP);
    const o=[0,0];
    /* the realised peak transverse velocity is what the normalisation claims */
    let peak=0;
    for(let x=0;x<200;x+=0.25) for(let y=20;y<80;y+=0.25){
      T.at(x,y,o); if(Math.abs(o[1])>peak) peak=Math.abs(o[1]); }
    chk('the trip peaks at exactly TRIP_AMP times the freestream',
        peak,TRIP_AMP*M.uLat,1e-3,true);
    /* divergence-free by construction: the CONTINUOUS divergence is zero, so
       the discrete one is pure truncation and must be tiny next to the
       velocity gradient it is made of */
    let maxDiv=0, maxGrad=0;
    const h=0.5, o2=[0,0], o3=[0,0];
    for(let x=30;x<130;x+=1) for(let y=25;y<75;y+=1){
      T.at(x+h,y,o2); T.at(x-h,y,o3); const dudx=(o2[0]-o3[0])/(2*h);
      const gx=(o2[1]-o3[1])/(2*h);
      T.at(x,y+h,o2); T.at(x,y-h,o3); const dvdy=(o2[1]-o3[1])/(2*h);
      maxDiv=Math.max(maxDiv,Math.abs(dudx+dvdy));
      maxGrad=Math.max(maxGrad,Math.abs(dudx),Math.abs(dvdy),Math.abs(gx)); }
    ok(maxDiv/maxGrad<2e-3,'the trip is divergence-free to truncation ('
       +(maxDiv/maxGrad).toExponential(2)+' of the local gradient) — it is a curl');
    /* and it is LOCAL — a near-wake blob, not a global reshuffle of the field.
       A Gaussian is never identically zero, so the claim is quantitative: at
       the inlet plane the perturbation is under 1% of its own peak and under
       0.1% of the freestream.  (It could not corrupt the inlet even if it
       were larger: Zou/He rewrites that column every step, so the initial
       condition there survives exactly zero steps.  This is about the trip
       being a local perturbation of the wake, which is what makes calling it
       a transient honest.) */
    T.at(2,50,o);
    const atIn=Math.abs(o[0])+Math.abs(o[1]);
    ok(atIn<0.01*peak&&atIn<1e-3*M.uLat,'the trip is local: at the inlet it is '
       +(atIn/peak).toExponential(1)+' of its own peak and '
       +(atIn/M.uLat).toExponential(1)+' of the freestream');
    T.at(198,50,o);
    ok(Math.abs(o[0])+Math.abs(o[1])<1e-6*peak,'and utterly gone by the outlet');
    /* trip off is the same code path with a zero perturbation, not a branch */
    const icOff=tripIC(M,null), dst=[0,0,0];
    icOff(77,50,dst);
    ok(dst[0]===1&&dst[1]===M.uLat&&dst[2]===0,
       'with the trip off the initial condition is exactly the uniform field'); }

  /* ---------- and the trip does not move the answer ----------------------
     The claim that matters.  A limit cycle -- or here, more cheaply, a steady
     state -- is an attractor: it cannot remember the initial condition that
     reached it.  Two Re 40 cylinders, identical but for the trip, run to the
     same time and required to agree on both the drag and the bubble length.
     If this ever goes red the trip is not a transient and the file's
     validation against the literature no longer transfers. */
  { function steadyCase(useTrip){
      const nx=110, ny=46, S=mkSolver(nx,ny);
      for(let x=0;x<nx;x++){ S.node[x*ny+0]=N_SLIP; S.node[x*ny+ny-1]=N_SLIP; }
      const D=7, cx=28, cy=23;
      for(let x=0;x<nx;x++) for(let y=0;y<ny;y++)
        if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=(D/2)*(D/2)) S.node[x*ny+y]=N_BODY;
      S.buildLinks();
      const u0=0.06;
      S.tau=tauOfNu(u0*D/40);
      const M={href:D, bb:{x0:cx-D/2,x1:cx+D/2,y0:cy-D/2,y1:cy+D/2}, uLat:u0};
      S.initFrom(tripIC(M,useTrip?makeTrip(M,TRIP_AMP):null));
      const up=new Float64Array(ny).fill(u0), vp=new Float64Array(ny);
      up[0]=0; up[ny-1]=0;
      for(let i=0;i<9000;i++) S.step(up,vp);
      S.macro();
      let last=-1;
      for(let x=0;x<nx;x++) if(S.node[x*ny+cy]===N_BODY) last=x;
      const b=S.wakeBubble(last+0.5,cy);
      return {cd:S.Fx/(0.5*u0*u0*D), ls:b.ls/D, found:b.found};
    }
    const A=steadyCase(false), B=steadyCase(true);
    ok(A.found&&B.found,'a steady Re 40 cylinder has a closed bubble either way');
    chk('the trip does not move the converged C_D',B.cd,A.cd,2e-3,true);
    chk('the trip does not move the converged bubble length',B.ls,A.ls,5e-3,true);
    /* and the bubble it finds is the right size for Re 40 at this resolution.
       The literature is 2.20-2.26 for an UNBOUNDED cylinder; this section is
       15% blocked and the body is 7 cells across, so it is not comparable to
       three digits and is not compared to three digits -- what is asserted is
       that it is the same quantity, not a different one. */
    ok(A.ls>1.6&&A.ls<3.0,'and it is the right size for Re 40: L_s/D = '
       +fmt(A.ls,3)+' at D = 7 in a 15%-blocked section (unbounded: 2.20-2.26)'); }

  /* ---------- the rear SURFACE, not the rear node -------------------------
     One character (+0.5) that biases every bubble length by 0.5/D.  Asserted
     against the rasterised mask directly, so it does not need a settled run
     and cannot be satisfied by a helper that merely returns something
     plausible. */
  { const SC=makeScene({});
    Object.assign(SC.st,DEFAULTS,{body:'cylinder',Re:40});
    const M=SC.ensure();
    const yc=Math.round(SC.midY());
    let last=-1, first=-1;
    for(let x=0;x<M.nx;x++) if(M.node[x*M.ny+yc]===N_BODY){ if(first<0) first=x; last=x; }
    ok(last>first,'the cylinder occupies a run of cells on its centreline ('
       +(last-first+1)+' of a nominal '+M.href+')');
    chk('the rear reference is the SURFACE — half a cell outside the last solid node',
        SC.rearX(),last+0.5,1e-12,false);
    ok(Math.abs(SC.midY()-0.5*(M.bb.y0+M.bb.y1))<1e-12,
       'and the centreline is the body centreline'); }

  /* ---------- the separation ring sits in the boundary layer --------------
     theta_s is read off a ring just outside the body.  A uniform test field
     cannot pin that radius, because the answer for a uniform field does not
     depend on it — so it is pinned here instead, on a field with real radial
     structure: a potential doublet plus a circulation, whose tangential
     velocity vanishes at an angle that DOES move with radius.  If the ring is
     pushed out of the near-wall region the angle it reports changes, and this
     is the assertion that notices. */
  { const nx=90, ny=90, S=mkSolver(nx,ny);
    /* On the ring the tangential component works out to
           u_t(phi) = U sin(phi) (1 + R^2/rr^2)  -  Gam/rr,
       a half-sine minus a constant, so a POSITIVE Gam pulls the ends below
       zero and puts a descending crossing at sin(phi) = Gam/(rr U (1+R^2/rr^2)).
       At rr = R+1.2 that is phi = 153.4 deg and at rr = R+6 it is 156.1 deg --
       a 2.7 deg move, which is the thing being asserted. */
    const cx=45, cy=45, R=10, Uinf=0.05, Gam=0.9*Uinf*R;
    /* u = U(1 - R^2/r^2 cos2t, -R^2/r^2 sin2t) + circulation, in Cartesians */
    for(let x=0;x<nx;x++) for(let y=0;y<ny;y++){
      const dx=x-cx, dy=y-cy, r2=dx*dx+dy*dy;
      const k=x*ny+y;
      if(r2<R*R){ S.ux[k]=0; S.uy[k]=0; S.node[k]=N_BODY; continue; }
      const r4=r2*r2;
      S.ux[k]=Uinf*(1-R*R*(dx*dx-dy*dy)/r4)-Gam*dy/r2;
      S.uy[k]=Uinf*(-R*R*2*dx*dy/r4)+Gam*dx/r2;
    }
    const near=S.separationAngle(cx,cy,R,1.2);
    const far =S.separationAngle(cx,cy,R,6.0);
    ok(isFinite(near),'the doublet-plus-circulation field separates at theta_s = '
       +fmt(near,1)+' deg on a ring 1.2 cells out');
    ok(!isFinite(far)||Math.abs(far-near)>1.5,
       '   and the reading genuinely moves when the ring is pushed to 6 cells ('
       +(isFinite(far)?fmt(far,1)+' deg':'no crossing')
       +') — the radius is a real choice, not a free parameter');
    /* and the DEFAULT is that choice.  Without this the two calls above both
       pass dr explicitly, so the 1.2 in the signature is pinned by nothing and
       could be changed to anything at all without a test noticing. */
    chk('   the default ring really is 1.2 cells out',
        S.separationAngle(cx,cy,R),near,1e-12,false); }

  /* ---------- the slow benchmark, opt-in ---------------------------------- */
  if(typeof globalThis!=='undefined'&&globalThis.SLOW){
    console.log('  running the cylinder benchmark (slow)…');
    const r=benchCylinder(100,12,26000);
    ok(r.cd>1.30&&r.cd<1.48,'Re 100 cylinder: C_D = '+fmt(r.cd,4)
       +' (measured range 1.325–1.460)');
    ok(r.st>0.158&&r.st<0.175,'Re 100 cylinder: St = '+fmt(r.st,4)
       +' (measured range 0.163–0.170)');
    const r40=benchCylinder(40,12,26000);
    ok(r40.cd>1.50&&r40.cd<1.75,'Re 40 cylinder: C_D = '+fmt(r40.cd,4)
       +' (measured 1.539–1.589 in the continuum limit; the staircase reads high '
       +'at this spacing and falls as 1/D)');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* the offline benchmark, also used by selfTest when globalThis.SLOW is set */
function benchCylinder(Re,D,steps){
  const ny=20*D, nx=40*D, u0=0.06;
  const S=makeSolver(nx,ny);
  for(let x=0;x<nx;x++){ S.node[x*ny+0]=N_SLIP; S.node[x*ny+ny-1]=N_SLIP; }
  const cx=10*D, cy=ny>>1, r2=(D/2)*(D/2);
  for(let x=0;x<nx;x++) for(let y=0;y<ny;y++)
    if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r2) S.node[x*ny+y]=N_BODY;
  S.buildLinks();
  S.tau=tauOfNu(u0*D/Re);
  S.setEquilibrium(1,u0,0);
  const up=new Float64Array(ny).fill(u0), vp=new Float64Array(ny);
  up[0]=0; up[ny-1]=0;
  const q=0.5*u0*u0*D;
  const keep=Math.floor(steps*0.45);
  const cl=new Float64Array(steps-keep);
  let s=0, n=0;
  for(let i=0;i<steps;i++){
    S.step(up,vp);
    if(i>=keep){ s+=S.Fx/q; cl[n]=S.Fy/q; n++; }
  }
  const fr=peakFreq(cl);
  return {cd:s/n, st:fr*D/u0, tau:S.tau};
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
