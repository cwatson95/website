function drawNewelPlot(ctx,W,H,b,Nw){
  const xs=Nw.map(r=>r.ri*100), ys=Nw.map(r=>r.umax*1000);
  const lo=0, hi=Math.max(...ys)*1.1;
  axesT(ctx,b,xs[0],xs[xs.length-1],lo,hi,{title:titleFor(b,'the whole stair’s largest sag under its own weight, mm, against the inner radius','stair sag, mm'),xlab:'inner stringer radius, cm',ny:4});
  polyline(ctx,b,xs,ys,xs[0],xs[xs.length-1],lo,hi,COL.pos,2);
  const cur=Nw.find(r=>Math.abs(r.ri-ST.ri)<1e-9);
  if(cur) marker(ctx,b,xs[0],xs[xs.length-1],lo,hi,cur.ri*100,cur.umax*1000,COL.live);
  HIT.push({kind:'ri',b,lo:xs[0]/100,hi:xs[xs.length-1]/100});
}
/* the stair's own sag at a set of inner radii (each its own frame; cached) */
const NEWEL_R=[0.06,0.08,0.10,0.12,0.15,0.18,0.20,0.24,0.28,0.32,0.36,0.40,0.45,0.50,0.55,0.60];
function newelSweep(st){
  /* the stair as built with its own dimensions and wood (the helix view hides the other structural controls, so they
     must not reach it) */
  const rs=NEWEL_R.slice(); if(rs.indexOf(st.ri)<0){ rs.push(st.ri); rs.sort((a,b)=>a-b); }
  return memo('newel',[rs.join(','),st.geom,st.wood].join('/'),()=>rs.map(ri=>{
    const P=structParams(Object.assign({},DEFAULTS,{geom:st.geom,wood:st.wood,ri})), fr=frameFor(P);
    let umax=0; for(let n=0;n<fr.md.nn;n++) umax=Math.max(umax,Math.hypot(fr.swU[6*n],fr.swU[6*n+1],fr.swU[6*n+2]));
    return {ri,umax}; }));
}

/* ---- 6. buckling and bounce ---- */
const MODE_LIST=[{id:'buckle',name:'buckling'},{id:'m1',name:'mode 1'},{id:'m2',name:'mode 2'},{id:'m3',name:'mode 3'},{id:'m4',name:'mode 4'},{id:'m5',name:'mode 5'},{id:'m6',name:'mode 6'}];
function drawStableView(ctx,W,H,M){
  const Bm=M.B, st=ST, modes=M.modes;
  const capFull=stableCaption(st,Bm,modes,'long',hasSide(W)), capShort=stableCaption(st,Bm,modes,'short',hasSide(W));
  const L=stageLayout(ctx,W,H,capFull,capShort,0,0,0);
  const sp=splitMain(L.main,0.46,80);
  const md=M.Sm.md;
  let x=null, lab2='';
  if(st.mode==='buckle'){ x=Bm.x; lab2=isFinite(Bm.lam)?'the first buckling shape: every load × '+sigf(Bm.lam,3):'no buckling found below × 10⁹'; }
  else { const k=+st.mode.slice(1)-1, m=modes[k]; if(m){ x=m.x; lab2='mode '+(k+1)+': '+sigf(m.f,3)+' Hz'; } }
  const amp=0.06*M.Sm.md.P.H, ph=st.mode==='buckle'?1:(st.anim?Math.sin(TAU*SIM.t*0.8):1);
  /* each piece coloured by how far it swings in this shape (a mode has no size of its own: its largest swing is 1) */
  const swing=x?elementSwing(md,x):null;
  const R=drawStair3D(ctx,W,H,sp.pic,st,M.Sm,{scale:amp*ph,u:x||new Float64Array(md.ndof),noGhost:false,
    faceOpt:swing?{colour:(kind,i)=>seqCol(0.12+0.88*swing[i])}:undefined});
  if(swing) lab(ctx,W,H,sp.pic.x,sp.pic.y1-20,'colour: how far each piece swings, dark still, bright the most','#6f7789',SM_FONT,'left','bottom');
  HIT.push({kind:'cam',b:sp.pic});
  title(ctx,W,H,sp.pic,lab2,'the shape');
  lab(ctx,W,H,sp.pic.x,sp.pic.y1-4,'the shape drawn to a largest swing of '+fmt(amp*100,0)+' cm'+(st.mode!=='buckle'&&st.anim?', moving at 0.8 cycles a second (not its frequency)':''),'#6f7789',SM_FONT,'left','bottom');
  if(sp.plot) drawFreqPlot(ctx,W,H,sp.plot,modes,Bm);
  drawCaption(ctx,L);
}
function stableCaption(st,Bm,modes,which,side){
  const f1=modes[0]?modes[0].f:NaN, band=FOOT_BAND, h=footHarmonic(f1);
  const lamTxt=isFinite(Bm.lam)?sigf(Bm.lam,3):'more than 10⁹';
  if(which==='short') return side?'Its lowest natural frequencies against the pace of feet, and the load factor at which it would buckle.':'A mode or the buckling shape; the readout has the frequencies and the load factor.';
  const shape=st.mode==='buckle'?'the buckling shape, where it would give way if every load on it were multiplied by '+lamTxt:'a vibration mode, which swings back and forth at its own frequency';
  const feet='The lowest natural frequency is '+sigf(f1,3)+' Hz; feet on stairs fall '+fmt(band.walk[0],1)+'–'+fmt(band.walk[1],1)+' times a second'
    +(h===1?', so a climber can pump it at its own frequency.':h===2?', and a footfall’s second harmonic (twice the pace) reaches it.':(f1<band.walk[0]?', faster than it can follow.':', and neither the pace nor twice it reaches it.'));
  return (side?'Left: ':'')+shape+', drawn exaggerated. '+(side?'Right: its six lowest natural frequencies, the shaded bands where the pace and its harmonics fall. ':'')+feet;
}
/* which multiple of the pace of feet on stairs (1 or 2) reaches a frequency, or 0 */
function footHarmonic(f){ for(let n=1;n<=2;n++) if(f>=n*FOOT_BAND.walk[0]&&f<=n*FOOT_BAND.walk[1]) return n; return 0; }
function drawFreqPlot(ctx,W,H,b,modes,Bm){
  const fmax=Math.max(12,Math.ceil((modes.length?modes[modes.length-1].f:10)*1.15));
  const bb=box(b.x+8,b.y+18,b.w-12,Math.min(b.h-60,170));
  axesT(ctx,bb,0,fmax,0,1,{title:titleFor(bb,'natural frequencies, Hz, and the pace of feet','frequencies, Hz'),xlab:'frequency, Hz',yticks:[]});
  const X=f=>bb.x+bb.w*f/fmax;
  const band=FOOT_BAND;
  /* the pace and its second and third harmonics, fading */
  /* the bands, their names along the bottom (the frequencies are named along the top) */
  for(let n=1;n<=2;n++){ const x0=X(n*band.walk[0]), x1=Math.min(bb.x1,X(n*band.walk[1])); if(x0>=bb.x1) continue;
    ctx.fillStyle=rgba(COL.load,[0.22,0.1][n-1]); ctx.fillRect(x0,bb.y,x1-x0,bb.h);
    lab(ctx,W,H,x1+3,bb.y1-4-14*(2-n),n===1?'feet on stairs':'twice their pace',COL.load,SM_FONT,'left','bottom',PLATE); }
  modes.forEach((m,i)=>{ const sel=ST.mode==='m'+(i+1), x=X(m.f); if(x>bb.x1) return;
    ctx.strokeStyle=sel?COL.live:COL.pos; ctx.lineWidth=sel?2.4:1.6; ctx.beginPath(); ctx.moveTo(x,bb.y1); ctx.lineTo(x,bb.y+22+14*(i%3)); ctx.stroke();
    lab(ctx,W,H,x+3,bb.y+22+14*(i%3),sigf(m.f,3),sel?COL.live:COL.pos,SM_FONT,'left','middle',PLATE); });
  HIT.push({kind:'freq',b:bb,fmax,modes:modes.map(m=>m.f)});
  /* the buckling factor, as a sentence under the plot */
  const y=bb.y1+44;
  caption(ctx,b.x+8,y,isFinite(Bm.lam)?'Buckling: every load on it — its own weight'+(ST.load==='none'?'':' and the people')+' — would have to be multiplied by '+sigf(Bm.lam,3)+' before the stair buckled. The most squeezed member carries '+kN(-Bm.nmin)+'.':'No buckling within a load factor of 10⁹.',b.w-12,'#9aa2b4');
}

/* ---- the dispatch ---- */
function buildModel(){
  const st=ST, v=st.view, M={view:v};
  if(v==='stair'||v==='cut'||v==='stable') M.Sm=stairModel(st);
  if(v==='stair') M.Sm=stairModel(st);
  if(v==='tread') M.T=treadModel(st);
  if(v==='cut') M.C=cutModel(st);
  if(v==='roles') M.R=rolesModel(st);
  if(v==='helix'){ M.H=helixModel(st); M.Nw=newelSweep(st); M.D=doubleHelixModel(st); }
  if(v==='stable'){ M.modes=modesFor(st); M.B=bucklingFor(st); }
  return M;
}
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0; PICK=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='stair') drawStairView(ctx,W,H,M);
  else if(M.view==='tread') drawTreadView(ctx,W,H,M);
  else if(M.view==='cut') drawCutView(ctx,W,H,M);
  else if(M.view==='roles') drawRolesView(ctx,W,H,M);
  else if(M.view==='helix') drawHelixView(ctx,W,H,M);
  else drawStableView(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }

/* ---- the clock: the person climbing, a mode swinging ---- */
const SIM={t:0,climbT:0};
const FRAME=1/60;
function simReset(){ SIM.t=0; SIM.climbT=0; }
function viewAnimates(st){ return (st.view==='stair'&&st.climb&&st.load==='one')||(st.view==='stable'&&st.anim&&st.mode!=='buckle'); }
function runStep(st){
  if(!viewAnimates(st)) return false;
  SIM.t+=FRAME;
  if(st.view==='stair'){ SIM.climbT+=FRAME; if(SIM.climbT>=0.55){ SIM.climbT=0; st.step=st.step>=LIM.step[1]?LIM.step[0]:st.step+1; } }
  return true;
}

function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  function setFrom(hit,x,y){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1);
    if(hit.kind==='cam'){ ST.camTheta=DRAG.th-(x-DRAG.x)*0.01; ST.camPhi=clamp(DRAG.ph+(y-DRAG.y)*0.008,-0.15,1.35); return true; }
    if(hit.kind==='cutpos'){ const k=clamp(Math.round(u*hit.nr-0.5),LIM.cut[0],LIM.cut[1]); if(k===ST.cut) return false; ST.cut=k; return true; }
    if(hit.kind==='scen'){ if(ST.scen===hit.id) return false; ST.scen=hit.id; return true; }
    if(hit.kind==='hR'){ ST.hR=clamp(Math.pow(10,hit.lo+(hit.hi-hit.lo)*u),LIM.hR[0],LIM.hR[1]); return true; }
    if(hit.kind==='ri'){ let best=NEWEL_R[0]; const r=hit.lo+(hit.hi-hit.lo)*u; for(const q of NEWEL_R) if(Math.abs(q-r)<Math.abs(best-r)) best=q;
      if(best===ST.ri) return false; ST.ri=best; return true; }
    if(hit.kind==='freq'){ const f=hit.fmax*u; let bi=0; hit.modes.forEach((g,i)=>{ if(Math.abs(g-f)<Math.abs(hit.modes[bi]-f)) bi=i; });
      const id='m'+(bi+1); if(ST.mode===id) return false; ST.mode=id; return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; }
      /* a press on a tread moves the person there, and does not turn the camera */
      if(hit.kind==='cam'&&hit.tread&&ST.load==='one'){ const pk=pickAt(x,y);
        if(pk){ const ab=hit.tread(pk.id); let f=ST.frac;
          if(ab[0]&&ab[1]){ const dx=ab[1].x-ab[0].x, dy=ab[1].y-ab[0].y, d2=dx*dx+dy*dy; if(d2>1) f=clamp(((x-ab[0].x)*dx+(y-ab[0].y)*dy)/d2,0,1); }
          DRAG.what=null; ST.step=pk.id; ST.frac=Math.round(100*f)/100; return true; } }
      DRAG.what=hit; DRAG.x=x; DRAG.y=y; DRAG.th=ST.camTheta; DRAG.ph=ST.camPhi;
      return hit.kind==='cam'?false:setFrom(hit,x,y); }
    if(type==='move'){ if(!DRAG.what) return false; return setFrom(DRAG.what,x,y); }
    DRAG.what=null; return false;
  };
  S.wheel=function(dy){ const z=clamp(ST.zoom*Math.exp(-dy*0.0012),LIM.zoom[0],LIM.zoom[1]); if(z===ST.zoom) return false; ST.zoom=z; return true; };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',{html:lab}),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    let rk=key; while(rows[rk]) rk+='+'; rows[rk]={row:rowEl,sync,inp}; return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')); }

  /* ---- the load ---- */
  const gLoad=h('div',{class:'grp'},h('h3',null,'the load'));
  gLoad.appendChild(chipRow(LOAD_LIST,'load'));
  const stepRow=slider('step','on step',LIM.step[0],LIM.step[1],1,v=>fmt(v,0)+' of '+(PM.nrise-1)); gLoad.appendChild(stepRow);
  const fracRow=slider('frac','across the tread',0,1,0.01,v=>fmt(100*v,0)+' % out'); gLoad.appendChild(fracRow);
  const massRow=slider('mass','each person, kg',LIM.mass[0],LIM.mass[1],1,v=>fmt(v,0)+' kg'); gLoad.appendChild(massRow);
  const climbRow=h('div',{class:'checks'},checkbox('climb','the person climbs')); gLoad.appendChild(climbRow);
  const loadTag=h('div',{class:'tag'}); gLoad.appendChild(loadTag);

  /* ---- the structure ---- */
  const gStr=h('div',{class:'grp'},h('h3',null,'the structure'));
  /* a set of dimensions brings its own inner radius (the slider can then move it) */
  gStr.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'sizes'),chipRow(GEOM_LIST,'geom',o=>{ st.ri=PJ.geoms[o.id].ri; st.hR=st.ri; })));
  gStr.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'wood'),chipRow(WOOD_LIST,'wood')));
  gStr.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'floor'),chipRow(BASE_LIST,'base')));
  gStr.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'loft'),chipRow(TOP_LIST,'top')));
  gStr.appendChild(slider('ri','inner stringer radius',LIM.ri[0],LIM.ri[1],0.01,v=>fmt(100*v,0)+' cm'));
  gStr.appendChild(h('div',{class:'checks'},checkbox('inner','the inner stringer'),checkbox('hinged','treads hinged to the stringers'),
    checkbox('railing','the railing’s weight (added 1887)'),checkbox('bracket','the iron bracket to a column (added later)')));
  const strTag=h('div',{class:'tag'}); gStr.appendChild(strTag);

  /* ---- the drawing (stair view) ---- */
  const gDraw=h('div',{class:'grp'},h('h3',null,'the drawing'));
  gDraw.appendChild(h('div',{class:'checks'},checkbox('fbd','the free-body diagram'),checkbox('deform','the displaced shape')));

  /* ---- a cut ---- */
  const gCut=h('div',{class:'grp'},h('h3',null,'a cut'));
  gCut.appendChild(slider('cut','between steps',LIM.cut[0],LIM.cut[1],1,v=>fmt(v,0)+' and '+fmt(v+1,0)));
  gCut.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'keep'),chipRow([{id:'above',name:'the part above'},{id:'below',name:'the part below'}],'cutSide')));
  gCut.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'plot'),chipRow(CUT_COMP,'cutComp')));
  const cutTag=h('div',{class:'tag'}); gCut.appendChild(cutTag);

  /* ---- what holds it up ---- */
  const gRol=h('div',{class:'grp'},h('h3',null,'one change at a time'));
  gRol.appendChild(chipRow(SCEN.map(s=>({id:s.id,name:s.name})),'scen'));
  const rolTag=h('div',{class:'tag'}); gRol.appendChild(rolTag);

  /* ---- the helix ---- */
  const gHel=h('div',{class:'grp'},h('h3',null,'a stringer alone'));
  gHel.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'section'),chipRow([{id:'i',name:'the inner stringer’s'},{id:'o',name:'the outer stringer’s'}],'hSec')));
  gHel.appendChild(slider('hR','helix radius R',Math.log10(LIM.hR[0]),Math.log10(LIM.hR[1]),0.005,v=>sigf(v,3)+' m',null,{to:u=>Math.pow(10,u),from:v=>Math.log10(v)}));
  const helTag=h('div',{class:'tag'}); gHel.appendChild(helTag);

  /* ---- buckling and bounce ---- */
  const gSta=h('div',{class:'grp'},h('h3',null,'what to show'));
  gSta.appendChild(chipRow(MODE_LIST,'mode'));
  gSta.appendChild(h('div',{class:'checks'},checkbox('anim','the mode swings')));
  const staTag=h('div',{class:'tag'}); gSta.appendChild(staTag);

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset(); syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all'),
    h('button',{onclick:()=>{ st.camTheta=DEFAULTS.camTheta; st.camPhi=DEFAULTS.camPhi; st.zoom=DEFAULTS.zoom; dirty=true; refresh(); }},'reset the view')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),h('div',{class:'src',html:SRC_LINE}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),h('div',{id:'phys'}));
  [gLoad,gStr,gDraw,gCut,gRol,gHel,gSta,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncPanel(){
    const v=st.view;
    gLoad.hidden=v==='helix'; gStr.hidden=v==='helix'||v==='roles'; gDraw.hidden=v!=='stair';
    gCut.hidden=v!=='cut'; gRol.hidden=v!=='roles'; gHel.hidden=v!=='helix'; gSta.hidden=v!=='stable';
    /* rows a state does not use are hidden, never left live and ignored */
    /* Sumali's people are 800 N each: the mass slider would be live and ignored there */
    stepRow.hidden=st.load!=='one'; fracRow.hidden=st.load!=='one'; massRow.hidden=st.load==='none'||st.load==='sumali';
    climbRow.hidden=!(v==='stair'&&st.load==='one');
    for(const k in rows) rows[k].sync();
    loadTag.innerHTML=st.load==='crowd'?'one person on the middle of every tread':(st.load==='none'?'the stair alone':'press a tread in the stair view to put the person there');
    strTag.innerHTML=PJ.geoms[st.geom].name+'’s dimensions: '+PJ.geoms[st.geom].src.split(' (')[0]+(st.railing||st.bracket?'; as it stands today, with '+(st.railing?'the railing':'')+(st.railing&&st.bracket?' and ':'')+(st.bracket?'the bracket':''):'; as built in 1878');
    cutTag.innerHTML='press the plots below to move the cut';
    rolTag.innerHTML='press a bar to draw that case';
    helTag.innerHTML='press the plot to set R; the stair itself keeps its own radii';
    staTag.innerHTML='press the frequency plot to pick a mode';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; drag a 3-D picture to turn it, scroll to zoom &nbsp; space: the person climbs, a mode swings';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=HINTS[v]||'';
      /* the prose is computed from the model: every number in it is the model's */
      infoEl.innerHTML=infoFor(v,M);
      physEl.innerHTML=derivFor(v,M);
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ syncChips(); syncPanel(); dirty=true; refresh(); }
    if(DRAG.what) canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); eqEl.innerHTML=eqbarHTML(M); }
  });
  /* on release everything is refreshed, the prose too (the Known-bad on drags that refresh only the readout) */
  const up=()=>{ const was=!!DRAG.what; canvas.classList.remove('dragging'); S.pointer('up',0,0); if(was){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); if(S.wheel(e.deltaY)) dirty=true; },{passive:false});

  window.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')) return;
    if(e.key===' '){ e.preventDefault(); if(st.view==='stable') st.anim=!st.anim; else st.climb=!st.climb; syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frames=0;
  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){ dirty=false;
      try{ S.draw(); if(advanced&&(++frames%6===0)){ syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); eqEl.innerHTML=eqbarHTML(M); } }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }

function derivFor(v,M){

    return '<h4>the stringer’s own axes</h4>'
      +EQ(1,'T = '+FR('r&prime;','|r&prime;|')+', &nbsp; N = &minus;(cos &theta;, sin &theta;, 0), &nbsp; B = T &times; N')
      +'<p>For r(&theta;) = (R cos &theta;, R sin &theta;, c&theta;): T along the stringer, N toward the axis, B the binormal, mostly up. N (along T) is the axial force, tension positive; V<sub>n</sub> and V<sub>b</sub> the shears; T the twist; M<sub>n</sub> the bending about N (the stringer’s depth, up and down), M<sub>b</sub> about B (in the plane of the coil, its thin way).</p>'
      +'<h4>the cut</h4>'
      +EQ(2,'F<sub>below&rarr;above</sub> + &Sigma; W<sub>above</sub> + &Sigma; R<sub>above</sub> = 0')
      +'<p>What the lower part does to the upper across each cut stringer is the force the cut end of the frame’s next piece receives; its moments are taken about the cut.</p>';
  }
  if(v==='roles'){ const md=frameFor(structParams(st)).md, cl=codeLoad(md), crowd=(md.P.nrise-1)*st.mass*G0;
    return '<h4>one change at a time</h4>'
      +EQ(1,'u = K<sup>&minus;1</sup>f: &nbsp; the same f, a different K')
      +'<p>The loft let go: the heads free. Ends pinned: forces pass, moments do not. Treads hinged: each tread free to turn about its crossways axis where it meets the stringers (its bending moment there condensed out). No inner stringer: the treads’ inner ends free. The bracket: the outer stringer held sideways at step '+PJ.bracket.step+', where the Library of Congress photograph shows the iron bracket (about three-fifths of the way up; read off the photograph, not measured).</p>'
      +'<h4>what a building code asks</h4>'
      +'<p>The 2012 International Building Code asks a stair (other than in a house) to carry 100 pounds per square foot over its treads, '+sigf(IBC_PSF*PSF_PA/1000,3)+' kPa: '+kN(cl.F)+' over these '+fmt(cl.area,2)+' m&sup2;, about what '+(md.P.nrise-1)+' people of '+fmt(st.mass,0)+' kg weigh ('+kN(crowd)+'), the load “a person on every step”.</p>';
  }
  if(v==='helix'){ const Hm=M.H;
    return '<h4>a coil on its axis</h4>'
      +EQ(1,FR('&delta;','P')+' = L<sub>w</sub>['+FR('R&sup2;cos&sup2;&alpha;','GJ')+' + '+FR('R&sup2;sin&sup2;&alpha;','EI<sub>B</sub>')+' + '+FR('sin&sup2;&alpha;','EA')+' + '+FR('cos&sup2;&alpha;','&kappa;GA')+']')
      +'<p>tan &alpha; = H/(2&pi;R n), L<sub>w</sub> = the stringer’s length. The first two terms are the open-coiled spring of the textbooks (Morley, <i>Strength of Materials</i>, 1920, p. 306); the last two, the squeeze and the shear, matter only when the coil is tight. derive_checks.py checks it against exact helical arcs.</p>'
      +'<h4>two coils, tied</h4>'
      +EQ(2,'k = EA '+FR('H&sup2;(R<sub>o</sub> &minus; R<sub>i</sub>)&sup2;','R<sub>i</sub>&sup2;L<sub>o</sub>&sup3; + R<sub>o</sub>&sup2;L<sub>i</sub>&sup3;')+', &nbsp; L&sup2; = H&sup2; + (4&pi;R)&sup2;')
      +'<p>Tománek and Every’s Eq. (25): the steps keep R<sub>o</sub> &minus; R<sub>i</sub> fixed and only the stringers stretch. derive_checks.py re-derives it in sympy by minimising their energy, and reproduces their 4.8 &times; 10&#8310; N/m for R<sub>i</sub> = 0.26 m, R<sub>o</sub> = 1.00 m, H = 6.10 m and EA = 1.2 &times; 10&#8312; N.</p>'
      +'<p>The frame’s test: the stair hung from the loft, 1 kN on its axis at the floor carried to both feet by stiff arms, the treads as they are or a thousand times stiffer, the feet free or kept from turning and swaying.</p>';
  }
  return '<h4>ringing</h4>'
    +EQ(1,'det(K &minus; &omega;&sup2;M) = 0, &nbsp; f = &omega;/2&pi;')
    +'<p>M is the consistent mass of every piece'+(st.railing?', with the railing’s '+fmt(PJ.railing/G0,1)+' kg per metre riding on the outer stringer':'')+'. The roots are found by counting: the number of negative pivots when K &minus; sM is factored is the number of frequencies below s (Sylvester’s law of inertia), so bisection cannot miss one, and Rayleigh-quotient iteration polishes each.</p>'
    +'<h4>buckling</h4>'
    +EQ(2,'det(K + &lambda;K<sub>G</sub>) = 0')
    +'<p>K<sub>G</sub> is each piece’s geometric stiffness under its own axial force from the loads shown (a squeezed piece loses stiffness sideways); &lambda; is how many times every load would have to be multiplied to make the stiffness vanish. derive_checks.py checks the pieces against Euler’s column with shear (Engesser) and Greenhill’s column under its own weight.</p>';
}


/* ================================================================== *
 *  makeShot: the recording context the selfTest draws into (build_aa   *
 *  lineage): every text with its box, every stroke with its path.      *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null, path=[], cur=null;       /* a stroke keeps its path, in canvas pixels */
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:''+ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle,paths:path.map(p=>p.slice())}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest — headless verification.  REF is build_stair/refvals.json: *
 *  params.json and the twins' output (derive_stair.py: numpy/scipy,    *
 *  dense, no shared code; derive_checks.py: sympy/mpmath closed forms). *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const rel=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol*Math.max(Math.abs(b),1e-300),name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){ Object.assign(ST,DEFAULTS,over); simReset(); for(const k in MEMO) delete MEMO[k];
    try{ return fn(); } finally{ Object.assign(ST,stSave); simReset(); } }
  const RS=REF.stair, RC=REF.checks;

  /* ---------- 0. the helpers ---------- */
  ok(plain('&Delta;V &omega; &#955; &frac58;')==='ΔV ω λ &frac58;','plain() decodes named and numeric entities and passes unknown ones through');
  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }
  eq(sigf(1.768e8,4),'1.768 × 10⁸','sigf writes a power of ten in superscripts');
  eq(sci(1265,2),'1.3 × 10³','sci rounds 1265 to two figures in a power of ten (sigf would keep every digit)');
  eq(sci(4.8e6,2),'4.8 × 10⁶','sci(4.8e6)'); eq(sci(999,2),sigf(999,2),'sci leaves numbers below a thousand to sigf');
  eq(tickDec([0,0.25,0.5]),2,'a step of 0.25 needs two decimals'); eq(tickDec([0,2.5,5]),1,'a step of 2.5 needs one');
  eq(tickDec([0,10,20]),0,'whole numbers need none'); eq(tickDec([-0.2,0,0.2]),1,'and -0.2 prints as -0.2');
  { const ts=ticksFit(0,100,8,60,false); ok(ts.length>=2&&60*(ts[1]-ts[0])/100>=10.5*1.15+3,'ticksFit thins the ticks until neighbours clear a line ('+ts.length+')'); }
  eq(niceFactor(1,10),10,'niceFactor(1, 10)'); eq(niceFactor(1,25),20,'niceFactor(1, 25) rounds down to 20'); eq(niceFactor(1,60),50,'niceFactor(1, 60)');
  { let prev=-1, mono=true; for(let i=0;i<=40;i++){ const L=okL(seqCol(i/40)); if(L<=prev) mono=false; prev=L; } ok(mono,'the sequential ramp rises in lightness all the way'); }
  ok(inPoly(1,1,[[0,0],[2,0],[2,2],[0,2]])&&!inPoly(3,1,[[0,0],[2,0],[2,2],[0,2]]),'inPoly: in and out of a square');
  eq(orderWords(543),'in the hundreds','orderWords(543)'); eq(orderWords(56),'in the tens','orderWords(56)'); eq(orderWords(3e4),'in the tens of thousands or more','orderWords(3e4)');
  /* the torsion series against the twin's mpmath-checked values */
  for(const c of RC.torsion.cases){ const t=rectTorsion(c[0],c[1]); rel(t[0],c[2],1e-12,'torsion k1 of '+c[0]+' x '+c[1]); rel(t[1],c[3],1e-12,'torsion k2 of '+c[0]+' x '+c[1]); }
  rel(rectTorsion(1,1)[0],RC.torsion.square[0],1e-12,'a square: J = 0.1406 b^4');

  /* ---------- 1. the parameters: the page's resolution is the twin's ---------- */
  const KEYS=['H','ri','ro','bi','di','bo','do','bt','E','G','rho','turns','nrise','sub','base','top','railing'];
  const CASE_STATE={'default':{},'top pinned':{top:'pinned'},'both pinned':{base:'pinned',top:'pinned'},'floor only':{top:'free'},
    'hinged treads':{hinged:true},'no inner stringer':{inner:false},'ri 0.10':{ri:0.10},'ri 0.45':{ri:0.45},'bracket':{bracket:true},
    'sitka':{wood:'sitka'},'sumali geometry':{geom:'su',ri:PJ.geoms.su.ri},'crowd':{load:'crowd'},
    'person quarter':{frac:0.25},'hinged quarter':{hinged:true,frac:0.25},'today':{railing:true,bracket:true},
    'sumali':{geom:'su',ri:PJ.geoms.su.ri,railing:true,load:'sumali'}};
  eq(RS.cases.length,Object.keys(CASE_STATE).length,'every twin case has a page state');
  for(const c of RS.cases){ const over=CASE_STATE[c.label]; ok(!!over,'a state for '+c.label); if(!over) continue;
    const P=structParams(Object.assign({},DEFAULTS,over));
    ok(KEYS.every(k=>k==='railing'?(P.railing||0)===(c.P.railing||0):(typeof c.P[k]==='number'?Math.abs(P[k]-c.P[k])<=1e-12*Math.abs(c.P[k]):P[k]===c.P[k])),
      c.label+': the page resolves the parameters the twin used ('+KEYS.filter(k=>P[k]!==c.P[k]&&!(Math.abs(P[k]-c.P[k])<=1e-12*Math.abs(c.P[k]))).join(',')+')');
    ok(!!P.hinged===!!c.P.hinged&&!!P.noInner===!!c.P.noInner&&!!P.bracket===!!c.P.bracket,c.label+': hinges, inner stringer and bracket as the twin');
    if(P.bracket) ok(P.bracket.step===c.P.bracket.step&&P.bracket.stringer===c.P.bracket.stringer&&JSON.stringify(P.bracket.dofs)===JSON.stringify(c.P.bracket.dofs),c.label+': the bracket where the twin put it'); }
  eq(PJ.crowd_mass,DEFAULTS.mass,'the crowd is people of the default mass');
  eq(DEFAULTS.step,PJ.person[0],'the default person\'s step'); eq(DEFAULTS.frac,PJ.person[1],'and place'); eq(DEFAULTS.mass,PJ.person[2],'and mass');
  /* the wood: E = 1.1 MOE, G = E (GLR + GLT)/2, density SG x 1000 x 1.12 (the Wood Handbook's rules) */
  { const P=structParams(DEFAULTS), w=PJ.woods.engelmann;
    rel(P.E,1.1*8.9e9,1e-15,'Engelmann E = 1.1 x 8.9 GPa'); rel(P.G,P.E*(0.124+0.120)/2,1e-15,'G from Table 5-1\'s ratios'); rel(P.rho,0.35*1000*1.12,1e-15,'392 kg/m3');
    ok(w.MOE===8.9e9&&w.MOR===64.0e6&&w.cpar===30.9e6&&w.cperp===2.8e6&&w.SG===0.35,'Engelmann spruce: Table 5-3a\'s 12 % row');
    const s=PJ.woods.sitka; ok(s.MOE===10.8e9&&s.MOR===70.0e6&&s.cpar===38.7e6&&s.cperp===4.0e6&&s.SG===0.40&&s.GLR===0.064&&s.GLT===0.061,'Sitka spruce: Tables 5-3a and 5-1');
    const g=PJ.geoms.te; ok(g.H===6.10&&g.ri===0.26&&g.ro===1.00&&g.bo===0.064&&g.do===0.190,'Tomanek and Every\'s dimensions');
    const u=PJ.geoms.su; ok(u.H===6.706&&u.ri===0.300&&u.ro===1.224&&u.bo===0.0762&&u.bt===0.0508,'Sumali\'s dimensions');
    ok(PJ.railing===200&&PJ.sumali_load.N===800&&PJ.sumali_load.steps.length===16&&PJ.sumali_load.steps.every((s2,i)=>s2===2*i+1),'Sumali\'s railing and her sixteen on the odd steps'); }
  /* the two numbers the prose takes from print: the pace of feet on stairs and the code's stair load */
  ok(FOOT_BAND.walk[0]===2.0&&FOOT_BAND.walk[1]===4.5,'feet on stairs: "approximately from 2.0 to 4.5 Hz" (Andrade, Santos and Escórcio 2020)');
  eq(IBC_PSF,100,'a stair\'s live load: IBC 2012 Table 1607.1, row 30, "All other" than dwellings, 100 psf');
  rel(PSF_PA,4.4482216152605/0.09290304,1e-15,'a psf: the pound-force (4.4482216152605 N) over the square foot (0.09290304 m²)');

  /* ---------- 2. the frame against the twin, through the page's own state ---------- */
  for(const c of RS.cases){ const over=CASE_STATE[c.label]; if(!over) continue;
    withState(over,()=>{
      const S=solveState(ST), md=S.md;
      rel(S.W,c.W,1e-13,c.label+': the weight');
      let um=0; for(let n=0;n<md.nn;n++) um=Math.max(um,Math.hypot(S.u[6*n],S.u[6*n+1],S.u[6*n+2]));
      rel(um,c.umax,1e-9,c.label+': the largest displacement');
      for(const n in c.R) for(let j=0;j<6;j++){ const sc=j<3?c.W:c.W*md.P.H; ok(Math.abs(S.R[6*n+j]-c.R[n][j])<=5e-9*sc,c.label+': reaction '+n+'.'+j); }
      c.probe_el.forEach((i,k)=>{ const f=S.Fend.subarray(12*i,12*i+12), g=c.probe_f[k]; let e=0,m=0; for(let a=0;a<12;a++){ e=Math.max(e,Math.abs(f[a]-g[a])); m=Math.max(m,Math.abs(g[a])); }
        ok(e<=1e-8*m+1e-9,c.label+': element '+i+'\'s end forces ('+(e/m).toExponential(2)+')'); });
      if(c.tread_f){ const i=md.treads[c.person[0]-1], f=S.Fend.subarray(12*i,12*i+12); let e=0,m=0; for(let a=0;a<12;a++){ e=Math.max(e,Math.abs(f[a]-c.tread_f[a])); m=Math.max(m,Math.abs(c.tread_f[a])); }
        ok(e<=1e-8*m,c.label+': the loaded tread\'s end forces');
        const pp=personPoint(md,ST.step,ST.frac); rel(deflectionAt(S,pp.el,pp.a),c.under_foot,1e-9,c.label+': the sinking under the foot (the twin splits the tread there)'); }
      const str=stressAll(S);
      for(const k of ['si','so','t']) if(c.stress[k]&&c.stress[k][0]>0) rel(str.best[k].s,c.stress[k][0],1e-8,c.label+': the largest stress in '+k);
      rel(str.comp,c.stress.comp,1e-8,c.label+': the most compressive fibre'); rel(str.shear,c.stress.shear,1e-8,c.label+': the largest shear');
      if(c.freq){ const modes=modesFor(ST); c.freq.forEach((f,m)=>rel(modes[m].f,f,1e-9,c.label+': frequency '+(m+1))); }
      if(c.buckle!==undefined&&c.buckle!==null&&isFinite(c.buckle)) rel(bucklingFor(ST).lam,c.buckle,1e-9,c.label+': the buckling factor');
      if(c.u){ let e=0,m=0; for(let i=0;i<c.u.length;i++){ e=Math.max(e,Math.abs(S.u[i]-c.u[i])); m=Math.max(m,Math.abs(c.u[i])); } ok(e<=1e-9*m,c.label+': every displacement within 1e-9 ('+(e/m).toExponential(2)+')'); }
      if(c.mode1){ const x=modesFor(ST)[0].x; let e=0; for(let n=0;n<md.nn;n++) for(let a=0;a<3;a++) e=Math.max(e,Math.abs(x[6*n+a]-c.mode1[3*n+a])); ok(e<1e-6,c.label+': the first mode\'s shape ('+e.toExponential(2)+')'); }
      /* what each stringer carries at every cut between two treads (the twin cuts at the node midway between them) */
      if(c.cut_f){ let e=0, m=0, n=0;
        for(const k in c.cut_f){ ST.cut=+k; const C=cutModel(ST);
          [C.ci,C.co].forEach((x,s)=>{ const g=c.cut_f[k][s]; if(!g){ ok(!x,c.label+': no stringer, no cut face'); return; } n++;
            for(let a=0;a<6;a++){ e=Math.max(e,Math.abs(x.loc[a]-g[a])); m=Math.max(m,Math.abs(g[a])); } }); }
        ST.cut=DEFAULTS.cut;
        ok(n>50&&e<=1e-8*m,c.label+': the forces at all '+n+' cut faces, midway between treads ('+(e/m).toExponential(2)+')'); }
    }); }
  /* Sumali's case: the bare frame's weight is her model's own half; the prose's number is this */
  withState(CASE_STATE.sumali,()=>{ const c=RS.cases.find(x=>x.label==='sumali'); rel(sumaliFrame().comp,c.stress.comp,1e-8,'the prose\'s Sumali-case stress is the twin\'s');
    ok(c.W<SUMALI.W,'the bare frame on her dimensions weighs less than her solid model ('+c.W.toFixed(0)+' < 6014 N)'); });
  /* the chords against exact helical arcs: the discretisation's size, as the header states */
  ok(RS.discretisation.rel_err<0.005,'chords against exact arcs: '+(100*RS.discretisation.rel_err).toFixed(2)+' % of the largest displacement');
  /* every root is the one asked for, by a Sturm count just below and just above it (the bisection's bracket only sets
     where the Rayleigh-quotient polish starts: the root inside it is nearer its middle than any root outside) */
  for(const over of [{},{inner:false},{bracket:true,railing:true}]) withState(over,()=>{ const fr=frameFor(structParams(ST)), Mb=assemble(fr.md,'m'), modes=modesFor(ST), tag=JSON.stringify(over);
    let bad=-1; modes.forEach((q,m)=>{ if(bad<0&&(pencilCount(fr.K,-1,Mb,q.w2*(1-1e-9))!==m||pencilCount(fr.K,-1,Mb,q.w2*(1+1e-9))!==m+1)) bad=m; });
    ok(modes.length===NMODES&&bad<0,tag+': each of the '+modes.length+' frequencies is the one asked for: m roots below it, m + 1 just above'+(bad>=0?' (not mode '+(bad+1)+')':''));
    const S=solveState(ST), B=bucklingFor(ST), Kg=assemble(S.md,'g',B.Nax);
    ok(pencilCount(S.fr.K,1,Kg,B.lam*(1-1e-9))===0&&pencilCount(S.fr.K,1,Kg,B.lam*(1+1e-9))===1,tag+': and the buckling factor is the lowest'); });
  /* the mass the modes swing is the weight the statics carry: nothing held, a rigid drop of the whole stair moves
     the frame's mass and, with the railing on, the railing's too */

    ok(by.hold/by.sum>10,'held feet: many times ('+(by.hold/by.sum).toFixed(1)+')');
    const txt=infoFor('helix',M); ok(txt.indexOf(sigf(by.frame/by.sum,2)+' times')>=0&&txt.indexOf(sigf(by.hold/by.sum,2)+' times')>=0,'the prose\'s ratios are the model\'s'); });
  withState({view:'cut'},()=>{ const C=cutModel(ST), di=C.diag.i.N;
    ok(di[0]<0&&di[di.length-1]>0,'the inner stringer is squeezed at the floor and stretched at the loft (the prose)');
    eq(oppositeShare(C),1,'the outer stringer\'s axial force has the other sign wherever the inner one\'s is large');
    const txt=infoFor('cut',buildModel()); ok(txt.indexOf('stands on the floor and hangs from the loft')>=0,'and the prose says so'); });
  withState({view:'stable'},()=>{ const M=buildModel(), f1=M.modes[0].f, txt=infoFor('stable',M), pk=modePeak(M.Sm.md,M.B.x);
    eq(footHarmonic(f1),2,'the lowest frequency ('+f1.toFixed(2)+' Hz) is reached by twice the pace of feet on stairs');
    ok(txt.indexOf('second harmonic reaches')>=0,'and the prose says the second harmonic');
    ok(txt.indexOf(orderWords(M.B.lam))>=0&&M.B.lam>=100&&M.B.lam<1000,'the buckling factor is "in the hundreds"');
    ok(pk.topShare<0.5,'the buckling shape is spread out, not local (its busiest tenth of nodes hold '+pct(pk.topShare,0)+')');
    ok(txt.indexOf('near step '+pk.step)>=0,'the prose names where it swings most'); });
  /* the step the prose names is the height of the busiest node over the rise, on either stringer */
  for(const over of [{},{inner:false},{top:'free'},{bracket:true,railing:true}]) withState(over,()=>{ const md=stairModel(ST).md, tag=JSON.stringify(over);
    for(const [what,x] of [['the buckling shape',bucklingFor(ST).x],['mode 1',modesFor(ST)[0].x]]){ const pk=modePeak(md,x);
      eq(pk.step,Math.round(md.X[3*pk.node+2]*md.P.nrise/md.P.H),tag+': '+what+'\'s busiest node\'s step, from its height');
      eq(pk.inner,md.inner.indexOf(pk.node)>=0,tag+': and its stringer'); } });
  withState({inner:false},()=>{ const pk=modePeak(stairModel(ST).md,bucklingFor(ST).x); ok(!pk.inner&&pk.step>0,'with the inner stringer gone, the busiest node is on the outer one, above the floor'); });
  withState({view:'roles'},()=>{ const txt=derivFor('roles',buildModel()), kPa=100*4.4482216152605/0.09290304/1000;
    ok(txt.indexOf('100 pounds per square foot')>=0&&txt.indexOf(sigf(kPa,3)+' kPa')>=0,'the code\'s load in the prose: 100 psf, '+sigf(kPa,3)+' kPa'); });
  withState({bracket:true,railing:true,view:'stable'},()=>{ const f1=modesFor(ST)[0].f; ok(f1>modesFor(Object.assign({},ST,{bracket:false,railing:false}))[0].f,'the bracket raises the lowest frequency'); });

  /* ---------- 7. drawing: every view, several states, four sizes ---------- */
  /* 899 x 500: narrow and short, so no lower plots, yet tall enough for the long captions */
  const SIZES=[[1100,712],[1400,820],[560,380],[899,700],[899,500]];
  const DRAW=[{view:'stair'},{view:'stair',load:'crowd'},{view:'stair',top:'free',fbd:true},{view:'stair',load:'sumali',geom:'su',ri:PJ.geoms.su.ri,railing:true},{view:'stair',deform:false,fbd:false},
    {view:'tread'},{view:'tread',frac:0.97,step:1},{view:'tread',load:'sumali'},{view:'tread',load:'none',hinged:true},{view:'tread',inner:false,frac:0.3},{view:'stair',inner:false,top:'free',bracket:true},
    {view:'cut'},{view:'cut',cutSide:'below',cut:LIM.cut[1],cutComp:'Mn'},{view:'cut',inner:false},
    {view:'roles'},{view:'roles',scen:'noinner'},{view:'helix'},{view:'helix',hR:LIM.hR[1],hSec:'o'},{view:'helix',hR:LIM.hR[0]},
    {view:'stable'},{view:'stable',mode:'m3',anim:false},{view:'stable',top:'free',mode:'m1'}];
  let bad=null, nDraw=0, coll=null, offc=null, capBad=null;
  for(const over of DRAW) for(const [W,H] of SIZES) withState(over,()=>{
    const c=makeShot(W,H); drawView(c,W,H,buildModel()); nDraw++;
    const nf=c.nonFinite(); if(nf.n&&!bad) bad=JSON.stringify(over)+' '+W+'x'+H+': '+nf.ex;
    const t=c.ops.filter(o=>o.op==='text');
    for(const o of t){ if(/NaN|undefined|Infinity|&[a-zA-Z#][a-zA-Z0-9]*;|<\/?[a-z]/.test(o.t)&&!bad) bad=JSON.stringify(over)+': "'+o.t+'"';
      if((o.bb[0]<-0.5||o.bb[2]>W+0.5||o.bb[1]<-0.5||o.bb[3]>H+0.5)&&!offc) offc=JSON.stringify(over)+' '+W+'x'+H+': "'+o.t+'"'; }
    for(let i=0;i<t.length&&!coll;i++) for(let j=i+1;j<t.length;j++){ const a=t[i].bb,b=t[j].bb;
      if(Math.min(a[2],b[2])-Math.max(a[0],b[0])>0.5&&Math.min(a[3],b[3])-Math.max(a[1],b[1])>0.5){ coll=JSON.stringify(over)+' '+W+'x'+H+': "'+t[i].t+'" / "'+t[j].t+'"'; break; } }
    /* a caption names only what is drawn (the Known-bad on narrow stages and captions chosen by height) */
    const cap=t.filter(o=>o.bb[1]>H*0.6).map(o=>o.t).join(' '), side=hasSide(W), nb=bottomCount(W,H,2);
    if(!side&&/Right:|beside it|Bars, on/.test(cap)&&!capBad) capBad=JSON.stringify(over)+' '+W+'x'+H+': names a side plot';
    if(['tread','cut','helix'].indexOf(ST.view)>=0&&nb===0&&/Below/.test(cap)&&!capBad) capBad=JSON.stringify(over)+' '+W+'x'+H+': says "Below"';
  });
  ok(!bad,'every drawing has finite coordinates and clean text ('+nDraw+' drawings'+(bad?'; '+bad:'')+')');
  ok(!offc,'no text leaves the canvas'+(offc?' ('+offc+')':''));
  ok(!coll,'no two texts overlap'+(coll?' ('+coll+')':''));
  ok(!capBad,'no caption names a plot that is not drawn'+(capBad?' ('+capBad+')':''));
  /* the captions' colour words are the drawing's colours */
  const hue=c=>{ const [r,g,b]=toRgb(c).map(x=>x/255), mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; if(d===0) return 0;
    let h2=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; h2*=60; return h2<0?h2+360:h2; };
  ok(hue(COL.react)>60&&hue(COL.react)<110,'the supports\' arrows are green (the caption says so)');
  ok(hue(COL.load)>15&&hue(COL.load)<40,'the weights orange'); ok(hue(COL.live)>280&&hue(COL.live)<330,'the person magenta');
  ok(hue(COL.inner)>170&&hue(COL.inner)<210,'the inner stringer cyan'); ok(hue(COL.outer)>30&&hue(COL.outer)<55,'the outer stringer gold');
  withState({view:'stair'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const strokes=c.ops.filter(o=>o.op==='stroke').map(o=>o.style);
    ok(strokes.indexOf(COL.react)>=0&&strokes.indexOf(COL.load)>=0&&strokes.indexOf(COL.live)>=0,'the free-body diagram draws in those colours');
    const t=c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' '), Sm=stairModel(ST);
    ok(t.indexOf('displacements × '+fmtFactor(dispScale(Sm.umax)))>=0,'the displacement factor printed is the one applied');
    const sc=STAIR_SCALE;
    ok(t.indexOf('1 kN = '+fmt(1000*sc.pxN,0)+' px, 1 kN·m = '+fmt(1000*sc.pxNm,0)+' px')>=0,'and the arrow scales printed are the ones applied');
    rel(sc.pxN,arrowScale(sc.box,Sm.W+Sm.Wlive+Sm.Wrail),1e-15,'the force scale is the rule\'s for that box'); });
  /* the moment scale's rule, both ways: six times the force scale, unless the largest moment would pass a tenth of
     the box, when it is that tenth exactly */
  withState({view:'cut',top:'pinned'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const s=CUT_SCALE;
    ok(s.Mmax*6*s.pxN<0.1*s.box.h,'the loft pinned, the cut\'s moments stay under a tenth of the box at six times the force scale');
    rel(s.pxNm,6*s.pxN,1e-15,'so 1 kN·m is drawn six times as long as 1 kN');
    ok(c.ops.some(o=>o.op==='text'&&o.t==='1 kN = '+fmt(1000*s.pxN,0)+' px, 1 kN·m = '+fmt(1000*s.pxNm,0)+' px'),'and the cut\'s key prints the scales applied'); });
  withState({view:'cut'},()=>{ drawView(makeShot(1100,712),1100,712,buildModel()); const s=CUT_SCALE;
    ok(s.pxNm<6*s.pxN,'held at both ends, the cut\'s moments are larger'); rel(s.pxNm*s.Mmax,0.1*s.box.h,1e-12,'and the largest is drawn a tenth of the box'); });
  withState({view:'stair',base:'pinned',top:'pinned'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const key=c.ops.find(o=>o.op==='text'&&o.t.indexOf('1 kN = ')>=0);
    ok(!STAIR_SCALE.anyM&&!!key&&key.t.indexOf('1 kN = '+fmt(1000*STAIR_SCALE.pxN,0)+' px')>=0&&key.t.indexOf('kN·m')<0,'pinned at both ends no support holds a moment, and the key has no moment scale'); });
  /* an arrow across the line of sight is |F| times the scale long, one along it foreshortened */
  { const b=box(0,0,600,600), C=lensCamera(b,0.3,0,12,[0,0,3]), c=makeShot(600,600);
    const r=forceArrow(c,C,[0,0,3],[0,0,-1500],0.04,'#fff',1,'tail'); rel(r.len,60,1e-9,'a vertical 1.5 kN seen level is 60 px at 0.04 px/N');
    const r2=forceArrow(c,C,[0,0,3],v3.mul(C.B.fwd,1500),0.04,'#fff',1,'tail'); ok(!r2||r2.len<1,'one along the line of sight has no length'); }
  /* the tread's moment arcs turn the way their sign says */
  { const c=makeShot(200,200); arcArrow(c,100,100,15,1,'#fff',1); const s=c.ops.filter(o=>o.op==='stroke');
    const p=s[0].paths[0], a=p[p.length-2], b2=p[p.length-1]; ok(b2[1]<a[1],'an anticlockwise arc ends moving up the screen at its rightmost point'); }
  /* a mode's colouring spans its swing */
  withState({view:'stable'},()=>{ const md=stairModel(ST).md, sw=elementSwing(md,bucklingFor(ST).x); rel(Math.max(...sw),1,0.05,'the busiest piece is (nearly) the brightest'); ok(Math.min(...sw)>=0,'no negative swing'); });

  /* ---------- 8. the pointer and the clock ---------- */
  withState({view:'cut'},()=>{ const S=makeScene(null); const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const h=HIT.find(x=>x.kind==='cutpos'); ok(!!h,'the cut diagrams take a press');
    S.pointer('down',h.b.x+h.b.w*(20.5/h.nr),h.b.y+h.b.h/2); S.pointer('up',0,0); eq(ST.cut,20,'a press at step 20.5 cuts between 20 and 21'); });
  withState({view:'roles'},()=>{ const S=makeScene(null); drawView(makeShot(1100,712),1100,712,buildModel());
    const h=HIT.find(x=>x.kind==='scen'&&x.id==='hinged'); S.pointer('down',h.b.x+5,h.b.y+h.b.h/2); S.pointer('up',0,0); eq(ST.scen,'hinged','a press on a bar picks its case'); });
  withState({view:'helix'},()=>{ const S=makeScene(null); drawView(makeShot(1100,712),1100,712,buildModel());
    const h=HIT.find(x=>x.kind==='hR'); S.pointer('down',h.b.x+h.b.w/2,h.b.y+10); S.pointer('up',0,0); rel(ST.hR,Math.pow(10,(h.lo+h.hi)/2),1e-12,'a press half way along R sets it (log scale)');
    const g=HIT.find(x=>x.kind==='ri'); S.pointer('down',g.b.x+g.b.w,g.b.y+5); S.pointer('up',0,0); eq(ST.ri,NEWEL_R[NEWEL_R.length-1],'a press at the end of the sweep picks its last radius'); });
  withState({view:'stable'},()=>{ const S=makeScene(null); const M=buildModel(); drawView(makeShot(1100,712),1100,712,M);
    const h=HIT.find(x=>x.kind==='freq'), f3=M.modes[2].f; S.pointer('down',h.b.x+h.b.w*f3/h.fmax,h.b.y+10); S.pointer('up',0,0); eq(ST.mode,'m3','a press on mode 3\'s line picks it'); });
  withState({view:'stair'},()=>{ const S=makeScene(null); const M=buildModel(); drawView(makeShot(1100,712),1100,712,M);
    const tgt=PICK.find(p=>p.id===7); ok(!!tgt,'tread 7 can be pressed');
    const cx=tgt.q.reduce((a,p)=>a+p[0],0)/tgt.q.length, cy=tgt.q.reduce((a,p)=>a+p[1],0)/tgt.q.length;
    const th0=ST.camTheta, ph0=ST.camPhi; S.pointer('down',cx,cy); S.pointer('move',cx+80,cy+30); S.pointer('up',0,0);
    ok(ST.step===7||(pickAt(cx,cy)&&pickAt(cx,cy).id===ST.step),'a press on a tread puts the person there (step '+ST.step+')'); ok(ST.camTheta===th0&&ST.camPhi===ph0,'and dragging on from it does not turn the camera');
    /* a tread pressed while a turn is under way (a second finger) ends the turn: the next move turns nothing */
    { const h0=HIT.find(x=>x.kind==='cam'); ok(!pickAt(h0.b.x+5,h0.b.y+5),'the picture\'s corner is not a tread');
      S.pointer('down',h0.b.x+5,h0.b.y+5); S.pointer('down',cx,cy); S.pointer('move',cx+80,cy+30); S.pointer('up',0,0);
      ok(ST.camTheta===th0&&ST.camPhi===ph0,'a tread pressed mid-turn ends the turn'); }
    const h=HIT.find(x=>x.kind==='cam'); S.pointer('down',h.b.x+5,h.b.y+5); S.pointer('move',h.b.x+105,h.b.y+5); S.pointer('up',0,0);
    rel(ST.camTheta,th0-1,1e-12,'a drag of 100 px turns the camera by 1 rad');
    S.pointer('down',h.b.x+5,h.b.y+5); S.pointer('move',h.b.x+5,h.b.y+5000); S.pointer('up',0,0); eq(ST.camPhi,1.35,'the elevation stops at its limit');
    for(let i=0;i<20;i++) S.wheel(-1000); eq(ST.zoom,LIM.zoom[1],'the zoom stops at its limit'); });
  withState({view:'stair',climb:true,step:LIM.step[1]},()=>{ ok(runStep(ST),'the climb animates'); for(let i=0;i<40;i++) runStep(ST); eq(ST.step,LIM.step[0],'at the top the climber starts again at the bottom'); });
  withState({view:'stair',climb:true,load:'crowd'},()=>{ ok(!viewAnimates(ST),'no climb with a crowd'); });
  withState({view:'stable',anim:true,mode:'buckle'},()=>{ ok(!viewAnimates(ST),'a buckling shape does not swing'); ST.mode='m1'; ok(viewAnimates(ST),'a mode does'); });

  /* ---------- 9. the corners of the sliders: every view stays finite ---------- */
  let sweepBad=null;
  for(const over of [{ri:LIM.ri[0]},{ri:LIM.ri[1]},{mass:LIM.mass[1],load:'crowd'},{step:LIM.step[0],frac:0},{step:LIM.step[1],frac:1},{top:'free',hinged:true},{inner:false,top:'free'},{base:'pinned',top:'pinned',bracket:true},{geom:'su',ri:LIM.ri[1],wood:'sitka'}])
    for(const v of TABS.map(t=>t[0])) withState(Object.assign({view:v},over),()=>{ const M=buildModel();
      const s=readoutHTML(M)+eqbarHTML(M)+tagHTML(M)+infoFor(v,M)+derivFor(v,M);
      if(/NaN|undefined|Infinity/.test(s)&&!sweepBad) sweepBad=v+' '+JSON.stringify(over)+': '+(s.match(/.{0,40}(NaN|undefined|Infinity).{0,20}/)||[''])[0];
      const c=makeShot(1100,712); drawView(c,1100,712,M); if(c.nonFinite().n&&!sweepBad) sweepBad=v+' '+JSON.stringify(over)+': non-finite drawing'; });
  ok(!sweepBad,'every view at the sliders\' corners: finite, no NaN in the text'+(sweepBad?' ('+sweepBad+')':''));

  console.log(pass+' passed, '+fail+' failed ('+(Date.now()-T0)+' ms)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
