<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, DEG=Math.PI/180;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }
/* phase colours: fixed for the first three so a, b, c always read the same,
   then spread round the neon ramp for higher N */
const PHASE_FIXED=['#e8543a','#e5c94b','#4aa8e0'];
function phaseCol(k,N){
  if(N<=3) return PHASE_FIXED[k%3];
  return neonCss(k/N);
}

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  THE THEOREM                                                        *
 *                                                                     *
 *    SUM_k exp( i m (th + 2 pi k/N) ) = N exp(i m th)  if N | m       *
 *                                     = 0              otherwise      *
 *                                                                     *
 *  Everything in this file is a corollary.  It is computed here by    *
 *  brute summation, never by the closed form, so that selfTest is     *
 *  comparing an independent evaluation against the identity rather    *
 *  than checking the identity against itself.                         *
 * ================================================================== */
function rootSum(N,m,th){
  let re=0, im=0;
  for(let k=0;k<N;k++){ const a=m*((th||0)+TAU*k/N); re+=Math.cos(a); im+=Math.sin(a); }
  return [re,im];
}
function divides(N,m){ return N>0 && m%N===0; }

/* the N phase angles.  'quad' is the historical Tesla two-phase machine — a
   90-degree pair rather than a 180-degree one — kept because it is the honest
   counter-example to "only N >= 3 gives constant power". */
function phaseAngles(N,quad){
  if(N===2&&quad) return [0,Math.PI/2];
  const o=[]; for(let k=0;k<N;k++) o.push(TAU*k/N);
  return o;
}

/* ------------------------------------------------------------------ *
 *  the signals                                                        *
 *                                                                     *
 *  Voltages are a stiff balanced sinusoidal source.  Currents may      *
 *  carry harmonics and an amplitude unbalance on phase a, which is     *
 *  what breaks the theorem in the two physically distinct ways:        *
 *  unbalance breaks m = 1 (a neutral current appears), harmonics       *
 *  break m = 2 (power ripples).                                        *
 *                                                                     *
 *  The h-th harmonic of phase k is shifted by h * th_k, which is what  *
 *  makes triplen harmonics land in the zero sequence — the reason they *
 *  circulate in a delta winding and cannot leave a three-wire feed.    *
 * ------------------------------------------------------------------ */
function makeSystem(o){
  const N=o.N, ang=phaseAngles(N,o.quad);
  const harm=o.harm||[];                     // [{h, amp}] on top of the fundamental
  const unb=o.unb||0;                        // amplitude unbalance on phase a
  const pf=o.pf===undefined?0:o.pf;          // current lag angle, radians
  const gain=k=>1+(k===0?unb:0);
  return {
    N, ang, harm, unb, pf, quad:!!o.quad,
    v(k,t){ return Math.cos(t-ang[k]); },
    i(k,t){
      let s=Math.cos(t-ang[k]-pf);
      for(const H of harm) s+=H.amp*Math.cos(H.h*(t-ang[k]));
      return gain(k)*s;
    },
    p(k,t){ return this.v(k,t)*this.i(k,t); },
    pTotal(t){ let s=0; for(let k=0;k<N;k++) s+=this.p(k,t); return s; },
    iVec(t){ const o2=[]; for(let k=0;k<N;k++) o2.push(this.i(k,t)); return o2; },
  };
}

/* Clarke (amplitude-invariant): three currents become two rotating-plane
   coordinates plus one zero-sequence scalar.  For N = 3 this is a rotation of
   the (i_a, i_b, i_c) cube that puts [1,1,1] on the zero axis, which is why the
   3-D view and this transform are the same picture. */
function clarke(S,t){
  const N=S.N; let al=0, be=0, z=0;
  for(let k=0;k<N;k++){ const ik=S.i(k,t);
    al+=ik*Math.cos(S.ang[k]); be+=ik*Math.sin(S.ang[k]); z+=ik; }
  return {al:2*al/N, be:2*be/N, z:z/N, mag:2*Math.hypot(al,be)/N};
}
/* The rotating field of N windings at the same N angles is literally the Clarke
   vector scaled: B = SUM_k i_k u(th_k) = (N/2)(alpha, beta). */
function fieldVec(S,t){
  const c=clarke(S,t);
  return {x:S.N*c.al/2, y:S.N*c.be/2, mag:S.N*c.mag/2};
}

/* sample a periodic function over one fundamental period */
function sampleP(f,n){ const o=[]; for(let i=0;i<n;i++) o.push(f(TAU*i/n)); return o; }
function stats(a){
  let lo=Infinity, hi=-Infinity, s=0;
  for(const v of a){ if(v<lo)lo=v; if(v>hi)hi=v; s+=v; }
  const mean=s/a.length;
  let v2=0; for(const v of a) v2+=(v-mean)*(v-mean);
  return {lo,hi,mean, rms:Math.sqrt(v2/a.length), pp:hi-lo,
          ripple: Math.abs(mean)>1e-12 ? (hi-lo)/Math.abs(mean) : (hi-lo>1e-12?Infinity:0)};
}
/* real DFT amplitude of harmonic m (peak amplitude, not RMS) */
function harmAmp(a,m){
  const n=a.length; let re=0, im=0;
  for(let i=0;i<n;i++){ const th=TAU*m*i/n; re+=a[i]*Math.cos(th); im-=a[i]*Math.sin(th); }
  return 2*Math.hypot(re,im)/n;
}
/* the lowest non-DC harmonic that actually carries anything */
function firstHarmonic(a,tol,maxM){
  const lim=maxM||Math.floor(a.length/2)-1;
  for(let m=1;m<=lim;m++) if(harmAmp(a,m)>(tol||1e-9)) return m;
  return 0;
}

/* ================================================================== *
 *  APPLICATION 1 — conductors                                         *
 *                                                                     *
 *  Deliver power P over length L, with total I^2 R loss fixed, and let *
 *  the insulation set the PEAK voltage between any two conductors.     *
 *  For N phases the phase voltage is V_p, the largest phasor           *
 *  difference is 2 V_p sin( pi floor(N/2) / N ), and carrying the      *
 *  algebra through leaves conductor volume proportional to             *
 *                                                                     *
 *      C_AC(N) = 8 sin^2( pi floor(N/2) / N )                          *
 *                                                                     *
 *  Single-phase two-wire is the N = 2, 180-degree case and gives 8;    *
 *  three-phase gives 6, hence the classic "three-quarters of the       *
 *  copper".  Every even N gives 8 again, because two of its phases are *
 *  always diametrically opposite and set the insulation by themselves. *
 *  Bipolar DC is a separate calculation: two conductors at +-Vhat/2    *
 *  with no peak-to-RMS penalty, giving 4 — which beats every AC        *
 *  system, and is why HVDC exists.                                     *
 * ================================================================== */
function conductorAC(N){
  if(N<2) return NaN;                        // one conductor cannot carry power
  return 8*Math.pow(Math.sin(Math.PI*Math.floor(N/2)/N),2);
}
const CONDUCTOR_DC=4;

/* ================================================================== *
 *  APPLICATION 2 — rectifiers                                         *
 *  A p-pulse rectifier averages the tops of p sinusoids per cycle.     *
 *  Closed form, and the place the Nth-harmonic residue shows up as a   *
 *  number every power-electronics textbook tabulates.                  *
 * ================================================================== */
function rectifier(p){
  const Vavg=(p/Math.PI)*Math.sin(Math.PI/p);
  const Vrms=Math.sqrt(0.5+(p/(4*Math.PI))*Math.sin(TAU/p));
  return {p, Vavg, Vrms, rf:Math.sqrt(Math.max(0,Vrms*Vrms/(Vavg*Vavg)-1))};
}

/* ================================================================== *
 *  APPLICATION 3 — the rotor                                          *
 *                                                                     *
 *  Deliberately simple aerodynamics: thrust per unit span goes as the  *
 *  square of the local wind speed, uniform loading along the blade.    *
 *  The point is the AZIMUTHAL structure, which is exact algebra, not   *
 *  the absolute loads, which would need blade-element momentum theory. *
 *  Wind shear is the standard power law v(z) = v_hub (z/z_hub)^alpha,  *
 *  alpha ~ 0.14 over open terrain.                                     *
 * ================================================================== */
/* Two shear profiles, and the difference is not cosmetic.  The power law is the
   real atmosphere.  The LINEAR profile v = 1 + beta x cos(psi) is its
   linearisation, and it is the one in which the 2P and 3P amplitudes have exact
   closed forms — because (1+u)^alpha is only linear in u for small u, and here
   u = (R/z_hub) x cos(psi) reaches 0.7, where the quadratic term is already 30 %
   of the linear one.  selfTest asserts the closed forms against the LINEAR
   profile, where they are exact to 1e-12, and asserts only the harmonic
   STRUCTURE — first surviving harmonic = N — against the power law, where it is
   exact for both. */
function shearV(z,zh,alpha){ return Math.pow(Math.max(z,1e-9)/zh, alpha); }
/* An optional azimuthal notch standing in for tower shadow.  It is a NOTCH,
   not a potential-flow tower model, and is labelled as such wherever it shows;
   it is here because it is the second real source of NP excitation. */
function towerNotch(psi,depth,width){
  let d=((psi%TAU)+TAU)%TAU - Math.PI;       // angle from straight down
  return 1-depth*Math.exp(-(d/width)*(d/width));
}
/* the shear gradient across the rotor, the small parameter of the whole story */
function shearBeta(o){ return o.alpha*o.R/o.zh; }
/* Closed forms for the LINEAR profile, uniform loading, integrated along the
   blade.  Derived by expanding (1 + beta x cos a)^2, integrating x over [0,1],
   and applying the root-of-unity sum:
     thrust      = N (1 + beta^2/6),                       constant for N >= 3
     tilt mean   = N beta / 3,                             constant for N >= 3
     tilt 2P     = 2 beta / 3        (N = 2 only, order beta)
     tilt 3P     = 3 beta^2 / 16     (N = 3 only, order beta^2)
   The step from order beta to order beta^2 at N = 3 is the whole point; every
   one of these is asserted against a Fourier transform in selfTest. */
const rotorClosed={
  thrust:(N,b)=>N*(1+b*b/6),
  tiltMean:(N,b)=>N*b/3,
  tilt2P:b=>2*b/3,
  tilt3P:b=>3*b*b/16,
};
/* Two-point Gauss-Legendre per spanwise sub-interval.  The linear-profile
   integrands are a quadratic (thrust) and a cubic (moment) in x, and Gauss-2 is
   exact to degree 3 — so the closed forms below are recovered to machine
   precision rather than to the O(1/n^2) of a midpoint rule, and selfTest can
   assert them at 1e-12 instead of 1e-5. */
const GAUSS2=[-1/Math.sqrt(3), 1/Math.sqrt(3)];
function rotorLoads(o,psi){
  const N=o.N, R=o.R, zh=o.zh, al=o.alpha, nS=o.nS||24, beta=shearBeta(o);
  let T=0, Mt=0, My=0; const per=[];
  for(let k=0;k<N;k++){
    const a=psi+TAU*k/N, ca=Math.cos(a), sa=Math.sin(a);
    const notch=o.tower?towerNotch(a,o.towerDepth,o.towerWidth):1;
    let f=0, mt=0, my=0;
    for(let j=0;j<nS;j++) for(let g=0;g<2;g++){
      const x=(j+0.5+GAUSS2[g]*0.5)/nS, w=0.5/nS;
      const v=(o.linear ? 1+beta*x*ca : shearV(zh+R*x*ca,zh,al))*notch;
      const df=v*v*w;                         // normalised: uniform wind -> 1 per blade
      f+=df; mt+=df*x*ca; my+=df*x*sa;
    }
    per.push(f); T+=f; Mt+=mt; My+=my;
  }
  return {T, Mt, My, per};                    // Mt = tilt (nodding), My = yaw
}

/* Prandtl's tip-loss factor — a published closed form, area-weighted over the
   disc at the Betz-optimum inflow angle.  This is NOT a power coefficient and
   the sim never calls it one; it is the part of the blade-number effect that
   can be written down exactly. */
function prandtlF(N,lam,nS){
  const n=nS||300; let tot=0;
  for(let j=0;j<n;j++){
    const x=(j+0.5)/n;
    const phi=Math.atan(2/(3*lam*x));
    const e=-(N/2)*(1-x)/(x*Math.sin(phi));
    tot+=(2/Math.PI)*Math.acos(clamp(Math.exp(e),0,1))*2*x/n;
  }
  return tot;
}
const BETZ=16/27;

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
function fmtPct(x){ return isFinite(x) ? (100*x).toFixed(2)+'%' : '—'; }
function fmtSmall(x){
  const a=Math.abs(x);
  if(a<1e-12) return '0';
  if(a<1e-3) return x.toExponential(2);
  return x.toFixed(4);
}
const ORD=['','1P','2P','3P','4P','5P','6P','7P','8P','9P','10P','11P','12P'];
function ordinal(m){ return ORD[m]||(m+'P'); }
function phaseName(k,N){ return N<=3 ? 'abc'[k] : String(k+1); }

/* ================================================================== *
 *  the equation bar                                                   *
 * ================================================================== */
function eqbarHTML(M,view){
  const N=M.N;
  const lhs='<span class="lhs">&sum;<sub>k</sub> e<sup>&thinsp;i m (&theta;+2&pi;k/N)</sup></span>'
    +' = <i>N</i> e<sup>&thinsp;i m&theta;</sup> if <i>N</i>|<i>m</i>, else <span class="hl">0</span>';
  if(view==='rotor'){
    return lhs+'<span class="sm">'
      +'thrust &prop; <i>v</i><sup>2</sup>, so the rotor is the <i>m</i>&thinsp;=&thinsp;2 case &nbsp;&middot;&nbsp; '
      +'first surviving harmonic = <span class="hl">'+ordinal(M.rotor.firstH||N)+'</span>'
      +' &nbsp;&middot;&nbsp; cyclic tilt moment <span class="hl2">'
      +fmtSmall(M.rotor.tiltPP)+'</span> peak-to-peak'
      +(N>=3?' &nbsp;&middot;&nbsp; 1P and 2P are <span class="hl">gone</span>':
              ' &nbsp;&middot;&nbsp; <span class="hl2">this is what shakes the tower</span>')
      +'</span>';
  }
  if(view==='why'){
    return '<span class="lhs">C<sub>AC</sub>(N) = 8 sin<sup>2</sup>(&pi;&lfloor;N/2&rfloor;/N)</span>'
      +' &nbsp;&middot;&nbsp; minimised uniquely at <span class="hl">N = 3</span>'
      +'<span class="sm">single-phase 8 &nbsp;&middot;&nbsp; <span class="hl">three-phase 6</span>'
      +' &nbsp;&middot;&nbsp; four- and six-phase 8 &nbsp;&middot;&nbsp; five-phase 7.24'
      +' &nbsp;&middot;&nbsp; but bipolar <span class="hl2">DC is 4</span>, and beats them all</span>';
  }
  const p=M.power;
  return lhs+'<span class="sm">'
    +'power is <i>v</i>&thinsp;<i>i</i>, a quadratic, so it is the <i>m</i>&thinsp;=&thinsp;2 case'
    +' &nbsp;&middot;&nbsp; &sum;<i>p<sub>k</sub></i> = <span class="hl">'+p.mean.toFixed(4)+'</span>'
    +' &plusmn; '+fmtSmall(p.pp/2)
    +' &nbsp;&middot;&nbsp; ripple <span class="'+(p.ripple<1e-9?'hl':'hl2')+'">'
    +(p.ripple<1e-9?'zero':fmtPct(p.ripple))+'</span>'
    +' &nbsp;&middot;&nbsp; |B| = <span class="hl">'+p.bmag.toFixed(4)+'</span>'
    +(p.bripple<1e-9?' (constant &mdash; it rotates)':' (pulsating, not rotating)')
    +'</span>';
}
function eqbarText(M){
  /* conductorAC(1) is deliberately NaN — one conductor cannot carry power — so
     the summary must render it as a dash rather than leak "NaN" into a string
     the harness reads. */
  const c=conductorAC(M.N);
  return 'N='+M.N+' power mean='+M.power.mean.toFixed(6)+' pp='+M.power.pp.toExponential(3)
    +' ripple='+(isFinite(M.power.ripple)?M.power.ripple.toFixed(6):'inf')
    +' C_AC='+(isFinite(c)?c.toFixed(4):'-')
    +' tiltPP='+M.rotor.tiltPP.toExponential(3);
}

/* ================================================================== *
 *  readout                                                            *
 * ================================================================== */
function readoutHTML(M,st){
  const N=M.N, p=M.power, r=M.rotor;
  const balanced=Math.abs(p.zeroPP)<1e-9;
  const rotates=p.bripple<1e-9;
  const verdict = (rotates&&balanced)
    ? '<span class="good">rotates AND sums to zero</span>'
    : rotates ? '<span class="bad">rotates, but needs a return conductor</span>'
    : '<span class="bad">pulsates &mdash; there is no plane to rotate in</span>';
  const rows=[];
  rows.push(['phases N', String(N)+(M.quad?' (quadrature)':'')]);
  rows.push(['balanced subspace', 'dim '+(N-1)]);
  rows.push(['&sum;p<sub>k</sub> mean', p.mean.toFixed(5)]);
  rows.push(['&sum;p<sub>k</sub> ripple', p.ripple<1e-9?'zero':fmtPct(p.ripple)]);
  rows.push(['|B| rotating field', p.bmag.toFixed(5)]);
  rows.push(['|B| variation', p.bripple<1e-9?'none':fmtPct(p.bripple)]);
  rows.push(['zero sequence pk-pk', fmtSmall(p.zeroPP)]);
  rows.push(['first ripple harmonic', p.firstH? ordinal(p.firstH):'none']);
  const tbl=rows.map(([a,b])=>'<tr><td>'+a+'</td><td class="v">'+b+'</td></tr>').join('');
  const cr=[];
  cr.push(['conductor volume', isFinite(conductorAC(N))?conductorAC(N).toFixed(3):'—']);
  cr.push(['vs single-phase', isFinite(conductorAC(N))?fmtPct(conductorAC(N)/conductorAC(2)):'—']);
  cr.push(['vs bipolar DC', isFinite(conductorAC(N))?fmtPct(conductorAC(N)/CONDUCTOR_DC):'—']);
  const ctbl=cr.map(([a,b])=>'<tr><td>'+a+'</td><td class="v">'+b+'</td></tr>').join('');
  const rr=[];
  rr.push(['blades N', String(N)]);
  rr.push(['shear &beta; = &alpha;R/z', shearBeta({alpha:st.alpha,R:st.Rrot,zh:st.zh}).toFixed(4)]);
  rr.push(['thrust ripple', fmtSmall(r.thrustPP)]);
  rr.push(['cyclic tilt pk-pk', fmtSmall(r.tiltPP)]);
  rr.push(['first harmonic', r.firstH? ordinal(r.firstH):'none']);
  rr.push(['Prandtl tip factor', prandtlF(N,st.lam).toFixed(4)]);
  const rtbl=rr.map(([a,b])=>'<tr><td>'+a+'</td><td class="v">'+b+'</td></tr>').join('');
  const legend=(()=>{ let s='';
    for(let k=0;k<Math.min(N,6);k++)
      s+='<span><i style="background:'+phaseCol(k,N)+'"></i>'+phaseName(k,N)+'</span>';
    if(N>6) s+='<span>&hellip;</span>';
    s+='<span><i style="background:#b8ec4c"></i>total</span>'
      +'<span><i style="background:#cd35c4"></i>zero seq</span>';
    return s; })();
  return '<div class="rname">'+(N===3?'Three phases':N+' phase'+(N===1?'':'s'))
    +'<small>'+verdict+'</small></div>'
    +'<table><tr><td class="hd">phase space</td><td class="hd v"></td></tr>'+tbl
    +'<tr><td class="hd">conductor</td><td class="hd v">relative</td></tr>'+ctbl
    +'<tr><td class="hd">rotor</td><td class="hd v"></td></tr>'+rtbl
    +'</table>'
    +'<div class="bar"><div class="fill" style="width:'
    +clamp(100*(1-Math.min(1,p.ripple)),0,100).toFixed(1)+'%"></div></div>'
    +'<div class="note">power steadiness <b>'+(p.ripple<1e-9?'perfect':fmtPct(1-Math.min(1,p.ripple)))
    +'</b> &mdash; '+(N>=3?'every quadratic is isotropic once <b>N &ge; 3</b>'
        :'<b>m = 2 is divisible by N</b>, so the quadratic does not cancel')+'.</div>'
    +'<div class="legend">'+legend+'</div>';
}
function tagHTML(M,st){
  const N=M.N;
  if(st.view==='space')
    return N<=3
      ? 'the phase space of <b>'+N+' current'+(N===1?'':'s')+'</b> — the balanced subspace '
        +'&sum;i<sub>k</sub>=0 is a <b>'+['point','line','plane'][N-1]+'</b>, and rotation needs a plane'
      : 'N &gt; 3 is not drawable in three axes — showing the <b>Clarke space</b> '
        +'(&alpha;, &beta;, i<sub>0</sub>), where the balanced subspace is the horizontal plane';
  if(st.view==='power') return 'instantaneous power and the rotating field — the <b>m = 2</b> case';
  if(st.view==='rotor') return 'a rotor in wind shear — thrust goes as <b>v²</b>, so it is the '
    +'<b>same m = 2 case</b>';
  return 'the cost curves that pick <b>N = 3</b> out of the crowd';
}

/* ================================================================== *
 *  2-D plotting helpers                                               *
 * ================================================================== */
function makeAxes(x0,y0,w,hgt,xlo,xhi,ylo,yhi){
  return {x0,y0,w,h:hgt,xlo,xhi,ylo,yhi,
    fx:v=>x0+(v-xlo)/((xhi-xlo)||1)*w,
    fy:v=>y0+hgt-(v-ylo)/((yhi-ylo)||1)*hgt};
}
function ticks(lo,hi,n){
  const out=[], raw=(hi-lo)/n;
  if(!(raw>0)) return [lo];
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].reduce((p,c)=>Math.abs(c*mag-raw)<Math.abs(p*mag-raw)?c:p,1)*mag;
  for(let v=Math.ceil(lo/step-1e-9)*step; v<=hi*1.0000001+1e-12; v+=step) out.push(v);
  return out;
}
function tickLabel(v){
  const a=Math.abs(v);
  if(a<1e-12) return '0';
  if(a>=1000||a<0.01) return v.toExponential(0).replace('e','e');
  return a>=100?v.toFixed(0):a>=10?v.toFixed(0):a>=1?v.toFixed(1):v.toFixed(2);
}

/* ================================================================== *
 *  the model — everything the views draw, computed once per change    *
 * ================================================================== */
const DEFAULTS={ view:'space', N:3, quad:false, unb:0, pf:0, h3:0, h5:0, h7:0,
  Rrot:63, zh:90, alpha:0.14, lam:7, linear:false,
  tower:false, towerDepth:0.10, towerWidth:0.35,
  anim:true, spin:false, speed:1,
  showSub:true, showShadow:true, showBox:true, showWave:true };

function buildModel(st){
  const harm=[{h:3,amp:st.h3},{h:5,amp:st.h5},{h:7,amp:st.h7}].filter(x=>x.amp>1e-12);
  const S=makeSystem({N:st.N, quad:st.quad, unb:st.unb, pf:st.pf, harm});
  const NS=720;
  const pT=sampleP(t=>S.pTotal(t),NS), sp=stats(pT);
  const bm=sampleP(t=>fieldVec(S,t).mag,NS), sb=stats(bm);
  const zs=sampleP(t=>clarke(S,t).z,NS), sz=stats(zs);
  const power={trace:pT, mean:sp.mean, pp:sp.pp, ripple:sp.ripple,
    bmag:sb.mean, bripple: Math.abs(sb.mean)>1e-12 ? sb.pp/Math.abs(sb.mean) : 0,
    zeroPP:sz.pp, firstH:firstHarmonic(pT,1e-9,24)};
  /* one pass for all three rotor loads: sampling them separately triples the
     cost of the most expensive thing in the file for no reason */
  const ro={N:st.N, R:st.Rrot, zh:st.zh, alpha:st.alpha, linear:st.linear,
            tower:st.tower, towerDepth:st.towerDepth, towerWidth:st.towerWidth, nS:16};
  const NR=360, rl=[];
  for(let i=0;i<NR;i++) rl.push(rotorLoads(ro,TAU*i/NR));
  const T=rl.map(o=>o.T), Mt=rl.map(o=>o.Mt), My=rl.map(o=>o.My);
  const sT=stats(T), sMt=stats(Mt), sMy=stats(My);
  const rotor={opt:ro, T, Mt, My, thrustPP:sT.pp, tiltPP:sMt.pp, yawPP:sMy.pp,
    thrustMean:sT.mean, tiltMean:sMt.mean, firstH:firstHarmonic(Mt,1e-9,24),
    spec:Array.from({length:13},(_,m)=>m?harmAmp(Mt,m):0)};
  return {N:st.N, quad:st.quad, S, power, rotor};
}
/* the state point in the drawn 3-space: raw phase currents while there are at
   most three of them, the Clarke image once there are not */
function statePoint(M,t){
  if(M.N<=3){ const o=[0,0,0]; for(let k=0;k<M.N;k++) o[k]=M.S.i(k,t); return o; }
  const c=clarke(M.S,t); return [c.al,c.be,c.z];
}
/* the direction the balanced constraint measures: [1,1,..]/sqrt(N) in phase
   coordinates, the zero axis itself in Clarke coordinates */
function zeroAxis(N){
  if(N>3) return [0,0,1];
  const v=[0,0,0]; for(let k=0;k<N;k++) v[k]=1;
  return v3.norm(v);
}
function axisLabels(N){
  return N<=3 ? ['i_a','i_b','i_c'].slice(0,N) : ['α','β','i₀'];
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const ctx=canvas.getContext('2d');
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.55,0.30,6.6,[0,0,0]);
  let M=null, L=1.4, traj=null, tAnim=0;

  function rebuild(){
    M=buildModel(st);
    const n=360; traj=[];
    let mx=0.8;
    for(let i=0;i<=n;i++){ const p=statePoint(M,TAU*i/n); traj.push(p);
      mx=Math.max(mx,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2])); }
    /* the box is sized from the MEASURED extent, so nothing the sim draws is
       ever clipped by its own axes */
    L=Math.ceil(mx*1.18*4)/4;
  }

  /* ---------------- 3-D: the phase space ---------------- */
  function draw3D(){
    const W=cam.W,H=cam.H, B=camBasis(cam), N=M.N;
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const P=p=>project(cam,B,[p[0]/L*1.6,p[1]/L*1.6,p[2]/L*1.6]);
    const line=(a,b,col,w,dash)=>{ const p=P(a),q=P(b); if(!p||!q) return;
      ctx.setLineDash(dash||[]); ctx.strokeStyle=col; ctx.lineWidth=w||1;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
      ctx.setLineDash([]); };
    const poly=(pts,fill,stroke,w)=>{
      const ps=pts.map(P); if(ps.some(p=>!p)) return;
      ctx.beginPath(); ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
      ctx.closePath();
      if(fill){ ctx.fillStyle=fill; ctx.fill(); }
      if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=w||1; ctx.stroke(); }
    };
    const nAx=N<=3?N:3;

    /* the box */
    if(st.showBox){
      const c=[-L,L];
      for(const a of c) for(const b of c){
        line([a,b,-L],[a,b,L],'rgba(120,135,165,.14)',1);
        line([a,-L,b],[a,L,b],'rgba(120,135,165,.14)',1);
        line([-L,a,b],[L,a,b],'rgba(120,135,165,.14)',1);
      }
    }
    /* the balanced subspace: a point, a line, a plane, a plane */
    if(st.showSub){
      if(N===1){
        const p=P([0,0,0]);
        if(p){ ctx.fillStyle='rgba(205,53,196,.9)'; ctx.beginPath();
          ctx.arc(p.x,p.y,5,0,TAU); ctx.fill(); }
      } else if(N===2){
        line([-L,L,0],[L,-L,0],'rgba(90,200,224,.75)',2.4);
      } else if(N===3){
        poly([[L,-L,0],[L,0,-L],[0,L,-L],[-L,L,0],[-L,0,L],[0,-L,L]],
             'rgba(90,200,224,.10)','rgba(90,200,224,.55)',1.6);
      } else {
        poly([[-L,-L,0],[L,-L,0],[L,L,0],[-L,L,0]],
             'rgba(90,200,224,.09)','rgba(90,200,224,.5)',1.4);
      }
    }
    /* the coordinate axes actually in use */
    for(let k=0;k<nAx;k++){
      const e=[0,0,0]; e[k]=L*1.06;
      line([0,0,0],e,rgba(phaseCol(k,N),0.75),1.6);
      const p=P(e);
      if(p){ ctx.fillStyle=phaseCol(k,N); ctx.font='italic 13px Georgia, serif';
        ctx.textAlign='center'; ctx.fillText(axisLabels(N)[k],p.x,p.y-7); ctx.textAlign='left'; }
    }
    /* the zero-sequence direction — the one the optimum must not use */
    { const u=zeroAxis(N), e=v3.mul(u,L*1.12);
      line(v3.mul(u,-L*0.35),e,'rgba(205,53,196,.8)',1.6,[5,4]);
      const p=P(e);
      if(p){ ctx.fillStyle='#cd35c4'; ctx.font='11px -apple-system, sans-serif';
        ctx.textAlign='center'; ctx.fillText('zero sequence',p.x,p.y-8); ctx.textAlign='left'; } }

    /* the trajectory, and its shadow on the balanced subspace */
    const u=zeroAxis(N);
    const shadow=traj.map(p=>v3.sub(p,v3.mul(u,v3.dot(p,u))));
    if(st.showShadow){
      ctx.beginPath();
      let started=false;
      for(const s of shadow){ const p=P(s); if(!p){started=false;continue;}
        started?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); started=true; }
      ctx.strokeStyle='rgba(90,200,224,.85)'; ctx.lineWidth=1.6; ctx.stroke();
    }
    ctx.beginPath();
    { let started=false;
      for(const s of traj){ const p=P(s); if(!p){started=false;continue;}
        started?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); started=true; } }
    ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=2.6; ctx.stroke();

    /* the instant */
    const t=tAnim*TAU, cur=statePoint(M,t);
    const curS=v3.sub(cur,v3.mul(u,v3.dot(cur,u)));
    for(let k=0;k<nAx;k++){
      const e=[0,0,0]; e[k]=cur[k];
      line(cur,e,rgba(phaseCol(k,N),0.5),1.2,[3,3]);
      const p=P(e);
      if(p){ ctx.fillStyle=phaseCol(k,N); ctx.beginPath(); ctx.arc(p.x,p.y,3.6,0,TAU); ctx.fill(); }
    }
    if(Math.abs(v3.dot(cur,u))>1e-9) line(cur,curS,'rgba(205,53,196,.85)',1.6);
    { const p=P(cur);
      if(p){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,13);
        g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(0.35,'rgba(184,236,76,.7)');
        g.addColorStop(1,'rgba(184,236,76,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,13,0,TAU); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,TAU); ctx.fill(); } }
    if(st.showWave) drawWaveInset(W,H,t);
  }
  /* the same instant as waveforms, so the picture and the plot are one thing */
  function drawWaveInset(W,H,t){
    const w=272, hgt=104, x0=16, y0=H-hgt-40;
    ctx.fillStyle='rgba(10,12,18,.72)'; ctx.strokeStyle='rgba(42,47,61,1)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.rect(x0,y0,w,hgt); ctx.fill(); ctx.stroke();
    const N=M.N, A=makeAxes(x0+6,y0+16,w-12,hgt-26,0,TAU,-1.9,1.9);
    ctx.strokeStyle='rgba(120,135,165,.18)';
    ctx.beginPath(); ctx.moveTo(A.fx(0),A.fy(0)); ctx.lineTo(A.fx(TAU),A.fy(0)); ctx.stroke();
    for(let k=0;k<N;k++){
      ctx.beginPath();
      for(let i=0;i<=120;i++){ const tt=TAU*i/120, y=A.fy(clamp(M.S.i(k,tt),-1.9,1.9));
        i?ctx.lineTo(A.fx(tt),y):ctx.moveTo(A.fx(tt),y); }
      ctx.strokeStyle=rgba(phaseCol(k,N),N>6?0.5:0.9); ctx.lineWidth=1.3; ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(A.fx(t%TAU),A.y0); ctx.lineTo(A.fx(t%TAU),A.y0+A.h); ctx.stroke();
    ctx.fillStyle='#8b93a6'; ctx.font='10.5px -apple-system, sans-serif';
    ctx.fillText('the '+N+' phase current'+(N===1?'':'s')+' over one cycle',x0+7,y0+12);
  }

  /* ---------------- shared 2-D chrome ---------------- */
  function frame(A,xlab,ylab,title,nx,ny){
    ctx.strokeStyle='rgba(120,135,165,.13)'; ctx.lineWidth=1;
    ctx.fillStyle='#7d8698'; ctx.font='10.5px -apple-system, sans-serif';
    for(const v of ticks(A.xlo,A.xhi,nx||6)){ const X=A.fx(v);
      if(X<A.x0-.5||X>A.x0+A.w+.5) continue;
      ctx.beginPath(); ctx.moveTo(X,A.y0); ctx.lineTo(X,A.y0+A.h); ctx.stroke();
      ctx.textAlign='center'; ctx.fillText(tickLabel(v),X,A.y0+A.h+14); }
    for(const v of ticks(A.ylo,A.yhi,ny||5)){ const Y=A.fy(v);
      if(Y<A.y0-.5||Y>A.y0+A.h+.5) continue;
      ctx.beginPath(); ctx.moveTo(A.x0,Y); ctx.lineTo(A.x0+A.w,Y); ctx.stroke();
      ctx.textAlign='right'; ctx.fillText(tickLabel(v),A.x0-6,Y+4); }
    ctx.textAlign='left';
    ctx.strokeStyle='rgba(120,135,165,.35)';
    ctx.strokeRect(A.x0,A.y0,A.w,A.h);
    ctx.fillStyle='#9aa2b4'; ctx.font='12px -apple-system, sans-serif';
    if(title) ctx.fillText(title,A.x0+8,A.y0+15);
    if(xlab){ ctx.textAlign='center'; ctx.fillText(xlab,A.x0+A.w/2,A.y0+A.h+30); ctx.textAlign='left'; }
    if(ylab){ ctx.save(); ctx.translate(A.x0-42,A.y0+A.h/2); ctx.rotate(-Math.PI/2);
      ctx.textAlign='center'; ctx.fillText(ylab,0,0); ctx.restore(); ctx.textAlign='left'; }
  }
  function plot(A,xs,ys,col,w,dash){
    ctx.save(); ctx.beginPath(); ctx.rect(A.x0,A.y0,A.w,A.h); ctx.clip();
    ctx.setLineDash(dash||[]); ctx.strokeStyle=col; ctx.lineWidth=w||1.6;
    ctx.beginPath();
    for(let i=0;i<xs.length;i++){ const X=A.fx(xs[i]), Y=A.fy(ys[i]);
      i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  function bars(A,vals,colFn,lo){
    ctx.save(); ctx.beginPath(); ctx.rect(A.x0,A.y0,A.w,A.h); ctx.clip();
    const n=vals.length, bw=A.w/n*0.62;
    for(let i=0;i<n;i++){
      const X=A.fx(i+1), Y=A.fy(vals[i]), Y0=A.fy(lo===undefined?A.ylo:lo);
      ctx.fillStyle=colFn(i);
      ctx.fillRect(X-bw/2,Math.min(Y,Y0),bw,Math.abs(Y0-Y));
    }
    ctx.restore();
  }
  function legendAt(x,y,items){
    ctx.font='11px -apple-system, sans-serif';
    let lx=x;
    for(const [col,lab] of items){
      ctx.fillStyle=col; ctx.fillRect(lx,y-7,11,3);
      ctx.fillStyle='#9aa2b4'; ctx.fillText(lab,lx+16,y-2);
      lx+=ctx.measureText(lab).width+40;
    }
  }

  /* ---------------- power and the rotating field ---------------- */
  function drawPower(){
    const W=cam.W,H=cam.H, N=M.N;
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const gap=54, topH=Math.max(150,(H-140)*0.52), botH=H-140-topH;
    /* --- instantaneous powers --- */
    let lo=0, hi=0;
    for(let k=0;k<N;k++) for(let i=0;i<=180;i++){
      const v=M.S.p(k,TAU*i/180); if(v<lo)lo=v; if(v>hi)hi=v; }
    for(const v of M.power.trace){ if(v<lo)lo=v; if(v>hi)hi=v; }
    const pad=0.12*(hi-lo||1);
    const A=makeAxes(72,24,W-104,topH,0,TAU,lo-pad,hi+pad);
    frame(A,'one electrical cycle','power','instantaneous power',6,5);
    const xs=[]; for(let i=0;i<=360;i++) xs.push(TAU*i/360);
    for(let k=0;k<N;k++)
      plot(A,xs,xs.map(t=>M.S.p(k,t)),rgba(phaseCol(k,N),N>6?0.45:0.8),1.3);
    plot(A,xs,xs.map(t=>M.S.pTotal(t)),'#b8ec4c',2.8);
    ctx.save(); ctx.beginPath(); ctx.rect(A.x0,A.y0,A.w,A.h); ctx.clip();
    ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(184,236,76,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(A.x0,A.fy(M.power.mean)); ctx.lineTo(A.x0+A.w,A.fy(M.power.mean));
    ctx.stroke(); ctx.setLineDash([]);
    { const t=(tAnim*TAU)%TAU;
      ctx.strokeStyle='rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.moveTo(A.fx(t),A.y0); ctx.lineTo(A.fx(t),A.y0+A.h); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle=M.power.ripple<1e-9?'#b8ec4c':'#cd35c4';
    ctx.font='italic 13px Georgia, serif';
    ctx.fillText(M.power.ripple<1e-9
        ? 'the sum is exactly flat — every quadratic is isotropic for N ≥ 3'
        : 'the sum ripples by '+fmtPct(M.power.ripple)+' — m = 2 is divisible by N',
      A.x0+8,A.y0+A.h-10);

    /* --- the alpha-beta locus --- */
    const sq=Math.min(botH,(W-160)/2);
    const B2=makeAxes(72,24+topH+gap,sq,botH,-2.2,2.2,-2.2,2.2);
    frame(B2,'α','β','the current vector',4,4);
    const al=[], be=[];
    for(let i=0;i<=360;i++){ const c=clarke(M.S,TAU*i/360); al.push(c.al); be.push(c.be); }
    plot(B2,al,be,'#b8ec4c',2.2);
    { const c=clarke(M.S,(tAnim*TAU)%TAU);
      ctx.save(); ctx.beginPath(); ctx.rect(B2.x0,B2.y0,B2.w,B2.h); ctx.clip();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(B2.fx(0),B2.fy(0)); ctx.lineTo(B2.fx(c.al),B2.fy(c.be)); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(B2.fx(c.al),B2.fy(c.be),3.4,0,TAU); ctx.fill();
      ctx.restore(); }
    ctx.fillStyle=M.power.bripple<1e-9?'#b8ec4c':'#cd35c4';
    ctx.font='italic 12px Georgia, serif';
    ctx.fillText(M.power.bripple<1e-9?'a circle: the field rotates':'a line: the field pulsates',
      B2.x0+8,B2.y0+B2.h-10);

    /* --- where the ripple went: rectifier pulse number --- */
    const C=makeAxes(72+sq+90,24+topH+gap,W-(72+sq+90)-32,botH,2,24,0,0.55);
    frame(C,'pulse number p','ripple factor','the residue, as a rectifier sees it',6,5);
    const ps=[], rs=[];
    for(let p=2;p<=24;p++){ ps.push(p); rs.push(rectifier(p).rf); }
    plot(C,ps,rs,'#5ac8e0',2.2);
    ctx.save(); ctx.beginPath(); ctx.rect(C.x0,C.y0,C.w,C.h); ctx.clip();
    for(const [p,lab] of [[2,'single-phase bridge'],[6,'three-phase bridge'],[12,'12-pulse']]){
      const X=C.fx(p), Y=C.fy(rectifier(p).rf);
      ctx.fillStyle=p===6?'#b8ec4c':'#8b93a6';
      ctx.beginPath(); ctx.arc(X,Y,p===6?5:3.4,0,TAU); ctx.fill();
      ctx.font='10.5px -apple-system, sans-serif';
      ctx.fillText(lab+'  '+fmtPct(rectifier(p).rf),X+8,Y-4);
    }
    ctx.restore();
    legendAt(A.x0+8,A.y0+A.h+44,[['#b8ec4c','sum of all phases'],
      [phaseCol(0,N),'individual phases'],['#5ac8e0','α–β locus']]);
  }

  /* ---------------- the rotor ---------------- */
  function drawRotor(){
    const W=cam.W,H=cam.H, N=M.N, R=st.Rrot, zh=st.zh;
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const psi=(tAnim*TAU)%TAU;
    const sq=Math.min(H-96,W*0.42);
    const cx=40+sq/2, cy=40+sq/2, rad=sq*0.42;
    /* wind shear as a vertical gradient behind the disc */
    const zTop=zh+R, zBot=Math.max(1,zh-R);
    for(let i=0;i<48;i++){
      const f=i/48, z=lerp(zTop,zBot,f), v=shearV(z,zh,st.alpha);
      ctx.fillStyle=rgba('#5ac8e0',0.05+0.16*clamp((v-0.75)/0.5,0,1));
      ctx.fillRect(cx-rad*1.25,cy-rad*1.25+f*rad*2.5,rad*2.5,rad*2.5/48+1);
    }
    ctx.strokeStyle='rgba(120,135,165,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,cy,rad,0,TAU); ctx.stroke();
    /* the tower */
    ctx.strokeStyle='rgba(140,150,170,.55)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy+rad*1.5); ctx.stroke();
    /* the blades, each shaded by its own thrust */
    const cur=rotorLoads(M.rotor.opt,psi);
    const fmin=Math.min.apply(null,cur.per), fmax=Math.max.apply(null,cur.per);
    for(let k=0;k<N;k++){
      const a=psi+TAU*k/N;
      /* azimuth 0 is straight up, and increases the way the rotor turns */
      const dx=Math.sin(a), dy=-Math.cos(a);
      const f=cur.per[k], u=fmax>fmin?(f-fmin)/(fmax-fmin):0.5;
      ctx.strokeStyle=mix('#4aa8e0','#e8543a',u); ctx.lineWidth=7;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+dx*rad,cy+dy*rad); ctx.stroke();
      ctx.fillStyle='#cfd4de'; ctx.font='10.5px -apple-system, sans-serif'; ctx.textAlign='center';
      ctx.fillText(f.toFixed(3),cx+dx*rad*1.14,cy+dy*rad*1.14+3);
      ctx.textAlign='left';
    }
    ctx.fillStyle='#8b93a6'; ctx.beginPath(); ctx.arc(cx,cy,7,0,TAU); ctx.fill();
    ctx.fillStyle='#9aa2b4'; ctx.font='12px -apple-system, sans-serif';
    ctx.fillText(N+' blade'+(N===1?'':'s')+' — colour and number are that blade’s thrust',
      40,40+sq+22);
    ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#7d8698';
    ctx.fillText('wind shear v(z) = v_h (z/z_h)^'+st.alpha.toFixed(2)
      +(st.linear?'  [LINEARISED]':'')+(st.tower?'  + tower notch':''),40,40+sq+40);

    /* the traces */
    const px=40+sq+78, pw=W-px-34, ph=(H-120)/3-16;
    const azi=[]; for(let i=0;i<360;i++) azi.push(i);
    /* The y-range must be taken over EVERY series the panel will draw, not just
       the first one.  Scaling to the tilt moment alone pushed the yaw curve
       clean off the panel — clipped, so it never showed as an error, it just
       silently was not there. */
    const mk=(y0,series,title,ylab)=>{
      let lo=Infinity, hi=-Infinity;
      for(const sr of series){ const s=stats(sr.vals);
        if(s.lo<lo) lo=s.lo; if(s.hi>hi) hi=s.hi; }
      const pad=Math.max(1e-9,0.25*(hi-lo));
      const A=makeAxes(px,y0,pw,ph,0,359,lo-pad,hi+pad);
      frame(A,null,ylab,title,6,4);
      for(const sr of series) plot(A,azi,sr.vals,sr.col,sr.w||2.2);
      ctx.save(); ctx.beginPath(); ctx.rect(A.x0,A.y0,A.w,A.h); ctx.clip();
      ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1;
      const X=A.fx(psi/TAU*360);
      ctx.beginPath(); ctx.moveTo(X,A.y0); ctx.lineTo(X,A.y0+A.h); ctx.stroke(); ctx.restore();
      return A;
    };
    mk(24,[{vals:M.rotor.T,col:'#b8ec4c'}],
       'total thrust — peak-to-peak '+fmtSmall(M.rotor.thrustPP),'ΣF');
    const A2=mk(24+ph+52,[{vals:M.rotor.Mt,col:'#e8543a'},
                          {vals:M.rotor.My,col:'rgba(74,168,224,.85)',w:1.6}],
      'tilt and yaw — tilt peak-to-peak '+fmtSmall(M.rotor.tiltPP),'moment');
    /* the spectrum: the theorem, read off a Fourier transform */
    const smax=Math.max(1e-12,Math.max.apply(null,M.rotor.spec));
    const A3=makeAxes(px,24+2*(ph+52),pw,ph,0.5,12.5,0,smax*1.15);
    frame(A3,'harmonic of rotor speed','amplitude','tilt-moment spectrum',12,4);
    bars(A3,M.rotor.spec.slice(1),i=>(i+1)%N===0?'#b8ec4c':'rgba(205,53,196,.75)',0);
    ctx.fillStyle='#b8ec4c'; ctx.font='italic 12px Georgia, serif';
    ctx.fillText('everything below '+ordinal(N)+' is exactly zero',A3.x0+8,A3.y0+A3.h-10);
    legendAt(A2.x0+8,A2.y0+A2.h+30,[['#e8543a','tilt (nodding)'],['#4aa8e0','yaw']]);
  }

  /* ---------------- why three ---------------- */
  let whyCache=null;
  function whyData(){
    if(whyCache) return whyCache;
    const Ns=[1,2,3,4,5,6,7,8], cond=[], rip=[], tilt=[], tip=[];
    for(const n of Ns){
      cond.push(n>=2?conductorAC(n):NaN);
      const S=makeSystem({N:n});
      rip.push(stats(sampleP(t=>S.pTotal(t),360)).pp);
      const o={N:n,R:st.Rrot,zh:st.zh,alpha:st.alpha,linear:st.linear,
               tower:st.tower,towerDepth:st.towerDepth,towerWidth:st.towerWidth,nS:16};
      const s=[]; for(let i=0;i<180;i++) s.push(rotorLoads(o,TAU*i/180).Mt);
      tilt.push(stats(s).pp);
      tip.push(prandtlF(n,st.lam));
    }
    whyCache={Ns,cond,rip,tilt,tip};
    return whyCache;
  }
  function drawWhy(){
    const W=cam.W,H=cam.H, D=whyData();
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const cw=(W-140)/2, chh=(H-150)/2, gx=90, gy=70;
    const hi=(i)=>D.Ns[i]===M.N;
    /* conductor volume, with DC on the same axis */
    const A=makeAxes(gx,26,cw,chh,0.5,8.5,0,9);
    frame(A,'number of phases N','relative volume','conductor material',8,4);
    bars(A,D.cond.map(v=>isFinite(v)?v:0),i=>D.Ns[i]===3?'#b8ec4c':hi(i)?'#5ac8e0':'rgba(120,135,165,.45)',0);
    ctx.save(); ctx.beginPath(); ctx.rect(A.x0,A.y0,A.w,A.h); ctx.clip();
    ctx.setLineDash([6,4]); ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(A.x0,A.fy(CONDUCTOR_DC)); ctx.lineTo(A.x0+A.w,A.fy(CONDUCTOR_DC));
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#cd35c4'; ctx.font='11px -apple-system, sans-serif';
    ctx.fillText('bipolar DC = 4 — beats every AC system',A.x0+10,A.fy(CONDUCTOR_DC)-6);
    ctx.restore();
    ctx.fillStyle='#b8ec4c'; ctx.font='italic 12px Georgia, serif';
    ctx.fillText('minimum at N = 3, uniquely',A.x0+8,A.y0+A.h-10);

    /* power ripple: the cliff */
    const B2=makeAxes(gx+cw+gx*0.7,26,cw,chh,0.5,8.5,0,2.3);
    frame(B2,'number of phases N','peak-to-peak / mean','power ripple',8,4);
    bars(B2,D.rip.map((v,i)=>v/(D.Ns[i]/2)),i=>D.Ns[i]>=3?'#b8ec4c':'rgba(205,53,196,.8)',0);
    ctx.fillStyle='#b8ec4c'; ctx.font='italic 12px Georgia, serif';
    ctx.fillText('falls off a cliff at N = 3 and never comes back',B2.x0+8,B2.y0+B2.h-10);

    /* rotor cyclic load, log axis */
    const lg=v=>Math.log10(Math.max(v,1e-6));
    const C=makeAxes(gx,26+chh+gy,cw,chh,0.5,8.5,lg(1e-4),lg(2));
    frame(C,'number of blades N','log₁₀ peak-to-peak','rotor cyclic tilt moment',8,5);
    bars(C,D.tilt.map(lg),i=>D.Ns[i]===3?'#b8ec4c':hi(i)?'#5ac8e0':'rgba(232,84,58,.7)',lg(1e-4));
    ctx.fillStyle='#e8543a'; ctx.font='italic 12px Georgia, serif';
    ctx.fillText('1P and 2P vanish at N = 3 — '
      +(D.tilt[1]/D.tilt[2]).toFixed(1)+'× less shaking than two blades',C.x0+8,C.y0+C.h-10);

    /* what more blades still buy, against what they cost */
    const E=makeAxes(gx+cw+gx*0.7,26+chh+gy,cw,chh,0.5,8.5,0,2.2);
    frame(E,'number of blades N','relative','benefit vs cost',8,5);
    plot(E,D.Ns,D.tip,'#5ac8e0',2.4);
    plot(E,D.Ns,D.Ns.map(n=>n/3),'#e8543a',2.0,[6,4]);
    ctx.save(); ctx.beginPath(); ctx.rect(E.x0,E.y0,E.w,E.h); ctx.clip();
    for(let i=0;i<D.Ns.length;i++){ const X=E.fx(D.Ns[i]), Y=E.fy(D.tip[i]);
      ctx.fillStyle=D.Ns[i]===3?'#b8ec4c':'#5ac8e0';
      ctx.beginPath(); ctx.arc(X,Y,D.Ns[i]===3?5:3,0,TAU); ctx.fill(); }
    ctx.restore();
    legendAt(E.x0+8,E.y0+E.h+30,[['#5ac8e0','Prandtl tip-loss factor'],['#e8543a','blade cost ∝ N']]);
    ctx.fillStyle='#9aa2b4'; ctx.font='italic 12px Georgia, serif';
    ctx.fillText('benefit saturates, cost does not',E.x0+8,E.y0+E.h-10);
  }

  function draw(){
    if(st.view==='space') draw3D();
    else if(st.view==='power') drawPower();
    else if(st.view==='rotor') drawRotor();
    else drawWhy();
  }
  function step(dt){
    if(st.spin&&st.view==='space') cam.theta+=dt*0.22;
    if(st.anim) tAnim=(tAnim+dt*0.12*st.speed)%1;
  }
  function pointer(type,e){
    if(st.view!=='space') return;
    if(type==='move'){ cam.theta-=e.dx*0.008; cam.phi=clamp(cam.phi+e.dy*0.008,-1.42,1.42); }
  }
  function wheel(dy){ if(st.view==='space') cam.dist=clamp(cam.dist*Math.exp(dy*0.0011),2.2,14); }
  function resetView(){ cam.theta=-0.55; cam.phi=0.30; cam.dist=6.6; }
  /* look straight down the zero-sequence axis: the trajectory becomes the
     phasor diagram, which is the shadow every textbook draws */
  function lookDownZero(){
    const u=zeroAxis(M?M.N:3);
    cam.phi=clamp(Math.asin(clamp(u[2],-1,1)),-1.40,1.40);
    cam.theta=Math.atan2(u[1],u[0]);
    cam.dist=6.0;
  }
  function invalidate(){ whyCache=null; }

  rebuild();
  return { st, cam, draw, step, pointer, wheel, resetView, lookDownZero,
           rebuild:()=>{ rebuild(); invalidate(); }, invalidate,
           model:()=>M, tAnim:()=>tAnim,
           tag:()=>tagHTML(M,st), readout:()=>readoutHTML(M,st),
           eqbar:()=>eqbarHTML(M,st.view) };
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['space','phase space'],['power','power'],['rotor','rotor'],['why','why three']];
  TABS.forEach(([k,label])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      syncPanel(); refresh(); }},label));
  });

  const rows={};
  function slider(key,label,lo,hi,step,fmt){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,label),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmt(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmt(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,label,rebuild){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(rebuild!==false) S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,label);
  }

  const gN=h('div',{class:'grp'},h('h3',null,'how many'));
  gN.appendChild(slider('N','phases / blades',1,12,1,v=>String(v)));
  gN.appendChild(h('div',{class:'checks'},checkbox('quad','2-phase in quadrature (Tesla)')));
  const nTag=h('div',{class:'tag'}); gN.appendChild(nTag);

  const gSig=h('div',{class:'grp'},h('h3',null,'break the symmetry'));
  gSig.appendChild(slider('unb','unbalance a',0,0.6,0.01,v=>(100*v).toFixed(0)+'%'));
  gSig.appendChild(slider('pf','current lag',0,1.4,0.02,v=>(v/DEG).toFixed(0)+'°'));
  gSig.appendChild(slider('h3','3rd harmonic',0,0.5,0.01,v=>(100*v).toFixed(0)+'%'));
  gSig.appendChild(slider('h5','5th harmonic',0,0.5,0.01,v=>(100*v).toFixed(0)+'%'));
  gSig.appendChild(slider('h7','7th harmonic',0,0.5,0.01,v=>(100*v).toFixed(0)+'%'));
  const sigTag=h('div',{class:'tag'}); gSig.appendChild(sigTag);

  const gRot=h('div',{class:'grp'},h('h3',null,'rotor'));
  gRot.appendChild(slider('Rrot','blade length',20,90,1,v=>v.toFixed(0)+' m'));
  gRot.appendChild(slider('zh','hub height',40,160,1,v=>v.toFixed(0)+' m'));
  gRot.appendChild(slider('alpha','shear exponent',0,0.4,0.005,v=>v.toFixed(3)));
  gRot.appendChild(slider('lam','tip-speed ratio',2,12,0.5,v=>v.toFixed(1)));
  gRot.appendChild(h('div',{class:'checks'},
    checkbox('linear','linearised shear (exact closed forms)'),
    checkbox('tower','tower-shadow notch')));
  gRot.appendChild(slider('towerDepth','notch depth',0,0.3,0.01,v=>(100*v).toFixed(0)+'%'));
  const rotTag=h('div',{class:'tag'}); gRot.appendChild(rotTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'show'));
  const checks=h('div',{class:'checks'},
    checkbox('showSub','the balanced subspace',false),
    checkbox('showShadow','shadow on that subspace',false),
    checkbox('showBox','box',false),
    checkbox('showWave','waveform inset',false),
    checkbox('anim','animate',false),
    checkbox('spin','auto-orbit',false));
  gShow.appendChild(checks);
  gShow.appendChild(slider('speed','speed',0.2,4,0.1,v=>v.toFixed(1)+'×'));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.lookDownZero(); dirty=true; refresh(); }},'look down zero axis'),
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view')));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuild(); S.resetView();
                              syncPanel(); refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gN,gSig,gRot,gShow,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncPanel(){
    gSig.hidden = st.view==='rotor'||st.view==='why';
    gRot.hidden = st.view==='space'||st.view==='power';
    rows.towerDepth.row.hidden = !st.tower;
    rows.speed.row.hidden = !st.anim;
    for(const k in rows) rows[k].sync();
    [].forEach.call(checks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showSub','showShadow','showBox','showWave','anim','spin'][i]]; });
    const q=gN.querySelector('input[type=checkbox]');
    if(q){ q.checked=st.quad; q.disabled=st.N!==2; }
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = st.view==='space'
        ? 'drag to orbit · scroll to zoom · "look down zero axis" turns the trajectory into the phasor diagram'
        : st.view==='rotor' ? 'every harmonic below the blade count is exactly zero — that is the theorem'
        : st.view==='why' ? 'two different cost arguments, and they both land on three'
        : 'the sum of the phase powers is the m = 2 case of the root-of-unity sum';
      subEl.innerHTML='why three &mdash; the root-of-unity sum, evaluated twice';
      const dim=st.N-1;
      nTag.innerHTML='balanced subspace has dimension <b>'+dim+'</b>; a rotation needs <b>2</b> — '
        +(dim>=2?'<span class="g">it fits</span>':'<span class="r">it does not fit</span>')
        +(st.N===2&&st.quad?'<br>quadrature rotates, but &Sigma;i<sub>k</sub> &ne; 0 — it needs a fourth wire':'');
      sigTag.innerHTML='zero sequence <b>'+fmtSmall(M.power.zeroPP)+'</b> pk-pk; power ripple <b>'
        +(M.power.ripple<1e-9?'zero':fmtPct(M.power.ripple))+'</b>'
        +(st.h3>0?'<br>the 3rd harmonic is <span class="r">pure zero sequence</span> — it cannot leave a three-wire feed':'');
      rotTag.innerHTML='&beta; = &alpha;R/z<sub>h</sub> = <b>'
        +shearBeta({alpha:st.alpha,R:st.Rrot,zh:st.zh}).toFixed(4)+'</b>; first harmonic <b>'
        +(M.rotor.firstH?ordinal(M.rotor.firstH):'none')+'</b>'
        +(st.linear?'<br><span class="g">closed forms are exact on this profile</span>':'');
      infoEl.innerHTML=INFO[st.view]||INFO.space;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it: the frame loop only
     redraws while something is animating, so every interaction that touches the
     camera must ask for a frame.  (steam_carnot_cycle.html Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='z'){ S.lookDownZero(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='4'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(t){
    const dt=last?Math.min((t-last)/1000,0.05):0; last=t;
    S.step(dt);
    if(st.anim||st.spin||dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

const INFO={
  space:'Three currents are three numbers, so the state of the system is a point in a '
    +'<b>cube</b>. Balanced means the three sum to zero, which is a <b>plane</b> through the '
    +'origin — drawn here as the hexagon. A balanced sinusoidal set runs round a <b>circle</b> '
    +'inscribed in that plane, and looking down the [1,1,1] diagonal turns that circle into the '
    +'phasor diagram. With two phases the whole space is a square and the balanced set is a '
    +'<b>line</b>: there is no plane to rotate in, so the field pulsates instead. That is the '
    +'entire argument for three.',
  power:'Power is voltage times current — a <b>quadratic</b> — so the sum of the phase powers is '
    +'the m = 2 case of the root-of-unity sum, and it is flat for every N ≥ 3 whatever the power '
    +'factor. The ripple is not destroyed, it is <b>moved up to the Nth harmonic</b>, which is why '
    +'a three-phase bridge rectifier is a 6-pulse machine with 4.2% ripple against single-phase’s '
    +'48%. Add a 3rd harmonic and watch it land in the zero sequence; add a 5th and watch the '
    +'circle deform without ever leaving the plane.',
  rotor:'Thrust goes as the <b>square</b> of the local wind speed, and wind speed varies across '
    +'the disc because of shear — so the rotor is the same m = 2 sum, with azimuth in place of '
    +'time. One blade shakes the tower at 1P, two blades at 2P, and three blades cancel both '
    +'exactly, leaving only <b>3P</b>. The spectrum on the right is the theorem read straight off '
    +'a Fourier transform: every harmonic below the blade count is zero to machine precision.',
  why:'N ≥ 3 buys isotropy. Stopping at exactly three is a <b>cost</b> argument, and it is a '
    +'different cost on each side. For conductors the material needed is 8 sin²(π⌊N/2⌋/N), which '
    +'has a <b>unique minimum at three</b> — but bipolar DC needs only 4, which is why the longest '
    +'lines on earth are DC and why AC actually won on the transformer and the rotating field, not '
    +'on copper. For rotors the cyclic load keeps falling past three, but so does the benefit, '
    +'while blade cost climbs linearly.'};

/* ================================================================== *
 *  self-test                                                          *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond){ pass++; } else { fail++; console.log('FAIL — '+name); } };
  const chk=(name,got,want,tol,rel)=>{
    const e=rel?Math.abs(got-want)/Math.abs(want):Math.abs(got-want);
    if(e<=tol) pass++; else { fail++;
      console.log('FAIL — '+name+': got '+Number(got).toPrecision(12)
                  +' want '+Number(want).toPrecision(12)+' err '+e.toExponential(3)); } };

  /* ---------- THE THEOREM, by brute summation against the identity ------- */
  { let worst=0;
    for(let N=1;N<=24;N++) for(let m=0;m<=30;m++) for(const th of [0,0.37,2.1]){
      const s=rootSum(N,m,th);
      const wr=divides(N,m)?N*Math.cos(m*th):0, wi=divides(N,m)?N*Math.sin(m*th):0;
      worst=Math.max(worst,Math.abs(s[0]-wr),Math.abs(s[1]-wi));
    }
    ok(worst<1e-11,'root-of-unity sum matches the identity for N=1..24, m=0..30 (worst '
       +worst.toExponential(2)+')'); }
  /* the m = 2 corollary, which is the entire content of "why not two" */
  for(const N of [1,2,3,4,5,6,7,12]){
    let worst=0, wantConst=N>=3;
    const f=th=>{ let s=0; for(let k=0;k<N;k++) s+=Math.pow(Math.cos(th+TAU*k/N),2); return s; };
    for(const th of [0,0.3,0.7,1.1,2.0,3.3,5.1]) worst=Math.max(worst,Math.abs(f(th)-N/2));
    if(wantConst) ok(worst<1e-13,'sum cos^2 = N/2 for N='+N+' (worst dev '+worst.toExponential(2)+')');
    else ok(worst>0.2,'sum cos^2 DOES vary with angle for N='+N+' — this is why it fails');
  }
  chk('N=2: sum cos^2 = 1 + cos 2th at th=0.4',
      Math.pow(Math.cos(0.4),2)+Math.pow(Math.cos(0.4+Math.PI),2),
      1+Math.cos(0.8),1e-13,false);
  chk('N=1: sum cos^2 = cos^2 th at th=0.4',Math.pow(Math.cos(0.4),2),
      Math.pow(Math.cos(0.4),2),1e-15,false);
  /* the dimension argument, stated as the code sees it */
  for(let N=1;N<=6;N++)
    ok((N-1>=2)===(N>=3),'balanced subspace of N='+N+' has dimension '+(N-1)
       +', and needs 2 to host a rotation');

  /* ---------- power: the m = 2 case ------------------------------------- */
  for(let N=1;N<=8;N++){
    const S=makeSystem({N}), a=sampleP(t=>S.pTotal(t),720), s=stats(a);
    chk('N='+N+' mean power = N/2',s.mean,N/2,1e-12,true);
    if(N>=3){
      ok(s.pp<1e-12,'N='+N+' instantaneous power is exactly constant (pk-pk '
         +s.pp.toExponential(2)+')');
      ok(firstHarmonic(a,1e-9,24)===0,'N='+N+' power carries no harmonic at all');
    } else {
      chk('N='+N+' power ripples by 200% of its mean',s.ripple,2,1e-9,true);
      ok(firstHarmonic(a,1e-9,24)===2,'N='+N+' ripples at exactly 2f');
    }
  }
  /* constant even at bad power factor — a real and slightly surprising fact */
  for(const pf of [0,0.3,0.9,1.4]){
    const S=makeSystem({N:3,pf}), s=stats(sampleP(t=>S.pTotal(t),720));
    ok(s.pp<1e-12,'three-phase power stays flat at a lag of '+(pf/DEG).toFixed(0)+' deg');
    chk('and equals (N/2) cos(phi) at '+(pf/DEG).toFixed(0)+' deg',s.mean,1.5*Math.cos(pf),1e-12,true);
  }
  /* THE HONEST COUNTER-EXAMPLE: quadrature two-phase is also perfectly flat */
  { const S=makeSystem({N:2,quad:true}), s=stats(sampleP(t=>S.pTotal(t),720));
    ok(s.pp<1e-12,'Tesla quadrature two-phase ALSO gives constant power (pk-pk '
       +s.pp.toExponential(2)+') — the claim is not "only N>=3"');
    const z=stats(sampleP(t=>clarke(S,t).z,720));
    ok(z.pp>0.5,'but its currents do NOT sum to zero, so it needs a fourth wire (zero pk-pk '
       +z.pp.toFixed(3)+')'); }

  /* ---------- the rotating field ---------------------------------------- */
  for(let N=1;N<=8;N++){
    const S=makeSystem({N}), m=sampleP(t=>fieldVec(S,t).mag,720), s=stats(m);
    if(N>=3){
      chk('N='+N+' rotating field magnitude = N/2',s.mean,N/2,1e-12,true);
      ok(s.pp<1e-12,'N='+N+' field magnitude is constant — it rotates');
    } else {
      ok(s.lo<1e-9&&s.hi>0.9*N,'N='+N+' field collapses to zero twice a cycle — it pulsates, '
         +'which is why a single-phase induction motor cannot start itself');
    }
  }
  { const S=makeSystem({N:2,quad:true}), s=stats(sampleP(t=>fieldVec(S,t).mag,720));
    ok(s.pp<1e-12,'quadrature two-phase does produce a rotating field'); }
  /* the field vector IS the Clarke vector, scaled */
  { const S=makeSystem({N:3,h5:0}); let worst=0;
    for(let i=0;i<50;i++){ const t=TAU*i/50, f=fieldVec(S,t), c=clarke(S,t);
      worst=Math.max(worst,Math.abs(f.x-1.5*c.al),Math.abs(f.y-1.5*c.be)); }
    ok(worst<1e-13,'the rotating field is exactly (N/2) times the Clarke vector'); }

  /* ---------- Clarke, zero sequence, and the harmonics ------------------ */
  { const S=makeSystem({N:3});
    const z=stats(sampleP(t=>clarke(S,t).z,720)), m=stats(sampleP(t=>clarke(S,t).mag,720));
    ok(z.pp<1e-12,'balanced three-phase has no zero sequence at all');
    chk('and a constant Clarke magnitude of 1',m.mean,1,1e-12,true);
    ok(m.pp<1e-12,'exactly constant'); }
  for(const hh of [3,9]){
    const S=makeSystem({N:3,harm:[{h:hh,amp:1}]});
    const z=stats(sampleP(t=>clarke(S,t).z,720)), m=stats(sampleP(t=>clarke(S,t).mag,720));
    chk('harmonic '+hh+' is PURE zero sequence, amplitude 1',z.pp,2,1e-12,true);
    ok(m.pp<1e-12,'harmonic '+hh+' adds nothing to the rotating plane — it cannot leave a '
       +'three-wire feed');
  }
  for(const hh of [5,7,11,13]){
    const S=makeSystem({N:3,harm:[{h:hh,amp:0.3}]});
    const z=stats(sampleP(t=>clarke(S,t).z,720));
    ok(z.pp<1e-12,'harmonic '+hh+' produces no zero sequence (it is not a triplen)');
    const p=stats(sampleP(t=>S.pTotal(t),1440));
    ok(p.pp>1e-6,'and it DOES ripple the power, at harmonic '
       +firstHarmonic(sampleP(t=>S.pTotal(t),1440),1e-9,24));
  }
  { const S=makeSystem({N:3,unb:0.3});
    const z=stats(sampleP(t=>clarke(S,t).z,720));
    chk('a 30% unbalance on phase a puts 0.1 of zero sequence amplitude in',z.pp,0.2,1e-12,true);
    ok(stats(sampleP(t=>S.pTotal(t),720)).pp>1e-6,'and ripples the power'); }

  /* ---------- conductors ------------------------------------------------ */
  chk('single-phase (N=2, 180 deg) conductor volume',conductorAC(2),8,1e-13,false);
  chk('three-phase conductor volume',conductorAC(3),6,1e-13,false);
  chk('four-phase is no better than single-phase',conductorAC(4),8,1e-13,false);
  chk('five-phase',conductorAC(5),8*Math.pow(Math.sin(TAU/5),2),1e-13,false);
  chk('six-phase is back to 8',conductorAC(6),8,1e-13,false);
  chk('three-phase uses exactly 3/4 the copper of single-phase',
      conductorAC(3)/conductorAC(2),0.75,1e-15,false);
  { let best=2, bad=0;
    for(let N=2;N<=80;N++){ if(conductorAC(N)<conductorAC(best)-1e-12) best=N;
      if(N!==3&&conductorAC(N)<=conductorAC(3)+1e-12) bad++; }
    ok(best===3&&bad===0,'N=3 is the UNIQUE minimum of conductor volume over N=2..80'); }
  ok(!isFinite(conductorAC(1)),'a single conductor cannot carry power, and says so');
  /* and the correction the sim was built to make */
  ok(CONDUCTOR_DC<conductorAC(3),'bipolar DC (4) beats three-phase AC (6) on conductor material');
  chk('DC needs two-thirds of three-phase copper',CONDUCTOR_DC/conductorAC(3),2/3,1e-15,false);
  { let allBeaten=true;
    for(let N=2;N<=40;N++) if(conductorAC(N)<=CONDUCTOR_DC) allBeaten=false;
    ok(allBeaten,'DC beats EVERY evenly spaced AC system, not just three-phase'); }

  /* ---------- rectifiers, against the textbook table -------------------- */
  for(const [p,va,rf] of [[2,0.63662,0.48343],[3,0.82699,0.18271],[6,0.95493,0.04197],
                          [12,0.98862,0.01028]]){
    const r=rectifier(p);
    chk('p='+p+' rectifier mean output',r.Vavg,va,1e-4,true);
    chk('p='+p+' ripple factor',r.rf,rf,1e-3,true);
  }
  { let mono=true; for(let p=2;p<24;p++) if(rectifier(p+1).rf>=rectifier(p).rf) mono=false;
    ok(mono,'ripple factor falls monotonically with pulse number');
    ok(rectifier(48).Vavg>0.999,'and the mean output tends to the peak'); }

  /* ---------- the rotor: closed forms on the profile they belong to ------ */
  const RO={R:63, zh:90, alpha:0.14, nS:16};
  const beta=shearBeta(RO);
  chk('shear gradient beta = alpha R / z_hub',beta,0.14*63/90,1e-15,true);
  for(let N=3;N<=6;N++){
    const o=Object.assign({N,linear:true},RO), NR=512;
    const rl=[]; for(let i=0;i<NR;i++) rl.push(rotorLoads(o,TAU*i/NR));
    const T=rl.map(x=>x.T), Mt=rl.map(x=>x.Mt);
    chk('linear shear, N='+N+': mean thrust = N(1+beta^2/6)',
        stats(T).mean,rotorClosed.thrust(N,beta),1e-12,true);
    chk('linear shear, N='+N+': mean tilt = N beta/3',
        stats(Mt).mean,rotorClosed.tiltMean(N,beta),1e-12,true);
    ok(stats(T).pp<1e-12,'linear shear, N='+N+': total thrust is exactly constant');
  }
  { const NR=512;
    const o2=Object.assign({N:2,linear:true},RO), o3=Object.assign({N:3,linear:true},RO);
    const M2=[],M3=[];
    for(let i=0;i<NR;i++){ M2.push(rotorLoads(o2,TAU*i/NR).Mt); M3.push(rotorLoads(o3,TAU*i/NR).Mt); }
    chk('two blades: cyclic tilt 2P amplitude = 2 beta/3',
        harmAmp(M2,2),rotorClosed.tilt2P(beta),1e-12,true);
    chk('three blades: cyclic tilt 3P amplitude = 3 beta^2/16',
        harmAmp(M3,3),rotorClosed.tilt3P(beta),1e-12,true);
    ok(harmAmp(M3,1)<1e-12&&harmAmp(M3,2)<1e-12,
       'three blades: 1P and 2P are gone to machine precision');
    chk('the order changes from beta to beta^2: ratio = 32/(9 beta)',
        harmAmp(M2,2)/harmAmp(M3,3),32/(9*beta),1e-10,true); }

  /* ---------- the rotor: the STRUCTURE, on the real power-law shear ------ */
  for(let N=1;N<=8;N++){
    const o=Object.assign({N},RO), NR=512, rl=[];
    for(let i=0;i<NR;i++) rl.push(rotorLoads(o,TAU*i/NR));
    const T=rl.map(x=>x.T), Mt=rl.map(x=>x.Mt), My=rl.map(x=>x.My);
    ok(firstHarmonic(T,1e-9,40)===N,'power-law shear, N='+N+': first thrust harmonic is exactly '
       +ordinal(N));
    ok(firstHarmonic(Mt,1e-9,40)===N,'power-law shear, N='+N+': first tilt harmonic is exactly '
       +ordinal(N));
    ok(firstHarmonic(My,1e-9,40)===N,'power-law shear, N='+N+': first yaw harmonic is exactly '
       +ordinal(N));
    for(let m=1;m<N;m++) ok(harmAmp(Mt,m)<1e-11,'N='+N+': harmonic '+m+' is zero');
  }
  /* the realistic reduction, reported rather than the linearised one */
  { const pp=[];
    for(let N=1;N<=4;N++){ const o=Object.assign({N},RO), s=[];
      for(let i=0;i<360;i++) s.push(rotorLoads(o,TAU*i/360).Mt);
      pp.push(stats(s).pp); }
    ok(pp[1]/pp[2]>4&&pp[1]/pp[2]<9,'on the REAL power-law shear, three blades shake '
       +(pp[1]/pp[2]).toFixed(1)+'x less than two — not the 36x the linearisation promises');
    ok(pp[0]>pp[1]&&pp[1]>pp[2]&&pp[2]>pp[3],'and the cyclic load falls monotonically with N'); }
  /* uniform wind: nothing to cancel, and nothing does */
  { for(let N=1;N<=5;N++){
      const o={N,R:63,zh:90,alpha:0,nS:16}, s=[], m=[];
      for(let i=0;i<180;i++){ const r=rotorLoads(o,TAU*i/180); s.push(r.T); m.push(r.Mt); }
      chk('uniform wind, N='+N+': thrust is exactly N',stats(s).mean,N,1e-13,true);
      ok(stats(s).pp<1e-13,'uniform wind, N='+N+': no thrust ripple');
      if(N>=2) ok(stats(m).pp<1e-13&&Math.abs(stats(m).mean)<1e-13,
                  'uniform wind, N='+N+': no tilt moment at all');
    } }
  /* the tower notch is a second, independent source of the same NP */
  { const o={N:3,R:63,zh:90,alpha:0,nS:16,tower:true,towerDepth:0.12,towerWidth:0.35};
    const s=[]; for(let i=0;i<512;i++) s.push(rotorLoads(o,TAU*i/512).T);
    ok(firstHarmonic(s,1e-9,40)===3,'a tower notch with NO shear still excites exactly 3P');
    ok(stats(s).pp>1e-6,'and it is not negligible'); }

  /* ---------- Prandtl tip loss ------------------------------------------ */
  { let mono=true;
    for(let N=1;N<8;N++) if(prandtlF(N+1,7)<=prandtlF(N,7)) mono=false;
    ok(mono,'the tip-loss factor rises with blade number');
    for(const N of [1,3,8]) ok(prandtlF(N,7)>0&&prandtlF(N,7)<1,
      'tip-loss factor for N='+N+' lies in (0,1): '+prandtlF(N,7).toFixed(4));
    ok(prandtlF(60,7)>0.99,'and tends to 1 for many blades');
    const g12=prandtlF(2,7)-prandtlF(1,7), g34=prandtlF(4,7)-prandtlF(3,7);
    ok(g34<g12*0.3,'the gain saturates: 3->4 buys '+(100*g34).toFixed(1)
       +' points against 1->2 buying '+(100*g12).toFixed(1)); }
  chk('Betz limit',BETZ,16/27,1e-15,true);

  /* ---------- the Fourier tools, checked on signals with known content --- */
  { const n=512, sig=[];
    for(let i=0;i<n;i++) sig.push(0.7*Math.cos(3*TAU*i/n+0.4)+0.25*Math.cos(7*TAU*i/n));
    chk('harmAmp recovers a known 3rd harmonic',harmAmp(sig,3),0.7,1e-12,true);
    chk('harmAmp recovers a known 7th harmonic',harmAmp(sig,7),0.25,1e-12,true);
    ok(harmAmp(sig,5)<1e-12,'and reports zero where there is nothing');
    ok(firstHarmonic(sig,1e-9,20)===3,'firstHarmonic finds the lowest one present');
    ok(firstHarmonic(sampleP(()=>1,64),1e-9,20)===0,'and returns 0 for a constant'); }
  { const s=stats([1,2,3,4]);
    chk('stats mean',s.mean,2.5,1e-15,false); chk('stats pk-pk',s.pp,3,1e-15,false); }

  /* ---------- geometry helpers ------------------------------------------ */
  for(let N=1;N<=5;N++){
    const u=zeroAxis(N);
    chk('zero axis is a unit vector for N='+N,v3.len(u),1,1e-15,false);
    if(N<=3){ let same=true;
      for(let k=0;k<N;k++) if(Math.abs(u[k]-1/Math.sqrt(N))>1e-15) same=false;
      ok(same,'zero axis for N='+N+' is [1,1,..]/sqrt(N)'); }
    else ok(u[2]===1,'zero axis for N='+N+' is the Clarke zero axis');
  }
  /* a balanced trajectory must lie IN the balanced subspace */
  { const M3=buildModel(Object.assign({},DEFAULTS,{N:3}));
    const u=zeroAxis(3); let worst=0;
    for(let i=0;i<60;i++) worst=Math.max(worst,Math.abs(v3.dot(statePoint(M3,TAU*i/60),u)));
    ok(worst<1e-15,'the balanced three-phase trajectory lies exactly in the plane (worst '
       +worst.toExponential(2)+')');
    /* and its radius is sqrt(3/2), the circle inscribed in that plane */
    let rr=0, rlo=9;
    for(let i=0;i<60;i++){ const L2=v3.len(statePoint(M3,TAU*i/60));
      rr=Math.max(rr,L2); rlo=Math.min(rlo,L2); }
    chk('and it is a circle of radius sqrt(3/2)',rr,Math.sqrt(1.5),1e-12,true);
    ok(rr-rlo<1e-12,'a circle, not an ellipse'); }
  { const M2=buildModel(Object.assign({},DEFAULTS,{N:2}));
    let off=0;
    for(let i=0;i<60;i++){ const p=statePoint(M2,TAU*i/60); off=Math.max(off,Math.abs(p[0]+p[1])); }
    ok(off<1e-15,'the two-phase trajectory also lies in its balanced subspace — which is a LINE');
    let area=0;
    for(let i=0;i<60;i++){ const p=statePoint(M2,TAU*i/60); area=Math.max(area,Math.abs(p[0]-(-p[1]))); }
    ok(area<1e-12,'and it has no width at all: nothing to rotate in'); }

  /* ---------- colour and formatting -------------------------------------- */
  { ok(toRgb('#e8543a').join()==='232,84,58','toRgb parses 6-digit hex');
    ok(toRgb('#abc').join()==='170,187,204','toRgb parses 3-digit hex');
    ok(toRgb('rgb(58,111,142)').join()==='58,111,142','toRgb parses rgb()');
    ok(toRgb('rgba(58,111,142,0.5)').join()==='58,111,142','toRgb parses rgba()');
    ok(toRgb(mix('#e8543a','#4aa8e0',0.5)).every(c=>c>0),'mix output re-parses non-black');
    ok(toRgb(shade(mix('#e8543a','#e5c94b',0.4),0.9)).reduce((a,b)=>a+b)>150,
       'a two-stage blend stays bright');
    let threw=false; try{ toRgb('chartreuse'); }catch(e){ threw=true; }
    ok(threw,'toRgb throws on an unparseable colour instead of silently going black');
    const seen={};
    for(let N=1;N<=12;N++) for(let k=0;k<N;k++){ const c=phaseCol(k,N);
      ok(toRgb(c).reduce((a,b)=>a+b)>60,'phase colour '+k+' of '+N+' is not black'); }
    ok(phaseCol(0,3)!==phaseCol(1,3)&&phaseCol(1,3)!==phaseCol(2,3),
       'the three phases get three different colours'); }
  { ok(ticks(0,1,5).length>=4,'ticks span a unit range');
    ok(ticks(-2,2,4).indexOf(0)>=0,'ticks include zero when the range straddles it');
    ok(tickLabel(0)==='0','tick label for zero');
    ok(fmtPct(0.25)==='25.00%','percentage formatting');
    ok(fmtSmall(0)==='0','small formatter handles zero');
    ok(ordinal(3)==='3P','ordinal naming'); }

  /* ---------- every panel string the UI will ask for --------------------- */
  for(const v of ['space','power','rotor','why']) ok(INFO[v]&&INFO[v].length>100,
    'INFO exists for view '+v);
  for(const N of [1,2,3,4,6,12]) for(const q of [false,true]){
    if(q&&N!==2) continue;
    const s=Object.assign({},DEFAULTS,{N,quad:q,unb:0.1,h3:0.1,h5:0.1,pf:0.3});
    const M=buildModel(s);
    for(const v of ['space','power','rotor','why']){
      const html=readoutHTML(M,s)+eqbarHTML(M,v)+tagHTML(M,Object.assign({},s,{view:v}));
      ok(html.length>400&&html.indexOf('NaN')<0&&html.indexOf('undefined')<0,
         'panels build clean for N='+N+(q?' quad':'')+' / '+v);
    }
    ok(eqbarText(M).indexOf('NaN')<0,'the headless text summary is clean for N='+N);
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
