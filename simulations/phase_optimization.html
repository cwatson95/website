<title>Phase optimization — why three, and only three</title>
<!--
  WHY THREE.

  Three-phase power and the three-bladed wind turbine are the same theorem.
  Not an analogy — the same sum, evaluated twice.

  THE THEOREM.  Put N unit vectors at equal angles round a circle,
  th_k = th + 2 pi k / N, and ask for the sum of their m-th powers:

      SUM_k exp( i m th_k )  =  N exp(i m th)   if  N divides m
                            =  0                otherwise

  It is the root-of-unity sum, and everything below is one line of it.

    m = 1   The vectors themselves cancel, for every N >= 2.
            -> the three line currents sum to zero, so no neutral conductor
               is needed; the three blade weights exert no net side force.

    m = 2   Every QUADRATIC quantity built on them is isotropic — independent
            of th — but only for N >= 3, because m = 2 is divisible by N when
            N is 1 or 2.  This is the whole story:
              SUM_k cos^2(th + 2 pi k/N) = N/2      for N >= 3
                                         = 1 + cos 2th   for N = 2
            -> instantaneous electrical power is CONSTANT (power is v times i,
               a quadratic), so a three-phase machine has no torque ripple;
            -> rotor thrust and the tilt/yaw moments are CONSTANT (thrust goes
               as wind speed squared), so a three-bladed rotor does not shake.

    m = N   The first sum that does NOT vanish.  The ripple is not abolished,
            it is moved up to the Nth harmonic and shrunk.  Engineers have a
            name for it on both sides: the "NP" or blade-passing excitation of
            a rotor (3P for three blades), and the pulse number of a rectifier
            (6-pulse for a three-phase bridge).

  WHY NOT TWO — THE SHARP FORM.  Constant-magnitude rotation needs a 2-PLANE to
  rotate in.  A balanced system is confined to the subspace SUM_k i_k = 0, which
  has dimension N - 1.  So you need

      N - 1 >= 2      i.e.      N >= 3

  and that is the entire argument.  With N = 2 you can have rotation OR a zero
  sum, never both: the 180-degree pair traces a LINE through the origin, which
  pulsates instead of rotating (which is exactly why a single-phase induction
  motor cannot start itself), while Tesla's 90-degree quadrature pair does
  rotate on a perfect circle — and needs a fourth wire to carry the sum away.
  Three is the first N where the rotation plane FITS INSIDE the balanced
  subspace.  The sim draws that, literally: the cube of (i_a, i_b, i_c), the
  plane i_a + i_b + i_c = 0 cutting it as a hexagon, and the state point running
  round a circle inscribed in that plane.  Look down the [1,1,1] diagonal and
  the circle is the phasor diagram; that is the shadow the textbook draws.

  Three variables, and the optimum uses exactly two of them:
      3 currents  =  2 (the rotating plane, alpha-beta)  +  1 (zero sequence)
  This is the Clarke transform, and "optimization in phase space" is the
  instruction to put everything in the 2 and nothing in the 1.

  WHERE IT STOPS BEING THE SAME THEOREM.  N >= 3 buys isotropy.  Stopping at
  exactly 3 is a COST argument, and it is a different cost on each side:

    - Electrical.  For a given insulation rating (peak volts between any two
      conductors), power and line loss, the conductor volume needed goes as
      8 sin^2( pi floor(N/2) / N ).  That is 8 for single-phase, 6 for
      three-phase, 8 again for four- and six-phase, 7.24 for five-phase —
      minimised UNIQUELY at N = 3, and by a wide margin.  Three-phase uses
      exactly 3/4 the copper of single-phase, which is the classic result, and
      it is derived here rather than quoted.

    - Rotor.  Going from two blades to three drops the cyclic tilt moment from
      order beta to order beta^2, where beta = alpha R / z_hub is the wind-shear
      gradient across the rotor.  For a blade of uniform loading, integrated
      along its span, the closed forms are exactly
          2P amplitude (N = 2)  =  2 beta / 3
          3P amplitude (N = 3)  =  3 beta^2 / 16
      a ratio of 32/(9 beta), which is 36-fold at a typical beta = 0.098.  Both
      are asserted against a numerical Fourier transform in selfTest, to 1e-12.
      BUT those closed forms belong to a LINEARISED shear, and the real
      atmosphere is a power law whose argument (R/z_hub, up to 0.7) is nowhere
      near small; run the real profile and the honest reduction from two blades
      to three is 6.3-fold, not 36.  The sim reports the realistic number and
      keeps the closed forms for what they explain — the change of ORDER, which
      is the part that is exact.  Beyond three, every extra blade costs mass and
      money and buys only tip-loss factor, which is already saturating.

  AN HONEST CORRECTION, since this sim was asked to show that three-phase beats
  DC.  It does not beat DC at everything, and the sim says so on its own charts.
  On CONDUCTOR MATERIAL, direct current wins outright: bipolar DC needs a
  relative volume of 4 against three-phase AC's 6, because it uses two
  conductors at full voltage instead of three at 1/sqrt(3) of it and has no
  peak-versus-RMS penalty.  That is not a quibble, it is the reason HVDC exists
  for long lines and every submarine cable.  Alternating current won the 1890s
  on the TRANSFORMER — cheap voltage conversion, which DC could not do — and
  three-phase in particular won on the ROTATING FIELD: a constant-magnitude
  field from stationary windings, no commutator, no brushes.  That is the
  phase-space optimization, and it is why practically every industrial motor
  turned is three-phase while the longest power lines are DC.

  ALSO TRUE, ALSO SAID OUT LOUD.  Constant power is not unique to N >= 3 evenly
  spaced: Tesla's two-phase quadrature system delivers perfectly constant power
  too, and selfTest asserts it does.  What three-phase has that quadrature
  two-phase does not is the zero sum — three wires instead of four, and 6
  units of copper instead of 8.

  WHAT IS NOT MODELLED.  The rotor uses a deliberately simple aerodynamic law —
  thrust per unit span proportional to the square of the local wind speed, with
  uniform loading — because its job is to expose the AZIMUTHAL structure, which
  is exact, not to predict absolute loads, which would need blade-element
  momentum theory and an aerofoil table.  Blade-number effects on the power
  coefficient are shown through the Prandtl tip-loss factor, a published closed
  form, and are labelled as such; the sim does not compute C_p.

  Single file, no dependencies, works over file://.  All 3D — orbit camera,
  perspective projection, painter's algorithm — is hand-rolled on canvas 2D,
  same z-up camera as lattice.html, steam_carnot_cycle.html and turbojet.html.
  Mathematica NeonColors for the trails (same NEON_STOPS table as the rest of
  this collection).

  Headless self-test: extract the script body (between the LAST script
  open/close tags, cf. rindex) and run it with
      osascript -l JavaScript phase_test.js
  — with `document` undefined it runs the assertion suite instead of booting
  the UI.
-->
