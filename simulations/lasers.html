<title>Lasers — ruby, He&ndash;Ne, diode, Rigrod, dye, NIF</title>
<!--
  Six ways to build a laser, one mechanism: pump a population inversion,
  let stimulated emission run away inside a resonator. Views in the order
  the machines were invented; every panel shows the hardware, the energy
  levels, and a measured curve, all computed live from the same functions
  the self-test pins.

  RUBY view (1960, the first): Maiman's flashlamp-pumped Cr3+:sapphire rod,
  integrated live as the three-level rate equations
      dn2/dt = W(t)(N-n2) - n2/tau - c'sigma(2n2-N)phi
      dphi/dt = c'sigma(2n2-N)phi - phi/tau_c + beta n2/tau
  with W(t) a sin^2 flashlamp half-period (1 ms) and an exponential-split
  photon update (stable at dt = 0.5 ns against the c'sigma N ~ 6.8e9/s
  absorption rate; validated against a dt = 0.05 ns RK4 reference to 0.006%
  in pulse energy). Three-level burden: gain needs n2 > N/2 (x_th = 0.5389
  with the mirror losses), so a 1 ms flash against tau = 3 ms must overdrive
  the quasi-static threshold (F = Wpk tau ~ 6, not 1.17). Above it: the
  classic relaxation spikes - microsecond substructure, ~150 kW peaks,
  ~1 J in the pulse, n2 gain-clamped to x_th between spikes (mean
  |x - x_th| ~ 0.0007). Traces: W(t), x(t) with the x_th line, P(t)
  lin/log; inset: pulse energy vs flash drive - the threshold knee.

  HE-NE view (1960-62, the first gas laser and first CW): a glow discharge
  pumps He 2^1S metastables (166277.440 cm^-1), resonant collisions hand the
  energy to Ne 3s2 (166658.484 cm^-1, dE = 381 cm^-1 ~ 1.4 kT), which lases
  to 2p4 (150860.482 cm^-1): 1e7/15798.00 = 632.99 nm vacuum = 632.82 nm in
  air. 2p4 empties radiatively in ~10 ns, but the 1s metastable below it
  only relaxes on the TUBE WALL - the bore-diameter bottleneck. The panel
  models the whole chain as gain g0L(i) = 2 g^ (i/i0)/(1+(i/i0)^2) (electron
  excitation minus the 1s-driven deexcitation that grows with current),
  fed through the same Rigrod solver as the design panel: lasing only
  between i = 1.17 and 30.7 mA, ~1.2 mW at the 6 mA optimum with the real
  He-Ne numbers (g0L = 2%, T = 1%, I_s A = 0.15 W). Watch the purple-ringed
  1s atoms crowd the tube as you raise the current past the optimum.

  POINTER view (diode 1962, pointer ~1990): a battery pushes carriers into
  a forward-biased AlGaInP double heterostructure; population inversion
  between bands, cleaved-facet mirrors with Fresnel R = ((n-1)/(n+1))^2 =
  0.309 at n = 3.5. The L-I curve is the whole story: LED glow below
  threshold, then P = eta_d (hnu/e)(I - I_th), slope 0.305 W/A at 650 nm
  with eta_d = 0.16, I_th(T) = 22 mA x exp((T-25)/T0), T0 = 60 K. At the
  38 mA operating point: 4.9 mW - just under the 5 mW Class 3R limit -
  but 7.9 mW on a -10 C morning and dead in a 60 C glovebox: the
  temperature slider is the product-engineering lesson.

  RIGROD view (1965, the design curve every CW laser is sized with):
  W. W. Rigrod's saturated-gain oscillator, J. Appl. Phys. 36, 2487.
      dI+-/dz = +-[g0/(1 + (I+ + I-)/I_s) - alpha] I+-
  has the exact first integral I+(z) I-(z) = const, which reduces the
  boundary-value problem (I+(0) = R1 I-(0), I-(L) = R2 I+(L)) to one
  shooting parameter. Solved live by RK4 + bisection; at alpha = 0 it
  matches Rigrod's closed form
      I_out = I_s (1-R2) r1 (g0L - ln 1/(r1 r2)) / ((r1+r2)(1-r1 r2))
  to 4e-13. The panel draws the intracavity I+-(z) profiles, P_out and
  extraction efficiency vs output coupling T with the threshold at
  g0L = alpha L + ln 1/(r1 r2), the optimum marked, and the mean-field
  bound eta_opt ~ (1 - sqrt(alphaL/g0L))^2 (matches to 4e-4 at low gain).
  Presets: He-Ne (1.2 mW), Nd:YAG (112 W), KrF excimer (11 MW pulsed,
  eta_opt = 0.465 at T = 0.67 - why high-gain lasers wear doorknob
  couplers, and why NIF is an amplifier chain, not an oscillator).

  DYE view (1966, the first tunable laser): Rhodamine-6G-like jet. Broad
  vibronic S0/S1 manifolds give mirror-image absorption (peak 530 nm) and
  emission (peak 563 nm) bands; net gain g(lambda) = x sigma_e - (1-x)
  sigma_a - n_T sigma_T - L_c opens a ~40 nm window (563-601 nm at x = 8%
  pump) whose peak RED-shifts as the pump drops (ground-state reabsorption).
  A 1800 line/mm Littrow grating tunes: lambda = 2d sin(theta). The
  triplet trap: intersystem crossing feeds T1 (tau_T ~ 100 us) and
  triplet-triplet absorption sits right on the gain band, so CW operation
  needs the dye to OUTRUN it - the 1970 free-flowing jet. Slide the jet
  speed to zero and watch the laser die with the gain still pumped.

  NIF view (Nd:glass at Lawrence Livermore, ignition Dec 5 2022): ruby's
  four-level descendant. A nJ fiber oscillator pulse rides preamplifier
  (x1e9) then four passes through flashlamp-pumped Nd:phosphate slabs,
  each pass the exact Frantz-Nodvik map
      F_out = F_sat ln(1 + G0 (e^{F_in/F_sat} - 1)),   F_sat = hnu/sigma
            = 4.84 J/cm^2
  over the 37.2 x 37.2 cm aperture: ~16 kJ/beam at 1053 nm, x192 beams,
  frequency-tripled at 55% to 351 nm. Because F ~ 3 F_sat the amps run
  deep in saturation (that IS the extraction), and because the lower
  level empties by phonons, any inversion lases - contrast the ruby
  panel's n2 > N/2 tax. Slide the pass gain and injected energy across
  the 2.05 MJ line to reproduce the 3.15 MJ target-gain-1.5 shot.

  Aesthetic matches the other sims in this collection: black stage,
  Mathematica NeonColors accents, spectral colors through the shared CIE
  pipeline (with the deep-red patch: the Wyman CMF fit's ybar tail turns
  694.3 nm orange, a recorded fit artifact, so laser beams use the fit
  only to 680 nm and pure red beyond). Single file, no dependencies,
  works over file://.

  Headless self-test: extract the script body (substring between the LAST
  script open/close tags, cf. rindex) and run it with
      osascript -l JavaScript ls_test.js
  With `document` undefined it runs the assertion suite instead of booting
  the UI: every number above (level arithmetic vs NIST cm^-1 values,
  Rigrod closed-vs-shooting and swap symmetry, extraction bounds, the full
  ruby integration replayed and compared against the Python-audited pins,
  Frantz-Nodvik limits and chain energies, dye window/red-shift/triplet
  kill, pointer L-I numbers, Littrow angles, Fresnel facet, CIE spot
  colors and the red-tail patch, formats and clamps). A DOM-stub driver
  (same JXA file, phase 2) then boots the UI headless and drives every
  view, chip and slider.
  Sources: Maiman, Nature 187, 493 (1960); Javan-Bennett-Herriott, PRL 6,
  106 (1961); White-Rigden 632.8 nm (1962); NIST ASD for the He/Ne levels;
  Rigrod, JAP 36, 2487 (1965); Frantz-Nodvik, JAP 34, 2346 (1963);
  Sorokin-Lankard (1966), Schafer (1966), Peterson-Tuccio-Snavely CW jet
  (1970); LLNL NIF shot N221204: 2.05 MJ in, 3.15 MJ fusion yield.
-->

<script>
'use strict';
/* =================== constants (SI 2019, exact) ================== */
const PI = Math.PI, TAU = 2*PI;
const HPL = 6.62607015e-34;         // J s
const C0  = 2.99792458e8;           // m/s
const KB  = 1.380649e-23;           // J/K
const QE  = 1.602176634e-19;        // C
const HCE = 1239.8419843320026;     // eV nm — photon energy hc/(e lambda)
function photonEV(lamNm){ return HCE/lamNm; }
function photonJ(lamNm){ return HCE/lamNm*QE; }

/* ============ CIE color (Wyman-Sloan-Shirley fit, shared) ======== */
function lobe(x,mu,s1,s2){ const s=x<mu?s1:s2, d=(x-mu)/s;
  return Math.exp(-0.5*d*d); }
function cieX(l){ return 1.056*lobe(l,599.8,37.9,31.0)+0.362*lobe(l,442.0,16.0,26.7)
                       -0.065*lobe(l,501.1,20.4,26.2); }
function cieY(l){ return 0.821*lobe(l,568.8,46.9,40.5)+0.286*lobe(l,530.9,16.3,31.1); }
function cieZ(l){ return 1.217*lobe(l,437.0,11.8,36.0)+0.681*lobe(l,459.0,26.0,13.8); }
function srgbGamma(v){ return v<=0.0031308 ? 12.92*v : 1.055*Math.pow(v,1/2.4)-0.055; }
function xyzToRgb(X,Y,Z){
  let r= 3.2406*X-1.5372*Y-0.4986*Z,
      g=-0.9689*X+1.8758*Y+0.0415*Z,
      b= 0.0557*X-0.2040*Y+1.0570*Z;
  const m=Math.max(r,g,b);
  if (m<=0) return [0,0,0];
  r=Math.max(0,r)/m; g=Math.max(0,g)/m; b=Math.max(0,b)/m;
  return [srgbGamma(r),srgbGamma(g),srgbGamma(b)];
}
function spectralRgb(lnm){
  if (lnm<380||lnm>780) return null;
  return xyzToRgb(cieX(lnm),cieY(lnm),cieZ(lnm));
}
const IR_RGB=[0.30,0.17,0.11], UV_RGB=[0.27,0.20,0.42];   // display-only fallbacks
/* Deep-red patch: the Gaussian CMF fit's ybar tail overpowers xbar past
   ~680 nm (renders ruby's 694.3 nm ORANGE, g = 0.39 — a recorded fit
   artifact, cf. blackbody_radiation.html). Laser beams use the fit only
   to 680 nm and pure red from there to the visible edge. */
function beamRgb(lnm){
  if (lnm>780) return IR_RGB;
  if (lnm<380) return UV_RGB;
  if (lnm>680) return [1,0,0];
  return spectralRgb(lnm);
}
function cssOf(rgb){ return 'rgb('+Math.round(255*rgb[0])+','+Math.round(255*rgb[1])+','+
                            Math.round(255*rgb[2])+')'; }
function beamCss(lnm){ return cssOf(beamRgb(lnm)); }
function spectralCss(lnm){
  let c;
  if (lnm<380) c=UV_RGB; else if (lnm>750) c=IR_RGB; else c=spectralRgb(lnm)||IR_RGB;
  return cssOf(c);
}

/* ================= colormap: Mathematica NeonColors ==============
   Same exact 16-sample table as the other sims in this collection. */
const NEON_STOPS=[
  [0.0000, 0.7203,0.9238,0.2976],
  [0.0667, 0.7332,0.8250,0.2939],
  [0.1333, 0.7462,0.7263,0.2903],
  [0.2000, 0.7591,0.6275,0.2866],
  [0.2667, 0.7720,0.5287,0.2830],
  [0.3333, 0.7849,0.4300,0.2793],
  [0.4000, 0.8089,0.3632,0.2617],
  [0.4667, 0.8316,0.3178,0.2550],
  [0.5333, 0.8515,0.3153,0.2700],
  [0.6000, 0.8580,0.3213,0.3191],
  [0.6667, 0.8577,0.3317,0.3854],
  [0.7333, 0.8473,0.3071,0.4623],
  [0.8000, 0.8369,0.2825,0.5391],
  [0.8667, 0.8266,0.2578,0.6160],
  [0.9333, 0.8162,0.2332,0.6929],
  [1.0000, 0.8058,0.2086,0.7698],
];
function neon(t){
  t=Math.max(0,Math.min(1,t));
  const S=NEON_STOPS;
  let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}

/* ========================= formatters ============================ */
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵',
           '6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function sup(n){ return String(n).split('').map(ch=>SUP[ch]||'').join(''); }
function fmtExp(v,unit){
  if (v===0) return '0'+(unit?' '+unit:'');
  const e=Math.floor(Math.log10(Math.abs(v)));
  if (e>=-2&&e<=3) return (+ (+v).toPrecision(3))+(unit?' '+unit:'');
  const m=v/Math.pow(10,e);
  return m.toFixed(1)+'×10'+sup(e)+(unit?' '+unit:'');
}
function fmtW(w){                    // auto-ranged power
  const a=Math.abs(w);
  if (a>=1e9) return +(w/1e9).toPrecision(3)+' GW';
  if (a>=1e6) return +(w/1e6).toPrecision(3)+' MW';
  if (a>=1e3) return +(w/1e3).toPrecision(3)+' kW';
  if (a>=1)   return +(+w).toPrecision(3)+' W';
  if (a>=1e-3) return +(w*1e3).toPrecision(3)+' mW';
  if (a>=1e-6) return +(w*1e6).toPrecision(3)+' µW';
  if (a>=1e-9) return +(w*1e9).toPrecision(3)+' nW';
  return fmtExp(w,'W');
}
function fmtJ(j){
  const a=Math.abs(j);
  if (a>=1e6) return +(j/1e6).toPrecision(3)+' MJ';
  if (a>=1e3) return +(j/1e3).toPrecision(3)+' kJ';
  if (a>=1)   return +(+j).toPrecision(3)+' J';
  if (a>=1e-3) return +(j*1e3).toPrecision(3)+' mJ';
  if (a>=1e-6) return +(j*1e6).toPrecision(3)+' µJ';
  if (a>=1e-9) return +(j*1e9).toPrecision(3)+' nJ';
  return fmtExp(j,'J');
}

/* ====================== ruby: 3-level Maiman ===================== */
const RUBY={
  TAU:3e-3,          // 2E lifetime, s
  SIG:2.5e-20,       // R1-line cross-section, cm^2
  N:1.6e19,          // Cr3+ density, cm^-3 (0.05 wt%)
  L:2.0,             // rod length, cm (Maiman's was ~2 cm)
  NR:1.763,          // sapphire index
  R1:0.999,          // back silver
  ALPHA:0.01,        // internal loss, cm^-1
  V:1.27,            // mode volume, cm^3
  CCM:2.9979245e10,  // c in cm/s
  TFL:1.0e-3,        // flashlamp half-sine-squared duration, s
  BETA:1e-13,        // spontaneous seed fraction
};
RUBY.HNU=1.98644586e-25/694.3e-9;   // J per 694.3 nm photon (hc/lambda)
function rubyConsts(R2){
  const drt=-Math.log(RUBY.R1*R2)+2*RUBY.ALPHA*RUBY.L;      // round-trip loss
  const dn_th=drt/(2*RUBY.SIG*RUBY.L);                      // inversion at thresh
  return {
    drt,
    x_th:0.5*(1+dn_th/RUBY.N),
    tauc:(2*RUBY.L*RUBY.NR/RUBY.CCM)/drt,
    frac_oc:-Math.log(R2)/drt,                              // fraction out the coupler
  };
}
function rubyPump(t,F){
  if (t>=RUBY.TFL) return 0;
  const s=Math.sin(PI*t/RUBY.TFL);
  return (F/RUBY.TAU)*s*s;                                  // peak rate F/tau
}
/* exponential-split step: exact linear photon update per dt (stable against
   the c'sigma N ~ 6.8e9/s absorption rate), midpoint-coupled n2 update. */
function rubyStep(S,F,R2,K,dt,nSteps){
  const cp=RUBY.CCM/RUBY.NR, pconv=RUBY.V*RUBY.HNU*K.frac_oc/K.tauc;
  let {t,n2,phi}=S;
  for (let i=0;i<nSteps;i++){
    const W=rubyPump(t,F);
    const dn=2*n2-RUBY.N;
    const G=cp*RUBY.SIG*dn-1/K.tauc;
    const Ssp=RUBY.BETA*n2/RUBY.TAU;
    const g=G*dt, eg=Math.exp(g);
    const phiNew=phi*eg+(Math.abs(g)>1e-8 ? Ssp*dt*(eg-1)/g : Ssp*dt);
    const phiMid=0.5*(phi+phiNew);
    n2+=dt*(W*(RUBY.N-n2)-n2/RUBY.TAU-cp*RUBY.SIG*dn*phiMid);
    if (n2<0) n2=0;
    phi=phiNew;
    t+=dt;
    const P=phi*pconv;
    S.Eout+=P*dt;
    if (P>S.Pmax) S.Pmax=P;
  }
  S.t=t; S.n2=n2; S.phi=phi;
  S.P=phi*pconv; S.W=rubyPump(t,F); S.x=n2/RUBY.N;
  return S;
}
function rubyRun(F,R2,opts){
  const o=opts||{};
  const dt=o.dt||0.5e-9, tmax=o.tmax||1.25e-3, sample=o.sample||4e-8;
  const K=rubyConsts(R2);
  const S={t:0,n2:0,phi:0,Eout:0,Pmax:0,P:0,W:0,x:0};
  const perChunk=Math.max(1,Math.round(sample/dt));
  const out=[];
  while (S.t<tmax){
    rubyStep(S,F,R2,K,dt,perChunk);
    out.push([S.t,S.x,S.P]);
  }
  return {K,samples:out,Pmax:S.Pmax,Eout:S.Eout};
}
function rubySpikes(samples,hi,lo){
  const H=hi||1e3, LO=lo||2e2;
  const times=[]; let above=false;
  for (const [t,,p] of samples){
    if (!above&&p>H){ above=true; times.push(t); }
    if (above&&p<LO) above=false;
  }
  return times;
}

/* ================== Rigrod saturated oscillator ==================
   dI+-/dz = +-[g0/(1+(I+ + I-)/Is) - a] I+-  on z in [0,1] (I in units
   of Is). Exact first integral I+ I- = c reduces to one ODE; shooting on
   u0 with geometric bisection. */
function rigrodSolve(g0L,aL,R1,R2,n){
  const NN=n||1200;
  const uLof=u0=>{
    const c=u0*u0/R1;
    let u=u0;
    const h=1/NN;
    const f=uu=>uu*(g0L/(1+uu+c/uu)-aL);
    for (let i=0;i<NN;i++){
      const k1=f(u),k2=f(u+0.5*h*k1),k3=f(u+0.5*h*k2),k4=f(u+h*k3);
      u+=h*(k1+2*k2+2*k3+k4)/6;
    }
    return u;
  };
  const resid=u0=>u0*u0/R1-R2*Math.pow(uLof(u0),2);
  if (resid(1e-14)>0) return {uL:0,v0:0,u0:0,P2:0,P1:0,on:false};
  let lo=1e-14,hi=1e5;
  for (let i=0;i<90;i++){
    const mid=Math.sqrt(lo*hi);
    if (resid(mid)<=0) lo=mid; else hi=mid;
  }
  const u0=Math.sqrt(lo*hi), uL=uLof(u0), c=u0*u0/R1;
  return {uL,v0:c/u0,u0,P2:(1-R2)*uL,P1:(1-R1)*(c/u0),on:true};
}
function rigrodProfile(g0L,aL,R1,R2,npts){
  const NP=npts||160;
  const s=rigrodSolve(g0L,aL,R1,R2,1600);
  const prof=[];
  if (!s.on){
    for (let i=0;i<=NP;i++) prof.push([i/NP,0,0]);
    return {s,prof};
  }
  const c=s.u0*s.u0/R1;
  let u=s.u0;
  const h=1/NP;
  const f=uu=>uu*(g0L/(1+uu+c/uu)-aL);
  prof.push([0,u,c/u]);
  for (let i=0;i<NP;i++){
    const k1=f(u),k2=f(u+0.5*h*k1),k3=f(u+0.5*h*k2),k4=f(u+h*k3);
    u+=h*(k1+2*k2+2*k3+k4)/6;
    prof.push([(i+1)/NP,u,c/u]);
  }
  return {s,prof,c};
}
function rigrodClosed(g0L,R1,R2){       // Rigrod 1965, alpha = 0
  const r1=Math.sqrt(R1), r2=Math.sqrt(R2);
  const x=g0L-Math.log(1/(r1*r2));
  if (x<=0) return 0;
  return (1-R2)*r1*x/((r1+r2)*(1-r1*r2));
}
function rigrodThr(aL,R1,R2){ return aL+0.5*Math.log(1/(R1*R2)); }
function rigrodCurve(g0L,aL,R1,npts){
  const NP=npts||110, out=[];
  // T from 0.2% up to just under the threshold coupling
  const Tmax=Math.min(0.98,1-Math.exp(-2*(g0L-aL))/R1);
  for (let i=0;i<NP;i++){
    const T=0.002+(Math.max(0.01,Tmax*1.04)-0.002)*i/(NP-1);
    if (T>=0.985) break;
    const s=rigrodSolve(g0L,aL,R1,1-T,700);
    out.push({T,P:T*s.uL,eta:g0L>0?(T*s.uL+(1-R1)*s.v0)/g0L:0});
  }
  return out;
}
function rigrodOpt(curve){
  let best=null;
  for (const p of curve) if (!best||p.P>best.P) best=p;
  return best;
}

function heneG0(i){ const u=i/HENE.I0; return 2*HENE.GHAT*u/(1+u*u); }

  const loss=rigrodThr(HENE.AL,HENE.R1,HENE.R2);

}

}

/* ==================== pointer: diode L-I ========================= */
const PTR={TREF:25, ETALED:5e-4};
/* Four pointers. red/blue/violet are direct diodes; green is what a green
   pointer actually is — a DPSS chain: 808 nm pump diode -> Nd:YVO4 1064 nm
   -> KTP frequency doubler (quadratic below saturation, and phase-matching
   that detunes ~exp(-((T-25)/18 K)^2): green pointers die in the cold,
   the exact opposite of the red diode). InGaN: Nakamura 1996 violet laser
   diode; T0 ~ 150-170 K (thermally robust) vs AlGaInP's 60 K. */
const DIODES={
  red:{lam:650, mat:'AlGaInP', ith0:22, t0:60,  etad:0.16, n:3.5},
  grn:{lam:532, mat:'DPSS',    ith0:25, t0:120, etad:0.52, n:3.5, dpss:true, pumpLam:808},
  blu:{lam:450, mat:'InGaN',   ith0:26, t0:150, etad:0.38, n:2.5},
  vio:{lam:405, mat:'InGaN',   ith0:30, t0:170, etad:0.30, n:2.5},
};
function fresnelR(n){ return Math.pow((n-1)/(n+1),2); }
function ptrIth(TC,d){ d=d||DIODES.red;
  return d.ith0*Math.exp((TC-PTR.TREF)/d.t0); }
function ptrSlope(d){ d=d||DIODES.red;
  return d.etad*photonEV(d.dpss?d.pumpLam:d.lam); }                 // W/A
function dpssPhase(TC){ const x=(TC-25)/18; return Math.exp(-x*x); }
function ptrP(ImA,TC,d){                                            // W
  d=d||DIODES.red;
  const ith=ptrIth(TC,d);
  if (d.dpss){
    const p808=ImA>ith ? ptrSlope(d)*(ImA-ith)*1e-3 : 0;
    const p1064=0.45*Math.max(0,p808-0.010);
    return Math.min(250*p1064*p1064,0.5*p1064)*dpssPhase(TC);
  }
  const led=PTR.ETALED*photonEV(d.lam)*ImA*1e-3;
  const las=ImA>ith ? ptrSlope(d)*(ImA-ith)*1e-3 : 0;
  return led+las;
}
function photopicV(lamNm){ return cieY(lamNm); }   // CIE ybar fit ~ V(lambda)

/* ================== dye: R6G-like tunable gain =================== */
const DYE={
  ABS_MU:530, ABS_S1:45, ABS_S2:13,    // absorption band (steep red edge)
  EM_MU:563,  EM_S1:16,  EM_S2:38,     // emission band (long red tail)
  T_MU:600,   T_S:70,    T_AMP:0.08,   // triplet-triplet absorption
  KISC:1e6,   TAUT:1e-4, DJET:30e-6,   // ISC rate (1/s), T1 life (s), spot (m)
  LC:0.03,                             // cavity loss per pass
  GRATING:1800,                        // lines/mm, Littrow
  PUMP_LAM:532,
};
function dyeSa(l){ return lobe(l,DYE.ABS_MU,DYE.ABS_S1,DYE.ABS_S2); }
function dyeSe(l){ return lobe(l,DYE.EM_MU,DYE.EM_S1,DYE.EM_S2); }
function dyeSt(l){ return DYE.T_AMP*lobe(l,DYE.T_MU,DYE.T_S,DYE.T_S); }
function dyeNT(x,v){                    // steady triplet fraction
  const taueff=1/(1/DYE.TAUT+v/DYE.DJET);
  return Math.min(1,DYE.KISC*x*taueff);
}
function dyeGain(l,x,v){                // net gain per pass (units of sigma_e N l)
  return x*dyeSe(l)-(1-x)*dyeSa(l)-dyeNT(x,v)*dyeSt(l)-DYE.LC;
}
function dyeWindow(x,v){
  let lo=null,hi=null;
  for (let l=540;l<660;l+=0.1)
    if (dyeGain(l,x,v)>0){ if (lo===null) lo=l; hi=l; }
  return {lo,hi};
}
function dyePeak(x,v){
  let best=-9,at=0;
  for (let l=540;l<660;l+=0.1){
    const g=dyeGain(l,x,v);
    if (g>best){ best=g; at=l; }
  }
  return {at,g:best};
}
function littrowDeg(lamNm){
  const d=1e6/DYE.GRATING;              // groove spacing, nm
  return Math.asin(lamNm/(2*d))*180/PI;
}

/* ============== NIF: Frantz-Nodvik amplifier chain =============== */
const NIF={
  SIG:3.9e-20,        // Nd:phosphate stimulated-emission sigma, cm^2
  LAM1:1053, LAM3:351,
  APER:37.2,          // cm, square beam
  NBEAM:192, ETA3:0.55, PASSES:4,
  MOR:1e-9,           // fiber master-oscillator pulse, J
  SHOT:{Elaser:2.05e6, Yield:3.15e6},   // N221204
};
NIF.HNU=1.98644586e-25/1053e-9;
NIF.FSAT=NIF.HNU/NIF.SIG;               // J/cm^2 = 4.837
NIF.AREA=NIF.APER*NIF.APER;
function fnPass(Fin,G0){                // exact Frantz-Nodvik map
  return NIF.FSAT*Math.log1p(G0*Math.expm1(Fin/NIF.FSAT));
}
function nifChain(EinJ,G0){
  const st=[{tag:'MOR',E:NIF.MOR},{tag:'preamp',E:EinJ}];
  let F=EinJ/NIF.AREA;
  for (let p=1;p<=NIF.PASSES;p++){
    F=fnPass(F,G0);
    st.push({tag:'pass '+p,E:F*NIF.AREA});
  }
  const E1=F*NIF.AREA;
  st.push({tag:'×192',E:E1*NIF.NBEAM});
  const E3=E1*NIF.NBEAM*NIF.ETA3;
  st.push({tag:'3ω',E:E3});
  return {stages:st,E1,E3,ignition:E3>=2.05e6};
}

  /* =================== He-Ne sim state =================== */
  const gasAtoms=[];
  (function(){
    for (let i=0;i<30;i++) gasAtoms.push({k:'he',x:Math.random(),y:Math.random(),
      vx:(Math.random()-0.5)*0.004,vy:(Math.random()-0.5)*0.004,st:'g',ttl:0});
    for (let i=0;i<10;i++) gasAtoms.push({k:'ne',x:Math.random(),y:Math.random(),
      vx:(Math.random()-0.5)*0.003,vy:(Math.random()-0.5)*0.003,st:'g',ttl:0});
  })();
  const gasPh=[];
  let gasFlash=0;
  const gasCache={i:-1,P:0,g0:0};
  let gasCurve=[], gasCurveN=71;
  function gasCalc(){
    if (gasCache.i!==state.gasI){
      gasCache.i=state.gasI;
      gasCache.g0=heneG0(state.gasI);
      gasCache.P=heneP(state.gasI);
    }
    return gasCache;
  }
  function gasCurveTick(){
    let n=0;
    while (gasCurve.length<gasCurveN && n<2){

      gasCurve.push({i,P:heneP(i),g0:heneG0(i)});
      n++;
    }
  }
  function stepGas(){
    const g=gasCalc(), sp=state.speed;
    const iRel=state.gasI/35;
    for (const a of gasAtoms){
      a.x+=a.vx*sp; a.y+=a.vy*sp;
      if (a.x<0.02||a.x>0.98) a.vx*=-1;
      if (a.y<0.06||a.y>0.94){
        a.vy*=-1;
        if (a.st==='s'){ a.st='g'; a.ttl=8; }    // 1s empties ON THE WALL
      }
      if (a.ttl>0) a.ttl--;
      if (a.k==='he'&&a.st==='g'&&Math.random()<0.02*iRel*sp) a.st='m';
      if (a.k==='ne'&&a.st==='u'){
        // electron quenching of the upper level grows ~ i^2 (the rolloff)
        if (Math.random()<0.09*sp){
          a.st='l'; a.ttl=14;
          if (g.P>1e-6){ gasPh.push({x:a.x,y:a.y,dir:Math.random()<0.5?1:-1}); gasFlash=8; }
        } else if (Math.random()<0.10*iRel*iRel*sp) a.st='l';
      } else if (a.k==='ne'&&a.st==='l'&&a.ttl<=0){ a.st='s'; }
    }
    // resonant transfer: He* meets ground Ne
    for (const he of gasAtoms){
      if (he.k!=='he'||he.st!=='m') continue;
      for (const ne of gasAtoms){
        if (ne.k!=='ne'||ne.st!=='g'||ne.ttl>0) continue;
        const dx=he.x-ne.x, dy=he.y-ne.y;
        if (dx*dx+dy*dy<0.0022){ he.st='g'; ne.st='u'; break; }
      }
    }
    for (let i=gasPh.length-1;i>=0;i--){
      const p=gasPh[i];
      p.x+=0.02*p.dir*sp;
      if (p.x<0.01){ p.dir=1; }
      if (p.x>0.99){ p.dir=-1; if (Math.random()<0.35) gasPh.splice(i,1); }
      else if (Math.random()<0.004) gasPh.splice(i,1);
    }
    const want=Math.min(22,Math.round(22*gasCalc().P/1.5e-3));
    while (gasPh.length>Math.max(0,want)) gasPh.pop();
    if (gasFlash>0) gasFlash--;

  }

  const rig={profKey:'',prof:null,curveKey:'',curve:null,opt:null,dirty:0,phase:0};
  function rigParams(){
    return {g0:state.rigG0, a:state.rigA, R1:state.rigR1/100, T:state.rigT/100,
            R2:1-state.rigT/100, IsA:state.rigIsA};

  function rigCalc(){
    const p=rigParams();
    const pk=[p.g0,p.a,p.R1,p.R2].join('|');
    if (rig.profKey!==pk){
      rig.prof=rigrodProfile(p.g0,p.a,p.R1,p.R2,140);
      rig.profKey=pk;
    }
    const ck=[p.g0,p.a,p.R1].join('|');
    if (rig.curveKey!==ck && rig.dirty<=0){
      rig.curve=rigrodCurve(p.g0,p.a,p.R1,64);
      rig.opt=rigrodOpt(rig.curve);
      rig.curveKey=ck;
    }
    return p;
  }

        ctx.beginPath(); ctx.moveTo(x,gy1+9); ctx.lineTo(x-6,gy1+5); ctx.lineTo(x-6,gy1+13);
        ctx.closePath(); ctx.fill();
      }
      // output beam
      const bA=Math.min(1,s.P2/(rig.opt?Math.max(rig.opt.P,1e-9):1));
      beamGlow(gx1+8,(hw.y0+18+gy1)/2,hw.x1+6,(hw.y0+18+gy1)/2,'#f2a45c',3.4,0.25+0.7*bA);
    } else {
      ctx.fillStyle='#c96';
      ctx.fillText('below threshold: g₀L < αL + ½ln 1/(R₁R₂)',gx0+30,(hw.y0+gy1)/2);
    }
    // --- P(T) and eta(T) plot ---
    frameBox(pl);
    const pw=pl.x1-pl.x0, ph=pl.y1-pl.y0;
    ctx.font='10px -apple-system, sans-serif';
    if (rig.curve&&rig.curve.length>2){
      let Pm=1e-12;
      for (const q of rig.curve) Pm=Math.max(Pm,q.P);
      const Tmax=rig.curve[rig.curve.length-1].T*1.02;
      const xT=t=>pl.x0+pw*t/Tmax, yP=v=>pl.y0+8+(ph-24)*(1-v/(1.12*Pm));
      const yE=v=>pl.y0+8+(ph-24)*(1-v);

      for (let m=0;m<=5;m++){
        const t=Tmax*m/5;
        ctx.fillText(Math.round(100*t)+'%',xT(t)-8,pl.y1+13);
      }
      ctx.fillText('output coupling T',pl.x1-96,pl.y1+13);
      ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.8; ctx.beginPath();
      rig.curve.forEach((q,i)=>{ if (i===0) ctx.moveTo(xT(q.T),yP(q.P));
        else ctx.lineTo(xT(q.T),yP(q.P)); });
      ctx.stroke(); ctx.lineWidth=1;
      ctx.fillStyle='#b8ec4c'; ctx.fillText('P_out(T)',pl.x0+6,pl.y0+12);
      ctx.setLineDash([3,4]); ctx.strokeStyle='rgba(88,196,221,0.7)'; ctx.beginPath();
      rig.curve.forEach((q,i)=>{ if (i===0) ctx.moveTo(xT(q.T),yE(q.eta));
        else ctx.lineTo(xT(q.T),yE(q.eta)); });
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#58c4dd'; ctx.fillText('extraction η (0–1)',pl.x0+70,pl.y0+12);
      if (rig.opt){

        ctx.beginPath(); ctx.moveTo(xT(rig.opt.T),pl.y0); ctx.lineTo(xT(rig.opt.T),pl.y1); ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.fillText('T_opt = '+(100*rig.opt.T).toFixed(1)+'%',xT(rig.opt.T)+4,pl.y0+24);
      }
      const cur={T:p.T,P:s.P2};
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(xT(cur.T),yP(cur.P),3.4,0,TAU); ctx.fill();
      const mf=p.g0>0?Math.pow(1-Math.sqrt(Math.min(1,p.a/p.g0)),2):0;
      ctx.fillStyle='#888';
      ctx.fillText('mean-field bound η ≤ (1−√(αL/g₀L))² = '+mf.toFixed(3),pl.x0+6,pl.y1-8);

  /* =================== dye sim state =================== */
  const dye={ang:32, sparks:[], jetPhase:0, outFlash:0};
  const dyeInsetCache={x:-1,pts:null};
  function dyeState(){
    return {x:state.dyePump/100, v:state.dyeJet, lam:state.dyeLam};
  }
  function stepDye(){
    const d=dyeState(), sp=state.speed;
    const target=littrowDeg(d.lam);
    dye.ang+=(target-dye.ang)*0.12*sp;
    dye.jetPhase+=(0.4+d.v*0.25)*sp;
    const g=dyeGain(d.lam,d.x,d.v);
    // fluorescence sparks off the pump spot, colored by the emission band
    if (Math.random()<0.5*sp*d.x*12){
      let l=545+Math.random()*105;
      if (Math.random()>dyeSe(l)) l=DYE.EM_MU+ (Math.random()*30-10);
      const a=Math.random()*TAU;
      dye.sparks.push({x:0,y:0,vx:2.2*Math.cos(a),vy:2.2*Math.sin(a),
                       css:spectralCss(l),age:0});
    }
    for (let i=dye.sparks.length-1;i>=0;i--){
      const q=dye.sparks[i];
      q.x+=q.vx*sp; q.y+=q.vy*sp; q.age++;
      if (q.age>46) dye.sparks.splice(i,1);
    }
    if (g>0&&Math.random()<0.4*sp) dye.outFlash=6;
    if (dye.outFlash>0) dye.outFlash--;
  }
  function drawDye(){
    const z=zones(), hw=z.hw, pl=z.pl, d=dyeState();

                    (0.5-0.22*dark).toFixed(3)+')';

      beamGlow(mx0,cy,gx-6,cy,beamCss(d.lam),3,0.8);

                   mx0+40,cy-12);

    frameBox(pl);
    const pw=pl.x1-pl.x0, ph=pl.y1-pl.y0;

    ctx.strokeStyle='#333';
    ctx.beginPath(); ctx.moveTo(pl.x0,yG(0)); ctx.lineTo(pl.x1,yG(0)); ctx.stroke();
    const curve=(fn,css,lab,lx)=>{
      ctx.strokeStyle=css; ctx.beginPath();

    curve(l=>0.12*dyeSa(l)-0.115,'rgba(120,220,150,0.7)','σ_abs (peak 530)',pl.x0+6);
    curve(l=>0.12*dyeSe(l)-0.115,'rgba(255,180,90,0.8)','σ_em (peak 563)',pl.x0+110);
    curve(l=>dyeGain(l,d.x,d.v),'#b8ec4c','net gain/pass',pl.x0+214);
    const w=dyeWindow(d.x,d.v);

  /* =================== NIF sim state =================== */
  const nif={ph:0, chain:null, key:''};
  function nifCalc(){
    const k=state.nifE+'|'+state.nifG;
    if (nif.key!==k){ nif.chain=nifChain(state.nifE,state.nifG); nif.key=k; }
    return nif.chain;
  }
  function stepNif(){ nif.ph=(nif.ph+0.0035*state.speed)%1; }
  function drawNif(){
    const z=zones(), hw=z.hw, pl=z.pl, ch=nifCalc();
    const cy=(hw.y0+hw.y1)/2;
    // --- beamline schematic ---
    const fx=f=>hw.x0+(hw.x1-hw.x0)*f;
    const seg={mor:[fx(0),fx(0.07)], pam:[fx(0.11),fx(0.22)],
               amp:[fx(0.26),fx(0.60)], sw:[fx(0.64),fx(0.705)],
               foa:[fx(0.725),fx(0.785)], ch:[fx(0.82),fx(1.0)]};
    ctx.font='10px -apple-system, sans-serif';
    const box=(x0,x1,lab,css)=>{
      ctx.strokeStyle=css||'#667';
      ctx.strokeRect(x0,cy-22,x1-x0,44);
      ctx.fillStyle='#889'; ctx.fillText(lab,x0+2,cy+38);
    };
    box(seg.mor[0],seg.mor[1],'MOR (nJ)');
    box(seg.pam[0],seg.pam[1],'preamp ×10⁹');
    box(seg.amp[0],seg.amp[1],'Nd:glass slabs — 4 passes','#7a6');
    for (let i=0;i<7;i++){
      const x=seg.amp[0]+14+i*((seg.amp[1]-seg.amp[0]-28)/6);
      ctx.fillStyle='rgba(150,120,255,0.18)';
      ctx.save(); ctx.translate(x,cy); ctx.rotate(0.35);
      ctx.fillRect(-4,-20,8,40); ctx.restore();
    }
    box(seg.sw[0],seg.sw[1],'switchyard');
    box(seg.foa[0],seg.foa[1],'KDP 3ω','#96c');
    // target chamber
    const ccx=(seg.ch[0]+seg.ch[1])/2;
    ctx.strokeStyle='#667';
    ctx.beginPath(); ctx.arc(ccx,cy,26,0,TAU); ctx.stroke();
    ctx.fillStyle='#889'; ctx.fillText('chamber',ccx-22,cy+42);
    // pulse: position along the chain
    const ph=nif.ph;
    let px,py=cy,stage=0,col='rgba(210,120,90,0.9)',lab='1053 nm (invisible IR)';
    const lerp=(a,b,t)=>a+(b-a)*t;
    if (ph<0.06){ px=lerp(seg.mor[0],seg.mor[1],ph/0.06); stage=0; }
    else if (ph<0.16){ px=lerp(seg.pam[0],seg.pam[1],(ph-0.06)/0.10); stage=1; }
    else if (ph<0.60){
      const t=(ph-0.16)/0.44, pass=Math.min(3,Math.floor(t*4)), u=t*4-pass;
      stage=2+pass;
      px=(pass%2===0)?lerp(seg.amp[0],seg.amp[1],u):lerp(seg.amp[1],seg.amp[0],u);
      py=cy-10+7*pass;
    }
    else if (ph<0.70){ px=lerp(seg.sw[0],seg.sw[1],(ph-0.60)/0.10); stage=6; }
    else if (ph<0.78){ px=lerp(seg.foa[0],seg.foa[1],(ph-0.70)/0.08); stage=6;
      if (ph>0.74){ col='rgba(140,110,230,0.95)'; lab='351 nm (UV)'; } }
    else { px=lerp(seg.ch[0]+6,ccx,(ph-0.78)/0.22); stage=7;
      col='rgba(140,110,230,0.95)'; lab='351 nm (UV)'; }
    const E=ch.stages[Math.min(stage,ch.stages.length-1)].E;
    const sz=2+10*Math.max(0,Math.log10(E/1e-9))/16.3;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(px,py,sz,0,TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#999'; ctx.fillText(lab,px-30,py-14);
    if (ph>0.97&&ch.ignition){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle='rgba(255,240,180,0.9)';
      for (let k=0;k<10;k++){
        const a=k*TAU/10;
        ctx.beginPath(); ctx.moveTo(ccx+8*Math.cos(a),cy+8*Math.sin(a));
        ctx.lineTo(ccx+26*Math.cos(a),cy+26*Math.sin(a)); ctx.stroke();
      }
      ctx.restore();
    }
    // --- energy ladder (log bars) ---
    frameBox(pl);
    const pw=pl.x1-pl.x0, ph2=pl.y1-pl.y0;
    const st=ch.stages, nS=st.length;
    const eLo=1e-10, eHi=1e7;
    const yE=e=>pl.y1-ph2*Math.max(0,Math.log10(Math.max(e,eLo)/eLo))/Math.log10(eHi/eLo);
    ctx.fillStyle='#666';
    for (const dec of [1e-9,1e-6,1e-3,1,1e3,1e6]){
      const yy=yE(dec);
      ctx.strokeStyle='#1a1a20';
      ctx.beginPath(); ctx.moveTo(pl.x0,yy); ctx.lineTo(pl.x1,yy); ctx.stroke();
      ctx.fillText(fmtJ(dec),pl.x0-44,yy+3);
    }
    const ign=yE(2.05e6);
    ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,220,120,0.7)';
    ctx.beginPath(); ctx.moveTo(pl.x0,ign); ctx.lineTo(pl.x1,ign); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#fd8'; ctx.fillText('2.05 MJ — the ignition shot',pl.x1-150,ign-4);
    const bw=pw/nS;
    st.forEach((sg,i)=>{
      const x=pl.x0+i*bw+6, yy=yE(sg.E);
      const active=i===Math.min(stage,nS-1);
      ctx.fillStyle=i>=nS-1?'rgba(140,110,230,0.75)':
                    i>=nS-2?'rgba(184,236,76,0.55)':'rgba(210,120,90,'+(active?0.95:0.5)+')';
      ctx.fillRect(x,yy,bw-12,pl.y1-yy);
      ctx.fillStyle=active?'#fff':'#888';
      ctx.fillText(sg.tag,x,pl.y1+13);
      ctx.fillText(fmtJ(sg.E),x,yy-4);
    });
    drawNifLevels();
  }

  function insetNif(){
    const c=insetCtx, IW=insetCv.width, IH=insetCv.height;
    c.clearRect(0,0,IW,IH);
    c.font='9px -apple-system, sans-serif';
    const ch=nifCalc();
    const cx=IW/2, cyI=IH/2+6;
    // hohlraum cylinder
    c.strokeStyle='#a96';
    c.strokeRect(cx-24,cyI-34,48,68);
    c.beginPath(); c.ellipse(cx,cyI-34,24,7,0,0,TAU); c.stroke();
    c.beginPath(); c.ellipse(cx,cyI+34,24,7,0,0,TAU); c.stroke();
    const t=nif.ph;
    if (t>0.8){
      c.strokeStyle='rgba(140,110,230,0.8)';
      for (const s of [-1,1]){
        c.beginPath(); c.moveTo(cx-70*s,cyI-60); c.lineTo(cx-10*s,cyI-38); c.stroke();
        c.beginPath(); c.moveTo(cx-70*s,cyI+60); c.lineTo(cx-10*s,cyI+38); c.stroke();
      }
      c.fillStyle='rgba(255,230,180,'+(0.2+0.5*Math.sin(t*40)).toFixed(3)+')';
      c.beginPath(); c.arc(cx,cyI,20,0,TAU); c.fill();
    }
    const rCap=ch.ignition&&t>0.97?9:6-(t>0.9?(t-0.9)*30:0);
    c.fillStyle=ch.ignition&&t>0.97?'#fff':'#cdf';
    c.beginPath(); c.arc(cx,cyI,Math.max(2,rCap),0,TAU); c.fill();
    c.fillStyle='#888';
    c.fillText('hohlraum: UV → X-ray bath → implosion',12,14);
    c.fillText(ch.ignition?
      'Dec 5, 2022: 2.05 MJ in, 3.15 MJ out — gain 1.5':
      'below 2.05 MJ — push the sliders',12,IH-10);
    c.fillStyle='#a96'; c.fillText('DT capsule Ø 2 mm',cx+34,cyI+4);
  }

      const K=rb.K;
      sub='x = n₂/N = '+rb.x.toFixed(3)+' · x_th = '+K.x_th.toFixed(4)+
          ' · τ_c = '+(K.tauc*1e9).toFixed(2)+' ns'+
          '<br>P = '+fmtW(rb.P)+' · pulse so far '+fmtJ(rb.Eout)+
          '<br>'+(state.rubyF<6?'below the pulsed threshold — fluorescence only':
                  'spiking: stored inversion dumps in µs bursts');
    } else if (st.view==='gas'){
      const g=gasCalc(), th=heneThresholds();
      sub='g₀L = '+(100*g.g0).toFixed(2)+'% vs loss '+(100*th.loss).toFixed(2)+'%'+
          ' · P = '+fmtW(g.P)+
          '<br>lasing window '+th.iLo.toFixed(1)+' – '+th.iHi.toFixed(1)+' mA';
      if (state.gasI<th.iLo) sub+='<br>below threshold — a glow lamp, not a laser';
      else if (state.gasI>th.iHi) sub+='<br>gain quenched — the 1s bottleneck won';
      else sub+='<br>He carries the energy, Ne emits the light';
    } else if (st.view==='ptr'){
      const D=DIODES[st.ptrDio];
      const ith=ptrIth(st.ptrT,D), P=ptrP(st.ptrI,st.ptrT,D);
      sub='I_th('+Math.round(st.ptrT)+'°C) = '+ith.toFixed(1)+' mA · slope '+
          ptrSlope(D).toFixed(3)+' W/A'+(D.dpss?' (pump)':'')+
          '<br>P = '+fmtW(P);
      if (D.dpss&&dpssPhase(st.ptrT)<0.5) sub+=' — phase-match detuned: ×'+
        dpssPhase(st.ptrT).toFixed(2)+' (DPSS cold death)';
      else if (!D.dpss&&st.ptrI<=ith) sub+=' — LED regime, spontaneous only';
      else if (P>5.1e-3) sub+=' — ⚠ over the 5 mW Class 3R limit';
      else if (P>1e-5) sub+=' — Class 3R (< 5 mW) ✓';
      const rel=photopicV(D.lam)/photopicV(650);
      sub+='<br>eye response V('+D.lam+') = '+rel.toFixed(rel<0.1?3:1)+
           '× red — same mW, '+(rel>1.5?'looks far brighter':(rel<0.5?'looks far dimmer':'similar look'));
    } else if (st.view==='rig'){
      const p=rigParams(), s=rig.prof?rig.prof.s:{on:false},
            thr=rigrodThr(p.a,p.R1,p.R2);
      sub='g₀L = '+p.g0.toFixed(2)+' vs threshold '+thr.toFixed(3)+
          (s.on?' · P = '+fmtW(s.P2*p.IsA):' · below threshold');
      if (rig.opt) sub+='<br>optimum T = '+(100*rig.opt.T).toFixed(1)+'% → '+
                        fmtW(rig.opt.P*p.IsA);
      sub+='<br>presets share one solver: mW tube → MW excimer';
    } else if (st.view==='dye'){
      const d=dyeState(), g=dyeGain(d.lam,d.x,d.v), w=dyeWindow(d.x,d.v);
      sub='θ_Littrow = '+littrowDeg(d.lam).toFixed(1)+'° · net gain '+
          (100*g).toFixed(2)+'%/pass';
      sub+='<br>'+(w.lo!==null?('gain window '+Math.round(w.lo)+' – '+Math.round(w.hi)+' nm'):
                   'no gain window — pump harder or speed the jet');
      if (g<=0&&d.v<1.5) sub+='<br>triplet-dead: n_T = '+dyeNT(d.x,d.v).toFixed(2)+
        ' — the jet must outrun τ_T';
      else if (g<=0) sub+='<br>no net gain at '+Math.round(d.lam)+' nm — retune the grating';
      else sub+='<br>n_T = '+dyeNT(d.x,d.v).toFixed(2)+' · reabsorption sets the red edge';
    } else {
      const ch=nifCalc();
      sub='per beam '+fmtJ(ch.E1)+' (1ω) · ×192 = '+fmtJ(ch.E1*192)+
          '<br>3ω on target '+fmtJ(ch.E3)+
          (ch.ignition?' — IGNITION territory (N221204: 3.15 MJ out)':' — below the 2.05 MJ shot');
      sub+='<br>F/F_sat = '+(ch.E1/NIF.AREA/NIF.FSAT).toFixed(2)+
           ' — deep saturation IS the extraction';
    }
    $('roSub').innerHTML=sub;
  }

  function resize(){

  /* ---------- main loop ---------- */
  function frame(){
    ctx.clearRect(0,0,W,HGT);
    if (state.view==='ruby'){ if (!paused) stepRuby(); drawRuby(); insetRuby(); }
    else if (state.view==='gas'){ if (!paused) stepGas(); drawGas(); insetGas(); }
    else if (state.view==='ptr'){ if (!paused) stepPtr(); drawPtr(); insetPtr(); }
    else if (state.view==='rig'){ if (!paused) stepRig(); drawRig(); insetRig(); }
    else if (state.view==='dye'){ if (!paused) stepDye(); drawDye(); insetDye(); }
    else { if (!paused) stepNif(); drawNif(); insetNif(); }
    updateReadout();
    requestAnimationFrame(frame);
  }
  resize(); syncControls(); updateInfo(); updateReadout();
  requestAnimationFrame(frame);

   Every pinned value below was produced by an independent pure-python
   audit (hand-rolled RK4/bisection, no code shared with this file). */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if (cond){ pass++; console.log('ok — '+name); }
                          else { fail++; console.log('FAIL — '+name); } };
  const approx=(a,b,tol)=>Math.abs(a-b)<=(tol===undefined?1e-9:tol);
  const rel=(a,b)=>Math.abs(a/b-1);

  /* --- photon energies (hc/e = 1239.8420 eV nm) --- */
  ok(rel(photonEV(694.3),1.78574)<1e-4,'ruby: 694.3 nm = 1.7857 eV');
  ok(rel(photonEV(632.8),1.95930)<1e-4,'He-Ne: 632.8 nm = 1.9593 eV');
  ok(rel(photonEV(650),1.90745)<1e-4,'pointer: 650 nm = 1.9074 eV');
  ok(rel(photonEV(1053),1.17744)<1e-4,'Nd:glass: 1053 nm = 1.1774 eV');
  ok(rel(photonEV(351),3.53231)<1e-4,'3w: 351 nm = 3.5323 eV');
  ok(NIF.LAM1/3===NIF.LAM3,'tripling: 1053/3 = 351 exactly');
  ok(rel(photonJ(694.3),2.86117e-19)<1e-4,'694.3 nm photon = 2.861e-19 J');
  ok(rel(RUBY.HNU,photonJ(694.3))<1e-6,'RUBY.HNU consistent with hc/lambda');

  /* --- facet Fresnel --- */
  ok(rel(fresnelR(3.5),0.308642)<1e-5,'cleaved facet R = ((2.5)/(4.5))^2 = 0.3086');
  ok(fresnelR(1)===0,'n = 1: no reflection');

  /* --- He-Ne level arithmetic (NIST cm^-1) --- */
  ok(rel(HENE.NE_U-HENE.NE_L,15798.002)<1e-6,'3s2 - 2p4 = 15798.00 cm^-1');
  ok(rel(heneLamVac(),632.9914)<1e-5,'vacuum wavelength 632.9914 nm');
  ok(Math.abs(heneLamAir()-632.8168)<0.002,'air wavelength 632.8168 nm (the name)');
  ok(rel(HENE.NE_U-HENE.HE_21S,381.044)<1e-4,'He(2^1S)->Ne(3s2) deficit 381.04 cm^-1');
  { const kBcm=KB/(HPL*C0*100);
    ok(rel(kBcm,0.6950348)<1e-6,'k_B = 0.69503 cm^-1/K from SI constants');
    ok(rel(Math.exp(-(HENE.NE_U-HENE.HE_21S)/(kBcm*400)),0.2540)<2e-3,
       'transfer Boltzmann factor 0.254 at 400 K — thermally bridged'); }
  ok(rel(HENE.NE_U*1.239842e-4,20.663)<1e-4,'Ne 3s2 = 20.663 eV');
  ok(rel(HENE.NE_L*1.239842e-4,18.704)<1e-4,'Ne 2p4 = 18.704 eV');
  ok(rel(HENE.HE_21S*1.239842e-4,20.616)<1e-4,'He 2^1S = 20.616 eV');

  /* --- He-Ne gain(i), thresholds, symmetry --- */
  ok(approx(heneG0(6),HENE.GHAT,1e-15),'g0L peaks at i0 = 6 mA with value 2%');
  { const th=heneThresholds();
    ok(rel(th.loss,0.0075254)<1e-4,'cavity loss aL + half ln 1/(R1R2) = 0.75%');
    ok(rel(th.iLo,1.1719)<1e-3,'lasing turns ON at 1.17 mA');
    ok(rel(th.iHi,30.7200)<1e-3,'…and OFF past 30.72 mA — too much current kills it'); }
  ok(rel(heneP(6),1.2495e-3)<5e-3,'P(6 mA) = 1.25 mW — a real He-Ne');
  ok(rel(heneP(3),0.8488e-3)<6e-3&&rel(heneP(12),0.8488e-3)<6e-3,
     'P(3) = P(12) = 0.85 mW');
  ok(rel(heneP(3),heneP(12))<1e-6,'exact u vs 1/u symmetry of g0L(i)');
  ok(heneP(6)>heneP(4.5)&&heneP(6)>heneP(8),'output maximized at the 6 mA optimum');
  ok(heneP(1)===0&&heneP(31)===0&&heneP(33)===0,'dark below 1.17 and above 30.72 mA');
  ok(rel(heneP(25),0.1554e-3)<2e-2,'P(25 mA) = 0.16 mW — deep in the rolloff');

  /* --- Rigrod: closed form vs shooting, invariant, symmetry --- */
  { let worst=0;
    for (const g0L of [0.02,0.1,0.5,1.0,3.0])
      for (const RR of [[1.0,0.98],[0.999,0.99],[0.95,0.25],[0.9,0.5]]){
        const s=rigrodSolve(g0L,0,RR[0],RR[1],1200);
        const pc=rigrodClosed(g0L,RR[0],RR[1]);
        if (pc>0) worst=Math.max(worst,Math.abs(s.P2/pc-1));
      }
    ok(worst<1e-6,'lossless shooting matches the closed form over a 20-case grid'); }
  { const s=rigrodSolve(0.5,0,1.0,0.98,4000);
    ok(rel(s.P2,0.489899)<1e-6,'P/IsA(g0L=0.5, R1=1, R2=0.98) = 0.4899, both routes'); }
  ok(rigrodClosed(0.01,1.0,0.98)===0,'closed form: dark below threshold');
  { const tot=(g0,a,R1,R2)=>{ const s=rigrodSolve(g0,a,R1,R2,1600);
      return (1-R2)*s.uL+(1-R1)*s.v0; };
    ok(rel(tot(1.2,0.08,0.95,0.30),tot(1.2,0.08,0.30,0.95))<1e-7,
       'mirror-swap symmetry: total extracted power invariant (with loss)'); }
  { const s=rigrodSolve(0.5,0,1.0,1-1e-4,1600);
    ok(rel(1e-4*s.uL/0.5,0.9999)<3e-4,
       'lossless T->0: extraction efficiency -> 1 (all available power out)'); }
  { const pr=rigrodProfile(1.2,0.08,0.95,0.30,160);
    let worst=0;
    for (const [,u,v] of pr.prof) worst=Math.max(worst,Math.abs(u*v/pr.c-1));
    ok(worst<1e-6,'first integral I+I- = const holds along z (with loss) to <1e-6'); }
  ok(!rigrodSolve(0.01,0.05,0.9,0.9,400).on,'below threshold: solver reports dark');
  ok(rel(rigrodThr(0.002,0.999,0.99),0.0075254)<1e-4,'threshold-loss helper');
  { const c=rigrodCurve(0.1,0.01,1.0,64), o=rigrodOpt(c);
    ok(Math.abs(o.T-0.0407)<6e-3,'g0L=0.1, aL=0.01: optimum coupling T = 4.1%');
    ok(Math.abs(o.eta-0.4673)<5e-3,'…extracting eta = 0.467');
    ok(Math.abs(o.eta-Math.pow(1-Math.sqrt(0.01/0.1),2))<5e-3,
       'matches the mean-field bound (1-sqrt(aL/g0L))^2 = 0.4675'); }
  { const c=rigrodCurve(3.0,0.30,0.95,64);
    let o=null;
    for (const q of c) if (!o||q.eta>o.eta) o=q;      // audit optimized eta
    ok(Math.abs(o.T-0.667)<0.05,'KrF-class gain: optimum T = 67% — a doorknob coupler');
    ok(Math.abs(o.eta-0.4651)<0.01,'…still only eta = 0.465: the aL/g0L tax'); }
  { const P=rigrodSolve(0.02,0.002,0.999,0.99,4000).P2*0.15;
    ok(rel(P,1.2495e-3)<3e-3,'He-Ne preset: 1.25 mW'); }
  { const P=rigrodSolve(0.60,0.010,0.998,0.88,4000).P2*250;
    ok(rel(P,111.996)<3e-3,'Nd:YAG preset: 112 W'); }
  { const P=rigrodSolve(3.0,0.30,0.95,0.25,4000).P2*8e6;
    ok(rel(P,1.0798e7)<3e-3,'KrF preset: 10.8 MW through T = 75%'); }

  /* --- ruby: constants and the full integration, replayed --- */
  { const K=rubyConsts(0.92);
    ok(rel(K.x_th,0.538869)<1e-5,'x_th = 0.5389 — half the crystal plus the mirror tax');
    ok(rel(K.tauc,1.8912e-9)<1e-3,'cavity photon lifetime 1.89 ns');
    ok(rel(K.drt,0.124382)<1e-5,'round-trip loss 0.1244');
    ok(rel(K.frac_oc,0.6704)<1e-3,'67% of the loss is useful output');
    const cp=RUBY.CCM/RUBY.NR;
    ok(rel(cp*RUBY.SIG*(2*K.x_th-1)*RUBY.N,1/K.tauc)<1e-9,
       'consistency: threshold gain rate = 1/tau_c exactly');
    ok(rel(K.x_th/(1-K.x_th),1.16858)<1e-4,'quasi-static Wp tau at threshold = 1.169'); }
  { const lo=rubyRun(4,0.92);
    let xmax=0, finite=true;
    for (const [,x,p] of lo.samples){ xmax=Math.max(xmax,x);
      if (!isFinite(x)||!isFinite(p)||p<0) finite=false; }
    ok(finite,'F=4 run: finite, non-negative everywhere');
    ok(lo.Eout<1e-10,'F=4: no lasing (Eout < 1e-10 J)');
    ok(Math.abs(xmax-0.4306)<5e-3,'F=4: inversion peaks at x = 0.43 < x_th'); }
  ok(rubyRun(5.5,0.92).Eout<1e-10,'F=5.5: still dark…');
  ok(rubyRun(6.5,0.92).Eout>0.1,'…F=6.5: lasing — pulsed threshold between (flash must overdrive)');
  { const hi=rubyRun(10,0.92);
    ok(rel(hi.Eout,1.214)<0.03,'F=10: pulse energy 1.21 J (Python-audited)');
    ok(hi.Eout<RUBY.N*RUBY.V*RUBY.HNU,'energy out < N V hnu = 5.8 J stored bound');
    ok(hi.Pmax>1.0e5&&hi.Pmax<2.2e5,'F=10: ~150 kW spike peaks');
    const sp=rubySpikes(hi.samples);
    ok(sp.length>=30&&sp.length<=46,'F=10: ~38 relaxation spikes');
    ok(Math.abs(sp[0]*1e6-498.9)<8,'first spike at ~499 us, once x crosses x_th');
    const gaps=[];
    for (let i=1;i<sp.length;i++) gaps.push((sp[i]-sp[i-1])*1e6);
    gaps.sort((a,b)=>a-b);
    const med=gaps[Math.floor(gaps.length/2)];
    ok(med>1.5&&med<3.5,'median spike gap ~2.2 us — microsecond relaxation oscillations');
    const K=rubyConsts(0.92);
    let dev=0,n=0;
    for (const [t,x] of hi.samples)
      if (t>=sp[0]&&t<=sp[sp.length-1]){ dev+=Math.abs(x-K.x_th); n++; }
    ok(dev/n<4e-3,'gain clamping: mean |x - x_th| = 0.0007 over the spike train');
    let xpk=0;
    for (const [,x] of hi.samples) xpk=Math.max(xpk,x);
    ok(xpk<0.56,'x barely overshoots x_th — the photon field eats the excess'); }
  { const co=rubyRun(10,0.92,{dt:4e-9,sample:4e-7});
    ok(rel(co.Eout,1.214)<0.15,'coarse dt=4 ns knee integrator agrees on pulse energy'); }
  { const e=r2=>rubyRun(10,r2,{dt:4e-9,sample:4e-7}).Eout;
    const e85=e(0.85);
    ok(e85>e(0.5)&&e85>e(0.99),'output-coupling optimum near R2 = 0.85 — Rigrod in pulsed form'); }

  /* --- pointer L-I --- */
  ok(rel(ptrSlope(),0.305192)<1e-4,'slope eta_d hnu/e = 0.305 W/A');
  ok(ptrIth(25)===22,'I_th(25 C) = 22 mA');
  ok(rel(ptrIth(60),39.4240)<1e-4,'I_th(60 C) = 39.4 mA — dead at 38 mA drive');
  ok(rel(ptrIth(-10),12.2768)<1e-4,'I_th(-10 C) = 12.3 mA');
  /* laser parts are the Python-audited pins; the LED term adds the exact
     ETALED*(hnu/e)*I = 5e-4 * 1.90745 * I on top. */
  ok(rel(ptrP(38,25),4.8831e-3+3.6242e-5)<2e-3,
     'P(38 mA, 25 C) = 4.92 mW — just under Class 3R');
  ok(ptrP(38,25)<5e-3,'…and it IS under 5 mW');
  ok(rel(ptrP(38,-10),7.8505e-3+3.6242e-5)<2e-3,
     'P(38 mA, -10 C) = 7.89 mW — cold morning hazard');
  ok(ptrP(38,60)<5e-5,'P(38 mA, 60 C): LED glow only');
  ok(rel(ptrP(20,25),1.9074e-5)<2e-3,'LED regime: 19 uW at 20 mA');
  { let mono=true, prev=-1;
    for (let i=0;i<=60;i+=2){ const p=ptrP(i,25); if (p<prev) mono=false; prev=p; }
    ok(mono,'L-I monotone in current'); }

  /* --- the other three pointers (green DPSS, blue/violet InGaN) --- */
  ok(rel(photonEV(532),2.33053)<1e-4&&rel(photonEV(808),1.53446)<1e-4&&
     rel(photonEV(405),3.06134)<1e-4&&rel(photonEV(450),2.7552)<1e-4,
     'photon energies: 532/808/450/405 nm');
  ok(rel(fresnelR(2.5),0.183673)<1e-5,'InGaN facet: R = ((1.5)/(3.5))² = 0.184');
  ok(rel(ptrSlope(DIODES.grn),0.79792)<2e-4&&rel(ptrSlope(DIODES.blu),1.04698)<2e-4&&
     rel(ptrSlope(DIODES.vio),0.91840)<2e-4,'slopes: pump 0.80, blue 1.05, violet 0.92 W/A');
  ok(rel(ptrIth(60,DIODES.vio),36.8583)<1e-4,'InGaN I_th(60 °C) = 36.9 mA (T₀ = 170 K)');
  ok(ptrIth(60,DIODES.vio)/DIODES.vio.ith0<ptrIth(60)/22,
     'InGaN moves 1.23× where AlGaInP moves 1.79× — thermally robust');
  ok(rel(ptrP(50,25,DIODES.grn),2.2383e-3)<1e-3,'DPSS: 2.24 mW at 50 mA (saturation-capped)');
  ok(rel(ptrP(80,25,DIODES.grn),7.6242e-3)<1e-3,'DPSS: 7.62 mW at 80 mA — over Class 3R');
  ok(rel(ptrP(40,25,DIODES.grn),1.962e-4)<2e-3,'DPSS quadratic regime: 0.20 mW at 40 mA');
  ok(Math.abs(ptrP(80,-10,DIODES.grn)/ptrP(80,25,DIODES.grn)-0.0262)<2e-3,
     'green dies in the cold: ×0.026 at −10 °C (KTP phase-match)');
  ok(ptrP(38,-10)>ptrP(38,25)&&ptrP(80,-10,DIODES.grn)<ptrP(80,25,DIODES.grn),
     'the temperature contrast: red gains cold, green dies cold');
  ok(rel(photopicV(532)/photopicV(650),8.0695)<2e-3,
     'photopic: 532 nm looks 8.1× brighter than 650 at equal power');
  ok(rel(photopicV(450),0.033195)<2e-3&&rel(photopicV(405),1.843e-3)<5e-3,
     'V(450) = 0.033, V(405) = 0.0018 — violet is nearly invisible');
  ok(DIODES.blu.n===2.5&&DIODES.vio.t0===170&&DIODES.grn.dpss===true&&
     DIODES.grn.pumpLam===808,'diode table sanity');

  /* --- dye: window, red shift, triplet kill, Littrow --- */
  ok(dyeSa(530)===1&&dyeSe(563)===1,'sigma peaks normalized at 530/563 nm');
  ok(DYE.EM_MU-DYE.ABS_MU===33,'Stokes shift 33 nm');
  { const w=dyeWindow(0.08,10);
    ok(Math.abs(w.lo-563.5)<0.8&&Math.abs(w.hi-600.9)<0.8,
       'x=8%: gain window 563-601 nm (~37 nm of tuning)'); }
  { const w=dyeWindow(0.05,10);
    ok(Math.abs(w.lo-569.9)<0.8&&Math.abs(w.hi-586.1)<0.8,'x=5%: window narrows to 570-586'); }
  ok(dyeWindow(0.03,10).lo===null,'x=3%: below threshold everywhere');
  ok(Math.abs(dyePeak(0.08,10).at-574.5)<0.8,'x=8%: peak gain at 574.5 nm');
  ok(dyePeak(0.03,10).at>dyePeak(0.08,10).at+2,
     'weaker pump peaks REDDER — ground-state reabsorption at work');
  ok(dyeGain(576.1,0.05,10)>0,'g(576 nm) > 0 at x=5%');
  ok(dyePeak(0.05,0.3).g<-0.04,'jet at 0.3 m/s: triplet absorption beats the gain');
  ok(rel(dyeNT(0.05,10),0.1456)<2e-3,'n_T = 0.15 at 10 m/s');
  ok(dyeNT(0.05,0)===1,'stalled jet: triplet saturates');
  { let mono=true, prev=2;
    for (let v=0;v<=20;v+=1){ const t=dyeNT(0.05,v); if (t>prev+1e-12) mono=false; prev=t; }
    ok(mono,'n_T decreases monotonically with jet speed'); }
  ok(Math.abs(littrowDeg(555)-29.967)<0.01&&Math.abs(littrowDeg(590)-32.073)<0.01&&
     Math.abs(littrowDeg(640)-35.170)<0.01,'Littrow angles for 1800/mm: 30.0/32.1/35.2 deg');

  /* --- NIF: Frantz-Nodvik --- */
  ok(rel(NIF.FSAT,4.8371)<1e-3,'F_sat = hnu/sigma = 4.84 J/cm^2');
  ok(rel(NIF.AREA,1383.84)<1e-9,'aperture 37.2 cm square = 1384 cm^2');
  ok(rel(fnPass(1e-12,16)/1e-12,16)<1e-6,'small-signal limit: G -> G0 (expm1/log1p)');
  { const F=50*NIF.FSAT;
    ok(Math.abs(fnPass(F,16)-(F+NIF.FSAT*Math.log(16)))<1e-6,
       'deep saturation: F_out = F_in + F_sat ln G0'); }
  ok(fnPass(2,16)>fnPass(1,16)&&fnPass(1,20)>fnPass(1,16),'F-N monotone in F_in and G0');
  ok(fnPass(1,16)-1<=NIF.FSAT*Math.log(16)+1e-12,
     'extracted fluence never exceeds the stored F_sat ln G0');
  { const ch=nifChain(1,16);
    ok(ch.stages.length===8,'chain: MOR, preamp, 4 passes, x192, 3w');
    ok(rel(ch.E1,15.929e3)<0.01,'default chain: 15.9 kJ per beam at 1w');
    ok(rel(ch.E3,1.6821e6)<0.01,'…1.68 MJ of 3w — below the ignition shot');
    ok(!ch.ignition,'…so no ignition at the defaults');
    let mono=true;
    for (let i=1;i<7;i++) if (ch.stages[i].E<=ch.stages[i-1].E) mono=false;
    ok(mono,'energy ladder climbs monotonically to the x192 stage');
    ok(rel(ch.stages[7].E,0.55*ch.stages[6].E)<1e-12,'3w conversion is exactly 55%');
    ok(Math.abs(Math.log10(ch.E1/1e-9)-13.2)<0.1,'13 decades of gain per beamline'); }
  ok(rel(nifChain(2,16).E3,2.1388e6)<0.01&&nifChain(2,16).ignition,
     'Ein = 2 J: 2.14 MJ — over the line');
  ok(rel(nifChain(0.1,16).E3,0.4826e6)<0.015,'Ein = 0.1 J: 0.48 MJ');
  ok(nifChain(1,20).ignition,'G0 = 20: 2.27 MJ — ignition territory');
  ok(rel(NIF.SHOT.Yield/NIF.SHOT.Elaser,1.5366)<1e-3,'N221204 target gain 3.15/2.05 = 1.54');

  /* --- CIE spot colors and the deep-red patch --- */
  { const g=spectralRgb(532), r=spectralRgb(650);
    ok(g[1]>0.99&&g[0]<0.01,'532 nm renders pure green');
    ok(r[0]>0.9999&&r[1]<1e-6&&r[2]<1e-6,'650 nm renders pure red'); }
  ok(Math.abs(spectralRgb(694.3)[1]-0.391)<0.05,
     'fit artifact documented: raw 694.3 nm shows g = 0.39 (would look orange)');
  { const b=beamRgb(694.3);
    ok(b[0]===1&&b[1]===0&&b[2]===0,'…beamRgb patches ruby to deep red');
    ok(beamCss(694.3)==='rgb(255,0,0)','beamCss(694.3) = rgb(255,0,0)'); }
  ok(beamRgb(650)[0]>0.9999&&beamRgb(650)[1]<1e-6,'beamRgb(650): the fit, unpatched');
  ok(beamRgb(1053)===IR_RGB&&beamRgb(351)===UV_RGB,'IR/UV beams use the display fallbacks');
  { const c0=neon(0), c1=neon(1), S=NEON_STOPS;
    ok(approx(c0[0],S[0][1])&&approx(c1[2],S[15][3]),'neon endpoints hit the stops');
    ok(/^rgb\(\d+,\d+,\d+\)$/.test(neonCss(0.44)),'neonCss emits rgb() strings'); }

  /* --- state, formats, labels --- */
  { const st=clampState({view:'x',speed:99,rubyF:99,rubyR2:1,gasI:-5,ptrI:999,
                         rigG0:99,rigT:999,dyeLam:1,nifE:99,rigPre:'zz'});
    ok(st.view==='ruby'&&st.speed===3&&st.rubyF===18&&st.rubyR2===50&&
       st.gasI===0&&st.ptrI===100&&st.rigG0===3.5&&st.rigT===95&&
       st.dyeLam===555&&st.nifE===2&&st.rigPre==='custom'&&st.ptrDio==='red',
       'clamps to sane state'); }
  ok(mainLabel(clampState(Object.assign({},DEFAULTS)))==='ruby — 694.3 nm','readout label');
  ok(fmtW(1.2495e-3)==='1.25 mW'&&fmtW(1.08e7)==='10.8 MW'&&fmtW(2.5)==='2.5 W',
     'power auto-units');
  ok(fmtJ(2.05e6)==='2.05 MJ'&&fmtJ(1e-9)==='1 nJ'&&fmtJ(15.93e3)==='15.9 kJ',
     'energy auto-units');
  ok(fmtExp(2.9e-5,'')==='2.9×10⁻⁵','scientific format with superscripts');
  ok(LASERS.ruby.yr===1960&&LASERS.gas.yr===1960&&LASERS.ptr.yr===1962&&
     LASERS.rig.yr===1965&&LASERS.dye.yr===1966&&LASERS.nif.yr===2022,
     'the timeline: 1960, 1960, 1962, 1965, 1966, 2022');
  ok(RIG_PRESETS.krf.rigG0===3&&RIG_PRESETS.hene.rigT===1,'preset table sanity');

  console.log(pass+' passed, '+fail+' failed');
  if (fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================ entry ============================== */
if (typeof document!=='undefined'){
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
