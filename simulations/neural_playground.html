<title>Neural Playground &mdash; small networks hunting &pi;</title>
<!--
  ===================================================================
  neural_playground.html  —  watching small neural networks learn
  ===================================================================

  A teaching bench for the three classic architectures, trained LIVE in the
  page in float64 by real backpropagation — no canned curves, no library.
  The running example is Monte-Carlo estimates of pi: a feed-forward net
  learns the circle inside a square (pi = 4 x the inside fraction) and
  Buffon's needle-crossing rule (P = 2L/pi d), a convolutional net learns to
  tell discs from rings from sticks, and a recurrent net watches sequences —
  the needle bit-stream, a sine wave, and the digits of pi themselves (which
  it can only memorise, never predict — that failure is the lesson).

  WHAT IS EXACT
  -------------
  * Everything.  There are no measured data in this file: every reference
    number is mathematics.  P(inside) = pi/4 and P(cross) = 2/pi (Buffon
    1777, short-needle case L = d) are closed forms; the digits of pi come
    from a Rabinowitz-Wagon integer spigot in this file, asserted against an
    INDEPENDENT Machin-formula computation under Python Decimal.
  * The networks are real: dense / convolution+maxpool / vanilla-recurrent
    layers, BCE / cross-entropy / MSE losses, SGD / momentum / RMSprop /
    Adam, all implemented here and verified in selfTest() by
      (a) numeric-vs-analytic gradient checks on every layer type,
      (b) bit-level PRNG parity with build_neural/gen_reference.py, which
          re-implements the whole engine in Python in the same operation
          order and prints init weights, gradients, and training-loss
          trajectories this suite pins (tolerances stated per checkpoint —
          float trajectories drift slowly through libm, so early checkpoints
          are ~1e-12 and step-500 is looser, honestly labelled).

  WHAT IS MODELLED / CHOSEN (not claims about the world)
  ------------------------------------------------------
  * Architectures and hyperparameters are the small teaching kind: nets of
    2-16 hidden units, a 6-filter CNN on 16x16 binary shapes, a 16-unit RNN
    with full-window BPTT and global-norm gradient clipping at 5.
  * The per-task presets (TUNED) are MEASURED, not folklore: a 480-config
    sweep over arch x act x opt x lr (build_neural/sweep_tail.js; table in
    build_neural/sweep_results.txt) ranks by median steps to 95% accuracy
    over five net seeds, run through the exact shipping update path.
    selfTest re-runs the winners and pins the claims with stated libm-drift
    margins.  Auto-tune applies a preset only when a task STARTS FRESH;
    training sessions are parked PER TASK, so switching views or tasks
    resumes — never resets — a run.  Empirical statements about "best",
    as the race caption says, are experiments at these settings, not
    theorems.
  * "Which optimizer is fastest" (the race view) is an EMPIRICAL statement
    about THESE tasks at the shared learning rate you picked — the caption
    says so; it is not a theorem about optimizers.
  * The pi estimate read off a trained net integrates the net's sigmoid over
    the input square (midpoint rule).  It inherits the net's bias: unlike
    raw Monte Carlo it does NOT converge to pi as n grows, only as the
    decision boundary converges.  The convergence panels draw both so the
    difference is the point, not a surprise.

  NOT MODELLED
  ------------
  * No regularisation, no dropout, no batch-norm, no learning-rate
    schedules, no convolution padding/stride options.  Long-needle Buffon
    (L > d) is out of scope; the needle view fixes L = d = 1.

  Scaffold and 2-D plot layer extracted from sbs_sims.html (which carries
  the plain()-strips-tags and polyline()-clips-in-data fixes); the
  axes()-sorts-its-range fix is ported from standard_candle.html; both are
  asserted in selfTest so they cannot rot (Known-bad list, 2026-08-11).
  The 3-D camera block was deliberately NOT extracted — this sim is
  entirely 2-D, and dead code is a mutation-sweep finding.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Relative luminance (WCAG linearised sRGB) — used to ASSERT that the
   probability ramp is monotone in brightness on each side of P = 0.5. */
function lumOf(col){ const c=toRgb(col).map(v=>{ const x=v/255;
    return x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4); });
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  the engine — PRNG, layers, optimizers, tasks, estimators           *
 *                                                                     *
 *  Every function here mirrors build_neural/gen_reference.py in the   *
 *  SAME operation order (sequential scalar accumulation, no clever    *
 *  reductions), which is what makes the Python-printed reference      *
 *  values assertable at 1e-12-ish tolerances in selfTest().           *
 * ================================================================== */

/* house PRNG — same mulberry32 as blackbody_radiation.html etc. */
function mulberry32(seed){ let a=seed>>>0;
  return function(){ a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296; }; }

/* Box-Muller with cached spare — parity with gen_reference.py gauss_of */
function gaussOf(rnd){ let spare=null;
  return function(){
    if(spare!==null){ const v=spare; spare=null; return v; }
    let u=0; while(u===0) u=rnd();
    const v=rnd();
    const r=Math.sqrt(-2*Math.log(u)), th=TAU*v;
    spare=r*Math.sin(th);
    return r*Math.cos(th); }; }

/* ---- numerically stable pieces ---- */
function softplus(z){ return z>0 ? z+Math.log1p(Math.exp(-z)) : Math.log1p(Math.exp(z)); }
function sigmoid(z){ return z>=0 ? 1/(1+Math.exp(-z)) : Math.exp(z)/(1+Math.exp(z)); }
function bceLoss(z,y){ return softplus(z)-y*z; }        /* y in {0,1}, z a logit */
function ceLoss(z,y){ let m=z[0];                        /* z logits, y a class  */
  for(let i=1;i<z.length;i++) if(z[i]>m) m=z[i];
  let s=0; for(let i=0;i<z.length;i++) s+=Math.exp(z[i]-m);
  return Math.log(s)+m-z[y]; }
function softmax(z){ let m=z[0];
  for(let i=1;i<z.length;i++) if(z[i]>m) m=z[i];
  const e=z.map(v=>Math.exp(v-m)); let s=0;
  for(const v of e) s+=v;
  return e.map(v=>v/s); }
function actF(kind,s){ return kind==='tanh'?Math.tanh(s)
                            : kind==='relu'?(s>0?s:0) : sigmoid(s); }
function actDf(kind,s,a){ return kind==='tanh'?1-a*a
                               : kind==='relu'?(s>0?1:0) : a*(1-a); }

/* ================================================================== *
 *  feed-forward network (a bare logit out; BCE-with-logits loss)      *
 * ================================================================== */
function netNew(sizes,act,seed){
  const g=gaussOf(mulberry32(seed));
  const W=[],B=[];
  for(let l=1;l<sizes.length;l++){
    const nin=sizes[l-1], nout=sizes[l], s=Math.sqrt(1/nin);
    const Wl=[];
    for(let j=0;j<nout;j++){ const row=[];
      for(let i=0;i<nin;i++) row.push(g()*s);
      Wl.push(row); }
    W.push(Wl); B.push(new Array(nout).fill(0));
  }
  return {sizes:sizes.slice(),act,W,B};
}
function netForward(net,x){
  const acts=[x.slice()], zs=[];
  const L=net.W.length;
  for(let l=0;l<L;l++){
    const prev=acts[acts.length-1], z=[];
    for(let j=0;j<net.W[l].length;j++){
      let s=net.B[l][j]; const row=net.W[l][j];
      for(let i=0;i<row.length;i++) s+=row[i]*prev[i];
      z.push(s);
    }
    zs.push(z);
    acts.push(l<L-1 ? z.map(s=>actF(net.act,s)) : z.slice());
  }
  return {acts,zs};
}
function netLogit(net,x){ const F=netForward(net,x); return F.acts[F.acts.length-1][0]; }
function netBatchLoss(net,X,Y,idx){
  const ii=idx||null; const n=ii?ii.length:X.length;
  let tot=0;
  for(let q=0;q<n;q++){ const k=ii?ii[q]:q;
    tot+=bceLoss(netLogit(net,X[k]),Y[k]); }
  return tot/n;
}
function netAccuracy(net,X,Y){
  let acc=0;
  for(let k=0;k<X.length;k++)
    if((netLogit(net,X[k])>0)===(Y[k]>0.5)) acc++;
  return acc/X.length;
}
function netGrads(net,X,Y,idx){
  const L=net.W.length;
  const gW=net.W.map(Wl=>Wl.map(r=>new Array(r.length).fill(0)));
  const gB=net.B.map(b=>new Array(b.length).fill(0));
  const n=idx.length;
  for(const k of idx){
    const {acts,zs}=netForward(net,X[k]);
    let delta=[(sigmoid(zs[L-1][0])-Y[k])/n];
    for(let l=L-1;l>=0;l--){
      const prev=acts[l];
      for(let j=0;j<delta.length;j++){
        const d=delta[j];
        gB[l][j]+=d;
        const row=gW[l][j];
        for(let i=0;i<prev.length;i++) row[i]+=d*prev[i];
      }
      if(l>0){
        const nd=[];
        for(let i=0;i<prev.length;i++){
          let s=0;
          for(let j=0;j<delta.length;j++) s+=net.W[l][j][i]*delta[j];
          nd.push(s*actDf(net.act,zs[l-1][i],acts[l][i]));
        }

      }

}
function netFlatten(net){
  const out=[];
  for(let l=0;l<net.W.length;l++){
    for(const row of net.W[l]) for(const v of row) out.push(v);
    for(const v of net.B[l]) out.push(v);
  }
  return out;
}
function netUnflatten(net,flat){
  let i=0;
  for(let l=0;l<net.W.length;l++){
    for(const row of net.W[l]) for(let c=0;c<row.length;c++) row[c]=flat[i++];
    for(let c=0;c<net.B[l].length;c++) net.B[l][c]=flat[i++];

function gradsFlatten(g){
  const out=[];
  for(let l=0;l<g.gW.length;l++){
    for(const row of g.gW[l]) for(const v of row) out.push(v);
    for(const v of g.gB[l]) out.push(v);
  }

/* ================================================================== *
 *  optimizers over a flat parameter vector                            *
 *  conventions (stated, and asserted against gen_reference.py):       *
 *    momentum: heavy-ball, m = 0.9 m + g,  p -= lr m   (no dampening) *
 *    rmsprop : v = 0.99 v + 0.01 g^2,      p -= lr g/(sqrt(v)+1e-8)   *
 *              NO bias correction — its huge first step is one of the *
 *              teaching points in the race view                       *
 *    adam    : b1 .9, b2 .999, eps 1e-8, bias-corrected               *
 * ================================================================== */
function optNew(kind,lr){ return {kind,lr,m:null,v:null,t:0}; }
function optStepFlat(opt,params,grads){
  opt.t++;
  const n=params.length, out=params.slice();
  if(!opt.m||opt.m.length!==n){ opt.m=new Array(n).fill(0); opt.v=new Array(n).fill(0); }
  const lr=opt.lr, m=opt.m, v=opt.v, k=opt.kind;
  for(let i=0;i<n;i++){
    const g=grads[i];
    if(k==='sgd') out[i]-=lr*g;
    else if(k==='momentum'){ m[i]=0.9*m[i]+g; out[i]-=lr*m[i]; }
    else if(k==='rmsprop'){ v[i]=0.99*v[i]+0.01*g*g; out[i]-=lr*g/(Math.sqrt(v[i])+1e-8); }
    else { m[i]=0.9*m[i]+0.1*g; v[i]=0.999*v[i]+0.001*g*g;
      const mh=m[i]/(1-Math.pow(0.9,opt.t)), vh=v[i]/(1-Math.pow(0.999,opt.t));
      out[i]-=lr*mh/(Math.sqrt(vh)+1e-8); }
  }
  return out;
}

/* ================================================================== *
 *  the two pi tasks                                                   *
 *  dartboard: (x,y) ~ U[-1,1]^2, label = inside the unit circle;      *
 *             P(inside) = pi/4 exactly, so pi = 4P.                   *
 *  needles  : Buffon, L = d = 1.  theta ~ U[0,pi/2] is the needle's   *
 *             angle to the lines, x ~ U[0,1/2] the centre's distance  *
 *             to the NEAREST line; it crosses iff x <= (1/2) sin(th). *
 *             P(cross) = 2L/(pi d) = 2/pi exactly, so pi = 2/P.       *
 *             Net inputs are u = th/(pi/4)-1, v = x/0.25-1 (both in   *
 *             [-1,1]).                                                *
 * ================================================================== */
function needleCross(th,x){ return x<=0.5*Math.sin(th); }
function genDart(seed,n,noise){
  const r=mulberry32(seed), rn=mulberry32(seed+9000);
  const X=[],Y=[];
  for(let k=0;k<n;k++){
    const x=r()*2-1, y=r()*2-1;
    let lab=(x*x+y*y<1)?1:0;
    if(noise>0&&rn()<noise) lab=1-lab;
    X.push([x,y]); Y.push(lab);
  }
  return {X,Y};
}
function genNeedle(seed,n,noise){
  const r=mulberry32(seed), rn=mulberry32(seed+9000);
  const X=[],Y=[],raw=[];
  for(let k=0;k<n;k++){
    const th=r()*(PI/2), x=r()*0.5;
    let lab=needleCross(th,x)?1:0;
    if(noise>0&&rn()<noise) lab=1-lab;
    X.push([th/(PI/4)-1, x/0.25-1]); Y.push(lab); raw.push([th,x]);
  }
  return {X,Y,raw};
}
/* estimators — every displayed number is a model quantity, never drawn math */
function piDartMC(inside,n){ return n>0 ? 4*inside/n : NaN; }
function piNeedleMC(cross,n){ return cross>0 ? 2*n/cross : NaN; }
/* exact midpoint counts of the TRUE indicator (integers; pinned bit-exact) */
function gridCountDart(N){
  let c=0;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const x=-1+(i+0.5)*(2/N), y=-1+(j+0.5)*(2/N);
    if(x*x+y*y<1) c++;
  }
  return c;
}
function gridCountNeedle(N){
  let c=0;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const u=-1+(i+0.5)*(2/N), v=-1+(j+0.5)*(2/N);
    if(needleCross((u+1)*(PI/4),(v+1)*0.25)) c++;
  }
  return c;
}
/* the net's own P-hat: midpoint quadrature of sigmoid(logit) over the square */
function netQuadP(net,N){
  let s=0;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const u=-1+(i+0.5)*(2/N), v=-1+(j+0.5)*(2/N);
    s+=sigmoid(netLogit(net,[u,v]));
  }
  return s/(N*N);
}
function piFromNet(task,net,N){
  const P=netQuadP(net,N);
  return task==='dart' ? 4*P : 2/P;
}
/* raw-MC running curve: exact prefix counts at log-spaced n (own stream, so
   it is the 1/sqrt(n) story, independent of what the trainer consumed) */
function mcCurve(task,seed,nmax){
  const r=mulberry32(seed), pts=[]; let c=0, next=10, n=0;
  while(n<nmax){
    n++;
    if(task==='dart'){ const x=r()*2-1, y=r()*2-1; if(x*x+y*y<1) c++; }
    else { const th=r()*(PI/2), x=r()*0.5; if(needleCross(th,x)) c++; }
    if(n>=next||n===nmax){
      pts.push([n,c, task==='dart'?piDartMC(c,n):piNeedleMC(c,n)]);
      next=Math.max(next+1,Math.round(next*1.12));
    }
  }
  return pts;
}
/* the true boundary, for the orange reference overlay (in NET coordinates) */
function trueBoundary(task,m){
  const xs=[],ys=[];
  for(let i=0;i<=m;i++){
    if(task==='dart'){ const t=i/m*TAU;
      xs.push(Math.cos(t)); ys.push(Math.sin(t)); }
    else { const u=-1+2*i/m, th=(u+1)*(PI/4), x=0.5*Math.sin(th);
      xs.push(u); ys.push(x/0.25-1); }
  }
  return {xs,ys};
}

/* ================================================================== *
 *  the CNN — 16x16 binary shapes: disc / ring / stick                 *
 *  conv 6 @ 3x3 valid -> ReLU -> 2x2 maxpool -> dense 294 -> 3        *
 * ================================================================== */
const CN=16, CK=3, CF=6, CO=CN-CK+1, CPOOL=CO>>1;   /* 16, 3, 6, 14, 7 */
const SHAPE_NAMES=['disc','ring','stick'];
function genShapes(seed,n){
  const r=mulberry32(seed), imgs=[],ys=[];
  for(let q=0;q<n;q++){
    const cls=Math.floor(r()*3);
    const cx=4+r()*8, cy=4+r()*8;
    const img=[];
    for(let i=0;i<CN;i++) img.push(new Array(CN).fill(0));
    if(cls===0||cls===1){
      const rad=2.2+r()*2.6;
      for(let i=0;i<CN;i++) for(let j=0;j<CN;j++){
        const d=Math.sqrt((j+0.5-cx)*(j+0.5-cx)+(i+0.5-cy)*(i+0.5-cy));
        if(cls===0 ? d<=rad : Math.abs(d-rad)<=0.9) img[i][j]=1;
      }
    } else {
      const phi=r()*PI, hl=3.5+r()*3;
      const ux=Math.cos(phi), uy=Math.sin(phi);
      for(let i=0;i<CN;i++) for(let j=0;j<CN;j++){
        const px=j+0.5-cx, py=i+0.5-cy;
        let t=px*ux+py*uy; t=Math.max(-hl,Math.min(hl,t));
        if(Math.hypot(px-t*ux,py-t*uy)<=0.7) img[i][j]=1;
      }
    }
    imgs.push(img); ys.push(cls);
  }
  return {imgs,ys};
}
function cnnNew(seed){
  const g=gaussOf(mulberry32(seed));
  const sK=Math.sqrt(1/(CK*CK));
  const K=[],Kb=new Array(CF).fill(0);
  for(let f=0;f<CF;f++){ const Kf=[];
    for(let a=0;a<CK;a++){ const row=[];
      for(let b=0;b<CK;b++) row.push(g()*sK);
      Kf.push(row); }
    K.push(Kf); }
  const nin=CPOOL*CPOOL*CF, sD=Math.sqrt(1/nin);
  const D=[];
  for(let c=0;c<3;c++){ const row=[];
    for(let i=0;i<nin;i++) row.push(g()*sD);
    D.push(row); }
  return {K,Kb,D,Db:[0,0,0]};
}
function cnnForward(net,img){
  const conv=[],relu=[],pool=[],arg=[];
  for(let f=0;f<CF;f++){
    const Kf=net.K[f], cf=[],rf=[];
    for(let y=0;y<CO;y++){
      const crow=[],rrow=[];
      for(let x=0;x<CO;x++){
        let s=net.Kb[f];
        for(let dy=0;dy<CK;dy++){
          const irow=img[y+dy], Kr=Kf[dy];
          for(let dx=0;dx<CK;dx++) s+=Kr[dx]*irow[x+dx];
        }
        crow.push(s); rrow.push(s>0?s:0);
      }
      cf.push(crow); rf.push(rrow);
    }
    conv.push(cf); relu.push(rf);
    const pf=[],af=[];
    for(let y=0;y<CPOOL;y++){
      const prow=[],arow=[];
      for(let x=0;x<CPOOL;x++){
        let best=-1e300, bi=0;
        for(let dy=0;dy<2;dy++) for(let dx=0;dx<2;dx++){
          const v=rf[2*y+dy][2*x+dx];
          if(v>best){ best=v; bi=dy*2+dx; }
        }
        prow.push(best); arow.push(bi);
      }
      pf.push(prow); af.push(arow);
    }
    pool.push(pf); arg.push(af);
  }
  const flat=[];
  for(let f=0;f<CF;f++) for(let y=0;y<CPOOL;y++) for(let x=0;x<CPOOL;x++)
    flat.push(pool[f][y][x]);
  const z=[];
  for(let c=0;c<3;c++){
    let s=net.Db[c]; const row=net.D[c];
    for(let i=0;i<flat.length;i++) s+=row[i]*flat[i];
    z.push(s);
  }
  return {conv,relu,pool,arg,flat,z};
}
function cnnGrads(net,imgs,ys){
  const gK=[],gKb=new Array(CF).fill(0);
  for(let f=0;f<CF;f++){ const Kf=[];
    for(let a=0;a<CK;a++) Kf.push(new Array(CK).fill(0));
    gK.push(Kf); }
  const nin=CPOOL*CPOOL*CF;
  const gD=[[],[],[]];
  for(let c=0;c<3;c++) gD[c]=new Array(nin).fill(0);
  const gDb=[0,0,0];
  const n=imgs.length;
  let loss=0;
  for(let si=0;si<n;si++){
    const img=imgs[si], y=ys[si];
    const F=cnnForward(net,img);
    loss+=ceLoss(F.z,y);
    const p=softmax(F.z);
    const dz=[ (p[0]-(y===0?1:0))/n, (p[1]-(y===1?1:0))/n, (p[2]-(y===2?1:0))/n ];
    const dflat=new Array(nin).fill(0);
    for(let c=0;c<3;c++){
      gDb[c]+=dz[c];
      const row=net.D[c], grow=gD[c];
      for(let i=0;i<nin;i++){
        grow[i]+=dz[c]*F.flat[i];
        dflat[i]+=row[i]*dz[c];
      }
    }
    for(let f=0;f<CF;f++) for(let y2=0;y2<CPOOL;y2++) for(let x2=0;x2<CPOOL;x2++){
      const d=dflat[f*CPOOL*CPOOL+y2*CPOOL+x2];
      if(d===0) continue;
      const bi=F.arg[f][y2][x2];
      const cy=2*y2+(bi>>1), cx=2*x2+(bi&1);
      if(F.conv[f][cy][cx]<=0) continue;               /* ReLU gate */
      gKb[f]+=d;
      for(let dy=0;dy<CK;dy++) for(let dx=0;dx<CK;dx++)

    }
  }

}
function cnnFlatten(net){
  const out=[];
  for(let f=0;f<CF;f++) for(const row of net.K[f]) for(const v of row) out.push(v);
  for(const v of net.Kb) out.push(v);
  for(let c=0;c<3;c++) for(const v of net.D[c]) out.push(v);
  for(const v of net.Db) out.push(v);
  return out;
}
function cnnUnflatten(net,flat){
  let i=0;
  for(let f=0;f<CF;f++) for(const row of net.K[f]) for(let c=0;c<CK;c++) row[c]=flat[i++];
  for(let f=0;f<CF;f++) net.Kb[f]=flat[i++];
  for(let c=0;c<3;c++) for(let q=0;q<net.D[c].length;q++) net.D[c][q]=flat[i++];
  for(let c=0;c<3;c++) net.Db[c]=flat[i++];
}
function cnnGradsFlatten(g){
  const out=[];
  for(let f=0;f<CF;f++) for(const row of g.gK[f]) for(const v of row) out.push(v);
  for(const v of g.gKb) out.push(v);
  for(let c=0;c<3;c++) for(const v of g.gD[c]) out.push(v);
  for(const v of g.gDb) out.push(v);
  return out;
}
function cnnAccuracy(net,imgs,ys){
  let acc=0;
  for(let k=0;k<imgs.length;k++){
    const z=cnnForward(net,imgs[k]).z;
    let bi=0; for(let c=1;c<3;c++) if(z[c]>z[bi]) bi=c;
    if(bi===ys[k]) acc++;
  }
  return acc/imgs.length;
}

/* ================================================================== *
 *  the RNN — vanilla tanh, 16 hidden units, full-window BPTT          *
 *  h_t = tanh(Wx x_t + Wh h_{t-1} + b),  y_t = Wo h_t + bo            *
 * ================================================================== */
const RH=16;
function rnnNew(seed,nin,nout){
  const g=gaussOf(mulberry32(seed));
  const sx=Math.sqrt(1/Math.max(1,nin)), sh=Math.sqrt(1/RH);
  const Wx=[],Wh=[],Wo=[];
  for(let j=0;j<RH;j++){ const row=[];
    for(let i=0;i<nin;i++) row.push(g()*sx);
    Wx.push(row); }
  for(let j=0;j<RH;j++){ const row=[];
    for(let k=0;k<RH;k++) row.push(g()*sh);
    Wh.push(row); }
  const bh=new Array(RH).fill(0);
  for(let c=0;c<nout;c++){ const row=[];
    for(let k=0;k<RH;k++) row.push(g()*sh);
    Wo.push(row); }
  return {Wx,Wh,bh,Wo,bo:new Array(nout).fill(0),nin,nout};
}
function rnnForward(net,xs){
  const hs=[new Array(RH).fill(0)], outs=[];
  for(const x of xs){
    const hp=hs[hs.length-1], hcur=[];
    for(let j=0;j<RH;j++){
      let s=net.bh[j];
      for(let i=0;i<x.length;i++) s+=net.Wx[j][i]*x[i];
      const Wr=net.Wh[j];
      for(let k=0;k<RH;k++) s+=Wr[k]*hp[k];
      hcur.push(Math.tanh(s));
    }
    hs.push(hcur);
    const o=[];
    for(let c=0;c<net.nout;c++){
      let s=net.bo[c]; const row=net.Wo[c];
      for(let k=0;k<RH;k++) s+=row[k]*hcur[k];
      o.push(s);
    }
    outs.push(o);
  }
  return {hs,outs};
}
/* targets[t] pairs with outs[t]; null skips that step.  mode: bce|mse|ce */
function rnnBPTT(net,xs,targets,mode){
  const {hs,outs}=rnnForward(net,xs);
  const T=xs.length;
  let nt=0; for(const t of targets) if(t!==null) nt++;
  const gWx=net.Wx.map(r=>new Array(r.length).fill(0));
  const gWh=net.Wh.map(r=>new Array(r.length).fill(0));
  const gbh=new Array(RH).fill(0);
  const gWo=net.Wo.map(r=>new Array(r.length).fill(0));
  const gbo=new Array(net.nout).fill(0);
  let dhNext=new Array(RH).fill(0);
  let loss=0;
  for(let t=T-1;t>=0;t--){
    const dh=dhNext.slice();
    dhNext=new Array(RH).fill(0);
    if(targets[t]!==null){
      let dz;
      if(mode==='bce'){ loss+=bceLoss(outs[t][0],targets[t]);
        dz=[(sigmoid(outs[t][0])-targets[t])/nt]; }
      else if(mode==='mse'){ const d=outs[t][0]-targets[t];
        loss+=d*d; dz=[2*d/nt]; }
      else { loss+=ceLoss(outs[t],targets[t]);
        const p=softmax(outs[t]);
        dz=p.map((pv,c)=>(pv-(c===targets[t]?1:0))/nt); }
      for(let c=0;c<dz.length;c++){
        gbo[c]+=dz[c];
        for(let k=0;k<RH;k++){
          gWo[c][k]+=dz[c]*hs[t+1][k];
          dh[k]+=net.Wo[c][k]*dz[c];
        }
      }
    }
    const ds=[];
    for(let j=0;j<RH;j++) ds.push(dh[j]*(1-hs[t+1][j]*hs[t+1][j]));
    for(let j=0;j<RH;j++){
      const d=ds[j];
      gbh[j]+=d;
      for(let i=0;i<xs[t].length;i++) gWx[j][i]+=d*xs[t][i];
      for(let k=0;k<RH;k++){
        gWh[j][k]+=d*hs[t][k];
        dhNext[k]+=net.Wh[j][k]*d;
      }
    }
  }
  return {gWx,gWh,gbh,gWo,gbo,loss:loss/nt,hs,outs};
}
function rnnFlatten(net){
  const out=[];
  for(const r of net.Wx) for(const v of r) out.push(v);
  for(const r of net.Wh) for(const v of r) out.push(v);
  for(const v of net.bh) out.push(v);
  for(const r of net.Wo) for(const v of r) out.push(v);
  for(const v of net.bo) out.push(v);
  return out;
}
function rnnUnflatten(net,flat){
  let i=0;
  for(const r of net.Wx) for(let c=0;c<r.length;c++) r[c]=flat[i++];
  for(const r of net.Wh) for(let c=0;c<r.length;c++) r[c]=flat[i++];
  for(let c=0;c<RH;c++) net.bh[c]=flat[i++];
  for(const r of net.Wo) for(let c=0;c<r.length;c++) r[c]=flat[i++];
  for(let c=0;c<net.nout;c++) net.bo[c]=flat[i++];

function rnnGradsFlatten(g){
  const out=[];
  for(const r of g.gWx) for(const v of r) out.push(v);
  for(const r of g.gWh) for(const v of r) out.push(v);
  for(const v of g.gbh) out.push(v);
  for(const r of g.gWo) for(const v of r) out.push(v);
  for(const v of g.gbo) out.push(v);
  return out;
}
/* global-norm clip at 5 — returns {flat, norm} so the norm is assertable */
function clipNorm(flat,c){
  const cc=c===undefined?5:c;
  let s=0; for(const g of flat) s+=g*g;
  const n=Math.sqrt(s);
  if(n<=cc) return {flat,norm:n};
  const f=cc/n;
  return {flat:flat.map(g=>g*f),norm:n};
}

/* ---- sequence data ---- */
function genBits(seed,n){                    /* Buffon crossings as a bit stream */
  const r=mulberry32(seed), bits=[];
  for(let k=0;k<n;k++){
    const th=r()*(PI/2), x=r()*0.5;
    bits.push(needleCross(th,x)?1:0);
  }
  return bits;
}
function waveAt(t){ return Math.sin(0.31*t+1.234); }   /* deliberately non-round */

/* Rabinowitz–Wagon streaming spigot; integer arithmetic only, safe well past
   the 2000-digit range (values stay < 2^45 here, doubles are exact to 2^53).
   Asserted against a Machin/Decimal computation from gen_reference.py AND
   against Math.PI's own first 15 digits. */
function piDigits(n){
  const len=Math.floor(10*n/3)+3;
  const A=new Array(len).fill(2);
  let out='', nines=0, predigit=0, first=true;
  for(let j=0;j<n+2;j++){
    let q=0;
    for(let i=len-1;i>=0;i--){
      const x=10*A[i]+q*(i+1);
      A[i]=x%(2*i+1);
      q=Math.floor(x/(2*i+1));
    }
    A[0]=q%10; q=Math.floor(q/10);
    if(q===9) nines++;
    else if(q===10){
      out+=String(predigit+1)+'0'.repeat(nines);
      predigit=0; nines=0;
    } else {
      if(!first) out+=String(predigit);
      first=false;
      predigit=q;
      if(nines){ out+='9'.repeat(nines); nines=0; }
    }
  }
  out+=String(predigit);
  return out.slice(0,n);
}

/* ================================================================== *
 *  state, training sessions, and the per-view model                   *
 *                                                                     *
 *  Everything a panel prints or a canvas draws is computed HERE (or   *
 *  in the engine above) and read off the model object — never inside  *
 *  a draw call, so every displayed number is assertable.  Heavy       *
 *  fields hide behind lazy getters so the selfTest sweeps stay fast   *
 *  (Known-bad list: a slow suite is a suite that does not get         *
 *  mutation-tested).                                                  *
 * ================================================================== */
const TABS=[['net','the network'],['dart','the dartboard'],['needle','the needles'],
            ['race','the race'],['cnn','the filters'],['rnn','the sequence'],
            ['learn','the primer']];
const ARCHS=[
  {id:'4',   name:'2–4–1',        sizes:[2,4,1]},
  {id:'8',   name:'2–8–1',        sizes:[2,8,1]},
  {id:'16',  name:'2–16–1',       sizes:[2,16,1]},
  {id:'8x8', name:'2–8–8–1', sizes:[2,8,8,1]},
];
const ACT_LIST=[{id:'tanh',name:'tanh'},{id:'relu',name:'ReLU'},{id:'sigmoid',name:'sigmoid'}];
const OPT_LIST=[{id:'sgd',name:'SGD'},{id:'momentum',name:'momentum'},
                {id:'rmsprop',name:'RMSprop'},{id:'adam',name:'Adam'}];
const LR_LIST=[{id:0.003,name:'0.003'},{id:0.01,name:'0.01'},
               {id:0.03,name:'0.03'},{id:0.1,name:'0.1'},{id:0.3,name:'0.3'}];
const BATCH_LIST=[{id:8,name:'8'},{id:32,name:'32'},{id:128,name:'128'}];
const SEQ_LIST=[{id:'stream',name:'needle stream'},{id:'wave',name:'sine wave'},
                {id:'digits',name:'digits of π'}];
const TASK_LIST=[{id:'dart',name:'the dartboard'},{id:'needle',name:'the needles'}];

/* Per-task tuned presets — MEASURED, not guessed: build_neural/sweep_tail.js
   trains every (arch x act x opt x lr) on each task for 5 net seeds through
   the exact shipping update path and ranks by median steps to 95% accuracy
   (tiebreak: median |pi-hat - pi| at step 800).  The winners live here; the
   race view is the in-page version of the same experiment.  Sweep results:
   build_neural/sweep_results.txt.  ADDING A NEW PROBLEM = a generator +
   TASK_LIST entry + boundary in the engine, then one sweep run to fill its
   row here — the auto-tune toggle picks it up with no other wiring. */
const TUNED={
  dart:  {cfg:{arch:'16',act:'relu',opt:'adam',lr:0.1},
          med:{steps95:90,piErr:0.0362},
          why:'the circle needs a genuinely bent boundary: ReLU facets and '
             +'Adam at a hot &eta; carve it in ~90 steps; RMSprop-led configs '
             +'trail near 250'},
  needle:{cfg:{arch:'16',act:'tanh',opt:'rmsprop',lr:0.03},
          med:{steps95:10,piErr:0.0010},
          why:'x &le; &frac12; sin &theta; is nearly separable in phase '
             +'space — every top-12 needle config is RMSprop, whose huge '
             +'uncorrected first strides snap to the sine by the first check'},
};

/* data seeds are FIXED so every run of the page is the run the reference
   trajectory pinned; "new seed" reseeds only the network init. */
const SEED_DART=11, SEED_NEEDLE=12, SEED_SHAPES=31, SEED_CNN_NET=32,
      SEED_RNN=41, SEED_BITS=42, SEED_BATCH=7, SEED_MC_DART=21, SEED_MC_NEEDLE=22;
const OPT_COL={sgd:'#5ac8e0',momentum:'#cd35c4',rmsprop:'#e8843a',adam:'#b8ec4c'};
const QUAD_N=48;              /* pi-from-net quadrature grid while training */
const QUAD_N_FINAL=200;       /* and the honest one the readout quotes      */
const ACC_TARGET=0.95;
/* EMA weight for the readout's averaged pi-hat: applied at the pi-history
   cadence (every 25 steps), so ~1/0.05 = 20 samples ~ 500 steps of memory */
const PI_AVG_ALPHA=0.05;

/* the page opens on the dartboard CARRYING ITS TUNED PRESET (autoTune on);
   selfTest pins DEFAULTS' arch/act/opt/lr === TUNED.dart so the two cannot
   drift apart.  The py-ref training trajectories are pinned under their own
   explicit REF_CFG (adam, 2-8-1), independent of what ships here. */
const DEFAULTS={
  view:'dart', task:'dart', arch:'16', act:'relu', opt:'adam', lr:0.1, batch:32,
  ntrain:512, noise:0, seed:3,
  running:true, speed:20, autoTune:true,
  inspect:5, showGrad:false,
  showDots:true, showHeat:true, showTrue:true,
  seqTask:'stream',
};
const ST=Object.assign({},DEFAULTS);

function sizesOf(archId){
  for(const a of ARCHS) if(a.id===archId) return a.sizes;
  throw new Error('unknown arch '+archId);
}
function taskData(task,ntrain,noise){
  return task==='dart' ? genDart(SEED_DART,ntrain,noise)
                       : genNeedle(SEED_NEEDLE,ntrain,noise);
}

/* ---------------- histories: capped, decimated rings ---------------- */
function histNew(){ return []; }
function histPush(hst,step,val){
  hst.push([step,val]);
  if(hst.length>900){
    const out=[];
    for(let i=0;i<hst.length;i++) if(i%2===0||i>=hst.length-8) out.push(hst[i]);
    hst.length=0;
    for(const p of out) hst.push(p);
  }
}

/* ---------------- FNN session (network / dartboard / needles) ------- */
/* cfg is the settings snapshot a session runs under: it is what lets a
   parked session RESUME truthfully (the panel adopts cfg on task switch) and
   what "reset nets" replays.  Two LIVE knobs never restart an FNN net:
   batch (read at advance time) and — the polish move — eta, which
   fnnActive() syncs into the running optimizer so a run can be trained hot
   and then cooled to freeze the SGD wobble.  cfg.lr therefore tracks the
   CURRENT eta, and the FNN key omits it.  The RACE key keeps lr: four rules
   at one shared eta from one init is a controlled experiment, and changing
   its conditions honestly restarts it. */
function fnnCfg(st){ return {task:st.task,arch:st.arch,act:st.act,opt:st.opt,
  lr:st.lr,ntrain:st.ntrain,noise:st.noise,seed:st.seed}; }
function fnnKey(c){ return [c.task,c.arch,c.act,c.opt,c.ntrain,c.noise,
  c.seed].join('|'); }
/* the race ignores cfg.opt (it always runs all four rules) but keeps lr */
function raceKey(c){ return [c.task,c.arch,c.act,c.lr,c.ntrain,c.noise,
  c.seed].join('|'); }
function fnnSessionNew(st){
  const data=taskData(st.task,st.ntrain,st.noise);
  return {
    task:st.task, data, cfg:fnnCfg(st),
    net:netNew(sizesOf(st.arch),st.act,st.seed),
    opt:optNew(st.opt,st.lr),
    batchRng:mulberry32(SEED_BATCH),
    step:0,
    hist:{loss:histNew(),acc:histNew(),pi:histNew()},
    piAvg:null,
  };
}
function fnnAdvance(sess,k){
  const n=sess.data.X.length, B=Math.min(ST.batch,n);
  for(let q=0;q<k;q++){
    const idx=[];
    for(let b=0;b<B;b++) idx.push(Math.floor(sess.batchRng()*n));
    const g=netGrads(sess.net,sess.data.X,sess.data.Y,idx);
    netUnflatten(sess.net,optStepFlat(sess.opt,netFlatten(sess.net),gradsFlatten(g)));
    sess.step++;
    if(sess.step<=10||sess.step%5===0){
      histPush(sess.hist.loss,sess.step,netBatchLoss(sess.net,sess.data.X,sess.data.Y));
      histPush(sess.hist.acc,sess.step,netAccuracy(sess.net,sess.data.X,sess.data.Y));
    }
    if(sess.step<=10||sess.step%25===0){
      const v=piFromNet(sess.task,sess.net,QUAD_N);
      histPush(sess.hist.pi,sess.step,v);
      /* the readout's steadied estimate: an EMA over the same cadence */
      sess.piAvg=sess.piAvg===null?v:sess.piAvg+PI_AVG_ALPHA*(v-sess.piAvg);
    }
  }
}

/* ---------------- race session (4 optimizers, same init, same batches) */
function raceSessionNew(st){
  const data=taskData(st.task,st.ntrain,st.noise);
  const proto=netNew(sizesOf(st.arch),st.act,st.seed);
  const lanes=OPT_LIST.map(o=>({
    kind:o.id,
    net:JSON.parse(JSON.stringify(proto)),
    opt:optNew(o.id,st.lr),
    hist:histNew(), acc:0, reachedAt:null,
  }));
  return {task:st.task,data,lanes,step:0,batchRng:mulberry32(SEED_BATCH),
          cfg:fnnCfg(st)};
}
function raceAdvance(sess,k){
  const n=sess.data.X.length, B=Math.min(ST.batch,n);
  for(let q=0;q<k;q++){
    const idx=[];
    for(let b=0;b<B;b++) idx.push(Math.floor(sess.batchRng()*n));
    for(const lane of sess.lanes){
      const g=netGrads(lane.net,sess.data.X,sess.data.Y,idx);
      netUnflatten(lane.net,optStepFlat(lane.opt,netFlatten(lane.net),gradsFlatten(g)));
    }
    sess.step++;
    const record=sess.step<=10||sess.step%5===0;
    /* accuracy checked at a cadence 7 (deliberately incommensurate with the
       loss cadence 5 — Known-bad: round cadences hide off-by-one blindness) */
    const check=sess.step<=10||sess.step%7===0;
    for(const lane of sess.lanes){
      if(record)
        histPush(lane.hist,sess.step,netBatchLoss(lane.net,sess.data.X,sess.data.Y));
      if(check){
        lane.acc=netAccuracy(lane.net,sess.data.X,sess.data.Y);
        if(lane.reachedAt===null&&lane.acc>=ACC_TARGET) lane.reachedAt=sess.step;
      }
    }
  }
}

/* ---------------- CNN session (the filters) ------------------------- */
const CNN_NTRAIN=64, CNN_NTEST=32;
function cnnSessionNew(){
  const all=genShapes(SEED_SHAPES,CNN_NTRAIN+CNN_NTEST);
  const sess={
    imgs:all.imgs.slice(0,CNN_NTRAIN), ys:all.ys.slice(0,CNN_NTRAIN),
    timgs:all.imgs.slice(CNN_NTRAIN),  tys:all.ys.slice(CNN_NTRAIN),
    net:cnnNew(SEED_CNN_NET), opt:optNew('adam',0.01),
    batchRng:mulberry32(SEED_BATCH),
    step:0, hist:{loss:histNew(),acc:histNew(),tacc:histNew()},
    pad:null, padFrom:'sample 0',
  };
  sess.pad=all.imgs[0].map(r=>r.slice());
  return sess;
}
function cnnAdvance(sess,k){
  const n=sess.imgs.length, B=16;
  for(let q=0;q<k;q++){
    const bi=[],by=[],bimgs=[];
    for(let b=0;b<B;b++){ const i=Math.floor(sess.batchRng()*n);
      bi.push(i); bimgs.push(sess.imgs[i]); by.push(sess.ys[i]); }
    const g=cnnGrads(sess.net,bimgs,by);
    cnnUnflatten(sess.net,optStepFlat(sess.opt,cnnFlatten(sess.net),cnnGradsFlatten(g)));
    sess.step++;
    if(sess.step<=10||sess.step%5===0){
      histPush(sess.hist.loss,sess.step,g.loss);
      histPush(sess.hist.acc,sess.step,cnnAccuracy(sess.net,sess.imgs,sess.ys));
      histPush(sess.hist.tacc,sess.step,cnnAccuracy(sess.net,sess.timgs,sess.tys));
    }
  }
}
function padStamp(sess,which){          /* copy a dataset image into the pad */
  const k=which%sess.imgs.length;
  sess.pad=sess.imgs[k].map(r=>r.slice());
  sess.padFrom='sample '+k+' ('+SHAPE_NAMES[sess.ys[k]]+')';
}
function padClear(sess){
  sess.pad=sess.pad.map(r=>r.map(()=>0));
  sess.padFrom='your drawing';
}
function padPaint(sess,i,j){
  for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
    const y=i+di, x=j+dj;
    if(y<0||x<0||y>=CN||x>=CN) continue;
    if(Math.abs(di)+Math.abs(dj)<=1) sess.pad[y][x]=1;
  }
  sess.padFrom='your drawing';
}

/* ---------------- RNN sessions (the sequence) ----------------------- */
const RNN_T=64, DIG_TRAIN=128, DIG_HOLD=48;
const PI_DIGITS_STR=piDigits(DIG_TRAIN+DIG_HOLD);
function oneHot(d){ const v=new Array(10).fill(0); v[d]=1; return v; }
function rnnSessionNew(kind){
  const sess={kind,step:0,opt:optNew('adam',0.01),batchRng:mulberry32(SEED_BATCH),
              hist:{loss:histNew()},};
  if(kind==='stream'){ sess.bits=genBits(SEED_BITS,4096); sess.net=rnnNew(SEED_RNN,1,1); }
  else if(kind==='wave'){ sess.net=rnnNew(SEED_RNN+2,1,1); }
  else { sess.digits=PI_DIGITS_STR.split('').map(Number);
         sess.net=rnnNew(SEED_RNN+4,10,10); sess.hist.hold=histNew(); }
  return sess;
}
function rnnSeq(sess){
  if(sess.kind==='stream'){
    const s0=Math.floor(sess.batchRng()*(sess.bits.length-RNN_T-1));
    const xs=[],tg=[];
    for(let t=0;t<RNN_T;t++){ xs.push([sess.bits[s0+t]]); tg.push(sess.bits[s0+t+1]); }
    return {xs,tg,mode:'bce'};
  }
  if(sess.kind==='wave'){
    const t0=Math.floor(sess.batchRng()*1000);
    const xs=[],tg=[];
    for(let t=0;t<RNN_T;t++){ xs.push([waveAt(t0+t)]); tg.push(waveAt(t0+t+1)); }
    return {xs,tg,mode:'mse'};
  }
  const xs=[],tg=[];
  for(let t=0;t<DIG_TRAIN-1;t++){ xs.push(oneHot(sess.digits[t])); tg.push(sess.digits[t+1]); }
  return {xs,tg,mode:'ce'};
}
function rnnAdvance(sess,k){
  for(let q=0;q<k;q++){
    const {xs,tg,mode}=rnnSeq(sess);
    const g=rnnBPTT(sess.net,xs,tg,mode);
    const c=clipNorm(rnnGradsFlatten(g));
    rnnUnflatten(sess.net,optStepFlat(sess.opt,rnnFlatten(sess.net),c.flat));
    sess.step++;
    if(sess.step<=10||sess.step%5===0){
      histPush(sess.hist.loss,sess.step,g.loss);
      if(sess.kind==='digits')
        histPush(sess.hist.hold,sess.step,digitsHoldoutCE(sess));
    }
  }
}
/* probe quantities — model fields, not draw-call math ------------------ */
function streamProbe(sess){       /* run over a fixed window; mean sigma(out) */
  const xs=[];
  for(let t=0;t<128;t++) xs.push([sess.bits[t]]);
  const {outs}=rnnForward(sess.net,xs);
  let s=0;
  for(let t=64;t<128;t++) s+=sigmoid(outs[t][0]);
  const p=s/64;
  return {pHat:p, piHat:2/p, outs};
}
function waveProbe(sess){
  const xs=[],tg=[];
  for(let t=0;t<RNN_T;t++){ xs.push([waveAt(t)]); tg.push(waveAt(t+1)); }
  const {hs,outs}=rnnForward(sess.net,xs);
  let mse=0;
  for(let t=0;t<RNN_T;t++){ const d=outs[t][0]-tg[t]; mse+=d*d; }
  /* dream: from the warmed hidden state, feed predictions back in */
  const dream=[]; let hcur=hs[hs.length-1].slice(), xin=outs[RNN_T-1][0];
  for(let t=0;t<RNN_T;t++){
    const hp=hcur; hcur=[];
    for(let j=0;j<RH;j++){
      let s=sess.net.bh[j]+sess.net.Wx[j][0]*xin;
      const Wr=sess.net.Wh[j];
      for(let kk=0;kk<RH;kk++) s+=Wr[kk]*hp[kk];
      hcur.push(Math.tanh(s));
    }
    let o=sess.net.bo[0];
    for(let kk=0;kk<RH;kk++) o+=sess.net.Wo[0][kk]*hcur[kk];
    dream.push(o); xin=o;
  }
  return {mse:mse/RNN_T, outs, tg, dream, hs};
}
function digitsTrainCE(sess){
  const {xs,tg}=rnnSeq(sess);
  const {outs}=rnnForward(sess.net,xs);
  let ce=0, acc=0;
  for(let t=0;t<tg.length;t++){
    ce+=ceLoss(outs[t],tg[t]);
    let bi=0; for(let c=1;c<10;c++) if(outs[t][c]>outs[t][bi]) bi=c;
    if(bi===tg[t]) acc++;
  }
  return {ce:ce/tg.length, acc:acc/tg.length};
}
function digitsHoldoutCE(sess){
  /* warm the state through the training digits, score only the holdout */
  const D=sess.digits, xs=[];
  for(let t=0;t<D.length-1;t++) xs.push(oneHot(D[t]));
  const {outs}=rnnForward(sess.net,xs);
  let ce=0, n=0;
  for(let t=DIG_TRAIN-1;t<D.length-1;t++){ ce+=ceLoss(outs[t],D[t+1]); n++; }
  return ce/n;
}
function digitsRecite(sess){
  /* seed "3", then argmax feedback; count correct digits until first miss */
  const D=sess.digits;
  let hcur=new Array(RH).fill(0), x=oneHot(D[0]), okCount=1;
  for(let t=1;t<D.length;t++){
    const hp=hcur; hcur=[];
    for(let j=0;j<RH;j++){
      let s=sess.net.bh[j];
      for(let i=0;i<10;i++) s+=sess.net.Wx[j][i]*x[i];
      const Wr=sess.net.Wh[j];
      for(let kk=0;kk<RH;kk++) s+=Wr[kk]*hp[kk];
      hcur.push(Math.tanh(s));
    }
    const o=[];
    for(let c=0;c<10;c++){
      let s=sess.net.bo[c];
      for(let kk=0;kk<RH;kk++) s+=sess.net.Wo[c][kk]*hcur[kk];
      o.push(s);
    }
    let bi=0; for(let c=1;c<10;c++) if(o[c]>o[bi]) bi=c;
    if(bi!==D[t]) break;
    okCount++; x=oneHot(bi);
  }
  return okCount;
}

/* ---------------- the session registry ------------------------------ */
/* One live session PER TASK (plus the CNN and the three RNNs): switching a
   view or a task PARKS the old session and resumes it later — nothing resets
   on navigation.  A session is recreated only when its settings key no
   longer matches the panel (a chip genuinely changed) or a reset button is
   pressed.  Clicking the already-selected chip is therefore a no-op, not an
   accidental restart. */
const SESS={fnn:{dart:null,needle:null},race:{dart:null,needle:null},
            cnn:null,rnn:{stream:null,wave:null,digits:null}};
function fnnActive(){
  const s=SESS.fnn[ST.task];
  if(s&&fnnKey(s.cfg)===fnnKey(fnnCfg(ST))){
    /* eta is live: the running optimizer follows the panel, mid-run */
    if(s.opt.lr!==ST.lr){ s.opt.lr=ST.lr; s.cfg.lr=ST.lr; }
    return s;
  }
  return (SESS.fnn[ST.task]=fnnSessionNew(ST));
}
function raceActive(){
  const s=SESS.race[ST.task];
  if(s&&raceKey(s.cfg)===raceKey(fnnCfg(ST))) return s;
  return (SESS.race[ST.task]=raceSessionNew(ST));
}
/* switching to a task RESUMES its parked session (the panel adopts the
   session's own settings, so the chips keep telling the truth); a task with
   no session yet starts from its TUNED preset when auto-tune is on. */
function switchTask(task){
  ST.task=task;
  const s=SESS.fnn[task];
  if(s) Object.assign(ST,s.cfg);
  else if(ST.autoTune&&TUNED[task]) Object.assign(ST,TUNED[task].cfg);
  return fnnActive();
}
function resetFnn(){ SESS.fnn[ST.task]=fnnSessionNew(ST); }
function resetRace(){ SESS.race[ST.task]=raceSessionNew(ST); }
function resetCnn(){ SESS.cnn=cnnSessionNew(); }
function resetRnn(kind){ SESS.rnn[kind]=rnnSessionNew(kind); }
/* "reset nets": every EXISTING session replays its own exact run */
function replayNets(){
  for(const t of ['dart','needle']){
    if(SESS.fnn[t]) SESS.fnn[t]=fnnSessionNew(SESS.fnn[t].cfg);
    if(SESS.race[t]) SESS.race[t]=raceSessionNew(SESS.race[t].cfg);
  }
  resetCnn(); resetRnn('stream'); resetRnn('wave'); resetRnn('digits');
}
function resetAllSessions(){
  SESS.fnn={dart:null,needle:null}; SESS.race={dart:null,needle:null};
  resetFnn(); resetRace(); resetCnn();
  resetRnn('stream'); resetRnn('wave'); resetRnn('digits');
}
resetAllSessions();
function advanceActive(k){
  const v=ST.view;
  if(v==='learn') return;                       /* the primer is a still page */
  if(v==='net'||v==='dart'||v==='needle') fnnAdvance(fnnActive(),k);
  else if(v==='race') raceAdvance(raceActive(),k);
  else if(v==='cnn') cnnAdvance(SESS.cnn,Math.max(1,Math.round(k/4)));
  else rnnAdvance(SESS.rnn[ST.seqTask],Math.max(1,Math.round(k/4)));
}

/* ---------------- lazy model ---------------------------------------- */
function lazy(obj,name,fn){
  Object.defineProperty(obj,name,{configurable:true,get(){
    const v=fn(); Object.defineProperty(obj,name,{value:v,configurable:true});
    return v; }});
}
/* probability heat field over the net square, cached per (net-step, N) */
function heatField(net,N){
  const f=new Float64Array(N*N);
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const u=-1+(i+0.5)*(2/N), v=-1+(j+0.5)*(2/N);
    f[i*N+j]=sigmoid(netLogit(net,[u,v]));
  }
  return f;
}
const MC_CACHE={};
function mcCurveCached(task){
  if(!MC_CACHE[task])
    MC_CACHE[task]=mcCurve(task,task==='dart'?SEED_MC_DART:SEED_MC_NEEDLE,20000);
  return MC_CACHE[task];
}

function buildModel(){
  const st=ST, M={view:st.view,st};
  if(st.view==='net'||st.view==='dart'||st.view==='needle'){
    const sess=fnnActive();
    M.sess=sess; M.task=sess.task; M.step=sess.step;
    M.sizes=sess.net.sizes;
    M.nParams=netFlatten(sess.net).length;
    lazy(M,'loss',()=>netBatchLoss(sess.net,sess.data.X,sess.data.Y));
    lazy(M,'acc',()=>netAccuracy(sess.net,sess.data.X,sess.data.Y));
    lazy(M,'heat',()=>heatField(sess.net,56));
    M.heatN=56;
    lazy(M,'piNN',()=>piFromNet(sess.task,sess.net,QUAD_N));
    lazy(M,'piNNfine',()=>piFromNet(sess.task,sess.net,QUAD_N_FINAL));
    M.piAvg=sess.piAvg;
    lazy(M,'mc',()=>mcCurveCached(sess.task));
    lazy(M,'mcFinal',()=>{ const c=mcCurveCached(sess.task);
      return c[c.length-1]; });
    M.boundary=trueBoundary(sess.task,128);
    M.piTrue=PI;
    /* does the session run its task's measured preset? (a model field so the
       readout's "preset" row is assertable, per the drawn-number rule) */
    M.isTuned=['arch','act','opt','lr'].every(k=>sess.cfg[k]===TUNED[sess.task].cfg[k]);
    /* label counts off the data actually trained on */
    lazy(M,'nPos',()=>{ let c=0; for(const y of sess.data.Y) if(y>0.5) c++; return c; });
    if(st.view==='net'){
      /* floor: a driven range input can carry a non-integer value */
      const k=Math.max(0,Math.min(Math.floor(st.inspect),sess.data.X.length-1));
      M.inspect=k;
      M.x=sess.data.X[k]; M.y=sess.data.Y[k];
      lazy(M,'trace',()=>netForward(sess.net,sess.data.X[k]));
      lazy(M,'sampleLoss',()=>bceLoss(netLogit(sess.net,sess.data.X[k]),sess.data.Y[k]));
      lazy(M,'sampleGrads',()=>netGrads(sess.net,sess.data.X,sess.data.Y,[k]));
    }
  }
  else if(st.view==='race'){
    const sess=raceActive();
    M.sess=sess; M.task=sess.task; M.step=sess.step;
    M.lanes=sess.lanes.map(l=>({kind:l.kind,hist:l.hist,acc:l.acc,
                                reachedAt:l.reachedAt,col:OPT_COL[l.kind]}));
    lazy(M,'winner',()=>{
      let best=null;
      for(const l of sess.lanes)
        if(l.reachedAt!==null&&(best===null||l.reachedAt<best.reachedAt)) best=l;
      return best?{kind:best.kind,at:best.reachedAt}:null; });
  }
  else if(st.view==='cnn'){
    const sess=SESS.cnn;
    M.sess=sess; M.step=sess.step;
    M.kernels=sess.net.K; M.pad=sess.pad; M.padFrom=sess.padFrom;
    M.nTrain=sess.imgs.length; M.nTest=sess.timgs.length;
    lazy(M,'padF',()=>cnnForward(sess.net,sess.pad));
    lazy(M,'padProbs',()=>softmax(M.padF.z));
    lazy(M,'padClass',()=>{ const p=M.padProbs;
      let bi=0; for(let c=1;c<3;c++) if(p[c]>p[bi]) bi=c; return bi; });
    lazy(M,'acc',()=>cnnAccuracy(sess.net,sess.imgs,sess.ys));
    lazy(M,'tacc',()=>cnnAccuracy(sess.net,sess.timgs,sess.tys));
  }
  else if(st.view==='learn'){
    /* the primer is static teaching material, but its "bench" numbers are
       live: they show every parked session still holding its progress */
    M.tuned=TUNED;
    M.bench={
      dart:SESS.fnn.dart?SESS.fnn.dart.step:0,
      needle:SESS.fnn.needle?SESS.fnn.needle.step:0,
      cnn:SESS.cnn.step,
      rnn:SESS.rnn.stream.step+SESS.rnn.wave.step+SESS.rnn.digits.step,
    };
    M.counts={
      fnn:netFlatten(fnnActive().net).length,
      cnn:cnnFlatten(SESS.cnn.net).length,
      rnn:rnnFlatten(SESS.rnn.stream.net).length,
    };
  }
  else {
    const sess=SESS.rnn[st.seqTask];
    M.sess=sess; M.seqTask=st.seqTask; M.step=sess.step;
    if(st.seqTask==='stream'){
      lazy(M,'probe',()=>streamProbe(sess));
      M.pTrue=2/PI; M.piTrue=PI;
      M.bits=sess.bits;
    } else if(st.seqTask==='wave'){
      lazy(M,'probe',()=>waveProbe(sess));
    } else {
      M.digits=sess.digits; M.nTrainDig=DIG_TRAIN; M.nHold=DIG_HOLD;
      lazy(M,'train',()=>digitsTrainCE(sess));
      lazy(M,'holdCE',()=>digitsHoldoutCE(sess));
      lazy(M,'recite',()=>digitsRecite(sess));
      M.ceChance=Math.log(10);
    }
  }
  return M;
}

 *  drawing helpers — the shared 2-D layer                             *
 *                                                                     *
 *  Provenance (the helper layer has DRIFTED across sims and no one    *
 *  file carries every fix — Known-bad 2026-08-11):                    *
 *    ENTS/plain/wrapText/caption/box/frame/polyline  <- sbs_sims.html *
 *      (plain strips tags, entity regex is [a-zA-Z], polyline clips   *
 *       in DATA space so the display-list audit stays honest)         *
 *    axes() range-sort                        <- standard_candle.html *

function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
/* Digit-honest long formatter for the pi readouts: TRUNCATES, never rounds,
   so every printed digit is a true leading digit of the value — rounding
   3.14159265358979 at 12 decimals would print "...590" and misstate the
   digit string this whole sim is about.  Two guard digits absorb toFixed's
   own rounding; a carry could only reach the last kept digit off a 99 tail
   in the guards, which for a noisy estimate is a 1-ulp non-event. */
function piLong(x,nDec){
  if(!isFinite(x)) return '—';
  const s=Number(x).toFixed(nDec+2);
  return s.slice(0,s.length-2);
}
/* Split a formatted estimate into the prefix that MATCHES the true digits of
   pi (from the in-file spigot, so the reference is exact integer math) and
   the tail that does not — the readout paints the match green.  Model-layer
   on purpose: a quantity computed inside a draw call cannot be tested. */
function piMatchParts(x,nDec){
  const s=piLong(x,nDec);
  const ref='3.'+PI_DIGITS_STR.slice(1);
  let i=0;
  while(i<s.length&&i<ref.length&&s[i]===ref[i]) i++;
  return {str:s,match:s.slice(0,i),rest:s.slice(i)};
}
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥'};
function plain(s){
  return String(s).replace(/&[a-zA-Z][a-zA-Z0-9]*;/g,

function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range (sbs_sims.html).
   A canvas ctx.clip() would fix the browser but NOT the audit — the
   display-list recorder treats clip() as a no-op, so the captured geometry
   would still lie.  Crossings are interpolated so a clipped curve still meets
   the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const inY=y=>y>=ylo&&y<=yhi;
  let started=false;
  for(let i=0;i<n-1;i++){
    let x0=xs[i], y0=ys[i], x1=xs[i+1], y1=ys[i+1];
    if(!isFinite(x0)||!isFinite(y0)||!isFinite(x1)||!isFinite(y1)){
      started=false; continue; }
    const a=inY(y0), c=inY(y1);
    if(!a&&!c){ started=false; continue; }
    if(!a){
      const yc=y0<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x0=x0+(x1-x0)*t; y0=yc; started=false;
    }
    if(!c){
      const yc=y1<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x1=x0+(x1-x0)*t; y1=yc;
    }
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(!c) started=false;
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed (an untrained dream can fill the panel): draw no
     legend rather than a lying one — the caption names the colours */
  return null;
}

const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', cyan:'#5ac8e0',

const HEAT_LUT=(function(){
  const lut=[];

function netColRoom(W){ return W-RO_W>=720; }
function layerXs(nL,W){
  const x0=90;

function nodeYs(n,top,bot){

function actNorm(act,a){                    /* activation -> [0,1] for fill */
