  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(plain('the forward pass, sample #'+M.inspect+' of the '
    +(M.task==='dart'?'dartboard':'needles')+' set'),24,yb);
  ctx.font='11px "SF Mono", Menlo, monospace'; ctx.fillStyle=COL.dim;
  const lines=[
    'a⁰ = ('+fmt(M.x[0],3)+', '+fmt(M.x[1],3)+')      y = '+M.y
      +(M.task==='needle'?'   (crosses a line: '+(M.y>0.5?'yes':'no')+')'
                          :'   (inside the circle: '+(M.y>0.5?'yes':'no')+')'),
    'z¹ = W¹a⁰+b¹ → ['
      +zs[0].slice(0,Math.min(4,zs[0].length)).map(v=>fmt(v,2)).join(', ')
      +(zs[0].length>4?', …':'')+']   a¹ = '+st.act+'(z¹)',
    (L>2? 'zᴼᵘᵗ = '+fmt(zOut,4)+'   σ = '+fmt(sOut,4)
      +'   loss = −ln('+(M.y>0.5?'σ':'1−σ')+') = '
      +fmt(M.sampleLoss,4):''),
  ];
  let yy=yb+20;
  for(const ln of lines){ if(ln){ ctx.fillText(ln,24,yy); yy+=17; } }
  caption(ctx,24,yy+6,
    st.showGrad
      ? 'edges now show ∂L/∂w for this one sample — orange pushes the '
        +'weight down, cyan pushes it up; backprop is just the chain rule '
        +'delivering these arrows in one backward sweep'
      : 'edge width is |w|, cyan positive, magenta negative; node brightness is '
        +'the activation.  Train and watch the first layer turn into little '
        +'boundary detectors.',
    Math.min(W-48,760));
  /* under the mini task square, clear of the layer labels; skipped along
     with the mini when the right-hand column has no room to exist */
  if(netColRoom(W))
    legendBox(ctx,W-RO_W-8-128,stageTop()+144,[[COL.wp,'w > 0'],[COL.wm,'w < 0'],
      [COL.pos,'activation'],[COL.ref,st.showGrad?'gradient':'reference']]);
}
/* small task square used by the network view */
function drawMiniTask(ctx,b,M){
  ctx.fillStyle='#0a0c12'; ctx.fillRect(b.x,b.y,b.w,b.h);
  frame(ctx,b,'#2a2f3d');
  const N=28, s=b.w/N;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const u=-1+(i+0.5)*(2/N), v=-1+(j+0.5)*(2/N);
    const p=sigmoid(netLogit(M.sess.net,[u,v]));
    ctx.fillStyle=heatCss(p);
    ctx.fillRect(b.x+i*s,b.y1-(j+1)*s,Math.ceil(s),Math.ceil(s));
  }
  const bd=M.boundary;
  polyline(ctx,b,bd.xs,bd.ys,-1,1,-1,1,COL.ref,1.2);
  const k=M.inspect, X=M.sess.data.X[k];
  const px=b.x+b.w*(X[0]+1)/2, py=b.y1-b.h*(X[1]+1)/2;
  ctx.beginPath(); ctx.arc(px,py,4,0,TAU);
  ctx.fillStyle=COL.live; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
}

/* ================================================================== *
 *  views: the dartboard and the needles (they share the strips)       *
 * ================================================================== */
function drawHeatSquare(ctx,b,M,axesOpt){
  const N=M.heatN, heat=M.heat;
  const step=b.w/N;
  for(let i=0;i<N;i++){
    const x0=Math.round(b.x+i*step), x1=Math.round(b.x+(i+1)*step);
    for(let j=0;j<N;j++){
      const y0=Math.round(b.y1-(j+1)*step), y1=Math.round(b.y1-j*step);
      ctx.fillStyle=heatCss(heat[i*N+j]);
      ctx.fillRect(x0,y0,x1-x0,y1-y0);
    }
  }
  axes(ctx,b,-1,1,-1,1,axesOpt);
}
function drawDots(ctx,b,M,maxDots){
  const X=M.sess.data.X, Y=M.sess.data.Y, net=M.sess.net;
  const n=Math.min(maxDots,X.length);
  for(let k=0;k<n;k++){
    const px=b.x+b.w*(X[k][0]+1)/2, py=b.y1-b.h*(X[k][1]+1)/2;
    const pred=netLogit(net,X[k])>0;
    ctx.beginPath(); ctx.arc(px,py,2.4,0,TAU);
    ctx.fillStyle=Y[k]>0.5?COL.pos:'#5c6478'; ctx.fill();
    if(pred!==(Y[k]>0.5)){
      ctx.beginPath(); ctx.arc(px,py,4.2,0,TAU);
      ctx.strokeStyle=COL.ref; ctx.lineWidth=1.1; ctx.stroke();
    }
  }
}
function piStrip(ctx,b,M){
  const hist=M.sess.hist.pi;
  const xs=hist.map(p=>p[0]), ys=hist.map(p=>p[1]);
  let lo=PI-0.55, hi=PI+0.55;
  for(const v of ys){ if(isFinite(v)){ lo=Math.min(lo,v-0.05); hi=Math.max(hi,v+0.05); } }
  lo=Math.max(lo,1.2); hi=Math.min(hi,6);
  const xmax=Math.max(50,M.step);
  axes(ctx,b,0,xmax,lo,hi,{title:'&pi; by learning',xlab:'training step',
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,2)});
  polyline(ctx,b,[0,xmax],[PI,PI],0,xmax,lo,hi,COL.ref,1.1,[4,3]);
  if(xs.length>1) polyline(ctx,b,xs,ys,0,xmax,lo,hi,COL.pos,1.8);
  const last=ys.length?ys[ys.length-1]:NaN;
  /* top-right INSIDE the panel: the early spikes live at the left edge, and
     a bottom-right label leaks into the next panel's tick gutter */
  ctx.fillStyle=COL.pos; ctx.font='10.5px "SF Mono", Menlo, monospace';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(plain('π̂ = '+fmt(last,4)),b.x1-6,b.y+5);
}
function mcStrip(ctx,b,M){
  const mc=M.mc;
  const xs=mc.map(p=>Math.log10(p[0])), ys=mc.map(p=>p[2]);
  const lo=PI-0.55, hi=PI+0.55;
  axes(ctx,b,1,Math.log10(20000),lo,hi,{title:'&pi; by counting',
    xlab:'samples n (log)',xticks:intTicks(1,Math.log10(20000)),
    xfmt:t=>sigf(Math.pow(10,t),2),yfmt:t=>fmt(t,2)});
  polyline(ctx,b,[1,Math.log10(20000)],[PI,PI],1,Math.log10(20000),lo,hi,COL.ref,1.1,[4,3]);
  polyline(ctx,b,xs,ys,1,Math.log10(20000),lo,hi,COL.cyan,1.5);
  const last=mc[mc.length-1];
  /* top-right inside the panel, same reasoning as piStrip */
  ctx.fillStyle=COL.cyan; ctx.font='10.5px "SF Mono", Menlo, monospace';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(plain('π̂(20000) = '+fmt(last[2],4)),b.x1-6,b.y+5);
}
function lossStrip(ctx,b,M){
  const hist=M.sess.hist.loss, accs=M.sess.hist.acc;
  const xs=hist.map(p=>p[0]), ys=hist.map(p=>Math.log10(Math.max(p[1],1e-6)));
  const xmax=Math.max(50,M.step);
  let lo=-3, hi=0.2;
  for(const v of ys) lo=Math.min(lo,v-0.1);
  axes(ctx,b,0,xmax,lo,hi,{title:b.w<230?'loss (log)':'loss (log) and accuracy',
    xlab:'training step',
    xfmt:t=>fmt(t,0),yticks:intTicks(lo,hi),yfmt:t=>'1e'+fmt(t,0)});
  if(xs.length>1) polyline(ctx,b,xs,ys,0,xmax,lo,hi,COL.pos,1.6);
  if(accs.length>1){
    const ay=accs.map(p=>lo+(hi-lo)*p[1]);
    polyline(ctx,b,accs.map(p=>p[0]),ay,0,xmax,lo,hi,COL.cyan,1.2,[2,3]);
  }
  if(b.w>=230){
    /* bottom-left: the loss curve enters top-left and the accuracy dashes
       run along the top, so this is the corner neither occupies */
    ctx.fillStyle=COL.cyan; ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(plain('dashed: accuracy 0→1 across the box'),b.x+6,b.y1-4);
  }
}
let DART_BOX=null;      /* exposed so selfTest can assert the panel is SQUARE */
function drawDart(ctx,W,H,M){
  const st=M.st;
  const stripH=Math.max(96,Math.min(132,H*0.19));
  const side=Math.min(H-stageTop()-stripH-96,W-RO_W-140,560);
  const b=box(70,stageTop()+26,side,side);
  DART_BOX=b;
  /* axis letters are dropped on a small square — they collide with the strip
     titles below and say nothing the picture does not */
  const ax=side>=300?{xlab:'x',ylab:'y'}:{};
  if(st.showHeat) drawHeatSquare(ctx,b,M,Object.assign({title:
    'the square, coloured by the net&rsquo;s P(inside)'},ax));
  else axes(ctx,b,-1,1,-1,1,Object.assign({title:'the square'},ax));
  if(st.showTrue){
    const bd=M.boundary;
    polyline(ctx,b,bd.xs,bd.ys,-1,1,-1,1,COL.ref,1.6);
  }
  if(st.showDots) drawDots(ctx,b,M,400);
  if(side>=300){
    legendBox(ctx,b.x1+12,b.y+2,[[COL.pos,'inside (label 1)'],['#5c6478','outside'],
      [COL.ref,'true circle / wrong'],['#e8f0d0','net P: dark 0 → green 1']]);
    const cy=b.y+Math.min(150,side*0.4);
    caption(ctx,b.x1+12,cy,
      'The net never sees the circle — only labelled dots.  Its P(inside) '
      +'field is painted behind them; the orange ring is the truth it is '
      +'trying to rediscover.  '+fmt(100*M.acc,1)+'% of the '+M.sess.data.X.length
      +' dots are on the right side of its boundary right now.',
      Math.max(150,Math.min(230,W-RO_W-30-(b.x1+12))));
  }
  const y0=b.y1+46;
  const bw=(W-70-24-2*46)/3;
  if(H-y0>=110){
    mcStrip(ctx,box(70,y0,bw,H-y0-40),M);
    piStrip(ctx,box(70+bw+46,y0,bw,H-y0-40),M);
    lossStrip(ctx,box(70+2*(bw+46),y0,bw,H-y0-40),M);
  } else caption(ctx,70,Math.min(y0,H-20),
    'window too short for the convergence strips — stretch it taller',W-100);
}
function needleWorld(i,worldW){
  const r=mulberry32(9500+i);
  const cx=0.55+r()*(worldW-1.1);
  const strip=Math.floor(r()*4);
  const side=r()<0.5;
  return {cx,strip,side,flip:r()<0.5?-1:1};
}
function drawNeedles(ctx,W,H,M){
  const st=M.st;
  const stripH=Math.max(96,Math.min(132,H*0.19));
  const availH=H-stageTop()-stripH-96;
  /* below this width the floor and the phase square cannot sit side by side
     with the readout; draw the floor alone and say so (sparse-view rule) */
  const narrow=(W-RO_W-170)<300+160;
  const phSide=narrow?0
    :Math.min(availH,Math.max(200,Math.min(340,(W-RO_W-190)*0.44)));
  /* left: the physical experiment, EQUAL ASPECT (needles are shapes) */
  const bl=narrow
    ? box(64,stageTop()+26,Math.max(220,Math.min(W-128,620)),Math.max(150,availH))
    : box(64,stageTop()+26,Math.max(220,Math.min(W-RO_W-170-phSide,620)),phSide);
  frame(ctx,bl,'#242a3a');
  const worldH=4, scale=bl.h/worldH, worldW=bl.w/scale;
  ctx.strokeStyle='#39404f'; ctx.lineWidth=1.4;
  for(let l=0;l<=4;l++){
    const y=bl.y+l*scale;
    ctx.beginPath(); ctx.moveTo(bl.x,y); ctx.lineTo(bl.x1,y); ctx.stroke();
  }
  const raw=M.sess.data.raw, Y=M.sess.data.Y, net=M.sess.net, X=M.sess.data.X;
  const nN=Math.min(110,raw.length);
  for(let k=0;k<nN;k++){
    const [th,x]=raw[k], wpos=needleWorld(k,worldW);
    const cyW=wpos.side?wpos.strip+x:wpos.strip+1-x;
    const phi=wpos.flip*th;
    const dx=0.5*Math.cos(phi), dy=0.5*Math.sin(phi);
    const x0=bl.x+(wpos.cx-dx)*scale, y0=bl.y+(cyW-dy)*scale;
    const x1=bl.x+(wpos.cx+dx)*scale, y1=bl.y+(cyW+dy)*scale;
    const wrong=(netLogit(net,X[k])>0)!==(Y[k]>0.5);
    ctx.strokeStyle=Y[k]>0.5?COL.pos:'#5c6478';
    ctx.lineWidth=Y[k]>0.5?1.7:1.2;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    if(wrong){
      ctx.strokeStyle=COL.ref; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.arc(bl.x+wpos.cx*scale,bl.y+cyW*scale,4.5,0,TAU); ctx.stroke();
    }
  }
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain('the floor — '+nN+' of '+raw.length
    +' needles, ℓ = d = 1, to scale'),bl.x,bl.y-9);
  /* right: phase space (theta, x) — where the learning actually happens */
  if(!narrow){
    const br=box(bl.x1+58,bl.y,phSide,phSide);
    if(st.showHeat) drawHeatSquare(ctx,br,M,{title:
      'phase space, coloured by the net&rsquo;s P(cross)',
      xlab:'&theta; → (0…π/2 as −1…1)',
      ylab:'x → (0…½ as −1…1)'});
    else axes(ctx,br,-1,1,-1,1,{title:'phase space (&theta;, x)',
      xlab:'&theta;',ylab:'x'});
    if(st.showTrue){
      const bd=M.boundary;
      polyline(ctx,br,bd.xs,bd.ys,-1,1,-1,1,COL.ref,1.6);
    }
    if(st.showDots) drawDots(ctx,br,M,400);
  }
  /* the phase panel's tick labels and x-title live in bl.y1+5..+32; the
     caption starts below them */
  const capW=narrow?Math.min(bl.w,W-128):Math.min(bl.w+58+phSide,W-RO_W-90);
  const capTx=narrow
    ? 'Each needle is a dot at (angle θ, distance x); it crosses iff '
      +'x ≤ ½ sin θ, and π = 2/P(cross).  Widen the window to see the '
      +'phase-space panel where the net learns that sine.'
    : 'Every needle is one dot in phase space: its angle θ and its '
      +'centre&rsquo;s distance x to the nearest line.  It crosses iff '
      +'x ≤ ½ sin θ — the orange sine.  The net has to learn that curve from '
      +'green-vs-grey dots alone; π then falls out of the area under it.';
  const capH=caption(ctx,bl.x,bl.y1+38,capTx,capW);
  const y0=bl.y1+38+capH+26;
  const bw=(W-64-24-2*46)/3;
  if(H-y0>=110){
    mcStrip(ctx,box(64,y0,bw,H-y0-40),M);
    piStrip(ctx,box(64+bw+46,y0,bw,H-y0-40),M);
    lossStrip(ctx,box(64+2*(bw+46),y0,bw,H-y0-40),M);
  }
}

/* ================================================================== *
 *  view: the race                                                     *
 * ================================================================== */
function drawRace(ctx,W,H,M){
  const capTxt='Same initial weights, same minibatch sequence — the ONLY '
    +'difference is the update rule, at the one shared learning rate η = '
    +M.st.lr+'.  Watch RMSprop&rsquo;s huge first strides (no bias '
    +'correction: v starts near zero, so the first step is ~10η), and how '
    +'plain SGD eventually follows the same road, later.  Change η in the '
    +'panel and the ranking can change — fastest is an experiment, not a '
    +'theorem.';
  const bw=Math.min(W-RO_W-420,760);
  const capW=Math.min(Math.max(340,bw),W-140);
  /* measure the caption FIRST and lay out from the bottom up (Known-bad:
     wrapped text has no fixed height) */
  const capLines=wrapText(ctx,capTxt,capW,'11.5px -apple-system, sans-serif').length;
  const bh=H-stageTop()-78-capLines*14-34;
  const b=box(74,stageTop()+30,Math.max(340,bw),Math.max(170,bh));
  let lo=-3.2, hi=0.3, xmax=Math.max(60,M.step);
  for(const lane of M.lanes)
    for(const p of lane.hist) lo=Math.min(lo,Math.log10(Math.max(p[1],1e-7))-0.1);
  lo=Math.max(lo,-7);
  axes(ctx,b,0,xmax,lo,hi,{title:'four optimizers, one start, the same batches',
    xlab:'training step',xfmt:t=>fmt(t,0),
    yticks:intTicks(lo,hi),yfmt:t=>'1e'+fmt(t,0)});
  for(const lane of M.lanes){
    const xs=lane.hist.map(p=>p[0]);
    const ys=lane.hist.map(p=>Math.log10(Math.max(p[1],1e-7)));
    if(xs.length>1) polyline(ctx,b,xs,ys,0,xmax,lo,hi,lane.col,1.8);
  }
  legendAuto(ctx,b,M.lanes.map(l=>[l.col,
    l.kind+(l.reachedAt!==null?'  ('+ACC_TARGET*100+'% at '+l.reachedAt+')':'')]));
  /* steps-to-target bars, right of the plot and BELOW the readout */
  const bx=b.x1+40, byTop=RO_H+8;
  const bb=box(bx,byTop,Math.max(200,W-bx-26),Math.min(170,H-byTop-40));
  if(bb.w>=170&&bb.h>=100){
    ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(plain('steps to '+(ACC_TARGET*100)+'% accuracy'),bb.x,bb.y-8);
    const worst=Math.max(...M.lanes.map(l=>l.reachedAt||0),M.step,1);
    M.lanes.forEach((l,i)=>{
      const y=bb.y+i*(bb.h/4)+6, hgt=bb.h/4-14;
      /* finished lanes: bar length = steps taken; unfinished: current
         accuracy as a fraction, so the four bars stay distinguishable */
      const w=l.reachedAt!==null? bb.w*l.reachedAt/worst : bb.w*Math.min(1,l.acc);
      ctx.fillStyle=l.reachedAt!==null?l.col:'#2a2f3d';
      ctx.fillRect(bb.x,y,Math.max(2,w),hgt);
      ctx.fillStyle=l.reachedAt!==null?'#0b0e14':'#7a8296';
      ctx.font='10.5px "SF Mono", Menlo, monospace';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      const txt=l.kind+': '+(l.reachedAt!==null?l.reachedAt:'not yet ('
        +fmt(100*l.acc,0)+'%)');
      ctx.fillText(plain(txt),bb.x+6,y+hgt/2);
    });
  }
  if(H-(b.y1+34)>=capLines*14+6) caption(ctx,b.x,b.y1+34,capTxt,capW);
  else caption(ctx,b.x,b.y1+34,
    'η = '+M.st.lr+' shared by all four rules — stretch the window taller '
    +'for the full story',capW);
}

/* ================================================================== *
 *  view: the filters (CNN)                                            *
 * ================================================================== */
function layoutCnn(W,H){
  const padSize=Math.min(238,Math.max(176,H*0.34));
  const cell=padSize/CN;
  const pad=box(64,stageTop()+40,padSize,padSize);
  const kx=pad.x1+56;
  const mapS=Math.min(58,Math.max(44,H*0.082));
  const gap=Math.max(10,mapS*0.18);
  return {pad,cell,kx,kw:52,mx:kx+52+42,mapS,gap,
          px:kx+52+42+mapS+34,
          barx:kx+52+42+mapS+34+7*Math.min(8,mapS/7)+40};
}
function drawCnn(ctx,W,H,M){
  const st=M.st, lay=layoutCnn(W,H), sess=M.sess;
  /* the pad */
  frame(ctx,lay.pad,'#39404f');
  for(let i=0;i<CN;i++) for(let j=0;j<CN;j++){
    ctx.fillStyle=M.pad[i][j]>0.5?'#cfd4de':'#10131b';
    ctx.fillRect(lay.pad.x+j*lay.cell+0.5,lay.pad.y+i*lay.cell+0.5,
                 lay.cell-1,lay.cell-1);
  }
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain('the input — draw on it ('+M.padFrom+')'),
               lay.pad.x,lay.pad.y-9);
  /* kernels */
  const F=M.padF;
  let kmax=1e-9;
  for(const Kf of M.kernels) for(const r of Kf) for(const v of r)
    kmax=Math.max(kmax,Math.abs(v));
  const ks=lay.kw/CK;
  for(let f=0;f<CF;f++){
    const ky=lay.pad.y+f*(lay.kw+16);
    if(ky+lay.kw>H-90) break;
    for(let a=0;a<CK;a++) for(let bcol=0;bcol<CK;bcol++){
      const v=M.kernels[f][a][bcol], t=Math.abs(v)/kmax;
      ctx.fillStyle=v>=0?shade(COL.wp,0.15+0.8*t):shade(COL.wm,0.15+0.8*t);
      ctx.fillRect(lay.kx+bcol*ks,ky+a*ks,Math.ceil(ks)-1,Math.ceil(ks)-1);
    }
    frame(ctx,box(lay.kx,ky,lay.kw,lay.kw),'#2a2f3d');
  }
  /* feature maps (post-ReLU) and pooled maps */
  const mS=lay.mapS, pS=Math.min(8,mS/7)*CPOOL;
  let fmax=1e-9;
  for(let f=0;f<CF;f++) for(const row of F.relu[f]) for(const v of row)
    fmax=Math.max(fmax,v);
  for(let f=0;f<CF;f++){
    const my=lay.pad.y+f*(lay.kw+16);
    if(my+mS>H-90) break;
    const cs=mS/CO;
    for(let y=0;y<CO;y++) for(let x=0;x<CO;x++){
      ctx.fillStyle=shade(COL.pos,0.08+0.85*(F.relu[f][y][x]/fmax));
      ctx.fillRect(lay.mx+x*cs,my+y*cs,Math.ceil(cs),Math.ceil(cs));
    }
    frame(ctx,box(lay.mx,my,mS,mS),'#2a2f3d');
    const ps=pS/CPOOL;
    for(let y=0;y<CPOOL;y++) for(let x=0;x<CPOOL;x++){
      ctx.fillStyle=shade(COL.pos,0.08+0.85*(F.pool[f][y][x]/fmax));
      ctx.fillRect(lay.px+x*ps,my+y*ps,Math.ceil(ps),Math.ceil(ps));
    }
    frame(ctx,box(lay.px,my,pS,pS),'#2a2f3d');
  }
  ctx.fillStyle=COL.gridtx; ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('6 kernels 3×3',lay.kx+lay.kw/2,lay.pad.y-9);
  ctx.fillText('feature maps 14×14',lay.mx+mS/2,lay.pad.y-9);
  ctx.fillText('pooled 7×7',lay.px+pS/2,lay.pad.y-9);
  /* class probabilities — only when the column actually fits on the canvas */
  const probs=M.padProbs, names=SHAPE_NAMES;
  const bx=lay.barx, bw2=Math.max(120,Math.min(210,W-RO_W-30-bx));
  if(bw2>=110&&bx+bw2<=W-8){
    ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('the verdict',bx,lay.pad.y-9);
    for(let c=0;c<3;c++){
      const y=lay.pad.y+c*44;
      ctx.fillStyle='#1b1f29'; ctx.fillRect(bx,y,bw2,16);
      ctx.fillStyle=c===M.padClass?COL.pos:'#4a5266';
      ctx.fillRect(bx,y,bw2*probs[c],16);
      ctx.fillStyle='#cfd4de'; ctx.font='10.5px "SF Mono", Menlo, monospace';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(names[c]+' '+fmt(100*probs[c],1)+'%',bx+4,y+8+14);
    }
  }
  /* caption measured FIRST, then the accuracy strip gets what is left
     (Known-bad: wrapped text has no fixed height — lay out bottom-up) */
  const capTxt='One 3×3 stencil per kernel slides over the whole image, so a '
    +'shape is recognised wherever it sits — that is weight sharing.  Cyan '
    +'kernel cells are positive weights, magenta negative; the feature maps '
    +'show where each kernel fires, and max-pooling keeps only the strongest '
    +'2×2 answer.  Train accuracy: '+fmt(100*M.acc,1)+'%, held-out: '
    +fmt(100*M.tacc,1)+'%.';
  const capW=Math.min(W-128,900);
  const capLines=wrapText(ctx,capTxt,capW,'11.5px -apple-system, sans-serif').length;
  const capY=H-12-capLines*14;
  const y0=Math.max(lay.pad.y1,lay.pad.y+CF*(lay.kw+16))+58;
  const sb=box(64,y0,Math.max(280,W-64-340),capY-26-y0-30);
  if(sb.h>=56){
    const hl=sess.hist.loss, ha=sess.hist.acc, ht=sess.hist.tacc;
    const xmax=Math.max(40,M.step);
    axes(ctx,sb,0,xmax,0,1,{title:'train (green) vs held-out (magenta) accuracy; loss dashed',
      xlab:'training step',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    if(ha.length>1) polyline(ctx,sb,ha.map(p=>p[0]),ha.map(p=>p[1]),0,xmax,0,1,COL.pos,1.7);
    if(ht.length>1) polyline(ctx,sb,ht.map(p=>p[0]),ht.map(p=>p[1]),0,xmax,0,1,COL.live,1.7);
    if(hl.length>1) polyline(ctx,sb,hl.map(p=>p[0]),hl.map(p=>Math.min(1,p[1]/1.6)),
      0,xmax,0,1,'#7a8296',1,[3,3]);
  }
  caption(ctx,64,capY,capTxt,capW);
}

/* ================================================================== *
 *  view: the sequence (RNN)                                           *
 * ================================================================== */
function drawRnnCore(ctx,W,H,M,probeXs,hs,title){
  /* the unrolled ribbon: inputs along time, hidden-state heat matrix */
  const T=Math.min(64,probeXs.length);
  const rb=box(70,stageTop()+42,Math.min(W-RO_W-120,640),16*7);
  const cw=rb.w/T, chh=rb.h/RH;
  for(let t=0;t<T;t++){
    const hcur=hs[t+1];
    for(let j=0;j<RH;j++){
      const a=(clamp(hcur[j],-1,1)+1)/2;
      ctx.fillStyle=mix(mix('#3a4254','#0d1017',Math.min(1,a*2)),
                        shade('#b8ec4c',0.82),Math.max(0,a*2-1));
      ctx.fillRect(rb.x+t*cw,rb.y+j*chh,Math.ceil(cw),Math.ceil(chh));
    }
  }
  frame(ctx,rb,'#2a2f3d');
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain(title),rb.x,rb.y-9);
  ctx.fillStyle=COL.gridtx; ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('16 hidden units × '+T+' time steps — the state h is the only memory the network has',
               rb.x,rb.y1+5);
  return rb;
}
/* bottom-up fit for the sequence views: measure the caption, hand the panel
   whatever height remains, and skip the panel honestly when there is none */
function rnnFit(ctx,yTop,W,H,capTxt,capW){
  const lines=wrapText(ctx,capTxt,capW,'11.5px -apple-system, sans-serif').length;
  const capY=H-12-lines*14;
  const ph=capY-30-yTop-34;
  return {capY,ph};
}
function drawRnn(ctx,W,H,M){
  const st=M.st;
  if(M.seqTask==='stream'){
    const pr=M.probe;
    const xs=[]; for(let t=0;t<128;t++) xs.push([M.bits[t]]);
    const {hs}=rnnForward(M.sess.net,xs.slice(0,64));
    const rb=drawRnnCore(ctx,W,H,M,xs,hs,'hidden state while watching the needle stream');
    /* bit ticks under the ribbon */
    for(let t=0;t<64;t++){
      ctx.fillStyle=M.bits[t]?COL.pos:'#3a4254';
      ctx.fillRect(rb.x+t*(rb.w/64),rb.y1+22,Math.ceil(rb.w/64)-1,6);
    }
    ctx.fillStyle=COL.gridtx; ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('the bits it watched (green = the needle crossed)',rb.x,rb.y1+32);
    const capTxt='The crossings are independent coin flips with P = 2/π '
      +'(the orange rule), so there is no pattern to find: the best possible '
      +'predictor is the constant base rate, and the green curve shows the '
      +'net finding it — from P̂ = '+fmt(pr.pHat,4)+' it hands back '
      +'π ≈ 2/P̂ = '+fmt(pr.piHat,4)+'.';
    const capW=Math.min(Math.max(rb.w,300),W-160);
    const fit=rnnFit(ctx,rb.y1+66,W,H,capTxt,capW);
    if(fit.ph>=70){
      const pb=box(70,rb.y1+66,rb.w,fit.ph);
      const outs=pr.outs, py=[];
      for(let t=0;t<128;t++) py.push(sigmoid(outs[t][0]));
      axes(ctx,pb,0,127,0,1,{title:'the net&rsquo;s running P(next crossing)',
        xlab:'time step',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
      polyline(ctx,pb,[0,127],[M.pTrue,M.pTrue],0,127,0,1,COL.ref,1.2,[4,3]);
      polyline(ctx,pb,py.map((v,i)=>i),py,0,127,0,1,COL.pos,1.7);
      if(pb.w>=300) legendAuto(ctx,pb,[[COL.pos,'net P(cross)'],
        [COL.ref,'true 2/π = '+fmt(M.pTrue,4)]]);
    }
    caption(ctx,70,fit.capY,capTxt,capW);
  }
  else if(M.seqTask==='wave'){
    const pr=M.probe;
    const xs=[]; for(let t=0;t<RNN_T;t++) xs.push([waveAt(t)]);
    const rb=drawRnnCore(ctx,W,H,M,xs,pr.hs,'hidden state while tracking the wave');
    const capTxt='Left half: the net reads the true sine (orange dashes) and '
      +'predicts one step ahead (green; MSE '+sigf(pr.mse,2)+').  Right '
      +'half: its input is cut and the magenta dream is fed its own '
      +'predictions — it can only keep the sine going if the hidden state '
      +'actually carries phase and amplitude.  Early in training the dream '
      +'collapses; watch it learn to hold the beat.';
    const capW=Math.min(Math.max(rb.w,300),W-160);
    const fit=rnnFit(ctx,rb.y1+40,W,H,capTxt,capW);
    if(fit.ph>=70){
      const pb=box(70,rb.y1+40,rb.w,fit.ph);
      axes(ctx,pb,0,2*RNN_T-1,-1.8,1.8,
        {title:'predict the next sample — then dream with eyes closed',
         xlab:'time step',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
      const tgAll=[]; for(let t=0;t<2*RNN_T;t++) tgAll.push(waveAt(t+1));
      polyline(ctx,pb,tgAll.map((v,i)=>i),tgAll,0,2*RNN_T-1,-1.8,1.8,COL.ref,1.2,[4,3]);
      polyline(ctx,pb,pr.outs.map((o,i)=>i),pr.outs.map(o=>o[0]),
               0,2*RNN_T-1,-1.8,1.8,COL.pos,1.8);
      polyline(ctx,pb,pr.dream.map((v,i)=>RNN_T+i),pr.dream,
               0,2*RNN_T-1,-1.8,1.8,COL.live,1.8);
      if(pb.w>=340) legendAuto(ctx,pb,[[COL.pos,'prediction (sees the wave)'],
        [COL.live,'dream (fed its own output)'],[COL.ref,'true sine']]);
    }
    caption(ctx,70,fit.capY,capTxt,capW);
  }
  else {
    const D=M.digits;
    const xs=[]; for(let t=0;t<64;t++) xs.push(oneHot(D[t]));
    const {hs}=rnnForward(M.sess.net,xs);
    const rb=drawRnnCore(ctx,W,H,M,xs,hs,'hidden state while reading π');
    /* the digit strip: train region then holdout, prediction correctness */
    const allXs=[]; for(let t=0;t<D.length-1;t++) allXs.push(oneHot(D[t]));
    const outsAll=rnnForward(M.sess.net,allXs).outs;
    /* the strip stays LEFT of the floating readout — 35 digits were hiding
       under it at full width before this bound existed */
    const dw=Math.min(9,(W-RO_W-90)/(D.length)), dy=rb.y1+40;
    ctx.font='8.5px "SF Mono", Menlo, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let t=1;t<D.length;t++){
      const o=outsAll[t-1];
      let bi=0; for(let c=1;c<10;c++) if(o[c]>o[bi]) bi=c;
      const okd=bi===D[t];
      const x=70+(t-1)*dw;
      if(x>W-RO_W-16) break;
      ctx.fillStyle=okd?(t<M.nTrainDig?COL.pos:'#7ec48f'):'#3a4254';
      ctx.fillRect(x,dy,Math.max(1,dw-1),14);
      if(dw>=7){ ctx.fillStyle='#0b0e14'; ctx.fillText(String(D[t]),x+dw/2,dy+7); }
    }
    /* the train/holdout divider, labelled only when the label has room
       above the caption (560x380 has none) */
    const xdiv=70+(M.nTrainDig-1)*dw;
    ctx.strokeStyle=COL.live; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(xdiv,dy-6); ctx.lineTo(xdiv,dy+20); ctx.stroke();
    const capTxt='The digits of π pass every statistical test of randomness, '
      +'so there is nothing to generalise: the net can only MEMORISE.  '
      +'Training loss (green) collapses while held-out loss (magenta) never '
      +'improves — it climbs PAST the orange chance line as the net grows '
      +'confidently wrong.  That gap is overfitting itself.  Right now it '
      +'recites '+M.recite+' digits before its first mistake.';
    const pw=Math.min(W-RO_W-120,640);
    const capW=Math.min(Math.max(pw,300),W-160);
    const fit=rnnFit(ctx,dy+52,W,H,capTxt,capW);
    if(dy+34<fit.capY-4){
      ctx.fillStyle=COL.live; ctx.font='10px -apple-system, sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('memorised ← | → never seen',Math.min(xdiv+4,W-RO_W-170),dy+22);
    }
    if(fit.ph>=70){
      const pb=box(70,dy+52,pw,fit.ph);
      const hl=M.sess.hist.loss, hh=M.sess.hist.hold;
      const xmax=Math.max(40,M.step);
      /* the y-range follows the held-out climb, or the most instructive part
         of the picture sits clipped against the frame */
      let yh=3;
      if(hh) for(const p of hh) yh=Math.max(yh,Math.min(6,p[1]+0.3));
      axes(ctx,pb,0,xmax,0,yh,{title:'cross-entropy: training digits vs held-out digits',
        xlab:'training step',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
      polyline(ctx,pb,[0,xmax],[M.ceChance,M.ceChance],0,xmax,0,yh,COL.ref,1.1,[4,3]);
      if(hl.length>1) polyline(ctx,pb,hl.map(p=>p[0]),hl.map(p=>p[1]),0,xmax,0,yh,COL.pos,1.7);
      if(hh&&hh.length>1) polyline(ctx,pb,hh.map(p=>p[0]),hh.map(p=>p[1]),0,xmax,0,yh,COL.live,1.7);
      if(pb.w>=380) legendAuto(ctx,pb,[[COL.pos,'train CE'],
        [COL.live,'held-out CE'],[COL.ref,'chance = ln 10 ≈ 2.30']]);
    }
    caption(ctx,70,fit.capY,capTxt,capW);
  }
}

/* ================================================================== *
 *  view: the primer (a still page — the ideas behind the other tabs)  *
 * ================================================================== */
function arrowRt(ctx,x0,y,x1,col){
  ctx.strokeStyle=col; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x1-5,y-3.5);
  ctx.lineTo(x1-5,y+3.5); ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
}
function primerTitle(ctx,x,y,txt){
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(plain(txt),x,y);
}
function drawMiniFnn(ctx,b){
  const cols=[2,4,1], xs=[b.x+22,b.x+b.w/2,b.x1-22];
  const ys=cols.map((n,l)=>nodeYs(n,b.y+(n<=2?b.h*0.3:16),b.y1-(n<=2?b.h*0.3:16)));
  for(let l=0;l<2;l++) for(let j=0;j<cols[l+1];j++) for(let i=0;i<cols[l];i++){
    ctx.strokeStyle=(i+j)%2?COL.wm:COL.wp; ctx.globalAlpha=0.55; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(xs[l]+7,ys[l][i]); ctx.lineTo(xs[l+1]-7,ys[l+1][j]);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(let l=0;l<3;l++) for(let j=0;j<cols[l];j++){
    ctx.beginPath(); ctx.arc(xs[l],ys[l][j],7,0,TAU);
    ctx.fillStyle=shade(COL.pos,0.25+0.3*l); ctx.fill();
    ctx.strokeStyle='#39404f'; ctx.lineWidth=1; ctx.stroke();
  }
}
function drawMiniCnn(ctx,b){
  const g=Math.min(52,b.h-28), cy=b.y+(b.h-g)/2;
  const gx=b.x+10, cs=g/6;
  for(let i=0;i<6;i++) for(let j=0;j<6;j++){
    ctx.fillStyle=(i+j)%3?'#10131b':'#2a3140';
    ctx.fillRect(gx+j*cs,cy+i*cs,cs-1,cs-1);
  }
  ctx.strokeStyle=COL.cyan; ctx.lineWidth=1.4;
  ctx.strokeRect(gx+cs,cy+cs,3*cs,3*cs);
  arrowRt(ctx,gx+g+6,cy+g/2,gx+g+24,COL.dim);
  const fx=gx+g+28, fg=g*0.72, fs=fg/5;
  for(let i=0;i<5;i++) for(let j=0;j<5;j++){
    ctx.fillStyle=shade(COL.pos,0.15+0.6*(((i*5+j)%7)/7));
    ctx.fillRect(fx+j*fs,cy+(g-fg)/2+i*fs,fs-1,fs-1);
  }
  arrowRt(ctx,fx+fg+6,cy+g/2,fx+fg+24,COL.dim);
  const px2=fx+fg+28, pg=g*0.4, ps=pg/2;
  for(let i=0;i<2;i++) for(let j=0;j<2;j++){
    ctx.fillStyle=shade(COL.pos,0.3+0.5*((i+j)%2));
    ctx.fillRect(px2+j*ps,cy+(g-pg)/2+i*ps,ps-1,ps-1);
  }
}
function drawMiniRnn(ctx,b){
  const n=3, bw=30, bh=20, gap=(b.w-40-n*bw)/(n-1);
  const y=b.y+b.h/2-bh/2;
  for(let k=0;k<n;k++){
    const x=b.x+20+k*(bw+gap);
    ctx.fillStyle='#171c28'; ctx.fillRect(x,y,bw,bh);
    frame(ctx,box(x,y,bw,bh),'#39404f');
    ctx.fillStyle=COL.pos; ctx.font='10.5px "SF Mono", Menlo, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('h',x+bw/2,y+bh/2);
    if(k<n-1) arrowRt(ctx,x+bw+2,y+bh/2,x+bw+gap-2,COL.cyan);
    ctx.strokeStyle=COL.dim; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+bw/2,y+bh+14); ctx.lineTo(x+bw/2,y+bh+3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+bw/2,y-3); ctx.lineTo(x+bw/2,y-14); ctx.stroke();
  }
  ctx.fillStyle=COL.gridtx; ctx.font='9.5px -apple-system, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('x per step in, y out — h is the only memory',b.x+b.w/2,y+bh+18);
}
function drawLearn(ctx,W,H,M){
  const y0=stageTop()+26;
  /* row A spans [64, 64+Wu]; keep its far edge 24 px clear of the floating
     readout (the audit flags any text crossing W-RO_W — it caught 4 px) */
  const Wu=Math.max(150,W-RO_W-88);
  const machines=[
    ['feed-forward',drawMiniFnn,
     'a function you can bend: weighted sums and squashes, layer after '
     +'layer.  It learns the dartboard circle and the needle sine.'],
    ['convolutional',drawMiniCnn,
     'one 3×3 stencil slid over the whole image, so a shape is the same '
     +'shape anywhere.  It learns disc / ring / stick on the filters tab.'],
    ['recurrent',drawMiniRnn,
     'reads one symbol at a time and carries everything it knows in a '
     +'hidden state.  It powers all three sequence lessons.'],
  ];
  const optLines=[
    ['SGD','w ← w − η g','the raw gradient, nothing else'],
    ['momentum','m ← 0.9 m + g,  w ← w − η m','a rolling velocity smooths the ride'],
    ['RMSprop','w ← w − η g/√v̄','per-weight rescale; huge uncorrected first steps'],
    ['Adam','w ← w − η m̂/(√v̂ + ε)','momentum and rescale, bias-corrected'],
  ];
  const wide=Wu>=560;
  let y=y0;
  if(wide){
    /* row A: the three machines, side by side */
    const pw=(Wu-48)/3, ph=Math.min(118,Math.max(92,H*0.16));
    let capMax=0;
    for(let k=0;k<3;k++){
      const px=64+k*(pw+24);
      primerTitle(ctx,px,y+4,machines[k][0]);
      const b=box(px,y+12,pw,ph);
      ctx.fillStyle='#0a0c12'; ctx.fillRect(b.x,b.y,b.w,b.h);
      frame(ctx,b,'#242a3a');
      machines[k][1](ctx,b);
      const chh=caption(ctx,px,b.y1+8,machines[k][2],pw-6);
      capMax=Math.max(capMax,chh);
    }
    y+=12+ph+8+capMax+24;
    /* row B: one training step */
    if(H-y>=210){
      primerTitle(ctx,64,y+4,'one training step');
      const bw2=Math.min(178,(Wu-3*34)/4), bh2=32, yB=y+14;
      const labels=['forward: f(x; w)','loss: ℓ(f, y)','backward: ∂L/∂w','update: w − η·step'];
      for(let k=0;k<4;k++){
        const x=64+k*(bw2+34);
        ctx.fillStyle='#171c28'; ctx.fillRect(x,yB,bw2,bh2);
        frame(ctx,box(x,yB,bw2,bh2),k===2?'#3d5a2f':'#39404f');
        ctx.fillStyle=k===2?COL.pos:'#cfd4de';
        ctx.font='10.5px "SF Mono", Menlo, monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(plain(labels[k]),x+bw2/2,yB+bh2/2);
        if(k<3) arrowRt(ctx,x+bw2+4,yB+bh2/2,x+bw2+30,COL.dim);
      }
      y=yB+bh2+8;
      y+=caption(ctx,64,y,
        'backward is the chain rule visiting every weight exactly once per '
        +'sample — gradients cost about as much as one extra forward pass, '
        +'and that single fact is why training deep networks is affordable.',
        Math.min(Wu,760))+22;
    }
    /* row C: the four update rules */
    if(H-y>=150){
      primerTitle(ctx,64,y+4,'four ways to spend the same gradient');
      ctx.font='11px "SF Mono", Menlo, monospace';
      ctx.textBaseline='alphabetic';
      let yy=y+22;
      for(const [name,rule,note] of optLines){
        ctx.textAlign='left';
        ctx.fillStyle=OPT_COL[name.toLowerCase()]||COL.dim;
        ctx.fillText(plain(name),64,yy);
        ctx.fillStyle='#cfd4de';
        ctx.fillText(plain(rule),64+88,yy);
        if(Wu>=680){ ctx.fillStyle='#767e92';
          ctx.fillText(plain(note),64+338,yy); }
        yy+=17;
      }
      y=yy+12;
    }
    /* row D: the measured presets */
    if(H-y>=120){
      primerTitle(ctx,64,y+4,'measured: what wins on which problem');
      ctx.font='11px "SF Mono", Menlo, monospace';
      ctx.textBaseline='alphabetic';
      let yy=y+22;
      for(const [tk,tname] of [['dart','dartboard'],['needle','needles']]){
        const t=TUNED[tk], c=t.cfg;
        ctx.textAlign='left'; ctx.fillStyle=COL.pos;
        ctx.fillText(plain(tname),64,yy);
        ctx.fillStyle='#cfd4de';
        ctx.fillText(plain(archName(c.arch)+' '+c.act+' · '+c.opt+' η='+c.lr),64+88,yy);
        if(Wu>=680){ ctx.fillStyle='#767e92';
          ctx.fillText(plain('95% in ~'+t.med.steps95+' steps · |π̂−π| ≈ '
            +fmt(t.med.piErr,4)),64+338,yy); }
        yy+=17;
      }
      y=yy+8;
      y+=caption(ctx,64,y,
        'Winners of a 480-configuration sweep (5 seeds each) through this '
        +'very engine — the race tab is the two-minute version of that '
        +'experiment.  With auto-tune on, a task that starts fresh starts '
        +'from its preset; neither preset wins on the other problem, and '
        +'that non-transfer is the lesson.  η stays live afterwards: train '
        +'hot, then drop it to freeze the wobble (the polish move).  A new '
        +'problem needs only a generator and a sweep to earn its own row.',
        Math.min(Wu,760));
    }
  } else {
    /* narrow: the same story as stacked text, dropped honestly when the
       window runs out (sparse-view rule) */
    const capW=Math.max(150,Math.min(Wu,W-128));
    const blocks=[
      ['the three machines',
       machines.map(m=>m[0]+' — '+m[2]).join('  ')],
      ['one training step',
       'forward, loss, backward, update.  Backward is the chain rule '
       +'visiting every weight once — that is why deep learning is '
       +'affordable.'],
      ['four update rules',
       optLines.map(o=>o[0]+': '+o[1]).join(' · ')],
      ['measured presets',
       'dartboard '+TUNED.dart.cfg.act+' '+TUNED.dart.cfg.opt+' η='
       +TUNED.dart.cfg.lr+' · needles '+TUNED.needle.cfg.act+' '
       +TUNED.needle.cfg.opt+' η='+TUNED.needle.cfg.lr
       +' — winners of a 480-config sweep; auto-tune applies them when a '
       +'task starts fresh.'],
    ];
    let shown=0;
    for(const [t,txt] of blocks){
      const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
      if(y+18+lines*14>H-30) break;
      primerTitle(ctx,64,y+10,t);
      y+=18;
      y+=caption(ctx,64,y,txt,capW)+14;
      shown++;
    }
    if(shown<blocks.length)
      caption(ctx,64,Math.min(y,H-24),
        'stretch the window for the rest of the primer',capW);
  }
}

function drawView(ctx,W,H,M){
  LEGEND_RECTS=[];
  POLY_SEGS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='net') drawNet(ctx,W,H,M);
  else if(M.view==='dart') drawDart(ctx,W,H,M);
  else if(M.view==='needle') drawNeedles(ctx,W,H,M);
  else if(M.view==='race') drawRace(ctx,W,H,M);
  else if(M.view==='cnn') drawCnn(ctx,W,H,M);
  else if(M.view==='learn') drawLearn(ctx,W,H,M);
  else drawRnn(ctx,W,H,M);
}

function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.rebuild=function(){};                       /* sessions rebuild on demand */
  S.fit=function(){};
  S.draw=function(){
    /* fetch the context HERE, not at boot — the UI harness swaps in a fresh
       recording context per capture (Known-bad, polyhedra.html) */
    const ctx=canvas.getContext('2d');
    drawView(ctx,S.W,S.H,buildModel());
  };
  S.step=function(){
    if(!ST.running||ST.view==='learn') return false;
    advanceActive(ST.speed);
    return true;
  };
  /* pointer: ONLY the CNN pad listens; every other view ignores it, and the
     UI harness asserts that ignoring (no dead wheel/pointer stubs left to
     rot — Known-bad, scattering.html). Returns true if it consumed. */
  S.pointer=function(type,x,y){
    if(ST.view!=='cnn') return false;
    const lay=layoutCnn(S.W,S.H);
    if(x<lay.pad.x||x>=lay.pad.x1||y<lay.pad.y||y>=lay.pad.y1) return false;
    const j=Math.floor((x-lay.pad.x)/lay.cell), i=Math.floor((y-lay.pad.y)/lay.cell);
    padPaint(SESS.cnn,i,j);
    return true;
  };
  return S;
}

function eqbarHTML(M){

      +'<span class="hl">L = −ln p(y)</span> &nbsp;&nbsp;·&nbsp;&nbsp; '
      +'w ← w − η ∂L/∂w'

      +'nudging every weight downhill. That is the whole subject.</span>';
  if(v==='dart')
    return '<span class="lhs">π</span> = 4 · P(x²+y² &lt; 1) '

      +'<span class="sm">Buffon, 1777, with ℓ = d = 1: drop sticks, count '

  if(v==='race')
    return 'SGD: w−ηg &nbsp;·&nbsp; momentum: m←0.9m+g '
      +'&nbsp;·&nbsp; RMSprop: w−ηg/√v̄ &nbsp;·&nbsp; '
      +'<span class="hl">Adam: w − η m̂/(√v̂+ε)</span>'

  if(v==='cnn')

  return '<span class="lhs">h<sub>t</sub></span> = tanh(W<sub>x</sub>x<sub>t</sub> '
    +'+ W<sub>h</sub>h<sub>t−1</sub> + b) &nbsp;&nbsp;·&nbsp;&nbsp; '
    +'<span class="hl">y<sub>t</sub> = W<sub>o</sub>h<sub>t</sub></span>'

}

function boot(){

  const roEl=document.getElementById('readout');

  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  /* the dartboard and needle views ARE their experiments: entering one binds
     the task (a needle view of a dart-trained net would be meaningless).
     Binding RESUMES the task's parked session — nothing resets on a tab
     switch; the task chips stay where the choice is real (net, race). */
  function setView(k){
    st.view=k;

      onclick:()=>setView(k)},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); refresh(); });

          if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>
            b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view, fnnish=(v==='net'||v==='dart'||v==='needle');
    gTask.hidden=!(v==='net'||v==='race');
    gNet.hidden=!(fnnish||v==='race');
    gTrain.hidden=!(fnnish||v==='race');
    optChips.hidden=(v==='race');            /* the race runs all four */
    gSeq.hidden=(v!=='rnn');
    gPad.hidden=(v!=='cnn');
    gShow.hidden=!fnnish;
    gRun.hidden=(v==='learn');               /* the primer holds still */
    rows.inspect.row.hidden=(v!=='net');
    let gradRow=null;
    [].forEach.call(showChecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showHeat','showTrue','showDots','showGrad'][i]];
      if(i===3) gradRow=inp;
    });
    [].forEach.call(runChecks.querySelectorAll('input'),inp=>{ inp.checked=st.running; });
    [].forEach.call(tuneChecks.querySelectorAll('input'),inp=>{ inp.checked=st.autoTune; });
    for(const k in rows) rows[k].sync();
    netTag.innerHTML='params: <b>'
      +netFlatten(fnnActive().net).length+'</b> &nbsp; seed <b>'+st.seed+'</b>'
      +'<br>changing a setting here restarts THIS task&rsquo;s net; the '
      +'other task keeps its progress';
    trainTag.innerHTML=((v==='race')
      ?'the race runs <b>all four</b> rules at the shared &eta;; changing '
       +'&eta; restarts it &mdash; same conditions ARE the experiment'
      :'&eta; is <b>live</b>: train hot, then drop it to freeze the wobble '
       +'(the polish move) &mdash; everything else restarts the net')
      +'<br>auto-tune starts a FRESH task on its measured preset (<b>'
      +tunedName(st.task)+'</b>)';
    runTag.innerHTML='data seeds fixed; <b>reset nets</b> replays the exact run';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent = st.view==='cnn'
        ? 'draw on the pad · space runs training · r restarts the nets'
        : st.view==='net'
        ? 'pick a sample, flip to gradients, single-step to watch one update'
        : st.view==='learn'
        ? 'a still page — training waits, parked, on every other tab'
        : 'space runs · s steps once · r restarts · 1–7 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){
      canvas.classList.add('drawing'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('drawing')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)) dirty=true;
  });
  const up=()=>canvas.classList.remove('drawing');
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); refresh(); }
    else if(e.key==='s'){ advanceActive(1); dirty=true; refresh(); }
    else if(e.key==='r'){ replayNets(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%10===0){
          const M=S.model();
          roEl.innerHTML=readoutHTML(M);
        }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

/* ================================================================== *
 *  selfTest — headless verification                                   *
 *                                                                     *
 *  "(py ref)" marks a value printed by build_neural/gen_reference.py  *
 *  and read from its full output — the Python twin of this engine,    *
 *  same operation order, independent runtime.  PRNG-derived values    *
 *  are BIT-EXACT; libm-derived ones carry stated tolerances that      *
 *  grow along the training trajectory.                                *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,tol,n)=>ok(Math.abs(a-b)<=tol,n+'  (got '+a+', want '+b+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),
    n+'  (got '+a+', want '+b+', rel '+Math.abs(a-b)/Math.abs(b||1)+')');
  const T0=Date.now();

  /* ---- 0. the shared-helper fixes cannot rot (Known-bad 2026-08-11) */
  ok(plain('&Delta;x &rho;')==='Δx ρ','plain() decodes capital+Greek entities');
  ok(plain('a<sub>B</sub>b')==='aBb','plain() strips tags');
  ok(plain('&theta;')==='θ','plain() knows &theta;');
  ok(ticksFor(0.2,0.8,5).length>=3,'ticksFor works on a sorted range');
  ok(ticksFor(0.8,0.2,5).length===1,
     'unsorted ticksFor still collapses — the axes() sort is what saves it');
  ok(ticksFor(Math.min(0.8,0.2),Math.max(0.8,0.2),5).length>=3,
     'axes()-style sorted call yields a full tick set');
  ok(ticksFor(0,-1,5).length===1&&ticksFor(-1,0,5).length>=2,
     'non-positive spans return a single tick, no infinite loop');
  { let threw=false;
    try{ toRgb('not-a-colour'); }catch(e){ threw=true; }
    ok(threw,'toRgb throws on garbage rather than defaulting');
    ok(mix('rgb(58,111,142)','#ffffff',0)==='rgb(58,111,142)',
       'mix() accepts its own output format'); }
  { /* polyline clips IN DATA SPACE: an off-scale point must be interpolated
       to the frame edge, and the recorded geometry must say so */
    const stub={beginPath(){},moveTo(){},lineTo(){},stroke(){},save(){},
                restore(){},setLineDash(){}};
    const bb=box(100,100,200,100);
    POLY_SEGS=[];
    polyline(stub,bb,[0,1,2],[0,10,0],0,2,0,1,'#fff',1);
    let ymin=1e9, atTop=false, sloped=false;
    for(let i=0;i<POLY_SEGS.length;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      ymin=Math.min(ymin,y0,y1);
      if(Math.abs(y0-bb.y)<1e-9||Math.abs(y1-bb.y)<1e-9) atTop=true;
      /* a REAL segment touching the edge: one end on it, the other not, with
         horizontal extent — a degenerate point-recording mutant has neither
         (found by the mutation sweep, 2026-08-12) */
      if((Math.abs(y0-bb.y)<1e-9)!==(Math.abs(y1-bb.y)<1e-9)&&x0!==x1) sloped=true;
    }
    ok(ymin>=bb.y-1e-9,'polyline never emits geometry above the frame');
    ok(atTop,'and the clipped crossing is interpolated exactly onto the edge');
    ok(sloped,'and the recorded segments are real segments, not points');
    POLY_SEGS=[]; }
  { /* the probability ramp: diverging on purpose, each half monotone */
    let mono1=true, mono0=true;
    for(let i=1;i<=32;i++){
      if(lumOf(HEAT_LUT[32+i])<lumOf(HEAT_LUT[32+i-1])) mono1=false;
      if(lumOf(HEAT_LUT[32-i])<lumOf(HEAT_LUT[32-i+1])) mono0=false;
    }
    ok(mono1,'heat ramp: P>0.5 half is monotone brighter toward 1');
    ok(mono0,'heat ramp: P<0.5 half is monotone brighter toward 0');
    ok(lumOf(HEAT_LUT[32])<lumOf(HEAT_LUT[0])&&lumOf(HEAT_LUT[32])<lumOf(HEAT_LUT[64]),
       'and the P=0.5 midpoint is its darkest point'); }

  /* ---- 1. PRNG parity — bit exact ---------------------------------- */
  { const r=mulberry32(1);
    const want=[0.62707394058816135,0.0027357211802154779,0.52744703995995224,
                0.98105096747167408,0.96837789821438491];
    for(let i=0;i<5;i++) ok(r()===want[i],'(py ref) mulberry32(1) #'+i+' bit-exact');
    const r2=mulberry32(123456789);
    const want2=[0.2577907438389957,0.97077211155556142,0.78532801428809762,
                 0.20616457983851433,0.30307188746519387];
    for(let i=0;i<5;i++) ok(r2()===want2[i],'(py ref) mulberry32(123456789) #'+i); }
  { const g=gaussOf(mulberry32(7));
    const want=[2.7593729870288439,1.131981118666697,-0.068051356507354041,
                -0.20517153568050719,-0.94594896044528853,0.63834354738987931];
    for(let i=0;i<6;i++) close(g(),want[i],1e-13,'(py ref) gauss(seed7) #'+i); }

  /* ---- 2. closed forms and stable branches ------------------------- */
  close(PI,3.141592653589793,1e-15,'pi');
  close(PI/4,0.7853981633974483,1e-16,'pi/4 — the dartboard P');
  close(2/PI,0.6366197723675814,1e-16,'2/pi — the Buffon P');
  rel(softplus(20),20.000000002061153,1e-15,'(py ref) softplus(20), big-z branch');
  rel(softplus(-20),2.0611536203143808e-09,1e-12,'(py ref) softplus(-20), small branch');
  rel(softplus(0.5),0.97407698418010669,1e-14,'(py ref) softplus at the join region');
  rel(bceLoss(2,1),0.12692801104297269,1e-14,'(py ref) bce(z=2,y=1)');
  rel(ceLoss([2,-1,0.5],1),3.2413112966571571,1e-14,'(py ref) softmax-CE');
  /* identities implemented twice — catches typing */
  close(sigmoid(0.7),Math.exp(-softplus(-0.7)),1e-15,
        'sigma(z) === exp(-softplus(-z)) identity');
  close(bceLoss(1.3,1)+bceLoss(-1.3,0),2*softplus(-1.3)+0,1e-15,
        'bce symmetry: L(z,1)+L(-z,0) = 2 softplus(-z)... twice the one-sided form');
  { const p=softmax([2,-1,0.5]); let s=0; for(const v of p) s+=v;
    close(s,1,1e-14,'softmax sums to 1');
    close(-Math.log(p[1]),ceLoss([2,-1,0.5],1),1e-13,'CE === -log softmax[y]'); }

  /* ---- 3. FNN init + forward + grads parity ------------------------ */
  { const net=netNew([2,8,1],'tanh',3);
    rel(net.W[0][0][0],0.55605789145389217,1e-13,'(py ref) init W1[0][0]');
    rel(net.W[0][3][1],0.72155714125018455,1e-13,'(py ref) init W1[3][1]');
    rel(net.W[0][7][0],0.34989837757172965,1e-13,'(py ref) init W1[7][0]');
    rel(net.W[1][0][5],-0.34884860619355701,1e-13,'(py ref) init W2[0][5]');
    ok(netFlatten(net).length===33,'(py ref) [2,8,1] has 33 parameters');
    ok(netFlatten(netNew([2,8,8,1],'tanh',3)).length===105,
       '(py ref) [2,8,8,1] has 105 parameters');
    const D=genDart(SEED_DART,512,0);
    ok(D.X[0][0]===0.023174097295850515&&D.X[0][1]===0.059892816469073296,
       '(py ref) dart X[0] bit-exact');
    ok(D.X[5][0]===-0.03991506015881896&&D.X[5][1]===0.68704134412109852,
       '(py ref) dart X[5] bit-exact');
    { let s=0; for(const y of D.Y) s+=y;
      ok(s===394,'(py ref) dart labels sum to 394 of 512'); }
    const F=netForward(net,D.X[5]);
    rel(F.zs[0][0],0.072479014743442552,1e-12,'(py ref) z1[0] on sample 5');
    rel(F.zs[0][7],-0.24035698027972399,1e-12,'(py ref) z1[7]');
    rel(F.zs[1][0],-0.51636696429942419,1e-12,'(py ref) output logit');
    rel(sigmoid(F.zs[1][0]),0.37370215061168205,1e-12,'(py ref) sigma(logit)');
    rel(bceLoss(F.zs[1][0],D.Y[5]),0.98429618759240145,1e-12,'(py ref) sample loss');
    rel(netBatchLoss(net,D.X,D.Y),0.78003136152270625,1e-12,
        '(py ref) full-train loss, untrained');
    const g=netGrads(net,D.X,D.Y,[0,1,2,3,4,5,6,7]);
    rel(g.gW[0][0][0],0.013678384262303195,1e-11,'(py ref) dW1[0][0], batch 0..7');
    rel(g.gW[0][5][1],0.014501182314025291,1e-11,'(py ref) dW1[5][1]');
    rel(g.gB[0][3],0.24441976766231213,1e-11,'(py ref) db1[3]');
    rel(g.gW[1][0][2],0.034758839467857641,1e-11,'(py ref) dW2[0][2]');
    rel(g.gB[1][0],-0.53753871507741957,1e-11,'(py ref) db2[0]');
    /* activation variants, forward loss on batch 0..7 */
    rel(netBatchLoss(netNew([2,8,1],'relu',3),D.X,D.Y,[0,1,2,3,4,5,6,7]),
        0.8223011833656122,1e-12,'(py ref) relu forward loss');
    rel(netBatchLoss(netNew([2,8,1],'sigmoid',3),D.X,D.Y,[0,1,2,3,4,5,6,7]),
        1.0567067721805488,1e-12,'(py ref) sigmoid forward loss');
    rel(netBatchLoss(netNew([2,8,8,1],'tanh',3),D.X,D.Y,[0,1,2,3,4,5,6,7]),
        0.6567813038368292,1e-12,'(py ref) two-hidden-layer forward loss'); }

  /* ---- 4. numeric-vs-analytic gradients (the gold standard) -------- */
  function numGradCheck(name,flat,unflat,lossFn,picks,tol){
    const base=flat();
    const ana=lossFn.grads();
    let worst=0, worstI=-1;
    for(const i of picks){
      const hstep=1e-6;
      const p1=base.slice(); p1[i]+=hstep; unflat(p1);
      const lp=lossFn.loss();
      const p2=base.slice(); p2[i]-=hstep; unflat(p2);
      const lm=lossFn.loss();
      unflat(base);
      const num=(lp-lm)/(2*hstep);
      const err=Math.abs(num-ana[i])/Math.max(Math.abs(num),Math.abs(ana[i]),1e-6);
      if(err>worst){ worst=err; worstI=i; }
    }
    ok(worst<tol,name+' numeric-vs-analytic gradient (worst rel '
       +worst.toExponential(2)+' at param '+worstI+')');
  }
  { const D=genDart(SEED_DART,64,0);
    for(const act of ['tanh','relu','sigmoid']){
      const net=netNew([2,5,4,1],act,9);
      const idx=[0,1,2,3,4,5];
      numGradCheck('dense['+act+']',
        ()=>netFlatten(net), f=>netUnflatten(net,f),
        {loss:()=>netBatchLoss(net,D.X,D.Y,idx),
         grads:()=>gradsFlatten(netGrads(net,D.X,D.Y,idx))},
        [0,3,11,15,22,30,39,44],1e-4);
    } }
  { const sh=genShapes(SEED_SHAPES,4);
    const net=cnnNew(77);
    const lossFn={
      loss:()=>cnnGrads(net,sh.imgs.slice(0,2),sh.ys.slice(0,2)).loss,
      grads:()=>cnnGradsFlatten(cnnGrads(net,sh.imgs.slice(0,2),sh.ys.slice(0,2))),
    };
    numGradCheck('conv+pool+dense',
      ()=>cnnFlatten(net), f=>cnnUnflatten(net,f), lossFn,
      [0,4,8,27,53,60,61,70,300,940],1e-4); }
  { const bits=genBits(SEED_BITS,20);
    const xs=[],tg=[];
    for(let t=0;t<12;t++){ xs.push([bits[t]]); tg.push(bits[t+1]); }
    const net=rnnNew(55,1,1);
    const lossFn={
      loss:()=>rnnBPTT(net,xs,tg,'bce').loss,
      grads:()=>rnnGradsFlatten(rnnBPTT(net,xs,tg,'bce')),
    };
    numGradCheck('rnn bptt (bce)',
      ()=>rnnFlatten(net), f=>rnnUnflatten(net,f), lossFn,
      [0,5,16,40,120,272,288,300],1e-4); }
  { const xs=[],tg=[];
    for(let t=0;t<12;t++){ xs.push([waveAt(t)]); tg.push(waveAt(t+1)); }
    const net=rnnNew(56,1,1);
    numGradCheck('rnn bptt (mse)',
      ()=>rnnFlatten(net), f=>rnnUnflatten(net,f),
      {loss:()=>rnnBPTT(net,xs,tg,'mse').loss,
       grads:()=>rnnGradsFlatten(rnnBPTT(net,xs,tg,'mse'))},
      [1,17,50,272,290,301],1e-4); }
  { const D=PI_DIGITS_STR.split('').map(Number);
    const xs=[],tg=[];
    for(let t=0;t<10;t++){ xs.push(oneHot(D[t])); tg.push(D[t+1]); }
    const net=rnnNew(57,10,10);
    numGradCheck('rnn bptt (softmax-ce)',
      ()=>rnnFlatten(net), f=>rnnUnflatten(net,f),
      {loss:()=>rnnBPTT(net,xs,tg,'ce').loss,
       grads:()=>rnnGradsFlatten(rnnBPTT(net,xs,tg,'ce'))},
      [2,30,170,436,530,600],1e-4); }
  /* maxpool routes the gradient to the argmax cell and nowhere else */
  { const img=[]; for(let i=0;i<CN;i++) img.push(new Array(CN).fill(0));
    img[1][1]=1;                                     /* one bright pixel */
    const net=cnnNew(91);
    const F=cnnForward(net,img);
    let okRoute=true;
    for(let f=0;f<CF;f++) for(let y=0;y<CPOOL;y++) for(let x=0;x<CPOOL;x++){
      let best=-1e300;
      for(let dy=0;dy<2;dy++) for(let dx=0;dx<2;dx++)
        best=Math.max(best,F.relu[f][2*y+dy][2*x+dx]);
      if(F.pool[f][y][x]!==best) okRoute=false;
    }

              +fmt(b.x0,0)+','+fmt(b.y0,0)+' in '+stOver.view+'@'+W+'x'+H; }
        }
        const unrot=R.texts.filter(t=>!t.rot);
        for(let i=0;i<unrot.length;i++) for(let j=i+1;j<unrot.length;j++){
          const A=textBox(unrot[i]), B=textBox(unrot[j]);
          const wOver=Math.min(A.x1,B.x1)-Math.max(A.x0,B.x0);
          const hOver=Math.min(A.y1,B.y1)-Math.max(A.y0,B.y0);
          if(wOver>3&&hOver>3){ badOverlap++;
            if(badOverlap<=12) console.log('  overlap: "'+unrot[i].t.slice(0,28)
              +'" vs "'+unrot[j].t.slice(0,28)+'" in '+stOver.view
              +(stOver.seqTask?'/'+stOver.seqTask:'')+'@'+W+'x'+H);
            if(badOverlap<3) worstNote='overlap: "'+unrot[i].t.slice(0,24)
              +'" vs "'+unrot[j].t.slice(0,24)+'" in '+stOver.view+'@'+W+'x'+H; }
        }
        /* no data curve may cross a legend's text box */
        for(const L of LEGEND_RECTS){
          for(let s2=0;s2<POLY_SEGS.length;s2+=4){
            const x0=POLY_SEGS[s2],y0=POLY_SEGS[s2+1],
                  x1=POLY_SEGS[s2+2],y1=POLY_SEGS[s2+3];
            if(Math.max(x0,x1)<L.x||Math.min(x0,x1)>L.x+L.w||
               Math.max(y0,y1)<L.y||Math.min(y0,y1)>L.y+L.h) continue;
            badOverlap++;
            console.log('  legend-cross in '+stOver.view
              +(stOver.seqTask?'/'+stOver.seqTask:'')+'@'+W+'x'+H
              +' rect '+fmt(L.x,0)+','+fmt(L.y,0)+' '+fmt(L.w,0)+'x'+fmt(L.h,0)
              +' seg '+fmt(x0,0)+','+fmt(y0,0)+'-'+fmt(x1,0)+','+fmt(y1,0));
            if(worstNote==='') worstNote='curve through legend in '+stOver.view;
            break;
          }
        }
      }
    }
    ok(badEnt===0,'no HTML entity or tag reaches a canvas text op ('+badEnt
       +') '+worstNote);
    ok(badText===0,'no text leaves the canvas at any size ('+badText+') '+worstNote);
    ok(badOverlap===0,'no text-on-text or curve-through-legend collisions ('
       +badOverlap+') '+worstNote);
  }
  { /* readout/eqbar/tag are clean HTML for every view and task */
    let bad=0;
    for(const [vk] of TABS){
      for(const tk of ['dart','needle']){
        Object.assign(ST,DEFAULTS,{view:vk,task:tk});
        if(fnnActive().step===0) fnnAdvance(fnnActive(),5);
        for(const sq of vk==='rnn'?['stream','wave','digits']:['stream']){
          ST.seqTask=sq;
          const M=buildModel();
          const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
          if(html.indexOf('NaN')>=0||html.indexOf('Infinity')>=0) bad++;
          if(/\bobject Object\b/.test(html)) bad++;
        }
      }
    }
    ok(bad===0,'no NaN/Infinity/object-Object in any readout/eqbar/tag');
    /* containment with a value no other row can supply (Known-bad: vacuous
       containment) — the tuned 2-16-1 has (2+1)*16 + (16+1)*1 = 65 params,
       recomputed by hand here, printed only by the parameters row */
    Object.assign(ST,DEFAULTS); resetFnn();
    ok(netFlatten(fnnActive().net).length===65,
       'the tuned dart net really has 65 parameters');
    ok(readoutHTML(buildModel()).indexOf('>65<')>=0,
       'the readout prints the parameter count off the built net'); }
  { /* equal aspect: the dartboard panel is a SQUARE (a circle drawn into a
       rectangle is a different picture — Known-bad, Rayleigh-Taylor mesas),
       and the drawn true-circle's own bbox is square to a fraction of a
       percent at several canvas sizes. */
    for(const [W,H] of [[1400,820],[1100,712],[820,560]]){
      Object.assign(ST,DEFAULTS);
      const M=buildModel();
      const R=recCtx(W,H);
      drawView(R.c,W,H,M);
      ok(DART_BOX&&Math.abs(DART_BOX.w-DART_BOX.h)<1e-9&&DART_BOX.w>150,
         'dartboard panel is square at '+W+'x'+H+' ('+fmt(DART_BOX.w,0)+' px)');
      /* the circle is the first polyline drawn in this view: 128 segments */
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(let i=0;i<128*4&&i<POLY_SEGS.length;i+=4){
        x0=Math.min(x0,POLY_SEGS[i]); x1=Math.max(x1,POLY_SEGS[i+2]);
        y0=Math.min(y0,POLY_SEGS[i+1]); y1=Math.max(y1,POLY_SEGS[i+3]);
      }
      const asp=(x1-x0)/Math.max(1e-9,(y1-y0));
      ok(Math.abs(asp-1)<0.02,'the drawn circle is round at '+W+'x'+H
         +' (aspect '+fmt(asp,3)+')');
    }
  }

  /* ---- 13. parked sessions, measured presets, digit-honest readout --- */
  { /* (a) sessions PARK and RESUME: two interruptions === one straight run */
    Object.assign(ST,DEFAULTS); resetAllSessions();
    const a=fnnActive();
    ok(['arch','act','opt','lr'].every(k=>DEFAULTS[k]===TUNED.dart.cfg[k]),
       'DEFAULTS carry the tuned dartboard preset — the page opens tuned');
    ok(ARCHS.some(o=>o.id===TUNED.dart.cfg.arch)&&ARCHS.some(o=>o.id===TUNED.needle.cfg.arch)
       &&ACT_LIST.some(o=>o.id===TUNED.dart.cfg.act)&&ACT_LIST.some(o=>o.id===TUNED.needle.cfg.act)
       &&OPT_LIST.some(o=>o.id===TUNED.dart.cfg.opt)&&OPT_LIST.some(o=>o.id===TUNED.needle.cfg.opt)
       &&LR_LIST.some(o=>o.id===TUNED.dart.cfg.lr)&&LR_LIST.some(o=>o.id===TUNED.needle.cfg.lr),
       'every TUNED entry is a value the chips can actually show');
    fnnAdvance(a,40);
    switchTask('needle');
    const b=fnnActive();
    ok(b!==a&&b.task==='needle'&&b.step===0,'needle gets its own fresh session');
    ok(ST.opt===TUNED.needle.cfg.opt&&ST.arch===TUNED.needle.cfg.arch
       &&ST.act===TUNED.needle.cfg.act&&ST.lr===TUNED.needle.cfg.lr,
       'auto-tune starts the fresh needle on ITS measured preset (RMSprop)');
    fnnAdvance(b,25);
    switchTask('dart');
    ok(fnnActive()===a&&a.step===40,'the dart session came back untouched');
    ok(ST.opt===TUNED.dart.cfg.opt&&ST.lr===TUNED.dart.cfg.lr,
       'and the panel re-adopted the dart settings');
    switchTask('needle');
    ok(fnnActive()===b&&b.step===25,'the needle session came back untouched');
    switchTask('dart');
    fnnAdvance(fnnActive(),40);
    const straight=fnnSessionNew(a.cfg);
    fnnAdvance(straight,80);
    ok(netBatchLoss(a.net,a.data.X,a.data.Y)
       ===netBatchLoss(straight.net,straight.data.X,straight.data.Y),
       'interrupted twice, the run is BIT-IDENTICAL to one straight 80-step run');
    /* (b) eta is a LIVE knob (the polish move): changing it must NOT
       restart, it must retarget the running optimizer and the session's
       cfg, so a later task round-trip re-adopts the annealed eta */
    ST.lr=0.03;
    ok(fnnActive()===a&&a.step===80,
       'changing eta does NOT restart — eta is live (the polish knob)');
    ok(a.opt.lr===0.03&&a.cfg.lr===0.03,
       'and the running optimizer + cfg follow the new eta immediately');
    ST.lr=TUNED.dart.cfg.lr; fnnActive();
    /* every OTHER setting still restarts, and only THIS task */
    ST.opt='sgd';
    const a2=fnnActive();
    ok(a2!==a&&a2.step===0,
       'changing the optimizer restarts — its state is per-rule');
    ok(SESS.fnn.needle===b&&b.step===25,'while the needle net keeps its progress');
    ok(fnnActive()===a2,'unchanged settings never recreate a session');
    ST.lr=0.03; fnnActive();
    /* a MANUAL session must survive the round-trip.  For a TUNED session the
       auto-tune fallback happens to rebuild the same settings, so a dropped
       cfg-adoption is invisible — the 64-mutant sweep proved it by letting
       exactly that mutant survive.  A parked sgd/0.03 dart run is the case
       that tells the two apart: resume must beat the preset. */
    fnnAdvance(fnnActive(),7);
    const aMan=fnnActive();
    switchTask('needle');
    ok(fnnActive()===b,'the needle stayed parked through the manual dart work');
    switchTask('dart');
    ok(fnnActive()===aMan&&aMan.step===7&&ST.opt==='sgd'&&ST.lr===0.03,
       'a MANUAL session survives the round-trip and re-adopts its own '
       +'settings — resume beats the preset'); }
  { /* (c) auto-tune off: a fresh task inherits the panel settings instead */
    Object.assign(ST,DEFAULTS,{autoTune:false}); resetAllSessions();
    ST.arch='4'; ST.act='sigmoid'; ST.opt='sgd'; ST.lr=0.3;
    switchTask('needle');
    ok(ST.arch==='4'&&ST.opt==='sgd','auto-tune off: fresh needle keeps manual settings');
    ok(fnnActive().cfg.opt==='sgd'&&fnnActive().cfg.arch==='4',
       'and the session was genuinely built from them'); }
  { /* (d) the race parks per task too */
    Object.assign(ST,DEFAULTS); resetAllSessions();
    const r0=raceActive(); raceAdvance(r0,30);
    switchTask('needle');
    ok(raceActive()!==r0,'the needle race is its own session');
    switchTask('dart');
    ok(raceActive()===r0&&r0.step===30,'the dart race resumed where it parked');
    ST.arch='4';
    ok(raceActive()!==r0&&raceActive().step===0,
       'an architecture change restarts the race — its key watches settings too');
    raceAdvance(raceActive(),5);
    ST.lr=0.3;
    ok(raceActive().step===0,
       'and an eta change DOES restart the race (unlike the live FNN eta) — '
       +'four rules at one shared eta from one init is the controlled '
       +'experiment, so its conditions are pinned'); }
  { /* (e) "reset nets" replays the SAME runs from each session's own cfg */
    Object.assign(ST,DEFAULTS); resetAllSessions();
    const a=fnnActive(); fnnAdvance(a,30);
    const l30=netBatchLoss(a.net,a.data.X,a.data.Y);
    switchTask('needle'); fnnAdvance(fnnActive(),12);
    replayNets();
    switchTask('dart');
    const a2=fnnActive();
    ok(a2.step===0,'reset nets rewound the dart run');
    fnnAdvance(a2,30);
    ok(netBatchLoss(a2.net,a2.data.X,a2.data.Y)===l30,
       'and it replays bit-identically'); }
  { /* (e2) the polish move measurably works.  Measured (deno, seed 3, this
       exact sequence): hot jitter SD 0.1006 over 20 single steps at eta
       0.1, cooled SD 0.00246 at eta 0.003 (x41 quieter), polished
       |pi-err| 0.0437 — the frozen value sits at the finite-data floor
       (~0.04 for 512 dots), which the flicker was hiding.  Bounds carry
       cross-libm margins. */
    Object.assign(ST,DEFAULTS); resetAllSessions();
    const s=fnnActive(); fnnAdvance(s,800);
    const hot=[];
    for(let i=0;i<20;i++){ fnnAdvance(s,1); hot.push(piFromNet('dart',s.net,48)); }
    ST.lr=0.003;
    fnnAdvance(fnnActive(),400);
    ok(fnnActive()===s&&s.step===1220,
       'polish kept the SAME session running (eta live), now at step 1220');
    const cool=[];
    for(let i=0;i<20;i++){ fnnAdvance(s,1); cool.push(piFromNet('dart',s.net,48)); }
    const sdOf=arr=>{ const m=arr.reduce((x,y)=>x+y,0)/arr.length;
      return Math.sqrt(arr.reduce((x,y)=>x+(y-m)*(y-m),0)/arr.length); };
    const sh=sdOf(hot), sc=sdOf(cool);
    ok(sh>0.03,'(sweep ref) hot eta rattles pi-hat (SD '+fmt(sh,4)
       +', measured 0.1006)');
    ok(sc<0.01&&sc<sh/5,'(sweep ref) cooling to 0.003 freezes it (SD '
       +fmt(sc,4)+', measured 0.0025) — the polish move works');
    ok(Math.abs(piFromNet('dart',s.net,200)-PI)<0.09,
       '(sweep ref) and the frozen boundary sits at the finite-data floor '
       +'(measured 0.0437), not off in the weeds'); }
  { /* (f) the sweep's winners, re-run here.  "(sweep ref)" = seed-3 rows of
       build_neural/sweep_results.txt (dart tuned: 95% at step 80, |pi-err|
       0.059@800; needle tuned: step 10, 0.00098; dart under the needle
       preset: step 250; needle under the dart preset: 0.084; the old 2-8-1
       adam 0.01 default: never reaches 95% on dart in 800).  Bounds carry
       libm-drift margins, not exact pins — a trajectory 800 steps long is
       runtime-flavoured. */
    function sweepTrain(task,cfg,steps){
      const st2=Object.assign({},DEFAULTS,cfg,{task});
      const data=taskData(task,st2.ntrain,st2.noise);
      const net=netNew(sizesOf(st2.arch),st2.act,st2.seed);
      const o=optNew(st2.opt,st2.lr);
      const rng=mulberry32(SEED_BATCH);
      const n=data.X.length,B=st2.batch;
      let steps95=null;
      for(let s=1;s<=steps;s++){
        const idx=[];
        for(let b2=0;b2<B;b2++) idx.push(Math.floor(rng()*n));
        const g=netGrads(net,data.X,data.Y,idx);
        netUnflatten(net,optStepFlat(o,netFlatten(net),gradsFlatten(g)));
        if(steps95===null&&s%10===0&&netAccuracy(net,data.X,data.Y)>=0.95)
          steps95=s;
      }
      return {net,data,steps95,
              piErr:Math.abs(piFromNet(task,net,100)-PI)};
    }
    { /* the loop above must BE the shipping path, or the pins pin nothing */
      const p=sweepTrain('dart',TUNED.dart.cfg,30);
      Object.assign(ST,DEFAULTS);
      const sess=fnnSessionNew(ST); fnnAdvance(sess,30);
      ok(netBatchLoss(p.net,p.data.X,p.data.Y)
         ===netBatchLoss(sess.net,sess.data.X,sess.data.Y),
         'sweepTrain is bit-identical to the shipping session path'); }
    const dartT=sweepTrain('dart',TUNED.dart.cfg,800);
    ok(dartT.steps95!==null&&dartT.steps95<=120,
       '(sweep ref) tuned dart reaches 95% by step 120 (measured 80; got '
       +dartT.steps95+')');
    ok(dartT.piErr<0.08,
       '(sweep ref) tuned dart |pi-err|@800 under 0.08 (measured 0.059; got '
       +fmt(dartT.piErr,4)+')');
    const needT=sweepTrain('needle',TUNED.needle.cfg,800);
    ok(needT.steps95!==null&&needT.steps95<=30,
       '(sweep ref) tuned needle reaches 95% by step 30 (measured 10; got '
       +needT.steps95+')');
    ok(needT.piErr<0.006,
       '(sweep ref) tuned needle |pi-err|@800 under 0.006 (measured 0.00098; '
       +'got '+fmt(needT.piErr,5)+')');
    const dartX=sweepTrain('dart',TUNED.needle.cfg,300);
    ok(dartX.steps95===null||dartX.steps95>180,
       '(sweep ref) the needle preset is NOT best for the dartboard '
       +'(95% at '+(dartX.steps95===null?'>300':dartX.steps95)
       +' vs '+dartT.steps95+' tuned — measured 250 vs 80)');
    const needX=sweepTrain('needle',TUNED.dart.cfg,800);
    ok(needX.piErr>0.05&&needT.piErr<needX.piErr/5,
       '(sweep ref) the dart preset is NOT best for the needles '
       +'(|pi-err| '+fmt(needX.piErr,4)+' vs '+fmt(needT.piErr,5)
       +' tuned — measured 0.084 vs 0.00098)');
    { /* the pre-tuning default never got the dartboard to 95% at all */
      const st2=Object.assign({},DEFAULTS,REF_CFG);
      const data=taskData('dart',st2.ntrain,st2.noise);
      const net=netNew(sizesOf(st2.arch),st2.act,st2.seed);
      const o=optNew(st2.opt,st2.lr);
      const rng=mulberry32(SEED_BATCH);
      let touched=false;
      for(let s=1;s<=400;s++){
        const idx=[];
        for(let b2=0;b2<32;b2++) idx.push(Math.floor(rng()*data.X.length));
        const g=netGrads(net,data.X,data.Y,idx);
        netUnflatten(net,optStepFlat(o,netFlatten(net),gradsFlatten(g)));
        if(s%10===0&&netAccuracy(net,data.X,data.Y)>=0.95) touched=true;
      }
      ok(!touched,'(sweep ref) the old default (2-8-1 adam 0.01) never touches '
         +'95% on the dartboard in 400 steps — tuning buys something real'); } }
  { /* (g) the long pi readout is digit-honest */
    ok(piLong(PI,12)==='3.141592653589',
       'piLong TRUNCATES pi — ...589, never rounded to ...590');
    ok(piLong(2/PI,12)==='0.636619772367',
       'piLong truncates 2/pi — 13th decimal 5 must not round the 12th up');
    ok(piLong(NaN,12)==='—','piLong refuses non-finite input');
    ok(piLong(3.272,12)==='3.272000000000',
       'an exact rational keeps its honest zero tail');
    ok(piTrueStr()==='3.14159265358979323846&hellip;',
       'the real-thing row is 20 spigot decimals, matching the Machin pin');
    { const m=piMatchParts(3.1415929999,12);
      ok(m.match==='3.141592'&&m.rest==='999900',
         'piMatchParts splits at the first wrong digit (got "'
         +m.match+'"/"'+m.rest+'")'); }
    { const m=piMatchParts(2.7,12);
      ok(m.match===''&&m.str==='2.700000000000',
         'a wrong leading digit matches nothing'); }
    { const m=piMatchParts(PI,12);
      ok(m.rest===''&&m.match==='3.141592653589',
         'a perfect estimate is all match — Math.PI truncated equals the spigot'); }
    Object.assign(ST,DEFAULTS); resetAllSessions();
    const html=readoutHTML(buildModel());
    ok(html.indexOf('3.14159265358979323846')>=0,
       'the dartboard readout carries the 20-decimal real thing');
    ok(html.indexOf('dimtail')>=0,
       'and the green-match/dim-tail split is really rendered');
    ok(buildModel().isTuned===true&&html.indexOf('tuned for this task')>=0,
       'the preset row reports tuned when the cfg IS the preset');
    ST.opt='sgd';
    ok(buildModel().isTuned===false,
       'and reports manual when ANY of the four tuned fields differs');
    ST.opt=TUNED.dart.cfg.opt;
    /* the counting row at the fixed data seed: 394 of 512 inside, so the
       printed estimate must be exactly 4*394/512 = 3.078125, truncated long */
    ok(html.indexOf('078125000000')>=0,
       'counting-the-labels row prints the exact rational 3.078125 long');
    /* the integrating row must quote the HONEST 200 grid, not the live 48:
       assert containment of the fine value's post-match digit run, which
       differs from the coarse one on this untrained net */
    { const fine=piMatchParts(piFromNet('dart',fnnActive().net,QUAD_N_FINAL),12);
      const coarse=piMatchParts(piFromNet('dart',fnnActive().net,QUAD_N),12);
      ok(fine.rest!==coarse.rest&&fine.rest.length>6,
         'the two quadrature grids disagree in the printed digits here');
      ok(html.indexOf(fine.rest)>=0,
         'integrating-the-net row prints the 200-grid value');
      ok(html.indexOf(coarse.rest)<0,
         'and not the coarse 48-grid one'); }
    /* the averaged row: an EMA over the pi-history cadence, recomputed here
       with the LITERAL 0.05 so the shipped constant is pinned absolutely */
    { Object.assign(ST,DEFAULTS); resetAllSessions();
      const s2=fnnActive(); fnnAdvance(s2,200);
      let ema=null;
      for(const p of s2.hist.pi) ema=ema===null?p[1]:ema+0.05*(p[1]-ema);
      ok(s2.hist.pi.length>10&&s2.hist.pi.length<900,
         'short run: the pi history is undecimated, so the recompute is exact');
      rel(s2.piAvg,ema,1e-12,
          'piAvg is exactly the 0.05-EMA of the recorded pi history');
      ok(readoutHTML(buildModel()).indexOf('averaged')>=0,
         'and the readout carries the averaged row'); } }

  /* leave the page state exactly as a fresh boot expects it */
  Object.assign(ST,DEFAULTS);
  resetAllSessions();

  console.log(pass+' passed, '+fail+' failed  ('
    +((Date.now()-T0)/1000).toFixed(1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
