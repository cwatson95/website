/* ================================================================== *
 *  dispatch + scene                                                   *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.clearRect(0,0,W,H);
  const v=M.st.view;
  if(v==='portrait') drawPortrait(ctx,W,H,M,S);
  else if(v==='shift') drawShiftView(ctx,W,H,M,S);
  else if(v==='width') drawWidthView(ctx,W,H,M,S);
  else if(v==='gain') drawGainView(ctx,W,H,M,S);
  else if(v==='inv') drawInv(ctx,W,H,M,S);
  else if(v==='mani') drawMani(ctx,W,H,M,S);
  else if(v==='bundle') drawBundle(ctx,W,H,M,S);
  else if(v==='ray') drawRay(ctx,W,H,M,S);
  else if(v==='classes') drawClasses(ctx,W,H,M,S);
  else if(v==='laws') drawLaws(ctx,W,H,M,S);
  else drawFront(ctx,W,H,M,S);
}
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.30,0.66,5.0,[0,0,0]);
  let M=null;
  const S={
    st, cam, W:1200, H:800,
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    pointer(kind,d){
      if(kind!=='move') return;
      if(st.view==='mani'){
        cam.theta-=d.dx*0.006;
        cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
        return;
      }
      st.lp=clamp(st.lp+d.dx*0.0022,LP0,LP1); S.rebuild();
    },
    wheel(dy){
      if(st.view==='mani'){
        cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),2.2,18);
        return;
      }
      st.lp=clamp(st.lp+dy*0.0004,LP0,LP1); S.rebuild();
    },
    resetMarker(){ st.lp=Math.log10(3.0); S.rebuild(); },
    resetView(){ cam.theta=-0.30; cam.phi=0.66; cam.dist=5.0; },
    step(dt){
      if(st.anim){
        let t=(st.lp-LP0)/(LP1-LP0); t+=dt*st.speed*0.12;
        if(t>1) t-=1;
        st.lp=LP0+t*(LP1-LP0); S.rebuild();
      }
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{width:S.W,height:S.H};
      const Wd=r.width||S.W, Hd=r.height||S.H;
      S.W=Wd; S.H=Hd; cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}

/* ================================================================== *
 *  view G — the manifold:  the law as a state SURFACE                 *
 *                                                                     *
 *  s depends on the state u alone, w on (u, C): the universal         *
 *  equation is the graph C(s, w) — a spindle in (w, s, C)-space,      *
 *  pinched at the two conservation corners (u = 1: (Dxkin, 1/sqrt2)   *
 *  for EVERY C;  u = 0: (0, sqrt(G/2))).  Fixed-C sections are the    *
 *  planar diagrams: C = 2*Dxkin IS the observable-EOS ellipse — the   *
 *  dimensional limiting case, exactly as T-S / P-V are sections of    *
 *  the steam dome.  The gain chart lifts z = ln(Psi*Phi*s/w)          *
 *  instead: the sheet the product law sweeps, pinned at ln(Psi*SQ).   *
 *  The measured triples CLIMB across members (C_rec 1.95 -> 2.95 /    *
 *  the same climb in Psi on the gain sheet): the width anomaly as a   *
 *  path on the manifold.  Unlike steam there is NO generating         *
 *  potential behind this surface (parent_law.tex Sec. II.C sign       *
 *  obstruction); its Gibbsian sector is the u-coordinate.             *
 * ================================================================== */
const MANI={
  wLo:0.0, wHi:1.25,
  sLo:0.68, sHi:0.96,
  cLo:1.4, cHi:4.0,
  gLo:Math.log(0.5), gHi:Math.log(8.0),
  nC:14,
};
function maniYs(gain){          // the yhat rows of the mesh (0 = corner)
  if(gain) return [0].concat(TAB.phi.yh);        // table-exact rows only
  const ys=[0];
  for(let i=0;i<32;i++) ys.push(0.05*Math.pow(30/0.05,i/31));
  ys.push(-1);                                   // -1 flags the u=0 corner row
  return ys;
}
function maniCs(){
  const Cs=[]; for(let k=0;k<MANI.nC;k++)
    Cs.push(MANI.cLo+(MANI.cHi-MANI.cLo)*k/(MANI.nC-1));
  return Cs;
}
/* one mesh vertex: [w, s, z] at (yhat row value, C) */
function maniVert(yv,Cv,st){
  if(yv<0)  return [0, Math.sqrt(st.G/2), Cv];             // hydro corner row
  if(yv===0){
    if(st.maniGain) return [DXKIN, Math.SQRT1_2, Math.log(st.Psi*SQ)];
    return [DXKIN, Math.SQRT1_2, Cv];                      // Doppler corner
  }
  const sv=sOf(yv,st.G);
  const wv=wOf(yv,Cv);
  if(st.maniGain) return [wv, sv, Math.log(st.Psi*phiOf(yv)*sv/wv)];
  return [wv, sv, Cv];
}
function maniMesh(st){
  const ys=maniYs(st.maniGain), Cs=maniCs(), rows=[];
  for(const yv of ys){
    const r=[];
    for(const Cv of Cs) r.push(maniVert(yv,Cv,st));
    rows.push(r);
  }
  return {ys,Cs,rows};
}
function maniBox(st,p){         // (w,s,z) -> [-1,1]^3, z up
  const zLo=st.maniGain?MANI.gLo:MANI.cLo, zHi=st.maniGain?MANI.gHi:MANI.cHi;
  return [ 2*(p[0]-MANI.wLo)/(MANI.wHi-MANI.wLo)-1,
           2*(p[1]-MANI.sLo)/(MANI.sHi-MANI.sLo)-1,
           2*(clamp(p[2],zLo,zHi)-zLo)/(zHi-zLo)-1 ];
}
function path3(ctx,cam,B,pts,col,lw,dash){
  ctx.save(); ctx.beginPath();
  let started=false;
  for(const p of pts){
    const q=project(cam,B,p);
    if(!q){ started=false; continue; }
    if(!started){ ctx.moveTo(q.x,q.y); started=true; } else ctx.lineTo(q.x,q.y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.5;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}
/* the measured path on the manifold (chart-aware z) */
function maniDataPath(st,M){
  const out=[];
  for(const r of M.inv)
    out.push([r.w, r.s, st.maniGain?Math.log(r.g):r.C, r.P]);
  return out;
}
/* the on-surface footprint of a measured row, at the row's own yhat:
   chart A — the s-gap to the footprint is the Gamma_rec deviation
   (F = (2Dx/C)^2 yh^2 (G - Gamma_rec), <= 2% — the thermodynamic tier's
   closure drawn as a stalk); chart B — the lift above the Psi = 1 sheet
   is ln(Psi_rec) up to the same tiny s-ratio. */
function maniFoot(st,r){
  const sv=sOf(r.yh,st.G);
  if(st.maniGain)
    return [r.w, sv, Math.log(st.Psi*phiOf(r.yh)*sv/r.w)];
  return [r.w, sv, r.C];
}
/* Averbakh's own effective member: C_eff(yhat) read back from ITS width */
function maniAvbPath(st){
  const m=TAB.models['266'], nuref=nurefOf(TAB.cons.lam266_nm), out=[];
  for(let i=0;i<m.P.length;i++){
    const wr=m.avb.w[i]/nuref, sr=m.avb.nu[i]/nuref;
    const yv=yhOf(m.P[i],TAB.cons.lam266_nm);
    const z=st.maniGain?Math.log(m.avb.g[i]/G0of(m.P[i],TAB.cons.lam266_nm))
                       :cRec(wr,yv);
    out.push([wr,sr,z]);
  }
  return out;
}
function drawMani(ctx,W,H,M,S){
  const st=M.st, cam=S.cam, B=camBasis(cam);
  const zLo=st.maniGain?MANI.gLo:MANI.cLo, zHi=st.maniGain?MANI.gHi:MANI.cHi;
  const bx=p=>maniBox(st,p);
  // ---- the box, back edges first ------------------------------------
  const C1=[-1,1], edges=[];
  for(const a of C1)for(const b of C1){
    edges.push([[a,b,-1],[a,b,1]]); edges.push([[a,-1,b],[a,1,b]]); edges.push([[-1,a,b],[1,a,b]]);
  }
  edges.sort((e,f)=>{
    const me=v3.mul(v3.add(e[0],e[1]),0.5), mf=v3.mul(v3.add(f[0],f[1]),0.5);
    return v3.len(v3.sub(mf,B.eye))-v3.len(v3.sub(me,B.eye));
  });
  for(const e of edges) path3(ctx,cam,B,e,'#1c2130',1);
  // axis ticks + labels
  ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle=CMUT;
  ctx.textAlign='center'; ctx.textBaseline='top';
  const tick=(p3,txtS)=>{ const q=project(cam,B,p3); if(q) ctx.fillText(plain(txtS),q.x,q.y+4); };
  for(const wv of [0.25,0.5,0.75,1.0]){
    const x=2*(wv-MANI.wLo)/(MANI.wHi-MANI.wLo)-1;
    path3(ctx,cam,B,[[x,-1,-1],[x,-1.06,-1]],'#39404f',1);
    tick([x,-1.14,-1],fmt(wv,2));
  }
  for(const sv of [0.72,0.80,0.88]){
    const y=2*(sv-MANI.sLo)/(MANI.sHi-MANI.sLo)-1;
    path3(ctx,cam,B,[[1,y,-1],[1.06,y,-1]],'#39404f',1);
    tick([1.16,y,-1],fmt(sv,2));
  }
  const zt=st.maniGain?[0.5,1,2,4,8].map(v=>[Math.log(v),fmt(v,v<1?1:0)])
                      :[1.4,2,2.6,3.2,3.8].map(v=>[v,fmt(v,1)]);
  for(const [zv,lab] of zt){
    const z=2*(zv-zLo)/(zHi-zLo)-1;
    path3(ctx,cam,B,[[-1,-1,z],[-1.05,-1.05,z]],'#39404f',1);
    tick([-1.13,-1.13,z],lab);
  }
  const lab3=(p3,txtS,col,fnt)=>{ const q=project(cam,B,p3);
    if(q){ ctx.fillStyle=col||'#8b93a6'; ctx.font=fnt||'italic 12px Georgia, serif';
           ctx.fillText(plain(txtS),q.x,q.y); } };
  lab3([0,-1.34,-1],'width  w');
  lab3([1.45,0,-1],'shift  s');
  lab3([-1.45,-1.45,0.55],st.maniGain?'gain  g  (ln axis)':'kinetic  C');
  // ---- wall shadows: the planar diagrams as limiting cases ----------
  const mesh=M.mani;
  const floorOf=p=>[p[0],p[1],zLo], backOf=p=>[p[0],MANI.sHi,p[2]];
  const shadow=(pts,mapf,col,lw,dash)=>
    path3(ctx,cam,B,pts.map(p=>bx(mapf(p))),col,lw,dash);
  const memberPts=C=>{
    const out=[];
    for(const yv of mesh.ys) out.push(maniVert(yv,C,st));
    return out;
  };
  // floor shadows only: the planar diagrams as the surface's shadow.
  // (back-wall shadows projected onto a nearly edge-on face and read as
  // floating artifacts beside the surface — removed after the raster pass.)
  shadow(memberPts(2*DXKIN),floorOf,rgba('#e8843a',0.35),1.1,[6,4]);
  shadow(memberPts(st.C),floorOf,rgba('#b8ec4c',0.30),1.1);
  const dpath=maniDataPath(st,M);
  if(st.showData) shadow(dpath,floorOf,rgba('#f2f4f8',0.30),1.0,[2,3]);
  void backOf;
  // ---- the surface (painter, opaque, centroid-expanded) -------------
  const quads=[];
  for(let i=0;i<mesh.rows.length-1;i++)
    for(let j=0;j<mesh.Cs.length-1;j++){
      const q=[mesh.rows[i][j],mesh.rows[i][j+1],mesh.rows[i+1][j+1],mesh.rows[i+1][j]]
              .map(bx);
      const c=[(q[0][0]+q[2][0])/2,(q[0][1]+q[2][1])/2,(q[0][2]+q[2][2])/2];
      const n=v3.norm(v3.cross(v3.sub(q[1],q[0]),v3.sub(q[3],q[0])));
      const t=(clamp(mesh.rows[i][j][2],zLo,zHi)-zLo)/(zHi-zLo);
      quads.push({q,c,n,t,d:v3.len(v3.sub(c,B.eye))});
    }
  quads.sort((a,b)=>b.d-a.d);
  const L=v3.norm([0.42,0.3,0.85]);
  for(const Q of quads){
    const pts=[];
    let ok2=true;
    for(const p of Q.q){ const s2=project(cam,B,p); if(!s2){ ok2=false; break; } pts.push(s2); }
    if(!ok2) continue;
    const cx=(pts[0].x+pts[1].x+pts[2].x+pts[3].x)/4;
    const cy=(pts[0].y+pts[1].y+pts[2].y+pts[3].y)/4;
    const lam=Math.abs(v3.dot(Q.n,L));
    ctx.fillStyle=shade(neonCss(Q.t),0.28+0.52*lam);
    ctx.beginPath();
    for(let k2=0;k2<4;k2++){          // expand about the centroid: seam guard
      const X=cx+(pts[k2].x-cx)*1.035, Y=cy+(pts[k2].y-cy)*1.035;
      if(k2===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath(); ctx.fill();
  }
  // ---- iso-C members + the special sections -------------------------
  for(const Cv of mesh.Cs)
    path3(ctx,cam,B,memberPts(Cv).map(bx),'rgba(7, 11, 24,0.35)',0.8);
  path3(ctx,cam,B,memberPts(2*DXKIN).map(bx),'#e8843a',1.6,[6,4]);
  path3(ctx,cam,B,memberPts(7/3).map(bx),'rgba(242,244,248,0.6)',1.0);
  if(st.C>=MANI.cLo&&st.C<=MANI.cHi)
    path3(ctx,cam,B,memberPts(st.C).map(bx),'#b8ec4c',2.2);
  // ---- the two conservation corners ---------------------------------
  for(const [pt,lab,dy] of [
      [maniVert(0,(MANI.cLo+MANI.cHi)/2,st),'Doppler corner (theorem)',28],
      [st.maniGain?null:maniVert(-1,(MANI.cLo+MANI.cHi)/2,st),
       'sound corner  s = √(Γ/2)',16]]){
    if(!pt) continue;
    const q=project(cam,B,bx(pt));
    if(!q) continue;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(q.x,q.y,3.8,0,TAU); ctx.fill();
    ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#aeb6c6'; ctx.font='10px -apple-system,sans-serif';
    if(st.maniGain){ ctx.textAlign='left'; ctx.fillText(plain(lab),q.x+8,q.y+18); }
    else{ ctx.textAlign='right'; ctx.fillText(plain(lab),q.x-8,q.y+dy); }
    ctx.textAlign='left';
  }
  // ---- Averbakh's effective member ----------------------------------
  if(st.showAvb)
    path3(ctx,cam,B,maniAvbPath(st).map(bx),'#e8843a',1.4,[3,3]);
  // ---- the measured path: the anomaly climbing the members ----------
  if(st.showData){
    path3(ctx,cam,B,dpath.map(bx),'#6b7284',1.1);
    for(let k2=0;k2<dpath.length;k2++){
      const p=dpath[k2], r=M.inv[k2];
      const q=project(cam,B,bx(p));
      if(!q) continue;
      const f=maniFoot(st,r), qf=project(cam,B,bx(f));
      if(qf){                     // the drop-stalk to the on-surface footprint
        ctx.strokeStyle=rgba('#f2f4f8',0.55); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(qf.x,qf.y); ctx.stroke();
        ctx.fillStyle=rgba('#f2f4f8',0.5);
        ctx.beginPath(); ctx.arc(qf.x,qf.y,1.8,0,TAU); ctx.fill();
      }
      const hot=Math.abs(Math.log(p[3]/M.Pm))<0.02;
      ctx.fillStyle=hot?CM:'#f2f4f8'; ctx.beginPath(); ctx.arc(q.x,q.y,3.6,0,TAU); ctx.fill();
      ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#aeb6c6'; ctx.font='9.5px -apple-system,sans-serif';
      ctx.textAlign='left';                 // stagger: 5/6 atm nearly coincide
      ctx.fillText(p[3]+' atm',q.x+6,q.y+(k2%2?13:-5));
    }
  }
  // ---- the marker on the slider member ------------------------------
  { const ym=M.mk.yh;
    const q=project(cam,B,bx(maniVert(ym,clamp(st.C,MANI.cLo,MANI.cHi),st)));
    if(q){ ctx.fillStyle=CM; ctx.beginPath(); ctx.arc(q.x,q.y,4.5,0,TAU); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.1; ctx.stroke(); } }
  // ---- captions -----------------------------------------------------
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 12px Georgia, serif'; ctx.textAlign='left';
  ctx.fillText(plain(st.maniGain?'the gain sheet  z = ln(Ψ·Φ(ŷ)·s/w)'
                                :'the spindle  C(s, w)'),14,34);
  caption(ctx,14,H-72,(st.maniGain
    ?'The product-law sheet: members are state curves, pinned at ln(Ψ·√(π/2e)). '
     +'Stalks above the Ψ = 1 sheet = ln Ψ_rec (0.95 → 1.40): the same climb '
     +'as the C chart — one anomaly, two tiers.'
    :'Fixed-C sections are the planar diagrams — orange dashes: the ellipse '
     +'member 2Δx_kin; green: the C slider. White path: the data climbing '
     +'members (the width anomaly); stalks: the Γ-tier float (≤1.8%); dotted '
     +'orange: Averbakh, arcing to C_eff ≈ 3.9. Pump-blind in reduced units.'),
    W*0.38,'#767e92');
}

/* ================================================================== *
 *  view H — the bundle:  gas class as the BASE of the law            *
 *                                                                     *
 *  The inversion IS the bundle projection: pi(s,w,g) = (Gamma, C,     *
 *  Psi) forgets the state and keeps the material data, and its        *
 *  fibres are the state curves swept by u.  As an abstract bundle it  *
 *  is trivial (u is a global fibre coordinate); the CONTENT is the    *
 *  embedding -- at u = 1 every fibre over every base point collapses  *
 *  to (Dxkin, 1/sqrt2), so the image is a CONE with the Doppler       *
 *  corner as apex (class-blind, verified 1.1e-16), while the hydro    *
 *  rim s = sqrt(Gamma/2) resolves the classes over a 25% spread.      *
 *                                                                     *
 *  The base is STRATIFIED, not a smooth manifold: monatomic is a      *
 *  POINT (no internal mode -> zero-width window, bit-exact), diatomic *
 *  a SEGMENT traversed by rotational relaxation, polyatomic a segment *
 *  that itself walks with pressure (the measured c0 moves).  Hence    *
 *  the headline, computed in make_bundle_tables.py: Kr's isotherm is  *
 *  a FIBRE (base point fixed to 0.02 sigma) while SF6's is a SECTION  *
 *  (6.5 sigma of base motion) -- the same picture, two objects.       *
 *  And Kr's width anomaly is VERTICAL base motion: Gamma_rec holds    *
 *  while C_rec climbs 1.95 -> 2.95.                                   *
 * ================================================================== */
const CLSCOL={monatomic:'#5ac8e0', diatomic:'#b8ec4c', polyatomic:'#cd35c4'};
const BGASES=['Kr','Ar','N2','SF6'];
const BB={gLo:0.70, gHi:1.78, cLo:1.40, cHi:3.20};

/* the fibre over a base point, in reduced observables */
function bundleFibre(G,C,n){
  const out=[];
  for(let i=0;i<=(n||60);i++){
    const yh=0.05*Math.pow(30/0.05,i/(n||60));
    out.push([wOf(yh,C), sOf(yh,G)]);
  }
  return out;
}
/* the measured (Gamma_rec, C_rec) base points — C_rec only where widths
   exist (Kr, SF6); N2/Ar contribute Gamma alone (no width data). */
function baseMeasured(gas,M){
  const rows=TABB.base[gas], out=[];
  const inv=gas==='Kr'?M.inv:(gas==='SF6'?TAB.inv.sf6:null);
  for(const r of rows){
    let C=null;
    if(inv){ const m=inv.find(q=>Math.abs(q.P-r.P)<1e-6); if(m) C=m.C; }
    out.push({P:r.P, G:r.G, dG:r.dG, C, lo:r.lo, hi:r.hi});
  }
  return out;
}

function drawBundle(ctx,W,H,M,S){
  const st=M.st;
  const bl=box(74,54,Math.max(400,(W-460)*0.52),H-176);
  // ---------------- panel A: the base (minisuperspace) -------------
  axes(ctx,bl,BB.gLo,BB.gHi,BB.cLo,BB.cHi,{
    title:'the base: one point per gas class  (Γ, C)',
    xlab:'Γ  — the thermodynamic tier', ylab:'C  — the kinetic tier',
    xticks:[0.8,1.0,1.2,1.4,1.6].concat([5/3]), xfmt:t=>fmt(t,2),
    yticks:[1.4,1.8,2.2,2.6,3.0], yfmt:t=>fmt(t,1)});
  const AX=g=>bl.x+bl.w*(g-BB.gLo)/(BB.gHi-BB.gLo);
  const AY=c=>bl.y1-bl.h*(c-BB.cLo)/(BB.cHi-BB.cLo);
  // the counted strata (clipped: SF6's window reaches past the left edge)
  const DYS=7;                      // counted bar sits DYS px above the dots
  if(st.showAnchors) clipBox(ctx,bl,()=>{
    for(const gas of BGASES){
      const S2=TABB.strata[gas], col=CLSCOL[S2.cls];
      const y=AY(S2.C)-DYS;
      if(S2.hi-S2.lo<1e-12){                    // a POINT: monatomic
        ctx.strokeStyle=col; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(AX(S2.lo),y-9); ctx.lineTo(AX(S2.lo),y+9); ctx.stroke();
      }else{                                     // a SEGMENT
        ctx.strokeStyle=rgba(col,0.75); ctx.lineWidth=6;
        ctx.beginPath(); ctx.moveTo(AX(S2.lo),y); ctx.lineTo(AX(S2.hi),y); ctx.stroke();
        ctx.strokeStyle=col; ctx.lineWidth=1.2;
        for(const g2 of [S2.lo,S2.hi]){
          ctx.beginPath(); ctx.moveTo(AX(g2),y-7); ctx.lineTo(AX(g2),y+7); ctx.stroke(); }
      }
      if(S2.C_rot!=null){                        // the rotation-RELAXED C
        ctx.strokeStyle=rgba(col,0.5); ctx.lineWidth=1.2; ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.moveTo(AX(S2.lo),y); ctx.lineTo(AX(S2.lo),AY(S2.C_rot));
        ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle=col; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(AX(S2.lo)-7,AY(S2.C_rot));
        ctx.lineTo(AX(S2.lo)+7,AY(S2.C_rot)); ctx.stroke();
        txt(ctx,AX(S2.lo)+10,AY(S2.C_rot)+3,'+η_b/η (rot relaxed)',rgba(col,0.85),
            '9px -apple-system,sans-serif');
      }
    }
  });
  // the ideal monatomic corner
  txt(ctx,AX(5/3),bl.y+14,'5/3',CMUT,'9.5px -apple-system,sans-serif','center');
  polyline(ctx,bl,[5/3,5/3],[BB.cLo,BB.cHi],BB.gLo,BB.gHi,BB.cLo,BB.cHi,
           rgba('#f2f4f8',0.18),1,[2,4]);
  // the measured base points.  EVERYTHING here is clipped: argon's bar is
  // +-2.1 in Gamma -- wider than the whole panel -- and unclipped it drew
  // straight across the neighbouring panel (the project's Known-bad rule).
  let arOff=0;
  if(st.showData) clipBox(ctx,bl,()=>{
    for(const gas of BGASES){
      const col=CLSCOL[TABB.strata[gas].cls], pts=baseMeasured(gas,M);
      const Cfall=TABB.strata[gas].C;
      let prev=null;
      for(const p of pts){
        if(gas==='Kr'&&p.P===1) continue;          // the 1-atm outlier
        if(p.G<BB.gLo||p.G>BB.gHi){ if(gas==='Ar') arOff++; continue; }
        const X=AX(p.G), Y=AY(p.C==null?Cfall:p.C);
        if(p.lo!=null&&p.hi!=null&&p.hi-p.lo>1e-9){
          // THIS row's own counted window: for SF6 it walks with P, which a
          // single reference-pressure bar cannot show
          ctx.strokeStyle=rgba(col,0.28); ctx.lineWidth=4;
          ctx.beginPath(); ctx.moveTo(AX(p.lo),Y); ctx.lineTo(AX(p.hi),Y);
          ctx.stroke();
        }
        if(p.dG>0.02){                             // the propagated Γ bar
          ctx.strokeStyle=rgba(col,gas==='Ar'?0.5:0.75); ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(AX(p.G-p.dG),Y); ctx.lineTo(AX(p.G+p.dG),Y);
          ctx.stroke();
        }
        if(prev&&p.C!=null){                       // the walk, in order of P
          ctx.strokeStyle=rgba(col,0.5); ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(prev[0],prev[1]); ctx.lineTo(X,Y); ctx.stroke();
        }
        if(p.C!=null) prev=[X,Y];
        if(gas==='Ar'){ ctx.fillStyle=rgba(col,0.55);
          ctx.beginPath(); ctx.arc(X,Y,2.2,0,TAU); ctx.fill(); }
        else dot(ctx,X,Y,3.4,p.C==null?rgba(col,0.75):col);
      }
    }
  });
  if(arOff) txt(ctx,bl.x+8,bl.y1-10,'argon: '+arOff+' of '
    +TABB.base.Ar.length+' rows lie OFF this panel (Γ_rec to 8.5) and its '
    +'bars are ±'+fmt(TABB.base.Ar.reduce((a,r)=>a+r.dG,0)
      /TABB.base.Ar.length,1)+' — 0.1-GHz read-offs cannot arbitrate',
    rgba(CLSCOL.monatomic,0.75),'9.5px -apple-system,sans-serif');
  // labels
  // class labels: RIGHT-aligned inside the panel.  Anchored to the stratum's
  // right end they overran into the neighbouring panel's tick column (the
  // monatomic strata sit at Gamma = 1.66, hard against the right edge).
  for(const [gas,dy] of [['Kr',-12],['N2',-11],['SF6',-12],['Ar',14]]){
    const S2=TABB.strata[gas];
    txt(ctx,bl.x1-6,AY(S2.C)+dy,
      gas+' · '+S2.cls+(S2.mode==='none'?' (point)':' ('+S2.mode+')'),
      CLSCOL[S2.cls],'italic 10.5px Georgia, serif','right');
  }
  caption(ctx,bl.x+8,bl.y+8,'thick bars (offset up) = the counted Γ window; '
    +'dots = measured (Γ_rec, C_rec) with the propagated Γ bar. Kr holds Γ and '
    +'climbs in C — its width anomaly is VERTICAL base motion. SF₆ walks '
    +'diagonally: a section — and the faint band at each of its rows is '
    +'THAT row’s own window, which walks with it. N₂/Ar have no widths, so '
    +'they sit at their counted C.',bl.w*0.52,'#767e92');

  // ---------------- panel B: the fibres (the cone) -----------------
  const br=box(bl.x1+72,54,Math.max(280,W-bl.x1-72-330),H-176);
  // ylo reaches BELOW SF6's hydro rim (0.677) -- at 0.68 it was
  // clamped onto the axis and read as a floor artifact
  const xlo=0,xhi=1.25,ylo=0.655,yhi=0.96;
  axes(ctx,br,xlo,xhi,ylo,yhi,{
    title:'the fibres over it: a cone on the Doppler corner',
    xlab:'reduced width  w', ylab:'reduced shift  s'});
  const BX=v=>br.x+br.w*(v-xlo)/(xhi-xlo), BY=v=>br.y1-br.h*(v-ylo)/(yhi-ylo);
  // the hydro rim s = sqrt(Gamma/2), Gamma-resolved and C-blind
  if(st.showAnchors){
    const rl=Math.sqrt(BB.gLo/2), rh=Math.sqrt(BB.gHi/2);
    ctx.strokeStyle=rgba('#f2f4f8',0.25); ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(BX(0),BY(clamp(rl,ylo,yhi)));
    ctx.lineTo(BX(0),BY(clamp(rh,ylo,yhi))); ctx.stroke();
    txt(ctx,BX(0)+8,BY(Math.min(yhi,rh))-6,'the hydro rim  s = √(Γ/2) — class-RESOLVED',
        '#aeb6c6','9.5px -apple-system,sans-serif');
  }
  // one fibre per class, at its counted (Gamma, C)
  for(const gas of ['SF6','N2','Kr']){
    const S2=TABB.strata[gas], col=CLSCOL[S2.cls];
    const G=(S2.lo+S2.hi)/2;
    const f=bundleFibre(G,S2.C);
    clipBox(ctx,br,()=>polyline(ctx,br,f.map(p=>p[0]),f.map(p=>p[1]),
      xlo,xhi,ylo,yhi,col,2.0));
    if(S2.hi-S2.lo>1e-9){        // the class's whole window = a ribbon
      for(const g2 of [S2.lo,S2.hi]){
        const f2=bundleFibre(g2,S2.C);
        clipBox(ctx,br,()=>polyline(ctx,br,f2.map(p=>p[0]),f2.map(p=>p[1]),
          xlo,xhi,ylo,yhi,rgba(col,0.45),1.0,[4,3]));
      }
    }
    const rim=Math.sqrt(((S2.lo+S2.hi)/2)/2);
    dot(ctx,BX(0),BY(clamp(rim,ylo,yhi)),3.4,col);
    txt(ctx,BX(0)+10,BY(clamp(rim,ylo,yhi))+(gas==='SF6'?15:-6),gas,col,
        'italic 10.5px Georgia, serif');
  }
  // the apex: class-blind, exact
  const ax=BX(DXKIN), ay=BY(Math.SQRT1_2);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ax,ay,4.4,0,TAU); ctx.fill();
  ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
  txt(ctx,ax-8,ay-16,'the apex: every class, one point','#aeb6c6',
      '9.5px -apple-system,sans-serif','right');
  // SF6's section: its fibres at the four rows' OWN Gamma
  if(st.showData){
    for(const r of TABB.base.SF6){
      const f=bundleFibre(r.G,TABB.strata.SF6.C);
      clipBox(ctx,br,()=>polyline(ctx,br,f.map(p=>p[0]),f.map(p=>p[1]),
        xlo,xhi,ylo,yhi,rgba(CLSCOL.polyatomic,0.30),1.0));
    }
    const sec=[];
    for(const r of TABB.base.SF6){
      const yh=r.yh, C=TABB.strata.SF6.C;
      sec.push([wOf(yh,C), sOf(yh,r.G)]);
    }
    clipBox(ctx,br,()=>polyline(ctx,br,sec.map(p=>p[0]),sec.map(p=>p[1]),
      xlo,xhi,ylo,yhi,'#fff',1.6));
    for(const p of sec) dot(ctx,BX(p[0]),BY(p[1]),3.0,'#f2f4f8');
    txt(ctx,BX(sec[3][0])+7,BY(sec[3][1])+4,'SF₆: a SECTION (crosses fibres)',
        '#f2f4f8','9.5px -apple-system,sans-serif');
    // Kr's data: one fibre, Gamma fixed
    const kp=[];
    for(const r of M.inv) kp.push([r.w,r.s]);
    clipBox(ctx,br,()=>polyline(ctx,br,kp.map(p=>p[0]),kp.map(p=>p[1]),
      xlo,xhi,ylo,yhi,rgba(CLSCOL.monatomic,0.9),1.4));
    for(const p of kp) dot(ctx,BX(p[0]),BY(p[1]),3.0,CLSCOL.monatomic);
    txt(ctx,BX(kp[0][0])-8,BY(kp[0][1])-8,'Kr: a FIBRE',CLSCOL.monatomic,
        '9.5px -apple-system,sans-serif','right');
  }
  const fs=TABB.fibsec;
  caption(ctx,br.x+8,br.y1-92,'Kr’s base point moves '+fs.Kr.sig
    +'σ (a fibre); SF₆’s moves '+fs.SF6.sig+'σ (a section). '
    +'Every class shares the apex — which is why the corner measures '
    +'nothing and the classes only separate toward the sound end.',
    br.w-20,'#767e92');
}

/* ================================================================== *
 *  view I — the ray:  the parent law in its SIMPLEST form            *
 *                                                                     *
 *  Rearranged into excess coordinates the whole universal equation    *
 *  is a straight line through the origin:                             *
 *                                                                     *
 *      X = yhat^2                (the state)                          *
 *      Y = (Dxkin/w)^2 - 1       (the width excess)                   *
 *      Y = kappa X,  kappa = (2 Dxkin / C)^2                          *
 *                                                                     *
 *  one material constant per gas, exact to 1e-12 (check D7).  The     *
 *  anomaly is then simply that the measured points do NOT lie on a    *
 *  ray: kappa_eff = Y/X drifts -- and Kr's FALLS while SF6's RISES,   *
 *  so they leave the ideal ray in OPPOSITE directions (D8), which no  *
 *  common instrumental broadening produces.                           *
 *                                                                     *
 *  The lower right panel is why SF6 cannot arbitrate: Gamma - 2 s^2   *
 *  is the distance to the DEGENERATE locus Gamma = 1, where the       *
 *  shift is pinned at 1/sqrt2 for every collisionality.  SF6 reaches  *
 *  4.9e-4 of it, making state-from-shift 46x worse conditioned than   *
 *  krypton's -- for the polyatomic stratum the state is not readable  *
 *  from the observables at all, and every SF6 number leans on the     *
 *  viscosity-derived yhat, which is an INPUT (checks D5-D6).          *
 * ================================================================== */
const RAYC={Kr:'#5ac8e0', SF6:'#cd35c4', N2:'#b8ec4c'};

function drawRay(ctx,W,H,M,S){
  const st=M.st, R=TABB.ray;
  const bl=box(74,54,Math.max(380,(W-470)*0.50),H-176);
  // ---------------- panel A: the ray law, log-log ------------------
  const xlo=Math.log10(0.30), xhi=Math.log10(200);
  const ylo=Math.log10(0.30), yhi=Math.log10(300);
  axes(ctx,bl,xlo,xhi,ylo,yhi,{
    title:'the law as a RAY:  Y = κ X',
    xlab:'X = ŷ²   (the state)', ylab:'Y = (Δx_kin/w)² − 1   (width excess)',
    xticks:[-0.5,0,0.5,1,1.5,2], xfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0),
    yticks:[-0.5,0,0.5,1,1.5,2], yfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0)});
  const PX=v=>bl.x+bl.w*(Math.log10(v)-xlo)/(xhi-xlo);
  const PY=v=>bl.y1-bl.h*(Math.log10(v)-ylo)/(yhi-ylo);
  const ray=(k,col,lw,dash)=>clipBox(ctx,bl,()=>polyline(ctx,bl,
    [xlo,xhi],[Math.log10(k)+xlo,Math.log10(k)+xhi],
    xlo,xhi,ylo,yhi,col,lw,dash));
  // the ideal (Boltzmann C = 7/3) ray, and each gas's counted ray
  ray(R.kap_ideal,'#f2f4f8',1.6,[6,4]);
  txt(ctx,PX(1.05),PY(1.05*R.kap_ideal)-9,'ideal  κ = '+fmt(R.kap_ideal,3)
    +'  (C = 7/3)','#aeb6c6','9.5px -apple-system,sans-serif');
  if(st.showAnchors) for(const g of ['Kr','SF6'])
    ray(R.gases[g].kap_counted,rgba(RAYC[g],0.40),1.1,[2,4]);
  // the measured points, joined in pressure order
  if(st.showData) for(const g of ['Kr','SF6']){
    const pts=R.gases[g].pts, col=RAYC[g];
    clipBox(ctx,bl,()=>polyline(ctx,bl,pts.map(p=>Math.log10(p.X)),
      pts.map(p=>Math.log10(p.Y)),xlo,xhi,ylo,yhi,rgba(col,0.6),1.2));
    for(const p of pts){
      const X=PX(p.X), Y=PY(p.Y);
      if(p.dY){ ctx.strokeStyle=rgba(col,0.8); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(X,PY(Math.max(0.31,p.Y-p.dY)));
        ctx.lineTo(X,PY(p.Y+p.dY)); ctx.stroke(); }
      dot(ctx,X,Y,3.6,col);
    }
    const l=pts[pts.length-1];
    txt(ctx,PX(l.X)+8,PY(l.Y)+4,g,col,'italic 11px Georgia, serif');
  }
  caption(ctx,bl.x+8,bl.y1-52,'every closed-form member is a RAY THROUGH THE '
    +'ORIGIN of slope κ = (2Δx_kin/C)² — exact to 1e-12. The whole anomaly '
    +'is that the data do not ride one: krypton starts 43% above the ideal '
    +'ray and crosses down; SF₆ starts ON it and climbs away.',
    bl.w-20,'#767e92');

  // ---------------- panel B (top): the drift, kappa_eff/kappa_ideal
  const bx=bl.x1+72, bw=Math.max(250,W-bl.x1-72-330), bh=(H-218)/2;
  const bt=box(bx,54,bw,bh-14);
  const plo=Math.log10(0.8), phi=Math.log10(17);
  axes(ctx,bt,plo,phi,0.45,1.75,{
    title:'the drift:  κ_eff / κ_ideal', xlab:'', ylab:'Z of the kinetic tier',
    // no x labels here: the panel below shares this axis and carries them,
    // and at this stacking they landed on that panel's title
    xticks:[1,2,4,8,16].map(Math.log10), xfmt:()=>'',
    yticks:[0.6,0.8,1.0,1.2,1.4,1.6], yfmt:t=>fmt(t,1)});
  polyline(ctx,bt,[plo,phi],[1,1],plo,phi,0.45,1.75,'#f2f4f8',1.4,[6,4]);
  txt(ctx,bt.x+6,bt.y1-bt.h*(1-0.45)/1.30-5,'the ideal ray',
      '#aeb6c6','9px -apple-system,sans-serif');
  for(const g of ['Kr','SF6']){
    const pts=R.gases[g].pts, col=RAYC[g];
    const xs=pts.map(p=>Math.log10(p.P)), ys=pts.map(p=>p.kap/R.kap_ideal);
    clipBox(ctx,bt,()=>polyline(ctx,bt,xs,ys,plo,phi,0.45,1.75,col,1.8));
    for(let i=0;i<pts.length;i++)
      dot(ctx,bt.x+bt.w*(xs[i]-plo)/(phi-plo),
          bt.y1-bt.h*(clamp(ys[i],0.45,1.75)-0.45)/1.30,3.4,col);
    txt(ctx,bt.x+bt.w*(xs[0]-plo)/(phi-plo)+(g==='Kr'?6:-6),
        bt.y1-bt.h*(clamp(ys[0],0.45,1.75)-0.45)/1.30+(g==='Kr'?-8:14),
        g+' '+(R.gases[g].trend==='rising'?'↗':'↘'),col,
        'italic 11px Georgia, serif',g==='Kr'?'left':'right');
  }
  caption(ctx,bt.x+8,bt.y+8,'OPPOSITE directions — krypton falls ×'
    +fmt(R.gases.Kr.k0/R.gases.Kr.k1,2)+', SF₆ rises ×'
    +fmt(R.gases.SF6.k1/R.gases.SF6.k0,2)
    +'. A common instrumental broadening cannot do that.',bw-20,'#767e92');

  // ---------------- panel B (bottom): the degeneracy ---------------
  const bb=box(bx,54+bh+30,bw,bh-14);
  const dlo=-4, dhi=0.2;
  axes(ctx,bb,plo,phi,dlo,dhi,{
    title:'why SF₆ cannot arbitrate:  Γ − 2s²',
    xlab:'P  [atm]  (log axis)', ylab:'distance to Γ = 1  (log)',
    xticks:[1,2,4,8,16].map(Math.log10), xfmt:t=>fmt(Math.pow(10,t),0),
    yticks:[-4,-3,-2,-1,0], yfmt:t=>'10^'+t});
  for(const g of ['Kr','N2','SF6']){
    const rows=TABB.degen[g].rows, col=RAYC[g];
    const xs=[],ys=[];
    for(const r of rows){ if(r.den<=0) continue;
      xs.push(Math.log10(r.P)); ys.push(Math.log10(r.den)); }
    clipBox(ctx,bb,()=>polyline(ctx,bb,xs,ys,plo,phi,dlo,dhi,col,1.8));
    for(let i=0;i<xs.length;i++)
      dot(ctx,bb.x+bb.w*(xs[i]-plo)/(phi-plo),
          bb.y1-bb.h*(clamp(ys[i],dlo,dhi)-dlo)/(dhi-dlo),3.0,col);
    txt(ctx,bb.x+bb.w*(xs[0]-plo)/(phi-plo)+6,
        bb.y1-bb.h*(clamp(ys[0],dlo,dhi)-dlo)/(dhi-dlo)-6,g,col,
        'italic 10.5px Georgia, serif');
  }
  const dsf=TABB.degen.SF6.rows[TABB.degen.SF6.rows.length-1];
  const dkr=TABB.degen.Kr.rows[TABB.degen.Kr.rows.length-1];
  // lower-LEFT: the only region of this panel no curve reaches (Kr/N2 sit
  // high, SF6 low-right), so the prose does not lie across the data
  caption(ctx,bb.x+8,bb.y+bb.h*0.52,'at Γ = 1 the shift is PINNED at 1/√2 '
    +'for every collisionality. SF₆ closes to '+dsf.den.toExponential(1)
    +' of it: state-from-shift is '+fmt(dsf.rel/dkr.rel,0)+'× worse '
    +'conditioned than krypton’s, so for the polyatomic stratum the state '
    +'is NOT an observable — every SF₆ number leans on the '
    +'viscosity-derived ŷ, an input.',bb.w*0.55,'#767e92');
}

/* ================================================================== *
 *  view J — the classes: each stratum against what its data support  *
 *                                                                     *
 *  MONATOMIC (Kr): propagating the tabulated width errors gives       *
 *  kappa_eff bars of 19-41%.  Against those a CONSTANT fits the       *
 *  3-6 atm rows at chi2/dof = 0.15 and the trend is 0.64 sigma -- so  *
 *  the "C_rec rising 1.95 -> 2.95" reading is NOT supported.  What is *
 *  supported is an OFFSET: 3.85 sigma below the ideal ray, C = 2.86   *
 *  +- 0.19 against 7/3 (+23%), constant in state.  A constant         *
 *  instrumental width is falsified (E6-E7).                           *
 *  DIATOMIC (N2): no widths exist.  Rotation relaxed vs frozen        *
 *  separates the prediction by 9% -> 30% over 2-6 atm; the shift data *
 *  already favour relaxed.  The decisive missing measurement.         *
 *  POLYATOMIC (SF6): real-gas density explains 69% of its rise with   *
 *  zero free parameters, and what is left brackets the ideal ray --   *
 *  but there are no width bars, so no chi2 here is honest.            *
 * ================================================================== */
function drawClasses(ctx,W,H,M,S){
  const st=M.st, C=TABC;
  // gap must clear the ROTATED y-axis label of the next column (~46 px);
  // at 30 it overran into the previous panel, which the audit cannot see
  const n=3, gap=64, w3=Math.max(190,(W-430-2*gap)/n), y0=58, hh=H-258;
  const KI=C.meta.kap_ideal;

  /* ---- column 1: MONATOMIC -------------------------------------- */
  const b1=box(74,y0,w3,hh);
  const m=C.mono, WS=m.wspace.p36, WB=m.wspace.boot;
  // the w-space constant expressed as a kappa band, for drawing
  const kOf=cc=>Math.pow(2*DXKIN/cc,2);
  axes(ctx,b1,Math.log10(1.6),Math.log10(7),0,1.75,{
    title:'monatomic (Kr): an OFFSET',
    xlab:'P  [atm]', ylab:'κ_eff  (kinetic tier)',
    xticks:[2,3,4,5,6].map(Math.log10), xfmt:t=>fmt(Math.pow(10,t),0),
    yticks:[0,0.5,1.0,1.5], yfmt:t=>fmt(t,1)});
  const X1=p=>b1.x+b1.w*(Math.log10(p)-Math.log10(1.6))
    /(Math.log10(7)-Math.log10(1.6));
  const Y1=v=>b1.y1-b1.h*clamp(v,0,1.75)/1.75;
  // the ideal ray and the fitted constant band
  polyline(ctx,b1,[Math.log10(1.6),Math.log10(7)],[KI,KI],
    Math.log10(1.6),Math.log10(7),0,1.75,'#f2f4f8',1.4,[6,4]);
  txt(ctx,b1.x+6,Y1(KI)-5,'ideal  κ = '+fmt(KI,3),'#aeb6c6','9px -apple-system,sans-serif');
  if(st.showAnchors){
    // the W-SPACE constant-C fit (the honest likelihood), shown as the
    // kappa band it implies -- NOT a kappa-space chi2, which overstates
    const kc=kOf(WS.C), khi=kOf(WS.lo), klo=kOf(WS.hi);
    ctx.fillStyle=rgba('#5ac8e0',0.16);
    ctx.fillRect(b1.x,Y1(khi),b1.w,Y1(klo)-Y1(khi));
    polyline(ctx,b1,[Math.log10(1.6),Math.log10(7)],[kc,kc],
      Math.log10(1.6),Math.log10(7),0,1.75,'#5ac8e0',1.6);
    txt(ctx,b1.x+6,Y1(kc)+14,'constant C, w-space:  χ²/dof = '
      +fmt(WS.chi2dof,2),'#5ac8e0','9px -apple-system,sans-serif');
  }
  for(const r of m.rows){
    const X=X1(r.P), Y=Y1(r.kap);
    ctx.strokeStyle=rgba('#5ac8e0',0.85); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X,Y1(r.kap-r.dkap)); ctx.lineTo(X,Y1(r.kap+r.dkap));
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X-3,Y1(r.kap-r.dkap)); ctx.lineTo(X+3,Y1(r.kap-r.dkap));
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X-3,Y1(r.kap+r.dkap)); ctx.lineTo(X+3,Y1(r.kap+r.dkap));
    ctx.stroke();
    // provenance: only the bootstrap rows carry genuine 1-sigma errors
    if(r.prov==='bootstrap') dot(ctx,X,Y,3.8,'#5ac8e0');
    else{
      ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(X,Y,3.8,0,TAU); ctx.stroke();
      ctx.fillStyle='#070b18';
      ctx.beginPath(); ctx.arc(X,Y,2.2,0,TAU); ctx.fill();
    }
  }
  txt(ctx,X1(2)+7,Y1(m.rows[0].kap)-9,'2 atm: digitized','#e8843a',
      '9px -apple-system,sans-serif');
  txt(ctx,X1(6)-7,Y1(m.rows[4].kap)-11,'6 atm: text','#e8843a',
      '9px -apple-system,sans-serif','right');
  txt(ctx,b1.x+6,b1.y+14,'filled = bootstrap 1σ · hollow = not',
      '#8b93a6','9px -apple-system,sans-serif');
  caption(ctx,b1.x+6,b1.y1+34,'fitted in w-space, where the quoted σ live. '
    +'A CONSTANT C fits at χ²/dof = '+fmt(WS.chi2dof,2)+', and a '
    +'2-parameter C(lnP) buys only Δχ² = '+fmt(WS.drift_dchi2,2)+' = '
    +fmt(WS.drift_sig,2)+'σ — THE DRIFT IS NOT RESOLVED. What is real is an '
    +'OFFSET: C = '+fmt(WS.C,2)+' ['+fmt(WS.lo,2)+', '+fmt(WS.hi,2)+'] vs '
    +'7/3, i.e. +'+fmt(WS.excess,0)+'% at '+fmt(WS.off_sig,2)+'σ ('
    +fmt(WB.off_sig,2)+'σ on the bootstrap rows alone).',b1.w,'#767e92');

  /* ---- column 2: DIATOMIC --------------------------------------- */
  const b2=box(b1.x1+gap,y0,w3,hh);
  const d=C.dia;
  axes(ctx,b2,Math.log10(0.85),Math.log10(7),1.2,3.6,{
    title:'diatomic (N₂): UNMEASURED',
    xlab:'P  [atm]', ylab:'predicted Δν  [GHz]',
    xticks:[1,2,3,4,6].map(Math.log10), xfmt:t=>fmt(Math.pow(10,t),0),
    yticks:[1.5,2.0,2.5,3.0,3.5], yfmt:t=>fmt(t,1)});
  const px=d.rows.map(r=>Math.log10(r.P));
  clipBox(ctx,b2,()=>{
    polyline(ctx,b2,px,d.rows.map(r=>r.relaxed),Math.log10(0.85),Math.log10(7),
      1.2,3.6,'#b8ec4c',2.0);
    polyline(ctx,b2,px,d.rows.map(r=>r.frozen),Math.log10(0.85),Math.log10(7),
      1.2,3.6,'#b8ec4c',1.4,[5,4]);
  });
  const X2=p=>b2.x+b2.w*(Math.log10(p)-Math.log10(0.85))
    /(Math.log10(7)-Math.log10(0.85));
  const Y2=v=>b2.y1-b2.h*(clamp(v,1.2,3.6)-1.2)/2.4;
  // the separation at 6 atm, drawn as the decisive gap
  const last=d.rows[d.rows.length-1];
  ctx.strokeStyle=rgba('#f2f4f8',0.7); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(X2(6),Y2(last.frozen)); ctx.lineTo(X2(6),Y2(last.relaxed));
  ctx.stroke();
  txt(ctx,X2(6)-8,(Y2(last.frozen)+Y2(last.relaxed))/2,
      fmt(last.sep,0)+'%','#f2f4f8','10px -apple-system,sans-serif','right');
  txt(ctx,X2(2.1),Y2(d.rows[1].relaxed)-8,'rotation RELAXED  (C = '
    +fmt(d.C_relaxed,2)+')','#b8ec4c','9px -apple-system,sans-serif');
  txt(ctx,X2(2.1),Y2(d.rows[1].frozen)+14,'FROZEN  (C = '+fmt(d.C_frozen,2)+')',
      rgba('#b8ec4c',0.75),'9px -apple-system,sans-serif');
  caption(ctx,b2.x+6,b2.y1+34,'N₂ has NO width data at all. Whether rotation '
    +'relaxes at ω_B (adding η_b/η = '+fmt(d.etab,2)+' to C) or is frozen '
    +'separates the prediction by '+fmt(d.rows[1].sep,0)+'% at 2 atm growing '
    +'to '+fmt(last.sep,0)+'% at 6 atm. Measure '+fmt(last.relaxed,2)
    +' vs '+fmt(last.frozen,2)+' GHz — the shift already favours relaxed.',
    b2.w,'#767e92');

  /* ---- column 3: POLYATOMIC ------------------------------------- */
  const b3=box(b2.x1+gap,y0,w3,hh);
  const p=C.poly;
  axes(ctx,b3,Math.log10(4.6),Math.log10(17),0.7,1.7,{
    title:'polyatomic (SF₆): mostly STATICS',
    xlab:'P  [atm]', ylab:'κ_eff  and  κ / (ρ_r/ρ_i)²',
    xticks:[5,8,11,15].map(Math.log10), xfmt:t=>fmt(Math.pow(10,t),0),
    yticks:[0.8,1.0,1.2,1.4,1.6], yfmt:t=>fmt(t,1)});
  const X3=p2=>b3.x+b3.w*(Math.log10(p2)-Math.log10(4.6))
    /(Math.log10(17)-Math.log10(4.6));
  const Y3=v=>b3.y1-b3.h*(clamp(v,0.7,1.7)-0.7)/1.0;
  polyline(ctx,b3,[Math.log10(4.6),Math.log10(17)],[KI,KI],
    Math.log10(4.6),Math.log10(17),0.7,1.7,'#f2f4f8',1.4,[6,4]);
  txt(ctx,b3.x+6,Y3(KI)-5,'ideal','#aeb6c6','9px -apple-system,sans-serif');
  const rawx=p.rows.map(r=>Math.log10(r.P));
  clipBox(ctx,b3,()=>{
    polyline(ctx,b3,rawx,p.rows.map(r=>r.kap),Math.log10(4.6),Math.log10(17),
      0.7,1.7,'#cd35c4',2.0);
    polyline(ctx,b3,rawx,p.kap_cor,Math.log10(4.6),Math.log10(17),
      0.7,1.7,'#cd35c4',1.6,[5,4]);
  });
  for(let i=0;i<p.rows.length;i++){
    dot(ctx,X3(p.rows[i].P),Y3(p.rows[i].kap),3.4,'#cd35c4');
    dot(ctx,X3(p.rows[i].P),Y3(p.kap_cor[i]),3.0,rgba('#cd35c4',0.6));
  }
  txt(ctx,X3(11.4)+6,Y3(p.rows[2].kap)-8,'raw  ↗×'+fmt(p.raw_rise,2),
      '#cd35c4','9px -apple-system,sans-serif');
  txt(ctx,X3(8.4)-6,Y3(p.kap_cor[1])+14,'÷(ρ_real/ρ_ideal)²',
      rgba('#cd35c4',0.85),'9px -apple-system,sans-serif','right');
  caption(ctx,b3.x+6,b3.y1+34,'real-gas density alone — ZERO free parameters '
    +'— removes '+fmt(100*p.frac,0)+'% of the log-rise (×'+fmt(p.raw_rise,2)
    +' → ×'+fmt(p.cor_rise,2)+'), and what is left brackets the ideal ray '
    +'('+fmt(p.cor_vs_ideal[0],2)+' → '+fmt(p.cor_vs_ideal[3],2)+'). But '
    +'CF_TABLES carries NO width errors for SF₆, so no χ² here is honest — '
    +'and its state is unreadable anyway.',b3.w,'#767e92');

  caption(ctx,74,H-34,'Each class against what ITS data support — one law, '
    +'three different measurement situations.',W-430,'#767e92');
}

/* ================================================================== *
 *  view K — the gas laws: the SBS analogues of Boyle / Charles /     *
 *  Avogadro / the combined law, each a simple proportionality        *
 *                                                                     *
 *  Written all session as                                             *
 *     [(Dxkin/w)^2-1](Gamma-2s^2) = (2Dxkin/C)^2 (2s^2-1)             *
 *  the parent law LOOKS complicated.  Define the two excess           *
 *  coordinates -- both vanish at the Doppler corner --                *
 *     A = (Dxkin/w)^2 - 1            the WIDTH excess                 *
 *     B = (2s^2-1)/(Gamma - 2s^2)    the SHIFT excess                 *
 *  and it is a straight line through the origin:                      *
 *     LAW I    B = yhat^2                 (exact, any Gamma)          *
 *     LAW II   A = kappa yhat^2           (exact, kappa = (2Dxk/C)^2) *
 *     LAW III  A = kappa B                THE GAS LAW, state gone     *
 *     LAW IV   g w / s = Psi Phi(yhat)    gain from the other two     *
 *  with the classical limits as named corollaries:                    *
 *     BOYLE    dnu * P -> const  (w yhat -> C/2)                      *
 *     CHARLES  (Gamma - 2s^2) P^2 -> const                            *
 *     AVOGADRO yhat ∝ P lambda / (eta sqrt T)                         *
 *  Z = A/(kappa_ideal B) is the compressibility factor.               *
 * ================================================================== */
function drawLaws(ctx,W,H,M,S){
  const st=M.st, L=TABL, KI=L.laws.kap_ideal;
  // the row gap must clear a 5-line caption under the top row (~110 px);
  // at 72 it ran into the LAW III title beneath it
  const gap=58, w2=Math.max(230,(W-430-gap)/2), hh=(H-320)/2, y0=56;
  const rowgap=112;

  /* ---- panel 1: LAW I, the sound law  B = yhat^2 ---------------- */
  const b1=box(74,y0,w2,hh);
  const lo=Math.log10(0.05), hi=Math.log10(120);
  axes(ctx,b1,lo,hi,lo,hi,{
    title:'LAW I  (sound):   B = ŷ²',
    xlab:'ŷ²   (state, from η)', ylab:'B = (2s²−1)/(Γ−2s²)',
    xticks:[-1,0,1,2], xfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0),
    yticks:[-1,0,1,2], yfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0)});
  clipBox(ctx,b1,()=>polyline(ctx,b1,[lo,hi],[lo,hi],lo,hi,lo,hi,
    '#f2f4f8',1.6,[6,4]));
  txt(ctx,b1.x+b1.w*0.52,b1.y+b1.h*0.40,'B = ŷ²  (exact)','#aeb6c6',
      '9.5px -apple-system,sans-serif');
  const GC={Kr:'#5ac8e0',N2:'#b8ec4c',SF6:'#cd35c4',Ar:'#e8843a'};
  if(st.showData) for(const g of ['Kr','N2','SF6','Ar']){
    const rows=L.gases[g].rows.filter(r=>r.B!=null&&r.B>0);
    clipBox(ctx,b1,()=>{
      polyline(ctx,b1,rows.map(r=>Math.log10(r.X)),
        rows.map(r=>Math.log10(r.B)),lo,hi,lo,hi,rgba(GC[g],0.55),1.2);
    });
    for(const r of rows){
      const X=b1.x+b1.w*(Math.log10(r.X)-lo)/(hi-lo);
      const Y=b1.y1-b1.h*(Math.log10(r.B)-lo)/(hi-lo);
      if(Math.log10(r.B)<lo||Math.log10(r.B)>hi) continue;
      dot(ctx,X,Y,3.2,GC[g]);
    }
    const last=rows[rows.length-1];
    if(last&&Math.log10(last.B)>lo&&Math.log10(last.B)<hi)
      txt(ctx,b1.x+b1.w*(Math.log10(last.X)-lo)/(hi-lo)+6,
          b1.y1-b1.h*(Math.log10(last.B)-lo)/(hi-lo)
            +(g==='Ar'?13:g==='N2'?-6:3),g,GC[g],
          'italic 10px Georgia, serif');
  }
  caption(ctx,b1.x+6,b1.y1+32,'needs only the SHIFT — testable on every gas, '
    +'including the three with no widths. Kr rides it to 1%; N₂ reads 1.21 '
    +'(its shift wants a higher Γ); SF₆ blows up ×87 and Ar scatters.',
    b1.w,'#767e92');

  /* ---- panel 2: LAW II, the narrowing law  A = kappa yhat^2 ----- */
  const b2=box(b1.x1+gap,y0,w2,hh);
  axes(ctx,b2,lo,hi,lo,hi,{
    title:'LAW II  (narrowing):   A = κ ŷ²',
    xlab:'ŷ²   (state, from η)', ylab:'A = (Δx_kin/w)² − 1',
    xticks:[-1,0,1,2], xfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0),
    yticks:[-1,0,1,2], yfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0)});
  clipBox(ctx,b2,()=>polyline(ctx,b2,[lo,hi],
    [lo+Math.log10(KI),hi+Math.log10(KI)],lo,hi,lo,hi,'#f2f4f8',1.6,[6,4]));
  txt(ctx,b2.x+b2.w*0.30,b2.y+b2.h*0.30,'A = κ ŷ²,  κ = (2Δx/C)²','#aeb6c6',
      '9.5px -apple-system,sans-serif');
  if(st.showData) for(const g of ['Kr','SF6']){
    const rows=L.gases[g].rows.filter(r=>r.A!=null&&r.A>0);
    clipBox(ctx,b2,()=>polyline(ctx,b2,rows.map(r=>Math.log10(r.X)),
      rows.map(r=>Math.log10(r.A)),lo,hi,lo,hi,rgba(GC[g],0.6),1.4));
    for(const r of rows){
      const X=b2.x+b2.w*(Math.log10(r.X)-lo)/(hi-lo);
      const Y=b2.y1-b2.h*(Math.log10(r.A)-lo)/(hi-lo);
      dot(ctx,X,Y,3.4,GC[g]);
    }
    const last=rows[rows.length-1];
    txt(ctx,b2.x+b2.w*(Math.log10(last.X)-lo)/(hi-lo)-7,
        b2.y1-b2.h*(Math.log10(last.A)-lo)/(hi-lo)-7,g,GC[g],
        'italic 10px Georgia, serif','right');
  }
  caption(ctx,b2.x+6,b2.y1+32,'needs the WIDTH, so only Kr and SF₆ can test '
    +'it. Its deep-hydro corollary is SBS BOYLE: w·ŷ → C/2, i.e. '
    +'Δν·P = const — the 1/P collisional narrowing, whose constant IS the '
    +'kinetic tier C.',b2.w,'#767e92');

  /* ---- panel 3: LAW III, THE gas law  A = kappa B --------------- */
  const b3=box(74,y0+hh+rowgap,w2,hh);
  axes(ctx,b3,lo,hi,lo,hi,{
    title:'LAW III  (THE gas law):   A = κ B',
    xlab:'B = (2s²−1)/(Γ−2s²)   — shift alone',
    ylab:'A = (Δx_kin/w)² − 1   — width alone',
    xticks:[-1,0,1,2], xfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0),
    yticks:[-1,0,1,2], yfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0)});
  clipBox(ctx,b3,()=>polyline(ctx,b3,[lo,hi],
    [lo+Math.log10(KI),hi+Math.log10(KI)],lo,hi,lo,hi,'#f2f4f8',1.6,[6,4]));
  txt(ctx,b3.x+b3.w*0.44,b3.y+b3.h*0.50,'A = κ B   (ideal κ = '
    +fmt(KI,3)+')','#aeb6c6','9.5px -apple-system,sans-serif');
  if(st.showData) for(const g of ['Kr','SF6']){
    const rows=L.gases[g].rows.filter(r=>r.A!=null&&r.B!=null&&r.B>0);
    clipBox(ctx,b3,()=>polyline(ctx,b3,rows.map(r=>Math.log10(r.B)),
      rows.map(r=>Math.log10(r.A)),lo,hi,lo,hi,rgba(GC[g],0.6),1.4));
    for(const r of rows){
      const X=b3.x+b3.w*(Math.log10(r.B)-lo)/(hi-lo);
      const Y=b3.y1-b3.h*(Math.log10(r.A)-lo)/(hi-lo);
      if(Math.log10(r.B)<lo) continue;
      dot(ctx,X,Y,3.4,GC[g]);
    }
  }
  caption(ctx,b3.x+6,b3.y1+32,'the state ELIMINATED: the two measured '
    +'frequencies alone, two material constants (Γ, κ). The PV = nRT of '
    +'the theory; Z = A/(κ_ideal·B) is its compressibility factor.',
    b3.w,'#767e92');

  /* ---- panel 4: the dictionary ---------------------------------- */
  const b4=box(b3.x1+gap,y0+hh+rowgap,w2,hh);
  frame(ctx,b4,'#242a3a');
  txt(ctx,b4.x,b4.y-8,'the dictionary','#aeb6c6','italic 13px Georgia, serif');
  let yy=b4.y+20;
  const line=(a,b,col)=>{
    txt(ctx,b4.x+10,yy,a,col||'#8b93a6','10.5px -apple-system,sans-serif');
    txt(ctx,b4.x1-10,yy,b,'#cfd4de','10.5px -apple-system,sans-serif','right');
    yy+=19;
  };
  line('classical','SBS','#6f7789');
  yy+=3;
  line('PV = nRT','A = κ B','#b8ec4c');
  line('Boyle   PV = const','Δν · P = const');
  line('Charles  V/T = const','(Γ−2s²)·P² = const');
  line('Avogadro  V ∝ n','ŷ ∝ P λ / (η√T)');
  line('Gibbs–Duhem','g w / s = Ψ Φ(ŷ)');
  line('Z = PV/nRT','Z = A / (κ_ideal B)');
  yy+=6;
  txt(ctx,b4.x+10,yy,'the two corners are theorems:','#6f7789',
      '10px -apple-system,sans-serif'); yy+=17;
  line('Φ(0)  = √(2π/e)·Δx_kin','1.21823');
  line('Φ(∞) = 1/Γ','⇒  Γ g w = Ψ s');
  yy+=6;
  caption(ctx,b4.x+10,yy,'Both excess coordinates vanish at the Doppler '
    +'corner, so every law is anchored at the conservation corner by '
    +'construction — the SBS laws pass through the origin the way the '
    +'classical ones pass through absolute zero.',b4.w-24,'#767e92');

  caption(ctx,74,H-40,'The parent law is a straight line through the origin '
    +'once written in the excess coordinates; everything else on the other '
    +'tabs is this, in some projection.',W-430,'#767e92');
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['laws','the gas laws'],['portrait','the portrait'],['shift','the shift'],['width','the width'],
              ['gain','the gain'],['inv','the inversion'],['front','the frontier'],
              ['mani','the manifold'],['bundle','the bundle'],
              ['ray','the ray'],['classes','the classes']];
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value); st.preset='';
      val.textContent=fmtf(st[key]); S.rebuild(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); dirty=true; refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        S.rebuild(); syncChips(); syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }

  const gLam=h('div',{class:'grp'},h('h3',null,'the pump'));
  gLam.appendChild(chipRow(LAMS,'lam'));
  gLam.appendChild(h('div',{class:'src'},
    'the lever: ŷ ∝ λ at fixed P — 532 nm doubles every ŷ, walking the '
    +'y_B crossing from 6.3 to 3.2 atm. The Mironov points are 266 nm only.'));

  const gTier=h('div',{class:'grp'},h('h3',null,'the tier constants'));
  gTier.appendChild(chipRow(PRESETS,'preset',o=>{
    st.G=o.G; st.C=o.C; st.Psi=o.Psi; }));
  gTier.appendChild(slider('G','Γ · thermodynamic',1.0,1.8,0.001,v=>fmt(v,3)));
  gTier.appendChild(slider('C','𝒞 · kinetic',1.4,3.2,0.001,v=>fmt(v,3)));
  gTier.appendChild(slider('Psi','Ψ · conservation',0.7,1.5,0.005,v=>fmt(v,3)));
  gTier.appendChild(h('div',{class:'src'},
    'Kr forces all three: Γ = 5/3 (no internal modes), 𝒞 = 4/3 + (Γ−1)/Pr '
    +'= 7/3 (Boltzmann), Ψ = 1 (ideal statics, nkTκ_T = 1.004). The sliders '
    +'are the departure axes of the virial tier.'));

  const gMk=h('div',{class:'grp'},h('h3',null,'the marker + the velocity tier'));
  gMk.appendChild(slider('lp','marker P',LP0,LP1,0.002,v=>fmtP(Math.pow(10,v))+' atm'));
  gMk.appendChild(slider('beta','β · velocity',0,0.01,0.0001,v=>fmt(v,4)));
  gMk.appendChild(h('div',{class:'src'},
    'β = K(1−s) = a₂/2√π — the velocity-space second virial coefficient '
    +'(Kr ≈ 0.005 from the viscosity slope). It moves only <i>the frontier</i>: '
    +'in-window signal ≤ 1% against ±15% bars.'));

  const gDisp=h('div',{class:'grp'},h('h3',null,'display'));
  const dchecks=h('div',{class:'checks'},
    checkbox('showAvb','Averbakh (exact β = 0 solve)'),
    checkbox('showNS','Navier–Stokes'),
    checkbox('showData','the Mironov data'),
    checkbox('showAnchors','anchors & slope guides'),
    checkbox('showEq27','Eq-27 gain route'),
    checkbox('maniGain','manifold: gain sheet (z = ln g)'),
    checkbox('anim','animate the marker'));
  gDisp.appendChild(dchecks);
  gDisp.appendChild(slider('speed','speed',0.2,4,0.1,v=>fmt(v,1)+'×'));
  gDisp.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.resetMarker(); syncPanel(); dirty=true; refresh(); }},'marker → 3 atm'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuild();
                              syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gLam,gTier,gMk,gDisp,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    const cw=gTier.querySelector('.chips'); if(!cw) return;
    const cur=PRESETS.findIndex(o=>Math.abs(st.G-o.G)<1e-9&&Math.abs(st.C-o.C)<1e-9
      &&Math.abs(st.Psi-o.Psi)<1e-9);
    st.preset=cur>=0?PRESETS[cur].id:'';
    [].forEach.call(cw.children,(b,i)=>b.className='chip'+(PRESETS[i].id===st.preset?' on':''));
    const lw=gLam.querySelector('.chips');
    if(lw) [].forEach.call(lw.children,(b,i)=>b.className='chip'+(LAMS[i].id===st.lam?' on':''));
  }
  function syncPanel(){
    rows.speed.row.hidden=!st.anim;
    rows.beta.row.hidden=(st.view!=='front');
    for(const k in rows) rows[k].sync();
    [].forEach.call(dchecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showAvb','showNS','showData','showAnchors','showEq27',
                      'maniGain','anim'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent=st.view==='mani'
        ?'drag to orbit · scroll to zoom · space animates the marker · r resets'
        :'drag or scroll to move the pressure marker · space animates it · r sets 3 atm';
      subEl.innerHTML='MAE vs Mironov at (Γ, 𝒞, Ψ): shift <b>'+fmt(M.mae.S,1)
        +'%</b> · width <b>'+fmt(M.mae.W,1)+'%</b> · gain <b>'+fmt(M.mae.G,1)+'%</b>';
      infoEl.innerHTML=INFO[st.view]||INFO.portrait;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* marker moves must ask for a frame (steam_carnot Known-bad) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    rows.lp.sync(); dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY);
    rows.lp.sync(); dirty=true; },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetMarker(); S.resetView(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='9'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0, roT=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(st.anim||dirty){
      dirty=false;
      try{
        S.draw();
        roT+=dt;
        if(st.anim&&roT>0.2){ roT=0; roEl.innerHTML=S.readout(); tagEl.innerHTML=S.tag();
          rows.lp.sync(); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

function selfTest(){

  const ok=(c,n)=>{ if(c) pass++; else { failN++; console.log('FAIL — '+n); } };
  const close=(a,b,tol,n)=>ok(Math.abs(a-b)<=tol,n+' ('+a+' vs '+b+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a/b-1)<=t,n+' ('+a+' vs '+b+')');

  // ---- tables present and finite
  ok(TAB.phi.yh.length===17&&TAB.phi.phi.length===17,'Phi table: 17 columns');
  ok(TAB.models['266'].P.length===23&&TAB.models['532'].P.length===23,
     'model grids: 23 pressure nodes each');
  let fin=true;
  for(const key of ['266','532']) for(const mod of ['avb','ns'])
    for(const ch of ['nu','w','g'])
      for(const v of TAB.models[key][mod][ch]) if(!isFinite(v)) fin=false;
  for(const v of TAB.eta.eta) if(!isFinite(v)) fin=false;
  for(const v of TAB.frontier.L1) if(!isFinite(v)) fin=false;
  ok(fin,'every table value finite');
  ok(TAB.data.length===6&&TAB.data[0].dnu===null,
     'six Mironov rows, no 1-atm width (never interpolated)');

  // ---- constants and scales
  close(SQ,0.7601734505,5e-10,'sqrt(pi/2e) (scipy)');
  close(PHI0,1.2182439443,5e-9,'PHI(0) corner = sqrt2*SQ*DXKIN');
  close(nurefOf(TAB.cons.lam266_nm),1.8272726,5e-7,
    'nuref(266) = 1.8272726 GHz (make_parent_law_tables.py)');
  close(nurefOf(TAB.cons.lam532_nm)/nurefOf(TAB.cons.lam266_nm),0.5,1e-12,
    'the lever, shift side: nuref halves at 532 exactly');
  close(V0,243.1,0.1,'thermal speed v0 = 243.1 m/s (Appendix A)');
  rel(G0of(3,TAB.cons.lam266_nm),TAB.pins.G0_3atm,2e-7,

  close(phiOf(ymC),0.5*(TAB.phi.phi[15]+TAB.phi.phi[16]),1e-9,'phi log-midpoint, high end');

  ok(readoutHTML(M6).indexOf('1.604')>=0,
     'the readout prints the MODEL shift 1.604 at 6 atm — a value the measured '
     +'row does not share, so an em-dash from a non-finite model cannot hide');

  close(M3.nuSnd,1.66805,2e-4,'sound anchor nuref*sqrt(Gamma/2) = qc0/2pi (fig F2)');
  close(M3.wKin,2.0707,2e-4,'width plateau Dxkin*nuref = 2.0707 GHz (fig F3)');

    'the ideal ray slope kappa = 0.9435 at the Boltzmann C = 7/3');
  { // the tabulated points ARE Y/X, and they do NOT lie on one ray
    for(const g of ['Kr','SF6']){
      for(const p of TABB.ray.gases[g].pts){
        // X and Y are stored to 4 dp and kappa to 5, so the ratio can only
        // be checked to the propagated rounding, not to machine precision
        const tol=Math.abs(p.kap)*(5e-5/Math.abs(p.Y)+5e-5/Math.abs(p.X))+5e-6;
        close(p.kap,p.Y/p.X,tol,'kappa_eff == Y/X, '+g+' at '+p.P+' atm '
          +'(tol '+tol.toExponential(1)+' = stored X,Y rounding)');
      }
    }
    const rk=TABB.ray.gases.Kr, rs=TABB.ray.gases.SF6;
    ok(rk.k0>rk.k1,'krypton kappa_eff FALLS along its isotherm');
    ok(rs.k1>rs.k0,'SF6 kappa_eff RISES along its isotherm');
    // and the stored trend label (which drives the drawn arrow) must AGREE
    // with the numbers -- it is the only field the drawing reads
    ok(rk.trend==='falling'&&rs.trend==='rising',
      'the stored trend labels match the computed directions');
    for(const g of ['Kr','SF6']){
      const r=TABB.ray.gases[g];
      ok(r.trend===(r.k1>r.k0?'rising':'falling'),
        'trend field is self-consistent for '+g+' ('+r.trend+')');
    }
    ok((rk.k0-rk.k1)*(rs.k1-rs.k0)>0,
      'the two drifts have OPPOSITE sign in kappa: no common broadening '
      +'produces both');
    close(rk.k0/rk.k1,2.2885,0.01,'Kr drift x2.29');
    close(rs.k1/rs.k0,1.5550,0.01,'SF6 drift x1.56');
    ok(rk.k0>TABB.ray.kap_ideal&&rk.k1<TABB.ray.kap_ideal,
      'Kr CROSSES the ideal ray (starts above, ends below)');
    close(rs.pts[0].kap/TABB.ray.kap_ideal,1.0237,0.01,
      'SF6 starts ON the ideal ray to 2.4% and departs upward'); }
  { // the Gamma -> 1 degeneracy
    let dev=0;
    for(const yh of [0.05,1,10,100]) dev=Math.max(dev,Math.abs(sOf(yh,1)-Math.SQRT1_2));
    ok(dev<1e-15,'AT Gamma = 1 THE SHIFT IS PINNED: s == 1/sqrt2 at every '
      +'collisionality, so it carries no state information');
    const tang=(G,C)=>-(G-1)*C*C/(4*Math.SQRT2*Math.pow(DXKIN,3));
    close(tang(TABB.strata.Kr.lo,TABB.strata.Kr.C),TABB.degen.Kr.tang,1e-5,
      'the apex tangent ds/dw = -(Gamma-1)C^2/(4 sqrt2 Dxkin^3), Kr');
    close(tang(1.0,2.06529),0,1e-15,'and it VANISHES at Gamma = 1');
    ok(TABB.degen.SF6.straddles,
      'SF6 window STRADDLES Gamma = 1: its apex tangent changes sign '
      +'('+TABB.degen.SF6.tlo+' -> '+TABB.degen.SF6.thi+') inside one class');
    ok(Math.abs(TABB.degen.Kr.tang/TABB.degen.SF6.thi)>10,
      'and SF6 leaves the apex >10x flatter than Kr'); }
  { // the conditioning: the state is not an observable for SF6
    const dsf=TABB.degen.SF6.rows[3], dkr=TABB.degen.Kr.rows[5];
    close(dsf.den,4.90e-4,3e-5,'SF6 sits 4.9e-4 from the degenerate locus');
    ok(dsf.rel>10,'its state-from-shift relative error is '+dsf.rel+' (>10)');
    ok(dkr.rel<2,'while krypton\'s is '+dkr.rel+' (<2, marginal but usable)');
    ok(dsf.rel/dkr.rel>30,'ratio '+(dsf.rel/dkr.rel).toFixed(0)
      +'x: for the polyatomic stratum the state is NOT readable from the '
      +'observables');
    // and the identity that makes it exact: Gamma - 2s^2 == (2s^2-1)/yhat^2
    for(const g of ['Kr','N2','SF6']){
      const rows=TABB.degen[g].rows, br=TABB.base[g];
      for(let i=0;i<rows.length;i++){
        // the JSON stores s to 6 dp, so the identity can only be checked to
        // the PROPAGATED rounding 4 s (5e-7) / yhat^2 -- which is 1.7e-5 at
        // the low-yhat rows and 1.4e-8 at SF6's highest.  A flat tolerance
        // here either passes vacuously or fails on arithmetic that is right.
        const tol=4*br[i].s*5e-7/(br[i].yh*br[i].yh)*1.5+1e-9;
        close(rows[i].den,(2*br[i].s*br[i].s-1)/(br[i].yh*br[i].yh),tol,
          'the identity Gamma_rec - 2s^2 == (2s^2-1)/yhat^2, '+g+' '
          +rows[i].P+' atm (tol '+tol.toExponential(1)+' = stored-s rounding)');
      }
    } }

  // ---- the classes: is the anomaly a drift or an offset?
  { const m=TABC.mono;
    ok(m.rows.length===5,'Kr has five width rows');
    // the propagated bar, recomputed from the tabulated linewidth error
    for(const r of m.rows){
      const nuref=nurefOf(TAB.cons.lam266_nm);
      // propagated tolerance again: w is stored to 6 dp and X to 4, so the
      // recomputation inherits 3*dkap*5e-7/w + dkap*5e-5/X + dkap's own 5e-6
      const tol=3*r.dkap*5e-7/r.w+r.dkap*5e-5/r.X+5e-6;
      close(2*DXKIN*DXKIN/Math.pow(r.w,3)*(r.ew/nuref)/r.X,r.dkap,tol,
        'kappa bar = 2 Dxkin^2 dw / w^3 X at '+r.P+' atm (tol '
        +tol.toExponential(1)+')');
      ok(r.dkap/r.kap>0.15,'and it is >15% at '+r.P+' atm ('
        +(100*r.dkap/r.kap).toFixed(0)+'%) -- these bars cannot resolve a '
        +'drift');
    }
    // the weighted constant fit, recomputed in JS
    const rs=m.rows.slice(1);
    let Sw=0,Sy=0;
    for(const r of rs){ const w=1/(r.dkap*r.dkap); Sw+=w; Sy+=w*r.kap; }
    const mu=Sy/Sw;
    close(mu,m.const.kap,2e-5,'the weighted constant fit reproduces');
    close(1/Math.sqrt(Sw),m.const.err,2e-5,'and its error');
    let c2=0;
    for(const r of rs) c2+=(r.kap-mu)*(r.kap-mu)/(r.dkap*r.dkap);
    close(c2/(rs.length-1),m.const.chi2dof,2e-4,
      'the kappa-space chi2/dof reproduces (kept as a CROSS-CHECK only)');
    // THE PRIMARY RESULT is the w-space likelihood: kappa ~ 1/w^2 is
    // nonlinear against 6-11% width errors, so a kappa-space chi2
    // OVERSTATES the offset (3.85 sigma vs the honest 3.04)
    const WS=m.wspace.p36, WB=m.wspace.boot, WA=m.wspace.all5;
    ok(WS.chi2dof<1&&WB.chi2dof<1,
      'W-SPACE: a constant C fits at chi2/dof '+WS.chi2dof+' (3-6 atm) and '
      +WB.chi2dof+' (bootstrap only)');
    ok(WS.drift_sig<1&&WB.drift_sig<1&&WA.drift_sig<2,
      'and a 2-parameter C(lnP) is not resolved on ANY row selection ('
      +WA.drift_sig+' / '+WS.drift_sig+' / '+WB.drift_sig+' sigma): THE '
      +'RISING C_rec READING IS NOT SUPPORTED');
    close(WS.drift_dchi2,WS.chi2-WS.drift_chi2,1e-9,
      'the drift delta-chi2 is the two fits differenced');
    close(WS.drift_sig,Math.sqrt(WS.drift_dchi2),1e-3,
      'and its sigma is sqrt(delta chi2)');
    ok(WS.off_sig>2.5&&WS.off_sig<3.5,
      'the OFFSET is real but WEAKER than kappa-space says: '+WS.off_sig
      +' sigma (3-6 atm), '+WB.off_sig+' sigma (bootstrap only)');
    ok(m.off_sig-WS.off_sig>0.5,
      'the kappa-space chi2 overstates by '
      +(m.off_sig-WS.off_sig).toFixed(2)+' sigma -- THE CORRECTION');
    close(WS.off_sig,Math.sqrt(WS.chi2_ideal-WS.chi2),1e-3,
      'the offset sigma is sqrt(chi2(7/3) - chi2(best))');
    ok(WS.C>7/3&&WS.lo>7/3,
      'C = '+WS.C+' ['+WS.lo+', '+WS.hi+'] EXCEEDS 7/3, interval and all '
      +'(+'+WS.excess+'%)');
    close(WS.excess,100*(WS.C/(7/3)-1),1e-2,'the quoted excess is C/(7/3)-1');
    for(const k of ['all5','p36','boot']){
      const q=m.wspace[k];
      ok(q.lo<q.C&&q.C<q.hi,'the w-space interval brackets its best fit ('+k+')');
      ok(q.chi2_ideal>q.chi2,'and chi2(7/3) exceeds chi2(best) ('+k+')');
    }
    { const bo=m.rows.filter(r=>r.prov==='bootstrap');
      ok(bo.length===3&&m.wspace.boot.n===3,
        'only THREE Kr rows carry bootstrap 1-sigma errors');
      ok(m.rows.find(r=>r.P===2).prov==='digitized',
        'the 2-atm row is a Fig. 9c digitization');
      ok(m.rows.find(r=>r.P===6).prov==='text',
        'and the 6-atm row is a text value'); }
    ok(m.inst.quad.spread>1.5&&m.inst.add.spread>1.5,
      'a constant instrumental width is FALSIFIED (best leaves '
      +m.inst.quad.spread+'x / '+m.inst.add.spread+'x of spread)');
    ok(Math.abs(m.inst.quad.C_impl-7/3)>0.5,
      'and it would imply C = '+m.inst.quad.C_impl+', not 7/3'); }
  { const p=TABC.poly;
    ok(p.has_err===false,
      'SF6 carries NO width errors: no chi2 for it is honest');
    close(p.cor_rise,p.rows[3].kap/(p.rho[3]*p.rho[3])
          /(p.rows[0].kap/(p.rho[0]*p.rho[0])),1e-3,
      'the density-corrected rise recomputes from rho and kappa');
    ok(p.frac>0.6&&p.frac<0.8,'density explains '+(100*p.frac).toFixed(0)
      +'% of the log-rise, ZERO free parameters');
    ok(Math.min(...p.cor_vs_ideal)>0.85&&Math.max(...p.cor_vs_ideal)<1.10,
      'and the remainder brackets the ideal ray');
    ok(p.rho[0]<p.rho[3],'rho_real/rho_ideal grows with pressure'); }
  { const d=TABC.dia;
    ok(d.has_width===false,'N2 has NO width data -- the missing measurement');
    ok(d.C_relaxed>d.C_frozen,'rotation relaxing RAISES C');
    close(d.C_relaxed-d.C_frozen,d.etab,1e-5,'by exactly eta_b/eta');
    ok(d.rows[d.rows.length-1].sep>25,'and separates the 6-atm width by '
      +d.rows[d.rows.length-1].sep.toFixed(0)+'%');
    let grows=true;
    for(let i=2;i<d.rows.length;i++)
      if(d.rows[i].sep<=d.rows[i-1].sep) grows=false;
    ok(grows,'the separation grows with pressure: measure HIGH');
    for(const r of d.rows) ok(r.relaxed>r.frozen,
      'relaxed width exceeds frozen at '+r.P+' atm'); }

  // ---- THE GAS LAWS: each is exact algebra, verified here too
  { let dB=0,dA=0,d3=0;
    for(const G of [1.05,1.4,5/3]) for(const C of [1.43,7/3,2*DXKIN,2.86]){
      const kap=Math.pow(2*DXKIN/C,2);
      for(const yh of [0.02,0.2,1,3,10]){
        const sv=sOf(yh,G), wv=wOf(yh,C);
        const A=Math.pow(DXKIN/wv,2)-1;
        const B=(2*sv*sv-1)/(G-2*sv*sv);
        dB=Math.max(dB,Math.abs(B/(yh*yh)-1));
        dA=Math.max(dA,Math.abs(A/(kap*yh*yh)-1));
        d3=Math.max(d3,Math.abs(A/(kap*B)-1));
      }
    }
    ok(dB<1e-10,'LAW I: B = (2s^2-1)/(Gamma-2s^2) = yhat^2 exactly (rel '
      +dB.toExponential(1)+')');
    ok(dA<1e-10,'LAW II: A = (Dxkin/w)^2 - 1 = kappa yhat^2 exactly');
    ok(d3<1e-10,'LAW III: A = kappa B -- THE gas law, state eliminated'); }
  { // SBS BOYLE and CHARLES as the deep-hydro limits
    const C0=7/3,G0=5/3;
    const b=[50,100,200].map(y=>wOf(y,C0)*y);
    ok(Math.abs(b[2]-C0/2)<2e-3,
      'SBS BOYLE: w*yhat -> C/2 = '+fmt(C0/2,4)+' (dnu*P = const)');
    ok(Math.max(...b)/Math.min(...b)<1.001,'and it is flat over 50-200');
    const c=[50,100,200].map(y=>(G0-2*sOf(y,G0)**2)*y*y);
    ok(Math.abs(c[2]-(G0-1))<2e-3,
      'SBS CHARLES: (Gamma-2s^2) yhat^2 -> Gamma-1 = '+fmt(G0-1,4));
    // and the EXACT form, valid at every yhat
    let ex=0;
    for(const y of [0.05,1,20,200]){
      const v=(G0-2*sOf(y,G0)**2)*(1+y*y);
      ex=Math.max(ex,Math.abs(v/(G0-1)-1));
    }
    ok(ex<1e-10,'the EXACT sound law (Gamma-2s^2)(1+yhat^2) = Gamma-1 '
      +'holds at EVERY collisionality (rel '+ex.toExponential(1)+')'); }
  { // LAW IV corners are the sum-rule theorems
    close(Math.SQRT2*SQ*DXKIN,TABL.laws.phi0,1e-5,
      'LAW IV kinetic corner Phi(0) = sqrt(2pi/e) Dxkin = 1.21823');
    close(1/(5/3),0.6,1e-12,'LAW IV hydro corner Phi(inf) = 1/Gamma'); }
  { // the laws against the DATA, off the table
    close(TABL.laws.kap_ideal,Math.pow(2*DXKIN/(7/3),2),1e-6,
      'the ideal kappa is the Boltzmann C = 7/3 member');
    // pin EVERY lawI entry, not just the mean: lawI == B/X by definition,
    // and a mutant walked a single row unseen while the mean stayed in range
    for(const g of ['Kr','N2','SF6','Ar'])
      for(const r of TABL.gases[g].rows){
        if(r.lawI==null) continue;
        const tol=Math.abs(r.lawI)*(5e-5/Math.abs(r.B)+5e-5/Math.abs(r.X))+5e-5;
        close(r.lawI,r.B/r.X,tol,'lawI == B/yhat^2, '+g+' at '+r.P+' atm');
      }
    const kr=TABL.gases.Kr.rows.filter(r=>r.lawI!=null&&r.P>1);
    const mk=kr.reduce((a,r)=>a+r.lawI,0)/kr.length;
    ok(Math.abs(mk-1)<0.05,'LAW I on Kr with an INDEPENDENT Gamma: '
      +'B/yhat^2 = '+mk.toFixed(3)+' -- it rides the law to ~1%');
    const n2=TABL.gases.N2.rows.filter(r=>r.lawI!=null&&r.P>1);
    const mn=n2.reduce((a,r)=>a+r.lawI,0)/n2.length;
    ok(mn>1.1,'and on N2 it reads '+mn.toFixed(3)+' > 1: its shift wants a '
      +'HIGHER Gamma than fully-relaxed rotation -- LAW I is a Gamma-meter');
    const sf=TABL.gases.SF6.rows.filter(r=>r.lawI!=null).map(r=>r.lawI);
    ok(Math.max(...sf)/Math.min(...sf)>50,
      'while SF6 BLOWS UP by x'+(Math.max(...sf)/Math.min(...sf)).toFixed(0)
      +' across four rows: B is not a usable coordinate there');
    ok(TABL.gases.N2.has_width===false&&TABL.gases.Ar.has_width===false,
      'N2 and Ar have no widths, yet LAW I still tests them -- that is why '
      +'the shift law is the best-measured of the set'); }

  // ---- panels build clean for every view x pump x preset
  for(const lam of [266,532]) for(const pre of PRESETS){
    for(const v of ['portrait','shift','width','gain','inv','front','mani',
                    'bundle','ray','classes','laws']){
      const Mx=buildModel(Object.assign({},DEFAULTS,
        {view:v,lam,G:pre.G,C:pre.C,Psi:pre.Psi}));
      const t=readoutHTML(Mx)+eqbarHTML(Mx)+tagHTML(Mx);
      ok(t.indexOf('NaN')<0&&t.indexOf('undefined')<0,
        'panels clean: '+v+' / '+lam+' / '+pre.id);
    }
  }
  for(const lp of [LP0,LP1]) for(const G of [1.0,1.8]) for(const C of [1.4,3.2]){
    const Mx=buildModel(Object.assign({},DEFAULTS,{lp,G,C,Psi:0.7,beta:0.01}));
    ok(isFinite(Mx.mk.nu)&&isFinite(Mx.mk.wG)&&isFinite(Mx.mk.g)&&isFinite(Mx.corr),
      'extremes finite: lp='+fmt(lp,2)+' G='+G+' C='+C);
  }
  ok(plain('&rsquo;&mdash;&ndash;')==='’—–','plain() decodes entities');

  console.log(pass+' passed, '+failN+' failed');
  if(failN>0) throw new Error(failN+' self-test failure(s)');
  return true;
}

if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}

</script>
</body>
