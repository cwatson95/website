<!--
  sbs_parent_law.html - parent_law.tex Fig. 1 made live: the three SBS
  observables of krypton (shift / width / peak gain) across the
  kinetic-hydrodynamic crossover, drawn for the parent law (universal
  equation + product law), the exact Averbakh solve (beta = 0), and
  Navier-Stokes, at 266 nm (Mironov) AND 532 nm (the proposed lever),
  with the paper's inversion table and the beta frontier as views.

  WHAT IS EXACT: the parent-law curves are the three tier equations
  (parent_law.tex Eq. 1-3) evaluated in JS from physical constants -
  the NIST eta isotherm, the exact Pr = 2/3 conserving member's
  Phi(yhat), and the electrostrictive prefactor G0 (identical to the
  shipped closed form's coupling, round-trip pinned).  The Averbakh and
  Navier-Stokes curves are exact Python solves embedded as tables
  (papers/math_derivations/make_parent_law_tables.py, 28 checks ALL
  PASS).  The inversion rows reproduce parent_law.tex Table II; the
  frontier's Lambda(y), Lambda2(y) and y_B = 1.3523 are Richardson
  extractions from the velocity-dependent solve.  The Kr points are
  Mironov's 266-nm data verbatim (widths at exact rows only, never
  interpolated; no 1-atm width exists).

  WHAT IS MODELLED: the Eq-27 gain route is the closed-form fallback
  with its documented Landau-Placzek corner violation (x1.619); the
  frontier signal is the quadratic Lambda*beta + Lambda2*beta^2 (exact
  at beta = 0.005 by construction, curves stop where |Lambda*beta| >
  0.4).  NOT MODELLED: vibration (frozen at GHz), real-gas kappa_T for
  Kr (1.004 ~ 1), beyond-conserving atom-atom broadening - the width
  anomaly the width view brackets is exactly what is NOT yet explained,
  and the sim says so where it is drawn.

  Physics/data: parent_law.tex + parent_law_forward.py (30 checks) +
  verify_parent_law.py (31 checks); Mironov 266-nm Kr tables as carried
  in lib/sbs_gain.py CF_TABLES; Offenberger 248-nm SF6 rows in the
  inversion view.  Scope per the programme audit: the quantitative
  basis is monatomic Kr; SF6 enters the inversion only.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){

}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

const SQ=Math.sqrt(Math.PI/(2*Math.E));          // 0.7601734505  kinetic peak
const DXKIN=1.13320;                             // kinetic lobe FWHM
const PHI0=Math.SQRT2*SQ*DXKIN;                  // 1.21823  the Phi(0) corner
const KBSI=1.380649e-23, TLAB=298.0;
const MKR=TAB.cons.m_kg, ALPHA_A3=TAB.cons.alpha_A3;
const V0=Math.sqrt(2*KBSI*TLAB/MKR);             // 243.1 m/s thermal speed

/* wavelength machinery — the lever y ∝ λ at fixed P */
function lamNm(st){ return st.lam===532?TAB.cons.lam532_nm:TAB.cons.lam266_nm; }
function qOf(lam_nm){ return 2*(2*Math.PI/(lam_nm*1e-9)); }      // backscatter q [1/m]
function nurefOf(lam_nm){ return qOf(lam_nm)*V0/(2*Math.PI)/1e9; }  // GHz

/* linear interpolation on a tabulated pair (np.interp semantics, clamped) */
function interp1(x,xs,ys){
  const n=xs.length;
  if(x<=xs[0]) return ys[0];
  if(x>=xs[n-1]) return ys[n-1];
  let j=0; while(j<n-2 && x>xs[j+1]) j++;
  const t=(x-xs[j])/(xs[j+1]-xs[j]);
  return ys[j]+(ys[j+1]-ys[j])*t;
}
function etaOf(P){ return 1e-6*interp1(P,TAB.eta.P,TAB.eta.eta); }   // Pa s
function yhOf(P,lam_nm){ return P*101325/(etaOf(P)*qOf(lam_nm)*V0); } // shear yhat
/* invert yhat(P) for the top axis (monotone in P; bisection) */
function pOfYh(yh,lam_nm){
  let a=0.3,b=10.0;
  if(yh<=yhOf(a,lam_nm)) return a;
  if(yh>=yhOf(b,lam_nm)) return b;
  for(let i=0;i<48;i++){ const m=Math.sqrt(a*b);
    if(yhOf(m,lam_nm)<yh) a=m; else b=m; }
  return Math.sqrt(a*b);
}

/* the three tier equations (parent_law.tex Eq. 1-3) */
function sOf(yh,G){ return Math.sqrt((1+G*yh*yh)/(2*(1+yh*yh))); }
function wOf(yh,C){ return DXKIN/Math.sqrt(1+Math.pow(2*DXKIN*yh/C,2)); }
function phiOf(yh){                     // exact Pr=2/3 member, log-interp
  return interp1(Math.log(yh),TAB.phi.yh.map(Math.log),TAB.phi.phi);
}
/* the electrostrictive prefactor G0 = 8 pi^2 alpha^2 n0 kbar/(c kB T),
   CGS -> cm/GW, exactly the shipped closed form's coupling (check G3).
   n0 follows the library's torr chain (P*760*133.322 Pa), NOT P*101325 —
   the two differ by 2.8e-6 and the pins are exact only on the former. */
function G0of(P,lam_nm){
  const kB_cgs=KBSI*1e7;
  const n0=(P*760*133.322*10)/(kB_cgs*TLAB);         // cm^-3
  const kbar=(2*Math.PI/(lam_nm*1e-9))/100;          // cm^-1
  const al=ALPHA_A3*1e-24;                           // cm^3
  return 8*Math.PI*Math.PI*al*al*n0*kbar/(2.99792458e10*kB_cgs*TLAB)*1e16;
}
/* one pressure through the parent law at tier constants (G,C,Psi) */
function uniAt(P,lam_nm,G,C,Psi){
  const yh=yhOf(P,lam_nm), u=1/(1+yh*yh);
  const s=sOf(yh,G), w=wOf(yh,C), phi=phiOf(yh);
  const nuref=nurefOf(lam_nm), G0=G0of(P,lam_nm);
  return {yh,u,s,w,phi,G0,nu:s*nuref,wG:w*nuref,g:G0*Psi*phi*s/w};
}
/* the Eq-27 closed-form gain route (corner violation 1.619 — honest fallback) */
function eq27At(P,lam_nm){
  const yh=yhOf(P,lam_nm);
  return G0of(P,lam_nm)*SQ*Math.sqrt(1+yh*yh);
}
/* competitor tables (log-P interp; the grid contains 1..6 and 10 atm) */
function tabModel(key,mod,ch,P){

}

/* the inversion — three observables read back three constants

function gammaRec(s,yh){ return (2*s*s*(1+yh*yh)-1)/(yh*yh); }
function cRec(w,yh){ return 2*DXKIN*yh/Math.sqrt(Math.pow(DXKIN/w,2)-1); }
function krInversion(){
  const nuref=nurefOf(TAB.cons.lam266_nm), out=[];
  for(const d of TAB.data){
    if(d.dnu==null) continue;
    const yh=d.yh, s=d.nuB/nuref, w=d.dnu/nuref;
    const g=d.gB/G0of(d.P,TAB.cons.lam266_nm);
    out.push({P:d.P,yh,s,w,g,G:gammaRec(s,yh),C:cRec(w,yh),
              Psi:(g*w/s)/phiOf(yh)});
  }
  return out;

function pearson(xs,ys){
  const n=xs.length;
  let mx=0,my=0; for(let i=0;i<n;i++){ mx+=xs[i]; my+=ys[i]; }
  mx/=n; my/=n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){ const a=xs[i]-mx,b=ys[i]-my;
    sxy+=a*b; sxx+=a*a; syy+=b*b; }
  return sxy/Math.sqrt(sxx*syy);
}

/* the frontier — the solve's NATIVE collisional y (x1.62 smaller than

  // log-log, matching the generator's P_B inversion so the crossing

  const y=Math.exp(interp1(Math.log(P),TAB.frontier.P.map(Math.log),

  return lam===532?2*y:y;

function lamTab(P,lam,which){
  const y=yColOf(P,lam);

  if(y<ys[0]||y>ys[ys.length-1]) return null;
  return interp1(Math.log(y),ys.map(Math.log),TAB.frontier[which]);

      near=d;

/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  const xt=o.xticks||ticksFor(xlo,xhi,6), yt=o.yticks||ticksFor(ylo,yhi,5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }

/* ================================================================== *
 *  views — every panel is P [atm] on a log axis with the shear ŷ      *
 *  running along the top (the same frame as parent_law.tex Fig. 1)    *
 * ================================================================== */
const CU='#b8ec4c', CA='#e8843a', CN='#5ac8e0', CD='#f2f4f8', CM='#cd35c4';
const CMUT='#6f7789', CDIM='#39404f';
const PTICKS=[0.3,0.5,1,2,3,5,10];
const lg=p=>Math.log10(p);

function txt(ctx,x,y,s,col,font,align){
  ctx.fillStyle=col||CMUT; ctx.font=font||'10.5px -apple-system,sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(plain(s),x,y);
}
function clipBox(ctx,b,fn){
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  fn(); ctx.restore();
}
/* log-P frame + the shear-ŷ ticks along the top edge */
function pBox(ctx,b,ylo,yhi,M,opt){
  const o=opt||{};
  axes(ctx,b,lg(0.3),1,ylo,yhi,{
    title:o.title, xlab:o.xlab===undefined?'P  [atm]  (log axis)':o.xlab,
    ylab:o.ylab, xticks:PTICKS.map(lg), xfmt:t=>{
      const p=Math.pow(10,t); return p<1?p.toFixed(1):p.toFixed(0); },
    yticks:o.yticks, yfmt:o.yfmt});
  if(o.noYh) return;
  /* the ŷ ticks live INSIDE the top edge — the strip above the box belongs
     to the panel title (the audit caught the collision when they shared it) */
  ctx.font='9px -apple-system,sans-serif'; ctx.fillStyle=CMUT;
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(const yv of [0.2,0.5,1,2,3,4]){
    const p=pOfYh(yv,M.lam);
    if(p<=0.301||p>=9.99) continue;
    const X=b.x+b.w*(lg(p)-lg(0.3))/(1-lg(0.3));
    ctx.strokeStyle=CDIM; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y+4); ctx.stroke();
    if(X<b.x1-62) ctx.fillText(String(yv),X,b.y+6);   // keep clear of the corner caption
  }
  ctx.font='italic 9.5px Georgia, serif'; ctx.textAlign='right';
  ctx.fillText(plain('ŷ = P/ηqv₀'),b.x1-4,b.y+5);
  ctx.textBaseline='alphabetic';
}
function putP(ctx,b,P,vals,ylo,yhi,col,lw,dash){
  clipBox(ctx,b,()=>polyline(ctx,b,P.map(lg),vals,lg(0.3),1,ylo,yhi,col,lw,dash));
}
function markLine(ctx,b,Pm,ylo,yhi){
  polyline(ctx,b,[lg(Pm),lg(Pm)],[ylo,yhi],lg(0.3),1,ylo,yhi,rgba(CM,0.55),1,[2,4]);
}
function dot(ctx,X,Y,r,col){
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X,Y,r,0,TAU); ctx.fill();
  ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
}
/* Mironov points, one channel; err bars optional; log-y aware via map fn */
function dataPts(ctx,b,M,ch,ylo,yhi,mapY,err){
  if(!M.st.showData||M.st.lam!==266) return;
  for(const d of TAB.data){
    const v=ch==='nu'?d.nuB:ch==='w'?d.dnu:d.gB;
    if(v==null) continue;
    const e=ch==='nu'?d.nuBe:ch==='w'?d.dnue:d.gBe;
    const X=b.x+b.w*(lg(d.P)-lg(0.3))/(1-lg(0.3));
    const Y=b.y1-b.h*(mapY(v)-ylo)/(yhi-ylo);
    if(err&&e){
      const Y0=b.y1-b.h*(mapY(v-e)-ylo)/(yhi-ylo);
      const Y1=b.y1-b.h*(mapY(v+e)-ylo)/(yhi-ylo);
      ctx.strokeStyle=CD; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(X,Y0); ctx.lineTo(X,Y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X-3,Y0); ctx.lineTo(X+3,Y0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X-3,Y1); ctx.lineTo(X+3,Y1); ctx.stroke();
    }
    dot(ctx,X,Y,3.4,CD);
  }
}
function hline(ctx,b,v,ylo,yhi,col,dash,lab,labX){
  if(v<ylo||v>yhi) return;
  polyline(ctx,b,[lg(0.3),1],[v,v],lg(0.3),1,ylo,yhi,col||CDIM,1,dash||[3,4]);
  if(lab){ const Y=b.y1-b.h*(v-ylo)/(yhi-ylo);
    txt(ctx,labX===undefined?b.x+6:labX,Y-3,lab,CMUT,'9.5px -apple-system,sans-serif'); }
}

function paintGain(ctx,b,M,big){
  const st=M.st, ylo=-3.4, yhi=0.15;
  pBox(ctx,b,ylo,yhi,M,{title:big?'(c)  the gain: slope 1 → slope 2':'(c)  the gain',
    ylab:'γ_B  [cm/GW]  (log axis)',
    yticks:[-3,-2,-1,0], yfmt:t=>'10^'+t});
  if(st.showAnchors){                        // slope guides
    for(const [x0,g0,sl,lab] of [[0.45,0.013,1,'∝ P'],[3.4,0.045,2,'∝ P²']]){
      const xs=[x0,x0*1.9];
      putP(ctx,b,xs,xs.map(x=>lg(g0*Math.pow(x/x0,sl))),ylo,yhi,CDIM,1,[4,3]);
      const X=b.x+b.w*(lg(xs[1]*1.1)-lg(0.3))/(1-lg(0.3));
      txt(ctx,X,b.y1-b.h*(lg(g0*Math.pow(1.9,sl))-ylo)/(yhi-ylo),lab,CMUT);
    }
  }
  const key=st.lam===532?'532':'266';
  if(st.showNS) putP(ctx,b,TAB.models[key].P,
    TAB.models[key].ns.g.map(lg),ylo,yhi,CN,1.3);
  if(st.showAvb) putP(ctx,b,TAB.models[key].P,
    TAB.models[key].avb.g.map(lg),ylo,yhi,CA,1.3);
  if(st.showEq27) putP(ctx,b,M.P,M.e27.map(lg),ylo,yhi,'#e6f7c2',1.2,[6,4]);
  putP(ctx,b,M.P,M.uni.map(u=>lg(u.g)),ylo,yhi,CU,2.1);
  dataPts(ctx,b,M,'g',ylo,yhi,v=>lg(Math.max(v,1e-6)),true);
  markLine(ctx,b,M.Pm,ylo,yhi);
  if(big){
    txt(ctx,b.x+b.w*0.55,b.y1-b.h*0.47,'parent law',CU,'italic 11px Georgia, serif');
    txt(ctx,b.x+b.w*0.30,b.y1-b.h*0.47,'Averbakh',CA,'italic 11px Georgia, serif');
    txt(ctx,b.x+b.w*0.13,b.y1-b.h*0.13,'Navier–Stokes (collapses at low P)',CN,'italic 11px Georgia, serif');
    if(st.showEq27) txt(ctx,b.x+b.w*0.60,b.y1-b.h*0.88,'Eq-27 route (corner violation 1.619)',
      '#e6f7c2','10px -apple-system,sans-serif');
  }
}

/* ---- view D: the gain + the product law Φ ------------------------ */
function drawGainView(ctx,W,H,M,S){
  const bl=box(70,52,Math.max(430,W-830),H-190);
  paintGain(ctx,bl,M,true);
  const br=box(bl.x1+74,52,Math.max(260,W-bl.x1-74-330),H-190);
  const xlo=Math.log(0.15),xhi=Math.log(8),ylo=0.55,yhi=1.75;
  axes(ctx,br,xlo,xhi,ylo,yhi,{title:'the product law:  g·w/s = Ψ·Φ(ŷ)',
    xlab:'shear ŷ  (log axis)', ylab:'Φ',
    xticks:[0.15,0.3,0.6,1.2,2.5,5,8].map(Math.log), xfmt:t=>fmt(Math.exp(t),2)});
  polyline(ctx,br,TAB.phi.yh.map(Math.log),TAB.phi.phi,xlo,xhi,ylo,yhi,CU,2);
  const cf=[],ys=[];
  for(let i=0;i<=60;i++){ const y=0.15*Math.pow(8/0.15,i/60);
    ys.push(Math.log(y)); cf.push(SQ*Math.sqrt(1+y*y)*wOf(y,M.st.C)/sOf(y,M.st.G)); }
  clipBox(ctx,br,()=>polyline(ctx,br,ys,cf,xlo,xhi,ylo,yhi,'#e6f7c2',1.2,[6,4]));
  hline2(ctx,br,PHI0,xlo,xhi,ylo,yhi,CDIM,[3,4],'Φ(0) corner 1.218');
  hline2(ctx,br,1/M.st.G,xlo,xhi,ylo,yhi,CDIM,[3,4],'1/Γ corner');
  if(M.st.showData&&M.st.lam===266){
    const nuref=nurefOf(TAB.cons.lam266_nm);
    for(const d of TAB.data){
      if(d.dnu==null) continue;
      const g=d.gB/G0of(d.P,TAB.cons.lam266_nm);
      const phiM=g*(d.dnu/nuref)/(d.nuB/nuref);
      const X=br.x+br.w*(Math.log(d.yh)-xlo)/(xhi-xlo);
      const Y=br.y1-br.h*(phiM-ylo)/(yhi-ylo);
      dot(ctx,X,Y,3.4,CD);
      txt(ctx,X+5,Y-4,d.P+' atm','#aeb6c6','9px -apple-system,sans-serif');
    }
  }
  caption(ctx,br.x+8,br.y+8,'green: the exact Pr = 2/3 member (corners are theorems). '
    +'Dashed: the Eq-27 implied Φ — right corner violated ×1.62. White: measured '
    +'g·w/s — rising off the member: Z_ac = 0.98 → 1.53, the acoustic compressibility '
    +'factor leaving unity.',br.w-20,'#767e92');
}

  // Kr Gamma
  const b1=box(64,y0,wA,hh);
  const x1=lg(1.8),x2=lg(6.6);
  axes(ctx,b1,x1,x2,1.60,1.72,{title:'krypton:  Γ_rec',

  hline2(ctx,b1,5/3,x1,x2,1.60,1.72,CA,[4,3],'5/3');
  for(const r of M.inv){
    const X=b1.x+b1.w*(lg(r.P)-x1)/(x2-x1);
    dot(ctx,X,b1.y1-b1.h*(r.G-1.60)/0.12,3.6,
        Math.abs(lg(r.P/M.Pm))<0.02?CM:CU);
  }
  caption(ctx,b1.x+6,b1.y1+34,'mean 5/3 to 0.5% — the thermodynamic tier closes.',
    b1.w,'#767e92');
  // SF6 Gamma + window
  const b2=box(b1.x1+58,y0,wA,hh);
  const s1=lg(4.8),s2=lg(16);
  axes(ctx,b2,s1,s2,0.70,1.35,{title:'SF₆:  Γ_rec inside the window',
    xlab:'P  [atm]', ylab:'Γ_rec',
    xticks:[5,8,11,15].map(lg), xfmt:t=>fmt(Math.pow(10,t),0)});
  for(const r of TAB.inv.sf6){
    const X=b2.x+b2.w*(lg(r.P)-s1)/(s2-s1);
    const Ylo=b2.y1-b2.h*(r.lo-0.70)/0.65, Yhi=b2.y1-b2.h*(r.hi-0.70)/0.65;
    ctx.strokeStyle=rgba(CN,0.8); ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(X,Ylo); ctx.lineTo(X,Yhi); ctx.stroke();
    dot(ctx,X,b2.y1-b2.h*(r.G-0.70)/0.65,3.6,CD);
  }
  caption(ctx,b2.x+6,b2.y1+34,'cyan bars: the measured relaxation window '
    +'[Γ₀, Γ∞] (vibration counted out). Every row lands inside to the '
    +'companion scripts\u2019 \u00b10.02 read-off tolerance, hugging the frozen edge '
    +'(5.4 atm sits right on it).',b2.w,'#767e92');
  // C-Psi correlation
  const b3=box(b2.x1+58,y0,Math.max(220,W-b2.x1-58-330),hh);
  const cx1=Math.log(1.8),cx2=Math.log(3.2),cy1=Math.log(0.9),cy2=Math.log(1.5);
  axes(ctx,b3,cx1,cx2,cy1,cy2,{title:'one anomaly, two tiers',
    xlab:'C_rec  (log)', ylab:'Ψ_rec  (log)',
    xticks:[2,2.4,2.8,3.2].map(Math.log), xfmt:t=>fmt(Math.exp(t),1),
    yticks:[0.9,1.1,1.3,1.5].map(Math.log), yfmt:t=>fmt(Math.exp(t),1)});
  // least-squares line in ln-ln
  const lx=M.inv.map(r=>Math.log(r.C)), ly=M.inv.map(r=>Math.log(r.Psi));
  const n=lx.length, mx=lx.reduce((a,b)=>a+b)/n, my=ly.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0;
  for(let i=0;i<n;i++){ sxy+=(lx[i]-mx)*(ly[i]-my); sxx+=(lx[i]-mx)*(lx[i]-mx); }
  const sl=sxy/sxx;
  clipBox(ctx,b3,()=>polyline(ctx,b3,[cx1,cx2],
    [my+sl*(cx1-mx),my+sl*(cx2-mx)],cx1,cx2,cy1,cy2,CDIM,1,[4,3]));
  for(let i=0;i<n;i++){
    const X=b3.x+b3.w*(lx[i]-cx1)/(cx2-cx1);
    const Y=b3.y1-b3.h*(ly[i]-cy1)/(cy2-cy1);
    dot(ctx,X,Y,3.6,Math.abs(lg(M.inv[i].P/M.Pm))<0.02?CM:CU);
    txt(ctx,X+5,Y+3,M.inv[i].P+' atm','#aeb6c6','9px -apple-system,sans-serif');
  }
  caption(ctx,b3.x+6,b3.y1+34,'ln C_rec vs ln Ψ_rec: r = '+fmt(M.corr,2)
    +' — the kinetic and conservation drifts are ONE object (the width anomaly), '
    +'not two.',b3.w,'#767e92');
  caption(ctx,64,H-40,'The law run backward: each measured triple (s, w, g) at known ŷ '
    +'returns one constant per tier — Γ_rec exactly, C_rec exactly, Ψ_rec through Φ. '
    +'Magenta marks the row nearest the pressure marker.',W-420,'#767e92');
}

  polyline(ctx,bl,[lg(0.3),1],[yb,yb],lg(0.3),1,ylo,yhi,CD,1.4,[6,3]);

  txt(ctx,bl.x+bl.w*0.10,bl.y1-bl.h*0.32,'266 nm',CU,'italic 11px Georgia, serif');

  caption(ctx,bl.x+8,bl.y1-46,'the notch is the Boyle collisionality: Λ crosses zero, '
    +'the gain departure REVERSES SIGN — a calibration-free shape test. Curves stop '
    +'where |Λβ| > 0.4 (outside the first-order domain).',bl.w*0.62,'#767e92');
  // right: the lever geometry y(P)
  const br=box(bl.x1+74,52,Math.max(260,W-bl.x1-74-330),H-190);
  const gy1=lg(0.05),gy2=lg(4.6);

    ylab:'collisional y  (log axis)', noYh:true,

    'y_opt = '+fmt(TAB.frontier.yopt,3)+'  (β loudest)');
  putP(ctx,br,TAB.frontier.P,TAB.frontier.y266.map(lg),gy1,gy2,CU,1.8);
  putP(ctx,br,TAB.frontier.P,TAB.frontier.y266.map(y=>lg(2*y)),gy1,gy2,CM,1.8,[6,4]);
  txt(ctx,br.x+br.w*0.76,br.y1-br.h*0.72,'266 nm',CU,'italic 11px Georgia, serif');
  txt(ctx,br.x+br.w*0.40,br.y1-br.h*0.52,'532 nm',CM,'italic 11px Georgia, serif');
  caption(ctx,br.x+8,br.y1+34,'halving the pump wavelength doubles y at every pressure: '
    +'the y_B crossing walks from '+fmt(TAB.frontier.PB266,2)+' atm (just past the data) to '
    +fmt(TAB.frontier.PB532,2)+' atm — mid-window; β is loudest at '
