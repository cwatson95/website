/* ================================================================== *
 *  selfTest — runs when there is no document                          *
 *                                                                     *
 *  Reference values marked (scipy) were printed by the Python         *
 *  derivation scripts and read in full, not through head/tail.        *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,t,n)=>ok(Math.abs(a-b)<=t,n+'  (got '+a+', want '+b+', tol '+t+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.abs(b),
    n+'  (got '+a+', want '+b+', rel tol '+t+')');

  /* ================= the equation of state ======================== */
  /* every leading constant against an ABSOLUTE number — ranges, limits
     and monotonicity are all blind to a scale factor */
  rel(A_P,6.002332185660e21,1e-11,'pressure scale A = pi m^4 c^5/3h^3 (scipy)');
  rel(bRho(2),1.947864333345e9,1e-11,'density scale B(mu_e=2) (scipy)');
  rel(M_SUN,1.988409870698e30,1e-11,'M_sun from IAU nominal GM/G (scipy)');
  rel(EOS_SERIES[0],1,1e-15,'the series leading coefficient is exactly 1');
  rel(EOS_SERIES[1],-5/14,1e-15,'and the next is -5/14');
  rel(R_B_EXT,4.1,1e-12,'A_B/E(B-V) = 4.1 for R_V = 3.1');
  rel(INV_H0_GYR,977.792221680789,1e-12,'1/(km/s/Mpc) in Gyr (scipy)');

  /* f(x) by an INDEPENDENT route: f(0)=0 and f'(x)=8x^4/sqrt(1+x^2) is
     exact and free of cancellation, so integrating it is a second
     implementation rather than a restatement of the first. */
  const fByQuad=(x)=>{
    const n=4000; let s=0;
    for(let i=0;i<n;i++){
      const a=x*i/n, b=x*(i+1)/n, m=(a+b)/2;
      s+=(b-a)/6*(fpEOS(a)+4*fpEOS(m)+fpEOS(b));
    }
    return s;
  };
  for(const x of [1e-3,0.01,0.1,0.2,0.34,0.5,1,3,20]){
    rel(fEOS(x),fByQuad(x),1e-9,'f('+x+') equals the integral of f\' (independent)');
  }
  /* the branches must agree AT the join — a branch no test evaluates is
     covered by nothing, and both of these are accurate at 0.30-0.35 */
  for(const x of [0.30,0.33,0.349,0.3499999]){
    const closed=x*(2*x*x-3)*Math.sqrt(1+x*x)+3*Math.asinh(x);
    rel(fEOS(x),closed,1e-12,'series equals closed form at the join x='+x);
  }
  ok(XSPLIT>0.2&&XSPLIT<0.5,'the join sits where both branches are accurate');
  /* the two limits */
  rel(fEOS(1e-4)/(1.6e-20),1,1e-8,'f -> 8x^5/5 as x -> 0');
  rel(fEOS(1e4)/2e16,1,1e-7,'f -> 2x^4 as x -> infinity');
  /* the cancellation the series exists to avoid is REAL — assert that the
     closed form is still bad, so the branch cannot be quietly deleted */
  {
    const x=1e-3, closed=x*(2*x*x-3)*Math.sqrt(1+x*x)+3*Math.asinh(x);
    ok(Math.abs(closed/fEOS(x)-1)>1e-8,
       'and the closed form really has lost precision there (rel err '
       +Math.abs(closed/fEOS(x)-1).toExponential(2)+')');
  }
  /* f' against a central difference where f is clean */
  for(const x of [0.5,1,3,30]){
    const d=(fEOS(x*(1+1e-6))-fEOS(x*(1-1e-6)))/(2e-6*x);
    rel(d,fpEOS(x),1e-8,'f\'(x) closed form at x='+x);
  }
  /* the adiabatic index, which is the whole story */
  rel(gammaEOS(1e-5),5/3,1e-9,'gamma -> 5/3 non-relativistic');
  rel(gammaEOS(1e6),4/3,1e-9,'gamma -> 4/3 ultra-relativistic');
  ok(gammaEOS(0.1)>gammaEOS(1)&&gammaEOS(1)>gammaEOS(10),'gamma falls monotonically');
  ok(gammaEOS(1e6)>4/3-1e-9,'and never goes below 4/3');
  rel(pressureOf(1),A_P*fEOS(1),1e-15,'P = A f(x)');
  rel(densityOf(2,2),bRho(2)*8,1e-15,'rho = B x^3');
  rel(xOfDensity(densityOf(1.7,2),2),1.7,1e-12,'rho <-> x round trip');

  /* ================= Lane-Emden ==================================== */
  const le3=laneEmden(3,8000), le15=laneEmden(1.5,8000);
  rel(le3.xi1,6.896848619403,1e-6,'xi_1(n=3) = 6.8968486 (scipy)');
  rel(le3.bracket,2.018235950787,1e-6,'omega_3 = 2.0182360 (scipy)');
  rel(le15.xi1,3.653753736199,1e-6,'xi_1(n=3/2) = 3.6537537 (scipy)');
  rel(le15.bracket,2.714055120501,1e-6,'omega_{3/2} = 2.7140551 (scipy)');
  /* n = 0 and n = 1 have exact closed forms — the solver must hit them */
  rel(laneEmden(1,8000).xi1,PI,1e-5,'xi_1(n=1) = pi exactly');
  rel(laneEmden(0,8000).xi1,Math.sqrt(6),1e-5,'xi_1(n=0) = sqrt(6) exactly');

  /* ---- the series solutions AT the origin ----
     Fed into 6000 RK4 steps these contribute ~1e-9, which no honest
     tolerance on the final answer can see — a mutation sweep changed both
     and the whole suite stayed green.  So test them where they live: a
     series solution must SATISFY ITS OWN EQUATION near the origin.  For
     Lane-Emden that is theta'' + 2 theta'/xi + theta^n = 0, and the 2/xi
     term is what forces theta' = -xi/3 rather than -xi/2. */
  {
    const resid=(xi,n)=>{
      const e=xi*1e-4;
      const d2=(leSeriesDTheta(xi+e,n)-leSeriesDTheta(xi-e,n))/(2*e);
      return d2 + 2*leSeriesDTheta(xi,n)/xi
             + Math.pow(Math.max(leSeriesTheta(xi,n),0),n);
    };
    /* it carries the xi^4 term, so the residual is O(xi^4).  A series with
       the wrong xi^2 coefficient leaves an O(xi^2) residual and misses this
       by four orders of magnitude at xi = 0.01. */
    for(const n of [1.5,3]) for(const xi of [1e-2,0.05,0.1])
      close(resid(xi,n),0,0.25*Math.pow(xi,4),
        'the Lane-Emden origin series solves its own equation to O(xi^4) '
        +'(n='+n+', xi='+xi+')');
    ok(Math.abs(resid(0.1,3))>1e-6,'and the residual is genuinely non-zero there, '
       +'so the check is not a tautology');
    rel(leSeriesTheta(0,3),1,1e-15,'theta(0) = 1');
    close(leSeriesDTheta(0,3),0,1e-15,'and theta\'(0) = 0');
    /* the leading coefficient, against an absolute number */
    rel(leSeriesDTheta(1e-4,0),-1e-4/3,1e-12,'theta\' -> -xi/3 (n=0, no quartic term)');
    rel(leSeriesTheta(1e-2,0),1-1e-4/6,1e-12,'theta -> 1 - xi^2/6');
  }
  {
    /* the same for the Chandrasekhar form, whose source term is
       (phi^2 - 1/y_c^2)^{3/2} and whose central value is q^{3/2} */
    const resid=(eta,q)=>{
      const e=eta*1e-4;
      const d2=(chSeriesDPhi(eta+e,q)-chSeriesDPhi(eta-e,q))/(2*e);
      const inv2=1-q;
      const s=chSeriesPhi(eta,q)*chSeriesPhi(eta,q)-inv2;
      return d2 + 2*chSeriesDPhi(eta,q)/eta + Math.pow(Math.max(s,0),1.5);
    };
    /* This series stops at eta^2, so its residual does NOT vanish to higher
       order — it is exactly -q^2 eta^2/2, which is a far stronger thing to
       assert than "small": it pins both the eta^2/6 and the eta/3. */
    for(const q of [0.5,0.9,1.0]) for(const eta of [1e-3,1e-2,3e-2])
      rel(resid(eta,q),-q*q*eta*eta/2,5e-3,
        'the Chandrasekhar origin series leaves exactly -q^2 eta^2/2 '
        +'(q='+q+', eta='+eta+')');
    rel(chSeriesPhi(0,0.8),1,1e-15,'phi(0) = 1');
    close(chSeriesDPhi(0,0.8),0,1e-15,'and phi\'(0) = 0');
    rel(chSeriesDPhi(1e-3,1),-1e-3/3,1e-12,'phi\' -> -q^{3/2} eta/3');
  }

  /* ================= the Chandrasekhar limit ======================= */
  const MCH=chandraMass(2,8000);
  rel(MCH,1.456297553509,1e-6,'M_Ch(mu_e=2) = 1.4562976 M_sun (scipy)');
  rel(chandraMass(2.15,8000),1.260181766152,1e-6,'M_Ch(mu_e=2.15) (scipy)');
  /* twice, by different routes: the n=3 bracket, and the limit of the
     full structure integration */
  rel(whiteDwarf(3000,2,9000).MSun,MCH,2e-5,
      'the direct integration reaches the same limit at x_c = 3000');
  /* the scaling, and the analytic prefactor DERIVED rather than guessed */
  rel(chandraMass(2,6000)/chandraMass(2.5,6000),Math.pow(2.5/2,2),1e-9,
      'M_Ch scales as mu_e^-2');
  {
    const pref=MCH*M_SUN/(Math.pow(HBAR*C_LIGHT/G_NEWT,1.5)/Math.pow(2*M_U,2));
    rel(pref,3.097972127068,1e-6,'M_Ch = 3.0979721 (hbar c/G)^{3/2}/(mu_e m_u)^2 (scipy)');
    rel(pref,9/(16*PI)*Math.pow(4*PI/3,1.5)*le3.bracket,1e-6,
        'and that prefactor is (9/16pi)(4pi/3)^{3/2} omega_3');
  }

  /* ================= structure ===================================== */
  const REF=[[0.5,0.223061207678,0.020199139441],
             [1,  0.510197002730,0.013948949198],
             [2,  0.896932415299,0.009306862217],
             [5,  1.272813844964,0.005050384448],
             [20, 1.438356362663,0.001664358811]];
  for(const [xc,Mm,Rr] of REF){
    const s=whiteDwarf(xc,2,6000);
    rel(s.MSun,Mm,3e-5,'M(x_c='+xc+') (scipy)');
    rel(s.RSun,Rr,3e-5,'R(x_c='+xc+') (scipy)');
    ok(s.MSun<MCH,'and it is below the limit');
  }
  rel(whiteDwarf(1,2,6000).rhoC,1.947864333345e9,1e-9,'rho_c(x_c=1) (scipy)');
  /* adding mass makes it SMALLER — the fact the view exists to show */
  {
    let mono=true;
    const seq=mrSequence(2,40);
    for(let i=1;i<seq.length;i++)
      if(!(seq[i].M>seq[i-1].M && seq[i].R<seq[i-1].R)) mono=false;
    ok(mono,'the sequence is monotone: mass up, radius down, everywhere');
    ok(seq[seq.length-1].M<MCH,'and never reaches the limit');
  }
  /* the non-relativistic branch really is -1/3 */
  {
    const a=whiteDwarf(0.05,2,6000), b=whiteDwarf(0.10,2,6000);
    const slope=Math.log(b.RSun/a.RSun)/Math.log(b.MSun/a.MSun);
    close(slope,-1/3,0.02,'d ln R/d ln M -> -1/3 in the non-relativistic limit');
  }
  /* the mass profile must arrive at the total mass */
  {
    const s=whiteDwarf(2,2,4000), mp=wdMassProfile(s);
    rel(mp[mp.length-1][1],s.MSun,1e-6,'the enclosed-mass profile ends at M');
    rel(mp[mp.length-1][0],s.R,1e-9,'and at R');
    let dec=true;
    const pr=wdProfile(s,80);
    for(let i=1;i<pr.length;i++) if(pr[i].rho>pr[i-1].rho+1e-12) dec=false;
    ok(dec,'density falls monotonically outward');
    ok(pr[pr.length-1].rho<1e-6*s.rhoC,'and reaches (essentially) zero at the surface');
    ok(s.compact<1e-3,'GM/Rc^2 stays small enough for Newton (got '
       +s.compact.toExponential(2)+')');
  }
  /* Sirius B: an independent measurement the ideal relation was not fitted to */
  {
    const xc=xcForMass(1.018,2), s=whiteDwarf(xc,2,6000);
    rel(s.MSun,1.018,1e-4,'the mass inversion round-trips');
    rel(s.RSun,0.008025,3e-3,'ideal R at Sirius B\'s mass = 0.008025 R_sun (scipy)');
    close(s.RSun/0.008098,1.0,0.02,
       'and it lands within 2% of the measured 0.008098 R_sun (Bond+ 2017)');
  }
  /* the catalogue, and the cut that had to be made on it */
  ok(WDS.length===143,'143 white dwarfs retained (got '+WDS.length+')');
  ok(WDS.filter(w=>w[2]>MCH).length===1,
     'exactly one retained star sits above M_Ch — and the catalogue flags it at 3.7 sigma');
  ok(WDS.every(w=>w[4]>0&&w[5]>=0&&w[3]>=0),'every retained star has a real M and R');

  /* ================= cosmology ===================================== */
  const C=makeCosmo(0.3,0.7,70);
  rel(distMod(0.01,C),33.1753183809,1e-9,'mu(z=0.01), Om=0.3 (scipy)');
  rel(distMod(0.1,C), 38.3152045744,1e-9,'mu(z=0.1) (scipy)');
  rel(distMod(0.5,C), 42.2611854215,1e-9,'mu(z=0.5) (scipy)');
  rel(distMod(1.0,C), 44.1002376555,1e-9,'mu(z=1) (scipy)');
  rel(distMod(2.0,C), 45.9571972527,1e-9,'mu(z=2) (scipy)');
  rel(distMod(0.5,makeCosmo(0.315,0.685,70)),42.2499825996,1e-9,
      'mu(z=0.5), Planck (scipy)');
  /* against every case with a closed form */
  for(const z of [0.001,0.01,0.1,0.5,1,2,5,10]){
    rel(lumD(z,makeCosmo(1,0,70)),dL_EdS(z,70),1e-9,'Einstein-de Sitter closed form, z='+z);
    rel(lumD(z,makeCosmo(0,0,70)),dL_Milne(z,70),1e-9,'Milne closed form, z='+z);
    rel(lumD(z,makeCosmo(0,1,70)),dL_deSitter(z,70),1e-9,'de Sitter closed form, z='+z);
  }
  /* the curvature branches must meet the flat case continuously — and the
     sinh and sin branches are different code */
  for(const eps of [1e-3,1e-5,1e-7]){
    const op=lumD(1,makeCosmo(0.3,0.7-eps,70));
    const cl=lumD(1,makeCosmo(0.3,0.7+eps,70));
    const fl=lumD(1,C);
    ok(op<fl&&fl<cl,'open < flat < closed at Ok = '+eps);
    rel((op+cl)/2,fl,1e-6,'and they bracket the flat value symmetrically at '+eps);
  }
  /* the low-z expansion, with q0 */
  for(const [Om,OL] of [[0.3,0.7],[1,0],[0,1]]){
    const q0=Om/2-OL, Cx=makeCosmo(Om,OL,70);
    for(const z of [1e-4,1e-3]){
      const ser=C_KMS/70*z*(1+(1-q0)*z/2-(1-q0-3*q0*q0+1)*z*z/6);
      rel(lumD(z,Cx),ser,1e-6,'low-z expansion Om='+Om+' z='+z);
    }
    rel(decel(0,Cx),q0,1e-12,'q0 = Om/2 - OL for Om='+Om);
  }
  /* Hubble's law itself */
  rel(lumD(1e-6,C)*70/C_KMS,1e-6,1e-5,'d_L -> cz/H0 as z -> 0');
  rel(lumD(1,makeCosmo(0.3,0.7,140))/lumD(1,C),0.5,1e-12,'d_L scales as 1/H0');
  /* Etherington: this is a theorem, not a fit */
  for(const z of [0.1,0.7,1.5,2.5])
    rel(lumD(z,C)/angD(z,C),Math.pow(1+z,2),1e-12,'d_L/d_A = (1+z)^2 at z='+z);
  /* monotonicity and the grid boundary — the interpolant must not have a
     seam where the tabulated range ends */
  {
    let mono=true, prev=-1;
    for(let i=1;i<=400;i++){ const d=lumD(i*0.01,C); if(d<=prev) mono=false; prev=d; }
    ok(mono,'d_L increases monotonically with z');
    rel(lumD(3.1999,C),lumD(3.2001,C),1e-4,'no seam at the end of the distance grid');
  }
  /* age: closed form vs the quadrature, and the EdS value */
  rel(ageAt(1,C),age_flatLCDM(C),1e-9,'flat-LCDM age matches asinh closed form');
  rel(ageAt(1,makeCosmo(0.315,0.685,70)),age_flatLCDM(makeCosmo(0.315,0.685,70)),1e-9,
      'and at Planck parameters');
  rel(ageGyr(C),13.4670,2e-4,'age = 13.467 Gyr at Om=0.3, H0=70 (scipy)');
  rel(ageGyr(makeCosmo(1,0,70)),9.3123,2e-4,'Einstein-de Sitter age = (2/3)/H0 (scipy)');
  rel(ageAt(1,makeCosmo(1,0,70)),2/3,1e-9,'which is exactly 2/3 in units of 1/H0');
  rel(lookbackGyr(0,C),0,1e-12,'zero lookback time at z = 0');
  ok(lookbackGyr(2,C)>lookbackGyr(1,C),'and it grows with redshift');
  /* the onset of acceleration, two ways */
  for(const Om of [0.3,0.315,0.334]){
    const Cx=makeCosmo(Om,1-Om,70);
    rel(zAccel(Cx),Math.pow(2*(1-Om)/Om,1/3)-1,1e-8,
        'z_acc matches (2 OL/Om)^{1/3}-1 at Om='+Om);
    close(decel(zAccel(Cx),Cx),0,1e-12,'and q vanishes there');
  }
  rel(zAccel(makeCosmo(0.3,0.7,70)),0.6710993117,1e-8,'z_acc = 0.6710993 (scipy)');

  /* ---- the dark-energy exponent, which needs w != -1 to be visible ----
     At w = -1 the factor (1+z)^{3(1+w)} is 1 whatever the 3 is, so every
     LCDM assertion above is blind to it.  A mutation sweep found this: the
     exponent could be changed to 2(1+w) and all 190-odd assertions passed.  */
  for(const w of [-0.8,-0.5,-1.2,-2.0]){
    for(const z of [0.3,1.0,2.0]){
      rel(lumD(z,makeCosmo(0,1,70,w)),dL_wOnly(z,70,w),1e-9,
          'dark-energy-only closed form at w='+w+', z='+z);
    }
  }
  rel(distMod(0.5,makeCosmo(0.3,0.7,70,-0.8)),42.1902779904,1e-9,
      'mu(z=0.5) at w=-0.8 (scipy)');
  rel(distMod(1.0,makeCosmo(0.3,0.7,70,-0.8)),44.0076344578,1e-9,
      'mu(z=1) at w=-0.8 (scipy)');
  rel(distMod(2.0,makeCosmo(0.3,0.7,70,-1.2)),46.0311814400,1e-9,
      'mu(z=2) at w=-1.2 (scipy)');
  rel(distMod(1.0,makeCosmo(0.3,0.7,70,-0.5)),43.8423604557,1e-9,
      'mu(z=1) at w=-0.5 (scipy)');
  for(const [w,q] of [[-0.8,-0.34],[-0.5,-0.025],[-1.2,-0.76]])
    close(decel(0,makeCosmo(0.3,0.7,70,w)),q,1e-12,
          'q0 = Om/2 + (1+3w)OL/2 at w='+w+' (scipy)');
  /* and w changes the answer at all — a mutant that ignored w entirely
     would otherwise pass the closed-form checks by symmetry */
  ok(Math.abs(distMod(1,makeCosmo(0.3,0.7,70,-0.8))
             -distMod(1,makeCosmo(0.3,0.7,70,-1.2)))>0.15,
     'w = -0.8 and w = -1.2 give measurably different distances');
  ok(zAccel(makeCosmo(1,0,70))===null,'a matter-only universe never accelerates');
  ok(decel(0,makeCosmo(1,0,70))>0,'and its q0 is positive');

  /* ================= the supernovae ================================ */
  ok(SNE.length===1701,'1701 Pantheon+ light curves (got '+SNE.length+')');
  ok(SNE.filter(s=>s[6]).length===77,'77 Cepheid calibrators carried but excluded');
  const smp=snSample();
  ok(smp.length===1580,'cosmology sample is 1580 after the z>0.01 cut (got '
     +smp.length+')');
  ok(smp.every(s=>!s[6]),'and contains no calibrator');
  {
    const f=fitOm(smp,70,-1);
    rel(f.Om,0.349077,3e-3,'the flat-LCDM fit returns Om = 0.3491 (scipy)');
    close(f.Om,0.334,0.03,'which sits near the published 0.334 +/- 0.018 (Brout+ 2022)');
    const eds=chi2Of(smp,makeCosmo(1,0,70),false).chi2;
    close(eds-f.chi2,662.5,3,'Einstein-de Sitter is worse by 662 in chi^2 (scipy)');
    ok(eds-f.chi2>100,'i.e. excluded overwhelmingly');
    /* the fit must not depend on H0, because M is marginalised out */
    rel(fitOm(smp,60,-1).Om,f.Om,1e-6,'and the fit is independent of H0 by construction');
  }
  /* standardisation is the whole trick, so assert that it works */
  {
    const Cb=makeCosmo(0.349,0.651,70);
    const raw=scatterOf(smp,Cb,true,0,0), std=scatterOf(smp,Cb,false);
    rel(raw,0.3186,5e-3,'raw scatter is 0.319 mag (scipy)');
    rel(std,0.1530,5e-3,'standardised scatter is 0.153 mag (scipy)');
    ok(raw/std>1.8,'standardising more than halves the scatter');
    /* and the Tripp correction with the fitted alpha/beta beats raw */
    ok(scatterOf(smp,Cb,true,0.135,2.568)<raw*0.60,
       'the stretch/colour correction alone recovers most of it');
  }
  rel(tripp(19,1.5,0.1,0.14,3.1),19+0.14*1.5-3.1*0.1,1e-12,'the Tripp formula');
  {
    const bins=binSNe(smp,26,false,0.135,2.568);
    ok(bins.length>10,'the binned diagram has enough bins ('+bins.length+')');
    ok(bins.reduce((a,b)=>a+b.n,0)<=smp.length,'and never invents supernovae');
    let inc=true;
    for(let i=1;i<bins.length;i++) if(bins[i].z<=bins[i-1].z) inc=false;
    ok(inc,'bins come out in increasing redshift');
    ok(bins.every(b=>isFinite(b.m)&&isFinite(b.e)&&b.e>0),'with finite means and errors');
  }

  /* ================= the light curves ============================== */
  ok(Object.keys(LCS).length===29,'29 Calan/Tololo light curves');
  {
    let npts=0;
    for(const k in LCS) npts+=LCS[k].pts.length;
    ok(npts===568,'568 photometric nights (got '+npts+')');
  }
  /* polyFit is exact on a polynomial of its own degree */
  {
    const xs=[-3,-1,0,2,4,7], truth=(t)=>2-0.5*t+0.25*t*t-0.01*t*t*t;
    const co=polyFit(xs,xs.map(truth),3);
    for(const t of [-2,0.5,3,6]) rel(polyVal(co,t),truth(t),1e-9,
      'polyFit reproduces a cubic exactly at t='+t);
  }
  {
    const wl=widthLuminosity();
    ok(wl.n===5,'exactly 5 light curves support a DIRECT Delta m15 (got '+wl.n+')');
    rel(wl.slope,0.7237,3e-3,'the width-luminosity slope measures 0.724 (scipy)');
    close(wl.slope,0.784,0.182,
      'which agrees with Hamuy+ 1996\'s published 0.784 +/- 0.182 inside their own error');
    rel(wl.zero,-19.2864,1e-3,'and the zero point is -19.286 mag (scipy)');
    ok(wl.rms<0.08,'the relation is tight: rms '+fmt(wl.rms,3)+' mag');
    ok(wl.slope>0,'brighter supernovae decline more slowly — the sign of the effect');
    const r=pearson(wl.rows.map(x=>x.dm15),wl.rows.map(x=>x.x1));
    close(r,-0.9903,0.01,'Delta m15 anticorrelates with SALT2 x1 at r = -0.99 (scipy)');
    ok(r<-0.9,'i.e. two groups measuring the same width by different methods agree');
  }
  /* the refusals matter as much as the measurements */
  {
    let meas=0, refused=0;
    for(const k in LCS){ if(measureDm15(k,1)) meas++; else refused++; }
    ok(meas===5&&refused===24,'24 light curves are refused, and that is the honest answer');
    ok(measureDm15('1990O',1)===null,
       'SN 1990O has no point before maximum, so it gets no decline rate');
    ok(measureDm15('1992bc',1)!==null,'SN 1992bc does, and gets one');
    ok(measureDm15('__nosuch__',1)===null,'an unknown object returns null, not a guess');
  }
  /* time dilation is a factor of (1+z) on the clock, nothing else */
  {
    const d=measureDm15('1992bc',1);
    ok(d!==null&&d.z>0,'and it carries the redshift it was measured at');
  }

  /* ================= panels and drawing state ====================== */
  {
    let bad=0, checked=0;
    for(const [v] of VIEWS){
      for(const ov of [{}, {xc:0.08},{xc:59},{mue:2.6},
                       {Om:0,OL:0,flat:false},{Om:1,OL:0,flat:false},
                       {Om:1.6,OL:1.6,flat:false},{wDE:-2},{wDE:-0.3},
                       {z:0},{z:2.5},{H0:55},{H0:85},{standardise:false},
                       {sn:'1990O'},{sn:'1992br'},{band:'I'},{showBands:false}]){
        const st=Object.assign({},DEFAULTS,{view:v},ov);
        if(st.flat) st.OL=1-st.Om;
        const M=buildModel(st);
        const txt=readoutHTML(M)+eqbarText(M)+tagText(M);
        checked++;
        if(/NaN|undefined|Infinity/.test(txt)) { bad++;
          if(bad<3) console.log('   dirty panel: view='+v+' '+JSON.stringify(ov)); }
      }
    }
    ok(bad===0,'every view x every extreme builds a clean panel ('+checked+' combinations)');
  }
  {
    /* no slider combination may produce a non-finite number anywhere the
       drawing will read */
    let bad=0;
    for(const xc of [0.08,0.5,3,20,59]) for(const mue of [2,2.3,2.6]){
      const M=buildModel(Object.assign({},DEFAULTS,{xc:xc,mue:mue}));
      if(!isFinite(M.star.MSun)||!isFinite(M.star.R)||!isFinite(M.MCh)) bad++;
      if(!M.prof.every(p=>isFinite(p.rho)&&isFinite(p.P)&&isFinite(p.gam)&&isFinite(p.x))) bad++;
      if(!M.seq.every(p=>isFinite(p.M)&&isFinite(p.R))) bad++;
    }
    ok(bad===0,'no star in the slider ranges produces a non-finite profile');
    bad=0; let bounced=0;
    for(const Om of [0,0.15,0.315,1,1.6]) for(const OL of [0,0.7,1.6])
      for(const w of [-2,-1,-0.3]){
        const M=buildModel(Object.assign({},DEFAULTS,{Om:Om,OL:OL,wDE:w,flat:false,
                                                     view:'ladder'}));
        if(!isFinite(M.chi2.chi2)||!isFinite(M.q0)) bad++;
        if(!M.bins.every(b=>isFinite(b.m)&&isFinite(b.z))) bad++;
        if(M.zTurn!=null){ bounced++; continue; }   /* see the block below */
        if(!isFinite(M.age)) bad++;
        for(const z of [0.01,0.5,2.2]) if(!isFinite(distMod(z,M.C))) bad++;
      }
    ok(bad===0,'and no ordinary cosmology in the slider ranges does either');
    ok(bounced>0,'some slider corners DO reverse the expansion ('+bounced+' of 45)');
  }
  /* a universe that turns around must be detected and said, never clamped */
  {
    const C2=makeCosmo(0,1.6,70,-2);            /* Ok = -0.6, steep w */
    ok(C2.zTurn!=null&&C2.zTurn>0,'a bouncing universe reports its turning redshift ('
       +fmt(C2.zTurn,4)+')');
    close(e2OfZ(C2.zTurn,C2),0,1e-9,'E^2 really does vanish there');
    ok(!isFinite(distMod(C2.zTurn*1.05,C2)),'and no distance is returned beyond it');
    ok(isFinite(distMod(C2.zTurn*0.5,C2)),'while inside it the distance is ordinary');
    const r=chi2Of(snSample(),C2,false);
    ok(r.dropped>0&&r.n>0,'the unreachable supernovae are dropped, not clamped ('
       +r.dropped+' dropped, '+r.n+' kept)');
    ok(isFinite(r.chi2),'and the chi^2 over what remains is finite');
    ok(makeCosmo(0.3,0.7,70).zTurn===null,'an ordinary LCDM universe never turns around');
    ok(makeCosmo(1,0,70).zTurn===null,'nor does Einstein-de Sitter');
  }
  /* ---- the density ramp must be ORDERABLE BY EYE ----
     NeonColors is an identity ramp: its lightness wanders, so a magnitude
     encoded straight into it cannot be read back.  densityCss() keeps the hue
     path and forces the luminance monotone.  Assert BOTH that the re-lit ramp
     rises and that the raw one does not, or the fix can be quietly undone. */
  {
    let mono=true, prev=-1;
    for(let i=0;i<=40;i++){
      const L=lumaOf(densityCss(i/40));
      if(L<=prev) mono=false;
      prev=L;
    }
    ok(mono,'the density ramp is strictly increasing in luminance');
    let rawMono=true; prev=-1;
    for(let i=0;i<=40;i++){
      const L=lumaOf(neonCss(i/40));
      if(L<=prev) rawMono=false;
      prev=L;
    }
    ok(!rawMono,'and the raw NeonColors ramp is NOT — which is why this exists');
    ok(lumaOf(densityCss(1))>3*lumaOf(densityCss(0)),
       'the bright end is unmistakably brighter than the dark end');
  }
  /* ---- inverted axes must still produce ticks ----
     ticksFor returns a single value when hi < lo, so a magnitude axis got one
     label and no grid.  axes() now sorts the range before asking. */
  {
    const up=ticksFor(14,24,5), dn=ticksFor(Math.min(24,14),Math.max(24,14),5);
    ok(up.length>=4,'an ordinary axis gets several ticks ('+up.length+')');
    ok(dn.length===up.length,'and a sorted inverted range gets the same ones');
    ok(ticksFor(24,14,5).length===1,
       'while the unsorted call really does collapse to one — the bug is real');
  }

  /* canvas text is not HTML: nothing that reaches fillText may carry an
     entity, and plain() is the only thing standing between them */
  {
    ok(plain('a &mdash; b')==='a — b','plain() decodes the entities this file uses');
    ok(plain('20&times;')==='20×','including times');
    let bad=0;
    for(const [v] of VIEWS){
      const M=buildModel(Object.assign({},DEFAULTS,{view:v}));
      if(/&[a-z]+;/.test(tagText(M).replace(/<[^>]*>/g,''))){ /* tag IS html */ }
    }
    ok(bad===0,'no canvas string carries an undecoded entity');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
