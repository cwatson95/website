      +(M.wl.slope!=null?row('slope dM<sub>B</sub>/dΔm₁₅', fmt(M.wl.slope,3))
          +row('scatter about it', fmt(M.wl.rms,3)+' mag'):'');
    note=d?'<p class="note">Δm₁₅ is how much the star fades in the <b>15 rest-frame days</b> '
        +'after maximum. Broad is bright.</p>'
      :'<p class="note">This light curve begins <b>after</b> maximum light, or stops before '
        +'+15 days. The decline rate is not in the data, and fitting harder does not put it '
        +'there. Hamuy et al. template-fitted these; this file does not.</p>';
  } else if(v==='ladder'||v==='expansion'){
    name=v==='ladder'?'the Hubble diagram':'the residual';
    sub=M.sample.length+' supernovae · z up to '+fmt(M.zmax,2);
    body=hd('the universe you chose')
      +row('Ω<sub>m</sub>', fmt(st.Om,3))
      +row('Ω<sub>Λ</sub>', fmt(M.OL,3))
      +row('Ω<sub>k</sub>', fmt(M.Ok,3), Math.abs(M.Ok)<1e-9?'good':'')
      +row('w', fmt(st.wDE,2))
      +row('H₀', fmt(st.H0,2)+' km/s/Mpc')
      +hd('what follows')
      +row('q₀', fmt(M.q0,4), M.q0<0?'good':'bad')
      +row('accelerating since', M.zAcc!=null?'z = '+fmt(M.zAcc,4):'never','')
      +row('age', fmt(M.age,3)+' Gyr')
      +hd('against the data')
      +row('supernovae used', M.chi2.n+(M.chi2.dropped?' of '+M.sample.length:''),
           M.chi2.dropped?'bad':'')
      +row('χ²/N', M.chi2.n?fmt(M.chi2.chi2/M.chi2.n,4):'—')
      +row('scatter', fmt(M.scatter,4)+' mag')
      +row('best fit Ω<sub>m</sub>', fmt(M.fit.Om,4),'good');
    if(M.zTurn!=null) note='<p class="note"><b>This universe turns around at z = '
      +fmt(M.zTurn,3)+'.</b> Redshifts beyond that were never reached, so '
      +M.chi2.dropped+' of the supernovae have no predicted distance at all. '
      +'They are dropped rather than clamped, and the curve simply stops.</p>';
    note=(note||'')+'<p class="note">The absolute magnitude is marginalised out, so this χ² measures '
      +'the <b>shape</b> of the distance–redshift curve and nothing about H₀. '
      +'Errors are Pantheon+’s diagonal only — the central value is a real check, '
      +'the width of the χ² valley is not.</p>';
    if(v==='expansion') note+='<p class="note">Einstein–de Sitter is worse by <b>Δχ² = '
      +fmt(M.fit.chi2EdS-M.fit.chi2,0)+'</b>.</p>';
  } else {
    name='redshift z = '+fmt(st.z,3);
    sub='what one number does to everything';
    body=hd('distances')
      +row('comoving', fmtDist(M.dC))
      +row('luminosity d<sub>L</sub>', fmtDist(M.dL))
      +row('angular diameter d<sub>A</sub>', fmtDist(M.dA))
      +row('d<sub>L</sub>/d<sub>A</sub>', fmt(Math.pow(1+st.z,2),4))
      +row('distance modulus', fmt(M.mu,3))
      +hd('the (1+z) factors')
      +row('wavelength ×', fmt(1+st.z,4))
      +row('clock rate ÷', fmt(1+st.z,4))
      +row('photon energy ÷', fmt(1+st.z,4))
      +row('arrival rate ÷', fmt(1+st.z,4))
      +row('flux dimmed by', fmt(M.dimming,4)+'×')
      +hd('time')
      +row('lookback', fmt(M.lookback,3)+' Gyr')
      +row('age then', fmt(M.age-M.lookback,3)+' Gyr');
    note='<p class="note">Two of the (1+z) factors are energy and rate; they are why '
      +'d<sub>L</sub> = (1+z)²d<sub>A</sub> and why a supernova at z = 1 is four times '
      +'fainter than its comoving distance alone would make it.</p>';
  }
  return '<div class="rname">'+name+'<small>'+sub+'</small></div><table>'+body
        +'</table>'+note;
}

/* ================================================================== *
 *  the equation bar                                                   *
 * ================================================================== */
function eqbarText(M){
  const st=M.st, v=st.view;
  if(v==='dwarf')
    return '<span class="lhs">dP/dr</span> = &minus; G M(r) ρ / r²'
      +' &nbsp;&nbsp;·&nbsp;&nbsp; P = A <span class="hl">f(x)</span>,'
      +' &nbsp; f(x) = x(2x²&minus;3)√(1+x²) + 3 sinh<sup>&minus;1</sup>x'
      +'<span class="sm">hydrostatic equilibrium against the pressure of a cold '
      +'degenerate electron gas — γ<sub>c</sub> = '+fmt(M.gammaC,3)
      +', on its way from 5/3 to 4/3</span>';
  if(v==='limit')
    return '<span class="lhs">M<sub>Ch</sub></span> = 4π (2A/πG)<sup>3/2</sup> B<sup>&minus;2</sup>'
      +' <span class="hl">ω₃</span> = <span class="hl2">'+sig(M.MCh,6)+'</span> M<sub>☉</sub>'
      +' &nbsp;&nbsp;(μ<sub>e</sub> = '+fmt(st.mue,2)+')'
      +'<span class="sm">ω₃ = '+fmt(M.le3.bracket,6)+' is the n = 3 Lane&ndash;Emden '
      +'constant, integrated in this page — the limit is that number, a few physical '
      +'constants, and nothing else</span>';
  if(v==='candle')
    return '<span class="lhs">M<sub>B</sub></span> = M₀ + <span class="hl">α</span>'
      +' (Δm₁₅ &minus; 1.1)'
      +(M.wl.slope!=null?' &nbsp;&nbsp;→&nbsp;&nbsp; α = <span class="hl2">'
        +fmt(M.wl.slope,3)+'</span> from '+M.nDirect+' light curves':'')
      +'<span class="sm">the width&ndash;luminosity relation: a broader light curve is a '
      +'brighter supernova, and that is what turns a bright explosion into a ruler</span>';
  if(v==='ladder')
    return '<span class="lhs">d<sub>L</sub>(z)</span> = (1+z) (c/H₀) ∫₀<sup>z</sup> '
      +'dz′ / <span class="hl">E(z′)</span>, &nbsp; E² = Ω<sub>m</sub>(1+z)³ '
      +'+ Ω<sub>k</sub>(1+z)² + Ω<sub>Λ</sub>(1+z)<sup>3(1+w)</sup>'
      +'<span class="sm">μ = 5 log₁₀(d<sub>L</sub>/10 pc) — the only thing a standard '
      +'candle measures, and the whole content of the Hubble diagram</span>';
  if(v==='shift')
    return '<span class="lhs">λ<sub>obs</sub></span> = (1+z) λ<sub>rest</sub>'
      +' &nbsp;·&nbsp; <span class="lhs">Δt<sub>obs</sub></span> = (1+z) Δt<sub>rest</sub>'
      +' &nbsp;·&nbsp; <span class="lhs">d<sub>L</sub></span> = '
      +'<span class="hl">(1+z)²</span> d<sub>A</sub>'
      +'<span class="sm">at z = '+fmt(st.z,3)+' a 6355 Å silicon line arrives at '
      +fmt(6355*(1+st.z),0)+' Å and a 15-day decline takes '+fmt(15*(1+st.z),1)
      +' days</span>';
  return '<span class="lhs">q(z)</span> = [½Ω<sub>m</sub>(1+z)³ + '
    +'½(1+3w)Ω<sub>Λ</sub>(1+z)<sup>3(1+w)</sup>] / E²'
    +' &nbsp;→&nbsp; q₀ = <span class="'+(M.q0<0?'hl':'hl2')+'">'+fmt(M.q0,3)+'</span>'
    +'<span class="sm">'+(M.zAcc!=null
      ?'negative means accelerating; it turned over at z = '+fmt(M.zAcc,3)
       +', about '+fmt(M.lookbackAcc||lookbackGyr(M.zAcc,M.C),1)+' Gyr ago'
      :'positive at every redshift — this universe has always been slowing down')
    +'</span>';
}

function tagText(M){
  const v=M.st.view;
  if(v==='dwarf') return '<b>the dwarf</b> &mdash; hydrostatic equilibrium, integrated here';
  if(v==='limit') return '<b>the limit</b> &mdash; 143 measured white dwarfs '
    +'(Bédard+ 2017) on a curve with no free parameters';
  if(v==='candle') return '<b>the candle</b> &mdash; Calán/Tololo photometry, '
    +'Hamuy+ 1996, raw';
  if(v==='ladder') return '<b>the ladder</b> &mdash; Pantheon+, '+M.sample.length
    +' supernovae (Brout+ 2022)';
  if(v==='shift') return '<b>the z-shift</b> &mdash; every (1+z) in the problem';
  return '<b>the expansion</b> &mdash; the residual, which is where the acceleration is';
}
/* ================================================================== *
 *  plotting extras                                                    *
 *                                                                     *
 *  clipTo() is not optional.  Everything drawn inside a plot box gets  *
 *  clipped to it unless there is a specific named reason not to — the  *
 *  exceptions are axis labels, titles and callouts placed ON the frame. *
 *  Unclipped model curves and unclipped published error bars have each  *
 *  escaped a plot box once in this collection already.                 *
 * ================================================================== */
/* The NeonColors ramp is an IDENTITY ramp: its lightness is not monotone, so
   encoding a magnitude in it directly loses the ordering by eye — the same
   trap the periodic table hit.  Keep the hue path and force the lightness to
   rise with the value by mixing toward the page background.  selfTest asserts
   the result is monotone in luminance AND that the raw ramp is not. */
function densityCss(t){
  const u=clamp(t,0,1);
  const c=neon(u);                                     /* 0..1 per channel */
  const L=0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
  const target=0.05+0.90*u;                            /* strictly increasing */
  let o;
  if(target<=L){                    /* darken: scaling is exactly linear in L */
    const s=target/Math.max(L,1e-9);
    o=[c[0]*s,c[1]*s,c[2]*s];
  } else {                          /* lighten toward white: L -> L+(1-L)s   */
    const s=(target-L)/Math.max(1-L,1e-9);
    o=[c[0]+(1-c[0])*s,c[1]+(1-c[1])*s,c[2]+(1-c[2])*s];
  }
  return 'rgb('+Math.round(255*clamp(o[0],0,1))+','+Math.round(255*clamp(o[1],0,1))
        +','+Math.round(255*clamp(o[2],0,1))+')';
}
function lumaOf(css){ const c=toRgb(css);
  return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255; }

function clipTo(ctx,b){
  ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
}
function sx(b,v,lo,hi){ return b.x+b.w*(v-lo)/((hi-lo)||1); }
function sy(b,v,lo,hi){ return b.y1-b.h*(v-lo)/((hi-lo)||1); }
function dot(ctx,X,Y,r,col){
  ctx.beginPath(); ctx.arc(X,Y,r,0,TAU); ctx.fillStyle=col; ctx.fill();
}
function errBarY(ctx,X,Y0,Y1,col,cap){
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X,Y0); ctx.lineTo(X,Y1);
  if(cap){ ctx.moveTo(X-2.5,Y0); ctx.lineTo(X+2.5,Y0);
           ctx.moveTo(X-2.5,Y1); ctx.lineTo(X+2.5,Y1); }
  ctx.stroke();
}
function legendAt(ctx,x,y,items){
  ctx.font='11px -apple-system, sans-serif'; ctx.textBaseline='middle';
  let yy=y;
  for(const [col,lab,dash] of items){
    ctx.strokeStyle=col; ctx.lineWidth=2;
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+16,yy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#8b93a6'; ctx.textAlign='left';
    ctx.fillText(plain(lab),x+22,yy);
    yy+=15;
  }
  return yy-y;
}
function logTick(t){
  const v=Math.pow(10,t);
  if(v>=1000) return fmt(v,0);
  if(v>=1) return fmt(v,v>=10?0:1);
  if(v>=0.01) return fmt(v,v>=0.1?2:3);
  return '10'+sup(Math.round(t));
}

/* ================================================================== *
 *  view A — the dwarf                                                 *
 * ================================================================== */
function drawDwarf(ctx,W,H,M,S){
  const st=M.st, s=M.star;
  const padL=18, split=Math.min(W*0.47,W-330);
  const Z=(S&&S.zoom)||1, PX=(S&&S.pan)?S.pan.x:0, PY=(S&&S.pan)?S.pan.y:0;
  /* ---------------- the star, to scale, with the Earth ------------ */
  const cx=padL+split/2+PX, cy=64+(H-190)/2+PY;
  const boxR=Math.min(split/2-30,(H-200)/2-10);
  /* one scale for both objects: whichever is bigger sets it.  Near the
     Chandrasekhar limit the star is only a couple of hundred kilometres
     across, so the view zooms — and the scale bar is redrawn from the same
     number, never from a remembered one. */
  const bigger=Math.max(s.R,R_EARTH);
  const mPerPx=bigger/(boxR*Z);
  const rStar=s.R/mPerPx, rEarth=R_EARTH/mPerPx;

  ctx.save();
  clipTo(ctx,box(padL,40,split,H-150));
  /* the star: shells coloured by density, drawn from the integrated
     profile — not a painted gradient */
  const prof=M.prof;
  for(let i=prof.length-1;i>=1;i--){
    const rr=prof[i].rf*rStar;
    const t=Math.pow(prof[i].rho/s.rhoC,0.22);
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,TAU);
    ctx.fillStyle=densityCss(t);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(cx,cy,rStar,0,TAU);
  ctx.strokeStyle='#e9edf6'; ctx.lineWidth=1.2; ctx.stroke();

  /* the Earth, same scale, drawn as an outline so it cannot be mistaken
     for part of the star */
  ctx.beginPath(); ctx.arc(cx,cy,rEarth,0,TAU);
  ctx.strokeStyle='#5ac8e0'; ctx.lineWidth=1.4; ctx.setLineDash([4,3]);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#5ac8e0'; ctx.font='11px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('Earth',cx,cy-rEarth-4);

  ctx.restore();
  ctx.save();
  /* a scale bar in kilometres, on the frame rather than in the zoomed
     content, so panning cannot carry it off the canvas */
  const barKm=Math.pow(10,Math.round(Math.log10(bigger/1e3/3/Z)));
  const barPx=barKm*1e3/mPerPx;
  const bx=padL+14, by=Math.min(64+(H-190)/2+boxR+22,H-138);
  ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+barPx,by);
  ctx.moveTo(bx,by-4); ctx.lineTo(bx,by+4);
  ctx.moveTo(bx+barPx,by-4); ctx.lineTo(bx+barPx,by+4); ctx.stroke();
  ctx.fillStyle='#8b93a6'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(sig(barKm,3)+' km',bx+barPx+8,by);

  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font='italic 14px Georgia,serif'; ctx.fillStyle='#cfd4de';
  ctx.fillText(sig(s.MSun,3)+' M☉  ·  '+fmtLen(s.R),padL+split/2,44);
  ctx.restore();

  caption(ctx,padL+8,H-118,
    'The star and the Earth are drawn to the SAME scale — this is not an '
    +'exaggeration'+(Math.abs(Z-1)>0.01?', though the whole picture is zoomed ×'
      +sig(Z,3):'')+'. Shading is the density from the integrated profile, '
    +fmtDens(s.rhoC)+' at the centre falling to zero at the surface.',
    split-24,'#767e92');

  /* ---------------- the profiles ---------------------------------- */
  const bx0=split+52, bw=W-bx0-26;
  const b1=box(bx0,58,bw,(H-190)*0.52);
  const b2=box(bx0,58+(H-190)*0.52+52,bw,(H-190)*0.34);

  axes(ctx,b1,0,1,-6,0.15,{title:'what the ODE returns',
    xlab:'r / R', ylab:'log₁₀ of the central value',
    yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b1);
  const rf=M.prof.map(p=>p.rf);
  const lg=(a,eps)=>Math.log10(Math.max(a,eps));
  polyline(ctx,b1,rf,M.prof.map(p=>lg(p.rho/s.rhoC,1e-7)),0,1,-6,0.15,'#b8ec4c',2);
  polyline(ctx,b1,rf,M.prof.map(p=>lg(p.P/s.pC,1e-7)),0,1,-6,0.15,'#cd35c4',2);
  polyline(ctx,b1,rf,M.prof.map(p=>lg(p.x/st.xc,1e-7)),0,1,-6,0.15,'#5ac8e0',2);
  /* enclosed mass, on the same normalised axis */
  const mp=M.massProf;
  polyline(ctx,b1,mp.map(p=>p[0]/s.R),mp.map(p=>lg(p[1]/s.MSun,1e-7)),
           0,1,-6,0.15,'#e8843a',1.6,[5,3]);
  ctx.restore();
  legendAt(ctx,b1.x+10,b1.y+14,[['#b8ec4c','ρ/ρ_c'],['#cd35c4','P/P_c'],
    ['#5ac8e0','x/x_c'],['#e8843a','M(r)/M',[5,3]]]);

  axes(ctx,b2,0,1,1.28,1.72,{title:'the adiabatic index, and why there is a limit',
    xlab:'r / R', ylab:'d ln P / d ln ρ', yfmt:t=>fmt(t,2)});
  ctx.save(); clipTo(ctx,b2);
  polyline(ctx,b2,rf,M.prof.map(p=>p.gam),0,1,1.28,1.72,'#b8ec4c',2.2);
  for(const [g,col,lab] of [[5/3,'#4a5568','5/3 — non-relativistic'],
                            [4/3,'#e8843a','4/3 — the collapse']]){
    const Y=sy(b2,g,1.28,1.72);
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(b2.x,Y); ctx.lineTo(b2.x1,Y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=col; ctx.font='10.5px -apple-system,sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText(plain(lab),b2.x1-5,Y-2);
  }
  ctx.restore();
  caption(ctx,b2.x,b2.y1+34,
    'γ is 5/3 where the electrons are slow and 4/3 where they are relativistic. '
    +'At 4/3 the pressure and the weight scale the same way with radius, so squeezing '
    +'the star changes nothing in its favour — and the mass at which the whole star '
    +'reaches it is the Chandrasekhar limit.',bw,'#767e92');
}

/* ================================================================== *
 *  view B — the limit                                                 *
 * ================================================================== */
function drawLimit(ctx,W,H,M){
  const st=M.st;
  const b=box(74,54,W-120,(H-150)*0.60);
  const b2=box(74,54+(H-150)*0.60+62,(W-140)*0.46,(H-150)*0.28);
  const Mhi=Math.max(1.62,M.MCh*1.06);
  const Rhi=0.0285;
  axes(ctx,b,0,Mhi,0,Rhi,{title:'the mass–radius relation, and where it stops',
    xlab:'mass  M / M☉', ylab:'radius  R / R☉',
    xfmt:t=>fmt(t,1), yfmt:t=>fmt(t,3)});

  ctx.save(); clipTo(ctx,b);
  /* the forbidden region */
  const XCh=sx(b,M.MCh,0,Mhi);
  if(XCh<b.x1){
    ctx.fillStyle='rgba(205,53,196,0.07)';
    ctx.fillRect(XCh,b.y,b.x1-XCh,b.h);
  }
  /* the measured white dwarfs */
  if(st.showWDs){
    for(const w of M.wds){
      const X=sx(b,w[2],0,Mhi), Y=sy(b,w[4],0,Rhi);
      if(X<b.x-8||X>b.x1+8) continue;
      const bad=w[6]>3;
      errBarY(ctx,X,sy(b,w[4]-w[5],0,Rhi),sy(b,w[4]+w[5],0,Rhi),
              bad?'rgba(232,132,58,0.30)':'rgba(140,150,175,0.34)');
      ctx.strokeStyle=bad?'rgba(232,132,58,0.30)':'rgba(140,150,175,0.34)';
      ctx.beginPath(); ctx.moveTo(sx(b,w[2]-w[3],0,Mhi),Y);
      ctx.lineTo(sx(b,w[2]+w[3],0,Mhi),Y); ctx.stroke();
      dot(ctx,X,Y,2.1,bad?'#e8843a':'#aab3c6');
    }
  }
  /* the ideal relation */
  if(st.showIdeal)
    polyline(ctx,b,M.seq.map(p=>p.M),M.seq.map(p=>p.R),0,Mhi,0,Rhi,'#b8ec4c',2.4);
  if(st.showIron)
    polyline(ctx,b,M.seqIron.map(p=>p.M),M.seqIron.map(p=>p.R),0,Mhi,0,Rhi,
             '#e8843a',1.8,[6,4]);
  /* the limit */
  ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(XCh,b.y); ctx.lineTo(XCh,b.y1); ctx.stroke();
  ctx.setLineDash([]);
  /* Sirius B — measured, and where the ideal curve puts it */
  if(st.showSirius){
    const S=M.sirius;
    const X=sx(b,S.M,0,Mhi), Y=sy(b,S.R,0,Rhi);
    errBarY(ctx,X,sy(b,S.R-S.dR,0,Rhi),sy(b,S.R+S.dR,0,Rhi),'#5ac8e0',true);
    dot(ctx,X,Y,4.2,'#5ac8e0');
    dot(ctx,sx(b,M.siriusIdeal.MSun,0,Mhi),sy(b,M.siriusIdeal.RSun,0,Rhi),3,'#fff');
  }
  /* the live star */
  dot(ctx,sx(b,M.star.MSun,0,Mhi),sy(b,M.star.RSun,0,Rhi),4.5,'#fff');
  ctx.beginPath(); ctx.arc(sx(b,M.star.MSun,0,Mhi),sy(b,M.star.RSun,0,Rhi),7.5,0,TAU);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.restore();

  /* callouts, deliberately on the frame rather than clipped into it */
  /* the readout panel floats over the top-right of the stage, so these two
     labels sit LOW on the limit line rather than at the top of the box */
  ctx.fillStyle='#cd35c4'; ctx.font='italic 12px Georgia,serif';
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  if(XCh<b.x1-6) ctx.fillText('M_Ch = '+sig(M.MCh,5)+' M☉',
                              Math.min(XCh-6,b.x1-6),b.y1-10);
  ctx.textAlign='left';
  if(XCh<b.x1-70) ctx.fillText('no solution',XCh+7,b.y1-10);
  if(st.showSirius){
    ctx.fillStyle='#5ac8e0'; ctx.font='11.5px -apple-system,sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText('Sirius B (Bond+ 2017)',
                 clamp(sx(b,M.sirius.M,0,Mhi)-8,b.x+70,b.x1-6),
                 sy(b,M.sirius.R,0,Rhi)-6);
  }
  legendAt(ctx,b.x+12,b.y+b.h-52,[
    ['#b8ec4c','ideal T = 0, mu_e = '+fmt(st.mue,2)],
    ['#e8843a','mu_e = 2.15 (iron)',[6,4]],
    ['#aab3c6','Bedard+ 2017, 143 white dwarfs']]);

  /* ---- the log-log panel: the two power laws ---------------------- */
  const lx0=-1.35, lx1=Math.log10(Math.max(1.55,M.MCh));
  const ly0=-2.6, ly1=-1.15;
  axes(ctx,b2,lx0,lx1,ly0,ly1,{title:'the same curve, logarithmic',
    xlab:'log₁₀ M/M☉', ylab:'log₁₀ R/R☉', xfmt:t=>fmt(t,1), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  polyline(ctx,b2,M.seq.map(p=>Math.log10(p.M)),M.seq.map(p=>Math.log10(p.R)),
           lx0,lx1,ly0,ly1,'#b8ec4c',2.2);
  /* the non-relativistic asymptote R ∝ M^{-1/3}, anchored on the
     lightest computed star so it is the curve's own limit, not a fit */
  const a0=M.seq[0];
  const xs=[lx0,lx1], ys=xs.map(t=>Math.log10(a0.R)-(t-Math.log10(a0.M))/3);
  polyline(ctx,b2,xs,ys,lx0,lx1,ly0,ly1,'#5ac8e0',1.4,[5,4]);
  ctx.restore();
  ctx.fillStyle='#5ac8e0'; ctx.font='11px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('slope −1/3  (n = 3/2 polytrope)',b2.x+8,b2.y+8);

  const cx0=b2.x1+38;
  caption(ctx,cx0,b2.y-4,
    'A star held up by degenerate electrons gets SMALLER as you add mass — the '
    +'non-relativistic branch is R ∝ M^(−1/3), the dashed line. But adding mass raises '
    +'the Fermi momentum, and once the electrons move near c the pressure softens from '
    +'ρ^(5/3) to ρ^(4/3). The radius then falls off a cliff, and at M_Ch = '+sig(M.MCh,5)
    +' M☉ there is no equilibrium at all. '
    +(M.nAboveLimit?('Exactly '+M.nAboveLimit+' catalogue star sits above it, and the '
      +'catalogue’s own consistency flag puts it 3.7σ off the relation.'):'')
    ,W-cx0-24,'#767e92');
  caption(ctx,cx0,b2.y+72,
    'The green curve is the IDEAL zero-temperature relation, with no envelope and no '
    +'finite temperature. Real white dwarfs carry a thin non-degenerate skin and sit a '
    +'median 1.5% above it; Bédard et al. test their stars against detailed envelope '
    +'models, which is a different and better curve than this one.',
    W-cx0-24,'#5f6678');
}

/* ================================================================== *
 *  view C — the candle                                                *
 * ================================================================== */
function drawCandle(ctx,W,H,M){
  const st=M.st;
  const b=box(74,54,W-110,(H-160)*0.56);
  const pts=M.lcPts;
  if(!pts.length){
    caption(ctx,80,120,'No photometry for this object in this band.',W-160,'#e8843a');
    return;
  }
  /* magnitudes: SMALLER is brighter, so the axis is inverted and the
     canvas says so rather than leaving the reader to infer it */
  /* A Type Ia is interesting for about six weeks and then observed for a
     year.  Drawing the full baseline puts the peak and the whole decline
     rate into the first tenth of the box, which is the "fit each axis to the
     structure that axis contains" trap.  Default to the informative window
     and SAY how many nights are outside it. */
  let t0=Infinity,t1=-Infinity;
  const showBands=st.showBands?BANDS:[BANDS.find(x=>x[0]===st.band)];
  for(const [nm,bi,col] of showBands){
    for(const p of lcPoints(M.sn,bi)){
      t0=Math.min(t0,p[0]); t1=Math.max(t1,p[0]);
    }
  }
  let tpk=t0;
  { const P=lcPoints(M.sn,M.bandIdx).length?lcPoints(M.sn,M.bandIdx):pts;
    let ip=0; for(let i=1;i<P.length;i++) if(P[i][1]<P[ip][1]) ip=i;
    tpk=P[ip][0]; }
  const tFull=st.fullBaseline;
  const tlo=tFull?t0-3:Math.max(t0-3,tpk-16);
  const thi=tFull?t1+3:Math.min(t1+3,tpk+72);
  let m0=Infinity,m1=-Infinity, nOut=0;
  for(const [nm,bi,col] of showBands){
    for(const p of lcPoints(M.sn,bi)){
      if(p[0]<tlo||p[0]>thi){ nOut++; continue; }
      m0=Math.min(m0,p[1]); m1=Math.max(m1,p[1]);
    }
  }
  if(!isFinite(m0)){ m0=14; m1=24; }
  const pad=(m1-m0)*0.10+0.15;
  const mlo=m1+pad, mhi=m0-pad;                       /* note: inverted */
  axes(ctx,b,tlo,thi,mlo,mhi,{title:'SN '+M.sn+' — Calán/Tololo photometry, as measured',
    xlab:'days since first observation', ylab:'apparent magnitude  (brighter ↑)',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,1)});
  if(nOut){
    ctx.fillStyle='#6b7284'; ctx.font='11px -apple-system,sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText(nOut+' later night'+(nOut>1?'s':'')+' outside this window',
                 b.x1,b.y-6);
  }
  ctx.save(); clipTo(ctx,b);
  for(const [nm,bi,col] of showBands){
    const P=lcPoints(M.sn,bi);
    if(!P.length) continue;
    const dim=(nm!==st.band && st.showBands);
    const cc=dim?rgba(col,0.34):col;
    for(const p of P){
      const X=sx(b,p[0],tlo,thi), Y=sy(b,p[1],mlo,mhi);
      errBarY(ctx,X,sy(b,p[1]-p[2],mlo,mhi),sy(b,p[1]+p[2],mlo,mhi),cc);
      dot(ctx,X,Y,dim?1.8:2.6,cc);
    }
    polyline(ctx,b,P.map(p=>p[0]),P.map(p=>p[1]),tlo,thi,mlo,mhi,cc,dim?1:1.3);
  }
  /* the fitted cubic and the Delta m15 construction */
  const d=M.dm15;
  if(d && st.showFit){
    const zs=1+(d.z||0);
    const xs=[],ys=[];
    for(let i=0;i<=80;i++){
      const t=d.span[0]+(d.span[1]-d.span[0])*i/80;
      xs.push(t+d.tref); ys.push(polyVal(d.co,t));
    }
    polyline(ctx,b,xs,ys,tlo,thi,mlo,mhi,'#fff',1.6,[4,3]);
    const Xa=sx(b,d.t0,tlo,thi), Ya=sy(b,d.Bmax,mlo,mhi);
    const Xb=sx(b,d.t0+15*zs,tlo,thi), Yb=sy(b,d.Bmax+d.dm15,mlo,mhi);
    ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(Xa,Ya); ctx.lineTo(Xb,Ya); ctx.lineTo(Xb,Yb); ctx.stroke();
    dot(ctx,Xa,Ya,3.4,'#fff'); dot(ctx,Xb,Yb,3.4,'#cd35c4');
    ctx.fillStyle='#cd35c4'; ctx.font='11.5px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('Δm₁₅ = '+fmt(d.dm15,2),Xb+6,(Ya+Yb)/2);
  }
  ctx.restore();
  if(st.showBands)
    legendAt(ctx,b.x+12,b.y1-16-15*BANDS.length,BANDS.map(x=>[x[2],x[0]]));
  if(!d){
    /* bottom LEFT: the readout panel covers the top right of the stage, and
       this sentence is the most important thing in the view when it appears */
    ctx.fillStyle='#e8843a'; ctx.font='11.5px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('no direct Δm₁₅ — this curve does not start before maximum',
                 b.x+90,b.y1-10);
  }

  /* ---- the width-luminosity relation ----------------------------- */
  const bw=(W-150)/2;
  const b2=box(74,b.y1+64,bw,(H-160)*0.30);
  const b3=box(74+bw+56,b.y1+64,bw,(H-160)*0.30);
  const wl=M.wl;
  const dlo=0.75,dhi=1.85, Mlo=-18.6,Mhi=-19.65;
  axes(ctx,b2,dlo,dhi,Mlo,Mhi,{title:'broad is bright',
    xlab:'Δm₁₅(B)', ylab:'M_B', xfmt:t=>fmt(t,1), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  if(wl.slope!=null){
    /* Hamuy's published slope, drawn through this file's own zero point so
       the comparison is of SLOPE only — their zero point is on H0 = 65 */
    const hs=0.784;
    polyline(ctx,b2,[dlo,dhi],[wl.zero+hs*(dlo-1.1),wl.zero+hs*(dhi-1.1)],
             dlo,dhi,Mlo,Mhi,'#e8843a',1.5,[6,4]);
    polyline(ctx,b2,[dlo,dhi],[wl.zero+wl.slope*(dlo-1.1),wl.zero+wl.slope*(dhi-1.1)],
             dlo,dhi,Mlo,Mhi,'#b8ec4c',2);
    for(const r of wl.rows){
      const X=sx(b2,r.dm15,dlo,dhi), Y=sy(b2,r.MB,Mlo,Mhi);
      dot(ctx,X,Y,3.6,r.name===M.sn?'#fff':'#5ac8e0');
    }
  }
  ctx.restore();
  if(wl.slope!=null)
    legendAt(ctx,b2.x+10,b2.y+b2.h-34,[
      ['#b8ec4c','measured here: '+fmt(wl.slope,3)],
      ['#e8843a','Hamuy+ 1996: 0.784 +/- 0.182',[6,4]]]);

  /* ---- the same width, two independent groups -------------------- */
  axes(ctx,b3,-2.6,1.4,0.75,1.85,{title:'two measurements of one width',
    xlab:'SALT2 x₁  (Pantheon+)', ylab:'Δm₁₅(B)  (measured here)',
    xfmt:t=>fmt(t,1), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b3);
  for(const r of wl.rows){
    if(r.x1==null) continue;
    dot(ctx,sx(b3,r.x1,-2.6,1.4),sy(b3,r.dm15,0.75,1.85),3.6,
        r.name===M.sn?'#fff':'#cd35c4');
  }
  ctx.restore();
  if(wl.rows.length>2){
    const rr=pearson(wl.rows.map(r=>r.dm15),wl.rows.map(r=>r.x1));
    ctx.fillStyle='#8b93a6'; ctx.font='11px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('r = '+fmt(rr,4),b3.x+10,b3.y+10);
  }
  caption(ctx,b3.x+10,b3.y1+34,
    'Only '+M.nDirect+' of the '+M.nLC+' light curves start before maximum AND reach past '
    +'+15 rest-frame days, so only '+M.nDirect+' carry a decline rate that can be measured '
    +'rather than modelled. Hamuy et al. say the same of the same data.',
    W-b3.x-36,'#767e92');
}

/* ================================================================== *
 *  view D — the ladder                                                *
 * ================================================================== */
function hubbleAxes(M){
  const zlo=Math.log10(0.009), zhi=Math.log10(2.6);
  return {zlo,zhi};
}
function drawLadder(ctx,W,H,M){
  const st=M.st;
  const {zlo,zhi}=hubbleAxes(M);
  const b=box(80,54,W-120,(H-160)*0.62);
  const b2=box(80,54+(H-160)*0.62+52,W-120,(H-160)*0.26);
  const mlo=13.2,mhi=27.2;
  const zt=[-2,-1.69897,-1.30103,-1,-0.69897,-0.30103,0,0.30103];
  axes(ctx,b,zlo,zhi,mlo,mhi,{title:'the Hubble diagram — '+M.sample.length
      +' Type Ia supernovae',
    xlab:'redshift z   (logarithmic)', ylab:'peak magnitude  m_B',
    xticks:zt, xfmt:logTick, yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  const off=fitOffset(M.sample,M.C,!st.standardise,st.alpha,st.beta);
  if(st.showSNe){
    for(const s of M.sample){
      const m=st.standardise?s[1]:tripp(s[5],s[3],s[4],st.alpha,st.beta);
      dot(ctx,sx(b,Math.log10(s[0]),zlo,zhi),sy(b,m,mlo,mhi),1.5,
          'rgba(140,152,180,0.42)');
    }
  }
  /* the model curves */
  const mk=(C,col,lw,dash)=>{
    const xs=[],ys=[];
    for(let i=0;i<=180;i++){
      const z=Math.pow(10,zlo+(zhi-zlo)*i/180);
      xs.push(Math.log10(z)); ys.push(distMod(z,C)+off);
    }
    polyline(ctx,b,xs,ys,zlo,zhi,mlo,mhi,col,lw,dash);
  };
  if(st.showAlt){
    mk(makeCosmo(1,0,st.H0,-1),'#e8843a',1.5,[6,4]);
    mk(makeCosmo(0,0,st.H0,-1),'#7f8bd8',1.5,[2,3]);
  }
  mk(M.C,'#b8ec4c',2.4);
  if(st.showBins){
    for(const q of M.bins){
      const X=sx(b,Math.log10(q.z),zlo,zhi);
      errBarY(ctx,X,sy(b,q.m-q.e,mlo,mhi),sy(b,q.m+q.e,mlo,mhi),'#fff',true);
      dot(ctx,X,sy(b,q.m,mlo,mhi),3,'#fff');
    }
  }
  ctx.restore();
  legendAt(ctx,b.x+14,b.y+18,[['#b8ec4c','your universe'],
    ['#e8843a','Einstein-de Sitter',[6,4]],['#7f8bd8','empty',[2,3]],
    ['#fff','binned']]);

  /* ---- residuals -------------------------------------------------- */
  const rlo=-0.72,rhi=0.72;
  axes(ctx,b2,zlo,zhi,rlo,rhi,{title:'residual about your universe  '
      +'(scatter '+fmt(M.scatter,3)+' mag'
      +(st.standardise?', standardised':', RAW — not standardised')+')',
    xlab:'redshift z', ylab:'Δm  [mag]', xticks:zt, xfmt:logTick,
    yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(b2.x,sy(b2,0,rlo,rhi)); ctx.lineTo(b2.x1,sy(b2,0,rlo,rhi));
  ctx.stroke();
  if(st.showSNe){
    for(const s of M.sample){
      const m=st.standardise?s[1]:tripp(s[5],s[3],s[4],st.alpha,st.beta);
      dot(ctx,sx(b2,Math.log10(s[0]),zlo,zhi),
          sy(b2,m-distMod(s[0],M.C)-off,rlo,rhi),1.4,'rgba(140,152,180,0.42)');
    }
  }
  for(const q of M.bins){
    const X=sx(b2,Math.log10(q.z),zlo,zhi);
    const r=q.m-distMod(q.z,M.C)-off;
    errBarY(ctx,X,sy(b2,r-q.e,rlo,rhi),sy(b2,r+q.e,rlo,rhi),'#fff',true);
    dot(ctx,X,sy(b2,r,rlo,rhi),3,'#fff');
  }
  ctx.restore();
  caption(ctx,b2.x,b2.y1+34,
    'Standardising with the light-curve width and colour drops the scatter from '
    +fmt(M.scatterRaw,3)+' to '+fmt(M.scatterStd,3)+' magnitudes — a factor '
    +fmt(M.scatterRaw/M.scatterStd,2)+'. That is the whole reason a supernova is a '
    +'ruler and not just a bright light. The absolute magnitude is marginalised out, '
    +'so nothing here measures H₀.',W-b2.x-30,'#767e92');
}

/* ================================================================== *
 *  view E — the z-shift                                               *
 * ================================================================== */
function drawShift(ctx,W,H,M){
  const st=M.st, z=st.z, zp=1+z;
  const bw=W-140;
  const hh=(H-190)/3;
  const b1=box(84,52,bw,hh*0.86);
  const b2=box(84,52+hh+30,bw,hh*0.86);
  const b3=box(84,52+2*hh+60,bw,hh*0.80);

  /* ---- 1. wavelength --------------------------------------------- */
  const llo=3200, lhi=Math.max(9600,9200*zp);
  axes(ctx,b1,llo,lhi,0,1,{title:'the spectrum — λ_obs = (1+z) λ_rest',
    xlab:'observed wavelength [Å]', xfmt:t=>fmt(t,0), yticks:[]});
  ctx.save(); clipTo(ctx,b1);
  /* the visible band, as a reminder of what "optical" means */
  for(let l=Math.max(llo,3800);l<Math.min(lhi,7000);l+=12){
    ctx.fillStyle=rgba(spectralHex(l/10),0.20);   /* the helper takes NM */
    ctx.fillRect(sx(b1,l,llo,lhi),b1.y,sx(b1,l+12,llo,lhi)-sx(b1,l,llo,lhi)+1,b1.h);
  }
  for(const L of SNIA_LINES){
    for(const [lam,col,al] of [[L.lam,'#5ac8e0',0.42],[L.lam*zp,'#cd35c4',1]]){
      if(lam<llo||lam>lhi) continue;
      const X=sx(b1,lam,llo,lhi);
      ctx.strokeStyle=rgba(col,al); ctx.lineWidth=al>0.5?1.6:1;
      ctx.beginPath(); ctx.moveTo(X,b1.y+(al>0.5?4:b1.h*0.45));
      ctx.lineTo(X,b1.y1-4); ctx.stroke();
    }
    const X=sx(b1,L.lam*zp,llo,lhi);
    if(L.lam===6355 && X>b1.x && X<b1.x1){
      ctx.fillStyle='#cd35c4'; ctx.font='11.5px -apple-system,sans-serif';
      ctx.textAlign=X>b1.x1-90?'right':'left'; ctx.textBaseline='top';
      ctx.fillText('Si II 6355 → '+fmt(L.lam*zp,0)+' Å',X+(X>b1.x1-90?-5:5),b1.y+6);
    }
  }
  ctx.restore();
  legendAt(ctx,b1.x+10,b1.y1-26,[['rgba(90,200,224,0.6)','rest frame'],
    ['#cd35c4','observed at z = '+fmt(z,3)]]);

  /* ---- 2. time dilation ------------------------------------------ */
  const d=M.dm15B||measureDm15('1992bc',1);
  const tlo=-14, thi=Math.max(46,42*zp);
  axes(ctx,b2,tlo,thi,2.6,-0.35,{title:'the clock — a 15-day decline takes '
      +fmt(15*zp,1)+' observed days',
    xlab:'days from maximum, as observed', ylab:'Δ magnitude',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  if(d){
    for(const [stretch,col,lw,dash] of [[1,'#5ac8e0',1.6,[5,4]],[zp,'#b8ec4c',2.4,null]]){
      const xs=[],ys=[];
      for(let i=0;i<=100;i++){
        const tr=-10+ (d.span[1]-d.t0+d.tref+10)*i/100;
        if(tr>32) break;
        xs.push(tr*stretch); ys.push(polyVal(d.co,d.t0-d.tref+tr)-d.Bmax);
      }
      polyline(ctx,b2,xs,ys,tlo,thi,2.6,-0.35,col,lw,dash);
    }
    for(const [stretch,col] of [[1,'#5ac8e0'],[zp,'#b8ec4c']]){
      const X=sx(b2,15*stretch,tlo,thi), Y=sy(b2,d.dm15,2.6,-0.35);
      ctx.strokeStyle=rgba(col,0.7); ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(X,b2.y); ctx.lineTo(X,Y); ctx.stroke();
      ctx.setLineDash([]);
      dot(ctx,X,Y,3.2,col);
    }
  }
  ctx.restore();
  legendAt(ctx,b2.x+10,b2.y+16,[['#5ac8e0','rest frame',[5,4]],
    ['#b8ec4c','stretched by 1+z = '+fmt(zp,3)]]);

  /* ---- 3. the (1+z) budget --------------------------------------- */
  ctx.save();
  frame(ctx,b3,'#242a3a');
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('where every factor of (1+z) goes',b3.x,b3.y-6);
  const items=[
    ['comoving distance', 'D_M', fmtDist(transverseD(z,M.C)), '#5ac8e0',
     'set by the integral of dz/E — no (1+z) of its own'],
    ['photon energy', '÷ (1+z)', fmt(1/zp,4), '#e8843a',
     'each photon is redshifted'],
    ['arrival rate', '÷ (1+z)', fmt(1/zp,4), '#e8843a',
     'they arrive more slowly, by the same factor'],
    ['luminosity distance', 'd_L = (1+z) D_M', fmtDist(M.dL), '#b8ec4c',
     'the two above are why flux carries (1+z)^-2 beyond the geometry'],
    ['angular diameter', 'd_A = D_M/(1+z)', fmtDist(M.dA), '#cd35c4',
     'so d_L/d_A = (1+z)^2 = '+fmt(zp*zp,3)+' — the Etherington relation'],
  ];
  const rowH=Math.min(26,(b3.h-14)/items.length);
  ctx.font='12px -apple-system, sans-serif';
  for(let i=0;i<items.length;i++){
    const y=b3.y+9+i*rowH;
    const [lab,sym,val,col,why]=items[i];
    ctx.fillStyle=col; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(lab),b3.x+10,y);
    ctx.fillStyle='#8b93a6'; ctx.font='11.5px "SF Mono", Menlo, monospace';
    ctx.fillText(plain(sym),b3.x+150,y);
    ctx.fillStyle='#cfd4de'; ctx.textAlign='right';
    ctx.fillText(plain(val),b3.x+330,y);
    ctx.fillStyle='#6b7284'; ctx.textAlign='left';
    ctx.font='11px -apple-system, sans-serif';
    const room=b3.x1-b3.x-350;
    const ls=wrapText(ctx,why,room);
    ctx.fillText(ls[0]+(ls.length>1?'…':''),b3.x+346,y);
    ctx.font='12px -apple-system, sans-serif';
  }
  ctx.restore();
}
/* a crude but honest wavelength→colour, only ever used as a background
   wash behind the spectrum axis; it is decoration, and labelled as such */
/* wavelength in NANOMETRES -> an approximate sRGB.  Feeding it angstrom
   painted the whole optical band solid red, because every angstrom value is
   past the 645 nm branch.  Decoration only, and labelled as such. */
function spectralHex(l){
  let r=0,g=0,b=0;
  if(l<440){ r=(440-l)/(440-380)*0.4; b=1; }
  else if(l<490){ g=(l-440)/50; b=1; }
  else if(l<510){ g=1; b=(510-l)/20; }
  else if(l<580){ r=(l-510)/70; g=1; }
  else if(l<645){ r=1; g=(645-l)/65; }
  else { r=1; }
  const q=(v)=>('0'+Math.round(255*clamp(v,0,1)).toString(16)).slice(-2);
  return '#'+q(r)+q(g)+q(b);
}

/* ================================================================== *
 *  view F — the expansion                                             *
 * ================================================================== */
function drawExpansion(ctx,W,H,M){
  const st=M.st;
  const {zlo,zhi}=hubbleAxes(M);
  const b=box(80,54,W-120,(H-160)*0.56);
  const bw=(W-160)/2;
  const b2=box(80,54+(H-160)*0.56+58,bw,(H-160)*0.32);
  const b3=box(80+bw+62,54+(H-160)*0.56+58,bw,(H-160)*0.32);

  /* ---- the residual against an empty universe: the 1998 plot ------ */
  const ref=makeCosmo(0,0,st.H0,-1);
  const off=fitOffset(M.sample,ref,!st.standardise,st.alpha,st.beta);
  const rlo=-0.55,rhi=0.62;
  const zt=[-2,-1.69897,-1.30103,-1,-0.69897,-0.30103,0,0.30103];
  axes(ctx,b,zlo,zhi,rlo,rhi,{
    title:'brightness relative to a coasting universe — this is the 1998 plot',
    xlab:'redshift z   (logarithmic)', ylab:'Δ(m_B)  [mag]',
    xticks:zt, xfmt:logTick, yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b);
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1;
  const Y0=sy(b,0,rlo,rhi);
  ctx.beginPath(); ctx.moveTo(b.x,Y0); ctx.lineTo(b.x1,Y0); ctx.stroke();
  if(st.showSNe){
    for(const s of M.sample){
      const m=st.standardise?s[1]:tripp(s[5],s[3],s[4],st.alpha,st.beta);
      dot(ctx,sx(b,Math.log10(s[0]),zlo,zhi),
          sy(b,m-distMod(s[0],ref)-off,rlo,rhi),1.4,'rgba(140,152,180,0.34)');
    }
  }
  const mkR=(C,col,lw,dash)=>{
    const xs=[],ys=[];
    for(let i=0;i<=180;i++){
      const z=Math.pow(10,zlo+(zhi-zlo)*i/180);
      xs.push(Math.log10(z)); ys.push(distMod(z,C)-distMod(z,ref));
    }
    polyline(ctx,b,xs,ys,zlo,zhi,rlo,rhi,col,lw,dash);
  };
  mkR(makeCosmo(1,0,st.H0,-1),'#e8843a',1.6,[6,4]);
  mkR(M.C,'#b8ec4c',2.4);
  for(const q of M.bins){
    const X=sx(b,Math.log10(q.z),zlo,zhi);
    const r=q.m-distMod(q.z,ref)-off;
    errBarY(ctx,X,sy(b,r-q.e,rlo,rhi),sy(b,r+q.e,rlo,rhi),'#fff',true);
    dot(ctx,X,sy(b,r,rlo,rhi),3.2,'#fff');
  }
  ctx.restore();
  legendAt(ctx,b.x+14,b.y+16,[['#b8ec4c','your universe'],
    ['#e8843a','Einstein-de Sitter',[6,4]],['#fff','binned data']]);
  ctx.fillStyle='#8b93a6'; ctx.font='11.5px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('Einstein–de Sitter is worse by Δχ² = '
    +fmt(M.fit.chi2EdS-M.fit.chi2,0)+' on '+M.sample.length+' supernovae',
    b.x+14,b.y1-12);

  /* ---- q(z) ------------------------------------------------------- */
  const qz0=0,qz1=2.4, qlo=-1.05,qhi=0.85;
  axes(ctx,b2,qz0,qz1,qlo,qhi,{title:'the deceleration parameter',
    xlab:'z', ylab:'q(z)', xfmt:t=>fmt(t,1), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  /* q < 0 is accelerating, and q < 0 is the BOTTOM of this axis.  The first
     version shaded from the top of the box down to q = 0 and labelled that
     band "accelerating", i.e. it marked the decelerating half and said the
     opposite — a picture that contradicts its own caption. */
  ctx.fillStyle='rgba(184,236,76,0.07)';
  ctx.fillRect(b2.x,sy(b2,0,qlo,qhi),b2.w,b2.y1-sy(b2,0,qlo,qhi));
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(b2.x,sy(b2,0,qlo,qhi));
  ctx.lineTo(b2.x1,sy(b2,0,qlo,qhi)); ctx.stroke();
  {
    const xs=[],ys=[];
    for(let i=0;i<=160;i++){ const z=qz0+(qz1-qz0)*i/160; xs.push(z); ys.push(decel(z,M.C)); }
    polyline(ctx,b2,xs,ys,qz0,qz1,qlo,qhi,'#b8ec4c',2.2);
  }
  if(M.zAcc!=null && M.zAcc<qz1){
    const X=sx(b2,M.zAcc,qz0,qz1);
    ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.3; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(X,b2.y); ctx.lineTo(X,b2.y1); ctx.stroke();
    ctx.setLineDash([]);
  }
  /* An empty panel is not an answer.  q0 can sit far off this axis (a steep
     w with open curvature reaches q0 = -4), and a universe that turns around
     has no age from a = 0 at all — in both cases the view says which. */
  {
    const q0=decel(0,M.C);
    if(!(q0>=qlo&&q0<=qhi)){
      ctx.fillStyle='#e8843a'; ctx.font='11.5px -apple-system,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('q₀ = '+fmt(q0,2)+' — off this axis',
                   b2.x+b2.w/2,b2.y+b2.h*0.30);
    }
  }
  ctx.restore();
  ctx.fillStyle='#b8ec4c'; ctx.font='11px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('accelerating  (q < 0)',b2.x+8,b2.y1-6);
  ctx.fillStyle='#6b7284'; ctx.textBaseline='top';
  ctx.fillText('decelerating',b2.x+8,b2.y+6);
  if(M.zAcc!=null&&M.zAcc<qz1){
    /* on the crossing line and NEAR THE TOP: at small z_acc the marker sits
       hard against the left edge, where the "accelerating" label already is */
    ctx.fillStyle='#cd35c4'; ctx.textAlign='left'; ctx.textBaseline='top';
    const X=sx(b2,M.zAcc,qz0,qz1);
    ctx.fillText('z = '+fmt(M.zAcc,3),Math.min(X+5,b2.x1-58),b2.y+22);
  }

  /* ---- the scale factor ------------------------------------------- */
  const tlo=-14, thi=14;
  axes(ctx,b3,tlo,thi,0,2.3,{title:'the scale factor',
    xlab:'time from now [Gyr]', ylab:'a(t)', xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b3);
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx(b3,0,tlo,thi),b3.y);
  ctx.lineTo(sx(b3,0,tlo,thi),b3.y1); ctx.stroke();
  {
    const xs=[],ys=[];
    const t0=ageAt(1,M.C)*INV_H0_GYR/M.C.H0;
    for(let i=1;i<=220;i++){
      const a=2.3*i/220;
      const t=ageAt(a,M.C)*INV_H0_GYR/M.C.H0-t0;
      xs.push(t); ys.push(a);
    }
    polyline(ctx,b3,xs,ys,tlo,thi,0,2.3,'#b8ec4c',2.2);
    /* the same universe with Lambda switched off, for contrast */
    const C2=makeCosmo(M.st.Om,0,M.st.H0,-1);
    const x2=[],y2=[];
    const s0=ageAt(1,C2)*INV_H0_GYR/C2.H0;
    for(let i=1;i<=220;i++){
      const a=2.3*i/220;
      x2.push(ageAt(a,C2)*INV_H0_GYR/C2.H0-s0); y2.push(a);
    }
    polyline(ctx,b3,x2,y2,tlo,thi,0,2.3,'#e8843a',1.5,[6,4]);
  }
  if(!isFinite(M.age)){
    ctx.fillStyle='#e8843a'; ctx.font='11.5px -apple-system,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const ls=wrapText(ctx,'This universe turns around at z = '
      +fmt(M.zTurn,3)+', so it never expanded from a = 0 and has no age. '
      +'Only the Λ = 0 comparison is drawn.',b3.w-40);
    for(let i=0;i<ls.length;i++)
      ctx.fillText(ls[i],b3.x+b3.w/2,b3.y+b3.h*0.34+i*15);
  }
  ctx.restore();
  legendAt(ctx,b3.x+10,b3.y+16,
    [['#b8ec4c','with Λ — '+(isFinite(M.age)?'age '+fmt(M.age,1)+' Gyr':'no age')],
     ['#e8843a','Λ = 0, same Ω_m',[6,4]]]);
}

/* ================================================================== *
 *  dispatch                                                           *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='dwarf')          return drawDwarf(ctx,W,H,M,S);
  if(v==='limit')          return drawLimit(ctx,W,H,M);
  if(v==='candle')         return drawCandle(ctx,W,H,M);
  if(v==='ladder')         return drawLadder(ctx,W,H,M);
  if(v==='shift')          return drawShift(ctx,W,H,M);
  if(v==='expansion')      return drawExpansion(ctx,W,H,M);
  return drawDwarf(ctx,W,H,M,S);
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.62,0.30,12,[0,0,0]);
  let M=null;
  const S={
    st,cam,zoom:1,pan:{x:0,y:0},
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    fit(){ S.zoom=1; S.pan.x=0; S.pan.y=0; },
    resetView(){ S.fit(); },
    /* only the dwarf view has anything to pan; the other five are plots
       and deliberately ignore the pointer rather than pretending */
    pointer(kind,d){
      if(kind!=='move'||st.view!=='dwarf') return;
      S.pan.x+=d.dx; S.pan.y+=d.dy;
    },
    wheel(dy){
      if(st.view!=='dwarf') return;
      S.zoom=clamp(S.zoom*Math.exp(-dy*0.0012),0.25,40);
    },
    step(){},
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarText(S.model()); },
    tag(){ return tagText(S.model()); },
    draw(){
      const ctx=canvas.getContext('2d');
      const W=cam.W, Hh=cam.H;
      drawView(ctx,W,Hh,S.model(),S);
    },
  };
  return S;
}
/* ================================================================== *
 *  boot                                                               *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  VIEWS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      if(key==='Om'&&st.flat) st.OL=1-st.Om;
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(key==='flat'&&st.flat) st.OL=1-st.Om;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,idf,namef,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===idf(o)?' on':''),onclick:()=>{
        st[key]=idf(o); if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(idf(list[i])===st[key]?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},namef(o));
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  /* a chip row whose choice is not itself a state key — the star and
     cosmology presets set several sliders at once */
  function actionChips(list,namef,act,isOn){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(isOn&&isOn(o)?' on':''),onclick:()=>{
        act(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(isOn&&isOn(list[i])?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},namef(o));
      wrapEl.appendChild(c);
    });
    wrapEl._sync=()=>[].forEach.call(wrapEl.children,(b,i)=>
      b.className='chip'+(isOn&&isOn(list[i])?' on':''));
    return wrapEl;
  }

  /* ---------------- the star --------------------------------------- */
  const gStar=h('div',{class:'grp'},h('h3',null,'the star'));
  const starChips=actionChips(STAR_PRESETS,o=>o.name,
    o=>{ st.xc=xcForMass(o.M,st.mue); },
    o=>Math.abs(whiteDwarf(st.xc,st.mue,700).MSun-o.M)<0.006);
  gStar.appendChild(starChips);
  gStar.appendChild(slider('xc','degeneracy x_c',0.08,60,0.001,v=>sig(v,3)));
  gStar.appendChild(slider('mue','μ_e  nucleons/e⁻',2,2.6,0.01,v=>fmt(v,2)));
  const starTag=h('div',{class:'tag'}); gStar.appendChild(starTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'the plot'));
  const schecks=h('div',{class:'checks'},
    checkbox('showWDs','measured white dwarfs'),
    checkbox('showIdeal','the ideal relation'),
    checkbox('showIron','an iron core (μ_e = 2.15)'),
    checkbox('showSirius','Sirius B'));
  gShow.appendChild(schecks);
  const wdTag=h('div',{class:'src'}); gShow.appendChild(wdTag);

  /* ---------------- the supernova ---------------------------------- */
  const SN_LIST=Object.keys(LCS).sort().map(k=>({id:k}));
  const gSN=h('div',{class:'grp'},h('h3',null,'the supernova'));
  gSN.appendChild(chipRow(SN_LIST,'sn',o=>o.id,o=>o.id));
  const snTag=h('div',{class:'src'}); gSN.appendChild(snTag);

  const gBand=h('div',{class:'grp'},h('h3',null,'the band'));
  gBand.appendChild(chipRow(BANDS.map(b=>({id:b[0]})),'band',o=>o.id,o=>o.id));
  gBand.appendChild(h('div',{class:'checks'},
    checkbox('showBands','draw all four bands'),
    checkbox('showFit','the fit and Δm₁₅'),
    checkbox('fullBaseline','the whole baseline')));
  const bandTag=h('div',{class:'tag'}); gBand.appendChild(bandTag);

  /* ---------------- the cosmology ---------------------------------- */
  const gCos=h('div',{class:'grp'},h('h3',null,'the universe'));
  const cosChips=actionChips(COSMO_PRESETS,o=>o.name,
    o=>{ st.Om=o.Om; st.OL=o.OL; st.H0=o.H0; st.wDE=-1;
         st.flat=Math.abs(1-o.Om-o.OL)<1e-9; },
    o=>Math.abs(st.Om-o.Om)<5e-4&&Math.abs(st.OL-o.OL)<5e-4
       &&Math.abs(st.H0-o.H0)<5e-3&&st.wDE===-1);
  gCos.appendChild(cosChips);
  gCos.appendChild(slider('Om','Ω_m',0,1.6,0.001,v=>fmt(v,3)));
  gCos.appendChild(slider('OL','Ω_Λ',0,1.6,0.001,v=>fmt(v,3)));
  gCos.appendChild(slider('H0','H₀',55,85,0.01,v=>fmt(v,2)));
  gCos.appendChild(slider('wDE','w',-2,-0.3,0.01,v=>fmt(v,2)));
  gCos.appendChild(h('div',{class:'checks'},checkbox('flat','keep it flat')));
  const cosTag=h('div',{class:'tag'}); gCos.appendChild(cosTag);
  const cosSrc=h('div',{class:'src'}); gCos.appendChild(cosSrc);

  const gFit=h('div',{class:'grp'},h('h3',null,'the data'));
  gFit.appendChild(h('div',{class:'checks'},
    checkbox('showSNe','every supernova'),
    checkbox('showBins','binned means'),
    checkbox('standardise','standardise the candles'),
    checkbox('showAlt','the alternatives')));
  gFit.appendChild(slider('alpha','α (stretch)',0,0.4,0.001,v=>fmt(v,3)));
  gFit.appendChild(slider('beta','β (colour)',0,6,0.01,v=>fmt(v,2)));
  const fitTag=h('div',{class:'tag'}); gFit.appendChild(fitTag);
  const btn=h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const f=cosmoFit(st.wDE); st.Om=Math.round(f.Om*1000)/1000;
      if(st.flat) st.OL=1-st.Om; S.rebuild(); syncPanel(); refresh(); }},'fit Ω_m'));
  gFit.appendChild(btn);

  /* ---------------- the redshift ----------------------------------- */
  const gZ=h('div',{class:'grp'},h('h3',null,'the redshift'));
  gZ.appendChild(slider('z','z',0,2.5,0.001,v=>fmt(v,3)));
  const zTag=h('div',{class:'tag'}); gZ.appendChild(zTag);

  const gView=h('div',{class:'grp'},h('h3',null,'the picture'));
  gView.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.resetView(); refresh(); }},'reset the view'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.resetView();
      S.rebuild(); syncPanel(); refresh(); }},'reset all')));
  const viewTag=h('div',{class:'tag'}); gView.appendChild(viewTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'));
  const infoEl=h('div',{id:'info'}); gInfo.appendChild(infoEl);
  const srcEl=h('div',{class:'src'}); gInfo.appendChild(srcEl);

  [gStar,gShow,gSN,gBand,gCos,gFit,gZ,gView,gInfo].forEach(g=>panel.appendChild(g));

  function syncPanel(){
    const v=st.view;
    gStar.hidden = !(v==='dwarf'||v==='limit');
    gShow.hidden = (v!=='limit');
    gSN.hidden   = (v!=='candle');
    gBand.hidden = (v!=='candle');
    gCos.hidden  = !(v==='ladder'||v==='expansion'||v==='shift');
    gFit.hidden  = !(v==='ladder'||v==='expansion');
    gZ.hidden    = (v!=='shift');
    gView.hidden = false;
    rows.OL.row.hidden = st.flat;
    for(const k in rows) rows[k].sync();
    if(starChips._sync) starChips._sync();
    if(cosChips._sync) cosChips._sync();
    [].forEach.call(schecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showWDs','showIdeal','showIron','showSirius'][i]]; });
    [].forEach.call(gBand.querySelectorAll('input[type=checkbox]'),(inp,i)=>{
      inp.checked=st[['showBands','showFit','fullBaseline'][i]]; });
    [].forEach.call(gFit.querySelectorAll('input[type=checkbox]'),(inp,i)=>{
      inp.checked=st[['showSNe','showBins','standardise','showAlt'][i]]; });
    [].forEach.call(gCos.querySelectorAll('input[type=checkbox]'),(inp)=>{
      inp.checked=st.flat; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      viewTag.innerHTML=(st.view==='dwarf')
        ? 'zoom <b>×'+sig(S.zoom,3)+'</b> — drag to pan, scroll to zoom'
        : 'this view is a plot; the pointer does nothing here';
      hintEl.textContent =
        st.view==='dwarf' ? 'drag to pan · scroll to zoom · r resets · space toggles standardisation'
      : st.view==='limit' ? 'the curve has no free parameters; the points are measurements'
      : st.view==='candle'? 'pick a supernova — most of them cannot give a decline rate'
      : st.view==='ladder'? 'turn standardisation off and watch the scatter double'
      : st.view==='shift' ? 'one slider, and every consequence of it at once'
      : 'this is the plot the 1998 result was';
      subEl.innerHTML =
        (st.view==='dwarf'||st.view==='limit')
          ? 'M<sub>Ch</sub> = '+sig(M.MCh,6)+' M☉ &mdash; this star is at '
            +fmt(100*M.frac,1)+'% of it'
        : st.view==='candle'
          ? 'SN '+M.sn+' &mdash; '+(M.dm15B?'Δm₁₅(B) = '+fmt(M.dm15B.dm15,2)
              :'decline rate not measurable from this light curve')
        : st.view==='shift'
          ? 'z = '+fmt(st.z,3)+' &mdash; '+fmtDist(M.dL)+' by luminosity, '
            +fmt(M.lookback,2)+' Gyr ago'
        : 'Ω<sub>m</sub> = '+fmt(st.Om,3)+', Ω<sub>Λ</sub> = '+fmt(M.OL,3)
          +' &mdash; q₀ = '+fmt(M.q0,3)+', age '+fmt(M.age,2)+' Gyr';
      starTag.innerHTML='M = <b>'+sig(M.star.MSun,4)+'</b> M☉ &nbsp; R = <b>'
        +fmtLen(M.star.R)+'</b> = '+sig(M.star.R/R_EARTH,3)+' R⊕'
        +'<br>ρ_c = <b>'+fmtDens(M.star.rhoC)+'</b> &nbsp; γ_c = <b'
        +(M.gammaC<1.40?' class="r"':'')+'>'+fmt(M.gammaC,3)+'</b>';
      wdTag.innerHTML='Bédard, Bergeron &amp; Fontaine 2017, ApJ 848, 11 — 143 of 158 '
        +'plotted; the 15 the catalogue calls unresolved double degenerates are '
        +'excluded, because it says their single-star parameters are meaningless.';
      const L=M.lc;
      snTag.innerHTML='Hamuy et al. 1996, AJ 112, 2408 — raw BV(RI) photometry.'
        +(L&&L.z!=null?'<br>z = <b>'+fmt(L.z,5)+'</b>, μ = <b>'+fmt(L.mu,3)
          +'</b> (Pantheon+)':'<br><span class="r">not in Pantheon+ — no distance</span>');
      bandTag.innerHTML=M.dm15
        ? 'Δm₁₅('+st.band+') = <b>'+fmt(M.dm15.dm15,3)+'</b> from <b>'+M.dm15.n
          +'</b> points'
        : '<span class="r">this band cannot give a decline rate here</span>';
      cosTag.innerHTML='Ω_k = <b'+(Math.abs(M.Ok)<1e-9?' class="g"':'')+'>'
        +fmt(M.Ok,3)+'</b> &nbsp; q₀ = <b'+(M.q0<0?' class="g"':' class="r"')+'>'
        +fmt(M.q0,3)+'</b><br>age <b>'+fmt(M.age,3)+'</b> Gyr &nbsp; '
        +(M.zAcc!=null?'accelerating since z = <b>'+fmt(M.zAcc,3)+'</b>'
          :'<span class="r">never accelerates</span>');
      const cp=COSMO_PRESETS.find(o=>Math.abs(st.Om-o.Om)<5e-4&&Math.abs(st.OL-o.OL)<5e-4);
      cosSrc.innerHTML=cp?cp.src:'a universe of your own';
      fitTag.innerHTML='χ²/N = <b>'+fmt(M.chi2.chi2/M.chi2.n,3)+'</b> on <b>'
        +M.chi2.n+'</b> SNe &nbsp; scatter <b>'+fmt(M.scatter,3)+'</b> mag'
        +'<br>best fit Ω_m = <b class="g">'+fmt(M.fit.Om,3)+'</b>'
        +' &nbsp; ΔΧ² vs EdS = <b>'+fmt(M.fit.chi2EdS-M.fit.chi2,0)+'</b>';
      zTag.innerHTML='d_L = <b>'+fmtDist(M.dL)+'</b> &nbsp; μ = <b>'+fmt(M.mu,2)+'</b>'
        +'<br>lookback <b>'+fmt(M.lookback,3)+'</b> Gyr of '+fmt(M.age,2)+' Gyr';
      infoEl.innerHTML=INFO[st.view]||INFO.dwarf;
      srcEl.innerHTML='Bédard+ 2017 (ApJ 848, 11) · Hamuy+ 1996 (AJ 112, 2408) · '
        +'Brout+ 2022 (ApJ 938, 110) · Bond+ 2017 (ApJ 840, 70). '
        +'Every table retrieved machine-readable; nothing transcribed by hand.';
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it: the frame loop only
     redraws while something is animating, so every interaction that touches
     the camera must ask for a frame.  (Known-bad list, steam_carnot_cycle.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.standardise=!st.standardise;
      S.rebuild(); syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=VIEWS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}
