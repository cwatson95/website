<title>Standard candle — the Chandrasekhar limit and the accelerating universe</title>
<!--
  ===================================================================
  STANDARD CANDLE
  a star with a maximum mass, the explosion that mass makes uniform,
  and the distance ladder that found the universe accelerating
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, pulsar.html,
  diffraction.html, merger.html and wind_tunnel.html: one flat file, no build
  step, no network, works opened straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS COMPUTES
  ------------------------------------------------------------------
  Six views, following one argument from a cold star to the shape of space:

    the dwarf     the inside of a white dwarf.  The Chandrasekhar equation of
                  state for a cold degenerate electron gas is integrated
                  against hydrostatic equilibrium, here, in the page — the
                  density, pressure and degeneracy profiles are the solution
                  of that ODE and not a fitted curve.
    the limit     the mass-radius relation, and the fact that it ENDS.  Squeeze
                  a white dwarf and it gets smaller; keep squeezing and the
                  electrons turn relativistic, the pressure softens from
                  rho^5/3 to rho^4/3, and above M_Ch there is no solution at
                  all.  143 measured white dwarfs are plotted on it.
    the candle    why that makes a ruler.  A star that detonates at one mass
                  releases one energy, so its brightness is nearly fixed — and
                  the residual spread is predicted by the WIDTH of the light
                  curve.  29 real light curves, and the width-luminosity
                  relation measured off them.
    the ladder    the Hubble diagram: 1701 Type Ia supernovae out to z = 2.26,
                  against the luminosity distance of a Friedmann universe.
    the z-shift   what a redshift actually does — to a wavelength, to a light
                  curve's clock, and to the brightness that carries the
                  distance.  Every (1+z) in the problem, separately.
    the expansion the residual: the same supernovae with the decelerating
                  universe divided out.  This is the plot the 1998 result was,
                  and the acceleration is in it by 662 in chi-squared.

  ------------------------------------------------------------------
  WHAT IS MEASURED — retrieved whole, never transcribed
  ------------------------------------------------------------------
  Three published data sets are embedded, each downloaded as its own
  machine-readable file so that no value was typed by hand or read off a
  figure:

    * Bedard, Bergeron & Fontaine 2017 (ApJ 848, 11) — 158 white dwarfs with
      spectroscopic and photometric masses and radii.  VizieR J/ApJ/848/11.
      143 are plotted; the 15 the catalogue flags as unresolved double
      degenerates are excluded, because for those it states in terms that
      "the parameters derived under the assumption of a single star are
      meaningless" — and four of the five apparently super-Chandrasekhar
      objects carry that flag, the worst reading 3.85 solar masses.
    * Hamuy et al. 1996 (AJ 112, 2408) — BV(RI) photometry for 29
      Calan/Tololo SNe Ia.  VizieR J/AJ/112/2408.  Raw magnitudes.
    * Brout et al. 2022 (ApJ 938, 110) — Pantheon+, 1701 SN Ia light curves.
      The collaboration's own release file, Pantheon+SH0ES.dat.

  Two further numbers are cited scalar anchors, with their source and
  conditions stated on the canvas where they are used:
    * Sirius B: M = 1.018 +/- 0.011 Msun, R = 0.008098 +/- 0.000046 Rsun
      (Bond et al. 2017, ApJ 840, 70 — HST astrometry over two decades).
    * The Phillips slope: 0.784 +/- 0.182 in B (Hamuy et al. 1996, ApJ 112,
      2391, Table 3, 26 low-extinction SNe, H0 = 65, K-corrected).

  ------------------------------------------------------------------
  WHAT IS EXACT
  ------------------------------------------------------------------
  * The equation of state.  P = A f(x), f(x) = x(2x^2-3)sqrt(1+x^2) +
    3 asinh(x), with x = p_F/(m_e c).  Its small-x branch is a series whose
    coefficients were generated in exact rational arithmetic, because the
    closed form is catastrophic cancellation there: f ~ 8x^5/5 is assembled
    from terms of order 3x, so at x = 0.01 the direct form has lost eight
    digits.  Both branches are asserted against each other at the join.
  * The structure equation, integrated in Chandrasekhar's own dimensionless
    variables, where the surface is crossed linearly and the mass prefactor
    is independent of the central density.
  * M_Ch, obtained twice — as the limit of the direct integration and from
    the n = 3 Lane-Emden polytrope, agreeing to 6e-7 — and never quoted.
    The Lane-Emden constants themselves (xi_1 = 6.8968486, omega = 2.0182360)
    are integrated here, not remembered.
  * The luminosity distance, checked against every case with a closed form:
    Einstein-de Sitter, the empty (Milne) universe, de Sitter, the low-z
    expansion in q0, and the flat-LCDM age 2/(3 H0 sqrt(OL)) asinh sqrt(OL/OM).
    Worst disagreement over the whole set: 2.6e-14.

  ------------------------------------------------------------------
  WHAT IS NOT MODELLED, and is said so on the canvas
  ------------------------------------------------------------------
  * The explosion.  Nothing here burns carbon.  That a Chandrasekhar-mass
    detonation yields ~0.6 Msun of nickel-56 whose decay powers the light
    curve is stated as physics, not computed.
  * Finite temperature and the non-degenerate envelope.  The drawn
    mass-radius curve is the IDEAL zero-temperature relation.  Real white
    dwarfs sit a median 1.5% above it, and that offset is the envelope.
    Bedard et al. compare their stars against detailed envelope models, which
    is a different and better curve than this one; the sim says so where the
    two are drawn together.
  * K-corrections.  The width-luminosity fit made in this file from raw
    photometry does not apply one, which is one reason it is a demonstration
    of the effect rather than a reproduction of the published calibration.
  * General relativity in the star.  The white dwarf is Newtonian.  At the
    Chandrasekhar limit GM/Rc^2 is still only ~3e-4 at Sirius B's mass, but
    the true limit is slightly lower than the Newtonian one, and the
    instability that a full treatment produces is not here.
  * The covariance matrix.  The cosmology fit uses Pantheon+'s DIAGONAL
    errors, so its central value is a real check on the published Om but its
    error bar is not comparable to the published one.  Stated in the readout.

  ------------------------------------------------------------------
  VERIFICATION
  ------------------------------------------------------------------
  selfTest() runs when there is no document (osascript -l JavaScript).  It
  asserts the equation of state against its own series and its two limits, the
  structure integration against the Lane-Emden polytropes at BOTH ends
  (n = 3/2 non-relativistic and n = 3 ultra-relativistic), M_Ch two ways, the
  cosmological distances against four closed forms, the age integral against
  its closed form, the onset of acceleration against the root of q(z), and
  the width-luminosity slope measured from raw photometry against the
  published one.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* ================================================================== *
 *  MEASURED WHITE DWARFS                                              *
 *                                                                     *
 *  Bedard, Bergeron & Fontaine 2017, ApJ 848, 11 — "Measurements of   *
 *  physical parameters of white dwarfs: a test of the mass-radius     *
 *  relation".  Retrieved as the machine-readable table1.dat from      *
 *  VizieR J/ApJ/848/11, not transcribed by hand.                      *
 *                                                                     *
 *  [name, spectral type, M/Msun, sigma_M, R/Rsun, sigma_R, Delta]     *
 *  Delta is the catalogue's OWN measure of consistency with the       *
 *  mass-radius relation, in sigma.                                    *
 *                                                                     *
 *  The 15 objects the catalogue flags as unresolved double            *
 *  degenerates are NOT here: for those it states that "the parameters *
 *  derived under the assumption of a single star are meaningless",    *

/* The five light curves that actually support a DIRECT Delta m15(B):
   sampled before maximum light AND out past +15 rest-frame days.  Measured
   here by a weighted cubic through the (-9,+24) rest-frame window; the values
   are recomputed in the file, this table only records which SNe qualify and
   what the build measured, so a regression is visible.
   Hamuy et al. say the same of their own data: "five of them possess well
   sampled light curves starting even a few days before peak and spanning
   through day +15, allowing thus a direct measurement of the initial decline
   rate."  The other 24 were template-fitted; this file does not do that and
   does not pretend to. */
const DM15_DIRECT={
"1990af":{n:22,Bmax:17.9137,dm15:1.6833,rms:0.0232},
"1992al":{n:12,Bmax:14.5930,dm15:1.1436,rms:0.0098},
"1992bc":{n:24,Bmax:15.1755,dm15:0.9224,rms:0.0481},
"1992bo":{n:13,Bmax:15.8300,dm15:1.7098,rms:0.0317},
"1993O":{n:17,Bmax:17.8002,dm15:1.3499,rms:0.0523},
};
/* ================================================================== *
 *  constants (CODATA 2018 exact-where-exact; IAU 2015 nominal solar)  *
 * ================================================================== */
const C_LIGHT = 299792458;             /* m/s, exact                   */
const C_KMS   = 299792.458;            /* km/s, exact                  */
const G_NEWT  = 6.67430e-11;           /* m^3 kg^-1 s^-2               */
const H_PLANCK= 6.62607015e-34;        /* J s, exact (SI 2019)         */
const HBAR    = H_PLANCK/TAU;
const M_E     = 9.1093837015e-31;      /* kg                           */
const M_U     = 1.66053906660e-27;     /* kg, atomic mass constant     */
const GM_SUN  = 1.3271244e20;          /* m^3/s^2, IAU 2015 nominal    */
const M_SUN   = GM_SUN/G_NEWT;         /* kg — derived, never typed    */
const R_SUN   = 6.957e8;               /* m, IAU 2015 nominal          */
const R_EARTH = 6.3781e6;              /* m, IAU equatorial            */
const PC      = 3.0856775814913673e16; /* m                            */
const MPC     = PC*1e6;
const YR      = 365.25*86400;          /* s, Julian year               */
const GYR     = YR*1e9;

/* pressure scale of the degenerate electron gas:  P = A_P f(x)        */
const A_P = PI*Math.pow(M_E,4)*Math.pow(C_LIGHT,5)/(3*Math.pow(H_PLANCK,3));
/* rho = B_RHO(mu_e) x^3 — the nucleons carry the mass, the electrons
   carry the pressure, and mu_e is the number of nucleons per electron
   (2 for carbon/oxygen, 2.15 for iron)                                */
function bRho(mue){ return mue*M_U*(8*PI/3)*Math.pow(M_E*C_LIGHT/H_PLANCK,3); }

/* ================================================================== *
 *  the Chandrasekhar equation of state                                *
 *                                                                     *
 *  f(x) = x(2x^2-3)sqrt(1+x^2) + 3 asinh(x)                           *
 *                                                                     *
 *  The leading behaviour is f -> 8x^5/5, and it is assembled from     *
 *  terms of order 3x: the x and x^3 terms cancel IDENTICALLY.  So the *
 *  closed form loses about 3x/(1.6 x^5) in relative precision, which  *
 *  at x = 0.01 is eight digits and at x = 0.001 is everything.  Below *
 *  XSPLIT the series is used instead; its coefficients were generated *
 *  in exact rational arithmetic (Fraction), not fitted:               *
 *      f = 8x^5/5 - 4x^7/7 + x^9/3 - 5x^11/22 + 35x^13/208 - ...      *
 *  The two branches are asserted against each other AT the join, at   *
 *  x = 0.30, 0.35 and 0.40, where both are accurate — a branch that   *
 *  no test evaluates is covered by nothing.                           *
 * ================================================================== */
/* GENERATED, not transcribed.  The exact rationals are
     1, -5/14, 5/24, -25/176, 175/1664, -21/256, 1155/17408, -2145/38912,
     10725/229376, -60775/1507328, 46189/1310720, -146965/4718592,
     3380195/121634816, -6500375/260046848
   and the first hand-typed version of this list was wrong in every entry
   from the seventh on — which is the whole argument for emitting the
   literals from the arithmetic that produced them. */
const EOS_SERIES=[
  1.0, -0.35714285714285715, 0.20833333333333334, -0.14204545454545456,
  0.10516826923076923, -0.08203125, 0.06634880514705882, -0.05512438322368421,
  0.046757289341517856, -0.040319691533627716, 0.03523941040039062,
  -0.031145943535698786, 0.027789699620214003, -0.024996938243989023];
const XSPLIT=0.35;
function fEOS(x){
  if(x<0) return -fEOS(-x);
  if(x>=XSPLIT) return x*(2*x*x-3)*Math.sqrt(1+x*x)+3*Math.asinh(x);
  const u=x*x; let s=0;
  for(let i=EOS_SERIES.length-1;i>=0;i--) s=s*u+EOS_SERIES[i];
  return 1.6*Math.pow(x,5)*s;
}
/* dP/dx = A_P f'(x); the closed form is exact and has no cancellation */
function fpEOS(x){ return 8*Math.pow(x,4)/Math.sqrt(1+x*x); }
function pressureOf(x){ return A_P*fEOS(x); }
function densityOf(x,mue){ return bRho(mue)*x*x*x; }
/* invert rho -> x (used for the profile readouts) */
function xOfDensity(rho,mue){ return Math.cbrt(rho/bRho(mue)); }
/* the sound-speed-free adiabatic index of the gas, d ln P/d ln rho —
   5/3 when non-relativistic, 4/3 when ultra-relativistic, and the whole
   story of the Chandrasekhar limit is that it passes between them */
function gammaEOS(x){ return x*fpEOS(x)/(3*fEOS(x)); }

/* ================================================================== *
 *  hydrostatic structure, in Chandrasekhar's dimensionless variables  *
 *                                                                     *
 *    y = sqrt(1+x^2),  phi = y/y_c,  r = alpha eta                    *
 *    alpha = sqrt(2 A_P/(pi G)) / (B y_c)                             *
 *    (1/eta^2) d/deta(eta^2 dphi/deta) = -(phi^2 - 1/y_c^2)^{3/2}     *
 *                                                                     *
 *  which is exactly Lane-Emden n = 3 as y_c -> infinity.  The surface *
 *  is phi = 1/y_c, which phi crosses LINEARLY — eventing on the       *
 *  density (phi^2 - 1/y_c^2) instead only touches zero there and is   *
 *  not detected at all in the ultra-relativistic limit.               *
 *                                                                     *
 *  alpha^3 carries y_c^-3 and the central density carries y_c^+3, so  *
 *  the MASS prefactor is independent of the central density:          *
 *    M = 4 pi (2A/(pi G))^{3/2} B^-2 * [-eta_1^2 phi'(eta_1)]         *
 *    R = sqrt(2A/(pi G))/(B y_c) * eta_1                              *
 *  and M_Ch is nothing but the n = 3 value of that bracket.           *
 * ================================================================== */
function chandraIntegrate(yc,nstep){
  const inv=1/yc, inv2=inv*inv, q=1-inv2;
  const h=(nstep&&nstep>0)?(12/nstep):0.004;
  const acc=(p)=>{ const s=p*p-inv2; return s>0?-Math.pow(s,1.5):0; };
  let eta=1e-4;
  let phi=chSeriesPhi(eta,q), dphi=chSeriesDPhi(eta,q);
  const prof=[[eta,phi,dphi]];
  const stepRK=(e,p,d,dh)=>{
    const k1p=d,                 k1d=acc(p)-2*d/e;
    const k2p=d+dh/2*k1d,        k2d=acc(p+dh/2*k1p)-2*(d+dh/2*k1d)/(e+dh/2);
    const k3p=d+dh/2*k2d,        k3d=acc(p+dh/2*k2p)-2*(d+dh/2*k2d)/(e+dh/2);
    const k4p=d+dh*k3d,          k4d=acc(p+dh*k3p)-2*(d+dh*k3d)/(e+dh);
    return [p+dh/6*(k1p+2*k2p+2*k3p+k4p), d+dh/6*(k1d+2*k2d+2*k3d+k4d)];
  };
  let guard=0;
  while(phi>inv && guard++ < 200000){
    const r=stepRK(eta,phi,dphi,h);
    if(r[0]<=inv){                       /* refine the last step */
      let e2=eta,p2=phi,d2=dphi;
      const hs=h/400;
      while(p2>inv && e2<eta+h+hs){
        const rr=stepRK(e2,p2,d2,hs);
        if(rr[0]<=inv){
          /* linear interpolation on phi across the final sub-step */
          const t=(p2-inv)/(p2-rr[0]);
          e2+=hs*t; d2=d2+(rr[1]-d2)*t; p2=inv;
          break;
        }
        e2+=hs; p2=rr[0]; d2=rr[1];
      }
      eta=e2; phi=p2; dphi=d2; prof.push([eta,phi,dphi]);
      break;
    }
    eta+=h; phi=r[0]; dphi=r[1]; prof.push([eta,phi,dphi]);
  }
  return {eta1:eta, bracket:-eta*eta*dphi, prof:prof};
}

/* the ordinary Lane-Emden equation, for the polytropic cross-checks */
/* The regular series solutions at the origin, pulled out as named functions
   so they can be asserted where they live.  Fed into a 6000-step RK4 they
   contribute about 1e-9 to the answer, which is below every tolerance the
   suite can honestly carry — so a mutation sweep changed both of them and
   nothing noticed.  The fix is not a tighter tolerance (that would be pinning
   the integrator's truncation error, not the series) but to check that each
   series SATISFIES ITS OWN DIFFERENTIAL EQUATION near the origin, which is an
   independent statement and is what selfTest now does. */
function leSeriesTheta(xi,n){ return 1-xi*xi/6+n*Math.pow(xi,4)/120; }
function leSeriesDTheta(xi,n){ return -xi/3+n*Math.pow(xi,3)/30; }
function chSeriesPhi(eta,q){ return 1-q*Math.sqrt(q)*eta*eta/6; }
function chSeriesDPhi(eta,q){ return -q*Math.sqrt(q)*eta/3; }

function laneEmden(n,nstep){
  const h=(nstep&&nstep>0)?(12/nstep):0.002;
  const acc=(t)=>t>0?-Math.pow(t,n):0;
  let xi=1e-6, th=leSeriesTheta(xi,n), dth=leSeriesDTheta(xi,n);
  const stepRK=(e,p,d,dh)=>{
    const k1p=d,          k1d=acc(p)-2*d/e;
    const k2p=d+dh/2*k1d, k2d=acc(p+dh/2*k1p)-2*(d+dh/2*k1d)/(e+dh/2);
    const k3p=d+dh/2*k2d, k3d=acc(p+dh/2*k2p)-2*(d+dh/2*k2d)/(e+dh/2);
    const k4p=d+dh*k3d,   k4d=acc(p+dh*k3p)-2*(d+dh*k3d)/(e+dh);
    return [p+dh/6*(k1p+2*k2p+2*k3p+k4p), d+dh/6*(k1d+2*k2d+2*k3d+k4d)];
  };
  let guard=0;
  while(th>0 && guard++ < 200000){
    const r=stepRK(xi,th,dth,h);
    if(r[0]<=0){
      let e2=xi,p2=th,d2=dth; const hs=h/400;
      while(p2>0 && e2<xi+h+hs){
        const rr=stepRK(e2,p2,d2,hs);
        if(rr[0]<=0){ const t=p2/(p2-rr[0]); e2+=hs*t; d2=d2+(rr[1]-d2)*t; p2=0; break; }
        e2+=hs; p2=rr[0]; d2=rr[1];
      }
      xi=e2; th=p2; dth=d2; break;
    }
    xi+=h; th=r[0]; dth=r[1];
  }
  return {xi1:xi, bracket:-xi*xi*dth};
}

/* one white dwarf: central degeneracy x_c and composition mu_e        */
function whiteDwarf(xc,mue,nstep){
  const B=bRho(mue), yc=Math.sqrt(1+xc*xc);
  const s=chandraIntegrate(yc,nstep);
  const alpha=Math.sqrt(2*A_P/(PI*G_NEWT))/(B*yc);
  const M=4*PI*Math.pow(2*A_P/(PI*G_NEWT),1.5)/(B*B)*s.bracket;
  const R=alpha*s.eta1;
  return {xc:xc, mue:mue, yc:yc, M:M, R:R, MSun:M/M_SUN, RSun:R/R_SUN,
          rhoC:B*xc*xc*xc, pC:pressureOf(xc), eta1:s.eta1, bracket:s.bracket,
          alpha:alpha, prof:s.prof,
          /* Newtonian compactness — the check that Newton is still allowed */
          compact:G_NEWT*M/(R*C_LIGHT*C_LIGHT)};
}

/* the Chandrasekhar limit itself: the n = 3 bracket, not a stored number */
function chandraMass(mue,nstep){
  const w=laneEmden(3,nstep||6000).bracket;
  return 4*PI*Math.pow(2*A_P/(PI*G_NEWT),1.5)/Math.pow(bRho(mue),2)*w/M_SUN;
}

/* radial profile of one star, in physical units */
function wdProfile(star,npt){
  const n=npt||140, p=star.prof, out=[];
  const B=bRho(star.mue);
  for(let i=0;i<n;i++){
    const f=i/(n-1), idx=f*(p.length-1);
    const j=Math.min(p.length-2,Math.floor(idx)), t=idx-j;
    const eta=p[j][0]+(p[j+1][0]-p[j][0])*t;
    const phi=p[j][1]+(p[j+1][1]-p[j][1])*t;
    const y=phi*star.yc;
    const x=Math.sqrt(Math.max(0,y*y-1));
    out.push({r:star.alpha*eta, rf:star.alpha*eta/star.R, x:x,
              rho:B*x*x*x, P:pressureOf(x), gam:x>0?gammaEOS(x):5/3});
  }
  return out;
}

/* enclosed mass along the profile — the bracket is the integral of the
   density, so this is the same number arriving a second way            */
function wdMassProfile(star,npt){
  const p=star.prof, out=[];
  const pre=4*PI*Math.pow(2*A_P/(PI*G_NEWT),1.5)/Math.pow(bRho(star.mue),2);
  for(let i=0;i<p.length;i++){
    out.push([star.alpha*p[i][0], pre*(-p[i][0]*p[i][0]*p[i][2])/M_SUN]);
  }
  return out;
}

/* ================================================================== *
 *  cosmology                                                          *
 * ================================================================== */
/* E^2 can go NEGATIVE — an open universe with a steeply negative w has a
   turning point, and redshifts beyond it were never reached because the
   expansion reversed there.  That is not a numerical accident to be
   clamped away: it means the question has no answer.  E returns NaN, the
   turning redshift is computed once in makeCosmo, the polylines skip the
   non-finite samples, and the readout says what happened. */
function e2OfZ(z,C){
  const a1=1+z;
  return C.Om*a1*a1*a1 + C.Or*a1*a1*a1*a1 + C.Ok*a1*a1
       + C.OL*Math.pow(a1,3*(1+C.w));
}
function eOfZ(z,C){
  const e2=e2OfZ(z,C);
  return e2>0?Math.sqrt(e2):NaN;
}
function turnRedshift(C){
  if(!(e2OfZ(0,C)>0)) return 0;
  let hi=null;
  for(let i=1;i<=400;i++){          /* scan out in ln(1+z) for a sign change */
    const z=Math.exp(Math.log(1.0001)+ (Math.log(2001)-Math.log(1.0001))*i/400)-1;
    if(!(e2OfZ(z,C)>0)){ hi=z; break; }
  }
  if(hi===null) return null;
  let lo=0;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(e2OfZ(m,C)>0) lo=m; else hi=m; }
  return lo;
}
function makeCosmo(Om,OL,H0,w,Or){
  const or=(Or===undefined)?0:Or;
  const C={Om:Om, OL:OL, Or:or, w:(w===undefined)?-1:w, H0:H0,
           Ok:1-Om-OL-or, hub:C_KMS/H0};
  C.zTurn=turnRedshift(C);
  /* cumulative comoving distance on a grid in ln(1+z), with cubic Hermite
     between the nodes — the derivative 1/E is known exactly, so the
     interpolant is O(h^4) accurate and 1701 supernovae cost one grid. */
  const N=900;
  const zmax=(C.zTurn!==null&&C.zTurn!==undefined)?Math.min(3.2,C.zTurn*0.999999):3.2;
  const lmax=Math.log(1+Math.max(zmax,1e-6));
  const zs=new Float64Array(N+1), Is=new Float64Array(N+1), ds=new Float64Array(N+1);
  for(let i=0;i<=N;i++){ zs[i]=Math.exp(lmax*i/N)-1; ds[i]=1/eOfZ(zs[i],C); }
  Is[0]=0;
  for(let i=0;i<N;i++){
    const a=zs[i], b=zs[i+1], m=(a+b)/2;
    /* Simpson with the midpoint evaluated exactly (not interpolated) */
    Is[i+1]=Is[i]+(b-a)/6*(ds[i]+4/eOfZ(m,C)+ds[i+1]);
  }
  C._zs=zs; C._Is=Is; C._ds=ds; C._N=N; C._lmax=lmax;
  return C;
}
function intInvE(z,C){
  if(z<=0) return 0;
  if(C.zTurn!==null&&C.zTurn!==undefined&&z>=C.zTurn) return NaN;  /* unreachable */
  if(z>C._zs[C._N]){                     /* beyond the grid: integrate on */
    let s=C._Is[C._N], a=C._zs[C._N];
    const n=64, h=(z-a)/n;
    for(let i=0;i<n;i++){
      const p=a+i*h, q=p+h;
      s+=h/6*(1/eOfZ(p,C)+4/eOfZ(p+h/2,C)+1/eOfZ(q,C));
    }
    return s;
  }
  const u=Math.log(1+z)/C._lmax*C._N;
  const i=Math.min(C._N-1,Math.max(0,Math.floor(u)));
  const z0=C._zs[i], z1=C._zs[i+1], h=z1-z0, t=(z-z0)/h;
  const h00=(1+2*t)*(1-t)*(1-t), h10=t*(1-t)*(1-t);
  const h01=t*t*(3-2*t),         h11=t*t*(t-1);
  return h00*C._Is[i]+h10*h*C._ds[i]+h01*C._Is[i+1]+h11*h*C._ds[i+1];
}
function comovingD(z,C){ return C.hub*intInvE(z,C); }        /* Mpc */
function transverseD(z,C){
  const dc=comovingD(z,C);
  if(Math.abs(C.Ok)<1e-10) return dc;
  const rk=C.hub/Math.sqrt(Math.abs(C.Ok));
  return C.Ok>0 ? rk*Math.sinh(dc/rk) : rk*Math.sin(dc/rk);
}
function lumD(z,C){ return (1+z)*transverseD(z,C); }         /* Mpc */
function angD(z,C){ return transverseD(z,C)/(1+z); }         /* Mpc */
function distMod(z,C){
  const d=lumD(z,C);
  if(!isFinite(d)) return NaN;          /* the redshift was never reached */
  return d>0?5*Math.log10(d)+25:-Infinity;
}
function decel(z,C){                                          /* q(z) */
  const a1=1+z, E2=Math.pow(eOfZ(z,C),2);
  return (0.5*C.Om*a1*a1*a1 + C.Or*a1*a1*a1*a1
          + 0.5*(1+3*C.w)*C.OL*Math.pow(a1,3*(1+C.w)))/E2;
}
/* the redshift where expansion stopped decelerating.  For w = -1 this
   has the closed form (2 OL/Om)^{1/3} - 1; the general case is bisected
   on q, and selfTest requires the two to agree. */
function zAccel(C){
  if(decel(0,C)>=0) return null;
  let lo=0, hi=20;
  if(decel(hi,C)<0) return null;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(decel(m,C)<0) lo=m; else hi=m; }
  return (lo+hi)/2;
}
/* age of the universe.  In a = 1/(1+z) with a = u^2 the integrand is
   smooth all the way to the big bang, so plain Gauss-Legendre converges;
   integrating in z to infinity does not. */
const GL16_X=[-0.0950125098376374,0.0950125098376374,-0.2816035507792589,0.2816035507792589,
  -0.4580167776572274,0.4580167776572274,-0.6178762444026438,0.6178762444026438,
  -0.7554044083550030,0.7554044083550030,-0.8656312023878318,0.8656312023878318,
  -0.9445750230732326,0.9445750230732326,-0.9894009349916499,0.9894009349916499];
const GL16_W=[0.1894506104550685,0.1894506104550685,0.1826034150449236,0.1826034150449236,
  0.1691565193950025,0.1691565193950025,0.1495959888165767,0.1495959888165767,
  0.1246289712555339,0.1246289712555339,0.0951585116824928,0.0951585116824928,
  0.0622535239386479,0.0622535239386479,0.0271524594117541,0.0271524594117541];
function ageAt(a,C){        /* age when the scale factor was a, in 1/H0 */
  const f=(u)=>{
    const aa=u*u;
    const q=C.Om/aa + C.Ok + C.Or/(aa*aa) + C.OL*Math.pow(aa,-1-3*C.w);
    if(!(q>0)) return NaN;      /* the universe did not come from a = 0 */
    return 2*u/Math.sqrt(q);
  };
  const nseg=24, ua=Math.sqrt(a); let s=0;
  for(let k=0;k<nseg;k++){
    const p=ua*k/nseg, q=ua*(k+1)/nseg, hm=(q-p)/2, mid=(p+q)/2;
    for(let i=0;i<16;i++) s+=hm*GL16_W[i]*f(mid+hm*GL16_X[i]);
  }
  return s;
}
const INV_H0_GYR=MPC/1e3/YR/1e9;    /* (km/s/Mpc)^-1 expressed in Gyr   */
function ageGyr(C){ return ageAt(1,C)*INV_H0_GYR/C.H0; }
function lookbackGyr(z,C){ return (ageAt(1,C)-ageAt(1/(1+z),C))*INV_H0_GYR/C.H0; }

/* closed forms, kept as separate functions so selfTest compares two
   independent implementations rather than a function with itself      */
function dL_EdS(z,H0){ return C_KMS/H0*2*(1+z)*(1-1/Math.sqrt(1+z)); }
function dL_Milne(z,H0){ return C_KMS/H0*z*(1+z/2); }
function dL_deSitter(z,H0){ return C_KMS/H0*z*(1+z); }
function age_flatLCDM(C){    /* 2/(3 sqrt(OL)) asinh sqrt(OL/Om), in 1/H0 */
  return 2/(3*Math.sqrt(C.OL))*Math.asinh(Math.sqrt(C.OL/C.Om));
}
/* A flat universe of dark energy ALONE has E = (1+z)^{3(1+w)/2}, so the
   comoving integral is elementary for every w except -1/3:
       int dz/E = [(1+z)^p - 1]/p,   p = 1 - 3(1+w)/2
   This is the only closed form in the file that depends on w, and it is
   here because without it nothing pinned the exponent: at w = -1 both
   3(1+w) and 2(1+w) are zero, so a mutated exponent is invisible in every
   LCDM test there is.  Found by mutation testing. */
function dL_wOnly(z,H0,w){
  const p=1-1.5*(1+w);
  if(Math.abs(p)<1e-12) return C_KMS/H0*(1+z)*Math.log(1+z);
  return C_KMS/H0*(1+z)*(Math.pow(1+z,p)-1)/p;
}

/* ================================================================== *
 *  supernova standardisation and the fit                              *
 *                                                                     *
 *  Tripp:  mu = m_B - M + alpha x1 - beta c                           *
 *  A broad light curve (large x1) is intrinsically brighter, and a red *
 *  one (large c) is dimmer — partly dust, partly intrinsic colour.     *
 * ================================================================== */
function tripp(mB,x1,c,alpha,beta){ return mB+alpha*x1-beta*c; }

function snSample(opt){
  const o=opt||{}, zmin=(o.zmin===undefined)?0.01:o.zmin;
  const out=[];
  for(let i=0;i<SNE.length;i++){
    const s=SNE[i];
    if(o.noCalib!==false && s[6]) continue;
    if(s[0]<zmin) continue;
    out.push(s);
  }
  return out;
}
/* chi^2 of a cosmology against the sample, with the absolute magnitude
   analytically marginalised (it is degenerate with H0 and carries no
   cosmological information) */
/* Supernovae at a redshift this universe never reached are DROPPED, not
   clamped, and the number dropped is returned so the readout can say so —
   a fit quietly taken over a shrinking sample is how a bad cosmology comes
   to look good. */
function fitOffset(sample,C,useRaw,alpha,beta){
  let sw=0,swr=0;
  for(let i=0;i<sample.length;i++){
    const s=sample[i];
    const mu=distMod(s[0],C);
    if(!isFinite(mu)) continue;
    const m=useRaw?tripp(s[5],s[3],s[4],alpha,beta):s[1];
    const w=1/(s[2]*s[2]);
    sw+=w; swr+=w*(m-mu);
  }
  return sw>0?swr/sw:0;
}
function chi2Of(sample,C,useRaw,alpha,beta){
  const off=fitOffset(sample,C,useRaw,alpha,beta);
  let s=0,n=0,drop=0;
  for(let i=0;i<sample.length;i++){
    const p=sample[i];
    const mu=distMod(p[0],C);
    if(!isFinite(mu)){ drop++; continue; }
    const m=useRaw?tripp(p[5],p[3],p[4],alpha,beta):p[1];
    const r=m-mu-off;
    s+=r*r/(p[2]*p[2]); n++;
  }
  return {chi2:s, off:off, n:n, dropped:drop};
}
/* golden-section scan on Om at fixed flatness — the sim's live fit */
function fitOm(sample,H0,w){
  let lo=0.02, hi=0.95;
  const F=(om)=>chi2Of(sample,makeCosmo(om,1-om,H0,w),false).chi2;
  const gr=(Math.sqrt(5)-1)/2;
  let a=lo,b=hi,c1=b-gr*(b-a),d1=a+gr*(b-a),fc=F(c1),fd=F(d1);
  for(let i=0;i<80;i++){
    if(fc<fd){ b=d1; d1=c1; fd=fc; c1=b-gr*(b-a); fc=F(c1); }
    else     { a=c1; c1=d1; fc=fd; d1=a+gr*(b-a); fd=F(d1); }
  }
  const om=(a+b)/2;
  return {Om:om, chi2:F(om)};
}
/* scatter about a cosmology, used to show standardisation working */
function scatterOf(sample,C,useRaw,alpha,beta){
  const off=fitOffset(sample,C,useRaw,alpha,beta);
  let s=0,s2=0,n=0;
  for(let i=0;i<sample.length;i++){
    const p=sample[i];
    const mu=distMod(p[0],C);
    if(!isFinite(mu)) continue;
    const m=useRaw?tripp(p[5],p[3],p[4],alpha,beta):p[1];
    const r=m-mu-off;
    s+=r; s2+=r*r; n++;
  }
  if(!n) return NaN;
  const mm=s/n;
  return Math.sqrt(Math.max(0,s2/n-mm*mm));
}

/* ================================================================== *
 *  light curves                                                       *
 * ================================================================== */
/* band index into a light-curve point: [t, B,sB, V,sV, R,sR, I,sI]     */
const BANDS=[['B',1,'#5ac8e0'],['V',3,'#b8ec4c'],['R',5,'#e8843a'],['I',7,'#cd35c4']];
function lcPoints(name,band){
  const L=LCS[name]; if(!L) return [];
  const out=[];
  for(let i=0;i<L.pts.length;i++){
    const p=L.pts[i];
    if(p[band]!==null && p[band]!==undefined)
      out.push([p[0],p[band],(p[band+1]===null||p[band+1]===undefined)?0.03:p[band+1]]);
  }
  return out;
}
/* WEIGHTED polynomial fit (normal equations on a small Vandermonde).
   The weights are 1/sigma^2 on the squared residual, i.e. ordinary
   chi-squared.  Leaving them out is not a cosmetic difference: it moves
   the fitted decline rate of these five supernovae by 1.7%. */
function polyFit(xs,ys,deg,ws){
  const n=deg+1, A=[], b=[];
  for(let i=0;i<n;i++){ A.push(new Float64Array(n)); b.push(0); }
  for(let k=0;k<xs.length;k++){
    const w=ws?ws[k]:1;
    const pw=[]; let v=1;
    for(let i=0;i<n;i++){ pw.push(v); v*=xs[k]; }
    for(let i=0;i<n;i++){ b[i]+=w*pw[i]*ys[k];
      for(let j=0;j<n;j++) A[i][j]+=w*pw[i]*pw[j]; }
  }
  for(let i=0;i<n;i++){                       /* Gaussian elimination */
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    const t=A[i];A[i]=A[p];A[p]=t; const tb=b[i];b[i]=b[p];b[p]=tb;
    if(Math.abs(A[i][i])<1e-300) return null;
    for(let r=i+1;r<n;r++){
      const f=A[r][i]/A[i][i];
      for(let cc=i;cc<n;cc++) A[r][cc]-=f*A[i][cc];
      b[r]-=f*b[i];
    }
  }
  const co=new Float64Array(n);
  for(let i=n-1;i>=0;i--){
    let s=b[i]; for(let j=i+1;j<n;j++) s-=A[i][j]*co[j];
    co[i]=s/A[i][i];
  }
  return co;
}
function polyVal(co,x){ let s=0; for(let i=co.length-1;i>=0;i--) s=s*x+co[i]; return s; }

/* Delta m15(B), measured — and null when the sampling cannot support it.
   A light curve that starts after maximum light does not contain the
   decline rate, and no amount of fitting puts it there. */
function measureDm15(name,band){
  const L=LCS[name]; if(!L) return null;
  const pts=lcPoints(name,band===undefined?1:band);
  if(pts.length<6) return null;
  const z=(L.z===null||L.z===undefined)?0:L.z, zp=1+z;
  let ip=0; for(let i=1;i<pts.length;i++) if(pts[i][1]<pts[ip][1]) ip=i;
  const tp=pts[ip][0];
  const sel=pts.filter(p=>p[0]>tp-9*zp && p[0]<tp+24*zp);
  if(sel.length<6) return null;
  const ts=sel.map(p=>p[0]-tp), ms=sel.map(p=>p[1]);
  const ws=sel.map(p=>1/(p[2]*p[2]));
  if(Math.min.apply(null,ts)>-2*zp) return null;          /* nothing before peak */
  if(Math.max.apply(null,ts)<16*zp) return null;          /* stops before +15 d  */
  const co=polyFit(ts,ms,3,ws);
  if(!co) return null;
  /* maximum light = the interior minimum of the cubic */
  const a=3*co[3], b=2*co[2], cc=co[1];
  const disc=b*b-4*a*cc;
  if(disc<0) return null;
  const r1=(-b+Math.sqrt(disc))/(2*a), r2=(-b-Math.sqrt(disc))/(2*a);
  const tmin=Math.min.apply(null,ts), tmax=Math.max.apply(null,ts);
  const cand=[r1,r2].filter(r=>r>tmin+0.2 && r<tmax-16*zp && 6*a*r+2*b>0);
  if(!cand.length) return null;
  const t0=cand[0];
  const Bmax=polyVal(co,t0);
  return {t0:t0+tp, Bmax:Bmax, dm15:polyVal(co,t0+15*zp)-Bmax, n:sel.length,
          co:co, tref:tp, span:[tmin,tmax], z:z};
}
/* the width-luminosity relation, fitted here from the raw photometry.
   R_B = 4.1 is A_B/E(B-V) for the standard R_V = 3.1 Galactic curve. */
const R_B_EXT=4.1;
function widthLuminosity(){
  const rows=[];
  for(const k in LCS){
    const L=LCS[k];
    if(L.z===null||L.mu===null||L.z===undefined||L.mu===undefined) continue;
    const d=measureDm15(k,1);
    if(!d) continue;
    rows.push({name:k, dm15:d.dm15, MB:d.Bmax-R_B_EXT*(L.ebv||0)-L.mu,
               x1:L.x1, c:L.c, z:L.z, mu:L.mu, AB:R_B_EXT*(L.ebv||0)});
  }
  rows.sort((a,b)=>a.dm15-b.dm15);
  if(rows.length<3) return {rows:rows, slope:null, zero:null, rms:null};
  let sx=0,sy=0,sxx=0,sxy=0;
  const n=rows.length;
  for(const r of rows){ const x=r.dm15-1.1; sx+=x; sy+=r.MB; sxx+=x*x; sxy+=x*r.MB; }
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx), zero=(sy-slope*sx)/n;
  let s2=0; for(const r of rows){ const d=r.MB-(zero+slope*(r.dm15-1.1)); s2+=d*d; }
  return {rows:rows, slope:slope, zero:zero, rms:Math.sqrt(s2/n), n:n};
}
/* Pearson correlation, used to check the decline rate against SALT2 x1 */
function pearson(a,b){
  const n=a.length; let sa=0,sb=0,saa=0,sbb=0,sab=0;
  for(let i=0;i<n;i++){ sa+=a[i]; sb+=b[i]; saa+=a[i]*a[i]; sbb+=b[i]*b[i]; sab+=a[i]*b[i]; }
  return (n*sab-sa*sb)/Math.sqrt((n*saa-sa*sa)*(n*sbb-sb*sb));
}
/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis — a
     magnitude scale, where brighter is up — silently gets one tick label and
     no grid.  Sort the range before asking for ticks; the placement below
     already handles either direction.  (Found by looking at the picture: the
     audit cannot see a label that was never drawn.) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sup(e){
  const d='⁰¹²³⁴⁵⁶⁷⁸⁹'; let s=(e<0?'⁻':''), a=Math.abs(e)+'';
  for(const ch of a) s+=d[+ch];
  return s;
}
function fmtExp(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x)));
  return fmt(x/Math.pow(10,e),n===undefined?2:n)+'×10'+sup(e);
}
/* significant figures, because two decimal places is not nine */
function sig(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const d=Math.max(0,(n||3)-1-Math.floor(Math.log10(Math.abs(x))));
  return Number(x).toFixed(Math.min(12,d));
}
function fmtLen(m){
  if(!isFinite(m)) return '—';
  if(m>=0.1*R_SUN) return sig(m/R_SUN,3)+' R☉';
  if(m>=1e6) return sig(m/1e3,3)+' km';
  return sig(m,3)+' m';
}
function fmtDens(r){ return fmtExp(r/1e3,2)+' g/cm³'; }
function fmtDist(mpc){
  if(!isFinite(mpc)) return '—';
  if(mpc<1) return sig(mpc*1e3,3)+' kpc';
  if(mpc>=1e3) return sig(mpc/1e3,3)+' Gpc';
  return sig(mpc,3)+' Mpc';
}

/* ================================================================== *
 *  caches — the M-R sequence and the cosmology fit are the two        *
 *  expensive things, and neither depends on most of the sliders       *
 * ================================================================== */
const _mrCache={};
function mrSequence(mue,n){
  const key=mue.toFixed(4)+'|'+(n||46);
  if(_mrCache[key]) return _mrCache[key];
  const N=n||46, out=[];
  for(let i=0;i<N;i++){
    const xc=Math.exp(Math.log(0.06)+(Math.log(400)-Math.log(0.06))*i/(N-1));
    const s=whiteDwarf(xc,mue,2200);
    out.push({xc:xc, M:s.MSun, R:s.RSun, rhoC:s.rhoC});
  }
  _mrCache[key]=out; return out;
}
/* invert the relation: which central degeneracy gives this mass?       */
function xcForMass(M,mue){
  const seq=mrSequence(mue);
  if(M<=seq[0].M) return seq[0].xc;
  if(M>=seq[seq.length-1].M) return seq[seq.length-1].xc;
  let lo=0.05, hi=600;
  for(let i=0;i<70;i++){
    const m=Math.sqrt(lo*hi);
    if(whiteDwarf(m,mue,900).MSun<M) lo=m; else hi=m;
  }
  return Math.sqrt(lo*hi);
}
const _fitCache={};
function cosmoFit(w){
  const key=(w).toFixed(4);
  if(_fitCache[key]) return _fitCache[key];
  const smp=snSample();
  const f=fitOm(smp,70,w);
  const C=makeCosmo(f.Om,1-f.Om,70,w);
  const r={Om:f.Om, chi2:f.chi2, n:smp.length,
           scatter:scatterOf(smp,C,false),
           scatterRaw:scatterOf(smp,C,true,0,0),
           chi2EdS:chi2Of(smp,makeCosmo(1,0,70,w),false).chi2};
  _fitCache[key]=r; return r;
}
/* binned Hubble diagram, in equal steps of ln(1+z)                     */
function binSNe(sample,nb,useRaw,alpha,beta){
  const zmax=sample.reduce((a,s)=>Math.max(a,s[0]),0);
  const lo=Math.log(1.01), hi=Math.log(1+zmax)*1.0001;
  const acc=[];
  for(let i=0;i<nb;i++) acc.push({sw:0,swz:0,swm:0,n:0});
  for(const s of sample){
    let k=Math.floor((Math.log(1+s[0])-lo)/(hi-lo)*nb);
    if(k<0) k=0; if(k>=nb) k=nb-1;
    const m=useRaw?tripp(s[5],s[3],s[4],alpha,beta):s[1];
    const w=1/(s[2]*s[2]);
    acc[k].sw+=w; acc[k].swz+=w*s[0]; acc[k].swm+=w*m; acc[k].n++;
  }
  return acc.filter(a=>a.n>=3).map(a=>({z:a.swz/a.sw, m:a.swm/a.sw,
                                        e:1/Math.sqrt(a.sw), n:a.n}));
}

/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
function buildModel(st){
  const M={st:st};

  /* ---- the star -------------------------------------------------- */
  M.mue=st.mue;
  M.star=whiteDwarf(st.xc,st.mue,3000);
  M.MCh=chandraMass(st.mue,6000);
  M.frac=M.star.MSun/M.MCh;
  M.prof=wdProfile(M.star,130);
  M.massProf=wdMassProfile(M.star);
  M.gammaC=gammaEOS(st.xc);
  M.seq=mrSequence(st.mue);
  M.seqIron=mrSequence(2.15);
  M.MChIron=chandraMass(2.15,6000);
  /* the two polytropic limits, for the annotations */
  M.le3=laneEmden(3,4000);
  M.le15=laneEmden(1.5,4000);
  /* Sirius B, and what the ideal relation says its radius should be   */
  M.sirius={M:1.018, dM:0.011, R:0.008098, dR:0.000046};
  M.siriusXc=xcForMass(M.sirius.M,st.mue);
  M.siriusIdeal=whiteDwarf(M.siriusXc,st.mue,3000);
  M.wds=WDS;
  M.nAboveLimit=WDS.filter(w=>w[2]>M.MCh).length;

  /* ---- the supernova --------------------------------------------- */
  M.sn=st.sn;
  M.lc=LCS[st.sn]||null;
  M.bandIdx=(BANDS.find(b=>b[0]===st.band)||BANDS[0])[1];
  M.lcPts=lcPoints(st.sn,M.bandIdx);
  M.dm15=measureDm15(st.sn,M.bandIdx);
  M.dm15B=measureDm15(st.sn,1);
  M.wl=widthLuminosity();
  M.nDirect=M.wl.n||0;
  M.nLC=Object.keys(LCS).length;

  /* ---- the cosmology --------------------------------------------- */
  const OL=st.flat?(1-st.Om):st.OL;
  M.C=makeCosmo(st.Om,OL,st.H0,st.wDE);
  M.OL=OL; M.Ok=M.C.Ok;
  M.zTurn=M.C.zTurn;      /* null unless the expansion reverses somewhere */
  M.q0=decel(0,M.C);
  M.zAcc=zAccel(M.C);
  M.zAccClosed=(st.wDE===-1&&st.Om>0&&OL>0)?Math.pow(2*OL/st.Om,1/3)-1:null;
  M.age=ageGyr(M.C);
  M.hubbleTime=INV_H0_GYR/st.H0;
  M.sample=snSample();
  M.bins=binSNe(M.sample,26,!st.standardise,st.alpha,st.beta);
  M.chi2=chi2Of(M.sample,M.C,!st.standardise,st.alpha,st.beta);
  M.scatter=scatterOf(M.sample,M.C,!st.standardise,st.alpha,st.beta);
  M.scatterRaw=scatterOf(M.sample,M.C,true,0,0);
  M.scatterStd=scatterOf(M.sample,M.C,false);
  M.fit=cosmoFit(st.wDE);
  M.zmax=M.sample.reduce((a,s)=>Math.max(a,s[0]),0);

  /* ---- the redshift ---------------------------------------------- */
  M.z=st.z;
  M.dL=lumD(st.z,M.C);
  M.dA=angD(st.z,M.C);
  M.dC=comovingD(st.z,M.C);
  M.mu=distMod(st.z,M.C);
  M.lookback=lookbackGyr(st.z,M.C);
  M.dimming=Math.pow(1+st.z,2);   /* energy per photon x arrival rate   */

  return M;
}
