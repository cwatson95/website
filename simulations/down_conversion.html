  if (!C.poled) {
    cutColl = (C.kind === 'I') ? cutAngleTypeI(C, Lp, Ldeg, Ldeg)
                               : cutAngleTypeII(C, Lp, Ldeg, Ldeg);
    if (C.alt) {
      const A = { o: C.alt.o, e: C.alt.e, kind: C.kind, poled: false };
      cutAlt = (C.kind === 'I') ? cutAngleTypeI(A, Lp, Ldeg, Ldeg)
                                : cutAngleTypeII(A, Lp, Ldeg, Ldeg);
    }
    if (cutColl !== null && cutAlt !== null)
      cutSpread = Math.abs(cutColl - cutAlt) * RAD;
  } else {
    period0 = qpmPeriod(C, Lp, Ldeg, Ldeg);
  }

  /* --- the actual cut / period in force --- */
  const thPm = C.poled ? 0 : clamp((cutColl === null ? 0.5 : cutColl)
                                   + st.cutOff * DEG, 1e-4, PI / 2 - 1e-4);
  const period = C.poled ? period0 * (1 + st.periodPct / 100) : 0;

  /* --- indices at the three wavelengths --- */
  const idx = {
    noP: nOf(C.o, Lp), neP: nOf(C.e, Lp),
    pump: nPump(C, Lp, thPm),
    noS: nOf(C.o, Ls), noI: nOf(C.o, Li),
    neS: nOf(C.e, Ls), neI: nOf(C.e, Li),
  };
  const walk = C.poled ? 0 : walkOff(idx.noP, nOf(C.e, Lp), thPm);

  /* --- the cone at the tracked signal wavelength --- */
  let cone = null;
  if (C.kind === 'I' || C.kind === '0' || C.poled) {
    /* both daughters see a direction-independent index, so the law of cosines
       solves it outright.  For a poled crystal the grating vector adds to the
       pump's momentum, which is exactly a longer effective k_p. */
    const kp = TAU * nPump(C, Lp, thPm) / Lp - (C.poled ? TAU / period : 0);
    const ks = TAU * nOf(C.o, Ls) / Ls;
    const ki = TAU * nOf(C.kind === '0' || C.kind === 'I' ? C.o : C.e, Li) / Li;
    const cs = (kp * kp + ks * ks - ki * ki) / (2 * kp * ks);
    const ci = (kp * kp + ki * ki - ks * ks) / (2 * kp * ki);
    if (Math.abs(cs) <= 1 && Math.abs(ci) <= 1)
      cone = { Oms: Math.acos(cs), Omi: Math.acos(ci),
               nS: nOf(C.o, Ls),
               nI: nOf(C.kind === '0' || C.kind === 'I' ? C.o : C.e, Li) };
  } else {
    /* type II birefringent: find the o-ray emission angle in the plane of the
       optic axis (phi = 0) by bracketed bisection of the dk field. */
    const r = traceRay(C, Lp, thPm, Ls, 0, 'o', period);
    if (r !== null) {
      const ri = traceRay(C, Lp, thPm, Li, PI, 'e', period);
      cone = { Oms: r, Omi: ri === null ? r : ri,
               nS: idx.noS,
               nI: nExt(idx.noI, idx.neI, thetaToAxis(thPm, ri === null ? 0 : ri, PI)) };
    }
  }
  const OmsExt = cone ? toExternal(cone.Oms, cone.nS) : null;
  const OmiExt = cone ? toExternal(cone.Omi, cone.nI) : null;

  /* --- the two rings, all the way round the azimuth ---
     For every crystal here except birefringent type II, both daughters see an
     index that does not depend on direction, so their rings are exact circles
     and one radius describes each.  Birefringent type II is the interesting
     case: the extraordinary partner's index depends on its own direction, the
     rings are not circles, and they CROSS.  Those crossings are the entire
     point of the source, so they are traced properly rather than approximated
     by circles. */
  const NAZ = 72;
  const nEatDir = (L, Om, phi) =>
    nExt(nOf(C.o, L), nOf(C.e, L), thetaToAxis(thPm, Om, phi));
  /* Whether the rings are circles is known from the crystal alone and costs
     nothing; TRACING them costs 72 azimuths x 2 rings x a bracketed bisection
     each, which is by far the most expensive thing in this file.  Only two of
     the six views ever look at them, so they are built on first access.  (The
     650-combination sweep in selfTest reads none of them, and making this
     lazy took the suite from 55 s to 6 s.) */
  const circular = (C.kind !== 'II');
  let _rc = null;
  function ringsNow() {
    if (_rc) return _rc;
    let ringA = null, ringB = null;
  if (cone) {
    if (C.kind === 'II') {
      ringA = []; ringB = [];
      for (let i = 0; i <= NAZ; i++) {
        const phi = TAU * i / NAZ;
        const oo = traceRay(C, Lp, thPm, Ls, phi, 'o', period);
        ringA.push({ phi: phi, Om: oo,
                     ext: oo === null ? null : toExternal(oo, nOf(C.o, Ls)) });
        const ee = traceRay(C, Lp, thPm, Li, phi, 'e', period);
        ringB.push({ phi: phi, Om: ee,
                     ext: ee === null ? null
                          : toExternal(ee, nEatDir(Li, ee, phi)) });
      }
    } else {
      ringA = []; ringB = [];
      const nA = nOf(C.o, Ls);
      const nB = nOf(C.kind === 'IIq' ? C.e : C.o, Li);
      const eA = toExternal(cone.Oms, nA), eB = toExternal(cone.Omi, nB);
      for (let i = 0; i <= NAZ; i++) {
        const phi = TAU * i / NAZ;
        ringA.push({ phi: phi, Om: cone.Oms, ext: eA });
        ringB.push({ phi: phi, Om: cone.Omi, ext: eB });
      }
    }
  }
    /* Where the two rings meet.  Only type II has crossings; for everything
       else the rings are concentric circles that meet only at degeneracy,
       where they coincide entirely rather than crossing. */
    const cross = (!circular && ringA && ringB)
                  ? ringCrossings(ringA, ringB) : [];
    _rc = { A: ringA, B: ringB, cross: cross };
    return _rc;
  }

  /* --- collinear phase mismatch and its sinc weight --- */
  const dk0 = dkField(C, Lp, thPm, Ls, 0, 0, 'o', period);
  const sincColl = dk0 === null ? 0 : sinc2(dk0 * L_um / 2);

  /* --- the tuning curve: emission angle against signal wavelength --- */
  /* Lazy for the same reason the rings are: 241 traced rays per rebuild, and
     only the phase-matching view ever reads them. */
  let _tune = null;
  function tuneNow() {
    if (_tune) return _tune;
    const tune = [];
    const nT = 240;
    const tlo = win === null ? Ldeg : win[0], thi = win === null ? Ldeg : win[1];
    for (let i = 0; i <= nT; i++) {
    const L = tlo + (thi - tlo) * i / nT;
    const Lii = idlerOf(Lp, L);
    if (!(Lii > 0)) continue;
    const om = traceRay(C, Lp, thPm, L, 0, 'o', period);
    if (om === null) { tune.push({ L: L, Li: Lii, om: null, ext: null }); continue; }
    /* the traced ray is the ordinary one in every crystal here, so it exits
       through the ordinary index; the extraordinary partner is drawn from its
       own cone and refracts through nExt at its own direction. */
    const ex = toExternal(om, nOf(C.o, L));
    tune.push({ L: L, Li: Lii, om: om, ext: ex });
    }
    _tune = tune;
    return _tune;
  }

  /* --- phase-matching bandwidth.
     Measured AT THE EMISSION ANGLE, not along the pump.  A crystal cut to
     give a cone is by construction NOT phase matched collinearly at the
     degenerate wavelength, so a bandwidth taken along the pump reports "no
     width" for every interesting configuration -- which is what the first
     version of this did.  The physical question is what spectrum a detector
     placed on the ring collects, and that is the width at that angle. --- */
  const bwOm = cone ? cone.Oms : 0;
  const bw = bandwidth(C, Lp, thPm, Ls, L_um, period, bwOm);

  /* --- group indices and the two things that can set the dip width ---
     The birefringent mechanism needs the two daughters to travel with
     DIFFERENT group velocities, which happens only when they have different
     polarisations.  Type I (o + o) and type 0 (z + z) put both daughters in
     the same polarisation, so their group delay difference is exactly zero
     and the dip they show is set by the spectrum instead.  Getting this wrong
     is easy: taking n_g(o) - n_g(e) for a type-I crystal returns a perfectly
     plausible 0.036 that describes no photon in the problem. */
  const twoPol = (C.kind === 'II' || C.kind === 'IIq');
  const ngO = ngOf(C.o, Ls);
  const ngE = !twoPol ? ngO
            : (C.poled ? ngOf(C.e, Li)
                       : ngExtAt(C, Li, thPm, cone ? cone.Omi : 0));
  const dng = Math.abs(ngO - ngE);
  /* Group delay across the crystal, in femtoseconds.  L is in micrometres and
     c = 299.792458 um/ps, so L*dng/c is picoseconds. */
  const C_UM_PER_PS = 299.792458;
  const DL_fs = 1000 * L_um * dng / C_UM_PER_PS;

  /* The spectral mechanism: whatever bandwidth actually reaches the detector,
     which is the interference filter if there is one and the phase-matching
     width if there is not.  A Gaussian of FWHM dlam at Ls has coherence time
     TBP * Ls^2 / (c dlam). */
  const collectNm = st.filterNm > 0 ? st.filterNm
                  : (bw.nm !== null ? bw.nm : null);
  const tauSpec_fs = collectNm === null ? null
    : 1e15 * TBP_GAUSS * Math.pow(Ls * 1e-6, 2)
      / (2.99792458e8 * collectNm * 1e-9);
  /* Which mechanism is broader is which one you see. */
  const dipTri = twoPol && DL_fs > 0
                 && (tauSpec_fs === null || DL_fs >= tauSpec_fs);
  const dipWidth_fs = dipTri ? DL_fs : (tauSpec_fs === null ? 0 : tauSpec_fs);

  /* --- CHSH --- */
  const dm = dmBest();
  const tsi = tsirelson();
  const lhv = lhvMax();
  const Emeas = Eqm(st.anaA * DEG, st.anaB * DEG, st.visib);
  const Snow = Sqm(st.anaA * DEG, (st.anaA + 45) * DEG,
                   st.anaB * DEG, (st.anaB + 45) * DEG, st.visib);

  /* --- how much of this light an eye could see --- */
  const lumS = luminous(Ls);

  const M = {
    st: st, C: C, Lp: Lp, Ls: Ls, Li: Li, Ldeg: Ldeg, L_um: L_um,
    thPm: thPm, cutDeg: thPm * RAD, cutColl: cutColl, cutAlt: cutAlt,
    cutSpread: cutSpread, period: period, period0: period0,
    idx: idx, walk: walk, cone: cone, OmsExt: OmsExt, OmiExt: OmiExt,
    circular: circular,
    get ringA() { return ringsNow().A; },
    get ringB() { return ringsNow().B; },
    get cross() { return ringsNow().cross; },
    dk0: dk0, sincColl: sincColl, bw: bw,
    get tune() { return tuneNow(); },
    twoPol: twoPol, ngO: ngO, ngE: ngE, dng: dng, DL_fs: DL_fs,
    collectNm: collectNm, tauSpec_fs: tauSpec_fs,
    dipTri: dipTri, dipWidth_fs: dipWidth_fs,
    dm: dm, tsi: tsi, lhv: lhv, Emeas: Emeas, Snow: Snow,
    lumS: lumS, warn: warn,
    degenerate: Math.abs(st.sigFrac - 1) < 1e-9,
  };
  return M;
}

/* --------------------------------------------------------------------------
 *  The signal wavelengths for which BOTH daughters stay inside the dispersion
 *  fits.
 *
 *  This is a hard domain limit, not a quality warning.  A Sellmeier
 *  polynomial with a negative lambda^2 coefficient does not merely lose
 *  accuracy outside its range -- it eventually returns n^2 < 0.  The Eimerl
 *  BBO fit does so beyond about 13 um, and a signal only 8 nm above the pump
 *  puts its idler at 20 um, so a search bracket set from the SIGNAL's range
 *  alone walks straight into it.  That is exactly how the first version of
 *  the bandwidth search died.
 * ------------------------------------------------------------------------ */
function signalWindow(C, Lp) {
  const lo1 = Math.max(SELL[C.o].range[0], SELL[C.e].range[0]);
  const hi1 = Math.min(SELL[C.o].range[1], SELL[C.e].range[1]);
  /* If the pump is at or past the red end of the fits there is no valid
     signal at all, and every bound below would be nonsense. */
  if (!(hi1 > Lp)) return null;
  /* Keeping the IDLER inside the fits is the binding constraint:
     Ls >= 1/(1/Lp - 1/hi1) gives Li <= hi1.  That bound is automatically
     greater than Lp itself, because 1/Lp - 1/hi1 < 1/Lp whenever hi1 > 0, so
     a positive idler needs no separate guard -- an earlier version carried one
     and mutation testing correctly reported it as unreachable. */
  const lo = Math.max(lo1, 1 / (1 / Lp - 1 / hi1));
  const dHi = 1 / Lp - 1 / lo1;          /* Ls below this keeps Li >= lo1 */
  const hi = Math.min(hi1, dHi > 0 ? 1 / dHi : Infinity);
  return hi > lo ? [lo, hi] : null;
}

/* Bracketed bisection of the dk field along a ray at fixed azimuth.  Scans
   coarsely first so that EVERY sign change is seen -- a bare root finder on a
   cone that does not enclose the pump direction silently picks whichever
   branch it lands on. */
function traceRay(C, Lp, thPm, Ls, phi, first, period, OmMax) {
  const top = OmMax === undefined ? 0.22 : OmMax;    /* ~12.6 degrees */
  const N = 160;
  let prevOm = 1e-9, prev = dkField(C, Lp, thPm, Ls, prevOm, phi, first, period);
  if (prev === null) return null;
  if (prev === 0) return prevOm;
  for (let i = 1; i <= N; i++) {
    const om = top * i / N;
    const v = dkField(C, Lp, thPm, Ls, om, phi, first, period);
    if (v === null) return null;
    if (prev * v <= 0) {
      let a = prevOm, b = om, fa = prev;
      /* 50 halvings of a 1.4e-3 rad bracket is already 1e-18 -- past double
         precision.  80 was 30 wasted evaluations on every traced point. */
      for (let j = 0; j < 50; j++) {
        const m = 0.5 * (a + b);
        const fm = dkField(C, Lp, thPm, Ls, m, phi, first, period);
        if (fm === null) return null;
        if (fa * fm <= 0) b = m; else { a = m; fa = fm; }
      }
      return 0.5 * (a + b);
    }
    prevOm = om; prev = v;
  }
  return null;
}

/* --------------------------------------------------------------------------
 *  Where two far-field rings cross.
 *
 *  Both rings are closed curves in the plane of external emission angles, each
 *  parametrised by its OWN azimuth -- so they are compared as polylines, not
 *  azimuth by azimuth.  (Comparing them azimuth by azimuth would be wrong:
 *  the o-photon at azimuth phi is partnered by the e-photon at phi + pi, and
 *  the two curves are traced independently.)
 * ------------------------------------------------------------------------ */
function segInt(p, q, r, s) {
  const d1x = q[0] - p[0], d1y = q[1] - p[1];
  const d2x = s[0] - r[0], d2y = s[1] - r[1];
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-18) return null;
  const t = ((r[0] - p[0]) * d2y - (r[1] - p[1]) * d2x) / den;
  const u = ((r[0] - p[0]) * d1y - (r[1] - p[1]) * d1x) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return [p[0] + t * d1x, p[1] + t * d1y];
}
function ringCrossings(A, B) {
  const P = r => r.filter(p => p.ext !== null && p.Om !== null)
                  .map(p => [p.ext * Math.cos(p.phi), p.ext * Math.sin(p.phi)]);
  const a = P(A), b = P(B), out = [];
  for (let i = 0; i + 1 < a.length; i++)
    for (let j = 0; j + 1 < b.length; j++) {
      const hit = segInt(a[i], a[i + 1], b[j], b[j + 1]);
      if (!hit) continue;
      let dup = false;
      for (const o of out)
        if (Math.hypot(o[0] - hit[0], o[1] - hit[1]) < 1e-4) { dup = true; break; }
      if (!dup) out.push(hit);
    }
  return out;
}

/* Group index of the extraordinary ray in ITS OWN direction.  n_e(theta) is a
   function of wavelength through both n_o and n_e, so the derivative has to
   go through nExt rather than through either principal index alone. */
function ngExtAt(C, L, thPm, Om) {
  const th = thetaToAxis(thPm, Om, PI);
  const f = LL => nExt(nOf(C.o, LL), nOf(C.e, LL), th);
  const hstep = 1e-6;
  const d = (f(L + hstep) - f(L - hstep)) / (2 * hstep);
  return f(L) - L * d;
}

/* Half-power full width in signal wavelength of sinc^2(dk L/2), searched only
   inside the range where the dispersion fits are valid; a width that does not
   close inside that window is reported as such rather than extrapolated. */
function bandwidth(C, Lp, thPm, L0, L_um, period, Om) {
  const g = LL => {
    const d = dkField(C, Lp, thPm, LL, Om || 0, 0, 'o', period);
    return d === null ? null : Math.abs(d * L_um / 2) - SINC2_HALF;
  };
  const win = signalWindow(C, Lp);
  if (win === null) return { lo: null, hi: null, nm: null, closed: false };
  const lo0 = win[0], hi0 = win[1];
  const bisect = (a, b) => {
    let fa = g(a);
    if (fa === null) return null;
    for (let i = 0; i < 90; i++) {
      const m = 0.5 * (a + b), fm = g(m);
      if (fm === null) return null;
      if (fa * fm <= 0) b = m; else { a = m; fa = fm; }
    }
    return 0.5 * (a + b);
  };
  const g0 = g(L0);
  if (g0 === null || g0 > 0) return { lo: null, hi: null, nm: null, closed: false };
  const gl = g(lo0), gh = g(hi0);
  const lo = (gl !== null && gl > 0) ? bisect(lo0, L0) : null;
  const hi = (gh !== null && gh > 0) ? bisect(hi0, L0) : null;
  return { lo: lo, hi: hi, closed: lo !== null && hi !== null,
           nm: (lo !== null && hi !== null) ? (hi - lo) * 1000 : null };
}

/* ============================================================================
 *  readout, equation bar, canvas tag
 * ========================================================================== */
function row(lab, val, cls) {
  return '<tr><td>' + lab + '</td><td class="v' + (cls ? ' ' + cls : '') + '">'
       + val + '</td></tr>';
}
function hd(t) { return '<tr><td class="hd" colspan="2">' + t + '</td></tr>'; }
function degs(x, n) { return x === null || !isFinite(x) ? '—'
                           : sg(x * RAD, n === undefined ? 4 : n) + '°'; }
function nmS(L, n) { return !isFinite(L) ? '—'
                          : sg(L * 1000, n === undefined ? 4 : n) + ' nm'; }

function readoutHTML(M) {
  const st = M.st, C = M.C;
  let s = '<div class="rname">' + C.name
        + '<small>' + C.note + '</small></div><table>';

  s += hd('the three waves');
  s += row('pump', nmS(M.Lp));
  s += row('signal', nmS(M.Ls));
  s += row('idler', nmS(M.Li));
  s += row('degenerate at', nmS(M.Ldeg), M.degenerate ? 'good' : '');

  if (!C.poled) {
    s += hd('the cut');
    s += row('collinear, ' + SELL[C.o].ref, degs(M.cutColl));
    if (M.cutAlt !== null && M.cutAlt !== undefined)
      s += row('collinear, ' + SELL[C.alt.o].ref, degs(M.cutAlt));
    if (M.cutSpread !== null)
      s += row('spread between fits', sg(M.cutSpread, 3) + '°',
               M.cutSpread > 0.3 ? 'bad' : '');
    s += row('cut in force', degs(M.thPm));
    s += row('walk-off ρ', degs(M.walk, 3));
  } else {
    s += hd('the poling');
    s += row('ideal period Λ₀', sg(M.period0, 6) + ' µm');
    s += row('period in force', sg(M.period, 6) + ' µm');
    s += row('detune', sg(st.periodPct, 3) + ' %');
    s += row('coherence length', sg(M.period0 / 2, 5) + ' µm');
    s += row('d_eff factor 2/π', sg(QPM_DEFF, 5));
  }

  s += hd('what comes out');
  s += row('signal cone (inside)', degs(M.cone ? M.cone.Oms : null));
  s += row('signal cone (outside)', degs(M.OmsExt));
  s += row('idler cone (outside)', degs(M.OmiExt));
  s += row('Δk along the pump', M.dk0 === null ? '—'
           : sg(M.dk0, 3) + ' µm⁻¹');
  s += row('sinc² there', sg(M.sincColl, 4),
           M.sincColl > 0.5 ? 'good' : '');
  s += row('crystal length', sg(st.lenMm, 3) + ' mm');
  s += row('collected bandwidth', M.bw.nm === null ? 'wider than the fit'
           : sg(M.bw.nm, 4) + ' nm');

  if (st.view === 'bell') {
    s += hd('CHSH');
    s += row('local realism allows', sg(M.lhv, 3));
    s += row('quantum reaches', sg(M.tsi.S, 6), 'good');
    s += row('at this setting', sg(Math.abs(M.Snow), 4),
             Math.abs(M.Snow) > 2 ? 'good' : 'bad');
    s += row('E(a,b) here', sg(M.Emeas, 4));
    s += hd('measured');
    s += row('Dehlinger 2002 |S|', sg(M.dm.absS, 4) + ' ± '
             + sg(M.dm.sigma, 2), 'good');
    s += row('… in σ above 2', sg(M.dm.sigmas, 3));
    s += row('Weihs 1998 S', WEIHS.S + ' ± ' + WEIHS.sig, 'good');
  }
  if (st.view === 'dip') {
    s += hd('the dip');
    s += row('n_g of the two', sg(M.ngO, 6) + ' / ' + sg(M.ngE, 6));
    s += row('Δn_g', sg(M.dng, 5), M.twoPol ? '' : 'bad');
    s += row('group delay DL', sg(M.DL_fs, 4) + ' fs');
    s += row('spectral τ', M.tauSpec_fs === null ? '—'
             : sg(M.tauSpec_fs, 4) + ' fs');
    s += row('dip is', M.dipTri ? 'a triangle' : 'a Gaussian');
    s += row('width', sg(M.dipWidth_fs, 4) + ' fs');
    s += row('delay now', sg(st.delayFs, 4) + ' fs');
  }

  s += '</table>';

  if (M.warn.length)
    s += '<div class="note"><b>extrapolated:</b> ' + M.warn.join('; ')
       + '. The only KTP fit retrievable here starts at 430 nm.</div>';

  if (st.view === 'rings')
    s += '<div class="note">' + (M.lumS > 0.01
      ? 'These daughters are inside the visible band.'
      : 'At ' + nmS(M.Ls, 3) + ' this light is <b>invisible</b> — the eye’s '
        + 'response there is ' + fmtExp(M.lumS, 2) + ' of its peak. The famous '
        + 'photographs of these rings are taken with a camera that reaches into '
        + 'the near infrared.') + '</div>';

  s += '<div class="note"><b>source:</b> ' + SELL[C.o].ref + ' / '
     + SELL[C.e].ref + ' via refractiveindex.info. Counts in the Bell view are '
     + 'Dehlinger &amp; Mitchell 2002 Table I, verbatim.</div>';
  return s;
}

function eqbarText(M) {
  const v = M.st.view;
  if (v === 'crystal')
    return '<span class="lhs">ω<sub>p</sub></span> = ω<sub>s</sub> + '
      + 'ω<sub>i</sub> &nbsp;&nbsp;and&nbsp;&nbsp; <span class="hl">'
      + '<b>k</b><sub>p</sub> = <b>k</b><sub>s</sub> + <b>k</b><sub>i</sub></span>'
      + '<span class="sm">Energy conservation is free. Momentum conservation is '
      + 'the entire difficulty — it is what the cut angle, the cone and the '
      + 'bandwidth all come from.</span>';
  if (v === 'match')
    return '<span class="lhs">R</span> ∝ sinc<sup>2</sup>(<span class="hl">'
      + 'Δk</span> L / 2), &nbsp; Δk = k<sub>p</sub> − '
      + 'k<sub>s</sub>cosΩ<sub>s</sub> − k<sub>i</sub>cosΩ<sub>i</sub>'
      + '<span class="sm">A longer crystal is a narrower sinc: more pairs, but '
      + 'into a smaller slice of angle and colour.</span>';
  if (v === 'index')
    return '<span class="lhs">1 / n<sub>e</sub>(θ)<sup>2</sup></span> = '
      + 'cos<sup>2</sup>θ / n<sub>o</sub><sup>2</sup> + <span class="hl">'
      + 'sin<sup>2</sup>θ / n<sub>e</sub><sup>2</sup></span>'
      + '<span class="sm">The pump’s index is a knob you turn by cutting the '
      + 'crystal at an angle. That is the whole trick of birefringent phase '
      + 'matching.</span>';
  if (v === 'rings')
    return '<span class="lhs">sinθ<sub>ext</sub></span> = n sinΩ '
      + '&nbsp;&nbsp;—&nbsp;&nbsp; <span class="hl2">the same transverse '
      + 'momentum on both sides of the face</span>'
      + '<span class="sm">Which is why, at degeneracy, the two type-II cones are '
      + 'exact mirror images of one another outside the crystal.</span>';
  if (v === 'bell')
    return '<span class="lhs">S</span> = E(a,b) − E(a,b′) + '
      + 'E(a′,b) + E(a′,b′) &nbsp; ≤ <span class="hl">2</span>'
      + ' &nbsp;but reaches <span class="hl2">2√2</span>'
      + '<span class="sm">The 2 is enumerated over all sixteen local strategies; '
      + 'the 2√2 is found by maximising S. Neither is quoted.</span>';
  return '<span class="lhs">P<sub>cc</sub>(τ)</span> = ½ [ 1 − '
    + '<span class="hl">Λ(τ / DL)</span> ]'
    + '<span class="sm">With no filter the two-photon amplitude is flat across the '
    + 'crystal’s group delay, so the dip is a triangle — exactly.</span>';
}

function tagText(M) {
  const v = M.st.view, C = M.C;
  const T = {
    crystal: '<b>the crystal.</b> one photon in, two out',
    match:   '<b>phase matching.</b> what momentum conservation costs',
    index:   '<b>the index surface.</b> where the cut angle comes from',
    rings:   '<b>the rings.</b> the far field, as a camera sees it',
    bell:    '<b>entanglement.</b> what the crossings are for',
    dip:     '<b>the dip.</b> two photons, one beamsplitter',
  };
  return T[v] + '<br>' + C.name + ', ' + sg(M.Lp * 1000, 4) + ' nm pump';
}

/* --------------------------------------------------------------------------
 *  Two side-by-side plot boxes, with the margins in ONE place.
 *
 *  The left margin has to clear everything axes() draws to the LEFT of a box:
 *  tick labels right-aligned at b.x - 6 (a label like "-0.0050" is ~40 px at
 *  10.5 px) and the rotated axis title at b.x - 40.  A 30 px margin put seven
 *  tick labels per view off the canvas in three views and the rotated titles
 *  at x = -10, where the display-list audit could not see them at all because
 *  it skips rotated ops.  The gap between the boxes has to clear the same
 *  furniture on the right-hand box.
 * ------------------------------------------------------------------------ */
/* A legend drawn over live curves needs its own background.  There is no
   corner that is reliably empty: cos2(a-b) returns to +1 at BOTH ends of the
   correlation panel, and S(b) sweeps the full height of the CHSH panel, so a
   bare legend in any corner ends up with a curve or a bound line through it.
   Drawn opaque, because an alpha panel over a dashed line composites twice. */
function legendBox(ctx, x, y, items, opt) {
  const o = opt || {};
  ctx.save();
  ctx.font = '10.5px -apple-system, sans-serif';
  let wmax = 0;
  for (const it of items)
    wmax = Math.max(wmax, ctx.measureText(plain(it[1])).width);
  const w = wmax + 30, hh = items.length * 14 + 9;
  const X = o.right ? x - w : x, Y = o.up ? y - hh : y;
  ctx.fillStyle = 'rgb(9,11,17)';
  ctx.fillRect(X, Y, w, hh);
  ctx.strokeStyle = '#232838'; ctx.lineWidth = 1;
  ctx.strokeRect(X + 0.5, Y + 0.5, w - 1, hh - 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  let yy = Y + 5;
  for (const it of items) {
    ctx.fillStyle = it[0]; ctx.fillRect(X + 8, yy + 4, 10, 3);
    ctx.fillStyle = C_DIM; ctx.fillText(plain(it[1]), X + 23, yy);
    yy += 14;
  }
  ctx.restore();
  return { w: w, h: hh };
}

const PLOT_L = 68, PLOT_R = 22, PLOT_GAP = 66;
function twoBoxes(W, top, hgt) {
  const bw = Math.max(60, (W - PLOT_L - PLOT_R - PLOT_GAP) / 2);
  return [box(PLOT_L, top, bw, hgt), box(PLOT_L + bw + PLOT_GAP, top, bw, hgt)];
}

/* ============================================================================
 *  view 1 -- the crystal
 *
 *  A 3-D picture of the whole arrangement.  The cone angles are a few degrees
 *  and the crystal is millimetres, so the cones are drawn with an angular
 *  MAGNIFICATION and the factor is printed on the canvas -- an unlabelled
 *  exaggeration is on this project's Known-bad list.
 * ========================================================================== */
function ringWorld(M, r, mag, xExit, xScreen) {
  /* A ring point, mapped to where it lands on the screen plane. */
  const pts = [];
  for (const p of r) {
    if (p.ext === null || p.Om === null) { pts.push(null); continue; }
    const a = p.ext * mag;
    const rad = (xScreen - xExit) * Math.tan(a);
    pts.push([xScreen, rad * Math.cos(p.phi), rad * Math.sin(p.phi)]);
  }
  return pts;
}

function drawCrystal(ctx, W, H, M, S) {
  const st = M.st, C = M.C;
  const cam = { theta: S.camTheta, phi: S.camPhi, dist: 8.0 / S.zoom,
                fov: 0.78, target: [0.95, 0, 0], W: W, H: H };
  const B = camBasis(cam);
  const P = p => project(cam, B, p);

  /* --- world geometry.  The pump runs along +x. --- */
  const half = 0.55, ap = 0.62;        /* crystal half-length and half-aperture */
  const xIn = -half, xOut = half;
  const xScreen = 3.9;

  /* angular magnification: put the widest ring at a fixed screen radius */
  let maxExt = 0;
  for (const r of [M.ringA, M.ringB])
    if (r) for (const p of r) if (p.ext !== null) maxExt = Math.max(maxExt, p.ext);
  if (!(maxExt > 0)) maxExt = 3 * DEG;
  const wantR = 1.05;
  const mag = Math.atan(wantR / (xScreen - xOut)) / maxExt;

  const quads = [];
  const push = (pts, col, alpha) => {
    const pp = pts.map(P);
    if (pp.some(q => q === null)) return;
    const z = pp.reduce((a, q) => a + q.z, 0) / pp.length;
    quads.push({ pp, col, alpha, z });
  };
  /* the crystal, as four side faces -- premixed against the background and
     drawn opaque, because an overlapping alpha seam reads as corduroy. */
  const cs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
  for (let i = 0; i < 4; i++) {
    const a = cs[i], b = cs[(i + 1) % 4];
    push([[xIn, a[0] * ap, a[1] * ap], [xOut, a[0] * ap, a[1] * ap],
          [xOut, b[0] * ap, b[1] * ap], [xIn, b[0] * ap, b[1] * ap]],
         mix('#070b18', '#2b3550', 0.55), 1);
  }
  quads.sort((a, b) => b.z - a.z);
  for (const q of quads) {
    ctx.beginPath();
    ctx.moveTo(q.pp[0].x, q.pp[0].y);
    for (let i = 1; i < q.pp.length; i++) ctx.lineTo(q.pp[i].x, q.pp[i].y);
    ctx.closePath();
    ctx.fillStyle = q.col; ctx.fill();
    ctx.strokeStyle = '#3d4a68'; ctx.lineWidth = 1; ctx.stroke();
  }

  const line = (a, b, col, lw, dash) => {
    const p = P(a), q = P(b);
    if (!p || !q) return;
    ctx.save();
    if (dash) ctx.setLineDash(dash);
    ctx.strokeStyle = col; ctx.lineWidth = lw || 1.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    ctx.restore();
  };

  /* the screen */
  const scr = [[xScreen, -1.32, -1.32], [xScreen, 1.32, -1.32],
               [xScreen, 1.32, 1.32], [xScreen, -1.32, 1.32]];
  const sp = scr.map(P);
  if (sp.every(q => q !== null)) {
    ctx.beginPath(); ctx.moveTo(sp[0].x, sp[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(sp[i].x, sp[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(14,18,28,0.85)'; ctx.fill();
    ctx.strokeStyle = '#232b3c'; ctx.lineWidth = 1; ctx.stroke();
  }

  /* the pump */
  line([-3.4, 0, 0], [xIn, 0, 0], C_CYAN, 2.4);
  line([xIn, 0, 0], [xOut, 0, 0], rgba(C_CYAN, 0.75), 2.0);
  line([xOut, 0, 0], [xScreen, 0, 0], rgba(C_CYAN, 0.32), 1.4, [5, 5]);

  /* the optic axis, and the walk-off of the extraordinary pump */
  if (st.showAxis && !C.poled) {
    const t = M.thPm;
    const d = [Math.cos(t), Math.sin(t), 0];
    line([-1.25 * d[0], -1.25 * d[1], 0], [1.25 * d[0], 1.25 * d[1], 0],
         '#7f8bd8', 1.4, [6, 4]);
    /* Label the HIGHER of the two projected ends and lift it clear: at the
       default camera the other end lands on the crystal, the pump and the
       walk-off dashes all at once, which is where it was. */
    const e1 = P([1.25 * d[0], 1.25 * d[1], 0]);
    const e2 = P([-1.25 * d[0], -1.25 * d[1], 0]);
    const ref = P([0, 0, 0]);
    /* Pick the end that is FURTHEST from the pump beam on screen, and put the
       text on the far side of it.  Picking "the higher one" was not enough:
       at some camera angles both ends are near the beam and the label landed
       on the pump line, the walk-off dashes and the crystal at once. */
    let pa = e1, other = e2;
    if (e1 && e2 && ref && Math.abs(e2.y - ref.y) > Math.abs(e1.y - ref.y))
      { pa = e2; other = e1; }
    if (!pa) pa = other;
    if (pa) {
      const above = !ref || pa.y <= ref.y;
      ctx.fillStyle = '#7f8bd8'; ctx.font = 'italic 12px Georgia, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = above ? 'bottom' : 'top';
      ctx.fillText('optic axis', pa.x, pa.y + (above ? -10 : 10));
    }
  }
  if (st.showWalk && !C.poled && Math.abs(M.walk) > 1e-6) {
    const wm = 8;             /* the walk-off is a few degrees; show it x8 */
    const yw = (xOut - xIn) * Math.tan(M.walk * wm);
    line([xIn, 0, 0], [xOut, yw, 0], C_ORANGE, 1.6, [3, 3]);
  }

  /* the cones */
  let coincide = false;
  if (st.showCones && M.ringA) {
    /* At degeneracy the signal and idler rings are the SAME curve, so drawing
       both paints one exactly over the other and the second colour silently
       wins.  Detect it and draw one ring, labelled, rather than pretending
       there are two. */
    coincide = M.ringB !== null && M.ringA.every((p, i) =>
      (p.ext === null) === (M.ringB[i].ext === null)
      && (p.ext === null || Math.abs(p.ext - M.ringB[i].ext) < 1e-9));
    const RS = coincide ? [[M.ringA, C_GREEN, 'signal and idler']]
                        : [[M.ringA, C_GREEN, 'signal'], [M.ringB, C_ORANGE, 'idler']];
    for (const [r, col, lab] of RS) {
      if (!r) continue;
      const wpts = ringWorld(M, r, mag, xOut, xScreen);
      /* ruled lines from the exit point out to the ring */
      for (let i = 0; i < wpts.length - 1; i += 6) {
        if (!wpts[i]) continue;
        line([xOut, 0, 0], wpts[i], rgba(col, 0.18), 1);
      }
      /* the ring itself */
      ctx.beginPath();
      let started = false;
      for (const w of wpts) {
        if (!w) { started = false; continue; }
        const q = P(w);
        if (!q) { started = false; continue; }
        if (!started) { ctx.moveTo(q.x, q.y); started = true; }
        else ctx.lineTo(q.x, q.y);
      }
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    }
    /* the crossings, where the polarisation is undetermined */
    for (const c of M.cross) {
      const a = Math.hypot(c[0], c[1]) * mag;
      const rad = (xScreen - xOut) * Math.tan(a);
      const ph = Math.atan2(c[1], c[0]);
      const q = P([xScreen, rad * Math.cos(ph), rad * Math.sin(ph)]);
      if (!q) continue;
      ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, TAU);
      ctx.fillStyle = C_MAG; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
    }
  }

  /* labels */
  ctx.font = '11.5px -apple-system, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const lp = P([xIn - 1.6, 0, 0]);
  if (lp) { ctx.fillStyle = C_CYAN; ctx.fillText('pump', lp.x, lp.y - 14); }

  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'The cone angles are drawn ×' + sg(mag, 3) + ' and the '
    + 'walk-off ×8; everything else is to scale. '
    + (coincide ? 'Signal and idler are the same colour here, so their cones '
                + 'coincide exactly and one curve is drawn. ' : '')
    + (M.cone === null
       /* A view that cannot draw its subject has to SAY so -- an empty stage
          with a confident caption about crossings is worse than useless. */
       ? 'Nothing is drawn beyond the crystal because nothing is phase matched: '
         + 'this cut is ' + sg(Math.abs(st.cutOff), 3) + '° '
         + (st.cutOff < 0 ? 'BELOW' : 'past') + ' the collinear angle'
         + (M.cutColl !== null ? ' of ' + sg(M.cutColl * RAD, 5) + '°' : '')
         + ', and below that angle the momentum triangle cannot close at any '
         + 'emission angle at all. Raise the cut to open a cone.'
       : M.cross.length
       ? 'The two marked crossings are the only directions where a photon could '
         + 'be either polarisation — that is where the entangled pairs are '
         + 'collected.'
       : (C.kind === 'I' || C.kind === '0'
          ? 'Both daughters share one polarisation, so there is one cone per '
            + 'wavelength and no crossing: type I is entangled in colour and '
            + 'angle, not in polarisation.'
          : 'No crossing at this cut.'));
  const foot = C.name + ' — ' + C.note + '. Indices from '
    + SELL[C.o].ref + '. Screen distance is arbitrary; only angles matter.';
  const L = stage(ctx, W, H, cap, foot, capW);
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 2 -- phase matching
 * ========================================================================== */
function drawMatch(ctx, W, H, M, S) {
  const st = M.st, C = M.C;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'Left: the phase mismatch along the pump as the signal colour is '
    + 'swept, and the sinc² it produces. Right: the tuning curve — the '
    + 'angle each colour comes out at. The crystal length enters only through '
    + 'Δk·L, so it changes the width of both and nothing else.';
  const foot = 'Half-power of sinc² at ΔkL/2 = ' + sg(SINC2_HALF, 9)
    + ', found by bisection rather than quoted. Crystal ' + sg(st.lenMm, 3)
    + ' mm.';
  const L = stage(ctx, W, H, cap, foot, capW);

  const top = L.top + 16;
  const hgt = Math.max(90, L.plotH - 16);
  const [bA, bB] = twoBoxes(W, top, hgt);

  /* ---- A: dk and sinc^2 against signal wavelength ---- */
  const win = signalWindow(C, M.Lp);
  const xs = [], dks = [], sn = [];
  if (win) {
    const n = 320;
    for (let i = 0; i <= n; i++) {
      const Lq = win[0] + (win[1] - win[0]) * i / n;
      const d = dkField(C, M.Lp, M.thPm, Lq, M.cone ? M.cone.Oms : 0, 0, 'o',
                        M.period);
      xs.push(Lq * 1000);
      dks.push(d === null ? NaN : d);
      sn.push(d === null ? NaN : sinc2(d * M.L_um / 2));
    }
  }
  const fin = dks.filter(isFinite);
  const dlo = fin.length ? Math.min(...fin) : -1, dhi = fin.length ? Math.max(...fin) : 1;
  const pad = 0.12 * (dhi - dlo || 1);
  const xlo = xs.length ? xs[0] : 400, xhi = xs.length ? xs[xs.length - 1] : 1000;
  axes(ctx, bA, xlo, xhi, dlo - pad, dhi + pad,
       { xlab: 'signal wavelength  (nm)', ylab: 'Δk  (µm⁻¹)',
         title: 'the mismatch, at the collection angle',
         xfmt: t => sg(t, 4), yfmt: t => sg(t, 2) });
  clipTo(ctx, bA, () => {
    /* dk = 0 is the whole target */
    const y0 = bA.y1 - bA.h * (0 - (dlo - pad)) / ((dhi + pad) - (dlo - pad) || 1);
    ctx.strokeStyle = rgba(C_CYAN, 0.45); ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(bA.x, y0); ctx.lineTo(bA.x1, y0); ctx.stroke();
    ctx.setLineDash([]);
    polyline(ctx, bA, xs, dks, xlo, xhi, dlo - pad, dhi + pad, C_GREEN, 1.9);
    /* the sinc^2 weight, on its own 0..1 scale mapped into the box */
    const sy = sn.map(v => (dlo - pad) + ((dhi + pad) - (dlo - pad)) * v);
    polyline(ctx, bA, xs, sy, xlo, xhi, dlo - pad, dhi + pad, C_MAG, 1.5, [5, 3]);
    /* the tracked wavelength */
    const X = bA.x + bA.w * (M.Ls * 1000 - xlo) / (xhi - xlo || 1);
    ctx.strokeStyle = rgba(C_ORANGE, 0.8); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(X, bA.y); ctx.lineTo(X, bA.y1); ctx.stroke();
  });
  ctx.font = '10.5px -apple-system, sans-serif'; ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = C_GREEN; ctx.fillText('Δk', bA.x + 8, bA.y + 6);
  ctx.fillStyle = C_MAG;
  ctx.fillText('sinc²(ΔkL/2), scaled to the box', bA.x + 8, bA.y + 20);
  if (M.bw.nm !== null) {
    ctx.fillStyle = C_DIM;
    ctx.fillText('FWHM ' + sg(M.bw.nm, 4) + ' nm', bA.x + 8, bA.y + 34);
  }

  /* ---- B: the tuning curve ---- */
  const tv = M.tune.filter(t => t.ext !== null);
  const tx = tv.map(t => t.L * 1000), ty = tv.map(t => t.ext * RAD);
  const ylo2 = 0, yhi2 = tv.length ? Math.max(1, Math.max(...ty) * 1.12) : 8;
  const xlo2 = xs.length ? xlo : 400, xhi2 = xs.length ? xhi : 1000;
  axes(ctx, bB, xlo2, xhi2, ylo2, yhi2,
       { xlab: 'signal wavelength  (nm)',
         ylab: 'external emission angle  (°)',
         title: 'the tuning curve', xfmt: t => sg(t, 4), yfmt: t => sg(t, 3) });
  clipTo(ctx, bB, () => {
    pl(ctx, bB, tv.map((t, i) => [tx[i], ty[i]]), xlo2, xhi2, ylo2, yhi2,
       C_GREEN, 1.9);
    if (M.OmsExt !== null) {
      const X = bB.x + bB.w * (M.Ls * 1000 - xlo2) / (xhi2 - xlo2 || 1);
      const Y = bB.y1 - bB.h * (M.OmsExt * RAD - ylo2) / (yhi2 - ylo2 || 1);
      ctx.beginPath(); ctx.arc(X, Y, 4.5, 0, TAU);
      ctx.fillStyle = C_ORANGE; ctx.fill();
    }
    /* the degenerate wavelength */
    const Xd = bB.x + bB.w * (M.Ldeg * 1000 - xlo2) / (xhi2 - xlo2 || 1);
    ctx.strokeStyle = rgba(C_CYAN, 0.5); ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(Xd, bB.y); ctx.lineTo(Xd, bB.y1); ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.fillStyle = C_DIM; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '10.5px -apple-system, sans-serif';
  ctx.fillText('dashed: degenerate', bB.x + 8, bB.y + 6);

  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 3 -- the index surface
 *
 *  Where the cut angle COMES FROM.  n_o is a circle, n_e(theta) is an ellipse,
 *  and the phase-matching direction is where the pump's ellipse crosses the
 *  daughters' circle.  The indices all sit between about 1.54 and 1.70, so the
 *  radial axis is an ANNULUS over that window rather than a scale from zero --
 *  the eccentricity on screen is therefore hugely exaggerated, and the caption
 *  says by how much.
 * ========================================================================== */
function drawIndex(ctx, W, H, M, S) {
  const st = M.st, C = M.C;
  const capW = Math.min(430, W - RO.w - 60);
  const exagg = C.poled ? null : (M.idx.noP / (M.idx.noP - nOf(C.e, M.Lp)));
  const cap = C.poled
    ? 'A poled crystal has no angle to tune: the grating supplies the missing '
      + 'momentum instead, so this panel shows the dispersion alone and the '
      + 'period does the work the cut angle does elsewhere.'
    : 'Left, in polar form: the pump’s extraordinary index against direction '
      + '(an ellipse) and the daughters’ ordinary index (a circle). They cross '
      + 'at one angle, and that angle is the cut. The radial axis spans only '
      + sg(1.0, 2) + ' — see the tick labels — so the ellipse’s flattening is '
      + 'drawn about ×' + sg(exagg, 3) + ' larger than it is.';
  const foot = 'Right: both retrieved fits, and their difference. Two '
    + 'independent Sellmeier fits of the same crystal disagree at the 1e-3 '
    + 'level, which is the honest uncertainty on every angle in this file.';
  const L = stage(ctx, W, H, cap, foot, capW);

  const top = L.top + 16;
  const hgt = Math.max(90, L.plotH - 16);
  const [bA, bRight] = twoBoxes(W, top, hgt);
  if (!C.poled) {
    const noP = M.idx.noP, neP = nOf(C.e, M.Lp);
    const tgt = M.cone ? nOf(C.o, M.Ls) : noP;
    const nlo = Math.min(neP, tgt, noP) - 0.012;
    const nhi = Math.max(neP, tgt, noP) + 0.012;
    /* It is a QUARTER circle (0 to 90 degrees), so its centre belongs in the
       bottom-left corner of the box.  Centring it horizontally left the top
       and the whole left half of the panel empty. */
    const cx = bA.x + 40, cy = bA.y1 - 34;
    const R1 = Math.max(40, Math.min(bA.w - 86, bA.h - 78));
    const R0 = R1 * 0.30;
    const rad = n => R0 + (R1 - R0) * clamp((n - nlo) / (nhi - nlo), 0, 1);

    frame(ctx, bA, '#242a3a');
    ctx.save();
    ctx.beginPath(); ctx.rect(bA.x, bA.y, bA.w, bA.h); ctx.clip();

    /* radial gridlines with their index values */
    ctx.font = '10px -apple-system, sans-serif';
    for (const t of ticksFor(nlo, nhi, 4)) {
      if (t < nlo || t > nhi) continue;
      const r = rad(t);
      ctx.beginPath(); ctx.arc(cx, cy, r, -PI / 2, 0); ctx.strokeStyle = '#181d29';
      ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#6f7789'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(sg(t, 4), cx + 3, cy - r - 2);
    }
    /* angle ticks */
    ctx.strokeStyle = '#181d29';
    for (let d = 0; d <= 90; d += 15) {
      const a = d * DEG;
      ctx.beginPath();
      ctx.moveTo(cx + R0 * Math.sin(a), cy - R0 * Math.cos(a));
      ctx.lineTo(cx + R1 * Math.sin(a), cy - R1 * Math.cos(a));
      ctx.stroke();
      ctx.fillStyle = '#6f7789'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(d + '°', cx + (R1 + 13) * Math.sin(a),
                   cy - (R1 + 13) * Math.cos(a));
    }
    /* the pump's index ellipse */
    const arc = (f, col, lw, dash) => {
      ctx.save(); if (dash) ctx.setLineDash(dash);
      ctx.beginPath();
      for (let i = 0; i <= 180; i++) {
        const a = (PI / 2) * i / 180;
        const r = rad(f(a));
        const X = cx + r * Math.sin(a), Y = cy - r * Math.cos(a);
        if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
    };
    arc(a => nExt(noP, neP, a), C_MAG, 2.1);
    arc(() => noP, C_CYAN, 1.4, [4, 4]);
    arc(() => tgt, C_GREEN, 2.1);

    /* the crossing */
    if (M.cutColl !== null) {
      const a = M.cutColl, r = rad(nExt(noP, neP, a));
      const X = cx + r * Math.sin(a), Y = cy - r * Math.cos(a);
      ctx.strokeStyle = rgba(C_ORANGE, 0.75); ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(X, Y); ctx.stroke();
      ctx.beginPath(); ctx.arc(X, Y, 5, 0, TAU);
      ctx.fillStyle = C_ORANGE; ctx.fill();
      ctx.fillStyle = C_ORANGE; ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      const lx = X + 8 > bA.x1 - 70 ? X - 74 : X + 8;
      ctx.fillText('θ = ' + sg(M.cutColl * RAD, 5) + '°', lx, Y - 6);
    }
    ctx.restore();
    ctx.font = 'italic 13px Georgia, serif'; ctx.fillStyle = '#aeb6c6';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('index against direction', bA.x, bA.y - 6);
    /* legend, bottom left -- the top right of any box is under the readout */
    legendBox(ctx, bA.x1 - 8, bA.y1 - 8,
      [[C_MAG, 'pump, extraordinary  n_e(θ)'],
       [C_CYAN, 'pump, ordinary  n_o'],
       [C_GREEN, 'daughters, ordinary']], { right: true, up: true });
  } else {
    frame(ctx, bA, '#242a3a');
    caption(ctx, bA.x + 14, bA.y + 16,
      'Quasi-phase matching does not use birefringence at all. Every '
      + 'coherence length the sign of χ⁽²⁾ is reversed, which puts the '
      + 'amplitude back in step before it can cancel. The price is a factor '
      + '2/π = ' + sg(QPM_DEFF, 5) + ' in the effective nonlinearity, and the '
      + 'reward is that any polarisation combination the crystal has a tensor '
      + 'element for can be phase matched at any wavelength in its range.',
      bA.w - 28, C_TXT);
    caption(ctx, bA.x + 14, bA.y + 130,
      'Ideal period Λ₀ = ' + sg(M.period0, 6) + ' µm, so a coherence length '
      + 'is ' + sg(M.period0 / 2, 5) + ' µm. At ' + sg(st.lenMm, 3)
      + ' mm that is ' + sg(1000 * st.lenMm / (M.period0 / 2), 5)
      + ' domain reversals.', bA.w - 28, C_GREEN);
  }

  /* ---- right: dispersion, both fits, and the residual ---- */
  const bB = box(bRight.x, top, bRight.w, Math.max(60, hgt * 0.58));
  const bC = box(bRight.x, top + Math.max(60, hgt * 0.58) + 42,
                 bRight.w, Math.max(46, hgt * 0.42 - 42));
  const key = C.o, keyE = C.e, alt = C.alt;
  const r0 = SELL[key].range;
  const wlo = Math.max(r0[0], 0.3) * 1000, whi = Math.min(r0[1], 1.1) * 1000;
  const xsD = [], nO = [], nE = [], dO = [], dE = [];
  for (let i = 0; i <= 200; i++) {
    const nm = wlo + (whi - wlo) * i / 200, Lq = nm / 1000;
    xsD.push(nm);
    nO.push(nOf(key, Lq)); nE.push(nOf(keyE, Lq));
    if (alt && inRange(alt.o, Lq)) dO.push(nOf(key, Lq) - nOf(alt.o, Lq));
    else dO.push(NaN);
    if (alt && inRange(alt.e, Lq)) dE.push(nOf(keyE, Lq) - nOf(alt.e, Lq));
    else dE.push(NaN);
  }
  const allN = nO.concat(nE).filter(isFinite);
  const ylo = Math.min(...allN) - 0.01, yhi = Math.max(...allN) + 0.01;
  axes(ctx, bB, wlo, whi, ylo, yhi,
       { xlab: '', ylab: 'refractive index', title: 'dispersion, ' + SELL[key].ref,
         xfmt: t => sg(t, 4), yfmt: t => sg(t, 4) });
  clipTo(ctx, bB, () => {
    polyline(ctx, bB, xsD, nO, wlo, whi, ylo, yhi, C_CYAN, 1.9);
    polyline(ctx, bB, xsD, nE, wlo, whi, ylo, yhi, C_MAG, 1.9);
    for (const [Lq, col] of [[M.Lp, C_ORANGE], [M.Ls, C_GREEN]]) {
      if (Lq * 1000 < wlo || Lq * 1000 > whi) continue;
      const X = bB.x + bB.w * (Lq * 1000 - wlo) / (whi - wlo || 1);
      ctx.strokeStyle = rgba(col, 0.6); ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(X, bB.y); ctx.lineTo(X, bB.y1); ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  ctx.font = '10.5px -apple-system, sans-serif'; ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = C_CYAN; ctx.fillText('n_o', bB.x + 8, bB.y1 - 30);
  ctx.fillStyle = C_MAG; ctx.fillText('n_e', bB.x + 8, bB.y1 - 16);

  const resid = dO.concat(dE).filter(isFinite);
  if (resid.length) {
    const rlo = Math.min(...resid), rhi = Math.max(...resid);
    const rp = 0.2 * (rhi - rlo || 1e-4);
    axes(ctx, bC, wlo, whi, rlo - rp, rhi + rp,
         { xlab: 'wavelength  (nm)', ylab: 'Δn between fits',
           xfmt: t => sg(t, 4), yfmt: t => fmtExp(t, 1) });
    clipTo(ctx, bC, () => {
      polyline(ctx, bC, xsD, dO, wlo, whi, rlo - rp, rhi + rp, C_CYAN, 1.6);
      polyline(ctx, bC, xsD, dE, wlo, whi, rlo - rp, rhi + rp, C_MAG, 1.6);
    });
    ctx.fillStyle = C_DIM; ctx.font = '10.5px -apple-system, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(SELL[key].ref + ' − ' + SELL[alt.o].ref, bC.x + 8, bC.y + 5);
  } else {
    frame(ctx, bC, '#242a3a');
    caption(ctx, bC.x + 12, bC.y + 12,
      'Only one fit could be retrieved for this material, so there is no '
      + 'second opinion to plot. The angles derived from it carry no measured '
      + 'uncertainty here, and the file does not invent one.',
      bC.w - 24, '#767e92');
  }
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 4 -- the rings
 *
 *  The far field, as a camera records it: sinc^2(dk L/2) evaluated over
 *  emission angle and summed over wavelength.  For every crystal here except
 *  birefringent type II the pattern is exactly circular and one radial scan
 *  serves every azimuth; type II needs a scan per azimuth, which is the whole
 *  reason its picture is interesting.
 * ========================================================================== */
function ringRaster(M, nAz, nRad, nLam, spanDeg) {
  const C = M.C, Lp = M.Lp;
  const win = signalWindow(C, Lp);
  const span = spanDeg * DEG;
  const inten = new Float64Array(nAz * nRad);
  const wsum = new Float64Array(nAz * nRad);
  if (!win) return { inten, wsum, nAz, nRad, span };
  /* An unfiltered camera sees every phase-matched colour at once, and since
     SOME colour is matched at almost every angle the result is a filled disc
     with a bright rim -- true, and unreadable.  The classic ring photographs
     are taken through an interference filter, so this respects the same
     filter the dip view uses and says which case is on the canvas. */
  const half = M.st.filterNm > 0 ? M.st.filterNm / 2000 : 0;
  const lamLo = half > 0 ? Math.max(win[0], M.Ls - half)
                         : Math.max(win[0], 0.62 * M.Ldeg);
  const lamHi = half > 0 ? Math.min(win[1], M.Ls + half)
                         : Math.min(win[1], 1.62 * M.Ldeg);
  if (!(lamHi > lamLo)) return { inten, wsum, nAz, nRad, span,
                                 lamLo: lamLo, lamHi: lamHi };
  const circular = M.circular;
  const pols = (C.kind === 'II' || C.kind === 'IIq') ? ['o', 'e'] : ['o'];

  for (let li = 0; li < nLam; li++) {
    const Lq = lamLo + (lamHi - lamLo) * (nLam === 1 ? 0.5 : li / (nLam - 1));
    const nIn = nOf(C.o, Lq);
    for (const pol of pols) {
      /* an azimuth-independent pattern only needs one scan */
      const azN = circular ? 1 : nAz;
      for (let a = 0; a < azN; a++) {
        const phi = TAU * a / nAz;
        for (let r = 0; r < nRad; r++) {
          const thExt = span * (r + 0.5) / nRad;
          const sIn = Math.sin(thExt) / nIn;
          if (Math.abs(sIn) > 1) continue;
          const Om = Math.asin(sIn);
          const d = dkField(C, Lp, M.thPm, Lq, Om, phi, pol, M.period);
          if (d === null) continue;
          const w = sinc2(d * M.L_um / 2);
          if (circular) {
            for (let aa = 0; aa < nAz; aa++) {
              inten[aa * nRad + r] += w;
              wsum[aa * nRad + r] += w * Lq;
            }
          } else {
            inten[a * nRad + r] += w;
            wsum[a * nRad + r] += w * Lq;
          }
        }
      }
    }
  }
  return { inten, wsum, nAz, nRad, span, lamLo, lamHi };
}

function drawRings(ctx, W, H, M, S) {
  const st = M.st, C = M.C;
  const capW = Math.min(430, W - RO.w - 60);
  const trueCol = st.colourMode === 'true';
  const cap = 'Every direction is shaded by sinc²(ΔkL/2) summed over colour — '
    + 'this is the pattern itself, not a ring drawn at a computed radius. '
    + (st.filterNm > 0
       ? 'Through a ' + sg(st.filterNm, 3) + ' nm filter, as the classic '
         + 'photographs are taken. '
       : 'With NO filter: every angle has some colour that is phase matched, '
         + 'so the pattern fills in and only the edges stand out. ')
    + (trueCol
       ? 'Colours are real: wavelength → CIE XYZ → sRGB. Light outside the '
         + 'eye’s range therefore renders BLACK, which is the honest answer.'
       : 'Colours are FALSE — a labelled ramp across the plotted band, because '
         + 'most of this light is invisible.');
  const foot = (M.cone === null
      ? 'NOTHING IS PHASE MATCHED at this cut, so there is no pattern to draw: '
        + 'the crystal is cut below the collinear angle. '
      : '')
    + 'Window ±' + sg(st.ringSpan, 3) + '° external. '
    + (M.circular
       ? 'Both daughters share a polarisation, so the pattern is exactly '
         + 'circular and one radial scan serves every azimuth.'
       : 'Type II: the two cones are traced separately. At degeneracy they are '
         + 'exact mirror images outside the crystal, because refraction '
         + 'preserves the transverse momentum they share.');
  const L = stage(ctx, W, H, cap, foot, capW);

  const size = Math.min(W - RO.w - 70, L.plotH);
  const cx = 34 + size / 2, cy = L.top + size / 2;
  const R = size / 2;
  if (!(R > 20)) { drawStage(ctx, W, H, L); return; }

  /* A non-circular pattern needs real azimuthal resolution -- 72 cells over a
     full turn is 5 degrees each and reads as blocks.  A circular one needs
     none, because a single radial scan is replicated. */
  const filtered = st.filterNm > 0;
  const nAz = M.circular ? 128 : 168, nRad = filtered ? 110 : 78;
  const nLam = filtered ? 5 : (M.circular ? 15 : 9);
  const G = ringRaster(M, nAz, nRad, nLam, st.ringSpan);
  let peak = 0;
  for (let i = 0; i < G.inten.length; i++) peak = Math.max(peak, G.inten[i]);
  if (!(peak > 0)) peak = 1;

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.fillStyle = '#070b18'; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  /* Quads are expanded slightly about their own centroid and drawn OPAQUE.
     Abutting canvas quads leave a sub-pixel gap that antialiases into a
     stripe -- one per angular cell, all converging on the centre, which reads
     as spokes.  Under globalAlpha < 1 the overlap would composite twice and
     become a brighter stripe instead, so the colour is premixed here. */
  const EXP = 1.06;
  for (let a = 0; a < G.nAz; a++) {
    const p0 = TAU * a / G.nAz, p1 = TAU * (a + 1) / G.nAz;
    const pm = 0.5 * (p0 + p1), dp = 0.5 * (p1 - p0) * EXP;
    for (let r = 0; r < G.nRad; r++) {
      const v = G.inten[a * G.nRad + r];
      if (!(v > 1e-9)) continue;
      const I = clamp(v / peak, 0, 1);
      if (I < 0.004) continue;
      const lam = G.wsum[a * G.nRad + r] / v;
      const col = trueCol ? trueColourUm(lam, I)
                          : falseColour(lam, G.lamLo, G.lamHi, I);
      const r0 = R * r / G.nRad, r1 = R * (r + 1) / G.nRad;
      const rm = 0.5 * (r0 + r1), dr = 0.5 * (r1 - r0) * EXP;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(0, rm - dr), pm - dp, pm + dp);
      ctx.arc(cx, cy, rm + dr, pm + dp, pm - dp, true);
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
    }
  }
  /* the traced ring outlines, for reference */
  if (st.ringLines && M.ringA) {
    for (const [ring, col] of [[M.ringA, C_GREEN], [M.ringB, C_ORANGE]]) {
      if (!ring) continue;
      ctx.beginPath();
      let started = false;
      for (const p of ring) {
        if (p.ext === null) { started = false; continue; }
        const rr = R * (p.ext * RAD) / st.ringSpan;
        const X = cx + rr * Math.cos(p.phi), Y = cy + rr * Math.sin(p.phi);
        if (!started) { ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
      }
      ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    }
    for (const c of M.cross) {
      const rr = R * (Math.hypot(c[0], c[1]) * RAD) / st.ringSpan;
      const ph = Math.atan2(c[1], c[0]);
      ctx.beginPath();
      ctx.arc(cx + rr * Math.cos(ph), cy + rr * Math.sin(ph), 5, 0, TAU);
      ctx.strokeStyle = C_MAG; ctx.lineWidth = 1.8; ctx.stroke();
    }
  }
  ctx.restore();

  /* the frame, the pump spot, and a degree scale */
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.strokeStyle = '#242a3a'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, TAU);
  ctx.fillStyle = C_CYAN; ctx.fill();
  ctx.font = '10px -apple-system, sans-serif'; ctx.fillStyle = '#6f7789';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const d of ticksFor(0, st.ringSpan, 4)) {
    if (d <= 0 || d > st.ringSpan) continue;
    const rr = R * d / st.ringSpan;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU);
    ctx.strokeStyle = 'rgba(120,132,158,0.16)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillText(sg(d, 3) + '°', cx, cy + rr + 3);
  }

  /* a colour key, down the left, clear of the readout */
  const kx = 16, ky = L.top + 10, kh = Math.min(150, L.plotH - 30);
  if (kh > 40) {
    for (let i = 0; i < kh; i++) {
      const t = i / (kh - 1);
      const lam = (G.lamLo === undefined ? M.Ldeg : G.lamLo)
        + ((G.lamHi === undefined ? M.Ldeg : G.lamHi)
           - (G.lamLo === undefined ? M.Ldeg : G.lamLo)) * (1 - t);
      ctx.fillStyle = trueCol ? trueColourUm(lam, 1)
                              : falseColour(lam, G.lamLo, G.lamHi, 1);
      ctx.fillRect(kx, ky + i, 9, 1.4);
    }
    ctx.strokeStyle = '#2a2f3d'; ctx.lineWidth = 1;
    ctx.strokeRect(kx - 0.5, ky - 0.5, 10, kh + 1);
    ctx.font = '9.5px -apple-system, sans-serif'; ctx.fillStyle = '#6f7789';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(sg((G.lamHi || M.Ldeg) * 1000, 4), kx + 14, ky + 4);
    ctx.fillText(sg((G.lamLo || M.Ldeg) * 1000, 4), kx + 14, ky + kh - 4);
    ctx.save(); ctx.translate(kx - 4, ky + kh / 2); ctx.rotate(-PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(trueCol ? 'nm (true colour)' : 'nm (FALSE colour)', 0, 0);
    ctx.restore();
  }
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 5 -- entanglement
 * ========================================================================== */
function drawBell(ctx, W, H, M, S) {
  const st = M.st;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'Left: the correlation against the angle between the analysers, '
    + 'with the four values Dehlinger &amp; Mitchell measured recomputed from '
    + 'their published counts. Right: S swept over a common rotation. The '
    + 'shaded band is everything a local hidden-variable theory can produce.';
  const foot = 'Bound 2 enumerated over all 16 deterministic local strategies; '
    + '2√2 = ' + sg(M.tsi.S, 10) + ' found by maximising S over the four '
    + 'angles, starting away from the canonical settings. Counts: Dehlinger '
    + '&amp; Mitchell 2002 Table I. Weihs et al. 1998 as published.';
  const L = stage(ctx, W, H, cap, foot, capW);

  const top = L.top + 16;
  const hgt = Math.max(90, L.plotH - 16);
  const [bA, bB] = twoBoxes(W, top, hgt);

  /* ---- A: E against analyser difference ---- */
  const xs = [], yq = [], yv = [];
  for (let i = 0; i <= 361; i++) {
    const d = -180 + 360 * i / 361;
    xs.push(d);
    yq.push(Math.cos(2 * d * DEG));
    yv.push(st.visib * Math.cos(2 * d * DEG));
  }
  axes(ctx, bA, -180, 180, -1.15, 1.15,
       { xlab: 'a − b   (degrees)', ylab: 'correlation E',
         title: 'the correlation', xfmt: t => sg(t, 3), yfmt: t => sg(t, 2) });
  clipTo(ctx, bA, () => {
    polyline(ctx, bA, xs, yq, -180, 180, -1.15, 1.15, rgba(C_CYAN, 0.5), 1.4, [5, 4]);
    polyline(ctx, bA, xs, yv, -180, 180, -1.15, 1.15, C_GREEN, 2);
    if (st.showMeas) {
      for (const a of [-45, 0]) for (const b of [22.5, 67.5]) {
        const E = dmE(a, b), sd = Math.sqrt(dmVarE(a, b));
        let d = a - b; while (d < -180) d += 360; while (d > 180) d -= 360;
        const X = bA.x + bA.w * (d + 180) / 360;
        const Y = bA.y1 - bA.h * (E + 1.15) / 2.3;
        const dy = bA.h * sd / 2.3;
        ctx.strokeStyle = C_ORANGE; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(X, Y - dy); ctx.lineTo(X, Y + dy); ctx.stroke();
        ctx.beginPath(); ctx.arc(X, Y, 4, 0, TAU);
        ctx.fillStyle = C_ORANGE; ctx.fill();
      }
    }
    /* the current setting */
    let dcur = st.anaA - st.anaB;
    while (dcur < -180) dcur += 360; while (dcur > 180) dcur -= 360;
    const Xc = bA.x + bA.w * (dcur + 180) / 360;
    ctx.strokeStyle = rgba(C_MAG, 0.8); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(Xc, bA.y); ctx.lineTo(Xc, bA.y1); ctx.stroke();
  });
  /* legend at the BOTTOM: cos2Δ returns to +1 at both ends, so the top
     corners are exactly where the curves are. */
  legendBox(ctx, bA.x + 8, bA.y + bA.h * 0.5 - 22,
    [[C_CYAN, 'quantum, perfect'],
     [C_GREEN, 'quantum × visibility ' + sg(st.visib, 3)],
     [C_ORANGE, 'Dehlinger & Mitchell 2002, from their counts']]);

  /* ---- B: S swept ---- */
  const sx = [], sy = [], sy1 = [];
  for (let i = 0; i <= 240; i++) {
    const t = 90 * i / 240;
    sx.push(t);
    sy.push(Sqm(0, 45 * DEG, t * DEG, (t + 45) * DEG, st.visib));
    sy1.push(Sqm(0, 45 * DEG, t * DEG, (t + 45) * DEG, 1));
  }
  const ymax = 3.1;
  axes(ctx, bB, 0, 90, -ymax, ymax,
       { xlab: 'b   (degrees, with a = 0, a′ = 45, b′ = b + 45)',
         ylab: 'S', title: 'CHSH', xfmt: t => sg(t, 3), yfmt: t => sg(t, 2) });
  clipTo(ctx, bB, () => {
    const Y = v => bB.y1 - bB.h * (v + ymax) / (2 * ymax);
    ctx.fillStyle = 'rgba(120,132,158,0.10)';
    ctx.fillRect(bB.x, Y(M.lhv), bB.w, Y(-M.lhv) - Y(M.lhv));
    ctx.strokeStyle = rgba(C_DIM, 0.75); ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    for (const v of [M.lhv, -M.lhv]) {
      ctx.beginPath(); ctx.moveTo(bB.x, Y(v)); ctx.lineTo(bB.x1, Y(v)); ctx.stroke();
    }
    ctx.strokeStyle = rgba(C_CYAN, 0.7);
    for (const v of [M.tsi.S, -M.tsi.S]) {
      ctx.beginPath(); ctx.moveTo(bB.x, Y(v)); ctx.lineTo(bB.x1, Y(v)); ctx.stroke();
    }
    ctx.setLineDash([]);
    polyline(ctx, bB, sx, sy1, 0, 90, -ymax, ymax, rgba(C_CYAN, 0.45), 1.4, [5, 4]);
    polyline(ctx, bB, sx, sy, 0, 90, -ymax, ymax, C_GREEN, 2);
    if (st.showMeas) {
      const pts = [[22.5, M.dm.absS, M.dm.sigma, C_ORANGE, 'D&M 2002'],
                   [22.5, WEIHS.S, WEIHS.sig, C_MAG, 'Weihs 1998']];
      let k = 0;
      for (const [xx, vv, ss, cc] of pts) {
        const X = bB.x + bB.w * (xx / 90) + (k ? 13 : -13);
        const Yv = Y(vv), dy = bB.h * ss / (2 * ymax);
        ctx.strokeStyle = cc; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(X, Yv - dy); ctx.lineTo(X, Yv + dy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X - 4, Yv - dy); ctx.lineTo(X + 4, Yv - dy);
        ctx.moveTo(X - 4, Yv + dy); ctx.lineTo(X + 4, Yv + dy); ctx.stroke();
        ctx.beginPath(); ctx.arc(X, Yv, 4, 0, TAU); ctx.fillStyle = cc; ctx.fill();
        k++;
      }
    }
    const Xc = bB.x + bB.w * (clamp(st.anaB, 0, 90) / 90);
    ctx.strokeStyle = rgba(C_MAG, 0.55); ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(Xc, bB.y); ctx.lineTo(Xc, bB.y1); ctx.stroke();
  });
  legendBox(ctx, bB.x + 8, bB.y + 6,
    [[C_MAG, 'Weihs 1998: ' + WEIHS.S + ' ± ' + WEIHS.sig],
     [C_ORANGE, 'D&M 2002: ' + sg(M.dm.absS, 4) + ' ± ' + sg(M.dm.sigma, 2)],
     [C_DIM, 'shaded: reachable by local realism']]);
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 6 -- the Hong-Ou-Mandel dip
 * ========================================================================== */
function drawDip(ctx, W, H, M, S) {
  const st = M.st;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'Two photons arrive at the two inputs of a 50:50 beamsplitter. '
    + 'The amplitude for both to reflect and the amplitude for both to '
    + 'transmit differ by a sign, so when nothing whatever distinguishes them '
    + 'the coincidence rate is not merely small, it is zero.'
    + (M.dipTri
       ? ' With no filter the two-photon amplitude is flat across the crystal’s '
         + 'group delay, and the dip is a triangle — exactly.'
       : ' Both daughters share a polarisation here, so the crystal introduces '
         + 'no relative delay at all and the width is set by the spectrum.');
  const foot = 'Hong, Ou &amp; Mandel 1987 measured a width of about '
    + HOM87.fs + ' fs and stated it was set by their interference filter, not '
    + 'by the crystal — the same distinction this panel draws. Their scale is '
    + 'marked for comparison only; the curve is this crystal.';
  const L = stage(ctx, W, H, cap, foot, capW);

  const top = L.top + 16;
  const hgt = Math.max(90, L.plotH - 16);
  const [bA, bB] = twoBoxes(W, top, hgt);

  const wid = M.dipWidth_fs > 0 ? M.dipWidth_fs : 100;
  const span = Math.max(3 * wid, 60);
  const xs = [], ys = [];
  for (let i = 0; i <= 400; i++) {
    const t = -span + 2 * span * i / 400;
    xs.push(t);
    ys.push(M.dipTri ? homTriangle(t, M.DL_fs) : homGauss(t, wid));
  }
  axes(ctx, bA, -span, span, 0, 0.62,
       { xlab: 'delay τ   (fs)', ylab: 'coincidence probability',
         title: 'the dip', xfmt: t => sg(t, 3), yfmt: t => sg(t, 2) });
  clipTo(ctx, bA, () => {
    ctx.strokeStyle = rgba(C_DIM, 0.7); ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    const Yc = bA.y1 - bA.h * (0.5 - 0) / 0.62;
    ctx.beginPath(); ctx.moveTo(bA.x, Yc); ctx.lineTo(bA.x1, Yc); ctx.stroke();
    ctx.setLineDash([]);
    polyline(ctx, bA, xs, ys, -span, span, 0, 0.62, C_GREEN, 2.1);
    const Xc = bA.x + bA.w * (clamp(st.delayFs, -span, span) + span) / (2 * span);
    ctx.strokeStyle = rgba(C_MAG, 0.85); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(Xc, bA.y); ctx.lineTo(Xc, bA.y1); ctx.stroke();
    const vv = M.dipTri ? homTriangle(st.delayFs, M.DL_fs)
                        : homGauss(st.delayFs, wid);
    const Yv = bA.y1 - bA.h * vv / 0.62;
    ctx.beginPath(); ctx.arc(Xc, Yv, 4.5, 0, TAU); ctx.fillStyle = C_MAG; ctx.fill();
    /* the 1987 scale bar */
    const half = bA.w * (HOM87.fs / 2) / (2 * span);
    const yb = bA.y1 - 16;
    ctx.strokeStyle = rgba(C_ORANGE, 0.8); ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(bA.x + bA.w / 2 - half, yb); ctx.lineTo(bA.x + bA.w / 2 + half, yb);
    ctx.stroke();
  });
  ctx.font = '10.5px -apple-system, sans-serif'; ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = C_DIM;
  ctx.fillText('½ — two independent photons', bA.x + 8, bA.y + 6);
  ctx.fillStyle = C_ORANGE;
  ctx.fillText('bar: HOM 1987, ' + HOM87.fs + ' fs', bA.x + 8, bA.y + 20);
  ctx.fillStyle = C_GREEN;
  ctx.fillText((M.dipTri ? 'triangle, base ±' : 'Gaussian, τ = ')
               + sg(wid, 4) + ' fs', bA.x + 8, bA.y + 34);

  /* ---- B: where the width comes from ---- */
  const lens = [];
  for (let i = 0; i <= 60; i++) lens.push(0.05 + (12 - 0.05) * i / 60);
  const dls = lens.map(mm => 1000 * (mm * 1000) * M.dng / 299.792458);
  const ymax = Math.max(10, Math.max(...dls) * 1.1, M.dipWidth_fs * 1.2);
  axes(ctx, bB, 0, 12, 0, ymax,
       { xlab: 'crystal length   (mm)', ylab: 'group delay DL   (fs)',
         title: 'what sets the width', xfmt: t => sg(t, 3), yfmt: t => sg(t, 3) });
  clipTo(ctx, bB, () => {
    polyline(ctx, bB, lens, dls, 0, 12, 0, ymax, C_GREEN, 2);
    if (M.tauSpec_fs !== null) {
      const Y = bB.y1 - bB.h * clamp(M.tauSpec_fs, 0, ymax) / (ymax || 1);
      ctx.strokeStyle = rgba(C_CYAN, 0.85); ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(bB.x, Y); ctx.lineTo(bB.x1, Y); ctx.stroke();
      ctx.setLineDash([]);
    }
    const X = bB.x + bB.w * clamp(st.lenMm, 0, 12) / 12;
    const Yv = bB.y1 - bB.h * clamp(M.DL_fs, 0, ymax) / (ymax || 1);
    ctx.beginPath(); ctx.arc(X, Yv, 4.5, 0, TAU); ctx.fillStyle = C_ORANGE; ctx.fill();
  });
  legendBox(ctx, bB.x1 - 8, bB.y1 - 8,
    [[C_GREEN, 'birefringent delay, ∝ length'
               + (M.twoPol ? '' : ' (zero here)')],
     [C_CYAN, 'spectral coherence time'
              + (M.tauSpec_fs === null ? ' — n/a' : '')],
     [C_ORANGE, 'this crystal']], { right: true, up: true });
  if (!M.twoPol) {
    /* Width clamped so it cannot reach under the floating readout: the top
       right of the right-hand box is exactly where that panel sits, and a
       sentence hidden there is a defect rather than a nuisance. */
    caption(ctx, bB.x + 10, bB.y + 8,
      'Both daughters have the same polarisation, so they travel at the same '
      + 'group velocity and the crystal introduces no delay whatever. The '
      + 'green line is flat on zero, and the width you see is entirely the '
      + 'dashed one.',
      Math.max(150, Math.min(bB.w - 24, (W - RO.w - 16) - (bB.x + 10))),
      '#767e92');
  }
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  dispatch
 * ========================================================================== */
function drawView(ctx, W, H, M, S) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#070b18'; ctx.fillRect(0, 0, W, H);
  const v = M.st.view;
  if (v === 'crystal') drawCrystal(ctx, W, H, M, S);
  else if (v === 'match') drawMatch(ctx, W, H, M, S);
  else if (v === 'index') drawIndex(ctx, W, H, M, S);
  else if (v === 'rings') drawRings(ctx, W, H, M, S);
  else if (v === 'bell') drawBell(ctx, W, H, M, S);
  else drawDip(ctx, W, H, M, S);
}

/* ------------------------------------------------------------------------ */
function makeScene(canvas) {
  const st = Object.assign({}, DEFAULTS);
  const cam = { W: 900, H: 600 };
  let M = null;
  const S = {
    /* camTheta puts the pump entering from the LEFT (it came in from the
       lower right at 2.15, which reads backwards), and the shorter distance
       stops the whole arrangement sitting in the middle third of the stage. */
    st: st, cam: cam, camTheta: 5.35, camPhi: 0.24, zoom: 1,
    model() { if (!M) S.rebuild(); return M; },
    rebuild() { M = buildModel(st); },
    resetView() { S.camTheta = 5.35; S.camPhi = 0.24; S.zoom = 1; },
    orbit(dx, dy) {
      S.camTheta -= dx * 0.008;
      S.camPhi = clamp(S.camPhi + dy * 0.008, -1.45, 1.45);
    },
    readout() { return readoutHTML(S.model()); },
    eqbar() { return eqbarText(S.model()); },
    tag() { return tagText(S.model()); },
    draw() { drawView(canvas.getContext('2d'), cam.W, cam.H, S.model(), S); },
  };
  return S;
}

/* ============================================================================
 *  the control panel and the frame loop
 * ========================================================================== */
const INFO = {
  crystal:
    'A photon goes into a crystal whose polarisation responds slightly '
    + 'non-linearly to the field it is in, and about once in ten billion times '
    + 'it comes out as two. Nothing drives the split and nothing selects the '
    + 'outcome: it is spontaneous, and the vacuum supplies the seed. Only two '
    + 'things constrain the result. The energies must add up, which costs '
    + 'nothing because a continuum of pairs satisfies it. The <b>momenta</b> '
    + 'must add up too, and since the crystal is dispersive that is a real '
    + 'restriction — it is satisfied only along particular directions, and '
    + 'those directions are the cones you see. Turn the crystal and they open '
    + 'or close.',
  match:
    'Write the leftover momentum as Δk. If the crystal were infinitely long '
    + 'only Δk = 0 would survive; a crystal of length L instead accepts '
    + 'anything within about 2π/L of it, weighted by sinc²(ΔkL/2). Everything '
    + 'follows from that single factor. A long crystal is bright but fussy — '
    + 'a narrow band of colour into a narrow band of angle. A short one is '
    + 'dim and generous. There is no setting that is good at both, which is '
    + 'why real sources choose a length for the experiment they are doing.',
  index:
    'A birefringent crystal has two refractive indices, and for one of the two '
    + 'polarisations the index depends on the <b>direction of travel</b>: it '
    + 'sweeps from n_o to n_e as the ray turns from the optic axis to '
    + 'perpendicular. That is a continuously adjustable index, and it is the '
    + 'entire trick. Dispersion alone always makes the pump too fast to keep '
    + 'up with its daughters; putting the pump on the extraordinary axis and '
    + 'cutting the crystal at the right angle slows it by exactly the right '
    + 'amount. A poled crystal solves the same problem a different way, by '
    + 'flipping the sign of the nonlinearity before the mismatch can undo the '
    + 'work already done.',
  rings:
    'This is the picture a camera makes. Each direction is shaded by how well '
    + 'phase matching is satisfied there, summed over colour, so the bright '
    + 'curves are not drawn at a computed radius — they are where the '
    + 'weighting happens to be large. Type I gives nested rings, blue inside '
    + 'red, with a <b>waist</b>: the smallest ring is not the degenerate one. '
