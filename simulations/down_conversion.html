  bell:
    'At the two crossings a photon could have come from either cone, so its '
    + 'polarisation is not merely unknown, it is undetermined — and the pair '
    + 'is entangled. Measuring both photons through analysers at a and b gives '
    + 'a correlation E(a,b). Bell’s point is that <b>no</b> theory in which '
    + 'each photon carries its answer with it can make the combination S '
    + 'exceed 2, whatever the analyser angles. Quantum mechanics reaches 2√2, '
    + 'and experiments reach most of the way there. The two plotted results '
    + 'are real: one from an undergraduate bench, one with the analysers set '
    + 'randomly and far enough apart that no signal could have connected them.',
  dip:
    'Send the two photons into the two faces of a beamsplitter and look for '
    + 'them leaving by different exits. Two paths lead to that outcome — both '
    + 'reflected, or both transmitted — and they differ by a sign, so if '
    + 'nothing distinguishes the photons the two amplitudes cancel and the '
    + 'coincidence rate goes to zero rather than to a half. Delay one photon '
    + 'and the cancellation fails: the dip’s width is the time over which the '
    + 'two are genuinely interchangeable, which is either the crystal’s '
    + 'birefringent delay or the coherence time the filters leave, whichever '
    + 'is longer.',
};

function boot() {
  const canvas = document.getElementById('scene');
  const panel  = document.getElementById('panel');
  const tabsEl = document.getElementById('tabs');
  const roEl   = document.getElementById('readout');
  const eqEl   = document.getElementById('eqbar');
  const tagEl  = document.getElementById('tag');
  const hintEl = document.getElementById('hint');
  const errEl  = document.getElementById('errbox');
  const S = makeScene(canvas), st = S.st;

  function fail(e) { errEl.style.display = 'block';
                     errEl.textContent = String(e && e.stack || e); }
  window.addEventListener('error', ev => fail(ev.error || ev.message));

  VIEWS.forEach(([k, lab]) => {
    tabsEl.appendChild(h('button', { class: st.view === k ? 'active' : '',
      onclick: () => {
        st.view = k;
        [].forEach.call(tabsEl.children,
          (b, i) => b.className = VIEWS[i][0] === k ? 'active' : '');
        S.rebuild(); syncPanel(); refresh();
      } }, lab));
  });

  const rows = {};
  function slider(key, lab, lo, hi, step, fmtf) {
    const inp = h('input', { type: 'range', min: lo, max: hi, step: step,
                             value: st[key] });
    const val = h('span', { class: 'val' });
    const rowEl = h('div', { class: 'sliderrow' }, h('label', null, lab),
                    inp, val);
    const sync = () => { inp.value = st[key]; val.textContent = fmtf(st[key]); };
    inp.addEventListener('input', () => {
      st[key] = parseFloat(inp.value); val.textContent = fmtf(st[key]);
      S.rebuild(); syncPanel(); refresh();
    });
    rows[key] = { row: rowEl, sync: sync, inp: inp }; sync(); return rowEl;
  }
  function checkbox(key, lab) {
    const inp = h('input', { type: 'checkbox' }); inp.checked = st[key];
    inp.addEventListener('change', () => {
      st[key] = inp.checked; S.rebuild(); syncPanel(); refresh();
    });
    return h('label', null, inp, lab);
  }
  function chipRow(list, key, idf, namef, after) {
    const wrapEl = h('div', { class: 'chips' });
    list.forEach(o => {
      wrapEl.appendChild(h('button',
        { class: 'chip' + (st[key] === idf(o) ? ' on' : ''),
          onclick: () => {
            st[key] = idf(o);
            if (after) after(o);
            [].forEach.call(wrapEl.children, (b, i) =>
              b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));
            S.rebuild(); syncPanel(); refresh();
          } }, namef(o)));
    });
    wrapEl._sync = () => [].forEach.call(wrapEl.children, (b, i) =>
      b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));
    return wrapEl;
  }
  const chipRows = [];
  /* The stylesheet defines .grp and .grp h3 (and #info by id).  Two of the
     most recent sims build these with class names the stylesheet does not
     have -- 'group', 'gtitle', 'info' -- so their panel headings render
     unstyled.  Use the names the CSS actually carries. */
  function group(title) {
    const kids = [].slice.call(arguments, 1);
    const g = h('div', { class: 'grp' }, h('h3', null, title));
    for (const k of kids) if (k) g.appendChild(k);
    panel.appendChild(g); return g;
  }

  const presetChips = chipRow(PRESETS, '_preset', o => o.id, o => o.name,
    o => { Object.assign(st, o.st); });
  chipRows.push(presetChips);
  const crystalChips = chipRow(
    Object.keys(CRYSTALS).map(k => ({ k: k, n: CRYSTALS[k].name })),
    'crystal', o => o.k, o => o.n);
  chipRows.push(crystalChips);
  const colourChips = chipRow(
    [{ k: 'false', n: 'false colour' }, { k: 'true', n: 'true colour' }],
    'colourMode', o => o.k, o => o.n);
  chipRows.push(colourChips);

  group('a real source', presetChips);
  group('the crystal', crystalChips,
    slider('pumpNm', 'pump', 320, 560, 0.1, v => sg(v, 4) + ' nm'),
    slider('lenMm', 'length', 0.05, 12, 0.05, v => sg(v, 3) + ' mm'),
    slider('cutOff', 'cut past collinear', -0.4, 3.0, 0.005,
           v => sg(v, 3) + '°'),
    slider('periodPct', 'poling detune', -2, 2, 0.01, v => sg(v, 3) + ' %'),
    slider('sigFrac', 'signal colour', 0.56, 1.78, 0.005,
           v => sg(v, 4) + ' × λ_deg'));
  group('the crystal view',
    checkbox('showAxis', ' optic axis'), checkbox('showWalk', ' walk-off'),
    checkbox('showCones', ' the cones'));
  group('the rings', colourChips,
    slider('ringSpan', 'window', 0.6, 12, 0.1, v => sg(v, 3) + '°'),
    checkbox('ringLines', ' trace the phase-matched curves'));
  group('entanglement',
    slider('anaA', 'analyser a', -90, 90, 0.5, v => sg(v, 3) + '°'),
    slider('anaB', 'analyser b', 0, 90, 0.5, v => sg(v, 3) + '°'),
    slider('visib', 'visibility', 0.3, 1, 0.005, v => sg(v, 3)),
    checkbox('showMeas', ' the measured results'));
  group('the dip',
    slider('delayFs', 'delay τ', -600, 600, 1, v => sg(v, 4) + ' fs'),
    slider('filterNm', 'filter width', 0, 60, 0.5,
           v => v > 0 ? sg(v, 3) + ' nm' : 'none'));

  const infoEl = h('div', { id: 'info' });
  panel.appendChild(infoEl);
  panel.appendChild(h('button', { class: 'chip', style: 'margin-top:10px',
    onclick: () => { Object.assign(st, DEFAULTS); S.resetView(); S.rebuild();
                     syncPanel(); refresh(); } }, 'reset all'));

  function syncPanel() {
    for (const k in rows) rows[k].sync();
    for (const c of chipRows) if (c._sync) c._sync();
    const C = CRYSTALS[st.crystal];
    rows.cutOff.row.hidden = C.poled;
    rows.periodPct.row.hidden = !C.poled;
    infoEl.innerHTML = INFO[st.view] || '';
  }

  /* ---- the frame loop.  Nothing here animates on its own, so EVERY
     interaction must mark the canvas dirty or the camera moves and the
     picture does not follow -- which shipped broken twice in this
     collection and is on the Known-bad list. ---- */
  let dirty = true;
  function refresh() { dirty = true; }
  function frame() {
    if (dirty) {
      dirty = false;
      try {
        S.draw();
        roEl.innerHTML = S.readout();
        eqEl.innerHTML = S.eqbar();
        tagEl.innerHTML = S.tag();
      } catch (e) { fail(e); }
    }
    requestAnimationFrame(frame);
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    S.cam.W = Math.max(320, Math.round(r.width));
    S.cam.H = Math.max(240, Math.round(r.height));
    canvas.width = Math.round(S.cam.W * dpr);
    canvas.height = Math.round(S.cam.H * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    refresh();
  }
  window.addEventListener('resize', resize);

  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY };
    canvas.classList.add('dragging');
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    S.orbit(e.clientX - drag.x, e.clientY - drag.y);
    drag = { x: e.clientX, y: e.clientY };
    refresh();
  });
  canvas.addEventListener('pointerup', () => {
    drag = null; canvas.classList.remove('dragging');
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    S.zoom = clamp(S.zoom * (e.deltaY > 0 ? 0.92 : 1.087), 0.35, 4);
    refresh();
  }, { passive: false });
  window.addEventListener('keydown', e => {
    const i = VIEWS.findIndex(v => v[0] === st.view);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const j = (i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1))
                % VIEWS.length;
      st.view = VIEWS[j][0];
      [].forEach.call(tabsEl.children,
        (b, k) => b.className = VIEWS[k][0] === st.view ? 'active' : '');
      S.rebuild(); syncPanel(); refresh();
    } else if (e.key === 'r' || e.key === 'R') { S.resetView(); refresh(); }
  });

  hintEl.textContent = 'drag to orbit · scroll to zoom · ←/→ views · R resets';
  syncPanel(); resize(); S.rebuild(); refresh(); frame();
}

/* ============================================================================
 *  selfTest -- runs when there is no document
 *
 *  Reference values tagged (scipy) were printed by build_spdc/derive.py and
 *  derive2.py and copied from output read IN FULL.  A value that cannot be
 *  pointed at in that output is a guess wearing a citation, which is on this
 *  project's Known-bad list.
 * ========================================================================== */
function selfTest() {
  let pass = 0, fail = 0;
  const bad = [];
  function ok(c, n) { if (c) pass++; else { fail++; bad.push(n); } }
  function close(a, b, tol, n) {
    const good = isFinite(a) && isFinite(b) && Math.abs(a - b) <= tol;
    if (good) pass++;
    else { fail++; bad.push(n + '  (got ' + a + ', want ' + b + ')'); }
  }
  function rel(a, b, r, n) {
    const good = isFinite(a) && isFinite(b)
                 && Math.abs(a - b) <= r * Math.max(1e-300, Math.abs(b));
    if (good) pass++;
    else { fail++; bad.push(n + '  (got ' + a + ', want ' + b + ')'); }
  }

  /* ---------------- 1. Sellmeier ---------------- */
  /* The generic evaluator against the closed form the coefficients are
     usually printed as.  A coefficient list retyped into a formula is the
     same failure mode as quoting a table from memory. */
  const noClosed = L => Math.sqrt(2.7405 + 0.0184 / (L * L - 0.0179) - 0.0155 * L * L);
  const neClosed = L => Math.sqrt(2.3730 + 0.0128 / (L * L - 0.0156) - 0.0044 * L * L);
  for (const L of [0.3511, 0.405, 0.5321, 0.7022, 0.810, 1.0]) {
    close(nOf('bbo_eimerl_o', L), noClosed(L), 1e-15, 'formula4 == closed n_o @' + L);
    close(nOf('bbo_eimerl_e', L), neClosed(L), 1e-15, 'formula4 == closed n_e @' + L);
  }
  /* absolute values (scipy, derive.py section 1) */
  close(nOf('bbo_eimerl_o', 0.3511), 1.706812833592, 1e-11, 'n_o(351.1nm) (scipy)');
  close(nOf('bbo_eimerl_e', 0.3511), 1.578397300764, 1e-11, 'n_e(351.1nm) (scipy)');
  close(nOf('bbo_eimerl_o', 0.405), 1.692299383056, 1e-11, 'n_o(405nm) (scipy)');
  close(nOf('bbo_eimerl_e', 0.405), 1.567965921557, 1e-11, 'n_e(405nm) (scipy)');
  close(nOf('bbo_eimerl_o', 0.7022), 1.664805982394, 1e-11, 'n_o(702.2nm) (scipy)');
  close(nOf('bbo_eimerl_o', 0.810), 1.661072405837, 1e-11, 'n_o(810nm) (scipy)');
  close(nOf('bbo_eimerl_e', 0.810), 1.545994032070, 1e-11, 'n_e(810nm) (scipy)');
  close(nOf('ktp_kato_x', 0.405), 1.823525257254, 1e-11, 'KTP n_x(405) (scipy)');
  close(nOf('ktp_kato_y', 0.405), 1.839927285984, 1e-11, 'KTP n_y(405) (scipy)');
  close(nOf('ktp_kato_z', 0.405), 1.959165615264, 1e-11, 'KTP n_z(405) (scipy)');
  close(nOf('ktp_kato_z', 0.810), 1.843832153904, 1e-11, 'KTP n_z(810) (scipy)');
  /* the second fit is genuinely a second opinion, not a copy: assert it AGREES
     to 1e-3 and, separately, that it DISAGREES by more than 1e-4 -- otherwise
     "the fits agree" would be a tautology about one dataset written twice. */
  let maxD = 0, minD = 1;
  for (const L of [0.405, 0.7022, 0.810, 1.0]) {
    const d = Math.abs(nOf('bbo_eimerl_o', L) - nOf('bbo_tamos_o', L));
    maxD = Math.max(maxD, d); minD = Math.min(minD, d);
  }
  ok(maxD < 2e-3, 'the two BBO fits agree to 2e-3');
  ok(minD > 1e-4, 'the two BBO fits are NOT the same numbers');
  close(nOf('bbo_eimerl_o', 0.810) - nOf('bbo_tamos_o', 0.810), 9.68e-4, 2e-6,
        'Eimerl-Tamosauskas n_o at 810 nm (scipy)');
  ok(inRange('bbo_eimerl_o', 0.5), 'inRange inside');
  ok(!inRange('bbo_eimerl_o', 1.5), 'inRange outside');
  ok(!inRange('ktp_kato_z', 0.405), 'KTP fit does NOT cover a 405 nm pump');
  ok(inRange('ktp_kato_z', 0.450), 'KTP fit does cover 450 nm');

  /* analytic dn/dL against a central difference -- implemented twice */
  for (const [k, L] of [['bbo_eimerl_o', 0.6], ['bbo_eimerl_e', 0.9],
                        ['bbo_tamos_o', 0.5], ['ktp_kato_z', 1.0]]) {
    const hh = 1e-6;
    const fd = (nOf(k, L + hh) - nOf(k, L - hh)) / (2 * hh);
    rel(dnOf(k, L), fd, 1e-7, 'analytic dn/dL == finite difference ' + k);
  }
  close(ngOf('bbo_eimerl_o', 0.7022), 1.69353198499, 1e-8, 'n_g(o,702.2) (scipy)');
  close(ngOf('bbo_eimerl_o', 0.810), 1.68503841789, 1e-8, 'n_g(o,810) (scipy)');
  close(ngOf('bbo_eimerl_e', 0.810), 1.5611027362, 1e-8, 'n_g(e,810) (scipy)');
  ok(ngOf('bbo_eimerl_o', 0.6) > nOf('bbo_eimerl_o', 0.6),
     'normal dispersion: n_g > n');

  /* ---------------- 2. the index ellipsoid ---------------- */
  close(nExt(1.7, 1.5, 0), 1.7, 1e-15, 'nExt(0) = n_o exactly');
  close(nExt(1.7, 1.5, PI / 2), 1.5, 1e-15, 'nExt(90 deg) = n_e exactly');
  close(nExt(1.6923, 1.5680, 30 * DEG), 1.6584741407, 1e-9, 'nExt at 30 deg (scipy)');
  /* thetaForIndex must invert nExt */
  for (const d of [5, 20, 35, 55, 80]) {
    const n = nExt(1.6923, 1.5680, d * DEG);
    close(thetaForIndex(1.6923, 1.5680, n) * RAD, d, 1e-9,
          'thetaForIndex inverts nExt at ' + d + ' deg');
  }
  ok(thetaForIndex(1.6923, 1.5680, 1.8) === null, 'thetaForIndex rejects n > n_o');
  close(walkOff(1.69, 1.57, 0), 0, 1e-15, 'walk-off zero on the optic axis');
  close(walkOff(1.69, 1.57, PI / 2), 0, 1e-12, 'walk-off zero perpendicular');
  {
    const noP = nOf('bbo_eimerl_o', 0.405), neP = nOf('bbo_eimerl_e', 0.405);
    close(walkOff(noP, neP, 28.66 * DEG) * RAD, 3.82476577332, 1e-8,
          'BBO walk-off at 28.66 deg (scipy)');
    const thMax = Math.atan(neP / noP);
    close(walkOff(noP, neP, thMax) * RAD, 4.36794643408, 1e-8,
          'max walk-off value (scipy)');
    close(thMax * RAD, 42.8160, 1e-3, 'max walk-off is at atan(n_e/n_o) (scipy)');
    let best = -1, bestT = 0;
    for (let i = 1; i < 20000; i++) {
      const t = (PI / 2) * i / 20000, v = walkOff(noP, neP, t);
      if (v > best) { best = v; bestT = t; }
    }
    close(bestT, thMax, 2e-4, 'the maximum is FOUND, not assumed');
  }

  /* ---------------- 3. phase matching ---------------- */
  const B1 = CRYSTALS.bbo1, B2 = CRYSTALS.bbo2;
  const B1alt = { o: 'bbo_tamos_o', e: 'bbo_tamos_e', kind: 'I', poled: false };
  const B2alt = { o: 'bbo_tamos_o', e: 'bbo_tamos_e', kind: 'II', poled: false };
  close(cutAngleTypeI(B1, 0.405, 0.810, 0.810) * RAD, 28.6704038348, 1e-8,
        'type-I cut, Eimerl (scipy)');
  close(cutAngleTypeI(B1alt, 0.405, 0.810, 0.810) * RAD, 28.8505541069, 1e-8,
        'type-I cut, Tamosauskas (scipy)');
  close(Math.abs(cutAngleTypeI(B1, 0.405, 0.810, 0.810)
                 - cutAngleTypeI(B1alt, 0.405, 0.810, 0.810)) * RAD,
        0.18015027207, 1e-8, 'spread between the two fits (scipy)');
  close(cutAngleTypeII(B2, 0.3511, 0.7022, 0.7022) * RAD, 48.9044539811, 1e-7,
        'type-II cut at 351.1 nm, Eimerl (scipy)');
  close(cutAngleTypeII(B2alt, 0.3511, 0.7022, 0.7022) * RAD, 49.0998681064, 1e-7,
        'type-II cut at 351.1 nm, Tamosauskas (scipy)');
  close(cutAngleTypeII(B2, 0.405, 0.810, 0.810) * RAD, 41.4211327266, 1e-7,
        'type-II cut at 405 nm (scipy)');
  {
    /* the defining round trip */
    const th = cutAngleTypeI(B1, 0.405, 0.810, 0.810);
    close(nExt(nOf('bbo_eimerl_o', 0.405), nOf('bbo_eimerl_e', 0.405), th),
          nOf('bbo_eimerl_o', 0.810), 1e-14,
          'at the cut, the pump index EQUALS the daughters\' index');
  }
  {
    /* momentum conservation on the closed-form cone */
    const th = 29.0 * DEG;
    const c = coneTypeI(B1, 0.405, th, 0.78);
    ok(c !== null, 'type-I cone exists at 29 deg, 780 nm');
    close(c.Oms * RAD, 1.57346216498, 1e-8, 'internal signal angle (scipy)');
    close(c.Omi * RAD, 1.70126389639, 1e-8, 'internal idler angle (scipy)');
    close(c.Li * 1000, 842.4, 1e-9, 'idler for a 780 nm signal (scipy)');
    const kp = nExt(nOf('bbo_eimerl_o', 0.405), nOf('bbo_eimerl_e', 0.405), th) / 0.405;
    close(c.ks * Math.sin(c.Oms) - c.ki * Math.sin(c.Omi), 0, 1e-14,
          'transverse momentum cancels');
    close(kp - c.ks * Math.cos(c.Oms) - c.ki * Math.cos(c.Omi), 0, 1e-14,
          'longitudinal momentum balances');
  }
  {
    /* the dk field vanishes on the closed-form cone, and -- the claim the
       whole rings view rests on -- is independent of azimuth for type I. */
    const th = 29.2 * DEG;
    let worst = 0, worstAz = 0;
    for (const nm of [700, 750, 780, 810, 840, 900, 1000]) {
      const c = coneTypeI(B1, 0.405, th, nm / 1000);
      if (!c) continue;
      const v = dkField(B1, 0.405, th, nm / 1000, c.Oms, 0, 'o', 0);
      worst = Math.max(worst, Math.abs(v));
      for (const phi of [0.3, 1.9, 4.4]) {
        const v2 = dkField(B1, 0.405, th, nm / 1000, c.Oms, phi, 'o', 0);
        worstAz = Math.max(worstAz, Math.abs(v2 - v));
      }
    }
    close(worst, 0, 1e-12, 'dk vanishes on the closed-form type-I cone');
    close(worstAz, 0, 1e-15, 'type-I dk is azimuth-independent: the cone is a CIRCLE');
    /* type II is not */
    const th2 = cutAngleTypeII(B2, 0.3511, 0.7022, 0.7022) + 0.73 * DEG;
    const a0 = dkField(B2, 0.3511, th2, 0.7022, 0.02, 0, 'o', 0);
    const a1 = dkField(B2, 0.3511, th2, 0.7022, 0.02, PI, 'o', 0);
    ok(Math.abs(a1 - a0) > 1e-4, 'type-II dk DOES depend on azimuth');
  }
  {
    /* the external ring angle, and the cuts that produce chosen rings */
    const th = 29.2 * DEG;
    const c = coneTypeI(B1, 0.405, th, 0.810);
    close(toExternal(c.Oms, nOf('bbo_eimerl_o', 0.810)) * RAD, 3.35579550928,
          1e-8, 'external ring for the folk 29.2 deg cut (scipy)');
    const ringAt = cd => {
      const cc = coneTypeI(B1, 0.405, cd * DEG, 0.810);
      return cc === null ? -1 : toExternal(cc.Oms, nOf('bbo_eimerl_o', 0.810)) * RAD;
    };
    const solveCut = want => {
      let lo = 28.7, hi = 31;
      for (let i = 0; i < 90; i++) {
        const m = 0.5 * (lo + hi);
        if (ringAt(m) < want) lo = m; else hi = m;
      }
      return 0.5 * (lo + hi);
    };
    close(solveCut(3.0), 29.0941351295, 1e-7, 'cut for a 3.00 deg ring (scipy)');
    close(solveCut(2.5), 28.965072511, 1e-7, 'cut for a 2.50 deg ring (scipy)');
    ok(ringAt(28.5) < 0, 'below the collinear cut there is no ring at all');
    /* the WAIST: the smallest ring is not the degenerate one */
    const ringOf = lam => {
      const cc = coneTypeI(B1, 0.405, th, lam);
      return cc === null ? -1 : toExternal(cc.Oms, nOf(B1.o, lam)) * RAD;
    };
    let bestNm = 0, bestR = 1e9;
    for (let nm = 700; nm <= 900; nm += 0.02) {
      const r = ringOf(nm / 1000);
      if (r > 0 && r < bestR) { bestR = r; bestNm = nm; }
    }
    close(bestNm, 775.751799064, 0.05, 'the ring waist is at 775.75 nm (scipy)');
    close(bestR, 3.28416878938, 1e-4, 'the waist radius (scipy)');
    ok(bestR < 3.35579550928, 'the waist really is inside the degenerate ring');
  }

  /* ---------------- 4. sinc and bandwidth ---------------- */
  close(sinc(0), 1, 0, 'sinc(0) = 1 exactly');
  close(sinc(PI), 0, 1e-15, 'sinc(pi) = 0');
  close(sinc(1e-8), 1 - 1e-16 / 6, 1e-15, 'sinc near zero');
  close(sinc2(0), 1, 0, 'sinc2(0) = 1');
  {
    let lo = 1.0, hi = 2.0;
    for (let i = 0; i < 200; i++) {
      const m = 0.5 * (lo + hi);
      if (sinc2(m) > 0.5) lo = m; else hi = m;
    }
    close(0.5 * (lo + hi), SINC2_HALF, 1e-10,
          'SINC2_HALF re-found by bisection, not trusted');
  }
  close(sinc2(SINC2_HALF), 0.5, 1e-10, 'sinc2 really is one half there');

  /* ---------------- 5. quasi-phase matching ---------------- */
  const P0 = CRYSTALS.ppktp0, P2 = CRYSTALS.ppktp2;
  close(qpmPeriod(P0, 0.405, 0.810, 0.810), 3.51155679561, 1e-8,
        'PPKTP type-0 poling period (scipy)');
  close(qpmPeriod(P2, 0.405, 0.810, 0.810), 10.1130526683, 1e-7,
        'PPKTP type-II poling period (scipy)');
  close(QPM_DEFF, 0.636619772368, 1e-11, '2/pi (scipy)');
  {
    /* derive the 2/pi rather than trust it: <sign(cos x) cos x> over a period */
    let s = 0; const N = 400000;
    for (let i = 0; i < N; i++) {
      const x = TAU * (i + 0.5) / N;
      s += Math.sign(Math.cos(x)) * Math.cos(x);
    }
    close(s / N, 2 / PI, 1e-6, '<sign(cos) cos> = 2/pi, integrated');
  }
  {
    const L0 = qpmPeriod(P0, 0.405, 0.810, 0.810);
    close(dkField(P0, 0.405, 0, 0.810, 0, 0, 'o', L0), 0, 1e-13,
          'at the ideal period the collinear mismatch is zero');
    ok(dkField(P0, 0.405, 0, 0.810, 0, 0, 'o', L0 * 0.995) < 0,
       'a SHORTER period overshoots, which is what opens a cone');
  }

  /* ---------------- 6. group delay and the dip ---------------- */
  {
    const th = cutAngleTypeII(B2, 0.3511, 0.7022, 0.7022);
    close(ngOf('bbo_eimerl_o', 0.7022), 1.69353198499, 1e-8, 'n_g(o) (scipy)');
    const f = LL => nExt(nOf('bbo_eimerl_o', LL), nOf('bbo_eimerl_e', LL), th);
    const hh = 1e-6;
    const nge = f(0.7022) - 0.7022 * (f(0.7022 + hh) - f(0.7022 - hh)) / (2 * hh);
    close(nge, 1.61854668269, 1e-7, 'n_g of the e-ray at the cut (scipy)');
    close(1000 * 1000 * (1.69353198499 - nge) / 299.792458, 250.124045137, 1e-3,
          'group delay 250.1 fs per mm (scipy)');
  }
  /* the unfiltered dip is a TRIANGLE, exactly */
  for (const x of [0, 0.25, 0.5, 0.75, 1.0, 1.5, 3.0]) {
    close(homTriangle(x, 1), 0.5 * (1 - Math.max(0, 1 - x)), 1e-15,
          'HOM dip is the triangle at tau/DL = ' + x);
  }
  close(homTriangle(0, 1), 0, 0, 'the dip bottoms at exactly zero');
  close(homTriangle(5, 1), 0.5, 0, 'far from zero delay the rate is one half');
  close(homGauss(0, 100), 0, 0, 'Gaussian dip also bottoms at zero');
  /* At tau = sigma the Gaussian and a plain exponential agree exactly (both
     are e^-1), so a check there pins nothing.  Half a sigma separates them. */
  close(homGauss(50, 100), 0.110599608464298, 1e-14,
        'the Gaussian dip is Gaussian, not exponential (scipy)');
  close(homGauss(100, 100), 0.316060279414279, 1e-14,
        'Gaussian dip at one sigma (scipy)');
  close(TBP_GAUSS, 0.441271200305, 1e-11, 'Gaussian time-bandwidth 2ln2/pi (scipy)');

  /* ---------------- 7. CHSH ---------------- */
  close(lhvMax(), 2, 0, 'the classical bound is 2, ENUMERATED over 16 strategies');
  close(Sqm(0, 45 * DEG, 22.5 * DEG, 67.5 * DEG), 2 * Math.SQRT2, 1e-14,
        'S at the canonical angles = 2 sqrt 2');
  close(tsirelson().S, 2 * Math.SQRT2, 1e-9,
        'the quantum maximum is FOUND by search (scipy: 2.82842712475)');
  ok(tsirelson().S <= 2 * Math.SQRT2 + 1e-12, 'nothing exceeds Tsirelson');
  close(Eqm(0, 22.5 * DEG), Math.cos(-45 * DEG), 1e-15, 'E is cos 2(a-b)');
  {
    /* Dehlinger & Mitchell, recomputed from their published counts */
    const w = dmBest();
    close(w.absS, 2.30731557853, 1e-9, '|S| from Table I (scipy)');
    close(w.absS, 2.307, 5e-4, '|S| reproduces the PUBLISHED 2.307');
    /* The reference here is the ANALYTIC propagation recomputed in Python, not
       the first numerical one: derive.py differenced S numerically and its
       0.0347945006438 carried 7e-9 of finite-difference error.  Asserting
       against that would have been pinning the reference script's step size. */
    close(w.sigma, 0.0347944933587177, 1e-12, 'sigma_S from Table I (scipy)');
    close(w.sigma, 0.035, 1e-3, 'sigma_S reproduces the PUBLISHED 0.035');
    close(w.sigmas, 8.8323050249313, 1e-9, 'violation in sigmas (scipy)');
    ok(w.sigmas > 8, 'the paper says "more than eight standard deviations"');
    close(w.vis, 0.815759245959, 1e-9, 'implied visibility (scipy)');
    close(dmE(-45, 22.5), -0.587422582, 1e-9, 'E(-45, 22.5) (scipy)');
    close(dmE(-45, 67.5), -0.496610935, 1e-9, 'E(-45, 67.5) (scipy)');
    close(dmE(0, 22.5), 0.534675615, 1e-9, 'E(0, 22.5) (scipy)');
    close(dmE(0, 67.5), -0.688606446, 1e-9, 'E(0, 67.5) (scipy)');
    ok(w.absS > 2, 'the measurement violates the inequality');
    /* every one of the sixteen counts is used exactly once */
    const used = {};
    for (const [a, b] of [[-45, 22.5], [-45, 67.5], [0, 22.5], [0, 67.5]])
      for (const [x, y] of [[a, b], [a + 90, b + 90], [a, b + 90], [a + 90, b]]) {
        const k = (((x % 180) + 180) % 180) + '|' + (((y % 180) + 180) % 180);
        used[k] = (used[k] || 0) + 1;
      }
    ok(Object.keys(used).length === 16, 'all sixteen counts are used');
    ok(Object.keys(used).every(k => used[k] === 1),
       'each count is used exactly once, so the four E are independent');
    /* the analytic error propagation against a central difference */
    const base = dmCount(0, 22.5);
    /* E is a ratio, so the central difference carries (h/T)^2; with T = 2235 a
       step of 20 is 8e-5 of error and would have made this look like a
       disagreement rather than a step size. */
    const hh = 1;
    DM_N['0|22.5'] = base + hh; const Sp = dmE(0, 22.5);
    DM_N['0|22.5'] = base - hh; const Sm = dmE(0, 22.5);
    DM_N['0|22.5'] = base;
    const num = (Sp - Sm) / (2 * hh);
    const T = dmCount(0, 22.5) + dmCount(90, 112.5) + dmCount(0, 112.5)
            + dmCount(90, 22.5);
    close((1 - dmE(0, 22.5)) / T, 0.000208198829882538, 1e-15,
          'analytic dE/dn (scipy)');
    rel(num, (1 - dmE(0, 22.5)) / T, 1e-5,
        'analytic dE/dn == finite difference');
  }
  close(0.97 * 2 * Math.SQRT2, 2.743574311, 1e-8,
        'Weihs: 97% visibility caps S at 2.7436 (scipy)');
  ok(WEIHS.S < 0.97 * 2 * Math.SQRT2,
     'their measured 2.73 is below the ceiling their visibility implies');

  {
    /* ticksFor must land an EXACT zero on a range that spans it: accumulating
       by += leaves dust, and sg() prints the dust in full. */
    const t = ticksFor(-0.031, 0.006, 6);
    ok(t.some(v => v === 0), 'a range spanning zero gets an exact zero tick');
    ok(!t.some(v => v !== 0 && Math.abs(v) < 1e-12),
       'and no float-dust tick pretending to be a value');
    /* the inverted-range guard from standard_candle.html still holds */
    ok(ticksFor(1, 10, 5).length > 2, 'an ordinary range gets several ticks');
    ok(ticksFor(10, 1, 5).length === 1,
       'an unsorted range still collapses to one -- axes() sorts before asking');
  }

  /* ---------------- 8. colour, and the micrometre/nanometre trap ---------- */
  {
    const p = s => { const m = String(s).match(/(\d+),(\d+),(\d+)/);
                     return [+m[1], +m[2], +m[3]]; };
    const violet = p(spectralCss(nmOf(0.405), 1));
    ok(violet[2] > violet[1] && violet[2] > 40, '405 nm renders blue-dominant');
    const red = p(spectralCss(nmOf(0.66), 1));
    ok(red[0] > red[1] && red[0] > red[2] && red[0] > 100, '660 nm renders red');
    /* The bug this guards: normalising to peak brightness turned a 1.6e-8
       stimulus at 810 nm into rgb(0,255,167) -- a bright green -- and every
       ring in this file is at such a wavelength.  Assert BRIGHTNESS, not that
       the string is well formed; rgb(0,255,167) is perfectly well formed. */
    for (const nm of [750, 810, 900, 1000]) {
      const q = p(spectralCss(nm, 1));
      ok(q[0] + q[1] + q[2] === 0,
         nm + ' nm has no colour at all, not a saturated one');
    }
    const dim700 = p(trueColourUm(0.70, 1));
    ok(dim700[0] > dim700[1] && dim700[0] > dim700[2],
       '700 nm is red, not orange or green');
    ok(dim700[0] < 120, '700 nm is DIM: the eye barely responds there');
    ok(p(trueColourUm(0.81, 1)).every(c => c === 0),
       'true colour at 810 nm is black — that light cannot be seen');
    {
      const v = p(trueColourUm(0.405, 1));
      ok(v[0] + v[1] + v[2] > 0 && v[2] >= v[1],
         '405 nm is visible but dim, and still blue-dominant');
    }
    close(LUM_PEAK, 1.0, 0.02, 'the luminosity function peaks at about 1');
    /* the trap itself: micrometres handed to the nanometre helper.  If these
       two ever agree, the wrapper has stopped doing anything. */
    const wrong = p(spectralCss(0.405, 1));
    ok(!(wrong[0] === violet[0] && wrong[1] === violet[1] && wrong[2] === violet[2]),
       'micrometres fed to the nm helper give a DIFFERENT colour');
    /* the sRGB matrix against the D65 white point */
    const wx = 0.9505, wy = 1.0, wz = 1.0890;
    for (let i = 0; i < 3; i++)
      close(SRGB_M[i][0] * wx + SRGB_M[i][1] * wy + SRGB_M[i][2] * wz, 1, 2e-3,
            'sRGB matrix maps D65 to white, row ' + i);
    ok(luminous(0.81) < 1e-4, 'the eye cannot see 810 nm');
    ok(luminous(0.555) > 0.9, 'the eye peaks near 555 nm');
    /* false colour must be a legal colour and must vary */
    ok(falseColour(0.7, 0.6, 0.9, 1) !== falseColour(0.8, 0.6, 0.9, 1),
       'the false-colour ramp actually varies');
  }

  /* ---------------- 9. the model, off built models ---------------- */
  {
    const M = buildModel(Object.assign({}, DEFAULTS));
    close(M.cutColl * RAD, 28.6704038348, 1e-8, 'model: collinear cut (scipy)');
    close(M.cutAlt * RAD, 28.8505541069, 1e-8, 'model: alternative fit (scipy)');
    close(M.cutSpread, 0.18015027207, 1e-8, 'model: the spread (scipy)');
    ok(M.circular, 'model: type I is circular');
    ok(M.cross.length === 0, 'model: type I has no crossings');
    close(M.dng, 0, 0, 'model: type I has EXACTLY zero group delay difference');
    ok(!M.twoPol, 'model: type I is not two-polarisation');
    ok(M.dipTri === false, 'model: type I dip is not the triangle');
    ok(M.warn.length === 0, 'model: BBO at 405 nm needs no extrapolation');
  }
  {
    const M = buildModel(Object.assign({}, DEFAULTS,
      { crystal: 'bbo2', pumpNm: 351.1, cutOff: 0.73, lenMm: 3 }));
    ok(!M.circular, 'model: type II is not circular');
    ok(M.cross.length === 2, 'model: type II crosses at exactly two points');
    close(M.cross[0][1] + M.cross[1][1], 0, 1e-6,
          'the two crossings are mirror images in y');
    close(M.cross[0][0] - M.cross[1][0], 0, 1e-6,
          'and sit at the same x');
    ok(M.twoPol && M.dng > 0.05, 'model: type II daughters do separate in time');
    ok(M.dipTri, 'model: unfiltered type II shows the triangular dip');
    /* THE MODEL'S OWN group delay, against an absolute number.  The 250 fs/mm
       check further up recomputes the formula locally, which is exactly the
       pattern that hides a broken model -- mutation testing caught this: a
       group delay 100x too small still satisfied every relative check here,
       because the dip merely switched which mechanism was "broader". */
    close(M.dng, 0.078118805, 1e-8, 'model: Delta n_g for type II (scipy)');
    close(M.DL_fs, 781.728856021, 2e-3,
          'model: 3 mm of type-II BBO delays the pair by 781.7 fs (scipy)');
    close(M.tauSpec_fs, 72.578256521433, 1e-8,
          'model: and a 10 nm filter allows only 72.6 fs (scipy)');
    ok(M.DL_fs > M.tauSpec_fs, 'so the birefringent delay is what is seen');
    /* WHICH WAY the cone leans.  Flipping the sign of the cross term in
       thetaToAxis mirrors the whole picture in x, which leaves every
       symmetric observable -- the crossings, the mirror identity, the
       azimuth-dependence test -- completely unchanged.  Only an absolute
       angle at a named azimuth pins it, so here are two. */
    close(M.cutColl * RAD, 48.904453981074, 1e-9,
          'model: type-II collinear cut (scipy)');
    close(M.cutDeg, 49.634453981074, 1e-9, 'model: the cut in force (scipy)');
    close(M.ringA[0].Om * RAD, 0.715994324650, 1e-8,
          'the o-ray leaves at 0.716 deg on the optic-axis side (scipy)');
    close(M.ringA[36].Om * RAD, 4.727523555462, 1e-8,
          'and at 4.728 deg on the far side (scipy)');
    ok(M.ringA[36].Om > M.ringA[0].Om,
       'the cone leans AWAY from the optic axis, not toward it');
    /* the exact identity: at degeneracy the two external cones are mirror
       images, because refraction preserves the transverse momentum the pair
       shares.  Asserted at 1e-12, and asserted to FAIL away from degeneracy,
       so it is a property rather than a tautology. */
    const C = M.C;
    let worst = 0;
    for (const pd of [0, 30, 60, 90, 120, 150, 180]) {
      const phi = pd * DEG;
      const oo = traceRay(C, M.Lp, M.thPm, M.Ls, phi, 'o', 0);
      const ee = traceRay(C, M.Lp, M.thPm, M.Li, phi + PI, 'e', 0);
      if (oo === null || ee === null) continue;
      const eo = toExternal(oo, nOf(C.o, M.Ls));
      const e2 = toExternal(ee, nExt(nOf(C.o, M.Li), nOf(C.e, M.Li),
                                     thetaToAxis(M.thPm, ee, phi + PI)));
      worst = Math.max(worst, Math.abs(eo - e2));
    }
    close(worst, 0, 1e-12,
          'at degeneracy the two external cones are EXACT mirror images');
  }
  {
    const M = buildModel(Object.assign({}, DEFAULTS,
      { crystal: 'ppktp0', pumpNm: 405 }));
    close(M.period0, 3.51155679561, 1e-8, 'model: PPKTP type-0 period (scipy)');
    ok(M.warn.length > 0, 'model: a 405 nm PPKTP pump is flagged as extrapolated');
    close(M.dng, 0, 0, 'model: type 0 has EXACTLY zero group delay difference');
    const M2 = buildModel(Object.assign({}, DEFAULTS,
      { crystal: 'ppktp0', pumpNm: 460 }));
    ok(M2.warn.length === 0, 'model: a 460 nm pump is inside the fit and is NOT flagged');
    /* the poled type II DOES have two polarisations, and its group delay is
       the y/z group-index difference -- a second absolute anchor on DL_fs,
       through a completely different pair of Sellmeier fits */
    const M3 = buildModel(Object.assign({}, DEFAULTS,
      { crystal: 'ppktp2', pumpNm: 405, lenMm: 10 }));
    ok(M3.twoPol, 'model: poled type II is two-polarisation');
    close(M3.dng, 0.105155845480, 1e-9,
          'model: PPKTP y/z group-index difference (scipy)');
    close(M3.DL_fs, 3507.621445222, 1e-5,
          'model: 10 mm of PPKTP delays the pair by 3507.6 fs (scipy)');
  }
  {
    /* the spectral coherence time, which the dip falls back on whenever the
       two daughters share a polarisation or a filter is narrower than the
       birefringent delay */
    const M = buildModel(Object.assign({}, DEFAULTS, { filterNm: 10 }));
    close(M.Ls * 1000, 810, 1e-9, 'model: the tracked signal is 810 nm');
    close(M.tauSpec_fs, 96.572821228314, 1e-8,
          'model: a 10 nm filter at 810 nm gives 96.57 fs (scipy)');
    close(M.dipWidth_fs, 96.572821228314, 1e-8,
          'and with no birefringent delay that IS the dip width');
    const M3 = buildModel(Object.assign({}, DEFAULTS, { filterNm: 30 }));
    close(M3.tauSpec_fs, 32.190940409438, 1e-8,
          'a wider filter gives a narrower dip (scipy)');
  }
  {
    /* signalWindow: the idler bound is what binds, and it is always redder
       than the pump -- so no separate positive-idler guard is needed. */
    for (const [ck, lp] of [['bbo1', 0.405], ['bbo1', 0.3511], ['bbo1', 0.50],
                            ['ppktp0', 0.405], ['ppktp0', 0.52]]) {
      const C = CRYSTALS[ck];
      const w = signalWindow(C, lp);
      ok(w !== null, 'signalWindow exists for ' + ck + ' at ' + lp);
      ok(w[0] > lp, 'and its red end is beyond the pump (' + ck + ')');
      ok(idlerOf(lp, w[0]) <= Math.min(SELL[C.o].range[1],
                                       SELL[C.e].range[1]) * (1 + 1e-12),
         'the idler at the blue edge is inside the fit (' + ck + ')');
    }
    close(signalWindow(CRYSTALS.bbo1, 0.405)[0], 0.655420, 1e-5,
          'signalWindow blue edge for BBO at 405 nm (scipy)');
    ok(signalWindow(CRYSTALS.bbo1, 2.0) === null,
       'a pump past the red end of the fit has no valid signal at all');
    /* And a case a slider really can reach: at 560 nm the degenerate pair is
       at 1120 nm, past the 1060 nm top of the Eimerl fit, so there is no
       window at all.  The model must survive that rather than throw, and the
       readout must say the numbers are extrapolated. */
    ok(signalWindow(CRYSTALS.bbo1, 0.56) === null,
       'a 560 nm pump on BBO has no window: its pair would be past the fit');
    {
      const M = buildModel(Object.assign({}, DEFAULTS, { pumpNm: 560 }));
      ok(isFinite(M.cutDeg) && isFinite(M.Ls),
         'and the model still builds finite numbers there');
      ok(M.warn.length > 0, 'and flags them as extrapolated');
    }
  }

  /* ---------------- 10. nothing produces NaN anywhere ---------------- */
  {
    let built = 0, panels = 0;
    const keys = Object.keys(CRYSTALS);
    for (const ck of keys)
      for (const [vk] of VIEWS)
        for (const sf of [0.6, 1.0, 1.5])
          for (const co of [-0.4, 0.53, 3.0])
            for (const len of [0.05, 1, 12]) {
              const st = Object.assign({}, DEFAULTS, { crystal: ck, view: vk,
                sigFrac: sf, cutOff: co, lenMm: len });
              let M;
              try { M = buildModel(st); }
              catch (e) { fail++; bad.push('buildModel threw: ' + ck + '/' + vk
                                           + '/' + sf + '/' + co + ' — ' + e.message);
                          continue; }
              built++;
              for (const v of [M.cutDeg, M.Ls, M.Li, M.dng, M.DL_fs,
                               M.dipWidth_fs, M.dm.absS, M.tsi.S])
                if (!isFinite(v)) {
                  fail++; bad.push('non-finite in model ' + ck + '/' + vk);
                  break;
                }
              const html = readoutHTML(M) + eqbarText(M) + tagText(M);
              panels++;
              if (/NaN|undefined|Infinity/.test(html)) {
                fail++;
                bad.push('panel text carries NaN/undefined: ' + ck + '/' + vk
                         + '/' + sf + '/' + co + '/' + len);
              }
            }
    ok(built === keys.length * VIEWS.length * 27, 'every combination built ('
       + built + ')');
    ok(panels === built, 'every combination produced panel text');
  }
  /* the pump slider, swept, must never break anything */
  {
    let bad2 = 0;
    for (const ck of Object.keys(CRYSTALS))
      for (let nm = 320; nm <= 560; nm += 10) {
        let M;
        try { M = buildModel(Object.assign({}, DEFAULTS,
              { crystal: ck, pumpNm: nm })); }
        catch (e) { bad2++; continue; }
        if (!isFinite(M.Ls) || !isFinite(M.cutDeg)) bad2++;
      }
    ok(bad2 === 0, 'the whole pump range is safe for every crystal');
  }

  const total = pass + fail;
  console.log(pass + ' passed, ' + fail + ' failed  (of ' + total + ')');
  for (const b of bad) console.log('   FAILED: ' + b);
  return fail;
}

/* ============================== entry ============================= */
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
} else {
  /* THROW on failure.  Printing the count and returning it is not enough:
     osascript exits 0 either way, so the mutation runner -- which decides
     "caught" from the exit code -- reported 40 survivors on a suite that was
     in fact catching them.  A test harness that cannot fail the process is
     not a test harness. */
  if (selfTest() > 0) throw new Error('selfTest: assertions failed');
}
</script>
</body>
</html>
