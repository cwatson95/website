<title>Green&rsquo;s functions &amp; the Wronskian &mdash; one solution from each end, glued where the load sits</title>
<!--
  ===================================================================
  greens_functions.html — the Green's function of a second-order
  problem built from two solutions and their Wronskian,
  G(x, xi) = -y1(x<) y2(x>) / (p W), in six views and many examples
  ===================================================================

  Six views.  THE CONSTRUCTION: L u = -(p u')' + q u = f with one
  condition at each end; y1 meets the left end and y2 the right one;
  G is them glued at xi, continuous, with the slope jump -1/p(xi);
  p W is one number (Abel).  Examples: the string (fixed, free or a
  spring at each end; free-free has W = 0 and no G), a string on an
  elastic bed, a driven string, the whole line (exp(-k|x - xi|)/2k), a
  disk's mode m, a ball's multipole l (r<^l / r>^(l+1) / (2l + 1)), a
  drum (Bessel, integrated: no Bessel function is evaluated), and a
  drifting string (-u'' + c u', not self-adjoint).  THE LOAD:
  u = int G f, swept in, against a direct finite-difference solve;
  Maxwell-Betti reciprocity.  ABEL'S IDENTITY: two solutions as two
  vectors in the phase plane, their parallelogram's area W following
  c exp(-int f): the damped oscillator, Bessel J0 and Y0, Legendre
  P and Q, Airy Ai and Bi, Euler-Cauchy; a mixing slider makes the
  pair dependent.  RESONANCE: the driven string and the drum, p W as
  a function of the frequency, its zeros the eigenvalues (the drum's
  found by the page's own integration), G near a zero, and the
  eigenfunction series.  THE IMPULSE: the causal Green's function of
  a damped oscillator from variation of parameters, Duhamel's sum for
  a kick, a step, a pulse, a sine and a train of kicks, against direct
  integration.  BOUND STATES: the resolvent G(x, x'; E) of
  -psi'' + V psi, the decaying solutions from each side, W(E) = 0 at
  the bound states (for the oscillator W is proportional to
  1/Gamma(1/2 - E/2), DLMF 12.2.11): a square well, the harmonic
  oscillator, Poschl-Teller, a double well and a delta well.

  EXACT (build_green/derive.py, sympy and mpmath at 30 digits): every
  closed-form G (L G = 0 off the diagonal, continuity, the jump, the
  ends, symmetry), the loads' responses (by quadrature, and for the
  smooth loads also by a direct solve without G), the eigenvalues,
  the oscillator's responses, the bound states.
  NUMERICAL (pinned to the twin in selfTest): the shooting
  integrations (Dormand-Prince 5(4) on (y, p y')), the running
  Simpson integrals, the finite differences, the zeros of W.
  SOURCED: the DLMF's Wronskians and Abel's identity, verbatim in
  build_green/data/lit_dlmf.md (Version 1.2.8, 2026-09-15).
  ===================================================================
-->

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],

  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];

  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */

}

            /* standard_model.html: the group-theory symbols */
            '&otimes;':'⊗','&oplus;':'⊕','&Xi;':'Ξ','&xi;':'ξ','&psi;':'ψ','&chi;':'χ','&zeta;':'ζ',

   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);

      const s=kind==='spring'?P.h:0;                 /* the half cell: flux p u′ = s u through the end */

function tW(pr,t){ const Y=pr.y(t); return Y[0]*Y[3]-Y[1]*Y[2]; }
/* the kick's response g(s) = G(τ + s, τ) in closed form (0 before the kick) */
function tG(g,s){ if(s<0) return 0; if(tCritical(g)) return s*Math.exp(-s);
  if(g<1){ const w=Math.sqrt(1-g*g); return Math.exp(-g*s)*Math.sin(w*s)/w; }
  const O=Math.sqrt(g*g-1); return Math.exp(-g*s)*Math.sinh(O*s)/O; }
/* G(t, τ) from the pair and its Wronskian, the page's construction */
function tGpair(pr,t,tau){ if(t<tau) return 0; const A=pr.y(tau), B=pr.y(t); return (A[0]*B[2]-B[0]*A[2])/(A[0]*A[3]-A[1]*A[2]); }
/* the force: its smooth part f(t), its kicks [time, size] and the times where f jumps */
function tForce(st){ const id=st.tF, T=st.tT, w=st.tW;
  if(id==='kick') return {id,f:()=>0,kicks:[[T_ON,1]],bps:[T_ON]};
  if(id==='step') return {id,f:t=>t>=T_ON?1:0,kicks:[],bps:[T_ON]};
  if(id==='pulse') return {id,f:t=>t>=T_ON&&t<T_ON+T?1:0,kicks:[],bps:[T_ON,T_ON+T]};
  if(id==='sine') return {id,f:t=>t>=T_ON?Math.sin(w*(t-T_ON)):0,kicks:[],bps:[T_ON]};
  const P=2*PI/w, ks=[]; for(let j=0;T_ON+j*P<T_END;j++) ks.push([T_ON+j*P,1]);
  return {id,f:()=>0,kicks:ks,bps:ks.map(k=>k[0])};
}
/* the time grid: T_N steps over [0, T_END], every breakpoint and any extra time exactly on it */
function tGrid(F,extra){ const ts=[]; for(let i=0;i<=T_N;i++) ts.push(T_END*i/T_N);
  for(const b of F.bps.concat(extra||[])) if(b>=0&&b<=T_END&&ts.indexOf(b)<0) ts.push(b);
  return ts.sort((a,b)=>a-b); }
/* x(t) on the grid, three ways: variation of parameters (the two running integrals, 6-point Gauss–Legendre on each
   step, which never straddles a jump of f), the direct integration of the forced equation (Dormand–Prince, piece by
   piece, each kick a jump of its size in x′), and the kicks' separate copies of G */
function tSolve(st,extra){
  const g=st.tZ, F=tForce(st), pr=tPair(g), ts=tGrid(F,extra), n=ts.length;
  const x=new Array(n), v=new Array(n), kickAt=new Map(F.kicks.map(k=>[k[0],k[1]]));
  let A=0, B=0;
  for(let i=0;i<n;i++){
    const t=ts[i];
    if(i>0){ const a=ts[i-1], h=t-a;
      if(h>0) for(let j=0;j<6;j++){ const tau=a+h*(GL6X[j]+1)/2, Y=pr.y(tau), f=F.f(tau);
        if(f!==0){ const Wt=Y[0]*Y[3]-Y[1]*Y[2], c=GL6W[j]*h/2*f/Wt; A+=c*Y[2]; B+=c*Y[0]; } } }
    const I=kickAt.get(t); if(I){ const Y=pr.y(t), Wt=Y[0]*Y[3]-Y[1]*Y[2]; A+=I*Y[2]/Wt; B+=I*Y[0]/Wt; }
    const Y=pr.y(t); x[i]=Y[2]*B-Y[0]*A; v[i]=Y[3]*B-Y[1]*A;
  }
  /* the direct integration, piece by piece between the breakpoints (a step landing on a jump reads the next piece's f
     in its last stages; the error control shrinks that step, and reading f strictly inside the piece instead changed
     x by 2e-12 at most over every force, a measurement kept in the changelog) */
  const xd=new Array(n).fill(0), cuts=[...new Set([0,...F.bps.filter(b=>b>0&&b<T_END),T_END])].sort((a,b)=>a-b);
  let Z=[0,0], i0=0;
  for(let c=0;c+1<cuts.length;c++){
    const a=cuts[c], b=cuts[c+1], I=kickAt.get(a); if(I) Z=[Z[0],Z[1]+I];
    const rhs=(t,Y)=>[Y[1],F.f(t)-2*g*Y[1]-Y[0]];
    while(i0<n&&ts[i0]<=a){ if(ts[i0]===a) xd[i0]=Z[0]; i0++; }
    const idx=[]; for(let j=i0;j<n&&ts[j]<=b;j++) idx.push(j);
    const touts=idx.map(j=>ts[j]); if(touts[touts.length-1]!==b) touts.push(b);
    const sol=dopri(rhs,a,Z,touts,{atol:1e-13});
    idx.forEach((j,q)=>{ xd[j]=sol[q][0]; });
    Z=sol[sol.length-1];
  }
  return {g,F,pr,ts,x,v,xd};
}

/* ================================================================== *
 *  6. bound states — −ψ″ + Vψ = Eψ (units with ħ²/2m = 1).  ψ₁ decays *
 *  to the left, ψ₂ to the right; G(x, x′; E) = −ψ₁(x<)ψ₂(x>)/W, and   *
 *  W(E) vanishes exactly where the two are one solution: a bound      *
 *  state (for the oscillator W ∝ 1/Γ(½ − E/2), DLMF 12.2.11).          *
 * ================================================================== */
const QM_XM=0.5;      /* where the normalised Wronskian is measured */
const QM_LIST=[{id:'well',name:'square well'},{id:'harmonic',name:'oscillator'},{id:'pt',name:'Pöschl–Teller'},
               {id:'double',name:'double well'},{id:'delta',name:'δ well'}];
/* V, the breakpoints where V jumps (or the δ sits), the display half-width X, the start of the integrations Xi, the
   energy window; Pöschl–Teller is −λ(λ + 1) sech²x, the double well two wells of width 2a either side of a barrier */
const QM={
  well:{name:'a square well',V:(x,P)=>Math.abs(x)<P.a?-P.V0:0,bps:P=>[-P.a,P.a],X:P=>P.a+3,Xi:P=>P.a+3,E:P=>[-P.V0,0]},
  harmonic:{name:'the harmonic oscillator',V:x=>x*x,bps:()=>[],X:()=>5,Xi:()=>8,E:()=>[0,12],wkb:true},
  pt:{name:'the Pöschl–Teller well',V:(x,P)=>{ const c=1/Math.cosh(x); return -P.lam*(P.lam+1)*c*c; },bps:()=>[],X:()=>6,Xi:()=>20,E:P=>[-1.1*P.lam*P.lam,0]},
  double:{name:'a double well',V:(x,P)=>{ const u=Math.abs(x), h=P.sep/2; return u>h&&u<h+2*P.a?-P.V0:0; },
    bps:P=>{ const h=P.sep/2, o=h+2*P.a; return [-o,-h,h,o]; },X:P=>P.sep/2+2*P.a+2.5,Xi:P=>P.sep/2+2*P.a+2.5,E:P=>[-P.V0,0]},
  delta:{name:'a δ well',V:()=>0,bps:()=>[0],X:P=>clamp(6/P.al,2,10),Xi:P=>clamp(6/P.al,2,10),E:P=>[-P.al*P.al,0],al:P=>P.al}};
function qParams(st){ return {V0:st.qV0,a:st.qA,lam:st.qLam,sep:st.qSep,al:st.qAl}; }
/* the start at the far end x₀, the solution that decays outward (dir = +1 for ψ₁ at −Xi, −1 for ψ₂ at +Xi): beyond
   the wells V = 0 and it is exactly (1, ±κ); the oscillator's is WKB with its first correction, ψ′/ψ = ±κ − κ′/(2κ),
   κ = √(x² − E); Pöschl–Teller's sech² tail at 20 is 4λ(λ + 1)e⁻⁴⁰, below the rounding */
function qmStart(q,P,E,x0,dir){ const k=Math.sqrt(Math.max(q.V(x0,P)-E,0)); return q.wkb?[1,dir*k-x0/(2*k*k)]:[1,dir*k]; }
/* one solution carried from x₀ across the outputs (ordered in the direction of travel), piece by piece between the
   breakpoints (V read strictly inside each piece), a δ at 0 kinking ψ′ by −αψ on the way right (+αψ on the way left);
   at the δ itself both solutions are reported just right of it, at 0⁺, so W there is W */
function qmRun(q,P,E,x0,Y0,outs,dir,tol){
  const bps=q.bps(P).filter(b=>dir*(b-x0)>0).sort((a,b)=>dir*(a-b)), al=q.al?q.al(P):0, res=new Array(outs.length);
  let x=x0, Y=Y0.slice(), j=0;
  for(const b of [...bps,dir*Infinity]){
    const idx=[]; while(j<outs.length&&dir*(outs[j]-b)<=0){ idx.push(j); j++; }
    if(!idx.length&&j>=outs.length) break;
    const touts=idx.map(i=>outs[i]); if(isFinite(b)&&touts[touts.length-1]!==b) touts.push(b);
    const lo=Math.min(x,touts[touts.length-1]), hi=Math.max(x,touts[touts.length-1]);
    const rhs=(t,Z)=>[Z[1],(q.V(Math.min(Math.max(t,lo+1e-12),hi-1e-12),P)-E)*Z[0]];
    const sol=dopri(rhs,x,Y,touts,{tol:tol||1e-12});
    idx.forEach((i,k)=>{ res[i]=sol[k]; }); Y=sol[sol.length-1]; x=touts[touts.length-1];
    if(al&&b===0){ Y=[Y[0],Y[1]-dir*al*Y[0]]; if(dir>0) idx.forEach(i=>{ if(outs[i]===0) res[i]=Y.slice(); }); }
  }
  return res;
}
/* both solutions on ascending points xs: [ψ, ψ′] each */
function qmShoot(id,P,E,xs,tol){ const q=QM[id], Xi=q.Xi(P);
  return {L:qmRun(q,P,E,-Xi,qmStart(q,P,E,-Xi,1),xs,1,tol),R:qmRun(q,P,E,Xi,qmStart(q,P,E,Xi,-1),xs.slice().reverse(),-1,tol).reverse()}; }
/* the normalised Wronskian at x = ½: W/(|v₁||v₂|) = sin θ, the angle between the phase vectors v = (ψ, ψ′) */
function qmWn(id,P,E,tol){ const S=qmShoot(id,P,E,[QM_XM],tol), l=S.L[0], r=S.R[0];
  return (l[0]*r[1]-l[1]*r[0])/(Math.hypot(l[0],l[1])*Math.hypot(r[0],r[1])); }
/* G(x, x′; E) at one pair of points, W measured at x = ½ */
function qmGreen(id,P,E,x,xp){ const lo=Math.min(x,xp), hi=Math.max(x,xp), xs=[...new Set([lo,hi,QM_XM])].sort((a,b)=>a-b);
  const S=qmShoot(id,P,E,xs), m=xs.indexOf(QM_XM), W=S.L[m][0]*S.R[m][1]-S.L[m][1]*S.R[m][0];
  return -S.L[xs.indexOf(lo)][0]*S.R[xs.indexOf(hi)][0]/W; }
/* the levels. Every potential here is even, so ψ₂(x) = ψ₁(−x) and W = −ψ₁(0)(ψ₁′(0⁻) + ψ₁′(0⁺)) = −2ψ₁(0)(ψ₁′(0⁺) + αψ₁(0)/2):
   the odd states are the zeros of ψ₁(0), the even ones of ψ₁′(0⁺) + αψ₁(0)/2 (ψ₁′(0) when there is no δ). A double
   well's close pair is one zero of each, so the scan never has to split two zeros of one function. The scan runs at a
   tolerance of 1e-10, the refinement at 1e-12. */
function qmLevels(id,P){
  return pcache('lev:'+id+':'+JSON.stringify(P),()=>{
    const q=QM[id], [lo,hi]=q.E(P), al=q.al?q.al(P):0, Xi=q.Xi(P);
    const par=(E,tol)=>{ const Y=qmRun(q,P,E,-Xi,qmStart(q,P,E,-Xi,1),[0],1,tol)[0], n=Math.hypot(Y[0],Y[1]); return [Y[0]/n,(Y[1]+al*Y[0]/2)/n]; };
    const N=200, Es=[], V=[];
    for(let i=0;i<=N;i++){ const E=lo+(hi-lo)*(i+0.5)/(N+1); Es.push(E); V.push(par(E,1e-10)); }
    const out=[];
    for(const c of [0,1]) for(let i=0;i<N;i++) if(V[i][c]*V[i+1][c]<0) out.push(illinois(E=>par(E)[c],Es[i],Es[i+1],V[i][c],V[i+1][c]));
    return out.sort((a,b)=>a-b);
  });
}
/* the normalised W across the window (for the picture: tolerance 1e-10); where the window ends at the continuum's
   edge, E = 0, the solutions change fast as κ → 0, and the last 4 % gets 40 more points */
function qmCurve(id,P){
  return pcache('wn:'+id+':'+JSON.stringify(P),()=>{ const [lo,hi]=QM[id].E(P), u=[], Es=[], W=[];
    for(let i=0;i<=200;i++) u.push(i/200);
    if(id!=='harmonic') for(let i=1;i<40;i++) u.push(0.96+0.04*i/40);
    u.sort((a,b)=>a-b);
    for(const f of u){ const E=lo+(hi-lo)*f; if(Es.length&&E===Es[Es.length-1]) continue; Es.push(E); W.push(qmWn(id,P,E,1e-10)); }
    return {Es,W}; });
}
/* the closed-form levels, where there are any: 2n + 1, −(λ − n)² for n < λ, −α²/4 */
function qmExact(id,P){
  if(id==='harmonic') return [1,3,5,7,9,11];
  if(id==='pt'){ const o=[]; for(let n=0;n<P.lam;n++) o.push(-(P.lam-n)*(P.lam-n)); return o; }
  if(id==='delta') return [-P.al*P.al/4];
  return null;
}

/* ================================================================== *
 *  state, the view models (every number a view draws or prints)      *

const TABS=[['build','the construction'],['load','the load'],['abel','Abel’s identity'],['res','resonance'],
            ['time','the impulse'],['qm','bound states']];
/* role colours: green = the computed quantity, orange = a reference or an independent solve, magenta = the live

           y1:'#6aa6ff', y2:'#c79bff', load:'#e8843a', box:'#232838'};
const RO_W=300;

                {id:'disk',name:'disk'},{id:'ball',name:'ball'},{id:'drum',name:'drum'},{id:'drift',name:'drift'}];

const LIM={bH:[0.2,20], bKap:[0.3,20], bK:[0.2,14], bM:[0,4], bEll:[0,5], bC:[-8,8], bXi:[0.02,0.98],

           aG:[0,1], aNu:[0,2], aAl:[-2,4], aMix:[0,89], rK:[0.2,14], rM:[0,3], rXi:[0.02,0.98], rN:[1,40],
           tZ:[0,2], tW:[0.2,3], tT:[0.5,8], qE:[0,1], qXp:[0.02,0.98], qV0:[5,80], qA:[0.3,2], qLam:[0.5,6], qSep:[0.1,2], qAl:[0.5,8]};
const LOGN=1000;
function logOf(v,lo,hi){ return clamp(Math.round(LOGN*Math.log(v/lo)/Math.log(hi/lo)),0,LOGN); }
function ofLog(u,lo,hi){ return lo*Math.pow(hi/lo,clamp(u,0,LOGN)/LOGN); }
const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the clock: the load's sweep, Abel's cursor and the impulse's time move; the rest is still ---- */
const SIM={t:0};
const FRAME=1/60;
function simReset(){ SIM.t=0; }
function viewAnimates(st){ return (st.view==='load'&&st.lPlay)||(st.view==='abel'&&st.aPlay)||(st.view==='time'&&st.tPlay); }
function runStep(st){ if(!viewAnimates(st)) return false; SIM.t+=FRAME; return true; }
/* the clock's phase in [0, 1) for a cycle of D seconds */
function phaseOf(D){ return ((SIM.t/D)%1+1)%1; }

/* ================================================================== */
/*  1. the construction                                               */
/* ================================================================== */
function bParams(st){ return {L:st.bL,R:st.bR,h:st.bH,kappa:st.bKap,k:st.bK,m:st.bM,l:st.bEll,c:st.bC}; }
/* the source point: a fraction of the example's window */
function xiOf(ex,frac){ return ex.lo+(ex.hi-ex.lo)*frac; }
/* p at x as the (y, z) system carries it: z = p y′ (the drift carries y′) */
function pOf(ex,x){ return ex.rhs?1:ex.p(x); }
/* W = 0 to the solutions' own precision: one solution meets both ends */
function isDegenerate(S,i){ return !(Math.abs(S.pW[i])>1e-9*(Math.abs(S.y1[i]*S.z2[i])+Math.abs(S.z1[i]*S.y2[i])+1e-300)); }
function buildView(st){
  const P=bParams(st), ex=EXS[st.bEx];
  return memo('build',JSON.stringify([st.bEx,P,st.bXi]),()=>{
    const xi=xiOf(ex,st.bXi), xs=exGrid(ex,400,[xi]), S=exSolve(ex,P,xs), is=xs.indexOf(xi), pWs=S.pW[is];
    const deg=isDegenerate(S,is);
    const out={ex,P,xi,xs,S,is,pWs,deg};
    if(deg) return out;
    const y1s=S.y1[is], y2s=S.y2[is], ps=pOf(ex,xi);
    out.G=xs.map((x,i)=>greenFrom(S.y1[i],S.y2[i],y1s,y2s,pWs,x<=xi));
    /* the two branches, each continued past ξ: G is these two solutions glued at ξ */
    out.brL=xs.map((x,i)=>-S.y1[i]*y2s/pWs); out.brR=xs.map((x,i)=>-y1s*S.y2[i]/pWs);
    /* the slope on each side, and the jump at ξ (integrating L G = δ across ξ demands −1/p(ξ)) */
    out.dG=xs.map((x,i)=>x<xi?-(S.z1[i]/pOf(ex,x))*y2s/pWs:x>xi?-y1s*(S.z2[i]/pOf(ex,x))/pWs:NaN);
    out.slopeL=-(S.z1[is]/ps)*y2s/pWs; out.slopeR=-y1s*(S.z2[is]/ps)/pWs; out.jump=out.slopeR-out.slopeL; out.jumpWant=-1/ps;
    out.Gxx=out.G[is];
    /* p W along x: constant (Abel) for the self-adjoint examples; W ∝ e^{cx} for the drift */
    let lo=Infinity, hi=-Infinity; for(let i=0;i<xs.length;i++){ lo=Math.min(lo,S.pW[i]); hi=Math.max(hi,S.pW[i]); }
    out.pWspread=(hi-lo)/Math.abs(pWs); out.wRatio=S.pW[xs.length-1]/S.pW[0];
    /* G(ξ, x) against G(x, ξ): equal when L is self-adjoint; for the drift their ratio is e^{c(x − ξ)} */
    let sym=0; for(let i=0;i<xs.length;i+=4){ const gT=greenFrom(y1s,y2s,S.y1[i],S.y2[i],S.pW[i],xi<=xs[i]);
      if(ex.sa) sym=Math.max(sym,Math.abs(gT-out.G[i])/Math.max(Math.abs(out.Gxx),1e-300));
      else if(Math.abs(xs[i]-xi)>1e-9&&Math.abs(gT)>1e-12) sym=Math.max(sym,Math.abs(out.G[i]/gT/Math.exp(P.c*(xs[i]-xi))-1)); }
    out.sym=sym;
    /* the closed form, where there is one, against the numbers: the page's two implementations */
    if(ex.closed){ let w=0; for(let i=0;i<xs.length;i+=5){ const gc=greenClosed(ex,P,xs[i],xi); w=Math.max(w,Math.abs(gc-out.G[i])/Math.max(Math.abs(out.Gxx),1e-300)); } out.closedDiff=w; }
    /* each solution scaled by its largest size away from a singular end, for the panel of the two */
    const away=i=>!(ex.lo===0&&ex.p(0)===0)||xs[i]>0.1*ex.hi;
    let m1=0,m2=0; for(let i=0;i<xs.length;i++) if(away(i)){ m1=Math.max(m1,Math.abs(S.y1[i])); m2=Math.max(m2,Math.abs(S.y2[i])); }
    out.s1=m1>0?1/m1:1; out.s2=m2>0?1/m2:1;
    return out;
  });
}

/* ================================================================== */
function lParams(st){ const ex=EXS[st.lEx]; return {L:ex.ends?st.lL:'fixed',R:ex.ends?st.lR:'fixed',h:st.lH,kappa:st.lKap,k:st.lK,m:st.lM,l:0,c:st.lC}; }
function loadView(st){
  const P=lParams(st), ex=EXS[st.lEx];
  return memo('load',JSON.stringify([st.lEx,P,st.lLoad,st.lX0,st.lW,st.lN]),()=>{
    const L=loadFn(st.lLoad,st.lX0,st.lW,st.lN), R=loadSolve(ex,P,L,[st.lX0]);
    const i0=R.xs.indexOf(st.lX0), out={ex,P,L,R,x0:st.lX0,i0};
    out.deg=isDegenerate(R.S,i0);
    if(out.deg) return out;
    let uMax=0; for(const v of R.u) uMax=Math.max(uMax,Math.abs(v)); out.uMax=uMax; out.u0=R.u[i0];
    /* the direct solve on its own grid, compared at its nodes (u from the Green's function interpolated onto them) */
    const fd=fdSolve(ex,P,L,2000); out.fd=fd;
    let d=0, j=0; for(let i=0;i<fd.xs.length;i++){ const x=fd.xs[i]; if(x<R.xs[0]||x>R.xs[R.xs.length-1]) continue;
      while(j<R.xs.length-2&&R.xs[j+1]<x) j++; const t=(x-R.xs[j])/(R.xs[j+1]-R.xs[j]), ug=R.u[j]+(R.u[j+1]-R.u[j])*t;
      d=Math.max(d,Math.abs(ug-fd.u[i])); }
    out.fdDiff=uMax>0?d/uMax:0;
    /* Maxwell–Betti: the deflection under a unit load at x₀, G(x, x₀), and the influence line of x₀, G(x₀, ξ) */
    const S=R.S;
    out.defl=R.xs.map((x,i)=>greenFrom(S.y1[i],S.y2[i],S.y1[i0],S.y2[i0],S.pW[i0],x<=st.lX0));
    out.infl=R.xs.map((x,i)=>greenFrom(S.y1[i0],S.y2[i0],S.y1[i],S.y2[i],S.pW[i],st.lX0<=x));
    let rm=0, gm=0; for(let i=0;i<R.xs.length;i++){ rm=Math.max(rm,Math.abs(out.defl[i]-out.infl[i])); gm=Math.max(gm,Math.abs(out.defl[i])); }
    out.recip=gm>0?rm/gm:0;
    /* the total load (for a point: 1) */
    out.total=L.point?1:(()=>{ const c=segCum(R.xs,R.seg,(x,i,side)=>L.f(side?x+side*1e-12:x)); return c[c.length-1]; })();
    return out;
  });
}
/* the sweep's cut: the load swept in from the left over 5 s, held for 1 s */
function sweepS(st,ex){ const ph=phaseOf(6), f=Math.min(1,ph*6/5); return ex.lo+(ex.hi-ex.lo)*f; }

 *  drawing helpers shared by the views (y is UP in the world, so the  *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();

}
/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }
  }
  /* nothing clear: the legend is dropped rather than laid over a curve or a label (the captions
     name the colours); clebsch_gordan: forcing it in a big box put it on the mean's label */
  if(!pick){ KEY_DROPS+=items.length; return; }
  legendBox(ctx,pick[0],pick[1],items);
  const lb=[pick[0],pick[1],pick[0]+bw,pick[1]+bh]; lb.t='the legend'; lb.plate=true; lb.seq=++DRAW_SEQ; LABELS.push(lb);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);

     (a caption chosen by height alone named missing plots on tall narrow canvases: Known-bad 2026-09-27 e) */
  const fit=fitCaption(ctx,W,H,narrow?capShort:capFull,capShort,capW,top+220);

function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }

/* a convex polygon clipped to a box (Sutherland–Hodgman, pixel space): what is drawn from data stays in its plot */

/* ================================================================== *
 *  view 1: the construction                                           *

    for(let i=-2;i<=2;i++) sLine(ctx,[[X,Y+i*6],[X+s*6,Y+i*6+6]],'#5a6378',1); }

function buildSentence(B){
  const ex=B.ex, P=B.P;
  if(ex===EXS.string) return 'For the string, G(x, ξ) is the shape a unit weight hung at ξ gives it'+(P.L==='fixed'&&P.R==='fixed'?', a tent with its peak ξ(1 − ξ) at ξ':'')+'.';
  if(ex===EXS.bed) return 'On an elastic bed the sides bend into sinh curves: the bed holds the string up, and G dies away over 1/κ.';
  if(ex===EXS.forced) return 'Driven at k, the sides are sines; near k = nπ the string resonates and G grows without bound.';
  if(ex===EXS.line) return 'On the whole line the solutions that decay are exp(κx) and exp(−κx), and G = exp(−κ|x − ξ|)/(2κ), the screened potential in one dimension.';
  if(ex===EXS.disk) return 'In a disk, mode m: y₁ = rᵐ, y₂ = r⁻ᵐ − rᵐ (m = 0: 1 and ln(1/r)); pW is constant although W itself falls as 1/r.';

/* ================================================================== *
 *  view 4: resonance                                                  *
 * ================================================================== */
/* the response's k grid: RES_KS plus points closing in on each pole from both sides, so every pole runs off the plot
   (with the plain grid a pole of small residue, φₙ(ξ)² small, is a narrow spike between two samples) */
const RES_DK=[5e-4,1e-3,2e-3,5e-3,0.01,0.02,0.05];
function resRespKs(kn){ const s=new Set(RES_KS);
  for(const k of kn) if(k<14) for(const d of RES_DK){ if(k-d>0.2) s.add(k-d); if(k+d<14) s.add(k+d); }
  return [...s].sort((a,b)=>a-b); }
function resView(st){
  const id=st.rEx, m=id==='drum'?st.rM:0, ex=EXS[id], xi=xiOf(ex,st.rXi);
  const curve=resCurve(id,m);
  const E=resEigen(id,m,st.rN);
  const resp=pcache('resp:'+id+':'+m+':'+st.rXi,()=>{ const ks=resRespKs(E.kn);
    return {ks,v:ks.map(k=>{ const S=exSolve(ex,{k,m},[xi]); return greenFrom(S.y1[0],S.y2[0],S.y1[0],S.y2[0],S.pW[0],true); })}; });
  return memo('res',JSON.stringify([id,m,st.rK,st.rXi,st.rN]),()=>{
    const P={k:st.rK,m}, xs=[...new Set([...E.xs,xi])].sort((a,b)=>a-b), S=exSolve(ex,P,xs), is=xs.indexOf(xi), pWs=S.pW[is];   /* G on the eigen grid, plus ξ */
    const G=xs.map((x,i)=>greenFrom(S.y1[i],S.y2[i],S.y1[is],S.y2[is],pWs,x<=xi));
    const N=Math.min(st.rN,E.phi.length), phX=[]; for(let n=0;n<N;n++) phX.push(resPhiAt(id,m,E.kn[n],E.norm[n],xi));
    const k2=st.rK*st.rK;
    const GN=E.xs.map((x,i)=>{ let s=0; for(let n=0;n<N;n++) s+=E.phi[n][i]*phX[n]/(E.kn[n]*E.kn[n]-k2); return s; });
    /* the series against G at the eigen grid's points */
    let err=0, gm=0; for(let i=0;i<E.xs.length;i++){ const j=xs.indexOf(E.xs[i]); err=Math.max(err,Math.abs(GN[i]-G[j])); gm=Math.max(gm,Math.abs(G[j])); }
    let near=0; for(let n=1;n<E.kn.length;n++) if(Math.abs(E.kn[n]-st.rK)<Math.abs(E.kn[near]-st.rK)) near=n;
    return {ex,id,m,xi,xs,G,Gxx:G[is],pWs,GN,err:gm>0?err/gm:0,N,E,near,curve,resp,k:st.rK};
  });
}

function timeView(st){
  return memo('time',JSON.stringify([st.tF,st.tZ,st.tW,st.tT]),()=>{
    const S=tSolve(st,[]);
    let diff=0, xm=0; for(let i=0;i<S.ts.length;i++){ diff=Math.max(diff,Math.abs(S.x[i]-S.xd[i])); xm=Math.max(xm,Math.abs(S.x[i])); }
    let gmax=0; for(let i=0;i<=800;i++) gmax=Math.max(gmax,Math.abs(tG(S.g,T_END*i/800)));
    /* each kick's own copy of G (for a train, x is their sum) */
    const copies=S.F.kicks.length>1?S.F.kicks.map(([tk,I])=>S.ts.map(t=>I*tG(S.g,t-tk))):[];
    /* the sine's steady amplitude |χ(ω)| = 1/√((1 − ω²)² + 4γ²ω²), and the amplitude over the run's last drive period */
    let chi=null, late=null;
    if(S.F.id==='sine'){ const w=st.tW; chi=1/Math.sqrt((1-w*w)*(1-w*w)+4*S.g*S.g*w*w);
      late=0; for(let i=0;i<S.ts.length;i++) if(S.ts[i]>=T_END-2*PI/w) late=Math.max(late,Math.abs(S.x[i])); }

}
/* the cursor crosses the run in sixteen seconds, on the grid */

function timeMemory(T,ic){

    for(let j=0;j<6;j++){ const tau=a+h*(GL6X[j]+1)/2; area+=GL6W[j]*h/2*tG(T.g,tc-tau)*T.F.f(tau); } }

const qmFmt=v=>String(+v.toFixed(3)).replace('-','−');
/* a carried branch from index i0 outward (dir ±1), up to the first point beyond the plot's range by half of it: past

function branchPart(xs,vs,i0,dir,lo,hi){ const px=[], pv=[], m=0.5*(hi-lo);
  for(let i=i0;i>=0&&i<xs.length;i+=dir){ px.push(xs[i]); pv.push(vs[i]); if(vs[i]>hi+m||vs[i]<lo-m) break; }
  return [px,pv]; }
function qmEnergy(st){ const [lo,hi]=QM[st.qV].E(qParams(st)); return lo+(hi-lo)*st.qE; }
function qmXp(st){ const X=QM[st.qV].X(qParams(st)); return -X+2*X*st.qXp; }

    for(const v of [xp,QM_XM]) if(xs.indexOf(v)<0) xs.push(v);

    const W=l[0]*r[1]-l[1]*r[0], wn=W/(Math.hypot(l[0],l[1])*Math.hypot(r[0],r[1]));
    /* W is one number (no first-derivative term): its spread across the window, relative to |ψ₁||ψ₂| there */
    let spread=0; for(let i=0;i<xs.length;i++){ const a=S.L[i], b=S.R[i], Wi=a[0]*b[1]-a[1]*b[0];
      spread=Math.max(spread,Math.abs(Wi-W)/(Math.hypot(a[0],a[1])*Math.hypot(b[0],b[1]))); }
    /* E on a level to the solver's precision: no G, and the one solution that decays both ways is drawn instead */
    const deg=Math.abs(wn)<1e-8;
    const G=deg?null:xs.map((x,i)=>x<=xp?-S.L[i][0]*S.R[ip][0]/W:-S.L[ip][0]*S.R[i][0]/W);
    /* ψ₁'s branch carried on past x′ and ψ₂'s carried back, on G's scale */

  const P=linPlot(ctx,b,-Q.X,Q.X,lo/sc.f,hi/sc.f,{title,xlab:'x',ylab:(Q.deg?'ψ':'G')+sc.s,ny:nyFor(b)});

  const Vs=xs.map(x=>Q.q.V(x,Q.P)); let vmin=Math.min(...Vs,Q.E), vmax=Math.max(...Vs,Q.E); if(vmax-vmin<1e-9){ vmin-=1; vmax+=1; }
  const yv=v=>lo/sc.f+0.3*(hi-lo)/sc.f*(v-vmin)/(vmax-vmin);
  ctx.beginPath(); ctx.moveTo(P.X(xs[0]),P.Y(lo/sc.f)); for(let i=0;i<xs.length;i++) ctx.lineTo(P.X(xs[i]),P.Y(yv(Vs[i])));
  ctx.lineTo(P.X(xs[xs.length-1]),P.Y(lo/sc.f)); ctx.closePath(); ctx.fillStyle=rgba(COL.dim,0.13); ctx.fill();
  P.line(xs,Vs.map(yv),rgba(COL.dim,0.7),1);
  if(Q.id==='delta'){ const X0=P.X(0); ctx.beginPath(); ctx.moveTo(X0,P.Y(yv(vmax))); ctx.lineTo(X0,P.Y(lo/sc.f)); ctx.strokeStyle=rgba(COL.dim,0.8); ctx.lineWidth=1.5; ctx.stroke(); }
  P.line([-Q.X,Q.X],[yv(Q.E),yv(Q.E)],rgba(COL.live,0.75),1,[5,4]);
  if(Q.deg){ P.line(xs,Q.bound.map(f),COL.pos,2.4); keyRow(ctx,b.x,b.y-30,[[COL.pos,'the bound state'],[COL.dim,'V and E (own scale)']],b.w); return; }
  const [ax,av]=branchPart(xs,Q.contL,Q.ip,1,lo,hi), [bx,bv]=branchPart(xs,Q.contR,Q.ip,-1,lo,hi);
  P.line(ax,av.map(f),COL.y1,1.2,[5,4]); P.line(bx,bv.map(f),COL.y2,1.2,[5,4]);
  P.line(xs,Q.G.map(f),COL.pos,2.4);
  HIT.push({kind:'xi',b,key:'qXp',inv:x=>(x-b.x)/b.w});
  vMark(ctx,b,P.X(Q.xp),COL.live,[2,3],1);
  keyRow(ctx,b.x,b.y-30,[[COL.pos,'G'],[COL.y1,'ψ₁ carried on',[5,4]],[COL.y2,'ψ₂ carried back',[5,4]],[COL.dim,'V and E (own scale)']],b.w);
}
function drawQmW(ctx,W,H,b,Q){
  const C=Q.curve;
  const P=linPlot(ctx,b,Q.lo,Q.hi,-1.15,1.15,{title:titleFor(b,'the normalised W(E): zero at each bound state','normalised W(E)'),xlab:'E',ylab:'sin θ',ny:nyFor(b)});
  P.line(C.Es,C.W,COL.pos,1.8);
  for(const L of Q.levels) dot(ctx,P.X(L),P.Y(0),3.2,COL.ref);
  HIT.push({kind:'xi',b,key:'qE',inv:x=>(x-b.x)/b.w});
  vMark(ctx,b,P.X(Q.E),COL.live,[],1);
}
function drawQmPhase(ctx,W,H,b,Q){
  /* equal scales on both axes, so the unit circle is round (a nearly parallel pair's far corner, up to 2 out, is clipped) */
  const R=1.45, Rx=R*b.w/b.h;
  const P=linPlot(ctx,b,-Rx,Rx,-R,R,{title:titleFor(b,'(ψ, ψ′) at x = ½, each scaled to length 1','(ψ, ψ′) at x = ½'),xlab:'ψ',ylab:'ψ′',ny:nyFor(b)});
  const cx=[], cy=[]; for(let i=0;i<=96;i++){ cx.push(Math.cos(TAU*i/96)); cy.push(Math.sin(TAU*i/96)); }
  P.line(cx,cy,rgba(COL.dim,0.35),1,[2,4]);
  const n1=Math.hypot(Q.vl[0],Q.vl[1]), n2=Math.hypot(Q.vr[0],Q.vr[1]), u1=[Q.vl[0]/n1,Q.vl[1]/n1], u2=[Q.vr[0]/n2,Q.vr[1]/n2];
  const O=[P.X(0),P.Y(0)], V1=[P.X(u1[0]),P.Y(u1[1])], V2=[P.X(u2[0]),P.Y(u2[1])], V3=[V1[0]+V2[0]-O[0],V1[1]+V2[1]-O[1]];
  const poly=clipPolyBox([O,V1,V3,V2],b);
  if(poly.length>2){ ctx.beginPath(); ctx.moveTo(poly[0][0],poly[0][1]); for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]); ctx.closePath();
    ctx.fillStyle=rgba(COL.live,0.22); ctx.fill(); }
  arrowClip(ctx,b,O,V1,COL.y1,1.8); arrowClip(ctx,b,O,V2,COL.y2,1.8);
  lab(ctx,W,H,b.x+8,b.y1-12,'area sin θ = '+sigf(Q.wn,3),'#cd35c4',SM_FONT,'left','middle',PLATE);

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value)); syncChips(); syncPanel(); refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  const logSlider=(key,lab,fmtf)=>slider(key,lab,0,LOGN,1,fmtf,logMap(LIM[key][0],LIM[key][1]));
  const linSlider=(key,step2,lab,fmtf)=>slider(key,lab,LIM[key][0],LIM[key][1],step2,fmtf);
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; syncPanel(); refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
      st[key]=o.id; syncChips(); syncPanel(); refresh(); }})); });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')); }
  const endsAt=x=>ENDS.map(o=>({id:o.id,name:o.name+' at '+x}));
  const f2=v=>fmt(v,2), f3=v=>fmt(v,3), i0=v=>fmt(v,0);

  /* ---- 1. the construction ---- */
  const gB=h('div',{class:'grp'},h('h3',null,'the construction'));
  gB.appendChild(chipRow(EX_BUILD,'bEx'));
  gB.appendChild(chipRow(endsAt(0),'bL')); gB.appendChild(chipRow(endsAt(1),'bR'));
  gB.appendChild(logSlider('bH','the springs’ stiffness h',f2));
  gB.appendChild(logSlider('bKap','κ (the bed, the line)',f2));
  gB.appendChild(linSlider('bK',0.01,'the frequency k (driven, drum)',f2));
  gB.appendChild(linSlider('bM',1,'the mode m (disk, drum)',i0));
  gB.appendChild(linSlider('bEll',1,'the multipole ℓ (ball)',i0));
  gB.appendChild(linSlider('bC',0.1,'the drift c',f2));
  gB.appendChild(linSlider('bXi',0.005,'the load’s point ξ (of the window)',f3));
  const bTag=h('div',{class:'tag'}); gB.appendChild(bTag);

  /* ---- 2. the load ---- */
  const gL=h('div',{class:'grp'},h('h3',null,'the load'));
  gL.appendChild(chipRow(EX_LOAD,'lEx'));
  gL.appendChild(chipRow(endsAt(0),'lL')); gL.appendChild(chipRow(endsAt(1),'lR'));
  gL.appendChild(chipRow(LOADS,'lLoad'));
  gL.appendChild(linSlider('lX0',0.005,'where: x₀',f3));
  gL.appendChild(linSlider('lW',0.005,'width',f3));
  gL.appendChild(linSlider('lN',1,'the sine’s mode n',i0));
  gL.appendChild(logSlider('lH','the springs’ stiffness h',f2));
  gL.appendChild(logSlider('lKap','κ (the bed)',f2));
  gL.appendChild(linSlider('lK',0.01,'the frequency k (driven, drum)',f2));
  gL.appendChild(linSlider('lM',1,'the mode m (drum)',i0));
  gL.appendChild(linSlider('lC',0.1,'the drift c',f2));
  gL.appendChild(h('div',{class:'checks'},checkbox('lPlay','sweep the load in')));
  const lTag=h('div',{class:'tag'}); gL.appendChild(lTag);

  /* ---- 3–6: built by their own parts (PANELS) ---- */
  const extra=PANELS.map(fn=>fn({h,chipRow,slider,logSlider,linSlider,checkbox,rows,st,f2,f3,i0}));

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset();
      syncChips(); syncPanel(); refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),h('div',{class:'src',html:SRC_LINE}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),h('div',{id:'phys'}));
  const groups=[gB,gL,...extra.map(e=>e.g)];
  [...groups,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  /* which sliders each example uses */
  const USES={string:['H'],bed:['Kap'],forced:['K'],line:['Kap'],disk:['M'],ball:['Ell'],drum:['K','M'],drift:['C']};
  function syncPanel(){
    const v=st.view, ids=TABS.map(t=>t[0]);
    groups.forEach((g,i)=>{ g.hidden=v!==ids[i]; });
    for(const [pfx,exKey,keys] of [['b','bEx',['H','Kap','K','M','Ell','C']],['l','lEx',['H','Kap','K','M','C']]]){
      const use=USES[st[exKey]];
      for(const k of keys) if(rows[pfx+k]) rows[pfx+k].inp.disabled=use.indexOf(k)<0||(k==='H'&&st[pfx+'L']!=='spring'&&st[pfx+'R']!=='spring');
    }
    /* the ends' chips only for the string */
    for(const pfx of ['b','l']){ const on=st[pfx+'Ex']==='string';
      for(const [wrapEl,list,key] of CHIPROWS) if(key===pfx+'L'||key===pfx+'R') [].forEach.call(wrapEl.children,b=>{ b.disabled=!on; }); }
    rows.lX0.inp.disabled=['uniform','sine','ramp'].indexOf(st.lLoad)>=0;
    rows.lW.inp.disabled=['patch','gauss'].indexOf(st.lLoad)<0;
    rows.lN.inp.disabled=st.lLoad!=='sine';
    for(const e of extra) if(e.sync) e.sync();
    for(const k in rows) rows[k].sync();
    bTag.innerHTML='press the plot to move ξ; the dashed curves are y₁’s and y₂’s branches carried past ξ';
    lTag.innerHTML='the sweep adds the load in from the left over five seconds';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space starts or stops the motion';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='build'?'press the plot to move ξ · 1–6 switch views':CLOCK[v]?'space stops the motion · 1–6 switch views':'1–6 switch views';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ syncChips(); syncPanel(); refresh(); }
  });

  const CLOCK={load:'lPlay',abel:'aPlay',time:'tPlay'};
  window.addEventListener('keydown',e=>{
    const tg=e.target&&e.target.tagName;
    if(e.key===' '&&!(tg==='INPUT'&&e.target.type==='range')){ e.preventDefault(); const k=CLOCK[st.view]; if(k) st[k]=!st[k]; syncPanel(); refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); refresh(); });

  /* every change repaints at once (refresh); the frame loop repaints only a view that moves, and the impulse's readout
     with it (it reads the cursor) */
  function frameLoop(){
    if(S.step()){ try{ S.draw(); if(st.view==='time') roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* ---- the prose: every number in it is computed here and pinned in selfTest ---- */
const SRC_LINE='NIST DLMF, Version 1.2.8 (2026-09-15): the Wronskian (1.13.4), Abel’s identity (1.13.5), variation of parameters (1.13.10), and the Wronskians of the Airy (9.2.7), Bessel (10.5.2), parabolic-cylinder (12.2.11) and Legendre (14.2.3, 14.2.4) functions. Everything else on the page is exact mathematics: build_green/derive.py re-derives every closed form in sympy and computes every reference value in mpmath, and selfTest pins the page to it.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const INFO={}, DERIV={};
INFO.build='A <b>Green’s function</b> is the response to a single point of load: G(x, ξ) solves L G = δ(x − ξ) with the problem’s end conditions, and then u = ∫ G f dξ solves L u = f for any load at all. For a second-order problem it can be built from two ordinary solutions. Away from ξ the load is zero, so G solves L y = 0 there: left of ξ it must be a solution that meets the left end (y₁), right of ξ one that meets the right end (y₂). Two conditions glue them: G is continuous at ξ, and its slope drops there by exactly 1/p(ξ), because integrating −(pG′)′ + qG = δ across the point leaves −p[G′] = 1. Solving those two conditions gives G = −y₁(x<) y₂(x>)/pW, with W the <b>Wronskian</b> y₁y₂′ − y₁′y₂. Abel showed that pW never changes along x, so one number sets the whole scale. The same recipe covers a tent-shaped string, the sinh curves of a string on an elastic bed, the sines of a driven string, the screened potential exp(−κ|x − ξ|)/(2κ), a disk’s and a ball’s radial modes (the last is a term of the multipole expansion of 1/|r − r′|), and a drum’s Bessel modes. It fails exactly when W = 0: when one solution meets both ends, as a constant does when both ends of the string are free.';
INFO.abel='The Green’s function divides by pW, so everything hangs on the Wronskian, and Abel’s identity says what it does without solving anything. Write the equation as y″ + f y′ + g y = 0; then W′ = −f W, so W(x) = W(x₀) exp(−∫f). Geometrically, each solution is a moving point (y, y′) in the phase plane, and W is the area of the parallelogram the two points span with the origin. The first-derivative term is the only thing that can change that area: friction drains it as exp(−2γt) while both vectors spiral in, Bessel’s y′/x makes it fall as 1/x, Legendre’s −2x y′/(1 − x²) makes it grow toward the ends, and Airy’s equation, with no first-derivative term at all, keeps it at exactly 1/π while the vectors stretch and swing. The area is zero exactly when the vectors are parallel, that is when one solution is a multiple of the other: slide the mixing slider toward 90° and the parallelogram flattens.';
DERIV.abel='<h4>Abel</h4>'
  +EQ(1,'W = y<sub>1</sub>y<sub>2</sub>′ − y<sub>1</sub>′y<sub>2</sub>, &nbsp; W′ = y<sub>1</sub>y<sub>2</sub>″ − y<sub>1</sub>″y<sub>2</sub> = −f W')
  +'<p>The g terms cancel, which is why W can be known without the solutions (DLMF 1.13.5). In (y, py′) form (the construction’s), the flow is area-preserving and pW is the constant.</p>'
  +'<h4>the pairs</h4>'
  +'<p>The damped oscillator y″ + 2γy′ + y = 0 from (1, −γ) and (0, 1): W = exp(−2γt). Bessel J₀ and Y₀ from mpmath’s values at x = ½: W = 2/(πx) (DLMF 10.5.2). Ferrers’ Pᵥ, Qᵥ for ν = 0, 1, 2 (elementary: Q₀ = artanh x): W = 1/(1 − x²) (DLMF 14.2.4). Airy Ai, Bi from mpmath’s values at 0: W = 1/π (DLMF 9.2.7). Euler–Cauchy x²y″ + αxy′ + (4 + σ²)y = 0, σ = (1 − α)/2, from xˢ cos(2 ln x) and xˢ sin(2 ln x): W = 2x⁻ᵅ. Each pair is integrated by Dormand–Prince from its start; the area is measured and set against the formula.</p>';
INFO.res='The Green’s function divides by p W, and p W can be zero. Drive a string at frequency k: the solution from the left end is sin kx and from the right sin k(1 − x), and p W = −k sin k vanishes whenever k = nπ, exactly when sin kx meets the right end as well. There the string has a mode of its own at the driving frequency, no steady response exists, and G grows without bound as k approaches it: resonance. That is the Fredholm alternative, and it is the same for a drum, whose modes the page finds as the zeros of its own p W(k), the zeros of Jₘ. Near a zero one term of the eigenfunction expansion, G = Σ φₙ(x)φₙ(ξ)/(kₙ² − k²), outweighs all the others; far from every zero the series needs many terms to find the kink at ξ. The response at the load’s own point, G(ξ, ξ; k), has a pole at each eigenvalue and changes sign through it, the phase flip every driven oscillator shows.';
DERIV.res='<h4>the Wronskian of the spectral parameter</h4>'
  +EQ(1,'p W(k) = y<sub>1</sub>(1; k) z<sub>2</sub>(1), &nbsp; y<sub>2</sub>(1) = 0')
  +'<p>Starting y<sub>2</sub> at the far end with y<sub>2</sub> = 0 makes p W the value y<sub>1</sub> reaches there, times a constant: z<sub>2</sub>(1) = −k for the string, −2/π for the drum (DLMF 10.5.2, which is what lets the drum’s y<sub>2</sub> start without a Bessel function). The zeros are found by a scan and Illinois’ method; beyond k = 15 each is bracketed about the last one + π.</p>'
  +'<h4>the eigenfunction series</h4>'
  +EQ(2,'G(x, ξ; k) = Σ<sub>n</sub> '+FR('φ<sub>n</sub>(x) φ<sub>n</sub>(ξ)','k<sub>n</sub>² − k²')+', &nbsp; ∫ w φ<sub>n</sub>φ<sub>m</sub> = δ<sub>nm</sub>')
  +'<p>φ<sub>n</sub> is the page’s own y<sub>1</sub> at k<sub>n</sub>, normalised with the weight w (1 for the string, r for the drum) by integrating ∫ w y<sub>1</sub>² as a third component of the same equations (below the drum’s r₀ the sliver r₀² y<sub>1</sub>(r₀)²/(2m + 2) is added). The string’s series is 2 sin nπx sin nπξ/((nπ)² − k²); the drum’s is its Bessel analogue with φ<sub>n</sub> = √2 Jₘ(k<sub>n</sub>r)/|Jₘ₊₁(k<sub>n</sub>)|.</p>';
INFO.load='Because L is linear, a spread-out load is a sum of point loads, and its response is the same sum of Green’s functions: u(x) = ∫ G(x, ξ) f(ξ) dξ. The sweep adds the load in from the left, one slice at a time, and the curve builds up to the final shape. Splitting G into its two branches turns the integral into two running integrals, ∫ y₁f/pW from the left end and ∫ y₂f/pW from the right, so u comes out everywhere in one pass. A finite-difference solve that never forms G lands on the same curve, to its own h² error. The lower right shows Maxwell and Betti’s reciprocity: the deflection at x₀ under a load at x equals the deflection at x under the same load at x₀. It holds because L is self-adjoint and G(x, ξ) = G(ξ, x). With drift, −u″ + cu′, it is not, and the two curves part by exactly exp(c(x − ξ)).';
DERIV.build='<h4>two solutions, glued</h4>'
  +EQ(1,'G(x, ξ) = A y<sub>1</sub>(x) for x &lt; ξ, &nbsp; B y<sub>2</sub>(x) for x &gt; ξ')
  +'<p>Each side solves L y = 0 and meets its own end. Continuity at ξ gives A y<sub>1</sub>(ξ) = B y<sub>2</sub>(ξ). Integrating −(pG′)′ + qG = δ(x − ξ) from ξ − 0 to ξ + 0 gives −p(ξ)[G′] = 1, so B y<sub>2</sub>′(ξ) − A y<sub>1</sub>′(ξ) = −1/p(ξ).</p>'
  +EQ(2,'A = −'+FR('y<sub>2</sub>(ξ)','pW')+', &nbsp; B = −'+FR('y<sub>1</sub>(ξ)','pW')+', &nbsp; W = y<sub>1</sub>y<sub>2</sub>′ − y<sub>1</sub>′y<sub>2</sub> (DLMF 1.13.4)')
  +'<h4>Abel</h4>'
  +EQ(3,'(pW)′ = y<sub>1</sub>(py<sub>2</sub>′)′ − y<sub>2</sub>(py<sub>1</sub>′)′ = y<sub>1</sub>qy<sub>2</sub> − y<sub>2</sub>qy<sub>1</sub> = 0')
  +'<p>So pW is one number for the whole interval (DLMF 1.13.5, with f = p′/p), and G(x, ξ) = −y<sub>1</sub>(x<sub>&lt;</sub>)y<sub>2</sub>(x<sub>&gt;</sub>)/pW is symmetric in x and ξ. The page integrates (y, py′) with Dormand–Prince 5(4), whose flow keeps y<sub>1</sub>z<sub>2</sub> − z<sub>1</sub>y<sub>2</sub> to the solver’s tolerance; the readout’s spread is that check.</p>'
  +'<h4>when it fails</h4>'
  +'<p>W = 0 exactly when y<sub>1</sub> and y<sub>2</sub> are the same solution: a nonzero y meets both ends, so L y = 0 has a solution and L u = f can be solved only when ∫ y f = 0 (the Fredholm alternative). Free–free ends do it with y = 1; the driven string does it at k = nπ, and the drum at the zeros of J<sub>m</sub>.</p>';
DERIV.load='<h4>superposition</h4>'
  +EQ(1,'u(x) = −y<sub>2</sub>(x) ∫<sub>a</sub><sup>x</sup> '+FR('y<sub>1</sub>f','pW')+' dξ − y<sub>1</sub>(x) ∫<sub>x</sub><sup>b</sup> '+FR('y<sub>2</sub>f','pW')+' dξ')
  +'<p>The two running integrals are fourth-order Simpson sums on a grid that has the load’s edges as nodes; a point load is G itself. At a singular end (the drum’s centre) the integration starts at r₀ = 10⁻⁴, and the sliver below it is added for y₁ ∝ rˢ.</p>'
  +'<h4>the direct check</h4>'
  +'<p>−(pu′)′ + qu = f in flux form on 2000 cells, the load taken as its average over each cell (so a patch’s edge keeps the scheme second order), the same end conditions (a spring’s end is a half cell with the flux hu), solved by the Thomas algorithm.</p>'
  +'<h4>reciprocity</h4>'
  +EQ(2,'G(x, ξ) = G(ξ, x) &nbsp;⟺&nbsp; L self-adjoint')
  +'<p>For −u″ + cu′ the integrating factor exp(−cx) makes −(exp(−cx)u′)′ self-adjoint, so G(x, ξ) exp(cξ) is symmetric and G(x, ξ)/G(ξ, x) = exp(c(x − ξ)).</p>';
INFO.time='Time has a Green’s function too, and causality picks it. A damped oscillator x″ + 2γx′ + x = f(t) sits at rest; a sharp kick at τ changes its velocity by one and leaves its position alone, and after that it moves freely. That motion is G(t, τ): zero before τ, and after τ the free solution that starts at x = 0 with x′ = 1. Built from any two free solutions y₁, y₂ it is [y₁(τ)y₂(t) − y₁(t)y₂(τ)]/W(τ), and the Wronskian W(τ) = W(0) exp(−2γτ) is exactly what makes it depend on t − τ alone: a kick at noon does what a kick at midnight does, twelve hours later. Any force is a sequence of kicks f(τ)dτ, so x(t) = ∫ G(t, τ) f(τ) dτ, Duhamel’s principle. The lower left shows it happening: at the cursor the response is the area under G(t, τ) f(τ), the force weighted by how well the oscillator still remembers it. Below γ = 1 the memory rings, at γ = 1 it fades fastest without ringing, and above it creeps. A train of kicks one swing apart puts every copy of G in step, and the response climbs.';
DERIV.time='<h4>variation of parameters</h4>'
  +EQ(1,'x(t) = y<sub>2</sub>(t) ∫<sub>0</sub><sup>t</sup> '+FR('y<sub>1</sub>f','W')+' dτ − y<sub>1</sub>(t) ∫<sub>0</sub><sup>t</sup> '+FR('y<sub>2</sub>f','W')+' dτ &nbsp; (DLMF 1.13.10)')
  +'<p>Differentiating, the terms from the integrals’ upper limits cancel in x′ and add up to f in x″, so x solves the forced equation from rest. Folding the two integrals into one gives G:</p>'
  +EQ(2,'G(t, τ) = '+FR('y<sub>1</sub>(τ)y<sub>2</sub>(t) − y<sub>1</sub>(t)y<sub>2</sub>(τ)','W(τ)')+' for t &gt; τ, &nbsp; 0 for t &lt; τ')
  +'<p>G(τ, τ) = 0 and ∂G/∂t = 1 at t = τ: a unit kick. With y<sub>1,2</sub> = exp(−γt)(cos, sin)(ω<sub>d</sub>t), ω<sub>d</sub> = √(1 − γ²), W = ω<sub>d</sub> exp(−2γt) and G = exp(−γs) sin(ω<sub>d</sub>s)/ω<sub>d</sub>, s = t − τ. At γ = 1 it is s exp(−s); above, exp(−γs) sinh(Ωs)/Ω with Ω = √(γ² − 1).</p>'
  +'<h4>which pair</h4>'
  +'<p>Any pair gives the same G, but not the same rounding. The page takes the modal pair, each solution with a single growth rate (when overdamped exp(−(γ ∓ Ω)t)), so neither term in [1] is much larger than x itself. A pair mixing the two rates would subtract terms exp(2Ωt) times larger than their difference.</p>'
  +'<h4>the checks</h4>'
  +'<p>The two integrals are 6-point Gauss–Legendre sums on 800 steps whose ends include every jump of the force; each kick adds its size times y<sub>2</sub>/W and y<sub>1</sub>/W. The direct integration solves x″ + 2γx′ + x = f with Dormand–Prince piece by piece, each kick a jump in x′, and never forms G. The memory’s area is the convolution ∫ G(t − τ) f(τ) dτ at the cursor, a third route.</p>';
INFO.qm='In quantum mechanics the same construction finds the bound states. For −ψ″ + Vψ = Eψ at an energy E below the continuum, one solution ψ₁ decays to the left and another ψ₂ to the right, and the Green’s function of −d²/dx² + V − E is −ψ₁(x<)ψ₂(x>)/W, glued at x′ with the kink the δ demands. It exists unless W = 0, and W = 0 means the two decaying solutions are one: a wavefunction that decays both ways, a bound state. So the levels are the zeros of W(E), and near one G is dominated by ψₙ(x)ψₙ(x′)/(Eₙ − E), exactly as the driven string near its resonances. Normalised, W is the sine of the angle between the two phase vectors (ψ, ψ′), the parallelogram of the Abel view once more: at a level they line up. For the oscillator the DLMF gives W ∝ 1/Γ(½ − E/2), whose zeros are 2n + 1, and for Pöschl–Teller 1/Γ(κ − λ), whose zeros are −(λ − n)²; the page finds them by integration and never uses either. A double well’s levels come in pairs split by tunnelling, and a δ well holds exactly one.';
DERIV.qm='<h4>the construction</h4>'
  +EQ(1,'(−d²/dx² + V − E) G = δ(x − x′), &nbsp; G = −'+FR('ψ<sub>1</sub>(x<sub>&lt;</sub>) ψ<sub>2</sub>(x<sub>&gt;</sub>)','W')+', &nbsp; W = ψ<sub>1</sub>ψ<sub>2</sub>′ − ψ<sub>1</sub>′ψ<sub>2</sub>')
  +'<p>p = 1 and there is no first-derivative term, so W is one number (the readout’s spread checks it). Below the potential’s far value, ψ₁ is started at −X as the decaying exponential (1, κ) and integrated right, ψ₂ at +X as (1, −κ) and integrated left: each grows in the direction it is integrated, so errors in the start die away. The oscillator starts at ±8 with the WKB slope ψ′/ψ = ±κ − κ′/(2κ), Pöschl–Teller at ±20 where its tail is below the rounding.</p>'
  +'<h4>the levels</h4>'
  +EQ(2,'ψ<sub>2</sub>(x) = ψ<sub>1</sub>(−x) &nbsp;⟹&nbsp; W = −ψ<sub>1</sub>(0) [ψ<sub>1</sub>′(0<sup>−</sup>) + ψ<sub>1</sub>′(0<sup>+</sup>)]')
  +'<p>For an even potential W factors: odd states have ψ(0) = 0, even states a slope that averages to zero across 0 (a δ of strength α bends it by −αψ(0)). The page finds the zeros of each factor separately, so a double well’s nearly equal pair, one of each parity, is never lost between two points of the scan.</p>'
  +'<h4>the closed forms it is checked against</h4>'
  +'<p>The oscillator V = x²: ψ₂ = U(−E/2, √2 x), ψ₁ = U(−E/2, −√2 x), W ∝ 1/Γ(½ − E/2) (DLMF 12.2.11). Pöschl–Teller V = −λ(λ + 1) sech²x: ψ₂ = P<sub>λ</sub><sup>−κ</sup>(tanh x), and W ∝ 1/(Γ(κ − λ)Γ(λ + κ + 1)) (DLMF 14.2.3). The square and double wells by exact transfer matrices, the square well also by k tan ka = κ and −k cot ka = κ. The δ well: E = −α²/4.</p>';


/* ================================================================== *
 *  selfTest — headless verification.  REF is build_cg/refvals.json,   *
 *  the printed output of derive.py (sympy, numpy, mpmath), read in    *
 *  full.  makeShot: the recording context (build_aa lineage).          *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null, path=[], cur=null;       /* a stroke keeps its path, in canvas pixels */
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:''+ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle,paths:path.map(p=>p.slice())}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest — headless verification.  REF is build_green/refvals.json,*
 *  the printed output of derive.py (sympy, mpmath: every closed form   *
 *  checked there symbolically, every value by a second route).         *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol*Math.max(Math.abs(b),1e-300),name+' ['+a+' vs '+b+', rel '+(Math.abs(a/b-1)).toExponential(2)+']');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){ Object.assign(ST,DEFAULTS,over); simReset(); if(over.t!==undefined) SIM.t=over.t;
    for(const k in MEMO) delete MEMO[k];
    try{ return fn(); } finally{ Object.assign(ST,stSave); simReset(); for(const k in MEMO) delete MEMO[k]; } }
  const PDEF={L:'fixed',R:'fixed',h:2.5,kappa:3,k:4,m:0,l:2,c:3};

  /* ---------- 0. the shared helpers ---------- */
  ok(plain('&Delta;V &omega; &#955; R&#8321; &frac58;')==='ΔV ω λ R₁ &frac58;','plain() decodes named and numeric entities and passes unknown ones through for the audit');
  ok(ticksFor(0.8,0.2,5).length===1&&ticksFor(0.2,0.8,5).length>=3,'axes() range-sort is what rescues an inverted axis');
  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }
  eq(fmt(-1.5,2),'−1.50','fmt prints a true minus'); eq(fmt(-0.0001,3),'0.000','and a negative that rounds to zero as zero');
  eq(sigf(-2.5e-5,2),'−2.5 × 10⁻⁵','sigf: the mantissa’s minus, the exponent’s superscript'); eq(sigf(-0.0123,3),'−0.0123','sigf in fixed point');
  for(const [lo,hi,want] of [[0,2.5,5],[-1.5,1.5,4],[0,14,5]]){ const t=ticksFor(lo,hi,want), lab=t.map(decFmt(lo,hi,want));
    ok(lab.every((s,i)=>Math.abs(parseFloat(s.replace('−','-'))-t[i])<1e-9),'ticks on ['+lo+', '+hi+'] read back as their values ['+lab.join(', ')+']');
    ok(new Set(lab.filter(s=>s!=='0').map(s=>(s.split('.')[1]||'').length)).size===1,'and share one number of decimals'); }
  eq(sigf(1.768e8,4),'1.768 × 10⁸','sigf writes a power of ten in superscripts'); eq(pow10(-3),'10⁻³','pow10');
  eq(tickFmt(-2),'−2','a tick label: a true minus, no trailing zeros'); eq(tickFmt(0.30000000000000004),'0.3','and no float noise');
  { const s=simpsonCum([0,0.5,1,1.5,2],[0,0.125,1,3.375,8]); rel(s[4],4,1e-15,'Simpson integrates x³ exactly'); }
  { const s=simpsonCum([0,0.5,1,1.5,2],[0,0.25,1,2.25,4]); rel(s[1],0.5*0.5*0.5/3,1e-14,'its half step integrates x² exactly'); rel(s[3],1.125,1e-14,'at every odd node'); }
  { const s=simpsonCum([0,0.5,1,1.5],[0,0.25,1,2.25]); rel(s[3],1.125,1e-15,'an even count: the last half step by a quadratic'); }
  { const r=dopri((t,Y)=>[Y[1],-Y[0]],0,[0,1],[1,2.5,7]); rel(r[1][0],Math.sin(2.5),1e-10,'Dormand–Prince: sin at 2.5'); rel(r[2][1],Math.cos(7),1e-10,'and cos at 7');
    const b=dopri((t,Y)=>[Y[1],-Y[0]],7,[Math.sin(7),Math.cos(7)],[3,0]); close(b[1][0],0,1e-10,'backwards to 0'); }
  { const s=besselJSeries(2,1e-3); rel(s.J,1.2499998958333725e-7,1e-12,'J₂(10⁻³) by its series'); }

  /* ---------- 1. the construction: the engine against the closed forms and the twin ---------- */
  for(const id of ['string','bed','forced','line','disk','ball','drift']) for(const P of [PDEF,Object.assign({},PDEF,{L:'spring',R:'free',m:3,l:4,kappa:0.7,k:9.1,c:-3})]){
    const ex=EXS[id], xs=exGrid(ex,120), S=exSolve(ex,P,xs); let w=0;
    for(let i=0;i<xs.length;i+=3){ const c=ex.closed(xs[i],P); for(const [a,b] of [[S.y1[i],c.y1],[S.y2[i],c.y2],[S.z1[i],c.z1],[S.z2[i],c.z2]]) w=Math.max(w,Math.abs(a-b)/Math.max(Math.abs(b),1e-12)); }
    ok(w<2e-10,id+(P===PDEF?'':' (other)')+': the integrated y₁, y₂ are the closed forms ['+w.toExponential(2)+']');
    if(ex.sa){ let lo=Infinity,hi=-Infinity; for(const v of S.pW){ lo=Math.min(lo,v); hi=Math.max(hi,v); } ok((hi-lo)/Math.abs(S.pW[0])<1e-10,id+': pW is one number along x (Abel)'); }
  }
  for(const [id,pars,x,xi,g] of REF.build.G){
    const ex=EXS[id], P=Object.assign({},PDEF,pars), lo=ex.lo===0&&ex.p(0)===0?R0:ex.lo;
    const xs=[...new Set([x,xi].map(v=>Math.max(v,lo)))].sort((a,b)=>a-b), S=exSolve(ex,P,xs);
    const ix=xs.indexOf(Math.max(x,lo)), is=xs.indexOf(Math.max(xi,lo));
    rel(greenFrom(S.y1[ix],S.y2[ix],S.y1[is],S.y2[is],S.pW[is],x<=xi),g,1e-10,'G '+id+' '+JSON.stringify(pars)+' at ('+x+', '+xi+'): integrated, against the twin');
    const gc=greenClosed(ex,P,x,xi); if(gc!==null) rel(gc,g,1e-12,'and its closed form');
  }
  withState({view:'build'},()=>{ const B=buildModel().B;
    rel(B.Gxx,0.4*0.6,1e-12,'the default string: G(ξ, ξ) = ξ(1 − ξ) at ξ = 0.4'); rel(B.jump,-1,1e-12,'the slope drops by 1/p = 1 at ξ');
    rel(B.pWs,-1,1e-12,'pW = −1 for y₁ = x, y₂ = 1 − x'); ok(B.sym<1e-14,'G(x, ξ) = G(ξ, x)'); ok(B.closedDiff<1e-13,'the closed form agrees'); ok(!B.deg,'not degenerate'); });
  withState({view:'build',bL:'free',bR:'free'},()=>{ ok(buildModel().B.deg,'free–free: W = 0, no Green’s function'); });
  withState({view:'build',bL:'free',bR:'fixed',bXi:0.3},()=>{ const B=buildModel().B; ok(!B.deg,'free–fixed has one'); rel(B.Gxx,0.7,1e-12,'G(ξ, ξ) = 1 − ξ for free–fixed'); });
  for(const [id,over] of [['bed',{bKap:17}],['forced',{bK:9.1}],['disk',{bM:3}],['ball',{bEll:4}],['drum',{bM:2,bK:8.9}],['line',{bKap:0.5}]])
    withState(Object.assign({view:'build',bEx:id,bXi:0.37},over),()=>{ const B=buildModel().B;
      rel(B.jump,B.jumpWant,1e-9,id+': the slope’s jump is −1/p(ξ)'); ok(B.sym<1e-9,id+': symmetric'); ok(B.pWspread<1e-9,id+': pW constant'); });
  withState({view:'build',bEx:'drift',bC:6,bXi:0.44},()=>{ const B=buildModel().B;
    rel(B.jump,-1,1e-9,'drift: the slope jumps by −1'); ok(B.sym<1e-9,'drift: G(x, ξ)/G(ξ, x) = exp(c(x − ξ))'); rel(B.wRatio,Math.exp(6),1e-9,'drift: W(1)/W(0) = exp(c) (Abel)'); });
  withState({view:'build',bEx:'drum',bM:0,bK:4.2},()=>{ const B=buildModel().B; rel(B.pWs,-2*REF.build.J0_4p2/PI,1e-10,'the drum’s pW = −2J₀(k)/π without any Bessel function (J₀(4.2) from the twin)'); });

  /* ---------- 2. the load ---------- */
  for(const [id,pars,kind,x0,w,n,XS,vals] of REF.load.u){
    const ex=EXS[id], P=Object.assign({},PDEF,pars), L=loadFn(kind,x0,w,n), R=loadSolve(ex,P,L,XS);
    let worst=0; XS.forEach((X,j)=>{ const i=R.xs.indexOf(X); worst=Math.max(worst,Math.abs(R.u[i]-vals[j])/Math.max(Math.abs(vals[j]),1e-3)); });
    ok(worst<2e-8,'u = ∫ G f for '+kind+' on '+id+' '+JSON.stringify(pars)+' (x₀ '+x0+'): against the twin ['+worst.toExponential(2)+']');
  }
  withState({view:'load'},()=>{ const Lv=buildModel().L;
    ok(Lv.fdDiff<5e-5,'the default: ∫ G f and the finite differences agree ['+Lv.fdDiff.toExponential(2)+']'); ok(Lv.recip<1e-12,'reciprocity for the string');
    rel(Lv.total,1,1e-12,'the patch carries unit force'); });
  withState({view:'load',lEx:'drift'},()=>{ const Lv=buildModel().L; ok(Lv.recip>0.1,'drift: reciprocity fails ['+Lv.recip.toFixed(3)+']'); });
  withState({view:'load',lL:'free',lR:'free'},()=>{ ok(buildModel().L.deg,'free–free: no response to compute'); });
  withState({view:'load',lLoad:'point',lPlay:true,t:0.5},()=>{ const Lv=buildModel().L; eq(Lv.R.point,true,'a point load is G itself'); });
  /* the finite-difference check for every example and load, the ends and parameters varied: its worst, 2.5e-5, is the
     scheme's own error at its first node beside the drum's axis (m = 1); before the graded cuts the drum at m = 3 read
     8e-2, a spike of Simpson's half step beside the axis */
  for(const e of EX_LOAD) for(const o of LOADS){
    const vs=e.id==='drum'?[{lM:0},{lM:1},{lM:3}]:e.id==='drift'?[{lC:3},{lC:-6}]:e.id==='string'?[{},{lL:'spring',lR:'free'},{lL:'free',lR:'spring',lH:9}]:[{}];
    for(const v of vs) withState(Object.assign({view:'load',lEx:e.id,lLoad:o.id,lPlay:false},v),()=>{ const Lv=buildModel().L;
      ok(Lv.fdDiff<4e-5,e.id+' '+JSON.stringify(v)+' with '+o.id+': ∫ G f and the finite differences agree ['+Lv.fdDiff.toExponential(2)+']'); }); }
  /* the swept-in partial response against the same load truncated at s and solved whole */
  /* (the sweep cuts the load at the last node at or below s: s is taken on the grid) */
  for(const [id,s0] of [['string',0.4],['drum',0.62],['drift',0.3]]) withState({view:'load',lEx:id,lLoad:'gauss',lX0:0.5,lW:0.1,lPlay:false},()=>{ const Lv=buildModel().L;
    const s=Lv.R.xs.reduce((u,v)=>Math.abs(v-s0)<Math.abs(u-s0)?v:u), part=loadPartial(Lv.R,s);
    const Lc=Object.assign({},Lv.L,{f:t=>t<s?Lv.L.f(t):0,bps:Lv.L.bps.concat([s])}), Rc=loadSolve(Lv.ex,Lv.P,Lc,[ST.lX0]);
    let e=0; for(let i=0;i<Rc.xs.length;i++){ const j=Lv.R.xs.indexOf(Rc.xs[i]); if(j>=0) e=Math.max(e,Math.abs(part[j]-Rc.u[i])); }
    ok(e<1e-9*Lv.uMax,id+': the sweep’s partial response at s = '+s+' is the truncated load’s ['+(e/Lv.uMax).toExponential(1)+']'); });
  withState({view:'load',t:3},()=>{ close(sweepS(ST,EXS.string),0.6,1e-12,'the sweep: 3 s into its 6 s cycle the load is in up to 0.6 (in over 5 s)'); });
  withState({view:'load',t:5.5},()=>{ close(sweepS(ST,EXS.string),1,0,'and held whole for the last second'); });
  /* x₀ must be a node of the grid exactly: at these x₀ the segment's last node cuts[s] + L·m/m misses the cut by an ulp */
  for(const x0 of [0.06,0.085,0.12,0.18]) withState({view:'load',lLoad:'point',lX0:x0,lPlay:false},()=>{ const Lv=buildModel().L;
    ok(Lv.i0>=0,'a point load at x₀ = '+x0+' is a node of the grid'); rel(Lv.u0,x0*(1-x0),1e-9,'and u(x₀) = G(x₀, x₀) = x₀(1 − x₀)'); });

  /* ---------- 3. Abel's identity ---------- */
  for(const row of REF.abel.vals){ const [id,x,v1,v2,par]=row, A=ABEL[id], st=Object.assign({},DEFAULTS,{aEx:id,aMix:0});
    if(id==='damped') st.aG=par; if(id==='euler') st.aAl=par;
    const n=600, xs0=[]; for(let i=0;i<=n;i++) xs0.push(A.lo+(A.hi-A.lo)*i/n);
    const S=abelSolve(A,st,n); let j=0; while(j<S.xs.length-2&&S.xs[j+1]<x) j++;
    /* the grid need not hold x: take the solution there by integrating from the nearest grid point */
    const rhs=(t,Y)=>{ const f=A.f(t,st), g=A.g(t,st); return [Y[1],-f*Y[1]-g*Y[0],Y[3],-f*Y[3]-g*Y[2]]; };
    const Y=dopri(rhs,S.xs[j],[S.y1[j],S.d1[j],S.y2[j],S.d2[j]],[x])[0];
    rel(Y[0],v1,2e-9,'Abel '+id+(par!==undefined?' ('+par+')':'')+': y₁('+x+') against the twin'); rel(Y[2],v2,2e-9,'and y₂('+x+')'); }
  for(const id of ['damped','bessel','legendre','airy','euler']) for(const mix of [0,60]) withState({view:'abel',aEx:id,aMix:mix,aNu:2,aAl:3.2,aG:0.4},()=>{ const A=buildModel().A;
    ok(A.spread<1e-9,'Abel '+id+' (mixed '+mix+'°): the area follows W(x₀) exp(−∫f) everywhere ['+A.spread.toExponential(2)+']');
    rel(A.W[A.xs.indexOf(A.ex.x0)],Math.cos(mix*PI/180)*A.ex.W(A.ex.x0,ST),1e-12,'and starts at its W(x₀)'); });
  withState({view:'abel',aEx:'bessel'},()=>{ const A=buildModel().A, i=A.xs.length-1; rel(A.W[i]*A.xs[i]*PI/2,1,1e-9,'x W{J₀, Y₀} = 2/π at x = 20 (DLMF 10.5.2)'); });
  withState({view:'abel',aEx:'airy'},()=>{ const A=buildModel().A; rel(A.W[0],1/PI,1e-9,'W{Ai, Bi} = 1/π at x = −10 (DLMF 9.2.7)'); });
  withState({view:'abel',aEx:'legendre',aNu:1},()=>{ const A=buildModel().A; rel(A.W[0]*(1-0.95*0.95),1,1e-9,'(1 − x²) W{P₁, Q₁} = 1 at x = −0.95 (DLMF 14.2.4)'); });
  withState({view:'abel',aMix:89},()=>{ const A=buildModel().A; rel(A.cos,Math.cos(89*PI/180),1e-15,'mixing 89°: cos θ'); ok(Math.abs(A.W[0])<0.02,'and the area nearly zero'); });

    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
