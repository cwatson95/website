function drawLadderSchematic(ctx,b,D){
  const N=D.N, x0=b.x+14, yt=b.y+30, yb=b.y1-12, xrs=x0+Math.max(46,b.w*0.08), xend=b.x1-40;
  sSource(ctx,x0,yt,yb,0.85);
  const pr=sPart(ctx,'R',x0,yt,xrs,yt,COL.Rs,0.7); partLabel(ctx,pr,'Rₛ '+ohm(D.Rs,3),COL.Rs,-1);
  const slot=(xend-xrs)/N;
  for(let i=0;i<N;i++){
    const e=D.el[i], xa=xrs+i*slot, xb=xa+slot, xm=(xa+xb)/2;
    if(e.kind==='shunt'){
      sWire(ctx,[[xa,yt],[xb,yt]]);
      const arm=sArm(ctx,['L','C'],'par',xm,yt,xm,yb,0.62);
      sDot(ctx,xm,yt); sDot(ctx,xm,yb);
      lab(ctx,W_STAGE,H_STAGE,xm+15,yt+13,henry(e.L,3),COL.L,SM_FONT,'left','middle',PLATE);
      lab(ctx,W_STAGE,H_STAGE,xm-15,yb-13,farad(e.C,3),COL.C,SM_FONT,'right','middle',PLATE);
    } else {
      const xl=xa+slot*0.08, xr=xb-slot*0.08, xmid=(xl+xr)/2;
      sWire(ctx,[[xa,yt],[xl,yt]]); sWire(ctx,[[xr,yt],[xb,yt]]);
      sPart(ctx,'L',xl,yt,xmid,yt,COL.L,0.62); sPart(ctx,'C',xmid,yt,xr,yt,COL.C,0.62);
      lab(ctx,W_STAGE,H_STAGE,(xl+xmid)/2,yt-11,henry(e.L,3),COL.L,SM_FONT,'center','bottom',PLATE);
      lab(ctx,W_STAGE,H_STAGE,(xmid+xr)/2,yt+12,farad(e.C,3),COL.C,SM_FONT,'center','top',PLATE);
    }
  }
  sWire(ctx,[[xrs,yb],[xend,yb]]); sWire(ctx,[[x0,yb],[xrs,yb]]);
  const pl=sPart(ctx,'R',xend+18,yt,xend+18,yb,COL.Rs,0.7);
  sWire(ctx,[[xend,yt],[xend+18,yt]]); sWire(ctx,[[xend,yb],[xend+18,yb]]);
  lab(ctx,W_STAGE,H_STAGE,xend+14,yb+4,'R(L) '+ohm(D.RL,3),COL.Rs,SM_FONT,'right','top',PLATE);
  return pl;
}
function drawLadder(ctx,W,H,M){
  const Lm=M.L, D=Lm.D;

  const capShort='The band-pass ladder: |S21|² bold, |S11|² rose, the design edges dashed.';
  const Lb=stageBox(ctx,W,H,capFull,capShort,stageTop()+30+250);
  const b=Lb.main;
  const [schB,rest0]=splitV(b,b.h>420?0.3:0.34,30);
  const rest=box(rest0.x,rest0.y+18,rest0.w,rest0.h-18);

  lab(ctx,W,H,schB.x,schB.y+6,kindName(D.kind,D.LAr)+', N = '+D.N+' ('+(D.first==='shunt'?'a tank first':'a series arm first')+')',COL.text,'italic 12.5px Georgia, serif','left','middle');
  const [mB,tB]=splitH(rest,rest.w>520?0.6:0.55,58);
  const flo=Lm.xs[0]*D.f0, fhi=Lm.xs[Lm.xs.length-1]*D.f0, fs=Lm.xs.map(x=>x*D.f0);
  const mB2=box(mB.x,mB.y+14,mB.w,mB.h-14);
  const m=fPlot(ctx,mB2,flo,fhi,-60,3,{yticks:mB2.h<220?[-60,-40,-20,0]:[-60,-40,-20,-10,-3,0],yfmt:t=>t+'',title:titleFor(mB2,'|S21|² and |S11|², dB','|S21|², dB'),ylab:'dB'});
  if(ST.lcmp) for(const q of Lm.others) m.line(fs,q.s21,COL[q.kind],1.1,[4,3]);

  /* four names do not fit beside the |S21|^2 title at 1100 px: the other two types are named beside the delay's,
     a plot that draws all three */

  /* the group delay, over the passband and a little beyond */
  const inb=Lm.xs.map((x,i)=>i).filter(i=>Lm.xs[i]>=D.x1d/Math.pow(D.x2d,0.6)&&Lm.xs[i]<=D.x2d*Math.pow(D.x2d,0.6));
  const t0=Math.min(...inb.map(i=>Lm.tau[i])), t1=Math.max(...inb.map(i=>Lm.tau[i]), ...(ST.lcmp?Lm.others.map(q=>Math.max(...inb.map(i=>q.tau[i]))):[]));
  const tf=t=>t*1e6, ymax=tf(t1)*1.12;
  const fa=Lm.xs[inb[0]]*D.f0, fb=Lm.xs[inb[inb.length-1]]*D.f0;
  const tB2=box(tB.x,tB.y+14,tB.w,tB.h-14);
  const g=fPlot(ctx,tB2,fa,fb,0,ymax,{title:titleFor(tB2,'group delay, µs','delay, µs'),ny:4,yfmt:t=>tkv(t)});
  const sub=a=>inb.map(i=>a[i]);
  if(ST.lcmp) for(const q of Lm.others) g.line(sub(Lm.xs).map(x=>x*D.f0),sub(q.tau).map(tf),COL[q.kind],1.1,[4,3]);
  g.line(sub(Lm.xs).map(x=>x*D.f0),sub(Lm.tau).map(tf),COL[D.kind],2);
  fMark(ctx,g,D.x1d*D.f0,COL.dim,[5,3]); fMark(ctx,g,D.x2d*D.f0,COL.dim,[5,3]);
  if(ST.lcmp) titleKey(ctx,tB2,titleFor(tB2,'group delay, µs','delay, µs'),Lm.others.map(q=>[COL[q.kind],shortName(q.kind)]));
  drawCaption(ctx,Lb);
}

  else { sWire(ctx,[[xt1,yt],[xt1+6,yt]]); sWire(ctx,[[xt2-6,yt],[xt2,yt]]);
    const ym=(yt+yb)/2; ctx.beginPath(); ctx.moveTo(xt1+16,ym); ctx.lineTo(xt2-16,ym); ctx.strokeStyle=COL.ind; ctx.lineWidth=1.3; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);

}
function drawCoupled(ctx,W,H,M){

  const kB=box(kB0.x,kB0.y,kB0.w,kB0.h-16);

     (a high-Qe pair's skirts once crossed every place legendR tries, and the legend was dropped) */
  const skL=[[COL.cap,'top C: +60 / −20 dB per decade'],[COL.ind,'mutual M: +20 / −60 dB per decade']];
  const fr=Math.min(0.45,(skL.length*15+8+16)/Math.max(wB.h,1)), yTop=120*fr/(1-fr);

  const wf=K.wx.map(x=>x*o.f0), other=o.ctype==='cap'?'ind':'cap';

  legendR(ctx,wB,skL);
  /* the transmission at f0 against kQ */
  const kx=K.kx.map(Math.log10);
  axesT(ctx,kB,-1,1,0,1.05,{xticks:[-1,Math.log10(0.5),0,Math.log10(2),1],xfmt:t=>tkv(Math.pow(10,t)),yticks:[0.25,0.5,0.75,1],yfmt:t=>fmt(t,2),title:titleFor(kB,'|S21| at f₀ against kQ','|S21(f₀)|'),xlab:'kQ'});
  polyline(ctx,kB,kx,K.kx.map(k=>2*k/(1+k*k)),-1,1,0,1.05,COL.dim,1.1,[4,3]);
  polyline(ctx,kB,kx,K.kc,-1,1,0,1.05,COL[o.ctype],2);
  if(K.kqMax<10){ const ex=kB.x+kB.w*(Math.log10(K.kqMax)+1)/2, ey=kB.y1-kB.h*K.kc[K.kc.length-1]/1.05;
    lab(ctx,W,H,ex+8,ey-12,'k = '+K_MAX,COL.dim,SM_FONT,'left','middle',PLATE); }
  marker(ctx,kB,-1,1,0,1.05,Math.log10(o.kQ),o.center,COL.live);
  HIT.push({kind:'kq',b:kB});
  drawCaption(ctx,Lb);
}

/* ================================================================== *
 *  THE S-PLANE                                                        *
 * ================================================================== */
const ZTOP=20, ZBOT=-40;
/* both axes are fitted to the same length, so a unit of sigma is drawn (w1 - w0)/(s1 - s0) times a unit of omega */
function axisScale(win){ const r=(win.w1-win.w0)/(win.s1-win.s0);
  return r>=1.05?'the σ axis drawn '+sigf(r,2)+'× longer than it is':r<=1/1.05?'the σ axis drawn at '+sigf(r,2)+' of its length':'both axes to one scale'; }
function drawSplane(ctx,W,H,M){
  const Z=M.Z, S=Z.S, win=Z.win;
  const capFull='20 log|H(s)| over the complex frequency s = σ + jω (units of ω₀; each axis fitted to the poles, '+axisScale(win)+'). Every pole (magenta) raises a spike, cut off at +20 dB; the green curve along σ = 0 is the frequency response itself. Below, the response to a burst of the centre frequency: it builds up and rings down in the time 1/|σ| of the slowest pole. Drag the surface to turn it.';
  const capShort='|H(s)| over the s-plane, the poles, and the response to a burst at f₀.';
  const Lb=stageBox(ctx,W,H,capFull,capShort,stageTop()+30+260);
  const b=Lb.main;
  const [top,bot0]=splitV(b,0.62,50);
  const bot=box(bot0.x,bot0.y+14,bot0.w,bot0.h-30);
  const [sB,pB0]=splitH(top,0.62,52);
  const pB=box(pB0.x,pB0.y+18,pB0.w,pB0.h-18-14);
  /* the surface: x = sigma, y = omega (each fitted to [-1, 1]), z = dB mapped to [0, 1.1] */
  const C=boxCamera(sB,ST.camTheta,ST.camPhi,3.9,[0,0,0.35]);
  HIT.push({kind:'cam',b:sB});
  const X=sg=>2*(sg-win.s0)/(win.s1-win.s0)-1, Y=w=>2*(w-win.w0)/(win.w1-win.w0)-1, Zc=v=>1.1*(clamp(v,ZBOT,ZTOP)-ZBOT)/(ZTOP-ZBOT);
  const n=Z.n, quads=[];
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    const g=Z.grid, v=[g[i][j],g[i][j+1],g[i+1][j+1],g[i+1][j]];
    const xs=[j,j+1,j+1,j].map(q=>-1+2*q/n), ys=[i,i,i+1,i+1].map(q=>-1+2*q/n);
    const P3=[0,1,2,3].map(k=>[xs[k],ys[k],Zc(v[k])]);
    const cen=[(xs[0]+xs[1])/2,(ys[0]+ys[2])/2,(P3[0][2]+P3[2][2])/2];
    const q=P3.map(p=>C.P(p)); if(q.some(p=>!p)) continue;
    const d=v3.len(v3.sub(cen,C.B.eye)), h=(v.reduce((a,c)=>a+clamp(c,ZBOT,ZTOP),0)/4-ZBOT)/(ZTOP-ZBOT);
    quads.push({q,d,h,clip:v.some(c=>c>=ZTOP)});
  }
  quads.sort((a,c)=>c.d-a.d);
  for(const Q of quads){
    ctx.beginPath(); ctx.moveTo(Q.q[0].x,Q.q[0].y); for(let k=1;k<4;k++) ctx.lineTo(Q.q[k].x,Q.q[k].y); ctx.closePath();
    const base=Q.clip?'#5a2257':mix('#16304f','#7deeff',Math.pow(Q.h,1.1));
    ctx.fillStyle=base; ctx.fill(); ctx.strokeStyle=mix('#070b18',base,0.55); ctx.lineWidth=0.6; ctx.stroke();
  }
  /* the box's floor edges and the response along sigma = 0 */
  const fl=[[-1,-1,0],[1,-1,0],[1,1,0],[-1,1,0],[-1,-1,0]];
  poly3(ctx,C,fl,'#2a3550',1,null,true);
  if(win.s0<0&&win.s1>0){ const x0=X(0); poly3(ctx,C,Z.axis.map(([w,v])=>[x0,Y(w),Zc(v)]),COL.pos,2.2); poly3(ctx,C,[[x0,-1,0],[x0,1,0]],'#3d5a26',1,[3,3],true); }
  for(const p of S.poles) if(p.im>=win.w0&&p.im<=win.w1&&p.re>=win.s0&&p.re<=win.s1){
    const q=C.P([X(p.re),Y(p.im),Zc(ZTOP)+0.02]), q0=C.P([X(p.re),Y(p.im),0]);
    if(q&&q0){ sWire(ctx,[[q0.x,q0.y],[q.x,q.y]],COL.live,1); dot(ctx,q.x,q.y,3.2,COL.live,null); } }
  /* axis labels at the floor's near corners */
  /* the floor's extent, at its corners, on plates (a corner can sit behind the surface) */
  { const cor=[[1,-1,'σ = '+tkv(win.s1)+', ω = '+tkv(win.w0)],[-1,-1,'σ = '+tkv(win.s0)+', ω = '+tkv(win.w0)],[-1,1,'ω = '+tkv(win.w1)]];
    for(const [xx,yy,txt] of cor){ const q=C.P([xx*1.08,yy*1.08,0]); if(q) lab(ctx,W,H,q.x,q.y,txt,COL.dim,SM_FONT,q.x>sB.x+sB.w/2?'left':'right','middle',PLATE); } }
  lab(ctx,W,H,sB.x,sB.y+6,sB.w>=440?S.name+': 20 log|H(s)|, '+ZBOT+' to +'+ZTOP+' dB':sB.w>=300?S.name+': 20 log|H(s)|':S.name,COL.text,'italic 12.5px Georgia, serif','left','middle');
  /* the pole-zero map in the same window */
  axesT(ctx,pB,win.s0,win.s1,win.w0,win.w1,{title:titleFor(pB,'poles × and zeros ○ (units of ω₀)','poles, zeros'),nx:Math.max(2,Math.min(4,Math.floor(pB.w/70))),ny:Math.max(2,Math.min(4,Math.floor(pB.h/40))),xlab:'σ',xfmt:t=>tkv(t),yfmt:t=>tkv(t)});
  const pm=(sg,w)=>[pB.x+pB.w*(sg-win.s0)/(win.s1-win.s0),pB.y1-pB.h*(w-win.w0)/(win.w1-win.w0)];
  if(win.s0<0&&win.s1>0){ const [x0]=pm(0,0); sWire(ctx,[[x0,pB.y],[x0,pB.y1]],'#3d5a26',1); }
  /* |s| = w0: s = -sin(phi) + j cos(phi), the part inside the window */
  { const arc=[]; for(let i=0;i<=400;i++){ const ph=PI/2*i/400, sg=-Math.sin(ph), w=Math.cos(ph); if(w>=win.w0&&w<=win.w1&&sg>=win.s0&&sg<=win.s1) arc.push(pm(sg,w)); else if(arc.length) break; }
    if(arc.length>1) sWire(ctx,arc,'#2a3550',1); }
  for(const p of S.poles) if(p.im>=win.w0-1e-12&&p.im<=win.w1&&p.re>=win.s0){ const [x,y]=pm(p.re,p.im); sWire(ctx,[[x-4,y-4],[x+4,y+4]],COL.live,1.6); sWire(ctx,[[x-4,y+4],[x+4,y-4]],COL.live,1.6); }
  for(const z of S.zeros) if(z.im>=win.w0&&z.im<=win.w1&&z.re>=win.s0&&z.re<=win.s1){ const [x,y]=pm(z.re,z.im); dot(ctx,x,y,4,null,COL.pos,1.5); }
  /* the tone burst */
  const cyc=Z.tend/TAU, ts=Z.taus.map(t=>t/TAU), ys=Z.resp.map(r=>r.y), env=Z.resp.map(r=>r.env);
  const amp=Math.max(...env,...ys.map(Math.abs))*1.08||1;
  axesT(ctx,bot,0,cyc,-amp,amp,{title:titleFor(bot,'the output for a burst of '+cyclesT(Z.T/TAU)+' at f₀ (the envelope dashed)','the burst response'),xlab:'time, cycles of f₀',ny:bot.h<90?2:4,yfmt:t=>tkv(t),xfmt:t=>tkv(t)});
  { const x1=bot.x+bot.w*(Z.T/TAU)/cyc; ctx.fillStyle='rgba(205,53,196,0.06)'; ctx.fillRect(bot.x,bot.y,x1-bot.x,bot.h); }
  if(cyc<=160) polyline(ctx,bot,ts,ys,0,cyc,-amp,amp,COL.pos,1.1);
  else { ctx.fillStyle='rgba(184,236,76,0.35)'; ctx.beginPath(); ts.forEach((t,i)=>{ const x=bot.x+bot.w*t/cyc, y=bot.y1-bot.h*(env[i]+amp)/(2*amp); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    for(let i=ts.length-1;i>=0;i--){ const x=bot.x+bot.w*ts[i]/cyc, y=bot.y1-bot.h*(-env[i]+amp)/(2*amp); ctx.lineTo(x,y); } ctx.closePath(); ctx.fill(); }
  polyline(ctx,bot,ts,env,0,cyc,-amp,amp,COL.ref,1.2,[5,3]);
  polyline(ctx,bot,ts,env.map(v=>-v),0,cyc,-amp,amp,COL.ref,1.2,[5,3]);
  drawCaption(ctx,Lb);
}

/* ================================================================== *
 *  dispatch and the pointer                                           *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='perm') drawPerm(ctx,W,H,M);
  else if(M.view==='series') drawSeries(ctx,W,H,M);
  else if(M.view==='parallel') drawParallel(ctx,W,H,M);
  else if(M.view==='ladder') drawLadder(ctx,W,H,M);
  else if(M.view==='coupled') drawCoupled(ctx,W,H,M);
  else if(M.view==='radio') drawRadio(ctx,W,H,M);
  else drawSplane(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  /* a press on a plot sets the quantity along its axis; on a census cell it selects; on the surface it turns */
  function setFrom(hit,x,down){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1);
    if(hit.kind==='sx'){ ST.sx=clamp(Math.pow(10,hit.lx0+(hit.lx1-hit.lx0)*u)/hit.f0,LIM.x[0],LIM.x[1]); return true; }
    if(hit.kind==='qx'){ ST.qx=clamp(Math.pow(10,hit.lx0+(hit.lx1-hit.lx0)*u)/hit.f0,LIM.x[0],LIM.x[1]); return true; }
    if(hit.kind==='kq'){ ST.ckQ=clamp(Math.pow(10,-1+2*u),LIM.kQ[0],LIM.kQ[1]); ST.cpre='own'; return true; }
    /* a press on the band tunes to it: on a station's bar, to the station, held until the pointer moves off; a
       drag tunes smoothly through everything between (the switch goes to the nearest of its five) */
    if(hit.kind==='band'){
      if(!down&&DRAG.snap!==null&&Math.abs(x-DRAG.snap)<=RB_HOLD) return false;
      let f=RAD_BAND[0]+(RAD_BAND[1]-RAD_BAND[0])*u; DRAG.snap=null;
      if(down){ let s=null; for(const q of hit.sts) if(!s||Math.abs(q.x-x)<Math.abs(s.x-x)) s=q;
        if(s&&Math.abs(s.x-x)<=RB_SNAP){ f=s.f; DRAG.snap=x; } }
      radioTuneTo(ST,f);
      return true; }
    return false;
  }
  /* the knob turns with the pointer's angle about its centre: clockwise tunes up (the drive's 5:1 on the capacitor),
     and the switch clicks to its next stop every 30 degrees */
  function turnKnob(x,y){
    const hit=DRAG.hit, a=Math.atan2(y-hit.cy,x-hit.cx); let d=a-DRAG.ang; d-=TAU*Math.round(d/TAU); DRAG.ang=a;
    ST.rpre='own';
    if(ST.rmode==='switch'){ DRAG.acc+=d; ST.rsw=clamp(DRAG.sw0+Math.round(DRAG.acc/(PI/6)),0,RADIO.presets.length-1); return true; }
    const u=clamp(lawU(ST.rlaw,ST.rf)-d/(PI*RAD_GEAR),0,1); ST.rf=clamp(radF(RADIO.L,lawC(ST.rlaw,u)),RAD_FLO,RAD_FHI);
    return true;
  }
  S.pointer=function(type,x,y){
    if(type==='up'){ const was=DRAG.what; DRAG.what=null; return was!==null&&was!=='cam'; }
    if(type==='down'){
      const hit=hitAt(x,y); if(!hit) return false;
      if(hit.kind==='perm'){ ST.psel=hit.id; return true; }
      if(hit.kind==='cam'){ DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST.camTheta; DRAG.ph=ST.camPhi; return true; }
      if(hit.kind==='knob'){ DRAG.what='knob'; DRAG.hit=hit; DRAG.ang=Math.atan2(y-hit.cy,x-hit.cx); DRAG.acc=0; DRAG.sw0=ST.rsw; return true; }
      /* a station's mark on the dial: the nearest within reach */
      if(hit.kind==='dial'){ let s=null, dm=RD_PICK; for(const q of hit.pts){ const d=Math.hypot(q.x-x,q.y-y); if(d<=dm){ dm=d; s=q; } }
        if(!s) return false; radioTuneTo(ST,s.f); return true; }
      if(setFrom(hit,x,true)){ DRAG.what=hit.kind; DRAG.hit=hit; return true; }
      return false;
    }
    if(type==='move'){
      if(DRAG.what==='cam'){ ST.camTheta=DRAG.th-(x-DRAG.x)*0.008; ST.camPhi=clamp(DRAG.ph+(y-DRAG.y)*0.008,0.08,1.35); return true; }
      if(DRAG.what==='knob') return turnKnob(x,y);
      if(DRAG.what&&DRAG.hit) return setFrom(DRAG.hit,x);
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  THE RADIO DIAL: the set's face, the capacitor or the switch, the  *
 *  band, the loudspeaker                                              *
 * ================================================================== */
const EYE_COL='#57e389';
function drawRadio(ctx,W,H,M){
  const R=M.RD, st=ST, sw=st.rmode==='switch';
  const capFull=(sw?'The knob here is a switch: each of its five positions connects its own coil and capacitor, a circuit tuned to one station. '
    :'Turning the knob turns the rotor of a variable capacitor (through a 5:1 drive), and so moves the frequency of every tuned stage at once: the band-pass slides along the dial. ')
    +'Below, every station at the aerial (faint) and what is left of it after the stages (bold): press one, or its mark on the dial, '
    +(sw?'and the switch goes to the circuit nearest it. ':'to tune to it. ')+'Between stations only the static passes; the AGC then runs at full gain and the static fills the loudspeaker. Tick listen to hear it.';
  const capShort=sw?'A switch of five fixed circuits, one per station; below, the band after the stages and the loudspeaker.'
    :'The knob turns the capacitor and moves the band-pass along the dial; between stations, static.';
  const Lb=stageBox(ctx,W,H,capFull,capShort,stageTop()+30+300);
  const b=Lb.main;
  const [top,bot0]=splitV(b,0.54,46);
  const [faceB,mechB]=splitH(top,0.5,26);
  /* the bottom plots leave room under them for their axis names */
  const bot=box(bot0.x,bot0.y+16,bot0.w,bot0.h-16-20);
  const [bandB,spkB]=splitH(bot,0.58,56);
  drawRadioFace(ctx,W,H,faceB,R,st);
  if(sw) drawRadioSwitch(ctx,W,H,mechB,R,st); else drawRadioCap(ctx,W,H,mechB,R,st);
  drawRadioBand(ctx,W,H,bandB,R,st);
  drawRadioSpeaker(ctx,W,H,spkB,R,st);
  drawCaption(ctx,Lb);
}
/* the set's face: the half-moon dial (tens of kHz, as the old sets printed it), the pointer, the tuning eye, the knob */
function drawRadioFace(ctx,W,H,b,R,st){
  ctx.fillStyle='#0d1119'; ctx.fillRect(b.x,b.y,b.w,b.h); frame(ctx,b,'#2a2f3d');
  const compact=b.w<300||b.h<170;
  const rd=Math.max(30,Math.min(b.w*0.40,b.h*0.62-26)), cx=b.x+b.w/2, cy=b.y+rd+26;
  /* the scale: an arc from 180 degrees (the bottom of the band) to 0 (the top) */
  const ang=f=>PI*lawU(st.rlaw,f), P=(a,r)=>[cx+r*Math.cos(a),cy-r*Math.sin(a)];
  const arc=[]; for(let i=0;i<=90;i++) arc.push(P(PI*i/90,rd)); sWire(ctx,arc,'#39425a',1.2);
  let prevA=null;
  for(let f=530e3;f<=1700e3+1;f+=10e3){ const a=ang(f);
    if(prevA!==null&&Math.abs(prevA-a)*rd<2.2) continue;
    const major=[550e3,600e3,700e3,800e3,1000e3,1200e3,1400e3,1600e3].some(m=>Math.abs(m-f)<1);
    sWire(ctx,[P(a,rd),P(a,rd-(major?9:4))],major?'#8b93a6':'#4a5268',major?1.3:1);
    prevA=a; }
  for(const m of [550,600,700,800,1000,1200,1400,1600]){ const [x,y]=P(ang(m*1e3),rd+11);
    lab(ctx,W,H,x,y,String(m/10),'#aeb6c6',SM_FONT,'center','middle',PLATE_FIX); }
  /* the stations, marked on the scale; a press within RD_PICK of a mark tunes to that station (the knob, pushed
     later, takes the presses on itself) */
  const pts=[];
  for(const s of R.sts){ const [x,y]=P(ang(s.f),rd-15); dot(ctx,x,y,s.dB>=40?2.6:s.dB>=20?2:1.5,s.k===R.d.k&&R.hear.kind!=='static'?COL.pos:'#6f7789',null); pts.push({f:s.f,x,y}); }
  HIT.push({kind:'dial',b,pts});
  /* the pointer */
  const pa=PI*R.u; sWire(ctx,[P(pa,6),P(pa,rd+3)],COL.live,2); dot(ctx,cx,cy,4,'#2a2f3d',COL.live,1.2);
  /* under the dial, clear of the pointer: the note, the frequency, what is heard */
  if(!compact) lab(ctx,W,H,cx,cy+13,'the dial reads tens of kHz',COL.dim,SM_FONT,'center','middle',PLATE_FIX);
  lab(ctx,W,H,cx,cy+(compact?14:31),khz(R.T.f0),COL.text,'13px -apple-system, sans-serif','center','middle',PLATE_FIX);
  lab(ctx,W,H,cx,cy+(compact?29:47),R.say.short,R.hear.kind==='static'?COL.dim:COL.pos,SM_FONT,'center','middle',PLATE_FIX);
  /* the tuning eye: green, its dark sector closing as the AGC's voltage rises */
  const er=compact?11:15, ex=b.x+er+14, ey=b.y1-er-18;
  dot(ctx,ex,ey,er+2,'#070b18','#39425a',1);
  dot(ctx,ex,ey,er,EYE_COL,null);
  const half=(4+86*(1-R.eye))*PI/180, wedge=[[ex,ey]];
  for(let i=0;i<=24;i++){ const a=-PI/2-half+2*half*i/24; wedge.push([ex+er*Math.cos(a),ey+er*Math.sin(a)]); }
  ctx.beginPath(); ctx.moveTo(wedge[0][0],wedge[0][1]); for(const q of wedge.slice(1)) ctx.lineTo(q[0],q[1]); ctx.closePath(); ctx.fillStyle='#0b1f14'; ctx.fill();
  dot(ctx,ex,ey,er*0.28,'#0b1f14',null);
  lab(ctx,W,H,ex,ey+er+9,'tuning eye',COL.dim,SM_FONT,'center','middle',PLATE_FIX);
  /* the knob: ridges, and an index turned by the drive; the switch shows its five stops */
  const kr=compact?17:23, kx=b.x1-kr-18, ky=b.y1-kr-18, ka=knobAngle(st);
  dot(ctx,kx,ky,kr+3,'#161b27','#39425a',1);
  for(let i=0;i<16;i++){ const a=TAU*i/16+ka; sWire(ctx,[[kx+kr*0.78*Math.cos(a),ky+kr*0.78*Math.sin(a)],[kx+kr*Math.cos(a),ky+kr*Math.sin(a)]],'#4a5268',1.2); }
  dot(ctx,kx,ky,kr*0.72,'#1c2230','#4a5268',1);
  const ia=ka-PI/2; sWire(ctx,[[kx+kr*0.15*Math.cos(ia),ky+kr*0.15*Math.sin(ia)],[kx+kr*0.72*Math.cos(ia),ky+kr*0.72*Math.sin(ia)]],COL.live,2.4);
  if(st.rmode==='switch') for(let i=0;i<5;i++){ const a=i*PI/6-PI/2; dot(ctx,kx+(kr+8)*Math.cos(a),ky+(kr+8)*Math.sin(a),i===st.rsw?2.6:1.6,i===st.rsw?COL.live:'#6f7789',null); }
  lab(ctx,W,H,kx,ky-kr-(st.rmode==='switch'?17:10),st.rmode==='switch'?'the switch':'tuning',COL.dim,SM_FONT,'center','middle',PLATE_FIX);
  HIT.push({kind:'knob',b:box(kx-kr-10,ky-kr-10,2*kr+20,2*kr+20),cx:kx,cy:ky});
}
/* the variable capacitor from above: the stator half (fixed) and one rotor plate, its meshed part bright */
function drawRadioCap(ctx,W,H,b,R,st){
  frame(ctx,b,COL.edge);
  lab(ctx,W,H,b.x+6,b.y+9,b.w>=300?'the variable capacitor, from above':'the capacitor',COL.dim,SM_FONT,'left','middle');
  const law=st.rlaw, ri=RADIO.ri; let rmax=1; for(let i=0;i<=40;i++) rmax=Math.max(rmax,plateR(law,i/40));
  const Rc=Math.max(8,Math.min(b.w*0.40,(b.h-50)*0.46)/rmax), mx=b.x+b.w/2, my=b.y+22+Rc*rmax+2;
  const P=(phi,r)=>[mx+r*Math.cos(phi),my-r*Math.sin(phi)];
  /* the stator: the half below the shaft, as large as the rotor's widest reach */
  const stat=[]; for(let i=0;i<=60;i++) stat.push(P(-PI*i/60,rmax*1.04*Rc)); for(let i=60;i>=0;i--) stat.push(P(-PI*i/60,ri*Rc));
  ctx.beginPath(); ctx.moveTo(stat[0][0],stat[0][1]); for(const q of stat.slice(1)) ctx.lineTo(q[0],q[1]); ctx.closePath();
  ctx.fillStyle='rgba(90,200,224,0.07)'; ctx.fill(); sWire(ctx,stat.concat([stat[0]]),'#2f6f7d',1);
  /* the rotor plate: radius plateR(law, a/pi) at the angle a behind its leading edge, turned in by theta = pi u */
  const th=PI*R.u, plate=(a0,a1)=>{ const pts=[]; for(let i=0;i<=80;i++){ const a=a0+(a1-a0)*i/80; pts.push(P(-th+a,plateR(law,a/PI)*Rc)); }
    for(let i=80;i>=0;i--){ const a=a0+(a1-a0)*i/80; pts.push(P(-th+a,ri*Rc)); } return pts; };
  const fillPts=(pts,fillc,stroke)=>{ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(const q of pts.slice(1)) ctx.lineTo(q[0],q[1]); ctx.closePath();
    ctx.fillStyle=fillc; ctx.fill(); if(stroke) sWire(ctx,pts.concat([pts[0]]),stroke,1.3); };
  fillPts(plate(0,PI),'rgba(242,193,78,0.16)',COL.C);
  if(th>1e-3) fillPts(plate(0,Math.min(th,PI)),'rgba(242,193,78,0.5)',null);
  dot(ctx,mx,my,Math.max(3,ri*Rc*0.8),'#2a2f3d','#8b93a6',1);
  const C=R.T.C, Cs=C-RADIO.CT;
  lab(ctx,W,H,b.x+6,b.y1-24,'turned in '+fmt(180*R.u,0)+'°: the section '+farad(Cs,3),COL.C,SM_FONT,'left','middle');
  lab(ctx,W,H,b.x+6,b.y1-10,'+ '+farad(RADIO.CT,2)+' trimmer = '+farad(C,4),COL.dim,SM_FONT,'left','middle');
}
/* the switch: a wafer whose wiper connects one of five tanks, each its own L and C */
function drawRadioSwitch(ctx,W,H,b,R,st){
  frame(ctx,b,COL.edge);
  lab(ctx,W,H,b.x+6,b.y+9,b.w>=300?'the switch: five fixed tuned circuits':'the switch',COL.dim,SM_FONT,'left','middle');
  const wr=Math.max(14,Math.min(b.h*0.30,b.w*0.16)), wx=b.x+wr+18, wy=b.y+(b.h+10)/2;
  dot(ctx,wx,wy,wr,'#10131b','#39425a',1.2);
  const rowH=Math.min(34,(b.h-26)/5), x0=wx+wr+22;
  RADIO.presets.forEach((p,i)=>{
    const a=(i-2)*PI/9, cxp=wx+wr*Math.cos(a), cyp=wy+wr*Math.sin(a), ry=b.y+22+rowH*(i+0.5), on=i===st.rsw;
    sWire(ctx,[[cxp,cyp],[x0,ry]],on?COL.live:'#39425a',on?1.6:1);
    dot(ctx,cxp,cyp,on?3.2:2.4,on?COL.live:'#6f7789',null);
    /* the tank: an inductor and a capacitor side by side */
    const tx=x0+6, th2=Math.min(rowH*0.7,22);
    sPart(ctx,'L',tx+4,ry-th2/2,tx+4,ry+th2/2,COL.L,0.35); sPart(ctx,'C',tx+16,ry-th2/2,tx+16,ry+th2/2,COL.C,0.35);
    sWire(ctx,[[tx+4,ry-th2/2],[tx+16,ry-th2/2]]); sWire(ctx,[[tx+4,ry+th2/2],[tx+16,ry+th2/2]]); sWire(ctx,[[x0,ry],[tx+4,ry]]);
    lab(ctx,W,H,tx+26,ry,fmt(p.f/1e3,0)+' kHz: '+eng(p.L,'H',3)+', '+eng(p.C,'F',4),on?COL.text:COL.dim,SM_FONT,'left','middle');
  });
  const sa=(st.rsw-2)*PI/9; sWire(ctx,[[wx,wy],[wx+wr*0.92*Math.cos(sa),wy+wr*0.92*Math.sin(sa)]],COL.live,2.6); dot(ctx,wx,wy,3.5,'#2a2f3d',COL.live,1.2);
  lab(ctx,W,H,wx,wy+wr+12,'from the aerial',COL.dim,SM_FONT,'center','middle');

/* the band: each station at the aerial and after the stages, the stages' response from the top, the static's level */
const RB_Y=[-20,55];
function drawRadioBand(ctx,W,H,b,R,st){
  const x0=RAD_BAND[0]/1e3, x1=RAD_BAND[1]/1e3, [ylo,yhi]=RB_Y;
  const title='the band';
  axesT(ctx,b,x0,x1,ylo,yhi,{xticks:b.w>=300?[600,800,1000,1200,1400,1600]:[600,1000,1400],xfmt:t=>t+'',yticks:[0,20,40],yfmt:t=>t+'',title,xlab:'kHz',ylab:b.h>=150?'dB over the static in 10 kHz':'dB'});
  titleKey(ctx,b,title,[['#4a5268','at the aerial'],[COL.pos,'after the stages'],[COL.struct,'the stages']]);
  const X=f=>b.x+b.w*(f/1e3-x0)/(x1-x0), Y=v=>b.y1-b.h*(clamp(v,ylo,yhi)-ylo)/(yhi-ylo);
  /* the dial's setting first, so the bars stand in front of it */
  fMark(ctx,{b,X:f=>X(f)},R.T.f0,COL.live,[4,3],null,1.2);
  /* the stages' response, 0 dB at the top of the plot */
  polyline(ctx,b,R.fs.map(f=>f/1e3),R.resp.map(v=>yhi+v),x0,x1,ylo,yhi,COL.struct,1.5);
  /* the static after the stages, in the receiver's noise bandwidth */
  const yf=Y(R.floor); ctx.setLineDash([4,3]); sWire(ctx,[[b.x,yf],[b.x1,yf]],'#6f7789',1); ctx.setLineDash([]);
  for(const s of R.sts){ const x=X(s.f);
    sWire(ctx,[[x,Y(ylo)],[x,Y(s.dB)]],'#3a4256',2.4);
    if(s.lev>ylo) sWire(ctx,[[x,Y(ylo)],[x,Y(s.lev)]],COL.pos,2.4); }
  if(b.w>=240) lab(ctx,W,H,b.x1-4,yf-8,'the static after the stages',COL.dim,SM_FONT,'right','middle',PLATE);
  HIT.push({kind:'band',b,sts:R.sts.map(s=>({f:s.f,x:X(s.f)}))});
}
/* the pointer's reach: a press on the band within RB_SNAP px of a station's bar tunes to the station itself, and
   holds it until the pointer has moved RB_HOLD px; a press on the dial takes the station mark within RD_PICK px */
const RB_SNAP=7, RB_HOLD=3, RD_PICK=10;
/* the loudspeaker: 40 ms of what it plays, at the scale it plays it */
const RS_Y=0.3;
function drawRadioSpeaker(ctx,W,H,b,R,st){
  const n=R.pv.y.length, ms=1000*n/R.pv.fs, title=titleFor(b,'the loudspeaker: '+R.say.short+(st.rlisten?' (listening)':''),'the loudspeaker');
  axesT(ctx,b,0,ms,-RS_Y,RS_Y,{xticks:[0,10,20,30,40],xfmt:t=>t+'',yticks:[-0.2,0,0.2],yfmt:t=>fmt(t,1),title,xlab:'ms'});

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }

    if(st.view!==k) st.view=k;

  const rows={};

    const m=map||{to:v=>v,from:v=>v};

    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  const logSlider=(key,lab,lo,hi,fmtf,onchg)=>slider(key,lab,0,LOGN,1,fmtf,onchg,logMap(lo,hi));

      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });

  /* the permutations */

  gPerm.appendChild(chipRow(PERM_PRESETS,'ppre',o=>{ st.pR=o.R; st.pL=L0; st.pC=C0; }));

  gPerm.appendChild(logSlider('pL','L',LIM.L[0],LIM.L[1],v=>henry(v),()=>{ st.ppre='own'; }));
  gPerm.appendChild(logSlider('pC','C',LIM.C[0],LIM.C[1],v=>farad(v),()=>{ st.ppre='own'; }));
  const permTag=h('div',{class:'tag'}); gPerm.appendChild(permTag);

  /* the series loop */
  const gSer=h('div',{class:'grp'},h('h3',null,'the series loop'));
  gSer.appendChild(chipRow(SER_PRESETS,'spre',o=>{ st.sR=o.R; st.sRs=o.Rs; st.sL=L0; st.sC=C0; }));
  gSer.appendChild(logSlider('sL','L',LIM.L[0],LIM.L[1],v=>henry(v),()=>{ st.spre='own'; }));
  gSer.appendChild(logSlider('sC','C',LIM.C[0],LIM.C[1],v=>farad(v),()=>{ st.spre='own'; }));
  gSer.appendChild(logSlider('sR','R (the load)',LIM.sR[0],LIM.sR[1],v=>ohm(v),()=>{ st.spre='own'; }));
  gSer.appendChild(slider('sRs','Rₛ (the source)',LIM.Rs[0],LIM.Rs[1],1,v=>ohm(v),()=>{ st.spre='own'; }));
  gSer.appendChild(logSlider('sx','drive f/f₀',LIM.x[0],LIM.x[1],v=>fmt(v,3)));
  gSer.appendChild(h('div',{class:'checks'},checkbox('sturn','turn the phasors')));
  const serTag=h('div',{class:'tag'}); gSer.appendChild(serTag);

  /* the tank */
  const gPar=h('div',{class:'grp'},h('h3',null,'the tank'));
  gPar.appendChild(chipRow(PAR_PRESETS,'qpre',o=>{ st.qR=o.R; st.qr=o.r; st.qL=L0; st.qC=C0; }));
  gPar.appendChild(logSlider('qL','L',LIM.L[0],LIM.L[1],v=>henry(v),()=>{ st.qpre='own'; }));
  gPar.appendChild(logSlider('qC','C',LIM.C[0],LIM.C[1],v=>farad(v),()=>{ st.qpre='own'; }));
  gPar.appendChild(logSlider('qR','R (the feed)',LIM.qR[0],LIM.qR[1],v=>ohm(v),()=>{ st.qpre='own'; }));
  gPar.appendChild(slider('qr','r (the coil)',0,LOGN,1,v=>v>0?ohm(v):'0 (lossless)',()=>{ st.qpre='own'; },{to:rOfU,from:uOfR}));
  gPar.appendChild(logSlider('qx','drive f/f₀',LIM.x[0],LIM.x[1],v=>fmt(v,3)));
  gPar.appendChild(h('div',{class:'checks'},checkbox('qturn','turn the phasors')));
  const parTag=h('div',{class:'tag'}); gPar.appendChild(parTag);

  /* the ladder */
  const gLad=h('div',{class:'grp'},h('h3',null,'the ladder'));
  gLad.appendChild(chipRow(LAD_PRESETS,'lpre',o=>{ st.lkind=o.kind; if(o.rip) st.lrip=o.rip; st.lN=o.N; st.lf0=o.f0; st.lfbw=o.fbw; st.lR0=o.R0; }));
  gLad.appendChild(chipRow(KIND_LIST,'lkind',()=>{ st.lpre='own'; }));
  const ripRow=chipRow(RIP_LIST,'lrip',()=>{ st.lpre='own'; }); gLad.appendChild(ripRow);
  gLad.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'N'),chipRow(N_LIST,'lN',()=>{ st.lpre='own'; })));
  gLad.appendChild(chipRow(FIRST_LIST,'lfirst'));
  gLad.appendChild(logSlider('lf0','f₀',LIM.f0[0],LIM.f0[1],v=>hz(v),()=>{ st.lpre='own'; }));
  gLad.appendChild(logSlider('lfbw','bandwidth, FBW',LIM.fbw[0],LIM.fbw[1],v=>fmt(100*v,v<0.1?2:1)+' %',()=>{ st.lpre='own'; }));
  gLad.appendChild(logSlider('lR0','R₀ (the ends)',LIM.R0[0],LIM.R0[1],v=>ohm(v),()=>{ st.lpre='own'; }));
  gLad.appendChild(h('div',{class:'checks'},checkbox('lcmp','draw the other two types')));
  const ladTag=h('div',{class:'tag'}); gLad.appendChild(ladTag);

  /* the coupled pair */
  const gCp=h('div',{class:'grp'},h('h3',null,'the coupled pair'));
  gCp.appendChild(chipRow(CP_PRESETS,'cpre',o=>{ st.cf0=o.f0; st.cQe=o.Qe; st.ckQ=o.kQ; st.cR=50; }));
  gCp.appendChild(chipRow(CT_LIST,'cct'));
  gCp.appendChild(logSlider('cf0','f₀',LIM.f0[0],LIM.f0[1],v=>hz(v),()=>{ st.cpre='own'; }));
  gCp.appendChild(logSlider('cQe','Qₑ (each tank, loaded)',LIM.Qe[0],LIM.Qe[1],v=>sigf(v,3),()=>{ st.cpre='own'; st.ckQ=Math.min(st.ckQ,K_MAX*st.cQe); }));
  gCp.appendChild(logSlider('ckQ','kQₑ',LIM.kQ[0],LIM.kQ[1],v=>sigf(v,3),()=>{ st.cpre='own'; st.ckQ=Math.min(st.ckQ,K_MAX*st.cQe); }));
  gCp.appendChild(logSlider('cR','R (each end)',LIM.R0[0],LIM.R0[1],v=>ohm(v),()=>{ st.cpre='own'; }));
  const cpTag=h('div',{class:'tag'}); gCp.appendChild(cpTag);

  /* the s-plane */
  const gZ=h('div',{class:'grp'},h('h3',null,'the s-plane'));
  gZ.appendChild(chipRow(SRC_LIST,'zsrc'));
  const qRow=slider('zQ','Q (the series loop)',0,LOGN,1,v=>sigf(v,3),()=>{
    /* the series loop's R follows the Q asked for (R = Z0/Q - Rs, held inside its slider's range) */
    const Z0=Math.sqrt(st.sL/st.sC); st.sR=clamp(Z0/st.zQ-st.sRs,LIM.sR[0],LIM.sR[1]); st.spre='own'; },logMap(0.2,100));
  gZ.appendChild(qRow);
  gZ.appendChild(logSlider('zlen','burst, in ring times',LIM.zlen[0],LIM.zlen[1],v=>fmt(v,2)));
  const zTag=h('div',{class:'tag'}); gZ.appendChild(zTag);

  /* ---- the radio's sound: the ONLY Web Audio in this file, AudioBuffers holding samples makeRadio computed.
     Streamed like the synth's: 120-ms chunks rendered a little ahead of the sound card and each started at an
     absolute time on the audio clock ("two clocks": setInterval decides only when to render).  Each chunk re-reads
     the dial, so a turn of the knob is heard about 0.3 s later; the engine glides between the two tunings, and a
     switch changes circuit at once.  With no AudioContext everything else still works. ---- */
  const haveAudio=(typeof window!=='undefined')&&!!(window.AudioContext||window.webkitAudioContext);
  let actx=null, rEng=null, schedAt=0, timer=null, queued=[], lookahead=0.36, underruns=0;
  const CHUNK_S=0.12;
  function audioCtx(){ if(!haveAudio) return null; if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function radioTune(){ const T=radTuning(st); return {f0:T.f0,N:st.rN,Qc:st.rQ,agc:st.ragc,crack:st.rcrack,vol:st.rvol,jump:st.rmode==='switch'}; }
  function stopRadio(){ if(timer){ clearInterval(timer); timer=null; } for(const q of queued){ try{ q.stop(); }catch(e){} } queued=[]; rEng=null; }
  function pumpRadio(){
    const ac=actx; if(!ac||!rEng) return;
    /* fell behind: pick the stream up from now, and give it more room next time */
    if(schedAt<ac.currentTime){ schedAt=ac.currentTime+0.02; underruns++; lookahead=Math.min(lookahead+0.15,1.2); }
    let guard=0;
    while(schedAt<ac.currentTime+lookahead&&guard++<48){
      rEng.set(radioTune());
      const n=Math.max(64,Math.round(CHUNK_S*ac.sampleRate)), y=new Float32Array(n);
      rEng.render(y,0,n);
      const buf=ac.createBuffer(1,n,ac.sampleRate);
      if(buf.copyToChannel) buf.copyToChannel(y,0); else buf.getChannelData(0).set(y);
      const src=ac.createBufferSource(); src.buffer=buf; src.connect(ac.destination); src.start(schedAt);
      src.onended=()=>{ const k=queued.indexOf(src); if(k>=0) queued.splice(k,1); };
      queued.push(src); schedAt+=n/ac.sampleRate;
    }
  }
  function startRadio(){
    const ac=audioCtx(); if(!ac) return false;
    stopRadio(); if(ac.state==='suspended'&&ac.resume) ac.resume();
    rEng=makeRadio(ac.sampleRate); rEng.set(Object.assign(radioTune(),{jump:true}));
    schedAt=ac.currentTime+0.06; pumpRadio();
    timer=setInterval(()=>{ try{ pumpRadio(); }catch(e){ fail(e); stopRadio(); } },45);
    return true;
  }

  /* the radio */
  const gRad=h('div',{class:'grp'},h('h3',null,'the radio'));
  gRad.appendChild(chipRow(RADIO_PRESETS,'rpre',o=>{
    if(o.sw!==undefined){ st.rmode='switch'; st.rsw=o.sw; } else { st.rmode='cap'; st.rf=o.f; }

  const radBtns=RAD_BTNS.map(([how,dir,lab,tip])=>h('button',{title:tip,onclick:()=>radioBtn(how,dir)},lab));
  gRad.appendChild(h('div',{class:'btnrow'},...radBtns));
  gRad.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'tuned stages'),chipRow(RN_LIST,'rN',()=>{ st.rpre='own'; })));
  gRad.appendChild(logSlider('rQ','the coils’ Q',LIM.rQ[0],LIM.rQ[1],v=>sigf(v,3),()=>{ st.rpre='own'; }));
  gRad.appendChild(h('div',{class:'checks'},checkbox('ragc','the AGC (automatic volume)'),checkbox('rcrack','lightning nearby (crackle)')));
  gRad.appendChild(h('div',{class:'checks'},checkbox('rlisten','listen',()=>{ if(st.rlisten){ if(!startRadio()) st.rlisten=false; } else stopRadio(); })));
  gRad.appendChild(slider('rvol','volume',0,1,0.01,v=>fmt(100*v,0)+' %'));
  const radTag=h('div',{class:'tag'}); gRad.appendChild(radTag);

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Via Wikipedia (wikitext fetched 2026-09-23): &ldquo;RLC circuit&rdquo; (Q, the band-pass arrangements, the peaks across L and C, the lossy coil after Cartwright et al. 2010), &ldquo;Butterworth filter&rdquo;, &ldquo;Chebyshev filter&rdquo; (Matthaei&rsquo;s recursion), &ldquo;Bessel filter&rdquo;, &ldquo;Prototype filter&rdquo; (the band-pass transformation), &ldquo;Coupling coefficient of resonators&rdquo;, &ldquo;Intermediate frequency&rdquo; (455 kHz, 10.7 MHz), &ldquo;Medium wave&rdquo; (10 kHz channels), &ldquo;FM broadcasting&rdquo; (270 kHz). '

    const po=parallelView(st).o; parTag.innerHTML='the coil&rsquo;s Q<sub>c</sub> = '+(isFinite(po.Qc)?sigf(po.Qc,4):'&infin;')+'; the circuit&rsquo;s pole Q = '+sigf(po.Qpole,4);
    ladTag.innerHTML=st.lkind==='cheby'?(st.lN===1?'at N = 1 there is no ripple to see: one tank, its band edge where the loss equals the ripple':'the band edges are where the ripple ends'):'the band edges are the &minus;3 dB points for Butterworth and Bessel';
    const co=coupledView(st).o; cpTag.innerHTML='k = '+sigf(co.k,4)+'; the modes '+hz(co.fe,4)+' (in step) and '+hz(co.fo,4)+' (opposed)';
    zTag.innerHTML='each pole rings for 1/|&sigma;|; the burst is '+fmt(st.zlen,2)+' ring times of the slowest one';
    radTag.innerHTML=!haveAudio?'this browser has no Web Audio: the picture and the numbers still work'
      :st.rlisten?'listening: '+fmt(1000*CHUNK_S,0)+' ms at a time, '+fmt(1000*lookahead,0)+' ms ahead, so a turn of the knob is heard a moment later'
      :'tick listen to hear the set: a station, or between them the static';
    keysTag.innerHTML='1&ndash;7 switch views &nbsp; space turns the phasors or stops them &nbsp; &larr; &rarr; tune the radio a channel, with shift a station';
  }

  function refresh(){
    try{
      const M=S.model();

      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='perm'?'press an arrangement to look at it · 1–7 switch views'
        :v==='series'||v==='parallel'?'press or drag on the plots to move the drive · space stops the phasors · 1–7 switch views'
        :v==='coupled'?'press or drag on the lower-right plot to set kQ · 1–7 switch views'
        :v==='splane'?'drag the surface to turn it · 1–7 switch views'
        :v==='radio'?'press a station, or drag the knob · ← → a channel, shift ← → a station · 1–7 switch views':'1–7 switch views';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); syncChips(); syncPanel(); dirty=true; refresh(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  const CLOCK={series:'sturn',parallel:'qturn'};
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); const k=CLOCK[st.view]; if(k) st[k]=!st[k]; syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
    /* the arrows tune the radio (a channel, or with shift a station), except in a slider, whose own they are */
    else if(st.view==='radio'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!(e.target&&e.target.type==='range')){
      e.preventDefault(); radioBtn(e.shiftKey?'seek':'step',e.key==='ArrowRight'?1:-1); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&(++frames%6===0)){ const M=S.model(); roEl.innerHTML=readoutHTML(M); } }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const PX=(()=>{
  const P=permModel(DEFAULTS), P3=permModel(Object.assign({},DEFAULTS,{pR:10*Z0D}));
  const q5=seriesModel(L0,C0,Z0D/5,0), q50=seriesModel(L0,C0,Z0D/50,0), gen=seriesModel(L0,C0,50,50);
  const lossy=parallelModel(L0,C0,10*Z0D,Z0D/2), coil=parallelModel(L0,C0,10*Z0D,Z0D/30);
  const b3=bpDesign('butter',3,1e6,0.1,50,'shunt'), am=bpDesign('butter',4,DATA.if_am_khz*1e3,DATA.am_step_khz/DATA.if_am_khz,50,'shunt');
  const c5=bpDesign('cheby',5,1e6,0.1,50,'shunt',0.5), bes5=bpDesign('bessel',5,1e6,0.1,50,'shunt');
  const crit=coupledModel('cap',1e6,20,1,50), over=coupledModel('cap',1e6,20,2,50), under=coupledModel('cap',1e6,20,0.5,50), critI=coupledModel('ind',1e6,20,1,50);
  const cheb=coupledModel('cap',1e6,CP_PRESETS[3].Qe,CP_PRESETS[3].kQ,50);
  /* the critically coupled pair against the ideal N = 2 Butterworth ladder of FBW sqrt2/Qe, within one bandwidth */
  const lad2=bpDesign('butter',2,1e6,Math.SQRT2/20,50,'shunt'); let critVsLadder=0;
  for(let i=-40;i<=40;i++){ const x=1+i/40*lad2.fbw, a=cabs(coupledAt(crit,x)), c=cabs(ladderAt(lad2,x).S21); critVsLadder=Math.max(critVsLadder,Math.abs(a*a-c*c)); }
  /* the dial: how many degrees of the rotor's half turn 530-630 and 1600-1700 kHz take, for each plate law */
  const crowd={}; for(const l of LAW_LIST) crowd[l.id]=[180*Math.abs(lawU(l.id,530e3)-lawU(l.id,630e3)),180*Math.abs(lawU(l.id,1600e3)-lawU(l.id,1700e3))];
  const rad={crowd,ratio:Math.sqrt(4/PI-1)};
  return {P,P3,q5,q50,gen,lossy,coil,b3,am,c5,bes5,crit,over,under,critI,cheb,critVsLadder,rad,
    delayB3:groupDelay(b3.poles,1)/(TAU*b3.f0), delayC5:groupDelay(c5.poles,1)/(TAU*c5.f0), delayBes5:groupDelay(bes5.poles,1)/(TAU*bes5.f0)};
})();
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const INFO={
  perm:'An L-section has a <b>series arm</b> from the input to the output and a <b>shunt arm</b> from the output to ground. Give it one resistor, one inductor and one capacitor, each in one of the arms, and there are twelve ways to do it: choose the parts that share an arm (six ways) and whether those two sit end to end or side by side (two ways). Read with nothing connected to the output, each is a voltage divider, and they fall into two families. When the shared pair is in series, all three parts form one loop and the output is the voltage across some of them; when it is side by side, the input is fed through some parts into the rest in parallel. '
    +'Of the twelve, '+permCensus()['band-pass']+' pass a band, '+permCensus()['band-stop']+' stop one, '+permCensus()['low-pass']+' pass low frequencies and '+permCensus()['high-pass']+' high ones. The two band-passes are the loop read across R and the tank fed through R, the arrangements the RLC-circuit article draws as its series and parallel band-pass filters. With 100 &Omega;, 10 mH and 100 nF (f<sub>0</sub> = '+hz(PX.P.f0,4)+', Z<sub>0</sub> = '+ohm(PX.P.Z0,4)+') the loop has Q = '+sigf(PX.P.Qs,3)+' and the tank Q = '+sigf(PX.P.Qp,3)+': the same three parts, reciprocal Q&rsquo;s.',
  series:'The <b>series resonator</b>: L and C in series from the source, the output across R. At f<sub>0</sub> = 1/2&pi;&radic;(LC) the inductor&rsquo;s and the capacitor&rsquo;s reactances are equal and opposite, so the loop is pure resistance and the whole source voltage reaches R. The two cancelling voltages are not small: each is Q times the source&rsquo;s. At Q = 5 a 1-volt source puts '+fmt(cabs(PX.q5.at(1).VC),2)+' V across the capacitor, and at Q = 50, '+fmt(cabs(PX.q50.at(1).VC),1)+' V. '
    +'The half-power points sit geometrically either side of f<sub>0</sub>, their product f<sub>0</sub>&sup2; and their difference f<sub>0</sub>/Q, where the output&rsquo;s phase has turned &plusmn;45&deg;. A real generator has its own resistance, which joins R in the loop: a 50-&Omega; generator into a 50-&Omega; load halves the output at resonance and lowers Q from '+sigf(Z0D/50,3)+' to '+sigf(PX.gen.Q,3)+'.',
  parallel:'The <b>parallel resonator</b>, or tank: L and C side by side, fed through R. At resonance the tank&rsquo;s admittance vanishes, so the line current is small while a current Q times larger circulates between the coil and the capacitor. A real coil has resistance r in its winding, and that is what sets a tank&rsquo;s Q in practice. It also splits a single &ldquo;resonant frequency&rdquo; into four: 1/2&pi;&radic;(LC), the frequency of zero phase, the largest |Z| and the largest output. With a coil of Q 2 they are '+hz(PX.lossy.xupf*PX.lossy.f0,4)+', '+hz(PX.lossy.xmax*PX.lossy.f0,4)+', '+hz(PX.lossy.f0,4)+' and '+hz(PX.lossy.peak.x*PX.lossy.f0,4)+'; with a coil of Q 30 they lie within '+fmt(Math.abs(PX.coil.peak.x-PX.coil.xupf)*PX.coil.f0,1)+' Hz of each other. '
    +'Driven from a current source (a large R), the output is the tank&rsquo;s impedance itself and its Q is the coil&rsquo;s; fed through a small R, the source loads the tank and the Q falls to R/Z<sub>0</sub>.',
  ladder:'One resonator gives one pole pair and a response that falls away slowly. Sharper bands come from a <b>ladder</b> of them, designed as a low-pass prototype and then mapped onto the band: every shunt capacitor of the prototype becomes a parallel tank and every series inductor a series LC arm, all tuned to f<sub>0</sub>. The prototype&rsquo;s type is the band&rsquo;s shape: <b>Butterworth</b> is maximally flat, <b>Chebyshev</b> trades a ripple in the band for steeper sides, and <b>Bessel</b> keeps the delay nearly constant across the band and rings least. At N = 5 and 10 % bandwidth the delay at the centre is '+eng(PX.delayBes5,'s',3)+' for Bessel and '+eng(PX.delayC5,'s',3)+' for 0.5-dB Chebyshev. '
    +'Starting with a tank or with a series arm gives the same response from different parts (the two are duals). Narrow bands are hard to build this way: the series arms need large inductors and the tanks small ones, '+sigf(PX.am.spreadL,3)+' to 1 for a 10-kHz-wide AM IF at 455 kHz. That is why narrow filters are made of <b>coupled resonators</b> instead.',
  coupled:'Two identical tanks, each loaded by R, joined by a small <b>top capacitor</b> or by a <b>mutual inductance</b> between their coils. Coupled, the pair has two modes, the tanks swinging in step (even) and opposed (odd), about k f<sub>0</sub> apart; each tank&rsquo;s own loaded Q<sub>e</sub> sets how wide each mode is. When kQ<sub>e</sub> &lt; 1 the modes overlap into one top that does not reach full transmission ('+fmt(PX.under.center,3)+' at kQ = &frac12;); at kQ<sub>e</sub> = 1 the band is as flat as two resonators can make it; above it, two tops with a dip between ('+dbT(dB(PX.over.dip.v),2)+' at kQ = 2). '
    +'This is how narrow filters and the IF transformers of radios are built, because every tank is the same and the element values stay reasonable. A top capacitor passes high frequencies better than low, a mutual inductance the reverse, so the two couplings make mirror-image skirts.',
  splane:'Every response on this page is set by a handful of numbers, the <b>poles</b> of its transfer function: the complex frequencies s = &sigma; + j&omega; at which the circuit would ring by itself. The surface is 20 log|H(s)| over the s-plane: each pole raises a spike, and the frequency response is the cut along the imaginary axis, &sigma; = 0. A pole close to that axis makes a sharp ridge there, and in time it rings for a long 1/|&sigma;|. '
    +'Below the surface, the filter is driven by a burst of its centre frequency: the output builds up over that ring time, and keeps ringing for as long after the burst stops. A narrower band means a longer ring, whatever the circuit.',
  radio:'A radio picks one station out of all of them with a band-pass filter it can move. The knob turns a <b>variable capacitor</b>: rotor plates on a shaft slide between fixed ones, and the more they mesh, the larger C and the lower f<sub>0</sub> = 1/2&pi;&radic;(LC). Here a '+eng(RADIO.L,'H',3)+' coil with the '+eng(RADIO.CV1,'F',3)+' section and '+eng(RADIO.CT,'F',2)+' of trimmer tunes '+hz(RAD_FLO,3)+' to '+hz(RAD_FHI,4)+', the whole AM band of the Americas ('+DATA.am_lo_khz+' to '+DATA.am_hi_khz+' kHz in '+DATA.am_step_khz+'-kHz steps). With semicircular plates C grows in proportion to the angle and the top of the band crowds together: '
    +'1600 to 1700 kHz takes '+fmt(PX.rad.crowd.slc[1],1)+'&deg; of the half turn, 530 to 630 kHz '+fmt(PX.rad.crowd.slc[0],1)+'&deg;. Plates cut to another outline spread the stations out. '
    +'A tuned-radio-frequency set had two or three such stages <b>ganged</b> on one shaft, each a coil of fixed Q, so its band widens toward the top of the dial. The other way to change a circuit is to <b>switch</b> it: each position connects its own coil and capacitor. '
    +'Between stations nothing passes but <b>static</b>, the noise of distant lightning. It is far weaker than a station, but the <b>automatic gain control</b> runs at full gain on a weak signal, so the static fills the loudspeaker. With the AGC off the set is nearly silent there, as a crystal set is.',
};

    +EQ(1,'across S: &nbsp;H = '+FR('Z<sub>S</sub>','R + sL + 1/sC')+' &nbsp;=&nbsp; '+FR('N<sub>S</sub>(s)','s&sup2; + (R/L)s + 1/LC'))
    +EQ(2,'through S: &nbsp;H = '+FR('Y<sub>S</sub>','1/R + 1/sL + sC')+' &nbsp;=&nbsp; '+FR('N<sub>S</sub>(s)','s&sup2; + s/RC + 1/LC'))

    +EQ(3,'Q<sub>s</sub> = '+FR('&radic;(L/C)','R')+', &nbsp; Q<sub>p</sub> = R&radic;(C/L), &nbsp; Q<sub>s</sub>Q<sub>p</sub> = 1')

    +'<p>The half-power points of either band-pass (x = f/f<sub>0</sub>). The page takes x<sub>1</sub> = 1/x<sub>2</sub>, since the difference cancels when Q is small. At R = Z<sub>0</sub> both Q&rsquo;s are 1 and the two bands coincide: '+hz(bpEdges(1)[0]*PX.P.f0,4)+' to '+hz(bpEdges(1)[1]*PX.P.f0,4)+'.</p>'
    +'<h4>checked</h4><p>derive.py builds all twelve with sympy and classifies them from their limits, and solves each as a circuit (a nodal matrix) at seven frequencies and three resistors: the two agree to 2&times;10<sup>&minus;13</sup>. RLC circuit (Wikipedia) gives Q = Z<sub>0</sub>/R for the series circuit and R&radic;(C/L) for the parallel one, and remarks that the same parts make one broad when the other is narrow.</p>',

    +'<p>which is RLC circuit&rsquo;s &omega;<sub>C</sub> = &omega;<sub>0</sub>&radic;(1 &minus; 2&zeta;&sup2;) with &zeta; = 1/2Q. Below Q = 1/&radic;2 there is no peak. At Q = 5: x<sub>C</sub> = '+fmt(PX.q5.xC,6)+', '+fmt(PX.q5.peakVC,5)+' |V<sub>s</sub>|.</p>'

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null;
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(...a){ chk('moveTo',a); }, lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});

}

  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }

  eq(sigf(1.768e8,4),'1.768 × 10⁸','sigf writes a power of ten in superscripts'); eq(sigf(-2.5e-5,2),'-2.5 × 10⁻⁵','a negative power too');
  eq(eng(0.01,'H'),'10.0 mH','engineering notation: 10 mH'); eq(eng(1e-7,'F'),'100 nF','100 nF'); eq(eng(5032.92,'Hz',4),'5.033 kHz','5.033 kHz');

    PERMS.forEach((p,i)=>{ const c=permClass(p); eq(p.id,REF.perm.order[i],'the page’s order is derive’s ('+i+')'); eq(c.cls,REF.perm.cls[i],p.id+' is a '+REF.perm.cls[i]);

    rel(DEFAULTS.pL*0+Math.sqrt(D0.L/D0.C)/cse.R,cse.Qs,1e-15,'Q_s = Z₀/R'); rel(cse.R/Math.sqrt(D0.L/D0.C),cse.Qp,1e-15,'Q_p = R/Z₀');

    ['splane crit',{view:'splane',sR:2*Z0D}],['splane turned',{view:'splane',camTheta:2.1,camPhi:1.2}],['splane narrow ladder',{view:'splane',zsrc:'ladder',lN:7,lkind:'cheby',lfbw:0.01}]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke');
      ok(strokes.length>=10&&texts.length>=6,nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+texts.length+' texts)');
      { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/\^/.test(t.t)){ bad='a caret power: "'+t.t.slice(0,40)+'"'; break; }
        if(/\d[eE][-+]?\d/.test(t.t)){ bad='a raw exponent: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
      let across=null;
      for(const L of LABELS){ if(L.seq===undefined) continue;
        for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
        if(across) break; }
      ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
      if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key and legend item fits ('+KEY_DROPS+' dropped)');
    });
  }
  /* the phasors sweep a disc of radius ext in each cycle: at no phase may an arrow cross the key */
  { let bad=null; const states=[{view:'series'},{view:'series',sR:50,sRs:50,spre:'gen',sx:1.6},{view:'series',sx:0.3},{view:'series',sR:Z0D/50,sx:1.02},
      {view:'parallel'},{view:'parallel',qr:Z0D/2,qpre:'lossy',qx:0.87},{view:'parallel',qR:Z0D/3,qx:1.6}];
    for(const st0 of states){ for(const [W,H] of SIZES){ for(let k=0;k<12&&!bad;k++) withState(Object.assign({},st0,{th:TAU*k/12}),()=>{ const c=makeShot(W,H); drawView(c,W,H,buildModel());
        for(const r of LEGEND_RECTS){ for(let i=0;i<POLY_SEGS.length;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
          if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue; bad=JSON.stringify(st0)+' '+W+'x'+H+', phase '+k+'/12'; break; } if(bad) break; } }); if(bad) break; } if(bad) break; }
    ok(!bad,'no phasor crosses its key at any phase ('+(bad||'7 states, 4 sizes, 12 phases')+')'); }
  withState({view:'splane',sR:2*Z0D},()=>{ const s=readoutHTML(buildModel()); ok(s.indexOf('1 cycle at f₀')>=0&&s.indexOf('1 cycles')<0,'a burst of 1 cycle, not “1 cycles”'); });
  eq([cyclesT(1),cyclesT(2),cyclesT(27.2)].join(', '),'1 cycle, 2 cycles, 27 cycles','the cycle count in words');
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
