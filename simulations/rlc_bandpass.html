<title>RLC band-pass filters &mdash; every arrangement, two resonators, ladders, coupled tanks and a radio dial</title>
<!--
  ===================================================================
  rlc_bandpass.html — the band-pass filters one R, one L and one C
  make, and what is built from them: every arrangement of the three,
  the series and the parallel resonator, ladders of resonators
  (Butterworth, Chebyshev, Bessel), two coupled tanks, the poles
  behind all of them, and a radio dial that moves a band-pass along
  the AM band, with its sound
  ===================================================================

  Seven views.  THE PERMUTATIONS: the twelve ways to put one R, one L
  and one C into the two arms of an L-section (each element in the
  series arm or the shunt arm, the two sharing an arm in series or in
  parallel), each drawn with its response; exactly two pass a band,
  the loop read across R and the tank fed through R, and with the same
  three parts their Q's are reciprocal (Q_s Q_p = 1).  THE SERIES
  RESONATOR: the loop's phasors turning at the drive frequency, the
  voltage across C and across L each Q times the source's at
  resonance, the half-power points (their product f0^2, their
  difference f0/Q), the source's own resistance.  THE PARALLEL
  RESONATOR: the tank's currents, a real coil's resistance, and the
  four "centre" frequencies it separates (1/sqrt(LC), zero phase, the
  largest |Z|, the largest output).  THE LADDER: the low-pass
  prototype turned band-pass, Butterworth, Chebyshev (five ripples)
  or Bessel, order 1 to 7, shunt-first or series-first (the same
  response), the element values, the return loss, the group delay,
  and the spread of element values that grows as 1/FBW^2.  COUPLED
  TANKS: two tanks joined by a top capacitor or a mutual inductance,
  under-, critically and over-coupled, their even and odd modes, and
  the skirts the coupling makes lopsided.  THE S-PLANE: |H(s)| over
  the complex frequency plane for any of them, the poles and zeros,
  and the response to a tone burst.  THE RADIO DIAL: a knob that turns
  a variable capacitor (semicircular, straight-line-frequency or
  equal-ratio plates, each outline computed from its law) or a switch
  of five fixed tuned circuits; one to three ganged stages of coils of
  fixed Q; ten made-up stations on the AM grid; the envelope detector,
  the AGC and the tuning eye; and the sound, computed here and
  streamed to the loudspeaker: a station, a whistle, or the static
  between stations that the AGC turns up to fill it.  Tuned by the
  knob, the rotor, a press on a station (on the dial or the band), or
  the buttons and arrow keys: a 10-kHz channel at a time, or on to the
  next station.

  WHAT IS QUOTED (build_rlc/data/, Wikipedia wikitext fetched 2026-09-23)
  -----------------------------------------------------------------------
  RLC circuit: Q = Z0/R (series) and R sqrt(C/L) (parallel), reciprocal
  for the same parts; the peaks of |V_C| and |V_L|; the lossy coil's
  zero-phase frequency, its largest |Z| and where (Cartwright et al.
  2010); the two band-pass arrangements.  Butterworth filter: g_k.
  Chebyshev filter: Matthaei's recursion, its 17.37 (40/ln 10
  rounded), both forms of the even-order load, the -3 dB frequency,
  the pole ellipse.  Bessel filter: the reverse Bessel polynomial and
  its unit delay.  Prototype filter: the low-pass to band-pass map and
  element transformation.  Coupling coefficient of resonators: eqs.
  (4)-(7).  Intermediate frequency: 455 kHz (AM) and 10.7 MHz (FM).
  Medium wave: 530-1700 kHz in 10 kHz channels (the Americas).  FM
  broadcasting: 270 kHz necessary bandwidth (Carson's rule with RDS).
  For the radio dial: Variable capacitor (semicircular plates, the plate
  shape sets the law, a reduction drive, ganged sections with trimmers,
  2 x 330 pF for AM); Tuned radio frequency receiver (knobs in unison,
  ganging, tracking, two or three stages, the bandwidth of a fixed-Q
  filter growing with frequency); Automatic gain control (full gain on
  weak signals, Terman's 1/10 to 1/5 s); Magic eye tube (the AGC line,
  why the eye); Atmospheric noise (static, heard on an unused
  frequency, white plus impulse noise); Crystal radio (tuning L or C,
  the sliding contact, two stations at once); Envelope detector;
  Rayleigh distribution (its mean and variance).

  WHAT IS COMPUTED HERE AND CHECKED BY build_rlc/derive.py
  --------------------------------------------------------
  Everything else is mathematics, recomputed in derive.py by a route
  that shares no code with this page: the twelve transfer functions
  by sympy and by a nodal solve; the series and parallel closed forms
  by 40-digit root finding on the circuits; every quoted formula at 40
  digits (the printed |Z|max loses 4e-12 in doubles by Q = 1000: this
  page uses a rationalised form); the Chebyshev and Butterworth
  ladders against their ideal responses, the Bessel ladders by a
  Darlington synthesis from the polynomial; each band-pass ladder's
  S21 by a 40-digit chain-matrix product, its poles as zeros of 1/S21,
  its group delay against the phase slope; the coupled pairs by a
  nodal solve; every tone-burst response against an ODE integration
  (DOP853) of the circuit's own state equations; the radio's three plate
  laws and the meshed area of each drawn outline at 40 digits, its tank
  against the narrowband model (2e-3 within 40 kHz) and the sound's
  one-pole stage against the tank (2.2 %), the noise bandwidths of one
  to three stages, and the Rayleigh moments.

  WHAT IS MODELLED
  ----------------
  Ideal lumped elements (a coil's resistance in the parallel view is
  the only loss); resistive terminations; steady-state sinusoids for
  the responses, the exact transient for the tone bursts.  The
  elliptic (Cauer) ladder is not here: it needs extra resonators in
  its arms.  Parasitics, component tolerance and the coupled pairs'
  impedance-matching taps are not modelled.  The radio: made-up
  stations; each stage a buffered tank (no loading between stages);
  the sound on the complex envelope at eight times the audio rate, the
  stations within 40 kHz through the stages' one-pole filters and the
  rest at the tank's exact gain, parked where their beats are
  ultrasonic; each programme held across the sub-samples (a
  zero-order hold, 1.8 % down at 5 kHz); an ideal envelope detector.

  KNOWN-BAD: DO NOT REINTRODUCE (details in the Agent repo,
  projects/simulations/CHANGELOG.md)
  ---------------------------------------------------------
  - Cancellation in closed forms: the half-power point sqrt(1 + 1/4Q^2)
    - 1/2Q (use 1/x2), the printed |Z|max (rationalise), the residue
    sum at a double pole (nudge the pair apart: O(nudge^2)).
  - The position of a smooth maximum found by value is good to sqrt(eps):
    solve for it (the parallel peak's quadratic) or pin it loosely.
  - A window f0(1 +- span) reaches negative frequencies once span > 1
    (Qe < 6 or k > 1/6 for the coupled pair): |H| mirrors there, so a
    scan finds a second top with a dip of zero at DC, and a log axis
    goes NaN.  Windows about f0 are geometric: 1/(1 + span) to 1 + span.
  - The circuit form of a transfer function takes 1/sL and is NaN at
    s = 0, and Math.max(NaN, floor) is NaN: where a window can reach
    s = 0, use the pole form.  A canvas ignores a NaN coordinate
    without a word; the tests count them.
  - A clamp in the model drawn past its limit reads as physics (|S21|
    flat beyond kQ = 0.9 Qe): stop the curve at the limit and say so.
  - Marker lines first, then plated labels: a line drawn over a label
    cuts it.  Two lines closer than a label is wide (the coupled modes,
    f1 and f2 at high Q) take their labels on their outer sides.
  - A legend placed inside a plot can find nowhere clear, and legendR
    then drops it without a word: keys go on the title line (or the
    plot keeps headroom above a passive |S21|), and KEY_DROPS counts
    every drop.
  - A key in a fixed corner of a rotating phasor diagram is crossed at
    some phase: the diagram reserves the disc the chain sweeps in a
    cycle (radius ext) clear of the key.
  - An AGC starts from nothing: a level read 0.4 s after switch-on was
    7 % low and the gain 8 % high.  Measure after several time constants.
  - The static's own peaks reach 6 r.m.s. in a second (the Rayleigh
    envelope's long tail): a crackle detector sits at 10 and more.
  - A window can fall between two Poisson events: fix the seed and
    choose a window that holds events, or count the events.
  - The second-strongest carrier is not the one that whistles: a strong
    station 90 kHz off beats above hearing.  Look within 20 kHz.
  - Keep a stream's state on the absolute sample count (the phasors'
    renormalisation): per chunk, the chunking changes the sound.
  - A slider's label and value are text: an entity (degS's &deg;)
    shows as typed there.
  - The arrow keys belong to a focused slider, and only to it: skip a
    range input, not every input, or the arrows go dead once the
    listen box has been ticked.
  - A snap added to a plot moves old press tests onto its targets: the
    band press at 0.4 (1000 kHz) fell within reach of the 1010-kHz bar.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){

 *  the series resonator: a source (resistance Rs), L and C in series, *
 *  the output across R                                                *
 * ================================================================== */
function seriesAt(o,x){          /* the loop at x = f/f0, for 1 V from the source */

  const o={L,C,R,Rs,w0,f0:w0/TAU,Z0,Q,gain,x1:e[0],x2:e[1],poles:qPoles(Q)};
  o.f1=o.x1*o.f0; o.f2=o.x2*o.f0; o.bw=o.f2-o.f1;

/* ================================================================== *
 *  the parallel resonator: fed through R, a coil (L with series r)    *
 *  across C, the output across the tank                               *
 * ================================================================== */

function parallelModel(L,C,R,r){

/* the maximum of f over [a, b] in log x: a 600-point scan, then golden section in the bracket (a grid argmax

  for(let i=0;i<=n;i++){ const v=f(Math.exp(la+(lb-la)*i/n)); if(v>bv){ bv=v; bi=i; } }
  let lo=la+(lb-la)*Math.max(0,bi-1)/n, hi=la+(lb-la)*Math.min(n,bi+1)/n;
  const gr=(Math.sqrt(5)-1)/2;
  let c=hi-gr*(hi-lo), d=lo+gr*(hi-lo), fc=f(Math.exp(c)), fd=f(Math.exp(d));
  for(let k=0;k<200&&hi-lo>1e-15;k++){
    if(fc>fd){ hi=d; d=c; fd=fc; c=hi-gr*(hi-lo); fc=f(Math.exp(c)); }
    else { lo=c; c=d; fc=fd; d=lo+gr*(hi-lo); fd=f(Math.exp(d)); }

  return Math.exp((lo+hi)/2);

/* ================================================================== *
 *  the low-pass prototypes (g0 = 1, the cut-off at 1 rad/s)           *
 * ================================================================== */
function butterG(N){ const g=[1]; for(let k=1;k<=N;k++) g.push(2*Math.sin((2*k-1)*PI/(2*N))); g.push(1); return g; }

/* ================================================================== *

 * ================================================================== */

    else { A=cadd(A,cmul(B,v)); Cc=cadd(Cc,cmul(D,v)); }

}
/* S21 = 2 sqrt(Rs RL)/(A RL + B + C Rs RL + D Rs), Zin = (A RL + B)/(C RL + D), S11 = (Zin - Rs)/(Zin + Rs) */
function chainS(el,Rs,RL,s,branch){
  const M=chainABCD(el,s,branch);

  const S21=cdiv({re:2*Math.sqrt(Rs*RL),im:0},den);

const lpBranch=(e,s)=>cscale(s,e.g);                 /* a prototype's series L or shunt C of value g */

function lpChain(g,first){
  const N=g.length-2, el=[];
  for(let k=1;k<=N;k++) el.push({kind:((k%2===1)===(first==='shunt'))?'shunt':'series',g:g[k]});

/* ================================================================== *
 *  two coupled tanks, each loaded by R (the source's R at one end,    *
 *  the load at the other).  Each tank alone tunes to f0: capacitive:  *
 *  a top capacitor Ck = k Cres, the tanks' own C = Cres(1 - k);       *

  const halves=ctype==='cap'?[[L,Cres*(1-k)],[L,Cres*(1+k)]]:[[L*(1+k),Cres],[L*(1-k),Cres]];

/* ================================================================== *
 *  time: the response to a tone burst at the centre frequency          *
 *  H(s) = N(s)/prod(s - p_i), s in units of w0, time tau in radians   *
 *  of w0.  The drive sin(tau) for 0 <= tau <= T; each pole adds        *
 *  c_i int_0^min(tau,T) e^{p_i(tau - sigma)} sin(sigma) d sigma, with  *
 *  c_i = N(p_i)/prod_{j != i}(p_i - p_j).  Checked against DOP853 on   *
 *  each circuit's own state equations in derive.py G.                  *
 *  Two poles closer than NUDGE apart (a resonator at Q = 1/2 has a     *
 *  double pole, where the residues divide by zero) are moved to their  *
 *  midpoint -+ NUDGE/2: the divided difference that replaces the pair  *
 *  is even in the separation, so the error is O(NUDGE^2), 1e-10.       *
 * ================================================================== */
const NUDGE=1e-5;
function spreadPoles(poles){
  const p=poles.map(q=>({re:q.re,im:q.im}));
  for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){
    const d=csub(p[i],p[j]), m=cabs(d);
    if(m<NUDGE*Math.max(1,cabs(p[i]))){
      const mid=cscale(cadd(p[i],p[j]),0.5), u=m>0?cscale(d,1/m):{re:1,im:0}, h=cscale(u,NUDGE*Math.max(1,cabs(mid))/2);
      p[i]=cadd(mid,h); p[j]=csub(mid,h);
    }

  return p;
}
function residues(poles,Nfun){
  return poles.map((p,i)=>{ let d={re:1,im:0}; for(let j=0;j<poles.length;j++) if(j!==i) d=cmul(d,csub(p,poles[j])); return cdiv(Nfun(p),d); });
}
function burstAt(P,c,T,tau){
  const Te=Math.min(tau,T); let y={re:0,im:0}, yc={re:0,im:0};
  for(let i=0;i<P.length;i++){
    const p=P[i], ept=cexp(cscale(p,tau));
    const a=cdiv(csub(cexp(cadd({re:0,im:Te},cscale(p,tau-Te))),ept),csub(JJ,p));
    const b=cdiv(csub(cexp(cadd({re:0,im:-Te},cscale(p,tau-Te))),ept),csub({re:0,im:-1},p));
    const t=cmul(c[i],csub(a,b));
    y=cadd(y,{re:t.im/2,im:-t.re/2});       /* (a - b)/2j */
    yc=cadd(yc,cmul(c[i],a));

}

  const P=spreadPoles(poles), c=residues(P,Nfun);

/* the slowest pole's time constant 1/|Re p| (units of 1/w0): how long the filter rings */
function ringTime(poles){ let m=Infinity; for(const p of poles) m=Math.min(m,-p.re); return m>0?1/m:Infinity; }

/* ================================================================== *
 *  THE RADIO DIAL: the knob, the tuned stages, the band, the static   *
 *  RADIO (the coil, the variable section, the trimmer, the stations,  *

 * ================================================================== */
const RAD_CMIN=RADIO.CV0+RADIO.CT, RAD_CMAX=RADIO.CV1+RADIO.CT;
function radF(L,C){ return 1/(TAU*Math.sqrt(L*C)); }
const RAD_FHI=radF(RADIO.L,RAD_CMIN), RAD_FLO=radF(RADIO.L,RAD_CMAX);
const RAD_GEAR=5;              /* the knob turns five times for the rotor's half turn (a reduction drive) */
/* the dial speaks kHz, above 1 MHz too */
function khz(f){ return fmt(f/1e3,f<1e6?1:0)+' kHz'; }
const LAW_LIST=[{id:'slc',name:'semicircular'},{id:'slf',name:'straight-line f'},{id:'log',name:'equal ratios'}];
/* the capacitance with the rotor turned a fraction u of its half turn (0 unmeshed, 1 meshed), for three plate
   shapes: semicircular plates (C proportional to the angle), plates cut for a straight-line frequency scale, and
   plates cut so that every degree changes the frequency by the same ratio */
function lawC(law,u){
  if(law==='slc') return RAD_CMIN+(RAD_CMAX-RAD_CMIN)*u;
  if(law==='slf'){ const f=RAD_FHI-(RAD_FHI-RAD_FLO)*u; return 1/(TAU*TAU*f*f*RADIO.L); }
  return RAD_CMIN*Math.pow(RAD_CMAX/RAD_CMIN,u);
}
function lawDC(law,u){
  if(law==='slc') return RAD_CMAX-RAD_CMIN;
  if(law==='slf'){ const f=RAD_FHI-(RAD_FHI-RAD_FLO)*u; return 2*(RAD_FHI-RAD_FLO)/(TAU*TAU*RADIO.L*f*f*f); }
  return lawC('log',u)*Math.log(RAD_CMAX/RAD_CMIN);

function lawU(law,f){
  const C=1/(TAU*TAU*f*f*RADIO.L);

   Turning by d theta meshes a sliver (r^2 - ri^2)/2 d theta, and C is proportional to the area meshed */
function plateR(law,u){ const ri=RADIO.ri; return Math.sqrt(ri*ri+(1-ri*ri)*lawDC(law,u)/(RAD_CMAX-RAD_CMIN)); }

/* one tuned stage: a coil of fixed Q (its loss r = w0 L/Qc) across the section, driven by a current, so its
   response is the tank's impedance, normalised at f0 = 1/(2 pi sqrt(LC)):
   Z/Z(f0) = [(1/Qc + jx)/(1 - x^2 + jx/Qc)] / [(1/Qc + j)/(j/Qc)],  x = f/f0 */
function radStageH(f,f0,Qc){
  const x=f/f0;
  return cdiv(cdiv({re:1/Qc,im:x},{re:1-x*x,im:x/Qc}),cdiv({re:1/Qc,im:1},{re:0,im:1/Qc}));
}
function radGain(f,f0,Qc,N){ return Math.pow(cabs(radStageH(f,f0,Qc)),N); }

const RAD_NB=1e-4;
/* N identical stages of 3-dB width B: the equivalent noise bandwidth, B (pi/2)(2N-2)!/(4^(N-1)((N-1)!)^2) */
function radENBW(N,B){ let f=1; for(let k=2;k<=2*N-2;k++) f*=k; let g=1; for(let k=2;k<=N-1;k++) g*=k; return B*Math.PI/2*f/(Math.pow(4,N-1)*g*g); }

   plate shape keeps the station and moves the pointer), or the switched tank's own */
function radTuning(st){
  if(st.rmode==='switch'){ const p=RADIO.presets[st.rsw]; return {f0:p.f,L:p.L,C:p.C,sw:true}; }
  const f=clamp(st.rf,RAD_FLO,RAD_FHI); return {f0:f,L:RADIO.L,C:1/(TAU*TAU*f*f*RADIO.L),sw:false};

/* ---- the programmes: pure functions of the time, so any stretch renders the same wherever it starts ---- */
const WT_N=2048;
function wtMake(amps){ const t=new Float64Array(WT_N+1); let pk=0;
  for(let i=0;i<=WT_N;i++){ let v=0; for(let hh=0;hh<amps.length;hh++) v+=amps[hh]*Math.sin(TAU*(hh+1)*i/WT_N); t[i]=v; pk=Math.max(pk,Math.abs(v)); }

const WT={saw:wtMake([1,1/2,1/3,1/4,1/5,1/6]), flute:wtMake([1,0.3,0.1]), bass:wtMake([1,0.25,1/9,1/16,1/25]),

const mtof=m=>440*Math.pow(2,(m-69)/12);
/* the vowels (F1, F2 in Hz): harmonics weighted by two resonances, one table per vowel and speaker */
const VOWELS=[[730,1090],[530,1840],[270,2290],[570,840],[300,870]];
const VOICE_TABS=[115,210].map((f,v)=>VOWELS.map(([F1,F2])=>{ const k=v?1.15:1, a=[];
  for(let hh=1;hh*f<3600;hh++){ const fr=hh*f; a.push(1/(1+Math.pow((fr-F1*k)/90,2))+0.6/(1+Math.pow((fr-F2*k)/130,2))+0.02/hh); }

/* the talk: phrases of seven syllables and a pause; each syllable its own vowel and pitch step (a phase that

const TALK=[0,1].map(v=>{ const base=v?210:115, syl=0.18, n=7, pause=0.45, ps=[], vw=[]; let acc=0; const start=[];
  for(let k=0;k<n;k++){ ps.push(base*(1+0.10*Math.sin(1.7*k+v)-0.035*k)); vw.push((3*k+2*v+1)%5); start.push(acc); acc+=ps[k]*syl; }

function hashN(i){ let x=Math.imul(i^0x9e3779b9,0x85ebca6b); x^=x>>>13; x=Math.imul(x,0xc2b2ae35); x^=x>>>16; return (x>>>0)/4294967296*2-1; }

function bandNoise(t){ const p=t*8000, i=Math.floor(p), f=p-i; return hashN(i)*(1-f)+hashN(i+1)*f; }

  orchestra(t,v){
    const ch=v?[[45,57,60,64],[41,57,60,65],[48,55,60,64],[43,55,59,62]]:[[48,60,64,67],[45,57,60,64],[41,57,60,65],[43,55,59,62]];
    const T=2.4, k=Math.floor(t/T), tt=t-k*T, c=ch[((k%4)+4)%4];
    const env=Math.min(1,tt/0.15)*Math.min(1,(T-tt)/0.3); let s=0;
    for(const m of c){ const f=mtof(m); s+=wtRead(WT.saw,f*t)+wtRead(WT.saw,f*1.003*t+0.37); }
    return 0.9*env*s/8; },
  talk(t,v){
    const P=TALK[v], n=Math.floor(t/P.T), tt=t-n*P.T;
    if(tt>=P.n*P.syl) return 0;
    const k=Math.floor(tt/P.syl), ts=tt-k*P.syl, ph=n*P.cyc+P.start[k]+P.ps[k]*ts;
    const env=Math.pow(Math.sin(Math.PI*ts/P.syl),0.7), tabs=VOICE_TABS[v], a=tabs[P.vw[k]];
    const b=k>0?tabs[P.vw[k-1]]:a, w=Math.min(1,ts/(0.3*P.syl));
    return 0.95*env*(w*wtRead(a,ph)+(1-w)*wtRead(b,ph)); },
  piano(t,v){
    const seq=v?[57,60,64,69,64,60,64,69]:[60,64,67,72,71,67,64,62], d=v?0.25:0.35, k=Math.floor(t/d); let s=0;
    for(let j=k-3;j<=k;j++){ const age=t-j*d; if(age<0) continue; const m=seq[((j%8)+8)%8];

    return 0.55*s; },
  melody(t,v){
    const seq=v?[62,65,67,69,67,65,62,60]:[67,69,72,74,72,69,67,64], d=v?0.45:0.5, k=Math.floor(t/d), tt=t-k*d;
    const f=mtof(seq[((k%8)+8)%8]), env=Math.min(1,tt/0.03)*Math.min(1,(d-tt)/0.03);
    const ph=f*tt+0.005*f/(TAU*5)*(1-Math.cos(TAU*5*tt));

  pips(t){
    const s=t-Math.floor(t), long=(Math.floor(t)%10)===0, on=s<(long?0.5:0.1);

  band(t){

    const fb=mtof(bass[((k%16)+16)%16]), eb=Math.min(1,tt/0.01)*Math.exp(-tt/0.5);
    const riff=[72,75,77,79,77,75,72,70], km=Math.floor(t/(2*d)), tm=t-km*2*d, fm=mtof(riff[((km%8)+8)%8]);

};
function progAt(k,t){ const s=RADIO.stations[k]; return PROG[s.prog](t,s.var); }
const progAtAir=progAt;

/* ---- the receiver ----
   The aerial carries every station and white noise (static).  The sound is computed on the complex envelope
   about the tuned frequency, eight samples for each audio sample: stations within RAD_NEAR of the dial pass
   through the stages' own filters (one pole each, the narrowband tank); stations farther away enter after them
   at the tank's exact gain, parked at stand-in offsets a quarter of the rate and more apart, where every beat
   they could make is ultrasonic.  Then the diode detector (the envelope, smoothed by its RC) and the AGC, which
   holds the carrier's level: with no carrier it runs at full gain and the static fills the loudspeaker. */
const RAD_R=8, RAD_NEAR=40e3, RAD_M=0.6, RAD_DET=7000, RAD_TAU=0.15, RAD_G=0.25, RAD_KSTATIC=0.5, RAD_CRACK=3;

const RAD_MU_REF=Math.sqrt(Math.PI/2)*Math.sqrt(RAD_NB*radENBW(2,1e6/60)/2);

function radRng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }

  const sd=Math.sqrt(RAD_NB*fsr/2)*(o.noise===undefined?1:o.noise);

    sub:0, crackAt:-1, sumD:0, cntD:0, last:{lev:0,g:0,D:0}, env:{s1:0,s2:0,n:0,on:!!o.stats}};

      else far.push({k,gA:radGain(f,fA,Qc,N),gB:radGain(f,fB,Qc,N)}); }

        const env=Math.sqrt(zr*zr+zi*zi);

/* a stretch of the loudspeaker's signal for the picture: a fresh receiver, its AGC settled on a 30-ms pre-roll */
function radioPreview(tune,ms,fs){

  const pre=new Float32Array(Math.round(0.03*e.fs)); e.render(pre,0,pre.length);
  e.lev=e.sumD/e.cntD;
  const y=new Float32Array(Math.round(ms/1000*e.fs)); e.render(y,0,y.length);
  return {y,fs:e.fs,lev:e.lev,g:e.last.g};

/* ================================================================== *
 *  state, presets, the clock, the six view models, the readout /     *
 *  equation bar / tag                                                 *
 * ================================================================== */
const TABS=[['perm','the permutations'],['series','the series resonator'],['parallel','the parallel resonator'],

/* role colours: green = the computed response (the output), orange = a reference or a warning, magenta = the

const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6', text:'#cfd4de', faint:'#3a4256',

const LIM={R:[1,1e5], L:[1e-6,1], C:[1e-12,1e-4], sR:[0.1,1e4], Rs:[0,500], x:[0.1,10], qR:[1,1e7], r:[0.01,3000],

const LOGN=1000;
function logOf(v,lo,hi){ return clamp(Math.round(LOGN*Math.log(v/lo)/Math.log(hi/lo)),0,LOGN); }
function ofLog(u,lo,hi){ return lo*Math.pow(hi/lo,clamp(u,0,LOGN)/LOGN); }

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the clock: the phasors turn once in TURN_S seconds of wall time ---- */
const SIM={th:0};
const FRAME=1/60, TURN_S=2.5;
function simReset(){ SIM.th=0; }
/* a whole number of cycles, in words that agree with it */
function cyclesT(n){ const k=Math.round(n); return k+(k===1?' cycle':' cycles'); }
function viewAnimates(st){ return (st.view==='series'&&st.sturn)||(st.view==='parallel'&&st.qturn); }
function runStep(st){
  if(!viewAnimates(st)) return false;
  SIM.th+=TAU*FRAME/TURN_S; SIM.th-=TAU*Math.floor(SIM.th/TAU);
  return true;
}

/* ---- the permutations ---- */
function logGrid(a,b,n){ const out=[]; for(let i=0;i<=n;i++) out.push(a*Math.pow(b/a,i/n)); return out; }
function permModel(st){
  const R=st.pR, L=st.pL, C=st.pC, w0=1/Math.sqrt(L*C), Z0=Math.sqrt(L/C);
  return memo('perm',[R,L,C].join(),()=>{
    const xs=logGrid(0.02,50,220), cells=PERMS.map(p=>{
      const cl=permClass(p), H=xs.map(x=>permH(p,{re:0,im:x*w0},R,L,C));
      return {p,cl,Q:permQ(p,R,L,C),mag:H.map(h=>dB(cabs(h))),ph:H.map(h=>carg(h)*RAD),H};
    });
    const Qs=Z0/R, Qp=R/Z0;
    return {R,L,C,w0,f0:w0/TAU,Z0,Qs,Qp,xs,cells,edgesS:bpEdges(Qs),edgesP:bpEdges(Qp)};
  });
}
function permCensus(){ const n={'band-pass':0,'band-stop':0,'low-pass':0,'high-pass':0}; for(const p of PERMS) n[permClass(p).cls]++; return n; }
function permSel(st){ return PERMS.find(p=>p.id===st.psel)||PERMS[0]; }

/* ---- the two resonators ---- */
function seriesView(st){
  const o=memo('ser',[st.sL,st.sC,st.sR,st.sRs].join(),()=>{
    const o=seriesModel(st.sL,st.sC,st.sR,st.sRs), xs=logGrid(0.1,10,400);
    o.xs=xs; o.curves=xs.map(x=>seriesAt(o,x));
    return o; });
  return {o,drive:seriesAt(o,st.sx),x:st.sx,th:SIM.th};
}
function parallelView(st){
  const o=memo('par',[st.qL,st.qC,st.qR,st.qr].join(),()=>{
    const o=parallelModel(st.qL,st.qC,st.qR,st.qr), xs=logGrid(0.1,10,400);
    o.xs=xs; o.curves=xs.map(x=>parallelAt(o,x));
    return o; });
  /* the window holding the four centres: their spread, or a fraction of the output's band when they coincide */
  const zoom=memo('parz',[st.qL,st.qC,st.qR,st.qr].join(),()=>{
    const fx=[1,o.xupf||1,o.xmax||1,o.peak.x>0?o.peak.x:1], a=Math.min(...fx), b=Math.max(...fx);
    const bw=isFinite(o.x3lo)?o.x3hi-o.x3lo:0.2, pad=Math.max(0.45*(b-a),0.12*bw,1e-4);
    const lo=Math.max(a-pad,1e-3), hi=b+pad, xs=[]; for(let i=0;i<=300;i++) xs.push(lo+(hi-lo)*i/300);
    const zz=xs.map(x=>cabs(parallelAt(o,x).Zt)), hh=xs.map(x=>cabs(parallelAt(o,x).H));
    const zmx=Math.max(...zz), hmx=Math.max(...hh);
    return {lo,hi,xs,z:zz.map(v=>v/zmx),h:hh.map(v=>v/hmx)}; });
  return {o,zoom,drive:parallelAt(o,st.qx),x:st.qx,th:SIM.th};
}

/* ---- the ladder ---- */
function ladderView(st){
  const N=st.lN;
  return memo('lad',[st.lkind,st.lrip,N,st.lf0,st.lfbw,st.lR0,st.lfirst].join(),()=>{
    const D=bpDesign(st.lkind,N,st.lf0,st.lfbw,st.lR0,st.lfirst,st.lrip);
    /* the frequency axis: four bandwidths either side of the band in log x, never less than 0.5..2 for a wide one */
    const span=Math.max(Math.log(D.x2d)*5,0.08), xs=logGrid(Math.exp(-span),Math.exp(span),500);
    const S=xs.map(x=>ladderAt(D,x));
    const s21=S.map(q=>dB(cabs(q.S21)*cabs(q.S21))), s11=S.map(q=>dB(Math.max(cabs(q.S11)*cabs(q.S11),1e-30)));
    const tau=xs.map(x=>groupDelay(D.poles,x)/(TAU*D.f0));       /* seconds */
    const e3=edges3(x=>{ const q=ladderAt(D,x).S21; return q.re*q.re+q.im*q.im; },1);
    /* the other two types at the same order and band, for the overlay (Chebyshev needs N >= 2) */
    const others=[];
    for(const k of ['butter','cheby','bessel']){ if(k===st.lkind) continue;
      const Dk=bpDesign(k,N,st.lf0,st.lfbw,st.lR0,'shunt',st.lrip);
      others.push({kind:k,s21:xs.map(x=>{ const q=ladderAt(Dk,x).S21; return dB(q.re*q.re+q.im*q.im); }),tau:xs.map(x=>groupDelay(Dk.poles,x)/(TAU*Dk.f0))}); }
    return {D,N,xs,s21,s11,tau,e3,others,eps:st.lkind==='cheby'?chebEps(st.lrip):null};
  });
}

/* ---- the coupled tanks ---- */
function coupledView(st){
  return memo('cp',[st.cct,st.cf0,st.cQe,st.ckQ,st.cR].join(),()=>{
    const o=coupledModel(st.cct,st.cf0,st.cQe,st.ckQ,st.cR);
    /* the near plot is geometric about f0, like its axis: 1 +- span would cross zero frequency at small Qe or large k */
    const span=Math.max(5*o.k,5/o.Qe,0.02), xs=logGrid(1/(1+span),1+span,500);
    const near=xs.map(x=>dB(cabs(coupledAt(o,x))));
    /* both couplings on a wide log axis: the skirts */
    const other=coupledModel(st.cct==='cap'?'ind':'cap',st.cf0,st.cQe,st.ckQ,st.cR);
    const wx=logGrid(0.05,20,400), wide={cap:null,ind:null};
    wide[st.cct]=wx.map(x=>dB(Math.max(cabs(coupledAt(o,x)),1e-12))); wide[other.ctype]=wx.map(x=>dB(Math.max(cabs(coupledAt(other,x)),1e-12)));
    /* the transmission at f0 against kQ: exact for the capacitive pair, 2kQ/(1 + (kQ)^2) */
    /* the transmission at f0 against kQ, as far as k < K_MAX allows: beyond kQ = K_MAX Qe the model holds k */
    const kqMax=Math.min(10,K_MAX*st.cQe), kx=logGrid(0.1,kqMax,200), kc=kx.map(kq=>cabs(coupledAt(coupledModel(st.cct,st.cf0,st.cQe,kq,st.cR),1)));
    return {o,other,xs,near,wx,wide,kx,kc,kqMax,span};
  });
}

/* ---- the s-plane: the chosen filter's poles, zeros and transfer function, s in units of w0 ---- */
function splaneSource(st){
  const src=st.zsrc;
  if(src==='series'){ const o=seriesView(st).o, g=o.gain, Q=o.Q;
    return {src,name:'the series resonator',poles:o.poles,zeros:[{re:0,im:0}],order:2,f0:o.f0,
      H:s=>cdiv(cscale(s,g/Q),cadd(cadd(cmul(s,s),cscale(s,1/Q)),{re:1,im:0})),N:p=>cscale(p,g/Q),note:'Q = '+sigf(Q,4)}; }
  if(src==='parallel'){ const o=parallelView(st).o, k=o.Z0/o.R, z=o.zero;
    const Nf=p=>cscale(z===null?p:csub(p,{re:z,im:0}),k);
    return {src,name:'the parallel resonator',poles:o.poles,zeros:z===null?[]:[{re:z,im:0}],order:2,f0:o.f0,
      H:s=>cdiv(Nf(s),cadd(cadd(cmul(s,s),cscale(s,o.a1)),{re:o.a0,im:0})),N:Nf,note:'pole Q = '+sigf(o.Qpole,4)}; }
  if(src==='ladder'){ const L=ladderView(st), D=L.D, zs=[]; for(let i=0;i<D.N;i++) zs.push({re:0,im:0});
    return {src,name:'the ladder',poles:D.poles,zeros:zs,order:2*D.N,f0:D.f0,H:s=>polesH(D.G,D.N,D.poles,s),N:p=>cscale(cpow(p,D.N),D.G),
      note:kindName(D.kind,D.LAr)+', N = '+D.N}; }
  const o=coupledView(st).o, zs=[]; for(let i=0;i<o.Npow;i++) zs.push({re:0,im:0});
  /* the pole form, not coupledS: the circuit form takes 1/sL and is NaN at s = 0, where the window can reach */
  return {src,name:'the coupled pair',poles:o.poles,zeros:zs,order:4,f0:o.f0,H:s=>polesH(o.Nc,o.Npow,o.poles,s),N:p=>cscale(cpow(p,o.Npow),o.Nc),
    note:(o.ctype==='cap'?'capacitive':'inductive')+', kQ = '+sigf(o.kQ,3)};
}
function kindName(kind,LAr){ return kind==='butter'?'Butterworth':kind==='cheby'?'Chebyshev '+LAr+' dB':'Bessel'; }
function splaneView(st){
  const S=splaneSource(st);
  const key=[st.zsrc,st.zlen,JSON.stringify(S.poles.map(p=>[p.re,p.im]))].join('|');
  return memo('sp',key,()=>{
    /* the window: around the upper half-plane poles, each axis fitted to what it holds */
    const up=S.poles.filter(p=>p.im>=0), sig=Math.max(...S.poles.map(p=>-p.re));
    let wlo=Math.min(...up.map(p=>p.im)), whi=Math.max(...up.map(p=>p.im));
    const span=Math.max(whi-wlo,2*sig,0.02)*1.1, c=(wlo+whi)/2;
    const win={s0:-2*sig,s1:0.6*sig,w0:Math.max(0,c-span),w1:c+span};
    if(win.w0<0.02) win.w0=0;
    /* a zero off the origin (the lossy tank's, at -1/Qc) is shown with its pit: the window reaches down to it */
    for(const z of S.zeros) if(z.re<0&&z.re>-4*Math.max(1,sig)){ win.w0=0; win.s0=Math.min(win.s0,1.25*z.re); }
    /* the burst: automatic length, in the slowest pole's ring time */
    const tr=ringTime(S.poles), T=Math.max(TAU,Math.round(st.zlen*tr/TAU)*TAU), tend=T+6*tr;
    /* 24 samples a cycle while the carrier is drawn (up to 160 cycles), else 800 for the envelope alone */
    const cyc=tend/TAU, nt=cyc<=160?Math.max(400,Math.ceil(cyc*24)):800, taus=[]; for(let i=0;i<=nt;i++) taus.push(tend*i/nt);
    const resp=burstSeries(S.poles,S.N,T,taus);
    /* the surface: 20 log |H| on a grid */
    const n=44, grid=[];
    for(let i=0;i<=n;i++){ const row=[]; for(let j=0;j<=n;j++){
      const s={re:win.s0+(win.s1-win.s0)*j/n,im:win.w0+(win.w1-win.w0)*i/n}; row.push(dB(Math.max(cabs(S.H(s)),1e-9))); } grid.push(row); }
    const axis=[]; for(let i=0;i<=200;i++){ const w=win.w0+(win.w1-win.w0)*i/200; axis.push([w,dB(Math.max(cabs(S.H({re:0,im:w})),1e-9))]); }
    return {S,win,tr,T,tend,taus,resp,grid,n,axis};
  });
}

/* ---- the radio dial ---- */
/* the rotor's fraction of its half turn for the station tuned (the dial's plate law), and the knob's own angle
   (clockwise, radians: the reduction drive turns it RAD_GEAR times as far; the switch clicks every 30 degrees) */
function radioU(st){ return st.rmode==='switch'?lawU(st.rlaw,RADIO.presets[st.rsw].f):clamp(lawU(st.rlaw,st.rf),0,1); }
function knobAngle(st){ return st.rmode==='switch'?st.rsw*PI/6:(1-radioU(st))*PI*RAD_GEAR; }
/* moving through the band, as the buttons and the arrow keys do.  The capacitor steps one channel of the grid
   (10 kHz; from between two channels, to the next one that way) and stops at the ends of the dial.  A seek goes
   to the next station on the air; a station within RAD_ON of the dial is the one tuned, so the seek goes on past
   it.  The switch has nothing in between: a step and a seek both click it one position. */
const RAD_STEP=DATA.am_step_khz*1e3, RAD_ON=1e3;
const RAD_FREQS=RADIO.stations.map(s=>s.f).sort((a,b)=>a-b);
/* where a move takes the set, or null when it can go no further that way */
function radioMove(st,how,dir){
  if(st.rmode==='switch'){ const k=st.rsw+dir; return k>=0&&k<RADIO.presets.length?{rsw:k}:null; }
  const f=clamp(st.rf,RAD_FLO,RAD_FHI);
  let g;
  if(how==='step'){ const q=f/RAD_STEP; g=clamp((dir>0?Math.floor(q+1e-6)+1:Math.ceil(q-1e-6)-1)*RAD_STEP,RAD_FLO,RAD_FHI); }
  else { const c=RAD_FREQS.filter(x=>dir>0?x>f+RAD_ON:x<f-RAD_ON); if(!c.length) return null; g=dir>0?c[0]:c[c.length-1]; }
  return g!==f?{rf:g}:null;
}
function radioGo(st,how,dir){ const m=radioMove(st,how,dir); if(!m) return false; Object.assign(st,m); st.rpre='own'; return true; }
/* a press on a station or on the band: the capacitor tunes there, the switch clicks to the nearest circuit it has */
function radioTuneTo(st,f){
  st.rpre='own';
  if(st.rmode==='switch'){ let k=0; RADIO.presets.forEach((p,i)=>{ if(Math.abs(p.f-f)<Math.abs(RADIO.presets[k].f-f)) k=i; }); st.rsw=k; }
  else st.rf=clamp(f,RAD_FLO,RAD_FHI);
}
function radioHear(R){
  const d=R.d, nm=k=>fmt(RADIO.stations[k].f/1e3,0)+' kHz';
  if(R.hear.kind==='whistle') return {short:'two stations and a whistle',long:nm(R.hear.k)+' and '+nm(R.hear.k2)+' both pass: a '+fmt(Math.abs(R.hear.f2-R.hear.f)/1e3,0)+'-kHz whistle between their carriers'};
  if(R.hear.kind==='station') return {short:nm(d.k)+', '+PROG_NAME[d.prog],long:'the station at '+nm(d.k)+' ('+PROG_NAME[d.prog]+'), '+fmt(d.cnr,1)+' dB over the static'};
  if(R.hear.kind==='weak') return {short:nm(d.k)+' in the static',long:'the weak station at '+nm(d.k)+' ('+PROG_NAME[d.prog]+'), '+fmt(d.cnr,1)+' dB over the static'};
  return {short:'static',long:R.hear.k>=0?'static, with '+nm(d.k)+' faint behind it ('+fmt(d.cnr,1)+' dB)':'static: no station within reach'};
}
function radioView(st){
  const T=radTuning(st), N=st.rN, Qc=st.rQ, B=T.f0/Qc, enbw=radENBW(N,B);
  return memo('radio',[st.rmode,st.rlaw,st.rf,st.rsw,N,Qc,st.ragc,st.rcrack].join(),()=>{
    /* the static in the receiver's noise bandwidth, dB over the static in 10 kHz (the stations' reference) */
    const floor=10*Math.log10(enbw/1e4);
    const sts=RADIO.stations.map((s,k)=>{ const g=radGain(s.f,T.f0,Qc,N); return {k,f:s.f,dB:s.dB,prog:s.prog,g,lev:s.dB+dB(g),cnr:s.dB+dB(g)-floor}; });
    const by=sts.slice().sort((a,b)=>b.lev-a.lev), d=by[0], d2=by[1];
    /* what reaches the loudspeaker: a station 15 dB over the static is clear; another carrier within 20 kHz of it and
       within 25 dB of its level beats with it (the whistle).  Only those count: the detector turns a carrier farther
       off into a beat above hearing, however strong it is.  Under 3 dB it is static. */
    let hear;
    if(d.cnr>=15){ hear={kind:'station',k:d.k,f:d.f};
      const w=sts.filter(s=>s.k!==d.k&&Math.abs(s.f-d.f)<=20e3&&s.lev>=d.lev-25).sort((a,b)=>b.lev-a.lev)[0];
      if(w) hear={kind:'whistle',k:d.k,f:d.f,k2:w.k,f2:w.f}; }
    else if(d.cnr>=3) hear={kind:'weak',k:d.k,f:d.f};
    else hear={kind:'static',k:d.cnr>-6?d.k:-1,f:d.f};
    const fs=[]; for(let i=0;i<=500;i++) fs.push(RAD_BAND[0]+(RAD_BAND[1]-RAD_BAND[0])*i/500);
    const resp=fs.map(f=>dB(radGain(f,T.f0,Qc,N)));
    const pv=radioPreview({f0:T.f0,N,Qc,agc:st.ragc,crack:st.rcrack},40);
    const R={T,N,Qc,B,B3:B*Math.sqrt(Math.pow(2,1/N)-1),enbw,floor,sts,d,d2,hear,fs,resp,pv,eye:eyeClose(pv.lev),u:radioU(st),law:st.rlaw};
    R.say=radioHear(R);
    return R;
  });
}

function buildModel(){
  const st=ST, v=st.view, M={view:v,st};
  if(v==='perm') M.P=permModel(st);
  if(v==='series') M.S=seriesView(st);
  if(v==='parallel') M.Q=parallelView(st);
  if(v==='ladder') M.L=ladderView(st);
  if(v==='coupled') M.K=coupledView(st);
  if(v==='splane') M.Z=splaneView(st);
  if(v==='radio') M.RD=radioView(st);
  return M;
}

 *  number formatting, readout / equation bar / tag                    *

const PREFIX=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f']];
/* engineering notation: 10 mH, 100 nF, 5.03 kHz, 316 Ω */
function eng(x,unit,n){
  if(!isFinite(x)) return x>0?'∞ '+unit:'—';
  if(x===0) return '0 '+unit;
  const a=Math.abs(x), d=n||3;
  for(const [m,p] of PREFIX) if(a>=m*(1-5*Math.pow(10,-d-1))) return sigf(Number((x/m).toPrecision(d)),d)+' '+p+unit;
  return sigf(x/1e-15,d)+' f'+unit;
}
const hz=(f,n)=>eng(f,'Hz',n), ohm=(r,n)=>eng(r,'Ω',n), henry=(l,n)=>eng(l,'H',n), farad=(c,n)=>eng(c,'F',n);
/* a number in powers of ten for HTML: 4.2&times;10<sup>&minus;7</sup> */
function sci(x,n){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e); return fmt(m,n===undefined?2:n)+'&times;10<sup>'+String(e).replace('-','&minus;')+'</sup>'; }
function dbT(v,n){ return isFinite(v)?(v<0?'−':'')+fmt(Math.abs(v),n===undefined?2:n)+' dB':'—'; }
function degS(d,n){ return (d<0?'−':'')+fmt(Math.abs(d),n===undefined?1:n)+'&deg;'; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function presetName(list,id){ const p=(list||[]).find(q=>q.id===id); return p?p.name:'your own'; }

function noteFor(v){

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){

  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }

function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y1);
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }
  }

}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }
  }
  /* nothing clear: the legend is dropped rather than laid over a curve or a label (the captions
     name the colours); clebsch_gordan: forcing it in a big box put it on the mean's label */
  if(!pick){ KEY_DROPS+=items.length; return; }
  legendBox(ctx,pick[0],pick[1],items);
  const lb=[pick[0],pick[1],pick[0]+bw,pick[1]+bh]; lb.t='the legend'; lb.plate=true; lb.seq=++DRAW_SEQ; LABELS.push(lb);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));

function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps

function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }

  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }

/* ================================================================== *
 *  schematics (screen px).  Every part runs from (x0,y0) to (x1,y1):   *
 *  a body centred on the segment, leads to both ends.  Drawn as        *
 *  explicit polylines (no arcs under a transform: the display-list     *
 *  recorder would lose them).                                          *
 * ================================================================== */
let HIT=[], W_STAGE=1100, H_STAGE=712;
function sWire(ctx,pts,col,lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=col||COL.wire; ctx.lineWidth=lw||1.2; ctx.lineJoin='round'; ctx.stroke();
}
function sDot(ctx,x,y,col){ dot(ctx,x,y,2.2,col||COL.wire,null); }
function sTerm(ctx,x,y,col){ dot(ctx,x,y,3,'#070b18',col||COL.wire,1.2); }
const PART_COL=k=>k==='R'||k==='Rs'||k==='r'?(k==='R'?COL.R:COL.Rs):k==='L'?COL.L:COL.C;
/* kind 'R' | 'L' | 'C'; sz scales the body (1: a 30-px body, 0.5 for the census thumbnails); returns the body's
   centre and the unit normal (for a label beside it) */
function sPart(ctx,kind,x0,y0,x1,y1,col,sz){
  const len=Math.hypot(x1-x0,y1-y0); if(len<2) return null;
  const ux=(x1-x0)/len, uy=(y1-y0)/len, nx=-uy, ny=ux, s=sz||1;
  const P=(t,o)=>[x0+ux*t+nx*o,y0+uy*t+ny*o];
  const body=kind==='C'?Math.max(4,7*s):Math.min(30*s,len*0.72), a=(len-body)/2;
  sWire(ctx,[[x0,y0],P(a,0)]); sWire(ctx,[P(a+body,0),[x1,y1]]);
  ctx.beginPath();
  if(kind==='R'){ const n=6, amp=4.6*s; let q=P(a,0); ctx.moveTo(q[0],q[1]);
    for(let i=0;i<n;i++){ q=P(a+body*(i+0.5)/n,(i%2?-1:1)*amp); ctx.lineTo(q[0],q[1]); }
    q=P(a+body,0); ctx.lineTo(q[0],q[1]); }
  else if(kind==='L'){ const n=4, rr=body/(2*n);
    for(let i=0;i<n;i++){ const c=a+rr*(2*i+1);
      for(let k=0;k<=10;k++){ const th=PI*k/10, q=P(c-rr*Math.cos(th),-rr*1.15*Math.sin(th)); if(i===0&&k===0) ctx.moveTo(q[0],q[1]); else ctx.lineTo(q[0],q[1]); } } }
  else { const hh=Math.max(5,9.5*s); let q=P(a,-hh); ctx.moveTo(q[0],q[1]); q=P(a,hh); ctx.lineTo(q[0],q[1]);
    q=P(a+body,-hh); ctx.moveTo(q[0],q[1]); q=P(a+body,hh); ctx.lineTo(q[0],q[1]); }
  ctx.strokeStyle=col||COL.part; ctx.lineWidth=kind==='C'?2.1:1.7; ctx.lineJoin='round'; ctx.stroke();
  return {c:P(len/2,0),n:[nx,ny],half:kind==='C'?Math.max(5,9.5*s):(kind==='R'?4.6*s:body/8*1.15)};
}
/* a vertical source between yTop and yBot: a circle with a sine in it */
function sSource(ctx,x,yTop,yBot,s){
  const r=Math.max(6,10*(s||1)), yc=(yTop+yBot)/2;
  sWire(ctx,[[x,yTop],[x,yc-r]]); sWire(ctx,[[x,yc+r],[x,yBot]]);
  const pts=[]; for(let i=0;i<=24;i++){ const t=TAU*i/24; pts.push([x+r*Math.cos(t),yc+r*Math.sin(t)]); }
  sWire(ctx,pts,COL.src,1.4);
  const sw=[]; for(let i=0;i<=16;i++){ const u=i/16; sw.push([x-0.55*r+1.1*r*u,yc-0.38*r*Math.sin(TAU*u)]); }
  sWire(ctx,sw,COL.src,1.2);
  return r;
}
function sGround(ctx,x,y){
  for(let i=0;i<3;i++){ const w=9-3*i; sWire(ctx,[[x-w,y+4*i],[x+w,y+4*i]],COL.wire,1.2); }
}
/* an arm of one part, or two in series ('ser', end to end) or in parallel ('par', side by side) */
function sArm(ctx,parts,conn,x0,y0,x1,y1,sz,labels){
  const s=sz||1, out=[];
  if(parts.length===1){ out.push([parts[0],sPart(ctx,parts[0],x0,y0,x1,y1,PART_COL(parts[0]),s),-1]); }
  else if(conn==='ser'){ const mx=(x0+x1)/2, my=(y0+y1)/2;
    out.push([parts[0],sPart(ctx,parts[0],x0,y0,mx,my,PART_COL(parts[0]),s),-1]); out.push([parts[1],sPart(ctx,parts[1],mx,my,x1,y1,PART_COL(parts[1]),s),-1]); }
  else { const len=Math.hypot(x1-x0,y1-y0), ux=(x1-x0)/len, uy=(y1-y0)/len, nx=-uy, ny=ux, d=Math.max(6,11*s), e=Math.min(9*s+3,len*0.16);
    const A=[x0+ux*e,y0+uy*e], B=[x1-ux*e,y1-uy*e];
    sWire(ctx,[[x0,y0],A]); sWire(ctx,[B,[x1,y1]]);
    sWire(ctx,[[A[0]+nx*d,A[1]+ny*d],[A[0]-nx*d,A[1]-ny*d]]); sWire(ctx,[[B[0]+nx*d,B[1]+ny*d],[B[0]-nx*d,B[1]-ny*d]]);
    out.push([parts[0],sPart(ctx,parts[0],A[0]-nx*d,A[1]-ny*d,B[0]-nx*d,B[1]-ny*d,PART_COL(parts[0]),s),-1]);
    out.push([parts[1],sPart(ctx,parts[1],A[0]+nx*d,A[1]+ny*d,B[0]+nx*d,B[1]+ny*d,PART_COL(parts[1]),s),1]);
    sDot(ctx,A[0],A[1]); sDot(ctx,B[0],B[1]); }
  return out;
}
/* the arms of an arrangement: 'across' S: the series arm is the rest in series, the shunt arm S in series;
   'through' S: the series arm is S in parallel, the shunt arm the rest in parallel */
function permArms(p){
  const S=p.S.split(''), rest=['R','L','C'].filter(e=>S.indexOf(e)<0);
  return p.fam==='across'?{a1:rest,c1:'ser',a2:S,c2:'ser'}:{a1:S,c1:'par',a2:rest,c2:'par'};
}
/* one L-section in a box: the source at the left, the series arm along the top, the shunt arm down to the
   bottom rail, the output terminals at the right.  Returns the parts drawn (for labels). */
function drawLSection(ctx,b,p,sz,opts){
  const o=opts||{}, A=permArms(p), s=sz||1;
  const xs=b.x+Math.max(10,14*s), xo=b.x+b.w*0.64, xt=b.x+b.w-Math.max(6,9*s), yt=b.y+Math.max(12,16*s), yb=b.y+b.h-Math.max(6,8*s);
  sSource(ctx,xs,yt,yb,s*0.9);
  const parts=[];
  parts.push(...sArm(ctx,A.a1,A.c1,xs,yt,xo,yt,s));
  parts.push(...sArm(ctx,A.a2,A.c2,xo,yt,xo,yb,s));
  sWire(ctx,[[xo,yt],[xt,yt]]); sWire(ctx,[[xs,yb],[xt,yb]]);
  sDot(ctx,xo,yt); sDot(ctx,xo,yb); sTerm(ctx,xt,yt,o.termCol); sTerm(ctx,xt,yb,o.termCol);
  return {parts,xs,xo,xt,yt,yb};
}
/* a value label beside a part: on the side of its normal that faces away from the circuit's middle */
function partLabel(ctx,part,txt,col,side){
  if(!part) return;
  const [nx,ny]=part.n, sgn=side||1, off=part.half+7;
  const x=part.c[0]+nx*off*sgn, y=part.c[1]+ny*off*sgn;
  const al=Math.abs(nx)>0.5?(nx*sgn>0?'left':'right'):'center', bl=Math.abs(ny)>0.5?(ny*sgn>0?'top':'bottom'):'middle';
  lab(ctx,W_STAGE,H_STAGE,x,y,txt,col||COL.text,'10.5px -apple-system, sans-serif',al,bl,PLATE);
}

/* ================================================================== *
 *  plotting over frequency (log x) and the first three views          *
 * ================================================================== */
/* a tick label with its prefix: 5 kHz, 2.5 kHz, 1 MHz, 316 Ω */
const tkv=v=>String(Number(v.toPrecision(3)));
function engT(x,unit){
  if(x===0) return '0'+(unit?' '+unit:'');
  const a=Math.abs(x);
  for(const [m,p] of PREFIX) if(a>=m*0.9995){ const v=Number((x/m).toPrecision(4)); return String(v)+' '+p+(unit||''); }
  return String(x);
}
/* ticks for a frequency axis: the 1-2-5 sequence when it gives at least three, else linear steps */
function freqTicks(lo,hi,maxN){
  const out=[], e0=Math.floor(Math.log10(lo))-1, e1=Math.ceil(Math.log10(hi))+1;
  for(let e=e0;e<=e1;e++) for(const m of [1,2,5]){ const v=m*Math.pow(10,e); if(v>=lo*0.99999&&v<=hi*1.00001) out.push(v); }
  /* a range narrower than a factor 4 gets linear steps (nearly even on a log axis there); a wider one keeps the
     1-2-5 sequence, thinned to the decades (or every other value) when it would crowd */
  if(hi/lo<4) return ticksFor(lo,hi,Math.max(2,maxN)).filter(v=>v>0);
  let t=out;
  if(t.length>maxN){ const dec=t.filter(v=>Math.abs(Math.log10(v)-Math.round(Math.log10(v)))<1e-9); t=dec.length>=2?dec:t.filter((v,i)=>i%2===0); }
  /* many decades: every k-th one */
  if(t.length>maxN){ const k=Math.ceil(t.length/maxN); t=t.filter((v,i)=>i%k===0); }
  return t;
}
/* a log-frequency plot: x in log10(Hz) data space; returns the mapping */
function fPlot(ctx,b,flo,fhi,ylo,yhi,o){
  /* as many ticks as their labels fit: about 70 px each (90 on a narrow range, whose labels are longer) */
  const xt=freqTicks(flo,fhi,Math.max(2,Math.min(7,Math.floor(b.w/(fhi/flo<4?90:70))))).map(Math.log10);
  const opt=Object.assign({xticks:xt,xfmt:t=>engT(Math.pow(10,t),'Hz'),ny:b.h<90?3:5},o||{});
  /* the y tick at the bottom edge would meet the first x tick at the corner: drop it */
  const yt=(opt.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),opt.ny)).filter(t=>t>ylo+1e-9*Math.abs(yhi-ylo));
  opt.yticks=yt;
  axesT(ctx,b,Math.log10(flo),Math.log10(fhi),ylo,yhi,opt);
  const lx0=Math.log10(flo), lx1=Math.log10(fhi);
  return {b,lx0,lx1,ylo,yhi,X:f=>b.x+b.w*(Math.log10(f)-lx0)/(lx1-lx0),Y:v=>b.y1-b.h*(v-ylo)/(yhi-ylo),
          line:(fs,vs,col,lw,dash)=>polyline(ctx,b,fs.map(Math.log10),vs,lx0,lx1,ylo,yhi,col,lw,dash)};
}
/* a vertical marker at frequency f inside plot m, with an optional label at its head (pos.foot: its foot) on its
   right (pos.side 'left': its left).  Each line is recorded in MARKS, so a test can see a label drawn across one. */
let MARKS=[];
function fMark(ctx,m,f,col,dash,label,lw,pos){
  const X=m.X(f); if(!(X>=m.b.x-0.5&&X<=m.b.x1+0.5)) return;
  ctx.beginPath(); ctx.moveTo(X,m.b.y); ctx.lineTo(X,m.b.y1); ctx.strokeStyle=col; ctx.lineWidth=lw||1; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]);
  MARKS.push({X,y0:m.b.y,y1:m.b.y1,seq:++DRAW_SEQ});
  if(label){ const P=pos||{}, left=P.side==='left';
    lab(ctx,W_STAGE,H_STAGE,left?X-3:X+3,P.foot?m.b.y1-10:m.b.y+10,label,col,SM_FONT,left?'right':'left','middle',PLATE); }
}
/* the stage: the readout's column is kept clear whenever the stage is wider than 700 px */
function stageBox(ctx,W,H,capFull,capShort,minTop){
  const left=56, right=W>=700?W-RO_W-44:W-26, top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,W-left-26));
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,minTop||top+200);
  return {left,right,top,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,main:box(left,top,right-left,Math.max(60,fit.capY-30-top)),compact:W<900||H<600};
}
/* a legend as one line of swatches and names above a plot (registered, so labels step round it); items that do
   not fit on the line are left out, never overlapped */
let KEY_DROPS=0;
function keyRow(ctx,x,y,items,maxW){
  ctx.font=SM_FONT; let X=x;
  for(let i=0;i<items.length;i++){ const [col,txt]=items[i], t=plain(txt), w=ctx.measureText(t).width+22;
    if(X+w>x+maxW){ KEY_DROPS+=items.length-i; break; }
    ctx.fillStyle=col; ctx.fillRect(X,y-4,10,7); ctx.fillStyle='#9aa2b4'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(t,X+14,y);
    LABELS.push([X,y-7,X+w-8,y+7]); X+=w; }
}
/* the key on a plot's title line, after its title: for plots whose curves leave no room for a legend inside */
function titleKey(ctx,b,title,items){ const tw=plain(title).length*13*0.52+16; keyRow(ctx,b.x+tw,b.y-16,items,b.w-tw); }
function splitH(b,fr,gap){ const w1=(b.w-gap)*fr; return [box(b.x,b.y,w1,b.h),box(b.x+w1+gap,b.y,b.w-w1-gap,b.h)]; }
function splitV(b,fr,gap){ const h1=(b.h-gap)*fr; return [box(b.x,b.y,b.w,h1),box(b.x,b.y+h1+gap,b.w,b.h-h1-gap)]; }

/* ================================================================== *
 *  THE PERMUTATIONS                                                   *
 * ================================================================== */
const PERM_CLS_COL={'band-pass':COL.pos,'band-stop':COL.ref,'low-pass':COL.L,'high-pass':COL.C};
function drawPerm(ctx,W,H,M){
  const P=M.P, sel=permSel(ST);
  const capFull='Twelve ways to put one R, one L and one C in the two arms of an L-section, each drawn over its response from f₀/50 to 50 f₀ (−40 to +20 dB). The top row is a loop read across some of its parts; the bottom row feeds a node through some parts into the rest in parallel. Only the resistor alone passes a band: across R in the loop, through R into the tank. With the same parts the two Q’s are reciprocal, so one sharpens exactly as the other broadens.';
  const capShort='The twelve arrangements, each over f₀/50..50 f₀. Only "across R" and "through R" pass a band, with reciprocal Q.';
  const Lb=stageBox(ctx,W,H,capFull,capShort,stageTop()+30+300);
  const b=Lb.main, withSch=b.w>=600&&b.h>=440, cols=b.w>=600?6:3, rows=12/cols;
  const gridH=withSch?Math.min(b.h*0.62,2*150+30):b.h*(b.h>=300?0.7:1);
  const gap=8, cw=(b.w-gap*(cols-1))/cols, rowHead=withSch?16:13, ch=(gridH-rowHead*(cols===6?2:0)-gap*(rows-1))/rows;
  const fam=['a loop, read across some of its parts','fed through some parts into the rest in parallel'];
  let y=b.y;
  for(let r=0;r<rows;r++){
    if(cols===6){ lab(ctx,W,H,b.x,y+6,fam[r],COL.dim,'italic 11.5px Georgia, serif','left','middle'); y+=rowHead; }
    for(let c=0;c<cols;c++){
      const i=r*cols+c, p=PERMS[i], cell=P.cells[i], cb=box(b.x+c*(cw+gap),y,cw,ch);
      HIT.push({kind:'perm',b:cb,id:p.id});
      const on=p.id===sel.id, bp=cell.cl.cls==='band-pass';
      ctx.fillStyle=on?'rgba(205,53,196,0.08)':bp?'rgba(184,236,76,0.05)':'rgba(255,255,255,0.015)'; ctx.fillRect(cb.x,cb.y,cb.w,cb.h);
      frame(ctx,cb,on?COL.live:bp?'#3d5a26':COL.edge);
      lab(ctx,W,H,cb.x+5,cb.y+8,permName(p),on?'#fff':COL.text,'10.5px -apple-system, sans-serif','left','middle');
      let yy=cb.y+15;
      if(withSch){ const sh=Math.min(66,ch*0.5); drawLSection(ctx,box(cb.x+2,yy,cb.w-4,sh),p,0.52); yy+=sh+2; }
      const pb=box(cb.x+5,yy+2,cb.w-10,cb.y+cb.h-yy-17);
      if(pb.h>14){
        frame(ctx,pb,'#1c2130');
        const lx=P.xs.map(Math.log10), y0=pb.y1-pb.h*(0+40)/60;
        ctx.beginPath(); ctx.moveTo(pb.x,y0); ctx.lineTo(pb.x1,y0); ctx.strokeStyle='#232a3a'; ctx.lineWidth=1; ctx.stroke();
        const X1=pb.x+pb.w*(0-Math.log10(0.02))/(Math.log10(50)-Math.log10(0.02));
        ctx.beginPath(); ctx.moveTo(X1,pb.y); ctx.lineTo(X1,pb.y1); ctx.strokeStyle='#232a3a'; ctx.stroke();
        polyline(ctx,pb,lx,cell.mag,Math.log10(0.02),Math.log10(50),-40,20,PERM_CLS_COL[cell.cl.cls],on?2:1.5);
      }
      lab(ctx,W,H,cb.x+cb.w/2,cb.y+cb.h-7,cell.cl.cls,PERM_CLS_COL[cell.cl.cls],'italic 11px Georgia, serif','center','middle');
    }
    y+=ch+gap;
  }
  /* the selected arrangement, large: its circuit with values, its magnitude and phase against the two band-passes */
  const db=box(b.x,y+22,b.w,b.y1-y-22);
  if(withSch&&db.h>=150){
    const [sb,pb]=splitH(db,0.34,40);
    const d=drawLSection(ctx,box(sb.x,sb.y+24,sb.w,Math.min(sb.h-24,150)),sel,1);
    lab(ctx,W,H,sb.x,sb.y+4,permName(sel)+': '+P.cells[sel.i].cl.cls,COL.live,'italic 12.5px Georgia, serif','left','middle');
    const val={R:ohm(P.R),L:henry(P.L),C:farad(P.C)};
    for(const [k,part,side] of d.parts) partLabel(ctx,part,k+' '+val[k],PART_COL(k),side);
    const [mb,phb]=splitV(pb,0.6,46);
    const mbT=box(mb.x,mb.y+20,mb.w,mb.h-20);
    const m=fPlot(ctx,mbT,0.02*P.f0,50*P.f0,-40,20,{title:'|H|, dB',ny:4,yfmt:t=>String(t)});
    const fs=P.xs.map(x=>x*P.f0);
    m.line(fs,P.cells[0].mag,COL.pos,1.2,[5,4]); m.line(fs,P.cells[6].mag,COL.bp2,1.2,[2,3]);
    m.line(fs,P.cells[sel.i].mag,PERM_CLS_COL[P.cells[sel.i].cl.cls],2.2);
    fMark(ctx,m,P.f0,COL.dim,[3,3],'f₀');
    /* the key on the title line: in a plot this short no legend box clears the curves, and it was dropped */
    titleKey(ctx,mbT,'|H|, dB',[[PERM_CLS_COL[P.cells[sel.i].cl.cls],permName(sel)],...[[COL.pos,'across R, dashed',0],[COL.bp2,'through R, dotted',6]].filter(r=>r[2]!==sel.i).map(r=>[r[0],r[1]])]);
    const ph=fPlot(ctx,phb,0.02*P.f0,50*P.f0,-180,180,{yticks:[-180,-90,0,90,180],yfmt:t=>t+'°',title:'phase',ny:4});
    ph.line(fs,P.cells[sel.i].ph,PERM_CLS_COL[P.cells[sel.i].cl.cls],1.8);
  }
  drawCaption(ctx,Lb);
}

/* A phasor panel: its key (one row per phasor) and the disc the phasors sweep in a cycle, of radius ext
   times the scale.  The disc goes above the key (A) or beside it (B), whichever is larger, so no arrow
   crosses the key at any phase; a key in a fixed corner was crossed whenever the chain swung that way. */
function phasorLayout(ctx,b,rows,top){
  ctx.font=SM_FONT; let w=0; for(const [t] of rows) w=Math.max(w,ctx.measureText(plain(t)).width);
  const kw=w+10, kh=rows.length*13+6, fit=raw=>Math.max(4,Math.min(0.92*raw,raw-7));
  const hA=b.h-top-kh-4, RA=fit(Math.min(b.w-12,hA)/2), wB=b.w-kw-10, RB=fit(Math.min(wB,b.h-top-6)/2);
  if(RA>=RB) return {R:RA,cx:b.x+b.w/2,cy:b.y+top+hA/2,kx:b.x+4,ky:b.y1-kh-2,kw,kh};
  return {R:RB,cx:b.x+5+wB/2,cy:b.y+top+(b.h-top)/2,kx:b.x1-kw-4,ky:b.y+top,kw,kh};
}
function phasorKey(ctx,W,H,L,rows){
  LEGEND_RECTS.push({x:L.kx,y:L.ky,w:L.kw,h:L.kh});
  rows.forEach(([t,col],i)=>lab(ctx,W,H,L.kx+3,L.ky+9+13*i,t,col,SM_FONT,'left','middle',PLATE_FIX));
}
/* ================================================================== *
 *  THE SERIES RESONATOR                                               *
 * ================================================================== */
function drawSeries(ctx,W,H,M){
  const S=M.S, o=S.o, d=S.drive;
  const capFull='The loop at the drive frequency (magenta, press or drag on the plots to move it). At resonance the voltages across L and C are equal and opposite, each Q times the source’s, and cancel: the whole source voltage lands on R. The phasors turn at the drive frequency and their shadows on the horizontal are the voltages in the scope. The half-power points sit at f₀/x and f₀x either side, their product f₀².';
  const capShort='The series loop: V_L and V_C cancel at f₀, each Q times the source. Press the plots to move the drive.';
  const Lb=stageBox(ctx,W,H,capFull.replace('V_L','V(L)'),capShort.replace('V_L and V_C','the L and C voltages'),stageTop()+30+260);
  const b=Lb.main, compact=b.w<600||b.h<420;
  const [lc,rc]=splitH(b,compact?0.42:0.4,54);
  const [schB,phB]=splitV(lc,compact?0.4:0.36,20);
  /* the circuit */
  { const x0=schB.x+14, x1=schB.x+schB.w-14, yt=schB.y+26, yb=schB.y1-10;
    sSource(ctx,x0,yt,yb,0.9);
    let xa=x0;
    if(o.Rs>0){ const pr=sPart(ctx,'R',x0,yt,x0+schB.w*0.24,yt,COL.Rs,0.8); partLabel(ctx,pr,'Rₛ '+ohm(o.Rs),COL.Rs,-1); xa=x0+schB.w*0.24; }
    const xl=xa+(x1-24-xa)*0.5, xr=x1-24;
    const pl=sPart(ctx,'L',xa,yt,xl,yt,COL.L,0.8); partLabel(ctx,pl,'L '+henry(o.L),COL.L,-1);
    const pc=sPart(ctx,'C',xl,yt,xr,yt,COL.C,0.8); partLabel(ctx,pc,'C '+farad(o.C),COL.C,-1);
    const pR=sPart(ctx,'R',xr,yt,xr,yb,COL.R,0.8); partLabel(ctx,pR,'R '+ohm(o.R),COL.R,-1);
    sWire(ctx,[[xr,yt],[x1,yt]]); sWire(ctx,[[x0,yb],[x1,yb]]); sDot(ctx,xr,yt); sDot(ctx,xr,yb); sTerm(ctx,x1,yt); sTerm(ctx,x1,yb);
    lab(ctx,W,H,x0+12,(yt+yb)/2,hz(d.x*o.f0,3),COL.live,SM_FONT,'left','middle',PLATE); }
  /* the phasors: the source, and the chain V_R + V_L + V_C + V_Rs that sums to it, turning at the drive */
  { const rot=S.th, e=cexp({re:0,im:rot}), R=v=>cmul(v,e);
    const chain=[['VR',COL.R,'V(R)'],['VL',COL.L,'V(L)'],['VC',COL.C,'V(C)'],['VRs',COL.Rs,'V(Rs)']].filter(q=>q[0]!=='VRs'||o.Rs>0);
    let tip={re:0,im:0}, ext=1.05; const pts=[];
    for(const [k,col,nm] of chain){ const v=R(d[k]), nt=cadd(tip,v); pts.push([tip,nt,col,nm,cabs(d[k])]); ext=Math.max(ext,cabs(nt),cabs(tip)); tip=nt; }
    const keyRows=[['Vₛ = 1 (white)',COL.src],...pts.map(q=>[q[3]+' '+fmt(q[4],3)+' Vₛ',q[2]])];
    const Ly=phasorLayout(ctx,phB,keyRows,18), cxp=Ly.cx, cyp=Ly.cy, sc=Ly.R/ext;
    ctx.fillStyle='rgba(255,255,255,0.015)'; ctx.fillRect(phB.x,phB.y,phB.w,phB.h); frame(ctx,phB,COL.edge);
    sWire(ctx,[[cxp-Ly.R-3,cyp],[cxp+Ly.R+3,cyp]],'#20283a',1); sWire(ctx,[[cxp,cyp-Ly.R-2],[cxp,cyp+Ly.R+3]],'#20283a',1);
    const ring=[]; for(let i=0;i<=72;i++){ const t=TAU*i/72; ring.push([cxp+sc*Math.cos(t),cyp-sc*Math.sin(t)]); } sWire(ctx,ring,'#1d2433',1);
    const vs=R({re:1,im:0});
    arrowPx(ctx,cxp,cyp,cxp+sc*vs.re,cyp-sc*vs.im,COL.src,2.2);
    for(const [a,bq,col] of pts) arrowPx(ctx,cxp+sc*a.re,cyp-sc*a.im,cxp+sc*bq.re,cyp-sc*bq.im,col,1.8);
    lab(ctx,W,H,phB.x+6,phB.y+9,phB.w>=330?'the phasors at '+hz(d.x*o.f0,3)+' (the circle is |Vₛ|)':phB.w>=200?'the phasors (circle: |Vₛ|)':'the phasors',COL.dim,SM_FONT,'left','middle');
    phasorKey(ctx,W,H,Ly,keyRows); }
  /* the magnitudes: the output V_R and the magnified V_L and V_C, over the source */
  const [mB0,rest]=splitV(rc,compact?0.6:0.48,48);
  const mB=box(mB0.x,mB0.y+18,mB0.w,mB0.h-18);
  const [phPlot,scB]=compact?[rest,null]:splitV(rest,0.42,48);
  const top=Math.max(2,(o.peakVC||o.Q)*2);
  const fs=o.xs.map(x=>x*o.f0);
  const m=fPlot(ctx,mB,0.1*o.f0,10*o.f0,Math.log10(0.01),Math.log10(top),{yticks:[-2,-1,0,1,2,3].filter(t=>t<=Math.log10(top)),yfmt:t=>'×'+tkv(Math.pow(10,t)),
    title:'|V|/|Vₛ|',ny:4});
  const lg=v=>Math.log10(Math.max(v,1e-6));
  m.line(fs,o.curves.map(q=>lg(cabs(q.VL))),COL.L,1.5); m.line(fs,o.curves.map(q=>lg(cabs(q.VC))),COL.C,1.5);
  m.line(fs,o.curves.map(q=>lg(cabs(q.VR))),COL.R,2.2);
  /* the drive first: a label's plate then lies over it, where the drive drawn last would cut the label */
  fMark(ctx,m,d.x*o.f0,COL.live,null,null,1.6);
  fMark(ctx,m,o.f1,'#556',[2,3]); fMark(ctx,m,o.f2,'#556',[2,3]); fMark(ctx,m,o.f0,COL.dim,[4,3],'f₀');
  if(o.peakVC){ dot(ctx,m.X(o.xC*o.f0),m.Y(lg(o.peakVC)),3.5,COL.C,null); dot(ctx,m.X(o.xL*o.f0),m.Y(lg(o.peakVC)),3.5,COL.L,null); }
  HIT.push({kind:'sx',b:mB,lx0:m.lx0,lx1:m.lx1,f0:o.f0});
  /* the key on the title line: at a small Q the curves fill the plot and a legend inside had nowhere clear */
  titleKey(ctx,mB,'|V|/|Vₛ|',[[COL.R,'across R (the output)'],[COL.L,'across L'],[COL.C,'across C']]);
  const pm=fPlot(ctx,phPlot,0.1*o.f0,10*o.f0,-90,90,{yticks:[-90,-45,0,45,90],yfmt:t=>t+'°',title:'the output’s phase',ny:4});
  pm.line(fs,o.curves.map(q=>carg(q.VR)*RAD),COL.R,1.8);
  /* the drive first again; f1 labelled on its left and f2 on its right, so a narrow band puts neither label on the other line */
  fMark(ctx,pm,d.x*o.f0,COL.live,null,null,1.6); fMark(ctx,pm,o.f1,'#556',[2,3],'f₁',1,{side:'left'}); fMark(ctx,pm,o.f2,'#556',[2,3],'f₂');
  HIT.push({kind:'sx',b:phPlot,lx0:pm.lx0,lx1:pm.lx1,f0:o.f0});
  /* the scope: two cycles at the drive, steady state; the cursor at the phasors' angle */
  if(scB&&scB.h>50){
    const amp=Math.max(1,cabs(d.VL),cabs(d.VC))*1.08;
    axesT(ctx,scB,0,2,-amp,amp,{xticks:[0,0.5,1,1.5,2],xfmt:t=>t===0?'0':t+' T',yticks:[-Math.floor(amp),0,Math.floor(amp)],yfmt:t=>fmt(t,0),title:'the voltages in time (two periods)',ny:3});
    const ts=[]; for(let i=0;i<=240;i++) ts.push(2*i/240);
    const sig=v=>ts.map(t=>cabs(v)*Math.cos(TAU*t+carg(v)));
    polyline(ctx,scB,ts,sig({re:1,im:0}),0,2,-amp,amp,COL.src,1.2);
    polyline(ctx,scB,ts,sig(d.VL),0,2,-amp,amp,COL.L,1.3); polyline(ctx,scB,ts,sig(d.VC),0,2,-amp,amp,COL.C,1.3); polyline(ctx,scB,ts,sig(d.VR),0,2,-amp,amp,COL.R,1.8);
    const tc=((S.th/TAU)%1+1)%1, Xc=scB.x+scB.w*tc/2;

/* ================================================================== *

function drawParallel(ctx,W,H,M){

  const capFull='The tank at the drive frequency (magenta; press or drag on the plots to move it). The capacitor’s and the coil’s currents nearly cancel in the line and circulate much larger inside the tank. A coil’s resistance r pulls apart four frequencies that are one for a lossless coil: 1/2π√(LC) (dashed), zero phase (cyan), the largest |Z| (gold) and the largest output (green).';
  const capShort='The tank: its currents circulate Q times the line current; a lossy coil splits the four centre frequencies.';
  const Lb=stageBox(ctx,W,H,capFull,capShort,stageTop()+30+260);
  const b=Lb.main, compact=b.w<600||b.h<420;
  const [lc,rc]=splitH(b,compact?0.42:0.4,54);
  const [schB,phB]=splitV(lc,compact?0.42:0.4,20);
  { const x0=schB.x+14, x1=schB.x+schB.w-14, yt=schB.y+24, yb=schB.y1-10, xr=schB.x+schB.w*0.44, xl=xr+Math.max(26,schB.w*0.12), xc=Math.min(x1-26,xl+Math.max(34,schB.w*0.24));
    sSource(ctx,x0,yt,yb,0.9);
    const pR=sPart(ctx,'R',x0,yt,xr,yt,COL.R,0.8); partLabel(ctx,pR,'R '+ohm(o.R),COL.R,-1);
    const ym=o.r>0?(yt+yb)/2:yb;
    const pL=sPart(ctx,'L',xl,yt,xl,ym,COL.L,0.7); partLabel(ctx,pL,'L '+henry(o.L),COL.L,1);
    if(o.r>0){ const pr=sPart(ctx,'R',xl,ym,xl,yb,COL.Rs,0.7); partLabel(ctx,pr,'r '+ohm(o.r),COL.Rs,1); }
    const pC=sPart(ctx,'C',xc,yt,xc,yb,COL.C,0.7); partLabel(ctx,pC,'C '+farad(o.C),COL.C,-1);
    sWire(ctx,[[xr,yt],[x1,yt]]); sWire(ctx,[[x0,yb],[x1,yb]]);
    for(const x of [xl,xc]){ sDot(ctx,x,yt); sDot(ctx,x,yb); } sTerm(ctx,x1,yt); sTerm(ctx,x1,yb);
    lab(ctx,W,H,x0+12,(yt+yb)/2,hz(d.x*o.f0,3),COL.live,SM_FONT,'left','middle',PLATE); }
  /* the currents: the line's I = I_C + I_L, turning at the drive; the circle is |I| */
  { const e=cexp({re:0,im:Q.th}), R=v=>cmul(v,e), I=R(d.I), IC=R(d.IC), IL=R(d.IL);
    const ext=Math.max(cabs(I),cabs(IC),cabs(IL),cabs(cadd(IC,IL)))*1.05||1;
    const ib=cabs(d.I), keyRows=[['I (the line) = 1',COL.src],['I(C) '+fmt(cabs(d.IC)/ib,3)+' I',COL.C],['I(L) '+fmt(cabs(d.IL)/ib,3)+' I',COL.L]];
    const Ly=phasorLayout(ctx,phB,keyRows,18), cxp=Ly.cx, cyp=Ly.cy, sc=Ly.R/ext;
    ctx.fillStyle='rgba(255,255,255,0.015)'; ctx.fillRect(phB.x,phB.y,phB.w,phB.h); frame(ctx,phB,COL.edge);
    sWire(ctx,[[cxp-Ly.R-3,cyp],[cxp+Ly.R+3,cyp]],'#20283a',1); sWire(ctx,[[cxp,cyp-Ly.R-2],[cxp,cyp+Ly.R+3]],'#20283a',1);
    const ring=[], rI=cabs(I)*sc; for(let i=0;i<=72;i++){ const t=TAU*i/72; ring.push([cxp+rI*Math.cos(t),cyp-rI*Math.sin(t)]); } sWire(ctx,ring,'#1d2433',1);
    arrowPx(ctx,cxp,cyp,cxp+sc*IC.re,cyp-sc*IC.im,COL.C,1.8);
    arrowPx(ctx,cxp+sc*IC.re,cyp-sc*IC.im,cxp+sc*(IC.re+IL.re),cyp-sc*(IC.im+IL.im),COL.L,1.8);
    arrowPx(ctx,cxp,cyp,cxp+sc*I.re,cyp-sc*I.im,COL.src,2.2);
    lab(ctx,W,H,phB.x+6,phB.y+9,phB.w>=330?'the currents at '+hz(d.x*o.f0,3)+' (the circle is the line’s)':phB.w>=220?'the currents (circle: the line’s)':'the currents',COL.dim,SM_FONT,'left','middle');
    phasorKey(ctx,W,H,Ly,keyRows); }
  /* |Z|, the output, the phase: the four frequencies marked on each */
  /* |Z| and the output over two decades (the drive in magenta), then the four centres in a window of their own */
  const rc2=box(rc.x,rc.y+18,rc.w,rc.h-18);
  const parts=compact?splitV(rc2,0.5,48):(()=>{ const [a,bb]=splitV(rc2,0.34,46); const [c,dd]=splitV(bb,0.45,46); return [a,c,dd]; })();
  const fs=o.xs.map(x=>x*o.f0);
  const wide=m=>{ fMark(ctx,m,o.f0,COL.dim,[4,3]); fMark(ctx,m,d.x*o.f0,COL.live,null,null,1.6); };
  let zb=parts[0], hb=compact?null:parts[1], qb=compact?parts[1]:parts[2];
  /* a lossless tank's |Z| is infinite at f0: the axis stops at 10^4 Z0 and the title says so */
  { const zs=o.curves.map(q=>cabs(q.Zt)), zcap=1e4*o.Z0, zmax=Math.min(Math.max(...zs),zcap), zmin=Math.min(...zs);
    const zlo=Math.log10(zmin)-0.1, zhi=Math.log10(zmax)+0.15;
    const m=fPlot(ctx,zb,0.1*o.f0,10*o.f0,zlo,zhi,{yfmt:t=>engT(Math.pow(10,t),'Ω'),yticks:freqTicks(Math.pow(10,zlo),Math.pow(10,zhi),zb.h<120?3:4).map(Math.log10),
      title:titleFor(zb,o.r>0?'|Z| of the tank (the coil with its r, across C)':'|Z| of the tank (infinite at f₀: cut at 10⁴ Z₀)','|Z| of the tank'),ny:4});
    m.line(fs,zs.map(Math.log10),COL.struct,2); wide(m);
    HIT.push({kind:'qx',b:zb,lx0:m.lx0,lx1:m.lx1,f0:o.f0}); }
  if(hb){ const m=fPlot(ctx,hb,0.1*o.f0,10*o.f0,0,1.05*Math.max(...o.curves.map(q=>cabs(q.H))),{title:'the output |V|/|Vₛ|',ny:4,yfmt:t=>fmt(t,2)});
    m.line(fs,o.curves.map(q=>cabs(q.H)),COL.pos,2.2); wide(m);
    if(isFinite(o.x3lo)){ fMark(ctx,m,o.x3lo*o.f0,'#556',[2,3]); fMark(ctx,m,o.x3hi*o.f0,'#556',[2,3]); }
    HIT.push({kind:'qx',b:hb,lx0:m.lx0,lx1:m.lx1,f0:o.f0}); }
  /* the four centres, zoomed: |Z| and the output, each over its own largest value */
  { const zm=Q.zoom, lo=zm.lo*o.f0, hi=zm.hi*o.f0, xt=ticksFor(lo,hi,Math.max(2,Math.min(5,Math.floor(qb.w/80))));
    axesT(ctx,qb,lo,hi,0,1.12,{xticks:xt,xfmt:t=>engT(t,'Hz'),yticks:[0.5,1],yfmt:t=>fmt(t,1),title:titleFor(qb,'the four centres, zoomed: |Z| and the output over their peaks','the four centres'),ny:3});
    const zf=zm.xs.map(x=>x*o.f0);
    polyline(ctx,qb,zf,zm.z,lo,hi,0,1.12,COL.struct,1.8); polyline(ctx,qb,zf,zm.h,lo,hi,0,1.12,COL.pos,2);
    const keys=[];
    const mk=(f,col,dash,txt)=>{ const X=qb.x+qb.w*(f-lo)/(hi-lo); if(!(X>=qb.x-0.5&&X<=qb.x1+0.5)) return;
      ctx.beginPath(); ctx.moveTo(X,qb.y); ctx.lineTo(X,qb.y1); ctx.strokeStyle=col; ctx.lineWidth=1.2; ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
      MARKS.push({X,y0:qb.y,y1:qb.y1,seq:++DRAW_SEQ}); keys.push([f,col,txt+' '+hz(f,4)]); };
    if(o.r>0&&o.xupf) mk(o.xupf*o.f0,COL.struct,[2,2],'zero phase');
    if(o.r>0&&o.xmax) mk(o.xmax*o.f0,COL.C,[5,3],'largest |Z|');
    mk(o.f0,COL.dim,[4,3],'1/2π√(LC)');
    if(o.peak.x>0) mk(o.peak.x*o.f0,COL.pos,[1,3],'largest output');
    /* in frequency order, bottom up, in the corner away from the curves' peak */
    /* the drive before the key, whose plates then lie over the lines that pass through it */
    fMark(ctx,{b:qb,X:f=>qb.x+qb.w*(f-lo)/(hi-lo)},d.x*o.f0,COL.live,null,null,1.6);
    keys.sort((a,c)=>c[0]-a[0]); const rightSide=(Q.o.peak.x-zm.lo)/(zm.hi-zm.lo)<0.5;
    keys.forEach(([f,col,txt],i)=>lab(ctx,W,H,rightSide?qb.x1-6:qb.x+6,qb.y1-10-13*i,txt,col,SM_FONT,rightSide?'right':'left','middle',PLATE)); }
  drawCaption(ctx,Lb);
}
