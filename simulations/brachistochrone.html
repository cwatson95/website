<title>Brachistochrone &mdash; the curve of fastest descent</title>
<!--
  ===================================================================
  brachistochrone.html — the curve of fastest descent: Johann
  Bernoulli's 1696 problem, its cycloid answer, and what the same
  curve does besides (the tautochrone, Huygens' clock)
  ===================================================================

  Six views.  THE RACE: beads released together at A on the straight
  line, the circle tangent to the vertical, the sideways parabola
  x ~ y^2, the drop-then-run corner, YOUR curve (a quadratic Bezier with
  a draggable control point) and the cycloid, all between the same A and
  B (drag B); the cycloid arrives first, every time.  THE FUNCTIONAL:
  T[y] = int sqrt((1+y'^2)/2gy) dx over a one-parameter family x ~ y^q,
  with the cycloid's time as a floor no member reaches, and the first
  variation of the cycloid itself measured: T(+eps) and T(-eps) agree to
  second order, so delta T = 0.  THE REFRACTION: Bernoulli's own
  derivation — a light ray through N layers whose speed grows as sqrt(y)
  bends by Snell's law, sin(theta)/v constant, and converges on the
  cycloid as N grows.  THE TAUTOCHRONE: beads dropped anywhere on the
  cycloid bowl reach the bottom together, in pi sqrt(a/g), because the
  arc length from the bottom is a harmonic coordinate; the circular bowl
  of the same curvature does not.  THE CLOCK: Huygens' pendulum with
  cycloidal cheeks — the string wraps on the evolute, itself a congruent
  cycloid, so the bob's period is exactly amplitude-independent while a
  circular pendulum of the same length runs slow by (2/pi) K(sin th0/2).
  THE FIT: the boundary-value root (th - sin th)/(1 - cos th) = x_B/y_B by
  bisection, and the frontier T_curve/T_cycloid against the aspect of B
  for every competitor.

  WHAT IS EXACT HERE (this sim contains no measured data)
  --------------------------------------------------------
  * Every descent time is int ds/sqrt(2gy) by composite Gauss-Legendre in
    w = sqrt(p) (the substitution removes the release-point singularity),
    pinned to scipy.integrate.quad values printed by build_brach/derive.py;
    the cycloid and the corner have closed forms that pin the quadrature
    independently.
  * The cycloid's boundary-value root is a bisection on a monotone
    function (series branch near zero, coefficients emitted by sympy and
    asserted across the join); a and T follow in closed form.
  * The tautochrone period 4 pi sqrt(a/g), the evolute identity
    E(th) = r(th+pi) + (pi a, -2a), the string-length identity
    4a(1 - sin th/2) + 4a sin th/2 = 4a, and K(k) by the arithmetic-
    geometric mean (pinned to scipy.special.ellipk) are asserted.
  * The circular bowl and the circular pendulum are integrated by RK4 at
    1/1200 s and their descent times asserted against the elliptic-integral
    closed form — which is what makes them a fair comparison.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  Frictionless beads (or, with the chip, balls rolling without slipping:
  g -> 5g/7, every time x sqrt(7/5), the curve unchanged); g = 9.81 m/s^2;
  the layered ray uses each layer's mid-depth speed and converges to the
  cycloid only as N^(-1/2), because the ray turns horizontal at the bottom
  (the rate is measured and asserted, not assumed).  The "your curve"
  control point is kept below A: a horizontal start never starts.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;

   captured geometry would still lie.  Crossings are interpolated so a clipped

   is what lets selfTest assert that no data curve crosses a legend box. */

  ctx.save();

  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;

    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }

       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){

      const t=q/p;

function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';

  const bw=w+26, bh=items.length*15+8;

  const k3=wireDeriv(curve,g,[st[0]+0.5*dt*k2[0],st[1]+0.5*dt*k2[1]]);
  const k4=wireDeriv(curve,g,[st[0]+dt*k3[0],st[1]+dt*k3[1]]);
  return [st[0]+dt*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6, st[1]+dt*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6];
}

/* ---- the circular pendulum / the circular bowl: al'' = -(g/L) sin al -------- */
function pendDeriv(g,L,s){ return [s[1],-(g/L)*Math.sin(s[0])]; }
function pendStep(g,L,s,dt){
  const k1=pendDeriv(g,L,s);
  const k2=pendDeriv(g,L,[s[0]+0.5*dt*k1[0],s[1]+0.5*dt*k1[1]]);
  const k3=pendDeriv(g,L,[s[0]+0.5*dt*k2[0],s[1]+0.5*dt*k2[1]]);
  const k4=pendDeriv(g,L,[s[0]+dt*k3[0],s[1]+dt*k3[1]]);
  return [s[0]+dt*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6, s[1]+dt*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6];
}
function pendEnergy(g,L,s){ return 0.5*L*L*s[1]*s[1]+g*L*(1-Math.cos(s[0])); }
/* the release angle on a circle of radius L that sits at height h above the bottom */
function pendRelease(L,h){ return Math.acos(clamp(1-h/L,-1,1)); }
/* K(k) by the arithmetic-geometric mean: K = pi / (2 agm(1, sqrt(1-k^2))) */
function ellipK(k){
  let a=1, b=Math.sqrt(1-k*k);
  for(let i=0;i<60;i++){ const an=0.5*(a+b); b=Math.sqrt(a*b); a=an; if(Math.abs(a-b)<1e-16) break; }
  return PI/(2*a);
}
/* the circular pendulum's period over its small-angle period: (2/pi) K(sin(th0/2)) */
function periodRatio(th0){ return 2*ellipK(Math.sin(th0/2))/PI; }
function quarterPeriod(g,L,th0){ return Math.sqrt(L/g)*ellipK(Math.sin(th0/2)); }

/* ---- Bernoulli's layers: Snell's law with v = sqrt(2 g y) ----------------
   sin(th)/v = const = 1/v_max, v_max = sqrt(2 g 2a) at the bottom; layer i
   uses its mid-depth speed, so sin th_i = sqrt(y_i/2a) and the ray advances
   dy tan th_i across it.  The polyline converges to the cycloid, but only as
   N^(-1/2): the ray turns horizontal at the bottom, where the last layers
   carry most of the error (measured in derive.py, asserted in selfTest). */
function layeredRay(a,N){
  const dy=2*a/N, pts=[[0,0]];
  let x=0;
  for(let i=0;i<N;i++){
    const ym=(i+0.5)*dy, s=Math.sqrt(ym/(2*a));
    x+=dy*s/Math.sqrt(1-s*s);
    pts.push([x,(i+1)*dy]);
  }
  return {pts,xBottom:x,err:x-PI*a,dy};
}

/* ---- Huygens' cheeks: the evolute of the cycloid is a congruent cycloid --
   E(th) = r(th) + rho n = (a(th + sin th), a(cos th - 1)), which is r(th+pi)
   shifted by (pi a, -2a); the suspension cusp is at (pi a, -2a), each cheek
   is a half-arch, and the string of length 4a is wrapped along
   4a(1 - sin th/2) of cheek with 4a sin th/2 free — the free part is the
   radius of curvature, tangent to the cheek at the contact point. */
function evolutePt(a,th){ return [a*(th+Math.sin(th)),a*(Math.cos(th)-1)]; }
function rhoOf(a,th){ return 4*a*Math.sin(th/2); }
function wrappedLen(a,th){ return 4*a*(1-Math.sin(th/2)); }
function freeLen(a,th){ return 4*a*Math.sin(th/2); }
function stringAngle(th){ return PI/2-th/2; }         /* from the vertical, signed */
function clockBob(a,g,thE,t){
  const b=tautoBead(a,g,thE,t);
  return {th:b.th,pt:b.pt,E:evolutePt(a,b.th),wrapped:wrappedLen(a,b.th),free:freeLen(a,b.th),alpha:stringAngle(b.th)};
}

/* ================================================================== *
 *  state, the live clock, the per-view model, readout, eqbar          *
 *  Every number a panel prints is computed here or in the physics —  *
 *  never inside a draw call.  Heavy fields hide behind lazy getters   *
 *  and single-entry memos keyed on the parameters they depend on.     *
 * ================================================================== */
const TABS=[['race','the race'],['func','the functional'],['snell','the refraction'],
            ['tauto','the tautochrone'],['clock','the clock'],['fit','the fit']];
const BODY_LIST=[{id:false,name:'sliding bead'},{id:true,name:'rolling ball'}];
const RACE_IDS=['line','circle','parabola','corner','yours','cycloid'];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', off:'#161c2c', edge:'#242a3a', comp:'#2a3346',
           line:'#9aa2b4', circle:'#e8843a', parabola:'#5ac8e0', corner:'#d9b44a',
           yours:'#cd35c4', cycloid:'#b8ec4c', pert:'#e8843a'};
const RO_W=300;
/* release parameters of the five tautochrone beads (fractions of pi) */
const TAUTO_FRAC=[0.12,0.33,0.55,0.77,0.96];
/* the aspect grid of the frontier plot, log-spaced */
const FRONT_N=40;

const DEFAULTS={view:'race', bx:1.0, by:0.5, cx:0.35, cy:0.45, roll:false,
                running:true, speed:1, loop:true, showBeads:true,
                q:2, eps:0.02, layers:8, amp:60, showCirc:true};
const ST=Object.assign({},DEFAULTS);
/* limits the pointer and the sliders respect: B stays inside the stage, C
   stays below A (a horizontal start never starts) */
const LIM={bxMin:0.08, bxMax:3.0, byMin:0.1, byMax:1.6, cyMinFrac:0.05};

/* single-entry memos: recomputed only when the key changes (a drag makes a
   new key every frame, so a growing cache would leak) */
const MEMO={};
function memo(name,key,fn){
  const m=MEMO[name];
  if(m&&m.key===key) return m.val;
  const val=fn(); MEMO[name]={key,val}; return val;
}
function lazyC(obj,name,fn){
  Object.defineProperty(obj,name,{configurable:true,enumerable:false,get(){
    const v=fn(); Object.defineProperty(obj,name,{value:v,configurable:true,enumerable:false});
    return v; }});
}

/* ---- the live clock and the integrated states ------------------------------
   SIM.t is the race / tautochrone / clock time; the circular bowl's five beads
   and the circular pendulum are integrated states that must be reset whenever
   the parameters they were released from change (SIM.key says which). */
const SIM={t:0, key:'', pend:[], cpend:[0,0], frames:0, hist:[]};
function simKey(st){
  return [st.view,st.bx,st.by,st.cx,st.cy,st.roll,st.amp].join('|');
}
function simReset(st){
  SIM.t=0; SIM.frames=0; SIM.key=simKey(st); SIM.hist=[];
  const g=gEff(st), a=cycloidFit(st.bx,st.by,g).a, L=4*a;
  SIM.pend=TAUTO_FRAC.map(f=>[pendRelease(L,heightAbove(a,f*PI)),0]);
  SIM.cpend=[st.amp*DEG,0];
}
/* advance one frame: the bowl beads and the circular pendulum by RK4 in
   sub-steps, the clock by FRAME_DT * speed */
function simAdvance(st){
  if(SIM.key!==simKey(st)) simReset(st);
  const g=gEff(st), a=cycloidFit(st.bx,st.by,g).a, L=4*a;
  const dt=FRAME_DT*st.speed, sub=Math.max(1,Math.round(dt/DT)), h=dt/sub;
  for(let k=0;k<sub;k++){
    for(let i=0;i<SIM.pend.length;i++) SIM.pend[i]=pendStep(g,L,SIM.pend[i],h);
    SIM.cpend=pendStep(g,L,SIM.cpend,h);
  }
  SIM.t+=dt; SIM.frames++;
}

/* ---- the race ------------------------------------------------------------ */
function raceModel(st){
  const key=[st.bx,st.by,st.cx,st.cy,st.roll].join('|');
  return memo('race',key,()=>{
    const g=gEff(st), x2=st.bx, y2=st.by;
    const cyc=curveCycloid(x2,y2,g);
    const curves=[curveLine(x2,y2),curveCircle(x2,y2),curveParabola(x2,y2),
                  curveDropRun(x2,y2),curveBezier(x2,y2,st.cx,st.cy),cyc];
    for(const c of curves){
      if(c.id==='corner') c.T=cornerTime(x2,y2,g);
      else { c.tab=timeTable(c,g,128); c.T=c.tab.T; }
      c.col=COL[c.id];
    }
    const order=curves.slice().sort((p,q)=>p.T-q.T);
    const byId={}; for(const c of curves) byId[c.id]=c;
    return {g,x2,y2,curves,byId,cyc,order,Tmax:Math.max.apply(0,curves.map(c=>c.T)),
            Tmin:Math.min.apply(0,curves.map(c=>c.T)),winner:order[0].id};
  });
}
/* the world extent the race stage must show: A, B, every curve's dip */
function raceExtent(R){
  let xmin=0,xmax=R.x2,ymin=0,ymax=R.y2;
  for(const c of R.curves) for(let i=0;i<=64;i++){ const r=c.at(i/64);
    xmin=Math.min(xmin,r[0]); xmax=Math.max(xmax,r[0]); ymin=Math.min(ymin,r[1]); ymax=Math.max(ymax,r[1]); }
  const cy=R.byId.yours.cy, cx=R.byId.yours.cx;
  xmin=Math.min(xmin,cx); xmax=Math.max(xmax,cx); ymax=Math.max(ymax,cy);
  return {xmin,xmax,ymin,ymax};
}

/* ---- the functional ------------------------------------------------------ */
function funcModel(st){
  const key=[st.bx,st.by,st.roll,st.q,st.eps].join('|');
  return memo('func',key,()=>{
    const g=gEff(st), x2=st.bx, y2=st.by;
    const cyc=curveCycloid(x2,y2,g);
    const member=curvePower(x2,y2,st.q); member.T=descentTime(member,g,128);
    const pert=curvePerturbed(x2,y2,g,st.eps); pert.T=descentTime(pert,g,128);
    const Tq=memo('funcTq',[x2,y2,g].join('|'),()=>{
      const qs=[],Ts=[]; for(let i=0;i<=48;i++){ const q=1+3*i/48; qs.push(q); Ts.push(descentTime(curvePower(x2,y2,q),g,64)); }
      let best=0; for(let i=1;i<qs.length;i++) if(Ts[i]<Ts[best]) best=i;
      return {qs,Ts,qBest:qs[best],TBest:Ts[best]};
    });
    const Te=memo('funcTe',[x2,y2,g].join('|'),()=>{
      const es=[],Ts=[]; for(let i=0;i<=32;i++){ const e=-0.04+0.08*i/32; es.push(e); Ts.push(descentTime(curvePerturbed(x2,y2,g,e),g,64)); }
      return {es,Ts};
    });
    /* Beltrami's quantity along the member and the cycloid, over y */
    const belt=[];
    for(let i=1;i<=40;i++){ const p=i/40; belt.push([p,beltrami(member.at(p)),beltrami(cyc.at(p))]); }
    return {g,x2,y2,cyc,member,pert,Tq,Te,belt,Tcyc:cyc.Tclosed,gap:member.T-cyc.Tclosed,twoA:2*cyc.a};
  });
}

/* ---- the refraction ------------------------------------------------------ */
function snellModel(st){
  const key=[st.bx,st.by,st.roll,st.layers].join('|');
  return memo('snell',key,()=>{
    const g=gEff(st), f=cycloidFit(st.bx,st.by,g), a=f.a;
    const ray=layeredRay(a,st.layers);
    const conv=memo('snellConv',String(a),()=>{
      const Ns=[],errs=[]; for(let N=4;N<=1024;N*=2){ Ns.push(N); errs.push(Math.abs(layeredRay(a,N).err)); }
      return {Ns,errs};
    });
    const vmax=Math.sqrt(2*g*2*a);
    return {g,a,N:st.layers,ray,conv,vmax,xExact:PI*a,ratio:conv.errs[conv.errs.length-2]/conv.errs[conv.errs.length-1]};
  });
}

/* ---- the tautochrone ----------------------------------------------------- */
function tautoModel(st){
  const key=[st.bx,st.by,st.roll].join('|');
  return memo('tauto',key,()=>{
    const g=gEff(st), a=cycloidFit(st.bx,st.by,g).a, L=4*a;
    const T=tautoDescent(a,g), period=tautoPeriod(a,g);
    const beads=TAUTO_FRAC.map(f=>{ const th0=f*PI, h=heightAbove(a,th0), al0=pendRelease(L,h);
      return {th0,h,s0:arcFromBottom(a,th0),al0,Tcirc:quarterPeriod(g,L,al0)}; });
    /* descent time vs release height, both bowls */
    const curve=[]; for(let i=1;i<=40;i++){ const h=2*a*i/40; const al0=pendRelease(L,h);
      curve.push([h,T,quarterPeriod(g,L,al0)]); }
    return {g,a,L,T,period,omega:tautoOmega(a,g),beads,curve,centre:[PI*a,-2*a]};
  });
}

/* ---- the clock ------------------------------------------------------------ */
function clockModel(st){
  const key=[st.bx,st.by,st.roll,st.amp].join('|');
  return memo('clock',key,()=>{
    const g=gEff(st), a=cycloidFit(st.bx,st.by,g).a, L=4*a;
    const al0=st.amp*DEG, thE=PI-2*al0;                 /* the bob's parameter at the left extreme */
    const T0=2*PI*Math.sqrt(L/g), ratio=periodRatio(al0), Tcirc=T0*ratio;
    const curve=[]; for(let i=0;i<=45;i++){ const al=i*2*DEG; curve.push([al/DEG,periodRatio(al),1+al*al/16]); }
    return {g,a,L,al0,thE,T0,Tcyc:T0,Tcirc,ratio,curve,cusp:[PI*a,-2*a],
            driftPerSwing:Tcirc-T0};
  });
}

/* ---- the fit --------------------------------------------------------------- */
function fitModel(st){
  const key=[st.bx,st.by,st.roll].join('|');
  return memo('fit',key,()=>{
    const g=gEff(st), ratio=st.bx/st.by, f=cycloidFit(st.bx,st.by,g,true);
    const fsamp=[]; for(let i=1;i<=240;i++){ const th=TAU*i/241; fsamp.push([th,ratioFn(th)]); }
    const front=memo('front','1',()=>{
      const asp=[],rows=[];
      for(let i=0;i<=FRONT_N;i++){
        const x2=Math.pow(10,-1+2*i/FRONT_N), y2=1, gg=GRAV;
        const Tc=cycloidFit(x2,y2,gg).T;
        asp.push(x2);
        rows.push([lineTime(x2,y2,gg)/Tc, descentTime(curveCircle(x2,y2),gg,64)/Tc,
                   descentTime(curveParabola(x2,y2),gg,64)/Tc, cornerTime(x2,y2,gg)/Tc]);
      }
      return {asp,rows};
    });
    const Tc=f.T, x2=st.bx, y2=st.by;
    const here=[lineTime(x2,y2,g)/Tc, descentTime(curveCircle(x2,y2),g,64)/Tc,
                descentTime(curveParabola(x2,y2),g,64)/Tc, cornerTime(x2,y2,g)/Tc];
    return {g,ratio,th2:f.th2,a:f.a,T:Tc,hist:f.hist,iters:f.hist.length-1,fsamp,front,here,
            aboveBottom:f.th2>PI};
  });
}

function buildModel(){
  const st=ST, view=st.view;
  const M={view,st,t:SIM.t,g:gEff(st)};
  if(view==='race'){
    M.R=raceModel(st);
    M.beads=M.R.curves.map(c=>Object.assign({id:c.id,col:c.col,T:c.T},beadAt(c,M.R.g,SIM.t)));
    M.allDone=SIM.t>=M.R.Tmax;
    lazyC(M,'ext',()=>raceExtent(M.R));
  }
  if(view==='func') M.F=funcModel(st);
  if(view==='snell') M.S=snellModel(st);
  if(view==='tauto'){
    M.Ta=tautoModel(st);
    if(SIM.key!==simKey(st)) simReset(st);
    M.beads=M.Ta.beads.map((b,i)=>Object.assign({},b,tautoBead(M.Ta.a,M.Ta.g,b.th0,SIM.t),{al:SIM.pend[i][0]}));
  }
  if(view==='clock'){
    M.C=clockModel(st);
    if(SIM.key!==simKey(st)) simReset(st);
    M.bob=clockBob(M.C.a,M.C.g,M.C.thE,SIM.t);
    M.cal=SIM.cpend[0];
    M.swings=SIM.t/M.C.T0;
  }
  if(view==='fit') M.Fi=fitModel(st);
  M.cycFit=cycloidFit(st.bx,st.by,M.g);
  return M;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function curveLabel(id){
  return {line:'straight line',circle:'circle',parabola:'parabola x &prop; y&sup2;',corner:'drop, then run',
          yours:'your curve',cycloid:'cycloid'}[id]||id;
}
function readoutHTML(M){
  const st=ST;
  let s='<div class="rname">brachistochrone<small>'+TABS.find(t=>t[0]===M.view)[1]
    +' &middot; '+(st.roll?'rolling ball':'sliding bead')+'</small></div><table>';
  const f=M.cycFit;

    s+=hd('the points')+rrow('B &minus; A',fmt(st.bx,2)+', '+fmt(st.by,2)+' m')

      +rrow('cycloid &theta;<sub>B</sub>, a',fmt(f.th2,4)+' rad, '+fmt(f.a,4)+' m',f.th2>PI?'bad':'');
    if(f.th2>PI) s+=rrow('B above the bottom','the bead dips and climbs back','bad');
    s+=hd('descent times');
    R.order.forEach((c,i)=>{ const b=M.beads.find(x=>x.id===c.id);
      s+=rrow((i+1)+'. '+curveLabel(c.id),fmt(c.T,4)+' s'+(b&&b.done?' &#10003;':''),i===0?'good':''); });
    s+=hd('the race')+rrow('t',fmt(M.t,2)+' s')
      +rrow('your curve vs cycloid','+'+fmt(100*(R.byId.yours.T/R.byId.cycloid.T-1),2)+' %');
    if(st.roll) s+=rrow('rolling: every time &times;',fmt(Math.sqrt(1/ROLL_FACTOR),4));
  }
  else if(M.view==='func'){

    s+=hd('the family x &prop; y<sup>q</sup>')+rrow('q',fmt(st.q,2))+rrow('T(q)',fmt(F.member.T,5)+' s')
      +rrow('best q in [1, 4]',fmt(F.Tq.qBest,3))+rrow('T(best q)',fmt(F.Tq.TBest,5)+' s')
      +rrow('T<sub>cycloid</sub>',fmt(F.Tcyc,5)+' s','good')
      +rrow('gap to the floor','+'+fmt(100*(F.Tq.TBest/F.Tcyc-1),3)+' %');
    s+=hd('the first variation')+rrow('&epsilon;',fmt(st.eps,3))+rrow('T(&epsilon;)',fmt(F.pert.T,6)+' s')
      +rrow('T(&epsilon;) &minus; T(0)',sigf(F.pert.T-F.Tcyc,3)+' s');
    s+=hd('Beltrami y(1+y&prime;<sup>2</sup>)')+rrow('cycloid, everywhere',fmt(F.twoA,4)+' m = 2a','good')
      +rrow('family member, y = &frac14; y<sub>B</sub>',fmt(F.belt[9][1],4)+' m')
      +rrow('family member, y = y<sub>B</sub>',fmt(F.belt[39][1],4)+' m');
  }
  else if(M.view==='snell'){
    const S=M.S;
    s+=hd('the layers')+rrow('N',S.N)+rrow('thickness 2a/N',fmt(S.ray.dy,4)+' m')
      +rrow('v<sub>max</sub> = &radic;(4ga)',fmt(S.vmax,3)+' m/s');
    s+=hd('the bent ray at the bottom')+rrow('x<sub>N</sub>',fmt(S.ray.xBottom,5)+' m')
      +rrow('&pi;a (the cycloid)',fmt(S.xExact,5)+' m','good')
      +rrow('error',sigf(S.ray.err,3)+' m')
      +rrow('error ratio 512 &rarr; 1024',fmt(S.ratio,3)+' (&radic;2 = '+fmt(Math.SQRT2,3)+')');
  }
  else if(M.view==='tauto'){
    const T=M.Ta;
    s+=hd('the bowl')+rrow('a',fmt(T.a,4)+' m')+rrow('depth 2a',fmt(2*T.a,4)+' m')
      +rrow('&omega; = &radic;(g/4a)',fmt(T.omega,4)+' rad/s')
      +rrow('descent &pi;&radic;(a/g)',fmt(T.T,4)+' s','good')+rrow('period 4&pi;&radic;(a/g)',fmt(T.period,4)+' s');
    s+=hd('the circular bowl, radius 4a');
    T.beads.forEach((b,i)=>{ s+=rrow('from h = '+fmt(b.h,3)+' m',fmt(b.Tcirc,4)+' s'); });
    s+=hd('the run')+rrow('t',fmt(M.t,2)+' s')+rrow('t / descent',fmt(M.t/T.T,3));
  }
  else if(M.view==='clock'){
    const C=M.C;
    s+=hd('Huygens&rsquo; pendulum')+rrow('string 4a',fmt(C.L,4)+' m')+rrow('amplitude',fmt(st.amp,0)+'&deg;')
      +rrow('period',fmt(C.Tcyc,4)+' s, any amplitude','good');
    s+=hd('the circular pendulum, same L')+rrow('T<sub>0</sub> = 2&pi;&radic;(L/g)',fmt(C.T0,4)+' s')
      +rrow('T / T<sub>0</sub> = (2/&pi;)K',fmt(C.ratio,5))+rrow('T',fmt(C.Tcirc,4)+' s')
      +rrow('slow by, per swing',fmt(1000*C.driftPerSwing,2)+' ms');
    s+=hd('the run')+rrow('t',fmt(M.t,2)+' s')+rrow('cycloidal swings',fmt(M.swings,2))
      +rrow('bob &theta;, string angle',fmt(M.bob.th,3)+' rad, '+fmt(M.bob.alpha/DEG,1)+'&deg;')
      +rrow('wrapped + free',fmt(M.bob.wrapped,4)+' + '+fmt(M.bob.free,4)+' = '+fmt(M.bob.wrapped+M.bob.free,4)+' m');

  else if(M.view==='fit'){
    const Fi=M.Fi;
    s+=hd('the root')+rrow('x<sub>B</sub>/y<sub>B</sub>',fmt(Fi.ratio,5))+rrow('&theta;<sub>B</sub>',fmt(Fi.th2,7)+' rad')

    s+=hd('T / T<sub>cycloid</sub> at this aspect');
    ['straight line','circle','parabola','drop, then run'].forEach((n,i)=>{ s+=rrow(n,fmt(Fi.here[i],4)); });
  }
  s+='</table><div class="note">No measured data: every time is a quadrature pinned to scipy, every '
    +'closed form is asserted in selfTest, and the two circular comparisons are integrated by RK4 and '
    +'checked against the elliptic integral. Drag B (and C) on the stage.</div>';
  return s;
}

function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='race') return E('T = &int; ds / &radic;(2gy) &nbsp;&nbsp;&middot;&nbsp;&nbsp; <span class="hl">cycloid: T = &theta;<sub>B</sub> &radic;(a/g)</span>',
    'energy conservation fixes the speed at every depth; the shape decides how long the bead spends slow near the top');
  if(M.view==='func') return E('&delta; &int; &radic;((1+y&prime;<sup>2</sup>)/(2gy)) dx = 0 &nbsp;&rArr;&nbsp; <span class="hl">y (1 + y&prime;<sup>2</sup>) = 2a</span> &nbsp;&rArr;&nbsp; x = a(&theta; &minus; sin &theta;), y = a(1 &minus; cos &theta;)',
    'the integrand has no explicit x, so Beltrami\'s identity F &minus; y&prime; &part;F/&part;y&prime; = const is a first integral of Euler&ndash;Lagrange — and its solution is the cycloid');
  if(M.view==='snell') return E('<span class="hl">sin &theta; / v = 1 / v<sub>max</sub></span>, &nbsp; v = &radic;(2gy) &nbsp;&rArr;&nbsp; dx/dy = &radic;(y / (2a &minus; y))',
    'Bernoulli, 1697: a light ray in a medium whose speed grows as &radic;y obeys Snell\'s law layer by layer, and the least-time path of light is the least-time path of the bead');
  if(M.view==='tauto') return E('s = 4a cos(&theta;/2), &nbsp; h = s<sup>2</sup>/8a &nbsp;&rArr;&nbsp; <span class="hl">s&#776; = &minus;(g/4a) s</span>, &nbsp; T<sub>descent</sub> = &pi;&radic;(a/g)',
    'the height above the bottom is quadratic in the arc length, so the bead is a harmonic oscillator whatever its amplitude — Huygens, 1659');
  if(M.view==='clock') return E('<span class="hl">T<sub>cycloidal</sub> = 4&pi;&radic;(a/g)</span> exactly &nbsp;&middot;&nbsp; T<sub>circular</sub> = 4&radic;(L/g) K(sin &theta;<sub>0</sub>/2) = T<sub>0</sub>(1 + &theta;<sub>0</sub><sup>2</sup>/16 + &hellip;)',
    'the evolute of a cycloid is a congruent cycloid, so a string unwinding from cycloidal cheeks traces a cycloid: Huygens\' isochronous clock (1673)');
  return E('<span class="hl">(&theta; &minus; sin &theta;) / (1 &minus; cos &theta;) = x<sub>B</sub> / y<sub>B</sub></span>, &nbsp; a = y<sub>B</sub> / (1 &minus; cos &theta;<sub>B</sub>)',
    'every cycloid through A is a scaled copy of one curve, so B fixes the parameter by a single monotone root — solved by bisection');
}
function tagHTML(M){
  const st=ST;
  if(M.view==='race') return '<b>the race</b> — B at ('+fmt(st.bx,2)+', '+fmt(st.by,2)+') m, the cycloid wins by '+fmt(100*(M.R.order[1].T/M.R.Tmin-1),1)+' %';
  if(M.view==='func') return '<b>the functional</b> — one family, one floor';
  if(M.view==='snell') return '<b>the refraction</b> — N = '+st.layers+' layers';
  if(M.view==='tauto') return '<b>the tautochrone</b> — five releases, one arrival';
  if(M.view==='clock') return '<b>the clock</b> — amplitude '+fmt(st.amp,0)+'°';
  return '<b>the fit</b> — x<sub>B</sub>/y<sub>B</sub> = '+fmt(st.bx/st.by,3);
}

/* ================================================================== *
 *  drawing helpers shared by the views                                *
 *  Layouts are built from the bottom up: the caption is MEASURED      *
 *  first (wrapped text has no fixed height), then the bottom row,     *
 *  then the main panel gets what is left.  Every view has a narrow    *
 *  mode below 900 px that keeps its one primary panel.                *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
/* the drag freezes the world extent so the picture does not zoom under the pointer */
const DRAG={ext:null,what:null};

/* equal-aspect world -> screen map (y DOWN in both, so no flip) */
function worldFit(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2-(ext.ymin-pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy+s*y,wx:X=>(X-ox)/s,wy:Y=>(Y-oy)/s};
}
/* world polylines record their screen segments in POLY_SEGS like the plot
   layer does, so legendAuto can dodge them and the legend-crossing
   assertion covers them */
function worldPoly(ctx,map,curve,n,col,lw,dash,p0,p1){
  p0=p0===undefined?0:p0; p1=p1===undefined?1:p1;
  ctx.beginPath();
  let px=0,py=0;
  for(let i=0;i<=n;i++){ const r=curve.at(p0+(p1-p0)*i/n), X=map.X(r[0]), Y=map.Y(r[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function screenPoly(ctx,pts,col,lw,dash,close){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){ if(i===0) ctx.moveTo(pts[i][0],pts[i][1]); else ctx.lineTo(pts[i][0],pts[i][1]); }
  if(close) ctx.closePath();
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
/* a short label clamped inside the canvas (the layout sweep fails on any
   text that leaves it) and registered: a label whose box would overprint
   one already placed this frame is shifted up or down, and dropped when no
   slot is free — an overprinted label is worse than none (the numbers live
   in the readout).  The box model (0.52 em per glyph, 1.15 em tall) is the
   one the inline sweep and tools/audit.py measure with. */
let LABELS=[];
function labFits(bx){
  /* the same half-pixel overlap rule as tools/audit.py, so a graze the
     audit would flag is a collision here too */
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
/* a plot title that shortens when its panel is narrow (three titles across a
   1100 px stage overran each other in the first sweep) */
function titleFor(b,longT,shortT){ return b.w<330?shortT:longT; }
/* axes() with its title box registered, so stage labels placed by lab()
   cannot climb into a plot title (found by the sweep at 560 x 380) */
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function panelTitle(ctx,b,txt){
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain(txt),b.x,b.y-9);
}
/* the stage layout: caption measured, a bottom row of n panels (each with a
   52 px tick gutter on its left), the main panel above.  bottomFrac is the
   share of the vertical the bottom row takes; narrow mode keeps ONE bottom
   panel (or none when nBottomNarrow = 0). */
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L,W,H){
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
}

/* ================================================================== *
 *  view: the race                                                     *
 * ================================================================== */
const RACE_CAP_FULL='Equal aspect, y downward, A at the top left. Six curves between the same two points, beads released together '
  +'from rest: the speed at every depth is fixed by energy, only the route differs. Drag B; drag the control point C to '
  +'shape your own curve and try to beat the cycloid — you cannot. The strip below is the finish line: rank badges at each '
  +'arrival time, the cursor is now. When x_B/y_B exceeds π/2 the cycloid dips below B and climbs back, and still wins.';
const RACE_CAP_SHORT='Six curves, one release, equal aspect, y down. Drag B and C. The strip is the finish line.';
function raceGeo(ctx,W,H,M){
  const L=stageLayout(ctx,W,H,RACE_CAP_FULL,RACE_CAP_SHORT,0,0,0);
  const stripH=L.narrow?72:92;
  const strip=box(L.left+16,L.capY-14-stripH,L.right-L.left-16,stripH);
  const stage=box(L.left,L.main.y,L.right-L.left,strip.y-22-L.main.y);
  const ext=DRAG.ext||M.ext;
  const span=Math.max(ext.xmax-ext.xmin,ext.ymax-ext.ymin);
  const map=worldFit(stage,ext,0.07*span+0.04);
  return Object.assign(L,{stage,strip,map,ext});
}
function drawRace(ctx,W,H,M){
  const G=raceGeo(ctx,W,H,M), R=M.R, map=G.map, st=M.st;
  frame(ctx,G.stage,'#1a2030');
  /* the release level and B's drop */
  ctx.strokeStyle='#1e2536'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(G.stage.x,map.Y(0)); ctx.lineTo(G.stage.x1,map.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(map.X(R.x2),map.Y(0)); ctx.lineTo(map.X(R.x2),map.Y(R.y2)); ctx.stroke();
  ctx.setLineDash([]);
  /* your curve's control polygon */
  const Y=R.byId.yours;
  screenPoly(ctx,[[map.X(0),map.Y(0)],[map.X(Y.cx),map.Y(Y.cy)],[map.X(R.x2),map.Y(R.y2)]],rgba(COL.yours,0.35),1,[4,4]);
  /* the curves, the cycloid last so it sits on top */
  for(const c of R.curves) worldPoly(ctx,map,c,c.id==='corner'?2:160,c.col,c.id==='cycloid'?2.4:1.5,c.id==='line'?[6,4]:null);
  /* the beads: a finished bead gets a white core (they all sit on B by then,
     so a glyph each would overprint six times) */
  if(st.showBeads) for(const b of M.beads){
    dot(ctx,map.X(b.x),map.Y(b.y),6.5,b.col,'#070b18',1.5);
    if(b.done) dot(ctx,map.X(b.x),map.Y(b.y),2.2,'#fff',null);
  }
  /* the points */
  dot(ctx,map.X(0),map.Y(0),4,'#fff',null);
  lab(ctx,W,H,map.X(0)-10,map.Y(0)-12,'A','#fff','bold 12px -apple-system, sans-serif','center');
  dot(ctx,map.X(R.x2),map.Y(R.y2),9,null,'#fff',1.6);
  dot(ctx,map.X(R.x2),map.Y(R.y2),3,'#fff',null);
  lab(ctx,W,H,map.X(R.x2)+14,map.Y(R.y2)-12,'B  (drag)','#fff','bold 12px -apple-system, sans-serif','left');
  dot(ctx,map.X(Y.cx),map.Y(Y.cy),7,null,COL.yours,1.6);
  lab(ctx,W,H,map.X(Y.cx)+12,map.Y(Y.cy)+12,'C  (drag: your curve)',COL.yours,LAB_FONT,'left');
  /* curve names along their lower-left ends, staggered so they cannot collide */
  if(!G.narrow){
    const names=R.curves.map(c=>[c,c.at(0.62)]);
    names.sort((p,q)=>p[1][1]-q[1][1]);
    let lastY=-1e9;
    for(const [c,r] of names){ let y=map.Y(r[1])-9; if(y-lastY<13) y=lastY+13; lastY=y;
      lab(ctx,W,H,map.X(r[0])+9,y,c.name,c.col,SM_FONT,'left'); }
  }
  /* the finish line: the axis through the middle of the strip, a tick at
     each arrival, rank badges in the first free row above or below it (close
     arrivals bunch — six beads at aspect 0.2 finish within 8 % of each other) */
  const S=G.strip, Tmax=R.Tmax*1.06, mid=S.y+S.h/2;
  frame(ctx,S,'#242a3a');
  const tx=t=>S.x+S.w*clamp(t/Tmax,0,1);
  ctx.strokeStyle='#3a4258'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(S.x,mid); ctx.lineTo(S.x1,mid); ctx.stroke();
  lab(ctx,W,H,S.x+4,S.y+9,'the finish line','#8b93a6',SM_FONT,'left','middle');
  const placed=[];
  R.order.forEach((c,i)=>{ const X=tx(c.T);
    let yb=mid-14;
    for(const off of [-14,14,-30,30,-46,46]){ const yy=mid+off;
      if(placed.every(p=>Math.abs(p[0]-X)>=17||Math.abs(p[1]-yy)>=17)){ yb=yy; break; } }
    placed.push([X,yb]);
    ctx.strokeStyle=c.col; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(X,mid-5); ctx.lineTo(X,mid+5); ctx.stroke();
    dot(ctx,X,yb,8,c.col,null);
    ctx.fillStyle='#070b18'; ctx.font='bold 10px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(i+1),X,yb+0.5); });
  /* now */
  const Xn=tx(M.t);
  ctx.strokeStyle=COL.live; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(Xn,S.y+2); ctx.lineTo(Xn,S.y1-2); ctx.stroke();
  drawCaption(ctx,G,W,H);
}

/* ================================================================== *
 *  view: the functional                                               *
 * ================================================================== */
const FUNC_CAP_FULL='Top: the cycloid (green) against one member of the family x ∝ y^q (magenta) and the cycloid displaced by '
  +'ε y_B sin²(πθ/θ_B) (orange, dashed). Below: T against q — the family has a best member, and it still sits above the '
  +'cycloid\'s time, the orange floor; T against ε — a parabola whose tangent at ε = 0 is flat, which is what δT = 0 means; '
  +'and Beltrami\'s first integral y(1 + y′²) along the depth — constant on the cycloid, on nothing else. Equal aspect above, y down.';
const FUNC_CAP_SHORT='The cycloid against one member of x ∝ y^q; below, T(q) with the cycloid floor. Equal aspect, y down.';
function funcGeo(ctx,W,H,M){
  const L=stageLayout(ctx,W,H,FUNC_CAP_FULL,FUNC_CAP_SHORT,3,0.4,1);
  const F=M.F;
  let xmin=0,xmax=F.x2,ymin=0,ymax=F.y2;
  for(const c of [F.cyc,F.member,F.pert]) for(let i=0;i<=48;i++){ const r=c.at(i/48);
    xmin=Math.min(xmin,r[0]); xmax=Math.max(xmax,r[0]); ymin=Math.min(ymin,r[1]); ymax=Math.max(ymax,r[1]); }
  const ext={xmin,xmax,ymin,ymax};
  const map=worldFit(L.main,ext,0.07*Math.max(xmax-xmin,ymax-ymin)+0.03);
  return Object.assign(L,{map,ext});
}
function drawFunc(ctx,W,H,M){
  const G=funcGeo(ctx,W,H,M), F=M.F, map=G.map, st=M.st;
  frame(ctx,G.main,'#1a2030');
  ctx.strokeStyle='#1e2536'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(G.main.x,map.Y(0)); ctx.lineTo(G.main.x1,map.Y(0)); ctx.stroke(); ctx.setLineDash([]);
  worldPoly(ctx,map,F.member,160,COL.live,1.8);
  if(st.eps!==0) worldPoly(ctx,map,F.pert,160,COL.ref,1.4,[5,4]);
  worldPoly(ctx,map,F.cyc,160,COL.pos,2.4);
  dot(ctx,map.X(0),map.Y(0),4,'#fff',null); dot(ctx,map.X(F.x2),map.Y(F.y2),4,'#fff',null);
  lab(ctx,W,H,map.X(0)-10,map.Y(0)-12,'A','#fff','bold 12px -apple-system, sans-serif','center');
  lab(ctx,W,H,map.X(F.x2)+12,map.Y(F.y2)-12,'B','#fff','bold 12px -apple-system, sans-serif','left');
  /* the legend dodges the recorded curve segments (a corner chosen by eye
     keeps being wrong — Known-bad) */
  legendAuto(ctx,G.main,[[COL.pos,'cycloid  T = '+fmt(F.Tcyc,4)+' s'],[COL.live,'x ∝ y^q, q = '+fmt(st.q,2)+'  T = '+fmt(F.member.T,4)+' s'],
    [COL.ref,'cycloid + ε y_B sin²(πθ/θ_B), ε = '+fmt(st.eps,3)+'  T = '+fmt(F.pert.T,5)+' s']]);
  if(G.bottom.length>=1){
    const b=G.bottom[0], Tq=F.Tq;
    const ylo=Math.min(F.Tcyc,Tq.TBest)*0.985, yhi=Math.max.apply(0,Tq.Ts)*1.01;
    axesR(ctx,b,1,4,ylo,yhi,{title:titleFor(b,'T against q, and the floor','T(q) and the floor'),xlab:'q in x ∝ y^q',ylab:'T, s',nx:4,ny:4,yfmt:v=>fmt(v,3)});
    polyline(ctx,b,[1,4],[F.Tcyc,F.Tcyc],1,4,ylo,yhi,COL.ref,1.4,[5,4]);
    polyline(ctx,b,Tq.qs,Tq.Ts,1,4,ylo,yhi,COL.live,1.8);
    const X=b.x+b.w*(st.q-1)/3, Yv=b.y1-b.h*(F.member.T-ylo)/(yhi-ylo);
    dot(ctx,X,clamp(Yv,b.y,b.y1),4.5,COL.live,'#fff');
  }
  if(G.bottom.length>=2){
    const b=G.bottom[1], Te=F.Te;
    const ylo=F.Tcyc*0.9995, yhi=Math.max.apply(0,Te.Ts)*1.0002;
    axesR(ctx,b,-0.04,0.04,ylo,yhi,{title:titleFor(b,'T against ε: the first variation vanishes','T(ε): flat at ε = 0'),xlab:'ε',ylab:'T, s',nx:4,ny:3,yfmt:v=>fmt(v,4)});
    polyline(ctx,b,[-0.04,0.04],[F.Tcyc,F.Tcyc],-0.04,0.04,ylo,yhi,COL.ref,1.2,[5,4]);
    polyline(ctx,b,Te.es,Te.Ts,-0.04,0.04,ylo,yhi,COL.ref,1.8);
    const X=b.x+b.w*(st.eps+0.04)/0.08, Yv=b.y1-b.h*(F.pert.T-ylo)/(yhi-ylo);
    dot(ctx,X,clamp(Yv,b.y,b.y1),4.5,COL.live,'#fff');
  }
  if(G.bottom.length>=3){
    const b=G.bottom[2];
    const xs=F.belt.map(r=>r[0]), ym=F.belt.map(r=>r[1]/F.twoA), yc=F.belt.map(r=>r[2]/F.twoA);
    const yhi=clamp(Math.max.apply(0,ym)*1.1,1.3,6);
    axesR(ctx,b,0,1,0,yhi,{title:titleFor(b,'Beltrami: y(1 + y′²) / 2a along the depth','Beltrami, y(1+y′²)/2a'),xlab:'y / y_B',ylab:'y(1+y′²)/2a',nx:4,ny:3});
    polyline(ctx,b,xs,ym,0,1,0,yhi,COL.live,1.8);
    polyline(ctx,b,xs,yc,0,1,0,yhi,COL.pos,2.2);
  }
  drawCaption(ctx,G,W,H);
}

/* ================================================================== *
 *  view: the refraction                                               *
 * ================================================================== */
const SNELL_CAP_FULL='Bernoulli\'s medium: N layers whose speed grows as √y downward (brighter = faster). A ray entering vertically '
  +'refracts at every interface by Snell\'s law, sin θ/v = 1/v_max, so it bends over until it runs horizontal at depth 2a — the '
  +'polyline (cyan) closes on the cycloid (green) as N grows. Right: the miss at the bottom shrinks only as N^(−1/2), the orange '
  +'slope, because the ray turns horizontal there and the last layers carry the error. Equal aspect, y down.';
const SNELL_CAP_SHORT='Snell\'s law in N layers with v ∝ √y bends a ray onto the cycloid. Equal aspect, y down.';
function snellGeo(ctx,W,H,M){
  const L=stageLayout(ctx,W,H,SNELL_CAP_FULL,SNELL_CAP_SHORT,1,0.38,0);
  const a=M.S.a;
  const ext={xmin:-0.15*a,xmax:2*PI*a,ymin:-0.08*a,ymax:2.12*a};
  const map=worldFit(L.main,ext,0.03*a);

function drawSnell(ctx,W,H,M){
  const G=snellGeo(ctx,W,H,M), S=M.S, map=G.map, a=S.a, N=S.N;
  const x0=map.X(-0.15*a), x1=map.X(2*PI*a);
  /* the layers: speed sqrt(2 g y_mid) as brightness */
  for(let i=0;i<N;i++){
    const y0=map.Y(i*S.ray.dy), y1=map.Y((i+1)*S.ray.dy);
    const v=Math.sqrt((i+0.5)/N);

    ctx.strokeStyle='#0d1322'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x0,y1); ctx.lineTo(x1,y1); ctx.stroke();
  }
  frame(ctx,box(x0,map.Y(0),x1-x0,map.Y(2*a)-map.Y(0)),'#2a3346');
  /* the cycloid: the half arch that the ray follows, then the rest faintly */
  const cyc={at:p=>{ const th=TAU*p; return [a*(th-Math.sin(th)),a*(1-Math.cos(th)),0,0]; }};
  worldPoly(ctx,map,cyc,200,rgba(COL.pos,0.35),1.4,[4,4],0.5,1);
  worldPoly(ctx,map,cyc,200,COL.pos,2.2,null,0,0.5);

  screenPoly(ctx,pts,COL.struct,2);
  for(const p of pts) dot(ctx,p[0],p[1],2.4,COL.struct,null);
  /* the angle in the middle layer */
  const k=Math.floor(N/2), P0=pts[k], P1=pts[k+1];
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(P0[0],P0[1]); ctx.lineTo(P0[0],P1[1]); ctx.stroke(); ctx.setLineDash([]);
  const thk=Math.asin(Math.sqrt((k+0.5)/N));
  lab(ctx,W,H,P0[0]+10,0.5*(P0[1]+P1[1]),'θ = '+fmt(thk/DEG,1)+'°, sin θ = √(y/2a)','#fff',SM_FONT,'left');
  dot(ctx,map.X(PI*a),map.Y(2*a),4,COL.pos,'#fff');
  lab(ctx,W,H,map.X(PI*a),map.Y(2*a)+13,'x = πa',COL.pos,SM_FONT,'center','top');
  dot(ctx,map.X(S.ray.xBottom),map.Y(2*a),4,COL.struct,'#fff');
  lab(ctx,W,H,map.X(S.ray.xBottom)+8,map.Y(2*a)-11,'x_N',COL.struct,SM_FONT,'left');
  lab(ctx,W,H,map.X(0)+6,map.Y(0)-11,'v = 0 at the top; v_max = √(4ga) at the bottom','#8b93a6',SM_FONT,'left');
  if(G.bottom.length){
    const b=G.bottom[0], C=S.conv;
    const lx=C.Ns.map(n=>Math.log10(n)), ly=C.errs.map(e=>Math.log10(e));
    const ylo=Math.floor(Math.min.apply(0,ly))-0.2, yhi=Math.ceil(Math.max.apply(0,ly))+0.2;
    axesR(ctx,b,0.5,3.2,ylo,yhi,{title:'the miss at the bottom against N (log–log)',xlab:'log₁₀ N',ylab:'log₁₀ |x_N − πa|',nx:4,ny:4,yfmt:v=>fmt(v,1),xfmt:v=>fmt(v,1)});
    /* the reference slope -1/2 through the last point */
    const n0=lx[lx.length-1], e0=ly[ly.length-1];

    polyline(ctx,b,lx,ly,0.5,3.2,ylo,yhi,COL.struct,1.8);
    for(let i=0;i<lx.length;i++){ const X=b.x+b.w*(lx[i]-0.5)/2.7, Yv=b.y1-b.h*(ly[i]-ylo)/(yhi-ylo); dot(ctx,X,Yv,3,COL.struct,null); }
    const Xc=b.x+b.w*(Math.log10(N)-0.5)/2.7, Yc=b.y1-b.h*(Math.log10(Math.abs(S.ray.err))-ylo)/(yhi-ylo);
    dot(ctx,Xc,clamp(Yc,b.y,b.y1),5,COL.live,'#fff');
    legendAuto(ctx,b,[[COL.struct,'|x_N − πa|'],[COL.ref,'slope −½'],[COL.live,'N = '+N]]);
  }
  drawCaption(ctx,G,W,H);
}

/* ================================================================== *
 *  view: the tautochrone                                              *
 * ================================================================== */
const TAUTO_CAP_FULL='Five beads released from rest at different heights on the same cycloid bowl (green) reach the bottom at the '
  +'same instant, π√(a/g), and go on oscillating in step for ever: the arc length from the bottom is a harmonic coordinate. '
  +'The circular bowl of the same curvature at the bottom (orange, radius 4a) is not isochronous — its hollow beads, released '
  +'from the same heights, arrive late by an amount that grows with amplitude (right, from the elliptic integral). Below: '
  +'height against time for all ten beads. Equal aspect, y down.';
const TAUTO_CAP_SHORT='Five heights, one arrival on the cycloid bowl; the circular bowl (orange) is not isochronous. Equal aspect, y down.';
const BEAD_COLS=['#f0e442','#e8843a','#e05a6c','#cd35c4','#7d7dff'];
function tautoGeo(ctx,W,H,M){
  const L=stageLayout(ctx,W,H,TAUTO_CAP_FULL,TAUTO_CAP_SHORT,2,0.42,1);
  const a=M.Ta.a, L4=4*a, alM=pendRelease(L4,2*a);
  const ext={xmin:Math.min(0,PI*a-L4*Math.sin(alM))-0.1*a,xmax:Math.max(2*PI*a,PI*a+L4*Math.sin(alM))+0.1*a,ymin:-0.15*a,ymax:2.15*a};
  const map=worldFit(L.main,ext,0.02*a);
  return Object.assign(L,{map,ext});
}
function bowlPos(T,al){ return [T.centre[0]+T.L*Math.sin(al),T.centre[1]+T.L*Math.cos(al)]; }
function drawTauto(ctx,W,H,M){
  const G=tautoGeo(ctx,W,H,M), T=M.Ta, map=G.map, a=T.a;
  /* the circular bowl: the arc of radius 4a about the evolute cusp, within the bowl's height */
  const alM=pendRelease(T.L,2*a);
  const arc=[]; for(let i=0;i<=80;i++){ const al=-alM+2*alM*i/80; const p=bowlPos(T,al); arc.push([map.X(p[0]),map.Y(p[1])]); }
  screenPoly(ctx,arc,COL.ref,1.4,[6,4]);
  const cyc={at:p=>{ const th=TAU*p; return [a*(th-Math.sin(th)),a*(1-Math.cos(th)),0,0]; }};
  worldPoly(ctx,map,cyc,240,COL.pos,2.4);
  ctx.strokeStyle='#1e2536'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(map.X(PI*a),map.Y(2*a)); ctx.lineTo(map.X(PI*a),map.Y(-0.1*a)); ctx.stroke(); ctx.setLineDash([]);
  /* the beads: filled on the cycloid, hollow on the circle */
  M.beads.forEach((b,i)=>{
    const col=BEAD_COLS[i];
    const r0=cycloidPt(a,b.th0);
    dot(ctx,map.X(r0[0]),map.Y(r0[1]),3,null,rgba(col,0.6),1);         /* the release point */
    const pc=bowlPos(T,b.al);
    dot(ctx,map.X(pc[0]),map.Y(pc[1]),6,null,col,1.8);
    dot(ctx,map.X(b.pt[0]),map.Y(b.pt[1]),6.5,col,'#070b18',1.5);
  });
  lab(ctx,W,H,map.X(PI*a),map.Y(2*a)+12,'the bottom, depth 2a',COL.pos,SM_FONT,'center','top');
  lab(ctx,W,H,map.X(0)+4,map.Y(0)-10,'cusp',COL.pos,SM_FONT,'left');
  if(!G.narrow) lab(ctx,W,H,map.X(PI*a+T.L*Math.sin(alM))-6,map.Y(-0.02*a),'circle, radius 4a',COL.ref,SM_FONT,'right');
  const flash=Math.abs(M.t-T.T)<0.04;
  if(flash) lab(ctx,W,H,map.X(PI*a),map.Y(2*a)-16,'all five, now',COL.live,'bold 12px -apple-system, sans-serif','center');
  if(G.bottom.length>=1){
    const b=G.bottom[0], tmax=Math.max(T.period*1.02,M.t*1.02), hmax=2*a*1.05;
    axesR(ctx,b,0,tmax,0,hmax,{title:titleFor(b,'height above the bottom against time','height against time'),xlab:'t, s',ylab:'h, m',nx:5,ny:3});
    const n=160;
    M.beads.forEach((bd,i)=>{
      const ts=[],hs=[]; for(let k=0;k<=n;k++){ const t=tmax*k/n; if(t>M.t) break; const s=bd.s0*Math.cos(T.omega*t); ts.push(t); hs.push(s*s/(8*a)); }
      polyline(ctx,b,ts,hs,0,tmax,0,hmax,BEAD_COLS[i],1.4);
    });
    polyline(ctx,b,[T.T,T.T],[0,hmax],0,tmax,0,hmax,COL.pos,1,[4,4]);
    lab(ctx,W,H,b.x+b.w*T.T/tmax+4,b.y+10,'π√(a/g)',COL.pos,SM_FONT,'left');
    /* the circle beads: from their K(k) descent, the cosine-like shape is only sketched
       by the integrated state at the current time (a dot), not by a false closed form */
    M.beads.forEach((bd,i)=>{ const h=T.L*(1-Math.cos(bd.al)); const X=b.x+b.w*clamp(M.t/tmax,0,1), Yv=b.y1-b.h*clamp(h/hmax,0,1);
      dot(ctx,X,Yv,3.5,null,BEAD_COLS[i],1.4); });
  }

    const b=G.bottom[1];
    const hs=T.curve.map(r=>r[0]), tc=T.curve.map(r=>r[1]), tq=T.curve.map(r=>r[2]);
    const yhi=Math.max.apply(0,tq)*1.08;
    axesR(ctx,b,0,2*a,0,yhi,{title:titleFor(b,'time to the bottom against release height','descent time vs height'),xlab:'release height, m',ylab:'T, s',nx:4,ny:3});
    polyline(ctx,b,hs,tq,0,2*a,0,yhi,COL.ref,1.8,[5,4]);
    polyline(ctx,b,hs,tc,0,2*a,0,yhi,COL.pos,2.2);
    M.beads.forEach((bd,i)=>{ const X=b.x+b.w*bd.h/(2*a);
      dot(ctx,X,b.y1-b.h*T.T/yhi,4,BEAD_COLS[i],null); dot(ctx,X,b.y1-b.h*bd.Tcirc/yhi,4,null,BEAD_COLS[i],1.5); });
    legendAuto(ctx,b,[[COL.pos,'cycloid: π√(a/g)'],[COL.ref,'circle: √(L/g) K(sin θ₀/2)']]);
  }
  drawCaption(ctx,G,W,H);
}

/* ================================================================== *
 *  view: the clock                                                    *
 * ================================================================== */
const CLOCK_CAP_FULL='Huygens\' pendulum: the string hangs from the cusp between two cycloidal cheeks (cyan, the evolute) and wraps '
  +'against one as it swings, so the bob (magenta) traces the cycloid below and its period is exactly 4π√(a/g) at every '
  +'amplitude. A circular pendulum of the same length 4a (orange, hollow bob) released with it falls behind — by '
  +'(2/π)K(sin θ₀/2) − 1 per swing, right; the dashed line is the small-angle series 1 + θ₀²/16. Bottom: the two bobs\' '
  +'horizontal positions against time. Equal aspect, y down.';
const CLOCK_CAP_SHORT='Huygens\' cycloidal pendulum keeps exact time; the circular one (orange) falls behind. Equal aspect, y down.';
function clockGeo(ctx,W,H,M){
  const L=stageLayout(ctx,W,H,CLOCK_CAP_FULL,CLOCK_CAP_SHORT,2,0.4,1);
  const C=M.C, a=C.a;
  const reach=C.L*Math.sin(C.al0);
  const ext={xmin:Math.min(0,PI*a-reach)-0.15*a,xmax:Math.max(2*PI*a,PI*a+reach)+0.15*a,ymin:-2.3*a,ymax:2.15*a};
  const map=worldFit(L.main,ext,0.02*a);
  return Object.assign(L,{map,ext});
}
function drawClock(ctx,W,H,M){
  const G=clockGeo(ctx,W,H,M), C=M.C, map=G.map, a=C.a, B=M.bob;
  /* the bob's path (faint) and the cheeks */
  const cyc={at:p=>{ const th=TAU*p; return [a*(th-Math.sin(th)),a*(1-Math.cos(th)),0,0]; }};
  worldPoly(ctx,map,cyc,240,rgba(COL.pos,0.4),1.2,[4,4]);
  const evo={at:p=>{ const th=TAU*p; const e=evolutePt(a,th); return [e[0],e[1],0,0]; }};
  worldPoly(ctx,map,evo,240,COL.struct,2.2);
  /* the wrapped string: along the cheek from the cusp (th = pi) to the contact point */
  const wrap=[]; const th0=PI, th1=B.th, n=60;
  for(let i=0;i<=n;i++){ const th=th0+(th1-th0)*i/n; const e=evolutePt(a,th); wrap.push([map.X(e[0]),map.Y(e[1])]); }
  screenPoly(ctx,wrap,'#fff',2.2);
  screenPoly(ctx,[[map.X(B.E[0]),map.Y(B.E[1])],[map.X(B.pt[0]),map.Y(B.pt[1])]],'#fff',1.6);
  /* the circular pendulum from the same cusp */
  const cx=C.cusp[0]+C.L*Math.sin(M.cal), cy=C.cusp[1]+C.L*Math.cos(M.cal);
  screenPoly(ctx,[[map.X(C.cusp[0]),map.Y(C.cusp[1])],[map.X(cx),map.Y(cy)]],COL.ref,1.4,[5,4]);
  dot(ctx,map.X(cx),map.Y(cy),7,null,COL.ref,2);
  /* the suspension, the contact point, the bob */
  dot(ctx,map.X(C.cusp[0]),map.Y(C.cusp[1]),4,'#fff',null);
  dot(ctx,map.X(B.E[0]),map.Y(B.E[1]),3.5,COL.struct,'#fff',1);
  dot(ctx,map.X(B.pt[0]),map.Y(B.pt[1]),7.5,COL.live,'#070b18',1.5);
  lab(ctx,W,H,map.X(C.cusp[0]),map.Y(C.cusp[1])-12,'suspension at the cusp (πa, −2a)','#fff',SM_FONT,'center');
  lab(ctx,W,H,map.X(2*PI*a)+6,map.Y(0),'cheeks: the evolute',COL.struct,SM_FONT,'left');
  lab(ctx,W,H,map.X(B.E[0])+10,map.Y(B.E[1])+2,'contact: wrapped '+fmt(B.wrapped,3)+' + free '+fmt(B.free,3)+' = 4a',COL.struct,SM_FONT,'left');
  if(G.bottom.length>=1){
    const b=G.bottom[0];
    const xs=C.curve.map(r=>r[0]), rc=C.curve.map(r=>r[1]), rs=C.curve.map(r=>r[2]);
    const yhi=Math.max(1.2,rc[rc.length-1]*1.03);
    axesR(ctx,b,0,90,0.95,yhi,{title:titleFor(b,'period over the small-angle period, against amplitude','T / T₀ against amplitude'),xlab:'amplitude θ₀, degrees',ylab:'T / T₀',nx:4,ny:3,yfmt:v=>fmt(v,2)});
    polyline(ctx,b,xs,rs,0,90,0.95,yhi,'#6f7789',1.2,[3,3]);
    polyline(ctx,b,xs,rc,0,90,0.95,yhi,COL.ref,1.8);
    polyline(ctx,b,[0,90],[1,1],0,90,0.95,yhi,COL.pos,2.2);
    const X=b.x+b.w*C.al0/DEG/90, Yv=b.y1-b.h*(C.ratio-0.95)/(yhi-0.95);
    dot(ctx,X,clamp(Yv,b.y,b.y1),4.5,COL.live,'#fff');
    legendAuto(ctx,b,[[COL.pos,'cycloidal: exactly 1'],[COL.ref,'circular: (2/π)K(sin θ₀/2)'],['#6f7789','1 + θ₀²/16']]);
  }
  if(G.bottom.length>=2){
    const b=G.bottom[1], hist=SIM.hist;
    const tmax=Math.max(4*C.T0,M.t*1.02), t0=Math.max(0,M.t-tmax);
    axesR(ctx,b,t0,t0+tmax,-1.05,1.05,{title:titleFor(b,'the two bobs: horizontal position over L against time','the two bobs, x/L against time'),xlab:'t, s',ylab:'x / L',nx:5,ny:3,yfmt:v=>fmt(v,1)});
    const ts=[],xc=[],xr=[];
    for(const h of hist){ if(h[0]<t0) continue; ts.push(h[0]); xc.push(h[1]); xr.push(h[2]); }
    polyline(ctx,b,ts,xr,t0,t0+tmax,-1.05,1.05,COL.ref,1.4,[5,4]);
    polyline(ctx,b,ts,xc,t0,t0+tmax,-1.05,1.05,COL.live,1.8);
  }
  drawCaption(ctx,G,W,H);
}

/* ================================================================== *
 *  view: the fit                                                      *
 * ================================================================== */
const FIT_CAP_FULL='The boundary-value problem. Every cycloid from A is a scaled copy of one curve, so the ratio '
  +'f(θ) = (θ − sin θ)/(1 − cos θ) fixes the parameter at B by one monotone root, f(θ_B) = x_B/y_B — the orange line meets the '
  +'green curve once, and the bars underneath are the first bisection brackets halving onto it (log axis; f runs from 0 to ∞ '
  +'on (0, 2π)). Below left: how much slower each competitor is than the cycloid, against the aspect of B — the line by 18.5 % '
  +'when B sits at the bottom (x_B/y_B = π/2), everything tending to free fall as B goes straight down. Below right: the '
  +'similar cycloids through A and the one that hits B (drag B).';
const FIT_CAP_SHORT='One monotone root f(θ_B) = x_B/y_B fixes the cycloid; below, every competitor\'s time over the cycloid\'s.';
function fitGeo(ctx,W,H,M){
  const L=stageLayout(ctx,W,H,FIT_CAP_FULL,FIT_CAP_SHORT,2,0.44,1);
  /* the bottom row is split unevenly: the frontier wide, the family narrow */
  if(L.bottom.length===2){
    const b0=L.bottom[0], b1=L.bottom[1], span=b1.x1-b0.x, gut=52;
    const w0=(span-gut)*0.6, w1=(span-gut)*0.4;
    L.bottom=[box(b0.x,b0.y,w0,b0.h),box(b0.x+w0+gut,b0.y,w1,b0.h)];
  }
  const main=box(L.main.x+48,L.main.y+14,L.main.w-58,L.main.h-34);
  return Object.assign(L,{plot:main});
}
function drawFit(ctx,W,H,M){
  const G=fitGeo(ctx,W,H,M), Fi=M.Fi, b=G.plot, st=M.st;
  const lo=0.01, hi=30;
  /* no clamp: polyline clips in data space, so the curve leaves the box
     honestly instead of running flat along its top */
  const lx=Fi.fsamp.map(r=>r[0]), ly=Fi.fsamp.map(r=>Math.log10(r[1]));
  axesR(ctx,b,0,TAU,Math.log10(lo),Math.log10(hi),{title:titleFor(box(b.x,b.y,b.w-120,b.h),'f(θ) = (θ − sin θ)/(1 − cos θ), and the root the ratio picks','f(θ) and the root'),
    xlab:'θ_B, radians',ylab:'log₁₀ f',nx:6,ny:4,yfmt:v=>fmt(v,0),xfmt:v=>fmt(v,1)});
  polyline(ctx,b,lx,ly,0,TAU,Math.log10(lo),Math.log10(hi),COL.pos,2.2);
  const lr=Math.log10(clamp(Fi.ratio,lo,hi));
  polyline(ctx,b,[0,TAU],[lr,lr],0,TAU,Math.log10(lo),Math.log10(hi),COL.ref,1.4,[5,4]);
  polyline(ctx,b,[PI,PI],[Math.log10(lo),Math.log10(hi)],0,TAU,Math.log10(lo),Math.log10(hi),'#3a4258',1,[2,4]);
  const X=b.x+b.w*Fi.th2/TAU, Y=b.y1-b.h*(lr-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo));
  dot(ctx,X,Y,5.5,COL.live,'#fff');
  lab(ctx,W,H,b.x+b.w*PI/TAU+5,b.y+12,'θ = π: B at the bottom','#6f7789',SM_FONT,'left');
  /* the root label hangs to whichever side keeps it out from under the readout */
  if(X<b.x+0.6*b.w) lab(ctx,W,H,X+10,Y-14,'θ_B = '+fmt(Fi.th2,4)+'  (f = '+fmt(Fi.ratio,3)+')',COL.live,LAB_FONT,'left');
  else lab(ctx,W,H,X-10,Y-14,'θ_B = '+fmt(Fi.th2,4)+'  (f = '+fmt(Fi.ratio,3)+')',COL.live,LAB_FONT,'right');
  /* the bisection brackets: the first halvings as bars near the axis floor —
     as many as the panel's height leaves room for */
  const nb=Math.max(0,Math.min(8,Fi.hist.length,Math.floor((b.h-40)/6)));
  for(let i=0;i<nb;i++){ const [l,r]=Fi.hist[i]; const yb=b.y1-8-i*6;
    ctx.strokeStyle=rgba(COL.live,0.35+0.5*i/nb); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(b.x+b.w*l/TAU,yb); ctx.lineTo(b.x+b.w*Math.min(r,TAU)/TAU,yb); ctx.stroke(); }
  if(nb>=3) lab(ctx,W,H,b.x1-6,b.y1-8-nb*6-4,'bisection brackets, halving',COL.live,SM_FONT,'right','bottom');
  if(G.bottom.length>=1){
    const p=G.bottom[0], F=Fi.front;
    const la=F.asp.map(v=>Math.log10(v)), yhi=2.4;
    axesR(ctx,p,-1,1,1,yhi,{title:'time over the cycloid\'s time, against the aspect x_B/y_B',xlab:'log₁₀ (x_B/y_B)',ylab:'T / T_cycloid',nx:4,ny:3,yfmt:v=>fmt(v,1),xfmt:v=>fmt(v,1)});
    const cols=[COL.line,COL.circle,COL.parabola,COL.corner], names=['straight line','circle','parabola x ∝ y²','drop, then run'];
    for(let k=0;k<4;k++) polyline(ctx,p,la,F.rows.map(r=>r[k]),-1,1,1,yhi,cols[k],k===0?1.4:1.6,k===0?[6,4]:null);
    polyline(ctx,p,[-1,1],[1,1],-1,1,1,yhi,COL.pos,2);
    const xa=Math.log10(Fi.ratio);
    polyline(ctx,p,[xa,xa],[1,yhi],-1,1,1,yhi,COL.live,1.2,[3,3]);
    for(let k=0;k<4;k++){ const Xk=p.x+p.w*(xa+1)/2, Yk=p.y1-p.h*(Fi.here[k]-1)/(yhi-1); if(xa>=-1&&xa<=1) dot(ctx,Xk,clamp(Yk,p.y,p.y1),4,cols[k],'#fff'); }
    legendAuto(ctx,p,names.map((n,k)=>[cols[k],n]).concat([[COL.pos,'the cycloid, 1']]));
  }
  if(G.bottom.length>=2){
    const p=G.bottom[1], g=M.g;
    frame(ctx,p,'#1a2030');
    const ext={xmin:0,xmax:Math.max(st.bx*1.15,2*PI*Fi.a*0.5),ymin:0,ymax:Math.max(st.by*1.15,2*Fi.a)};
    const map=worldFit(p,ext,0.05*Math.max(ext.xmax,ext.ymax));
    for(let k=1;k<=5;k++){ const ak=Fi.a*Math.pow(1.6,k-3);
      const c={at:pp=>{ const th=TAU*pp; return [ak*(th-Math.sin(th)),ak*(1-Math.cos(th)),0,0]; }};
      worldPoly(ctx,map,c,120,rgba(COL.pos,0.25),1,null,0,0.5); }
    const cf={at:pp=>{ const th=Fi.th2*pp; return [Fi.a*(th-Math.sin(th)),Fi.a*(1-Math.cos(th)),0,0]; }};
    worldPoly(ctx,map,cf,120,COL.pos,2.2);
    dot(ctx,map.X(0),map.Y(0),3.5,'#fff',null);
    dot(ctx,map.X(st.bx),map.Y(st.by),8,null,'#fff',1.5); dot(ctx,map.X(st.bx),map.Y(st.by),3,'#fff',null);
    lab(ctx,W,H,map.X(st.bx)+12,map.Y(st.by)-11,'B (drag)','#fff',SM_FONT,'left');
    panelTitle(ctx,p,'the similar cycloids through A');
    G.family={box:p,map};
  }
  drawCaption(ctx,G,W,H);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='race') drawRace(ctx,W,H,M);
  else if(M.view==='func') drawFunc(ctx,W,H,M);
  else if(M.view==='snell') drawSnell(ctx,W,H,M);
  else if(M.view==='tauto') drawTauto(ctx,W,H,M);
  else if(M.view==='clock') drawClock(ctx,W,H,M);
  else drawFit(ctx,W,H,M);
}
/* the animated views: the frame loop advances the clock only on these */
function viewAnimates(v){ return v==='race'||v==='tauto'||v==='clock'; }

function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame of time when running on an animated view; the race loops once
     everyone is home (plus a pause), the others run for ever */
  S.step=function(){
    if(!ST.running||!viewAnimates(ST.view)) return false;
    simAdvance(ST);
    if(ST.view==='race'&&ST.loop){ const R=raceModel(ST); if(SIM.t>R.Tmax+1.0) SIM.t=0; }
    if(ST.view==='clock'){ const C=clockModel(ST), B=clockBob(C.a,C.g,C.thE,SIM.t);
      SIM.hist.push([SIM.t,(B.pt[0]-C.cusp[0])/C.L,Math.sin(SIM.cpend[0])]);
      if(SIM.hist.length>2400) SIM.hist.splice(0,SIM.hist.length-2400); }
    return true;
  };
  /* the pointer drags B (race, fit) and C (race).  Returns true when consumed. */
  S.pointer=function(type,x,y){
    const st=ST;
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; DRAG.ext=null; return had; }
    const ctx=canvas.getContext('2d');
    if(st.view==='race'){
      const M=buildModel(), G=raceGeo(ctx,S.W,S.H,M), map=G.map;
      if(type==='down'){
        const dB=Math.hypot(x-map.X(st.bx),y-map.Y(st.by)), dC=Math.hypot(x-map.X(st.cx),y-map.Y(st.cy));
        if(dC<14&&dC<=dB){ DRAG.what='C'; DRAG.ext=M.ext; return true; }
        if(dB<16){ DRAG.what='B'; DRAG.ext=M.ext; return true; }
        return false;
      }
      if(type==='move'&&DRAG.what){
        const wx=map.wx(x), wy=map.wy(y);
        if(DRAG.what==='B'){ st.bx=clamp(wx,LIM.bxMin,LIM.bxMax); st.by=clamp(wy,LIM.byMin,LIM.byMax); }
        else { st.cx=clamp(wx,-LIM.bxMax,LIM.bxMax); st.cy=clamp(wy,LIM.cyMinFrac*st.by,2*LIM.byMax); }
        st.cy=Math.max(st.cy,LIM.cyMinFrac*st.by);
        SIM.t=0;
        return true;
      }
      return false;
    }
    if(st.view==='fit'){
      const M=buildModel(), G=fitGeo(ctx,S.W,S.H,M);
      /* draw once to place the family map (its box depends on the layout) */
      const fam=G.bottom.length>=2?G.bottom[1]:null;
      if(type==='down'){
        if(fam&&x>=fam.x&&x<=fam.x1&&y>=fam.y&&y<=fam.y1){ DRAG.what='Bfam'; return true; }
        const p=G.bottom[0]; if(p&&x>=p.x&&x<=p.x1&&y>=p.y&&y<=p.y1){ DRAG.what='aspect'; S.pointer('move',x,y); return true; }
        return false;
      }
      if(type==='move'&&DRAG.what==='aspect'){ const p=G.bottom[0]; const la=clamp(-1+2*(x-p.x)/p.w,-1,1);
        st.bx=clamp(st.by*Math.pow(10,la),LIM.bxMin,LIM.bxMax); return true; }
      if(type==='move'&&DRAG.what==='Bfam'&&fam){
        const Fi=M.Fi, ext={xmin:0,xmax:Math.max(st.bx*1.15,2*PI*Fi.a*0.5),ymin:0,ymax:Math.max(st.by*1.15,2*Fi.a)};
        const map=DRAG.ext?worldFit(fam,DRAG.ext,0.05*Math.max(DRAG.ext.xmax,DRAG.ext.ymax)):worldFit(fam,ext,0.05*Math.max(ext.xmax,ext.ymax));
        if(!DRAG.ext) DRAG.ext=ext;
        st.bx=clamp(map.wx(x),LIM.bxMin,LIM.bxMax); st.by=clamp(map.wy(y),LIM.byMin,LIM.byMax); return true; }
      return false;
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    if(st.view!==k){ st.view=k; simReset(st); }
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }
  const restart=()=>{ simReset(st); };
  const keepC=()=>{ st.cy=Math.max(st.cy,LIM.cyMinFrac*st.by); simReset(st); };

  const gPts=h('div',{class:'grp'},h('h3',null,'the points'));
  gPts.appendChild(slider('bx','B: across',LIM.bxMin,LIM.bxMax,0.01,v=>fmt(v,2)+' m',keepC));
  gPts.appendChild(slider('by','B: down',LIM.byMin,LIM.byMax,0.01,v=>fmt(v,2)+' m',keepC));
  const ptsTag=h('div',{class:'tag'}); gPts.appendChild(ptsTag);

  const gBody=h('div',{class:'grp'},h('h3',null,'the body'));
  const bodyChips=chipRow(BODY_LIST,'roll',restart); gBody.appendChild(bodyChips); trackChips(gBody,BODY_LIST,'roll');
  const bodyTag=h('div',{class:'tag'}); gBody.appendChild(bodyTag);

  const gRun=h('div',{class:'grp'},h('h3',null,'the run'));
  gRun.appendChild(h('div',{class:'checks'},
    checkbox('running','time runs'),
    checkbox('loop','the race loops'),
    checkbox('showBeads','beads')));
  gRun.appendChild(slider('speed','speed',0.25,4,0.25,v=>fmt(v,2)+'×'));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ simReset(st); dirty=true; refresh(); }},'restart'),
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset(st);
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gFunc=h('div',{class:'grp'},h('h3',null,'the family'));
  gFunc.appendChild(slider('q','exponent q',1,4,0.01,v=>fmt(v,2)));
  gFunc.appendChild(slider('eps','perturbation ε',-0.04,0.04,0.002,v=>fmt(v,3)));
  const funcTag=h('div',{class:'tag'}); gFunc.appendChild(funcTag);

  const gSnell=h('div',{class:'grp'},h('h3',null,'the layers'));
  gSnell.appendChild(slider('layers','layers N',2,128,1,v=>fmt(v,0)));
  const snellTag=h('div',{class:'tag'}); gSnell.appendChild(snellTag);

  const gClock=h('div',{class:'grp'},h('h3',null,'the swing'));
  gClock.appendChild(slider('amp','amplitude',5,85,1,v=>fmt(v,0)+'°',restart));
  const clockTag=h('div',{class:'tag'}); gClock.appendChild(clockTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'No measured data. Every descent time is a Gauss&ndash;Legendre quadrature pinned to '
      +'scipy.integrate.quad (build_brach/derive.py), every closed form is asserted in selfTest, the circular '
      +'comparisons are RK4 integrations checked against the elliptic integral, and K(k) is an arithmetic&ndash;geometric '
      +'mean pinned to scipy.special.ellipk. g = 9.81 m/s&sup2;.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the mathematics'),h('div',{id:'phys'}));
  [gPts,gBody,gRun,gFunc,gSnell,gClock,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view;
    gRun.hidden=!viewAnimates(v);
    rows.cb_loop.row.hidden=(v!=='race');
    rows.cb_showBeads.row.hidden=(v!=='race');
    gFunc.hidden=(v!=='func');
    gSnell.hidden=(v!=='snell');
    gClock.hidden=(v!=='clock');
    for(const k in rows) rows[k].sync();
    ptsTag.innerHTML=(v==='race'||v==='fit')?'or drag B'+(v==='race'?' and C':'')+' on the stage; every view shares this B'
                                            :'every view shares this B: a = '+fmt(cycloidFit(st.bx,st.by,gEff(st)).a,3)+' m follows from it';
    bodyTag.innerHTML=st.roll?'rolling without slipping: g &rarr; 5g/7, every time &times; &radic;(7/5), the curve unchanged'
                             :'a frictionless bead on a wire: v = &radic;(2gy)';
    runTag.innerHTML='space runs/pauses &nbsp; <b>r</b> restarts &nbsp; 1&ndash;6 switch views';
    funcTag.innerHTML='q = 1 is the line, q = 2 the sideways parabola; &epsilon; displaces the cycloid itself';
    snellTag.innerHTML='the ray converges on the cycloid, but only as N<sup>&minus;1/2</sup>';
    clockTag.innerHTML='both pendulums are released together from this string angle';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='race')?'drag B and C · space pauses · r restarts · 1–6 switch views'
        :(st.view==='fit')?'drag B in the small panel, or drag the aspect on the frontier · 1–6 switch views'
        :viewAnimates(st.view)?'space pauses · r restarts · 1–6 switch views':'1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ simReset(st); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%10===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(st); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  race:'Johann Bernoulli\'s challenge of June 1696: given two points A and B, not on a vertical line, find the curve '
    +'along which a bead sliding under gravity alone gets from A to B in the least time. Galileo had guessed the arc of a '
    +'circle; the straight line is the shortest route but not the quickest, because a bead is slow near the top and a '
    +'steep start buys speed early. Newton, Leibniz, l\'Hôpital and both Bernoullis answered within the year: the '
    +'<b>cycloid</b>, the curve traced by a point on the rim of a rolling wheel, turned upside down. Here six beads race '
    +'between the same two points; the speed at each depth is the same for all of them, <b>v = √(2gy)</b>, so only the '
    +'route decides. Drag <b>B</b> anywhere; drag <b>C</b> to bend your own curve toward the winner — it can come close, '

  func:'The descent time is a functional of the whole curve, T[y] = ∫ √((1 + y′²)/2gy) dx, and the brachistochrone is the '

    +'and even that member sits above the cycloid\'s time: the floor is not reached by any curve that is not the '
    +'cycloid. And the cycloid itself, displaced by ε y<sub>B</sub> sin²(πθ/θ<sub>B</sub>), gives a time that is '
    +'symmetric in ε to second order — <b>the first variation vanishes</b>, which is what Euler\'s equation says. '
    +'Because the integrand carries no explicit x, Beltrami\'s identity turns the second-order Euler–Lagrange equation '

    +'for everything else.',
  snell:'Bernoulli\'s own solution did not use the calculus of variations at all. Fermat had shown that light takes the '
    +'path of least time, and Snell\'s law is what least time looks like at an interface: sin θ / v is the same on both '
    +'sides. So imagine a medium whose speed of light grows with depth exactly as a falling bead\'s does, v = √(2gy); the '
    +'light ray in it IS the brachistochrone. In N layers the ray is a polyline, refracting at each interface, and the '

    +'A circular bowl of the same curvature at the bottom — radius 4a — is not isochronous: its hollow beads, released '
    +'from the same heights, arrive later the higher they start, and the right panel shows the lag from the complete '

  clock:'Huygens turned the tautochrone into a clock (Horologium Oscillatorium, 1673). A pendulum is isochronous only for '
