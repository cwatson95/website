    +'cycloid. The cheeks are the <b>evolute</b> of the bob\'s path — the curve the string unwinds from — and the evolute '
    +'of a cycloid is a congruent cycloid, so cycloidal cheeks make a cycloidal bob, and the period 4π√(a/g) does not '
    +'depend on amplitude at all. The circular pendulum of the same length released beside it runs slow by the factor '

  fit:'How the curve through two given points is found. Every cycloid from A is a scaled copy of one curve, so the shape '

};

function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const DERIV={
  race:'<h4>the speed, then the time</h4>'

    +'The cycloid has the closed form T = &theta;<sub>B</sub>&radic;(a/g), the corner &radic;(2y<sub>B</sub>/g) + x<sub>B</sub>/&radic;(2gy<sub>B</sub>).</p>'

    +'<div class="cite">pins: every T against scipy quad (derive.py), the cycloid and the corner against their closed forms, the table inversion against &theta;(t) = t&radic;(g/a)</div>',
  func:'<h4>Euler&ndash;Lagrange, and Beltrami&rsquo;s shortcut</h4>'
    +EQ(1,'T[y] = &int; F(y, y&prime;) dx, &nbsp; F = &radic;('+FR('1 + y&prime;<sup>2</sup>','2gy')+')')
    +EQ(2,'&part;F/&part;x = 0 &nbsp;&rArr;&nbsp; F &minus; y&prime; '+FR('&part;F','&part;y&prime;')+' = C &nbsp;&rArr;&nbsp; '+FR('1','&radic;(2gy(1 + y&prime;<sup>2</sup>))')+' = C &nbsp;&rArr;&nbsp; y(1 + y&prime;<sup>2</sup>) = 2a')

 *  selfTest — headless verification.  Reference values labelled       *
 *  (derive) are lines of build_brach/refvals.txt, the printed output  *

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

  /* ---------- J. the scene: frames, loops, the pointer ---------- */
  { const shot=makeShot(1100,712); const S=makeScene({getContext:()=>shot});
    Object.assign(ST,DEFAULTS); simReset(ST);
    ok(S.step(),'a frame advances on the race'); close(SIM.t,FRAME_DT,1e-15,'by 1/60 s at speed 1');
    ST.speed=2; S.step(); close(SIM.t,3*FRAME_DT,1e-15,'and by 2/60 at speed 2'); ST.speed=1;
    ST.running=false; ok(!S.step(),'paused: no frame'); ST.running=true;
    ST.view='func'; simReset(ST); ok(!S.step(),'the functional view has no clock');
    ST.view='race'; simReset(ST); SIM.t=raceModel(ST).Tmax+1.5; S.step(); ok(SIM.t<0.1,'the race loops once everyone is home plus a second');
    ST.loop=false; SIM.t=raceModel(ST).Tmax+1.5; S.step(); ok(SIM.t>raceModel(ST).Tmax,'and does not loop with the box off'); ST.loop=true;
    /* the drag: grab B, move, release */
    simReset(ST); const M=buildModel(), G=raceGeo(shot,S.W,S.H,M), map=G.map;
    ok(S.pointer('down',map.X(ST.bx)+3,map.Y(ST.by)-2),'pointer-down near B grabs it'); eq(DRAG.what,'B','and it is B');
    S.pointer('move',map.X(1.4),map.Y(0.7)); close(ST.bx,1.4,1e-9,'moving the pointer moves B (x)'); close(ST.by,0.7,1e-9,'and y');
    ok(DRAG.ext!==null,'the extent is frozen during the drag');
    ok(S.pointer('up',0,0),'pointer-up releases'); eq(DRAG.what,null,'nothing dragged'); eq(DRAG.ext,null,'extent unfrozen');
    Object.assign(ST,DEFAULTS); simReset(ST);
    const M2=buildModel(), G2=raceGeo(shot,S.W,S.H,M2), map2=G2.map;
    ok(S.pointer('down',map2.X(ST.cx)+2,map2.Y(ST.cy)+3),'pointer-down near C grabs C'); eq(DRAG.what,'C','it is C');
    S.pointer('move',map2.X(0.6),map2.Y(0.01)); close(ST.cx,0.6,1e-9,'C moves in x'); close(ST.cy,LIM.cyMinFrac*ST.by,1e-12,'C is held below A at the flattest allowed start');
    S.pointer('up',0,0);
    ok(!S.pointer('down',map2.X(2.5),map2.Y(1.3)),'a pointer-down far from B and C grabs nothing');
    ST.view='fit'; simReset(ST);
    { const M3=buildModel(), G3=fitGeo(shot,S.W,S.H,M3), p=G3.bottom[0];
      ok(S.pointer('down',p.x+p.w*0.75,p.y+10),'pointer-down on the frontier grabs the aspect');
      rel(ST.bx/ST.by,Math.pow(10,0.5),1e-9,'three quarters across the log axis is aspect 10^0.5');
      S.pointer('up',0,0); }
    Object.assign(ST,stSave); simReset(ST); }

  /* ---------- K. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['race start',{view:'race',t:0},10],['race mid',{view:'race',t:0.3},10],['race done',{view:'race',t:2},10],
    ['race wide',{view:'race',bx:2.5,by:0.5,t:0.5},10],['race tall',{view:'race',bx:0.2,by:1,t:0.2},10],['race rolling',{view:'race',roll:true,t:0.4},10],
    ['race C flat',{view:'race',cx:0.9,cy:0.03,t:0.6},10],
    ['func default',{view:'func'},4],['func q=1',{view:'func',q:1,eps:-0.04},4],['func q=4',{view:'func',q:4,eps:0},4],['func wide',{view:'func',bx:2.5,by:0.5,q:3},4],
    ['snell N=2',{view:'snell',layers:2},6],['snell N=8',{view:'snell',layers:8},8],['snell N=128',{view:'snell',layers:128},20],
    /* five filled beads is what the bowl draws at every size (the bottom row's marks are hollow) */
    ['tauto start',{view:'tauto',t:0},5],['tauto mid',{view:'tauto',t:0.4},5],['tauto late',{view:'tauto',t:3},5],
    ['clock start',{view:'clock',amp:60,t:0},5],['clock late',{view:'clock',amp:85,t:1.7},5],['clock small',{view:'clock',amp:5,t:0.9},5],
    ['fit default',{view:'fit'},5],['fit steep',{view:'fit',bx:0.12,by:1},5],['fit wide',{view:'fit',bx:3,by:0.15},5],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      /* the clock strip needs a history: pump some frames */
      if(over.view==='clock'&&over.t){ const S=makeScene({getContext:()=>makeShot(W,H)}); SIM.t=0; while(SIM.t<over.t) S.step(); }
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>3&&oy>3){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
