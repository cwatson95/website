    ok(bray({inter:true,nStage:2,fic:0.5}).wc<bray({}).wc,'intercooling cuts compressor work');
    ok(bray({reheat:true,nStage:2,frh:0.5}).wt>bray({}).wt,'reheat raises turbine work');
    /* Moran §9.8.2: for two stages returning to the same temperature the work is
       least at the geometric-mean pressure, f = 1/2 */
    let bw=1e9,bf=0;
    for(let f=0.2;f<=0.8;f+=0.005){ const w=bray({inter:true,nStage:2,fic:f}).wc;
      if(w<bw){bw=w;bf=f;} }
    ok(Math.abs(bf-0.5)<0.02,'two-stage compressor work is least at the geometric-mean '
       +'intercooler pressure (f = '+bf.toFixed(3)+', i.e. p_i = √(p₁p₂))');
    /* the Ericsson limit: more and more stages, with regeneration, walk the
       Brayton loop towards two isotherms and two isobars (Moran Fig. 9.20) */
    const E=ericssonCycle({p1:0.1,Tc:300,Th:1400,rp:10,ereg:1});
    const e2=bray({inter:true,reheat:true,regen:true,ereg:1,nStage:2}).eta;
    const e6=bray({inter:true,reheat:true,regen:true,ereg:1,nStage:6}).eta;
    ok(e6>e2,'more intercool/reheat stages raise eta ('+(100*e2).toFixed(1)+'% → '
       +(100*e6).toFixed(1)+'%)');
    ok(e6<E.eta+1e-9,'…and stay under the Ericsson limit of '+(100*E.eta).toFixed(1)+'%');
    ok(E.eta-e6<E.eta-e2,'…closing on it as stages are added'); }

  /* ---------- THE THEOREM again, on the gas half ---------- */
  { const gcases=[
      ['Otto',      ottoCycle({p1:0.1,T1:300,r:8,Tmax:2000})],
      ['Otto tall', ottoCycle({p1:0.1,T1:300,r:14,Tmax:2250})],
      ['Diesel',    dieselCycle({p1:0.1,T1:300,r:18,rc:2})],
      ['dual',      dualCycle({p1:0.1,T1:300,r:18,rp:1.5,rc:1.2})],
      ['Brayton',   bray({})],
      ['Brayton irrev.', bray({etaC:0.8,etaT:0.8})],
      ['Brayton all-on', bray({inter:true,reheat:true,regen:true,ereg:0.8,nStage:3})],
      ['Ericsson',  ericssonCycle({p1:0.1,Tc:300,Th:1400,rp:10,ereg:1})],
      ['Stirling',  stirlingCycle({p1:0.1,Tc:300,Th:1400,rv:8,ereg:1})]];
    for(const [tag,C] of gcases){
      const A=cycleAreas(C);
      chk(tag+': cyclic P dv = cyclic T ds',A.pv,A.ts,1e-3,true);
      ok(C.pts.every(s=>isFinite(s.v)&&isFinite(s.s)&&isFinite(s.T)&&isFinite(s.p)),
         tag+': every sampled state is finite');
      ok(C.pts.every(s=>s.T>=T_AIR_MIN-1e-9&&s.T<=T_AIR_MAX+1e-9),
         tag+': every sampled state is inside the property model');
      ok(C.eta>0&&C.eta<1,tag+': efficiency in (0,1) — '+(100*C.eta).toFixed(2)+'%');
      ok(C.eta<=C.etaCarnot+1e-9,tag+': efficiency does not beat its Carnot bound ('
         +(100*C.eta).toFixed(2)+'% vs '+(100*C.etaCarnot).toFixed(2)+'%)');
      ok(C.pts.every(s=>s.fl==='air'),tag+': every sample is tagged as air');
    }
    /* the reversible ones must also equal the net work */
    for(const [tag,C] of gcases) if(tag.indexOf('irrev')<0){
      const A=cycleAreas(C);
      chk(tag+': area = w_net',A.ts,C.wnet,3e-3,true); } }

  /* ---------- no gas sample is ever clamped, over the whole slider space ---------- */
  { let clamped=0, checked=0, worst='', n=0, threw=0, badEta=0, worstEta='', nCyc=0, nDead=0;
    const T1s=[280,300,340], p1s=[0.05,0.1,0.2];
    for(const p1 of p1s) for(const T1 of T1s){
      try{
        for(const r of [4,8,11,14]) for(const Tmax of [900,1500,2250]){
          n++; var C=ottoCycle({p1,T1,r,Tmax}); sweepCheck(C); }
        for(const r of [10,18,24]){
          for(const rc of [1,2,3.5]){ n++; sweepCheck(dieselCycle({p1,T1,r,rc})); }
          for(const rp of [1,1.6,2.2]) for(const rc of [1,1.6,2.2]){
            n++; sweepCheck(dualCycle({p1,T1,r,rp,rc})); } }
        for(const rp of [2,10,30]) for(const Tmax of [800,1400,1800])
          for(const et of [1,0.7]) for(const ns of [2,4,6])
            for(const mods of [[false,false,false],[true,false,false],[false,true,false],
                               [false,false,true],[true,true,true]]){
              n++; sweepCheck(braytonCycle({p1,T1,rp,Tmax,etaC:et,etaT:et,
                inter:mods[0],reheat:mods[1],regen:mods[2],ereg:0.8,nStage:ns,fic:0.5,frh:0.5})); }
        for(const Th of [600,1400,2200]) for(const Tc of [250,500,900]){
          if(Tc>Th-40) continue;
          for(const rp of [2,10,30]) for(const e of [0,1]){
            n++; sweepCheck(ericssonCycle({p1,Tc,Th,rp,ereg:e})); }
          for(const rv of [1.5,8,20]) for(const e of [0,1]){
            n++; sweepCheck(stirlingCycle({p1,Tc,Th,rv,ereg:e})); } }
      }catch(e){ threw++; if(!worst) worst=String(e.message||e); }
    }
    /* Being in the box is not the same as being a cycle.  Two corners of the
       slider space are degenerate rather than out of range, and only an
       efficiency check finds them: the dual cycle with BOTH ratios at 1 adds no
       heat at all (eta = 0/0), and a high-pressure-ratio Brayton with a poor
       compressor can discharge hotter than the turbine inlet asked for, making
       q_in negative.  Both are pinned in the builders; this is the assertion
       that proves the pins hold. */
    function sweepCheck(C){
      nCyc++;
      if(C.dead){ nDead++; if(C.kind!=='brayton'){ badEta++;
        if(!worstEta) worstEta=C.kind+' produces no net work, and only a gas turbine should '
          +'be able to'; } }
      if(!(isFinite(C.eta)&&C.qin>0)){ badEta++;
        if(!worstEta) worstEta=C.kind+' eta='+C.eta+' q_in='+C.qin.toFixed(2); }
      if(!C.dead&&!(C.eta>0&&C.eta<1&&C.eta<=C.etaCarnot+1e-9)){ badEta++;
        if(!worstEta) worstEta=C.kind+' eta='+C.eta+' vs Carnot '+C.etaCarnot; }
      for(const s of C.pts.concat(C.nodes)){ checked++;
        if(!inBox(s,'T')||!inBox(s,'P')||!inBox(s,'u')){ clamped++;
          if(!worst) worst='T='+s.T.toFixed(1)+' p='+s.p.toExponential(2)
                          +' v='+s.v.toExponential(2)+' s='+s.s.toFixed(3)+' u='+s.u.toFixed(0); } }
    }
    ok(threw===0,'no slider combination drives the air model out of range ('
       +(threw?worst:'0 throws')+')');
    ok(clamped===0,'no gas-cycle sample is clamped over '+n+' parameter combinations ('
       +checked+' states checked'+(clamped?', first offender '+worst:'')+')');
    ok(badEta===0,'all '+nCyc+' swept cycles have q_in > 0 and finite eta, and every one that '
       +'makes net work obeys 0 < eta <= Carnot'+(badEta?' (first offender '+worstEta+')':''));
    ok(nDead>0&&nDead<nCyc*0.15,nDead+' of '+nCyc+' are gas turbines that consume net work — '
       +'reachable, as they should be, but not the common case');
    /* the corners, shown to be genuinely reachable and genuinely handled */
    { const D=dualCycle({p1:0.1,T1:300,r:18,rp:1,rc:1});
      ok(isFinite(D.eta)&&D.eta>0,'dual with r_p = r_c = 1 is pinned to a real cycle, not 0/0 ('
         +(100*D.eta).toFixed(2)+'%)');
      const B=braytonCycle({p1:0.1,T1:300,rp:30,Tmax:800,etaC:0.7,etaT:0.7,
        inter:false,reheat:false,regen:false,ereg:0,nStage:2,fic:0.5,frh:0.5});
      ok(B.qin>0&&B.Tpeak>B.nodes[1].T,'a 30:1 Brayton with a 70% compressor pins its turbine '
         +'inlet above the discharge ('+fmtT(B.nodes[1].T)+' → '+fmtT(B.Tpeak)+')');
      ok(B.dead&&B.bwr>1,'…and is flagged dead, bwr = '+(100*B.bwr).toFixed(0)+'%');
      const stub=Object.assign({},DEFAULTS,{cycle:'brayton',rPres:30,Ttit:800,
        etaT:0.7,etaP:0.7,mInter:false,mReheat:false,mRegen:false});
      const note=readoutHTML(stub,B,cycleAreas(B));
      ok(note.indexOf('Not a power cycle')>0,'…and the readout says so in words');
      ok(note.indexOf('NaN')<0&&note.indexOf('undefined')<0,'…without holes'); } }

  /* ---------- the gas loops draw without a gap, same measure as the steam ones ---------- */
  { const diag=Math.hypot(LX,LY,LZ); let worst=0, wtag='';
    const gl=[['Otto',ottoCycle({p1:0.1,T1:300,r:14,Tmax:2250})],
              ['Diesel',dieselCycle({p1:0.1,T1:300,r:24,rc:3.5})],
              ['dual',dualCycle({p1:0.1,T1:300,r:24,rp:2.2,rc:2.2})],
              ['Brayton',bray({rp:30})],
              ['Brayton all-on',bray({inter:true,reheat:true,regen:true,ereg:1,nStage:6,rp:30})],
              ['Ericsson',ericssonCycle({p1:0.1,Tc:250,Th:2200,rp:30,ereg:1})],
              ['Stirling',stirlingCycle({p1:0.1,Tc:250,Th:2200,rv:20,ereg:1})]];
    for(const [tag,C] of gl) for(const hk of ['T','P','u']){
      const w=C.pts.map(s=>worldPt(s,hk));
      for(let i=0;i<w.length;i++){ const a=w[i], b=w[(i+1)%w.length];
        const d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2])/diag;
        if(d>worst){ worst=d; wtag=tag+'/'+hk; } } }
    ok(worst<0.06,'gas loops have no visible gap either: worst step '+(100*worst).toFixed(2)
       +'% of the box diagonal, at '+wtag); }

  /* ---------- axis boxes ---------- */
  { for(const fl of ['water','air']) for(const k of ['v','s','T','P','u']){
      const A=axOf(fl)[k];
      chk(fl+' axis '+k+': nrm/unnrm round trip',nrm(A,unnrm(A,0.37)),0.37,1e-12,false);
      ok(A.hi>A.lo,fl+' axis '+k+' is not inverted'); }
    ok(axOf('air')!==axOf('water'),'the two fluids get different boxes');
    /* a state is measured against its OWN fluid's box, never a global one */
    const w=worldPt(wet(450,0.5),'T'), g=worldPt(gas(1,900),'T');
    ok(w.every(isFinite)&&g.every(isFinite),'worldPt is finite for both fluids');
    const fake=Object.assign({},gas(1,900),{fl:'water'});
    ok(Math.abs(worldPt(fake,'T')[2]-g[2])>0.05,
       'the same numbers on the wrong box land somewhere else — which is why fl is on the state'); }

  /* ---------- strings ---------- */
  { const stub=Object.assign({},DEFAULTS);
    const COMBOS=[['carnot',{}],['rankine',{mSuper:false}],['rankine',{mSuper:true}],
      ['rankine',{mSuper:true,mReheat:true}],
      ['rankine',{mSuper:true,mOpenFW:true}],
      ['rankine',{mSuper:true,mClosedFW:true}],
      ['rankine',{mSuper:true,mOpenFW:true,mClosedFW:true}],
      ['rankine',{mSuper:true,mReheat:true,mOpenFW:true,mClosedFW:true}],
      ['rankine',{mSuper:false,mOpenFW:true,mClosedFW:true}],
      ['otto',{}],['diesel',{}],['dual',{}],
      ['brayton',{}],['brayton',{mRegen:true}],['brayton',{mInter:true,mReheat:true}],
      ['brayton',{mInter:true,mReheat:true,mRegen:true}],
      ['ericsson',{mRegen:true}],['ericsson',{mRegen:false}],
      ['stirling',{mRegen:true}],['stirling',{mRegen:false}]];
    for(const [kind,mods] of COMBOS){
      Object.assign(stub,DEFAULTS,{cycle:kind,mSuper:false,mReheat:false,mInter:false,
                                   mRegen:false,mOpenFW:false,mClosedFW:false},
                    PRESETS[kind]||{},mods);
      const C=buildCycle(stub), A=cycleAreas(C);
      const tag=kind+'['+Object.keys(mods).join(',')+']';
      const r=readoutHTML(stub,C,A), e=eqbarHTML(C,A), t=eqbarText(C,A);
      ok(r.indexOf('undefined')<0&&r.indexOf('NaN')<0,tag+' readout has no holes');
      ok(e.indexOf('undefined')<0&&e.indexOf('NaN')<0,tag+' eqbar has no holes');
      ok(t.indexOf('undefined')<0&&t.indexOf('NaN')<0,tag+' eqbar text has no holes');
      ok(/∮|&#8750;/.test(e),tag+' eqbar states the loop-integral identity');
      ok(cycleTitle(stub).indexOf('undefined')<0,tag+' title is clean');
      ok(C.nodes.length>=4&&C.nodes.every(n=>isFinite(n.T)&&isFinite(n.p)),tag+' has real nodes');
      for(const v of ['surface','pv','ts','hs']){
        stub.view=v; const tg=tagHTML(stub,C);
        ok(typeof tg==='string'&&tg.indexOf('undefined')<0,tag+'/'+v+' tag is clean'); }
      stub.view='surface'; }
    /* the module table and the cycle table agree with each other */
    for(const m of MOD_ORDER) for(const c of MODULES[m].on)
      ok(CYCLES[c]!==undefined,'module "'+m+'" is offered on a cycle that exists: '+c);
    for(const k in CYCLES) ok(typeof CYCLES[k].sub==='string'&&AXES[CYCLES[k].fl]!==undefined,
      'cycle '+k+' names a fluid with a box');
    for(const hk of ['T','P','u']) ok(typeof HEIGHT_NOTE[hk]==='string','height note for '+hk);
    for(const v of ['surface','pv','ts','hs']){
      ok(typeof INFO[v]==='string','info text for '+v);
      ok(typeof INFO_AIR[v]==='string'&&INFO_AIR[v]!==INFO[v],
         'air gets its own info text for '+v); } }
  /* colour parsing — mix() must accept its own output */
  { ok(toRgb('#2b5f96').join()==='43,95,150','toRgb parses 6-digit hex');
    ok(toRgb('#abc').join()==='170,187,204','toRgb parses 3-digit hex');
    ok(toRgb('rgb(58,111,142)').join()==='58,111,142','toRgb parses rgb()');
    ok(toRgb('rgba(58,111,142,0.5)').join()==='58,111,142','toRgb parses rgba()');
    ok(toRgb(mix('#3a6f8e','#d8a04a',0.5)).every(c=>c>0),'mix output re-parses non-black');
    const two=mix('#070b18',mix('#3a6f8e','#d8a04a',0.4),0.8);
    ok(toRgb(two).reduce((a,b)=>a+b)>150,'two-stage blend stays bright ('+two+')');
    let threw=false; try{ toRgb('chartreuse'); }catch(e){ threw=true; }
    ok(threw,'toRgb throws on an unparseable colour instead of silently going black'); }
  { ok(fmtP(0.008).indexOf('kPa')>0,'fmtP switches to kPa');
    ok(fmtP(16.5).indexOf('MPa')>0,'fmtP keeps MPa');
    ok(fmtC(373.15).indexOf('100.0')===0,'fmtC converts to Celsius');
    ok(fmtX(wet(400,0.5))==='0.5000','fmtX prints quality');
    ok(fmtX(liq(10,400))==='liquid','fmtX names the liquid phase');
    ok(tickLabel(100,false)==='100','linear tick label');
    ok(ticks(1e-3,1e2,true,5).length===6,'log ticks span the decades'); }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
