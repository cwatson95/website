    for(let i=0;i<=nT;i+=4) isoLine(rows[i],'rgba(150,195,240,.18)',0.8);
  }
  /* ---- superheated vapour: (T, log P) from the box's v edge to the region-2
         ceiling.  The low-pressure end is set by where v leaves the box, not by
         a fixed p: at 1075 K a fixed 0.6 kPa floor would put v near 700 m³/kg,
         three times the axis. ---- */
  { const rows=[];
    for(let i=0;i<=nT;i++){
      const T=lerp(T_SURF_MIN,T_SURF_MAX,i/nT), p1=vaporPmax(T), r=[];
      const p0=vapPminForBox(T);
      for(let j=0;j<=nP;j++) r.push(vap(Math.exp(lerp(Math.log(p0),Math.log(p1),j/nP)),T));
      rows.push(r);
    }
    for(let i=0;i<nT;i++) for(let j=0;j<nP;j++)
      push(rows[i][j],rows[i][j+1],rows[i+1][j+1],rows[i+1][j],'#a8523f','vap');
    for(let i=0;i<=nT;i+=4) isoLine(rows[i],'rgba(235,160,130,.16)',0.8);
  }
  return {quads, lines, hk};
}
const LIGHT=v3.norm([0.42,-0.66,0.62]);
function facetNormal(a,b,c){
  return v3.norm(v3.cross(v3.sub(b,a),v3.sub(c,a)));
}

/* the dome's outline in (v,s), used on the floor and in the 2-D views */
function domeCurve(n){
  const f=[],g=[];
  for(let i=0;i<=n;i++){
    const T=T_SURF_MIN+(TC_W-T_SURF_MIN)*(1-Math.pow(1-i/n,1.7)), S=sat(T);
    f.push({T,p:S.p,v:S.vf,s:S.sf,h:S.hf,u:S.uf,exact:S.exact});
    g.push({T,p:S.p,v:S.vg,s:S.sg,h:S.hg,u:S.ug,exact:S.exact});
  }
  return {f,g};
}
/* region 3's footprint — the hole this sim does not fill in */
function region3Outline(n){
  const o=[];
  for(let i=0;i<=n;i++){ const T=lerp(T_R1MAX,TC_W,i/n), S=sat(T); o.push({T,v:S.vf,s:S.sf,p:S.p,u:S.uf}); }
  for(let i=0;i<=n;i++){ const T=lerp(TC_W,T_R1MAX,i/n), S=sat(T); o.push({T,v:S.vg,s:S.sg,p:S.p,u:S.ug}); }
  for(let i=0;i<=n;i++){ const T=lerp(T_R1MAX,863.15,i/n);
    const p=b23p(T), st=vap(Math.min(p,100),T); o.push(st); }
  return o;
}

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
function fmtP(p){ return p>=10?p.toFixed(2)+' MPa': p>=0.1?p.toFixed(3)+' MPa'
                       : p>=1e-3?(p*1000).toFixed(2)+' kPa':(p*1e6).toFixed(1)+' Pa'; }
function fmtV(v){ return v>=10?v.toFixed(2): v>=0.1?v.toFixed(4): v.toExponential(3); }
function fmtT(T){ return T.toFixed(1)+' K'; }
function fmtC(T){ return (T-273.15).toFixed(1)+' °C'; }
function fmtX(st){ return st.reg===0 ? 'gas'
                        : st.x>=0&&st.x<=1 ? st.x.toFixed(4)
                        : st.reg===1?'liquid':st.reg===2?'vapour':'—'; }
function fmtMep(kPa){ return kPa>=1000?(kPa/1000).toFixed(3)+' MPa':kPa.toFixed(1)+' kPa'; }

/* ================================================================== *
 *  the equation bar                                                   *
 * ================================================================== */
function eqbarHTML(cyc,areas){
  const eq='<span class="lhs">du = T ds &minus; P dv</span>'
    +' &nbsp;&rArr;&nbsp; &#8750;<i>T</i>&#8239;d<i>s</i> &minus; &#8750;<i>P</i>&#8239;d<i>v</i>'
    +' = &#8750;d<i>u</i> = 0';
  const nums='&#8750;<i>P</i>&#8239;d<i>v</i> = <span class="hl">'+areas.pv.toFixed(2)+'</span>'
    +' &nbsp;&middot;&nbsp; &#8750;<i>T</i>&#8239;d<i>s</i> = <span class="hl">'+areas.ts.toFixed(2)
    +'</span> kJ/kg';
  const eta= cyc.kind==='carnot'
    ? '&eta; = 1 &minus; <i>T</i><sub>c</sub>/<i>T</i><sub>h</sub> = <span class="hl2">'
      +(100*cyc.eta).toFixed(2)+'%</span>'
    : '&eta; = <span class="hl2">'+(100*cyc.eta).toFixed(2)+'%</span> of a possible '
      +(100*cyc.etaCarnot).toFixed(2)+'%';
  const gap=Math.abs(areas.pv-areas.ts);
  /* The identity above needs only that the loop closes, so it survives
     regeneration untouched.  What does NOT survive is "area = work": the loop
     integrates the low-pressure end as though a whole kilogram went round it,
     and with steam bled off only (1 - Sy) does.  Say which is which. */
  const massNote = cyc.massLoop===false
    ? ' &nbsp;&middot;&nbsp; but only <span class="hl2">'+(100*cyc.yCond).toFixed(1)
      +'%</span> of the mass reaches the condenser, so the area is <b>not</b> '
      +'w<sub>net</sub> = '+cyc.wnet.toFixed(1)
    : '';
  return eq+'<span class="sm">'+nums+' &nbsp;&middot;&nbsp; equal to '
    +gap.toExponential(1)+' kJ/kg (quadrature)'+massNote
    +' &nbsp;&middot;&nbsp; '+eta+'</span>';
}
function eqbarText(cyc,areas){
  return 'du = T ds - P dv; cyclic T ds = cyclic P dv = cyclic du = 0. '
    +'Pdv='+areas.pv.toFixed(3)+' Tds='+areas.ts.toFixed(3)+' eta='+(100*cyc.eta).toFixed(2)+'%';
}

/* ================================================================== *
 *  readout                                                            *
 * ================================================================== */
/* the modules are named in the title, so the readout always says what is
   actually running rather than what the cycle is called */
function cycleTitle(st){
  const on=[];
  if(modOn(st,'superheat')||(st.cycle==='rankine'&&modOn(st,'reheat'))) on.push('superheat');
  if(modOn(st,'intercool')) on.push('intercooling');
  if(modOn(st,'reheat'))    on.push('reheat');
  if(modOn(st,'regen'))     on.push('regeneration');
  return CYCLES[st.cycle].name+(on.length?' + '+on.join(' + '):'');
}
function readoutHTML(st,cyc,areas){
  const air=cyc.fl==='air';
  const rows=cyc.nodes.map((n,i)=>
    '<tr><td>'+(i+1)+'&nbsp; '+fmtT(n.T)+'</td><td class="v">'+fmtP(n.p)+'</td>'
    +'<td class="v">'+(air?fmtV(n.v):fmtX(n))+'</td></tr>').join('');
  const etaPct=100*cyc.eta, capPct=100*cyc.etaCarnot;
  const legend=air
    ? '<span><i style="background:#2c6a8f"></i>cool gas</span>'
      +'<span><i style="background:#c2582f"></i>hot gas</span>'
      +'<span><i style="background:#b8ec4c"></i>cycle</span>'
      +'<span><i style="background:#cd35c4"></i>shadows</span>'
    : '<span><i style="background:#2b5f96"></i>liquid</span>'
      +'<span><i style="background:#c9913f"></i>two-phase</span>'
      +'<span><i style="background:#a8523f"></i>vapour</span>'
      +'<span><i style="background:#b8ec4c"></i>cycle</span>'
      +'<span><i style="background:#cd35c4"></i>shadows</span>';
  /* extra energy rows that only some cycles have a meaning for */
  let extra='';
  if(cyc.vDisp>0) extra+='<tr><td>mean eff. pressure</td><td class="v"></td><td class="v">'
    +fmtMep(mepOf(cyc))+'</td></tr>';
  if(cyc.bwr!==undefined) extra+='<tr><td>back work ratio</td><td class="v"></td><td class="v">'
    +(100*cyc.bwr).toFixed(1)+'%</td></tr>';
  if(cyc.qRegen>0) extra+='<tr><td>regenerated q</td><td class="v"></td><td class="v">'
    +cyc.qRegen.toFixed(1)+'</td></tr>';
  /* the bleed fractions, and the one number that says the area has stopped
     being the work */
  if(cyc.fractions){
    extra+='<tr><td class="hd">bled steam</td><td class="hd v"></td>'
      +'<td class="hd v">fraction</td></tr>';
    for(const f of cyc.fractions)
      extra+='<tr><td>'+f.tag+'</td><td class="v"></td><td class="v">'
        +f.y.toFixed(4)+'</td></tr>';
    extra+='<tr><td>area &minus; w<sub>net</sub></td><td class="v"></td><td class="v">'
      +(areas.ts-cyc.wnet).toFixed(1)+'</td></tr>';
  }
  return '<div class="rname">'+cycleTitle(st)
    +'<small>'+CYCLES[st.cycle].sub+'</small></div>'
    +'<table><tr><td class="hd">state</td><td class="hd v">P</td>'
    +'<td class="hd v">'+(air?'v  m³/kg':'quality x')+'</td></tr>'
    +rows
    +'<tr><td class="hd">energy</td><td class="hd v"></td><td class="hd v">kJ/kg</td></tr>'
    +'<tr><td>heat in q<sub>in</sub></td><td class="v"></td><td class="v">'+cyc.qin.toFixed(1)+'</td></tr>'
    +'<tr><td>net work w<sub>net</sub></td><td class="v"></td><td class="v">'+cyc.wnet.toFixed(1)+'</td></tr>'
    +'<tr><td>&#8750;P dv</td><td class="v"></td><td class="v">'+areas.pv.toFixed(1)+'</td></tr>'
    +'<tr><td>&#8750;T ds</td><td class="v"></td><td class="v">'+areas.ts.toFixed(1)+'</td></tr>'
    +extra
    +'</table>'
    +'<div class="etabar"><div class="etafill" style="width:'+clamp(etaPct,0,100).toFixed(1)+'%"></div>'
    +'<div class="etacap" style="left:'+clamp(capPct,0,100).toFixed(1)+'%"></div></div>'
    +'<div class="note"><b>&eta; = '+etaPct.toFixed(2)+'%</b>'
    +(cyc.dead?''
       :st.cycle==='carnot'?' — the Carnot bound itself'
       :', against the Carnot bound '+capPct.toFixed(2)+'% (magenta tick)')+'.'
    +readoutNote(cyc)
    +'</div><div class="legend">'+legend+'</div>';
}
/* the one sentence each cycle most needs said about the numbers above it */
function readoutNote(cyc){
  if(cyc.dead)
    return ' <b>Not a power cycle at these settings</b>: the compressor eats more than the '
      +'turbine makes (back work ratio '+(100*cyc.bwr).toFixed(0)+'%), so w<sub>net</sub> is '
      +'negative. A gas turbine spends 40–80% of its turbine output on its own compressor — '
      +'against about 1% for a steam plant’s feed pump — so it has that much less margin '
      +'to lose to poor components.';
  if(cyc.x4!==undefined&&cyc.x4>=0&&cyc.x4<=1)
    return ' Turbine exhausts at quality <b>'+cyc.x4.toFixed(3)+'</b>'
      +(cyc.x4<0.88?' — wet enough to erode blades.':'.');
  switch(cyc.kind){
    case 'regen': return ' Steam is bled off the turbine, so only <b>'
      +(100*cyc.yCond).toFixed(1)+'%</b> of the kilogram reaches the condenser. The loop still '
      +'closes — &#8750;T ds = &#8750;P dv is untouched — but the enclosed area is no longer '
      +'the work: it counts the low-pressure end at full mass. Bleeding costs work and saves '
      +'more heat, which is the whole trick.';
    case 'carnot':  return ' Leg 4&rarr;1 compresses a two-phase mixture: no such pump exists.';
    case 'otto':    return ' Compression ratio <b>'+cyc.r.toFixed(1)+'</b>; knock caps a real '
      +'petrol engine near 11.';
    case 'diesel':  return ' Cutoff ratio <b>'+cyc.rc.toFixed(2)+'</b>. At equal compression '
      +'ratio a Diesel always trails an Otto — but it may compress twice as hard.';
    case 'dual':    return ' Peak <b>'+fmtT(cyc.Tpeak)+'</b>. Set r<sub>p</sub>=1 for a Diesel, '
      +'r<sub>c</sub>=1 for an Otto: the dual cycle contains both.';
    case 'brayton': return ' Back work ratio <b>'+(100*cyc.bwr).toFixed(0)+'%</b> — the '
      +'compressor eats that much of the turbine, against ~1% for a steam plant’s pump.'
      +(cyc.regen?' The regenerator moved <b>'+cyc.qRegen.toFixed(0)+' kJ/kg</b> internally: '
        +'the loop, and both areas, did not move at all.':'');
    case 'ericsson': case 'stirling':
      return cyc.ereg>=0.999
        ? ' Perfect regeneration &rArr; <b>&eta; = 1 &minus; T<sub>c</sub>/T<sub>h</sub></b> exactly '
          +'— the Carnot value, from a cycle that is not Carnot.'
        : ' Regenerator at <b>'+(100*cyc.ereg).toFixed(0)+'%</b>: the shortfall is bought from '
          +'the furnace, and the Carnot bound is lost.';
  }
  return ' Turbine exhaust is dry.';
}

/* ================================================================== *
 *  2-D diagram views                                                  *
 * ================================================================== */
const VIEWS={
  pv:{x:'v', y:'p', xlog:true, ylog:true,
      xlab:'specific volume v  (m³/kg)', ylab:'pressure P  (MPa)',
      title:'P–v', sub:'area inside the loop = ∮P dv',
      rng:{water:{xlo:7e-4,xhi:2.2e2,ylo:2e-3,yhi:1.1e2},
           air:  {xlo:1e-2,xhi:1.6e1,ylo:3e-2,yhi:6e1}}},
  ts:{x:'s', y:'T', xlog:false, ylog:false,
      xlab:'specific entropy s  (kJ/kg·K)', ylab:'temperature T  (K)',
      title:'T–s', sub:'area inside the loop = ∮T ds',
      rng:{water:{xlo:0,xhi:10.8,ylo:270,yhi:1080},
           air:  {xlo:0.3,xhi:4.3,ylo:195,yhi:2300}}},
  hs:{x:'s', y:'h', xlog:false, ylog:false,
      xlab:'specific entropy s  (kJ/kg·K)', ylab:'specific enthalpy h  (kJ/kg)',
      title:'Mollier h–s', sub:'a vertical drop is an ideal turbine',
      rng:{water:{xlo:0,xhi:10.8,ylo:0,yhi:4400},
           air:  {xlo:0.3,xhi:4.3,ylo:150,yhi:2650}}},
};
/* the frame is the fluid's own box, for the same reason the 3-D one is */
function viewOf(key,fl){ return Object.assign({},VIEWS[key],VIEWS[key].rng[fl||'water']); }
function makeMap(V,W,H){
  const L=64, R=18, Tp=18, Bt=44;
  const fx=val=>{ const f=V.xlog?(Math.log10(val)-Math.log10(V.xlo))/(Math.log10(V.xhi)-Math.log10(V.xlo))
                                :(val-V.xlo)/(V.xhi-V.xlo); return L+f*(W-L-R); };
  const fy=val=>{ const f=V.ylog?(Math.log10(val)-Math.log10(V.ylo))/(Math.log10(V.yhi)-Math.log10(V.ylo))
                                :(val-V.ylo)/(V.yhi-V.ylo); return H-Bt-f*(H-Bt-Tp); };
  return {fx,fy,L,R,Tp,Bt,W,H, pt:st=>[fx(st[V.x]),fy(st[V.y])]};
}
function ticks(lo,hi,log,n){
  const out=[];
  if(log){ const a=Math.floor(Math.log10(lo)), b=Math.ceil(Math.log10(hi));
    for(let e=a;e<=b;e++){ const val=Math.pow(10,e); if(val>=lo*0.999&&val<=hi*1.001) out.push(val); }
    return out; }
  const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].reduce((p,c)=>Math.abs(c*mag-raw)<Math.abs(p*mag-raw)?c:p,1)*mag;
  for(let val=Math.ceil(lo/step)*step; val<=hi*1.0001; val+=step) out.push(val);
  return out;
}
function tickLabel(val,log){
  if(log){ const e=Math.round(Math.log10(val));
    return e>=0&&e<=2 ? String(Math.round(val)) : '10'+String(e).replace('-','−')
      .split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹⁻'
        ['0123456789−'.indexOf(c)]).join(''); }
  return Math.abs(val)>=1000?val.toFixed(0):Math.abs(val)>=10?val.toFixed(0)
        :Math.abs(val)>=1?val.toFixed(1):val.toFixed(2);
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
const DEFAULTS={ view:'surface', cycle:'carnot', height:'T',
  /* water */
  Th:560, Tc:320, pb:8, pc:0.008, pr:0.8, Tsup:773.15, etaT:1, etaP:1,
  /* air */
  p1:0.1, T1:300, rComp:8, rCut:2, rPk:1.5, rPres:10, rVol:8,
  Tmax:2000, Ttit:1400, gTh:1400, gTc:300,
  /* modules.  The regenerator starts OFF so that a first click on Brayton is
     the plain textbook cycle (Moran Ex 9.4); picking Ericsson or Stirling
     switches it on, because those two are defined with one. */
  mSuper:true, mReheat:false, mInter:false, mRegen:false,
  mOpenFW:false, mClosedFW:false,
  /* feedwater heating: open-heater pressure, number of closed heaters, where the
     top one bleeds (as a fraction of the log pressure span), the closed heaters'
     terminal temperature difference, and the reheat temperature */
  pOfw:0.3, nClosed:1, fTop:0.8, ttd:7, Trh:713.15,
  etaReg:1, nStage:2, fic:0.5, frh:0.5,
  /* view */
  dens:1, spin:false, showDome:true, showMesh:true, showShadow:true,
  showWalls:true, showR3:true, anim:true, speed:1 };

function makeScene(canvas){
  const ctx=canvas.getContext('2d');
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-2.28,0.38,4.65,[0,0,0]);
  let mesh=null, cyc=null, areas=null, dome=null, r3=null, tAnim=0;

  function rebuildCycle(){ cyc=buildCycle(st); areas=cycleAreas(cyc); }
  function rebuildMesh(){ mesh=buildMesh(st.height,st.dens,fluidOf(st.cycle));
    dome=domeCurve(150); r3=region3Outline(40); }
  function rebuildAll(){ rebuildCycle(); rebuildMesh(); }

  /* ---------------- 3-D ---------------- */
  function draw3D(){
    const W=cam.W,H=cam.H, B=camBasis(cam);
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const P=p=>project(cam,B,p);
    const fl=fluidOf(st.cycle), A=axOf(fl);
    const hk=st.height, HA=A[hk], water=(fl==='water');

    if(st.showWalls) drawWalls(P,hk,A);

    /* surface, painter's algorithm */
    const vis=[];
    for(const q of mesh.quads){
      const a=P(q.q[0]),b=P(q.q[1]),c=P(q.q[2]),d=P(q.q[3]);
      if(!a||!b||!c||!d) continue;
      vis.push({a,b,c,d, z:(a.z+b.z+c.z+d.z)*0.25, col:q.c});
    }
    vis.sort((m,n)=>n.z-m.z);
    ctx.globalAlpha=1;
    for(const q of vis){
      ctx.fillStyle=q.col;
      ctx.beginPath(); ctx.moveTo(q.a.x,q.a.y); ctx.lineTo(q.b.x,q.b.y);
      ctx.lineTo(q.c.x,q.c.y); ctx.lineTo(q.d.x,q.d.y); ctx.closePath(); ctx.fill();
    }
    if(st.showMesh) for(const L of mesh.lines) strokePoly(P,L.pts,L.c,L.w);

    /* the saturation dome's two edges, drawn on the surface.  Air has no dome
       and no region 3 — that absence IS the difference between the two fluids,
       so nothing stands in for them. */
    if(st.showDome&&water){
      strokeStates(P,dome.f.filter(s=>s.exact),hk,'rgba(120,200,255,.85)',1.9);
      strokeStates(P,dome.g.filter(s=>s.exact),hk,'rgba(255,190,120,.85)',1.9);
      strokeStates(P,dome.f.filter(s=>!s.exact),hk,'rgba(120,200,255,.55)',1.4,[4,4]);
      strokeStates(P,dome.g.filter(s=>!s.exact),hk,'rgba(255,190,120,.55)',1.4,[4,4]);
      const cp=P(worldPt({fl:'water',v:1/RHOC_W,s:S_CRIT,T:TC_W,P:PC_W,p:PC_W,
                          u:H_CRIT-PC_W*1000/RHOC_W},hk));
      if(cp){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cp.x,cp.y,3.4,0,TAU); ctx.fill();
        ctx.font='italic 11px Georgia, serif'; ctx.fillStyle='rgba(255,255,255,.62)';
        ctx.textAlign='right'; ctx.fillText('critical point',cp.x-8,cp.y-7);
        ctx.textAlign='left'; }
    }
    if(st.showR3&&water) strokeStates(P,r3,hk,'rgba(190,120,200,.5)',1.2,[3,4]);
    /* the regenerator, drawn as what it is: the stretches of the loop that are
       paid for internally rather than bought.  They sit ON the loop, so they
       can only be marked, never seen as area — which is exactly the point. */
    if(cyc.regSegs) for(const g of cyc.regSegs)
      strokeStates(P,regSegStates(g),hk,'rgba(90,200,224,.95)',4.5);
    /* the bled steam.  Each branch is drawn in the same cyan as a regenerator —
       it is regeneration, done with a different piece of plant — and its WIDTH
       is the mass fraction it carries, so the flow splitting is visible rather
       than only stated in the readout. */
    if(cyc.branches) for(const b of cyc.branches)
      strokeStates(P,b.pts,hk,b.trap?'rgba(90,200,224,.45)':'rgba(90,200,224,.9)',
                   b.trap?1.4:branchWidth(b.y), b.trap?[4,3]:null);

    /* shadows on the three fixed walls */
    if(st.showShadow){
      shadow(P,cyc.pts,hk,'floor'); shadow(P,cyc.pts,hk,'back'); shadow(P,cyc.pts,hk,'side');
    }
    /* the cycle itself, always drawn on top so it is never occluded.
       The wrap segment is drawn explicitly — the legs are half-open so that
       adjacent ones do not duplicate a sample, which leaves the loop one step
       short of closing. */
    const loop=cyc.pts.concat([cyc.pts[0]]);
    strokeStates(P,loop,hk,'rgba(184,236,76,.30)',7);
    strokeStates(P,loop,hk,'#b8ec4c',2.4);
    cyc.nodes.forEach((n,i)=>{
      const q=P(worldPt(n,hk)); if(!q) return;
      ctx.fillStyle='#070b18'; ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(q.x,q.y,5.2,0,TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#dfffa8'; ctx.font='600 10px -apple-system, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(i+1),q.x,q.y+0.5); ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    });
    if(st.anim) drawParticle(P,hk);
    drawAxisLabels(P,hk,HA);
  }

  function strokePoly(P,pts,col,w,dash){
    ctx.strokeStyle=col; ctx.lineWidth=w; if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); let pen=false;
    /* a null point is an iso-line leaving the plotted box, or a vertex behind
       the eye — either way the pen lifts rather than drawing a chord across */
    for(const p of pts){ const q=p?P(p):null; if(!q){ pen=false; continue; }
      if(pen) ctx.lineTo(q.x,q.y); else { ctx.moveTo(q.x,q.y); pen=true; } }
    ctx.stroke(); if(dash) ctx.setLineDash([]);
  }
  function strokeStates(P,states,hk,col,w,dash){
    strokePoly(P,states.map(s=>worldPt(s,hk)),col,w,dash);
  }
  function shadow(P,pts,hk,wall){
    const proj=s=>{ const p=worldPt(s,hk);
      if(wall==='floor') return [p[0],p[1],WALL.zmin];
      if(wall==='back')  return [p[0],WALL.ymax,p[2]];
      return [WALL.xmin,p[1],p[2]]; };
    const poly=pts.map(proj);
    ctx.beginPath(); let pen=false;
    for(const p of poly){ const q=P(p); if(!q){pen=false;continue;}
      if(pen) ctx.lineTo(q.x,q.y); else { ctx.moveTo(q.x,q.y); pen=true; } }
    ctx.closePath();
    const lit=(wall==='side'&&hk==='T')||(wall==='back'&&hk==='P');
    ctx.fillStyle=lit?'rgba(205,53,196,.20)':'rgba(205,53,196,.09)';
    ctx.fill();
    ctx.strokeStyle=lit?'rgba(226,120,214,.95)':'rgba(205,53,196,.42)';
    ctx.lineWidth=lit?1.9:1.1; ctx.stroke();
  }
  function drawWalls(P,hk,A){
    const c='rgba(120,135,165,.13)', c2='rgba(120,135,165,.30)';
    const box=(pts,fill)=>{ ctx.beginPath(); let pen=false;
      for(const p of pts){ const q=P(p); if(!q){pen=false;continue;}
        if(pen) ctx.lineTo(q.x,q.y); else {ctx.moveTo(q.x,q.y); pen=true;} }
      ctx.closePath(); if(fill){ctx.fillStyle=fill; ctx.fill();}
      ctx.strokeStyle=c2; ctx.lineWidth=1; ctx.stroke(); };
    box([[WALL.xmin,WALL.ymin,WALL.zmin],[WALL.xmax,WALL.ymin,WALL.zmin],
         [WALL.xmax,WALL.ymax,WALL.zmin],[WALL.xmin,WALL.ymax,WALL.zmin]],'rgba(10,14,22,.55)');
    box([[WALL.xmin,WALL.ymax,WALL.zmin],[WALL.xmax,WALL.ymax,WALL.zmin],
         [WALL.xmax,WALL.ymax,WALL.zmax],[WALL.xmin,WALL.ymax,WALL.zmax]],'rgba(10,14,22,.45)');
    box([[WALL.xmin,WALL.ymin,WALL.zmin],[WALL.xmin,WALL.ymax,WALL.zmin],
         [WALL.xmin,WALL.ymax,WALL.zmax],[WALL.xmin,WALL.ymin,WALL.zmax]],'rgba(10,14,22,.45)');
    /* gridlines on the floor and the two shadow walls */
    for(const t of ticks(A.v.lo,A.v.hi,true,5)){ const f=nrm(A.v,t); if(f<0||f>1) continue;
      const x=(f-0.5)*LX;
      strokePoly(P,[[x,WALL.ymin,WALL.zmin],[x,WALL.ymax,WALL.zmin]],c,1);
      strokePoly(P,[[x,WALL.ymax,WALL.zmin],[x,WALL.ymax,WALL.zmax]],c,1); }
    for(const t of ticks(A.s.lo,A.s.hi,false,5)){ const f=nrm(A.s,t); if(f<0||f>1) continue;
      const y=(f-0.5)*LY;
      strokePoly(P,[[WALL.xmin,y,WALL.zmin],[WALL.xmax,y,WALL.zmin]],c,1);
      strokePoly(P,[[WALL.xmin,y,WALL.zmin],[WALL.xmin,y,WALL.zmax]],c,1); }
    for(const t of ticks(A[hk].lo,A[hk].hi,A[hk].log,5)){ const f=nrm(A[hk],t);
      if(f<0||f>1) continue; const z=(f-0.5)*LZ;
      strokePoly(P,[[WALL.xmin,WALL.ymax,z],[WALL.xmax,WALL.ymax,z]],c,1);
      strokePoly(P,[[WALL.xmin,WALL.ymin,z],[WALL.xmin,WALL.ymax,z]],c,1); }
  }
  function drawAxisLabels(P,hk,HA){
    ctx.font='italic 12.5px Georgia, serif';
    const lab=(p,txt,col)=>{ const q=P(p); if(!q) return;
      ctx.fillStyle=col; ctx.fillText(txt,q.x,q.y); };
    lab([0,WALL.ymin-0.12,WALL.zmin-0.10],'v  (m³/kg, log)','rgba(180,190,210,.8)');
    lab([WALL.xmin-0.30,0,WALL.zmin-0.10],'s  (kJ/kg·K)','rgba(180,190,210,.8)');
    lab([WALL.xmin-0.24,WALL.ymax+0.06,WALL.zmax*0.75],
        HA.name+'  ('+HA.unit+(HA.log?', log':'')+')','rgba(180,190,210,.8)');
    ctx.font='11px -apple-system, sans-serif';
    if(hk==='T') lab([WALL.xmin-0.02,WALL.ymin+0.30,WALL.zmax+0.10],'← T–s shadow','rgba(226,120,214,.9)');
    if(hk==='P') lab([WALL.xmax*0.10,WALL.ymax+0.04,WALL.zmax+0.10],'P–v shadow','rgba(226,120,214,.9)');
  }
  function drawParticle(P,hk){
    const n=cyc.pts.length, i=Math.floor(tAnim*n)%n, s=cyc.pts[i];
    const q=P(worldPt(s,hk)); if(!q) return;
    const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,11);
    g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(0.35,'rgba(184,236,76,.7)');
    g.addColorStop(1,'rgba(184,236,76,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,11,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(q.x,q.y,2.6,0,TAU); ctx.fill();
  }

  /* ---------------- 2-D ---------------- */
  function draw2D(){
    const fl=fluidOf(st.cycle), water=(fl==='water');
    const W=cam.W,H=cam.H, V=viewOf(st.view,fl), M=makeMap(V,W,H);
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    /* grid */
    ctx.font='11px "SF Mono", Menlo, monospace';
    for(const t of ticks(V.xlo,V.xhi,V.xlog,6)){ const x=M.fx(t);
      ctx.strokeStyle='rgba(120,135,165,.13)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,M.Tp); ctx.lineTo(x,H-M.Bt); ctx.stroke();
      ctx.fillStyle='#7d859a'; ctx.textAlign='center';
      ctx.fillText(tickLabel(t,V.xlog),x,H-M.Bt+15); }
    for(const t of ticks(V.ylo,V.yhi,V.ylog,6)){ const y=M.fy(t);
      ctx.strokeStyle='rgba(120,135,165,.13)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(M.L,y); ctx.lineTo(W-M.R,y); ctx.stroke();
      ctx.fillStyle='#7d859a'; ctx.textAlign='right';
      ctx.fillText(tickLabel(t,V.ylog),M.L-7,y+4); }
    ctx.textAlign='left';
    /* Everything from here to the matching restore() is DATA, and is clipped to
       the axes frame.  An isotherm carries on to pressures below the axis floor
       (the 300 K one reaches 0.6 kPa against a 2 kPa axis), so unclipped it
       draws straight through the tick labels. */
    ctx.save();
    ctx.beginPath(); ctx.rect(M.L,M.Tp,W-M.L-M.R,H-M.Bt-M.Tp); ctx.clip();
    /* the dome */
    const line=(arr,col,w,dash)=>{ ctx.strokeStyle=col; ctx.lineWidth=w;
      if(dash) ctx.setLineDash(dash); ctx.beginPath();
      arr.forEach((s,i)=>{ const p=M.pt(s); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
      ctx.stroke(); if(dash) ctx.setLineDash([]); };
    /* fill the two-phase region faintly */
    if(water){ ctx.beginPath();
      dome.f.forEach((s,i)=>{const p=M.pt(s); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});
      for(let i=dome.g.length-1;i>=0;i--){const p=M.pt(dome.g[i]); ctx.lineTo(p[0],p[1]);}
      ctx.closePath(); ctx.fillStyle='rgba(201,145,63,.09)'; ctx.fill(); }
    /* constant-quality lines */
    if(st.showDome&&water) for(let k=1;k<=9;k++){
      const arr=[]; const x=k/10;
      for(let i=0;i<dome.f.length;i++){
        const T=dome.f[i].T; if(T>T_R1MAX) break; arr.push(wet(T,x)); }
      line(arr,'rgba(201,145,63,.22)',1);
      if(k===5&&st.view!=='pv'){ const p=M.pt(arr[Math.floor(arr.length*0.55)]);
        ctx.fillStyle='rgba(201,145,63,.55)'; ctx.font='italic 10px Georgia,serif';
        ctx.fillText('x = 0.5',p[0]+3,p[1]); ctx.font='11px "SF Mono", Menlo, monospace'; } }
    /* isobars (on T-s and h-s) or isotherms (on P-v) */
    if(st.showMesh) (water?drawIsoLines:drawIsoLinesAir)(M,V,line);
    if(water){
      line(dome.f.filter(s=>s.exact),'rgba(120,200,255,.85)',1.9);
      line(dome.g.filter(s=>s.exact),'rgba(255,190,120,.85)',1.9);
      line(dome.f.filter(s=>!s.exact),'rgba(120,200,255,.5)',1.4,[4,4]);
      line(dome.g.filter(s=>!s.exact),'rgba(255,190,120,.5)',1.4,[4,4]);
    }
    /* the regenerated stretches, under the loop so the loop still reads first */
    if(cyc.regSegs) for(const g of cyc.regSegs) line(regSegStates(g),'rgba(90,200,224,.95)',5.5);
    if(cyc.branches) for(const b of cyc.branches)
      line(b.pts, b.trap?'rgba(90,200,224,.45)':'rgba(90,200,224,.9)',
           b.trap?1.6:branchWidth(b.y)+1, b.trap?[4,3]:null);
    /* the loop, filled */
    ctx.beginPath();
    cyc.pts.forEach((s,i)=>{ const p=M.pt(s); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
    ctx.closePath();
    /* The fill says "this area is the work".  On a regenerative plant it is not,
       so it is dimmed to nearly nothing rather than shown at full strength and
       explained away in a caption nobody reads. */
    const showArea=((st.view==='pv')||(st.view==='ts'))&&cyc.massLoop!==false;
    ctx.fillStyle=showArea?'rgba(184,236,76,.13)':'rgba(184,236,76,.04)'; ctx.fill();
    ctx.strokeStyle='rgba(184,236,76,.28)'; ctx.lineWidth=6.5; ctx.stroke();
    ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=2.1; ctx.stroke();
    /* Carnot rectangle for comparison, on T-s.  For steam it spans the dome at
       T_h, which is the width a steam Carnot cycle would actually have.  For a
       gas cycle there is no dome to set the width, so it spans the loop's own
       entropy range: the largest area any loop could enclose while staying
       inside this cycle's own temperature band and entropy width. */
    if(st.view==='ts'&&st.cycle!=='carnot'){
      let sA,sB;
      if(water){ const S=sat(Math.min(cyc.Th,T_R1MAX)); sA=S.sf; sB=S.sg; }
      else { sA=Infinity; sB=-Infinity;
        for(const q of cyc.pts){ if(q.s<sA) sA=q.s; if(q.s>sB) sB=q.s; } }
      const box=[{s:sA,T:cyc.Th},{s:sB,T:cyc.Th},{s:sB,T:cyc.Tc},{s:sA,T:cyc.Tc},{s:sA,T:cyc.Th}];
      line(box,'rgba(205,53,196,.5)',1.4,[6,4]);
      const p=M.pt({s:sB,T:cyc.Th}); ctx.fillStyle='rgba(226,120,214,.75)';
      ctx.font='italic 11px Georgia,serif'; ctx.fillText('Carnot bound',p[0]+6,p[1]-4); }
    /* nodes */
    cyc.nodes.forEach((n,i)=>{ const p=M.pt(n);
      ctx.fillStyle='#070b18'; ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(p[0],p[1],6.4,0,TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#dfffa8'; ctx.font='600 10.5px -apple-system, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(i+1),p[0],p[1]+0.5);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic'; });
    if(st.anim){ const n=cyc.pts.length, s=cyc.pts[Math.floor(tAnim*n)%n], p=M.pt(s);
      const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],12);
      g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(0.35,'rgba(184,236,76,.7)');
      g.addColorStop(1,'rgba(184,236,76,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],12,0,TAU); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p[0],p[1],2.8,0,TAU); ctx.fill(); }
    ctx.restore();
    /* frame + labels — outside the clip */
    ctx.strokeStyle='rgba(120,135,165,.35)'; ctx.lineWidth=1;
    ctx.strokeRect(M.L,M.Tp,W-M.L-M.R,H-M.Bt-M.Tp);
    ctx.fillStyle='#9aa2b4'; ctx.font='12px -apple-system, sans-serif'; ctx.textAlign='center';
    ctx.fillText(V.xlab,(M.L+W-M.R)/2,H-10);
    ctx.save(); ctx.translate(14,(M.Tp+H-M.Bt)/2); ctx.rotate(-Math.PI/2);
    ctx.fillText(V.ylab,0,0); ctx.restore(); ctx.textAlign='left';
    const A=st.view==='pv'?areas.pv:st.view==='ts'?areas.ts:null;
    if(A!==null){ ctx.fillStyle='rgba(184,236,76,.9)'; ctx.font='italic 13px Georgia, serif';
      ctx.fillText(V.sub+' = '+A.toFixed(2)+' kJ/kg',M.L+10,M.Tp+18);
      /* on a regenerative plant that number is emphatically NOT the work, and
         this is the most prominent place it could be misread */
      if(cyc.massLoop===false){
        ctx.fillStyle='rgba(226,120,214,.95)'; ctx.font='12px -apple-system, sans-serif';
        ctx.fillText('…but w'+'ₙ'+'ₑ'+'ₜ'+' = '+cyc.wnet.toFixed(2)
          +' kJ/kg: steam is bled off, so only '+(100*cyc.yCond).toFixed(1)
          +'% of the mass goes round the low-pressure end',M.L+10,M.Tp+36); } }
  }
  function drawIsoLines(M,V,line){
    if(st.view==='pv'){
      for(const T of [300,400,450,500,550,600,647.096,700,800,900]){
        const arr=[];
        for(let i=0;i<=90;i++){
          const v=unnrm(AX.v,i/90);
          arr.push(isothermPoint(T,v));
        }
        line(arr.filter(Boolean),'rgba(120,200,255,.24)',1);
      }
    } else {
      for(const p of [0.005,0.05,0.5,5,20,60]){
        const arr=[]; const Ts=p<PC_W?tsat(p):0;
        for(let i=0;i<=70;i++){
          const T=lerp(274,1000,i/70);
          if(p<PC_W&&Math.abs(T-Ts)<0.5) continue;
          if(T<Ts){ if(T<=T_R1MAX) arr.push(liq(p,T)); }
          else if(T<=1000&&p<=vaporPmax(T)) arr.push(vap(p,T));
        }
        if(p<PC_W){ const S=sat(Ts); const seg=[];
          for(let k=0;k<=20;k++) seg.push(wet(Ts,k/20));
          line(seg,'rgba(255,190,120,.24)',1); }
        line(arr,'rgba(255,190,120,.24)',1);
      }
    }
  }
  /* air's grid.  On T–s the isochores are drawn as well as the isobars, because
     the gap between the two families is the whole difference between an Otto
     cycle and a Diesel: an isochore climbs faster (dT/ds = T/c_v against
     T/c_p), so heat added at constant volume is added at a higher average
     temperature, and that is why the Otto wins at equal compression ratio. */
  function drawIsoLinesAir(M,V,line){
    const A=AXES.air;
    if(st.view==='pv'){
      for(const T of [250,400,600,900,1300,1800,2250]){
        const arr=[];
        for(let i=0;i<=70;i++) arr.push(gasTV(T,unnrm(A.v,i/70)));
        line(arr,'rgba(120,200,255,.24)',1);
      }
    } else {
      for(const p of [0.03,0.1,0.3,1,3,10,30]){
        const arr=[];
        for(let i=0;i<=70;i++) arr.push(gas(p,lerp(T_AIR_MIN,T_AIR_MAX,i/70)));
        line(arr,'rgba(255,190,120,.24)',1);
      }
      if(st.view==='ts') for(const v of [0.03,0.1,0.3,1,3,10]){
        const arr=[];
        for(let i=0;i<=70;i++) arr.push(gasTV(lerp(T_AIR_MIN,T_AIR_MAX,i/70),v));
        line(arr,'rgba(140,214,178,.22)',1);
      }
    }
  }
  function isothermPoint(T,v){
    /* above T_c there is no phase boundary at all: the isotherm is one smooth
       region-2 curve, drawn down to the B23 boundary where region 3 begins. */
    if(T>=TC_W){ const p=pressureFromVapV(T,v); return p?vap(p,T):null; }
    const S=sat(T);
    if(v<S.vf){ if(T>T_R1MAX) return null;
      const p=pressureFromLiqV(T,v); return p?liq(p,T):null; }
    if(v<=S.vg) return wet(T,(v-S.vf)/(S.vg-S.vf));
    const p=pressureFromVapV(T,v); return p?vap(p,T):null;
  }
  function pressureFromLiqV(T,v){
    let lo=psat(T), hi=100;
    if(region1(hi,T).v>v) return null;
    for(let i=0;i<50;i++){ const m=0.5*(lo+hi); if(region1(m,T).v>v) lo=m; else hi=m; }
    return 0.5*(lo+hi);
  }
  function pressureFromVapV(T,v){
    let lo=AX.P.lo*1.2, hi=Math.min(vaporPmax(T),100);
    if(region2(lo,T).v<v) return null;
    if(region2(hi,T).v>v) return null;
    for(let i=0;i<50;i++){ const m=0.5*(lo+hi); if(region2(m,T).v>v) hi=m; else lo=m; }
    return 0.5*(lo+hi);
  }

  function draw(){ if(st.view==='surface') draw3D(); else draw2D(); }

  function step(dt){
    if(st.spin&&st.view==='surface') cam.theta+=dt*0.24;
    if(st.anim) tAnim=(tAnim+dt*0.055*st.speed)%1;
  }
  function pointer(type,e){
    if(st.view!=='surface') return;
    if(type==='move'){ cam.theta-=e.dx*0.008; cam.phi=clamp(cam.phi+e.dy*0.008,-1.42,1.42); }
  }
  function wheel(dy){ if(st.view==='surface') cam.dist=clamp(cam.dist*Math.exp(dy*0.0011),2.4,13); }
  function resetView(){ cam.theta=-2.28; cam.phi=0.38; cam.dist=4.65; }

  rebuildAll();
  return { st, cam, draw, step, pointer, wheel, resetView, rebuildAll, rebuildCycle, rebuildMesh,
           cycle:()=>cyc, areas:()=>areas, tag:()=>tagHTML(st,cyc),
           readout:()=>readoutHTML(st,cyc,areas), eqbar:()=>eqbarHTML(cyc,areas) };
}

function tagHTML(st,cyc){
  const fl=fluidOf(st.cycle);
  if(st.view==='surface')
    return 'the surface <b>'+axOf(fl)[st.height].name+'(v, s)</b> of '
      +(fl==='air'?'<b>air</b>':'<b>water</b>')+' — '
      +(st.height==='u'?'Gibbs’ fundamental relation; its slopes are T and −P'
        :st.height==='T'?'its shadow on the left wall is the T–s diagram'
        :'its shadow on the back wall is the P–v diagram');
  return VIEWS[st.view].title+' — '+VIEWS[st.view].sub;
}

/* ================================================================== *
 *  UI                                                                 *

function boot(){

  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  /* ---- tabs ---- */
  const TABS=[['surface','surface'],['pv','P–v'],['ts','T–s'],['hs','Mollier']];
  TABS.forEach(([k,label])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      syncPanel(); refresh(); }},label));
  });

  /* ---- controls ---- */
  const rows={};
  /* `logp` sliders carry log10(p) in the input and the pressure itself in the
     state.  That conversion has to live in the ONE listener, because two of them
     — a generic one that writes the raw slider number, and a second that fixes
     it up afterwards — both fire on every drag, and the first rebuilds the whole
     cycle from a NEGATIVE pressure before the second corrects it.  On water the
     resulting NaNs are swallowed and the next repaint hides them; on air the
     property solvers throw, which is how a latent bug in the original pressure
     sliders came to light. */
  function slider(key,label,lo,hi,step,fmt,onchange,logp){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,
                         value:logp?Math.log10(st[key]):st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,label),inp,val);
    const sync=()=>{ inp.value=logp?Math.log10(st[key]):st[key];
                     val.textContent=fmt(st[key]); };
    inp.addEventListener('input',()=>{
      const raw=parseFloat(inp.value);
      st[key]=logp?Math.pow(10,raw):raw;
      if(onchange) onchange(); val.textContent=fmt(st[key]); S.rebuildCycle(); refresh(); });
    rows[key]={row,sync}; return row;
  }
  function chipRow(items,get,set){
    const wrap=h('div',{class:'chips'});
    const btns=items.map(([k,lab])=>{
      const b=h('button',{class:'chip',onclick:()=>{ set(k); btns.forEach((bb,i)=>
        bb.className='chip'+(items[i][0]===get()?' on':'')); }},lab);
      wrap.appendChild(b); return b; });
    const sync=()=>btns.forEach((bb,i)=>bb.className='chip'+(items[i][0]===get()?' on':''));
    sync(); return {wrap,sync};
  }
  function checkbox(key,label,onchange){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchange) onchange(); refresh(); });
    return h('label',null,inp,label);
  }

  const gCycle=h('div',{class:'grp'},h('h3',null,'cycle'));
  /* picking a cycle also loads its normal operating point.  A compression ratio
     of 8 is a petrol engine and a hopeless Diesel; carrying one cycle's numbers
     into the next shows nothing but a bad version of the next one. */
  function pickCycle(k){
    st.cycle=k;
    if(PRESETS[k]) Object.assign(st,PRESETS[k]);
    if(k==='ericsson'||k==='stirling') st.mRegen=true;
    S.rebuildAll(); syncPanel(); refresh();
  }
  const cycleChips=chipRow([['carnot','Carnot'],['rankine','Rankine'],
                            ['otto','Otto'],['diesel','Diesel'],['dual','dual'],
                            ['brayton','Brayton'],['ericsson','Ericsson'],
                            ['stirling','Stirling']],
    ()=>st.cycle, pickCycle);
  gCycle.appendChild(cycleChips.wrap);
  const cycTag=h('div',{class:'tag'}); gCycle.appendChild(cycTag);

  /* ---- the modules: plant you bolt on, not cycles of their own ---- */
  const gMod=h('div',{class:'grp'},h('h3',null,'modules'));
  const modChecks={}, modWrap=h('div',{class:'checks'});
  MOD_ORDER.forEach(m=>{
    const M=MODULES[m], inp=h('input',{type:'checkbox'});
    inp.checked=!!st[M.key];
    inp.addEventListener('change',()=>{
      st[M.key]=inp.checked;
      /* reheating a wet turbine inlet is not a plant anyone builds, and Moran's
         reheat cycle superheats first — so on the steam side reheat brings
         superheat with it rather than quietly meaning something else. */
      if(m==='reheat'&&inp.checked&&st.cycle==='rankine') st.mSuper=true;
      S.rebuildCycle(); syncPanel(); refresh(); });
    modChecks[m]={inp, lab:h('label',null,inp,M.label)};
    modWrap.appendChild(modChecks[m].lab);
  });
  gMod.appendChild(modWrap);
  gMod.appendChild(slider('etaReg','regen. ε',0,1,0.01,v=>(100*v).toFixed(0)+'%',null));
  gMod.appendChild(slider('nStage','stages',2,6,1,v=>v.toFixed(0)+' ×',null));
  gMod.appendChild(slider('fic','intercool P',0.15,0.85,0.01,
    v=>fmtP(st.p1*Math.pow(st.rPres,v)),null));
  gMod.appendChild(slider('frh','reheat P',0.15,0.85,0.01,
    v=>fmtP(st.p1*Math.pow(st.rPres,v)),null));
  /* feedwater-heating parameters */
  gMod.appendChild(slider('pOfw','open FWH P',-2.2,1.0,0.01,fmtP,null,true));
  gMod.appendChild(slider('nClosed','closed FWHs',1,3,1,v=>v.toFixed(0)+' ×',null));
  gMod.appendChild(slider('fTop','top bleed P',0.35,0.93,0.005,
    v=>fmtP(st.pc*Math.pow(st.pb/st.pc,v)),null));
  gMod.appendChild(slider('ttd','heater ΔT',0,25,0.1,v=>v.toFixed(1)+' K',null));
  const modTag=h('div',{class:'tag'}); gMod.appendChild(modTag);

  /* ---- the textbook cases, loadable in one click ----
     Each sets every parameter to a worked example or figure in Moran, so the
     readout can be checked against the book by eye.  Same numbers selfTest
     asserts on, which is the point of having them here. */
  const gBook=h('div',{class:'grp'},h('h3',null,'textbook cases'));
  const BOOKCASES={
    'Ex 8.5':  {note:'one open feedwater heater, 85 % turbine — η 36.9 %',
      st:{cycle:'rankine',pb:8,pc:0.008,Tsup:753.15,etaT:0.85,etaP:1,
          mSuper:true,mReheat:false,mOpenFW:true,mClosedFW:false,pOfw:0.7}},
    'Fig 8.11':{note:'one closed feedwater heater, drain trapped to the condenser',
      st:{cycle:'rankine',pb:8,pc:0.008,Tsup:753.15,etaT:1,etaP:1,
          mSuper:true,mReheat:false,mOpenFW:false,mClosedFW:true,nClosed:1,fTop:0.8,ttd:7}},
    'Fig E8.6':{note:'reheat + closed @2 MPa + open @0.3 MPa — η 43.1 %',
      st:{cycle:'rankine',pb:8,pc:0.008,Tsup:753.15,pr:0.7,Trh:713.15,etaT:1,etaP:1,
          mSuper:true,mReheat:true,mOpenFW:true,mClosedFW:true,
          pOfw:0.3,nClosed:1,fTop:E86_FTOP,ttd:E86_TTD}},
    'Fig 8.12':{note:'the full plant: three closed heaters and a deaerating open one',
      st:{cycle:'rankine',pb:8,pc:0.008,Tsup:753.15,pr:0.7,Trh:713.15,etaT:1,etaP:1,
          mSuper:true,mReheat:true,mOpenFW:true,mClosedFW:true,
          pOfw:0.3,nClosed:3,fTop:E86_FTOP,ttd:7}},
  };
  /* buttons, not chips: they LOAD a configuration rather than name a mode, so
     nothing here should stay lit once a slider has moved off the book's value */
  const bookWrap=h('div',{class:'chips'});
  const bookTag=h('div',{class:'tag'});
  Object.keys(BOOKCASES).forEach(k=>{
    bookWrap.appendChild(h('button',{class:'chip sm',onclick:()=>{
      Object.assign(st,BOOKCASES[k].st);
      bookTag.innerHTML='<b>'+k+'</b> &mdash; '+BOOKCASES[k].note;
      S.rebuildAll(); syncPanel(); refresh(); }},k));
  });
  gBook.appendChild(bookWrap); gBook.appendChild(bookTag);

  /* ---- the air-standard engine parameters ---- */
  const gGas=h('div',{class:'grp'},h('h3',null,'engine'));
  gGas.appendChild(slider('p1','intake P',-1.3,-0.7,0.01,fmtP,null,true));
  gGas.appendChild(slider('T1','intake T',280,340,1,v=>fmtC(v),null));
  gGas.appendChild(slider('rComp','compression r',4,24,0.1,v=>v.toFixed(1)+':1',null));
  gGas.appendChild(slider('rCut','cutoff r_c',1,3.5,0.01,v=>v.toFixed(2),null));
  gGas.appendChild(slider('rPk','pressure r_p',1,2.2,0.01,v=>v.toFixed(2),null));
  gGas.appendChild(slider('Tmax','peak T',900,2250,5,v=>fmtC(v),null));
  gGas.appendChild(slider('rPres','pressure ratio',2,30,0.1,v=>v.toFixed(1)+':1',null));
  gGas.appendChild(slider('Ttit','turbine inlet T',800,1800,5,v=>fmtC(v),null));
  gGas.appendChild(slider('rVol','volume ratio',1.5,20,0.1,v=>v.toFixed(1)+':1',null));
  gGas.appendChild(slider('gTh','T hot',400,2200,5,v=>fmtC(v),()=>{
    if(st.gTh<st.gTc+40) st.gTc=st.gTh-40; }));
  gGas.appendChild(slider('gTc','T cold',250,900,5,v=>fmtC(v),()=>{
    if(st.gTc>st.gTh-40) st.gTh=st.gTc+40; }));
  const gasTag=h('div',{class:'tag'}); gGas.appendChild(gasTag);

  const gCarnot=h('div',{class:'grp'},h('h3',null,'reservoirs'));

  gCarnot.appendChild(slider('Tc','T cold',274,600,1,v=>fmtC(v),()=>{

  const carnotTag=h('div',{class:'tag'}); gCarnot.appendChild(carnotTag);

  const gRank=h('div',{class:'grp'},h('h3',null,'plant'));
  gRank.appendChild(slider('pb','boiler P',-1.1,1.34,0.01,fmtP,null,true));
  gRank.appendChild(slider('pc','condenser P',-2.5,-0.7,0.01,fmtP,null,true));
  gRank.appendChild(slider('pr','reheat P',-2.2,1.0,0.01,fmtP,null,true));
  gRank.appendChild(slider('Tsup','superheat T',600,1070,1,v=>fmtC(v),null));
  gRank.appendChild(slider('Trh','reheat T',600,1070,1,v=>fmtC(v),null));
  const rankTag=h('div',{class:'tag'}); gRank.appendChild(rankTag);

  /* one pair of machine efficiencies, read by whichever plant is running: the

  const gIrr=h('div',{class:'grp'},h('h3',null,'machines'));
  gIrr.appendChild(slider('etaT','turbine η',0.6,1,0.005,v=>(100*v).toFixed(1)+'%',null));
  gIrr.appendChild(slider('etaP','pump η',0.5,1,0.005,v=>(100*v).toFixed(1)+'%',null));
  const irrTag=h('div',{class:'tag'}); gIrr.appendChild(irrTag);
  const etaPlabel=rows.etaP.row.querySelector('label');

  const gSurf=h('div',{class:'grp'},h('h3',null,'surface height'));
  const heightChips=chipRow([['T','T(v,s)'],['P','P(v,s)'],['u','u(v,s)']],
    ()=>st.height, k=>{ st.height=k; S.rebuildMesh(); refresh(); });
  gSurf.appendChild(heightChips.wrap);
  const heightTag=h('div',{class:'tag'}); gSurf.appendChild(heightTag);
  gSurf.appendChild(slider('dens','mesh',0.6,1.6,0.1,v=>v.toFixed(1)+'×',null));
  rows.dens.row.querySelector('input').addEventListener('input',()=>S.rebuildMesh());

  const gShow=h('div',{class:'grp'},h('h3',null,'show'));
  const cbDome=checkbox('showDome','saturation dome'),
        cbR3  =checkbox('showR3','region 3 (not modelled)');
  const checks=h('div',{class:'checks'},
    checkbox('showShadow','wall shadows (the two diagrams)'),

    checkbox('showMesh','iso-lines'),

    cbR3,
    checkbox('anim','animate the working fluid'),
    checkbox('spin','auto-orbit'));
  gShow.appendChild(checks);
  gShow.appendChild(slider('speed','speed',0.2,4,0.1,v=>v.toFixed(1)+'×',null));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.resetView(); refresh(); }},'reset view'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuildAll(); S.resetView();
                              syncPanel(); refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  panel.appendChild(gCycle); panel.appendChild(gMod); panel.appendChild(gBook);
  panel.appendChild(gCarnot);
  panel.appendChild(gRank); panel.appendChild(gGas);
  panel.appendChild(gIrr); panel.appendChild(gSurf); panel.appendChild(gShow); panel.appendChild(gInfo);
  const infoEl=gInfo.querySelector('#info');

  const SYNCED=['Th','Tc','Tsup','etaT','etaP','dens','speed','T1','rComp','rCut','rPk',
                'Tmax','rPres','Ttit','rVol','gTh','gTc','etaReg','nStage','fic','frh',
                'pb','pc','pr','p1','pOfw','nClosed','fTop','ttd','Trh'];
  function syncPanel(){
    const c=st.cycle, air=fluidOf(c)==='air', is3D=st.view==='surface';
    gCarnot.hidden=(c!=='carnot');
    gRank.hidden=(c!=='rankine');
    gGas.hidden=!air;
    gIrr.hidden=!(c==='rankine'||c==='brayton');
    gSurf.hidden=!is3D;
    etaPlabel.textContent=(c==='brayton')?'compressor η':'pump η';
    /* a module is offered only where it means something.  Hiding rather than
       greying: an intercooler on an Otto cycle is not a setting you got wrong,
       it is not a thing. */
    let anyMod=false;
    MOD_ORDER.forEach(m=>{ const ap=modApplies(c,m); anyMod=anyMod||ap;
      modChecks[m].lab.hidden=!ap; modChecks[m].inp.checked=!!st[MODULES[m].key]; });
    gMod.hidden=!anyMod;
    rows.etaReg.row.hidden=!modOn(st,'regen');
    const multi=(c==='brayton')&&(modOn(st,'intercool')||modOn(st,'reheat'));
    rows.nStage.row.hidden=!multi;
    rows.fic.row.hidden=!(modOn(st,'intercool')&&st.nStage===2);
    rows.frh.row.hidden=!(c==='brayton'&&modOn(st,'reheat')&&st.nStage===2);
    rows.pr.row.hidden=!(c==='rankine'&&st.mReheat);
    rows.Trh.row.hidden=!(c==='rankine'&&st.mReheat);
    rows.Tsup.row.hidden=!(c==='rankine'&&(st.mSuper||st.mReheat||st.mOpenFW||st.mClosedFW));
    rows.pOfw.row.hidden=!modOn(st,'openfw');
    rows.nClosed.row.hidden=!modOn(st,'closedfw');
    rows.fTop.row.hidden=!modOn(st,'closedfw');
    rows.ttd.row.hidden=!modOn(st,'closedfw');
    gBook.hidden=(c!=='rankine');
    rows.p1.row.hidden=false;
    rows.T1.row.hidden=(c==='ericsson'||c==='stirling');
    rows.rComp.row.hidden=!(c==='otto'||c==='diesel'||c==='dual');
    rows.rCut.row.hidden=!(c==='diesel'||c==='dual');
    rows.rPk.row.hidden=(c!=='dual');
    rows.Tmax.row.hidden=(c!=='otto');
    rows.rPres.row.hidden=!(c==='brayton'||c==='ericsson');
    rows.Ttit.row.hidden=(c!=='brayton');
    rows.rVol.row.hidden=(c!=='stirling');
    rows.gTh.row.hidden=rows.gTc.row.hidden=!(c==='ericsson'||c==='stirling');
    rows.speed.row.hidden=!st.anim;
    cbDome.hidden=cbR3.hidden=air;      /* air has neither a dome nor a region 3 */
    for(const k in rows) if(rows[k].sync&&SYNCED.indexOf(k)>=0) rows[k].sync();
    cycleChips.sync(); heightChips.sync();
    [].forEach.call(checks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showShadow','showDome','showMesh','showWalls','showR3','anim','spin'][i]]; });
  }

  function refresh(){
    try{
      const cyc=S.cycle(), areas=S.areas(), air=cyc.fl==='air';
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = st.view==='surface'
        ? 'drag to orbit · scroll to zoom · the shadows sit on fixed walls, so they hold still while you move'
        : 'the loop area is the net work · switch tabs to see the same loop from another side';
      subEl.innerHTML = st.view==='surface'
        ? (air?'air':'water')+'’s state surface &mdash; the P&ndash;v and T&ndash;s diagrams are its shadows'
        : VIEWS[st.view].title+' &mdash; '+VIEWS[st.view].sub;
      cycTag.innerHTML=cycleTagHTML(cyc);
      /* the stage-pressure sliders read out an absolute pressure derived from
         p1 and the pressure ratio, so they go stale when either of those moves */
      rows.fic.sync(); rows.frh.sync();
      if(!gCarnot.hidden)
        carnotTag.innerHTML='boiling at <b>'+fmtP(sat(st.Th).p)+'</b>, condensing at <b>'
          +fmtP(sat(st.Tc).p)+'</b><br>&Delta;s = <b>'+(sat(st.Th).sg-sat(st.Th).sf).toFixed(3)
          +'</b> kJ/kg&middot;K wide';
      if(!gRank.hidden)
        rankTag.innerHTML='boiler saturates at <b>'+fmtC(tsat(st.pb))+'</b>, condenser at <b>'
          +fmtC(tsat(st.pc))+'</b>';
      if(!gGas.hidden) gasTag.innerHTML=gasTagHTML(cyc);
      if(!gMod.hidden) modTag.innerHTML=modTagHTML(cyc);
      irrTag.innerHTML=(st.etaT<1||st.etaP<1)
        ? 'irreversible &mdash; and the two shadow areas are <span class="g">still equal</span>, '
          +'because only the loop closing is needed'
        : 'both machines ideal &mdash; the loop is internally reversible, so '
          +'<span class="g">area = w<sub>net</sub> = q<sub>net</sub></span>';
      heightTag.innerHTML=HEIGHT_NOTE[st.height];
      infoEl.innerHTML=(air?INFO_AIR:INFO)[st.view]||INFO.surface;
      S.draw();
    }catch(e){ fail(e); }
  }
  function cycleTagHTML(cyc){
    switch(cyc.kind){
      case 'carnot':
        return 'four legs, all inside the dome. In T&ndash;s an exact rectangle, so '
          +'<span class="g">&eta; = 1 &minus; T<sub>c</sub>/T<sub>h</sub></span> exactly.';
      case 'otto': case 'diesel': case 'dual':
        return 'closed system, fixed mass of air. Net work <b>'+cyc.wnet.toFixed(0)
          +'</b> kJ/kg over a displacement of <b>'+fmtV(cyc.vDisp)+'</b> m³/kg, so '
          +'<span class="g">mep = '+fmtMep(mepOf(cyc))+'</span>.';
      case 'brayton':
        return 'w<sub>turbine</sub> = <b>'+cyc.wt.toFixed(0)+'</b>, w<sub>compressor</sub> = <b>'
          +cyc.wc.toFixed(0)+'</b> kJ/kg &mdash; the compressor eats <span class="r">'
          +(100*cyc.bwr).toFixed(0)+'%</span> of what the turbine makes'
          +(cyc.dead?', which is <span class="r">more than all of it</span>.':'.');
      case 'ericsson': case 'stirling':
        return 'the regenerator carries <b>'+cyc.qRegen.toFixed(0)+'</b> kJ/kg between the two '
          +'legs that are not isothermal &mdash; every joule it fails to carry has to be bought.';
    }
    return 'w<sub>turbine</sub> = <b>'+cyc.wt.toFixed(1)+'</b>, w<sub>pump</sub> = <b>'
      +cyc.wp.toFixed(2)+'</b> kJ/kg &mdash; the pump costs '
      +(100*cyc.wp/cyc.wt).toFixed(1)+'% of what the turbine makes.';
  }
  function gasTagHTML(cyc){
    const peak='peak <b>'+fmtT(cyc.Th)+'</b>, lowest <b>'+fmtT(cyc.Tc)+'</b>';
    if(cyc.kind==='diesel') return peak+'<br>cutoff pinned to keep T<sub>3</sub> inside the '
      +'200&ndash;2250 K table';
    if(cyc.kind==='dual')   return peak+'<br>r<sub>p</sub>=1 gives a Diesel, r<sub>c</sub>=1 an Otto';
    return peak;
  }
  function modTagHTML(cyc){
    if(cyc.kind==='brayton'&&modOn(st,'regen')&&cyc.qRegen<=1e-6)
      return '<span class="r">the exhaust is colder than the compressor discharge</span> at this '
        +'pressure ratio &mdash; there is nothing for a regenerator to move.';
    if(cyc.kind==='brayton'&&modOn(st,'intercool')&&modOn(st,'reheat')&&modOn(st,'regen'))
      return 'all three, '+st.nStage+' stages each &mdash; push the stage count up and the loop '
        +'walks towards <span class="g">two isotherms and two isobars</span>: the Ericsson cycle.';
    if(cyc.regen&&cyc.qRegen>0)
      return 'the <span style="color:#5ac8e0">cyan</span> stretches are heat moved internally: '
        +'<b>'+cyc.qRegen.toFixed(0)+'</b> kJ/kg the furnace never has to supply.';
    return 'each module is a piece of plant, not a different cycle &mdash; they compose.';
  }

  /* ---- pointer, wheel, keys ---- */
  /* Moving the camera is not the same as repainting it.  The frame loop only
     redraws while something is animating, so with BOTH "animate" and
     "auto-orbit" off a drag would move the camera and never show it.  Masked
     here because anim defaults on; fixed properly rather than left latent. */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); refresh(); }
    else if(e.key>='1'&&e.key<='4'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); refresh(); });

  let last=0;
  function frame(t){
    const dt=last?Math.min((t-last)/1000,0.05):0; last=t;
    S.step(dt);
    if(st.anim||st.spin||dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frame);
  }
  resize(); syncPanel(); refresh(); requestAnimationFrame(frame);
}

const HEIGHT_NOTE={

    +'made of <b>level rulings</b> — that flat shelf is why a Carnot cycle is easy here. '
    +'Air has no dome and no shelf: its surface is one smooth sheet.',
  P:'height is pressure. The dome roof is level again (same reason), and the back-wall '
    +'shadow is the <b>P–v diagram</b>.',
  u:'height is internal energy — <b>Gibbs’ fundamental surface</b>, the one Maxwell '
    +'cast in plaster in 1874. Its tangent plane has slopes T and −P, so the other two '
    +'surfaces are this one differentiated. For an ideal gas u depends on T alone, so this '
    +'surface and the T one have the same contours.'};
const INFO={
  surface:'Every equilibrium state of water is one point on this surface: two properties fix '
    +'a simple substance, so the state space is 2-D. The floor is (<b>v</b>, <b>s</b>); the '
    +'height is whichever property you pick. The cycle is a closed loop drawn on it, and the '
    +'two classic diagrams are that loop’s <b>shadows</b> on two walls. They enclose equal '

  pv:'The loop’s shadow on the (v, P) wall. Its area is <b>∮P dv</b> — the net work '
    +'of a closed-system engine running this loop. Inside the dome the isotherms lie flat, '
    +'because boiling holds pressure and temperature together.',
  ts:'The loop’s shadow on the (s, T) wall. Its area is <b>∮T ds</b> — the net heat. '
    +'A Carnot cycle is an exact <b>rectangle</b> here, which is the whole of its optimality: '
    +'no loop confined to the band T<sub>c</sub> ≤ T ≤ T<sub>h</sub> can enclose more '
    +'area per unit of entropy width. Switch on a feedwater heater and the area stops being '

    +'a whole kilogram. The identity ∮T ds = ∮P dv survives — it only ever needed the loop '

  hs:'The Mollier chart, the one power-plant engineers actually use: an ideal turbine is a '

/* the same four notes, told about air.  Same geometry, no fold. */
const INFO_AIR={
  surface:'The working fluid is <b>air</b>, an ideal gas — so this surface has <b>no dome and '

    +'the cycle is a closed loop, and the two classic diagrams are its <b>shadows</b>, still '

  pv:'The loop’s shadow on the (v, P) wall — its area is <b>∮P dv</b>. For the reciprocating '
    +'cycles this is literally the indicator diagram: net work per cycle, and dividing by the '

    +'hyperbolas <b>Pv = RT</b>; there is no flat stretch anywhere, because nothing boils.',
  ts:'The loop’s shadow on the (s, T) wall, area <b>∮T ds</b>. Two families of curve are '
    +'drawn: isobars (amber) and <b>isochores</b> (green). The isochore is the steeper of the '

  hs:'Enthalpy against entropy. For an ideal gas h depends on temperature alone, so the '

/* ================================================================== *
 *  self-test                                                          *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond){ pass++; } else { fail++; console.log('FAIL — '+name); } };
  const chk=(name,got,want,tol,rel)=>{
    const e=rel?Math.abs(got-want)/Math.abs(want):Math.abs(got-want);
    if(e<=tol) pass++; else { fail++;
      console.log('FAIL — '+name+': got '+got.toPrecision(10)+' want '+want.toPrecision(10)
                  +' err '+e.toExponential(3)); } };

  /* ---------- IF97 region 1, official verification Table 5 ---------- */
  for(const t of [
    {T:300,p:3,   v:0.100215168e-2,h:0.115331273e3,u:0.112324818e3,s:0.392294792,  cp:0.417301218e1,w:0.150773921e4},
    {T:300,p:80,  v:0.971180894e-3,h:0.184142828e3,u:0.106448356e3,s:0.368563852,  cp:0.401008987e1,w:0.163469054e4},
    {T:500,p:3,   v:0.120241800e-2,h:0.975542239e3,u:0.971934985e3,s:0.258041912e1,cp:0.465580682e1,w:0.124071337e4}]){
    const r=region1(t.p,t.T), tag='IF97 R1 ('+t.T+' K, '+t.p+' MPa) ';
    chk(tag+'v',r.v,t.v,1e-8,true);   chk(tag+'h',r.h,t.h,1e-8,true);
    chk(tag+'u',r.u,t.u,1e-8,true);   chk(tag+'s',r.s,t.s,1e-8,true);
    chk(tag+'cp',r.cp,t.cp,1e-8,true);chk(tag+'w',r.w,t.w,1e-8,true); }

  /* ---------- IF97 region 2, official verification Table 15 ---------- */
  for(const t of [
    {T:300,p:0.0035,v:0.394913866e2, h:0.254991145e4,u:0.241169160e4,s:0.852238967e1,cp:0.191300162e1,w:0.427920172e3},
    {T:700,p:0.0035,v:0.923015898e2, h:0.333568375e4,u:0.301262819e4,s:0.101749996e2,cp:0.208141274e1,w:0.644289068e3},
    {T:700,p:30,    v:0.542946619e-2,h:0.263149474e4,u:0.246861076e4,s:0.517540298e1,cp:0.103505092e2,w:0.480386523e3}]){
    const r=region2(t.p,t.T), tag='IF97 R2 ('+t.T+' K, '+t.p+' MPa) ';
    chk(tag+'v',r.v,t.v,1e-8,true);   chk(tag+'h',r.h,t.h,1e-8,true);
    chk(tag+'u',r.u,t.u,1e-8,true);   chk(tag+'s',r.s,t.s,1e-8,true);
    chk(tag+'cp',r.cp,t.cp,1e-8,true);chk(tag+'w',r.w,t.w,1e-8,true); }

  /* ---------- IF97 region 4 both ways, Tables 35 and 36 ---------- */
  chk('IF97 R4 p_sat(300 K)',psat(300),0.353658941e-2,1e-8,true);
  chk('IF97 R4 p_sat(500 K)',psat(500),0.263889776e1, 1e-8,true);
  chk('IF97 R4 p_sat(600 K)',psat(600),0.123443146e2, 1e-8,true);
  chk('IF97 R4 T_sat(0.1 MPa)',tsat(0.1),0.372755919e3,1e-8,true);
  chk('IF97 R4 T_sat(1 MPa)',  tsat(1),  0.453035632e3,1e-8,true);
  chk('IF97 R4 T_sat(10 MPa)', tsat(10), 0.584149488e3,1e-8,true);
  chk('IF97 B23 p(623.15 K)',b23p(623.15),0.165291643e2,1e-8,true);
  chk('IF97 B23 T(16.5291643 MPa)',b23T(0.165291643e2),623.15,1e-8,true);
  chk('saturation round trip',tsat(psat(450)),450,1e-9,true);
  chk('p_sat(T_c) = p_c',psat(TC_W),PC_W,3e-5,true);

  /* ---------- reference state and textbook anchors ---------- */
  { const S=satIF97(T_TRIP);
    chk('triple-point pressure',S.p,P_TRIP,1e-8,true);
    ok(Math.abs(S.uf)<1e-6,'IF97 reference state u_f(triple) = 0 to 1e-6 (got '+S.uf.toExponential(2)+')');
    ok(Math.abs(S.sf)<1e-7,'IF97 reference state s_f(triple) = 0 to 1e-7 (got '+S.sf.toExponential(2)+')'); }
  { const S=satIF97(373.15);        // the 100 C row of the standard steam tables
    chk('100 C p_sat',S.p, 0.10142,5e-4,true);   chk('100 C v_f',S.vf,0.001043,5e-4,true);
    chk('100 C v_g',S.vg, 1.6720,  5e-4,true);   chk('100 C h_f',S.hf,419.17, 5e-4,true);
    chk('100 C h_g',S.hg, 2675.6,  5e-4,true);   chk('100 C s_f',S.sf,1.3072, 5e-4,true);
    chk('100 C s_g',S.sg, 7.3542,  5e-4,true); }
  chk('normal boiling point (ITS-90, 99.974 C)',tsat(0.101325),373.1243,1e-5,true);

  /* ---------- Wagner-Pruss auxiliaries cross-checked against IF97 ---------- */
  for(const T of [300,400,500,570,620]){ const S=satIF97(T);
    chk('Wagner-Pruss rho_f vs IF97 @'+T+' K',1/rhoLiqSat(T),S.vf,3e-3,true);
    chk('Wagner-Pruss rho_g vs IF97 @'+T+' K',1/rhoVapSat(T),S.vg,3e-3,true); }
  ok(rhoLiqSat(TC_W)===RHOC_W&&rhoVapSat(TC_W)===RHOC_W,'both dome branches meet rho_c exactly at T_c');

  /* ---------- Clausius-Clapeyron: couples regions 1, 2 and 4 at once ---------- */
  for(const T of [300,373.15,450,500,550,600]){ const S=satIF97(T);
    chk('Clausius-Clapeyron h_fg @'+T+' K',T*(S.vg-S.vf)*dpsatdT(T)*1000,S.hg-S.hf,3e-4,true); }
  /* the same relation is what closes the dome above 623.15 K */
  for(const T of [560,600,620]){ const S=satIF97(T);
    chk('near-critical construction reproduces s_fg @'+T+' K',
        (S.vg-S.vf)*dpsatdT(T)*1000, S.sg-S.sf, 1e-3,true); }
  ok(Math.abs(sat(T_R1MAX).sf-satIF97(T_R1MAX).sf)<1e-12,'dome closure is continuous at 623.15 K');
  { const S=sat(TC_W);
    chk('dome closes on v_c',S.vf,1/RHOC_W,1e-12,true);
    chk('dome closes on s_c',S.sf,S_CRIT,1e-9,true); }
  for(let T=T_R1MAX+1;T<TC_W;T+=4) ok(sat(T).sg>=sat(T).sf,'dome stays non-inverted at '+T.toFixed(0)+' K');

  /* ---------- Carnot is exact ---------- */
  for(const [Th,Tc] of [[500,320],[600,300],[450,350],[620,274]]){
    const C=carnotCycle({Th,Tc});
    chk('Carnot eta = 1 - Tc/Th ('+Th+', '+Tc+')',C.eta,1-Tc/Th,1e-12,false);
    chk('Carnot w_net = (Th-Tc) ds ('+Th+', '+Tc+')',C.wnet,
        (Th-Tc)*(sat(Th).sg-sat(Th).sf),1e-9,true);
    ok(C.nodes.every(n=>n.T<=T_R1MAX+1e-9),'Carnot never samples the interpolated dome ('+Th+')');
    ok(C.nodes.every(n=>isFinite(n.v)&&isFinite(n.s)&&isFinite(n.h)),'Carnot nodes finite ('+Th+')');
    ok(C.nodes[2].x>0&&C.nodes[2].x<1&&C.nodes[3].x>0&&C.nodes[3].x<1,
       'Carnot legs 3 and 4 are inside the dome ('+Th+')'); }

  /* ---------- THE THEOREM: equal shadow areas ---------- */
  const cases=[
    ['Carnot',            carnotCycle({Th:560,Tc:320})],
    ['Rankine',           rankineCycle({pb:8,pc:0.008,Tsup:0,     etaT:1,  etaP:1})],
    ['Rankine+superheat', rankineCycle({pb:8,pc:0.008,Tsup:773.15,etaT:1,  etaP:1})],
    ['Rankine irrev.',    rankineCycle({pb:8,pc:0.008,Tsup:773.15,etaT:0.8,etaP:0.75})],
    ['Reheat',            reheatCycle({pb:15,pc:0.008,pr:0.8,Tsup:773.15,  etaT:1,etaP:1})],
    ['Reheat irrev.',     reheatCycle({pb:15,pc:0.008,pr:0.8,Tsup:773.15,  etaT:0.85,etaP:0.8})]];
  for(const [tag,C] of cases){
    const A=cycleAreas(C);
    chk(tag+': cyclic P dv = cyclic T ds',A.pv,A.ts,6e-3,true);
    ok(isFinite(A.pv)&&isFinite(A.ts)&&Math.abs(A.pv)>1,tag+': areas are finite and non-degenerate');
    ok(C.pts.every(s=>isFinite(s.v)&&isFinite(s.s)&&isFinite(s.T)&&isFinite(s.p)),
       tag+': every sampled state is finite');
    ok(C.pts.every(s=>s.T<=1073.16&&s.T>=273.1),tag+': every sampled state is in range');
    ok(C.eta>0&&C.eta<1,tag+': efficiency in (0,1) — '+(100*C.eta).toFixed(2)+'%');
    ok(C.eta<=C.etaCarnot+1e-12,tag+': efficiency does not beat its Carnot bound'); }
  /* the reversible cases must ALSO equal the net work; the irreversible ones need not */
  { const C=carnotCycle({Th:560,Tc:320}), A=cycleAreas(C);
    chk('Carnot: area = w_net',A.ts,C.wnet,5e-3,true); }
  { const C=rankineCycle({pb:8,pc:0.008,Tsup:773.15,etaT:1,etaP:1}), A=cycleAreas(C);
    chk('reversible Rankine: area = w_net',A.ts,C.wnet,2e-2,true); }

  /* The drawn polyline must have no visible gap: a leg sampled uniformly in a
     parameter that is not uniform on screen renders as a straight chord across
     the plot.  Measured as the largest step between consecutive samples, INCLUDING
     the wrap back to the start, in units of the box diagonal. */
  { const diag=Math.hypot(LX,LY,LZ); let worst=0, wtag='';
    for(const [tag,C] of cases) for(const hk of ['T','P','u']){
      const w=C.pts.map(s=>worldPt(s,hk));
      for(let i=0;i<w.length;i++){ const a=w[i], b=w[(i+1)%w.length];
        const d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2])/diag;
        if(d>worst){ worst=d; wtag=tag+'/'+hk; } } }
    ok(worst<0.06,'drawn loop has no visible gap: worst step '+(100*worst).toFixed(2)
       +'% of the box diagonal, at '+wtag);
    /* the defect this guards against, reproduced: sampling a condensation leg
       uniformly in quality alone leaves a chord ~37% of the diagonal wide */
    const S=sat(tsat(0.008)), naive=[];
    for(let i=0;i<=110;i++) naive.push(wet(S.T,0.68*(1-i/110)));
    let nWorst=0;
    for(let i=1;i<naive.length;i++){ const a=worldPt(naive[i-1],'T'), b=worldPt(naive[i],'T');
      nWorst=Math.max(nWorst,Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2])/diag); }
    ok(nWorst>0.25,'…and the uniform-in-x sampling it replaced is still measurably bad ('
       +(100*nWorst).toFixed(0)+'%)'); }
  /* resampling a tie line changes the drawing and NOT the integrals */
  { let worstPV=0, worstTS=0;
    for(const [T,x0,x1] of [[320,0.68,0],[560,0,1],[450,0.9,0.2]]){
      const leg=legWet(T,x0,x1,110), S=sat(T);
      let ipv=0, its=0;
      for(let i=1;i<leg.length;i++){
        ipv += 0.5*(leg[i-1].p+leg[i].p)*1000*(leg[i].v-leg[i-1].v);
        its += 0.5*(leg[i-1].T+leg[i].T)*(leg[i].s-leg[i-1].s); }
      const last=leg[leg.length-1];
      worstPV=Math.max(worstPV,Math.abs(ipv-S.p*1000*(last.v-leg[0].v)));
      worstTS=Math.max(worstTS,Math.abs(its-T*(last.s-leg[0].s))); }
    ok(worstPV<1e-9&&worstTS<1e-9,'tie-line integrals are sampling-independent (P dv '
       +worstPV.toExponential(1)+', T ds '+worstTS.toExponential(1)+')');
    const a=legWet(320,0.68,0,110), b=legWet(320,0.68,0,40);
    ok(Math.abs(a[0].x-b[0].x)<1e-12&&a[0].x===0.68,'a leg still starts exactly where asked');
    ok(a.every((s,i)=>i===0||s.x<=a[i-1].x+1e-12),'leg samples stay monotone in quality'); }

  /* quadrature converges: refining the polyline shrinks the gap */
  { const gap=n=>{ const Th=560,Tc=320,H=sat(Th),C=sat(Tc);

      const p=[].concat(legWet(Th,0,1,n),legIsen(H.p,C.p,H.sg,H.sg,n),

         +(100*G.eta).toFixed(2)+'%)'); }
    const RH=reheatCycle({pb:15,pc:0.008,pr:0.8,Tsup:773.15,etaT:1,etaP:1});
    const NR=rankineCycle({pb:15,pc:0.008,Tsup:773.15,etaT:1,etaP:1});
    ok(RH.nodes[5].x>NR.nodes[3].x||RH.nodes[5].x===undefined,

  /* ================================================================ *
   *  REGENERATIVE vapour cycles vs Moran §8.4                        *

  const REG={pb:8,pc:0.008,Tsup:753.15,etaP:1};
  const reg=o=>regenCycle(Object.assign({etaT:1,open:false,pOfw:0.3,nClosed:0,

  /* ---- Example 8.5: one open feedwater heater, 85 % turbine stages ---- */

    chk('Ex 8.5 turbine work (book 984.4 kJ/kg)',C.wt,984.4,0.5,false);
    chk('Ex 8.5 pump work (book 8.7 kJ/kg)',C.wp,8.7,0.1,false);
    chk('Ex 8.5 heat added (book 2643.1 kJ/kg)',C.qin,2643.1,1.5,false);

  /* ---- Example 8.6: reheat + one closed + one open heater ---- */
  { const C=reg({open:true,pOfw:0.3,nClosed:1,fTop:E86_FTOP,ttd:E86_TTD,

    chk('Ex 8.6 pump work (book 8.48 kJ/kg)',C.wp,8.48,0.1,false);
    chk('Ex 8.6 heat added (book 2984.4 kJ/kg)',C.qin,2984.4,8,false);
    chk('Ex 8.6 thermal efficiency (book 0.431)',C.eta,0.431,1.5e-3,false);
    chk('Ex 8.6 open-heater fraction y″ (book 0.0941)',yO,0.0941,1e-3,false);
    /* The closed-heater fraction comes out 0.1497 here against the book's 0.1522,
       and the difference is the BOOK's, not ours.  y′ = (h11 - h10)/(h2 - h12),

       approximation h ≈ h_f + v_f·(p - p_sat), getting 882.4 kJ/kg.  That
       approximation assumes (∂h/∂p)_T = v; the true value is v(1 - Tβ), and at
       205 C the thermal expansion term Tβ ≈ 0.657, so only about a THIRD of
       v·Δp is real.  IF97 gives 877.4.  Moran's own Table A-5 agrees with IF97,
       and the book even says h11 "can be found from Table A-5" instead.
       Asserted three ways below, so the claim is not just a story. */
    const hf=wet(478.15,0), approx=hf.h+hf.v*(8-psat(478.15))*1000, exact=liq(8,478.15).h;

        approx,882.4,0.2,false);

    ok(approx-exact>4.5,'…the approximation overshoots by '+(approx-exact).toFixed(2)+' kJ/kg');
    /* IF97 against Moran's OWN compressed-liquid table, which is the tiebreak */
    for(const [p,Tc_,h_] of [[7.5,180,766.55],[7.5,220,945.1],[10,180,767.84],[10,220,945.9]])
      chk('IF97 vs Moran Table A-5 ('+p+' MPa, '+Tc_+' °C)',liq(p,Tc_+273.15).h,h_,0.1,false);
    { const T=478.15,d=0.05, v0=liq(8,T).v;
      const beta=(liq(8,T+d).v-liq(8,T-d).v)/(2*d)/v0;
      ok(T*beta>0.6&&T*beta<0.72,'…because Tβ = '+(T*beta).toFixed(3)
         +' at 205 °C, so (∂h/∂p)_T is v(1−Tβ), not v'); }
    /* and with the book's own h11 the book's y′ comes straight back out */
    { const yBook=(882.4-liqAtS(8,wet(tsat(0.3),0).s).h)/

    ok(A.ts>C.wnet*1.02,'…so the enclosed area ('+A.ts.toFixed(0)

       +'end at full mass');

    ok(C.qin>0&&C.wnet>0&&C.eta>0&&C.eta<1,'…and it is a real cycle, eta = '

     what the section is actually about — is that eta rises with every heater while
     the FIRST one buys far more than all the rest together. */

    const e=[base.eta];
    for(const n of [1,2,3]) e.push(reg({open:true,pOfw:0.3,nClosed:n}).eta);
    ok(e[1]>e[0]&&e[2]>e[1]&&e[3]>e[2],'each added feedwater heater raises eta ('

  { const a=rankineCycle({pb:4, pc:0.008,Tsup:0,etaT:1,etaP:1});
    const b=rankineCycle({pb:12,pc:0.008,Tsup:0,etaT:1,etaP:1});
    ok(b.eta>a.eta,'raising boiler pressure raises eta ('+(100*a.eta).toFixed(2)+'% → '

  for(const [p,T] of [[10,400],[0.5,350],[60,500]]){

    for(const T of [350,450,550]){

  /* ---------- the mesh, both fluids ---------- */
  for(const fl of ['water','air']) for(const hk of ['T','P','u']){

    ok(M.lines.every(L=>L.pts.some(p=>p!==null)),tag+' every iso-line has a drawable run');
    /* well-formed is not the same as visible: a two-stage blend through a bad

    const bands={};
    for(const q of M.quads){ const c=toRgb(q.c);

    for(const b in bands){ const arr=bands[b].sort((x,y)=>x-y);

      ok(arr[arr.length-1]>110,tag+' band "'+b+'" reaches a lit tone ('+arr[arr.length-1]+')'); }
    /* water folds into three bands (liquid / two-phase / vapour); an ideal gas

    ok(Object.keys(bands).length===(fl==='water'?3:1),

  /* mesh vertices are DROPPED when out of range, never clamped: every quad that
     survives must be strictly inside the box in all three coordinates */
  for(const fl of ['water','air']) for(const hk of ['T','P','u']){
    const M=buildMesh(hk,0.6,fl), tag=fl+' mesh '+hk;
    const half=[LX/2,LY/2,LZ/2];
    ok(M.quads.every(q=>q.q.every(p=>p.every((c,i)=>Math.abs(c)<=half[i]+1e-9))),

  /* the air sheet's row ends are SOLVED, not dropped: a row that the closed form

     staircase after all */
  { let bad=0, n=0;
    for(const hk of ['T','P','u']) for(let i=0;i<=20;i++){

      if(hk==='P'){ vlo=Math.max(vlo,airVfromP(T,A.P.hi)); vhi=Math.min(vhi,airVfromP(T,A.P.lo)); }
      if(!(vhi>vlo)) continue;

    ok(bad===0,'the air sheet\'s solved row ends really are inside the box ('+n+' probes, '
