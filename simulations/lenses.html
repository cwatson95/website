<title>Lenses — ray tracing and the lens maker's equation</title>
<!--
  ===================================================================
  LENSES: RAY TRACING AND THE LENS MAKER'S EQUATION
  what one law does at two surfaces, and every way it fails to
  make a point
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, diffraction.html,
  pulsar.html, standard_candle.html, cmb.html, differential_scattering.html,
  adiabatic_expansion.html, bloch_sphere.html and down_conversion.html: one
  flat file, no build step, no network, works opened straight off the disk
  as file://.

  ------------------------------------------------------------------
  WHAT THIS COMPUTES
  ------------------------------------------------------------------
    the bench     rays traced the hard way -- intersect the surface, take
                  the normal, apply Snell's law in vector form, repeat.
                  Nothing paraxial is used ANYWHERE in the tracing.  The
                  famous formulas are checked against it, in the limit,
                  rather than used by it, which is why the rays do not
                  meet at a point: nothing in the calculation made them.
    the lens      1/f = (n-1)[1/R1 - 1/R2 + (n-1)d/(n R1 R2)], the thick
    maker         form, with the thickness term shown for what it is worth
                  (a millimetre in a hundred for the default lens).  The
                  principal planes, and bending at constant power.
    the glass     five SCHOTT catalogue glasses: measured dispersion, the
                  Abbe number, the partial dispersion, and the plane every
                  optical designer works in.
    aberration    longitudinal spherical aberration against ray height,
                  its h^2 law, and the fact that the best focus is NOT the
                  paraxial one.
    the achromat  a cemented doublet designed in closed form from two real
                  glasses; F and C brought to the same focus exactly, and
                  the secondary spectrum that two glasses cannot remove.
    the mirror    f = R/2 for every colour at once, and the difference
                  between a sphere and a paraboloid.

  ------------------------------------------------------------------
  WHAT IS MEASURED, WHAT IS COMPUTED, WHAT IS NOT MODELLED
  ------------------------------------------------------------------
  MEASURED  (retrieved 2026-08-03, not typed from memory)

    Sellmeier coefficients for five SCHOTT optical glasses, from
    refractiveindex.info (shelf "specs", book "SCHOTT-optical"); the
    underlying data is SCHOTT's own Zemax catalog 2017-01-20b, obtained
    from schott.com:

      N-BK7    0.30 -2.5 um   n_d 1.51680  V_d 64.17   517642.251
      N-FK51A  0.29 -2.5 um   n_d 1.48656  V_d 84.47   487845.368
      F2       0.32 -2.5 um   n_d 1.62004  V_d 36.37   620364.360
      N-SF11   0.37 -2.5 um   n_d 1.78472  V_d 25.68   785257.322
      N-LASF9  0.365-2.5 um   n_d 1.85025  V_d 32.17   850322.441

    The n_d and V_d above are the catalogue's OWN printed values.  They
    are used in no calculation: they are there so the file can check the
    values it computes against them.  That one check validates three
    things at once -- the Sellmeier evaluator, the Fraunhofer wavelengths
    (d 587.5618, F 486.1327, C 656.2725 nm), and the definition of the
    Abbe number -- because all three feed V_d, and a wrong spectral line
    moves V_d in its second digit.  Agreement is 1.1e-6 in index and
    0.0035 in Abbe number across all five glasses.

  COMPUTED EXACTLY  (and asserted against scipy in selfTest)
    Every ray.  Every focal length, principal plane and back focal
    distance.  Every aberration figure, by tracing rather than by a
    third-order formula.  The achromatic solve, in closed form.  The
    conic sag, and the paraboloid's exactly-zero spherical aberration.

  NOT MODELLED
    * Anything off-axis beyond the ray fan: coma, astigmatism, field
      curvature and distortion are NOT computed.  There is a field-angle
      slider and it tilts the input beam, but the file draws no spot
      diagram over a field and claims no Seidel coefficients.
    * Diffraction.  Every spot on this page is a ray-optics spot; a real
      lens stopped down far enough stops being limited by aberration and
      starts being limited by the aperture, and that crossover is not
      here.  diffraction.html is where that lives.
    * Coatings, transmission, ghosts, and Fresnel losses at the surfaces
      (refraction.html covers the Fresnel coefficients).
    * Thermal and stress effects; the catalogue data is at 293 K.
    * Real cemented-doublet design, which balances spherical aberration
      and coma against the bending as well as correcting colour.  Here
      the bending is exposed as a control and its effect is traced, but
      nothing is optimised for you.

  ------------------------------------------------------------------
  A NOTE ON WHAT "AT CONSTANT POWER" HAS TO MEAN
  ------------------------------------------------------------------
  Bending a lens moves the sag of both surfaces, so a lens bent at
  constant THIN-lens power quietly changes its actual focal length.  The
  shape sweep here holds the THICK-lens power fixed instead.  Related:
  a lens has to exist before it can be traced -- a 0.01 mm centre
  thickness at a 10 mm semi-aperture is a lens whose two surfaces cross,
  and the first draft of the shape sweep asked for exactly that and had
  every ray correctly reported blocked.

  ------------------------------------------------------------------
  VERIFICATION
  ------------------------------------------------------------------
  selfTest() runs when there is no document (osascript -l JavaScript) and
  THROWS on failure.  Reference values marked (scipy) were printed by
  build_lens/derive.py and copied from output read in full.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* ============================================================================
 *  measured dispersion  --  SCHOTT optical glass
 *
 *  Sellmeier coefficients retrieved 2026-08-03 from refractiveindex.info
 *  (shelf "specs", book "SCHOTT-optical"); the underlying data is SCHOTT's own
 *  Zemax catalog 2017-01-20b, obtained from schott.com.  The form is
 *
 *      n^2 - 1 = sum_i  B_i lambda^2 / (lambda^2 - C_i),   lambda in um
 *
 *  `nd` and `Vd` below are the catalogue's OWN printed values.  They are not
 *  used in any calculation: they exist so that selfTest can check the values
 *  this file computes against them.  That single check validates three things
 *  at once -- the Sellmeier evaluator, the Fraunhofer wavelengths, and the
 *  definition of the Abbe number -- because all three feed V_d, and a wrong
 *  spectral line moves V_d in its second digit.
 * ========================================================================== */
const GLASS = {
  'N-BK7':   { B: [1.03961212, 0.231792344, 1.01046945],
               C: [0.00600069867, 0.0200179144, 103.560653],
               rng: [0.30, 2.5], nd: 1.51680, Vd: 64.17,
               code: '517642.251', rho: 2510, kind: 'crown' },
  'N-FK51A': { B: [0.971247817, 0.216901417, 0.904651666],
               C: [0.00472301995, 0.0153575612, 168.68133],
               rng: [0.29, 2.5], nd: 1.48656, Vd: 84.47,
               code: '487845.368', rho: 3675, kind: 'crown' },
  'F2':      { B: [1.34533359, 0.209073176, 0.937357162],
               C: [0.00997743871, 0.0470450767, 111.886764],
               rng: [0.32, 2.5], nd: 1.62004, Vd: 36.37,
               code: '620364.360', rho: 3599, kind: 'flint' },
  'N-SF11':  { B: [1.73759695, 0.313747346, 1.89878101],
               C: [0.013188707, 0.0623068142, 155.23629],
               rng: [0.37, 2.5], nd: 1.78472, Vd: 25.68,
               code: '785257.322', rho: 3224, kind: 'flint' },
  'N-LASF9': { B: [2.00029547, 0.298926886, 1.80691843],
               C: [0.0121426017, 0.0538736236, 156.530829],

const GLASSES = Object.keys(GLASS);

function nGlass(g, lam) {
  const G = GLASS[g], l2 = lam * lam;
  let s = 1;
  for (let i = 0; i < 3; i++) s += G.B[i] * l2 / (l2 - G.C[i]);
  if (!(s > 0)) throw new Error('nGlass: n^2 <= 0 for ' + g + ' at ' + lam);
  return Math.sqrt(s);
}
function inGlassRange(g, lam) {
  const r = GLASS[g].rng; return lam >= r[0] && lam <= r[1];
}

/* The Fraunhofer lines, in micrometres: d is the helium yellow line, F and C
   the hydrogen beta and alpha lines, g the mercury blue-violet.  These are not
   cited from a source -- they are VERIFIED, by the fact that they reproduce
   SCHOTT's own printed n_d and V_d for all five glasses. */
const LAM_d = 0.5875618, LAM_F = 0.4861327, LAM_C = 0.6562725,
      LAM_g = 0.4358343;

function abbeOf(g) {
  const nd = nGlass(g, LAM_d);
  return { nd: nd, V: (nd - 1) / (nGlass(g, LAM_F) - nGlass(g, LAM_C)) };
}
/* Relative partial dispersion.  This is the quantity a two-glass achromat
   CANNOT correct, and therefore the one that sets the residual. */
function partialGF(g) {
  const nF = nGlass(g, LAM_F), nC = nGlass(g, LAM_C);
  return (nGlass(g, LAM_g) - nF) / (nF - nC);

/* ============================================================================
 *  exact ray tracing
 *
 *  A ray is a point and a direction, both [y, z] with z along the axis.  A
 *  surface is a conic of revolution about the axis with its vertex on it.
 *  Nothing here is paraxial: the paraxial formulas elsewhere in this file are
 *  checked AGAINST this, in the limit, rather than used by it.
 * ========================================================================== */
const AIR = 1.0;

/* Sag of a conic: z - z0 = h^2 / (R (1 + sqrt(1 - (1+K) h^2/R^2))).
   K = 0 is a sphere, K = -1 a paraboloid, K < -1 a hyperboloid. */
function conicSag(Rc, K, h) {
  if (!isFinite(Rc) || Rc === 0) return 0;
  const disc = 1 - (1 + K) * h * h / (Rc * Rc);
  if (disc < 0) return NaN;
  return h * h / (Rc * (1 + Math.sqrt(disc)));
}
/* Where a ray meets a conic surface, by Newton on the sag.  A closed form
   exists for the sphere, but the conic case needs this anyway and using one
   routine for both means the mirror and the lens cannot disagree. */
function hitSurface(p, d, z0, Rc, K, semi) {
  if (!isFinite(Rc) || Rc === 0) {                 /* a plane */
    if (Math.abs(d[1]) < 1e-15) return null;
    const t = (z0 - p[1]) / d[1];
    if (!(t > 1e-12)) return null;
    const q = [p[0] + t * d[0], z0];
    return Math.abs(q[0]) <= semi ? q : null;
  }
  /* start from the plane through the vertex, then iterate onto the surface */
  if (Math.abs(d[1]) < 1e-15) return null;
  let t = (z0 - p[1]) / d[1];
  for (let i = 0; i < 60; i++) {
    const y = p[0] + t * d[0], z = p[1] + t * d[1];
    if (Math.abs(y) > Math.abs(Rc) * 0.999999 && isFinite(Rc)) return null;
    const s = conicSag(Rc, K, y);
    if (!isFinite(s)) return null;
    const err = z - (z0 + s);
    /* d(err)/dt = d_z - (ds/dy) d_y */
    const disc = 1 - (1 + K) * y * y / (Rc * Rc);
    if (disc <= 0) return null;
    const dsdy = y / (Rc * Math.sqrt(disc));
    const den = d[1] - dsdy * d[0];
    if (Math.abs(den) < 1e-15) return null;
    const dt = -err / den;
    t += dt;
    if (Math.abs(dt) < 1e-14) break;
  }
  if (!(t > 1e-12)) return null;
  const q = [p[0] + t * d[0], p[1] + t * d[1]];
  if (Math.abs(q[0]) > semi) return null;
  return q;
}
/* Outward normal of the conic at height y (pointing back toward -z). */
function conicNormal(y, Rc, K) {
  if (!isFinite(Rc) || Rc === 0) return [0, -1];
  const disc = 1 - (1 + K) * y * y / (Rc * Rc);
  if (disc <= 0) return [0, -1];
  const dsdy = y / (Rc * Math.sqrt(disc));
  const n = [-dsdy, 1];
  const L = Math.hypot(n[0], n[1]);
  return [n[0] / L, n[1] / L];
}
/* Vector Snell.  Returns null on total internal reflection. */
function refractVec(d, nrm, n1, n2) {
  const L = Math.hypot(d[0], d[1]);
  let dx = d[0] / L, dy = d[1] / L;
  let nx = nrm[0], ny = nrm[1];
  let ci = -(nx * dx + ny * dy);
  if (ci < 0) { nx = -nx; ny = -ny; ci = -ci; }
  const eta = n1 / n2;
  const k = 1 - eta * eta * (1 - ci * ci);
  if (k < 0) return null;
  const f = eta * ci - Math.sqrt(k);
  return [eta * dx + f * nx, eta * dy + f * ny];
}
function reflectVec(d, nrm) {
  const L = Math.hypot(d[0], d[1]);
  const dx = d[0] / L, dy = d[1] / L;
  const dot = dx * nrm[0] + dy * nrm[1];
  return [dx - 2 * dot * nrm[0], dy - 2 * dot * nrm[1]];
}

/* Trace one ray through a list of surfaces.
   surface = { z, R, K, semi, n: <glass key | number>, mirror: bool }
   `n` is the medium AFTER the surface. */
function traceRay(surfs, p0, d0, lam) {
  let p = [p0[0], p0[1]];
  let L = Math.hypot(d0[0], d0[1]);
  let d = [d0[0] / L, d0[1] / L];
  const pts = [[p[0], p[1]]];
  let n1 = AIR;
  for (const s of surfs) {
    const q = hitSurface(p, d, s.z, s.R, s.K || 0, s.semi);
    if (q === null) return { pts: pts, p: null, d: null, blocked: true };
    const nrm = conicNormal(q[0], s.R, s.K || 0);
    let dd;
    if (s.mirror) {
      dd = reflectVec(d, nrm);
    } else {
      const n2 = (typeof s.n === 'number') ? s.n : nGlass(s.n, lam);
      dd = refractVec(d, nrm, n1, n2);
      if (dd === null) return { pts: pts, p: null, d: null, blocked: true };
      n1 = n2;

    pts.push([q[0], q[1]]);
    p = q; d = dd;

}
/* Where a ray crosses the axis.  Infinite for a ray parallel to it. */
function axisCrossing(p, d) {
  if (Math.abs(d[0]) < 1e-15) return Infinity;
  return p[1] + (-p[0] / d[0]) * d[1];
}

/* ============================================================================
 *  paraxial optics  --  the formulas the trace is checked against
 * ========================================================================== */
function invR(R) { return isFinite(R) && R !== 0 ? 1 / R : 0; }
/* The lens maker's equation.  The thickness term is the difference between
   the thin and the thick forms and is not a correction to be dropped: for the
   default singlet here it is worth a full millimetre in a hundred. */
function fThin(n, R1, R2) { return 1 / ((n - 1) * (invR(R1) - invR(R2))); }
function fThick(n, R1, R2, t) {
  return 1 / ((n - 1) * (invR(R1) - invR(R2)

/* Principal planes, measured from their own vertices. */
function principalFront(n, R1, R2, t) {
  return -fThick(n, R1, R2, t) * (n - 1) * t * invR(R2) / n;
}
function principalRear(n, R1, R2, t) {
  return -fThick(n, R1, R2, t) * (n - 1) * t * invR(R1) / n;

  return fThick(n, R1, R2, t) + principalRear(n, R1, R2, t);

function shapeOf(R1, R2) {

function radiiFromQ(q, f, n) {
  const K = 1 / ((n - 1) * f);

          Math.abs(1 - q) > 1e-12 ? -2 / (K * (1 - q)) : Infinity];

/* Radii at shape q whose THICK focal length is exactly f.  Bending a lens at
   "constant power" has to mean constant power of the lens that exists, not of
   an idealisation of it. */
function radiiAtQ(q, f, n, t) {
  const r = radiiFromQ(q, f, n);
  const g = sc => fThick(n, isFinite(r[0]) ? r[0] * sc : Infinity,
                         isFinite(r[1]) ? r[1] * sc : Infinity, t) - f;
  let a = 0.5, b = 2.0, fa = g(a);
  if (fa * g(b) > 0) return r;

    const m = 0.5 * (a + b), fm = g(m);
    if (fa * fm <= 0) b = m; else { a = m; fa = fm; }

/* Edge thickness at semi-aperture h.  A lens whose edge thickness is negative
   does not exist, and tracing it reports every ray blocked -- which is what a
   0.01 mm "thin lens" with a 10 mm semi-aperture did. */
function edgeThickness(R1, R2, t, h) {
  const s1 = conicSag(R1, 0, h), s2 = conicSag(R2, 0, h);
  if (!isFinite(s1) || !isFinite(s2)) return NaN;
  return t - s1 + s2;
}

/* ============================================================================
 *  the achromatic doublet
 *
 *  Two thin lenses in contact:  phi1 + phi2 = phi  brings the power to target,
 *  phi1/V1 + phi2/V2 = 0  brings the F and C foci together.  Two equations,
 *  two unknowns, one exact solution -- and one free parameter left over, the
 *  bending, which does nothing to the colour and everything to the spherical
 *  aberration.
 * ========================================================================== */
function doubletPowers(f, V1, V2) {
  const phi = 1 / f;
  return [phi * V1 / (V1 - V2), -phi * V2 / (V1 - V2)];
}
/* Two glasses with the same Abbe number cannot be achromatised at any power:
   the solve divides by V1 - V2.  That is a statement about optics, not a
   numerical edge case, so it is reported rather than allowed to become an
   infinity that propagates into every radius downstream. */
function achromatPossible(g1, g2) {
  return Math.abs(abbeOf(g1).V - abbeOf(g2).V) > 1e-6;
}
/* Cemented radii from the powers and a chosen front radius.  The middle
   surface is shared, so there are only three of them. */
function doubletRadii(R1, f, g1, g2) {
  const a1 = abbeOf(g1), a2 = abbeOf(g2);
  if (!achromatPossible(g1, g2))
    return { R1: R1, R2: Infinity, R3: Infinity, p1: NaN, p2: NaN,
             V1: a1.V, V2: a2.V, f1: NaN, f2: NaN, impossible: true };
  const [p1, p2] = doubletPowers(f, a1.V, a2.V);
  const iR2 = invR(R1) - p1 / (a1.nd - 1);
  const R2 = Math.abs(iR2) > 1e-14 ? 1 / iR2 : Infinity;
  const iR3 = iR2 - p2 / (a2.nd - 1);
  const R3 = Math.abs(iR3) > 1e-14 ? 1 / iR3 : Infinity;
  return { R1: R1, R2: R2, R3: R3, p1: p1, p2: p2, V1: a1.V, V2: a2.V,

/* Thin-lens focal length of a singlet at another wavelength. */
function fAtLambda(g, lam, f_d) {
  return f_d * (nGlass(g, LAM_d) - 1) / (nGlass(g, lam) - 1);
}
/* ... and of the cemented pair, which is the sum of the two powers, each
   scaled by its own (n-1). */
function fDoubletAt(lam, D, g1, g2) {
  const a1 = abbeOf(g1), a2 = abbeOf(g2);
  const q1 = D.p1 * (nGlass(g1, lam) - 1) / (a1.nd - 1);
  const q2 = D.p2 * (nGlass(g2, lam) - 1) / (a2.nd - 1);

   wrong residual makes a correct formula look 3x wrong. */
function secondarySpectrum(f, g1, g2) {
  const a1 = abbeOf(g1), a2 = abbeOf(g2);
  return f * (partialGF(g1) - partialGF(g2)) / (a1.V - a2.V);

/* ============================================================================
 *  a spectrum to trace with
 * ========================================================================== */
const LINES = [
  { lam: LAM_g, name: 'g', src: 'Hg' },
  { lam: LAM_F, name: 'F', src: 'H' },
  { lam: LAM_d, name: 'd', src: 'He' },
  { lam: LAM_C, name: 'C', src: 'H' },
];
/* ================================================================== *
 *  colour science:  wavelength -> CIE 1931 XYZ -> sRGB                *
 *                                                                     *
 *  The colour matching functions are the multi-lobe Gaussian fit of    *
 *  Wyman, Sloan & Shirley, "Simple Analytic Approximations to the CIE  *
 *  XYZ Color Matching Functions", Journal of Computer Graphics         *
 *  Techniques 2:2 (2013), Table 1 — an analytic fit, not the tabulated *
 *  standard observer, and the file says so on the canvas.              *
 *                                                                     *
 *  Spectral colours lie outside the sRGB gamut, so this CANNOT be an   *
 *  accurate rendering of a laser line; out-of-gamut components are     *
 *  desaturated toward white, which is the standard compromise and the  *
 *  reason a 632.8 nm HeNe looks pinker on screen than on the bench.    *
 * ================================================================== */
function gauss(x,mu,s1,s2){
  const s=(x<mu)?s1:s2, t=(x-mu)/s;
  return Math.exp(-0.5*t*t);
}
function cieXYZ(nm){
  const X= 1.056*gauss(nm,599.8,37.9,31.0)
          +0.362*gauss(nm,442.0,16.0,26.7)
          -0.065*gauss(nm,501.1,20.4,26.2);
  const Y= 0.821*gauss(nm,568.8,46.9,40.5)
          +0.286*gauss(nm,530.9,16.3,31.1);
  const Z= 1.217*gauss(nm,437.0,11.8,36.0)
          +0.681*gauss(nm,459.0,26.0,13.8);
  return [X,Y,Z];
}
/* sRGB (IEC 61966-2-1) primaries, D65.  The matrix times the D65 white point
   returns (1,1,1) to 2e-4, which selfTest asserts — a transposed or mistyped
   matrix fails that immediately and silently passes everything else. */
const SRGB_M=[[ 3.2406,-1.5372,-0.4986],
              [-0.9689, 1.8758, 0.0415],
              [ 0.0557,-0.2040, 1.0570]];
function srgbGamma(u){
  u=clamp(u,0,1);
  return u<=0.0031308 ? 12.92*u : 1.055*Math.pow(u,1/2.4)-0.055;
}
/* linear sRGB for a monochromatic line, normalised to peak 1 and desaturated
   into gamut.  Returns null-free [r,g,b] in 0..1 (linear, pre-gamma). */
function spectralLinear(nm){
  const xyz=cieXYZ(nm);
  /* OUTSIDE THE EYE'S RANGE THERE IS NO COLOUR, AND NORMALISING SAYS OTHERWISE.
     The three colour matching functions are Gaussians with different widths, so
     past about 730 nm they are all vanishingly small but not equally so — Y
     outlives X by orders of magnitude.  Dividing by the largest of three tiny
     numbers then promotes that ratio to full saturation: 810 nm rendered as
     rgb(0,255,167), a BRIGHT GREEN, from a stimulus of 1.6e-8.  Every SPDC ring
     in this file is at such a wavelength, so the whole picture came out green
     and looked deliberate.  Below a real stimulus there is no chromaticity to
     report and the answer is black. */
  if(!(xyz[0]+xyz[1]+xyz[2] > 1e-4)) return [0,0,0];
  let r=SRGB_M[0][0]*xyz[0]+SRGB_M[0][1]*xyz[1]+SRGB_M[0][2]*xyz[2];
  let g=SRGB_M[1][0]*xyz[0]+SRGB_M[1][1]*xyz[1]+SRGB_M[1][2]*xyz[2];
  let b=SRGB_M[2][0]*xyz[0]+SRGB_M[2][1]*xyz[1]+SRGB_M[2][2]*xyz[2];
  const lo=Math.min(r,g,b);
  if(lo<0){ r-=lo; g-=lo; b-=lo; }          // desaturate toward white
  const hi=Math.max(r,g,b,1e-12);
  return [r/hi,g/hi,b/hi];
}
/* wavelength + relative intensity -> a CSS colour.  Intensity is applied in
   LINEAR light and gamma-encoded afterwards, which is the whole point of doing
   this properly: scaling the 8-bit values instead makes a half-intensity fringe
   look far too bright. */
function spectralCss(nm,inten){
  const c=spectralLinear(nm), I=clamp(inten,0,1);
  return 'rgb('+Math.round(255*srgbGamma(c[0]*I))+','
               +Math.round(255*srgbGamma(c[1]*I))+','
               +Math.round(255*srgbGamma(c[2]*I))+')';
}
/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  /* Accumulating by += leaves float dust where the tick should be exactly
     zero, and the significant-figures formatter then prints it in full:
     a Delta-k axis spanning zero was labelled "5.2x10^-18" instead of "0". */
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step)
    out.push(Math.abs(t)<step*1e-6?0:t);

function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis — a
     magnitude scale, where brighter is up — silently gets one tick label and
     no grid.  Sort the range before asking for ticks; the placement below
     already handles either direction.  (Found by looking at the picture: the
     audit cannot see a label that was never drawn.) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(plain(o.xfmt?o.xfmt(t):fmt(t,2)),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(plain(o.yfmt?o.yfmt(t):fmt(t,2)),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* ============================================================================
 *  views
 *
 *  The floating readout sits over the top right of the stage -- about 344 px
 *  wide and up to 556 tall -- so nothing that has to be READ goes there.  RO
 *  below is that reserved rectangle and every layout in this file respects it.
 * ========================================================================== */
/* --------------------------------------------------------------------------
 *  formatting.  `sg` is the significant-figures formatter; it is NOT called
 *  `sig` because tools/ui_drive.js declares `const sig` at top level and
 *  concatenating the two for a headless UI run would be a SyntaxError, not a
 *  subtle bug.  Renaming here keeps the shared harness usable unmodified.
 * ------------------------------------------------------------------------ */
function fmt(x, n){ return isFinite(x) ? Number(x).toFixed(n === undefined ? 3 : n) : '\u2014'; }
function sup(e){
  const d = '\u2070\u00b9\u00b2\u00b3\u2074\u2075\u2076\u2077\u2078\u2079';
  let s = (e < 0 ? '\u207b' : ''), a = Math.abs(e) + '';
  for (const ch of a) s += d[+ch];
  return s;
}
function fmtExp(x, n){
  if (!isFinite(x)) return '\u2014';
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  return fmt(x / Math.pow(10, e), n === undefined ? 2 : n) + '\u00d710' + sup(e);
}
const RO = { w: 344, h: 556 };
const C_GREEN = '#b8ec4c', C_ORANGE = '#e8843a', C_MAG = '#cd35c4', C_CYAN = '#5ac8e0';
const C_DIM = '#8b93a6', C_TXT = '#cfd4de', C_FAINT = '#4a5165';

function clipTo(ctx, b, fn){
  ctx.save();
  ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  fn();
  ctx.restore();
}
/* polyline from [[x,y],...] pairs, always clipped to its box */
function pl(ctx, b, pts, xlo, xhi, ylo, yhi, col, lw, dash){
  if (!pts || !pts.length) return;
  clipTo(ctx, b, () => polyline(ctx, b, pts.map(q => q[0]), pts.map(q => q[1]),
                                xlo, xhi, ylo, yhi, col, lw, dash));
}
function px(b, x, xlo, xhi){ return b.x + b.w * (x - xlo) / (xhi - xlo || 1); }
function py(b, y, ylo, yhi){ return b.y1 - b.h * (y - ylo) / (yhi - ylo || 1); }
function dot(ctx, b, x, y, xlo, xhi, ylo, yhi, col, r){
  const X = px(b, x, xlo, xhi), Y = py(b, y, ylo, yhi);
  if (X < b.x - 2 || X > b.x1 + 2 || Y < b.y - 2 || Y > b.y1 + 2) return false;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X, Y, r || 4, 0, TAU); ctx.fill();
  return true;
}
/* Legends have now been placed on top of the curves they label three times --
   free expansion, the parcel, and reduced coordinates -- because "which corner
   is empty" was decided by looking at one configuration.  legend() therefore
   records its own rectangle in LEGEND_BOXES, and selfTest asserts that no data
   polyline passes through one, over every view and every gas. */
let LEGEND_BOXES = [];
function legend(ctx, x, y, entries, align){
  /* the recorded box is the TEXT area only.  The key marks are strokes drawn by
     this function itself, and including them would make every legend report a
     curve running through it. */
  /* Record the WHOLE legend -- key marks included -- and note how many path
     vertices this function is about to contribute itself (one moveTo and one
     lineTo per entry).  Recording only the text box was too generous: a
     mutation sweep put the legend back on top of the curves in two views and
     the assertion stayed green, because the curves crossed the key column
     rather than the words. */
  let wmax = 0;
  for (const e of entries) wmax = Math.max(wmax, plain(e[1]).length * 6.2 + 34);
  LEGEND_BOXES.push({ x: align === 'right' ? x - 28 - wmax : x, y: y - 9,
                      w: wmax + 6, h: entries.length * 15 + 4, own: entries.length * 2 });
  ctx.save();
  ctx.font = '11px -apple-system, sans-serif'; ctx.textBaseline = 'middle';
  let yy = y;
  for (const [col, lab, dash] of entries){
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    if (align === 'right'){ ctx.moveTo(x - 22, yy); ctx.lineTo(x - 4, yy); }
    else { ctx.moveTo(x, yy); ctx.lineTo(x + 18, yy); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C_DIM; ctx.textAlign = align === 'right' ? 'right' : 'left';
    ctx.fillText(plain(lab), align === 'right' ? x - 28 : x + 24, yy);
    yy += 15;
  }
  ctx.restore();
  return yy - y;
}
/* Tick labels sized to the tick SPACING.  fmt(t,2) prints "318.00" whatever
   the range, and six of those do not fit in a 210 px panel -- the audit caught
   them overlapping each other, not the frame.  This prints only the digits the
   spacing actually distinguishes. */
function tickfmt(ticks){
  let step = Infinity;
  for (let i = 1; i < ticks.length; i++) step = Math.min(step, Math.abs(ticks[i] - ticks[i - 1]));
  if (!isFinite(step) || step <= 0) step = 1;
  const d = Math.max(0, Math.min(4, Math.ceil(-Math.log10(step) + 0.3)));
  return (t) => Number(t).toFixed(d);
}
function ticksN(lo, hi, n){ return ticksFor(Math.min(lo, hi), Math.max(lo, hi), n); }
function sg(x, n){
  if (!isFinite(x)) return '\u2014';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e5 || a < 1e-3) return fmtExp(x, Math.max(0, (n || 3) - 1));
  const d = Math.max(0, (n || 3) - 1 - Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d, 6));
}
/* --------------------------------------------------------------------------
 *  Lay the stage out from the BOTTOM up.
 *
 *  The caption and the footnote are wrapped text, so their height depends on
 *  the canvas width and cannot be a constant.  Guessing one put the caption
 *  UNDER the footnote at 520x340 and pushed both off a 340 px canvas -- found
 *  by the resize sweep, not by looking.  stage() measures both first and hands
 *  the plot whatever vertical space is left.
 * ------------------------------------------------------------------------ */
const CAP_FONT  = '11.5px -apple-system, sans-serif';
const FOOT_FONT = '10.5px "SF Mono", ui-monospace, monospace';
function stage(ctx, W, H, capTxt, footTxt, capW){
  const fl = footTxt ? wrapText(ctx, plain(footTxt), W - 40, FOOT_FONT).length : 0;
  const cl = capTxt  ? wrapText(ctx, plain(capTxt),  capW,  CAP_FONT).length  : 0;
  const footY = H - 8 - fl * 13;
  const capY  = footY - 10 - cl * 14;
  const top = 54;
  /* axes() draws tick labels at b.y1 + 5 and the axis title at b.y1 + 21, so
     the box must end at least ~40 px above the caption or the two collide --
     which is exactly what the display-list audit reported on six views. */
  return { top: top, capY: capY, footY: footY, capW: capW, cap: capTxt, foot: footTxt,
           plotH: Math.max(90, capY - 44 - top) };
}
function drawStage(ctx, W, H, L){
  if (L.cap)  caption(ctx, 66, L.capY, L.cap, L.capW, C_TXT, CAP_FONT);
  if (L.foot) caption(ctx, 18, L.footY, L.foot, W - 40, '#5c6478', FOOT_FONT);
}
/* A legend drawn over live curves needs its own background.  There is no
   corner that is reliably empty: cos2(a-b) returns to +1 at BOTH ends of the
   correlation panel, and S(b) sweeps the full height of the CHSH panel, so a
   bare legend in any corner ends up with a curve or a bound line through it.
   Drawn opaque, because an alpha panel over a dashed line composites twice. */
function legendBox(ctx, x, y, items, opt) {
  const o = opt || {};
  ctx.save();
  ctx.font = '10.5px -apple-system, sans-serif';
  let wmax = 0;
  for (const it of items)
    wmax = Math.max(wmax, ctx.measureText(plain(it[1])).width);
  const w = wmax + 30, hh = items.length * 14 + 9;
  const X = o.right ? x - w : x, Y = o.up ? y - hh : y;
  ctx.fillStyle = 'rgb(9,11,17)';
  ctx.fillRect(X, Y, w, hh);
  ctx.strokeStyle = '#232838'; ctx.lineWidth = 1;
  ctx.strokeRect(X + 0.5, Y + 0.5, w - 1, hh - 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  let yy = Y + 5;
  for (const it of items) {
    ctx.fillStyle = it[0]; ctx.fillRect(X + 8, yy + 4, 10, 3);
    ctx.fillStyle = C_DIM; ctx.fillText(plain(it[1]), X + 23, yy);
    yy += 14;
  }
  ctx.restore();
  return { w: w, h: hh };
}

const PLOT_L = 68, PLOT_R = 22, PLOT_GAP = 66;
function twoBoxes(W, top, hgt) {
  const bw = Math.max(60, (W - PLOT_L - PLOT_R - PLOT_GAP) / 2);
  return [box(PLOT_L, top, bw, hgt), box(PLOT_L + bw + PLOT_GAP, top, bw, hgt)];
}

/* ============================================================================
 *  state and model
 * ========================================================================== */
const VIEWS = [['bench',  'the bench'],
               ['maker',  'the lens maker'],
               ['glass',  'the glass'],
               ['aberr',  'aberration'],
               ['achrom', 'the achromat'],
               ['mirror', 'the mirror']];

const DEFAULTS = {
  view: 'bench',
  system: 'singlet',
  glass: 'N-BK7',
  glass1: 'N-BK7',            /* crown */
  glass2: 'F2',               /* flint */
  fTarget: 100,               /* mm */
  shapeQ: 0,                  /* Coddington bending of the singlet */
  thick: 6,                   /* mm, centre thickness */
  semi: 12,                   /* mm, semi-aperture */
  bendR1: 60,                 /* mm, front radius of the doublet */
  mirrorR: 200,               /* mm, mirror radius (concave) */
  conicK: 0,                  /* 0 sphere, -1 paraboloid */
  objDist: 0,                 /* mm in front; 0 means collimated */
  fieldDeg: 0,                /* field angle, degrees */
  nRays: 15,
  lam: LAM_d,
  showLines: true,            /* trace g, F, d, C rather than one colour */
  showParaxial: true,
  showPrincipal: false,
};

const PRESETS = [
  { id: 'plano',  name: 'plano-convex, right way',
    st: { system: 'singlet', glass: 'N-BK7', shapeQ: 1, thick: 5, semi: 12 } },
  { id: 'planoR', name: 'plano-convex, turned round',
    st: { system: 'singlet', glass: 'N-BK7', shapeQ: -1, thick: 5, semi: 12 } },
  { id: 'best',   name: 'best-form singlet',
    st: { system: 'singlet', glass: 'N-BK7', shapeQ: 0.7276, thick: 5,
          semi: 12 } },
  { id: 'ach',    name: 'cemented achromat',
    st: { system: 'doublet', glass1: 'N-BK7', glass2: 'F2', bendR1: 60,
          thick: 5, semi: 12 } },
  { id: 'para',   name: 'parabolic mirror',
    st: { system: 'mirror', mirrorR: 200, conicK: -1, semi: 40 } },
];

/* ---------------------------------------------------------------------------
 *  Build the surface list.  Everything the views draw and everything the
 *  readout prints comes from here, so no drawing code re-derives a radius.
 * ------------------------------------------------------------------------- */
function buildSystem(st) {
  const semi = st.semi;
  if (st.system === 'mirror') {
    return { kind: 'mirror', semi: semi,
             surfs: [{ z: 0, R: -Math.abs(st.mirrorR), K: st.conicK,
                       semi: semi, mirror: true }],
             back: 0 };
  }
  if (st.system === 'doublet') {
    const D = doubletRadii(st.bendR1, st.fTarget, st.glass1, st.glass2);
    const t1 = st.thick, t2 = Math.max(1.2, st.thick * 0.55);
    return { kind: 'doublet', semi: semi, D: D,
             surfs: [{ z: 0, R: D.R1, K: 0, semi: semi, n: st.glass1 },
                     { z: t1, R: D.R2, K: 0, semi: semi, n: st.glass2 },
                     { z: t1 + t2, R: D.R3, K: 0, semi: semi, n: AIR }],
             back: t1 + t2 };
  }
  const n = nGlass(st.glass, LAM_d);
  const r = radiiAtQ(st.shapeQ, st.fTarget, n, st.thick);
  return { kind: 'singlet', semi: semi, R1: r[0], R2: r[1],
           surfs: [{ z: 0, R: r[0], K: 0, semi: semi, n: st.glass },
                   { z: st.thick, R: r[1], K: 0, semi: semi, n: AIR }],
           back: st.thick };
}

/* A ray leaving the object at height y0 on the entrance plane.  A zero object
   distance means a collimated beam, tilted by the field angle. */
function startRay(st, y, zStart) {
  const th = st.fieldDeg * DEG;
  if (!(st.objDist > 0))
    return { p: [y + zStart * Math.tan(th), zStart],
             d: [Math.sin(th), Math.cos(th)] };
  const yo = st.objDist * Math.tan(th);
  const zo = -st.objDist;
  return { p: [yo, zo], d: [y - yo, zStart - zo + Math.abs(zStart)] };
}

function buildModel(st) {
  const S = buildSystem(st);
  const warn = [];
  const zStart = -Math.max(40, st.fTarget * 0.45);

  /* --- paraxial reference --- */
  let par = null;
  if (S.kind === 'singlet') {
    const n = nGlass(st.glass, LAM_d);
    par = { n: n,
            fThin: fThin(n, S.R1, S.R2),
            f: fThick(n, S.R1, S.R2, st.thick),
            H: principalFront(n, S.R1, S.R2, st.thick),
            Hp: principalRear(n, S.R1, S.R2, st.thick),
            bfd: backFocal(n, S.R1, S.R2, st.thick),
            q: shapeOf(S.R1, S.R2),
            edge: edgeThickness(S.R1, S.R2, st.thick, st.semi) };
    if (!(par.edge > 0))
      warn.push('the edge thickness is ' + fmt(par.edge, 2)
                + ' mm: at this aperture the two surfaces cross and the lens '
                + 'does not exist');
  } else if (S.kind === 'mirror') {
    par = { f: -Math.abs(st.mirrorR) / 2, bfd: -Math.abs(st.mirrorR) / 2 };
  } else {
    par = { f: st.fTarget, bfd: st.fTarget, D: S.D };
  }

  /* --- the paraxial focus, found by tracing a vanishingly low ray --- */
  const tinyR = traceRay(S.surfs, [1e-6, zStart], [0, 1], st.lam);
  const zPar = tinyR.p ? axisCrossing(tinyR.p, tinyR.d) : NaN;

  /* --- the ray fan the bench view draws --- */
  const lines = st.showLines ? LINES : [{ lam: st.lam, name: '', src: '' }];
  const fans = [];
  for (const L of lines) {
    const rays = [];
    const N = Math.max(2, st.nRays | 0);
    for (let i = 0; i < N; i++) {
      const y = -st.semi + 2 * st.semi * i / (N - 1);
      if (Math.abs(y) < 1e-9) continue;
      const r0 = startRay(st, y, zStart);
      const tr = traceRay(S.surfs, r0.p, r0.d, L.lam);
      rays.push({ y0: y, tr: tr,
                  cross: tr.p ? axisCrossing(tr.p, tr.d) : NaN });
    }
    const tiny = traceRay(S.surfs, startRay(st, 1e-6, zStart).p,
                          startRay(st, 1e-6, zStart).d, L.lam);
    fans.push({ lam: L.lam, name: L.name, rays: rays,
                zPar: tiny.p ? axisCrossing(tiny.p, tiny.d) : NaN });
  }

  /* --- longitudinal spherical aberration against ray height --- */
  const lsa = [];
  const NL = 60;
  for (let i = 1; i <= NL; i++) {
    const h = st.semi * i / NL;
    const r0 = startRay(st, h, zStart);
    const tr = traceRay(S.surfs, r0.p, r0.d, st.lam);
    if (!tr.p) { lsa.push({ h: h, z: NaN, sa: NaN }); continue; }
    const z = axisCrossing(tr.p, tr.d);
    lsa.push({ h: h, z: z, sa: z - zPar });
  }
  /* The outermost ray that actually gets through.  Taking the outermost SLOT
     returns NaN as soon as the edge ray is vignetted -- which happens at any
     field angle -- and that NaN then reached a label as an em-dash where a
     magnification should have been. */
  let lsaMax = NaN, hEdge = NaN;
  for (const p2 of lsa) if (isFinite(p2.sa)) { lsaMax = p2.sa; hEdge = p2.h; }
  const vignetted = isFinite(hEdge) && hEdge < st.semi * 0.999;

  /* --- the spot: where do the rays land on the best-focus plane? --- */
  const spot = spotAt(S, st, zPar);
  const best = bestFocus(S, st, zPar);

  /* --- chromatic behaviour --- */
  const chrom = [];
  for (let i = 0; i <= 120; i++) {
    const lam = 0.42 + (0.72 - 0.42) * i / 120;
    let fs = NaN, fdo = NaN;
    if (inGlassRange(st.glass, lam)) fs = fAtLambda(st.glass, lam, st.fTarget);
    if (inGlassRange(st.glass1, lam) && inGlassRange(st.glass2, lam))
      fdo = fDoubletAt(lam, doubletRadii(st.bendR1, st.fTarget, st.glass1,
                                         st.glass2), st.glass1, st.glass2);
    chrom.push({ lam: lam, fs: fs, fd: fdo });
  }
  const Dq = doubletRadii(st.bendR1, st.fTarget, st.glass1, st.glass2);
  const a1 = abbeOf(st.glass1), a2 = abbeOf(st.glass2);
  const ach = {
    D: Dq, V1: a1.V, V2: a2.V, dV: a1.V - a2.V,
    fF: fDoubletAt(LAM_F, Dq, st.glass1, st.glass2),
    fC: fDoubletAt(LAM_C, Dq, st.glass1, st.glass2),
    fd: fDoubletAt(LAM_d, Dq, st.glass1, st.glass2),
    fg: fDoubletAt(LAM_g, Dq, st.glass1, st.glass2),
    est: secondarySpectrum(st.fTarget, st.glass1, st.glass2),
    sF: fAtLambda(st.glass, LAM_F, st.fTarget),
    sC: fAtLambda(st.glass, LAM_C, st.fTarget),
  };
  ach.resid = ach.fg - ach.fF;
  ach.singletSpread = ach.sF - ach.sC;

  /* --- every glass, for the Abbe diagram --- */
  const glasses = GLASSES.map(g => {
    const a = abbeOf(g);
    return { g: g, nd: a.nd, V: a.V, P: partialGF(g),
             ndCat: GLASS[g].nd, VCat: GLASS[g].Vd, kind: GLASS[g].kind };
  });

  if (!inGlassRange(st.glass, st.lam))
    warn.push(fmt(st.lam * 1000, 0) + ' nm is outside the '
              + fmt(GLASS[st.glass].rng[0] * 1000, 0) + '–'
              + fmt(GLASS[st.glass].rng[1] * 1000, 0) + ' nm range of '
              + st.glass);

  if (vignetted)
    warn.push('the edge of the aperture is vignetted: rays above '
              + fmt(hEdge, 2) + ' mm miss a surface, so the figures below are '
              + 'for the ' + fmt(hEdge, 2) + ' mm that get through');

  return { st: st, S: S, par: par, zPar: zPar, zStart: zStart,
           fans: fans, lsa: lsa, lsaMax: lsaMax, hEdge: hEdge,
           vignetted: vignetted, spot: spot, best: best,
           chrom: chrom, ach: ach, glasses: glasses, warn: warn };
}

/* RMS and full spread of the ray heights on a given plane. */
function spotAt(S, st, zPlane) {
  if (!isFinite(zPlane)) return { rms: NaN, max: NaN, n: 0 };
  const zStart = -Math.max(40, st.fTarget * 0.45);
  let s2 = 0, mx = 0, n = 0;
  const N = 41;
  for (let i = 0; i < N; i++) {
    const h = -st.semi + 2 * st.semi * i / (N - 1);
    if (Math.abs(h) < 1e-9) continue;
    const r0 = startRay(st, h, zStart);
    const tr = traceRay(S.surfs, r0.p, r0.d, st.lam);
    if (!tr.p) continue;
    const t = (zPlane - tr.p[1]) / tr.d[1];
    const y = tr.p[0] + t * tr.d[0];
    s2 += y * y; mx = Math.max(mx, Math.abs(y)); n++;
  }
  return n ? { rms: Math.sqrt(s2 / n), max: mx, n: n }
           : { rms: NaN, max: NaN, n: 0 };
}
/* The plane of least RMS spot -- NOT the paraxial focus, which is where a
   lens with spherical aberration is at its worst. */
function bestFocus(S, st, zPar) {
  if (!isFinite(zPar)) return { z: NaN, rms: NaN };
  const span = Math.max(1e-3, Math.abs(st.fTarget) * 0.09);
  let a = zPar - span, b = zPar + span;
  const f = z => spotAt(S, st, z).rms;
  /* golden-section on a unimodal RMS */
  const gr = (Math.sqrt(5) - 1) / 2;
  let c = b - gr * (b - a), d = a + gr * (b - a);
  let fc = f(c), fd = f(d);
  for (let i = 0; i < 70; i++) {
    if (!(isFinite(fc) && isFinite(fd))) break;
    if (fc < fd) { b = d; d = c; fd = fc; c = b - gr * (b - a); fc = f(c); }
    else { a = c; c = d; fc = fd; d = a + gr * (b - a); fd = f(d); }
  }
  const z = 0.5 * (a + b);
  return { z: z, rms: f(z) };
}

/* Wavelengths here are MICROMETRES; spectralCss takes NANOMETRES.  Same trap
   as down_conversion.html, same wrapper. */
function lineColour(lam, inten) { return spectralCss(lam * 1000, inten); }

/* ============================================================================
 *  readout, equation bar, canvas tag
 * ========================================================================== */
function row(lab, val, cls) {
  return '<tr><td>' + lab + '</td><td class="v' + (cls ? ' ' + cls : '') + '">'
       + val + '</td></tr>';
}
function hd(t) { return '<tr><td class="hd" colspan="2">' + t + '</td></tr>'; }
function mm(x, n) {
  return (x === null || !isFinite(x)) ? '—' : sg(x, n === undefined ? 5 : n)
         + ' mm';
}

function readoutHTML(M) {
  const st = M.st, S = M.S;
  const NAME = { singlet: 'a singlet', doublet: 'a cemented achromat',
                 mirror: 'a concave mirror' };
  const SUB = { singlet: st.glass + ', bent to q = ' + sg(st.shapeQ, 3),
                doublet: st.glass1 + ' + ' + st.glass2,
                mirror: st.conicK === 0 ? 'spherical'
                        : (st.conicK === -1 ? 'paraboloid'
                           : 'conic K = ' + sg(st.conicK, 3)) };
  let s = '<div class="rname">' + NAME[st.system]
        + '<small>' + SUB[st.system] + '</small></div><table>';

  if (S.kind === 'singlet') {
    s += hd('the surfaces');
    s += row('R₁', mm(S.R1, 6));
    s += row('R₂', mm(S.R2, 6));
    s += row('centre thickness', mm(st.thick, 4));
    s += row('edge thickness', mm(M.par.edge, 4),
             M.par.edge > 0 ? '' : 'bad');
    s += row('semi-aperture', mm(st.semi, 4));
    s += row('f-number', sg(st.fTarget / (2 * st.semi), 4));
    s += hd('the lens maker');
    s += row('n at the d line', sg(M.par.n, 7));
    s += row('thin-lens f', mm(M.par.fThin, 6));
    s += row('thick-lens f', mm(M.par.f, 6), 'good');
    s += row('the thickness term', mm(M.par.fThin - M.par.f, 3));
    s += row('front principal H', mm(M.par.H, 4));
    s += row('rear principal H′', mm(M.par.Hp, 4));
    s += row('back focal distance', mm(M.par.bfd, 6));
  } else if (S.kind === 'doublet') {
    const D = S.D;
    s += hd('the design');
    s += row('crown ' + st.glass1 + ' V', sg(D.V1, 5));
    s += row('flint ' + st.glass2 + ' V', sg(D.V2, 5));
    s += row('ΔV', sg(D.V1 - D.V2, 4));
    s += row('crown f₁', mm(D.f1, 5));
    s += row('flint f₂', mm(D.f2, 5));
    s += hd('the three radii');
    s += row('R₁ (bending)', mm(D.R1, 5));
    s += row('R₂ (cemented)', mm(D.R2, 5));
    s += row('R₃', mm(D.R3, 5));
  } else {
    s += hd('the mirror');
    s += row('radius', mm(-Math.abs(st.mirrorR), 5));
    s += row('f = R/2', mm(M.par.f, 5));
    s += row('conic constant K', sg(st.conicK, 4));
    s += row('semi-aperture', mm(st.semi, 4));
    s += row('f-number', sg(Math.abs(M.par.f) / (2 * st.semi), 4));
  }

  s += hd('where the light goes');
  s += row('paraxial focus', mm(M.zPar, 7));
  s += row('marginal focus', mm(isFinite(M.lsaMax) ? M.zPar + M.lsaMax : NaN, 7));
  s += row('longitudinal SA', mm(M.lsaMax, 4),
           Math.abs(M.lsaMax) < 0.02 ? 'good' : '');
  s += row('best-focus plane', mm(M.best.z, 7));
  s += row('RMS spot, paraxial', mm(M.spot.rms, 4));
  s += row('RMS spot, best focus', mm(M.best.rms, 4), 'good');
  s += row('improvement', isFinite(M.spot.rms / M.best.rms)
           ? '×' + sg(M.spot.rms / M.best.rms, 3) : '—');

  if (st.view === 'achrom' || st.system === 'doublet') {
    const A = M.ach;
    s += hd('colour');
    s += row('singlet f(F) − f(C)', mm(A.singletSpread, 4), 'bad');
    s += row('doublet f(F) − f(C)', mm(A.fF - A.fC, 3), 'good');
    s += row('residual f(g) − f(F)', mm(A.resid, 4));
    s += row('classic estimate', mm(A.est, 4));
    s += row('estimate / measured', sg(A.est / A.resid, 5));
  }
  s += '</table>';

  if (M.warn.length)
    s += '<div class="note"><b>note:</b> ' + M.warn.join('; ') + '.</div>';
  s += '<div class="note"><b>source:</b> Sellmeier coefficients from the '
     + 'SCHOTT Zemax catalog 2017-01-20b via refractiveindex.info. Every ray '
     + 'above is traced exactly — the paraxial formulas are checked against '
     + 'the trace, never used by it.</div>';
  return s;
}

function eqbarText(M) {
  const v = M.st.view;
  if (v === 'bench')
    return '<span class="lhs">n₁ sin θ₁</span> = n₂ sin θ₂, '
      + '<span class="hl">at every surface, exactly</span>'
      + '<span class="sm">One law, applied twice. Everything else on this page '
      + 'is a consequence of it — including all the ways it fails to make a '
      + 'point.</span>';
  if (v === 'maker')
    return '<span class="lhs">1/f</span> = (n − 1) [ 1/R₁ − 1/R₂ + '
      + '<span class="hl">(n − 1) d / (n R₁ R₂)</span> ]'
      + '<span class="sm">The highlighted term is the thickness. Dropping it is '
      + 'the "thin lens", and for the lens on screen it is worth a whole '
      + 'millimetre in a hundred.</span>';
  if (v === 'glass')
    return '<span class="lhs">V<sub>d</sub></span> = (n<sub>d</sub> − 1) / '
      + '(<span class="hl">n<sub>F</sub> − n<sub>C</sub></span>)'
      + '<span class="sm">One number for how much a glass bends light, one for '
      + 'how much it separates colours. Nearly every glass ever made lives in '
      + 'a narrow band of that plane.</span>';
  if (v === 'aberr')
    return '<span class="lhs">LSA</span> ∝ <span class="hl">h²</span> '
      + '&nbsp;&nbsp;— and the best focus is <em>not</em> the paraxial one'
      + '<span class="sm">A lens with spherical aberration is at its worst at '
      + 'the focus the textbook formula gives you.</span>';
  if (v === 'achrom')
    return '<span class="lhs">φ₁ + φ₂ = φ</span> &nbsp;and&nbsp; '
      + '<span class="hl">φ₁/V₁ + φ₂/V₂ = 0</span>'
      + '<span class="sm">Two equations, two unknowns, one exact solution — and '
      + 'a third colour that still misses, by an amount two glasses cannot '
      + 'fix.</span>';
  return '<span class="lhs">f</span> = R / 2, '
    + '<span class="hl">for every wavelength at once</span>'
    + '<span class="sm">A mirror has no dispersion, which is why every large '
    + 'telescope ever built has one at the bottom of it.</span>';
}

function tagText(M) {
  const T = { bench: '<b>the bench.</b> rays, traced exactly',
              maker: '<b>the lens maker.</b> where 1/f comes from',
              glass: '<b>the glass.</b> two numbers describe it',
              aberr: '<b>aberration.</b> what the paraxial formula hides',
              achrom: '<b>the achromat.</b> two glasses, two colours',
              mirror: '<b>the mirror.</b> no dispersion at all' };
  return T[M.st.view] + '<br>' + (M.st.system === 'singlet' ? M.st.glass
         : M.st.system === 'doublet' ? M.st.glass1 + ' + ' + M.st.glass2
         : 'mirror') + ', f = ' + sg(M.par.f, 5) + ' mm';
}

/* ============================================================================
 *  the optical layout, drawn to scale
 *
 *  Equal aspect throughout: a lens is a SHAPE, and the whole subject of the
 *  page is the difference between where rays actually go and where a formula
 *  says they go, so the axes must not be free to rescale independently.  The
 *  focal detail is shown in an inset with its magnification printed instead.
 * ========================================================================== */
function lensProfile(R, semi, zv, sign) {
  /* polyline of one surface, from -semi to +semi */
  const out = [];
  const N = 64;
  for (let i = 0; i <= N; i++) {
    const y = -semi + 2 * semi * i / N;
    const s = conicSag(R, 0, y);
    if (!isFinite(s)) return null;
    out.push([zv + s, y]);
  }
  return out;
}

function drawBench(ctx, W, H, M, S) {
  const st = M.st, SY = M.S;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'Everything here is at EQUAL SCALE — a lens is a shape, and the '
    + 'whole subject is where rays go against where a formula says they go, so '
    + 'the two axes are not free to rescale independently. '
    + (st.showLines
       ? 'The four colours are drawn on top of one another and are genuinely '
         + 'indistinguishable at this scale: they separate only within a '
         + 'millimetre or so of focus, which is what the inset is for. '
       : '')
    + 'The inset magnifies the focal region, and prints by how much.';
  const foot = (st.showLines
      ? 'Four Fraunhofer lines traced at once: g (436 nm, Hg), F (486 nm, H), '
        + 'd (588 nm, He), C (656 nm, H). Colours are real — wavelength → CIE '
        + 'XYZ → sRGB.'
      : 'One wavelength, ' + sg(st.lam * 1000, 4) + ' nm.')
    + '  ' + (st.objDist > 0 ? 'Object at ' + sg(st.objDist, 4) + ' mm.'
                             : 'Collimated input.');
  const L = stage(ctx, W, H, cap, foot, capW);

  const b = box(PLOT_L, L.top + 10, W - PLOT_L - PLOT_R,
                Math.max(90, L.plotH - 10));
  /* world extent: from the ray start to a little past the focus */
  const zLo = M.zStart, zHi = Math.max(M.zPar, SY.back) * 1.18 + 8;
  const yMax = st.semi * 1.35;
  /* Drag pans and the wheel zooms; both go through THIS mapping, so a frame
     that does not repaint after either is immediately visible as a picture
     that did not move. */
  const sc = Math.min(b.w / (zHi - zLo), b.h / (2 * yMax)) * S.zoom;
  /* EQUAL ASPECT costs vertical space: a 170 mm x 32 mm bench in a 1310 x 620
     box uses two fifths of the height and leaves the rest blank.  Frame the
     area the drawing actually occupies rather than the whole box, and let the
     inset have the space that frees. */
  const usedH = Math.min(b.h, 2 * yMax * sc);
  const bd = box(b.x, b.y + (b.h - usedH) / 2, b.w, usedH);
  const X = z => b.x + (z - zLo) * sc + (b.w - (zHi - zLo) * sc) / 2 + S.pan;
  const Y = y => bd.y + bd.h / 2 - y * sc;

  frame(ctx, bd, '#242a3a');
  clipTo(ctx, bd, () => {
    /* the axis */
    ctx.strokeStyle = '#2a3040'; ctx.lineWidth = 1;
    ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(b.x, Y(0)); ctx.lineTo(b.x1, Y(0)); ctx.stroke();
    ctx.setLineDash([]);
    drawElement(ctx, M, X, Y);
    /* the rays */
    for (const fan of M.fans) {
      const col = lineColour(fan.lam, 1);
      for (const r of fan.rays) {
        const pts = r.tr.pts.slice();
        if (r.tr.p) {
          /* continue past the last surface to just beyond the focus */
          const zEnd = zHi;
          const t = (zEnd - r.tr.p[1]) / r.tr.d[1];
          pts.push([r.tr.p[0] + t * r.tr.d[0], zEnd]);
        }
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const px = X(pts[i][1]), py = Y(pts[i][0]);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        /* Four fans follow almost the same path until they reach focus, so at
           high alpha the LAST one drawn hides the other three and the bundle
           reads as one colour.  Half alpha lets the overlap blend. */
        ctx.strokeStyle = r.tr.blocked ? rgba(C_DIM, 0.22) : rgba(col, 0.5);
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
    }
    /* the paraxial focus */
    if (st.showParaxial && isFinite(M.zPar)) {
      ctx.strokeStyle = rgba(C_CYAN, 0.85); ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(X(M.zPar), Y(0) - 16); ctx.lineTo(X(M.zPar), Y(0) + 16);
      ctx.stroke();
    }
    /* principal planes */
    if (st.showPrincipal && SY.kind === 'singlet') {
      /* H and H' can be a couple of millimetres apart on a thick lens, which
         is a few pixels here, so the labels go one above and one below rather
         than side by side -- they collided in the layout audit otherwise. */
      const HH = [[M.par.H, 'H', 1], [SY.back + M.par.Hp, 'H′', -1]];
      for (const [zz, lab, side] of HH) {
        ctx.strokeStyle = rgba(C_MAG, 0.7); ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(X(zz), Y(st.semi * 1.2)); ctx.lineTo(X(zz), Y(-st.semi * 1.2));
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = C_MAG; ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = side > 0 ? 'bottom' : 'top';
        ctx.fillText(lab, X(zz), Y(side * st.semi * 1.2) - side * 3);
      }
    }
  });
  /* the scale bar, and the inset */
  ctx.font = '10.5px -apple-system, sans-serif';
  ctx.fillStyle = C_DIM; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  const barMm = niceBar((b.w / sc) * 0.22);
  const bx = b.x + 12, by = bd.y1 - 12;
  ctx.strokeStyle = C_DIM; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + barMm * sc, by);
  ctx.stroke();
  ctx.fillText(sg(barMm, 3) + ' mm', bx, by - 4);

  /* the inset lives in whatever space the equal-aspect framing freed up,
     below the bench, and never in the top right where the readout floats */
  drawFocusInset(ctx, b, bd, M, st, sc);
  drawStage(ctx, W, H, L);
}
function niceBar(x) {
  const e = Math.pow(10, Math.floor(Math.log10(Math.max(1e-9, x))));
  const m = x / e;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * e;
}

/* The glass body, filled between its two surfaces. */
function drawElement(ctx, M, X, Y) {
  const st = M.st, SY = M.S;
  if (SY.kind === 'mirror') {
    const p = lensProfile(SY.surfs[0].R, st.semi, 0);
    if (!p) return;
    ctx.beginPath();
    for (let i = 0; i < p.length; i++) {
      const px = X(p[i][0]), py = Y(p[i][1]);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = '#9aa6c2'; ctx.lineWidth = 3; ctx.stroke();
    return;
  }
  const cols = ['rgb(34,44,68)', 'rgb(46,38,64)'];
  for (let k = 0; k < SY.surfs.length - 1; k++) {
    const a = lensProfile(SY.surfs[k].R, st.semi, SY.surfs[k].z);
    const c = lensProfile(SY.surfs[k + 1].R, st.semi, SY.surfs[k + 1].z);
    if (!a || !c) continue;
    ctx.beginPath();
    for (let i = 0; i < a.length; i++) {
      const px = X(a[i][0]), py = Y(a[i][1]);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    for (let i = c.length - 1; i >= 0; i--) ctx.lineTo(X(c[i][0]), Y(c[i][1]));
    ctx.closePath();
    ctx.fillStyle = cols[k % 2]; ctx.fill();
    ctx.strokeStyle = '#6f7fa6'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}

/* A magnified view of the focal region, with the factor printed.  Without it
   the whole subject of the page -- a fraction of a millimetre of aberration
   on a hundred-millimetre lens -- is a single pixel. */
function drawFocusInset(ctx, b, bd, M, st, mainScale) {
  if (!isFinite(M.zPar)) return;
  const below = b.y1 - bd.y1;          /* free space under the bench */
  const hh = Math.min(230, Math.max(bd.h * 0.5, below - 20));
  const ww = Math.min(b.w * 0.46, hh * 2.3);
  const sz = hh;
  if (hh < 60 || ww < 120) return;
  /* BOTTOM right.  The floating readout occupies the top right of the stage
     -- about 344 x 556 px -- so an inset placed there is not merely hard to
     read, it is completely hidden, which is what the display-list audit
     reported for six of these views. */
  const ib = box(b.x1 - ww - 12, b.y1 - hh - 6, ww, hh);
  const half = Math.max(1e-4, Math.abs(M.lsaMax) * 1.5 + st.semi * 0.02);
  const sc = ww / (2 * half);
  const X = z => ib.x + ww / 2 + (z - M.zPar) * sc;
  const Y = y => ib.y + hh / 2 - y * sc;
  ctx.fillStyle = 'rgb(7,9,14)';
  ctx.fillRect(ib.x, ib.y, ib.w, ib.h);
  clipTo(ctx, ib, () => {
    ctx.strokeStyle = '#2a3040'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(ib.x, Y(0)); ctx.lineTo(ib.x1, Y(0)); ctx.stroke();
    ctx.setLineDash([]);
    for (const fan of M.fans) {
      const col = lineColour(fan.lam, 1);
      for (const r of fan.rays) {
        if (!r.tr.p) continue;
        const p = r.tr.p, d = r.tr.d;
        const z0 = M.zPar - half * 1.6, z1 = M.zPar + half * 1.6;
        const t0 = (z0 - p[1]) / d[1], t1 = (z1 - p[1]) / d[1];
        ctx.beginPath();
        ctx.moveTo(X(z0), Y(p[0] + t0 * d[0]));
        ctx.lineTo(X(z1), Y(p[0] + t1 * d[0]));
        ctx.strokeStyle = rgba(col, 0.8); ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    ctx.strokeStyle = rgba(C_CYAN, 0.9); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(X(M.zPar), ib.y); ctx.lineTo(X(M.zPar), ib.y1);
    ctx.stroke();
    if (isFinite(M.best.z)) {
      ctx.strokeStyle = rgba(C_GREEN, 0.9); ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(X(M.best.z), ib.y); ctx.lineTo(X(M.best.z), ib.y1);
      ctx.stroke(); ctx.setLineDash([]);
    }
  });
  frame(ctx, ib, '#3a4256');
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  /* ABOVE the box: inside it, the label sat across the rays it is describing.
     The magnification is relative to the main panel and is printed rather
     than implied. */
  ctx.fillStyle = C_DIM;
  ctx.fillText('the focus, ×' + sg(sc / mainScale, 3) + ' — this box spans '
               + sg(2 * half, 3) + ' mm', ib.x, ib.y - 4);
  ctx.textAlign = 'right';
  ctx.fillStyle = C_CYAN; ctx.fillText('paraxial', ib.x1 - 76, ib.y - 4);
  ctx.fillStyle = C_GREEN; ctx.fillText('best focus', ib.x1, ib.y - 4);
}

/* ============================================================================
 *  view 2 -- the lens maker
 * ========================================================================== */
function drawMaker(ctx, W, H, M, S) {
  const st = M.st, SY = M.S;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = SY.kind === 'singlet'
    ? 'Left: the lens itself, with the two centres of curvature on the axis '
      + 'and the principal planes marked. Right: bending the lens at constant '
      + 'power leaves 1/f alone by construction and changes the spherical '
      + 'aberration by a factor of four.'
    : 'The lens maker\'s equation is a statement about ONE element. Switch to '
      + 'a singlet to see it; the doublet view shows the design instead.';
  const foot = 'Constant power means constant THICK-lens power: bending moves '
    + 'the sag of both surfaces, so a lens bent at constant thin-lens power '
    + 'quietly changes its focal length.';
  const L = stage(ctx, W, H, cap, foot, capW);
  const top = L.top + 16, hgt = Math.max(90, L.plotH - 16);
  const [bA, bB] = twoBoxes(W, top, hgt);

  /* ---- left: the element with its centres of curvature ---- */
  frame(ctx, bA, '#242a3a');
  if (SY.kind === 'singlet') {
    const R1 = SY.R1, R2 = SY.R2;
    /* The centres of curvature are a hundred millimetres away and the lens is
       six thick.  Nothing sensible fits both at one scale: equal aspect gives
       a 13 px element, and exaggerating the vertical turns it into a needle
       (both were tried).  So the frame is the LENS, at true shape, and each
       centre is indicated by an arrow running off the panel with its distance
       written on it. */
    const sagMax = Math.max(Math.abs(conicSag(R1, 0, st.semi) || 0),
                            Math.abs(conicSag(R2, 0, st.semi) || 0));
    const zHalf = (st.thick + 2 * sagMax) * 0.9 + st.semi * 0.55;
    const sc = Math.min(bA.w / (2 * zHalf), bA.h / (2.5 * st.semi));
    const cx = bA.x + bA.w / 2, cy = bA.y + bA.h / 2;
    const X = z => cx + (z - st.thick / 2) * sc, Y = y => cy - y * sc;
    clipTo(ctx, bA, () => {
      ctx.strokeStyle = '#2a3040'; ctx.lineWidth = 1; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(bA.x, cy); ctx.lineTo(bA.x1, cy); ctx.stroke();
      ctx.setLineDash([]);
      drawElement(ctx, M, X, Y);
      /* an arrow toward each centre of curvature, labelled with the radius */
      const cc = [[R1, 0, C_CYAN, 'C₁', 'R₁'], [R2, st.thick, C_ORANGE, 'C₂', 'R₂']];
      let ny = 0;
      for (const [R, zv, col, lab, rlab] of cc) {
        const yv = st.semi * 0.62;
        const zs = zv + conicSag(R, 0, yv);
        if (!isFinite(zs)) continue;
        const dir = isFinite(R) ? Math.sign(R) : 0;
        if (dir === 0) {
          ctx.fillStyle = col; ctx.font = '11px -apple-system, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText(rlab + ' = flat', X(zs), Y(yv) - 8);
          continue;
        }
        /* the line from the surface point toward its centre */
        const zc = zv + R;
        const L2 = Math.hypot(zc - zs, -yv);
        const ux = (zc - zs) / L2, uy = (0 - yv) / L2;
        const reach = (bA.w / 2) * 0.92 / sc;
        const zEnd = zs + ux * reach, yEnd = yv + uy * reach;
        ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1.2;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(X(zs), Y(yv)); ctx.lineTo(X(zEnd), Y(yEnd));
        ctx.stroke(); ctx.setLineDash([]);
        /* an arrowhead at the far end */
        const ax = X(zEnd), ay = Y(yEnd);
        const th2 = Math.atan2(-(uy * sc), ux * sc);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - 9 * Math.cos(th2 - 0.4), ay + 9 * Math.sin(th2 - 0.4));
        ctx.lineTo(ax - 9 * Math.cos(th2 + 0.4), ay + 9 * Math.sin(th2 + 0.4));
        ctx.closePath(); ctx.fillStyle = col; ctx.fill();
        ctx.fillStyle = col; ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = dir > 0 ? 'right' : 'left';
        ctx.textBaseline = 'bottom';
        ctx.fillText(lab + ', ' + sg(Math.abs(R), 5) + ' mm this way',
                     ax + (dir > 0 ? -12 : 12), ay - 6 - ny);
        ny += 14;
      }
      /* principal planes */
      const HH = [[M.par.H, 'H', 1], [st.thick + M.par.Hp, 'H′', -1]];
      for (const [zz, lab, side] of HH) {
        ctx.strokeStyle = rgba(C_MAG, 0.8); ctx.lineWidth = 1.2;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(X(zz), Y(st.semi * 1.15)); ctx.lineTo(X(zz), Y(-st.semi * 1.15));
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = C_MAG; ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = side > 0 ? 'bottom' : 'top';
        ctx.fillText(lab, X(zz), Y(side * st.semi * 1.15) - side * 3);
      }
    });
    ctx.font = 'italic 13px Georgia, serif'; ctx.fillStyle = '#aeb6c6';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('the element, at true shape', bA.x, bA.y - 6);
    ctx.font = '10.5px -apple-system, sans-serif'; ctx.fillStyle = C_DIM;
    ctx.textAlign = 'right';
    ctx.fillText('equal scale; the centres of curvature are off the panel',
                 bA.x1, bA.y - 6);
    legendBox(ctx, bA.x + 8, bA.y1 - 8,
      [[C_CYAN, 'toward C₁, centre of surface 1'],
       [C_ORANGE, 'toward C₂, centre of surface 2'],
       [C_MAG, 'principal planes H, H′']], { up: true });
  } else {
    caption(ctx, bA.x + 14, bA.y + 16,
      'The lens maker\'s equation describes a single element. This system has '
      + (SY.kind === 'mirror' ? 'a mirror, whose focal length is R/2 and needs '
         + 'no glass at all' : 'two cemented elements, and its design is set '
         + 'out in the achromat view')
      + '. Choose the singlet to see the equation at work.',
      bA.w - 28, C_TXT);
  }

  /* ---- right: aberration against bending ---- */
  if (SY.kind === 'singlet') {
    const qs = [], sas = [];
    const n = M.par.n;
    for (let i = 0; i <= 48; i++) {
      const q = -2 + 5 * i / 48;
      const r = radiiAtQ(q, st.fTarget, n, st.thick);
      const surfs = [{ z: 0, R: r[0], K: 0, semi: st.semi, n: st.glass },
                     { z: st.thick, R: r[1], K: 0, semi: st.semi, n: AIR }];
      const t1 = traceRay(surfs, [st.semi * 0.85, M.zStart], [0, 1], st.lam);
      const t0 = traceRay(surfs, [1e-6, M.zStart], [0, 1], st.lam);
      qs.push(q);
      sas.push((t1.p && t0.p)
               ? axisCrossing(t1.p, t1.d) - axisCrossing(t0.p, t0.d) : NaN);
    }
    const fin = sas.filter(isFinite);
    const lo = fin.length ? Math.min(...fin) : -1;
    const hi = fin.length ? Math.max(...fin, 0) : 1;
    const pad = 0.12 * (hi - lo || 1);
    axes(ctx, bB, -2, 3, lo - pad, hi + pad,
         { xlab: 'shape factor q = (R₂ + R₁)/(R₂ − R₁)',
           ylab: 'longitudinal SA  (mm)',
           title: 'bending at constant power',
           xfmt: t => sg(t, 3), yfmt: t => sg(t, 3) });
    clipTo(ctx, bB, () => {
      const Y0 = bB.y1 - bB.h * (0 - (lo - pad)) / ((hi + pad) - (lo - pad) || 1);
      ctx.strokeStyle = rgba(C_CYAN, 0.45); ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(bB.x, Y0); ctx.lineTo(bB.x1, Y0); ctx.stroke();
      ctx.setLineDash([]);
      polyline(ctx, bB, qs, sas, -2, 3, lo - pad, hi + pad, C_GREEN, 2);
      /* the current shape */
      const Xc = bB.x + bB.w * (clamp(st.shapeQ, -2, 3) + 2) / 5;
      ctx.strokeStyle = rgba(C_MAG, 0.8); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(Xc, bB.y); ctx.lineTo(Xc, bB.y1); ctx.stroke();
      /* the minimum */
      let bi = -1, bv = Infinity;
      for (let i = 0; i < sas.length; i++)
        if (isFinite(sas[i]) && Math.abs(sas[i]) < bv) { bv = Math.abs(sas[i]); bi = i; }
      if (bi >= 0) {
        const Xm = bB.x + bB.w * (qs[bi] + 2) / 5;
        const Ym = bB.y1 - bB.h * (sas[bi] - (lo - pad)) / ((hi + pad) - (lo - pad) || 1);
        ctx.beginPath(); ctx.arc(Xm, Ym, 4.5, 0, TAU);
        ctx.fillStyle = C_ORANGE; ctx.fill();
      }
    });
    legendBox(ctx, bB.x + 8, bB.y + 6,
      [[C_GREEN, 'traced SA at h = ' + sg(st.semi * 0.85, 3) + ' mm'],
       [C_ORANGE, 'least-aberration shape'],
       [C_MAG, 'this lens, q = ' + sg(st.shapeQ, 3)]]);
  } else {
    frame(ctx, bB, '#242a3a');
    caption(ctx, bB.x + 12, bB.y + 12,
      'Bending applies to a singlet. For the doublet the same freedom exists '
      + '— the front radius can be chosen without disturbing the colour '
      + 'correction at all — and it is the bending slider in the panel.',
      bB.w - 24, '#767e92');
  }
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 3 -- the glass
 * ========================================================================== */
function drawGlass(ctx, W, H, M, S) {
  const st = M.st;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'Left: the plane every optical designer works in. The vertical '
    + 'axis is how much a glass bends light; the horizontal is how little it '
    + 'separates colours — reversed, by convention, so that "good" is to the '
    + 'left. Right: the measured dispersion behind those two numbers, with the '
    + 'three Fraunhofer lines that define them marked.';
  const foot = 'Points are computed from the Sellmeier fit; the crosses are '
    + 'SCHOTT\'s own printed n_d and V_d. They agree to '
    + sg(worstCatalogue(M).n, 2) + ' in index and '
    + sg(worstCatalogue(M).v, 2) + ' in Abbe number, which is what confirms '
    + 'the spectral lines used here.';
  const L = stage(ctx, W, H, cap, foot, capW);
  const top = L.top + 16, hgt = Math.max(90, L.plotH - 16);
  /* The Abbe diagram carries a NAME beside every point, and the floating
     readout covers the top right of the stage, where the high-index low-V
     glasses land.  Flipping the labels to the other side of their markers is
     not enough -- the markers themselves are under the panel -- so the
     labelled scatter goes in the LEFT box and the unlabelled curves in the
     right one. */
  const [bB, bA] = twoBoxes(W, top, hgt);

  /* ---- right: n against wavelength ---- */
  const wlo = 350, whi = 900;
  let nlo = 9, nhi = 0;
  const curves = [];
  for (const G of M.glasses) {
    const xs = [], ys = [];
    for (let i = 0; i <= 220; i++) {
      const nm = wlo + (whi - wlo) * i / 220, lam = nm / 1000;
      if (!inGlassRange(G.g, lam)) { xs.push(nm); ys.push(NaN); continue; }
      const n = nGlass(G.g, lam);
      xs.push(nm); ys.push(n);
      nlo = Math.min(nlo, n); nhi = Math.max(nhi, n);
    }
    curves.push({ g: G.g, xs: xs, ys: ys });
  }
  const pad = 0.04 * (nhi - nlo || 1);
  axes(ctx, bA, wlo, whi, nlo - pad, nhi + pad,
       { xlab: 'wavelength  (nm)', ylab: 'refractive index',
         title: 'measured dispersion', xfmt: t => sg(t, 3),
         yfmt: t => sg(t, 4) });
  clipTo(ctx, bA, () => {
    for (const [lam, nm2] of [[LAM_F, 'F'], [LAM_d, 'd'], [LAM_C, 'C']]) {
      const X = bA.x + bA.w * (lam * 1000 - wlo) / (whi - wlo);
      ctx.strokeStyle = rgba(lineColour(lam, 1), 0.55); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(X, bA.y); ctx.lineTo(X, bA.y1); ctx.stroke();
      ctx.fillStyle = lineColour(lam, 1);
      ctx.font = 'italic 12px Georgia, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      /* at the BOTTOM: the top of this box is under the readout */
      ctx.fillText(nm2, X, bA.y1 - 4);
    }
    for (let i = 0; i < curves.length; i++) {
      const sel = curves[i].g === st.glass || curves[i].g === st.glass1
                  || curves[i].g === st.glass2;
      polyline(ctx, bA, curves[i].xs, curves[i].ys, wlo, whi,
               nlo - pad, nhi + pad,
               sel ? neonCss(i / (curves.length - 1))
                   : rgba(neonCss(i / (curves.length - 1)), 0.32),
               sel ? 2.2 : 1.2);
    }
  });
  legendBox(ctx, bA.x + 8, bA.y1 - 8,
