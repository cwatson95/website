    M.glasses.map((G, i) => [neonCss(i / (M.glasses.length - 1)),
                             G.g + '  (' + GLASS[G.g].kind + ')']),
    { up: true });

  /* ---- left: the Abbe diagram ---- */
  const Vs = M.glasses.map(G => G.V), Ns = M.glasses.map(G => G.nd);
  const vlo = Math.max(0, Math.min(...Vs) - 8), vhi = Math.max(...Vs) + 8;
  const ylo2 = Math.min(...Ns) - 0.05, yhi2 = Math.max(...Ns) + 0.05;
  /* the Abbe axis runs BACKWARDS by convention */
  axes(ctx, bB, vhi, vlo, ylo2, yhi2,
       { xlab: 'Abbe number V_d   (reversed, as the catalogues draw it)',
         ylab: 'n_d', title: 'the Abbe diagram',
         xfmt: t => sg(t, 3), yfmt: t => sg(t, 4) });
  clipTo(ctx, bB, () => {
    const PX = v => bB.x + bB.w * (v - vhi) / (vlo - vhi);
    const PY = n => bB.y1 - bB.h * (n - ylo2) / (yhi2 - ylo2);
    /* join the achromat pair */
    if (st.glass1 !== st.glass2) {
      const A = M.glasses.find(G => G.g === st.glass1);
      const B = M.glasses.find(G => G.g === st.glass2);
      if (A && B) {
        ctx.strokeStyle = rgba(C_MAG, 0.55); ctx.lineWidth = 1.4;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(PX(A.V), PY(A.nd)); ctx.lineTo(PX(B.V), PY(B.nd));
        ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (let i = 0; i < M.glasses.length; i++) {
      const G = M.glasses[i];
      const col = neonCss(i / (M.glasses.length - 1));
      /* the catalogue's own value, as a cross */
      ctx.strokeStyle = rgba(C_DIM, 0.9); ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(PX(G.VCat) - 5, PY(G.ndCat)); ctx.lineTo(PX(G.VCat) + 5, PY(G.ndCat));
      ctx.moveTo(PX(G.VCat), PY(G.ndCat) - 5); ctx.lineTo(PX(G.VCat), PY(G.ndCat) + 5);
      ctx.stroke();
      /* ours, as a filled disc */
      ctx.beginPath(); ctx.arc(PX(G.V), PY(G.nd), 5.5, 0, TAU);
      ctx.fillStyle = col; ctx.fill();
      ctx.fillStyle = C_TXT; ctx.font = '10.5px -apple-system, sans-serif';
      ctx.textBaseline = 'middle';
      /* Put the label on whichever side keeps it out of the floating readout,
         which covers the top right of the whole stage and not merely the
         corner of this box. */
      const roL = W - RO.w - 10;
      const wantLeft = PX(G.V) + 70 > roL && PY(G.nd) < RO.h;
      ctx.textAlign = wantLeft ? 'right' : 'left';
      ctx.fillText(G.g, PX(G.V) + (wantLeft ? -10 : 10), PY(G.nd));
    }
  });
  legendBox(ctx, bB.x + 8, bB.y + 6,
    [[C_DIM, 'cross: SCHOTT\'s printed n_d, V_d'],
     [C_GREEN, 'disc: computed from the Sellmeier fit'],
     [C_MAG, 'the pair in use']]);
  drawStage(ctx, W, H, L);
}
function worstCatalogue(M) {
  let n = 0, v = 0;
  for (const G of M.glasses) {
    n = Math.max(n, Math.abs(G.nd - G.ndCat));
    v = Math.max(v, Math.abs(G.V - G.VCat));
  }
  return { n: n, v: v };
}

/* ============================================================================
 *  view 4 -- aberration
 * ========================================================================== */
function drawAberr(ctx, W, H, M, S) {
  const st = M.st;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'Left: where each ray crosses the axis, against the height it '
    + 'entered at — the classical longitudinal aberration curve, plotted the '
    + 'way lens designers draw it, with ray height up the page. Right: the '
    + 'RMS spot against the plane you put the detector in.';
  const foot = 'The best focus is NOT the paraxial focus. Marked below, the '
    + 'two differ by ' + sg(Math.abs(M.best.z - M.zPar), 3) + ' mm and the '
    + 'spot by a factor of ' + sg(M.spot.rms / M.best.rms, 3) + '.';
  const L = stage(ctx, W, H, cap, foot, capW);
  const top = L.top + 16, hgt = Math.max(90, L.plotH - 16);
  const [bA, bB] = twoBoxes(W, top, hgt);

  /* ---- left: longitudinal aberration, h against dz ---- */
  const sas = M.lsa.filter(p => isFinite(p.sa)).map(p => p.sa);
  const lim = sas.length ? Math.max(1e-4, Math.max(...sas.map(Math.abs)) * 1.15)
                         : 1;
  axes(ctx, bA, -lim, lim, 0, st.semi,
       { xlab: 'axis crossing − paraxial focus   (mm)',
         ylab: 'ray height at the lens  (mm)',
         title: 'longitudinal spherical aberration',
         xfmt: t => sg(t, 3), yfmt: t => sg(t, 3) });
  clipTo(ctx, bA, () => {
    const X0 = bA.x + bA.w * (0 + lim) / (2 * lim);
    ctx.strokeStyle = rgba(C_CYAN, 0.6); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(X0, bA.y); ctx.lineTo(X0, bA.y1); ctx.stroke();
    pl(ctx, bA, M.lsa.filter(p => isFinite(p.sa)).map(p => [p.sa, p.h]),
       -lim, lim, 0, st.semi, C_GREEN, 2.2);
    /* the h^2 law through the outermost point */
    const last = M.lsa.filter(p => isFinite(p.sa)).slice(-1)[0];
    if (last) {
      const k = last.sa / (last.h * last.h);
      const q = [];
      for (let i = 0; i <= 40; i++) {
        const h = st.semi * i / 40;
        q.push([k * h * h, h]);
      }
      pl(ctx, bA, q, -lim, lim, 0, st.semi, C_ORANGE, 1.4, [5, 4]);
    }
    if (isFinite(M.best.z)) {
      const Xb = bA.x + bA.w * (M.best.z - M.zPar + lim) / (2 * lim);
      ctx.strokeStyle = rgba(C_MAG, 0.8); ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(Xb, bA.y); ctx.lineTo(Xb, bA.y1); ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  legendBox(ctx, bA.x + 8, bA.y + 6,
    [[C_GREEN, 'traced rays'], [C_ORANGE, 'a pure h² law through the edge ray'],
     [C_CYAN, 'paraxial focus'], [C_MAG, 'best focus']]);

  /* ---- right: RMS spot against focal plane ---- */
  const span = Math.max(1e-3, Math.abs(M.best.z - M.zPar) * 3
                        + Math.abs(M.lsaMax) * 1.2 + 0.05);
  const zs = [], rs = [];
  for (let i = 0; i <= 90; i++) {
    const z = M.zPar - span + 2 * span * i / 90;
    zs.push(z - M.zPar);
    rs.push(spotAt(M.S, st, z).rms);
  }
  const rfin = rs.filter(isFinite);
  const rhi = rfin.length ? Math.max(...rfin) * 1.1 : 1;
  axes(ctx, bB, -span, span, 0, rhi,
       { xlab: 'detector plane − paraxial focus   (mm)',
         ylab: 'RMS spot radius  (mm)', title: 'where to put the detector',
         xfmt: t => sg(t, 3), yfmt: t => sg(t, 3) });
  clipTo(ctx, bB, () => {
    polyline(ctx, bB, zs, rs, -span, span, 0, rhi, C_GREEN, 2.2);
    for (const [zz, col] of [[0, C_CYAN], [M.best.z - M.zPar, C_MAG]]) {
      const X = bB.x + bB.w * (zz + span) / (2 * span);
      ctx.strokeStyle = rgba(col, 0.8); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(X, bB.y); ctx.lineTo(X, bB.y1); ctx.stroke();
    }
    if (isFinite(M.best.rms)) {
      const X = bB.x + bB.w * (M.best.z - M.zPar + span) / (2 * span);
      const Y = bB.y1 - bB.h * M.best.rms / (rhi || 1);
      ctx.beginPath(); ctx.arc(X, Y, 4.5, 0, TAU);
      ctx.fillStyle = C_MAG; ctx.fill();
    }
  });
  legendBox(ctx, bB.x1 - 8, bB.y1 - 8,
    [[C_CYAN, 'paraxial focus: RMS ' + sg(M.spot.rms, 3) + ' mm'],
     [C_MAG, 'best focus: RMS ' + sg(M.best.rms, 3) + ' mm']],
    { right: true, up: true });
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 5 -- the achromat
 * ========================================================================== */
function drawAchrom(ctx, W, H, M, S) {
  const st = M.st, A = M.ach;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'Left: focal length against colour. A singlet\'s runs straight '
    + 'through the band; a doublet\'s comes back on itself, touching the same '
    + 'value at F and C exactly. Right: what is left over. The residual is not '
    + 'an imperfection of the solve — it is exact — but of there being only '
    + 'two glasses to satisfy three colours.';
  const foot = 'Design: φ₁ + φ₂ = 1/f and φ₁/V₁ + φ₂/V₂ = 0, solved in closed '
    + 'form. The bending R₁ is free and does not enter either equation, which '
    + 'is why it can be spent on spherical aberration instead.';
  const L = stage(ctx, W, H, cap, foot, capW);
  const top = L.top + 16, hgt = Math.max(90, L.plotH - 16);
  const [bA, bB] = twoBoxes(W, top, hgt);

  /* ---- left: f against wavelength ---- */
  const xs = M.chrom.map(c => c.lam * 1000);
  const fs = M.chrom.map(c => c.fs), fd = M.chrom.map(c => c.fd);
  const all = fs.concat(fd).filter(isFinite);
  const flo = Math.min(...all), fhi = Math.max(...all);
  const pad = 0.08 * (fhi - flo || 1);
  axes(ctx, bA, 420, 720, flo - pad, fhi + pad,
       { xlab: 'wavelength  (nm)', ylab: 'focal length  (mm)',
         title: 'focus against colour', xfmt: t => sg(t, 3),
         yfmt: t => sg(t, 5) });
  clipTo(ctx, bA, () => {
    for (const [lam, nm2] of [[LAM_g, 'g'], [LAM_F, 'F'], [LAM_d, 'd'],
                              [LAM_C, 'C']]) {
      const X = bA.x + bA.w * (lam * 1000 - 420) / 300;
      ctx.strokeStyle = rgba(lineColour(lam, 1), 0.4); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(X, bA.y); ctx.lineTo(X, bA.y1); ctx.stroke();
      ctx.fillStyle = lineColour(lam, 1);
      ctx.font = 'italic 12px Georgia, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(nm2, X, bA.y + 4);
    }
    polyline(ctx, bA, xs, fs, 420, 720, flo - pad, fhi + pad, C_ORANGE, 2.2);
    polyline(ctx, bA, xs, fd, 420, 720, flo - pad, fhi + pad, C_GREEN, 2.2);
  });
  legendBox(ctx, bA.x + 8, bA.y + bA.h * 0.42,
    [[C_ORANGE, 'singlet, ' + st.glass + ': spread '
                + sg(Math.abs(A.singletSpread), 3) + ' mm'],
     [C_GREEN, 'doublet ' + st.glass1 + ' + ' + st.glass2 + ': F and C exact']]);

  /* ---- right: the residual, magnified ---- */
  const fd2 = M.chrom.map(c => c.fd);
  const fin2 = fd2.filter(isFinite);
  if (fin2.length) {
    const lo2 = Math.min(...fin2), hi2 = Math.max(...fin2);
    const p2 = 0.12 * (hi2 - lo2 || 1e-3);
    axes(ctx, bB, 420, 720, lo2 - p2, hi2 + p2,
         { xlab: 'wavelength  (nm)', ylab: 'doublet focal length  (mm)',
           title: 'the secondary spectrum, magnified',
           xfmt: t => sg(t, 3), yfmt: t => sg(t, 7) });
    clipTo(ctx, bB, () => {
      const YY = v => bB.y1 - bB.h * (v - (lo2 - p2)) / ((hi2 + p2) - (lo2 - p2));
      ctx.strokeStyle = rgba(C_CYAN, 0.5); ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(bB.x, YY(A.fF)); ctx.lineTo(bB.x1, YY(A.fF));
      ctx.stroke(); ctx.setLineDash([]);
      polyline(ctx, bB, xs, fd2, 420, 720, lo2 - p2, hi2 + p2, C_GREEN, 2.2);
      for (const [lam, v, col] of [[LAM_F, A.fF, C_CYAN], [LAM_C, A.fC, C_CYAN],
                                   [LAM_d, A.fd, C_ORANGE],
                                   [LAM_g, A.fg, C_MAG]]) {
        const X = bB.x + bB.w * (lam * 1000 - 420) / 300;
        ctx.beginPath(); ctx.arc(X, YY(v), 4.5, 0, TAU);
        ctx.fillStyle = col; ctx.fill();
      }
    });
    legendBox(ctx, bB.x + 8, bB.y + 6,
      [[C_CYAN, 'F and C: identical, by construction'],
       [C_ORANGE, 'd: short by ' + sg(Math.abs(A.fd - A.fF), 3) + ' mm'],
       [C_MAG, 'g: long by ' + sg(Math.abs(A.resid), 3) + ' mm'],
       [C_DIM, 'classic estimate ' + sg(A.est, 3) + ' mm  ('
               + sg(100 * Math.abs(A.est / A.resid), 4) + '% of measured)']]);
  } else {
    frame(ctx, bB, '#242a3a');
    caption(ctx, bB.x + 12, bB.y + 12,
      'One of the two glasses does not cover this band, so there is no '
      + 'doublet curve to draw.', bB.w - 24, '#767e92');
  }
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  view 6 -- the mirror
 * ========================================================================== */
function drawMirror(ctx, W, H, M, S) {
  const st = M.st;
  const capW = Math.min(430, W - RO.w - 60);
  const cap = 'A mirror has no dispersion: every colour reflects at the same '
    + 'angle, so f = R/2 for all of them at once. What it does have is '
    + 'spherical aberration — unless the surface is a paraboloid, where the '
    + 'aberration is not small but exactly zero on axis.';
  const sagDiff = Math.abs(conicSag(-Math.abs(st.mirrorR), 0, st.semi)
                           - conicSag(-Math.abs(st.mirrorR), -1, st.semi));
  const foot = 'Both curves are traced through the same routine as the lenses; '
    + 'the only difference is that the direction is reflected instead of '
    + 'refracted. Conic constant K = 0 is a sphere, K = −1 a paraboloid. '
    + 'At f/' + sg(Math.abs(st.mirrorR) / (4 * st.semi), 3) + ' the two '
    + 'surfaces differ by ' + fmtExp(sagDiff, 2) + ' mm of sag, which is '
    + (sagDiff * 200 > 1
       ? 'just about visible on the left.'
       : 'FAR too little to see on the left — the two curves there lie on top '
         + 'of one another, and the difference only shows in the aberration '
         + 'plot beside it. Open the aperture to separate them.');
  const L = stage(ctx, W, H, cap, foot, capW);
  const top = L.top + 16, hgt = Math.max(90, L.plotH - 16);
  const [bA, bB] = twoBoxes(W, top, hgt);

  /* ---- left: the two surfaces and their rays ---- */
  const Rm = -Math.abs(st.mirrorR), semi = st.semi;
  const zLo = Rm / 2 * 1.25, zHi = Math.abs(conicSag(Rm, 0, semi)) + 14;
  const sc = Math.min(bA.w / (zHi - zLo), bA.h / (2.3 * semi));
  const X = z => bA.x + bA.w / 2 + (z - (zLo + zHi) / 2) * sc;
  const Y = y => bA.y + bA.h / 2 - y * sc;
  frame(ctx, bA, '#242a3a');
  clipTo(ctx, bA, () => {
    ctx.strokeStyle = '#2a3040'; ctx.lineWidth = 1; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(bA.x, Y(0)); ctx.lineTo(bA.x1, Y(0)); ctx.stroke();
    ctx.setLineDash([]);
    for (const [K, col, lw] of [[0, C_ORANGE, 2.4], [-1, C_GREEN, 2.4]]) {
      const surfs = [{ z: 0, R: Rm, K: K, semi: semi, mirror: true }];
      const prof = [];
      for (let i = 0; i <= 80; i++) {
        const y = -semi + 2 * semi * i / 80;
        const s = conicSag(Rm, K, y);
        if (isFinite(s)) prof.push([s, y]);
      }
      ctx.beginPath();
      for (let i = 0; i < prof.length; i++) {
        const px = X(prof[i][0]), py = Y(prof[i][1]);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
      /* the rays */
      for (let i = 0; i < 9; i++) {
        const y = -semi + 2 * semi * i / 8;
        if (Math.abs(y) < 1e-9) continue;
        const tr = traceRay(surfs, [y, -Math.abs(Rm)], [0, 1], st.lam);
        if (!tr.p) continue;
        const zc = axisCrossing(tr.p, tr.d);
        ctx.beginPath();
        ctx.moveTo(X(-Math.abs(Rm)), Y(y));
        ctx.lineTo(X(tr.p[1]), Y(tr.p[0]));
        ctx.lineTo(X(zc), Y(0));
        ctx.strokeStyle = rgba(col, 0.32); ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    ctx.strokeStyle = rgba(C_CYAN, 0.85); ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(X(Rm / 2), Y(0) - 14); ctx.lineTo(X(Rm / 2), Y(0) + 14);
    ctx.stroke();
  });
  ctx.font = 'italic 13px Georgia, serif'; ctx.fillStyle = '#aeb6c6';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('sphere against paraboloid', bA.x, bA.y - 6);
  legendBox(ctx, bA.x + 8, bA.y + 6,
    [[C_ORANGE, 'sphere, K = 0'], [C_GREEN, 'paraboloid, K = −1'],
     [C_CYAN, 'f = R/2 = ' + sg(Rm / 2, 5) + ' mm']]);

  /* ---- right: LSA against height for both ---- */
  const hs = [], sa0 = [], sa1 = [], law = [];
  for (let i = 1; i <= 70; i++) {
    const h = semi * i / 70;
    hs.push(h);
    for (const [K, arr] of [[0, sa0], [-1, sa1]]) {
      const surfs = [{ z: 0, R: Rm, K: K, semi: semi, mirror: true }];
      const tr = traceRay(surfs, [h, -Math.abs(Rm)], [0, 1], st.lam);
      arr.push(tr.p ? axisCrossing(tr.p, tr.d) - Rm / 2 : NaN);
    }
    law.push(-h * h / (4 * Rm));
  }
  const fin = sa0.concat(law).filter(isFinite);
  const hi = fin.length ? Math.max(...fin) * 1.15 : 1;
  axes(ctx, bB, 0, semi, Math.min(0, hi * -0.08), hi,
       { xlab: 'ray height  (mm)', ylab: 'axis crossing − R/2   (mm)',
         title: 'the aberration, and the h² law',
         xfmt: t => sg(t, 3), yfmt: t => sg(t, 3) });
  clipTo(ctx, bB, () => {
    polyline(ctx, bB, hs, sa0, 0, semi, Math.min(0, hi * -0.08), hi,
             C_ORANGE, 2.2);
    polyline(ctx, bB, hs, law, 0, semi, Math.min(0, hi * -0.08), hi,
             C_CYAN, 1.4, [5, 4]);
    polyline(ctx, bB, hs, sa1, 0, semi, Math.min(0, hi * -0.08), hi,
             C_GREEN, 2.4);
  });
  legendBox(ctx, bB.x + 8, bB.y + 6,
    [[C_ORANGE, 'sphere: ' + sg(sa0[sa0.length - 1], 3) + ' mm at the edge'],
     [C_CYAN, 'the leading law, −h²/(4R)'],
     [C_GREEN, 'paraboloid: ' + fmtExp(Math.abs(sa1[sa1.length - 1]) + 1e-300, 1)
               + ' mm — zero, to floating point']]);
  drawStage(ctx, W, H, L);
}

/* ============================================================================
 *  dispatch
 * ========================================================================== */
function drawView(ctx, W, H, M, S) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#070b18'; ctx.fillRect(0, 0, W, H);
  const v = M.st.view;
  if (v === 'bench') drawBench(ctx, W, H, M, S);
  else if (v === 'maker') drawMaker(ctx, W, H, M, S);
  else if (v === 'glass') drawGlass(ctx, W, H, M, S);
  else if (v === 'aberr') drawAberr(ctx, W, H, M, S);
  else if (v === 'achrom') drawAchrom(ctx, W, H, M, S);
  else drawMirror(ctx, W, H, M, S);
}

/* ------------------------------------------------------------------------ */
function makeScene(canvas) {
  const st = Object.assign({}, DEFAULTS);
  const cam = { W: 900, H: 600 };
  let M = null;
  const S = {
    st: st, cam: cam, zoom: 1, pan: 0,
    model() { if (!M) S.rebuild(); return M; },
    rebuild() { M = buildModel(st); },
    resetView() { S.zoom = 1; S.pan = 0; },
    orbit(dx) { S.pan += dx; },
    readout() { return readoutHTML(S.model()); },
    eqbar() { return eqbarText(S.model()); },
    tag() { return tagText(S.model()); },
    draw() { drawView(canvas.getContext('2d'), cam.W, cam.H, S.model(), S); },
  };
  return S;
}

/* ============================================================================
 *  the control panel and the frame loop
 * ========================================================================== */
const INFO = {
  bench:
    'Every ray on this page is traced the hard way: intersect the surface, '
    + 'take the normal, apply Snell\'s law in vector form, repeat. No paraxial '
    + 'approximation is used anywhere in the tracing — the famous formulas are '
    + 'checked <b>against</b> it, in the limit of a vanishingly low ray, rather '
    + 'than used by it. That is why the rays here do not all meet at a point: '
    + 'nothing in the calculation made them.',
  maker:
    'The lens maker\'s equation is what you get by applying refraction twice '
    + 'and then throwing away everything beyond first order in the ray height. '
    + 'It gives one number, 1/f, from two radii and an index. The thickness '
    + 'term is usually dropped and usually should not be: for the lens on '
    + 'screen it is worth a full millimetre in a hundred. What survives is the '
    + 'idea of <b>principal planes</b> — the two planes about which a thick '
    + 'lens behaves exactly like a thin one.',
  glass:
    'Two numbers describe an optical glass well enough to design with. '
    + '<b>n_d</b> is how much it bends light at a yellow helium line; '
    + '<b>V_d</b> is that bending divided by the difference between blue and '
    + 'red, so a big V means colours stay together. Crowns have high V, flints '
    + 'low. Every glass ever melted lies in a narrow diagonal band of that '
    + 'plane, and the whole craft of achromatic design is about finding pairs '
    + 'that are far apart along it.',
  aberr:
    'Spherical aberration is not a defect of manufacture. It is what a '
    + 'spherical surface <b>does</b>: outer rays are bent too much, and they '
    + 'cross the axis short. The amount grows as the square of the ray height, '
    + 'so it is the outermost zone of a lens that ruins the image, which is why '
    + 'stopping a lens down improves it so dramatically. The best place for the '
    + 'detector is not the paraxial focus but a little inside it, where the '
    + 'marginal and paraxial rays trade places.',
  achrom:
    'A single glass cannot focus two colours at the same place, because its '
    + 'power and its dispersion are locked together. Two glasses can: give one '
    + 'positive power and the other negative, in the ratio of their Abbe '
    + 'numbers, and the blue and red foci coincide <b>exactly</b>. What is left '
    + 'is the secondary spectrum — the third colour still misses, because the '
    + 'two glasses disagree about the <i>shape</i> of their dispersion as well '
    + 'as its size, and two free parameters cannot fix three constraints.',
  mirror:
    'A mirror sidesteps the entire problem. Reflection does not care about '
    + 'wavelength, so a mirror has no chromatic aberration of any kind and '
    + 'f = R/2 for every colour at once. That is why every large telescope has '
    + 'a mirror at the bottom of it. A spherical mirror still has spherical '
    + 'aberration — but a <b>paraboloid</b> has none at all on axis, exactly, '
    + 'because a parabola is defined as the curve that brings parallel rays to '
    + 'a point.',
};

function boot() {
  const canvas = document.getElementById('scene');
  const panel  = document.getElementById('panel');
  const tabsEl = document.getElementById('tabs');
  const roEl   = document.getElementById('readout');
  const eqEl   = document.getElementById('eqbar');
  const tagEl  = document.getElementById('tag');
  const hintEl = document.getElementById('hint');
  const errEl  = document.getElementById('errbox');
  const S = makeScene(canvas), st = S.st;

  function fail(e) { errEl.style.display = 'block';
                     errEl.textContent = String(e && e.stack || e); }
  window.addEventListener('error', ev => fail(ev.error || ev.message));

  VIEWS.forEach(([k, lab]) => {
    tabsEl.appendChild(h('button', { class: st.view === k ? 'active' : '',
      onclick: () => {
        st.view = k;
        [].forEach.call(tabsEl.children,
          (b, i) => b.className = VIEWS[i][0] === k ? 'active' : '');
        S.rebuild(); syncPanel(); refresh();
      } }, lab));
  });

  const rows = {};
  function slider(key, lab, lo, hi, step, fmtf) {
    const inp = h('input', { type: 'range', min: lo, max: hi, step: step,
                             value: st[key] });
    const val = h('span', { class: 'val' });
    const rowEl = h('div', { class: 'sliderrow' }, h('label', null, lab),
                    inp, val);
    const sync = () => { inp.value = st[key]; val.textContent = fmtf(st[key]); };
    inp.addEventListener('input', () => {
      st[key] = parseFloat(inp.value); val.textContent = fmtf(st[key]);
      S.rebuild(); syncPanel(); refresh();
    });
    rows[key] = { row: rowEl, sync: sync, inp: inp }; sync(); return rowEl;
  }
  function checkbox(key, lab) {
    const inp = h('input', { type: 'checkbox' }); inp.checked = st[key];
    inp.addEventListener('change', () => {
      st[key] = inp.checked; S.rebuild(); syncPanel(); refresh();
    });
    return h('label', null, inp, lab);
  }
  function chipRow(list, key, idf, namef, after) {
    const wrapEl = h('div', { class: 'chips' });
    list.forEach(o => {
      wrapEl.appendChild(h('button',
        { class: 'chip' + (st[key] === idf(o) ? ' on' : ''),
          onclick: () => {
            st[key] = idf(o);
            if (after) after(o);
            [].forEach.call(wrapEl.children, (b, i) =>
              b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));
            S.rebuild(); syncPanel(); refresh();
          } }, namef(o)));
    });
    wrapEl._sync = () => [].forEach.call(wrapEl.children, (b, i) =>
      b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));
    return wrapEl;
  }
  const chipRows = [];
  /* .grp and .grp h3 are what the stylesheet actually defines; two of the
     recent sims use 'group'/'gtitle', which match nothing. */
  function group(title) {
    const kids = [].slice.call(arguments, 1);
    const g = h('div', { class: 'grp' }, h('h3', null, title));
    for (const k of kids) if (k) g.appendChild(k);
    panel.appendChild(g); return g;
  }

  const presetChips = chipRow(PRESETS, '_preset', o => o.id, o => o.name,
                              o => { Object.assign(st, o.st); });
  chipRows.push(presetChips);
  const sysChips = chipRow(
    [{ k: 'singlet', n: 'singlet' }, { k: 'doublet', n: 'achromat' },
     { k: 'mirror', n: 'mirror' }], 'system', o => o.k, o => o.n);
  chipRows.push(sysChips);
  const glassChips = chipRow(GLASSES.map(g => ({ k: g })), 'glass',
                             o => o.k, o => o.k);
  chipRows.push(glassChips);
  const crownChips = chipRow(
    GLASSES.filter(g => GLASS[g].kind === 'crown').map(g => ({ k: g })),
    'glass1', o => o.k, o => o.k);
  chipRows.push(crownChips);
  const flintChips = chipRow(
    GLASSES.filter(g => GLASS[g].kind === 'flint').map(g => ({ k: g })),
    'glass2', o => o.k, o => o.k);
  chipRows.push(flintChips);

  group('a real design', presetChips);
  group('the system', sysChips);
  const gGlass = group('the glass', glassChips);
  const gPair = group('the achromat pair', crownChips, flintChips,
    slider('bendR1', 'front radius R₁', 25, 400, 0.5, v => sg(v, 4) + ' mm'));
  group('the lens',
    slider('fTarget', 'focal length', 40, 300, 1, v => sg(v, 4) + ' mm'),
    slider('shapeQ', 'bending q', -2, 3, 0.01, v => sg(v, 3)),
    slider('thick', 'centre thickness', 1, 20, 0.1, v => sg(v, 3) + ' mm'),
    slider('semi', 'semi-aperture', 2, 60, 0.5, v => sg(v, 3) + ' mm'));
  const gMirror = group('the mirror',
    slider('mirrorR', 'radius', 60, 600, 1, v => sg(v, 4) + ' mm'),
    slider('conicK', 'conic constant K', -2, 0.5, 0.01, v => sg(v, 3)));
  group('the light',
    slider('objDist', 'object distance', 0, 1200, 5,
           v => v > 0 ? sg(v, 4) + ' mm' : 'collimated'),
    slider('fieldDeg', 'field angle', 0, 6, 0.1, v => sg(v, 3) + '°'),
    slider('nRays', 'rays drawn', 3, 41, 2, v => String(v | 0)),
    slider('lam', 'wavelength', 0.40, 0.78, 0.001,
           v => sg(v * 1000, 4) + ' nm'),
    checkbox('showLines', ' trace g, F, d and C at once'),
    checkbox('showParaxial', ' mark the paraxial focus'),
    checkbox('showPrincipal', ' mark the principal planes'));

  const infoEl = h('div', { id: 'info' });
  panel.appendChild(infoEl);
  panel.appendChild(h('button', { class: 'chip', style: 'margin-top:10px',
    onclick: () => { Object.assign(st, DEFAULTS); S.resetView(); S.rebuild();
                     syncPanel(); refresh(); } }, 'reset all'));

  function syncPanel() {
    for (const k in rows) rows[k].sync();
    for (const c of chipRows) if (c._sync) c._sync();
    gGlass.hidden = st.system !== 'singlet';
    gPair.hidden = st.system !== 'doublet';
    gMirror.hidden = st.system !== 'mirror';
    rows.shapeQ.row.hidden = st.system !== 'singlet';
    rows.fTarget.row.hidden = st.system === 'mirror';
    rows.thick.row.hidden = st.system === 'mirror';
    infoEl.innerHTML = INFO[st.view] || '';
  }

  /* Nothing animates on its own, so every interaction must mark the canvas
     dirty or the picture silently fails to follow. */
  let dirty = true;
  function refresh() { dirty = true; }
  function frame() {
    if (dirty) {
      dirty = false;
      try {
        S.draw();
        roEl.innerHTML = S.readout();
        eqEl.innerHTML = S.eqbar();
        tagEl.innerHTML = S.tag();
      } catch (e) { fail(e); }
    }
    requestAnimationFrame(frame);
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    S.cam.W = Math.max(320, Math.round(r.width));
    S.cam.H = Math.max(240, Math.round(r.height));
    canvas.width = Math.round(S.cam.W * dpr);
    canvas.height = Math.round(S.cam.H * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    refresh();
  }
  window.addEventListener('resize', resize);

  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    drag = { x: e.clientX };
    canvas.classList.add('dragging');
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    S.orbit(e.clientX - drag.x);
    drag = { x: e.clientX };
    refresh();
  });
  canvas.addEventListener('pointerup', () => {
    drag = null; canvas.classList.remove('dragging');
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    S.zoom = clamp(S.zoom * (e.deltaY > 0 ? 0.92 : 1.087), 0.4, 12);
    refresh();
  }, { passive: false });
  window.addEventListener('keydown', e => {
    const i = VIEWS.findIndex(v => v[0] === st.view);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const j = (i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1))
                % VIEWS.length;
      st.view = VIEWS[j][0];
      [].forEach.call(tabsEl.children,
        (b, k) => b.className = VIEWS[k][0] === st.view ? 'active' : '');
      S.rebuild(); syncPanel(); refresh();
    } else if (e.key === 'r' || e.key === 'R') { S.resetView(); refresh(); }
  });

  hintEl.textContent = 'drag to pan · scroll to zoom · ←/→ views · R resets';
  syncPanel(); resize(); S.rebuild(); refresh(); frame();
}

/* ============================================================================
 *  selfTest -- runs when there is no document
 *
 *  Reference values tagged (scipy) were printed by build_lens/derive.py and
 *  copied from output read IN FULL.
 * ========================================================================== */
function selfTest() {
  let pass = 0, fail = 0;
  const bad = [];
  function ok(c, n) { if (c) pass++; else { fail++; bad.push(n); } }
  function close(a, b, tol, n) {
    if (isFinite(a) && isFinite(b) && Math.abs(a - b) <= tol) pass++;
    else { fail++; bad.push(n + '  (got ' + a + ', want ' + b + ')'); }
  }
  function rel(a, b, r, n) {
    if (isFinite(a) && isFinite(b)
        && Math.abs(a - b) <= r * Math.max(1e-300, Math.abs(b))) pass++;
    else { fail++; bad.push(n + '  (got ' + a + ', want ' + b + ')'); }
  }

  /* ---------- 1. the glasses, against the catalogue's own numbers ---------- */
  let wn = 0, wv = 0;
  for (const g of GLASSES) {
    const a = abbeOf(g);
    wn = Math.max(wn, Math.abs(a.nd - GLASS[g].nd));
    wv = Math.max(wv, Math.abs(a.V - GLASS[g].Vd));
  }
  close(wn, 0, 3e-5, 'every n_d matches SCHOTT (worst ' + wn.toExponential(2) + ')');
  close(wv, 0, 0.02, 'every V_d matches SCHOTT (worst ' + wv.toFixed(5) + ')');
  ok(wn > 1e-9, 'and they are COMPUTED, not the catalogue values echoed back');
  close(nGlass('N-BK7', LAM_d), 1.5168000345, 1e-9, 'n_d of N-BK7 (scipy)');
  close(abbeOf('N-BK7').V, 64.1673362375, 1e-8, 'V_d of N-BK7 (scipy)');
  close(abbeOf('F2').V, 36.3664912531, 1e-8, 'V_d of F2 (scipy)');
  close(partialGF('N-BK7'), 0.534930221629, 1e-10, 'P_gF of N-BK7 (scipy)');
  close(partialGF('F2'), 0.582791691172, 1e-10, 'P_gF of F2 (scipy)');
  /* the glass code IS n_d and V_d, to three and three digits */
  for (const g of GLASSES) {
    const a = abbeOf(g), code = GLASS[g].code;
    close(Math.round((a.nd - 1) * 1000), parseInt(code.slice(0, 3), 10), 0.51,
          'glass code encodes n_d for ' + g);
    close(Math.round(a.V * 10), parseInt(code.slice(3, 6), 10), 0.51,
          'glass code encodes V_d for ' + g);
  }
  ok(GLASS['N-BK7'].kind === 'crown' && GLASS['F2'].kind === 'flint',
     'crowns and flints are labelled');
  for (const g of GLASSES)
    ok((GLASS[g].kind === 'crown') === (abbeOf(g).V > 50),
       g + ' is on the right side of the crown/flint divide');

  /* ---------- 2. the lens maker, and the exact trace ---------- */
  const n = nGlass('N-BK7', LAM_d);
  close(fThin(n, 100, -100), 96.7492195474, 1e-8, 'thin-lens f (scipy)');
  close(fThick(n, 100, -100, 6), 97.748356271, 1e-8, 'thick-lens f (scipy)');
  close(principalFront(n, 100, -100, 6), 1.99827344716, 1e-9, 'H (scipy)');
  close(principalRear(n, 100, -100, 6), -1.99827344716, 1e-9, 'H prime (scipy)');
  close(backFocal(n, 100, -100, 6), 95.7500828238, 1e-8, 'back focal (scipy)');
  ok(fThin(n, 100, -100) < fThick(n, 100, -100, 6),
     'the thickness term is not negligible: it moves f by 1 mm in 100');
  /* a thin lens IS the thick formula at zero thickness */
  close(fThick(n, 100, -100, 0), fThin(n, 100, -100), 1e-12,
        'at zero thickness the two formulas coincide exactly');
  /* and a flat surface contributes nothing */
  close(fThin(n, Infinity, -100), 1 / ((n - 1) / 100), 1e-12,
        'an infinite radius drops out of the equation');

  const SUR = [{ z: 0, R: 100, K: 0, semi: 30, n: 'N-BK7' },
               { z: 6, R: -100, K: 0, semi: 30, n: AIR }];
  {
    const t = traceRay(SUR, [1e-6, -50], [0, 1], LAM_d);
    ok(!t.blocked, 'the paraxial probe ray gets through');
    close(axisCrossing(t.p, t.d) - 6, backFocal(n, 100, -100, 6), 1e-6,
          'the EXACT trace reproduces the paraxial formula in the limit');
  }
  close(axisCrossing(...(function () { const t = traceRay(SUR, [10, -50], [0, 1],
        LAM_d); return [t.p, t.d]; })()) - 6 - backFocal(n, 100, -100, 6),
        -1.62889833019, 1e-8, 'LSA at h = 10 mm (scipy)');
  {
    /* it must go as h^2 */
    const sa = hh => {
      const t = traceRay(SUR, [hh, -50], [0, 1], LAM_d);
      return axisCrossing(t.p, t.d) - 6 - backFocal(n, 100, -100, 6);
    };
    for (const h of [1, 2]) {
      const r = sa(2 * h) / sa(h);
      close(r, 4, 0.02, 'LSA quadruples when the ray height doubles (h=' + h + ')');
    }
    ok(sa(10) < 0, 'and it is NEGATIVE: outer rays cross short, always');
  }
  /* Snell itself, at one surface, against the scalar law */
  {
    const nrm = [0, -1];
    for (const ang of [5, 20, 40, 60]) {
      const th = ang * DEG;
      const d = refractVec([Math.sin(th), Math.cos(th)], nrm, 1, 1.5);
      const th2 = Math.atan2(d[0], d[1]);
      close(Math.sin(th), 1.5 * Math.sin(th2), 1e-14,
            'vector Snell obeys n1 sin th1 = n2 sin th2 at ' + ang + ' deg');
    }
    ok(refractVec([Math.sin(60 * DEG), Math.cos(60 * DEG)], nrm, 1.5, 1)
       === null, 'and it reports total internal reflection rather than NaN');
  }
  /* reflection is exact and angle-preserving */
  {
    const nrm = [0, -1];
    const d = reflectVec([0.3, 0.9], nrm);
    close(Math.hypot(d[0], d[1]), 1, 1e-15, 'reflection preserves length');
    close(d[1], -0.9 / Math.hypot(0.3, 0.9), 1e-15, 'and flips only the normal part');
  }

  /* ---------- 3. shape factor ---------- */
  for (const q of [-2, -0.5, 0, 0.5, 2]) {
    const r = radiiFromQ(q, 100, n);
    close(fThin(n, r[0], r[1]), 100, 1e-9, 'radiiFromQ gives f = 100 at q=' + q);
    close(shapeOf(r[0], r[1]), q, 1e-9, 'and recovers q = ' + q);
  }
  close(shapeOf(Infinity, -50), -1, 0, 'a flat front face is q = -1 exactly');
  close(shapeOf(50, Infinity), 1, 0, 'a flat rear face is q = +1 exactly');
  for (const q of [-1.5, 0, 1.5]) {
    const r = radiiAtQ(q, 100, n, 4);
    close(fThick(n, r[0], r[1], 4), 100, 1e-9,
          'radiiAtQ holds the THICK focal length at q=' + q);
  }
  {
    /* the least-aberration bending, and the plano-convex asymmetry */
    const sa = q => {
      const r = radiiAtQ(q, 100, n, 4);
      const S2 = [{ z: 0, R: r[0], K: 0, semi: 12, n: 'N-BK7' },
                  { z: 4, R: r[1], K: 0, semi: 12, n: AIR }];
      const a = traceRay(S2, [5, -60], [0, 1], LAM_d);
      const b = traceRay(S2, [1e-6, -60], [0, 1], LAM_d);
      if (!a.p || !b.p) return NaN;
      return axisCrossing(a.p, a.d) - axisCrossing(b.p, b.d);
    };
    close(sa(0), -0.397842827255, 1e-7, 'LSA of an equiconvex lens (scipy)');
    close(sa(1), -0.272984857821, 1e-7, 'LSA plano-convex, curved out (scipy)');
    close(sa(-1), -1.08130444703, 1e-7, 'LSA plano-convex, flat out (scipy)');
    rel(sa(-1) / sa(1), 3.9610, 2e-3,
        'turning a plano-convex lens round costs a factor of 3.96');
    /* the minimum, found rather than quoted */
    let bq = 0, bv = Infinity;
    for (let i = 0; i <= 200; i++) {
      const q = -1 + 3 * i / 200, v = Math.abs(sa(q));
      if (isFinite(v) && v < bv) { bv = v; bq = q; }
    }
    close(bq, 0.72756606723, 0.02, 'least-aberration shape q* (scipy)');
    ok(bv < Math.abs(sa(0)), 'and it really is better than equiconvex');
  }
  {
    /* a lens whose surfaces cross does not exist, and edgeThickness says so */
    const r = radiiAtQ(0, 100, n, 0.01);
    ok(edgeThickness(r[0], r[1], 0.01, 10) < 0,
       'a 0.01 mm lens at a 10 mm semi-aperture has a NEGATIVE edge');
    const S3 = [{ z: 0, R: r[0], K: 0, semi: 10, n: 'N-BK7' },
                { z: 0.01, R: r[1], K: 0, semi: 10, n: AIR }];
    ok(traceRay(S3, [10, -60], [0, 1], LAM_d).blocked,
       'and tracing it correctly blocks the ray rather than inventing one');
    ok(edgeThickness(radiiAtQ(0, 100, n, 6)[0], radiiAtQ(0, 100, n, 6)[1], 6, 10)
       > 0, 'a 6 mm one is a real lens');
  }

  /* ---------- 4. the achromat ---------- */
  {
    const D = doubletRadii(60, 100, 'N-BK7', 'F2');
    close(D.p1 + D.p2, 0.01, 1e-15, 'the two powers sum to 1/f exactly');
    close(D.p1 / D.V1 + D.p2 / D.V2, 0, 1e-18,
          'the achromatic condition is satisfied exactly');
    close(D.p1, 0.0230810740729, 1e-13, 'crown power (scipy)');
    close(D.p2, -0.0130810740729, 1e-13, 'flint power (scipy)');
    close(D.f1, 43.3255400872, 1e-8, 'crown focal length (scipy)');
    close(D.f2, -76.4463219478, 1e-8, 'flint focal length (scipy)');
    ok(D.p1 > 0 && D.p2 < 0, 'the crown is positive and the flint negative');
    /* the radii really do deliver those powers */
    const nd1 = nGlass('N-BK7', LAM_d), nd2 = nGlass('F2', LAM_d);
    close((nd1 - 1) * (invR(D.R1) - invR(D.R2)), D.p1, 1e-14,
          'the crown radii give the crown power');
    close((nd2 - 1) * (invR(D.R2) - invR(D.R3)), D.p2, 1e-14,
          'the flint radii give the flint power');
    /* F and C coincide */
    const fF = fDoubletAt(LAM_F, D, 'N-BK7', 'F2');
    const fC = fDoubletAt(LAM_C, D, 'N-BK7', 'F2');
    close(fF - fC, 0, 1e-11, 'F and C land at the SAME focus, exactly');
    close(fDoubletAt(LAM_d, D, 'N-BK7', 'F2'), 100, 1e-11,
          'and the d line is at the target focal length');
    /* the residual, and the classic estimate for it */
    const fg = fDoubletAt(LAM_g, D, 'N-BK7', 'F2');
    close(fg - fF, 0.172627727811, 1e-9, 'secondary spectrum, measured (scipy)');
    close(secondarySpectrum(100, 'N-BK7', 'F2'), -0.172158326736, 1e-9,
          'the classic estimate (scipy)');
    rel(Math.abs(secondarySpectrum(100, 'N-BK7', 'F2')), Math.abs(fg - fF),
        4e-3, 'and the estimate matches the measurement to 0.3%');
    /* the residual is NOT zero: two glasses cannot fix three colours */
    ok(Math.abs(fg - fF) > 0.1, 'the residual is real, not a rounding error');
    /* A doublet of two IDENTICAL glasses cannot be achromatised at any
       power: the solve divides by V1 - V2.  Reported, not turned into an
       infinity that then propagates into every radius. */
    ok(!achromatPossible('N-BK7', 'N-BK7'),
       'one glass cannot achromatise itself');
    ok(achromatPossible('N-BK7', 'F2'), 'a crown and a flint can');
    ok(doubletRadii(60, 100, 'N-BK7', 'N-BK7').impossible === true,
       'and the design routine says so rather than returning an infinity');
  }
  {
    /* the singlet shorthand -f/V, and the exact ratio it is off by */
    const dfs = fAtLambda('N-BK7', LAM_F, 100) - fAtLambda('N-BK7', LAM_C, 100);
    close(dfs, -1.54921682832, 1e-9, 'singlet f(F) - f(C) (scipy)');
    const V = abbeOf('N-BK7').V;
    const nF = nGlass('N-BK7', LAM_F), nC = nGlass('N-BK7', LAM_C);
    const nd0 = nGlass('N-BK7', LAM_d);
    close(dfs / (-100 / V), (nd0 - 1) * (nd0 - 1) / ((nF - 1) * (nC - 1)), 1e-13,
          '-f/V is off by exactly (n_d-1)^2/((n_F-1)(n_C-1))');
    close(dfs / (-100 / V), 0.994091171276, 1e-10, 'which is 0.9941 (scipy)');
    ok(Math.abs(dfs / (-100 / V) - 1) > 1e-3,
       'so the shorthand is a shorthand, not an identity');
  }

  /* ---------- 5. the mirror ---------- */
  {
    const MS = K => [{ z: 0, R: -200, K: K, semi: 70, mirror: true }];
    const cross = (K, hh) => {
      const t = traceRay(MS(K), [hh, -240], [0, 1], LAM_d);
      return t.p ? axisCrossing(t.p, t.d) : NaN;
    };
    close(cross(0, 1e-5), -100, 1e-6, 'f = R/2, reproduced by an exact trace');
    close(cross(-1, 1e-5), -100, 1e-9, 'the paraboloid agrees at the vertex');
    for (const hh of [10, 40, 60])
      close(cross(-1, hh), -100, 1e-9,
            'the paraboloid has ZERO spherical aberration at h = ' + hh);
    close(cross(0, 60) - (-100), 4.82848367219, 1e-7,
          'the sphere at h = 60 mm (scipy)');
    ok(cross(0, 60) > cross(0, 10), 'and the sphere gets worse outward');
    /* the leading law is -h^2/(4R), fitted rather than remembered */
    for (const hh of [2, 4, 8]) {
      const lsa = cross(0, hh) - (-100);
      rel(lsa, -hh * hh / (4 * -200), 3e-3,
          'the sphere follows -h^2/(4R) at h = ' + hh);
    }
    /* a mirror is achromatic: every wavelength gives the same focus */
    const a = traceRay(MS(0), [20, -240], [0, 1], 0.45);
    const b = traceRay(MS(0), [20, -240], [0, 1], 0.70);
    close(axisCrossing(a.p, a.d), axisCrossing(b.p, b.d), 0,
          'a mirror focuses every colour at EXACTLY the same place');
  }

  /* ---------- 6. conic sag and the surface routines ---------- */
  close(conicSag(100, 0, 0), 0, 0, 'the sag is zero at the vertex');
  close(conicSag(100, 0, 10), 100 - Math.sqrt(100 * 100 - 100), 1e-12,
        'a spherical sag is R - sqrt(R^2 - h^2)');
  close(conicSag(100, -1, 10), 100 / (100 * 2) * 1 * 1 * 0 + 10 * 10 / (2 * 100),
        1e-12, 'a parabolic sag is exactly h^2/(2R)');
  ok(!isFinite(conicSag(10, 0, 20)), 'a sphere has no sag beyond its radius');
  close(conicSag(Infinity, 0, 10), 0, 0, 'a plane has no sag anywhere');
  {
    /* the Newton intersection must land ON the surface */
    let worst = 0;
    for (const R of [50, -50, 200, Infinity])
      for (const K of [0, -1, -0.5])
        for (const hh of [1, 5, 15]) {
          const q = hitSurface([hh, -60], [0, 1], 3, R, K, 40);
          if (!q) continue;
          const s = conicSag(R, K, q[0]);
          if (isFinite(s)) worst = Math.max(worst, Math.abs(q[1] - (3 + s)));
        }
    close(worst, 0, 1e-11, 'every intersection lands on its surface (1e-11)');
  }
  ok(hitSurface([50, -60], [0, 1], 0, 100, 0, 12) === null,
     'a ray outside the clear aperture is blocked');

  /* ---------- 7. the model, off built models ---------- */
  {
    const M = buildModel(Object.assign({}, DEFAULTS));
    close(M.par.f, fThick(n, M.S.R1, M.S.R2, 6), 1e-12,
          'model: f agrees with the lens maker');
    ok(M.par.edge > 0, 'model: the default lens exists');
    ok(M.fans.length === 4, 'model: four Fraunhofer lines are traced');
    ok(M.best.z < M.zPar, 'model: the best focus is INSIDE the paraxial focus');
    ok(M.best.rms < M.spot.rms,
       'model: and the spot there really is smaller');
    ok(M.lsaMax < 0, 'model: the singlet undercorrects, as a singlet must');
    /* the four colours do NOT focus together */
    const zs = M.fans.map(f => f.zPar);
    ok(Math.max(...zs) - Math.min(...zs) > 0.5,
       'model: the four colours are spread over more than half a millimetre');
  }
  {
    const M = buildModel(Object.assign({}, DEFAULTS, { system: 'doublet' }));
    const zs = M.fans.map(f => f.zPar);
    const sing = buildModel(Object.assign({}, DEFAULTS));
    const zsS = sing.fans.map(f => f.zPar);
    ok(Math.max(...zs) - Math.min(...zs)
       < 0.35 * (Math.max(...zsS) - Math.min(...zsS)),
       'model: the doublet gathers the colours far more tightly than a singlet');
    close(M.ach.fF - M.ach.fC, 0, 1e-11, 'model: F and C coincide');
  }
  {
    const M = buildModel(Object.assign({}, DEFAULTS,
      { system: 'mirror', conicK: -1, semi: 40 }));
    close(M.lsaMax, 0, 1e-8,
          'model: a parabolic mirror has no spherical aberration at all');
    const Ms = buildModel(Object.assign({}, DEFAULTS,
      { system: 'mirror', conicK: 0, semi: 40 }));
    ok(Math.abs(Ms.lsaMax) > 1e-3,
       'model: a spherical one does');
  }

  /* ---------- 8. nothing produces NaN anywhere ---------- */
  {
    let built = 0, panels = 0;
    for (const sys of ['singlet', 'doublet', 'mirror'])
      for (const [vk] of VIEWS)
        for (const q of [-2, 0, 3])
          for (const semi of [2, 12, 40])
            for (const th of [1, 6, 20]) {
              const st = Object.assign({}, DEFAULTS, { system: sys, view: vk,
                shapeQ: q, semi: semi, thick: th });
              let M;
              try { M = buildModel(st); }
              catch (e) {
                fail++; bad.push('buildModel threw: ' + sys + '/' + vk + '/'
                                 + q + '/' + semi + ' — ' + e.message);
                continue;
              }
              built++;
              for (const v of [M.par.f, M.zPar])
                if (!isFinite(v)) {
                  fail++; bad.push('non-finite in model ' + sys + '/' + vk);
                  break;
                }
              const html = readoutHTML(M) + eqbarText(M) + tagText(M);
              panels++;
              if (/NaN|undefined|Infinity/.test(html)) {
                fail++;
                bad.push('panel text carries NaN/undefined: ' + sys + '/' + vk
                         + '/' + q + '/' + semi + '/' + th);
              }
            }
    ok(built === 3 * VIEWS.length * 27, 'every combination built (' + built + ')');
    ok(panels === built, 'every combination produced panel text');
  }
  {
    /* every glass, every wavelength the slider reaches */
    let bad2 = 0;
    for (const g of GLASSES)
      for (let nm = 400; nm <= 780; nm += 10) {
        try {
          const v = nGlass(g, nm / 1000);
          if (!(v > 1 && v < 3)) bad2++;
        } catch (e) { bad2++; }
      }
    ok(bad2 === 0, 'every glass has a sane index across the whole slider range');
  }

  const total = pass + fail;
  console.log(pass + ' passed, ' + fail + ' failed  (of ' + total + ')');
  for (const b of bad) console.log('   FAILED: ' + b);
  return fail;
}

/* ============================== entry ============================= */
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
} else {
  /* THROW on failure: a harness that cannot fail the process is not a
     harness, and the mutation runner decides "caught" from the exit code. */
  if (selfTest() > 0) throw new Error('selfTest: assertions failed');
}
</script>
</body>
</html>
