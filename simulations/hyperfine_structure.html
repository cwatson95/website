/* ================================================================== *
 *  the vectors: J and I about F at weak field, each about B at strong *
 * ================================================================== */
function arrow3(ctx,C,a,b,col,lw){
  const p=C.P(a), q=C.P(b); if(!p||!q) return;
  arrowPx(ctx,p.x,p.y,q.x,q.y,col,lw||2);
}
function cone3(ctx,C,axis,len,cosT,col){
  /* the circle a vector of length len sweeps at angle acos(cosT) about the unit axis */
  const ax=v3.norm(axis), e1=v3.norm(Math.abs(ax[2])<0.9?v3.cross(ax,[0,0,1]):v3.cross(ax,[1,0,0])), e2=v3.cross(ax,e1);
  const s=Math.sqrt(Math.max(0,1-cosT*cosT)), c0=v3.mul(ax,len*cosT), pts=[];
  for(let i=0;i<=48;i++){ const t=TAU*i/48; pts.push(v3.add(c0,v3.add(v3.mul(e1,len*s*Math.cos(t)),v3.mul(e2,len*s*Math.sin(t))))); }
  poly3(ctx,C,pts,col,0.8,[3,3],true);
}
function onCone(axis,len,cosT,phi){
  const ax=v3.norm(axis), e1=v3.norm(Math.abs(ax[2])<0.9?v3.cross(ax,[0,0,1]):v3.cross(ax,[1,0,0])), e2=v3.cross(ax,e1);
  const s=Math.sqrt(Math.max(0,1-cosT*cosT));
  return v3.add(v3.mul(ax,len*cosT),v3.add(v3.mul(e1,len*s*Math.cos(phi)),v3.mul(e2,len*s*Math.sin(phi))));
}
/* the two limiting pictures as geometry (lengths sqrt(j(j+1)), cones from the projections), at time t */
function vecPictures(V,t){
  const Jl=V.lenJ, Il=V.lenI, Fl=V.lenF, p=V.pick, J=V.lv.J, I=V.iso.I;
  /* weak field: F about B, J about F (I = F - J closes the triangle) */
  const cF=Fl>0?p.mF/Fl:1, cJF=Fl>0?(p.F*(p.F+1)+J*(J+1)-I*(I+1))/(2*Fl*Jl):1;
  const F=onCone([0,0,1],Fl,cF,0.35*t), Jv=Fl>0?onCone(F,Jl,clamp(cJF,-1,1),2.2*t):onCone([0,0,1],Jl,1,0);
  const weak={F,J:Jv,I:v3.sub(F,Jv),cF,cJF};
  /* strong field: J and I each about B, J fast and I slow (the time is not to scale) */
  const cJ=V.mJ/Jl, cI=Il>0?V.mI/Il:1;
  const strong={J:onCone([0,0,1],Jl,cJ,1.6*t),I:Il>0?onCone([0,0,1],Il,cI,0.25*t):[0,0,0],cJ,cI};
  return {weak,strong};
}
function drawVectors(ctx,W,H,M){
  const V=M.vec, st=M.st;
  if(V.none){ const b=box(66,stageTop()+44,(isNarrow(W)?W-26:W-RO_W-44)-66,H-200); frame(ctx,b,'#242a3a');
    lab(ctx,W,H,b.x+b.w/2,b.y+b.h/2,'nothing couples here: '+(V.lv.status==='I0'?'the nucleus has no spin':V.lv.status==='J0'?'J = 0':!isFinite(V.lv.gJ)?'gJ not known':'the hyperfine constant is not known'),COL.ref,V_FONT,'center','middle'); return; }
  const cap='Left, a weak field: J and I are locked into F, which turns slowly about B (the vector model of the Zeeman effect). Right, a strong field: J and I each turn about B on their own (Paschen–Back). The state is |F = '+jStr(V.pick.F)+', mF = '+jStr(V.pick.mF)
    +'⟩ at weak field, which becomes |mJ = '+jStr(V.mJ)+', mI = '+jStr(V.mI)+'⟩ at strong. Below, its exact ⟨Jz⟩ and ⟨Iz⟩ (an eigenvector of the full Hamiltonian) carry it from one picture to the other. Lengths are √(j(j+1)); the turning is not to time scale.';
  const L=fitCaption(ctx,W,H,cap,'The vector model at weak and strong field, and the exact projections between.',Math.min(W-148,(isNarrow(W)?W-26:W-RO_W-44)-56),stageTop()+300);
  const left=56, right=isNarrow(W)?W-26:W-RO_W-44, top=stageTop()+30, bot=L.capY-28;
  const hTop=(bot-top)*0.56, gap=26;
  const bl=box(left,top+16,(right-left-gap)/2,hTop-16), br=box(left+(right-left+gap)/2,top+16,(right-left-gap)/2,hTop-16);
  const t=SIM.t, P=vecPictures(V,t);
  const R=Math.max(V.lenF,V.lenJ+V.lenI,1.2)*1.1;
  for(const [b,which] of [[bl,'weak'],[br,'strong']]){
    frame(ctx,b,'#1e2433');
    const C=boxCamera(b,st.camTheta,st.camPhi,R*2.3,[0,0,R*0.18]);
    HIT.push({kind:'cam',b});
    /* the field axis (kept below the panel's title line) */
    arrow3(ctx,C,[0,0,-R*0.5],[0,0,R*0.78],'#6f7789',1);
    const tip=C.P([0,0,R*0.8]); if(tip) lab(ctx,W,H,tip.x+6,Math.max(tip.y,b.y+30),'B',COL.dim,'italic 12px Georgia, serif','left','middle');
    if(which==='weak'){
      const w=P.weak;
      cone3(ctx,C,[0,0,1],V.lenF,w.cF,rgba(COL.live,0.5));
      cone3(ctx,C,w.F,V.lenJ,w.cJF,rgba(COL.pos,0.45));
      arrow3(ctx,C,[0,0,0],w.F,COL.live,2.4); arrow3(ctx,C,[0,0,0],w.J,COL.pos,2); arrow3(ctx,C,w.J,w.F,COL.ref,2);
      const q=C.P(w.F), qj=C.P(w.J), qi=C.P(v3.add(w.J,v3.mul(w.I,0.5)));
      if(q) lab(ctx,W,H,q.x+6,q.y-4,'F',COL.live,'italic bold 13px Georgia, serif','left','middle');
      if(qj) lab(ctx,W,H,qj.x-6,qj.y,'J',COL.pos,'italic bold 13px Georgia, serif','right','middle');
      if(qi&&V.lenI>0) lab(ctx,W,H,qi.x+7,qi.y,'I',COL.ref,'italic bold 13px Georgia, serif','left','middle');
      lab(ctx,W,H,b.x+8,b.y+12,'weak field: |F = '+jStr(V.pick.F)+', mF = '+jStr(V.pick.mF)+'⟩',COL.text,'italic 12px Georgia, serif','left','middle');
    } else {
      const s=P.strong;
      cone3(ctx,C,[0,0,1],V.lenJ,s.cJ,rgba(COL.pos,0.45)); if(V.lenI>0) cone3(ctx,C,[0,0,1],V.lenI,s.cI,rgba(COL.ref,0.45));
      arrow3(ctx,C,[0,0,0],s.J,COL.pos,2); if(V.lenI>0) arrow3(ctx,C,[0,0,0],s.I,COL.ref,2);
      const qj=C.P(s.J), qi=C.P(s.I);
      if(qj) lab(ctx,W,H,qj.x+6,qj.y,'J',COL.pos,'italic bold 13px Georgia, serif','left','middle');
      if(qi&&V.lenI>0) lab(ctx,W,H,qi.x+6,qi.y,'I',COL.ref,'italic bold 13px Georgia, serif','left','middle');
      lab(ctx,W,H,b.x+8,b.y+12,'strong field: |mJ = '+jStr(V.mJ)+', mI = '+jStr(V.mI)+'⟩',COL.text,'italic 12px Georgia, serif','left','middle');
    }
  }
  /* the exact projections against the field, on a log axis, with the two limits dashed */
  const bb=box(left+18,top+hTop+34,right-left-18-60,bot-(top+hTop+34)-26);
  const l0=Math.log10(V.Bs[0]), l1=Math.log10(V.Bs[V.Bs.length-1]);
  /* the y range: the two curves and their four limits, with a margin, and never narrower than 1 */
  const vals=V.jz.concat(V.iz,[V.jzWeak,V.izWeak,V.mJ,V.mI]);
  let vlo=Math.min(...vals), vhi=Math.max(...vals); const vm=Math.max(0.5,(vhi-vlo))*0.18; vlo-=vm; vhi+=vm;
  if(vhi-vlo<1){ const c=(vhi+vlo)/2; vlo=c-0.5; vhi=c+0.5; }
  const lt=[]; for(let e=Math.ceil(l0);e<=Math.floor(l1);e++) lt.push(e);
  axesT(ctx,bb,l0,l1,vlo,vhi,{title:titleFor(bb,'⟨Jz⟩ (green) and ⟨Iz⟩ (orange) of this state, from Zeeman to Paschen–Back','⟨Jz⟩ and ⟨Iz⟩'),
    xlab:'magnetic field (G)',xticks:lt,xfmt:e=>'10'+String(e).split('').map(c=>c==='-'?'⁻':SUPD[+c]).join(''),yticks:sparseTicks(vlo,vhi,bb.h),yfmt:v=>tkS(v)});
  const lx=V.Bs.map(B=>Math.log10(B));
  for(const [y,c] of [[V.jzWeak,COL.pos],[V.izWeak,COL.ref],[V.mJ,COL.pos],[V.mI,COL.ref]])
    polyline(ctx,bb,[l0,l1],[y,y],l0,l1,vlo,vhi,rgba(c,0.35),0.8,[4,4]);
  polyline(ctx,bb,lx,V.jz,l0,l1,vlo,vhi,COL.pos,1.8);
  polyline(ctx,bb,lx,V.iz,l0,l1,vlo,vhi,COL.ref,1.8);
  const X=bb.x+bb.w*(Math.log10(V.B)-l0)/(l1-l0);
  ctx.beginPath(); ctx.moveTo(X,bb.y); ctx.lineTo(X,bb.y1); ctx.strokeStyle='rgba(205,53,196,0.6)'; ctx.lineWidth=1; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
  HIT.push({kind:'vecB',b:bb,l0,l1,Bc:V.Bc});
  caption(ctx,56,L.capY,L.txt,L.capW,'#767e92',CAP_FONT);
}

/* ================================================================== *
 *  the clock, the model for the current view, dispatch, the pointer   *
 * ================================================================== */
const SIM={t:0};
const FRAME=1/60;
function simReset(){ SIM.t=0; }
function viewAnimates(st){ return st.view==='vectors'&&st.vPlay; }
function runStep(st){ if(!viewAnimates(st)) return false; SIM.t+=FRAME*st.vSpeed; return true; }
function buildModel(){
  const st=ST, M={view:st.view, st, diag:diagramModel(st)};   /* the readout always describes the current line */
  if(st.view==='twelve') M.twelve=twelveModel(st);
  else if(st.view==='spectrum') M.spec=spectrumModel(st);
  else if(st.view==='field') M.field=fieldModel(st);
  else if(st.view==='sublevels') M.sub=subModel(st);
  else if(st.view==='vectors') M.vec=vecModel(st);
  return M;
}
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='diagram') drawDiagram(ctx,W,H,M);
  else if(M.view==='twelve') drawTwelve(ctx,W,H,M);
  else if(M.view==='spectrum') drawSpectrum(ctx,W,H,M);
  else if(M.view==='field') drawField(ctx,W,H,M);
  else if(M.view==='sublevels') drawSublevels(ctx,W,H,M);
  else drawVectors(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
/* the field views' axes, as the pointer reads them: the marker as a fraction of the range, the vectors' field
   (a log axis) in units of the level's crossover field */
function fieldFromX(hit,x){ return clamp((x-hit.b.x)/hit.b.w,0,1); }
function vecBFromX(hit,x){ return clamp(Math.pow(10,hit.l0+(hit.l1-hit.l0)*clamp((x-hit.b.x)/hit.b.w,0,1))/hit.Bc,LIM.vBrel[0],LIM.vBrel[1]); }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  S.pointer=function(type,x,y){
    if(type==='up'){ const was=DRAG.what; DRAG.what=null; return was!==null&&was!=='cam'; }
    if(type==='down'){
      const hit=hitAt(x,y); if(!hit) return false;
      if(hit.kind==='atom'){ pickAtom(ST,hit.sym); ST.view='diagram'; return true; }
      if(hit.kind==='subF'){ ST.subF=hit.F; return true; }
      if(hit.kind==='fieldB'){ DRAG.what='fieldB'; DRAG.hit=hit; ST.fMark=fieldFromX(hit,x); return true; }
      if(hit.kind==='vecB'){ DRAG.what='vecB'; DRAG.hit=hit; ST.vBrel=vecBFromX(hit,x); return true; }
      if(hit.kind==='cam'){ DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST.camTheta; DRAG.ph=ST.camPhi; return true; }
      return false;
    }
    if(type==='move'){
      if(DRAG.what==='cam'){ ST.camTheta=DRAG.th-(x-DRAG.x)*0.008; ST.camPhi=clamp(DRAG.ph+(y-DRAG.y)*0.008,-1.2,1.35); return true; }
      if(DRAG.what==='fieldB'){ ST.fMark=fieldFromX(DRAG.hit,x); return true; }
      if(DRAG.what==='vecB'){ ST.vBrel=vecBFromX(DRAG.hit,x); return true; }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false, frames=0;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    if(st.view!==k) st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  /* a slider over [lo, hi]; log sliders run 0..1000 and map through ofLog / logOf */
  function slider(key,lab,lo,hi,step2,fmtf,onchg,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  const logSlider=(key,lab,lo,hi,fmtf,onchg)=>slider(key,lab,0,LOGN,1,fmtf,onchg,logMap(lo,hi));
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')); }
  /* a chip row whose chips depend on the atom (its isotopes, its lines, a level's F values): rebuilt whenever
     what it lists changes (Known-bad: a control that changes which other controls exist must rebuild them) */
  function dynRow(listFn,getFn,setFn){
    const wrapEl=h('div',{class:'chips'}); let sig='';
    function build(){
      const list=listFn(), s=JSON.stringify(list.map(o=>[o.id,o.name]));
      if(s!==sig){ sig=s; while(wrapEl.firstChild) wrapEl.removeChild(wrapEl.firstChild);
        list.forEach(o=>wrapEl.appendChild(h('button',{class:'chip',html:o.name,onclick:()=>{ setFn(o.id); syncChips(); syncPanel(); dirty=true; refresh(); }}))); }
      const cur=getFn(); [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i]&&list[i].id===cur?' on':''));
      wrapEl.hidden=list.length<2;
    }
    return {el:wrapEl,build};
  }

  /* the atom, its isotope, its line: shared by every view */
  const gAtom=h('div',{class:'grp'},h('h3',null,'the atom'));
  gAtom.appendChild(chipRow(ATOMS.map(a=>({id:a.sym,name:a.sym})),'atom',o=>pickAtom(st,o.id)));
  const isoRow=dynRow(()=>curAtom(st).isos.map(i=>({id:i.id,name:isoHTML(curAtom(st),i)+(i.I===0?' (I = 0)':'')})),
    ()=>curIso(st).id, id=>{ st.isoSel[st.atom]=id; });
  const lineRow=dynRow(()=>curAtom(st).lines.map(l=>({id:l.id,name:lineName(curAtom(st),l)})),
    ()=>curLine(st).id, id=>{ st.lineSel[st.atom]=id; });
  gAtom.appendChild(isoRow.el); gAtom.appendChild(lineRow.el);
  const atomTag=h('div',{class:'tag'}); gAtom.appendChild(atomTag);

  /* the overview: which dozen */
  const gTwelve=h('div',{class:'grp'},h('h3',null,'the overview'));
  gTwelve.appendChild(chipRow(DOZENS.map(d=>({id:d.id,name:d.name})),'dozen'));

  /* the diagram */
  const gDiag=h('div',{class:'grp'},h('h3',null,'the diagram'));
  gDiag.appendChild(h('div',{class:'checks'},checkbox('dShift','the shifts from the centre of gravity'),checkbox('dSplit','the splittings between neighbours'),
    checkbox('dUnc','the uncertainties, as (digits)'),checkbox('dG','gF and the Zeeman splitting (MHz/G)')));

  /* the spectrum */
  const gSpec=h('div',{class:'grp'},h('h3',null,'the spectrum'));
  gSpec.appendChild(logSlider('sT','temperature',LIM.sT[0],LIM.sT[1],fmtT,()=>{ st.sFree=false; }));
  gSpec.appendChild(h('div',{class:'checks'},checkbox('sFree','atoms at rest (no Doppler width)'),checkbox('sSticks','name the components')));
  const specTag=h('div',{class:'tag'}); gSpec.appendChild(specTag);

  /* in a field */
  const gField=h('div',{class:'grp'},h('h3',null,'in a magnetic field'));
  const fLevRow=dynRow(()=>{ const D=diagramModel(st); return [{id:'lo',name:'lower: '+termHTML(D.lo.L)},{id:'up',name:'upper: '+termHTML(D.up.L)}]; },
    ()=>st.fLev, id=>{ st.fLev=id; });
  gField.appendChild(fLevRow.el);
  gField.appendChild(logSlider('fRange','the range, in Bc',LIM.fRange[0],LIM.fRange[1],v=>sigf(v,2)+' × Bc'));
  gField.appendChild(slider('fMark','the marker',0,1,0.001,v=>fmt(100*v,0)+' % of the range'));
  const fieldTag=h('div',{class:'tag'}); gField.appendChild(fieldTag);

  /* the sublevels */
  const gSub=h('div',{class:'grp'},h('h3',null,'the sublevels'));
  gSub.appendChild(chipRow([{id:'sp',name:'σ<sup>+</sup>'},{id:'pi',name:'π'},{id:'sm',name:'σ<sup>&minus;</sup>'}],'subPol'));
  const subFRow=dynRow(()=>subModel(st).Flist.map(F=>({id:F,name:'from F = '+jHTML(F)})),()=>subModel(st).F,id=>{ st.subF=id; });
  gSub.appendChild(subFRow.el);
  gSub.appendChild(h('div',{class:'checks'},checkbox('subNum','print each line’s strength')));

  /* the vectors */
  const gVec=h('div',{class:'grp'},h('h3',null,'the vectors'));
  const vLevRow=dynRow(()=>{ const D=diagramModel(st); return [{id:'lo',name:'lower: '+termHTML(D.lo.L)},{id:'up',name:'upper: '+termHTML(D.up.L)}]; },
    ()=>st.vLev, id=>{ st.vLev=id; st.vState=-1; });
  gVec.appendChild(vLevRow.el);
  /* the state: its F, then that F's mF (a level with I = 7/2 and J = 11/2 has 80 states, far too many chips for one row) */
  const vFRow=dynRow(()=>{ const V=vecModel(st); return V.none?[]:[...new Set(V.states.map(s=>s.F))].map(F=>({id:F,name:jHTML(F)})); },
    ()=>{ const V=vecModel(st); return V.none?-1:V.pick.F; }, F=>{ st.vState=vecDefaultOf(vecModel(st).states,F); });
  const vStateRow=dynRow(()=>{ const V=vecModel(st); return V.none?[]:V.states.map((s,i)=>({i,s})).filter(o=>o.s.F===V.pick.F)
      .map(o=>({id:o.i,name:(o.s.mF>0?'+':o.s.mF<0?'&minus;':'')+jHTML(Math.abs(o.s.mF))})); },
    ()=>{ const V=vecModel(st); return V.none?-1:V.k; }, id=>{ st.vState=id; });
  gVec.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'F'),vFRow.el));
  gVec.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'mF'),vStateRow.el));
  gVec.appendChild(logSlider('vBrel','the field, in Bc',LIM.vBrel[0],LIM.vBrel[1],v=>sigf(v,2)+' × Bc'));
  gVec.appendChild(h('div',{class:'checks'},checkbox('vPlay','turn the vectors')));
  gVec.appendChild(logSlider('vSpeed','speed',LIM.vSpeed[0],LIM.vSpeed[1],v=>sigf(v,2)+'×'));

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; const d=JSON.parse(JSON.stringify(DEFAULTS)); Object.keys(st).forEach(k=>delete st[k]); Object.assign(st,d); st.view=v; simReset();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  /* the prose's elements are kept as made, never looked up again (the DOM-stub harness resolves only #info and
     #phys, and a lookup that returns null there throws inside refresh, drawing nothing) */
  const infoEl=h('div',{id:'info'}), physEl=h('div',{id:'phys'}), srcEl=h('div',{class:'src'});
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),infoEl,srcEl);
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),physEl);
  [gAtom,gTwelve,gDiag,gSpec,gField,gSub,gVec,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));

  function syncPanel(){
    const v=st.view;
    gAtom.hidden=v==='twelve'; gTwelve.hidden=v!=='twelve'; gDiag.hidden=v!=='diagram'; gSpec.hidden=v!=='spectrum'; gField.hidden=v!=='field'; gSub.hidden=v!=='sublevels'; gVec.hidden=v!=='vectors';
    for(const r of [isoRow,lineRow,fLevRow,subFRow,vLevRow,vFRow,vStateRow]) r.build();
    for(const k in rows) rows[k].sync();
    const D=diagramModel(st);
    atomTag.innerHTML=D.a.name+(D.a.isos.length>1?': '+D.a.isos.map(i=>isoHTML(D.a,i)+' I = '+jHTML(i.I)+(i.abund>0?' ('+sigf(100*i.abund,3)+' %)':'')).join(', '):'');
    const Sp=v==='spectrum'?spectrumModel(st):null;
    specTag.innerHTML=Sp?('Doppler width '+mhzHTML(Sp.fwhmD)+', natural width '+mhzHTML(Sp.fwhmN)):'';
    /* a molecule's band has no components to name */
    rows.cb_sSticks.row.hidden=!!D.a.mol;
    const Z=v==='field'?fieldModel(st):null;
    fieldTag.innerHTML=Z&&!Z.none?'B<sub>c</sub> = '+sigf(Z.Bc,3)+' G here; the range is '+sigf(Z.Bmax,3)+' G':'';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; &larr; &rarr; the previous or next atom &nbsp; space turns the vectors or stops them';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='twelve'?'press one to open its diagram · 1–6 switch views'
        :v==='field'?'press or drag on the plot to move the marker · 1–6 switch views'
        :v==='sublevels'?'press a lower F row to start from it · 1–6 switch views'
        :v==='vectors'?'drag a picture to turn it · press or drag the lower plot to set the field · space stops it':'← → the previous or next atom · 1–6 switch views';
      infoEl.innerHTML=INFO[proseKey(st)]||'';
      physEl.innerHTML=DERIV[proseKey(st)]||'';
      srcEl.innerHTML=SRC_LINE;
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect(), v0=st.view;
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging');
      if(st.view!==v0) setView(st.view); else { syncChips(); syncPanel(); dirty=true; refresh(); } }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  /* the arrow keys step through the atoms, except in a slider, whose own they are */
  function stepAtom(d){ const i=ATOMS.findIndex(a=>a.sym===st.atom); pickAtom(st,ATOMS[(i+d+ATOMS.length)%ATOMS.length].sym); syncChips(); syncPanel(); dirty=true; refresh(); }
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.vPlay=!st.vPlay; syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
    else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!(e.target&&e.target.type==='range')){ e.preventDefault(); stepAtom(e.key==='ArrowRight'?1:-1); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&(++frames%6===0)){ const M=S.model(); roEl.innerHTML=readoutHTML(M); } }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  diagram:'The nucleus is a small magnet, and a charge, with a spin I of its own. The electrons&rsquo; angular momentum J couples to it into a total F, which runs from |I &minus; J| to I + J, and each value of F is a level of its own: the <b>hyperfine structure</b>. This is Steck&rsquo;s way of drawing it (his Figures 2 and 3 for rubidium-85): the fine-structure level on the left, the F levels fanned out to the right, drawn to scale within each manifold, each with its shift from the level&rsquo;s centre of gravity, the splittings between neighbours, and its Land&eacute; g<sub>F</sub>, how fast it splits again in a magnetic field. '

function makeShot(W,H){

                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null;
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(...a){ chk('moveTo',a); }, lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

  /* ---------- G3. krypton and KrF ---------- */
  { const k=LV('Kr','m5');
    ok(k.bare&&k.dec===1&&k.Fs.every(f=>f.unc===0),'krypton-83’s 1s5 is drawn bare, to 100 kHz: A and B alone miss Faust’s intervals by up to 16 kHz (derive)');

    withState(sel('KrF','BX'),()=>{ const M=buildModel(), r=readoutHTML(M), t=tagHTML(M);
      ok(r.includes('krypton fluoride, I = 1/2 (the <sup>19</sup>F nucleus)')&&!/Z =|null/.test(r),'the readout names the nucleus with the spin, and no Z');
      ok(r.includes('<td>λ</td>')&&!r.includes('λ (vacuum)'),'a three-figure wavelength is not called a vacuum one');
      ok(t.includes('B²Σ⁺<sub>1/2</sub> → X²Σ⁺<sub>1/2</sub>'),'the laser line is named as it runs, B → X');

    eq(S.ladder.rows.map(r=>r.id).join(' '),'band nike3 laser nike1 atom core doppler natural','the widths, widest first, at 300 K');

  eq(diagramCaption(diagramModel(Object.assign({},ST,sel('Rb','D2')))).match(/which is (.*?) times/)[1],'1.3×10⁵','and past 10⁵ as a power of ten');

  ok(DERIV.diagram.includes('811.3 nm is 811.51 nm in vacuum'),'and the diagram’s calculation says so');
  withState(Object.assign({view:'twelve',dozen:2}),()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());

  { let bad=null, n=0; const SIZES=[[1100,712],[560,380]];

    eq(HIT.filter(h=>h.kind==='atom').map(h=>h.sym).join(' '),dozenAtoms(d).map(a=>a.sym).join(' '),'the overview’s page '+(d+1)+' has its '+numWord(dozenAtoms(d).length)+' cells to press');
    const S=makeScene({getContext:()=>makeShot(1100,712)}); const hH=HIT.find(h=>h.kind==='atom'&&h.sym===sym);
    ok(S.pointer('down',hH.b.x+5,hH.b.y+5)&&ST.atom===sym&&ST.view==='diagram'&&ST.dozen===d,'a press on '+atomBy(sym).name+' opens its diagram'); });

    ok(g8.upBot-g8.upTop>1.1*(g4.upBot-g4.upTop)&&g8.loBot-g8.loTop>1.1*(g4.loBot-g4.loTop)&&g8.loTop-g8.upBot>=84,
      'an eight-level manifold gets a taller band than a four-level one, and the optical line keeps its 84 px between them'); }
  { const st=[{F:2,mF:2},{F:2,mF:1},{F:2,mF:0},{F:2,mF:-1},{F:2,mF:-2},{F:1,mF:1},{F:1,mF:0},{F:1,mF:-1},{F:0,mF:0}];
    eq([2,1,0].map(F=>vecDefaultOf(st,F)).join(' '),'1 5 8','each F starts from its smallest positive mF (F = 0 from mF = 0)'); }
  withState(Object.assign({view:'field'},sel('Rb','D2')),()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const S=makeScene({getContext:()=>makeShot(1100,712)}), hb=HIT.find(h=>h.kind==='fieldB');
    S.pointer('down',hb.b.x+0.25*hb.b.w,hb.b.y+10); close(ST.fMark,0.25,1e-12,'a press on the field plot moves the marker to that field');
    S.pointer('move',hb.b.x+0.75*hb.b.w,hb.b.y+10); close(ST.fMark,0.75,1e-12,'and a drag follows'); S.pointer('up',0,0); });
  withState(Object.assign({view:'vectors'},sel('Rb','D2')),()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const S=makeScene({getContext:()=>makeShot(1100,712)}), hb=HIT.find(h=>h.kind==='vecB');
    S.pointer('down',hb.b.x+hb.b.w,hb.b.y+10); const V=vecModel(ST); close(V.B,V.Bhi,1e-9*V.Bhi,'a press at the right end of the lower plot sets the highest field');

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');

}
