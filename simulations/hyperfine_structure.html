<title>Hyperfine structure &mdash; the resonance lines of hydrogen through chromium and krypton, the KrF excimer, and rubidium-85</title>
<!--
  ===================================================================
  hyperfine_structure.html — the nucleus splits every level of the
  atom: D. A. Steck's rubidium-85 diagrams (his Figures 2 and 3),
  drawn the same way for the resonance lines of hydrogen through
  chromium and krypton, and for the KrF excimer, with their spectra, their sublevels, a magnetic field
  and the vector model
  ===================================================================

  Six views.  THE DIAGRAM: a line's two fine-structure levels, each
  fanned into its F levels to scale within its own manifold, with the
  shift of every F from the level's centre of gravity, the splittings
  between neighbours, the approximate g_F and its MHz/G, and the line's
  wavelength, frequency, wave number and photon energy: Steck's Figures
  2 and 3 for rubidium-85's D2 and D1 lines, and the same drawing for
  the resonance lines of H, He, Li, Be, B, C, N, O, F, Ne, Na, Mg, Al,
  Si, P, S, Cl, Ar, K, Ca, Sc, Ti, V, Cr and Kr (argon's default is
  39Ar's 811.5 nm line, the one atom-trap trace analysis counts it on;
  krypton's is 83Kr's 811.3 nm line, on which 81Kr and 85Kr are
  cooled for the same counting), and KrF's 248-nm laser band, whose
  two states have no known hyperfine structure and are drawn dashed.
  THE OVERVIEW: a dozen atoms side by side at a time, then krypton
  beside KrF, rubidium on every page, each with its default line;
  twelve of the twenty-five elements are mostly an isotope with I = 0
  (4He, 12C, 16O, 20Ne, 24Mg, 28Si, 32S, 40Ar, 40Ca, 48Ti, 52Cr,
  84Kr), so their odd isotopes are drawn (argon's, 39Ar, radioactive:
  no stable argon isotope has a spin).
  THE SPECTRUM: every F -> F' component with its share of the
  absorption, the natural Lorentzian and the Doppler Gaussian (a Voigt
  profile), a temperature from 1 uK to 3000 K or the atoms at rest;
  for KrF, which has no components, the widths that meet on its band
  on one logarithmic scale (the band, KrF lasers, the hyperfine spans
  of its parts, the Doppler and natural widths).  IN
  A MAGNETIC FIELD: every state of a level from zero field to Paschen-
  Back, as Steck's Figures 4 to 6.  THE SUBLEVELS: the mF ladders and
  the transitions sigma+, pi or sigma- light drives from one lower F,
  each with its squared matrix element (Steck's Tables 9 to 20), and the
  cycling transition.  THE VECTORS: J and I locked into F at weak field,
  each about B at strong, and the exact <Jz> and <Iz> between.

  WHAT IS QUOTED (build_hfs/data/constants.txt: every number beside the
  words around it in its downloaded source; check_sources.py refuses to
  build if one is not found there)
  ---------------------------------------------------------------------
  Rubidium-85 and sodium-23: D. A. Steck, "Rubidium 85 D Line Data" and
  "Sodium D Line Data", rev. 2.3.4 (2025): A, B, g_J, g_I, the D-line
  frequencies (lambda, nu and the wave number as he prints them), the
  lifetimes, the masses.  Level energies and Einstein A coefficients:
  NIST Atomic Spectra Database.  Isotope masses and abundances: NIST
  Atomic Weights and Isotopic Compositions.  Nuclear spins and moments:
  N. J. Stone, IAEA INDC(NDS)-0794 (2019).  The spin 0 of the even-even
  isotopes and m_p/m_e: Wikipedia.  The other atoms' hyperfine
  constants: hydrogen, Horbatsch & Hessels 2016 (the 2P levels QED
  theory); helium-3, Eikema et al. 1997 (theory, with the 4He line and
  the isotope shift); lithium-7, Beckmann et al. 1974, Huang et al.
  2013, Orth et al. 1975 as effective constants (Puchalski & Pachucki
  2009), the D lines Brown et al. 2013; beryllium-9, Puchalski, Komasa &
  Pachucki 2021 (theory); boron-11, Lew & Title 1960, Harvey, Evans &
  Lew 1972, the 3s level Gharibnejad & Derevianko 2012 (theory);
  carbon-13, Wolber et al. 1970; nitrogen-14, Hirsch et al. 1977 and
  Carette et al. 2010; oxygen-17, Harvey 1965; fluorine-19, Radford,
  Hughes & Beltran-Lopez 1961, Harvey 1965, Tate & Aturaliye 1997;
  neon-21, Delsart & Keller 1976 and a private communication (Husson &
  Grandin 1978); magnesium-25, Kluge & Sauter 1974; aluminium-27, the
  atomic-beam values (Brown & Evenson 1999 tabulate them, Sur et al.
  2005 quote them) and Liu et al. 2018; silicon-29, Lee & Fairbank 2010;
  phosphorus-31, Lambert & Pipkin 1962; sulfur-33, Carette & Godefroid
  2011 (theory: never measured); chlorine-35 and -37, the atomic-beam
  values Fuller 1976 compiles (Carette & Godefroid 2011 quote them);
  argon-39, Williams et al. 2011 (as Welte 2011 quotes it) and Traub et
  al. 1967; potassium-39, -40 and -41, Arimondo, Inguscio & Violino
  1977 and Falke et al. 2006 (the D lines too) as T. G. Tiecke's
  "Properties of Potassium" (2019) prints them; calcium-43, Nörtershäuser
  et al. 1998 (as Mortensen et al. 2004 quote it) and Arnold et al. 1981
  reanalysed by Olsson & Salomonson 1982 (as Tang 2025 quotes it);
  scandium-45, de Groote et al. 2022 (A, B and the octupole C), Hala &
  Nave 2022 and van Deelen 2017; titanium-47 and -49, Channappa &
  Pendlebury 1965 (as Schrott et al. 2026 quote it) and Jin, Nemoto &
  Minowa 2009; vanadium-51, Unkel et al. 1989 and Lawler et al. 2014
  (titanium's and vanadium's as R. L. Kurucz's hyperfine compilation
  lists them); chromium-53, Pendlebury & Smith 1964, Bucka et al. 1966
  (|A| of z7P4) and Neri et al. 2020 (its sign); krypton-83, Faust &
  Chow Chiu 1963 and Jackson 1977 (as Salah & Hassouneh 2018 quote
  them) and Williams et al. 2011; krypton-81 and -85, Cannon 1990; the
  83Kr+ ion, Ando et al. 2025.  KrF: the band, A. Adonin's thesis
  (Frankfurt 2007); the B lifetime, Tiee et al. 1990; the widths of
  KrF lasers, Obenschain et al. 2020 (Nike) and a Cymer patent
  (Ishihara et al., US 5,982,800).  Half-lives: Stone's table.

  WHAT IS COMPUTED HERE AND CHECKED BY build_hfs/derive.py
  --------------------------------------------------------
  derive.py shares no code with this page: exact rational arithmetic
  (Racah's formulas in fractions.Fraction), numpy's eigh, scipy's wofz.
  It reproduces every number in Steck's Figures 2 and 3 for both his
  atoms from his Table 5 (and both of his uncertainty conventions),
  exactly or, at five digits, by showing why his differ (an A carried
  past its printed digits, two ties rounded down), every g_F and MHz/G,
  Table 8, all 248 matrix elements of his Tables 9 to 20 (read out of
  the documents, sign and fraction), the Breit-Rabi formula at five
  fields, the Paschen-Back limit, both clock shifts, the octupole term
  by a second construction (projectors onto F, where the page uses a
  cubic in I.J), and every F level and line of the twenty-five
  elements and KrF by a second route, and every width KrF's spectrum
  view draws; it checks potassium's frequencies against NIST,
  chromium's z7P4 against the F levels Neri et al. draw, krypton-83's
  A and B against Faust's four measured intervals (within 20 kHz), the unit of
  Kurucz's vanadium file against Holmes et al., and that every number
  in a level's note is printed in a downloaded source; selfTest pins
  the page to it.

  WHAT IS MODELLED, AND WHAT IS NOT HERE
  --------------------------------------
  Each fine-structure level on its own (the hyperfine mixing between
  levels of one term is left out: under 2 kHz for hydrogen's 2P, a few
  kHz for 17O's 3P); the octupole term C only where it is measured
  (scandium's ground levels).  g_I from the bare nuclear moment for all
  but Rb and Na (Steck's measured atomic values, 3.8 per mille apart
  from the bare one for Rb-85).  The line of an odd isotope whose
  element NIST lists for another (13C, 17O, 21Ne, 25Mg, 29Si, 33S, 37Cl,
  39Ar, 43Ca, 47Ti, 49Ti, 53Cr) is that isotope's: the isotope shift is
  not included.  A level whose source prints a constant without an
  uncertainty prints its F levels without one, to that constant's
  decimals.  Not available: carbon-13's 2p3s 3P1,2 (no measurement
  found) and oxygen-17's 3s 3S1 (measured by Marin et al. 1993, not
  retrieved); neon-21's B and neon's g_J; magnesium-25's B is only
  bounded (0 < B < 16 MHz) and drawn as 0; silicon-29's 4s 3P2,
  phosphorus-31's 4s 4P, sulfur-33's 4s 3S1, chlorine's 4s 2P3/2 and
  argon-39's 4s[3/2]1 (none found); chromium-53's z7P3 (compatible with
  zero) and z7P2 (|A| without a sign); no B for scandium's 3d4s4p 2F5/2
  and 2D, vanadium's x4G or chromium's z7P4; krypton-83's 5s'[1/2]1
  (only a calculation found), krypton-81's 2p9 and the radioactive
  isotopes' 1s4 and 1s2; any hyperfine constant of KrF.  KrF's line is
  given to the three figures its source prints.  The vector pictures
  turn at rates chosen to be seen, not the real ones.

  KNOWN-BAD: DO NOT REINTRODUCE (details in the Agent repo,
  projects/simulations/CHANGELOG.md)
  ---------------------------------------------------------
  - Steck's splitting uncertainties for the P3/2 manifolds combine the
    two levels' uncertainties in quadrature (his 120.860(61) MHz); the
    page propagates A and B directly (78).  Both are pinned; neither is
    to be "fixed" to the other.
  - Steck's photon energies use h/e cut at 4.135 667 696e-15 eV s: the
    page computes hν/e with the exact SI constants and prints that.
  - A value quoted without an uncertainty keeps its source's decimals
    (He-3's 41.63 MHz, not 41.630), and a level with one such constant
    prints no uncertainty on its F levels (the others' alone would
    understate it).
  - A 6-MHz line on a 3-GHz axis falls between uniform samples: the
    spectrum samples densely around every component.
  - Five digits of Steck's figures are his arithmetic, not his data
    (rubidium's 5P1/2 210.923(99) and (71) need A = 120.527(56) carried
    further; sodium's 3P3/2 F' = 3 and 0 are exact ties he rounds down).
    The page prints what Table 5 gives and says why; don't retype the
    figure's digits to match.
  - A bare Lorentzian where the Gaussian is narrow (gamma = 200 sigma)
    is 2.5e-5 of the peak off: the wing form carries the Gaussian's
    second, fourth and sixth moments, and the wing test starts at the
    branch edge (u = 9.02), where the sixth is largest.
  - The stretched state is an eigenstate at every field: the vectors'
    default is the top F's smallest positive mF.
  - A chip row rebuilt per atom must be emptied (removeChild) or a
    lookup finds a stale chip; the DOM-stub harness needed the same.
  - A measured octupole C moves scandium's 2D5/2 F levels by up to 1.46
    kHz, more than their printed uncertainties: every call that places
    F levels (the diagram, the Zeeman blocks, their names) takes C.
  - Eight F levels in a manifold: splitting labels try the arrow's left,
    its right, above and below the pair before one counts as dropped,
    manifolds with many levels get taller bands, and an overview cell
    too short for a label per level names the lowest and highest F.
  - Level crossing measures |A| only: a magnitude is drawn only with a
    sourced sign (chromium's z7P4, from Neri et al.'s F levels, checked
    in derive.py); z7P2's |A| has none and is not drawn.
  - A bare level's decimals count in MHz: in GHz the same last digit
    is three places further right (dec + 3; dec - 3 printed krypton-83's
    4 785.2 MHz span as 5 GHz).
  - The NIST isotope of a line is ln.nistIso, not isos[1] (37Cl's and
    47Ti's notes named the wrong one while isos[1] was assumed).
  - A molecule has no Z and no NIST levels: KrF's isotopologue is built
    from its atoms, its line from the wavelength its source prints, to
    that source's figures ("about 2 nm" has one).
-->

/* CODATA 2018, as Steck's Table 1 prints them */
const MUB=1.39962449361;                 /* mu_B / h, MHz per gauss */

/* ---- quantum numbers are plain numbers, half-integers exact in binary (1.5, 2.5): every sum or difference
   the formulas take is then exact, and an integer test needs no tolerance but gets one anyway ---- */
const FACT=[1]; for(let n=1;n<=80;n++) FACT.push(FACT[n-1]*n);
function isInt(x){ return Math.abs(x-Math.round(x))<1e-9; }
function fct(x){ const n=Math.round(x); if(!(Math.abs(x-n)<1e-9)||n<0||n>80) throw new Error('fct('+x+')'); return FACT[n]; }
/* (-1)^k for an integer k (k may arrive as 3.0000000001 from half-integer sums) */
function par(k){ const n=Math.round(k); if(!(Math.abs(k-n)<1e-9)) throw new Error('par('+k+')'); return (n%2===0)?1:-1; }
function triOK(a,b,c){ return c<=a+b+1e-9&&c>=Math.abs(a-b)-1e-9&&isInt(a+b+c); }
function delta2(a,b,c){ return fct(a+b-c)*fct(a-b+c)*fct(-a+b+c)/fct(a+b+c+1); }

/* the 6j symbol {a b c; d e f}, Racah's single sum */
function sixj(a,b,c,d,e,f){
  if(!triOK(a,b,c)||!triOK(a,e,f)||!triOK(d,b,f)||!triOK(d,e,c)) return 0;
  const pre=Math.sqrt(delta2(a,b,c)*delta2(a,e,f)*delta2(d,b,f)*delta2(d,e,c));
  const lo=Math.max(a+b+c,a+e+f,d+b+f,d+e+c), hi=Math.min(a+b+d+e,b+c+e+f,c+a+f+d);
  let s=0;

/* the 3j symbol (j1 j2 j3; m1 m2 m3), Racah's single sum */
function threej(j1,j2,j3,m1,m2,m3){
  if(Math.abs(m1+m2+m3)>1e-9||!triOK(j1,j2,j3)) return 0;
  if(Math.abs(m1)>j1+1e-9||Math.abs(m2)>j2+1e-9||Math.abs(m3)>j3+1e-9) return 0;
  if(!isInt(j1-m1)||!isInt(j2-m2)||!isInt(j3-m3)) return 0;

  const lo=Math.max(0,j2-j3-m1,j1-j3+m2), hi=Math.min(j1+j2-j3,j1-m1,j2+m2);

function cgc(j1,m1,j2,m2,J,M){ return par(j1-j2+M)*Math.sqrt(2*J+1)*threej(j1,j2,J,m1,m2,-M); }

/* a fraction from its double, to label what Steck prints as fractions (7/18, 9/14): continued fractions,
   denominators up to maxDen, and only when the fraction reproduces x to 1e-12 (else null) */
function ratOf(x,maxDen){
  const md=maxDen||100000;
  if(!isFinite(x)) return null;
  const sg=x<0?-1:1; let y=Math.abs(x);
  let h0=0,h1=1,k0=1,k1=0;
  for(let it=0;it<40;it++){
    const a=Math.floor(y), h2=a*h1+h0, k2=a*k1+k0;
    if(k2>md) break;
    h0=h1; h1=h2; k0=k1; k1=k2;
    if(Math.abs(h1/k1-Math.abs(x))<1e-12*Math.max(1,Math.abs(x))) return [sg*h1,k1];
    const r=y-a; if(r<1e-15) break; y=1/r;

function gFof(F,I,J,gJ,gI){
  if(!(F>0)) return NaN;
  const a=(F*(F+1)-I*(I+1)+J*(J+1))/(2*F*(F+1)), b=(F*(F+1)+I*(I+1)-J*(J+1))/(2*F*(F+1));
  return gJ*a+(gI||0)*b;
}

/* ---- line strengths (Steck Eqs. 35, 36, 41) ---- */
function strengthFF(J,Jp,I,F,Fp){ const s=sixj(J,Jp,1,Fp,F,I); return (2*Fp+1)*(2*J+1)*s*s; }
function reducedF(J,Jp,I,F,Fp){ return par(Fp+J+1+I)*Math.sqrt((2*Fp+1)*(2*J+1))*sixj(J,Jp,1,Fp,F,I); }
/* <F mF| e r_q |F' mF'> in units of <J||er||J'>, q = mF - mF' */
function dipoleME(J,Jp,I,F,mF,Fp,mFp){
  const q=mF-mFp; if(Math.abs(q)>1+1e-9) return 0;
  return reducedF(J,Jp,I,F,Fp)*par(Fp-1+mF)*Math.sqrt(2*F+1)*threej(Fp,1,F,mFp,q,-mF);

/* ---- the Zeeman Hamiltonian on |mJ mI>, block by block in M = mJ + mI (Steck Eqs. 15, 20) ----
   H/h = A I.J + B Q(I.J) + muB B (gJ Jz + gI Iz), in MHz, B in gauss.  Each block is diagonalised by Jacobi
   rotations; within a block no two levels cross, so the k-th level of block M keeps its weak-field name
   (F, mF: the k-th lowest F of the block at zero field) and its strong-field one (mJ, mI) at every field. */
function mList(j){ const out=[]; for(let m=-j;m<=j+1e-9;m+=1) out.push(Math.round(2*m)/2); return out; }
function jacobiEig(Ain){
  const n=Ain.length, a=Ain.map(r=>r.slice()), v=[];
  for(let i=0;i<n;i++){ v.push(new Array(n).fill(0)); v[i][i]=1; }
  for(let sweep=0;sweep<60;sweep++){
    let off=0; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) off+=a[i][j]*a[i][j];
    if(off<1e-26*(1+a.reduce((s,r,i)=>s+r[i]*r[i],0))) break;
    for(let p=0;p<n;p++) for(let q=p+1;q<n;q++){
      if(Math.abs(a[p][q])<1e-300) continue;
      const th=(a[q][q]-a[p][p])/(2*a[p][q]);
      const t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1)), c=1/Math.sqrt(t*t+1), s=t*c;
      for(let k=0;k<n;k++){ const akp=a[k][p], akq=a[k][q]; a[k][p]=c*akp-s*akq; a[k][q]=s*akp+c*akq; }
      for(let k=0;k<n;k++){ const apk=a[p][k], aqk=a[q][k]; a[p][k]=c*apk-s*aqk; a[q][k]=s*apk+c*aqk; }
      for(let k=0;k<n;k++){ const vkp=v[k][p], vkq=v[k][q]; v[k][p]=c*vkp-s*vkq; v[k][q]=s*vkp+c*vkq; }
    }
  }
  const ord=[...Array(n).keys()].sort((i,j)=>a[i][i]-a[j][j]);
  return {w:ord.map(i=>a[i][i]), vec:ord.map(i=>v.map(r=>r[i]))};
}
/* the block of M: its basis (mJ, mI) and H there */
function zeemanBlock(I,J,A,B,gJ,gI,Bg,M,C){
  const basis=[];
  for(const mJ of mList(J)){ const mI=M-mJ; if(Math.abs(mI)<=I+1e-9&&isInt(I-mI)) basis.push([mJ,mI]); }
  const n=basis.length, H=[];
  const quad=(B&&I>=1&&J>=1), qd=quad?2*I*(2*I-1)*J*(2*J-1):1, ij=I*(I+1)*J*(J+1);
  /* the octupole term of Eq. (16) is a cubic in K = 2 I.J, so on this block it is the same cubic in the I.J matrix:
     C [10 X^3 + 20 X^2 + 2 X (I(I+1) + J(J+1) + 3 - 3 I(I+1)J(J+1)) - 5 I(I+1)J(J+1)] / [I(I-1)(2I-1) J(J-1)(2J-1)] */
  const oct=(C&&I>=1.5&&J>=1.5), od=oct?I*(I-1)*(2*I-1)*J*(J-1)*(2*J-1):1;
  /* I.J on this block: diagonal mJ mI, off-diagonal (1/2)(I+J- + I-J+) between neighbours */
  const IJ=[];
  for(let r=0;r<n;r++){ IJ.push(new Array(n).fill(0)); }
  for(let r=0;r<n;r++){ const [mJ,mI]=basis[r]; IJ[r][r]=mJ*mI;
    for(let c=0;c<n;c++){ const [nJ,nI]=basis[c];
      if(Math.abs(nJ-(mJ+1))<1e-9&&Math.abs(nI-(mI-1))<1e-9)          /* <mJ+1, mI-1| J+ I- |mJ, mI> */
        IJ[c][r]=IJ[r][c]=0.5*Math.sqrt((J*(J+1)-mJ*(mJ+1))*(I*(I+1)-mI*(mI-1)));
    } }
  const mul=(P,Q)=>P.map((row,r)=>row.map((_,c)=>{ let t=0; for(let k=0;k<n;k++) t+=P[r][k]*Q[k][c]; return t; }));
  const X2=oct?mul(IJ,IJ):null, X3=oct?mul(IJ,X2):null;
  for(let r=0;r<n;r++){ H.push(new Array(n).fill(0));
    for(let c=0;c<n;c++){
      let h=A*IJ[r][c];
      if(oct) h+=C*(10*X3[r][c]+20*X2[r][c]+2*IJ[r][c]*(I*(I+1)+J*(J+1)+3-3*ij)-(r===c?5*ij:0))/od;
      if(quad){ let q2=0; for(let k=0;k<n;k++) q2+=IJ[r][k]*IJ[k][c];
        h+=B*(3*q2+1.5*IJ[r][c]-(r===c?ij:0))/qd; }
      H[r][c]=h;
    }
    H[r][r]+=MUB*Bg*(gJ*basis[r][0]+(gI||0)*basis[r][1]);
  }
  return {basis,H};
}
function blockMs(I,J){ const out=[]; for(let M=-(I+J);M<=I+J+1e-9;M+=1) out.push(Math.round(2*M)/2); return out; }
/* every level at field Bg (gauss): {E (MHz), M, F, mF (weak-field name), mJ, mI (strong-field name),
   jz = <Jz>, iz = <Iz>, vec, basis} sorted by energy */
function zeemanLevels(I,J,A,B,gJ,gI,Bg,C){
  const out=[];
  for(const M of blockMs(I,J)){
    const blk=zeemanBlock(I,J,A,B,gJ,gI,Bg,M,C), eg=jacobiEig(blk.H);
    /* the weak-field names: this block's F values in order of their zero-field energy */
    const Fs=fList(I,J).filter(F=>F>=Math.abs(M)-1e-9).sort((f1,f2)=>hfsShift(I,J,f1,A,B,C)-hfsShift(I,J,f2,A,B,C));
    /* the strong-field names: the block's (mJ, mI) in order of their high-field energy */
    const sf=blk.basis.slice().sort((p,q)=>(gJ*p[0]+(gI||0)*p[1])-(gJ*q[0]+(gI||0)*q[1])||(A*p[0]*p[1]-A*q[0]*q[1]));
    eg.w.forEach((E,k)=>{
      const v=eg.vec[k]; let jz=0, iz=0;
      blk.basis.forEach((b,r)=>{ jz+=v[r]*v[r]*b[0]; iz+=v[r]*v[r]*b[1]; });
      out.push({E,M,F:Fs[k],mF:M,mJ:sf[k][0],mI:sf[k][1],jz,iz,vec:v,basis:blk.basis});
    });
  }
  return out.sort((a,b)=>a.E-b.E);
}
/* the Breit-Rabi formula for J = 1/2 (Steck Eq. 26), and Eq. (28) for m = +-(I + 1/2) */
function breitRabi(I,A,gJ,gI,m,sgn,Bg){
  const dE=A*(I+0.5), x=(gJ-gI)*MUB*Bg/dE;
  if(Math.abs(Math.abs(m)-(I+0.5))<1e-9) return dE*I/(2*I+1)+(m>0?1:-1)*0.5*(gJ+2*I*gI)*MUB*Bg;
  return -dE/(2*(2*I+1))+gI*MUB*m*Bg+sgn*dE/2*Math.sqrt(1+4*m*x/(2*I+1)+x*x);
}

/* ---- line shapes: Doppler, natural, Voigt ---- */
/* the Gaussian standard deviation of the Doppler profile, Hz: nu sqrt(kT / m c^2) */
function dopplerSigma(nuHz,massU,T){ return nuHz*Math.sqrt(KB_SI*T/(massU*AMU_SI*C_SI*C_SI)); }
function dopplerFWHM(nuHz,massU,T){ return 2*Math.sqrt(2*Math.LN2)*dopplerSigma(nuHz,massU,T); }
/* complex helpers and the Faddeeva function w(z), Weideman's rational approximation with N = 40: the
   coefficients are sbs_sims.html's (generated by build_sbs/gen_averbakh.py); derive.py checks this function
   against scipy's wofz over the arguments this page uses, and selfTest pins it there */
function cdiv(a,b){ const d=b.re*b.re+b.im*b.im; return {re:(a.re*b.re+a.im*b.im)/d, im:(a.im*b.re-a.re*b.im)/d}; }
function cmul(a,b){ return {re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re}; }
const FAD_L=5.3182958969449885;
const FAD_A=[-1.7782104277376346e-15,1.2442163732423919e-15,1.1330330646562234e-14,-5.394808429316202e-15,-7.0794779778713792e-14,1.3636041457690459e-14,4.5307339276301687e-13,1.2009598791424322e-13,-2.9076379707248684e-12,-2.7274182912151447e-12,1.7714363309551116e-11,3.4727332121065047e-11,-9.0551299791741255e-11,-3.5632341521818489e-10,2.1085999613035256e-10,3.0177804921649453e-09,3.2497465163316973e-09,-1.8315616800990142e-08,-6.3517734893991926e-08,1.4198642359075642e-08,5.9121369529110952e-07,1.4835661133546716e-06,-1.0660138983310546e-06,-1.8007447144659883e-05,-5.5913092642314872e-05,-3.9393631454787331e-05,0.0004398070159869397,0.0027054056330738348,0.010048186242783461,0.029202916471241864,0.071823617790743227,0.15504263802479484,0.29989437996150048,0.5266528988277086,0.8472174576593815,1.2563815675765131,1.7253830848179779,2.2015137948783119,2.6160541527618606,2.8996245093897053];
/* w(z) for Im z >= 0 (all a Voigt profile needs) */
function faddeeva(z){
  const iz={re:-z.im,im:z.re};
  const den={re:FAD_L-iz.re,im:-iz.im}, Z=cdiv({re:FAD_L+iz.re,im:iz.im},den);
  let p={re:0,im:0};
  for(let k=0;k<FAD_A.length;k++){ p=cmul(p,Z); p.re+=FAD_A[k]; }
  const d2=cmul(den,den), t1=cdiv({re:2*p.re,im:2*p.im},d2), t2=cdiv({re:1/Math.sqrt(PI),im:0},den);
  return {re:t1.re+t2.re, im:t1.im+t2.im};
}
/* the Voigt profile, area 1: a Gaussian of standard deviation s and a Lorentzian of half-width g, at
   offset x (any one unit).  Far past the Faddeeva approximation's checked range (Im z > 25) the profile IS
   the Lorentzian to 1e-4 of its peak, and far below it (a Lorentzian under 1e-4 of the Gaussian) the Gaussian */
function voigt(x,s,g){
  if(!(s>0)) return g/(PI*(x*x+g*g));
  const zi=g/(s*Math.SQRT2), zr=x/(s*Math.SQRT2);
  /* far from the Gaussian's reach (a Lorentzian 35 times wider than it, or 12.7 of its widths out): the
     Lorentzian with the Gaussian's second, fourth and sixth moments acting on it,
     V = L + (s^2/2) L'' + (s^4/8) L'''' + (s^6/48) L^(6), whose next term is 945 s^8/x^8, 1.4e-6 of L at the
     edge (a bare Lorentzian was 2.5e-5 of the peak off at g = 200 s; without the sixth moment the edge was
     2.5e-5 of L off) */
  if(zi>25||Math.abs(zr)>9){ const x2=x*x, g2=g*g, d=x2+g2, s2=s*s, d2=d*d;
    return g/(PI*d)*(1+s2*(3*x2-g2)/d2+3*s2*s2*(5*x2*x2-10*x2*g2+g2*g2)/(d2*d2)
      +15*s2*s2*s2*(7*x2*x2*x2-35*x2*x2*g2+21*x2*g2*g2-g2*g2*g2)/(d2*d2*d2)); }
  return faddeeva({re:zr,im:zi}).re/(s*Math.sqrt(TAU));
}

const TABS=[['diagram','the diagram'],['twelve','the overview'],['spectrum','the spectrum'],
            ['field','in a magnetic field'],['sublevels','the sublevels'],['vectors','the vectors']];
/* role colours: green = the computed quantity, orange = a measured/reference value or a warning,
   magenta = the live selection, cyan = structure */
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6', text:'#cfd4de',
           faint:'#3a4256', fan:'#4a5266', level:'#e9ecf2', grid:'#1a2030'};
/* the F levels coloured as Steck's field figures colour them: one hue per F, highest F first */
const F_COLS=['#e8604a','#5a8de0','#6cc46a','#b36ad8','#e8b43a','#4ac8c0','#e05aa8'];
const RO_W=300;

function atomBy(sym){ return ATOMS.find(a=>a.sym===sym)||ATOMS.find(a=>a.sym==='Rb'); }
function isoBy(atom,id){ return atom.isos.find(i=>i.id===id)||atom.isos[0]; }

function curIso(st){ const a=curAtom(st); return isoBy(a,st.isoSel[a.sym]); }

/* the overview's pages: twelve atoms at a time, then krypton and its excimer (a page named by its members, since a

function logOf(v,lo,hi){ return clamp(Math.round(LOGN*Math.log(v/lo)/Math.log(hi/lo)),0,LOGN); }
function ofLog(u,lo,hi){ return lo*Math.pow(hi/lo,clamp(u,0,LOGN)/LOGN); }

/* ---- labels: a level as Steck writes it (5²P₃/₂) or with its configuration (2p³ ⁴S°₃/₂) ----
   returned as [main, subscript]: the canvas draws the subscript smaller and lower, the HTML as <sub> */
function termParts(L){
  if(L.lab) return [L.lab[0]+L.lab[1],L.lab[2]];

function termCanvas(L){ const p=termParts(L); return p[0]+p[1].replace(/\d/g,d=>SUBD[+d]); }
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹';
const supNum=n=>String(n).split('').map(c=>SUPD[+c]).join('');
/* an isotope, or a molecule's isotopologue atom by atom (⁸⁴Kr¹⁹F) */
function isoName(atom,iso){ return iso.parts?iso.parts.map(([el,A])=>supNum(A)+el).join(''):supNum(iso.A)+atom.sym; }
function lineName(atom,ln){
  if(ln.name) return ln.name;

  return 'J = '+jStr(lo.J)+' → '+jStr(up.J);
}
/* the two levels of a line in the order it is named: lower → upper, the absorption, for an atom; upper → lower for the
   excimer, whose line is the laser's emission (its lower state is repulsive there, so nothing absorbs from it) */
function lineEnds(ln,lo,up){ return ln.emit?[up,lo]:[lo,up]; }
/* the NIST isotope a line's energies belong to (the natural mixture's most abundant, or the one NIST lists) */
function nistIsoOf(atom,ln){ return atom.isos.find(i=>i.id===ln.nistIso); }
/* the g_L of the isotope's atom (Steck Eq. 19: 1 - me/m_nuc, the nucleus = the atom less its Z electrons;
   Rb-85 gives Steck's 0.999 993 54, Na-23 his 0.999 976 13).  A molecule has no Z: its Sigma states have no orbital
   angular momentum about the axis for g_L to multiply, and none is drawn in a field */
function gLof(atom,iso){ return atom.mol?NaN:1-QCONST.meU/(iso.mass-atom.Z*QCONST.meU); }

/* ---- one fine-structure level of one isotope: its hyperfine manifold ----
   status: 'ok' (A, and B where it applies, known), 'I0' (the nucleus has no spin), 'J0' (the level has
   none), 'unknown' (not measured); every F with its shift from the centroid, its uncertainty and g_F */
function levelModel(atom,iso,key){
  const L=atom.levels[key], I=iso.I, J=L.J;
  const h=(L.hfs&&L.hfs[iso.id])||{status:'unknown'};
  const status=I===0?'I0':J===0?'J0':h.status;
  const ok=status==='ok';
  const A=ok?h.A:NaN, B=ok&&h.B!==undefined?h.B:0, dA=ok?h.dA:0, dB=ok&&h.dB!==undefined?h.dB:0;
  const hasB=ok&&h.B!==undefined&&I>=1&&J>=1;

  const hasC=ok&&h.C!==undefined&&I>=1.5&&J>=1.5, C=hasC?h.C:0, dC=hasC&&h.dC!==undefined?h.dC:0;
  /* a level with any constant printed without an uncertainty (h.bare) carries none onto what is drawn from them:
     its shifts and splittings are printed to the decimals of its least precise constant (dec), not with an
     uncertainty that would leave that constant out */
  const pu=ok&&!h.bare;
  /* g_J: measured where a source gives it (Steck, NIST), else the LS Lande value with the isotope's g_L;
     the jK-coupled levels (neon 2p⁵3s) have no LS value and none measured here: NaN, and the page says so */
  const gJ=(L.gJ!==undefined&&L.gJ!==null)?L.gJ:(L.jk?NaN:gJLS(L.L,L.S,J,gLof(atom,iso),GS));
  /* Steck's figures print the "approximate" g_F: the pure Lande g_J (g_L = 1, g_S = 2), no nuclear term */
  const gJ0=L.jk?NaN:gJLS(L.L,L.S,J,1,2);
  const Fs=fList(I,J).map(F=>({F, shift:ok?hfsShift(I,J,F,A,B,C):0, unc:pu?shiftUnc(I,J,F,dA,dB,dC):0,
    g0:gFof(F,I,J,gJ0,0), g:gFof(F,I,J,gJ,iso.gI)}));
  Fs.forEach(f=>{ f.mhzG=f.g0*MUB; });
  const byE=Fs.slice().sort((p,q)=>p.shift-q.shift);
  const gaps=[]; for(let k=1;k<byE.length;k++) gaps.push({lo:byE[k-1].F, hi:byE[k].F,
    v:byE[k].shift-byE[k-1].shift, unc:pu?splitUnc(I,J,byE[k].F,byE[k-1].F,dA,dB,dC):0});
  const span=byE.length?byE[byE.length-1].shift-byE[0].shift:0;
  const spanUnc=pu&&byE.length>1?splitUnc(I,J,byE[byE.length-1].F,byE[0].F,dA,dB,dC):0;
  /* dec: the decimals (MHz) of a value its source prints without an uncertainty, which is as far as the
     page prints anything derived from it */
  return {key, L, atom, iso, I, J, status, ok, A, B, dA, dB, hasB, C, dC, hasC, bare:!!h.bare, gJ, gJ0, Fs, byE, gaps, span, spanUnc,
    kind:h.kind||'measured', cite:h.cite||'', note:h.note||'', dec:h.dec, decA:h.decA, decB:h.decB, decC:h.decC,
    uA:h.uA, uB:h.uB, uC:h.uC,
    srcA:h.srcA, srcB:h.srcB, label:termParts(L)};
}

/* ---- the optical line: the source's own quantity, the others from it with the exact SI constants ----
   Steck's documents give the frequency; NIST gives level energies, whose difference is the wave number.
   Each value carries its relative uncertainty (the same for all four); dec = digits NIST printed. */
function opticalOf(atom,iso,ln){
  let nu, rel=null, src=ln.src, odd=false, sf=null;
  const own=ln.nuIso&&ln.nuIso[iso.id];
  if(ln.src==='Steck'){ nu=ln.nu; rel=ln.dnu/ln.nu; }
  else if(own){ nu=own.nu; rel=own.dnu/own.nu; src=own.src; }
  /* a molecule's band (KrF): the wavelength as its source prints it, three figures, and everything else to as many */
  else if(ln.src==='lit'){ nu=C_SI/(ln.lam*1e-9); sf=ln.sf; src=ln.cite; }
  else {
    /* NIST's own numbers are the two level energies: the wave number is their difference, computed here.  It
       carries an uncertainty only when NIST gives one for each level off zero (fluorine's 3s levels have none,
       two decimals, and the ground level's alone would print the line to four), NIST's decimals otherwise */
    const Lo=atom.levels[ln.lo], Up=atom.levels[ln.up], sg=Up.E-Lo.E;
    const has=L=>L.Eunc!==undefined&&L.Eunc!==null;
    nu=sg*C_SI*100;
    if([Lo,Up].every(L=>has(L)||L.E===0)&&(has(Lo)||has(Up))) rel=Math.hypot(has(Lo)?Lo.Eunc:0,has(Up)?Up.Eunc:0)/sg;
    /* NIST's energies belong to one isotope: another drawn with them is off by its isotope shift */
    odd=!!ln.nistIso&&ln.nistIso!==iso.id; src='NIST'; }
  const sig=nu/(C_SI*100), lam=C_SI/nu*1e9, E=H_SI*nu/E_SI;

  const sigdec=ln.src==='NIST'?Math.min(atom.levels[ln.lo].Edec,atom.levels[ln.up].Edec):3;
  return {nu,sig,lam,E,rel,sigdec,sf,odd,src,tau:ln.tau,gammaHz:1/(TAU*ln.tau),printed:ln.printed||null};

/* a number printed Steck's way: digits grouped in threes, the uncertainty in parentheses (2 digits) */
function groupDigits(s){

/* round half up at dec decimals (Steck's figures do: 1.25 x 0.50 prints (63)); the guard absorbs float fuzz */
function fixedHalfUp(v,dec){ const k=Math.pow(10,dec), r=Math.floor(Math.abs(v)*k+0.5+1e-9)/k; return (v<0?'-':'')+r.toFixed(dec); }

  if(q>=Math.pow(10,nd)){ e+=1; q=Math.floor(u/Math.pow(10,e)+0.5+1e-9); }
  const dec=Math.max(0,-e);

}
/* a number to a number of significant figures (a NIST energy printed without an uncertainty: the line keeps
   the significant figures of the wave number, sf, and no more) */
/* a temperature as the slider shows it: K, mK or µK */
function fmtT(v){ return v>=1?sigf(v,3)+' K':v>=1e-3?sigf(v*1e3,3)+' mK':sigf(v*1e6,3)+' µK'; }
/* past the units digit the rounding goes on in the integer: 1 208.84 THz to three figures is 1 210, not 1 209 */
function toSig(v,sf){ const e=sf-1-Math.floor(Math.log10(Math.abs(v)));

  /* a line given to a number of figures (KrF's 248 nm): the four numbers to those figures, whatever their unit */

  if(o.printed){
    /* Steck's figures: his lambda, nu and sigma verbatim (from nu they come out within the last digit's
       uncertainty of these); the photon energy from the exact SI h/e, since his is h/e cut at 4.135 667 696 */
    return {lam:o.printed.lam+' nm', nu:o.printed.nu+' THz', sig:o.printed.sig+' cm⁻¹', E:withUnc(o.E,o.rel*o.E)+' eV',
      Esteck:o.printed.E+' eV'}; }
  if(o.rel!==null){ const f=(v,unit)=>withUnc(v,o.rel*v)+' '+unit;
    return {lam:f(o.lam,'nm'), nu:f(o.nu/1e12,'THz'), sig:f(o.sig,'cm⁻¹'), E:f(o.E,'eV')}; }
  const sf=Math.floor(Math.log10(o.sig))+1+o.sigdec;
  return {lam:toSig(o.lam,sf)+' nm', nu:toSig(o.nu/1e12,sf)+' THz', sig:groupDigits(fixedHalfUp(o.sig,o.sigdec))+' cm⁻¹', E:toSig(o.E,sf)+' eV'};

/* the MHz of an F shift or a splitting, to the precision its uncertainty allows (Steck: GHz above 1 GHz); a

function mhzStr(v,u,showU,dec){
  const big=Math.abs(v)>=1000, s=big?v/1000:v, uu=big?u/1000:u, unit=big?' GHz':' MHz';
  if(showU&&u>0) return withUnc(Math.abs(s),uu)+unit;
  if(u>0){ const e=Math.floor(Math.log10(uu))-1; return groupDigits(fixedHalfUp(Math.abs(s),Math.max(0,-e)))+unit; }
  /* dec counts decimals of a megahertz: the same last digit in gigahertz is three places further right (krypton-83's
     1s5 span, 4 785.2 MHz to 100 kHz, is 4.785 2 GHz; dec - 3 had printed it 5 GHz) */
  const d=dec!==undefined?(big?dec+3:dec):(big?4:3);
  return groupDigits(fixedHalfUp(Math.abs(s),d))+unit;
}

/* ---- the view models ---- */
function diagramModel(st){
  const a=curAtom(st), iso=curIso(st), ln=curLine(st);
  const lo=levelModel(a,iso,ln.lo), up=levelModel(a,iso,ln.up), opt=opticalOf(a,iso,ln);
  return {a,iso,ln,lo,up,opt,ostr:optStrings(opt)};
}

/* one dozen of the overview, and rubidium: each atom's own default line, drawn with the isotope that has a
   nuclear spin (the odd one where the common isotope has none) */
function twelveModel(st){
  return dozenAtoms(st.dozen).map(a=>{
    const iso=a.isos[0], ln=lineBy(a,a.line0);
    const lo=levelModel(a,iso,ln.lo), up=levelModel(a,iso,ln.up);
    const widest=lv=>lv.ok&&lv.span>0?lv.span:0;
    return {a,iso,ln,lo,up,wLo:widest(lo),wUp:widest(up),opt:opticalOf(a,iso,ln),
      i0:a.isos.find(i=>i.I===0)||null, sel:a.sym===st.atom};
  });
}

/* the spectrum of the current line: every allowed F -> F' component at its offset from the line's centre of
   gravity (MHz), with its share of the absorption from sublevels equally filled,
   w = (2F+1)/((2I+1)(2J+1)) S_FF', which sums to 1; the Doppler (Gaussian) and natural (Lorentzian) widths */
function specComponents(a,iso,ln){
  const lo=levelModel(a,iso,ln.lo), up=levelModel(a,iso,ln.up);
  if(!(lo.ok||lo.status==='I0'||lo.status==='J0')||!(up.ok||up.status==='I0'||up.status==='J0')) return {lo,up,comps:null};
  const I=iso.I, J=lo.J, Jp=up.J, comps=[];
  for(const f of lo.Fs) for(const fp of up.Fs){
    if(Math.abs(f.F-fp.F)>1+1e-9||(f.F===0&&fp.F===0)) continue;
    const S=strengthFF(J,Jp,I,f.F,fp.F); if(!(S>1e-12)) continue;
    comps.push({F:f.F,Fp:fp.F,S,w:(2*f.F+1)/((2*I+1)*(2*J+1))*S,x:fp.shift-f.shift});
  }
  return {lo,up,comps};
}
const SPEC_N=700;
function spectrumModel(st){
  const a=curAtom(st), iso=curIso(st), ln=curLine(st), sc=specComponents(a,iso,ln), opt=opticalOf(a,iso,ln);
  const T=st.sFree?0:st.sT;
  const sigD=T>0?dopplerSigma(opt.nu,iso.mass,T)/1e6:0, gam=opt.gammaHz/2/1e6;   /* MHz: Gaussian s.d., Lorentzian HWHM */
  const out={a,iso,ln,opt,lo:sc.lo,up:sc.up,comps:sc.comps,T,sigD,gam,fwhmD:2*Math.sqrt(2*Math.LN2)*sigD,fwhmN:2*gam};
  if(ln.ladder){ out.ladder=ladderModel(a,iso,ln,opt,T); return out; }
  if(!sc.comps) return out;
  /* the window: every component, four widths beyond the outermost and a twelfth of the span more */
  const xs=sc.comps.map(c=>c.x), wd=Math.max(out.fwhmD,out.fwhmN,1e-3), sp=Math.max(...xs)-Math.min(...xs);
  let lo=Math.min(...xs)-4*wd-sp/12, hi=Math.max(...xs)+4*wd+sp/12;
  if(hi-lo<8*out.fwhmN){ const c=(lo+hi)/2; lo=c-4*out.fwhmN; hi=c+4*out.fwhmN; }
  out.xlo=lo; out.xhi=hi;
  /* a uniform grid, and around every component a dense one in units of its own width: a 6-MHz line on a
     3-GHz axis falls between uniform samples, and its peak with it */
  const g=[]; for(let i=0;i<=SPEC_N;i++) g.push(lo+(hi-lo)*i/SPEC_N);
  const hw=Math.max(out.fwhmN,out.fwhmD)/2;
  for(const c of sc.comps) for(let k=-24;k<=24;k++){ const x=c.x+hw*k/4; if(x>lo&&x<hi) g.push(x); }
  g.sort((p,q)=>p-q);
  out.grid=[]; out.total=[];
  for(let i=0;i<g.length;i++){ if(i&&g[i]-g[i-1]<1e-9*(hi-lo)) continue; out.grid.push(g[i]); out.total.push(specAt(out,g[i])); }
  out.peak=Math.max(...out.total);
  /* are the components resolved?  two neighbours count as resolved when the total dips between them below
     half the smaller of the two peaks (a Rayleigh-like test, computed on the curve, not guessed) */
  out.resolved=resolvedPairs(out);
  return out;
}
/* KrF's band has no components to place: its spectrum view sets the widths that meet on the line side by side on one
   logarithmic scale, each from its source's number.  kind 'ref': a width its source prints (orange); 'pos': one computed
   here (green): the hyperfine spans of the molecule's parts from their measured constants, the Doppler width at the
   slider's temperature, the natural width from the lifetime */
function ladderModel(a,iso,ln,opt,T){
  const L=ln.ladder, lam=ln.lam*1e-9, dnu=dl=>C_SI*dl*1e-9/(lam*lam);   /* a width in nm as one in Hz: c dλ / λ² */
  const c=L.core, cF=fList(c.I,c.J).map(F=>hfsShift(c.I,c.J,F,c.A,c.B,0)), kr=atomBy('Kr');
  const fa=atomBy(L.atom.sym), fl=levelModel(fa,fa.isos[0],L.atom.level);
  const rows=[
    {id:'band', name:'the B → X band', hz:dnu(L.band.dlam), sf:L.band.sf, kind:'ref', src:L.band.cite, printed:L.band.printed},
    {id:'laser', name:'a free-running KrF laser', hz:dnu(L.laser.dlam), sf:L.laser.sf, kind:'ref', src:L.laser.cite, printed:L.laser.printed},
    ...L.nike.map(n=>({id:n.id, name:n.id==='nike1'?'Nike, normal output':'Nike, broadened', hz:n.nu, sf:n.sf, kind:'ref', src:n.cite})),
    {id:'core', name:isoName(kr,isoBy(kr,c.iso))+'⁺ ²P'+jStr(c.J).replace(/\d/g,d=>SUBD[+d])+': hyperfine span', who:'the '+isoName(kr,isoBy(kr,c.iso))+'⁺ ion’s',
      hz:(Math.max(...cF)-Math.min(...cF))*1e6, sf:2, kind:'pos', src:c.cite},
    {id:'atom', name:isoName(fa,fa.isos[0])+' '+termCanvas(fl.L)+': hyperfine span', who:'the '+fa.name+' atom’s', hz:fl.span*1e6, sf:2, kind:'pos', src:fl.cite},
    {id:'doppler', name:'Doppler, '+(T>0?fmtT(T):'at rest'), hz:T>0?dopplerFWHM(opt.nu,iso.mass,T):0, sf:2, kind:'pos'},
    {id:'natural', name:'natural, 1/2πτ', hz:opt.gammaHz, sf:2, kind:'pos', src:ln.cite}];

  const hz=rows.filter(r=>r.hz>0).map(r=>r.hz), by=id=>rows.find(r=>r.id===id);
  /* the widest hyperfine span of the molecule's parts, and how many times the band holds it */
  const wide=by('core').hz>by('atom').hz?by('core'):by('atom');
  return {rows, e0:Math.floor(Math.log10(Math.min(...hz))), e1:Math.ceil(Math.log10(Math.max(...hz))), wide, ratio:by('band').hz/wide.hz};

/* a frequency width to sf figures in the unit that suits it */
function hzShort(v,sf){ const u=v>=1e12?[1e12,'THz']:v>=1e9?[1e9,'GHz']:v>=1e6?[1e6,'MHz']:[1e3,'kHz']; return toSig(v/u[0],sf)+' '+u[1]; }
function specAt(M,x){ let s=0; for(const c of M.comps) s+=c.w*voigt(x-c.x,M.sigD,M.gam); return s; }
function resolvedPairs(M){
  const cs=M.comps.slice().sort((p,q)=>p.x-q.x), out=[];
  for(let k=1;k<cs.length;k++){
    const a=cs[k-1], b=cs[k]; if(b.x-a.x<1e-9){ out.push({a,b,res:false,dip:1}); continue; }
    let mn=Infinity; for(let i=1;i<40;i++){ const x=a.x+(b.x-a.x)*i/40; mn=Math.min(mn,specAt(M,x)); }
    const pa=specAt(M,a.x), pb=specAt(M,b.x);
    out.push({a,b,res:mn<0.5*Math.min(pa,pb),dip:mn/Math.min(pa,pb)});
  }
  return out;
}

/* a level in a magnetic field: every state's energy from 0 to Bmax (the k-th level of each block M keeps its
   name, so a series is one state followed adiabatically) */
function fieldLevel(st){ const a=curAtom(st), ln=curLine(st); return st.fLev==='up'?ln.up:ln.lo; }
function fieldScale(lv){
  /* the field at which the Zeeman energy equals the widest hyperfine interval: the crossover to Paschen-Back */
  const g=isFinite(lv.gJ)?Math.abs(lv.gJ):1;
  return lv.ok&&lv.span>0?lv.span/(g*MUB):NaN;
}
function niceField(b){ const m=Math.pow(10,Math.floor(Math.log10(b))), n=b/m; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*m; }
const FIELD_N=160;
function fieldModel(st){
  const a=curAtom(st), iso=curIso(st), key=fieldLevel(st), lv=levelModel(a,iso,key);
  const out={a,iso,lv,key};
  if(!lv.ok||!isFinite(lv.gJ)){ out.none=true; return out; }
  const Bc=fieldScale(lv), Bmax=niceField(clamp(st.fRange,LIM.fRange[0],LIM.fRange[1])*Bc);
  out.Bc=Bc; out.Bmax=Bmax;
  const I=iso.I, J=lv.J, gI=iso.gI;
  out.Bs=[]; for(let i=0;i<=FIELD_N;i++) out.Bs.push(Bmax*i/FIELD_N);
  const series={};
  out.Bs.forEach((B,i)=>{
    for(const s of zeemanLevels(I,J,lv.A,lv.hasB?lv.B:0,lv.gJ,gI,B,lv.C)){
      const k=s.F+':'+s.mF;
      if(!series[k]) series[k]={F:s.F,mF:s.mF,mJ:s.mJ,mI:s.mI,E:[]};
      series[k].E.push(s.E);
    }
  });
  out.series=Object.values(series).sort((p,q)=>q.F-p.F||q.mF-p.mF);
  let lo=Infinity, hi=-Infinity; for(const s of out.series) for(const e of s.E){ lo=Math.min(lo,e); hi=Math.max(hi,e); }
  out.Elo=lo; out.Ehi=hi;
  const Bm=clamp(st.fMark,0,1)*Bmax; out.Bm=Bm;
  out.at=zeemanLevels(I,J,lv.A,lv.hasB?lv.B:0,lv.gJ,gI,Bm,lv.C);
  out.x=MUB*Bm*Math.abs(lv.gJ)/lv.span;          /* the Zeeman energy over the hyperfine interval */
  return out;
}

/* the sublevels: every |F mF> -> |F' mF + q> of the current line from the chosen lower F, with the squared
   matrix element in units of |<J||er||J'>|^2 (Steck Tables 9-20 print its square root) */
function subModel(st){
  const a=curAtom(st), iso=curIso(st), ln=curLine(st), lo=levelModel(a,iso,ln.lo), up=levelModel(a,iso,ln.up);
  const q=st.subPol==='sp'?1:st.subPol==='sm'?-1:0;
  const Fl=lo.Fs.map(f=>f.F), F=Fl.includes(st.subF)?st.subF:Fl[Fl.length-1];
  const tr=[];
  for(const fp of up.Fs){
    if(Math.abs(fp.F-F)>1+1e-9||(F===0&&fp.F===0)) continue;
    for(const mF of mList(F)){ const mFp=mF+q; if(Math.abs(mFp)>fp.F+1e-9) continue;
      const d=dipoleME(lo.J,up.J,iso.I,F,mF,fp.F,mFp);
      tr.push({F,mF,Fp:fp.F,mFp,d,d2:d*d}); }
  }
  /* the cycling transition: from the stretched state of the top F to the top F' = F + 1, sigma+ */
  const top=Fl[Fl.length-1], topU=up.Fs.length?up.Fs[up.Fs.length-1].F:NaN;
  const cyc=(topU===top+1)?{F:top,mF:top,Fp:topU,mFp:topU}:null;
  /* Steck's Table 8: S_FF' from the 6j symbol, and the same number as the sum over polarisations of the
     squared elements from any one sublevel (his Eq. 41; selfTest checks that the two agree) */
  const SFF=up.Fs.filter(fp=>Math.abs(fp.F-F)<=1+1e-9&&!(F===0&&fp.F===0)).map(fp=>({Fp:fp.F,S:strengthFF(lo.J,up.J,iso.I,F,fp.F)}));
  return {a,iso,ln,lo,up,q,F,tr,cyc,Flist:Fl,SFF};
}

/* the vectors: one state of the chosen level, its exact <Jz>, <Iz> and <I.J> from zero field to Paschen-Back */
const VEC_N=120;
function ijExpect(s,I,J){
  /* <I.J> on the state's own block: diagonal mJ mI, off-diagonal (1/2)(I+J- + I-J+) */
  let e=0; const b=s.basis, v=s.vec;
  for(let r=0;r<b.length;r++){ e+=v[r]*v[r]*b[r][0]*b[r][1];
    for(let c=0;c<b.length;c++){ const [mJ,mI]=b[r], [nJ,nI]=b[c];
      if(Math.abs(nJ-(mJ+1))<1e-9&&Math.abs(nI-(mI-1))<1e-9){
        const m=0.5*Math.sqrt((J*(J+1)-mJ*(mJ+1))*(I*(I+1)-mI*(mI-1))); e+=2*v[r]*v[c]*m; } } }
  return e;
}
/* the state the vectors start from, for a given F: its smallest positive mF (mF = 0 when F = 0).  The stretched
   state is an eigenstate at every field, so it would show no decoupling at all */
function vecDefaultOf(states,F){ const pos=states.filter(s=>s.F===F&&s.mF>0).map(s=>s.mF);
  const m=pos.length?Math.min(...pos):0; return states.findIndex(s=>s.F===F&&s.mF===m); }
function vecModel(st){
  const a=curAtom(st), iso=curIso(st), ln=curLine(st), key=st.vLev==='up'?ln.up:ln.lo, lv=levelModel(a,iso,key);
  const out={a,iso,lv,key};
  if(!lv.ok||!isFinite(lv.gJ)){ out.none=true; return out; }
  const I=iso.I, J=lv.J, gI=iso.gI, B0=lv.hasB?lv.B:0;
  const states=zeemanLevels(I,J,lv.A,B0,lv.gJ,gI,0,lv.C).map(s=>({F:s.F,mF:s.mF}))
    .sort((p,q)=>q.F-p.F||q.mF-p.mF);
  out.states=states;
  /* the default: the top F with its smallest positive mF */
  const dflt=Math.max(0,vecDefaultOf(states,states[0].F));
  const k=clamp(st.vState>=0?st.vState:dflt,0,states.length-1), pick=states[k];
  out.k=k; out.pick=pick;
  const Bc=fieldScale(lv), Bhi=LIM.vBrel[1]*Bc;      /* the plot ends where the slider does */
  out.Bc=Bc; out.Bhi=Bhi;
  const B=clamp(st.vBrel,LIM.vBrel[0],LIM.vBrel[1])*Bc; out.B=B;
  const find=Bg=>zeemanLevels(I,J,lv.A,B0,lv.gJ,gI,Bg,lv.C).find(s=>s.F===pick.F&&s.mF===pick.mF);
  const now=find(B);
  out.now={E:now.E,jz:now.jz,iz:now.iz,ij:ijExpect(now,I,J),mJ:now.mJ,mI:now.mI};
  /* the curves, on a log field axis from Bc/1000 to Bhi */
  out.Bs=[]; out.jz=[]; out.iz=[];
  for(let i=0;i<=VEC_N;i++){ const Bg=LIM.vBrel[0]*Bc*Math.pow(Bhi/(LIM.vBrel[0]*Bc),i/VEC_N), s=find(Bg);
    out.Bs.push(Bg); out.jz.push(s.jz); out.iz.push(s.iz); }
  /* the two limits: the projection theorem at weak field, mJ and mI at strong */
  out.jzWeak=pick.F>0?pick.mF*(pick.F*(pick.F+1)+J*(J+1)-I*(I+1))/(2*pick.F*(pick.F+1)):0;
  out.izWeak=pick.mF-out.jzWeak;
  out.mJ=now.mJ; out.mI=now.mI;
  out.lenJ=Math.sqrt(J*(J+1)); out.lenI=Math.sqrt(I*(I+1)); out.lenF=Math.sqrt(pick.F*(pick.F+1));
  return out;
}

/* ================================================================== *
 *  the readout, the equation bar and the tag                          *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function isoHTML(a,iso){ return iso.parts?iso.parts.map(([el,A])=>'<sup>'+A+'</sup>'+el).join(''):'<sup>'+iso.A+'</sup>'+a.sym; }
function jHTML(j){ return isInt(j)?String(Math.round(j)):(Math.round(2*j)+'/2'); }
function mhzHTML(v){ return mhzShort(v).replace('-','&minus;'); }
/* a level's constants for the readout: A and B with their uncertainties, or why there are none */
function levelRows(lv,showU){

const v3={

    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  the diagram: Steck's Figures 2 and 3 for any atom and line         *
 * ================================================================== */
let HIT=[], MARKS=[], KEY_DROPS=0, W_STAGE=1100, H_STAGE=712;
const TERM_FONT='bold 15px Georgia, serif', F_FONT='bold 13px Georgia, serif', V_FONT='10.5px -apple-system, sans-serif',
      G_FONT='10px -apple-system, sans-serif';
/* a level's name, the J as a real subscript (canvas has none: two fillTexts), registered in LABELS */
function drawTerm(ctx,x,y,parts,font,align,col){
  const f=font||TERM_FONT, fs=parseFloat(f.match(/([\d.]+)px/)[1]), fsub=f.replace(/[\d.]+px/,(fs*0.72).toFixed(1)+'px');
  ctx.font=f; const w1=ctx.measureText(plain(parts[0])).width;
  ctx.font=fsub; const w2=ctx.measureText(plain(parts[1])).width;
  const x0=align==='right'?x-w1-w2:align==='center'?x-(w1+w2)/2:x;
  ctx.fillStyle=col||COL.level; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font=f; ctx.fillText(plain(parts[0]),x0,y);
  ctx.font=fsub; ctx.fillText(plain(parts[1]),x0+w1+1,y+fs*0.28);
  const b=[x0,y-fs*0.85,x0+w1+w2+1,y+fs*0.45]; b.t=parts[0]+parts[1]; b.seq=++DRAW_SEQ; LABELS.push(b);
  return w1+w2+1;
}
/* a vertical double arrow between y0 and y1; below 16 px, Steck's outside form: two arrows pointing in */
function vArrow(ctx,x,y0,y1,col,lw){
  const a=Math.min(y0,y1), b=Math.max(y0,y1);
  if(b-a>=16){ arrowPx(ctx,x,(a+b)/2,x,a,col,lw||1.1); arrowPx(ctx,x,(a+b)/2,x,b,col,lw||1.1); return 'in'; }
  arrowPx(ctx,x,a-13,x,a,col,lw||1.1); arrowPx(ctx,x,b+13,x,b,col,lw||1.1);
  ctx.beginPath(); ctx.moveTo(x,a); ctx.lineTo(x,b); ctx.strokeStyle=col; ctx.lineWidth=0.8; ctx.stroke();
  return 'out';
}
function hLine(ctx,x0,x1,y,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.strokeStyle=col; ctx.lineWidth=lw||1.5;
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); POLY_SEGS.push(x0,y,x1,y);
}
/* a round scale-bar length: 1, 2 or 5 x 10^n, about a fifth of the span */
function niceBar(span){ const r=span/5, m=Math.pow(10,Math.floor(Math.log10(r))), n=r/m; return (n<1.5?1:n<3.5?2:5)*m; }
function mhzShort(v){ const a=Math.abs(v); return a>=1000?sigf(v/1000,2)+' GHz':a>=1?sigf(v,2)+' MHz':sigf(v*1000,2)+' kHz'; }
/* 1-D label relaxation: labels want ys, must stay dmin apart, in order; returns the positions */
function relax(ys,dmin,lo,hi){
  const n=ys.length, ord=[...Array(n).keys()].sort((i,j)=>ys[i]-ys[j]), p=ord.map(i=>ys[i]);
  for(let it=0;it<200;it++){ let moved=false;
    for(let k=1;k<n;k++){ const d=p[k]-p[k-1]; if(d<dmin-1e-6){ const s=(dmin-d)/2; p[k-1]-=s; p[k]+=s; moved=true; } }
    if(lo!==undefined){ if(p[0]<lo){ const s=lo-p[0]; for(let k=0;k<n;k++) p[k]+=s; moved=true; }
      if(p[n-1]>hi){ const s=p[n-1]-hi; for(let k=0;k<n;k++) p[k]-=s; moved=true; } }
    if(!moved) break; }
  const out=new Array(n); ord.forEach((i,k)=>{ out[i]=p[k]; }); return out;
}
/* the y of each F level in a manifold drawn to scale inside [top, bot] (the centroid where they sit when
   there is no splitting to draw); returns the map and the scale in px per MHz */
function manifoldMap(lv,top,bot){
  if(!lv.ok||!(lv.span>0)) return {y:()=>(top+bot)/2, yc:(top+bot)/2, s:0};
  const mx=lv.byE[lv.byE.length-1].shift, s=(bot-top)/lv.span;
  return {y:sh=>top+(mx-sh)*s, yc:top+mx*s, s};
}
/* the words for a manifold that has nothing to split */
function flatNote(lv){
  const a=lv.atom, iso=lv.iso;
  if(lv.status==='I0') return isoName(a,iso)+' has no nuclear spin (I = 0): one level, F = J = '+jStr(lv.J);
  if(lv.status==='J0') return 'J = 0: one level, F = I = '+jStr(lv.I)+', unsplit';
  const why=(lv.L.hfs&&lv.L.hfs[lv.iso.id]&&lv.L.hfs[lv.iso.id].note)||'Not measured.';
  /* a molecule's J = 1/2 is its lowest rotational level's (Omega = 1/2), whose F levels these are */
  return why+(a.mol?' Its lowest rotational level’s F = ':' Its levels F = ')+lv.Fs.map(f=>jStr(f.F)).join(', ')+' are drawn together, their order unknown.';
}
/* the same where the full words would not fit beside the level (a narrow window, KrF's ten-line notes): the readout
   keeps them */
function flatShort(lv){ return lv.status==='unknown'?'Not known: the readout says why. F = '+lv.Fs.map(f=>jStr(f.F)).join(', ')+', drawn together.':flatNote(lv); }
/* one hyperfine manifold: the fine-structure line, the fan, the F levels to scale, the arrows and labels.
   g: {fsX0, fsX1, hx0, hx1, top, bot, compact, showShift, showSplit, showUnc, showG} */
function drawManifold(ctx,W,H,lv,g){
  const mp=manifoldMap(lv,g.top,g.bot), yc=mp.yc;
  /* the fine-structure level and its name */
  hLine(ctx,g.fsX0,g.fsX1,yc,COL.level,2);
  /* the level's name, or where a long configuration would run off the left edge (a narrow window, a transition
     metal's 3d³4s4p), its term alone */
  if(!g.compact){ let lb=lv.label; ctx.font=TERM_FONT;
    if(g.fsX0-10-ctx.measureText(lb[0]+lb[1]).width<4&&lv.L.term) lb=[lv.L.term[0],lb[1]];
    drawTerm(ctx,g.fsX0-10,yc+5,lb,TERM_FONT,'right'); }
  const out={yc,ys:{},labelsDropped:0,map:mp};
  /* the centroid carried across as a faint line (Steck's grey) */
  if(lv.ok&&lv.span>0){ ctx.save(); ctx.globalAlpha=0.55; hLine(ctx,g.hx0,g.hx1,yc,COL.faint,1); ctx.restore(); }
  /* the fan and the levels */
  const Fs=lv.byE.length?lv.byE:[];
  const flat=!(lv.ok&&lv.span>0);
  for(const f of Fs){
    const y=flat?yc:mp.y(f.shift); out.ys[f.F]=y;
    ctx.beginPath(); ctx.moveTo(g.fsX1,yc); ctx.lineTo(g.hx0,y); ctx.strokeStyle=COL.fan; ctx.lineWidth=0.7; ctx.stroke();
    if(flat) break;
    hLine(ctx,g.hx0,g.hx1,y,COL.level,1.5);
  }
  if(flat){
    hLine(ctx,g.hx0,g.hx1,yc,lv.status==='unknown'?COL.dim:COL.level,1.5,lv.status==='unknown'?[6,4]:null);
    const note=flatNote(lv);
    if(g.compact) return out;
    ctx.font=V_FONT;
    const wrapW=Math.max(120,(g.right||W-40)-g.hx1-14);
    let lines=wrapText(ctx,note,wrapW,V_FONT);
    /* the note runs from 6 px a line above the level to 7 below it: past the room it has (g.noteTop..g.noteBot), the
       short form */
    if(g.noteTop!==undefined&&(yc-6*(lines.length-1)-8<g.noteTop||yc+7*(lines.length-1)+8>g.noteBot)){ lines=wrapText(ctx,flatShort(lv),wrapW,V_FONT); out.short=true; }
    /* a line of the note that finds no room is counted (KrF's notes run to ten lines): selfTest requires none */
    lines.forEach((t,i)=>{ if(!lab(ctx,W,H,g.hx1+12,yc-6*(lines.length-1)+i*13,t,lv.status==='unknown'?COL.ref:COL.dim,V_FONT,'left','middle',PLATE)) out.labelsDropped++; });
    return out;
  }
  /* the F labels (and gF), relaxed so close levels do not overlap; a leader where one had to move */
  /* dmin: a label's own height and a pixel (12.1 px for the compact 10.5-px bold, whose boxes the registry
     tests at the half-pixel rule); the F label and g_F line together need 28 */
  const ys=Fs.map(f=>out.ys[f.F]), dmin=g.compact?13:(g.showG?28:15);
  const ly=relax(ys,dmin,g.compact?g.top-4:g.top-8,g.compact?g.bot+4:g.bot+8);
  /* a compact cell too short for a label per level (the second dozen's manifolds reach eight F) names the lowest
     and highest F only, each at its own level: the range, without leaders crowding out of the cell */
  const crowd=g.compact&&Fs.length>2&&Fs.length*dmin>(g.bot-g.top)+8;
  if(crowd){ ly[0]=ys[0]; ly[Fs.length-1]=ys[Fs.length-1]; }
  if(!g.tiny) Fs.forEach((f,k)=>{
    if(crowd&&k!==0&&k!==Fs.length-1) return;
    const y=ly[k], x=g.hx1+10;
    if(Math.abs(y-ys[k])>1){ ctx.beginPath(); ctx.moveTo(g.hx1+1,ys[k]); ctx.lineTo(x-2,y); ctx.strokeStyle=COL.fan; ctx.lineWidth=0.7; ctx.stroke(); }
    if(g.compact){ if(!lab(ctx,W,H,x,y,'F = '+jStr(f.F),COL.text,'bold 10.5px Georgia, serif','left','middle',PLATE_FIX)) out.labelsDropped++; return; }
    const okF=lab(ctx,W,H,x,g.showG?y-5:y,'F = '+jStr(f.F),COL.level,F_FONT,'left','middle',PLATE_FIX);
    if(!okF) out.labelsDropped++;
    if(g.showG){
      const gt=f.F===0?'no Zeeman shift (F = 0)':isFinite(f.g0)?('gF = '+fracStr(f.g0,1000)+'  ('+fmt(f.mhzG,Math.abs(f.mhzG)<1?2:1).replace('-','−')+' MHz/G)'):'gJ not an LS value';
      if(!lab(ctx,W,H,x,y+9,gt.replace('gF','gF'),COL.dim,G_FONT,'left','middle',PLATE_FIX)) out.labelsDropped++;
    }
  });
  if(g.compact) return out;
  /* the shifts from the centroid: one column, and on each side the arrows staggered, longest first, so none
     hides another.  The first arrow's label goes on its left; each later one's on its right, beside the
     stretch of it that no shorter arrow further right reaches (between the next level and its own) */
  if(g.showShift){
    const hw=g.hx1-g.hx0, xa=g.hx0+0.2*hw, dx=Math.min(26,0.075*hw);
    const up=Fs.filter(f=>f.shift>0).sort((p,q)=>q.shift-p.shift), dn=Fs.filter(f=>f.shift<0).sort((p,q)=>p.shift-q.shift);
    out.shiftCols={};
    for(const side of [up,dn]) side.forEach((f,k)=>{
      const x=xa+k*dx, y=out.ys[f.F], kind=vArrow(ctx,x,yc,y,COL.struct,1);
      out.shiftCols[f.F]=k;
      const t=mhzStr(f.shift,f.unc,g.showUnc,lv.dec);
      const yn=k+1<side.length?out.ys[side[k+1].F]:yc;     /* the end of the next (shorter) arrow */
      const ym=kind==='out'?(f.shift>0?y-12:y+12):(k===0?(yc+y)/2:(yn+y)/2);
      const al=k===0?'right':'left', xl=k===0?x-6:x+6;
      if(!lab(ctx,W,H,xl,ym,t,COL.struct,V_FONT,al,'middle',PLATE)) out.labelsDropped++;
    });
  }
  /* the splittings between neighbouring levels */
  if(g.showSplit){
    const x=g.hx0+0.74*(g.hx1-g.hx0);
    for(const gp of lv.gaps){
      const y0=out.ys[gp.lo], y1=out.ys[gp.hi], kind=vArrow(ctx,x,y0,y1,COL.pos,1);
      const t=mhzStr(gp.v,gp.unc,g.showUnc,lv.dec), ym=kind==='in'?(y0+y1)/2:Math.max(y0,y1)+13;
      /* left of the arrow, or where a crowded manifold's shift labels reach that far (eight F levels), right of it; a
         gap too small for its label has it below the pair; where those places are taken, just above the pair, then
         (for a label that sat inside its gap) just below it */
      const yA=Math.min(y0,y1)-13, yB=Math.max(y0,y1)+13;
      const tries=[[x-6,ym,'right'],[x+6,ym,'left'],[x-6,yA,'right'],[x+6,yA,'left']];
      if(kind==='in') tries.push([x-6,yB,'right'],[x+6,yB,'left']);
      /* none past the diagram's own top and bottom: below it the caption comes later, and nothing would refuse the
         overlap */
      for(let i=tries.length-1;i>=0;i--) if(tries[i][1]<(g.limTop||0)+6||tries[i][1]>(g.limBot||H)-4) tries.splice(i,1);
      if(!tries.some(([tx,ty,al])=>lab(ctx,W,H,tx,ty,t,COL.pos,V_FONT,al,'middle',PLATE))) out.labelsDropped++;
    }
  }
  /* the scale of this manifold, printed (each is drawn to its own) */
  const bar=niceBar(lv.span), bh=bar*mp.s, xb=g.hx0-18, yb1=g.bot, yb0=yb1-bh;
  ctx.beginPath(); ctx.moveTo(xb,yb0); ctx.lineTo(xb,yb1); ctx.moveTo(xb-3,yb0); ctx.lineTo(xb+3,yb0); ctx.moveTo(xb-3,yb1); ctx.lineTo(xb+3,yb1);
  ctx.strokeStyle=COL.dim; ctx.lineWidth=1; ctx.stroke();
  lab(ctx,W,H,xb-5,(yb0+yb1)/2,mhzShort(bar),COL.dim,G_FONT,'right','middle',PLATE);
  out.bar=bar; out.barPx=bh;
  return out;
}

/* the layout of the diagram: the fine-structure column, the fan, the manifolds, the labels, from the width */
function diagramGeom(W,H,capY,nUp,nLo){
  const narrow=isNarrow(W), left=narrow?40:56, right=narrow?W-16:W-RO_W-30;
  const span=right-left, top=stageTop()+34, bot=capY-18;
  const namew=Math.min(96,0.14*span), fsX0=left+namew, fsX1=fsX0+Math.max(46,0.11*span);
  const hx0=fsX1+Math.max(34,0.08*span), labw=Math.min(190,Math.max(92,0.27*span)), hx1=right-labw;
  /* each manifold's band: a third of the height and more for many F levels (the second dozen's reach eight), as
     long as the optical line keeps 84 px between them for its four numbers */
  const hgt=bot-top, frac=n=>n>=7?0.42:n>=6?0.39:0.36;
  let bU=frac(nUp||0)*hgt, bL=frac(nLo||0)*hgt;
  if(hgt-bU-bL<84){ const k=Math.max(0.36*hgt*2,hgt-84)/(bU+bL); bU*=k; bL*=k; }
  return {left,right,top,bot,fsX0,fsX1,hx0,hx1,upTop:top+6,upBot:top+bU,loTop:bot-bL,loBot:bot-6,narrow};
}
function diagramCaption(M){
  const o=M.opt, lo=M.lo, up=M.up;
  const spans=[lo,up].filter(l=>l.ok&&l.span>0).map(l=>l.span);
  const nuMHz=o.nu/1e6;
  let cap='Each hyperfine manifold is drawn to its own scale (its bar), so spacings in one cannot be compared with the other';
  /* two figures, whatever the size (sigf keeps every integer digit below 10^5: krypton's 77202 was five) */
  if(spans.length){ const r=nuMHz/Math.max(...spans); cap+=', and neither with the optical gap, which is '+(r>=1e5?sigf(r,2).replace(' × ','×'):toSig(r,2))+' times the widest manifold drawn'; }
  cap+='. Shifts are measured from the centre of gravity (the faint line), the fine-structure level.';
  return cap;
}
function drawDiagram(ctx,W,H,M){
  const D=M.diag, st=M.st;
  const capFull=D.a.mol?'Neither state’s hyperfine structure is known: each is drawn as one dashed level, with what is known about it. The line is the B → X laser line of the KrF excimer, given to the three figures its source prints; the spectrum view sets its width beside the hyperfine scales.'
    :diagramCaption(D)+(D.opt.odd?' The wavelengths are those of '+isoName(D.a,nistIsoOf(D.a,D.ln))+' (NIST): '+isoName(D.a,D.iso)+'’s line is displaced by its isotope shift, which this page does not include.':'');
  const capShort='Each manifold to its own scale; the optical gap is not to scale.';
  const L=fitCaption(ctx,W,H,capFull,capShort,Math.min(W-148,(isNarrow(W)?W-26:W-RO_W-44)-56),stageTop()+320);
  const G=diagramGeom(W,H,L.capY,D.up.Fs.length,D.lo.Fs.length);
  /* a narrow window drops the (digits) and the g_F lines: its labels would otherwise run over the arrows */
  const common={fsX0:G.fsX0,fsX1:G.fsX1,hx0:G.hx0,hx1:G.hx1,right:G.right,compact:false,limTop:G.top,limBot:G.bot,
    showShift:st.dShift,showSplit:st.dSplit,showUnc:st.dUnc&&!G.narrow,showG:st.dG&&!G.narrow};
  /* a flat manifold's note may use its band and half the gap to the other one */
  const mid=(G.upBot+G.loTop)/2;
  const U=drawManifold(ctx,W,H,D.up,Object.assign({},common,{top:G.upTop,bot:G.upBot,noteTop:G.top,noteBot:mid}));
  const Lo=drawManifold(ctx,W,H,D.lo,Object.assign({},common,{top:G.loTop,bot:G.loBot,noteTop:mid,noteBot:G.bot}));
  /* the optical transition: a double arrow between the fine-structure levels, the four numbers on it on one
     plate (a plate per row lets the arrow show between the rows) */
  const xo=(G.fsX0+G.fsX1)/2;
  arrowPx(ctx,xo,(U.yc+Lo.yc)/2,xo,U.yc+2,COL.text,1.3); arrowPx(ctx,xo,(U.yc+Lo.yc)/2,xo,Lo.yc-2,COL.text,1.3);
  const s=D.ostr, rows=[s.lam,s.nu,s.sig,s.E], ym=(U.yc+Lo.yc)/2;
  ctx.font=V_FONT; const pw=Math.max(...rows.map(t=>ctx.measureText(plain(t)).width))+10;
  ctx.fillStyle='rgba(7,11,24,0.92)'; ctx.fillRect(xo-pw/2,ym-2*14-1,pw,4*14+2);
  rows.forEach((t,i)=>lab(ctx,W,H,xo,ym+(i-1.5)*14,t,COL.text,V_FONT,'center','middle',PLATE_FIX));
  caption(ctx,56,L.capY,L.txt,L.capW,'#767e92',CAP_FONT);
  return {U,Lo,G};
}

/* ================================================================== *
 *  the overview: a dozen atoms' diagrams side by side, and rubidium   *
 * ================================================================== */
/* the readout floats over the top right (the layout audit takes it as 317 x 470 px), so a page's thirteen cells
   (a dozen and rubidium) go in the L that is left: four by two beside it, then five in a row across the whole
   width below it; any other count, or a narrow window, gets a plain grid */
const RO_BOTTOM=478;
/* the labels the overview's cells had to leave out (selfTest requires none) */
let TWELVE_DROPS=0;
function twelveGeom(W,H,capY,n){
  const left=isNarrow(W)?16:40, right=W-20, top=stageTop()+30, bot=capY-14, gap=14;
  const cells=[];
  const Lshape=n===13&&!isNarrow(W)&&bot-RO_BOTTOM>=130&&RO_BOTTOM-top>=2*120;
  /* a short page (krypton, KrF and rubidium): one row beside the readout */
  if(n<=4&&!isNarrow(W)&&RO_BOTTOM-top>=240){
    const rA=W-RO_W-44, cw=(rA-left-(n-1)*gap)/n, ch=Math.min(RO_BOTTOM-top-gap,bot-top);
    for(let c=0;c<n;c++) cells.push(box(left+c*(cw+gap),top,cw,ch));
    return {cells,Lshape:false};
  }
  if(Lshape){
    const rA=W-RO_W-44, cwA=(rA-left-3*gap)/4, chA=(RO_BOTTOM-gap-top-gap)/2;
    for(let r=0;r<2;r++) for(let c=0;c<4;c++) cells.push(box(left+c*(cwA+gap),top+r*(chA+gap),cwA,chA));
    const cwB=(right-left-4*gap)/5, yB=RO_BOTTOM;
    for(let c=0;c<5;c++) cells.push(box(left+c*(cwB+gap),yB,cwB,bot-yB));
    return {cells,Lshape};
  }
  const cols=W<760?3:5, rows=Math.ceil(n/cols);
  const cw=(right-left-(cols-1)*gap)/cols, ch=(bot-top-(rows-1)*gap)/rows;
  for(let k=0;k<n;k++){ const r=Math.floor(k/cols), c=k%cols; cells.push(box(left+c*(cw+gap),top+r*(ch+gap),cw,ch)); }
  return {cells,Lshape};
}
function drawTwelve(ctx,W,H,M){
  const cap='Each line drawn as in Steck’s figures, the upper manifold above the lower, each to its own scale; the number beside a manifold is its widest splitting. Where the common isotope has no nuclear spin (I = 0) the odd one is drawn. Hydrogen to chromium a dozen at a time, then krypton beside its excimer, KrF, with rubidium on every page; press one to open it.';
  const L=fitCaption(ctx,W,H,cap,'Each manifold to its own scale; press one to open it.',Math.min(W-148,W-80),stageTop()+300);
  const G=twelveGeom(W,H,L.capY,M.twelve.length);
  TWELVE_DROPS=0;
  M.twelve.forEach((t,i)=>{
    const b=G.cells[i]; if(!b) return;
    ctx.fillStyle=t.sel?'rgba(205,53,196,0.07)':'rgba(16,19,27,0.55)'; ctx.fillRect(b.x,b.y,b.w,b.h);
    frame(ctx,b,t.sel?COL.live:'#1e2433');
    HIT.push({kind:'atom',sym:t.a.sym,b});
    /* the name, the nuclear spin, the line */
    ctx.font='bold 16px Georgia, serif'; ctx.fillStyle=COL.level; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    const nm=isoName(t.a,t.iso); ctx.fillText(nm,b.x+8,b.y+20);
    LABELS.push([b.x+8,b.y+6,b.x+8+ctx.measureText(nm).width,b.y+23]);
    lab(ctx,W,H,b.x+b.w-8,b.y+13,'I = '+jStr(t.iso.I),COL.dim,G_FONT,'right','middle');
    /* the line as its chip names it where the name is a wavelength (above 200 nm, in air, as it is quoted: krypton's

    if(t.i0) lab(ctx,W,H,b.x+8,b.y+32,isoName(t.a,t.i0)+': I = 0',COL.dim,G_FONT,'left','middle');

    const hh=b.h-54, uTop=b.y+48, uBot=uTop+0.38*hh, lTop=b.y+48+0.62*hh, lBot=b.y+b.h-8;

    const Lo=drawManifold(ctx,W,H,t.lo,Object.assign({},inner,{top:lTop,bot:Math.max(lTop+2,lBot)}));
    TWELVE_DROPS+=U.labelsDropped+Lo.labelsDropped;

    const xo=(inner.fsX0+inner.fsX1)/2;
    ctx.beginPath(); ctx.moveTo(xo,U.yc+3); ctx.lineTo(xo,Lo.yc-3); ctx.strokeStyle='rgba(207,212,222,0.35)'; ctx.lineWidth=1; ctx.stroke();
    const tag=(lv,y)=>{ const s=lv.ok&&lv.span>0?mhzShort(lv.span):lv.status==='I0'?'I = 0':lv.status==='J0'?'J = 0':'not known';
      lab(ctx,W,H,inner.hx0+2,y,s,lv.ok?COL.pos:COL.dim,G_FONT,'left','middle',PLATE); };

/* ================================================================== *
 *  the spectrum                                                       *
 * ================================================================== */
function specUnit(M){ return (M.xhi-M.xlo)>4000?{k:1e-3,u:'GHz'}:{k:1,u:'MHz'}; }
/* KrF: no components to draw, so the widths that meet on its line, one bar each on a logarithmic frequency axis, the
   widest at the top; orange as the sources print them, green computed here */
function drawLadder(ctx,W,H,M){
  const S=M.spec, Lm=S.ladder, by=id=>Lm.rows.find(r=>r.id===id), band=by('band');
  const cap='The widths that meet on KrF’s 248-nm line, on one logarithmic scale: orange as their sources print them, green computed here'
    +(S.T>0?' (the Doppler width at '+fmtT(S.T)+')':'')+'. The lower state, X, is repulsive where the light leaves it, so the line is a band about '
    +band.printed+' wide, some '+hzShort(band.hz,band.sf)+'; the widest hyperfine span of the molecule’s parts, '+Lm.wide.who+' '
    +hzShort(Lm.wide.hz,Lm.wide.sf)+', fits into it about '+toSig(Lm.ratio,band.sf)+' times. KrF’s own hyperfine structure is not known.';
  const L=fitCaption(ctx,W,H,cap,'KrF’s band beside the hyperfine and line widths, on one logarithmic scale.',Math.min(W-148,(isNarrow(W)?W-26:W-RO_W-44)-56),stageTop()+280);
  const left=isNarrow(W)?16:40, right=isNarrow(W)?W-26:W-RO_W-44;
  /* the names in a column of their own, the values past each bar's end (room kept at the right for the widest) */
  const nameW=Math.min(200,0.36*(right-left)), b=box(left+nameW,stageTop()+44,right-70-(left+nameW),L.capY-40-(stageTop()+44));
  /* a decade a label, or every second or third where they would crowd (1 µK spreads the axis over ten decades), counted
     down from the top one */
  const step=Math.max(1,Math.ceil(46/(b.w/(Lm.e1-Lm.e0)))), xt=[]; for(let e=Lm.e0;e<=Lm.e1;e++) if((Lm.e1-e)%step===0) xt.push(e);
  axesT(ctx,b,Lm.e0,Lm.e1,0,1,{title:titleFor(b,'KrF, 248 nm: the band beside the hyperfine structure','the widths'),
    xlab:'frequency width (logarithmic)',xticks:xt,xfmt:e=>hzShort(Math.pow(10,e),1),yticks:[]});
  const n=Lm.rows.length, rh=b.h/n, bh=Math.min(16,0.55*rh);
  const X=v=>b.x+b.w*(Math.log10(v)-Lm.e0)/(Lm.e1-Lm.e0);
  /* every name and value is placed where it belongs or counted as dropped (selfTest requires none) */
  let drops=0; const put=(...a)=>{ if(!lab(ctx,W,H,...a)) drops++; };
  const bars=[];
  Lm.rows.forEach((r,i)=>{
    const y=b.y+rh*(i+0.5), col=r.kind==='ref'?COL.ref:COL.pos;
    put(b.x-8,y,r.name,COL.text,SM_FONT,'right','middle',PLATE_FIX);
    if(!(r.hz>0)){ put(b.x+6,y,'none: the molecules at rest',COL.dim,G_FONT,'left','middle',PLATE_FIX); return; }
    const x1=X(r.hz);
    ctx.fillStyle=rgba(col,0.78); ctx.fillRect(b.x,y-bh/2,Math.max(1,x1-b.x),bh);
    POLY_SEGS.push(b.x,y,x1,y); bars.push({id:r.id,x1,y});
    put(x1+6,y,(r.printed?r.printed+' ≈ ':'')+hzShort(r.hz,r.sf),col,G_FONT,'left','middle',PLATE_FIX);
  });
  caption(ctx,56,L.capY,L.txt,L.capW,'#767e92',CAP_FONT);
  return {b,rh,drops,bars,xt};
}
function drawSpectrum(ctx,W,H,M){
  const S=M.spec, st=M.st;
  if(S.ladder) return drawLadder(ctx,W,H,M);
  const cap=S.comps?('The absorption of the '+lineName(S.a,S.ln)+' line of '+isoName(S.a,S.iso)+' from sublevels equally filled: each F → F′ component (orange, its height its share of the line) broadened by the natural width '
      +mhzShort(S.fwhmN)+(S.T>0?' and the Doppler width '+mhzShort(S.fwhmD)+' at '+fmtT(S.T):' alone (the atoms at rest)')+'; the green curve is their sum, scaled to its highest point.'):
      'The hyperfine constants of one of this line’s levels are not known, so its components cannot be placed.';
  const L=fitCaption(ctx,W,H,cap,'The line’s hyperfine components and their sum.',Math.min(W-148,(isNarrow(W)?W-26:W-RO_W-44)-56),stageTop()+280);
  const right=isNarrow(W)?W-26:W-RO_W-44, b=box(66,stageTop()+44,right-66,L.capY-34-(stageTop()+44));
  if(!S.comps){ frame(ctx,b,'#242a3a'); lab(ctx,W,H,b.x+b.w/2,b.y+b.h/2,'no spectrum: a hyperfine constant is missing',COL.ref,V_FONT,'center','middle'); caption(ctx,56,L.capY,L.txt,L.capW,'#767e92',CAP_FONT); return; }
  const U=specUnit(S), xlo=S.xlo*U.k, xhi=S.xhi*U.k;
  axesT(ctx,b,xlo,xhi,0,1.12,{title:titleFor(b,isoName(S.a,S.iso)+' '+lineName(S.a,S.ln)+': the hyperfine components','the components'),
    xlab:'detuning from the line’s centre of gravity ('+U.u+')',ylab:'absorption (peak = 1)',ny:4,yfmt:t=>fmt(t,1),xfmt:t=>tkS(t)});
  const peak=S.peak||1, wmax=Math.max(...S.comps.map(c=>c.w));
  /* each component's own profile, faint, then the sum */
  const xs=S.grid.map(x=>x*U.k);
  if(S.comps.length<=12) for(const c of S.comps){ const ys=S.grid.map(x=>c.w*voigt(x-c.x,S.sigD,S.gam)/peak); polyline(ctx,b,xs,ys,xlo,xhi,0,1.12,'rgba(184,236,76,0.28)',0.8); }
  polyline(ctx,b,xs,S.total.map(v=>v/peak),xlo,xhi,0,1.12,COL.pos,1.8);
  /* the sticks: heights in proportion to the components' shares, the largest at 0.95 */
  const sorted=S.comps.slice().sort((p,q)=>q.w-p.w);
  for(const c of S.comps){
    const X=b.x+b.w*(c.x*U.k-xlo)/(xhi-xlo), Y=b.y1-b.h*(0.95*c.w/wmax)/1.12;
    ctx.beginPath(); ctx.moveTo(X,b.y1); ctx.lineTo(X,Y); ctx.strokeStyle=COL.ref; ctx.lineWidth=1.6; ctx.stroke();
  }
  /* their names, the strongest first so a crowded line keeps the ones that matter */
  if(st.sSticks) for(const c of sorted){
    const X=b.x+b.w*(c.x*U.k-xlo)/(xhi-xlo), Y=b.y1-b.h*(0.95*c.w/wmax)/1.12;
    lab(ctx,W,H,X,Y-8,jStr(c.F)+'→'+jStr(c.Fp),COL.ref,G_FONT,'center','middle',PLATE);

}
function tkS(t){ const a=Math.abs(t); return a===0?'0':(t<0?'−':'')+(a>=100?fmt(a,0):a>=10?fmt(a,a%1?1:0):a>=1?fmt(a,a%1?1:0):sigf(a,2)); }

/* ================================================================== *
 *  in a magnetic field: Steck's Figures 4-6 for any level             *
 * ================================================================== */
function fieldColour(M,F){ const Fs=M.lv.Fs.map(f=>f.F).sort((p,q)=>q-p); return F_COLS[Fs.indexOf(F)%F_COLS.length]; }
function drawField(ctx,W,H,M){
  const Z=M.field;

  if(Z.none){
    const why=!Z.lv.ok?(Z.lv.status==='I0'?'this isotope has no nuclear spin: the level splits only into its 2J + 1 Zeeman sublevels':Z.lv.status==='J0'?'J = 0: only the nucleus’s own tiny Zeeman effect':'its hyperfine constant is not known'):'its gJ is not an LS value and was not found measured';
    const b=box(66,stageTop()+44,(isNarrow(W)?W-26:W-RO_W-44)-66,H-200);

  }

    +sigf(Z.Bc,2)+' G, where the Zeeman energy reaches the widest hyperfine interval, the nucleus lets go and the levels regroup by mJ (the hyperfine Paschen–Back effect). Each colour is one F at zero field; every curve is an eigenvalue of the full Hamiltonian.';

  const right=isNarrow(W)?W-26:W-RO_W-44, b=box(76,stageTop()+44,right-76-74,L.capY-34-(stageTop()+44));

  /* the marker */

  for(const s of Z.at){ const Y=b.y1-b.h*(s.E*k-ylo)/(yhi-ylo); dot(ctx,X,Y,2.6,COL.live); }
  HIT.push({kind:'fieldB',b,Bmax:Z.Bmax});
  /* the names: F at zero field (left), mJ at the right edge */

  Fs.forEach((f,i)=>lab(ctx,W,H,b.x+6,ly[i],'F = '+jStr(f.F),fieldColour(Z,f.F),'bold 11px Georgia, serif','left','middle',PLATE));
  const mjs=mList(Z.lv.J).slice().reverse(), yr=[];

}

/* ================================================================== *
 *  the sublevels: every mF, and the transitions one polarisation      *
 *  drives from one lower F                                            *
 * ================================================================== */
function drawSublevels(ctx,W,H,M){
  const S=M.sub, st=M.st, lo=S.lo, up=S.up;
  const pol=S.q===1?'σ⁺':S.q===-1?'σ⁻':'π';
  if(!(lo.ok||lo.status==='J0'||lo.status==='I0')||!(up.ok||up.status==='J0'||up.status==='I0')){
    const b=box(66,stageTop()+44,(isNarrow(W)?W-26:W-RO_W-44)-66,H-200); frame(ctx,b,'#242a3a');
    lab(ctx,W,H,b.x+b.w/2,b.y+b.h/2,'a hyperfine constant of this line is not known: its sublevels cannot be ordered',COL.ref,V_FONT,'center','middle'); return; }
  const cap='Every magnetic sublevel of the '+lineName(S.a,S.ln)+' line of '+isoName(S.a,S.iso)+' (the rows are the F levels in their order of energy, not to scale) and the transitions that '+pol+' light drives from F = '+jStr(S.F)
    +'. Each line’s width follows its strength, the square of the dipole matrix element in units of |⟨J‖er‖J′⟩|²'+(st.subNum?', printed beside it':'')+' (Steck’s Tables 9–20 print its square root).'
    +(S.cyc&&S.q===1&&S.F===S.cyc.F?' In magenta, the cycling transition: from the stretched sublevel, σ⁺ light can only reach F′ = '+jStr(S.cyc.Fp)+', which can only decay back.':'');
  const L=fitCaption(ctx,W,H,cap,'The sublevels and the transitions one polarisation drives.',Math.min(W-148,(isNarrow(W)?W-26:W-RO_W-44)-56),stageTop()+300);
  const left=66, right=isNarrow(W)?W-26:W-RO_W-44, top=stageTop()+40, bot=L.capY-34;
  const Fmax=Math.max(...lo.Fs.map(f=>f.F),...up.Fs.map(f=>f.F));
  const xc=(left+right)/2+20, dx=Math.min(56,(right-left-120)/(2*Fmax+1)), bw=Math.min(34,dx*0.7);
  const upRows=up.byE.slice().reverse(), loRows=lo.byE.slice().reverse();
  /* the upper rows share the top half, the lower rows the bottom third: every row keeps room under it for the
     strengths of the lines that end on it */
  const nU=upRows.length, nL=loRows.length;
  const uH=Math.min(60,(bot-top)*0.52/Math.max(1,nU)), lH=Math.min(44,(bot-top)*0.3/Math.max(1,nL));
  const yU=k=>top+10+k*uH, yL=k=>bot-12-(nL-1-k)*lH;
  const pos={};
  const place=(f,y,which)=>{ for(const m of mList(f.F)) pos[which+f.F+':'+m]=[xc+m*dx,y]; };
  upRows.forEach((f,k)=>place(f,yU(k),'up')); loRows.forEach((f,k)=>place(f,yL(k),'lo'));
  /* the transitions first, strongest last so they sit on top; the sublevels are drawn over their ends */
  const tr=S.tr.filter(t=>t.d2>1e-12).sort((p,q)=>p.d2-q.d2), dmax=Math.max(1e-9,...tr.map(t=>t.d2));

    const cyc=S.cyc&&S.q===1&&t.F===S.cyc.F&&t.mF===S.cyc.mF&&t.Fp===S.cyc.Fp;
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b2[0],b2[1]);
    ctx.strokeStyle=cyc?COL.live:rgba(COL.struct,0.25+0.65*t.d2/dmax); ctx.lineWidth=0.6+3.2*t.d2/dmax; ctx.stroke();
    POLY_SEGS.push(a[0],a[1],b2[0],b2[1]);
  }
  const drawRow=(f,y,which,act)=>{
    lab(ctx,W,H,left,y,(which==='up'?'F′ = ':'F = ')+jStr(f.F),act?COL.level:COL.dim,act?F_FONT:'13px Georgia, serif','left','middle');
    for(const m of mList(f.F)){ const X=xc+m*dx; hLine(ctx,X-bw/2,X+bw/2,y,act?COL.level:'#5a6276',act?2:1.4); }
  };
  upRows.forEach((f,k)=>drawRow(f,yU(k),'up',true));
  loRows.forEach((f,k)=>drawRow(f,yL(k),'lo',f.F===S.F));
  loRows.forEach((f,k)=>HIT.push({kind:'subF',F:f.F,b:box(left-4,yL(k)-lH/2+2,right-left,lH-4)}));
  /* each line's strength just under the upper sublevel it reaches (one line reaches each, for one F and one
     polarisation) */
  if(st.subNum) for(const t of S.tr.filter(t=>t.d2>1e-12).sort((p,q)=>q.d2-p.d2)){
    const b2=pos['up'+t.Fp+':'+t.mFp]; if(!b2) continue;
    lab(ctx,W,H,b2[0],b2[1]+10,fracStr(t.d2,100000),COL.text,'9.5px -apple-system, sans-serif','center','middle',PLATE_FIX); }
  /* the mF scale under the lowest row */
  for(const m of mList(Fmax)) lab(ctx,W,H,xc+m*dx,yL(nL-1)+16,(m>0?'+':'')+jStr(m),COL.dim,G_FONT,'center','middle');
  lab(ctx,W,H,xc-(Fmax+1)*dx+6,yL(nL-1)+16,'mF',COL.dim,'italic 10.5px Georgia, serif','right','middle');
