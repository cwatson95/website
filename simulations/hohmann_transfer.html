<title>The Hohmann transfer &mdash; periapsis, apoapsis and the two burns</title>
<!--
  ===================================================================
  hohmann_transfer.html — periapsis and apoapsis, the Hohmann transfer
  between two circular orbits, why its burns go at the apsides, what
  it costs against the alternatives, when to leave for another planet,
  and how the apsides themselves turn
  ===================================================================

  Six views.  THE APSIDES: an ellipse round the Earth, the Moon, Mars,
  Jupiter or the Sun drawn to scale with its focus, centre and empty
  focus; the nearest and farthest points under the names each body
  gives them (perigee/apogee, perilune/apolune, periareion/apoareion,
  perijove/apojove, perihelion/aphelion); a craft moving by Kepler's
  equation, twelve wedges of equal time and equal area, r(t), v(t) and
  the hodograph (every velocity on one circle).  THE TRANSFER: half an
  ellipse from the inner circle to the outer, a burn at each apsis, the
  speed through the mission (two forward burns end slower than they
  began) and the energy (both burns raise it).  ONE BURN: any delta-v,
  anywhere, in any direction in the plane: the new periapsis and
  apoapsis, the apse line turned, escape, a periapsis in the ground;
  the same burn scanned round the orbit (the Oberth effect).  THE
  BUDGET: the Hohmann cost against the ratio of radii (its peak at
  15.58, the escape limit sqrt2 - 1), the bi-elliptic transfer (the
  break-even 11.94, the least intermediate apoapsis), the bi-parabolic
  limit and the slow spiral.  THE WINDOW: the Earth and a planet on
  Hohmann's circles, the phase angle, the synodic period, the dates of
  the windows, the wait for the way home, and every Mars launch since
  1960 against the model's windows.  THE PRECESSION: the Earth's J2
  turning the apse line and the node (integrated, and against the
  first-order rates), the critical inclination 63.4 deg and Molniya;
  and relativity turning Mercury's perihelion, exaggerated, against
  the exact orbit equation.

  WHAT IS MEASURED OR PUBLISHED (build_hohmann/data/, fetched 2026-09-23)
  -----------------------------------------------------------------------
  JPL Solar System Dynamics: GM of the Sun, Earth, Moon, and the Mars and
  Jupiter systems (DE440), the au, c, the sidereal day; equatorial radii
  and sidereal orbital periods; the Moon's radius; the mean elements of
  the Moon, Phobos and Deimos; E. M. Standish's Keplerian elements,
  Table 1 (1800-2050 AD); 1P/Halley from the Small-Body Database.
  Wikipedia (wikitext): the apsis names; the Hohmann and bi-elliptic
  worked examples and Escobal's table; the Oberth effect's Jupiter
  example; the ISS, GTO, Molniya, GEO, the Moon's orbit, Juno and MAVEN;
  J2 = 1.08262668e-3 with R_E = 6378.137 km (Nodal precession); the J2
  rates (Molniya orbit); Mercury's 42.9799"/cy (Tests of general
  relativity); the list of missions to Mars (53 launches).

  WHAT IS COMPUTED HERE AND CHECKED BY build_hohmann/derive.py
  ------------------------------------------------------------
  Kepler's equation (bracketed Newton; 40-digit bisection in the twin);
  every orbit's period, apsides and positions (DOP853 from periapsis in
  the twin, no Kepler equation); the Hohmann delta-v in a form that does
  not cancel (40-digit naive forms in the twin), its peak three ways, the
  coast by DOP853; the bi-elliptic break-even and least apoapsis (40-digit
  roots); the burns (the new apsides and apse line measured by DOP853);
  Table 1 positions (matrix products in the twin), the windows (closed
  form; brentq in the twin), the phase at 53 launches; the J2 run (RK4,
  twinned operation for operation, against DOP853); the GR advance (a
  Gauss-Legendre quadrature of the orbit equation against mpmath, and an
  RK4 run against both).

  WHAT IS MODELLED
  ----------------
  Two bodies, a point mass (and J2 in the last view); burns are
  instantaneous; the transfer's circles are coplanar; the window view
  puts the planets on Hohmann's circles at Table 1's mean motions (the
  real, eccentric orbits are drawn beside them), and a real launch is
  not a Hohmann transfer (Type I and II trajectories, the planets'
  eccentricity and tilt); the slow spiral is its low-thrust limit
  v1 - v2; J2 alone (no drag, Sun or Moon); relativity as the 1/c^2 term
  of the Schwarzschild orbit equation, exaggerated on the drawing.

  KNOWN-BAD: DO NOT REINTRODUCE (details in the Agent repo,
  projects/simulations/CHANGELOG.md, 2026-09-23 (a))
  ---------------------------------------------------------
  - A curve sampled evenly in time steps over a deep periapsis: sample
    an orbit in E and draw each burn as a step at its instant (the
    mission plot missed LEO-to-Moon's 10.8 km/s perigee).
  - Split-and-sort drawing of a conic draws a chord: build each half
    from its range of anomaly.
  - Every caption that states a direction or a count is read in every
    state: inward burns slow the craft, a circle has no apsides, k = 1
    does not show the turn, the J2 track is gold.
  - A label crossed by a line sits on a plate; a label naming a line
    stays on it or is dropped; where a dash would run on under a
    decimal point the label moves (Earth to Mars read "2,945").
  - Only entities HTML5 has (it has no frac32 and no sup4): assemble.py
    refuses the page otherwise.  Powers of ten in superscripts, never a
    caret (this page's sigf).
  - A drag test proves the held pointer idle before the move: the
    press leaves its own repaint pending.
  - Presets are checked physically (an inward turn at 120 deg once flew
    into the ground); a published worked example is recomputed from
    unrounded values (Wikipedia's 2.42 + 1.46 = 3.88 subtracts speeds
    already rounded).
-->

'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* a power of ten in superscripts, never a caret: 1.768 × 10⁸, 2.5 × 10⁻⁵ */
  if(a>=1e5||a<1e-4){ const s=x.toExponential(n-1), k=s.indexOf('e'), SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return s.slice(0,k)+' × 10'+String(+s.slice(k+1)).split('').map(c=>c==='-'?'⁻':SUP[+c]).join(''); }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',

/* ================================================================== *
 *  physics — two-body orbits, the Hohmann and bi-elliptic transfers,  *
 *  one impulsive burn, Table 1 planets and the windows, J2 and GR.    *
 *  Twin: build_hohmann/derive.py (mpmath, scipy DOP853, quad); every  *
 *  number below is pinned in selfTest against REF.                    *
 *  Units: km, s, km/s; angles in radians unless a name says Deg.      *
 * ================================================================== */
const AU_KM=DATA.au_m.value/1000;
const C_KMS=DATA.c_ms.value/1000;
const DAY_S=DATA.day_s.value;
const JCENT=DATA.jcent_d.value;
const TSID=DATA.sidday_s.value;
const J2E=DATA.J2_earth.value*1e-3;
const J2000=2451545.0;
const DEG=PI/180, RAD=180/PI;
/* the names of the apsides come from Wikipedia's "Apsis" table of suffixes; the one irregular
   form, aphelion (the o of apo- elided before the h of helion), is quoted from the same page */
const unq=s=>String(s).replace(/''/g,'');
function apsisNames(key){
  const sfx=DATA['name_'+key].text.slice(1);
  return {peri:'peri'+sfx, apo:key==='sun'?unq(DATA.name_aphelion.text):'apo'+sfx};
}
const BODIES={
  earth:  {id:'earth',  name:'Earth',   mu:DATA.GM_earth.value,        R:DATA.R_E_J2.value*1e3, col:'#3f7fc6'},
  moon:   {id:'moon',   name:'the Moon',mu:DATA.GM_moon.value,         R:DATA.R_moon.value,     col:'#9aa0ab'},
  mars:   {id:'mars',   name:'Mars',    mu:DATA.GM_mars.value,         R:DATA.R_mars.value,     col:'#c0643c'},
  jupiter:{id:'jupiter',name:'Jupiter', mu:DATA.GM_jupiter.value,      R:DATA.R_jupiter.value,  col:'#c8a47c'},
  sun:    {id:'sun',    name:'the Sun', mu:DATA.GM_sun.value*1e11,     R:DATA.R_sun.value,      col:'#f3d36b'},
};
for(const k in BODIES) Object.assign(BODIES[k],apsisNames(k));
const MU_E=BODIES.earth.mu, RE=BODIES.earth.R, MU_S=BODIES.sun.mu;

/* ---------------- the ellipse from its two apsides ---------------- */
function orbitFromApsides(mu,rp,ra){
  const a=(rp+ra)/2, e=(ra-rp)/(ra+rp), p=2*rp*ra/(rp+ra), h=Math.sqrt(mu*p), T=TAU*Math.sqrt(a*a*a/mu);
  return {mu,rp,ra,a,e,p,b:Math.sqrt(rp*ra),h,T,n:TAU/T,vp:h/rp,va:h/ra,eps:-mu/(2*a)};
}
function visViva(mu,r,a){ return Math.sqrt(mu*(2/r-1/a)); }
function vCirc(mu,r){ return Math.sqrt(mu/r); }
function vEsc(mu,r){ return Math.sqrt(2*mu/r); }

/* Kepler's equation E - e sin E = M, 0 <= e < 1: Newton kept inside a bracket that always holds the
   root (|E - M| <= e), so it cannot wander however close e is to 1 or M to 0 */
function keplerE(M,e){
  if(e===0) return M;
  const k=Math.round(M/TAU), m=M-k*TAU;
  let lo=m-e, hi=m+e, E=e<0.8?m:(m>=0?PI:-PI);
  if(E<lo||E>hi) E=m;
  for(let it=0;it<80;it++){
    const f=E-e*Math.sin(E)-m;
    if(f>0) hi=E; else lo=E;
    let En=E-f/(1-e*Math.cos(E));
    if(!(En>lo&&En<hi)) En=(lo+hi)/2;
    if(Math.abs(En-E)<=1e-15*Math.max(1,Math.abs(E))){ E=En; break; }
    E=En;
  }
  return E+k*TAU;
}
/* the hyperbolic form e sinh H - H = M, e > 1: the root lies in [asinh(M/e), asinh(M/(e-1))] */
function keplerH(M,e){
  const s=M<0?-1:1, m=Math.abs(M);
  if(m===0) return 0;
  let lo=Math.asinh(m/e), hi=Math.asinh(m/(e-1)), H=Math.asinh(m/e)+0.5*(hi-lo);
  for(let it=0;it<120;it++){
    const f=e*Math.sinh(H)-H-m;
    if(f>0) hi=H; else lo=H;
    let Hn=H-f/(e*Math.cosh(H)-1);
    if(!(Hn>lo&&Hn<hi)) Hn=(lo+hi)/2;
    if(Math.abs(Hn-H)<=1e-15*Math.max(1,H)){ H=Hn; break; }
    H=Hn;
  }
  return s*H;
}
function trueFromE(E,e){ return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2)); }
function EfromTrue(nu,e){ return 2*Math.atan2(Math.sqrt(1-e)*Math.sin(nu/2),Math.sqrt(1+e)*Math.cos(nu/2)); }
function trueFromH(H,e){ return 2*Math.atan(Math.sqrt((e+1)/(e-1))*Math.tanh(H/2)); }
/* the position and velocity on a conic of semi-latus rectum p at true anomaly nu (periapsis on +x) */
function perifocal(mu,p,e,nu){
  const c=Math.cos(nu), s=Math.sin(nu), r=p/(1+e*c), k=Math.sqrt(mu/p);
  return {r,x:r*c,y:r*s,vx:-k*s,vy:k*(e+c),v:k*Math.sqrt(1+2*e*c+e*e),nu};
}
/* the state a time t after periapsis on the ellipse O */
function stateAt(O,t){
  const M=O.n*t, E=keplerE(M,O.e), nu=trueFromE(E,O.e);
  return Object.assign(perifocal(O.mu,O.p,O.e,nu),{E,M});
}
/* the time after periapsis at true anomaly nu, in [0, T) */
function timeAt(O,nu){
  const E=EfromTrue(nu,O.e); let t=(E-O.e*Math.sin(E))/O.n;
  t=t-O.T*Math.floor(t/O.T); return t;
}
function flightPathAngle(e,nu){ return Math.atan2(e*Math.sin(nu),1+e*Math.cos(nu)); }
/* the share of the period spent beyond the minor axis (E in (pi/2, 3pi/2)) and beyond the line
   through the focus square to the apse line (nu in (pi/2, 3pi/2)) */
function dwellMinor(e){ return 0.5+e/PI; }
function dwellFocus(e){ return 1-(Math.acos(e)-e*Math.sqrt(1-e*e))/PI; }
/* the hodograph: every velocity of the orbit lies on a circle of radius mu/h centred (0, e mu/h) */
function hodograph(O){ return {cy:O.e*O.mu/O.h, rad:O.mu/O.h}; }

/* ---------------- the Hohmann transfer ---------------- */
/* dv/v1 for the two burns in terms of R = r2/r1, written so nothing cancels: sqrt(2R/(1+R)) - 1
   = ((R - 1)/(1 + R))/(q + 1) with q = sqrt(2R/(1+R)); negative for R < 1 (retrograde burns) */
function hohDv1(R){ const q=Math.sqrt(2*R/(1+R)); return (R-1)/((1+R)*(q+1)); }
function hohDv2(R){ const q=Math.sqrt(2/(1+R)); return (R-1)/((1+R)*(1+q))/Math.sqrt(R); }
function hohTot(R){ return Math.abs(hohDv1(R))+Math.abs(hohDv2(R)); }
function hohmann(mu,r1,r2){
  const R=r2/r1, v1=vCirc(mu,r1), v2=vCirc(mu,r2), at=(r1+r2)/2, rp=Math.min(r1,r2), ra=Math.max(r1,r2);
  const dv1=v1*hohDv1(R), dv2=v1*hohDv2(R);
  return {mu,r1,r2,R,v1,v2,at,et:(ra-rp)/(ra+rp),rp,ra,vp:visViva(mu,rp,at),va:visViva(mu,ra,at),
          dv1,dv2,dvt:Math.abs(dv1)+Math.abs(dv2),t:PI*Math.sqrt(at*at*at/mu),out:r2>=r1,
          T1:TAU*Math.sqrt(r1*r1*r1/mu),T2:TAU*Math.sqrt(r2*r2*r2/mu)};

/* the ratio where the total peaks: the real root of x^3 - 15x^2 - 9x - 1, 5 + 4 sqrt7 cos(atan(sqrt3/37)/3) */
const R_MAX=5+4*Math.sqrt(7)*Math.cos(Math.atan(Math.sqrt(3)/37)/3);
/* the break-even with the bi-parabolic limit: the root of R^3 - (7+4sqrt2)R^2 + (3+4sqrt2)R - 1 above 1 */
function bisect(f,lo,hi,n){ let flo=f(lo); for(let i=0;i<(n||100);i++){ const m=(lo+hi)/2, fm=f(m); if((fm<0)===(flo<0)){ lo=m; flo=fm; } else hi=m; } return (lo+hi)/2; }
const R_STAR=bisect(R=>R*R*R-(7+4*Math.SQRT2)*R*R+(3+4*Math.SQRT2)*R-1,5,30,90);
function biEll(R,al){
  const d1=Math.sqrt(2*al/(1+al))-1, d2=Math.sqrt(1/al)*(Math.sqrt(2*R/(R+al))-Math.sqrt(2/(1+al))),
        d3=Math.sqrt(1/R)*(Math.sqrt(2*al/(R+al))-1);
  return {d1,d2,d3,tot:d1+d2+d3};
}
function biParabolic(R){ return (Math.SQRT2-1)*(1+1/Math.sqrt(R)); }
function spiralDv(R){ return Math.abs(1-1/Math.sqrt(R)); }
/* the smallest intermediate apoapsis (in r1) for which a bi-elliptic transfer beats Hohmann:
   none below R*, R itself above R_max, else the root in log(alpha) of the difference */
function alphaMin(R){
  if(!(R>R_STAR)) return Infinity;
  if(R>=R_MAX) return R;
  const g=la=>biEll(R,Math.exp(la)).tot-hohTot(R);
  return Math.exp(bisect(g,Math.log(R*1.000001),Math.log(1e15),200));
}
/* the burn from a 300-km (6,678-km) circle that leaves the Earth with v_inf: sqrt(v_inf^2 + v_esc^2) - v_circ */
function leoDepart(vinf){ const r=DATA.hoh_r1_km.value; return Math.sqrt(vinf*vinf+2*MU_E/r)-vCirc(MU_E,r); }
function biTime(mu,r1,r2,rb){ const a1=(r1+rb)/2, a2=(r2+rb)/2; return PI*Math.sqrt(a1*a1*a1/mu)+PI*Math.sqrt(a2*a2*a2/mu); }

/* ---------------- one impulsive burn ---------------- */
/* a conic from a planar state (the focus at the origin): h > 0 counter-clockwise */
function conicFromState(mu,x,y,vx,vy){
  const r=Math.hypot(x,y), v2=vx*vx+vy*vy, h=x*vy-y*vx, rv=x*vx+y*vy, c=v2-mu/r;
  const ex=(c*x-rv*vx)/mu, ey=(c*y-rv*vy)/mu, e=Math.hypot(ex,ey), p=h*h/mu, eps=v2/2-mu/r;
  const circ=e<1e-9, bound=eps<0&&e<1-1e-9;
  return {h,e,p,eps,w:circ?0:Math.atan2(ey,ex),rp:p/(1+e),ra:bound?p/(1-e):Infinity,a:eps!==0?-mu/(2*eps):Infinity,
          bound,circ,parab:Math.abs(e-1)<=1e-9,vinf:eps>0?Math.sqrt(2*eps):0,dir:h>=0?1:-1};
}
/* the base conic has its periapsis rp on +x, eccentricity e (e >= 1 allowed), and is flown counter-
   clockwise; the burn at true anomaly nu adds dv at angle psi from the velocity, turned toward the

/* ---------------- relativity: the perihelion advance ---------------- */
/* the orbit equation u'' + u = GM/h^2 + 3 GM u^2/c^2 with turning points u1 = 1/ra, u2 = 1/rp

   from periapsis to apoapsis Phi = int_0^pi dchi/sqrt((2GM/c^2)(u3 - u(chi))) with
   u = (u1+u2)/2 + (u2-u1)/2 cos chi; the advance per orbit is 2 Phi - 2 pi.  The integrand is
   smooth, so a composite Gauss-Legendre rule reaches the double-precision floor */

const LIM={Rmin:1, Rmax:1000, alMax:1e6, dvMin:0.01, dvMax:30, eMax:1.5, jdMin:jdFromYMD(1960,1,1), jdMax:jdFromYMD(2045,12,31), klogMax:6, daysMax:360};
/* the log sliders' span per body (radii from the centre, km) */
const RSPAN={earth:[RE+100,RE+1.5e6], moon:[BODIES.moon.R+10,BODIES.moon.R+1e5], mars:[BODIES.mars.R+50,BODIES.mars.R+3e5],
             jupiter:[BODIES.jupiter.R+1000,2e7], sun:[0.1*AU_KM,60*AU_KM]};
function rOfU(body,u){ const s=RSPAN[body]; return Math.exp(Math.log(s[0])+clamp(u,0,1)*(Math.log(s[1])-Math.log(s[0]))); }
function uOfR(body,r){ const s=RSPAN[body]; return clamp((Math.log(r)-Math.log(s[0]))/(Math.log(s[1])-Math.log(s[0])),0,1); }
const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the clocks: one frame is 1/60 s of wall time ---- */
const SIM={ta:0, tt:0, pt:0};
const FRAME=1/60;
function simReset(){ SIM.ta=0; SIM.tt=0; SIM.pt=0; }
function viewAnimates(st){
  return (st.view==='apsides'&&st.anim)||(st.view==='transfer'&&st.tanim)||(st.view==='window'&&st.wrun)||(st.view==='precession'&&st.panim);
}
function runStep(st){
  if(!viewAnimates(st)) return false;
  if(st.view==='apsides'){ SIM.ta+=FRAME/st.orbitS; SIM.ta-=Math.floor(SIM.ta); }             /* in periods */
  else if(st.view==='transfer'){ SIM.tt+=FRAME/TRANSFER_S; SIM.tt-=Math.floor(SIM.tt); }        /* in loops */
  else if(st.view==='window'){ st.jd=Math.min(LIM.jdMax,st.jd+FRAME*st.wspeed); if(st.jd>=LIM.jdMax) st.wrun=false; }
  else if(st.view==='precession'){ SIM.pt+=FRAME/PREC_S; SIM.pt-=Math.floor(SIM.pt); }
  return true;
}
const TRANSFER_S=9, PREC_S=10;

/* ---- the apsides ---- */
function apsModel(st){
  const B=BODIES[st.body], rp=st.rp, ra=st.ra;
  const O=orbitFromApsides(B.mu,rp,ra);
  const t=SIM.ta*O.T, S=stateAt(O,t);
  /* r(t), v(t) sampled evenly in the eccentric anomaly (dense at periapsis, where they change fast), the
     hodograph evenly in the true anomaly (evenly round its circle): evenly in time, a comet's perihelion
     passage gets one sample and its hodograph draws as a cone */
  const curves=memo('apc',[st.body,rp,ra].join(),()=>{ const ts=[], rs=[], vs=[], hx=[], hy=[], k=O.mu/O.h;
    for(let i=0;i<=240;i++){ const E=TAU*i/240, r=O.a*(1-O.e*Math.cos(E)); ts.push((E-O.e*Math.sin(E))/TAU); rs.push(r); vs.push(visViva(O.mu,r,O.a));
      const nu=TAU*i/240; hx.push(-k*Math.sin(nu)); hy.push(k*(O.e+Math.cos(nu))); }
    return {ts,rs,vs,hx,hy}; });
  const wedges=[]; for(let k=0;k<12;k++) wedges.push(stateAt(O,O.T*k/12).nu);
  return {B,O,rp,ra,t,S,gamma:flightPathAngle(O.e,S.nu),fMinor:dwellMinor(O.e),fFocus:dwellFocus(O.e),hodo:hodograph(O),
          curves,wedges,circ:O.e<1e-12,inside:rp<B.R};
}

/* ---- the transfer: a loop of half an inner orbit, the coast, half an outer ---- */
function transferModel(st){
  const B=BODIES[st.tbody], H=hohmann(B.mu,st.r1,st.r2);
  const pre=Math.min(H.T1/2,H.t/2), post=Math.min(H.T2/2,H.t/2), span=pre+H.t+post;
  const t=-pre+SIM.tt*span;
  const craft=transferState(H,t);
  const TO=orbitFromApsides(B.mu,H.rp,H.ra);
  /* the mission's speed and energy: the circles are flat, the coast is sampled evenly in the eccentric
     anomaly (evenly in time steps over a deep periapsis: from LEO toward the Moon the speed falls from
     10.8 to 5 km/s within the first hour of a five-day coast), and each burn is a step at its instant */
  const curves=memo('trc',[st.tbody,st.r1,st.r2].join(),()=>{ const ts=[], vs=[], ke=[], pe=[], te=[], rs=[];
    const put=(tt,r,v)=>{ ts.push(tt); vs.push(v); rs.push(r); ke.push(v*v/2); pe.push(-B.mu/r); te.push(v*v/2-B.mu/r); };
    for(let i=0;i<24;i++) put(-pre*(24-i)/24,H.r1,H.v1);
    put(0,H.r1,H.v1);
    const n=TAU/TO.T, E0=H.out?0:PI, t0=(E0-TO.e*Math.sin(E0))/n;
    for(let i=0;i<=360;i++){ const E=E0+PI*i/360, r=TO.a*(1-TO.e*Math.cos(E));
      put(clamp((E-TO.e*Math.sin(E))/n-t0,0,H.t),r,Math.sqrt(B.mu*(2/r-1/TO.a))); }
    for(let i=0;i<=24;i++) put(H.t+post*i/24,H.r2,H.v2);
    return {ts,vs,rs,ke,pe,te}; });
  return {B,H,TO,pre,post,span,t,craft,curves,phase:t<0?0:t<=H.t?1:2};
}
/* where the craft is at mission time t (0 = the first burn at +x); outward the transfer's periapsis is
   the first burn, inward its apoapsis */
function transferState(H,t){
  const mu=H.mu;
  if(t<0){ const th=TAU*t/H.T1, v=H.v1; return {x:H.r1*Math.cos(th),y:H.r1*Math.sin(th),vx:-v*Math.sin(th),vy:v*Math.cos(th),r:H.r1,v}; }
  if(t<=H.t){
    const O=orbitFromApsides(mu,H.rp,H.ra);
    if(H.out){ const q=stateAt(O,t); return {x:q.x,y:q.y,vx:q.vx,vy:q.vy,r:q.r,v:q.v}; }
    const q=stateAt(O,t+O.T/2); return {x:-q.x,y:-q.y,vx:-q.vx,vy:-q.vy,r:q.r,v:q.v};
  }
  const th=PI+TAU*(t-H.t)/H.T2, v=H.v2;
  return {x:H.r2*Math.cos(th),y:H.r2*Math.sin(th),vx:-v*Math.sin(th),vy:v*Math.cos(th),r:H.r2,v};
}

/* ---- one burn ---- */
function burnModel(st){
  const B=BODIES[st.bbody], e=clamp(st.be,0,LIM.eMax), lim=nuLimit(e), nu=clamp(st.bnu*DEG,-lim,lim);
  const K=applyBurn(B.mu,st.brp,e,nu,st.bdv,st.bpsi*DEG);
  const scan=memo('bsc',[st.bbody,st.brp,e,st.bdv,st.bpsi].join(),()=>{ const nus=[], rp=[], ra=[], dE=[], esc=[];
    for(let i=0;i<=240;i++){ const n=-lim+2*lim*i/240, q=applyBurn(B.mu,st.brp,e,n,st.bdv,st.bpsi*DEG);
      nus.push(n); rp.push(q.rp); ra.push(q.ra); dE.push(q.dE); esc.push(!q.bound); }
    return {nus,rp,ra,dE,esc}; });
  const base=conicFromState(B.mu,K.x,K.y,K.vx0,K.vy0);
  const atPeri=applyBurn(B.mu,st.brp,e,0,st.bdv,st.bpsi*DEG);
  return {B,e,nu,K,scan,base,atPeri,rp0:st.brp,ra0:e<1?st.brp*(1+e)/(1-e):Infinity,
          hits:K.rp<B.R&&K.dir*K.h>=0, dw:K.circ||base.circ?NaN:wrapPi(K.w-base.w)};
}
function wrapPi(a){ return a-TAU*Math.round(a/TAU); }

/* ---- the budget ---- */
function budgetModel(st){
  const R=clamp(st.R,LIM.Rmin,LIM.Rmax), al=clamp(st.al,Math.max(R,1),LIM.alMax), P=BUD_PRESETS.find(p=>p.id===st.bud)||BUD_PRESETS[1];
  const B=BODIES[P.body], r1=P.r1, v1=vCirc(B.mu,r1);
  const H={d1:hohDv1(R),d2:hohDv2(R)}; H.tot=Math.abs(H.d1)+Math.abs(H.d2);
  const BE=biEll(R,al);
  const curves=memo('buc',String(al),()=>{ const Rs=[], ho=[], be=[], bp=[], sp=[];
    for(let i=0;i<=300;i++){ const r=Math.pow(10,3*i/300); Rs.push(r); ho.push(hohTot(r)); be.push(r<=al?biEll(r,al).tot:NaN); bp.push(biParabolic(r)); sp.push(spiralDv(r)); }
    return {Rs,ho,be,bp,sp}; });
  return {R,al,P,B,r1,v1,H,BE,bp:biParabolic(R),sp:spiralDv(R),amin:alphaMin(R),
          tH:PI*Math.sqrt(Math.pow((r1+R*r1)/2,3)/B.mu), tBE:biTime(B.mu,r1,R*r1,al*r1),curves,wins:BE.tot<H.tot};
}

/* ---- the window ---- */
function windowView(st){
  const W=windowModel(st.target), jd=clamp(st.jd,LIM.jdMin,LIM.jdMax);
  const ph=wrapDeg(lonMean(st.target,jd)-lonMean('embary',jd)), phT=wrapDeg(lonTrue(st.target,jd)-lonTrue('embary',jd));
  const next=nextPhase(W,jd,W.phi);
  const prev=next-W.S;
  /* the transfer drawn is the last one that has left (if it is still in flight) or the next one */
  const inFlight=jd>=prev&&jd<=prev+W.tH, dep=inFlight?prev:next, arr=dep+W.tH;
  const back=nextPhase(W,arr,W.phir);
  const launches=st.target==='mars'?memo('launch','m',()=>marsLaunches(W)):null;
  return {W,jd,ph,phT,next,dep,arr,inFlight,back,wait:back-arr,round:back+W.tH-dep,launches,
          E:{m:lonMean('embary',jd),t:planetPos('embary',jd)},P:{m:lonMean(st.target,jd),t:planetPos(st.target,jd)}};
}
/* every launch in Wikipedia's list of Mars missions: the phase of Mars ahead of the Earth that day, by
   mean and true longitudes, and the days from the nearest window of the circular model */
function marsLaunches(W){
  const w0=windowsBetween(W,jdFromYMD(2016,1,1),jdFromYMD(2017,1,1))[0];
  return DATA.mars_launches.map(x=>{ const d=x.date.split('-').map(Number), jd=jdFromYMD(d[0],d[1],d[2]);
    const k=Math.round((jd-w0)/W.S); let near=w0+k*W.S;
    for(const dk of [-1,1]){ const c=w0+(k+dk)*W.S; if(Math.abs(c-jd)<Math.abs(near-jd)) near=c; }
    return {date:x.date,num:x.num,name:x.name,craft:x.craft,jd,dm:wrapDeg(lonMean('mars',jd)-lonMean('embary',jd)),
            dt:wrapDeg(lonTrue('mars',jd)-lonTrue('embary',jd)),off:jd-near}; });
}
function launchStats(L){
  const num=L.filter(l=>l.num!==null), off=num.map(l=>l.off).sort((a,b)=>a-b), q=f=>off[Math.floor(f*off.length)];
  return {n:num.length,med:q(0.5),q1:q(0.25),q3:q(0.75),min:off[0],max:off[off.length-1],within30:num.filter(l=>Math.abs(l.off)<=30).length,
          within60:num.filter(l=>Math.abs(l.off)<=60).length};
}

/* ---- the precession ---- */
function precModel(st){
  if(st.pmode==='gr'){
    const a=T1a('mercury'), e=T1e('mercury'), rp=a*(1-e), ra=a*(1+e), k=Math.pow(10,clamp(st.klog,0,LIM.klogMax)), c2=C_KMS*C_KMS/k;
    const run=memo('gr',String(k),()=>grRun(MU_S,rp,ra,c2,8,4));
    const P=TAU*Math.sqrt(a*a*a/MU_S), real=grExact(MU_S,rp,ra,C_KMS*C_KMS);
    const curve=memo('grc','c',()=>{ const ks=[], ex=[], fo=[]; for(let i=0;i<=60;i++){ const kk=Math.pow(10,LIM.klogMax*i/60), g=grExact(MU_S,rp,ra,C_KMS*C_KMS/kk); ks.push(kk); ex.push(g.adv); fo.push(g.first); } return {ks,ex,fo}; });
    return {mode:'gr',a,e,rp,ra,k,c2,run,P,real,cy:real.adv*(JCENT*DAY_S/P)*RAD*3600,curve};
  }
  const O=PREC_ORBITS[st.porbit]||PREC_ORBITS.molniya, orb=orbitFromApsides(MU_E,O.rp,O.ra), i=clamp(st.incl,0,180)*DEG, days=clamp(st.pdays,5,LIM.daysMax);
  const run=memo('j2',[st.porbit,i,days].join(),()=>j2Run(orb.a,orb.e,i,days));
  const R=j2Rates(orb.a,orb.e,i);
  const curve=memo('j2c',st.porbit,()=>{ const is=[], wd=[], Od=[]; for(let k=0;k<=180;k++){ const q=j2Rates(orb.a,orb.e,k*DEG); is.push(k); wd.push(q.wdot*RAD*DAY_S); Od.push(q.Odot*RAD*DAY_S); } return {is,wd,Od}; });
  const idx=Math.min(run.els.length-1,Math.floor(SIM.pt*run.els.length));
  return {mode:'j2',O,orb,i,days,run,R,curve,idx,el:run.els[Math.max(0,idx)],fNorth:dwellFocus(orb.e)};
}

function buildModel(){
  const st=ST, v=st.view, M={view:v,st};
  if(v==='apsides') M.A=apsModel(st);
  if(v==='transfer') M.T=transferModel(st);
  if(v==='burn') M.U=burnModel(st);
  if(v==='budget') M.G=budgetModel(st);
  if(v==='window') M.W=windowView(st);
  if(v==='precession') M.P=precModel(st);
  return M;
}

/* ================================================================== *
 *  number formatting, readout / eqbar / tag                           *
 * ================================================================== */
function group(n){ const s=String(Math.round(Math.abs(n))); let o=''; for(let i=0;i<s.length;i++){ if(i&&(s.length-i)%3===0) o+=','; o+=s[i]; } return (n<0?'−':'')+o; }
/* a distance: au from the Sun (4 figures), km elsewhere (grouped, to the km; below 100 km one decimal) */
function distTxt(km,body){
  if(!isFinite(km)) return '∞';
  if(body==='sun') return sigf(km/AU_KM,4)+' au';
  if(Math.abs(km)<100) return fmt(km,1)+' km';
  return group(km)+' km';
}
function altTxt(km,body){ return body==='sun'?distTxt(km,body):distTxt(km-BODIES[body].R,body); }
/* a height for a label on the canvas: above the surface, or how far below it */
function heightTxt(km,body){ if(body==='sun') return distTxt(km,body); const h=km-BODIES[body].R; return h>=0?distTxt(h,body)+' up':distTxt(-h,body)+' below the surface'; }
/* a number on the canvas in powers of ten, 3.2 × 10⁵ (no markup, which canvas cannot draw) */
function sciC(x,n){ if(!(x>0)) return fmt(x,1); if(x<10) return fmt(x,n===undefined?1:n); const e=Math.floor(Math.log10(x)), D='⁰¹²³⁴⁵⁶⁷⁸⁹'; return fmt(x/Math.pow(10,e),n===undefined?1:n)+' × 10'+String(e).split('').map(c=>D[+c]).join(''); }
/* a tick label without trailing zeros */
function tk(v){ if(v===0) return '0'; const a=Math.abs(v); if(a>=1e5||a<1e-3) return sigf(v,2); return String(Number(v.toPrecision(4))); }
function timeTxt(s){
  if(!isFinite(s)) return '—';
  const a=Math.abs(s);
  if(a<120) return sigf(s,3)+' s';
  if(a<2*3600) return sigf(s/60,3)+' min';
  if(a<2*86400) return sigf(s/3600,3)+' h';
  if(a<2*365.25*86400) return sigf(s/86400,4)+' d';
  return sigf(s/(365.25*86400),3)+' yr';
}
function spd(v){ return isFinite(v)?sigf(v,4)+' km/s':'—'; }
function dvTxt(dv){ return fmt(Math.abs(dv),3)+' km/s'+(dv<0?' back':''); }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function degT(r,n){ return fmt(r*RAD,n===undefined?1:n)+'&deg;'; }
function presetName(list,id){ const p=(list||[]).find(q=>q.id===id); return p?p.name:'your own'; }
function readoutHTML(M){
  let s='<div class="rname">The Hohmann transfer<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  if(M.view==='apsides'){
    const A=M.A, O=A.O, B=A.B, id=B.id;
    /* a circle has no apsides: the picture says so, and so does the readout */
    if(A.circ){
      s+=hd(presetName(APS_PRESETS[id],ST.aps)+' round '+B.name)
        +rrow('radius'+(id==='sun'?'':' (height)'),id==='sun'?distTxt(O.rp,id):altTxt(O.rp,id))+rrow('eccentricity e','0')+rrow('period',timeTxt(O.T));
      s+=hd('a circle: no '+B.peri+' and no '+B.apo)+rrow('speed, the same everywhere',spd(O.vp))+rrow('r v (h)',group(O.h)+' km&sup2;/s');
      s+=hd('now, '+timeTxt(A.t)+' into the orbit')+rrow('distance, speed',distTxt(A.S.r,id)+', '+spd(A.S.v));
    } else {
    s+=hd(presetName(APS_PRESETS[id],ST.aps)+' round '+B.name)
      +rrow(B.peri+(id==='sun'?'':' (height)'),id==='sun'?distTxt(O.rp,id):altTxt(O.rp,id))
      +rrow(B.apo+(id==='sun'?'':' (height)'),id==='sun'?distTxt(O.ra,id):altTxt(O.ra,id))
      +rrow('semi-major axis a',distTxt(O.a,id))+rrow('eccentricity e',fmt(O.e,O.e<0.01?5:4))+rrow('period',timeTxt(O.T));
    s+=hd('at the two apsides')+rrow('speed at '+B.peri,spd(O.vp))+rrow('speed at '+B.apo,spd(O.va))
      +rrow('ratio v<sub>p</sub>/v<sub>a</sub> = r<sub>a</sub>/r<sub>p</sub>',fmt(O.vp/O.va,4))+rrow('r v at either (h)',group(O.h)+' km&sup2;/s');
    s+=hd('now, '+timeTxt(A.t)+' after '+B.peri)+rrow('distance, speed',distTxt(A.S.r,id)+', '+spd(A.S.v))
      +rrow('true anomaly &nu;',degT(((A.S.nu%TAU)+TAU)%TAU,1))+rrow('flight-path angle &gamma;',degT(A.gamma,2));
    s+=hd('time spent on the '+B.apo+' side')+rrow('beyond the minor axis',fmt(100*A.fMinor,2)+' %')
      +rrow('beyond the focus',fmt(100*A.fFocus,2)+' %');
    if(A.inside) s+='</table><div class="note bad">The '+B.peri+' is below the surface: this ellipse is a ballistic arc, not an orbit.</div><table>';
    }
  }
  else if(M.view==='transfer'){
    const T=M.T, H=T.H, B=T.B, id=B.id;
    s+=hd(presetName(TR_PRESETS[id],ST.tpre)+' round '+B.name)+rrow('from r<sub>1</sub>, speed',distTxt(H.r1,id)+', '+spd(H.v1))
      +rrow('to r<sub>2</sub>, speed',distTxt(H.r2,id)+', '+spd(H.v2));
    s+=hd('the transfer ellipse')+rrow(B.peri+', '+B.apo,distTxt(H.rp,id)+', '+distTxt(H.ra,id))

    s+=hd('the two burns ('+(H.out?'both forward':'both backward')+')')+rrow('&Delta;v<sub>1</sub> at '+(H.out?B.peri:B.apo),dvTxt(H.dv1),'good')

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_lagr/p4_views.js (lineage build_buoy); the camera block from     *
 *  pulsar.html (v3, makeCamera, camBasis, project)                    *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }

function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);

/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){

  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }
  }
  /* nothing clear: the legend is dropped rather than laid over a curve or a label (the captions
     name the colours); clebsch_gordan: forcing it in a big box put it on the mean's label */
  if(!pick) return;
  legendBox(ctx,pick[0],pick[1],items);
  LABELS.push([pick[0],pick[1],pick[0]+bw,pick[1]+bh]);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));

}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  views 1-3: the apsides, the transfer, one burn                     *
 * ================================================================== */
let HIT=[];
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i], b=h.b; if(b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) return h; } return null; }
const MATH=fs=>'italic '+fs+'px Georgia, serif';
let W_STAGE=1100, H_STAGE=700;
/* the body at the focus: to scale when that is at least minPx across, else a dot of minPx that the
   caller names as enlarged */
function bodyDisc(ctx,map,B,minPx){
  const px=B.R*map.s, r=Math.max(px,minPx||2.5);
  dot(ctx,map.X(0),map.Y(0),r,shade(B.col,0.9),null);
  if(px>=6){ ctx.beginPath(); ctx.arc(map.X(0),map.Y(0),r,0,TAU); ctx.strokeStyle=shade(B.col,0.55); ctx.lineWidth=1; ctx.stroke(); }
  return {px,r,scaled:px<(minPx||2.5)};
}
function bbox(pts){ let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity; for(const p of pts){ if(p[0]<x0) x0=p[0]; if(p[0]>x1) x1=p[0]; if(p[1]<y0) y0=p[1]; if(p[1]>y1) y1=p[1]; } return {xmin:x0,xmax:x1,ymin:y0,ymax:y1}; }
function growExt(E,x,y){ E.xmin=Math.min(E.xmin,x); E.xmax=Math.max(E.xmax,x); E.ymin=Math.min(E.ymin,y); E.ymax=Math.max(E.ymax,y); return E; }
function arrowW(ctx,map,x,y,dxpx,dypx,col,lw){ arrowPx(ctx,map.X(x),map.Y(y),map.X(x)+dxpx,map.Y(y)-dypx,col,lw); }
function ellipsePts(p,e,w,dir,n){ return conicPoints(p,e,w,dir||1,Infinity,n||360); }
/* a label that names a point, placed away from the focus along the direction (ux, uy) */
function tagPoint(ctx,W,H,map,x,y,ux,uy,txt,col,off,o){
  const X=map.X(x)+ux*(off||10), Y=map.Y(y)-uy*(off||10);
  return lab(ctx,W,H,X,Y,txt,col||COL.text,LAB_FONT,ux>0.3?'left':ux<-0.3?'right':'center',uy>0.3?'bottom':uy<-0.3?'top':'middle',o);
}
/* the time axis of a period plot in hours, days or years, whichever keeps the numbers short */
function timeUnit(T){ return T<2*86400?[3600,'h']:T<2*365.25*86400?[86400,'d']:[365.25*86400,'yr']; }
/* fit a picture leaving room left and right for two labels (widths in px): refit until the margin
   holds at the final scale */
function fitLabels(ctx,bx,ext,pad,lblL,lblR){
  ctx.font=LAB_FONT; const wl=lblL?ctx.measureText(plain(lblL)).width+16:0, wr=lblR?ctx.measureText(plain(lblR)).width+16:0;
  let map=worldFitUp(bx,ext,pad);
  for(let k=0;k<4;k++) map=worldFitUp(bx,{xmin:ext.xmin-wl/map.s,xmax:ext.xmax+wr/map.s,ymin:ext.ymin,ymax:ext.ymax},pad);
  return map;
}
function distUnit(body,max){ if(body==='sun') return [AU_KM,'au']; if(max>=2e6) return [1e6,'million km']; if(max>=2e4) return [1e3,'thousand km']; return [1,'km']; }
/* as many ticks as a box of height hpx can label without them touching (about 30 px each) */
function yTicks(lo,hi,hpx){ let t=ticksFor(lo,hi,Math.max(2,Math.floor(hpx/30))); while(t.length>1&&hpx*(t[1]-t[0])/((hi-lo)||1)<16) t=t.filter((_,i)=>i%2===0); return t; }
/* a note along the top of a picture: the long form if it fits the box, else the short, else none */
function topNote(ctx,W,H,b,long,short){
  ctx.font=SM_FONT; const fits=t=>t&&ctx.measureText(plain(t)).width<=b.w-10;
  const t=fits(long)?long:fits(short)?short:null;
  /* a note is a sentence: 'the Sun drawn as a dot' starts with a capital */
  if(t) lab(ctx,W,H,b.x+4,b.y+10,t.charAt(0).toUpperCase()+t.slice(1),COL.dim,SM_FONT,'left','top');
}

/* ================================================================== the apsides */
/* the caption: an ellipse has its apsides and its wedges; a circle has neither (it said 'races through the
   perigee' beside the note that a circle has none), and with the wedges off the law is stated without them */
function apsCaption(A,st){
  const B=A.B;
  if(A.circ) return 'A circle round '+B.name+', the ellipse of eccentricity zero: every point is as near as every other, so there is no '+B.peri+' and no '+B.apo+', and the craft goes round at one speed, '+spd(A.O.vp)+'. Below: its distance and its speed, both constant, and the hodograph, a circle centred on the origin: every velocity has the same length and only turns.';
  return 'An ellipse round '+B.name+' with the body at one focus. Its nearest point is the '+B.peri+' and its farthest the '+B.apo+': they sit at the two ends of the major axis, a(1 − e) and a(1 + e) from the focus, and the speed there is fastest and slowest in the inverse ratio of those distances. '+(st.wedges?'The twelve wedges are swept in equal times':'Equal areas are swept in equal times')+' (Kepler’s second law), so the craft races through the '+B.peri+' and hangs near the '+B.apo+'. Below: its distance and speed through one orbit, and the hodograph, on which every velocity of the orbit lies on one circle.';
}
function drawApsides(ctx,W,H,M){
  const A=M.A, O=A.O, B=A.B, id=B.id, st=M.st;
  const L=stageLayout(ctx,W,H,apsCaption(A,st),
    A.circ?'A circle: no '+B.peri+' or '+B.apo+', one speed all round. Below: r and v, and the hodograph.':'The ellipse, its '+B.peri+' and '+B.apo+'; equal times sweep equal areas. Below: r and v through an orbit, and the hodograph.',2,0.36,1);
  const b=L.main;
  const ext={xmin:-O.ra,xmax:O.rp,ymin:-O.b,ymax:O.b};
  growExt(ext,-B.R,-B.R); growExt(ext,B.R,B.R);
  const span=Math.max(ext.xmax-ext.xmin,ext.ymax-ext.ymin);
  const lblP=B.peri+'  '+heightTxt(O.rp,id), lblA=B.apo+'  '+heightTxt(O.ra,id);
  const map=fitLabels(ctx,box(b.x,b.y+20,b.w,b.h-20),ext,0.1*span,A.circ?0:lblA,A.circ?0:lblP);
  HIT.push({kind:'aps',b,map});
  const pts=ellipsePts(O.p,O.e,0,1,480);
  if(st.wedges&&!A.circ){
    for(let k=0;k<12;k++){
      const n0=A.wedges[k], n1=k===11?A.wedges[0]+TAU:A.wedges[k+1]+(A.wedges[k+1]<n0?TAU:0);
      ctx.beginPath(); ctx.moveTo(map.X(0),map.Y(0));
      for(let j=0;j<=24;j++){ const nu=n0+(n1-n0)*j/24, r=O.p/(1+O.e*Math.cos(nu)); ctx.lineTo(map.X(r*Math.cos(nu)),map.Y(r*Math.sin(nu))); }
      ctx.closePath(); ctx.fillStyle=k%2?COL.wedge:COL.wedge2; ctx.fill();
    }
  }
  /* the construction: the apse line, the minor axis, the centre and the empty focus */
  const cx=-O.a*O.e;
  if(!A.circ){
    seg(ctx,map,[O.rp,0],[-O.ra,0],COL.struct,1,[5,4]);
    seg(ctx,map,[cx,-O.b],[cx,O.b],COL.faint,1,[3,4]);
    ctx.beginPath(); ctx.moveTo(map.X(cx)-4,map.Y(0)); ctx.lineTo(map.X(cx)+4,map.Y(0)); ctx.moveTo(map.X(cx),map.Y(0)-4); ctx.lineTo(map.X(cx),map.Y(0)+4);
    ctx.strokeStyle=COL.dim; ctx.lineWidth=1; ctx.stroke();
    dot(ctx,map.X(2*cx),map.Y(0),3,null,COL.dim,1);
  }
  worldPath(ctx,map,pts,COL.pos,2);
  const D=bodyDisc(ctx,map,B,3);
  /* the craft, its radius vector and its velocity */
  const S=A.S, vmax=O.vp, kv=0.17*Math.min(b.w,b.h)/vmax;
  seg(ctx,map,[0,0],[S.x,S.y],rgba(COL.live,0.55),1);
  arrowW(ctx,map,S.x,S.y,S.vx*kv,S.vy*kv,COL.live,2);
  dot(ctx,map.X(S.x),map.Y(S.y),5,COL.live,'#fff',1);
  /* the two apsides */
  if(!A.circ){
    dot(ctx,map.X(O.rp),map.Y(0),5,COL.pos,'#fff',1); dot(ctx,map.X(-O.ra),map.Y(0),5,COL.pos,'#fff',1);
    tagPoint(ctx,W,H,map,O.rp,0,1,0,lblP,COL.pos,10);
    tagPoint(ctx,W,H,map,-O.ra,0,-1,0,lblA,COL.pos,10);
    lab(ctx,W,H,map.X(cx),map.Y(0)+12,'centre',COL.dim,SM_FONT,'center','top');
    lab(ctx,W,H,map.X(2*cx),map.Y(0)+12,'empty focus',COL.dim,SM_FONT,'center','top');
  } else {
    lab(ctx,W,H,map.X(0),map.Y(O.ra)-14,'a circle: every point is as near as every other, so there is no '+B.peri+' and no '+B.apo,COL.ref,LAB_FONT,'center','bottom');
  }
  topNote(ctx,W,H,b,D.scaled?B.name+' drawn as a dot (to scale it would be '+sigf(D.px,1)+' px). Everything else to scale; the arrow is the velocity.':'To scale; the arrow is the velocity.',D.scaled?B.name+' enlarged; the rest to scale.':'To scale; the arrow is the velocity.');
  if(A.inside) lab(ctx,W,H,map.X(O.rp),map.Y(0)+26,'the '+B.peri+' is below the surface',COL.ref,LAB_FONT,'center','top');
  /* below: r(t) over v(t), and the hodograph */
  const bb=L.bottom;
  if(bb[0]) drawRV(ctx,W,H,A,bb[0]);
  if(bb[1]) drawHodo(ctx,W,H,A,bb[1]);
  drawCaption(ctx,L);
}
function drawRV(ctx,W,H,A,b0){
  const O=A.O, B=A.B, [du,dn]=distUnit(B.id,O.ra), [tu,tn]=timeUnit(O.T), c=A.curves;
  /* two stacked plots need about 100 px; a shorter box shows the speed alone */
  const two=b0.h>=100, gap=26, h1=two?Math.floor((b0.h-gap)/2):0;
  const br=box(b0.x,b0.y,b0.w,h1), bv=two?box(b0.x,b0.y+h1+gap,b0.w,b0.h-h1-gap):b0;
  const rs=c.rs.map(r=>r/du), vs=c.vs, ts=c.ts.map(t=>t*O.T/tu), T=O.T/tu;
  const rlo=Math.min(...rs), rhi=Math.max(...rs), dr=(rhi-rlo)||rhi*0.1, vlo=Math.min(...vs), vhi=Math.max(...vs), dv=(vhi-vlo)||vhi*0.1;
  const ry=[rlo-0.08*dr,rhi+0.08*dr], vy=[vlo-0.08*dv,vhi+0.08*dv];
  if(two){ axesT(ctx,br,0,T,ry[0],ry[1],{yticks:yTicks(ry[0],ry[1],br.h),yfmt:tk,xticks:[],title:titleFor(br,'distance r ('+dn+') through one orbit','r ('+dn+')')});
    polyline(ctx,br,ts,rs,0,T,ry[0],ry[1],COL.struct,1.8); }
  axesT(ctx,bv,0,T,vy[0],vy[1],{yticks:yTicks(vy[0],vy[1],bv.h),yfmt:tk,xfmt:tk,xlab:(A.circ?'time':'time after '+B.peri)+' ('+tn+')',title:titleFor(bv,two?'speed v (km/s)':'speed v (km/s) through one orbit','v (km/s)')});
  polyline(ctx,bv,ts,vs,0,T,vy[0],vy[1],COL.pos,1.8);
  const tx=A.t/tu;
  for(const bx of two?[br,bv]:[bv]) vcur(ctx,bx.x+bx.w*tx/T,bx);
  HIT.push({kind:'tplot',b:box(b0.x,b0.y,b0.w,b0.h)});
}
function drawHodo(ctx,W,H,A,b1){
  const O=A.O, h=A.hodo, c=A.curves;
  const vmax=O.vp*1.15;
  const map=worldFitUp(box(b1.x,b1.y+18,b1.w,b1.h-18),{xmin:-h.rad,xmax:h.rad,ymin:h.cy-h.rad,ymax:h.cy+h.rad},0.18*h.rad+0.05*vmax);
  frame(ctx,b1,COL.edge);
  ctx.font=MATH(13); ctx.fillStyle='#aeb6c6'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  const t=titleFor(b1,'the hodograph: v = (GM/h)(−sin ν, e + cos ν)','the hodograph');
  ctx.fillText(t,b1.x,b1.y-9); LABELS.push([b1.x,b1.y-9-13*1.15,b1.x+t.length*13*0.52,b1.y-9]);
  seg(ctx,map,[-h.rad*1.1,0],[h.rad*1.1,0],COL.faint,1); seg(ctx,map,[0,h.cy-h.rad*1.1],[0,h.cy+h.rad*1.1],COL.faint,1);
  worldPath(ctx,map,c.hx.map((x,i)=>[x,c.hy[i]]),COL.pos,1.8);
  dot(ctx,map.X(0),map.Y(h.cy),2.5,COL.dim,null);
  arrowPx(ctx,map.X(0),map.Y(0),map.X(A.S.vx),map.Y(A.S.vy),COL.live,1.8);
  /* a circle has no apsides: its hodograph is centred on the origin, every velocity the same length */
  if(A.circ){ if(b1.w>200) lab(ctx,W,H,map.X(0)+7,map.Y(O.vp)-3,'v = '+sigf(O.vp,3)+' at every point',COL.pos,SM_FONT,'left','bottom'); }
  else {
    dot(ctx,map.X(0),map.Y(O.vp),3.5,COL.pos,'#fff',1); dot(ctx,map.X(0),map.Y(-O.va),3.5,COL.pos,'#fff',1);
    if(b1.w>200){
      lab(ctx,W,H,map.X(0)+7,map.Y(O.vp),'v at '+A.B.peri+' '+sigf(O.vp,3),COL.pos,SM_FONT,'left','middle');
      lab(ctx,W,H,map.X(0)+7,map.Y(-O.va),'v at '+A.B.apo+' '+sigf(O.va,3),COL.pos,SM_FONT,'left','middle');
    }
  }
}

/* ================================================================== the transfer */
/* the caption: outward both burns are forward and speed the craft up while the coast climbs; inward both
   are backward and slow it down while the coast falls (it said 'rises at each backward burn' inward) */
function transferCaption(Hh,B){
  const f=Hh.out;
  return 'Two circles round '+B.name+' and the ellipse that touches both: its '+B.peri+' on the inner circle and its '+B.apo+' on the outer. The craft burns '+(f?'forward':'backward')+' at the first apsis to join the ellipse, coasts half of it, and burns '+(f?'forward':'backward')+' again to join the other circle. Below: its speed through the mission, which '+(f?'rises':'falls')+' at each '+(f?'forward':'backward')+' burn and yet ends '+(f?'lower':'higher')+' than it began, because the coast trades '+(f?'speed for height':'height for speed')+'; and its energy, which only the burns change.';
}
function drawTransfer(ctx,W,H,M){
  const T=M.T, Hh=T.H, B=T.B, id=B.id;
  const L=stageLayout(ctx,W,H,transferCaption(Hh,B),
    'The transfer ellipse between the circles. Below: the speed through the mission, and the energy.',2,0.34,1);
  const b=L.main, rmax=Math.max(Hh.r1,Hh.r2);
  const map=worldFitUp(box(b.x,b.y+20,b.w,b.h-20),{xmin:-rmax,xmax:rmax,ymin:-rmax,ymax:rmax},0.1*rmax);
  HIT.push({kind:'tr',b,map});
  circleW(ctx,map,[0,0],Hh.r1,COL.struct,1.2,[4,4]); circleW(ctx,map,[0,0],Hh.r2,COL.struct,1.2,[4,4]);
  /* outward the craft flies nu in [0, pi] from the periapsis on +x; inward the periapsis is turned to
     -x and it flies nu in [pi, 2pi], from the apoapsis on +x: the upper half either way */
  const TO=T.TO, w=Hh.out?0:PI;
  const half=(n0,n1)=>{ const q=[]; for(let i=0;i<=240;i++){ const nu=n0+(n1-n0)*i/240, r=TO.p/(1+TO.e*Math.cos(nu)); q.push([r*Math.cos(nu+w),r*Math.sin(nu+w)]); } return q; };
  worldPath(ctx,map,Hh.out?half(PI,TAU):half(0,PI),rgba(COL.pos,0.35),1.2,[3,5]);
  worldPath(ctx,map,Hh.out?half(0,PI):half(PI,TAU),COL.pos,2.2);
  const D=bodyDisc(ctx,map,B,3);
  /* the burns: arrows along the motion, forward (outward transfer) or backward */
  const k=0.16*Math.min(b.w,b.h)/Math.max(Hh.vp,Hh.v1);
  const s1=Hh.out?1:-1;
  arrowW(ctx,map,Hh.r1,0,0,s1*Math.max(14,Math.abs(Hh.dv1)*k*3),COL.hot,2.2);
  arrowW(ctx,map,-Hh.r2,0,0,-s1*Math.max(14,Math.abs(Hh.dv2)*k*3),COL.hot,2.2);
  dot(ctx,map.X(Hh.r1),map.Y(0),4,COL.hot,'#fff',1); dot(ctx,map.X(-Hh.r2),map.Y(0),4,COL.hot,'#fff',1);
  /* each burn labelled beside its burn when the label fits between the circles, else outside the outer
     circle at the burn's height: a plate hides a dashed circle inside the text, but the dash went on below
     it, under the decimal point, and Earth to Mars read '2,945' */
  const ro=Math.max(Hh.r1,Hh.r2)*map.s, ri=Math.min(Hh.r1,Hh.r2)*map.s;
  const L1='Δv₁ '+fmt(Math.abs(Hh.dv1),3)+' km/s', L2='Δv₂ '+fmt(Math.abs(Hh.dv2),3)+' km/s';
  ctx.font=LAB_FONT; const fitsIn=t=>ro-ri-20>=Math.max(ctx.measureText(t).width,plain(t).length*11*0.52);
  if(!Hh.out||fitsIn(L1)) tagPoint(ctx,W,H,map,Hh.r1,0,0.9,-0.4,L1,COL.hot,14,PLATE);
  else lab(ctx,W,H,map.X(0)+ro+8,map.Y(0)+6,L1,COL.hot,LAB_FONT,'left','top',PLATE);
  if(Hh.out||fitsIn(L2)) tagPoint(ctx,W,H,map,-Hh.r2,0,-0.9,0.4,L2,COL.hot,14,PLATE);
  else lab(ctx,W,H,map.X(0)-ro-8,map.Y(0)-6,L2,COL.hot,LAB_FONT,'right','bottom',PLATE);
  /* a circle under 10 px is lost under the burn's marker: the note names it instead of a label */
  if(Hh.r1*map.s>=10) lab(ctx,W,H,map.X(Hh.r1*Math.cos(2.4)),map.Y(Hh.r1*Math.sin(2.4))-4,'r₁',COL.struct,MATH(13),'center','bottom');
  if(Hh.r2*map.s>=10) lab(ctx,W,H,map.X(Hh.r2*Math.cos(-0.7))+6,map.Y(Hh.r2*Math.sin(-0.7)),'r₂',COL.struct,MATH(13),'left','middle');
  /* the craft */
  const c=T.craft, kv=0.16*Math.min(b.w,b.h)/Math.max(Hh.vp,Hh.v1,Hh.v2);
  arrowW(ctx,map,c.x,c.y,c.vx*kv,c.vy*kv,COL.live,1.8);
  dot(ctx,map.X(c.x),map.Y(c.y),5,COL.live,'#fff',1);
  const lost=Math.min(Hh.r1,Hh.r2)*map.s<10, dotNote=D.scaled?B.name+' drawn as a dot'+(lost?', the inner circle inside it':'')+'. ':(lost?'The inner circle is under the burn’s dot. ':'');
  topNote(ctx,W,H,b,dotNote+'To scale; the gold arrows mark the burns (not to scale), the magenta one the craft’s velocity.',dotNote+'To scale; the arrows are not.');
  const bb=L.bottom;
  if(bb[0]) drawMissionV(ctx,W,H,T,bb[0]);
  if(bb[1]) drawMissionE(ctx,W,H,T,bb[1]);
  drawCaption(ctx,L);
}
function missionAxis(T){ const [tu,tn]=timeUnit(T.span); return {tu,tn,t0:-T.pre/tu,t1:(T.H.t+T.post)/tu}; }
function drawMissionV(ctx,W,H,T,b0){
  const c=T.curves, X=missionAxis(T), ts=c.ts.map(t=>t/X.tu), vs=c.vs;
  const vlo=Math.min(...vs), vhi=Math.max(...vs), d=vhi-vlo||1, ylo=Math.max(0,vlo-0.12*d), yhi=vhi+0.12*d;
  axesT(ctx,b0,X.t0,X.t1,ylo,yhi,{yticks:yTicks(ylo,yhi,b0.h),yfmt:tk,xfmt:tk,xlab:'mission time from the first burn ('+X.tn+')',title:titleFor(b0,'speed through the mission (km/s)','speed (km/s)')});
  polyline(ctx,b0,ts,vs,X.t0,X.t1,ylo,yhi,COL.pos,2);
  const Hh=T.H, px=t=>b0.x+b0.w*(t-X.t0)/(X.t1-X.t0), py=v=>b0.y1-b0.h*(v-ylo)/(yhi-ylo);
  arrowPx(ctx,px(0),py(Hh.v1),px(0),py(Hh.out?Hh.vp:Hh.va),COL.hot,1.8);
  arrowPx(ctx,px(Hh.t/X.tu),py(Hh.out?Hh.va:Hh.vp),px(Hh.t/X.tu),py(Hh.v2),COL.hot,1.8);
  vcur(ctx,px(T.t/X.tu),b0);
  HIT.push({kind:'mplot',b:b0});
}
function drawMissionE(ctx,W,H,T,b1){
  const c=T.curves, X=missionAxis(T), ts=c.ts.map(t=>t/X.tu);
  const all=c.ke.concat(c.pe,c.te), lo=Math.min(...all), hi=Math.max(...all), d=hi-lo||1, ylo=lo-0.08*d, yhi=hi+0.08*d;
  axesT(ctx,b1,X.t0,X.t1,ylo,yhi,{yticks:yTicks(ylo,yhi,b1.h),yfmt:tk,xfmt:tk,xlab:'mission time ('+X.tn+')',title:titleFor(b1,'energy per kg (km²/s²): kinetic, potential, total','energy (km²/s²)')});
  polyline(ctx,b1,ts,c.ke,X.t0,X.t1,ylo,yhi,COL.live,1.4);
  polyline(ctx,b1,ts,c.pe,X.t0,X.t1,ylo,yhi,COL.struct,1.4);
  polyline(ctx,b1,ts,c.te,X.t0,X.t1,ylo,yhi,COL.pos,2.2);
  vcur(ctx,b1.x+b1.w*(T.t/X.tu-X.t0)/(X.t1-X.t0),b1);
  legendR(ctx,b1,[[COL.pos,'total v²/2 − GM/r'],[COL.live,'kinetic v²/2'],[COL.struct,'potential −GM/r']]);
}

/* ================================================================== one burn */
function drawBurn(ctx,W,H,M){
  const U=M.U, K=U.K, B=U.B, id=B.id, st=M.st;
  const L=stageLayout(ctx,W,H,
    'One burn, anywhere on the orbit and in any direction in its plane. The dashed curve is the orbit before, the green one after: the point where you burn stays on both, and the far side moves. A forward burn at the '+B.peri+' raises the '+B.apo+' most, one at the '+B.apo+' raises the '+B.peri+', and a burn square to the motion mostly turns the apse line. Below: the same burn made at every point of the orbit, the new '+B.peri+' and '+B.apo+' and the energy it buys, which grows with the speed it is spent at (the Oberth effect).',
    'One burn: the orbit before (dashed) and after (green). Below: the same burn at every point.',2,0.34,1);
  const b=L.main;
  const r0=K.r;
  /* what to frame: both conics where bound, else three times the burn radius */
  const base=U.e<1?ellipsePts(st.brp*(1+U.e),U.e,0,1,360):conicPoints(st.brp*(1+U.e),U.e,0,1,4*Math.max(r0,st.brp),240);
  let rmaxN=K.bound?K.ra:4*Math.max(r0,st.brp);
  const after=K.bound?ellipsePts(K.p,K.e,K.w,K.dir,360):conicPoints(K.p,K.e,K.w,K.dir,rmaxN,300);
  const ext=bbox(base.concat(after,[[B.R,B.R],[-B.R,-B.R]]));
  const span=Math.max(ext.xmax-ext.xmin,ext.ymax-ext.ymin);
  const lblNP='new '+B.peri+' '+heightTxt(K.rp,id), lblNA=K.bound?'new '+B.apo+' '+heightTxt(K.ra,id):'';
  const lw=lblNA.length>lblNP.length?lblNA:lblNP;
  const map=fitLabels(ctx,box(b.x,b.y+20,b.w,b.h-20),ext,0.08*span,lw,lw);
  HIT.push({kind:'burnorbit',b,map});
  worldPath(ctx,map,base,COL.old,1.4,[5,4]);
  /* the apse lines, old and new */
  const bR=U.e<1?st.brp*(1+U.e)/(1-U.e):rmaxN;
  seg(ctx,map,[st.brp,0],[U.e<1?-bR:0,0],rgba(COL.old,0.8),1,[2,4]);
  if(!K.circ){ const pr=[K.rp*Math.cos(K.w),K.rp*Math.sin(K.w)], far=K.bound?[-K.ra*Math.cos(K.w),-K.ra*Math.sin(K.w)]:[0,0];
    seg(ctx,map,pr,far,rgba(COL.pos,0.7),1,[2,4]); }
  worldPath(ctx,map,after,COL.pos,2);
  const D=bodyDisc(ctx,map,B,3);
  /* the old and new apsides */
  dot(ctx,map.X(st.brp),map.Y(0),3.5,null,COL.old,1.2);
  if(U.e<1) dot(ctx,map.X(-bR),map.Y(0),3.5,null,COL.old,1.2);
  if(!K.circ){
    const px=K.rp*Math.cos(K.w), py=K.rp*Math.sin(K.w), n=Math.hypot(px,py)||1;
    dot(ctx,map.X(px),map.Y(py),5,COL.pos,'#fff',1);
    tagPoint(ctx,W,H,map,px,py,px/n,py/n,lblNP,U.hits?COL.ref:COL.pos,12,PLATE);
    if(K.bound){ const ax=-K.ra*Math.cos(K.w), ay=-K.ra*Math.sin(K.w);
      dot(ctx,map.X(ax),map.Y(ay),5,COL.pos,'#fff',1);
      tagPoint(ctx,W,H,map,ax,ay,-px/n,-py/n,lblNA,COL.pos,12,PLATE); }
  }
  /* the burn: the velocity before (dim), the delta-v (magenta), the velocity after (green) */
  const kv=0.14*Math.min(b.w,b.h)/Math.max(K.v0,Math.hypot(K.nvx,K.nvy));
  arrowW(ctx,map,K.x,K.y,K.vx0*kv,K.vy0*kv,COL.old,1.6);
  arrowW(ctx,map,K.x,K.y,K.nvx*kv,K.nvy*kv,COL.pos,1.8);
  arrowPx(ctx,map.X(K.x)+K.vx0*kv,map.Y(K.y)-K.vy0*kv,map.X(K.x)+K.nvx*kv,map.Y(K.y)-K.nvy*kv,COL.live,2);
  dot(ctx,map.X(K.x),map.Y(K.y),5,COL.live,'#fff',1);
  if(!K.bound){
    lab(ctx,W,H,b.x+b.w/2,b.y+30,(K.parab?'a parabola: it just escapes':'a hyperbola: it escapes')+(K.vinf>0?', leaving at v∞ = '+sigf(K.vinf,4)+' km/s':''),COL.pos,LAB_FONT,'center','top'); }
  if(U.hits) lab(ctx,W,H,b.x+b.w/2,b.y1-6,'the new '+B.peri+' is inside '+B.name+': the craft comes down',COL.ref,LAB_FONT,'center','bottom');
  topNote(ctx,W,H,b,(D.scaled?B.name+' drawn as a dot. ':'')+'To scale; the arrows (velocity before, the burn, velocity after) are not.','To scale; the arrows are not.');
  const bb=L.bottom;
  if(bb[0]) drawBurnScan(ctx,W,H,U,bb[0]);
  if(bb[1]) drawBurnEnergy(ctx,W,H,U,bb[1]);
  drawCaption(ctx,L);
}
function drawBurnScan(ctx,W,H,U,b0){
  const sc=U.scan, id=U.B.id, [du,dn]=id==='sun'?[AU_KM,'au']:[1,'km'], xs=sc.nus.map(n=>n*RAD);
  const vals=[]; for(let i=0;i<xs.length;i++){ if(isFinite(sc.ra[i])) vals.push(sc.ra[i]/du); if(sc.rp[i]>0) vals.push(sc.rp[i]/du); }
  const lo=Math.max(1e-3,Math.min(...vals)), hi=Math.max(...vals);
  const L0=Math.log10(lo)-0.08, L1=Math.log10(hi)+0.08;
  const x0=xs[0], x1=xs[xs.length-1];
  /* the unbound stretch, shaded before the axes so the ticks stay on top */
  ctx.fillStyle='#1a1426';
  for(let i=0;i<xs.length-1;i++) if(sc.esc[i]){ const X0=b0.x+b0.w*(xs[i]-x0)/(x1-x0), X1=b0.x+b0.w*(xs[i+1]-x0)/(x1-x0); ctx.fillRect(X0,b0.y,X1-X0+0.5,b0.h); }
  let dec=intTicks(Math.ceil(L0),Math.floor(L1)); while(dec.length>2&&b0.h/(dec.length)<18) dec=dec.filter((_,i)=>i%2===0);
  axesT(ctx,b0,x0,x1,L0,L1,{xticks:[-180,-90,0,90,180].filter(v=>v>=x0-1e-9&&v<=x1+1e-9),yticks:dec,yfmt:v=>'10'+pow10sup(v),xfmt:v=>fmt(v,0)+'°',
    xlab:'where the burn is made, true anomaly ν (0 = '+U.B.peri+')',title:titleFor(b0,'the new '+U.B.peri+' and '+U.B.apo+' ('+dn+', log)','new apsides ('+dn+')')});
  polyline(ctx,b0,xs,sc.ra.map(r=>isFinite(r)?Math.log10(r/du):NaN),x0,x1,L0,L1,COL.pos,2);
  polyline(ctx,b0,xs,sc.rp.map(r=>r>0?Math.log10(r/du):NaN),x0,x1,L0,L1,COL.struct,1.6);
  const bl=Math.log10(U.B.R/du);
  if(bl>L0&&bl<L1) polyline(ctx,b0,[x0,x1],[bl,bl],x0,x1,L0,L1,COL.ref,1,[4,3]);
  vcur(ctx,b0.x+b0.w*(U.nu*RAD-x0)/(x1-x0),b0);
  /* the curves named where they run (every corner of this plot is crossed, so a legend would be dropped);
     only what was drawn is named */
  const Xn=nu=>b0.x+b0.w*(nu-x0)/(x1-x0), Yl=v=>b0.y1-b0.h*(Math.log10(v/du)-L0)/(L1-L0);
  const iq=Math.round(0.75*(xs.length-1));
  if(isFinite(sc.ra[iq])) lab(ctx,W,H,Xn(xs[iq]),Yl(sc.ra[iq])-8,'new '+U.B.apo,COL.pos,SM_FONT,'center','bottom',PLATE);
  if(sc.rp[iq]>0) lab(ctx,W,H,Xn(xs[iq]),Yl(sc.rp[iq])-8,'new '+U.B.peri,COL.struct,SM_FONT,'center','bottom',PLATE);
  /* the surface line is named on the line: below it, or above it at the foot of the plot, at the right end
     or else the left (escaping, the line sits on the axis and a shifted label was dropped) */
  if(bl>L0&&bl<L1){ const yS=Yl(U.B.R), up=yS>b0.y1-16, yl=up?yS-3:yS+3, bs=up?'bottom':'top';
    if(!lab(ctx,W,H,b0.x1-4,yl,'the surface',COL.ref,SM_FONT,'right',bs,PLATE_FIX)) lab(ctx,W,H,b0.x+4,yl,'the surface',COL.ref,SM_FONT,'left',bs,PLATE_FIX); }
  if(sc.esc.some(x=>x)){ const i0=sc.esc.indexOf(true); lab(ctx,W,H,Math.max(b0.x+4,Xn(xs[i0])+4),b0.y+6,'escapes',COL.dim,SM_FONT,'left','top'); }
  HIT.push({kind:'nplot',b:b0,x0,x1,ySurf:bl>L0&&bl<L1?Yl(U.B.R):null});
}
function drawBurnEnergy(ctx,W,H,U,b1){
  const sc=U.scan, xs=sc.nus.map(n=>n*RAD), x0=xs[0], x1=xs[xs.length-1], floor=ST.bdv*ST.bdv/2;
  /* the axis always holds zero: a burn square to the motion buys a constant dv^2/2, and an axis fitted to
     that constant would draw its rounding as a staircase */
  const lo=Math.min(0,...sc.dE), hi=Math.max(...sc.dE,floor), d=hi-lo||1, ylo=lo-(lo<0?0.1*d:0), yhi=hi+0.12*d;
  axesT(ctx,b1,x0,x1,ylo,yhi,{xticks:[-180,-90,0,90,180].filter(v=>v>=x0-1e-9&&v<=x1+1e-9),xfmt:v=>fmt(v,0)+'°',yfmt:tk,yticks:yTicks(ylo,yhi,b1.h).filter(v=>v>ylo+1e-9*(yhi-ylo)),
    xlab:'true anomaly of the burn ν',title:titleFor(b1,'energy the burn buys (km²/s²)','energy bought (km²/s²)')});
  polyline(ctx,b1,[x0,x1],[floor,floor],x0,x1,ylo,yhi,COL.ref,1,[4,3]);
  polyline(ctx,b1,xs,sc.dE,x0,x1,ylo,yhi,COL.pos,2);
  marker(ctx,b1,x0,x1,ylo,yhi,U.nu*RAD,U.K.dE,COL.live);
  { const Xn=nu=>b1.x+b1.w*(nu-x0)/(x1-x0), Yv=v=>b1.y1-b1.h*(v-ylo)/(yhi-ylo), iq=Math.round(0.2*(xs.length-1));
    lab(ctx,W,H,Xn(xs[iq]),Yv(sc.dE[iq])-8,'v Δv cos ψ + Δv²/2',COL.pos,SM_FONT,'center','bottom',PLATE);
    /* the part no speed changes: a floor under a forward burn, a ceiling over a backward one, the whole of
       it square to the motion */
    const cp=Math.cos(ST.bpsi*DEG);
    /* above its line, or below it where the line runs along the top of the plot (a backward burn) */
    const yF=Yv(floor), dn=yF<b1.y+16;
    lab(ctx,W,H,b1.x1-4,dn?yF+3:yF-3,'Δv²/2, '+(cp>1e-9?'the floor':cp<-1e-9?'the ceiling':'at every point'),COL.ref,SM_FONT,'right',dn?'top':'bottom',PLATE); }
  HIT.push({kind:'nplot',b:b1,x0,x1});
}

/* ================================================================== *
 *  views 4-6: the budget, the window, the precession; the dispatch    *
 * ================================================================== */
/* a cursor line that is not a curve (never recorded in POLY_SEGS, so legends do not dodge it) */
function vcur(ctx,X,b,col){ ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.strokeStyle=col||rgba(COL.live,0.8); ctx.lineWidth=1.2; ctx.stroke(); }
function hline(ctx,b,Y,col,dash){ ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.strokeStyle=col; ctx.lineWidth=1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }

/* ================================================================== the budget */
function drawBudget(ctx,W,H,M){
  const G=M.G, c=G.curves;
  const L=stageLayout(ctx,W,H,
    'The delta-v of each way from one circle to another, in units of the inner circle’s speed, against the ratio of the radii R. The Hohmann cost climbs to 0.536 v₁ at R = 15.58 and then falls toward the cost of escape, (√2 − 1)v₁: for a large enough jump it is cheaper to leave altogether than to stop halfway. A bi-elliptic transfer (a first burn out to a far apoapsis, a second there to lift the near end to r₂, a third to settle) can beat it beyond R = 11.94 if that apoapsis is far enough, and beats it for any apoapsis beyond r₂ once R passes 15.58; its limit as the apoapsis recedes is the bi-parabolic transfer. A slow spiral under weak continuous thrust costs v₁ − v₂, more than either. Below: the two transfers at this R, each to its own scale.',
    'Delta-v against the ratio of radii: Hohmann, bi-elliptic, bi-parabolic, the slow spiral. Below: the transfers at this R.',2,0.36,1);
  const b=L.main, pb=box(b.x+8,b.y+26,b.w-16,b.h-60);
  const xl=0, xh=3, yl=0, yh=1.0, lx=c.Rs.map(r=>Math.log10(r));
  axesT(ctx,pb,xl,xh,yl,yh,{xticks:[0,1,2,3],xfmt:v=>String(Math.round(Math.pow(10,v))),yfmt:v=>fmt(v,1),yticks:yTicks(yl,yh,pb.h).filter(v=>v>yl),
    xlab:'R = r₂/r₁ (log scale)',ylab:'Δv / v₁',title:titleFor(pb,'the cost of going from r₁ to r₂ = R r₁','the cost')});
  const X=v=>pb.x+pb.w*(v-xl)/(xh-xl), Yv=v=>pb.y1-pb.h*(v-yl)/(yh-yl);
  /* the escape cost and the two thresholds */
  hline(ctx,pb,Yv(Math.SQRT2-1),COL.faint,[2,4]);
  for(const [r,t] of [[R_STAR,'11.94'],[R_MAX,'15.58']]){ const x=X(Math.log10(r)); ctx.beginPath(); ctx.moveTo(x,pb.y); ctx.lineTo(x,pb.y1); ctx.strokeStyle=COL.faint; ctx.setLineDash([2,4]); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]); }
  polyline(ctx,pb,lx,c.sp,xl,xh,yl,yh,COL.spiral,1.4,[6,4]);
  polyline(ctx,pb,lx,c.bp,xl,xh,yl,yh,COL.hot,1.2,[3,3]);
  polyline(ctx,pb,lx,c.be,xl,xh,yl,yh,COL.be,1.8);
  polyline(ctx,pb,lx,c.ho,xl,xh,yl,yh,COL.pos,2.4);
  vcur(ctx,X(Math.log10(G.R)),pb);

  const eP=pl('embary',V.E.m,aE), tP=pl(p,V.P.m,aP);
  if(st.real){ dot(ctx,map.X(V.E.t[0]),map.Y(V.E.t[1]),6,null,PCOL.embary,1.4); dot(ctx,map.X(V.P.t[0]),map.Y(V.P.t[1]),6,null,PCOL[p],1.4); }

    const th=Math.atan2(q.y,q.x)+(aP>=aE?0:PI)+lamE, r=q.r/AU_KM; dot(ctx,map.X(r*Math.cos(th)),map.Y(r*Math.sin(th)),4.5,COL.live,'#fff',1); }

/* ================================================================== the precession */

function camKeys(view){ return view==='precession'?['camTheta','camPhi']:null; }
/* the contiguous runs of a closed polyline where pred holds (a run that wraps the end is joined) */
function runsWhere(pts,pred){
  const out=[]; let cur=[];
  for(const q of pts){ if(pred(q)) cur.push(q); else if(cur.length){ out.push(cur); cur=[]; } }
  if(cur.length){ if(out.length&&pred(pts[0])) out[0]=cur.concat(out[0]); else out.push(cur); }
  return out.filter(r=>r.length>1);
}
function camPhiRange(){ return [-1.4,1.4]; }
/* the caption names the track by the colour it is drawn in (COL.hot, gold; it said green, the orbit's colour) */
function j2Caption(P){
  return 'The Earth’s equatorial bulge (J₂) pulls on an inclined orbit, and the pull does not average away: the node slides round the equator and the apse line turns in the orbit’s plane, at the rates on the plot below, which vanish for the apse line where 5 cos²i = 1, at 63.4° and 116.6°. A Molniya satellite flies there so that its apogee, where it spends most of its time, stays over the north. The orbit is integrated (RK4, J₂ only) for '+fmt(P.days,0)+' days; the gold track is its apogee at each pass, the magenta mark this pass. Drag to turn the view.';
}
function drawJ2(ctx,W,H,M){
  const P=M.P, st=M.st, orb=P.orb, run=P.run, el=P.el;
  const L=stageLayout(ctx,W,H,j2Caption(P),
    'J₂ turns the apse line unless i = 63.4°. Drag to turn; below, the rates and the apogee’s latitude.',2,0.34,1);
  const b=L.main, ext=orb.a*1.12;
  /* aim at the centre of this pass's ellipse, not the Earth at its focus, so the orbit fills the box */
  const oc=el?el:{a:orb.a,e:orb.e,i:P.i,Om:0,w:270*DEG}, sP=rvFromElements(MU_E,oc.a,oc.e,oc.i,oc.Om,oc.w,0), sA=rvFromElements(MU_E,oc.a,oc.e,oc.i,oc.Om,oc.w,PI);
  const tgt=[(sP[0]+sA[0])/2,(sP[1]+sA[1])/2,(sP[2]+sA[2])/2];
  const D=ext/(0.8*Math.tan(0.39));
  const C=boxCamera(b,st.camTheta,st.camPhi,D,tgt);
  HIT.push({kind:'cam',b});
  /* the equatorial plane: a ring of two Earth radii (a ring at the apogee's distance would leave the box) */

  const ce=C.P([0,0,0]), silR=ce?C.B.f*RE/ce.z:0;       /* the Earth is small beside the distance: f R / depth */
  const hidden=p=>{ const e=C.B.eye, d=v3.sub(p,e), L2=v3.dot(d,d), t=-v3.dot(e,d)/L2; if(t<=0||t>=1) return false; const q=v3.add(e,v3.mul(d,t)); return v3.dot(q,q)<RE*RE; };
  const oPts=[], osc=el?el:{a:orb.a,e:orb.e,i:P.i,Om:0,w:270*DEG};
  for(let k=0;k<=240;k++){ const s=rvFromElements(MU_E,osc.a,osc.e,osc.i,osc.Om,osc.w,TAU*k/240); oPts.push([s[0],s[1],s[2]]); }

  if(cur&&cur.length>1) (curH?back:front).push(cur);
  for(const s of back) poly3(ctx,C,s,rgba(COL.pos,0.35),1.2,[3,4]);
  if(ce){ dot(ctx,ce.x,ce.y,silR,shade(BODIES.earth.col,0.8),null);
    const eq=[]; for(let k=0;k<=96;k++){ const t=TAU*k/96; eq.push([RE*Math.cos(t),RE*Math.sin(t),0]); }
    for(const run2 of runsWhere(eq,q=>v3.dot(v3.sub(q,C.B.eye),q)<0)) poly3(ctx,C,run2,rgba('#cfe3ff',0.6),1,null,true);
    poly3(ctx,C,[[0,0,RE],[0,0,1.6*RE]],'#cfe3ff',1.2,null,true); }
  for(const s of front) poly3(ctx,C,s,COL.pos,2);

  poly3(ctx,C,tr,COL.hot,2.4);
  for(const q3 of tr){ const q=C.P(q3); if(q) dot(ctx,q.x,q.y,1.6,COL.hot,null); }
  if(el){ const s=rvFromElements(MU_E,el.a,el.e,el.i,el.Om,el.w,PI), q=C.P([s[0],s[1],s[2]]); if(q) dot(ctx,q.x,q.y,4.5,COL.live,'#fff',1);
    const s0=rvFromElements(MU_E,el.a,el.e,el.i,el.Om,el.w,0), q0=C.P([s0[0],s0[1],s0[2]]); if(q0) dot(ctx,q0.x,q0.y,3,COL.pos,null); }
  const np=C.P([0,0,1.75*RE]); if(np) lab(ctx,W,H,np.x,np.y-4,'N',COL.text,SM_FONT,'center','bottom');
  topNote(ctx,W,H,b,'The Earth and the orbit to scale; the gold line is the apogee pass by pass over '+fmt(P.days,0)+' days.','To scale; gold: the apogee, pass by pass.');

function drawRates(ctx,W,H,P,b0){

function drawGR(ctx,W,H,M){
  const P=M.P, run=P.run;
  const L=stageLayout(ctx,W,H,grCaption(P),
    'The perihelion advance, exaggerated k times: the exact orbit equation, first order, and RK4.',2,0.36,1);
  const b=L.main, ra=P.ra/AU_KM;
  const map=worldFitUp(box(b.x,b.y+20,b.w,b.h-20),{xmin:-ra,xmax:ra,ymin:-ra,ymax:ra},0.08*ra);
  const base=ellipsePts(P.rp*(1+P.e)/AU_KM,P.e,0,1,360);
  worldPath(ctx,map,base,COL.old,1.2,[4,4]);
  worldPath(ctx,map,run.pts.map(q=>[q[0]/AU_KM,q[1]/AU_KM]),COL.pos,1.3);
  dot(ctx,map.X(0),map.Y(0),6,BODIES.sun.col,null);
  const rpA=P.rp/AU_KM;
  for(let k=0;k<run.angs.length;k++){ const a=run.angs[k]; seg(ctx,map,[0,0],[1.08*rpA*Math.cos(a),1.08*rpA*Math.sin(a)],k===run.angs.length-1?COL.live:rgba(COL.hot,0.8),1.2); }
  topNote(ctx,W,H,b,'Mercury’s orbit to scale; the relativistic term × '+sciC(P.k)+'. The dashed ellipse is the first orbit; the short lines, each perihelion.','Relativity × '+sciC(P.k)+'; lines: each perihelion.');
  const bb=L.bottom;
  if(bb[0]) drawGRCurve(ctx,W,H,P,bb[0]);
  if(bb[1]) drawGRSteps(ctx,W,H,P,bb[1]);
