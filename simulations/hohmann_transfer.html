/* the caption: 'so that the turn shows' only where it does (at k = 1 the real Mercury turns 0.83″ in eight
   orbits, and at k = 100 still only 0.02°) */
function grCaption(P){
  const n=P.run.angs.length, turn=n*P.run.exact*RAD, tt=turn<0.1?fmt(turn*3600,turn*3600<10?2:1)+'″':fmt(turn,2)+'°';
  const kline=P.k===1?'Here k = 1, the real Mercury: in eight orbits its perihelion turns '+tt+', far too little to see; raise k to multiply the relativistic term until it shows'
    :'Here the relativistic term is multiplied by k = '+sciC(P.k)+(turn<1?', and still the perihelion turns only '+tt+' in eight orbits, too little to see':' so that the turn shows ('+tt+' in eight orbits)');
  return 'Relativity adds a pull that falls as 1/r⁴ to the Sun’s 1/r², so an orbit no longer closes: each perihelion comes a little further round, and the orbit traces a rosette. For Mercury the advance is '+fmt(P.real.adv*RAD*3600,4)+'″ an orbit, '+fmt(P.cy,2)+'″ a century, the anomaly that Einstein’s 1915 theory explained. '+kline+'; the orbit equation is solved exactly and integrated (RK4, eight orbits), and at large k the advance outgrows the first-order formula.';
}
function drawGRCurve(ctx,W,H,P,b0){
  const c=P.curve, xs=c.ks.map(k=>Math.log10(k)), ex=c.ex.map(v=>Math.log10(v*RAD)), fo=c.fo.map(v=>Math.log10(v*RAD));
  const ylo=Math.floor(Math.min(...fo))-0.2, yhi=Math.ceil(Math.max(...ex))+0.2;
  axesT(ctx,b0,0,LIM.klogMax,ylo,yhi,{xticks:intTicks(0,LIM.klogMax),xfmt:v=>'10'+plain(pow10sup(v)),yticks:intTicks(Math.ceil(ylo),Math.floor(yhi)).filter(v=>v%2===0),yfmt:v=>'10'+pow10sup(v)+'°',
    xlab:'k, the factor on the relativistic term',title:titleFor(b0,'advance per orbit: exact, first order, integrated','advance per orbit')});
  polyline(ctx,b0,xs,ex,0,LIM.klogMax,ylo,yhi,COL.pos,2.4);
  polyline(ctx,b0,xs,fo,0,LIM.klogMax,ylo,yhi,COL.ref,1.3,[5,4]);
  marker(ctx,b0,0,LIM.klogMax,ylo,yhi,Math.log10(P.k),Math.log10(P.run.per*RAD),COL.live);
  legendR(ctx,b0,[[COL.pos,'the orbit equation, exact'],[COL.ref,'6πGM/(c²a(1 − e²)), dashed'],[COL.live,'RK4, eight orbits']]);
  HIT.push({kind:'kplot',b:b0});
}
function pow10sup(v){ const D='⁰¹²³⁴⁵⁶⁷⁸⁹'; return String(Math.round(v)).split('').map(c=>c==='-'?'⁻':D[+c]).join(''); }
function drawGRSteps(ctx,W,H,P,b1){
  /* in arcseconds while the eight orbits turn less than a tenth of a degree (Mercury's own 0.83″), else
     degrees: 0.00025° beside 5.0e-5° was the alternative */
  const n=P.run.angs.length, top=Math.max(...P.run.angs,n*P.run.exact)*RAD, asec=top<0.1, u=asec?3600*RAD:RAD, sym=asec?'″':'°';
  const ys=P.run.angs.map(a=>a*u), xs=ys.map((_,i)=>i+1), ex=xs.map(i=>i*P.run.exact*u);
  const yhi=Math.max(...ys,...ex)*1.1||1;
  axesT(ctx,b1,0,n+1,0,yhi,{xticks:intTicks(1,n),xfmt:v=>fmt(v,0),yfmt:v=>tk(v)+sym,yticks:yTicks(0,yhi,b1.h).filter(v=>v>0),xlab:'orbit',title:titleFor(b1,'the perihelion’s direction, orbit by orbit','perihelion angle')});
  polyline(ctx,b1,[0].concat(xs),[0].concat(ex),0,n+1,0,yhi,COL.pos,1.6);
  for(let i=0;i<n;i++) marker(ctx,b1,0,n+1,0,yhi,xs[i],ys[i],COL.hot);
}

/* ================================================================== the dispatch and the scene */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; W_STAGE=W; H_STAGE=H;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='apsides') drawApsides(ctx,W,H,M);
  else if(M.view==='transfer') drawTransfer(ctx,W,H,M);
  else if(M.view==='burn') drawBurn(ctx,W,H,M);
  else if(M.view==='budget') drawBudget(ctx,W,H,M);
  else if(M.view==='window') drawWindow(ctx,W,H,M);
  else drawPrecession(ctx,W,H,M);
}
function plotValue(h,x){ return clamp((x-h.b.x)/h.b.w,0,1); }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  /* a pointer on a plot sets the quantity along its x axis; on the burn's picture it moves the burn
     point; on the 3-D view it turns the camera */
  function setFrom(hit,x,y){
    const u=plotValue(hit,x);
    if(hit.kind==='tplot'){ SIM.ta=u; return true; }
    if(hit.kind==='mplot'){ SIM.tt=u; return true; }
    if(hit.kind==='Rplot'){ ST.R=clamp(Math.pow(10,hit.xl+(hit.xh-hit.xl)*u),LIM.Rmin,LIM.Rmax); ST.al=Math.max(ST.al,ST.R); ST.bud='own'; return true; }
    if(hit.kind==='dplot'){ ST.jd=clamp(hit.j0+(hit.j1-hit.j0)*u,LIM.jdMin,LIM.jdMax); return true; }
    if(hit.kind==='iplot'){ ST.incl=Math.round(1800*u)/10; ST.ppre='own'; return true; }
    if(hit.kind==='kplot'){ ST.klog=Math.round(10*LIM.klogMax*u)/10; return true; }
    if(hit.kind==='nplot'){ ST.bnu=Math.round(hit.x0+(hit.x1-hit.x0)*u); ST.bpre='own'; return true; }
    if(hit.kind==='burnorbit'){ const m=hit.map, wx=m.wx(x), wy=m.wy(y), lim=nuLimit(clamp(ST.be,0,LIM.eMax))*RAD;
      ST.bnu=clamp(Math.round(Math.atan2(wy,wx)*RAD),-Math.floor(lim),Math.floor(lim)); ST.bpre='own'; return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='up'){ const was=DRAG.what; DRAG.what=null; return was!==null&&was!=='cam'; }
    if(type==='down'){
      const hit=hitAt(x,y);
      if(!hit) return false;
      if(hit.kind==='cam'){ const keys=camKeys(ST.view); if(!keys) return false; DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST[keys[0]]; DRAG.ph=ST[keys[1]]; return true; }
      if(setFrom(hit,x,y)){ DRAG.what=hit.kind; DRAG.hit=hit; return true; }
      return false;
    }
    if(type==='move'){
      if(DRAG.what==='cam'){ const keys=camKeys(ST.view), pr=camPhiRange(); ST[keys[0]]=DRAG.th-(x-DRAG.x)*0.008; ST[keys[1]]=clamp(DRAG.ph+(y-DRAG.y)*0.008,pr[0],pr[1]); return true; }
      if(DRAG.what&&DRAG.hit) return setFrom(DRAG.hit,x,y);
    }
    return false;
  };
  return S;
}

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='apsides'?'press or drag on r(t) or v(t) to move the craft · space stops it · 1–6 switch views'
        :v==='transfer'?'press or drag on the speed plot to move through the mission · 1–6 switch views'
        :v==='burn'?'drag on the orbit to move the burn point · drag on the plots to scan it · 1–6 switch views'
        :v==='budget'?'press or drag on the plot to set R · 1–6 switch views'

      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); syncChips(); syncPanel(); dirty=true; refresh(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  const CLOCK={apsides:'anim',transfer:'tanim',window:'wrun',precession:'panim'};
  window.addEventListener('keydown',e=>{

    else if(e.key==='r'){ simReset(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        /* while a clock runs, the readout and the tag follow it ten times a second (the window's date slider too) */
        if(advanced&&(++frames%6===0)){ const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); if(st.view==='window') rows.jd.sync(); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

  apsides:'An orbit that is not a circle has two special points: the <b>periapsis</b>, nearest the body it circles, and the <b>apoapsis</b>, farthest from it. Each body gives them its own names: perigee and apogee round the Earth, perilune and apolune round the Moon, periareion and apoareion round Mars, perijove and apojove round Jupiter, perihelion and aphelion round the Sun. Both lie on the major axis, at a(1 &minus; e) and a(1 + e) from the focus, and the speed there follows from the energy alone. Because the angular momentum rv is the same at both, the speeds are in the inverse ratio of the distances. '

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});

}

        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
