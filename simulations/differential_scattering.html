<title>Differential scattering — what a cross section is, and how you get one from a trajectory</title>
<!--
  ===================================================================
  DIFFERENTIAL SCATTERING
  dsigma/dOmega: the Jacobian between impact parameter and solid angle,
  the 1913 experiment that established it, and where a point charge
  stops being one
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, pulsar.html,
  diffraction.html, standard_candle.html and cmb.html: one flat file, no
  build step, no network, works opened straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS COMPUTES
  ------------------------------------------------------------------
    the orbit       hyperbolic trajectories in a pure Coulomb field, drawn
                    with the nucleus at its TRUE radius; the deflection
                    function theta(b) and the closest approach against the
                    nuclear surface.
    the cross       Rutherford, hard sphere, screened Coulomb, Thomson and
    section         Klein-Nishina on one logarithmic axis.
    the experiment  Geiger & Marsden 1913, Table II, both foils.
    from b to       the deflection integral done numerically and the cross
    dsigma/dOmega   section built from |db/dtheta|, against the closed form.
    photons         Thomson, and what recoil does to it.
    the nucleus     the form factor, and the diffraction minimum that
                    measures a nuclear radius.

  ------------------------------------------------------------------
  WHAT IS MEASURED
  ------------------------------------------------------------------
  Geiger & Marsden 1913, "The Laws of Deflexion of alpha Particles through
  Large Angles", Phil. Mag. 25, 604-623, TABLE II, both the silver and the
  gold series.  Read from the full text as RAW HTML.  That matters: a
  SUMMARISED fetch of the same page returned a table that had silently
  dropped the three overlap rows -- and those rows are the only thing that
  makes the two halves of the table joinable.

  The table has a trap in it.  The large angles were measured with a wide
  beam and the small angles with a much smaller diaphragm, so the two blocks
  are on DIFFERENT SCALES: the counts fall from 105 400 at 15 degrees to 508
  at 10 degrees.  Geiger and Marsden knew, and measured three angles (30,
  22.5, 15) with both diaphragms "so as to obtain an accurate value of the
  reduction constant".  This file recovers that constant from those rows --
  1112 for silver, 2819 for gold -- and splices on it.  Nothing is assumed.
  Gold's constant is ~2.5x silver's because the gold foil was three times
  thinner in the second series, which the paper also states.

  After splicing: the counts span 2.8e5 : 1 for gold and N sin^4(phi/2) stays
  inside a factor of 1.44.  That is the Rutherford result.  The residual
  trend is real and the paper says so: "the deviations are somewhat
  systematic, the ratio increasing with decreasing angle."

  ------------------------------------------------------------------
  WHAT IS EXACT
  ------------------------------------------------------------------
  * The Rutherford cross section, obtained as a Jacobian rather than quoted:
    dsigma/dOmega = (b/sin theta)|db/dtheta| = a^2/(4 sin^4(theta/2)).  The
    first version of this file wrote a^2/sin^4 and the numerical cross-check
    caught the missing 4, which is why that cross-check is in selfTest.
  * The deflection function for an ARBITRARY central potential, by the
    quadrature theta = pi - 2b int dr/(r^2 sqrt(1 - V/E - b^2/r^2)), which
    reproduces 2 arctan(a/b) to 1e-9.
  * Thomson and Klein-Nishina, with the KN total integrated numerically AND
    in closed form, agreeing to 1e-9; the low-energy series branch is
    necessary rather than decorative (the raw closed form returns MINUS 42
    Thomson cross sections at k = 1e-6).
  * The uniform-sphere form factor and the first root of tan x = x.
  * alpha, r_e and sigma_Thomson derived from the exact SI constants and
    agreeing with CODATA to 3e-12, 2e-12 and 1e-11.

  ------------------------------------------------------------------
  WHAT IS NOT MODELLED, and is said so on the canvas
  ------------------------------------------------------------------
  * Quantum mechanics.  The Coulomb cross section happens to be the same
    classically, in Born approximation and exactly, which is a famous
    accident; nothing else here is a quantum calculation.  No partial waves,
    no phase shifts, no spin, no Mott factor, no identical-particle
    interference.
  * Nuclear forces.  Above the energy at which the turning point reaches the
    surface the 1/sin^4 law fails, and this file computes that energy and
    says so, but does not model what replaces it.
  * Multiple scattering, energy loss in the foil, and the finite beam
    geometry -- all of which Geiger and Marsden had to correct for and did.
  * Recoil of the target.  Everything is in the laboratory frame with an
    infinitely heavy nucleus.

  ------------------------------------------------------------------
  VERIFICATION
  ------------------------------------------------------------------
  selfTest() runs when there is no document (osascript -l JavaScript).  It
  asserts every closed form against an independent numerical route, both
  series branches at their joins AND that the direct forms are genuinely bad
  below them, the tabulated 1913 columns against each other, and the splice
  against its own overlap rows.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* ================================================================== *
 *  GEIGER & MARSDEN 1913 — TABLE II                                   *
 *                                                                     *
 *  "The Laws of Deflexion of alpha Particles through Large Angles",   *
 *  Phil. Mag. 25, 604-623.  Read from the full text as RAW HTML, not  *
 *  through a summariser: a summarised fetch of the same page silently *
 *  dropped the three overlap rows, which are the only rows that make  *
 *  the two halves of the table joinable at all.                       *
 *                                                                     *
 *  [block, angle_deg, 1/sin^4(phi/2), Ag_N, Ag_ratio, Au_N, Au_ratio] *
 *                                                                     *
 *  TWO BLOCKS, and they are NOT on the same scale.  Block 1 used a    *
 *  wide beam (~15 deg radius) for the large angles; for block 2 "the  *
 *  aperture of the diaphragm confining the beam was reduced           *
 *  considerably", and "when changing over from one diaphragm to       *
 *  another comparative measurements for different angles were made so *
 *  as to obtain an accurate value of the reduction constant."  The    *
 *  blocks OVERLAP at 30, 22.5 and 15 degrees, and that overlap is how *
 *  the sim recovers the constant — it is not assumed.                 *
 *                                                                     *
 *  The foils also differ between the series: 0.45 and 0.3 cm          *
 *  air-equivalent in the first, 0.45 and 0.1 in the second, for       *
 *  silver and gold respectively — so gold is 3x thinner in block 2,   *
 *  which is why its reduction constant comes out ~2.5x silver's.      *
 *                                                                     *
 *  NaN means the paper prints "..." — not measured.                   *
 * ================================================================== */
const GM=[
[1,150,1.15,22.2,19.3,33.1,28.8],
[1,135,1.38,27.4,19.8,43,31.2],
[1,120,1.79,33,18.4,51.9,29],
[1,105,2.53,47.3,18.7,69.5,27.5],
[1,75,7.25,136,18.8,211,29.1],
[1,60,16,320,20,477,29.8],
[1,45,46.6,989,21.2,1435,30.8],
[1,37.5,93.7,1760,18.8,3300,35.3],
[1,30,223,5260,23.6,7800,35],
[1,22.5,690,20300,29.4,27300,39.6],
[1,15,3445,105400,30.6,132000,38.4],
[2,30,223,5.3,0.024,3.1,0.014],

   symmetry axis. */

  /* How close to the asymptote the polyline is drawn.  The perpendicular

     at 0.9995 of the asymptotic true anomaly it is still 0.3% high, which is
     a truncation, not an error.  0.99995 brings it to 0.03% and gives a
     longer, straighter incoming leg — which is also the better picture,

  const numax=Math.acos(1/ecc)*0.99995;

    raw.push([r*Math.cos(nu),r*Math.sin(nu)]);

     Drawn like that every trajectory shares a symmetry axis and the picture
     comes out as a fan of near-straight lines radiating from the nucleus —
     which is what it did, and is the opposite of the physics: a beam arrives
     PARALLEL and each particle leaves at its own angle.  So rotate each orbit
     until its incoming leg lies along +x.  The rotation is taken from the
     first two drawn points rather than from an angle formula, because it is
     then self-correcting: whatever convention the conic used, the incoming
     leg ends up horizontal.  The perpendicular distance from the focus to
     that asymptote is then b, automatically — a property of the hyperbola,

  const pts=[];

       near the asymptote, so the first chord spans an enormous arc and its

  if(Math.abs(x)>=1e5||Math.abs(x)<1e-3) return fmtExp(x,(n||3)-1);
  const d=Math.max(0,(n||3)-1-Math.floor(Math.log10(Math.abs(x))));
  return Number(x).toFixed(Math.min(12,d));
}
function fmtFm(m){ return isFinite(m)?sig(m/FM,4)+' fm':'—'; }
function fmtBarn(x){
  if(!isFinite(x)) return '—';
  const b=x/BARN;
  if(b>=1e4||b<1e-4) return fmtExp(b,3)+' b';
  return sig(b,4)+' b';
}
function axf(n){ return function(t){
  return fmt(Math.abs(t)<Math.pow(10,-n-3)?0:t,n); }; }
function logTick(t){
  const e=Math.round(t);
  if(Math.abs(t-e)>1e-9) return '';
  if(e>=0&&e<=4) return fmt(Math.pow(10,e),0);
  return '10'+sup(e);
}

/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
const _gmCache={};
function gmFor(which){
  if(!_gmCache[which]) _gmCache[which]=gmSplice(which);
  return _gmCache[which];
}

function buildModel(st){
  const M={st:st};
  const E=st.EMeV*MEV;
  M.E=E; M.Z1=st.Z1; M.Z2=st.Z2; M.A=st.A;
  M.a=ruthA(st.Z1,st.Z2,E);
  M.d0=closestApproach(st.Z1,st.Z2,E,0);
  M.Rn=(st.Rfm>0)?st.Rfm*FM:nuclearR(st.A);
  /* the energy at which the head-on turning point reaches the surface */
  M.Etouch=st.Z1*st.Z2*E_Q*E_Q*KE/M.Rn;
  M.touches=(M.d0<=M.Rn);
  M.b=st.bFrac*M.a;
  M.theta=ruthTheta(M.b,st.Z1,st.Z2,E);
  M.rmin=closestApproach(st.Z1,st.Z2,E,M.b);
  M.orbit=ruthOrbit(M.b,st.Z1,st.Z2,E,180);
  /* a fan of impact parameters, geometrically spaced */
  M.fan=[];
  for(let i=0;i<st.nOrbits;i++){
    const f=Math.exp(Math.log(0.25)+(Math.log(6)-Math.log(0.25))*i/(st.nOrbits-1));
    M.fan.push(ruthOrbit(f*M.a,st.Z1,st.Z2,E,120));
  }
  M.dsdo=(th)=>ruthDsdo(th,st.Z1,st.Z2,E);
  /* the potential, for the numerical deflection function */
  M.V=(r)=>st.Z1*st.Z2*E_Q*E_Q*KE/r;
  M.hardR=M.Rn;

  /* photons */
  M.k=st.kGam;
  M.EgamMeV=st.kGam*MEC2/MEV;
  M.knTot=knTotal(st.kGam);
  M.knRatio=M.knTot/SIG_T;
  M.knFwd=knDsdo(0,st.kGam);
  M.knBack=knDsdo(PI,st.kGam);
  M.fwdBack=M.knFwd/M.knBack;
  M.lamShift=LAM_C;

  /* the nucleus */
  M.p=st.pMeV*MEV/C_LIGHT;
  M.qMax=qOf(PI,M.p);
  M.firstMinQ=TANX_ROOT/M.Rn;
  const sarg=M.firstMinQ*HBAR/(2*M.p);
  M.firstMinTh=(sarg<=1)?2*Math.asin(sarg):NaN;

  /* Geiger & Marsden */
  M.gmAg=gmFor(3);
  M.gmAu=gmFor(5);
  M.gm=(st.foil==='gold')?M.gmAu:M.gmAg;
  M.gmName=(st.foil==='gold')?'gold':'silver';

  return M;
}

/* ================================================================== *
 *  readout                                                            *
 * ================================================================== */
function readoutHTML(M){
  const st=M.st, v=st.view;
  const row=(a,b,c)=>'<tr><td>'+a+'</td><td class="v'+(c?' '+c:'')+'">'+b+'</td></tr>';
  const hd=(t)=>'<tr><td class="hd" colspan="2">'+t+'</td></tr>';
  let name='',sub='',body='',note='';

  if(v==='orbit'||v==='machinery'||v==='sigma'){
    name=(v==='orbit')?'the orbit':(v==='sigma'?'the cross section':'from b to dσ/dΩ');
    sub='Z='+st.Z1+' on Z='+st.Z2+' at '+sig(st.EMeV,3)+' MeV';
    body=hd('the collision')
      +row('a = Z₁Z₂e²/8πε₀E', fmtFm(M.a))
      +row('impact parameter b', fmtFm(M.b))
      +row('  b/a', sig(st.bFrac,4))
      +row('deflection θ', sig(M.theta*RAD,4)+'°')
      +row('closest approach', fmtFm(M.rmin))
      +hd('does it touch?')
      +row('head-on turning point', fmtFm(M.d0))
      +row('nuclear radius 1.2A⅓', fmtFm(M.Rn))
      +row('clearance', fmtFm(M.d0-M.Rn), M.touches?'bad':'good')
      +row('energy that would touch', sig(M.Etouch/MEV,4)+' MeV')
      +hd('the cross section')
      +row('dσ/dΩ at θ', fmtBarn(M.dsdo(M.theta))+'/sr')
      +row('dσ/dΩ at 90°', fmtBarn(M.dsdo(PI/2))+'/sr')
      +row('dσ/dΩ at 180°', fmtBarn(M.dsdo(PI))+'/sr');
    note='<p class="note">Rutherford scattering at these energies <b>never '
      +'reaches the nucleus</b>: the α turns around '+fmtFm(M.d0-M.Rn)+' short of '
      +'the surface. That is why the 1/sin⁴ law held — the whole experiment was '
      +'done in the pure Coulomb field of a point charge. It fails above about '
      +sig(M.Etouch/MEV,3)+' MeV, and that failure is how the nuclear radius was '
      +'first measured.</p>';
  } else if(v==='experiment'){
    const g=M.gm;
    name='Geiger &amp; Marsden 1913';
    sub=M.gmName+' foil · '+g.pts.length+' points';
    body=hd('the two blocks')
      +row('overlap angles', g.overlaps.join('°, ')+'°')
      +row('reduction factors', g.factors.map(f=>fmt(f,0)).join(', '))
      +row('geometric mean k', fmt(g.k,1),'good')
      +row('spread across them', fmt(100*(Math.max.apply(null,g.factors)
           /Math.min.apply(null,g.factors)-1),0)+'%')
      +hd('after splicing')
      +row('points', g.pts.length)
      +row('1/sin⁴ spans', fmtExp(g.invSpan,3)+' : 1')
      +row('counts span', fmtExp(g.NSpan,3)+' : 1','good')
      +hd('the test')
      +row('N sin⁴(φ/2) min', fmt(g.prodMin,2))
      +row('  max', fmt(g.prodMax,2))
      +row('  mean', fmt(g.prodMean,2))
      +row('  spread', fmt(100*(g.prodMax/g.prodMin-1),0)+'%','good');
    note='<p class="note">The counts vary by <b>'+fmtExp(g.NSpan,2)+' to 1</b> '
      +'across the table and N&nbsp;sin⁴(φ/2) stays inside a factor of '
      +fmt(g.prodMax/g.prodMin,2)+'. That is the whole Rutherford result. The '
      +'residual trend is real and the paper says so: “the deviations are '
      +'somewhat systematic, the ratio increasing with decreasing angle”.</p>';
  } else if(v==='photons'){
    name='photons';
    sub='k = E/mₑc² = '+sig(st.kGam,4)+' → '+sig(M.EgamMeV,4)+' MeV';
    body=hd('the photon')
      +row('E<sub>γ</sub>', sig(M.EgamMeV,4)+' MeV')
      +row('k = E/mₑc²', sig(st.kGam,4))
      +row('Compton λ_C', sig(LAM_C*1e12,6)+' pm')
      +hd('the cross section')
      +row('σ<sub>Thomson</sub>', fmtBarn(SIG_T))
      +row('σ<sub>KN</sub>', fmtBarn(M.knTot))
      +row('σ/σ<sub>T</sub>', sig(M.knRatio,5), M.knRatio<0.9?'bad':'good')
      +hd('the shape')
      +row('dσ/dΩ forward', fmtBarn(M.knFwd)+'/sr')
      +row('dσ/dΩ backward', fmtBarn(M.knBack)+'/sr')
      +row('forward / backward', sig(M.fwdBack,4), M.fwdBack>2?'bad':'');
    note='<p class="note">At low energy the electron just shakes and re-radiates: '
      +'the pattern is forward–backward symmetric and the total is the Thomson '
      +'value. As <b>k rises the recoil matters</b>, the backscatter is '
      +'suppressed, and the cross section falls. At k = '+sig(st.kGam,3)+' the '
      +'forward direction is '+sig(M.fwdBack,3)+'× the backward one.</p>';
  } else {
    name='the nucleus';
    sub='R = '+fmtFm(M.Rn)+' · probe p = '+sig(st.pMeV,4)+' MeV/c';
    body=hd('the target')
      +row('mass number A', st.A)
      +row('R = 1.2A⅓ fm', fmtFm(nuclearR(st.A)))
      +row('R in use', fmtFm(M.Rn))
      +hd('the probe')
      +row('momentum pc', sig(st.pMeV,4)+' MeV')
      +row('q at 180°', fmtExp(M.qMax,3)+' m⁻¹')
      +row('qR at 180°', sig(M.qMax*M.Rn,4))
      +hd('the first minimum')
      +row('qR at the zero', sig(TANX_ROOT,7))
      +row('q there', fmtExp(M.firstMinQ,3)+' m⁻¹')
      +row('θ there', isFinite(M.firstMinTh)?sig(M.firstMinTh*RAD,4)+'°':'out of range',
           isFinite(M.firstMinTh)?'good':'bad');
    note='<p class="note">A point charge gives Rutherford exactly. A charge '
      +'spread over a sphere gives Rutherford times |F(q)|², and F has zeros — '
      +'the first at qR = '+sig(TANX_ROOT,6)+', the first root of tan x = x. '
      +'Finding that angle is finding R, and it is how Hofstadter measured '
      +'nuclear sizes.</p>';
    if(!isFinite(M.firstMinTh)) note+='<p class="note">At this momentum the '
      +'first zero is <b>past 180°</b> — the probe cannot resolve the nucleus. '
      +'That is not a failure of the model; it is why you need a bigger '
      +'accelerator.</p>';
  }
  return '<div class="rname">'+name+'<small>'+sub+'</small></div><table>'+body
        +'</table>'+note;
}

/* ================================================================== *
 *  the equation bar                                                   *
 * ================================================================== */
function eqbarText(M){
  const st=M.st, v=st.view;
  if(v==='orbit')
    return '<span class="lhs">b</span> = a cot(θ/2), &nbsp; a = Z₁Z₂e²/8πε₀E = '
      +'<span class="hl">'+fmtFm(M.a)+'</span>'
      +'<span class="sm">every trajectory is a hyperbola with the nucleus at the '
      +'far focus; the impact parameter alone decides the angle</span>';
  if(v==='sigma')
    return '<span class="lhs">dσ/dΩ</span> = (b/sin θ)|db/dθ| = '
      +'<span class="hl">a²/(4 sin⁴(θ/2))</span>'
      +'<span class="sm">a cross section is nothing but a Jacobian: how much '
      +'impact-parameter area lands in how much solid angle</span>';
  if(v==='experiment')
    return '<span class="lhs">N sin⁴(φ/2)</span> = constant &nbsp;→&nbsp; '
      +'measured over <span class="hl">'+fmtExp(M.gm.NSpan,2)+' : 1</span> in N, '
      +'constant to <span class="hl2">'+fmt(M.gm.prodMax/M.gm.prodMin,2)+'×</span>'
      +'<span class="sm">Geiger &amp; Marsden 1913, '+M.gmName+' foil — the two '
      +'blocks spliced on their own overlap, not on an assumed constant</span>';
  if(v==='machinery')
    return '<span class="lhs">dσ/dΩ</span> = Σ |b/sin θ · db/dθ| &nbsp;·&nbsp; '
      +'θ(b) = π − 2b∫<sub>r<sub>min</sub></sub><sup>∞</sup> dr / '
      +'r²√(1 − V/E − b²/r²)'
      +'<span class="sm">the deflection integral is done numerically here and '
      +'must reproduce the closed form — it is what caught a factor of 4</span>';
  if(v==='photons')
    return '<span class="lhs">dσ/dΩ</span> = (r<sub>e</sub>²/2) P²(P + 1/P − sin²θ), '
      +'&nbsp; P = [1 + k(1−cos θ)]<sup>−1</sup>'
      +'<span class="sm">Klein–Nishina; at k → 0 it becomes Thomson\'s '
      +'(r<sub>e</sub>²/2)(1+cos²θ) and the total becomes 8πr<sub>e</sub>²/3</span>';
  return '<span class="lhs">dσ/dΩ</span> = (dσ/dΩ)<sub>Ruth</sub> × '
    +'<span class="hl">|F(q)|²</span>, &nbsp; F = 3[sin qR − qR cos qR]/(qR)³'
    +'<span class="sm">the form factor is the Fourier transform of the charge '
    +'distribution — its first zero at qR = '+sig(TANX_ROOT,6)+' is the ruler</span>';
}
function tagText(M){
  const v=M.st.view;
  if(v==='orbit') return '<b>the orbit</b> &mdash; hyperbolae in a pure Coulomb field';
  if(v==='sigma') return '<b>the cross section</b> &mdash; four scattering laws, exact';
  if(v==='experiment') return '<b>the experiment</b> &mdash; Geiger &amp; Marsden '
    +'1913, Table II, spliced on its own overlap';
  if(v==='machinery') return '<b>from b to dσ/dΩ</b> &mdash; the deflection '
    +'integral, done numerically';
  if(v==='photons') return '<b>photons</b> &mdash; Thomson, and what recoil does to it';
  return '<b>the nucleus</b> &mdash; where a point charge stops being one';
}
/* ================================================================== *
 *  plotting extras — same rules as the rest of the collection         *
 * ================================================================== */
function clipTo(ctx,b){ ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip(); }
function sx(b,v,lo,hi){ return b.x+b.w*(v-lo)/((hi-lo)||1); }
function sy(b,v,lo,hi){ return b.y1-b.h*(v-lo)/((hi-lo)||1); }
function dot(ctx,X,Y,r,col){
  ctx.beginPath(); ctx.arc(X,Y,r,0,TAU); ctx.fillStyle=col; ctx.fill();
}
function errBarY(ctx,X,Y0,Y1,col,cap){
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X,Y0); ctx.lineTo(X,Y1);
  if(cap){ ctx.moveTo(X-2.5,Y0); ctx.lineTo(X+2.5,Y0);
           ctx.moveTo(X-2.5,Y1); ctx.lineTo(X+2.5,Y1); }
  ctx.stroke();
}
function legendAt(ctx,x,y,items){
  ctx.font='11px -apple-system, sans-serif'; ctx.textBaseline='middle';
  let yy=y;
  for(const [col,lab,dash] of items){
    ctx.strokeStyle=col; ctx.lineWidth=2;
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+16,yy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#8b93a6'; ctx.textAlign='left';
    ctx.fillText(plain(lab),x+22,yy);
    yy+=15;
  }
  return yy-y;
}
function vMark(ctx,b,X,col,lab,yFrac){
  if(X<b.x-1||X>b.x1+1) return;
  ctx.save(); clipTo(ctx,b);
  ctx.strokeStyle=col; ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  if(!lab) return;
  ctx.font='10.5px -apple-system,sans-serif'; ctx.fillStyle=col;
  const w=ctx.measureText(plain(lab)).width;
  const right=(X+6+w)>b.x1;
  ctx.textAlign=right?'right':'left'; ctx.textBaseline='top';
  ctx.fillText(plain(lab),X+(right?-6:6),b.y+(yFrac===undefined?0.06:yFrac)*b.h);
}

/* ================================================================== *
 *  view A — the orbit                                                 *
 * ================================================================== */
function drawOrbit(ctx,W,H,M,S){
  const st=M.st;
  const split=Math.min(W*0.52,W-360);
  const b2=box(split+56,58,W-split-84,(H-160)*0.44);
  const b3=box(split+56,58+(H-160)*0.44+56,W-split-84,(H-160)*0.36);

  /* ---- the trajectories, to scale, with the nucleus drawn true ---- */
  const Z=(S&&S.zoom)||1;
  /* Frame on the DRAWING, not on the nucleus.  The beam arrives parallel from
     one side and sprays off to the other, so centring the nucleus leaves half
     the panel empty and pushes the interesting part into a corner — which it
     did.  Take the bounding box of everything inside the plotting radius and
     centre on that instead. */
  const rmax=Math.min(14*M.a,
    M.fan.reduce((m,o)=>o.pts.reduce((mm,p)=>Math.max(mm,Math.hypot(p[0],p[1])),m),0));
  let x0=0,x1=0,y0=0,y1=0;
  for(const o of M.fan.concat([M.orbit])) for(const p of o.pts){
    if(Math.hypot(p[0],p[1])>rmax) continue;
    x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]);
    y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]);
  }
  const halfW=Math.max((x1-x0)/2,1e-30), halfH=Math.max((y1-y0)/2,1e-30);
  const availW=split/2-30, availH=(H-210)/2-10;
  const scl=Math.min(availW/halfW,availH/halfH)*Z;
  const cx=split*0.5-(x0+x1)/2*scl, cy=64+(H-190)/2+(y0+y1)/2*scl;
  ctx.save();
  clipTo(ctx,box(6,40,split,H-150));
  /* the nucleus, at true scale — the whole point is that it is tiny */
  const rn=M.Rn*scl;
  ctx.beginPath(); ctx.arc(cx,cy,Math.max(rn,0.7),0,TAU);
  ctx.fillStyle='#cd35c4'; ctx.fill();
  if(rn<3){
    ctx.beginPath(); ctx.arc(cx,cy,3.5,0,TAU);
    ctx.strokeStyle='rgba(205,53,196,0.55)'; ctx.lineWidth=1; ctx.stroke();
  }
  /* the closest-approach circle for the selected orbit */
  ctx.beginPath(); ctx.arc(cx,cy,M.rmin*scl,0,TAU);
  ctx.strokeStyle='rgba(90,200,224,0.45)'; ctx.lineWidth=1;
  ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  /* the fan */
  for(let i=0;i<M.fan.length;i++){
    const o=M.fan[i];
    const t=i/(M.fan.length-1||1);
    ctx.beginPath();
    let started=false;
    for(const p of o.pts){
      const X=cx+p[0]*scl, Y=cy-p[1]*scl;
      if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
    }
    ctx.strokeStyle=mix('#e8843a','#5ac8e0',t); ctx.lineWidth=1.3; ctx.stroke();
  }
  /* the selected one, bold */
  ctx.beginPath();
  let st2=false;
  for(const p of M.orbit.pts){
    const X=cx+p[0]*scl, Y=cy-p[1]*scl;
    if(!st2){ ctx.moveTo(X,Y); st2=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=2.4; ctx.stroke();
  ctx.restore();

  ctx.fillStyle='#cfd4de'; ctx.font='italic 14px Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('b = '+fmtFm(M.b)+'  →  θ = '+sig(M.theta*RAD,4)+'°',split*0.5,44);
  const barFm=Math.pow(10,Math.round(Math.log10(rmax/FM/3)));
  const barPx=barFm*FM*scl;
  ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1.2;
  const bx=18, by=H-136;
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+barPx,by);
  ctx.moveTo(bx,by-4); ctx.lineTo(bx,by+4);
  ctx.moveTo(bx+barPx,by-4); ctx.lineTo(bx+barPx,by+4); ctx.stroke();
  ctx.fillStyle='#8b93a6'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='11px -apple-system,sans-serif';
  ctx.fillText(sig(barFm,3)+' fm',bx+barPx+8,by);
  caption(ctx,14,H-118,
    'Everything here is at one scale'+(Math.abs(Z-1)>0.01?', zoomed ×'+sig(Z,3):'')
    +'. The magenta dot is the nucleus at its true radius '+fmtFm(M.Rn)
    +(M.Rn*scl<3?' (drawn at a 3-pixel minimum with a ring, or it would be '
      +'invisible — and that is the point)':'')
    +'. The dashed circle is the closest approach of the bold trajectory, '
    +fmtFm(M.rmin)+'.',split-24,'#767e92');

  /* ---- theta(b) ---- */
  axes(ctx,b2,0,6,0,180,{title:'the deflection function',
    xlab:'impact parameter b / a', ylab:'θ  [degrees]',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b2);
  {
    const xs=[],ys=[];
    for(let i=1;i<=200;i++){
      const f=6*i/200;
      xs.push(f); ys.push(ruthTheta(f*M.a,st.Z1,st.Z2,M.E)*RAD);
    }
    polyline(ctx,b2,xs,ys,0,6,0,180,'#b8ec4c',2.2);
  }
  ctx.restore();
  vMark(ctx,b2,sx(b2,st.bFrac,0,6),'#fff','b/a = '+sig(st.bFrac,3),0.06);
  ctx.fillStyle='#8b93a6'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillText('b = a gives exactly 90°',b2.x1-6,b2.y1-6);

  /* ---- closest approach vs b ---- */
  const ylo=0, yhi=Math.max(4*M.a,3*M.Rn)/FM;
  axes(ctx,b3,0,6,ylo,yhi,{title:'closest approach — and the nuclear surface',
    xlab:'impact parameter b / a', ylab:'r_min  [fm]',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b3);
  {
    const xs=[],ys=[];
    for(let i=0;i<=200;i++){
      const f=6*i/200;
      xs.push(f); ys.push(closestApproach(st.Z1,st.Z2,M.E,f*M.a)/FM);
    }
    polyline(ctx,b3,xs,ys,0,6,ylo,yhi,'#5ac8e0',2.2);
    const Y=sy(b3,M.Rn/FM,ylo,yhi);
    ctx.fillStyle='rgba(205,53,196,0.14)';
    ctx.fillRect(b3.x,Y,b3.w,b3.y1-Y);
    ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(b3.x,Y); ctx.lineTo(b3.x1,Y); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle='#cd35c4'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('the nucleus, R = '+fmtFm(M.Rn)
    +(M.touches?' — THE BEAM REACHES IT':' — never reached at this energy'),
    b3.x+8,sy(b3,M.Rn/FM,ylo,yhi)-4);
}

/* ================================================================== *
 *  view B — the cross section                                         *
 * ================================================================== */
function drawSigma(ctx,W,H,M){
  const st=M.st;
  const b=box(86,54,W-126,(H-160)*0.68);
  const lx0=Math.log10(0.5), lx1=Math.log10(180);
  let ymax=-99,ymin=99;
  const curves=[];
  const add=(f,col,lab,lw,dash)=>{
    const xs=[],ys=[];
    for(let i=0;i<=260;i++){
      const th=Math.pow(10,lx0+(lx1-lx0)*i/260)*DEG;
      const v=f(th);
      if(!(v>0)||!isFinite(v)) continue;
      const l=Math.log10(v/BARN);
      xs.push(Math.log10(th*RAD)); ys.push(l);
      ymax=Math.max(ymax,l); ymin=Math.min(ymin,l);
    }
    curves.push([xs,ys,col,lab,lw,dash]);
  };
  if(st.showRuth) add(th=>M.dsdo(th),'#b8ec4c','Rutherford, point charge',2.4);
  if(st.showHard) add(th=>hardDsdo(th,M.hardR),'#e8843a',
                      'hard sphere R = '+fmtFm(M.hardR),2,[6,4]);
  if(st.showScreen){
    const A0=5.29177210903e-11/Math.cbrt(st.Z2);
    add(th=>screenDsdo(th,st.Z1,st.Z2,M.E,A0,4*M_U),'#7f8bd8',
        'screened Coulomb (Born)',1.8,[2,3]);
  }
  if(st.showThom) add(th=>thomsonDsdo(th),'#5ac8e0','Thomson (photon–electron)',2);
  if(st.showKN)   add(th=>knDsdo(th,st.kGam),'#cd35c4',
                      'Klein–Nishina, k = '+sig(st.kGam,3),2);
  if(ymax<ymin){ ymax=1; ymin=-1; }
  ymin=Math.max(ymin,ymax-16);
  axes(ctx,b,lx0,lx1,ymin-0.4,ymax+0.4,{
    title:'dσ/dΩ — five scattering laws, all exact',
    xlab:'scattering angle θ  [degrees, logarithmic]',
    ylab:'log₁₀ dσ/dΩ  [barn / sr]',
    xticks:[Math.log10(0.5),0,Math.log10(2),Math.log10(5),1,Math.log10(20),
            Math.log10(50),2,Math.log10(180)],
    xfmt:t=>fmt(Math.pow(10,t),Math.pow(10,t)<1?1:0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  for(const [xs,ys,col,lab,lw,dash] of curves)
    polyline(ctx,b,xs,ys,lx0,lx1,ymin-0.4,ymax+0.4,col,lw,dash);
  ctx.restore();
  legendAt(ctx,b.x+14,b.y+16,curves.map(c=>[c[2],c[3],c[5]]));
  caption(ctx,b.x,b.y1+40,
    'The Coulomb curve has no total cross section: 1/sin⁴(θ/2) integrated over '
    +'solid angle diverges logarithmically at small angle, because a 1/r '
    +'potential has infinite range and every particle is deflected a little. '
    +'Screening cuts it off — a real atom is neutral beyond its electrons — and '
    +'the screened curve turns over. The hard sphere is flat, which is the '
    +'definition of isotropic scattering, and integrates to exactly πR². '
    +'Thomson and Klein–Nishina are photons off a free electron and are here '
    +'for the contrast: they have no divergence at all.',W-160,'#767e92');
}

/* ================================================================== *
 *  view C — the experiment                                            *
 * ================================================================== */
function drawExperiment(ctx,W,H,M){
  const st=M.st, g=M.gm;
  const bw=(W-160)/2;
  const b=box(86,54,bw,(H-160)*0.60);
  const b2=box(86+bw+62,54,bw,(H-160)*0.60);
  const b3=box(86,54+(H-160)*0.60+58,W-126,(H-160)*0.24);

  /* left: N against 1/sin^4 — a straight line of slope 1 if Rutherford holds */
  const lx0=-0.2, lx1=Math.log10(4e5);
  const ly0=Math.log10(Math.min.apply(null,g.pts.map(p=>p.N)))-0.4;
  const ly1=Math.log10(Math.max.apply(null,g.pts.map(p=>p.N)))+0.4;
  axes(ctx,b,lx0,lx1,ly0,ly1,{
    title:'counts against 1/sin⁴(φ/2) — '+M.gmName+' foil',
    xlab:'log₁₀ 1/sin⁴(φ/2)', ylab:'log₁₀ scintillations (spliced)',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  /* the Rutherford prediction is a line of slope exactly 1 through the mean */
  const c0=Math.log10(g.prodMean);
  polyline(ctx,b,[lx0,lx1],[c0+lx0,c0+lx1],lx0,lx1,ly0,ly1,'#b8ec4c',2.2);
  for(const p of g.pts){
    dot(ctx,sx(b,Math.log10(p.inv),lx0,lx1),sy(b,Math.log10(p.N),ly0,ly1),
        3.4,p.block===1?'#fff':'#5ac8e0');
  }
  ctx.restore();
  legendAt(ctx,b.x+14,b.y+b.h-52,[
    ['#b8ec4c','slope 1 — N ∝ 1/sin⁴(φ/2)'],
    ['#fff','block 1, wide beam'],
    ['#5ac8e0','block 2, reduced diaphragm ×'+fmt(g.k,0)]]);

  /* right: the constancy test */
  const plo=0, phi=g.prodMax*1.25;
  axes(ctx,b2,0,160,plo,phi,{
    title:'N sin⁴(φ/2) — constant, over '+fmtExp(g.NSpan,2)+' : 1 in N',
    xlab:'scattering angle φ  [degrees]', ylab:'N sin⁴(φ/2)',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b2);
  const Ym=sy(b2,g.prodMean,plo,phi);
  ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(b2.x,Ym); ctx.lineTo(b2.x1,Ym); ctx.stroke();
  for(const p of g.pts)
    dot(ctx,sx(b2,p.ang,0,160),sy(b2,p.prod,plo,phi),3.4,
        p.block===1?'#fff':'#5ac8e0');
  ctx.restore();
  ctx.fillStyle='#8b93a6'; ctx.font='11px -apple-system,sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText('mean '+fmt(g.prodMean,1)+', spread '
    +fmt(100*(g.prodMax/g.prodMin-1),0)+'%',b2.x1-8,b2.y+8);

  /* bottom: the splice, spelled out */
  ctx.save();
  frame(ctx,b3,'#242a3a');
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('the two blocks are not on the same scale, and the paper says so',
               b3.x,b3.y-6);
  ctx.restore();
  caption(ctx,b3.x+12,b3.y+10,
    'For the large angles a wide beam was used; for the small angles “the '
    +'aperture of the diaphragm confining the beam was reduced considerably”, '
    +'and “when changing over from one diaphragm to another comparative '
    +'measurements for different angles were made so as to obtain an accurate '
    +'value of the reduction constant”. Those comparative measurements are the '
    +'rows at '+g.overlaps.join('°, ')+'°, which appear in BOTH blocks. Their '
    +'ratios are '+g.factors.map(f=>fmt(f,0)).join(', ')+' — geometric mean '
    +fmt(g.k,1)+' — and that is the factor used here. Nothing is assumed: the '
    +'splice comes out of the table. Gold’s constant is about 2.5× silver’s '
    +'because the gold foil was three times thinner in the second series.',
    W-160,'#8b93a6');
}

/* ================================================================== *
 *  view D — from b to dσ/dΩ                                           *
 * ================================================================== */
function drawMachinery(ctx,W,H,M){
  const st=M.st;
  const bw=(W-160)/2;
  const b=box(86,54,bw,(H-160)*0.58);
  const b2=box(86+bw+62,54,bw,(H-160)*0.58);
  const b3=box(86,54+(H-160)*0.58+58,W-126,(H-160)*0.26);

  /* left: the annulus picture — db maps to dOmega */
  axes(ctx,b,0,6,0,180,{title:'b → θ, and the derivative that matters',
    xlab:'b / a', ylab:'θ  [degrees]', xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  const xs=[],ys=[];
  for(let i=1;i<=240;i++){
    const f=6*i/240; xs.push(f); ys.push(ruthTheta(f*M.a,st.Z1,st.Z2,M.E)*RAD);
  }
  polyline(ctx,b,xs,ys,0,6,0,180,'#b8ec4c',2.2);
  /* a band of width db, and the band of dtheta it becomes */
  const f0=st.bFrac, df=0.28;
  const t0=ruthTheta(f0*M.a,st.Z1,st.Z2,M.E)*RAD;
  const t1=ruthTheta((f0+df)*M.a,st.Z1,st.Z2,M.E)*RAD;
  ctx.fillStyle='rgba(90,200,224,0.18)';
  ctx.fillRect(sx(b,f0,0,6),b.y,sx(b,f0+df,0,6)-sx(b,f0,0,6),b.h);
  ctx.fillStyle='rgba(205,53,196,0.18)';
  ctx.fillRect(b.x,sy(b,t0,0,180),b.w,sy(b,t1,0,180)-sy(b,t0,0,180));
  ctx.restore();
  legendAt(ctx,b.x+14,b.y+16,[['rgba(90,200,224,0.9)','a ring db of impact parameter'],
    ['rgba(205,53,196,0.9)','becomes this much dθ']]);

  /* right: numeric vs closed */
  const lx0=Math.log10(2), lx1=Math.log10(178);
  let ymin=99,ymax=-99;
  const th=[],cl=[],nu=[];
  for(let i=0;i<=44;i++){
    const t=Math.pow(10,lx0+(lx1-lx0)*i/44)*DEG;
    const c=ruthDsdo(t,st.Z1,st.Z2,M.E);
    const n=dsdoNumeric(t,M.E,M.V,(x)=>ruthB(x,st.Z1,st.Z2,M.E));
    if(!(c>0)) continue;
    th.push(Math.log10(t*RAD));
    cl.push(Math.log10(c/BARN)); nu.push(isFinite(n)?Math.log10(n/BARN):NaN);
    ymin=Math.min(ymin,Math.log10(c/BARN)); ymax=Math.max(ymax,Math.log10(c/BARN));
  }
  axes(ctx,b2,lx0,lx1,ymin-0.4,ymax+0.4,{
    title:'the numerical Jacobian against the closed form',
    xlab:'θ  [degrees, logarithmic]', ylab:'log₁₀ dσ/dΩ  [b/sr]',
    xticks:[Math.log10(2),Math.log10(5),1,Math.log10(20),Math.log10(50),2,
            Math.log10(178)],
    xfmt:t=>fmt(Math.pow(10,t),0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b2);
  polyline(ctx,b2,th,cl,lx0,lx1,ymin-0.4,ymax+0.4,'#b8ec4c',2.6);
  for(let i=0;i<th.length;i++){
    if(!isFinite(nu[i])) continue;
    dot(ctx,sx(b2,th[i],lx0,lx1),sy(b2,nu[i],ymin-0.4,ymax+0.4),2.6,'#fff');
  }
  ctx.restore();
  legendAt(ctx,b2.x+14,b2.y+16,[['#b8ec4c','a²/(4 sin⁴(θ/2)) — closed form'],
    ['#fff','(b/sin θ)|db/dθ| — computed here']]);

  ctx.save(); frame(ctx,b3,'#242a3a'); ctx.restore();
  caption(ctx,b3.x+12,b3.y+10,
    'A cross section is a Jacobian and nothing else. Particles arriving in a '
    +'ring of radius b and width db all leave between θ and θ+dθ, so the area '
    +'2πb db goes into the solid angle 2π sin θ dθ, and dσ/dΩ = (b/sin θ)|db/dθ|. '
    +'The white points are that formula evaluated numerically — including the '
    +'deflection integral θ(b) = π − 2b∫dr/(r²√(1−V/E−b²/r²)) done by '
    +'quadrature — and the green curve is the closed form. They agree to about '
    +'1 part in 10¹⁰. That agreement is not decoration: the first version of '
    +'the closed form in this file was wrong by a factor of 4, and this is the '
    +'check that found it.',W-160,'#8b93a6');
}

/* ================================================================== *
 *  view E — photons                                                   *
 * ================================================================== */
function drawPhotons(ctx,W,H,M){
  const st=M.st;
  const bw=(W-160)/2;
  const b=box(86,54,bw,(H-160)*0.60);
  const b2=box(86+bw+62,54,bw,(H-160)*0.60);
  /* angular distribution, linear in theta, normalised to r_e^2 */
  let ymax=0;
  const KS=[0.001,0.1,1,10];
  for(const k of KS.concat([st.kGam]))
    for(let i=0;i<=60;i++) ymax=Math.max(ymax,knDsdo(PI*i/60,k)/(R_E*R_E));
  axes(ctx,b,0,180,0,ymax*1.08,{title:'the angular distribution',
    xlab:'θ  [degrees]', ylab:'(dσ/dΩ) / r_e²', xfmt:t=>fmt(t,0),
    yfmt:t=>fmt(t,2)});
  ctx.save(); clipTo(ctx,b);
  {
    const xs=[],ys=[];
    for(let i=0;i<=200;i++){ const t=PI*i/200; xs.push(t*RAD);
      ys.push(thomsonDsdo(t)/(R_E*R_E)); }
    polyline(ctx,b,xs,ys,0,180,0,ymax*1.08,'#5ac8e0',2.2,[6,4]);
  }
  for(let j=0;j<KS.length;j++){
    const xs=[],ys=[];
    for(let i=0;i<=200;i++){ const t=PI*i/200; xs.push(t*RAD);
      ys.push(knDsdo(t,KS[j])/(R_E*R_E)); }
    polyline(ctx,b,xs,ys,0,180,0,ymax*1.08,rgba('#8b93a6',0.55),1.2);
  }
  {
    const xs=[],ys=[];
    for(let i=0;i<=200;i++){ const t=PI*i/200; xs.push(t*RAD);
      ys.push(knDsdo(t,st.kGam)/(R_E*R_E)); }
    polyline(ctx,b,xs,ys,0,180,0,ymax*1.08,'#cd35c4',2.6);
  }
  ctx.restore();
  legendAt(ctx,b.x+14,b.y+16,[['#5ac8e0','Thomson (k → 0)',[6,4]],
    ['#cd35c4','Klein–Nishina, k = '+sig(st.kGam,3)],
    [rgba('#8b93a6',0.7),'k = 0.001, 0.1, 1, 10']]);

  /* the total cross section vs k */
  const kx0=-3, kx1=2;
  axes(ctx,b2,kx0,kx1,0,1.05,{title:'the total cross section',
    xlab:'log₁₀ k = log₁₀ E_γ/m_ec²', ylab:'σ / σ_Thomson',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  {
    const xs=[],ys=[];
    for(let i=0;i<=240;i++){
      const lk=kx0+(kx1-kx0)*i/240;
      xs.push(lk); ys.push(knTotal(Math.pow(10,lk))/SIG_T);
    }
    polyline(ctx,b2,xs,ys,kx0,kx1,0,1.05,'#b8ec4c',2.4);
    const Y=sy(b2,1,0,1.05);
    ctx.strokeStyle='#5ac8e0'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(b2.x,Y); ctx.lineTo(b2.x1,Y); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
  ctx.fillStyle='#5ac8e0'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillText('Thomson, 8πr_e²/3 = '+fmtBarn(SIG_T),b2.x1-6,sy(b2,1,0,1.05)-4);
  vMark(ctx,b2,sx(b2,Math.log10(st.kGam),kx0,kx1),'#cd35c4',
        'k = '+sig(st.kGam,3),0.10);
  vMark(ctx,b2,sx(b2,Math.log10(KN_SPLIT),kx0,kx1),'#7f8bd8',
        'series ↔ closed form',0.24);
  caption(ctx,b.x,b.y1+40,
    'The Klein–Nishina total has a closed form which is 1/k² times a difference '
    +'that vanishes as k → 0 — evaluated directly at k = 10⁻⁶ it returns '
    +'MINUS 42 Thomson cross sections. Below k = '+KN_SPLIT+' the series '
    +'1 − 2k + 26k²/5 − 133k³/10 + 1144k⁴/35 is used instead; the join is '
    +'where the two agree best, about 2 parts in 10¹⁰. Both branches are '
    +'asserted against each other there.',W-160,'#767e92');
}

/* ================================================================== *
 *  view F — the nucleus                                               *
 * ================================================================== */
function drawNucleus(ctx,W,H,M){
  const st=M.st;
  const b=box(86,54,W-126,(H-160)*0.60);
  const b3=box(86,54+(H-160)*0.60+58,W-126,(H-160)*0.24);
  const lx0=0, lx1=180;
  let ymin=99,ymax=-99;
  const pt=[],ff=[],ang=[];
  for(let i=1;i<=300;i++){
    const th=PI*i/300;
    const r=ruthDsdo(th,st.Z1,st.Z2,M.E);
    const F=formF(qOf(th,M.p),M.Rn);
    ang.push(th*RAD);
    const a=Math.log10(r/BARN), c=Math.log10(Math.max(r*F*F,1e-40)/BARN);
    pt.push(a); ff.push(c);
    ymin=Math.min(ymin,c); ymax=Math.max(ymax,a);
  }
  ymin=Math.max(ymin,ymax-14);
  axes(ctx,b,lx0,lx1,ymin-0.4,ymax+0.4,{
    title:'a point charge, and a nucleus of radius '+fmtFm(M.Rn),
    xlab:'scattering angle θ  [degrees]', ylab:'log₁₀ dσ/dΩ  [barn/sr]',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  if(st.showPoint) polyline(ctx,b,ang,pt,lx0,lx1,ymin-0.4,ymax+0.4,'#b8ec4c',2.2,[6,4]);
  polyline(ctx,b,ang,ff,lx0,lx1,ymin-0.4,ymax+0.4,'#cd35c4',2.4);
  ctx.restore();
  legendAt(ctx,b.x+14,b.y+16,[['#b8ec4c','Rutherford, point charge',[6,4]],
    ['#cd35c4','× |F(q)|², uniform sphere']]);
  if(isFinite(M.firstMinTh)&&M.firstMinTh*RAD<180)
    vMark(ctx,b,sx(b,M.firstMinTh*RAD,lx0,lx1),'#fff',
          'first zero, qR = '+sig(TANX_ROOT,6),0.30);
  else {
    ctx.fillStyle='#e8843a'; ctx.font='11.5px -apple-system,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('at pc = '+sig(st.pMeV,4)+' MeV the first zero lies past 180° — '
      +'this probe cannot resolve the nucleus',b.x+b.w/2,b.y+b.h*0.62);
  }
  ctx.save(); frame(ctx,b3,'#242a3a'); ctx.restore();
  caption(ctx,b3.x+12,b3.y+10,
    'The form factor is the Fourier transform of the charge distribution, and '
    +'for a uniform sphere it is 3[sin qR − qR cos qR]/(qR)³. Its first zero is '
    +'at qR = '+sig(TANX_ROOT,7)+', the first root of tan x = x — which sits '
    +'just BELOW the pole at 3π/2, so a root-finder handed the bracket 4.0 to '
    +'4.9 fails with the same sign at both ends. Measuring the angle of that '
    +'minimum measures R: at pc = '+sig(st.pMeV,4)+' MeV on A = '+st.A+' it is '
    +(isFinite(M.firstMinTh)?'at θ = '+sig(M.firstMinTh*RAD,4)+'°':'beyond 180°')
    +'. The closed form for F is also a difference of terms that agree to '
    +'O(x³), so below qR = 0.05 the series is used; at qR = 10⁻³ the direct '
    +'form has already lost six digits.',W-160,'#8b93a6');
}

/* ================================================================== *
 *  dispatch and scene                                                 *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='orbit')      return drawOrbit(ctx,W,H,M,S);
  if(v==='sigma')      return drawSigma(ctx,W,H,M);
  if(v==='experiment') return drawExperiment(ctx,W,H,M);
  if(v==='machinery')  return drawMachinery(ctx,W,H,M);
  if(v==='photons')    return drawPhotons(ctx,W,H,M);
  if(v==='nucleus')    return drawNucleus(ctx,W,H,M);
  return drawOrbit(ctx,W,H,M,S);
}
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.62,0.30,12,[0,0,0]);
  let M=null;
  const S={
    st,cam,zoom:1,pan:{x:0,y:0},
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    fit(){ S.zoom=1; S.pan.x=0; S.pan.y=0; },
    resetView(){ S.fit(); },
    /* only the orbit view is a picture rather than a plot, so only it
       responds to the wheel; the rest ignore the pointer on purpose */
    pointer(){},
    wheel(dy){
      if(st.view!=='orbit') return;
      S.zoom=clamp(S.zoom*Math.exp(-dy*0.0012),0.15,30);
    },
    step(){},
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarText(S.model()); },
    tag(){ return tagText(S.model()); },
    draw(){ drawView(canvas.getContext('2d'),cam.W,cam.H,S.model(),S); },
  };
  return S;
}
/* ================================================================== *
 *  boot                                                               *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  VIEWS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,idf,namef,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===idf(o)?' on':''),onclick:()=>{
        st[key]=idf(o); if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(idf(list[i])===st[key]?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},namef(o));
      wrapEl.appendChild(c);
    });
    wrapEl._sync=()=>[].forEach.call(wrapEl.children,(b,i)=>
      b.className='chip'+(idf(list[i])===st[key]?' on':''));
    return wrapEl;
  }
  function actionChips(list,namef,act,isOn){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(isOn&&isOn(o)?' on':''),onclick:()=>{
        act(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(isOn&&isOn(list[i])?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},namef(o));
      wrapEl.appendChild(c);
    });
    wrapEl._sync=()=>[].forEach.call(wrapEl.children,(b,i)=>
      b.className='chip'+(isOn&&isOn(list[i])?' on':''));
    return wrapEl;
  }

  const gTarget=h('div',{class:'grp'},h('h3',null,'the target'));
  const tChips=actionChips(TARGETS,o=>o.name,
    o=>{ st.Z2=o.Z; st.A=o.A; st.Rfm=0; },
    o=>st.Z2===o.Z&&st.A===o.A);
  gTarget.appendChild(tChips);
  gTarget.appendChild(slider('Z2','Z of the target',1,100,1,v=>fmt(v,0)));
  gTarget.appendChild(slider('A','mass number A',1,250,1,v=>fmt(v,0)));
  gTarget.appendChild(slider('Rfm','R override',0,12,0.01,
    v=>v>0?fmt(v,2)+' fm':'from A'));
  const tTag=h('div',{class:'tag'}); gTarget.appendChild(tTag);

  const gBeam=h('div',{class:'grp'},h('h3',null,'the beam'));
  const bChips=actionChips(BEAMS,o=>o.name,
    o=>{ st.Z1=o.Z; st.EMeV=o.E; },
    o=>st.Z1===o.Z&&Math.abs(st.EMeV-o.E)<1e-6);
  gBeam.appendChild(bChips);
  gBeam.appendChild(slider('Z1','Z of the beam',1,10,1,v=>fmt(v,0)));
  gBeam.appendChild(slider('EMeV','energy',0.5,120,0.1,v=>fmt(v,1)+' MeV'));
  const beamTag=h('div',{class:'tag'}); gBeam.appendChild(beamTag);

  const gGeom=h('div',{class:'grp'},h('h3',null,'the trajectory'));
  gGeom.appendChild(slider('bFrac','impact b/a',0.05,6,0.01,v=>fmt(v,2)));
  gGeom.appendChild(slider('nOrbits','trajectories',3,25,1,v=>fmt(v,0)));
  const geomTag=h('div',{class:'tag'}); gGeom.appendChild(geomTag);

  const gCurves=h('div',{class:'grp'},h('h3',null,'the curves'));
  const cChecks=h('div',{class:'checks'},
    checkbox('showRuth','Rutherford'),
    checkbox('showHard','hard sphere'),
    checkbox('showScreen','screened Coulomb'),
    checkbox('showThom','Thomson'),
    checkbox('showKN','Klein–Nishina'));
  gCurves.appendChild(cChecks);

  const gFoil=h('div',{class:'grp'},h('h3',null,'the 1913 foil'));
  gFoil.appendChild(chipRow([{id:'gold',n:'gold'},{id:'silver',n:'silver'}],
    'foil',o=>o.id,o=>o.n));
  const foilTag=h('div',{class:'src'}); gFoil.appendChild(foilTag);

  const gPhot=h('div',{class:'grp'},h('h3',null,'the photon'));
  gPhot.appendChild(slider('kGam','k = E/mₑc²',0.001,20,0.001,v=>sig(v,4)));
  const photTag=h('div',{class:'tag'}); gPhot.appendChild(photTag);

  const gProbe=h('div',{class:'grp'},h('h3',null,'the probe'));
  gProbe.appendChild(slider('pMeV','momentum pc',20,2000,1,v=>fmt(v,0)+' MeV'));
  gProbe.appendChild(h('div',{class:'checks'},checkbox('showPoint','the point charge')));
  const probeTag=h('div',{class:'tag'}); gProbe.appendChild(probeTag);

  const gView=h('div',{class:'grp'},h('h3',null,'the picture'));
  gView.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.resetView(); refresh(); }},'reset the view'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.resetView();
      S.rebuild(); syncPanel(); refresh(); }},'reset all')));
  const viewTag=h('div',{class:'tag'}); gView.appendChild(viewTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'));
  const infoEl=h('div',{id:'info'}); gInfo.appendChild(infoEl);
  const srcEl=h('div',{class:'src'}); gInfo.appendChild(srcEl);

  [gTarget,gBeam,gGeom,gCurves,gFoil,gPhot,gProbe,gView,gInfo]
    .forEach(g=>panel.appendChild(g));

  function syncPanel(){
    const v=st.view;
    gTarget.hidden=(v==='experiment'||v==='photons');
    gBeam.hidden  =(v==='experiment'||v==='photons');
    gGeom.hidden  =!(v==='orbit'||v==='machinery');
    gCurves.hidden=(v!=='sigma');
    gFoil.hidden  =(v!=='experiment');
    gPhot.hidden  =!(v==='photons'||v==='sigma');
    gProbe.hidden =(v!=='nucleus');
    for(const k in rows) rows[k].sync();
    if(tChips._sync) tChips._sync();
    if(bChips._sync) bChips._sync();
    [].forEach.call(cChecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showRuth','showHard','showScreen','showThom','showKN'][i]]; });
    [].forEach.call(gProbe.querySelectorAll('input[type=checkbox]'),(inp)=>{
      inp.checked=st.showPoint; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent =
        st.view==='orbit' ? 'scroll to zoom — the nucleus is smaller than it looks'
      : st.view==='sigma' ? 'the Coulomb curve has no total cross section, and the screened one does'
      : st.view==='experiment' ? 'the two blocks are spliced on their own overlap rows'
      : st.view==='machinery' ? 'the white points are the closed form checked against itself the hard way'
      : st.view==='photons' ? 'slide k and watch the backscatter die'
      : 'raise the momentum until the first minimum comes into range';
      subEl.innerHTML =
        (st.view==='experiment')
          ? 'Geiger &amp; Marsden 1913, '+M.gmName+' &mdash; N sin⁴(φ/2) constant '
            +'to '+fmt(M.gm.prodMax/M.gm.prodMin,2)+'× over '+fmtExp(M.gm.NSpan,2)
            +' : 1 in the counts'
        : (st.view==='photons')
          ? 'k = '+sig(st.kGam,4)+' &mdash; σ/σ_T = '+sig(M.knRatio,4)
        : (st.view==='nucleus')
          ? 'R = '+fmtFm(M.Rn)+' &mdash; first zero at '
            +(isFinite(M.firstMinTh)?sig(M.firstMinTh*RAD,3)+'°':'past 180°')
        : 'Z='+st.Z1+' on Z='+st.Z2+' at '+sig(st.EMeV,3)+' MeV &mdash; a = '
          +fmtFm(M.a)+', closest approach '+fmtFm(M.d0);
      tTag.innerHTML='R = 1.2A⅓ = <b>'+fmtFm(nuclearR(st.A))+'</b>'
        +(st.Rfm>0?' &nbsp;(overridden to <b>'+fmt(st.Rfm,2)+' fm</b>)':'')
        +'<br>head-on turning point <b'+(M.touches?' class="r"':' class="g"')+'>'
        +fmtFm(M.d0)+'</b>';
      beamTag.innerHTML='a = <b>'+fmtFm(M.a)+'</b> &nbsp; dσ/dΩ(180°) = <b>'
        +fmtBarn(M.dsdo(PI))+'</b>/sr'
        +'<br>touches the nucleus above <b>'+sig(M.Etouch/MEV,4)+'</b> MeV';
      geomTag.innerHTML='b = <b>'+fmtFm(M.b)+'</b> → θ = <b>'+sig(M.theta*RAD,4)
        +'°</b><br>closest approach <b>'+fmtFm(M.rmin)+'</b>';
      foilTag.innerHTML='Geiger &amp; Marsden 1913, Phil. Mag. 25, 604, Table II. '
        +'Reduction constant <b>'+fmt(M.gm.k,1)+'</b>, recovered from the '
        +M.gm.overlaps.length+' overlap rows rather than assumed.';
      photTag.innerHTML='E<sub>γ</sub> = <b>'+sig(M.EgamMeV,4)+'</b> MeV &nbsp; '
        +'σ/σ_T = <b>'+sig(M.knRatio,4)+'</b><br>forward/backward = <b>'
        +sig(M.fwdBack,4)+'</b>';
      probeTag.innerHTML='qR at 180° = <b>'+sig(M.qMax*M.Rn,4)+'</b>'
        +'<br>first zero at <b'+(isFinite(M.firstMinTh)?' class="g">':' class="r">')
        +(isFinite(M.firstMinTh)?sig(M.firstMinTh*RAD,4)+'°':'past 180°')+'</b>';
      viewTag.innerHTML=(st.view==='orbit')
        ? 'zoom <b>×'+sig(S.zoom,3)+'</b> — scroll to zoom'
        : 'this view is a plot; the pointer does nothing here';
      infoEl.innerHTML=INFO[st.view]||INFO.orbit;
      srcEl.innerHTML='Geiger &amp; Marsden 1913 (Phil. Mag. 25, 604) Table II, '
        +'read as raw text. Everything else is closed-form, and the closed forms '
        +'are checked against numerical quadrature rather than trusted.';
      S.draw();
    }catch(e){ fail(e); }
  }

  let dirty=false;
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY);
    dirty=true; },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=VIEWS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }
  });
  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });
  function frameLoop(){
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

const INFO={
  orbit:'Every alpha particle that comes past the nucleus follows a hyperbola, '
    +'and which hyperbola is decided by one number: the <b>impact parameter</b>, '
    +'how far off-centre it was aimed. Small b means a close pass and a big '
    +'deflection; large b means it sails by. The remarkable thing about the '
    +'geometry is the scale: at 7.7 MeV the α turns around tens of femtometres '
    +'out, while the gold nucleus is about seven femtometres across. Rutherford '
    +'scattering <b>never touches the nucleus</b> — which is exactly why it '
    +'measures a pure Coulomb field, and why finding where it breaks down was '
    +'later the way to measure nuclear size.',
  sigma:'A cross section is an area: how much of the incoming beam ends up '
    +'going a particular way. The Coulomb one is famous for what it does at '
    +'small angles — <b>1/sin⁴(θ/2) diverges</b>, and integrating it over all '
    +'solid angle gives infinity. That is not a defect of the formula. It is '
    +'the statement that a 1/r potential has infinite range, so every particle '
    +'is deflected by <i>something</i>, and the total cross section of a bare '
    +'charge is genuinely unbounded. Screen it — put electrons around the '
    +'nucleus — and the divergence goes away.',
  experiment:'This is the actual table from 1913. Geiger and Marsden counted '
    +'scintillations by eye, in the dark, for weeks. The counts vary by more '
    +'than a hundred thousand to one across the range, and the product '
    +'N&nbsp;sin⁴(φ/2) stays inside a factor of about 1.5. There is a trap in '
    +'the table: the large angles and the small angles were measured with '
    +'<b>different diaphragms</b>, so the two halves are on different scales. '
    +'They anticipated that and measured three angles with both, which is what '
    +'lets the halves be joined — and this sim recovers the joining factor from '
    +'those rows rather than assuming one.',
  machinery:'This is where a cross section comes from, and it is pure geometry. '
    +'Particles arriving in a thin ring of radius b and width db all come out '
    +'between θ and θ+dθ. Equate the areas: 2πb&nbsp;db = (dσ/dΩ)·2π sin θ dθ, '
    +'so <b>dσ/dΩ = (b/sin θ)|db/dθ|</b>. Nothing about that is quantum '
    +'mechanical or even electromagnetic — it works for any central force. The '

    +'integral, and agreeing with the closed form to ten digits is the check '

    +'as its zero-energy limit.',
  nucleus:'Rutherford scattering assumes the nucleus is a point. It is not, and '

    +'sphere that transform has zeros, and the angle of the first one is a '
    +'direct measurement of the radius. This is diffraction, in exactly the '
