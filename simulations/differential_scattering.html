};
/* ================================================================== *
 *  selfTest — runs when there is no document                          *
 *  Values marked (scipy) were printed by derive_ds.py and read in     *
 *  full, never through head/tail.                                     *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,t,n)=>ok(Math.abs(a-b)<=t,n+'  (got '+a+', want '+b+', tol '+t+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.abs(b),
    n+'  (got '+a+', want '+b+', rel tol '+t+')');
  const Z1=2, Z2=79, E=7.7*MEV;
  const Vc=(r)=>Z1*Z2*E_Q*E_Q*KE/r;

  /* ============ constants, each against an absolute number ========= */
  rel(ALPHA,7.297352569278033e-3,1e-12,'alpha, DERIVED from h (scipy)');
  close(1/ALPHA,137.035999,1e-5,'i.e. 1/137.036');
  rel(R_E,2.817940326204928e-15,1e-12,'classical electron radius (scipy)');
  rel(SIG_T,6.652458732173517e-29,1e-12,'Thomson cross section (scipy)');
  rel(SIG_T/BARN,0.6652458732,1e-9,'= 0.6652 barn');
  rel(LAM_C*1e12,2.426310239,1e-8,'Compton wavelength 2.4263 pm (scipy)');
  rel(MEC2/MEV,0.510999,1e-5,'m_e c^2 = 0.511 MeV');
  /* the derived ones must beat the rounded literals they replace */
  rel(HBAR,1.0545718176461565e-34,1e-15,'hbar = h/2pi, not the rounded literal');

  /* ================= Rutherford ==================================== */
  rel(ruthA(Z1,Z2,E),1.477366224409906e-14,1e-12,'a = Z1Z2e^2/8pi eps0 E (scipy)');
  rel(closestApproach(Z1,Z2,E,0),2.954732448819812e-14,1e-12,
      'head-on closest approach = 2a (scipy)');
  rel(closestApproach(Z1,Z2,E,0),2*ruthA(Z1,Z2,E),1e-14,'and it IS exactly 2a');
  for(const [d,v] of [[15,1.879860686840407e-25],[30,1.215993961512541e-26],
                      [60,8.730443844108727e-28],[90,2.182610961027182e-28],
                      [120,9.700493160120805e-29],[150,6.268176662680724e-29],
                      [180,5.456527402567952e-29]])
    rel(ruthDsdo(d*DEG,Z1,Z2,E),v,1e-12,'dsigma/dOmega('+d+' deg) (scipy)');
  /* b <-> theta round trip, and the one angle everyone remembers */
  for(const f of [0.2,1,5,20]){
    const b=f*ruthA(Z1,Z2,E);
    rel(ruthB(ruthTheta(b,Z1,Z2,E),Z1,Z2,E),b,1e-12,'b <-> theta round trip at b/a='+f);
  }
  rel(ruthTheta(ruthA(Z1,Z2,E),Z1,Z2,E),PI/2,1e-14,'b = a gives exactly 90 degrees');
  /* the scalings, each pinned separately */
  rel(ruthDsdo(PI/2,Z1,Z2,2*E)/ruthDsdo(PI/2,Z1,Z2,E),0.25,1e-12,
      'dsigma/dOmega scales as 1/E^2');
  rel(ruthDsdo(PI/2,Z1,2*Z2,E)/ruthDsdo(PI/2,Z1,Z2,E),4,1e-12,'and as Z2^2');
  rel(ruthDsdo(PI/2,2*Z1,Z2,E)/ruthDsdo(PI/2,Z1,Z2,E),4,1e-12,'and as Z1^2');
  ok(ruthDsdo(1*DEG,Z1,Z2,E)/ruthDsdo(180*DEG,Z1,Z2,E)>1e7,
     'and it spans seven decades between 1 and 180 degrees');

  /* ---- THE cross-check: the closed form against the definition ----
     dsigma/dOmega = (b/sin theta)|db/dtheta|, with theta(b) obtained by
     quadrature from the potential.  The first version of ruthDsdo in this
     file dropped a factor of 4 and this is what caught it. */
  for(const d of [5,15,30,60,90,120,150,175]){
    const th=d*DEG;
    rel(dsdoNumeric(th,E,Vc,(t)=>ruthB(t,Z1,Z2,E)),ruthDsdo(th,Z1,Z2,E),1e-6,
        'numerical (b/sin th)|db/dth| == closed form at '+d+' deg');
  }
  /* and the deflection integral itself against the closed form */
  for(const [f,v] of [[0.5,2.214297435588342],[1.0,1.570796326794583],
                      [5.0,0.394791119710880]])
    rel(thetaOfB(f*ruthA(Z1,Z2,E),E,Vc),v,1e-9,'thetaOfB(b/a='+f+') (scipy)');
  for(const f of [0.2,0.5,1,2,5,20])
    rel(thetaOfB(f*ruthA(Z1,Z2,E),E,Vc),
        ruthTheta(f*ruthA(Z1,Z2,E),Z1,Z2,E),1e-8,
        'the deflection quadrature reproduces 2 arctan(a/b) at b/a='+f);
  /* the quadrature machinery, against something with a known answer */
  rel(gl(x=>Math.exp(-x*x),0,6,8),Math.sqrt(PI)/2,1e-12,'the GL rule on a Gaussian');
  rel(gl(x=>1/(1+x*x),0,1,4),PI/4,1e-13,'and on an arctangent');
  /* r_min from the orbit must match the conservation-law formula */
  for(const f of [0.3,1,4]){
    const b=f*ruthA(Z1,Z2,E);
    rel(ruthOrbit(b,Z1,Z2,E,40).rmin,closestApproach(Z1,Z2,E,b),1e-9,
        'the conic r_min matches the energy/angular-momentum one at b/a='+f);
  }
  ok(ruthOrbit(ruthA(Z1,Z2,E),Z1,Z2,E,60).pts.length>40,'the orbit draws points');
  /* ---- the drawn orbit must arrive as a PARALLEL BEAM ----
     The conic is written with periapsis along +x, so drawing it unrotated
     gives every trajectory the same symmetry axis and the picture becomes a
     fan radiating from the nucleus — the opposite of a beam.  Assert the
     three things that make it a beam: the incoming leg is horizontal, its
     perpendicular offset from the nucleus is exactly b, and the outgoing leg
     leaves at the deflection angle. */
  for(const f of [0.3,1,3]){
    const b=f*ruthA(Z1,Z2,E);
    const o=ruthOrbit(b,Z1,Z2,E,400);
    const n=o.pts.length;
    const dIn=Math.atan2(o.pts[1][1]-o.pts[0][1],o.pts[1][0]-o.pts[0][0]);
    /* 1e-6, not 1e-9: the polyline stops at a finite radius, so the first
       CHORD is not exactly along the asymptote.  The rotation itself is
       analytic and exact; this residual is the truncation and it shrinks
       with it. */
    close(dIn,0,1e-6,'the incoming leg is horizontal at b/a='+f);
    /* the offset converges to b as the polyline is drawn further out; at the
       truncation this file uses it is within 0.03% */
    rel(Math.abs(o.pts[0][1]),b,1e-3,'and its offset from the nucleus is b at b/a='+f);
    ok(Math.abs(o.pts[0][1])>b,'approached from ABOVE, as a repulsive hyperbola '
       +'must be, at b/a='+f);
    const dOut=Math.atan2(o.pts[n-1][1]-o.pts[n-2][1],o.pts[n-1][0]-o.pts[n-2][0]);
    rel(Math.abs(dOut),o.theta,3e-3,'and the outgoing leg leaves at theta at b/a='+f);
    /* every point must be outside the closest approach */
    let bad=0;
    for(const q of o.pts) if(Math.hypot(q[0],q[1])<o.rmin*0.999) bad++;
    ok(bad===0,'and no point of the orbit is inside r_min at b/a='+f);
  }
  {
    /* two different impact parameters must arrive on PARALLEL lines */
    const o1=ruthOrbit(0.5*ruthA(Z1,Z2,E),Z1,Z2,E,200);
    const o2=ruthOrbit(3.0*ruthA(Z1,Z2,E),Z1,Z2,E,200);
    const d1=Math.atan2(o1.pts[1][1]-o1.pts[0][1],o1.pts[1][0]-o1.pts[0][0]);
    const d2=Math.atan2(o2.pts[1][1]-o2.pts[0][1],o2.pts[1][0]-o2.pts[0][0]);
    close(d1-d2,0,1e-6,'two impact parameters arrive parallel — it is a BEAM');
    ok(Math.abs(o1.pts[0][1]-o2.pts[0][1])>1e-15,'at different heights');
  }

  /* ================= hard sphere =================================== */
  rel(hardDsdo(0.3,5*FM),25*FM*FM/4,1e-14,'hard sphere dsigma/dOmega = R^2/4');
  ok(hardDsdo(0.3,5*FM)===hardDsdo(2.9,5*FM),'and it is isotropic');
  {
    const R=5*FM;
    const tot=gl(t=>hardDsdo(t,R)*TAU*Math.sin(t),0,PI,12);
    rel(tot,PI*R*R,1e-12,'integrating it over solid angle gives exactly pi R^2');
    rel(hardB(0,R),R,1e-14,'b(0) = R, a grazing hit');
    close(hardB(PI,R),0,1e-28,'and b(pi) = 0, a head-on one');
  }

  /* ================= photons ======================================= */
  rel(thomsonDsdo(0),R_E*R_E,1e-14,'Thomson forward = r_e^2');
  rel(thomsonDsdo(PI),R_E*R_E,1e-14,'and backward is the same — symmetric');
  rel(thomsonDsdo(PI/2),0.5*R_E*R_E,1e-14,'and half that at 90 degrees');
  rel(gl(t=>thomsonDsdo(t)*TAU*Math.sin(t),0,PI,12),SIG_T,1e-12,
      'integrating Thomson gives exactly 8 pi r_e^2/3');
  /* Klein-Nishina: the limit, the total, and both branches */
  for(const th of [0.3,1.0,2.5,PI])
    rel(knDsdo(th,1e-8),thomsonDsdo(th),1e-7,
        'Klein-Nishina -> Thomson as k -> 0, at theta='+fmt(th,2));
  rel(knDsdo(0,3.7),R_E*R_E,1e-14,'KN forward is r_e^2 at every energy');
  for(const [k,v] of [[0.001,0.998005186732686],[0.003,0.994046443375756],
      [0.01,0.980507019250366],[0.1,0.841338149631475],
      [1.0,0.430727841915043],[10.0,0.122759764296607]])
    rel(knTotal(k)/SIG_T,v,1e-9,'KN total at k='+k+' (scipy)');
  rel(knDsdo(90*DEG,1.0),1.488897690384738e-30,1e-12,'KN dsdo(90,k=1) (scipy)');
  rel(knDsdo(180*DEG,0.01),7.633933774744807e-30,1e-12,'KN dsdo(180,k=0.01) (scipy)');
  /* the total, by quadrature, against the closed form — two implementations */
  for(const k of [0.01,0.1,1,10])
    rel(gl(t=>knDsdo(t,k)*TAU*Math.sin(t),0,PI,16),knTotal(k),1e-9,
        'the KN total by quadrature matches the closed form at k='+k);
  /* the series branch, and the fact that it is NEEDED */
  rel(knTotal(1e-6)/SIG_T,0.999998000005,1e-9,'KN -> Thomson at k = 1e-6');
  ok(knTotalRaw(1e-6)/SIG_T<-1,'and the RAW closed form there returns '
     +(knTotalRaw(1e-6)/SIG_T).toFixed(2)+' sigma_T — the cancellation is real, '
     +'so the series branch cannot be deleted');
  for(const k of [0.0029,0.003,0.0031])
    rel(knTotal(k),knTotalRaw(k),1e-8,'series and closed agree at the join, k='+k);
  ok(KN_SPLIT>1e-3&&KN_SPLIT<1e-2,'and the join sits where both are accurate');
  ok(knTotal(0.1)<SIG_T&&knTotal(10)<knTotal(1),'the total falls with energy');
  ok(knDsdo(0,5)/knDsdo(PI,5)>10,'and the backscatter is strongly suppressed');
  /* Compton */
  rel(comptonLam(500e-12,PI)-500e-12,2*LAM_C,1e-14,'the Compton shift at 180 deg is 2 lambda_C');
  rel(comptonLam(500e-12,0),500e-12,1e-18,'and zero straight through');

  /* ================= the form factor =============================== */
  rel(TANX_ROOT,4.493409457909064,1e-11,'first root of tan x = x (scipy)');
  close(Math.tan(TANX_ROOT)-TANX_ROOT,0,1e-9,'and it solves its own equation');
  ok(TANX_ROOT<1.5*PI,'and it sits BELOW the pole at 3pi/2 — which is why a '
     +'bracket of 4.0 to 4.9 fails with the same sign at both ends');
  {
    const R=nuclearR(197);
    rel(nuclearR(197)/FM,1.2*Math.cbrt(197),1e-14,'R = 1.2 A^(1/3) fm');
    rel(formF(0,R),1,1e-15,'F(0) = 1 exactly');
    rel(formF(1e-3/R,R),0.999999900000004,1e-12,'F(qR=1e-3), series branch (scipy)');
    rel(formF(2/R,R),0.653096662469987,1e-11,'F(qR=2) (scipy)');
    close(formF(TANX_ROOT/R,R),0,1e-12,'and F vanishes at the first root');
    /* the series and the closed form must agree at the join, and the closed
       form must be visibly WORSE below it */
    for(const x of [0.045,0.05,0.055]){
      const direct=3*(Math.sin(x)-x*Math.cos(x))/(x*x*x);
      rel(formF(x/R,R),direct,1e-9,'F series == closed at the join, qR='+x);
    }
    {
      /* sin x - x cos x is a difference of terms of order x agreeing to
         O(x^3), so the relative loss goes as 3 eps/x^2: at qR = 1e-4 that
         is ~7e-8, which no tolerance on the answer would tolerate. */
      const x=1e-4;
      const direct=3*(Math.sin(x)-x*Math.cos(x))/(x*x*x);
      ok(Math.abs(direct/formF(x/R,R)-1)>1e-9,
         'and the direct form really has lost precision at qR = 1e-4 (rel '
         +Math.abs(direct/formF(x/R,R)-1).toExponential(2)+') — so the series '
         +'branch is necessary, not decorative');
    }
    ok(formF(1/R,R)<1&&formF(1/R,R)>0.9,'F falls away from 1 slowly at first');
    /* ---- the series must not be used where it is no longer good ----
       A mutation sweep pushed the join from qR = 0.05 up to 1.5 and every
       assertion stayed green, because the 4-term series is still right to
       1e-5 at qR = 1.5 and nothing was evaluated in between at a tolerance
       that could see it.  These pin the CLOSED form on its own side of the
       join, where the series would be measurably worse. */
    for(const [x,v] of [[0.8,0.937445645049553],[1.2,0.863211424644476],
                        [1.4,0.817232940883516],[2.0,0.653096662469987]]){
      rel(formF(x/R,R),v,1e-11,'F(qR='+x+') from the closed form (scipy)');
      const u=x*x, ser=1-u/10+u*u/280-u*u*u/15120;
      ok(Math.abs(ser/v-1)>1e-8,'and the 4-term series is visibly worse there '
         +'(rel '+Math.abs(ser/v-1).toExponential(2)+') — so the join must stay low');
    }
  }
  rel(qOf(PI,500*MEV/C_LIGHT),2*(500*MEV/C_LIGHT)/HBAR,1e-14,
      'q(180 deg) = 2p/hbar');
  rel(qOf(0,500*MEV/C_LIGHT),0,1e-18,'and q(0) = 0');

  /* ================= Geiger & Marsden ============================== */
  ok(GM.length===17,'17 rows of Table II (got '+GM.length+')');
  ok(GM.filter(r=>r[0]===1).length===11,'11 in the wide-beam block');
  ok(GM.filter(r=>r[0]===2).length===6,'6 in the reduced-diaphragm block');
  /* The tabulated 1/sin^4 column against exact evaluation.  It agrees to 0.7%
     at worst, and the residual is the PAPER'S arithmetic, not this code:
     three-significant-figure rounding accounts for up to 5e-3 of it, and the
     60-degree row (where 1/sin^4 is exactly 16) comes out exact to 4e-16,
     which is how you can tell whose error it is.  Tightening this further
     would be testing a 1913 slide rule.  (Known-bad list, shock_flow.html.) */
  {
    let worst=0;
    for(const r of GM){
      const s=Math.sin(r[1]*DEG/2);
      const ex=1/(s*s*s*s);
      worst=Math.max(worst,Math.abs(r[2]/ex-1));
      rel(ex,r[2],1e-2,'the printed 1/sin^4 matches the angle at '+r[1]+' deg');
    }
    ok(worst>1e-3,'and the table really does differ from exact somewhere (worst '
       +worst.toExponential(2)+') — so this is not a tautology');
    ok(worst<1e-2,'but nowhere by more than 1%');
    const r60=GM.find(r=>r[1]===60);
    rel(r60[2],16,1e-12,'and at 60 degrees, where 1/sin^4 is exactly 16, the '
       +'table is exact — the residual elsewhere is theirs, not ours');
  }
  /* and the tabulated ratio columns must be N / (1/sin^4) */
  for(const r of GM){
    if(isFinite(r[3])) rel(r[3]/r[2],r[4],1.5e-2,'Ag ratio column at '+r[1]+' deg');
    if(isFinite(r[5])) rel(r[5]/r[2],r[6],1.5e-2,'Au ratio column at '+r[1]+' deg');
  }
  for(const [w,name,K,PMIN,PMAX] of [[3,'silver',1112.12,18.56,34.80],
                                     [5,'gold',2818.69,27.53,39.55]]){
    const g=gmSplice(w);
    ok(g.overlaps.length===3,name+': the blocks overlap at exactly 3 angles');
    ok(g.overlaps.slice().sort((a,b)=>a-b).join(',')==='15,22.5,30',
       name+': and they are 15, 22.5 and 30 degrees');
    rel(g.k,K,1e-4,name+': the reduction constant from the overlap (scipy)');
    rel(g.prodMin,PMIN,1e-3,name+': min N sin^4 (scipy)');
    rel(g.prodMax,PMAX,1e-3,name+': max N sin^4 (scipy)');
    ok(g.prodMax/g.prodMin<2,name+': N sin^4 constant to better than 2x');
    ok(g.NSpan>4e4,name+': while the counts span '+g.NSpan.toExponential(1)+' : 1');
    ok(g.pts.every(p=>isFinite(p.N)&&p.N>0),name+': every spliced point is real');
    /* the splice must be self-consistent: applying k to the block-2 overlap
       rows must reproduce the block-1 values to within the spread */
    for(const a of g.overlaps){
      const r1=GM.find(r=>r[0]===1&&r[1]===a), r2=GM.find(r=>r[0]===2&&r[1]===a);
      close(Math.log(r2[w]*g.k/r1[w]),0,0.16,
            name+': the overlap at '+a+' deg is reproduced by k');
    }
  }
  {
    const ag=gmSplice(3), au=gmSplice(5);
    ok(au.k/ag.k>2&&au.k/ag.k<3.5,
       'gold\'s reduction constant is ~2.5x silver\'s, which is the 3x thinner '
       +'gold foil in the second series, not a discrepancy (ratio '
       +fmt(au.k/ag.k,2)+')');
    ok(ag.pts.length===13&&au.pts.length===14,
       'silver has 13 usable points and gold 14 — the paper prints "..." for '
       +'silver at 5 degrees and it is NOT invented');
  }

  /* ================= panels and drawing state ====================== */
  {
    let bad=0, checked=0;
    for(const [v] of VIEWS){
      for(const ov of [{}, {Z1:1},{Z1:10},{Z2:1},{Z2:100},{A:1},{A:250},
                       {EMeV:0.5},{EMeV:120},{bFrac:0.05},{bFrac:6},
                       {kGam:0.001},{kGam:20},{pMeV:20},{pMeV:2000},
                       {Rfm:12},{foil:'silver'},{showRuth:false},
                       {nOrbits:3},{nOrbits:25}]){
        const st=Object.assign({},DEFAULTS,{view:v},ov);
        const M=buildModel(st);
        const txt=readoutHTML(M)+eqbarText(M)+tagText(M);
        checked++;
        if(/NaN|undefined|Infinity/.test(txt)){ bad++;
          if(bad<3) console.log('   dirty panel: '+v+' '+JSON.stringify(ov)); }
      }
    }
    ok(bad===0,'every view x every extreme builds a clean panel ('+checked+' combos)');
  }
  {
    let bad=0;
    for(const Z2 of [1,29,100]) for(const Emev of [0.5,7.7,120])
      for(const A of [1,197,250]) for(const bf of [0.05,1,6]){
        const M=buildModel(Object.assign({},DEFAULTS,
          {Z2:Z2,EMeV:Emev,A:A,bFrac:bf}));
        for(const q of [M.a,M.theta,M.rmin,M.Rn,M.d0,M.Etouch,M.dsdo(PI/2)])
          if(!isFinite(q)) bad++;
        if(!M.orbit.pts.length) bad++;
        if(!M.fan.every(o=>o.pts.length>0)) bad++;
      }
    ok(bad===0,'and no parameter corner produces a non-finite quantity');
  }
  ok(plain('a &mdash; b')==='a — b','plain() decodes the entities this file uses');
  {
    const up=ticksFor(1,10,5);
    ok(up.length>=4,'ticksFor gives several ticks on an ordinary range');
    ok(ticksFor(10,1,5).length===1,'and collapses on an unsorted one — which is '
       +'why axes() sorts before asking');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
