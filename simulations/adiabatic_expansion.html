    xticks: ptx, yticks: pty, xfmt: tickfmt(ptx), yfmt: tickfmt(pty),
    title: s.site + ' — ' + s.date + ' ' + s.hour + 'Z' });

  /* the layer the balloon says is well mixed */
  if (isFinite(s.mixLapse) && s.mixTop > 0.2){
    clipTo(ctx, b, () => {
      ctx.fillStyle = 'rgba(184,236,76,0.055)';
      const y1 = py(b, 0, zlo, zhi), y0 = py(b, Math.min(s.mixTop, zhi), zlo, zhi);
      ctx.fillRect(b.x, y0, b.w, y1 - y0);
    });
  }
  if (st.showEnv){
    pl(ctx, b, s.env.filter(inZ).map(e => [e.T, e.zkm]), Tlo, Thi, zlo, zhi, C_CYAN, 2.0);
    pl(ctx, b, s.env.filter(inZ).map(e => [e.Td, e.zkm]), Tlo, Thi, zlo, zhi, '#3f7f9a', 1.6, [5, 4]);
  }
  pl(ctx, b, s.parcel.filter(inZ).map(p => [p.T, p.zkm]), Tlo, Thi, zlo, zhi, C_GREEN, 2.2);
  if (st.showMoist && s.moist.length)
    pl(ctx, b, s.moist.filter(inZ).map(p => [p.T, p.zkm]), Tlo, Thi, zlo, zhi, C_ORANGE, 2.0);
  if (isFinite(s.lcl.z)){
    const zl = (s.lcl.z - s.z0) / 1000;
    if (zl <= zhi) dot(ctx, b, s.lcl.T, zl, Tlo, Thi, zlo, zhi, C_MAG, 4.5);
  }
  const ent = [[C_GREEN, 'a parcel lifted dry-adiabatically', null]];
  if (st.showMoist && s.moist.length) ent.push([C_ORANGE, 'saturated, above the LCL', null]);
  if (st.showEnv){ ent.push([C_CYAN, 'the balloon: temperature', null]);
                   ent.push(['#3f7f9a', 'the balloon: dew point', [5, 4]]); }
  /* the profiles run top-left to bottom-right, so the legend goes bottom-left */
  legend(ctx, b.x + 12, b.y1 - 14 - 15 * ent.length, ent);

  /* theta panel */
  if (wth){
    const bt = box(b.x1 + 46, b.y, wth, b.h);
    let thl = 1e9, thh = -1e9;
    for (const e of s.env) if (inZ(e)){ thl = Math.min(thl, e.th); thh = Math.max(thh, e.th); }
    thl -= 2; thh += 2;
    /* three ticks, not six: this panel is 210 px wide */
    const tt = ticksN(thl, thh, 3);
    axes(ctx, bt, thl, thh, zlo, zhi, { xlab: 'θ  (K)', title: 'potential temperature',
      xticks: tt, yticks: ticksN(zlo, zhi, 5), xfmt: tickfmt(tt),
      yfmt: tickfmt(ticksN(zlo, zhi, 5)) });
    clipTo(ctx, bt, () => {
      const x0 = px(bt, s.env[0].th, thl, thh);
      ctx.strokeStyle = C_FAINT; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, bt.y); ctx.lineTo(x0, bt.y1); ctx.stroke();
      ctx.setLineDash([]);
    });
    pl(ctx, bt, s.env.filter(inZ).map(e => [e.th, e.zkm]), thl, thh, zlo, zhi, C_CYAN, 2.0);
    pl(ctx, bt, s.parcel.filter(inZ).map(p => [p.th, p.zkm]), thl, thh, zlo, zhi, C_GREEN, 1.8, [5, 4]);
  }

  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 5 -- where gamma comes from
 * ======================================================================== */
function viewGamma(ctx, W, H, M, S){
  const st = M.st;
  const wTot = Math.max(330, W - RO.w - 120);
  const mono0 = M.gam.rows.filter(r => r.atoms === 1 && r.inRange);
  const dia0  = M.gam.rows.filter(r => r.atoms === 2 && r.inRange);
  let msg = 'At ' + sg(st.gT, 4) + ' K';
  if (mono0.length){
    const dl = mono0.map(r => r.dof);
    msg += ' the ' + mono0.length + ' monatomic gases here give f = 2/(γ−1) between '
        + sg(Math.min(...dl), 3) + ' and ' + sg(Math.max(...dl), 3)
        + ' — three translations and nothing else, over a '
        + sg(Math.max(...mono0.map(r => r.M)) / Math.min(...mono0.map(r => r.M)), 2)
        + '-fold range of molar mass.';
  }
  if (dia0.length) msg += ' The diatomics add two rotations and sit near 5; their vibrations are '
      + 'frozen out at room temperature and only appear as γ falls at the hot end.';
  const foot = 'NIST c_p and c_v along the 1 bar isobar · '
    + 'a gas is drawn only over the range its own equation of state covers';
  const L = stage(ctx, W, H, msg, foot, wTot);
  /* the sound panel gets a share of what is left, and is dropped entirely when
     there is not enough for it plus its own labels */
  const hSound = st.showSound ? Math.min(250, Math.max(0, L.plotH - 200)) : 0;
  const b = box(66, L.top, wTot, Math.max(90, L.plotH - hSound));
  const Tlo = 60, Thi = 1000, glo = 1.15, ghi = 1.72;
  const gx = ticksN(Tlo, Thi, 6), gy = ticksN(glo, ghi, 5);
  axes(ctx, b, Tlo, Thi, glo, ghi, {
    xlab: 'temperature  (K)', ylab: 'γ = c_p / c_v', xticks: gx, yticks: gy,
    xfmt: tickfmt(gx), yfmt: tickfmt(gy),
    title: 'γ measured, against what counting modes predicts' });
  if (st.showEquip){
    for (const [lev, lab] of M.gam.levels){
      if (lev < glo || lev > ghi) continue;
      const Y = py(b, lev, glo, ghi);
      ctx.save();
      ctx.strokeStyle = '#39415a'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x, Y); ctx.lineTo(b.x1, Y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#6f7789'; ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      /* right-hand end: every curve is steep on the LEFT of this plot and flat
         on the right, so a left-anchored label lies across all of them */
      ctx.fillText(plain(lab), b.x1 - 8, Y - 2);
      ctx.restore();
    }
  }
  const colFor = (r) => r.atoms === 1 ? C_CYAN : (r.atoms === 2 ? C_GREEN : C_ORANGE);
  for (const c of M.gam.curves){
    const col = c.atoms === 1 ? C_CYAN : (c.atoms === 2 ? C_GREEN : C_ORANGE);
    pl(ctx, b, c.pts, Tlo, Thi, glo, ghi, col, 1.5);
  }
  /* the marker temperature */
  clipTo(ctx, b, () => {
    const X = px(b, st.gT, Tlo, Thi);
    ctx.strokeStyle = C_MAG; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(X, b.y); ctx.lineTo(X, b.y1); ctx.stroke(); ctx.setLineDash([]);
  });
  for (const r of M.gam.rows)
    if (r.inRange) dot(ctx, b, st.gT, r.gamma, Tlo, Thi, glo, ghi, colFor(r), 3.2);
  /* bottom left: the equipartition level labels are pinned to the right edge
     and the curves are steep on the left and flat on the right, so the only
     empty corner is below the lowest curve at the cold end */
  legend(ctx, b.x + 14, b.y1 - 58,
    [[C_CYAN, 'monatomic', null], [C_GREEN, 'diatomic', null], [C_ORANGE, 'polyatomic', null]]);

  /* 46 px was not enough: the plot's own x-axis title sits at b.y1 + 21 and
     this panel's title is drawn on its top edge, so at 1100x700 the two
     overlapped by four pixels.  Found by the layout check in selfTest, not by
     looking -- it is invisible at the default size. */
  if (st.showSound && hSound >= 128){
    const bs = box(66, b.y1 + 64, wTot, hSound - 80);
    const rows = M.gam.rows.filter(r => isFinite(r.w) && r.inRange);
    const wmax = Math.max(...rows.map(r => r.w)) * 1.08;
    const sy = ticksN(0, wmax, 4);
    axes(ctx, bs, 0, rows.length, 0, wmax, {
      ylab: 'speed of sound  (m/s)', xticks: [], yticks: sy, yfmt: tickfmt(sy),
      title: 'Newton had it isothermal; Laplace made it adiabatic' });
    rows.forEach((r, i) => {
      const xc = px(bs, i + 0.5, 0, rows.length), bw = Math.min(26, bs.w / rows.length * 0.5);
      const yN = py(bs, r.cNewton, 0, wmax), yL = py(bs, r.cLaplace, 0, wmax);
      const yM = py(bs, r.w, 0, wmax);
      ctx.fillStyle = 'rgba(232,132,58,0.35)';
      ctx.fillRect(xc - bw / 2, yN, bw, bs.y1 - yN);
      ctx.fillStyle = 'rgba(184,236,76,0.45)';
      ctx.fillRect(xc - bw / 2, yL, bw, yN - yL);
      ctx.strokeStyle = C_MAG; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(xc - bw / 2 - 3, yM); ctx.lineTo(xc + bw / 2 + 3, yM); ctx.stroke();
      ctx.fillStyle = C_DIM; ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      /* short symbols: "carbon dioxide".split(' ')[0] is "carbon", which is a
         different substance */
      ctx.fillText(plain(GASSYM[r.gas] || r.gas), xc, bs.y1 + 5);
    });
    legend(ctx, bs.x + bs.w - 12, bs.y + 14,
      [[C_ORANGE, 'Newton  √(RT/M)', null], [C_GREEN, 'Laplace  √(γRT/M)', null],
       [C_MAG, 'NIST measured', null]], 'right');
  }

  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 6 -- the real adiabat
 * ======================================================================== */
function viewReal(ctx, W, H, M, S){
  const st = M.st, R = M.real;
  const wTot = Math.max(330, W - RO.w - 120);
  let msg = '';
  if (R.covers){
    msg = 'Expanded from ' + sg(R.Phi, 4) + ' bar down to ' + sg(R.Preach, 3) + ' bar the real gas '
        + 'arrives at ' + sg(R.Treach, 4) + ' K; the power law started from the same state and '
        + 'the same γ predicts ' + sg(adiabatTfromP(R.T0, R.Phi, R.Preach, R.gamma0), 4)
        + ' K — out by ' + sg(Math.abs(R.devEnd[1]), 3) + ' K. '
        + 'κ and c_p/c_v differ by ' + sg(Math.abs(R.kappa[R.kappa.length - 1][1]
            - R.gcurve[R.gcurve.length - 1][1]), 3) + ' at ' + sg(R.Phi, 4) + ' bar: '
        + 'the exponent that governs sound and the ratio of heat capacities are the same number '
        + 'only for an ideal gas.';
  } else {
    msg = 'The isentrope leaves the range of NIST\'s equation of state before it gets anywhere, '
        + 'so only the part inside it is drawn.';
  }
  if (R.substituted) msg += ' (There is no property grid for ' + M.gasName + ' in this file, so '
    + R.name + ' is shown instead.)';
  const foot = 'the isentrope is solved from NIST\'s own entropy, interpolated as '
    + 's + R ln P so the −R ln P trend is not being fitted by a straight line';
  const L = stage(ctx, W, H, msg, foot, wTot);
  const bw2 = wTot > 420 ? Math.min(230, wTot * 0.36) : 0;
  const b = box(66, L.top, wTot - (bw2 ? bw2 + 52 : 0), L.plotH);
  const Plo = R.Plo, Phi = R.Phi;
  let Tl = 1e9, Th = -1e9;
  for (const q of R.real.concat(R.ideal)){ Tl = Math.min(Tl, q[1]); Th = Math.max(Th, q[1]); }
  Tl = Math.max(0, Tl - 20); Th += 20;
  const rx = ticksN(Plo, Phi, 6), ry = ticksN(Tl, Th, 5);
  axes(ctx, b, Plo, Phi, Tl, Th, {
    xlab: 'pressure  (bar)', ylab: 'temperature  (K)',
    xticks: rx, yticks: ry, xfmt: tickfmt(rx), yfmt: tickfmt(ry),
    title: R.name + ' expanding adiabatically from ' + sg(R.T0, 4) + ' K, ' + sg(Phi, 4) + ' bar' });
  pl(ctx, b, R.ideal, Plo, Phi, Tl, Th, C_ORANGE, 2.0, [7, 4]);
  pl(ctx, b, R.real,  Plo, Phi, Tl, Th, C_GREEN, 2.4);
  dot(ctx, b, Phi, R.T0, Plo, Phi, Tl, Th, C_MAG, 4.5);
  legend(ctx, b.x + 14, b.y + 16,
    [[C_GREEN, 'NIST — the real isentrope', null],
     [C_ORANGE, 'T P^((1−γ)/γ), γ = ' + sg(R.gamma0, 5) + ' at the start', [7, 4]]]);

  /* right-hand column: the two exponents, and Z.  Dropped whole when the stage
     is too narrow, rather than squeezed into an unreadable sliver. */
  if (!bw2 || b.h < 200){ drawStage(ctx, W, H, L); return; }
  const b2 = box(b.x1 + 52, L.top, bw2, (b.h - 46) / 2);
  const kv = R.kappa.map(q => q[1]).concat(R.gcurve.map(q => q[1]));
  const klo = Math.min(...kv) - 0.03, khi = Math.max(...kv) + 0.03;
  const ky = ticksN(klo, khi, 4);
  axes(ctx, b2, Plo, Phi, klo, khi, { title: 'two exponents', xticks: [],
    yticks: ky, yfmt: tickfmt(ky) });
  pl(ctx, b2, R.kappa,  Plo, Phi, klo, khi, C_GREEN, 2.0);
  pl(ctx, b2, R.gcurve, Plo, Phi, klo, khi, C_ORANGE, 2.0, [6, 4]);
  legend(ctx, b2.x + 8, b2.y + 14,
    [[C_GREEN, 'κ from measured sound speed', null], [C_ORANGE, 'c_p/c_v', [6, 4]]]);

  const b3 = box(b.x1 + 52, b2.y1 + 46, bw2, b2.h);
  const zv = R.Z.map(q => q[1]);
  const zlo2 = Math.min(0.95, Math.min(...zv) - 0.03), zhi2 = Math.max(...zv) + 0.03;
  const zx = ticksN(Plo, Phi, 3), zy = ticksN(zlo2, zhi2, 4);
  axes(ctx, b3, Plo, Phi, zlo2, zhi2, {
    xlab: 'pressure  (bar)', title: 'Z = Pv/RT along ' + sg(R.T0, 4) + ' K',
    xticks: zx, yticks: zy, xfmt: tickfmt(zx), yfmt: tickfmt(zy) });
  pl(ctx, b3, R.Z, Plo, Phi, zlo2, zhi2, C_CYAN, 2.0);
  clipTo(ctx, b3, () => {
    const Y = py(b3, 1, zlo2, zhi2);
    ctx.strokeStyle = C_FAINT; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(b3.x, Y); ctx.lineTo(b3.x1, Y); ctx.stroke(); ctx.setLineDash([]);
  });

  drawStage(ctx, W, H, L);
}

/* ========================================================================== */
function drawView(ctx, W, H, M, S){
  LEGEND_BOXES = [];
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#070b18'; ctx.fillRect(0, 0, W, H);
  const f = { piston: viewPiston, free: viewFree, throttle: viewThrottle,
              parcel: viewParcel, gamma: viewGamma, real: viewReal }[M.view];
  if (f) f(ctx, W, H, M, S);
}

/* ============================================================================
 *  readout, equation bar, captions, the panel, and boot
 * ========================================================================== */
function readoutHTML(M){
  const st = M.st, v = st.view;
  const row = (a, b, c) => '<tr><td>' + a + '</td><td class="v' + (c ? ' ' + c : '') + '">' + b + '</td></tr>';
  const hd  = (t) => '<tr><td class="hd" colspan="2">' + t + '</td></tr>';
  let name = '', sub = '', body = '', note = '';

  if (v === 'piston'){
    name = 'the piston';
    sub = M.gasName + ', one mole, expanding ' + sg(st.vratio, 3) + '&times;';
    body = hd('the gas')
      + row('&gamma; = c<sub>p</sub>/c<sub>v</sub>', sg(M.gamma, 6))
      + row('&nbsp;&nbsp;degrees of freedom 2/(&gamma;&minus;1)', sg(M.dofEff, 4))
      + row('c<sub>v</sub>', sg(M.cv, 5) + ' J/mol/K')
      + row('start', sg(st.T1, 4) + ' K, ' + sg(st.P1bar, 4) + ' bar')
      + hd('held at temperature')
      + row('final T', sg(st.T1, 4) + ' K')
      + row('final P', sg(M.P2iso / BAR, 4) + ' bar')
      + row('work out', sg(M.Wiso, 5) + ' J/mol')
      + row('heat in', sg(M.Qiso, 5) + ' J/mol')
      + row('&Delta;S', sg(M.dSiso, 4) + ' J/mol/K')
      + hd('insulated')
      + row('final T', sg(M.T2ad, 4) + ' K', 'good')
      + row('final P', sg(M.P2ad / BAR, 4) + ' bar')
      + row('work out', sg(M.Wad, 5) + ' J/mol')
      + row('heat in', '0')
      + row('&Delta;U', sg(M.dUad, 5) + ' J/mol')
      + row('&Delta;S', '0')
      + hd('the difference')
      + row('temperature drop', sg(st.T1 - M.T2ad, 4) + ' K')
      + row('work forgone', sg(M.Wiso - M.Wad, 5) + ' J/mol')
      + row('slope ratio (must be &gamma;)', M.slopeRatio.toFixed(9), 'good');
    note = '<p class="note">The insulated gas ends colder and does less work, and those are the '
         + 'same fact: with no heat coming in, every joule it pushes out has to be taken from its '
         + 'own internal energy.</p>';

  } else if (v === 'free'){
    name = 'free expansion';
    sub = M.gasName + ' into vacuum, ' + sg(st.feRatio, 3) + '&times;';
    const fe = M.fe;
    body = hd('the vessel')
      + row('v&#8321;', sg(M.v1 * 1000, 4) + ' l/mol')
      + row('v&#8322;', sg(M.v1 * st.feRatio * 1000, 4) + ' l/mol')
      + row('work done by the gas', '0')
      + row('heat crossing the wall', '0')
      + row('&Delta;U', '0')
      + hd('burst the partition')
      + row('ideal gas: final T', sg(fe.T2ideal, 5) + ' K')
      + row('van der Waals: final T', sg(fe.T2real, 5) + ' K')
      + row('&nbsp;&nbsp;cooling', sg(st.T1 - fe.T2real, 3) + ' K')
      + row('&Delta;S', sg(fe.dSuse, 4) + ' J/mol/K', 'bad')
      + hd('the same expansion, reversibly')
      + row('final T', sg(fe.TrevUse, 5) + ' K', 'good')
      + row('&nbsp;&nbsp;cooling', sg(st.T1 - fe.TrevUse, 4) + ' K')
      + row('&Delta;S', '0', 'good')
      + row('ratio of the two coolings',
            sg((st.T1 - fe.TrevUse) / Math.max(st.T1 - fe.Tuse, 1e-12), 4))
      + hd('why it cools at all')
      + row('a', sg(M.a, 5) + ' Pa&middot;m&#8310;/mol&sup2;')
      + row('(&part;T/&part;v)<sub>u</sub> at v&#8321;', sg(jouleCoef(M.v1, st.T1, M.a, M.b, M.cv), 4) + ' K/(m&sup3;/mol)');
    note = '<p class="note">Both processes are adiabatic &mdash; no heat crosses the boundary in '
         + 'either. Only one of them is isentropic. A free expansion generates entropy without '
         + 'any heat being transferred anywhere, which is what irreversible means.</p>';

  } else if (v === 'throttle'){
    const T = M.thr;
    name = 'the throttle';
    sub = M.gasName + ' at ' + sg(st.thrT, 4) + ' K, ' + sg(st.thrP, 4) + ' bar';
    const mm = isFinite(T.muMeas) ? T.muMeas : T.muVdw;
    body = hd('at the operating point')
      + row('&mu; measured (NIST)', isFinite(T.muMeas) ? sg(T.muMeas, 4) + ' K/bar' : 'off grid')
      + row('&mu; van der Waals', sg(T.muVdw, 4) + ' K/bar')
      + row('throttled to 1 bar', (mm > 0 ? '&minus;' : '+') + sg(Math.abs(mm) * (st.thrP - 1), 3) + ' K',
            mm > 0 ? 'good' : 'bad')
      + hd('inversion temperature at P &rarr; 0')
      + row('measured', isFinite(T.TinvMeas) ? sg(T.TinvMeas, 5) + ' K' : 'out of NIST range',
            isFinite(T.TinvMeas) ? '' : 'bad')
      + row('&nbsp;&nbsp;in units of T<sub>c</sub>', isFinite(T.TinvRed) ? sg(T.TinvRed, 4) : '&mdash;')
      + row('van der Waals 2a/Rb', sg(T.TinvVdw, 5) + ' K')
      + row('&nbsp;&nbsp;in units of T<sub>c</sub>', '6.75')
      + row('van der Waals error',
            isFinite(T.TinvMeas) ? sg(100 * (T.TinvVdw / T.TinvMeas - 1), 3) + '%' : '&mdash;', 'bad')
      + hd('the critical point it was built from')
      + row('T<sub>c</sub>', sg(M.F.Tc, 6) + ' K')
      + row('P<sub>c</sub>', sg(M.F.Pc, 5) + ' bar')
      + row('Z<sub>c</sub> measured', sg(M.ZcMeas, 4))
      + row('Z<sub>c</sub> van der Waals', '0.375', 'bad');
    note = '<p class="note">Throttling is adiabatic and irreversible, and it holds <b>enthalpy</b> '
         + 'fixed rather than entropy. Whether the gas cools or warms is not a property of the '
         + 'gas but of where it starts: inside the inversion curve it cools, outside it warms. '
         + 'Hydrogen and helium sit outside theirs at room temperature, which is why a hydrogen '
         + 'leak gets hotter as it escapes.</p>';

  } else if (v === 'parcel'){
    const s = M.snd;
    name = 'the rising parcel';
    sub = s.site + ', ' + s.date + ' ' + s.hour + 'Z';
    body = hd('the lapse rate')
      + row('g/c<sub>p</sub>, from NIST c<sub>p</sub>', sg(s.lapseDry, 5) + ' K/km', 'good')
      + row('if air were ideal diatomic', sg(s.lapseIdealDiatomic, 5) + ' K/km')
      + row('c<sub>p</sub> of dry air at 0&deg;C', sg(CPD_REF, 6) + ' J/kg/K')
      + row('molar mass of dry air', sg(airMolarMass() * 1000, 6) + ' g/mol')
      + row('&kappa; = R/c<sub>p</sub>', sg(KAPPA_AIR, 6))
      + hd('what the balloon measured')
      + row('well-mixed layer', isFinite(s.mixLapse) ? sg(s.mixTop, 3) + ' km' : 'none')
      + row('&nbsp;&nbsp;levels in it', s.mixN || '&mdash;')
      + row('&nbsp;&nbsp;fitted lapse rate',
            isFinite(s.mixLapse) ? sg(s.mixLapse, 5) + ' K/km' : '&mdash;',
            isFinite(s.mixLapse) ? 'good' : 'bad')
      + row('&nbsp;&nbsp;scatter about the fit',
            isFinite(s.mixRms) ? sg(s.mixRms, 3) + ' K' : '&mdash;')
      + row('&nbsp;&nbsp;departure from g/c<sub>p</sub>',
            isFinite(s.mixLapse) ? sg(100 * (s.mixLapse / s.lapseDry - 1), 3) + '%' : '&mdash;')
      + hd('the opposite case')
      + row('strongest inversion', '+' + sg(s.inv.g, 4) + ' K/km', 'bad')
      + row('&nbsp;&nbsp;between', sg(s.inv.z1, 3) + ' and ' + sg(s.inv.z2, 3) + ' km')
      + hd('the parcel')
      + row('surface T', sg(s.Tsfc, 4) + ' K')
      + row('surface dew point', sg(s.Tdsfc, 4) + ' K')
      + row('condensation level',
            isFinite(s.lcl.z) ? sg((s.lcl.z - s.z0) / 1000, 3) + ' km' : 'not reached')
      + row('moist lapse rate there',
            isFinite(s.lcl.z) ? sg(lapseMoist(s.lcl.T, s.lcl.p) * 1000, 4) + ' K/km' : '&mdash;');
    note = '<p class="note">A rising parcel is the purest adiabatic expansion there is: nothing '
         + 'insulates it except the fact that air conducts heat far too slowly to matter over a '
         + 'kilometre. It cools because the pressure around it falls and it has to push the '
         + 'surrounding air out of the way.</p>';

  } else if (v === 'gamma'){
    name = 'where &gamma; comes from';
    sub = 'at ' + sg(st.gT, 4) + ' K, 1 bar';
    body = hd('measured &gamma; = c<sub>p</sub>/c<sub>v</sub>');
    for (const r of M.gam.rows){
      body += row(r.name + (r.inRange ? '' : ' <i>(out of range)</i>'),
                  r.inRange ? sg(r.gamma, 5) : '&mdash;');
    }
    body += hd('degrees of freedom, 2/(&gamma;&minus;1)');
    for (const r of M.gam.rows){
      body += row(r.name, r.inRange ? sg(r.dof, 4) + '  <i>(counts ' + r.dofRigid + ')</i>' : '&mdash;',
                  r.inRange && Math.abs(r.dof - r.dofRigid) < 0.25 ? 'good' : '');
    }
    const air = 1.4;
    body += hd('the speed of sound in dry air')
      + row('Laplace &radic;(&gamma;RT/M) at 0&deg;C',
            sg(soundLaplace(air, T0C, airMolarMass()), 6) + ' m/s')
      + row('Newton &radic;(RT/M) at 0&deg;C',
            sg(soundNewton(T0C, airMolarMass()), 6) + ' m/s', 'bad')
      + row('the ratio', sg(Math.sqrt(air), 6))
      + row('Newton is low by', sg(100 * (1 - 1 / Math.sqrt(air)), 3) + '%');
    note = '<p class="note">Equipartition gives each quadratic mode &frac12;kT, so &gamma; counts '
         + 'modes and nothing else &mdash; not the mass, not the size. Xenon is 33 times heavier '
         + 'than helium and has the same &gamma;; its sound speed is six times slower entirely '
         + 'because of the M in &radic;(&gamma;RT/M).</p>';

  } else {
    const R = M.real;
    name = 'the real adiabat';
    sub = R.name + ' from ' + sg(R.T0, 4) + ' K, ' + sg(R.Phi, 4) + ' bar';
    body = hd('expanding to ' + sg(R.Preach, 3) + ' bar')
      + row('real (NIST isentrope)', sg(R.Treach, 5) + ' K', 'good')
      + row('P v<sup>&gamma;</sup> with &gamma; = ' + sg(R.gamma0, 5),
            sg(adiabatTfromP(R.T0, R.Phi, R.Preach, R.gamma0), 5) + ' K')
      + row('difference', sg(R.devEnd[1], 4) + ' K', 'bad')
      + row('largest difference on the path', sg(R.devMax, 4) + ' K')
      + hd('the two exponents at ' + sg(R.Phi, 4) + ' bar')
      + row('&kappa; from the sound speed',
            R.kappa.length ? sg(R.kappa[R.kappa.length - 1][1], 5) : '&mdash;')
      + row('c<sub>p</sub>/c<sub>v</sub>',
            R.gcurve.length ? sg(R.gcurve[R.gcurve.length - 1][1], 5) : '&mdash;')
      + row('they differ by',
            (R.kappa.length && R.gcurve.length)
              ? sg(R.kappa[R.kappa.length - 1][1] - R.gcurve[R.gcurve.length - 1][1], 3) : '&mdash;',
            'bad')
      + hd('how far from ideal')
      + row('Z at ' + sg(R.Phi, 4) + ' bar', R.Z.length ? sg(R.Z[R.Z.length - 1][1], 5) : '&mdash;')
      + row('Z at ' + sg(R.Plo, 3) + ' bar', R.Z.length ? sg(R.Z[0][1], 6) : '&mdash;')
      + row('&gamma; in the dilute limit',
            sg(interp1(ISOBAR[R.gas].T, ISOBAR[R.gas].cp, R.T0)
              / interp1(ISOBAR[R.gas].T, ISOBAR[R.gas].cv, R.T0), 5));
    note = '<p class="note">P v<sup>&gamma;</sup> is not a law of nature; it is what the first law '
         + 'gives when the internal energy happens to be a function of temperature alone. Where '
         + 'that stops being true &mdash; dense, cold, near the critical point &mdash; so does the '
         + 'power law, and the honest thing is to integrate the measured entropy instead.</p>';
  }
  return '<div class="rname">' + name + '<small>' + sub + '</small></div>'
       + '<table>' + body + '</table>' + note;
}

function eqbarText(M){
  const v = M.view;
  if (v === 'piston') return ['P v<sup>&gamma;</sup> = const,&nbsp;&nbsp; T v<sup>&gamma;&minus;1</sup> = const,'
    + '&nbsp;&nbsp; W = (P&#8321;v&#8321; &minus; P&#8322;v&#8322;)/(&gamma;&minus;1)',
    'Everything here is the first law with Q = 0: the work comes out of the internal energy, so the gas cools.'];
  if (v === 'free') return ['(&part;T/&part;v)<sub>u</sub> = &minus;(1/c<sub>v</sub>)[T(&part;P/&part;T)<sub>v</sub> &minus; P] = &minus;a/c<sub>v</sub>v&sup2;',
    'Free expansion holds the internal energy fixed, not the entropy. Zero for an ideal gas; negative for a real one.'];
  if (v === 'throttle') return ['&mu; = (&part;T/&part;P)<sub>H</sub> = (1/c<sub>p</sub>)[T(&part;v/&part;T)<sub>P</sub> &minus; v]'
    + ',&nbsp;&nbsp; P<sub>r</sub> = 24&radic;(3T<sub>r</sub>) &minus; 12T<sub>r</sub> &minus; 27',
    'Throttling holds the enthalpy fixed. The sign of &mu; decides whether the gas cools, and it changes across the inversion curve.'];
  if (v === 'parcel') return ['&Gamma;<sub>d</sub> = g/c<sub>p</sub>,'
    + '&nbsp;&nbsp; &theta; = T(p&#8320;/p)<sup>R/c<sub>p</sub></sup>,'
    + '&nbsp;&nbsp; d&theta;/dz = (&theta;/T)(dT/dz + g/c<sub>p</sub>)',
    'A parcel is neutrally buoyant exactly where &theta; is constant, and that is exactly where the temperature falls at g/c<sub>p</sub>.'];
  if (v === 'gamma') return ['&gamma; = 1 + 2/f,'
    + '&nbsp;&nbsp; c = &radic;(&gamma;RT/M)&nbsp;&nbsp;(Laplace)&nbsp;&nbsp;vs&nbsp;&nbsp;&radic;(RT/M)&nbsp;&nbsp;(Newton)',
    'f counts the quadratic modes that are awake at that temperature &mdash; three translations, plus rotations, plus vibrations once it is hot enough.'];
  return ['&kappa; &equiv; &minus;(v/P)(&part;P/&part;v)<sub>s</sub> = Mc&sup2;/Pv,'
    + '&nbsp;&nbsp; &kappa; = c<sub>p</sub>/c<sub>v</sub> only when Pv = RT',
    'The exponent in the adiabat is the isentropic one. For a real gas it is not the ratio of heat capacities, and it is not constant.'];
}
function tagText(M){
  const v = M.view;
  if (v === 'parcel') return 'sounding: Univ. of Wyoming ' + M.snd.stn + '  ·  θ recomputed here';
  if (v === 'gamma' || v === 'real' || v === 'throttle')
    return 'NIST Chemistry WebBook SRD 69  ·  reference equations of state';
  return 'ideal + van der Waals from measured critical points (NIST)';
}

const INFO = {

    + 'and it stays at one temperature, drawing in exactly as much heat as the work it does. '
    + 'Wrap it in insulation instead and there is nothing to draw on, so the work is paid for out '
    + 'of the internal energy and the gas gets colder as it goes. That is the whole of adiabatic '
    + 'expansion, and everything else in this file is a consequence of it. The adiabat is steeper '

    + 'But the gas pushes on nothing and therefore does no work, so its internal energy is '
    + 'unchanged, and an ideal gas comes out at exactly the temperature it went in at. The entropy '

/* ------------------------------------------------------------------------ */
function makeScene(canvas){
  const st = Object.assign({}, DEFAULTS);
  const cam = { W: 900, H: 600 };
  let M = null;
  const S = {
    st, cam, zoom: 1,
    model(){ if (!M) S.rebuild(); return M; },
    rebuild(){ M = buildModel(st); },
    fit(){ S.zoom = 1; },
    resetView(){ S.fit(); },
    /* There is deliberately no pointer(), wheel() or step() here.  Every view
       is a plot with its own axes and nothing to gain from a camera, and a
       no-op method that nothing calls is not a feature -- a mutation sweep
       proved it by rewriting wheel() to accumulate a zoom and changing
       nothing whatsoever, because no code path reached it.  What guards the
       intent instead is an assertion in selfTest that no view reads a zoom at
       all, which is a statement about the views rather than about a handler. */
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarText(S.model()); },
    tag(){ return tagText(S.model()); },
    draw(){ drawView(canvas.getContext('2d'), cam.W, cam.H, S.model(), S); },
  };
  return S;
}

function boot(){
  const canvas = document.getElementById('scene');
  const panel  = document.getElementById('panel');
  const tabsEl = document.getElementById('tabs');
  const roEl   = document.getElementById('readout');
  const eqEl   = document.getElementById('eqbar');
  const tagEl  = document.getElementById('tag');
  const hintEl = document.getElementById('hint');
  const errEl  = document.getElementById('errbox');
  const subEl  = document.getElementById('sub');
  const S = makeScene(canvas), st = S.st;

  function fail(e){ errEl.style.display = 'block'; errEl.textContent = String(e && e.stack || e); }
  window.addEventListener('error', ev => fail(ev.error || ev.message));

  VIEWS.forEach(([k, lab]) => {
    tabsEl.appendChild(h('button', { class: st.view === k ? 'active' : '', onclick: () => {
      st.view = k;
      [].forEach.call(tabsEl.children, (b, i) => b.className = VIEWS[i][0] === k ? 'active' : '');
      S.rebuild(); syncPanel(); refresh(); } }, lab));
  });

  const rows = {};
  function slider(key, lab, lo, hi, step, fmtf){
    const inp = h('input', { type: 'range', min: lo, max: hi, step: step, value: st[key] });
    const val = h('span', { class: 'val' });
    const row = h('div', { class: 'sliderrow' }, h('label', null, lab), inp, val);
    const sync = () => { inp.value = st[key]; val.textContent = fmtf(st[key]); };
    inp.addEventListener('input', () => { st[key] = parseFloat(inp.value);
      val.textContent = fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key] = { row, sync, inp }; sync(); return row;
  }
  function checkbox(key, lab){
    const inp = h('input', { type: 'checkbox' }); inp.checked = st[key];
    inp.addEventListener('change', () => { st[key] = inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label', null, inp, lab);
  }
  function chipRow(list, key, idf, namef){
    const wrapEl = h('div', { class: 'chips' });
    list.forEach(o => {
      wrapEl.appendChild(h('button', { class: 'chip' + (st[key] === idf(o) ? ' on' : ''),
        onclick: () => { st[key] = idf(o);
          [].forEach.call(wrapEl.children, (b, i) =>
            b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));
          S.rebuild(); syncPanel(); refresh(); } }, namef(o)));
    });
    wrapEl._sync = () => [].forEach.call(wrapEl.children, (b, i) =>
      b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));
    return wrapEl;
  }

  const groups = [];
  function group(title, ...kids){
    const g = h('div', { class: 'group' }, h('div', { class: 'gtitle' }, title), ...kids);
    groups.push(g); panel.appendChild(g); return g;
  }
  const gasChips = chipRow(GASLIST.map(g => ({ k: g, n: FLUID[g].name })), 'gas',
                           o => o.k, o => o.n);
  const siteChips = chipRow(SITES.map(s => ({ k: s, n: SOUNDING[s].site.split('/')[0] })), 'site',
                            o => o.k, o => o.n);
  group('the gas', gasChips);
  group('the expansion',
    slider('T1', 'start T', 120, 900, 1, v => sg(v, 4) + ' K'),
    /* up to 200 bar: at 1 bar a van der Waals gas free-expands and cools by a
       quarter of a kelvin, which is correct and invisible.  The default sits at
       20 bar so the effect the view exists to show is actually on the screen. */
    slider('P1bar', 'start P', 0.2, 200, 0.2, v => sg(v, 3) + ' bar'),
    slider('vratio', 'v₂/v₁', 1.2, 40, 0.1, v => sg(v, 3) + '×'),
    slider('dof', 'f, if not measured', 3, 9, 1, v => String(v)),
    checkbox('measuredGamma', ' take γ from NIST'),
    checkbox('showIso', ' isotherm'), checkbox('showAdi', ' adiabat'),
    checkbox('showWork', ' shade the work'));
  group('free expansion',
    slider('feRatio', 'v₂/v₁', 1.5, 60, 0.5, v => sg(v, 3) + '×'),
    checkbox('feReal', ' van der Waals, not ideal'),
    checkbox('showRev', ' show the reversible path'));
  group('the throttle',
    slider('thrT', 'T', 60, 900, 1, v => sg(v, 4) + ' K'),
    slider('thrP', 'P', 1, 400, 1, v => sg(v, 4) + ' bar'),
    checkbox('showMeas', ' measured inversion curve'),
    checkbox('showVdw', ' van der Waals'),
    checkbox('reduced', ' reduced coordinates, all gases'));
  group('the sounding', siteChips,
    slider('ztop', 'top of the plot', 1.5, 7, 0.1, v => sg(v, 3) + ' km'),
    slider('parcelDT', 'parcel excess', -3, 6, 0.1, v => sg(v, 2) + ' K'),
    checkbox('showEnv', ' the balloon'), checkbox('showMoist', ' moist adiabat'),
    checkbox('showTheta', ' θ panel'));
  group('γ',
    slider('gT', 'temperature', 80, 1000, 1, v => sg(v, 4) + ' K'),
    checkbox('showEquip', ' equipartition levels'),
    checkbox('showSound', ' the speed of sound'));
  group('the real adiabat',
    slider('rT', 'T at the top', 200, 690, 1, v => sg(v, 4) + ' K'),
    slider('rP', 'P at the top', 30, 400, 1, v => sg(v, 4) + ' bar'));
  const infoEl = h('div', { class: 'info' });
  panel.appendChild(infoEl);

  const VIS = {
    piston:   [0, 1],
    free:     [0, 2],
    throttle: [0, 3],
    parcel:   [4],
    gamma:    [5],
    real:     [0, 6],
  };
  function syncPanel(){
    const keep = VIS[st.view] || [];
    groups.forEach((g, i) => g.style.display = keep.indexOf(i) >= 0 ? '' : 'none');
    Object.keys(rows).forEach(k => rows[k].sync());
    /* A live control that does nothing is worse than no control: while gamma is
       being read off NIST, f is ignored entirely, so the slider is disabled and
       dimmed rather than left to be dragged with no effect. */
    if (rows.dof){
      rows.dof.inp.disabled = st.measuredGamma;
      rows.dof.row.style.opacity = st.measuredGamma ? '0.35' : '';
    }
    gasChips._sync(); siteChips._sync();
    infoEl.textContent = INFO[st.view] || '';
    subEl.textContent = VIEWS.filter(v => v[0] === st.view)[0][1];
  }

  /* Nothing in this file animates -- every view is a plot of a state, not a
     process -- so there is no frame loop and no dirty flag to get wrong.
     refresh() does the whole update synchronously, which also means an
     interaction that fails to repaint fails visibly rather than silently. */
  function refresh(){
    try {
      S.draw();
      roEl.innerHTML = S.readout();
      const [eq, sm] = S.eqbar();
      eqEl.innerHTML = '<div class="eq">' + eq + '</div><div class="sm">' + sm + '</div>';
      tagEl.textContent = S.tag();
      hintEl.textContent = HINT[st.view] || '← → change view';
    } catch (e){ fail(e); }
  }
  function resize(){
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    S.cam.W = Math.max(420, Math.round(r.width));
    S.cam.H = Math.max(320, Math.round(r.height));
    canvas.width = Math.round(S.cam.W * dpr); canvas.height = Math.round(S.cam.H * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', () => { resize(); refresh(); });
  canvas.addEventListener('wheel', (e) => { /* deliberately inert -- see makeScene */ });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R'){ S.resetView(); refresh(); }
    const i = VIEWS.map(v => v[0]).indexOf(st.view);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      const j = (i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length;
      st.view = VIEWS[j][0];
      [].forEach.call(tabsEl.children, (b, k) => b.className = k === j ? 'active' : '');
      S.rebuild(); syncPanel(); refresh();
    }
  });

  panel.appendChild(h('button', { class: 'chip', style: 'margin-top:10px',
    onclick: () => { Object.assign(st, DEFAULTS); S.rebuild(); syncPanel(); refresh(); } },
    'reset all'));

  resize(); syncPanel(); refresh();
  window.__S = S;
}

0,200.5,168.52122,0.28111689,18.273774,31.606733,561.19412,-0.028735247],[620,25.5,186.15484,2.0436952,18.17159,30.43985,510.62698,-0.0073608302],[620,100.5,174.52531,0.53595588,18.20066,30.993805,531.61523,-0.017536947],[620,250.5,166.55444,0.23022516,18.323238,31.864649,576.45347,-0.033514846],[620,380.5,162.81845,0.16085454,18.485878,32.408873,616.95611,-0.043801976]],
