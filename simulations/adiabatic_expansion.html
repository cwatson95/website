<title>Adiabatic expansion — what happens to a gas when no heat is allowed in</title>
<!--
  ===================================================================
  ADIABATIC EXPANSION
  the reversible adiabat, the free expansion that is adiabatic but not
  isentropic, the throttle that holds enthalpy instead, the kilometre
  of atmosphere that does it for real, and where P v^gamma stops
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, diffraction.html,
  pulsar.html, standard_candle.html, cmb.html and differential_scattering.html:
  one flat file, no build step, no network, works opened straight off the disk
  as file://.

  ------------------------------------------------------------------
  WHAT THIS COMPUTES
  ------------------------------------------------------------------
    the piston      the same expansion held at temperature and insulated:
                    P v^gamma, the work each does, and why the adiabat is
                    steeper by exactly gamma.
    free            Joule's experiment.  Q = 0 and W = 0, so u is unchanged
    expansion       and an ideal gas does not cool at all -- while the
                    entropy rises by R ln(v2/v1).  Adiabatic is not
                    isentropic, and this view exists to say so.
    the throttle    Joule-Thomson: enthalpy is what is conserved, the sign
                    of mu decides whether the gas cools, and the inversion
                    curve is where it changes.  Measured against van der
                    Waals, and in reduced coordinates against all five.
    the rising      a real radiosonde: 3.8 km of Arizona afternoon at the
    parcel          dry adiabatic lapse rate, and a Californian marine
                    inversion for the opposite case.
    where gamma     equipartition, and the five monatomic gases that give
    comes from      f = 3 over a 33-fold range of molar mass; Newton's
                    isothermal speed of sound against Laplace's.
    the real        NIST's own isentrope against T P^((1-gamma)/gamma), and
    adiabat         the two exponents that are the same number only in the
                    dilute limit.

  ------------------------------------------------------------------
  WHAT IS MEASURED
  ------------------------------------------------------------------
  * NIST Chemistry WebBook, SRD 69 -- the reference equations of state, for
    twelve fluids.  Retrieved 2026-08-02 with curl.  Cv, Cp, sound speed,
    enthalpy, entropy and the Joule-Thomson coefficient, on isobars and on a
    (T,P) grid.  NIST refuses an out-of-range request with a hard "Range
    Error" instead of extrapolating, so every row embedded here is inside the
    equation of state it came from.
      - critical constants, from the same pages;
      - MOLAR MASSES are not typed from a table: each is NIST's own mass
        density divided by its own molar density on one isotherm, which
        agree to 1e-9;
      - the Joule-Thomson INVERSION CURVES are read off the grid as the
        locus mu = 0, not quoted.
  * IAPWS-95 saturation properties of water, for the moist adiabat: e_s(T)
    and the latent heat as the measured enthalpy difference h_vap - h_liq.
  * University of Wyoming upper-air archive: three radiosonde profiles,
    Tucson and San Diego 25 Jun 2019 00Z and Denver 25 Jul 2019 00Z.
    Potential temperature is recomputed here from p and T rather than taken
    from the archive's own column.

  ------------------------------------------------------------------
  THE RESULTS THIS FILE EXISTS FOR
  ------------------------------------------------------------------
  * A nitrogen-like gas at 20 bar expanded tenfold cools 4.8 K in a free
    expansion and 182 K on the reversible adiabat.  Same Q = 0, same volume
    change, 38 times the temperature drop -- and the first generates 19.1
    J/mol/K of entropy while the second generates none.
  * The Tucson sounding of 25 June 2019 has a 3.8 km mixed layer whose fitted
    lapse rate is 9.55 K/km against g/cp = 9.75 K/km built from NIST heat
    capacities and air's composition, with 0.37 K of scatter.  The San Diego
    profile of the same morning has a +62 K/km subsidence inversion instead.
  * The measured zero-pressure inversion temperature runs from 4.45 Tc for
    carbon dioxide to 8.76 Tc for helium.  Van der Waals predicts 6.75 Tc for
    every gas there is, which is inside that spread and wrong at both ends --
    a specific, quantified failure of corresponding states rather than a
    vague one.
  * Newton's isothermal speed of sound is low by 15.5%, exactly sqrt(gamma).
  * Five monatomic gases spanning a 33-fold range of molar mass all give
    f = 2/(gamma-1) = 3.0, while their sound speeds span a factor of six.

  ------------------------------------------------------------------
  WHAT IS EXACT
  ------------------------------------------------------------------
  * P v^gamma and T v^(gamma-1), obtained by integrating dU = -P dV rather
    than quoted; asserted against a scipy solve_ivp run.
  * The van der Waals critical point solved numerically from
    dP/dv = d2P/dv2 = 0, giving v_c = 3b and Z_c = 3/8 to fourteen digits.
  * The Joule and Joule-Thomson coefficients, each checked against a
    numerical derivative taken along a constant-u and a constant-h path.
  * The inversion locus, parametrically in v AND in the reduced closed form
    P_r = 24 sqrt(3 T_r) - 12 T_r - 27, agreeing over 300 points; its roots
    at T_r = 3/4 and 27/4 and its peak at (3, 9).
  * dtheta/dz = (theta/T)(dT/dz + g/cp), so a dry adiabat is exactly a
    constant-theta layer.
  * The Clausius-Clapeyron branch of e_s below the triple point satisfies
    d ln e_s/dT = L/(RT^2) by construction and is asserted to.

  ------------------------------------------------------------------
  WHAT IS NOT MODELLED, and is said so on the canvas
  ------------------------------------------------------------------
  * The piston view treats the gas as ideal.  The real one is three tabs
    along, and the file does not pretend the two are the same.
  * The free-expansion view uses van der Waals with a constant cv.  That is
    a model, its a and b come from the measured critical point, and its
    known failure (Z_c = 3/8 against a measured 0.27-0.30) is asserted in
    the test suite rather than hidden.
  * NIST refuses an out-of-range request, so nothing embedded here is outside
    the range it will serve -- but that range is WIDER than the band over which
    each source paper quotes an uncertainty, and one headline number is outside
    it: carbon dioxide's inversion temperature of 1354 K sits above the 1100 K
    to which the Span-Wagner correlations are published.  The number is used
    and labelled as an extrapolation of the source, on the canvas, in both
    views that show it.
  * Methane has no measured inversion curve here at all: NIST's equation of
    state for it stops at 625 K, below its inversion temperature, and mu is
    still positive at the hottest state NIST will return.  Nothing is
    extrapolated and no number is invented; the view says so.
  * The moist adiabat is a pseudo-adiabat -- condensate is assumed to fall
    out, ice is not treated, and the parcel does not mix with its
    surroundings.  Entrainment is the main reason a real mixed layer sits
    slightly below g/cp, and that gap is measured rather than explained away.
  * No radiation, no turbulence closure, no cloud microphysics.

  ------------------------------------------------------------------
  VERIFICATION
  ------------------------------------------------------------------
  selfTest() runs when there is no document (osascript -l JavaScript).  Every
  closed form is asserted against an independent numerical route; every
  reference value labelled (scipy) came from a Python run whose output was
  read in full, and every one labelled (NIST) is a row copied from the raw
  retrieved table.

  One bug found that way is worth naming here, because the fix is visible in
  the code: entropy goes as -R ln P, and the first cell of the pressure grid
  spans 0.5 to 20.5 bar.  Interpolating s linearly across it is wrong by
  12 J/mol/K, and solving for an isentrope through that interpolant put
  nitrogen expanding from 620 K / 300 bar at 128 K where the table itself
  says 196 K.  A 68 K error that reads exactly like a real-gas effect, in the
  one view whose subject IS real-gas effects.  s is now interpolated as
  s + R ln P and v as Pv, and the test suite asserts both that the result
  reproduces the raw rows and that the naive version would not.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,

/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis — a
     magnitude scale, where brighter is up — silently gets one tick label and
     no grid.  Sort the range before asking for ticks; the placement below
     already handles either direction.  (Found by looking at the picture: the
     audit cannot see a label that was never drawn.) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

const KB    = 1.380649e-23;     /* J/K,       exact */
const G0    = 9.80665;          /* m/s^2,     standard gravity, defined */
const ATM   = 101325;           /* Pa,        standard atmosphere, defined */
const BAR   = 1e5;              /* Pa */
const T0C   = 273.15;           /* K */

/* --------------------------------------------------------------------------
 *  small numerics
 * ------------------------------------------------------------------------ */
function bisect(f, lo, hi, tol, maxit){
  tol = tol || 1e-13; maxit = maxit || 200;
  let flo = f(lo), fhi = f(hi);
  if (!isFinite(flo) || !isFinite(fhi)) return NaN;
  if (flo === 0) return lo;
  if (fhi === 0) return hi;
  if (flo * fhi > 0) return NaN;              /* NOT a silent endpoint: NaN */
  for (let i = 0; i < maxit; i++){
    const m = 0.5 * (lo + hi), fm = f(m);
    if (fm === 0 || (hi - lo) < tol * Math.max(1, Math.abs(m))) return m;
    if (flo * fm < 0){ hi = m; fhi = fm; } else { lo = m; flo = fm; }
  }
  return 0.5 * (lo + hi);
}

/* 10-point Gauss-Legendre on [-1,1], nodes and weights generated (not typed)
   by Newton iteration on the Legendre polynomial -- see selfTest, which
   re-derives them and checks the rule integrates x^k exactly to k = 19. */
const GLX = [-0.9739065285171717, -0.8650633666889845, -0.6794095682990244,
             -0.4333953941292472, -0.1488743389816312,  0.1488743389816312,
              0.4333953941292472,  0.6794095682990244,  0.8650633666889845,
              0.9739065285171717];
const GLW = [ 0.0666713443086881,  0.1494513491505806,  0.2190863625159820,
              0.2692667193099963,  0.2955242247147529,  0.2955242247147529,
              0.2692667193099963,  0.2190863625159820,  0.1494513491505806,
              0.0666713443086881];
function gl(f, a, b, nseg){
  nseg = nseg || 8;
  const h = (b - a) / nseg;
  let s = 0;
  for (let k = 0; k < nseg; k++){
    const lo = a + k * h, c = lo + 0.5 * h, r = 0.5 * h;
    for (let i = 0; i < 10; i++) s += GLW[i] * f(c + r * GLX[i]);
    }
  return s * 0.5 * h;
}

/* --------------------------------------------------------------------------
 *  1.  the ideal gas, reversibly and adiabatically
 * ------------------------------------------------------------------------ */
/* Everything here follows from dU = -P dV with U = n cv T and P = nRT/V; the
   power laws are consequences, and selfTest integrates the ODE to confirm it
   rather than trusting the algebra. */
function gammaFromDof(f){ return 1 + 2 / f; }
function cvFromGamma(g){ return R_GAS / (g - 1); }
function cpFromGamma(g){ return g * R_GAS / (g - 1); }

function adiabatT(T1, v1, v2, g){ return T1 * Math.pow(v1 / v2, g - 1); }
function adiabatP(P1, v1, v2, g){ return P1 * Math.pow(v1 / v2, g); }
/* T P^((1-g)/g) is constant -- the form used whenever pressure is the variable
   that is actually known, which in the atmosphere it always is. */
function adiabatTfromP(T1, P1, P2, g){ return T1 * Math.pow(P2 / P1, (g - 1) / g); }

function workAdiabat(P1, v1, v2, g){
  const P2 = adiabatP(P1, v1, v2, g);
  return (P1 * v1 - P2 * v2) / (g - 1);
}
function workIsotherm(P1, v1, v2){ return P1 * v1 * Math.log(v2 / v1); }

/* --------------------------------------------------------------------------
 *  2.  van der Waals
 * ------------------------------------------------------------------------ */
/* a and b are NOT quoted from a table: they come from the measured critical
   point, through the exact relations v_c = 3b, T_c = 8a/27Rb, P_c = a/27b^2,
   inverted.  Z_c = 3/8 for every gas is then a PREDICTION of the model, and
   comparing it against each fluid's measured Z_c is the honest way to see how
   good the model is (it is not very good, and the file says so). */
function vdwFromCritical(Tc, Pc){
  return { a: 27 * R_GAS * R_GAS * Tc * Tc / (64 * Pc),
           b: R_GAS * Tc / (8 * Pc) };
}
function vdwP(v, T, a, b){ return R_GAS * T / (v - b) - a / (v * v); }

/* The gas root of the cubic P v^3 - (Pb + RT) v^2 + a v - a b = 0.  Newton from
   the ideal estimate lands on the vapour branch; the bracket-and-bisect
   fallback is what runs when Newton wanders (near the critical point it does). */
function vdwV(P, T, a, b){
  let v = R_GAS * T / P + b;
  for (let i = 0; i < 80; i++){
    const f  = vdwP(v, T, a, b) - P;
    const df = -R_GAS * T / ((v - b) * (v - b)) + 2 * a / (v * v * v);
    if (!isFinite(df) || df === 0) break;
    const step = f / df;
    let vn = v - step;
    if (!(vn > b * 1.0000001)) vn = b + (v - b) * 0.5;
    if (Math.abs(vn - v) < 1e-16 * v){ v = vn; break; }
    v = vn;
  }
  if (isFinite(v) && v > b && Math.abs(vdwP(v, T, a, b) / P - 1) < 1e-9) return v;
  const g = (vv) => vdwP(vv, T, a, b) - P;
  let hi = Math.max(10 * R_GAS * T / P, 1);
  for (let i = 0; i < 200; i++){ if (g(hi) < 0) break; hi *= 2; }
  return bisect(g, b * 1.000001 + 1e-12, hi, 1e-15);
}

/* Departure functions for constant-cv van der Waals.  u and s are the standard
   results of integrating (du/dv)_T = T(dP/dT)_v - P = a/v^2 and, via Maxwell,
   (ds/dv)_T = (dP/dT)_v = R/(v-b).  selfTest differentiates both numerically
   and checks they reproduce those two right-hand sides. */
function vdwU(v, T, a, b, cv){ return cv * T - a / v; }
function vdwS(v, T, a, b, cv){ return cv * Math.log(T) + R_GAS * Math.log(v - b); }
function vdwH(v, T, a, b, cv){ return cv * T + R_GAS * T * v / (v - b) - 2 * a / v; }

/* cp - cv = -T (dP/dT)_v^2 / (dP/dv)_T, which for van der Waals collapses to
   R / (1 - 2a(v-b)^2 / (R T v^3)) -- equal to R only in the dilute limit. */
function vdwCp(v, T, a, b, cv){
  return cv + R_GAS / (1 - 2 * a * (v - b) * (v - b) / (R_GAS * T * v * v * v));
}

/* (dT/dv)_u -- the Joule coefficient, which governs FREE expansion.
   = -(1/cv)[T(dP/dT)_v - P] = -a/(cv v^2).  Zero for an ideal gas. */
function jouleCoef(v, T, a, b, cv){ return -a / (cv * v * v); }

/* (dT/dP)_h -- the Joule-Thomson coefficient, which governs THROTTLING.
   = (1/cp)[T(dv/dT)_P - v]; the bracket reduces to
        [2a(v-b)^2/v^2 - R T b] / [R T - 2a(v-b)^2/v^3].
   Positive means the gas cools as it is throttled. */
function jtCoef(v, T, a, b, cv){
  const w = (v - b) * (v - b);
  return (2 * a * w / (v * v) - R_GAS * T * b) /
         (vdwCp(v, T, a, b, cv) * (R_GAS * T - 2 * a * w / (v * v * v)));
}
/* The dilute limit of cp*mu: 2a/RT - b.  Sets the zero-pressure inversion
   temperature 2a/(Rb), which for van der Waals is exactly 6.75 T_c. */
function jtDilute(T, a, b){ return 2 * a / (R_GAS * T) - b; }

/* The inversion locus, parametrically in v: mu = 0 when 2a(v-b)^2 = R T b v^2. */
function vdwInvT(v, a, b){ return 2 * a * (v - b) * (v - b) / (R_GAS * b * v * v); }
/* and in reduced coordinates it collapses to one curve for every gas:
      P_r = 24 sqrt(3 T_r) - 12 T_r - 27,
   zero at T_r = 3/4 and 27/4, peaking at (T_r, P_r) = (3, 9). */
function vdwInvPr(Tr){ return 24 * Math.sqrt(3 * Tr) - 12 * Tr - 27; }

/* --------------------------------------------------------------------------
 *  3.  free expansion (Joule) -- adiabatic, and emphatically not isentropic
 * ------------------------------------------------------------------------ */
/* Q = 0 because the vessel is insulated and W = 0 because the gas pushes on
   nothing, so u is unchanged.  For an ideal gas u depends only on T, so T does
   not change at all; for van der Waals the -a/v term must be paid for out of
   the thermal energy and the gas cools. */
function freeExpandT(v1, T1, v2, a, cv){ return T1 + (a / cv) * (1 / v2 - 1 / v1); }
function freeExpandS(v1, T1, v2, T2, a, b, cv){
  return vdwS(v2, T2, a, b, cv) - vdwS(v1, T1, a, b, cv);
}
/* the same expansion done reversibly, for contrast: s is held fixed instead */
function revExpandT(v1, T1, v2, a, b, cv){
  const s0 = vdwS(v1, T1, a, b, cv);
  return bisect((T) => vdwS(v2, T, a, b, cv) - s0, 1e-3, 20 * T1, 1e-14);
}

/* --------------------------------------------------------------------------
 *  4.  the atmosphere
 * ------------------------------------------------------------------------ */
/* Dry air's composition, mole fractions.  N2/O2/Ar are the classical values;
   CO2 is a present-day figure and is the one that moves.  The molar mass and
   heat capacity of air below are BUILT from these and from NIST's per-gas
   numbers, so the lapse rate is not a constant anyone typed. */
const AIRMIX = [['n2', 0.780840], ['o2', 0.209460], ['ar', 0.009340],
                ['co2', 0.000417], ['ne', 1.818e-5], ['he', 5.24e-6],
                ['ch4', 1.9e-6],  ['kr', 1.14e-6]];

function airMolarMass(){
  let M = 0, x = 0;
  for (const [g, f] of AIRMIX){ if (FLUID[g] && FLUID[g].M){ M += f * FLUID[g].M; x += f; } }
  return M / x;                                   /* renormalised: the trace gases
                                                     left out must not dilute it */
}
/* Mole-weighted cp of dry air from the NIST 1 bar isobars, at temperature T. */
function airCp(T){
  let c = 0, x = 0;
  for (const [g, f] of AIRMIX){
    const b = ISOBAR[g];
    if (!b) continue;
    c += f * interp1(b.T, b.cp, T);
    x += f;
  }
  return c / x;                                   /* J/mol/K */
}
function interp1(xs, ys, x){
  const n = xs.length;
  if (!(n > 1)) return NaN;
  if (x <= xs[0]) return ys[0];
  if (x >= xs[n - 1]) return ys[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (xs[m] <= x) lo = m; else hi = m; }
  const t = (x - xs[lo]) / (xs[hi] - xs[lo]);
  return ys[lo] + t * (ys[hi] - ys[lo]);
}

/* Specific gas constant and specific heat of dry air, J/kg/K. */
function airRspec(){ return R_GAS / airMolarMass(); }
function airCpSpec(T){ return airCp(T) / airMolarMass(); }

/* One reference cp fixes kappa, and kappa is what makes potential temperature
   a conserved quantity.  If theta were built from a temperature-DEPENDENT
   kappa it would not be conserved along the very adiabat it exists to label,
   and the identity below would stop being exact -- so the reference value is
   used for theta, for the lapse rate and for the parcel lift alike, and the
   variation of cp is reported separately instead of being hidden inside them. */
const T_CPREF   = 273.15;
const CPD_REF   = airCpSpec(T_CPREF);            /* J/kg/K, built from NIST */
const RD_AIR    = airRspec();                    /* J/kg/K */
const KAPPA_AIR = RD_AIR / CPD_REF;

/* The dry adiabatic lapse rate.  This is the whole subject of the view: a
   parcel that rises expands because the pressure around it falls, does work on
   its surroundings, exchanges no heat, and therefore cools. */
function lapseDry(){ return G0 / CPD_REF; }                     /* K/m */
/* The same thing evaluated with cp at the local temperature -- cp of air rises
   about 1.4% between 200 K and 320 K, so this is NOT quite a constant, and the
   file prints the spread rather than implying one figure covers everything. */
function lapseDryAt(T){ return G0 / airCpSpec(T); }

/* Potential temperature: the temperature a parcel would have if brought
   adiabatically to p0.  Constant along a dry adiabat by construction. */
function theta(T, p, p0){ return T * Math.pow(p0 / p, KAPPA_AIR); }
/* The identity the whole stability discussion rests on:
      dtheta/dz = (theta/T) (dT/dz + g/cp).
   So dtheta/dz = 0 is EXACTLY the dry adiabatic lapse rate, and the sign of
   dtheta/dz is the sign of the parcel's restoring force. */

/* Saturation vapour pressure over liquid water.  Above the triple point it is
   NIST's own measured curve; below it, Clausius-Clapeyron
      d ln e_s / dT = L_v / (R T^2)
   is integrated DOWNWARD from the lowest measured row, using the measured
   L_v extrapolated linearly in T.  That is an extrapolation and the file says
   so on the canvas -- but it is an extrapolation of a derivative, not of a
   curve fit, and it is asserted against the measured rows above 273 K. */
function esatBar(T){
  const S = SATH2O;
  if (T >= S.T[0]) return interp1(S.T, S.es, T) ;
  const T0 = S.T[0], e0 = S.es[0];
  const LvOf = (t) => {
    const dL = (S.Lv[1] - S.Lv[0]) / (S.T[1] - S.T[0]);
    return (S.Lv[0] + dL * (t - S.T[0])) * 1000;    /* J/mol */
  };
  const lnratio = -gl((t) => LvOf(t) / (R_GAS * t * t), T, T0, 6);
  return e0 * Math.exp(lnratio);
}
function LvAt(T){
  const S = SATH2O;
  if (T >= S.T[0]) return interp1(S.T, S.Lv, T) * 1000;
  const dL = (S.Lv[1] - S.Lv[0]) / (S.T[1] - S.T[0]);
  return (S.Lv[0] + dL * (T - S.T[0])) * 1000;
}
const M_H2O = 0.01801528;                  /* kg/mol, IUPAC */
function epsWater(){ return M_H2O / airMolarMass(); }
/* mixing ratio, kg water per kg dry air */
function mixRatio(e_bar, p_bar){ return epsWater() * e_bar / Math.max(p_bar - e_bar, 1e-9); }

/* The saturated (moist) adiabatic lapse rate.  Condensation releases latent
   heat into the parcel, so it cools more slowly than a dry one -- typically
   about half as fast in warm air, and approaching the dry rate when it is too
   cold to hold any water. */
/* r_s is a mass mixing ratio and LvAt returns joules per MOLE, so the latent
   heat has to be divided by the molar mass of water before it multiplies r_s.
   Getting that wrong scales the whole moist correction by 18, which is large
   enough to look like a different physical claim rather than a unit slip. */
function lapseMoist(T, p_bar){
  const Lv = LvAt(T) / M_H2O;                       /* J per kg of water */
  const rs = mixRatio(esatBar(T), p_bar);
  const Rv = R_GAS / M_H2O;
  return G0 * (1 + Lv * rs / (RD_AIR * T)) /
         (CPD_REF + Lv * Lv * rs / (Rv * T * T));
}

/* Lifting condensation level, found the way it is defined rather than from a
   fitted formula: raise the parcel dry-adiabatically at fixed mixing ratio and
   report the level where its temperature first reaches saturation. */
function lclLevel(T0K, Td0K, p0_bar, zsfc){
  const r0 = mixRatio(esatBar(Td0K), p0_bar);
  const f = (z) => {
    const st = dryLift(T0K, p0_bar, zsfc, z);
    const es = esatBar(st.T);
    return mixRatio(es, st.p) - r0;                 /* > 0 unsaturated */
  };
  if (!(f(0) > 0)) return { z: zsfc, p: p0_bar, T: T0K, saturated: true };
  let hi = 200;
  for (let i = 0; i < 40 && f(hi) > 0; i++) hi *= 1.6;
  if (f(hi) > 0) return { z: NaN, p: NaN, T: NaN, saturated: false };
  const dz = bisect(f, 0, hi, 1e-10);
  const st = dryLift(T0K, p0_bar, zsfc, dz);
  return { z: zsfc + dz, p: st.p, T: st.T, saturated: false };
}

/* Lift a dry parcel by dz: integrate dT/dz = -g/cp together with the
   hydrostatic dp/dz = -p g /(R_d T).  cp is held at the reference value so
   that the lift, theta and the lapse rate are all the same adiabat -- pass
   varcp = true to use cp(T) instead and see how far the two part company. */
function dryLift(T0K, p0_bar, z0, dz, nstep, varcp){
  nstep = nstep || 48;
  let T = T0K, p = p0_bar, h = dz / nstep;
  const dT = (T) => -G0 / (varcp ? airCpSpec(T) : CPD_REF);
  const dp = (T, p) => -p * G0 / (RD_AIR * T);
  for (let i = 0; i < nstep; i++){
    const k1T = dT(T),        k1p = dp(T, p);
    const k2T = dT(T + 0.5 * h * k1T), k2p = dp(T + 0.5 * h * k1T, p + 0.5 * h * k1p);
    const k3T = dT(T + 0.5 * h * k2T), k3p = dp(T + 0.5 * h * k2T, p + 0.5 * h * k2p);
    const k4T = dT(T + h * k3T),       k4p = dp(T + h * k3T, p + h * k3p);
    T += h * (k1T + 2 * k2T + 2 * k3T + k4T) / 6;
    p += h * (k1p + 2 * k2p + 2 * k3p + k4p) / 6;
  }
  return { T: T, p: p };
}

/* --------------------------------------------------------------------------
 *  5.  the speed of sound -- Newton's mistake, and Laplace's correction
 * ------------------------------------------------------------------------ */
/* Newton assumed the compressions in a sound wave were isothermal and got
   sqrt(P/rho) = sqrt(RT/M); the waves are far too fast for heat to move, so
   they are adiabatic, and Laplace's sqrt(gamma) puts it right.  The gap is not
   subtle: sqrt(1.4) = 1.1832, so Newton is 15.5% low. */
function soundLaplace(g, T, M){ return Math.sqrt(g * R_GAS * T / M); }
function soundNewton(T, M){ return Math.sqrt(R_GAS * T / M); }
/* For a real gas the relevant exponent is the ISENTROPIC one,
   kappa = -(v/P)(dP/dv)_s, and c^2 = kappa P v / M.  kappa equals cp/cv only
   for an ideal gas; measuring c and inverting is how the difference shows. */
function kappaFromSound(w, P_bar, v_lmol, M){
  return M * w * w / (P_bar * 1e5 * v_lmol * 1e-3);
}

/* --------------------------------------------------------------------------
 *  6.  reading the NIST (T,P) grid
 * ------------------------------------------------------------------------ */
/* Bilinear in (T, ln P), refusing rather than guessing wherever the grid has a
   null -- those are states that are not gas, and interpolating across the
   boundary would invent a fluid.
 *
 *  The pressure axis is logarithmic and two columns carry a further correction,
 *  because interpolating them raw is not a small error, it is a wrong answer:
 *
 *    s  goes as -R ln P.  The first grid cell spans 0.5 to 20.5 bar, over which
 *       an ideal gas loses R ln 41 = 30.9 J/mol/K; a straight line across that
 *       cell misses by 12 J/mol/K in the middle of it.  Solving for an isentrope
 *       through the raw interpolant put nitrogen expanding from 620 K / 300 bar
 *       at 128 K where the table itself says 196 K -- a 68 K error that reads
 *       exactly like a real-gas effect and would have been reported as one.
 *    v  goes as 1/P for the same reason.
 *
 *  So s is interpolated as s + R ln P and v as P*v, each of which is flat in P
 *  for an ideal gas, and the trend is put back afterwards.  h, cp, cv, w and mu
 *  have no such leading dependence and are interpolated directly.
 *
 *  The pressure axis is logarithmic as well, but that part is a refinement
 *  rather than the fix, and the difference was MEASURED rather than assumed:
 *  with the residual corrections in place, switching the axis back to linear
 *  moves the isentrope by 0.12 K and the worst off-node error by a factor of
 *  1.5 (and improves it for the sound speed).  It is kept because it costs two
 *  logarithms, not because it is carrying the result -- a mutation sweep
 *  flagged it as a near-equivalent mutant and that is what it is. */
function gridAt(G, key, T, P_bar){
  const Ts = G.T, Ps = G.P, A = G[key];
  if (T < Ts[0] || T > Ts[Ts.length - 1]) return NaN;
  if (P_bar < Ps[0] || P_bar > Ps[Ps.length - 1]) return NaN;
  let i = 0; while (i < Ts.length - 2 && Ts[i + 1] < T) i++;
  let j = 0; while (j < Ps.length - 2 && Ps[j + 1] < P_bar) j++;
  const a = A[i][j], b = A[i][j + 1], c = A[i + 1][j], d = A[i + 1][j + 1];
  if (a === null || b === null || c === null || d === null) return NaN;
  const lp0 = Math.log(Ps[j]), lp1 = Math.log(Ps[j + 1]), lp = Math.log(P_bar);
  const t = (T - Ts[i]) / (Ts[i + 1] - Ts[i]);
  const u = (lp - lp0) / (lp1 - lp0);
  let A00 = a, A01 = b, A10 = c, A11 = d;
  if (key === 's'){
    A00 += R_GAS * lp0; A01 += R_GAS * lp1; A10 += R_GAS * lp0; A11 += R_GAS * lp1;
  } else if (key === 'v'){
    A00 *= Ps[j]; A01 *= Ps[j + 1]; A10 *= Ps[j]; A11 *= Ps[j + 1];
  }
  let val = (1 - t) * ((1 - u) * A00 + u * A01) + t * ((1 - u) * A10 + u * A11);
  if (key === 's') val -= R_GAS * lp;
  else if (key === 'v') val /= P_bar;
  return val;
}
/* A curve of constant `key` (s for an isentrope, h for an isenthalp) through
   the grid, as T(P).  Solved by bisection in T at each pressure, dropping the
   pressures where the level does not exist in the gas region rather than
   clamping to the edge. */
function gridLevelCurve(G, key, level, Plo, Phi, npt){
  npt = npt || 60;
  const out = [];
  const Ts = G.T, Tmin = Ts[0], Tmax = Ts[Ts.length - 1];
  for (let k = 0; k < npt; k++){
    const P = Plo + (Phi - Plo) * k / (npt - 1);
    const f = (T) => gridAt(G, key, T, P) - level;
    let lastT = NaN, lastF = NaN, got = NaN;
    for (let m = 0; m <= 80; m++){
      const T = Tmin + (Tmax - Tmin) * m / 80, fv = f(T);
      if (isFinite(fv) && isFinite(lastF) && fv * lastF < 0){
        got = bisect(f, lastT, T, 1e-10); break;
      }
      lastT = T; lastF = fv;
    }
    if (isFinite(got)) out.push([P, got]);
  }
  return out;
}

/* ============================================================================
 *  state and model
 * ========================================================================== */
const VIEWS = [['piston',   'the piston'],
               ['free',     'free expansion'],
               ['throttle', 'the throttle'],
               ['parcel',   'the rising parcel'],
               ['gamma',    'where γ comes from'],
               ['real',     'the real adiabat']];

const GASLIST  = ['he', 'ne', 'ar', 'kr', 'xe', 'h2', 'n2', 'o2', 'co2', 'ch4'];
const INVGASES = ['n2', 'ar', 'co2', 'h2', 'he'];
const GRIDGAS  = ['n2', 'co2'];
const SITES    = ['tucson', 'sandiego', 'denver'];

const DEFAULTS = {
  view: 'piston',
  gas: 'n2',
  /* --- the piston --- */
  T1: 300,                  /* K   */
  P1bar: 20.0,              /* bar -- see the note on the slider range */
  vratio: 5.0,              /* v2/v1 */
  dof: 5,                   /* degrees of freedom, if gamma is not measured */
  measuredGamma: true,
  showIso: true, showAdi: true, showWork: true,
  /* --- free expansion --- */
  feRatio: 10.0,
  feReal: true,             /* van der Waals rather than ideal */
  showRev: true,
  /* --- the throttle --- */
  thrT: 300, thrP: 200,     /* K, bar */
  showVdw: true, showMeas: true, reduced: false,
  /* --- the rising parcel --- */
  site: 'tucson',
  parcelDT: 0.0,            /* K of surface excess given to the parcel */
  showMoist: true, showTheta: true, showEnv: true,
  ztop: 6.0,                /* km above the surface */
  /* --- gamma --- */
  gT: 300,
  showEquip: true, showSound: true,
  /* --- the real adiabat --- */
  rP: 300,                  /* bar, the HIGH-pressure end the gas expands from */
  rT: 620,                  /* K at that end */
};

/* ---------------------------------------------------------------------------
 *  gamma of the working gas, either measured or from a count of modes
 * ------------------------------------------------------------------------- */
function gammaOf(st, T){
  if (!st.measuredGamma) return gammaFromDof(st.dof);
  const b = ISOBAR[st.gas];
  if (!b) return gammaFromDof(st.dof);
  return interp1(b.T, b.cp, T) / interp1(b.T, b.cv, T);
}
/* Equipartition's own count for a molecule: 3 translations, plus 2 rotations
   if it is linear and 3 if it is not.  Vibrations are deliberately NOT added:
   they are frozen out at room temperature, which is the whole reason the
   measured value sits at the rigid-rotor figure and not above it. */
function dofRigid(f){ return 3 + (f.atoms === 1 ? 0 : (f.linear ? 2 : 3)); }

/* ---------------------------------------------------------------------------
 *  buildModel
 * ------------------------------------------------------------------------- */
function buildModel(st){
  const M = { st: st, view: st.view, warn: [] };
  const F = FLUID[st.gas];
  M.F = F;
  M.gasName = F ? F.name : st.gas;

  /* --- the ideal gas the piston view runs on ------------------------------ */
  const g = gammaOf(st, st.T1);
  M.gamma = g;
  M.cv = cvFromGamma(g); M.cp = cpFromGamma(g);
  M.dofEff = 2 / (g - 1);
  const P1 = st.P1bar * BAR, v1 = R_GAS * st.T1 / P1, v2 = v1 * st.vratio;
  M.P1 = P1; M.v1 = v1; M.v2 = v2;
  M.T2ad  = adiabatT(st.T1, v1, v2, g);
  M.P2ad  = adiabatP(P1, v1, v2, g);
  M.P2iso = P1 * v1 / v2;
  M.Wad   = workAdiabat(P1, v1, v2, g);
  M.Wiso  = workIsotherm(P1, v1, v2);
  M.dUad  = -M.Wad;                       /* Q = 0, so the work is paid out of U */
  M.Qiso  = M.Wiso;                       /* dU = 0 on an isotherm */
  M.dSiso = R_GAS * Math.log(st.vratio);
  /* the curves, sampled evenly in log v so neither is crowded */
  M.curveAd = []; M.curveIso = [];
  for (let i = 0; i <= 160; i++){
    const v = v1 * Math.exp(Math.log(st.vratio) * i / 160);
    M.curveAd.push([v, adiabatP(P1, v1, v, g)]);
    M.curveIso.push([v, P1 * v1 / v]);
  }
  /* the ratio of logarithmic slopes is gamma, everywhere, exactly */
  M.slopeRatio = (function(){
    const v = v1 * Math.sqrt(st.vratio);
    const dAd  = -g * adiabatP(P1, v1, v, g) / v;
    const dIso = -(P1 * v1 / v) / v;
    return (dAd / adiabatP(P1, v1, v, g)) / (dIso / (P1 * v1 / v));
  })();

  /* --- van der Waals for this gas, from its measured critical point ------- */
  if (F){
    const vd = vdwFromCritical(F.Tc, F.Pc * BAR);
    M.a = vd.a; M.b = vd.b;
    M.TinvVdw = 2 * vd.a / (R_GAS * vd.b);        /* = 6.75 Tc, exactly */
    M.ZcMeas  = F.Pc * BAR / (F.Dc * 1000 * R_GAS * F.Tc);
    M.ZcVdw   = 3 / 8;
  }

  /* --- free expansion ---------------------------------------------------- */
  if (M.a){
    const cvf = M.cv;
    const fv1 = v1, fv2 = v1 * st.feRatio;
    M.fe = { v1: fv1, v2: fv2, T1: st.T1 };
    M.fe.T2ideal = st.T1;                                   /* exactly */
    M.fe.T2real  = freeExpandT(fv1, st.T1, fv2, M.a, cvf);
    M.fe.Trev    = revExpandT(fv1, st.T1, fv2, M.a, M.b, cvf);
    M.fe.TrevIdeal = adiabatT(st.T1, fv1, fv2, g);
    M.fe.dSideal = R_GAS * Math.log(st.feRatio);
    M.fe.dSreal  = freeExpandS(fv1, st.T1, fv2, M.fe.T2real, M.a, M.b, cvf);
    M.fe.dSrev   = 0;
    M.fe.Tuse    = st.feReal ? M.fe.T2real : M.fe.T2ideal;
    M.fe.dSuse   = st.feReal ? M.fe.dSreal : M.fe.dSideal;
    M.fe.TrevUse = st.feReal ? M.fe.Trev   : M.fe.TrevIdeal;
    /* the internal-pressure integrand, for the picture of WHY it cools */
    M.fe.path = [];
    for (let i = 0; i <= 120; i++){
      const v = fv1 * Math.exp(Math.log(st.feRatio) * i / 120);
      M.fe.path.push([v, freeExpandT(fv1, st.T1, v, M.a, cvf),
                         revExpandT(fv1, st.T1, v, M.a, M.b, cvf)]);
    }
  }

  /* --- the throttle ------------------------------------------------------ */
  M.thr = { gas: st.gas, hasCurve: !!INVCURVE[st.gas] };
  if (M.a){
    /* the van der Waals inversion locus, parametrically in v */
    const inv = [];
    for (let i = 0; i <= 240; i++){
      const vr = 0.4 * Math.pow(180 / 0.4, i / 240);            /* v/v_c */
      const v = 3 * M.b * vr, T = vdwInvT(v, M.a, M.b);
      const P = vdwP(v, T, M.a, M.b) / BAR;
      if (P > 0 && isFinite(T)) inv.push([P, T]);
    }
    M.thr.vdwCurve = inv;
    M.thr.TinvVdw = M.TinvVdw;
  }
  if (INVCURVE[st.gas]){
    const I = INVCURVE[st.gas];
    M.thr.measUpper = I.P.map((p, i) => [p, I.Tu[i]]);
    M.thr.measLower = I.Pl.map((p, i) => [p, I.Tl[i]]);
    M.thr.TinvMeas  = I.Tu[0];
    M.thr.TinvRed   = I.Tu[0] / FLUID[st.gas].Tc;
  } else {
    M.thr.measUpper = []; M.thr.measLower = [];
    M.warn.push(FLUID[st.gas] ? (FLUID[st.gas].name + ': NIST\'s equation of state for it does '
      + 'not reach its inversion temperature, so no measured curve is drawn') : '');
  }
  /* operating point */
  if (M.a){
    const vop = vdwV(st.thrP * BAR, st.thrT, M.a, M.b);
    M.thr.vop = vop;
    M.thr.muVdw = jtCoef(vop, st.thrT, M.a, M.b, M.cv) * BAR;      /* K/bar */
    const G = EOSGRID[st.gas];
    M.thr.muMeas = G ? gridAt(G, 'mu', st.thrT, st.thrP) : NaN;
    M.thr.cools  = (isFinite(M.thr.muMeas) ? M.thr.muMeas : M.thr.muVdw) > 0;
  }
  /* isenthalps through the grid, when there is a grid for this gas */
  M.thr.isenthalps = [];
  const GT = EOSGRID[st.gas];
  if (GT){
    const Tlist = [];
    const tlo = GT.T[0], thi = GT.T[GT.T.length - 1];
    for (let k = 0; k < 7; k++) Tlist.push(tlo + (thi - tlo) * (k + 0.5) / 7);
    for (const Tk of Tlist){
      const h0 = gridAt(GT, 'h', Tk, GT.P[GT.P.length - 1]);
      if (!isFinite(h0)) continue;
      const c = gridLevelCurve(GT, 'h', h0, GT.P[0], GT.P[GT.P.length - 1], 44);
      if (c.length > 3) M.thr.isenthalps.push({ h: h0, pts: c });
    }
  }
  /* the reduced-coordinates comparison: one van der Waals curve, all gases */
  M.thr.reducedVdw = [];
  for (let i = 0; i <= 200; i++){
    const Tr = 0.75 + (6.75 - 0.75) * i / 200;
    const Pr = vdwInvPr(Tr);
    if (Pr >= -1e-9) M.thr.reducedVdw.push([Math.max(Pr, 0), Tr]);
  }
  M.thr.reducedMeas = INVGASES.map((gk) => {
    const I = INVCURVE[gk], f = FLUID[gk];
    return { gas: gk, name: f.name,
             pts: I.P.map((p, i) => [p * BAR / (f.Pc * BAR), I.Tu[i] / f.Tc]),
             lo:  I.Pl.map((p, i) => [p * BAR / (f.Pc * BAR), I.Tl[i] / f.Tc]),
             Tr0: I.Tu[0] / f.Tc };
  });

  /* --- the rising parcel ------------------------------------------------- */
  M.snd = buildSounding(st);

  /* --- gamma ------------------------------------------------------------- */
  M.gam = { rows: [], curves: [] };
  for (const gk of GASLIST){
    const b = ISOBAR[gk], f = FLUID[gk];
    if (!b || !f) continue;
    const T = Math.max(b.T[0], Math.min(b.T[b.T.length - 1], st.gT));
    const cp = interp1(b.T, b.cp, T), cv = interp1(b.T, b.cv, T);
    const w  = interp1(b.T, b.w, T),  v  = interp1(b.T, b.v, T);
    const gm = cp / cv;
    M.gam.rows.push({
      gas: gk, name: f.name, gamma: gm, dof: 2 / (gm - 1), dofRigid: dofRigid(f),
      w: w, M: f.M, inRange: st.gT >= b.T[0] && st.gT <= b.T[b.T.length - 1],
      kappa: f.M ? kappaFromSound(w, 1, v, f.M) : NaN,
      cLaplace: f.M ? soundLaplace(gm, T, f.M) : NaN,
      cNewton:  f.M ? soundNewton(T, f.M) : NaN,
      atoms: f.atoms, linear: f.linear, Tlo: b.T[0], Thi: b.T[b.T.length - 1] });
    M.gam.curves.push({ gas: gk, name: f.name, atoms: f.atoms, linear: f.linear,
      pts: b.T.map((t, i) => [t, b.cp[i] / b.cv[i]]) });
  }
  M.gam.levels = [[5 / 3, 'monatomic, f = 3'], [7 / 5, 'linear rigid rotor, f = 5'],
                  [4 / 3, 'nonlinear rigid rotor, f = 6'], [9 / 7, 'f = 7']];

  /* --- the real adiabat -------------------------------------------------- */
  M.real = buildRealAdiabat(st, M);

  return M;
}

/* ---------------------------------------------------------------------------
 *  the sounding, and what a parcel released into it does
 * ------------------------------------------------------------------------- */
function buildSounding(st){
  const S = SOUNDING[st.site];
  if (!S) return null;
  const out = { site: S.site, date: S.date, hour: S.hour, stn: S.stn,
                lat: S.lat, lon: S.lon, n: S.n };
  const z0 = S.z[0], p0 = S.p[0] / 1000, T0 = S.T[0] + T0C, Td0 = S.Td[0] + T0C;
  out.z0 = z0; out.p0bar = p0; out.Tsfc = T0; out.Tdsfc = Td0;
  /* the environment, and theta recomputed here from p and T */
  out.env = [];
  for (let i = 0; i < S.z.length; i++){
    const T = S.T[i] + T0C, p = S.p[i] / 1000;
    out.env.push({ z: S.z[i], zkm: (S.z[i] - z0) / 1000, p: p, T: T,
                   Td: S.Td[i] + T0C, th: theta(T, p, 1.0) });
  }
  /* the dry adiabat a surface parcel would follow */
  const Tp0 = T0 + st.parcelDT;
  out.parcel = [];
  const ztopm = st.ztop * 1000;
  for (let k = 0; k <= 120; k++){
    const dz = ztopm * k / 120;
    const s = dryLift(Tp0, p0, z0, dz, 24);
    out.parcel.push({ zkm: dz / 1000, T: s.T, p: s.p, th: theta(s.T, s.p, 1.0) });
  }
  /* the lifting condensation level and the moist adiabat above it */
  const lcl = lclLevel(Tp0, Td0, p0, z0);
  out.lcl = lcl;
  out.moist = [];
  if (isFinite(lcl.z) && (lcl.z - z0) < ztopm){
    let T = lcl.T, p = lcl.p, z = lcl.z;
    const nst = 240, hstep = (ztopm - (lcl.z - z0)) / nst;
    for (let k = 0; k <= nst; k++){
      out.moist.push({ zkm: (z - z0) / 1000, T: T, p: p });
      const gm = lapseMoist(T, p);
      const dp = -p * G0 / (RD_AIR * T);
      T -= gm * hstep; p += dp * hstep; z += hstep;
    }
  }
  /* what the balloon actually measured: the deepest layer from the surface
     whose potential temperature is constant to within 1.5 K, and the lapse
     rate fitted through it.  This is the number the view exists to show. */
  const th0 = out.env[0].th;
  let iEnd = 0;
  for (let i = 0; i < out.env.length; i++){
    if (Math.abs(out.env[i].th - th0) < 1.5) iEnd = i; else break;
  }
  out.mixTop = out.env[iEnd].zkm;
  if (iEnd >= 3){
    let sx = 0, sy = 0, sxx = 0, sxy = 0, n = 0;
    for (let i = 0; i <= iEnd; i++){
      const x = out.env[i].zkm, y = out.env[i].T;
      sx += x; sy += y; sxx += x * x; sxy += x * y; n++;
    }
    out.mixLapse = -(n * sxy - sx * sy) / (n * sxx - sx * sx);   /* K/km, positive = cooling */
    out.mixN = n;
    let ss = 0;
    const m = -out.mixLapse, c = (sy - m * sx) / n;
    for (let i = 0; i <= iEnd; i++){
      const r = out.env[i].T - (m * out.env[i].zkm + c); ss += r * r;
    }
    out.mixRms = Math.sqrt(ss / n);
  } else { out.mixLapse = NaN; out.mixN = 0; out.mixRms = NaN; }
  out.lapseDry = lapseDry() * 1000;
  out.lapseIdealDiatomic = G0 / (3.5 * RD_AIR) * 1000;
  /* the strongest inversion in the profile, which is the opposite case */
  let best = { g: -1e9, z1: 0, z2: 0 };
  for (let i = 0; i < out.env.length; i++){
    for (let j = i + 1; j < Math.min(i + 40, out.env.length); j++){
      const dz = out.env[j].zkm - out.env[i].zkm;
      if (dz < 0.08 || dz > 0.5) continue;
      const gr = (out.env[j].T - out.env[i].T) / dz;
      if (gr > best.g) best = { g: gr, z1: out.env[i].zkm, z2: out.env[j].zkm };
    }
  }
  out.inv = best;
  return out;
}

/* ---------------------------------------------------------------------------
 *  the real adiabat: NIST's own isentrope against P v^gamma
 * ------------------------------------------------------------------------- */
function buildRealAdiabat(st, M){
  const gk = GRIDGAS.indexOf(st.gas) >= 0 ? st.gas : 'n2';
  const G = EOSGRID[gk];
  const out = { gas: gk, name: FLUID[gk].name, substituted: gk !== st.gas };
  /* The gas EXPANDS, so the state that is specified is the high-pressure one
     and the adiabat runs down from it.  Starting at the low-pressure end
     instead puts the far end of the curve at 1700 K for a 0.5 -> 200 bar
     compression, which is off the top of any grid NIST will serve; the curve
     then quietly stops after a handful of points and the view looks fine. */
  const Plo = G.P[0], Phi = Math.min(st.rP, G.P[G.P.length - 1]);
  const T0 = Math.max(G.T[0] + 5, Math.min(G.T[G.T.length - 1] - 5, st.rT));
  out.T0 = T0; out.Plo = Plo; out.Phi = Phi;
  const s0 = gridAt(G, 's', T0, Phi);
  out.s0 = s0;
  out.real = isFinite(s0) ? gridLevelCurve(G, 's', s0, Plo, Phi, 70) : [];
  /* the ideal-gas adiabat from the SAME start, using the measured gamma at
     that start -- so any divergence is real-gas behaviour and not a different
     value of gamma */
  const gam = gridAt(G, 'cp', T0, Phi) / gridAt(G, 'cv', T0, Phi);
  out.gamma0 = gam;
  out.ideal = [];
  for (let i = 0; i < 70; i++){
    const P = Plo + (Phi - Plo) * i / 69;
    out.ideal.push([P, adiabatTfromP(T0, Phi, P, gam)]);
  }
  /* The number that matters: how far the two have parted company by the time
     the gas reaches the low-pressure end.  Reported at the lowest pressure the
     real curve actually reaches, and that pressure is reported with it -- a
     departure quoted without saying where it was measured is not a number. */
  out.dev = [];
  for (const [P, T] of out.real){
    const Ti = adiabatTfromP(T0, Phi, P, gam);
    out.dev.push([P, T - Ti]);
  }
  out.devMax = out.dev.length ? out.dev.reduce((a, q) =>
                 Math.abs(q[1]) > Math.abs(a) ? q[1] : a, 0) : NaN;
  out.devEnd = out.dev.length ? out.dev[0] : [NaN, NaN];
  out.Preach = out.real.length ? out.real[0][0] : NaN;
  out.Treach = out.real.length ? out.real[0][1] : NaN;
  out.covers = out.real.length > 8;
  /* the isentropic exponent from the measured sound speed, against cp/cv.
     They coincide only for an ideal gas, and the gap is what "real" means. */
  out.kappa = []; out.gcurve = [];
  const f = FLUID[gk];
  for (let i = 0; i < G.P.length; i++){
    const P = G.P[i];
    const w = gridAt(G, 'w', T0, P), v = gridAt(G, 'v', T0, P);
    const cp = gridAt(G, 'cp', T0, P), cv = gridAt(G, 'cv', T0, P);
    if (isFinite(w) && isFinite(v) && f.M) out.kappa.push([P, kappaFromSound(w, P, v, f.M)]);
    if (isFinite(cp) && isFinite(cv)) out.gcurve.push([P, cp / cv]);
  }
  /* compressibility along the isotherm, the plainest statement of non-ideality */
  out.Z = [];
  for (let i = 0; i < G.P.length; i++){
    const P = G.P[i], v = gridAt(G, 'v', T0, P);
    if (isFinite(v)) out.Z.push([P, P * BAR * v * 1e-3 / (R_GAS * T0)]);
  }
  return out;
}

/* ============================================================================
 *  views
 *
 *  The floating readout sits over the top right of the stage -- about 344 px
 *  wide and up to 556 tall -- so nothing that has to be READ goes there.  RO
 *  below is that reserved rectangle and every layout in this file respects it.
 * ========================================================================== */
/* --------------------------------------------------------------------------
 *  formatting.  `sg` is the significant-figures formatter; it is NOT called
 *  `sig` because tools/ui_drive.js declares `const sig` at top level and
 *  concatenating the two for a headless UI run would be a SyntaxError, not a
 *  subtle bug.  Renaming here keeps the shared harness usable unmodified.
 * ------------------------------------------------------------------------ */
function fmt(x, n){ return isFinite(x) ? Number(x).toFixed(n === undefined ? 3 : n) : '\u2014'; }
function sup(e){
  const d = '\u2070\u00b9\u00b2\u00b3\u2074\u2075\u2076\u2077\u2078\u2079';
  let s = (e < 0 ? '\u207b' : ''), a = Math.abs(e) + '';
  for (const ch of a) s += d[+ch];
  return s;
}
function fmtExp(x, n){
  if (!isFinite(x)) return '\u2014';
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  return fmt(x / Math.pow(10, e), n === undefined ? 2 : n) + '\u00d710' + sup(e);
}
const RO = { w: 344, h: 556 };
const C_GREEN = '#b8ec4c', C_ORANGE = '#e8843a', C_MAG = '#cd35c4', C_CYAN = '#5ac8e0';
const C_DIM = '#8b93a6', C_TXT = '#cfd4de', C_FAINT = '#4a5165';
const GASSYM = { he: 'He', ne: 'Ne', ar: 'Ar', kr: 'Kr', xe: 'Xe', h2: 'H₂', n2: 'N₂',
                 o2: 'O₂', co2: 'CO₂', ch4: 'CH₄', c2h6: 'C₂H₆', nh3: 'NH₃' };

function clipTo(ctx, b, fn){
  ctx.save();
  ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  fn();
  ctx.restore();
}
/* polyline from [[x,y],...] pairs, always clipped to its box */
function pl(ctx, b, pts, xlo, xhi, ylo, yhi, col, lw, dash){
  if (!pts || !pts.length) return;
  clipTo(ctx, b, () => polyline(ctx, b, pts.map(q => q[0]), pts.map(q => q[1]),
                                xlo, xhi, ylo, yhi, col, lw, dash));
}
function px(b, x, xlo, xhi){ return b.x + b.w * (x - xlo) / (xhi - xlo || 1); }
function py(b, y, ylo, yhi){ return b.y1 - b.h * (y - ylo) / (yhi - ylo || 1); }
function dot(ctx, b, x, y, xlo, xhi, ylo, yhi, col, r){
  const X = px(b, x, xlo, xhi), Y = py(b, y, ylo, yhi);
  if (X < b.x - 2 || X > b.x1 + 2 || Y < b.y - 2 || Y > b.y1 + 2) return false;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X, Y, r || 4, 0, TAU); ctx.fill();
  return true;
}
/* Legends have now been placed on top of the curves they label three times --
   free expansion, the parcel, and reduced coordinates -- because "which corner
   is empty" was decided by looking at one configuration.  legend() therefore
   records its own rectangle in LEGEND_BOXES, and selfTest asserts that no data
   polyline passes through one, over every view and every gas. */
let LEGEND_BOXES = [];
function legend(ctx, x, y, entries, align){
  /* the recorded box is the TEXT area only.  The key marks are strokes drawn by
     this function itself, and including them would make every legend report a
     curve running through it. */
  /* Record the WHOLE legend -- key marks included -- and note how many path
     vertices this function is about to contribute itself (one moveTo and one
     lineTo per entry).  Recording only the text box was too generous: a
     mutation sweep put the legend back on top of the curves in two views and
     the assertion stayed green, because the curves crossed the key column
     rather than the words. */
  let wmax = 0;
  for (const e of entries) wmax = Math.max(wmax, plain(e[1]).length * 6.2 + 34);
  LEGEND_BOXES.push({ x: align === 'right' ? x - 28 - wmax : x, y: y - 9,
                      w: wmax + 6, h: entries.length * 15 + 4, own: entries.length * 2 });
  ctx.save();
  ctx.font = '11px -apple-system, sans-serif'; ctx.textBaseline = 'middle';
  let yy = y;
  for (const [col, lab, dash] of entries){
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    if (align === 'right'){ ctx.moveTo(x - 22, yy); ctx.lineTo(x - 4, yy); }
    else { ctx.moveTo(x, yy); ctx.lineTo(x + 18, yy); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C_DIM; ctx.textAlign = align === 'right' ? 'right' : 'left';
    ctx.fillText(plain(lab), align === 'right' ? x - 28 : x + 24, yy);
    yy += 15;
  }
  ctx.restore();
  return yy - y;
}
/* Tick labels sized to the tick SPACING.  fmt(t,2) prints "318.00" whatever
   the range, and six of those do not fit in a 210 px panel -- the audit caught
   them overlapping each other, not the frame.  This prints only the digits the
   spacing actually distinguishes. */
function tickfmt(ticks){
  let step = Infinity;
  for (let i = 1; i < ticks.length; i++) step = Math.min(step, Math.abs(ticks[i] - ticks[i - 1]));
  if (!isFinite(step) || step <= 0) step = 1;
  const d = Math.max(0, Math.min(4, Math.ceil(-Math.log10(step) + 0.3)));
  return (t) => Number(t).toFixed(d);
}
function ticksN(lo, hi, n){ return ticksFor(Math.min(lo, hi), Math.max(lo, hi), n); }
function sg(x, n){
  if (!isFinite(x)) return '\u2014';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e5 || a < 1e-3) return fmtExp(x, Math.max(0, (n || 3) - 1));
  const d = Math.max(0, (n || 3) - 1 - Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d, 6));
}
/* --------------------------------------------------------------------------
 *  Lay the stage out from the BOTTOM up.
 *
 *  The caption and the footnote are wrapped text, so their height depends on
 *  the canvas width and cannot be a constant.  Guessing one put the caption
 *  UNDER the footnote at 520x340 and pushed both off a 340 px canvas -- found
 *  by the resize sweep, not by looking.  stage() measures both first and hands
 *  the plot whatever vertical space is left.
 * ------------------------------------------------------------------------ */
const CAP_FONT  = '11.5px -apple-system, sans-serif';
const FOOT_FONT = '10.5px "SF Mono", ui-monospace, monospace';
function stage(ctx, W, H, capTxt, footTxt, capW){
  const fl = footTxt ? wrapText(ctx, plain(footTxt), W - 40, FOOT_FONT).length : 0;
  const cl = capTxt  ? wrapText(ctx, plain(capTxt),  capW,  CAP_FONT).length  : 0;
  const footY = H - 8 - fl * 13;
  const capY  = footY - 10 - cl * 14;
  const top = 54;
  /* axes() draws tick labels at b.y1 + 5 and the axis title at b.y1 + 21, so
     the box must end at least ~40 px above the caption or the two collide --
     which is exactly what the display-list audit reported on six views. */
  return { top: top, capY: capY, footY: footY, capW: capW, cap: capTxt, foot: footTxt,
           plotH: Math.max(90, capY - 44 - top) };
}
function drawStage(ctx, W, H, L){
  if (L.cap)  caption(ctx, 66, L.capY, L.cap, L.capW, C_TXT, CAP_FONT);
  if (L.foot) caption(ctx, 18, L.footY, L.foot, W - 40, '#5c6478', FOOT_FONT);
}

/* ==========================================================================
 *  view 1 -- the piston
 * ======================================================================== */
function viewPiston(ctx, W, H, M, S){
  const st = M.st;
  const wPlot = Math.max(300, W - RO.w - 130);
  const foot = 'γ ' + (st.measuredGamma ? 'measured (NIST cp/cv for ' + M.gasName
    + ' at ' + sg(st.T1, 4) + ' K, 1 bar)' : 'from f = ' + st.dof + ' degrees of freedom')
    + ' · one mole · the gas is treated as ideal in this view; the real one is two tabs along';
  const L = stage(ctx, W, H, null, foot, wPlot);
  const cylH = Math.min(120, Math.max(0, L.plotH - 150));      /* cylinders, if there is room */
  const b = box(64, L.top, wPlot, Math.max(90, L.plotH - cylH));
  const vr = st.vratio;
  const xlo = 1, xhi = vr * 1.02;
  const ylo = 0, yhi = 1.04;
  /* both curves normalised to the starting state, so the picture is about the
     SHAPE and does not change when the sliders move the axes under it */
  const nAd = M.curveAd.map(q => [q[0] / M.v1, q[1] / M.P1]);
  const nIso = M.curveIso.map(q => [q[0] / M.v1, q[1] / M.P1]);

  /* the work areas, drawn first so the curves sit on top */
  if (st.showWork){
    const fill = (pts, col) => clipTo(ctx, b, () => {
      ctx.beginPath();
      ctx.moveTo(px(b, pts[0][0], xlo, xhi), py(b, 0, ylo, yhi));
      for (const q of pts) ctx.lineTo(px(b, q[0], xlo, xhi), py(b, q[1], ylo, yhi));
      ctx.lineTo(px(b, pts[pts.length - 1][0], xlo, xhi), py(b, 0, ylo, yhi));
      ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    });
    if (st.showIso) fill(nIso, 'rgba(232,132,58,0.13)');
    if (st.showAdi) fill(nAd,  'rgba(184,236,76,0.15)');
  }
  const px1 = ticksN(xlo, xhi, 6), py1 = ticksN(ylo, yhi, 5);
  axes(ctx, b, xlo, xhi, ylo, yhi, {
    xlab: 'v / v₁', ylab: 'P / P₁', xticks: px1, yticks: py1,
    xfmt: tickfmt(px1), yfmt: tickfmt(py1),
    title: 'the same expansion, held at temperature and left alone' });
  if (st.showIso) pl(ctx, b, nIso, xlo, xhi, ylo, yhi, C_ORANGE, 2.0);
  if (st.showAdi) pl(ctx, b, nAd,  xlo, xhi, ylo, yhi, C_GREEN, 2.2);
  dot(ctx, b, 1, 1, xlo, xhi, ylo, yhi, C_MAG, 4.5);
  if (st.showIso) dot(ctx, b, vr, M.P2iso / M.P1, xlo, xhi, ylo, yhi, C_ORANGE, 4);
  if (st.showAdi) dot(ctx, b, vr, M.P2ad / M.P1, xlo, xhi, ylo, yhi, C_GREEN, 4);

  /* both curves leave the TOP-LEFT corner, which is where a P-v legend wants to
     go and is the one place it cannot */
  legend(ctx, b.x1 - 14, b.y + 16,
    [[C_ORANGE, 'isothermal  P v = const', null],
     [C_GREEN,  'adiabatic   P v^γ = const, γ = ' + sg(M.gamma, 5), null]], 'right');
  ctx.font = '11px -apple-system, sans-serif'; ctx.fillStyle = C_DIM;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  /* This caption lives INSIDE the plot, so it has to be MEASURED against the
     plot rather than assumed to fit: on a 640x430 canvas it wraps to eight
     lines and runs out of the box onto the tick labels.  Dropped whole when
     there is no room -- the readout carries the same numbers either way. */
  {
    const capTxt = 'The adiabat is steeper by exactly γ: the logarithmic slopes are −γ and −1, '
      + 'and their ratio here is ' + M.slopeRatio.toFixed(9) + '. The shaded areas are ∫P dv — '
      + 'the work the gas does. It does less when insulated, because it is cooling as it goes.';
    const cw = Math.max(150, b.w * 0.54);
    const lines = wrapText(ctx, plain(capTxt), cw, CAP_FONT).length;
    if (62 + lines * 14 < b.h - 26)
      caption(ctx, b.x + b.w - cw - 10, b.y + 62, capTxt, cw, C_DIM);
  }

  /* the two cylinders, below the plot, only when the canvas is tall enough to
     hold them AND their two lines of label -- dropped whole rather than drawn
     off the bottom */
  if (cylH >= 96){
    const cy = b.y1 + 38, cw = Math.min(190, (b.w - 60) / 2), ch = cylH - 58;
    drawCylinder(ctx, b.x + 6, cy, cw, ch, 1 / vr, st.T1, st.T1, C_ORANGE,
                 'held at ' + sg(st.T1, 4) + ' K', 'heat in: ' + sg(M.Qiso, 4) + ' J/mol');
    drawCylinder(ctx, b.x + 26 + cw, cy, cw, ch, 1 / vr, st.T1, M.T2ad, C_GREEN,
                 'insulated → ' + sg(M.T2ad, 4) + ' K',
                 'no heat: ΔU = −W = ' + sg(M.dUad, 4) + ' J/mol');
  }
  drawStage(ctx, W, H, L);
}
/* frac is v1/v2.  The gas shown is the state the LABEL describes -- the final
   one -- filling the cylinder up to the piston, with a dashed line where it
   started.  The first version filled only v1/v2 of the barrel while captioning
   it with the final temperature, so the picture was of the state before the
   expansion under a label describing the state after it. */
function drawCylinder(ctx, x, y, w, h, frac, T1, T2, col, lab, sub){
  ctx.save();
  const pist = w - 16;                         /* piston face, final position */
  const start = Math.max(6, pist * frac);      /* where it began */
  const t = clamp((T2 - 80) / 320, 0, 1);
  ctx.fillStyle = mix('#10131b', col, 0.18 + 0.42 * t);
  ctx.fillRect(x + 1, y + 1, pist - 1, h - 1);
  ctx.strokeStyle = '#39415a'; ctx.lineWidth = 1.4;
  ctx.strokeRect(x + 0.5, y + 0.5, w, h);
  ctx.strokeStyle = '#7b8398'; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x + start, y + 2); ctx.lineTo(x + start, y + h - 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#2a3247'; ctx.fillRect(x + pist, y + 1, 6, h - 1);
  ctx.strokeStyle = '#4a5468'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(x + pist + 6, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
  ctx.fillStyle = col; ctx.font = 'italic 12px Georgia, serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(plain(lab), x, y + h + 7);
  ctx.fillStyle = C_DIM; ctx.font = '10.5px -apple-system, sans-serif';
  ctx.fillText(plain(sub), x, y + h + 23);
  ctx.restore();
}

/* ==========================================================================
 *  view 2 -- free expansion
 * ======================================================================== */
function viewFree(ctx, W, H, M, S){
  const st = M.st;
  if (!M.fe){ caption(ctx, 40, 60, 'no van der Waals constants for this gas', 400, C_ORANGE); return; }
  const fe = M.fe;
  const wPlot = Math.max(300, W - RO.w - 130);
  const cap = st.feReal
      ? ('For a real gas the molecules attract, so pulling them apart costs energy that has to '
         + 'come out of the thermal store: ' + M.gasName + ' cools by '
         + sg(st.T1 - fe.T2real, 3) + ' K. Doing the same expansion reversibly takes '
         + sg(st.T1 - fe.Trev, 3) + ' K out of it — '
         + sg((st.T1 - fe.Trev) / Math.max(st.T1 - fe.T2real, 1e-9), 3)
         + ' times as much — because that gas actually did work on the way out.')
      : ('For an IDEAL gas the internal energy depends on temperature alone, so the temperature '
         + 'does not change at all. The entropy still rises by R ln(v₂/v₁). Adiabatic and '
         + 'isentropic are not the same word.');
  const foot = 'van der Waals a, b for ' + M.gasName + ' from its measured critical point'
    + ' (a = ' + sg(M.a, 4) + ' Pa m⁶/mol², b = ' + sg(M.b, 4) + ' m³/mol) · cv held constant';
  const L = stage(ctx, W, H, cap, foot, wPlot);
  /* the vessel, top left -- given a share of what is left, not a fixed height */
  const vh = Math.min(92, Math.max(0, L.plotH - 170));
  const vx = 60, vy = 56, vw = Math.min(300, W - RO.w - 140);
  if (vh >= 40) drawVessel(ctx, vx, vy, vw, vh, st.feRatio);

  const bTop = vh >= 40 ? vy + vh + 44 : L.top;
  const b = box(64, bTop, wPlot, Math.max(90, L.top + L.plotH - bTop));
  const xlo = 1, xhi = st.feRatio;
  const Tmin = Math.min(fe.TrevUse, fe.Tuse) * 0.96, Tmax = st.T1 * 1.02;
  const free = fe.path.map(q => [q[0] / fe.v1, st.feReal ? q[1] : st.T1]);
  const rev  = fe.path.map(q => [q[0] / fe.v1, st.feReal ? q[2]
                                   : adiabatT(st.T1, fe.v1, q[0], M.gamma)]);
  const fx = ticksN(xlo, xhi, 6), fy = ticksN(Tmin, Tmax, 5);
  axes(ctx, b, xlo, xhi, Tmin, Tmax, {
    xlab: 'v / v₁', ylab: 'T  (K)', xticks: fx, yticks: fy,
    xfmt: tickfmt(fx), yfmt: tickfmt(fy),
    title: 'both are adiabatic — one of them is reversible' });
  pl(ctx, b, free, xlo, xhi, Tmin, Tmax, C_GREEN, 2.2);
  if (st.showRev) pl(ctx, b, rev, xlo, xhi, Tmin, Tmax, C_MAG, 2.0, [6, 4]);
  dot(ctx, b, 1, st.T1, xlo, xhi, Tmin, Tmax, C_CYAN, 4.5);
  dot(ctx, b, st.feRatio, fe.Tuse, xlo, xhi, Tmin, Tmax, C_GREEN, 4);
  if (st.showRev) dot(ctx, b, st.feRatio, fe.TrevUse, xlo, xhi, Tmin, Tmax, C_MAG, 4);
  /* bottom left: the free curve runs along the TOP of this plot and the
     reversible one down the middle, so the top-left corner is exactly where a
     legend must not go */
  legend(ctx, b.x + 16, b.y1 - 46,
    [[C_GREEN, 'burst the partition — Q = 0, W = 0', null],
     [C_MAG, 'push the piston out slowly — Q = 0, W > 0', [6, 4]]]);

  /* the entropy bars, top right of the plot -- below the free curve, which
     hugs the top edge, and clear of the reversible one, which is on the left */
  const bx = b.x + b.w - 200, by = b.y + 54;
  ctx.save();
  ctx.font = '11px -apple-system, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const smax = Math.max(fe.dSuse, 1e-9) * 1.25;
  const bar = (yy, val, col, lab) => {
    const wpx = 120 * clamp(val / smax, 0, 1);
    /* a zero-width bar reads as a broken one, so zero gets a visible stub and
       the number beside it says it is zero */
    ctx.fillStyle = val > 0 ? col : '#2a3247';
    ctx.fillRect(bx, yy - 5, Math.max(wpx, 3), 10);
    ctx.fillStyle = C_DIM;
    ctx.fillText(plain(lab + '  ' + sg(val, 3) + ' J/mol/K'), bx, yy + 17);
  };
  bar(by, fe.dSuse, C_GREEN, 'ΔS free');
  bar(by + 40, 0, C_MAG, 'ΔS reversible');
  ctx.restore();

  if (vh >= 40) caption(ctx, vx + vw + 26, vy + 4,
    'Insulated vessel, gas on one side, vacuum on the other. Break the partition and the gas '
    + 'expands against nothing: it does no work, no heat crosses the wall, so its internal '
    + 'energy is unchanged.', Math.max(160, W - RO.w - vw - 90), C_TXT);
  drawStage(ctx, W, H, L);
}
function drawVessel(ctx, x, y, w, h, ratio){
  ctx.save();
  const gw = w / ratio;
  ctx.strokeStyle = '#4a5468'; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w, h);
  ctx.fillStyle = 'rgba(90,200,224,0.18)'; ctx.fillRect(x + 2, y + 2, gw - 2, h - 2);
  ctx.strokeStyle = '#8b93a6'; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(x + gw, y + 2); ctx.lineTo(x + gw, y + h); ctx.stroke();
  ctx.setLineDash([]);
  /* molecules, placed on a fixed lattice so the picture does not jitter when a
     slider moves -- a random scatter redrawn every frame reads as animation */
  ctx.fillStyle = C_CYAN;
  for (let i = 0; i < 46; i++){
    const u = ((i * 37) % 100) / 100, v = ((i * 61) % 100) / 100;
    ctx.beginPath(); ctx.arc(x + 6 + u * (gw - 12), y + 8 + v * (h - 16), 2.1, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = C_DIM; ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('gas', x + gw / 2, y + h + 6);
  if (w - gw > 40) ctx.fillText('vacuum', x + gw + (w - gw) / 2, y + h + 6);
  ctx.restore();
}

/* ==========================================================================
 *  view 3 -- the throttle
 * ======================================================================== */
function viewThrottle(ctx, W, H, M, S){
  const st = M.st;
  const wPlot = Math.max(300, W - RO.w - 130);
  if (st.reduced) return throttleReduced(ctx, W, H, M, wPlot);
  const T = M.thr;
  /* the axes are set from the MEASURED curve when there is one, so the picture
     is framed by the data rather than by the model being tested */
  let Phi = 400, Thi = 800;
  if (T.measUpper.length){
    Phi = Math.max(50, T.measUpper[T.measUpper.length - 1][0] * 1.12);
    Thi = Math.max(...T.measUpper.map(q => q[1])) * 1.14;
  }
  Phi = Math.max(Phi, st.thrP * 1.1); Thi = Math.max(Thi, st.thrT * 1.1);
  const Tlo = 0;
  let msg;
  if (!T.measUpper.length){
    msg = 'NIST\'s equation of state for ' + M.gasName + ' stops before its inversion '
        + 'temperature — μ is still positive at the hottest state it will return — so there is '
        + 'no measured curve to draw here and none is invented. The van der Waals curve is '
        + 'shown alone, and it is the one being tested, not the answer.';
  } else {
    const mm = isFinite(T.muMeas) ? T.muMeas : T.muVdw;
    msg = 'At ' + sg(st.thrT, 4) + ' K and ' + sg(st.thrP, 4) + ' bar, μ = '
        + sg(mm, 3) + ' K/bar: throttling to 1 bar ' + (mm > 0 ? 'COOLS' : 'WARMS')
        + ' it by roughly ' + sg(Math.abs(mm) * (st.thrP - 1), 3) + ' K. '
        + 'Zero-pressure inversion temperature: measured ' + sg(T.TinvMeas, 4)
        + ' K = ' + sg(T.TinvRed, 3) + ' T_c, against van der Waals\' '
        + sg(T.TinvVdw, 4) + ' K, which is 6.75 T_c for every gas there is.';
  }
  let foot = 'the inversion curve is the locus μ = (∂T/∂P)_H = 0 · isenthalps are '
    + 'levels of NIST\'s own enthalpy · this is what a Linde liquefier lives inside';
  if (EOSNOTE[st.gas]) foot += ' · ' + EOSNOTE[st.gas];
  const L = stage(ctx, W, H, msg, foot, wPlot);
  const b = box(66, L.top, wPlot, L.plotH);
  const tx = ticksN(0, Phi, 6), ty = ticksN(Tlo, Thi, 5);
  axes(ctx, b, 0, Phi, Tlo, Thi, {
    xlab: 'pressure  (bar)', ylab: 'temperature  (K)',
    xticks: tx, yticks: ty, xfmt: tickfmt(tx), yfmt: tickfmt(ty),
    title: 'throttling ' + M.gasName + ': inside the curve it cools, outside it warms' });

  /* isenthalps -- the actual paths a throttled gas follows */
  for (const ih of T.isenthalps)
    pl(ctx, b, ih.pts, 0, Phi, Tlo, Thi, '#2c3547', 1.2);

  if (st.showVdw && T.vdwCurve)
    pl(ctx, b, T.vdwCurve, 0, Phi, Tlo, Thi, C_ORANGE, 2.0, [7, 4]);
  if (st.showMeas){
    pl(ctx, b, T.measUpper, 0, Phi, Tlo, Thi, C_GREEN, 2.4);
    pl(ctx, b, T.measLower, 0, Phi, Tlo, Thi, C_GREEN, 2.4);
  }
  dot(ctx, b, st.thrP, st.thrT, 0, Phi, Tlo, Thi, C_MAG, 5);

  const leg = [];
  if (st.showMeas && T.measUpper.length) leg.push([C_GREEN, 'measured (NIST μ = 0)', null]);
  if (st.showVdw) leg.push([C_ORANGE, 'van der Waals', [7, 4]]);
  /* only when there ARE any: there is no property grid for most of these gases,
     and a legend entry for a curve that was never drawn is a false claim about
     the picture */
  if (T.isenthalps.length) leg.push(['#2c3547', 'isenthalps — the throttling paths', null]);
  legend(ctx, b.x + 14, b.y + 18, leg);

  drawStage(ctx, W, H, L);
}
function throttleReduced(ctx, W, H, M, wPlot){
  const T = M.thr;
  const lo = Math.min(...T.reducedMeas.map(r => r.Tr0)), hi = Math.max(...T.reducedMeas.map(r => r.Tr0));
  const cap = 'If the principle of corresponding states held exactly, and if van der Waals were '
    + 'the right equation, all five measured curves would lie on the dashed one and every gas '
    + 'would invert at 6.75 T_c. They do not: the measured zero-pressure inversion temperature '
    + 'runs from ' + sg(lo, 3) + ' T_c to ' + sg(hi, 3) + ' T_c, a spread of ' + sg(hi / lo, 3)
    + '. Helium is the high outlier and carbon dioxide the low one — the two gases furthest from '
    + 'a hard sphere with a weak attraction.';
  const foot = 'reduced by each gas\'s own measured T_c and P_c (NIST) · '
    + 'the van der Waals locus P_r = 24√(3T_r) − 12T_r − 27 is exact, not fitted · '
    + EOSNOTE.co2;
  const L = stage(ctx, W, H, cap, foot, wPlot);
  const b = box(66, L.top, wPlot, L.plotH);
  axes(ctx, b, 0, 12, 0, 9.4, {
    xlab: 'P / P_c', ylab: 'T / T_c',
    title: 'the same curves in reduced coordinates — corresponding states, tested' });
  pl(ctx, b, T.reducedVdw.map(q => [q[0], q[1]]), 0, 12, 0, 9.4, C_ORANGE, 2.6, [7, 4]);
  const cols = [C_GREEN, C_CYAN, C_MAG, '#e8c53a', '#7ee0a0'];
  const ent = [[C_ORANGE, 'van der Waals — one curve for every gas', [7, 4]]];
  T.reducedMeas.forEach((r, i) => {
    pl(ctx, b, r.pts, 0, 12, 0, 9.4, cols[i % cols.length], 1.9);
    pl(ctx, b, r.lo,  0, 12, 0, 9.4, cols[i % cols.length], 1.9);
    ent.push([cols[i % cols.length], r.name + '  ' + sg(r.Tr0, 3) + ' T_c', null]);
  });
  /* top right: helium's branch starts at 8.76 T_c on the LEFT and falls to 6.4
     by the right-hand edge, so the top-left corner -- the obvious one -- is the
     one place a legend must not go here */
  legend(ctx, b.x1 - 14, b.y + 18, ent, 'right');
  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 4 -- the rising parcel
 * ======================================================================== */
function viewParcel(ctx, W, H, M, S){
  const st = M.st, s = M.snd;
  if (!s){ caption(ctx, 40, 60, 'no sounding', 400, C_ORANGE); return; }
  const wTot = Math.max(330, W - RO.w - 120);
  const meas = isFinite(s.mixLapse)
    ? ('Over the lowest ' + sg(s.mixTop, 3) + ' km — ' + s.mixN + ' levels whose potential '
       + 'temperature holds constant to 1.5 K — the balloon measures a lapse rate of '
       + sg(s.mixLapse, 4) + ' K/km, scattering ' + sg(s.mixRms, 2) + ' K about the fit. '
       + 'g/c_p, built from NIST heat capacities and air\'s composition, is '
       + sg(s.lapseDry, 4) + ' K/km.')
    : ('This profile has no well-mixed layer at all: the potential temperature starts rising '
       + 'immediately, so there is no dry adiabat in it to measure. The strongest inversion is '
       + '+' + sg(s.inv.g, 3) + ' K/km between ' + sg(s.inv.z1, 2) + ' and '
       + sg(s.inv.z2, 2) + ' km — air getting WARMER with height, where a dry adiabat falls at '
       + sg(s.lapseDry, 4) + '.');
  const foot = 'University of Wyoming sounding ' + s.stn + ' · '
    + s.lat.toFixed(2) + '°, ' + s.lon.toFixed(2) + '° · θ recomputed here from p and T, '
    + 'not taken from the archive · κ = R/c_p = ' + KAPPA_AIR.toFixed(5);
  const L = stage(ctx, W, H, meas, foot, wTot);
  const wth = st.showTheta && wTot > 420 ? Math.min(210, wTot * 0.34) : 0;
  const b = box(64, L.top, wTot - wth - (wth ? 46 : 0), L.plotH);
  const zlo = 0, zhi = st.ztop;
  let Tlo = 1e9, Thi = -1e9;
  const inZ = (q) => q.zkm >= zlo && q.zkm <= zhi;
  for (const e of s.env) if (inZ(e)){ Tlo = Math.min(Tlo, e.Td, e.T); Thi = Math.max(Thi, e.T); }
  for (const p of s.parcel) if (inZ(p)) Tlo = Math.min(Tlo, p.T);
  Tlo -= 4; Thi += 6;
  const ptx = ticksN(Tlo, Thi, 6), pty = ticksN(zlo, zhi, 5);
  axes(ctx, b, Tlo, Thi, zlo, zhi, {
    xlab: 'temperature  (K)', ylab: 'height above the station  (km)',
