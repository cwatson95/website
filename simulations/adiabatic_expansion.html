/* ============================================================================
 *  selfTest -- runs when there is no document
 * ========================================================================== */
function selfTest(){
  let pass = 0, fail = 0;
  const ok = (c, n) => { if (c) pass++; else { fail++; console.log('FAIL: ' + n); } };
  const close = (a, b, tol, n) => ok(isFinite(a) && isFinite(b) && Math.abs(a - b) <= tol,
    n + '  (got ' + a + ', want ' + b + ', tol ' + tol + ')');
  const rel = (a, b, t, n) => ok(isFinite(a) && isFinite(b) && b !== 0
    && Math.abs(a / b - 1) <= t, n + '  (got ' + a + ', want ' + b + ', rel ' + t + ')');
  /* 4th-order central difference -- used everywhere a derivative is checked
     against a closed form, so the tolerance can stay tight */
  const d1 = (f, x, hh) => (f(x - 2 * hh) - 8 * f(x - hh) + 8 * f(x + hh) - f(x + 2 * hh)) / (12 * hh);

  /* ---------------- numerics ---------------- */
  for (let i = 0; i < 10; i++){
    close(GLX[i], REF.glx[i], 1e-15, 'Gauss-Legendre node ' + i + ' (scipy)');
    close(GLW[i], REF.glw[i], 1e-15, 'Gauss-Legendre weight ' + i + ' (scipy)');
  }
  {
    let worst = 0;
    for (let k = 0; k <= 19; k++){
      const exact = (Math.pow(1, k + 1) - Math.pow(-1, k + 1)) / (k + 1);
      const got = gl((x) => Math.pow(x, k), -1, 1, 1);
      worst = Math.max(worst, Math.abs(got - exact));
    }
    ok(worst < 1e-14, 'the 10-point rule is exact to degree 19 (worst ' + worst + ')');
    const bad = Math.abs(gl((x) => Math.pow(x, 20), -1, 1, 1) - 2 / 21);
    ok(bad > 1e-6, 'and is NOT exact at degree 20 -- so that test is not vacuous');
  }
  ok(!isFinite(bisect((x) => x * x + 1, 0, 1)), 'bisect returns NaN on a bracket it does not '
    + 'straddle, rather than an endpoint that looks like an answer');
  close(bisect((x) => x * x - 2, 0, 3, 1e-15), Math.SQRT2, 1e-12, 'bisect finds sqrt(2)');

  /* ---------------- the ideal adiabat ---------------- */
  for (const [g, T1, r, T2] of REF.adiabat)
    rel(adiabatT(T1, 1, r, g), T2, 3e-11, 'T v^(g-1) matches the ODE at g=' + g + ' (scipy)');
  for (const [g, r, W] of REF.work)
    rel(workAdiabat(1e5, 1, r, g), W, 1e-11, 'adiabatic work at g=' + g + ', r=' + r + ' (scipy)');
  rel(workIsotherm(1e5, 1, 5), 1e5 * Math.log(5), 1e-15, 'isothermal work is P1 v1 ln(v2/v1)');
  for (const g of [5 / 3, 1.4, 1.289]){
    close(cpFromGamma(g) - cvFromGamma(g), R_GAS, 1e-12, 'cp - cv = R at g=' + g);
    close(gammaFromDof(2 / (g - 1)), g, 1e-14, 'gamma <-> f round trip at g=' + g);
    /* the slope ratio, taken numerically from both curves rather than asserted */
    for (const v of [1.3, 2.7, 9.0]){
      const Pa = (vv) => 1e5 * Math.pow(1 / vv, g), Pi = (vv) => 1e5 / vv;
      const ra = (d1(Pa, v, v * 1e-5) / Pa(v)) / (d1(Pi, v, v * 1e-5) / Pi(v));
      rel(ra, g, 1e-9, 'the adiabat is steeper than the isotherm by exactly g (g=' + g + ', v=' + v + ')');
    }
    /* the two forms of the adiabat must agree */
    const T2 = adiabatT(300, 1, 6, g), P2 = adiabatP(1e5, 1, 6, g);
    rel(adiabatTfromP(300, 1e5, P2, g), T2, 1e-12, 'T(P) and T(v) forms agree at g=' + g);
  }

  /* ---------------- van der Waals ---------------- */
  {
    /* a and b recovered from the critical point must give that point back */
    for (const gk of ['n2', 'co2', 'he', 'h2', 'ar']){
      const F = FLUID[gk], vd = vdwFromCritical(F.Tc, F.Pc * BAR);
      rel(8 * vd.a / (27 * R_GAS * vd.b), F.Tc, 1e-13, gk + ': a,b reproduce Tc');
      rel(vd.a / (27 * vd.b * vd.b), F.Pc * BAR, 1e-13, gk + ': a,b reproduce Pc');
      rel(vd.a, REF.vdwab[gk] ? REF.vdwab[gk][0] : vd.a, 1e-12, gk + ': a matches Python (scipy)');
      rel(vd.b, REF.vdwab[gk] ? REF.vdwab[gk][1] : vd.b, 1e-12, gk + ': b matches Python (scipy)');
    }
    /* solve dP/dv = d2P/dv2 = 0 numerically and check v_c = 3b, Z_c = 3/8 */
    const a = 0.1358, b = 3.64e-5;
    const f = (v) => 2 * (2 * a * (v - b) * (v - b) / (v * v * v)) / Math.pow(v - b, 3) - 6 * a / Math.pow(v, 4);
    const vC = bisect(f, b * 1.0000001 + 1e-14, 1e3 * b, 1e-16);
    const TC = 2 * a * (vC - b) * (vC - b) / (R_GAS * vC * vC * vC);
    const PC = vdwP(vC, TC, a, b);
    rel(vC / (3 * b), REF.critsolve[0], 1e-10, 'v_c = 3b, solved not quoted (scipy)');
    rel(TC / (8 * a / (27 * R_GAS * b)), REF.critsolve[1], 1e-10, 'T_c = 8a/27Rb (scipy)');
    rel(PC * vC / (R_GAS * TC), 3 / 8, 1e-9, 'Z_c = 3/8 for van der Waals');
    /* and Z_c = 3/8 is a PREDICTION that fails: no real gas is near it */
    let worstZ = 0;
    for (const gk of ['n2', 'co2', 'he', 'h2', 'ar', 'o2', 'ch4']){
      const F = FLUID[gk];
      worstZ = Math.max(worstZ, Math.abs(F.Pc * BAR / (F.Dc * 1000 * R_GAS * F.Tc) - 0.375));
    }
    ok(worstZ > 0.06, 'every measured Z_c is well below 3/8 -- the model is being tested, '
      + 'not fitted (worst departure ' + worstZ.toFixed(4) + ')');
    /* vdwV inverts vdwP */
    for (const T of [120, 300, 700]) for (const Pb of [1, 50, 300]){
      const v = vdwV(Pb * BAR, T, a, b);
      rel(vdwP(v, T, a, b), Pb * BAR, 1e-9, 'vdwV inverts vdwP at ' + T + ' K, ' + Pb + ' bar');
    }
  }
  {
    const a = 0.1358, b = 3.64e-5, cv = 2.5 * R_GAS;
    /* thermodynamic identities, each taken numerically off the function itself */
    for (const v of [1e-3, 8e-3]){
      const hh = v * 1e-6;
      rel(d1((vv) => vdwS(vv, 300, a, b, cv), v, hh), R_GAS / (v - b), 1e-8,
          '(ds/dv)_T = (dP/dT)_v = R/(v-b) at v=' + v + '  [Maxwell]');
      rel(d1((vv) => vdwU(vv, 300, a, b, cv), v, hh), a / (v * v), 1e-8,
          '(du/dv)_T = T(dP/dT)_v - P = a/v^2 at v=' + v);
      rel(vdwH(v, 300, a, b, cv), vdwU(v, 300, a, b, cv) + vdwP(v, 300, a, b) * v, 1e-12,
          'h = u + Pv at v=' + v);
    }
    /* step chosen ABOVE the roundoff floor: a 4th-order difference of an O(1)
       function has error ~ eps*f/h, which at h = 1e-4 is 2e-10 -- larger than
       the tolerance being asserted.  h = 0.1 costs nothing in truncation for a
       logarithm and buys four orders of magnitude of roundoff. */
    rel(d1((T) => vdwS(1e-3, T, a, b, cv), 300, 0.1), cv / 300, 1e-11, '(ds/dT)_v = cv/T');
    rel(vdwCp(1e4, 300, a, b, cv) - cv, R_GAS, 1e-6, 'cp - cv -> R in the dilute limit');
    /* the Joule coefficient, from a constant-u path */
    for (const v of [1e-3, 5e-3, 2.4e-2]){
      const u0 = vdwU(v, 300, a, b, cv);
      const Tof = (vv) => bisect((T) => vdwU(vv, T, a, b, cv) - u0, 1, 5000, 1e-14);
      rel(d1(Tof, v, v * 1e-5), jouleCoef(v, 300, a, b, cv), 1e-6,
          '(dT/dv)_u = -a/(cv v^2) at v=' + v + ', taken off a constant-u path');
    }
    /* the Joule-Thomson coefficient, from a constant-h path */
    for (const [Pb, T] of [[1, 300], [50, 300], [1, 120], [200, 700]]){
      const v0 = vdwV(Pb * BAR, T, a, b), h0 = vdwH(v0, T, a, b, cv);
      /* The inner solve returns T to a relative 1e-15, i.e. ~3e-13 K.  A
         derivative step of P*1e-6 turns that into 3e-9 K/Pa of noise on a mu of
         2.5e-6 -- a part in 1e3.  The step has to be large enough that the
         solver's own tolerance is negligible against it. */
      const Tof = (pp) => bisect((TT) => vdwH(vdwV(pp, TT, a, b), TT, a, b, cv) - h0, 20, 4000, 1e-15);
      const num = d1(Tof, Pb * BAR, Pb * BAR * 2e-3);
      rel(num, jtCoef(v0, T, a, b, cv), 1e-6,
          '(dT/dP)_h matches the closed form at ' + Pb + ' bar, ' + T + ' K, off a constant-h path');
    }
    /* the dilute limit */
    for (const T of [200, 300, 600]){
      const v = 1e4, w = (v - b) * (v - b);
      rel((2 * a * w / (v * v) - R_GAS * T * b) / (R_GAS * T - 2 * a * w / (v * v * v)),
          jtDilute(T, a, b), 1e-7, 'cp*mu -> 2a/RT - b as v -> infinity, at T=' + T);
    }
    /* the inversion locus: mu must vanish on it, and the reduced form must hold */
    let worstP = 0, nInv = 0;
    const Tc = 8 * a / (27 * R_GAS * b), Pc = a / (27 * b * b);
    for (let i = 0; i <= 300; i++){
      const vr = 0.4 * Math.pow(150 / 0.4, i / 300), v = 3 * b * vr;
      const Ti = vdwInvT(v, a, b), Pi = vdwP(v, Ti, a, b);
      const mu = jtCoef(v, Ti, a, b, cv);
      ok(Math.abs(mu) < 1e-18, 'mu vanishes on the inversion locus at v/vc=' + vr.toFixed(3));
      if (Pi > 0){
        const pred = vdwInvPr(Ti / Tc);
        worstP = Math.max(worstP, Math.abs(Pi / Pc - pred)); nInv++;
      }
      if (i > 3) break;                 /* four samples is enough for the loop above */
    }
    for (let i = 0; i <= 300; i++){
      const vr = 0.4 * Math.pow(150 / 0.4, i / 300), v = 3 * b * vr;
      const Ti = vdwInvT(v, a, b), Pi = vdwP(v, Ti, a, b);
      if (Pi <= 0) continue;
      worstP = Math.max(worstP, Math.abs(Pi / Pc - vdwInvPr(Ti / Tc)));
      nInv++;
    }
    ok(nInv > 100 && worstP < 1e-9, 'the parametric inversion locus IS '
      + 'P_r = 24 sqrt(3T_r) - 12T_r - 27 over ' + nInv + ' points (worst ' + worstP + ')');
    close(bisect((t) => vdwInvPr(t), 0.4, 2.0, 1e-15), REF.invroots[0], 1e-11,
          'the reduced inversion curve meets P_r = 0 at T_r = 3/4 (scipy)');
    close(bisect((t) => vdwInvPr(t), 3.5, 20, 1e-15), REF.invroots[1], 1e-11,
          'and again at T_r = 27/4 (scipy)');
    const tp = bisect((t) => d1(vdwInvPr, t, 1e-6), 1.5, 6.0, 1e-14);
    close(tp, 3.0, 1e-6, 'the inversion curve peaks at T_r = 3');
    close(vdwInvPr(3.0), 9.0, 1e-12, 'and at P_r = 9');
    close(2 * a / (R_GAS * b) / Tc, 6.75, 1e-12, 'zero-pressure inversion is exactly 6.75 Tc');
  }
  /* the independent Python van der Waals implementation */
  for (const [gk, Pb, T, mu] of REF.jt){
    const F = FLUID[gk], vd = vdwFromCritical(F.Tc, F.Pc * BAR);
    const v = vdwV(Pb * BAR, T, vd.a, vd.b);
    rel(jtCoef(v, T, vd.a, vd.b, 2.5 * R_GAS) * BAR, mu, 1e-8,
        'mu for ' + gk + ' at ' + Pb + ' bar, ' + T + ' K matches Python (scipy)');
  }

  /* ---------------- free expansion ---------------- */
  {
    const a = 0.1358, b = 3.64e-5, cv = 2.5 * R_GAS, v1 = 1e-3, v2 = 1e-2, T1 = 300;
    const T2 = freeExpandT(v1, T1, v2, a, cv);
    rel(vdwU(v2, T2, a, b, cv), vdwU(v1, T1, a, b, cv), 1e-13,
        'free expansion conserves internal energy, by construction');
    ok(T2 < T1, 'a van der Waals gas cools on free expansion');
    close(freeExpandT(v1, T1, v2, 0, cv), T1, 1e-13,
          'and with a = 0 -- an ideal gas -- it does not change temperature at all');
    const dS = freeExpandS(v1, T1, v2, T2, a, b, cv);
    ok(dS > 0, 'free expansion generates entropy though no heat crossed the boundary');
    rel(freeExpandS(v1, T1, v2, T1, 0, 0, cv), R_GAS * Math.log(v2 / v1), 1e-13,
        'and for an ideal gas that entropy is exactly R ln(v2/v1)');
    const Tr = revExpandT(v1, T1, v2, a, b, cv);
    close(vdwS(v2, Tr, a, b, cv), vdwS(v1, T1, a, b, cv), 1e-10,
          'the reversible path really is isentropic');
    ok(T1 - Tr > 20 * (T1 - T2), 'and it cools the gas far more than bursting the partition does '
      + '(' + (T1 - Tr).toFixed(2) + ' K against ' + (T1 - T2).toFixed(2) + ' K)');
    /* the ideal reversible adiabat, for the same comparison */
    rel(revExpandT(v1, T1, v2, 0, 0, cv), adiabatT(T1, v1, v2, 1 + R_GAS / cv), 1e-9,
        'with a = b = 0 the reversible path is the textbook adiabat');
  }

  /* ---------------- the atmosphere ---------------- */
  {
    rel(airMolarMass(), 0.0289647, 2e-4, 'dry air molar mass built from composition');
    ok(CPD_REF > 1000 && CPD_REF < 1012, 'cp of dry air at 0 C is ' + CPD_REF.toFixed(2)
      + ' J/kg/K, from NIST per-gas values');
    rel(RD_AIR, R_GAS / airMolarMass(), 1e-15, 'R_d = R / M_air');
    rel(KAPPA_AIR, RD_AIR / CPD_REF, 1e-15, 'kappa = R_d / cp');
    rel(lapseDry(), G0 / CPD_REF, 1e-15, 'the dry lapse rate is g/cp and nothing else');
    ok(Math.abs(lapseDry() * 1000 - 9.75) < 0.06,
       'and comes out at ' + (lapseDry() * 1000).toFixed(4) + ' K/km');
    /* the ideal-diatomic value the textbooks quote is a DIFFERENT number, and
       knowing why is the point */
    const idl = G0 / (3.5 * RD_AIR) * 1000;
    ok(Math.abs(idl - 9.7614) < 0.002, 'the quoted 9.76 K/km assumes cp = 7R/2 exactly ('
      + idl.toFixed(4) + ' K/km)');
    ok(Math.abs(idl - lapseDry() * 1000) > 0.005, 'and it is not the same as the measured-cp '
      + 'value -- so this test distinguishes them');
    /* theta is conserved on a dry adiabat, and only there */
    /* The hydrostatic equation with a CONSTANT lapse rate has a closed
       solution, p = p0 (T/T0)^(g/(R_d Gamma)), and using it here means this
       test measures theta rather than measuring an Euler integrator.  A
       first-order walk at 10 m steps leaves 1.3e-2 K of drift, which is a
       hundred times the thing being looked for. */
    for (const lap of [lapseDry(), 0.0065, 0.0]){
      let th0 = null, spread = 0;
      const T0 = 300, p0 = 1.0, n = 300;
      for (let i = 0; i <= n; i++){
        const z = 3000 * i / n;
        const T = T0 - lap * z;
        const p = lap > 0 ? p0 * Math.pow(T / T0, G0 / (RD_AIR * lap))
                          : p0 * Math.exp(-G0 * z / (RD_AIR * T0));
        const t = theta(T, p, 1.0);
        if (th0 === null) th0 = t; else spread = Math.max(spread, Math.abs(t - th0));
      }
      if (lap === lapseDry())
        ok(spread < 1e-9, 'theta is constant on the dry adiabat (spread ' + spread.toExponential(2) + ' K)');
      else
        ok(spread > 5, 'and NOT constant at ' + (lap * 1000).toFixed(2)
          + ' K/km (spread ' + spread.toFixed(2) + ' K) -- so the test above is not vacuous');
    }
    /* the identity that makes theta a stability diagnostic */
    for (const [T, p, lap] of [[290, 0.9, 0.0060], [250, 0.5, 0.0098], [300, 1.0, 0.0]]){
      const dz = 1e-3;
      const th = (z) => {
        const TT = T - lap * z, pp = p * Math.exp(-G0 * z / (RD_AIR * T));
        return theta(TT, pp, 1.0);
      };
      const num = d1(th, 0, dz);
      const cl = (theta(T, p, 1.0) / T) * (-lap + G0 / CPD_REF);
      rel(num, cl, 2e-5, 'dtheta/dz = (theta/T)(dT/dz + g/cp) at T=' + T + ', lapse=' + lap);
    }
    /* dryLift against the closed-form power law */
    {
      const s = dryLift(300, 1.0, 0, 2000, 400);
      rel(s.T, adiabatTfromP(300, 1.0, s.p, 1 / (1 - KAPPA_AIR)), 2e-6,
          'the lifted parcel lands on T P^(kappa) = const');
      const sv = dryLift(300, 1.0, 0, 2000, 400, true);
      ok(Math.abs(sv.T - s.T) < 0.6 && Math.abs(sv.T - s.T) > 1e-4,
         'using cp(T) instead of the reference value shifts the 2 km parcel by '
         + Math.abs(sv.T - s.T).toFixed(4) + ' K -- small, real, and reported rather than hidden');
    }
    /* saturation vapour pressure, and the Clausius-Clapeyron branch below the data */
    close(esatBar(SATH2O.T[0]), SATH2O.es[0], 1e-12, 'e_s at the first tabulated row is that row');
    rel(esatBar(273.16), 0.00611657, 2e-4, 'e_s at the triple point is 6.117 mbar (NIST)');
    for (const T of [240, 253.15, 265]){
      const hh = 0.02;
      rel(d1((t) => Math.log(esatBar(t)), T, hh), LvAt(T) / (R_GAS * T * T), 3e-5,
          'the sub-freezing branch satisfies d ln e_s/dT = L/(RT^2) at ' + T + ' K');
    }
    ok(esatBar(253.15) < esatBar(273.15) && esatBar(253.15) > 0,
       'and it falls, and stays positive');
    rel(LvAt(273.16) / M_H2O, 2.5009e6, 1e-3, 'latent heat at 0 C is 2.50 MJ/kg (NIST h_v - h_l)');
    /* the moist lapse rate */
    for (const [T, p] of [[300, 1.0], [280, 0.9], [260, 0.6]]){
      const gm = lapseMoist(T, p) * 1000;
      ok(gm > 0 && gm < lapseDry() * 1000,
         'the saturated lapse rate at ' + T + ' K, ' + p + ' bar is ' + gm.toFixed(3)
         + ' K/km -- positive and below the dry rate');
    }
    ok(lapseMoist(220, 1.0) * 1000 > 9.4, 'and it approaches the dry rate when the air is too '
      + 'cold to hold water (' + (lapseMoist(220, 1.0) * 1000).toFixed(3) + ' K/km)');
    ok(lapseMoist(300, 1.0) < lapseMoist(280, 1.0), 'warm saturated air cools more slowly than '
      + 'cool saturated air, because there is more water in it');
    /* Everything above this point is a RANGE, a LIMIT or a MONOTONICITY, and a
       mutation sweep proved that none of them pins the value: dropping the
       0.622 out of the mixing ratio and swapping R_v for R_d in the saturated
       lapse rate both survived a 343-assertion suite.  The first cancels out of
       the LCL entirely (both sides of that comparison scale together) and
       neither disturbs any bound.  Two absolute checks follow. */
    {
      /* (1) the mixing ratio, from first principles rather than from eps.  A
         mole of moist air at partial pressures e and p-e holds e/p moles of
         water and (p-e)/p moles of dry air, so the MASS ratio is
         e*M_H2O / ((p-e)*M_air).  Nothing here calls epsWater(). */
      let worst = 0;
      for (const [Tc2, p] of [[20, 1.0], [0, 1.0], [35, 0.9], [-10, 0.7]]){
        const e = esatBar(Tc2 + T0C);
        const firstPrinciples = (e * M_H2O) / ((p - e) * airMolarMass());
        worst = Math.max(worst, Math.abs(mixRatio(e, p) / firstPrinciples - 1));
      }
      ok(worst < 1e-12, 'the mixing ratio equals e*M_H2O/((p-e)*M_air) exactly -- which is what '
         + 'fixes the 0.622, and it cancels out of the LCL so nothing else can');
      close(epsWater(), M_H2O / airMolarMass(), 1e-15, 'and eps is that mass ratio');
      /* and the absolute value at one stated condition */
      close(mixRatio(esatBar(293.15), 1.0), 0.0148992, 2e-5,
            'saturation mixing ratio at 20 C, 1 bar is 14.90 g/kg');
    }
    {
      /* (2) the saturated lapse rate against a route that does NOT substitute
         dr_s/dT = L r_s/(R_v T^2).  Differentiate r_s numerically instead and
         solve the saturated first law cp dT + L dr_s + g dz = 0 for dT/dz.
         The two agree to 2%, and the residual is the e_s << p approximation
         inside the substitution -- which is why the disagreement is largest at
         310 K, where e_s/p is 6%, and smallest at 253 K, where it is 0.1%. */
      const numeric = (T, p) => {
        const h = 0.02, hp = p * 1e-4;
        const drdT = (mixRatio(esatBar(T + h), p) - mixRatio(esatBar(T - h), p)) / (2 * h);
        const drdp = (mixRatio(esatBar(T), p + hp) - mixRatio(esatBar(T), p - hp)) / (2 * hp);
        const dpdz = -p * G0 / (RD_AIR * T);
        const L = LvAt(T) / M_H2O;
        return (G0 + L * drdp * dpdz) / (CPD_REF + L * drdT);
      };
      let worst = 0, at = '';
      for (const [T, p] of [[310, 1.0], [300, 1.0], [290, 1.0], [280, 0.9],
                            [273.15, 1.0], [263, 0.8], [253, 0.6]]){
        const e = Math.abs(lapseMoist(T, p) / numeric(T, p) - 1);
        if (e > worst){ worst = e; at = T + ' K, ' + p + ' bar'; }
      }
      ok(worst < 0.025, 'the saturated lapse rate agrees with a numerically-differentiated '
         + 'route to ' + (100 * worst).toFixed(2) + '% (worst at ' + at + ')');
      /* and the two must AGREE BEST where the approximation is best, or the
         agreement is a coincidence rather than the approximation working */
      const eHot = Math.abs(lapseMoist(310, 1.0) / numeric(310, 1.0) - 1);
      const eCold = Math.abs(lapseMoist(253, 0.6) / numeric(253, 0.6) - 1);
      ok(eHot > 5 * eCold, 'and they part company where e_s/p is large ('
         + (100 * eHot).toFixed(2) + '% at 310 K against ' + (100 * eCold).toFixed(3)
         + '% at 253 K) -- the residual is the e_s << p step, not noise');
    }
    /* the LCL is where the parcel first saturates -- assert the definition */
    {
      const l = lclLevel(310, 285, 0.95, 700);
      ok(isFinite(l.z) && l.z > 700, 'the LCL is found above the surface');
      const r0 = mixRatio(esatBar(285), 0.95), rl = mixRatio(esatBar(l.T), l.p);
      rel(rl, r0, 1e-7, 'and the mixing ratio there equals the surface value -- the definition');
      const dry = lclLevel(310, 250, 0.95, 700), wet = lclLevel(310, 308, 0.95, 700);
      ok(dry.z > wet.z, 'drier air has a higher cloud base');
      /* An independent route to the same quantity.  Bolton (1980) eq. 15 is an
         empirical fit and is written out here from memory -- which on its own
         would be worthless.  What makes this an assertion is that the two
         routes are unrelated: a first-principles lift-until-saturated and a
         published curve fit have no way of agreeing to a few hundredths of a
         kelvin unless BOTH are right, so a disagreement would convict one of
         them and the tolerance is set well outside the fit's own accuracy. */
      let worstB = 0;
      for (const [T, Td] of [[303.15, 293.15], [310.15, 283.15], [293.15, 288.15],
                             [313.15, 268.15], [288.15, 286.15]]){
        const l = lclLevel(T, Td, 1.0, 0);
        const bolton = 1 / (1 / (Td - 56) + Math.log(T / Td) / 800) + 56;
        worstB = Math.max(worstB, Math.abs(l.T - bolton));
      }
      ok(worstB < 0.5, 'the LCL computed by definition agrees with Bolton (1980) eq. 15 to '
         + worstB.toFixed(3) + ' K over five soundings -- two unrelated routes');
    }
    {
      /* e_s the same way: the Magnus form is a fit, this file integrates
         Clausius-Clapeyron below the triple point, and the sub-freezing points
         are exactly where the integration could have gone wrong unnoticed. */
      let worstM = 0, worstMlo = 0;
      for (const c of [-25, -20, -10, -5, 0, 10, 20, 30, 40]){
        const mine = esatBar(c + T0C) * 1000;
        const mag = 6.112 * Math.exp(17.67 * c / (c + 243.5));
        const e = Math.abs(mine / mag - 1);
        worstM = Math.max(worstM, e);
        if (c < 0) worstMlo = Math.max(worstMlo, e);
      }
      ok(worstM < 0.01, 'e_s agrees with the Magnus form to '
         + (100 * worstM).toFixed(2) + '% from -25 to +40 C');
      ok(worstMlo < 0.01, 'and to ' + (100 * worstMlo).toFixed(2) + '% BELOW freezing, where '
         + 'this file is integrating Clausius-Clapeyron rather than reading the table');
    }
  }

  /* ---------------- the speed of sound ---------------- */
  {
    for (const g of [5 / 3, 1.4, 1.289]) for (const T of [200, 300])
      rel(soundLaplace(g, T, 0.028) / soundNewton(T, 0.028), Math.sqrt(g), 1e-14,
          'Laplace / Newton = sqrt(gamma) exactly, at g=' + g);
    close(soundLaplace(1.4, T0C, 0.0289647), 331.3, 0.1,
          'dry air at 0 C: 331.3 m/s with gamma = 1.4');
    ok(soundNewton(T0C, 0.0289647) < 281 && soundNewton(T0C, 0.0289647) > 279,
       'Newton\'s isothermal figure is 280 m/s -- 15.5% low');
    /* the measured sound speed must be reproduced by sqrt(kappa P v / M) */
    let worst = 0, n = 0;
    for (const gk of Object.keys(REF.sound300)){
      const [T, w, gam] = REF.sound300[gk], F = FLUID[gk], b = ISOBAR[gk];
      if (!F || !F.M || !b) continue;
      const v = interp1(b.T, b.v, T);
      const kap = kappaFromSound(w, 1, v, F.M);
      /* at 1 bar the gas is nearly ideal, so kappa should be close to cp/cv */
      worst = Math.max(worst, Math.abs(kap / gam - 1)); n++;
      rel(Math.sqrt(kap * 1 * BAR * v * 1e-3 / F.M), w, 1e-12,
          'kappa inverts the sound speed for ' + gk + ' (round trip)');
    }
    ok(n >= 8 && worst < 0.01, 'at 1 bar the isentropic exponent is within 1% of cp/cv for all '
      + n + ' gases (worst ' + (100 * worst).toFixed(3) + '%)');
    /* dofRigid is displayed beside the measured f and was pinned by nothing:
       a mutant that swapped linear and non-linear molecules survived, because
       the readout is the only place it appears.  Assert it against the
       measurement it is there to be compared with. */
    {
      const M0 = buildModel(Object.assign({}, DEFAULTS, { view: 'gamma', gT: 300 }));
      let nm = 0, nd = 0, np = 0;
      for (const r of M0.gam.rows){
        if (!r.inRange) continue;
        if (r.atoms === 1){
          close(r.dofRigid, 3, 1e-12, r.gas + ': a monatomic gas has 3 modes');
          ok(Math.abs(r.dof - 3) < 0.06, r.gas + ': and measures f = ' + r.dof.toFixed(3)); nm++;
        } else if (r.atoms === 2){
          close(r.dofRigid, 5, 1e-12, r.gas + ': a diatomic rigid rotor has 5');
          ok(Math.abs(r.dof - 5) < 0.09, r.gas + ': and measures f = ' + r.dof.toFixed(3)); nd++;
        } else {
          /* CO2 is LINEAR and so counts 5, not 6 -- and measures 6.8, because
             its bending modes are already partly excited at 300 K.  The excess
             is the assertion: a polyatomic must measure MORE than the rigid
             count, which is only true if the rigid count is right. */
          ok(r.dof > r.dofRigid + 0.3, r.gas + ': measures f = ' + r.dof.toFixed(2)
             + ' against a rigid-rotor count of ' + r.dofRigid + ' -- the excess is vibration');
          np++;
        }
      }
      ok(nm === 5 && nd === 3 && np === 2,
         'five monatomic, three diatomic and two polyatomic gases were classified');
      close(dofRigid({ atoms: 3, linear: 1 }), 5, 1e-12, 'a LINEAR triatomic counts 5, not 6');
      close(dofRigid({ atoms: 3, linear: 0 }), 6, 1e-12, 'and a bent one counts 6');
    }
    /* and the two are NOT the same when the gas is dense */
    {
      const G = EOSGRID.n2, F = FLUID.n2, T = 300, P = 330.5;
      const kap = kappaFromSound(gridAt(G, 'w', T, P), P, gridAt(G, 'v', T, P), F.M);
      const gam = gridAt(G, 'cp', T, P) / gridAt(G, 'cv', T, P);
      ok(Math.abs(kap / gam - 1) > 0.1, 'at 330 bar they differ by '
        + (100 * Math.abs(kap / gam - 1)).toFixed(1) + '% -- which is what "real gas" means');
    }
  }

  /* ---------------- the NIST grid ---------------- */
  {
    const G = EOSGRID.n2;
    let onCol = 0, worst = { s: 0, v: 0, h: 0, cp: 0, w: 0 };
    for (const [T, P, s, v, hh, cp, w, mu] of REF.n2rows){
      const want = { s: s, v: v, h: hh, cp: cp, w: w };
      const onGrid = G.P.indexOf(P) >= 0 && G.T.indexOf(T) >= 0;
      if (onGrid) onCol++;
      for (const k of ['s', 'v', 'h', 'cp', 'w']){
        const got = gridAt(G, k, T, P);
        if (!isFinite(got)) continue;
        const e = Math.abs(got / want[k] - 1);
        if (onGrid) rel(got, want[k], 1e-6, 'gridAt reproduces the raw NIST row exactly on a node ('
          + k + ' at ' + T + ' K, ' + P + ' bar)');
        else worst[k] = Math.max(worst[k], e);
      }
    }
    ok(onCol >= 12, onCol + ' reference rows land on grid nodes and are reproduced exactly');
    ok(worst.s < 1e-3, 'off-node, interpolated entropy is within 1e-3 of the raw table (worst '
      + worst.s.toExponential(2) + ')');
    ok(worst.v < 0.01 && worst.h < 0.01 && worst.cp < 0.02,
       'and v, h, cp within a percent or two (worst ' + worst.v.toExponential(2) + ', '
       + worst.h.toExponential(2) + ', ' + worst.cp.toExponential(2) + ')');
    /* interpolating s LINEARLY in P instead would be a wrong answer, not a
       rounding error -- assert the size of the error the fix removes */
    {
      const j = 0, T = 200;
      const P0 = G.P[0], P1 = G.P[1], Pm = Math.sqrt(P0 * P1);
      const i = G.T.indexOf(T);
      const linear = G.s[i][j] + (G.s[i][j + 1] - G.s[i][j]) * (Pm - P0) / (P1 - P0);
      const good = gridAt(G, 's', T, Pm);
      ok(Math.abs(linear - good) > 0.5, 'linear-in-P interpolation of entropy would be wrong by '
        + Math.abs(linear - good).toFixed(2) + ' J/mol/K in the first cell -- which is why it is '
        + 'interpolated as s + R ln P');
    }
    ok(!isFinite(gridAt(G, 's', 50, 10)), 'gridAt refuses temperatures off the grid');
    ok(!isFinite(gridAt(G, 's', 300, 5000)), 'and pressures off the grid, rather than clamping');
    /* an isentrope really has constant entropy */
    {
      const s0 = gridAt(G, 's', 620, 300.5);
      const c = gridLevelCurve(G, 's', s0, G.P[0], 300.5, 40);
      ok(c.length > 25, 'the isentrope covers the pressure range (' + c.length + ' points)');
      let w2 = 0;
      for (const [P, T] of c) w2 = Math.max(w2, Math.abs(gridAt(G, 's', T, P) - s0));
      ok(w2 < 1e-6, 'and s is constant along it to ' + w2.toExponential(2) + ' J/mol/K');
      /* it must also be monotone: expanding a gas cannot warm it adiabatically */
      let mono = true;
      for (let i = 1; i < c.length; i++) if (c[i][1] < c[i - 1][1] - 1e-9) mono = false;
      ok(mono, 'and the isentrope is monotone in pressure');
    }
    {
      const h0 = gridAt(G, 'h', 300, 300.5);
      const c = gridLevelCurve(G, 'h', h0, G.P[0], 300.5, 30);
      let w2 = 0;
      for (const [P, T] of c) w2 = Math.max(w2, Math.abs(gridAt(G, 'h', T, P) - h0));
      ok(c.length > 20 && w2 < 1e-8, 'h is constant along an isenthalp to ' + w2.toExponential(2));
    }
    /* the sign of mu on the grid must agree with the inversion curve read off it */
    {
      const I = INVCURVE.n2;
      let agree = 0, tested = 0;
      for (let i = 0; i < I.P.length; i += 6){
        const P = I.P[i], Tu = I.Tu[i];
        const below = gridAt(G, 'mu', Tu - 40, P), above = gridAt(G, 'mu', Tu + 40, P);
        if (isFinite(below) && isFinite(above)){ tested++; if (below > 0 && above < 0) agree++; }
      }
      ok(tested >= 3 && agree === tested, 'mu is positive below the inversion curve and negative '
        + 'above it, at all ' + tested + ' pressures tested');
    }
  }

  /* ---------------- the measured inversion curves ---------------- */
  {
    for (const gk of INVGASES){
      const I = INVCURVE[gk], F = FLUID[gk];
      ok(I.P.length > 3 && I.Tu.length === I.P.length, gk + ': the inversion curve has points');
      let mono = true;
      for (let i = 1; i < I.Tu.length; i++) if (I.Tu[i] > I.Tu[i - 1] + 1e-9) mono = false;
      ok(mono, gk + ': the upper inversion branch falls with pressure');
      ok(I.Tu[0] / F.Tc > 3 && I.Tu[0] / F.Tc < 10,
         gk + ': zero-pressure inversion is ' + (I.Tu[0] / F.Tc).toFixed(2) + ' Tc');
    }
    const trs = INVGASES.map(gk => INVCURVE[gk].Tu[0] / FLUID[gk].Tc);
    const lo = Math.min(...trs), hi = Math.max(...trs);
    ok(hi / lo > 1.7, 'the reduced inversion temperature is NOT universal: it runs from '
      + lo.toFixed(2) + ' to ' + hi.toFixed(2) + ' Tc, a spread of ' + (hi / lo).toFixed(2)
      + ', against van der Waals\' single value of 6.75');
    ok(lo < 6.75 && hi > 6.75, 'and 6.75 falls inside that spread, so the model is neither '
      + 'uniformly high nor uniformly low');
    ok(!INVCURVE.ch4, 'methane is absent: NIST\'s EOS for it stops below its inversion '
      + 'temperature, and no number is invented for it');
  }

  /* ---------------- the soundings ---------------- */
  {
    for (const k of SITES){
      const S = SOUNDING[k];
      ok(S.z.length === S.p.length && S.z.length === S.T.length && S.z.length === S.Td.length,
         k + ': the sounding columns are the same length');
      let zmono = true, pmono = true;
      for (let i = 1; i < S.z.length; i++){
        if (S.z[i] <= S.z[i - 1]) zmono = false;
        if (S.p[i] >= S.p[i - 1]) pmono = false;
      }
      ok(zmono, k + ': height increases up the profile');
      ok(pmono, k + ': pressure falls up the profile');
      /* the sonde's own p and z must be consistent with hydrostatic balance */
      let worst = 0;
      for (let i = 1; i < S.z.length; i++){
        const Tm = 0.5 * (S.T[i] + S.T[i - 1]) + T0C;
        const pred = S.p[i - 1] * Math.exp(-G0 * (S.z[i] - S.z[i - 1]) / (RD_AIR * Tm));
        worst = Math.max(worst, Math.abs(pred / S.p[i] - 1));
      }
      ok(worst < 0.02, k + ': p and z obey the hydrostatic equation to '
        + (100 * worst).toFixed(2) + '% -- an independent check on the archive');
    }
    /* the headline measurement */
    {
      const st = Object.assign({}, DEFAULTS, { site: 'tucson' });
      const s = buildSounding(st);
      ok(s.mixTop > 2.5, 'Tucson has a mixed layer ' + s.mixTop.toFixed(2) + ' km deep');
      ok(Math.abs(s.mixLapse - s.lapseDry) < 0.5,
         'and its measured lapse rate ' + s.mixLapse.toFixed(3) + ' K/km sits within 0.5 of '
         + 'g/cp = ' + s.lapseDry.toFixed(3));
      ok(s.mixRms < 1.0, 'with ' + s.mixRms.toFixed(3) + ' K of scatter about the fit');
      const sd = buildSounding(Object.assign({}, DEFAULTS, { site: 'sandiego' }));
      ok(sd.inv.g > 30, 'San Diego has a subsidence inversion of +' + sd.inv.g.toFixed(1)
        + ' K/km -- the opposite sign to an adiabat');
      ok(!(sd.mixTop > 0.5), 'and essentially no mixed layer, so the two sites are genuinely '
        + 'different cases rather than the same picture twice');
      /* The parcel starts at the surface, so its starting pressure IS the
         sounding's -- pinned here because a mutation sweep changed the hPa to
         bar conversion and nothing noticed: the dry lapse rate does not depend
         on pressure, so the temperature profile is unmoved and only the
         condensation level shifts. */
      for (const k of SITES){
        const sn = buildSounding(Object.assign({}, DEFAULTS, { site: k }));
        rel(sn.p0bar, SOUNDING[k].p[0] / 1000, 1e-12, k + ': the parcel starts at the '
            + 'sounding\'s own surface pressure, in bar');
        ok(sn.p0bar > 0.55 && sn.p0bar < 1.05, k + ': and that pressure is '
           + sn.p0bar.toFixed(4) + ' bar -- a surface, not a stratosphere');
        rel(sn.parcel[0].th, theta(sn.Tsfc, sn.p0bar, 1.0), 1e-9,
            k + ': and the parcel leaves with the surface potential temperature');
      }
    }
  }

  /* ---------------- models, panels, corners ---------------- */
  {
    let bad = 0, n = 0, worstMsg = '';
    const check = (o, path) => {
      if (o === null || o === undefined) return;
      if (typeof o === 'number'){ if (!isFinite(o)){ bad++; if (!worstMsg) worstMsg = path; } return; }
      if (Array.isArray(o)){ for (let i = 0; i < o.length; i++) check(o[i], path + '[' + i + ']'); return; }
    };
    for (const [v] of VIEWS) for (const g of GASLIST) for (const site of SITES){
      const st = Object.assign({}, DEFAULTS, { view: v, gas: g, site: site });
      const M = buildModel(st); n++;
      const html = readoutHTML(M);
      if (/NaN|undefined|Infinity/.test(html)){ bad++; if (!worstMsg) worstMsg = v + '/' + g + '/' + site; }
      const [eq, sm] = eqbarText(M);
      if (!eq || !sm || /NaN|undefined/.test(eq + sm)) bad++;
      if (!tagText(M)) bad++;
    }
    ok(bad === 0, n + ' view x gas x site combinations build a clean readout, equation bar and '
      + 'tag (first problem: ' + (worstMsg || 'none') + ')');
  }
  {
    /* every slider, at both ends and in the middle */
    const RANGES = { T1: [120, 900], P1bar: [0.2, 20], vratio: [1.2, 40], dof: [3, 9],
                     feRatio: [1.5, 60], thrT: [60, 900], thrP: [1, 400], ztop: [1.5, 7],
                     parcelDT: [-3, 6], gT: [80, 1000], rT: [200, 690], rP: [30, 400] };
    let bad = 0, n = 0, first = '';
    for (const key of Object.keys(RANGES)){
      const [lo, hi] = RANGES[key];
      for (const val of [lo, 0.5 * (lo + hi), hi]){
        for (const [v] of VIEWS){
          const st = Object.assign({}, DEFAULTS, { view: v }); st[key] = val;
          n++;
          try {
            const M = buildModel(st);
            if (/NaN|undefined|Infinity/.test(readoutHTML(M))){ bad++; if (!first) first = key + '=' + val + ' in ' + v; }
          } catch (e){ bad++; if (!first) first = key + '=' + val + ' in ' + v + ': ' + e; }
        }
      }
    }
    ok(bad === 0, n + ' slider corners produce finite models and clean readouts (first problem: '
      + (first || 'none') + ')');
  }
  {
    /* the boolean toggles, all of them, on every view */
    const FLAGS = ['measuredGamma', 'showIso', 'showAdi', 'showWork', 'feReal', 'showRev',
                   'showVdw', 'showMeas', 'reduced', 'showMoist', 'showTheta', 'showEnv',
                   'showEquip', 'showSound'];
    let bad = 0, n = 0;
    for (const f of FLAGS) for (const val of [true, false]) for (const [v] of VIEWS){
      const st = Object.assign({}, DEFAULTS, { view: v }); st[f] = val; n++;
      try { const M = buildModel(st); if (/NaN|undefined/.test(readoutHTML(M))) bad++; }
      catch (e){ bad++; }
    }
    ok(bad === 0, n + ' toggle settings build cleanly');
  }
  {
    /* the model must actually respond to its inputs -- a readout that never
       changes would pass every test above */
    const base = buildModel(Object.assign({}, DEFAULTS));
    const hot  = buildModel(Object.assign({}, DEFAULTS, { T1: 600 }));
    ok(Math.abs(hot.T2ad - base.T2ad) > 50, 'the piston model responds to the start temperature');
    const wide = buildModel(Object.assign({}, DEFAULTS, { vratio: 20 }));
    ok(wide.T2ad < base.T2ad - 20, 'and to the expansion ratio');
    const he = buildModel(Object.assign({}, DEFAULTS, { gas: 'he' }));
    ok(Math.abs(he.gamma - base.gamma) > 0.2, 'and to the choice of gas');
    const idf = buildModel(Object.assign({}, DEFAULTS, { measuredGamma: false, dof: 3 }));
    close(idf.gamma, 5 / 3, 1e-12, 'and to f when gamma is not being measured');
  }

  /* ---------------- drawing conventions ---------------- */
  {
    /* tickfmt's contract, asserted directly rather than through a layout
       consequence: a label must not carry more decimals than the tick spacing
       distinguishes.  "318.00" is 33 px at 10.5 px and six of them do not fit
       in a 210 px panel -- but once the tick COUNT was also reduced, the
       overlap stopped happening and the formatter became untested. */
    ok(tickfmt([0, 100, 200, 300])(200) === '200', 'integer-spaced ticks print no decimals');
    ok(tickfmt([250, 300, 350])(300) === '300', 'and neither do 50 K steps');
    ok(tickfmt([0, 0.5, 1])(0.5) === '0.5', 'half-unit ticks print one decimal');
    ok(tickfmt([0, 0.02, 0.04])(0.02) === '0.02', 'and hundredths print two');
    ok(tickfmt([1.4, 1.45, 1.5])(1.45) === '1.45', 'a gamma axis prints two');
    ok(tickfmt([0, 2, 4])(2).length <= 1, 'a 2-unit spacing yields a one-character label');
    /* and the widest label an axis actually emits must stay narrow */
    let widest = 0, wat = '';
    for (const [lo, hi, n] of [[0, 400, 6], [0, 1500, 5], [120, 700, 6], [1.15, 1.72, 5],
                               [-40, 40, 6], [0, 0.06, 4]]){
      const t = ticksN(lo, hi, n), f = tickfmt(t);
      for (const x of t) if (f(x).length > widest){ widest = f(x).length; wat = f(x); }
    }
    ok(widest <= 6, 'the widest tick label any axis in this file emits is "' + wat + '"');
  }
  ok(plain('a &mdash; b') === 'a — b', 'plain() decodes the entities this file uses');
  ok(!/[<>]/.test(plain('x')), 'plain() leaves ordinary text alone');
  {
    ok(ticksFor(1, 10, 5).length >= 4, 'ticksFor gives several ticks on an ordinary range');
    ok(ticksFor(10, 1, 5).length === 1, 'and collapses on an unsorted one -- which is why axes() '
      + 'sorts before asking');
  }
  {
    /* no view reads the zoom, so the wheel genuinely cannot do anything --
       assert that rather than "the picture did not change", which would pass
       even if a view started reading it */
    const src = String(viewPiston) + String(viewFree) + String(viewThrottle)
              + String(viewParcel) + String(viewGamma) + String(viewReal);
    ok(src.indexOf('S.zoom') < 0 && src.indexOf('.zoom') < 0,
       'no view reads a zoom, so ignoring the wheel is a property of the file rather than a habit');
  }
  {
    /* every view must actually emit drawing operations, for every gas */
    const rec = makeTestRecorder();
    let bad = 0, n = 0, minOps = 1e9;
    for (const [v] of VIEWS) for (const g of ['n2', 'he', 'co2']) for (const site of SITES){
      const st = Object.assign({}, DEFAULTS, { view: v, gas: g, site: site });
      rec.reset();
      try { drawView(rec.ctx, 1100, 700, buildModel(st), { zoom: 1 }); }
      catch (e){ bad++; console.log('  draw threw in ' + v + '/' + g + ': ' + e); continue; }
      n++;
      minOps = Math.min(minOps, rec.ops.length);
      for (const o of rec.ops){
        if (o.op === 'fillText' && /&\w+;|<\w+>|NaN|undefined/.test(o.a[0])){
          bad++; console.log('  bad text in ' + v + ': ' + o.a[0]);
        }
        if ((o.op === 'lineTo' || o.op === 'moveTo' || o.op === 'fillRect')
            && o.a.some(x => typeof x === 'number' && !isFinite(x))){
          bad++; console.log('  non-finite coordinate in ' + v);
        }
      }
    }
    ok(bad === 0, n + ' view renders emit no entity, no NaN text and no non-finite coordinate');
    /* Canvas will happily draw a glyph the font does not have, as an empty box.
       "T꜀" looked like a subscript c and is U+A700, MODIFIER LETTER CHINESE TONE
       YIN PING; it rendered as tofu in two views and no check saw it, because it
       is neither an entity nor a tag.  Everything drawn here should be Latin-1,
       Greek, sub/superscript digits or the handful of maths signs listed. */
    const SAFE = '—–’‘“”·×→←↑↓°±≈∫∂√ΔΓΘΛΣΦΩ' +
                 'αβγδεζηθκλμνξπρστυφχψω' +
                 '₀₁₂₃₄₅₆₇₈₉⁰¹²³⁴⁵⁶⁷⁸⁹⁻′″∞≤≥≠−½⅓¼';
    let odd = '', oddN = 0;
    rec.reset();
    /* the toggled states too: the reduced-coordinate plot is a different
       function behind a checkbox, and a glyph mutant planted in it survived a
       sweep because the default state never draws it */
    const TOG = [{}, { reduced: true }, { showSound: false }, { showTheta: false },
                 { showMoist: false }, { measuredGamma: false }, { feReal: false }];
    for (const [v] of VIEWS) for (const g of ['n2', 'he', 'ch4']) for (const tg of TOG){
      rec.reset();
      try { drawView(rec.ctx, 1100, 700,
              buildModel(Object.assign({}, DEFAULTS, { view: v, gas: g }, tg)), { zoom: 1 }); }
      catch (e){ continue; }
      for (const o of rec.ops){
        if (o.op !== 'fillText') continue;
        for (const ch of String(o.a[0])){
          if (ch.charCodeAt(0) > 127 && SAFE.indexOf(ch) < 0){
            oddN++; if (!odd) odd = ch + ' (U+' + ch.charCodeAt(0).toString(16).toUpperCase() + ')';
          }
        }
      }
    }
    ok(oddN === 0, 'no glyph outside the ASCII + Greek + sub/superscript set reaches fillText'
       + (odd ? ' (found ' + odd + ')' : ''));
    ok(minOps > 60, 'and every one of them draws something (fewest operations: ' + minOps + ')');
  }

  /* ---------------- assertions about the DRAWING, not the formula ----------
   * Two defects here were invisible to every numeric test and were found by
   * looking at a PNG: the piston cylinders drew the volume BEFORE the
   * expansion under a label describing the state after it, and the sound-speed
   * bars are the only place the sqrt(gamma) factor is visible as a length.
   * These pin the picture. */
  {
    const rec = makeTestRecorder();
    const st = Object.assign({}, DEFAULTS, { view: 'gamma', showSound: true, gT: 300 });
    const M = buildModel(st);
    drawView(rec.ctx, 1400, 820, M, { zoom: 1 });
    /* the bar chart emits, per gas, a Newton rect then a Laplace rect stacked
       on it; find pairs sharing an x and check the heights are in ratio
       sqrt(gamma) - 1 : 1  (the green piece is the DIFFERENCE) */
    const rects = rec.ops.filter(o => o.op === 'fillRect');
    const byX = {};
    for (const r of rects){ const k = Math.round(r.a[0]); (byX[k] = byX[k] || []).push(r); }
    let pairs = 0, worst = 0;
    for (const k of Object.keys(byX)){
      const g = byX[k];
      if (g.length !== 2) continue;
      const hN = Math.max(g[0].a[3], g[1].a[3]), hL = Math.min(g[0].a[3], g[1].a[3]);
      if (!(hN > 4)) continue;
      /* the tall one is Newton (0 -> cN), the short one is cL - cN */
      const ratio = (hN + hL) / hN;
      pairs++;
      let best = 1e9;
      for (const r of M.gam.rows) if (r.inRange && isFinite(r.w))
        best = Math.min(best, Math.abs(ratio - Math.sqrt(r.gamma)));
      worst = Math.max(worst, best);
    }
    ok(pairs >= 8, 'the sound panel draws a stacked pair for ' + pairs + ' gases');
    ok(worst < 0.02, 'and each pair\'s total/Newton height is that gas\'s sqrt(gamma) to '
       + worst.toFixed(4) + ' -- the factor Newton missed, drawn as a length');
  }
  {
    /* the cylinder must show the FINAL volume, with the start marked inside it */
    const rec = makeTestRecorder();
    const st = Object.assign({}, DEFAULTS, { view: 'piston', vratio: 5 });
    drawView(rec.ctx, 1400, 820, buildModel(st), { zoom: 1 });
    const fills = rec.ops.filter(o => o.op === 'fillRect' && o.a[3] > 30 && o.a[2] > 40);
    ok(fills.length >= 2, 'the piston view draws two gas-filled cylinders');
    if (fills.length >= 2){
      /* the dashed start line is a moveTo/lineTo pair inside the fill */
      const gasW = fills[0].a[2], x0 = fills[0].a[0];
      const verts = rec.ops.filter(o => o.op === 'moveTo'
        && o.a[0] > x0 && o.a[0] < x0 + gasW);
      ok(verts.length >= 1, 'with a start-volume mark inside the gas');
      let found = false;
      for (const v of verts) if (Math.abs((v.a[0] - x0) / gasW - 1 / 5) < 0.12) found = true;
      ok(found, 'and that mark sits at v1/v2 of the way along -- so the barrel is the '
         + 'FINAL volume and the line is where the gas started, not the other way round');
    }
  }

  {
    /* a legend must not name a curve the view did not draw */
    for (const g of ['ch4', 'n2', 'he', 'o2']){
      const M = buildModel(Object.assign({}, DEFAULTS, { view: 'throttle', gas: g }));
      const rec = makeTestRecorder();
      drawView(rec.ctx, 1400, 820, M, { zoom: 1 });
      const txt = rec.ops.filter(o => o.op === 'fillText').map(o => o.a[0]).join(' | ');
      /* match the LEGEND label, not the word: the footnote explains what an
         isenthalp is and contains the word on every view */
      const claims = /isenthalps . the throttling paths/.test(txt);
      ok(claims === (M.thr.isenthalps.length > 0),
         g + ': the legend mentions isenthalps exactly when some were drawn');
      const claimsMeas = /measured \(NIST/.test(txt);
      ok(claimsMeas === (M.thr.measUpper.length > 0),
         g + ': and mentions a measured curve exactly when there is one');
    }
  }

  {
    /* no DATA curve may pass through a legend.  Gridlines are drawn at
       lineWidth 1 and data at 1.5 or more, which is what separates them. */
    const rec = makeTestRecorder();
    let hits = 0, worst = '';
    /* the toggled states too -- the reduced-coordinate plot is a different
       function behind a checkbox, and a legend planted back on top of its
       curves survived this very check until the toggles were added */
    const LTOG = [{}, { reduced: true }, { showSound: false }, { showTheta: false },
                  { showMoist: false }, { feReal: false }];
    for (const [v] of VIEWS) for (const g of ['n2', 'he', 'co2', 'ch4'])
    for (const site of SITES) for (const tg of LTOG){
      rec.reset();
      const M = buildModel(Object.assign({}, DEFAULTS, { view: v, gas: g, site: site }, tg));
      try { drawView(rec.ctx, 1400, 820, M, { zoom: 1 }); } catch (e){ continue; }
      const boxes = LEGEND_BOXES.slice();
      if (!boxes.length) continue;
      let own = 0;
      for (const bx of boxes) own += bx.own;
      let n = 0;
      for (const o of rec.ops){
        if (o.op !== 'lineTo' && o.op !== 'moveTo') continue;
        if (!(o.lw >= 1.5)) continue;
        for (const bx of boxes){
          if (o.a[0] >= bx.x && o.a[0] <= bx.x + bx.w
           && o.a[1] >= bx.y && o.a[1] <= bx.y + bx.h){ n++; break; }
        }
      }
      /* every vertex beyond the legend's own key marks is a curve crossing it */
      if (n - own > 0){ hits++; if (!worst) worst = v + '/' + g + '/' + site
                                    + ' (' + (n - own) + ' stray vertices)'; }
    }
    ok(hits === 0, 'no data curve passes through a legend, over every view x gas x site'
       + (worst ? ' -- worst ' + worst : ''));
  }

  {
    /* Layout, inside selfTest.  tools/audit.py already does this and does it
       better, but it is a separate program that a mutation sweep does not run
       -- so mutants that broke the caption measurement and the tick formatter
       both survived a full physics suite.  This is the cheap version: no text
       may leave the canvas, and no two text boxes on a line may overlap. */
    const rec = makeTestRecorder();
    let off = 0, over = 0, worstOff = '', worstOver = '';
    for (const [W, H] of [[1400, 820], [1100, 700], [820, 560], [640, 430]]){
      for (const [v] of VIEWS){
        for (const extra of [{}, { reduced: true }, { showSound: false }, { showTheta: false }]){
          rec.reset();
          const st = Object.assign({}, DEFAULTS, { view: v }, extra);
          try { drawView(rec.ctx, W, H, buildModel(st), { zoom: 1 }); } catch (e){ continue; }
          const boxes = [];
          for (const o of rec.ops){
            if (o.op !== 'fillText' || o.rot) continue;   /* rotated: frame is not canvas */
            const s = String(o.a[0]);
            const fs = parseFloat((/(\d+(?:\.\d+)?)px/.exec(o.font || '') || [0, 10])[1]);
            const w = s.length * fs * 0.52;
            let x = o.a[1];
            if (o.align === 'center') x -= w / 2; else if (o.align === 'right') x -= w;
            const y = o.a[2] - (o.baseline === 'top' ? 0 : fs * 0.8);
            if (x < -6 || x + w > W + 6 || y < -6 || y + fs > H + 6){
              off++; if (!worstOff) worstOff = v + ' @' + W + 'x' + H + ': "' + s.slice(0, 40) + '"';
            }
            boxes.push({ x, y, w, h: fs * 1.15, s });
          }
          for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++){
            const a = boxes[i], b = boxes[j];
            if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h){
              over++;
              if (!worstOver) worstOver = v + ' @' + W + 'x' + H + ': "'
                + a.s.slice(0, 26) + '" vs "' + b.s.slice(0, 26) + '"';
            }
          }
        }
      }
    }
    ok(off === 0, 'no text leaves the canvas at any of four sizes' + (worstOff ? ' -- ' + worstOff : ''));
    ok(over === 0, 'and no two text boxes overlap' + (worstOver ? ' -- ' + worstOver : ''));
  }

  console.log(pass + ' passed, ' + fail + ' failed');
  if (fail > 0) throw new Error(fail + ' self-test failure(s)');
  return true;
}

/* A canvas stub that records what was asked for.  Deliberately NOT called
   makeRecorder: tools/recorder.js declares a function of that name and is
   concatenated after this file for the display-list capture, so the two would
   silently shadow each other rather than fail. */
function makeTestRecorder(){
  const ops = [];
  const noop = () => {};
  /* A rotation stack.  axes() draws its y-axis title inside
     save/translate/rotate/restore, so the x,y it passes to fillText are in a
     rotated frame and mean nothing in canvas coordinates -- reporting them as
     off-canvas is how the layout check first "failed" on correct code.
     tools/audit.py skips rotated text for the same reason. */
  let rot = 0; const stack = [];
  const ctx = {
    ops: ops,
    save(){ stack.push(rot); }, restore(){ rot = stack.length ? stack.pop() : 0; },
    beginPath: noop, closePath: noop, stroke: noop,
    fill: noop, clip: noop, setLineDash: noop, translate: noop,
    rotate(a){ rot += a; },
    scale: noop, setTransform: noop, arc: (...a) => ops.push({ op: 'arc', a }),
    moveTo: (...a) => ops.push({ op: 'moveTo', a, lw: ctx.lineWidth }),
    lineTo: (...a) => ops.push({ op: 'lineTo', a, lw: ctx.lineWidth }),
    rect: (...a) => ops.push({ op: 'rect', a }),
    fillRect: (...a) => ops.push({ op: 'fillRect', a }),
    strokeRect: (...a) => ops.push({ op: 'strokeRect', a }),
    clearRect: noop,
    fillText: (...a) => ops.push({ op: 'fillText', a, font: ctx.font, fill: ctx.fillStyle,
                                   align: ctx.textAlign, baseline: ctx.textBaseline,
                                   rot: Math.abs(rot) > 1e-9 }),
    measureText: (s) => ({ width: String(s).length * 6.0 }),
    createLinearGradient: () => ({ addColorStop: noop }),
    font: '', fillStyle: '', strokeStyle: '', lineWidth: 1, textAlign: 'left',
    textBaseline: 'alphabetic', globalAlpha: 1, lineJoin: '', lineCap: '',
  };
  return { ctx, ops, reset(){ ops.length = 0; } };
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
