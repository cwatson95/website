    +'<span class="sm">Luminary 099’s landing guidance every 2 s: the acceleration that carries position and velocity onto the pad-loaded targets in the time to go T (q = (T + 2.2 s)/T)</span>';
  if(v==='out'){ const A=W.C.A, mm=lgcProg(W), on=mm===40;
    return '<b>V</b><sub>G</sub> &larr; <b>V</b><sub>G</sub> + <b>b</b> Δt − Δ<b>V</b><sub>PIPA</sub>, &nbsp; ω<sub>c</sub> ∝ <b>V</b><sub>G</sub> × Δ<b>V</b><sub>PIPA</sub>'+(on?' &nbsp; |<b>V</b><sub>G</sub>| = <span class="hl">'+fmt(agcDP(A,C55.VGDISP,7)*100/FT,1)+' ft/s</span>':'')
      +'<span class="sm">P40 every 2 s (S40.8, cross-product steering): what the accelerometers measured comes off the velocity still to gain; the autopilot turns the thrust toward it; when less than 4 s remain the cutoff is set on the waitlist</span>'; }
  if(v==='home'){ const A=W.C.A, mm=lgcProg(W), on=[64,65,66,67].indexOf(mm)>=0;
    const ld1=agcDP(A,C55['L/D1'],0), lad=agcDP(A,C55.LAD,0);
    return 'ROLLC = ± arccos '+FR('(L/D)<sub>1</sub>','LAD')+(on?' = ± arccos '+FR(fmt(ld1,3),fmt(lad,3))+' = <span class="hl">'+fmt(cmcRollc(W),0)+'°</span>':' &nbsp; (from 0.05 g on)')
      +'<span class="sm">the entry guidance finds the vertical L/D it needs (L/D, limited: L/D₁) and rolls the lift to get it, LAD being all there is; the lateral logic picks the side (REENTRY_CONTROL.agc, L355)</span>'; }
  if(v==='rdv') return 'CSI: E(T<sub>TPI</sub>) = 26.6° &nbsp;·&nbsp; CDH: <i>a</i><sub>LM</sub> = <i>a</i><sub>CSM</sub> − Δ<i>H</i>, &nbsp; <i>ṙ</i><sub>LM</sub> = <i>ṙ</i><sub>CSM</sub> ('+FR('<i>a</i><sub>CSM</sub>','<i>a</i><sub>LM</sub>')+')<sup>3/2</sup> &nbsp;·&nbsp; TPI when <span class="hl">E = 26.6°</span>, to meet the CSM 130° on'
    +'<span class="sm">P33 makes the LM’s orbit coelliptic with the CSM’s, a constant height below it (CDHMVR); P34 waits for the line of sight to climb to E and solves Lambert’s problem for the meeting</span>';
  if(v==='alarms') return 'stolen = 2 × '+fmt(ST.rrPps,0)+' s<sup>−1</sup> × 11.72 μs = <span class="hl">'+fmt(ST.rrAuto?200*ST.rrPps*MCT:0,1)+'%</span> &nbsp;·&nbsp; jobs + stolen &gt; 100% &rArr; a new SERVICER every 2 s before the last one ends'
    +'<span class="sm">eight core sets and five VAC areas fill; the Executive calls BAILOUT (1202 or 1201); the restart flushes the jobs and the guidance carries on</span>';

}

const SRC_LINE='Flight software: Luminary 099 (LM, Apollo 11) and Comanche 055 (CM), the MIT listings transcribed by the Virtual AGC project. The keyboard, landing and alarms views run Luminary 099 itself on the Virtual AGC’s emulator (yaAGC), and the way out and the way home Comanche 055, started from the erasable memory of NASSP’s Apollo 11 scenarios (Project Apollo – NASSP, GPL v2); the verb, noun, alarm and scale tables are read from the listings by build_dsky/extract_tables.py. The LM’s prelaunch erasable load: Grumman LM Data Book Vol. II, Table LM5/4.5.1-1. Premission profile: Bennett, NASA TM X-58040. Mission times: the Apollo 11 Mission Report (MSC-00171) and the air-to-ground transcript. The entry: MSC Internal Note 70-FM-30, the Apollo 11 entry postflight analysis.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const INFO_SRC={
  keys:()=>'<p><b>The DSKY</b> (display and keyboard) was how the crew talked to the Apollo guidance computer. It has no letters: every request is a <b>verb</b> (what to do) and a <b>noun</b> (what to do it to), two digits each. <b>V16 N36 ENTR</b> asks to <i>monitor</i> (verb 16) the <i>clock</i> (noun 36): the three registers then show hours, minutes and seconds and update once a second.</p>'
    +'<p>There is no decimal point on the display. The crew carried the noun list, which says for each register where the point goes and in what units: N36’s third register is <i>0xx.xx SEC</i>, so <b>+05813</b> reads 58.13 s. The list on the right is read from the flight program’s own tables.</p>'
    +'<p>Data goes in with a load verb: <b>V25 N36 ENTR</b> makes the verb and noun flash and asks for R1 (the verb shows 21), then R2 (22), then R3 (23). A word keyed with a sign first is decimal (five digits, all of them); without a sign it is octal, so an 8 or a 9 lights <b>OPR ERR</b>. <b>CLR</b> blanks the word, <b>RSET</b> clears the error lamps, <b>KEY REL</b> hands the DSKY back to a program that is waiting for it.</p>'
    +'<p>Programs talk back the same way. A <b>flashing</b> verb and noun is a question: <b>PRO</b> means go on, <b>ENTR</b> means done (or do it again), <b>V34 ENTR</b> means stop. <b>V37 ENTR nn ENTR</b> starts program Pnn; the PROG digits show which is running.</p>'
    +'<p>Everything on this DSKY is the flight program’s own doing. Luminary 099, assembled from the Apollo 11 listings, runs on the Virtual AGC project’s emulation of the computer, compiled into this page, in the LM as it was 23 minutes before the descent. The diagram above lights from PINBALL’s own variables, read from the computer’s memory as it runs: DSPCOUNT (where the next digit goes), REQRET (a load waiting), CADRSTOR (a program waiting for an answer), MONSAVE (a monitor) and DSPLOCK (the keys holding the display).</p>',
  land:()=>'<p><b>The landing</b>, flown by the flight program itself: Luminary 099 on an emulation of the computer, given what Apollo 11’s computer was given (the prelaunch pad load, the two state vectors, the landing site’s alignment, the DAP data of 98:24) and the crew’s keys at their times. Aldrin selected <b>P63</b> at 102:10:36, 22 minutes before ignition. The program finds the ignition time itself (IGNALG) and flashes <b>V06 N61</b>: the time to go in the braking phase, the time to ignition counting up, and the cross-range. The crew checked them against the PAD read up from the ground (“09:50. That’s right.”). It offers a fine alignment (checklist 00014) and asks for the burn attitude (<b>V50 N18</b>; Aldrin read “180, 287, 0. Here goes.”). It also checks the landing radar’s antenna. On Apollo 11 the antenna was not in position 1, and checklist <b>00500</b> came up (“we got a 500 alarm early in the program”).</p>'
    +'<p>Then <b>V06 N62</b> counts down. At 35 s the DSKY blanks, to show that navigation by the accelerometers has begun. At 5 s <b>V99 N62</b> asks “please enable engine”, and Armstrong’s PRO lit it. Every two seconds the guidance computes the thrust that brings the LM onto a reference trajectory ending at the targets, and shows <b>V06 N63</b>: velocity, altitude rate, altitude.</p>'
    +'<p>Once the landing radar sees the ground, Aldrin keys <b>V16 N68</b> and reads ΔH, the radar’s altitude minus the computer’s (“minus 2 900” in the flight). <b>V57</b> then lets the radar correct the computer. At high gate <b>P64</b> pitches the LM up so the commander can see the site, and <b>V06 N64</b> shows the landing point designator angle. At about 600 ft Armstrong took the attitude, and at about 400 ft the rate of descent: the ROD switch starts <b>P66</b>, and the computer holds the descent rate he sets, a foot a second a click. Here the commander flies P66 to Aldrin’s call-outs; after touchdown the crew runs <b>P68</b>, which stores where the LM is.</p>'
    +'<p>The computer starts with the flight’s navigation errors. Its estimate of the LM’s position is about 21,000 ft uprange of the truth (MR p. 5-3) and its altitude about 2,900 ft high when the radar first looks. The radar corrects the altitude; nothing corrects the distance, so the LM lands about four miles past the computer’s site, as Apollo 11 did. In the flight only about 580 ft of ΔH was the computer’s own error (MR Table 5-III); the rest was the ground under the LM, which this page does not model.</p>'
    +'<p>With the crew box unticked you answer the computer yourself: PRO, ENTR, the antenna button at checklist 00500, V16 N68, V57. The arrows take the controls from the crew: ↑ and ↓ click the ROD switch (in P64 the first click starts P66), ← and → pitch the LM; S stops the engine after the contact light.</p>',
  alarms:()=>'<p><b>The 1202</b>, raised here by the flight program itself. The guidance computer ran its work as jobs. Each job needs a <i>core set</i> (twelve words for its registers), and the interpretive ones also a <i>VAC area</i>. Luminary 099 has eight core sets and five VAC areas: the boxes above are read from the computer’s memory as it runs, each job named by the source file of the place it was last left (SERVICER and its guidance, the display interface’s MAKEPLAY, PINBALL, the autopilot). Every two seconds a task starts SERVICER, the navigation and guidance job, “on an open-loop basis” (MR p. 16-12): whether or not the last one has finished.</p>'
    +'<p>The rendezvous radar’s angle counters (its CDUs) were excited from a second 800-Hz supply, “locked in frequency … but not locked in phase”. So they kept counting, up to 6,400 counts a second each. Every count takes one memory cycle, 11.7 μs, away from the program. “The computer normally operates at approximately 90 percent of capacity during peak activity of powered descent” (MR p. 16-13). With the counts on top, SERVICER cannot finish in two seconds and the next one starts anyway. Each late SERVICER keeps its core set and VAC area, the display jobs it asked for wait in core sets of their own, and when the Executive is asked for one more and none is free it calls BAILOUT: <b>1202</b> (no core sets) or <b>1201</b> (no VAC areas).</p>'
    +'<p>BAILOUT restarts the software. The restart throws every job away and resumes each program from its last recorded phase. It also clears the keyboard’s state, which is why the crew’s V16 N68 vanished each time (“it appears to come up when we have a 1668 up”). The guidance went on, and Houston, which had decided before flight that such alarms would not stop a landing, called “We’re GO on that alarm”.</p>'
    +'<p>The alarms here are this program’s, raised under the switches on the panel; their times differ from the flight’s, because the load is never quite the flight’s (the counters’ rate drifted with the two supplies’ phase, and the rest of the flight’s load is not all reproduced). The slider sets the counters’ rate. Turn the radar switch off and the counters stop.</p>',
  out:()=>'<p><b>Lunar orbit insertion</b>, flown by the flight program itself: Comanche 055 on the Virtual AGC’s emulator, half an hour before the burn behind the Moon. Its memory is the one NASSP’s Apollo 11 scenario keeps at 75:42 (its own flight: its burn 7 minutes later, a different ΔV), with the flight’s state vector and the day’s DAP load. The page flies the docked CSM and LM around it: the SPS and its gimbals, sixteen RCS jets, the platform, the Moon.</p>'
    +'<p>The crew loads the PAD with <b>P30</b>: <b>V25 N33</b> for the time of ignition, 75:49:49.65, and <b>V25 N81</b> for the change of velocity in the local vertical frame: −2889.7 forward, −394.4 sideways, −68.6 ft/s down. <b>N42</b> shows the orbit that change would give if it happened all at once, as Houston said it would read: “HA plus 431.3, HP minus 128.2”. The real burn lasts six minutes and starts 225 seconds before the closest point, so the impulsive orbit dips 128 miles under the surface and the real one does not. <b>V48</b> first loads the DAP: the two vehicles’ weights on N47, the gimbal trims on N48.</p>'
    +'<p><b>P40</b> flies the burn. R60 shows the attitude on <b>N18</b> (the PAD: roll 358, pitch 226, yaw 347); the crew, already there, pressed ENTER. Checklist <b>00204</b> asks for the gimbal test: the computer swings each gimbal two degrees up, down and back, then sets the trims. <b>V06 N40</b> counts down: time from ignition, velocity to be gained, velocity gained. At 35 s the DSKY blanks, at 5 s <b>V99</b> asks “please enable engine”, and at TIG the computer lights the SPS. Its autopilot steers the engine’s gimbals through the same counters the optics use, every 80 ms, and its guidance cuts the engine off when the velocity to gain runs out. Then <b>V16 N85</b> shows the residuals, and <b>V82</b> the orbit on <b>N44</b>. The crew read “169.6 by 60.9”.</p>'
    +'<p>Behind the Moon there was no radio: the burn was flown out of contact, and the ground learned how it went when the CSM came round at 76:15. The loss and acquisition of signal here come from the Moon’s position as Comanche’s own ephemeris has it.</p>',
  rdv:()=>'<p><b>Leaving the Moon</b>, flown by the flight program itself: Luminary 099 on the Virtual AGC’s emulator, from 124:10 on the surface at Tranquility Base, given what Apollo 11’s computer had by then: the prelaunch pad load, its landing site, the CSM’s state vector, the platform aligned to the site for ignition (P57), the weights. At 122:51 Houston read up the ascent PAD: ignition at 124:22:00.00 and, for <b>N76</b>, 5534.9 ft/s horizontal, 32.2 ft/s up and a cross-range of 1.7 nmi. The crew selects <b>P12</b> and loads them with V25 N33 and V25 N76. P12 counts down on <b>V06 N74</b>: the time from ignition, and the yaw and pitch after the vertical rise. The DSKY blanks 35 s before ignition (“DSKY blanks.”) and at 5 s asks V99, please enable engine (“…abort stage, engine arm ascent, proceed.”). The ascent engine gave about 3,460 lb and could not be throttled. P12 climbs straight up until it rises at 40 ft/s, then pitches over and steers to 60,000 ft and the N76 speeds. Every 2 s it shows <b>N63</b>: the speed, the climb rate and the altitude.</p>'
    +'<p>At cutoff V16 N63 flashes. The transcript prints Aldrin’s reading as “We got 53373, 32.8 feet per second, 60 666”; the Mission Report puts the computer’s speed at 5537.0 ft/s, so the first number was probably 5537.3. <b>V16 N85</b> then shows the residuals, the velocity still to gain in the LM’s axes, and the crew thrust them out on the translation controller (−2.1, −0.1, +1.8 ft/s in the flight). <b>V82</b> shows the orbit on N44: “We show 47.3 by 9.5.” <b>V48</b> then puts the autopilot back on two jets for translation along X: P12 had made it four, and the rendezvous’s burns were flown on two.</p>'
    +'<p>At 124:51 Aldrin asked for the rendezvous radar’s breakers (“Radar circuit breakers in?”). <b>P20</b> turns the LM so its +Z axis points at the CSM (<b>V50 N18</b>, “Okay. AUTO maneuver.”), drives the antenna to where its state vectors put the CSM, and on lock-on asks the crew whether the radar has the main lobe (<b>V50 N72</b>; “Got a good lockon” at 124:54:02). From then on, about once a minute, it takes a mark (range, range rate and the antenna’s two angles) and weighs it against its own state vectors in a filter. A mark that would move them too much waits for approval on <b>N49</b>.</p>'
    +'<p><b>The rendezvous</b> was the coelliptic sequence. The CSM was about 60 miles up and ahead. <b>CSI</b>, at the LM’s first apolune, put the LM on a nearly circular orbit about 15 miles below the CSM. Half an orbit later <b>CDH</b> made the two orbits coelliptic: the same shape, a constant height apart. Lower and faster, the LM gained on the CSM. <b>TPI</b> came when the line of sight to the CSM had climbed to 26.6° above the LM’s horizon. It started a transfer that met the CSM after the CSM had flown 130° more. Two small midcourses trimmed it, and the crew braked by hand on the radar’s range and rate.</p>'
    +'<p>Each targeting program takes times and angles from the crew. <b>P32</b> takes the CSI time (N11), the apsidal crossings to CDH and E (N55), and the TPI time (N37). It answers with <b>N75</b> (ΔH at CDH and the times between the burns), <b>N81</b> (CSI in the local vertical frame: forward, sideways, down) and <b>N82</b> (the CDH that follows). Between passes <b>V16 N45</b> stays up with the marks since the last burn, the time to ignition and the middle gimbal angle, while P20’s tracking and marks go on. <b>V32 E</b> asks for a new solution with more marks, and <b>PRO</b> for the final one. <b>P33</b> targets CDH (N13, N75, N81). <b>P34</b> targets TPI (N37, N55, then N37 with the time it found, N58 with the perilune after TPI and both ΔVs, N81, and N59 along the line of sight). <b>P35</b> targets a midcourse three minutes ahead. <b>P41</b> flies each burn on the RCS. Its own attitude would put the X axis along the burn; the crew kept the +Z axis on the CSM instead, as the Mission Report says of the midcourses (“the lunar module plus Z axis remained pointed at the command module”, MR p. 5-11), and thrust until <b>V16 N85</b> read zero. CSI was flown on “the plus Z thrusters, and radar lock-on was maintained throughout the firing” (MR p. 4-18). <b>P47</b>, the thrust monitor, follows the braking on <b>N83</b>.</p>'
    +'<p>Here the crew keys what Apollo 11’s crew keyed, at the times the transcript and the Mission Report give, and the computer does the rest. Its CDH comes within six seconds of the flight’s. Its TPI asks for 20.5 ft/s forward and 10.6 up against the flight’s 22.7 and 10.6, at 126:57:30, half a minute after the time P32 aimed CSI for. The flight’s LM computer put it at 127:03:31.6, “6-1/2 minutes later than planned” (MR p. 4-18, Table 5-VI); the report gives no cause.</p>',
  home:()=>'<p><b>The way home</b>, flown by the flight program itself: Comanche 055 on the Virtual AGC’s emulator, as it was 25 minutes before the command module met the air. Its memory is the one NASSP’s Apollo 11 scenario keeps at 192:47 (the prelaunch loads, the platform’s alignment, the flags), with the day’s uplink: the state vector the RTCC sent (CROX880) and the target. Thunderstorms had moved the target 215 miles downrange, to 13.32 N 169.17 W, 1,500 miles from the entry interface, and that “required the use of computer program P65” (MR §4.19). Around the computer the page flies the CM: the air, its jets, its platform and accelerometers.</p>'
    +'<p>Nineteen minutes out the crew keys <b>V37 E 61 E</b>. P61 shows the target with the lift up (<b>N61</b>), the peak load, speed and angle it predicts at 400,000 ft (<b>N60</b>; the flight’s DSKY read 6.46 g, 36,184 ft/s, −6.46°), and the range, speed and time to 0.05 g (<b>N63</b>). <b>P62</b> asks for the separation on V50 N25, checklist 00041. At 194:49:12.7 the service module goes, and PRO starts the entry autopilot, which holds the CM where it is. Until then the CSM had tracked the horizon in the window. The PAD’s pitch of 267° at 194:46:06, held so, is 298.5° at 194:33:06 on this page’s trajectory and platform. The PAD said 298.</p>'
    +'<p>PRO on the second <b>N61</b>, after the service module had gone by, turns the CM to the entry attitude: heat shield forward, the apex 20° up from the wind, the lift up. <b>N22</b> shows the gimbal angles it aims for, and P63 follows by itself and waits for the air. At 0.05 g <b>P64</b> starts the guidance, showing on <b>N74</b> the roll it commands, the speed and the load. The CM steers by rolling its lift. Its centre of mass is offset, so it flies tilted and lifts 0.28 of its drag: rolled up the lift holds it high, rolled down it presses it lower. The first pass peaks near 6.7 g. <b>P65</b> then flies it back up out of the thick air to reach the far target (<b>V16 N69</b>: the bank, and the load and speed where the up-control ends). <b>P67</b> flies the rest, rolling the lift left and right to stay on the line. Below 1,000 ft/s through the air the steering ends, and <b>V16 N67</b> shows the range still to go and where the computer reckons it is. The crew read it after the drogues: “Reading 1330, 1069 [16915], 15”.</p>'
    +'<p>The entry autopilot knows the CM’s attitude only from the gimbal angles, read every tenth of a second. It fires one jet per command, from system A, as Apollo 11 did (system B used no propellant). Its roll logic is written for one jet’s push. Tick <b>system B</b> and both rings fire, twice the push the logic expects.</p>'
};
const DERIV_SRC={
  keys:()=>'<h4>a decimal register</h4>'+EQ(1,'shown = round( value × SFOUTAB scale ) &nbsp;(DSPDECWD, 5 digits, saturating at 99999)')
    +'<p>The flight program keeps metres, centiseconds and revolutions. Only the display converts them, with constants PINBALL keeps in a table (SFOUTAB): feet, nautical miles and degrees. derive_format.py decodes those constants from the listing: they hold 1 ft = 0.3048 m and 1 nmi = 1852 m to about 10<sup>−8</sup>, and 2.2046268 lb per kg.</p>'
    +'<h4>an octal register</h4>'+EQ(2,'word = d<sub>1</sub>·8<sup>4</sup> + d<sub>2</sub>·8<sup>3</sup> + d<sub>3</sub>·8<sup>2</sup> + d<sub>4</sub>·8 + d<sub>5</sub>')
    +'<p>Alarm codes are octal: <b>01202</b> is 642 in decimal. In octal mode PINBALL refuses 8 and 9 (OPR ERR).</p>'
    +'<h4>what the computer sends the DSKY</h4>'+EQ(3,'channel 10 = <i>aaaa b ccccc ddddd</i>: relay row <i>a</i> (1 to 12), a sign bit <i>b</i>, two digits’ 5-bit codes <i>c</i>, <i>d</i>')
    +'<p>The codes are PINBALL’s RELTAB: 0 = 10101, 1 = 00011, 2 = 11001 … 9 = 11111. The program writes its eleven display words (DSPTAB) out one at a time, and the DSKY’s relays hold them; row 12 carries the lamps. The DSKY itself flashes the verb and noun. The page draws the segments from the words the computer sent.</p>',
  land:()=>'<h4>the guidance law (LUNAR_LANDING_GUIDANCE_EQUATIONS)</h4>'
    +EQ(1,'<i>J</i><sub>DG</sub><i>T</i>³ + 6<i>A</i><sub>DG</sub><i>T</i>² + (18<i>V</i><sub>DG</sub> + 6<i>V</i><sub>G</sub>)<i>T</i> + 24(<i>R</i><sub>DG</sub> − <i>R</i><sub>G</sub>) = 0 &nbsp; (downrange, solved for T)')
    +EQ(2,'<i>a</i> = [3q²−2q]'+FR('12(R<sub>DG</sub>−R<sub>G</sub>)','T²')+' + [4q²−3q]'+FR('6V<sub>DG</sub>','T')+' + [2q²−q]'+FR('6V<sub>G</sub>','T')+' + [6q²−6q+1] A<sub>DG</sub>')
    +'<p>R<sub>G</sub>, V<sub>G</sub> are the LM’s position and velocity in a frame at the site (x up, z downrange); R<sub>DG</sub>…J<sub>DG</sub> are the targets loaded before launch. The braking targets sit '+fmt(-DESC_PAD.RBRFG[1]/1000,2)+' km uprange and '+fmt(DESC_PAD.RBRFG[0],0)+' m up. P64 begins when T passes −62 s and P65 when T passes −12 s.</p>'
    +'<h4>ignition (IGNALG)</h4>'+EQ(3,'(R<sub>IGNZ</sub> − R<sub>GZ</sub>) + K<sub>IGNX</sub>(R<sub>GX</sub> − R<sub>IGNX</sub>) + K<sub>IGNV</sub>(|V<sub>G</sub>| − V<sub>IGN</sub>) = 0, &nbsp; TIG = T<sub>DEC1</sub> − 26 s')
    +'<h4>what the program is given</h4><p>The equations above run in the program; the page supplies the LM around it. Its mass, centre of mass and inertia from the DOI masses down; sixteen 100-lb jets where the jet-select logic fires them; the descent engine’s throttle from the DECA’s pulses, lagging 0.2 s, and its gimbal trimmed by the program; the IMU’s gimbal angles counted into the CDUs and the accelerometers’ pulses with the pad load’s biases and scale errors; the landing radar’s four beams against a smooth Moon; the rendezvous radar’s CDUs counting; the switches; the crew’s keys.</p>'
    +landCompareHTML(),
  alarms:()=>{ const W=WORLD.land, pps=ST.rrAuto?ST.rrPps:0;
    let s='<h4>the time the radar takes</h4>'+EQ(1,'2 counters × '+fmt(pps,0)+' s<sup>−1</sup> × 11.72 μs = '+fmt(200*pps*MCT,2)+'% of the computer')
      +'<p>Each count is an unprogrammed sequence the hardware slips between instructions: a memory cycle the program never sees. The emulator counts them as the hardware did, one cycle each.</p>'
      +'<h4>the pile-up</h4>'+EQ(2,'a SERVICER that needs <i>w</i> s of the computer ends '+FR('w','1 − stolen')+' after it starts; when that passes 2 s, the next one starts first')
      +'<p>The program cannot see the stolen time. It only runs slower, and its jobs queue.</p>';
    const al=W?lgcFlightAlarms(W):[];
    if(al.length){
      s+='<h4>the core sets at each alarm of this run</h4><table class="cmp"><tr><th>GET</th><th>code</th><th>the eight core sets as the program left them</th></tr>';
      for(const a of al){ const n={}; for(const j of a.sets) if(j){ const f=jobFamily(j).name; n[f]=(n[f]||0)+1; }
        s+='<tr><td>'+hmsShort(a.get)+'</td><td>'+octal5(a.code).slice(1)+'</td><td>'+(Object.keys(n).map(f=>f+(n[f]>1?' ×'+n[f]:'')).join(', ')||'all free')+'</td></tr>'; }
      s+='</table><p>Each row is the Executive at the instant the alarm was raised, read before BAILOUT’s restart cleared it.</p>';
    } else s+='<p>No alarm in this run yet: the table of what filled the core sets comes with the first.</p>';
    return s; },
  out:()=>'<h4>the stack</h4>'
    +EQ(1,'<b>a</b> = −'+FR('μ<sub>☾</sub><b>r</b>','r³')+' + '+FR('F','m')+' <b>t̂</b>(δ<sub>p</sub>, δ<sub>y</sub>) + jets, &nbsp; <b>t̂</b> = (cos P′ cos Y′, sin Y′, −sin P′ cos Y′), P′ = δ<sub>p</sub> − 2.15°, Y′ = δ<sub>y</sub> + 0.95°')
    +EQ(2,'δ = 85.41″ × (the optics CDU error counter), &nbsp; the counter stepped by each pulse the glue drains from 053/054 at 3200 per second')
    +'<p>The docked stack’s mass, centre of gravity and moments come from the Mission Report’s Table A-I, at LOI ignition and cutoff, linear in the mass. The SPS is the flight’s own: 96,061.6 lb to 72,037.6 lb in 357.53 s for 2917.5 ft/s gives 21,171 lb and 315.1 s. It lights 0.6 s after the computer’s ENGINE ON, and at ENGINE OFF it gives the 0.6 s of thrust the computer allows for (NASSP’s transients). The thrust leaves a pivot on the axis at station 833 in, chosen so the PAD’s trims point it through the centre of gravity; the gimbals follow the computer at 8.6°/s. The sixteen RCS jets give 949 N m each.</p>'
    +'<p>The yaAGC emulator, given the TVC bits on channel 14, empties the optics angle counters instead of the command counters, and the gimbals would never move. The page’s input/output code hides those two bits from the emulator in the CM and drains the command counters itself, a pulse every 26.67 machine cycles, each taking a cycle as the hardware did.</p>'
    +'<h4>the start</h4><p>The arrival is a hyperbola about the Moon in the plane of NASSP’s, with the Mission Report’s pericynthion, 61.5 nmi above the landing site. Its excess speed and the time of the pericynthion are fitted so that P30’s N42 on the computer reads both of the PAD’s numbers (loi_model.py: 1076.821 m/s, 7.3 s before the report’s predicted 75:53:35). The computer carries its state to TIG with the Moon’s J2, J3 and J22, which the page’s Moon lacks: that coast adds 0.22 nmi to N42’s HA, measured on the computer itself, and the fit allows for it. Everything after that is a check.</p>'
    +loiCompareHTML(),
  rdv:()=>'<h4>the Moon</h4>'
    +EQ(1,'<b>a</b> = −'+FR('μ<b>r</b>','r³')+' + ∇[ −'+FR('μ J<sub>2</sub> R²','r³')+' P<sub>2</sub> − '+FR('μ J<sub>3</sub> R³','r⁴')+' P<sub>3</sub> + '+FR('3 μ R² C<sub>22</sub>','r³')+' cos²φ cos 2λ + '+FR('μ R³ C<sub>31</sub>','r⁴')+' P<sub>31</sub>(sin φ) cos λ ]')
    +'<p>The LM and the CSM fly in the field the computer’s own coast has in lunar orbit (ORBITAL_INTEGRATION’s OBLATE): J2 and J3 from its constants, C22 and C31 from the pad load, in its own moon-fixed frame (R-TO-RP). The constant Luminary names 2J3RE/J2 is J3 R/J2: over the Moon’s radius in the same table it gives J3 = −2.1 × 10<sup>−5</sup> exactly, and the Earth’s value beside it the Earth’s J3 of the day. Run from the CSM’s state as the page loads it, the page’s integration and the computer’s own are 21 m apart after 57 minutes; with the point mass alone they are 1,606 m apart. That matters: the radar measures the LM against the CSM, so a computer whose CSM drifts from the true one drags its LM after it, mark by mark.</p>'
    +'<h4>the CSM and the site</h4><p>An ellipse of 62 by 56 nmi above Landing Site 2’s sphere (MR p. 5-10), at its pericynthion at 125:41:50: at the range-rate check 36 minutes before CDH, “the command module was near pericynthion”. Its plane passes 1.7 nmi from the computer’s site at ignition, the PAD’s cross-range. Where its pericynthion lies is fitted: '+fmt(A11R.csm.wp*180/PI,3)+'° ahead of the site at ignition, the angle at which P32’s own method, from the true states, asks for the flight’s 51.5 ft/s (agc/t_wpfit2.js). The computer then works from its own states and asks for its own CSI.</p>'
    +'<p>The computer’s site is its estimate at touchdown, 0.649 N, 23.46 E (MR Table 5-IV), at the preflight radius; the LM sits 1,500 ft above it (MR p. 7-7: “a radius 1500 feet less than desired”). The same page gives a longitude error of 4,400 ft, which the page leaves out. Along the track it tilts the computer’s vertical by 0.044°, and the LM would reach orbit climbing 4 ft/s slower than the computer believes: 29 ft/s here against the Mission Report’s best estimate of 32. Its apolune would then come 87 s after the PAD’s CSI time, and at CSI it would still be climbing at 8 ft/s, over P32’s 7 ft/s (NICKELDP). P32 would then look for CDH at the next apsidal crossing instead of half an orbit on, as both computers did in the flight, and here that search fails: alarm 00605, too many iterations.</p>'
    +'<p>The same error leaves the computer’s own orbit low. V82 measures from the computer’s site radius: after the trim it reads 45.5 by 9.1 here, where the true orbit stands 46.2 by 9.5 above that sphere, against the crew’s “47.3 by 9.5”. The trim takes 1.2 miles off the true apolune, from 47.2 to 46.0 nmi above Landing Site 2, as N85’s −1.4 ft/s along X asks; the flight’s went from 48.0 to 47.3 with −2.1 asked, which the sources here do not explain.</p>'
    +'<h4>CSI (P32, CSI/A)</h4>'+EQ(2,'find the horizontal ΔV<sub>CSI</sub> for which E(T<sub>TPI</sub>) = 26.6°, with CDH half an orbit later if |ṙ| &lt; 7 ft/s at CSI (CIRCL), else at the next apsidal crossing')
    +'<h4>CDH (P33, CDHMVR)</h4>'+EQ(3,'<i>a</i><sub>LM</sub> = <i>a</i><sub>CSM</sub> − Δ<i>H</i>, &nbsp; <i>ṙ</i><sub>LM</sub> = <i>ṙ</i><sub>CSM</sub> ('+FR('<i>a</i><sub>CSM</sub>','<i>a</i><sub>LM</sub>')+')<sup>3/2</sup>, &nbsp; <i>v</i><sub>h</sub> = √(μ(2/<i>r</i> − 1/<i>a</i><sub>LM</sub>) − <i>ṙ</i><sub>LM</sub>²)')
    +'<p>The CSM’s values are taken where its orbit crosses the LM’s radius line. A circular CSM would make CDH almost nothing; the 62 by 56 ellipse makes it mostly vertical, as the flight’s was.</p>'
    +'<h4>TPI (P34)</h4>'+EQ(4,'E = atan2(LOS·up, LOS·forward) = 26.6° &rArr; TIG, &nbsp; then Lambert from the LM at TIG to the CSM after 130° of its orbit')
    +'<p>Each program carries both state vectors to the burn in the field above, then solves on conics from there. Each pass starts again from the latest marks, and the answers move a little from pass to pass. P32 aimed CSI for 26.6° at 126:57:00; P34’s passes here found 126:57:08, 126:57:24 and 126:57:30. The flight’s LM computer found 127:03:31.6, its abort guidance 127:03:39 (MR Table 5-VI).</p>'
    +'<h4>the crew here</h4><p>After insertion the residuals are trimmed to half a foot per second, one axis at a time. A tighter trim chases P12’s target: it is the insertion’s, and past perilune the LM’s climb rate grows a tenth of a foot per second each second, so each pulse down moves the apolune a few seconds later. Each P41 burn is held on its largest component until the rate read off N85’s updates says it would pass zero, then trimmed to 0.2 ft/s. The braking keeps the closing speed under gates, 30 ft/s at 5,000 ft, 15 at 2,500, 6 at 1,000, 3 at 400 and none at 150; these are the page’s: the press kit’s plan gives four braking burns by time and size (11.5, 9.8, 4.8 and 4.7 ft/s from 127:39:43), not the gates the crew flew them by. Under 200 ft, with the closing speed under a few tenths, the LM holds its station. The CSM docks 10 min 55 s after station-keeping begins, as on Apollo 11.</p>'
    +rdvCompareHTML(),
  home:()=>'<h4>the CM</h4>'
    +EQ(1,'<b>a</b> = <b>g</b>(<b>r</b>) + D [ <b>û</b><sub>wind</sub> + (L/D) '+FR('sin α<sub>T</sub>','sin 20°')+' <b>l̂</b> ], &nbsp; D = '+FR('ρ <i>v</i><sub>air</sub>² C<sub>D</sub>S','2<i>m</i>'))
    +EQ(2,'<b>I</b> ω̇ + ω × <b>I</b>ω = <b>τ</b><sub>jets</sub> + K <i>q</i> (<b>w</b><sub>trim</sub> × <b>w</b>), &nbsp; K = S d C<sub>m,α</sub>')

 *  makeShot: the recording context the selfTest draws into (build_aa   *

function makeShot(W,H){

  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];

  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */

    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },

/* ================================================================== *
 *  selfTest: runs when there is no document (jsc, osascript)         *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0; const out=[];
  /* with VERBOSE_TEST defined every check is listed, with its numbers */
  const ok=(c,name)=>{ if(c){ pass++; if(typeof VERBOSE_TEST!=='undefined') out.push('ok   '+name); } else { fail++; out.push('FAIL '+name); } };
  const close=(a,b,tol,name)=>ok(isFinite(a)&&isFinite(b)&&Math.abs(a-b)<=tol,name+' ('+a+' vs '+b+')');
  const rel=(a,b,r,name)=>ok(isFinite(a)&&isFinite(b)&&Math.abs(a-b)<=r*Math.abs(b),name+' ('+a+' vs '+b+')');
  const dstate=D=>{ const p=a=>a.map(c=>c===''?'_':c).join(''); return {p:p(D.md),v:p(D.vd),n:p(D.nd),
    r:[0,1,2].map(k=>(D.rs[k]||'_')+p(D.rd[k])),flash:D.flash,oprErr:D.lamps.oprErr,keyRel:D.lamps.keyRel}; };

  /* ---- 1. PINBALL against derive_pinball.py: every sequence, both programs ---- */
  {
    const host={noun(D,n,k){
      if(n===36) return 36993990/100;
      if(n===43&&!(D.mem&&D.mem[43]&&D.mem[43][k]!==undefined)) return [0.6875,23.4333,-0.17*1852][k];
      if(n===9) return {octal:D.failreg[k]};
      return null; }};
    let bad=0, n=0;
    for(const s of REF.pinball.sequences){
      const D=makeDsky(s.prog==='Luminary099'?'L':'C',host); dskSetMM(D,0); D.failreg=[0o1202,0o1201,0];
      for(const k of s.keys.split(' ')) dskKey(D,k);
      const a=dstate(D), e=s.end; n++;
      let good=a.p===e.p&&a.v===e.v&&a.n===e.n&&a.flash===e.flash&&a.oprErr===e.oprErr&&a.keyRel===e.keyRel;
      for(let k=0;k<3;k++) good=good&&a.r[k]===e.r[k];
      if(!good){ bad++; if(bad<4) out.push('  pinball differs: ['+s.prog+'] '+s.keys+' -> '+JSON.stringify(a)+' vs '+JSON.stringify(e)); }
    }
    ok(n>=240&&bad===0,'PINBALL: '+(n-bad)+' of '+n+' key sequences end as derive_pinball.py says');
  }
  /* ---- 2. the digits against the AGC's fixed-point output (derive_format.py) ---- */
  {
    const U={DEG:1,NMI:1/NMI,FTS:1/FT,FT:1/FT,LB:LB_PER_KG_AGC,ONE:1,G:1/G0};
    let bad=0, n=0;
    for(const sc of REF.format.scales) for(const [x,want] of sc.cases){
      const f=fmtDec5(x*U[sc.unit],sc.dec), got=f[0]+f[1]; n++;
      if(got!==want){ const d=Math.abs(+got.slice(1)-+want.slice(1)); if(d!==1) bad++; }
    }
    ok(n>=100&&bad===0,'formats: '+n+' AGC fixed-point cases within one rounding step');
    for(const [cs,w] of REF.format.hms){ const f=fmtHMS(cs/100); ok(f.map(x=>x[0]+x[1]).join(' ')===w.join(' '),'HMSOUT '+cs+' cs'); }
    for(const [cs,w] of REF.format.ms){ const f=fmtMS(cs/100); ok(f[0]+f[1].replace(' ',' ')===w,'M/SOUT '+cs+' cs: '+f.join('')+' vs '+w); }
    /* the AGC's own pound and the exact one */
    rel(LB_PER_KG_AGC,1/0.45359237,2e-6,'the AGC pound is the exact one to 2e-6');
  }
  /* ---- 3. the real computers: the ropes and the symbols the page uses agree, word for word ---- */
  {
    const A=makeAgc(), x=A.x; A.rope(ropeBytes('L')); A.init(0);
    const F0=x.agc_fixed()>>1, fixedWord=(bank,addr)=>{ const i16=new Int16Array(x.memory.buffer); return i16[F0+bank*1024+(addr&0o1777)]&0o77777; };
    /* CHKFAIL1 CCS FAILREG (10375 in the listing), MMCHANG's TC REQMM: the addresses the page watches and compares */
    ok(fixedWord(L99F.CHKFAIL1[0],L99F.CHKFAIL1[1])===0o10375,'Luminary 099: CHKFAIL1 holds CCS FAILREG (10375)');
    ok((fixedWord(L99F.MMCHANG[0],L99F.MMCHANG[1])&0o70000)===0,'Luminary 099: MMCHANG is a TC (REQMM)');
    ok(L99.MPAC===0o154&&L99.VAC1USE===0o400&&L99.VAC1===0o401,'the core sets at 0154, VAC1USE at 0400 (ERASABLE_ASSIGNMENTS)');
    A.release();
    const C=makeAgc(); C.rope(ropeBytes('C')); C.init(1);
    const G0=C.x.agc_fixed()>>1, cw=(bank,addr)=>new Int16Array(C.x.memory.buffer)[G0+bank*1024+(addr&0o1777)]&0o77777;
    ok(cw(C55F.CHKFAIL1[0],C55F.CHKFAIL1[1])===0o10375,'Comanche 055: CHKFAIL1 holds CCS FAILREG (10375)');
    C.release();
  }
  /* ---- 4. PINBALL on the real Luminary 099 (the keyboard view's world): its states read from its own memory, its
          answers, and two extended verbs that compute from the state vectors the page loaded ---- */
  {
    const K=makeLgcKeysWorld(), states=[];

    close(DEFAULTS.rrPps,5600,0,'the radar CDUs at 5,600 pulses a second each (this page’s choice; the hardware’s worst, 6,400)');
    close(A11LM.csmLag,150,0,'the CSM 150 s behind the LM at TIG (this page’s choice, from the orbits after DOI)');
    close(A11LM.tland-A11LM.tig,26+664.40,1e-9,'TLAND = TIG + ZOOMTIME 26 s + GUIDDURN 664.40 s (THE_LUNAR_LANDING)');
    close(200*6400*MCT,15.0,0.01,'2 x 6400 x 11.72 us = 15.0% of the computer');
    close(LR.hlo/FT,1.079,1e-9,'the landing radar’s range, 1.079 ft a count on low scale');
    /* the rendezvous's givens (p3_lgcrdv.js A11R): the PADs', the Mission Report's, and this page's choices */
    close(A11R.tig,getOf(124,22,0),1e-9,'ascent TIG 124:22:00 (the ascent PAD, TEC 122:51:36)');
    close(A11R.tcsi,getOf(125,19,34.70),1e-9,'TCSI 125:19:34.70'); close(A11R.ttpi0,getOf(126,57,0),1e-9,'TTPI 126:57:00 (the CSI PAD, TEC 122:54:52)');
    close(A11R.E*180/PI,26.6,1e-12,'TPI at E = 26.6° (the press kit)'); close(A11R.NN,1,0,'CDH at the first apsidal crossing (NN 1: the press kit’s CSI 125:21:20, CDH 126:19:40)');
    close(A11R.lmLb,10837,0,'the LM 10,837 lb (the ascent PAD)'); close(A11R.csmLb,36651,0,'the CSM 36,651 lb (the DAP data load)');
    close(A11R.csm.ha/NMI,62,1e-12,'the CSM’s 62 by'); close(A11R.csm.hp/NMI,56,1e-12,'56 nmi (MR p. 5-10)');
    close(A11R.csm.tp,getOf(125,41,50),1e-9,'its pericynthion at 125:41:50 (MR p. 5-10: near it 36 min before CDH)');
    close(A11R.csm.wp*180/PI,244.572348020,1e-9,'its pericynthion 244.572° ahead of the site at TIG (fitted: agc/t_wpfit2.js)');
    close(A11R.rls2/NMI,937.05,1e-12,'Landing Site 2’s radius, 937.05 nmi (MR Table 5-IV)'); close(A11R.xrange/NMI,1.7,1e-12,'the CSM’s plane 1.7 nmi off (N76)');
    close(A11R.err.up/FT,1500,1e-9,'the LM 1,500 ft above the computer’s site (MR p. 7-7)'); close(A11R.err.east,0,0,'the longitude error left out (see the calculation)');
    ok(A11R.site.lat===0.649&&A11R.site.lon===23.46,'the computer’s site 0.649 N, 23.46 E (MR Table 5-IV, primary guidance)');
    ok(RDV_GATES.map(g=>g.join(':')).join()==='5000:30,2500:15,1000:6,400:3,150:0','the braking gates (this page’s choice)');
    /* the braking's switch, case by case: [on, closing speed, gate] -> on; under the zero gate a closing 0.85 ft/s
       brakes (the LM once coasted through Columbia at that speed), and braking stops a tenth of a foot per second
       past zero */
    for(const [on,c,g,want] of [[false,0.85,0,true],[false,0.15,0,false],[true,-0.05,0,true],[true,-0.15,0,false],
      [false,30.9,30,false],[false,31.1,30,true],[true,29.75,30,true],[true,29.65,30,false],[false,2.1,2,false],[false,2.7,2,true],
      [true,1.75,2,true],[true,1.65,2,false],[true,1e9,Infinity,false],[false,1e9,Infinity,false]])
      ok(rdvBrakeOn(on,c,g)===want,'the braking '+(on?'on':'off')+' at '+c+' ft/s under a gate of '+g+': '+(want?'brakes':'coasts'));
    /* the radar's angles both ways round (RRANGLES: T2 = 180 - T1, S2 = 180 + S1 as CDU angles; the trunnion turns from
       +70 to -250 deg, so mode 2's trunnion is -180 - T1): the boresight comes back from either mode, mode 1's
       trunnion within 90 deg, mode 2's between -270 and -90 */
    { let bad=0, n=0;
      for(let i=0;i<24;i++){ const u=vunit([Math.sin(i*1.3)+0.2,Math.cos(i*0.7)*0.9,Math.sin(i*2.1+0.5)]);
        for(const m2 of [false,true]){ const [T,S]=rrAngles(u,m2), b=rrBore(T,S); n++;
          if(vlen(vsub(b,u))>1e-9||(m2?!(T<-PI/2&&T>-3*PI/2):!(Math.abs(T)<=PI/2))) bad++; } }
      ok(bad===0,'the radar’s angles: the boresight back from both modes, mode 1’s trunnion within ±90°, mode 2’s at −180° − T1 ('+(n-bad)+' of '+n+')'); }
    /* the Moon's field in Luminary's constants, over its equatorial radius 504RM (1,738,090 m): J3 comes out -2.1e-5
       exactly only if the slot named 2J3RE/J2 holds J3 R/J2 (twice that would give -1.05e-5) */
    { const R=1738090, muR2=MUM_SI*R*R;
      close(MOONF.J2/muR2,2.07108e-4,1e-9,'the Moon’s J2 in Luminary’s constants, 2.0711e-4 (the Moon’s J2REQSQ over μ 504RM²)');
      close(MOONF.J3/(muR2*R),-2.1e-5,1e-12,'its J3 −2.1e-5 (2J3RE/J2’s slot is J3 R/J2)');
      close(MOONF.C22/(3*muR2),2.07160e-5,1e-10,'its C22 2.0716e-5 (3J22R2MU)'); }
    /* the way home's givens (p3_cmc.js A11C, p3_cmsim.js CMV): the sources', and this page's choices */
    const T=A11C.truth, Cv=A11C.cmc;
    close(A11C.ei,getOf(195,3,5.66),1e-9,'EI at 195:03:05.66 (the entry analysis, sec. 3)');
    ok(T.lat===-3.1933&&T.lon===171.9603&&T.gam===-6.5230&&T.az===50.1761&&Math.abs(T.v/FT-36194.368)<1e-9&&Math.abs(T.h/FT-400000.72)<1e-9,'the truth: the BET with γ 0.043° steeper (EA sec. 3)');
    ok(Cv.lat===-3.1968&&Cv.lon===171.9622&&Cv.gam===-6.4875&&Cv.az===50.1823&&Math.abs(Cv.v/FT-36195.287)<1e-9&&Math.abs(Cv.h/FT-398867.97)<1e-9,'the computer’s: the RTCC’s CROX880 (EA sec. 3)');
    ok(A11C.target[0]===13.32&&A11C.target[1]===-169.17,'the target 13.32, −169.17 (the entry PAD, TEC 191:43:57)');
    close(A11C.sep,getOf(194,49,12.7),1e-9,'CM/SM separation 194:49:12.7 (MR)');
    close(A11C.turn,getOf(194,55,40),1e-9,'the crew’s PRO for the turn at 194:55:40 (this page’s: after the SM went by)');
    ok(A11C.hor[0][1]===298&&A11C.hor[1][1]===267&&A11C.hor[1][0]===getOf(194,46,6),'the PAD’s horizon checks, 298 and 267');
    close(CMV.m/LBM,12095.5,1e-9,'the CM at entry, 12,095.5 lb (MR Table A-I)'); close(CMV.CDA,15.5,0,'C_D S 15.5 m² (the Data Book, Mach 29.5)');
    close(CMV.LD,0.282,0,'L/D 0.282 (the entry analysis)'); close(CMV.aTrim*180/PI,-20,1e-12,'trim at ALFA −20°'); close(CMV.Cma,0.056,0,'C_m,α 0.056 per radian (the Data Book)');
    close(CMV.pipa,0.0585,0,'a PIPA pulse 5.85 cm/s (KPIP1)'); close(CMC_START,A11C.ei-1500,1e-9,'the world 25 minutes before EI');
    ok(CMC_COMP.length===15,'the fifteen IMU compensation words zeroed');
    ok(CM_CHUTES.drogueAt===24000*FT&&CM_CHUTES.mainsAt===10000*FT&&CM_CHUTES.drogueCDA===22&&CM_CHUTES.mainsCDA===1216,'the chutes: drogues at 24,000 ft, 22 m², mains at 10,000 ft, 1,216 m² (this page’s)');
  }
  /* ---- 10. every view's text and drawing build clean ---- */
  for(const [v] of TABS){
    ST.view=v;
    const W=worldFor(v);
    const s=readoutHTML(ST,W)+eqbarHTML(ST,W)+tagHTML(ST,W)+INFO[v]+DERIV[v];
    ok(!/NaN|undefined|Infinity/.test(s),v+': the texts build clean');
    const ctx=makeShot(1280,760);
    drawView(ctx,1280,760,ST,true);
    const nf=ctx.nonFinite(); ok(nf.n===0,v+': no non-finite coordinate'+(nf.ex?' ('+nf.ex+')':''));
  }
  ST.view=DEFAULTS.view;
  out.push(pass+' passed, '+fail+' failed');
  return {pass,fail,out};
}
if(typeof document==='undefined'&&typeof SKIP_SELFTEST==='undefined'){
  const r=selfTest();
  console.log(r.out.join('\n'));
  if(r.fail) throw new Error(r.fail+' selfTest failure(s)');      /* a non-zero exit, for tools/mutate.py */
} else if(typeof document!=='undefined'){
  /* the real computers' module and instances first (asynchronously: see agcPrepare), then the page */
  agcPrepare(5).then(boot,e=>{ const el=document.getElementById('errbox'); el.style.display='block';
    el.textContent='The guidance computer’s WebAssembly module did not start: '+String(e&&e.message||e); });
}
