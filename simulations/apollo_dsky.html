/* the CMC's outputs that move the stack: jets (ch5, ch6), ENGINE ON (ch11 bit 13: the SPS fires with a delta-V thrust
   switch on), TVC enable (ch12 bit 8: the gimbals follow the CMC's command) */
function loiApplyOut(W,ch,v){
  const K=W.K;
  if(ch===5) K.ch5=v&0o377;
  else if(ch===6) K.ch6=v&0o377;
  else if(ch===0o11){ W.engBit=!!(v&0o10000); loiEngine(W); }
  else if(ch===0o12){ W.ch12=v; }

function loiEngine(W){

  if(!on&&was){ W.seen.engOff=worldGET(W); logEvent(W,'ENGINE OFF from the computer'); }

/* ---- the computer and the stack, one slice ---- */
function loiSlice(W,h){

/* ---- what the views draw, sampled on the slice grid ---- */

  const F=dskyFace(W.C.S);

  const cap=(key,v,n,fl,sec,ms,nr)=>{ if(!W.disp[key]&&cmShowsFor(W,v,n,fl,sec)){ const r=cmRegs(F,ms,nr); if(r) W.disp[key]={get,r}; } };

    const lv=W.vgTrack[W.vgTrack.length-1]; if(!lv||get-lv[0]>=0.5) W.vgTrack.push([get,vg]); }
  const occ=loiOcculted(K.r,get);

  if(K.sps.F>0&&!W.seen.thrust){ W.seen.thrust=get; logEvent(W,'the SPS lights'); }

    W.track.push([get,K.r.slice(),vlen(K.r)-LOI_RLS,vlen(K.v),mm,K.gim[0]*180/PI,K.gim[1]*180/PI,K.gimCmd[0]*180/PI,K.gimCmd[1]*180/PI,K.sps.F,occ]);
    if(W.track.length>30000) W.track.shift();

/* the line of sight's elevation above the LM's local horizontal, ahead positive (P34's E) */
function rdvElev(r,v,rc){ const d=vsub(rc,r), up=vunit(r), fw=vunit(vsub(v,vmul(up,vdot(v,up)))); return Math.atan2(vdot(d,up),vdot(d,fw)); }
/* the LGC's site (moon-fixed, m) and the LM's true one */
const RLS_ASC=(()=>{ const la=A11R.site.lat*PI/180, lo=A11R.site.lon*PI/180, R=vlen(RLS_PAD);
  return [R*Math.cos(la)*Math.cos(lo),R*Math.cos(la)*Math.sin(lo),R*Math.sin(la)]; })();
function rlsTrue(){ const u=vunit(RLS_ASC), east=vunit([-u[1],u[0],0]);
  return vadd(RLS_ASC,vadd(vmul(u,A11R.err.up),vmul(east,A11R.err.east))); }

/* ---- the CSM: Kepler about the page's Moon from its pericynthion ---- */
function rdvCsmOrbit(){ return memo('rdvcsm',A11R.csm.wp+':'+A11R.csm.side,()=>{
  const s=rpToR(RLS_ASC,A11R.tig), u=vunit(s), pole=moonPole(A11R.tig);
  const west=vunit(vcross(u,pole)), n0=vunit(vcross(u,west));       /* the plane through the site, heading west */
  const d=A11R.csm.side*A11R.xrange/vlen(s), n=vunit(vadd(vmul(n0,Math.sqrt(1-d*d)),vmul(u,d)));
  const up0=vunit(vsub(u,vmul(n,vdot(u,n)))), fw=vcross(n,up0), w=A11R.csm.wp;
  const P=vadd(vmul(up0,Math.cos(w)),vmul(fw,Math.sin(w))), Q=vcross(n,P);
  const rp=A11R.rls2+A11R.csm.hp, ra=A11R.rls2+A11R.csm.ha, e=(ra-rp)/(ra+rp), vp=Math.sqrt(MUM_SI*(1+e)/rp);
  return {n,P,Q,rP:vmul(P,rp),vP:vmul(Q,vp),tp:A11R.csm.tp};
}); }
/* its path: the conic's state at TIG flown in the Moon's field as the LGC models it (moonFieldAcc), RK4 at 10 s from
   123:50 to 128:40, read between the nodes by cubic Hermite interpolation (position and velocity, far under a mm) */
const RDV_CSM_H=10;
function rdvCsmTable(){ return memo('rdvcsmtab',A11R.csm.wp+':'+A11R.csm.side,()=>{
  const O=rdvCsmOrbit(), h=RDV_CSM_H, t0=A11R.tig, ta=getOf(123,50,0), tb=getOf(128,40,0);
  const [r0,v0]=keplerProp(O.rP,O.vP,t0-O.tp,MUM_SI);
  const step=(r,v,t,h)=>{ const f=(x,tt)=>moonFieldAcc(x,tt);
    const k1v=f(r,t), k1r=v, k2v=f(vadd(r,vmul(k1r,h/2)),t+h/2), k2r=vadd(v,vmul(k1v,h/2));
    const k3v=f(vadd(r,vmul(k2r,h/2)),t+h/2), k3r=vadd(v,vmul(k2v,h/2)), k4v=f(vadd(r,vmul(k3r,h)),t+h), k4r=vadd(v,vmul(k3v,h));
    return [vadd(r,vmul(vadd(vadd(k1r,vmul(k2r,2)),vadd(vmul(k3r,2),k4r)),h/6)),vadd(v,vmul(vadd(vadd(k1v,vmul(k2v,2)),vadd(vmul(k3v,2),k4v)),h/6))]; };
  const nB=Math.ceil((t0-ta)/h), nF=Math.ceil((tb-t0)/h), R=new Array(nB+nF+1), V=new Array(nB+nF+1);
  R[nB]=r0; V[nB]=v0;
  for(let i=nB;i>0;i--){ const [r,v]=step(R[i],V[i],t0+(i-nB)*h,-h); R[i-1]=r; V[i-1]=v; }
  for(let i=nB;i<nB+nF;i++){ const [r,v]=step(R[i],V[i],t0+(i-nB)*h,h); R[i+1]=r; V[i+1]=v; }
  return {t0:t0-nB*h, h, R, V};
}); }
function rdvCsmAt(t){
  const T=rdvCsmTable(), x=(t-T.t0)/T.h, i=clamp(Math.floor(x),0,T.R.length-2), s=x-i, h=T.h;
  const p0=T.R[i], v0=T.V[i], p1=T.R[i+1], v1=T.V[i+1], s2=s*s, s3=s2*s;
  const r=vadd(vadd(vmul(p0,2*s3-3*s2+1),vmul(v0,h*(s3-2*s2+s))),vadd(vmul(p1,3*s2-2*s3),vmul(v1,h*(s3-s2))));
  const v=vmul(vadd(vadd(vmul(p0,6*s2-6*s),vmul(v0,h*(3*s2-4*s+1))),vadd(vmul(p1,6*s-6*s2),vmul(v1,h*(3*s2-2*s)))),1/h);
  return [r,v];
}
/* the ascent stage on the surface: its CG above the true site (station 243.5 in, the footpads at about 37.5 in) */
function rdvLmOnSurface(t){
  const s=rpToR(rlsTrue(),t), up=vunit(s), r=vadd(s,vmul(up,(LMA.rows[0].cg[0]-37.5)*INCH));
  return [r,moonSurfV(r,t)];
}
/* the landing-site REFSMMAT at TIG (P57 option 4, as P52's LSORIENT): X up through the LGC's site, Z = unit((Rcsm x
   Vcsm) x X) downrange, Y = Z x X; rows */
function rdvRefsmmat(){
  const X=vunit(rpToR(RLS_ASC,A11R.tig)), [rc,vc]=rdvCsmAt(A11R.tig), Z=vunit(vcross(vcross(rc,vc),X)), Y=vunit(vcross(Z,X));
  return [X,Y,Z];
}

/* ---- the computer's loads after the power-up's fresh start: the prelaunch load, the clock, the LGC's site (RLS,
   moon-fixed B27 m), the CSM's vector (the ground's) and the LM's (on the surface: LEMPREC uses RLS while SURFFLAG is
   up), REFSMMAT, the weights (the PAD's LM 10,837 lb), the DAP word NASSP's ascent keeps (DAPBOOLS 022216), the flags
   of a landed LM: FLAGWRD3 REFSMFLG; FLAGWRD8 SURFFLAG, LMOONFLG, CMOONFLG; FLGWRD10 APSFLAG; FLAGWRD9 LETABORT down
   (LANDJUNK clears it at touchdown, so ABORT STAGE means nothing to the program on the surface) ---- */
function rdvLoads(W){
  const C=W.C, A=C.A, t=worldGET(W);
  compPadload(C,PADLOAD99);
  compSetClock(C,t);
  lgcWriteVec(A,L99.RLS,RLS_ASC,27);
  const [rc,vc]=rdvCsmAt(t); lgcStateVector(A,L99.RRECTCSM,rc,vc,t);
  const s=rpToR(RLS_ASC,t); lgcStateVector(A,L99.RRECTLEM,s,moonSurfV(s,t),t);
  lgcRefsmmat(A,rdvRefsmmat());
  agcSetDP(A,L99.MASS,A11R.lmLb*LBM,16); agcSetSP(A,L99.LEMMASS,A11R.lmLb*LBM,16); agcSetSP(A,L99.CSMMASS,A11R.csmLb*LBM,16);
  A.setE(L99.DAPBOOLS,0o22216);
  A.setE(L99.FLAGWRD3,A.E(L99.FLAGWRD3)|0o10000);
  A.setE(L99.FLAGWRD8,A.E(L99.FLAGWRD8)|0o6200);
  A.setE(L99.FLGWRD10,0o10000);
  A.setE(L99.FLAGWRD9,A.E(L99.FLAGWRD9)&~0o400);
  W.loaded=true;
  logEvent(W,'the computer loaded: prelaunch pad load, clock, the landing site, the CSM’s state vector, the REFSMMAT for TIG, the weights');
}

/* ---- the rendezvous radar ----
   The antenna's angles, trunnion T and shaft S, put its boresight at (sin S cos T, -sin T, cos S cos T) in the LM's
   axes (RRNB, LEM_GEOMETRY); mode 2 is |T| > 90 deg.  Gyro-held: the angles take up the LM's rates (NASSP's
   lm_rr.cpp: dS = -wY dt, dT = -(cos S wX - sin S wZ) dt), and in LGC mode turn at K a pulse of the CDU error counters
   the computer fills through CDUTCMD/CDUSCMD (053/054; the glue drains them, agc_page.c), K = 4.55e-4 rad/s: both of
   the listing's gains say so (RR1AXIS "NULL .7 ERROR IN .5 SEC" with RRSPGAIN, DODES "NULL .5 ERROR IN .5 SEC" with
   RDESGAIN); +-384 pulses, zeroed while channel 12 bit 2 is off.  Its CDUs count 2^15 a revolution (035 T, 036 S),
   held at zero while channel 12 bit 1 is on.  With channel 12 bit 14 (track) on and the CSM inside the beam
   (+-1.75 deg, NASSP's 3.5-deg width) and within 400 nmi (Luminary's alarm 00526, "RANGE GREATER THAN 400 NAUT.
   MILES") it locks in frequency at once and in range 12 s later (NASSP's timer; the hardware's figures are not
   documented here): data good, and the servo then holds the boresight on the
   CSM.  Range on low scale below 93,682 m (32767 counts of 2.859024 m, RANGCONV), else counts of 8 times that; range
   rate 17000 - rdot / 0.19135344 m/s (RDOTBIAS, RDOTCONV).  The flight's stow: N73 180, 335 (TEC 123:26:01). */
const RRP={K:4.55e-4, errMax:384, beam:1.75*PI/180, lockDelay:12, maxRange:400*NMI, low:2.859024, lowMax:93682,
  rdot:0.19135344, stopT:[-250*PI/180,70*PI/180], stopS:[-148*PI/180,68*PI/180]};
function rrNew(){ return {on:false, T:-PI, S:-25*PI/180, seen:-1, good:false, low:true, track:false, range:null, rdot:null}; }
const rrBore=(T,S)=>[Math.sin(S)*Math.cos(T),-Math.sin(T),Math.cos(S)*Math.cos(T)];
/* the angles that point the boresight along u (LM axes), in the mode the antenna is in: mode 1 |T| < 90 deg, mode 2
   T = -180 deg - T1 (the trunnion turns from +70 to -250 deg, NASSP's stops), S = S1 + 180 deg (RRANGLES) */
function rrAngles(u,mode2){ const T1=-Math.asin(clamp(u[1],-1,1)), S1=Math.atan2(u[0],u[2]);
  return mode2?[-PI-T1,wrapPi(PI+S1)]:[T1,S1]; }
function rrStep(W,h){
  const R=W.rr, L=W.L, A=W.C.A, get=worldGET(W), w=L.w;
  R.on=!!W.sw.rrOn;
  const rel=()=>{ const [rc,vc]=rdvCsmAt(get); return [vsub(rc,L.r),vsub(vc,L.v)]; };
  if(R.on){
    const [dr,dv]=rel(), range=vlen(dr), los=m3.tv(L.B,vmul(dr,1/range));              /* the line of sight, LM axes */
    const inBeam=Math.acos(clamp(vdot(rrBore(R.T,R.S),los),-1,1))<RRP.beam&&range<RRP.maxRange;
    R.track=!!(L.ch12&0o20000);
    if(R.track&&inBeam){ if(R.seen<0) R.seen=get; } else if(!(R.good&&R.track)) R.seen=-1;
    const was=R.good, wasT=R.lastTrack;
    R.good=R.track&&R.seen>=0&&get-R.seen>=RRP.lockDelay;
    if(R.good&&!W.seen.lock){ W.seen.lock=get; logEvent(W,'the radar locked on: data good'); }
    if(typeof RR_LOG!=='undefined'&&(was!==R.good||wasT!==R.track)) print('RRLOG '+hms(get)+' track '+R.track+' good '+R.good+' inBeam '+inBeam+' seen '+(R.seen<0?'-':hms(R.seen)));
    R.lastTrack=R.track;
    if(R.good){ const a=rrAngles(los,R.T<-PI/2); R.T=a[0]; R.S=a[1]; }
    else{
      R.S-=w[1]*h; R.T-=(Math.cos(R.S)*w[0]-Math.sin(R.S)*w[2])*h;
      if(W.sw.rrMode==='LGC'&&(L.ch12&0o2)){ R.T+=RRP.K*A.tvcErr(1)*h; R.S+=RRP.K*A.tvcErr(0)*h; }
    }
    R.T=clamp(R.T,RRP.stopT[0],RRP.stopT[1]); R.S=clamp(R.S,RRP.stopS[0],RRP.stopS[1]);
    R.range=range; R.rdot=vdot(dr,dv)/range; R.low=range<RRP.lowMax;
    if(R.good){
      A.radar(1,clamp(Math.round(range/(R.low?RRP.low:8*RRP.low)),0,32767));
      A.radar(2,clamp(Math.round(17000-R.rdot/RRP.rdot),0,32767));
    }
  } else { R.good=false; R.seen=-1; }
  /* its CDUs to the angles (6,400 pulses a second at most), held at zero while channel 12 bit 1 zeroes them; the
     glue keeps one spacing a counter, so it is set for the whole backlog (after a zeroing, up to half a revolution) */
  const nM=h/MCT, ang=[R.T,R.S];
  for(let k=0;k<2;k++){
    const reg=0o35+k, p=A.pending(reg);
    if((L.ch12&0o1)||!R.on){ if(p) A.pulses(reg,-p,13.34); if(L.ch12&0o1) A.setE(reg,0); continue; }
    let dd=((cduCount(ang[k])-A.E(reg)-p)%32768+32768)%32768; if(dd>=16384) dd-=32768;
    if(dd) A.pulses(reg,dd,Math.max(13.34,nM/Math.abs(p+dd)));
  }
}

/* ---- the computer and the ascent stage, one slice: the IMU, the PIPAs, the switches, the jets and the engine ---- */
function rdvApplyOut(W,ch,v){
  const L=W.L;
  if(ch===5) L.ch5=v&0o377;
  else if(ch===6) L.ch6=v&0o377;
  else if(ch===0o11){
    const on=!!(v&0o10000)&&!(v&0o20000);
    if(on&&!L.engOn&&!W.seen.engOn){ W.seen.engOn=worldGET(W); logEvent(W,'ENGINE ON from the computer: the ascent engine lights'); }
    if(!on&&L.engOn){ W.seen.engOff=worldGET(W); logEvent(W,'ENGINE OFF from the computer'); }
    L.engOn=on;
  }
  else if(ch===0o12) L.ch12=v;
}
/* the crew's standing orders: each N49 (a mark that would move the state more than RMAX or VMAX) accepted with PRO; in
   the targeting programs (P32-P35) R61's V50 N18, the tracking attitude asked for again after a burn's attitude hold,
   answered as at P20's start: PRO for the AUTO maneuver, ENTR when it flashes again with the attitude reached */
function rdvStanding(W){
  if(W.keyq.length||!W.autoCrew) return;
  const tgt=W.mm>=32&&W.mm<=35||W.mm===20&&worldGET(W)>getOf(125,0,0);
  if(tgt&&W.mm===20&&cmShowsFor(W,50,72,true,2)&&worldGET(W)-(W.v72At||-1e9)>4){ W.v72At=worldGET(W); logEvent(W,'V50 N72: the radar locked on, PRO'); crewKeys(W,'PRO'); return; }
  if(tgt&&cmShowsFor(W,50,18,true,2)&&worldGET(W)-(W.v50At||-1e9)>4){
    const again=worldGET(W)-(W.v50Pro||-1e9)<90; W.v50At=worldGET(W);
    if(again){ logEvent(W,'V50 N18 again: the tracking attitude reached, ENTR'); crewKeys(W,'ENTR'); W.v50Pro=-1e9; }
    else { logEvent(W,'V50 N18: the radar’s tracking attitude, AUTO maneuver: PRO'); crewKeys(W,'PRO'); W.v50Pro=worldGET(W); }
    return;
  }
  /* a pass's displays (N37 the TTPI found, N58, N59, N75, N81, N82): PRO on each; the pass ends at V16 N45 */
  if(W.passOn){
    if(cmShowsFor(W,16,45,true,0.5)&&W.vnT>W.passT+1){ W.passOn=false; return; }
    for(const n of [37,58,59,75,81,82]) if(cmShowsFor(W,6,n,true,2)&&worldGET(W)-(W.passPro||-1e9)>3){ W.passPro=worldGET(W); crewKeys(W,'PRO'); return; }
  }
  if(cmShowsFor(W,6,49,true,2)&&worldGET(W)-(W.n49At||0)>3){ W.n49At=worldGET(W); W.n49n=(W.n49n||0)+1;
    const r=cmRegs(dskyFace(W.C.S)); (W.n49s||(W.n49s=[])).push([worldGET(W)].concat(r||[]));
    logEvent(W,'N49: '+(r?['ΔR '+fmt(r[0]/10,1)+' nmi','ΔV '+fmt(r[1]/10,1)+' ft/s','the '+['','range','range rate','shaft','trunnion'][r[2]]].join(', '):'')+': accepted, PRO'); crewKeys(W,'PRO'); }
}
function rdvSlice(W,h){
  const L=W.L, C=W.C, A=C.A, nM=h/MCT;
  if(W.pilot) W.pilot(W,h);
  rdvStanding(W);
  A.rhc(0,0,0);
  const ga=lmGimbals(L), ang=[ga.oga,ga.iga,ga.mga];
  for(let k=0;k<3;k++){
    const reg=0o32+k, p=A.pending(reg);
    if(L.ch12&0o20){ if(p) A.pulses(reg,-p,13.34); continue; }
    let dd=((cduCount(ang[k])-A.E(reg)-p)%32768+32768)%32768; if(dd>=16384) dd-=32768;
    if(dd) A.pulses(reg,dd,Math.max(13.34,nM/Math.abs(dd)));
  }
  for(let k=0;k<3;k++){ const n=Math.trunc(L.pipa[k]); if(n){ L.pipa[k]-=n; A.pulses(0o37+k,n,Math.max(26.7,nM/Math.abs(n))); } }
  if(W.rr) rrStep(W,h);
  lmDiscretes(W);
  A.dither(false);
  const ev=W.ev; ev.length=0; const t0=compTime(C);
  compRun(C,h,(ch,v,t)=>{ if(ch===5||ch===6||ch===0o11||ch===0o12) ev.push(ch,v,t-t0); });
  let tc=0;
  for(let i=0;i<ev.length;i+=3){ const te=clamp(ev[i+2],tc,h); lmAdvanceTo(L,te-tc); tc=te; rdvApplyOut(W,ev[i],ev[i+1]); }
  lmAdvanceTo(L,h-tc);
  A.thrustTake();
  if(L.liftoff&&!W.seen.liftoff){ W.seen.liftoff=L.liftoff; logEvent(W,'liftoff: the ascent stage leaves the descent stage',L.liftoff); }
  lgcAlarms(W);
}

/* ---- what the views draw ---- */
function rdvSample(W){
  const A=W.C.A, L=W.L, t=W.t, get=worldGET(W), mm=lgcProg(W);
  if(mm!==null&&mm!==W.mm){ W.mm=mm; if(!W.seen['p'+mm]){ W.seen['p'+mm]=get; logEvent(W,progName('L',mm)); } }
  const F=dskyFace(W.C.S);
  cmTrackVN(W,F,get);
  const cap=(key,v,n,fl,sec,ms,nr)=>{ if(!W.disp[key]&&cmShowsFor(W,v,n,fl,sec)){ const r=cmRegs(F,ms,nr); if(r) W.disp[key]={get,r}; } };
  cap('n76',6,76,true,1); cap('n63',16,63,true,1); cap('n85',16,85,true,1); cap('n44',16,44,true,2,true);
  /* the targeting programs' passes: N37, N58, N59, N81, N82 once each has stood a second (tenths of ft/s, nmi; N37 the
     time) with the times and DIFFALT behind them: W.passes, in order */
  if(W.passOn&&W.mm>=32&&W.mm<=35) for(const n of [37,58,59,81,82]) if(cmShowsFor(W,6,n,true,1)){
    const P=W.passes||(W.passes=[]), last=rdvLast(W,W.mm,n);
    if(last&&get-last.get<30) continue;
    const r=cmRegs(F); if(!r) continue;
    P.push({mm:W.mm,n,get,r,tcsi:agcDP(A,L99.TCSI,28)/100,tcdh:agcDP(A,L99.TCDH,28)/100,ttpi:agcDP(A,L99.TTPI,28)/100,dh:agcDP(A,L99.DIFFALT,29),tig:agcDP(A,L99.TIG,28)/100});
  }
  if(cmShowsFor(W,6,74,false,0.5)){ const r=cmRegs(F,true); if(r) W.disp.n74=r; }
  if(L.F>0&&!W.seen.thrust) W.seen.thrust=get;
  if(!W.seen.mark1&&W.seen.lock&&A.E(L99.MARKCTR)>0){ W.seen.mark1=get; logEvent(W,'the first mark taken'); }
  if(!W.seen.cdhFinal&&rdvCount(W,33,81)>=2) W.seen.cdhFinal=get;
  if(W.seen.thrust&&L.F===0&&!W.seen.tailEnd){ W.seen.tailEnd=get; W.ins=rdvInsertionState(W); logEvent(W,'insertion: '+fmt(W.ins.h/FT,0)+' ft, '+fmt(W.ins.hdot/FT,1)+' ft/s up, '+fmt(W.ins.v/FT,1)+' ft/s across'); }
  const every=W.seen.thrust&&!W.seen.tailEnd?0.2:2;
  if(Math.floor(t/every+1e-9)!==Math.floor((t-LM_SLICE)/every+1e-9)){
    /* [GET, position, height above Landing Site 2's radius (m), its rate (m/s), the speed across (m/s), the program,
       thrust (N), mass (kg)] */
    const up=vunit(L.r), vr=vdot(L.v,up);
    W.track.push([get,L.r.slice(),vlen(L.r)-A11R.rls2,vr,vlen(vsub(L.v,vmul(up,vr))),mm,L.F,L.m]);
    if(W.track.length>40000) W.track.shift();
  }
}
/* the insertion: height above Landing Site 2's radius, its rate, the speed across (MR Table 5-V's terms) */
function rdvInsertionState(W){ const L=W.L, up=vunit(L.r), vr=vdot(L.v,up);
  return {get:worldGET(W), h:vlen(L.r)-A11R.rls2, hdot:vr, v:vlen(vsub(L.v,vmul(up,vr))), m:L.m, r:L.r.slice(), vv:L.v.slice()}; }

/* ---- the crew: the residuals trimmed on the translation hand controller, one axis at a time, the largest first:
   held for the time the RCS takes to null it (4 jets in X, 2 in Y and Z), then a look at N85's next update; done when
   each is inside half a foot per second.  (A tighter trim chases P12's VG: its RDOTD is the insertion's, and past
   perilune the LM's radial rate grows a tenth of a foot per second each second, so N85's Z keeps coming back and
   each pulse down moves the apolune a few seconds later); after a P41 burn (W.trimTol) to a fifth.  X takes four jets
   or two as DAPBOOLS' ACC4OR2X has it (P12 sets four; the crew's V48 two), Y and Z two ---- */
function rdvTrim(W,h){

  if(T.hold>0){ T.hold-=h; if(T.hold<=0){ sw.thc=[0,0,0]; T.wait=2.5; } return; }
  if(T.wait>0){ T.wait-=h; return; }

  if(!r||!cmShowsFor(W,16,85,true,0.5)) return;

  if(Math.abs(v[k])<=(W.trimTol||0.5)){ W.trimmed=true; W.pilot=null; sw.thc=[0,0,0]; return; }
  const acc=(k===0&&(W.C.A.E(L99.DAPBOOLS)&0o2000)?4:2)*LMP.jetF/W.L.m/FT;          /* ft/s^2 */

/* ---- the crew's RCS burn (P41): N85's largest component held on the translation controller until the rate read
   off N85's updates (every 2 s) says it would pass a third of a foot per second; then the next axis after N85's next
   update; under 1 ft/s, the trim to 0.2 ft/s (rdvTrim) ---- */
function rdvBurn(W,h){
  const B=W.burn||(W.burn={k:-1,v:null,t:0,rate:0,stop:-1}), sw=W.sw, t=worldGET(W);
  const bl=W.burnLog&&W.burnLog[W.burnLog.length-1];
  if(bl&&!bl.end&&sw.thc&&sw.thc.some(x=>x)) bl.fire=(bl.fire||0)+h;     /* the controller's time in the main burn */
  const r=cmShowsFor(W,16,85,true,0.2)||cmShowsFor(W,16,85,false,0.2)?cmRegs(dskyFace(W.C.S)):null;
  if(r){ const v=r.map(x=>x/10);
    if(!B.v||v.some((x,i)=>x!==B.v[i])){ if(B.v&&B.k>=0){ const d=Math.abs(B.v[B.k])-Math.abs(v[B.k]), dt=t-B.t; if(dt>0.5&&d>0) B.rate=d/dt; } B.v=v; B.t=t; } }
  if(!B.v) return;
  if(B.k<0){
    if(B.t<B.stop+0.1) return;                                          /* wait for a fresh N85 after an axis */
    let k=0; for(let i=1;i<3;i++) if(Math.abs(B.v[i])>Math.abs(B.v[k])) k=i;
    if(Math.abs(B.v[k])<=1){ W.trim=null; W.trimTol=0.2; W.pilot=rdvTrim; return; }
    B.k=k; B.rate=0; sw.thc=[0,0,0]; sw.thc[k]=Math.sign(B.v[k]); return;
  }

/* ---- the braking ("the planned braking was used for the approach to station-keeping", MR p. 5-11; Table 7-V: the

   the radar's range on -Z (R61 keeps +Z on Columbia), the line of sight's drift nulled on X and Y once inside two

const RDV_GATES=[[5000,30],[2500,15],[1000,6],[400,3],[150,0]];
function rdvGate(Rft){ const G=RDV_GATES; if(Rft>=G[0][0]) return Infinity;
  for(let i=1;i<G.length;i++) if(Rft>=G[i][0]){ const a=G[i-1], b=G[i]; return b[1]+(a[1]-b[1])*(Rft-b[0])/(a[0]-b[0]); }

/* the braking switches on above the gate and off below it, by margins that shrink with the gate (1 and 0.3 ft/s from

    Y=clamp(Y,hh,H-hh);

    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));

/* ---- orbit camera, perspective projection (z-up) — pulsar.html, unchanged (v3 is in the utilities) ---- */
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  /* the corner: an x tick at the left edge and a y tick at the bottom edge put their labels on each other
     (loop_quantum_gravity's Known-bad); the y tick gives way */
  const Xof=t=>b.x+b.w*(t-xlo)/(xhi-xlo||1), Yof=t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1);
  if(xt.some(t=>Math.abs(Xof(t)-b.x)<16)) yt=yt.filter(t=>Math.abs(Yof(t)-b.y1)>=7);
  o.xticks=xt; o.yticks=yt;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  drawing the DSKY                                                  *
 * ================================================================== *
 * Layout of the Block II DSKY: the caution and status lamps upper left
 * (the LM's has ALT and VEL where the CM's has blank lamps, and on
 * Apollo 11 two more blank ones), the electroluminescent display upper
 * right (COMP ACTY, PROG,
 * VERB, NOUN, three registers of a sign and five digits), and nineteen
 * keys below: VERB and NOUN on the left, + - 0-9 CLR PRO KEY REL in
 * three rows, ENTR and RSET on the right.  The digits are seven-segment
 * shapes drawn here; the AGC sent PINBALL's 5-bit relay codes for them
 * (PINBALL p.397), which `SEG_OF_RELAY` decodes below.
 */
const DSKY_LAMPS={
  /* Apollo 11's LM DSKY: the two positions later DSKYs label PRIO DISP and NO DAP were unlabelled, and Luminary 099
     never lights them (V35's TSTCON words leave them out) */
  L:[['UPLINK ACTY','uplinkActy',0],['TEMP','temp',1],['NO ATT','noAtt',0],['GIMBAL LOCK','gimbalLock',1],
     ['STBY','stby',0],['PROG','prog',1],['KEY REL','keyRel',0],['RESTART','restart',1],['OPR ERR','oprErr',0],
     ['TRACKER','tracker',1],['','prioDisp',0],['ALT','alt',1],['','noDap',0],['VEL','vel',1]],
  C:[['UPLINK ACTY','uplinkActy',0],['TEMP','temp',1],['NO ATT','noAtt',0],['GIMBAL LOCK','gimbalLock',1],
     ['STBY','stby',0],['PROG','prog',1],['KEY REL','keyRel',0],['RESTART','restart',1],['OPR ERR','oprErr',0],
     ['TRACKER','tracker',1],['','',0],['','',1],['','',0],['','',1]]};
/* the keyboard: [label lines, key, column, row (half rows on the outer columns)] */
const DSKY_KEYS=[
  [['VERB'],'VERB',0,0.5],[['NOUN'],'NOUN',0,1.5],
  [['+'],'+',1,0],[['7'],'7',2,0],[['8'],'8',3,0],[['9'],'9',4,0],[['CLR'],'CLR',5,0],
  [['−'],'-',1,1],[['4'],'4',2,1],[['5'],'5',3,1],[['6'],'6',4,1],[['PRO'],'PRO',5,1],
  [['0'],'0',1,2],[['1'],'1',2,2],[['2'],'2',3,2],[['3'],'3',4,2],[['KEY','REL'],'KEYREL',5,2],
  [['ENTR'],'ENTR',6,0.5],[['RSET'],'RSET',6,1.5]];
/* PINBALL's output relay codes, 5 bits per digit (p.397) -> segments a b c d e f g lit.
   The relay code is what the AGC actually sent; the segment pattern is the DSKY's decoding of it. */
const RELAY_OF_DIGIT={'':0b00000,'0':0b10101,'1':0b00011,'2':0b11001,'3':0b11011,'4':0b01111,'5':0b11110,
                      '6':0b11100,'7':0b10011,'8':0b11101,'9':0b11111};
const SEG_OF_DIGIT={'':'','0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg',
                    '6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg'};

const DSKY_COL={face:'#5c5f66',faceEdge:'#33363c',window:'#0a0d0b',lampOff:'#2b2d31',lampOffText:'#6a6e75',
  lampWhite:'#efeee6',lampAmber:'#f0b23c',lampText:'#16181b',key:'#d8d5cb',keyDown:'#a9a69c',keyText:'#17181a',
  el:'#4cf07a',elDim:'#0f2615',label:'#49e676'};

/* draw a seven-segment digit in box (x, y, w, h) */
function drawSeg7(ctx,x,y,w,h,ch,on){
  const t=Math.max(1.6,w*0.17), g=t*0.35;
  const segs=SEG_OF_DIGIT[ch]||'';
  const P={
    a:[[x+g+t*0.5,y],[x+w-g-t*0.5,y],[x+w-g-t,y+t],[x+g+t,y+t]],
    d:[[x+g+t,y+h-t],[x+w-g-t,y+h-t],[x+w-g-t*0.5,y+h],[x+g+t*0.5,y+h]],
    g:[[x+g+t*0.5,y+h/2],[x+g+t,y+h/2-t/2],[x+w-g-t,y+h/2-t/2],[x+w-g-t*0.5,y+h/2],[x+w-g-t,y+h/2+t/2],[x+g+t,y+h/2+t/2]],
    f:[[x,y+g+t*0.5],[x+t,y+g+t],[x+t,y+h/2-g-t/2],[x,y+h/2-g]],
    e:[[x,y+h/2+g],[x+t,y+h/2+g+t/2],[x+t,y+h-g-t],[x,y+h-g-t*0.5]],
    b:[[x+w,y+g+t*0.5],[x+w,y+h/2-g],[x+w-t,y+h/2-g-t/2],[x+w-t,y+g+t]],
    c:[[x+w,y+h/2+g],[x+w,y+h-g-t*0.5],[x+w-t,y+h-g-t],[x+w-t,y+h/2+g+t/2]]};
  for(const s of 'abcdefg'){
    const lit=on&&segs.indexOf(s)>=0;
    ctx.fillStyle=lit?DSKY_COL.el:DSKY_COL.elDim;
    ctx.beginPath(); const p=P[s]; ctx.moveTo(p[0][0],p[0][1]);
    for(let k=1;k<p.length;k++) ctx.lineTo(p[k][0],p[k][1]);
    ctx.closePath(); ctx.fill();
  }
}
function drawSign(ctx,x,y,w,h,s,on){
  const t=Math.max(1.6,w*0.17);
  ctx.fillStyle=(on&&(s==='+'||s==='-'))?DSKY_COL.el:DSKY_COL.elDim;
  ctx.fillRect(x+w*0.08,y+h/2-t/2,w*0.84,t);
  ctx.fillStyle=(on&&s==='+')?DSKY_COL.el:DSKY_COL.elDim;
  ctx.fillRect(x+w/2-t/2,y+h*0.18,t,h*0.64);
}
/* a rounded rectangle as a polygon (the display-list recorders have no arcTo) */
function rrect(ctx,x,y,w,h,r){
  const c=[[x+w-r,y+r,-PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,PI/2],[x+r,y+r,PI]];
  ctx.beginPath();
  c.forEach(([cx,cy,a0],i)=>{ for(let k=0;k<=4;k++){ const a=a0+k*PI/8, px=cx+r*Math.cos(a), py=cy+r*Math.sin(a);
    if(i===0&&k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); } });
  ctx.closePath();
}

/* the whole DSKY in box b; returns the key hit boxes.  `blinkOn` is the phase of the V/N flash;
   `pressed` names a key drawn pressed (for a moment after a press). */
function drawDsky(ctx,b,D,blinkOn,pressed,caption){
  const u=Math.min(b.w,b.h/1.12);                              /* the DSKY is about as wide as tall */
  const X=b.x+(b.w-u)/2, Y=b.y;
  const s=v=>v*u;
  ctx.save();
  /* the face */
  ctx.fillStyle=DSKY_COL.face; rrect(ctx,X,Y,u,s(1.08),s(0.03)); ctx.fill();
  ctx.strokeStyle=DSKY_COL.faceEdge; ctx.lineWidth=2; rrect(ctx,X,Y,u,s(1.08),s(0.03)); ctx.stroke();
  for(const [cx,cy] of [[0.025,0.025],[0.975,0.025],[0.025,1.055],[0.975,1.055]]){
    ctx.fillStyle='#3d4046'; ctx.beginPath(); ctx.arc(X+s(cx),Y+s(cy),s(0.009),0,TAU); ctx.fill(); }
  /* the lamp window */
  const lx=X+s(0.05), ly=Y+s(0.05), lw=s(0.40), lh=s(0.48);
  ctx.fillStyle='#1b1d20'; ctx.fillRect(lx,ly,lw,lh);
  const lamps=DSKY_LAMPS[D.vkey];
  const cw=(lw-s(0.03))/2, rh=(lh-s(0.02))/7;
  const lampFont=Math.max(7,Math.round(s(0.026)));
  for(let i=0;i<lamps.length;i++){
    const [name,key,amber]=lamps[i], col=i%2, row=Math.floor(i/2);
    const x=lx+s(0.01)+col*(cw+s(0.01)), y=ly+s(0.01)+row*rh, w=cw, h=rh-s(0.012);
    const on=key&&D.lamps[key];
    ctx.fillStyle=on?(amber?DSKY_COL.lampAmber:DSKY_COL.lampWhite):DSKY_COL.lampOff;
    ctx.fillRect(x,y,w,h);
    if(name){
      ctx.fillStyle=on?DSKY_COL.lampText:DSKY_COL.lampOffText;
      ctx.font='600 '+lampFont+'px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const words=name.split(' ');
      if(words.length>1&&ctx.measureText(name).width>w*0.92){
        /* two lines: a font the lamp's height can hold, so the lines cannot overlap on a small DSKY */
        const f2=Math.min(lampFont,h/2.3); ctx.font='600 '+f2.toFixed(1)+'px -apple-system, sans-serif';
        ctx.fillText(words[0],x+w/2,y+h/2-0.58*f2); ctx.fillText(words.slice(1).join(' '),x+w/2,y+h/2+0.58*f2);
      } else ctx.fillText(name,x+w/2,y+h/2);
    }
  }
  /* the electroluminescent window */
  const ex=X+s(0.48), ey=Y+s(0.05), ew=s(0.47), eh=s(0.48);
  ctx.fillStyle=DSKY_COL.window; ctx.fillRect(ex,ey,ew,eh);
  const lab=(t,x,y,w,h)=>{ ctx.fillStyle=DSKY_COL.label; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#0a0d0b'; ctx.font='700 '+Math.max(7,Math.round(s(0.024)))+'px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x+w/2,y+h/2+0.5); };
  /* COMP ACTY */
  const caX=ex+s(0.025), caY=ey+s(0.02), caW=s(0.15), caH=s(0.10);
  ctx.fillStyle=D.compActy?DSKY_COL.label:DSKY_COL.elDim; ctx.fillRect(caX,caY,caW,caH);
  ctx.fillStyle=D.compActy?'#0a0d0b':'#1d3a24'; ctx.font='700 '+Math.max(7,Math.round(s(0.022)))+'px -apple-system, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('COMP',caX+caW/2,caY+caH*0.35); ctx.fillText('ACTY',caX+caW/2,caY+caH*0.68);
  /* PROG */
  const dw=s(0.042), dh=s(0.062), dg=s(0.009);
  const pX=ex+ew-s(0.025)-2*dw-dg;
  lab('PROG',pX-s(0.005),ey+s(0.02),2*dw+dg+s(0.01),s(0.032));
  const flashOff=D.flash&&!blinkOn;
  const show=(arr,x,y,on)=>{ drawSeg7(ctx,x,y,dw,dh,arr[0],on); drawSeg7(ctx,x+dw+dg,y,dw,dh,arr[1],on); };
  show(D.md,pX,ey+s(0.058),true);
  /* VERB and NOUN */
  const vX=ex+s(0.03), nX=pX, vY=ey+s(0.136);
  lab('VERB',vX-s(0.005),vY,2*dw+dg+s(0.01),s(0.032)); lab('NOUN',nX-s(0.005),vY,2*dw+dg+s(0.01),s(0.032));
  show(D.vd,vX,vY+s(0.038),!flashOff); show(D.nd,nX,vY+s(0.038),!flashOff);
  /* the three registers, each under a thin line; R3 ends 0.47 u below the window top, inside its 0.48 u */
  const rX=ex+s(0.03), rStep=s(0.073), rY0=ey+s(0.262);
  for(let k=0;k<3;k++){
    const y=rY0+k*rStep;
    ctx.fillStyle=DSKY_COL.label; ctx.fillRect(ex+s(0.02),y-s(0.009),ew-s(0.04),Math.max(1,s(0.004)));
    drawSign(ctx,rX,y,dw*0.9,dh,D.rs[k],true);
    for(let i=0;i<5;i++) drawSeg7(ctx,rX+dw+dg+i*(dw+dg),y,dw,dh,D.rd[k][i],true);
  }
  /* the keyboard */
  const hits=[];
  const kw=s(0.115), kh=s(0.105), kx0=X+s(0.035), ky0=Y+s(0.565), kdx=s(0.1325), kdy=s(0.165);
  for(const [lines,key,col,row] of DSKY_KEYS){
    const x=kx0+col*kdx, y=ky0+row*kdy, down=pressed===key;
    ctx.fillStyle='#2e3136'; rrect(ctx,x+1.5,y+2,kw,kh,s(0.012)); ctx.fill();
    ctx.fillStyle=down?DSKY_COL.keyDown:DSKY_COL.key; rrect(ctx,x+(down?1:0),y+(down?1.5:0),kw,kh,s(0.012)); ctx.fill();
    ctx.fillStyle=DSKY_COL.keyText; ctx.textAlign='center'; ctx.textBaseline='middle';
    const big=/^[0-9+−]$/.test(lines[0]);
    ctx.font=(big?'700 '+Math.round(s(0.05)):'700 '+Math.max(7,Math.round(s(0.03))))+'px -apple-system, sans-serif';
    if(lines.length===1) ctx.fillText(lines[0],x+kw/2+(down?1:0),y+kh/2+(down?1.5:0)+0.5);
    else { ctx.fillText(lines[0],x+kw/2,y+kh*0.34); ctx.fillText(lines[1],x+kw/2,y+kh*0.68); }
    hits.push({key,x,y,w:kw,h:kh});
  }
  if(caption){
    ctx.fillStyle='#8b93a6'; ctx.font='italic 12px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(plain(caption),X+u/2,Y+s(1.08)+6);
  }
  ctx.restore();
  return {hits,x:X,y:Y,w:u,h:s(1.08)};
}
function dskyHit(hits,x,y){
  for(const k of hits) if(x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h) return k.key;
  return null;
}

/* ================================================================== *
 *  the views: the DSKY on the left, the view's picture beside it     *
 * ================================================================== */
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6', text:'#cfd4de', faint:'#3a4256',
  grid:'#181d29', box:'#232838', warn:'#f0b23c', alarm:'#ff7a6b', lgc:'#cd35c4', truth:'#b8ec4c', nominal:'#e8843a'};
const RO_W=300;
const MONO='10.5px "SF Mono", Menlo, monospace';

/* the stage: the DSKY at the left under the tag; the picture between it and the readout column; the caption under
   the picture; the event log under the DSKY */
function stageBoxes(ctx,W,H,capFull,capShort){
  const narrow=W<900, top=40;
  const u=narrow?clamp(Math.min(W*0.52,(H-top-60)*0.48/1.08),190,320):clamp(Math.min(W*0.29,(H-top-70)/1.08),220,380);
  const dsky=box(14,top,u,u*1.08);
  const sx=narrow?40:14+u+40, sxr=narrow?W-16:W-RO_W-34;
  const capW=Math.max(220,sxr-sx);
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+200);
  const sy=narrow?dsky.y1+46:top+18;
  const scene=box(sx,sy,Math.max(120,sxr-sx),Math.max(60,fit.capY-24-sy));
  const logTop=dsky.y1+18;
  const log=narrow?null:box(14,logTop,u,Math.max(0,H-34-logTop));
  return {narrow,dsky,scene,log,capY:fit.capY,capTxt:fit.txt,capW,capX:sx};
}

/* the DSKY, keyed by the world, with the key just pressed drawn down for a moment.  A real computer's DSKY is its
   relays (dskyFace): the verb/noun flash is the DSKY's own (yaAGC's channel 163), not the page's blink */
function drawWorldDsky(ctx,b,W,blinkOn){
  const pressed=W.lastKey&&W.t-W.lastKey.t<0.25?W.lastKey.k:null;
  if(W.lgc) return drawDsky(ctx,b,dskyFace(W.C.S),false,pressed);
  return drawDsky(ctx,b,W.D,blinkOn,pressed);
}
/* the event log: GET and what happened, newest at the bottom; the crew's and Houston's words in white */
function drawLog(ctx,b,W,n){
  if(!b||b.h<40||!W.events.length) return;
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='top';
  const rows=Math.max(0,Math.floor((b.h-18)/14)), ev=W.events.slice(-Math.min(rows,n||rows));
  ctx.fillStyle='#6f7789'; ctx.font='italic 12px Georgia, serif'; ctx.fillText('what happened',b.x,b.y);
  ctx.font='10.5px -apple-system, sans-serif';
  let y=b.y+18;
  for(const e of ev){
    ctx.fillStyle='#6f7789'; ctx.fillText(hmsShort(e.get),b.x,y);
    ctx.fillStyle=/PROG|depleted/.test(e.s)?COL.alarm:/^(Aldrin|Armstrong|Collins|Houston):/.test(e.s)?'#f2f3f7':'#9aa2b4';
    const t=plain(e.s), maxW=b.w-62;
    let s=t; while(s.length>4&&ctx.measureText(s).width>maxW) s=s.slice(0,-2);
    if(s!==t) s=s.slice(0,-1)+'…';
    ctx.fillText(s,b.x+60,y); LABELS.push([b.x,y,b.x+b.w,y+12]);
    y+=14;
  }
  ctx.restore();
}
/* a plot title above a box, registered */
function plotTitle(ctx,b,t){
  ctx.save(); ctx.font='italic 13px Georgia, serif'; ctx.fillStyle='#aeb6c6'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  const s=plain(t); ctx.fillText(s,b.x,b.y-4); LABELS.push([b.x,b.y-4-15,b.x+s.length*13*0.52,b.y-4]); ctx.restore();
}
/* a legend as a row of swatches at (x, y), registered; returns its width */
function legendRow(ctx,x,y,items,maxX){
  ctx.save(); ctx.font='10.5px -apple-system, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  let X=x;
  for(const [col,txt] of items){
    const t=plain(txt), w=ctx.measureText(t).width;
    if(maxX&&X+16+w>maxX) break;
    ctx.fillStyle=col; ctx.fillRect(X,y-4.5,9,9); ctx.fillStyle='#9aa2b4'; ctx.fillText(t,X+13,y);
    LABELS.push([X,y-7,X+13+w,y+7]); X+=13+w+14;
  }
  ctx.restore(); return X-x;
}

/* ---------------------------------------------------------------- the keyboard view: PINBALL's state */
/* the real PINBALL's states, as its own erasable shows them (pinballOf, p2_agc.js); a request answered and an
   extended verb starting are held on the diagram a moment (lgcSample) so they can be seen */
const PB_NODES=[
  ['idle','waiting for a verb',0,0],['verb','VERB: two digits into VERBREG',1,0],['noun','NOUN: two digits into NOUNREG',2,0],
  ['lock','DSPLOCK: the keys hold the display',3,0],
  ['disp','display: V01–V07',0,1],['mon','monitor (MONSAVE): V11–V17, every second',1,1],['load','load (REQRET): V21–V25, R1 → R2 → R3',2,1],
  ['ext','an extended verb: V40–V99',3,1],
  ['mm','V37 (REQMM): two digits, a new program',0,2],['req','a program asks (CADRSTOR): flashing V/N',1,2],['answer','answered: PRO · ENTR · V32 · V34',2,2],
  ['err','OPR ERR → RSET',3,2]];
const pinballState=W=>W.pb?W.pb.shown:'idle';
/* the verb and the noun on the display in the listing's own words (ASSEMBLY_AND_OPERATION_INFORMATION's lists), each
   register's line beside what its digits read */
function meaningLines(D){
  const T=AGC_TABLES[D.vkey], out=[];
  const vs=D.vd.join(''), ns=D.nd.join('');
  const v=/^[0-9]{2}$/.test(vs)?+vs:-1, n=/^[0-9]{2}$/.test(ns)?+ns:-1;
  if(v>=0) out.push({k:'V'+pad2(v),t:T.verbs[v]||'SPARE'});
  if(n>=0){
    const r=nounRec(D,n), txt=(T.nouns[n]&&T.nouns[n][5])||['SPARE'];
    if(!r||r.kind==='spare'){ out.push({k:'N'+pad2(n),t:'SPARE'}); return out; }
    for(let k=0;k<Math.max(txt.length,Math.min(3,r.ncomp));k++){
      const line={k:k===0?'N'+pad2(n):'',t:txt[k]||''};
      if(k<Math.min(3,r.ncomp)){ const f=compFormat(D.vkey,r,k), d=D.rd[k], ms=/^xxbxx$/i.test(f[0]);
        /* five digits, or for minutes and seconds (xxBxx) four with the middle one blank */
        const full=ms?[0,1,3,4].every(i=>/^[0-9]$/.test(d[i])):d.every(c=>/^[0-9]$/.test(c));
        if(full) line.read='R'+(k+1)+' '+(D.rs[k]||' ')+(ms?d[0]+d[1]+' '+d[3]+d[4]:d.join(''))+'  →  '+readReg(D,k,f,r.comps[k]); }
      out.push(line);
    }
  }
  if(v===50&&n===25){ const c=D.r1oct; for(const x of T.checklist) if(x[0]===c) out.push({k:'code',t:c+'  '+x[1]}); }
  if(n===9) for(let k=0;k<3;k++){ const c=D.failreg[k]&0o77777; if(c){ const a=T.alarms[octal5(c)]; out.push({k:'alarm',t:octal5(c)+'  '+(a?a[0][1]:'NOT IN THE LIST')}); } }
  return out;
}

/* a noun's name from its noun-list lines: each line's words up to its format code (3COMP, OCTAL, xxx.xx, ...),
   joined; "LATITUDE, / LONGITUDE, / ALTITUDE" becomes LATITUDE, LONGITUDE, ALTITUDE */
function nounName(lines){
  const parts=[];
  for(const ln of lines){
    const w=[];
    for(const tok of ln.split(/\s+/)){ if(/^([0-9]COMP|OCTAL|\+\/-|\(.*)$/.test(tok)||/[xX]{2}/.test(tok)) break; w.push(tok); }
    const s=w.join(' ').replace(/,\s*$/,'').trim();
    if(s) parts.push(s);
  }
  return parts.join(', ');
}
/* a register's digits read with the noun's decimal point, as the crew read them from the noun list */
function readReg(D,k,f,c){
  const s=D.rs[k], dd=D.rd[k], d=dd.join('');
  /* minutes and seconds: the middle digit is blank, so read by position */
  if(f[0]==='xxbxx'||f[0]==='xxBxx') return (s==='-'?'−':'')+(+(dd[0]+dd[1]))+' min '+dd[3]+dd[4]+' s';
  if(d.length<5||/[^0-9]/.test(d)) return s+d;
  if(c&&c.rout==='OCT') return 'octal, '+parseInt(d,8)+' in decimal';
  const dec=fmtDecimals(f[0]);
  const num=+d/Math.pow(10,dec);
  return (s==='-'?'−':'')+num.toFixed(dec)+(f[1]?' '+f[1].toLowerCase():'');
}

  /* the approach against time: the LM, the LGC's altitude, and Aldrin's call-outs */

const JOB_FAMILY=[
  [/^SERVICER:(LRVJOB|LRHJOB)$/,'LR read','rgba(240,178,60,0.22)'],            /* R12's landing-radar read jobs */
  [/^SERVICER:HIGATJOB$/,'LR antenna','rgba(240,178,60,0.22)'],
  [/^(SERVICER|LUNAR_LANDING_GUIDANCE_EQUATIONS|FINDCDUW--GUIDAP_INTERFACE|POWERED_FLIGHT_SUBROUTINES|THROTTLE_CONTROL_ROUTINES|IMU_COMPENSATION_PACKAGE|MEASUREMENT_INCORPORATION|THE_LUNAR_LANDING)$/,'SERVICER','rgba(184,236,76,0.24)'],
  [/^DISPLAY_INTERFACE_ROUTINES$/,'display','rgba(90,200,224,0.24)'],
  [/^PINBALL_GAME_BUTTONS_AND_LIGHTS$/,'PINBALL','rgba(205,53,196,0.24)'],

function jobFamily(j){

}
function drawAlarmsView(ctx,L,W,S,Wd,Hd){

  ctx.restore();
  const cs={y1:y0-30};

  const Tb=box(b.x+42,cs.y1+46,b.w-54,Math.max(60,(b.y1-cs.y1-46)*0.55-34));
  axesT(ctx,Tb,0,30,0,100,{title:titleFor(Tb,'the computer’s time, each 2 s (the last minute)','the computer’s time'),

  const H=W.execHist, bw=Tb.w/30;
  for(let i=0;i<H.length;i++){
    const c=H[i], jobs=c.acty*(1-c.rr-c.other), x=Tb.x+(30-H.length+i)*bw+1;
    let y=Tb.y1;
    for(const [v,col] of [[jobs,'rgba(184,236,76,0.75)'],[c.rr,'rgba(232,132,58,0.85)'],[c.other,'rgba(90,200,224,0.8)'],[Math.max(0,1-jobs-c.rr-c.other),'rgba(58,66,86,0.6)']]){
      const hh=Tb.h*v; ctx.fillStyle=col; ctx.fillRect(x,y-hh,bw-2,hh); y-=hh; }
  }
  legendRow(ctx,Tb.x,Tb.y1+38,[['rgba(184,236,76,0.75)','jobs (COMP ACTY)'],['rgba(232,132,58,0.85)','the radar’s CDUs'],
    ['rgba(90,200,224,0.8)','other counters'],['rgba(58,66,86,0.9)','idle']],Tb.x1);
  /* the alarms after PDI: the flight's and this run's */
  const Al=box(b.x+42,Tb.y1+76,b.w-54,Math.max(40,b.y1-(Tb.y1+76)-26));
  const g0=A11L.tig, g1=A11L.contact+30;
  axesT(ctx,Al,0,(g1-g0)/60,0,2,{title:titleFor(Al,'program alarms after PDI: the flight’s, and this run’s','the alarms'),
    xlab:'minutes after PDI ignition',yticks:[],ny:2,xfmt:v=>fmt(v,0)});
  for(const [g] of A11L.alarms){ const x=Al.x+Al.w*(g-g0)/(g1-g0); ctx.fillStyle=COL.ref; ctx.fillRect(x-1,Al.y+Al.h*0.12,2.5,Al.h*0.3); }
  const mine=lgcFlightAlarms(W);
  for(const a of mine){ const x=Al.x+Al.w*(a.get-g0)/(g1-g0); if(x<Al.x||x>Al.x1) continue;
    ctx.fillStyle=COL.alarm; ctx.fillRect(x-1,Al.y+Al.h*0.58,2.5,Al.h*0.3); }
  lab(ctx,Wd,Hd,Al.x+6,Al.y+Al.h*0.27,'the flight (MR Table 5-I)',COL.ref,SM_FONT,'left');
  lab(ctx,Wd,Hd,Al.x+6,Al.y+Al.h*0.73,mine.length?'this run':'this run: none yet',COL.alarm,SM_FONT,'left');
  const now=Al.x+Al.w*(worldGET(W)-g0)/(g1-g0);
  if(now>=Al.x&&now<=Al.x1){ ctx.strokeStyle=COL.live; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(now,Al.y); ctx.lineTo(now,Al.y1); ctx.stroke(); }
}

/* ---------------------------------------------------------------- the way out: the coast and LOI */
function drawOutView(ctx,L,W,S,Wd,Hd){
  const b=L.scene, K=W.K, T=W.track, get=worldGET(W), H=loiHyperbola(), tig=A11O.tig;
  /* LOI-1 behind the Moon, to scale, in the arrival's plane, the Earth to the left */
  const A=box(b.x+44,b.y+18,b.w-56,Math.max(110,b.h*0.46-30));
  /* narrow, the readout floats over the stage's top right (to y 470): the short title */
  plotTitle(ctx,A,L.narrow?'LOI-1 behind the Moon (to scale)':titleFor(A,'LOI-1 behind the Moon (to scale; the Earth is off to the left)','LOI-1 behind the Moon'));
  const ed=loiEarthDir(get), psi=Math.atan2(vdot(ed,H.Q),vdot(ed,H.P)), cr=Math.cos(PI-psi), sr=Math.sin(PI-psi);
  const R2=r=>{ const x=vdot(r,H.P), y=vdot(r,H.Q); return [cr*x-sr*y,sr*x+cr*y]; };
  const span=Math.max(9000e3,(A.w/A.h)*5200e3), s2=Math.min(A.w/span,A.h/5200e3);
  const ox=A.x+A.w/2, oy=A.y+A.h/2, Q=r=>{ const q=R2(r); return [ox+q[0]*s2,oy-q[1]*s2]; };
  ctx.save(); ctx.fillStyle='#090d1a'; ctx.fillRect(A.x,A.y,A.w,A.h);
  /* the Moon's radio shadow: no line of sight to the Earth */
  ctx.fillStyle='rgba(232,132,58,0.08)'; ctx.fillRect(ox,oy-1737.4e3*s2,A.x1-ox,2*1737.4e3*s2);
  ctx.strokeStyle='#1e2433'; ctx.strokeRect(A.x+0.5,A.y+0.5,A.w-1,A.h-1); ctx.restore();
  lab(ctx,Wd,Hd,A.x1-8,oy+1737.4e3*s2+12,'no line of sight to the Earth',COL.ref,SM_FONT,'right');
  dot(ctx,ox,oy,1737.4e3*s2,'#5d5d5a','#8f8f8a',1);
  const tPath=(pts,col,lw,dash)=>{ ctx.beginPath(); let prev=null;
    for(const p of pts){ const q=Q(p); if(q[0]<A.x||q[0]>A.x1||q[1]<A.y||q[1]>A.y1){ prev=null; continue; }
      if(prev){ ctx.lineTo(q[0],q[1]); POLY_SEGS.push(prev[0],prev[1],q[0],q[1]); } else ctx.moveTo(q[0],q[1]); prev=q; }
    ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); };
  /* the arrival as it would have gone on (the free return), the flown track, the burn, the orbit after */
  const hyp=[]; for(let g=H.tp-2*3600;g<=H.tp+2*3600;g+=30) hyp.push(loiTruthAt(g)[0]);
  tPath(hyp,'rgba(90,200,224,0.55)',1.1,[4,4]);
  tPath(T.filter(p=>!W.seen.thrust||p[0]<W.seen.thrust).map(p=>p[1]),COL.truth,1.8);
  if(W.seen.tailEnd){ const r0=K.r, v0=K.v, en=vdot(v0,v0)/2-MUM_SI/vlen(r0);
    if(en<0){ const Tp=2*PI*Math.sqrt(Math.pow(-MUM_SI/(2*en),3)/MUM_SI), pts=[];
      for(let k=0;k<=240;k++) pts.push(keplerProp(r0,v0,Tp*k/240,MUM_SI)[0]); tPath(pts,COL.truth,1.8); } }
  /* the burn over the orbit it leaves */
  tPath(T.filter(p=>p[9]>0).map(p=>p[1]),COL.ref,3.2);
  { const q=Q(K.r); dot(ctx,q[0],q[1],4.5,COL.live,'#fff'); }
  for(const [k,name] of [['los','LOS'],['aos','AOS']]){ const g=W.seen[k]; if(!g) continue; const p=T.find(x=>x[0]>=g); if(!p) continue;
    const q=Q(p[1]); dot(ctx,q[0],q[1],3,COL.ref); lab(ctx,Wd,Hd,q[0],q[1]+(k==='los'?-12:14),name+' '+hmsShort(g),COL.ref,SM_FONT,'center',null,PLATE); }
  legendRow(ctx,A.x+8,A.y+12,[['rgba(90,200,224,0.8)','the arrival'],[COL.ref,'the SPS burn'],[COL.truth,'flown']],A.x1-8);
  /* the SPS gimbals: the CMC's command (the TVC autopilot's, through the counters) and where they are */
  const t0=-240, t1=420, B=box(b.x+44,A.y1+58,b.w-56,Math.max(46,(b.y1-(A.y1+58)-30-56)/2));
  axesT(ctx,B,t0,t1,-2.5,2.5,{title:titleFor(B,'the SPS gimbals: the CMC’s command and the engine, pitch and yaw','the SPS gimbals'),
    xlab:'seconds from TIG, 75:49:49.65',ylab:'deg',xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0),ny:4,nx:6,yticks:B.h<80?[-2,0,2]:[-2,-1,0,1,2]});
  const XB=p=>B.x+B.w*(p[0]-tig-t0)/(t1-t0), win=T.filter(p=>p[0]>=tig+t0-1&&p[0]<=tig+t1+1);
  const yB=v=>B.y1-B.h*(v+2.5)/5, path=(pts,X,Y,col,lw,dash,box)=>{ ctx.beginPath(); let prev=null;
    for(const p of pts){ const q=[X(p),Y(p)]; if(!isFinite(q[1])||q[0]<box.x-1||q[0]>box.x1+1||q[1]<box.y-1||q[1]>box.y1+1){ prev=null; continue; }
      if(prev){ ctx.lineTo(q[0],q[1]); POLY_SEGS.push(prev[0],prev[1],q[0],q[1]); } else ctx.moveTo(q[0],q[1]); prev=q; }
    ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); };
  path(win,XB,p=>yB(p[7]),COL.ref,1.1,[3,3],B); path(win,XB,p=>yB(p[8]),'#f0b23c',1.1,[3,3],B);
  path(win,XB,p=>yB(p[5]),COL.truth,1.8,null,B); path(win,XB,p=>yB(p[6]),COL.struct,1.8,null,B);
  /* the flight's gimbal position indicator readings (MR Table 8.6-II): at ignition, steady, at cutoff */
  for(const [t,pp,yy] of [[0.7,A11O.gpi.init[0],A11O.gpi.init[1]],[180,A11O.gpi.steady[0],A11O.gpi.steady[1]],[357.5,A11O.gpi.cut[0],A11O.gpi.cut[1]]]){
    const X=B.x+B.w*(t-t0)/(t1-t0); diamond(ctx,X,yB(pp),3.5,null,COL.truth); diamond(ctx,X,yB(yy),3.5,null,COL.struct); }
  /* the legend in the bottom right, clear of the gimbal test (TIG - 207 s) and of the burn's yaw near -0.5 */
  { const items=[[COL.truth,'pitch'],[COL.struct,'yaw'],[COL.ref,'commands, dashed'],['#8b93a6','◇ the flight']];
    ctx.save(); ctx.font='10.5px -apple-system, sans-serif'; let w=-14; for(const [,t] of items) w+=13+ctx.measureText(plain(t)).width+14; ctx.restore();
    legendRow(ctx,Math.max(B.x+B.w*0.12,B.x1-12-w),B.y1-9,items,B.x1-8); }
  /* the burn: the velocity still to gain, as N40 showed it, and the thrust */
  const C=box(b.x+44,B.y1+56,b.w-56,Math.max(46,b.y1-(B.y1+56)-30));
  axesT(ctx,C,t0,t1,0,3000,{title:titleFor(C,'the burn: the velocity to be gained on N40, ft/s, and the thrust','the burn: N40’s velocity to gain'),
    xlab:'seconds from TIG',ylab:'ft/s',xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0),ny:3,nx:6,yticks:[0,1000,2000,3000]});
  const XC=p=>C.x+C.w*(p[0]-tig-t0)/(t1-t0);
  path(W.vgTrack.filter(p=>p[0]>=tig+t0-1&&p[0]<=tig+t1+1),XC,p=>C.y1-C.h*Math.min(3000,p[1])/3000,COL.truth,1.8,null,C);
  path(win,XC,p=>C.y1-C.h*p[9]/(25000*LBF),COL.ref,1.2,null,C);
  /* the legend in two rows on the left, before the ignition: under N40's line, over the thrust's zero */
  { const xT=C.x+C.w*(0-t0)/(t1-t0)-4;
    legendRow(ctx,C.x+8,C.y+C.h*0.4,[[COL.truth,'to be gained, N40']],xT); legendRow(ctx,C.x+8,C.y+C.h*0.62,[[COL.ref,'thrust, 0 to 25,000 lb']],xT); }
  if(get<tig) lab(ctx,Wd,Hd,C.x+C.w*0.62,C.y+C.h*0.78,'TIG in '+mmss(tig-get),COL.dim,LAB_FONT,'center');
}

/* ---------------------------------------------------------------- the way home: the entry on Comanche 055 */
/* the ground track from the entry interface (the truth's) to the target, nmi: the path's far end */
function homeRange(){ return memo('homeRange','1',()=>cmGround(A11C.truth.lat,A11C.truth.lon,A11C.target[0],A11C.target[1])/NMI); }
const HOME_PROG_COL={63:COL.truth,64:COL.truth,65:COL.struct,66:COL.warn,67:COL.live};
function drawHomeView(ctx,L,W,S,Wd,Hd){
  const b=L.scene, K=W.K, T=W.track, get=worldGET(W), ei=A11C.ei, ft=x=>x/FT;
  const hA=Math.max(90,b.h*0.40), A=box(b.x+46,b.y+18,b.w-58,hA-44);
  const rest=b.y1-(A.y1+62)-30, Bb=box(b.x+46,A.y1+62,b.w-58,Math.max(46,(rest-56)/2));
  const Cc=box(b.x+46,Bb.y1+56,b.w-58,Math.max(46,b.y1-(Bb.y1+56)-30));
  /* a polyline through the points that fall in the box (a point that does not, or is not a number, breaks it), broken
     too where it jumps by more than brk pixels (an angle wrapping at 180 degrees) */
  const path=(pts,B,X,Y,col,lw,dash,brk)=>{ ctx.beginPath(); let prev=null;
    for(const p of pts){ const q=[X(p),Y(p)];
      if(!isFinite(q[0])||!isFinite(q[1])||q[0]<B.x-1||q[0]>B.x1+1||q[1]<B.y-1||q[1]>B.y1+1){ prev=null; continue; }
      if(prev&&!(brk&&Math.abs(q[1]-prev[1])>brk)){ ctx.lineTo(q[0],q[1]); POLY_SEGS.push(prev[0],prev[1],q[0],q[1]); } else ctx.moveTo(q[0],q[1]);
      prev=q; }
    ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); };
  /* the path: altitude against the ground flown from the entry interface, coloured by program */
  const Rn=homeRange(), xl=-30, xr=Math.ceil((Rn+40)/50)*50, hTop=400000;
  const ex=(A.h/hTop)/(A.w/((xr-xl)*NMI/FT));
  axesT(ctx,A,xl,xr,0,hTop,{title:titleFor(A,'altitude against the ground flown (height drawn ×'+fmt(ex,0)+')','the entry (height ×'+fmt(ex,0)+')'),
    xlab:'nautical miles from the entry interface',ylab:'altitude, ft',yfmt:v=>fmt(v/1000,0)+'k',xfmt:v=>fmt(v,0),ny:4,nx:6});
  const XA=p=>A.x+A.w*(Rn-p[2]/NMI-xl)/(xr-xl), YA=p=>A.y1-A.h*ft(p[1])/hTop;
  const air=T.filter(p=>p[0]>=ei-120);
  for(const mm of [63,64,65,66,67]){ const seg=air.filter(p=>p[7]===mm); if(seg.length>1) path(seg,A,XA,YA,HOME_PROG_COL[mm],2); }
  const tx=A.x+A.w*(Rn-xl)/(xr-xl); diamond(ctx,tx,A.y1-1,5,null,COL.ref);
  lab(ctx,Wd,Hd,tx-8,A.y1-12,'the target',COL.ref,SM_FONT,'right');
  const last=T[T.length-1];
  if(last&&last[0]>=ei-60&&!K.splash){ const q=[XA(last),YA(last)]; if(q[0]>=A.x&&q[0]<=A.x1&&q[1]>=A.y) dot(ctx,q[0],q[1],4.5,'#fff',COL.live); }
  if(get<ei-60){ const hh=earthHeight(K.r,get);
    lab(ctx,Wd,Hd,A.x+A.w/2,A.y+A.h*0.42,'the CM is '+fmt(hh/NMI,0)+' nmi up, '+fmt(vlen(K.v)/FT,0)+' ft/s: the air in '+mmss(ei-get),COL.dim,LAB_FONT,'center'); }
  legendRow(ctx,A.x+8,A.y1-12,[[COL.truth,'P63, P64'],[COL.struct,'P65, the up-control'],[COL.live,'P67, the final phase']],tx-70);
  /* the bank: the computer's command (ROLLC) and the CM's roll about the air (CM/POSE's angle), 0 = lift up */
  const t0=-30, t1=620, XT=B=>p=>B.x+B.w*(p[0]-ei-t0)/(t1-t0);
  axesT(ctx,Bb,t0,t1,-180,180,{title:titleFor(Bb,'the bank: what Comanche commands (ROLLC) and what the CM flies','the bank: ROLLC and flown'),
    xlab:'seconds after the entry interface, 195:03:05.7',ylab:'deg',yfmt:v=>fmt(v,0),xfmt:v=>fmt(v,0),ny:4,nx:6,yticks:[-180,-90,0,90,180]});
  const YB=v=>Bb.y1-Bb.h*(v+180)/360, win=T.filter(p=>p[0]>=ei+t0-2&&p[0]<=ei+t1+2);
  path(win,Bb,XT(Bb),p=>YB(((p[6]+540)%360)-180),COL.ref,1.4,null,Bb.h*0.5);
  path(win,Bb,XT(Bb),p=>YB(((p[5]+540)%360)-180),COL.truth,1.6,null,Bb.h*0.5);
  for(const mm of [64,65,67]){ const g=W.seen['p'+mm]; if(!g) continue; const X=XT(Bb)([g]); if(X<Bb.x||X>Bb.x1) continue;
    ctx.strokeStyle='#3a4256'; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(X,Bb.y); ctx.lineTo(X,Bb.y1); ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,Wd,Hd,X+3,Bb.y+8,'P'+mm,'#8b93a6',SM_FONT,'left'); }
  legendRow(ctx,Bb.x+Bb.w*0.55,Bb.y1-10,[[COL.ref,'ROLLC'],[COL.truth,'the CM’s roll']],Bb.x1-6);
  /* the load: the accelerometers' g, against the entry monitor's two peaks */
  axesT(ctx,Cc,t0,t1,0,8,{title:titleFor(Cc,'the load on the crew: what the accelerometers feel','the load'),
    xlab:'seconds after the entry interface',ylab:'g',ny:4,nx:6,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)});
  for(const [gg,txt] of [[6.73,'6.73 g, the entry monitor’s first peak'],[6.00,'6.00, its second']]){
    const yy=Cc.y1-Cc.h*gg/8; ctx.strokeStyle=COL.ref; ctx.setLineDash([4,4]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(Cc.x,yy); ctx.lineTo(Cc.x1,yy); ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,Wd,Hd,gg>6.5?Cc.x1-6:Cc.x+Cc.w*0.30,yy-8,txt,COL.ref,SM_FONT,gg>6.5?'right':'left'); }
  path(win,Cc,XT(Cc),p=>Cc.y1-Cc.h*Math.min(8,p[3])/8,COL.truth,2);
  if(get<ei) lab(ctx,Wd,Hd,Cc.x+Cc.w/2,Cc.y+Cc.h*0.55,'nothing yet: the CM reaches the air at 195:03:05.7',COL.dim,LAB_FONT,'center');
}
const mmss=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

/* ---------------------------------------------------------------- the rendezvous: the ascent, and the LM seen from the CSM */
/* the PAD's ascent through this page's P12, as a profile [t, altitude, distance flown] (dashed under the flown one) */
function rdvAscNominal(){ return memo('rdvascnom','1',()=>{
  const S=makeAscent(RM_RLS); S.v=[-WM_SI*RM_RLS,0]; S.tgt={zdot:RDV.n76[0],rdot:RDV.n76[1],h:ASC_T.h};
  const site=[S.r[0],S.r[1],0], tr=[], rec=()=>{ const r=[S.r[0],S.r[1],0]; tr.push([S.t,v2len(S.r)-RM_RLS,Math.atan2(vcross(site,r)[2],vdot(site,r))*-RM_RLS]); };
  let nextG=0, nextT=0;
  while(!S.done&&S.t<600){ if(S.t>=nextG-1e-9){ ascGuide(S); nextG+=2; } if(S.t>=nextT-1e-9){ rec(); nextT+=2; } ascStep(S,0.05); }
  rec(); return tr;
}); }
/* the LM against the CSM at GET g: [nmi along the CSM's orbit (negative: behind it), nmi above it] */
function rdvRel(r,g){ const [rc,vc]=rdvCsmAt(g), n=vunit(vcross(rc,vc)), uc=vunit(rc), ul=vunit(r);
  return [Math.atan2(vdot(vcross(uc,ul),n),vdot(uc,ul))*vlen(rc)/NMI,(vlen(r)-vlen(rc))/NMI]; }
const RDV_BURN_NAME={csi:'CSI',cdh:'CDH',tpi:'TPI',mcc1:'MCC 1',mcc2:'MCC 2'};
function drawRdvView(ctx,L,W,S,Wd,Hd){
  const b=L.scene, nm=x=>x/NMI, ft=x=>x/FT, get=worldGET(W), T=W.track, lo=W.seen.liftoff;
  const path=(pts,B,X,Y,col,lw,dash)=>{ ctx.beginPath(); let first=true, prev=null;
    for(const p of pts){ const q=[X(p),Y(p)];
      if(!isFinite(q[0])||!isFinite(q[1])||q[0]<B.x-1||q[0]>B.x1+1||q[1]<B.y-1||q[1]>B.y1+1){ first=true; continue; }
      if(first){ ctx.moveTo(q[0],q[1]); first=false; } else { ctx.lineTo(q[0],q[1]); POLY_SEGS.push(prev[0],prev[1],q[0],q[1]); }
      prev=q; }
    ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); };
  /* P12: altitude against the distance flown from the liftoff point, to two minutes after cutoff */
  const A=box(b.x+46,b.y+18,b.w-58,Math.max(70,b.h*0.34-30)), xr=280, yTop=70000, ex=(A.h/yTop)/(A.w/(xr*NMI/FT));
  axesT(ctx,A,0,xr,0,yTop,{title:titleFor(A,'P12: altitude against the distance flown (height ×'+fmt(ex,0)+')','P12, the ascent (height ×'+fmt(ex,0)+')'),
    xlab:'nautical miles from Tranquility Base',ylab:'ft',yfmt:v=>fmt(v/1000,0)+'k',xfmt:v=>fmt(v,0),ny:4,nx:7});
  const p0=lo?T.find(p=>p[0]>=lo):null, u0=p0?vunit(p0[1]):null;
  const asc=p0?T.filter(p=>p[0]>=lo-2&&p[0]<=(W.seen.tailEnd||get)+120):[];
  const XA=p=>A.x+A.w*Math.acos(clamp(vdot(vunit(p[1]),u0),-1,1))*A11R.rls2/NMI/xr, YA=p=>A.y1-A.h*ft(p[2])/yTop;
  path(asc,A,XA,YA,COL.truth,2);
  if(W.ins&&p0){ const q=[0,W.ins.r,A11R.insBest[0]*FT]; diamond(ctx,XA(q),YA(q),5,null,COL.ref);
    const k3=x=>String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    lab(ctx,Wd,Hd,A.x1-8,A.y1-12,'◇ the flight’s insertion, 60,300 ft (MR 5-V); here '+k3(W.ins.h/FT)+' ft',COL.ref,SM_FONT,'right'); }   /* clear of the climb */
  if(!lo) lab(ctx,Wd,Hd,A.x+A.w/2,A.y+A.h*0.6,'the LM lifts off at 124:22:00',COL.dim,LAB_FONT,'center');
  else if(!W.seen.tailEnd&&asc.length){ const q=asc[asc.length-1]; dot(ctx,XA(q),YA(q),4.5,COL.live,'#fff'); }
  legendRow(ctx,A.x+8,A.y+12,[[COL.truth,'flown, P12 on the real LGC'],[COL.ref,'◇ the flight']],A.x+A.w*0.62);
  /* the LM seen from the CSM: the cross */
  const B=box(b.x+46,A.y1+64,b.w-58,Math.max(80,b.y1-(A.y1+64)-30));
  const flown=lo?T.filter((p,i)=>p[0]>=lo&&(i%3===0||i===T.length-1)).map(p=>[p[0]].concat(rdvRel(p[1],p[0]))):[];
  let xmin=-50; for(const p of flown) xmin=Math.min(xmin,p[1]);
  const xl=Math.floor(xmin/50)*50, xh=20, yl=-70, yh=10, exB=(B.h/(yh-yl))/(B.w/(xh-xl));
  axesT(ctx,B,xl,xh,yl,yh,{title:titleFor(B,'the LM seen from the CSM (height ×'+fmt(exB,1)+'): it starts behind and below','the LM seen from the CSM'),
    xlab:'nautical miles along the CSM’s orbit (negative: behind it)',ylab:'nmi up',xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0),ny:4,nx:6});
  const XB=p=>B.x+B.w*(p[1]-xl)/(xh-xl), YB=p=>B.y1-B.h*(p[2]-yl)/(yh-yl);
  path(flown,B,XB,YB,COL.truth,2);
  { const X0=XB([0,0,0]), Y0=YB([0,0,0]); ctx.strokeStyle=COL.struct; ctx.lineWidth=1.6; ctx.beginPath();
    ctx.moveTo(X0-6,Y0); ctx.lineTo(X0+6,Y0); ctx.moveTo(X0,Y0-6); ctx.lineTo(X0,Y0+6); ctx.stroke();
    lab(ctx,Wd,Hd,X0+8,Y0+14,'the CSM',COL.struct,SM_FONT,'left'); }   /* below the cross: the legend runs along the top */
  /* the burns where they were flown (P41 on the translation controller) */
  for(const bn of (W.burnLog||[])){ const p=T.find(q=>q[0]>=bn.tig); if(!p) continue; const q=[0].concat(rdvRel(p[1],p[0]));
    dot(ctx,XB(q),YB(q),3.6,'#fff',COL.truth);
    if(bn.name==='csi'||bn.name==='cdh'||bn.name==='tpi') lab(ctx,Wd,Hd,XB(q),YB(q)+(bn.name==='cdh'?16:-14),RDV_BURN_NAME[bn.name],COL.ref,SM_FONT,'center',null,PLATE); }
  /* the ascent: the CSM passes overhead and draws ahead while the LM climbs; then the LM gains on it */
  if(flown.length){ const f0=flown[0]; lab(ctx,Wd,Hd,XB(f0)+6,YB(f0)+14,'liftoff',COL.dim,SM_FONT,'left',null,PLATE); }
  if(W.seen.tailEnd){ const p=T.find(q=>q[0]>=W.seen.tailEnd); if(p){ const q=[0].concat(rdvRel(p[1],p[0])); lab(ctx,Wd,Hd,XB(q)+6,YB(q)-12,'insertion',COL.dim,SM_FONT,'left',null,PLATE); } }
  if(W.seen.stationkeep){ const p=T.find(q=>q[0]>=W.seen.stationkeep); if(p){ const q=[0].concat(rdvRel(p[1],p[0]));
    lab(ctx,Wd,Hd,XB(q)-8,YB(q)+16,W.docked?'docked':'station-keeping',COL.ref,SM_FONT,'right',null,PLATE); } }
  if(flown.length&&!W.docked){ const p=flown[flown.length-1]; dot(ctx,XB(p),YB(p),4.5,COL.live,'#fff'); }
  if(!flown.length) lab(ctx,Wd,Hd,B.x+B.w/2,B.y+B.h*0.62,'the LM lifts off at 124:22:00',COL.dim,LAB_FONT,'center');
  legendRow(ctx,B.x+8,B.y+12,[[COL.truth,'flown here'],['#fff','the burns, P41 on the RCS']],B.x1-8);
}

const VIEW_DRAW={keys:drawKeysView, out:drawOutView, land:drawLandView, alarms:drawAlarmsView, rdv:drawRdvView, home:drawHomeView};
function drawView(ctx,Wd,Hd,st,blinkOn){
  LABELS=[]; POLY_SEGS=[]; DRAW_SEQ=0; KEY_DROPS=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,Wd,Hd);
  const W=worldFor(st.view);
  const cap=CAPTION[st.view]||['',''];
  const L=stageBoxes(ctx,Wd,Hd,cap[0],cap[1]);
  const hits=drawWorldDsky(ctx,L.dsky,W,blinkOn);
  LABELS.push([hits.x,hits.y,hits.x+hits.w,hits.y+hits.h]);
  VIEW_DRAW[st.view](ctx,L,W,null,Wd,Hd);
  drawLog(ctx,L.log,W);
  caption(ctx,L.capX,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
  return {hits:hits.hits, L};
}

function saveAgcSource(tagEl){
  const gz=b64bytes(AGC_SRC_GZ);
  const save=(blob,name)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    if(document.body&&document.body.appendChild){ document.body.appendChild(a); a.click(); document.body.removeChild(a); } else a.click();
    if(tagEl) tagEl.textContent='saved '+name; };
  if(typeof DecompressionStream!=='undefined'&&typeof Response!=='undefined'){
    new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).blob()
      .then(b=>save(new Blob([b],{type:'text/plain'}),'apollo_dsky_agc_source.txt'),()=>save(new Blob([gz],{type:'application/gzip'}),'apollo_dsky_agc_source.txt.gz'));
  } else save(new Blob([gz],{type:'application/gzip'}),'apollo_dsky_agc_source.txt.gz');
}
/* a clock in ms for the jumps' frame budget (osascript, where the UI drive runs, has no performance.now) */
const nowMs=typeof performance!=='undefined'&&performance.now?()=>performance.now():()=>Date.now();
function makeScene(canvas){
  const S={st:ST, W:900, H:600, lastHits:[], last:null};
  S.world=()=>worldFor(ST.view);
  S.draw=function(){
    const ctx=canvas.getContext('2d');
    const r=drawView(ctx,S.W,S.H,ST,blinkPhase(S.world()));
    S.lastHits=r.hits;
  };
  /* advance the world by a frame of real time; a real computer's world on a jump runs on toward it for at most
     30 ms of each frame, so the page keeps drawing while the computer races there */
  S.step=function(dtReal){
    const W=S.world();
    if(W.jump){ if(lgcJumpRun(W,nowMs,30)) W.autoCrew=ST.autoCrew; return true; }
    if(!ST.run||W.done) return false;
    const warp=Math.min(ST.warp,W.warpMax||1);
    worldStep(W,Math.min(0.1,dtReal)*warp);
    return true;
  };
  S.press=function(k){ const W=S.world(); if(W.lgc) lgcReaderKey(W,k); else pressKey(W,k); };
  S.pointer=function(type,x,y){
    if(type!=='down') return false;
    const k=dskyHit(S.lastHits,x,y);
    if(k){ S.press(k); return true; }
    return false;
  };
  return S;
}

  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) if(key) [].forEach.call(wrapEl.children,(b,i)=>{
    b.className='chip'+(list[i].id===st[key]?' on':''); b.disabled=key==='warp'&&WARP_OK[st.view].indexOf(list[i].id)<0; }); }

  gRun.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'rate'),chipRow(WARPS,'warp')));
  gRun.appendChild(h('div',{class:'checks'},checkbox('autoCrew','the crew keys what Apollo 11’s crew keyed',()=>{ const W=S.world(); W.autoCrew=st.autoCrew; if(!st.autoCrew) W.pristine=false; })));
  gRun.appendChild(h('div',{class:'btnrow'},runBtn,
    h('button',{onclick:()=>{ worldReset(st.view); applyWorldSettings(); dirty=true; refresh(); }},'start again')));

  const antBtn=h('button',{onclick:()=>{ const W=S.world(); if(lgcCrank(W)){ W.pristine=false; logEvent(W,'the landing radar’s antenna cranked to position 1'); }
    syncPanel(); dirty=true; refresh(); }},'LR antenna to position 1');
  const stopBtn=h('button',{onclick:()=>{ const W=S.world(); if(W.lgc){ W.pristine=false; lgcEngineStop(W); } syncPanel(); dirty=true; refresh(); }},'ENGINE STOP');
  gLand.appendChild(h('div',{class:'btnrow'},antBtn,stopBtn));

  gOut.appendChild(chipRow(OUT_JUMPS,null,o=>{ jumpTo(S.world(),o.id); }));
  const outTag=h('div',{class:'tag'}); gOut.appendChild(outTag);

  /* ---- the way home's moments, and the CM's second RCS system ---- */
  const gHome=h('div',{class:'grp'},h('h3',null,'the entry'));
  gHome.appendChild(chipRow(HOME_JUMPS,null,o=>{ jumpTo(S.world(),o.id); }));
  gHome.appendChild(h('div',{class:'checks'},checkbox('sysB','RCS system B on too (Apollo 11 flew on system A)',()=>{ const W=S.world();
    if(W.cmc&&W.K.sep) W.pristine=false; applyWorldSettings(); })));
  const homeTag=h('div',{class:'tag'}); gHome.appendChild(homeTag);

  /* ---- the rendezvous's moments ---- */
  const gRdv=h('div',{class:'grp'},h('h3',null,'the rendezvous'));

  const rdvTag=h('div',{class:'tag'}); gRdv.appendChild(rdvTag);

  const gAl=h('div',{class:'grp'},h('h3',null,'the rendezvous radar and the load'));

  gAl.appendChild(h('div',{class:'checks'},checkbox('rrAuto','the radar switch as flown: its CDUs count',settingChanged),
    checkbox('crewN68','the crew keys V16 N68 as Aldrin did',settingChanged),
    checkbox('didOn','MODE SELECT in PGNS: the computer drives the tape meters',settingChanged)));
  gAl.appendChild(slider('rrPps','the radar CDUs’ pulses a second, each',0,6400,100,v=>fmt(v,0),settingChanged));
  const alTag=h('div',{class:'tag'}); gAl.appendChild(alTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:SRC_LINE}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),h('div',{id:'phys'}));
  /* ---- the real computers: whose emulator, its license, and its source (GPL v2 asks it to travel with the module) ---- */
  const srcBtn=h('button',{onclick:()=>saveAgcSource(srcTag)},'the emulator’s source (GPL)');
  const srcTag=h('div',{class:'tag'});
  const gAgc=h('div',{class:'grp'},h('h3',null,'the real computers'),
    h('div',{class:'src',html:AGC_CREDIT}),h('div',{class:'btnrow'},srcBtn),srcTag);
  [gRun,gKeys,gOut,gLand,gRdv,gHome,gAl,gInfo,gPhys,gAgc].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  /* the page's settings carried into the world (the descent's radar and switches, the crew; the keyboard's world has
     no crew) */
  function applyWorldSettings(){
    const W=S.world();
    if(W.kind!=='keys'&&!W.jump) W.autoCrew=st.autoCrew;
    if(W.kind==='land'){ W.sw.rrAuto=st.rrAuto; W.sw.rrPps=st.rrPps; W.crewN68=st.crewN68; W.sw.disInertial=st.didOn; }
    if(W.kind==='home') W.sw.sysB=st.sysB;
  }

  function syncPanel(){
    const v=st.view, W=S.world();
    gKeys.hidden=v!=='keys'; gAl.hidden=v!=='alarms'; gRun.hidden=v==='keys'; gLand.hidden=!(v==='land'||v==='alarms'); gRdv.hidden=v!=='rdv'; gHome.hidden=v!=='home'; gOut.hidden=v!=='out';
    rows.rrPps.inp.disabled=!st.rrAuto;
    const ask500=W.kind==='land'&&lgc500(W);

    stopBtn.disabled=!(W.kind==='land'&&W.L.contact&&!W.L.stop);
    landTag.innerHTML=W.kind!=='land'?'':W.jump?'<b>running the computer to '+hmsShort(W.jump.to)+'</b> … the crew keys as they did'
      :('the jumps run the descent, crew and all, to that moment; '
      +(ask500?'<b>checklist 00500</b> asks for the landing radar’s antenna in position 1: crank it, then PRO'
        :'the landing radar’s antenna is '+(W.L.lrMove?'moving':'in position '+(W.L.lrPos+1))));

      :'the jumps run the burn, crew and all, to that moment; '+(W.seen.engOff?'the SPS burned '+fmt(W.seen.engOff-W.seen.thrust,1)+' s'
        :W.seen.thrust?'the SPS is burning':'ΔV THRUST '+(W.sw.thrustA||W.sw.thrustB?(W.sw.thrustA?'A':'')+(W.sw.thrustA&&W.sw.thrustB?' and ':'')+(W.sw.thrustB?'B':'')+' on':'A and B off'));
    homeTag.innerHTML=W.kind!=='home'?'':W.jump?'<b>running the computer to '+hmsShort(W.jump.to)+'</b> … the crew keys as they did'
      :'the jumps run the entry, crew and all, to that moment; '+(W.K.sep?'the CM RCS: '+(st.sysB?'both systems':'system A'):'the service module is still on');
    alTag.innerHTML='2 &times; '+fmt(st.rrPps,0)+' pulses a second &times; 11.72 &mu;s = '+fmt(st.rrAuto?2*st.rrPps*MCT*100:0,1)+'% of the computer'
      +(st.rrPps>=6400?' (the worst phase of the radar&rsquo;s 800-Hz supply)':'');
    syncChips();
  }

  function refresh(){
    try{
      const W=S.world();
      roEl.innerHTML=readoutHTML(st,W);
      eqEl.innerHTML=eqbarHTML(st,W);
      tagEl.innerHTML=tagHTML(st,W);
      hintEl.textContent=st.view==='land'?'↑↓ the ROD switch, ←→ pitch (you take the controls) · S engine stop · space pauses · [ ] views'
        :'press the DSKY’s keys or type them · space pauses · [ ] views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ dirty=true; refresh(); }
  });

  /* the keyboard: the DSKY's keys, and the landing's hand controls */
  const KEYMAP={v:'VERB',n:'NOUN','+':'+','=':'+','-':'-',Enter:'ENTR',c:'CLR',Backspace:'CLR',p:'PRO',k:'KEYREL',r:'RSET'};
  window.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT') return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const W=S.world();
    let k=null;
    if(/^[0-9]$/.test(e.key)) k=e.key; else k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()]||null;
    if(k){ e.preventDefault(); S.press(k); dirty=true; refresh(); return; }
    if(e.key===' '){ e.preventDefault(); st.run=!st.run; syncPanel(); dirty=true; refresh(); return; }
    if(e.key==='['||e.key===']'){ const i=TABS.findIndex(t=>t[0]===st.view); setView(TABS[(i+(e.key===']'?1:TABS.length-1))%TABS.length][0]); return; }
    if(W.kind==='land'&&(e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); lgcRod(W,e.key==='ArrowUp'?1:-1); st.autoCrew=W.autoCrew; syncPanel(); dirty=true; refresh(); return; }
    if(W.kind==='land'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); lgcTilt(W,e.key==='ArrowRight'?1:-1); st.autoCrew=W.autoCrew; syncPanel(); dirty=true; refresh(); return; }
    if(W.kind==='land'&&(e.key==='s'||e.key==='S')){ e.preventDefault(); if(W.L.contact){ W.pristine=false; lgcEngineStop(W); } syncPanel(); dirty=true; refresh(); return; }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frames=0, tPrev=null;
  function frameLoop(ts){
    const dt=tPrev===null?1/60:Math.max(0,(ts-tPrev)/1000); tPrev=ts;
    let advanced=false;
    try{ advanced=S.step(dt); }catch(e){ fail(e); }
    if(advanced||dirty){ dirty=false;
      try{ S.draw(); if(++frames%6===0){ syncPanel(); roEl.innerHTML=readoutHTML(st,S.world()); tagEl.innerHTML=tagHTML(st,S.world()); eqEl.innerHTML=eqbarHTML(st,S.world()); } }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  applyWorldSettings(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* run a world to a GET with its crew: every world runs a real computer (since 2026-10-14 e), whose jump starts here
   (from a saved moment if it lies behind) and S.step runs it on, frame by frame, the reader's crew setting kept for
   what follows */
function jumpTo(W,get){ lgcJumpStart(W,get); return W; }
/* the keyboard view's typist: the keys go into the crew's queue (a key every 0.3 s) */
function typeFor(W,o){ W.keyq.length=0; crewKeys(W,o.keys); crewSay(W,o.say); }

const hd=t=>'<tr><td class="hd" colspan="2">'+t+'</td></tr>';
const row=(k,v,cls)=>'<tr><td>'+k+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>';
function progName(vkey,mm){
  const names={L:{0:'P00, idle',12:'P12, powered ascent',32:'P32, CSI targeting',33:'P33, CDH targeting',34:'P34, TPI targeting',
    35:'P35, midcourse targeting',41:'P41, RCS thrusting',57:'P57, lunar surface alignment',63:'P63, braking phase',64:'P64, approach phase',
    65:'P65, automatic vertical descent',66:'P66, rate of descent',68:'P68, landing confirmation'},
    C:{0:'P00, idle',30:'P30, external delta-V',40:'P40, SPS burn',61:'P61, entry preparation',62:'P62, CM/SM separation',
    63:'P63, entry initialization',64:'P64, post-0.05 g',65:'P65, up-control',66:'P66, ballistic',67:'P67, final phase'}};
  return (names[vkey]&&names[vkey][mm])||(mm>=0?'P'+pad2(mm):'blank');
}

function readoutHTML(st,W){
  const D=W.D, v=st.view;
  let s='';
  if(v==='keys'){
    const P=W.pb||pinballOf(W.C.A,L99,L99F.MMCHANG), Dl=lgcD(W);
    s+='<div class="rname">the LM’s DSKY<small>Luminary 099 · '+hmsShort(worldGET(W))+' GET</small></div><table>';
    s+=hd('PINBALL, from its own memory')+row('major mode (MODREG)',progName('L',Dl.modReg))
      +row('verb · noun (VERBREG · NOUNREG)',pad2(P.verb)+' · '+pad2(P.noun))
      +row('state',PB_NODES.find(n=>n[0]===P.shown)[1])
      +row('next digit goes to (DSPCOUNT)',P.place||'nowhere: ENTR, or a new VERB')
      +row('the word is (DECBRNCH)',P.dec===0?'octal':(P.dec===1?'decimal, +':'decimal, −'))
      +row('a load waits for ENTR (REQRET)',P.waiting?(P.mm?'the program’s two digits':P.verb>=21&&P.verb<=23?'a word for R'+(P.verb-20):'a word'):'no')
      +row('a program waits for an answer (CADRSTOR)',P.cadrstor?'yes':'no')
      +row('monitor (MONSAVE)',P.monitor?'V'+pad2(P.monitor.verb)+' N'+pad2(P.monitor.noun):'none')
      +row('the keys hold the display (DSPLOCK)',P.dsplock?'yes':'no')
      +row('the alarm codes (FAILREG)',Dl.failreg.map(c=>octal5(c)).join(' '));
    s+='</table><div class="note">'+(W.said&&W.t-W.sayT<8?'<b>'+W.said+'</b>':'This is the flight program itself on an emulation of the computer: every lamp, digit and answer on the DSKY is the program’s.')+'</div>';

    const guiding=[63,64,65,66].indexOf(lgcProg(W))>=0&&!L.landed;

    if(v==='land'){
      s+=hd('the LM')+row('altitude of the footpads',fmt(h/FT,0)+' ft')+row('altitude rate',fmt(vdot(vr,up)/FT,1)+' ft/s')
        +row('distance to the LGC’s site',fmt(lgcAlong(L.r,get)/NMI,2)+' nmi')
        +row('thrust',L.F>0?fmt(L.F/LBF,0)+' lb ('+fmt(100*L.F/(10500*LBF),0)+'%)':'off')

        +row('ΔH, radar − computer (DELTAH, N68 R3)',W.seen.lr&&guiding?fmt(agcDP(A,L99.DELTAH,24)/FT,0)+' ft':guiding?'no radar data yet':'—')

      +row('burning',W.seen.thrust?fmt(((W.seen.tailEnd||get)-W.seen.thrust),1)+' s':'not yet');
    s+=hd('Comanche 055, from its memory')
      +row('velocity to be gained (VGDISP)',[40,41].indexOf(mm)>=0?fmt(agcDP(A,C55.VGDISP,7)*100/FT,1)+' ft/s':'—')
      +row('its gimbal command (the TVC counters)',W.ch12&0o200?fmt(A.tvcErr(0)*85.41/3600,2)+'° / '+fmt(A.tvcErr(1)*85.41/3600,2)+'°':'—')
      +row('RCS used',fmt(K.rcs/LBM,1)+' lb')
      +row('program alarms',al.length?al.map(a=>octal5(a.code).slice(1)).join(', '):'none',al.length?'bad':'');
    s+='</table><div class="note">'+(W.jump?'<b>running the computer to '+hmsShort(W.jump.to)+'</b>':W.said&&W.t-W.sayT<8?'<b>'+W.said+'</b>':'Every display, every gimbal command and the cutoff are Comanche 055’s own.')+'</div>';

  if(v==='home'){

      +row('roll about the air (0 = lift up)',K.sep&&!K.chute?fmt(P.roll,0)+'°':'—')

    s+=hd('Comanche 055, from its memory')

      +row('the load it measures (D)',[63,64,65,66,67].indexOf(mm)>=0?fmt(agcDP(A,C55.D,0)*25,2)+' g':'—')

    s+='</table><div class="note">'+(W.jump?'<b>running the computer to '+hmsShort(W.jump.to)+'</b>':W.said&&W.t-W.sayT<8?'<b>'+W.said+'</b>':'Every display and every jet firing is Comanche 055’s own.')+'</div>';
    return s;

  if(v==='rdv'){
    const L=W.L, A=W.C.A, get=worldGET(W), up=vunit(L.r), bl=W.burnLog||[], b=bl[bl.length-1];

    const now=W.docked?'docked':L.landed?'on the surface':L.F>0?'the ascent engine burning'
      :b&&!b.end?'the RCS burning ('+(RDV_BURN_NAME[b.name]||b.name)+')':W.pilot===rdvBrake?(W.seen.stationkeep?'station-keeping':'braking'):W.pilot===rdvTrim?'trimming the residuals':'coasting';
    s+=hd('the LM')+row('now',now)+row('height above Landing Site 2’s sphere',fmt((vlen(L.r)-A11R.rls2)/FT,0)+' ft')
      +row('climb rate',fmt(vdot(L.v,up)/FT,1)+' ft/s');
    if(!L.landed){ const hh=conicHaHp(L.r,L.v,MUM_SI,A11R.rls2); if(hh[1]>-50*NMI) s+=row('orbit (apolune × perilune)',fmt(hh[0]/NMI,1)+' × '+fmt(hh[1]/NMI,1)+' nmi'); }
    if(!L.landed&&!W.docked){ const [rc,vc]=rdvCsmAt(get), d=vsub(rc,L.r), u=vunit(d);
      s+=hd('the CSM, from the LM')+row('range',vlen(d)<NMI?fmt(vlen(d)/FT,0)+' ft':fmt(vlen(d)/NMI,2)+' nmi')+row('range rate',fmt(vdot(vsub(vc,L.v),u)/FT,1)+' ft/s')
        +row('line of sight above the horizon (E)',fmt(rdvElev(L.r,L.v,rc)*180/PI,1)+'°')
        +row('the radar',!W.sw.rrOn?'breakers out':W.rr&&W.rr.good?'locked on, '+A.E(L99.MARKCTR)+' marks':'searching'); }
    const q=(mm,n)=>rdvLast(W,mm,n);
    if(q(32,81)||q(33,81)||q(34,37)){ s+=hd('the computer’s plan (its last pass)');
      if(q(32,81)) s+=row('CSI (N11), ΔV (N81)',hmsShort(q(32,81).tcsi)+', '+fmt(q(32,81).r[0]/10,1)+' ft/s');
      if(q(33,81)||q(32,81)) s+=row('CDH (N13)',hmsShort((q(33,81)||q(32,81)).tcdh));
      if(q(34,37)) s+=row('TPI (N37, E = 26.6°)',hmsShort(q(34,37).ttpi)); }
    if(b){ s+=hd('the last burn, '+(RDV_BURN_NAME[b.name]||b.name)+' (P41)')+row('TIG',hmsShort(b.tig))
      +row('to gain at TIG, N85',b.n85?b.n85.map(x=>fmt(x/10,1)).join(', ')+' ft/s':'—')
      +row('residuals at PRO',b.resid?b.resid.map(x=>fmt(x/10,1)).join(', ')+' ft/s':'burning'); }
    s+='</table><div class="note">'+(W.said&&W.t-W.sayT<8?'<b>'+W.said+'</b>':'The programs, their displays and their targeting are Luminary 099’s, running in this page. The CSM’s orbit is fitted (see the calculation).')+'</div>';
    return s;
  }
  return '<div class="rname">'+TABS.find(t=>t[0]===v)[1]+'<small>'+hmsShort(worldGET(W))+' GET</small></div>';
}
function tagHTML(st,W){
  const v=st.view;
  if(v==='keys') return '<b>the keyboard</b> &nbsp; verb = what to do, noun = what to do it to · the real Luminary 099';
  if(v==='land') return '<b>the landing</b> &nbsp; '+progName('L',lgcProg(W));
  if(v==='alarms') return '<b>the alarms</b> &nbsp; why 1202 meant “keep going”';
  if(v==='out') return '<b>the way out</b> &nbsp; the real Comanche 055, '+progName('C',lgcProg(W));
  if(v==='home') return '<b>the way home</b> &nbsp; the real Comanche 055, '+progName('C',lgcProg(W));
  if(v==='rdv') return '<b>the rendezvous</b> &nbsp; the real Luminary 099, '+progName('L',lgcProg(W));
  return '<b>'+TABS.find(t=>t[0]===v)[1]+'</b>';
}
