/* ================================================================== *
 *  the LM around the real LGC                                        *
 * ================================================================== *
 * Everything the computer cannot do for itself: the Moon, the LM's
 * flight and attitude, the IMU (its gimbal angles and PIPA pulses),
 * the descent engine and its throttle electronics, the sixteen RCS
 * jets, the landing radar and the rendezvous radar's CDUs.  The world
 * frame is the LGC's own basic reference frame centred on the Moon,
 * in metres and seconds; the LGC sees the world only through counters
 * and channels (p2_agc.js).
 */

/* ---- 3x3 matrices: arrays of three rows ---- */
const m3={
  mul:(A,B)=>A.map(r=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j])),
  T:A=>[0,1,2].map(j=>[A[0][j],A[1][j],A[2][j]]),
  mv:(A,v)=>[A[0][0]*v[0]+A[0][1]*v[1]+A[0][2]*v[2],A[1][0]*v[0]+A[1][1]*v[1]+A[1][2]*v[2],
             A[2][0]*v[0]+A[2][1]*v[1]+A[2][2]*v[2]],
  tv:(A,v)=>[A[0][0]*v[0]+A[1][0]*v[1]+A[2][0]*v[2],A[0][1]*v[0]+A[1][1]*v[1]+A[2][1]*v[2],
             A[0][2]*v[0]+A[1][2]*v[1]+A[2][2]*v[2]],
  I:()=>[[1,0,0],[0,1,0],[0,0,1]],
  cols:(a,b,c)=>[[a[0],b[0],c[0]],[a[1],b[1],c[1]],[a[2],b[2],c[2]]],
  /* rotate by the angle |w|h about w (Rodrigues), right-multiplied: B <- B exp([w]x h) */
  rot(B,w,h){
    const th=Math.hypot(w[0],w[1],w[2])*h;
    if(th<1e-15) return B;
    const k=[w[0]*h/th,w[1]*h/th,w[2]*h/th], c=Math.cos(th), s=Math.sin(th), C=1-c;
    const R=[[c+k[0]*k[0]*C,k[0]*k[1]*C-k[2]*s,k[0]*k[2]*C+k[1]*s],
             [k[1]*k[0]*C+k[2]*s,c+k[1]*k[1]*C,k[1]*k[2]*C-k[0]*s],
             [k[2]*k[0]*C-k[1]*s,k[2]*k[1]*C+k[0]*s,c+k[2]*k[2]*C]];
    return m3.mul(B,R);
  },
  /* Gram-Schmidt on the columns, so long integrations stay orthonormal */
  ortho(B){ const T=m3.T(B); const x=vunit(T[0]), y0=vsub(T[1],vmul(x,vdot(T[1],x))), y=vunit(y0), z=vcross(x,y);
    return m3.cols(x,y,z); },
};

/* ---- the Moon, as Luminary 099 orients it ----
   PLANETARY_INERTIAL_ORIENTATION (MOONMX, NEWANGLE) with CONTROLLED_CONSTANTS' BSUBO/BDOT, FSUBO/FDOT, NODIO/NODDOT,
   COSI/SINI (the listing's own radian values) and TIMSUBO = TEPHEM, the time from 1969 July 1.0 to the launch:
   moon-fixed = M(T) ref, and RP-TO-R: R = M^T (RP + L x RP) with L = 504LM, the libration vector (pad load). */
const MOON_CONST={B0:0.40916190299,BD:-7.19757301e-14,F0:5.20932947829,FD:2.67240410e-6,
  N0:6.19653663041,ND:-1.07047011e-8,cI:0.99964173,sI:0.02676579};
/* the pad load's TEPHEM (TP, cs B42) and 504LM (rad B0, three DP) and RLS (m B27) */
const padWord=a=>PADLOAD99[a.toString(8).padStart(4,'0')];
const padDP=(a,B)=>(agcFrac(padWord(a))+agcFrac(padWord(a+1))/16384)*Math.pow(2,B);
const TEPHEM_CS=padWord(0o1706)*268435456+padWord(0o1707)*16384+padWord(0o1710);
const L504=[padDP(0o2012,0),padDP(0o2014,0),padDP(0o2016,0)];
const RLS_PAD=[padDP(0o2022,27),padDP(0o2024,27),padDP(0o2026,27)];
function moonMx(get){
  const K=MOON_CONST, t=get+TEPHEM_CS/100;
  const B=K.B0+K.BD*t, F=K.F0+K.FD*t, N=K.N0+K.ND*t;
  const cB=Math.cos(B), sB=Math.sin(B), cN=Math.cos(N), sN=Math.sin(N), cF=Math.cos(F), sF=Math.sin(F);
  const A=[cN,cB*sN,sB*sN], Bv=[-sN,cB*cN,sB*cN], C=[0,-sB,cB];
  const M2=vadd(vmul(Bv,K.sI),vmul(C,K.cI)), D=vsub(vmul(Bv,K.cI),vmul(C,K.sI));
  const M1=vsub(vmul(A,sF),vmul(D,cF)), M0=vmul(vadd(vmul(A,cF),vmul(D,sF)),-1);
  return [M0,M1,M2];
}
/* a moon-fixed vector to the reference frame at GET t, and back (R-TO-RP: RP = M (R - L' x R), L' = M^T L) */
function rpToR(rp,get){ const M=moonMx(get); return m3.tv(M,vadd(rp,vcross(L504,rp))); }
function rToRp(r,get){ const M=moonMx(get), Lr=m3.tv(M,L504); return m3.mv(M,vsub(r,vcross(Lr,r))); }
/* the Moon's spin axis in the reference frame (the M matrix's third row) and rate (MOONRATE, rad/s) */
const moonPole=get=>moonMx(get)[2];
const MOONRATE=0.26616994890062991e-7*100;
/* the surface's velocity at r (the Moon turns about its pole at MOONRATE) */
const moonSurfV=(r,get)=>vcross(vmul(moonPole(get),MOONRATE),r);

/* ---- the LM, Apollo 11's LM-5 ----
   Mass properties: Apollo 11 Mission Report MSC-00171 Table A-I, at descent-orbit-insertion cutoff and at the lunar
   landing (station inches, slug ft^2; the page interpolates them on mass; products of inertia, a few per cent, are
   left out).  RCS: 16 jets of 100 lbf at the positions of NASSP's LEM::AddRCS_LMH (lemsystems.cpp; quads on the
   diagonals 66.1 in out, up-firing jets 4.8 in above the 254-in RCS plane, down-firing 5.3 in below), in Luminary's
   channel 5 and 6 bit order (the DAP's ALLJETS/TYPEPOLY/JETSALL tables; NASSP's ATCA agrees).  DPS: the gimbal pivot
   at station 154.0 in (NASSP; the AOH puts the gimbal ring at the throat), +-6 deg at 0.2 deg/s (AOH Table 2.2-38,
   TORKJET1), full throttle 9,870 lbf, 94 % (AOH Table 2.3-2; THROTTLE_CONTROL_ROUTINES "10% - 94%"), the throttle
   at 12.532 N per THRUST pulse (BITPERF), the command register saturating at FMAXODD = 3841 pulses (what WHERETO
   assumes), the manual throttle at its 10 % stop (1,050 lbf), the engine's response a 0.2 s lag (THROTLAG). */
const LBM=0.45359237, INCH=0.0254, SLUGFT2=1.3558179483314;
const LMP={
  doi:{m:33401.6*LBM, cg:[186.5,0.2,0.8], I:[23480,25978,25871]},
  land:{m:16153.2*LBM, cg:[213.5,0.4,1.6], I:[12582,13867,16204]},
  pivotX:154.0,
  jetF:100*LBF, jetVe:2840,
  ftp:9870*LBF, pulseN:1/0.0797959872, fsatPulses:3841, manual:1050*LBF, lag:0.2,
  gimRate:0.2*PI/180, gimMax:6*PI/180,
};
/* the jets: [channel, bit (1-8), jet number, station x, y, z (in), force axis 0-2, sign] */
const LM_JETS=[
  [5,1,1,258.8,66.1,66.1,0,-1],[5,2,2,248.7,66.1,66.1,0,1],[5,3,5,258.8,66.1,-66.1,0,-1],[5,4,6,248.7,66.1,-66.1,0,1],
  [5,5,9,258.8,-66.1,-66.1,0,-1],[5,6,10,248.7,-66.1,-66.1,0,1],[5,7,13,258.8,-66.1,66.1,0,-1],[5,8,14,248.7,-66.1,66.1,0,1],
  [6,1,7,254.0,61.5,-66.35,2,1],[6,2,3,254.0,61.5,66.35,2,-1],[6,3,15,254.0,-61.5,66.35,2,-1],[6,4,11,254.0,-61.5,-66.35,2,1],
  [6,5,12,254.0,-66.35,-61.5,1,1],[6,6,8,254.0,66.35,-61.5,1,-1],[6,7,4,254.0,66.35,61.5,1,-1],[6,8,16,254.0,-66.35,61.5,1,1]];
/* the ascent stage: Mission Report Table A-I at lunar lift-off, orbit insertion, coelliptic sequence initiation and
   docking (station inches, slug ft^2; the page interpolates them on mass between the rows; products of inertia left
   out).  The ascent engine (APS): MR Table 9.9-I's predicted thrust and specific impulse, 3,464 lbf and 309.4 s at
   10 s, 3,439 lbf and 308.8 s at 400 s (no thrust was measured), linear in the burn's time between; NASSP's thrust
   line (lemmesh.cpp, the ascent stage): from station X 232.96 in, Z +3.75 in, canted 1.5 deg toward +Z; a linear rise
   over 0.764 s and a linear tail-off over 0.353 s (NASSP's lm_aps.cpp: "0.384s engine on delay from GSOP", "17.65cs
   cutoff delay").  No gimbal, no throttle. */
const LMA={rows:[
    {m:10776.6*LBM, cg:[243.5,0.2,2.9], I:[6808,3475,5971]},
    {m:5928.6*LBM, cg:[255.3,0.4,5.3], I:[3457,3082,2273]},
    {m:5881.5*LBM, cg:[255.0,0.4,5.3], I:[3437,3069,2246]},
    {m:5738.0*LBM, cg:[254.4,0.4,5.4], I:[3369,3044,2167]}],
  apsX:232.96, apsZ:3.75, apsCant:1.5*PI/180, rise:0.764, decay:0.353,
  F:[[10,3464*LBF,309.4],[400,3439*LBF,308.8]]};
function lmMassPropsAsc(m){
  const R=LMA.rows; let i=0; while(i<R.length-2&&m<R[i+1].m) i++;
  const a=R[i], b=R[i+1], f=clamp((a.m-m)/(a.m-b.m),0,1), lin=(p,q)=>p+(q-p)*f;
  return {cg:[0,1,2].map(k=>lin(a.cg[k],b.cg[k])*INCH), I:[0,1,2].map(k=>lin(a.I[k],b.I[k])*SLUGFT2)};
}
/* the APS's full thrust (N) and specific impulse (s) t seconds into its burn; its thrust direction in body axes */
function apsAt(t){ const [a,b]=LMA.F, f=clamp((t-a[0])/(b[0]-a[0]),0,1); return [a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]; }
const APS_DIR=[Math.cos(LMA.apsCant),0,Math.sin(LMA.apsCant)];
/* the APS follows ENGINE ON (and the arm switch): up over LMA.rise, down over LMA.decay */
function apsFollow(L,dt){
  const Fmax=apsAt(L.apsT||0)[0];
  if(L.engOn&&L.armed) L.F=Math.min(Fmax,L.F+Fmax*dt/LMA.rise); else L.F=Math.max(0,L.F-Fmax*dt/LMA.decay);
  if(L.F>0) L.apsT=(L.apsT||0)+dt;
}
/* mass properties at mass m (kg): the CG (body metres, from station 0) and the principal moments (kg m^2) */
function lmMassProps(m){
  const a=LMP.doi, b=LMP.land, f=clamp((m-b.m)/(a.m-b.m),0,1.2);
  const lin=(p,q)=>q+(p-q)*f;
  return {cg:[0,1,2].map(i=>lin(a.cg[i],b.cg[i])*INCH), I:[0,1,2].map(i=>lin(a.I[i],b.I[i])*SLUGFT2)};
}
/* the DPS thrust direction in body axes for gimbal angles gq (about +Y: tilts toward +Z, a +Q torque about a CG above
   the pivot) and gr (tilts toward -Y, a +R torque): ch12 bit 9 (00400) and bit 11 (02000) raise gq and gr, bits 10
   and 12 lower them (the DAP's own model: ACDT+C12 and 1/ACCS GIMBLBTS; NASSP's DECA agrees) */
const dpsDir=(gq,gr)=>vunit([1,-Math.tan(gr),Math.tan(gq)]);

/* ---- the IMU ----
   The stable member is fixed in inertial space; REFSMMAT's rows are its axes.  The gimbals, outer (CDUX) about the
   LM's X, middle (CDUZ), inner (CDUY): v_SM = Ry(IGA) Rz(MGA) Rx(OGA) v_NB (POWERED_FLIGHT_SUBROUTINES CDUTRIGS,
   AX*SR*T; FLESHPOT's XNB = (cosY cosZ, sinZ, -sinY cosZ)); the counters hold the angles as 15-bit two's complement,
   2^15 per revolution.  A PIPA pulse is 1 cm/s along a stable-member axis (SERVICER: KPIP1 .0128 at 2^7 m/cs). */
function gimbalAngles(Msb){                         /* Msb: body -> stable member */
  const mga=Math.asin(clamp(Msb[1][0],-1,1));
  return {oga:Math.atan2(-Msb[1][2],Msb[1][1]), iga:Math.atan2(-Msb[2][0],Msb[0][0]), mga};
}
const cduCount=a=>{ const c=Math.round(a/TAU*32768); return ((c%32768)+32768)%32768; };
const cduAngle=c=>((c&0x7fff)>=16384?(c&0x7fff)-32768:(c&0x7fff))/32768*TAU;
/* the LM's FDAI ball angles from the gimbal angles, as BALLANGS (R63.agc) computes N18: roll, pitch, yaw */
function ballAngles(oga,iga,mga){
  const sx=Math.sin(oga),cx=Math.cos(oga),sy=Math.sin(iga),cy=Math.cos(iga),sz=Math.sin(mga),cz=Math.cos(mga);
  return {yaw:Math.asin(clamp(-sx*cz,-1,1)), roll:Math.atan2(sz,cz*cx), pitch:Math.atan2(cx*sy+sx*sz*cy,cx*cy-sx*sz*sy)};
}
/* the body axes from gimbal angles (the inverse, for setting an attitude): returns body -> stable member */
function smFromGimbals(oga,iga,mga){
  const Rx=a=>[[1,0,0],[0,Math.cos(a),-Math.sin(a)],[0,Math.sin(a),Math.cos(a)]];
  const Ry=a=>[[Math.cos(a),0,Math.sin(a)],[0,1,0],[-Math.sin(a),0,Math.cos(a)]];
  const Rz=a=>[[Math.cos(a),-Math.sin(a),0],[Math.sin(a),Math.cos(a),0],[0,0,1]];
  return m3.mul(Ry(iga),m3.mul(Rz(mga),Rx(oga)));
}

/* ---- the landing radar ----
   Its antenna frame: v_ant = Ry(beta) Rx(alpha) v_NB (SERVICER SETPOS via TRG*SMNB) with the pad load's LRALPHA,
   LRBETA1 (position 1) and LRALPHA2, LRBETA2 (position 2).  The velocity words are the LM's velocity over the turning
   surface along the antenna axes, RNRAD = 12288 + V/scale with -0.644, 1.212, 0.8668 ft/s per count (VXSCAL,
   VYSCAL, VZSCAL; LVELBIAS); the range word the slant range along the range beam HBEAMANT (20.38 deg from the
   antenna's -X toward -Z) to the surface, 1.079 ft per count on low scale and five times that on high scale (SCALADJ:
   two DDOUBLs then DAS onto the count, x5; HISCALIM 460 = 2481.7 ft).  Channel 13 bits 1-3 select: 4 VX, 5 VY, 6 VZ,
   7 range.  The surface is the sphere through the landing site (|RLS|). */
const LR={pos:[[padWordAngle(0o2522),padWordAngle(0o2523)],[padWordAngle(0o2524),padWordAngle(0o2525)]],
  vscale:[-0.644*FT,1.212*FT,0.8668*FT], hlo:1.079*FT, hhi:5*1.079*FT, beam:vunit([-0.4687018041,0,-0.1741224271]),
  maxRange:50000*FT, lowScaleBelow:2500*FT, moveTime:10, acquire:2.0};
function padWordAngle(a){ const w=padWord(a); return ((w&0o40000)?w-32768:w)/32768*TAU; }   /* CDU format, half-revs */
function lrAntenna(p){                                 /* antenna axes in body coordinates, position p (0, 1) */
  const [al,be]=LR.pos[p];
  const Rx=[[1,0,0],[0,Math.cos(al),-Math.sin(al)],[0,Math.sin(al),Math.cos(al)]];
  const Ry=[[Math.cos(be),0,Math.sin(be)],[0,1,0],[-Math.sin(be),0,Math.cos(be)]];
  return m3.mul(Ry,Rx);                                /* v_ant = A v_NB */
}
/* where a ray from r along unit d meets the sphere of radius R: the distance, or null */
function raySphere(r,d,R){
  const b=vdot(r,d), c=vdot(r,r)-R*R, disc=b*b-c;
  if(disc<0) return null;
  const s=-b-Math.sqrt(disc);
  return s>0?s:null;
}

/* ---- the IMU's errors, as the pad load gives them (Luminary removes them in 1/PIPA): PIPA bias PBIASX/Y/Z in pulses
   per centisecond (B-5) and scale-factor error PIPASCFX/Y/Z (B-9); the hardware counts N = (dV + bias dt) / (1 + SFE)
   so that 1/PIPA's N + N SFE - bias dt gives the true dV back. ---- */
const PIPA_BIAS=[0o1452,0o1454,0o1456].map(a=>agcFrac(padWord(a))/32);          /* pulses/cs */
const PIPA_SFE=[0o1453,0o1455,0o1457].map(a=>agcFrac(padWord(a))/512);
/* the DPS specific impulse: the Apollo 10 LM-4 engine evaluation (NAS 9-8166, same engine type): 296.5 s at 13.1 %
   (1,371 lbf), 304.0 s at the fixed throttle position (9,841 lbf), linear between */
function lmIsp(F){ const f0=1371*LBF, f1=9841*LBF; return 296.5+(304.0-296.5)*clamp((F-f0)/(f1-f0),0,1); }

/* the LM: position and velocity in the reference frame (m, m/s), attitude B (body -> reference), body rates w (rad/s),
   mass m and descent propellant prop (kg), the stable member S (its axes as the columns, in the reference frame) */
function lmNew(o){
  return {r:o.r.slice(), v:o.v.slice(), B:o.B.map(x=>x.slice()), w:(o.w||[0,0,0]).slice(), m:o.m, prop:o.prop, S:o.S,
    ch5:0, ch6:0, ch12:0, engOn:false, armed:true, stop:false, F:0, cmdA:0, gq:o.gq||0, gr:o.gr||0,
    pipa:[0,0,0], lrPos:0, lrMove:0, lrSeen:-1, contact:false, landed:false, get:o.get,
    jetOn:new Array(16).fill(0)};
}
/* forces (body, N), torques about the CG (body, N m) and mass flows (kg/s) now */
function lmLoads(L){
  const mp=L.asc?lmMassPropsAsc(L.m):lmMassProps(L.m), cg=mp.cg;
  let F=[0,0,0], T=[0,0,0], mrcs=0, mdps=0;
  for(let i=0;i<16;i++){
    const j=LM_JETS[i], bits=j[0]===5?L.ch5:L.ch6;
    if(!((bits>>(j[1]-1))&1)) continue;
    const f=[0,0,0]; f[j[6]]=j[7]*LMP.jetF;
    F=vadd(F,f); T=vadd(T,vcross([j[3]*INCH-cg[0],j[4]*INCH-cg[1],j[5]*INCH-cg[2]],f)); mrcs+=LMP.jetF/LMP.jetVe;
  }
  if(L.F>0&&L.asc){
    const f=vmul(APS_DIR,L.F);
    F=vadd(F,f); T=vadd(T,vcross([LMA.apsX*INCH-cg[0],-cg[1],LMA.apsZ*INCH-cg[2]],f)); mdps=L.F/(apsAt(L.apsT||0)[1]*G0);
  }
  else if(L.F>0){
    const f=vmul(dpsDir(L.gq,L.gr),L.F);
    F=vadd(F,f); T=vadd(T,vcross([LMP.pivotX*INCH-cg[0],-cg[1],-cg[2]],f)); mdps=L.F/(lmIsp(L.F)*G0);
  }
  return {F,T,mrcs,mdps,I:mp.I};
}
const lmGrav=r=>{ const d=vlen(r); return vmul(r,-MUM_SI/(d*d*d)); };
/* the Moon's field as Luminary's coast has it in lunar orbit (ORBITAL_INTEGRATION's OBLATE, MIDFLAG off): the point
   mass, J2 and J3 (CONTROLLED_CONSTANTS: J2REQSQ = J2 R^2 mu, and the constant named 2J3RE/J2, which is J3 R / J2, as
   the Earth's entry beside it shows), C22 and C31 (the pad load's E3J22R2M = 3 J22 R^2 mu, and E32C31RM, QUALITY3's
   gradient of x (5 z^2 - r^2) / r^7), in the LGC's own moon-fixed frame (R-TO-RP), m and s (the LGC's cs: x 1e4).
   Found against the LGC's own coast of the CSM's state over 57 min: 21 m apart along the orbit, where the point mass
   alone is 1,606 m.  The rendezvous's LM and CSM fly in it; the descent's world keeps the point mass its fit was made
   in.  The frame is taken every 10 s (the Moon turns 0.0016 deg in that time) */
const MOONF={J2:0.3067493316e18*1e4, J3:-176236.02*0.3067493316e18*1e4, C22:92.0479047931e15*1e4, C31:13.1289255968e22*1e4};
let MOONF_FRAME=null;
function moonFieldAcc(r,get){
  const k=Math.floor(get/10);
  if(!MOONF_FRAME||MOONF_FRAME.k!==k){ const M=moonMx(k*10); MOONF_FRAME={k,M,Lr:m3.tv(M,L504)}; }
  const F=MOONF_FRAME, d=vlen(r), p=m3.mv(F.M,vsub(r,vcross(F.Lr,r))), pl=vlen(p), X=p[0]/pl, Y=p[1]/pl, Z=p[2]/pl;
  const d4=d*d*d*d, d5=d4*d, z2=Z*Z, k2=1.5*MOONF.J2/d4, k3=2.5*MOONF.J3/d5, k22=MOONF.C22/d4, k31=MOONF.C31/d5;
  const f22=5*(Y*Y-X*X), f31=5*X*(1-7*z2);
  const a=[-k2*X*(1-5*z2)+k3*X*Z*(7*z2-3)+k22*(2*X+f22*X)+k31*(f31*X+5*z2-1),
           -k2*Y*(1-5*z2)+k3*Y*Z*(7*z2-3)+k22*(f22*Y-2*Y)+k31*f31*Y,
           -k2*Z*(3-5*z2)+k3*(7*z2*z2-6*z2+0.6)+k22*f22*Z+k31*(f31*Z+10*X*Z)];
  return vadd(vmul(r,-MUM_SI/(d*d*d)),m3.tv(F.M,vadd(a,vcross(L504,a))));
}
/* the thrust the descent engine is commanded to: the manual 10 % plus the auto register, saturated at FMAXODD, the
   throttle valve's travel ending at the fixed throttle position */
function lmThrustTarget(L){
  if(!L.engOn||!L.armed||L.stop||L.prop<=0) return 0;
  return Math.min(LMP.ftp,Math.min(LMP.manual+L.cmdA,LMP.fsatPulses*LMP.pulseN));
}
/* THRUST pulses from the computer (POUT - MOUT): the auto register in the DECA */
function lmThrottle(L,pulses){
  L.cmdA=clamp(L.cmdA+pulses*LMP.pulseN,0,LMP.fsatPulses*LMP.pulseN-LMP.manual);
}
/* advance the LM dt seconds with the jets, the engine command and the gimbal drives held */
function lmAdvance(L,dt){
  /* the ascent stage on the surface: the APS builds up until its push along the vertical beats the weight */
  if(L.landed&&L.asc){
    const up=vunit(L.r), lift=L.F*vdot(m3.mv(L.B,APS_DIR),up), wt=L.m*MUM_SI/vdot(L.r,L.r);
    if(lift<=wt){ lmOnSurface(L,dt); L.m-=L.F/(apsAt(L.apsT||0)[1]*G0)*dt; apsFollow(L,dt); return; }
    L.landed=false; L.liftoff=L.get;
  }
  if(L.landed){ lmOnSurface(L,dt); return; }
  const ld=lmLoads(L);
  /* rotation: Euler's equations about the principal axes */
  const I=ld.I, w=L.w, gy=vcross(w,[I[0]*w[0],I[1]*w[1],I[2]*w[2]]);
  for(let k=0;k<3;k++) w[k]+=(ld.T[k]-gy[k])/I[k]*dt;
  L.B=m3.rot(L.B,w,dt);
  /* translation: RK4, the thrust held in the reference frame over the step */
  const aT=vmul(m3.mv(L.B,ld.F),1/L.m), r0=L.r, v0=L.v;
  const gf=L.harm?(r=>moonFieldAcc(r,L.get)):lmGrav, acc=r=>vadd(gf(r),aT);
  const k1v=acc(r0), k1r=v0;
  const k2v=acc(vadd(r0,vmul(k1r,dt/2))), k2r=vadd(v0,vmul(k1v,dt/2));
  const k3v=acc(vadd(r0,vmul(k2r,dt/2))), k3r=vadd(v0,vmul(k2v,dt/2));
  const k4v=acc(vadd(r0,vmul(k3r,dt))), k4r=vadd(v0,vmul(k3v,dt));
  L.r=vadd(r0,vmul(vadd(vadd(k1r,vmul(k2r,2)),vadd(vmul(k3r,2),k4r)),dt/6));
  L.v=vadd(v0,vmul(vadd(vadd(k1v,vmul(k2v,2)),vadd(vmul(k3v,2),k4v)),dt/6));
  /* the PIPAs: the specific force along the stable member's axes, through the IMU's errors */
  const dv=m3.tv(L.S,vmul(aT,dt));
  for(let k=0;k<3;k++) L.pipa[k]+=(dv[k]*100+PIPA_BIAS[k]*dt*100)/(1+PIPA_SFE[k]);
  /* propellant and mass */
  L.m-=(ld.mrcs+ld.mdps)*dt; L.prop=Math.max(0,L.prop-ld.mdps*dt);
  if(L.asc){ apsFollow(L,dt); for(let i=0;i<16;i++){ const j=LM_JETS[i]; if(((j[0]===5?L.ch5:L.ch6)>>(j[1]-1))&1) L.jetOn[i]+=dt; } L.get+=dt; return; }
  /* the engine follows its command with the 0.2 s lag; the trim gimbals drive at 0.2 deg/s */
  const tgt=lmThrustTarget(L);
  L.F+=(tgt-L.F)*(1-Math.exp(-dt/LMP.lag));
  if(L.F<1&&tgt===0) L.F=0;
  const g=LMP.gimRate*dt, c=L.ch12;
  if(c&0o400) L.gq+=g; if(c&0o1000) L.gq-=g; if(c&0o2000) L.gr+=g; if(c&0o4000) L.gr-=g;
  L.gq=clamp(L.gq,-LMP.gimMax,LMP.gimMax); L.gr=clamp(L.gr,-LMP.gimMax,LMP.gimMax);
  for(let i=0;i<16;i++){ const j=LM_JETS[i]; if(((j[0]===5?L.ch5:L.ch6)>>(j[1]-1))&1) L.jetOn[i]+=dt; }
  L.get+=dt;
}
/* on the surface: the LM turns with the Moon */
function lmOnSurface(L,dt){
  const ax=moonPole(L.get), w=vmul(ax,MOONRATE);
  const Rm=m3.rot(m3.I(),ax,MOONRATE*dt);               /* rotation of the Moon over dt */
  L.r=m3.mv(Rm,L.r); L.v=vcross(w,L.r); L.B=m3.mul(Rm,L.B); L.w=[0,0,0];
  const dv=m3.tv(L.S,vmul(vmul(L.r,MUM_SI/Math.pow(vlen(L.r),3)),dt));     /* the surface holds the LM up */
  for(let k=0;k<3;k++) L.pipa[k]+=(dv[k]*100+PIPA_BIAS[k]*dt*100)/(1+PIPA_SFE[k]);
  L.get+=dt;
}
/* the gimbal angles the IMU's resolvers read now */
function lmGimbals(L){ return gimbalAngles(m3.mul(m3.T(L.S),L.B)); }
/* ================================================================== *
 *  the descent on the real LGC                                       *
 * ================================================================== *
 * The LM's world (p3_lmsim.js) around Luminary 099 (p2_agc.js).  The
 * world starts at 102:10:20, the LM coasting in its descent orbit; the
 * computer is powered up, given its prelaunch load (the LM Data Book's
 * Table LM5/4.5.1-1) and what the ground and the crew loaded later (the
 * state vectors, the landing-site REFSMMAT, TLAND, the DAP data of
 * 98:24), and from then on it flies: the crew's keys at their times,
 * the guidance, the throttle, the jets, the radar, the alarms.
 */

/* ---- the flight's facts and the page's choices ----
   TIG: the PDI PAD (TEC 100:22:05, 102:33:04.36).  TLAND: when IGNALG's nominal descent reaches the site from that
   TIG, TIG + ZOOMTIME (26 s) + GUIDDURN (664.40 s, THE_LUNAR_LANDING) = 102:44:34.76; the pad load's TLAND is one
   revolution earlier (100:50:49.20).  Masses: Mission Report Table A-I at DOI cutoff (33,401.6 lb); the DAP data
   load of TEC 98:24:07 (LM 33,627 lb, CSM 36,651 lb, pitch trim 4.70, roll trim 5.89).  The descent orbit (the LGC's
   estimate at TIG): perilune 49,955 ft over the landing site's radius (MR Table 5-III, the LGC's altitude at PDI),
   apolune 57.2 nmi (MR p. 4-7), the ground track heading due west at the site (Apollo's lunar orbits ran east to west
   over the near side; the flown inclination, 1.25 deg, would turn it by about 1 deg).  The truth: the same orbit
   A11LM.lead seconds further on (the Mission Report's 20,000-21,000 ft downrange error at PDI, which "will cause a
   1-ft/sec radial velocity error" per 1000 ft) and 579 ft lower (MR Table 5-III: best estimate 49,376 ft).
   A11LM.phase places the LGC's orbit; both were fitted with the real LGC (agc/calibrate_lm.js) to the PAD's TIG and
   to Aldrin's "DELTA-H is minus 2 900" at 102:38:04. */
const A11LM={
  start:getOf(102,10,20), tig:getOf(102,33,4.36), tland:getOf(102,44,34.76),
  mLM:33401.6*LBM, mLMload:33627*LBM, mCSM:36651*LBM, propDPS:8137.7, trimP:4.70, trimR:5.89, n46:0o20102,
  ha:57.2*NMI, hpTrue:49376*FT, lead:3.70,
  hpLGC:50888.5*FT, phase:-1.53, dvr:-4.90*FT,          /* fitted with the real LGC (agc/calibrate_lm.js) */
  csmLag:150,                    /* s: the CSM behind the LM at TIG (the LM's lower orbit gains ~290 s a revolution after DOI) */
};
const LM_SLICE=0.02;                                    /* s: the computer and the LM step together in slices this long */

/* the landing site, and the descent orbit's plane: through the site at TLAND, heading west */
function lmSiteFrame(){
  return memo('lmSiteFrame',A11LM.tland,()=>{
    const s=rpToR(RLS_PAD,A11LM.tland), up=vunit(s), pole=moonPole(A11LM.tland);
    const east=vunit(vcross(pole,up)), fwd=vmul(east,-1), n=vunit(vcross(up,fwd));
    return {s,up,fwd,n,R:vlen(RLS_PAD)};
  });
}
/* the distance from position r to the LGC's site (RLS turned with the Moon to GET t) along the track, on the site's
   sphere: positive while the site is ahead */
function lgcAlong(r,t){
  const F=lmSiteFrame(), u=vunit(r), s=vunit(rpToR(RLS_PAD,t));
  return Math.atan2(vdot(vcross(u,s),F.n),vdot(u,s))*F.R;
}
/* the LGC's estimate of the orbit: perilune at central angle th from the site (negative = uprange), at A11LM.tig +
   A11LM.phase; returns r, v at GET t (Kepler, the page's spherical Moon) */
function lmOrbitAt(t,th,hp){
  const F=lmSiteFrame(), rp=F.R+(hp===undefined?A11LM.hpLGC:hp), ra=F.R+A11LM.ha, a=(rp+ra)/2;
  const vp=Math.sqrt(MUM_SI*(2/rp-1/a));
  const c=Math.cos(th), s=Math.sin(th);
  const u=vadd(vmul(F.up,c),vmul(F.fwd,s)), f=vsub(vmul(F.fwd,c),vmul(F.up,s));
  const r0=vmul(u,rp), v0=vmul(f,vp);
  return keplerProp(r0,v0,t-(A11LM.tig+A11LM.phase),MUM_SI);
}
/* the perilune's angle: where IGNALG's ignition point is, 26 s of flight before TDEC1 at 436.7 km (RIGNZ) uprange */
const LM_TH_PERI=-(436655.657+26*1694.7)/1735016.7;

/* the CSM: a 60-nmi circular orbit in the same plane, csmLag seconds behind the LM at TIG */
function csmOrbitAt(t){
  const F=lmSiteFrame(), r=F.R+60*NMI, v=Math.sqrt(MUM_SI/r);
  const L=lmOrbitAt(A11LM.tig,LM_TH_PERI), th0=Math.atan2(vdot(L[0],F.fwd),vdot(L[0],F.up))-A11LM.csmLag*v/r;
  const u=vadd(vmul(F.up,Math.cos(th0)),vmul(F.fwd,Math.sin(th0))), f=vsub(vmul(F.fwd,Math.cos(th0)),vmul(F.up,Math.sin(th0)));
  return keplerProp(vmul(u,r),vmul(f,v),t-A11LM.tig,MUM_SI);
}
/* the truth: the orbit through the Mission Report's altitude at PDI (hpTrue), A11LM.lead s further on than the
   LGC's estimate, with A11LM.dvr more radial velocity at TIG, back at GET t */
function lmTruthAt(t){
  const [r0,v0]=lmOrbitAt(A11LM.tig+A11LM.lead,LM_TH_PERI,A11LM.hpTrue);
  return keplerProp(r0,vadd(v0,vmul(vunit(r0),A11LM.dvr)),t-A11LM.tig,MUM_SI);
}
/* the landing-site REFSMMAT (P52 option 4, LSORIENT): X up through the site at TLAND, Z = unit((Rcsm x Vcsm) x X)
   downrange, Y = Z x X; the rows of REFSMMAT are these axes, so the stable member's axes in the reference frame are
   the columns of S = REFSMMAT^T */
function lmRefsmmat(){
  const F=lmSiteFrame(), [rc,vc]=csmOrbitAt(A11LM.tland);
  const X=F.up, Z=vunit(vcross(vcross(rc,vc),X)), Y=vunit(vcross(Z,X));
  return [X,Y,Z];
}

/* ---- the computer's loads: a state vector, REFSMMAT, the clock, masses ---- */
function lgcWriteVec(A,addr,v,B){ for(let k=0;k<3;k++) agcSetDP(A,addr+2*k,v[k],B); }
/* a permanent state vector (INTEGRATION_INITIALIZATION's table; Moon: R B27 m, V B5 m/cs, TET B28 cs; the Encke
   deviations zero; RCV, VCV = R, V), as P27's INTWAKEU would leave it */
function lgcStateVector(A,base,r,v,t){
  const vcs=vmul(v,0.01);
  lgcWriteVec(A,base,r,27); lgcWriteVec(A,base+6,vcs,5); agcSetDP(A,base+12,t*100,28);
  for(let k=14;k<26;k++) A.setE(base+k,0);                       /* DELTA, NUV */
  lgcWriteVec(A,base+26,r,27); lgcWriteVec(A,base+32,vcs,5);      /* RCV, VCV */
  for(let k=38;k<42;k++) A.setE(base+k,0);                       /* TC, XKEP */
}
function lgcRefsmmat(A,rows){ for(let i=0;i<3;i++) for(let j=0;j<3;j++) agcSetDP(A,L99.REFSMMAT+6*i+2*j,rows[i][j],1); }
/* everything loaded after the power-up's fresh start (which leaves erasable banks 3-7, the clock and the masses
   alone and resets the flag words): the prelaunch load, the clock, both state vectors (TET = now), the landing-site
   REFSMMAT, TLAND, the masses and trims of the DAP data load, the DAP word of N46, and the flags last (FLAGWRD3
   REFSMFLG; FLAGWRD8 CMOONFLG + LMOONFLG: both vectors are Moon-centred) */
function lgcLoads(W){
  const C=W.C, A=C.A, t=worldGET(W);
  compPadload(C,PADLOAD99);
  compSetClock(C,t);
  const [rl,vl]=lmOrbitAt(t,LM_TH_PERI), [rc,vc]=csmOrbitAt(t);
  lgcStateVector(A,L99.RRECTLEM,rl,vl,t); lgcStateVector(A,L99.RRECTCSM,rc,vc,t);
  lgcRefsmmat(A,lmRefsmmat());
  agcSetDP(A,L99.TLAND,A11LM.tland*100,28);
  agcSetDP(A,L99.MASS,A11LM.mLM,16); agcSetSP(A,L99.LEMMASS,A11LM.mLM,16); agcSetSP(A,L99.CSMMASS,A11LM.mCSM,16);
  agcSetSP(A,L99.PITTIME,A11LM.trimP/0.002,14); agcSetSP(A,L99.ROLLTIME,A11LM.trimR/0.002,14);
  A.setE(L99.DAPBOOLS,(A.E(L99.DAPBOOLS)&~0o13113&0o77777)|(A11LM.n46&0o13113));
  A.setE(L99.FLAGWRD3,A.E(L99.FLAGWRD3)|0o10000);
  A.setE(L99.FLAGWRD8,(A.E(L99.FLAGWRD8)|0o6000)&~0o200);
  A.setE(L99.FLGWRD10,0);
  W.loaded=true;
  logEvent(W,'the computer loaded: prelaunch pad load, clock, state vectors, landing-site REFSMMAT, TLAND, DAP data');
}

/* ---- the switches and signals the computer reads (channels 30-33: 0 = the signal is present) ---- */
function lmDiscretes(W){
  const A=W.C.A, L=W.L, sw=W.sw;
  /* ch30: 1 abort, 3 engine armed, 4 abort stage, 5 auto throttle, 6 display inertial data, 7 RR CDU fail, 9 IMU
     operate, 10 PGNCS in control, 11 IMU cage, 12 IMU CDU fail, 13 IMU fail, 14 ISS turn-on request, 15 IMU temp OK */
  let c30=0o77777;
  if(L.armed) c30&=~0o4;
  if(sw.autoThrottle) c30&=~0o20;
  if(sw.disInertial) c30&=~0o40;
  c30&=~0o400; c30&=~0o1000; c30&=~0o40000;
  A.chan(0o30,c30,0o77777);
  /* ch31: 13 ATT HOLD, 14 AUTO, 15 out of detent; 1-6 the hand controller's discretes (P64 redesignations), 7-12 THC */
  let c31=0o77777;
  if(sw.mode==='hold') c31&=~0o10000; else if(sw.mode==='auto') c31&=~0o20000;
  if(sw.rhcOut) c31&=~0o40000;
  c31&=~(sw.lpd||0);
  /* bits 7-12: the translation hand controller, +X -X +Y -Y +Z -Z (the ascent's trims, the rendezvous burns) */
  if(sw.thc){ const t=sw.thc; if(t[0]>0) c31&=~0o100; if(t[0]<0) c31&=~0o200; if(t[1]>0) c31&=~0o400; if(t[1]<0) c31&=~0o1000;
    if(t[2]>0) c31&=~0o2000; if(t[2]<0) c31&=~0o4000; }
  A.chan(0o31,c31,0o77777);
  /* ch32: thruster pairs enabled, gimbals enabled (PRO, bit 14, is the DSKY's own) */
  A.chan(0o32,0o17777,0o17777);
  /* ch33: 5 LR range data good, 6 LR position 1, 7 LR position 2, 8 LR velocity data good, 9 LR range low scale */
  let c33=0o1777;
  if(W.lr.good) c33&=~0o220;
  if(!L.lrMove&&L.lrPos===0) c33&=~0o40;
  if(!L.lrMove&&L.lrPos===1) c33&=~0o100;
  if(W.lr.low) c33&=~0o400;
  /* the rendezvous radar's (a world with W.rr): 2 powered and in LGC mode, 3 range on low scale, 4 data good */
  if(W.rr){ if(W.rr.on&&W.sw.rrMode==='LGC') c33&=~0o2; if(W.rr.low) c33&=~0o4; if(W.rr.good) c33&=~0o10; }
  A.chan(0o33,c33,0o1777);
}

/* ---- the landing radar's measurements, for RNRAD when the computer asks ---- */
function lmRadar(W,h){
  const L=W.L, A=W.C.A, lr=W.lr, F=lmSiteFrame();
  if(L.ch12&0o10000&&L.lrPos===0&&!L.lrMove){ L.lrMove=LR.moveTime; L.lrTo=1; }
  if(L.lrMove){ L.lrMove=Math.max(0,L.lrMove-h); if(!L.lrMove) L.lrPos=L.lrTo; }
  const Ant=lrAntenna(L.lrPos);                                  /* v_ant = Ant v_NB */
  const toI=v=>m3.mv(L.B,m3.tv(Ant,v));                          /* antenna axes -> reference frame */
  const d=toI(LR.beam), mp=lmMassProps(L.m);
  const ra=vadd(L.r,m3.mv(L.B,[-mp.cg[0]+100*INCH,0,0]));        /* the antenna, about station 100 */
  const s=raySphere(ra,d,F.R), down=vmul(vunit(L.r),-1);
  const ok=!L.lrMove&&!L.landed&&s!==null&&s<LR.maxRange&&vdot(d,down)>0.5;
  if(ok&&lr.seen<0) lr.seen=worldGET(W);
  if(!ok) lr.seen=-1;
  lr.good=ok&&worldGET(W)-lr.seen>=LR.acquire;
  lr.range=s; lr.low=s!==null&&s<LR.lowScaleBelow;
  if(lr.good){
    const vrel=vsub(L.v,moonSurfV(L.r,worldGET(W)));
    const vb=m3.mv(Ant,m3.tv(L.B,vrel));                         /* in antenna axes */
    for(let k=0;k<3;k++) A.radar(4+k,clamp(Math.round(12288+vb[k]/LR.vscale[k]),0,32767));
    A.radar(7,clamp(Math.round(s/(lr.low?LR.hlo:LR.hhi)),0,32767));
    lr.vb=vb;
  }
}

/* ---- the computer and the LM, one slice ---- */
function lmAdvanceTo(L,dt){ for(let left=dt;left>1e-12;){ const h=Math.min(left,0.005); lmAdvance(L,h); left-=h; } }
function lmApplyOut(W,ch,v){
  const L=W.L;
  if(ch===5) L.ch5=v&0o377;
  else if(ch===6) L.ch6=v&0o377;
  else if(ch===0o11){
    /* bits 13 and 14 are levels, held while the computer wants the engine on (or off); every lamp change rewrites
       the channel with them */
    const on=!!(v&0o10000)&&!(v&0o20000);
    if(on&&!L.engOn){ if(!W.seen.ign){ W.seen.ign=worldGET(W); logEvent(W,'ENGINE ON from the computer: the descent engine lights at 10 %'); } }
    if(!on&&L.engOn) logEvent(W,'ENGINE OFF from the computer');
    L.engOn=on;
  }
  else if(ch===0o12) L.ch12=v;
}
function lmSlice(W,h){
  const L=W.L, C=W.C, A=C.A, nM=h/MCT;
  if(W.pilot) W.pilot(W,h);
  const rc=W.rhc||[0,0,0], oc=v=>v<0?(0o77777+v)&0o77777:v;     /* counts as one's complement */
  A.rhc(oc(rc[1]),oc(rc[0]),oc(rc[2]));                         /* 042 Q (pitch), 043 P (yaw about X), 044 R (roll) */
  /* the IMU's CDUs to the gimbal angles, at most 6400 pulses a second; held at zero while ch12 bit 5 zeroes them */
  const ga=lmGimbals(L), ang=[ga.oga,ga.iga,ga.mga];
  for(let k=0;k<3;k++){
    const reg=0o32+k, p=A.pending(reg);
    if(L.ch12&0o20){ if(p) A.pulses(reg,-p,13.34); continue; }
    let dd=((cduCount(ang[k])-A.E(reg)-p)%32768+32768)%32768; if(dd>=16384) dd-=32768;
    if(dd) A.pulses(reg,dd,Math.max(13.34,nM/Math.abs(dd)));
  }
  /* the PIPAs' whole pulses */
  for(let k=0;k<3;k++){ const n=Math.trunc(L.pipa[k]); if(n){ L.pipa[k]-=n; A.pulses(0o37+k,n,Math.max(26.7,nM/Math.abs(n))); } }
  lmRadar(W,h);
  lmDiscretes(W);
  A.dither(!!W.sw.rrAuto);
  if(W.sw.rrPps!==W.rrPpsSet){ A.ditherPps(W.sw.rrPps); W.rrPpsSet=W.sw.rrPps; }
  /* the computer's slice; jets, engine and gimbal outputs land at their times in the LM's slice */
  const ev=W.ev; ev.length=0; const t0=compTime(C);
  compRun(C,h,(ch,v,t)=>{ if(ch===5||ch===6||ch===0o11||ch===0o12) ev.push(ch,v,t-t0); else if(ch===0o460) W.altm=v; });
  let tc=0;
  for(let i=0;i<ev.length;i+=3){ const te=clamp(ev[i+2],tc,h); lmAdvanceTo(L,te-tc); tc=te; lmApplyOut(W,ev[i],ev[i+1]); }
  lmAdvanceTo(L,h-tc);
  lmThrottle(L,A.thrustTake());
  lmContact(W);
  lgcAlarms(W);
}
/* program alarms, from the glue's watch on CHKFAIL1 (every alarm and abort enters it with its code): the time, the
   code, and the core sets as they were at that moment, before BAILOUT's restart cleared them.  The boot's (the
   power-up's 1107) is the page's, answered by its RSET, so it is not counted with the flight's */
function lgcAlarms(W){
  const A=W.C.A, n=A.alarmCount();
  for(let i=Math.max(W.alarmsRead||0,n-16);i<n;i++){
    const a=A.alarm(i), get=W.get0+a.cycles*MCT, boot=get<(W.bootEnd??A11LM.start);
    const sets=coreSetsOf(k=>a.sets[k],W.vkey,W.vkey==='C'?C55:L99);
    W.alarms.push({get,code:a.code,boot,answered:boot,sets});
    if(!boot){ const m=W.alarms.filter(x=>!x.boot).length; W.seen['a'+(m-1)]=true; }
    logEvent(W,(boot?'power-on: alarm ':'PROGRAM ALARM ')+octal5(a.code).slice(1)+': '+lgcAlarmWhat(a.code,W.vkey)+(boot?' (the RSET that follows clears it)':''),get);
  }
  W.alarmsRead=n;
}
/* the listing's words for an alarm code (the page's alarm table, from ASSEMBLY_AND_OPERATION_INFORMATION) */
function lgcAlarmWhat(code,vkey){ const a=AGC_TABLES[vkey||'L'].alarms[octal5(code)]; return a?a[0][1]:'not in the list'; }
const lgcFlightAlarms=W=>W.alarms.filter(a=>!a.boot);
/* the probes (5.6 ft below the footpads) and the footpads on the surface: the CG 14.7 ft above the pads at landing
   (station 213.5 in, the pads about 37.5 in, below the 275-in-tall LM's top at the 312.5-in docking interface) */
function lmContact(W){
  const L=W.L, h=vlen(L.r)-lmSiteFrame().R, pads=(lmMassProps(L.m).cg[0]/INCH-37.5)*INCH;
  if(!L.contact&&h<=pads+5.6*FT&&L.F>0){ L.contact=true; W.seen.contact=worldGET(W); logEvent(W,'CONTACT LIGHT: a probe touches'); }
  if(!L.landed&&h<=pads){
    const vr=vsub(L.v,moonSurfV(L.r,worldGET(W))), up=vunit(L.r);
    const own=W.track.filter(p=>p[5]!==null).pop();
    W.touch={get:worldGET(W), hdot:vdot(vr,up), vh:vlen(vsub(vr,vmul(up,vdot(vr,up)))), m:L.m, prop:L.prop,
      along:lgcAlong(L.r,worldGET(W)), lgcAlong:own?own[5]:null};
    L.landed=true; L.F=0; L.w=[0,0,0];
    L.r=vadd(L.r,vmul(up,pads-h)); W.seen.landed=worldGET(W);
    logEvent(W,'touchdown: '+fmt(-W.touch.hdot/FT,1)+' ft/s down, '+fmt(W.touch.vh/FT,1)+' ft/s across');
  }
}

/* ---- the crew: keys typed one every 0.3 s, switches, and the script's steps ----
   The boot's steps (marked boot) are the page's and always run; the flight's run while the crew is on (W.autoCrew),
   and pick up where they stopped when it is turned on again.  A key the reader presses goes to the computer at once
   (lgcPress), between the crew's. */
const KEY_GAP=0.3;
function crewKeys(W,keys){ for(const k of keys.split(' ').filter(Boolean)) W.keyq.push(k); }
function lgcPress(W,k){ compKey(W.C,k); W.lastKey={k,t:W.t}; W.tape.push(k); if(W.tape.length>60) W.tape.shift(); }
/* the reader's keys: queued and given to the computer one at a time, 0.06 s apart (a key the DSKY latched into
   channel 15 is lost if the next comes before KEYRUPT1 has read it) */
const READER_GAP=0.06;
function lgcReaderKey(W,k){ W.uiq.push(k); W.pristine=false; }
function crewTick(W){
  const t=worldGET(W);
  if(W.uiq.length&&t>=(W.nextUi||0)){ const k=W.uiq.shift(); lgcPress(W,k); W.nextUi=t+(k==='PRO'?PRO_HOLD+0.1:READER_GAP); }
  if(W.keyq.length&&t>=W.nextKey){
    const k=W.keyq.shift();
    if(k[0]==='~') W.nextKey=t+parseFloat(k.slice(1));          /* a pause: the computer answers first */
    else { lgcPress(W,k); W.nextKey=t+(k==='PRO'?PRO_HOLD+0.2:KEY_GAP); }
  }
  if(W.keyq.length||!W.steps) return;
  const s0=W.steps[W.stepI], crew=W.autoCrew||(s0&&s0.boot);
  if(!crew) return;
  if(W.reactive&&W.autoCrew&&!(s0&&s0.boot)){
    lmCrank500(W);
    lmAlarmCrew(W);
    if(W.after2.length&&t>=W.after2[0].at){ crewKeys(W,W.after2.shift().keys); return; }
    if(W.keyq.length) return;
  }
  while(W.stepI<W.steps.length){
    const s=W.steps[W.stepI];
    if(!s.boot&&!W.autoCrew) break;
    const go=typeof s.at==='number'?t>=s.at:s.at(W);
    if(go==='skip'){ W.stepI++; continue; }
    if(!go) break;
    W.stepI++;
    if(s.say) crewSay(W,s.say);
    if(typeof s.act==='string'){ crewKeys(W,s.act); if(/VERB 1 6 NOUN 6 8/.test(s.act)) W.monitor68=true; }
    else if(s.act) s.act(W);
    break;
  }
}
/* the air-to-ground transcript (the world's W.script, the LM's A11L.script) at its times, when this run has done what
   the line speaks of */
function lgcScript(W){
  const S=W.script||A11L.script, get=worldGET(W);
  while(W.scriptI<S.length&&get>=S[W.scriptI][0]){
    const [g,who,txt,cond]=S[W.scriptI++];
    if(W.autoCrew&&(!cond||W.seen[cond])) crewSay(W,who+': “'+txt+'”');
  }
}
/* the DSKY as the crew read it: the verb and noun, flashing or not */
function lgcFace(W){ return dskyFace(W.C.S); }
const twoDigits=a=>(a[0]===''&&a[1]==='')?null:parseInt((a[0]||'0')+(a[1]||'0'),10);
function lgcShows(W,verb,noun,flashing){
  const S=W.C.S, F=dskyFace(S), fl=!!(S.ch11&0o40);
  return twoDigits(F.vd)===verb&&twoDigits(F.nd)===noun&&(flashing===undefined||fl===flashing);
}
const lgcProg=W=>twoDigits(dskyFace(W.C.S).md);

/* ---- a world: the LM and its computer from start - boot seconds, booted as described above ---- */
const LGC_BOOT=40;
function makeLgcWorld(vkey,steps){
  const W={kind:vkey,vkey:'L',t:0,get0:A11LM.start-LGC_BOOT,jobs:[],events:[],said:'',sayT:-99,warpMax:20,done:false,
    lastKey:null,autoCrew:true,lgc:true,ev:[],keyq:[],uiq:[],nextKey:0,stepI:0,seen:{},altm:0,alarms:[],after2:[],tape:[],
    track:[],execHist:[],scriptI:0,pb:null,pbHold:{},pristine:true};
  /* the switches as flown: PGNS in AUTO; MODE SELECT in PGNS, so the computer runs its display-inertial-data program
     for the tape meters and X-pointers (AOH 2.2: "initiated by setting the MODE SEL switch to PGNS"; TEC 121:50:01,
     before the ascent: "do not place MODE SELECT switch to PGNS ... That's some more of that computer load
     business"); the rendezvous radar in AUTO TRACK (onboard voice 102:09:38-102:10:16), its CDUs counting */
  W.sw={mode:'auto',autoThrottle:true,disInertial:true,rhcOut:false,lpd:0,rrAuto:true,rrPps:DEFAULTS.rrPps};
  W.lr={good:false,low:false,seen:-1,range:null};
  const t0=worldGET(W), S=lmRefsmmat(), Scol=m3.T(S);            /* S rows = SM axes; Scol: SM -> reference */
  const [r,v]=lmTruthAt(t0);
  /* the attitude held before R60's maneuver: the PDI attitude's gimbal angles with 20 deg more pitch */
  const B=m3.mul(Scol,smFromGimbals(PI,127*PI/180,0));
  const gq=Math.asin(clamp(lmMassProps(A11LM.mLM).cg[2]/((lmMassProps(A11LM.mLM).cg[0]/INCH-LMP.pivotX)*INCH),-1,1));
  const gr=-Math.asin(clamp(lmMassProps(A11LM.mLM).cg[1]/((lmMassProps(A11LM.mLM).cg[0]/INCH-LMP.pivotX)*INCH),-1,1));
  W.L=lmNew({r,v,B,m:A11LM.mLM,prop:A11LM.propDPS,S:Scol,get:t0,gq,gr});
  W.L.lrPos=W.L.lrTo=1;                     /* the landing radar's antenna in position 2: P63 will ask for position 1 */
  W.pilot=lmPilot;
  W.C=makeComputer('L');
  for(const c of [0o34,0o35,0o171,0o172]) W.C.A.logOff(c,true);
  /* the boot, then the flight's crew */
  const S0=A11LM.start;
  W.steps=[
    {at:S0-38,act:'RSET',boot:true},
    {at:S0-37.5,act:w=>lgcLoads(w),boot:true},
    {at:S0-22,act:'VERB 4 8 ENTR',boot:true},
    {at:w=>lgcShows(w,1,46,true),act:'PRO',boot:true},
    {at:w=>lgcShows(w,6,47,true),act:'VERB 3 4 ENTR',boot:true},
    {at:S0-8,act:'VERB 3 7 ENTR 0 0 ENTR',boot:true},
  ].concat(steps||[]);
  return W;
}
/* what the views draw, sampled on the slice grid: each second the LM as it is and as the LGC has it; each 2 s the
   computer's time (COMP ACTY lit, and the cycles the counters took); each slice PINBALL's state, with the moments too
   short to see (an extended verb starting, a request answered) held a little */
const LGC_HOLD=1.2;
function lgcSample(W){
  const A=W.C.A, t=W.t, L=W.L, get=worldGET(W);
  const P=pinballOf(A,L99,L99F.MMCHANG), was=W.pb;
  if(P.verb>=40&&P.state!=='req') W.pbHold.ext=t;
  if(was&&was.cadrstor&&!P.cadrstor) W.pbHold.answer=t;
  P.shown=['err','mm','load','verb','noun','req'].indexOf(P.state)>=0?P.state
    :t-(W.pbHold.answer??-99)<LGC_HOLD?'answer':t-(W.pbHold.ext??-99)<LGC_HOLD&&P.state!=='mon'?'ext':P.state;
  W.pb=P;
  if(lgcProg(W)===64&&!W.seen.p64) W.seen.p64=get;
  if(lgcProg(W)===66&&!W.seen.p66) W.seen.p66=get;
  if(W.lr.good&&!W.seen.lr) W.seen.lr=get;
  /* the computer's DELTA-H when Aldrin read it ("DELTA-H is minus 2 900", 102:38:04) */
  if(!W.dh0&&get>=getOf(102,38,4)) W.dh0={get,dh:agcDP(A,L99.DELTAH,24)};
  /* throttle recovery: the thrust off the fixed throttle position (LMP.ftp, in newtons) for the first time */
  if(L.F>=0.97*LMP.ftp) W.ftpSeen=true;
  else if(W.ftpSeen&&!W.seen.rec&&L.engOn&&L.F<0.9*LMP.ftp){ W.seen.rec=get; logEvent(W,'throttle recovery: the thrust comes down from the fixed throttle position'); }
  if(W.crank) W.seen.c500=true;
  if(Math.floor(t+1e-9)!==Math.floor(t-LM_SLICE+1e-9)){
    /* [GET, altitude (of the footpads), distance to the LGC's site along the track (+ before it), thrust / 10,500 lbf,
       and the LGC's altitude and distance
       (of its navigation base) from SERVICER's RN, VN (B29 m, B7 m/cs: the state at PIPTIME, carried on to the
       clock's now) while they are
       current (PIPTIME within 3 s of the clock, once the clock is loaded), the program] */
    const R=lmSiteFrame().R;
    const age=compClock(W.C)-agcDP(A,L99.PIPTIME,28)/100, cur=W.loaded&&Math.abs(age)<3;
    const rn=[0,1,2].map(k=>agcDP(A,L99.RN+2*k,29)+agcDP(A,L99.VN+2*k,7)*100*age);
    W.track.push([get,vlen(L.r)-R-lmPadsH(L),lgcAlong(L.r,get),L.F/(10500*LBF),cur?vlen(rn)-R:null,cur?lgcAlong(rn,get):null,lgcProg(W)]);
    if(W.track.length>4000) W.track.shift();
  }
  if(Math.floor(t/2+1e-9)!==Math.floor((t-LM_SLICE)/2+1e-9)){
    const c=W.cyc||{}, a=compActy(W.C), tc=compTime(W.C), rr=A.stolen(1), oth=A.stolen(0)+A.stolen(2)+A.stolen(3);
    if(c.tc!==undefined&&tc>c.tc){ const dt=tc-c.tc;
      W.execHist.push({get,acty:(a-c.a)/dt,rr:(rr-c.rr)*MCT/dt,other:(oth-c.oth)*MCT/dt}); if(W.execHist.length>30) W.execHist.shift(); }
    W.cyc={a,tc,rr,oth};
  }
}
/* advance an LGC world dt seconds in whole slices of LM_SLICE on a fixed grid (W.t = n LM_SLICE), the crew between
   them: the world is the same however the caller steps it (a frame at a time or a jump), so a run is reproducible */
function lgcStep(W,dt){
  W.tWant=(W.tWant===undefined?W.t:W.tWant)+dt;
  const n=Math.floor(W.tWant/LM_SLICE+1e-9);
  const slice=W.slice||lmSlice, sample=W.sample||lgcSample;
  while((W.nSlice||0)<n){ slice(W,LM_SLICE); W.nSlice=(W.nSlice||0)+1; W.t=W.nSlice*LM_SLICE;
    sample(W); crewTick(W); lgcScript(W); lgcSnapTick(W); }
}
/* run a world forward to GET t as fast as it goes (the boot, the jumps) */
function lgcRunTo(W,t){ const want=t-W.get0; if(want>(W.tWant===undefined?W.t:W.tWant)) lgcStep(W,want-(W.tWant===undefined?W.t:W.tWant)); }

/* ---- the landing's crew ----
   The keys where the transcripts name them (TEC: the air-to-ground technical transcript; MR: the Mission Report):
   V37 E 63 E at 102:10:36; PRO on N61 (TIG compared with the PAD); ENTR on checklist 00014 (no fine alignment);
   PRO on V50N18 at Aldrin's "180, 287, 0. Here goes." (102:12:13), ENTR when the attitude is reached; "Proceed" on
   V99N62; the yaw to face up from 102:36:57 (MR p. 4-17: "initiated at an altitude of about 45 900 feet"), with the
   hand controller in yaw, which Luminary allows in AUTO above 30,000 ft; V16 N68 at 102:37:58 ("DELTA-H is minus
   2 900", 102:38:04); V57 at 102:38:45 ("Radar altitude updates ... were enabled at 102:38:45").  Each program alarm,
   whenever the computer raises it, is read as the crew read theirs: V05 N09 ("It's a 1202"), RSET, and N68 keyed
   again ("it appears to come up when we have a 1668 up", 102:39:14). */
function landCrewLgc(){
  const T=getOf;
  return [
    {at:T(102,10,36),act:'VERB 3 7 ENTR 6 3 ENTR',say:'Aldrin: V37 E 63 E, the braking-phase program'},
    {at:W=>lgcShows(W,6,61,true)&&worldGET(W)>=T(102,11,40),act:'PRO',say:'PRO: N61 (time to ignition, time of flight, out of plane) agrees with the PAD'},
    {at:W=>lgcShows(W,50,25,true),act:'ENTR',say:'ENTR on checklist 00014: no fine alignment'},
    {at:W=>lgcShows(W,50,18,true)&&worldGET(W)>=T(102,12,13),act:'PRO',say:'Aldrin: “180, 287, 0. Here goes.” PRO: the maneuver to the burn attitude'},
    {at:W=>lgcShows(W,6,18)},
    {at:W=>lgcShows(W,50,18,true),act:'ENTR',say:'ENTR on V50 N18: the attitude is reached'},
    {at:W=>lgcShows(W,99,62,true)&&worldGET(W)>=T(102,33,1.5),act:'PRO',say:'Armstrong: “Proceed.” PRO on V99 N62: ignition'},
    {at:T(102,36,57),act:W=>{ W.yaw={turned:0}; },say:'the yaw to face up, so the landing radar can see the surface'},
    {at:W=>W.crewN68===false?'skip':worldGET(W)>=T(102,37,58),act:'VERB 1 6 NOUN 6 8 ENTR',say:'Aldrin: V16 N68, range, time to go, ΔH'},
    {at:T(102,38,45),act:'VERB 5 7 ENTR',say:'V57: the landing radar may now update the altitude'},
    {at:W=>W.stepP64?'skip':lgcProg(W)===64,act:W=>{},say:'Aldrin: “P64.” The approach phase: the LM pitches up, the crew can see ahead'},
    {at:W=>lgcShows(W,6,64,true),act:'PRO',say:'PRO on N64: the landing point designator is live'},

    {at:T(102,43,22),act:W=>{ W.rodClick=1; },say:'the ROD switch: P66, the computer holds the rate of descent the commander sets'},

    {at:W=>W.L.landed&&worldGET(W)>=T(102,46,50),act:'VERB 3 7 ENTR 6 8 ENTR',say:'V37 E 68 E: P68, landing confirmation: the computer takes the LM’s place for the landing site'},
    {at:W=>lgcShows(W,6,43,true)&&worldGET(W)>=T(102,48,10),act:'PRO',say:'Aldrin: “… copy NOUN 60, NOUN 43.” PRO on N43 (latitude, longitude, altitude); P68 asks for the next program'},
    /* the ascent program kept ready for the stay/no-stay decisions ("you are STAY for T1", 102:47:09; Aldrin "And do

    {at:W=>worldGET(W)>=T(102,48,30)&&lgcProg(W)!==12,act:W=>{ crewKeys(W,lgcShows(W,37,null)?'1 2 ENTR':'VERB 3 7 ENTR 1 2 ENTR'); },
     say:'P12, the ascent program, made ready in case the LM had to leave at the next stay/no-stay'},

/* P63SPOT3's checklist 00500, as the flight had it ("we got a 500 alarm early in the program", TEC 102:26:55): the
   crew cranks the landing radar's antenna to position 1, then PRO ("SEE IF HE'S LYING") */
function lmCrank500(W){
  if(W.crank||!lgcCrank(W)) return false;
  W.crank=true;

  W.after2.push({at:worldGET(W)+LR.moveTime+2,keys:'PRO'});
  return true;
}
/* checklist 00500 on the DSKY (V50 N25 flashing, R1 00500) with the antenna still in position 2; the crank (the
   crew's, or the reader's button) takes LR.moveTime to bring it to position 1 */
function lgc500(W){ return !!W.lgc&&lgcShows(W,50,25,true)&&lgcFace(W).rd[0].join('')==='00500'&&W.L.lrPos===1&&!W.L.lrMove; }
function lgcCrank(W){ if(!lgc500(W)) return false; W.L.lrMove=LR.moveTime; W.L.lrTo=0; return true; }
/* hand-controller counts for a body rate (deg/s): RATERROR's law, rate = 45 STIKSENS (4|n| + 42) n / 16384 with
   STIKSENS 0.825268 (normal scaling, 20 deg/s at 42 counts), inverted */
function rhcCounts(rate){
  const k=16384/(45*0.825268), a=Math.abs(rate)*k, n=(-42+Math.sqrt(42*42+16*a))/8;
  return Math.sign(rate)*Math.min(42,Math.round(n));
}
/* Aldrin's call-outs (TEC) as the commander flew to them: altitude and forward speed against GET */
function landProfileLgc(t){
  const C=A11L.callouts;
  const at=col=>{ const pts=C.filter(c=>c[col]!==null).map(c=>[c[0],c[col]]);
    if(t<=pts[0][0]) return pts[0][1];
    for(let i=1;i<pts.length;i++) if(t<=pts[i][0]){ const a=pts[i-1], b=pts[i]; return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]); }
    return pts[pts.length-1][1]; };
  return {h:at(1)*FT, vf:at(3)*FT, firstVf:C.find(c=>c[3]!==null)[0]};
}
/* the descent rate the commander flew, against altitude: below 400 ft each band between two of Aldrin's call-outs at
   the flight's own average rate there (the band's height over its time, A11L.callouts), so each band takes the time it
   took in the flight; Aldrin's rates are snapshots (75 ft's "down a half", 20 ft's), the heights and times the
   profile.  [top ft, bottom ft, ft/s down] */
const LAND_BANDS=(()=>{ const C=A11L.callouts.filter(c=>c[1]<=400);
  return C.slice(1).map((c,i)=>[C[i][1],c[1],(C[i][1]-c[1])/(c[0]-C[i][0])]); })();
/* Aldrin's forward speeds against altitude (ft, ft/s); above 300 ft there is none (null: hold what the LM has) */
const LAND_VF=[[300,47],[250,19],[220,13],[200,11],[160,9],[100,9],[75,6],[30,4],[5.6,0],[0,0]];
function landByAltitude(h){
  const ft=h/FT, at=(T,x)=>{ if(x>=T[0][0]) return T[0][1];
    for(let i=1;i<T.length;i++) if(x>=T[i][0]){ const a=T[i-1], b=T[i]; return b[1]+(a[1]-b[1])*(x-b[0])/(a[0]-b[0]); }
    return T[T.length-1][1]; };
  const b=ft>LAND_BANDS[0][0]?null:(LAND_BANDS.find(b=>ft>b[1])||LAND_BANDS[LAND_BANDS.length-1]);
  return {hd:(b?b[2]:12)*FT, vf:ft>LAND_VF[0][0]?null:at(LAND_VF,ft)*FT};
}
/* the LM's controls, slice by slice: the hand controller (the crew's, or the reader's arrows: a deflection held a
   moment), the hand controller's landing-point clicks, the ROD switch; the crew's own flying is lmCrewFly */
function lmPilot(W,h){
  const t=worldGET(W);
  W.rhc=[0,0,0]; W.sw.rhcOut=false;
  if(W.autoCrew) lmCrewFly(W,h);
  if(W.stick&&t<W.stick.until){ W.rhc=W.stick.counts.slice(); W.sw.rhcOut=true; }
  /* a click of the hand controller's discretes (P64: a landing-point redesignation through RUPT10) */
  W.sw.lpd=W.lpdClick&&t<W.lpdClick.until?W.lpdClick.bits:0;
  /* a click of the ROD switch: channel 16 bit 6 (DESCENT+, slower) or 7 (DESCENT-), KEYRUPT2, released 0.1 s later */
  if(W.rodClick){ W.C.A.chan(0o16,W.rodClick>0?0o40:0o100,0o140); W.C.A.rupt(6); W.rodUp=t+0.1; W.rodLast=t; W.rodClick=0; }
  if(W.rodUp&&t>=W.rodUp){ W.C.A.chan(0o16,0,0o140); W.rodUp=0; }
}
/* the reader takes the controls (the landing view's arrows): the crew's script stops, the PGNS mode switch goes to
   attitude hold as Armstrong's did; up and down are the ROD switch (1 ft/s a click; the first click in P64 starts
   P66), left and right a pitch of about 2 degrees back or forward (16 counts, 4 deg/s, for half a second) */
function lgcTakeControls(W){
  if(W.autoCrew){ W.autoCrew=false; logEvent(W,'you have the controls: the crew’s script stops (attitude hold)'); }
  W.pristine=false;
  if(W.sw.mode!=='hold') W.sw.mode='hold';
}
function lgcRod(W,dir){
  if(W.L.landed) return false;
  lgcTakeControls(W); W.rodClick=dir; return true;
}
function lgcTilt(W,dir){
  if(W.L.landed) return false;
  lgcTakeControls(W); W.stick={counts:[0,-16*dir,0],until:worldGET(W)+0.5}; return true;
}
/* the crew's flying: the yaw to face up, and from 102:43:13 attitude hold and P66 to the call-outs, then ENGINE STOP */
function lmCrewFly(W,h){
  const L=W.L, y=W.yaw, t=worldGET(W);
  if(y&&!y.done){
    y.turned+=L.w[0]*h;
    if(Math.abs(y.turned)>=PI){ y.done=t; logEvent(W,'face up: the yaw done'); }
    else { W.rhc=[15,0,0]; W.sw.rhcOut=true; }               /* 15 counts: about 3.4 deg/s */
  }
  /* ENGINE STOP: the commander's button 1.5 s after the footpads touch (MR: landing 102:45:39.9 at 1.7 ft/s down, DPS
     cutoff 102:45:41.40; the contact light had come on 3.3 s before the landing), then ENGINE ARM off */
  if(L.landed&&W.stopAt===undefined) W.stopAt=t+1.5;
  if(W.stopAt!==undefined&&t>=W.stopAt&&!L.stop) lgcEngineStop(W,'the commander’s ENGINE STOP button, 1.5 s after the footpads touch; then ENGINE ARM off');
  if(W.stopAt!==undefined&&t>=W.stopAt+2&&L.armed) L.armed=false;
  /* attitude hold after 102:43:13, then P66: fly the call-outs */
  const P=W.p66;
  if(!P||L.landed||W.sw.mode!=='hold') return;
  const up=vunit(L.r), vrel=vsub(L.v,moonSurfV(L.r,t));
  if(!P.f){ const vh=vsub(vrel,vmul(up,vdot(vrel,up))); P.f=vunit(vh); }
  const f=vunit(vsub(P.f,vmul(up,vdot(P.f,up)))), l=vcross(up,f);
  const vf=vdot(vrel,f), vl=vdot(vrel,l), hd=vdot(vrel,up), g=MUM_SI/vdot(L.r,L.r);
  const h0=vlen(L.r)-lmSiteFrame().R-lmPadsH(L), pa=landByAltitude(h0);
  const vfWant=pa.vf===null?(P.vf0=P.vf0===undefined?vf:P.vf0):pa.vf;
  const af=clamp((vfWant-vf)/8,-0.3*g,0.3*g), al=clamp(-vl/8,-0.15*g,0.15*g);
  const Xw=vunit(vadd(up,vadd(vmul(f,af/g),vmul(l,al/g))));     /* the thrust axis that gives that acceleration */
  const X=m3.mv(L.B,[1,0,0]), ax=m3.tv(L.B,vcross(X,Xw));       /* the turn needed, in body axes (rad) */
  /* a rate to close it in about 2 s, less the rate the LM already has, and nothing inside half a degree */
  const want=k=>{ const e=ax[k]*180/PI; return Math.abs(e)<0.5?0:clamp(0.5*e-0.3*L.w[k]*180/PI,-5,5); };
  W.rhc=[0,rhcCounts(want(1)),rhcCounts(want(2))];
  W.sw.rhcOut=W.rhc[1]!==0||W.rhc[2]!==0;
  /* the rate of descent: the flight's rate in this altitude band.  A click (1 ft/s, RODSCALE) moves the rate P66 holds
     at once; the LM follows within TAUROD (1.5 s), so the commander counts the clicks it has not answered yet (each
     fading as e^(-t/1.5 s)), clicks when the rate he will have is more than half a click off (the nearest rate a click
     can set), at most every 0.5 s: 9 to 4 ft/s in six seconds, as at 102:43:26-32 */
  if(lgcProg(W)===66&&!L.contact){
    const hdWant=-pa.hd;
    W.rodHist=(W.rodHist||[]).filter(c=>t-c[0]<8);
    const coming=W.rodHist.reduce((s,c)=>s+c[1]*Math.exp(-(t-c[0])/1.5),0)*FT;
    if(!W.rodUp&&t-(W.rodLast||0)>=0.5){
      const e=hd+coming-hdWant;
      if(e<-0.5*FT) W.rodClick=1;
      else if(e>0.5*FT) W.rodClick=-1;
      if(W.rodClick) W.rodHist.push([t,W.rodClick]);
    }
  }
}
/* the ENGINE STOP button (the crew's after the landing, or the reader's): the engine stops whatever the
   computer commands */
function lgcEngineStop(W,say){
  if(W.L.stop) return false;

  return true;
}
/* the footpads below the CG (the CG 213.5 in above station 37.5 at landing, interpolated with mass) */
const lmPadsH=L=>(lmMassProps(L.m).cg[0]/INCH-37.5)*INCH;
/* the crew's answer to a program alarm: read the codes, reset, bring back the monitor that was up */
function lmAlarmCrew(W){
  const a=W.alarms&&W.alarms[W.alarms.length-1];

/* ---- the jumps: a world saved at a moment (the computer's whole memory and everything around it) and restored ----
   A run the reader has not touched (W.pristine) saves itself after the boot and at each of the view's jump moments

   from there with the crew, a jump forward runs on from now with the crew */
const LGC_SNAPS={};
function lgcClone(v,skip){
  if(v===null||typeof v!=='object') return v;
  if(ArrayBuffer.isView(v)) return v.slice();
  if(Array.isArray(v)) return v.map(x=>lgcClone(x));
  const o={}; for(const k in v){ if(skip&&skip(k)) continue; o[k]=lgcClone(v[k]); } return o;
}
const lgcSettings=W=>W.cmc?[W.kind,W.sw.sysB?1:0].join(','):[W.kind,W.sw.rrAuto?1:0,W.sw.rrPps,W.sw.disInertial?1:0,W.crewN68===false?0:1].join(',');
/* a snapshot at the slice just run: the step's own target (tWant, up to a whole step ahead when the moment is passed
   inside a jump's 1-s step) is not part of the moment, so it is saved at the clock */
function lgcSave(W){ const w=lgcClone(W,k=>k==='C'||k==='jump'||k==='boot'); w.tWant=w.t;
  return {get:worldGET(W),mem:W.C.A.save(),W:w,C:lgcClone(W.C,k=>k==='A')}; }

  const A=W.C.A, jump=W.jump, boot=W.boot;

function lgcSnapTick(W){
  if(!W.pristine||!W.snapAt) return;
  const get=worldGET(W), key=lgcSettings(W), bank=LGC_SNAPS[key]||(LGC_SNAPS[key]={});
  for(const g of W.snapAt) if(get>=g&&get<g+1.5*LM_SLICE&&!bank[g]) bank[g]=lgcSave(W);
}
/* start a jump to GET `get`: a saved moment if it lies behind; the run itself is lgcJumpRun's, so the page can spread

const LGC_KEEP=['rrAuto','rrPps','disInertial','sysB'];

  const keep={}, n68=W.crewN68;

function lgcJumpStart(W,get){
  const crew=W.autoCrew;
  if(get<worldGET(W)-1e-6){
    const bank=LGC_SNAPS[lgcSettings(W)]||{};
    let best=null;
    for(const g in bank) if(+g<=get+1e-6&&(!best||+g>best.get)) best=bank[g];
    lgcRestoreKeeping(W,best||W.boot);

/* run the jump on; with a clock and a budget (ms), stop when the budget is spent; true when it has arrived */
function lgcJumpRun(W,now,budget){
  const J=W.jump; if(!J) return true;
  const t0=now?now():0;

    lgcStep(W,Math.min(1,J.to-worldGET(W)));

function lgcJump(W,get){ lgcJumpStart(W,get); lgcJumpRun(W); return W; }
/* start again: the moment after the boot, with the reader's switches */
function lgcAgain(W){ lgcRestoreKeeping(W,W.boot); W.jump=null; return W; }

/* ---- the DSKY and PINBALL as the views read them: the relay face, the alarm codes, the keys pressed ---- */

/* ---- the worlds ---- */

/* the LM views are the real computer's worlds */

/* ================================================================== *
 *  the CM around its computer (the way home on Comanche 055)         *
 * ================================================================== *
 * The command module's computer is started from its memory as NASSP's
 * Apollo 11 scenario keeps it at 192:47 (agc/cmc_entry_prep.json; NASSP,
 * Project Apollo - NASSP, GPL v2): the prelaunch and later loads, the
 * REFSMMAT, the flags.  The page supplies the Earth (as the CMC orients
 * it), the CM's flight and attitude, its jets, IMU and accelerometers.
 */

/* ---- the CMC's memory at entry prep (the words, octal address -> word), and reading it ---- */
const cmcWord=a=>CMC_ENTRY.words[a.toString(8)]||0;

/* ---- the Earth, as Comanche 055 orients it ----

   EARTHMX: M = Rz(AZ), the rows (cos AZ, sin AZ, 0), (-sin AZ, cos AZ, 0), (0, 0, 1); NEWANGLE: AZ = AZO + WEARTH (T +
   TEPHEM); EARTHL: L = (-AXO, -AYO, 0) in the reference frame.  WEARTH 0.973561595 revs/cs B+23 (7.29211494E-5 rad/s);
   AZO, AXO, -AYO and TEPHEM from the CMC's memory (set at launch).  LAT-LONG: latitude atan2(RPz, GAMMA rho) with

  get AZO(){ return cmcDP(C55.AZO,0)*TAU; }, get AXO(){ return cmcDP(C55.AXO,0); }, get MAYO(){ return cmcDP(C55['-AYO'],0); },
  get TEPHEM(){ const a=C55.TEPHEM; return (cmcWord(a)*268435456+cmcWord(a+1)*16384+cmcWord(a+2))/100; },   /* s */

const earthL=()=>[-EARTH_CMC.AXO,EARTH_CMC.MAYO,0];

function earthLatLon(r,get){

/* the ellipsoid's radius at geodetic latitude lat (deg), and the position at a latitude, longitude and height */
function earthRadiusAt(lat){ const g=lat*PI/180, c=Math.cos(g), s=Math.sin(g), a=EARTH_CMC.A, b=EARTH_CMC.B;
  return Math.sqrt((Math.pow(a*a*c,2)+Math.pow(b*b*s,2))/(Math.pow(a*c,2)+Math.pow(b*s,2))); }

/* the CM's height above the ellipsoid (geodetic) */
function earthHeight(r,get){
  const p=earthRtoRp(r,get), rho=Math.hypot(p[0],p[1]), a=EARTH_CMC.A, e2=1-EARTH_CMC.GAMMA;
  let lat=Math.atan2(p[2],rho*(1-e2)), h=0;

/* the Earth's axis in the reference frame, and the air's velocity at r (the air turns with the Earth) */
const earthPole=get=>vunit(earthRpToR([0,0,1],get));
const earthAirV=(r,get)=>vcross(vmul(earthPole(get),EARTH_CMC.WEARTH),r);

/* ---- the command module ----
   A rigid body.  Mass: 12,095.5 lb at the entry interface (MR Table A-I).  Inertia: NASSP's CSM-109 mass properties at

   C_D S = 15.5 m^2 (the CSM Data Book's C_A -1.345, C_N 0.075 at Mach 29.5 and 20 deg from heat shield first, as
   NASSP tabulates it: C_D 1.291 on 129.4 ft^2), lift L/D = 0.282 at trim (the entry analysis's reconstruction for
   Apollo 11; the Data Book gives 0.30), along the part of the CM's +X axis (toward the apex) square to the relative
   wind.  The CM trims with the wind in its X-Z plane at ALFA -20 deg as CM/POSE measures it (CM_BODY_ATTITUDE: UL =
   unit(UXA x UBY), -sin ALFA = UL.UBX, cos ALFA = UL.UBZ; UXA = -unit(VREL)), so the wind in body axes is (cos ALFA, 0,
   sin ALFA) there; away from it the air turns the CM back with K q (w_trim x w), K = S d C_m,alpha = 12.02 m^2 x 3.91 m
   x 0.056 per radian (the Data Book's moment slope about trim at Mach 29.5).  No aerodynamic damping (it is a
   thousandth of the stiffness at these speeds): the entry DAP's rate damping is the damping. */
const CM_PMI=[1.41524,1.25411,1.11318];
const CMV={m:12095.5*LBM, S:12.02, d:3.91, CDA:15.5, LD:0.282, aTrim:-20*PI/180, Cma:0.056, J2:1.08263e-3,
  jetF:413.7, jetIsp:340, pipa:0.0585};
CMV.I=CM_PMI.map(k=>k*CMV.m);
CMV.Km=CMV.S*CMV.d*CMV.Cma;
CMV.wTrim=[Math.cos(CMV.aTrim),0,Math.sin(CMV.aTrim)];
/* the CM's twelve jets as channels 5 and 6 fire them (the Delco CM table; NASSP agrees bit for bit): [channel, bit,
   axis (0 roll X, 1 pitch Y, 2 yaw Z), N m about it, RCS system (Delco's ring: 1-x, 2-x)].  Each DAP code sets two
   bits, a jet of each system; the moments NASSP's geometry gives (the -P jets sit near the apex, half the arm), its
   small cross-axis terms left out.  Apollo 11 flew the entry on system A alone (MR sec. 8.11.2: system B consumed
   0.0 lb), one jet a code: a roll jet 619 N m over 7,764 kg m^2 is 4.57 deg/s^2, the single-jet acceleration the
   roll controller is built on (A1 = 4.55, "BASED ON SINGLE JET ACCELERATION", CM_ENTRY_DIGITAL_AUTOPILOT) */
const CM_JETS=[[5,1,1,668,1],[5,2,1,-331,2],[5,3,1,668,2],[5,4,1,-331,1],[5,5,2,670,2],[5,6,2,-668,1],[5,7,2,670,1],[5,8,2,-668,2],
  [6,1,0,619,1],[6,2,0,-583,1],[6,3,0,597,2],[6,4,0,-606,2]];
const CM_JET_MDOT=CMV.jetF/(CMV.jetIsp*G0);

/* gravity: point mass and J2 about the reference frame's Z (the CMC's MUEARTH; RE the Fischer radius) */
function cmGrav(r){
  const R2=vdot(r,r), R=Math.sqrt(R2), z=r[2], k=1.5*CMV.J2*RE_F*RE_F/R2, f=5*z*z/R2, g=-MUE_E/(R2*R);
  return [g*r[0]*(1+k*(1-f)), g*r[1]*(1+k*(1-f)), g*z*(1+k*(3-f))];
}
/* coasting (no air, no jets): RK4, steps of at most 1 s, forward or back */
function cmCoast(r,v,t0,t1){
  let t=t0; r=r.slice(); v=v.slice();
  while(Math.abs(t1-t)>1e-9){ const h=Math.sign(t1-t)*Math.min(1,Math.abs(t1-t));
    const k1v=cmGrav(r), k1r=v, k2v=cmGrav(vadd(r,vmul(k1r,h/2))), k2r=vadd(v,vmul(k1v,h/2));
    const k3v=cmGrav(vadd(r,vmul(k2r,h/2))), k3r=vadd(v,vmul(k2v,h/2)), k4v=cmGrav(vadd(r,vmul(k3r,h))), k4r=vadd(v,vmul(k3v,h));
    r=vadd(r,vmul(vadd(vadd(k1r,vmul(k2r,2)),vadd(vmul(k3r,2),k4r)),h/6));
    v=vadd(v,vmul(vadd(vadd(k1v,vmul(k2v,2)),vadd(vmul(k3v,2),k4v)),h/6)); t+=h; }
  return [r,v];
}

/* the air on the CM now: the relative wind, the dynamic pressure, the specific force (reference frame) and the
   wind in body axes */
const CM_AIR_TOP=200e3;
function cmAir(K){
  const vr=vsub(K.v,earthAirV(K.r,K.get)), V=vlen(vr);
  const out={vr,V,q:0,h:null,a:[0,0,0],D:0,L:0,wb:null};
  if(vlen(K.r)-EARTH_CMC.B>CM_AIR_TOP||V<1) return out;
  const h=earthHeight(K.r,K.get), q=0.5*airDensity(Math.max(0,h))*V*V;
  out.h=h; out.q=q;
  const uxa=vmul(vr,-1/V), xb=[K.B[0][0],K.B[1][0],K.B[2][0]];
  out.wb=m3.tv(K.B,uxa);                                    /* the wind (downstream) in body axes */
  const D=q*(K.cda||CMV.CDA)/K.m, perp=vsub(xb,vmul(uxa,vdot(xb,uxa))), sp=vlen(perp);
  const L=sp>1e-9&&!K.chute?D*CMV.LD*sp/Math.sin(-CMV.aTrim):0;   /* L/D grows with the angle from the wind (sin, 0.282 at trim) */
  out.D=D; out.L=L;
  out.a=vadd(vmul(uxa,D),sp>1e-9?vmul(perp,L/sp):[0,0,0]);
  return out;
}

/* the CM (or, before separation, the CSM): position and velocity in the reference frame (m, m/s), attitude B (body
   -> reference), body rates w (rad/s), the stable member S (its axes as the columns), the jets' channels, the PIPAs'
   fractional pulses, RCS propellant used (kg) */
function cmNew(o){
  return {r:o.r.slice(), v:o.v.slice(), B:o.B.map(x=>x.slice()), w:[0,0,0], m:CMV.m, S:o.S, get:o.get, sep:false,
    ch5:0, ch6:0, pipa:[0,0,0], rcs:0, rcsSys:[0,0], jetOn:new Array(12).fill(0), air:null, sf:[0,0,0], sysB:false};
}
/* the jets that fire now: system A's, and system B's when it is on */
const cmJetOn=(K,j)=>(K.sysB||j[4]===1)&&(((j[0]===5?K.ch5:K.ch6)>>(j[1]-1))&1);
/* the jets' moments (body, N m) and how many fire, by system */
function cmJets(K){
  const T=[0,0,0], n=[0,0];
  if(!K.sep) return {T,n};
  for(let i=0;i<12;i++){ const j=CM_JETS[i]; if(cmJetOn(K,j)){ T[j[2]]+=j[3]; n[j[4]-1]++; } }
  return {T,n};
}
/* advance dt seconds with the jets held.  Before separation the CSM's attitude is held (the SCS's, outside this
   page's computer) and its jets are not the CM's; after it, Euler's equations about the principal axes */
function cmAdvance(K,dt){
  if(K.splash){ K.get+=dt; return; }
  const air=cmAir(K); K.air=air;
  if(K.sep&&!K.chute){
    const J=cmJets(K), I=CMV.I, w=K.w, T=J.T.slice();
    if(air.wb){ const ta=vmul(vcross(CMV.wTrim,air.wb),CMV.Km*air.q); for(let k=0;k<3;k++) T[k]+=ta[k]; }
    const gy=vcross(w,[I[0]*w[0],I[1]*w[1],I[2]*w[2]]);
    for(let k=0;k<3;k++) w[k]+=(T[k]-gy[k])/I[k]*dt;
    K.B=m3.rot(K.B,w,dt);
    for(let s=0;s<2;s++){ K.rcsSys[s]+=J.n[s]*CM_JET_MDOT*dt; } K.rcs=K.rcsSys[0]+K.rcsSys[1];
    for(let i=0;i<12;i++) if(cmJetOn(K,CM_JETS[i])) K.jetOn[i]+=dt;
  }
  /* translation: RK4, the air's force held over the step */
  const aA=air.a, r0=K.r, v0=K.v, acc=r=>vadd(cmGrav(r),aA);
  const k1v=acc(r0), k1r=v0, k2v=acc(vadd(r0,vmul(k1r,dt/2))), k2r=vadd(v0,vmul(k1v,dt/2));
  const k3v=acc(vadd(r0,vmul(k2r,dt/2))), k3r=vadd(v0,vmul(k2v,dt/2)), k4v=acc(vadd(r0,vmul(k3r,dt))), k4r=vadd(v0,vmul(k3v,dt));
  K.r=vadd(r0,vmul(vadd(vadd(k1r,vmul(k2r,2)),vadd(vmul(k3r,2),k4r)),dt/6));
  K.v=vadd(v0,vmul(vadd(vadd(k1v,vmul(k2v,2)),vadd(vmul(k3v,2),k4v)),dt/6));
  /* the PIPAs: the specific force along the stable member's axes, 5.85 cm/s a pulse (Comanche's KPIP1; an ideal IMU:
     the CMC's compensation words are zeroed at the start) */
  const dv=m3.tv(K.S,vmul(aA,dt));
  for(let k=0;k<3;k++) K.pipa[k]+=dv[k]/CMV.pipa;
  K.sf=aA;
  K.get+=dt;
}
function cmAdvanceTo(K,dt){ for(let left=dt;left>1e-12;){ const h=Math.min(left,0.005); cmAdvance(K,h); left-=h; } }
/* the gimbal angles the IMU's resolvers read now */
function cmGimbals(K){ return gimbalAngles(m3.mul(m3.T(K.S),K.B)); }
/* the attitude S62.3 asks for (P61-P67.agc): roll ROLLC about the air, ALFA the trim, no sideslip.  Y_B = cos(ROLLC)
   UYA + sin(ROLLC) UZA, X_B = cos(ALFA) UXA + sin(ALFA) unit(Y_B x UXA), Z_B = X_B x Y_B (body -> reference) */
function cmTrimAttitude(r,v,get,rollDeg){
  const vr=vsub(v,earthAirV(r,get)), uxa=vunit(vmul(vr,-1)), uya=vunit(vcross(vunit(r),uxa)), uza=vcross(uxa,uya);
  const c=Math.cos(rollDeg*PI/180), s=Math.sin(rollDeg*PI/180), yb=vadd(vmul(uya,c),vmul(uza,s));
  const xb=vadd(vmul(uxa,Math.cos(CMV.aTrim)),vmul(vunit(vcross(yb,uxa)),Math.sin(CMV.aTrim)));
  return m3.cols(xb,yb,vcross(xb,yb));
}
/* CM/POSE's angles from the CM as it is (CM_BODY_ATTITUDE: the trajectory triad from the relative velocity; ROLL,
   BETA, ALFA in degrees), for the views and the tests */
function cmPose(K){
  const vr=vsub(K.v,earthAirV(K.r,K.get)), ur=vunit(K.r);
  const uxa=vunit(vmul(vr,-1)), uya=vunit(vcross(ur,uxa)), uza=vcross(uxa,uya);
  const ubx=[K.B[0][0],K.B[1][0],K.B[2][0]], uby=[K.B[0][1],K.B[1][1],K.B[2][1]], ubz=[K.B[0][2],K.B[1][2],K.B[2][2]];
  const ul=vunit(vcross(uxa,uby));
  const roll=Math.atan2(-vdot(ul,uya),vdot(ul,uza)), beta=Math.asin(clamp(-vdot(uxa,uby),-1,1));
  const alfa=Math.atan2(-vdot(ul,ubx),vdot(ul,ubz));
  return {roll:roll*180/PI,beta:beta*180/PI,alfa:alfa*180/PI,gamma:Math.asin(clamp(vdot(ur,vunit(vr)),-1,1))*180/PI};
}
/* ================================================================== *
 *  the way home on the real Comanche 055: the entry                  *
 * ================================================================== *
 * The world starts 25 minutes before the entry interface, the CSM
 * coasting home with its horizon held in the window.  Its computer is
 * Comanche 055 restarted from the memory NASSP's scenario keeps
 * (p3_cmsim.js), with the day's uplink: the state vector the RTCC sent
 * (CROX880) and the target.  The CM flies the trajectory the entry
 * analysis reconstructed; the crew keys what the entry analysis and
 * the transcripts say they did; the computer does the rest: P61 to P67,
 * its displays, its jets.
 */
const A11C={
  ei:getOf(195,3,5.66),
  /* MSC IN 70-FM-30 (the Apollo 11 entry postflight analysis) sec. 3: the BET's state at 400,000 ft with the flight-path
     angle 0.043 deg steeper, "a better estimate of entry conditions than the 21-day BET ... an excellent reconstruction
     of the entry trajectory flown" (its longitude printed 171.1960, the BET's 171.9603 transposed); and the CMC's own,
     "based on the RTCC CROX880 vector".  Geodetic latitude and height, inertial speed, flight-path angle and azimuth */
  truth:{lat:-3.1933, lon:171.9603, h:400000.72*FT, v:36194.368*FT, gam:-6.5230, az:50.1761},
  cmc:{lat:-3.1968, lon:171.9622, h:398867.97*FT, v:36195.287*FT, gam:-6.4875, az:50.1823},
  target:[13.32,-169.17],                         /* the entry PAD (TEC 191:43:57) and P61's N61 (the entry analysis) */
  sep:getOf(194,49,12.7),                          /* CM/SM separation (MR) */
  smBy:getOf(194,54,40),                           /* "we got the service module going by" (TEC) */
  turn:getOf(194,55,40),                           /* the crew's PRO for the turn: this page's, after the SM had gone by
                                                      ("coming across now from right to left", 194:55:07), and so P63
                                                      comes when the entry analysis has it */
  hor:[[getOf(194,33,6),298],[getOf(194,46,6),267]],   /* the PAD's horizon checks: GET, pitch gimbal angle */
  drogue:getOf(195,12,6.9), splash:getOf(195,18,35),   /* MR */
  /* the entry analysis (sec. 6): what the crew saw; the reconstructed CMC (sec. 5); ARIA's downlink */
  n60:[6.46,36184,-6.46], n63:[1418,36261,28], n22:[0.1,175.0,0.9], p63:-(7*60+1), n64v:33258, n64r:3732,
  t05g:30, h05g:289926, p65:116, vl:22091, dl:1.057, p67:200, n67:[1.7,13.30,-169.15], gmax:6.73,
};
const CMC_START=A11C.ei-25*60, CMC_BOOT=6;
/* the IMU compensation words NASSP's scenario carries (PIPA bias and scale factor, gyro drifts): zeroed, the page's IMU
   being ideal */
const CMC_COMP=['PBIASX','PIPASCFX','PBIASY','PIPASCFY','PBIASZ','PIPASCFZ','NBDX','NBDY','NBDZ','ADIAX','ADIAY','ADIAZ',
  'ADSRAX','ADSRAY','ADSRAZ'];

/* a state from latitude, longitude, height, inertial speed, flight-path angle and azimuth at GET t, in the CMC's
   reference frame (the angles from the local horizontal of the radius, and north on it) */
function cmStateFrom(s,t){
  const r=earthPoint(s.lat,s.lon,s.h,t), U=vunit(r), P=earthPole(t), N=vunit(vsub(P,vmul(U,vdot(P,U)))), E=vcross(N,U);
  const g=s.gam*PI/180, a=s.az*PI/180;
  return [r,vmul(vadd(vmul(vadd(vmul(N,Math.cos(a)),vmul(E,Math.sin(a))),Math.cos(g)),vmul(U,Math.sin(g))),s.v)];
}
/* the local horizontal frame: along the track, across it, up (the columns) */
function cmLocal(r,v){ const U=vunit(r), H=vunit(vsub(v,vmul(U,vdot(v,U)))); return m3.cols(H,vcross(U,H),U); }
/* the horizon's frame: the local frame turned down about the across-track axis by the dip to the horizon, acos(R/r)
   (the line of sight to the Earth's limb ahead): the frame a held horizon keeps fixed in the window */
function cmHorizonFrame(r,v){ const d=-Math.acos(clamp(EARTH_CMC.A/vlen(r),-1,1)), c=Math.cos(d), s=Math.sin(d);
  return m3.mul(cmLocal(r,v),[[c,0,s],[0,1,0],[-s,0,c]]); }
/* the stable member from the CMC's REFSMMAT (its rows the axes, half-unit DP) */
function cmcSM(){ const rows=[0,1,2].map(i=>[0,1,2].map(j=>cmcDP(C55.REFSMMAT+6*i+2*j,1))); return m3.T(rows); }
/* the CSM's state vector as an uplink leaves it (INTEGRATION_INITIALIZATION's table; Earth: R B29 m, V B7 m/cs, TET
   B28 cs; the Encke deviations zero; RCV, VCV = R, V) */
function cmcStateVector(A,base,r,v,t){
  const vcs=vmul(v,0.01);
  lgcWriteVec(A,base,r,29); lgcWriteVec(A,base+6,vcs,7); agcSetDP(A,base+12,t*100,28);
  for(let k=14;k<26;k++) A.setE(base+k,0);
  lgcWriteVec(A,base+26,r,29); lgcWriteVec(A,base+32,vcs,7);
  for(let k=38;k<42;k++) A.setE(base+k,0);
}

/* ---- the computer's memory when the world starts: NASSP's at 192:47 above the central registers, the IMU ideal, the
   clock at the world's time, the CDUs at the gimbals, the uplink (the RTCC's vector, the target), and Z at the restart
   entry (04000, GOPROG): a restart resumes the programs from their phase tables ---- */
function cmcLoads(W){
  const C=W.C, A=C.A, t=worldGET(W), K=W.K;
  for(const k in CMC_ENTRY.words){ const a=parseInt(k,8); if(a>=0o24) A.setE(a,CMC_ENTRY.words[k]); }
  for(const n of CMC_COMP) A.setE(C55[n],0);
  compSetClock(C,t);
  const ga=cmGimbals(K); [ga.oga,ga.iga,ga.mga].forEach((g,k)=>A.setE(0o32+k,cduCount(g)));
  for(let k=0;k<3;k++) A.setE(0o37+k,0);
  cmcStateVector(A,C55.RRECTCSM,W.cmc0[0],W.cmc0[1],t);
  agcSetDP(A,C55['LAT(SPL)'],A11C.target[0]/360,0); agcSetDP(A,C55['LNG(SPL)'],A11C.target[1]/360,0);
  A.setE(5,0o4000);
  W.loaded=true;
}

/* ---- the switches and signals Comanche reads (0 = present): NASSP's at 192:47.  ch30: 9 IMU operate, 15 the stable
   member's temperature in limits; 2 CM/SM separate after the separation.  ch31: 15 G&N autopilot control (the SC
   CONT switch at CMC), the mode switch at AUTO (13 HOLD, 14 FREE off).  ch33: 4 zero optics ---- */
function cmDiscretes(W){
  const A=W.C.A;
  A.chan(0o30,W.K.sep?0o37375:0o37377,0o77777);
  A.chan(0o31,0o37777,0o77777);
  A.chan(0o32,0o17777,0o17777);
  A.chan(0o33,0o1767,0o1777);
}
/* before the separation the CSM tracks the horizon (the entry analysis: "horizon tracking was initiated by the command
   pilot at EI - 30 minutes"): its attitude fixed to the horizon's frame, the PAD's 267 deg pitch at 194:46:06.  That
   frame gives 298.5 deg at the PAD's first check, 194:33:06 (the PAD: 298): the trajectory carried back, the REFSMMAT
   and the gimbals agree with the flight's */
function cmHorizon(W){ const K=W.K; K.B=m3.mul(cmHorizonFrame(K.r,K.v),W.horQ); }
function cmApplyOut(W,ch,v){
  const K=W.K;
  if(ch===5) K.ch5=v&0o377;
  else if(ch===6) K.ch6=v&0o17;                    /* bits 5-8 fire the service module's jets: gone */
  else if(ch===0o12) W.ch12=v;
}
/* ---- the computer and the CM, one slice ---- */
function cmSlice(W,h){
  const K=W.K, C=W.C, A=C.A, nM=h/MCT;
  K.sysB=!!W.sw.sysB;
  if(!K.sep) cmHorizon(W);
  const ga=cmGimbals(K), ang=[ga.oga,ga.iga,ga.mga];
  for(let k=0;k<3;k++){
    const reg=0o32+k, p=A.pending(reg);
    if(W.ch12&0o20){ if(p) A.pulses(reg,-p,13.34); continue; }
    let dd=((cduCount(ang[k])-A.E(reg)-p)%32768+32768)%32768; if(dd>=16384) dd-=32768;
    if(dd) A.pulses(reg,dd,Math.max(13.34,nM/Math.abs(dd)));
  }
  for(let k=0;k<3;k++){ const n=Math.trunc(K.pipa[k]); if(n){ K.pipa[k]-=n; A.pulses(0o37+k,n,Math.max(26.7,nM/Math.abs(n))); } }
  cmDiscretes(W);
  const ev=W.ev; ev.length=0; const t0=compTime(C);
  compRun(C,h,(ch,v,t)=>{ if(ch===5||ch===6||ch===0o12) ev.push(ch,v,t-t0); });
  let tc=0;
  for(let i=0;i<ev.length;i+=3){ const te=clamp(ev[i+2],tc,h); cmAdvanceTo(K,te-tc); tc=te; cmApplyOut(W,ev[i],ev[i+1]); }
  cmAdvanceTo(K,h-tc);
  cmChutes(W);
  lgcAlarms(W);
}
/* the parachutes: two drogues at 24,000 ft (C_D S 22 m^2 together, this page's: 16.5-ft conical ribbons), the three
   mains at 10,000 ft (1,216 m^2: 83.5-ft ring sails, no reefing), splashdown at the sea */
const CM_CHUTES={drogueAt:24000*FT, drogueCDA:22, mainsAt:10000*FT, mainsCDA:1216};
function cmChutes(W){
  const K=W.K, a=K.air, get=worldGET(W), C=CM_CHUTES;
  if(!a||a.h===null||K.splash) return;
  if(!K.drogue&&a.h<=C.drogueAt&&vdot(K.v,K.r)<0){ K.drogue=get; K.cda=CMV.CDA+C.drogueCDA; K.chute=true; W.seen.drogue=get;
    logEvent(W,'24,000 ft: the drogue chutes (MR: 195:12:06.9)'); }
  if(K.drogue&&!K.mains&&a.h<=C.mainsAt){ K.mains=get; K.cda=CMV.CDA+C.mainsCDA; W.seen.mains=get; logEvent(W,'10,000 ft: the main chutes'); }
  if(a.h<=0){ K.splash=get; W.seen.splash=get; const [la,lo]=earthLatLon(K.r,get);
    W.splashAt={get,lat:la,lon:lo,miss:cmGround(la,lo,A11C.target[0],A11C.target[1])};
    logEvent(W,'splashdown at '+fmt(Math.abs(la),2)+(la<0?' S ':' N ')+fmt(Math.abs(lo),2)+(lo<0?' W':' E')+', '+fmt(W.splashAt.miss/NMI,1)+' nmi from the target (MR: 195:18:35, 1.69 nmi)'); }
}
/* the distance over the ground between two points (the Fischer ellipsoid's mean radius, great circle), m */
function cmGround(la1,lo1,la2,lo2){ return gcArc(la1,lo1,la2,lo2)[0]*RE_F; }

/* ---- what the views draw, sampled on the slice grid ---- */
function cmSample(W){
  const A=W.C.A, K=W.K, t=W.t, get=worldGET(W), mm=lgcProg(W), a=K.air||{};
  if(mm!==null&&mm!==W.mm){ W.mm=mm; if(!W.seen['p'+mm]){ W.seen['p'+mm]=get; logEvent(W,progName('C',mm)); } }
  const F=dskyFace(W.C.S);
  cmTrackVN(W,F,get);

  for(let k=1;k<10;k++) p=[0,1,2].map(j=>p[j]*tau+loiDP(C55.VECOEM+6*k+2*j,0));

const loiEarthDir=get=>vunit(vmul(loiMoonFromEarth(get),-1));

/* ---- the truth: the arrival hyperbola in the plane and with the pericentre direction of NASSP's (its state vector,

   75:53:27.74), and the excess speed that makes P30's N42 read the PAD's 431.3 and -128.2 (A11O, loi_model.py) ---- */
function loiHyperbola(){ return memo('loihyp','1',()=>{
  const r=[0,2,4].map(k=>loiDP(C55.RRECTCSM+k,27)), v=[0,2,4].map(k=>loiDP(C55.VRECTCSM+k,5)*100), mu=MUM_SI;
  const h=vcross(r,v), ev=vsub(vmul(vcross(v,h),1/mu),vunit(r));
  const P=vunit(ev), Q=vunit(vcross(h,P)), rp=LOI_RLS+A11O.rpAlt, vinf=A11O.vinf;

/* P30's N42 on a conic, computed the CMC's way: the PAD's delta-V added at TIG in the local vertical frame (X forward

   to 0.001 nmi from the same state at TIG, agc/t_loi_n42.js) */
function loiN42(r,v,dv){

  const v2=vadd(v,vadd(vmul(X,dv[0]*FT),vadd(vmul(Y,dv[1]*FT),vmul(Z,dv[2]*FT))));
  const mu=MUM_SI, R=vlen(r), en=vdot(v2,v2)/2-mu/R, a=-mu/(2*en), hh=vlen(vcross(r,v2)), e=Math.sqrt(Math.max(0,1-hh*hh/(mu*a)));

/* ---- the computer's memory when the world starts: NASSP's above the central registers; the IMU ideal; the clock;
   the CDUs at the gimbals; the PIPAs empty; the uplink: both state vectors (docked: the same; Moon, R B27 m, V B5 m/cs,
   TET B28 cs); the DAP load the crew's V48 shows (the PAD's N47 masses, N48 trims: 41 and -8 counts of 85.41 arcsec;
   NASSP's N46 words kept; the vectors laid out as Luminary's, lgcStateVector); Z at the restart entry ---- */
function loiLoads(W){
  const C=W.C, A=C.A, t=worldGET(W), K=W.K;
  for(const k in CMC_LOI.words){ const a=parseInt(k,8); if(a>=0o24) A.setE(a,CMC_LOI.words[k]); }
  for(const n of CMC_COMP) A.setE(C55[n],0);

  const ga=csmGimbals(K); [ga.oga,ga.iga,ga.mga].forEach((g,k)=>A.setE(0o32+k,cduCount(g)));
  for(let k=0;k<3;k++) A.setE(0o37+k,0);
  lgcStateVector(A,C55.RRECTCSM,K.r,K.v,t); lgcStateVector(A,C55.RRECTLEM,K.r,K.v,t);
  agcSetSP(A,C55.CSMMASS,A11O.csmLb*LBM,16); agcSetSP(A,C55.LEMMASS,A11O.lmLb*LBM,16);
  A.setE(C55.PACTOFF,Math.round(A11O.trim[0]*3600/85.41)&0o77777);
  A.setE(C55.YACTOFF,(0o77777+Math.round(A11O.trim[1]*3600/85.41))&0o77777);

/* ---- the switches and signals: NASSP's at 75:42 (as the entry's: IMU operate, temperature in limits; G&N autopilot
   control, the SC CONT switch at CMC; zero optics) ---- */
function loiDiscretes(W){
  const A=W.C.A;

  A.chan(0o31,0o37777,0o77777);
  A.chan(0o32,0o17777,0o17777);
  A.chan(0o33,0o1767,0o1777);
