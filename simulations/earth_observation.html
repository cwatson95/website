  { const X=parseXrays([{time_tag:'2026-09-18T10:00:00Z',flux:1e-6,energy:'0.1-0.8nm'},{time_tag:'2026-09-18T09:59:00Z',flux:2e-6,energy:'0.1-0.8nm'},{time_tag:'2026-09-18T10:00:00Z',flux:3e-7,energy:'0.05-0.4nm'},{time_tag:'bad',flux:1,energy:'0.1-0.8nm'}]);
    eq(X.long.length,2,'X-ray long band'); ok(X.long[0][0]<X.long[1][0],'sorted by time'); eq(X.short.length,1,'short band'); }
  { const K=parseKp([{time_tag:'2026-09-11T03:00:00',Kp:3.0},{time_tag:'2026-09-11T00:00:00',Kp:1.33}]); eq(K.length,2,'Kp rows'); eq(K[0][1],1.33,'sorted, UTC'); eq(K[0][0],Date.UTC(2026,8,11,0,0,0),'the time tag is UTC');
    const K2=parseKp([['time_tag','Kp','a'],['2026-09-11 00:00:00.000','2.33','1']]); eq(K2.length,1,'the older array format'); }
  { const O=parseOvation({'Observation Time':'x','Forecast Time':'y',coordinates:[[0,-90,3],[359,90,7],[10,65,42]]}); eq(ovationAt(O,65,10),42,'OVATION lookup'); eq(ovationAt(O,65,370),42,'wraps in longitude'); eq(ovationAt(O,90,-1),7,'at the pole, 359 E'); }
  { const E=parseEonet({events:[{id:'E1',title:'x',categories:[{id:'wildfires'}],geometry:[{type:'Point',coordinates:[1,2],date:'2026-09-16T20:17:00Z'},{type:'Point',coordinates:[3,4],date:'2026-09-17T20:17:00Z'}]}]});
    eq(E.length,1,'one event'); eq(E[0].lon,3,'its latest point'); eq(E[0].track.length,2,'and its track'); }

  /* ---------- G. the models with stub data, the readouts ---------- */
  injectStubs(TNOW);
  withState({view:'fires'},()=>{ const M=buildModel().Fi; eq(M.recs.length,REF.fire_sample.length,'fire records from the stub'); ok(M.stats.n>0&&isFinite(M.stats.frpSum),'fire statistics');
    let s=0; for(const f of REF.fire_sample) s+=f.FRP; close(M.stats.frpSum,s,1e-9,'total FRP');
    ok(M.pixelCurve.pts.length>100,'the pixel curve exists');
    /* the real detections placed on NOAA-20's orbit: along-scan size = 3, 2, 1 native samples */
    const O=M.pixOrbit; ok(O&&O.placed>=0.95*O.tried,'the sample detections are found on the orbit ('+(O?O.placed+' of '+O.tried:'none')+')');
    if(O){ const Z=O.zones; ok(Math.abs(Z[0]-3)<0.1||!isFinite(Z[0]),'zone 1: 3 samples ('+fmt(Z[0],3)+')'); ok(Math.abs(Z[1]-2)<0.1||!isFinite(Z[1]),'zone 2: 2 samples ('+fmt(Z[1],3)+')');
      ok(Math.abs(Z[2]-1)<0.1||!isFinite(Z[2]),'zone 3: 1 sample ('+fmt(Z[2],3)+')'); ok(Z.filter(isFinite).length>=2,'at least two zones populated');
      ok(O.track>0.94&&O.track<1.0,'along-track size / (0.371 km x growth) about 0.97 ('+fmt(O.track,3)+')'); } });
  withState({view:'fires',fDN:'night'},()=>{ const M=buildModel().Fi; eq(M.recs.length,REF.fire_sample.filter(f=>f.DAYNIGHT==='N').length,'the night filter'); });
  withState({view:'fires',fConf:'high'},()=>{ const M=buildModel().Fi; eq(M.recs.length,REF.fire_sample.filter(f=>f.CONFIDENCE==='high').length,'the confidence filter'); });
  withState({view:'fires',fProbe:{lat:REF.fire_sample[7].LATITUDE,lon:REF.fire_sample[7].LONGITUDE,tol:0.01}},()=>{ const M=buildModel().Fi; ok(M.probe===REF.fire_sample[7],'a click picks the nearest detection'); ok(isFinite(M.probeScan),'its scan angle'); });
  withState({view:'sun'},()=>{ const M=buildModel().Su; ok(M.cls&&/^[ABCMX]/.test(M.cls.text),'the current class'); ok(M.view&&M.view.N.length===360,'the northern oval edge'); });
  withState({view:'sentinel'},()=>{ const M=buildModel().Se; ok(M.complete,'the stub scene is complete'); eq(M.products.length,2,'the duplicate acquisition is folded'); ok(M.pred.length>0,'predicted passes over the point');
    ok(M.pred.some(q=>q.mission==='S1'),'Sentinel-1 passes are predicted'); ok(M.pred.some(q=>q.mission==='S3'),'and Sentinel-3'); });
  withState({view:'sentinel'},()=>{ const M=buildModel().Se, R=REF.scene_px.find(q=>q.lat===30.83&&q.lon===31.05);
    ok(M.pointPx&&M.pointPx.inside&&M.pointPx.i===R.i&&M.pointPx.j===R.j,'the default point sits in the stub scene at PROJ’s pixel ('+R.i+', '+R.j+')');
    ok(M.probeAt==='point'&&M.probe&&M.probe.i===R.i&&M.probe.j===R.j,'with no pixel clicked, the spectrum is the point’s'); eq(M.probe.scl,5,'bare ground there in the stub'); });
  withState({view:'sentinel',sLat:30.0444,sLon:31.2357,sPlace:'own'},()=>{ const M=buildModel().Se; ok(!M.complete||!M.probe,'another point has no scene loaded in the stubs: no spectrum'); });
  withState({view:'sentinel',sProbe:{i:100,j:600}},()=>{ ok(buildModel().Se.probeAt==='click','a clicked pixel takes over the spectrum'); });
  withState({view:'sentinel',sLat:30.0444,sLon:31.2357,sPlace:'own'},()=>{ const k='stac:'+pointKey(30.0444,31.2357)+':'+ST.sCloud;
    NET_DONE.set(k,NET_DONE.get('stac:'+pointKey(DEFAULTS.sLat,DEFAULTS.sLon)+':'+ST.sCloud));        /* the same tile found for a point outside it */
    const M=buildModel().Se; ok(M.complete&&M.pointPx&&!M.pointPx.inside,'Cairo is outside tile 36RUV'); ok(!M.probe,'a point outside the scene gives no spectrum'); NET_DONE.delete(k); });
  withState({view:'sentinel',sProbe:{i:100,j:600}},()=>{ const M=buildModel().Se; close(M.probe.ndvi,(0.38-0.04)/(0.38+0.04),1e-6,'NDVI of the vegetated stub pixel'); eq(M.probe.scl,4,'its scene class'); });
  for(const v of TABS){ withState({view:v[0]},()=>{ const M=buildModel(); const s=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
    ok(!/NaN|undefined|Infinity|\[object/.test(s),v[0]+' readout, bar and tag are clean'); ok(eqbarHTML(M).length>80,v[0]+' equation bar'); }); }

  /* ---------- H. the drawings, every view at four sizes ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[['mosaic',{view:'mosaic'},20],['mosaic zoom probe',{view:'mosaic',mLon:-60,mLat:-10,mDpp:0.05,mProbe:{lat:-12,lon:-55},mOverlay:'sst'},20],
    ['mosaic terra no model',{view:'mosaic',mSat:'terra',mSwath:false,mGlint:false,mCover:false},10],
    ['geo',{view:'geo'},10],['geo himawari ir probe',{view:'geo',gSat:'hima',gBand:'ir',gProbe:{lat:10,lon:150}},10],['geo ring',{view:'geo',gRing:true},40],['geo meteosat',{view:'geo',gSat:'mtg',gVza:false},10],
    ['fires',{view:'fires'},20],['fires zoom probe',{view:'fires',fLon:-46,fLat:-12,fDpp:0.01,fProbe:{lat:REF.fire_sample[3].LATITUDE,lon:REF.fire_sample[3].LONGITUDE,tol:0.01}},20],['fires modis empty',{view:'fires',fProd:'terra'},10],
    ['sentinel',{view:'sentinel'},10],['sentinel ndvi probe',{view:'sentinel',sComp:'ndvi',sProbe:{i:300,j:400},sLoad:true},10],
    ['fleet',{view:'fleet'},20],['fleet geo group',{view:'fleet',flGroup:'geo',flSel:'METEOSAT-9 (MSG-2)'},7],['fleet top',{view:'fleet',camLat:89,camLon:0},20],
    ['sun',{view:'sun'},6],['sun obs',{view:'sun',auObs:true,obsLat:62,obsLon:-150},6]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));
  NET_DONE.clear();
  CLOCK.fixed=null;
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
