<title>Earth observation, live &mdash; LANCE, GOES, Meteosat, Himawari, FIRMS and Copernicus Sentinel data with the orbits and radiometry behind them</title>
<!--
  ===================================================================
  earth_observation.html — live, keyless Earth-observation data from
  NASA (GIBS / LANCE / FIRMS / EONET / CMR), NOAA (GOES, SWPC),
  EUMETSAT (Meteosat), JMA (Himawari) and ESA Copernicus (the Data
  Space catalogue, Sentinel-2 on AWS), set against the orbital
  mechanics, scan geometry and radiometry that produce it
  ===================================================================

  Six views.  TODAY'S EARTH: the LANCE near-real-time corrected-
  reflectance mosaic of one imager for one UTC day (MODIS Terra/Aqua,
  VIIRS Suomi NPP/NOAA-20/NOAA-21) as GIBS tiles, with a science overlay
  whose colours are read back into physical values; over it the page's
  own SGP4 orbit of that satellite: the swath edges, the equator times,
  the predicted sun glint, the day's coverage by latitude against the
  non-black share of the actual picture, and NASA's published ground
  track measured against the orbit.  GEOSTATIONARY: GOES-East,
  GOES-West, Himawari, Meteosat 0 deg and Meteosat IODC, resampled pixel
  by pixel into each satellite's own view through the GOES-R fixed grid,
  three hours of frames, the clean-IR brightness temperature, a
  standard-atmosphere cloud-top height and its parallax; the whole ring.
  FIRES: every LANCE/FIRMS detection of a product-day from the GIBS
  vector tiles; the FRP distribution and its power-law tail; the
  two-channel (Dozier) sub-pixel fire temperature and area; each
  pixel's reported size against the scan geometry.  COPERNICUS: the
  Copernicus Data Space catalogue over a point (clicked, or typed in any
  common GPS form) (Sentinel-1, -2, -3, -5P) against the page's own
  predicted overpasses; a Sentinel-2 L2A scene's
  surface reflectance read from its cloud-optimised GeoTIFFs (true and
  false colour, NDVI, NDWI, burn ratio, scene class, a pixel's
  spectrum).  THE FLEET: 27 Earth-observation and weather satellites on
  a globe from live CelesTrak elements, their swaths, the terminator,
  the sun-synchronous node drift and the repeat cycle, passes over a
  place.  SPACE WEATHER: GOES X-ray flux and flare classes, GOES SUVI,
  the planetary K index, the OVATION aurora and the line from which it
  stands on the horizon.

  THE NETWORK (a deliberate departure from the house "no network" rule)
  -------------------------------------------------------------------
  Every source is free, keyless and CORS-open (each checked from the
  shell on 2026-09-18 and again, through the page's own loaders under
  deno, on 2026-09-21; listed in build_eo/sources/).  Nothing is fetched
  until a view needs it; each request has a timeout, failures are shown
  in the readout, and a dead service costs one retry a minute.  Offline
  the page still draws: the orbits run on the elements embedded at build
  time (CelesTrak, 2026-09-18), the land is Natural Earth 1:110m, and
  every model curve is computed here.  CelesTrak elements are cached
  per viewer for two hours, as CelesTrak asks.

  WHAT IS COMPUTED HERE AND CHECKED BY build_eo/derive_*.py
  ---------------------------------------------------------
  SGP4 (near-earth branch, ported from python-sgp4 2.27: positions
  agree to 1e-9 km for the 19 low orbiters over +/-3 days); the TEME to
  Earth-fixed rotation (skyfield: 0.5 mm) and WGS-84 geodesy (PROJ); the
  Sun (USNO approximate coordinates, within 0.01 deg of JPL DE421); UTM
  (PROJ: 0.2 micrometre); the GOES-R fixed grid (PROJ geos; the PUG's
  worked example); Planck and its inverse (scipy constants; Stefan-
  Boltzmann recovered by integration); Dozier's inversion (brentq on a
  different elimination); the pixel footprint (finite differences of
  exact geometry); the day's coverage (an exact union of swath
  quadrilaterals, against a point-by-point brute force: 0.2 points per
  latitude, 5 on the polar-day edge); the MVT, colour-map, TIFF and
  inflate decoders (independent Python decoders on the committed
  fixtures; a zlib vector with every length code).

  CHECKED AGAINST THE DATA (build_eo/validation/README.md)
  -------------------------------------------------------
  Coverage, 2026-09-17: model and picture at the equator 99.5/99.8 %
  (VIIRS NOAA-20) and 85.7/86.0 % (MODIS Aqua, 2.5 points per latitude
  over all rows); Terra and Suomi NPP fell short everywhere that day
  (missing granules).  Pixels: 1200 FIRMS detections placed on the orbit
  give VIIRS's 3/2/1 aggregation zones (steps at 31.35 and 44.70 deg,
  the widest at 56.06) and MODIS's along-scan growth to 1 %.  The
  geostationary disk against NOAA STAR's own GOES-19 image: offset
  (0, 0) px, radii within 1 px.  The catalogue over the Nile delta,
  2026-09-21: S1 5/5, S2 18/18, S3 30/31, S5P 60/60 products with a
  predicted pass in their time span.  NASA's published orbit tracks sit
  12-17 km WEST of SGP4 on the same elements, for three unrelated
  satellites and both directions of travel (along the track: 7 km behind
  on the descending passes of 2026-09-17, 15 km ahead on NOAA-20's
  ascending ones of 2026-09-20); no standard time scale explains it, and
  the page reports the offset without adjusting to it.

  WHAT IS MODELLED
  ----------------
  Geostationary satellites run through the near-earth SGP4 formulas: the
  deep-space lunisolar and resonance terms are omitted (24-31 km over
  +/-3 days against full SDP4).  Scan geometry uses a sphere of 6371 km
  for pixel sizes and the WGS-84 ellipsoid for swath edges.  TROPOMI's
  swath is its 108 deg field of view (a 2600 km ground width missed 7
  of 60 products); OLCI's is 68.5 deg tilted 12.6 deg west.  GIBS tiles
  are resampled colour pictures, so a colour is read back to a value
  exactly when it is a colour-map colour and by interpolation along the
  nearest colour-map segment otherwise (the readout says which).  A
  geostationary frame is shown only when all its tiles exist (the
  newest complete one, up to an hour back).  Brightness temperatures are
  monochromatic at the band centre.  The cloud-top height assumes the
  standard-atmosphere lapse rate.

  KNOWN-BAD (do not reintroduce)
  ------------------------------
  - GIBS WMS answers sub-daily geostationary requests with HTTP 200 and
    an EMPTY picture as often as not: frames come from WMTS tiles.
  - GIBS lists a frame before all its tiles exist, and a tile can answer
    200 and then 404 seconds later: a frame is all tiles or nothing.
  - A daily GIBS layer can have gaps (TROPOMI NO2): ask its time domain.
  - Earth Search's boa_offset_applied: the raster:bands offset of -0.1 is
    already in the numbers (clear water reads -0.09 if applied again).
  - The cross-track unit vector is n x a (pointing right); a x n put
    every swath and the SAR look on the wrong side.
  - pymod(-2.8e-14, 360) gave 360: wrap180 returned +180 and the tile
    loop never ended.
  - A Sentinel-2 product's Start = End is the datatake start: match a
    pass within 40 minutes after it.
  - EUMETView refuses pictures over 1024 px (HTTP 502).
  - CelesTrak answers repeat downloads with 503: never overwrite a good
    element snapshot with an empty fetch.
  - Coverage by marking whole 1-degree cells overstates MODIS's equator
    by 6 points; the mean zenith of a coarse quad misplaces the polar-day
    edge: split the quads the cut-off crosses.
  - Natural Earth closes Antarctica along (180,-90) -> (-180,-90): never
    break a fill there (the chord drew a band across the map).
  - A 200 with the right type and size is not a picture: decode it.

  WHAT IS NOT MODELLED
  --------------------
  Atmospheric correction, band response functions, terrain, the
  instruments' bow-tie overlap, polar motion and UT1 - UTC (under 0.4 km
  on the ground).
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];

  const groups=[]; let cur=[], pend=null;

/* ---- the GOES-R ABI fixed grid (PUG vol. 3, section 5.1.2.8): scan angles x (east-west)

  const rc=FG.rpol/Math.sqrt(1-FG.e*FG.e*Math.cos(phic)*Math.cos(phic));
  const sx=FG.H-rc*Math.cos(phic)*Math.cos(lam-lam0), sy=-rc*Math.cos(phic)*Math.sin(lam-lam0), sz=rc*Math.sin(phic);

/* ---- the plate carree used by the map views: a view is {lon0, lat0 (centre), dpp (degrees

/* ================================================================== *

/* SI defining constants (exact since 2019; CODATA 2018) */

function planck(lamUm,T){

  return SRC.gibsWms+'?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS='+encodeURIComponent(layer)+'&STYLES=&CRS=EPSG:4326'
    +'&BBOX='+[bbox.s,bbox.w,bbox.n,bbox.e].map(v=>v.toFixed(4)).join(',')+'&WIDTH='+w+'&HEIGHT='+h
    +'&FORMAT='+encodeURIComponent(fmt||'image/jpeg')+'&TRANSPARENT=TRUE&TIME='+encodeURIComponent(time);
}
function eumetUrl(layer,time,bbox,w,h){
  return SRC.eumetview+'?service=WMS&version=1.3.0&request=GetMap&layers='+encodeURIComponent(layer)+'&styles=&crs=EPSG:4326'
    +'&bbox='+[bbox.s,bbox.w,bbox.n,bbox.e].map(v=>v.toFixed(4)).join(',')+'&width='+w+'&height='+h+'&format=image/jpeg'
    +(time?'&time='+encodeURIComponent(time):'');
}

/* CelesTrak GP for the fleet: two groups (about 100 kB) plus, one by one, any fleet member the
   groups lack; cached two hours per viewer (CelesTrak asks for no more than one download per two
   hours and answers 503 to clients that ask more often) */
async function loadGP(){
  return netLoad('gp','CelesTrak orbital elements',async()=>{
    let pool=lsGet('eo.gp.v2',2*3600e3), cached=!!pool;
    if(!pool){
      pool={};
      for(const g of ['resource','weather']){
        const r=await netGet(SRC.celestrak+'?GROUP='+g+'&FORMAT=json','json',{what:'CelesTrak '+g});
        for(const o of r.data) if(FLEET_BY[o.OBJECT_NAME]&&!pool[o.OBJECT_NAME]) pool[o.OBJECT_NAME]=o;
      }
    }
    let added=false;
    for(const f of FLEET) if(!pool[f.name]&&f.norad&&!pool['_tried_'+f.norad]){
      try{ const r=await netGet(SRC.celestrak+'?CATNR='+f.norad+'&FORMAT=json','json'); for(const o of r.data) if(o.OBJECT_NAME===f.name) pool[o.OBJECT_NAME]=o; }
      catch(e){ pool['_tried_'+f.norad]=1; }
      added=true;
    }
    if(!cached||added) lsPut('eo.gp.v2',pool);
    const n=FLEET.filter(f=>pool[f.name]).length;
    return {pool,cached,msg:n+' of '+FLEET.length+' element sets'+(cached?' (cached)':'')};
  });
}
/* the GIBS vector tiles of one product-day at level 0 (two tiles hold the whole world) */
async function loadMvtWorld(layer,date,tms){
  return netLoad('mvt:'+layer+':'+date,'GIBS vector tiles',async()=>{
    const feats=[]; let bytes=0, layerName='';
    for(const col of [0,1]){
      const r=await netGet(gibsTileUrl(layer,date,tms,0,0,col,'mvt'),'bytes',{timeout:60000,what:'GIBS '+layer});
      let u8=r.data; bytes+=u8.length;
      if(isGzip(u8)) throw new Error('tile arrived gzipped (the browser should have decoded it)');
      for(const L of mvtDecode(u8)){ layerName=L.name;
        const x0=col===0?-180:108, x1=col===0?108:180;          /* each tile owns its own 288-degree span */
        for(const F of L.features){ const p=F.props;
          if(p.LONGITUDE!==undefined){ if(p.LONGITUDE>=x0&&p.LONGITUDE<x1) feats.push(p); }
          else { F.col=col; F.extent=L.extent; feats.push(F); } } }
    }
    return {feats,bytes,layer:layerName,msg:feats.length+' features'};
  });
}

/* the Copernicus Data Space catalogue: products whose footprint holds the point, newest first */
async function loadCdse(lat,lon,days){
  const key='cdse:'+pointKey(lat,lon)+':'+days;
  return netLoad(key,'Copernicus Data Space',async()=>{
    const since=new Date(Date.now()-days*MS_DAY).toISOString();
    const pt="geography'SRID=4326;POINT("+lon.toFixed(5)+' '+lat.toFixed(5)+")'";
    /* the four missions in parallel (one at a time took 13 s on 2026-09-18) */
    const parts=await Promise.all(CDSE_MISSIONS.map(async m=>{
      const f="Collection/Name eq '"+m.collection+"' and OData.CSC.Intersects(area="+pt+") and ContentDate/Start gt "+since
        +(m.type?" and contains(Name,'"+m.type+"')":'');
      const u=SRC.cdse+'?$filter='+encodeURIComponent(f)+'&$orderby='+encodeURIComponent('ContentDate/Start desc')+'&$top=60&$expand=Assets';
      try{ const r=await netGet(u,'json',{timeout:30000,what:'CDSE '+m.label});
        return (r.data.value||[]).map(p=>({mission:m.id,name:p.Name,ms:Date.parse(p.ContentDate&&p.ContentDate.Start),msEnd:Date.parse(p.ContentDate&&p.ContentDate.End),
          quick:((p.Assets||[]).find(a=>a.Type==='QUICKLOOK')||{}).DownloadLink||null,foot:p.GeoFootprint||null,online:p.Online})); }
      catch(e){ return [{mission:m.id,error:String(e.message||e)}]; }
    }));
    const out=[].concat(...parts);
    return {products:out,msg:out.filter(p=>!p.error).length+' products'};
  });
}
/* Earth Search (Element 84) STAC: Sentinel-2 L2A items at the point, newest first */

/* the frame times a geostationary layer actually has, newest first: GIBS answers a
   DescribeDomains request, EUMETView's per-layer capabilities carry the time dimension */
async function loadGeoTimes(G,L){
  return netLoad('gtimes:'+L.layer,'frame times',async()=>{
    const now=nowMs(), out=[];
    if(L.src==='gibs'){
      const iso=t=>new Date(t).toISOString().slice(0,19)+'Z';
      const tms=(GIBS_LAYERS[L.layer]||{}).tms||'2km';
      const r=await netGet(SRC.gibsWmts+'1.0.0/'+L.layer+'/default/'+tms+'/all/'+iso(now-5*3600e3)+'--'+iso(now)+'.xml','text');
      const m=/<Domain>([^<]*)<\/Domain>/.exec(r.data); if(!m) throw new Error('no time domain');
      for(const t of expandTimeDomain(m[1],now-5*3600e3,now)) out.push(t);
    } else {
      const [ws,name]=L.layer.split(':');
      const r=await netGet(SRC.eumetview.replace(/wms$/,'')+ws+'/'+name+'/wms?service=WMS&version=1.3.0&request=GetCapabilities','text');
      const m=/<Dimension name="time"[^>]*>([^<]*)<\/Dimension>/.exec(r.data); if(!m) throw new Error('no time dimension');
      for(const t of expandTimeDomain(m[1].trim(),now-5*3600e3,now)) out.push(t);
    }
    out.sort((a,b)=>b-a);
    return {times:out.slice(0,LIM.gSteps),msg:out.length?'latest '+new Date(out[0]).toISOString().slice(11,16)+' UTC':'none'};
  });
}
/* the days a daily GIBS layer holds in the 30 days up to a date, newest first: a daily layer
   can have gaps (TROPOMI NO2 on 2026-09-21 held 09-01..05 and 09-14..18 only) */
async function loadLayerDays(layer,date){
  return netLoad('ldays:'+layer+':'+date,'overlay dates',async()=>{
    const tms=(GIBS_LAYERS[layer]||{}).tms||'2km', t1=Date.parse(date+'T00:00:00Z'), t0=t1-30*MS_DAY;
    const r=await netGet(SRC.gibsWmts+'1.0.0/'+layer+'/default/'+tms+'/all/'+utcDate(t0)+'--'+utcDate(t1)+'.xml','text');
    const m=/<Domain>([^<]*)<\/Domain>/.exec(r.data); if(!m) throw new Error('no time domain');
    const days=[...new Set(expandTimeDomain(m[1],t0,t1+MS_DAY-1).map(t=>utcDate(t)))].sort().reverse();
    return {days,msg:days.length?'newest '+days[0]:'no day in the last 30'};
  });
}
/* an ISO 8601 time domain ("start/end/PT10M, start/end/P1D, t, ...") -> the instants inside [t0, t1] */
function expandTimeDomain(s,t0,t1){
  const out=[];
  for(const part of String(s).split(',')){ const q=part.trim().split('/');
    if(q.length===3){ const a=Date.parse(q[0]), b=Date.parse(q[1]), m=/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/.exec(q[2]);
      if(!m||!isFinite(a)||!isFinite(b)) continue; const step=((+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0))*1000; if(!(step>0)) continue;
      const k0=Math.max(0,Math.ceil((t0-a)/step)); for(let t=a+k0*step;t<=Math.min(b,t1);t+=step) out.push(t); }
    else if(q.length===1){ const t=Date.parse(q[0]); if(isFinite(t)&&t>=t0&&t<=t1) out.push(t); } }
  return out;
}
/* the offset added to DN * scale.  Known-bad (2026-09-18): Earth Search items flagged
   earthsearch:boa_offset_applied carry a raster:bands offset of -0.1 that is ALREADY in the
   numbers (clear water then reads -0.09); reflectance is DN * scale for those items */
function cogOffset(item,rb){ return (item&&item.properties&&item.properties['earthsearch:boa_offset_applied'])?0:((rb&&rb.offset)||0); }
/* one band of a Sentinel-2 COG at its 687-pixel overview: reflectance (Float32Array) */
async function loadCogBand(item,asset){
  const key='cog:'+item.id+':'+asset;
  return netLoad(key,'Sentinel-2 COG',async()=>{
    const a=item.assets[asset]; if(!a) throw new Error('no asset '+asset);
    let head=(await netGet(a.href,'bytes',{range:[0,65535],what:'COG header'})).data;
    let P=tiffParse(head);
    if(P.need){ head=(await netGet(a.href,'bytes',{range:[0,P.need],what:'COG header'})).data; P=tiffParse(head); if(P.need) throw new Error('COG header too long'); }
    /* the overview closest to 687 pixels across */
    let ifd=P.ifds[0];
    for(const T of P.ifds) if(Math.abs(T.width-687)<Math.abs(ifd.width-687)) ifd=T;
    const W=ifd.width, H=ifd.height, tw=ifd.tileW, th=ifd.tileH, nx=Math.ceil(W/tw), ny=Math.ceil(H/th);
    if(ifd.compression!==8&&ifd.compression!==32946) throw new Error('COG compression '+ifd.compression+' not supported');
    const out=new Float32Array(W*H), bits=Array.isArray(ifd.bits)?ifd.bits[0]:ifd.bits;
    const rb=(a['raster:bands']||[{}])[0]||{};
    const scale=rb.scale!==undefined?rb.scale:1;
    const offset=cogOffset(item,rb);
    for(let ty=0;ty<ny;ty++) for(let tx=0;tx<nx;tx++){
      const k=ty*nx+tx, off=ifd.tileOffsets[k], cnt=ifd.tileCounts[k];
      if(!cnt) continue;
      const comp=(await netGet(a.href,'bytes',{range:[off,off+cnt-1],what:'COG tile'})).data;
      const raw=await inflateBytes(comp,tw*th*bits/8);
      let px;
      if(bits===16){ px=tileToU16(raw,P.le,tw,th); if(ifd.predictor===2) unpredict16(px,tw,th); }
      else if(bits===8){ px=raw; if(ifd.predictor===2) for(let y=0;y<th;y++) for(let x=1;x<tw;x++) px[y*tw+x]=(px[y*tw+x]+px[y*tw+x-1])&255; }
      else throw new Error('COG '+bits+'-bit samples not supported');
      for(let y=0;y<th;y++){ const Y=ty*th+y; if(Y>=H) break;
        for(let x=0;x<tw;x++){ const X=tx*tw+x; if(X>=W) break; const v=px[y*tw+x];
          out[Y*W+X]=v===0?NaN:(asset==='scl'?v:v*scale+offset); } }
    }
    return {W,H,data:out,scale,offset,msg:asset+' '+W+'x'+H};
  });
}
/* DEFLATE: the browser's own decoder when it has one, else the page's inflate */
async function inflateBytes(u8,expected){
  if(typeof DecompressionStream!=='undefined'&&typeof Response!=='undefined'&&typeof Blob!=='undefined'){
    try{
      const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'));
      return new Uint8Array(await new Response(s).arrayBuffer());
    }catch(e){ /* fall through to the JS inflate */ }
  }
  return inflateZlib(u8,expected);
}

  M.items=S?S.items:null;

    const want=['blue','green','red','nir','swir16','swir22','scl'];

    const out=[];

      const inst=INSTRUMENTS[FLEET_BY[nm].inst];
      for(const q of passesOver(sat,inst,lat,lon,t0,t1,30)) if(q.inSwath&&(m.id==='S1'||q.sza<90)) out.push({mission:m.id,sat:nm,ms:q.ms,theta:q.theta,sza:q.sza,asc:q.asc}); }

  if(M.complete){ if(st.sProbe){ M.probe=pixelSpectrum(M,st.sProbe.i,st.sProbe.j); M.probeAt='click'; }

    const sat=(/^S\d[A-D]/.exec(p.name)||[''])[0], key=p.mission+sat+Math.round(p.ms/60000);

    for(const q of pred) if(q.mission===p.mission&&(!sat||!q.sat||q.sat===sat)){ if(q.ms>=a&&q.ms<=b&&!inside) inside=q;
      const d=q.ms<a?a-q.ms:q.ms>b?q.ms-b:0; if(!best||d<best.d) best={d,q}; }
    rows.push({p,sat,q:inside||(best&&best.q),inside:!!inside,dtMin:best?best.d/60000:NaN}); }
  return rows;
}
function itemMeta(it){

/* the 10-band reflectance at pixel (i, j) of the 687 x 687 scene, with the band centres the
   item itself declares (eo:bands) */
function pixelSpectrum(M,i,j){
  const out=[];
  for(const b of ['blue','green','red','nir','swir16','swir22']){ const B=M.bands[b]; if(!B) continue;
    const W=B.W, H=B.H, x=clamp(Math.floor(j*W/687),0,W-1), y=clamp(Math.floor(i*H/687),0,H-1);
    const eb=(M.item.assets[b]['eo:bands']||[{}])[0];
    out.push({band:b,name:eb.name,um:eb.center_wavelength,fwhm:eb.full_width_half_max,r:B.data[y*W+x]}); }
  const g=k=>(out.find(o=>o.band===k)||{}).r;
  const R={green:g('green'),red:g('red'),nir:g('nir'),swir16:g('swir16'),swir22:g('swir22')};
  const scl=M.bands.scl?M.bands.scl.data[clamp(Math.floor(i*M.bands.scl.H/687),0,M.bands.scl.H-1)*M.bands.scl.W+clamp(Math.floor(j*M.bands.scl.W/687),0,M.bands.scl.W-1)]:NaN;
  return {i,j,spec:out,ndvi:INDEX.ndvi(R),ndwi:INDEX.ndwi(R),nbr:INDEX.nbr(R),ndsi:INDEX.ndsi(R),scl};
}

/* ---------- 5. the fleet ---------- */
function fleetList(st){
  return FLEET.filter(f=>st.flGroup==='all'||(st.flGroup==='geo'?f.orbit==='GEO':f.agency===st.flGroup&&f.orbit==='LEO'));
}
function fleetModel(st){
  const t=SIM.t||nowMs(), sun=sunEcef(t);
  const list=fleetList(st), sats=[];
  for(const f of list){ const s=fleetSat(f.name); if(!s) continue;
    const e=satEcef(s,t); if(!e) continue;
    const g=ecefToGeo(e.r[0],e.r[1],e.r[2]);
    sats.push({f,s,e,lat:g.lat*RAD,lon:g.lon*RAD,alt:g.h,sunlit:inSunlight(e.r,sun.u)}); }
  const M={t,sun,sats,src:gpSource()};
  const sel=fleetSat(st.flSel);
  if(sel){ const F=FLEET_BY[st.flSel], R=orbitRates(sel), e=satEcef(sel,t);
    M.sel={f:F,s:sel,R,ltan:ltanOf(sel,t),incl:sel.inclo*RAD,iss:sunSyncInclination(R.aKm,sel.ecco)*RAD,
           nodeRate:R.nodeRateDegPerDay,j2Rate:j2NodeRate(R.aKm,sel.ecco,sel.inclo),speed:e?V3.len(e.teme.v):NaN,
           rep:repeatCycle(R.revsPerNodalDay,40),ageDays:(t-sel.msEpoch)/MS_DAY};
    if(F.orbit==='LEO'){ const T=R.Tnodal*60000;
      M.sel.track=memo('fl.track',st.flSel+Math.round(t/60000)+sel.epochStr,()=>{ const pts=[]; for(let q=-0.5*T;q<=0.5*T;q+=20000){ const e2=satEcef(sel,t+q); if(e2) pts.push(e2.r); } return pts; }); }
    if(st.obsSet||true){ M.obs={lat:st.obsLat,lon:st.obsLon};
      M.obs.passes=memo('fl.pass',st.flSel+st.obsLat+','+st.obsLon+Math.floor(t/600000)+sel.epochStr,()=>{
        const inst=F.inst?INSTRUMENTS[F.inst]:null;
        return passesOver(sel,inst,st.obsLat,st.obsLon,t,t+2*MS_DAY,20).slice(0,6); }); }
  }
  return M;
}
/* is a point (km, Earth-fixed) in sunlight: outside the cylindrical shadow of a sphere of radius 6371 km */
function inSunlight(r,su){ const d=V3.dot(r,su); if(d>0) return true; const perp=V3.len(V3.sub(r,V3.mul(su,d))); return perp>6371.0; }

/* ---------- 6. space weather ---------- */
function sunModel(st){
  const W=netValue('swpc:'+st.xWin), O=netValue('ovation');
  const M={W,O};
  if(W&&W.x.long.length){ const last=W.x.long[W.x.long.length-1]; M.now=last; M.cls=flareClass(last[1]);
    let mx=W.x.long[0]; for(const r of W.x.long) if(r[1]>mx[1]) mx=r; M.max=mx; M.maxCls=flareClass(mx[1]); M.rNow=rScale(last[1]); }
  if(W&&W.kp.length){ M.kpNow=W.kp[W.kp.length-1]; M.kpMax=W.kp.reduce((a,b)=>b[1]>a[1]?b:a); M.gNow=gScale(M.kpNow[1]); }
  if(O){ M.view=memo('sun.view',O.fcst+st.auAlt+st.auProb,()=>auroraLines(O,st.auProb,st.auAlt));
    if(st.auObs){ M.obs={lat:st.obsLat,lon:st.obsLon,p:ovationAt(O,st.obsLat,st.obsLon)}; M.obs.visible=obsSeesAurora(M.view,st.obsLat,st.obsLon); } }
  return M;
}
/* the equatorward edge of the oval (probability >= pmin) in each hemisphere, and the line
   from which an aurora at height h on that edge stands on the horizon */
function auroraLines(O,pmin,hKm){
  const R=6371.0, dLat=horizonDistKm(hKm,R)/R*RAD, N=[], S=[];
  for(let lon=0;lon<360;lon++){
    let en=NaN, es=NaN;
    for(let lat=0;lat<=90;lat++){ const v=O.grid[(lat+90)*360+lon]; if(v>=pmin){ en=lat; break; } }
    for(let lat=0;lat>=-90;lat--){ const v=O.grid[(lat+90)*360+lon]; if(v>=pmin){ es=lat; break; } }
    N.push([lon,en,en-dLat]); S.push([lon,es,es+dLat]);
  }
  return {N,S,dLat};
}
function obsSeesAurora(V,lat,lon){
  const j=Math.round(pymod(lon,360))%360, H=lat>=0?V.N:V.S, row=H[j];
  if(!isFinite(row[1])) return {overhead:false,horizon:false};
  return lat>=0?{overhead:lat>=row[1],horizon:lat>=row[2]}:{overhead:lat<=row[1],horizon:lat<=row[2]};
}

    'a fire filling a thousandth of a pixel still dominates the 4 &micro;m radiance; the pixel itself grows along the scan as the view slants');
  if(M.view==='sentinel') return E('<span class="hl">NDVI = (&rho;<sub>NIR</sub> &minus; &rho;<sub>red</sub>) / (&rho;<sub>NIR</sub> + &rho;<sub>red</sub>)</span> &nbsp;&middot;&nbsp; &rho; = DN &times; 10<sup>&minus;4</sup> &nbsp;&middot;&nbsp; <span class="hl2">t<sub>pass</sub>: (P &minus; r)&middot;v&#770; = 0</span>',

function tagHTML(M){
  const st=ST;
  if(M.view==='mosaic') return '<b>today’s Earth</b> — '+M.Mo.S.name+', '+M.Mo.date+(M.Mo.O.id!=='none'?' · '+M.Mo.O.name:'');
  if(M.view==='geo') return '<b>geostationary</b> — '+(st.gRing?'the ring':M.Ge.G.name+' · '+fmtUtc(M.Ge.time,true));
  if(M.view==='fires') return '<b>fires</b> — '+M.Fi.P.name+', '+M.Fi.date;
  if(M.view==='sentinel') return '<b>Copernicus</b> — '+latlon(M.Se.lat,M.Se.lon,2);
  if(M.view==='fleet') return '<b>the fleet</b> — '+(FLEET_BY[st.flSel]?FLEET_BY[st.flSel].label:'');

/* ================================================================== *
 *  drawing helpers: the GIBS tile pyramid on a plate carree, land and *
 *  graticule, colour bars, and the three rasterisers (the globe, the  *
 *  geostationary disk, the polar cap) that resample an equirectangular *
 *  picture pixel by pixel.  Rasters need a real canvas; the headless  *
 *  recorder has none, so they report "skipped" and the vector layers  *
 *  still draw.                                                        *
 * ================================================================== */
let HIT=[];                                   /* clickable regions of the last drawing */
/* the readout floats over the top right of the stage: non-map content keeps out of it
   unless the stage is narrow (then the readout covers part of it, like the siblings) */
const RO_W=316;
function contentRight(W){ return W<900?W-8:W-RO_W; }
/* text labels that must not collide: every label drawn through labelPut is registered, and
   panels register keep-out rectangles; a label that would overlap one is skipped */
let LABELS=[];
function keepOut(b){ LABELS.push([b.x,b.y,b.x+b.w,b.y+b.h]); }
function labelFree(r){ for(const q of LABELS) if(r[0]<q[2]&&r[2]>q[0]&&r[1]<q[3]&&r[3]>q[1]) return false; return true; }
function labelPut(ctx,t,x,y,opt){
  const o=opt||{}; ctx.save();
  ctx.font=o.font||'10px -apple-system, sans-serif'; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.base||'alphabetic';
  const px=parseFloat((/([\d.]+)px/.exec(ctx.font)||[0,10])[1]), w=ctx.measureText(t).width, hgt=px*1.15;
  const x0=ctx.textAlign==='center'?x-w/2:ctx.textAlign==='right'?x-w:x;
  const y0=ctx.textBaseline==='top'?y:ctx.textBaseline==='middle'?y-hgt/2:ctx.textBaseline==='bottom'?y-hgt:y-hgt*0.8;
  const r=[x0-1,y0-1,x0+w+1,y0+hgt+1];
  const lim=o.bounds;
  if(lim&&(r[0]<lim.x||r[2]>lim.x1||r[1]<lim.y||r[3]>lim.y1)){ ctx.restore(); return false; }
  if(!labelFree(r)){ ctx.restore(); return false; }
  if(o.bg){ ctx.fillStyle=o.bg; ctx.fillRect(r[0]-2,r[1],r[2]-r[0]+4,r[3]-r[1]); }
  ctx.fillStyle=o.col||'#aeb6c6'; ctx.fillText(t,x,y); LABELS.push(r); ctx.restore();
  return true;
}
/* the first title variant that fits a width */
function fitTitle(ctx,variants,w,font){ ctx.save(); ctx.font=font||'italic 13px Georgia, serif';
  for(const v of variants){ if(ctx.measureText(plain(v)).width<=w){ ctx.restore(); return v; } }
  ctx.restore(); return variants[variants.length-1]; }
const DPR=()=>(typeof window!=='undefined'&&window.devicePixelRatio)||1;
function canRaster(ctx){ return !!(ctx&&typeof ctx.putImageData==='function'&&typeof document!=='undefined'); }
function makeCanvas(w,h){ if(typeof document==='undefined') return null; const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
/* an image's pixels (cached on the image) */
function imageRGBA(img){
  if(!img) return null;
  if(img._rgba) return img._rgba;
  if(img.rgba) return img;                                    /* already a pixel record (tests) */
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height, c=makeCanvas(w,h);
  if(!c) return null;
  const g=c.getContext('2d'); g.drawImage(img,0,0);
  try{ img._rgba={w,h,rgba:g.getImageData(0,0,w,h).data}; }catch(e){ img._rgba=null; }
  return img._rgba;
}

/* ---- the tile cache: url -> {state, img}; loads through NET.image, redraws on arrival ---- */
const TILES=new Map();
function tileGet(url){
  let T=TILES.get(url);
  if(!T){
    T={state:'loading',img:null,t:0};
    TILES.set(url,T);
    if(NET.image) NET.image(url).then(img=>{ T.img=img; T.state='ok'; if(NET.onData) NET.onData('tile','ok'); })
                                .catch(()=>{ T.state='error'; if(NET.onData) NET.onData('tile','error'); });
    else T.state='offline';
    if(TILES.size>600){ const old=[...TILES.entries()].sort((a,b)=>a[1].t-b[1].t).slice(0,150); for(const [k] of old) TILES.delete(k); }
  }
  T.t=Date.now();
  return T;
}
function tileStats(prefix){ let ok=0,load=0,err=0; for(const [k,T] of TILES) if(k.indexOf(prefix)>=0){ if(T.state==='ok') ok++; else if(T.state==='loading') load++; else err++; } return {ok,load,err}; }
/* the GIBS EPSG:4326 matrix: level z tiles are 512 px spanning 288/2^z degrees from (-180, 90) */
function gibsSpan(z){ return 288/Math.pow(2,z); }
function gibsLevelFor(dpp,maxZ){ const want=dpp/DPR(); for(let z=0;z<=maxZ;z++) if(0.5625/Math.pow(2,z)<=want*1.001) return z; return maxZ; }
const TMS_MAX={'250m':8,'500m':7,'1km':6,'2km':5,'31.25m':11,'15.625m':12};
/* draw one GIBS layer into the plate-carree box b for view V; returns tile counts */
function drawGibs(ctx,b,V,layer,time,tms,ext,alpha){
  const z=gibsLevelFor(V.dpp,TMS_MAX[tms]||5), span=gibsSpan(z);
  const nc=Math.ceil(360/span), nr=Math.ceil(180/span);
  const lonA=V.lon0-b.w/2*V.dpp, lonB=V.lon0+b.w/2*V.dpp, latA=V.lat0-b.h/2*V.dpp, latB=V.lat0+b.h/2*V.dpp;
  const c0=clamp(Math.floor((lonA+180)/span),0,nc-1), c1=clamp(Math.floor((lonB+180)/span),0,nc-1);
  const r0=clamp(Math.floor((90-latB)/span),0,nr-1), r1=clamp(Math.floor((90-latA)/span),0,nr-1);
  let n=0, ok=0;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    n++;
    const T=tileGet(gibsTileUrl(layer,time,tms,z,r,c,ext));
    /* the valid part of the tile: longitudes past 180 E and latitudes past 90 S are blank */
    const lw=-180+c*span, le=Math.min(180,lw+span), ln=90-r*span, ls=Math.max(-90,ln-span);
    const fx=(le-lw)/span, fy=(ln-ls)/span;
    const [X0,Y0]=pcToScreen(V,b,lw,ln), [X1,Y1]=pcToScreen(V,b,le,ls);
    if(T.state==='ok'&&T.img){ ok++;
      try{ ctx.drawImage(T.img,0,0,512*fx,512*fy,X0,Y0,X1-X0,Y1-Y0); }catch(e){} }
    else if(z>0){ /* a parent tile stands in while this one loads */
      const zp=z-1, sp=gibsSpan(zp), rp=Math.floor((90-ln)/sp+1e-9), cp=Math.floor((lw+180)/sp+1e-9);
      const P=TILES.get(gibsTileUrl(layer,time,tms,zp,rp,cp,ext));
      if(P&&P.state==='ok'&&P.img){ const plw=-180+cp*sp, pln=90-rp*sp, k=512/sp;
        try{ ctx.drawImage(P.img,(lw-plw)*k,(pln-ln)*k,(le-lw)*k,(ln-ls)*k,X0,Y0,X1-X0,Y1-Y0); }catch(e){} } }
  }
  ctx.restore();
  return {n,ok,z};
}
/* ---- vector layers on the plate carree ---- */
function strokePathPC(ctx,b,V,pts,col,lw,dash){
  ctx.save(); ctx.beginPath(); let started=false, prev=null;
  for(const p of pts){ if(!p||!isFinite(p[0])||!isFinite(p[1])){ started=false; prev=null; continue; }
    if(prev&&Math.abs(p[0]-prev[0])>180) started=false;
    const [X,Y]=pcToScreen(V,b,p[0],p[1]);
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
    prev=p; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}
function fillQuadPC(ctx,b,V,q,col){
  for(let k=0;k<4;k++) for(let m=k+1;m<4;m++) if(Math.abs(q[k][0]-q[m][0])>180) return false;
  ctx.beginPath();
  q.forEach((p,k)=>{ const [X,Y]=pcToScreen(V,b,p[0],p[1]); if(k) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  return true;
}
/* Natural Earth's rings are closed in raw longitude and latitude: the data splits polygons at the
   date line itself and closes Antarctica along the pole edge (180,-90) -> (-180,-90).  Those
   edges bound a fill but are not coast: an outline skips them.  (Known-bad 2026-09-21: breaking
   the path at every longitude jump > 180 cut Antarctica in two and fill() closed each half with a
   chord, a diagonal band across the map and across the basemap behind the globe and the caps.) */
function landEdgeArtificial(p,q){ return (Math.abs(p[0])===180&&p[0]===q[0])||(p[1]<=-89.99&&q[1]<=-89.99); }
function drawLandPC(ctx,b,V,fill,stroke){
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  for(const ring of LAND){
    if(fill){ ctx.beginPath();
      ring.forEach((p,i)=>{ const [X,Y]=pcToScreen(V,b,p[0],p[1]); if(i) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); });
      ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){ ctx.beginPath();
      ring.forEach((p,i)=>{ const [X,Y]=pcToScreen(V,b,p[0],p[1]); if(i&&!landEdgeArtificial(ring[i-1],p)) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); });
      ctx.strokeStyle=stroke; ctx.lineWidth=0.8; ctx.stroke(); }
  }
  ctx.restore();
}
function drawGraticulePC(ctx,b,V,step,col){
  const lonA=V.lon0-b.w/2*V.dpp, lonB=V.lon0+b.w/2*V.dpp, latA=V.lat0-b.h/2*V.dpp, latB=V.lat0+b.h/2*V.dpp;
  const s=step||(V.dpp>0.2?30:V.dpp>0.05?10:V.dpp>0.01?2:0.5);
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  ctx.strokeStyle=col||'rgba(140,160,200,0.18)'; ctx.lineWidth=1;
  for(let lon=Math.ceil(lonA/s)*s;lon<=lonB;lon+=s){ const [X]=pcToScreen(V,b,lon,0); ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke(); }
  for(let lat=Math.ceil(latA/s)*s;lat<=latB;lat+=s){ const [,Y]=pcToScreen(V,b,0,lat); ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke(); }
  ctx.restore();
  return s;
}
/* degree labels along the left and bottom edges (longitudes past the date line wrap) */
function labelGraticulePC(ctx,b,V,s){
  const lonA=V.lon0-b.w/2*V.dpp, lonB=V.lon0+b.w/2*V.dpp, latA=V.lat0-b.h/2*V.dpp, latB=V.lat0+b.h/2*V.dpp;
  const f=v=>(Math.abs(v)<1e-9?'0':fmt(Math.abs(v),s<1?1:0))+'°';
  for(let lon=Math.ceil(lonA/s)*s;lon<=lonB;lon+=s){ const [X]=pcToScreen(V,b,lon,0), L=wrap180(lon);
    labelPut(ctx,f(L)+(L<0&&L>-180?'W':L>0?'E':''),X,b.y1-3,{align:'center',base:'bottom',col:'#6f7789',bounds:b}); }
  for(let lat=Math.ceil(latA/s)*s;lat<=latB;lat+=s){ const [,Y]=pcToScreen(V,b,0,lat);
    labelPut(ctx,f(lat)+(lat<0?'S':lat>0?'N':''),b.x+4,Y,{base:'middle',col:'#6f7789',bounds:box(b.x,b.y+4,b.w,b.h-22)}); }
}
/* ---- colour bar from a GIBS colour map ---- */
function colorbar(ctx,x,y,w,h,CM,title){
  const M=CM.maps.find(m=>m.entries.filter(e=>!e.transparent&&isFinite(e.mid)).length>2);
  if(!M) return null;
  const E=M.entries.filter(e=>!e.transparent&&isFinite(e.mid));
  ctx.save();
  ctx.fillStyle='rgba(10,12,18,.8)'; ctx.fillRect(x-6,y-18,w+12,h+34);
  for(let k=0;k<E.length;k++){ const c=E[k].rgb; ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')'; ctx.fillRect(x+w*k/E.length,y,Math.ceil(w/E.length)+1,h); }
  ctx.font='10px -apple-system, sans-serif'; ctx.fillStyle='#aeb6c6'; ctx.textBaseline='top';
  const lo=E[0].mid, hi=E[E.length-1].mid;
  ctx.textAlign='left'; ctx.fillText(sigf(lo,3),x,y+h+3); ctx.textAlign='right'; ctx.fillText(sigf(hi,3),x+w,y+h+3);
  ctx.textAlign='center'; ctx.fillText(sigf(E[Math.floor(E.length/2)].mid,3),x+w/2,y+h+3);
  ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#cfd4de'; ctx.font='italic 11px Georgia, serif';
  ctx.fillText(plain((title||M.title)+(M.units?' ('+M.units+')':'')),x,y-4);
  ctx.restore();
  keepOut(box(x-6,y-18,w+12,h+34));
  return box(x-6,y-18,w+12,h+34);
}

/* ---- the base map raster: land and sea from the embedded Natural Earth polygons, drawn
   once into an equirectangular canvas (2048 x 1024) that the rasterisers sample ---- */
let BASEMAP=null;
function basemapRGBA(){
  if(BASEMAP!==null) return BASEMAP;
  const w=2048, h=1024, c=makeCanvas(w,h);
  if(!c){ BASEMAP=false; return false; }
  const g=c.getContext('2d');
  g.fillStyle='#0b1628'; g.fillRect(0,0,w,h);
  const V={lon0:0,lat0:0,dpp:360/w}, b=box(0,0,w,h);
  drawLandPC(g,b,V,'#26344c',null);
  g.globalAlpha=0.9; drawLandPC(g,b,V,null,'#6e84a8'); g.globalAlpha=1;
  BASEMAP={w,h,rgba:g.getImageData(0,0,w,h).data};
  return BASEMAP;
}
/* bilinear-free nearest sample of an equirectangular RGBA source covering bbox {w,e,s,n} */
function sampleEq(src,bb,lon,lat,out,o){
  /* nearest sample of an equirectangular RGBA picture covering bb {w,e,s,n}; a bb may run past the
     date line (an unwrapped block): the longitude is shifted by 360 degrees into it */
  let L=lon;
  if(bb.wrap){ /* a whole-world picture: wrap freely */ }
  else { if(L<bb.w) L+=360; else if(L>bb.e) L-=360; }
  let x=(L-bb.w)/(bb.e-bb.w);
  if(bb.wrap) x=pymod(x,1);
  const y=(bb.n-lat)/(bb.n-bb.s);
  if(x<0||x>=1||y<0||y>=1){ out[o+3]=0; return false; }
  const i=(Math.floor(y*src.h)*src.w+Math.floor(x*src.w))*4;
  out[o]=src.rgba[i]; out[o+1]=src.rgba[i+1]; out[o+2]=src.rgba[i+2]; out[o+3]=src.rgba[i+3];
  return out[o+3]>0;
}
const RASTER_CACHE=new Map();
function rasterGlobe(key,Rpx,lat0,lon0,src,bb,sunU,nightDim){
  const hit=RASTER_CACHE.get('globe'); if(hit&&hit.key===key) return hit.img;
  const S=Math.max(2,Math.round(2*Rpx)), c=makeCanvas(S,S); if(!c) return null;
  const g=c.getContext('2d'), I=g.createImageData(S,S), d=I.data, p0=lat0*DEG;
  const sp0=Math.sin(p0), cp0=Math.cos(p0);
  for(let py=0;py<S;py++) for(let px=0;px<S;px++){
    const x=(px+0.5-Rpx)/Rpx, y=(Rpx-(py+0.5))/Rpx, rho2=x*x+y*y, o=4*(py*S+px);
    if(rho2>1){ d[o+3]=0; continue; }
    const cz=Math.sqrt(1-rho2);
    /* the point on the unit sphere in the camera frame -> geodetic-ish lat/lon (sphere) */
    const lat=Math.asin(cz*sp0+y*cp0), lon=lon0*DEG+Math.atan2(x,cz*cp0-y*sp0);
    sampleEq(src,bb,wrap180(lon*RAD),lat*RAD,d,o);
    if(sunU){ const cl=Math.cos(lat), mu=cl*Math.cos(lon)*sunU[0]+cl*Math.sin(lon)*sunU[1]+Math.sin(lat)*sunU[2];
      const k=mu>0.1?1:mu<-0.1?nightDim:nightDim+(1-nightDim)*(mu+0.1)/0.2;
      d[o]*=k; d[o+1]*=k; d[o+2]*=k; }
    if(d[o+3]===0){ d[o]=11; d[o+1]=22; d[o+2]=40; d[o+3]=255; }
  }
  g.putImageData(I,0,0);
  RASTER_CACHE.set('globe',{key,img:c});
  return c;
}
/* the geostationary disk: pixel (px, py) of an S x S image is the scan-angle pair (x, y)
   spanning +/- ext rad; the ground point from the fixed grid; sample the source there */
function geoDiskPixels(S,ext,lam0,src,bb,out){
  let n=0;
  for(let py=0;py<S;py++){
    const y=ext*(1-2*(py+0.5)/S);
    for(let px=0;px<S;px++){
      const x=ext*(2*(px+0.5)/S-1), o=4*(py*S+px), q=fixedGridInverse(x,y,lam0);
      if(!q){ out[o+3]=0; continue; }
      if(sampleEq(src,bb,q.lon,q.lat,out,o)) n++;
      else { out[o]=16; out[o+1]=22; out[o+2]=34; out[o+3]=255; }
    }
  }
  return n;
}
function rasterGeoDisk(key,S,ext,lam0,src,bb){
  const hit=RASTER_CACHE.get('geo'); if(hit&&hit.key===key) return hit.img;
  const c=makeCanvas(S,S); if(!c) return null;
  const g=c.getContext('2d'), I=g.createImageData(S,S);
  geoDiskPixels(S,ext,lam0,src,bb,I.data);
  g.putImageData(I,0,0);
  RASTER_CACHE.set('geo',{key,img:c});
  return c;
}
/* the polar cap for the aurora: orthographic about a pole, out to colatitude capDeg;
   the OVATION probability painted over the base map, night dimmed */
function auroraColor(p){
  if(!(p>=1)) return null;
  const t=clamp(Math.log10(p)/2,0,1);                           /* 1 % -> 0, 100 % -> 1 */
  return t<0.5?[40+140*t*2,220,90,90+140*t*2]:[180+75*(t-0.5)*2,220-150*(t-0.5)*2,90-60*(t-0.5)*2,230];
}
function rasterPolar(key,S,north,capDeg,src,bb,O,sunU){
  const hit=RASTER_CACHE.get('polar'+north); if(hit&&hit.key===key) return hit.img;
  const c=makeCanvas(S,S); if(!c) return null;
  const g=c.getContext('2d'), I=g.createImageData(S,S), d=I.data, R=S/2, sMax=Math.sin(capDeg*DEG);
  for(let py=0;py<S;py++) for(let px=0;px<S;px++){
    const x=(px+0.5-R)/R, y=(R-(py+0.5))/R, rho=Math.hypot(x,y), o=4*(py*S+px);
    if(rho>1){ d[o+3]=0; continue; }
    const colat=Math.asin(clamp(rho*sMax,0,1)), lat=(north?1:-1)*(90-colat*RAD);
    /* north: 0 deg longitude points down the page, east anticlockwise (seen from above) */
    const lon=north?Math.atan2(x,-y)*RAD:Math.atan2(x,y)*RAD;
    sampleEq(src,bb,lon,lat,d,o);
    if(sunU){ const L=lat*DEG, G=lon*DEG, cl=Math.cos(L), mu=cl*Math.cos(G)*sunU[0]+cl*Math.sin(G)*sunU[1]+Math.sin(L)*sunU[2];
      const k=mu>0.1?1:mu<-0.1?0.45:0.45+0.55*(mu+0.1)/0.2; d[o]*=k; d[o+1]*=k; d[o+2]*=k; }
    if(O){ const p=ovationAt(O,lat,lon), a=auroraColor(p);
      if(a){ const al=a[3]/255; d[o]=d[o]*(1-al)+a[0]*al; d[o+1]=d[o+1]*(1-al)+a[1]*al; d[o+2]=d[o+2]*(1-al)+a[2]*al; } }
    d[o+3]=255;

}
/* project a lat/lon onto the polar cap drawn at (cx, cy) with radius R */
function polarXY(lat,lon,north,capDeg,cx,cy,R){
  const colat=(north?90-lat:90+lat)*DEG; if(colat>capDeg*DEG+1e-9) return null;
  const rho=Math.sin(colat)/Math.sin(capDeg*DEG)*R, G=lon*DEG;
  return north?[cx+rho*Math.sin(G),cy+rho*Math.cos(G)]:[cx+rho*Math.sin(G),cy-rho*Math.cos(G)];

/* a world map's box: left of the readout column on a wide stage (the readout floats over the top

   reach at the whole-world zoom) and no taller than the whole world needs (2:1) */
function mapBoxFor(W,H,bottom){ const top=stageTop(), w=Math.max(80,contentRight(W)-16), hA=Math.max(80,H-top-(bottom||0)-8);
  return box(8,top,w,Math.min(hA,Math.max(80,Math.round(w/2)))); }
/* the plate-carree view of a map view (prefix 'm' or 'f'): dpp 0 means "the whole world" */
function mapView(st,p,b){

  if(!(V.dpp>0)){ V.dpp=Math.max(360/b.w,180/b.h); }

}

function drawMosaic(ctx,W,H,M){

  labelGraticulePC(ctx,b,V,gs);

function orbitTrackLayer(satName,desc){

function drawGeo(ctx,W,H,M){

  const cr=contentRight(W);
  const S=Math.max(120,Math.min(cr-40,H-top-44)), cx=20+S/2, cy=top+8+S/2;
  const ext=0.151872;                                    /* the ABI full-disk scan-angle half width (rad), PUG */

    if(src){ const px=Math.round(S*Math.min(2,DPR())), c=rasterGeoDisk(M.L.layer+M.frameTime+px,px,ext,M.G.lam0,src,F.bb);

  const toXY=(lat,lon)=>{ const f=fixedGridForward(lat,lon,M.G.lam0); return f.visible?[cx+f.x/ext*S/2,cy-f.y/ext*S/2]:null; };
  ctx.save(); ctx.beginPath(); ctx.rect(bd.x,bd.y,bd.w,bd.h); ctx.clip();
  const polyGeo=(pts,col,lw,dash)=>{ ctx.beginPath(); let on=false; pts.forEach((p,i)=>{ if(i&&landEdgeArtificial(pts[i-1],p)) on=false; const q=toXY(p[1],p[0]); if(!q){ on=false; return; } if(on) ctx.lineTo(q[0],q[1]); else { ctx.moveTo(q[0],q[1]); on=true; } });
    ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); };
  for(const ring of LAND) polyGeo(ring,drew?'rgba(255,255,255,0.45)':'rgba(140,165,205,0.8)',0.8);
  if(st.gGrid){ for(let lat=-60;lat<=60;lat+=30){ const pts=[]; for(let lon=-180;lon<=180;lon+=2) pts.push([lon,lat]); polyGeo(pts,'rgba(120,200,230,0.28)',0.8); }
    for(let k=-6;k<=6;k++){ const lon=M.G.lam0+15*k, pts=[]; for(let lat=-85;lat<=85;lat+=2) pts.push([lon,lat]); polyGeo(pts,'rgba(120,200,230,0.28)',0.8); } }
  if(st.gVza) for(const z of [30,60,80]) polyGeo(vzaRing(M.G.lam0,z),z===80?'rgba(232,132,58,0.9)':'rgba(232,132,58,0.55)',1,[4,4]);
  if(isFinite(M.subLon)){ const q=toXY(M.subLat,M.subLon); if(q){ ctx.strokeStyle=COL.live; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(q[0]-6,q[1]); ctx.lineTo(q[0]+6,q[1]); ctx.moveTo(q[0],q[1]-6); ctx.lineTo(q[0],q[1]+6); ctx.stroke(); } }
  if(st.gProbe){ const q=toXY(st.gProbe.lat,st.gProbe.lon); if(q) crosshair(ctx,q[0],q[1]); }

  /* the frame strip: which frames are loaded (click to pick one) */

    const S2=NET.status['geo:'+M.L.layer+':'+t];
    ctx.fillStyle=kk===st.gStep?COL.live:v?'rgba(184,236,76,0.7)':S2&&S2.state==='error'?'rgba(232,132,58,0.6)':'#1e2433';
    ctx.fillRect(x+1,fs.y,fs.w/M.times.length-2,fs.h); }
  HIT.push({kind:'geostrip',b:fs,n:M.times.length});
  /* the viewing geometry to scale, where there is room beside the disk */
  const gx=bd.x1+24, gw=cr-gx-12;
  if(gw>=170) drawGeoGeometry(ctx,box(gx,top+40,Math.min(280,gw),Math.min(260,H-top-120)),M);
  if(!F){ const S2=NET.status['geo:'+M.L.layer+':'+M.time];
    caption(ctx,bd.x+10,bd.y+8,S2&&S2.state==='error'?'this frame is not available: '+S2.msg:'loading '+fmtUtc(M.time,true)+'…',S-20,COL.ref); }
}
function vzaRing(lam0,zDeg){
  const R=6371.0, r=FG.H/1000, z=zDeg*DEG, g=z-Math.asin(R*Math.sin(z)/r), pts=[];
  for(let a=0;a<=360;a+=3){ const A=a*DEG, lat=Math.asin(Math.sin(g)*Math.cos(A)), lon=lam0*DEG+Math.atan2(Math.sin(A)*Math.sin(g),Math.cos(g));
    pts.push([wrap180(lon*RAD),lat*RAD]); }
  return pts;
}
function vzaLonOffset(zDeg){ const R=6371.0, r=FG.H/1000, z=zDeg*DEG; return (z-Math.asin(R*Math.sin(z)/r))*RAD; }
function starUrl(G,band){ const b={rgb:'GEOCOLOR',vis:'02',ir:'13',am:'AirMass'}[band]||'GEOCOLOR'; return SRC.star+G.star+'/ABI/FD/'+b+'/678x678.jpg'; }
function drawGeoGeometry(ctx,P,M){

  const ex=cx-P.w*0.3, sx=ex+M.Rgeo*sc;

  const a=Math.asin(6371/M.Rgeo);

  for(const s of [1,-1]){ const tx=ex+6371*sc*Math.sin(a), ty=cy+s*6371*sc*Math.cos(a); ctx.beginPath(); ctx.moveTo(sx,cy); ctx.lineTo(tx,ty); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.font='italic 12px Georgia, serif'; ctx.fillStyle='#aeb6c6'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('the view from '+fmt(M.Rgeo,0)+' km',P.x+10,P.y+8);
  ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#8b93a6';
  ctx.fillText('limb at '+fmt(a*RAD,2)+'° from nadir,',P.x+10,P.y1-40);

/* the ring's zone at a point: 2k + 1 when satellite k (GEO_SATS order) sees it best with a view

function ringBest(lat,lon){ let best=-1, bz=90;
  GEO_SATS.forEach((G,k)=>{ const z=geoViewZenith(lat,lon,G.lam0); if(z<bz){ bz=z; best=k; } });
  return best<0||bz>80?-1:best*2+(bz<70?1:0); }
function drawGeoRing(ctx,W,H,M){

  HIT.push({kind:'map',view:'ring',b,V});

  for(let lat=-80;lat<80;lat+=stepDeg){ const Y0=Math.round(pcToScreen(V,b,0,lat+stepDeg)[1]), Y1=Math.round(pcToScreen(V,b,0,lat)[1]);
    let lon=-180;

      if(c>=0){ const X0=Math.round(pcToScreen(V,b,lon,0)[0]), X1=Math.round(pcToScreen(V,b,Math.min(180,e),0)[0]);

  const cw=Math.min(520,b.w-40), lines=wrapText(ctx,txt,cw,'11.5px -apple-system, sans-serif').length;

/* ---------- 3. fires ---------- */
function drawFires(ctx,W,H,M){

  ctx.font='10px -apple-system, sans-serif'; ctx.fillStyle='#aeb6c6'; ctx.textBaseline='top';
  ctx.textAlign='left'; ctx.fillText('1',kb.x,kb.y+kb.h+2); ctx.textAlign='center'; ctx.fillText('30',kb.x+kb.w/2,kb.y+kb.h+2); ctx.textAlign='right'; ctx.fillText('1000 MW',kb.x1,kb.y+kb.h+2);
  ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.font='italic 11px Georgia, serif'; ctx.fillText('fire radiative power',kb.x,kb.y-3);

function fireColor(t,night){ const c=t<0.5?[255,230*(0.55+0.9*t),60*(1-2*t)]:[255,120*(1-(t-0.5)*1.6)+40,40+180*(t-0.5)*2];

function drawFrpHist(ctx,pb,M){
  const S=M.stats, bins=S.bins, ymax=Math.max(1,...bins.map(q=>q.n));
  const lymax=Math.ceil(Math.log10(ymax))||1;
  axes(ctx,pb,-1,4,0,lymax,{xticks:[-1,0,1,2,3,4],yticks:intTicks(1,Math.max(1,lymax)),xfmt:v=>'10'+supDigits(v),yfmt:v=>'10'+supDigits(v),title:fitTitle(ctx,['FRP distribution','FRP'],pb.w),xlab:fitTitle(ctx,['fire radiative power (MW)','FRP (MW)'],pb.w,'11px -apple-system, sans-serif'),ylab:'detections per bin'});
  ctx.save();
  for(const q of bins){ if(!q.n) continue; const x0=pb.x+pb.w*(Math.log10(q.a)+1)/5, x1=pb.x+pb.w*(Math.log10(q.b)+1)/5, y=pb.y1-pb.h*Math.log10(q.n)/lymax;
    ctx.fillStyle='rgba(255,140,60,0.75)'; ctx.fillRect(x0+0.5,Math.min(y,pb.y1),Math.max(1,x1-x0-1),Math.max(0,pb.y1-y)); }
  ctx.restore();
  if(isFinite(S.alpha)){ /* the fitted power law through the tail, drawn as counts per log bin: n ~ x^(1 - alpha) */
    const xs=[], ys=[], bw=(5/25), n0=S.nTail*(S.alpha-1)*Math.log(10)*bw;
    for(let lx=Math.log10(S.xmin);lx<=4;lx+=0.05){ const x=Math.pow(10,lx); const cnt=n0*Math.pow(x/S.xmin,1-S.alpha); xs.push(lx); ys.push(cnt>0?Math.log10(cnt):NaN); }

}
function supDigits(v){ const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(Math.round(v)).split('').map(c=>m[c]||c).join(''); }
function drawDozier(ctx,pb,M){

/* reported pixel size against the scan angle the ORBIT gives for each detection */
function drawPixelPlot(ctx,pb,M){

/* the coverage panel: below the map when the stage has room, else over its bottom left */

function drawSentinel(ctx,W,H,M){

/* the Copernicus point on the scene: an open diamond with a dark rim, apart from the probe's crosshair */
function pointMark(ctx,X,Y){ ctx.save();

function sceneCanvas(M,comp){

    const r=at('red',i,j), gg=at('green',i,j), bl=at('blue',i,j), n=at('nir',i,j);
    if(!isFinite(r)){ d[o+3]=0; continue; }
    let col;

    else if(comp==='false') col=[gam(n*0.55),gam(r),gam(gg)];

/* ---------- 5. the fleet ---------- */

function buildModel(){

/* ---------- the scene: pointer and wheel ---------- */
function makeScene(canvas){
  const S={W:1000,H:700,st:ST};
  S.model=()=>buildModel();
  S.draw=()=>{ const c=canvas.getContext('2d'); drawView(c,S.W,S.H,buildModel()); };
  S.step=()=>runStep(ST);

    const st=ST;
    if(kind==='down'){
      const h=hitAt(x,y);
      drag={x0:x,y0:y,x,y,h,moved:false,lon0:0,lat0:0};
      if(h&&h.kind==='map'){ drag.lon0=h.V.lon0; drag.lat0=h.V.lat0; }
      if(h&&h.kind==='globe'){ drag.lon0=st.camLon; drag.lat0=st.camLat; }
      return false;
    }
    if(kind==='move'){
      if(!drag) return false;
      const dx=x-drag.x0, dy=y-drag.y0;
      if(!drag.moved&&Math.hypot(dx,dy)<4) return false;

      const h=drag.h;
      if(h&&h.kind==='map'&&h.view!=='ring'){ const p=h.view; st[p+'Lon']=drag.lon0-dx*h.V.dpp; st[p+'Lat']=drag.lat0+dy*h.V.dpp; st[p+'Dpp']=h.V.dpp;
        const V=pcClamp({lon0:st[p+'Lon'],lat0:st[p+'Lat'],dpp:st[p+'Dpp']},h.b); st[p+'Lon']=V.lon0; st[p+'Lat']=V.lat0; return true; }
      if(h&&h.kind==='globe'){ st.camLon=wrap180(drag.lon0-dx/h.R*RAD*0.9); st.camLat=clamp(drag.lat0+dy/h.R*RAD*0.9,-89,89); return true; }

    }

  };

}

  if(h.kind==='map'){ const g=pcFromScreen(h.V,h.b,x,y);
    if(h.view==='m'){ st.mProbe={lat:+g.lat.toFixed(4),lon:+g.lon.toFixed(4)}; return true; }

      go(loadProbeValue('probe:'+O.id+':'+od+':'+st.mProbe.lat.toFixed(4)+','+st.mProbe.lon.toFixed(4),O.layer,layerTime(L,od),L,st.mProbe.lat,st.mProbe.lon)); }
  }
  if(v==='geo'){ const G=GEO_SATS.find(g=>g.id===st.gSat)||GEO_SATS[1], L=geoLayer(G,st.gBand);
    go(loadGeoTimes(G,L));
    const T=geoFrameTimes(G,L);
    if(netValue('gtimes:'+L.layer)||NET.status['frame times']&&NET.status['frame times'].state==='error'){
      /* the chosen frame; while it fails, the next older ones in turn (up to GEO_FALLBACK) */
      for(let k=clamp(st.gStep,0,T.length-1),n=0;k<T.length&&n<=GEO_FALLBACK;k++,n++){ const key='geo:'+L.layer+':'+T[k];
        if(netValue(key)) break; go(loadGeoFrame(G,L,T[k])); const S=NET.status[key]; if(!(S&&S.state==='error')) break; } }
    if(st.gPlay) for(const t of T) go(loadGeoFrame(G,L,t));
    if(L.cmap) go(loadColormap(L.cmap));
    if(st.gStar&&G.star) tileGet(starUrl(G,st.gBand));
    if(st.gProbe&&L.src==='gibs'&&L.cmap){ const t=T[geoShownIndex(L,T,st.gStep)];
      go(loadProbeValue('gprobe:'+L.layer+':'+t+':'+st.gProbe.lat.toFixed(3)+','+st.gProbe.lon.toFixed(3),L.layer,new Date(t).toISOString().slice(0,19)+'Z',{tms:'2km',ext:'png',cmap:L.cmap},st.gProbe.lat,st.gProbe.lon)); } }
  if(v==='fires'){ const P=FIRE_PRODUCTS.find(p=>p.id===st.fProd)||FIRE_PRODUCTS[0]; go(loadMvtWorld(P.layer,fireDate(st),P.tms)); }
  if(v==='sentinel'){ go(loadCdse(st.sLat,st.sLon,30)); const S=loadStac(st.sLat,st.sLon,st.sCloud); go(S);
    if(st.sLoad){ const V=netValue('stac:'+pointKey(st.sLat,st.sLon)+':'+st.sCloud);
      if(V&&V.items.length){ const it=V.items[clamp(st.sItem,0,V.items.length-1)]; for(const b of ['red','green','blue','nir','swir16','swir22','scl']) go(loadCogBand(it,b)); } } }
  if(v==='fleet'&&st.flTexture) go(loadWorldImage('VIIRS_NOAA20_CorrectedReflectance_TrueColor',utcDate(nowMs()-MS_DAY),2048,1024));
  if(v==='sun'){ go(loadSwpc(st.xWin)); go(loadOvation()); tileGet(SRC.swpc+'images/animations/suvi/primary/'+st.suWave+'/latest.png'); }
  return out;
}
/* image loaders (browser only: NET.image) */
async function loadWorldImage(layer,date,w,h){
  return netLoad('tex:'+layer+':'+date,'GIBS whole-world picture',async()=>{
    if(!NET.image) throw new Error('no image loader');
    const img=await NET.image(gibsWmsUrl(layer,date,{w:-180,e:180,s:-90,n:90},w,h,'image/jpeg'));
    return {img,msg:w+'x'+h};
  });
}
async function loadWorldCoverage(layer,date){
  return netLoad('cover:'+layer+':'+date,'GIBS whole-world picture',async()=>{
    if(!NET.image) throw new Error('no image loader');
    const img=await NET.image(gibsWmsUrl(layer,date,{w:-180,e:180,s:-90,n:90},1024,512,'image/jpeg'));
    const px=imageRGBA(img); if(!px) throw new Error('cannot read the picture’s pixels');
    return {img,rows:imageCoverage(px.rgba,px.w,px.h),msg:'1024x512'};
  });
}
/* the value under a point, read from the layer's native-resolution tile */
async function loadProbeValue(key,layer,time,L,lat,lon){
  return netLoad(key,'value readout',async()=>{
    if(!NET.image) throw new Error('no image loader');
    const z=TMS_MAX[L.tms]||5, span=gibsSpan(z), r=Math.floor((90-lat)/span), c=Math.floor((lon+180)/span);
    const img=await NET.image(gibsTileUrl(layer,time,L.tms,z,r,c,L.ext||'png'));
    const px=imageRGBA(img); if(!px) throw new Error('cannot read pixels');
    const x=Math.floor((lon+180-c*span)/span*px.w), y=Math.floor((90-r*span-lat)/span*px.h), o=4*(y*px.w+x);
    const CM=await loadColormap(L.cmap);
    if(px.rgba[o+3]===0) return {value:NaN,how:'transparent',rgb:[0,0,0],units:''};
    const v=colormapValue(CM,px.rgba[o],px.rgba[o+1],px.rgba[o+2]);
    return {value:v.value,how:v.how,dist:v.dist,rgb:[px.rgba[o],px.rgba[o+1],px.rgba[o+2]],units:v.map?v.map.units:'',label:v.entry&&v.entry.label,z,msg:v.how};
  });
}
function loadGeoFrame(G,L,t){
  /* GIBS: the frame is assembled from WMTS tiles (Known-bad 2026-09-18: GIBS's WMS answers
     sub-daily geostationary requests with HTTP 200 and an EMPTY picture as often as not, the same
     frame full at one size and blank at another; the WMTS tiles, Worldview's own path, hold the
     data).  EUMETView: one WMS picture of the disk's box, 1024 px (1100 px answers 502). */
  const iso=new Date(t).toISOString().slice(0,19)+'Z';
  return netLoad('geo:'+L.layer+':'+t,'geo:'+L.layer+':'+t,async()=>{
    if(!NET.image) throw new Error('no image loader');
    if(L.src==='gibs'){
      const tms=(GIBS_LAYERS[L.layer]||{}).tms||'2km', z=1, B=geoTileBlock(G.lam0,z);
      const imgs=await Promise.all(B.tiles.map(q=>NET.image(gibsTileUrl(L.layer,iso,tms,z,q.row,q.col,'png')).catch(()=>null)));
      /* all or nothing: GIBS lists the newest frame before every tile of it exists */
      const miss=imgs.filter(x=>!x).length;
      if(miss) throw new Error(miss+' of '+B.tiles.length+' tiles not published yet');
      const c=makeCanvas(B.w,B.h); if(!c) throw new Error('no canvas');
      const g=c.getContext('2d');
      B.tiles.forEach((q,k)=>{ if(imgs[k]) g.drawImage(imgs[k],q.x,q.y,512,512); });
      let rgba; try{ rgba=g.getImageData(0,0,B.w,B.h).data; }catch(e){ throw new Error('the tiles cannot be read back (CORS)'); }
      let lit=0; for(let i=3;i<rgba.length;i+=4*97) if(rgba[i]>0) lit++;
      if(!lit) throw new Error('the frame is empty');
      return {img:{w:B.w,h:B.h,rgba},bb:B.bb,msg:iso+', '+imgs.filter(Boolean).length+' of '+B.tiles.length+' tiles'};
    }
    const bb={w:G.lam0-81.4,e:G.lam0+81.4,s:-81.4,n:81.4};
    const img=await NET.image(eumetUrl(L.layer,iso,bb,1024,1024)); return {img,bb,msg:iso};
  });
}
function geoTileBlock(lam0,z){
  /* the WMTS tiles (level z, 512 px, 288/2^z degrees) that cover the disk of a satellite at lam0,
     in an UNWRAPPED longitude frame starting at the block's west edge: tiles past the date line
     are placed shifted by 360 degrees, and a tile's blank part beyond 180 E is skipped */
  const span=288/Math.pow(2,z), nr=Math.ceil(180/span), a=lam0-81.4, b=lam0+81.4;
  const cols=[]; let lon=a;
  for(let guard=0;lon<b-1e-9&&guard<16;guard++){ const w=wrap180(lon), col=Math.floor((w+180)/span+1e-12), t0=-180+col*span, t1=Math.min(180,t0+span);
    cols.push({col,start:lon-(w-t0)}); lon=lon+Math.max(1e-6,t1-w); }
  const r0=clamp(Math.floor((90-81.4)/span),0,nr-1), r1=clamp(Math.floor((90+81.4)/span),0,nr-1);
  const west=cols[0].start, tiles=[];
  for(const q of cols) for(let r=r0;r<=r1;r++) tiles.push({col:q.col,row:r,x:Math.round((q.start-west)/span*512),y:(r-r0)*512});
  const east=Math.max(...cols.map(q=>q.start+span));
  const w=Math.round((east-west)/span*512), h=(r1-r0+1)*512;
  return {tiles,w,h,bb:{w:west,e:west+w/512*span,n:90-r0*span,s:90-(r1+1)*span},span};
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, the network hooks, frame loop        *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false, pending=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  /* images through CORS so their pixels can be read; a stalled request gives up after 40 s */
  NET.image=url=>new Promise((res,rej)=>{
    const im=new Image(); let done=false;
    const to=setTimeout(()=>{ if(!done){ done=true; im.src=''; rej(new Error('image timed out')); } },40000);
    im.crossOrigin='anonymous';
    im.onload=()=>{ if(done) return; done=true; clearTimeout(to); res(im); };
    im.onerror=()=>{ if(done) return; done=true; clearTimeout(to); rej(new Error('image failed: '+url.split('?')[0].split('/').slice(-3).join('/'))); };
    im.src=url;
  });
  /* data arriving asks for one redraw (coalesced) */
  NET.onData=()=>{ if(pending) return; pending=true; setTimeout(()=>{ pending=false; dirty=true; refresh(); },60); };

  function setView(k){
    if(st.view!==k){ st.view=k; if(k==='fleet') simReset(); }
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    const fill=L=>{ wrapEl.innerHTML=''; L.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); }); };
    fill(list);
    const rec=[wrapEl,list,key,fill]; CHIPROWS.push(rec);
    return wrapEl;
  }
  function syncChips(){
    for(const rec of CHIPROWS){ const [wrapEl,list,key]=rec;
      [].forEach.call(wrapEl.children,(b,i)=>{ if(list[i]) b.className='chip'+(list[i].id===st[key]?' on':''); }); }
  }
  const btn=(label,fn)=>h('button',{onclick:()=>{ fn(); syncChips(); syncPanel(); dirty=true; refresh(); }},label);

  /* 1. today's Earth */
  const g1=h('div',{class:'grp'},h('h3',null,'the imager'));
  g1.appendChild(chipRow(MOSAIC_SATS,'mSat',()=>{ st.mProbe=null; }));
  g1.appendChild(slider('mDay','the day (UTC)',LIM.mDayMin,0,1,v=>v===0?'today':utcDate(nowMs()+v*MS_DAY).slice(5)));
  const g1b=h('div',{class:'grp'},h('h3',null,'the overlay'));
  g1b.appendChild(chipRow(OVERLAYS,'mOverlay'));
  const g1c=h('div',{class:'grp'},h('h3',null,'the orbit model'));
  g1c.appendChild(h('div',{class:'checks'},checkbox('mSwath','swath edges and equator times'),checkbox('mGlint','predicted sun glint'),
    checkbox('mCover','coverage by latitude: model against the picture'),checkbox('mTrack','NASA’s published ground track'),checkbox('mEvents','open natural events (EONET)')));
  g1c.appendChild(slider('mSzaMax','daylight cut-off',LIM.szaMin,LIM.szaMax,1,v=>'SZA < '+fmt(v,0)+'°'));
  g1c.appendChild(h('div',{class:'btnrow'},btn('whole world',()=>{ st.mDpp=0; st.mLon=0; st.mLat=5; }),btn('clear the probe',()=>{ st.mProbe=null; })));
  const tag1=h('div',{class:'tag'}); g1c.appendChild(tag1);

  /* 2. geostationary */
  const g2=h('div',{class:'grp'},h('h3',null,'the satellite'));
  g2.appendChild(chipRow(GEO_SATS,'gSat',()=>{ st.gStep=0; st.gProbe=null; st.gRing=false; }));
  g2.appendChild(chipRow(GEO_BANDS,'gBand',()=>{ st.gStep=0; }));
  g2.appendChild(slider('gStep','frames back',0,LIM.gSteps-1,1,v=>{ const G=GEO_SATS.find(g=>g.id===st.gSat)||GEO_SATS[1], T=geoFrameTimes(G,geoLayer(G,st.gBand)); return v===0?'latest':T[v]?new Date(T[v]).toISOString().slice(11,16)+' UTC':'—'; }));
  g2.appendChild(h('div',{class:'checks'},checkbox('gPlay','play the last three hours'),checkbox('gGrid','graticule'),checkbox('gVza','view-zenith rings (30°, 60°, 80°)'),
    checkbox('gStar','NOAA’s own full disk on top (GOES only)'),checkbox('gRing','the whole ring')));
  const tag2=h('div',{class:'tag'}); g2.appendChild(tag2);

  /* 3. fires */
  const g3=h('div',{class:'grp'},h('h3',null,'the product'));
  g3.appendChild(chipRow(FIRE_PRODUCTS,'fProd',()=>{ st.fProbe=null; }));
  g3.appendChild(slider('fDay','the day (UTC)',LIM.fDayMin,0,1,v=>v===0?'today':utcDate(nowMs()+v*MS_DAY).slice(5)));
  g3.appendChild(chipRow([{id:'both',name:'day and night'},{id:'day',name:'day'},{id:'night',name:'night'}],'fDN'));
  g3.appendChild(chipRow([{id:'all',name:'all'},{id:'nominal',name:'nominal +'},{id:'high',name:'high'}],'fConf'));
  g3.appendChild(slider('fTb','background T',LIM.tbMin,LIM.tbMax,1,v=>fmt(v,0)+' K'));
  g3.appendChild(h('div',{class:'btnrow'},btn('whole world',()=>{ st.fDpp=0; st.fLon=0; st.fLat=5; }),btn('clear the pick',()=>{ st.fProbe=null; })));
  const tag3=h('div',{class:'tag'}); g3.appendChild(tag3);

  /* 4. Copernicus */
  const g4=h('div',{class:'grp'},h('h3',null,'the place'));
  g4.appendChild(chipRow(SENTINEL_PLACES,'sPlace',o=>{ st.sLat=o.lat; st.sLon=o.lon; st.sItem=0; st.sProbe=null; st.sLoad=false; coordShown=''; }));
  /* the point typed or pasted: decimal degrees or degrees-minutes-seconds, as GPS apps and maps
     give them (parseLatLon); Enter or "go" applies it, and the line under it says what was read */
  const coordIn=h('input',{type:'text',spellcheck:'false',autocomplete:'off','aria-label':'latitude, longitude',placeholder:'lat, lon  e.g. 30.0444, 31.2357'});
  const coordMsg=h('div',{class:'tag'});
  let coordShown='';
  function applyCoord(){ const q=parseLatLon(coordIn.value);
    if(q.err){ coordIn.className='bad'; coordMsg.innerHTML='<span class="r">not read: '+q.err+'</span>'; return; }
    coordIn.className=''; st.sLat=q.lat; st.sLon=q.lon; st.sPlace='own'; st.sItem=0; st.sProbe=null; st.sLoad=false;
    coordMsg.innerHTML='read as '+fmtDMS(q.lat,'N','S')+', '+fmtDMS(q.lon,'E','W');
    syncChips(); syncPanel(); dirty=true; refresh(); }
  coordIn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); applyCoord(); } });
  g4.appendChild(h('div',{class:'coordrow'},coordIn,h('button',{onclick:applyCoord},'go')));
  g4.appendChild(coordMsg);
  g4.appendChild(chipRow(S2_COMPOSITES,'sComp'));
  g4.appendChild(slider('sCloud','cloud under',LIM.cloudMin,LIM.cloudMax,5,v=>fmt(v,0)+' %',()=>{ st.sItem=0; st.sLoad=false; }));
  g4.appendChild(h('div',{class:'btnrow'},btn('load the scene',()=>{ st.sLoad=true; }),btn('older',()=>{ st.sItem++; st.sProbe=null; }),btn('newer',()=>{ st.sItem=Math.max(0,st.sItem-1); st.sProbe=null; })));
  const tag4=h('div',{class:'tag'}); g4.appendChild(tag4);

  /* 5. the fleet */
  const g5=h('div',{class:'grp'},h('h3',null,'the fleet'));
  g5.appendChild(chipRow(FLEET_GROUPS,'flGroup',()=>{ fillSats(); }));
  const satRow=chipRow(fleetList(st).map(f=>({id:f.name,name:f.label})),'flSel');
  const satRec=CHIPROWS[CHIPROWS.length-1];
  function fillSats(){ const L=fleetList(st).map(f=>({id:f.name,name:f.label})); satRec[1]=L; satRec[3](L); if(!L.find(o=>o.id===st.flSel)&&L.length) st.flSel=L[0].id; }
  g5.appendChild(satRow);
  g5.appendChild(chipRow(SPEEDS,'flSpeed',()=>{ if(st.flSpeed===1) SIM.t=nowMs(); }));
  g5.appendChild(h('div',{class:'checks'},checkbox('flSwath','instrument swaths'),checkbox('flOrbit','the selected orbit'),checkbox('flLabels','labels'),checkbox('flTexture','yesterday’s VIIRS picture on the globe')));
  g5.appendChild(h('div',{class:'btnrow'},btn('now',()=>{ SIM.t=nowMs(); }),btn('face the selection',()=>{ const e=satEcef(fleetSat(st.flSel),SIM.t); if(e){ const g=ecefToGeo(e.r[0],e.r[1],e.r[2]); st.camLat=clamp(g.lat*RAD,-80,80); st.camLon=g.lon*RAD; } })));
  const tag5=h('div',{class:'tag'}); g5.appendChild(tag5);

  /* 6. space weather */
  const g6=h('div',{class:'grp'},h('h3',null,'the Sun and the aurora'));
  g6.appendChild(chipRow(SUVI_WAVES,'suWave'));
  g6.appendChild(chipRow(XWINDOWS,'xWin'));
  g6.appendChild(slider('auAlt','aurora height',LIM.auAltMin,LIM.auAltMax,5,v=>fmt(v,0)+' km'));
  g6.appendChild(slider('auProb','oval edge at',1,50,1,v=>fmt(v,0)+' %'));
  g6.appendChild(h('div',{class:'checks'},checkbox('auObs','my place (click a cap)')));
  const tag6=h('div',{class:'tag'}); g6.appendChild(tag6);

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    btn('reset this view',()=>{ for(const k of VIEW_KEYS[st.view]) st[k]=DEFAULTS[k]; simReset(); if(st.view==='fleet') fillSats(); })));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:SOURCES_LINE}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),h('div',{id:'phys'}));
  [g1,g1b,g1c,g2,g3,g4,g5,g6,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncPanel(){
    const v=st.view;
    g1.hidden=g1b.hidden=g1c.hidden=(v!=='mosaic'); g2.hidden=(v!=='geo'); g3.hidden=(v!=='fires');
    g4.hidden=(v!=='sentinel'); g5.hidden=(v!=='fleet'); g6.hidden=(v!=='sun');
    for(const k in rows) rows[k].sync();
    /* the box follows the point when the point moves some other way (a chip, the locator), never
       while it is being typed in */
    const pk=pointKey(st.sLat,st.sLon); if(pk!==coordShown){ coordShown=pk; coordIn.value=st.sLat.toFixed(5)+', '+st.sLon.toFixed(5); coordIn.className=''; }
    tag1.innerHTML='drag to pan · wheel to zoom · click for the pass that imaged a point';
    tag2.innerHTML=st.gRing?'the five satellites together':'click the disk for the view geometry'+(geoLayer(GEO_SATS.find(g=>g.id===st.gSat)||GEO_SATS[1],st.gBand).cmap?' and the brightness temperature':'');
    tag3.innerHTML='click a detection for its sub-pixel fire';
    tag4.innerHTML=st.sLoad?'bands: '+['red','green','blue','nir','swir16','swir22','scl'].filter(b=>{ const M=netValue('stac:'+pointKey(st.sLat,st.sLon)+':'+st.sCloud); const it=M&&M.items[clamp(st.sItem,0,M.items.length-1)]; return it&&netValue('cog:'+it.id+':'+b); }).length+' of 7 loaded':'scene '+(st.sItem+1)+' of the archive list, not loaded yet';
    tag5.innerHTML='drag the globe · click a satellite · click the Earth to set your place';
    tag6.innerHTML='click a polar cap to set your place';
    keysTag.innerHTML='1&ndash;6 switch views';
  }

  function refresh(){
    try{
      ensureData(st);
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='mosaic'||v==='fires'?'drag to pan · wheel to zoom · click to probe · 1–6 switch views'
        :v==='fleet'?'drag to turn the globe · click a satellite or a place · 1–6 switch views':'click to probe · 1–6 switch views';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    S.pointer('down',e.clientX-r.left,e.clientY-r.top);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; S.draw(); }
  });
  const up=e=>{ canvas.classList.remove('dragging'); const r=canvas.getBoundingClientRect();
    if(S.pointer('up',e?e.clientX-r.left:0,e?e.clientY-r.top:0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',()=>up(null));
  canvas.addEventListener('wheel',e=>{
    const r=canvas.getBoundingClientRect();
    if(S.wheel(e.clientX-r.left,e.clientY-r.top,e.deltaY)){ e.preventDefault(); dirty=true; refresh(); }
  },{passive:false});

  window.addEventListener('keydown',e=>{

  let last=performance.now(), lastRefresh=0;
  function frameLoop(now){
    const dt=Math.min(200,now-last); last=now;
    const advanced=runStep(st,dt);
    if(advanced||dirty){
      dirty=false;

        if(advanced&&now-lastRefresh<250) S.draw(); else { lastRefresh=now; refresh(); }

    }

  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);

  setInterval(()=>{ if(st.view!=='fleet'){ dirty=true; } },60000);

}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];

  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],

  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; }, ellipse(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){}, drawImage(){ ops.push({op:'image'}); },
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap','imageSmoothingEnabled']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});

}
