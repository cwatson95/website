<title>SBS gas-law manifold &mdash; the laws as faces of one sheet</title>
<!--
  sbs_gaslaw_manifold.html - derive_gaslaws.tex drawn as the classical
  P-V-T surface is drawn: the state manifold of stimulated Brillouin
  scattering in the (state yhat, shift s, width w) cube, where each named
  law is the view through one face -- Charles/sound law (yhat,s), Boyle/
  narrowing law (yhat,w), the gas law itself (s,w, state eliminated) --
  and, in the excess coordinates (X = yhat^2, B, A), the same object
  flattens into a plane fan through the origin: every law a straight
  line, every kinetic member an eigen-ray of slope kappa = (2Dx/C)^2
  (the ellipse member 2Dx_kin is exactly the 45-degree ray, kappa = 1).
  A continuous morph connects the two charts; Law IV rides the sheet as
  the colour field Phi(yhat).

  WHAT IS EXACT: Laws I-III as identities (drawn from the stable form
  B = yhat^2; the measured form (2s^2-1)/(G-2s^2) is reserved for data
  rows, and the G -> 1 conditioning blow-up is stated, not hidden); the
  corners s(0) = 1/sqrt2, w(0) = Dx_kin, s(inf) = sqrt(G/2); the Boyle
  and Charles limit forms and their constants (C/2 and G-1); kappa of
  every member; Phi's two corners (sum-rule theorems).  Dx_kin = 1.1332
  is the 4-dp programme constant (exact lobe FWHM 1.1331508).

  WHAT IS TABULATED: the interior of Phi(yhat) (exact conserving Pr=2/3
  member, 17 nodes, log-interpolated, linearly blended to the corner
  below its first node yhat = 0.15); the gas rows (TABL/TABB/TABC of
  sbs_parent_law.html, generated by make_gaslaws_tables.py /
  make_bundle_tables.py / analyze_classes.py, ALL PASS); the per-row
  inversion constants C_rec / Psi_rec (parent_law Table II).

  WHAT IS NOT MODELLED: nothing here fits anything.  The sheet is the
  law at slider constants; data either sit on it or do not -- Kr's
  widths drift off the Boltzmann member (the width anomaly, stated
  where drawn), Ar's flat tabulated shifts put its B off-sheet at low
  P (read-off resolution), SF6 sits at the G -> 1 degeneracy where the
  state is unreadable from the shift (drawn hollow, conditioning said
  on canvas).  N2 and Ar have NO width data: they are drawn as fibres
  (vertical lines in w), not points -- Law I is testable on them, Law
  II is not.

  Physics/data: derive_gaslaws.tex + derive_gaslaws.py (21 checks);
  tables verbatim from sbs_parent_law.html (2026-08-07); Mironov 266-nm
  Kr/N2/Ar rows, Offenberger 248-nm SF6 rows, as carried in
  lib/sbs_gain.py CF_TABLES.  Pins re-derived in scipy (derive_manifold
  session script, 24 checks ALL PASS) and asserted in selfTest.
-->

'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);

    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* ================================================================== *

 *  — same camera as lattice.html / steam_carnot_cycle.html            *

const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

  const kr=GASD.Kr.rows.filter(r=>r.A!==null);
  const boyle=kr.map(r=>({P:r.P, prod:(r.wm/GASD.Kr.nuref)*r.yh,
                          crec:cRec(r.wm/GASD.Kr.nuref,r.yh)}));
  const zrows=kr.map(r=>({P:r.P, Z:r.Z, prov:r.prov}));
  const s0=Math.SQRT1_2, sInf=Math.sqrt(st.G/2);
  const data=dataFor(st);
  /* Only the CHIP gas's rows are drawn on the sheet.  A row's shift
     follows its OWN gas's Gamma, so putting N2's rows on a sheet built at
     Kr's Gamma would show a mismatch that is nothing but the wrong sheet.
     With the sliders free of any gas (st.gas === ''), no rows are drawn. */
  const shown=st.gas?data.filter(d=>d.id===st.gas):[];
  const nClip=shown.filter(d=>!d.inX).length;
  /* Law III residual through the MEASURED forms (A from w, B from s) —
     the cancellation floor the eqbar quotes.  The identity-form mesh is
     exact by construction, so this probe is the honest one. */
  let res3=0;
  for(const yv of [0.3,1,2.5,Math.min(6,st.ymax)])
    for(const Cv of [CLO,7/3,2*DXKIN,CHI])
      res3=Math.max(res3,Math.abs(Aof(wOf(yv,Cv))
                                  -kap(Cv)*Bof(sOf(yv,st.G),st.G)));
  return {st,R,ys,Cs,rows,dense,data,shown,nClip,
          kapC, kapI:KAPI, gs, boyle, zrows, inv:INV,
          s0, sInf, cond:condOf(1.0,st.G),
          pk:gs?pkOf(st.gas):null, res3};
}

/* ================================================================== *
 *  3-D core — one renderer serves the manifold (t = 0), the            *
 *  eigen-sheet (t = 1), the flattening (t = slider) and the gain       *
 *  field (t = 0, colour = Phi).  Painter's algorithm, opaque quads     *
 *  expanded about their centroid (seam guard, Known-bad list).         *
 * ================================================================== */
function path3(ctx,cam,B,pts,col,lw,dash){
  ctx.save(); ctx.beginPath();
  let started=false;
  for(const p of pts){
    const q=p&&project(cam,B,p);
    if(!q){ started=false; continue; }
    if(!started){ ctx.moveTo(q.x,q.y); started=true; } else ctx.lineTo(q.x,q.y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.5;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}
/* ------------------------------------------------------------------ *
 *  clipping to the cube.  Two rules from this project's history:      *
 *  a reference curve drawn from axis limits must be CLIPPED to the    *
 *  box (not drawn past it), and a surface must be clipped rather than *
 *  have its out-of-box quads DROPPED — dropping them leaves a         *
 *  staircase where steam_carnot_cycle.html wants a clean edge.        *
 * ------------------------------------------------------------------ */
function clipSeg3(a,b){                 /* Liang-Barsky against [-1,1]^3 */
  let t0=0,t1=1;
  const d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];
  for(let k=0;k<3;k++)
    for(const sg of [-1,1]){
      const p=sg*d[k], q=1-sg*a[k];     /* sg*(a+t d) <= 1 */
      if(p===0){ if(q<0) return null; continue; }
      const r=q/p;
      if(p<0){ if(r>t1) return null; if(r>t0) t0=r; }
      else   { if(r<t0) return null; if(r<t1) t1=r; }
    }
  return [[a[0]+t0*d[0],a[1]+t0*d[1],a[2]+t0*d[2]],
          [a[0]+t1*d[0],a[1]+t1*d[1],a[2]+t1*d[2]]];
}
function path3c(ctx,cam,B,pts,col,lw,dash){   /* the clipped path3 */
  for(let i=0;i<pts.length-1;i++){
    if(!pts[i]||!pts[i+1]) continue;
    const s=clipSeg3(pts[i],pts[i+1]);
    if(s) path3(ctx,cam,B,s,col,lw,dash);
  }
}
function clipPoly3(poly){                     /* Sutherland-Hodgman, 6 planes */
  let P=poly;
  for(let k=0;k<3;k++)
    for(const sg of [-1,1]){
      if(!P.length) return P;
      const Q=[], dist=p=>1-sg*p[k];
      for(let i=0;i<P.length;i++){
        const a=P[i], b=P[(i+1)%P.length];
        const da=dist(a), db=dist(b);
        if(da>=0) Q.push(a);
        if((da>=0)!==(db>=0)){
          const t=da/(da-db);
          Q.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]);
        }
      }
      P=Q;
    }
  return P;
}
/* camera homes + the three face snaps (dolly-zoom to near-ortho) */
const HOME_FOV=0.78, FACE_FOV=0.012, HOME_DIST=3.7;
/* Vertical room reserved under the cube for the captions.  Setting
   cam.H = H - 2*CAP_BOT both LIFTS the projection centre by CAP_BOT and
   shrinks the focal length with it, so the box cannot run its tick
   labels off the bottom edge or into the caption block. */
const CAP_BOT=92;
const GCOL={Kr:'#f2f4f8', Ar:'#5ac8e0', N2:'#b8ec4c', SF6:'#cd35c4'};
const CAM_HOMES={mani:{theta:-58*DEG,phi:22*DEG},
                 eigen:{theta:-26*DEG,phi:16*DEG},
                 morph:{theta:-58*DEG,phi:22*DEG},
                 gain:{theta:-58*DEG,phi:22*DEG},
                 surf:{theta:-52*DEG,phi:26*DEG}};
/* The SAME three orientations show DIFFERENT physics on the observable
   chart, because its axes are (s, w, g) rather than (yhat, s, w).  Looking
   down g gives the floor -- which IS Law III, the fan of rays -- and the
   other two are the gain profiles.  Same camera, different face. */
const FACES3_SRF={boyle:'shift-gain profile (s, g)',
                  charles:'the gas-law floor (s, w) — Law III, the fan',
                  gaslaw:'width-gain profile (w, g)'};
function faceLab(which,mode){
  return (mode==='surf'&&FACES3_SRF[which])?FACES3_SRF[which]:FACES3[which].lab;
}
const FACES3={boyle:  {theta:-90*DEG, phi:0.5*DEG,  lab:'Boyle face (ŷ, w)'},
              charles:{theta:-90*DEG, phi:89.4*DEG, lab:'Charles face (ŷ, s)'},
              gaslaw: {theta:0,       phi:0.5*DEG,  lab:'gas-law face (s, w)'}};
/* keep the apparent size fixed while narrowing the fov: dolly-zoom */
function distForFov(fov){
  return HOME_DIST*Math.tan(HOME_FOV/2)/Math.tan(fov/2);
}
function memberRole(C){ return (C-CLO)/(CHI-CLO); }
function draw3D(ctx,W,H,M,S){
  const st=M.st, R=M.R;
  const mode=st.view;
  const t=mode==='eigen'?1:mode==='morph'?st.t:0;
  const cam=S.cams[mode];
  cam.W=W-250;                             // centre left of the readout
  cam.H=H-2*CAP_BOT;                       // and above the caption block
  const B=camBasis(cam);
  /* the observable chart has no state axis, so it takes no part in the
     obs <-> exc morph: it is its own chart, reached directly */
  const surf=(mode==='surf');
  const P3=surf?(v=>toBox(v.srf,R,'srf')):(v=>morphPos(v,R,t));
  const gainMode=(mode==='gain');
  // ---- the box, far edges first --------------------------------------
  const C1=[-1,1], edges=[];
  for(const a of C1)for(const b of C1){
    edges.push([[a,b,-1],[a,b,1]]); edges.push([[a,-1,b],[a,1,b]]);
    edges.push([[-1,a,b],[1,a,b]]);
  }
  edges.sort((e,f)=>{
    const me=v3.mul(v3.add(e[0],e[1]),0.5), mf=v3.mul(v3.add(f[0],f[1]),0.5);
    return v3.len(v3.sub(mf,B.eye))-v3.len(v3.sub(me,B.eye));
  });
  for(const e of edges) path3(ctx,cam,B,e,'#1c2130',1);
  // ---- ticks + axis labels, placed in SCREEN space -------------------
  // A box-space offset is not a reliable way to push a label clear of its
  // axis: on a snapped face the offset direction can point straight along
  // the view axis, where it separates nothing — that piled every shift
  // tick onto one spot on the Boyle face.  So project first, then offset
  // in PIXELS away from the projected box centre.
  const ctr=project(cam,B,[0,0,0]);
  /* One label registry for the whole 3-D pass, filled in priority order:
     axis names, the corner annotation, tick numbers, then the data row
     labels.  A label that would land on one already placed is DROPPED
     rather than overprinted — at the origin the two charts' zeros
     genuinely coincide, and two numbers on one spot read as a smear.
     Dropped ROW labels are counted and reported in a caption (a silent
     cap reads as "nothing was omitted"). */
  const placed=[]; let dropped=0;
  function fsOf(fnt){ const m=/(\d+(?:\.\d+)?)px/.exec(fnt||'');
    return m?parseFloat(m[1]):10; }
  function place(x,y,txtS,fs){
    const hw=0.28*fs*plain(txtS).length+3, hh=0.62*fs;
    for(const p of placed)
      if(Math.abs(p.x-x)<=hw+p.hw&&Math.abs(p.y-y)<=hh+p.hh) return false;
    placed.push({x,y,hw,hh});
    return true;
  }
  function screenLab(p3,txtS,al,px,fnt,col){
    const q=project(cam,B,p3);
    if(!q||!ctr) return false;
    let ux=q.x-ctr.x, uy=q.y-ctr.y;
    const L=Math.sqrt(ux*ux+uy*uy)||1;
    const X=q.x+px*ux/L, Y=q.y+px*uy/L;
    const f=fnt||'10px -apple-system,sans-serif';
    if(!place(X,Y,txtS,fsOf(f))) return false;
    ctx.globalAlpha=al; ctx.fillStyle=col||CMUT;
    ctx.font=f;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(plain(txtS),X,Y);
    ctx.globalAlpha=1;
    return true;
  }
  /* an axis seen edge-on cannot carry numbers — measure its pixel span */
  function axisSpan(a,b){
    const p=project(cam,B,a), q=project(cam,B,b);
    if(!p||!q) return 0;
    return Math.sqrt(Math.pow(p.x-q.x,2)+Math.pow(p.y-q.y,2));
  }
  const spanX=axisSpan([-1,-1,-1],[1,-1,-1]);
  const spanY=axisSpan([1,-1,-1],[1,1,-1]);
  const spanZ=axisSpan([-1,-1,-1],[-1,-1,1]);
  const MINSPAN=45;                        // below this, labels would pile up
  const anm=surf?['s','w','g']:['ŷ','s','w'];
  const edgeOn=[spanX<MINSPAN?anm[0]:null, spanY<MINSPAN?anm[1]:null,
                spanZ<MINSPAN?anm[2]:null].filter(Boolean);
  /* Numbers belong to a chart, and at intermediate t the geometry is a
     BLEND of two charts, where a point's position corresponds to no
     single coordinate value.  So numbers are drawn only near the two
     ends, and the axis name carries an arrow in between. */
  const numAl=ch=>surf?(ch==='srf'?1:0)
    :ch==='obs'?clamp((0.08-t)/0.08,0,1)
    :ch==='exc'?clamp((t-0.92)/0.08,0,1):0;
  const tickset=ch=>{
    const al=numAl(ch);
    if(al<0.04) return;
    const r=R[ch], dp=ch==='obs'?[1,2,2]:ch==='srf'?[2,2,2]:[0,0,0];
    if(spanX>=MINSPAN) for(const xv of ticksFor(r.x[0],r.x[1],5)){
      const x=nrm(xv,r.x[0],r.x[1]); if(x<-1||x>1) continue;
      path3(ctx,cam,B,[[x,-1,-1],[x,-1.05,-1]],'#39404f',1);
      screenLab([x,-1.05,-1],fmt(xv,dp[0]),al,13);
    }
    if(spanY>=MINSPAN) for(const yv of ticksFor(r.y[0],r.y[1],4)){
      const y=nrm(yv,r.y[0],r.y[1]); if(y<-1||y>1) continue;
      path3(ctx,cam,B,[[1,y,-1],[1.05,y,-1]],'#39404f',1);
      screenLab([1.05,y,-1],fmt(yv,dp[1]),al,15);
    }
    if(spanZ>=MINSPAN) for(const zv of ticksFor(r.z[0],r.z[1],4)){
      const z=nrm(zv,r.z[0],r.z[1]); if(z<-1||z>1) continue;
      path3(ctx,cam,B,[[-1,-1,z],[-1.04,-1.04,z]],'#39404f',1);
      screenLab([-1.04,-1.04,z],fmt(zv,dp[2]),al,15);
    }
  };
  {   /* the axis names go FIRST — they outrank tick numbers for space, and
         there is only ever one set of them, never two fading through */
    const blend=(!surf&&t>0.08&&t<0.92);
    const nm=surf?[R.srf.xl,R.srf.yl,R.srf.zl]
      :blend?['ŷ → ŷ²','s → B','w → A']
      :(t<=0.08?[R.obs.xl,R.obs.yl,R.obs.zl]:[R.exc.xl,R.exc.yl,R.exc.zl]);
    const F='italic 12.5px Georgia, serif';
    screenLab([0,-1,-1],nm[0],1,34,F,'#8b93a6');
    screenLab([1,0,-1],nm[1],1,40,F,'#8b93a6');
    screenLab([-1,-1,0.15],nm[2],1,40,F,'#8b93a6');
  }
  tickset('obs'); tickset('exc'); tickset('srf');
  // ---- floor shadows --------------------------------------------------
  const memberPts=C=>M.dense(C).map(P3);
  if(st.showShadows){
    const flo=p=>[p[0],p[1],-1];
    path3c(ctx,cam,B,memberPts(st.C).map(flo),rgba('#b8ec4c',0.28),1.1);
    if(st.showData){
      const dp=M.shown.filter(d=>d.inX&&!d.fiber).map(d=>flo(P3(d)));
      path3c(ctx,cam,B,dp,rgba('#f2f4f8',0.30),1.0,[2,3]);
    }
  }
  // ---- the sheet (painter, opaque, centroid-expanded) -----------------
  const quads=[];
  for(let i=0;i<M.rows.length-1;i++)
    for(let j=0;j<M.Cs.length-1;j++){
      const vs=[M.rows[i][j],M.rows[i][j+1],M.rows[i+1][j+1],M.rows[i+1][j]];
      const q=vs.map(P3);
      /* the NORMAL comes from the unclipped quad (it is well defined even
         when part of the quad is outside); the DRAWN polygon is clipped */
      const n=v3.norm(v3.cross(v3.sub(q[1],q[0]),v3.sub(q[3],q[0])));
      const poly=clipPoly3(q);
      if(poly.length<3) continue;
      let c=[0,0,0];
      for(const p of poly){ c[0]+=p[0]/poly.length; c[1]+=p[1]/poly.length;
                            c[2]+=p[2]/poly.length; }
      const role=gainMode
        ?clamp((phiOf(vs[0].yh)-0.6)/(PHI0-0.6),0,1)
        :memberRole(vs[0].C);
      quads.push({poly,c,n,role,d:v3.len(v3.sub(c,B.eye))});
    }
  quads.sort((a,b)=>b.d-a.d);
  const L=v3.norm([0.42,0.3,0.85]);
  for(const Q of quads){
    const pts=[]; let ok2=true;
    for(const p of Q.poly){ const s2=project(cam,B,p);
      if(!s2){ ok2=false; break; } pts.push(s2); }
    if(!ok2||pts.length<3) continue;
    let cx=0, cy=0;
    for(const p of pts){ cx+=p.x/pts.length; cy+=p.y/pts.length; }
    const lam=Math.abs(v3.dot(Q.n,L));
    ctx.fillStyle=shade(neonCss(Q.role),0.26+0.5*lam);
    ctx.beginPath();
    for(let k2=0;k2<pts.length;k2++){
      /* expand about the centroid: abutting quads leave a sub-pixel gap
         that antialiases into a seam (Known-bad).  Safe only because the
         fills are OPAQUE — under alpha the overlap would double-composite. */
      const X=cx+(pts[k2].x-cx)*1.035, Y=cy+(pts[k2].y-cy)*1.035;
      if(k2===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath(); ctx.fill();
  }
  // ---- members / eigen-rays ------------------------------------------
  if(st.showRays){
    for(const Cv of M.Cs)
      path3c(ctx,cam,B,memberPts(Cv),'rgba(7, 11, 24,0.35)',0.8);
    path3c(ctx,cam,B,memberPts(7/3),'rgba(242,244,248,0.75)',1.1);
    path3c(ctx,cam,B,memberPts(2*DXKIN),'#e8843a',1.5,[6,4]);
    path3c(ctx,cam,B,memberPts(2.950029),'#cd35c4',1.2,[2,4]);
    if(st.gas==='N2'&&GASD.N2.Cref)
      path3c(ctx,cam,B,M.dense(GASD.N2.Cref).map(P3),
             'rgba(139,147,166,0.8)',1.1,[8,4]);
  }
  if(st.C>=CLO&&st.C<=CHI)
    path3c(ctx,cam,B,memberPts(st.C),'#b8ec4c',2.2);
  // ---- the conservation corner ---------------------------------------
  {
    const v0=vertAt(0,(CLO+CHI)/2,st.G,st.Psi);
    const q=project(cam,B,P3(v0));
    if(q){
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(q.x,q.y,3.8,0,TAU); ctx.fill();
      ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
      const txt=surf
        ?'apex — s = 1/√2, w = Δx_kin, g = Ψ√(π/2e): all three are theorems'
        :t>0.92?'conservation corner (0, 0, 0)'
        :t>0.08?'the shared corner — both charts anchor here'
        :'Doppler corner: s = 1/√2, w = Δx_kin (theorems)';
      /* placed AWAY from the box centre, like the axis labels, so it never
         lies along the sheet it is annotating; then below, then above */
      const fs=10, half=0.28*fs*plain(txt).length+4;
      let ux=q.x-(ctr?ctr.x:q.x), uy=q.y-(ctr?ctr.y:q.y);
      const L2=Math.sqrt(ux*ux+uy*uy)||1;
      let X=q.x+(half+8)*ux/L2, Y=q.y+16*uy/L2;
      /* the readout panel owns the right 250 px (cam.W = W-250).  For
         Gamma < 1 the apex sits at the RIGHT edge of the shift axis, so the
         push-away-from-centre direction drives this label straight under the
         panel -- clamp it back into the camera's own viewport. */
      X=clamp(X,half+6,cam.W-half-6);
      if(!place(X,Y,txt,fs)){
        Y=q.y+16; if(!place(X,Y,txt,fs)){ Y=q.y-16; place(X,Y,txt,fs); } }
      ctx.fillStyle='#aeb6c6'; ctx.font=fs+'px -apple-system,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(plain(txt),X,Y);
    }
  }
  // ---- data: points, whiskers, fibres --------------------------------
  if(st.showData){
    for(const d of M.shown){
      if(!d.inX) continue;
      const col=GCOL[d.id];
      if(d.fiber){
        if(!st.showFibers) continue;
        if(surf){
          /* With no width there is no floor point AND no height, and the two
             are not independent: g w = Psi Phi(yhat) s.  So the fibre of a
             width-less gas is that HYPERBOLA at fixed s, not a straight
             segment -- drawing it straight would assert a gain the
             measurement does not carry. */
          const pts=[], K=st.Psi*phiOf(d.yh)*d.obs[1];
          for(let i2=0;i2<=28;i2++){
            const wv=lerp(0.10,R.srf.y[1],i2/28);
            pts.push(toBox([d.obs[1],wv,K/wv],R,'srf'));
          }
          path3c(ctx,cam,B,pts,rgba(col,0.5),1.0,[2,4]);
          continue;
        }
        const a=morphPos({obs:[d.obs[0],d.obs[1],R.obs.z[0]],
                          exc:[d.exc[0],d.exc[1],R.exc.z[0]]},R,t);
        const b=morphPos({obs:[d.obs[0],d.obs[1],R.obs.z[1]],
                          exc:[d.exc[0],d.exc[1],R.exc.z[1]]},R,t);
        path3c(ctx,cam,B,[a,b],rgba(col,0.5),1.0,[2,4]);
        continue;
      }
      const p=P3(d);
      if(!inBox(p,1.06)) continue;
      const q=project(cam,B,p);
      if(!q) continue;
      /* the whiskers are built by perturbing obs/exc coordinates; on the
         observable chart the height moves with the width too, so they are
         omitted there rather than drawn wrong (said in the readout). */
      if(d.err&&!surf){                     // Kr whiskers, both charts
        const wsk=(idx,lo,hi)=>{
          const o=d.obs.slice(), e=d.exc.slice();
          o[idx]=lo[0]; e[idx]=lo[1];
          const pa=morphPos({obs:o,exc:e},R,t);
          o[idx]=hi[0]; e[idx]=hi[1];
          const pb=morphPos({obs:o,exc:e},R,t);
          path3c(ctx,cam,B,[pa,pb],rgba(col,0.55),1.0);
        };
        wsk(1,[d.obs[1]-d.err.ds,d.exc[1]-d.err.dB],
              [d.obs[1]+d.err.ds,d.exc[1]+d.err.dB]);
        if(d.err.dw!==null)
          wsk(2,[d.obs[2]-d.err.dw,d.exc[2]-d.err.dA],
                [d.obs[2]+d.err.dw,d.exc[2]+d.err.dA]);
      }
      const solid=(d.prov==='bootstrap'||d.prov===null);
      ctx.beginPath(); ctx.arc(q.x,q.y,3.1,0,TAU);
      if(solid&&d.id!=='SF6'){ ctx.fillStyle=col; ctx.fill(); }
      else{ ctx.fillStyle='#070b18'; ctx.fill();
            ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); }
      if(d.id==='Kr'){                     // the pressure of the row, in atm
        const lab=d.P+'';
        let LX=q.x+9, LY=q.y-10;
        if(!place(LX,LY,lab,9)){ LX=q.x-9; LY=q.y-10;
          if(!place(LX,LY,lab,9)){ dropped++; continue; } }
        ctx.fillStyle='#8b93a6'; ctx.font='9px -apple-system,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(lab,LX,LY);
      }
    }
  }
  // ---- captions -------------------------------------------------------
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const caps=[];
  if(cam.fov<FACE_FOV*1.5&&S.faceOn[mode])
    caps.push(faceLab(S.faceOn[mode],mode)+' — orthographic to ~1% '
      +'(dolly-zoom): this face IS the 2-D law plot');
  if(edgeOn.length)
    caps.push('the '+edgeOn.join('/')+' axis is edge-on — its numbers are '
      +'suppressed rather than piled on one spot');
  if(t>0.08&&t<0.92)
    caps.push('mid-chart at t = '+fmt(t,2)+': the axis numbers are suppressed '
      +'because a blended position corresponds to no single coordinate value');
  if(mode==='eigen'||t>0.5)
    caps.push('the sheet is the plane B = X — flat, Γ-free; steep members '
      +'may exit the box top (A axis spans the chip κ)');
  else if(mode==='mani')
    caps.push('sheet colour = the member C = 4/3 + η_b/η + (γ−1)/Pr '
      +'(1.4 → 4.2); s axis starts at 0.58, '
      +'not 0');
  if(gainMode)
    caps.push('sheet colour = Φ(ŷ) from '+fmt(PHI0,3)+' (kinetic corner) '
      +'toward 1/Γ; below ŷ = 0.15 the colour blends linearly to the corner');
  if(st.showData)
    caps.push(st.gas
      ?('rows drawn: '+GASD[st.gas].name+' only — a row&rsquo;s shift follows '
        +'its OWN Γ, so another gas does not belong on this sheet'
        +(M.nClip?('; '+M.nClip+' of its rows lie beyond ŷ_max = '
          +fmt(st.ymax,1)+' and are not drawn'):''))
      :'sliders free of any gas: no measured rows drawn (they would need '
       +'their own Γ)');
  if(dropped)
    caps.push(dropped+' row label'+(dropped>1?'s':'')+' omitted where it '
      +'would overprint (the points are drawn; the readout lists them)');
  let cy0=H-16-14*caps.length;
  for(const c of caps){ caption(ctx,14,cy0,c,W-320,'#767e92'); cy0+=14; }
}

/* ================================================================== *
 *  view: the six faces — the cube's three observable faces (curved)    *
 *  over the same three in excess coordinates (straight).  These ARE    *
 *  the named laws: read each panel as the 2-D law plot it is.          *
 * ================================================================== */
/* A reference curve drawn from axis limits must be CLIPPED to the plot box,
   not merely drawn past it (PLAYBOOK; the steep eigen-rays ran clear across
   three panels before this).  Liang-Barsky per segment in DATA space, so
   the curve ends exactly on the frame rather than one sample short. */
function clipSeg2(a,c,xlo,xhi,ylo,yhi){
  if(!a||!c||![a[0],a[1],c[0],c[1]].every(isFinite)) return null;
  const dx=c[0]-a[0], dy=c[1]-a[1];
  let t0=0, t1=1;
  const tests=[[-dx,a[0]-xlo],[dx,xhi-a[0]],[-dy,a[1]-ylo],[dy,yhi-a[1]]];
  for(const [p,q] of tests){
    if(p===0){ if(q<0) return null; continue; }
    const r=q/p;
    if(p<0){ if(r>t1) return null; if(r>t0) t0=r; }
    else   { if(r<t0) return null; if(r<t1) t1=r; }
  }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]];
}
function clipCurve(ctx,b,pts,xlo,xhi,ylo,yhi,col,lw,dash){
  for(let i=0;i<pts.length-1;i++){
    const s=clipSeg2(pts[i],pts[i+1],xlo,xhi,ylo,yhi);
    if(!s) continue;
    polyline(ctx,b,[s[0][0],s[1][0]],[s[0][1],s[1][1]],
             xlo,xhi,ylo,yhi,col,lw,dash);
  }
}
function drawFaces(ctx,W,H,M,S){
  const st=M.st, R=M.R;
  /* padR clears the floating readout: it is 280 px wide at right:13, so
     anything drawn past W-317 is hidden behind it (tools/audit.py reports
     that as under-readout, and it is a real defect for a view like this
     one that does not hide the overlay).  padB carries an x-axis label
     (+21) and a two-line caption (+44..58) under every panel. */
  const padL=62, padR=336, padT=52, padB=74, gapX=58, gapY=112;
  const cw=(W-padL-padR-2*gapX)/3, chh=(H-padT-padB-gapY)/2;
  const Cs=M.Cs, memb=C=>M.dense(C);
  const dense=memb(st.C);
  const drawPanel=(b,chart,which)=>{
    /* axis pick per face: 0 = state, 1 = shift, 2 = width */
    const r=R[chart];
    const AX={boyle:[0,2], charles:[0,1], gaslaw:[1,2]}[which];
    const lo=[r.x[0],r.y[0],r.z[0]], hi=[r.x[1],r.y[1],r.z[1]];
    const labs=[r.xl,r.yl,r.zl];
    const xlo=lo[AX[0]], xhi=hi[AX[0]], ylo=lo[AX[1]], yhi=hi[AX[1]];
    const ttl={boyle:chart==='obs'?'Boyle face · the narrowing law'
                                 :'A = κX  (a straight ray)',
               charles:chart==='obs'?'Charles face · the sound law'
                                   :'B = X  (Γ-free, slope 1)',
               gaslaw:chart==='obs'?'gas-law face · state eliminated'
                                  :'A = κB  (the PV = nRT)'}[which];
    axes(ctx,b,xlo,xhi,ylo,yhi,{title:ttl, xlab:plain(labs[AX[0]]),
      ylab:plain(labs[AX[1]]), xfmt:v=>fmt(v,chart==='obs'?1:0),
      yfmt:v=>fmt(v,chart==='obs'?2:0)});
    const pick=v=>{ const p=v[chart]; return [p[AX[0]],p[AX[1]]]; };
    for(const Cv of Cs)
      clipCurve(ctx,b,memb(Cv).map(pick),xlo,xhi,ylo,yhi,
                rgba(neonCss(memberRole(Cv)),0.5),0.9);
    clipCurve(ctx,b,memb(2*DXKIN).map(pick),xlo,xhi,ylo,yhi,'#e8843a',1.4,[6,4]);
    clipCurve(ctx,b,memb(7/3).map(pick),xlo,xhi,ylo,yhi,
              'rgba(242,244,248,0.7)',1.1);
    clipCurve(ctx,b,dense.map(pick),xlo,xhi,ylo,yhi,'#b8ec4c',2.0);
    /* data */
    if(st.showData){
      for(const d of M.shown){
        if(!d.inX) continue;
        const needW=(AX[0]===2||AX[1]===2);
        if(d.fiber&&needW){
          if(!st.showFibers) continue;
          const p=d[chart];
          const X=b.x+b.w*(p[AX[0]]-xlo)/(xhi-xlo);
          if(X<b.x||X>b.x1) continue;
          ctx.save(); ctx.strokeStyle=rgba(GCOL[d.id],0.45);
          ctx.setLineDash([2,4]); ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
          ctx.restore(); continue;
        }
        /* a width-less row on a face that needs no width is a genuine
           point (Law I places it fully), so it falls through here. */
        const p=d[chart];
        const X=b.x+b.w*(p[AX[0]]-xlo)/(xhi-xlo);
        const Y=b.y1-b.h*(p[AX[1]]-ylo)/(yhi-ylo);
        if(X<b.x-1||X>b.x1+1||Y<b.y-1||Y>b.y1+1) continue;
        if(d.err){
          const es=[null,chart==='obs'?d.err.ds:d.err.dB,
                    chart==='obs'?d.err.dw:d.err.dA];
          const e=es[AX[1]];
          if(e!==null&&e!==undefined){
            const Ya=b.y1-b.h*(p[AX[1]]-e-ylo)/(yhi-ylo);
            const Yb=b.y1-b.h*(p[AX[1]]+e-ylo)/(yhi-ylo);
            ctx.strokeStyle=rgba(GCOL[d.id],0.5); ctx.lineWidth=1;
            ctx.beginPath();
            ctx.moveTo(X,clamp(Ya,b.y,b.y1)); ctx.lineTo(X,clamp(Yb,b.y,b.y1));
            ctx.stroke();
          }
        }
        const solid=(d.prov==='bootstrap'||d.prov===null)&&d.id!=='SF6';
        ctx.beginPath(); ctx.arc(X,Y,2.8,0,TAU);
        if(solid){ ctx.fillStyle=GCOL[d.id]; ctx.fill(); }
        else { ctx.fillStyle='#070b18'; ctx.fill();
               ctx.strokeStyle=GCOL[d.id]; ctx.lineWidth=1.3; ctx.stroke(); }
      }
    }
    return {xlo,xhi,ylo,yhi};
  };
  const WH=['boyle','charles','gaslaw'];
  const capsTop={boyle:'Δν·P → (C/2)ν_ref P_K — the constant IS the '
      +'Stokes–Kirchhoff damping sum',
    charles:'(Γ−2s²)(P_K²+P²) = (Γ−1)P_K² — exact at every P; the constant '
      +'IS Γ−1',
    gaslaw:'no state axis at all: the two measured frequencies alone'};
  const capsBot={boyle:'A = κŷ² — slope κ = (2Δx/C)², C the damping sum',
    charles:'B = ŷ² — slope 1 for EVERY gas (Law I is universal)',
    gaslaw:'A = κB — two observables, two material constants'};
  /* row headings go ABOVE the panel titles with room for both: the title
     sits at b.y-6 (axes()), so the heading needs b.y-30 or it lands on it */
  ctx.fillStyle='#8b93a6'; ctx.font='10px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(plain('THE CUBE SEEN FACE-ON — the observables, curved'),
               padL,padT-32);
  ctx.fillText(plain('THE SAME FACES IN EXCESS COORDINATES — straight'),
               padL,padT+chh+gapY-32);
  for(let i=0;i<3;i++){
    const bt=box(padL+i*(cw+gapX),padT,cw,chh);
    drawPanel(bt,'obs',WH[i]);
    caption(ctx,bt.x,bt.y1+38,capsTop[WH[i]],cw,'#767e92',
            '10.5px -apple-system,sans-serif');
    const bb=box(padL+i*(cw+gapX),padT+chh+gapY,cw,chh);
    drawPanel(bb,'exc',WH[i]);
    caption(ctx,bb.x,bb.y1+38,capsBot[WH[i]],cw,'#767e92',
            '10.5px -apple-system,sans-serif');
  }
}

/* ================================================================== *
 *  view: the dictionary — each SBS law against its classical parent    *
 * ================================================================== */
const DICT=[
 ['PV = nRT','A = κB','— (state eliminated)','Γ and κ','exact'],
 ['Boyle  PV = const','Δν·P = (C/2)ν_ref P_K','gas, λ, T','C (the damping sum)','exact limit'],
 ['Charles  V/T = const','(Γ−2s²)(P_K²+P²) = (Γ−1)P_K²','gas, λ, T','Γ (heat-capacity ratio)','exact'],
 ['Avogadro  V ∝ n','ŷ = Pλ/4πηv₀','gas, T','the crossover position','exact'],
 ['Gibbs–Duhem','g·w/s = Ψ·Φ(ŷ)','—','Ψ (conservation weight)','corners exact, interior tabulated'],
 ['Z = PV/nRT','Z = A/(κ_ideal B)','—','departure from Boltzmann','exact'],
];
const GRADE_COL={'exact':'#b8ec4c','exact limit':'#b8ec4c',
  'corners exact, interior tabulated':'#5ac8e0'};
function drawDict(ctx,W,H,M){
  const st=M.st;
  /* padR clears the floating readout (280 px at right:13, ~470 tall) —
     this view does not hide the overlay, so prose that runs under it is
     genuinely unreadable, not merely covered. */
  const padL=54, padR=340, y0=64;
  const wAll=W-padL-padR;
  const cols=[0.20,0.30,0.16,0.20,0.14];
  const xs=[]; let acc=padL;
  for(const c of cols){ xs.push(acc); acc+=c*wAll; }
  ctx.font='italic 13px Georgia, serif'; ctx.fillStyle='#cfd4de';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(plain('the SBS gas laws and their classical counterparts'),padL,y0-30);
  ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle=CMUT;
  const heads=['classical','SBS','held fixed','the constant measures','grade'];
  heads.forEach((hd,i)=>ctx.fillText(plain(hd),xs[i],y0-8));
  ctx.strokeStyle='#242a3a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,y0-3); ctx.lineTo(padL+wAll,y0-3); ctx.stroke();
  let y=y0+18;
  for(const row of DICT){
    const isLaw3=row[1]==='A = κB';
    ctx.font=(isLaw3?'600 ':'')+'12px -apple-system,sans-serif';
    for(let i=0;i<5;i++){
      ctx.fillStyle=i===4?(GRADE_COL[row[4]]||'#e8843a')
                   :isLaw3?'#fff':i===1?'#cfd4de':'#8b93a6';
      const ls=wrapText(ctx,row[i],cols[i]*wAll-14);
      for(let k=0;k<ls.length;k++) ctx.fillText(ls[k],xs[i],y+k*14);
    }
    y+=Math.max(2,1+Math.max.apply(null,row.map((c,i)=>
        wrapText(ctx,c,cols[i]*wAll-14).length)))*14+10;
    ctx.strokeStyle='#161b26';
    ctx.beginPath(); ctx.moveTo(padL,y-13); ctx.lineTo(padL+wAll,y-13); ctx.stroke();
  }
  /* the three grades, and the two cautions the paper carries */
  y+=16;
  ctx.font='italic 12.5px Georgia, serif'; ctx.fillStyle='#aeb6c6';
  ctx.fillText(plain('what is exact, and what is not'),padL,y); y+=18;
  const grades=[
   ['#b8ec4c','exact, model-free',
    'the state variable ŷ; P = ρv₀²/2; the Doppler corner s(0) = 1/√2; '
    +'Γ ≡ 2c₀²/v₀²; the Stokes–Kirchhoff linewidth and C = 4/3 + η_b/η + '
    +'(γ−1)/Pr; both Φ corners (sum rules); the algebra Laws I + II → III.'],
   ['#e8843a','the single-relaxation interpolation',
    'c² = u c_rms² + (1−u)c₀² and its width counterpart. Pinned at exact '
    +'endpoints; this is what makes B and A EQUAL ŷ² and κŷ² rather than '
    +'merely tend to them — i.e. what makes Law III a line, not a curve.'],
   ['#5ac8e0','tabulated',
    'the interior of Φ(ŷ), from the exact conserving Pr = 2/3 solve '
    +'(17 nodes here, log-interpolated).'],
  ];
  for(const [col,ttl,body] of grades){
    ctx.fillStyle=col; ctx.font='600 11.5px -apple-system,sans-serif';
    ctx.textBaseline='alphabetic';
    ctx.fillText(plain(ttl),padL,y);
    /* caption() draws from the TOP of its first line, so the body has to
       start below the heading's baseline, not level with it */
    const dy=caption(ctx,padL,y+7,body,wAll-8,'#767e92',
                     '11px -apple-system,sans-serif');
    ctx.textBaseline='alphabetic';
    y+=dy+18;
  }
  const cautions='Two cautions carry over from the measurements. Law I is '
    +'exact, but reading it BACKWARD is ill-conditioned: ∂ŷ²/∂s = '
    +'4s(Γ−1)/(Γ−2s²)², so as Γ → 1 the shift stops responding to '
    +'collisionality — at the current Γ = '+fmt(st.G,3)+' that sensitivity is '
    +fmt(M.cond,1)+' at ŷ = 1, and SF₆ sits close enough to the Γ → 1 locus '
    +'that its state is NOT recoverable from its observables. And κ enters '
    +'only through the width, so gases without width data (N₂, Ar) test Law I '
    +'alone — still a genuine test, since Γ comes from the measured sound '
    +'speed, not from the SBS shift.';
  y+=caption(ctx,padL,y+2,cautions,wAll-8,'#8b93a6',
             '11px -apple-system,sans-serif')+30;
  /* which gas can test which law — the reason the programme's quantitative
     basis is monatomic Kr, in one block */
  ctx.font='italic 12.5px Georgia, serif'; ctx.fillStyle='#aeb6c6';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(plain('and which gas can test which law'),padL,y); y+=20;
  const gcols=[0.10,0.13,0.08,0.08,0.09,0.09,0.43];
  const gxs=[]; acc=padL;
  for(const c of gcols){ gxs.push(acc); acc+=c*wAll; }
  ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle=CMUT;
  ['gas','class','Γ','C','κ','P_K (atm)','what its data can decide']
    .forEach((hd,i)=>ctx.fillText(plain(hd),gxs[i],y));
  ctx.strokeStyle='#242a3a';
  ctx.beginPath(); ctx.moveTo(padL,y+5); ctx.lineTo(padL+wAll,y+5); ctx.stroke();
  y+=22;
  const DEC={
    Kr:'both laws: 5 widths and 6 shifts. The quantitative basis of the '
      +'programme — and the one that carries the open width anomaly.',
    Ar:'Law I only, and barely: its tabulated shifts are constant to the '
      +'read-off resolution, so its B is flat and off-sheet at low P.',
    N2:'Law I now (it reads 13% into its rotational window, favouring '
      +'relaxed); Law II the moment ONE width is measured — frozen vs '
      +'relaxed rotation separate the linewidth by 30% at 6 atm.',
    SF6:'neither, on its own: Γ → 1 makes the state unreadable from the '
      +'shift (its sensitivity has even changed sign), and no width errors '
      +'are tabulated.',
  };
  for(const id of GAS_IDS){
    const g=GASD[id];
    const cells=[{Kr:'Kr',Ar:'Ar',N2:'N₂',SF6:'SF₆'}[id], g.cls,
                 fmt(g.G,3), fmt(g.C,3), fmt(kap(g.C),3), fmt(pkOf(id),2)];
    ctx.font='11.5px -apple-system,sans-serif';
    cells.forEach((cv,i)=>{ ctx.fillStyle=i===0?GCOL[id]:'#8b93a6';
      ctx.fillText(plain(cv),gxs[i],y); });
    const dy=caption(ctx,gxs[6],y-9,DEC[id],gcols[6]*wAll-10,'#767e92',
                     '11px -apple-system,sans-serif');
    ctx.textBaseline='alphabetic';
    y+=Math.max(dy,16)+9;
  }
}

/* ================================================================== *
 *  dispatch + scene                                                   *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.clearRect(0,0,W,H);
  const v=M.st.view;
  if(v==='faces') drawFaces(ctx,W,H,M,S);
  else if(v==='dict') drawDict(ctx,W,H,M);
  else draw3D(ctx,W,H,M,S);
}
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cams={};
  for(const k of ['mani','eigen','morph','gain','surf']){
    const hm=CAM_HOMES[k];
    cams[k]=makeCamera(hm.theta,hm.phi,HOME_DIST,[0,0,0]);
  }
  const faceOn={mani:null,eigen:null,morph:null,gain:null,surf:null};
  let M=buildModel(st);
  const S={
    st, cams, faceOn, W:900, H:640,
    model:()=>M,
    rebuild(){ M=buildModel(st); },
    readout:()=>readout(M), eqbar:()=>eqbar(M), tag:()=>tagOf(M),
    draw(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,M,S); },
    is3D:()=>st.view!=='faces'&&st.view!=='dict',
    cam(){ return cams[st.view]||cams.mani; },
    /* orbit leaves any face snap */
    orbit(dx,dy){
      if(!S.is3D()) return false;
      const c=S.cam();
      c.theta-=dx*0.007; c.phi=clamp(c.phi+dy*0.006,-1.35,1.45);
      faceOn[st.view]=null;
      if(c.fov!==HOME_FOV){ c.fov=HOME_FOV; c.dist=HOME_DIST; }
      return true;
    },
    zoom(dy){
      if(!S.is3D()) return false;
      const c=S.cam();
      c.dist=clamp(c.dist*Math.exp(dy*0.0012),
                   distForFov(c.fov)*0.45,distForFov(c.fov)*2.6);
      return true;
    },
    /* snap to a face: rotate AND narrow the fov (dolly-zoom to ortho) */
    face(which){
      if(!S.is3D()) return false;
      const c=S.cam(), f=FACES3[which];
      c.theta=f.theta; c.phi=f.phi; c.fov=FACE_FOV; c.dist=distForFov(FACE_FOV);
      faceOn[st.view]=which;
      return true;
    },
    resetView(){
      const hm=CAM_HOMES[st.view]||CAM_HOMES.mani;
      const c=S.cam();
      c.theta=hm.theta; c.phi=hm.phi; c.fov=HOME_FOV; c.dist=HOME_DIST;
      faceOn[st.view]=null;
    },
    step(dt){
      if(!st.play) return false;
      const nt=st.t+dt*0.35*st.speed;
      st.t=nt>1?0:nt;
      M=buildModel(st);
      return true;
    },
  };
  return S;
}

/* ================================================================== *
 *  boot — tabs, controls, the frame loop                              *
 * ================================================================== */
/* 'surf' is APPENDED, not inserted: the existing views keep their indices
   and their 1..6 keys, so nothing already verified shifts under it. */
const TABS=[['mani','the manifold'],['eigen','the eigen-sheet'],
            ['faces','the six faces'],['morph','the flattening'],
            ['gain','the gain field'],['dict','the dictionary'],
            ['surf','the state surface']];
function boot(){
  const canvas=document.getElementById('scene');
  const tabsEl=document.getElementById('tabs');
  const panel=document.getElementById('panel');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      if(key==='G'||key==='C') st.gas='';
      val.textContent=fmtf(st[key]); S.rebuild(); syncChips(); syncPanel();
      dirty=true; refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); dirty=true; refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        S.rebuild(); syncChips(); syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }

  const GCHIPS=GAS_IDS.map(id=>({id,name:{Kr:'Kr',Ar:'Ar',N2:'N₂',SF6:'SF₆'}[id]}));
  const gGas=h('div',{class:'grp'},h('h3',null,'the gas'));
  gGas.appendChild(chipRow(GCHIPS,'gas',o=>{
    st.G=GASD[o.id].G; st.C=GASD[o.id].C; }));
  gGas.appendChild(h('div',{class:'src'},
    'Γ from each gas&rsquo;s MEASURED sound speed, 𝒞 from its own transport '
    +'sum 4/3 + η_b/η + (γ−1)/Pr — no SBS number enters either. N₂ shows '
    +'rotation relaxed (its frozen member is drawn grey-dashed); SF₆&rsquo;s '
    +'Γ = 0.76 is the vibration-frozen value at 14.7 atm, and it sits at the '
    +'Γ → 1 degeneracy.'));

  const gTier=h('div',{class:'grp'},h('h3',null,'the two material constants'));
  gTier.appendChild(slider('G','Γ · thermodynamic',0.72,1.82,0.001,v=>fmt(v,3)));
  gTier.appendChild(slider('C','𝒞 · kinetic',CLO,CHI,0.001,v=>fmt(v,3)));
  gTier.appendChild(slider('Psi','Ψ · conservation',0.7,1.5,0.005,v=>fmt(v,3)));
  gTier.appendChild(h('div',{class:'src'},
    'These are the ONLY two constants in A = κB (Ψ is Law IV&rsquo;s third). '
    +'Moving 𝒞 slides the green member through the sheet; the Boltzmann '
    +'7/3 is drawn white, the ellipse member 2Δx_kin (κ = 1) orange-dashed, '
    +'and Kr&rsquo;s 6-atm read-back 2.950 magenta-dotted.'));

  const gChart=h('div',{class:'grp'},h('h3',null,'the chart'));
  gChart.appendChild(slider('t','morph  observed → excess',0,1,0.01,v=>fmt(v,2)));
  gChart.appendChild(slider('ymax','ŷ_max (cube extent)',2,11,0.1,v=>fmt(v,1)));
  gChart.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.face('boyle'); dirty=true; refresh(); }},'Boyle face'),
    h('button',{onclick:()=>{ S.face('charles'); dirty=true; refresh(); }},'Charles face'),
    h('button',{onclick:()=>{ S.face('gaslaw'); dirty=true; refresh(); }},'gas-law face')));
  gChart.appendChild(h('div',{class:'src'},
    'The face buttons rotate the camera onto a cube face AND narrow the field '
    +'of view to 0.7° with a matching dolly — so the projection is '
    +'orthographic to ~1% and the face reads as the flat 2-D law plot it is. '
    +'Drag to leave.'));

  const gDisp=h('div',{class:'grp'},h('h3',null,'display'));
  const dchecks=h('div',{class:'checks'},
    checkbox('showData','the measured rows'),
    checkbox('showFibers','width-less rows as fibres'),
    checkbox('showRays','members / eigen-rays'),
    checkbox('showShadows','floor shadows'),
    checkbox('play','play the flattening'));
  gDisp.appendChild(dchecks);
  gDisp.appendChild(slider('speed','speed',0.2,4,0.1,v=>fmt(v,1)+'×'));
  gDisp.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuild();
      S.resetView(); syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
                h('div',{id:'info'}));
  [gGas,gTier,gChart,gDisp,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    const cw=gGas.querySelector('.chips'); if(!cw) return;
    const cur=GAS_IDS.find(id=>Math.abs(st.G-GASD[id].G)<1e-9
                              &&Math.abs(st.C-GASD[id].C)<1e-9);
    st.gas=cur||'';
    [].forEach.call(cw.children,(b,i)=>
      b.className='chip'+(GAS_IDS[i]===st.gas?' on':''));
  }
  function syncPanel(){
    rows.speed.row.hidden=!st.play;
    rows.t.row.hidden=(st.view!=='morph');
    for(const k in rows) rows[k].sync();
    [].forEach.call(dchecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showData','showFibers','showRays','showShadows',
                      'play'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent=S.is3D()
        ?'drag to orbit · scroll to zoom · b/c/g snap to a face · space plays '
         +'the flattening · r resets'
        :'1–6 switch views · space plays the flattening · r resets';
      subEl.innerHTML='κ = <b>'+fmt(M.kapC,4)+'</b> · κ_ideal = <b>'
        +fmt(M.kapI,4)+'</b> · Law III residual on the measured forms <b>'
        +M.res3.toExponential(1)+'</b> (cancellation floor)';
      infoEl.innerHTML=INFO[st.view]||INFO.mani;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* every camera/state change asks for a frame (steam_carnot Known-bad) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    if(S.orbit(e.clientX-lx,e.clientY-ly)) dirty=true;
    lx=e.clientX; ly=e.clientY; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault();
    if(S.zoom(e.deltaY)) dirty=true; },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.play=!st.play;
      if(st.play&&st.view!=='morph'){ st.view='morph';
        [].forEach.call(tabsEl.children,(b,i)=>
          b.className=TABS[i][0]==='morph'?'active':''); S.rebuild(); }
      syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ S.resetView(); st.t=0; S.rebuild(); syncPanel();
      dirty=true; refresh(); }
    else if(e.key==='b'){ if(S.face('boyle')){ dirty=true; refresh(); } }
    else if(e.key==='c'){ if(S.face('charles')){ dirty=true; refresh(); } }
    else if(e.key==='g'){ if(S.face('gaslaw')){ dirty=true; refresh(); } }
    else if(e.key>='1'&&e.key<='7'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0, roT=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    if(S.step(dt)) dirty=true;
    if(dirty){
      dirty=false;
      try{
        S.draw();
        roT+=dt;
        if(st.play&&roT>0.2){ roT=0; roEl.innerHTML=S.readout();
          tagEl.innerHTML=S.tag(); rows.t.sync(); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

/* ================================================================== *
 *  selfTest — headless physics.  Reference values marked (scipy) come  *
 *  from derive_manifold.py (24 checks ALL PASS), which re-derives them *
 *  independently of this file.                                        *
 * ================================================================== */
function selfTest(){
  let pass=0, failN=0;
  const ok=(c,n)=>{ if(c) pass++; else { failN++; console.log('FAIL — '+n); } };
  const close=(a,b,tol,n)=>ok(Math.abs(a-b)<=tol,n+' ('+a+' vs '+b+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a/b-1)<=t,n+' ('+a+' vs '+b+')');

  // ---- tables present, finite, and self-consistent -------------------
  ok(PHIY.length===17&&PHIV.length===17,'Phi table: 17 nodes');
  let fin=true, monoY=true, monoV=true;
  for(let i=0;i<17;i++){
    if(!isFinite(PHIY[i])||!isFinite(PHIV[i])) fin=false;
    if(i&&PHIY[i]<=PHIY[i-1]) monoY=false;
    if(i&&PHIV[i]>=PHIV[i-1]) monoV=false;
  }
  ok(fin,'Phi table finite'); ok(monoY,'Phi nodes strictly increasing in yhat');
  ok(monoV,'Phi strictly decreasing (kinetic corner is the maximum)');
  ok(GAS_IDS.length===4,'four gases');
  let rowsFin=true, nrows=0;
  for(const id of GAS_IDS) for(const r of GASD[id].rows){
    nrows++;
    for(const k of ['P','yh','X','s','G','B','lawI'])
      if(!isFinite(r[k])) rowsFin=false;
  }
  ok(rowsFin,'every stored row field finite'); ok(nrows===16,'16 stored rows (argon dropped 2026-08-08: placeholder)');
  ok(GASD.Kr.rows[0].A===null&&GASD.Kr.rows[0].wm===null,
     'no 1-atm Kr width exists — stored null, never interpolated');
  ok(GASD.N2.rows.every(r=>r.wm===null)&&GASD.Ar.rows.every(r=>r.wm===null),
     'N2 and Ar carry NO width data at all (fibres, not points)');
  ok(GASD.SF6.rows.every(r=>r.ewm===null),
     'SF6 carries no width errors (hollow, no chi2 is honest)');

  // ---- constants, against absolute numbers ---------------------------
  close(SQ,0.7601734505,5e-10,'sqrt(pi/2e) (scipy)');
  close(PHI0,PINS.phi0,5e-10,'Phi(0) = sqrt(pi/e) Dxkin (scipy)');
  close(DXKIN,1.1332,0,'Dxkin is the 4-dp programme constant');
  close(DXKIN,PINS.dxkExact,5e-5,
        'and it rounds the exact lobe FWHM 1.13315079 (scipy brentq)');
  close(KAPI,PINS.kapI,5e-10,'kappa_ideal = (2Dx/(7/3))^2 (scipy)');
  close(kap(2*DXKIN),1.0,1e-15,'the ellipse member 2Dxkin has kappa = 1');
  for(const [id,k] of [['Kr','kapKr'],['Ar','kapAr'],['N2','kapN2r'],
                       ['SF6','kapSF6']])
    close(kap(GASD[id].C),PINS[k],5e-10,'kappa('+id+') (scipy)');
  close(kap(GASD.N2.Cref),PINS.kapN2f,5e-10,'kappa(N2 frozen) (scipy)');
  close(kap(2.950029),PINS.kapRec6,5e-10,'kappa(C_rec 6 atm) (scipy)');

  // ---- the laws as identities, at four Gammas incl. SF6's < 1 --------
  let d1=0,d2=0,d3=0,dC=0;
  for(const G of [0.76215,1.05,1.40267,5/3,1.8])
    for(const yh of [1e-3,0.05,0.3,1,2.5,8,40]){
      const s=sOf(yh,G);
      d1=Math.max(d1,Math.abs(Bof(s,G)/(yh*yh)-1));
      dC=Math.max(dC,Math.abs(charlesRes(yh,G)-(G-1)));
      for(const C of [1.4,7/3,2*DXKIN,4.2]){
        const w=wOf(yh,C);
        d2=Math.max(d2,Math.abs(Aof(w)/(kap(C)*yh*yh)-1));
        d3=Math.max(d3,Math.abs(Aof(w)-kap(C)*Bof(s,G)));
      }
    }
  ok(d1<=5e-9,'Law I: B = yhat^2 identically ('+d1.toExponential(1)+')');
  ok(d2<=1e-9,'Law II: A = kappa yhat^2 ('+d2.toExponential(1)+')');
  ok(d3<=5e-8,'Law III: A = kappa B, state eliminated ('+d3.toExponential(1)+')');
  ok(dC<=1e-12,'Charles exact: (G-2s^2)(1+yh^2) = G-1 at EVERY yhat');

  // ---- the corners as numerical LIMITS, not second formulas ----------
  close(sOf(1e-8,1.3),Math.SQRT1_2,1e-14,'s(0) -> 1/sqrt2 (limit taken)');
  close(sOf(1e8,1.3),Math.sqrt(1.3/2),1e-9,'s(inf) -> sqrt(G/2) (limit taken)');
  close(wOf(0,3.1),DXKIN,0,'w(0) = Dxkin exactly');
  close(wOf(1e6,7/3)*1e6,(7/3)/2,1e-6,'Boyle: w*yhat -> C/2 (limit taken)');
  close(boyleProd(1e6,2.06529),2.06529/2,1e-6,'same for SF6-class C');

  // ---- absolute pins on the formulas the sim draws -------------------
  close(sOf(0.7,5/3),PINS.s_07_G53,5e-10,'s(0.7, 5/3) (scipy)');
  close(sOf(1.3,1.40267),PINS.s_13_N2,5e-10,'s(1.3, N2 Gamma) (scipy)');
  close(sOf(2.5,0.76215),PINS.s_25_SF6,5e-10,'s(2.5, SF6 Gamma) (scipy)');
  close(wOf(0.7,7/3),PINS.w_07_CI,5e-10,'w(0.7, 7/3) (scipy)');
  close(wOf(1.3,GASD.Kr.C),PINS.w_13_Kr,5e-10,'w(1.3, Kr C) (scipy)');
  close(wOf(4,1.43),PINS.w_4_143,5e-10,'w(4, 1.43) (scipy)');
  close(Aof(wOf(1.3,GASD.Kr.C)),PINS.A_13_Kr,5e-9,'A at (1.3, Kr C) (scipy)');
  close(Bof(sOf(1.3,5/3),5/3),PINS.B_13_G53,5e-9,'B at (1.3, 5/3) = 1.69 (scipy)');

  // ---- round-trip every inverse -------------------------------------
  let rt=0;
  for(const yh of [0.2,0.8,1.7,4.0]) for(const C of [1.6,7/3,3.4])
    rt=Math.max(rt,Math.abs(cRec(wOf(yh,C),yh)/C-1));
  ok(rt<=1e-9,'cRec inverts wOf ('+rt.toExponential(1)+')');
  let rtG=0;
  for(const yh of [0.3,1,3]) for(const G of [1.2,1.4,5/3]){
    const s=sOf(yh,G);
    rtG=Math.max(rtG,Math.abs((2*s*s*(1+yh*yh)-1)/(yh*yh)/G-1));
  }
  ok(rtG<=1e-9,'Gamma_rec inverts sOf ('+rtG.toExponential(1)+')');

  // ---- the two derivatives, against numerical differentiation ---------
  // These are the error-bar transforms AND the conditioning readout, so
  // they are asserted once and used everywhere (one definition each).
  const fd=(Bof(sOf(1,5/3)+5e-9,5/3)-Bof(sOf(1,5/3)-5e-9,5/3))/1e-8;
  rel(condOf(1,5/3),fd,1e-4,'dB/ds formula matches a finite difference');
  for(const [s2,G2] of [[0.777114,1.66457],[0.875622,1.65932],[0.79,1.40267]]){
    const fdb=(Bof(s2+1e-8,G2)-Bof(s2-1e-8,G2))/2e-8;
    rel(dBds(s2,G2),fdb,1e-5,'dB/ds at a measured Kr/N2 row (numeric)');
  }
  for(const w2 of [0.881095,0.60199,0.29]){
    const fda=(Aof(w2+1e-9)-Aof(w2-1e-9))/2e-9;
    rel(dAdw(w2),fda,1e-5,'dA/dw = -2Dx^2/w^3 at a measured width (numeric)');
  }
  // and the whiskers the sim DRAWS are those derivatives times the quoted
  // sigma, in reduced units — pinned absolutely, since a dropped nu_ref
  // conversion changes nothing else in the picture
  {
    const M0=buildModel(Object.assign({},DEFAULTS));
    const r6=M0.data.find(d=>d.id==='Kr'&&d.P===6);
    close(r6.err.ds,0.05/GASD.Kr.nuref,1e-12,
      'the Kr shift sigma is reduced by nu_ref (0.05 GHz -> 0.02736)');
    close(r6.err.ds,0.027363,1e-6,'and that is 0.027363 absolutely');
    close(r6.err.dw,0.12/GASD.Kr.nuref,1e-12,'same for the width sigma');
    close(r6.err.dB,Math.abs(dBds(0.875622,1.65932))*r6.err.ds,1e-12,
      'the drawn B whisker IS dB/ds x sigma_s');
    close(r6.err.dA,Math.abs(dAdw(1.1/GASD.Kr.nuref))*r6.err.dw,1e-12,
      'and the drawn A whisker IS |dA/dw| x sigma_w');
    ok(r6.err.dB>0&&r6.err.dA>0,'both whiskers are positive half-widths');
  }
  // ---- the mesh actually resolves the sheet it draws ------------------
  {
    let worst=0, at='';
    for(const ym of [2,4.5,7,11])
      for(const C of [CLO,7/3,2*DXKIN,CHI])
        for(const G of [0.72,1.40267,1.66322,1.82]){
          const e=meshChordErr(Object.assign({},DEFAULTS,{ymax:ym,C,G}));
          if(e>worst){ worst=e; at=' at ymax'+ym+' C'+fmt(C,2)+' G'+fmt(G,2); }
        }
    ok(worst<=0.008,'the mesh resolves the curve to '+worst.toFixed(5)
      +' box units'+at+' (row skew '+ROWSKEW+', '+NROW+' rows; the 0.75 skew '
      +'first tried here measured 0.102 — the sheet visibly cut the corner)');
    ok(NROW===33&&ROWSKEW===1.75,'the resolved row distribution is the one shipped');
  }
  ok(condOf(1,1.001)/condOf(1,5/3)>400,
     'and blows up toward Gamma = 1: x'+fmt(condOf(1,1.001)/condOf(1,5/3),0)
     +' (the SF6 degeneracy)');
  ok(GASD.SF6.G<1&&condOf(3.8,GASD.SF6.G)<0,
     'SF6 sits past Gamma = 1: its sensitivity has even flipped sign');

  // ---- Phi: corners, table fidelity, the sub-node blend -------------
  close(phiOf(0),PHI0,0,'Phi(0) = the corner theorem');
  close(phiOf(PHIY[0]),PHIV[0],1e-12,'Phi continuous at the first node');
  close(phiOf(8.0),PHIV[16],1e-12,'Phi clamped at the last node');
  close(phiOf(0.075),PINS.phi_075,5e-10,'Phi(0.075) sub-node blend (scipy)');
  for(const [y,k] of [[0.3,'phi_03'],[0.5,'phi_05'],[1,'phi_1'],[2,'phi_2'],
                      [3,'phi_3'],[5,'phi_5'],[7,'phi_7']])
    close(phiOf(y),PINS[k],5e-10,'Phi('+y+') (scipy)');
  let phiMono=true;
  for(let i=1;i<=60;i++){
    const a=phiOf(0.02*i), b=phiOf(0.02*(i+1));
    if(b>a+1e-12) phiMono=false;
  }
  ok(phiMono,'Phi non-increasing across the blend seam and the table');
  ok(phiOf(8)>1/GASD.Kr.G,
     'the table END is still 2.7% above 1/Gamma — the hydro corner is a '
     +'LIMIT the 17 nodes do not reach, and the sim must not claim it does');

  // ---- stored rows recompute from the laws ---------------------------
  // tolerances are DERIVED from the stored decimals, not guessed:
  // s is 6 dp, Gamma 5 dp, X/B/A/Z 4 dp, w from GHz at 3-4 dp.
  let wB=0,wX=0,wA=0,wZ=0,wL=0;
  for(const id of GAS_IDS) for(const r of GASD[id].rows){
    const den=r.G-2*r.s*r.s;
    const tolB=Math.abs(4*r.s*(r.G-1)/(den*den))*5e-7
               +Math.abs((2*r.s*r.s-1)/(den*den))*5e-6+5e-5;
    wB=Math.max(wB,Math.abs(Bof(r.s,r.G)-r.B)/tolB);
    const tolX=2*r.yh*5e-7+5e-5;
    wX=Math.max(wX,Math.abs(r.yh*r.yh-r.X)/tolX);
    const tolL=Math.abs(Bof(r.s,r.G)/(r.yh*r.yh))*(tolB/Math.abs(r.B)+tolX/r.X)+5e-5;
    wL=Math.max(wL,Math.abs(Bof(r.s,r.G)/(r.yh*r.yh)-r.lawI)/tolL);
    if(r.A!==null){
      const w=r.wm/GASD[id].nuref;
      const tolA=2*DXKIN*DXKIN/Math.pow(w,3)*5e-7+5e-5;
      wA=Math.max(wA,Math.abs(Aof(w)-r.A)/tolA);
      const tolZ=r.Z*(5e-5/r.A+tolB/Math.abs(r.B))+5e-5;
      wZ=Math.max(wZ,Math.abs(Zof(r.A,r.B)-r.Z)/tolZ);
    }
  }
  ok(wB<=1,'every stored B recomputes from (s, Gamma) ('+fmt(wB,2)+' of tol)');
  ok(wX<=1,'every stored X recomputes as yhat^2 ('+fmt(wX,2)+')');
  ok(wA<=1,'every stored A recomputes from the measured width ('+fmt(wA,2)+')');
  ok(wZ<=1,'every stored Z = A/(kappa_ideal B) ('+fmt(wZ,2)+')');
  ok(wL<=1,'every stored lawI = B/X ('+fmt(wL,2)+')');

  // ---- P_K, the state->pressure map ---------------------------------
  close(pkOf('Kr'),PINS.PK_Kr,5e-6,'P_K(Kr) = 2.878 atm (scipy)');
  close(pkOf('N2'),PINS.PK_N2,5e-6,'P_K(N2) (scipy)');
  /* Argon's rows are gone, and pkOf derives P_K from a ROW (P/yhat)
     rather than from transport (eta q v0), so a gas with no data now
     has no P_K here.  Worth knowing: P_K is a PREDICTION and should
     never have needed a measurement in order to exist. */
  ok(pkOf('Ar')===null,'P_K(Ar) is null once argon has no rows: pkOf is row-derived');
  close(pkOf('SF6'),PINS.PK_SF6,5e-6,'P_K(SF6) (scipy)');

  // ---- the inversion table (the width anomaly, stated not fitted) ----
  ok(INV.length===5,'five Kr inversion rows');
  let invOk=true;
  for(const r of INV){
    const row=GASD.Kr.rows.find(q=>q.P===r.P);
    const w=row.wm/GASD.Kr.nuref;
    if(Math.abs(cRec(w,r.yh)-r.C)>2e-3) invOk=false;
  }
  ok(invOk,'C_rec of every row reproduces parent_law Table II from its width');
  ok(INV[0].C<7/3&&INV[4].C>7/3,
     'and the anomaly is stated as drawn: C_rec crosses 7/3 (1.95 -> 2.95)');
  ok(INV[0].Psi<1&&INV[4].Psi>1.4-1e-9,
     'Psi_rec climbs 0.95 -> 1.40 in step — the same object, second tier');

  // ---- geometry: normalisation, morph endpoints, clipping ------------
  const stT=Object.assign({},DEFAULTS), R=rangesFor(stT);
  close(R.exc.z[1],PINS.atopKr,5e-9,'the A-axis top for Kr (scipy)');
  const vT=vertAt(1.3,2.0,GASD.Kr.G);
  const a0=morphPos(vT,R,0), a1=morphPos(vT,R,1), am=morphPos(vT,R,0.5);
  for(let i=0;i<3;i++){
    close(a0[i],PINS.morphObs[i],5e-9,'morph t=0 component '+i+' (scipy)');
    close(a1[i],PINS.morphExc[i],5e-9,'morph t=1 component '+i+' (scipy)');
    close(am[i],PINS.morphMid[i],5e-9,'morph t=0.5 component '+i+' (scipy)');
  }
  close(nrm(R.obs.x[0],R.obs.x[0],R.obs.x[1]),-1,0,'normaliser hits -1 at lo');
  close(nrm(R.obs.x[1],R.obs.x[0],R.obs.x[1]),1,0,'and +1 at hi');
  ok(!inBox([0,0,1.5]),'inBox rejects a point above the ceiling — geometry '
    +'that leaves the cube is CLIPPED, never clamped onto a face');

  // ---- the clippers, against analytic crossings ----------------------
  // A surface whose out-of-box quads are DROPPED leaves a staircase, and a
  // reference curve drawn past its box is a line through empty space; both
  // were real defects here, so the clippers get pinned.
  {
    const inside=clipSeg3([-0.5,0,0],[0.5,0,0]);
    close(inside[0][0],-0.5,0,'clipSeg3 leaves an interior segment alone (lo)');
    close(inside[1][0],0.5,0,'…and (hi)');
    ok(clipSeg3([0,0,1.4],[0,0,2.0])===null,
       'clipSeg3 rejects a segment wholly outside');
    const cut=clipSeg3([0,0,0],[0,0,3]);   // crosses z = 1 at t = 1/3
    close(cut[1][2],1,1e-12,'and truncates exactly at the ceiling z = 1');
    const diag=clipSeg3([-2,-2,-2],[2,2,2]);
    close(diag[0][0],-1,1e-12,'a body diagonal is cut at the near corner');
    close(diag[1][2],1,1e-12,'…and at the far corner');
    const q0=[[-0.5,-0.5,0],[0.5,-0.5,0],[0.5,0.5,0],[-0.5,0.5,0]];
    ok(clipPoly3(q0).length===4,'clipPoly3 passes an interior quad through');
    const q1=[[-0.5,0,0.5],[0.5,0,0.5],[0.5,0,1.6],[-0.5,0,1.6]];
    const c1=clipPoly3(q1);
    ok(c1.length>=4,'a quad straddling the ceiling survives as a polygon');
    let zmax=-9; for(const p of c1) zmax=Math.max(zmax,p[2]);
    close(zmax,1,1e-12,'…flattened onto the ceiling, not dropped');
    ok(clipPoly3([[2,2,2],[3,2,2],[3,3,2],[2,3,2]]).length<3,
       'and a wholly outside quad clips away to nothing');
    // the 2-D clipper the faces view uses
    const s2=clipSeg2([0,0],[10,10],0,4,0,4);
    close(s2[1][0],4,1e-12,'clipSeg2 truncates at the panel edge (x)');
    close(s2[1][1],4,1e-12,'…and at the same point in y (45° ray)');
    ok(clipSeg2([5,5],[6,6],0,4,0,4)===null,
       'clipSeg2 rejects a segment past the panel');
    const s3=clipSeg2([1,5],[3,1],0,4,0,4);   // enters through y = 4
    close(s3[0][1],4,1e-12,'and enters exactly on the frame');
    close(s3[0][0],1.5,1e-12,'…at the analytically correct x');
  }
  {   // a steep member genuinely exits the top: that must be visible as
      // clipping, not folded flat (the wind_tunnel unapplied-limit trap)
    const st2=Object.assign({},DEFAULTS,{C:CLO,ymax:11});
    const R2=rangesFor(st2);
    const hi=vertAt(11,CLO,st2.G);
    ok(morphPos(hi,R2,1)[2]<=1.0001,
       'the A axis is sized from the CHIP kappa so the chip member fits');
    const steep=vertAt(11,1.4,st2.G);
    void steep;
    const st3=Object.assign({},DEFAULTS,{C:4.2,ymax:11});
    const R3=rangesFor(st3);
    ok(morphPos(vertAt(11,CLO,st3.G),R3,1)[2]>1,
       'and a steeper member than the chip exits it — clipped, as drawn');
  }

  // ---- only the chip gas's rows go on the sheet ----------------------
  {
    for(const gid of GAS_IDS){
      const M2=buildModel(Object.assign({},DEFAULTS,
        {gas:gid,G:GASD[gid].G,C:GASD[gid].C}));
      ok(M2.shown.length===GASD[gid].rows.length
         &&M2.shown.every(d=>d.id===gid),
         gid+': only its own rows are drawn — a row\'s shift follows its own '
         +'Gamma, so another gas does not belong on this sheet');
    }
    const Mfree=buildModel(Object.assign({},DEFAULTS,{gas:'',G:1.5,C:2.0}));
    ok(Mfree.shown.length===0,'and with the sliders free of any gas, none');
  }

  // ---- fibres: a width-less row must never acquire a width ----------
  {
    const M=buildModel(Object.assign({},DEFAULTS));
    const fib=M.data.filter(d=>d.fiber);
    ok(fib.length===7,'7 width-less rows are fibres (6 N2 + 1 Kr; argon dropped)');
    ok(fib.every(d=>d.obs[2]===0&&d.exc[2]===0),
       'and their width slot is a sentinel 0, never an interpolated value');
    ok(M.data.filter(d=>!d.fiber).length===9,
       '9 rows have widths (5 Kr + 4 SF6)');
  }

  // ---- Law IV corner arithmetic --------------------------------------
  close(PHI0*1,1.2182439443,5e-10,'Phi(0) absolute (scipy)');
  close(1/GASD.Kr.G,0.601243,1e-5,'Phi(inf) = 1/Gamma for Kr');
  close(1/GASD.N2.G,0.712927,1e-5,'and for N2 (relaxed rotation)');

  // ---- panels build clean for every view x every gas ----------------
  let clean=true, drew=0;
  for(const [v] of TABS) for(const gid of GAS_IDS.concat([''])){
    const s2=Object.assign({},DEFAULTS,{view:v,gas:gid});
    if(gid){ s2.G=GASD[gid].G; s2.C=GASD[gid].C; }
    const M2=buildModel(s2);
    const html=readout(M2)+eqbar(M2)+tagOf(M2)+(INFO[v]||'');
    if(/NaN|undefined|Infinity/.test(html)) clean=false;
    if(!isFinite(M2.kapC)||!isFinite(M2.res3)) clean=false;
    drew++;
  }
  ok(clean,'readout/eqbar/tag/INFO clean for '+drew+' view x gas combinations');

  // ---- no slider combination produces a non-finite geometry ---------
  let allFin=true;
  for(const G of [0.72,1.0,1.40267,5/3,1.82])
    for(const C of [CLO,7/3,2*DXKIN,4.2])
      for(const ym of [2,4.5,11])
        for(const t of [0,0.37,1]){
          const s2=Object.assign({},DEFAULTS,{G,C,ymax:ym,t,view:'morph'});
          const M2=buildModel(s2);
          for(const row of M2.rows) for(const v of row){
            const p=morphPos(v,M2.R,t);
            if(!p.every(isFinite)) allFin=false;
          }
          for(const d of M2.data){
            const p=morphPos(d,M2.R,t);
            if(!p.every(isFinite)) allFin=false;
          }
        }
  ok(allFin,'every (Gamma, C, yhat_max, t) combination gives finite geometry');
  {   // Gamma < 1 is a real gas here (SF6): B must go NEGATIVE, not NaN
    const s2=Object.assign({},DEFAULTS,{G:0.76215,C:2.06529});
    const M2=buildModel(s2);
    const sf=M2.data.filter(d=>d.id==='SF6');
    ok(sf.length===4&&sf.every(d=>isFinite(d.exc[1])),
       'SF6 rows finite at Gamma < 1 (its stored B comes from its own '
       +'per-row Gamma, which is > 1 — the vibration-frozen value)');
  }

  // ---- camera: the face snap really is near-orthographic ------------
  {
    const S2=makeScene({getContext:()=>({})});
    S2.st.view='mani';
    S2.face('charles');
    const c=S2.cam();
    ok(c.fov===FACE_FOV,'face snap narrows the fov');
    close(c.dist*Math.tan(c.fov/2),HOME_DIST*Math.tan(HOME_FOV/2),1e-9,
      'and dollies to keep the apparent size fixed (dolly-zoom)');
    // near-ortho check: two points at different depths on the same face
    // must project to (almost) the same screen x
    const B2=camBasis(c);
    c.W=800; c.H=600;
    const p1=project(c,B2,[0.5,-1,0.5]), p2=project(c,B2,[0.5,1,0.5]);
    ok(p1&&p2&&Math.abs(p1.x-p2.x)<0.01*c.W,
       'depth barely shifts screen x on the snapped face (~ortho)');
    const homeB=(()=>{ S2.resetView(); const cc=S2.cam(); cc.W=800; cc.H=600;
      return {cc,BB:camBasis(cc)}; })();
    const q1=project(homeB.cc,homeB.BB,[0.5,-1,0.5]);
    const q2=project(homeB.cc,homeB.BB,[0.5,1,0.5]);
    ok(q1&&q2&&Math.abs(q1.x-q2.x)>0.02*homeB.cc.W,
       'while the home camera is genuinely perspective');
    ok(S2.orbit(10,0)&&S2.cam().fov===HOME_FOV,
       'and orbiting leaves the snap');
  }

  // ---- the morph plays and wraps ------------------------------------
  {
    const S3=makeScene({getContext:()=>({})});
    S3.st.play=true; S3.st.view='morph'; S3.st.t=0;
    ok(S3.step(0.5)&&S3.st.t>0,'step advances t while playing');
    /* the advance must be PROPORTIONAL to dt, or the play speed is
       frame-rate dependent (a dropped dt passes any "t moved" test) */
    S3.st.t=0; S3.step(0.2); const a1=S3.st.t;
    S3.st.t=0; S3.step(0.4); const a2=S3.st.t;
    rel(a2,2*a1,1e-12,'and by dt, not per frame (0.4 s advances twice 0.2 s)');
    close(a1,0.2*0.35,1e-12,'at the stated 0.35 units/s (speed 1, absolute)');
    /* and the speed slider must actually scale it — asserting at the
       default speed of 1 tests nothing, which let a dropped *speed
       survive a 70-mutant sweep */
    S3.st.speed=2.5; S3.st.t=0; S3.step(0.2);
    close(S3.st.t,0.2*0.35*2.5,1e-12,'and the speed slider scales it (x2.5)');
    S3.st.speed=1;
    S3.st.t=0.99; S3.step(0.5);
    close(S3.st.t,0,1e-12,'and wraps to 0 at the end');
    S3.st.play=false;
    const t0=S3.st.t;
    ok(!S3.step(0.5)&&S3.st.t===t0,'and does nothing when paused');
  }

  ok(plain('&rsquo;&mdash;&ndash;&times;')==='’—–×','plain() decodes entities');
  {   // every string this file draws on canvas must be entity/tag free
    let bad=[];
    const scan=s=>{ const m=String(s).match(/&[a-z]+;|<[a-z/][^>]*>/g);
      if(m) bad=bad.concat(m); };
    for(const row of DICT) for(const c of row) scan(plain(c));
    const M4=buildModel(Object.assign({},DEFAULTS));
    for(const chart of ['obs','exc'])
      for(const k of ['xl','yl','zl']) scan(plain(M4.R[chart][k]));
    ok(bad.length===0,'no entity or tag reaches a canvas text op '
      +(bad.length?'('+bad.join(' ')+')':''));
  }

  /* ---- the state surface: it must be an EMBEDDING, not a graph over a
     parameter.  These mirror the 17-check design script one for one. */
  {
    const G=5/3, Ps=1.3;
    ok(Math.abs(gOf(0,7/3,G)-SQ)<1e-12,
       'surface apex height is the sum-rule theorem sqrt(pi/2e)');
    ok(Math.abs(gOf(0,CLO,1.09)-gOf(0,CHI,5/3))<1e-12,
       'and the apex is the same for every Gamma and every member');
    ok(Math.abs(gOf(1.7,2.1,G,Ps)-Ps*gOf(1.7,2.1,G))<1e-12,
       'the height is exactly linear in Psi');
    /* injectivity: s strictly up in yhat, w strictly up in C and down in yhat */
    let mono=true;
    for(let i=1;i<=60;i++){
      const ya=i*0.1, yb=ya+0.1;
      if(!(sOf(yb,G)>sOf(ya,G))) mono=false;
      if(!(wOf(ya,CHI)>wOf(ya,CLO))) mono=false;
      if(!(wOf(ya,2.3)>wOf(yb,2.3))) mono=false;
    }
    ok(mono,'the floor map (yhat, C) -> (s, w) is injective: the surface is '
            +'a genuine embedding, so (s, w) alone carries the whole state');
    /* the round trip that makes it a graph */
    let worst=0;
    for(let i=1;i<=40;i++){
      const yh=i*0.15, Cv=1.5+0.06*i, s=sOf(yh,G), w=wOf(yh,Cv);
      worst=Math.max(worst,Math.abs(Math.sqrt(Bof(s,G))/yh-1),
                     Math.abs((Aof(w)/Bof(s,G))/kap(Cv)-1));
    }
    ok(worst<1e-9,'and the round trip (yhat,C)->(s,w)->(yhat,C) closes to '
                  +worst.toExponential(1));
    /* the scanned gain axis must BRACKET the sheet -- a corners-only range
       would clip it, because g is not monotone in yhat */
    const stq={ymax:4.5,G:G,Psi:1,C:7/3};
    const sp=gSpan(stq);
    let lo=Infinity, hi=-Infinity;
    for(const Cv of [CLO,7/3,CHI])
      for(let i=0;i<=80;i++){
        const g=gOf(stq.ymax*i/80,Cv,G,1);
        lo=Math.min(lo,g); hi=Math.max(hi,g);
      }
    let hiB=-Infinity;
    for(let i=0;i<=80;i++) hiB=Math.max(hiB,gOf(stq.ymax*i/80,7/3,G,1));
    ok(sp[0]<=lo,'the gain axis floor is below the whole family');
    ok(sp[1]>=hiB&&sp[1]<hi,'and its ceiling clears the Boltzmann member but '
       +'deliberately clips the steeper ones, which would otherwise squash '
       +'the family into the bottom of the box');
    ok(lo<gOf(0,7/3,G),'and g really is NON-monotone in yhat (the low end '
       +'sits below the apex), which is why the axis is scanned not cornered');
    /* the chart is wired everywhere it must be */
    const R=rangesFor({ymax:4.5,G:G,C:7/3,Psi:1});
    let ordered=true, holds=true;
    for(const Gv of [0.76215,1.09,1.4,5/3]){
      const Rv=rangesFor({ymax:4.5,G:Gv,C:7/3,Psi:1});
      if(!(Rv.srf.x[1]>Rv.srf.x[0]&&Rv.srf.z[1]>Rv.srf.z[0])) ordered=false;
      for(let i=0;i<=20;i++){
        const sv=sOf(4.5*i/20,Gv);
        if(sv<Rv.srf.x[0]||sv>Rv.srf.x[1]) holds=false;
      }
    }
    ok(ordered,'the srf box stays well-ordered for every Gamma, INCLUDING '
       +'Gamma < 1 where the shift falls with yhat instead of rising');
    ok(holds,'and the shift axis contains the whole sheet at every Gamma');
    const v=vertAt(1.4,2.2,G,Ps);
    ok(v.srf&&Math.abs(v.srf[2]-gOf(1.4,2.2,G,Ps))<1e-12
       &&Math.abs(v.srf[0]-sOf(1.4,G))<1e-12,
       'vertAt carries the srf chart and it agrees with gOf');
    ok(TABS.some(x=>x[0]==='surf')&&CAM_HOMES.surf!==undefined,
       'the view is registered in TABS and has a camera home');
  }
  console.log(pass+' passed, '+failN+' failed');
  if(failN>0) throw new Error(failN+' self-test failure(s)');
  return true;
}

if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}

</script>
