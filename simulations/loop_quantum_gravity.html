  withState({view:'knit'},()=>{ const s=readoutHTML(buildModel()), K=buildModel().K; has(s,'8 &times; 8 plaquettes','the mesh'); has(s,'the loop round 4 &times; 4','the block');
    close(K.hol,REF.knit.data.H['1.0'].blocks['8,4,2,2'][0],1e-12,'the default block’s loop'); ok(K.cancel<1e-14,'cancels'); });
  withState({view:'weave'},()=>{ const s=readoutHTML(buildModel()); has(s,'linked pairs','the chain mail'); has(s,'>'+REF.scale.cases['288,2,1'].linked+'<','the default’s linked pairs'); has(s,'rings crossing it','the count');
    has(s,'the uncertainty principle','the uncertainty rows'); has(s,fmt(REF.unc.default[2],4)+' rad','the default’s Δξ'); has(s,'0.5000 &ge; 0.5000','its product at the floor'); });
  withState({view:'quanta'},()=>{ const s=readoutHTML(buildModel()); has(s,'>20<','20 levels below 4 units'); has(s,'5.1700','a½ in Planck areas'); has(s,'1.351&times;10<sup>&minus;69</sup>','in m²'); });
  withState({view:'quanta',gam:'GM'},()=>{ const Q=buildModel().Q; close(Q.g,GAMMA.GM,0,'the Ghosh–Mitra chip'); close(Q.gap,REF.gamma.area_gap.GM,1e-14,'moves the gap'); });
  withState({view:'meso'},()=>{ const s=readoutHTML(buildModel()), R=REF.meso.sheets['288,2,1']; has(s,'>mesoscopic<','the mesoscale’s regime');
    has(s,fmt(R.lx,1)+' l<sub>P</sub>, '+sigf(100*R.Ex,3)+' %','the balance ℓ* and the error there'); has(s,fmt(R.Reff,1)+' l<sub>P</sub>','the curvature radius');
    has(s,'2.27 l<sub>P</sub>','one quantum a cell'); has(s,'0.32 mm','Earth’s ℓ* in the readout'); has(s,'2.2 nm','a solar-mass black hole’s');
    has(s,'>'+fmt(R.F[R.Ls.indexOf(8)],3)+'<','the measured F in cells of 8'); has(tagHTML(buildModel()),'cells of side ℓ = 8','the tag'); });
  withState({view:'meso',ell:1},()=>{ has(readoutHTML(buildModel()),'>microscopic<','ℓ = 1 is microscopic in the readout'); });
  withState({view:'meso',ell:100},()=>{ has(readoutHTML(buildModel()),'>macroscopic<','ℓ = 100 is macroscopic'); });
  withState({view:'meso',eps:0},()=>{ const s=readoutHTML(buildModel()); has(s,'none: no curvature','flat: no balance'); has(s,'&infin; (flat)','flat: no curvature radius'); });
  withState({view:'quanta',gam:'bogus'},()=>{ eq(buildModel().Q.gid,'M','an unknown γ falls back to Meissner’s'); });
  withState({},()=>{ for(const v of TABS){ ST.view=v[0]; const M=buildModel(); ok(eqbarHTML(M).length>100&&!/NaN|undefined/.test(readoutHTML(M)+eqbarHTML(M)+tagHTML(M)),v[0]+' readout, bar and tag are clean'); } });
  { let longest=''; for(const v of TABS) for(const over of [{},{H:2,r:0.05,N:40,k:40,rho:4,eps:2,Lsq:64,nc:32,X:12,gam:'ABCK',sheet:0,sq:1.5},{H:0,N:1,k:1,rho:1,eps:0,Lsq:1,nc:1,X:2,sq:-1.5}]) withState(Object.assign({view:v[0]},over),()=>{
      const s=readoutHTML(buildModel()); const re=/<tr><td>(.*?)<\/td>/g; let m; while((m=re.exec(s))) if(plain(m[1]).length>longest.length) longest=plain(m[1]); });
    ok(longest.length<=34,'every readout label fits ("'+longest+'", '+longest.length+')'); }

  /* ---------- G. the pointer and the clock ---------- */
  withState({view:'loop'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='rplot'); ok(!!h,'the loop plots are live'); if(h){ ok(S.pointer('down',h.b.x+h.b.w*0.4,h.b.y+10),'a press on a plot'); close(ST.r,1.2,1e-9,'sets r = 1.2 (0.4 of the way from 0 to 3)');
      ok(S.pointer('move',h.b.x+h.b.w*0.1,h.b.y+10),'a drag'); close(ST.r,0.3,1e-9,'moves it'); ok(S.pointer('up',0,0),'release refreshes'); }
    const c=HIT.find(x=>x.kind==='cam'); ok(S.pointer('down',c.b.x+20,c.b.y+40),'the 3-D view grabs the camera'); S.pointer('move',c.b.x+80,c.b.y+40); ok(ST.camTheta<DEFAULTS.camTheta,'a drag turns it');
    S.pointer('move',c.b.x+80,c.b.y+4000); ok(ST.camPhi===1.45,'clamped at 1.45'); ok(!S.pointer('up',0,0),'release'); });
  withState({view:'knit'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const q=KNIT_PICK.find(p=>p.i===6&&p.j===1); ok(!!q,'plaquette (6, 1) is drawn and pickable');
    if(q){ const cx=q.pr.reduce((s,p)=>s+p.x,0)/q.pr.length, cy=q.pr.reduce((s,p)=>s+p.y,0)/q.pr.length, hit=KNIT_PICK.find(p=>inPoly(p.pr,cx,cy));
      ok(S.pointer('down',cx,cy),'a click on it'); close(ST.bx,hit?(knitGrid(1,8).xs[hit.i]+knitGrid(1,8).xs[hit.i+1])/2:NaN,1e-12,'moves the block there');
      const K=buildModel().K; ok(K.blk.i0<=hit.i&&hit.i<K.blk.i0+4&&K.blk.j0<=hit.j&&hit.j<K.blk.j0+4&&(K.blk.i0!==2||K.blk.j0!==2),'the block now holds that plaquette ('+hit.i+','+hit.j+' in the block at '+K.blk.i0+','+K.blk.j0+')'); S.pointer('up',0,0); } });
  withState({view:'weave'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='Lplot'); ok(!!h,'the ratio plot is live'); if(h){ S.pointer('down',h.b.x+h.b.w*0.5,h.b.y+5); eq(ST.Lsq,16,'the middle of a log axis to 256 is L = 16'); S.pointer('move',h.b.x1,h.b.y+5); eq(ST.Lsq,256,'the right end is the 256-wide map'); S.pointer('up',0,0); }
    const c=HIT.find(x=>x.kind==='cam'); S.pointer('down',c.b.x+30,c.b.y+30); S.pointer('move',c.b.x+30,c.b.y-3000); ok(ST.wPhi===0.12,'the weave camera stays above the plane'); S.pointer('up',0,0); });
  withState({view:'quanta'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='gplot'); ok(!!h,'the γ plot is live'); if(h){ const X=g=>h.b.x+h.b.w*(g-h.xlo)/(h.xhi-h.xlo);
      S.pointer('down',X(0.13),h.b.y+20); eq(ST.gam,'ABCK','a click near 0.127 picks ABCK'); S.pointer('down',X(0.28),h.b.y+20); eq(ST.gam,'GM','near 0.274 Ghosh–Mitra'); S.pointer('down',X(0.22),h.b.y+20); eq(ST.gam,'M','near 0.2375 Meissner'); } });
  withState({view:'meso'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='eplot'); ok(!!h,'the graininess plot is live'); if(h){ S.pointer('down',h.b.x+h.b.w*0.5,h.b.y+5); eq(ST.ell,11,'the middle of a log axis to 128 is ℓ = √128 → 11');
      ok(S.pointer('move',h.b.x+h.b.w*0.25,h.b.y+5),'a drag'); eq(ST.ell,3,'a quarter of the way is ℓ = 128^¼ → 3'); S.pointer('move',h.b.x1,h.b.y+5); eq(ST.ell,128,'the right end is half the map');
      ok(!S.pointer('move',h.b.x1+40,h.b.y+5),'past the end nothing changes'); ok(S.pointer('up',0,0),'release refreshes'); } });
  withState({view:'loop',frames:25},()=>{ close(SIM.phi,25*(TAU/4)*0.012,1e-12,'carrying: φ advances at 2π per 4 units of clock, 0.012 a frame at speed 3'); });
  withState({view:'loop',carry:false,frames:25},()=>{ eq(SIM.phi,0,'not carrying: the arrow waits'); });
  withState({view:'knit',frames:25},()=>{ eq(SIM.t,0,'the other views are still'); });
  withState({view:'loop',frames:400},()=>{ ok(SIM.phi>=0&&SIM.phi<TAU,'φ wraps into [0, 2π)'); });

  /* ---------- H. the prose numbers ---------- */
  { const I=INFO, D=DERIV;
    has(I.loop,'turns by '+fmt(REF.loop.max_default,4)+' rad = '+fmt(REF.loop.max_default*RAD,2)+'°','loop prose: the angle'); has(I.loop,'is 0.925 at r = 0.2 and 0.9988 at r = 0.025','loop prose: small loops');
    close(PX.small[0],REF.loop.small_ratio['0.2'],1e-12,'quoted small-loop ratio'); ok(PX.agree<1e-8,'quoted agreement');
    has(I.knit,'both give '+fmt(REF.knit.data.H['1.0'].blocks['8,4,2,2'][0],6)+' rad','knit prose: the block'); has(I.knit,'the RMS miss is '+sigf(REF.knit.data.H['1.0'].rms[7],3)+' with 8','knit prose: RMS at 8');
    has(I.knit,sigf(REF.knit.data.H['1.0'].rms[39],3)+' with 40','knit prose: RMS at 40'); has(I.knit,'(slope '+fmt(Math.log(REF.knit.data.H['1.0'].rms[19]/REF.knit.data.H['1.0'].rms[39])/Math.log(2),2)+' between 20 and 40)','knit prose: the slope');
    has(I.weave,'a½ = 4√3 πγ = 5.170 Planck areas','weave prose: a½'); has(I.weave,'n = '+fmt(REF.weave.data.cases['2,0'].n,4)+' rings','weave prose: density');
    has(I.weave,'crossed '+REF.scale.cases['288,2,1'].counts['24']+' times','weave prose: the default count'); has(I.weave,REF.scale.cases['288,2,1'].linked+' linked pairs among the '+REF.scale.cases['288,2,1'].kept+' rings','weave prose: linked (curved)');
    has(I.weave,REF.scale.cases['288,2,0'].linked+' among '+REF.scale.cases['288,2,0'].kept+' in flat space','weave prose: linked (flat)');
    { const r=REF.scale.cases['1152,2,1']; has(I.weave,'crossed '+r.counts['1024']+' times, '+fmt(r.counts['1024']*A_HALF/r.Acl['1024'],4)+' of its classical area, where the shot noise is ±'+fmt(100*Math.sqrt(2*A_HALF/r.Acl['1024']),2)+' %','weave prose: the 1152 sheet'); }
    has(I.weave,'('+[72,144,288,576,1152].map(W=>REF.scale.cases[W+',2,1'].kept).join(', ')+' rings','weave prose: rings on every sheet');
    has(I.weave,'('+fmt(REF.unc.default_nbar,1)+' quanta) both are '+fmt(100*REF.unc.default[1]/REF.unc.default[0],1)+' %','weave prose: the default’s uncertainty'); has(I.weave,'for a million quanta 0.071 %','weave prose: a million quanta');
    has(I.quanta,REF.spec.counts['2']+' distinct values below 2 units','quanta prose: 4'); has(I.quanta,REF.spec.counts['4']+' below 4, '+REF.spec.counts['12']+' below 12','quanta prose: 20, 1395');
    has(I.quanta,'solved here: '+fmt(REF.gamma.M,14),'quanta prose: γ solved'); has(I.quanta,'the root is '+fmt(REF.gamma.GM,7),'quanta prose: GM root'); has(I.quanta,'quotes 0.273985635','quanta prose: Meissner’s aside');
    has(I.quanta,'1.35 × 10⁻⁶⁹ m²','quanta prose: the gap in m²'); has(I.quanta,'A square metre is 3.8 × 10⁶⁹ Planck areas','quanta prose: a square metre'); has(I.quanta,'5.391 × 10⁻⁴⁴ s','quanta prose: t_P');
    has(D.weave,'var N/&lang;N&rang; = '+fmt(REF.weave.data.var_ratio['16.0'][2],2),'weave derivation: the variance ratio');
    { const I2=I.meso, R=REF.meso.sheets, d=R['288,2,1'], B=R['1152,2,1'], E=REF.meso.ensemble['144'], re=REF.meso.real, f=[8,10,12,16,20,24,32].map(l=>d.F[d.Ls.indexOf(l)]);
      has(I2,'below ℓ = √a½ = 2.27 Planck lengths','meso prose: one quantum a cell');
      has(I2,'F = '+fmt(d.F[0],2)+' in cells of 1 and '+fmt(Math.min(...f),1)+' to '+fmt(Math.max(...f),1)+' in cells of 8 to 32','meso prose: F');
      has(I2,'falls from '+fmt(B.m3[0],1)+' in cells of 1 to '+fmt(B.m3[B.Ls.indexOf(8)],1)+' in cells of 8 (12 quanta) and '+fmt(B.m3[B.Ls.indexOf(32)],2)+' in cells of 32','meso prose: the skewness on the largest sheet');
      has(I2,'balance at ℓ* = '+fmt(d.lx,0)+' Planck lengths, where the field is read to '+fmt(100*d.Ex,1)+' %','meso prose: the default balance');
      has(I2,'R = w√((1 + ε)/ε) = '+fmt(d.Reff,0)+', so the mesoscale runs from 2.3 to '+fmt(d.Reff,0),'meso prose: R and the window');
      has(I2,'(R = '+fmt(B.Reff,0)+') ℓ* = '+fmt(B.lx,0)+' and the error is '+fmt(100*B.Ex,1)+' %','meso prose: the largest sheet');
      ok(R['72,2,1'].lx>R['72,2,1'].Reff&&R['144,2,1'].lx>R['144,2,1'].Reff&&d.lx<d.Reff&&B.lx<B.Reff,'the 72 and 144 sheets balance beyond R, the 288 and 1152 inside it, as the prose says');
      has(I2,'Over '+E['2'].n+' independent weaves of the 144 sheet','meso prose: the ensemble');
      has(I2,'to '+fmt(100*E.summary.max_abs_dev,0)+' % at every cell side from 2 to 32 (the statistical uncertainty is '+fmt(100*E.summary.se,0)+' %)','meso prose: its agreement');
      ok(E.summary.max_abs_dev<2*E.summary.se&&E.summary.max_abs_zbias<3,'the twin’s weaves agree with √(σ² + κ²) within two standard errors, and their bias with −κg');
      ok(REF.meso.seed_record.consecutive.F_top<1.55&&REF.meso.seed_record.scrambled.F_top>1.65,'the record: consecutive seeds gave the low F at the top, scrambled ones do not');
      has(I2,'R = √(c²r³/GM) = 2.4 × 10¹¹ m, so ℓ* is about 0.3 mm and the error there 2 × 10⁻³¹','meso prose: Earth');
      ok(Math.abs(re.earth.lx_m/3.23e-4-1)<0.01&&Math.abs(re.earth.Ex/2.10e-31-1)<0.01,'which rounds the twin’s 3.23 × 10⁻⁴ m and 2.10 × 10⁻³¹');
      has(I2,'R = √2 r<sub>s</sub> = 4.2 km and ℓ* is about 2 nm','meso prose: a solar-mass black hole');
      ok(Math.abs(re.bh1.R_m-4176.5)<0.1&&Math.abs(re.bh1.lx_m/2.158e-9-1)<0.001,'the twin: 4176.5 m and 2.158 nm');
      has(I2,'flatter than the ground under your feet: R = 4.2 × 10¹² m','meso prose: a 10⁹-solar-mass horizon');
      has(D.meso,'over '+E['2'].n+' independent weaves','meso derivation: the ensemble'); }
    for(const v in INFO) ok(!/NaN|undefined|Infinity/.test(INFO[v]+DERIV[v]),v+' prose has no NaN'); }

  /* ---------- I. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['loop',{view:'loop'},20],['loop tall small',{view:'loop',H:2,r:0.3,psi0:-120},8],['loop flat',{view:'loop',H:0,r:2},12],['loop wide',{view:'loop',r:3,H:1.5,frames:90},20],
    ['loop turned',{view:'loop',camTheta:0.7,camPhi:1.3,r:0.05},3],
    ['knit',{view:'knit'},60],['knit N=1',{view:'knit',N:1,k:1},4],['knit 40',{view:'knit',N:40,k:40},200],['knit corner',{view:'knit',N:3,k:2,bx:9,by:9,H:2},10],
    ['knit flat',{view:'knit',H:0,N:6,k:3},30],['knit 7 of 20',{view:'knit',N:20,k:7,bx:-1,by:0.6,camTheta:2,camPhi:1.2},200],
    ['weave',{view:'weave'},40],['weave 72',{view:'weave',sheet:0},40],['weave big rings',{view:'weave',rho:4,Lsq:64,nc:32,sheet:0},40],['weave tiny',{view:'weave',rho:1,Lsq:1,nc:1,eps:0,sq:-1.5},10],
    ['weave reroll',{view:'weave',seed:3,eps:2,wPhi:1.4,sheet:1,sq:1.5},40],['weave huge',{view:'weave',sheet:4,Lsq:1024,nc:64},40],
    ['quanta',{view:'quanta'},8],['quanta 12',{view:'quanta',X:12,gam:'ABCK'},8],['quanta 2',{view:'quanta',X:2,gam:'GM'},6],
    ['meso',{view:'meso'},1000],['meso micro',{view:'meso',ell:1},1000],['meso macro',{view:'meso',ell:128},1000],['meso 72',{view:'meso',sheet:0,ell:3},1000],
    ['meso flat',{view:'meso',eps:0,ell:4},1000],['meso rho4 eps2',{view:'meso',rho:4,eps:2,ell:30,seed:2},1000],['meso huge',{view:'meso',sheet:4,ell:100},1000],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      const floor=isNarrow(W)?1:minFills;
      ok(fills.length>=floor&&texts.length>=3,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+floor+'; '+texts.length+' texts)');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
