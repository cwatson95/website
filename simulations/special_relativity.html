function clipPolyBox(pts,b){
  const edges=[[p=>p[0]>=b.x,(p,q)=>{ const t=(b.x-p[0])/(q[0]-p[0]); return [b.x,p[1]+t*(q[1]-p[1])]; }],
               [p=>p[0]<=b.x1,(p,q)=>{ const t=(b.x1-p[0])/(q[0]-p[0]); return [b.x1,p[1]+t*(q[1]-p[1])]; }],
               [p=>p[1]>=b.y,(p,q)=>{ const t=(b.y-p[1])/(q[1]-p[1]); return [p[0]+t*(q[0]-p[0]),b.y]; }],
               [p=>p[1]<=b.y1,(p,q)=>{ const t=(b.y1-p[1])/(q[1]-p[1]); return [p[0]+t*(q[0]-p[0]),b.y1]; }]];
  let out=pts;
  for(const [inside,cut] of edges){ const src=out; out=[];
    for(let i=0;i<src.length;i++){ const p=src[i], q=src[(i+1)%src.length];
      if(inside(p)){ out.push(p); if(!inside(q)) out.push(cut(p,q)); } else if(inside(q)) out.push(cut(p,q)); }
    if(!out.length) break; }
  return out;
}
/* an arrow from P to Q clipped to a box: the shaft to the edge, the head only when Q is inside */
function arrowClip(ctx,b,P,Q,col,lw){
  const c=clipPolyBox([P,Q,Q],b);
  if(c.length<2) return;
  const inQ=Q[0]>=b.x&&Q[0]<=b.x1&&Q[1]>=b.y&&Q[1]<=b.y1;
  if(inQ) arrowPx(ctx,P[0],P[1],Q[0],Q[1],col,lw); else sLine(ctx,[c[0],c[1]],col,lw);
}
/* a linear x axis and a log y axis (1-2-5 ticks where they fit, else decades) */
function linLogPlot(ctx,b,x0,x1,ylo,yhi,opt){
  const o=Object.assign({},opt||{}), ly0=Math.log10(ylo), ly1=Math.log10(yhi);
  const t125=logTicks125(ylo,yhi), yt=(t125.length*16<=b.h?t125:logTicks(ylo,yhi)).map(Math.log10);
  if(!o.xfmt) o.xfmt=decFmt(x0,x1,o.nx||6);
  axesT(ctx,b,x0,x1,ly0,ly1,Object.assign(o,{yticks:yt,yfmt:o.yfmt||(l=>logLab(Math.pow(10,l)))}));
  return {b,X:x=>b.x+b.w*(x-x0)/(x1-x0),Y:v=>b.y1-b.h*(Math.log10(v)-ly0)/(ly1-ly0),
    line:(xs,vs,col,lw,dash)=>polyline(ctx,b,xs,vs.map(v=>v>0?Math.log10(v):NaN),x0,x1,ly0,ly1,col,lw,dash)};
}
/* a linear axis's scale: the power of ten that puts its largest value between 1 and 1000, and the title's suffix
   (tick labels stay short: 0.00040 ran into the axis title) */
/* a tick label with the fewest decimals (to n) and a true minus sign */
function tickFmt(x,n){ return x===0?'0':String(+x.toFixed(n===undefined?2:n)).replace('-','−'); }
function axScale(max){ if(!(max>0)||(max>=0.01&&max<1e4)) return {f:1,s:''}; const e=3*Math.floor(Math.log10(max)/3); return e===0?{f:1,s:''}:{f:Math.pow(10,e),s:' × '+pow10(e)}; }
/* a legend as one line of swatches above a plot's title, registered; what does not fit is counted in KEY_DROPS */
function keyRow(ctx,x,y,items,maxW){
  ctx.font=SM_FONT; let X=x;
  for(let i=0;i<items.length;i++){ const [col,txt,dash]=items[i], t=plain(txt), w=ctx.measureText(t).width+24;
    if(X+w>x+maxW){ KEY_DROPS+=items.length-i; break; }
    ctx.beginPath(); ctx.moveTo(X,y); ctx.lineTo(X+14,y); ctx.strokeStyle=col; ctx.lineWidth=2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#9aa2b4'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(t,X+18,y);
    const bx=[X,y-7,X+w-6,y+7]; bx.t=t; bx.plate=true; bx.seq=++DRAW_SEQ; LABELS.push(bx);
    X+=w; }
}
/* a vertical marker line across a plot, registered (a label drawn across one is a test failure) */
function vMark(ctx,b,X,col,dash,lw){
  if(!(X>=b.x-0.5&&X<=b.x1+0.5)) return false;
  ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.strokeStyle=col; ctx.lineWidth=lw||1; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]);
  MARKS.push({X,y0:b.y,y1:b.y1,seq:++DRAW_SEQ});
  return true;
}
/* shade the part of a plot box right of X (a forbidden region), under everything else */
function shadeRight(ctx,b,X,col){ const x0=clamp(X,b.x,b.x1); if(x0<b.x1){ ctx.fillStyle=col; ctx.fillRect(x0,b.y+0.5,b.x1-x0,b.h-1); } }
/* an arc of the unit circle as an explicit polyline (the recorder keeps polylines, not arcs under a transform) */
function arcPts(cx,cy,r,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; p.push([cx+r*Math.cos(a),cy-r*Math.sin(a)]); } return p; }

/* ================================================================== *
 *  drawing primitives of this page: clocks, the air, the muons, the   *
 *  jet and its hangar, and the Minkowski diagram both spacetime views *
 *  share.  Everything is drawn as explicit polygons in canvas pixels  *
 *  (the recorder keeps no ellipses or transformed arcs).              *
 * ================================================================== */
/* a clock: a dial whose hand turns once per `period`, and its reading printed beside it (registered) */
function clockDial(ctx,W,H,x,y,r,reading,period,col,txt,side){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle='rgba(7,11,24,0.9)'; ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=1.3; ctx.stroke();
  for(let k=0;k<12;k++){ const a=k*TAU/12; ctx.beginPath(); ctx.moveTo(x+0.78*r*Math.sin(a),y-0.78*r*Math.cos(a));
    ctx.lineTo(x+0.95*r*Math.sin(a),y-0.95*r*Math.cos(a)); ctx.strokeStyle=rgba(col,0.6); ctx.lineWidth=0.8; ctx.stroke(); }
  const a=TAU*(isFinite(reading)&&period>0?((reading/period)%1+1)%1:0);
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+0.82*r*Math.sin(a),y-0.82*r*Math.cos(a)); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke();
  LABELS.push([x-r,y-r,x+r,y+r]);
  if(txt!==undefined&&txt!==null){ const s=side||'right';
    if(s==='right') lab(ctx,W,H,x+r+4,y,txt,col,SM_FONT,'left','middle',PLATE_FIX);
    else if(s==='left') lab(ctx,W,H,x-r-4,y,txt,col,SM_FONT,'right','middle',PLATE_FIX);
    else if(s==='below') lab(ctx,W,H,x,y+r+3,txt,col,SM_FONT,'center','top',PLATE_FIX);
    else lab(ctx,W,H,x,y-r-3,txt,col,SM_FONT,'center','bottom',PLATE_FIX); }
}
/* a period for a clock's hand: one turn per a round number near the span it will show */
function dialPeriod(span){ if(!(span>0)) return 1; const e=Math.pow(10,Math.floor(Math.log10(span))); const m=span/e; return (m<2?2:m<5?5:10)*e; }

/* a muon: a filled dot; its twin without time dilation: a hollow ring; a decay: a small burst, and its mark */
function muonDot(ctx,x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=col; ctx.fill(); }
function ghostDot(ctx,x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.strokeStyle=col; ctx.lineWidth=1.1; ctx.stroke(); }
function decayBurst(ctx,x,y,age,col){ const r=3+9*age, a=1-age; if(a<=0) return;
  for(let k=0;k<6;k++){ const th=k*TAU/6+0.3; ctx.beginPath(); ctx.moveTo(x+0.4*r*Math.cos(th),y+0.4*r*Math.sin(th));
    ctx.lineTo(x+r*Math.cos(th),y+r*Math.sin(th)); ctx.strokeStyle=rgba(col,0.85*a); ctx.lineWidth=1; ctx.stroke(); } }
function decayMark(ctx,x,y,col){ ctx.beginPath(); ctx.moveTo(x-2,y-2); ctx.lineTo(x+2,y+2); ctx.moveTo(x-2,y+2); ctx.lineTo(x+2,y-2);
  ctx.strokeStyle=col; ctx.lineWidth=1; ctx.stroke(); }

/* the air as horizontal bands shaded by density (premixed and opaque: abutting translucent bands read as corduroy),
   from altitude z0 to z1, drawn through a vertical map Y(z) and between pixel columns x0..x1 */
function airBands(ctx,x0,x1,Y,z0,z1,n,clip){
  const r0=airRho(0);
  for(let i=0;i<n;i++){ const za=z0+(z1-z0)*i/n, zb=z0+(z1-z0)*(i+1)/n, rho=airRho((za+zb)/2);
    const f=Math.pow(rho/r0,0.8);
    let ya=Math.min(Y(za),Y(zb)), yb=Math.max(Y(za),Y(zb));
    if(clip){ if(yb<clip.y||ya>clip.y1) continue; ya=Math.max(ya,clip.y); yb=Math.min(yb,clip.y1); }
    ctx.fillStyle=airShade(f); ctx.fillRect(x0,ya-0.5,x1-x0,yb-ya+1); }
}
const airShade=f=>mix('#070b18','#24577f',0.06+0.94*f);
function groundBand(ctx,x0,x1,y,h){ ctx.fillStyle=COL.ground; ctx.fillRect(x0,y,x1-x0,h);
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.strokeStyle='#6b5a3c'; ctx.lineWidth=1.2; ctx.stroke(); }

/* ---- the jet: a side view, u from the tail (0) to the nose (1), v up; its parts as polygons ---- */
const JET_PARTS=[
  /* the fuselage */ [[0.03,0.06],[0.10,0.13],[0.84,0.13],[0.93,0.10],[0.985,0.045],[1.0,0.0],[0.985,-0.04],[0.93,-0.09],[0.80,-0.12],[0.16,-0.12],[0.06,-0.02]],
  /* the fin */      [[0.035,0.09],[0.0,0.44],[0.075,0.44],[0.20,0.13]],
  /* the wing */     [[0.36,-0.09],[0.58,-0.09],[0.52,-0.15],[0.33,-0.15]],
  /* an engine */    [[0.42,-0.15],[0.53,-0.15],[0.535,-0.23],[0.425,-0.23]],
  /* the tailplane */[[0.02,0.05],[0.14,0.05],[0.10,0.02],[0.0,0.02]]];
const JET_VLO=-0.23, JET_VHI=0.44;
/* draw it with u mapped to canvas x by X(u) (a contraction, or the crash's two pieces) and v to canvas y by Yv(v) */
function drawJet(ctx,X,Yv,col,fill,box){
  for(const part of JET_PARTS){
    let pts=part.map(([u,v])=>[X(u),Yv(v)]);
    if(box) pts=clipPolyBox(pts,box);
    if(pts.length<3) continue;
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.2; ctx.stroke(); }
}
/* the hangar from the side: walls and a gabled roof from canvas x0 to x1, the floor at yG, wall height hw px; a shut
   door is a solid panel, an open one is rolled up under the eaves */
function drawHangar(ctx,x0,x1,yG,hw,entranceShut,exitOpen,box){
  const yW=yG-hw, yR=yG-hw*1.28, xm=(x0+x1)/2;
  const roof=clipPolyBox([[x0-3,yW],[xm,yR],[x1+3,yW]],box);
  if(roof.length>=2){ ctx.beginPath(); ctx.moveTo(roof[0][0],roof[0][1]); for(let i=1;i<roof.length;i++) ctx.lineTo(roof[i][0],roof[i][1]);
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1.6; ctx.stroke(); }
  /* the back wall, seen through: a faint fill */
  const back=clipPolyBox([[x0,yW],[x1,yW],[x1,yG],[x0,yG]],box);
  if(back.length>=3){ ctx.beginPath(); ctx.moveTo(back[0][0],back[0][1]); for(let i=1;i<back.length;i++) ctx.lineTo(back[i][0],back[i][1]); ctx.closePath();
    ctx.fillStyle=mix('#070b18',COL.struct,0.07); ctx.fill(); }
  for(const [x,shut] of [[x0,entranceShut],[x1,!exitOpen]]){
    if(x<box.x-2||x>box.x1+2) continue;
    if(shut){ ctx.fillStyle=mix('#070b18',COL.struct,0.55); ctx.fillRect(x-2.5,yW,5,hw); }
    else { ctx.fillStyle=mix('#070b18',COL.struct,0.55); ctx.fillRect(x-2.5,yW,5,hw*0.14);
      ctx.beginPath(); ctx.moveTo(x,yW+hw*0.14); ctx.lineTo(x,yG); ctx.setLineDash([2,4]); ctx.strokeStyle=rgba(COL.struct,0.5); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]); }
  }
}
/* a short flash at an event: rays round (x, y), fading with age in [0, 1] */
function eventFlash(ctx,x,y,age,col){ if(!(age>=0&&age<1)) return; const r=6+18*age;
  for(let k=0;k<8;k++){ const th=k*TAU/8; ctx.beginPath(); ctx.moveTo(x+0.35*r*Math.cos(th),y+0.35*r*Math.sin(th));
    ctx.lineTo(x+r*Math.cos(th),y+r*Math.sin(th)); ctx.strokeStyle=rgba(col,0.9*(1-age)); ctx.lineWidth=1.4; ctx.stroke(); } }

/* ---- the Minkowski diagram ----
   pts: the points that must fit; the map has one scale for x and ct (light runs at 45°).  Returns X(x), Y(ct), the
   scale and the window in world units.  The axes: x across, ct up, with ticks in the units the caller names. */
function minkFit(b,pts,padFrac){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const [ct,x] of pts){ if(!isFinite(ct)||!isFinite(x)) continue; x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,ct); y1=Math.max(y1,ct); }
  const pf=padFrac===undefined?0.08:padFrac;
  let dx=x1-x0, dy=y1-y0; const big=Math.max(dx,dy,1e-9);
  x0-=pf*big; x1+=pf*big; y0-=pf*big; y1+=pf*big; dx=x1-x0; dy=y1-y0;
  const s=Math.min(b.w/dx,b.h/dy);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const X=x=>b.x+b.w/2+(x-cx)*s, Y=ct=>b.y+b.h/2-(ct-cy)*s;
  return {X,Y,s,win:{x0:cx-b.w/2/s,x1:cx+b.w/2/s,y0:cy-b.h/2/s,y1:cy+b.h/2/s},b};
}
/* a world segment (ct, x) to (ct, x) drawn clipped to the diagram's box, recorded */
function minkSeg(ctx,M,a,b,col,lw,dash){
  const c=clipToWin([a[1],a[0]],[b[1],b[0]],{x0:M.win.x0,x1:M.win.x1,y0:M.win.y0,y1:M.win.y1});
  if(!c) return false;
  ctx.beginPath(); ctx.moveTo(M.X(c[0][0]),M.Y(c[0][1])); ctx.lineTo(M.X(c[1][0]),M.Y(c[1][1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.3; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(M.X(c[0][0]),M.Y(c[0][1]),M.X(c[1][0]),M.Y(c[1][1]));
  return true;
}
function minkPath(ctx,M,pts,col,lw,dash){ let n=0; for(let i=0;i<pts.length-1;i++) if(minkSeg(ctx,M,pts[i],pts[i+1],col,lw,dash)) n++; return n; }
/* a filled quadrilateral of events, clipped to the box (a band of worldlines, premixed and opaque) */
function minkFill(ctx,M,pts,fill){
  const px=clipPolyBox(pts.map(([ct,x])=>[M.X(x),M.Y(ct)]),M.b);
  if(px.length<3) return;
  ctx.beginPath(); ctx.moveTo(px[0][0],px[0][1]); for(let i=1;i<px.length;i++) ctx.lineTo(px[i][0],px[i][1]); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
}
const inMink=(M,ct,x)=>x>=M.win.x0&&x<=M.win.x1&&ct>=M.win.y0&&ct<=M.win.y1;
/* the frame of a diagram: its box, the 45° light-line grid faint behind, and ticks on its two axes */
function minkFrame(ctx,M,xUnit,xFac,tUnit,tFac,xTitle,tTitle){
  const b=M.b;
  frame(ctx,b,'#242a3a');
  ctx.save();
  /* the light lines: every grid step, both slopes */
  const span=Math.max(M.win.x1-M.win.x0,M.win.y1-M.win.y0), st=ticksFor(0,span,6); const step=st.length>1?st[1]-st[0]:span/6;
  for(let k=Math.floor((M.win.y0-M.win.x1)/step)-1;k<=Math.ceil((M.win.y1-M.win.x0)/step)+1;k++){
    const c0=k*step;                                     /* ct − x = c0 */
    const s1=clipToWin([M.win.x0,M.win.x0+c0],[M.win.x1,M.win.x1+c0],M.win);
    if(s1){ ctx.beginPath(); ctx.moveTo(M.X(s1[0][0]),M.Y(s1[0][1])); ctx.lineTo(M.X(s1[1][0]),M.Y(s1[1][1])); ctx.strokeStyle='#12172a'; ctx.lineWidth=1; ctx.stroke(); }
  }
  for(let k=Math.floor((M.win.y0+M.win.x0)/step)-1;k<=Math.ceil((M.win.y1+M.win.x1)/step)+1;k++){
    const c0=k*step;                                     /* ct + x = c0 */
    const s1=clipToWin([M.win.x0,c0-M.win.x0],[M.win.x1,c0-M.win.x1],M.win);
    if(s1){ ctx.beginPath(); ctx.moveTo(M.X(s1[0][0]),M.Y(s1[0][1])); ctx.lineTo(M.X(s1[1][0]),M.Y(s1[1][1])); ctx.strokeStyle='#12172a'; ctx.lineWidth=1; ctx.stroke(); }
  }
  ctx.restore();
  /* ticks: x along the bottom, t up the left, each in its own unit (the caller's factor: world → unit) */
  const xt=ticksFor(M.win.x0*xFac,M.win.x1*xFac,b.w<300?3:5), tt=ticksFor(M.win.y0*tFac,M.win.y1*tFac,b.h<200?3:5);
  const xf=decFmt(M.win.x0*xFac,M.win.x1*xFac,b.w<300?3:5), tf=decFmt(M.win.y0*tFac,M.win.y1*tFac,b.h<200?3:5);
  ctx.font=SM_FONT; ctx.fillStyle='#6f7789';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(const v of xt){ const Xp=M.X(v/xFac); if(Xp<b.x+1||Xp>b.x1-1) continue; ctx.fillText(xf(v),Xp,b.y1+4);
    const w=plain(xf(v)).length*10.5*0.52; LABELS.push([Xp-w/2,b.y1+4,Xp+w/2,b.y1+4+12]); }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const v of tt){ const Yp=M.Y(v/tFac); if(Yp<b.y+6||Yp>b.y1-6) continue; ctx.fillText(tf(v),b.x-5,Yp);
    const w=plain(tf(v)).length*10.5*0.52; LABELS.push([b.x-5-w,Yp-6,b.x-5,Yp+6]); }
  ctx.font=LAB_FONT; ctx.fillStyle='#8b93a6'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(plain(xTitle),b.x+b.w/2,b.y1+19); LABELS.push([b.x+b.w/2-plain(xTitle).length*11*0.26,b.y1+19,b.x+b.w/2+plain(xTitle).length*11*0.26,b.y1+32]);
  ctx.save(); ctx.translate(b.x-38,b.y+b.h/2); ctx.rotate(-PI/2); ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(plain(tTitle),0,0); ctx.restore();
}
/* a dot at an event, with its name (registered, shifted only if it must) */
function minkEvent(ctx,M,W,H,e,name,col,dx,dy){
  if(!inMink(M,e[0],e[1])) return false;
  const X=M.X(e[1]), Y=M.Y(e[0]); dot(ctx,X,Y,4,col,'#fff',1);
  LABELS.push([X-4,Y-4,X+4,Y+4]);
  if(name) lab(ctx,W,H,X+(dx===undefined?7:dx),Y+(dy===undefined?-9:dy),name,col,SM_FONT,(dx||7)<0?'right':'left','middle',PLATE);
  return true;
}

/* ================================================================== *
 *  the muon views: the descent, its spacetime, Mount Washington       *
 * ================================================================== */
/* the shower's row: muon i sits at fraction (i + 1/2)/N across a panel; its twin without time dilation half a
   spacing to its right */
function rowX(b,i,n){ return b.x+14+(b.w-28)*(i+0.5)/n; }

/* ---------------------------------------------------------------- 1. the descent */
/* how far down the last twin without time dilation gets (its lifetime, the longest, counted on the Earth's clock) */
const ghostReach=D=>Math.min(D.h0,D.b*C_LIGHT*Math.max(...D.taus));
function descentCaps(V){
  const D=V.D, n=D.taus.length, share=D.caught/n;
  const keeps=share>=0.1?'so the row keeps going: '+D.caught+' of '+n+' reach the ground':share>0?'which is still not enough at this energy: '+D.caught+' of '+n+' reach the ground':'which is still not enough at this energy: none of the '+n+' reaches the ground';
  const gone=ghostReach(D)<D.h0?'all gone within '+km(ghostReach(D),2)+' of the top':'not all gone before the ground';
  const full='Left, the Earth’s frame: a cosmic-ray shower makes '+n+' muons at '+fmt(D.h0/1000,0)+' km, all at '+sigf(D.b,6)+' c; each decays when its OWN clock reaches its lifetime, drawn from the muon’s 2.197 µs mean. Their clocks run '+sigf(D.g,3)+' times slow, '+keeps+'. The hollow twins decay by the Earth’s clock instead (no time dilation): '+gone+'. Right, the muons’ frame, at the same scale: the row is still, and the air, '+km(D.thick,3)+' thick in this frame, rushes up past it; the Earth’s clocks run slow here and were not set together. Both panels run on the muons’ own time, so each decay happens at the same moment in both.';
  const short='Left: the Earth’s frame, the muons’ clocks slowed '+sigf(D.g,3)+' times. Right: the muons’ frame, the air '+km(D.thick,3)+' thick. '+D.caught+' of '+n+' reach the ground.';
  return [full,short];
}
function drawDescent(ctx,W,H,M){
  const V=M.D, D=V.D, st=ST;
  const pe=Math.min(V.p,D.tauTrip);                          /* the story stops when the ground arrives */
  const [cf,cs]=descentCaps(V);
  const Lay=stageLayout(ctx,W,H,cf,cs,1,0.28,nbNarrow(H));
  const mb=Lay.main;
  const gap=Lay.narrow?26:44, pw=(mb.w-gap)/2;
  const pE=box(mb.x,mb.y,pw,mb.h-4), pM=box(mb.x+pw+gap,mb.y,pw,mb.h-4);
  const zTop=1.08*D.h0, gH=12;
  const s=(pE.h-gH)/zTop;                                    /* px per metre, both panels */
  const Ye=z=>pE.y1-gH-z*s;
  const per=dialPeriod(2*D.tauTrip);                          /* one period for every dial in the view: a slow clock turns slower */
  const n=D.taus.length, dx=(pE.w-28)/n;

  /* ---- the Earth's frame ---- */
  ctx.save();
  airBands(ctx,pE.x,pE.x1,Ye,0,zTop,90);
  groundBand(ctx,pE.x,pE.x1,Ye(0),gH);
  frame(ctx,pE,'#242a3a');
  axesTitle(ctx,pE,Lay.narrow?'the Earth’s frame':'the Earth’s frame: the muons’ clocks run slow');
  /* altitude ticks */
  ctx.font=SM_FONT; ctx.fillStyle='#6f7789'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const v of ticksFor(0,zTop/1000,pE.h<220?3:5)){ const y=Ye(v*1000); if(y<pE.y+6) continue; ctx.fillText(fmt(v,0),pE.x-5,y); LABELS.push([pE.x-5-14,y-6,pE.x-5,y+6]); }
  lab(ctx,W,H,pE.x-4,pE.y1+4,'km',COL.dim,SM_FONT,'right','top',PLATE_FIX);
  /* the birth line */
  ctx.beginPath(); ctx.moveTo(pE.x,Ye(D.h0)); ctx.lineTo(pE.x1,Ye(D.h0)); ctx.setLineDash([3,4]); ctx.strokeStyle=rgba(COL.dim,0.6); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  const zRow=Math.max(0,earthAt(D,pe).z);                     /* the model’s row, not a second formula here */
  /* the decays so far: a mark where each happened, and a burst while fresh */
  const fresh=0.07*D.tauTrip;
  for(let i=0;i<n;i++){ const ti=D.taus[i], x=rowX(pE,i,n);
    if(ti<=pe){ const zd=D.h0-D.b*C_LIGHT*D.g*ti; decayMark(ctx,x,Ye(zd),rgba(COL.pos,0.7)); if(V.p-ti<fresh) decayBurst(ctx,x,Ye(zd),(V.p-ti)/fresh,COL.pos); }
    if(V.ghost){ const tg=ti/D.g, zg=D.h0-D.b*C_LIGHT*ti;   /* the twin decays when the Earth's clock reaches tau_i */
      if(tg<=pe&&zg>0){ decayMark(ctx,x+dx/2,Ye(zg),rgba(COL.ref,0.7)); if(V.p-tg<fresh) decayBurst(ctx,x+dx/2,Ye(zg),(V.p-tg)/fresh,COL.ref); } } }
  /* the row */
  for(let i=0;i<n;i++){ const x=rowX(pE,i,n), ti=D.taus[i];
    if(ti>pe) muonDot(ctx,x,Ye(zRow),2.2,COL.pos);
    if(V.ghost&&ti/D.g>pe) ghostDot(ctx,x+dx/2,Ye(zRow),2.1,COL.ref); }
  /* the clocks: the top's and the ground's (one reading, the Earth's time), and the muons' own */
  const tE=D.g*pe;
  clockDial(ctx,W,H,pE.x+16,Ye(D.h0)-15,9,tE,per,COL.struct,'the top: '+tStr(tE,3),'right');
  clockDial(ctx,W,H,pE.x+16,Ye(0)-15,9,tE,per,COL.struct,'the ground: '+tStr(tE,3),'right');
  const yc=clamp(Ye(zRow)+(zRow>0.5*D.h0?24:-24),pE.y+12,pE.y1-gH-12);
  clockDial(ctx,W,H,pE.x1-44,yc,9,pe,per,COL.live,'muons: '+tStr(pe,3),'left');
  ctx.restore();

  /* ---- the muons' frame (same scale) ---- */
  ctx.save();
  const yRow=pM.y+0.42*(pM.h-gH);
  const Ym=zp=>yRow-zp*s;                                    /* z' up, the row at z' = 0 */
  const zp=z=>muonFrameZ(D,z,pe);                            /* where the Earth's altitude z is now */
  /* the contracted air: bands at the positions of the Earth's altitudes, shaded by the same air */
  const clipB=box(pM.x,pM.y,pM.w,pM.h);
  const Y2=z=>Ym(zp(z));
  const yG=clamp(Y2(0),pM.y,pM.y1);
  airBands(ctx,pM.x,pM.x1,Y2,0,zTop,90,pM);
  /* below the ground is the Earth, all the way down */
  if(Y2(0)<pM.y1) groundBand(ctx,pM.x,pM.x1,Math.max(pM.y,Y2(0)),pM.y1-Math.max(pM.y,Y2(0)));
  frame(ctx,pM,'#242a3a');
  axesTitle(ctx,pM,Lay.narrow?'the muons’ frame':'the muons’ frame: the air is '+fmt(D.g,1)+' times thinner');
  /* the decays: on the air where each happened (moving with it), and a burst at the row while fresh */
  for(let i=0;i<n;i++){ const ti=D.taus[i], x=rowX(pM,i,n);
    if(ti<=pe){ const zd=D.h0-D.b*C_LIGHT*D.g*ti, y=Ym(zp(zd)); if(y>=pM.y&&y<=pM.y1) decayMark(ctx,x,y,rgba(COL.pos,0.7));
      if(V.p-ti<fresh) decayBurst(ctx,x,yRow,(V.p-ti)/fresh,COL.pos); } }
  for(let i=0;i<n;i++){ const ti=D.taus[i]; if(ti>pe) muonDot(ctx,rowX(pM,i,n),pe>=D.tauTrip?Math.min(yRow,yG):yRow,2.2,COL.pos); }
  /* the Earth's two clocks ride with the air; the muons' clock with the row */
  const cT=muonFrameClock(D,D.h0,pe), cG=muonFrameClock(D,0,pe);
  if(Y2(D.h0)>pM.y+10&&Y2(D.h0)<pM.y1-10) clockDial(ctx,W,H,pM.x+16,Y2(D.h0)-12,9,cT,per,COL.struct,'the top: '+tStr(cT,4),'right');
  if(Y2(0)>pM.y+10&&Y2(0)<pM.y1-10) clockDial(ctx,W,H,pM.x+16,Y2(0)+(Y2(0)<yRow?-12:12),9,cG,per,COL.struct,'the ground: '+tStr(cG,4),'right');
  clockDial(ctx,W,H,pM.x1-44,yRow+(Y2(0)>yRow+40?-22:24),9,pe,per,COL.live,'muons: '+tStr(pe,3),'left');
  /* the air's height at rest, for comparison, and here */
  const xb=pM.x1-10, h0px=D.h0*s, hpx=D.thick*s;
  ctx.beginPath(); ctx.moveTo(xb,clamp(yRow-h0px/2,pM.y,pM.y1)); ctx.lineTo(xb,clamp(yRow+h0px/2,pM.y,pM.y1)); ctx.setLineDash([2,4]); ctx.strokeStyle=rgba(COL.dim,0.7); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  if(!Lay.narrow) lab(ctx,W,H,xb-5,clamp(yRow-h0px/2,pM.y,pM.y1)+8,fmt(D.h0/1000,0)+' km at rest',COL.dim,SM_FONT,'right','top',PLATE);
  ctx.restore();
  /* a magnified look when the air is thin in this frame */
  if(hpx<70&&pM.h>220&&!Lay.narrow){
    const k=Math.min(60,Math.max(2,Math.floor(70/Math.max(hpx,1e-3)/1)));
    const ib=box(pM.x+10,pM.y1-gH-Math.min(130,0.34*pM.h),pM.w-20,Math.min(118,0.34*pM.h-12));
    descentInset(ctx,W,H,ib,D,V,pe,s*k,k,fresh,per);
  }

  /* ---- the bottom plot: survivors with the distance fallen ---- */
  if(Lay.bottom.length) drawSurvivors(ctx,W,H,Lay.bottom[0],V);
  drawCaption(ctx,Lay);
}
/* the title over a panel, registered */
function axesTitle(ctx,b,t){ ctx.font='italic 13px Georgia, serif'; ctx.fillStyle='#aeb6c6'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  const tt=plain(t); ctx.fillText(tt,b.x,b.y-9); LABELS.push([b.x,b.y-9-15,b.x+tt.length*13*0.52,b.y-9]); }
/* the muons' frame magnified k times about the row: the air, the ground, the row and its clocks */
function descentInset(ctx,W,H,ib,D,V,pe,s2,k,fresh,per){
  ctx.save();
  ctx.fillStyle='#070b18'; ctx.fillRect(ib.x,ib.y,ib.w,ib.h);
  const yRow=ib.y+0.5*ib.h, Y=zp=>yRow-zp*s2, Y2=z=>Y(muonFrameZ(D,z,pe));
  airBands(ctx,ib.x,ib.x1,Y2,0,1.08*D.h0,120,ib);
  const yg=Y2(0); if(yg<ib.y1) groundBand(ctx,ib.x,ib.x1,Math.max(ib.y,yg),ib.y1-Math.max(ib.y,yg));
  frame(ctx,ib,COL.live);
  const n=D.taus.length;
  for(let i=0;i<n;i++){ const ti=D.taus[i], x=rowX(ib,i,n);
    if(ti<=pe){ const zd=D.h0-D.b*C_LIGHT*D.g*ti, y=Y2(zd); if(y>=ib.y&&y<=ib.y1) decayMark(ctx,x,y,rgba(COL.pos,0.7)); if(V.p-ti<fresh) decayBurst(ctx,x,yRow,(V.p-ti)/fresh,COL.pos); }
    else muonDot(ctx,x,pe>=D.tauTrip?Math.min(yRow,yg):yRow,2.2,COL.pos); }
  const yt=Y2(D.h0);
  if(yt>ib.y+3&&yt<ib.y1-3){ ctx.beginPath(); ctx.moveTo(ib.x,yt); ctx.lineTo(ib.x1,yt); ctx.setLineDash([3,4]); ctx.strokeStyle=rgba(COL.dim,0.7); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]); }
  lab(ctx,W,H,ib.x+6,ib.y+9,'magnified ×'+k+' about the row',COL.live,SM_FONT,'left','middle',PLATE_FIX);
  ctx.restore();
}
/* survivors against the distance fallen: with time dilation, without, and in the real air (slowing as it goes) */
function drawSurvivors(ctx,W,H,b,V){
  const D=V.D, Hk=D.h0/1000, Lk=D.L/1000, LN=D.b*CTAU/1000;
  const floor=1e-6, xs=[], fy=[], fn=[];
  for(let i=0;i<=200;i++){ const d=Hk*i/200; xs.push(d); fy.push(Math.exp(-d/Lk)); fn.push(Math.exp(-d/LN)); }
  const P=linLogPlot(ctx,b,0,Hk,floor,1.6,{title:titleFor(b,'muons left, against the distance fallen (km): the dots are this row','muons left'),xlab:'distance fallen (km)',ny:4});
  P.line(xs,fy,COL.pos,1.8); P.line(xs,fn,COL.ref,1.6,[5,3]);
  const LS=V.loss;
  if(LS&&LS.pts.length>1){ P.line(LS.pts.map(q=>(D.h0-q.z)/1000),LS.pts.map(q=>Math.exp(-q.tau/TAU_MU)),COL.pos,1.3,[2,3]);
    if(LS.stop!==null){ const X=P.X((D.h0-LS.stop)/1000); vMark(ctx,b,X,rgba(COL.ref,0.8),[2,3]);
      lab(ctx,W,H,X-4,b.y+12,'in real air it stops',COL.ref,SM_FONT,'right','middle',PLATE_FIX); } }
  /* the row's own count, and a marker at the row */
  const pe=Math.min(V.p,D.tauTrip), d=Math.min(Hk,D.b*C_LIGHT*D.g*pe/1000);
  const frac=V.alive/D.taus.length;
  if(frac>0&&d>0) marker(ctx,b,0,Hk,Math.log10(floor),Math.log10(1.6),d,Math.log10(Math.max(frac,floor)),COL.live);
  keyRow(ctx,b.x,b.y-32,[[COL.pos,'clocks slowed γ times'],[COL.ref,'no time dilation',[5,3]],[COL.pos,'and slowing in real air',[2,3]]],b.w);
  /* a press here moves the row to that distance (and stops the clock) */
  HIT.push({kind:'scrub',view:'descent',b,lo:0,hi:Hk,toClock:dk=>1000*dk/(D.b*C_LIGHT*D.g)});
}

/* ---------------------------------------------------------------- 2. the muons' spacetime */
function drawMspace(ctx,W,H,M){
  const S=M.S, D=S.D, ev=S.ev, bf=S.bf;
  const cf='The descent as worldlines: across, the height measured from the birth; up, time, drawn as ct so that light runs at 45°. Cyan, the top of the atmosphere and the ground, at rest in the Earth’s frame; green, the muon, falling at '+sigf(D.b,6)+' c; magenta, the hyperbola of every event 2.197 µs of the muon’s own time after its birth (c²t² − Δz² fixed). Slide the frame from the Earth’s to the muon’s: the events move along hyperbolas, and the order of the clocks’ readings along each worldline never changes. Lines of simultaneity are horizontal in whatever frame is drawn; the dashed ones are the Earth’s and the muon’s, through the birth: where each meets the ground is what that frame calls the ground clock’s reading at the birth.';
  const cs='The descent in spacetime; slide the frame from the Earth’s to the muon’s. The magenta hyperbola is 2.197 µs of the muon’s time.';
  const Lay=stageLayout(ctx,W,H,cf,cs,0,0,0);
  const b=box(Lay.main.x+8,Lay.main.y,Lay.main.w-8,Lay.main.h-6);
  const B=(ct,dz)=>boost(-bf,ct,dz);                       /* the display frame moves DOWN at βf */
  const c=C_LIGHT;
  /* what must fit is what matters in the frame drawn: the birth, the arrival, and the air's two edges at those two
     instants OF THIS FRAME (an Earth height Δz sits at x' = Δz/γf + βf ct'); Earth events far from the muon would
     put the whole story into one pixel once the frame is boosted */
  const Cd=B(ev.C[0],ev.C[1]), Ad=B(ev.A[0],ev.A[1]), ed=(dz,ctp)=>[ctp,dz/S.gf+bf*ctp];
  const keys=[Cd,Ad,ed(-D.h0,Cd[0]),ed(0,Cd[0]),ed(-D.h0,Ad[0]),ed(0,Ad[0])];
  const Mk=minkFit(b,keys,0.1);
  minkFrame(ctx,Mk,'h',1/1000,'t',1e6/c,'height from the birth (km)','time (µs), drawn as ct');
  axesTitle(ctx,b,S.f===0?'the Earth’s frame':S.f===1?'the muon’s frame':'a frame moving down at '+sigf(bf,4)+' c');
  /* near the arrival the muon's "now" meets the ground and the 2.197 µs point sits: when those crowd within a few
     pixels of the arrival, they are drawn again in a magnified inset, and named only there */
  const Gm=B(D.b*D.h0,-D.h0), Md=B(ev.M[0],ev.M[1]);
  const px=(P,Q)=>Math.hypot(Mk.X(P[1])-Mk.X(Q[1]),Mk.Y(P[0])-Mk.Y(Q[0]));
  const crowd=Math.min(px(Ad,Gm),ev.M[0]<=ev.A[0]?px(Ad,Md):1e9)<28;
  /* the inset's corner is chosen first (one that hides neither the birth nor the arrival) and registered, so the
     main diagram's labels keep out of it */
  let ib=null;
  if(crowd&&b.w>300&&b.h>240){
    const iw=Math.min(0.42*b.w,320), ih=Math.min(0.46*b.h,260);
    const cands=[[b.x1-iw-10,b.y+26],[b.x1-iw-10,b.y1-ih-10],[b.x+10,b.y1-ih-10],[b.x+10,b.y+26]];
    const pts=[[Mk.X(Cd[1]),Mk.Y(Cd[0])],[Mk.X(Ad[1]),Mk.Y(Ad[0])]];
    for(const [x,y] of cands){ const q=box(x,y,iw,ih); if(pts.every(([X,Y])=>X<q.x-12||X>q.x1+12||Y<q.y-12||Y>q.y1+12)){ ib=q; break; } }
    if(ib) LABELS.push([ib.x-2,ib.y-2,ib.x1+2,ib.y1+2]);
  }
  const ibReg=ib?LABELS[LABELS.length-1]:null;
  muonDiagram(ctx,W,H,Mk,S,B,{nameArrival:!ib});
  if(ibReg) LABELS.splice(LABELS.indexOf(ibReg),1);         /* the main labels are placed: the inset's own may go inside it */
  const lbl='the air in this frame: '+km(D.h0*Math.sqrt((1-bf)*(1+bf)),3)+' thick'+(Math.abs(bf)>1e-9?', rising at '+sigf(bf,4)+' c':', at rest');
  lab(ctx,W,H,b.x+8,b.y+12,lbl,COL.struct,SM_FONT,'left','middle',PLATE_FIX);
  if(ib){
    /* centred on the arrival, wide enough for the three events */
    const span=Math.max(Math.abs(Ad[0]-Gm[0]),Math.abs(Ad[1]-Gm[1]),ev.M[0]<=ev.A[0]?Math.max(Math.abs(Ad[0]-Md[0]),Math.abs(Ad[1]-Md[1])):0,1);
    ctx.fillStyle='#070b18'; ctx.fillRect(ib.x,ib.y,ib.w,ib.h);
    const Mi=minkFit(ib,[[Ad[0]-1.6*span,Ad[1]-1.6*span],[Ad[0]+1.6*span,Ad[1]+1.6*span]],0);
    const saved=LABELS; LABELS=[];                          /* the inset lays out its own labels */
    muonDiagram(ctx,W,H,Mi,S,B,{nameArrival:true,inset:true});
    LABELS=saved.concat(LABELS);
    frame(ctx,ib,COL.live);
    lab(ctx,W,H,ib.x+6,ib.y+10,'magnified ×'+fmt(Mi.s/Mk.s,0)+' about the arrival',COL.live,SM_FONT,'left','middle',PLATE_FIX);
  }
  drawCaption(ctx,Lay);
}
/* the descent's worldlines in one diagram's map: the air's band and edges, the light cone, the hyperbola of τ0, the
   muon's worldline and its own clock's ticks, the ground clock's ticks, the two frames' "now" through the birth */
function muonDiagram(ctx,W,H,Mk,S,B,o){
  const D=S.D, ev=S.ev, bf=S.bf, gf=S.gf, c=C_LIGHT;
  const y0=Mk.win.y0, y1=Mk.win.y1, edge=(dz,ctp)=>[ctp,dz/gf+bf*ctp];
  minkFill(ctx,Mk,[edge(-D.h0,y0),edge(-D.h0,y1),edge(0,y1),edge(0,y0)],mix('#070b18',COL.struct,0.09));
  const Bline=(a,bb,col,lw,dash)=>minkSeg(ctx,Mk,B(a[0],a[1]),B(bb[0],bb[1]),col,lw,dash);
  const far=1e3*Math.max(D.h0,D.tTrip*c);
  Bline([-far,0],[far,0],COL.struct,1.5); Bline([-far,-D.h0],[far,-D.h0],COL.struct,2.2);
  Bline([0,0],[far,far],rgba(COL.light,0.55),1,[4,4]); Bline([0,0],[far,-far],rgba(COL.light,0.55),1,[4,4]);
  if(S.hyp){ const pts=[]; const th1=Math.asinh(Math.max(D.h0,5*CTAU)/CTAU)+0.3, n=o.inset?2400:240;
    for(let i=0;i<=n;i++){ const th=-th1*0.15+(th1*1.15)*i/n; pts.push(B(CTAU*Math.cosh(th),-CTAU*Math.sinh(th))); }
    minkPath(ctx,Mk,pts,rgba(COL.live,0.85),1.3,[5,3]); }
  minkSeg(ctx,Mk,B(0,0),B(ev.A[0],ev.A[1]),COL.pos,2.4);
  /* the muon's own clock along its worldline, and the ground's along its own, each at a step that suits the window */
  const tw=muonClockSpan(Mk,B,D), dT=niceStep(Math.max(tw.span,1e-12)/4);
  for(let k=Math.ceil(tw.lo/dT);k*dT<=tw.hi&&k*dT<D.tauTrip*0.999;k++){ if(k<=0) continue; const ct=D.g*c*k*dT, q=B(ct,-D.b*ct);
    if(!inMink(Mk,q[0],q[1])) continue; const X=Mk.X(q[1]), Y=Mk.Y(q[0]); dot(ctx,X,Y,2.4,COL.pos);
    lab(ctx,W,H,X+6,Y,tickStr(k*dT*1e6,dT*1e6)+' µs',COL.pos,SM_FONT,'left','middle',PLATE); }
  const gw=groundClockSpan(Mk,B,D), dG=niceStep(Math.max(gw.span,1e-12)/4);
  for(let k=Math.ceil(gw.lo/dG);k*dG<=gw.hi;k++){ const t=k*dG, q=B(c*t,-D.h0);
    if(!inMink(Mk,q[0],q[1])) continue; const X=Mk.X(q[1]), Y=Mk.Y(q[0]); dot(ctx,X,Y,2.4,COL.struct);
    lab(ctx,W,H,X-6,Y,tickStr(t*1e6,dG*1e6)+' µs',COL.struct,SM_FONT,'right','middle',PLATE); }
  if(S.sim){
    const lineAt=(beta,col,name)=>{ /* the frame moving down at β: at the birth's instant, ct = −β Δz */
      Bline([beta*far,-far],[-beta*far,far],col,1.2,[6,4]);
      const q=B(beta*D.h0,-D.h0);                          /* where it meets the ground: the ground clock reads βh0/c there */
      if(inMink(Mk,q[0],q[1])){ const X=Mk.X(q[1]), Y=Mk.Y(q[0]); diamond(ctx,X,Y,5,col,'#fff'); LABELS.push([X-5,Y-5,X+5,Y+5]);
        if(o.inset) lab(ctx,W,H,X-8,Y+12,(beta===0?'Earth’s':'muon’s')+' now: '+usStr(beta*D.h0/c,4),col,SM_FONT,'right','middle',PLATE);
        else if(o.nameArrival||beta===0) lab(ctx,W,H,X+8,Y+12,name+': the ground reads '+usStr(beta*D.h0/c,4),col,SM_FONT,'left','middle',PLATE); } };
    lineAt(0,COL.struct,'the Earth’s now'); lineAt(D.b,COL.pos,'the muon’s now'); }
  minkEvent(ctx,Mk,W,H,B(ev.C[0],ev.C[1]),o.inset?null:'birth',COL.live,8,-12);
  /* in the inset every name goes to the left of its event, short, so that it stays inside */
  minkEvent(ctx,Mk,W,H,B(ev.A[0],ev.A[1]),o.inset?'the ground arrives':o.nameArrival?'the ground arrives: '+usStr(D.tauTrip,3)+' on the muon’s clock':null,COL.live,o.inset?-8:8,o.inset?-12:12);
  if(ev.M[0]<ev.A[0]) minkEvent(ctx,Mk,W,H,B(ev.M[0],ev.M[1]),o.inset?'τ₀ = 2.197 µs':o.nameArrival?'2.197 µs on its clock':null,COL.live,-8,-12);
}
/* the muon's own clock's readings that fall inside a window (its worldline from the birth to the ground) */
function muonClockSpan(Mk,B,D){
  const c=C_LIGHT, a=B(0,0), b2=B(D.tTrip*c,-D.h0);
  const cl=clipToWin([a[1],a[0]],[b2[1],b2[0]],Mk.win);
  if(!cl) return {lo:0,hi:0,span:1e-12};
  const u=q=>(q[1]-a[0])/(b2[0]-a[0]), ta=D.tauTrip*u(cl[0]), tb=D.tauTrip*u(cl[1]);
  return {lo:Math.min(ta,tb),hi:Math.max(ta,tb),span:Math.abs(tb-ta)};
}
/* a round step near x: 1, 2 or 5 × 10ⁿ */
function niceStep(x){ if(!(x>0)) return 1; const e=Math.pow(10,Math.floor(Math.log10(x))), m=x/e; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e; }
/* the ground clock's readings that fall inside the diagram's window (the ground is at Δz = −h0 in Earth coordinates) */
function groundClockSpan(Mk,B,D){
  /* the ground's worldline in display coordinates is a straight line: find where it enters and leaves the window */
  const c=C_LIGHT, a=B(-10*D.tTrip*c,-D.h0), b2=B(10*D.tTrip*c,-D.h0);
  const cl=clipToWin([a[1],a[0]],[b2[1],b2[0]],Mk.win);
  if(!cl) return {lo:0,hi:0,span:1e-9};
  /* back to Earth time along the line: the parameter is linear */
  const t0=-10*D.tTrip, t1=10*D.tTrip, u=q=>(q[1]-a[0])/(b2[0]-a[0]);
  const ta=t0+(t1-t0)*u(cl[0]), tb=t0+(t1-t0)*u(cl[1]);
  return {lo:Math.min(ta,tb),hi:Math.max(ta,tb),span:Math.abs(tb-ta)};
}

/* ---------------------------------------------------------------- 3. Mount Washington */
function drawMtwash(ctx,W,H,M){
  const V=M.W, w=V.W, src=w.src, paper=V.src==='paper';
  const cf='Frisch & Smith (1963): on the summit of Mount Washington they counted the muons that stopped in a plastic scintillator under '+fmt(100*FS.iron,0)+' cm of iron, those that arrived at '+FS.betaLo.toFixed(4)+'–'+FS.betaHi.toFixed(4)+' c; at sea level in Cambridge, '+FS.drop+' m lower, the same muons need less iron (the air has slowed them). Without time dilation the '+FS.drop+' m would take '+usStr(w.t,3)+' on every clock, and '+fmt(100*w.survN,1)+' % would survive; they count '+fmt(100*w.ratio,1)+' %. '+(V.loss?'This page’s air (US 1976) and stopping power (PDG) give the muons '+usStr(w.tau,3)+' of their own time on the way down.':'With the slowing switched off the muons keep '+w.beta.toFixed(4)+' c all the way and get '+usStr(w.tau,3)+' of their own time.')+' Below, the muons’ decay as their own clock, read both ways, and γ on the way down.';
  const cs='Frisch & Smith: '+src.top+' an hour on the summit, '+src.bottom+' at sea level; without time dilation, about '+fmt(w.predictN,0)+'.';
  const Lay=stageLayout(ctx,W,H,cf,cs,2,0.36,nbNarrow(H));
  const mb=Lay.main;
  /* the column: altitude up the left, the two stations, the muons thinning with height */
  const cb=box(mb.x+6,mb.y,Math.min(mb.w*0.36,260),mb.h-4);
  const zTop=FS.drop*1.12, gH=12, s=(cb.h-gH)/zTop, Y=z=>cb.y1-gH-z*s;
  airBands(ctx,cb.x,cb.x1,Y,0,zTop,60); groundBand(ctx,cb.x,cb.x1,Y(0),gH); frame(ctx,cb,'#242a3a');
  axesTitle(ctx,cb,'1907 m of air');
  ctx.font=SM_FONT; ctx.fillStyle='#6f7789'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const v of ticksFor(0,zTop,cb.h<200?3:4)){ const y=Y(v); if(y<cb.y+6) continue; ctx.fillText(fmt(v,0),cb.x-5,y); LABELS.push([cb.x-5-22,y-6,cb.x-5,y+6]); }
  lab(ctx,W,H,cb.x-4,cb.y1+4,'m',COL.dim,SM_FONT,'right','top',PLATE_FIX);
  /* the stream between (drawn first, so the stations’ labels sit on top): dots placed at the quantiles of the survival, so their density follows it */
  for(let k=0;k<26;k++){ const f=(k+0.5)/26, tauAt=-TAU_MU*Math.log(1-f*(1-w.surv));
    const q=w.prof.find(r=>r.tau>=tauAt)||w.prof[w.prof.length-1];
    const x=cb.x+cb.w*(0.78+0.12*Math.sin(k*2.39)); muonDot(ctx,x,Y(q.z),1.8,COL.pos); }
  /* the stations: iron over a scintillator */
  const station=(z,ironPx,name,count)=>{ const y=Y(z), x0=cb.x+cb.w*0.18, x1=cb.x+cb.w*0.62;
    ctx.fillStyle='#4a4f5c'; ctx.fillRect(x0,y-ironPx-9,x1-x0,ironPx); ctx.strokeStyle='#6b7080'; ctx.lineWidth=1; ctx.strokeRect(x0,y-ironPx-9,x1-x0,ironPx);
    ctx.fillStyle=mix('#070b18',COL.struct,0.6); ctx.fillRect(x0+6,y-9,x1-x0-12,7);
    lab(ctx,W,H,x1+6,y-ironPx/2-6,name,COL.text,SM_FONT,'left','middle',PLATE_FIX);
    lab(ctx,W,H,x1+6,y-ironPx/2+8,count,COL.ref,SM_FONT,'left','middle',PLATE_FIX); };
  /* the sea-level stack is drawn thinner without a number: the note gives none for it */
  const ironTop=Math.max(10,Math.min(28,0.08*cb.h));
  station(FS.drop,ironTop,'summit, 76 cm of iron',(paper?src.top+' ± '+src.topErr:src.top)+' an hour');
  station(0,0.6*ironTop,'sea level, less iron',(paper?src.bottom+' ± '+src.bottomErr:src.bottom)+' an hour');
  /* the clocks and the counts, beside the column */
  const tx=cb.x1+(Lay.narrow?20:48), tw=mb.x1-tx;
  const lines=[
    [COL.struct,'the laboratory’s clock, summit to sea level',usStr(w.t,3)],
    [COL.live,'the muons’ own clock ('+(V.loss?'this page’s air':'no slowing')+')',usStr(w.tau,3)],
    [COL.live,'the muons’ own clock, from the counts',usStr(w.tauObs,2)+' ± '+usStr(w.tauObsErr,1)],
    [COL.ref,'expected at sea level, no time dilation',fmt(w.predictN,1)+' an hour'],
    [COL.pos,'expected, with it ('+(V.loss?'this page’s air':'no slowing')+')',fmt(w.predict,0)+' ± '+fmt(w.predictErr,0)+' an hour'],
    [COL.ref,(paper?'counted (the paper’s mean)':'counted (the film’s hour)'),(paper?src.bottom+' ± '+src.bottomErr:src.bottom+' ± '+fmt(w.eBot,0))+' an hour'],
    [COL.text,'the laboratory’s time ÷ the muons’ (counts)',fmt(w.factorObs,1)+' ± '+fmt(w.factorObsErr,1)],
    [COL.text,'their paper: observed, and calculated',FS.factorObs+' ± '+FS.factorObsErr+',  '+FS.factorCalc+' ± '+FS.factorCalcErr]];
  if(tw>220){ let y=mb.y+16; const rowH=Math.min(30,(mb.h-20)/lines.length);
    for(const [col,t1,t2] of lines){ lab(ctx,W,H,tx,y,t1,COL.dim,SM_FONT,'left','middle',PLATE_FIX);
      lab(ctx,W,H,tx,y+13,t2,col,'12px -apple-system, sans-serif','left','middle',PLATE_FIX); y+=rowH; } }
  /* the bottom: the muons' clock, and γ on the way down */
  if(Lay.bottom.length>=1) drawDecayClock(ctx,W,H,Lay.bottom[0],w);
  if(Lay.bottom.length>=2) drawGammaDown(ctx,W,H,Lay.bottom[1],w);
  drawCaption(ctx,Lay);
}
/* the decay curve as a clock: e^(−t/τ0) of a muon at rest, with the two readings on it */
function drawDecayClock(ctx,W,H,b,w){
  const tmax=Math.max(8e-6,1.15*w.t), xs=[], ys=[];
  for(let i=0;i<=160;i++){ const t=tmax*i/160; xs.push(t*1e6); ys.push(Math.exp(-t/TAU_MU)); }
  const P=linPlot(ctx,b,0,tmax*1e6,0,1.05,{title:titleFor(b,'the muons’ clock: the share left after time t of their own','the muons’ clock'),xlab:'their own time (µs)',ny:nyFor(b)});
  P.line(xs,ys,COL.dim,1.5);
  /* the laboratory's 6.4 µs, read on it: what would be left without time dilation */
  const xN=P.X(w.t*1e6), yN=P.Y(w.survN); vMark(ctx,b,xN,rgba(COL.ref,0.8),[4,3]); dot(ctx,xN,yN,4,COL.ref,'#fff');
  lab(ctx,W,H,xN-6,yN-12,'the laboratory’s '+usStr(w.t,3)+': '+fmt(100*w.survN,1)+' %',COL.ref,SM_FONT,'right','middle',PLATE);
  /* the count's ratio, read off it: the muons' own time */
  const yR=P.Y(w.ratio); ctx.beginPath(); ctx.moveTo(b.x,yR); ctx.lineTo(P.X(w.tauObs*1e6),yR); ctx.setLineDash([3,3]); ctx.strokeStyle=rgba(COL.live,0.8); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  dot(ctx,P.X(w.tauObs*1e6),yR,4,COL.live,'#fff');
  lab(ctx,W,H,P.X(w.tauObs*1e6)+7,yR-11,'counted '+fmt(100*w.ratio,1)+' %: '+usStr(w.tauObs,2),COL.live,SM_FONT,'left','middle',PLATE);
  const xM=P.X(w.tau*1e6), yM=P.Y(w.surv); diamond(ctx,xM,yM,4.5,COL.pos,'#fff');
}
/* γ against the height on the way down (this page's air), with the paper's two values at the ends */
function drawGammaDown(ctx,W,H,b,w){
  const zs=w.prof.map(q=>q.z), gs=w.prof.map(q=>1+q.T/M_MU);
  const g0=Math.min(FS.gammaBottom,Math.min(...gs))*0.92, g1=Math.max(FS.gammaTop,Math.max(...gs))*1.04;
  const P=linPlot(ctx,b,0,FS.drop,g0,g1,{title:titleFor(b,'γ on the way down: this page’s air (line), their paper (diamonds)','γ on the way down'),xlab:'height (m)',ny:nyFor(b)});
  P.line(zs,gs,COL.pos,1.8);
  diamond(ctx,P.X(FS.drop),P.Y(FS.gammaTop),5,COL.ref,'#fff'); diamond(ctx,P.X(0),P.Y(FS.gammaBottom),5,COL.ref,'#fff');
  const yA=P.Y(w.factor); ctx.beginPath(); ctx.moveTo(b.x,yA); ctx.lineTo(b.x1,yA); ctx.setLineDash([3,3]); ctx.strokeStyle=rgba(COL.live,0.7); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  lab(ctx,W,H,b.x1-6,yA-10,'averaged over τ: '+fmt(w.factor,2),COL.live,SM_FONT,'right','middle',PLATE);
}

/* ================================================================== *
 *  the jet views: the hangar, its spacetime, the crash                *
 * ================================================================== */
/* the two panels of a jet view: the hangar's frame above the jet's, one horizontal scale (metres to px), the
   ground at each panel's foot, the jet drawn at its true aspect.  Returns the two panels' maps. */
function jetPanels(mb,Hm,narrow,clocks){
  const gap=narrow?30:40, ph=(mb.h-gap)/2;
  const pH=box(mb.x,mb.y,mb.w,ph), pJ=box(mb.x,mb.y+ph+gap,mb.w,ph);
  const m=0.10*Math.max(Hm.L,Hm.Lh);
  const rH=[-Hm.ell-m,Hm.Lh+Hm.ell+m], rJ=[-Hm.Lh/Hm.g-m,Hm.L+Hm.Lh/Hm.g+m];
  const sx=Math.min(mb.w/(rH[1]-rH[0]),mb.w/(rJ[1]-rJ[0]));
  /* the hangar's roof must fit, with the door clocks above it and the jet's below the floor when the view has them */
  const above=clocks?28:8, below=clocks?30:14;
  const sy=(ph-above-below)/(0.40*Hm.L);
  const s=Math.max(1e-6,Math.min(sx,sy));
  const mk=(p,r)=>{ const cx=(r[0]+r[1])/2; return {b:p,s,X:x=>p.x+p.w/2+(x-cx)*s,yG:p.y1-below}; };
  return {pH,pJ,H:mk(pH,rH),J:mk(pJ,rJ),s};
}
/* the jet with its tail at canvas x = X(0) mapping each point of its own length s ∈ [0, L] through Xs(s) */
function drawJetAt(ctx,Mp,Hm,Xs,col,fill,clip){
  const k=0.28*Hm.L*Mp.s, yb=Mp.yG-0.05*Hm.L*Mp.s;           /* its height scale, and its belly 5 % of its length above the floor */
  drawJet(ctx,u=>Xs(u*Hm.L),v=>yb-(v-JET_VLO)*k,col,fill,clip||Mp.b);
}
function hangarWallPx(Hm,s){ return 0.30*Hm.L*s; }

/* ---------------------------------------------------------------- 4. the hangar */
function hangarCaps(Hm){
  const nm=Hm.jet.name, sp=sigf(Hm.b,4);
  const fitTxt=Hm.fits?'both doors are shut together for '+tStr(Hm.shut,3)+', the jet inside':'the jet does not fit at this speed: the exit opens '+tStr(-Hm.shut,3)+' before the entrance shuts';
  const full='Above, the hangar’s frame: the '+nm+', '+metres(Hm.L,4)+' long at rest, flies through at '+sp+' c and is '+metres(Hm.ell,4)+' long here; the hangar is '+metres(Hm.Lh,3)+'. The entrance shuts the moment the tail is in (A); the exit, shut until then, opens the moment the nose reaches it (B): '+fitTxt+'. Below, the jet’s frame: the hangar comes at the jet, '+metres(Hm.Lh/Hm.g,3)+' long, and the exit opens '+tStr(-Hm.ev.B.tj,3)+' before the entrance shuts, so the jet is never inside. The two frames disagree about which door moved first, and both are right: the door clocks were set together in the hangar’s frame, so in the jet’s frame the exit’s clock reads '+tStr(Hm.leadExit,3)+' ahead of the entrance’s. Each panel runs on its own frame’s time, both set to zero at event A; below them, every event on both clocks.';
  const short='Upper panel: the hangar’s frame, the jet '+metres(Hm.ell,3)+' long. Lower panel: the jet’s frame, the hangar '+metres(Hm.Lh/Hm.g,3)+' long. '+(Hm.fits?'Shut together for '+tStr(Hm.shut,3)+' in the first, never in the second.':'It does not fit at this speed.');
  return [full,short];
}
function drawHangarView(ctx,W,H,M){
  const V=M.H, Hm=V.Hm, p=V.p, c=C_LIGHT;
  const [cf,cs]=hangarCaps(Hm);
  const Lay=stageLayout(ctx,W,H,cf,cs,1,0.24,nbNarrow(H));
  const P=jetPanels(Lay.main,Hm,Lay.narrow,true);
  const per=dialPeriod(Math.max(Hm.ev.T.t-Hm.ev.N.t,Hm.ev.T.tj-Hm.ev.N.tj)/2);
  const flash=0.05*(hangarSpan(ST).p1-hangarSpan(ST).p0);
  /* ---- the hangar's frame ---- */
  { const Mp=P.H, b=Mp.b, s=Mp.s, X=Mp.X, hw=hangarWallPx(Hm,s);
    groundBand(ctx,b.x,b.x1,Mp.yG,10); frame(ctx,b,'#242a3a');
    axesTitle(ctx,b,Lay.narrow?'the hangar’s frame':'the hangar’s frame: the jet is '+metres(Hm.ell,3)+' long');
    const st=V.Hh;
    drawHangar(ctx,X(0),X(Hm.Lh),Mp.yG,hw,st.entranceShut,st.exitOpen,b);
    drawJetAt(ctx,Mp,Hm,sj=>X(st.tail+sj/Hm.g),COL.pos,mix('#070b18',COL.pos,0.22));
    if(p-Hm.ev.A.t>=0) eventFlash(ctx,X(0),Mp.yG-hw/2,(p-Hm.ev.A.t)/flash,COL.live);
    if(p-Hm.ev.B.t>=0) eventFlash(ctx,X(Hm.Lh),Mp.yG-hw/2,(p-Hm.ev.B.t)/flash,COL.live);
    const yc=Mp.yG-hw*1.28-14;
    clockDial(ctx,W,H,X(0),yc,8,st.clockEntrance,per,COL.struct,tStr(st.clockEntrance,3),'left');
    clockDial(ctx,W,H,X(Hm.Lh),yc,8,st.clockExit,per,COL.struct,tStr(st.clockExit,3),'right');
    jetClocks(ctx,W,H,Mp,X(st.tail),X(st.nose),st.clockTail,st.clockNose,per); }
  /* ---- the jet's frame ---- */
  { const Mp=P.J, b=Mp.b, s=Mp.s, X=Mp.X, hw=hangarWallPx(Hm,s), st=V.Hj;
    groundBand(ctx,b.x,b.x1,Mp.yG,10); frame(ctx,b,'#242a3a');
    axesTitle(ctx,b,Lay.narrow?'the jet’s frame':'the jet’s frame: the hangar is '+metres(Hm.Lh/Hm.g,3)+' long');
    drawHangar(ctx,X(st.entrance),X(st.exit),Mp.yG,hw,st.entranceShut,st.exitOpen,b);
    drawJetAt(ctx,Mp,Hm,sj=>X(sj),COL.pos,mix('#070b18',COL.pos,0.22));
    if(p-Hm.ev.A.tj>=0) eventFlash(ctx,X(st.entrance),Mp.yG-hw/2,(p-Hm.ev.A.tj)/flash,COL.live);
    if(p-Hm.ev.B.tj>=0) eventFlash(ctx,X(st.exit),Mp.yG-hw/2,(p-Hm.ev.B.tj)/flash,COL.live);
    const yc=Mp.yG-hw*1.28-14;
    clockDial(ctx,W,H,X(st.entrance),yc,8,st.clockEntrance,per,COL.struct,tStr(st.clockEntrance,3),'left');
    clockDial(ctx,W,H,X(st.exit),yc,8,st.clockExit,per,COL.struct,tStr(st.clockExit,3),'right');
    jetClocks(ctx,W,H,Mp,X(0),X(Hm.L),st.clockTail,st.clockNose,per); }
  if(Lay.bottom.length) drawTimeline(ctx,W,H,Lay.bottom[0],Hm,p);
  drawCaption(ctx,Lay);
}
/* the jet's two clocks ride below the floor, under its tail and its nose */
function jetClocks(ctx,W,H,Mp,xt,xn,ct,cn,per){
  const y=Mp.yG+19, b=Mp.b;
  if(xt>b.x+8&&xt<b.x1-8) clockDial(ctx,W,H,xt,y,7,ct,per,COL.live,'tail '+tStr(ct,3),'left');
  if(xn>b.x+8&&xn<b.x1-8) clockDial(ctx,W,H,xn,y,7,cn,per,COL.live,'nose '+tStr(cn,3),'right');
}
/* the two time axes, one per frame, with the four events on each and each event joined to itself */
function drawTimeline(ctx,W,H,b,Hm,p){
  const e=Hm.ev, ks=['N','A','B','T'], names={N:'nose in',A:'A: entrance shuts',B:'B: exit opens',T:'tail out'};
  const all=[]; for(const k of ks){ all.push(e[k].t,e[k].tj); }
  const lo=Math.min(...all), hi=Math.max(...all), pad=0.06*(hi-lo);
  const t0=(lo-pad)*1e9, t1=(hi+pad)*1e9;
  const P=linPlot(ctx,b,t0,t1,0,1,{title:titleFor(b,'every event on both clocks (ns): the joins cross where the order flips','both clocks (ns)'),xlab:'each frame’s own time (ns), zero at A',yticks:[],ny:2});
  const yH=b.y+0.28*b.h, yJ=b.y+0.78*b.h;
  for(const [y,name,col] of [[yH,'the hangar’s clocks',COL.struct],[yJ,'the jet’s clocks',COL.live]]){
    ctx.beginPath(); ctx.moveTo(b.x,y); ctx.lineTo(b.x1,y); ctx.strokeStyle=rgba(col,0.6); ctx.lineWidth=1.2; ctx.stroke();
    lab(ctx,W,H,b.x+4,y-9,name,col,SM_FONT,'left','middle',PLATE_FIX); }
  for(const k of ks){ const xh=P.X(e[k].t*1e9), xj=P.X(e[k].tj*1e9), hot=k==='A'||k==='B';
    ctx.beginPath(); ctx.moveTo(xh,yH); ctx.lineTo(xj,yJ); ctx.strokeStyle=hot?rgba(COL.live,0.8):rgba(COL.dim,0.5); ctx.lineWidth=hot?1.4:1; ctx.stroke();
    POLY_SEGS.push(xh,yH,xj,yJ);
    dot(ctx,xh,yH,3.2,COL.struct); dot(ctx,xj,yJ,3.2,COL.live); }
  /* the labels: the hangar's above its axis, the jet's below its own, stacked in levels where two events are close
     (A and B are 7 ns apart on the hangar's clocks at the defaults) */
  stackLabels(ctx,W,H,ks.map(k=>({x:P.X(e[k].t*1e9),t:names[k]})),yH,-1,COL.struct);
  stackLabels(ctx,W,H,ks.map(k=>({x:P.X(e[k].tj*1e9),t:names[k]})),yJ,1,COL.live);
  vMark(ctx,b,P.X(p*1e9),rgba(COL.text,0.55),[2,3]);
  /* a press here sets both panels' clocks to that time (and stops them) */
  HIT.push({kind:'scrub',view:'hangar',b,lo:t0,hi:t1,toClock:ns=>ns*1e-9});
}

/* labels along a rail at y0, on the side dir (−1 above, +1 below), in levels: each goes to the first level where it
   clears the labels already there, with a leader from its event when it is not on the first */
function stackLabels(ctx,W,H,items,y0,dir,col){
  ctx.font=SM_FONT; const placed=[];
  const its=items.map(o=>Object.assign({w:ctx.measureText(plain(o.t)).width},o)).sort((a,b)=>a.x-b.x);
  for(const it of its){ let lev=0;
    while(lev<3&&placed.some(q=>q.lev===lev&&Math.abs(q.x-it.x)<(q.w+it.w)/2+6)) lev++;
    placed.push({x:it.x,w:it.w,lev});
    const y=y0+dir*(12+13*lev);
    if(lev>0){ ctx.beginPath(); ctx.moveTo(it.x,y0+dir*4); ctx.lineTo(it.x,y-dir*6); ctx.strokeStyle=rgba(col,0.5); ctx.lineWidth=1; ctx.stroke(); }
    lab(ctx,W,H,it.x,y,it.t,col,SM_FONT,'center','middle',PLATE_FIX); }
}

/* ---------------------------------------------------------------- 5. the hangar's spacetime */
function drawHspace(ctx,W,H,M){
  const X=M.X, Hm=X.Hm, bf=X.bf, gf=X.gf, c=C_LIGHT, e=Hm.ev;
  const fr=X.f===0?'the hangar’s frame':X.f===1?'the jet’s frame':'a frame moving at '+sigf(bf,4)+' c';
  const cf='The hangar in spacetime: across, the position along the hangar; up, time, drawn as ct so that light runs at 45°. Cyan, the doors’ worldlines (thick while shut); green, the jet’s, between its tail and its nose; magenta, the stretch in which both doors are shut in the hangar’s frame, A to B. In the frame drawn, “now” is any horizontal line. In the hangar’s frame a horizontal line can lie inside the shut doors with the whole jet on it; slide to the jet’s frame and no horizontal line does: the same events, the same worldlines, a different slicing into “now”. In the frame moving at '+sigf(Hm.betaStar,3)+' c, A and B happen at once.';
  const cs='The hangar in spacetime; slide from the hangar’s frame to the jet’s. Magenta: both doors shut (A to B).';
  const Lay=stageLayout(ctx,W,H,cf,cs,0,0,0);
  const b=box(Lay.main.x+8,Lay.main.y,Lay.main.w-8,Lay.main.h-6);
  const B=(ct,x)=>boost(bf,ct,x);
  const keys=['N','A','B','T'].map(k=>B(c*e[k].t,e[k].x)).concat([B(c*e.N.t,Hm.Lh),B(c*e.T.t,0),B(c*e.N.t,e.N.t*Hm.v),B(c*e.T.t,Hm.ell+e.T.t*Hm.v)]);
  const Mk=minkFit(b,keys,0.12);
  minkFrame(ctx,Mk,'x',1,'t',1e9/c,'position (m)','time (ns), drawn as ct');
  axesTitle(ctx,b,fr);
  const y0=Mk.win.y0, y1=Mk.win.y1;
  /* a hangar-frame line x = x0 in display coordinates: x' = x0/γf − βf ct'; the jet's: through two boosted points */
  const doorAt=(x0,ctp)=>[ctp,x0/gf-bf*ctp];
  const lineAt=(P1,P2,ctp)=>[ctp,P1[1]+(P2[1]-P1[1])*(ctp-P1[0])/(P2[0]-P1[0])];
  const tail1=B(0,0), tail2=B(c*1e-6,Hm.v*1e-6), nose1=B(0,Hm.ell), nose2=B(c*1e-6,Hm.ell+Hm.v*1e-6);
  minkFill(ctx,Mk,[doorAt(0,y0),doorAt(0,y1),doorAt(Hm.Lh,y1),doorAt(Hm.Lh,y0)],mix('#070b18',COL.struct,0.08));
  minkFill(ctx,Mk,[lineAt(tail1,tail2,y0),lineAt(tail1,tail2,y1),lineAt(nose1,nose2,y1),lineAt(nose1,nose2,y0)],mix('#070b18',COL.pos,0.13));
  if(Hm.shut>0) minkFill(ctx,Mk,[B(0,0),B(c*e.B.t,0),B(c*e.B.t,Hm.Lh),B(0,Hm.Lh)],rgba(COL.live,0.22));
  /* the bands' names, near the top of the window where each band is */
  { const yl=y0+0.86*(y1-y0), xh=(doorAt(0,yl)[1]+doorAt(Hm.Lh,yl)[1])/2, xj=(lineAt(tail1,tail2,yl)[1]+lineAt(nose1,nose2,yl)[1])/2;
    if(inMink(Mk,yl,xh)) lab(ctx,W,H,Mk.X(xh),Mk.Y(yl),'the hangar',COL.struct,SM_FONT,'center','middle',PLATE);
    if(inMink(Mk,yl,xj)) lab(ctx,W,H,Mk.X(xj),Mk.Y(yl)+16,'the jet',COL.pos,SM_FONT,'center','middle',PLATE); }
  /* the doors: thin while open, thick while shut */
  const far=1e3*Math.max(Hm.L,Hm.Lh);
  minkSeg(ctx,Mk,B(-far,0),B(0,0),COL.struct,1,[3,3]); minkSeg(ctx,Mk,B(0,0),B(far,0),COL.struct,3);
  minkSeg(ctx,Mk,B(-far,Hm.Lh),B(c*e.B.t,Hm.Lh),COL.struct,3); minkSeg(ctx,Mk,B(c*e.B.t,Hm.Lh),B(far,Hm.Lh),COL.struct,1,[3,3]);
  /* the jet's edges */
  minkSeg(ctx,Mk,B(-far,-Hm.b*far),B(far,Hm.b*far),COL.pos,1.6); minkSeg(ctx,Mk,B(-far,Hm.ell-Hm.b*far),B(far,Hm.ell+Hm.b*far),COL.pos,1.6);
  /* "now" at A in the frame drawn, and the hangar's and the jet's nows through A */
  minkSeg(ctx,Mk,[0,Mk.win.x0],[0,Mk.win.x1],rgba(COL.text,0.5),1,[2,4]);
  minkSeg(ctx,Mk,B(0,-far),B(0,far),COL.struct,1.1,[7,4]);                      /* the hangar's: ct = 0 */
  minkSeg(ctx,Mk,B(-Hm.b*far,-far),B(Hm.b*far,far),COL.pos,1.1,[7,4]);           /* the jet's: ct = βx */
  minkEvent(ctx,Mk,W,H,B(c*e.A.t,e.A.x),'A: the entrance shuts',COL.live,-8,-12);
  minkEvent(ctx,Mk,W,H,B(c*e.B.t,e.B.x),'B: the exit opens',COL.live,8,12);
  minkEvent(ctx,Mk,W,H,B(c*e.N.t,e.N.x),'nose in',COL.dim,-8,10);
  minkEvent(ctx,Mk,W,H,B(c*e.T.t,e.T.x),'tail out',COL.dim,8,-10);
  const dt=bf===0?e.B.t:(B(c*e.B.t,e.B.x)[0]-B(0,0)[0])/c;
  lab(ctx,W,H,b.x+8,b.y+12,'in this frame B − A = '+tStr(dt,3)+(dt>0?': the entrance shuts first':dt<0?': the exit opens first':': at once'),COL.live,SM_FONT,'left','middle',PLATE_FIX);
  drawCaption(ctx,Lay);
}

/* ---------------------------------------------------------------- 6. the crash */
function crashCaps(Hm){
  const nm=Hm.jet.name;
  const end=Hm.crushFits?'it ends inside, crushed to '+metres(Hm.Lf,3)+', and the entrance shuts behind it':'it ends crushed to '+metres(Hm.Lf,3)+', still longer than the hangar: the entrance cannot shut';
  const full='The exit stays shut. The nose of the '+nm+' stops against it; the tail cannot know until news of the stop arrives, and nothing carries news faster than light, so the stiffest jet there could be stops slice by slice, the stop running back through it at c (magenta). Above, the hangar’s frame; below, the jet’s. Each slice stops where the news finds it: '+end+'. In both frames it is the same crushed jet in the same place, L√((1 − β)/(1 + β)) long. Below, the slices’ worldlines in each frame: a rigid jet would have stopped all at once, and that would take news faster than light.';
  const short='The exit stays shut: the stop runs back at c, and the '+nm+' ends '+metres(Hm.Lf,3)+' long, '+(Hm.crushFits?'inside.':'still too long.');
  return [full,short];
}
function drawCrash(ctx,W,H,M){
  const V=M.K, Hm=V.Hm, p=V.p, c=C_LIGHT, e=Hm.ev;
  const [cf,cs]=crashCaps(Hm);
  const Lay=stageLayout(ctx,W,H,cf,cs,2,0.38,nbNarrow(H));
  const P=jetPanels(Lay.main,Hm,Lay.narrow,false);
  const flash=0.05*(crashSpan(ST).p1-crashSpan(ST).p0);
  /* the tail passes the entrance at A (ct = 0) only if it gets that far before it stops */
  const tailIn=Hm.crushFits;
  /* ---- the hangar's frame ---- */
  { const Mp=P.H, b=Mp.b, X=Mp.X, hw=hangarWallPx(Hm,Mp.s);
    groundBand(ctx,b.x,b.x1,Mp.yG,10); frame(ctx,b,'#242a3a');
    axesTitle(ctx,b,Lay.narrow?'the hangar’s frame':'the hangar’s frame: the exit stays shut');
    drawHangar(ctx,X(0),X(Hm.Lh),Mp.yG,hw,tailIn&&p>=e.A.t,false,b);
    const xs=sj=>X(crashSliceH(Hm,sj,p)), ph=crashPhase(p,e.B.t,e.S.t);
    crashJet(ctx,Mp,Hm,xs,ph,ph==='during'?X(crashFrontH(Hm,p)):null);
    if(p>=e.B.t) eventFlash(ctx,X(Hm.Lh),Mp.yG-hw/2,(p-e.B.t)/flash,COL.ref);
    if(p>=e.S.t) eventFlash(ctx,X(e.S.x),Mp.yG-hw/2,(p-e.S.t)/flash,COL.live);
    if(tailIn&&p>=e.A.t) eventFlash(ctx,X(0),Mp.yG-hw/2,(p-e.A.t)/flash,COL.struct); }
  /* ---- the jet's frame ---- */
  { const Mp=P.J, b=Mp.b, X=Mp.X, hw=hangarWallPx(Hm,Mp.s), st=jetAt(Hm,p);
    groundBand(ctx,b.x,b.x1,Mp.yG,10); frame(ctx,b,'#242a3a');
    axesTitle(ctx,b,Lay.narrow?'the jet’s frame':'the jet’s frame: the hangar hits the nose');
    drawHangar(ctx,X(st.entrance),X(st.exit),Mp.yG,hw,tailIn&&p>=e.A.tj,false,b);
    const xs=sj=>X(crashSliceJ(Hm,sj,p)), ph=crashPhase(p,e.B.tj,e.S.tj);
    crashJet(ctx,Mp,Hm,xs,ph,ph==='during'?X(crashFrontJ(Hm,p)):null);
    if(p>=e.B.tj) eventFlash(ctx,X(st.exit),Mp.yG-hw/2,(p-e.B.tj)/flash,COL.ref);
    if(p>=e.S.tj) eventFlash(ctx,X(crashSliceJ(Hm,0,p)),Mp.yG-hw/2,(p-e.S.tj)/flash,COL.live);
    if(tailIn&&p>=e.A.tj) eventFlash(ctx,X(st.entrance),Mp.yG-hw/2,(p-e.A.tj)/flash,COL.struct); }
  if(Lay.bottom.length>=1) crashDiagram(ctx,W,H,Lay.bottom[0],Hm,p,false);
  if(Lay.bottom.length>=2) crashDiagram(ctx,W,H,Lay.bottom[1],Hm,p,true);
  drawCaption(ctx,Lay);
}
/* the crushed jet: the part the news has reached (stopped, crushed) orange, the rest green; the front magenta.
   phase: 'before' the hit (all green), 'during' (split at the front, canvas x xFront), 'after' (all crushed) */
function crashJet(ctx,Mp,Hm,xs,phase,xFront){
  const b=Mp.b;
  if(phase!=='during'){ const col=phase==='after'?COL.crush:COL.pos; drawJetAt(ctx,Mp,Hm,xs,col,mix('#070b18',col,0.22)); return; }
  const left=box(b.x,b.y,Math.max(0,xFront-b.x),b.h), right=box(xFront,b.y,Math.max(0,b.x1-xFront),b.h);
  drawJetAt(ctx,Mp,Hm,xs,COL.pos,mix('#070b18',COL.pos,0.22),left);
  drawJetAt(ctx,Mp,Hm,xs,COL.crush,mix('#070b18',COL.crush,0.22),right);
  ctx.beginPath(); ctx.moveTo(xFront,Mp.yG); ctx.lineTo(xFront,Mp.yG-0.30*Hm.L*Mp.s); ctx.strokeStyle=COL.live; ctx.lineWidth=2; ctx.stroke();
  POLY_SEGS.push(xFront,Mp.yG,xFront,Mp.yG-0.30*Hm.L*Mp.s);
}
const crashPhase=(p,tH,tS)=>p<tH?'before':p<tS?'during':'after';
/* the slices' worldlines in one frame: before the news, at the jet's speed; after, at rest (hangar) or at −β (jet) */
function crashDiagram(ctx,W,H,b,Hm,p,jetFrame){
  const c=C_LIGHT, e=Hm.ev;
  /* this frame's own window: from the nose's entry to the news reaching the tail, padded by a share of the span
     (never by multiplying the times: for a jet that does not fit they are all negative, and a factor shrinks the window) */
  const tN=jetFrame?e.N.tj:e.N.t, tS=jetFrame?e.S.tj:e.S.t, span=tS-tN;
  const ct0=c*(tN-0.12*span), ct1=c*(tS+0.30*span);
  const sl=[]; for(let i=0;i<=8;i++) sl.push(Hm.L*i/8);
  const pos=(s,ct)=>jetFrame?crashSliceJ(Hm,s,ct/c):crashSliceH(Hm,s,ct/c);
  const keys=[[ct0,pos(0,ct0)],[ct0,pos(Hm.L,ct0)],[ct1,pos(0,ct1)],[ct1,pos(Hm.L,ct1)],[ct0,jetFrame?jetAt(Hm,ct0/c).entrance:0],
              [ct1,jetFrame?jetAt(Hm,ct1/c).exit:Hm.Lh]];
  const Mk=minkFit(b,keys,0.06);
  minkFrame(ctx,Mk,'x',1,'t',1e9/c,'position (m)','time (ns)');
  axesTitle(ctx,b,jetFrame?'in the jet’s frame':'in the hangar’s frame');
  /* the doors */
  const door=(x0,ct)=>jetFrame?jetAt(Hm,ct/c)[x0===0?'entrance':'exit']:(x0===0?0:Hm.Lh);
  for(const x0 of [0,1]){ const pts=[]; for(let i=0;i<=40;i++){ const ct=ct0+(ct1-ct0)*i/40; pts.push([ct,door(x0,ct)]); } minkPath(ctx,Mk,pts,COL.struct,x0?2.4:1.4); }
  /* the slices */
  for(const s of sl){ const pts=[]; for(let i=0;i<=120;i++){ const ct=ct0+(ct1-ct0)*i/120; pts.push([ct,pos(s,ct)]); }
    minkPath(ctx,Mk,pts,s===0||s===Hm.L?COL.pos:rgba(COL.pos,0.45),s===0||s===Hm.L?1.6:1); }
  /* the stop, from the hit to the tail, at c */
  const H1=jetFrame?[c*e.B.tj,Hm.L]:[c*e.B.t,Hm.Lh], S1=jetFrame?[c*e.S.tj,0]:[c*e.S.t,e.S.x];
  minkSeg(ctx,Mk,H1,S1,COL.live,1.8);
  minkEvent(ctx,Mk,W,H,H1,'the nose stops',COL.ref,-8,-10);
  minkEvent(ctx,Mk,W,H,S1,'the tail learns',COL.live,8,10);
  const now=c*p; if(now>Mk.win.y0&&now<Mk.win.y1) minkSeg(ctx,Mk,[now,Mk.win.x0],[now,Mk.win.x1],rgba(COL.text,0.45),1,[2,3]);
}

/* ================================================================== *
 *  the dispatch, and the scene the boot drives                        *
 * ================================================================== */
const DRAWERS={descent:drawDescent,mspace:drawMspace,mtwash:drawMtwash,hangar:drawHangarView,hspace:drawHspace,crash:drawCrash};
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(DRAWERS[M.view]) DRAWERS[M.view](ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
/* a press on a time plot sets that view's clock there (and stops it, so the moment stays) */
function scrubTo(h,x){ const f=clamp((x-h.b.x)/h.b.w,0,1), v=h.lo+(h.hi-h.lo)*f;
  if(h.view==='descent'){ ST.mRun=false; viewClock(ST,'descent'); SIM.mp=h.toClock(v); }
  else if(h.view==='hangar'){ ST.jRun=false; viewClock(ST,'hangar'); SIM.hp=h.toClock(v); }
  else if(h.view==='crash'){ ST.jRun=false; viewClock(ST,'crash'); SIM.cp=h.toClock(v); }
  return true; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712,drag:null};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  S.pointer=function(type,x,y){
    if(type==='up'){ S.drag=null; return false; }
    if(type==='move'){ if(!S.drag) return false; return scrubTo(S.drag,x); }
    if(type!=='down') return false;
    const h=hitAt(x,y); if(!h) return false;
    if(h.kind==='scrub'){ S.drag=h; return scrubTo(h,x); }
    return false;
  };
  return S;
}
