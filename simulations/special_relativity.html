    groups.forEach((g,i)=>{ g.hidden=v!==ids[i]; });
    for(const k in rows) rows[k].sync();
    dTag.innerHTML='press the plot below to move the row to a height; space stops or starts it';
    sTag.innerHTML='slide the frame: the events move along their hyperbolas, and nothing changes order along a worldline';
    wTag.innerHTML='their speeds were selected between '+FS.betaLo.toFixed(4)+' and '+FS.betaHi.toFixed(4)+' c by the iron';
    hTag.innerHTML='“just fits” sets γ to L / L<sub>h</sub>; press the timeline to stop the clocks there';
    xTag.innerHTML='past 1 the frame overtakes the jet; below 0 it moves the other way';
    cTag.innerHTML='a rigid jet would stop all at once; relativity lets the news travel at c at most';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space starts or stops the animation';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=(v==='descent'||v==='hangar'||v==='crash')?'space starts or stops it · 1–6 switch views':'slide the frame · 1–6 switch views';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  const ptr=(type,e)=>{ const r=canvas.getBoundingClientRect(); if(S.pointer(type,e.clientX-r.left,e.clientY-r.top)){ syncPanel(); refresh(); } };
  canvas.addEventListener('pointerdown',e=>{ if(canvas.setPointerCapture) try{ canvas.setPointerCapture(e.pointerId); }catch(err){} ptr('down',e); });
  canvas.addEventListener('pointermove',e=>ptr('move',e));
  canvas.addEventListener('pointerup',e=>ptr('up',e));

  const RUN={descent:'mRun',hangar:'jRun',crash:'jRun'};
  window.addEventListener('keydown',e=>{
    const tg=e.target&&e.target.tagName;
    if(e.key===' '&&!(tg==='INPUT'&&e.target.type==='range')){ const k=RUN[st.view]; if(k){ e.preventDefault(); st[k]=!st[k]; syncPanel(); refresh(); } }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); refresh(); });

  /* every change repaints at once (refresh); the frame loop moves the running view's clock and repaints it with
     its readout; a still view paints nothing */
  function frameLoop(){
    if(S.step()){ try{ S.draw(); roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* ---- the prose: every number in it is computed here and pinned in selfTest ---- */
const SRC_LINE='The muon’s mass, mean life and decay: PDG 2025 (S. Navas et al., Phys. Rev. D 110, 030001 (2024) and 2025 update). A muon’s energy loss in air: PDG’s tables (Groom, Mokhov &amp; Striganov, dry air at 1 atm). Muons in the atmosphere: PDG 2022 and 2025 reviews of cosmic rays. D. H. Frisch &amp; J. H. Smith (MIT), Am. J. Phys. 31, 342 (1963), the abstract and affiliation (OpenAlex); their counts and geometry as O. Pessoa Jr.’s teaching note (USP) reports the paper; the film “Time Dilation: An Experiment with Mu-Mesons” (PSSC; archive.org dates it 1963), its counters and blackboards. Bailey et al., Nucl. Phys. B 150, 1 (1979), the abstract. The US Standard Atmosphere 1976. The aircraft and the speed of sound in metals: English Wikipedia (revisions of 2026-09-28 to 10-13). World energy: Our World in Data (2024). Every other number is computed on the page; build_sr/derive_kin.py and derive_muon.py recompute them in Python and selfTest pins the page to them.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const INFO={}, DERIV={};
/* the numbers the prose quotes, all from the page's own functions */
const PROSE=(()=>{
  const P={};
  const D=descentModel(PDG_COSMIC.eg.E,PDG_COSMIC.h,1,1), K=muonKin(PDG_COSMIC.eg.E);
  P.g=D.g; P.b=D.b; P.L=D.L; P.tTrip=D.tTrip; P.tauTrip=D.tauTrip; P.thick=D.thick; P.lead=D.lead; P.surv=D.surv; P.survN=D.survN;
  const dl=descentLoss(K.T,1000*PDG_COSMIC.h,0,true);
  P.lossTau=dl.tau; P.lossSurv=Math.exp(-dl.tau/TAU_MU); P.pdgLeff=1000*PDG_COSMIC.h/(dl.tau/TAU_MU); P.Tground=dl.Tend; P.T0=K.T;
  P.perDepth=(K.T-dl.Tend)/(airDepth(0)-airDepth(1000*PDG_COSMIC.h)); P.depth15=airDepth(1000*PDG_COSMIC.h); P.depth0=airDepth(0);
  P.leffShift=100*(P.pdgLeff/(1000*PDG_COSMIC.eg.Lloss)-1);
  /* how sensitive: every stopping power 10 % higher */
  const dk=descentLoss(K.T,1000*PDG_COSMIC.h,0,true,null,1.1);
  P.leffK110=1000*PDG_COSMIC.h/(dk.tau/TAU_MU); P.leffK110Shift=100*(P.leffK110/P.pdgLeff-1); P.TgroundK110=dk.Tend;
  /* Frisch & Smith in this page's air, at the middle of their speeds */
  const bm=(FS.betaLo+FS.betaHi)/2, gm=gammaOf(bm), fs=descentLoss((gm-1)*M_MU,FS.drop,0,true);
  P.fsBeta=bm; P.fsT=fs.t; P.fsTau=fs.tau; P.fsFactor=fs.t/fs.tau; P.fsBb=betaOf(1+fs.Tend/M_MU); P.fsGb=1+fs.Tend/M_MU; P.fsGt=gm;
  /* the energy lost here against the paper's, its 0.989 c read as 0.9885 to 0.9895 (three figures) */
  const lossPaper=bb=>gammaOf(FS.betaTop)-gammaOf(bb);
  P.fsLossLo=(gammaOf(FS.betaTop)-P.fsGb)/lossPaper(FS.betaBottom-5e-4); P.fsLossHi=(gammaOf(FS.betaTop)-P.fsGb)/lossPaper(FS.betaBottom+5e-4);
  P.fsRatio=FS.paper.bottom/FS.paper.top; P.fsTauObs=-TAU_MU*Math.log(P.fsRatio); P.fsSurv=Math.exp(-fs.tau/TAU_MU);
  P.fsPredict=FS.paper.top*P.fsSurv; P.fsPredictN=FS.paper.top*Math.exp(-fs.t/TAU_MU);
  P.corrShift=100*((FS.paper.bottomCorr/FS.paper.topCorr)/(FS.paper.bottom/FS.paper.top)-1);
  P.corrFactor=FS.tDrop/(TAU_MU*Math.log(FS.paper.topCorr/FS.paper.bottomCorr));
  P.filmRatio=FS.film.bottom/FS.film.top; P.filmRunsAv=FS.film.runs.reduce((s,x)=>s+x,0)/FS.film.runs.length;
  /* the hangar at the defaults */
  const a=AIRCRAFT.find(x=>x.id===DEFAULTS.jJet), Hm=hangarModel(jetLength(a),DEFAULTS.jLh,DEFAULTS.jG);
  P.jet=a.name; P.L747=Hm.L; P.Lh=Hm.Lh; P.hg=Hm.g; P.hb=Hm.b; P.ell=Hm.ell; P.shut=Hm.ev.B.t; P.Bj=Hm.ev.B.tj; P.betaStar=Hm.betaStar;
  P.LhJ=Hm.Lh/Hm.g; P.leadExit=Hm.leadExit; P.Lf=Hm.Lf; P.tS=Hm.ev.S.t; P.tSj=Hm.ev.S.tj; P.xS=Hm.ev.S.x;
  P.KEyears=(Hm.g-1)*jetMass(a)*C_LIGHT*C_LIGHT/WORLD_J_2024; P.gFit=Hm.L/Hm.Lh; P.bFit=betaOf(Hm.L/Hm.Lh);
  P.cern=CERN.gamma*TAU_MU;
  return P; })();

INFO.descent='Cosmic rays hit air nuclei high in the atmosphere and make pions; the charged pions decay into muons, most of them typically '+fmt(PDG_COSMIC.h,0)+' km up (PDG). A muon lives 2.197 µs on average before it decays into an electron (a positron, if the muon is positive) and two neutrinos, and in 2.197 µs light goes only '+fmt(CTAU,0)+' m. Yet muons rain on the ground, about '+(PDG_COSMIC.perCm2Min===1?'one':fmt(PDG_COSMIC.perCm2Min,0))+' a minute through every square centimetre of a level detector (PDG). Take PDG’s own example, a '+PDG_COSMIC.eg.E+' GeV muon, and start it at the typical '+fmt(PDG_COSMIC.h,0)+' km. Suppose first that it keeps its speed all the way down. In the Earth’s frame its clock runs '+fmt(PROSE.g,1)+' times slow: the '+usStr(PROSE.tTrip,4)+' the fall takes on the Earth’s clocks is '+usStr(PROSE.tauTrip,4)+' on its own, and its mean decay length is '+km(PROSE.L,4)+'. So '+fmt(100*PROSE.surv,1)+' % of such muons reach the ground, where without time dilation a share of '+sigf(PROSE.survN,2)+' would. In the muon’s own frame nothing about its clock is odd: it lives its 2.197 µs on average. What is odd is the air: '+km(PROSE.thick,3)+' thick, rushing up past it at '+sigf(PROSE.b,6)+' c, so the ground arrives after '+usStr(PROSE.tauTrip,4)+'. Lifetime “increased” in one frame, the atmosphere shortened in the other: one fact, told twice. The stories agree on everything they can both check, because the Earth’s clocks, set together in the Earth’s frame, are not together in the muon’s: there, at the muon’s birth, the ground clock already reads '+usStr(PROSE.lead,4)+'. Real air also slows a muon: from '+km(1000*PDG_COSMIC.h,2)+' the '+PDG_COSMIC.eg.E+' GeV muon loses '+sigf((PROSE.T0-PROSE.Tground)/1000,3)+' GeV (PDG: most muons lose “about '+PDG_COSMIC.lossGeV+' GeV”), on average '+fmt(PROSE.perDepth,2)+' MeV for every g/cm² of air it crosses, arrives with '+sigf(PROSE.Tground,3)+' MeV of kinetic energy, and its decay length effectively falls to '+km(PROSE.pdgLeff,3)+' (PDG’s review: '+PDG_COSMIC.eg.Lloss+' km).';
DERIV.descent='<h4>the decay law, in the muon’s own time</h4>'
  +EQ(1,'N(τ) = N<sub>0</sub> e<sup>−τ/τ<sub>0</sub></sup>, &nbsp; τ<sub>0</sub> = 2.1969811 µs (PDG 2025)')
  +'<p>Each muon’s lifetime is a draw τ<sub>i</sub> = −τ<sub>0</sub> ln(1 − u) with u uniform: a muon has no memory of how long it has lived, so the drawing is the whole of the physics of its decay.</p>'
  +'<h4>the Earth’s frame</h4>'
  +EQ(2,'γ = '+FR('E','mc²')+', &nbsp; βγ = √(γ² − 1), &nbsp; t = '+FR('h<sub>0</sub>','βc')+', &nbsp; τ = '+FR('t','γ'))
  +'<p>At '+PDG_COSMIC.eg.E+' GeV and a steady speed, γ = '+fmt(PROSE.g,3)+' and β = '+sigf(PROSE.b,8)+': t = '+usStr(PROSE.tTrip,5)+', τ = '+usStr(PROSE.tauTrip,5)+'. The share left at the ground is e<sup>−τ/τ<sub>0</sub></sup> = '+fmt(PROSE.surv,4)+'; with the Earth’s t in place of τ it is e<sup>−t/τ<sub>0</sub></sup> = '+sigf(PROSE.survN,3)+'. Equivalently the mean decay length is L = βγcτ<sub>0</sub> = '+km(PROSE.L,4)+' (PDG: “15 km”), and N = N<sub>0</sub> e<sup>−h<sub>0</sub>/L</sup>.</p>'
  +'<h4>the muon’s frame</h4>'
  +EQ(3,'h′ = '+FR('h<sub>0</sub>','γ')+', &nbsp; τ = '+FR('h′','βc')+' = '+FR('h<sub>0</sub>','βγc'))
  +'<p>The same τ, so the same share. The Lorentz transformation of the Earth’s clock at the ground, at the muon’s birth, gives the lead βh<sub>0</sub>/c = '+usStr(PROSE.lead,4)+' (derive_kin.py checks each line of this symbolically, from the boost matrix).</p>'
  +'<h4>in real air</h4>'
  +EQ(4,'τ = '+'∫<sub>0</sub><sup>h<sub>0</sub></sup> '+FR('dz','c βγ(z)')+', &nbsp; R(T(z)) = R(T<sub>0</sub>) − [X(z) − X(h<sub>0</sub>)]')
  +'<p>X(z) is the column of air above z, from the US Standard Atmosphere 1976 ('+fmt(PROSE.depth0,1)+' g/cm² at sea level, '+fmt(PROSE.depth15,1)+' at '+fmt(PDG_COSMIC.h,0)+' km); R(T) is the muon’s range in air at kinetic energy T, PDG’s table interpolated straight in log–log. The integral is cut wherever R passes a printed row, so that each piece is smooth. PDG’s review gives '+PDG_COSMIC.eg.Lloss+' km for the effective decay length of its example; started at '+fmt(PDG_COSMIC.h,0)+' km, this page gets '+km(PROSE.pdgLeff,3)+' ('+fmt(PROSE.leffShift,0)+' % longer). The review does not say which air or which stopping power it used, and the answer is sensitive to both: with every dE/dx 10 % higher the muon reaches the ground with '+sigf(PROSE.TgroundK110,3)+' MeV instead of '+sigf(PROSE.Tground,3)+', and the effective decay length is '+km(PROSE.leffK110,3)+' ('+fmt(PROSE.leffK110Shift,0)+' %).</p>';

INFO.mspace='The same descent, drawn as worldlines in spacetime: height across, time up, with time drawn as ct so that light runs at 45°. The top of the atmosphere and the ground stand still in the Earth’s frame, so their worldlines are vertical; the muon’s leans almost to the light line. The magenta curve is every event 2.197 µs of the muon’s own time after its birth, along any straight worldline from it: c²t² − Δz² (Δz the height from the birth) is the same for all of them, in every frame. Slide the frame from the Earth’s to the muon’s and watch what moves and what does not. The hyperbola stays put; the events slide along it. The muon’s worldline stands up; the atmosphere’s two worldlines lean over and close up to '+km(PROSE.thick,3)+' apart. The ground clock’s ticks spread out, because in the muon’s frame that clock runs slow. And the frame’s “now” (any horizontal line) sweeps round: the Earth’s now through the birth meets the ground at its clock’s 0, the muon’s at '+usStr(PROSE.lead,4)+'. Time dilation, length contraction and the relativity of simultaneity all come from one hyperbolic rotation of this picture: a Lorentz boost.';
DERIV.mspace='<h4>the boost</h4>'
  +EQ(1,'ct′ = γ<sub>f</sub>(ct + β<sub>f</sub> Δz), &nbsp; Δz′ = γ<sub>f</sub>(Δz + β<sub>f</sub> ct)')
  +'<p>for a frame moving down at β<sub>f</sub> = tanh(f η), where η = asinh(βγ) is the muon’s rapidity and f is the slider: 0 the Earth’s frame, 1 the muon’s. Boosts add rapidities, so f = ½ is the frame in which the muon falls and the air rises at the same speed.</p>'
  +'<h4>what stays put</h4>'
  +EQ(2,'c²τ² = c²t² − Δz² = c²t′² − Δz′²')
  +'<p>A worldline through the birth with constant velocity reaches proper time τ on this hyperbola; the boost moves every event along its own hyperbola about the birth, so it can never change the order of events along a worldline, or which side of the light cone an event is on.</p>'
  +'<h4>the ground clock’s lead</h4>'
  +EQ(3,'ct′ = 0 &nbsp;⇒&nbsp; ct = −β<sub>f</sub> Δz, &nbsp; at the ground (Δz = −h<sub>0</sub>): t = β<sub>f</sub> h<sub>0</sub>/c')
  +'<p>In the muon’s frame (β<sub>f</sub> = β) that is '+usStr(PROSE.lead,4)+', most of the '+usStr(PROSE.tTrip,4)+' the Earth says the fall takes: the ground clock does not need to run fast to read that much at the arrival; it was never set together with the muon’s birth in the muon’s frame.</p>';

INFO.mtwash='David Frisch and James Smith of MIT set out to show time dilation as a large effect “using only comparatively simple equipment” (their abstract, 1963). On the summit of Mount Washington, '+FS.drop+' m up, they put a plastic scintillator under '+fmt(100*FS.iron,0)+' cm of iron. The iron stopped the slower muons and the faster ones went straight through the scintillator; those that stopped in it had arrived at '+FS.betaLo.toFixed(4)+'–'+FS.betaHi.toFixed(4)+' c. A muon that decayed there made a second flash with the electron or positron from its decay, microseconds after the first, and only muons with that second flash were counted: '+FS.paper.top+' ± '+FS.paper.topErr+' an hour. At sea level in Cambridge, under less iron because the air had already slowed the muons, they counted '+FS.paper.bottom+' ± '+FS.paper.bottomErr+'. At their mean speed of '+FS.vMean+' c the descent takes '+usStr(FS.tDrop,3)+' on the laboratory’s clocks; a muon at rest keeps only '+fmt(100*Math.exp(-FS.tDrop/TAU_MU),1)+' % of a crowd that long, so without time dilation about '+fmt(FS.paper.top*Math.exp(-FS.tDrop/TAU_MU),0)+' an hour should have arrived. '+fmt(100*PROSE.fsRatio,1)+' % arrived: as many as a muon at rest keeps for '+usStr(PROSE.fsTauObs,2)+'. That is the muons’ own time for the trip, about a ninth of the laboratory’s. Their abstract gives the dilation as '+FS.factorObs+' ± '+FS.factorObsErr+' observed against '+FS.factorCalc+' ± '+FS.factorCalcErr+' calculated for their detection geometry. This page recomputes the descent straight down through its own air: from '+PROSE.fsBeta.toFixed(4)+' c, '+usStr(PROSE.fsTau,3)+' of the muons’ own time, γ '+fmt(PROSE.fsFactor,2)+' on average over that time, and '+fmt(PROSE.fsPredict,0)+' an hour expected at sea level from their '+FS.paper.top+'. The film of the experiment counts one hour each way on camera: '+FS.film.top+' and '+FS.film.bottom+'.';
DERIV.mtwash='<h4>the muons’ own clock, from the counts</h4>'
  +EQ(1,''+FR('N<sub>sea</sub>','N<sub>summit</sub>')+' = e<sup>−τ/τ<sub>0</sub></sup> &nbsp;⇒&nbsp; τ = τ<sub>0</sub> ln '+FR('N<sub>summit</sub>','N<sub>sea</sub>'))
  +'<p>With the paper’s averages, τ = 2.197 µs × ln('+FS.paper.top+'/'+FS.paper.bottom+') = '+usStr(PROSE.fsTauObs,3)+'; against the laboratory’s '+usStr(FS.tDrop,3)+', a factor of '+fmt(FS.tDrop/PROSE.fsTauObs,1)+'. With the counts corrected for chance coincidences ('+FS.paper.topCorr+' and '+FS.paper.bottomCorr+') the same arithmetic gives '+fmt(PROSE.corrFactor,2)+'; their abstract gives '+FS.factorObs+' ± '+FS.factorObsErr+'.</p>'
  +'<h4>the descent, this page’s way</h4>'
  +EQ(2,'t = ∫ '+FR('dz','βc')+', &nbsp; τ = ∫ '+FR('dz','βγc')+', &nbsp; R(T(z)) = R(T<sub>top</sub>) − [X(z) − X(1907 m)]')
  +'<p>At '+sigf(PROSE.fsBeta,4)+' c (γ = '+fmt(PROSE.fsGt,2)+') this gives t = '+usStr(PROSE.fsT,3)+' ('+usStr(FS.tDrop,3)+' at their mean '+FS.vMean+' c), τ = '+usStr(PROSE.fsTau,3)+', and '+sigf(PROSE.fsBb,4)+' c (γ = '+fmt(PROSE.fsGb,2)+') at the bottom, where Pessoa’s note gives '+FS.betaBottom+' c (γ = '+FS.gammaBottom+') for the paper: this page’s air slows the muons more than the paper’s calculation did. With '+FS.betaBottom+' c given to three figures, the energy they lose here is '+fmt(100*(PROSE.fsLossLo-1),0)+'–'+fmt(100*(PROSE.fsLossHi-1),0)+' % more. The ratio t/τ is γ averaged over the muons’ own time (dτ = dt/γ), '+fmt(PROSE.fsFactor,2)+'; the average of the two ends would be '+fmt((PROSE.fsGt+PROSE.fsGb)/2,2)+'.</p>';

INFO.hangar='The classic puzzle: a jet longer than a hangar flies through it so fast that, in the hangar’s frame, it is short enough to fit. Here the '+PROSE.jet+', '+metres(PROSE.L747,4)+' long at rest, flies through a '+fmt(PROSE.Lh,0)+' m hangar at γ = '+fmt(PROSE.hg,0)+' ('+sigf(PROSE.hb,4)+' c) and is '+metres(PROSE.ell,4)+' long in the hangar’s frame. The entrance shuts behind the tail (event A) and the exit, shut until then, opens just as the nose reaches it (event B). In the hangar’s frame A comes first, and for '+tStr(PROSE.shut,3)+' both doors are shut with the whole jet inside. But in the jet’s frame the hangar is the short one, '+metres(PROSE.LhJ,3)+', and the jet cannot fit: B comes '+tStr(-PROSE.Bj,3)+' before A, so the exit is open before the entrance shuts. Both are right. A and B happen '+fmt(PROSE.Lh,0)+' m apart, too far apart for any signal to get from one to the other in time, and for such a pair of events “which came first” depends on the frame: the doors’ clocks, set together in the hangar’s frame, are '+tStr(PROSE.leadExit,3)+' apart in the jet’s. Every observer agrees on what happens at each door, at each moment of that door’s own clock. They disagree only about “at the same time” far apart, which is exactly what “the jet fits” means. (At γ = '+fmt(PROSE.hg,0)+' the empty '+PROSE.jet+' would carry the world’s whole primary energy use of '+fmt(PROSE.KEyears,0)+' years, 2024’s rate, as kinetic energy.)';
DERIV.hangar='<h4>length contraction</h4>'
  +EQ(1,'ℓ = '+FR('L','γ')+', &nbsp; it fits when γ ≥ '+FR('L','L<sub>h</sub>'))
  +'<p>For the '+PROSE.jet+' and the '+fmt(PROSE.Lh,0)+' m hangar, γ ≥ '+fmt(PROSE.gFit,3)+' ('+sigf(PROSE.bFit,4)+' c).</p>'
  +'<h4>the two events</h4>'
  +EQ(2,'A: (t, x) = (0, 0), &nbsp; B: '+FR('L<sub>h</sub> − L/γ','v')+', L<sub>h</sub>')
  +EQ(3,'t′<sub>B</sub> = γ(t<sub>B</sub> − vL<sub>h</sub>/c²) = '+FR('L<sub>h</sub>/γ − L','v'))
  +'<p>which is negative whenever L > L<sub>h</sub>/γ, which a jet longer than the hangar always is: in the jet’s frame the exit always opens first. The frame in which A and B happen at once moves at β* = (L<sub>h</sub> − L/γ)/(βL<sub>h</sub>): '+sigf(PROSE.betaStar,3)+' c here.</p>'
  +'<h4>the clocks</h4>'
  +EQ(4,'t = '+FR('t′','γ')+' + '+FR('vx','c²')+' &nbsp;(a hangar clock at x, read at the jet’s time t′)')
  +'<p>so the exit’s clock reads vL<sub>h</sub>/c² = '+tStr(PROSE.leadExit,3)+' more than the entrance’s at any instant of the jet’s frame, and the nose’s clock reads vL/c² less than the tail’s in the hangar’s.</p>';

INFO.hspace='The hangar as worldlines. The doors stand still in the hangar’s frame, so they are vertical lines; thick while shut. The jet is the green band between its tail and its nose. In the hangar’s frame, “now” is any horizontal line, and between A and B (the magenta patch) a horizontal line runs inside both shut doors with the whole width of the jet on it: the jet is in, the doors are shut. Slide the frame toward the jet’s and the slicing turns. The events stay on their worldlines, and every clock still reads what it read at each event, but past '+sigf(PROSE.betaStar,3)+' c every horizontal line of the new frame that crosses the jet’s band leaves at least one end of the jet outside the hangar. In the jet’s frame the exit opens before the entrance shuts. The two door events are separated by more space than light can cross in the time between them (their interval is spacelike), so there is a frame in which they happen at once ('+sigf(PROSE.betaStar,3)+' c) and frames on either side that put them either way round. Nothing can travel from A to B, so no frame is contradicted by that.';
DERIV.hspace='<h4>simultaneity</h4>'
  +EQ(1,'Δt′ = γ<sub>f</sub>(Δt − β<sub>f</sub>Δx/c), &nbsp; Δt = t<sub>B</sub> − t<sub>A</sub>, &nbsp; Δx = L<sub>h</sub>')
  +'<p>Δt′ changes sign at β<sub>f</sub> = cΔt/Δx = β*. That speed is below c exactly when c²Δt² < Δx², when the interval from A to B is spacelike. If it were timelike, one door could signal the other, and every frame would agree on the order.</p>'
  +'<h4>the bands</h4>'
  +EQ(2,'x′ = '+FR('x<sub>0</sub>','γ<sub>f</sub>')+' − β<sub>f</sub> ct′')

INFO.crash='What if the exit never opens? The nose hits it and stops. The tail cannot know: it keeps flying until news of the stop reaches it, and no news travels faster than light, so even the stiffest material relativity allows stops slice by slice behind a front running back through the jet at c. (A front at c runs at c in every frame; real metal passes a push on at the speed of sound, which is far slower.) Each slice stops where the front finds it, and the jet ends at rest, crushed to L√((1 − β)/(1 + β)). For the '+PROSE.jet+' at γ = '+fmt(PROSE.hg,0)+' that is '+metres(PROSE.Lf,3)+', so it ends inside, and the entrance shuts behind it. In the jet’s frame it is the hangar that runs into the nose; the front runs back through the jet at c and reaches the tail '+tStr(PROSE.L747/C_LIGHT,3)+' after the hit; by then the nose has gone '+fmt(PROSE.hb*PROSE.L747,1)+' m with the hangar. Same crushed jet, same place, every frame. There are no rigid bodies in relativity: a rigid jet would stop all at once along its whole length, and “all at once” means something different in every frame.';

  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];

    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },

    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },

  /* ---------- 7. every view: panels and drawings ---------- */
  const SIZES=[[1400,820],[1100,700],[899,700],[820,520],[560,380]];
  const at=(v,f,absT)=>st=>{ viewClock(st,v); const s=v==='descent'?descentSpan(st):v==='hangar'?hangarSpan(st):crashSpan(st);
    const val=absT!==undefined?absT:s.p0+f*(s.p1-s.p0); if(v==='descent') SIM.mp=val; else if(v==='hangar') SIM.hp=val; else SIM.cp=val; };
  const CONFIGS=[['descent start',{view:'descent'},at('descent',0)],['descent mid',{view:'descent'},at('descent',0.45)],['descent ground',{view:'descent'},at('descent',0.95)],
    ['descent 0.3 GeV',{view:'descent',mE:0.3,mH:8},at('descent',0.5)],['descent 100 GeV',{view:'descent',mE:100,mN:100},at('descent',0.6)],['descent 25 km no twins',{view:'descent',mH:25,mGhost:false},at('descent',0.3)],
    ['mspace earth',{view:'mspace'}],['mspace half',{view:'mspace',sF:0.5}],['mspace muon',{view:'mspace',sF:1}],['mspace past the muon',{view:'mspace',sF:1.25,mE:1}],
    ['mspace back',{view:'mspace',sF:-0.25,mE:0.5}],['mspace bare',{view:'mspace',sHyp:false,sSim:false,mE:30}],
    ['mtwash paper',{view:'mtwash'}],['mtwash film',{view:'mtwash',wSrc:'film'}],['mtwash no loss',{view:'mtwash',wLoss:false,wBeta:0.9954}],
    ['hangar before',{view:'hangar'},at('hangar',0.05)],['hangar A',{view:'hangar'},at('hangar',0,0)],['hangar after',{view:'hangar'},at('hangar',0.97)],
    ['hangar F-16',{view:'hangar',jJet:'F16',jLh:10,jG:3},at('hangar',0.5)],['hangar SR-71 no fit',{view:'hangar',jJet:'SR71',jLh:20,jG:1.5},at('hangar',0.4)],
    ['hangar An-225 γ 10',{view:'hangar',jJet:'AN225',jLh:120,jG:10},at('hangar',0.5)],['hangar Concorde γ at its floor',{view:'hangar',jJet:'CONC',jLh:5,jG:1},at('hangar',0.5)],
    ['hspace hangar',{view:'hspace'}],['hspace jet',{view:'hspace',hF:1}],['hspace β*',{view:'hspace',hF:0.0625}],['hspace −0.5',{view:'hspace',hF:-0.5}],['hspace 1.5 A380',{view:'hspace',hF:1.5,jJet:'A380'}],
    ['crash before',{view:'crash'},at('crash',0.1)],['crash during',{view:'crash'},at('crash',0,40e-9)],['crash after',{view:'crash'},at('crash',0.98)],
    ['crash no fit',{view:'crash',jJet:'AN225',jLh:20,jG:1.2},at('crash',0.8)],['crash γ 10',{view:'crash',jJet:'SR71',jLh:6,jG:10},at('crash',0.5)]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,pre] of CONFIGS) withState(over,()=>{ const M=buildModel(), v=M.view;
    const txt=[readoutHTML(M),eqbarHTML(M),tagHTML(M),INFO[v],DERIV[v]].join(' ').replace(/<[^>]*>/g,' ').replace(/&[a-zA-Z]+;|&#[0-9]+;/g,' ').replace(/[\w.\/]+\.(py|js|json|md|html)\b/g,' ');
    const bad=(txt.match(/\S_\S|[\^{}]|NaN|undefined|Infinity/)||[])[0];
    ok(!bad,nm+': the panels’ text is clean'+(bad?' ("'+bad+'")':'')); },pre);
  const tDraw={};
  for(const [nm,over,pre] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const sh=makeShot(W,H); let err=null; const t1=Date.now();
      try{ drawView(sh,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t1);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=sh.ops.filter(o=>o.op==='text'), strokes=sh.ops.filter(o=>o.op==='stroke');
      ok(strokes.length>=(H<520?4:10)&&texts.length>=(H<520?4:8),nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+texts.length+' texts)');
      { const nf=sh.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/[\^{}]/.test(t.t)){ bad='a caret or brace: "'+t.t.slice(0,40)+'"'; break; }
        if(/\S_\S/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; }
        if(W<900&&/lower (left|right)|below|Below/.test(t.t)){ bad='a narrow stage’s caption names a plot it does not draw: "'+t.t.slice(0,50)+'"'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key fits ('+KEY_DROPS+' dropped)');
    },pre);
  }
  /* the drawn row (the Earth's panel): its dots sit where the model puts the row, so halfway through the muons'
     time they are halfway down from the top (p = 0) to the ground (p = τ_trip, read off the dots that arrive) */
  for(const [E,N] of [[2.4,60],[1,200]]) withState({view:'descent',mE:E,mN:N,mGhost:false},()=>{ const W=1100, H=700, D=descentOf(ST);
    /* the muons' dots (radius 2.2, the muon colour) in both panels; the Earth's row is the line holding the leftmost */
    const rowAt=f=>{ viewClock(ST,'descent'); SIM.mp=f*D.tauTrip; const sh=makeShot(W,H); drawView(sh,W,H,buildModel()); const dots=[];
      for(const o of sh.ops) if(o.op==='fill'&&o.style===COL.pos&&o.c) for(const q of o.c) if(q[2]===2.2) dots.push(q);
      const lm=dots.reduce((a,q)=>!a||q[0]<a[0]?q:a,null);
      return {ys:lm?dots.filter(q=>q[1]===lm[1]).map(q=>q[1]):[],alive:descentView(ST).alive}; };
    const r=[rowAt(0),rowAt(0.5),rowAt(1)], one=x=>x.ys.length===x.alive&&x.alive>0&&x.ys.every(y=>y===x.ys[0]);
    ok(r.every(one),E+' GeV: the row is drawn as one line of its living muons ('+r.map(x=>x.ys.length+'/'+x.alive).join(', ')+')');
    if(r.every(one)) abs((r[1].ys[0]-r[0].ys[0])/(r[2].ys[0]-r[0].ys[0]),0.5,1e-9,E+' GeV: halfway through the muons’ time the drawn row is halfway down'); });
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}
const J=x=>JSON.stringify(x);

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
