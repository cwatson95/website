<title>Special Relativity &mdash; muons that outlive their lifetime, and a jet that fits in a shorter hangar</title>
<!--
  ===================================================================
  special_relativity.html — time dilation and length contraction,
  each told twice, once in each frame
  ===================================================================

  THE DESCENT: cosmic-ray muons made 15 km up, at one speed, each with
  a lifetime drawn from its own clock; the Earth's frame (their clocks
  slow) beside the muons' frame (the air contracted), on one scale and
  on the muons' own time, with the Earth's clocks out of step in the
  muons' frame; twins without time dilation; survivors against height.
  MUON SPACETIME: the descent as worldlines, boosted continuously from
  the Earth's frame to the muon's; the hyperbola of 2.197 us stays put.
  MOUNT WASHINGTON: Frisch & Smith's experiment (1963), the paper's
  counts and the film's hour, recomputed through this page's air.
  THE HANGAR: a jet longer than the hangar (six real aircraft), the
  entrance shut behind its tail and the exit opened at its nose: shut
  together in the hangar's frame, never in the jet's.
  HANGAR SPACETIME: the doors and the jet as worldlines, boosted from
  frame to frame; the same events on the same worldlines, sliced into
  "now" differently, so the two door events trade places at beta*.
  THE CRASH: the exit stays shut; the stop runs back at c and the jet
  ends crushed to L sqrt((1 - beta)/(1 + beta)), the same jet in the
  same place in every frame (inside the hangar when that length fits).

  WHAT IS EXACT
  -----------------------------------------------------------------------
  The Lorentz transformation and everything drawn from it: the clocks
  of every view and their readings, the events and their order in every
  frame, the contracted lengths, the hyperbolas, the crash's front and
  the crushed length (build_sr/derive_kin.py carries every event
  through the boost matrix and checks each closed form with sympy).

  WHAT IS SOURCED (build_sr/data/SOURCES.md)
  -----------------------------------------------------------------------
  The muon's mass, mean life and decay (PDG 2025); its energy loss in
  air (PDG's tables, Groom, Mokhov & Striganov); the cosmic-ray facts
  (PDG 2022 and 2025 reviews); Frisch & Smith's speeds and dilation
  factors (their abstract), counts and geometry (O. Pessoa Jr.'s note
  on the paper), and the film's own counters; the CERN muon storage
  ring's 1979 result; the six aircraft's lengths and empty weights and
  the speed of sound in two metals (English Wikipedia); world primary
  energy in 2024 (Our World in Data).

  WHAT IS MODELLED
  -----------------------------------------------------------------------
  The air: the US Standard Atmosphere 1976 (to 86 km, an exponential
  above).  A muon slowing in it: continuous slowing down on PDG's range
  table, interpolated straight in log-log (no straggling, no scattering),
  falling straight down.  In the descent view one speed for every muon
  and no slowing (the clean case; the readout and the dashed curve give
  the slowing).  Doors that open and shut in no time; a jet that stops
  as stiffly as relativity allows (the stop running back at c).

  WHAT IS NOT MODELLED
  -----------------------------------------------------------------------
  The muons' spectrum, their angles and the Earth's field; the decay of
  negative muons captured in matter; Frisch & Smith's detection
  geometry; anything an airframe would actually do at these speeds.
-->

'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}

  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);

  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* a true minus sign (U+2212), and a negative that rounds to zero printed as zero */
function fmt(x,n){ if(!isFinite(x)) return '—'; const s=Number(x).toFixed(n===undefined?3:n); return /^-0(\.0*)?$/.test(s)?s.slice(1):s.replace('-','−'); }

            /* standard_model.html: the group-theory symbols */
            '&otimes;':'⊗','&oplus;':'⊕','&Xi;':'Ξ','&xi;':'ξ','&psi;':'ψ','&chi;':'χ','&zeta;':'ζ',
            '&partial;':'∂','&sum;':'∑','&nabla;':'∇','&dagger;':'†','&frac14;':'¼','&frac34;':'¾',

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and

   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);

const OWID_2024={"Other renewables": 2863.4773, "Biofuels": 1411.5256, "Solar": 2166.9417, "Wind": 2514.9658, "Hydropower": 4473.135, "Nuclear": 8531.205, "Gas": 41312.492, "Oil": 55289.016, "Coal": 45930.863, "Traditional biomass": 11111.0};

/* ================================================================== *
 *  special relativity in closed form: the boost, the muons' descent   *
 *  in both frames, the hangar's doors, the crash.  derive_kin.py      *
 *  carries every event through the boost MATRIX instead and checks    *
 *  these forms symbolically; selfTest pins the page to its numbers.   *
 * ================================================================== */
/* (1 − β)(1 + β), not 1 − β²: a 100 GeV muon has 1 − β = 5.6 × 10⁻⁷ */
const gammaOf=b=>1/Math.sqrt((1-b)*(1+b));
const betaOf=g=>Math.sqrt((g-1)*(g+1))/g;
const etaOf=b=>0.5*Math.log((1+b)/(1-b));               /* the rapidity, atanh β (for a β given as such) */
const etaOfGamma=g=>Math.asinh(Math.sqrt((g-1)*(g+1)));  /* asinh βγ: no 1 − β to cancel when γ is large */
/* the event (ct, x) seen from a frame moving at β along +x: ct' = γ(ct − βx), x' = γ(x − βct) */
function boost(b,ct,x){ const g=gammaOf(b); return [g*(ct-b*x),g*(x-b*ct)]; }

/* ---- a muon from its total energy (GeV) ---- */
function muonKin(E){
  const g=1000*E/M_MU, bg=Math.sqrt((g-1)*(g+1));
  return {E,g,bg,b:bg/g,eta:Math.asinh(bg),L:bg*CTAU,T:1000*E-M_MU};   /* L = βγcτ, the mean decay length (m); T kinetic (MeV) */
}
/* mulberry32 on a scrambled seed (consecutive seeds give correlated streams: the build_lqg Known-bad) */
function rng32(seed){ let a=(Math.imul(seed^0x9e3779b9,0x85ebca6b)^0xc2b2ae35)>>>0;
  return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
/* n proper lifetimes from exp(−τ/τ0), by inversion (1 − u, so that a u of 0 never gives an infinite life) */
function lifetimes(n,seed){ const r=rng32(seed), out=[]; for(let i=0;i<n;i++) out.push(-TAU_MU*Math.log(1-r())); return out; }

/* ---- the descent at one speed: a row of muons made at the top (h0, km) at one instant of the Earth's ----
   Earth frame: altitude z, the muons moving down at β.  The muons' frame moves down with them.  Everything is
   indexed by the muons' own time p (seconds since they were made), so the two frames show the same decays at the
   same p: the Earth's clocks then read t = γp, and the row is at z = h0 − βc t. */
function descentModel(E,h0km,n,seed){
  const K=muonKin(E), H=1000*h0km, c=C_LIGHT;
  const tTrip=H/(K.b*c), tauTrip=tTrip/K.g;                 /* the Earth's time, and the muons', to the ground */
  const taus=lifetimes(n,seed);
  return Object.assign({},K,{h0:H,tTrip,tauTrip,surv:Math.exp(-tauTrip/TAU_MU),survN:Math.exp(-tTrip/TAU_MU),
    lead:K.b*H/c,                                           /* the ground clock's lead in the muons' frame at their birth (v h0/c²) */
    thick:H/K.g,                                            /* the atmosphere's thickness in the muons' frame */
    taus,caught:taus.filter(t=>t>=tauTrip).length,caughtN:taus.filter(t=>t>=tTrip).length});
}
/* the Earth's frame at the muons' time p: the row's altitude and the Earth's clocks (all one reading) */
function earthAt(D,p){ const t=D.g*p; return {t,z:D.h0-D.b*C_LIGHT*t}; }
/* the muons' frame at their time p: the Earth's mark at altitude z sits at z' = (z − h0)/γ + βcp (the row at
   z' = 0), and the Earth's clock there reads p/γ + β(h0 − z)/c */
function muonFrameZ(D,z,p){ return (z-D.h0)/D.g+D.b*C_LIGHT*p; }
function muonFrameClock(D,z,p){ return p/D.g+D.b*(D.h0-z)/C_LIGHT; }
/* a muon of the row without time dilation decays when the EARTH's clock reaches its lifetime: at p = τᵢ/γ */
const newtonDecayP=(D,tau)=>tau/D.g;

/* ---- the muons' spacetime: the events of the descent about the birth C, in the Earth's frame (ct, Δz = z − h0),
   metres.  The display frame moves DOWN at βf = tanh(f·η): boost(−βf, ct, Δz). ---- */
function muonEvents(D){
  const c=C_LIGHT;
  return {C:[0,0], A:[D.h0/D.b,-D.h0],                     /* the birth, the arrival at the ground */
          M:[D.g*CTAU,-D.bg*CTAU],                         /* where the muon's clock reaches τ0 (it may be under the ground) */
          tauTrip:D.tauTrip, tTrip:D.tTrip};
}

/* ---- the aircraft ---- */
const FT=0.3048, INCH=0.0254, LBM=0.45359237;
function jetLength(a){ return a.len.m!==undefined?a.len.m:a.len.ft*FT+a.len.in*INCH; }
function jetMass(a){ const m=a.mass; return m.kg!==undefined?m.kg:m.t!==undefined?1000*m.t:m.lb*LBM; }
const WORLD_J_2024=Object.values(OWID_2024).reduce((s,v)=>s+v,0)*3.6e15;   /* TWh → J */

/* ---- the hangar: entrance at x = 0, exit at x = L_h (hangar's frame); the jet flies +x at β ----
   Events (t in s, x in m), the origin at A:
     N  the nose reaches the entrance        A  the tail is in: the entrance shuts
     B  the nose reaches the exit: it opens   T  the tail leaves the exit
   In the jet's frame (the tail at x' = 0, the nose at x' = L; A is still the origin) the closed forms below;
   derive_kin.py finds every one by the boost matrix instead. */
function hangarModel(L,Lh,g){
  const b=betaOf(g), c=C_LIGHT, ell=L/g, v=b*c;
  const ev={N:{t:-ell/v,x:0,tj:-L/v,xj:L}, A:{t:0,x:0,tj:0,xj:0},
            B:{t:(Lh-ell)/v,x:Lh,tj:(Lh/g-L)/v,xj:L}, T:{t:Lh/v,x:Lh,tj:Lh/(g*v),xj:0}};
  /* the crash: the exit stays shut; H = B, and the stop runs back at c in the jet's frame */
  const tS=ev.B.t+ell/((1+b)*c), Lf=L*Math.sqrt((1-b)/(1+b));
  ev.S={t:tS,x:Lh-Lf,tj:ev.B.tj+L/c,xj:0};
  return {L,Lh,g,b,ell,v,ev,fits:ell<=Lh,slack:Lh-ell,shut:ev.B.t,
          betaStar:(Lh-ell)/(b*Lh),                        /* the frame in which A and B are simultaneous (|β*| < 1 if it exists) */
          Lf,crushFits:Lf<=Lh,
          lagNose:b*L/c,                                    /* in the hangar's frame the nose's clock reads βL/c less than the tail's */
          leadExit:b*Lh/c};                                 /* in the jet's frame the exit's clock reads βL_h/c more than the entrance's */
}
/* the hangar's frame at its time t: where the tail and the nose are, and each door's state */
function hangarAt(Hm,t){ const x0=Hm.v*t; return {tail:x0,nose:x0+Hm.ell,entranceShut:t>=Hm.ev.A.t,exitOpen:t>=Hm.ev.B.t,
  clockEntrance:t,clockExit:t,clockTail:t/Hm.g,clockNose:t/Hm.g-Hm.lagNose}; }
/* the jet's frame at its time t': where the hangar's doors are (it moves at −β), and their clocks */
function jetAt(Hm,tj){ const e=-Hm.v*tj; return {entrance:e,exit:e+Hm.Lh/Hm.g,entranceShut:tj>=Hm.ev.A.tj,exitOpen:tj>=Hm.ev.B.tj,
  clockEntrance:tj/Hm.g,clockExit:tj/Hm.g+Hm.leadExit,clockTail:tj,clockNose:tj}; }

/* ---- the crash: a slice of the jet s metres (of its own length) from the tail ----
   Hangar's frame: it moves (x = s/γ + βct) until the stop reaches it at ct_s = (L_h + ct_H − s/γ)/(1 + β), then
   stands at s/γ + βct_s.  Jet's frame: it stands at x' = s until ct'_s = ct'_H + (L − s), then moves at −β. */
function crashSliceH(Hm,s,t){ const c=C_LIGHT, ctH=c*Hm.ev.B.t, cts=(Hm.Lh+ctH-s/Hm.g)/(1+Hm.b), ct=c*t;
  return ct<cts?s/Hm.g+Hm.b*ct:s/Hm.g+Hm.b*cts; }
function crashSliceJ(Hm,s,tj){ const c=C_LIGHT, cts=c*Hm.ev.B.tj+(Hm.L-s), ct=c*tj;
  return ct<cts?s:s-Hm.b*(ct-cts); }
/* where the stop has got to: in the hangar's frame x = L_h − c(t − t_H), in the jet's x' = L − c(t' − t'_H) */
function crashFrontH(Hm,t){ return t<Hm.ev.B.t?null:Math.max(Hm.Lh-C_LIGHT*(t-Hm.ev.B.t),Hm.ev.S.x); }
function crashFrontJ(Hm,tj){ return tj<Hm.ev.B.tj?null:Math.max(Hm.L-C_LIGHT*(tj-Hm.ev.B.tj),0); }

/* ================================================================== *
 *  the real air: the US Standard Atmosphere 1976, its column depth,   *
 *  and a muon slowing down in it on PDG's range table                 *
 *  (derive_muon.py does the same by adaptive quadrature and by an     *
 *  ODE on the table's own dE/dx; selfTest pins the page to it)        *
 * ================================================================== */
/* US76 to 86 km: geopotential base height (m), base temperature (K), lapse rate (K/m); an exponential tail above */
const US76=[[0,288.15,-6.5e-3],[11e3,216.65,0],[20e3,216.65,1e-3],[32e3,228.65,2.8e-3],[47e3,270.65,0],[51e3,270.65,-2.8e-3],[71e3,214.65,-2e-3],[84852,186.946,0]];
const US_G0=9.80665, US_R=287.05287, US_R0=6356766;
const US76P=(()=>{ const P=[101325];
  for(let i=1;i<US76.length;i++){ const [h0,T0,Lr]=US76[i-1], h1=US76[i][0], p0=P[i-1];
    P.push(Lr===0?p0*Math.exp(-US_G0*(h1-h0)/(US_R*T0)):p0*Math.pow((T0+Lr*(h1-h0))/T0,-US_G0/(US_R*Lr))); }
  return P; })();
/* density (kg/m³) at geometric altitude z (m) */
function airRho(z){
  if(z>86000) return airRho(86000)*Math.exp(-(z-86000)/5600);
  const H=US_R0*z/(US_R0+z);                                /* geopotential height */
  let i=US76.length-1; while(i>0&&H<US76[i][0]) i--;
  const [h0,T0,Lr]=US76[i], p0=US76P[i], T=T0+Lr*(H-h0);
  const p=Lr===0?p0*Math.exp(-US_G0*(H-h0)/(US_R*T0)):p0*Math.pow(T/T0,-US_G0/(US_R*Lr));
  return p/(US_R*T);
}
/* Gauss-Legendre nodes and weights on [−1, 1] (Newton on P_n; the nodes come out in DESCENDING order) */
function gaussLegendre(n){
  const x=[], w=[];
  for(let i=0;i<n;i++){ let z=Math.cos(PI*(i+0.75)/(n+0.5)), pp=0;
    for(let it=0;it<100;it++){ let p1=1,p2=0; for(let j=1;j<=n;j++){ const p3=p2; p2=p1; p1=((2*j-1)*z*p2-(j-1)*p3)/j; }
      pp=n*(z*p1-p2)/(z*z-1); const dz=p1/pp; z-=dz; if(Math.abs(dz)<1e-16) break; }
    x.push(z); w.push(2/((1-z*z)*pp*pp)); }
  return {x,w};
}
const GL24=gaussLegendre(24);
function glInt(f,a,b){ const m=(a+b)/2, h=(b-a)/2; let s=0; for(let i=0;i<24;i++) s+=GL24.w[i]*f(m+h*GL24.x[i]); return s*h; }
/* the layer edges in geometric altitude (the density is smooth between them), and the column above each edge */
const ATM_EDGES=(()=>{ const e=US76.slice(1).map(l=>US_R0*l[0]/(US_R0-l[0])); e.unshift(0); e.push(86000); return e; })();
const ATM_ABOVE=(()=>{ const n=ATM_EDGES.length, X=new Array(n);
  X[n-1]=airRho(86000)*5600;                                /* the tail above 86 km, exactly */
  for(let i=n-2;i>=0;i--) X[i]=X[i+1]+glInt(airRho,ATM_EDGES[i],ATM_EDGES[i+1]);
  return X; })();
/* the vertical column above altitude z, g/cm² (1 g/cm² = 10 kg/m²) */
function airDepth(z){
  if(z>=86000) return airRho(86000)*5600*Math.exp(-(z-86000)/5600)/10;
  let i=ATM_EDGES.length-2; while(i>0&&z<ATM_EDGES[i]) i--;
  return (ATM_ABOVE[i+1]+glInt(airRho,z,ATM_EDGES[i+1]))/10;
}
/* the altitude at which the column above is X g/cm² (Newton on dX/dz = −ρ/10, then a bisection guard) */
function altitudeOfDepth(X){
  let lo=0, hi=60000;
  if(X>=airDepth(0)) return 0;
  let z=Math.max(0,-8000*Math.log(X/airDepth(0)));
  for(let it=0;it<60;it++){ const f=airDepth(z)-X; if(f>0) lo=Math.max(lo,z); else hi=Math.min(hi,z);
    let zn=z+f/(airRho(z)/10); if(!(zn>lo&&zn<hi)) zn=(lo+hi)/2; if(Math.abs(zn-z)<1e-9) { z=zn; break; } z=zn; }
  return z;
}

/* ---- PDG's table: the CSDA range R(T), piecewise linear in log-log between the printed rows, and its exact inverse ---- */
const MUE_LT=MUE_T.map(Math.log), MUE_LR=MUE_R.map(Math.log);
function interpLog(x,xs,ys){ const lx=Math.log(x);
  if(lx<=xs[0]) return Math.exp(ys[0]+(ys[1]-ys[0])*(lx-xs[0])/(xs[1]-xs[0]));
  let i=0, j=xs.length-1; while(j-i>1){ const m=(i+j)>>1; if(xs[m]<=lx) i=m; else j=m; }
  return Math.exp(ys[i]+(ys[j]-ys[i])*(lx-xs[i])/(xs[j]-xs[i])); }
const muonRange=T=>interpLog(T,MUE_LT,MUE_LR);              /* g/cm² */
const muonTofR=R=>interpLog(R,MUE_LR,MUE_LT);               /* MeV */
const T_FLOOR=MUE_T[0], R_FLOOR=MUE_R[0];                    /* below 10 MeV the table says its numbers are not dependable */

/* ---- a vertical muon of kinetic energy T0 (MeV) from altitude z0 down to z1 (m), slowing as it goes ----
   T(z) = T(R0 − (X(z) − X0)).  The rule is piecewise linear in log-log, so T(z) has a kink wherever R crosses a
   printed row: the integrals are cut at every kink (found by Newton) and each piece is smooth for Gauss-Legendre.
   One pass from the top down; `marks` (altitudes between z0 and z1) get the running totals.  Returns the Earth's
   time t and the muon's own time τ (s) to z1, the kinetic energy there, where it stops if it does (T reaching the
   table's 10 MeV floor), and the marks reached before the stop as {z, t, tau, T}. */
function descentLoss(T0,z0,z1,loss,marks,kLoss){
  /* kLoss: every stopping power times k (the range divided by k); 1 unless the prose asks how sensitive it is */
  const k=kLoss||1, c=C_LIGHT, X0=airDepth(z0), R0=muonRange(T0)/k, Rf=R_FLOOR/k;
  const Tof=z=>loss?muonTofR(k*Math.max(Rf,R0-(airDepth(z)-X0))):T0;
  let zEnd=z1, stop=null;
  if(loss&&R0-(airDepth(z1)-X0)<=Rf){ zEnd=altitudeOfDepth(X0+R0-Rf); stop=zEnd; }
  /* the cuts: the layer edges, every altitude where R(z) is a printed row, and the marks */
  const cuts=[z0,zEnd], isMark=new Set();
  for(const e of ATM_EDGES) if(e<z0&&e>zEnd) cuts.push(e);
  if(loss){ const Rend=R0-(airDepth(zEnd)-X0);
    for(const Rk0 of MUE_R){ const Rk=Rk0/k; if(Rk<R0&&Rk>Rend) cuts.push(altitudeOfDepth(X0+R0-Rk)); } }
  for(const m of marks||[]) if(m<z0&&m>zEnd){ cuts.push(m); isMark.add(m); }
  cuts.sort((a,b)=>b-a);
  let t=0, tau=0; const rec=[];
  for(let k=0;k<cuts.length-1;k++){ const a=cuts[k], b=cuts[k+1]; if(!(a>b)) continue;
    const n=Math.max(1,Math.ceil((a-b)/2000));                /* pieces of at most 2 km: a margin only (20 km gives the same to 3e-16) */
    for(let q=0;q<n;q++){ const hi=a-(a-b)*q/n, lo=a-(a-b)*(q+1)/n, m=(hi+lo)/2, hh=(hi-lo)/2;
      let st=0, su=0;
      for(let i=0;i<24;i++){ const z=m+hh*GL24.x[i], T=Tof(z), p=Math.sqrt(T*(T+2*M_MU));
        st+=GL24.w[i]*(T+M_MU)/(p*c); su+=GL24.w[i]*M_MU/(p*c); }      /* dt/dz = 1/βc, dτ/dz = 1/βγc */
      t+=st*hh; tau+=su*hh; }
    if(isMark.has(b)) rec.push({z:b,t,tau,T:Tof(b)});
  }
  return {t,tau,Tend:stop===null?Tof(z1):T_FLOOR,stop,marks:rec};
}
/* survival with height for the curve under the descent: the muon's own time from z0 to n + 1 even altitudes */
function lossProfile(T0,z0,n){
  const ms=[]; for(let i=1;i<n;i++) ms.push(z0*(1-i/n));
  const d=descentLoss(T0,z0,0,true,ms);
  const pts=[{z:z0,t:0,tau:0,T:T0}].concat(d.marks);
  if(d.stop===null) pts.push({z:0,t:d.t,tau:d.tau,T:d.Tend});
  return {pts,stop:d.stop,end:d};
}

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function clampState(st){

  st.mTrip=clamp(st.mTrip,LIM.mTrip[0],LIM.mTrip[1]); st.jTrip=clamp(st.jTrip,LIM.jTrip[0],LIM.jTrip[1]);

/* ---- the models, memoized on what they depend on ---- */
const descentOf=st=>memo('descent',[st.mE,st.mH,st.mN,st.mSeed].join(','),()=>descentModel(st.mE,st.mH,st.mN,st.mSeed));
/* the same muons in the real air: slowing as they go (PDG's table, US76) — the survival curve and the ground */
const descentLossOf=st=>memo('dloss',[st.mE,st.mH].join(','),()=>{ const K=muonKin(st.mE); const pr=lossProfile(K.T,1000*st.mH,80);
  const end=pr.end; return {pts:pr.pts,stop:pr.stop,tau:end.tau,t:end.t,Tend:end.Tend,
    surv:pr.stop===null?Math.exp(-end.tau/TAU_MU):0, Leff:pr.stop===null?1000*st.mH/(end.tau/TAU_MU):NaN}; });
const jetOf=st=>AIRCRAFT.find(a=>a.id===st.jJet);
const hangarOf=st=>memo('hangar',[st.jJet,st.jLh,st.jG].join(','),()=>{ const a=jetOf(st); const Hm=hangarModel(jetLength(a),st.jLh,st.jG);
  Hm.jet=a; Hm.M=jetMass(a); Hm.KE=(Hm.g-1)*Hm.M*C_LIGHT*C_LIGHT; Hm.worldYears=Hm.KE/WORLD_J_2024; Hm.eta=etaOfGamma(Hm.g); return Hm; });
/* Frisch & Smith in the page's model: from the summit (FS.drop m) to sea level, vertical, US76 air */
const mtwashOf=st=>memo('mtwash',[st.wBeta,st.wLoss,st.wSrc].join(','),()=>{
  const g=gammaOf(st.wBeta), T=(g-1)*M_MU, marks=[]; for(let i=1;i<40;i++) marks.push(FS.drop*(1-i/40));
  const d=descentLoss(T,FS.drop,0,st.wLoss,marks);
  const prof=[{z:FS.drop,t:0,tau:0,T}].concat(d.marks).concat([{z:0,t:d.t,tau:d.tau,T:d.Tend}]);
  const gb=1+d.Tend/M_MU, bb=betaOf(gb), src=st.wSrc==='paper'?FS.paper:FS.film;
  const surv=Math.exp(-d.tau/TAU_MU), survN=Math.exp(-d.t/TAU_MU);
  const ratio=src.bottom/src.top, tauObs=-TAU_MU*Math.log(ratio);
  /* the paper's measured counts carry ± bars; the film's hour is one count each (√N) */
  const eTop=st.wSrc==='paper'?FS.paper.topErr:Math.sqrt(src.top), eBot=st.wSrc==='paper'?FS.paper.bottomErr:Math.sqrt(src.bottom);
  const tauObsErr=TAU_MU*Math.sqrt(Math.pow(eTop/src.top,2)+Math.pow(eBot/src.bottom,2));
  return {beta:st.wBeta,g,T,t:d.t,tau:d.tau,Tend:d.Tend,gb,bb,surv,survN,factor:d.t/d.tau,prof,src,
          predict:src.top*surv,predictN:src.top*survN,predictErr:eTop*surv,ratio,tauObs,tauObsErr,factorObs:d.t/tauObs,
          factorObsErr:d.t/tauObs*tauObsErr/tauObs,eTop,eBot}; });

/* ---- the clocks of the animations (each view keeps its own; a change of what it shows starts it again) ---- */
const SIM={mp:0, hp:null, cp:null, key:{}};
const FRAME=1/60;
function simReset(){ SIM.mp=0; SIM.hp=null; SIM.cp=null; SIM.key={}; }
/* the descent runs on the muons' own time p, from their birth to a hold after the ground */
function descentSpan(st){ const D=descentOf(st); return {p0:0,p1:1.3*D.tauTrip,rate:D.tauTrip/st.mTrip}; }
/* the hangar runs on each frame's own time, both zero at event A (the tail in, the entrance shut) */
function hangarSpan(st){ const Hm=hangarOf(st), e=Hm.ev;
  const lo=Math.min(e.N.t,e.N.tj), hi=Math.max(e.T.t,e.T.tj), pad=0.12*(hi-lo);
  return {p0:lo-pad,p1:hi+pad,rate:(hi-lo+2*pad)/st.jTrip}; }
function crashSpan(st){ const Hm=hangarOf(st), e=Hm.ev;
  const lo=Math.min(e.N.t,e.N.tj), hi=Math.max(e.S.t,e.S.tj,e.A.t), pad=0.18*(hi-lo);
  return {p0:lo-pad,p1:hi+1.6*pad,rate:(hi-lo+2.6*pad)/st.jTrip}; }
/* a view's clock, started again when what it shows changes */
function viewClock(st,v){
  if(v==='descent'){ const k=[st.mE,st.mH,st.mN,st.mSeed].join(','); if(SIM.key.descent!==k){ SIM.key.descent=k; SIM.mp=0; } return SIM.mp; }
  if(v==='hangar'){ const k=[st.jJet,st.jLh,st.jG].join(','), sp=hangarSpan(st); if(SIM.key.hangar!==k||SIM.hp===null){ SIM.key.hangar=k; SIM.hp=sp.p0; } return SIM.hp; }
  if(v==='crash'){ const k=[st.jJet,st.jLh,st.jG].join(','), sp=crashSpan(st); if(SIM.key.crash!==k||SIM.cp===null){ SIM.key.crash=k; SIM.cp=sp.p0; } return SIM.cp; }
  return 0;
}
function viewAnimates(st){ return (st.view==='descent'&&st.mRun)||((st.view==='hangar'||st.view==='crash')&&st.jRun); }
/* one frame: the running view's clock moves on, and wraps round after its hold */
function runStep(st){
  if(!viewAnimates(st)) return false;
  const v=st.view; viewClock(st,v);
  if(v==='descent'){ const s=descentSpan(st); SIM.mp+=FRAME*s.rate; if(SIM.mp>s.p1) SIM.mp=s.p0; }
  else if(v==='hangar'){ const s=hangarSpan(st); SIM.hp+=FRAME*s.rate; if(SIM.hp>s.p1) SIM.hp=s.p0; }
  else { const s=crashSpan(st); SIM.cp+=FRAME*s.rate; if(SIM.cp>s.p1) SIM.cp=s.p0; }
  return true;
}

/* ---- the view models ---- */
/* the row so far: the clock stops at the ground, so "alive" there means caught */
function descentView(st){ const D=descentOf(st), p=viewClock(st,'descent'), pe=Math.min(p,D.tauTrip);
  return {D,p,pe,loss:descentLossOf(st),E:earthAt(D,pe),ghost:st.mGhost,
    alive:D.taus.filter(t=>t>pe).length,decayed:D.taus.filter(t=>t<=pe).length,
    aliveN:D.taus.filter(t=>t/D.g>pe).length,arrived:p>=D.tauTrip}; }
function mspaceView(st){ const D=descentOf(st), K=muonKin(st.mE);
  const f=st.sF, bf=Math.tanh(f*K.eta);                    /* the display frame moves down at βf */
  return {D,K,f,bf,gf:gammaOf(bf),ev:muonEvents(D),hyp:st.sHyp,sim:st.sSim}; }
function mtwashView(st){ return {W:mtwashOf(st),src:st.wSrc,loss:st.wLoss}; }
function hangarView(st){ const Hm=hangarOf(st), p=viewClock(st,'hangar');
  return {Hm,p,Hh:hangarAt(Hm,p),Hj:jetAt(Hm,p)}; }
function hspaceView(st){ const Hm=hangarOf(st), f=st.hF, bf=Math.tanh(f*Hm.eta); return {Hm,f,bf,gf:gammaOf(bf)}; }
function crashView(st){ const Hm=hangarOf(st), p=viewClock(st,'crash'); return {Hm,p}; }
const MODELS={descent:st=>({D:descentView(st)}),mspace:st=>({S:mspaceView(st)}),mtwash:st=>({W:mtwashView(st)}),
              hangar:st=>({H:hangarView(st)}),hspace:st=>({X:hspaceView(st)}),crash:st=>({K:crashView(st)})};
function buildModel(){ const st=ST, v=st.view; clampState(st); return Object.assign({view:v},MODELS[v]?MODELS[v](st):{}); }

/* ================================================================== */
/*  formatting                                                          */
/* ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
/* a time in the unit that suits it: ns, µs */
function tStr(t,n){ const a=Math.abs(t); if(a<1e-6) return sigfx(t*1e9,n||3)+' ns'; if(a<1e-3) return sigfx(t*1e6,n||3)+' µs'; return sigfx(t*1e3,n||3)+' ms'; }
/* sigf with a true minus and no exponent for the everyday range */
function sigfx(x,n){ return sigf(x,n); }
/* a muon's time, always in µs (the muon views compare 0.7 µs with 6.4 µs) */
function usStr(t,n){ return sigf(t*1e6,n||3)+' µs'; }
/* a tick value with the decimals its step needs (a step of 0.5 prints 1.5, of 10 prints 40) */
function tickStr(v,step){ const d=Math.max(0,Math.ceil(-Math.log10(step)-1e-9)); return (Math.abs(v)<step*1e-9?0:v).toFixed(d).replace('-','−'); }
function km(m,n){ return sigf(m/1000,n||3)+' km'; }
function metres(m,n){ return Math.abs(m)>=1000?km(m,n):sigf(m,n||3)+' m'; }
const OKS=b=>b?'good':'bad';

/* ================================================================== *
 *  the readout, the equation bar and the tag                          *
 * ================================================================== */
const READOUTS={}, EQBARS={}, TAGS={};
function readoutHTML(M){ return READOUTS[M.view]?READOUTS[M.view](M):''; }
function eqbarHTML(M){ return EQBARS[M.view]?EQBARS[M.view](M):''; }
function tagHTML(M){ return TAGS[M.view]?TAGS[M.view](M):''; }
const pctS=(x,n)=>x>=1e-4?sigf(100*x,n||3)+' %':sigf(x,2);
/* a large number to the nearest thousand, with a thin space: 47 000 */
const thousands=x=>String(Math.round(x/1000)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' 000';
const GeV=E=>sigf(E,3)+' GeV';

READOUTS.descent=M=>{
  const V=M.D, D=V.D, L=V.loss, n=D.taus.length;
  let h='<div class="rname">'+D.caught+' of '+n+' reach the ground<small>made at '+fmt(D.h0/1000,0)+' km at '+GeV(D.E)+'; '+(V.arrived?'all down':'falling')+'</small></div><table>';
  h+=hd('the muons')+rrow('speed',sigf(D.b,7)+' c')+rrow('Lorentz factor γ',sigf(D.g,4))+rrow('mean decay length βγcτ',km(D.L,4))
    +rrow('without time dilation, βcτ',km(D.b*CTAU,3));
  h+=hd('to the ground')+rrow('the Earth’s clocks',usStr(D.tTrip,4))+rrow('the muons’ own clocks',usStr(D.tauTrip,4))
    +rrow('expected to survive',pctS(D.surv))+rrow('this row',D.caught+' of '+n)+rrow('without time dilation',pctS(D.survN),'bad');
  h+=hd('in the muons’ frame')+rrow('the air is',km(D.thick,3)+' thick')+rrow('the ground arrives after',usStr(D.tauTrip,4))
    +rrow('the ground clock at their birth',usStr(D.lead,4));
  h+=hd('in real air (PDG’s stopping, US 1976)')+(L.stop===null
    ?rrow('expected to survive',pctS(L.surv))+rrow('arriving with',sigf(L.Tend,3)+' MeV of '+sigf(muonKin(D.E).T,4))+rrow('decay length, effectively',km(L.Leff,3))
    :rrow('it stops at',km(L.stop,3),'bad')+rrow('so it never reaches','the ground','bad'));
  return h+'</table><div class="note">Each muon’s lifetime is a draw from e<sup>−τ/2.197 µs</sup> of its <b>own</b> time, the same draw in both panels. The PDG review’s example is a '+PDG_COSMIC.eg.E+' GeV muon: decay length '+PDG_COSMIC.eg.L+' km, “reduced to '+PDG_COSMIC.eg.Lloss+' km by energy loss”. Started at the review’s typical '+fmt(PDG_COSMIC.h,0)+' km, this page’s air gives '+km(PROSE.pdgLeff,3)+' (the review does not say where its muon starts, or which air or stopping power it used).</div>';
};
EQBARS.descent=M=>'<span class="lhs">N / N<sub>0</sub></span> = e<sup>−t/γτ</sup> = <span class="hl">e<sup>−h<sub>0</sub>/βγcτ</sup></span>, &nbsp;τ = 2.197 µs'
  +'<span class="sm">the Earth’s clocks count t = h₀/βc; the muons’ own clocks count t/γ, and decay goes by their own clocks: the same exponent in either frame</span>';
TAGS.descent=M=>'<b>the descent</b> &nbsp;cosmic-ray muons, from the top of the sky to the ground';

READOUTS.mspace=M=>{
  const S=M.S, D=S.D, bf=S.bf, gf=S.gf, w=(D.b-bf)/(1-D.b*bf);
  const name=S.f===0?'the Earth’s frame':S.f===1?'the muon’s frame':'a frame between';
  const tA=boost(-bf,D.h0/D.b,-D.h0)[0]/C_LIGHT;
  let h='<div class="rname">'+name+'<small>moving down at '+sigf(bf,6)+' c against the Earth</small></div><table>';
  h+=hd('in this frame')+rrow('the muon falls at',Math.abs(w)<1e-12?'rest':sigf(w,6)+' c')+rrow('the air rises at',sigf(bf,6)+' c')
    +rrow('the air is',km(D.h0/gf,4)+' thick')+rrow('birth to the ground',usStr(tA,4))+rrow('the ground clock at the birth',usStr(bf*D.h0/C_LIGHT,4));
  h+=hd('the same in every frame')+rrow('the muon’s own time to the ground',usStr(D.tauTrip,4))+rrow('the interval c²t² − Δz²',sigf(Math.pow(C_LIGHT*D.tauTrip/1000,2),5)+' km²');
  return h+'</table><div class="note">A frame’s “now” is a horizontal line in its own diagram. The Earth’s now through the birth meets the ground where its clock reads 0; the muon’s meets it where the same clock reads '+usStr(D.lead,4)+'. Neither is wrong: each frame sets its distant clocks together with its own light signals, and the two settings differ.</div>';
};
EQBARS.mspace=M=>'<span class="lhs">c²τ²</span> = c²t² − Δz² = <span class="hl">c²t′² − Δz′²</span>'
  +'<span class="sm">the interval from the birth to any event is the same in every frame: the hyperbolas of fixed τ stay where they are as the frame slides</span>';
TAGS.mspace=M=>'<b>muon spacetime</b> &nbsp;the descent as worldlines, from the Earth’s frame to the muon’s';

READOUTS.mtwash=M=>{
  const V=M.W, w=V.W, src=w.src, paper=V.src==='paper';
  let h='<div class="rname">'+fmt(w.predict,0)+' expected, '+src.bottom+' counted<small>at sea level, an hour, from '+src.top+' on the summit; '+fmt(w.predictN,1)+' without time dilation</small></div><table>';
  h+=hd('the descent (this page’s air'+(V.loss?'':', no slowing')+')')+rrow('speed at the summit',sigf(w.beta,5)+' c (γ '+sigf(w.g,4)+')')
    +rrow('speed at sea level',sigf(w.bb,5)+' c (γ '+sigf(w.gb,3)+')')+rrow('the laboratory’s time',usStr(w.t,3))+rrow('the muons’ own time',usStr(w.tau,3))
    +rrow('t/τ, γ averaged over τ',fmt(w.factor,2));
  h+=hd(paper?'the counts (their paper)':'the counts (the film’s hour)')+rrow('summit',paper?src.top+' ± '+src.topErr:src.top+'')+rrow('sea level',paper?src.bottom+' ± '+src.bottomErr:src.bottom+'')
    +rrow('share that survived',fmt(100*w.ratio,1)+' %')+rrow('the muons’ time from that',usStr(w.tauObs,2)+' ± '+usStr(w.tauObsErr,1))
    +rrow('the laboratory’s ÷ the muons’',fmt(w.factorObs,1)+' ± '+fmt(w.factorObsErr,1));
  h+=hd('their own numbers (abstract)')+rrow('speeds selected',FS.betaLo.toFixed(4)+'–'+FS.betaHi.toFixed(4)+' c')+rrow('time dilation, observed',FS.factorObs+' ± '+FS.factorObsErr)
    +rrow('calculated for their geometry',FS.factorCalc+' ± '+FS.factorCalcErr);
  return h+'</table><div class="note">'+(paper?'The paper’s 563 ± 10 and 408 ± 9 an hour are averages (550 and 397 after chance coincidences are taken off, which moves the ratio by '+fmt(PROSE.corrShift,1)+' %).':'The film’s own hour: the summit counter stopped at 568, the sea-level counter at 412; the five other summit runs on its blackboard were 554, 582, 527, 570 and 588.')+' This page sends the muons straight down; a real detector also counts muons that come in at an angle, through more air.</div>';
};
EQBARS.mtwash=M=>'<span class="lhs">τ</span> = ∫ <span class="hl">dt / γ(t)</span> = ∫<sub>0</sub><sup>1907 m</sup> dz / (βγc)'
  +'<span class="sm">the muon’s own clock adds up the laboratory’s time divided by its γ at each moment; '+(M.W.loss?'here γ falls from '+fmt(M.W.W.g,1)+' to '+fmt(M.W.W.gb,1)+' as the air slows it':'with the slowing off, γ stays '+fmt(M.W.W.g,1))+'</span>';
TAGS.mtwash=M=>'<b>Mount Washington</b> &nbsp;Frisch &amp; Smith’s muons, 1907 m down to Cambridge';

READOUTS.hangar=M=>{
  const Hm=M.H.Hm;
  let h='<div class="rname">'+(Hm.fits?'it fits: shut together for '+tStr(Hm.shut,3):'it does not fit at this speed')+'<small>the '+Hm.jet.name+' at '+sigf(Hm.b,5)+' c (γ '+sigf(Hm.g,4)+') through '+metres(Hm.Lh,3)+'</small></div><table>';
  h+=hd('lengths')+rrow('the jet at rest',metres(Hm.L,4)+' ('+Hm.jet.lenPrinted+')')+rrow('the jet, hangar’s frame',metres(Hm.ell,4))
    +rrow('the hangar at rest',metres(Hm.Lh,3))+rrow('the hangar, jet’s frame',metres(Hm.Lh/Hm.g,4))+rrow('fits from γ =',sigf(Hm.L/Hm.Lh,4)+(Hm.L>Hm.Lh?' ('+sigf(betaOf(Hm.L/Hm.Lh),4)+' c)':''));
  h+=hd('A (entrance shuts) and B (exit opens)')+rrow('B − A, hangar’s frame',tStr(Hm.ev.B.t,4),OKS(Hm.ev.B.t>0))+rrow('B − A, jet’s frame',tStr(Hm.ev.B.tj,4),OKS(Hm.ev.B.tj>0))
    +(Math.abs(Hm.betaStar)<1?rrow('at once in the frame moving at',sigf(Hm.betaStar,4)+' c'):rrow('at once in','no frame (A could cause B)'));
  h+=hd('the clocks')+rrow('jet’s frame: exit ahead of entrance by',tStr(Hm.leadExit,4))+rrow('hangar’s frame: tail ahead of nose by',tStr(Hm.lagNose,4));
  h+=hd('what it would take')+rrow('kinetic energy (γ − 1)Mc²',sigf(Hm.KE,3)+' J')+rrow('empty mass',Hm.jet.massPrinted)
    +rrow('the world’s energy in 2024',sigf(Hm.worldYears,3)+' years of it');
  return h+'</table><div class="note">“Fits” is a statement about simultaneity: both doors shut <b>at the same time</b> with the jet between them. The hangar’s frame says that happens; the jet’s frame says the exit opened first. Both are right, because they slice spacetime into “now” differently.</div>';
};
EQBARS.hangar=M=>'<span class="lhs">ℓ</span> = L / γ, &nbsp; <span class="hl">t′ = γ(t − vx/c²)</span>'
  +'<span class="sm">a moving length is shortened, and events at once in one frame are not at once in another: in the jet’s frame the exit’s clock (x = L<sub>h</sub>) reads vL<sub>h</sub>/c² ahead of the entrance’s</span>';
TAGS.hangar=M=>'<b>the hangar</b> &nbsp;a jet longer than the hangar, shut inside it';

READOUTS.hspace=M=>{
  const X=M.X, Hm=X.Hm, bf=X.bf, c=C_LIGHT;
  const w=(Hm.b-bf)/(1-Hm.b*bf), gw=gammaOf(w);
  const dt=(boost(bf,c*Hm.ev.B.t,Hm.Lh)[0])/c;
  let h='<div class="rname">'+(X.f===0?'the hangar’s frame':X.f===1?'the jet’s frame':'a frame between')+'<small>moving at '+sigf(bf,5)+' c past the hangar</small></div><table>';
  h+=hd('in this frame')+rrow('B − A',tStr(dt,4),OKS(dt>0))+rrow('the hangar moves at',sigf(-bf,5)+' c')+rrow('and is',metres(Hm.Lh/X.gf,4)+' long')
    +rrow('the jet moves at',sigf(w,5)+' c')+rrow('and is',metres(Hm.L/gw,4)+' long');
  h+=hd('in every frame')+rrow('A and B at once at',Math.abs(Hm.betaStar)<1?sigf(Hm.betaStar,4)+' c':'no speed')+rrow('the interval c²Δt² − Δx², A to B',sigf(Math.pow(c*Hm.ev.B.t,2)-Hm.Lh*Hm.Lh,4)+' m²');
  return h+'</table><div class="note">A negative interval means A and B are spacelike: neither can affect the other, and their order depends on the frame. A positive one would fix their order in every frame.</div>';
};
EQBARS.hspace=M=>'<span class="lhs">Δt′</span> = γ(Δt − vΔx/c²)'
  +'<span class="sm">A and B are L<sub>h</sub> apart: in a frame moving fast enough toward the exit the vΔx/c² term wins and B comes first</span>';
TAGS.hspace=M=>'<b>hangar spacetime</b> &nbsp;the doors and the jet as worldlines, from frame to frame';

READOUTS.crash=M=>{
  const Hm=M.K.Hm, e=Hm.ev;
  let h='<div class="rname">'+metres(Hm.Lf,3)+' long, '+(Hm.crushFits?'inside':'still too long')+'<small>the '+Hm.jet.name+' at '+sigf(Hm.b,5)+' c into a shut exit</small></div><table>';
  h+=hd('the hangar’s frame')+rrow('the nose stops',tStr(e.B.t,4))+rrow('the tail learns',tStr(e.S.t,4))+rrow('and stops at',metres(e.S.x,4)+' from the entrance');
  h+=hd('the jet’s frame')+rrow('the nose stops',tStr(e.B.tj,4))+rrow('the tail learns',tStr(e.S.tj,4)+' (L/c after)');
  h+=hd('the crushed jet')+rrow('L√((1 − β)/(1 + β))',metres(Hm.Lf,4))+rrow('the hangar',metres(Hm.Lh,3),OKS(Hm.crushFits))
    +rrow('uncrushed it would need γ ≥',sigf(Hm.L/Hm.Lh,4));
  return h+'</table><div class="note">This is the stiffest jet relativity allows: the stop travels at c. A real airframe passes a push on at the speed of sound in its metal, '+fmt(SOUND.ti/1000,2)+'–'+fmt(SOUND.al/1000,2)+' km/s in titanium and aluminium, '+thousands(C_LIGHT/SOUND.al)+'–'+thousands(C_LIGHT/SOUND.ti)+' times slower than light.</div>';
};
EQBARS.crash=M=>'<span class="lhs">L<sub>crushed</sub></span> = L / γ(1 + β) = <span class="hl">L √((1 − β)/(1 + β))</span>'
  +'<span class="sm">the stop runs back at c while the tail keeps coming at v: every frame agrees on where each slice ends</span>';
TAGS.crash=M=>'<b>the crash</b> &nbsp;the exit stays shut: no rigid bodies';

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_lagr/p4_views.js (lineage build_buoy); the camera block from     *
 *  pulsar.html (v3, makeCamera, camBasis, project)                    *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
