<title>The Standard Model from symmetry &mdash; gauge groups, multiplets, the Higgs, the eightfold way, colour, and the running couplings</title>
<!--
  ===================================================================
  standard_model.html — how the particles of the Standard Model, and
  the mesons and baryons built from its quarks, follow from the group
  theory of the gauge forces SU(3) x SU(2) x U(1)
  ===================================================================

  Six views.  THE GAUGE GROUP: the generators of U(1), SU(2) ... SU(6)
  as matrices, one gauge boson per generator (N^2 - 1 of them); the
  structure constants f_abc computed from the matrices' commutators;
  the roots in the Cartan plane (the SU(3) hexagon is the gluon
  octet's colour charges); which pairs fail to commute, i.e. why
  gluons and W's interact with each other and photons do not.  ONE
  GENERATION: the fifteen left-handed Weyl fields placed by weak
  isospin and hypercharge, with the lines of constant electric
  charge; the five gauge anomalies computed exactly for the Standard
  Model's hypercharges or for any you choose, and for N colours the
  unique anomaly-free assignment — the proton's charge is +1 for every
  odd N.  THE HIGGS: the Mexican-hat potential in a camera you can
  orbit, its Goldstone and Higgs modes, the symmetric and broken
  phases as mu^2 changes sign, the Weinberg rotation of (W3, B) into
  (Z, photon), the tree-level masses, and the Yukawa ladder of every
  fermion mass.  THE EIGHTFOLD WAY: flavour SU(3) weight diagrams for
  any irrep (p, q), the tensor products 3x3bar = 8+1 and
  3x3x3 = 10+8+8+1 decomposed by peeling highest weights, the meson
  nonets and the baryon octet and decuplet with their measured masses,
  Gell-Mann-Okubo and the equal-spacing prediction of the Omega-minus,
  and the pseudoscalar and vector mixing angles.  COLOUR & SPIN: how
  many colour singlets 3^a x 3bar^b contains (triality), the epsilon
  tensor that makes qqq a singlet, the SU(6) spin-flavour 56 = (8,2) +
  (10,4) that makes the decuplet spin 3/2, and the quark-model
  magnetic moments against the measured ones.  RUNNING COUPLINGS: the
  one-loop beta coefficients computed from the same representation
  table (41/10, -19/6, -7), asymptotic freedom and its 16.5-flavour
  limit, the three inverse couplings from M_Z to the Planck scale, the
  Standard Model's near miss and the supersymmetric crossing.

  WHAT IS MEASURED (build_sm/pdg.txt, each row checked against the
  pdftotext of its source by build_sm/check_pdg.py)
  ------------------------------------------------------------------
  Particle Data Group, Review of Particle Physics 2026 (Int. J. Mod.
  Phys. A 41, 2630011): the octet, decuplet, pseudoscalar and vector
  meson masses; the octet and Omega magnetic moments and the |Sigma0 ->
  Lambda| transition moment; M_W, M_Z, M_H; G_F, alpha(0),
  sin^2 theta-hat(M_Z) (MS-bar), alpha_s(M_Z); the lepton masses, the
  MS-bar quark masses and the top's direct mass, the tritium bound on
  the neutrino mass.  The MS-bar alpha-hat(M_Z)^-1 = 127.930 is from
  the 2024 Electroweak review (the 2026 one no longer prints it).  The
  Delta(1232) mass is PDG's range midpoint (1230 to 1234 MeV).

  WHAT IS EXACT
  -------------
  All of the group theory: generators, structure constants, Casimirs,
  weights (Gelfand-Tsetlin patterns), dimensions, Dynkin indices,
  cubic anomalies, tensor-product decompositions, singlet counts, the
  anomaly coefficients and the beta coefficients (exact rationals).
  build_sm/derive.py reproduces them by independent routes (numpy
  traces, the Weyl character formula read off by FFT, the Weyl
  integration formula, Okubo's closed forms).

  WHAT IS MODELLED
  ----------------
  Tree-level electroweak relations (the 0.2-1 % gaps to the measured
  masses are the loop corrections, not modelled); SU(3)-symmetric and
  first-order-broken hadron masses (Gell-Mann-Okubo; isospin-averaged
  multiplets); the non-relativistic SU(6) quark model with constituent
  masses fitted to mu_p and mu_Lambda; one-loop running with no
  thresholds except the quark flavours in alpha_s, no Yukawa or
  two-loop terms, and a sharp supersymmetry threshold.  The Mexican
  hat's shape is exact; its motion is a drawing, not a field theory.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}

            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ',
            /* standard_model.html: the group-theory symbols */
            '&otimes;':'⊗','&oplus;':'⊕','&Xi;':'Ξ','&xi;':'ξ','&psi;':'ψ','&chi;':'χ','&zeta;':'ζ',
            '&partial;':'∂','&sum;':'∑','&nabla;':'∇','&dagger;':'†','&frac14;':'¼','&frac34;':'¾',
            '&sim;':'∼','&isin;':'∈','&bull;':'•','&harr;':'↔','&uarr;':'↑','&darr;':'↓','&Theta;':'Θ',

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){

/* ================================================================== *
 *  physics — exact group theory, then the measured side               *
 *  Every function here is pinned in selfTest against build_sm/        *
 *  derive.py, which takes a different route to each number.          *
 * ================================================================== */
const DEG=PI/180, RAD=180/PI;

/* ---- exact rationals (numerators and denominators stay far below 2^53 here) ---- */
function gcdI(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; }
function Q(n,d){
  if(d===undefined) d=1;
  if(!Number.isInteger(n)||!Number.isInteger(d)) throw new Error('Q: non-integer '+n+'/'+d);
  if(d===0) throw new Error('Q: zero denominator');

const qadd=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d);
const qsub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d);
const qmul=(a,b)=>Q(a.n*b.n,a.d*b.d);
const qdiv=(a,b)=>Q(a.n*b.d,a.d*b.n);
const qneg=a=>Q(-a.n,a.d);
const qint=k=>Q(k,1);
const qval=a=>a.n/a.d;
const qeq=(a,b)=>a.n===b.n&&a.d===b.d;
const qzero=a=>a.n===0;
function qpow(a,k){ let r=Q(1); for(let i=0;i<k;i++) r=qmul(r,a); return r; }
function qsum(list){ return list.reduce((s,x)=>qadd(s,x),Q(0)); }
/* a fraction for the canvas and the panels: a real minus sign, no "/1" */
function qstr(a){ const s=a.n<0?'−':''; return a.d===1?s+Math.abs(a.n):s+Math.abs(a.n)+'/'+a.d; }
function qstrSigned(a){ return a.n>0?'+'+qstr(a):qstr(a); }

/* ================================================================== *
 *  A. the gauge algebras                                              *
 * ================================================================== */
/* a complex N x N matrix as two flat arrays */
function cmat(N){ return {N,re:new Float64Array(N*N),im:new Float64Array(N*N)}; }
function cmul(A,B){ const N=A.N, C=cmat(N);
  for(let i=0;i<N;i++) for(let k=0;k<N;k++){ const ar=A.re[i*N+k], ai=A.im[i*N+k]; if(ar===0&&ai===0) continue;
    for(let j=0;j<N;j++){ const br=B.re[k*N+j], bi=B.im[k*N+j]; C.re[i*N+j]+=ar*br-ai*bi; C.im[i*N+j]+=ar*bi+ai*br; } }
  return C; }
/* Tr(A B) as [re, im] */
function ctrace2(A,B){ const N=A.N; let r=0,m=0;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const ar=A.re[i*N+j], ai=A.im[i*N+j], br=B.re[j*N+i], bi=B.im[j*N+i]; r+=ar*br-ai*bi; m+=ar*bi+ai*br; }
  return [r,m]; }
/* the generalized Gell-Mann matrices, normalised Tr(l_a l_b) = 2 delta_ab, in the standard SU(3)

function gellMann(N){
  const out=[];
  for(let k=1;k<N;k++){
    for(let j=0;j<k;j++){
      const S=cmat(N); S.re[j*N+k]=1; S.re[k*N+j]=1; out.push({kind:'S',j,k,M:S});
      const A=cmat(N); A.im[j*N+k]=-1; A.im[k*N+j]=1; out.push({kind:'A',j,k,M:A});
    }
    const D=cmat(N), s=Math.sqrt(2/(k*(k+1)));
    for(let i=0;i<k;i++) D.re[i*N+i]=s;
    D.re[k*N+k]=-k*s;
    out.push({kind:'D',j:k,k,M:D});

const ALG={};
/* the algebra of SU(N) (N = 1 means U(1)): generators, f_abc and d_abc from traces,
   the nonzero lists, the Casimirs, the commutator-closure residual */
function algebra(N){
  if(ALG[N]) return ALG[N];
  if(N===1){ ALG[1]={N:1,n:0,gens:[],f:new Float64Array(0),d:new Float64Array(0),nzF:[],nzD:[],CF:0,CA:0,closure:0,abelian:true}; return ALG[1]; }
  const gens=gellMann(N), n=gens.length, L=gens.map(g=>g.M);
  const P=[]; for(let a=0;a<n;a++){ P.push([]); for(let b=0;b<n;b++) P[a].push(cmul(L[a],L[b])); }
  const f=new Float64Array(n*n*n), d=new Float64Array(n*n*n);
  for(let a=0;a<n;a++) for(let b=0;b<n;b++) for(let c=0;c<n;c++){
    const t1=ctrace2(P[a][b],L[c]), t2=ctrace2(P[b][a],L[c]);
    /* Tr([l_a,l_b] l_c) = 4i f_abc ; Tr({l_a,l_b} l_c) = 4 d_abc */
    f[(a*n+b)*n+c]=(t1[1]-t2[1])/4;
    d[(a*n+b)*n+c]=(t1[0]+t2[0])/4;
  }
  const nzF=[], nzD=[];
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++) for(let c=b+1;c<n;c++){ const v=f[(a*n+b)*n+c]; if(Math.abs(v)>1e-12) nzF.push([a+1,b+1,c+1,v]); }
  for(let a=0;a<n;a++) for(let b=a;b<n;b++) for(let c=b;c<n;c++){ const v=d[(a*n+b)*n+c]; if(Math.abs(v)>1e-12) nzD.push([a+1,b+1,c+1,v]); }
  /* C_F from sum_a (l_a/2)^2, C_A from sum_cd f_1cd^2 */
  let CF=0; for(let a=0;a<n;a++) CF+=P[a][a].re[0]/4;
  let CA=0; for(let c=0;c<n;c++) for(let e=0;e<n;e++){ const v=f[(0*n+c)*n+e]; CA+=v*v; }
  /* closure: [l_a,l_b] = 2i sum_c f_abc l_c, checked entry by entry */
  let closure=0;
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){
    const re=new Float64Array(N*N), im=new Float64Array(N*N);
    for(let c=0;c<n;c++){ const v=f[(a*n+b)*n+c]; if(v===0) continue; const Lc=L[c]; for(let k=0;k<N*N;k++){ re[k]+=-2*v*Lc.im[k]; im[k]+=2*v*Lc.re[k]; } }
    for(let k=0;k<N*N;k++){ closure=Math.max(closure,Math.abs(P[a][b].re[k]-P[b][a].re[k]-re[k]),Math.abs(P[a][b].im[k]-P[b][a].im[k]-im[k])); }
  }

  return ALG[N];
}
function fabc(A,a,b,c){ const n=A.n; return A.f[((a-1)*n+(b-1))*n+(c-1)]; }
function dabc(A,a,b,c){ const n=A.n; return A.d[((a-1)*n+(b-1))*n+(c-1)]; }
/* the commutator of two generators as the list of f_abc c-terms: [T_a,T_b] = i sum_c f_abc T_c */
function commutatorTerms(N,a,b){
  const A=algebra(N); if(A.abelian) return [];
  const out=[]; for(let c=1;c<=A.n;c++){ const v=fabc(A,a,b,c); if(Math.abs(v)>1e-12) out.push([c,v]); }
  return out;
}
/* sum_e f_abe f_ecd + cyclic, maximised: the Jacobi identity (n^5 work; used for N <= 4) */
function jacobiMax(N){
  const A=algebra(N), n=A.n, f=A.f; let worst=0;
  const F=(a,b,c)=>f[(a*n+b)*n+c];
  for(let a=0;a<n;a++) for(let b=0;b<n;b++) for(let c=0;c<n;c++) for(let dd=0;dd<n;dd++){
    let s=0; for(let e=0;e<n;e++) s+=F(a,b,e)*F(e,c,dd)+F(b,c,e)*F(e,a,dd)+F(c,a,e)*F(e,b,dd);
    worst=Math.max(worst,Math.abs(s)); }

/* the fundamental weights (eigenvalues of the Cartan generators H_l = D_l/2) and the roots */
function fundWeights(N){
  if(N<2) return [[0]];
  const A=algebra(N), H=A.gens.filter(g=>g.kind==='D');
  const out=[]; for(let i=0;i<N;i++) out.push(H.map(g=>g.M.re[i*N+i]/2));
  return out;

function rootsOf(N){
  const w=fundWeights(N), out=[];
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) if(i!==j) out.push({i,j,v:w[i].map((x,m)=>x-w[j][m])});
  return out;

/* a 2-D picture of the roots: the true Cartan plane for SU(2) and SU(3); for N >= 4 the Coxeter
   plane, where e_k goes to the k-th N-th root of unity (a drawing choice, printed on the canvas) */
function rootPlane(N){
  if(N===2) return rootsOf(2).map(r=>({i:r.i,j:r.j,x:r.v[0],y:0}));
  if(N===3) return rootsOf(3).map(r=>({i:r.i,j:r.j,x:r.v[0],y:r.v[1]}));
  const P=[]; for(let k=0;k<N;k++) P.push([Math.cos(TAU*k/N),Math.sin(TAU*k/N)]);
  const s=1/Math.hypot(P[0][0]-P[1][0],P[0][1]-P[1][1]);
  return rootsOf(N).map(r=>({i:r.i,j:r.j,x:(P[r.i][0]-P[r.j][0])*s,y:(P[r.i][1]-P[r.j][1])*s}));
}

/* ================================================================== *
 *  B. SU(3) representations: Gelfand-Tsetlin weights, peeling         *
 *  A weight is its Dynkin pair (a1, a2); I3 = a1/2, Y = (a1 + 2a2)/3  *
 * ================================================================== */
function irrepDim(p,q){ return (p+1)*(q+1)*(p+q+2)/2; }
/* every Gelfand-Tsetlin pattern with top row (p+q, q, 0) is one basis state */
function gtWeights(p,q){
  const out=[];
  for(let m12=q;m12<=p+q;m12++) for(let m22=0;m22<=q;m22++) for(let m11=m22;m11<=m12;m11++)
    out.push([2*m11-m12-m22,2*(m12+m22)-m11-(p+2*q)]);
  return out;
}
const wkey=(a1,a2)=>a1+','+a2;
function multisetOf(list){ const M=new Map(); for(const w of list){ const k=wkey(w[0],w[1]); M.set(k,(M.get(k)||0)+1); } return M; }
const IRW={};
function irrepWeights(p,q){ const k=p+','+q; if(!IRW[k]) IRW[k]=multisetOf(gtWeights(p,q)); return IRW[k]; }
function wparse(k){ const i=k.indexOf(','); return [+k.slice(0,i),+k.slice(i+1)]; }
function IYof(a1,a2){ return [a1/2,(a1+2*a2)/3]; }
/* exact invariants from the weights, normalised to the triplet: T(3) = 1/2, A(3) = 1 */
function irrepInvariants(p,q){
  let s2=0,s3=0,si=0;
  for(const [k,m] of irrepWeights(p,q)){ const [a1,a2]=wparse(k), y3=a1+2*a2; s2+=m*y3*y3; s3+=m*y3*y3*y3; si+=m*a1*a1; }
  const dim=irrepDim(p,q), T=Q(s2,12), A=Q(-s3,6), C2=qdiv(qmul(T,qint(8)),qint(dim));
  /* sum I3^2 = (3/4) sum Y^2: (si/4) = (3/4)(s2/9)  <=>  3 si = s2 */
  return {dim,T,A,C2,triality:((p-q)%3+3)%3,isospinCheck:3*si-s2};
}
/* Okubo's closed forms, the second route */
function casimirCF(p,q){ return Q(p*p+q*q+p*q+3*p+3*q,3); }
function anomalyCF(p,q){ return Q(irrepDim(p,q)*(p-q)*(p+2*q+3)*(2*p+q+3),60); }
/* the tensor product of a list of irreps as a weight multiset (a convolution) */
function tensorWeights(list){
  let M=new Map([['0,0',1]]);
  for(const [p,q] of list){
    const W=irrepWeights(p,q), R=new Map();
    for(const [k1,m1] of M){ const a=wparse(k1);
      for(const [k2,m2] of W){ const b=wparse(k2), k=wkey(a[0]+b[0],a[1]+b[1]); R.set(k,(R.get(k)||0)+m1*m2); } }

/* peel highest weights: the weight maximising 3 a1 + 4 a2 (positive on both simple roots,

function decompose(M0){
  const M=new Map(M0), out=[];
  let guard=0;
  while(M.size){
    if(++guard>500) throw new Error('decompose: no progress');
    let best=null, bv=-Infinity;
    for(const [k,m] of M){ if(m<=0) continue; const [a1,a2]=wparse(k), v=3*a1+4*a2; if(v>bv){ bv=v; best=[a1,a2,m]; } }
    const [p,q,m]=best;
    if(p<0||q<0) throw new Error('decompose: highest weight not dominant '+p+','+q);
    out.push([p,q,m]);
    for(const [k,c] of irrepWeights(p,q)){
      const left=(M.get(k)||0)-m*c;
      if(left<0) throw new Error('decompose: negative multiplicity at '+k);
      if(left===0) M.delete(k); else M.set(k,left);

function decomposeList(list){ return decompose(tensorWeights(list)); }
const SINGLET_MEMO={};

/* left-handed Weyl fields; col: +1 colour triplet, -1 antitriplet, 0 singlet; n2: SU(2) dimension */
const SM_FIELDS=[
  {id:'Q', name:'Q', html:'Q<sub>L</sub>', col:1, n2:2, desc:'the left-handed quark doublet (u, d)'},
  {id:'u', name:'uᶜ', html:'u<sup>c</sup>', col:-1, n2:1, desc:'the conjugate of the right-handed up quark'},
  {id:'d', name:'dᶜ', html:'d<sup>c</sup>', col:-1, n2:1, desc:'the conjugate of the right-handed down quark'},
  {id:'L', name:'L', html:'L<sub>L</sub>', col:0, n2:2, desc:'the left-handed lepton doublet (&nu;, e)'},

/* the five perturbative anomalies and the doublet count (Witten), for Nc colours */
function anomaliesOf(Y,Nc,nuY){
  const nc=f=>f.col===0?1:Nc;
  let c3=Q(0), c2y=Q(0), w2y=Q(0), y3=Q(0), gy=Q(0), dbl=0;
  for(const f of SM_FIELDS){
    const y=Y[f.id], m=qint(nc(f)*f.n2);
    if(f.col!==0){ c3=qadd(c3,qint(f.col*f.n2)); c2y=qadd(c2y,qmul(Q(f.n2,2),y)); }
    if(f.n2===2){ w2y=qadd(w2y,qmul(Q(nc(f),2),y)); dbl+=nc(f); }
    y3=qadd(y3,qmul(m,qpow(y,3))); gy=qadd(gy,qmul(m,y));
  }
  if(nuY){ y3=qadd(y3,qpow(nuY,3)); gy=qadd(gy,nuY); }
  return {su3cubed:c3,su3sq_y:c2y,su2sq_y:w2y,y_cubed:y3,grav_y:gy,doublets:dbl};
}
const ANOM_KEYS=[['su3cubed','[SU(3)]³'],['su3sq_y','[SU(3)]² U(1)'],['su2sq_y','[SU(2)]² U(1)'],['y_cubed','[U(1)]³'],['grav_y','grav² U(1)']];

/* the unique anomaly-free hypercharges for Nc colours with Y_H = 1/2 (u and d named so that Y_u < Y_d) */
function smHypercharges(Nc){
  const two=2*Nc;
  return {Q:Q(1,two),u:Q(-(1+Nc),two),d:Q(Nc-1,two),L:Q(-1,2),e:Q(1),H:Q(1,2)};
}
function chargesFor(Nc){
  const Y=smHypercharges(Nc), Qu=qadd(Q(1,2),Y.Q), Qd=qadd(Q(-1,2),Y.Q);
  const nu=(Nc+1)/2, nd=(Nc-1)/2;
  const odd=Nc%2===1;
  return {Y,Qu,Qd,Qe:qadd(Q(-1,2),Y.L),Qnu:qadd(Q(1,2),Y.L),
          Qp:odd?qadd(qmul(qint(nu),Qu),qmul(qint(nd),Qd)):null, Qn:odd?qadd(qmul(qint(nd),Qu),qmul(qint(nu),Qd)):null,
          doublets:Nc+1, witten:(Nc+1)%2===0};
}
/* the fifteen (or sixteen) Weyl states of one generation on the (T3, Y) plane */
function generationStates(Y,Nc,withNu){
  const out=[];
  for(const f of SM_FIELDS){
    const colours=f.col===0?[null]:Array.from({length:Nc},(_,i)=>i);
    const t3s=f.n2===2?[Q(1,2),Q(-1,2)]:[Q(0)];
    for(const c of colours) for(const t of t3s){
      const q=qadd(t,Y[f.id]);
      let lab=f.id==='Q'?(t.n>0?'u':'d'):f.id==='L'?(t.n>0?'ν':'e'):f.name;
      out.push({field:f.id,colour:c,t3:t,y:Y[f.id],q,lab});
    }
  }
  if(withNu) out.push({field:'n',colour:null,t3:Q(0),y:Q(0),q:Q(0),lab:'νᶜ'});

}
/* one-loop beta coefficients from the representation table (U(1) in the GUT normalisation) */
function betaCoeffs(opt){
  const o=Object.assign({ngen:3,nhiggs:1,susy:false},opt||{});
  const C2=[Q(0),Q(2),Q(3)];
  const T=[Q(0),Q(0),Q(0)];               /* per generation */
  for(const f of SM_FIELDS){
    const nc=f.col===0?1:3, y=smHypercharges(3)[f.id];
    if(f.col!==0) T[2]=qadd(T[2],Q(f.n2,2));
    if(f.n2===2) T[1]=qadd(T[1],Q(nc,2));
    T[0]=qadd(T[0],qmul(Q(3*nc*f.n2,5),qmul(y,y)));
  }
  const TH=[qmul(Q(3*2,5),qmul(Q(1,2),Q(1,2))),Q(1,2),Q(0)];   /* one Higgs doublet, Y = 1/2 */
  const b=[];
  for(let i=0;i<3;i++){
    if(!o.susy) b.push(qsum([qmul(Q(-11,3),C2[i]),qmul(Q(2*o.ngen,3),T[i]),qmul(Q(o.nhiggs,3),TH[i])]));
    else b.push(qsum([qmul(qint(-3),C2[i]),qmul(qint(o.ngen),T[i]),qmul(qint(o.nhiggs),TH[i])]));
  }
  return b;
}

/* ---- electroweak, tree level ---- */
function ewModel(s2){
  const GF=PDG.G_F, MZ=PDG.M_Z, aMZ=1/PDG.aMZ_inv, a0=1/PDG.a0_inv;
  const sw2=s2===undefined?PDG.s2hat:s2, cw=Math.sqrt(1-sw2), sw=Math.sqrt(sw2);
  const v=Math.pow(Math.SQRT2*GF,-0.5), e=Math.sqrt(4*PI*aMZ), g=e/sw, gp=e/cw;
  const mwTree=a=>{ const A2=PI*a/(Math.SQRT2*GF); return Math.sqrt(MZ*MZ/2*(1+Math.sqrt(1-4*A2/(MZ*MZ)))); };
  const lam=PDG.M_H*PDG.M_H/(2*v*v);
  /* the neutral mass matrix (v^2/4)[[g^2, -g g'],[-g g', g'^2]]: trace and determinant give its eigenvalues */
  const a11=v*v/4*g*g, a22=v*v/4*gp*gp, a12=-v*v/4*g*gp, tr=a11+a22, det=a11*a22-a12*a12;
  const disc=Math.sqrt(Math.max(0,tr*tr/4-det));
  return {v,e,g,gp,sw2,thetaW:Math.asin(sw),mW:g*v/2,mZ:Math.sqrt(g*g+gp*gp)*v/2,
          photon2:tr/2-disc,z2:tr/2+disc,det,
          mWtree0:mwTree(a0),mWtreeZ:mwTree(aMZ),s2os:1-PDG.M_W*PDG.M_W/(MZ*MZ),
          lam,mu2:-lam*v*v,Vmin:-lam*Math.pow(v,4)/4,mH:Math.sqrt(2*lam)*v};
}
/* the Higgs potential along |phi| = r (GeV), with mu^2 = x |mu^2_phys| */

/* the broken phase: v(x) = v_phys sqrt(-x) for x < 0, zero otherwise; every mass scales with it */
function vevAt(x,v){ return x<0?v*Math.sqrt(-x):0; }

function gmoModel(){
  const avg=keys=>keys.reduce((s,k)=>s+PDG[k],0)/keys.length;
  const mN=avg(['m_p','m_n']), mS=avg(['m_Sp','m_S0','m_Sm']), mX=avg(['m_X0','m_Xm']), mL=PDG.m_L;
  const mD=PDG.m_Dl, mSs=avg(['m_Ssp','m_Ss0','m_Ssm']), mXs=avg(['m_Xs0','m_Xsm']), mO=PDG.m_Om;
  const lhs=(mN+mX)/2, rhs=(3*mL+mS)/4;
  /* least squares m = c0 + c1 Y through (1, mD), (0, mSs), (-1, mXs): c0 = mean, c1 = (mD - mXs)/2 */
  const c0=(mD+mSs+mXs)/3, c1=(mD-mXs)/2;
  return {mN,mS,mX,mL,mD,mSs,mXs,mO,lhs,rhs,rel:(lhs-rhs)/rhs,lamPred:(2*(mN+mX)-mS)/3,

/* quadratic Gell-Mann-Okubo for a nonet and the octet-singlet mixing angle:

function nonetMixing(kind){
  const K=kind==='P'?['m_Kc','m_K0']:['m_Kstc','m_Kst0'], Pi=kind==='P'?['m_pic','m_pi0']:['m_rhoc','m_rho0'];
  const mK2=(PDG[K[0]]*PDG[K[0]]+PDG[K[1]]*PDG[K[1]])/2;
  const mP2=(2*PDG[Pi[0]]*PDG[Pi[0]]+PDG[Pi[1]]*PDG[Pi[1]])/3;
  const m82=(4*mK2-mP2)/3;
  const ma=kind==='P'?PDG.m_eta:PDG.m_phi, mb=kind==='P'?PDG.m_etap:PDG.m_omega;
  const t2=(m82-ma*ma)/(mb*mb-m82), th=Math.atan(Math.sqrt(t2)), c=Math.cos(th), s=Math.sin(th);
  /* the rotated mass-squared matrix: its octet diagonal must return m8^2 */
  const m8check=c*c*ma*ma+s*s*mb*mb, m1=Math.sqrt(s*s*ma*ma+c*c*mb*mb);
  return {m8:Math.sqrt(m82),t2,thetaDeg:th*RAD,m8check:Math.sqrt(m8check),m1,ma,mb,gmoRel:(Math.sqrt(m82)-ma)/ma,
          idealDeg:Math.atan(1/Math.SQRT2)*RAD};
}

/* ---- SU(6) spin-flavour: the SU(3) x SU(2) content of Sym^3(6) and Alt^3(6) ----
   the six states are (flavour u, d, s) x (spin up, down); a state of three is a sorted index
   triple (i <= j <= k symmetric, i < j < k antisymmetric); peel (3 a1 + 4 a2, 2 Sz) highest weights */
function su6Content(kind){
  const st6=[]; for(const f of ['u','d','s']) for(const s of [1,-1]) st6.push({w:QUARKS[f],s});
  const M=new Map();
  for(let i=0;i<6;i++) for(let j=i;j<6;j++) for(let k=j;k<6;k++){
    if(kind==='alt'&&(i===j||j===k)) continue;
    const a1=st6[i].w[0]+st6[j].w[0]+st6[k].w[0], a2=st6[i].w[1]+st6[j].w[1]+st6[k].w[1], sz=st6[i].s+st6[j].s+st6[k].s;
    const key=a1+','+a2+','+sz; M.set(key,(M.get(key)||0)+1);
  }
  const out=[]; let guard=0;
  while(M.size){
    if(++guard>50) throw new Error('su6Content: no progress');
    let best=null, bv=-Infinity;
    for(const [key,m] of M){ const t=key.split(',').map(Number), v=(3*t[0]+4*t[1])*100+t[2]; if(v>bv){ bv=v; best=[t[0],t[1],t[2],m]; } }
    const [p,q,s2,m]=best;
    out.push([p,q,s2+1,m]);
    for(const [wk,c] of irrepWeights(p,q)) for(let sz=-s2;sz<=s2;sz+=2){
      const key=wk+','+sz, left=(M.get(key)||0)-m*c;
      if(left<0) throw new Error('su6Content: negative at '+key);
      if(left===0) M.delete(key); else M.set(key,left);
    }
  }
  return out.sort((x,y)=>(x[0]-y[0])||(x[1]-y[1])||(x[2]-y[2]));
}

function su6Moments(mu,md,ms){

/* ---- running couplings, one loop ---- */
const B_SM=[41/10,-19/6,-7], B_SS=[33/5,1,-3];
function ainvMZ(){ const a=1/PDG.aMZ_inv, s2=PDG.s2hat; return [3/5*(1-s2)/a,s2/a,1/PDG.alpha_s]; }
/* alpha_i^-1 at mu (GeV): b below Ms, bs above (defaults: the SM and MSSM sets); Ms null = no SUSY */
function ainvAt(i,mu,Ms,b,bs){
  const a0=ainvMZ(), bb=b||B_SM, bS=bs||B_SS, t=Math.log(mu/PDG.M_Z);
  if(!Ms||mu<=Ms) return a0[i]-bb[i]/TAU*t;
  const ts=Math.log(Ms/PDG.M_Z);
  return a0[i]-bb[i]/TAU*ts-bS[i]/TAU*(t-ts);
}
/* where alpha_i^-1 = alpha_j^-1 (log10 mu), by bisection on [log10 MZ, 25]; null if they never meet */
function crossing(i,j,Ms,b,bs){
  const f=lg=>ainvAt(i,Math.pow(10,lg),Ms,b,bs)-ainvAt(j,Math.pow(10,lg),Ms,b,bs);
  let lo=Math.log10(PDG.M_Z), hi=25, flo=f(lo), fhi=f(hi);
  if(flo*fhi>0) return null;
  for(let k=0;k<80;k++){ const m=(lo+hi)/2, fm=f(m); if(flo*fm<=0){ hi=m; fhi=fm; } else { lo=m; flo=fm; } }
  const lg=(lo+hi)/2; return {lg,ainv:ainvAt(i,Math.pow(10,lg),Ms,b,bs)};
}
function b0(nf){ return 11-2*nf/3; }
/* alpha_s(mu) with the flavour thresholds at m_c(m_c), m_b(m_b) and m_t, continuous at each */
function alphaS(mu){
  const MZ=PDG.M_Z, mb=PDG.m_b, mc=PDG.m_c, mt=PDG.m_t;
  const step=(ai,m0,m1,nf)=>ai+b0(nf)/TAU*Math.log(m1/m0);
  let a=1/PDG.alpha_s;
  if(mu>=MZ){ if(mu<=mt) return 1/step(a,MZ,mu,5); a=step(a,MZ,mt,5); return 1/step(a,mt,mu,6); }
  if(mu>=mb) return 1/step(a,MZ,mu,5);
  a=step(a,MZ,mb,5);
  if(mu>=mc) return 1/step(a,mb,mu,4);
  a=step(a,mb,mc,4);
  const r=step(a,mc,mu,3);
  return r>0?1/r:Infinity;
}
function lambdaQCD(){
  const L5=PDG.M_Z*Math.exp(-TAU/(b0(5)*PDG.alpha_s));
  const L4=PDG.m_b*Math.exp(-TAU/(b0(4)*alphaS(PDG.m_b)));
  const L3=PDG.m_c*Math.exp(-TAU/(b0(3)*alphaS(PDG.m_c)));
  return {L5,L4,L3};
}

function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the clock: only the Higgs view moves (the ball in the potential) ---- */
const SIM={t:0};
function simReset(){ SIM.t=0; }
function viewAnimates(v){ return v==='higgs'; }
function frameDt(st){ return 0.02*Math.max(1,Math.round(st.speed)); }
function runStep(st){
  if(!st.running||!viewAnimates(st.view)) return false;
  SIM.t+=frameDt(st);
  return true;
}

/* ---- the gauge group ---- */
function gaugeModel(st){
  const N=st.grp, A=algebra(N), n=N===1?1:A.n;
  const a=clamp(Math.round(st.ga),1,n), b=clamp(Math.round(st.gb),1,n);
  const terms=N===1?[]:commutatorTerms(N,a,b);
  const dterms=[]; if(N>1) for(let c=1;c<=n;c++){ const v=dabc(A,a,b,c); if(Math.abs(v)>1e-12) dterms.push([c,v]); }
  /* which pairs fail to commute */
  const nc=[]; let nonComm=0;
  for(let i=1;i<=n;i++){ const row=[]; for(let j=1;j<=n;j++){ const x=N>1&&commutatorTerms(N,i,j).length>0; row.push(x); if(x&&i<j) nonComm++; } nc.push(row); }
  const cartan=N===1?1:A.gens.filter(g=>g.kind==='D').length;
  const jac=N>1&&N<=4?memo('jac'+N,'1',()=>jacobiMax(N)):null;
  return {N,A,n,a,b,terms,dterms,nc,nonComm,pairs:n*(n-1)/2,rank:N===1?1:N-1,cartan,
          roots:N>1?rootPlane(N):[],CF:N===1?null:A.CF,CA:N===1?0:A.CA,jac,closure:A.closure,
          nRoots:N>1?N*(N-1):0};
}
/* ---- one generation ---- */
function genModel(st){
  const mode=st.genMode, Nc=mode==='nc'?st.nc:3;
  let Y, nuY=null;
  if(mode==='sm') Y=ysFromK(SM_KY);
  else if(mode==='own'){ Y=ysFromK({Q:st.kQ,u:st.ku,d:st.kd,L:st.kL,e:st.ke}); if(st.nuR) nuY=Q(st.kn,6); }
  else Y=smHypercharges(Nc);
  if(mode==='sm'&&st.nuR) nuY=Q(0);
  const A=anomaliesOf(Y,Nc,nuY), free=anomalyFree(A);
  const states=generationStates(Y,Nc,nuY!==null&&qzero(nuY));
  const extra=nuY!==null&&!qzero(nuY)?{lab:'νᶜ',q:nuY,y:nuY}:null;
  const ch=chargesFor(Nc);
  /* the Higgs hypercharge the electron Yukawa needs: Y_H = Y_L + Y_e; the up Yukawa needs Y_Q + Y_u = -Y_H */
  const yH=qadd(Y.L,Y.e), upOK=qeq(qadd(Y.Q,Y.u),qneg(yH)), downOK=qeq(qadd(Y.Q,Y.d),yH);
  let weyl=0; for(const f of SM_FIELDS) weyl+=(f.col===0?1:Nc)*f.n2;
  if(nuY!==null) weyl+=1;
  return {mode,Nc,Y,A,free,states,extra,ch,yH,upOK,downOK,weyl,nuY};
}
/* ---- the Higgs ---- */
function higgsModel(st){
  const E=ewModel(st.s2w), P=ewModel(), x=st.x2, vx=vevAt(x,E.v);
  const broken=x<0;
  const mW=E.g*vx/2, mZ=Math.sqrt(E.g*E.g+E.gp*E.gp)*vx/2;
  const mH=broken?Math.sqrt(2*E.lam)*vx:0, mSym=broken?0:Math.sqrt(x*E.lam)*E.v;
  const rmin=hatMin(x,E.v);
  /* the ball: along the trough at a steady rate (a Goldstone mode costs nothing), or up and down
     the wall at a rate that follows m_H (a drawing: 1 rad per unit time per 100 GeV) */
  const t=SIM.t;
  let ang=0.35, rr=rmin;
  if(st.hmode==='goldstone') ang=0.35+0.9*t;
  else rr=broken?rmin*(1+0.22*Math.sin(mH/100*2.2*t)):E.v*0.35*Math.abs(Math.sin(0.9*t));
  const ladder=YUK_KEYS.map(([k,lab,sc,gen])=>({k,lab,gen,m:PDG[k]*sc,y:yukawa(k,sc,E.v),lepton:k==='m_e'||k==='m_mu'||k==='m_tau'}));
  return {E,P,x,vx,broken,mW,mZ,mH,mSym,rmin,ang,rr,t,ladder,
          goldstones:broken?3:0,massiveScalars:broken?1:4,
          thetaW:E.thetaW,depth:hatV(rmin,x,E.lam,E.v)};
}
/* ---- the eightfold way ---- */
function hadronsFor(kind){
  return HADRONS[kind].map(([name,content,mk])=>{ const w=flavourWeight(content); return {name,content,w,iy:IYof(w[0],w[1]),q:flavourCharge(w[0],w[1]),m:PDG[mk],mk}; });
}
function eightModel(st){
  const mode=st.eight;
  let fac=null, M=null, D=null, had=null, kind=null;
  if(mode==='mesons'){ fac=[[1,0],[0,1]]; kind=st.spin==='low'?'pseudo':'vector'; }
  else if(mode==='baryons'){ fac=[[1,0],[1,0],[1,0]]; kind=st.spin==='low'?'octet':'decuplet'; }
  else if(mode==='diquarks') fac=[[1,0],[1,0]];
  if(fac){ M=memo('tw'+mode,'1',()=>tensorWeights(fac)); D=memo('dc'+mode,'1',()=>decompose(M)); }
  else { M=irrepWeights(st.pp,st.qq); D=[[st.pp,st.qq,1]]; }
  if(kind) had=hadronsFor(kind);
  const inv=mode==='irrep'?irrepInvariants(st.pp,st.qq):null;
  let size=0; for(const [,m] of M) size+=m;
  return {mode,kind,fac,M,D,had,inv,size,gmo:gmoModel(),mixP:nonetMixing('P'),mixV:nonetMixing('V'),
          name:mode==='irrep'?irrepName(st.pp,st.qq):null,maxMult:Math.max.apply(null,[...M.values()])};
}
/* ---- colour and spin ---- */
const SING_A=6, SING_B=6, SING_MAX=7;
function colourModel(st){
  const a=st.na, b=st.nb;
  const list=[]; for(let i=0;i<a;i++) list.push([1,0]); for(let i=0;i<b;i++) list.push([0,1]);
  const D=a+b===0?[[0,0,1]]:memo('cdec',a+','+b,()=>decomposeList(list));
  const sing=singletCount(a,b);
  const grid=memo('sgrid','1',()=>{ const g=[]; for(let i=0;i<=SING_A;i++){ const r=[]; for(let j=0;j<=SING_B;j++) r.push(i+j===0||i+j>SING_MAX?null:singletCount(i,j)); g.push(r); } return g; });
  const sym=memo('su6s','1',()=>su6Content('sym')), alt=memo('su6a','1',()=>su6Content('alt'));
  const mud=st.massMode==='fit'?FIT.mud:st.mud, msq=st.massMode==='fit'?FIT.msMass:st.msq;
  const P=momentsFromMasses(mud,msq), rows=momentTable(P);
  const devs=rows.filter(r=>r.k!=='p'&&r.k!=='L'&&r.k!=='SL');
  const rms=Math.sqrt(devs.reduce((s,r)=>s+r.dev*r.dev,0)/devs.length);
  return {a,b,D,sing,triality:((a-b)%3+3)%3,grid,sym,alt,mud,msq,P,rows,rms,
          ratio:P.n/P.p,ratioMeas:PDG.mu_n/PDG.mu_p,dimSym:su6Dim(sym),dimAlt:su6Dim(alt)};
}
function su6Dim(list){ return list.reduce((s,[p,q,d,m])=>s+irrepDim(p,q)*d*m,0); }
/* ---- running couplings ---- */
function runModel(st){
  const bq=betaCoeffs({ngen:st.ngen,nhiggs:st.nhiggs}), bsq=betaCoeffs({ngen:st.ngen,nhiggs:2,susy:true});
  const b=bq.map(qval), bs=bsq.map(qval), Ms=st.susy?Math.pow(10,st.lgMs):null;
  const lg0=Math.log10(PDG.M_Z), lg1=19.5;
  const key=[st.ngen,st.nhiggs,st.susy,st.lgMs].join('|');
  const curves=memo('rc',key,()=>{ const xs=[], ys=[[],[],[]];
    for(let k=0;k<=240;k++){ const lg=lg0+(lg1-lg0)*k/240; xs.push(lg); for(let i=0;i<3;i++) ys[i].push(ainvAt(i,Math.pow(10,lg),Ms,b,bs)); }
    return {xs,ys}; });
  const X=[crossing(0,1,Ms,b,bs),crossing(1,2,Ms,b,bs),crossing(0,2,Ms,b,bs)];
  const lgs=X.filter(x=>x).map(x=>x.lg);
  const spread=lgs.length===3?Math.max.apply(null,lgs)-Math.min.apply(null,lgs):null;
  const as=memo('as','1',()=>{ const xs=[], ys=[]; for(let k=0;k<=200;k++){ const lg=Math.log10(0.9)+(4-Math.log10(0.9))*k/200; xs.push(lg); ys.push(alphaS(Math.pow(10,lg))); } return {xs,ys}; });
  return {bq,bsq,b,bs,Ms,curves,X,spread,as,lam:lambdaQCD(),a0:ainvMZ(),b3nf:qcdB(st.nf),nf:st.nf,
          planck:1.22e19,ngen:st.ngen,nhiggs:st.nhiggs};
}

function buildModel(){
  const st=ST, view=st.view;
  const M={view,st,t:SIM.t};
  if(view==='gauge') M.Ga=gaugeModel(st);
  if(view==='gen') M.Gn=genModel(st);
  if(view==='higgs') M.Hg=higgsModel(st);
  if(view==='eight') M.Ei=eightModel(st);
  if(view==='colour') M.Co=colourModel(st);
  if(view==='run') M.Ru=runModel(st);
  return M;
}

function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function gev(x,n){ return sigf(x,n||5)+' GeV'; }
function mev(x,n){ return sigf(x,n||5)+' MeV'; }
function pct(x,n){ return (x>=0?'+':'−')+fmt(Math.abs(100*x),n===undefined?2:n)+' %'; }
function grpName(N){ return plain(GRP_LIST.find(g=>g.id===N).name); }

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_lagr/p4_views.js (lineage build_buoy); the camera block from     *
 *  pulsar.html (v3, makeCamera, camBasis, project)                    *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y1);
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }
  }
  /* nothing clear: in a small box the legend is dropped rather than laid over a curve or a label */
  if(!pick){ if(b.h<300||b.w<420) return; pick=cands[0]; }
  legendBox(ctx,pick[0],pick[1],items);
  LABELS.push([pick[0],pick[1],pick[0]+bw,pick[1]+bh]);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }

}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* ================================================================== *
 *  shared pieces for the six views                                    *
 * ================================================================== */
const TITLE_FONT='italic 13px Georgia, serif';
function title(ctx,W,H,b,txt,shortTxt){ const t=shortTxt&&plain(txt).length*13*0.52+10>b.w?shortTxt:txt; lab(ctx,W,H,b.x+2,b.y-8,t,'#aeb6c6',TITLE_FONT,'left','bottom'); }
/* a cell colour for a complex matrix entry: green +re, orange -re, cyan +im, magenta -im, faded by |value| */
function entryColour(re,im,scale){
  const a=Math.hypot(re,im); if(a<1e-12) return '#0d1120';
  const base=Math.abs(re)>=Math.abs(im)?(re>0?COL.pos:COL.ref):(im>0?COL.struct:COL.live);
  return mix('#0d1120',base,clamp(0.35+0.65*a/scale,0,1));
}
/* a split of a box into two side by side (with a gutter) */
function splitH(b,frac,gut){ const w1=Math.floor((b.w-gut)*frac); return [box(b.x,b.y,w1,b.h),box(b.x+w1+gut,b.y,b.w-w1-gut,b.h)]; }
function fracTick(v){ const d=[1,2,3,6]; for(const k of d){ const n=Math.round(v*k); if(Math.abs(n/k-v)<1e-9) return qstr(Q(n,k)); } return fmt(v,2); }

 *  view: the gauge group                                              *

function drawGauge(ctx,W,H,M){

    G.N===1?'U(1) has a single generator, the charge itself, so it has one gauge boson and nothing to commute with: the photon (and the B it comes from) carries no charge of its own and does not couple to itself. Pick SU(2) or SU(3) to see what changes when the generators stop commuting.'
    :'Left: the '+G.n+' generators of '+plain(GRP_LIST.find(g=>g.id===G.N).name)+' as '+G.N+'×'+G.N+' matrices (green positive, orange negative, cyan +i, magenta −i), one gauge boson each. Right: the roots — the charges the off-diagonal generators carry under the diagonal ones'+(G.N===3?'; for colour SU(3) these are the six charged gluons, each a colour minus an anticolour, with the two neutral ones at the centre':'')+'. Below: which pairs fail to commute. Where [Tᵃ, Tᵇ] ≠ 0 the bosons carry the charge they couple to, and interact with each other.',
    'The generators as matrices (one boson each), their roots, and which pairs fail to commute.',G.N>1?2:2,0.32,1);

    title(ctx,W,H,b,G.N===1?'the one generator of U(1): the hypercharge':'the '+G.n+' generators λ₁ … λ'+sub(G.n)+' (Tᵃ = λᵃ/2)','the '+G.n+' generators');
    const n=G.N===1?1:G.n, N=G.N;
    const cols=Math.max(1,Math.ceil(Math.sqrt(n*b.w/b.h))), rows=Math.ceil(n/cols);
    const tile=Math.min((b.w-12)/cols,(b.h-12)/rows,150), pad=Math.max(3,tile*0.14), cell=(tile-pad*1.2-(tile>=34?11:0))/Math.max(N,1);
    const x0=b.x+(b.w-cols*tile)/2, y0=b.y+(b.h-rows*tile)/2;
    const scale=N===1?1:Math.max.apply(null,G.A.gens.map(g=>{ let m=0; for(let k=0;k<N*N;k++) m=Math.max(m,Math.hypot(g.M.re[k],g.M.im[k])); return m; }));

      const map=worldFitUp(box(b.x+10,b.y+10,b.w-20,b.h-20),{xmin:-ext,xmax:ext,ymin:G.N===2?-0.6:-ext,ymax:G.N===2?0.6:ext},0);

      /* the fundamental weights (the quark colours) for SU(3) */

        worldPath(ctx,map,tri,rgba(COL.dim,0.5),1,[3,3]);
        w.forEach((p,i)=>{ dot(ctx,map.X(p[0]),map.Y(p[1]),4,CCOL[i],null); lab(ctx,W,H,map.X(p[0])+(p[0]>=0?7:-7),map.Y(p[1])-8,CNAME[i],CCOL[i],LAB_FONT,p[0]>=0?'left':'right','middle'); }); }
      const selRoot=(()=>{ if(G.N<2) return null; const g=G.A.gens[G.a-1]; return g.kind==='D'?null:[g.j,g.k]; })();

        if(G.N===2) lab(ctx,W,H,map.X(r.x),map.Y(r.y)-14,r.x>0?'W⁺':'W⁻',hit?COL.live:COL.pos,LAB_FONT,'center','bottom');

      lab(ctx,W,H,map.X(0)+8,map.Y(0)+14,G.cartan+' neutral at the centre'+(G.N===2?' (W³)':G.N===3?' (g₃, g₈)':''),COL.pos,SM_FONT,'left','top');
      if(G.N>3) lab(ctx,W,H,b.x1-6,b.y1-6,'a projection: lengths are not preserved',COL.dim,SM_FONT,'right','bottom');

    const bb=L.bottom[0], n=G.N===1?1:G.n;

      const b2=L.bottom[1]; frame(ctx,b2,COL.edge);
      title(ctx,W,H,b2,'the Standard Model: 8 + 3 + 1 bosons, then the Higgs','8 + 3 + 1 bosons');
      const groups=[['SU(3): 8 gluons',8,COL.su3],['SU(2): W¹ W² W³',3,COL.su2],['U(1): B',1,COL.u1]];

        for(let i=0;i<k;i++){ ctx.fillStyle=c; ctx.fillRect(b2.x+10+i*(sq+3),y,sq,sq); }

      const y=b2.y+10+3*rowH;

/* axesR plus the tick labels in the label registry, so a shifted label cannot land on a tick
   (the registry's shift-down fallback walked a charge label onto an x tick in the generation view) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}
function sub(k){ const D='₀₁₂₃₄₅₆₇₈₉'; return String(k).split('').map(c=>D[+c]).join(''); }
function sup(k){ const D='⁰¹²³⁴⁵⁶⁷⁸⁹'; return String(k).split('').map(c=>c==='-'?'⁻':D[+c]).join(''); }

/* ================================================================== *
 *  view: one generation                                               *
 * ================================================================== */
function drawGen(ctx,W,H,M){
  const G=M.Gn, st=M.st;
  const L=stageLayout(ctx,W,H,
    'One generation of left-handed fields, placed by weak isospin T₃ (across) and hypercharge Y (up). Coloured dots are the '+G.Nc+' colours of a quark field; white are leptons. The dashed diagonals are lines of constant electric charge Q = T₃ + Y, and the W bosons move a state along a doublet at fixed Y. Below: the five anomalies, which must all vanish for the gauge symmetry to survive quantisation — with the Standard Model’s hypercharges they cancel between quarks and leptons, and for N colours the only solution gives the quarks charges ½ ± 1/2N, so the proton has charge +1 whatever N is.',
    'Left-handed fields by T₃ and Y; diagonals are constant Q. Below: the anomalies, and the charges N colours force.',2,0.34,1);
  const b=L.main; frame(ctx,b,COL.edge);
  const ys=G.states.map(s=>qval(s.y)).concat(G.extra?[qval(G.extra.y)]:[]);
  const ylo=Math.min(-1.2,Math.min.apply(null,ys)-0.35), yhi=Math.max(1.2,Math.max.apply(null,ys)+0.35);
  const pb=box(b.x+54,b.y+18,b.w-72,b.h-44);
  axesT(ctx,pb,-1,1,ylo,yhi,{xticks:[-0.5,0,0.5],xfmt:fracTick,yfmt:fracTick,yticks:ticksFor(ylo,yhi,pb.h<120?3:pb.h<220?4:6),xlab:'T₃ (weak isospin)',ylab:'Y (hypercharge)',
    title:titleFor(pb,'one generation on the (T₃, Y) plane — '+(G.mode==='nc'?G.Nc+' colours':G.mode==='own'?'your hypercharges':'the Standard Model'),'(T₃, Y)')});
  const X=t=>pb.x+pb.w*(t+1)/2, Yp=y=>pb.y1-pb.h*(y-ylo)/(yhi-ylo);
  /* constant-charge lines Y = Q - T3 */
  const qs=[...new Set(G.states.map(s=>qstr(s.q)))];
  for(const qsText of qs){ const s=G.states.find(z=>qstr(z.q)===qsText), qv=qval(s.q);
    polyline(ctx,pb,[-1,1],[qv+1,qv-1],-1,1,ylo,yhi,rgba(COL.ref,0.45),1,[4,4]);
    const yr=qv-1; if(yr>ylo&&yr<yhi) lab(ctx,W,H,pb.x1-4,Yp(yr)-2,'Q = '+qsText,COL.ref,SM_FONT,'right','bottom');
    else { const tx=qv-ylo; if(tx>-0.55&&tx<1) lab(ctx,W,H,X(tx)-4,pb.y1-3,'Q = '+qsText,COL.ref,SM_FONT,'right','bottom'); } }
  /* the doublet links (the W's) */
  const groups=new Map();
  for(const s of G.states){ const k=s.field+'|'+qstr(s.t3)+'|'+qstr(s.y); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(s); }
  for(const f of SM_FIELDS) if(f.n2===2){ const y=qval(G.Y[f.id]);
    polyline(ctx,pb,[-0.5,0.5],[y,y],-1,1,ylo,yhi,rgba(COL.struct,0.6),1.4);
    lab(ctx,W,H,X(-0.25),Yp(y)-5,'W±',COL.struct,SM_FONT,'center','bottom'); }
  for(const [k,list] of groups){
    const s0=list[0], x=X(qval(s0.t3)), y=Yp(qval(s0.y));
    if(s0.colour===null){ dot(ctx,x,y,6,COL.lepton,'#fff'); }
    else { const rr=list.length>1?9:0; list.forEach((s,i)=>{ const a=-PI/2+TAU*i/list.length; dot(ctx,x+rr*Math.cos(a),y+rr*Math.sin(a),list.length>4?3.2:4.5,CCOL[s.colour%3],null); }); }
    const below=qval(s0.y)<0&&y+9+14<pb.y1;
    lab(ctx,W,H,x+13,below?y+9:y-9,s0.lab+'  Q = '+qstr(s0.q),s0.colour===null?COL.lepton:COL.pos,LAB_FONT,'left',below?'top':'bottom');
  }
  if(G.extra){ const x=X(0), y=Yp(qval(G.extra.y)); dot(ctx,x,y,6,null,COL.live,1.5); lab(ctx,W,H,x+14,y,'νᶜ  Y = '+qstr(G.extra.y),COL.live,LAB_FONT,'left','middle'); }
  lab(ctx,W,H,pb.x+6,pb.y+6,G.weyl+' Weyl fields'+(G.Nc>4?' (the '+G.Nc+' colours share three hues)':''),COL.dim,SM_FONT,'left','top');
  /* the anomalies */
  if(L.bottom.length){
    const bb=L.bottom[0];
    const vals=ANOM_KEYS.map(([k])=>qval(G.A[k])), m=Math.max(0.5,Math.max.apply(null,vals.map(Math.abs)));
    axesT(ctx,bb,0,5,-m*1.15,m*1.15,{xticks:[],yticks:[-m,0,m],yfmt:v=>fmt(v,2),title:titleFor(bb,'the five anomalies: '+(G.free?'all zero':'not all zero — inconsistent'),'the anomalies')});
    ANOM_KEYS.forEach(([k,labT],i)=>{ const v=qval(G.A[k]), x0=bb.x+bb.w*(i+0.2)/5, w=bb.w*0.6/5, y0=bb.y1-bb.h*(0-(-m*1.15))/(2.3*m), y1=bb.y1-bb.h*(v+m*1.15)/(2.3*m);
      if(qzero(G.A[k])){ ctx.fillStyle=COL.pos; ctx.fillRect(x0,y0-1.5,w,3); }
      else { ctx.fillStyle=COL.ref; ctx.fillRect(x0,Math.min(y0,y1),w,Math.abs(y1-y0)); }
      lab(ctx,W,H,x0+w/2,bb.y1+4,labT,COL.dim,SM_FONT,'center','top');
      lab(ctx,W,H,x0+w/2,(v>=0?Math.min(y0,y1)-3:Math.max(y0,y1)+3),qstr(G.A[k]),qzero(G.A[k])?COL.pos:COL.ref,SM_FONT,'center',v>=0?'bottom':'top'); });
  }
  /* the charges N colours force */
  if(L.bottom.length>1){
    const bb=L.bottom[1], Ns=[1,3,5,7,9];
    axesT(ctx,bb,0.5,9.5,-0.6,1.15,{xticks:Ns,xfmt:v=>fmt(v,0),yticks:[-0.5,0,0.5,1],yfmt:fracTick,xlab:'number of colours N (odd)',ylab:'charge',title:titleFor(bb,'anomaly-free charges against N: the quarks tend to ±½, the proton stays at +1','charges against N')});
    const xs=[], qu=[], qd=[], qp=[];
    for(let k=1;k<=9;k+=0.25){ xs.push(k); qu.push(0.5+0.5/k); qd.push(-0.5+0.5/k); qp.push(1); }
    polyline(ctx,bb,xs,qp,0.5,9.5,-0.6,1.15,COL.live,1.4,[5,3]);
    polyline(ctx,bb,xs,qu,0.5,9.5,-0.6,1.15,COL.pos,1.6);
    polyline(ctx,bb,xs,qd,0.5,9.5,-0.6,1.15,COL.su2,1.6);
    for(const n of Ns){ const c=chargesFor(n); marker(ctx,bb,0.5,9.5,-0.6,1.15,n,qval(c.Qu),n===G.Nc?COL.live:COL.pos); marker(ctx,bb,0.5,9.5,-0.6,1.15,n,qval(c.Qd),n===G.Nc?COL.live:COL.su2); }
    legendR(ctx,bb,[[COL.pos,'Q(u) = ½ + 1/2N'],[COL.su2,'Q(d) = −½ + 1/2N'],[COL.live,'proton: +1']]);
  }
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  view: the Higgs (3-D potential, the Weinberg rotation, the ladder) *
 * ================================================================== */
const HAT_NR=16, HAT_NT=48, HAT_R=1.5, HAT_CUT=PI/4;
function hatColour(t){ return t<0.5?mix('#1c2c5c','#2a8a8f',t*2):mix('#2a8a8f','#d8e86a',(t-0.5)*2); }
/* the surface in world units: radius in units of the PHYSICAL |phi| minimum, height V / zscale.
   The disc is 1.5 of those units, and grows with the trough when mu^2 sinks below today's value
   (the shape is then the same hat, larger), so the rim always rises above the centre. */
function hatRadius(x){ return HAT_R*Math.sqrt(Math.max(1,-x)); }
function hatSurface(H){
  const E=H.E, u=E.v/Math.SQRT2, x=H.x, R=hatRadius(x);
  let vmax=0; const zs=[];
  for(let i=0;i<=HAT_NR;i++){ const r=R*u*i/HAT_NR, V=hatV(r,x,E.lam,E.v); zs.push(V); vmax=Math.max(vmax,Math.abs(V)); }
  const zscale=vmax/1.2||1;
  return {u,R,zscale,zr:zs.map(V=>V/zscale),zmin:Math.min.apply(null,zs)/zscale,zmax:Math.max.apply(null,zs)/zscale};
}
/* the wedge facing the camera (azimuth th) is cut away so the trough stays in view */
function hatCut(am,th){ const d=((am-th)%TAU+3*PI)%TAU-PI; return Math.abs(d)<HAT_CUT; }
function hatZ(H,S,rw){ return hatV(rw*S.u,H.x,H.E.lam,H.E.v)/S.zscale; }
function drawHiggs(ctx,W,H,M){
  const Hg=M.Hg, st=M.st, E=Hg.E;
  const L=stageLayout(ctx,W,H,
    'The Higgs potential over the complex plane of the neutral component φ⁰ (the other two real fields of the doublet are the same picture turned). With μ² < 0 the top of the hat is a maximum and the vacuum is anywhere on the circle of minima |φ| = v/√2: picking one breaks SU(2) × U(1). Rolling ALONG the trough costs nothing — those are the three Goldstone modes the W⁺, W⁻ and Z absorb; rolling UP THE WALL costs energy — that is the Higgs boson. Push μ² above zero and the hat becomes a bowl: no vacuum value, no masses. Below: the rotation of W³ and B into Z and γ, and every mass on one logarithmic ladder. Drag to orbit.',
    'The Higgs potential; the trough is the vacuum, motion along it is eaten by W and Z, up the wall is the Higgs. Drag to orbit.',2,0.34,1);
  const b=L.main; frame(ctx,b,COL.edge);
  const S=hatSurface(Hg);
  const C=boxCamera(b,st.hTheta,st.hPhi,5.4*S.R/HAT_R,[0,0,(S.zmin+S.zmax)/2*0.9]);
  /* the quads, the ball, painter's order */
  const items=[], L3=v3.norm([-0.45,-0.55,0.72]);
  const zr=S.zr, span=(S.zmax-S.zmin)||1;
  for(let i=0;i<HAT_NR;i++) for(let k=0;k<HAT_NT;k++){
    const r0=S.R*i/HAT_NR, r1=S.R*(i+1)/HAT_NR, a0=TAU*k/HAT_NT, a1=TAU*(k+1)/HAT_NT;
    const P=[[r0*Math.cos(a0),r0*Math.sin(a0),zr[i]],[r1*Math.cos(a0),r1*Math.sin(a0),zr[i+1]],
             [r1*Math.cos(a1),r1*Math.sin(a1),zr[i+1]],[r0*Math.cos(a1),r0*Math.sin(a1),zr[i]]];
    const pr=P.map(C.P); if(pr.some(q=>!q)) continue;
    const am=(a0+a1)/2, slope=(zr[i+1]-zr[i])/(r1-r0);
    if(hatCut(am,st.hTheta)) continue;
    const nrm=v3.norm([-slope*Math.cos(am),-slope*Math.sin(am),1]);
    const sh=0.38+0.62*Math.max(0,v3.dot(nrm,L3));
    const t=((zr[i]+zr[i+1])/2-S.zmin)/span;
    items.push({z:pr.reduce((s,q)=>s+q.z,0)/4,pr,col:shade(hatColour(t),sh)});
  }
  const bw=[Hg.rr/S.u*Math.cos(Hg.ang),Hg.rr/S.u*Math.sin(Hg.ang)];
  items.sort((p,q)=>q.z-p.z);
  for(const it of items){
    const cx=(it.pr[0].x+it.pr[1].x+it.pr[2].x+it.pr[3].x)/4, cy=(it.pr[0].y+it.pr[1].y+it.pr[2].y+it.pr[3].y)/4;
    ctx.beginPath();
    it.pr.forEach((q,j)=>{ const x=cx+(q.x-cx)*1.04, y=cy+(q.y-cy)*1.04; if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.closePath(); ctx.fillStyle=it.col; ctx.fill();
  }
  /* the vacuum circle and the axes, over the surface */
  if(Hg.broken){ const ring=[]; const rw=Hg.rmin/S.u; for(let k=0;k<=72;k++){ const a=TAU*k/72; ring.push([rw*Math.cos(a),rw*Math.sin(a),hatZ(Hg,S,rw)]); }

/* ================================================================== *
 *  weight diagrams: (I3, Y) drawn as (I3, (sqrt3/2) Y), equal aspect, *
 *  so an SU(3) multiplet shows its true hexagonal symmetry            *
 * ================================================================== */
const SQ3=Math.sqrt(3);
function wxy(a1,a2){ return [a1/2,(a1+2*a2)/(2*SQ3)]; }
function weightExtent(Mw){ let e=0.6; for(const [k] of Mw){ const [a1,a2]=wparse(k), p=wxy(a1,a2); e=Math.max(e,Math.abs(p[0]),Math.abs(p[1])); } return e; }
/* draws the multiset; labels: Map key -> [[text, colour], ...]; returns the map */
function drawWeights(ctx,W,H,b,Mw,opt){
  const o=Object.assign({col:COL.pos,rings:true,labels:null,ext:null,small:false},opt||{});
  const e=(o.ext||weightExtent(Mw))+(o.small?0.35:0.55);
  const map=worldFitUp(box(b.x+6,b.y+6,b.w-12,b.h-12),{xmin:-e,xmax:e,ymin:-e,ymax:e},0);
  const r0=o.small?2.6:Math.max(3,Math.min(6,map.s*0.08));
  /* the outer boundary: the convex hull of the weights, for the eye */
  const pts=[...Mw.keys()].map(k=>{ const w=wparse(k); return wxy(w[0],w[1]); });
  if(pts.length>2){ const hull=convexHull(pts); worldPath(ctx,map,hull.concat([hull[0]]),rgba(o.col,0.3),1,[3,3]); }
  for(const [k,m] of Mw){
    const [a1,a2]=wparse(k), p=wxy(a1,a2), X=map.X(p[0]), Y=map.Y(p[1]);
    dot(ctx,X,Y,r0,o.col,null);
    if(o.rings) for(let i=1;i<m;i++) dot(ctx,X,Y,r0+i*(o.small?2.2:3.4),null,o.col,1);
    const L=o.labels&&o.labels.get(k);
    if(L) L.forEach((it,i)=>lab(ctx,W,H,X+r0+m*3.4+4,Y+(i-(L.length-1)/2)*13,it[0],it[1],SM_FONT,'left','middle'));
  }
  return map;
}
function convexHull(P){
  const pts=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]), cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[], up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=1e-12) lo.pop(); lo.push(p); }
  for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=1e-12) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function hadronLabels(had,withMass){
  const L=new Map();
  for(const h of had){ const k=wkey(h.w[0],h.w[1]); if(!L.has(k)) L.set(k,[]); L.get(k).push([h.name+(withMass?' '+fmt(h.m,h.m>1000?0:1):''),h.q>0?COL.pos:h.q<0?COL.ref:COL.lepton]); }
  return L;
}

/* a colour-charge chain for a quarks and b antiquarks that closes whenever a singlet exists */
function colourChain(a,b){
  const out=[]; for(let i=0;i<a;i++) out.push({c:i%3,bar:false});
  const left=a%3; for(let i=0;i<Math.min(left,b);i++) out.push({c:i,bar:true});
  for(let i=0;i<b-Math.min(left,b);i++) out.push({c:i%3,bar:true});
  return out;
}
function drawColour(ctx,W,H,M){
  const C=M.Co, st=M.st;

    'Left: how many colour singlets 3ᵃ ⊗ 3̄ᵇ contains, for a quarks and b antiquarks — nonzero only on the stripes where a − b is a multiple of 3: q q̄, qqq, q̄q̄q̄, qqqq q̄ (three ways), qq q̄q̄ (two). Right: the colour charges as arrows in the (T₃, T₈) plane of colour SU(3), laid head to tail; a hadron’s arrows must close. Below: the SU(6) content of three quarks — the colour singlet is antisymmetric, so spin × flavour must be the symmetric 56, which is exactly a spin-½ octet and a spin-3/2 decuplet — and the magnetic moments that follow, against the measured ones.',
    'Singlets in 3ᵃ ⊗ 3̄ᵇ, the colour arrows that must close, the SU(6) 56, and the magnetic moments.',2,0.36,1);
  const b=L.main; frame(ctx,b,COL.edge);
  const [bg,bt]=L.narrow?[b,null]:splitH(b,0.5,26);
  /* the singlet grid */
  { title(ctx,W,H,bg,'colour singlets in 3ᵃ ⊗ 3̄ᵇ (a quarks, b antiquarks)','singlets in 3ᵃ ⊗ 3̄ᵇ');
    const n=SING_A+1, cs=Math.min((bg.w-40)/(SING_B+1),(bg.h-40)/n), gx=bg.x+30+(bg.w-40-cs*(SING_B+1))/2, gy=bg.y+18;

      ctx.fillStyle=v===null?'#0b0f1a':v>0?mix('#070b18',COL.pos,clamp(0.35+0.12*v,0,1)):'#121828';
      ctx.fillRect(x,y,cs-2,cs-2);
      if(v!==null&&cs>=18) lab(ctx,W,H,x+(cs-2)/2,y+(cs-2)/2,String(v),v>0?'#070b18':COL.dim,cs>=26?LAB_FONT:SM_FONT,'center','middle');
      if(i===C.a&&j===C.b){ ctx.strokeStyle=COL.live; ctx.lineWidth=2.5; ctx.strokeRect(x-1,y-1,cs,cs); }
