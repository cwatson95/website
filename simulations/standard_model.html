  }
  /* the colour arrows */
  if(bt){
    title(ctx,W,H,bt,C.sing?'the colour charges close: a singlet exists':'the colour charges cannot close: no singlet','colour arrows');
    const w=fundWeights(3), chain=colourChain(C.a,C.b);
    const pts=[[0,0]]; for(const q of chain){ const s=q.bar?-1:1, p=pts[pts.length-1]; pts.push([p[0]+s*w[q.c][0],p[1]+s*w[q.c][1]]); }
    let e=0.9; for(const p of pts) e=Math.max(e,Math.abs(p[0])+0.3,Math.abs(p[1])+0.3);
    const map=worldFitUp(box(bt.x+10,bt.y+10,bt.w-20,bt.h-40),{xmin:-e,xmax:e,ymin:-e,ymax:e},0);
    for(let i=0;i<3;i++){ dot(ctx,map.X(w[i][0]),map.Y(w[i][1]),4,CCOL[i],null); dot(ctx,map.X(-w[i][0]),map.Y(-w[i][1]),4,null,CCOL[i],1.3);
      lab(ctx,W,H,map.X(w[i][0])+6,map.Y(w[i][1])-6,CNAME[i],CCOL[i],SM_FONT,'left','bottom'); lab(ctx,W,H,map.X(-w[i][0])+6,map.Y(-w[i][1])+6,CNAME[i]+MACRON,CCOL[i],SM_FONT,'left','top'); }
    chain.forEach((q,i)=>arrowPx(ctx,map.X(pts[i][0]),map.Y(pts[i][1]),map.X(pts[i+1][0]),map.Y(pts[i+1][1]),CCOL[q.c],2));
    const end=pts[pts.length-1], closed=Math.hypot(end[0],end[1])<1e-9;
    dot(ctx,map.X(0),map.Y(0),3,'#fff',null);
    if(chain.length) dot(ctx,map.X(end[0]),map.Y(end[1]),5,null,closed?COL.pos:COL.ref,2);
    const seqTxt=chain.map(q=>CNAME[q.c]+(q.bar?MACRON:'')).join(' ');
    lab(ctx,W,H,bt.x+bt.w/2,bt.y1-22,chain.length?seqTxt+(closed?' → back to the origin':' → ends off the origin'):'nothing',closed?COL.pos:COL.ref,SM_FONT,'center','bottom');
    const eps=C.a===3&&C.b===0?'εᵢⱼₖ: rgb − rbg + gbr − grb + brg − bgr':C.a===1&&C.b===1?'δ: rr̄ + gḡ + bb̄':C.sing?C.sing+' independent singlets':'triality '+C.triality+' ≠ 0';
    lab(ctx,W,H,bt.x+bt.w/2,bt.y1-6,eps,COL.dim,SM_FONT,'center','bottom');
  }
  /* SU(6) */
  if(L.bottom.length>1){
    const bb=L.bottom[0]; frame(ctx,bb,COL.edge);
    title(ctx,W,H,bb,'6 ⊗ 6 ⊗ 6 = 56 ⊕ 70 ⊕ 70 ⊕ 20 as SU(3) × spin','SU(6) content');
    const rows=[['56 symmetric',C.sym],['20 antisymmetric',C.alt]];
    const rowH=Math.min(34,(bb.h-30)/3), w=bb.w-120;
    rows.forEach(([nm,list],r)=>{ const y=bb.y+12+r*(rowH+8); let x=bb.x+110;
      lab(ctx,W,H,bb.x+8,y+rowH/2,nm,COL.dim,SM_FONT,'left','middle');
      list.forEach(([p,q,d,m],i)=>{ const n=irrepDim(p,q)*d*m, ww=w*n/56; ctx.fillStyle=i?COL.su2:COL.pos; ctx.fillRect(x,y,ww-2,rowH*0.62);
        lab(ctx,W,H,x+2,y+rowH*0.62+2,'('+irrepName(p,q)+', '+d+')',i?COL.su2:COL.pos,SM_FONT,'left','top'); x+=ww; }); });
    lab(ctx,W,H,bb.x+8,bb.y+12+2*(rowH+8)+rowH/2,'70 + 70 mixed: '+(216-C.dimSym-C.dimAlt)+' states',COL.dim,SM_FONT,'left','middle');
  }
  { const bb=L.bottom[L.bottom.length-1], R=C.rows;
    axesT(ctx,bb,-0.5,R.length-0.5,-2.6,3.4,{xticks:[],yticks:bb.h<110?[-2,0,2]:[-2,-1,0,1,2,3],yfmt:v=>fmt(v,0),ylab:'μ, nuclear magnetons',
      title:titleFor(bb,'magnetic moments: quark model ◆ against PDG ●; m(u) = m(d) = '+fmt(C.mud,0)+', m(s) = '+fmt(C.msq,0)+' MeV','moments: model ◆, PDG ●')});
    polyline(ctx,bb,[-0.5,R.length-0.5],[0,0],-0.5,R.length-0.5,-2.6,3.4,rgba(COL.dim,0.5),1);
    R.forEach((r,i)=>{ const X=bb.x+bb.w*(i+0.5)/R.length, Yv=v=>bb.y1-bb.h*(v+2.6)/6;
      ctx.strokeStyle=COL.ref; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(X-4,Yv(r.meas-r.unc)); ctx.lineTo(X-4,Yv(r.meas+r.unc)); ctx.stroke();
      dot(ctx,X-4,Yv(r.meas),3.5,COL.ref,null); diamond(ctx,X+4,Yv(r.pred),4,COL.pos,null);
      lab(ctx,W,H,X,bb.y1+4,r.lab,(st.massMode==='fit'&&(r.k==='p'||r.k==='L'))?COL.live:COL.dim,SM_FONT,'center','top'); });
  }
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  view: running couplings                                            *
 * ================================================================== */
function drawRun(ctx,W,H,M){
  const R=M.Ru, st=M.st;
  const L=stageLayout(ctx,W,H,
    'The three inverse couplings run as straight lines in ln μ at one loop, with slopes −bᵢ/2π fixed by the representation table: gauge bosons push a coupling toward asymptotic freedom, fermions and scalars push back. U(1) is in the grand-unified normalisation (×5/3). In the Standard Model the three lines miss each other by several decades; above a supersymmetric threshold the extra particles bend them to very nearly one point, near 10¹⁶ GeV. Adding a whole generation shifts all three slopes equally, so it moves nothing about where they cross. Below: the strong coupling growing toward low energy, and asymptotic freedom lost beyond 16½ flavours.',
    'Inverse couplings against log μ: the SM near miss and the supersymmetric crossing; αₛ and asymptotic freedom below.',2,0.32,1);
  const b=L.main, x0=2, x1=19.5, ylo=0, yhi=66;
  const pb=box(b.x+44,b.y+6,b.w-58,b.h-34);
  axesT(ctx,pb,x0,x1,ylo,yhi,{xticks:[2,4,6,8,10,12,14,16,18],xfmt:v=>'10'+sup(v),yticks:pb.h<160?[20,40,60]:[10,20,30,40,50,60],yfmt:v=>fmt(v,0),xlab:'energy μ, GeV',ylab:'α⁻¹',
    title:titleFor(pb,'the inverse gauge couplings, one loop — '+(R.Ms?'SUSY above '+sigf(R.Ms,3)+' GeV':'the Standard Model'),'α⁻¹ against μ')});
  const cols=[COL.u1,COL.su2,COL.su3], names=['α₁⁻¹ (U(1), ×5/3)','α₂⁻¹ (SU(2))','α₃⁻¹ (SU(3))'];
  if(R.Ms){ const lg=Math.log10(R.Ms); polyline(ctx,pb,[lg,lg],[ylo,yhi],x0,x1,ylo,yhi,rgba(COL.susy,0.6),1,[4,4]); lab(ctx,W,H,pb.x+pb.w*(lg-x0)/(x1-x0)+4,pb.y+14,'SUSY',COL.susy,SM_FONT,'left','top'); }
  const lp=Math.log10(R.planck); polyline(ctx,pb,[lp,lp],[ylo,yhi],x0,x1,ylo,yhi,rgba(COL.dim,0.5),1,[2,4]);
  lab(ctx,W,H,pb.x+pb.w*(lp-x0)/(x1-x0)-4,pb.y1-6,'Planck',COL.dim,SM_FONT,'right','bottom');
  for(let i=0;i<3;i++){ polyline(ctx,pb,R.curves.xs,R.curves.ys[i],x0,x1,ylo,yhi,cols[i],1.8);
    marker(ctx,pb,x0,x1,ylo,yhi,Math.log10(PDG.M_Z),R.a0[i],COL.ref); }
  for(const x of R.X) if(x) marker(ctx,pb,x0,x1,ylo,yhi,x.lg,x.ainv,COL.live);
  legendR(ctx,pb,[[COL.u1,names[0]],[COL.su2,names[1]],[COL.su3,names[2]],[COL.ref,'measured at the Z mass'],[COL.live,'pairwise crossings']]);
  if(R.spread!==null) lab(ctx,W,H,pb.x+8,pb.y1-8,'the three crossings span '+fmt(R.spread,2)+' decades',R.spread<0.6?COL.pos:COL.ref,LAB_FONT,'left','bottom');
  /* alpha_s */
  if(L.bottom.length){
    const bb=L.bottom[0], xa=Math.log10(0.9), xb=4, ya=0, yb=0.42;
    axesT(ctx,bb,xa,xb,ya,yb,{xticks:[0,1,2,3,4],xfmt:v=>'10'+sup(v),yticks:[0.1,0.2,0.3,0.4],yfmt:v=>fmt(v,1),xlab:'μ, GeV',ylab:'αₛ',
      title:titleFor(bb,'αₛ(μ), one loop with flavour thresholds: Λ⁽⁵⁾ = '+fmt(R.lam.L5*1000,0)+' MeV','αₛ(μ)')});
    polyline(ctx,bb,R.as.xs,R.as.ys,xa,xb,ya,yb,COL.su3,1.8);
    for(const [k,nm] of [['m_c','c'],['m_b','b'],['m_t','t']]){ const lg=Math.log10(PDG[k]); polyline(ctx,bb,[lg,lg],[ya,yb],xa,xb,ya,yb,rgba(COL.dim,0.5),1,[3,3]);
      lab(ctx,W,H,bb.x+bb.w*(lg-xa)/(xb-xa)+3,bb.y+4,nm,COL.dim,SM_FONT,'left','top'); }
    marker(ctx,bb,xa,xb,ya,yb,Math.log10(PDG.M_Z),PDG.alpha_s,COL.ref);
  }
  if(L.bottom.length>1){
    const bb=L.bottom[1], nf=R.nf;
    axesT(ctx,bb,0,20,-12,2,{xticks:[0,4,8,12,16,20],xfmt:v=>fmt(v,0),yticks:[-12,-8,-4,0],yfmt:v=>fmt(v,0),xlab:'quark flavours n',ylab:'b₃',
      title:titleFor(bb,'b₃ = −11 + 2n/3: asymptotically free while b₃ < 0 (n ≤ 16 flavours)','asymptotic freedom')});
    polyline(ctx,bb,[0,20],[-11,-11+40/3],0,20,-12,2,COL.su3,1.8);
    polyline(ctx,bb,[0,20],[0,0],0,20,-12,2,rgba(COL.ref,0.6),1,[4,3]);
    marker(ctx,bb,0,20,-12,2,nf,qval(R.b3nf),qval(R.b3nf)<0?COL.pos:COL.live);
    lab(ctx,W,H,bb.x+bb.w*16.5/20,bb.y1-bb.h*(12/14)-4,'16.5',COL.ref,SM_FONT,'center','bottom');
  }
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='gauge') drawGauge(ctx,W,H,M);
  else if(M.view==='gen') drawGen(ctx,W,H,M);
  else if(M.view==='higgs') drawHiggs(ctx,W,H,M);
  else if(M.view==='eight') drawEight(ctx,W,H,M);
  else if(M.view==='colour') drawColour(ctx,W,H,M);
  else drawRun(ctx,W,H,M);
}
function camKeys(view){ return view==='higgs'?['hTheta','hPhi']:null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  /* the pointer orbits the camera in the Higgs view only */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const keys=camKeys(ST.view); if(!keys) return false;
    if(type==='down'){ DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST[keys[0]]; DRAG.ph=ST[keys[1]]; return true; }
    if(type==='move'&&DRAG.what==='cam'){ ST[keys[0]]=DRAG.th-(x-DRAG.x)*0.008; ST[keys[1]]=clamp(DRAG.ph+(y-DRAG.y)*0.008,0.05,1.5); return true; }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    if(st.view!==k){ st.view=k; simReset(); }
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab}));
  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); dirty=true; refresh(); }});
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }
  const sixth=v=>qstr(Q(Math.round(v),6));

  /* the gauge group */
  const gGauge=h('div',{class:'grp'},h('h3',null,'the group'));
  /* the generator indices are clamped in syncPanel, which every chip click runs — one guard, not two
     (Known-bad: two guards on one path make each other's mutant equivalent) */
  const grpChips=chipRow(GRP_LIST,'grp');
  gGauge.appendChild(grpChips); trackChips(gGauge,GRP_LIST,'grp');
  gGauge.appendChild(slider('ga','generator a',1,35,1,v=>'T'+sub(Math.round(v))));
  gGauge.appendChild(slider('gb','generator b',1,35,1,v=>'T'+sub(Math.round(v))));
  const gaugeTag=h('div',{class:'tag'}); gGauge.appendChild(gaugeTag);

  /* one generation */
  const gGen=h('div',{class:'grp'},h('h3',null,'the hypercharges'));
  const genChips=chipRow(GEN_LIST,'genMode'); gGen.appendChild(genChips); trackChips(gGen,GEN_LIST,'genMode');
  gGen.appendChild(slider('kQ','Y of Q',LIM.kmin,LIM.kmax,1,sixth));
  gGen.appendChild(slider('ku','Y of uᶜ',LIM.kmin,LIM.kmax,1,sixth));
  gGen.appendChild(slider('kd','Y of dᶜ',LIM.kmin,LIM.kmax,1,sixth));
  gGen.appendChild(slider('kL','Y of L',LIM.kmin,LIM.kmax,1,sixth));
  gGen.appendChild(slider('ke','Y of eᶜ',LIM.kmin,LIM.kmax,1,sixth));
  gGen.appendChild(slider('nc','colours N',1,LIM.ncMax,1,v=>fmt(v,0)));
  gGen.appendChild(h('div',{class:'checks'},checkbox('nuR','add a right-handed neutrino')));
  gGen.appendChild(slider('kn','Y of νᶜ',LIM.kmin,LIM.kmax,1,sixth));
  gGen.appendChild(h('div',{class:'btnrow'},h('button',{onclick:()=>{ Object.assign(st,{kQ:SM_KY.Q,ku:SM_KY.u,kd:SM_KY.d,kL:SM_KY.L,ke:SM_KY.e,kn:0}); syncPanel(); dirty=true; refresh(); }},'the Standard Model’s values')));
  const genTag=h('div',{class:'tag'}); gGen.appendChild(genTag);

  /* the Higgs */
  const gHiggs=h('div',{class:'grp'},h('h3',null,'the potential'));
  gHiggs.appendChild(slider('x2','μ² ÷ |μ²| today',LIM.x2min,LIM.x2max,0.01,v=>fmt(v,2)));
  gHiggs.appendChild(slider('s2w','sin²θ (mixing)',0.05,0.6,0.0001,v=>fmt(v,4)));
  const hChips=chipRow(HMODE_LIST,'hmode',()=>simReset()); gHiggs.appendChild(hChips); trackChips(gHiggs,HMODE_LIST,'hmode');
  gHiggs.appendChild(slider('hTheta','azimuth',-PI,PI,0.01,v=>fmt(v*RAD,0)+'°'));
  gHiggs.appendChild(slider('hPhi','elevation',0.05,1.5,0.01,v=>fmt(v*RAD,0)+'°'));
  gHiggs.appendChild(h('div',{class:'checks'},checkbox('running','the ball moves')));
  gHiggs.appendChild(slider('speed','speed',1,10,1,v=>fmt(v,0)+'×'));
  const higgsTag=h('div',{class:'tag'}); gHiggs.appendChild(higgsTag);

  /* the eightfold way */
  const gEight=h('div',{class:'grp'},h('h3',null,'the multiplets'));
  const eightChips=chipRow(EIGHT_LIST,'eight'); gEight.appendChild(eightChips); trackChips(gEight,EIGHT_LIST,'eight');
  const spinChips=chipRow(SPIN_LIST,'spin'); gEight.appendChild(spinChips); trackChips(gEight,SPIN_LIST,'spin');
  gEight.appendChild(slider('pp','p (quark index)',0,6,1,v=>fmt(v,0)));
  gEight.appendChild(slider('qq','q (antiquark index)',0,6,1,v=>fmt(v,0)));
  const eightTag=h('div',{class:'tag'}); gEight.appendChild(eightTag);

  /* colour and spin */
  const gColour=h('div',{class:'grp'},h('h3',null,'the hadron'));
  gColour.appendChild(slider('na','quarks a',0,SING_A,1,v=>fmt(v,0),()=>{ if(st.na+st.nb>SING_MAX) st.nb=SING_MAX-st.na; }));
  gColour.appendChild(slider('nb','antiquarks b',0,SING_B,1,v=>fmt(v,0),()=>{ if(st.na+st.nb>SING_MAX) st.na=SING_MAX-st.nb; }));
  const massChips=chipRow(MASS_LIST,'massMode'); gColour.appendChild(massChips); trackChips(gColour,MASS_LIST,'massMode');
  gColour.appendChild(slider('mud','m(u) = m(d), MeV',200,500,1,v=>fmt(v,0)));
  gColour.appendChild(slider('msq','m(s), MeV',300,750,1,v=>fmt(v,0)));
  const colourTag=h('div',{class:'tag'}); gColour.appendChild(colourTag);

  /* running couplings */
  const gRun=h('div',{class:'grp'},h('h3',null,'the particle content'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('susy','supersymmetry above a threshold')));
  gRun.appendChild(slider('lgMs','log₁₀ threshold / GeV',2,5,0.05,v=>fmt(v,2)));
  gRun.appendChild(slider('ngen','generations',0,LIM.ngenMax,1,v=>fmt(v,0)));
  gRun.appendChild(slider('nhiggs','Higgs doublets',0,LIM.nhMax,1,v=>fmt(v,0)));
  gRun.appendChild(slider('nf','QCD flavours n',0,LIM.nfMax,1,v=>fmt(v,0)));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Measured: Particle Data Group, Review of Particle Physics 2026 (Int. J. Mod. Phys. A 41, 2630011); '
      +'&alpha;&#770;(M<sub>Z</sub>) from the 2024 Electroweak review. Each value in build_sm/pdg.txt is checked against the pdftotext of its table '
      +'(check_pdg.py). The group theory is exact; build_sm/derive.py recomputes it by independent routes (numpy traces, the Weyl character '
      +'and integration formulas, Okubo&rsquo;s closed forms) and selfTest pins every number to it.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the mathematics'),h('div',{id:'phys'}));
  [gGauge,gGen,gHiggs,gEight,gColour,gRun,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===plain(list[i].name)) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view;
    gGauge.hidden=(v!=='gauge'); gGen.hidden=(v!=='gen'); gHiggs.hidden=(v!=='higgs');
    gEight.hidden=(v!=='eight'); gColour.hidden=(v!=='colour'); gRun.hidden=(v!=='run');
    const n=st.grp===1?1:st.grp*st.grp-1;
    rows.ga.inp.max=n; rows.gb.inp.max=n;
    st.ga=Math.min(st.ga,n); st.gb=Math.min(st.gb,n);
    rows.ga.row.hidden=rows.gb.row.hidden=(st.grp===1);
    const own=st.genMode==='own';
    for(const k of ['kQ','ku','kd','kL','ke']) rows[k].row.hidden=!own;
    rows.nc.row.hidden=(st.genMode!=='nc');
    rows.cb_nuR.row.hidden=(st.genMode==='nc');
    rows.kn.row.hidden=!(own&&st.nuR);
    rows.pp.row.hidden=rows.qq.row.hidden=(st.eight!=='irrep');
    spinChips.hidden=!(st.eight==='mesons'||st.eight==='baryons');
    rows.mud.row.hidden=rows.msq.row.hidden=(st.massMode!=='own');
    rows.lgMs.row.hidden=!st.susy;
    for(const k in rows) rows[k].sync();
    const G=st.grp===1?null:algebra(st.grp);
    gaugeTag.innerHTML=st.grp===1?'U(1): one generator, abelian — no roots, no self-coupling':'pick two generators; the readout gives their commutator from the structure constants '+(G?'('+G.nzF.length+' nonzero f<sub>abc</sub> with a &lt; b &lt; c)':'');
    genTag.innerHTML=own?'hypercharges in sixths; the anomaly bars go green only when all five vanish':st.genMode==='nc'?'for N colours the anomaly conditions fix every hypercharge; an even N fails Witten&rsquo;s count':'the Standard Model&rsquo;s assignment: every anomaly cancels between quarks and leptons';
    higgsTag.innerHTML='drag the picture to orbit it; slide &mu;&sup2; above zero to restore the symmetry';
    eightTag.innerHTML=st.eight==='irrep'?'p quark and q antiquark indices: (1,0) = 3, (0,1) = 3&#772;, (1,1) = 8, (3,0) = 10':'the physical multiplet is labelled with PDG 2026 masses in MeV';
    colourTag.innerHTML='a + b is capped at '+SING_MAX+'; the grid square and the arrows follow the sliders';
    runTag.innerHTML='the slopes come from the same representation table as the second view; the couplings at M<sub>Z</sub> are measured';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space pauses the ball &nbsp; <b>r</b> restarts it';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=camKeys(st.view)?'drag to orbit the view · space pauses · 1–6 switch views':'1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ simReset(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%10===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

    ST.view='higgs'; ok(S.pointer('down',300,300),'the Higgs view grabs it'); eq(DRAG.what,'cam','as a camera drag'); const th0=ST.hTheta; S.pointer('move',350,300); ok(ST.hTheta<th0,'dragging right turns the camera');
    S.pointer('move',350,900); close(ST.hPhi,1.5,1e-12,'elevation clamps at 1.5'); ok(S.pointer('up',0,0),'pointer-up releases'); eq(DRAG.what,null,'nothing dragged');
    S.pointer('down',10,10); S.pointer('move',10,-900); close(ST.hPhi,0.05,1e-12,'and at 0.05'); S.pointer('up',0,0);
    Object.assign(ST,stSave); simReset(); }

  /* ---------- I. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['gauge SU3',{view:'gauge'},60],['gauge U1',{view:'gauge',grp:1},3],['gauge SU2',{view:'gauge',grp:2,ga:3,gb:1},20],['gauge SU5',{view:'gauge',grp:5,ga:24,gb:12},200],['gauge SU6',{view:'gauge',grp:6,ga:35,gb:35},300],
    ['gen SM',{view:'gen'},12],['gen own bad',{view:'gen',genMode:'own',ku:12,kd:-12,ke:-12,kL:12},10],['gen N9',{view:'gen',genMode:'nc',nc:9},12],['gen N1 nu',{view:'gen',genMode:'nc',nc:1},10],['gen own nu',{view:'gen',genMode:'own',nuR:true,kn:-12},10],
    ['higgs',{view:'higgs'},300],['higgs sym',{view:'higgs',x2:1,hmode:'higgs',frames:30},300],['higgs top',{view:'higgs',hPhi:1.5,x2:-2},300],['higgs low',{view:'higgs',hPhi:0.05,hTheta:2.4,s2w:0.6},300],['higgs zero',{view:'higgs',x2:0},300],
    ['eight baryons',{view:'eight'},15],['eight decuplet',{view:'eight',spin:'high'},15],['eight mesons',{view:'eight',eight:'mesons'},12],['eight vectors',{view:'eight',eight:'mesons',spin:'high'},12],['eight diquarks',{view:'eight',eight:'diquarks'},8],
    ['eight irrep 00',{view:'eight',eight:'irrep',pp:0,qq:0},2],['eight irrep 66',{view:'eight',eight:'irrep',pp:6,qq:6},60],['eight irrep 51',{view:'eight',eight:'irrep',pp:5,qq:1},30],
    ['colour qqq',{view:'colour'},60],['colour none',{view:'colour',na:0,nb:0},60],['colour 6,1',{view:'colour',na:6,nb:1},60],['colour 0,6 own',{view:'colour',na:1,nb:6,massMode:'own',mud:200,msq:300},60],
    ['run SM',{view:'run'},6],['run SUSY',{view:'run',susy:true,lgMs:2},6],['run extreme',{view:'run',susy:true,lgMs:5,ngen:6,nhiggs:4,nf:20},6],['run pure gauge',{view:'run',ngen:0,nhiggs:0,nf:0},6],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
