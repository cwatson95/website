/* ================================================================== *
 *  selfTest — headless verification.  REF is build_logic/refvals.json,*
 *  the output of derive.py, an independent Python gate simulator.     *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  /* a state, the live circuits made afresh for it, and an optional script run before the test (an input changed,
     some delays stepped) */
  function withState(over,fn,pre){ Object.assign(ST,DEFAULTS,over); simReset(); for(const k in MEMO) delete MEMO[k];
    try{ clampNums(ST); ensureLive(ST); if(pre) pre(ST); return fn(); } finally{ Object.assign(ST,stSave); simReset(); } }
  const J=x=>JSON.stringify(x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,k)=>(o[k]=x[k],o),{}):x);

  /* ---------- 0. the shared helpers ---------- */
  ok(plain('&Delta;V &#955;')==='ΔV λ','plain() decodes'); eq(bin(5,4),'0101','bin'); eq(numOf({idx:{S0:0,S1:1,S2:2}},[1,0,1],'S',3),5,'numOf');
  eq(J(bitsOf(6,3)),'[0,1,1]','bitsOf, low bit first'); eq(signedOf(13,4),-3,'two’s complement 1101 = −3'); eq(signedOf(7,4),7,'0111 = 7');

  /* ---------- 1. the gates ---------- */
  for(const t of GATES){ const tt=REF.truth[t]; eq(J(truthTable(t).map(r=>r[r.length-1])),J(tt),t+': the truth table (derive.py)'); }
  eq(J(Object.fromEntries(GATES.map(t=>[t,nandOnly(t).gates.length]))),J(REF.nand_count),'the NAND forms’ gate counts');
  for(const t of GATES){ const N=nandOnly(t), n=ARITY[t]?1:2; let d=0, good=true;
    for(let k=0;k<(1<<n);k++){ const b=bitsOf(k,n).reverse(), ins=n===1?{A:b[0]}:{A:b[0],B:b[1]}, r=settle(N,startState(N),ins);
      good=good&&val(N,r.v,'Y')===evalGate(t,b)&&!r.osc; d=Math.max(d,r.ticks); }
    ok(good,t+' from NANDs gives the rule on every row'); eq(d,REF.nand_settle_from_zero[t],t+' from NANDs: the delays from the all-zero start'); }
  ok(N_INPUT_GATE_CHECK(),'n-input AND/OR/XOR follow their definitions');
  function N_INPUT_GATE_CHECK(){ for(let k=0;k<8;k++){ const v=bitsOf(k,3); if(evalGate('AND',v)!==(k===7?1:0)||evalGate('OR',v)!==(k?1:0)||evalGate('XOR',v)!==(v[0]^v[1]^v[2])) return false; } return true; }

  /* ---------- 2. switches ---------- */
  eq(J(Object.fromEntries(Object.keys(CMOS).map(t=>[t,countSw(CMOS[t].up)+countSw(CMOS[t].down)]))),J(REF.cmos_transistors),'CMOS transistor counts');
  for(const t in CMOS) for(let k=0;k<4;k++){ const a=k>>1, b=k&1, v={A:a,B:b}, g=CMOS[t];
    ok(conducts(g.up,v)!==conducts(g.down,v),t+' at '+a+b+': exactly one network conducts'); eq(cmosOut(g,v),evalGate(t,t==='NOT'?[a]:[a,b]),t+' at '+a+b+': CMOS gives the rule'); }
  eq(cmosOut({up:SW('A',1),down:SER(SW('A'),SW('B'))},{A:0,B:0}),1,'a test of the four cases: pulled up');
  eq(cmosOut({up:SW('A',1),down:SW('B')},{A:0,B:1}),'short','both on is a short'); eq(cmosOut({up:SW('A',1),down:SW('B')},{A:1,B:0}),'float','neither is a float');
  for(let k=0;k<4;k++){ const v={A:k>>1,B:k&1}; eq(conducts(SER(SW('A'),SW('B')),v)?1:0,v.A&v.B,'series is AND'); eq(conducts(PAR(SW('A'),SW('B')),v)?1:0,v.A|v.B,'parallel is OR'); }
  eq(tgate(1,0,1),0,'the transmission gate passes D when closed'); eq(tgate(0,0,1),1,'and holds when open');
  withState({view:'switch',wD:1,wEN:1},()=>{ buildModel(); ST.wEN=0; ST.wD=0; const W1=buildModel().W; eq(W1.q,1,'opened, the node keeps the 1 it had while D goes to 0'); ST.wEN=1; eq(buildModel().W.q,0,'closed again, it follows'); });

  /* ---------- the engine ---------- */
  { const Cs=[oneGate('XNOR'),nandOnly('XOR'),srLatch(),dLatch(),dFlipFlop(),rippleAdder(3),rippleSub(3),addSubUnit(3),accumulator(3),halfAdder(),fullSub()];
    let seed=11; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
    for(const C of Cs){ let good=true; for(let k=0;k<40;k++){ const v=new Uint8Array(C.nets.length).map(()=>rnd()<0.5?1:0), ins={};
        for(const n of C.inputs) ins[n]=rnd()<0.5?1:0; if(!same(tick(C,v,ins),tickRef(C,v,ins))) good=false; }
      ok(good,C.name+': the compiled tick equals the gate-by-gate reference on 40 random states'); } }

  /* ---------- 3. memory ---------- */
  { const C=srLatch(); let v=startState(C); const seq=[];
    for(const [lab,ins] of [['hold',{S:0,R:0}],['set',{S:1,R:0}],['hold',{S:0,R:0}],['reset',{S:0,R:1}],['both',{S:1,R:1}],['release',{S:0,R:0}]]){
      const r=settle(C,v,ins,60); v=r.v; seq.push([lab,val(C,v,'Q'),val(C,v,'QB'),r.osc?-1:r.ticks]); }
    eq(J(seq),J(REF.sr_sequence),'the SR latch: hold, set, hold, reset, both, release (derive.py)'); }
  { const C=srLatch(); let v=settle(C,startState(C),{S:1,R:1}).v; const a=[]; v=force(C,v,{S:0,R:0}); for(let k=0;k<6;k++){ v=tick(C,v,{S:0,R:0}); a.push(''+val(C,v,'Q')+val(C,v,'QB')); }
    eq(a.join(' '),'11 00 11 00 11 00','released together, Q and Q̄ flip together every delay'); }
  { const C=dLatch(); let v=startState(C), q=0, good=true, seed=5; const rnd=()=>{ seed=(seed*69069+1)%4294967296; return seed/4294967296; };
    for(let k=0;k<400;k++){ const D=rnd()<0.5?1:0, EN=rnd()<0.5?1:0, r=settle(C,v,{D,EN}); v=r.v; if(EN) q=D; good=good&&val(C,v,'Q')===q&&val(C,v,'QB')===1-q&&!r.osc; }
    ok(good&&REF.dlatch_random_400,'the D latch: Q = D while EN, held otherwise, over 400 random settings'); }
  { const C=dFlipFlop(); let v=startState(C), q=0, D=0, good=true, seed=9; const rnd=()=>{ seed=(seed*69069+1)%4294967296; return seed/4294967296; }; const P=16;
    for(let k=0;k<300;k++){ for(let t=0;t<P;t++){ if(t===3) D=rnd()<0.5?1:0; const clk=t<P/2?0:1; if(t===P/2) q=D; v=tick(C,v,{D,CLK:clk}); } good=good&&val(C,v,'Q')===q; }
    ok(good&&REF.dff_random_300,'the D flip-flop: Q takes D at each rising edge, over 300 random cycles'); }
  { const C=dFlipFlop(); let v=settle(C,startState(C),{D:0,CLK:0}).v; v=settle(C,v,{D:1,CLK:0}).v;
    eq(val(C,v,'Q'),0,'with CLK low a new D does not reach Q'); v=settle(C,v,{D:1,CLK:1}).v; eq(val(C,v,'Q'),1,'the rising edge takes it'); v=settle(C,v,{D:0,CLK:1}).v; eq(val(C,v,'Q'),1,'and with CLK high a new D does not either'); }

  /* ---------- 4. adding ---------- */
  for(let n=1;n<=5;n++){ const C=rippleAdder(n), m=1<<n; let good=true;
    for(let a=0;a<m;a++) for(let b=0;b<m;b++) for(let c=0;c<2;c++){ const v=settled(C,Object.assign(busIns('A',a,n),busIns('B',b,n),{C0:c})); if(numOf(C,v,'S',n)+(val(C,v,'C'+n)<<n)!==a+b+c) good=false; }
    ok(good,n+'-bit ripple adder: every a + b + c'); }
  for(let n=1;n<=3;n++){ const C=rippleAdder(n), m=1<<n, ss=[];
    for(let a=0;a<m;a++) for(let b=0;b<m;b++) for(let c=0;c<2;c++){ const ins=Object.assign(busIns('A',a,n),busIns('B',b,n),{C0:c}); ss.push([settled(C,ins),ins]); }
    let w=0; for(const s1 of ss) for(const s2 of ss) w=Math.max(w,settle(C,s1[0],s2[1]).ticks);
    eq(w,REF.adder_worst_settle[n],n+' bits: the worst settling over every change of inputs (derive.py)'); eq(w,2*n+1,'= 2n + 1'); }
  for(let n=1;n<=8;n++){ const C=rippleAdder(n), z=Object.assign(busIns('A',0,n),busIns('B',0,n),{C0:0}), s0=settled(C,z);
    eq(settle(C,s0,Object.assign(busIns('A',0,n),busIns('B',(1<<n)-1,n),{C0:1})).ticks,REF.adder_settle_0_to_all_ones_plus_carry[n],n+' bits: 0 + 0 → 0 + 1…1 + 1'); }
  { const C=halfAdder(); for(let k=0;k<4;k++){ const a=k>>1,b=k&1,v=settled(C,{A:a,B:b}); eq(val(C,v,'S')+2*val(C,v,'C'),a+b,'half adder '+a+' + '+b); } }
  { const C=fullAdder(); for(let k=0;k<8;k++){ const a=k>>2,b=(k>>1)&1,c=k&1,v=settled(C,{A:a,B:b,Cin:c}); eq(val(C,v,'S')+2*val(C,v,'Cout'),a+b+c,'full adder '+a+b+c); } }

  /* ---------- 5. subtracting ---------- */
  for(let n=1;n<=5;n++){ const C=rippleSub(n), m=1<<n; let good=true;
    for(let a=0;a<m;a++) for(let b=0;b<m;b++) for(let w=0;w<2;w++){ const v=settled(C,Object.assign(busIns('A',a,n),busIns('B',b,n),{W0:w}));
      if(numOf(C,v,'D',n)!==((a-b-w)%m+m)%m||val(C,v,'W'+n)!==(a-b-w<0?1:0)) good=false; }
    ok(good,n+'-bit ripple subtractor: every a − b − w, with the borrow'); }
  for(let n=1;n<=6;n++){ const C=rippleSub(n), z=Object.assign(busIns('A',0,n),busIns('B',0,n),{W0:0}), s0=settled(C,z);
    eq(settle(C,s0,Object.assign({},z,{W0:1})).ticks,REF.sub_settle_borrow_through[n],n+' bits: a borrow through every bit (derive.py)'); }
  { const C=halfSub(); for(let k=0;k<4;k++){ const a=k>>1,b=k&1,v=settled(C,{A:a,B:b}); eq(val(C,v,'D'),(a-b+2)%2,'half subtractor d, '+a+' − '+b); eq(val(C,v,'Bo'),a<b?1:0,'and its borrow'); } }
  for(let n=2;n<=5;n++){ const C=addSubUnit(n), m=1<<n; let good=true, vc=0;
    for(let a=0;a<m;a++) for(let b=0;b<m;b++) for(let sub=0;sub<2;sub++){ const v=settled(C,Object.assign(busIns('A',a,n),busIns('B',b,n),{SUB:sub}));
      const want=sub?((a-b)%m+m)%m:(a+b)%m, ex=sub?signedOf(a,n)-signedOf(b,n):signedOf(a,n)+signedOf(b,n), ovf=(ex<-(m>>1)||ex>=(m>>1))?1:0;
      if(numOf(C,v,'S',n)!==want||val(C,v,'C'+n)!==(sub?(a>=b?1:0):(a+b>=m?1:0))||val(C,v,'V')!==ovf) good=false; vc+=val(C,v,'V'); }
    ok(good,n+' bits: A + ¬B + 1 = A − B, the carry is “no borrow”, V is signed overflow, for every pair'); eq(vc,REF.addsub_overflow_count[n],n+' bits: the overflow count (derive.py)'); }

  /* ---------- 6. the accumulator ---------- */
  for(let n=2;n<=6;n++) for(const X of [1,(1<<n)-1]){ const p=accMinPeriod(n,X); eq(p,REF.acc_min_period[n+','+X],n+' bits, X = '+X+': the shortest clock period (derive.py)');
    const C=accumulator(n), m=1<<n; for(const P of [p-2,p+2,p+6]){ const r=accRun(C,X,P,2*m+2).reads; const good=r.every((x,k)=>k===0||x===(r[k-1]+X)%m); ok(good===(P>=p),n+' bits, X = '+X+', period '+P+(P>=p?' works':' fails')); } }
  { const C=accumulator(4), r=accRun(C,3,16,9).reads; eq(r.join(','),'0,3,6,9,12,15,2,5,8','a 4-bit accumulator adding 3 wraps at 16'); }

  /* ---------- the live circuits ---------- */
  withState({view:'adder',aN:4,aA:7,aB:1,aC:0},()=>{ const A0=buildModel().A; eq(A0.sum,8,'the live adder starts settled at 7 + 1');
    ST.aA=0; ST.aB=15; ST.aC=1; inputsChanged(); const A1=buildModel().A; eq(A1.delays,9,'0 + 15 + 1 from 7 + 1 settles in 9 delays');
    ok(A1.sum!==A1.want,'and the outputs are wrong before any delay'); const n=liveSettle(ST); eq(n,A1.delays,'stepping the live circuit takes those delays'); eq(buildModel().A.sum,16,'and then shows 16'); });
  withState({view:'memory',mC:'dff',mRun:true,mP:16,mD:1},()=>{ liveSettle(ST,40); eq(buildModel().Mm.q,1,'the live flip-flop takes D = 1 at its first edge'); });
  withState({view:'acc',cN:4,cX:3,cP:16},()=>{ liveSettle(ST,16*6+9); const Ac=buildModel().Ac; ok(Ac.reads.length>=5&&Ac.ok,'the live accumulator adds 3 at every edge ('+Ac.reads.join(',')+')'); });
  /* X changed at every phase of the clock: synchronised to the edge, no latch is ever caught and every add lands */
  { const P=Math.max(accMinPeriod(4,3),accMinPeriod(4,5)); let good=true, worst='';
    for(let ph=0;ph<P;ph++) withState({view:'acc',cN:4,cX:3,cP:P},()=>{ for(let k=0;k<3*P+ph;k++) liveTick(ST); ST.cX=5; inputsChanged();
      for(let k=0;k<20*P;k++) liveTick(ST); const Ac=buildModel().Ac; if(!(Ac.ok&&!Ac.caught&&Ac.reads.length>=15&&Ac.X===5)){ good=false; worst='phase '+ph+': '+Ac.reads.join(','); } });
    ok(good,'X changed at any phase of the clock: never caught, every add of 5 lands'+(worst?' ('+worst+')':'')); }
  { const P=accMinPeriod(4,3); let good=true;
    for(const P2 of [P+6,P+2]) for(let ph=0;ph<P;ph+=3) withState({view:'acc',cN:4,cX:3,cP:P},()=>{ for(let k=0;k<2*P+ph;k++) liveTick(ST); ST.cP=P2; inputsChanged();
      for(let k=0;k<12*P2;k++) liveTick(ST); const Ac=buildModel().Ac; if(!(Ac.ok&&!Ac.caught&&Ac.P===P2)) good=false; });
    ok(good,'a new period, set at any phase, starts at a cycle boundary and every add lands'); }
  withState({view:'acc',cN:4,cX:3,cP:16},()=>{ const L=LIVE.acc, C=L.Cs[0];
    for(const n of ['R0','RB0','ff0.s.s','ff0.s.r']) L.vs[0][C.idx[n]]=1;   /* bit 0's slave latch, both outputs 1, both inputs 1 */
    ST.cRun=false; for(let k=0;k<8;k++) liveTick(ST); const Ac=buildModel().Ac; ok(Ac.caught&&!Ac.ok,'a latch with Q = Q̄ released together rings, and the page says it is caught'); });
  withState({view:'acc',cN:4,cX:1,cP:8},()=>{ liveSettle(ST,8*40); const Ac=buildModel().Ac; ok(Ac.fast&&!Ac.ok,'a clock below the limit misses adds ('+Ac.reads.slice(-8).join(',')+')'); });

  /* ---------- the prose ---------- */
  eq(PROSE.minP4,accMinPeriod(4,1),'prose: the 4-bit counter’s period'); eq(PROSE.fa,5,'prose: a full adder is five gates'); eq(J(PROSE.nands),J(REF.nand_count),'prose: the NAND counts');
  ok(INFO.acc.indexOf(PROSE.minP4+' gate delays')>=0,'the accumulator prose prints the computed period');

  /* ---------- 9. every view: panels and drawings ---------- */
  const SIZES=[[1400,820],[1100,700],[899,700],[820,520],[560,380]];
  const chg=f=>st=>{ f(st); inputsChanged(); liveTick(st); liveTick(st); };
  const CONFIGS=[...GATES.map(t=>['gates '+t,{view:'gates',gT:t}]),['gates mid-change',{view:'gates',gT:'XNOR'},chg(st=>{ st.gA=0; })],
    ...CMOS_LIST.map(o=>['switch '+o.id,{view:'switch',wT:o.id}]),['switch open',{view:'switch',wEN:0,wA:0,wB:0}],
    ['memory sr',{view:'memory'}],['memory sr set',{view:'memory',mS:1}],['memory sr forbidden',{view:'memory',mS:1,mR:1}],
    ['memory sr oscillating',{view:'memory',mS:1,mR:1},chg(st=>{ st.mS=0; st.mR=0; })],['memory dlatch',{view:'memory',mC:'dlatch',mEN:1}],
    ['memory dff running',{view:'memory',mC:'dff'},st=>{ for(let k=0;k<40;k++) liveTick(st); }],['memory dff stopped',{view:'memory',mC:'dff',mRun:false,mClk:1}],
    ['adder half',{view:'adder',aMode:'half',aA:1,aB:1}],['adder full',{view:'adder',aMode:'full',aA:1,aB:0,aC:1}],['adder ripple',{view:'adder'}],
    ['adder 8 bits mid-ripple',{view:'adder',aN:8,aA:255,aB:0},chg(st=>{ st.aC=1; })],['adder 1 bit',{view:'adder',aN:1,aA:1,aB:1}],['adder bit 3',{view:'adder',aBit:3}],

    ['sub twos',{view:'sub'}],['sub twos overflow',{view:'sub',sN:4,sA:7,sB:9}],['sub twos add',{view:'sub',sSub:0,sA:12,sB:9}],['sub 8 bits',{view:'sub',sN:8,sA:200,sB:77}],
    ['acc',{view:'acc'},st=>{ for(let k=0;k<70;k++) liveTick(st); }],['acc 8 bits fast',{view:'acc',cN:8,cX:255,cP:4},st=>{ for(let k=0;k<90;k++) liveTick(st); }],['acc fresh',{view:'acc',cN:2,cX:0}]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,pre] of CONFIGS) withState(over,()=>{ const M=buildModel(), v=M.view;
    const txt=[readoutHTML(M),eqbarHTML(M),tagHTML(M),INFO[v],DERIV[v]].join(' ').replace(/<[^>]*>/g,' ').replace(/&[a-zA-Z]+;|&#[0-9]+;/g,' ').replace(/[\w.\/]+\.(py|js|json|md|html)\b/g,' ');
    const bad=(txt.match(/\S_\S|[\^{}]|NaN|undefined|Infinity/)||[])[0];
    ok(!bad,nm+': the panels’ text is clean'+(bad?' ("'+bad+'")':'')); },pre);
  const tDraw={};
  for(const [nm,over,pre] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t1=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t1);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke');
      ok(strokes.length>=(H<520?4:10)&&texts.length>=(H<520?4:10),nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+texts.length+' texts)');
      { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/[\^{}]/.test(t.t)){ bad='a caret or brace: "'+t.t.slice(0,40)+'"'; break; }
        if(/\S_\S/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; }
        if(W<900&&/lower (left|right)|below|Below/.test(t.t)){ bad='a narrow stage’s caption names a plot it does not draw: "'+t.t.slice(0,50)+'"'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key fits ('+KEY_DROPS+' dropped)');
    },pre);
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
