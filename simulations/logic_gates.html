<!--
  ===================================================================
  logic_gates.html — Boolean logic gates, what they are made of, how
  a loop of them remembers, and how they add and subtract
  ===================================================================

  Six views.  THE GATES: NOT, AND, OR, NAND, NOR, XOR, XNOR, each
  with its truth table, and the same rule built from NANDs alone.
  SWITCHES: switches in series and parallel as AND and OR (Shannon
  1938), static CMOS NOT, NAND and NOR as pull-up and pull-down
  networks, and the transmission gate, a switch that holds a value.
  MEMORY: the SR latch (two cross-coupled NORs; the forbidden state
  and its oscillation), the gated D latch and the master-slave D
  flip-flop, with timing diagrams.  THE ADDER: half adder, full
  adder, an n-bit ripple-carry adder with the carry rippling and the
  wrong sums read too early.  THE SUBTRACTOR: half and full
  subtractors, an n-bit borrow chain, and A + not B + 1 on the adder
  with the signed overflow flag.  THE ACCUMULATOR: a register of
  flip-flops and an adder, R <- R + X at each clock edge, and the
  shortest clock period at which every add lands.

  Every circuit runs gate by gate in the page: a netlist of two-input
  gates, each a unit delay, all updated together from the previous
  step.  Nothing is measured; the one source is Shannon (1938).

  Verification: build_logic/derive.py, an independent Python gate
  simulator, checks every truth table, the NAND forms, the CMOS
  networks, every sum and difference against integer arithmetic,
  the overflow flag, the latch and flip-flop behaviour, the adders'
  worst settling times and the accumulator's clock limit; selfTest()
  pins the page to it; ui_body_lg.js drives the controls headlessly;
  a mutation sweep; a display-list capture and audit.
  ===================================================================
-->

/* ================================================================== *

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* a true minus sign (U+2212), and a negative that rounds to zero printed as zero */
function fmt(x,n){ if(!isFinite(x)) return '—'; const s=Number(x).toFixed(n===undefined?3:n); return /^-0(\.0*)?$/.test(s)?s.slice(1):s.replace('-','−'); }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* a power of ten in superscripts, never a caret: 1.768 × 10⁸, 2.5 × 10⁻⁵ */
  if(a>=1e5||a<1e-4){ const s=x.toExponential(n-1), k=s.indexOf('e'), SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return s.slice(0,k).replace('-','−')+' × 10'+String(+s.slice(k+1)).split('').map(c=>c==='-'?'⁻':SUP[+c]).join(''); }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8)).replace('-','−');
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',

            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ',
            /* standard_model.html: the group-theory symbols */
            '&otimes;':'⊗','&oplus;':'⊕','&Xi;':'Ξ','&xi;':'ξ','&psi;':'ψ','&chi;':'χ','&zeta;':'ζ',
            '&partial;':'∂','&sum;':'∑','&nabla;':'∇','&dagger;':'†','&frac14;':'¼','&frac34;':'¾',
            '&sim;':'∼','&isin;':'∈','&bull;':'•','&harr;':'↔','&uarr;':'↑','&darr;':'↓','&Theta;':'Θ',
            '&Psi;':'Ψ','&sup1;':'¹','&lang;':'⟨','&rang;':'⟩','&macr;':'¯',

            /* clebsch_gordan.html */

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  /* integer multiples of the step, never an accumulated sum: a running t += step printed 0 as −5.55e-17 */
  for(let i=Math.ceil(lo/step-1e-9);i*step<=hi+step*1e-6;i++) out.push(i*step===0?0:i*step);
  return out;
}
/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop
   in a naive generator (sbs_sims Known-bad) — return [] instead */
function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;
  for(let e=e0;e<=e1;e+=step){ const v=Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};
}
function sparseTicks(lo,hi,hpx){
  return ticksFor(lo,hi,hpx<90?2:(hpx<140?3:5));
}
/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));
  let fit=capFit(ctx,W,H,fullTxt,capW);
  if(fit.capY>=minTop) return {capY:fit.capY,txt:fullTxt,capW};
  fit=capFit(ctx,W,H,shortTxt,capW);
  return {capY:fit.capY,txt:shortTxt,capW};
}
function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];
}


/* ================================================================== *
 *  the engine: a netlist of gates, each one unit of delay             *
 *  (build_logic/derive.py is an independent Python twin)              *
 * ================================================================== */
/* every gate's function, on a list of 0/1 inputs */
const GATE_FN={
  BUF:v=>v[0], NOT:v=>1-v[0],
  AND:v=>v.every(x=>x===1)?1:0, OR:v=>v.some(x=>x===1)?1:0,
  NAND:v=>v.every(x=>x===1)?0:1, NOR:v=>v.some(x=>x===1)?0:1,
  XOR:v=>v.reduce((a,x)=>a^x,0), XNOR:v=>1-v.reduce((a,x)=>a^x,0)};
function evalGate(t,v){ const f=GATE_FN[t]; if(!f) throw new Error('no gate '+t); return f(v); }

/* a circuit: named nets, gates (type, input nets, output net, a place to draw it), forced inputs, a start state */
function circuit(name){ return {name,nets:[],idx:{},gates:[],inputs:[],outputs:[],init:{},place:{}}; }
function net(C,n){ if(C.idx[n]===undefined){ C.idx[n]=C.nets.length; C.nets.push(n); } return C.idx[n]; }
function gate(C,t,ins,out,x,y){ C.gates.push({t,ins:ins.map(n=>net(C,n)),out:net(C,out),x,y}); return out; }
function input(C,n,x,y){ net(C,n); C.inputs.push(n); C.place[n]=[x,y]; return n; }
function output(C,n,x,y){ net(C,n); C.outputs.push(n); C.place['>'+n]=[x,y]; return n; }

/* a state: one 0/1 per net.  The start: every net 0, but the circuit's own init (a latch powers up holding 0) */
function startState(C){ const v=new Uint8Array(C.nets.length); for(const n in C.init) v[C.idx[n]]=C.init[n]; return v; }
function force(C,v,ins){ for(const n in ins) v[C.idx[n]]=ins[n]?1:0; return v; }
/* one tick: every gate reads the previous state, all at once; the forced inputs hold.  The gates are compiled once
   to numeric codes (the accumulator runs 10⁶ gate updates to find its clock limit); evalGate is the reference the
   selfTest holds the compiled form to. */
const GCODE={BUF:0,NOT:1,AND:2,OR:3,NAND:4,NOR:5,XOR:6,XNOR:7};
function compile(C){ if(C.cc&&C.cc.n===C.gates.length) return C.cc;
  const n=C.gates.length, code=new Uint8Array(n), out=new Int32Array(n), i0=new Int32Array(n), i1=new Int32Array(n), ar=new Uint8Array(n);
  C.gates.forEach((g,k)=>{ if(g.ins.length>2) throw new Error('a gate of more than two inputs'); code[k]=GCODE[g.t]; out[k]=g.out; i0[k]=g.ins[0]; i1[k]=g.ins.length>1?g.ins[1]:g.ins[0]; ar[k]=g.ins.length; });
  return (C.cc={n,code,out,i0,i1,ar}); }
function tick(C,v,ins){
  const cc=compile(C), nv=Uint8Array.from(v);
  for(let k=0;k<cc.n;k++){ const a=v[cc.i0[k]], b=v[cc.i1[k]]; let y;
    switch(cc.code[k]){ case 0: y=a; break; case 1: y=1-a; break; case 2: y=(a&b); break; case 3: y=a|b; break;
      case 4: y=1-(a&b); break; case 5: y=1-(a|b); break; case 6: y=cc.ar[k]===1?a:a^b; break; default: y=cc.ar[k]===1?1-a:1-(a^b); }
    nv[cc.out[k]]=y; }
  return force(C,nv,ins);
}
/* the reference tick, gate by gate through evalGate (the selfTest holds the compiled tick to it) */
function tickRef(C,v,ins){
  const nv=Uint8Array.from(v);
  for(const g of C.gates){ const a=new Array(g.ins.length); for(let i=0;i<g.ins.length;i++) a[i]=v[g.ins[i]]; nv[g.out]=evalGate(g.t,a); }
  return force(C,nv,ins);
}
function same(a,b){ for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
/* run from v with the inputs held until a tick changes nothing: the trace of states and the ticks it took
   (the last tick that changed anything); max ticks without settling is an oscillation */
function settle(C,v0,ins,max){
  const lim=max||400; let v=force(C,Uint8Array.from(v0),ins); const trace=[v];
  for(let t=1;t<=lim;t++){ const nv=tick(C,v,ins); if(same(nv,v)) return {trace,ticks:t-1,osc:false,v}; trace.push(nv); v=nv; }
  return {trace,ticks:lim,osc:true,v};
}
const val=(C,v,n)=>v[C.idx[n]];
/* the settled state of a combinational circuit for given inputs, from the all-zero start */
function settled(C,ins){ return settle(C,startState(C),ins).v; }
/* a number's bits, low first, and back */
function bitsOf(x,n){ const b=[]; for(let i=0;i<n;i++) b.push((x>>i)&1); return b; }
function numOf(C,v,pfx,n){ let x=0; for(let i=0;i<n;i++) x|=val(C,v,pfx+i)<<i; return x; }
function busIns(pfx,x,n){ const o={}; bitsOf(x,n).forEach((b,i)=>o[pfx+i]=b); return o; }

/* ---------------- 1. the gates, alone and from NANDs only ---------------- */
const GATES=['NOT','AND','OR','NAND','NOR','XOR','XNOR'];
const ARITY={NOT:1,BUF:1};
function oneGate(t){ const C=circuit(t); input(C,'A',0,ARITY[t]?0:-0.5); if(!ARITY[t]) input(C,'B',0,0.5);
  gate(C,t,ARITY[t]?['A']:['A','B'],'Y',1.5,0); output(C,'Y',3,0); return C; }
/* the same function from 2-input NANDs only (NAND is universal); x, y place each NAND for the drawing */
function nandOnly(t){
  const C=circuit(t+' from NANDs'); input(C,'A',0,-0.6); if(!ARITY[t]) input(C,'B',0,0.6);
  const N=(a,b,o,x,y)=>gate(C,'NAND',[a,b],o,x,y);
  if(t==='NOT') N('A','A','Y',1.5,-0.6);
  else if(t==='NAND') N('A','B','Y',1.5,0);
  else if(t==='AND'){ N('A','B','n',1.5,0); N('n','n','Y',3,0); }
  else if(t==='OR'){ N('A','A','na',1.5,-0.6); N('B','B','nb',1.5,0.6); N('na','nb','Y',3,0); }
  else if(t==='NOR'){ N('A','A','na',1.5,-0.6); N('B','B','nb',1.5,0.6); N('na','nb','o',3,0); N('o','o','Y',4.5,0); }
  else if(t==='XOR'){ N('A','B','n',1.5,0); N('A','n','p',3,-0.6); N('B','n','q',3,0.6); N('p','q','Y',4.5,0); }
  else if(t==='XNOR'){ N('A','B','n',1.5,0); N('A','n','p',3,-0.6); N('B','n','q',3,0.6); N('p','q','x',4.5,0); N('x','x','Y',6,0); }
  else throw new Error('no NAND form for '+t);
  const xs=C.gates.map(g=>g.x); output(C,'Y',Math.max(...xs)+1.5,C.gates[C.gates.length-1].y);
  return C;
}
/* the function's truth table: rows of [inputs..., output] */
function truthTable(t){ const n=ARITY[t]?1:2, rows=[]; for(let k=0;k<(1<<n);k++){ const ins=bitsOf(k,n).reverse(); rows.push([...ins,evalGate(t,ins)]); } return rows; }

/* ---------------- 2. switches ---------------- */
/* a switch network: a switch closed when its input is 1 (an nMOS, a relay contact) or 0 (a pMOS), in series or in
   parallel.  Shannon (1938): series is AND, parallel is OR. */
const SW=(inp,p)=>({k:'sw',inp,p:!!p}), SER=(...ch)=>({k:'ser',ch}), PAR=(...ch)=>({k:'par',ch});
function closed(sw,vals){ const x=vals[sw.inp]; return sw.p?x===0:x===1; }
function conducts(nw,vals){ if(nw.k==='sw') return closed(nw,vals); if(nw.k==='ser') return nw.ch.every(c=>conducts(c,vals)); return nw.ch.some(c=>conducts(c,vals)); }
function countSw(nw){ return nw.k==='sw'?1:nw.ch.reduce((a,c)=>a+countSw(c),0); }
/* static CMOS: a pull-up of pMOS to the supply and a pull-down of nMOS to ground, each the other's dual */
const CMOS={
  NOT:{ins:['A'],up:SW('A',1),down:SW('A')},
  NAND:{ins:['A','B'],up:PAR(SW('A',1),SW('B',1)),down:SER(SW('A'),SW('B'))},
  NOR:{ins:['A','B'],up:SER(SW('A',1),SW('B',1)),down:PAR(SW('A'),SW('B'))}};
/* the output of a static CMOS gate: 1 through the pull-up, 0 through the pull-down; both on is a short, neither a float */
function cmosOut(g,vals){ const u=conducts(g.up,vals), d=conducts(g.down,vals); return u&&!d?1:d&&!u?0:u&&d?'short':'float'; }
/* the transmission gate: an nMOS and a pMOS side by side, driven by EN and its complement: a switch that passes D both
   ways when EN = 1.  Off, the node keeps the charge it had (memory, until it leaks: leakage is not modelled). */
function tgate(en,d,held){ return en?d:held; }

/* ---------------- 3. memory ---------------- */
/* the SR latch: two NORs, each one's output fed back to the other's input */
function srLatch(){ const C=circuit('SR latch (NOR)'); input(C,'S',0,1); input(C,'R',0,-1);
  /* each feedback enters the pin nearer the other gate, so the two loops cross once, in the classic X */
  gate(C,'NOR',['R','QB'],'Q',2.2,-0.8); gate(C,'NOR',['Q','S'],'QB',2.2,0.8);
  output(C,'Q',4,-0.8); output(C,'QB',4,0.8); C.init={Q:0,QB:1}; return C; }
/* a gated D latch from NANDs: EN opens the gate, D sets or resets the SR pair inside */
function addDLatch(C,p,D,EN,Q,QB,x,y){
  gate(C,'NOT',[D],p+'nd',x,y+0.9);
  gate(C,'NAND',[D,EN],p+'s',x+1.4,y-0.8); gate(C,'NAND',[p+'nd',EN],p+'r',x+1.4,y+0.8);
  gate(C,'NAND',[p+'s',QB],Q,x+2.9,y-0.8); gate(C,'NAND',[Q,p+'r'],QB,x+2.9,y+0.8);
  C.init[Q]=0; C.init[QB]=1; C.init[p+'nd']=1; C.init[p+'s']=1; C.init[p+'r']=1;
}
function dLatch(){ const C=circuit('gated D latch'); input(C,'D',0,-0.8); input(C,'EN',0,0.4);
  addDLatch(C,'',  'D','EN','Q','QB',1.2,0); output(C,'Q',5.6,-0.8); output(C,'QB',5.6,0.8); return C; }
/* the master–slave D flip-flop: a master latch open while CLK = 0, a slave open while CLK = 1; Q takes D at the
   rising edge.  The master's enable is CLK through one inverter. */
function addDFF(C,p,D,CLK,Q,QB,x,y,nclk){
  const nc=nclk||(gate(C,'NOT',[CLK],p+'nclk',x,y+2.2),p+'nclk'); if(!nclk) C.init[nc]=1;
  addDLatch(C,p+'m.',D,nc,p+'mq',p+'mqb',x+0.6,y);
  addDLatch(C,p+'s.',p+'mq',CLK,Q,QB,x+5.0,y);
}
function dFlipFlop(){ const C=circuit('D flip-flop'); input(C,'D',0,-0.8); input(C,'CLK',0,1.6);
  addDFF(C,'','D','CLK','Q','QB',0.6,0); output(C,'Q',10.0,-0.8); output(C,'QB',10.0,0.8); return C; }

/* ---------------- 4. adding ---------------- */
function addHalfAdder(C,p,a,b,s,c,x,y){ gate(C,'XOR',[a,b],s,x,y-0.5); gate(C,'AND',[a,b],c,x,y+0.5); }
/* a full adder: s = a ⊕ b ⊕ cin, cout = ab + cin(a ⊕ b), five gates; the carry passes two of them */
function addFullAdder(C,p,a,b,cin,s,cout,x,y){
  gate(C,'XOR',[a,b],p+'x',x,y-0.9); gate(C,'XOR',[p+'x',cin],s,x+1.6,y-0.6);
  gate(C,'AND',[a,b],p+'g',x,y+0.9); gate(C,'AND',[p+'x',cin],p+'t',x+1.6,y+0.5);
  gate(C,'OR',[p+'g',p+'t'],cout,x+3.0,y+0.7);
}
function halfAdder(){ const C=circuit('half adder'); input(C,'A',0,-0.5); input(C,'B',0,0.5); addHalfAdder(C,'','A','B','S','C',1.6,0);
  output(C,'S',3.2,-0.5); output(C,'C',3.2,0.5); return C; }
function fullAdder(){ const C=circuit('full adder'); input(C,'A',0,-0.9); input(C,'B',0,-0.1); input(C,'Cin',0,0.9);
  addFullAdder(C,'','A','B','Cin','S','Cout',1.4,0); output(C,'S',5.6,-0.6); output(C,'Cout',5.6,0.7); return C; }
/* n full adders in a chain: bit i's carry out is bit i+1's carry in */
function rippleAdder(n){ const C=circuit(n+'-bit ripple adder');
  for(let i=0;i<n;i++){ input(C,'A'+i,0,i); input(C,'B'+i,0,i); }
  input(C,'C0',0,0);
  for(let i=0;i<n;i++) addFullAdder(C,'fa'+i+'.','A'+i,'B'+i,'C'+i,'S'+i,'C'+(i+1),0,i);
  for(let i=0;i<n;i++) output(C,'S'+i,0,i); output(C,'C'+n,0,n); C.n=n; return C; }

/* ---------------- 5. subtracting ---------------- */
/* a half subtractor: d = a ⊕ b, borrow = ¬a·b */
function addHalfSub(C,p,a,b,d,bo,x,y){ gate(C,'XOR',[a,b],d,x+1.2,y-0.5); gate(C,'NOT',[a],p+'na',x,y+0.3); gate(C,'AND',[p+'na',b],bo,x+1.2,y+0.6); }
/* a full subtractor: d = a ⊕ b ⊕ bin, bout = ¬a·b + bin·¬(a ⊕ b) */
function addFullSub(C,p,a,b,bin,d,bout,x,y){
  gate(C,'XOR',[a,b],p+'x',x,y-0.9); gate(C,'XOR',[p+'x',bin],d,x+1.6,y-0.6);
  gate(C,'NOT',[a],p+'na',x,y+0.2); gate(C,'AND',[p+'na',b],p+'g',x+1.6,y+0.4);
  gate(C,'NOT',[p+'x'],p+'nx',x+1.6,y+1.3); gate(C,'AND',[p+'nx',bin],p+'t',x+3.0,y+1.2);
  gate(C,'OR',[p+'g',p+'t'],bout,x+4.4,y+0.8);
}
function halfSub(){ const C=circuit('half subtractor'); input(C,'A',0,-0.5); input(C,'B',0,0.6); addHalfSub(C,'','A','B','D','Bo',1.2,0);
  output(C,'D',4,-0.5); output(C,'Bo',4,0.6); return C; }
function fullSub(){ const C=circuit('full subtractor'); input(C,'A',0,-0.9); input(C,'B',0,-0.1); input(C,'Bin',0,1.2);
  addFullSub(C,'','A','B','Bin','D','Bout',1.4,0); output(C,'D',7,-0.6); output(C,'Bout',7,0.8); return C; }
function rippleSub(n){ const C=circuit(n+'-bit ripple subtractor');
  for(let i=0;i<n;i++){ input(C,'A'+i,0,i); input(C,'B'+i,0,i); }
  input(C,'W0',0,0);
  for(let i=0;i<n;i++) addFullSub(C,'fs'+i+'.','A'+i,'B'+i,'W'+i,'D'+i,'W'+(i+1),0,i);
  for(let i=0;i<n;i++) output(C,'D'+i,0,i); output(C,'W'+n,0,n); C.n=n; return C; }
/* the adder as a subtractor: B through XORs with SUB, and SUB as the carry in: A + ¬B + 1 = A − B (mod 2ⁿ).
   V, the signed overflow, is the XOR of the last two carries. */
function addSubUnit(n){ const C=circuit(n+'-bit adder–subtractor');
  for(let i=0;i<n;i++){ input(C,'A'+i,0,i); input(C,'B'+i,0,i); }
  input(C,'SUB',0,0);
  gate(C,'BUF',['SUB'],'C0',0,0);
  for(let i=0;i<n;i++){ gate(C,'XOR',['B'+i,'SUB'],'b'+i,0,i); addFullAdder(C,'fa'+i+'.','A'+i,'b'+i,'C'+i,'S'+i,'C'+(i+1),0,i); }
  gate(C,'XOR',['C'+n,'C'+(n-1)],'V',0,n);
  for(let i=0;i<n;i++) output(C,'S'+i,0,i); output(C,'C'+n,0,n); output(C,'V',0,n); C.n=n; return C; }
const signedOf=(x,n)=>x>=(1<<(n-1))?x-(1<<n):x;

/* ---------------- 6. the accumulator: a register of D flip-flops and an adder ---------------- */
function accumulator(n){ const C=circuit(n+'-bit accumulator'); input(C,'CLK',0,0);
  for(let i=0;i<n;i++) input(C,'X'+i,0,i);
  gate(C,'NOT',['CLK'],'nclk',0,0); C.init.nclk=1;
  input(C,'Z',0,0);                                           /* a held 0 for the first carry in */
  for(let i=0;i<n;i++) addFullAdder(C,'fa'+i+'.','R'+i,'X'+i,i===0?'Z':'c'+i,'s'+i,'c'+(i+1),0,i);
  for(let i=0;i<n;i++) addDFF(C,'ff'+i+'.','s'+i,'CLK','R'+i,'RB'+i,0,i,'nclk');
  C.n=n; return C; }
/* clearing the register (an asynchronous clear the drawing does not show): every latch holding 0, the adder settled */
function accClear(C,ins){ const v=startState(C); for(let i=0;i<C.n;i++){ for(const p of ['ff'+i+'.m.','ff'+i+'.s.']){ v[C.idx[p+'nd']]=1; v[C.idx[p+'s']]=1; v[C.idx[p+'r']]=1; } }
  return settle(C,v,ins).v; }
/* run the clock: P ticks a period (CLK low for the first half, high for the second); the register read just
   before each rising edge.  Returns the readings and every tick's state for the timing diagram. */
function accRun(C,X,P,cycles,v0){
  const n=C.n, half=Math.floor(P/2), ins=Object.assign({CLK:0,Z:0},busIns('X',X,n));
  let v=v0||accClear(C,ins); const reads=[], states=[], clk=[];
  for(let k=0;k<cycles;k++) for(let t=0;t<P;t++){
    ins.CLK=t<half?0:1; if(t===half) reads.push(numOf(C,v,'R',n));
    v=tick(C,v,ins); states.push(v); clk.push(ins.CLK); }
  /* no reading after the last cycle: it would fall mid-transient, while the slave is still passing the new value */
  return {reads,states,clk,v};
}
/* the shortest clock period at which every add lands (the readings at the rising edges go up by X each cycle,
   mod 2ⁿ), for this X, over two full counts; pass and fail are monotone in P (checked for n = 2 to 6) */
function accMinPeriod(n,X,cycles){ const C=accumulator(n), m=1<<n;
  for(let P=2;P<=200;P+=2){ const r=accRun(C,X,P,cycles||(2*m+2)).reads; let good=true;
    for(let k=1;k<r.length;k++) if(r[k]!==(r[0]+k*X)%m){ good=false; break; }
    if(good) return P; }
  return NaN;
}

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
/* the numbers' ranges follow the bit counts */
function clampNums(st){ const ma=(1<<st.aN)-1, ms=(1<<st.sN)-1, mc=(1<<st.cN)-1;
  st.aA=clamp(Math.round(st.aA),0,ma); st.aB=clamp(Math.round(st.aB),0,ma); st.aBit=clamp(Math.round(st.aBit),0,st.aN-1);
  st.sA=clamp(Math.round(st.sA),0,ms); st.sB=clamp(Math.round(st.sB),0,ms); st.cX=clamp(Math.round(st.cX),0,mc); }

/* ---- the live circuits: each view's circuit and its current state, stepped one gate delay at a time ---- */
const LIVE={};
const SIM={t:0, acc:{}};
const FRAME=1/60;
function simReset(){ SIM.t=0; SIM.acc={}; for(const k in LIVE) delete LIVE[k]; }
/* each view's circuits and their inputs from the state */
function viewCircuits(st){
  const v=st.view;

  if(v==='memory'){ const mk=st.mC==='sr'?srLatch:st.mC==='dlatch'?dLatch:dFlipFlop;
    return {key:'m'+st.mC, mk:()=>[mk()], ins:()=>[st.mC==='sr'?{S:st.mS,R:st.mR}:st.mC==='dlatch'?{D:st.mD,EN:st.mEN}:{D:st.mD,CLK:memClock(st)}]}; }
  if(v==='adder'){ const C=st.aMode==='half'?'h':st.aMode==='full'?'f':'r'+st.aN;
    return {key:'a'+C, mk:()=>[st.aMode==='half'?halfAdder():st.aMode==='full'?fullAdder():rippleAdder(st.aN)], ins:()=>[adderIns(st)]}; }
  if(v==='sub'){ const C=st.sMode==='half'?'h':st.sMode==='full'?'f':st.sMode==='ripple'?'r'+st.sN:'t'+st.sN;
    return {key:'s'+C, mk:()=>[st.sMode==='half'?halfSub():st.sMode==='full'?fullSub():st.sMode==='ripple'?rippleSub(st.sN):addSubUnit(st.sN)], ins:()=>[subIns(st)]}; }
  if(v==='acc') return {key:'c'+st.cN, mk:()=>[accumulator(st.cN)], ins:()=>{ const L=LIVE.acc;
    return [Object.assign({CLK:accClock(st),Z:0},busIns('X',L&&st.cRun?L.Xcur:st.cX,st.cN))]; }};
  return null;
}
function adderIns(st){ if(st.aMode==='half') return {A:st.aA&1,B:st.aB&1}; if(st.aMode==='full') return {A:st.aA&1,B:st.aB&1,Cin:st.aC};
  return Object.assign(busIns('A',st.aA,st.aN),busIns('B',st.aB,st.aN),{C0:st.aC}); }
function subIns(st){ if(st.sMode==='half') return {A:st.sA&1,B:st.sB&1}; if(st.sMode==='full') return {A:st.sA&1,B:st.sB&1,Bin:st.sW};
  if(st.sMode==='ripple') return Object.assign(busIns('A',st.sA,st.sN),busIns('B',st.sB,st.sN),{W0:st.sW});
  return Object.assign(busIns('A',st.sA,st.sN),busIns('B',st.sB,st.sN),{SUB:st.sSub}); }
/* the clocks: low for the first half of each period, counted in gate delays since the view's circuit was made */
function memClock(st){ if(st.mC!=='dff') return 0; if(!st.mRun) return st.mClk; const L=LIVE.memory; const t=L?L.ticks:0; return (t%st.mP)>=st.mP/2?1:0; }
/* the accumulator's clock keeps its own phase: a new period starts at a cycle boundary, never mid-cycle (a cycle
   cut short catches the master latch half-way; see X below) */
function accClock(st){ const L=LIVE.acc; if(!L) return 0; return (L.phase>=L.Pcur/2)?1:0; }
/* the live record of a view: made settled (from the circuit's start state) the first time, then stepped */
function ensureLive(st){
  const vc=viewCircuits(st); if(!vc) return null;
  let L=LIVE[st.view];
  if(!L||L.key!==vc.key){
    const Cs=vc.mk(), ins=vc.ins();
    const vs=Cs.map((C,i)=>st.view==='acc'?accClear(C,ins[i]):settle(C,startState(C),ins[i]).v);
    /* the timing diagram starts full of the settled state, so a still circuit shows its levels, not nothing */
    const hist=[]; for(let k=0;k<40;k++) hist.push({v:vs[0],ins:ins[0]});
    L=LIVE[st.view]={key:vc.key,Cs,vs,ticks:0,since:0,hist,prev:vs.map(v=>Uint8Array.from(v)),ins};
    if(st.view==='acc'){ L.reads=[]; L.expect=null; L.phase=0; L.Pcur=st.cP; L.Xcur=st.cX; L.eq=new Array(st.cN).fill(0); L.caught=false; }
  }
  return L;
}
/* one gate delay for the view's circuits; the history keeps the last 96 states for the timing diagrams */
function liveTick(st){
  const L=ensureLive(st); if(!L) return false;
  const vc=viewCircuits(st), ins=vc.ins();
  const before=L.vs;
  if(st.view==='acc'){ const half=Math.floor(L.Pcur/2);
    if(L.phase===half){ const r=numOf(L.Cs[0],L.vs[0],'R',st.cN); L.reads.push(r); if(L.reads.length>64) L.reads.shift();
      L.expect=L.expect===null?r:(L.expect+L.Xcur)%(1<<st.cN); L.lastRead=r; } }
  /* the inputs reach their wires at once (as settle() has it), and the gates answer one delay later */
  L.vs=L.Cs.map((C,i)=>tick(C,force(C,Uint8Array.from(L.vs[i]),ins[i]),ins[i]));
  L.ticks++; L.since++;
  if(st.view==='acc'){ const C=L.Cs[0], v=L.vs[0];
    /* X is taken as if from a register on the same clock: two delays after a rising edge, when the master has closed.
       A new X changed at any moment could reach the master while it captures, and in this model of equal delays a
       latch caught half-way rings for ever (metastability; a real one resolves, after a random time) */
    L.phase++;
    if(L.phase===Math.floor(L.Pcur/2)+2&&L.Xcur!==st.cX){ L.Xcur=st.cX; L.reads=[]; L.expect=null; }
    if(L.phase>=L.Pcur){ L.phase=0; if(L.Pcur!==st.cP){ L.Pcur=st.cP; L.reads=[]; L.expect=null; } }
    if(!st.cRun) L.Xcur=st.cX;
    /* a bit whose Q and Q̄ agree for 4 delays running is caught: the period-2 ring */
    for(let i=0;i<st.cN;i++){ L.eq[i]=val(C,v,'R'+i)===val(C,v,'RB'+i)?L.eq[i]+1:0; if(L.eq[i]>=4) L.caught=true; } }
  const changed=L.vs.some((v,i)=>!same(v,before[i]));

}
/* a change of inputs: the circuit is not re-settled; the next delays carry it through (since counts them) */
function inputsChanged(){ const L=LIVE[ST.view]; if(L&&L.vs){ L.since=0; L.prev=L.vs.map(v=>Uint8Array.from(v)); } }
/* does the view still move?  a combinational view until it settles; memory while its clock runs or it has not
   settled; the accumulator while its clock runs */
function pending(st){
  const L=ensureLive(st); if(!L) return false;
  if(st.view==='memory'&&st.mC==='dff'&&st.mRun) return true;
  if(st.view==='acc') return st.cRun;

  return L.Cs.some((C,i)=>!same(tick(C,L.vs[i],ins[i]),L.vs[i]));
}
const SPD_KEY={gates:'gSpd',memory:'mSpd',adder:'aSpd',sub:'sSpd',acc:'cSpd'};
function viewAnimates(st){ return !!SPD_KEY[st.view]&&pending(st); }
/* the frame clock: gate delays at the view's rate (delays per second) */
function runStep(st){

  SIM.acc[k]=(SIM.acc[k]||0)+FRAME*rate; let moved=false;

}
/* settle the view's live circuits at once (the headless tests and the "skip" button) */
function liveSettle(st,max){ let n=0; while(n<(max||400)&&pending(st)){ liveTick(st); n++; } return n; }

/* ================================================================== */
/*  the view models                                                    */
/* ================================================================== */
function gatesView(st){ const L=ensureLive(st), [C,N]=L.Cs, [v,w]=L.vs;
  const ins=ARITY[st.gT]?[st.gA]:[st.gA,st.gB], y=evalGate(st.gT,ins);
  /* how many delays the NAND form takes from the previous inputs to these */
  const sN=settle(N,L.prev[1],{A:st.gA,B:st.gB});
  return {t:st.gT,C,N,v,w,ins,y,shown:val(C,v,'Y'),shownN:val(N,w,'Y'),rows:truthTable(st.gT),nands:N.gates.length,delays:sN.ticks,since:L.since}; }
function switchView(st){ const g=CMOS[st.wT], vals={A:st.wA,B:st.wB};
  const up=conducts(g.up,vals), down=conducts(g.down,vals), out=cmosOut(g,vals);
  const rows=[]; const n=g.ins.length; for(let k=0;k<(1<<n);k++){ const b=bitsOf(k,n).reverse(), vv=n===1?{A:b[0]}:{A:b[0],B:b[1]};
    rows.push({ins:b,up:conducts(g.up,vv),down:conducts(g.down,vv),out:cmosOut(g,vv)}); }

  const ins=viewCircuits(st).ins()[0];
  const q=val(C,v,'Q'), qb=val(C,v,'QB');

  const seen=tr.trace.map(s=>m==='half'?val(C,s,'S')+2*val(C,s,'C'):m==='full'?val(C,s,'S')+2*val(C,s,'Cout'):numOf(C,s,'S',n)+(val(C,s,'C'+n)<<n));

function subView(st){ const L=ensureLive(st), C=L.Cs[0], v=L.vs[0], m=st.sMode;
  const n=(m==='half'||m==='full')?1:st.sN, M=1<<n, A=n===1?st.sA&1:st.sA, B=n===1?st.sB&1:st.sB, w=m==='half'?0:m==='twos'?0:st.sW;

  if(m==='half'){ diff=val(C,v,'D'); flag=val(C,v,'Bo'); wantDiff=(A-B+2)%2; wantFlag=A<B?1:0; }
  else if(m==='full'){ diff=val(C,v,'D'); flag=val(C,v,'Bout'); wantDiff=((A-B-w)%2+2)%2; wantFlag=A-B-w<0?1:0; }
  else if(m==='ripple'){ diff=numOf(C,v,'D',n); flag=val(C,v,'W'+n); wantDiff=((A-B-w)%M+M)%M; wantFlag=A-B-w<0?1:0; }
  else { diff=numOf(C,v,'S',n); flag=val(C,v,'C'+n); V=val(C,v,'V');

          sA:signedOf(A,n),sB:signedOf(B,n),sD:signedOf(diff,n)}; }
function accView(st){ const L=ensureLive(st), C=L.Cs[0], v=L.vs[0], n=st.cN, M=1<<n;

    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }

function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }

  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);

}

/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,

let LABELS=[], DRAW_SEQ=0;

  return true;

/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed

   never shifted 16 or 32 px off it */

function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;

    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }

  for(const n of C.inputs){ const p=C.place[n], cx=X(p[0]), cy=Y(p[1]), r=clamp(u*0.17,7,13), on=v[C.idx[n]];
    ctx.fillStyle=on?'rgba(184,236,76,0.22)':'#10131b'; ctx.fillRect(cx-r,cy-r,2*r,2*r);
    ctx.strokeStyle=on?COL.one:'#5a6378'; ctx.lineWidth=1.4; ctx.strokeRect(cx-r,cy-r,2*r,2*r);
    ctx.fillStyle=on?COL.one:'#8b93a6'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(on),cx,cy);
    lab(ctx,W,H,cx-r-4,cy,(o.rename&&o.rename[n])||n,'#aeb6c6',LAB_FONT,'right','middle',PLATE_FIX);
    const tg=o.toggles&&o.toggles[n];   /* a state key flipped whole, or {key, bit}: one bit of a number */
    if(tg) HIT.push(typeof tg==='string'?{kind:'toggle',key:tg,b:box(cx-r-2,cy-r-2,2*r+4,2*r+4)}:{kind:'bit',key:tg.key,bit:tg.bit,b:box(cx-r-2,cy-r-2,2*r+4,2*r+4)}); }

    lab(ctx,W,H,cx+r+5,cy,((o.rename&&o.rename[n])||n)+' = '+on,on?COL.one:'#aeb6c6',LAB_FONT,'left','middle',PLATE_FIX); }

/* a switch network between (cx, y) and (cx, y + h) in a cell w wide: series stacked, parallel side by side */

function drawNet(ctx,W,H,nw,x,y,w,h,vals,names){

    sLine(ctx,[[cx,y],[cx,a]],col,1.8); sLine(ctx,[[cx,c],[cx,y+h]],col,1.8);

    nw.ch.forEach((c,i)=>{ const hh=h*sz[i][1]/tot; drawNet(ctx,W,H,c,x,yy,w,hh,vals,names); yy+=hh; }); return; }
  const tot=sz.reduce((a,q)=>a+q[0],0); let xx=x; const cs=[];
  nw.ch.forEach((c,i)=>{ const ww=w*sz[i][0]/tot; cs.push(xx+ww/2); drawNet(ctx,W,H,c,xx,y+10,ww,h-20,vals,names); xx+=ww; });

/* a timing diagram: rows of 0/1 traces (or numbers, bus:true) over the history, the newest at the right */
function drawTiming(ctx,W,H,b,rows,hist,title){

  rows.forEach((r,j)=>{ const yt=b.y+j*rh+rh*0.25, yb=b.y+(j+1)*rh-rh*0.25;
    lab(ctx,W,H,b.x-6,(yt+yb)/2,r.lab,'#aeb6c6',SM_FONT,'right','middle',PLATE_FIX);
    if(!hist.length) return;
    if(r.bus){ let start=0;
      for(let i=1;i<=hist.length;i++){ if(i<hist.length&&r.f(hist[i])===r.f(hist[start])) continue;
        const xa=x0+start*dx, xb=x0+i*dx, val0=r.f(hist[start]);

        if(xb-xa>22) lab(ctx,W,H,(xa+xb)/2,(yt+yb)/2,String(val0),r.col||COL.struct,SM_FONT,'center','middle',PLATE_FIX);

/* a sum read too early: the value on the output bits after each gate delay since the inputs changed */

/* ---------------- 3. memory ---------------- */
const MEM_ROWS={
  sr:{head:['S','R','Q next'],rows:[['0','0','Q (holds)'],['0','1','0'],['1','0','1'],['1','1','forbidden']],row:(i)=>i.S*2+i.R},
  dlatch:{head:['EN','D','Q next'],rows:[['0','0','Q (holds)'],['0','1','Q (holds)'],['1','0','0'],['1','1','1']],row:(i)=>i.EN*2+i.D},
  dff:{head:['CLK','D','Q next'],rows:[['rising','0','0'],['rising','1','1'],['otherwise','x','Q (holds)']],row:(i)=>-1}};
function memoryCaption(Mm,which){
  const head=Mm.kind==='sr'?'Feed two gates’ outputs back into each other and the pair can hold a bit: S sets Q to 1, R resets it to 0, and with both at 0 it keeps what it was. Press S, R. ':
    Mm.kind==='dlatch'?'Put two gates in front of the SR pair and EN becomes a gate on the memory: while EN is 1, Q follows D; when EN drops, Q holds the last D. Press D, EN. ':
    'Two latches, the second open only while CLK is 1 and the first only while it is 0: Q takes D at the clock’s rising edge and at no other time. This is a flip-flop, the bit of a register. ';
  if(which==='short') return head;
  return head+'Below, the signals against time (each step a gate delay), and the table of what Q does next.'+(Mm.kind==='sr'?' Set both and release them together: with equal delays the pair oscillates for ever, which is why S = R = 1 is forbidden.':'');
}
function drawMemory(ctx,W,H,M){
  const Mm=M.Mm, Lay=stageLayout(ctx,W,H,memoryCaption(Mm,'full'),memoryCaption(Mm,'short'),2,0.36,nbNarrow(H));

  const tg=Mm.kind==='sr'?{S:'mS',R:'mR'}:Mm.kind==='dlatch'?{D:'mD',EN:'mEN'}:(ST.mRun?{D:'mD'}:{D:'mD',CLK:'mClk'});

    drawTiming(ctx,W,H,Lay.bottom[0],rows.map(([l,n])=>({lab:l,f:h=>h.v[C.idx[n]],col:n==='CLK'?COL.struct:n.charAt(0)==='Q'?COL.one:COL.ref})),Mm.hist,titleFor(Lay.bottom[0],'the signals, one step a gate delay','signals')); }
  if(Lay.bottom[1]){ const T=MEM_ROWS[Mm.kind]; drawTable(ctx,W,H,Lay.bottom[1],T.head,T.rows,T.row(Mm.ins),'what Q does next'); }

/* ---------------- 4. the adder ---------------- */
/* "an 8-bit", "an 11-bit", "a 4-bit"; a negative with a true minus */

/* the full adder template's nets, as bit i of a ripple adder names them */

const FA_T=fullAdder(), FS_T=fullSub();
function adderCaption(A,which){

  if(which==='short') return head;

function drawAdder(ctx,W,H,M){

      drawTable(ctx,W,H,Lay.bottom[0],A.mode==='half'?['A','B','S','C']:['A','B','Cin','S','Cout'],rows,A.mode==='half'?A.A*2+A.B:A.A*4+A.B*2+A.c,'the '+A.mode+' adder’s table'); }

/* ---------------- 5. the subtractor ---------------- */
function subCaption(S,which){
  const head=S.mode==='half'?'A half subtractor takes B from A: the difference is again their XOR, and A − B needs a borrow when A is 0 and B is 1. ':
    S.mode==='full'?'A full subtractor also pays a borrow in: d = A ⊕ B ⊕ W, and it borrows when ¬A·B or when the borrow in meets equal bits. ':
    S.mode==='ripple'?'Chain full subtractors and the borrow ripples left as the carry did: A − B for n bits, with a borrow out when B is the larger. ':
    'No subtractor is needed: in two’s complement −B = ¬B + 1, so XOR gates flip B when SUB is 1 and SUB is also the carry in. The same adder then subtracts; its carry out is 1 when no borrow was needed, and V flags a signed result that does not fit. ';
  if(which==='short') return head;
  return head+'Lower right, the result on the outputs after each gate delay since the last change.';
}

      box:i=>'FA'+subN(i), ins:i=>[{v:V('A'+i),name:'A',hit:'sA'},{v:V('b'+i),name:'B ⊕ SUB',hit:null}], out:i=>V('S'+i), outName:'S', chain:i=>V('C'+i), chainName:'C'});
    /* below the chain: B's own bits (where there is room), the SUB switch and the V lamp */

    const sx=b.x1-150; HIT.push({kind:'toggle',key:'sSub',b:box(sx-12,sy-12,24,24)});
    dot(ctx,sx,sy,10,S.sub?COL.one:'#1a1f2c',S.sub?'#e8ffb0':'#5a6378',1.3); lab(ctx,W,H,sx-16,sy,'SUB = '+S.sub,S.sub?COL.one:'#aeb6c6',LAB_FONT,'right','middle',PLATE_FIX);
    dot(ctx,b.x1-40,sy,10,S.V?COL.ref:'#1a1f2c',S.V?'#ffd0a0':'#5a6378',1.3); lab(ctx,W,H,b.x1-56,sy,'V = '+S.V,S.V?COL.ref:'#aeb6c6',LAB_FONT,'right','middle',PLATE_FIX);

    drawCircuit(ctx,W,H,box(b.x+40,b.y+8,b.w-130,b.h-16),C,v,{toggles:{A:{key:'sA',bit:0},B:{key:'sB',bit:0},Bin:'sW'},maxU:76});
  }

      drawCircuit(ctx,W,H,box(bb.x+30,bb.y+6,bb.w-90,bb.h-12),T,mappedState(T,C,v,map),{maxU:44}); } }

}

/* ---------------- 6. the accumulator ---------------- */
function accCaption(Ac,which){
  const head='Put a register of '+Ac.n+' D flip-flops after an adder and feed it back: at every rising clock edge the register takes its own value plus X. With X = 1 it counts. The adder needs time to settle, so the clock may tick no faster than its slowest add: here one period must be at least '+Ac.minP+' gate delays. ';
  if(which==='short') return head;
  return head+'Below, the clock, the register and the adder’s sum against time, and the register at each rising edge'+(Ac.fast?': this clock is too fast, and some adds go wrong.':'.');
}
function drawAcc(ctx,W,H,M){
  const Ac=M.Ac, Lay=stageLayout(ctx,W,H,accCaption(Ac,'full'),accCaption(Ac,'short'),2,0.4,nbNarrow(H));
  drawCaption(ctx,Lay);
  const b=Lay.main, C=Ac.C, v=Ac.v, n=Ac.n, V=nm=>val(C,v,nm);
  drawChain(ctx,W,H,box(b.x,b.y,b.w,b.h-40),n,{title:titleFor(b,'R ← R + X at each rising edge: R = '+Ac.R+', X = '+Ac.X+(Ac.caught?' (a latch is caught, ringing)':Ac.fast?' (the clock is too fast)':''),'the accumulator'),
    box:i=>'FA'+subN(i), ins:i=>[{v:V('R'+i),name:'R'},{v:V('X'+i),name:'X',hit:'cX'}], out:i=>V('s'+i), outName:'s', chain:i=>i===0?0:V('c'+i), chainName:'c'});
  /* the register row: the sum goes into the flip-flops and back up as R */
  const y=b.y1-18; drawBits(ctx,W,H,b.x+90,y,n,Ac.R,'register R',null,n>6&&b.w<520?7:9);
  const clk=Ac.clk, cx=b.x1-60; dot(ctx,cx,y,9,clk?COL.struct:'#1a1f2c',clk?'#d0f6ff':'#5a6378',1.3);
  lab(ctx,W,H,cx-16,y,'CLK = '+clk,clk?COL.struct:'#aeb6c6',LAB_FONT,'right','middle',PLATE_FIX);
  if(Lay.bottom[0]){ const bb=Lay.bottom[0];
    drawTiming(ctx,W,H,bb,[{lab:'CLK',f:h=>h.v[C.idx.CLK],col:COL.struct},{lab:'R',f:h=>numOf(C,h.v,'R',n),bus:true,col:COL.one},{lab:'sum',f:h=>numOf(C,h.v,'s',n),bus:true,col:COL.ref}],
      Ac.hist,titleFor(bb,'the clock, the register and the sum, one step a gate delay','signals')); }
  if(Lay.bottom[1]){ const bb=Lay.bottom[1], r=Ac.reads, M2=1<<n;
    const P=linPlot(ctx,bb,0,Math.max(r.length,8),0,M2,{title:titleFor(bb,'R at each rising edge'+(Ac.ok?'':': a missed add'),'R at the edges'),xlab:'clock edges (latest '+Math.max(r.length,0)+')',ylab:'R',ny:nyFor(bb),xfmt:v=>String(Math.round(v))});
    r.forEach((x,k)=>{ const good=k===0||x===(r[k-1]+Ac.X)%M2; dot(ctx,P.X(k+0.5),P.Y(x),3.6,good?COL.one:COL.ref); }); }
}

/* ================================================================== *
 *  dispatch and the pointer                                           *
 * ================================================================== */
const DRAWERS={gates:drawGates,switch:drawSwitch,memory:drawMemory,adder:drawAdder,sub:drawSub,acc:drawAcc};
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(DRAWERS[M.view]) DRAWERS[M.view](ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  S.pointer=function(type,x,y){
    if(type!=='down') return false;
    const h=hitAt(x,y); if(!h) return false;
    if(h.kind==='toggle'){ ST[h.key]=ST[h.key]?0:1; inputsChanged(); return true; }
    if(h.kind==='bit'){ ST[h.key]=ST[h.key]^(1<<h.bit); inputsChanged(); return true; }
    if(h.kind==='pick'){ ST[h.key]=h.val; return true; }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop (build_kardashev lineage) *
 * ================================================================== */
/* the keys that are a circuit's inputs: changing one starts a propagation (the circuit is not re-settled) */
const INPUT_KEYS={gA:1,gB:1,mS:1,mR:1,mD:1,mEN:1,mClk:1,aA:1,aB:1,aC:1,sA:1,sB:1,sW:1,sSub:1,cX:1,cP:1};
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));
  const changed=key=>{ if(INPUT_KEYS[key]) inputsChanged(); };

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val0=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val0);
    const sync=()=>{ inp.value=st[key]; val0.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value); changed(key);   /* buildModel clamps the numbers to the bits */ syncChips(); syncPanel(); refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  const linSlider=(key,step2,lab,fmtf)=>slider(key,lab,LIM[key][0],LIM[key][1],step2,fmtf);
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; changed(key); syncPanel(); refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key){

const SRC_LINE='Shannon, “A symbolic analysis of relay and switching circuits”, Trans. AIEE 57 (12), 713–723 (1938), for switches in series and parallel as AND and OR. Everything else on the page is exact logic: every circuit runs gate by gate in the page, each gate one unit of delay, and build_logic/derive.py, an independent Python gate simulator, checks every truth table, every sum and difference against arithmetic, and every timing the page prints.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const INFO={}, DERIV={};
const PROSE={nands:Object.fromEntries(GATES.map(t=>[t,nandOnly(t).gates.length])),
  cmos:Object.fromEntries(Object.keys(CMOS).map(t=>[t,countSw(CMOS[t].up)+countSw(CMOS[t].down)])),
  fa:fullAdder().gates.length, fs:fullSub().gates.length, ff:dFlipFlop().gates.length, dl:dLatch().gates.length,
  minP4:accMinPeriod(4,1), minP8:accMinPeriod(8,1)};
INFO.gates='A digital circuit works with two values, 0 and 1, and a <b>gate</b> is a fixed rule that turns its inputs into an output. NOT turns a 1 into a 0. AND gives 1 only when both inputs are 1, OR when either is, and XOR when they differ; NAND, NOR and XNOR are the same three with the answer turned over. Each rule is its <b>truth table</b>: one row for every way the inputs can be set. A real gate also takes time to answer, and the page gives every gate the same delay, one step, so you can watch a change travel through a circuit gate by gate. NAND alone is enough to build every other rule: NOT from one ('+PROSE.nands.NOT+'), AND from '+PROSE.nands.AND+', OR from '+PROSE.nands.OR+' by De Morgan’s law, XOR from '+PROSE.nands.XOR+'. That is why a chip can be made from one kind of gate, and why the NAND form, a few gates deep, answers a few delays later.';
DERIV.gates='<h4>the rules</h4>'
  +EQ(1,'¬A, &nbsp; A·B, &nbsp; A + B, &nbsp; A ⊕ B = A·¬B + ¬A·B')
  +'<h4>De Morgan, and NAND for everything</h4>'
  +EQ(2,'¬(A·B) = ¬A + ¬B, &nbsp; ¬(A + B) = ¬A·¬B')
  +'<p>NOT A = NAND(A, A); A·B = NOT(NAND(A, B)); A + B = NAND(¬A, ¬B). XOR takes four: n = NAND(A, B), then NAND(NAND(A, n), NAND(B, n)). The page builds each from NANDs and checks it against the rule for every row.</p>'
  +'<h4>time</h4><p>Every gate reads its inputs as they were one step ago, all at once. A circuit has <b>settled</b> when a step changes nothing; the number of steps it took is its delay for that change.</p>';
INFO.switch='Underneath, a gate is <b>switches</b>. Two switches in series pass current only if both are closed, so a lamp behind them computes AND; in parallel either will do, which is OR. Claude Shannon showed in 1938 that relay circuits obey Boolean algebra, and design became algebra. A chip’s switches are transistors. An nMOS transistor closes when its input is 1, a pMOS when it is 0, and a static CMOS gate puts a network of pMOS between the output and the supply (it pulls the output up to 1) and the dual network of nMOS between the output and ground (it pulls down to 0). For a NAND the pull-down is two nMOS in series and the pull-up two pMOS in parallel: '+PROSE.cmos.NAND+' transistors, and NOT takes '+PROSE.cmos.NOT+'. For every input exactly one network conducts, so the output is always driven and no current flows once it has switched. The <b>transmission gate</b>, an nMOS and a pMOS side by side, is a plain switch for a signal: closed, it passes D; opened, it leaves the node beyond it holding its charge. A switch that can hold a value is the first step to memory.';
DERIV.switch='<h4>switches as logic</h4>'
  +EQ(1,'series: A·B, &nbsp; parallel: A + B, &nbsp; a pMOS: ¬A')
  +'<h4>static CMOS</h4>'
  +EQ(2,'out = 1 ⇔ pull-up conducts, &nbsp; out = 0 ⇔ pull-down conducts')
  +'<p>The pull-down of NAND is A·B in series (it conducts when the output should be 0), the pull-up ¬A + ¬B in parallel, which is the same function’s complement by De Morgan. The page checks for every input row that exactly one of the two conducts.</p>';
INFO.memory='Feed the outputs of two gates back into each other’s inputs and the loop can hold a value: the <b>SR latch</b>. With S = R = 0 each NOR keeps the other where it is, so the pair stays at Q = 1 or at Q = 0, whichever it was put in. S sets it to 1 and R resets it to 0. Asking for both makes Q and Q̄ both 0, and releasing both at once leaves a perfectly balanced loop: with equal delays it oscillates for ever (in a real circuit it hangs and then falls either way, metastability). Put two gates in front of the latch, opened by EN, and you have a <b>gated D latch</b>: while EN is 1 it is transparent and Q follows D; when EN drops it holds the last D ('+PROSE.dl+' gates). Chain two latches opened by opposite halves of a clock, a master and a slave, and D can pass only at the moment the clock rises: an edge-triggered <b>D flip-flop</b> ('+PROSE.ff+' gates here). Flip-flops sampled by one clock are a register, the memory every processor computes in.';
DERIV.memory='<h4>the SR latch</h4>'
  +EQ(1,'Q = ¬(R + Q̄), &nbsp; Q̄ = ¬(S + Q)')
  +'<p>S = R = 0 has two solutions, (Q, Q̄) = (1, 0) and (0, 1): the two stored values. S = 1 forces Q̄ = 0 and then Q = 1. Released from (0, 0) together, both gates see 0 and 0 and both answer 1, then both answer 0: a cycle of two delays.</p>'
  +'<h4>the gated D latch, from NANDs</h4>'
  +EQ(2,'s = ¬(D·EN), &nbsp; r = ¬(¬D·EN), &nbsp; Q = ¬(s·Q̄), &nbsp; Q̄ = ¬(r·Q)')
  +'<h4>master and slave</h4><p>The master is open while CLK is 0 (its enable is CLK through an inverter), the slave while CLK is 1. At the rising edge the master closes on the D it had, and the slave passes that value to Q. The page checks the flip-flop against “Q takes D at each rising edge” over hundreds of random clocked cycles.</p>';
INFO.adder='Adding two bits gives at most 2, written 10: the low bit is the <b>sum</b>, A XOR B, and the high bit the <b>carry</b>, A AND B. That pair of gates is a <b>half adder</b>. Adding a column of a longer number also takes the carry from the column to the right, so a <b>full adder</b> adds three bits: two half adders and an OR, '+PROSE.fa+' gates. Line up n full adders, each carry out feeding the next carry in, and the chain adds two n-bit numbers: a <b>ripple-carry adder</b>. It is correct but slow, because a carry made in the lowest bit may have to pass through every bit above it, two gate delays each. The worst case, from 0 + 0 to 0…01 + 1…11, takes 2n + 1 delays, and until then the outputs show wrong sums that change as the carry goes by. Faster adders work the carries out ahead (carry look-ahead), at the price of more gates.';
DERIV.adder='<h4>a full adder</h4>'
  +EQ(1,'S = A ⊕ B ⊕ C<sub>in</sub>, &nbsp; C<sub>out</sub> = A·B + C<sub>in</sub>·(A ⊕ B)')
  +'<p>A·B <i>generates</i> a carry, A ⊕ B <i>propagates</i> one. The carry in reaches the carry out through one AND and one OR: two delays a bit.</p>'
  +'<h4>the ripple</h4>'
  +EQ(2,'T<sub>worst</sub> = 2n + 1 gate delays')
  +'<p>Bit 0’s carry out is ready after 3 delays (an XOR, then an AND, then the OR); every bit after adds 2. The page and derive.py both find 2n + 1 as the worst over every change of inputs (exhaustively to 4 bits) and at the worst pair to 8 bits.</p>';
INFO.sub='Subtraction has its own circuits. A <b>half subtractor</b> gives A − B in one bit: the difference is again A XOR B, and a <b>borrow</b> is needed when A is 0 and B is 1. A <b>full subtractor</b> also pays a borrow from the column to the right, and a chain of them subtracts n-bit numbers, the borrow rippling as the carry did. But a computer rarely builds one. In <b>two’s complement</b> the negative of B is ¬B + 1 (flip every bit and add one), so A − B = A + ¬B + 1: put an XOR on each bit of B, so that a SUB line flips them, and let SUB be the carry in too. One adder now adds or subtracts. Read as signed numbers, n bits hold −2ⁿ⁻¹ to 2ⁿ⁻¹ − 1, and a result outside that range wraps round: the <b>overflow</b> flag V, the XOR of the last two carries, catches it.';
DERIV.sub='<h4>a full subtractor</h4>'
  +EQ(1,'D = A ⊕ B ⊕ W<sub>in</sub>, &nbsp; W<sub>out</sub> = ¬A·B + W<sub>in</sub>·¬(A ⊕ B)')
  +'<h4>two’s complement</h4>'
  +EQ(2,'−B ≡ 2ⁿ − B = (2ⁿ − 1 − B) + 1 = ¬B + 1 &nbsp;(mod 2ⁿ)')
  +'<p>2ⁿ − 1 is all ones, and subtracting B from it flips every bit. The carry out of A + ¬B + 1 is 1 exactly when A ≥ B. V = C<sub>n</sub> ⊕ C<sub>n−1</sub> is 1 exactly when the true signed answer does not fit in n bits; the page and derive.py check it for every pair of operands up to 5 bits.</p>';
INFO.acc='Put the two together. An adder’s output goes into a register of D flip-flops, and the register’s output comes back to the adder’s input: at every rising edge of the clock the register takes its own value plus X. With X = 1 it is a <b>counter</b>; it wraps from 2ⁿ − 1 to 0. This loop of memory and arithmetic is the heart of a processor. It also shows why a processor has a clock speed. Between two rising edges the new value must leave the flip-flops, ripple through the adder and settle at the master latch’s input before the next edge. Clock it faster and the register catches a half-finished sum. For the 4-bit counter the page finds the shortest safe period to be '+PROSE.minP4+' gate delays; for 8 bits, '+PROSE.minP8+'. Try a period below it and watch adds go wrong. One more thing a real design must respect: the inputs change in step with the clock. Here a new X takes effect two delays after a rising edge, as if it came from another register on the same clock, and a new period starts at the end of a cycle. Changed at an arbitrary moment, X could reach the master latch while it is closing and catch it half-way between 0 and 1. In this model, where every delay is exactly equal, a caught latch then rings for ever, its two outputs flipping together every delay: <b>metastability</b>. A real latch also hangs there, and falls one way or the other after a random time. A clock that is too fast can catch a latch the same way; the page says when one is caught, and clearing the register frees it.';
DERIV.acc='<h4>the loop</h4>'
  +EQ(1,'R<sub>k+1</sub> = R<sub>k</sub> + X &nbsp;(mod 2ⁿ)')
  +'<h4>the clock’s limit</h4>'
  +EQ(2,'T<sub>clock</sub> ≥ T<sub>flip-flop</sub> + T<sub>adder</sub> + T<sub>setup</sub>')
  +'<p>The page does not assume the terms: it runs the circuit gate by gate at each even period from 2 delays up, over two full counts, and takes the shortest at which every reading at a rising edge is the last plus X. derive.py does the same in Python for 2 to 6 bits. Whether a period works does not depend on it beyond that threshold (checked).</p>';

  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];

    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },

    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },

    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},

      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}
