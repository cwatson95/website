<!--
  ===================================================================
  amino_acids.html — the twenty standard amino acids as real 3-D
  molecules, why they are left-handed, how a chain of them folds into
  helices and sheets, which backbone angles are sterically allowed, and
  the genetic code that spells them
  ===================================================================

  Six views.  THE MOLECULE: any of the twenty from the wwPDB Chemical
  Component Dictionary ideal coordinates, ball-and-stick, space-filling
  (Bondi radii) or as sticks, in a camera you can orbit; the formula and
  mass recomputed from the atoms, the stereocentres assigned R or S by a
  CIP ranking, the titration curve and the protonation states against
  pH with the pI.  THE TWENTY: all twenty turning together, grouped by
  side chain, with their Kyte-Doolittle hydropathy and their volume
  against their mass.  CHIRALITY: an amino acid, its mirror image, and
  the dictionary's own D-enantiomer: the mirror superposes on the D form
  (to 0.06 A) and never on the L form (1.2 A); the CIP priorities drawn
  on the centre with the lowest one pointing away; the CORN rule.  THE
  CHAIN: a poly-alanine (or glycine) built atom by atom from phi, psi,
  omega with the backbone geometry measured in crambin at 0.48 A; the
  screw axis, residues per turn, rise, radius and pitch; the backbone
  hydrogen bonds; the alpha, 3-10, pi, beta and polyproline presets.
  THE RAMACHANDRAN MAP: the hard-sphere steric map for alanine and
  glycine, crambin's measured (phi, psi) on it, the tightest contact at
  the cursor; click to send an angle pair to the chain.  THE GENETIC
  CODE: the codon wheel, every single-base neighbour of a codon, the
  synonymous fraction by codon position, and the real code's hydropathy
  error cost against 10,000 shuffled codes.

  WHAT IS MEASURED OR TABULATED (build_aa/data/, fetched 2026-09-17)
  ------------------------------------------------------------------
  wwPDB Chemical Component Dictionary entries for the 20 L amino acids
  and their 19 D enantiomers (atoms, bonds, ideal coordinates, R/S
  labels; DAR and DHI have model coordinates only; the dictionary models
  Arg, Lys and His as side-chain cations).  Crambin, PDB 3NIR at 0.48 A
  (backbone atoms; the H atoms are riding positions from refinement).
  From Wikipedia "Proteinogenic amino acid": average masses, pI, pK1,
  pK2 (free amino acids), side-chain pKa (residues in an Ala
  pentapeptide, Thurlkill et al. 2006; Arg, Pace et al. 2009) and
  residue volumes.  Kyte & Doolittle 1982 hydropathy (ExPASy
  ProtScale).  Bondi 1964 radii (Wikipedia "Van der Waals radius").
  CIAAW abridged standard atomic weights.  NCBI transl_table=1.  The
  helix table (Wikipedia "Protein secondary structure") and the
  (phi, psi) values quoted in "Alpha helix", "Beta sheet" and
  "Polyproline helix".

  WHAT IS COMPUTED HERE AND CHECKED BY build_aa/derive.py
  -------------------------------------------------------
  formulas, masses, CIP ranks and R/S (42 of 42 dictionary labels
  reproduced), mirror superpositions (Horn quaternions here, SVD in the
  twin), pI, crambin's geometry and dihedrals, the NeRF chain, screw
  parameters, the steric map, codon statistics and the seeded shuffles.

  WHAT IS MODELLED
  ----------------
  The steric map is hard spheres at a fraction f of the Bondi sums, with
  f = 0.80 chosen so that every measured crambin angle pair is allowed
  (a calibration, stated on the canvas).  pKa values are independent
  Henderson-Hasselbalch groups from two different compilations, so the
  computed pI need not equal the tabulated one.  The chain has one
  (phi, psi, omega) for every residue and no side chains beyond CB.  The
  error-cost test uses Kyte-Doolittle hydropathy, not the polar
  requirement of the classic studies.  Rotation is a drawing clock.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ',
            /* standard_model.html: the group-theory symbols */
            '&otimes;':'⊗','&oplus;':'⊕','&Xi;':'Ξ','&xi;':'ξ','&psi;':'ψ','&chi;':'χ','&zeta;':'ζ',
            '&partial;':'∂','&sum;':'∑','&nabla;':'∇','&dagger;':'†','&frac14;':'¼','&frac34;':'¾',
            '&sim;':'∼','&isin;':'∈','&bull;':'•','&harr;':'↔','&uarr;':'↑','&darr;':'↓','&Theta;':'Θ',
            '&Psi;':'Ψ','&sup1;':'¹','&lang;':'⟨','&rang;':'⟩','&macr;':'¯',
            /* amino_acids.html */
            '&Aring;':'Å','&ldquo;':'“','&rdquo;':'”','&ucirc;':'û'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;

const DEG=PI/180, RAD=180/PI;
const ZNUM={H:1,C:6,N:7,O:8,S:16};
const AA3=Object.keys(MOL).sort();
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  unit:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); return [a[0]/l,a[1]/l,a[2]/l]; },
};
function dist(a,b){ return V.len(V.sub(a,b)); }
function angleDeg(a,b,c){ const u=V.sub(a,b), w=V.sub(c,b); return Math.acos(clamp(V.dot(u,w)/V.len(u)/V.len(w),-1,1))*RAD; }
/* the IUPAC dihedral a-b-c-d in degrees */
function dihedral(p0,p1,p2,p3){
  const b0=V.sub(p0,p1), b1=V.unit(V.sub(p2,p1)), b2=V.sub(p3,p2);
  const v=V.sub(b0,V.mul(b1,V.dot(b0,b1))), w=V.sub(b2,V.mul(b1,V.dot(b2,b1)));
  return Math.atan2(V.dot(V.cross(b1,v),w),V.dot(v,w))*RAD;
}

/* ---- a molecule from the table ---- */
const MOLMEMO={};
function molecule(id){
  if(MOLMEMO[id]) return MOLMEMO[id];
  const m=MOL[id]||DMOL[id]; if(!m) throw new Error('molecule: unknown '+id);
  const atoms=m.a.map(a=>({name:a[0],el:a[1],charge:a[2],arom:!!a[3],leaving:!!a[4],stereo:a[5],backbone:!!a[6],xyz:[a[7],a[8],a[9]]}));
  const idx={}; atoms.forEach((a,i)=>idx[a.name]=i);
  const adj=atoms.map(()=>[]);
  for(const [i,j,o] of m.b){ adj[i].push([j,o]); adj[j].push([i,o]); }
  let c=[0,0,0]; for(const a of atoms) c=V.add(c,a.xyz); c=V.mul(c,1/atoms.length);
  let rad=0; for(const a of atoms) rad=Math.max(rad,dist(a.xyz,c));
  return (MOLMEMO[id]={id,name:m.n,one:m.one,formula:m.f,fw:m.fw,charge:m.q,coords:m.c,atoms,bonds:m.b,idx,adj,centroid:c,radius:rad});
}
function formulaOf(M){
  const cnt={}; for(const a of M.atoms) cnt[a.el]=(cnt[a.el]||0)+1;
  const order=['C','H'].concat(Object.keys(cnt).filter(k=>k!=='C'&&k!=='H').sort());
  return {text:order.filter(k=>cnt[k]).map(k=>k+(cnt[k]>1?cnt[k]:'')).join(' '),cnt};
}
function massOf(M){ const {cnt}=formulaOf(M); let s=0; for(const e in cnt) s+=AW[e][0]*cnt[e]; return s; }
function neutralMass(M){ return massOf(M)-M.charge*AW.H[0]; }

/* ---- CIP ranking (hierarchical digraph, duplicate atoms for multiple bonds, phantoms to three) ---- */
function cipExpand(M,node,parent){
  if(node.t!=='atom') return [];
  const out=[];
  for(const [j,o] of M.adj[node.i]){
    if(j===parent){ for(let k=1;k<o;k++) out.push({t:'dup',i:j}); }
    else { out.push({t:'atom',i:j}); for(let k=1;k<o;k++) out.push({t:'dup',i:j}); }
  }
  return out;
}
const zOf=(M,node)=>ZNUM[M.atoms[node.i].el];
function cipLevels(M,root,parent,depth,memo){
  const levels=[[[zOf(M,root)]]];
  let frontier=[[root,parent]];
  for(let d=0;d<depth;d++){
    const sets=[], nxt=[];
    for(const [node,par] of frontier){
      const ch=cipExpand(M,node,par);
      let zs=ch.map(c=>zOf(M,c)).sort((a,b)=>b-a);
      if(node.t==='dup') zs=[0,0,0];
      else if(M.atoms[node.i].el!=='H'){ while(zs.length<3) zs.push(0); }
      sets.push(zs);
      const ranked=ch.slice().sort((x,y)=>cipCompare(cipKey(M,y,node.t==='atom'?node.i:null,depth-d-1,memo),cipKey(M,x,node.t==='atom'?node.i:null,depth-d-1,memo)));
      for(const c of ranked) nxt.push([c,node.i]);
    }
    levels.push(sets);
    frontier=nxt;
  }
  return levels;
}
function cipKey(M,node,parent,depth,memo){
  if(depth<=0) return [[[zOf(M,node)]]];
  const k=node.t+node.i+'|'+parent+'|'+depth;
  if(!memo[k]) memo[k]=cipLevels(M,node,parent,depth,memo);
  return memo[k];
}
/* lexicographic comparison of nested arrays (Python tuple order): >0 when a outranks b */
function cipCompare(a,b){
  if(typeof a==='number') return a-b;
  const n=Math.min(a.length,b.length);
  for(let i=0;i<n;i++){ const c=cipCompare(a[i],b[i]); if(c!==0) return c; }
  return a.length-b.length;
}
function cipRank(M,centre,depth){
  const memo={}, D=depth||6;
  const subs=M.adj[centre].map(([j])=>({j,key:cipKey(M,{t:'atom',i:j},centre,D,memo)}));
  subs.sort((x,y)=>cipCompare(y.key,x.key));
  let ties=false; for(let i=0;i+1<subs.length;i++) if(cipCompare(subs[i].key,subs[i+1].key)===0) ties=true;
  return {order:subs.map(s=>s.j),ties};
}
/* R when v1 . (v2 x v3) < 0 (fixed on a hand-built R centre in derive.py and in selfTest) */
function rsOf(X,centre,order){
  const v=order.map(j=>V.sub(X[j],X[centre]));
  const vol=V.dot(v[0],V.cross(v[1],v[2]));
  return {rs:vol<0?'R':'S',vol};
}
function stereoCentres(M){
  if(M.stereo) return M.stereo;
  const X=M.atoms.map(a=>a.xyz), out=[];
  M.atoms.forEach((a,i)=>{
    if(a.el==='H'||M.adj[i].length!==4) return;
    const r=cipRank(M,i); if(r.ties) return;
    const s=rsOf(X,i,r.order);
    out.push({atom:a.name,i,rs:s.rs,vol:s.vol,order:r.order.map(j=>M.atoms[j].name),orderIdx:r.order,ccd:a.stereo});
  });
  return (M.stereo=out);
}
/* the sense of a -> b -> c seen from the tip of n (the viewer on the n side): clockwise when negative
   (right-hand rule: counterclockwise order has (a x b + b x c + c x a) . n > 0) */
function turnSense(a,b,c,n){ return V.dot(V.add(V.add(V.cross(a,b),V.cross(b,c)),V.cross(c,a)),n); }
/* the CORN reading: seen from the H (H toward the viewer), the sense of CO -> R -> N around CA */
function cornOf(M){
  const i=M.idx.CA, X=M.atoms.map(a=>a.xyz);
  const h=M.idx.HA!==undefined?M.idx.HA:null, r=M.idx.CB!==undefined?M.idx.CB:null;
  if(h===null||r===null) return null;
  const co=V.sub(X[M.idx.C],X[i]), rr=V.sub(X[r],X[i]), n=V.sub(X[M.idx.N],X[i]), hh=V.sub(X[h],X[i]);
  const turn=turnSense(co,rr,n,hh);
  return {clockwise:turn<0,turn,letter:turn<0?'L':'D'};
}

/* ---- mirror images and superposition (Horn's quaternion method; proper rotations only) ---- */
function mirrorX(P){ return P.map(p=>[-p[0],p[1],p[2]]); }
function centred(P){ let c=[0,0,0]; for(const p of P) c=V.add(c,p); c=V.mul(c,1/P.length); return P.map(p=>V.sub(p,c)); }
function jacobiEig(A){
  const n=A.length, a=A.map(r=>r.slice()), v=A.map((r,i)=>r.map((_,j)=>i===j?1:0));
  for(let sweep=0;sweep<100;sweep++){
    let off=0; for(let p=0;p<n;p++) for(let q=p+1;q<n;q++) off+=a[p][q]*a[p][q];
    if(off<1e-24) break;
    for(let p=0;p<n;p++) for(let q=p+1;q<n;q++){
      if(Math.abs(a[p][q])<1e-300) continue;
      const th=(a[q][q]-a[p][p])/(2*a[p][q]), t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1)), c=1/Math.sqrt(t*t+1), s=t*c;
      for(let k=0;k<n;k++){ const x=a[k][p], y=a[k][q]; a[k][p]=c*x-s*y; a[k][q]=s*x+c*y; }
      for(let k=0;k<n;k++){ const x=a[p][k], y=a[q][k]; a[p][k]=c*x-s*y; a[q][k]=s*x+c*y; }
      for(let k=0;k<n;k++){ const x=v[k][p], y=v[k][q]; v[k][p]=c*x-s*y; v[k][q]=s*x+c*y; }
    }
  }
  return {values:a.map((r,i)=>r[i]),vectors:v};
}
function superposeRMSD(P0,Q0){
  const P=centred(P0), Q=centred(Q0);
  let S=[[0,0,0],[0,0,0],[0,0,0]], ep=0, eq=0;
  for(let k=0;k<P.length;k++){ for(let i=0;i<3;i++) for(let j=0;j<3;j++) S[i][j]+=P[k][i]*Q[k][j]; ep+=V.dot(P[k],P[k]); eq+=V.dot(Q[k],Q[k]); }
  const [Sxx,Sxy,Sxz]=S[0], [Syx,Syy,Syz]=S[1], [Szx,Szy,Szz]=S[2];
  const N=[[Sxx+Syy+Szz,Syz-Szy,Szx-Sxz,Sxy-Syx],
           [Syz-Szy,Sxx-Syy-Szz,Sxy+Syx,Szx+Sxz],
           [Szx-Sxz,Sxy+Syx,-Sxx+Syy-Szz,Syz+Szy],
           [Sxy-Syx,Szx+Sxz,Syz+Szy,-Sxx-Syy+Szz]];
  const e=jacobiEig(N), lmax=Math.max.apply(null,e.values);

function coreOf(M,centre){
  const i=M.idx[centre];
  return [centre].concat(M.adj[i].map(([j])=>M.atoms[j].name).sort());
}
function coords(M,names){ return names.map(n=>M.atoms[M.idx[n]].xyz); }
function mirrorTest(l,centre){
  const L=molecule(l), D=molecule(DMAP[l]), core=coreOf(L,centre);
  const P=coords(L,core), Q=coords(D,core);
  return {core,mirrorToD:superposeRMSD(mirrorX(P),Q),lToD:superposeRMSD(P,Q),lToMirror:superposeRMSD(P,mirrorX(P)),coordsD:D.coords};

/* ---- charge against pH ---- */
const ACIDIC=new Set(['ASP','GLU','CYS','TYR']), BASIC=new Set(['HIS','LYS','ARG']);
function groupsOf(k){
  const p=PROPS[k], g=[{pKa:p.pK1,base:false,name:'α-COOH'},{pKa:p.pK2,base:true,name:'α-NH₃⁺'}];
  if(p.pKa_side!==null) g.push({pKa:p.pKa_side,base:BASIC.has(k),name:'side chain'});
  return g;
}
function chargeAt(k,pH){
  let q=0;
  for(const g of groupsOf(k)) q+=g.base?1/(1+Math.pow(10,pH-g.pKa)):-1/(1+Math.pow(10,g.pKa-pH));
  return q;
}
function pIof(k){
  let lo=0, hi=14, flo=chargeAt(k,lo);
  for(let i=0;i<200;i++){ const m=(lo+hi)/2, fm=chargeAt(k,m); if(fm===0) return m; if((flo>0)===(fm>0)){ lo=m; flo=fm; } else hi=m; }
  return (lo+hi)/2;
}
/* fraction of the species with k groups deprotonated (independent groups: elementary symmetric sums) */
function speciesFractions(k,pH){
  const g=groupsOf(k), r=g.map(x=>Math.pow(10,pH-x.pKa));
  let e=[1]; for(const x of r){ const n=e.concat([0]); for(let i=e.length;i>=1;i--) n[i]+=e[i-1]*x; e=n; }
  const tot=e.reduce((s,x)=>s+x,0), qmax=g.filter(x=>x.base).length;
  return e.map((x,i)=>({deprot:i,charge:qmax-i,frac:x/tot}));
}

/* ---- crambin ---- */
const CR={};
CRAMBIN.res.forEach(r=>CR[r[0]]=r);
function crambinGeometry(){
  const G={N_CA:[],CA_C:[],C_O:[],C_N:[],N_H:[],N_CA_C:[],CA_C_N:[],C_N_CA:[],CA_C_O:[],O_C_N:[],C_N_H:[]};
  for(const [s,,a] of CRAMBIN.res){
    G.N_CA.push(dist(a.N,a.CA)); G.CA_C.push(dist(a.CA,a.C)); G.C_O.push(dist(a.C,a.O)); G.N_CA_C.push(angleDeg(a.N,a.CA,a.C));
    const nx=CR[s+1]; if(!nx) continue; const b=nx[2];
    G.C_N.push(dist(a.C,b.N)); G.CA_C_N.push(angleDeg(a.CA,a.C,b.N)); G.C_N_CA.push(angleDeg(a.C,b.N,b.CA));
    G.CA_C_O.push(angleDeg(a.CA,a.C,a.O)); G.O_C_N.push(angleDeg(a.O,a.C,b.N));
    if(b.H){ G.N_H.push(dist(b.N,b.H)); G.C_N_H.push(angleDeg(a.C,b.N,b.H)); }
  }
  const out={};
  for(const k in G){ const v=G[k], m=v.reduce((s,x)=>s+x,0)/v.length, sd=Math.sqrt(v.reduce((s,x)=>s+(x-m)*(x-m),0)/(v.length-1)); out[k]=[m,sd,v.length]; }
  return out;
}
function crambinDihedrals(){
  return CRAMBIN.res.map(([s,rn,a])=>{
    const pv=CR[s-1], nx=CR[s+1];
    return {seq:s,resn:rn,phi:pv?dihedral(pv[2].C,a.N,a.CA,a.C):null,psi:nx?dihedral(a.N,a.CA,a.C,nx[2].N):null,
            omega:nx?dihedral(a.CA,a.C,nx[2].N,nx[2].CA):null};
  });
}
function crambinHelixSegments(cut){
  const helical=new Set();
  for(const [s,,a] of CRAMBIN.res){ const f=CR[s+4]; if(f&&dist(a.O,f[2].N)<=cut) for(let x=s+1;x<=s+3;x++) helical.add(x); }
  const xs=[...helical].sort((p,q)=>p-q), segs=[];
  for(const x of xs){ if(segs.length&&x===segs[segs.length-1][1]+1) segs[segs.length-1][1]=x; else segs.push([x,x]); }
  return segs;
}
const CGEO=crambinGeometry();
const GEO={N_CA:CGEO.N_CA[0],CA_C:CGEO.CA_C[0],C_N:CGEO.C_N[0],C_O:CGEO.C_O[0],N_H:CGEO.N_H[0],
           N_CA_C:CGEO.N_CA_C[0],CA_C_N:CGEO.CA_C_N[0],C_N_CA:CGEO.C_N_CA[0],CA_C_O:CGEO.CA_C_O[0],C_N_H:CGEO.C_N_H[0]};

/* ---- the chain: NeRF placement with the crambin backbone and the CCD alanine / glycine CA substituents ---- */
function place(a,b,c,bond,theta,tau){
  const th=theta*DEG, tu=tau*DEG;
  const d2=[-bond*Math.cos(th),bond*Math.sin(th)*Math.cos(tu),bond*Math.sin(th)*Math.sin(tu)];
  const bc=V.unit(V.sub(c,b)), n=V.unit(V.cross(V.sub(b,a),bc)), m2=V.cross(n,bc);
  return [c[0]+bc[0]*d2[0]+m2[0]*d2[1]+n[0]*d2[2], c[1]+bc[1]*d2[0]+m2[1]*d2[1]+n[1]*d2[2], c[2]+bc[2]*d2[0]+m2[2]*d2[1]+n[2]*d2[2]];
}
function caPlacement(id,atom){
  const M=molecule(id), X=n=>M.atoms[M.idx[n]].xyz;

  const D=molecule(DMAP[k]);
  const sL=stereoCentres(L).find(s=>s.atom===centre), sD=stereoCentres(D).find(s=>s.atom===centre);
  return {k,achiral:false,L,D,centre,centres,mode,sL,sD,mt:mirrorTest(k,centre),cornL:cornOf(L),cornD:cornOf(D),rows:allStereo()};
}
/* ---- the chain ---- */
function chainModel(st){
  const ch=buildChain(st.nres,st.phi,st.psi,st.omega,st.gly);
  const hp=helixParams(st.phi,st.psi,st.omega);
  const hb=chainHBonds(ch);
  const count=s=>hb.filter(h=>h.span===s).length;
  return {ch,hp,hb,n3:count(3),n4:count(4),n5:count(5),allowed:stericAllowed(st.phi,st.psi,st.f,st.gly),
          omegaF:omegaFormula(st.phi,st.psi),s310:solvedPreset('310'),spi:solvedPreset('pi')};
}
/* ---- the Ramachandran map ---- */
function crambinPoints(){
  return memo('crpts','1',()=>{ const segs=crambinHelixSegments(3.5), strands=CRAMBIN.sheet;
    const inSeg=(s,list)=>list.some(x=>s>=x[0]&&s<=x[1]);
    return crambinDihedrals().filter(d=>d.phi!==null&&d.psi!==null).map(d=>Object.assign(d,{kind:inSeg(d.seq,segs)?'helix':inSeg(d.seq,strands)?'strand':'other'})); });
}
function ramaModel(st){
  const ala=stericGrid(st.f,false), gly=stericGrid(st.f,true);
  const pts=crambinPoints().map(d=>Object.assign({},d,{ok:stericAllowed(d.phi,d.psi,st.f,d.resn==='GLY')}));
  const contacts=stericContacts(st.phi,st.psi,st.f,st.gly);
  return {ala,gly,pts,inside:pts.filter(p=>p.ok).length,contacts,cursorOK:stericAllowed(st.phi,st.psi,st.f,st.gly),
          geo:CGEO,segs:crambinHelixSegments(3.5),annot:CRAMBIN.helix,omegaAbs:crambinOmega()};
}
function crambinOmega(){
  return memo('crom','1',()=>{ const v=crambinDihedrals().filter(d=>d.omega!==null).map(d=>Math.abs(d.omega)); const m=v.reduce((s,x)=>s+x,0)/v.length;
    return {mean:m,sd:Math.sqrt(v.reduce((s,x)=>s+(x-m)*(x-m),0)/(v.length-1)),n:v.length,values:crambinDihedrals().filter(d=>d.omega!==null).map(d=>d.omega)}; });
}
/* ---- the genetic code ---- */
function codonOf(st){ return st.b1+st.b2+st.b3; }
function codonIndex(c){ return 16*BASES.indexOf(c[0])+4*BASES.indexOf(c[1])+BASES.indexOf(c[2]); }
function rna(c){ return c.replace(/T/g,'U'); }
function codeModel(st){
  const c=codonOf(st), one=GCODE[c], k=one==='*'?null:ONE2THREE[one];
  const nb=codonNeighbours(c).map(([p,c2])=>{ const a2=GCODE[c2]; return {pos:p,codon:c2,one:a2,k:a2==='*'?null:ONE2THREE[a2],
    dkd:(k&&a2!=='*')?KD[ONE2THREE[a2]]-KD[k]:null,syn:k!==null&&a2===one}; });
  return {c,one,k,nb,deg:degeneracy(),syn:synonymousStats(),sh:shuffleTest(),codonsOfSel:codonsOf(st.aa),starts:STARTS};
}

function buildModel(){
  const st=ST, view=st.view;
  const M={view,st,t:SIM.t};
  if(view==='mol') M.Mo=molModel(st);
  if(view==='twenty') M.Tw=twentyModel(st);
  if(view==='chiral') M.Ch=chiralModel(st);
  if(view==='chain') M.Cn=chainModel(st);
  if(view==='rama') M.Ra=ramaModel(st);
  if(view==='code') M.Co=codeModel(st);
  return M;
}

function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='mol') return E('<span class="hl">H&#8322;N&ndash;C<sub>&alpha;</sub>H(R)&ndash;COOH</span> &nbsp;&middot;&nbsp; q(pH) = &sum;<sub>bases</sub> 1/(1 + 10<sup>pH&minus;pK</sup>) &minus; &sum;<sub>acids</sub> 1/(1 + 10<sup>pK&minus;pH</sup>) &nbsp;&middot;&nbsp; <span class="hl2">q(pI) = 0</span>',
    'every amino acid has the same frame, an amine and an acid on one carbon (in proline the side chain closes back onto the amine), with a side chain R that sets its size, polarity and charge');
  if(M.view==='twenty') return E('<span class="hl">20 side chains</span> &nbsp;&middot;&nbsp; '+GROUPS.map(g=>g.aa.length+' '+g.name.split(',')[0]).join(', ')+' &nbsp;&middot;&nbsp; <span class="hl2">V &asymp; a&middot;m + b</span>',
    'the side chains run from a lone hydrogen to a double ring and over '+fmt(KD_SPAN,1)+' units of hydropathy; volume follows mass because the atoms are the same few elements');
  if(M.view==='chiral') return E('<span class="hl">R &hArr; v&#8321;&middot;(v&#8322; &times; v&#8323;) &lt; 0</span> &nbsp;(priorities 1 &gt; 2 &gt; 3 &gt; 4) &nbsp;&middot;&nbsp; <span class="hl2">min<sub>R&isin;SO(3)</sub> |RP &minus; Q| &gt; 0</span> for a mirror image',
    'a carbon with four different groups has two mirror-image forms that no rotation can superpose; ribosomes build proteins from the L forms only');
  if(M.view==='chain') return E('<span class="hl">x<sub>i+1</sub> = R x<sub>i</sub> + t</span> &nbsp;&middot;&nbsp; n = 360&deg;/&theta;, &nbsp;d = t&middot;&ucirc; &nbsp;&middot;&nbsp; <span class="hl2">3 cos &Omega; = 1 &minus; 4 cos&sup2;[(&phi;+&psi;)/2]</span>',
    'repeating the same backbone angles makes every residue the same screw step away from the last: the chain is a helix whose turn and rise follow from (φ, ψ)');
  if(M.view==='rama') return E('<span class="hl">allowed &hArr; |r<sub>i</sub> &minus; r<sub>j</sub>| &ge; f (R<sub>i</sub> + R<sub>j</sub>)</span> for every pair across a rotatable bond &nbsp;&middot;&nbsp; f = '+fmt(ST.f,2)+', Bondi radii',
    'most (φ, ψ) pairs push backbone atoms into each other; the measured angles of a real protein cluster in the regions that do not');
  return E('<span class="hl">64 codons &rarr; 20 amino acids + stop</span> &nbsp;&middot;&nbsp; <span class="hl2">cost = &lang;(h(a) &minus; h(a&prime;))&sup2;&rang;</span> over single-base changes',
    'the code is redundant mostly in the third position and puts similar amino acids on neighbouring codons: a point mutation does less harm than in '+fmt(100*(1-shuffleTest().better/shuffleTest().n),1)+' % of shuffled codes');
}
function tagHTML(M){
  const st=ST;
  if(M.view==='mol') return '<b>the molecule</b> — '+aaName(st.aa)+', '+plain(STYLE_LIST.find(s=>s.id===st.style).name);
  if(M.view==='twenty') return '<b>the twenty</b> — '+plain(SORT_LIST.find(s=>s.id===st.sortBy).name);
  if(M.view==='chiral') return '<b>chirality</b> — '+aaName(st.aa)+(M.Ch.achiral?' (achiral)':', centre '+M.Ch.centre);
  if(M.view==='chain') return '<b>the chain</b> — φ '+signed(st.phi,0)+'°, ψ '+signed(st.psi,0)+'°';
  if(M.view==='rama') return '<b>the Ramachandran map</b> — f = '+fmt(st.f,2);

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_lagr/p4_views.js (lineage build_buoy); the camera block from     *
 *  pulsar.html (v3, makeCamera, camBasis, project)                    *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg(ctx,map,a,b,col,lw,dash){

      title:titleFor(bb,'protonation states, labelled by net charge','protonation states')});

/* ================================================================== *
 *  view: chirality                                                    *
 * ================================================================== */
const PRIO_COL=['#ff6b6b','#f2c14e','#b8ec4c','#8b93a6'];
let CHIRAL_SENSE=[];
/* the rotation that sends 'away' to +y (into the screen) and 'up' to +z, rows [x, y, z] */
function viewAlign(away,up){
  const u=V.unit(away), w=V.unit(V.sub(up,V.mul(u,V.dot(up,u)))), v=V.cross(u,w);
  return [v,u,w];
}
/* the sense in which a1 -> a2 -> a3 go round on the screen (y down): clockwise when a2 comes first going clockwise */
function screenSense(c,p1,p2,p3){
  const ang=p=>Math.atan2(p.y-c.y,p.x-c.x), m=x=>((x%TAU)+TAU)%TAU;
  const a1=ang(p1), d2=m(ang(p2)-a1), d3=m(ang(p3)-a1);
  return {clockwise:d2<d3,a1,d3};
}
function chiralPanel(ctx,W,H,b,mol,X,centre,prio,mode,key,head,headCol){
  frame(ctx,b,COL.edge);
  const ci=mol.idx[centre], Xc=X[ci];
  let arrow, away, up, badges;
  if(mode==='corn'){ const I=mol.idx; away=V.sub(Xc,X[I.HA]); up=V.sub(X[I.CB],Xc); arrow=[I.C,I.CB,I.N];
    badges=[[I.C,'CO',PRIO_COL[0]],[I.CB,'R',PRIO_COL[1]],[I.N,'N',PRIO_COL[2]],[I.HA,'H (toward you)',PRIO_COL[3]]]; }
  else { away=V.sub(X[prio[3]],Xc); up=V.sub(X[prio[0]],Xc); arrow=prio.slice(0,3);
    badges=prio.map((j,r)=>[j,String(r+1),PRIO_COL[r],atomLabel(mol.atoms[j].name)+(r===3?' (behind)':'')]); }
  const A=matMul(rotY(0.6*spinAngle()),viewAlign(away,up));
  const atoms=mol.atoms.map((a,i)=>({el:a.el,name:a.name,p:matVec(A,V.sub(X[i],Xc)),hide:ST.showH===false&&a.el==='H'&&i!==prio[3]&&a.name!=='HA'}));
  const core=new Set([ci].concat(prio));
  atoms.forEach((a,i)=>{ if(!core.has(i)) a.col=mix(ELCOL[a.el],'#070b18',0.55); });
  let rmax=0; for(const a of atoms) rmax=Math.max(rmax,V.len(a.p));
  const inner=box(b.x+6,b.y+20,b.w-12,b.h-44);
  const C=boxCamera(inner,-PI/2,0,fitDist(inner,Math.min(rmax,4.2)+styleExtra(ST.style)),[0,0,0]);
  const {pr,rad}=renderMol(ctx,C,atoms,mol.bonds,{style:ST.style==='space'?'ball':ST.style});
  lab(ctx,W,H,b.x+b.w/2,b.y+6,head,headCol,LAB_FONT,'center','top');
  const qc=pr[ci];
  if(!qc) return;
  /* the badges: the CIP ranks, or CO / R / N / H; the atom on the viewing axis is labelled under the drawing */
  const onAxis=[];
  for(const [j,tag,col,name] of badges){ const q=pr[j]; if(!q) continue;
    let dx=q.x-qc.x, dy=q.y-qc.y; const l=Math.hypot(dx,dy);
    if(l<4){ onAxis.push([tag,col,name]); continue; }
    dx/=l; dy/=l;
    const bx=q.x+dx*(rad[j]+9), by=q.y+dy*(rad[j]+9);
    if(name&&!labFits([bx-7,by-7,bx+7,by+7])) continue;
    if(name){ dot(ctx,bx,by,7,col,null); LABELS.push([bx-7,by-7,bx+7,by+7]);
      ctx.fillStyle='#070b18'; ctx.font='bold 10px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(tag,bx,by);
      lab(ctx,W,H,bx+(dx>=0?10:-10),by,name,col,SM_FONT,dx>=0?'left':'right','middle'); }
    else lab(ctx,W,H,bx,by,tag,col,LAB_FONT,dx>=0?'left':'right','middle'); }
  /* the turning arrow, outside the three atoms */
  const ps=arrow.map(j=>pr[j]);
  if(ps.some(q=>!q)) return;
  const sense=screenSense(qc,ps[0],ps[1],ps[2]);
  const rr0=Math.min(Math.max.apply(null,ps.map(q=>Math.hypot(q.x-qc.x,q.y-qc.y)))+Math.max.apply(null,arrow.map(j=>rad[j]))+20,Math.min(inner.w,inner.h)/2-4);
  const rr=rr0, a0=sense.a1, sweep=sense.clockwise?sense.d3:-(TAU-sense.d3);
  const pts=[]; for(let k=0;k<=48;k++){ const a=a0+sweep*k/48; pts.push([qc.x+rr*Math.cos(a),qc.y+rr*Math.sin(a)]); }
  ctx.beginPath(); pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle=COL.live; ctx.lineWidth=2.2; ctx.stroke();
  for(let k=0;k<pts.length-1;k++) POLY_SEGS.push(pts[k][0],pts[k][1],pts[k+1][0],pts[k+1][1]);
  const e=pts[pts.length-1], e0=pts[pts.length-4];
  arrowPx(ctx,e0[0],e0[1],e[0],e[1],COL.live,2.2);
  for(const [tag,col,name] of onAxis) lab(ctx,W,H,qc.x,Math.min(qc.y+rr+10,b.y1-30),(name?tag+': '+name:tag),col,SM_FONT,'center','top');
  const word=mode==='corn'?(sense.clockwise?'CO → R → N clockwise: L':'CO → R → N anticlockwise: D'):(sense.clockwise?'1 → 2 → 3 clockwise: R':'1 → 2 → 3 anticlockwise: S');
  lab(ctx,W,H,b.x+b.w/2,b.y1-8,word,COL.live,LAB_FONT,'center','bottom');
  CHIRAL_SENSE.push({key,mode,clockwise:sense.clockwise,onAxis:onAxis.length});
}
function drawChiral(ctx,W,H,M){

    }
  } else {
    const n=L.narrow?1:3, gut=18, pw=(b.w-gut*(n-1))/n;

    const XL=L1.atoms.map(a=>a.xyz), XM=mirrorX(XL), D=Ch.D, XD=D.atoms.map(a=>a.xyz);
    const prioL=Ch.sL.orderIdx, prioD=Ch.sD.orderIdx;

 *  view: the chain                                                    *

const CHAIN_ATOMS=[['N','N'],['CA','C'],['C','C'],['O','O'],['H','H'],['CB','C'],['HA','H'],['HA3','H']];
const CHAIN_BONDS=[['N','CA',1],['CA','C',1],['C','O',2],['N','H',1],['CA','CB',1],['CA','HA',1],['CA','HA3',1]];
function chainGraph(ch,showH){
  const atoms=[], bonds=[], at={};
  ch.forEach((r,i)=>{ for(const [nm,el] of CHAIN_ATOMS) if(r[nm]){ at[i+'.'+nm]=atoms.length; atoms.push({el,name:nm,res:i,p0:r[nm],hide:!showH&&el==='H'}); } });
  ch.forEach((r,i)=>{ for(const [a,b,o] of CHAIN_BONDS) if(at[i+'.'+a]!==undefined&&at[i+'.'+b]!==undefined) bonds.push([at[i+'.'+a],at[i+'.'+b],o,0]);
    if(i+1<ch.length) bonds.push([at[i+'.C'],at[(i+1)+'.N'],1,0]); });
  return {atoms,bonds,at};
}
/* the frame that lays the screw axis along +x (N-terminus on the left), centred on the chain */
function chainFrame(ch,hp){
  const dir=hp.n<0?-1:1, ax=V.mul(hp.axis,V.dot(hp.t,hp.axis)<0?-1:1);
  let cen=[0,0,0]; for(const r of ch) cen=V.add(cen,r.CA); cen=V.mul(cen,1/ch.length);
  const c=V.add(hp.point,V.mul(hp.axis,V.dot(V.sub(cen,hp.point),hp.axis)));
  let e1=V.cross(ax,[0,0,1]); if(V.len(e1)<1e-6) e1=V.cross(ax,[0,1,0]);
  e1=V.unit(e1); const e2=V.cross(ax,e1);
  return {rows:[ax,e1,e2],c,dir};
}
/* the camera distance that fits a set of points into the box (two perspective refinements) */
function fitPoints(b,theta,phi,pts,Rb){
  let D=Math.max(60,3*Rb);
  for(let it=0;it<3;it++){
    const C=boxCamera(b,theta,phi,D,[0,0,0]); let ex=0, ey=0;
    for(const p of pts){ const q=C.P(p); if(!q) continue; ex=Math.max(ex,Math.abs(q.x-(b.x+b.w/2))); ey=Math.max(ey,Math.abs(q.y-(b.y+b.h/2))); }
    const s=Math.max(ex/(0.47*b.w),ey/(0.47*b.h));
    D=Math.max(1.25*Rb,D*s);
  }
  return D;
}
/* the helix-type map: residues per turn over (phi, psi) at the current omega */
function helixGrid(omega){
  return memo('hgrid','o'+omega,()=>{ const n=new Float64Array(36*36);
    for(let i=0;i<36;i++) for(let j=0;j<36;j++) n[i*36+j]=helixParams(-180+10*i+5,-180+10*j+5,omega).n;
    return n; });
}
function nColour(n){
  const a=clamp((Math.abs(n)-2)/3,0,1);
  return n>0?mix('#101a2a',COL.ref,0.25+0.6*a):mix('#101a2a',COL.struct,0.25+0.6*a);
}
function presetPoints(){
  const s3=solvedPreset('310'), sp=solvedPreset('pi');
  return [['α',PRESETS.alpha.phi,PRESETS.alpha.psi],['3₁₀',s3.phi,s3.psi],['π',sp.phi,sp.psi],['β',PRESETS.beta.phi,PRESETS.beta.psi],['PPII',PRESETS.ppii.phi,PRESETS.ppii.psi]];
}
function drawChain(ctx,W,H,M){
  const Cn=M.Cn, st=M.st, ch=Cn.ch, hp=Cn.hp;
  const L=stageLayout(ctx,W,H,
    'A chain of '+st.nres+' '+(st.gly?'glycines':'alanines')+' built atom by atom from one (φ, ψ, ω) for every residue, with the backbone bond lengths and angles measured in crambin. Because every residue repeats the same step, the chain is a helix around a screw axis (magenta, turning with it); hydrogen bonds from a C=O to an N–H further along are dashed yellow. Try the presets: the α-helix bonds residue i to i + 4, the β-strand is almost flat and bonds only to a neighbouring strand. Below: residues per turn over the whole (φ, ψ) plane, and the view down the axis. Drag to turn.',
    'A '+st.nres+'-residue chain from one (φ, ψ, ω); the screw axis, and H-bonds dashed. Below: turn per residue over (φ, ψ), and the end view.',2,0.32,1);
  const b=L.main; frame(ctx,b,COL.edge);
  const G=chainGraph(ch,st.showH), F=chainFrame(ch,hp);
  const A=matMul(rotX(spinAngle()),F.rows);
  for(const a of G.atoms) a.p=matVec(A,V.sub(a.p0,F.c));
  const Lx=hp.rise*(st.nres-1)/2+2.2, rr=hp.radius+2.6;
  const box3=[]; for(const sx of [-Lx,Lx]) for(let k=0;k<12;k++) box3.push([sx,rr*Math.cos(TAU*k/12),rr*Math.sin(TAU*k/12)]);
  const inner=box(b.x+8,b.y+26,b.w-16,b.h-44);
  const D=fitPoints(inner,st.chTheta,st.chPhi,box3,Math.hypot(Lx,rr));
  const C=boxCamera(inner,st.chTheta,st.chPhi,D,[0,0,0]);

  seg3(ctx,C,[-Lx-1.5,0,0],[Lx+1.5,0,0],rgba(COL.live,0.85),1.6,[6,4],true);
  const {pr}=renderMol(ctx,C,G.atoms,G.bonds,{style:st.style==='space'?'space':st.style==='stick'?'stick':'ball'});
  for(const h of Cn.hb){ const i=G.at[h.i+'.O'], j=G.at[h.j+'.H']!==undefined&&!G.atoms[G.at[h.j+'.H']].hide?G.at[h.j+'.H']:G.at[h.j+'.N'];
    if(pr[i]&&pr[j]) line(ctx,pr[i].x,pr[i].y,pr[j].x,pr[j].y,COL.hbond,1.5,[3,3]); }
  const qa=C.P([Lx+1.5,0,0]); if(qa) lab(ctx,W,H,qa.x+4,qa.y,'screw axis',COL.live,SM_FONT,'left','middle');
  const q0=pr[G.at['0.N']], q1=pr[G.at[(st.nres-1)+'.C']];
  if(q0) lab(ctx,W,H,q0.x-8,q0.y,'N',ELCOL.N,LAB_FONT,'right','middle');
  if(q1) lab(ctx,W,H,q1.x+8,q1.y,'C',ELCOL.C,LAB_FONT,'left','middle');
  lab(ctx,W,H,b.x+8,b.y+8,'(φ, ψ, ω) = ('+signed(st.phi,0)+'°, '+signed(st.psi,0)+'°, '+fmt(st.omega,0)+'°): '+fmt(Math.abs(hp.n),2)+' residues per turn, '+(hp.n>0?'right':'left')+'-handed, '+fmt(hp.rise,2)+' Å rise',
    '#aeb6c6',TITLE_FONT,'left','top');
  lab(ctx,W,H,b.x+8,b.y1-10,Cn.hb.length?Cn.hb.length+' backbone H-bonds (O···N ≤ '+fmt(HB_CUT_N,1)+' Å, O···H ≤ '+fmt(HB_CUT_H,1)+' Å)':'no backbone H-bonds within the chain',Cn.hb.length?COL.hbond:COL.dim,SM_FONT,'left','middle');

  /* the turn map */
  { const bb=L.bottom[0], g=helixGrid(st.omega);
    const pw=Math.min(bb.w,bb.h*2.1), pb=box(bb.x+(bb.w-pw)/2,bb.y,pw,bb.h);
    const cw=pb.w/36, chh=pb.h/36;
    for(let i=0;i<36;i++) for(let j=0;j<36;j++){ ctx.fillStyle=nColour(g[i*36+j]); ctx.fillRect(pb.x+i*cw,pb.y1-(j+1)*chh,cw+0.5,chh+0.5); }
    const tk=mapTicks(Math.min(pb.w,pb.h*1.6));

      title:titleFor(pb,'residues per turn: orange right-, cyan left-handed','turn per residue')});
    const X=v=>pb.x+pb.w*(v+180)/360, Y=v=>pb.y1-pb.h*(v+180)/360;
    for(const [nm,ph,ps] of presetPoints()){ dot(ctx,X(ph),Y(ps),2.5,'#ffffff',null); lab(ctx,W,H,X(ph)+4,Y(ps),nm,'#ffffff',SM_FONT,'left','middle'); }
    dot(ctx,X(st.phi),Y(st.psi),4.5,COL.live,'#fff');

  /* down the axis */
  if(L.bottom.length>1){
    const bb=L.bottom[1]; frame(ctx,bb,COL.edge);

    const pts=ch.map(r=>{ const d=V.sub(r.CA,F.c); return [V.dot(d,F.rows[1]),V.dot(d,F.rows[2])]; });
    const ext=Math.max(hp.radius,1)+1.2;
    const map=worldFitUp(box(bb.x+8,bb.y+8,bb.w-16,bb.h-16),{xmin:-ext,xmax:ext,ymin:-ext,ymax:ext},0);

const MAP_COL={ala:'#2f6a45',gly:'#1d4a5a',bg:'#0b1020'};
const F_STEPS=[0.70,0.75,0.80,0.85,0.90,0.95];
function fCurve(){
  return memo('fcurve','1',()=>F_STEPS.map(f=>({f,ala:stericGrid(f,false).fraction,gly:stericGrid(f,true).fraction,
    crambin:crambinPoints().filter(d=>stericAllowed(d.phi,d.psi,f,d.resn==='GLY')).length/crambinPoints().length})));
}
function drawMapCells(ctx,pb,ala,gly,showGly){
  ctx.fillStyle=MAP_COL.bg; ctx.fillRect(pb.x,pb.y,pb.w,pb.h);
  const cw=pb.w/72, chh=pb.h/72;
  for(let i=0;i<72;i++){
    let j=0;
    while(j<72){
      const v=ala.g[i*72+j]?2:(showGly&&gly.g[i*72+j]?1:0);
      let k=j+1; while(k<72&&(ala.g[i*72+k]?2:(showGly&&gly.g[i*72+k]?1:0))===v) k++;
      if(v){ ctx.fillStyle=v===2?MAP_COL.ala:MAP_COL.gly; ctx.fillRect(pb.x+i*cw,pb.y1-k*chh,cw+0.4,(k-j)*chh+0.4); }
      j=k;
    }
  }
}
function dipeptideGraph(phi,psi,gly){
  const X=dipeptide(phi,psi,gly), names=Object.keys(STER_EL).filter(n=>X[n]);
  const idx={}; names.forEach((n,i)=>idx[n]=i);
  let cen=[0,0,0]; for(const n of names) cen=V.add(cen,X[n]); cen=V.mul(cen,1/names.length);
  const bonds=STER_BONDS.filter(([a,b])=>idx[a]!==undefined&&idx[b]!==undefined).map(([a,b])=>[idx[a],idx[b],(a==='C0'&&b==='O0')||(a==='C1'&&b==='O1')?2:1,0]);

}
function drawRama(ctx,W,H,M){

    }

  if(L.bottom.length>1){
    const bb=L.bottom[1], n=CRAMBIN.res.length;
    axesT(ctx,bb,0.5,n+0.5,-180,180,{xticks:[1,10,20,30,40,46],xfmt:v=>fmt(v,0),yticks:bb.h<100?[0]:[-180,0,180],yfmt:degTick,xlab:'crambin residue',ylab:'angle',
      title:titleFor(bb,'crambin: φ ● and ψ ◆ by residue, helices shaded','φ ●, ψ ◆')});
    const Xr=s=>bb.x+bb.w*(s-0.5)/n, Ya=v=>bb.y1-bb.h*(v+180)/360;
    for(const [a,z] of Ra.segs){ ctx.fillStyle=rgba(KIND_COL.helix,0.16); ctx.fillRect(Xr(a-0.5),bb.y,Xr(z+0.5)-Xr(a-0.5),bb.h); }
    for(const [a,z] of CRAMBIN.sheet){ ctx.fillStyle=rgba(KIND_COL.strand,0.16); ctx.fillRect(Xr(a-0.5),bb.y,Xr(z+0.5)-Xr(a-0.5),bb.h); }
    for(const d of crambinDihedrals()){
      if(d.phi!==null) dot(ctx,Xr(d.seq),Ya(d.phi),2.6,COL.pos,null);
      if(d.psi!==null) diamond(ctx,Xr(d.seq),Ya(d.psi),3,COL.struct,null);
    }
    polyline(ctx,bb,[0.5,n+0.5],[0,0],0.5,n+0.5,-180,180,rgba(COL.dim,0.5),1);
  }
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  view: the genetic code                                             *
 * ================================================================== */
const BASE_COL={T:'#e8843a',C:'#5ac8e0',A:'#b8ec4c',G:'#cd35c4'};
function aaGroupCol(one){ return one==='*'?'#3a3f4f':COL[groupOf(ONE2THREE[one]).id]; }
function wedge(ctx,cx,cy,r0,r1,a0,a1,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(cx,cy,r1,a0,a1,false); ctx.arc(cx,cy,r0,a1,a0,true); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}
const WHEEL={r0:0.16,r1:0.36,r2:0.54,r3:0.70,r4:0.84};
function codonAngle(k){ return -PI/2+TAU*k/64; }
function codonAt(h,x,y){
  const dx=x-h.cx, dy=y-h.cy, r=Math.hypot(dx,dy);
  if(r<h.R*WHEEL.r0||r>h.R*WHEEL.r4) return null;
  const a=((Math.atan2(dy,dx)+PI/2)%TAU+TAU)%TAU, k=Math.min(63,Math.floor(a/(TAU/64)));
  return BASES[k>>4]+BASES[(k>>2)&3]+BASES[k&3];
}
function drawCode(ctx,W,H,M){
  const Co=M.Co, st=M.st;
  const L=stageLayout(ctx,W,H,
    'The standard genetic code as a wheel: read a codon from the centre out (first, second, third base), and the outer ring gives the amino acid, coloured by its side-chain group (grey = stop). Click a codon to select it; its nine single-base neighbours are dotted (green = same amino acid, orange = stop) and listed on the right with the change in hydropathy each would cause. Below: the real code’s average hydropathy change per point mutation against 10,000 shuffled codes, and what a point mutation does at each codon position.',
    'The codon wheel (click a codon); its nine neighbours on the right. Below: the real code against 10,000 shuffles, and the effect by position.',2,0.30,1);
  const mb=L.main;
  const parts=L.narrow?[mb,null]:splitH(mb,0.52,30);
  const wb=parts[0], R=Math.max(40,Math.min(wb.w,wb.h)/2-28), cx=wb.x+wb.w/2, cy=wb.y+wb.h/2;
  const sel=codonIndex(Co.c), selAA=new Set(codonsOf(st.aa).map(codonIndex));
  const nbIdx={}; for(const n of Co.nb) nbIdx[codonIndex(n.codon)]=n;
  const step=TAU/64;
  for(let k=0;k<64;k++){
    const a0=codonAngle(k), a1=a0+step, c=BASES[k>>4]+BASES[(k>>2)&3]+BASES[k&3], one=GCODE[c];
    wedge(ctx,cx,cy,R*WHEEL.r2,R*WHEEL.r3,a0,a1,mix('#070b18',BASE_COL[c[2]],0.30),'#070b18',0.8);
    wedge(ctx,cx,cy,R*WHEEL.r3,R*WHEEL.r4,a0,a1,mix('#070b18',aaGroupCol(one),selAA.has(k)?0.95:0.55),'#070b18',0.8);
    if(R*WHEEL.r3*step>=8) lab(ctx,W,H,cx+R*(WHEEL.r2+WHEEL.r3)/2*Math.cos(a0+step/2),cy+R*(WHEEL.r2+WHEEL.r3)/2*Math.sin(a0+step/2),rna(c[2]),'#d8dce6',R<150?'9px -apple-system, sans-serif':SM_FONT,'center','middle');
  }
  for(let k=0;k<16;k++){ const a0=codonAngle(4*k), c=BASES[k>>2]+BASES[k&3];
    wedge(ctx,cx,cy,R*WHEEL.r1,R*WHEEL.r2,a0,a0+4*step,mix('#070b18',BASE_COL[c[1]],0.42),'#070b18',1);
    lab(ctx,W,H,cx+R*(WHEEL.r1+WHEEL.r2)/2*Math.cos(a0+2*step),cy+R*(WHEEL.r1+WHEEL.r2)/2*Math.sin(a0+2*step),rna(c[1]),'#ffffff',LAB_FONT,'center','middle'); }
  for(let k=0;k<4;k++){ const a0=codonAngle(16*k);
    wedge(ctx,cx,cy,R*WHEEL.r0,R*WHEEL.r1,a0,a0+16*step,mix('#070b18',BASE_COL[BASES[k]],0.55),'#070b18',1.2);
    lab(ctx,W,H,cx+R*(WHEEL.r0+WHEEL.r1)/2*Math.cos(a0+8*step),cy+R*(WHEEL.r0+WHEEL.r1)/2*Math.sin(a0+8*step),rna(BASES[k]),'#ffffff','bold 14px -apple-system, sans-serif','center','middle'); }
  /* the amino-acid runs, labelled once each */
  let k0=0;
  for(let k=1;k<=64;k++){
    const c0=BASES[k0>>4]+BASES[(k0>>2)&3]+BASES[k0&3], one=GCODE[c0];
    const c1=k<64?BASES[k>>4]+BASES[(k>>2)&3]+BASES[k&3]:null;
    if(k===64||GCODE[c1]!==one){
      const am=codonAngle(k0)+(k-k0)*step/2, rx=Math.cos(am), ry=Math.sin(am);
      lab(ctx,W,H,cx+(R*WHEEL.r4+6)*rx,cy+(R*WHEEL.r4+6)*ry,one==='*'?'Stop':short3(ONE2THREE[one]),aaGroupCol(one)==='#3a3f4f'?COL.dim:aaGroupCol(one),SM_FONT,rx>0.25?'left':rx<-0.25?'right':'center',ry>0.25?'top':ry<-0.25?'bottom':'middle');
      k0=k;
    }
  }
  /* the selection and its neighbours */
  wedge(ctx,cx,cy,R*WHEEL.r0,R*WHEEL.r4,codonAngle(sel),codonAngle(sel)+step,null,COL.live,2.2);
  for(const k in nbIdx){ const n=nbIdx[k], am=codonAngle(+k)+step/2, rm=R*(WHEEL.r3+WHEEL.r4)/2;
    dot(ctx,cx+rm*Math.cos(am),cy+rm*Math.sin(am),Math.max(2.5,Math.min(5,R*step*0.3)),n.syn?COL.pos:n.one==='*'?COL.ref:'#ffffff','#070b18',0.8); }
  lab(ctx,W,H,cx,cy,rna(Co.c),'#ffffff','bold 12px -apple-system, sans-serif','center','middle');
  lab(ctx,W,H,wb.x+4,wb.y+4,'5′ → 3′: first base inside',COL.dim,SM_FONT,'left','top');
  HIT.push({kind:'wheel',cx,cy,R,b:box(cx-R,cy-R,2*R,2*R)});
  /* the nine neighbours */
  if(parts[1]){
    const nb=parts[1];
    const head=rna(Co.c)+' → '+(Co.k?short3(Co.k):'stop');
    const rows=Co.nb, rh=Math.min(26,(nb.h-40)/rows.length);
    const bb=box(nb.x+150,nb.y+24,nb.w-170,rh*rows.length);
    if(Co.k) axesT(ctx,bb,-9,9,0,rows.length,{xticks:[-8,-4,0,4,8],xfmt:v=>signed(v,0),yticks:[],xlab:'change in hydropathy',title:titleFor(nb,'the nine neighbours of '+head,head)});
    else { frame(ctx,bb,COL.edge); title(ctx,W,H,bb,'the nine neighbours of '+head,head);
      lab(ctx,W,H,bb.x+bb.w/2,bb.y+bb.h/2,'a stop codon has no hydropathy to compare',COL.dim,LAB_FONT,'center','middle'); }
    rows.forEach((n,i)=>{ const y=bb.y+(i+0.5)*rh, pos=['1st','2nd','3rd'][n.pos];
      const txt=rna(n.codon)+'  '+(n.one==='*'?'stop':short3(n.k)), col=n.syn?COL.pos:n.one==='*'?COL.ref:'#d8dce6';
      lab(ctx,W,H,nb.x+4,y,txt,col,LAB_FONT,'left','middle');
      lab(ctx,W,H,nb.x+96,y,pos,COL.dim,SM_FONT,'left','middle');
      if(Co.k&&n.dkd!==null){ const X0=bb.x+bb.w/2, X1=bb.x+bb.w*(n.dkd+9)/18;
        ctx.fillStyle=n.syn?COL.pos:Math.abs(n.dkd)>4?COL.ref:COL.struct; ctx.fillRect(Math.min(X0,X1),y-rh*0.28,Math.max(1.5,Math.abs(X1-X0)),rh*0.56); }
      else if(Co.k) lab(ctx,W,H,bb.x+bb.w/2+6,y,'stop: the chain ends',COL.ref,SM_FONT,'left','middle'); });
  }
  /* the shuffles */
  { const bb=L.bottom[0], S=Co.sh, hmax=Math.max.apply(null,S.hist);
    axesT(ctx,bb,6,20,0,hmax*1.15,{xticks:[6,8,10,12,14,16,18,20],xfmt:v=>fmt(v,0),yticks:ticksFor(0,hmax*1.1,3),yfmt:v=>fmt(v,0),xlab:'mean squared hydropathy change',ylab:'codes',
      title:titleFor(bb,'10,000 shuffled codes: '+S.better+' do better than the real one ('+fmt(100*S.better/S.n,1)+' %)',S.better+' of 10,000 better')});
    S.hist.forEach((c,i)=>{ if(i<6||!c) return; const x0=bb.x+bb.w*(i-6)/14, x1=bb.x+bb.w*(i+1-6)/14, y=bb.y1-bb.h*c/(hmax*1.15);
      ctx.fillStyle=COL.struct; ctx.fillRect(x0+1,y,x1-x0-2,bb.y1-y); });
    polyline(ctx,bb,[S.real,S.real],[0,hmax*1.15],6,20,0,hmax*1.15,COL.live,2);
    lab(ctx,W,H,bb.x+bb.w*(S.real-6)/14-5,bb.y+6,'the real code: '+fmt(S.real,2),COL.live,SM_FONT,'right','top');
    lab(ctx,W,H,bb.x+bb.w*(S.mean-6)/14,bb.y+6,'mean '+fmt(S.mean,2),COL.dim,SM_FONT,'center','top');
  }
  if(L.bottom.length>1){
    const bb=L.bottom[1], Sy=Co.syn;
    axesT(ctx,bb,0,3,0,1,{xticks:[],yticks:[0,0.5,1],yfmt:v=>fmt(100*v,0)+' %',ylab:'share'});
    titleRow(ctx,W,H,bb,[['a point mutation by position:','#aeb6c6',TITLE_FONT],['same amino acid',COL.pos,LAB_FONT],['another',COL.struct,LAB_FONT],['stop',COL.ref,LAB_FONT]]);
    for(let p=0;p<3;p++){
      const tot=Sy.tot[p]+Sy.stop[p], parts3=[[Sy.syn[p],COL.pos],[Sy.tot[p]-Sy.syn[p],COL.struct],[Sy.stop[p],COL.ref]];
      let acc=0; const x=bb.x+bb.w*(p+0.2)/3, w=bb.w*0.6/3;
      for(const [v,col] of parts3){ const y0=bb.y1-bb.h*acc/tot, y1=bb.y1-bb.h*(acc+v)/tot; ctx.fillStyle=col; ctx.fillRect(x,y1,w,y0-y1); acc+=v; }
      lab(ctx,W,H,x+w/2,bb.y1+4,['1st','2nd','3rd'][p]+': '+Sy.syn[p]+' of '+Sy.tot[p]+' synonymous',COL.dim,SM_FONT,'center','top');
    }
  }
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  dispatch and the scene                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='mol') drawMol(ctx,W,H,M);
  else if(M.view==='twenty') drawTwenty(ctx,W,H,M);
  else if(M.view==='chiral') drawChiral(ctx,W,H,M);
  else if(M.view==='chain') drawChain(ctx,W,H,M);
  else if(M.view==='rama') drawRama(ctx,W,H,M);
  else drawCode(ctx,W,H,M);
}
function camKeys(view){ return view==='mol'||view==='twenty'?['camTheta','camPhi']:view==='chain'?['chTheta','chPhi']:null; }
function setFromMap(h,x,y){
  const b=h.b, ph=Math.round(clamp(-180+360*(x-b.x)/b.w,-180,180)), ps=Math.round(clamp(180-360*(y-b.y)/b.h,-180,180));
  if(ph===ST.phi&&ps===ST.psi) return false;
  ST.phi=ph; ST.psi=ps; return true;
}
function pickCodon(h,x,y){
  const c=codonAt(h,x,y); if(!c) return false;
  ST.b1=c[0]; ST.b2=c[1]; ST.b3=c[2];
  if(GCODE[c]!=='*') ST.aa=ONE2THREE[GCODE[c]];
  return true;
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  /* the pointer: orbit the 3-D views, click a molecule in the gallery, set (phi, psi) on a map, pick a codon */
  S.pointer=function(type,x,y){
    if(type==='up'){
      const was=DRAG.what; DRAG.what=null;
      if(was==='maybe'&&DRAG.hit){ ST.aa=DRAG.hit.id; if(ST.view==='twenty') ST.centre='CA'; return true; }
      return was!==null;
    }
    if(type==='down'){
      const hit=hitAt(x,y);
      if(hit&&hit.kind==='rama'){ DRAG.what='rama'; DRAG.hit=hit; setFromMap(hit,x,y); return true; }
      if(hit&&hit.kind==='wheel') return pickCodon(hit,x,y);
      const keys=camKeys(ST.view); if(!keys) return false;
      DRAG.what=hit&&hit.kind==='aa'?'maybe':'cam'; DRAG.hit=hit; DRAG.x=x; DRAG.y=y; DRAG.th=ST[keys[0]]; DRAG.ph=ST[keys[1]];
      return DRAG.what==='cam';
    }
    if(type==='move'){
      if(DRAG.what==='rama') return setFromMap(DRAG.hit,x,y);
      if(DRAG.what==='maybe'&&Math.hypot(x-DRAG.x,y-DRAG.y)>4) DRAG.what='cam';
      if(DRAG.what==='cam'){ const keys=camKeys(ST.view); ST[keys[0]]=DRAG.th-(x-DRAG.x)*0.008; ST[keys[1]]=clamp(DRAG.ph+(y-DRAG.y)*0.008,-1.5,1.5); return true; }
    }
    return false;
  };
  return S;
}

  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncPanel(){
    const v=st.view, three=v==='mol'||v==='twenty'||v==='chiral';
    gPick.hidden=!(three||v==='code'); gDraw.hidden=!(three||v==='chain'); gTwenty.hidden=(v!=='twenty');
    gChiral.hidden=(v!=='chiral'); gAngles.hidden=!(v==='chain'||v==='rama'); gChain.hidden=(v!=='chain');
    gRama.hidden=(v!=='rama'); gCode.hidden=(v!=='code');
    rows.cb_names.row.hidden=(v!=='mol');
    const centres=chiralCentres(st.aa);
    centreChips.hidden=!(centres.length>1&&st.chMode==='cip');
    modeChips.hidden=!centres.length;
    for(const k in rows) rows[k].sync();
    const p=PROPS[st.aa];
    pickTag.innerHTML=p.name+' &middot; '+p.one+' &middot; '+codonsOf(st.aa).length+' codon'+(codonsOf(st.aa).length>1?'s':'');
    chiralTag.innerHTML=!centres.length?'glycine has no stereocentre':centres.length>1?'two stereocentres: C&alpha; and C&beta;'+(st.chMode==='corn'?' (CORN reads C&alpha; only)':''):'one stereocentre, C&alpha;';
    const hp=helixParams(st.phi,st.psi,st.omega);
    anglesTag.innerHTML='n = '+fmt(Math.abs(hp.n),2)+(hp.n>0?' (right-handed)':' (left-handed)')+', rise '+fmt(hp.rise,2)+' &Aring; &middot; '+(stericAllowed(st.phi,st.psi,st.f,st.gly)?'<span class="g">allowed</span>':'<span class="r">a clash</span>')+' at f = '+fmt(st.f,2);
    const c=codonOf(st), one=GCODE[c];
    codeTag.innerHTML=rna(c)+' &rarr; '+(one==='*'?'<span class="r">stop</span>':'<b>'+PROPS[ONE2THREE[one]].name+'</b>')+' &middot; click the wheel too';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space stops the turning &nbsp; <b>r</b> restarts it';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='twenty'?'click a molecule to select it · drag to turn · 1–6 switch views'
        :v==='rama'?'click or drag on the map to set (φ, ψ) · 1–6 switch views'
        :v==='code'?'click a codon on the wheel · 1–6 switch views'
        :camKeys(v)?'drag to turn the view · space stops the turning · 1–6 switch views':'1–6 switch views';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); syncChips(); syncPanel(); dirty=true; refresh(); }
    else canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); tagEl.innerHTML=tagHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.spin=!st.spin; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ simReset(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

  /* the frame spin: the chain's atoms keep their distance from the axis while it turns */
  withState({view:'chain'},()=>{ const Cn=buildModel().Cn, F=chainFrame(Cn.ch,Cn.hp); let worst=0;
    for(const t of [0,1,2.5]){ const A=matMul(rotX(0.9*t),F.rows); for(const r of Cn.ch){ const p=matVec(A,V.sub(r.CA,F.c)); worst=Math.max(worst,Math.abs(Math.hypot(p[1],p[2])-Cn.hp.radius)); } }
    ok(worst<1e-9,'turning about +x keeps every CA on the helix radius'); });

  /* ---------- M. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['mol ALA',{view:'mol'},18],['mol TRP space names',{view:'mol',aa:'TRP',style:'space',names:true},30],['mol ARG sticks no H',{view:'mol',aa:'ARG',style:'stick',showH:false},20],
    ['mol GLY top',{view:'mol',aa:'GLY',camPhi:1.5},15],['mol CYS turned',{view:'mol',aa:'CYS',frames:120,camTheta:0.4,camPhi:-1.2,names:true},18],['mol ASP',{view:'mol',aa:'ASP'},20],
    ['twenty',{view:'twenty'},300],['twenty kd space',{view:'twenty',sortBy:'kd',style:'space',aa:'TRP'},200],['twenty mass sticks',{view:'twenty',sortBy:'mass',style:'stick',showH:false},100],['twenty pI turned',{view:'twenty',sortBy:'pI',frames:200},200],
    ['chiral ALA',{view:'chiral'},50],['chiral CYS',{view:'chiral',aa:'CYS',frames:50},50],['chiral THR CB',{view:'chiral',aa:'THR',centre:'CB'},50],['chiral ILE corn',{view:'chiral',aa:'ILE',chMode:'corn',frames:90},50],
    ['chiral GLY',{view:'chiral',aa:'GLY'},40],['chiral PRO space',{view:'chiral',aa:'PRO',style:'space'},50],['chiral TRP no H',{view:'chiral',aa:'TRP',showH:false},50],
    ['chain alpha',{view:'chain'},200],['chain beta',{view:'chain',phi:-135,psi:135,nres:20},200],['chain ppii gly',{view:'chain',phi:-75,psi:150,gly:true},150],
    ['chain half turn',{view:'chain',phi:-120,psi:120,frames:40},150],['chain 4 omega150',{view:'chain',nres:4,omega:150,phi:0,psi:0,style:'space'},30],['chain pi 20',{view:'chain',phi:-41,psi:-89,nres:20,chPhi:1.4},200],
    ['rama',{view:'rama'},200],['rama 0.70 no gly',{view:'rama',f:0.70,glyMap:false},150],['rama 0.95 empty',{view:'rama',f:0.95,crambin:false,phi:180,psi:-180},15],['rama clash gly',{view:'rama',phi:60,psi:-120,gly:true},150],
    ['code AUG',{view:'code'},150],['code UAA',{view:'code',b1:'T',b2:'A',b3:'A'},150],['code UGG leu',{view:'code',b1:'T',b2:'G',b3:'G',aa:'LEU'},150],['code GGG',{view:'code',b1:'G',b2:'G',b3:'G',aa:'GLY'},150],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
