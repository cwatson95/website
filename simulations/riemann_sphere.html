  const [bp,bs]=twoBoxes(W,fc.capY);
  const Fr=planeFrame(bp,PL);
  /* the plane: one cell per ~4 px, each the colour of f at its centre */
  const n=Math.max(24,Math.min(110,Math.round(Fr.sq.w/4))), cw=Fr.sq.w/n;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const z=[-PL+2*PL*(i+0.5)/n,-PL+2*PL*(j+0.5)/n];
    ctx.fillStyle=rgbStr(fnRGB(F,hp(z))); ctx.fillRect(Fr.sq.x+i*cw,Fr.sq.y1-(j+1)*cw,cw+0.6,cw+0.6); }
  planeAxes(ctx,Fr,titleFor(Fr.sq,'the plane','the plane'));
  const mk=(z,kind)=>{ if(z===null) return; if(kind==='zero') planeDot(ctx,Fr,z,5.5,COL.zero,'#000');
    else if(kind==='pole') planeDot(ctx,Fr,z,5.5,COL.pole,'#ffffff');
    else if(kind==='crit'){ if(Math.abs(z[0])<=PL&&Math.abs(z[1])<=PL){ const X=Fr.X(z[0]), Y=Fr.Y(z[1]); ctx.beginPath(); ctx.moveTo(X-4,Y-4); ctx.lineTo(X+4,Y+4); ctx.moveTo(X-4,Y+4); ctx.lineTo(X+4,Y-4); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.stroke(); } }
    else planeDot(ctx,Fr,z,5,COL.live,'#ffffff'); };
  if(F.id!=='newton') for(const o of S.A.crit) mk(o.z,'crit');
  for(const o of S.A.zeros) if(F.id!=='newton') mk(o.z,'zero'); for(const o of S.A.poles) mk(o.z,'pole');
  if(F.id==='newton') for(const r of F.roots) planeDot(ctx,Fr,r,5.5,COL.zero,'#000');
  else for(const z of S.pre.pts) mk(z,'pre');
  /* the sphere, painted */
  const C=sphereCam(bs,st.camTh,st.camPh,Math.max(30,0.42*Math.min(bs.w,bs.h)));
  const nq=paintSphere(ctx,C,56,112,P=>rgbStr(fnRGB(F,sphereToH(P))));
  const sDot=(P,r,fill,ring)=>{ if(!frontFacing(C,P)) return; const q=C.P(P); if(q) dot(ctx,q.x,q.y,r,fill,ring,1.2); };
  const sCross=P=>{ if(!frontFacing(C,P)) return; const q=C.P(P); if(!q) return; ctx.beginPath(); ctx.moveTo(q.x-4,q.y-4); ctx.lineTo(q.x+4,q.y+4); ctx.moveTo(q.x-4,q.y+4); ctx.lineTo(q.x+4,q.y-4); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.stroke(); };
  const P3=z=>z===null?[0,0,1]:zToSphere(z);
  if(F.id!=='newton') for(const o of S.A.crit) sCross(P3(o.z));
  if(F.id!=='newton') for(const o of S.A.zeros) sDot(P3(o.z),5.5,COL.zero,'#000');
  for(const o of S.A.poles) sDot(P3(o.z),5.5,COL.pole,'#ffffff');
  if(F.id==='newton') for(const r of F.roots) sDot(zToSphere(r),5.5,COL.zero,'#000');
  else { for(const z of S.pre.pts) sDot(zToSphere(z),5,COL.live,'#ffffff'); for(let k=0;k<S.pre.nInf;k++) sDot([0,0,1],5,COL.live,'#ffffff'); }
  const Nq=frontFacing(C,[0,0,1])?C.P([0,0,1]):null; if(Nq) lab(ctx,W,H,Nq.x+8,Nq.y-9,'∞',COL.text,LAB_FONT,'left','middle',PLATE);
  panelTitle(ctx,W,H,bs,'the sphere');
  HIT.push({kind:'orbit',b:bs,C});
  caption(ctx,20,fc.capY,fc.txt,fc.capW);
  return {F:Fr,C,cells:n*n,quads:nq};
}

/* ---------------- 5. spin states ---------------- */
function spinCaption(S,short){
  const jt=S.j2%2?S.j2+'/2':String(S.j2/2);
  if(short) return 'A spin-'+jt+' state as '+S.j2+' points on the sphere, Majorana’s stars.';
  if(S.none) return 'That state needs another spin: the tetrahedron is a spin-2 state, the octahedron spin 3.';
  return 'A spin-'+jt+' state has 2j + 1 = '+(S.j2+1)+' amplitudes, and Majorana showed it is exactly '+S.j2+' points on the sphere (green): the roots of one polynomial, drawn on the plane at right and carried to the sphere by the projection. '
    +'A coherent state has all its stars at one point, |j, m⟩ has j + m at N and j − m at S, the cat state is a ring on the equator. '
    +'Turning the state by exp(−iθ n·J) turns the whole constellation rigidly about n'+(S.th!==0?' (orange: before the turn)':'')+', which is the Möbius map of the rotation acting on each root.';
}
function drawSpin(ctx,W,H,M){
  const S=M.S, st=M.st;
  const fc=fitCaption(ctx,W,H,spinCaption(S,false),spinCaption(S,true),W-40,300); reserveCaption(W,H,fc);
  const [bp,bs]=twoBoxes(W,fc.capY);
  const C=sphereCam(bs,st.camTh,st.camPh,Math.max(30,0.42*Math.min(bs.w,bs.h))), G=glassScene(C);
  G.curve(sphereCurveOf(t=>cpolar(1,TAU*t),96),COL.lat,1,{on:true});
  for(const ph of [0,60,120]) G.curve(sphereCurveOf(t=>t<=0||t>=1?null:cpolar(Math.tan(Math.PI/2*t),ph*D2R),60).concat(sphereCurveOf(t=>t<=0||t>=1?null:cpolar(Math.tan(Math.PI/2*(1-t)),ph*D2R+Math.PI),60)),COL.lat,0.9,{on:true});
  const ax=S.ax, AX=1.3; G.curve([[-AX*ax[0],-AX*ax[1],-AX*ax[2]],[AX*ax[0],AX*ax[1],AX*ax[2]]],'#9aa3b8',1.2,{dash:[5,4]});
  if(!S.none){
    if(S.th!==0) for(const p of S.stars0) G.point(p,COL.ref,4,{on:true,hollow:true});
    for(const [a,b] of S.edges) G.curve([S.stars[a],S.stars[b]],'#7fae3a',1.3);
    for(const p of S.stars) G.point(p,COL.pos,5.5,{on:true,ring:'#0a2a10',backFill:true});
    const J=S.J, jl=S.j2/2; G.curve([[0,0,0],[J[0]/jl,J[1]/jl,J[2]/jl]],COL.live,2);
  }
  stageClip(ctx,W,fc); G.draw(ctx); ctx.restore();
  /* N marked by its letter, not by a dot a star could be taken for; the axis named at whichever end stays in the panel */
  const Nq=frontFacing(C,[0,0,1])?C.P([0,0,1]):null; if(Nq) lab(ctx,W,H,Nq.x+7,Nq.y-9,'N',COL.dim,SM_FONT,'left','middle',PLATE);
  for(const sg of [1,-1]){ const tp=C.P([sg*AX*ax[0],sg*AX*ax[1],sg*AX*ax[2]]);
    if(tp&&tp.x>bs.x+8&&tp.x<bs.x1-24&&tp.y>bs.y+24&&tp.y<bs.y1-8){ lab(ctx,W,H,tp.x+(sg>0?6:-6),tp.y-8,sg>0?'n':'−n',COL.text,LAB_FONT,sg>0?'left':'right','middle',PLATE); break; } }
  panelTitle(ctx,W,H,bs,'the sphere');
  /* the plane: the polynomial's roots */
  const Fr=planeFrame(bp,PL);
  planeAxes(ctx,Fr,titleFor(Fr.sq,'the roots in the plane','the roots'));
  planeCurve(ctx,Fr,t=>cpolar(1,TAU*t),120,COL.grid,1);
  let off=0;
  if(!S.none){ if(S.th!==0) for(const p of S.stars0){ const z=sphereToZ(p); if(z) planeDot(ctx,Fr,z,4,null,COL.ref); }
    for(const p of S.stars){ const z=sphereToZ(p); if(z===null) off++; else if(!planeDot(ctx,Fr,z,5,COL.pos,'#0a2a10')) off++; } }
  if(off) lab(ctx,W,H,Fr.sq.x+6,Fr.sq.y+12,off+' '+(off>1?'stars are':'star is')+' off the plane'+(S.stars.filter(p=>p[2]>1-1e-9).length?' (at ∞ = N)':''),COL.dim,SM_FONT,'left','middle',PLATE);
  HIT.push({kind:'orbit',b:bs,C});
  caption(ctx,20,fc.capY,fc.txt,fc.capW);
  return {F:Fr,C,off};
}

/* ---------------- 6. the sky ---------------- */
const SKY_L=2.2;
/* the observer's forward chart: the sky turned so the direction of motion is N, then omega = -1/zeta (the view along
   the motion from inside the sphere, up = +Y); |omega| = tan(theta/2), theta the angle from the direction of motion */
function skyChart(S,P){ const R=rotToFrom(S.b), q=rotVec(R.n,-R.th,P), z=sphereToZ(q); return z===null?[0,0]:(cabs(z)===0?null:cneg(cdiv(C1,z))); }
function dopRGB(D){ const t=clamp(Math.log(D)/Math.log(4),-1,1);
  return t>=0?rgbStr([Math.round(215-120*t),Math.round(225-60*t),255]):rgbStr([255,Math.round(215+70*t),Math.round(190+150*t)]); }
function skyCaption(S,short){
  if(short) return 'The sky seen moving at β = '+sigf(S.beta,3)+': the stars crowd forward, and every circle stays a circle.';
  return 'An observer moving at β = '+sigf(S.beta,3)+' toward the centre of the chart sees each star moved by one Möbius map of the sky, ζ′ = exp(η) ζ in the frame of the motion (exp η = '+sigf(Math.exp(S.eta),4)+'): '
    +'the stars crowd forward ('+sigf(100*S.ahead,3)+' % of these '+S.stars.length+' now ahead, against '+sigf(100*S.ahead0,3)+' % at rest), each coloured by its Doppler factor (bluer ahead, redder behind) with a disc whose area goes as the flux, ×D². '
    +'The round object (orange at rest, green seen moving) stays round, because a Möbius map takes circles to circles: a sphere always looks round (Penrose, Terrell 1959). The faint rings are the angles from the direction of motion at rest; the bright ones where they are seen.';
}
function drawSky(ctx,W,H,M){
  const S=M.S, st=M.st;
  const fc=fitCaption(ctx,W,H,skyCaption(S,false),skyCaption(S,true),W-40,300); reserveCaption(W,H,fc);
  const [bp,bs]=twoBoxes(W,fc.capY);
  /* the chart */
  const Fr=planeFrame(bp,SKY_L);
  axesT(ctx,Fr.sq,-SKY_L,SKY_L,-SKY_L,SKY_L,{title:titleFor(Fr.sq,'the sky ahead, as the observer sees it','the sky ahead'),xticks:[],yticks:[]});
  for(const deg of [30,60,90,120]){ const r0=Math.tan(deg*D2R/2), r1=Math.exp(-S.eta)*r0;
    planeCurve(ctx,Fr,t=>cpolar(r0,TAU*t),120,'#26324a',1,[3,4]);
    planeCurve(ctx,Fr,t=>cpolar(r1,TAU*t),120,'#3d557c',1.1);
    if(r1<SKY_L*0.92){ const X=Fr.X(r1*Math.cos(-0.5)), Y=Fr.Y(r1*Math.sin(-0.5)); lab(ctx,W,H,X+3,Y+8,deg+'°','#7e8aa6',SM_FONT,'left','middle',PLATE); } }
  let shown=0;
  for(const s of S.stars){ const w=skyChart(S,s.p); if(!w||Math.abs(w[0])>SKY_L||Math.abs(w[1])>SKY_L) continue;
    const r=clamp((st.skyDop?1.1*s.D:1.1)*Math.sqrt(s.b),0.55,4.5), col=st.skyDop?dopRGB(s.D):'#d6dbe6';
    dot(ctx,Fr.X(w[0]),Fr.Y(w[1]),r,col,null); shown++; }
  if(st.skyRing){ planeCurve(ctx,Fr,t=>skyChart(S,S.ring0[Math.min(S.ring0.length-1,Math.round(t*(S.ring0.length-1)))]),S.ring0.length-1,COL.ref,1.4,[4,3]);
    planeCurve(ctx,Fr,t=>skyChart(S,S.ring[Math.min(S.ring.length-1,Math.round(t*(S.ring.length-1)))]),S.ring.length-1,COL.pos,1.8); }
  dot(ctx,Fr.X(0),Fr.Y(0),3,null,'#ffffff',1.2);
  /* the celestial sphere from outside */
  const C=sphereCam(bs,st.camTh,st.camPh,Math.max(30,0.42*Math.min(bs.w,bs.h))), G=glassScene(C);
  const R=rotToFrom(S.b), tw=v=>rotVec(R.n,R.th,v);
  for(const deg of [30,60,90,120,150]){ const a=deg*D2R; G.curve(capRing(S.b,Math.cos(a),Math.sin(a),72),'#26324a',0.8,{on:true}); }
  for(const s of S.stars){ G.point(s.p,st.skyDop?dopRGB(s.D):'#d6dbe6',clamp((st.skyDop?0.9*s.D:0.9)*Math.sqrt(s.b),0.5,3.2),{on:true,ring:false,backFill:true}); }
  if(st.skyRing){ G.curve(S.ring0,COL.ref,1.3,{on:true,dash:[4,3]}); G.curve(S.ring,COL.pos,1.8,{on:true}); }
  G.curve([[0,0,0],[1.45*S.b[0],1.45*S.b[1],1.45*S.b[2]]],COL.live,2);
  stageClip(ctx,W,fc); G.draw(ctx); ctx.restore();
  const tip=C.P([1.45*S.b[0],1.45*S.b[1],1.45*S.b[2]]); if(tip&&tip.x<plotRight(W)-4&&tip.y>bs.y) labBeside(ctx,W,H,tip.x,tip.y,6,-8,'v',COL.live,LAB_FONT,plotRight(W)-4,PLATE);
  panelTitle(ctx,W,H,bs,'the celestial sphere');
  HIT.push({kind:'orbit',b:bs,C});
  caption(ctx,20,fc.capY,fc.txt,fc.capW);
  return {F:Fr,C,shown};
}

/* ---------------- dispatch, and the scene ---------------- */
function drawView(ctx,W,H,M){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  LABELS=[]; POLY_SEGS=[]; HIT=[]; DRAW_SEQ=0;
  const v=M.st.view;
  if(v==='proj') return drawProj(ctx,W,H,M);
  if(v==='circles') return drawCircles(ctx,W,H,M);
  if(v==='mobius') return drawMobius(ctx,W,H,M);
  if(v==='func') return drawFunc(ctx,W,H,M);
  if(v==='spin') return drawSpin(ctx,W,H,M);
  return drawSky(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST, W:800, H:600, drag:null, playing:false};
  S.model=()=>buildModel();
  S.draw=()=>{ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,S.model()); };
  /* the Moebius flow plays when asked: t runs 0 -> 1 in four seconds, then again */
  S.step=(dt)=>{ if(!(ST.view==='mobius'&&ST.play)) return false; ST.t=((ST.t+(dt||1/60)/4)%1+1)%1; return true; };
  /* a press: grab a handle (zeta, a centre, a fixed point), or turn the view; returns true when anything changed */
  S.pointer=(kind,x,y)=>{
    if(kind==='up'){ const was=!!S.drag; S.drag=null; return was; }
    if(kind==='move'){ if(!S.drag) return false; return dragTo(S.drag,x,y); }
    let best=null, bd=12;
    for(const h of HIT){ if(h.kind==='orbit') continue; const d=Math.hypot(h.x-x,h.y-y); if(d<bd){ bd=d; best=h; } }
    if(best){ S.drag=best; return dragTo(best,x,y); }
    const o=HIT.find(h=>h.kind==='orbit'&&x>=h.b.x&&x<=h.b.x1&&y>=h.b.y&&y<=h.b.y1);
    if(o){ S.drag={kind:'orbit',x0:x,y0:y,th:ST.camTh,ph:ST.camPh}; return false; }
    return false;
  };
  function dragTo(h,x,y){
    if(h.kind==='orbit'){ ST.camTh=h.th-(x-h.x0)*0.008; ST.camPh=clamp(h.ph+(y-h.y0)*0.008,-1.45,1.45); return true; }
    if(h.kind==='zeta'){ const p=rayToPlane(h.C,x,y,0); if(!p) return false; const r=Math.hypot(p[0],p[1]);
      ST.zR=clamp(r,LIM.zR[0],LIM.zR[1]); ST.zA=Math.round(Math.atan2(p[1],p[0])/D2R*10)/10; return true; }
    if(h.kind==='centre'){ const p=rayToPlane(h.C,x,y,0); if(!p) return false;
      const px=clamp(p[0],-2.2,2.2), py=clamp(p[1],-2.2,2.2);
      if(h.i===0){ ST.c1x=px; ST.c1y=py; } else { ST.c2x=px; ST.c2y=py; } return true; }
    if(h.kind==='fix'){ const z=h.F.toZ(x,y); ST[h.which]=[clamp(z[0],-PL,PL),clamp(z[1],-PL,PL)]; return true; }
    return false;
  }
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
/* the presets the arrow keys step through, per view */
const STEPS={proj:['grid',GRIDS], mobius:['mtype',MTYPES], func:['fn',FUNCS], spin:['sst',SSTATES]};
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false, last=0;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    if(st.view!==k) st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  /* a slider over [lo, hi]; log sliders run 0..LOGN and map through ofLog / logOf */
  function slider(key,lab,lo,hi,step2,fmtf,onchg,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  const logSlider=(key,lab,lo,hi,fmtf)=>slider(key,lab,0,LOGN,1,fmtf,null,{to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  const degSlider=(key,lab,lo,hi)=>slider(key,lab,lo,hi,1,v=>Math.round(v)+'°');
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=!!st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=!!st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.short||o.name,onclick:()=>{
      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')); }

  /* 1. the point */
  const gProj=h('div',{class:'grp'},h('h3',null,'the point ζ'));
  gProj.appendChild(logSlider('zR','|ζ|',LIM.zR[0],LIM.zR[1],v=>sigf(v,3)));
  gProj.appendChild(degSlider('zA','arg ζ',-180,180));
  gProj.appendChild(chipRow(GRIDS,'grid'));
  /* 2. the circles */
  const gCirc=h('div',{class:'grp'},h('h3',null,'the circles'));
  gCirc.appendChild(slider('c1x','centre 1, Re',-2,2,0.01,v=>sigf(v,2)));
  gCirc.appendChild(slider('c1y','centre 1, Im',-2,2,0.01,v=>sigf(v,2)));
  gCirc.appendChild(slider('c1r','radius 1',0.1,2.5,0.01,v=>sigf(v,3)));
  gCirc.appendChild(slider('c2r','radius 2',0.1,2.5,0.01,v=>sigf(v,3)));
  gCirc.appendChild(h('div',{class:'checks'},checkbox('circ2','a second circle'),checkbox('showCut','shade the plane that cuts circle 1')));
  /* 3. the map */
  const gMob=h('div',{class:'grp'},h('h3',null,'the map'));
  gMob.appendChild(chipRow(MTYPES,'mtype'));
  gMob.appendChild(h('div',{class:'tag'},'fixed points'));
  gMob.appendChild(chipRow(MFIX,'mfix'));
  gMob.appendChild(logSlider('kMod','|k|',LIM.kMod[0],LIM.kMod[1],v=>sigf(v,3)));
  gMob.appendChild(degSlider('kArg','arg k',-180,180));
  gMob.appendChild(logSlider('tauMod','|τ|',LIM.tauMod[0],LIM.tauMod[1],v=>sigf(v,3)));
  gMob.appendChild(degSlider('tauArg','arg τ',-180,180));
  gMob.appendChild(slider('t','along the flow, t',0,1,0.01,v=>sigf(v,2)));
  gMob.appendChild(h('div',{class:'checks'},checkbox('play','play the flow')));
  const mobTag=h('div',{class:'tag'}); gMob.appendChild(mobTag);
  /* 4. the function */
  const gFn=h('div',{class:'grp'},h('h3',null,'the function'));
  gFn.appendChild(chipRow(FUNCS,'fn'));
  gFn.appendChild(logSlider('wR','|w|',LIM.wR[0],LIM.wR[1],v=>sigf(v,3)));
  gFn.appendChild(degSlider('wA','arg w',-180,180));
  /* 5. the spin */
  const gSpin=h('div',{class:'grp'},h('h3',null,'the spin'));
  gSpin.appendChild(chipRow(SPINJ,'j2',()=>{ st.m2=clamp(st.m2,-st.j2,st.j2); if((st.m2-st.j2)%2) st.m2-=1; }));
  gSpin.appendChild(chipRow(SSTATES,'sst'));
  gSpin.appendChild(slider('m2','m (for |j, m⟩)',-6,6,1,v=>(v%2?(v<0?'−':'')+Math.abs(v)+'/2':String(v/2).replace('-','−'))));
  gSpin.appendChild(degSlider('cohTh','coherent: θ',0,180)); gSpin.appendChild(degSlider('cohPh','coherent: φ',-180,180));
  gSpin.appendChild(degSlider('axTh','axis n: θ',0,180)); gSpin.appendChild(degSlider('axPh','axis n: φ',-180,180));
  gSpin.appendChild(degSlider('rotAng','turn by',-180,180));
  const spinTag=h('div',{class:'tag'}); gSpin.appendChild(spinTag);
  /* 6. the motion */
  const gSky=h('div',{class:'grp'},h('h3',null,'the motion'));
  gSky.appendChild(slider('beta','β = v/c',0,LIM.beta[1],0.005,v=>sigf(v,3)));
  gSky.appendChild(degSlider('bTh','toward: θ',0,180)); gSky.appendChild(degSlider('bPh','toward: φ',-180,180));
  gSky.appendChild(h('div',{class:'checks'},checkbox('skyRing','a round object'),checkbox('skyDop','Doppler colour and brightness')));
  /* the view, and reset */
  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ st.camTh=DEFAULTS.camTh; st.camPh=DEFAULTS.camPh; dirty=true; refresh(); }},'reset the view'),
    h('button',{onclick:()=>{ const v=st.view; const d=JSON.parse(JSON.stringify(DEFAULTS)); Object.keys(st).forEach(k=>delete st[k]); Object.assign(st,d); st.view=v;
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  /* the prose's elements are kept as made, never looked up again (the DOM-stub harness resolves only #info and #phys) */
  const infoEl=h('div',{id:'info'}), physEl=h('div',{id:'phys'}), srcEl=h('div',{class:'src'});
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),infoEl,srcEl);
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),physEl);
  [gProj,gCirc,gMob,gFn,gSpin,gSky,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));

  function syncPanel(){
    const v=st.view;
    gProj.hidden=v!=='proj'; gCirc.hidden=v!=='circles'; gMob.hidden=v!=='mobius'; gFn.hidden=v!=='func'; gSpin.hidden=v!=='spin'; gSky.hidden=v!=='sky';
    const para=st.mtype==='para';
    rows.kMod.row.hidden=para||st.mtype==='ellip'; rows.kArg.row.hidden=para||st.mtype==='hyper';
    rows.tauMod.row.hidden=!para; rows.tauArg.row.hidden=!para;
    rows.c2r.row.hidden=!st.circ2;
    rows.m2.row.hidden=st.sst!=='jm'; rows.cohTh.row.hidden=st.sst!=='coh'; rows.cohPh.row.hidden=st.sst!=='coh';
    rows.m2.inp.min=-st.j2; rows.m2.inp.max=st.j2; rows.m2.inp.step=2;
    for(const k in rows) rows[k].sync();
    mobTag.innerHTML=st.mfix==='free'?'drag p and q about the plane':'';
    spinTag.innerHTML=(st.sst==='tetra'&&st.j2!==4)||(st.sst==='octa'&&st.j2!==6)?'<span class="r">'+(st.sst==='tetra'?'the tetrahedron is a spin-2 state':'the octahedron is a spin-3 state')+'</span>':'';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; &larr; &rarr; step through the presets &nbsp; drag the view to turn it';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='proj'?'drag ζ about the plane · drag elsewhere to turn the view':v==='circles'?'drag a centre · drag elsewhere to turn the view'
        :v==='mobius'?(st.mfix==='free'?'drag p or q · ':'')+'drag the sphere to turn it · ← → the four kinds':'drag the sphere to turn it · ← → step through the presets';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      srcEl.innerHTML=SRC_LINE;
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    const moved=S.pointer('down',e.clientX-r.left,e.clientY-r.top);
    canvas.classList.add('dragging');
    if(moved){ syncChips(); syncPanel(); dirty=true; refresh(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  /* the arrow keys: the view's presets, except in a slider, whose own they are */
  function stepPreset(d){ const s=STEPS[st.view]; if(!s) return; const [key,list]=s, i=list.findIndex(o=>o.id===st[key]);
    st[key]=list[(i+d+list.length)%list.length].id; syncChips(); syncPanel(); dirty=true; refresh(); }
  window.addEventListener('keydown',e=>{
    const inRange=e.target&&e.target.type==='range';
    if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
    else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!inRange){ e.preventDefault(); stepPreset(e.key==='ArrowRight'?1:-1); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(ts){
    const dt=last?Math.min(0.1,(ts-last)/1000):1/60; last=ts;
    const advanced=S.step(dt);
    if(advanced){ rows.t.sync(); }
    if(advanced||dirty){ dirty=false; try{ if(advanced){ const M=S.model(); roEl.innerHTML=readoutHTML(M); } S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* ================================================================== *
 *  the prose: what each view shows, and the calculation behind it     *
 * ================================================================== */
const INFO={
  proj:'The Riemann sphere is the complex plane with one point added, <b>∞</b>, and made round. Stand the unit sphere on the plane through its equator and draw the line '
    +'from the north pole N through a point ζ of the plane: it meets the sphere once more, at P. That pairs every point of the plane with one point of the sphere, and '
    +'leaves N over, which no line from the plane reaches: N is ∞. Far out in any direction the plane crowds round that one point, which is why a function can have a value, '
    +'a zero or a pole <i>at</i> infinity. The pairing keeps angles (it is conformal), so a small figure in the plane is drawn on the sphere at the same shape, scaled by 2/(1 + |ζ|²).',
  circles:'Stereographic projection takes circles to circles. A circle in the plane is where some plane cuts the sphere, and a line in the plane is a circle through N, '
    +'a circle that happens to pass through ∞, so on the sphere lines and circles are one family. With angles kept as well, this is what makes the sphere the natural stage '
    +'for the Möbius maps: they are exactly the maps of the sphere onto itself that keep angles, and they take circles to circles.',
  mobius:'A Möbius map ζ → (aζ + b)/(cζ + d) moves the whole sphere, ∞ included, and every conformal map of the sphere onto itself is one. Apart from the identity it fixes one '
    +'point or two, and near its fixed points it multiplies distances by k and 1/k. That splits them into four kinds: <b>elliptic</b> maps turn the sphere about the two fixed points '
    +'(when those are antipodes, a rigid rotation), <b>hyperbolic</b> ones push it from one fixed point to the other, <b>loxodromic</b> ones do both, and <b>parabolic</b> ones have a '
    +'single fixed point that everything flows into and out of again. The kind is read off one number, tr² of the matrix scaled to determinant 1.',
  func:'A rational function f = p/q is a map of the sphere to itself, and on the sphere nothing about ∞ is special: a polynomial of degree d has a pole of order d there. So f '
    +'always has as many zeros as poles, its degree, and it takes every value that many times. The phase portrait colours each point by the argument of f, so zeros and poles show '
    +'as the points where all the colours meet, turning opposite ways. Newton’s method for z³ − 1 is itself such a map, and its three basins, each a third of the sphere, meet only on a fractal.',
  spin:'The states of a spin ½ are the points of a sphere, and the ratio of the two amplitudes is the point’s coordinate on the Riemann sphere. Majorana (1932) found that a spin-j '
    +'state is 2j points on the same sphere, the roots of one polynomial: a coherent state, the nearest thing to a classical spin, has all its stars at one point; |j, m⟩ splits them '
    +'between the poles; the most “unpolarized” states put them at the corners of a solid. A rotation of the spin moves the constellation rigidly.',
  sky:'The sky is a sphere of directions, and it is a Riemann sphere on which the Lorentz group acts as the Möbius maps (the same fact, SL(2, C) as the Lorentz group, that makes spinors work): '
    +'rotations are the elliptic maps, boosts the hyperbolic ones. So an observer moving through a field of stars sees them crowd toward the direction of motion (aberration) by one Möbius map, '
    +'and since those take circles to circles, a sphere always looks round however fast it passes, as Penrose and Terrell each showed in 1959. The star field here is made up: '+SKY.length+' directions spread uniformly over the sky.',
};

const SRC_LINE='Everything on this page is mathematics; nothing is measured. Every formula is checked against build_riemann/derive.py (sympy exactly, mpmath at 30 digits, numpy, scipy). '
  +'The sky’s stars are made up: '+SKY.length+' directions uniform on the sphere (mulberry32, seed 20260927).';

const EQ=(body,n)=>'<span class="eq">'+body+(n?'<span class="n">('+n+')</span>':'')+'</span>';
const DERIV={
  proj:'<h4>The projection</h4><p>The unit sphere X² + Y² + Z² = 1, the plane its equatorial plane, the projection from N = (0, 0, 1). For ζ = x + iy the line from N '
    +'through (x, y, 0) meets the sphere again at</p>'
    +EQ('P = (2x, 2y, |ζ|<sup>2</sup> − 1)/(|ζ|<sup>2</sup> + 1), &nbsp; ζ = (X + iY)/(1 − Z) = (1 + Z)/(X − iY)',1)
    +'<p>The second form of the inverse is the one to use above the equator, where 1 − Z loses its digits. The page keeps every point as a pair [z<sub>1</sub>, z<sub>2</sub>] with ζ = z<sub>1</sub>/z<sub>2</sub>, '
    +'so ∞ is [1, 0] and needs no special case; then P = (2 Re z<sub>1</sub>z̄<sub>2</sub>, 2 Im z<sub>1</sub>z̄<sub>2</sub>, |z<sub>1</sub>|² − |z<sub>2</sub>|²)/(|z<sub>1</sub>|² + |z<sub>2</sub>|²).</p>'
    +'<h4>Angles, lengths, area</h4><p>The images of d/dx and d/dy are orthogonal and of equal length, so the projection is conformal, with</p>'
    +EQ('ds = 2|dζ|/(1 + |ζ|<sup>2</sup>), &nbsp; |P(z) − P(w)| = 2|z − w| / √((1 + |z|<sup>2</sup>)(1 + |w|<sup>2</sup>))',2)
    +'<p>and the chord to ∞ is 2/√(1 + |ζ|²). The area element 4 dx dy/(1 + |ζ|²)² integrates to 4π over the plane, and to 2π over the unit disk, the southern hemisphere.</p>'
    +'<h4>Checked</h4><p>derive.py proves (1) and (2) exactly in sympy, with the area; the page’s P, stretch and chords match its numbers to 10<sup>−13</sup>, the round trip holds from 10<sup>−7</sup> to 10<sup>6</sup>, '
    +'and two directions at a point meet on the sphere at the angle they met at in the plane.</p>',
  circles:'<h4>A circle is a plane’s cut</h4><p>Put ζ = (X + iY)/(1 − Z) into |ζ − c|² = r², c = a + ib, and use X² + Y² = 1 − Z²: the circle’s points satisfy</p>'
    +EQ('2aX + 2bY + (|c|<sup>2</sup> − r<sup>2</sup> − 1)Z = 1 + |c|<sup>2</sup> − r<sup>2</sup>',3)
    +'<p>a plane n·P = k. Its normal n = (2a, 2b, |c|² − r² − 1) points to the circle’s centre on the sphere, and |n|² − k² = 4r², so the angular radius α has cos α = k/|n| and sin α = 2r/|n|. '
    +'The disk is the cap n·P &gt; k: the left side of (3) minus the right is 2r²/(1 + |c|²) at the disk’s centre and −2 at N. A line e·ζ = s gives e<sub>x</sub>X + e<sub>y</sub>Y + sZ = s, a plane through N.</p>'
    +'<h4>Angles</h4><p>Two circles cross where</p>'
    +EQ('cos φ = |r<sub>1</sub><sup>2</sup> + r<sub>2</sub><sup>2</sup> − d<sup>2</sup>| / (2r<sub>1</sub>r<sub>2</sub>)',4)
    +'<p>(d the distance between the centres), and their images, whose tangents at the crossing are u × P, cross at the same angle.</p>'
    +'<h4>The cross-ratio</h4>'+EQ('[z<sub>1</sub>, z<sub>2</sub>; z<sub>3</sub>, z<sub>4</sub>] = (z<sub>1</sub> − z<sub>3</sub>)(z<sub>2</sub> − z<sub>4</sub>) / ((z<sub>1</sub> − z<sub>4</sub>)(z<sub>2</sub> − z<sub>3</sub>))',5)
    +'<p>is real exactly when the four points lie on one circle or line, and a Möbius map keeps it.</p>'
    +'<h4>Checked</h4><p>derive.py proves (3), the side of the disk, |n|² − k² = 4r² and the lines exactly; three circles, a crossing and two cross-ratios are pinned.</p>',
  mobius:'<h4>Normal forms</h4><p>A map with fixed points p and q and multiplier k at p, and one with a single fixed point p:</p>'
    +EQ('(w − p)/(w − q) = k (ζ − p)/(ζ − q), &nbsp; &nbsp; 1/(w − p) = 1/(ζ − p) + τ',6)
    +'<p>Written as matrices, M = S<sup>−1</sup> diag(k, 1) S with S(ζ) = (ζ − p)/(ζ − q), scaled to det M = 1. Its flow is the same with k<sup>t</sup> (or tτ), t from 0 to 1. The eigenvalues are λ and 1/λ with k = λ², so</p>'
    +EQ('tr<sup>2</sup> = (a + d)<sup>2</sup> = k + 2 + 1/k',7)
    +'<p>and the four kinds are tr² in [0, 4) (elliptic, |k| = 1), tr² = 4 (parabolic), tr² &gt; 4 (hyperbolic, k &gt; 0), and every other tr² (loxodromic).</p>'
    +'<h4>Rotations</h4><p>A right-handed turn of the sphere by θ about the unit vector n acts on ζ, in this projection, as</p>'
    +EQ('U = cos(θ/2) I + i sin(θ/2) (n<sub>x</sub>σ<sub>x</sub> − n<sub>y</sub>σ<sub>y</sub> + n<sub>z</sub>σ<sub>z</sub>)',8)
    +'<p>the complex conjugate of the spin-½ rotation exp(−iθ n·σ/2), because projecting from N puts a spinor (α, β) at ζ = ᾱ/β̄. The unitary Möbius maps are exactly the rotations; the Cayley map (ζ − i)/(ζ + i), '
    +'which takes the upper half-plane to the unit disk, is the turn by 120° about (−1, 1, −1)/√3.</p>'
    +'<h4>Checked</h4><p>derive.py builds (6) and (7) for three fixed-point pairs and a parabolic map, proves (8) about the three axes in sympy and checks it at random points; the page’s matrices, classes, flows and 40 random rotations match.</p>',
  func:'<h4>Counting on the sphere</h4><p>For f = p/q in lowest terms the degree is d = max(deg p, deg q). A zero of order deg q − deg p sits at ∞ when that is positive, a pole of order deg p − deg q when that is. '
    +'Solving f = w is p − wq = 0, degree d, with the missing degree at ∞: every value is taken d times.</p>'
    +'<h4>Critical points</h4><p>At a point where e preimages meet, e − 1 critical points are counted. The finite ones are the roots of the Wronskian</p>'
    +EQ('W = p′q − pq′, &nbsp; deg W ≤ 2d − 2',9)
    +'<p>and the degree W lacks is e(∞) − 1, so the total is always 2d − 2 (the Riemann–Hurwitz formula for the sphere). The page finds e(∞) twice, from W and from the coefficients (the order of f − f(∞) at ∞), and they must agree.</p>'
    +'<h4>Newton’s map</h4>'+EQ('N(z) = z − (z<sup>3</sup> − 1)/(3z<sup>2</sup>) = (2z<sup>3</sup> + 1)/(3z<sup>2</sup>)',10)
    +'<p>of degree 3, with N(ωz) = ωN(z) for the cube roots of unity ω: the three basins are copies of one another under a turn of the sphere, so each is a third of it. '
    +'Its critical points are the three roots (superattracting) and the double pole at 0, which N sends to ∞, a fixed point with multiplier 3/2.</p>'
    +'<h4>Checked</h4><p>sympy’s exact zeros, poles and critical counts for all six maps, the preimages of one w, five Newton starts; derive.py’s equal-area grid finds the three basins at 0.3333 each.</p>',
  spin:'<h4>Majorana’s polynomial</h4><p>For |ψ⟩ = Σ c<sub>m</sub>|j, m⟩ and the coherent state |n⟩ along n = (θ, φ), |⟨n|ψ⟩| = sin<sup>2j</sup>(θ/2) |Σ √C(2j, j+m) c<sub>m</sub> u<sup>j+m</sup>| with u = ζ(n) = e<sup>iφ</sup> cot(θ/2), '
    +'so ⟨n|ψ⟩ vanishes at the polynomial’s roots, and at N once for each degree it lacks. Those zeros are the antipodes of the stars (⟨n|ψ⟩ vanishes opposite each star), so taking the antipode, ζ = −1/ū, gives the stars as the roots of</p>'
    +EQ('p(ζ) = Σ<sub>m</sub> (−1)<sup>j+m</sup> √C(2j, j+m) c̄<sub>m</sub> ζ<sup>j−m</sup>',11)
    +'<p>of degree 2j; when c<sub>j</sub> = 0 the degree drops and that many stars sit at N. The rotation of a state is exp(−iθ n·J), with J built from J<sub>z</sub>|m⟩ = m|m⟩ and J<sub>+</sub>|m⟩ = √(j(j+1) − m(m+1))|m+1⟩, and exponentiated by scaling and squaring.</p>'
    +'<h4>Checked</h4><ul><li>a coherent state’s p(ζ) is a multiple of (ζ − ζ<sub>n</sub>)<sup>2j</sup>, for 2j = 1, 2, 3, 4, 6;</li><li>|j, m⟩ has j + m stars at N and j − m at S;</li>'
    +'<li>the cat state (|j, j⟩ + |j, −j⟩)/√2 is a regular 2j-gon on the equator;</li><li>(|2, −2⟩ + √2|2, 1⟩)/√3 is a regular tetrahedron and (|3, 2⟩ − |3, −2⟩)/√2 an octahedron;</li>'
    +'<li>for random states the stars of the rotated state are the rotated stars (numpy’s roots, scipy’s expm).</li></ul>',
  sky:'<h4>Aberration is a Möbius map</h4><p>A photon from a star in direction s has momentum −E s. For an observer moving at β along the z axis, the Lorentz transformation gives the direction it is seen from:</p>'
    +EQ('cos θ′ = (cos θ + β)/(1 + β cos θ) &nbsp; ⟺ &nbsp; tan(θ′/2) = e<sup>−η</sup> tan(θ/2), &nbsp; β = tanh η',12)
    +'<p>and since ζ = e<sup>iφ</sup> cot(θ/2), that is ζ′ = e<sup>η</sup> ζ, the hyperbolic map diag(e<sup>η/2</sup>, e<sup>−η/2</sup>). Toward any other direction b it is R diag(e<sup>η/2</sup>, e<sup>−η/2</sup>) R<sup>−1</sup>, R the rotation taking N to b.</p>'
    +'<h4>The Doppler factor, the flux</h4>'+EQ('D = E′/E = γ(1 + β cos θ) = 1 / (γ(1 − β cos θ′))',13)
    +'<p>from e<sup>η</sup> dead ahead to e<sup>−η</sup> behind. Each photon arrives D times bluer and D times as often, so a star’s bolometric flux is multiplied by D².</p>'
    +'<h4>What the numbers say</h4><p>For a uniform sky the share seen ahead is (1 + β)/2 (cos θ′ &gt; 0 exactly when cos θ &gt; −β). A cap of angular radius α about the direction of motion is seen with tan(α′/2) = e<sup>−η</sup> tan(α/2). '
    +'Any circle maps to a circle, so a round object stays round. The chart is the sky seen looking along the motion, ω = −1/ζ, the half-turn of the sphere about Y that brings the direction of motion to the middle.</p>'
    +'<h4>Checked</h4><p>derive.py proves (12) and (13) in sympy; the page’s Möbius map and the aberration formula agree for 30 random stars to 10<sup>−12</sup>, and an off-axis circle’s image is a circle where derive.py puts it.</p>',

/* ================================================================== *
 *  selfTest — headless verification.  REF is build_hfs/refvals.json,   *
 *  the printed output of derive.py (fractions, numpy, scipy), read in    *
 *  full.  makeShot: the recording context (build_aa lineage).          *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null;
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(...a){ chk('moveTo',a); }, lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; },
    arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; (pend.arcs||(pend.arcs=[])).push(app(a[0],a[1]).concat([a[2]])); },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:''+ctx.fillStyle,arcs:pend.arcs||null}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle,arcs:pend&&pend.arcs||null}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;

/* ================================================================== *
 *  selfTest — headless verification.  REF is derive.py's output        *
 *  (sympy exactly, mpmath at 30 digits, numpy, scipy), p7r_ref.js       *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol*Math.max(Math.abs(b),1e-300),name+' ['+a+' vs '+b+']');
  const T0=Date.now();
  const hasState=typeof ST!=='undefined';
  const stSave=hasState?JSON.parse(JSON.stringify(ST)):null;
  function setST(o){ Object.keys(ST).forEach(k=>delete ST[k]); Object.assign(ST,JSON.parse(JSON.stringify(o))); }
  function withState(over,fn){ const b=JSON.parse(JSON.stringify(DEFAULTS)); setST(Object.assign(b,over));
    try{ return fn(); } finally{ setST(stSave); } }
  const cd=(a,b)=>cabs(csub(a,b));                                            // complex distance
  const vd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
  /* a matrix against a reference, up to the sign det 1 leaves free */
  const mClose=(M,R,tol)=>{ const s=cd(M[0],R[0])<cd(M[0],cneg(R[0]))?1:-1; return M.every((e,i)=>cd(e,cscale(R[i],s))<=tol); };
  /* two point sets on the sphere as multisets */
  const sameSet=(A,B,tol)=>{ if(A.length!==B.length) return false; const b=B.map(p=>p.slice());
    for(const a of A){ let k=-1,d=1e9; b.forEach((q,i)=>{ const e=vd(a,q); if(e<d){ d=e; k=i; } }); if(d>tol) return false; b.splice(k,1); } return true; };

  /* ---------- A. the projection ---------- */
  { let w=0, ws=0, wc=0;
    for(const r of REF.proj){ const P=zToSphere(r.z); w=Math.max(w,vd(P,r.P)); ws=Math.max(ws,Math.abs(stretchAt(r.z)-r.scale)/r.scale);
      wc=Math.max(wc,Math.abs(chord(hp(r.z),HINF)-r.chordInf)/r.chordInf); }
    ok(w<1e-14&&ws<1e-14&&wc<1e-13,'P(ζ), the stretch 2/(1+|ζ|²) and the chord to ∞ at four points, as derive.py has them ('+w.toExponential(1)+')'); }
  { let w=0; for(const r of REF.proj){ const z=sphereToZ(zToSphere(r.z)); w=Math.max(w,cd(z,r.z)/Math.max(1,cabs(r.z))); }
    for(const z of [[1e6,-3e5],[1e-7,2e-7],[0.3,0.99]]){ const b=sphereToZ(zToSphere(z)); w=Math.max(w,cd(b,z)/Math.max(1e-7,cabs(z))); }
    ok(w<1e-9,'the round trip ζ → P → ζ, from 10⁻⁷ to 10⁶ ('+w.toExponential(1)+')'); }
  ok(vd(zToSphere(null),[0,0,1])===0&&sphereToZ([0,0,1])===null&&vd(zToSphere([0,0]),[0,0,-1])===0,'∞ is N, 0 is S');
  { const r0=REF.proj[1]; const P=zToSphere(r0.z); close(Math.asin(P[2]),r0.lat,1e-14,'its latitude'); close(Math.atan2(P[1],P[0]),r0.lon,1e-14,'  and longitude'); }
  rel(chord(hp(REF.chord.z),hp(REF.chord.w)),REF.chord.d,1e-14,'the chord between two points, from the sphere');
  rel(chordZ(REF.chord.z,REF.chord.w),REF.chord.d,1e-14,'  and from the formula 2|z − w|/√((1+|z|²)(1+|w|²))');
  { const z0=REF.conformal.z, h=1e-6, J=a=>{ const d=cpolar(h,a), p=zToSphere(cadd(z0,d)), m=zToSphere(csub(z0,d)); return [0,1,2].map(i=>(p[i]-m[i])/(2*h)); };
    const j1=J(REF.conformal.a1), j2=J(REF.conformal.a2), n1=Math.hypot(...j1), n2=Math.hypot(...j2);
    close(Math.acos((j1[0]*j2[0]+j1[1]*j2[1]+j1[2]*j2[2])/(n1*n2)),REF.conformal.angle,1e-7,'two directions at ζ₀ meet on the sphere at the angle they met at in the plane');
    rel(n1,REF.conformal.stretch,1e-8,'  each stretched by 2/(1+|ζ|²)'); rel(n2,REF.conformal.stretch,1e-8,'  in every direction'); }

  /* ---------- B. circles ---------- */
  { let wu=0, wr=0;
    for(const r of REF.circles){ const K=circleCap(r.c,r.r); wu=Math.max(wu,vd(K.u,r.u),Math.abs(K.cosA-r.cosAlpha));
      for(const P of capRing(K.u,K.cosA,K.sinA,24)){ const z=sphereToZ(P); wr=Math.max(wr,Math.abs(cabs(csub(z,r.c))-r.r)/r.r); } }
    ok(wu<1e-13,'|ζ − c| = r ↔ the cap about u of angular radius α, three circles ('+wu.toExponential(1)+')');
    ok(wr<1e-11,'  the cap’s rim projects back onto the circle ('+wr.toExponential(1)+')'); }
  { const K=circleCap([0.6,0.4],0.9), Pin=zToSphere([0.7,0.5]), Pout=zToSphere([2,0]);
    ok(K.u[0]*Pin[0]+K.u[1]*Pin[1]+K.u[2]*Pin[2]>K.cosA&&K.u[0]*Pout[0]+K.u[1]*Pout[1]+K.u[2]*Pout[2]<K.cosA,'the disk is the cap, the outside the rest'); }
  { const L=lineCap([Math.cos(0.7),Math.sin(0.7)],0.4); let w=0;

    /* a point on a path of the flow stays on that path; a point on a dim curve does not (the kinds are assigned right) */
    /* sampled 4000 times, a path's parameter reaches e^1273 at the ends, which overflows: those samples are skipped */
    const Mh=mobiusAt(ST,0.5), near=(f,z)=>{ let d=1e9; for(let i=1;i<4000;i++){ const q=f(i/4000); if(q&&isFinite(q[0])&&isFinite(q[1])) d=Math.min(d,cd(q,z)); } return d/Math.max(1,cabs(z)); };
    const orb=S.fam.filter(f=>f.kind==='orbit'), crs=S.fam.filter(f=>f.kind==='cross');
    let wOn=0, wOff=1e9; for(const f of orb.slice(2,5)){ const z=f.f(0.43); if(!z) continue; const z2=hToZ(mApply(Mh,hp(z))); if(z2) wOn=Math.max(wOn,near(f.f,z2)); }
    for(const f of crs.slice(2,5)){ const z=f.f(0.43); if(!z) continue; const z2=hToZ(mApply(Mh,hp(z))); if(z2) wOff=Math.min(wOff,near(f.f,z2)); }
    ok(orb.length>0&&wOn<3e-3&&(crs.length===0||wOff>2e-2),'  the flow runs along the bright curves ('+sigf(wOn,2)+') and off the dim ones ('+(crs.length?sigf(wOff,2):'none')+')'); });
  withState({view:'mobius',mtype:'ellip',mfix:'pm1',kArg:70},()=>{ const S=mobiusModel(ST);
    ok(S.unitary&&Math.abs(S.axis.th-70*D2R)<1e-12&&vd(S.axis.n.map(Math.abs),[1,0,0])<1e-12,'an elliptic map about the antipodes ±1: the turn by 70° about the X axis'); });
  withState({view:'mobius',mtype:'hyper'},()=>{ ok(!mobiusModel(ST).unitary,'a hyperbolic map is no rotation'); });
  withState({view:'func',fn:'rat2'},()=>{ const F=curFn(ST), turn=c=>{ let tot=0, prev=null;
      for(let i=0;i<=64;i++){ const v=fnEvalH(F,hp(cadd(c,cpolar(0.05,TAU*i/64)))), a=carg(cmul(v[0],cconj(v[1])));
        if(prev!==null){ let d=a-prev; while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU; tot+=d; } prev=a; } return Math.round(tot/TAU); };
    eq(turn([1,0])+' '+turn([0,1]),'1 -1','the argument turns once counter-clockwise round the zero 1, once clockwise round the pole i'); });
  { const r=phaseRGB([[1,0],[1,0]]), c=phaseRGB([[-1,0],[1,0]]), y=phaseRGB([[Math.cos(1.05),Math.sin(1.05)],[1,0]]);
    ok(r[0]>r[1]&&r[0]>r[2]&&c[1]>c[0]&&c[2]>c[0]&&y[0]>y[2]&&y[1]>y[2],'the phase colours: red where f > 0, yellow at arg f = 60°, cyan where f < 0');
    const l=v=>{ const q=phaseRGB([[v,0],[1,0]]); return q[0]+q[1]+q[2]; };
    ok(l(1.99)>l(2.01)&&l(1.01)<l(1.99)&&l(3.99)>l(4.01),'  the brightness climbs through each doubling of |f| and drops back at 2 and 4'); }
  withState({view:'func',fn:'newton'},()=>{ const S=funcModel(ST);
    ok(S.basins.slice(0,3).every(b=>Math.abs(b-1/3)<0.01)&&S.basins[3]<0.02,'Newton’s three basins take a third of the sphere each on the page’s 48 × 96 equal-area grid ('+S.basins.map(b=>sigf(b,3)).join(', ')+')'); });
  withState({view:'spin'},()=>{ const S=spinModel(ST); eq(S.stars.length+' '+S.edges.length,'4 6','the tetrahedron: 4 stars, 6 edges'); ok(Math.hypot(...S.J)<1e-12,'  and ⟨J⟩ = 0'); });
  withState({view:'spin',sst:'octa',j2:6},()=>{ const S=spinModel(ST); eq(S.stars.length+' '+S.edges.length,'6 12','the octahedron: 6 stars, 12 edges'); ok(Math.hypot(...S.J)<1e-12,'  and ⟨J⟩ = 0'); });
  withState({view:'spin',sst:'cat',j2:5},()=>{ eq(spinModel(ST).edges.length,5,'the spin-5/2 cat state: a pentagon'); });
  withState({view:'spin',sst:'coh',j2:6,cohTh:50,cohPh:30},()=>{ const S=spinModel(ST); ok(vd(S.J,dirOf(50,30).map(q=>3*q))<1e-12,'a coherent state: ⟨J⟩ = j n'); });
  withState({view:'spin',sst:'jm',j2:4,m2:2},()=>{ const S=spinModel(ST); eq(S.stars.filter(p=>p[2]>0.999).length+' '+S.stars.filter(p=>p[2]<-0.999).length,'3 1','|2, 1⟩: three stars at N, one at S'); });
  withState({view:'spin',sst:'tetra',j2:4,axTh:60,axPh:20,rotAng:130},()=>{ const S=spinModel(ST);
    ok(sameSet(S.stars,S.stars0.map(p=>rotVec(S.ax,S.th,p)),1e-8),'a turn of the state turns its stars rigidly (the view’s own model)'); });
  withState({view:'sky',beta:0.9,bTh:0,bPh:0},()=>{ const S=skyModel(ST), r=REF.sky[1];
    rel(S.aheadExact,r.fwd,1e-14,'the share of a uniform sky seen ahead, (1 + β)/2');
    close(S.capAhead,r.alphaP,1e-13,'  the 10° cap ahead, as derive.py has it'); ok(S.ringErr<1e-12,'  the round object stays a circle ('+S.ringErr.toExponential(1)+')');
    ok(cabs(skyChart(S,S.b))<1e-12,'  the direction of motion is the chart’s centre');
    rel(cabs(skyChart(S,dirOf(70,20))),Math.tan(35*D2R),1e-12,'  and a star 70° off it sits at |ω| = tan 35°'); });
  withState({view:'sky',beta:0.6,bTh:40,bPh:-30},()=>{ const S=skyModel(ST); let w=0; for(const s of S.stars) w=Math.max(w,vd(s.p,aberrate(S.b,S.beta,s.p0)));
    ok(w<1e-12,'the model’s stars are the aberrated ones, toward any direction ('+w.toExponential(1)+')'); });
  { const a=toRgb(dopRGB(3)), b=toRgb(dopRGB(1/3)); ok(a[2]>a[0]&&b[0]>b[2],'the Doppler colours: blue ahead (D > 1), red behind'); }

  /* ---------- K. the pointer ---------- */
  withState({view:'proj'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const h=HIT.find(x=>x.kind==='zeta'), S=makeScene({getContext:()=>makeShot(1100,712)});
    ok(h&&S.pointer('down',h.x+3,h.y-2),'a press on ζ grabs it');
    const tgt=h.C.P([0.6,-0.9,0]); S.pointer('move',tgt.x,tgt.y);
    ok(Math.abs(ST.zR-Math.hypot(0.6,0.9))<1e-6&&Math.abs(ST.zA-(-56.3))<1e-9,'  a drag puts it where the pointer meets the plane ('+sigf(ST.zR,5)+', '+ST.zA+'°)');
    ok(S.pointer('up',0,0)&&!S.pointer('move',10,10),'  and the release ends the drag'); });
  withState({view:'circles'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const h=HIT.find(x=>x.kind==='centre'&&x.i===1), S=makeScene({getContext:()=>makeShot(1100,712)});
    ok(h&&S.pointer('down',h.x,h.y),'a press on the second circle’s centre grabs it');
    const tgt=h.C.P([-0.8,1.1,0]); S.pointer('move',tgt.x,tgt.y); ok(Math.abs(ST.c2x+0.8)<1e-6&&Math.abs(ST.c2y-1.1)<1e-6,'  and a drag moves it'); S.pointer('up',0,0); });
  withState({view:'mobius',mfix:'free'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const h=HIT.find(x=>x.kind==='fix'&&x.which==='mq'), S=makeScene({getContext:()=>makeShot(1100,712)});
    ok(h&&S.pointer('down',h.x,h.y),'a press on q (fixed points anywhere) grabs it');
    S.pointer('move',h.F.X(1.3),h.F.Y(-0.7)); ok(vd([ST.mq[0],ST.mq[1],0],[1.3,-0.7,0])<1e-9,'  and a drag moves it'); S.pointer('up',0,0); });
  withState({view:'mobius'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
    const o=HIT.find(x=>x.kind==='orbit'), S=makeScene({getContext:()=>makeShot(1100,712)}), th0=ST.camTh, ph0=ST.camPh;
    S.pointer('down',o.b.x+o.b.w/2,o.b.y+10); ok(S.drag&&S.drag.kind==='orbit','a press on the sphere with no handle under it starts turning the view');
    S.pointer('move',o.b.x+o.b.w/2+50,o.b.y+10); close(ST.camTh,th0-50*0.008,1e-12,'  a drag across turns θ'); close(ST.camPh,ph0,1e-12,'  and leaves φ');
    S.pointer('move',o.b.x+o.b.w/2+50,o.b.y+40); close(ST.camPh,ph0+30*0.008,1e-12,'  a drag down tips φ'); S.pointer('up',0,0); });

  /* ---------- M. the renderer and the formatting ---------- */
  { const b=box(0,0,600,600), C=sphereCam(b,0.3,0.4,200), e=C.B.eye, el=Math.hypot(...e), u=e.map(q=>q/el);
    ok(frontFacing(C,u)&&!frontFacing(C,u.map(q=>-q)),'the point of the sphere nearest the eye faces it, its antipode does not');
    const lim=1/el, t=[-u[1],u[0],0], tl=Math.hypot(...t), tt=t.map(q=>q/tl), side=a=>[0,1,2].map(i=>Math.cos(a)*u[i]+Math.sin(a)*tt[i]);
    ok(frontFacing(C,side(Math.acos(lim)-0.02))&&!frontFacing(C,side(Math.acos(lim)+0.02)),'  the limb is where eye·P = 1, the tangent circle');
    ok(behindSphere(C,[0,0,0])&&!behindSphere(C,u.map(q=>1.3*q))&&behindSphere(C,u.map(q=>-1.3*q)),'a point inside the sphere, or behind it, is hidden; one in front is not'); }
  { let worst=0;
    for(const m of MTYPES) for(const f of ['pm1','0inf']) withState({view:'mobius',mtype:m.id,mfix:f},()=>{ const ctx=makeShot(1100,712), R=drawView(ctx,1100,712,buildModel());
      const s=R.F.sq.w; for(let i=0;i<POLY_SEGS.length;i+=4){ const x0=POLY_SEGS[i], y0=POLY_SEGS[i+1];
        if(x0<R.F.sq.x-1||x0>R.F.sq.x1+1||y0<R.F.sq.y-1||y0>R.F.sq.y1+1) continue;
        worst=Math.max(worst,Math.hypot(POLY_SEGS[i+2]-x0,POLY_SEGS[i+3]-y0)/s); } });
    ok(worst<0.3,'no curve on the plane cuts across the panel where it runs off through ∞ (the longest step is '+sigf(100*worst,2)+' % of the panel)'); }
  { const S={b:[0,0,1]}, wR=skyChart(S,dirOf(60,180)), wU=skyChart(S,dirOf(60,90));
    ok(wR[0]>0&&Math.abs(wR[1])<1e-12&&wU[1]>0&&Math.abs(wU[0])<1e-12,'the sky chart is the view along the motion, up +Y: −X is to the right, +Y up (not its mirror image)'); }
  { const n=SKY.length, zs=SKY.map(s=>s.p[2]), mz=zs.reduce((a,q)=>a+q,0)/n, up=zs.filter(q=>q>0).length/n;
    ok(Math.abs(mz)<4/Math.sqrt(3*n)&&Math.abs(up-0.5)<4*0.5/Math.sqrt(n)&&SKY.every(s=>Math.abs(Math.hypot(...s.p)-1)<1e-12),'the made-up sky is uniform: mean Z '+sigf(mz,2)+', '+sigf(100*up,3)+' % above the equator, all unit vectors');
    withState({view:'sky',beta:0.8},()=>{ const S=skyModel(ST), sd=Math.sqrt(S.aheadExact*(1-S.aheadExact)/n);
      ok(Math.abs(S.ahead-S.aheadExact)<4*sd&&Math.abs(S.ahead0-0.5)<4*0.5/Math.sqrt(n),'  seen at β = 0.8, '+sigf(100*S.ahead,3)+' % are ahead against the '+sigf(100*S.aheadExact,3)+' % of a uniform sky (within 4σ)'); }); }
  eq([fmtC([1.5,-2]),fmtC([-0.25,1]),fmtC([0,-3]),fmtC([2,0]),fmtC(null),fmtC([0,1])].join(' | '),'1.50 − 2.00i | −0.250 + i | −3.00i | 2.00 | ∞ | i','complex numbers as text: a true minus, i alone for ±1, ∞');
  /* the class of a parabolic map with rounding in its tr² (the tested ones came out at exactly 4) */
  { const rnd=mulberry32(29); let bad=0, off=0;
    for(let t=0;t<40;t++){ const M=mParabolic(hp([4*rnd()-2,4*rnd()-2]),[2*rnd()-1,2*rnd()-1]), t2=mTr2(M); if(t2[0]!==4||t2[1]!==0) off++; if(mClassify(M)!=='parabolic') bad++; }
    ok(bad===0&&off>5,'40 random parabolic maps are parabolic, '+off+' of them with tr² not exactly 4'); }
  /* a curve through infinity between two samples: the stroke breaks instead of drawing the chord across */
  { const F=planeFrame(box(0,0,400,400),PL), ctx=makeShot(400,400); POLY_SEGS=[];
    const d=[0.05,0.03], f=t=>{ const s=1/(t-0.50123); return [0.3+d[0]*s,d[1]*s]; };
    planeCurve(ctx,F,f,400,'#fff',1);
    const X=F.X(0.3), Y=F.Y(0); let hits=0;
    for(let i=0;i<POLY_SEGS.length;i+=4){ const x0=POLY_SEGS[i], y0=POLY_SEGS[i+1], x1=POLY_SEGS[i+2], y1=POLY_SEGS[i+3], L=Math.hypot(x1-x0,y1-y0);
      if(L<1e-9) continue; const u=((X-x0)*(x1-x0)+(Y-y0)*(y1-y0))/(L*L), px=x0+u*(x1-x0), py=y0+u*(y1-y0);
      if(u>0&&u<1&&Math.hypot(px-X,py-Y)<1) hits++; }
    eq(hits,0,'a curve that runs off through ∞ between two samples leaves the gap it has (no chord drawn through the middle)'); }
  /* seen ahead, by the definition and the independent aberration formula */
  withState({view:'sky',beta:0.8,bTh:0,bPh:0},()=>{ const S=skyModel(ST), n=S.stars.filter(s=>aberrate([0,0,1],0.8,s.p0)[2]>0).length;
    eq(Math.round(S.ahead*S.stars.length),n,'the share seen ahead counts exactly the stars the aberration formula puts in front'); });
  /* a double zero away from 0, which no preset has: the clustering must hold it together */
  { const F={num:pMul(pMul([[-1,0],[1,0]],[[-1,0],[1,0]]),[[2,0],[1,0]]),den:[[0,-1],[1,0]]}, A=fnAnalyze(F);
    const z1=A.zeros.find(o=>o.z&&cabs(csub(o.z,[1,0]))<1e-5), zi=A.poles.find(o=>o.z===null);
    ok(z1&&z1.m===2&&zi&&zi.m===2&&A.crit.reduce((s,o)=>s+o.m,0)===4,'(z − 1)²(z + 2)/(z − i): the double zero at 1 held together, a double pole at ∞, 4 critical points'); }

  /* P's arrows are its tangents: full green when P faces the eye, dimmed with P when it is on the far side */
  { const green=c=>withState(c,()=>{ const ctx=makeShot(1100,712); drawView(ctx,1100,712,buildModel()); return ctx.ops.filter(o=>o.op==='stroke'&&o.style===COL.pos).length; });
    eq(green({view:'proj'})+' '+green({view:'proj',zR:0.45,zA:-120}),'2 0','the arrows at P: both drawn full when P faces the eye, both dimmed when P is behind'); }

  /* ---------- L. what the prose says ---------- */
  ok(DERIV.mobius.includes('40 random rotations')&&DERIV.sky.includes('30 random stars'),'the calculation’s counts of random checks: 40 rotations, 30 stars, as run');
  ok(DERIV.func.includes('0.3333')&&REF.newton.fractions.slice(0,3).every(f=>Math.abs(f-0.3333)<5e-5),'  derive.py’s basins at 0.3333');
  ok(DERIV.spin.includes('2j = 1, 2, 3, 4, 6')&&REF.spin.map(r=>r.j2).join(', ')==='1, 2, 3, 4, 6','  the spins checked, 2j = 1, 2, 3, 4, 6');
  ok(INFO.sky.includes(SKY.length+' directions')&&SRC_LINE.includes(SKY.length+' directions')&&SKY.length===420,'  the 420 made-up stars');
  ok(DERIV.proj.includes('10<sup>−7</sup> to 10<sup>6</sup>')&&DERIV.proj.includes('to 10<sup>−13</sup>'),'  the round trip’s range and the 10⁻¹³ the chords are held to');
  }

  const dt=(Date.now()-T0)/1000;
  if(hasState) setST(stSave);
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
