<title>The Riemann sphere &mdash; the complex plane closed up by its point at infinity, and what lives on it</title>
<!--
  riemann_sphere.html -- the Riemann sphere: the complex plane and its point at infinity as a sphere, and what lives on
  it.  Six views: the stereographic projection, circles, the Moebius maps, rational functions, spin states (Majorana's
  stars), and the sky of a moving observer.  Built in Agent projects/simulations/build_riemann (derive.py, the twin;
  gen_ref.py writes the pins; assemble.py writes this page from the part files).

  EXACT (mathematics; nothing on this page is measured).  The projection from N = (0,0,1) onto the equatorial plane,
  P = (2x, 2y, |z|^2 - 1)/(|z|^2 + 1), every point kept as a homogeneous pair [z1, z2] so infinity is [1, 0]; the chordal
  metric and the stretch 2/(1+|z|^2); circles as plane sections; the Moebius normal forms and the tr^2 classes; the
  rotations as SU(2) matrices in this projection; rational maps' zeros, poles and 2d - 2 critical points counted on the
  sphere; Majorana's polynomial; aberration as the dilation zeta' = e^eta zeta.  derive.py proves the closed forms in
  sympy and pins the numbers (mpmath at 30 digits, numpy, scipy); selfTest holds the page to them.

  COMPUTED NUMERICALLY.  Polynomial roots (Aberth-Ehrlich; a k-fold root is found to about eps^(1/k)); exp(-i theta n.J)
  by scaling and squaring; Newton's basins by iteration (40 steps for the colours, 60 for the areas).

  MADE UP, AND SAID SO.  The sky's 420 stars: uniform directions from mulberry32 (seed 20260927), with random
  brightnesses, standing in for a real sky.

  KNOWN-BAD: DO NOT REINTRODUCE (details in the Agent repo, projects/simulations/CHANGELOG.md)
  - Projecting from N puts a spinor (alpha, beta) at zeta = conj(alpha)/conj(beta): a rotation acts on zeta as the
    complex conjugate of exp(-i theta n.sigma/2), with the n_y terms' sign flipped.  Check random axes.
  - The Cayley map (z - i)/(z + i) is the turn by 120 deg about (-1, 1, -1)/sqrt3, not a quarter-turn.
  - A homogeneous pair iterated (Newton's map) grows as |z|^3 a step: rescale it every step, or it overflows to NaN.
  - Each kind of Moebius flow draws only its own paths bright: the loxodromic's are the spirals, not the circles.
  - Every Moebius kind takes its multiplier from mobiusK (a branch routed round is dead code).
  - Canvas text never carries a caret (exp eta, not e^eta) or an entity; the readout quotes nothing with one.
  - The caption band is reserved before any label is placed, and 3-D drawing is clipped to the stage left of the
    readout: a label from a 3-D point (zeta near the plane's near edge) lands anywhere.
  - A k-fold root is found to about eps^(1/k): check a coherent state's polynomial, not its roots' positions.
-->

'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const TAU=Math.PI*2, PI=Math.PI;

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);

    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* a power of ten in superscripts, never a caret: 1.768 × 10⁸, 2.5 × 10⁻⁵ */
  if(a>=1e5||a<1e-4){ const s=x.toExponential(n-1), k=s.indexOf('e'), SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return s.slice(0,k)+' × 10'+String(+s.slice(k+1)).split('').map(c=>c==='-'?'⁻':SUP[+c]).join(''); }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){

      let s=[0,0]; for(let j=0;j<n;j++) if(j!==i){ const d=csub(z[i],z[j]); if(cabs(d)>0) s=cadd(s,cdiv(C1,d)); }
      const w=cdiv(ratio,csub(C1,cmul(ratio,s)));
      if(!isFinite(w[0])||!isFinite(w[1])) continue;
      z[i]=csub(z[i],w); moved=Math.max(moved,cabs(w)/Math.max(1,cabs(z[i])));

/* roots gathered into distinct points with multiplicities (a k-fold root comes back as k points spread by eps^(1/k)) */

    if(o){ o.sum=cadd(o.sum,z); o.m++; o.z=cscale(o.sum,1/o.m); } else out.push({z:z.slice(),sum:z.slice(),m:1}); }

}

/* ---- spin j: the |j,m> basis m = j, j-1, ..., -j (index k = j - m); J+|m> = sqrt(j(j+1) - m(m+1))|m+1> ---- */
function jMats(j2){
  const n=j2+1, j=j2/2, Z=()=>Array.from({length:n},()=>Array.from({length:n},()=>[0,0]));
  const Jx=Z(), Jy=Z(), Jz=Z();
  for(let k=0;k<n;k++){ const m=j-k; Jz[k][k]=[m,0]; }
  for(let k=1;k<n;k++){ const m=j-k, v=Math.sqrt(j*(j+1)-m*(m+1));       // <m+1|J+|m> = v at [k-1][k]
    Jx[k-1][k]=cadd(Jx[k-1][k],[v/2,0]); Jx[k][k-1]=cadd(Jx[k][k-1],[v/2,0]);
    Jy[k-1][k]=cadd(Jy[k-1][k],[0,-v/2]); Jy[k][k-1]=cadd(Jy[k][k-1],[0,v/2]); }

function matVec(A,v){ return A.map(row=>row.reduce((s,a,j)=>cadd(s,cmul(a,v[j])),[0,0])); }
function matMul(A,B){ return A.map(row=>B[0].map((_,j)=>row.reduce((s,a,k)=>cadd(s,cmul(a,B[k][j])),[0,0]))); }
/* exp(A) by scaling and squaring with a Taylor series (the matrices here are at most 7 x 7) */
function matExp(A){
  const n=A.length; let nrm=0; for(const r of A) for(const a of r) nrm=Math.max(nrm,cabs(a));
  let sN=0; while(nrm*n/Math.pow(2,sN)>0.5) sN++;
  const As=A.map(r=>r.map(a=>cscale(a,1/Math.pow(2,sN))));
  const I=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?[1,0]:[0,0]));
  let E=I.map(r=>r.map(a=>a.slice())), T=I.map(r=>r.map(a=>a.slice()));
  for(let k=1;k<=18;k++){ T=matMul(T,As).map(r=>r.map(a=>cscale(a,1/k))); E=E.map((r,i)=>r.map((a,j)=>cadd(a,T[i][j]))); }
  for(let k=0;k<sN;k++) E=matMul(E,E);

}
/* the rotation exp(-i th n.J) of a spin-j state */
function spinRot(j2,n,th){
  const {Jx,Jy,Jz}=jMats(j2);
  const G=Jx.map((r,i)=>r.map((a,j)=>cmul([0,-th],cadd(cadd(cscale(a,n[0]),cscale(Jy[i][j],n[1])),cscale(Jz[i][j],n[2])))));

}
/* the spin coherent state along the unit vector v: |j,j> turned about (-sin phi, cos phi, 0) by theta */
function coherentState(j2,v){
  const th=Math.acos(Math.max(-1,Math.min(1,v[2]))), ph=Math.atan2(v[1],v[0]);
  const e=Array.from({length:j2+1},(_,k)=>k===0?[1,0]:[0,0]);

/* Majorana's polynomial in this projection (derive.py, section F): sum_m (-1)^(j+m) sqrt(C(2j, j+m)) conj(c_m) zeta^(j-m);

function binom(n,k){ let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return r; }
function starPoly(j2,c){
  const p=Array.from({length:j2+1},()=>[0,0]);
  for(let k=0;k<=j2;k++){ const jm=j2-k /* = j + m */, pw=k /* = j - m */;
    p[pw]=cscale(cconj(c[k]),(jm%2?-1:1)*Math.sqrt(binom(j2,jm))); }

}
function majoranaStars(j2,c){

}
const expJ=(c,A)=>{ const v=matVec(A,c); return c.reduce((s,a,i)=>s+cmul(cconj(a),v[i])[0],0); };
function spinExpect(j2,c){ const {Jx,Jy,Jz}=jMats(j2); return [expJ(c,Jx),expJ(c,Jy),expJ(c,Jz)]; }

/* ---- a reproducible star field (mulberry32; one generator, not consecutive seeds) ---- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  const rnd=mulberry32(seed), out=[];

    out.push({p:[r*Math.cos(ph),r*Math.sin(ph),z],b:0.35+0.65*Math.pow(mag,3)}); }

/* ================================================================== *
 *  functions on the sphere: rational maps f = p/q of degree            *
 *  d = max(deg p, deg q), and what the sphere counts that the plane    *
 *  does not (the zeros and poles at infinity, the critical points)     *
 * ================================================================== */
const FUNCS=[
  {id:'z2',     name:'z²',               num:[[0,0],[0,0],[1,0]],       den:[[1,0]]},
  {id:'z3m1',   name:'z³ − 1',           num:[[-1,0],[0,0],[0,0],[1,0]], den:[[1,0]]},
  {id:'rat2',   name:'(z² − 1)/(z² + 1)', num:[[-1,0],[0,0],[1,0]],      den:[[1,0],[0,0],[1,0]]},
  {id:'jouk',   name:'z + 1/z',          num:[[1,0],[0,0],[1,0]],       den:[[0,0],[1,0]]},
  {id:'cayley', name:'(z − i)/(z + i)',  num:[[0,-1],[1,0]],            den:[[0,1],[1,0]]},
  {id:'newton', name:'Newton’s map for z³ − 1', short:'Newton', num:[[1,0],[0,0],[0,0],[2,0]], den:[[0,0],[0,0],[3,0]],
   roots:[[1,0],[-0.5,Math.sqrt(3)/2],[-0.5,-Math.sqrt(3)/2]]},
];
const fnDeg=F=>Math.max(pTrim(F.num).length,pTrim(F.den).length)-1;
/* f at a homogeneous point: [p, q] homogeneous of degree d, so f = infinity is [1, 0] like any other value */
function fnEvalH(F,h){ const d=fnDeg(F); return [pEvalH(F.num,d,h),pEvalH(F.den,d,h)]; }
/* the local degree of f at infinity, e_inf, read off the coefficients (the check on the Wronskian's count) */
function fnEinf(F){
  const d=fnDeg(F), dn=pTrim(F.num).length-1, dd=pTrim(F.den).length-1;
  if(dn!==dd) return Math.abs(dn-dd);                                        // a pole or a zero at infinity
  const c=cdiv(F.num[dn],F.den[dd]), r=pTrim(pAdd(F.num,F.den.map(a=>cneg(cmul(c,a)))));   // f - f(inf) = (p - c q)/q
  const dr=(r.length===1&&cabs(r[0])===0)?-1:r.length-1;
  return d-dr;
}
/* zeros, poles and critical points, each with its multiplicity; null is infinity */
function fnAnalyze(F){
  const d=fnDeg(F), gather=(p)=>{ const R=pRoots(p,d), out=clusterRoots(R.roots,1e-4).map(o=>({z:o.z,m:o.m}));
    if(R.nInf>0) out.push({z:null,m:R.nInf}); return out; };
  const zeros=gather(F.num), poles=gather(F.den);
  const W=pAdd(pMul(pDeriv(F.num),F.den),pMul(F.num,pDeriv(F.den)).map(cneg));   // p'q - pq'
  const R=pRoots(W,2*d-2), crit=clusterRoots(R.roots,1e-4).map(o=>({z:o.z,m:o.m}));
  const eInf=fnEinf(F);
  if(eInf>1) crit.push({z:null,m:eInf-1});
  for(const c of crit){ const v=fnEvalH(F,c.z===null?HINF:hp(c.z)); c.v=hToZ(v); }
  return {d,zeros,poles,crit,eInf,wInf:R.nInf};
}
/* the d preimages of w (with multiplicity): the roots of p - w q, and infinity for the degree it loses */
function fnPreimages(F,w){
  const d=fnDeg(F);
  const g=w===null?F.den:pAdd(F.num,F.den.map(a=>cneg(cmul(w,a))));
  const R=pRoots(g,d);
  return {pts:R.roots,nInf:R.nInf};
}
/* Newton's map: which root a point runs to (0, 1, 2), or -1 (the pole at 0, infinity, or not settled) */
function newtonBasin(F,z,it){
  let h=hp(z);
  for(let k=0;k<(it||60);k++){
    const v=fnEvalH(F,h); if(hIsInf(v)) return {k:-1,n:k};
    const s=Math.max(cabs(v[0]),cabs(v[1]));                                 // a homogeneous pair grows as |z|^3 a step: rescale it
    h=[cscale(v[0],1/s),cscale(v[1],1/s)]; const zz=hToZ(h);
    for(let r=0;r<3;r++){ const q=csub(zz,F.roots[r]); if(q[0]*q[0]+q[1]*q[1]<1e-12) return {k:r,n:k+1}; }
  }
  return {k:-1,n:it||60};
}

/* ---------------- 1. the projection ---------------- */
function projModel(st){
  const z=cpolar(st.zR,st.zA*D2R), P=zToSphere(z), r2=z[0]*z[0]+z[1]*z[1];
  const grid=[];
  if(st.grid==='polar'){
    for(const r of [0.25,0.5,1,2,4]) grid.push({kind:r===1?'unit':'circ',r,f:t=>cpolar(r,TAU*t)});
    for(let k=0;k<12;k++){ const a=k*30*D2R; grid.push({kind:'ray',a,f:t=>{ const s=t<1?Math.tan(Math.PI/2*t):Infinity; return isFinite(s)?cpolar(s,a):null; }}); }
  } else {
    for(const k of [-2,-1,0,1,2]){ grid.push({kind:'vline',k,f:t=>{ const s=Math.tan(Math.PI*(t-0.5)); return (t<=0||t>=1)?null:[k,s]; }});
      grid.push({kind:'hline',k,f:t=>{ const s=Math.tan(Math.PI*(t-0.5)); return (t<=0||t>=1)?null:[s,k]; }}); }
    grid.push({kind:'unit',r:1,f:t=>cpolar(1,TAU*t)});
  }
  /* two directions at zeta (along the grid there) and their images: the angle kept, the stretch 2/(1+|z|^2) */
  const a1=st.grid==='polar'?st.zA*D2R:0, a2=a1+Math.PI/2, h=1e-6;
  const img=a=>{ const d=cpolar(h,a), p=zToSphere(cadd(z,d)), m=zToSphere(csub(z,d)); return [0,1,2].map(i=>(p[i]-m[i])/(2*h)); };
  const j1=img(a1), j2=img(a2), n1=Math.hypot(...j1), n2=Math.hypot(...j2);
  const angS=Math.acos(clamp((j1[0]*j2[0]+j1[1]*j2[1]+j1[2]*j2[2])/(n1*n2),-1,1));
  return {z,P,r2,grid,a1,a2,j1,j2,stretch:stretchAt(z),stretchNum:[n1,n2],angPlane:Math.PI/2,angSphere:angS,
          chordS:chord(hp(z),hp([0,0])),chordN:chord(hp(z),HINF),lat:Math.asin(P[2]),lon:Math.atan2(P[1],P[0]),
          nearer:r2<1?'zeta':'P'};
}

/* ---------------- 2. circles ---------------- */
function circlesModel(st){

  const out={c1,r1:st.c1r,K1,cap1:{alpha:Math.acos(clamp(K1.cosA,-1,1)),planeDist:K1.cosA}};
  out.containsN=false;                                                       // a circle's disk never holds infinity
  if(st.circ2){ const c2=[st.c2x,st.c2y], K2=circleCap(c2,st.c2r); out.c2=c2; out.r2=st.c2r; out.K2=K2;
    out.cap2={alpha:Math.acos(clamp(K2.cosA,-1,1)),planeDist:K2.cosA};
    out.X=circleCross(c1,st.c1r,c2,st.c2r);
    if(out.X){ const P=zToSphere(out.X.X1), tg=K=>{ const t=[K.u[1]*P[2]-K.u[2]*P[1],K.u[2]*P[0]-K.u[0]*P[2],K.u[0]*P[1]-K.u[1]*P[0]], l=Math.hypot(...t); return t.map(q=>q/l); };
      const t1=tg(K1), t2=tg(K2); out.angSphere=Math.acos(clamp(Math.abs(t1[0]*t2[0]+t1[1]*t2[1]+t1[2]*t2[2]),0,1)); out.PX=P; out.T1=t1; out.T2=t2; } }

/* ---------------- 3. Moebius maps ---------------- */
function mobiusFixed(st){
  if(st.mfix==='0inf') return [hp([0,0]),HINF];
  if(st.mfix==='free') return [hp(st.mp),hp(st.mq)];
  return [hp([1,0]),hp([-1,0])];
}
/* the multiplier the type allows: elliptic |k| = 1, hyperbolic k > 0 real, loxodromic both */
function mobiusK(st){
  if(st.mtype==='ellip') return cpolar(1,st.kArg*D2R);
  if(st.mtype==='hyper') return [st.kMod,0];
  return cpolar(st.kMod,st.kArg*D2R);
}
function mobiusAt(st,t){
  const [p,q]=mobiusFixed(st);
  if(st.mtype==='para') return mParabolic(p,cscale(cpolar(st.tauMod,st.tauArg*D2R),t));
  /* the flow k^t by the principal logarithm: for an elliptic map, the turn by t arg k */
  return mFromFixed(p,q,cpowr(mobiusK(st),t));
}
function mobiusModel(st){
  const [p,q]=mobiusFixed(st), M=mobiusAt(st,1), Mt=mobiusAt(st,st.t);
  const type=mClassify(M), N=mNorm(M);
  /* the flow's two families of curves, pulled back from the coordinate w = (z - p)/(z - q) (or 1/(z - p)) */
  const S=st.mtype==='para'?(hIsInf(p)?[C1,C0,C0,C1]:[C0,C1,C1,cneg(hToZ(p))]):[p[1],cneg(p[0]),q[1],cneg(q[0])], Si=mInv(S);
  const back=w=>w===null?hToZ(mApply(Si,HINF)):hToZ(mApply(Si,hp(w)));
  const fam=[];
  if(st.mtype==='para'){
    const tau=cpolar(1,st.tauArg*D2R), nrm=cmul(tau,CI);
    for(let k=-6;k<=6;k++){ const o=cscale(nrm,0.35*k); fam.push({kind:'orbit',f:t=>{ const s=Math.tan(Math.PI*(t-0.5)); return (t<=0||t>=1)?null:back(cadd(o,cscale(tau,s))); }}); }
    for(let k=-6;k<=6;k++){ const o=cscale(tau,0.35*k); fam.push({kind:'cross',f:t=>{ const s=Math.tan(Math.PI*(t-0.5)); return (t<=0||t>=1)?null:back(cadd(o,cscale(nrm,s))); }}); }
  } else {
    const k=mobiusK(st), lk=clog(k);
    /* the circles |w| = e^s round the fixed points are an elliptic flow's paths, the circles arg w = a through both a
       hyperbolic flow's; a loxodromic flow runs along neither but along the spirals w = exp(u log k + i a), with the
       two circle families left as its coordinates (dim) */
    for(let s=-2;s<=2;s+=0.5) fam.push({kind:st.mtype==='ellip'?'orbit':'cross',f:t=>back(cpolar(Math.exp(s),TAU*t))});
    for(let a=0;a<12;a++) fam.push({kind:st.mtype==='hyper'?'orbit':'cross',f:t=>{ const s=Math.tan(Math.PI*(t-0.5)); return (t<=0||t>=1)?null:back(cpolar(Math.exp(s),a*30*D2R)); }});
    if(st.mtype==='loxo') for(let a=0;a<8;a++) fam.push({kind:'orbit',f:t=>{ const u=Math.tan(Math.PI*(t-0.5)); if(t<=0||t>=1) return null;
      const w=cexp(cadd(cscale(lk,u),[0,a*45*D2R])); return back(w); }});
  }
  /* the figure the map carries: a small square grid about z0, before (orange) and after M_t (green) */
  const z0=st.mfix==='0inf'?[0.9,0.55]:[0.1,0.95], fig=[];
  for(let i=0;i<=4;i++){ fig.push(t=>cadd(z0,[-0.3+0.15*i,-0.3+0.6*t])); fig.push(t=>cadd(z0,[-0.3+0.6*t,-0.3+0.15*i])); }
  const moved=fig.map(f=>t=>{ const h=mApply(Mt,hp(f(t))); return hToZ(h); });
  const tr=cadd(N[0],N[3]);
  return {p,q,M:N,Mt,type,tr,tr2:cmul(tr,tr),k:st.mtype==='para'?null:mobiusK(st),
          fam,fig,moved,z0,unitary:mIsUnitary(M),axis:mIsUnitary(M)?mAxisAngle(M):null,
          antipodal:!hIsInf(p)||!hIsInf(q)?chord(p,q)>2-1e-9:false};
}

/* ---------------- 4. functions ---------------- */
const curFn=st=>FUNCS.find(f=>f.id===st.fn)||FUNCS[0];
function funcModel(st){
  const F=curFn(st), A=fnAnalyze(F), w=cpolar(st.wR,st.wA*D2R), pre=fnPreimages(F,w);
  const out={F,A,w,pre,d:A.d};

/* the share of the sphere's area each Newton basin takes, on an equal-area grid (the sphere's own measure) */
const NEWTON_CACHE={};
function newtonAreas(F,nz,nph){
  const key=nz+'x'+nph; if(NEWTON_CACHE[key]) return NEWTON_CACHE[key];
  const cnt=[0,0,0,0];
  for(let i=0;i<nz;i++){ const Z=-1+(i+0.5)*2/nz, r=Math.sqrt(1-Z*Z);
    for(let j=0;j<nph;j++){ const ph=TAU*(j+0.5)/nph, z=sphereToZ([r*Math.cos(ph),r*Math.sin(ph),Z]);
      const b=z===null?{k:-1}:newtonBasin(F,z); cnt[b.k<0?3:b.k]++; } }
  return (NEWTON_CACHE[key]=cnt.map(c=>c/(nz*nph)));
}

/* ---------------- 5. spin ---------------- */
const dirOf=(thDeg,phDeg)=>[Math.sin(thDeg*D2R)*Math.cos(phDeg*D2R),Math.sin(thDeg*D2R)*Math.sin(phDeg*D2R),Math.cos(thDeg*D2R)];
function spinBase(st){
  const j2=st.j2, n=j2+1, c=Array.from({length:n},()=>[0,0]);
  if(st.sst==='coh') return coherentState(j2,dirOf(st.cohTh,st.cohPh));
  if(st.sst==='jm'){ const m2=clamp(st.m2,-j2,j2), k=(j2-m2)/2; c[Math.round(k)]=[1,0]; return c; }
  if(st.sst==='cat'){ c[0]=[Math.SQRT1_2,0]; c[j2]=[Math.SQRT1_2,0]; return c; }
  if(st.sst==='tetra'&&j2===4){ c[1]=[Math.sqrt(2/3),0]; c[4]=[1/Math.sqrt(3),0]; return c; }
  if(st.sst==='octa'&&j2===6){ c[1]=[Math.SQRT1_2,0]; c[5]=[-Math.SQRT1_2,0]; return c; }
  return null;                                                               // not a state of this j
}
function spinModel(st){
  const j2=st.j2, base=spinBase(st), ax=dirOf(st.axTh,st.axPh), th=st.rotAng*D2R;
  if(!base) return {j2,none:true,ax,th};
  const D=spinRot(j2,ax,th), c=matVec(D,base);
  const stars=majoranaStars(j2,c), stars0=majoranaStars(j2,base);
  const poly=starPoly(j2,c), J=spinExpect(j2,c);
  /* the named constellations' edges: every pair of stars at the smallest separation there is (the cat's polygon,
     the tetrahedron's six edges, the octahedron's twelve) */
  let edges=[];
  if(st.sst==='cat'||st.sst==='tetra'||st.sst==='octa'){
    const d=[]; for(let a=0;a<stars.length;a++) for(let b=a+1;b<stars.length;b++) d.push([a,b,Math.hypot(stars[a][0]-stars[b][0],stars[a][1]-stars[b][1],stars[a][2]-stars[b][2])]);
    const dmin=Math.min(...d.map(q=>q[2])); edges=d.filter(q=>q[2]<dmin*(1+1e-6)).map(q=>[q[0],q[1]]);
  }
  return {j2,c,base,stars,stars0,poly,J,ax,th,U:rotU(ax,th),none:false,edges};
}

/* ---------------- 6. the sky ---------------- */
const SKY=starField(420,20260927);
function skyModel(st){
  const beta=clamp(st.beta,0,LIM.beta[1]), eta=Math.atanh(beta), gam=1/Math.sqrt(1-beta*beta), b=dirOf(st.bTh,st.bPh);
  const B=boostU(b,eta);
  const stars=SKY.map(s=>{ const q=hToSphere(mApply(B,sphereToH(s.p))), c=s.p[0]*b[0]+s.p[1]*b[1]+s.p[2]*b[2];
    return {p0:s.p,p:q,b:s.b,D:doppler(beta,c)}; });
  const ahead=stars.filter(s=>s.p[0]*b[0]+s.p[1]*b[1]+s.p[2]*b[2]>0).length/stars.length;
  const ahead0=stars.filter(s=>s.p0[0]*b[0]+s.p0[1]*b[1]+s.p0[2]*b[2]>0).length/stars.length;
  /* a round object 12 deg across, 55 deg from the direction of motion: still round when seen moving */
  const R0=rotToFrom(b), oc=rotVec(R0.n,R0.th,dirOf(55,20)), oa=6*D2R;
  const ring0=capRing(oc,Math.cos(oa),Math.sin(oa),48), ring=ring0.map(P=>hToSphere(mApply(B,sphereToH(P))));
  const fit=planeThrough(ring[0],ring[16],ring[32]), u=fit.map(q=>q/Math.hypot(...fit)), ringAlpha=Math.acos(clamp(1/Math.hypot(...fit),-1,1));
  const ringErr=Math.max(...ring.map(p=>Math.abs(p[0]*fit[0]+p[1]*fit[1]+p[2]*fit[2]-1)));
  return {beta,eta,gam,b,B,stars,ahead,ahead0,aheadExact:(1+beta)/2,oc,oa,ring0,ring,ringU:u,ringAlpha,ringErr,
          Dahead:doppler(beta,1),Dbehind:doppler(beta,-1),capAhead:2*Math.atan(Math.exp(-eta)*Math.tan(10*D2R/2))};
}
/* the plane n.P = 1 through three points (Cramer's rule) */
function planeThrough(a,b,c){
  const det3=(p,q,s)=>p[0]*(q[1]*s[2]-q[2]*s[1])-p[1]*(q[0]*s[2]-q[2]*s[0])+p[2]*(q[0]*s[1]-q[1]*s[0]);
  const D0=det3(a,b,c), rep=(k)=>[a,b,c].map(p=>p.map((v,j)=>j===k?1:v));
  return [0,1,2].map(k=>{ const M=rep(k); return det3(M[0],M[1],M[2])/D0; });
}

function buildModel(){
  const st=ST, v=st.view, base={st};
  if(v==='proj') return Object.assign(base,{S:projModel(st)});
  if(v==='circles') return Object.assign(base,{S:circlesModel(st)});
  if(v==='mobius') return Object.assign(base,{S:mobiusModel(st)});
  if(v==='func') return Object.assign(base,{S:funcModel(st)});
  if(v==='spin') return Object.assign(base,{S:spinModel(st)});
  return Object.assign(base,{S:skyModel(st)});
}

const row=(k,v,cls)=>'<tr><td>'+k+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>';
const hd=t=>'<tr><td class="hd" colspan="2">'+t+'</td></tr>';
function sciHTML(x,n){ const s=sigf(x,n); return s.replace(/ × 10([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/,' × 10<sup>$1</sup>'); }
const vec3=p=>'('+p.map(q=>sigf(q,3).replace(/^-/,'−')).join(', ')+')';
const latlon=P=>fmtDeg(Math.asin(clamp(P[2],-1,1)))+', '+fmtDeg(Math.atan2(P[1],P[0]));
function readoutHTML(M){

  } else if(v==='circles'){

    h+=hd('its class')+row('tr = a + d',fmtC(S.tr,4))+row('tr²',fmtC(S.tr2,4),'good');

    else h+=hd('the value w')+row('w',fmtC(S.w,3))+row('its preimages',S.pre.pts.length+S.pre.nInf+(S.pre.nInf?' (with ∞)':''),'good');
    h+='</table><div class="note">A rational map of degree d covers the sphere d times: each value is taken d times, and the d copies of the sphere are joined at the 2d − 2 critical points.</div>';

    const jt=S.j2%2?S.j2+'/2':String(S.j2/2);
    h+='<div class="rname">spin '+jt+'<small>'+S.j2+' stars on the sphere</small></div><table>';
    if(S.none) h+=row('','that state needs another spin');
    else { h+=hd('the amplitudes c<sub>m</sub>');
      for(let k=0;k<=S.j2;k++){ const m2=S.j2-2*k, mt=m2%2?(m2<0?'−':'')+Math.abs(m2)+'/2':String(m2/2).replace('-','−'), c=S.c[k];
        h+=row('m = '+mt,cabs(c)<5e-13?'0':sigf(cabs(c),3)+(cabs(c)>1e-9&&Math.abs(carg(c))>1e-9?' ∠ '+fmtDeg(carg(c)):'')); }
      h+=hd('the state')+row('⟨J⟩',vec3(S.J))+row('|⟨J⟩| / j',sigf(Math.hypot(...S.J)/(S.j2/2),4))+row('stars at N, at S',S.stars.filter(p=>p[2]>1-1e-7).length+', '+S.stars.filter(p=>p[2]<-1+1e-7).length); }
    h+=hd('the turn')+row('about n',vec3(S.ax))+row('by',fmtDeg(S.th));
    h+='</table><div class="note">|⟨J⟩| = j only for a coherent state, all stars at one point; the tetrahedron and the octahedron have ⟨J⟩ = 0.</div>';
  } else {
    h+='<div class="rname">the sky, moving<small>a boost is a Möbius map of the sky</small></div><table>';
    h+=hd('the motion')+row('β = v/c',sigf(S.beta,4))+row('γ',sigf(S.gam,4))+row('rapidity η',sigf(S.eta,4))+row('e<sup>η</sup>',sigf(Math.exp(S.eta),4));
    h+=hd('Doppler factor D')+row('dead ahead',sigf(S.Dahead,4))+row('dead behind',sigf(S.Dbehind,4));
    h+=hd('seen ahead')+row('these '+S.stars.length+' stars, at rest',sigf(100*S.ahead0,3)+' %')+row('moving',sigf(100*S.ahead,3)+' %')+row('a uniform sky, (1 + β)/2',sigf(100*S.aheadExact,4)+' %','good');
    h+=hd('the round object')+row('radius at rest',fmtDeg(S.oa))+row('seen moving',fmtDeg(S.ringAlpha))+row('off a circle by',sciHTML(S.ringErr,2));
    h+='</table><div class="note">A 10° patch dead ahead is seen '+fmtDeg(S.capAhead)+' across, e<sup>η</sup> times smaller in tan(θ/2).</div>';
  }
  return h;
}
function eqbarHTML(M){
  const v=M.st.view;
  if(v==='proj') return '<span class="lhs">ζ</span> = (X + iY)/(1 − Z) &nbsp; ⟺ &nbsp; P = (2x, 2y, |ζ|<sup>2</sup> − 1)/(|ζ|<sup>2</sup> + 1)<span class="sm">the line from N through ζ meets the sphere at P; N is ∞ and S is 0; every direction at ζ is stretched by 2/(1 + |ζ|²)</span>';
  if(v==='circles') return '|ζ − c| = r &nbsp; ⟺ &nbsp; 2aX + 2bY + (|c|<sup>2</sup> − r<sup>2</sup> − 1)Z = 1 + |c|<sup>2</sup> − r<sup>2</sup><span class="sm">a circle in the plane is where a plane cuts the sphere, c = a + ib; a line is a circle through N</span>';
  if(v==='mobius') return '(w − p)/(w − q) = <span class="hl">k</span> (ζ − p)/(ζ − q), &nbsp; tr<sup>2</sup> = k + 2 + 1/k<span class="sm">p and q are fixed and k is the multiplier at p; the flow is k<sup>t</sup></span>';
  if(v==='func') return '#zeros = #poles = deg f, &nbsp; Σ(e − 1) = 2 deg f − 2<span class="sm">on the sphere, counted with multiplicity and with ∞; e is the local degree, the number of preimages that meet at a point</span>';
  if(v==='spin') return 'p(ζ) = Σ<sub>m</sub> (−1)<sup>j+m</sup> √C(2j, j+m) c̄<sub>m</sub> ζ<sup>j−m</sup><span class="sm">its 2j roots, on the sphere, are the state’s stars; a degree short of 2j puts that many at N</span>';
  return '<span class="lhs">ζ′</span> = e<sup>η</sup> ζ &nbsp; ⟺ &nbsp; tan(θ′/2) = e<sup>−η</sup> tan(θ/2), &nbsp; D = γ(1 + β cos θ)<span class="sm">in the frame of the motion, a boost of rapidity η stretches the sky’s ζ by e<sup>η</sup>: aberration is a Möbius map</span>';
}
function tagHTML(M){
  const S=M.S, v=M.st.view;
  if(v==='proj') return '<b>ζ = '+fmtC(S.z,3)+'</b> &nbsp;→&nbsp; latitude '+fmtDeg(S.lat);
  if(v==='circles') return '<b>'+(S.X?fmtDeg(S.X.angle)+' in the plane, '+fmtDeg(S.angSphere)+' on the sphere':'two circles')+'</b>';
  if(v==='mobius') return '<b>'+S.type+'</b> &nbsp; tr² = '+fmtC(S.tr2,3);
  if(v==='func') return '<b>'+S.F.name+'</b> &nbsp; degree '+S.d;
  if(v==='spin') return '<b>spin '+(S.j2%2?S.j2+'/2':String(S.j2/2))+'</b> &nbsp; '+S.j2+' stars';
  return '<b>β = '+sigf(S.beta,3)+'</b> &nbsp; e<sup>η</sup> = '+sigf(Math.exp(S.eta),3);

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_lagr/p4_views.js (lineage build_buoy); the camera block from     *
 *  pulsar.html (v3, makeCamera, camBasis, project)                    *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y1);
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */

/* ================================================================== *

const FOV=0.78;
/* the distance at which a sphere of radius R shows a silhouette of `want` px: the tangent circle's projected radius

/* a camera looking at the origin from (theta, phi), sized so the unit sphere's silhouette has radius `want` px, in box b */
function sphereCam(b,theta,phi,want){

/* a point of the unit sphere faces the eye when eye.P > 1 */
function frontFacing(C,P){ return C.B.eye[0]*P[0]+C.B.eye[1]*P[1]+C.B.eye[2]*P[2]>1; }

}
const GLASS='#0d1528', RIM='#56688c', BACK_MIX=0.62;
/* a scene of polylines and points around the glass sphere: collected, then drawn in three layers */
function glassScene(C){
  const curves=[], points=[];

    /* on: true for a curve drawn ON the sphere (visibility by facing), false for anything else (by occlusion) */
    curve(pts,col,lw,o){ curves.push({pts,col,lw:lw||1.4,o:o||{}}); },
    point(P,col,r,o){ points.push({P,col,r:r||4,o:o||{}}); },
    draw(ctx,withGlass){
      const hidden=(c,p)=>c.o.visAt?!frontFacing(C,c.o.visAt):(c.o.on?!frontFacing(C,p):behindSphere(C,p));
      const runs=(c,want)=>{ const out=[]; let cur=null;
        for(let i=0;i+1<c.pts.length;i++){ const a=c.pts[i], b=c.pts[i+1];
          if(!a||!b){ cur=null; continue; }
          const m=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];
          const mm=c.o.on?(()=>{ const l=Math.hypot(m[0],m[1],m[2])||1; return [m[0]/l,m[1]/l,m[2]/l]; })():m;
          if(hidden(c,mm)!==want){ cur=null; continue; }

        for(const r of runs(c,true)) poly3(ctx,C,r,col,Math.max(0.8,c.lw*0.8),c.o.backDash||null,true); }
      /* a point behind: a dim ring, or with backFill (a star of a constellation, which must show) a dim disc */
      for(const p of points){ if(!(p.o.on?!frontFacing(C,p.P):behindSphere(C,p.P))) continue; const q=C.P(p.P); if(!q) continue;
        const dc=mix(p.col,GLASS,BACK_MIX);

      if(withGlass!==false){ ctx.beginPath(); ctx.arc(C.cx,C.cy,C.R,0,TAU); ctx.strokeStyle=RIM; ctx.lineWidth=1.2; ctx.stroke(); }
      /* what is in front */

      const shown=[];

        const ring=p.o.ring===false?null:(p.o.ring||(p.o.hollow?p.col:'#fff'));

}
/* sample a curve of the plane (a function t -> zeta, t in [0, 1]) onto the sphere: n steps, split where it passes infinity */
function sphereCurveOf(fz,n){ const out=[]; for(let i=0;i<=n;i++){ const z=fz(i/n); out.push(z===null?[0,0,1]:zToSphere(z)); } return out; }
function planeCurveOf(fz,n,L){ const out=[]; for(let i=0;i<=n;i++){ const z=fz(i/n); out.push(z===null||Math.abs(z[0])>L||Math.abs(z[1])>L?null:[z[0],z[1],0]); } return out; }
/* a painted sphere: the near hemisphere as opaque quads coloured by colFn(P), each grown 0.5 px about its centroid so
   neighbours overlap (the seams of abutting quads read as spokes; opaque, so the overlap is not painted twice) */
function paintSphere(ctx,C,nLat,nLon,colFn){
  const V=(i,j)=>{ const th=Math.PI*i/nLat, ph=TAU*j/nLon; return [Math.sin(th)*Math.cos(ph),Math.sin(th)*Math.sin(ph),Math.cos(th)]; };
  let n=0;
  for(let i=0;i<nLat;i++) for(let j=0;j<nLon;j++){
    const thc=Math.PI*(i+0.5)/nLat, phc=TAU*(j+0.5)/nLon, Pc=[Math.sin(thc)*Math.cos(phc),Math.sin(thc)*Math.sin(phc),Math.cos(thc)];

    const cx=(q[0].x+q[1].x+q[2].x+q[3].x)/4, cy=(q[0].y+q[1].y+q[2].y+q[3].y)/4;

/* the pointer's ray meets the plane Z = z0 (for dragging a point about the plane in a 3-D view) */
function rayToPlane(C,X,Y,z0){
  const cam=C.cam, B=C.B, f=B.f, u=(X-(C.cx))/f, v=-(Y-(C.cy))/f;
  const d=[B.fwd[0]+u*B.right[0]+v*B.up[0],B.fwd[1]+u*B.right[1]+v*B.up[1],B.fwd[2]+u*B.right[2]+v*B.up[2]];
  if(Math.abs(d[2])<1e-12) return null; const t=(z0-B.eye[2])/d[2]; if(t<=0) return null;
  return [B.eye[0]+t*d[0],B.eye[1]+t*d[1],B.eye[2]+t*d[2]];

/* and the unit sphere (the near hit), for pressing on the sphere */
function rayToSphere(C,X,Y){
  const B=C.B, f=B.f, u=(X-C.cx)/f, v=-(Y-C.cy)/f;
  const d=[B.fwd[0]+u*B.right[0]+v*B.up[0],B.fwd[1]+u*B.right[1]+v*B.up[1],B.fwd[2]+u*B.right[2]+v*B.up[2]];

/* ================================================================== *
 *  the views (1): the projection, circles, Moebius maps               *
 * ================================================================== */
let HIT=[];
function plotRight(W){ return W>=900?W-RO_W-34:W-16; }
/* a complex number as text: 0.12 − 0.34i, significant figures, a true minus sign */
function fmtC(z,n){
  if(z===null) return '∞';
  const a=z[0], b=z[1], s=v=>sigf(v,n||3).replace(/^-/,'−');
  if(Math.abs(b)<1e-12*Math.max(1,Math.abs(a))) return s(a);

  return s(a)+(b<0?' − ':' + ')+(Math.abs(Math.abs(b)-1)<1e-12?'':sigf(Math.abs(b),n||3))+'i';
}
const fmtDeg=r=>sigf(r/D2R,3)+'°';
/* the caption's band is reserved before anything is placed (a label from a 3-D point can land anywhere, and the

function reserveCaption(W,H,fc){ LABELS.push([0,fc.capY-4,W,H]); }
function stageClip(ctx,W,fc){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,plotRight(W)+6,fc.capY-6); ctx.clip(); }
/* a panel's title on the plane frame's title baseline, so the two panels' titles line up */
function panelTitle(ctx,W,H,bs,t){ lab(ctx,W,H,bs.x+4,bs.y+PAD_T-9,t,'#aeb6c6','italic 13px Georgia, serif','left','bottom'); }
/* a label beside a point, flipped to the point's left when it would run past xmax (under the readout, off the panel) */
function labBeside(ctx,W,H,x,y,dx,dy,t,col,font,xmax,o){
  const f=font||LAB_FONT, fs=parseFloat(f.match(/([\d.]+)px/)[1]), w=plain(t).length*fs*0.52;
  if(x+dx+w>xmax) return lab(ctx,W,H,x-dx,y+dy,t,col,f,'right','middle',o);
  return lab(ctx,W,H,x+dx,y+dy,t,col,f,'left','middle',o);
}
/* the stage below the tag, left of the readout from 900 px up, above the caption */
function sceneBox(W,capY){ const top=stageTop()+8; return box(14,top,plotRight(W)-14,capY-20-top); }
/* two panels side by side, the plane then the sphere, in one band centred between the tag and the caption; the
   band is as tall as the square plane frame needs (so neither panel floats over a blank half of the stage) */
const PAD_L=46, PAD_B=40, PAD_T=4;
function twoBoxes(W,capY){
  const top=stageTop()+30, bot=capY-24, L=14, R=plotRight(W), gap=16, w=(R-L-gap)/2;
  const s=Math.max(40,Math.min(w-PAD_L-6,bot-top-PAD_B-PAD_T)), hh=s+PAD_B+PAD_T, y=top+Math.max(0,(bot-top-hh)/2);
  return [box(L,y,w,hh),box(L+w+gap,y,w,hh)];
}
/* the flat plane in a square frame (the plane's shapes are the point, so one scale for both axes) */
const PL=2.6;
function planeFrame(b,L){
  const padL=PAD_L, padB=PAD_B, padT=PAD_T, s=Math.max(40,Math.min(b.w-padL-6,b.h-padB-padT));
  const x0=b.x+padL+(b.w-padL-6-s)/2, y0=b.y+padT;
  const sq=box(x0,y0,s,s);
  return {sq,L,X:x=>sq.x+sq.w*(x+L)/(2*L),Y:y=>sq.y1-sq.h*(y+L)/(2*L),
          toZ:(px,py)=>[-L+2*L*(px-sq.x)/sq.w,-L+2*L*(sq.y1-py)/sq.h]};
}
function planeAxes(ctx,F,title){
  axesT(ctx,F.sq,-F.L,F.L,-F.L,F.L,{title,xlab:'Re ζ',ylab:'Im ζ',nx:5,ny:5,xfmt:t=>fmt(t,0).replace('-','−'),yfmt:t=>fmt(t,0).replace('-','−')});
}
/* a curve t -> zeta (null at infinity) in the plane frame, clipped to it and broken where it runs off through
   infinity between two samples (both ends outside the frame and far apart: never a chord across the panel) */
function planeCurve(ctx,F,f,n,col,lw,dash){
  const xs=[], ys=[], L=F.L, out=z=>z===null||Math.abs(z[0])>L||Math.abs(z[1])>L;
  let prev=null;
  for(let i=0;i<=n;i++){ const z=f(i/n);
    if(z===null||!isFinite(z[0])||!isFinite(z[1])){ xs.push(NaN); ys.push(NaN); prev=null; continue; }
    if(prev&&out(prev)&&out(z)&&cabs(csub(z,prev))>2*L){ xs.push(NaN); ys.push(NaN); }
    xs.push(z[0]); ys.push(z[1]); prev=z; }

function planeDot(ctx,F,z,r,fill,ring){
  if(z===null||Math.abs(z[0])>F.L||Math.abs(z[1])>F.L) return null;
  const X=F.X(z[0]), Y=F.Y(z[1]); dot(ctx,X,Y,r,fill,ring||'#fff',1.2); return [X,Y];

/* an arrowhead drawn in the plane frame at z, pointing along the unit complex direction d */
function planeArrow(ctx,F,z,d,col){

  const X=F.X(z[0]), Y=F.Y(z[1]), ux=d[0], uy=-d[1], hh=6;

const PLANE_R=2.0;

function projCaption(S,short){
  if(short) return 'The line from N through ζ meets the sphere at P: every point of the plane is a point of the sphere, and N is ∞.';
  return 'The unit sphere sits on the complex plane through its equator. The line from the north pole N through a point ζ of the plane meets the sphere once more, at P, '
    +'so every point of the plane is a point of the sphere, and N, which no such line reaches from the plane, is the point at infinity: go out along any ray and P climbs to N. '
    +(ST.grid==='polar'?'The circles |ζ| = r are the parallels of latitude and the rays the meridians; the unit circle is the equator. ':'Every line of the square grid is a circle through N. ')
    +'The two arrows at ζ (orange) are at right angles and so are their images at P (green): the projection keeps angles, and stretches every direction at ζ by the same 2/(1 + |ζ|²). '
    +'Drag ζ about the plane; drag anywhere else to turn the view.';

function drawProj(ctx,W,H,M){

  const zq=q(Z3); if(zq) HIT.push({kind:'zeta',x:zq.x,y:zq.y,C});

}

/* ---------------- 2. circles ---------------- */
function circlesCaption(S,short){
  if(short) return 'A circle in the plane (orange) is a circle on the sphere (green): a plane cuts the sphere in it.';
  return 'A circle |ζ − c| = r in the plane (orange) is the image of a circle on the sphere (green), where the plane 2aX + 2bY + (|c|² − r² − 1)Z = 1 + |c|² − r² (shaded) cuts the sphere, c = a + ib; '
    +'the disk inside the orange circle is the cap on the side away from N. A line is a circle that runs through N. '

function drawCircles(ctx,W,H,M){

/* ---------------- 3. Moebius maps ---------------- */
function mobiusCaption(S,short){
  const T=S.type;
  if(short) return 'The Möbius map (w − p)/(w − q) = k (ζ − p)/(ζ − q) and its flow, on the plane and on the sphere.';
  const what=T==='elliptic'?'An elliptic map turns every point about the fixed points along the circles round them'
    :T==='hyperbolic'?'A hyperbolic map pushes every point from one fixed point toward the other along the circles through both'
    :T==='loxodromic'?'A loxodromic map does both at once: every point spirals out of one fixed point and into the other'
    :'A parabolic map has one fixed point, and moves every point along the circles that touch there';
  return what+'. The orange figure is carried to the green one by the map (at t = '+sigf(ST.t,2)+' of the way along its flow); the cyan curves are the paths the flow moves along, drawn on the plane and on the sphere. '
    +(S.unitary?'This one is a rotation of the sphere by '+fmtDeg(S.axis.th)+': its fixed points are antipodes. ':'')
    +'Every Möbius map is one of these four; tr² of its det-1 matrix says which.';
}
function drawMobius(ctx,W,H,M){
  const S=M.S, st=M.st;

  const [bp,bs]=twoBoxes(W,fc.capY);
  const F=planeFrame(bp,PL);
  planeAxes(ctx,F,titleFor(F.sq,'the plane','the plane'));
  for(const f of S.fam) planeCurve(ctx,F,f.f,400,f.kind==='cross'?'#27334b':'#3f8fa6',f.kind==='cross'?1:1.2);
  for(const f of S.fig) planeCurve(ctx,F,f,40,COL.ref,1.6);
  for(const f of S.moved) planeCurve(ctx,F,f,80,COL.pos,1.8);
  const pz=hToZ(S.p), qz=st.mtype==='para'?null:hToZ(S.q);
  const pp=planeDot(ctx,F,pz,5,'#070b18','#ffffff'), qp=st.mtype==='para'?null:planeDot(ctx,F,qz,5,'#070b18','#ffffff');
  if(pp) lab(ctx,W,H,pp[0]+8,pp[1]-9,'p',COL.text,LAB_FONT,'left','middle',PLATE);
  if(qp) lab(ctx,W,H,qp[0]+8,qp[1]-9,'q',COL.text,LAB_FONT,'left','middle',PLATE);
  if(st.mfix==='free'){ if(pp) HIT.push({kind:'fix',which:'mp',x:pp[0],y:pp[1],F}); if(qp) HIT.push({kind:'fix',which:'mq',x:qp[0],y:qp[1],F}); }
  /* the sphere */
  const C=sphereCam(bs,st.camTh,st.camPh,Math.max(30,0.42*Math.min(bs.w,bs.h))), G=glassScene(C);
  G.curve(sphereCurveOf(t=>cpolar(1,TAU*t),96),COL.lat,1,{on:true});
  for(const f of S.fam) G.curve(sphereCurveOf(f.f,240),f.kind==='cross'?'#2e3d5a':'#3f8fa6',f.kind==='cross'?0.9:1.1,{on:true});
  for(const f of S.fig) G.curve(sphereCurveOf(f,40),COL.ref,1.6,{on:true});
  for(const f of S.moved) G.curve(sphereCurveOf(f,80),COL.pos,1.8,{on:true});
  G.point(hToSphere(S.p),'#ffffff',5,{on:true}); if(st.mtype!=='para') G.point(hToSphere(S.q),'#ffffff',5,{on:true});
  stageClip(ctx,W,fc); G.draw(ctx); ctx.restore();
  panelTitle(ctx,W,H,bs,'the sphere');
  const q3=(p,t)=>{ const s=C.P(p); if(s&&frontFacing(C,p)) lab(ctx,W,H,s.x+8,s.y-9,t,COL.text,LAB_FONT,'left','middle',PLATE); };
  q3(hToSphere(S.p),'p'); if(st.mtype!=='para') q3(hToSphere(S.q),'q');
  HIT.push({kind:'orbit',b:bs,C});

/* ================================================================== *
 *  the views (2): functions, spin states, the sky; dispatch; scene    *
 * ================================================================== */
/* ---- colour for a value [num, den]: the phase portrait ---- */
function hsl2rgb(h,s,l){
  const k=n=>(n+h*12)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return [Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))];
}
const rgbStr=c=>'rgb('+c[0]+','+c[1]+','+c[2]+')';
/* hue = arg f (red on the positive reals, then yellow, green, cyan, blue, magenta counter-clockwise); the lightness
   climbs through each doubling of |f| and drops back, so the jumps are the level lines |f| = 2^k */
function phaseRGB(v){
  if(hIsInf(v)) return [236,236,240];
  const r=cabs(v[0])/cabs(v[1]); if(r===0) return [18,20,30];
  const w=cmul(v[0],cconj(v[1])), hue=((Math.atan2(w[1],w[0])/TAU)%1+1)%1, lg=Math.log2(r), fr=lg-Math.floor(lg);
  return hsl2rgb(hue,0.78,0.34+0.24*fr);
}
const BASIN_H=[0.07,0.30,0.55];
function newtonRGB(F,z){
  if(z===null) return [30,32,44];
  const b=newtonBasin(F,z,40); if(b.k<0) return [30,32,44];
  return hsl2rgb(BASIN_H[b.k],0.7,0.2+0.42*Math.exp(-b.n/7));
}
function fnRGB(F,h){ if(F.id==='newton') return newtonRGB(F,hToZ(h)); return phaseRGB(fnEvalH(F,h)); }

/* ---------------- 4. functions ---------------- */
function funcCaption(S,short){
  const F=S.F;
  if(short) return F.id==='newton'?'Newton’s method for z³ − 1 on the sphere: each colour is the root a start runs to.':'The phase of '+F.name+' on the plane and on the sphere; ∞ is a point like any other.';
  if(F.id==='newton') return 'Newton’s method for z³ − 1 is itself a rational map of degree 3, N(z) = (2z³ + 1)/(3z²). Each start is coloured by the root it runs to (brighter: sooner). '
    +'The three basins take a third of the sphere each, and where two meet the third is always there too: their common boundary is the Julia set. '
    +'The pole at 0 goes to ∞, a fixed point that repels. On the sphere the picture closes up round ∞ like everywhere else.';
  return 'The colour is the argument of f(z) = '+F.name+': red where f is real and positive, then yellow, green, cyan, blue and magenta counter-clockwise; the brightness climbs as |f| doubles and drops back. '
    +'Round a zero (white) the colours turn counter-clockwise, round a pole (dark, ringed) clockwise, and on the sphere ∞ is one more point where that happens: '
    +'f has '+S.d+' zeros and '+S.d+' poles there, counted with ∞, and every value, like the magenta w, is taken '+S.d+' times. Small crosses mark the '+(2*S.d-2)+' critical points, where two of those preimages meet.';

function drawFunc(ctx,W,H,M){
  const S=M.S, st=M.st, F=S.F;
