<title>Lightning &mdash; a storm&rsquo;s charges, a leader grown in their field, the strokes, the thunder, and the jets above</title>
<!--
  ===================================================================
  lightning.html — the kinds of lightning, as NOAA's National Severe
  Storms Laboratory lists them (Severe Weather 101: Lightning Types):
  cloud-to-ground flashes, negative and positive, downward and upward
  (triggered from towers), the bolt from the blue; cloud flashes:
  intracloud, cloud-to-air, sheet; heat lightning, cloud-to-cloud and
  spider lightning; and the transient luminous events: blue and
  gigantic jets, elves, the gamma-ray flashes; sprites have their own
  page (red_sprites.html)
  ===================================================================

  Four views on one clock in milliseconds, switched by the tabs.  THE
  STORM: a storm's charges as uniformly charged spheres over a
  conducting ground (four storms: the mature tripole, a sheared storm
  with its anvil downwind, a dissipating storm's stratiform region,
  a low winter storm over a tower), the field they make against the
  two thresholds (conventional breakdown 3.2 MV/m x n/n0, and the
  relativistic-runaway threshold 284 kV/m x n/n0), the field mill on
  the ground, and the runaway avalanche's e-foldings.  THE FLASH: a
  leader grown cell by cell in that field: each cell a 125-m channel
  element carrying charge; all elements held at one potential (the
  floating leader's, fixed by zero net charge, or the ground's for
  anything grounded) by a Cholesky factor extended one row per step;
  growth into the cell where the potential drop over the next step
  exceeds a threshold, with probability (drop - threshold)^4 (the
  dielectric-breakdown model); a bidirectional leader from the chosen
  origin; upward leaders from the tower, a tree and a house when the
  potential at their tips passes Rizk's value; the attachment; the
  return strokes at c/3; dart leaders down the old channel; the
  continuing current; the current at the channel base and the light.
  FAR AWAY: the storm at a distance on the round Earth, what the curve
  hides, the sound's rays bending in the lapse rate (circles of radius
  c/|dc/dz|) and the shadow zone beyond which no thunder arrives (heat
  lightning), the flash-to-bang delay, and the colour the flash has
  after the air has scattered its blue.  ABOVE THE STORM: a blue jet
  and a gigantic jet to scale, coloured by height from the quenching
  of nitrogen's bands (so blue low and red high), the sprite and the
  elve for scale, and the gamma-ray flash where the avalanche is
  strong.

  WHAT IS TAKEN FROM THE LITERATURE
  -----------------------------------------------------------------------
  NSSL's Lightning Types page for the taxonomy, the 50-yard steps,
  the return stroke's 60,000 miles/s, 1 to 20 strokes, +CG's single
  stroke and continuing current, the 5-10 : 1 ratio of cloud flashes
  to ground flashes, the bolt from the blue's 6 miles, the elve's 300
  miles and < 1 ms, the jets' 25-35 miles; Williams (1989) and
  Krehbiel for the tripole; Marshall & Rust for in-cloud fields of
  100-400 kV/m; Dwyer (2003) for 284 kV/m and the avalanche length
  7.3 MV/(E - E_th); Niemeyer, Pietronero & Wiesmann (1984) for the
  growth rule; Kasemir (1960) for the floating bidirectional leader;
  Rizk (1990) for upward-leader inception; Heidler for the current
  pulse; Rakov & Uman for stroke statistics (30 kA, 12 kA, ~60 ms,
  ~5 C, 1 mC/m); Fleagle (1949) for the thunder shadow zone; the US
  Standard Atmosphere 1976; Hansen & Travis (1974) for the Rayleigh
  depth; Wescott et al. (1995, 2001) and Pasko et al. (2002) for the
  jets' speeds and heights; Liu & Pasko (2004) for the bands' quenching.

  WHAT IS COMPUTED HERE (checked by selfTest, run headless under jsc)
  -----------------------------------------------------------------------
  The field and potential of the spheres and their images (exact);
  the thresholds; the avalanche e-foldings; the leader's charges
  (checked: a potential one cell out equals the target to parts in
  1e6), its growth, timing and branches; which object is struck and
  where; the strokes' schedule; the current and charge; the thunder
  rays and the reach sqrt(2 R h); the horizon's hidden height
  D^2/2R; the path transmission; the jets' kinematics.

  WHAT IS ASSUMED OR NOT MODELLED (and said so on the page)
  -----------------------------------------------------------------------
  The storms' charges and radii; the lattice (125 m), the sheath
  radius (1 m), the growth exponent (4) and thresholds (6 and 3 MV at
  4 km, scaling with density); the leader speeds (2e5, 1.5e5, 1e7 m/s);
  no current sheets, no corona charge left in the cloud, no field
  change from the flash itself; the strokes' currents and charges
  drawn from typical values; a 2-ms persistence so the eye can see
  the stroke at this playback; the cloud outlines; the objects'
  icons not to scale (the tower's height is); a linear sound-speed
  gradient; the flash as a 30,000-K white source; the jets' cone
  angles and the TGF's threshold of 5 e-foldings (indicative).
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* a number rounded to n places; a value that rounds to zero prints as 0, never -0.00 (toFixed keeps the sign) */
function fmt(x,n){ if(!isFinite(x)) return '—'; const s=Number(x).toFixed(n===undefined?3:n); return /^-0(\.0*)?$/.test(s)?s.slice(1):s; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* a power of ten in superscripts, never a caret: 1.768 × 10⁸, 2.5 × 10⁻⁵ */
  if(a>=1e5||a<1e-4){ const s=x.toExponential(n-1), k=s.indexOf('e'), SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return s.slice(0,k)+' × 10'+String(+s.slice(k+1)).split('').map(c=>c==='-'?'⁻':SUP[+c]).join(''); }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
function sgn(x,n){ return (x<0?'−':'')+fmt(Math.abs(x),n); }
function thou(x,n){ return fmt(x,n||0).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sci(x,n){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
  let ms=fmt(m,n===undefined?2:n), ee=e; if(Math.abs(parseFloat(ms))>=10){ ee++; ms=fmt(x/Math.pow(10,ee),n===undefined?2:n); }
  return (ee===0?ms:ms+' × 10'+String(ee).split('').map(c=>SUPS[c]).join('')).replace(/^-/,'−'); }

/* ================================================================== *
 *  the atmosphere, the bands, the optics (as in red_sprites.html)      *
 * ================================================================== */
const EPS0=8.8541878128e-12, KB=1.380649e-23, C_KM_MS=299.792458;   /* c in km/ms */
const R_EARTH=6371.0;                                                 /* km */
const EK0=3.2e6;                                                      /* V/m: the conventional breakdown field at sea-level density (Raizer) */
const N0=101325/(KB*288.15);                                          /* sea-level number density, 2.547e25 m^-3 */

  ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle=COL.ref; ctx.beginPath(); ctx.moveTo(x0,PY(0.13)); ctx.lineTo(x0+pw,PY(0.13)); ctx.stroke(); ctx.restore();
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.6; ctx.beginPath(); pts.forEach(([x,v],i)=>{ i?ctx.lineTo(X(x),PY(v)):ctx.moveTo(X(x),PY(v)); }); ctx.stroke();
  txt(ctx,'the field mill: potential gradient on the ground, kV/m (fair weather +0.13, dotted)',x0+6,py0-5,COL.dim,'italic 10.5px Georgia, serif');
  txt(ctx,fmt(hi,0),x0-5,PY(hi),COL.dim,'9.5px -apple-system, sans-serif','right','middle'); txt(ctx,fmt(lo,0),x0-5,PY(lo),COL.dim,'9.5px -apple-system, sans-serif','right','middle'); txt(ctx,'0',x0-5,PY(0),COL.dim,'9.5px -apple-system, sans-serif','right','middle');
  const ly=H-10; txt(ctx,'|E| / E_th',x0+2,ly,COL.dim,'10px -apple-system, sans-serif'); for(let i=0;i<=20;i++){ ctx.fillStyle=rgbStr(neon(i/20).map(v=>255*v),0.8); ctx.fillRect(x0+60+i*5,ly-8,5,8); }
  txt(ctx,'0.1',x0+60,ly+1,COL.dim,'9px -apple-system, sans-serif','center'); txt(ctx,'1',x0+60+62,ly+1,COL.dim,'9px -apple-system, sans-serif','center'); txt(ctx,'4',x0+60+100,ly+1,COL.dim,'9px -apple-system, sans-serif','center');
  ctx.strokeStyle=COL.live; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x0+180,ly-4); ctx.lineTo(x0+200,ly-4); ctx.stroke(); txt(ctx,'E = E_th, the runaway threshold',x0+205,ly,COL.dim,'10px -apple-system, sans-serif');
}

/* ================================================================== *
 *  view 2 — the flash                                                  *
 * ================================================================== */
function drawFlash(ctx,W,H,M){
  const S=M.S, F=M.F, t=M.t, st=M.st, x0=48, y0=16, pw=Math.max(200,W-RO_W-x0-16), ph=Math.max(160,H-y0-150), XLO=-8, XHI=8, ZHI=12.5;
  const X=x=>x0+(x-XLO)/(XHI-XLO)*pw, Y=z=>y0+(ZHI-z)/ZHI*ph, kmy=ph/ZHI;
  skyGround(ctx,X,Y,XLO,XHI,0,ZHI); ctx.fillStyle=COL.ground; ctx.fillRect(X(XLO),Y(0),pw,10);
  drawCloud(ctx,S,X,Y,XLO,XHI,0.125,0.55); drawCharges(ctx,S,X,Y,0.3);
  /* the sheet: the cloud lit from inside by its channels */
  let lit=0, cx=0, cz=0; for(const c of F.cells){ if(!inCloud(S,c.x,c.z)) continue; const L=cellLight(F,c,t,st.persist); lit+=L; cx+=L*c.x; cz+=L*c.z; }
  if(lit>0.5){ cx/=lit; cz/=lit; const a=clamp(0.02*lit,0,0.55), r=Math.max(2.5,Math.min(6,0.3*Math.sqrt(lit)));
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(X(cx),Y(cz)); ctx.scale((X(r)-X(0)),kmy*r*0.7); const g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,'rgba(210,220,255,'+a+')'); g.addColorStop(1,'rgba(210,220,255,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,TAU); ctx.fill(); ctx.restore(); }
  /* what stands on the ground (icons not to scale; the tower's height is) */
  const ob=F.objs; ctx.strokeStyle='#8a94a8'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(ob[0].x),Y(0)); ctx.lineTo(X(ob[0].x),Y(ob[0].h)); ctx.stroke(); ctx.beginPath(); ctx.moveTo(X(ob[0].x)-4,Y(ob[0].h)); ctx.lineTo(X(ob[0].x)+4,Y(ob[0].h)); ctx.stroke();
  txt(ctx,'tower, '+fmt(ob[0].h*1e3,0)+' m',X(ob[0].x),Y(0)+22,COL.dim,'10px -apple-system, sans-serif','center');
  ctx.fillStyle='#3f7a46'; ctx.beginPath(); ctx.moveTo(X(ob[1].x),Y(0)-14); ctx.lineTo(X(ob[1].x)-6,Y(0)); ctx.lineTo(X(ob[1].x)+6,Y(0)); ctx.closePath(); ctx.fill(); txt(ctx,'tree',X(ob[1].x),Y(0)+22,COL.dim,'10px -apple-system, sans-serif','center');
  ctx.fillStyle='#8a7a66'; ctx.fillRect(X(ob[2].x)-6,Y(0)-8,12,8); ctx.beginPath(); ctx.moveTo(X(ob[2].x)-7,Y(0)-8); ctx.lineTo(X(ob[2].x),Y(0)-14); ctx.lineTo(X(ob[2].x)+7,Y(0)-8); ctx.closePath(); ctx.fill(); txt(ctx,'house',X(ob[2].x),Y(0)+22,COL.dim,'10px -apple-system, sans-serif','center');
  /* the channels: a glow pass, then the cores; segments inside the cloud are diffused */
  const segs=[]; for(const c of F.cells){ if(c.parent<0) continue; const L=cellLight(F,c,t,st.persist); if(L<0.01) continue; const p=F.all[c.parent]; segs.push({c,p,L,inC:inCloud(S,c.x,c.z)}); }
  ctx.save(); ctx.lineCap='round'; ctx.globalCompositeOperation='lighter';
  for(const s of segs){ const col=s.c.tree>=10?COL.upleader:(s.L>0.5?COL.stroke:COL.leader); ctx.strokeStyle=rgba(col,clamp(s.L*(s.inC?0.35:0.22),0,0.6)); ctx.lineWidth=s.inC?9:(F.main.has(s.c.id)?6:4); ctx.beginPath(); ctx.moveTo(X(s.p.x),Y(s.p.z)); ctx.lineTo(X(s.c.x),Y(s.c.z)); ctx.stroke(); }
  ctx.globalCompositeOperation='source-over';
  for(const s of segs){ const col=s.c.tree>=10?COL.upleader:(s.L>0.5?COL.stroke:COL.leader); ctx.strokeStyle=rgba(col,clamp(s.L*(s.inC?0.5:1),0,1)); ctx.lineWidth=(F.main.has(s.c.id)&&s.L>0.5?2.4:1.2)*(s.inC?1.4:1); ctx.beginPath(); ctx.moveTo(X(s.p.x),Y(s.p.z)); ctx.lineTo(X(s.c.x),Y(s.c.z)); ctx.stroke(); }
  ctx.restore();
  /* the strike: the ground lit for a moment */
  if(F.attach&&!F.origin.tower){ for(const s of F.strokes){ const a=t-s.t; if(a<0||a>3||s.Ip<=0) continue; const al=clamp(0.5*Math.exp(-a/1.2),0,0.5), xa=F.outcome.x;
      ctx.save(); ctx.globalCompositeOperation='lighter'; const g=ctx.createRadialGradient(X(xa),Y(0),0,X(xa),Y(0),X(1.2)-X(0)); g.addColorStop(0,'rgba(230,236,255,'+al+')'); g.addColorStop(1,'rgba(230,236,255,0)'); ctx.fillStyle=g; ctx.fillRect(X(xa-1.3),Y(1.3),X(2.6)-X(0),Y(0)-Y(1.3)); ctx.restore(); } }
  if(F.attach&&t>=F.attach.t-0.5&&t<F.attach.t+2&&!F.origin.tower) txt(ctx,'attachment at '+F.outcome.where,X(F.outcome.x)+10,Y(0.5),COL.text,'italic 11px Georgia, serif');
  axes(ctx,X,Y,x0,XLO,XHI,2,12,2,Y(0)+10);
  /* the strip: the channel-base current and the light */
  const sy0=Y(0)+42, sh=H-sy0-24; if(sh>30){ const LC=M.LC, TX=tt=>x0+(tt-T_START)/(T_END-T_START)*pw;
    ctx.fillStyle='rgba(16,19,27,0.6)'; ctx.fillRect(x0,sy0,pw,sh); ctx.strokeStyle=COL.faint; ctx.strokeRect(x0+0.5,sy0+0.5,pw,sh);
    for(const tt of [0,50,100,150,200,250,300,350,400]){ ctx.beginPath(); ctx.moveTo(TX(tt),sy0+sh); ctx.lineTo(TX(tt),sy0+sh-4); ctx.stroke(); txt(ctx,String(tt),TX(tt),sy0+sh+13,COL.dim,'9px -apple-system, sans-serif','center'); }
    /* the light, red, relative; the current, white, on a square-root scale to 40 kA */
    ctx.strokeStyle='#ff5a46'; ctx.lineWidth=1.4; ctx.beginPath(); LC.ts.forEach((tt,i)=>{ const px=TX(tt), py=sy0+sh-2-LC.L[i]*(sh-6); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }); ctx.stroke();
    if(F.strokes.length){ ctx.strokeStyle='rgba(238,242,255,0.9)'; ctx.lineWidth=1.2; ctx.beginPath(); let first=true; for(let tt=T_START;tt<=T_END;tt+=0.25){ const I=currentAt(F,tt), py=sy0+sh-2-Math.sqrt(clamp(I,0,40)/40)*(sh-6); if(first){ ctx.moveTo(TX(tt),py); first=false; } else ctx.lineTo(TX(tt),py); } ctx.stroke(); }
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(TX(t)+0.5,sy0); ctx.lineTo(TX(t)+0.5,sy0+sh); ctx.stroke();
    txt(ctx,(F.strokes.length?'the current at the channel base (white, √ scale to 40 kA: '+fmt(M.I,M.I<1?2:1)+' kA now) and ':'')+'the light (red, relative: '+fmt(100*M.light,0)+'% now)  ·  ms',x0+6,sy0-5,COL.dim,'italic 10.5px Georgia, serif'); }
}

/* ================================================================== *
 *  view 3 — far away: the Earth's curve, the sound's rays, the colour  *
 * ================================================================== */
function drawFar(ctx,W,H,M){
  const S=M.S, st=M.st, F=M.F, x0=48, y0=16, pw=Math.max(200,W-RO_W-x0-16), ph=Math.max(160,H-y0-120), XMAXK=Math.max(40,1.35*st.D), ZLO=-2.2, ZHI=14;
  const X=x=>x0+x/XMAXK*pw, Y=z=>y0+(ZHI-z)/(ZHI-ZLO)*ph, gz=x=>-x*x/(2*R_OPT);           /* the ground, below the observer's tangent plane */
  const g=ctx.createLinearGradient(0,Y(ZHI),0,Y(0)); g.addColorStop(0,'#05070f'); g.addColorStop(1,'#141a33'); ctx.fillStyle=g; ctx.fillRect(x0,y0,pw,ph);
  ctx.fillStyle=COL.ground; ctx.beginPath(); ctx.moveTo(X(0),Y(gz(0))); for(let x=0;x<=XMAXK;x+=1) ctx.lineTo(X(x),Y(gz(x))); ctx.lineTo(X(XMAXK),Y(ZLO)); ctx.lineTo(X(0),Y(ZLO)); ctx.closePath(); ctx.fill();
  /* the storm at D, on the curved ground, with its flash */
  const D=st.D, g0=gz(D); ctx.fillStyle='rgba(70,78,100,0.6)'; ctx.beginPath(); ctx.moveTo(X(D-4),Y(g0+S.base)); ctx.lineTo(X(D+4),Y(g0+S.base)); ctx.lineTo(X(D+5),Y(g0+S.top-2)); ctx.lineTo(X(D+9),Y(g0+S.top)); ctx.lineTo(X(D-7),Y(g0+S.top)); ctx.lineTo(X(D-5),Y(g0+S.top-2)); ctx.closePath(); ctx.fill();
  const L=M.light; if(L>0.02){ ctx.save(); ctx.globalCompositeOperation='lighter'; const gg=ctx.createRadialGradient(X(D),Y(g0+0.5*(S.base+S.top)),0,X(D),Y(g0+0.5*(S.base+S.top)),Math.max(20,X(6)-X(0))); gg.addColorStop(0,rgbStr(M.rgb,0.6*L)); gg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=gg; ctx.fillRect(X(D-8),Y(g0+S.top+1),X(16)-X(0),Y(g0)-Y(g0+S.top+1));
    if(F.attach){ const rnd=mulberry32(5); ctx.strokeStyle=rgbStr(M.rgb,clamp(L,0,1)); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(X(D),Y(g0+S.base)); for(let z=S.base-0.3;z>0;z-=0.3) ctx.lineTo(X(D+(rnd()-0.5)*0.6),Y(g0+z)); ctx.lineTo(X(D),Y(g0)); ctx.stroke(); } ctx.restore(); }
  /* the line of sight: the tangent plane; what lies under it is behind the Earth's curve */
  ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle='rgba(207,212,222,0.6)'; ctx.beginPath(); ctx.moveTo(X(0),Y(0.002)); ctx.lineTo(X(XMAXK),Y(0.002)); ctx.stroke(); ctx.restore();
  ctx.fillStyle='rgba(20,26,51,0.55)'; ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(XMAXK),Y(0)); for(let x=XMAXK;x>=0;x-=1) ctx.lineTo(X(x),Y(gz(x))); ctx.closePath(); ctx.fill();
  txt(ctx,'the line of sight: below it the Earth’s curve hides the storm (hidden below '+fmt(M.hidden,2)+' km at '+fmt(D,0)+' km)',X(0)+8,Y(0.002)-6,COL.dim,'italic 10.5px Georgia, serif');
  /* the sound: rays from the channel, bending in the lapse rate */
  const src=[0.3,0.5*M.zTopCh,M.zTopCh]; const Rr=M.Rr, sgn=st.lapse<0?1:(st.lapse>0?-1:0);
  ctx.save(); ctx.lineWidth=1;
  src.forEach((h,si)=>{ for(const a0 of [-1,-3,-6,-10,-16,-25,-40,-60]){ let x=D, z=g0+h, al=a0*PI/180, hit=null; ctx.strokeStyle=si===1?'rgba(184,236,76,0.5)':'rgba(184,236,76,0.22)'; ctx.beginPath(); ctx.moveTo(X(x),Y(z));
      for(let s=0;s<4000;s++){ const ds=0.1; x-=Math.cos(al)*ds; z+=Math.sin(al)*ds; if(sgn&&isFinite(Rr)) al+=sgn*ds/Rr; if(x<0||z>ZHI||x>XMAXK) break; ctx.lineTo(X(x),Y(z)); if(z<=gz(x)){ hit=x; break; } }
      ctx.stroke(); if(hit!==null&&si===1){ ctx.fillStyle='rgba(184,236,76,0.7)'; ctx.fillRect(X(hit)-1,Y(gz(hit))-1,2,2); } } });
  ctx.restore();
  if(isFinite(M.reach)&&D-M.reach>0){ ctx.fillStyle='rgba(232,132,58,0.12)'; ctx.fillRect(X(0),Y(ZHI),X(D-M.reach)-X(0),Y(gz(D-M.reach))-Y(ZHI)); txt(ctx,'the shadow zone: no thunder here',X(0)+8,Y(ZHI)+14,COL.ref,'italic 10.5px Georgia, serif'); }
  /* the observer */
  ctx.fillStyle=COL.text; ctx.beginPath(); ctx.arc(X(0)+3,Y(0)-6,3,0,TAU); ctx.fill(); ctx.fillRect(X(0)+2,Y(0)-4,2,5); txt(ctx,'you',X(0)+9,Y(0)-10,COL.text,'10.5px -apple-system, sans-serif');
  txt(ctx,'the storm, '+fmt(D,0)+' km away',X(D),Y(g0+S.top)-8,COL.dim,'italic 10.5px Georgia, serif','center');
  axes(ctx,X,Y,x0,0,XMAXK,XMAXK>80?20:10,14,2,Y(ZLO)+2,'distance, km','height, km (stretched)');
  /* what you see and hear */
  const by=H-86, bx=x0; ctx.fillStyle='rgba(16,19,27,0.75)'; ctx.fillRect(bx,by,Math.min(pw,560),72); ctx.strokeStyle=COL.faint; ctx.strokeRect(bx+0.5,by+0.5,Math.min(pw,560),72);
  ctx.fillStyle=rgbStr(M.rgb,1); ctx.fillRect(bx+10,by+10,44,52); ctx.strokeStyle='#666'; ctx.strokeRect(bx+10.5,by+10.5,44,52);
  txt(ctx,'the flash’s colour here: R '+fmt(100*M.T[0],0)+'%, G '+fmt(100*M.T[1],0)+'%, B '+fmt(100*M.T[2],0)+'% of it get through',bx+64,by+24,COL.text,'11px -apple-system, sans-serif');
  txt(ctx,'flash to bang: '+fmt(M.delay,1)+' s at '+fmt(M.cs,0)+' m/s ('+fmt(M.delay/(1.609*1e3/M.cs),1)+' “five seconds per mile” units)',bx+64,by+42,COL.text,'11px -apple-system, sans-serif');
  txt(ctx,M.audible?'thunder arrives: the storm is within its '+fmt(M.reach,0)+'-km reach':(isFinite(M.reach)?'no thunder: the rays bend over your head beyond '+fmt(M.reach,0)+' km — heat lightning':'no shadow zone: the rays bend down'),bx+64,by+60,M.audible?COL.pos:COL.ref,'11px -apple-system, sans-serif');
}

/* ================================================================== *
 *  view 4 — above the storm: the jets, the sprite and the elve to      *
 *  scale, the gamma rays                                               *
 * ================================================================== */
function drawTop(ctx,W,H,M){
  const S=M.S, st=M.st, x0=48, y0=16, pw=Math.max(200,W-RO_W-x0-16), ph=Math.max(160,H-y0-40), XLO=-70, XHI=70, ZHI=100, zTop=Math.max(S.top,12);
  const X=x=>x0+(x-XLO)/(XHI-XLO)*pw, Y=z=>y0+(ZHI-z)/ZHI*ph;
  const g=ctx.createLinearGradient(0,Y(ZHI),0,Y(0)); g.addColorStop(0,'#02040a'); g.addColorStop(0.85,'#0a0f22'); g.addColorStop(1,'#141a33'); ctx.fillStyle=g; ctx.fillRect(x0,y0,pw,ph);
  /* the airglow and the lower ionosphere */
  ctx.fillStyle='rgba(143,207,122,0.12)'; ctx.fillRect(x0,Y(97),pw,Y(85)-Y(97)); txt(ctx,'the lower ionosphere and the airglow layer, 85–100 km',x0+8,Y(97)+12,'rgba(150,215,120,0.8)','italic 10.5px Georgia, serif');
  ctx.fillStyle=COL.ground; ctx.fillRect(x0,Y(0),pw,4);
  /* the storm: a tower of cloud to its top, an anvil */
  ctx.fillStyle='rgba(70,78,100,0.7)'; ctx.beginPath(); ctx.moveTo(X(-6),Y(1)); ctx.lineTo(X(6),Y(1)); ctx.lineTo(X(7),Y(zTop-3)); ctx.lineTo(X(18),Y(zTop-1)); ctx.lineTo(X(18),Y(zTop)); ctx.lineTo(X(-12),Y(zTop)); ctx.lineTo(X(-12),Y(zTop-1)); ctx.lineTo(X(-7),Y(zTop-3)); ctx.closePath(); ctx.fill();
  txt(ctx,'the storm, top '+fmt(zTop,0)+' km',X(0),Y(zTop)-6,COL.dim,'italic 10.5px Georgia, serif','center');
  /* the sprite and the elve, for scale (see Red Sprites) */
  ctx.save(); ctx.globalAlpha=0.35; const sx=42; for(let i=0;i<9;i++){ const xx=sx-12+i*3, top=82-(i%3)*3, bot=52+((i*7)%5)*2; const c=segColour(0.5*(top+bot)).rgb; ctx.strokeStyle=rgbStr(c,0.9); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(X(xx),Y(top)); ctx.lineTo(X(xx+(i%2?1:-1)*2),Y(bot)); ctx.stroke(); }
  ctx.restore(); txt(ctx,'a sprite, 50–90 km (see Red Sprites)',X(sx),Y(50)+12,COL.dim,'italic 10px Georgia, serif','center');
  ctx.save(); ctx.strokeStyle='rgba(255,122,74,0.5)'; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(x0,Y(90)); ctx.lineTo(x0+pw,Y(90)); ctx.stroke(); ctx.restore(); txt(ctx,'an elve: a ring at 90 km, up to 300 miles across',x0+pw-8,Y(90)-5,'rgba(255,122,74,0.8)','italic 10px Georgia, serif','right');
  /* the jet: a cone from the top, coloured by height from the bands' quenching */
  const tip=M.jetZ; if(tip>zTop+0.05){ const half=st.jet==='blue'?Math.tan(8*PI/180):Math.tan(4*PI/180), fan=st.jet==='gj'?Math.tan(16*PI/180):half;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let z=zTop;z<tip;z+=1){ const z2=Math.min(tip,z+1), c=segColour(0.5*(z+z2)), fade=st.jet==='blue'?1-0.6*(z-zTop)/(Z_BLUEJET-zTop):1;
      const w1=(z-zTop)*(z>Z_GJ_JUMP&&st.jet==='gj'?fan:half)+0.3, w2=(z2-zTop)*(z2>Z_GJ_JUMP&&st.jet==='gj'?fan:half)+0.3;
      ctx.fillStyle=rgbStr(c.rgb,clamp(0.55*fade*Math.min(1,c.I/0.4),0.05,0.7)); ctx.beginPath(); ctx.moveTo(X(-w1),Y(z)); ctx.lineTo(X(w1),Y(z)); ctx.lineTo(X(w2),Y(z2)); ctx.lineTo(X(-w2),Y(z2)); ctx.closePath(); ctx.fill(); }
    ctx.restore(); const c=segColour(tip); txt(ctx,(st.jet==='blue'?'the blue jet':'the gigantic jet')+' at '+fmt(tip,0)+' km',X(0)+14,Y(tip),rgbStr(c.rgb,1),'10.5px -apple-system, sans-serif'); }
  /* the gamma rays: from the top of the strongest field, if the avalanche is strong enough, in the flash's first milliseconds */
  if(M.rrea.xi>=5&&M.t>=0&&M.t<8){ const a=clamp(1-M.t/8,0,1); ctx.save(); ctx.strokeStyle='rgba(184,236,76,'+(0.6*a)+')'; ctx.setLineDash([2,4]); ctx.lineWidth=1;
    for(let k=-3;k<=3;k++){ const ang=k*7*PI/180; ctx.beginPath(); ctx.moveTo(X(M.rrea.x),Y(M.rrea.z1)); ctx.lineTo(X(M.rrea.x+Math.sin(ang)*120),Y(M.rrea.z1+Math.cos(ang)*120)); ctx.stroke(); } ctx.restore();
    txt(ctx,'a terrestrial gamma-ray flash: '+fmt(M.rrea.xi,0)+' e-foldings of runaway electrons',X(M.rrea.x)+10,Y(M.rrea.z1+8),COL.pos,'10.5px -apple-system, sans-serif'); }
  axes(ctx,X,Y,x0,XLO,XHI,20,100,10,Y(0)+6);
}
function drawView(ctx,W,H,M){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='storm') drawStorm(ctx,W,H,M); else if(M.view==='flash') drawFlash(ctx,W,H,M); else if(M.view==='far') drawFar(ctx,W,H,M); else drawTop(ctx,W,H,M);
}
function makeScene(canvas){ const S={st:ST,W:1100,H:712}; S.model=buildModel; S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); }; S.step=function(){ return runStep(ST); }; S.pointer=function(){ return false; }; return S; }

/* ================================================================== *
 *  the readout, the equation bar, the caption                          *
 * ================================================================== */
const VIEW_NAME={storm:'the storm',flash:'the flash',far:'far away',top:'above the storm'};
function tStr(t){ return t<0?fmt(-t,1)+' ms before the flash':'t = +'+fmt(t,t<10?2:1)+' ms'; }
function msStr(ms){ return ms<1?fmt(ms*1e3,0)+' µs':ms<100?fmt(ms,ms<10?2:1)+' ms':fmt(ms,0)+' ms'; }
function readoutHTML(M){
  const st=M.st, S=M.S, F=M.F, b=M.scan; let s='<div class="rname">'+VIEW_NAME[M.view]+'<small>'+tStr(M.t)+'</small></div><table>';
  const row=(k,v,cls)=>'<tr><td>'+k+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>', hd=k=>'<tr><td class="hd" colspan="2">'+k+'</td></tr>';
  s+=hd(S.name)+row('charges',(S.cloud==='deck'?['+36 C spread along 4.8 km','−28 C at 8.0 km']:S.charges.map(c=>(c.q>0?'+':'−')+Math.abs(c.q)+' C at '+fmt(c.z,1)+' km')).join(', '))+row('ground field under it',fmt(pgAt(S,S.charges[1]?S.charges[1].x:0)/1e3,1)+' kV/m')
    +row('strongest field',fmt(b.E/1e3,0)+' kV/m at '+fmt(b.z,1)+' km')+row('against the thresholds','<span class="'+(b.r>=1?'good':'bad')+'">'+fmt(b.r,1)+' E<sub>th</sub></span>, '+fmt(b.rk,2)+' E<sub>k</sub>')+row('runaway avalanche',M.rrea.xi>0?fmt(M.rrea.xi,0)+' e-foldings (×'+sci(Math.exp(M.rrea.xi),1)+')':'none: the field never passes E<sub>th</sub>');
  s+=hd('the flash: '+M.name)+row('phase',M.phase)+row('leader potential',F.origin.tower?'0 (grounded)':fmt(F.phiL/1e6,0)+' MV')+row('channel',thou(F.cells.length*ELL/1e3,1)+' km in all, '+fmt(M.chanLen,1)+' km on the main path, '+M.nBranch+' branch points'+(F.nPost?', '+fmt(F.nPost*ELL/1e3,1)+' km grown in the cloud after the strike':''))
    +row('leader charge',fmt(F.qLeader,2)+' C each way, '+fmt(M.qPerM*1e3,2)+' mC/m (floating; a connected leader carries ~1)');
  if(F.attach&&!F.origin.tower) s+=row('struck',F.outcome.where+(F.outcome.out>0?', '+fmt(F.outcome.out,1)+' km outside the cloud':'')+', after '+msStr(F.attach.t));
  if(F.origin.tower) s+=row('the tower',F.outcome.kind==='upward'?'launches an upward leader':'cannot: its tip is at '+fmt(Math.abs(phiBg(S,OBJECTS[0].x,st.towerH))/1e6,1)+' MV, Rizk needs '+fmt(rizkU(st.towerH*1e3)/1e6,1));
  if(F.strokes.length) s+=row('strokes',F.strokes.length+(F.strokes.length>1?', '+msStr(F.strokes[1].t-F.strokes[0].t)+' to the second':'')+(F.strokes.some(x=>x.cc>0)?', continuing current '+fmt(Math.max(...F.strokes.map(x=>x.cc)),0)+' ms':''));
  if(F.strokes.length) s+=row('current now',fmt(M.I,M.I<1?2:1)+' kA; peak '+fmt(Math.max(...F.strokes.map(x=>x.Ip)),0)+' kA')+row('charge to ground',fmt(M.Q,1)+' C'+(F.outcome.kind==='posCG'?' → '+fmt(M.Q*F.origin.z,0)+' C·km':''));
  s+=row('light',fmt(100*M.light,0)+'% of the flash&rsquo;s peak');
  if(M.view==='far'){ s+=hd('far away, '+fmt(st.D,0)+' km')+row('hidden by the curve','below '+fmt(M.hidden,2)+' km'+(M.heat?': only the cloud lights up':''))+row('sound speed',fmt(M.cs,0)+' m/s at '+fmt(st.TK-273.15,0)+' °C')+row('flash to bang',fmt(M.delay,1)+' s')
    +row('thunder reaches',isFinite(M.reach)?fmt(M.reach,0)+' km (rays of radius '+fmt(M.Rr,0)+' km)':'everywhere (the rays bend down)')+row('you hear it','<span class="'+(M.audible?'good':'bad')+'">'+(M.audible?'yes':'no: heat lightning')+'</span>')+row('its colour','R '+fmt(100*M.T[0],0)+', G '+fmt(100*M.T[1],0)+', B '+fmt(100*M.T[2],0)+'%'); }
  if(M.view==='top'){ const c=segColour(M.jetZ); s+=hd(st.jet==='blue'?'the blue jet':'the gigantic jet')+row('tip now',fmt(M.jetZ,1)+' km'+(M.jetDone?' (done)':''))+row('speed',st.jet==='blue'?fmt(V_BLUEJET/1e3,0)+' km/s':(M.jetZ<Z_GJ_JUMP?fmt(V_GJ_LEADER/1e3,0)+' km/s, the leader':fmt(V_GJ_JUMP/1e3,0)+' km/s, the jump'))+row('colour at the tip','1PG '+fmt(100*bandWeights(M.jetZ)[0],0)+'%, 2PG '+fmt(100*bandWeights(M.jetZ)[1]/0.25,0)+'%, 1NG '+fmt(100*bandWeights(M.jetZ)[2]/0.15,0)+'% survive')+row('gamma rays',M.rrea.xi>=5?'yes: '+fmt(M.rrea.xi,0)+' e-foldings':'no: '+fmt(M.rrea.xi,1)+' e-foldings'); }
  s+='</table>';
  const notes={storm:'colour is |E| against the runaway threshold on a log scale; magenta rings the region past it; the conventional breakdown field is 11× higher, which no storm reaches',
    flash:'the leader is drawn faint, as a high-speed camera sees it; the return stroke lights the whole tree, later strokes only the main channel; channels inside the cloud are diffused into a sheet',
    far:'green rays are sound from the channel, bending in the lapse rate; the dashed line is your line of sight and the Earth’s curve hides what lies under it; heights are stretched',
    top:'the jets are coloured by height from the same quenching of nitrogen’s bands that colours the sprites: blue where the first positive is quenched, red where it is not'};
  s+='<div class="note">'+notes[M.view]+'</div>'; return s;
}
function eqbarHTML(M){
  const st=M.st, F=M.F;
  if(M.view==='storm') return '<span class="lhs">E<sub>k</sub> = 3.2 MV/m &times; n/n&#8320;</span>, &nbsp; <span class="lhs">E<sub>th</sub> = <span class="hl">284 kV/m</span> &times; n/n&#8320;</span>, &nbsp; <span class="lhs">&lambda; = 7.3 MV / (E &minus; E<sub>th</sub>)</span><span class="sm">the field in a storm never reaches conventional breakdown; it does pass the runaway threshold, by '+fmt(M.scan.r,1)+'&times; here</span>';
  if(M.view==='flash') return '<span class="lhs">p<sub>i</sub> &prop; (&Delta;U<sub>i</sub> &minus; U<sub>c</sub>)<sup>&eta;</sup></span>, &nbsp; <span class="lhs">&Sigma;<sub>j</sub> G<sub>ij</sub> q<sub>j</sub> = U<sub>L</sub> &minus; &phi;<sub>bg</sub>(r<sub>i</sub>)</span>, &nbsp; <span class="lhs">&Sigma; q<sub>j</sub> = 0</span><span class="sm">the leader grows where the potential drop ahead is largest; every element sits at the leader&rsquo;s potential, '+(F.origin.tower?'0 for the grounded tower':fmt(F.phiL/1e6,0)+' MV here, set by zero net charge')+'; the outcome: '+M.name+'</span>';
  if(M.view==='far') return '<span class="lhs">R<sub>ray</sub> = c / |dc/dz|</span>, &nbsp; <span class="lhs">x<sub>reach</sub> = <span class="hl">&radic;(2 R h)</span></span>, &nbsp; <span class="lhs">h<sub>hidden</sub> = D&sup2;/2R<sub>&oplus;</sub></span><span class="sm">sound bends toward the cooler air above: with '+fmt(st.lapse,1)+' K/km the rays are circles of '+(isFinite(M.Rr)?fmt(M.Rr,0)+' km':'infinite radius')+' and thunder from '+fmt(M.zTopCh,1)+' km reaches '+(isFinite(M.reach)?fmt(M.reach,0)+' km':'everywhere')+'</span>';

}
function tagHTML(M){ const cap={storm:M.S.name+', '+M.S.sub, flash:M.S.name+' &mdash; '+M.phase, far:'the storm '+fmt(M.st.D,0)+' km away', top:(M.st.jet==='blue'?'a blue jet':'a gigantic jet')+' over '+M.S.name}; return '<b>'+VIEW_NAME[M.view]+'</b> &nbsp; '+cap[M.view]; }

/* ================================================================== *
 *  the prose                                                          *
 * ================================================================== */
const SRC_LINE='The taxonomy and the figures quoted from it: NOAA/NSSL, Severe Weather 101 &mdash; Lightning Types. The tripole: Williams (1989); in-cloud fields: Marshall &amp; Rust (1991); runaway breakdown: Gurevich et al. (1992), Dwyer (2003); the growth rule: Niemeyer, Pietronero &amp; Wiesmann (1984); the floating leader: Kasemir (1960); inception: Rizk (1990); stroke statistics and the current pulse: Rakov &amp; Uman (2003), Heidler (1985); thunder&rsquo;s shadow zone: Fleagle (1949); the jets: Wescott et al. (1995, 2001), Pasko et al. (2002); the bands&rsquo; quenching: Liu &amp; Pasko (2004); the Rayleigh depth: Hansen &amp; Travis (1974).';
function infoFor(v){
  const M=buildModel(), S=M.S, F=M.F, st=M.st;
  if(v==='storm') return 'A thunderstorm separates charge as graupel and ice crystals collide in its updraught: the classic picture is a <b>tripole</b>, positive near the top, the main negative near &minus;15 &deg;C, and a small positive pocket below it. Here the charges are spheres of uniform charge over a conducting ground, with their images. The field they make is largest between the main negative and the upper positive: '+fmt(M.scan.E/1e3,0)+' kV/m in '+S.name+', which is '+fmt(M.scan.r,1)+' times the <b>runaway threshold</b> but only '+fmt(100*M.scan.rk,0)+'% of the field air needs to break down conventionally. That is the standing puzzle of lightning initiation: measured fields never reach breakdown, so something &mdash; a hydrometeor&rsquo;s point, a cosmic-ray shower&rsquo;s avalanche &mdash; must bridge the gap. Under the storm the <b>field mill</b> reads '+fmt(pgAt(S,S.charges[1]?S.charges[1].x:0)/1e3,1)+' kV/m, the fair-weather +0.13 kV/m reversed and multiplied'+(S.cloud==='deck'?'; under this stratiform region the positive layer has the upper hand, so the ground field points the fair-weather way, strongly':'')+'.';
  if(v==='flash') return 'NSSL counts five to ten <b>cloud flashes</b> for every one that reaches the ground. Which happens is decided here by growing a leader in the storm&rsquo;s own field. It starts as a <b>bidirectional leader</b>: a negative end running toward higher potential and a positive end toward lower, the whole channel floating at the potential that leaves it uncharged ('+(F.origin.tower?'the tower&rsquo;s leader is grounded instead':fmt(F.phiL/1e6,0)+' MV here')+'). The <b>stepped leader</b> of a &minus;CG works down at about 200 km/s in steps, branching where the field ahead is strong; as it nears the ground, <b>upward streamers</b> rise from whatever stands tallest and the first to connect wins the strike. Then the <b>return stroke</b> runs back up at a third of the speed of light, lighting the whole tree; a &minus;CG has one to twenty strokes, each after a <b>dart leader</b> down the old channel, which is why lightning flickers and why only the main channel brightens again. A <b>+CG</b> lowers positive charge, usually in one stroke with a long continuing current. Here: <b>'+M.name+'</b>'+(F.attach&&!F.origin.tower?', striking '+F.outcome.where+' after '+msStr(F.attach.t)+(F.outcome.blue?', '+fmt(F.outcome.out,1)+' km from the rain: a <b>bolt from the blue</b>, the kind that strikes under blue sky from a storm six miles off':''):'')+(F.outcome.kind==='IC'||F.outcome.kind==='CA'?'. Its channels light the cloud from inside as a <b>sheet</b>'+(F.outcome.kind==='CA'?', and some run out into the clear air around it':''):'')+(F.outcome.spider?'. Its negative end goes on crawling along the positive layer under the deck while the current flows, '+fmt(F.spanCloud,0)+' km of it: <b>spider lightning</b>, the long horizontal flashes NSSL links to +CGs':'')+(F.origin.tower?(F.outcome.kind==='upward'?'. An <b>upward flash</b> begins at the tower, usually when a flash nearby raises the field, or on its own under a low winter storm as here':'. The tower&rsquo;s tip is not at a high enough potential to launch a leader: try a taller tower or the winter storm'):'')+'.';
  if(v==='far') return 'From '+fmt(st.D,0)+' km the storm sits on the round Earth: everything below '+fmt(M.hidden,2)+' km is behind the curve'+(M.heat?', so you see the cloud light up and no channel at all':', so the channel still shows')+'. <b>Heat lightning</b> is NSSL&rsquo;s name for any flash too far away for its thunder to be heard. The sound bends: air is cooler above, sound is slower there, and rays curve upward on circles of radius c/|dc/dz| = '+(isFinite(M.Rr)?fmt(M.Rr,0)+' km':'&infin;')+'; the ray that grazes the ground from a source at height h reaches &radic;(2Rh), so thunder from the top of this channel at '+fmt(M.zTopCh,1)+' km reaches '+(isFinite(M.reach)?fmt(M.reach,0)+' km':'any distance')+(st.lapse>=0?' &mdash; with an inversion the rays bend down and thunder carries far, as on still nights':'')+'. You are '+(M.audible?'inside that, and will hear it '+fmt(M.delay,1)+' s after the flash ('+fmt(M.cs,0)+' m/s: about five seconds a mile)':'beyond that: the flash arrives, the thunder never does')+'. The flash is white, near 30,000 K; the air on the way scatters its blue (&lambda;<sup>&minus;4</sup>) and takes the haze&rsquo;s share, which is why distant lightning looks '+(M.T[2]/M.T[0]<0.5?'reddish, like a sunset':'nearly white from here')+'.';
  return 'Above a storm the air thins and the field a charge makes falls more slowly than the breakdown field does, so discharges can climb far. A <b>blue jet</b> leaves the top of the cloud as a narrow cone at about 100 km/s and fades near 40&ndash;50 km in a quarter of a second; it is blue because below about 50 km collisions quench nitrogen&rsquo;s red first-positive band before it can radiate, and what is left is the blue second positive and the ion&rsquo;s first negative. A <b>gigantic jet</b> starts the same way, then jumps to the ionosphere near 90 km at 10,000 km/s, and its upper part turns red for the same reason sprites are red. <b>Elves</b> are the stroke&rsquo;s radio pulse lighting the 90-km layer on a ring up to 300 miles across for less than a millisecond, and <b>sprites</b> are the subject of their own page. The <b>terrestrial gamma-ray flash</b> is different: where the storm&rsquo;s field exceeds the runaway threshold over a deep enough region, a cosmic-ray electron multiplies in an avalanche of relativistic electrons, e<sup>&xi;</sup> of them with &xi; = &int;dz/&lambda;; '+S.name+' gives &xi; = '+fmt(M.rrea.xi,0)+(M.rrea.xi>=5?', enough to draw the beam here (a real TGF needs 10<sup>17</sup> electrons, which takes feedback as well)':', too few for a beam')+'. Ordinary stepped leaders make X-rays the same way, in bursts at each step.';
}
function physFor(v){
  if(v==='storm') return '<h4>the charges</h4><span class="eq">&phi; = kq/d (d &ge; a), &nbsp; kq(3a&sup2; &minus; d&sup2;)/2a&sup3; (d &lt; a); &nbsp; E = kq/d&sup2;, &nbsp; kqd/a&sup3;<span class="n">(1)</span></span><p>each charge a uniformly charged sphere of radius a, with its image &minus;q below the ground so the ground is at &phi; = 0. The field mill reads the potential gradient &minus;E<sub>z</sub> at z = 0.</p>'
    +'<h4>the two thresholds</h4><span class="eq">E<sub>k</sub> = 3.2 MV/m &times; n/n&#8320;, &nbsp; E<sub>th</sub> = 284 kV/m &times; n/n&#8320;<span class="n">(2)</span></span><p>conventional breakdown, and the threshold above which an energetic electron gains more from the field than it loses to the air (Dwyer 2003), both scaling with density (US Standard Atmosphere).</p>'
    +'<h4>the avalanche</h4><span class="eq">&lambda; = 7.3 MV / (E &minus; E<sub>th</sub>), &nbsp; &xi; = &int; dz/&lambda;<span class="n">(3)</span></span><p>the e-folding length of a relativistic runaway avalanche and the number of e-foldings along the axis through the strongest field. Fields of 100&ndash;400 kV/m are what balloons measure in storms (Marshall &amp; Rust).</p><p class="cite">'+SRC_LINE+'</p>';
  if(v==='flash') return '<h4>the leader&rsquo;s charge</h4><span class="eq">&Sigma;<sub>j</sub> G<sub>ij</sub> q<sub>j</sub> = U<sub>i</sub> &minus; &phi;<sub>bg</sub>(r<sub>i</sub>), &nbsp; G<sub>ij</sub> = k(1/r<sub>ij</sub> &minus; 1/r&prime;<sub>ij</sub>), &nbsp; G<sub>ii</sub> = (2k/&ell;) ln(&ell;/r<sub>c</sub>) &minus; k/2z<sub>i</sub><span class="n">(4)</span></span>'
    +'<p>every 125-m element i carries the charge q<sub>i</sub> that puts it at its target potential U<sub>i</sub>: the leader&rsquo;s U<sub>L</sub> for the floating channel, 0 for the tower and the connecting leaders. r&prime; is the distance to the image. The Cholesky factor of G grows a row per element, so the solve stays cheap.</p>'
    +'<h4>the floating leader</h4><span class="eq">q = a + U<sub>L</sub>b, &nbsp; a = G<sup>&minus;1</sup>(&minus;&phi;<sub>bg</sub>), &nbsp; b = G<sup>&minus;1</sup>1<sub>L</sub>, &nbsp; &Sigma;<sub>L</sub>q = 0 &rArr; U<sub>L</sub> = &minus;&Sigma;<sub>L</sub>a / &Sigma;<sub>L</sub>b<span class="n">(5)</span></span><p>Kasemir&rsquo;s bidirectional leader: a conductor that carries no net charge takes the potential the field gives it, positive at one end and negative at the other.</p>'
    +'<h4>growth</h4><span class="eq">&Delta;U<sub>i</sub> = &plusmn;(&phi;(r<sub>i</sub>) &minus; U<sub>L</sub>), &nbsp; p<sub>i</sub> &prop; (&Delta;U<sub>i</sub> &minus; U<sub>c</sub>)<sup>&eta;</sup>, &nbsp; &eta; = 4<span class="n">(6)</span></span><p>a negative tip grows toward higher potential, a positive one toward lower; U<sub>c</sub> = 6 MV for negative and 3 MV for positive tips at 4 km, scaling with density (assumed: positive leaders are known to run in weaker fields). Each step takes &ell;/v: 200 km/s for the stepped leader, 150 for positive leaders, 10,000 for dart leaders (NSSL: 50-yard steps; the return stroke at 60,000 miles/s = c/3).</p>'
    +'<h4>the strike</h4><span class="eq">U<sub>c</sub>(h) = 1556 kV / (1 + 3.89 m/h)<span class="n">(7)</span></span><p>Rizk&rsquo;s potential for an upward positive leader from a structure h tall: the tower, the tree (20 m) and the house (8 m) each launch a connecting leader when the potential at their tip, the storm&rsquo;s plus the descending leader&rsquo;s, passes it. The return stroke then lights each element after d/v<sub>rs</sub>; the current is a Heidler pulse (&tau;&#8321; = 1.8 &mu;s, &tau;&#8322; = 95 &mu;s) of 30 kA for a first stroke and 12 kA for the rest, 60 ms apart (log-normal), with 5 and 1.5 C; the continuing current 200 A.</p><p class="cite">'+SRC_LINE+'</p>';
  if(v==='far') return '<h4>the Earth&rsquo;s curve</h4><span class="eq">h<sub>hidden</sub> = D&sup2;/2R, &nbsp; R = 7/6 R<sub>&oplus;</sub><span class="n">(8)</span></span><p>the height a point D away must have to be seen over the horizon by an eye at the ground, with standard refraction; the cloud tops at 12 km are visible to 420 km, a channel&rsquo;s bottom kilometre only to 120.</p>'
    +'<h4>thunder</h4><span class="eq">c = 331.3 &radic;(T/273.15) m/s, &nbsp; dc/dz = 0.6 &Gamma; m s<sup>&minus;1</sup>km<sup>&minus;1</sup>, &nbsp; R<sub>ray</sub> = c/|dc/dz|<span class="n">(9)</span></span><span class="eq">x<sub>reach</sub> = &radic;(2 R h), &nbsp; 1/R = 1/R<sub>ray</sub> + 1/R<sub>&oplus;</sub><span class="n">(10)</span></span><p>in a linear gradient the rays are circles; the one that leaves a source at height h and just grazes the ground reaches x<sub>reach</sub>, and beyond it lies the shadow zone (Fleagle 1949). With the standard lapse rate &Gamma; = &minus;6.5 K/km that is 26 km from 4 km up and 33 km from 6: NSSL&rsquo;s heat lightning. An inversion (&Gamma; &gt; 0) bends the rays down and the zone vanishes.</p>'
    +'<h4>the colour</h4><span class="eq">T(&lambda;) = exp[&minus;D (n/n&#8320;) (&tau;<sub>R</sub>(&lambda;) + &beta;&lambda;<sup>&minus;1.3</sup>) / 8 km]<span class="n">(11)</span></span><p>the sea-level Rayleigh depth &tau;<sub>R</sub> (Hansen &amp; Travis) spread over the 8-km scale height, at the density of a 1-km path, and an &Aring;ngstr&ouml;m haze; the three channels at 0.66, 0.55 and 0.44 &mu;m on a white flash.</p><p class="cite">'+SRC_LINE+'</p>';
  return '<h4>the jets</h4><span class="eq">z<sub>tip</sub> = z<sub>top</sub> + v t, &nbsp; v<sub>blue</sub> = 100 km/s; &nbsp; v<sub>GJ</sub> = 120 km/s to 50 km, then 10&#8308; km/s<span class="n">(12)</span></span><p>Wescott et al. (1995) measured blue jets at 100 km/s reaching 40&ndash;50 km in about 0.3 s; Pasko et al. (2002) and Su et al. (2003) saw gigantic jets climb as leaders and then jump to the ionosphere. The cone angles (8&deg; and 4&deg;, fanning to 16&deg;) are drawn, not computed.</p>'
    +'<h4>why blue, why red</h4><span class="eq">I<sub>band</sub> &prop; y<sub>band</sub> / (1 + n(z)/n<sub>q</sub>)<span class="n">(13)</span></span><p>the same quenching that colours the sprites: the first positive (red) is half quenched at 53 km and gone at 30, the second positive (blue) survives to 30 km, the first negative to 48. So a jet is blue and a gigantic jet&rsquo;s top is red.</p>'
    +'<h4>the gamma rays</h4><p>Where &xi; (equation 3) is large a seed electron becomes e<sup>&xi;</sup>; the beam is drawn for &xi; &ge; 5 in the flash&rsquo;s first 8 ms (indicative). Real TGFs need about 10<sup>17</sup> electrons, which runaway feedback supplies (Dwyer 2003); the beam points up along the field and lasts under a millisecond.</p><p class="cite">'+SRC_LINE+'</p>';
}
const HINTS={storm:'space plays or pauses · 1–4 switch views · pick a storm on the right',flash:'space plays or pauses · 1–4 switch views · another flash reseeds the leader',far:'drag the distance · space plays or pauses · 1–4 switch views',top:'space plays or pauses · 1–4 switch views'};

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene'), panel=document.getElementById('panel'), tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout'), eqEl=document.getElementById('eqbar'), tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint'), errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;
  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));
  let lastView=null;
  function setView(k){ st.view=k; syncAll(); }
  TABS.forEach(([k,l])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:l})); });
  const rows={};
  function slider(key,l,lo,hi,step2,fmtf,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])}), val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,l),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value)); syncAll(); });
    let rk=key; while(rows[rk]) rk+='+'; rows[rk]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  const CHIPROWS=[];
  function chipRow(list,key){ const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip',html:o.name,onclick:()=>{ st[key]=o.id; syncAll(); }})); });
    CHIPROWS.push([wrapEl,list,key]); return wrapEl; }

  const gJ=h('div',{class:'grp'},h('h3',null,'the clock'));
  const playBtn=h('button',{onclick:()=>{ if(st.t>=T_END-1e-9) st.t=T_START; st.play=!st.play; syncAll(); }},'pause');
  gJ.appendChild(h('div',{class:'btnrow'},playBtn,h('button',{onclick:()=>{ st.t=T_START; st.play=true; syncAll(); }},'from the start')));
  gJ.appendChild(slider('t','time',0,1000,1,v=>(v<0?'−':'+')+fmt(Math.abs(v),1)+' ms',{to:u=>T_START+(T_END-T_START)*u/1000,from:v=>1000*(v-T_START)/(T_END-T_START)}));
  gJ.appendChild(slider('rate','playback, ms/s',0,LOGN,1,v=>fmt(v,v<10?1:0),logMap(LIM.rate[0],LIM.rate[1])));
  const jTag=h('div',{class:'tag'}); gJ.appendChild(jTag);

  const gS=h('div',{class:'grp'},h('h3',null,'the storm')); const stormRow=chipRow(STORM_LIST,'storm'); gS.appendChild(stormRow);
  [].forEach.call(stormRow.children,(bt,i)=>{ bt.onclick=()=>{ const id=STORM_LIST[i].id; st.storm=id; Object.assign(st,STORM_PRESET[id]); syncAll(); }; }); const sTag=h('div',{class:'tag'}); gS.appendChild(sTag);
  const gF=h('div',{class:'grp'},h('h3',null,'the flash')); gF.appendChild(chipRow(FLASH_LIST,'flash'));
  gF.appendChild(slider('towerH','the tower, m',0,LOGN,1,v=>fmt(v*1e3,0),logMap(LIM.towerH[0],LIM.towerH[1])));
  gF.appendChild(slider('nStrokes','strokes (−CG)',LIM.nStrokes[0],LIM.nStrokes[1],1,v=>fmt(v,0)));
  gF.appendChild(slider('cc','continuing current, ms',LIM.cc[0],LIM.cc[1],10,v=>fmt(v,0)));
  gF.appendChild(h('div',{class:'btnrow'},h('button',{onclick:()=>{ st.seed+=1; syncAll(); }},'another flash (new branches)')));
  const fTag=h('div',{class:'tag'}); gF.appendChild(fTag);
  const gD=h('div',{class:'grp'},h('h3',null,'far away'));
  gD.appendChild(slider('D','distance, km',0,LOGN,1,v=>fmt(v,0),logMap(LIM.D[0],LIM.D[1])));
  gD.appendChild(slider('lapse','lapse rate, K/km',LIM.lapse[0],LIM.lapse[1],0.5,v=>(v>0?'+':'')+fmt(v,1)));
  gD.appendChild(slider('TK','air temperature, °C',LIM.TK[0],LIM.TK[1],1,v=>fmt(v-273.15,0)));
  gD.appendChild(slider('haze','haze β',LIM.haze[0],LIM.haze[1],0.01,v=>fmt(v,2)));
  const gT=h('div',{class:'grp'},h('h3',null,'above the storm')); gT.appendChild(chipRow(JET_LIST,'jet'));
  const gR=h('div',{class:'grp'},h('div',{class:'btnrow'},h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); syncAll(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gR.appendChild(keysTag);
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at')), infoEl=h('div',{id:'info'}); gInfo.appendChild(infoEl);
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation')), physEl=h('div',{id:'phys'}); gPhys.appendChild(physEl);
  [gJ,gS,gF,gD,gT,gR,gInfo,gPhys].forEach(g=>panel.appendChild(g));

  function syncAll(){ dirty=true; refreshPanel(); }
  function refreshPanel(){
    try{
      const v=st.view;
      [].forEach.call(tabsEl.children,(bt,i)=>bt.className=TABS[i][0]===v?'active':'');
      for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(bt,i)=>bt.className='chip'+(list[i].id===st[key]?' on':''));
      for(const k in rows) rows[k].sync();
      playBtn.textContent=st.play?'pause':(st.t>=T_END-1e-9?'play again':'play');
      const M=S.model(), F=M.F;
      jTag.innerHTML=M.phase;
      sTag.innerHTML=M.S.sub+'; the strongest field <b>'+fmt(M.scan.E/1e3,0)+' kV/m</b> = '+fmt(M.scan.r,1)+' E<sub>th</sub>';
      fTag.innerHTML='<b>'+M.name+'</b>'+(F.attach&&!F.origin.tower?': '+F.outcome.where+' after '+msStr(F.attach.t)+(F.strokes.length>1?', '+F.strokes.length+' strokes':''):'')+(F.outcome.kind==='IC'||F.outcome.kind==='CA'?': '+thou(F.cells.length*ELL/1e3,0)+' km of channel, none to ground':'');
      keysTag.innerHTML='1&ndash;4 switch views &nbsp; space plays or pauses';
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M); hintEl.textContent=HINTS[v];
      if(v!==lastView){ infoEl.innerHTML=infoFor(v); physEl.innerHTML=physFor(v); lastView=v; }
      else if(!st.play) infoEl.innerHTML=infoFor(v);
    }catch(e){ fail(e); }
  }
  window.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')) return;
    if(e.key===' '){ e.preventDefault(); playBtn.click(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });
  function resize(){ const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr); canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0); S.W=r.width; S.H=r.height; }
  window.addEventListener('resize',()=>{ resize(); dirty=true; });
  let frames=0;
  function frameLoop(){
    const wasView=st.view, wasPlay=st.play;
    S.step();
    try{ S.draw(); }catch(e){ fail(e); }
    if(st.view!==wasView||st.play!==wasPlay||dirty||(++frames%8===0)){ dirty=false; refreshPanel(); }
    requestAnimationFrame(frameLoop);
  }
  resize(); refreshPanel(); requestAnimationFrame(frameLoop);
  return S;
}

/* ================================================================== *
 *  selfTest — headless (jsc)                                           *
 * ================================================================== */
function stubCtx(){ const g={addColorStop(){}}; const c={measureText:t=>({width:String(t).length*6}),createRadialGradient:()=>g,createLinearGradient:()=>g};
  for(const k of ['fillRect','strokeRect','beginPath','moveTo','lineTo','arc','closePath','fill','stroke','fillText','save','restore','setLineDash','translate','scale','rotate','clip','rect','bezierCurveTo','setTransform']) c[k]=function(){};
  return c; }
function selfTest(){
  let pass=0, fail=0; const T0=Date.now();
  const ok=(c,m)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+m); } };
  const rel=(a,b,tol,m)=>ok(Math.abs(a/b-1)<tol,m+' ('+a+' vs '+b+')');
  /* the atmosphere and the thresholds */
  rel(atmo(75).p,2.3881,3e-3,'p at 75 km'); rel(N0,2.547e25,1e-3,'sea-level density'); ok(Eth(8)>110e3&&Eth(8)<135e3,'E_th at 8 km = '+fmt(Eth(8)/1e3,0)+' kV/m'); rel(Ek(0)/Eth(0),3.2e6/2.84e5,1e-12,'E_k / E_th');
  /* the spheres */
  rel(spherePhi(1,1000,1000),spherePhi(1,1000,999.999),1e-6,'the potential is continuous at the surface'); rel(sphereE(1,1000,2000),KC/4e6,1e-12,'outside, a point charge'); rel(sphereE(1,1000,500),KC*500/1e9,1e-12,'inside, linear');
  { const S=STORMS.mature; ok(Math.abs(phiBg(S,3,0))<1e-6*Math.abs(phiBg(S,3,1)),'the ground is at zero potential'); const pg=pgAt(S,0); ok(pg<-4e3&&pg>-12e3,'the field mill under the mature storm: '+fmt(pg,0)+' V/m');
    const b=fieldScan(S); ok(b.E>1.5e5&&b.E<4.5e5,'the strongest field '+fmt(b.E/1e3,0)+' kV/m is what balloons measure'); ok(b.r>1&&b.rk<0.5,'past the runaway threshold, far from conventional breakdown'); ok(b.z>6.5&&b.z<10,'between the main negative and the upper positive ('+b.z+' km)');
    const r1=rreaFoldings(S), r2=rreaFoldings(STORMS.sheared), r3=rreaFoldings(STORMS.stratiform); ok(r1.xi>r2.xi&&r2.xi>r3.xi&&r3.xi===0,'avalanche e-foldings: mature '+fmt(r1.xi,0)+' > sheared '+fmt(r2.xi,0)+' > stratiform 0');
    ok(pgAt(STORMS.stratiform,0)>0,'under the stratiform deck the ground field points the fair-weather way'); ok(pgAt(STORMS.winter,2)<-20e3,'the winter storm over the tower: '+fmt(pgAt(STORMS.winter,2)/1e3,0)+' kV/m'); }
  rel(rizkU(300),1.556e6/(1+3.89/300),1e-12,'Rizk at 300 m'); ok(rizkU(20)<rizkU(300)&&rizkU(300)<1.56e6,'Rizk rises with height toward 1.56 MV');
  /* the leader: its elements sit at their target potential */
  { const Fi=withState({flash:'IC'},()=>flash(ST)); const n=Fi.all.length; ok(n>20,'the intracloud flash has '+n+' elements');
    let worst=0; for(let s=0;s<6;s++){ const c=Fi.all[Math.floor(s*(n-1)/5)]; const target=c.tree<10?Fi.phiL:0; const p=phiBg(Fi.S,c.x,c.z)+Fi.charge.reduce((acc,q,j)=>acc+q*couple(c.x,c.z,Fi.all[j].x,Fi.all[j].z),0); worst=Math.max(worst,Math.abs(p-target)/Math.max(1e6,Math.abs(target))); }
    ok(worst<1e-6,'every element of a floating leader sits at its potential (worst '+sigf(worst,2)+')'); const qn=Fi.all.filter(c=>c.tree<10).reduce((s,c)=>s+Fi.charge[c.id],0); ok(Math.abs(qn)<1e-6*Fi.qLeader+1e-12,'and it carries no net charge');
    ok(Fi.all.some(c=>c.pol<0)&&Fi.all.some(c=>c.pol>0&&c.tree<10),'both ends of the bidirectional leader grow'); }
  { const F=withState({},()=>flash(ST)); let worst=0; for(const c of F.all){ const p=phiBg(F.S,c.x,c.z)+F.charge.reduce((acc,q,j)=>acc+q*couple(c.x,c.z,F.all[j].x,F.all[j].z),0); worst=Math.max(worst,Math.abs(p)/1e6); } ok(worst<1e-6,'after the strike every element is at the ground\'s potential (worst '+sigf(worst,2)+' MV)');
    ok(F.all.some(c=>c.pol>0&&c.tree<10&&!c.post),'the −CG leader\'s positive end grew into the cloud before the strike');
    ok(F.outcome.kind==='negCG','the mature storm gives a −CG'); ok(F.attach&&F.attach.t>20&&F.attach.t<60,'the stepped leader reaches the ground in '+fmt(F.attach.t,0)+' ms'); const nb=F.cells.filter(c=>c.children.length>1).length; ok(nb>=3&&nb<=40,nb+' branch points');
    ok(F.qLeader/(F.cells.length*ELL)>2e-5&&F.qLeader/(F.cells.length*ELL)<3e-3,'the floating leader carries '+fmt(F.qLeader/(F.cells.length*ELL)*1e3,3)+' mC/m (a connected one about 1)'); ok(F.phiL<-5e6&&F.phiL>-100e6,'its potential is '+fmt(F.phiL/1e6,0)+' MV');
    ok(F.strokes.length===4,'four strokes'); for(let s=1;s<4;s++) ok(F.strokes[s].t-F.strokes[s-1].t>20&&F.strokes[s].t-F.strokes[s-1].t<200,'interstroke interval '+fmt(F.strokes[s].t-F.strokes[s-1].t,0)+' ms');
    const branch=F.cells.find(c=>!F.main.has(c.id)&&c.parent>=0), mainTop=F.cells.filter(c=>F.main.has(c.id)).sort((a,b)=>b.z-a.z)[0];
    if(branch){ ok(cellLight(F,branch,F.strokes[0].t+0.3,2)>0.5,'the first stroke lights the branches'); ok(cellLight(F,branch,F.strokes[1].t+0.3,2)<0.05,'the second does not'); }
    ok(cellLight(F,mainTop,F.strokes[1].t+0.3,2)>0.5,'but it lights the main channel'); const tl=F.strokes[0].t+F.dist[mainTop.id]/V_RS*1e3; ok(cellLight(F,mainTop,tl-0.01,2)<0.4&&cellLight(F,mainTop,tl+0.02,2)>0.9,'the return stroke reaches the top after d/v_rs = '+fmt((tl-F.strokes[0].t)*1e3,0)+' µs');
    rel(chargeBy(F,F.tEnd),5+3*1.5,1e-9,'charge to ground'); ok(currentAt(F,F.strokes[0].t-0.01)===0&&Math.abs(currentAt(F,F.strokes[0].t+0.0084)/F.strokes[0].Ip-1)<0.02,'the current pulse peaks at I_p after 8.4 µs');
    const LC=flashLightCurve(F,2); const iPk=LC.L.indexOf(1); ok(Math.abs(LC.ts[iPk]-F.strokes[0].t)<3,'the light peaks at the first stroke'); }
  { const F=withState({storm:'stratiform',flash:'posCG',cc:150},()=>flash(ST)); ok(F.outcome.kind==='posCG'&&F.strokes.length===1,'the stratiform region gives a +CG with one stroke'); ok(F.phiL>0,'its leader is positive ('+fmt(F.phiL/1e6,0)+' MV)');
    ok(F.nPost>30&&F.outcome.spider&&F.spanCloud>8,'and its negative end crawls '+fmt(F.spanCloud,0)+' km along the layer during the continuing current: spider lightning ('+F.nPost+' elements after the attachment)');
    const pc=F.cells.find(c=>c.post); ok(pc&&pc.t>F.attach.t&&cellLight(F,pc,pc.t+1,2)>0.3&&cellLight(F,pc,pc.t-1,2)===0,'those elements light as they grow'); }
  { const F=withState({},()=>flash(ST)); ok(F.nPost>0&&F.cells.filter(c=>c.post).every(c=>inCloud(F.S,c.x,c.z)||c.z>F.S.base-1),'after a −CG attaches, the channel keeps growing only in the cloud'); }
  { const F=withState({storm:'mature',flash:'IC'},()=>flash(ST)); ok(!F.attach&&(F.outcome.kind==='IC'||F.outcome.kind==='CA'),'the mature storm\'s intracloud leader stays aloft'); ok(F.cells.length>50,'and spreads: '+F.cells.length+' elements'); }
  { const F=withState({storm:'mature',flash:'posCG'},()=>flash(ST)); ok(!F.attach,'a positive leader from the mature storm\'s top does not reach the ground'); }
  { const Fw=withState({storm:'winter',flash:'upward',towerH:0.3},()=>flash(ST)), Fm=withState({storm:'mature',flash:'upward',towerH:0.3},()=>flash(ST)); ok(Fw.outcome.kind==='upward','a 300-m tower under the winter storm launches an upward flash'); ok(Fm.outcome.kind==='upshort','and not under the mature storm'); ok(Fw.strokes.length>0&&Fw.strokes[0].Ip===0&&Fw.strokes[0].cc>=100,'the upward flash starts with a continuous current'); }
  { const F1=withState({seed:1},()=>flash(ST)), F2=withState({seed:2},()=>flash(ST)); ok(F1.cells.length!==F2.cells.length||F1.outcome.x!==F2.outcome.x,'another seed, another flash'); }
  /* far away */
  rel(soundSpeed(293.15),343.2,2e-3,'sound at 20 °C'); rel(rayRadius(-6.5),343/(0.6*6.5e-3)/1e3,1e-9,'the rays\' radius'); ok(thunderReach(4,-6.5)>24&&thunderReach(4,-6.5)<28,'thunder from 4 km reaches '+fmt(thunderReach(4,-6.5),1)+' km'); ok(!isFinite(thunderReach(4,2)),'an inversion: no shadow zone');
  rel(hiddenBelow(100),100*100/(2*R_OPT),1e-12,'hidden height at 100 km'); ok(hiddenBelow(150)>STORMS.mature.base,'at 150 km the channel is behind the curve'); { const T=pathTransmission(50,0.05,1); ok(T[0]>3*T[2],'at 50 km the red gets through '+fmt(T[0]/T[2],1)+'× better than the blue'); const T5=pathTransmission(5,0.05,1); ok(T5[2]>0.7,'at 5 km the flash is still white'); }
  /* above */
  rel(jetTip('blue',1000,15),Z_BLUEJET,1e-12,'the blue jet stops at 42 km'); ok(jetTip('blue',100,15)>24&&jetTip('blue',100,15)<26,'100 km/s'); ok(jetTip('gj',300,15)>=Z_GJ-1e-9,'the gigantic jet is at the ionosphere by 300 ms'); ok(jetTip('gj',250,15)<Z_GJ_JUMP+1,'and still a leader at 250 ms');
  { const c25=segColour(25).rgb, c70=segColour(70).rgb; ok(c25[2]>c25[0],'blue at 25 km'); ok(c70[0]>c70[2],'red at 70 km'); }
  /* every view at four sizes and at times through the flash: no throw, no NaN in the text */
  const sizes=[[1400,820],[1100,712],[820,520],[560,380]], times=[-5,0,5,20,38,40,41,60,100,101,160,250,400];
  for(const v of ['storm','flash','far','top']) for(const t of times) for(const [W,H] of sizes){
    withState({view:v,t},()=>{ let err=null; try{ drawView(stubCtx(),W,H,buildModel()); }catch(e){ err=e; } ok(!err,v+' at '+fmt(t,0)+' ms, '+W+'x'+H+(err?': '+(err.stack||err):''));
      const Mv=buildModel(), s=readoutHTML(Mv)+eqbarHTML(Mv)+tagHTML(Mv)+infoFor(v)+physFor(v); ok(!/NaN|undefined|Infinity/.test(s),v+' at '+fmt(t,0)+' ms: the text is clean'); }); }
  for(const over of [{storm:'sheared'},{storm:'stratiform',flash:'posCG',cc:150},{storm:'winter',flash:'upward'},{storm:'mature',flash:'IC'},{flash:'posCG'},{towerH:0.6,flash:'upward'},{D:150,lapse:2},{D:1,TK:313,haze:0.3},{jet:'gj'},{nStrokes:12,cc:300}])
    withState(over,()=>{ for(const v of ['storm','flash','far','top']) for(const t of [0,30,120,300]) withState({view:v,t},()=>{ let err=null; try{ drawView(stubCtx(),1100,712,buildModel()); }catch(x){ err=x; } ok(!err,JSON.stringify(over)+' '+v+(err?': '+(err.stack||err):''));
      const Mv=buildModel(); ok(!/NaN|undefined|Infinity/.test(readoutHTML(Mv)+eqbarHTML(Mv)+infoFor(v)),JSON.stringify(over)+' '+v+' text clean'); }); });
  console.log(pass+' passed, '+fail+' failed ('+(Date.now()-T0)+' ms)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}
if(typeof document==='undefined'){ if(typeof SKIP_SELFTEST==='undefined') selfTest(); }
else { if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot(); }
