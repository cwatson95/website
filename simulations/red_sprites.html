<title>Red Sprites &mdash; a stroke below, a field through the leaky air, a discharge at 75 km, seen from the ground and from orbit</title>
<!--
  ===================================================================
  red_sprites.html — red sprite lightning: a positive cloud-to-ground
  stroke removes charge from a storm, its field soaks up through the
  atmosphere (a leaky dielectric over a conducting ground) faster
  than the air aloft can screen it, exceeds the breakdown field near
  75 km, and a sprite of streamers grows down and up from there; the
  same sprite, a cluster of elements in the jellyfish form, as a
  camera on the ground 450 km away sees it through the air, and as
  a camera in orbit sees it against the limb
  ===================================================================

  Four views on one clock in milliseconds, switched by the tabs.  THE
  STROKE: the storm in cross-section, the stroke taking
  charge Q from height h, the field E(r,z,t) in the air above as the
  quasi-electrostatic solution in a horizontally stratified conductor
  over a perfectly conducting ground, the ratio E/E_k to the
  breakdown field, and the streamers.  THE MEDIUM: the conductivity,
  the relaxation time eps0/sigma and the breakdown field against
  height, and the field at each height against time: why 75 km.
  FROM THE GROUND: the sprite a camera 450 km away sees above the
  horizon, coloured by height from the quenching of N2's bands, then
  reddened by the air in the way (Rayleigh and aerosol extinction on
  a low slant path).  FROM SPACE: the same sprite from an orbit at
  420 km: the limb, the airglow layer, the lightning under the cloud,
  the elve racing out at 90 km, and the sprite.

  WHAT IS TAKEN FROM THE LITERATURE
  -----------------------------------------------------------------------
  Pasko, Inan, Bell & Taranenko (1997) for the quasi-electrostatic
  picture (a charge removed faster than the air above can relax);
  Wilson (1925) for the idea; the conventional breakdown field
  3.2 MV/m at sea-level density (Raizer 1991), scaling with density;
  the US Standard Atmosphere 1976 for p, T and n(z); a nighttime
  conductivity profile approximately as in Pasko et al. (1997) and
  Holzworth et al.; the streamer stability fields 4.4 and 12.5 kV/cm
  at sea level (Raizer; Babaeva & Naidis 1997); the quenching heights
  of N2 1PG (53 km), N2 2PG (30 km) and N2+ 1NG (48 km) as compiled
  by Liu & Pasko (2004) from Vallance Jones (1974); Sentman et al.
  (1995) and Stenbaek-Nielsen et al. for what sprites look like and
  how fast the streamers run (about 10^7 m/s); Inan et al. (1997) and
  Fukunishi et al. (1996) for the elve; Hansen & Travis (1974) for the
  Rayleigh optical depth; Kasten & Young (1989) for the airmass.

  WHAT IS COMPUTED HERE (checked by selfTest, run headless under jsc)
  -----------------------------------------------------------------------
  The field: d/dt(eps0 div E) + div(sigma E) = source, solved exactly
  (to the grid) for a point charge removed at (0,h) by a Hankel
  transform in r and an implicit tridiagonal solve in z for each k,
  on a conducting or an insulating ground; the static limit is the
  charge and its image.  n(z), E_k(z), tau(z); where and when E first
  exceeds E_k, and the least charge moment that would; the streamer
  tree (seeded, deterministic) run through the time-dependent field
  with the stability-field rule; the colour of each segment from the
  quenching; the camera geometry on a round Earth with the horizon,
  the limb, the elevation and the airmass; the extinction; the elve's
  kinematics r(t) = sqrt(c^2 t^2 - (z_e - h)^2).

  WHAT IS ASSUMED OR NOT MODELLED (and said so on the page)
  -----------------------------------------------------------------------
  The charge is a point, removed as Q(1 - exp(-t/tau_s)); the
  conductivity profile (night: 5e-14 S/m at the ground, 1e-10 at
  60 km, 1e-6 at 94 km; day: 20x above 55 km); the streamers' speed
  law, branching and widths, a +-20% spread per streamer in the field
  at which it stops, the number of elements in the cluster and their
  seeding across the breakdown region, the splay of the tendrils that
  stands in for the channels' repulsion, the upward columns drawn
  2.2x wider and 1.6x brighter, the camera's bloom; the cameras
  integrate a frame whose length is a slider (50 us to 33 ms, 0.5 ms
  by default) with the gain following it and a 1 - e^-x response; that the streamers' own charge does not
  change the field (it does, which is one reason sprites are seen at
  smaller charge moments than this model needs; Qin, Celestin & Pasko
  2012); the band yields 1 : 0.25 : 0.15 at the streamer head; the
  channel's afterglow time; the halo's brightness law; the elve's
  pulse (100 us) and its brightness law; the cloud's shape; a round
  Earth with no refraction; cameras with a linear response.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* a number rounded to n places; a value that rounds to zero prints as 0, never -0.00 (toFixed keeps the sign) */
function fmt(x,n){ if(!isFinite(x)) return '—'; const s=Number(x).toFixed(n===undefined?3:n); return /^-0(\.0*)?$/.test(s)?s.slice(1):s; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* a power of ten in superscripts, never a caret: 1.768 × 10⁸, 2.5 × 10⁻⁵ */
  if(a>=1e5||a<1e-4){ const s=x.toExponential(n-1), k=s.indexOf('e'), SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return s.slice(0,k)+' × 10'+String(+s.slice(k+1)).split('').map(c=>c==='-'?'⁻':SUP[+c]).join(''); }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
function sgn(x,n){ return (x<0?'−':'')+fmt(Math.abs(x),n); }
function thou(x,n){ return fmt(x,n||0).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sci(x,n){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
  let ms=fmt(m,n===undefined?2:n), ee=e; if(Math.abs(parseFloat(ms))>=10){ ee++; ms=fmt(x/Math.pow(10,ee),n===undefined?2:n); }
  return (ee===0?ms:ms+' × 10'+String(ee).split('').map(c=>SUPS[c]).join('')).replace(/^-/,'−'); }

/* ================================================================== *
 *  constants, the atmosphere, the leaky dielectric                    *
 * ================================================================== */
const EPS0=8.8541878128e-12, KB=1.380649e-23, C_KM_MS=299.792458;   /* c in km/ms */
const R_EARTH=6371.0;                                                 /* km */
const EK0=3.2e6;                                                      /* V/m: the conventional breakdown field at sea-level density (Raizer) */
const N0=101325/(KB*288.15);                                          /* sea-level number density, 2.547e25 m^-3 */
/* the US Standard Atmosphere 1976: base geopotential height (km), T (K), p (Pa), lapse (K/km) */

/* the segments as 2-D strokes; map(s) -> [x0,y0,x1,y1,widthPx,elevDeg]; trans(elevDeg) -> [R,G,B] is optional.

/* ================================================================== *
 *  views 3 and 4 — cameras: from the ground, through the air; from     *
 *  orbit, against the limb                                             *
 * ================================================================== */
function visibleArc(cam,rs,W,H){ const pts=limbCircle(cam,rs,480); if(!pts) return null;
  const pr=pts.map(Pt=>{ const p=project(cam,Pt,W,H); return (p&&p.Z>20&&Math.abs(p.x)<2e5&&Math.abs(p.y)<2e5)?p:null; });

  const out=[]; for(let i=1;i<=pr.length;i++){ const p=pr[(start+i+pr.length)%pr.length]; if(p) out.push(p); else if(out.length) break; }
  return out.length>4?out:null; }
/* y of an arc (sorted by x) at a given x, by interpolation */
function arcYat(arc,x){ let bi=0, bd=Infinity; for(let i=0;i<arc.length;i++){ const d=Math.abs(arc[i].x-x); if(d<bd){ bd=d; bi=i; } }

const BLOOM={};
function bloom(ctx,strength){ if(typeof document==='undefined'||!ctx.canvas||!ctx.canvas.width) return;
  const src=ctx.canvas, cw=src.width, ch=src.height;
  for(const [div,alpha] of [[6,0.5*strength],[18,0.45*strength]]){ const k='c'+div; let c=BLOOM[k]; const w=Math.max(2,Math.round(cw/div)), h=Math.max(2,Math.round(ch/div));

    const gr=ctx.createRadialGradient(0,0,0,0,0,1); gr.addColorStop(0,rgbStr([235*T[0],240*T[1],255*T[2]],a)); gr.addColorStop(0.45,rgbStr([200*T[0],210*T[1],255*T[2]],0.45*a)); gr.addColorStop(1,'rgba(180,190,255,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,1,0,TAU); ctx.fill(); ctx.restore(); };
  if(kind==='ground'){
    drawCloud();
    const yH=horizonY(cam,W,H);
    const gg=ctx.createLinearGradient(0,yH,0,H); gg.addColorStop(0,'#0b0d14'); gg.addColorStop(1,'#05060a'); ctx.fillStyle=gg; ctx.fillRect(0,yH,W,H-yH+2);
    ctx.strokeStyle='rgba(60,66,84,0.9)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,yH+0.5); ctx.lineTo(W,yH+0.5); ctx.stroke();
    txt(ctx,'the horizon',8,yH-5,COL.dim,'italic 10.5px Georgia, serif');
    /* the cloud tops are below it: the stroke's light leaks over */
  } else {
    const arc=visibleArc(cam,R_EARTH,W,H);
    if(arc){ ctx.fillStyle=COL.earth; ctx.beginPath(); ctx.moveTo(arc[0].x,arc[0].y); for(const p of arc) ctx.lineTo(p.x,p.y); ctx.lineTo(arc[arc.length-1].x,H+4000); ctx.lineTo(arc[0].x,H+4000); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(70,80,110,0.5)'; ctx.lineWidth=1; ctx.beginPath(); for(let i=0;i<arc.length;i++){ if(i===0) ctx.moveTo(arc[i].x,arc[i].y); else ctx.lineTo(arc[i].x,arc[i].y); } ctx.stroke(); }
    /* the airglow layer, 85 to 100 km, brightest near 92 */
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let z=84;z<=101;z+=1.5){ const a=0.16*Math.exp(-Math.pow((z-92)/4.5,2)); const A=visibleArc(cam,R_EARTH+z,W,H); if(!A) continue;
      const B=visibleArc(cam,R_EARTH+z+1.5,W,H); let lw=3; if(B) lw=Math.max(2,Math.abs(arcYat(A,W/2)-arcYat(B,W/2))+1);
      ctx.strokeStyle=rgbStr([150,215,120],a); ctx.lineWidth=lw; ctx.beginPath(); for(let i=0;i<A.length;i++){ if(i===0) ctx.moveTo(A[i].x,A[i].y); else ctx.lineTo(A[i].x,A[i].y); } ctx.stroke(); }
    ctx.restore();
    const A92=visibleArc(cam,R_EARTH+92,W,H); if(A92){ const lx=Math.max(8,W-RO_W-190); txt(ctx,'the airglow layer, ~92 km',lx,arcYat(A92,lx)-9,'rgba(150,215,120,0.9)','italic 10.5px Georgia, serif','left'); }
    if(arc){ const ly=arcYat(arc,60); if(ly>0&&ly<H) txt(ctx,'the limb',60,ly+14,COL.dim,'italic 10.5px Georgia, serif','left'); }
    drawCloud();
  }
  /* the elve: a ring at 90 km between r_in and r_out */
  for(const ev of elves){ const ring=r=>{ const pts=[]; for(let i=0;i<=96;i++){ const a=TAU*i/96, p=P(r*Math.cos(a),r*Math.sin(a),Z_ELVE); if(!p) return null; pts.push(p); } return pts; };
    const o=ring(ev.rOut), inn=ev.rIn>0?ring(ev.rIn):null; const pc=P(0,0,Z_ELVE);
    if(o&&pc){ const T=ext(pc.elev*180/PI), a=clamp(0.16*ev.b*gain*(elves.length>1?1.6/elves.length:1)*(kind==='ground'?0.5:1),0,0.6);   /* from the ground the elve is a faint, brief flush overhead */
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=rgbStr([255*T[0],105*T[1],70*T[2]],a); ctx.beginPath();
      o.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
      if(inn){ inn.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.fill('evenodd'); } else ctx.fill();
      ctx.restore(); if(kind==='space'){ const p=o[72]; if(p.y>0&&p.y<H) txt(ctx,'the elve',p.x+8,p.y-6,COL.elve,'italic 10.5px Georgia, serif'); } } }
  /* the halo */
  if(halo.I>0){ const zh=halo.z+7, rh=Math.max(halo.r,M.TREE.rCluster*1.6,30); const pc=P(0,0,zh), pe=P(rh,0,zh), pu=P(0,0,zh+16);
    if(pc&&pe&&pu){ const rx=Math.max(4,Math.abs(pe.x-pc.x)), ry=Math.max(3,Math.abs(pu.y-pc.y)), T=ext(pc.elev*180/PI), a=clamp(0.6*Math.min(1,halo.I/2)*gain,0,0.65);
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(pc.x,pc.y); ctx.scale(rx,ry); const gr=ctx.createRadialGradient(0,0,0,0,0,1); gr.addColorStop(0,rgbStr([255*T[0],90*T[1],70*T[2]],a)); gr.addColorStop(1,'rgba(255,90,70,0)'); ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,1,0,TAU); ctx.fill(); ctx.restore(); } }
  /* the streamers */
  drawSegs2D(ctx,M,s=>{ const a=P(s.x0,s.y0,s.z0), b=P(s.x1,s.y1,s.z1); if(!a||!b) return null; return [a.x,a.y,b.x,b.y,Math.max(0.8,fpx*s.w/a.dist),a.elev*180/PI]; },gain,
    kind==='ground'&&st.air? ext : null, Texp);
  bloom(ctx,1);
  /* the scale: 5 degrees, bottom left */
  const bar=fpx*Math.tan(5*PI/180), bx=14, by=H-28; ctx.strokeStyle=COL.dim; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(bx,by+0.5); ctx.lineTo(bx+bar,by+0.5); ctx.moveTo(bx,by-3); ctx.lineTo(bx,by+4); ctx.moveTo(bx+bar,by-3); ctx.lineTo(bx+bar,by+4); ctx.stroke();
  txt(ctx,'5°',bx+bar+6,by+4,COL.dim,'10.5px -apple-system, sans-serif');
  const expS='a '+(Texp<1?fmt(Texp*1e3,0)+'-µs':fmt(Texp,Texp<10?1:0)+'-ms')+' frame';
  drawLightCurve(ctx,M,14,H-112,250,56,Texp);
  if(kind==='ground') txt(ctx,'a camera on the ground, '+fmt(st.Dg,0)+' km from the storm, looking '+fmt(cam.pitch*180/PI,1)+'° up, '+expS+(st.air?', through the air':', the air taken away'),bx,by-10,COL.dim,'italic 10.5px Georgia, serif');
  else txt(ctx,'a camera in orbit at '+fmt(st.Hi,0)+' km, '+fmt(st.Di,0)+' km from the storm, looking '+fmt(-cam.pitch*180/PI,1)+'° down, '+expS,bx,by-10,COL.dim,'italic 10.5px Georgia, serif');
}
/* the light curve: the whole sprite's light and the halo's against time, the frame's window shaded, now marked */
function drawLightCurve(ctx,M,x,y,w,h,Texp){ const LC=M.LC; if(!LC||LC.ts.length<2) return;
  const X=t=>x+clamp((t-LC.t0)/(LC.t1-LC.t0),0,1)*w, Y=v=>y+h-clamp(v,0,1)*(h-4);
  ctx.save(); ctx.fillStyle='rgba(10,12,18,0.55)'; ctx.fillRect(x-4,y-14,w+8,h+30); ctx.strokeStyle=COL.faint; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w,h);
  const wa=X(M.t-Texp), wb=X(M.t); if(wb>wa){ ctx.fillStyle='rgba(205,53,196,0.14)'; ctx.fillRect(wa,y+1,wb-wa,h-1); }
  ctx.setLineDash([2,3]); ctx.strokeStyle='rgba(139,147,166,0.8)'; ctx.beginPath(); LC.ts.forEach((t,i)=>{ const px=X(t), py=Y(LC.H[i]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle=COL.halo; ctx.lineWidth=1.5; ctx.beginPath(); LC.ts.forEach((t,i)=>{ const px=X(t), py=Y(LC.L[i]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }); ctx.stroke();
  if(M.t>=LC.t0&&M.t<=LC.t1){ ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X(M.t)+0.5,y); ctx.lineTo(X(M.t)+0.5,y+h); ctx.stroke(); }
  txt(ctx,'light: the sprite (red, '+fmt(100*M.lightNow,0)+'% of its peak now), the halo (dotted)',x,y-4,COL.dim,'10px -apple-system, sans-serif');
  for(const t of [Math.ceil(LC.t0),Math.floor(0.5*(LC.t0+LC.t1)),Math.floor(LC.t1)]){ if(t<LC.t0||t>LC.t1) continue; txt(ctx,'+'+fmt(t,0)+' ms',X(t),y+h+11,COL.dim,'9px -apple-system, sans-serif','center'); }
  ctx.restore(); }
/* dispatch */
function drawView(ctx,W,H,M){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='stroke') drawStroke(ctx,W,H,M);
  else if(M.view==='medium') drawMedium(ctx,W,H,M);
  else drawCamera(ctx,W,H,M,M.view==='ground'?'ground':'space');
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  S.pointer=function(){ return false; };
  return S;
}

const VIEW_NAME={stroke:'the stroke',medium:'the medium',ground:'from the ground',space:'from space'};
function tStr(t){ return t<0?fmt(-t,2)+' ms before the stroke':'t = +'+fmt(t,t<1?3:2)+' ms'; }
function msStr(ms){ return ms<1?fmt(ms*1e3,0)+' µs':ms<100?fmt(ms,ms<10?2:1)+' ms':fmt(ms/1e3,2)+' s'; }
function readoutHTML(M){
  const st=M.st, B=M.B, sgnQ=st.pol==='neg'?'−':'+'; let s='<div class="rname">'+VIEW_NAME[M.view]+'<small>'+tStr(M.t)+'</small></div><table>';

  s+=hd('the field at '+fmt(M.zRef,0)+' km')+row('|E| now / E<sub>k</sub>',M.t>0?fmt(M.Eref,0)+' / '+fmt(M.EkRef,0)+' V/m = '+fmt(M.Eref/M.EkRef,2):'0 / '+fmt(M.EkRef,0)+' V/m')+row('relaxation there','τ = '+msStr(M.tauRef))+row('the peak','<span class="'+(B.peak.ratio>=1?'good':'bad')+'">'+fmt(B.peak.ratio,2)+' E<sub>k</sub></span> at '+fmt(B.peak.z,0)+' km, '+msStr(B.peak.t));
  s+=hd('the sprite')+row('streamers start',B.init?fmt(B.init.z,0)+' km, '+msStr(B.init.t):'<span class="bad">they do not</span>')+row('least charge moment',isFinite(M.cmcMin)?fmt(M.cmcMin,0)+' C·km for streamers':'none makes streamers')+row('the diffuse onset',fmt(M.cmcDiffuse,0)+' C·km');
  if(M.ext) s+=row('lit now',fmt(M.ext.top,0)+' → '+fmt(M.ext.bot,0)+' km, '+M.ext.n+' segments'); else if(B.init&&M.t>M.TREE.tLast) s+=row('lit now','faded'); else s+=row('lit now','—');
  if(M.LC&&M.LC.peak>1e-6) s+=row('the sprite&rsquo;s light',M.t>=M.LC.t0?fmt(100*M.lightNow,0)+'% of its peak (at '+msStr(M.LC.tPeak)+')':'not yet');
  if(M.halo.I>0) s+=row('the halo','at '+fmt(M.halo.z,0)+' km, '+(M.halo.r>=40?'≥ 40':fmt(M.halo.r,0))+' km across'+(M.LC?', '+fmt(100*M.haloNow,0)+'% of its peak':''));
  if(M.elve.on) s+=row('the elve','r = '+fmt(M.elve.rIn,0)+'–'+fmt(M.elve.rOut,0)+' km at 90 km');
  if(M.view==='ground'){ s+=hd('the camera, '+fmt(st.Dg,0)+' km away')+row('the sprite stands',M.ext?fmt(M.elevBot,1)+'° to '+fmt(M.elevTop,1)+'° up':'—')+row('the cloud tops (12 km)',fmt(M.elevCloud,2)+'°'+(M.elevCloud<0?', below the horizon':''))
    +row('airmass to it',fmt(airmass(M.ext?0.5*(M.elevTop+M.elevBot):elevOf(st.Dg,70)),1))+row('transmission R, G, B',st.air?fmt(M.Tr[0],2)+', '+fmt(M.Tr[1],2)+', '+fmt(M.Tr[2],2):'1 (no air)'); }
  if(M.view==='space'){ s+=hd('the camera, '+fmt(st.Hi,0)+' km up')+row('the limb lies',fmt(M.depress,1)+'° down, '+fmt(M.limbD,0)+' km off')+row('the storm lies',fmt(-M.camS.pitch*180/PI,1)+'° down, '+fmt(Math.hypot(st.Di,st.Hi),0)+' km off')+row('the sprite subtends',M.ext?fmt(2*Math.atan(0.5*(M.ext.top-M.ext.bot)/Math.hypot(st.Di,st.Hi-60))*180/PI,2)+'°':'—'); }
  s+='</table>';
  const notes={stroke:'colour is |E|/E<sub>k</sub> on a log scale; magenta is the breakdown contour; the ladder on the right is the air&rsquo;s relaxation time &epsilon;&#8320;/&sigma;',
    medium:'the field at a height rises with the stroke and falls with that height&rsquo;s own &epsilon;&#8320;/&sigma;; streamers need E &gt; E<sub>k</sub> for longer than t<sub>form</sub> &prop; 1/n',
    ground:'red is N&#8322; first positive, blue N&#8322; second positive and N&#8322;&#8314; first negative; below ~53 km collisions quench the red before it radiates; the slant air then takes the blue',
    space:'the sprite seen under the airglow layer; the elve is the stroke&rsquo;s radio pulse lighting the 90-km layer on an expanding ring; nothing is dimmed by the air up here'};
  if(M.view==='ground'||M.view==='space') notes[M.view]+='; the frame collects the last '+msStr(Math.max(0.05,M.st.exp))+' (the shaded window on the light curve): lengthen it and the faded tendrils come back, as in a photograph'
  s+='<div class="note">'+notes[M.view]+'</div>';
  return s;
}
function eqbarHTML(M){
  const st=M.st;
  if(M.view==='stroke') return '<span class="lhs">&part;<sub>t</sub>(&epsilon;&#8320;&nabla;&middot;E) + &nabla;&middot;(&sigma;E) = &minus;q&#775;(t) &delta;(r &minus; hẑ)</span><span class="sm">the leaky dielectric: Q = '+fmt(st.Q,0)+' C removed in &tau;<sub>s</sub> = '+msStr(st.tauS)+', screened at each height in &tau; = &epsilon;&#8320;/&sigma;(z); the static limit is the charge and its image in the ground</span>';
  if(M.view==='medium') return '<span class="lhs">&tau;(z) = &epsilon;&#8320;/&sigma;(z)</span>, &nbsp; <span class="lhs">E<sub>k</sub>(z) = <span class="hl">3.2 MV/m</span> &times; n(z)/n&#8320;</span>, &nbsp; <span class="lhs">t<sub>form</sub> &prop; 1/n(z)</span><span class="sm">the field wins where it outlives its screening, and streamers form where it holds for the avalanche time: here '+(M.B.init?fmt(M.B.init.z,0)+' km after '+msStr(M.B.init.t):'nowhere, with this charge')+'</span>';
  if(M.view==='ground') return '<span class="lhs">I<sub>band</sub> &prop; 1 / (1 + n(z)/n<sub>q</sub>)</span>, &nbsp; <span class="lhs">T(&lambda;) = exp[&minus;X(&epsilon;)(&tau;<sub>R</sub>(&lambda;) + &beta;&lambda;<sup>&minus;1.3</sup>)]</span><span class="sm">quenching colours the sprite by height; the air on the slant path (airmass X = '+fmt(airmass(M.ext?0.5*(M.elevTop+M.elevBot):elevOf(st.Dg,70)),1)+') passes '+fmt(100*M.Tr[0],0)+'% of the red and '+fmt(100*M.Tr[2],0)+'% of the blue</span>';

}
function tagHTML(M){
  const B=M.B; const when=M.t<0?'before the stroke':M.t<(B.init?B.init.t:0.5)?'the field is rising':M.ext?'the sprite':'after the sprite';
  const cap={stroke:'the storm in cross-section &mdash; '+when, medium:'the atmosphere as a leaky dielectric over a conducting ground', ground:'a camera '+fmt(M.st.Dg,0)+' km away, '+(M.st.air?'through the air':'with the air taken away'), space:'from an orbit at '+fmt(M.st.Hi,0)+' km'};

 *  the prose                                                          *
 * ================================================================== */
const SRC_LINE='The field: Pasko, Inan, Bell &amp; Taranenko (1997), after Wilson (1925); the atmosphere: the US Standard Atmosphere 1976; the breakdown field: Raizer (1991); the stability fields: Babaeva &amp; Naidis (1997); the quenching heights: Liu &amp; Pasko (2004), after Vallance Jones (1974); what sprites look like: Sentman et al. (1995), Stenbaek-Nielsen et al. (2007); the elve: Fukunishi et al. (1996), Inan et al. (1997); why the observed threshold is lower: Qin, Celestin &amp; Pasko (2012); the Rayleigh depth: Hansen &amp; Travis (1974); the airmass: Kasten &amp; Young (1989).';
function infoFor(v){
  const st=ST, M=buildModel(), B=M.B;
  if(v==='stroke') return 'A big storm&rsquo;s trailing stratiform cloud carries a sheet of <b>positive charge</b> near 5&ndash;10 km. Now and then a stroke to the ground drains it: a <b>positive cloud-to-ground</b> flash, often with a long continuing current. The charge was screened: the air above, faintly conducting, had let charge drift to cancel its field. Take it away in a millisecond and the screening charge is still there, so for a moment the field of the <b>removed charge</b> (and its image in the ground) stands over the storm. Each height then kills that field in its own time, &epsilon;&#8320;/&sigma;: microseconds at 90 km, milliseconds at 75, a tenth of a second at 50. Where the field beats the <b>breakdown field</b> E<sub>k</sub> (3.2 MV/m scaled with the density, so only '+fmt(Ek(75),0)+' V/m at 75 km) before it is screened, the air breaks down: here the peak is '+fmt(B.peak.ratio,2)+' E<sub>k</sub> at '+fmt(B.peak.z,0)+' km. Streamers run down from about 75 km as positive streamers (along E) and up as negative ones (against it), and keep going while the field exceeds their stability fields.'
    +(B.init?'':' <span class="warn">With this charge no streamers form: raise Q, lower h, or shorten the stroke.</span>');
  if(v==='medium') return 'The atmosphere is a <b>leaky dielectric</b>: a conductivity that climbs by a factor of ten every '+fmt(SIG_H1*Math.LN10,0)+' km below 60 km and every '+fmt(SIG_H2*Math.LN10,1)+' km above it (at night). A charge removed in &tau;<sub>s</sub> makes a field that each height screens in its own relaxation time <b>&tau; = &epsilon;&#8320;/&sigma;</b>. Where &tau; is longer than &tau;<sub>s</sub> the field reaches its static value; where it is shorter, the field never builds. The static field falls as 1/z&sup3; but E<sub>k</sub> falls faster, as the density, so the ratio E/E<sub>k</sub> rises with height until the screening wins: the peak sits near '+fmt(B.peak.z,0)+' km. Streamers also need time to form (the avalanche-to-streamer time, taken as 20 ns at sea level and growing as 1/n), so they start a little lower, at '+(B.init?fmt(B.init.z,0)+' km':'no height here')+', while the thin air above can only glow diffusely: the <b>halo</b>. The <b>ground</b> is a conductor on these timescales, so the removed charge has an image; a dry crust would not change that, but the page lets you switch it off to see what the image does.';
  if(v==='ground') return 'The sprite as a camera on the ground sees it, '+fmt(st.Dg,0)+' km from the storm: the cloud tops are at '+fmt(M.elevCloud,1)+'&deg; (below the horizon), the stroke lights the horizon, and the sprite stands '+(M.ext?fmt(M.elevBot,1)+'&deg; to '+fmt(M.elevTop,1)+'&deg; up':'above it')+'. Its light is mostly the <b>first positive</b> bands of N&#8322; (red, 600&ndash;1000 nm) from a state that lives 6 &mu;s; below about 53 km a collision takes that energy first, and what is left is the <b>second positive</b> (near-UV and blue) and the <b>first negative</b> of N&#8322;&#8314; (391 and 428 nm), which quench lower, at 30 and 48 km. So the body is red and the lowest tendrils turn violet, then blue. Then the <b>air in the way</b>: at '+fmt(M.ext?0.5*(M.elevTop+M.elevBot):elevOf(st.Dg,70),1)+'&deg; the light crosses '+fmt(airmass(M.ext?0.5*(M.elevTop+M.elevBot):elevOf(st.Dg,70)),1)+' airmasses, and Rayleigh scattering (&lambda;<sup>&minus;4</sup>) with the haze passes '+fmt(100*M.Tr[0],0)+'% of the red but '+fmt(100*M.Tr[2],0)+'% of the blue. That is why sprites are <i>red</i> sprites: partly the molecule, partly the path. The sprite here is a <b>cluster</b>: '+(M.TREE.nEl>1?M.TREE.nEl+' elements seeded across the '+fmt(2*M.TREE.rCluster,0)+'-km breakdown region, each a bright upward column over a skirt of downward tendrils, the jellyfish form':'a single element')+'; the diffuse glow over the top is the halo.';
  return 'From an orbit at '+fmt(st.Hi,0)+' km the camera looks '+fmt(-M.camS.pitch*180/PI,0)+'&deg; down at a storm '+fmt(st.Di,0)+' km away. The Earth&rsquo;s <b>limb</b> lies '+fmt(M.depress,1)+'&deg; below the horizontal, and a little above it the <b>airglow</b> layer near 92 km draws a thin bright line round the planet. The stroke lights the cloud from inside. Within a millisecond its radio pulse reaches the 90-km layer and heats the electrons there on a ring that spreads faster than light at first (it is the pulse&rsquo;s sphere cutting the layer, not anything moving along it): the <b>elve</b>, hundreds of kilometres across and gone in a millisecond. Then the sprite grows over the cloud: from here its top stands '+fmt(M.topDep,1)+'&deg; below the horizontal, '+(M.topDep>M.depress?'against the dark Earth, under the limb; move the camera beyond about 1100 km and it climbs above the limb into the airglow band, as in the photographs from the Station':'above the limb, drawn on the airglow band as in the photographs from the Station')+'. Nothing up here dims it: the air along the line of sight is a thousandth of the ground&rsquo;s, which is why orbit is the best seat for the blue in the tendrils.';
}
function physFor(v){
  if(v==='stroke') return '<h4>the field of a charge removed in a leaky dielectric</h4><p>Gauss and the continuity of charge, with the conduction current &sigma;E:</p>'
    +'<span class="eq">&part;<sub>t</sub>(&epsilon;&#8320;&nabla;&middot;E) + &nabla;&middot;(&sigma;E) = &minus;q&#775;(t) &delta;&sup3;(r &minus; hẑ)<span class="n">(1)</span></span>'
    +'<p>with E = &minus;&nabla;&phi; and q(t) = Q(1 &minus; e<sup>&minus;t/&tau;<sub>s</sub></sup>). The medium is stratified, so a Hankel transform in r turns (1) into one equation in z for each wavenumber k:</p>'
    +'<span class="eq">&epsilon;&#8320;&part;<sub>t</sub>(&phi;&#770;&Prime; &minus; k&sup2;&phi;&#770;) + (&sigma;&phi;&#770;&prime;)&prime; &minus; k&sup2;&sigma;&phi;&#770; = q&#775; &delta;(z &minus; h)/2&pi;<span class="n">(2)</span></span>'
    +'<p>solved implicitly on a 1-km grid to 110 km (a conductor), 64 wavenumbers to 0.3 km<sup>&minus;1</sup>, 320 steps on a quadratic clock, with &phi;&#770; = 0 on a conducting ground; then &phi; = &int;&phi;&#770;J&#8320;(kr)k dk. With &sigma; = 0 it reproduces the charge and its images to 0.3%.</p>'
    +'<h4>the static field on the axis</h4><span class="eq">E<sub>z</sub> = <span class="frac"><span class="t">Q</span><span class="b">4&pi;&epsilon;&#8320;</span></span>[(z &minus; h)<sup>&minus;2</sup> &minus; (z + h)<sup>&minus;2</sup>] &asymp; <span class="frac"><span class="t">Qh</span><span class="b">&pi;&epsilon;&#8320;z&sup3;</span></span><span class="n">(3)</span></span>'
    +'<p>the charge moment Qh is what matters far above. E<sub>k</sub> = 3.2 MV/m &times; n/n&#8320; (the US Standard Atmosphere), so E/E<sub>k</sub> &prop; e<sup>z/H</sup>/z&sup3; climbs until the screening wins.</p><p class="cite">'+SRC_LINE+'</p>';
  if(v==='medium') return '<h4>the conductivity</h4><span class="eq">&sigma;(z) = 5&times;10<sup>&minus;14</sup> e<sup>z/7.9 km</sup> S/m (z &lt; 60), &nbsp; 10<sup>&minus;10</sup> e<sup>(z&minus;60)/3.7 km</sup> above<span class="n">(4)</span></span>'
    +'<p>a nighttime profile, approximately as in Pasko et al. (1997); by day the D region reaches down and &sigma; above 55 km is taken 20&times; larger. &tau; = &epsilon;&#8320;/&sigma; is '+msStr(tauAt(60,false)*1e3)+' at 60 km, '+msStr(tauAt(75,false)*1e3)+' at 75, '+msStr(tauAt(90,false)*1e3)+' at 90 (night).</p>'
    +'<h4>where streamers can start</h4><p>Two conditions at a height z: E(z,t) &gt; E<sub>k</sub>(z), and for longer than the avalanche-to-streamer time</p>'
    +'<span class="eq">t<sub>form</sub>(z) = 20 ns &times; n&#8320;/n(z)<span class="n">(5)</span></span>'
    +'<p>(assumed; '+msStr(tForm(70))+' at 70 km, '+msStr(tForm(85))+' at 85). Above, the field is gone before a streamer can form and the discharge stays diffuse. Positive streamers keep running while E &gt; '+fmt(CRIT_POS,2)+' E<sub>k</sub> (4.4 kV/cm at sea level), negative ones while E &gt; '+fmt(CRIT_NEG,2)+' E<sub>k</sub> (12.5 kV/cm): the field below is slow to relax but E<sub>k</sub> grows fast, so the tendrils stop near 45&ndash;55 km.</p>'
    +'<h4>the ground</h4><p>Soil or sea conducts in nanoseconds to microseconds, so &phi; = 0 there and the removed charge has an image. &ldquo;An insulating ground&rdquo; replaces that by the free-space condition &phi;&#770;&prime; = k&phi;&#770; at z = 0: the field aloft is then that of a bare charge, about three times larger.</p><p class="cite">'+SRC_LINE+'</p>';
  if(v==='ground') return '<h4>the colour of a segment</h4><span class="eq">I<sub>band</sub>(z) = y<sub>band</sub> / (1 + n(z)/n<sub>q</sub>)<span class="n">(6)</span></span>'
    +'<p>the share of an excited state that radiates before a collision; n<sub>q</sub> = A/k<sub>q</sub> is the density where the two rates match, at 53 km for N&#8322;(B&sup3;&Pi;<sub>g</sub>) (first positive, red), 30 km for N&#8322;(C&sup3;&Pi;<sub>u</sub>) (second positive) and 48 km for N&#8322;&#8314;(B&sup2;&Sigma;<sub>u</sub>&#8314;) (first negative). The yields at the head, 1 : 0.25 : 0.15, are assumed. A segment glows as the head for 60 &mu;s, then as the channel, fading in 1 ms &times; n(70 km)/n(z) (assumed).</p>'
    +'<h4>the air in the way</h4><span class="eq">T(&lambda;) = exp[&minus;X(&epsilon;)(&tau;<sub>R</sub>(&lambda;) + &beta;&lambda;<sup>&minus;1.3</sup>)], &nbsp; &tau;<sub>R</sub> = 0.008569&lambda;<sup>&minus;4</sup>(1 + 0.0113&lambda;<sup>&minus;2</sup> + 0.00013&lambda;<sup>&minus;4</sup>)<span class="n">(7)</span></span>'
    +'<p>&lambda; in &mu;m (Hansen &amp; Travis); the airmass X(&epsilon;) = 1/[sin &epsilon; + 0.50572(&epsilon; + 6.07995&deg;)<sup>&minus;1.6364</sup>] (Kasten &amp; Young); &beta; is the haze. The three channels are taken at 0.66, 0.55 and 0.44 &mu;m.</p>'
    +'<h4>the cluster</h4><p>Where a sprite element starts within the breakdown region is set by irregularities the model does not have, so the elements are seeded at random across it (uniformly in the disk, within 0.6 ms of the first), each with a positive streamer down and a negative one up, 80 tips per element; the upward columns are drawn 2.2&times; wider and 1.6&times; brighter, and their stopping field is spread &plusmn;35% so their heights vary (assumed). The tendrils of neighbouring elements repel through their space charge, which is not modelled either; it stands in as a splay of the downward tendrils, each element fanning out from its own trunk and the cluster from its centre, growing with depth (indicative).</p>'
    +'<h4>the geometry</h4><span class="eq">tan &epsilon; = [(R + z) cos(D/R) &minus; R] / [(R + z) sin(D/R)]<span class="n">(8)</span></span><p>the elevation of a point at height z and ground distance D on a round Earth, no refraction; the cloud tops at 12 km drop below the horizon beyond 390 km. The camera <b>integrates</b>: a frame of length T collects every photon of its exposure, so each segment contributes its head (60 &mu;s) plus its channel&rsquo;s afterglow &int;e<sup>&minus;t/&tau;<sub>g</sub></sup>dt over the window [t &minus; T, t]; the halo, the flash and the elve are likewise taken over the window. A short frame (the default, 0.5 ms, a high-speed camera) shows the development: the heads running, the channels fading behind them; a 33-ms video frame shows everything at once, as a photograph does, and the upper channels, which glow for milliseconds, then outweigh the tendrils, which glow for a tenth of that. The gain follows the frame length between 60 &mu;s and 1 ms (auto-exposure), and the response is 1 &minus; e<sup>&minus;x</sup>, a soft shoulder as film has, so the bright columns keep their gradation instead of clipping. The light curve at the bottom left is the whole sprite&rsquo;s instantaneous light against time, with the halo&rsquo;s. The camera blooms: the frame is added to itself through two coarse copies, as a lens and sensor do to bright points.</p><p class="cite">'+SRC_LINE+'</p>';
  return '<h4>the elve</h4><span class="eq">r(t) = &radic;(c&sup2;t&sup2; &minus; d&sup2;), &nbsp; d = z<sub>e</sub> &minus; h<span class="n">(9)</span></span>'
    +'<p>the radius at which the stroke&rsquo;s pulse, a sphere of radius ct, cuts the layer at z<sub>e</sub> = 90 km; dr/dt = c&sup2;t/r is infinite at first and tends to c. The pulse is taken 100 &mu;s long; the layer&rsquo;s glow &prop; (I<sub>p</sub> sin&theta;/R)&sup2; (the radiation field of the stroke, squared), peaking at r = d, is an indicative law.</p>'
    +'<h4>the limb</h4><span class="eq">cos &delta; = R/(R + H), &nbsp; D<sub>limb</sub> = &radic;((R + H)&sup2; &minus; R&sup2;)<span class="n">(10)</span></span>'
    +'<p>the limb&rsquo;s depression and distance from height H: '+fmt(Math.acos(R_EARTH/(R_EARTH+420))*180/PI,1)+'&deg; and '+fmt(limbDistance(420),0)+' km at 420 km. A shell at height z has its own limb at cos &delta; = (R + z)/(R + H): the airglow&rsquo;s line, 2&deg; above the hard limb. Points are placed on the sphere exactly and projected with a pinhole camera; there is no refraction and nothing dims the light from orbit.</p><p class="cite">'+SRC_LINE+'</p>';
}
const HINTS={stroke:'space plays or pauses · 1–4 switch views',medium:'space plays or pauses · 1–4 switch views',ground:'space plays or pauses · 1–4 switch views · the gain brightens a faint sprite',space:'space plays or pauses · 1–4 switch views · narrow the field of view to zoom in'};

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene'), panel=document.getElementById('panel'), tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout'), eqEl=document.getElementById('eqbar'), tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint'), errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;
  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));
  let lastView=null;
  function setView(k){ st.view=k; syncAll(); }
  TABS.forEach(([k,l])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:l})); });
  const rows={};
  function slider(key,l,lo,hi,step2,fmtf,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])}), val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,l),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value)); syncAll(); });
    let rk=key; while(rows[rk]) rk+='+'; rows[rk]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  function checkbox(key,l){ const inp=h('input',{type:'checkbox'}); inp.checked=st[key]; const el=h('label',null,inp,l);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; syncAll(); }); rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp}; return el; }
  const CHIPROWS=[];
  function chipRow(list,key){ const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip',html:o.name,onclick:()=>{ st[key]=o.id; syncAll(); }})); });
    CHIPROWS.push([wrapEl,list,key]); return wrapEl; }

  const gJ=h('div',{class:'grp'},h('h3',null,'the clock'));
  const playBtn=h('button',{onclick:()=>{ if(st.t>=T_END-1e-9) st.t=T_START; st.play=!st.play; syncAll(); }},'pause');
  gJ.appendChild(h('div',{class:'btnrow'},playBtn,h('button',{onclick:()=>{ st.t=T_START; st.play=true; syncAll(); }},'from the start')));
  gJ.appendChild(slider('t','time',0,1000,1,v=>(v<0?'−':'+')+fmt(Math.abs(v),2)+' ms',{to:u=>T_START+(T_END-T_START)*u/1000,from:v=>1000*(v-T_START)/(T_END-T_START)}));
  gJ.appendChild(slider('rate','playback, ms/s',0,LOGN,1,v=>fmt(v,2),logMap(LIM.rate[0],LIM.rate[1])));
  const jTag=h('div',{class:'tag'}); gJ.appendChild(jTag);

  const gE=h('div',{class:'grp'},h('h3',null,'the stroke'));
  gE.appendChild(slider('Q','charge removed, C',0,LOGN,1,v=>fmt(v,0),logMap(LIM.Q[0],LIM.Q[1])));
  gE.appendChild(slider('h','from a height, km',LIM.h[0],LIM.h[1],0.5,v=>fmt(v,1)));
  gE.appendChild(slider('tauS','removed over, ms',0,LOGN,1,v=>fmt(v,2),logMap(LIM.tauS[0],LIM.tauS[1])));
  gE.appendChild(slider('Ip','return stroke, kA',LIM.Ip[0],LIM.Ip[1],5,v=>fmt(v,0)));
  gE.appendChild(chipRow(POL_LIST,'pol'));
  const eTag=h('div',{class:'tag'}); gE.appendChild(eTag);

  const gM=h('div',{class:'grp'},h('h3',null,'the medium'));
  gM.appendChild(chipRow(DAY_LIST,'day')); gM.appendChild(h('div',{style:'height:6px'})); gM.appendChild(chipRow(GROUND_LIST,'ground'));

  const gS=h('div',{class:'grp'},h('h3',null,'the sprite'));
  gS.appendChild(slider('nEl','elements in the cluster',LIM.nEl[0],LIM.nEl[1],1,v=>fmt(v,0)));
  gS.appendChild(h('div',{class:'btnrow'},h('button',{onclick:()=>{ st.seed+=1; syncAll(); }},'another sprite (new branches)')));
  const sTag=h('div',{class:'tag'}); gS.appendChild(sTag);

  const gC=h('div',{class:'grp'},h('h3',null,'the cameras'));
  gC.appendChild(slider('exp','frame length',0,LOGN,1,v=>v<1?fmt(v*1e3,0)+' µs':fmt(v,v<10?1:0)+' ms',logMap(LIM.exp[0],LIM.exp[1])));
  gC.appendChild(slider('Dg','ground camera, km',LIM.Dg[0],LIM.Dg[1],10,v=>fmt(v,0)));
  gC.appendChild(slider('fovG','its field of view, °',LIM.fovG[0],LIM.fovG[1],1,v=>fmt(v,0)));
  gC.appendChild(slider('haze','haze β',LIM.haze[0],LIM.haze[1],0.01,v=>fmt(v,2)));
  gC.appendChild(h('div',{class:'checks'},checkbox('air','the air in the way (extinction)')));
  gC.appendChild(slider('Di','orbit camera, km',LIM.Di[0],LIM.Di[1],20,v=>fmt(v,0)));
  gC.appendChild(slider('fovS','its field of view, °',LIM.fovS[0],LIM.fovS[1],1,v=>fmt(v,0)));
  gC.appendChild(slider('gain','camera gain',0,LOGN,1,v=>'×'+fmt(v,1),logMap(LIM.gain[0],LIM.gain[1])));

  const gR=h('div',{class:'grp'},h('div',{class:'btnrow'},h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); syncAll(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gR.appendChild(keysTag);
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at')), infoEl=h('div',{id:'info'}); gInfo.appendChild(infoEl);
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation')), physEl=h('div',{id:'phys'}); gPhys.appendChild(physEl);
  [gJ,gE,gM,gS,gC,gR,gInfo,gPhys].forEach(g=>panel.appendChild(g));

  function syncAll(){ dirty=true; refreshPanel(); }
  function refreshPanel(){
    try{
      const v=st.view;
      [].forEach.call(tabsEl.children,(bt,i)=>bt.className=TABS[i][0]===v?'active':'');
      for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(bt,i)=>bt.className='chip'+(list[i].id===st[key]?' on':''));
      for(const k in rows) rows[k].sync();
      playBtn.textContent=st.play?'pause':(st.t>=T_END-1e-9?'play again':'play');
      const M=S.model();
      jTag.innerHTML=M.B.init?'streamers start at <b>'+fmt(M.B.init.z,0)+' km</b>, '+msStr(M.B.init.t)+' after the stroke begins; the sprite is over by '+msStr(M.TREE.tLast):'<span class="r">no streamers</span>: the field peaks at '+fmt(M.B.peak.ratio,2)+' E<sub>k</sub>';
      sTag.innerHTML=M.B.init?(M.TREE.nEl>1?'<b>'+M.TREE.nEl+'</b> elements seeded across the breakdown region, '+fmt(2*M.TREE.rCluster,0)+' km wide; ':'one element; ')+thou(M.TREE.segs.length)+' segments':'—';
      eTag.innerHTML='charge moment <b>'+fmt(M.cmc,0)+' C·km</b>; streamers need '+(isFinite(M.cmcMin)?'<b>'+fmt(M.cmcMin,0)+'</b>':'more than any')+' with this stroke, the diffuse glow '+fmt(M.cmcDiffuse,0);
      keysTag.innerHTML='1&ndash;4 switch views &nbsp; space plays or pauses';
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M); hintEl.textContent=HINTS[v];
      if(v!==lastView){ infoEl.innerHTML=infoFor(v); physEl.innerHTML=physFor(v); lastView=v; }
      else if(!st.play) infoEl.innerHTML=infoFor(v);
    }catch(e){ fail(e); }
  }
  window.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')) return;
    if(e.key===' '){ e.preventDefault(); playBtn.click(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });
  function resize(){ const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr); canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0); S.W=r.width; S.H=r.height; }
  window.addEventListener('resize',()=>{ resize(); dirty=true; });
  let frames=0;
  function frameLoop(){
    const wasView=st.view, wasPlay=st.play;
    S.step();
    try{ S.draw(); }catch(e){ fail(e); }
    if(st.view!==wasView||st.play!==wasPlay||dirty||(++frames%8===0)){ dirty=false; refreshPanel(); }
    requestAnimationFrame(frameLoop);
  }
  resize(); refreshPanel(); requestAnimationFrame(frameLoop);
  return S;
}

/* ================================================================== *
 *  selfTest — headless (jsc): the physics against its limits, and      *
 *  every view drawn at four sizes and several times                    *
 * ================================================================== */
function stubCtx(){ const g={addColorStop(){}}; const c={measureText:t=>({width:String(t).length*6}),createRadialGradient:()=>g,createLinearGradient:()=>g};
  for(const k of ['fillRect','strokeRect','beginPath','moveTo','lineTo','arc','closePath','fill','stroke','fillText','save','restore','setLineDash','translate','scale','rotate','clip','rect','bezierCurveTo','setTransform']) c[k]=function(){};
  return c; }
function selfTest(){
  let pass=0, fail=0; const T0=Date.now();
  const ok=(c,m)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+m); } };
  const rel=(a,b,tol,m)=>ok(Math.abs(a/b-1)<tol,m+' ('+a+' vs '+b+')');
  /* Bessel */
  rel(bessJ0(1),0.7651976865579666,1e-7,'J0(1)'); rel(bessJ1(1),0.44005058574493355,1e-7,'J1(1)'); rel(bessJ0(10),-0.2459357644513483,1e-6,'J0(10)'); rel(bessJ1(10),0.04347274616886144,1e-5,'J1(10)');
  ok(Math.abs(bessJ0(2.404825557695773))<1e-7,'J0 vanishes at its first zero');
  /* the atmosphere */
  rel(N0,2.547e25,1e-3,'sea-level density'); rel(atmo(11.019).p,22632,2e-3,'the tropopause pressure'); rel(atmo(75).p,2.3881,3e-3,'p at 75 km'); rel(atmo(50).T,270.65,1e-3,'T at the stratopause');
  ok(nRel(75)>3e-5&&nRel(75)<3.6e-5,'n/n0 at 75 km = '+sigf(nRel(75),3)); ok(Ek(75)>100&&Ek(75)<110,'E_k(75 km) = '+fmt(Ek(75),1)+' V/m');
  /* the medium */
  rel(sigmaAt(60,false),1e-10,1e-9,'sigma at 60 km'); rel(sigmaAt(94,false),1e-6,0.02,'sigma at 94 km'); ok(tauAt(90,false)<1e-4&&tauAt(60,false)>0.05,'tau: '+msStr(tauAt(90,false)*1e3)+' at 90 km, '+msStr(tauAt(60,false)*1e3)+' at 60');
  ok(sigmaAt(70,true)>10*sigmaAt(70,false),'day is more conducting');
  rel(tauRayleigh(0.55),0.0973,0.01,'Rayleigh depth at 550 nm'); rel(airmass(90),1,1e-3,'airmass at the zenith'); ok(airmass(5)>9&&airmass(5)<11,'airmass at 5 deg = '+fmt(airmass(5),2));
  /* the static limit: the solver with sigma = 0 against the charge and its images between the ground and the top */
  { const st=Object.assign({},DEFAULTS,{sigScale:1e-30,tauS:0.05}); const S0=solution(st);
    for(const z of [40,50,75,95]) rel(Math.abs(axisE(S0,z,T_END)),Math.abs(staticEzPlates(1,st.h,z,110)),5e-3,'static E_z on the axis at '+z+' km');
    const {f}=frameAt(T_END); const F=dispFrame(S0,f); for(const [m,q] of [[6,35],[2,25],[20,40]]){ const P=staticPlates(1,st.h,R_DISP[m],Z_DISP[q],110);
      rel(F.Ez[m*Z_DISP.length+q],P.Ez,0.03,'static E_z at r = '+R_DISP[m]+', z = '+Z_DISP[q]); rel(F.Er[m*Z_DISP.length+q],P.Er,0.01,'static E_r at r = '+R_DISP[m]+', z = '+Z_DISP[q]); }
    const top=Math.abs(axisE(S0,75,T_END))/staticEz(1,st.h,75)-1; ok(top>0&&top<0.3,'the top conductor at 110 km raises the field at 75 km by '+fmt(100*top,0)+'%'); }
  /* the dynamics: screening, the stroke's time, the ground, day */
  const S=withState({},()=>solution(ST)), B=breakdown(S,DEFAULTS.Q);
  ok(Math.abs(axisE(S,90,5))<0.02*Math.abs(staticEz(1,8,90)),'90 km is screened by 5 ms');
  ok(Math.abs(axisE(S,50,5))>0.8*Math.abs(staticEz(1,8,50)),'50 km still holds most of its static field at 5 ms');
  ok(B.peak.z>=70&&B.peak.z<=85,'the peak of E/E_k sits at '+B.peak.z+' km'); ok(B.init&&B.init.z>=68&&B.init.z<=78,'streamers start at '+(B.init?B.init.z:'-')+' km');
  ok(B.first&&B.first.z>B.init.z,'the diffuse onset ('+B.first.z+' km) is above the streamers ('+B.init.z+')');
  ok(B.peak.ratio>1.5&&B.peak.ratio<3,'the default peaks at '+fmt(B.peak.ratio,2)+' E_k');
  { const Bl=breakdown(S,DEFAULTS.Q*0.5); ok(Bl.peak.ratio<B.peak.ratio&&Math.abs(Bl.peak.ratio/B.peak.ratio-0.5)<1e-9,'the field is linear in Q'); }
  { const qm=qMinStreamer(S); ok(isFinite(qm)&&qm>50&&qm<DEFAULTS.Q,'the least charge for streamers is '+fmt(qm,0)+' C'); ok(breakdown(S,qm*1.001).init&&!breakdown(S,qm*0.999).init,'and it is a threshold'); }
  { const Sl=withState({tauS:3},()=>solution(ST)); ok(breakdown(Sl,DEFAULTS.Q).peak.ratio<B.peak.ratio,'a slower stroke makes a weaker field aloft'); }
  { const Sd=withState({day:true},()=>solution(ST)); ok(breakdown(Sd,DEFAULTS.Q).peak.ratio<0.5*B.peak.ratio,'by day the field is screened harder'); }
  { const Si=withState({ground:'ins'},()=>solution(ST)); ok(Math.abs(axisE(Si,75,1))>1.5*Math.abs(axisE(S,75,1)),'without the image the field aloft is larger'); }
  { const Sn=withState({pol:'neg'},()=>solution(ST)); ok(Math.abs(axisE(Sn,75,1)+axisE(S,75,1))<1e-9*Math.abs(axisE(S,75,1)),'a -CG flips the field'); }
  /* the sprite */
  const M=withState({t:3},()=>buildModel());
  ok(M.TREE.segs.length>2000,'the tree has '+thou(M.TREE.segs.length)+' segments'); ok(M.TREE.zBot>40&&M.TREE.zBot<58,'the tendrils stop at '+fmt(M.TREE.zBot,1)+' km'); ok(M.TREE.zTop>78&&M.TREE.zTop<92,'the top reaches '+fmt(M.TREE.zTop,1)+' km');
  { let down=0,up=0; for(const s of M.TREE.segs){ if(s.sgn>0&&s.z1<s.z0) down++; if(s.sgn<0&&s.z1>s.z0) up++; } ok(down>0.8*M.TREE.segs.filter(s=>s.sgn>0).length,'positive streamers run down'); ok(up>0.8*M.TREE.segs.filter(s=>s.sgn<0).length,'negative streamers run up'); }
  ok(M.TREE.tLast-M.TREE.tI>0.5&&M.TREE.tLast-M.TREE.tI<15,'the sprite develops over '+fmt(M.TREE.tLast-M.TREE.tI,1)+' ms');
  { const Mn=withState({pol:'neg',t:3},()=>buildModel()); if(Mn.B.init){ let down=0; for(const s of Mn.TREE.segs) if(s.sgn<0&&s.z1<s.z0) down++; ok(down>0.8*Mn.TREE.segs.filter(s=>s.sgn<0).length,'for a -CG the negative streamers run down'); } else ok(true,'-CG: no streamers at this charge'); }
  { const M2=withState({t:3,seed:2},()=>buildModel()); ok(M2.TREE.segs.length!==M.TREE.segs.length||M2.TREE.zBot!==M.TREE.zBot,'another seed gives another sprite'); const M1=withState({t:3,seed:1},()=>buildModel()); ok(M1.TREE.segs.length===M.TREE.segs.length,'and the same seed the same one'); }
  { const c1=segColour(75), c2=segColour(42); ok(c1.rgb[0]>1.6*c1.rgb[2],'the body is red ('+fmt(c1.rgb[0],0)+','+fmt(c1.rgb[1],0)+','+fmt(c1.rgb[2],0)+')'); ok(c2.rgb[2]>0.95*c2.rgb[0],'the lowest tendrils turn blue ('+fmt(c2.rgb[0],0)+','+fmt(c2.rgb[1],0)+','+fmt(c2.rgb[2],0)+')'); ok(bandWeights(53)[0]>0.49&&bandWeights(53)[0]<0.51,'1PG is half quenched at 53 km'); }
  { const e1=treeExtent(M.TREE,M.TREE.tI+1.5), e2=treeExtent(M.TREE,M.TREE.tI+8); ok(e1&&e2&&e2.bot>e1.bot,'the tendrils fade first'); }
  { const s={z0:70,z1:70,t:1,ratio:0.5,sgn:1}; const q=segLightInt(s,6,33), q2=segLightInt(s,41,33), q3=segLightInt(s,0.5,33); rel(q[1],0.45*tauGlow(70)*(1-Math.exp(-5/tauGlow(70))),1e-9,'a frame collects the channel afterglow'); rel(q[0],0.06,1e-9,'and the head'); ok(q2[0]===0&&q2[1]<1e-3,'and forgets what happened before its window'); ok(q3[0]===0&&q3[1]===0,'nothing before the segment is born');
    const lo={z0:50,z1:50,t:1,ratio:0.5,sgn:1}; ok(segLightInt(lo,6,33)[1]<0.3*q[1],'the tendrils give a frame less light than the upper channels'); }
  { const LC=M.LC; const iPk=LC.L.indexOf(1); ok(iPk>0&&LC.tPeak>M.TREE.tI&&LC.tPeak<M.TREE.tI+3,'the sprite\'s light peaks '+fmt(LC.tPeak-M.TREE.tI,2)+' ms after the streamers start'); ok(LC.L[0]<1e-6,'and is dark before them');
    ok(LC.tHaloPeak<LC.tPeak,'the halo peaks first ('+msStr(LC.tHaloPeak)+' against '+msStr(LC.tPeak)+')'); ok(curveAt(LC,LC.L,LC.t1+1)===0&&Math.abs(curveAt(LC,LC.L,LC.tPeak)-1)<0.02,'the curve reads back');
    const late=curveAt(LC,LC.L,M.TREE.tLast+4); ok(late<0.25,'and has faded to '+fmt(100*late,0)+'% four ms after the last streamer'); }
  /* the halo and the elve */
  { const Hl=haloAt(S,DEFAULTS,0.4); ok(Hl.I>0&&Hl.z>=70&&Hl.z<=90,'the halo at '+Hl.z+' km'); ok(haloAt(S,DEFAULTS,25).I<0.05,'and it is gone by 25 ms'); }
  { const d=Z_ELVE-DEFAULTS.h; const e0=elveAt(DEFAULTS,0.9*d/C_KM_MS), e1=elveAt(DEFAULTS,1.2*d/C_KM_MS), e2=elveAt(DEFAULTS,1.0);
    ok(e0.rOut===0&&e1.rOut>0,'the elve starts when the pulse reaches 90 km'); rel(e1.rOut,Math.sqrt(1.44-1)*d,1e-9,'r = sqrt(c^2 t^2 - d^2)'); ok(e2.rOut>280&&e2.rOut<300,'300 km across by 1 ms ('+fmt(e2.rOut,0)+' km)');
    const dr=(elveAt(DEFAULTS,1.001).rOut-elveAt(DEFAULTS,1.0).rOut)/0.001; ok(dr>C_KM_MS&&dr<1.1*C_KM_MS,'and its edge is slowing toward c'); }
  { const Mc=withState({t:3},()=>buildModel()), M1=withState({t:3,nEl:1},()=>buildModel()); let xmax=0, x1=0; for(const s of Mc.TREE.segs) xmax=Math.max(xmax,Math.hypot(s.x1,s.y1)); for(const s of M1.TREE.segs) x1=Math.max(x1,Math.hypot(s.x1,s.y1));
    ok(Mc.TREE.nEl===DEFAULTS.nEl&&Mc.TREE.rCluster>10,'the cluster has '+Mc.TREE.nEl+' elements over '+fmt(2*Mc.TREE.rCluster,0)+' km'); ok(xmax>20&&xmax>1.5*x1,'and spreads wider ('+fmt(xmax,0)+' km) than one element ('+fmt(x1,0)+' km)'); ok(x1>4&&x1<20,'one element fans out to '+fmt(x1,0)+' km from its trunk');
    ok(Mc.TREE.segs.length>5*M1.TREE.segs.length&&Mc.TREE.segs.length<=MAXSEG,'with '+thou(Mc.TREE.segs.length)+' segments'); }
  /* the cameras */
  rel(elevOf(500,70),5.67,0.01,'a 70-km point 500 km away stands 5.67 deg up'); ok(elevOf(450,12)<0,'the cloud tops are below the horizon at 450 km'); ok(elevOf(300,12)>0,'and above it at 300 km');
  rel(limbDistance(420),2351,2e-3,'the limb from 420 km'); rel(Math.acos(R_EARTH/(R_EARTH+420))*180/PI,20.26,2e-3,'its depression');
  { const cam=camera('space',DEFAULTS), W=1100, H=712; const pt=project(cam,glob(0,0,85),W,H), pb=project(cam,glob(0,0,45),W,H), pl=visibleArc(cam,R_EARTH,W,H), pa=visibleArc(cam,R_EARTH+92,W,H);
    ok(pt&&pb&&pt.y<pb.y,'from orbit the top is above the bottom'); ok(pl&&pa,'the limb and the airglow are in front of the camera');
    const yl=arcYat(pl,W/2), ya=arcYat(pa,W/2); ok(ya<yl,'the airglow line lies above the limb'); ok(pt.y>yl&&pb.y>yl,'from 800 km the sprite stands against the dark Earth, below the limb (top '+fmt(pt.y,0)+', limb '+fmt(yl,0)+')');
    { const cf=camera('space',Object.assign({},DEFAULTS,{Di:1500})); const t2=project(cf,glob(0,0,85),W,H), l2=visibleArc(cf,R_EARTH,W,H); ok(t2&&l2&&t2.y<arcYat(l2,W/2),'from 1500 km its top rises above the limb'); }
    const G=glob(100,50,90); rel(Math.hypot(G[0],G[1],G[2]),R_EARTH+90,1e-12,'glob keeps the height'); }
  { const cam=camera('ground',DEFAULTS), W=1100, H=712; const yH=horizonY(cam,W,H), pt=project(cam,glob(0,0,85),W,H); ok(pt&&pt.y<yH,'from the ground the sprite is above the horizon');
    const pc=project(cam,glob(0,0,12),W,H); ok(pc&&pc.y>yH,'and the cloud tops below it'); const T=transmission(5.7,0.08); ok(T[0]>T[1]&&T[1]>T[2]&&T[0]>3*T[2],'the slant air reddens: '+T.map(v=>fmt(v,3)).join(', ')); }
  /* every view at four sizes and at times through the event: no throw, no NaN in the text */
  const sizes=[[1400,820],[1100,712],[820,520],[560,380]];
  const times=[-2,-0.5,0,0.05,0.3,0.6,0.8,1.2,2,3,5,10,20,T_END];
  for(const v of ['stroke','medium','ground','space']) for(const t of times) for(const [W,H] of sizes){
    withState({view:v,t},()=>{ let err=null; try{ drawView(stubCtx(),W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,v+' at '+fmt(t,2)+' ms, '+W+'x'+H+(err?': '+(err.stack||err):''));
      const Mv=buildModel(), txt=readoutHTML(Mv)+eqbarHTML(Mv)+tagHTML(Mv)+infoFor(v)+physFor(v);
      ok(!/NaN|undefined|Infinity/.test(txt),v+' at '+fmt(t,2)+' ms: the text is clean'); }); }
  for(const over of [{Q:60},{Q:600,h:4},{tauS:5},{pol:'neg'},{day:true},{ground:'ins'},{air:false,Dg:150},{Dg:900,fovG:6},{Di:200,fovS:70},{Di:2000,fovS:6},{gain:10,haze:0.3},{nEl:1},{nEl:40},{exp:0.05},{exp:33,nEl:1}])
    withState(over,()=>{ for(const v of ['stroke','medium','ground','space']) for(const t of [0.3,1.5,6]) withState({view:v,t},()=>{
      let err=null; try{ drawView(stubCtx(),1100,712,buildModel()); }catch(x){ err=x; } ok(!err,JSON.stringify(over)+' '+v+(err?': '+(err.stack||err):''));
      ok(!/NaN|undefined|Infinity/.test(readoutHTML(buildModel())+eqbarHTML(buildModel())),JSON.stringify(over)+' '+v+' readout clean'); }); });
  console.log(pass+' passed, '+fail+' failed ('+(Date.now()-T0)+' ms)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}
if(typeof document==='undefined'){ if(typeof SKIP_SELFTEST==='undefined') selfTest(); }
else { if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot(); }
