<title>Turbojet — the Brayton cycle that closes through the sky</title>
<!--
  ONE MACHINE, FOUR ENGINES.

  A ramjet, a turbojet, a turbofan and a turboprop are not four devices.  They
  are one device with two knobs:

      compressor pressure ratio  pi_c   ->  1        gives the RAMJET
      bypass ratio               alpha  ->  0        gives the TURBOJET
                                 alpha  >  0        gives the TURBOFAN
                                 alpha  -> very large, unducted, gives the TURBOPROP

  The sim is built so those are LIMITS, not separate code paths: selfTest runs
  the turbofan solver with alpha = 0 and pi_f = 1 and asserts every station
  matches the turbojet solver to 1e-12, and runs the turbojet solver with
  pi_c = 1 and no turbine work and asserts it matches the ramjet.  If the
  families ever stop being one machine, the tests fail.

  THE CYCLE CLOSES THROUGH THE SKY.  Draw the STATIC states the air passes
  through — ambient 0, rammed and compressed 3, burnt 4, expanded through
  turbine and nozzle to 9 — and the loop does not close inside the engine.  It
  closes outside it: the jet cools back to ambient at constant atmospheric
  pressure in the wake.  That last leg is drawn dashed, and with it the cycle is
  a genuine closed loop, so the same theorem the steam sim is built on applies:

      du = T ds - P dv   =>   cyclic(T ds) - cyclic(P dv) = cyclic(du) = 0

  Both shadows enclose the same area whatever the shape of the loop.  And here
  that area has a name the steam engine did not give it.  Around the closed
  loop the shaft work is zero — the turbine exists only to drive the compressor
  — so the steady-flow energy balance says the net heat has nowhere to go
  except the kinetic energy of the air:

      cyclic(T ds) = cyclic(P dv) = q_net = (V9^2 - V0^2)/2

  THE AREA INSIDE THE LOOP IS THE KINETIC ENERGY THE ENGINE HANDS TO THE AIR.
  Asserted in selfTest to 0.1 % for the ideal machine, and the gap falls under
  refinement.  Switch on component losses and the two areas stay equal to each
  other (that needs only a closed loop) while both part company with the
  kinetic energy (that needed reversibility) — demonstrated, not asserted.

  THRUST IS NOT THE AREA.  Momentum, not energy, makes thrust:

      F = mdot [ (1+f) V9 - V0 ] + (p9 - p0) A9

  and the two are reconciled by an identity that is the whole design argument
  for the turbofan:

      eta_overall = eta_thermal * eta_propulsive        (exact, by definition)
      eta_th = (rate of KE added to the air) / (fuel heat rate)
      eta_p  = (thrust power F*V0) / (rate of KE added to the air)

  eta_p = 2 / (1 + V9/V0) for a simple jet — checked as a closed form in
  selfTest.  So the cycle wants a fast jet and the propulsion wants a slow one.
  You cannot fix that inside the cycle; you fix it by pushing MORE air MORE
  GENTLY, which is a turbofan, and in the limit an unducted one, which is a
  propeller.  Both are modelled here by the same actuator disc, so the
  propeller's Froude efficiency V0/(V0+vi) and the jet's 2/(1+V9/V0) are
  visibly the same law.

  PROPERTIES ARE THE REAL THING, NOT COLD AIR STANDARD.
    - c_p(T), h(T) and phi(T) = integral c_p dT/T for N2, O2, Ar, CO2 and H2O
      from the NASA 7-term polynomials (GRI-Mech 3.0 / Burcat), two temperature
      ranges each, checked in selfTest against JANAF c_p, s°, and the standard
      enthalpies of formation.
    - Air is the real dry-air composition, so R and M come out rather than going
      in (M = 28.965 g/mol, R = 0.28705 kJ/kg K, asserted).
    - The burner is a COMBUSTION calculation: fuel C12H23 burnt with the actual
      oxygen available, product composition by atom balance, fuel-air ratio
      solved from the energy balance to hit the demanded turbine inlet
      temperature — and refused when there is not enough oxygen left to do it.
      The turbine and nozzle then run on the products, which are heavier in CO2
      and H2O and have a measurably different c_p from air.
    - Every isentropic step is the EXACT variable-c_p statement
      phi(T2) - phi(T1) = R ln(p2/p1), never a fixed gamma.  Polytropic
      efficiency enters that same relation as phi(T2) - phi(T1) = (R/e) ln(p2/p1)
      for compression and e R ln(p2/p1) for expansion, which is exact too.
      Isentropic efficiency is then an OUTPUT, and selfTest asserts the classic
      consequence: eta_c < e_c for a compressor and eta_t > e_t for a turbine.
    - Ambient conditions from the US Standard Atmosphere 1976 (troposphere,
      tropopause and the lower stratosphere, 0-32 km), checked against the
      table values at 0, 11, 20 and 32 km.

  VERIFIED AGAINST THE TEXTBOOK.  Moran, Shapiro, Boettner & Bailey,
  "Fundamentals of Engineering Thermodynamics" 8th ed., Sec. 9.11 and
  Example 9.13: air at 11.8 lbf/in^2, 430 R, 620 mile/h, pi_c = 8, turbine
  inlet 2150 R, nozzle exit at ambient, all components isentropic.  The book
  gets V5 = 3034 ft/s from the air tables; this sim's own property engine, run
  under the same air-standard assumptions, is asserted to reproduce it, and to
  reproduce the book's own Quick Quiz answer of 2878 ft/s at 90 % nozzle
  efficiency.  Turning the air-standard assumption OFF (real products, fuel
  mass added) then MEASURES what the idealisation costs, instead of asserting
  it is small.

  WHAT IS NOT MODELLED, said out loud rather than papered over:
    - Dissociation.  Above ~2000 K the products would begin to dissociate and
      the real c_p rises faster than the frozen-composition polynomials say.
      The sim caps the burner at the stoichiometric flame temperature of the
      frozen mixture and labels temperatures above 2000 K as extrapolated.
    - Turbine cooling bleed, tip clearance, off-design matching, inlet spillage
      drag, base drag, and any radial or circumferential non-uniformity.  This
      is a one-dimensional station-to-station cycle deck, which is what the
      T-s diagram is a picture of.
    - The engine drawing is a schematic of the correct topology at roughly the
      right proportions; it is not a specific engine's flow path.

  Single file, no dependencies, works over file://.  All 3D — orbit camera,
  perspective projection, painter's-algorithm revolve — is hand-rolled on
  canvas 2D, same z-up camera as lattice.html and steam_carnot_cycle.html.
  Mathematica NeonColors for the cycle trail (same NEON_STOPS table as the
  other sims in this collection).

  Headless self-test: extract the script body (between the LAST script
  open/close tags, cf. rindex) and run it with
      osascript -l JavaScript turbojet_test.js
  — with `document` undefined it runs the assertion suite instead of booting
  the UI.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, DEG=Math.PI/180;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* gas-path temperature ramp: cold ram air through to a white-hot flame tube.
   Keyed in KELVIN, not on a normalised 0..1, so the same colour always means
   the same temperature whatever the engine is doing. */
/* Blue -> cyan -> green -> yellow -> orange -> red, and NOTHING past red.
   An earlier version ran on to white-hot above 2000 K, which made a 2200 K
   flame tube read as COOLER than a 1250 K turbine — brightness is not a
   temperature cue, hue is.  selfTest asserts the ramp is monotone in hue. */
const TEMP_STOPS=[[210,'#1b3a7a'],[300,'#2566b8'],[430,'#2f95c8'],[580,'#3fbcb0'],
                  [760,'#8ecb63'],[950,'#d9c445'],[1200,'#f0972f'],[1550,'#ea5f28'],
                  [1900,'#dc3418'],[2500,'#c11408']];
function tempCol(T){
  const S=TEMP_STOPS;
  if(T<=S[0][0]) return S[0][1];
  if(T>=S[S.length-1][0]) return S[S.length-1][1];
  let i=0; while(i<S.length-2 && T>S[i+1][0]) i++;
  return mix(S[i][1],S[i+1][1],(T-S[i][0])/(S[i+1][0]-S[i][0]));
}

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  gas properties — NASA 7-term polynomials                           *
 *                                                                     *
 *  c_p°/R  = a1 + a2 T + a3 T^2 + a4 T^3 + a5 T^4                     *
 *  h°/(RT) = a1 + a2 T/2 + a3 T^2/3 + a4 T^3/4 + a5 T^4/5 + a6/T      *
 *  s°/R    = a1 lnT + a2 T + a3 T^2/2 + a4 T^3/3 + a5 T^4/4 + a7      *
 *                                                                     *
 *  h is the ABSOLUTE enthalpy: it contains the enthalpy of formation, *
 *  which is what makes the burner an energy balance rather than a     *
 *  fudge.  Coefficients are GRI-Mech 3.0 / Burcat; every one of them  *
 *  is checked in selfTest against JANAF c_p, s° and Dh_f.             *
 * ================================================================== */
const RU=8.31446261815324;                 // J/mol·K, SI 2019 exact
const T_REF=298.15;                        // K, thermochemical reference

/* [M kg/mol, [200-1000 K coeffs], [1000-6000 K coeffs]] */
const SP={
  N2 :{M:0.0280134, lo:[ 3.298677    , 1.4082404e-3 ,-3.963222e-6  , 5.641515e-9  ,-2.444854e-12,-1020.8999   , 3.950372   ],
                    hi:[ 2.92664     , 1.4879768e-3 ,-5.68476e-7   , 1.0097038e-10,-6.753351e-15, -922.7977   , 5.980528   ]},
  O2 :{M:0.0319988, lo:[ 3.78245636  ,-2.99673416e-3, 9.84730201e-6,-9.68129509e-9, 3.24372837e-12,-1063.94356, 3.65767573 ],
                    hi:[ 3.28253784  , 1.48308754e-3,-7.57966669e-7, 2.09470555e-10,-2.16717794e-14,-1088.45772,5.45323129]},
  Ar :{M:0.039948 , lo:[ 2.5         , 0            , 0            , 0            , 0           , -745.375    , 4.37967491 ],
                    hi:[ 2.5         , 0            , 0            , 0            , 0           , -745.375    , 4.37967491 ]},
  CO2:{M:0.0440095, lo:[ 2.35677352  , 8.98459677e-3,-7.12356269e-6, 2.45919022e-9,-1.43699548e-13,-4.83719697e4,9.90105222],
                    hi:[ 3.85746029  , 4.41437026e-3,-2.21481404e-6, 5.23490188e-10,-4.72084164e-14,-4.8759166e4,2.27163806]},
  H2O:{M:0.01801528,lo:[ 4.19864056  ,-2.0364341e-3 , 6.52040211e-6,-5.48797062e-9, 1.77197817e-12,-3.02937267e4,-0.849032208],
                    hi:[ 3.03399249  , 2.17691804e-3,-1.64072518e-7,-9.7041987e-11, 1.68200992e-14,-3.00042971e4,4.9667701 ]},
};
const SPECIES=['N2','O2','Ar','CO2','H2O'];

function coefs(k,T){ return T<1000 ? SP[k].lo : SP[k].hi; }
/* Outside the polynomial's range the fits diverge fast, so they are held at the
   endpoint SLOPE rather than evaluated — an honest linear extrapolation instead
   of a fifth-order excursion.  selfTest asserts nothing the sim actually uses
   ever leaves 200-3000 K. */
const T_POLY_LO=200, T_POLY_HI=6000;
function cpMol(k,T){                                   // J/mol·K
  const t=clamp(T,T_POLY_LO,T_POLY_HI), a=coefs(k,t);
  return RU*(a[0]+t*(a[1]+t*(a[2]+t*(a[3]+t*a[4]))));
}
function hMol(k,T){                                    // J/mol, absolute
  if(T<T_POLY_LO) return hMol(k,T_POLY_LO)+cpMol(k,T_POLY_LO)*(T-T_POLY_LO);
  if(T>T_POLY_HI) return hMol(k,T_POLY_HI)+cpMol(k,T_POLY_HI)*(T-T_POLY_HI);
  const a=coefs(k,T);
  return RU*T*(a[0]+T*(a[1]/2+T*(a[2]/3+T*(a[3]/4+T*a[4]/5))))+RU*a[5];
}
function sMol(k,T){                                    // J/mol·K, at 1 bar, s° only
  if(T<T_POLY_LO) return sMol(k,T_POLY_LO)+cpMol(k,T_POLY_LO)*Math.log(T/T_POLY_LO);
  if(T>T_POLY_HI) return sMol(k,T_POLY_HI)+cpMol(k,T_POLY_HI)*Math.log(T/T_POLY_HI);
  const a=coefs(k,T);
  return RU*(a[0]*Math.log(T)+T*(a[1]+T*(a[2]/2+T*(a[3]/3+T*a[4]/4)))+a[6]);
}

/* ------------------------------------------------------------------ *
 *  a GAS is a fixed composition: mole fractions x, and everything     *
 *  mass-specific derived from them.  Units from here on are the ones  *
 *  propulsion actually uses: kJ/kg, kJ/kg·K, K, Pa, m/s.              *
 * ------------------------------------------------------------------ */
function makeGas(x){
  let M=0; for(const k of SPECIES) M+=(x[k]||0)*SP[k].M;
  /* the entropy of mixing is a CONSTANT for fixed composition, so it cancels
     out of every isentropic step — but it is real, and it is what makes the
     air and the products sit at genuinely different entropies on the diagram. */
  let smix=0; for(const k of SPECIES){ const xi=x[k]||0; if(xi>0) smix-=xi*Math.log(xi); }
  return {x, M, R:RU/M/1000, smix:RU*smix/M/1000};      // R, smix in kJ/kg·K
}
function gasCp(g,T){ let c=0; for(const k of SPECIES){ const xi=g.x[k]; if(xi) c+=xi*cpMol(k,T); }
  return c/g.M/1000; }                                  // kJ/kg·K
function gasH(g,T){ let s=0; for(const k of SPECIES){ const xi=g.x[k]; if(xi) s+=xi*hMol(k,T); }
  return s/g.M/1000; }                                  // kJ/kg, absolute
/* phi = integral c_p dT/T.  This is the ONLY thing needed for isentropic and
   polytropic steps: phi(T2) - phi(T1) = (R/e) ln(p2/p1). */
function gasPhi(g,T){ let s=0; for(const k of SPECIES){ const xi=g.x[k]; if(xi) s+=xi*sMol(k,T); }
  return s/g.M/1000; }                                  // kJ/kg·K
const P_REF=101325;                                     // Pa, for absolute entropy
function gasS(g,T,p){ return gasPhi(g,T)+g.smix-g.R*Math.log(p/P_REF); }
function gasGamma(g,T){ const cp=gasCp(g,T); return cp/(cp-g.R); }
function gasA(g,T){ return Math.sqrt(gasGamma(g,T)*g.R*1000*T); }   // m/s

/* Newton with a bisection safety net: h and phi are strictly increasing in T,
   so a bracket always exists and the iteration cannot run away. */
function invert(f,fp,target,lo,hi){
  let a=lo,b=hi,T=clamp(0.5*(lo+hi),lo,hi);
  for(let i=0;i<60;i++){
    const v=f(T)-target;
    if(v>0) b=T; else a=T;
    if(Math.abs(v)<1e-12) return T;
    const d=fp(T);
    let Tn=d>1e-9 ? T-v/d : 0.5*(a+b);
    if(!(Tn>a&&Tn<b)) Tn=0.5*(a+b);
    if(Math.abs(Tn-T)<1e-11) return Tn;
    T=Tn;
  }
  return T;
}
const T_MIN_INV=150, T_MAX_INV=3400;
function tFromH(g,hh){   return invert(T=>gasH(g,T),  T=>gasCp(g,T),   hh, T_MIN_INV,T_MAX_INV); }
function tFromPhi(g,ph){ return invert(T=>gasPhi(g,T),T=>gasCp(g,T)/T, ph, T_MIN_INV,T_MAX_INV); }

/* ------------------------------------------------------------------ *
 *  dry air, and the products of burning a hydrocarbon in it           *
 * ------------------------------------------------------------------ */
const AIR_X={N2:0.78084, O2:0.209476, Ar:0.009365, CO2:0.000319, H2O:0};
const AIR=makeGas(AIR_X);

/* Jet-A is modelled as C12H23, the standard kerosene surrogate.  LHV is the
   MEASURED input (42.8 MJ/kg); the fuel's enthalpy of formation is then derived
   from it so the energy balance closes on the same polynomials as everything
   else.  selfTest checks the machinery the other way round, on n-dodecane,
   whose Dh_f is tabulated: it must return the published 44.1 MJ/kg. */
const FUEL={name:'Jet-A (C12H23)', nC:12, nH:23, LHV:42800};
/* Atomic masses taken so that they reproduce the product species' molar masses
   exactly (M_C = M_CO2 - M_O2, M_H = (M_H2O - M_O2/2)/2).  Any other choice
   loses mass across the burner — by 1e-7 of it, which is invisible in the
   thrust and instantly visible in an atom balance. */
const M_C=SP.CO2.M-SP.O2.M, M_H=(SP.H2O.M-SP.O2.M/2)/2;
FUEL.M=FUEL.nC*M_C+FUEL.nH*M_H;
/* moles of O2 per mole of fuel for complete combustion */
function fuelO2(F){ return F.nC+F.nH/4; }
/* kg air per kg fuel at stoichiometric */
function afrStoich(F){
  const yO2=AIR_X.O2*SP.O2.M/AIR.M;                     // mass fraction O2 in air
  return fuelO2(F)*SP.O2.M/F.M/yO2;
}
/* LHV from tabulated enthalpies of formation, H2O left as vapour (kJ/kg fuel) */
function lhvFromHf(F,hfFuel){
  const dH=F.nC*hMol('CO2',T_REF)+(F.nH/2)*hMol('H2O',T_REF)-hfFuel;
  return -dH/F.M/1000;
}
/* the inverse: the Dh_f a stated LHV implies */
function hfFromLhv(F){
  return F.nC*hMol('CO2',T_REF)+(F.nH/2)*hMol('H2O',T_REF)+F.LHV*F.M*1000;
}

/* Burn f kg of fuel per kg of incoming gas g.  Returns the product gas, or
   null if there is not enough oxygen — which is a real limit, not an error:
   an afterburner downstream of a hot core runs out of oxygen. */
function burn(g,f,F){
  const nIn={}; for(const k of SPECIES) nIn[k]=(g.x[k]||0)/g.M;     // mol per kg of g
  const nF=f/F.M;                                                   // mol fuel per kg of g
  const needO2=nF*fuelO2(F);
  if(needO2>nIn.O2) return null;
  const nOut={N2:nIn.N2, Ar:nIn.Ar, O2:nIn.O2-needO2,
              CO2:nIn.CO2+nF*F.nC, H2O:nIn.H2O+nF*F.nH/2};
  let tot=0; for(const k of SPECIES) tot+=nOut[k];
  const x={}; for(const k of SPECIES) x[k]=nOut[k]/tot;
  return makeGas(x);
}
/* the largest f that still has oxygen to burn, per kg of g */
function fStoich(g,F){
  const nO2=(g.x.O2||0)/g.M;
  return nO2/fuelO2(F)*F.M;
}

/* ================================================================== *
 *  US Standard Atmosphere 1976                                        *
 *  Geopotential layers 0-47 km, which covers every air-breathing      *
 *  engine.  Checked against the table at 0, 11, 20 and 32 km.         *
 * ================================================================== */
/* Altitude here is GEOPOTENTIAL, which is how the standard defines its layers
   and how pressure altitude behaves; geometric altitude differs by 0.17 % at
   11 km, far below anything that matters to a cycle deck.
   Only the DEFINING constants go in — sea-level state, the lapse-rate table,
   g0 and the standard's own air constant.  Every layer's base pressure is then
   MARCHED from sea level rather than typed in from a table, so the model
   cannot be internally inconsistent with itself at the 1e-4 level the way a
   half-remembered table would be.  selfTest checks the marched values against
   the published ones. */
const G0=9.80665, R_ATM=287.0528;               // R* / M0 = 8.31432 / 28.9644 g/mol
const ATM_LAPSE=[[0,-6.5],[11,0],[20,1.0],[32,2.8],[47,0],[51,-2.8],[71,-2.0]];
const ATM_BASE=(function(){
  const o=[]; let T=288.15, p=101325;
  for(let i=0;i<ATM_LAPSE.length;i++){
    const [Hb,L]=ATM_LAPSE[i];
    o.push({H:Hb,T,p,L});
    if(i+1<ATM_LAPSE.length){
      const dH=(ATM_LAPSE[i+1][0]-Hb)*1000, T2=T+L*dH/1000;
      p = L===0 ? p*Math.exp(-G0*dH/(R_ATM*T))
                : p*Math.pow(T2/T, -G0/(R_ATM*L/1000));
      T=T2;
    }
  }
  return o;
})();
function atmosphere(Hkm){                       // geopotential altitude in km
  const H=clamp(Hkm,0,80);
  let i=0; while(i<ATM_BASE.length-1 && H>ATM_BASE[i+1].H) i++;
  const b=ATM_BASE[i], T=b.T+b.L*(H-b.H);
  const p = b.L===0 ? b.p*Math.exp(-G0*(H-b.H)*1000/(R_ATM*b.T))
                    : b.p*Math.pow(T/b.T, -G0/(R_ATM*b.L/1000));
  return {T,p,rho:p/(R_ATM*T),H};
}

/* ================================================================== *
 *  components — every step is the exact variable-c_p statement        *
 *                                                                     *
 *      compression   phi(T2) - phi(T1) = (R/e) ln(p2/p1)              *
 *      expansion     phi(T2) - phi(T1) =  e R  ln(p2/p1)              *
 *                                                                     *
 *  which is what a polytropic (small-stage) efficiency e MEANS:       *
 *  e = v dp / dh on the way up, dh / v dp on the way down.  Setting   *
 *  e = 1 gives the isentropic relation exactly, with no fixed gamma   *
 *  anywhere.  Isentropic efficiency comes OUT of this, and its        *
 *  well-known inequalities (eta_c < e_c, eta_t > e_t) are asserted.   *
 * ================================================================== */
function stagnate(g,T,p,V){                     // static + speed -> total
  const h0=gasH(g,T)+V*V/2000;
  const T0=tFromH(g,h0);
  return {T:T0, p:p*Math.exp((gasPhi(g,T0)-gasPhi(g,T))/g.R), h:h0};
}
function compress(g,T1,p1,pr,e){
  const T2 =tFromPhi(g, gasPhi(g,T1)+g.R*Math.log(pr)/e);
  const T2s=tFromPhi(g, gasPhi(g,T1)+g.R*Math.log(pr));
  const w=gasH(g,T2)-gasH(g,T1), ws=gasH(g,T2s)-gasH(g,T1);
  return {T:T2, p:p1*pr, w, ws, eta:w>1e-12?ws/w:1, Ts:T2s};
}
function expandWork(g,T1,p1,w,e){               // w = work extracted, kJ/kg
  const T2=tFromH(g, gasH(g,T1)-w);
  const p2=p1*Math.exp((gasPhi(g,T2)-gasPhi(g,T1))/(e*g.R));
  const T2s=tFromPhi(g, gasPhi(g,T1)+g.R*Math.log(p2/p1));
  const ws=gasH(g,T1)-gasH(g,T2s);
  return {T:T2, p:p2, w, ws, eta:ws>1e-12?w/ws:1, Ts:T2s};
}
function expandPr(g,T1,p1,pr,e){                // pr = p2/p1 < 1
  const T2 =tFromPhi(g, gasPhi(g,T1)+e*g.R*Math.log(pr));
  const T2s=tFromPhi(g, gasPhi(g,T1)+  g.R*Math.log(pr));
  const w=gasH(g,T1)-gasH(g,T2), ws=gasH(g,T1)-gasH(g,T2s);
  return {T:T2, p:p1*pr, w, ws, eta:ws>1e-12?w/ws:1, Ts:T2s};
}
/* MIL-E-5008B inlet total-pressure recovery: unity subsonically, then the
   shock-system loss.  etaD is a further quality factor on top of it. */
function ramRecovery(M,etaD){
  const r = M<=1 ? 1 : 1-0.075*Math.pow(M-1,1.35);
  return etaD*clamp(r,0.05,1);
}

/* The nozzle.  Isentropic-efficiency form, so V9 = sqrt(2 eta_n Dh_s), which
   is the definition Moran's Example 9.13 Quick Quiz uses and which selfTest
   reproduces.  The throat search is the honest version of "is it choked":
   V rises and the local sound speed falls as the pressure drops, so they cross
   exactly once, and that crossing IS the throat — no gamma-based critical
   pressure ratio is assumed. */
function nozzleAt(g,T0,p0,p,etaN){
  const phi0=gasPhi(g,T0), h0=gasH(g,T0);
  const Ts=tFromPhi(g, phi0+g.R*Math.log(p/p0));
  const dhs=h0-gasH(g,Ts);
  const V=Math.sqrt(Math.max(0,2000*etaN*dhs));
  const T=tFromH(g, h0-V*V/2000);
  return {T,p,V,Ts,dhs,a:gasA(g,T)};
}
function nozzle(g,T0,p0,pAmb,etaN,conDi){
  if(p0<=pAmb*1.0000001){                       // no pressure to expand: dead engine
    return {T:T0,p:pAmb,V:0,choked:false,a:gasA(g,T0),M:0,pr:1};
  }
  /* find the sonic point p* in (pAmb, p0), if there is one */
  let lo=pAmb, hi=p0, sonic=null;
  const f=p=>{ const s=nozzleAt(g,T0,p0,p,etaN); return s.V-s.a; };
  if(f(pAmb)>0){                                // supersonic if taken to ambient
    for(let i=0;i<70;i++){ const m=Math.exp(0.5*(Math.log(lo)+Math.log(hi)));
      if(f(m)>0) lo=m; else hi=m; }
    sonic=Math.exp(0.5*(Math.log(lo)+Math.log(hi)));
  }
  const pe = (sonic!==null && !conDi) ? sonic : pAmb;
  const s=nozzleAt(g,T0,p0,pe,etaN);
  s.choked = sonic!==null && !conDi;
  s.M=s.V/s.a; s.pr=p0/pe;
  s.wouldBeSupersonic = sonic!==null;
  /* The velocity this stream WOULD reach if the nozzle expanded it all the way
     to ambient.  A choked convergent nozzle leaves some of the available energy
     in the exhaust as unexpanded pressure; it still shows up as thrust through
     the (p9-p0)A9 term, but it is not kinetic energy.  Energy bookkeeping must
     use the fully expanded value or the propulsive efficiency comes out above
     100 % — which is how this was caught. */
  s.Vfe = s.choked ? nozzleAt(g,T0,p0,pAmb,etaN).V : s.V;
  return s;
}

/* ------------------------------------------------------------------ *
 *  the burner, as a combustion energy balance                         *
 *                                                                     *
 *    1*Dh_in(T_in) + eta_b f LHV = (1+f) Dh_out(T_out)                *
 *                                                                     *
 *  with Dh(T) = h(T) - h(298.15) taken on each gas's OWN composition.  *
 *  That is exact, not a modelling choice: expanding the absolute       *
 *  balance h_in + f h_fuel = (1+f) h_out and collecting the reference  *
 *  terms leaves precisely f * LHV.  selfTest checks that identity.     *
 * ------------------------------------------------------------------ */
function dhSens(g,T){ return gasH(g,T)-gasH(g,T_REF); }
/* fuel-air ratio needed to reach T_out; null if the oxygen runs out first */
function fuelFor(gIn,Tin,Tout,F,etaB,airStd){
  if(Tout<=Tin) return {f:0, gas:gIn, T:Tin, capped:false};
  if(airStd){
    const f=(dhSens(gIn,Tout)-dhSens(gIn,Tin))/(etaB*F.LHV);
    return {f:Math.max(0,f), gas:gIn, T:Tout, capped:false};
  }
  const fmax=fStoich(gIn,F)*0.9999;
  /* resid(f) = enthalpy the products still need, minus the heat f releases.
     It is POSITIVE at f = 0 (Tout > Tin, no fuel yet) and falls monotonically,
     so the target is reachable exactly when resid(fmax) <= 0 and the bracket
     walks DOWN.  Getting this the wrong way round pins every burner to
     stoichiometric, which is silent — the engine still runs, just far too hot. */
  const resid=f=>{ const g2=burn(gIn,f,F); if(!g2) return -1e9;
    return (1+f)*dhSens(g2,Tout)-dhSens(gIn,Tin)-etaB*f*F.LHV; };
  if(resid(fmax)<=0){                           // reachable inside the O2 budget
    let lo=0,hi=fmax;
    for(let i=0;i<80;i++){ const m=0.5*(lo+hi); if(resid(m)>0) lo=m; else hi=m; }
    const f=0.5*(lo+hi); return {f, gas:burn(gIn,f,F), T:Tout, capped:false};
  }
  /* stoichiometric: burn everything and take whatever temperature results */
  const g2=burn(gIn,fmax,F);
  const hOut=(dhSens(gIn,Tin)+etaB*fmax*F.LHV)/(1+fmax);
  const T=invert(T=>dhSens(g2,T),T=>gasCp(g2,T),hOut,T_MIN_INV,T_MAX_INV);
  return {f:fmax, gas:g2, T, capped:true};
}

/* the propeller / open rotor, as an actuator disc.  P = 2 rho A vi (V0+vi)^2
   has one positive root, and it gives finite STATIC thrust — which is the whole
   reason to do it this way rather than F = eta P / V0, a formula that claims a
   stationary propeller makes infinite thrust. */
function actuatorDisc(P,rho,A,V0){
  if(P<=0||A<=0) return {T:0,vi:0,Pdisc:0,etaF:0};
  let lo=0, hi=Math.max(10,Math.pow(P/(2*rho*A),1/3)*4+V0*4);
  const g=v=>2*rho*A*v*(V0+v)*(V0+v)-P;
  for(let i=0;i<90;i++){ const m=0.5*(lo+hi); if(g(m)>0) hi=m; else lo=m; }
  const vi=0.5*(lo+hi), T=P/(V0+vi);
  return {T, vi, Pdisc:P, etaF:V0/(V0+vi)};      // etaF = Froude efficiency
}

/* ================================================================== *
 *  the engine                                                         *
 *                                                                     *
 *  Station numbering follows SAE ARP755:                              *
 *    0   free stream          2   fan / compressor face               *
 *    13  fan exit (bypass)    19  bypass nozzle exit                  *
 *    3   compressor exit      4   burner exit / turbine entry         *
 *    5   turbine exit         45  power-turbine exit (turboprop)      *
 *    7   afterburner exit / nozzle entry      9   core nozzle exit    *
 *                                                                     *
 *  pi_c is the OVERALL core pressure ratio from station 2 to 3, the    *
 *  way OPR is quoted in industry.  On a turbofan the fan does pi_f of  *
 *  it and the high-pressure compressor does the rest, which composes   *
 *  exactly (Dphi adds) — so alpha = 0, pi_f = 1 collapses the turbofan *
 *  onto the turbojet with nothing left over.  Asserted.                *
 * ================================================================== */
function solveEngine(st){
  const F=FUEL, airStd=!!st.airStd, warn=[];
  const isFan=st.type==='turbofan', isProp=st.type==='turboprop', isRam=st.type==='ramjet';
  const alpha=isFan?st.alpha:0;

  /* ---- 0: free stream --------------------------------------------- */
  const amb=atmosphere(st.alt);
  const T0=amb.T, p0=amb.p, rho0=amb.rho;
  const a0=gasA(AIR,T0), V0=st.M0*a0;
  const s00=stagnate(AIR,T0,p0,V0);

  /* ---- 2: after the inlet ----------------------------------------- */
  const piD=ramRecovery(st.M0,st.etaD);
  const s2={T:s00.T, p:s00.p*piD, gas:AIR};

  /* ---- fan and compressor ----------------------------------------- */
  const piC=isRam?1:st.piC;
  const piF=isFan?clamp(st.piF,1,piC):1;
  let s13=null, cFan=null;
  if(isFan){
    cFan=compress(AIR,s2.T,s2.p,piF,st.eF);
    s13={T:cFan.T, p:cFan.p, gas:AIR};
  }
  const coreIn = s13?{T:s13.T,p:s13.p}:{T:s2.T,p:s2.p};
  const piHP = piF>0 ? piC/piF : piC;
  const cComp = isRam ? {T:coreIn.T,p:coreIn.p,w:0,ws:0,eta:1,Ts:coreIn.T}
                      : compress(AIR,coreIn.T,coreIn.p,piHP,st.eC);
  const s3={T:cComp.T, p:cComp.p, gas:AIR};
  /* work per kg of CORE air (the fan's core share is inside cComp's inlet) */
  const wComp=cComp.w;
  const wFan =cFan?cFan.w:0;                     // per kg of the stream it pushes

  /* ---- 4: the burner ---------------------------------------------- */
  const p4=s3.p*st.piB;
  const bn=fuelFor(AIR,s3.T,st.T4,F,st.etaB,airStd);
  const f=bn.f, gHot=bn.gas;
  if(bn.capped) warn.push('burner at the stoichiometric limit');
  if(st.T4<=s3.T) warn.push('turbine inlet below compressor exit — no heat can be added');
  const s4={T:bn.T, p:p4, gas:gHot};
  const mHot = airStd?1:1+f;                     // kg through the turbine per kg core air

  /* ---- 5: the turbine, sized by the work the spools need ----------- */
  let s5, tExp=null;
  if(isRam){ s5={T:s4.T,p:s4.p,gas:gHot}; }
  else{
    const wNeed=(wComp+alpha*wFan)/st.etaM;      // per kg core air
    tExp=expandWork(gHot,s4.T,s4.p,wNeed/mHot,st.eT);
    s5={T:tExp.T,p:tExp.p,gas:gHot};
    if(s5.p<=p0) warn.push('turbine cannot make the compressor work at this setting');
  }

  /* ---- 45: the free turbine of a turboprop ------------------------- */
  let s45=s5, wShaft=0, ptExp=null;
  if(isProp && s5.p>p0){
    const prPt=Math.exp(st.lam*Math.log(p0/s5.p));
    ptExp=expandPr(gHot,s5.T,s5.p,prPt,st.eT);
    s45={T:ptExp.T,p:ptExp.p,gas:gHot};
    wShaft=mHot*ptExp.w*st.etaM;                 // kJ per kg core air, at the shaft
  }

  /* ---- 7: the afterburner ----------------------------------------- */
  let s7=s45, fAB=0, abCapped=false;
  if(st.ab && !isProp){
    const p7=s45.p*st.piAB;
    const ab=fuelFor(gHot,s45.T,st.T7,F,st.etaB,airStd);
    fAB=ab.f; abCapped=ab.capped;
    if(abCapped) warn.push('afterburner has run out of oxygen');
    s7={T:ab.T, p:p7, gas:ab.gas};
  }
  const mExit = airStd?1:mHot*(1+fAB);
  const fTot  = mExit-1;                          // kg fuel per kg core air (0 in air-standard)
  const fBurn = airStd ? f+fAB : f+fAB*(1+f);     // fuel actually metered, always real

  /* ---- 9 and 19: the nozzles -------------------------------------- */
  const nz=nozzle(s7.gas,s7.T,s7.p,p0,st.etaN,st.conDi);
  const s9={T:nz.T,p:nz.p,V:nz.V,Vfe:nz.Vfe,gas:s7.gas,M:nz.M,choked:nz.choked};
  let s19=null;
  if(isFan){
    const bz=nozzle(AIR,s13.T,s13.p*st.piFN,p0,st.etaN,st.conDi);
    s19={T:bz.T,p:bz.p,V:bz.V,Vfe:bz.Vfe,gas:AIR,M:bz.M,choked:bz.choked};
  }

  /* ---- mass flows and thrust -------------------------------------- */
  const mdot0=st.mdot;                            // kg/s of air entering, total
  const mCore=mdot0/(1+alpha), mByp=alpha*mCore;
  const mFuel=mCore*fBurn;
  const areaPer=(s,m)=>s.V>1e-6 ? m*s.gas.R*1000*s.T/(s.p*s.V) : 0;

  const A9=areaPer(s9,mCore*mExit);
  let Fcore=mCore*(mExit*s9.V-V0)+(s9.p-p0)*A9;
  let Fbyp=0, A19=0;
  if(s19){ A19=areaPer(s19,mByp); Fbyp=mByp*(s19.V-V0)+(s19.p-p0)*A19; }

  /* the propeller, on the same actuator-disc law as the fan it replaces */
  let prop=null, Fprop=0, Pdisc=0;
  if(isProp){
    const Pshaft=wShaft*mCore*1000;               // W
    prop=actuatorDisc(st.etaProp*Pshaft, rho0, Math.PI*st.Dprop*st.Dprop/4, V0);
    Fprop=prop.T; Pdisc=prop.Pdisc;
  }
  const Fnet=Fcore+Fbyp+Fprop;

  /* ---- energy bookkeeping ----------------------------------------- *
   * Thrust is momentum and uses the ACTUAL exit state, pressure term and all. *
   * Power added to the air is energy and uses the FULLY EXPANDED velocity: an *
   * under-expanded jet has been given that energy whether or not the nozzle    *
   * was long enough to turn it into speed.  Splitting the two this way is what *
   * keeps eta_p <= 1 and keeps eta_o = eta_th * eta_p an identity.             */
  const Pjet = mCore*(mExit*s9.Vfe*s9.Vfe-V0*V0)/2 + (s19?mByp*(s19.Vfe*s19.Vfe-V0*V0)/2:0);
  const Padd = Pjet+Pdisc;                        // W delivered to the air
  const Qdot = mFuel*F.LHV*1000;                  // W of fuel
  const etaTh = Qdot>0 ? Padd/Qdot : 0;
  const etaP  = Padd>1e-9 ? Fnet*V0/Padd : 0;
  const etaO  = Qdot>0 ? Fnet*V0/Qdot : 0;

  const Fspec = Fnet/mdot0;                       // N per kg/s = m/s
  const tsfc  = Fnet>1e-9 ? mFuel/Fnet : Infinity;// kg/(N s)

  if(s4.T>2000&&!airStd) warn.push('above 2000 K the frozen-composition products are extrapolated');

  return {
    type:st.type, airStd, amb, V0, a0, M0:st.M0,
    s0:{T:T0,p:p0,V:V0,gas:AIR}, s00, s2, s13, s3, s4, s5, s45, s7, s9, s19,
    piD, piC, piF, piHP, opr:s3.p/s00.p, oprRam:s00.p/p0,
    f, fAB, fBurn, fTot, mHot, mExit, capped:bn.capped, abCapped,
    cComp, cFan, tExp, ptExp, nz, prop,
    wComp, wFan, wShaft, alpha,
    mdot0, mCore, mByp, mFuel, A9, A19,
    Fcore, Fbyp, Fprop, Fnet, Fspec, tsfc, Padd, Pjet, Pdisc, Qdot,
    etaTh, etaP, etaO, warn,
  };
}

/* ================================================================== *
 *  the cycle as a dense polyline of states                            *
 *                                                                     *
 *  Every sample is an equilibrium state on the actual path, so the     *
 *  Gibbs relation holds at each one and the two loop integrals are     *
 *  exact up to quadrature.  Irreversible components are drawn as       *
 *  quasi-static paths with rising entropy — which is what the          *
 *  polytropic relation already gives, for free and exactly.            *
 * ================================================================== */
let NSEG=26;                                    // selfTest refines this
function stPt(g,T,p,tag){
  return {T,p,gas:g, s:gasS(g,T,p), v:g.R*1000*T/p, h:gasH(g,T), tag};
}
/* a polytropic leg, sampled evenly in ln p (which is what makes it even on
   BOTH diagram axes: T and s move smoothly with ln p, and v does too) */
function legPoly(g,T1,p1,p2,k,n,tag){
  const o=[], phi1=gasPhi(g,T1);
  for(let i=0;i<=n;i++){
    const p=Math.exp(lerp(Math.log(p1),Math.log(p2),i/n));
    o.push(stPt(g,tFromPhi(g,phi1+k*g.R*Math.log(p/p1)),p,tag));
  }
  return o;
}
/* the burner: fuel goes in progressively, so the composition morphs with the
   temperature instead of jumping.  Pressure falls linearly across the can. */
function legBurn(gIn,T1,p1,T2,p2,fTot,F,etaB,airStd,n,tag){
  const o=[], h1=dhSens(gIn,T1);
  for(let i=0;i<=n;i++){
    const u=i/n, p=lerp(p1,p2,u), fi=fTot*u;
    const g=(airStd||fi<=0)?gIn:(burn(gIn,fi,F)||gIn);
    const hh=(h1+etaB*fi*F.LHV)/(1+(airStd?0:fi));
    const T=invert(T=>dhSens(g,T),T=>gasCp(g,T),hh,T_MIN_INV,T_MAX_INV);
    o.push(stPt(g,T,p,tag));
  }
  return o;
}
/* the nozzle, on its ACTUAL path: at each pressure the ideal drop is scaled by
   eta_n and the real static temperature follows from what is left of h0. */
function legNozzle(g,T0,p0,p2,etaN,n,tag){
  const o=[];
  for(let i=0;i<=n;i++){
    const p=Math.exp(lerp(Math.log(p0),Math.log(p2),i/n));
    const s=nozzleAt(g,T0,p0,p,etaN);
    o.push(stPt(g,s.T,p,tag));
  }
  return o;
}
/* the wake: the jet gives its heat back to the sky at constant p0 */
function legWake(g,T1,T2,p,n,tag){
  const o=[];
  for(let i=0;i<=n;i++) o.push(stPt(g,lerp(T1,T2,i/n),p,tag));
  return o;
}
/* a pure throttling loss: pressure falls at constant enthalpy, so on the T-s
   diagram it is a near-horizontal walk to the right.  This is what an inlet's
   shock system and a combustor's pressure drop actually look like. */
function legThrottle(g,T,p1,p2,n,tag){
  const o=[], h=gasH(g,T);
  for(let i=0;i<=n;i++){
    const p=Math.exp(lerp(Math.log(p1),Math.log(p2),i/n));
    o.push(stPt(g,tFromH(g,h),p,tag));
  }
  return o;
}

function buildCycle(E,st){
  const F=FUEL, n=NSEG;
  const core=[];
  /* 0 -> 0_0: the ram compression, isentropic; then the inlet's own loss at
     constant enthalpy, which is a pure entropy rise at fixed T. */
  core.push(...legPoly(AIR,E.s0.T,E.s0.p,E.s00.p,1,n,'ram'));
  if(E.s2.p<E.s00.p*0.999999)
    core.push(...legThrottle(AIR,E.s00.T,E.s00.p,E.s2.p,6,'inlet loss'));
  if(E.s13) core.push(...legPoly(AIR,E.s2.T,E.s2.p,E.s13.p,1/st.eF,n,'fan'));
  const cIn=E.s13||E.s2;
  if(E.s3.p>cIn.p*1.000001) core.push(...legPoly(AIR,cIn.T,cIn.p,E.s3.p,1/st.eC,n,'compressor'));
  core.push(...legBurn(AIR,E.s3.T,E.s3.p,E.s4.T,E.s4.p,E.f,F,st.etaB,E.airStd,n,'burner'));
  const gh=E.s4.gas;
  if(E.s5.p<E.s4.p*0.999999) core.push(...legPoly(gh,E.s4.T,E.s4.p,E.s5.p,st.eT,n,'turbine'));
  if(E.s45!==E.s5&&E.s45.p<E.s5.p*0.999999)
    core.push(...legPoly(gh,E.s5.T,E.s5.p,E.s45.p,st.eT,n,'power turbine'));
  if(E.fAB>0)
    core.push(...legBurn(gh,E.s45.T,E.s45.p,E.s7.T,E.s7.p,E.fAB,F,st.etaB,E.airStd,n,'afterburner'));
  core.push(...legNozzle(E.s7.gas,E.s7.T,E.s7.p,E.s9.p,st.etaN,n,'nozzle'));
  /* and home through the sky */
  core.push(...legWake(E.s9.gas,E.s9.T,E.s0.T,E.s0.p,n,'wake'));
  /* the loop closes in T and p; in ENTROPY it closes only if the exhaust is
     still air.  That residual is the composition change, and it is reported
     rather than hidden. */
  const sGap=core[core.length-1].s-core[0].s;

  let byp=null;
  if(E.s13&&E.s19){
    byp=[];
    byp.push(...legPoly(AIR,E.s0.T,E.s0.p,E.s2.p,1,n,'ram'));
    byp.push(...legPoly(AIR,E.s2.T,E.s2.p,E.s13.p,1/st.eF,n,'fan'));
    byp.push(...legNozzle(AIR,E.s13.T,E.s13.p*st.piFN,E.s19.p,st.etaN,n,'fan nozzle'));
    byp.push(...legWake(AIR,E.s19.T,E.s0.T,E.s0.p,n,'wake'));
  }
  return {core, byp, sGap};
}

/* trapezoidal loop integrals.  Both are taken round the SAME polyline, so any
   difference between them is quadrature, not physics. */
function loopInt(pts,fk,xk){
  let A=0;
  for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length];
    A+=0.5*(a[fk]+b[fk])*(b[xk]-a[xk]); }
  return A;
}
function cycleAreas(cy){
  return { ts:loopInt(cy.core,'T','s'),
           pv:loopInt(cy.core,'p','v')/1000,       // Pa·m³/kg -> kJ/kg
           sGap:cy.sGap };
}

/* ================================================================== *
 *  the engine, as geometry                                            *
 *                                                                     *
 *  A meridional profile (x, r) revolved about the axis, with a wedge  *
 *  left out so the gas path is visible.  The cut planes carry the     *
 *  flow-annulus cross-section, coloured by the LOCAL gas temperature, *
 *  so the compressor warming, the flame tube and the nozzle cooling   *
 *  are the same numbers the T-s diagram is drawing.                   *
 *                                                                     *
 *  Proportions are representative, not any one engine's flow path —   *
 *  said in the header comment and repeated here so the drawing is     *
 *  never mistaken for a measurement.                                  *
 * ================================================================== */
const CUT0=-118*DEG, CUT1=118*DEG;              // the kept angular span
const N_TH=26;                                  // revolve resolution

/* core gas-path knots: [x, r_hub, r_tip] */
const CORE_TJ=[[0.00,0.02,0.40],[0.45,0.12,0.38],[0.60,0.16,0.37],[1.25,0.27,0.31],
               [1.38,0.22,0.41],[1.72,0.22,0.41],[1.82,0.26,0.36],[2.20,0.21,0.42],
               [2.45,0.15,0.38]];
const CORE_TF=[[0.55,0.20,0.44],[0.70,0.23,0.42],[1.25,0.30,0.34],
               [1.38,0.25,0.45],[1.72,0.25,0.45],[1.82,0.29,0.40],[2.20,0.24,0.46],
               [2.45,0.18,0.40]];
const CORE_RJ=[[0.00,0.10,0.34],[0.55,0.17,0.33],[1.05,0.08,0.42],[1.20,0.00,0.45],
               [2.05,0.00,0.45],[2.25,0.00,0.42]];

function engineLayout(E,st){
  const type=st.type, ab=!!st.ab&&type!=='turboprop';
  const L={type, core:[], caseP:[], nacelle:null, bypass:null, blades:[], stations:[],
           spike:null, prop:null, flameHolders:false, len:0, rMax:0};
  const knots = type==='ramjet'?CORE_RJ : type==='turbofan'?CORE_TF : CORE_TJ;
  L.core=knots.map(k=>k.slice());

  /* tail pipe and nozzle, which grow when the afterburner lights */
  const xJet=L.core[L.core.length-1][0];
  const xAB = ab? xJet+0.55 : xJet+0.10;
  const rJ=L.core[L.core.length-1];
  if(ab){
    L.core.push([xJet+0.12, rJ[1]*0.5, rJ[2]*1.02]);
    L.core.push([xAB,       0.02,      rJ[2]*1.02]);
    L.flameHolders=true;
  } else {
    L.core.push([xAB, rJ[1]*0.6, rJ[2]*0.98]);
  }
  const xExit=xAB+ (type==='ramjet'?0.55:0.42);
  L.core.push([xExit, 0.02, rJ[2]*(type==='ramjet'?0.62:0.70)]);
  L.xNoz=xAB; L.xExit=xExit;

  /* the casing: the flow path's tip line, thickened, with a rounded lip */
  L.caseP=L.core.map(k=>[k[0], k[2]+0.035]);
  L.caseP[0]=[L.core[0][0], L.core[0][2]+0.02];

  if(type==='ramjet'){
    L.spike=[[-0.55,0.0],[-0.25,0.075],[0.10,0.135],[0.55,0.17]];
    L.flameHolders=true;
  } else if(type==='turbofan'){
    const RF=0.95;
    L.spike=[[-0.14,0.0],[0.02,0.11],[0.18,0.18],[0.30,0.20]];
    /* tips stay inside the duct wall: RF*0.97 against a nacelle bore of RF*0.99 */
    L.blades.push({x:0.34,rh:0.21,rt:RF*0.97,n:22,w:0.048,twist:0.42,seg:3,taper:0.72,
                   spin:1,kind:'fan'});
    L.blades.push({x:0.46,rh:0.21,rt:RF*0.93,n:38,w:0.030,twist:-0.14,spin:0,kind:'stator'});
    /* nacelle: outer skin and the bypass duct's inner wall */
    L.nacelle={out:[[0.12,RF*1.06],[0.42,RF*1.12],[1.10,RF*1.09],[1.75,RF*0.99],[2.05,RF*0.88]],
               inn:[[0.12,RF*1.00],[0.42,RF*0.99],[1.10,RF*0.90],[1.75,RF*0.80],[2.05,RF*0.76]]};
    L.bypass={x0:0.12,x1:2.05,
              inn:[[0.12,0.46],[0.42,0.50],[1.10,0.52],[1.75,0.50],[2.05,0.48]],
              out:L.nacelle.inn};
    L.xByp=2.05;
  } else if(type==='turboprop'){
    L.spike=[[-0.10,0.0],[0.08,0.09],[0.30,0.13],[0.45,0.14]];
    L.prop={x:-0.62, r0:0.16, r1:1.75, n:6, w:0.085, twist:1.15, seg:5, taper:0.38,
            hub:[[-0.80,0.0],[-0.62,0.15],[-0.30,0.19],[0.00,0.20]]};
  } else {
    L.spike=[[-0.12,0.0],[0.04,0.08],[0.24,0.12],[0.45,0.12]];
  }

  /* blade rows in the core.  Compressor stages step up in pressure, turbine
     stages step down; the drawing just needs them in the right ducts. */
  if(type!=='ramjet'){
    const c0=type==='turbofan'?0.72:0.62, c1=1.24;
    const nStage=type==='turbofan'?7:8;
    for(let i=0;i<nStage;i++){
      const u=(i+0.5)/nStage, x=lerp(c0,c1,u);
      const rr=coreRadii(L,x);
      L.blades.push({x,rh:rr[0]*1.02,rt:rr[1]*0.98,n:30,w:0.020,twist:0.16,spin:1,kind:'comp'});
    }
    const t0=1.80, t1=2.20, nT=type==='turboprop'?4:2;
    for(let i=0;i<nT;i++){
      const u=(i+0.5)/nT, x=lerp(t0,t1,u);
      const rr=coreRadii(L,x);
      L.blades.push({x,rh:rr[0]*1.02,rt:rr[1]*0.98,n:24,w:0.030,twist:-0.34,spin:1,kind:'turb'});
    }
  }

  /* where each station sits along the axis, for labels and for the gas-path
     temperature field */
  const xs = type==='ramjet'
    ? [['0',-0.5],['2',1.05],['4',2.05],['9',xExit]]
    : type==='turbofan'
      ? [['0',-0.3],['2',0.55],['13',0.50],['3',1.25],['4',1.72],['5',2.20],['7',xAB],['9',xExit]]
      : [['0',-0.3],['2',0.45],['3',1.25],['4',1.72],['5',2.20],['7',xAB],['9',xExit]];
  L.stations=xs.map(([id,x])=>({id,x}));
  L.len=xExit; L.rMax=type==='turbofan'?0.95*1.12: type==='turboprop'?1.75:0.5;
  return L;
}
function coreRadii(L,x){
  const K=L.core;
  if(x<=K[0][0]) return [K[0][1],K[0][2]];
  for(let i=1;i<K.length;i++) if(x<=K[i][0]){
    const u=(x-K[i-1][0])/(K[i][0]-K[i-1][0]);
    return [lerp(K[i-1][1],K[i][1],u), lerp(K[i-1][2],K[i][2],u)];
  }
  return [K[K.length-1][1],K[K.length-1][2]];
}
/* the gas-path temperature field: total temperature station to station, then
   the STATIC temperature through the nozzle, where the gas really does cool as
   it accelerates.  Same numbers as the diagrams — one engine, one solution. */
function tempField(E,L,st){
  const K=[];
  const push=(x,T)=>K.push([x,T]);
  push(-1.0,E.s0.T); push(L.core[0][0]-0.05,E.s00.T);
  if(st.type==='ramjet'){
    push(1.05,E.s2.T); push(1.25,E.s2.T); push(2.05,E.s4.T);
  } else {
    push(st.type==='turbofan'?0.55:0.45, E.s2.T);
    push(1.25,E.s3.T); push(1.38,E.s3.T); push(1.72,E.s4.T);
    push(2.20,E.s5.T);
    if(E.s45!==E.s5) push(2.30,E.s45.T);
  }
  push(L.xNoz,E.s7.T); push(L.xExit,E.s9.T); push(L.xExit+1.4,E.s0.T);
  return x=>{
    if(x<=K[0][0]) return K[0][1];
    for(let i=1;i<K.length;i++) if(x<=K[i][0]){
      const u=(x-K[i-1][0])/((K[i][0]-K[i-1][0])||1);
      return lerp(K[i-1][1],K[i][1],u);
    }
    return K[K.length-1][1];
  };
}

/* revolve a meridional band into quads over the kept angular span */
function ringPt(x,r,th){ return [x, r*Math.cos(th), r*Math.sin(th)]; }
function revolveBand(out,x0,r0,x1,r1,colFn,nth){
  nth=nth||N_TH;
  for(let j=0;j<nth;j++){
    const ta=lerp(CUT0,CUT1,j/nth), tb=lerp(CUT0,CUT1,(j+1)/nth);
    const a=ringPt(x0,r0,ta), b=ringPt(x1,r1,ta), c=ringPt(x1,r1,tb), d=ringPt(x0,r0,tb);
    out.push({q:[a,b,c,d], col:colFn(0.5*(x0+x1), 0.5*(ta+tb))});
  }
}
function revolveProfile(out,prof,colFn,nth){
  for(let i=0;i+1<prof.length;i++)
    revolveBand(out,prof[i][0],prof[i][1],prof[i+1][0],prof[i+1][1],colFn,nth);
}
/* Split long axial segments so the gas-path colour is a GRADIENT and not one
   flat tone per knot.  The combustor is a single 0.85-long segment in the
   layout, and undivided it painted the entire flame tube the colour of its own
   midpoint — hiding the very temperature rise the drawing exists to show. */
function densify(knots,maxDx){
  const o=[knots[0].slice()];
  for(let i=1;i<knots.length;i++){
    const a=knots[i-1], b=knots[i], n=Math.max(1,Math.ceil((b[0]-a[0])/maxDx));
    for(let j=1;j<=n;j++){ const u=j/n;
      o.push([lerp(a[0],b[0],u), lerp(a[1],b[1],u), lerp(a[2],b[2],u)]); }
  }
  return o;
}
/* the two exposed meridional faces of the cutaway */
function cutFaces(out,knots,colFn){
  for(const th of [CUT0,CUT1]) for(let i=0;i+1<knots.length;i++){
    const A=knots[i], B=knots[i+1];
    out.push({q:[ringPt(A[0],A[1],th),ringPt(A[0],A[2],th),
                 ringPt(B[0],B[2],th),ringPt(B[0],B[1],th)],
              col:colFn(0.5*(A[0]+B[0]),th), flat:true});
  }
}
/* Blades are NOT cut by the wedge: the wedge removes casing so the rotor can be
   seen, which is what a real cutaway drawing does.  A blade is built in `seg`
   spanwise pieces so the twist is a curve rather than a single shear, and the
   chord tapers to `taper` at the tip — without both, a propeller renders as a
   flat plank. */
function bladeQuads(out,bl,phase,col){
  const spin=bl.spin?phase*bl.spin:0, seg=bl.seg||1, tap=bl.taper===undefined?1:bl.taper;
  for(let k=0;k<bl.n;k++){
    const th0=spin+k*TAU/bl.n;
    for(let i=0;i<seg;i++){
      const u0=i/seg, u1=(i+1)/seg;
      const r0=lerp(bl.rh,bl.rt,u0), r1=lerp(bl.rh,bl.rt,u1);
      const t0=th0+bl.twist*u0*u0, t1=th0+bl.twist*u1*u1;   // twist grows outboard
      const w0=bl.w*lerp(1,tap,u0), w1=bl.w*lerp(1,tap,u1);
      out.push({q:[ringPt(bl.x-w0,r0,t0),ringPt(bl.x+w0,r0,t0),
                   ringPt(bl.x+w1,r1,t1),ringPt(bl.x-w1,r1,t1)], col, blade:true});
    }
  }
}

function fmtP(p){ return p>=1e6?(p/1e6).toFixed(2)+' MPa': p>=1e3?(p/1000).toFixed(1)+' kPa'
                       : p.toFixed(1)+' Pa'; }
function fmtF(N){ return Math.abs(N)>=1e3?(N/1000).toFixed(1)+' kN':N.toFixed(0)+' N'; }
function fmtPct(x){ return (100*x).toFixed(1)+'%'; }
/* TSFC: SI for the numbers, imperial in brackets because that is what every
   engine data sheet in existence still quotes. */
function fmtTSFC(t){
  if(!isFinite(t)||t<=0) return '—';
  return (t*1e6).toFixed(1)+' g/kN·s';
}
function tsfcImp(t){ return isFinite(t)&&t>0 ? (t*3600*9.80665).toFixed(3) : '—'; }
function fmtM(M){ return M.toFixed(2); }

/* ================================================================== *
 *  2-D diagram views                                                  *
