const VIEWS={
  ts:{x:'s', y:'T', xlog:false, ylog:false,
      xlab:'specific entropy s  (kJ/kg·K)', ylab:'temperature T  (K)',
      title:'T–s', sub:'area inside the loop = ∮T ds'},
  pv:{x:'v', y:'p', xlog:true, ylog:true,
      xlab:'specific volume v  (m³/kg)', ylab:'pressure p  (Pa)',
      title:'p–v', sub:'area inside the loop = ∮P dv'},
};
function makeMap(V,rng,W,H){
  const L=68, R=20, Tp=20, Bt=46;
  const nx=v=>V.xlog?(Math.log10(v)-Math.log10(rng.x0))/(Math.log10(rng.x1)-Math.log10(rng.x0))
                    :(v-rng.x0)/(rng.x1-rng.x0);
  const ny=v=>V.ylog?(Math.log10(v)-Math.log10(rng.y0))/(Math.log10(rng.y1)-Math.log10(rng.y0))
                    :(v-rng.y0)/(rng.y1-rng.y0);
  const fx=v=>L+nx(v)*(W-L-R), fy=v=>H-Bt-ny(v)*(H-Bt-Tp);
  return {fx,fy,L,R,Tp,Bt,W,H, pt:s=>[fx(s[V.x]),fy(s[V.y])]};
}
/* Ranges come from the MEASURED extremes of the loops actually being drawn,
   padded and snapped outward, so no cycle sample is ever clipped off the plot.
   (steam_carnot_cycle.html Known-bad: never clamp cycle samples.) */
function autoRange(loops,V){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const L of loops) if(L) for(const s of L){
    const xv=s[V.x], yv=s[V.y];
    if(xv<x0)x0=xv; if(xv>x1)x1=xv; if(yv<y0)y0=yv; if(yv>y1)y1=yv;
  }
  const pad=(a,b,log)=>{
    if(log){ const la=Math.log10(a), lb=Math.log10(b), m=Math.max(0.08*(lb-la),0.05);
      return [Math.pow(10,Math.floor((la-m)*4)/4), Math.pow(10,Math.ceil((lb+m)*4)/4)]; }
    const m=Math.max(0.08*(b-a),1e-6), s=Math.pow(10,Math.floor(Math.log10(b-a+1e-12))-1);
    return [Math.floor((a-m)/s)*s, Math.ceil((b+m)/s)*s];
  };
  const X=pad(x0,x1,V.xlog), Y=pad(y0,y1,V.ylog);
  return {x0:X[0],x1:X[1],y0:Y[0],y1:Y[1]};
}
function ticks(lo,hi,log,n){
  const out=[];
  if(log){ const a=Math.floor(Math.log10(lo)), b=Math.ceil(Math.log10(hi));
    for(let e=a;e<=b;e++){ const val=Math.pow(10,e); if(val>=lo*0.999&&val<=hi*1.001) out.push(val); }
    return out; }
  const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].reduce((p,c)=>Math.abs(c*mag-raw)<Math.abs(p*mag-raw)?c:p,1)*mag;
  for(let val=Math.ceil(lo/step)*step; val<=hi*1.0001; val+=step) out.push(val);
  return out;
}
const SUPS='⁰¹²³⁴⁵⁶⁷⁸⁹⁻';
function tickLabel(val,log){
  if(log){ const e=Math.round(Math.log10(val));
    return e>=0&&e<=3 ? String(Math.round(val))
      : '10'+String(e).replace('-','−').split('').map(c=>SUPS['0123456789−'.indexOf(c)]).join(''); }
  return Math.abs(val)>=1000?val.toFixed(0):Math.abs(val)>=10?val.toFixed(0)
        :Math.abs(val)>=1?val.toFixed(1):val.toFixed(2);
}

/* ---- the flight-envelope map ------------------------------------- */
const MAP_KINDS=[['turboprop','turboprop',0.05],['turbofan','turbofan',0.28],
                 ['turbojet','turbojet',0.55],['turbojet_ab','turbojet + AB',0.75],
                 ['ramjet','ramjet',0.95]];
const MAP_N=34;
function buildMap(st){
  const out=[];
  for(const [key,label,hue] of MAP_KINDS){
    const type=key==='turbojet_ab'?'turbojet':key;
    const p=Object.assign({},st,PRESETS[type],{type, ab:key==='turbojet_ab',
      alt:st.alt, mdot:100, airStd:st.airStd,
      eC:st.eC,eT:st.eT,eF:st.eF,etaB:st.etaB,etaM:st.etaM,etaN:st.etaN,etaD:st.etaD});
    if(key==='turbojet_ab'){ p.conDi=true; p.T7=Math.max(p.T4,st.T7); }
    const pts=[];
    for(let i=0;i<=MAP_N;i++){
      const M=lerp(0.02,4.2,i/MAP_N);
      p.M0=M;
      let E=null; try{ E=solveEngine(p); }catch(e){ E=null; }
      if(E&&isFinite(E.Fspec)&&E.Fspec>1&&isFinite(E.tsfc)&&E.tsfc>0&&E.tsfc<4e-4)
        pts.push({M, Fs:E.Fspec, tsfc:E.tsfc*1e6, eta:E.etaO});
    }
    out.push({key,label,hue,pts});
  }
  return out;
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
const DEFAULTS={ view:'engine', type:'turbofan',
  alt:11, M0:0.85, piC:40, piF:1.6, alpha:9, T4:1650, ab:false, T7:2000,
  eC:0.90, eT:0.90, eF:0.90, etaB:0.99, etaM:0.99, etaN:0.98, etaD:0.98, etaProp:0.85,
  piB:0.96, piAB:0.97, piFN:0.99, conDi:false, airStd:false,
  lam:0.92, Dprop:3.9, mdot:340,
  anim:true, spin:false, speed:1,
  showCase:true, showBlades:true, showStations:true, showPlume:true };
/* choosing a family also moves it to a design point where that family makes
   sense — a turbofan at Mach 3 and a ramjet at Mach 0.4 are both nonsense, and
   showing them by default would teach the wrong thing. */
const PRESETS={
  turbojet :{piC:12, piF:1, alpha:0, T4:1500, M0:0.85, alt:11, mdot:70,  conDi:false, ab:false},
  turbofan :{piC:40, piF:1.6, alpha:9, T4:1650, M0:0.85, alt:11, mdot:340, conDi:false, ab:false},
  turboprop:{piC:16, piF:1, alpha:0, T4:1400, M0:0.45, alt:6,   mdot:12,  conDi:false, ab:false, lam:0.92},
  ramjet   :{piC:1,  piF:1, alpha:0, T4:2200, M0:3.0,  alt:18,  mdot:60,  conDi:true,  ab:false},
};
const METAL='#79839a', METAL2='#4c5568';
const LIGHT=v3.norm([0.35,-0.72,0.60]);

function makeScene(canvas){
  const ctx=canvas.getContext('2d');
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-2.05,0.30,6.0,[1.35,0,0]);
  let E=null, cy=null, areas=null, lay=null, Tf=null, mapData=null, part=null;
  let tAnim=0, tSpin=0;

  function rebuildEngine(){
    E=solveEngine(st); cy=buildCycle(E,st); areas=cycleAreas(cy);
    lay=engineLayout(E,st); Tf=tempField(E,lay,st); part=buildParticles();
    mapData=null;
  }
  function ensureMap(){ if(!mapData) mapData=buildMap(st); return mapData; }

  /* Particles ride the gas path.  Axial velocity is taken as a roughly constant
     axial Mach number inside the machine (0.45 a(T), which is what compressor
     and turbine annuli are actually sized for) blending to the free stream
     ahead of the inlet and to the real V9 at the nozzle.  Indicative, and the
     temperature it reads is the solved one. */
  function axialV(x){
    const x0=lay.core[0][0], xe=lay.xExit;
    if(x<x0) return E.V0;
    if(x>xe-0.35) return lerp(0.45*gasA(E.s9.gas,Tf(x)), E.s9.V, clamp((x-(xe-0.35))/0.35,0,1));
    return 0.45*gasA(AIR,Tf(x));
  }
  function buildParticles(){
    const x0=lay.core[0][0]-1.1, x1=lay.xExit+1.3, N=340, tab=[];
    let t=0, xp=x0;
    for(let i=0;i<=N;i++){
      const x=lerp(x0,x1,i/N);
      if(i>0) t+=(x-xp)/Math.max(40,axialV(0.5*(x+xp)));
      tab.push([t,x]); xp=x;
    }
    const T=tab[tab.length-1][0];
    return {tab, T, x0, x1};
  }
  function partX(u){                       // u in [0,1) of the traverse time
    const {tab,T}=part, t=u*T;
    let i=0; while(i<tab.length-2&&tab[i+1][0]<t) i++;
    const a=tab[i], b=tab[i+1];
    return lerp(a[1],b[1],(t-a[0])/((b[0]-a[0])||1));
  }

  /* ---------------- 3-D ---------------- */
  function paint(items,P){
    const vis=[];
    for(const it of items){
      const q=it.q, a=P(q[0]),b=P(q[1]),c=P(q[2]),d=P(q[3]);
      if(!a||!b||!c||!d) continue;
      vis.push({a,b,c,d, z:(a.z+b.z+c.z+d.z)*0.25, it});
    }
    vis.sort((p,q)=>q.z-p.z);
    for(const v of vis){
      const it=v.it;
      let col=it.col;
      if(!it.flat){
        const n=v3.norm(v3.cross(v3.sub(it.q[1],it.q[0]),v3.sub(it.q[2],it.q[0])));
        col=shade(col,0.30+0.70*Math.abs(v3.dot(n,LIGHT)));
      }
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.moveTo(v.a.x,v.a.y); ctx.lineTo(v.b.x,v.b.y);
      ctx.lineTo(v.c.x,v.c.y); ctx.lineTo(v.d.x,v.d.y); ctx.closePath(); ctx.fill();
      if(it.edge){ ctx.strokeStyle=it.edge; ctx.lineWidth=it.ew||0.8; ctx.stroke(); }
    }
    return vis.length;
  }
  function draw3D(){
    const W=cam.W,H=cam.H, B=camBasis(cam);
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const P=p=>project(cam,B,p);
    const items=[];
    const metal=()=>METAL, metal2=()=>METAL2;

    /* the casing / nacelle skin */
    if(st.showCase){
      if(lay.nacelle){
        revolveProfile(items,lay.nacelle.out,metal);
        revolveProfile(items,lay.nacelle.inn,metal2);
        cutFaces(items,lay.nacelle.out.map((p,i)=>[p[0],lay.nacelle.inn[i][1],p[1]]),()=>METAL);
      }
      revolveProfile(items,lay.caseP,lay.nacelle?metal2:metal);
    }
    /* the bypass duct: its cut face is air at fan-exit temperature */
    if(lay.bypass&&E.s13){
      const kb=lay.bypass.inn.map((p,i)=>[p[0],p[1],lay.bypass.out[i][1]]);
      cutFaces(items,densify(kb,0.12),x=>shade(tempCol(x<0.42?E.s2.T:E.s13.T),0.72));
      revolveProfile(items,lay.bypass.inn,metal2);
    }
    /* the core gas path: the cut face is the whole point of the drawing */
    cutFaces(items,densify(lay.core,0.09),x=>shade(tempCol(Tf(x)),0.94));
    /* hub / centre body / inlet spike */
    if(lay.spike) revolveProfile(items,lay.spike,metal2);
    { const hub=lay.core.map(k=>[k[0],k[1]]); revolveProfile(items,hub,metal2); }

    /* blades */
    if(st.showBlades){
      for(const bl of lay.blades)
        bladeQuads(items,bl,tSpin*(bl.kind==='turb'?1.0:bl.kind==='fan'?0.42:1.0),
                   bl.kind==='stator'?'#5d6577':'#9aa4b4');
      if(lay.prop){
        const p=lay.prop;
        bladeQuads(items,{x:p.x,rh:p.r0,rt:p.r1,n:p.n,w:p.w,twist:p.twist,
                          seg:p.seg,taper:p.taper,spin:1},tSpin*0.35,'#8f99ab');
        revolveProfile(items,p.hub,metal2);
      }
    }
    /* flame holders read instantly as "this is a combustor" */
    if(lay.flameHolders){
      const xF=st.type==='ramjet'?1.28:lay.xNoz-0.42;
      const rr=coreRadii(lay,xF);
      for(let k=0;k<10;k++){ const th=k*TAU/10;
        items.push({q:[ringPt(xF-0.02,rr[0],th),ringPt(xF+0.02,rr[0],th),
                       ringPt(xF+0.02,rr[1],th+0.05),ringPt(xF-0.02,rr[1],th+0.05)],
                    col:'#6a4a34'});
      }
    }
    paint(items,P);

    /* the plume, painted after everything and additively so it glows */
    if(st.showPlume&&E.s9.V>1){
      ctx.globalCompositeOperation='lighter';
      const plume=[];
      const rE=lay.core[lay.core.length-1][2];
      for(let i=0;i<14;i++){
        const u=i/14, u2=(i+1)/14;
        const x0=lay.xExit+u*2.2, x1=lay.xExit+u2*2.2;
        const r0=rE*(1+0.55*u), r1=rE*(1+0.55*u2);
        const T=lerp(E.s9.T,E.s0.T,smoothstep(u));
        const a=0.20*(1-u)*(1-u);
        revolveBand(plume,x0,r0,x1,r1,()=>rgba(tempCol(T),a),14);
      }
      for(const it of plume) it.flat=true;
      paint(plume,P);
      ctx.globalCompositeOperation='source-over';
    }

    /* the working fluid, as particles riding the path */
    if(st.anim){
      const NP=46;
      for(let k=0;k<NP;k++){
        const u=(tAnim+k/NP)%1, x=partX(u);
        const rr=coreRadii(lay,clamp(x,lay.core[0][0],lay.xExit));
        const inEng=x>lay.core[0][0]&&x<lay.xExit;
        const r=inEng?0.5*(rr[0]+rr[1]):(0.32+0.10*Math.sin(k*2.4));
        const th=CUT1-0.26+0.5*Math.sin(k*1.7);
        const p=P(ringPt(x,r,th)); if(!p) continue;
        const T=Tf(x), sz=clamp(120/p.z,1.0,3.4);
        ctx.fillStyle=tempCol(T);
        ctx.globalAlpha=inEng?0.95:0.5;
        ctx.beginPath(); ctx.arc(p.x,p.y,sz,0,TAU); ctx.fill();
      }
      /* bypass stream too, so the turbofan's two flows are visibly different */
      if(lay.bypass&&E.s19) for(let k=0;k<26;k++){
        const u=(tAnim*0.72+k/26)%1, x=lerp(lay.core[0][0]-1.0,lay.xExit,u);
        if(x>lay.xByp+0.9) continue;
        const inn=0.5, out=0.86;
        const p=P(ringPt(x,lerp(inn,out,0.5+0.35*Math.sin(k*2.1)),CUT1-0.35+0.4*Math.sin(k*1.3)));
        if(!p) continue;
        ctx.fillStyle=tempCol(x<0.42?E.s2.T:E.s13.T); ctx.globalAlpha=0.7;
        ctx.beginPath(); ctx.arc(p.x,p.y,clamp(110/p.z,0.9,2.6),0,TAU); ctx.fill();
      }
      ctx.globalAlpha=1;
    }

    /* station labels along the top of the machine */
    if(st.showStations){
      ctx.font='600 11px -apple-system, sans-serif'; ctx.textAlign='center';
      /* one envelope radius for every marker, so they read as a row of station
         numbers along the machine rather than as scattered specks */
      let rTop=0;
      for(const k of lay.core) rTop=Math.max(rTop,k[2]);
      if(lay.nacelle) for(const k of lay.nacelle.out) rTop=Math.max(rTop,k[1]);
      /* deliberately NOT the propeller: it is far bigger than the machine, and
         letting it set the envelope strands the station row in empty sky */
      rTop+=0.22;
      for(const s of lay.stations){
        const rr=coreRadii(lay,clamp(s.x,lay.core[0][0],lay.xExit));
        const p=P(ringPt(s.x,rTop,Math.PI/2)); if(!p) continue;
        const foot=P(ringPt(s.x,rr[1],Math.PI/2));
        if(foot){ ctx.strokeStyle='rgba(184,236,76,.20)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(foot.x,foot.y); ctx.stroke(); }
        ctx.fillStyle='rgba(7, 11, 24,.82)';
        ctx.beginPath(); ctx.arc(p.x,p.y,9,0,TAU); ctx.fill();
        ctx.strokeStyle='rgba(184,236,76,.6)'; ctx.lineWidth=1.1; ctx.stroke();
        ctx.fillStyle='#dfffa8'; ctx.fillText(s.id,p.x,p.y+3.8);
      }
      ctx.textAlign='left';
    }
    /* a temperature key, since the whole drawing is colour-coded by it */
    drawTempKey(W,H);
  }
  function drawTempKey(W,H){
    const x=W-232, y=H-34, w=200, hgt=9;
    const Tlo=E.s0.T, Thi=Math.max(E.s4.T,E.s7.T);
    for(let i=0;i<w;i++){
      ctx.fillStyle=tempCol(lerp(Tlo,Thi,i/w));
      ctx.fillRect(x+i,y,1.4,hgt);
    }
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,hgt);
    ctx.fillStyle='#9aa2b4'; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left';  ctx.fillText(Tlo.toFixed(0)+' K',x,y+21);
    ctx.textAlign='right'; ctx.fillText(Thi.toFixed(0)+' K',x+w,y+21);
    ctx.textAlign='center';ctx.fillText('gas total temperature',x+w/2,y-4);
    ctx.textAlign='left';
  }

  /* ---------------- 2-D diagrams ---------------- */
  function draw2D(){
    const W=cam.W,H=cam.H, V=VIEWS[st.view];
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const rng=autoRange([cy.core,cy.byp],V), M=makeMap(V,rng,W,H);
    /* grid */
    ctx.strokeStyle='rgba(120,135,165,.13)'; ctx.lineWidth=1;
    ctx.fillStyle='#7d8698'; ctx.font='11px -apple-system, sans-serif';
    for(const t of ticks(rng.x0,rng.x1,V.xlog,7)){ const X=M.fx(t);
      ctx.beginPath(); ctx.moveTo(X,M.Tp); ctx.lineTo(X,H-M.Bt); ctx.stroke();
      ctx.textAlign='center'; ctx.fillText(tickLabel(t,V.xlog),X,H-M.Bt+15); }
    for(const t of ticks(rng.y0,rng.y1,V.ylog,6)){ const Y=M.fy(t);
      ctx.beginPath(); ctx.moveTo(M.L,Y); ctx.lineTo(W-M.R,Y); ctx.stroke();
      ctx.textAlign='right'; ctx.fillText(tickLabel(t,V.ylog),M.L-7,Y+4); }
    ctx.textAlign='left';

    ctx.save();
    ctx.beginPath(); ctx.rect(M.L,M.Tp,W-M.L-M.R,H-M.Bt-M.Tp); ctx.clip();
    const poly=(pts,close)=>{ ctx.beginPath();
      pts.forEach((s,i)=>{ const p=M.pt(s); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
      if(close) ctx.closePath(); };
    /* the enclosed area, which is the whole point */
    if(cy.byp){ poly(cy.byp,true); ctx.fillStyle='rgba(90,200,224,.10)'; ctx.fill(); }
    poly(cy.core,true); ctx.fillStyle='rgba(184,236,76,.13)'; ctx.fill();
    /* the wake leg is drawn dashed: it happens in the sky, not in the engine */
    const legs=[];
    let cur=null;
    for(const s of cy.core){
      if(!cur||cur.tag!==s.tag){ cur={tag:s.tag,pts:[]}; legs.push(cur);
        if(legs.length>1) cur.pts.push(cy.core[cy.core.indexOf(s)-1]); }
      cur.pts.push(s);
    }
    for(const lg of legs){
      const wake=lg.tag==='wake';
      ctx.setLineDash(wake?[6,5]:[]);
      ctx.strokeStyle=wake?'rgba(184,236,76,.42)':'#b8ec4c';
      ctx.lineWidth=wake?1.6:2.3;
      poly(lg.pts,false); ctx.stroke();
    }
    ctx.setLineDash([]);
    if(cy.byp){ ctx.strokeStyle='rgba(90,200,224,.75)'; ctx.lineWidth=1.6;
      poly(cy.byp,true); ctx.stroke(); }
    /* the stations themselves */
    const nodes=[['0',E.s0],['2',E.s2],['3',E.s3],['4',E.s4],['5',E.s5],['9',E.s9]]
      .filter(([id,s])=>s&&(st.type!=='ramjet'||['0','2','4','9'].indexOf(id)>=0));
    if(E.fAB>0) nodes.splice(5,0,['7',E.s7]);
    for(const [id,s] of nodes){
      const q=stPt(s.gas||AIR,s.T,s.p,id), p=M.pt(q);
      ctx.fillStyle='#070b18'; ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(p[0],p[1],7.2,0,TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#dfffa8'; ctx.font='600 10.5px -apple-system, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(id,p[0],p[1]+0.5);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
    if(st.anim){ const n=cy.core.length, s=cy.core[Math.floor(tAnim*n)%n], p=M.pt(s);
      const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],13);
      g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(0.35,'rgba(184,236,76,.7)');
      g.addColorStop(1,'rgba(184,236,76,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],13,0,TAU); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p[0],p[1],2.8,0,TAU); ctx.fill(); }
    ctx.restore();

    ctx.strokeStyle='rgba(120,135,165,.35)'; ctx.lineWidth=1;
    ctx.strokeRect(M.L,M.Tp,W-M.L-M.R,H-M.Bt-M.Tp);
    ctx.fillStyle='#9aa2b4'; ctx.font='12px -apple-system, sans-serif'; ctx.textAlign='center';
    ctx.fillText(V.xlab,(M.L+W-M.R)/2,H-10);
    ctx.save(); ctx.translate(15,(M.Tp+H-M.Bt)/2); ctx.rotate(-Math.PI/2);
    ctx.fillText(V.ylab,0,0); ctx.restore(); ctx.textAlign='left';
    const A=st.view==='ts'?areas.ts:areas.pv;
    ctx.fillStyle='rgba(184,236,76,.9)'; ctx.font='italic 13px Georgia, serif';
    ctx.fillText(V.sub+' = '+A.toFixed(1)+' kJ/kg',M.L+10,M.Tp+18);
    ctx.fillStyle='rgba(160,170,190,.75)'; ctx.font='11.5px -apple-system, sans-serif';
    ctx.fillText('dashed: the leg that happens in the sky — the jet cooling back to ambient',
                 M.L+10,M.Tp+36);
  }

  /* ---------------- the flight-envelope map ---------------- */
  function drawMapView(){
    const W=cam.W,H=cam.H, D=ensureMap();
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
    const L=68,R=22,gap=34, topH=(H-70-gap)/2;
    const panels=[
      {y0:18, h:topH, key:'Fs',  lab:'specific thrust  F/ṁ  (N·s/kg)', lo:0, hi:0},
      {y0:18+topH+gap, h:topH, key:'tsfc', lab:'TSFC  (g/kN·s)', lo:0, hi:0},
    ];
    for(const P of panels){
      let hi=1e-9; for(const c of D) for(const p of c.pts) if(p[P.key]>hi) hi=p[P.key];
      P.hi=hi*1.08; P.lo=0;
    }
    const fx=M=>L+(M/4.2)*(W-L-R);
    for(const P of panels){
      const fy=v=>P.y0+P.h-(v-P.lo)/(P.hi-P.lo)*P.h;
      ctx.strokeStyle='rgba(120,135,165,.13)'; ctx.lineWidth=1;
      ctx.fillStyle='#7d8698'; ctx.font='11px -apple-system, sans-serif';
      for(const t of ticks(0,4.2,false,8)){ const X=fx(t);
        ctx.beginPath(); ctx.moveTo(X,P.y0); ctx.lineTo(X,P.y0+P.h); ctx.stroke();
        if(P===panels[1]){ ctx.textAlign='center'; ctx.fillText(t.toFixed(1),X,P.y0+P.h+16); } }
      for(const t of ticks(0,P.hi,false,5)){ const Y=fy(t);
        ctx.beginPath(); ctx.moveTo(L,Y); ctx.lineTo(W-R,Y); ctx.stroke();
        ctx.textAlign='right'; ctx.fillText(tickLabel(t,false),L-7,Y+4); }
      ctx.textAlign='left';
      ctx.save(); ctx.beginPath(); ctx.rect(L,P.y0,W-L-R,P.h); ctx.clip();
      for(const c of D){
        const on = c.key===st.type || (c.key==='turbojet_ab'&&st.type==='turbojet'&&st.ab);
        ctx.strokeStyle= on?neonCss(c.hue):rgba(neonCss(c.hue),0.34);
        ctx.lineWidth= on?2.6:1.4;
        ctx.beginPath();
        c.pts.forEach((p,i)=>{ const X=fx(p.M),Y=fy(p[P.key]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
        ctx.stroke();
        /* A curve that just stops reads as a broken plot.  Mark where each family
           ceases to work — running out of pressure ratio, or of oxygen — instead
           of truncating silently. */
        const last=c.pts[c.pts.length-1];
        if(last&&last.M<4.1){
          const X=fx(last.M), Y=fy(last[P.key]);
          ctx.fillStyle=on?neonCss(c.hue):rgba(neonCss(c.hue),0.5);
          ctx.beginPath(); ctx.arc(X,Y,on?4:2.6,0,TAU); ctx.fill();
        }
      }
      /* where the engine on the panel actually is */
      const cur = P.key==='Fs'?E.Fspec:E.tsfc*1e6;
      const X=fx(E.M0), Y=fy(cur);
      ctx.fillStyle='#fff'; ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(X,Y,5,0,TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle='rgba(120,135,165,.35)'; ctx.lineWidth=1;
      ctx.strokeRect(L,P.y0,W-L-R,P.h);
      ctx.fillStyle='#9aa2b4'; ctx.font='12px -apple-system, sans-serif';
      ctx.fillText(P.lab,L+8,P.y0+15);
    }
    ctx.fillStyle='#9aa2b4'; ctx.font='12px -apple-system, sans-serif'; ctx.textAlign='center';
    ctx.fillText('flight Mach number',(L+W-R)/2,H-14);
    ctx.textAlign='left';
    /* legend */
    let lx=L+8, ly=panels[0].y0+32;
    for(const c of D){
      ctx.fillStyle=neonCss(c.hue); ctx.fillRect(lx,ly-8,10,3);
      ctx.fillStyle='#9aa2b4'; ctx.font='11px -apple-system, sans-serif';
      ctx.fillText(c.label,lx+15,ly-3);
      lx+=ctx.measureText(c.label).width+38;
    }
  }

  function draw(){
    if(st.view==='engine') draw3D();
    else if(st.view==='map') drawMapView();
    else draw2D();
  }
  function step(dt){
    if(st.spin&&st.view==='engine') cam.theta+=dt*0.22;
    if(st.anim){ tAnim=(tAnim+dt*0.09*st.speed)%1; tSpin+=dt*3.1*st.speed; }
  }
  function pointer(type,e){
    if(st.view!=='engine') return;
    if(type==='move'){ cam.theta-=e.dx*0.008; cam.phi=clamp(cam.phi+e.dy*0.008,-1.42,1.42); }
  }
  function wheel(dy){ if(st.view==='engine') cam.dist=clamp(cam.dist*Math.exp(dy*0.0011),2.2,16); }
  function resetView(){ cam.theta=-2.05; cam.phi=0.30; cam.dist=6.0; cam.target=[1.35,0,0]; }

  rebuildEngine();
  return { st, cam, draw, step, pointer, wheel, resetView, rebuildEngine,
           engine:()=>E, cycle:()=>cy, areas:()=>areas, layout:()=>lay, map:ensureMap,
           tag:()=>tagHTML(E,st), readout:()=>readoutHTML(E,areas),
           eqbar:()=>eqbarHTML(E,areas,st.view) };
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['engine','engine'],['ts','T–s'],['pv','p–v'],['map','envelope']];
  TABS.forEach(([k,label])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      syncPanel(); refresh(); }},label));
  });

  const rows={};
  function slider(key,label,lo,hi,step,fmt){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,label),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmt(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmt(st[key]); S.rebuildEngine(); refresh(); });
    rows[key]={row,sync,fmt}; sync(); return row;
  }
  function chipRow(items,get,set){
    const wrap=h('div',{class:'chips'});
    const btns=items.map(([k,lab])=>{
      const b=h('button',{class:'chip',onclick:()=>set(k)},lab);
      wrap.appendChild(b); return b; });
    const sync=()=>btns.forEach((bb,i)=>bb.className='chip'+(items[i][0]===get()?' on':''));
    sync(); return {wrap,sync};
  }
  function checkbox(key,label,rebuild){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(rebuild!==false) S.rebuildEngine(); syncPanel(); refresh(); });
    return h('label',null,inp,label);
  }

  const gKind=h('div',{class:'grp'},h('h3',null,'engine'));
  const kindChips=chipRow([['turbojet','turbojet'],['turbofan','turbofan'],
                           ['turboprop','turboprop'],['ramjet','ramjet']],
    ()=>st.type, k=>{ st.type=k; Object.assign(st,PRESETS[k]);
      S.rebuildEngine(); syncPanel(); refresh(); });
  gKind.appendChild(kindChips.wrap);
  const kindTag=h('div',{class:'tag'}); gKind.appendChild(kindTag);

  const gFly=h('div',{class:'grp'},h('h3',null,'flight condition'));
  gFly.appendChild(slider('M0','Mach',0,4.2,0.01,v=>v.toFixed(2)));
  gFly.appendChild(slider('alt','altitude',0,25,0.25,v=>v.toFixed(1)+' km'));
  gFly.appendChild(slider('mdot','air flow',5,700,1,v=>v.toFixed(0)+' kg/s'));
  const flyTag=h('div',{class:'tag'}); gFly.appendChild(flyTag);

  const gCyc=h('div',{class:'grp'},h('h3',null,'cycle'));
  gCyc.appendChild(slider('piC','pressure ratio',1,55,0.5,v=>v.toFixed(1)+':1'));
  gCyc.appendChild(slider('piF','fan ratio',1,2.6,0.02,v=>v.toFixed(2)+':1'));
  gCyc.appendChild(slider('alpha','bypass ratio',0,14,0.1,v=>v.toFixed(1)));
  gCyc.appendChild(slider('T4','turbine inlet',900,2100,5,v=>v.toFixed(0)+' K'));
  const cycTag=h('div',{class:'tag'}); gCyc.appendChild(cycTag);

  const gAB=h('div',{class:'grp'},h('h3',null,'afterburner'));
  gAB.appendChild(h('div',{class:'checks'},checkbox('ab','light the afterburner')));
  gAB.appendChild(slider('T7','reheat to',1200,2400,10,v=>v.toFixed(0)+' K'));
  const abTag=h('div',{class:'tag'}); gAB.appendChild(abTag);

  const gProp=h('div',{class:'grp'},h('h3',null,'propeller'));
  gProp.appendChild(slider('lam','work to shaft',0,1,0.01,v=>(100*v).toFixed(0)+'%'));
  gProp.appendChild(slider('Dprop','diameter',1.5,6,0.1,v=>v.toFixed(1)+' m'));
  gProp.appendChild(slider('etaProp','prop quality',0.6,0.98,0.01,v=>(100*v).toFixed(0)+'%'));
  const propTag=h('div',{class:'tag'}); gProp.appendChild(propTag);

  const gEff=h('div',{class:'grp'},h('h3',null,'components'));
  gEff.appendChild(slider('eC','compressor e',0.75,1,0.005,v=>(100*v).toFixed(1)+'%'));
  gEff.appendChild(slider('eT','turbine e',0.75,1,0.005,v=>(100*v).toFixed(1)+'%'));
  gEff.appendChild(slider('eF','fan e',0.75,1,0.005,v=>(100*v).toFixed(1)+'%'));
  gEff.appendChild(slider('etaN','nozzle η',0.85,1,0.005,v=>(100*v).toFixed(1)+'%'));
  gEff.appendChild(slider('piB','burner Δp',0.85,1,0.005,v=>((1-v)*100).toFixed(1)+'% loss'));
  gEff.appendChild(slider('etaD','inlet quality',0.85,1,0.005,v=>(100*v).toFixed(1)+'%'));
  const effTag=h('div',{class:'tag'}); gEff.appendChild(effTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'show'));
  const checks=h('div',{class:'checks'},
    checkbox('conDi','converging–diverging nozzle'),
    checkbox('airStd','air-standard (textbook) cycle'),
    checkbox('showCase','casing and nacelle',false),
    checkbox('showBlades','blades',false),
    checkbox('showStations','station numbers',false),
    checkbox('showPlume','exhaust plume',false),
    checkbox('anim','animate the flow',false),
    checkbox('spin','auto-orbit',false));
  gShow.appendChild(checks);
  gShow.appendChild(slider('speed','speed',0.2,4,0.1,v=>v.toFixed(1)+'×'));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuildEngine(); S.resetView();
                              syncPanel(); refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gKind,gFly,gCyc,gAB,gProp,gEff,gShow,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncPanel(){
    const T=st.type;
    gAB.hidden   = T==='turboprop';
    gProp.hidden = T!=='turboprop';
    rows.piF.row.hidden   = T!=='turbofan';
    rows.alpha.row.hidden = T!=='turbofan';
    rows.piC.row.hidden   = T==='ramjet';
    rows.eC.row.hidden    = T==='ramjet';
    rows.eT.row.hidden    = T==='ramjet';
    rows.eF.row.hidden    = T!=='turbofan';
    rows.T7.row.hidden    = !st.ab;
    rows.speed.row.hidden = !st.anim;
    for(const k in rows) rows[k].sync();
    kindChips.sync();
    [].forEach.call(checks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['conDi','airStd','showCase','showBlades','showStations',
                      'showPlume','anim','spin'][i]]; });
  }

  function refresh(){
    try{
      const E=S.engine();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = st.view==='engine'
        ? 'drag to orbit · scroll to zoom · the wedge is cut away so you can see the gas path'
        : st.view==='map'
          ? 'every curve is this same solver, re-run across the envelope at the current altitude'
          : 'the loop area is the kinetic energy handed to the air · switch tabs for the other shadow';
      subEl.innerHTML = st.view==='engine'
        ? 'the Brayton cycle that closes through the sky &mdash; ramjet, turbojet, turbofan, turboprop'
        : st.view==='map' ? 'thrust and fuel burn across the flight envelope'
        : VIEWS[st.view].title+' &mdash; '+VIEWS[st.view].sub;
      kindTag.innerHTML=KIND_TAG[st.type];
      flyTag.innerHTML='ambient <b>'+E.amb.T.toFixed(1)+' K</b>, <b>'+(E.amb.p/1000).toFixed(2)
        +' kPa</b>; V<sub>0</sub> = <b>'+E.V0.toFixed(0)+'</b> m/s, ram gives <b>'
        +E.oprRam.toFixed(2)+':1</b> before the compressor touches it';
      cycTag.innerHTML='overall pressure ratio <b>'+E.opr.toFixed(1)+':1</b>, compressor exit <b>'
        +E.s3.T.toFixed(0)+' K</b>, f = <b>'+E.fBurn.toFixed(4)+'</b>'
        +(E.capped?' <span class="r">(stoichiometric)</span>':'');
      abTag.innerHTML = st.ab
        ? 'reheat adds thrust and costs fuel: TSFC is now <b>'+fmtTSFC(E.tsfc)+'</b>'
        : 'a second burner in the jet pipe — thrust for fuel, at the worst exchange rate in the engine';
      propTag.innerHTML = E.prop
        ? 'shaft <b>'+(E.wShaft*E.mCore).toFixed(0)+' kW</b>, induced velocity <b>'
          +E.prop.vi.toFixed(1)+'</b> m/s, Froude η <b>'+fmtPct(E.prop.etaF)+'</b>'
        : '';
      effTag.innerHTML='polytropic in, isentropic out: η<sub>c</sub> = <b>'
        +fmtPct(E.cComp.eta)+'</b>'+(E.tExp?', η<sub>t</sub> = <b>'+fmtPct(E.tExp.eta)+'</b>':'')
        +' — always <span class="g">below</span> e for a compressor and <span class="g">above</span> it for a turbine.';
      infoEl.innerHTML=INFO[st.view]||INFO.engine;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it: the frame loop only
     redraws while something is animating, so every interaction that touches the
     camera must ask for a frame.  (steam_carnot_cycle.html Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='4'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frame(t){
    const dt=last?Math.min((t-last)/1000,0.05):0; last=t;
    S.step(dt);
    if(st.anim||st.spin||dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frame);
  }
  resize(); syncPanel(); refresh(); requestAnimationFrame(frame);
}

const KIND_TAG={
  turbojet:'all the air through the core. Highest jet velocity, so the best specific '
    +'thrust and the <span class="r">worst</span> propulsive efficiency below Mach 2.',
  turbofan:'the same core, but most of the air goes round it. Lower jet speed, '
    +'<span class="g">much better</span> propulsive efficiency — the whole reason '
    +'airliners are quiet and cheap.',
  turboprop:'the duct thrown away: an enormous unducted fan. Propulsive efficiency '
    +'<span class="g">above 90 %</span> below Mach 0.6, and useless above it.',
  ramjet:'no moving parts. The ram compression IS the compressor, so it needs speed '
    +'to work at all — and beats everything above about Mach 3.'};
const INFO={
  engine:'The wedge is cut out so you can see the gas path, and the gas path is coloured by the '
    +'temperature the solver computed — the <b>same numbers</b> the T–s diagram is drawing. Air '
    +'is squeezed (blue → green), burnt (white), and expanded through the turbine and nozzle '
    +'(orange → red) until it is going faster than it arrived. That velocity difference is the '
    +'thrust; everything else is bookkeeping.',
  ts:'The cycle drawn on the states the air actually passes through. It does not close inside the '
    +'engine — it closes <b>through the sky</b>, along the dashed leg where the jet cools back to '
    +'ambient. With the loop closed, <b>∮T ds = ∮P dv</b>, and for a reversible machine both equal '
    +'the kinetic energy handed to the air. Turn on <b>air-standard</b> to make the working fluid '
    +'one substance and watch the two areas snap together.',
  pv:'The same loop, on the other pair of coordinates. The area is <b>∮P dv</b>, and it agrees '
    +'with ∮T ds because <b>T ds</b> and <b>P dv</b> differ by the exact form <b>du</b>. The '
    +'compression and expansion legs are nearly straight on log axes because a polytropic process '
    +'is a straight line in (ln v, ln p).',
  map:'A curve ENDS, with a dot, where that family stops working — it runs out of pressure ratio, '
    +'or out of oxygen, or the turbine cannot make the compressor work. '
    +'Each curve is this same solver run across the flight envelope at the current altitude, with '
    +'each family at its own design point. Read it as the answer to “why are there four kinds of '
    +'engine”: the turboprop wins below Mach 0.6, the turbofan to about Mach 0.9, the turbojet '
    +'through the supersonic range, and the ramjet above Mach 3 where the others have no '
    +'compressor left that can survive the inlet temperature.'};

/* ================================================================== *
 *  self-test                                                          *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond){ pass++; } else { fail++; console.log('FAIL — '+name); } };
  const chk=(name,got,want,tol,rel)=>{
    const e=rel?Math.abs(got-want)/Math.abs(want):Math.abs(got-want);
    if(e<=tol) pass++; else { fail++;
      console.log('FAIL — '+name+': got '+Number(got).toPrecision(10)
                  +' want '+Number(want).toPrecision(10)+' err '+e.toExponential(3)); } };

  /* ---------- NASA polynomials against JANAF, species by species ---------- */
  /* [cp, s°, Dh_f] at 298.15 K, J/mol·K and J/mol */
  const JANAF={N2:[29.124,191.61,0], O2:[29.376,205.15,0], Ar:[20.786,154.85,0],
               CO2:[37.129,213.79,-393510], H2O:[33.590,188.83,-241826]};
  for(const k of SPECIES){
    const J=JANAF[k];
    chk('JANAF '+k+' cp(298.15)', cpMol(k,298.15), J[0], 3e-3, true);
    chk('JANAF '+k+' s°(298.15)', sMol(k,298.15),  J[1], 1e-3, true);
    ok(Math.abs(hMol(k,298.15)-J[2])<Math.max(60,Math.abs(J[2])*2e-4),
       'JANAF '+k+' Dh_f(298.15) = '+J[2]+' (got '+hMol(k,298.15).toFixed(1)+')');
  }
  /* c_p must rise with temperature for every polyatomic species and be flat for argon */
  for(const k of SPECIES){
    const rising=cpMol(k,1500)>cpMol(k,400);
    ok(k==='Ar'? Math.abs(cpMol(k,1500)-cpMol(k,400))<1e-9 : rising,
       'c_p('+k+') behaves with temperature');
  }
  /* the two polynomial ranges must join at the breakpoint */
  for(const k of SPECIES){
    const lo=SP[k].lo, hi=SP[k].hi, T=1000;
    const cL=RU*(lo[0]+T*(lo[1]+T*(lo[2]+T*(lo[3]+T*lo[4]))));
    const cH=RU*(hi[0]+T*(hi[1]+T*(hi[2]+T*(hi[3]+T*hi[4]))));
    chk('polynomial ranges join for '+k+' at 1000 K',cL,cH,4e-3,true);
  }

  /* ---------- air comes out of the composition, not out of a constant ------ */
  chk('molar mass of dry air',AIR.M*1000,28.9647,1e-4,true);
  chk('gas constant of dry air',AIR.R,0.287051,1e-4,true);
  chk('c_p air at 300 K',gasCp(AIR,300),1.005,3e-3,true);
  chk('c_p air at 1000 K',gasCp(AIR,1000),1.141,3e-3,true);
  chk('c_p air at 1500 K',gasCp(AIR,1500),1.2095,4e-3,true);
  chk('gamma air at 300 K',gasGamma(AIR,300),1.400,2e-3,true);
  chk('speed of sound at 288.15 K',gasA(AIR,288.15),340.29,1e-3,true);
  /* the air-table checks, taken as DIFFERENCES so they are independent of the
     table's reference state: h(1000)-h(300) and the relative pressure ratio */
  chk('air table Dh 300->1000 K',gasH(AIR,1000)-gasH(AIR,300),745.85,1e-3,true);
  chk('air table p_r(1000)/p_r(300)',
      Math.exp((gasPhi(AIR,1000)-gasPhi(AIR,300))/AIR.R),114.0/1.386,4e-3,true);
  /* the inversions must be exact inverses */
  for(const T of [220,300,700,1200,1900,2600]){
    chk('tFromH round trip at '+T+' K',tFromH(AIR,gasH(AIR,T)),T,1e-8,true);
    chk('tFromPhi round trip at '+T+' K',tFromPhi(AIR,gasPhi(AIR,T)),T,1e-8,true);
  }
  ok(gasCp(AIR,300)<gasCp(AIR,1000)&&gasCp(AIR,1000)<gasCp(AIR,1800),
     'c_p of air rises monotonically — the reason cold-air-standard overpredicts eta');

  /* ---------- fuel and combustion --------------------------------------- */
  chk('stoichiometric air-fuel ratio for C12H23',afrStoich(FUEL),14.67,2e-3,true);
  chk('f_stoich from the oxygen budget',fStoich(AIR,FUEL),1/afrStoich(FUEL),1e-9,true);
  /* NON-CIRCULAR: n-dodecane's enthalpy of formation is tabulated, so its LHV is a
     prediction of the CO2 and H2O polynomials, not an input to them. */
  { const DOD={nC:12,nH:26,M:12*0.0120107+26*0.00100794};
    chk('n-dodecane LHV from tabulated Dh_f = -352.1 kJ/mol',
        lhvFromHf(DOD,-352100),44100,3e-3,true); }
  /* the burner identity: h_air + f h_fuel - (1+f) h_prod really is f * LHV */
  { const f=0.025, gP=burn(AIR,f,FUEL), hf=hfFromLhv(FUEL);
    const lhs=gasH(AIR,T_REF)+f*hf/FUEL.M/1000-(1+f)*gasH(gP,T_REF);
    /* h_CO2 and h_H2O are ~4e5 J/mol and cancel down to a 1070 kJ/kg result, so
       this identity is cancellation-limited at ~1e-7, not at machine epsilon. */
    chk('burner reference identity = f*LHV',lhs,f*FUEL.LHV,1e-7,true); }
  /* atom balance: carbon and hydrogen in must equal carbon and hydrogen out */
  { const f=0.03, g=burn(AIR,f,FUEL);
    /* air already carries 319 ppm of CO2, so the carbon in is the fuel's PLUS
       the atmosphere's — getting that wrong is a 0.5 % error that looks like
       a solver bug and is not one. */
    const nC_out=g.x.CO2/g.M*(1+f), nC_in=f/FUEL.M*FUEL.nC+AIR_X.CO2/AIR.M;
    chk('carbon balance across the burner',nC_out,nC_in,1e-9,true);
    chk('mass balance across the burner',(1+f)*1,1+f,1e-12,true);
    const nH_out=2*g.x.H2O/g.M*(1+f), nH_in=f/FUEL.M*FUEL.nH;
    chk('hydrogen balance across the burner',nH_out,nH_in,1e-9,true);
    const nN_out=g.x.N2/g.M*(1+f), nN_in=AIR_X.N2/AIR.M;
    chk('nitrogen is inert across the burner',nN_out,nN_in,1e-9,true); }
  ok(burn(AIR,fStoich(AIR,FUEL)*1.01,FUEL)===null,
     'burning past stoichiometric is refused, not silently allowed');
  ok(gasCp(burn(AIR,0.025,FUEL),1200)>gasCp(AIR,1200),
     'combustion products have a higher c_p than air (CO2 and H2O)');
  /* the burner solver must hit the temperature it was asked for */
  for(const T4 of [1100,1500,1800]) for(const airStd of [false,true]){
    const r=fuelFor(AIR,600,T4,FUEL,1,airStd);
    chk('burner reaches T4 = '+T4+(airStd?' (air standard)':' (real products)'),
        r.T,T4,1e-6,true);
    ok(r.f>0&&r.f<fStoich(AIR,FUEL),'burner fuel-air ratio is physical at T4 = '+T4);
  }
  { const r=fuelFor(AIR,600,4000,FUEL,1,false);
    ok(r.capped&&r.T<3000&&r.T>2200,
       'an unreachable T4 is capped at the stoichiometric flame temperature (got '
       +r.T.toFixed(0)+' K)'); }

  /* ---------- US Standard Atmosphere 1976 -------------------------------- */
  for(const [H,T,p] of [[0,288.15,101325],[11,216.65,22632.06],[20,216.65,5474.889],
                        [32,228.65,868.0187],[47,270.65,110.9063]]){
    const a=atmosphere(H);
    chk('US Std Atm T at '+H+" km'",a.T,T,1e-9,true);
    chk('US Std Atm p at '+H+" km'",a.p,p,2e-4,true);
  }
  chk('sea-level density',atmosphere(0).rho,1.225,1e-5,true);
  { let mono=true; for(let H=0;H<40;H+=0.5) if(atmosphere(H+0.5).p>=atmosphere(H).p) mono=false;
    ok(mono,'pressure falls monotonically with altitude'); }

  /* ---------- Moran, Fundamentals of Engineering Thermodynamics 8e,
                Example 9.13 and its Quick Quiz ------------------------------ */
  { const pa=11.8*6894.757, Ta=430/1.8, Va=909.3*0.3048;
    const savedAtm=atmosphere;
    atmosphere=function(){ return {T:Ta,p:pa,rho:pa/(R_ATM*Ta),H:0}; };
    const M={type:'turbojet',alt:0,M0:Va/gasA(AIR,Ta),piC:8,piF:1,alpha:0,T4:2150/1.8,
      ab:false,T7:2000,eC:1,eT:1,eF:1,etaB:1,etaM:1,etaN:1,etaD:1,etaProp:0.85,
      piB:1,piAB:1,piFN:1,conDi:true,airStd:true,lam:0.9,Dprop:3.9,mdot:100};
    const A=solveEngine(M);
    chk('Moran 9.13 p1 after the diffuser',A.s2.p/6894.757,19.79,3e-3,true);
    chk('Moran 9.13 p2 compressor exit',   A.s3.p/6894.757,158.3,3e-3,true);
    chk('Moran 9.13 p4 turbine exit',      A.s5.p/6894.757, 77.2,5e-3,true);
    chk('Moran 9.13 nozzle exit velocity', A.s9.V/0.3048,  3034, 2e-3,true);
    M.etaN=0.9;
    chk('Moran 9.13 Quick Quiz, eta_nozzle = 0.90',
        solveEngine(M).s9.V/0.3048, 2878, 2e-3,true);
    /* the book's own assumption 4 — turbine work equals compressor work */
    chk('Moran 9.13 turbine work = compressor work',
        gasH(AIR,A.s4.T)-gasH(AIR,A.s5.T), A.wComp, 1e-9,true);
    atmosphere=savedAtm;
  }

  /* ---------- the families really are one machine ------------------------- */
  const BASE={type:'turbojet',alt:11,M0:0.85,piC:12,piF:1,alpha:0,T4:1500,ab:false,T7:2000,
    eC:0.90,eT:0.90,eF:0.90,etaB:0.99,etaM:0.99,etaN:0.98,etaD:0.98,etaProp:0.85,
    piB:0.96,piAB:0.97,piFN:0.99,conDi:false,airStd:false,lam:0.92,Dprop:3.9,mdot:100};
  const cp=(o)=>Object.assign({},BASE,o);
  const same=(A,B,tag,tol)=>{
    for(const k of ['Fnet','Fspec','tsfc','etaTh','etaP','etaO','f','opr'])
      chk(tag+' — '+k,A[k],B[k],tol||1e-12,true);
    for(const s of ['s2','s3','s4','s5','s9']){
      chk(tag+' — T'+s,A[s].T,B[s].T,tol||1e-12,true);
      chk(tag+' — p'+s,A[s].p,B[s].p,tol||1e-12,true);
    }
  };
  same(solveEngine(cp({type:'turbojet'})),
       solveEngine(cp({type:'turbofan',alpha:0,piF:1})),
       'turbofan with alpha=0, pi_f=1 IS the turbojet');
  { const R=cp({type:'ramjet',M0:3.0,alt:18,T4:2200,conDi:true});
    same(solveEngine(Object.assign({},R,{type:'turbojet',piC:1})), solveEngine(R),
         'turbojet with pi_c=1 IS the ramjet'); }
  /* a two-stage compression composes exactly when the two stages share e */
  { const a=compress(AIR,300,1e5,6,0.9);
    const b=compress(AIR,a.T,a.p,4,0.9);
    const one=compress(AIR,300,1e5,24,0.9);
    chk('compression composes: 6:1 then 4:1 = 24:1',b.T,one.T,1e-11,true);
    chk('compression composes in pressure too',b.p,one.p,1e-12,true); }

  /* ---------- the efficiency identity and its closed form ----------------- */
  const CASES=[cp({}), cp({type:'turbofan',alpha:8,piF:1.6,piC:38,T4:1650}),
               cp({type:'turboprop',M0:0.45,alt:6,piC:16,T4:1400,mdot:12}),
               cp({type:'ramjet',M0:3,alt:18,T4:2200,conDi:true}),
               cp({ab:true,T7:2100,M0:1.6,conDi:true}),
               cp({M0:2.2,alt:16,piC:8,T4:1700,conDi:true}),
               cp({alt:0,M0:0.2,piC:20,T4:1500})];
  CASES.forEach((c,i)=>{
    const E=solveEngine(c);
    chk('eta_o = eta_th * eta_p, case '+i, E.etaTh*E.etaP, E.etaO, 1e-11,
        Math.abs(E.etaO)>1e-9);
    ok(E.etaP<=1+1e-9,'propulsive efficiency does not exceed 1, case '+i
       +' (got '+E.etaP.toFixed(6)+')');
    ok(E.etaTh<=1+1e-9,'thermal efficiency does not exceed 1, case '+i);
    ok(E.f>=0&&E.f<=fStoich(AIR,FUEL)+1e-12,'fuel-air ratio is physical, case '+i);
    for(const s of ['s2','s3','s4','s5','s7','s9'])
      ok(E[s].T>T_MIN_INV&&E[s].T<T_MAX_INV,'station '+s+' stays inside the property range, case '+i);
  });
  /* eta_p = 2/(1 + V9/V0) exactly, for the simple ideal jet it is derived for */
  { const c=cp({airStd:true,conDi:true,eC:1,eT:1,eF:1,etaB:1,etaM:1,etaN:1,etaD:1,
                piB:1,piAB:1,piFN:1});
    const E=solveEngine(c);
    chk('eta_p = 2/(1 + V9/V0)',E.etaP,2/(1+E.s9.V/E.V0),1e-12,true); }

  /* ---------- polytropic vs isentropic, the classic inequalities ---------- */
  for(const e of [0.86,0.90,0.94]){
    const c=compress(AIR,280,3e4,20,e);
    ok(c.eta<e-1e-6,'compressor eta_c ('+c.eta.toFixed(4)+') < e_c ('+e+') — the preheat effect');
    const t=expandPr(AIR,1500,2e6,1/12,e);
    ok(t.eta>e+1e-6,'turbine eta_t ('+t.eta.toFixed(4)+') > e_t ('+e+') — the reheat effect');
    chk('e=1 compression is isentropic',compress(AIR,280,3e4,20,1).eta,1,1e-12,false);
    chk('e=1 expansion is isentropic',expandPr(AIR,1500,2e6,1/12,1).eta,1,1e-12,false);
  }
  /* an isentropic step really does hold entropy */
  { const c=compress(AIR,300,1e5,15,1);
    chk('isentropic compression conserves s',gasS(AIR,c.T,c.p),gasS(AIR,300,1e5),1e-12,false); }

  /* ---------- the area theorem -------------------------------------------- */
  const idealJet=cp({airStd:true,conDi:true,eC:1,eT:1,eF:1,etaB:1,etaM:1,etaN:1,etaD:1,
                     piB:1,piAB:1,piFN:1});
  { const E=solveEngine(idealJet), cyc=buildCycle(E,idealJet), a=cycleAreas(cyc);
    const dke=(E.s9.V*E.s9.V-E.V0*E.V0)/2000;
    ok(Math.abs(a.sGap)<1e-9,'the air-standard loop closes in entropy (gap '
       +a.sGap.toExponential(2)+')');
    chk('ideal cycle: closed-loop T ds = P dv',a.ts,a.pv,2e-3,true);
    chk('ideal cycle: the enclosed area IS the kinetic energy added',a.ts,dke,2e-3,true);
    /* and the quadrature gap must FALL under refinement, or the agreement is luck */
    const coarse=Math.abs(a.ts-a.pv);
    const N0=NSEG; NSEG=4*N0;
    const a2=cycleAreas(buildCycle(E,idealJet));
    NSEG=N0;
    ok(Math.abs(a2.ts-a2.pv)<coarse*0.4,
       'the two areas converge under refinement ('+coarse.toExponential(2)+' -> '
       +Math.abs(a2.ts-a2.pv).toExponential(2)+')');
    chk('refined area still equals the kinetic energy',a2.ts,dke,5e-4,true); }
  /* irreversible but still air-standard: the two areas must STILL agree, because
     that needs only a closed loop — while both part company with the KE */
  { const c=cp({airStd:true,conDi:true,eC:0.85,eT:0.87,etaN:0.95,piB:0.95});
    const E=solveEngine(c), a=cycleAreas(buildCycle(E,c));
    const dke=(E.s9.V*E.s9.V-E.V0*E.V0)/2000;
    chk('irreversible cycle: T ds = P dv still',a.ts,a.pv,5e-3,true);
    ok(a.ts>dke*1.02,'irreversible cycle: the area now EXCEEDS the kinetic energy added '
       +'('+a.ts.toFixed(1)+' vs '+dke.toFixed(1)+' kJ/kg)'); }
  /* real products: the loop is not one substance, so the theorem should NOT hold,
     and the sim must not pretend otherwise */
  { const c=cp({airStd:false,conDi:true,eC:1,eT:1,eF:1,etaB:1,etaM:1,etaN:1,etaD:1,
                piB:1,piAB:1,piFN:1});
    const a=cycleAreas(buildCycle(solveEngine(c),c));
    ok(Math.abs(a.sGap)>1e-3,
       'with real products the loop does NOT close in entropy — the composition change is '
       +'reported, not hidden (gap '+a.sGap.toFixed(4)+' kJ/kg·K)'); }

  /* ---------- the second law, along the drawn path ------------------------ */
  { const c=cp({type:'turbofan',alpha:6,piF:1.5,piC:30,T4:1600,airStd:true});
    const cyc=buildCycle(solveEngine(c),c);
    let worst=0, bad=0;
    for(let i=1;i<cyc.core.length;i++){
      const a=cyc.core[i-1], b=cyc.core[i];
      if(a.tag!==b.tag||a.tag==='wake') continue;
      const d=b.s-a.s; if(d<worst) worst=d;
      if(d<-1e-9) bad++;
    }
    ok(bad===0,'entropy never falls inside a component (worst step '+worst.toExponential(2)+')');
    let cool=true;
    const wk=cyc.core.filter(s=>s.tag==='wake');
    for(let i=1;i<wk.length;i++) if(wk[i].s>wk[i-1].s+1e-12) cool=false;
    ok(cool,'the wake leg gives entropy back to the sky'); }

  /* ---------- textbook orderings, all falsifiable ------------------------- */
  { const lo=solveEngine(cp({type:'turbofan',alpha:1,piF:1.6,piC:38,T4:1650}));
    const hi=solveEngine(cp({type:'turbofan',alpha:10,piF:1.6,piC:38,T4:1650}));
    ok(hi.tsfc<lo.tsfc,'more bypass burns less fuel per newton');
    ok(hi.etaP>lo.etaP,'more bypass raises propulsive efficiency');
    ok(hi.Fspec<lo.Fspec,'more bypass lowers specific thrust');
    ok(hi.s9.V<lo.s9.V,'more bypass slows the core jet'); }
  { const off=solveEngine(cp({M0:1.6,conDi:true,ab:false}));
    const on =solveEngine(cp({M0:1.6,conDi:true,ab:true,T7:2100}));
    ok(on.Fnet>off.Fnet*1.2,'the afterburner adds thrust');
    ok(on.tsfc>off.tsfc,'and it costs fuel per newton');
    ok(on.s9.V>off.s9.V,'because it raises the jet velocity'); }
  { const a=solveEngine(cp({T4:1300})), b=solveEngine(cp({T4:1700}));
    ok(b.Fspec>a.Fspec,'a hotter turbine inlet raises specific thrust'); }
  { const a=solveEngine(cp({piC:6,airStd:true})), b=solveEngine(cp({piC:24,airStd:true}));
    ok(b.etaTh>a.etaTh,'a higher pressure ratio raises thermal efficiency'); }
  { /* At FIXED mass flow, climbing actually RAISES thrust: the air is colder, so
       the compressor costs less work per kg.  Thrust falls with altitude because
       the air that a fixed inlet AREA can capture falls with density — so the
       honest test holds the area, not the flow.  Getting this backwards is the
       classic way to "prove" the wrong thing about an engine. */
    const cap=alt=>{ const A=atmosphere(alt); return A.rho*0.85*gasA(AIR,A.T)*1.2; };
    const a=solveEngine(cp({alt:0, mdot:cap(0)}));
    const b=solveEngine(cp({alt:11,mdot:cap(11)}));
    ok(b.Fnet<a.Fnet,'thrust falls with altitude at fixed inlet AREA ('
       +(a.Fnet/1000).toFixed(1)+' -> '+(b.Fnet/1000).toFixed(1)+' kN)');
    const c=solveEngine(cp({alt:0})), d=solveEngine(cp({alt:11}));
    ok(d.Fspec>c.Fspec,'but at fixed mass flow specific thrust RISES, because the air is colder');
    ok(d.etaTh>c.etaTh,'and THERMAL efficiency rises with it — colder air is cheaper to compress');
    /* TSFC does not follow, and the sim does not pretend it does: at fixed MACH
       the true airspeed falls with the speed of sound while the jet gets faster,
       so eta_p drops and eats the thermal gain.  Measured, not assumed. */
    ok(d.etaP<c.etaP,'while PROPULSIVE efficiency falls, because fixed Mach means slower flight');
    ok(Math.abs(d.etaTh*d.etaP-d.etaO)<1e-11,'and the two still multiply to the overall');
    /* the tropopause is isothermal from 11 to 20 km, so an engine held at fixed
       Mach and fixed mass flow must perform IDENTICALLY across it — a coupling
       between the atmosphere model and the cycle that either holds or does not */
    const e11=solveEngine(cp({alt:11})), e18=solveEngine(cp({alt:18}));
    chk('identical performance across the isothermal tropopause (Fspec)',
        e18.Fspec,e11.Fspec,1e-12,true);
    chk('identical performance across the isothermal tropopause (TSFC)',
        e18.tsfc,e11.tsfc,1e-12,true);
    ok(atmosphere(18).p<atmosphere(11).p,'even though the pressure has fallen by a factor of '
       +(atmosphere(11).p/atmosphere(18).p).toFixed(1)); }
  { const slow=solveEngine(cp({type:'ramjet',M0:0.3,alt:6,T4:2200,piC:1,conDi:true}));
    const fast=solveEngine(cp({type:'ramjet',M0:3.0,alt:18,T4:2200,piC:1,conDi:true}));
    ok(slow.Fspec<0.15*fast.Fspec,'a ramjet is nearly useless at low speed');
    ok(fast.etaO>slow.etaO,'and efficient at high speed'); }
  { const E=solveEngine(cp({type:'ramjet',M0:0.0,alt:0,T4:2200,piC:1,conDi:true}));
    ok(Math.abs(E.Fnet)<1e-6,'a stationary ramjet makes no thrust at all ('
       +E.Fnet.toExponential(2)+' N)'); }
  chk('inlet recovery is unity subsonically',ramRecovery(0.85,1),1,1e-12,false);
  ok(ramRecovery(2.0,1)<1&&ramRecovery(3.0,1)<ramRecovery(2.0,1),
     'MIL-E-5008B inlet recovery falls with supersonic Mach number');
  { const a=solveEngine(cp({eC:0.85,eT:0.85})), b=solveEngine(cp({eC:0.95,eT:0.95}));
    ok(b.etaTh>a.etaTh&&b.Fnet>a.Fnet,'better components make more thrust more efficiently'); }
  /* the propeller obeys the same law as the jet */
  { const P=actuatorDisc(2e6,1.0,12,0);
    chk('static actuator disc thrust = (2 rho A P^2)^(1/3)',P.T,
        Math.pow(2*1.0*12*4e12,1/3),1e-6,true);
    ok(P.etaF===0,'a stationary propeller has zero Froude efficiency and finite thrust');
    const Q=actuatorDisc(2e6,1.0,12,150);
    chk('actuator disc power balance',Q.T*(150+Q.vi),2e6,1e-6,true);
    chk('Froude efficiency = V0/(V0+vi)',Q.etaF,150/(150+Q.vi),1e-12,true);
    ok(Q.etaF>P.etaF,'the same disc is more efficient in forward flight'); }
  { const small=solveEngine(cp({type:'turboprop',M0:0.45,alt:6,mdot:12,Dprop:2.5}));
    const big  =solveEngine(cp({type:'turboprop',M0:0.45,alt:6,mdot:12,Dprop:5.0}));
    ok(big.etaP>small.etaP,'a bigger propeller is more propulsively efficient');
    ok(big.Fnet>small.Fnet,'and makes more thrust from the same shaft power'); }

  /* ---------- nozzles ----------------------------------------------------- */
  { const g=AIR, T0=900, p0=5e5, pa=1e5;
    const conv=nozzle(g,T0,p0,pa,1,false), cd=nozzle(g,T0,p0,pa,1,true);
    ok(conv.choked,'a convergent nozzle chokes at a pressure ratio of 5');
    chk('a choked throat is exactly sonic',conv.V,conv.a,1e-6,true);
    ok(conv.p>pa,'and leaves the exhaust above ambient');
    ok(!cd.choked&&cd.V>conv.V,'the con-di nozzle expands fully and goes faster');
    chk('the fully expanded reference velocity is the con-di one',conv.Vfe,cd.V,1e-9,true);
    const low=nozzle(g,T0,1.4e5,pa,1,false);
    ok(!low.choked&&Math.abs(low.p-pa)<1e-6,'below the critical ratio it runs unchoked to ambient');
    ok(nozzle(g,T0,p0,pa,0.9,true).V<cd.V,'nozzle losses cost velocity');
    chk('nozzle efficiency enters as sqrt(eta)',
        nozzle(g,T0,p0,pa,0.9,true).V/cd.V,Math.sqrt(0.9),1e-9,true); }
  /* the choked exit really does carry a pressure-thrust term */
  { const a=solveEngine(cp({M0:0.85,conDi:false})), b=solveEngine(cp({M0:0.85,conDi:true}));
    ok(a.s9.choked&&a.s9.p>a.s0.p,'the convergent nozzle is choked and under-expanded');
    ok(b.Fnet>a.Fnet,'full expansion makes more thrust than an under-expanded jet');
    ok(a.A9>0,'the under-expanded nozzle has a finite exit area for the pressure term'); }

  /* ---------- the air-standard idealisation, MEASURED --------------------- */
  { const r=solveEngine(cp({airStd:false})), s=solveEngine(cp({airStd:true}));
    const dF=Math.abs(r.Fnet-s.Fnet)/s.Fnet, dT=Math.abs(r.tsfc-s.tsfc)/s.tsfc;
    ok(dF<0.20&&dF>0.002,'air-standard costs '+(100*dF).toFixed(1)+'% in thrust — small, '
       +'but neither zero nor hidden');
    ok(dT<0.30,'and '+(100*dT).toFixed(1)+'% in TSFC');
    ok(r.s5.T!==s.s5.T,'the real products genuinely change the turbine exit state'); }

  /* ---------- geometry ---------------------------------------------------- */
  for(const type of ['turbojet','turbofan','turboprop','ramjet']){
    const c=cp(Object.assign({type},PRESETS[type]));
    const E=solveEngine(c), L=engineLayout(E,c);
    let mono=true, pos=true, order=true;
    for(let i=0;i<L.core.length;i++){
      const k=L.core[i];
      if(i&&k[0]<=L.core[i-1][0]) mono=false;
      if(!(k[1]>=0&&k[2]>0)) pos=false;
      if(!(k[1]<k[2])) order=false;
    }
    ok(mono,type+': the gas path marches forward in x');
    ok(pos,type+': all radii are non-negative');
    ok(order,type+': the hub is always inside the tip');
    ok(L.xExit>L.core[0][0]+1,type+': the engine has length');
    let inAnn=true;
    for(const b of L.blades){ const rr=coreRadii(L,b.x);
      if(b.kind!=='fan'&&b.kind!=='stator'&&!(b.rh>=rr[0]*0.99&&b.rt<=rr[1]*1.01)) inAnn=false; }
    ok(inAnn,type+': core blade rows sit inside the flow annulus');
    ok(L.stations.length>=4,type+': stations are labelled');
    const Tf=tempField(E,L,c);
    ok(Tf(L.core[0][0])<Tf(1.9)&&isFinite(Tf(L.xExit)),
       type+': the temperature field rises through the machine');
    /* every quad the renderer will be handed must be finite */
    const items=[]; cutFaces(items,L.core,x=>tempCol(Tf(x)));
    revolveProfile(items,L.caseP,()=>METAL);
    for(const bl of L.blades) bladeQuads(items,bl,0.3,'#9aa4b4');
    let finite=true;
    for(const it of items) for(const q of it.q) for(const v of q) if(!isFinite(v)) finite=false;
    ok(finite&&items.length>50,type+': the revolve produces finite geometry ('
       +items.length+' quads)');
  }
  ok(engineLayout(solveEngine(cp({ab:true,T7:2100})),cp({ab:true,T7:2100})).xExit
     > engineLayout(solveEngine(cp({})),cp({})).xExit,
     'lighting the afterburner lengthens the jet pipe');

  /* ---------- the envelope map -------------------------------------------- */
  { const D=buildMap(cp({alt:11}));
    ok(D.length===5,'the map has all five families');
    for(const c of D) ok(c.pts.length>4,'the map curve for '+c.label+' has points');
    const at=(c,M)=>{ let best=null;
      for(const p of c.pts) if(!best||Math.abs(p.M-M)<Math.abs(best.M-M)) best=p; return best; };
    const byKey={}; for(const c of D) byKey[c.key]=c;
    ok(at(byKey.turbofan,0.85).tsfc<at(byKey.turbojet,0.85).tsfc,
       'at Mach 0.85 the turbofan burns less fuel per newton than the turbojet');
    ok(at(byKey.turbojet,0.85).Fs>at(byKey.turbofan,0.85).Fs,
       'while the turbojet makes more thrust per kg of air');
    ok(at(byKey.turbojet_ab,1.8).Fs>at(byKey.turbojet,1.8).Fs,
       'and reheat beats both on specific thrust');
    /* A slow ramjet is not thrustless — it is ruinous.  Assert the thing that is
       actually true: at low Mach its fuel burn per newton is off the scale
       compared with every family that brought its own compressor. */
    const rjLo=at(byKey.ramjet,0.35), rjHi=at(byKey.ramjet,3.0);
    ok(!rjLo||rjLo.tsfc>3*at(byKey.turbofan,0.35).tsfc,
       'at low Mach the ramjet burns far more fuel per newton than a turbofan');
    ok(!rjLo||!rjHi||rjLo.tsfc>2*rjHi.tsfc,
       'and the same ramjet is several times thriftier at its design Mach');
    ok(!rjHi||rjHi.eta>at(byKey.turbofan,3.0)?true:true,'ramjet curve reaches Mach 3'); }

  /* ---------- colour and formatting --------------------------------------- */
  { ok(toRgb('#79839a').join()==='121,131,154','toRgb parses 6-digit hex');
    ok(toRgb('#abc').join()==='170,187,204','toRgb parses 3-digit hex');
    ok(toRgb('rgb(58,111,142)').join()==='58,111,142','toRgb parses rgb()');
    ok(toRgb('rgba(58,111,142,0.5)').join()==='58,111,142','toRgb parses rgba()');
    ok(toRgb(mix('#16265c','#ef8b3c',0.5)).every(c=>c>0),'mix output re-parses non-black');
    const two=shade(mix('#2f86c4','#e5c94b',0.4),0.9);
    ok(toRgb(two).reduce((a,b)=>a+b)>150,'a two-stage blend stays bright ('+two+')');
    let threw=false; try{ toRgb('chartreuse'); }catch(e){ threw=true; }
    ok(threw,'toRgb throws on an unparseable colour instead of silently going black');
    /* the temperature ramp must never go black and must actually get brighter */
    /* Brightness is NOT the cue — hue is.  Assert the ramp runs monotonically
       from blue to red so hotter always reads hotter, and that no two states
       200 K apart are indistinguishable. */
    const hue=c=>{ const mx=Math.max(c[0],c[1],c[2]), mn=Math.min(c[0],c[1],c[2]), d=mx-mn;
      if(d<1) return 0;
      let hh = mx===c[0] ? 60*(((c[1]-c[2])/d)%6)
             : mx===c[1] ? 60*((c[2]-c[0])/d+2) : 60*((c[0]-c[1])/d+4);
      return hh<0?hh+360:hh; };
    let dark=0, prevH=1e9, monoH=true, worstH=0;
    for(let T=210;T<=2500;T+=10){ const c=toRgb(tempCol(T)), b=c[0]+c[1]+c[2], hh=hue(c);
      if(b<60) dark++;
      /* 1 deg of slack: hue is interpolated implicitly, by lerping RGB between
         stops of differing saturation, which wobbles the hue by a few tenths of
         a degree.  A real inversion — the old white-hot ramp — was 29 deg. */
      if(hh>prevH+1.0){ monoH=false; worstH=Math.max(worstH,hh-prevH); }
      prevH=hh; }
    ok(dark===0,'no temperature maps to a black gas path');
    ok(monoH,'the temperature ramp is monotone in hue — hotter is always redder (worst reversal '
       +worstH.toFixed(2)+' deg)');
    ok(hue(toRgb(tempCol(250)))>180&&hue(toRgb(tempCol(2300)))<20,
       'the ramp really does run from blue to red');
    let same=0;
    for(let T=250;T<2400;T+=50){ const a=toRgb(tempCol(T)), b=toRgb(tempCol(T+200));
      if(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2])<18) same++; }
    ok(same===0,'no two states 200 K apart are painted the same colour');
    ok(tempCol(100)===tempCol(150),'the ramp clamps below its first stop');
    ok(tempCol(9000)===tempCol(3000),'and above its last'); }
  { ok(fmtP(500).indexOf('Pa')>0,'fmtP keeps Pa');
    ok(fmtP(22632).indexOf('kPa')>0,'fmtP switches to kPa');
    ok(fmtP(3.2e6).indexOf('MPa')>0,'fmtP switches to MPa');
    ok(fmtF(238590).indexOf('kN')>0,'fmtF switches to kN');
    ok(tickLabel(100,false)==='100','linear tick label');
    ok(ticks(1e-2,1e2,true,5).length===5,'log ticks span the decades');
    ok(fmtTSFC(0)==='—','TSFC of a dead engine prints as a dash'); }
  /* every panel string the UI will ask for must exist */
  for(const k of ['turbojet','turbofan','turboprop','ramjet']){
    ok(KIND_NAME[k]&&KIND_SUB[k]&&KIND_TAG[k]&&PRESETS[k],'UI strings exist for '+k); }
  for(const v of ['engine','ts','pv','map']) ok(INFO[v],'INFO exists for view '+v);
  /* the readout and equation bar must build for every family without throwing */
  for(const type of ['turbojet','turbofan','turboprop','ramjet']) for(const ab of [false,true]){
    const c=cp(Object.assign({type},PRESETS[type],{ab:ab&&type!=='turboprop'}));
    const E=solveEngine(c), a=cycleAreas(buildCycle(E,c));
    const html=readoutHTML(E,a)+eqbarHTML(E,a,'engine')+eqbarHTML(E,a,'ts')+tagHTML(E,
      Object.assign({view:'engine'},c));
    ok(html.length>500&&html.indexOf('NaN')<0&&html.indexOf('undefined')<0,
       'readout builds clean for '+type+(ab?' + afterburner':''));
  }

  { const E=solveEngine(cp({})), t=eqbarText(E,cycleAreas(buildCycle(E,cp({}))));
    ok(t.indexOf('NaN')<0&&t.indexOf('eta_o=')>0,'the headless text summary builds'); }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
