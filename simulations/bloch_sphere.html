<title>The Bloch sphere — projection versus identity</title>
<!--
  ===================================================================
  THE BLOCH SPHERE: PROJECTION VERSUS IDENTITY
  rho = (1 + r.sigma)/2, and what each of those two terms is for
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, diffraction.html,
  pulsar.html, standard_candle.html, cmb.html, differential_scattering.html and
  adiabatic_expansion.html: one flat file, no build step, no network, works
  opened straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS COMPUTES
  ------------------------------------------------------------------
    the sphere    two complex amplitudes, minus a normalisation, minus a
                  phase nobody can measure -- two angles, and the HALF that
                  makes orthogonal states antipodal instead of perpendicular.
    projection    rho = (1 + r.sigma)/2 split into its two halves: the
    vs identity   identity part, which is the same for every state a qubit
                  can be in, and the part that carries the whole state.
                  Purity, eigenvalues, entropy, and where a projector is.
    measurement   P+ + P- = 1 is what "the measurement has outcomes" means.
                  The Born rule four independent ways, cos^2(Theta/2)
                  against a polariser's cos^2(Theta), and three magnets.
    precession    dr/dt = -gamma B x r at real CODATA frequencies, Rabi
                  flopping in the rotating frame, and the electron anomaly
                  against Schwinger's one loop.
    decoherence   the Bloch equations, and T2 <= 2T1 derived from complete
                  positivity of the map rather than quoted.
    double cover  U(2pi) = -1 and U(4pi) = +1; the geometric phase as half
                  the enclosed solid angle.

  ------------------------------------------------------------------
  WHAT IS MEASURED
  ------------------------------------------------------------------
  CODATA 2022, the complete listing, retrieved with curl from
  physics.nist.gov/cuu/Constants/Table/allascii.txt.  Values and
  uncertainties are copied from that file and are the shortest decimals that
  round-trip; nothing is typed from memory.  Used for:
    * gyromagnetic ratios (proton, shielded proton, electron, neutron,
      shielded helion) -- these turn the picture into real frequencies;
    * the electron g factor and magnetic moment anomaly, to 13 digits;
    * the fine-structure constant, for Schwinger's alpha/2pi.
  Everything else in this file is exact linear algebra.  That is the happiest
  case the verification policy allows for, and it is why the assertions here
  are at 1e-14 rather than at a percent.

  ------------------------------------------------------------------
  RESULTS WORTH THE FILE EXISTING
  ------------------------------------------------------------------
  * A proton in a 1.5 T scanner precesses at 63.8662 MHz.  The number MRI
    actually uses is the SHIELDED one, 25.67 ppm lower, because the proton
    sits inside a water molecule and its own electrons screen the field.
  * Schwinger's one-loop alpha/2pi = 1.1614097e-3 against a measured
    1.15965218046e-3: no free parameters, 0.15% high, and the gap is where
    the two-loop term lives.
  * T2 <= 2T1 is exactly the boundary of complete positivity.  Past it the
    Choi matrix of the relaxation map acquires a negative eigenvalue, which
    this file computes -- the boundary is at 2.00, not near it.
  * The geometric phase after a closed loop is minus half the solid angle
    enclosed, verified as a product of overlaps against the closed form.

  ------------------------------------------------------------------
  WHAT IS NOT MODELLED, and is said so on the canvas
  ------------------------------------------------------------------
  * One qubit only.  There is no second qubit anywhere in this file, so
    there is no entanglement, and the mixed states in the ball are drawn
    without saying which of the many ways of making them produced this one.
    A reduced state of an entangled pair and a classically randomised state
    give the SAME point in the ball, and nothing here can tell them apart --
    which is a fact about the Bloch sphere, not an omission.
  * Measurement is projective and instantaneous.  No POVMs, no weak
    measurement, no detector model, no readout error.
  * Relaxation is the Bloch-equation model with two rates.  Real
    decoherence is not generally of that form; non-Markovian dynamics can
    put purity back, and this cannot.
  * The Rabi view uses the rotating-wave approximation without deriving it,
    and the Bloch-Siegert shift is absent.
  * No spins higher than 1/2.  The sphere is CP^1 and that is a coincidence
    of two levels; CP^2 is not a ball you can draw.

  ------------------------------------------------------------------
  VERIFICATION
  ------------------------------------------------------------------
  selfTest() runs when there is no document (osascript -l JavaScript).  The
  2x2 complex arithmetic is checked against hand-multiplied entries before
  any physics is done with it; the Pauli algebra is checked for all nine
  products; the Born rule is computed four independent ways; the sign of the
  precession was DERIVED by integrating the Schrodinger equation in Python
  and comparing, not chosen, and the suite asserts the opposite sign is badly
  wrong so the check cannot be vacuous.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);

/* ============================================================================
 *  physics
 *
 *  JavaScript has no complex type, so a 2x2 complex matrix is a flat array of
 *  eight reals -- [a.re,a.im, b.re,b.im, c.re,c.im, d.re,d.im] for [[a,b],[c,d]]
 *  -- and a ket is four -- [a.re,a.im, b.re,b.im].  Everything below is built
 *  on those two conventions and nothing else; selfTest checks the arithmetic
 *  itself before it checks any physics done with it.
 * ========================================================================== */

/* ---- 2x2 complex matrices ------------------------------------------------ */
const M_I  = [1,0, 0,0, 0,0, 1,0];
const M_SX = [0,0, 1,0, 1,0, 0,0];
const M_SY = [0,0, 0,-1, 0,1, 0,0];
const M_SZ = [1,0, 0,0, 0,0, -1,0];
const PAULI = [M_SX, M_SY, M_SZ];

function mAdd(A, B){ const o = new Array(8); for (let i = 0; i < 8; i++) o[i] = A[i] + B[i]; return o; }

/* multiply by a complex scalar (x + iy) */
function mScaleC(A, x, y){
  const o = new Array(8);
  for (let i = 0; i < 8; i += 2){

    o[i + 1] = A[i] * y + A[i + 1] * x;

}

    let re = 0, im = 0;
    for (let k = 0; k < 2; k++){
      const ar = A[4 * r + 2 * k], ai = A[4 * r + 2 * k + 1];
      const br = B[4 * k + 2 * c], bi = B[4 * k + 2 * c + 1];

/* THE SIGN HERE WAS DERIVED, NOT CHOSEN.  With H = -mu.B and mu = gamma (hbar/2)

  /* the recorded box is the TEXT area only.  The key marks are strokes drawn by
     this function itself, and including them would make every legend report a
     curve running through it. */
  /* Record the WHOLE legend -- key marks included -- and note how many path
     vertices this function is about to contribute itself (one moveTo and one
     lineTo per entry).  Recording only the text box was too generous: a
     mutation sweep put the legend back on top of the curves in two views and
     the assertion stayed green, because the curves crossed the key column
     rather than the words. */
  let wmax = 0;
  for (const e of entries) wmax = Math.max(wmax, plain(e[1]).length * 6.2 + 34);
  LEGEND_BOXES.push({ x: align === 'right' ? x - 28 - wmax : x, y: y - 9,
                      w: wmax + 6, h: entries.length * 15 + 4, own: entries.length * 2 });
  ctx.save();
  ctx.font = '11px -apple-system, sans-serif'; ctx.textBaseline = 'middle';
  let yy = y;

/* Tick labels sized to the tick SPACING.  fmt(t,2) prints "318.00" whatever
   the range, and six of those do not fit in a 210 px panel -- the audit caught
   them overlapping each other, not the frame.  This prints only the digits the
   spacing actually distinguishes. */
function tickfmt(ticks){
  let step = Infinity;
  for (let i = 1; i < ticks.length; i++) step = Math.min(step, Math.abs(ticks[i] - ticks[i - 1]));
  if (!isFinite(step) || step <= 0) step = 1;

  const d = Math.max(0, (n || 3) - 1 - Math.floor(Math.log10(a)));

/* --------------------------------------------------------------------------
 *  Lay the stage out from the BOTTOM up.

 *  The caption and the footnote are wrapped text, so their height depends on
 *  the canvas width and cannot be a constant.  Guessing one put the caption
 *  UNDER the footnote at 520x340 and pushed both off a 340 px canvas -- found
 *  by the resize sweep, not by looking.  stage() measures both first and hands
 *  the plot whatever vertical space is left.
 * ------------------------------------------------------------------------ */

  const fl = footTxt ? wrapText(ctx, plain(footTxt), W - 40, FOOT_FONT).length : 0;
  const cl = capTxt  ? wrapText(ctx, plain(capTxt),  capW,  CAP_FONT).length  : 0;
  const footY = H - 8 - fl * 13;

/* ============================================================================

const VIEWS = [['sphere',   'the sphere'],

const DEFAULTS = {

  ph: 0.7854,               /* azimuth, rad      (45 deg) */
  chi: 0.0,                 /* GLOBAL phase -- deliberately does nothing */
  rlen: 1.0,                /* |r|: 1 on the surface, 0 at the centre */
  showCardinal: true, showGrid: true, showShadow: true,
  /* --- measurement --- */

    const c = Math.cos(st.chi), s = Math.sin(st.chi);
    return [ket[0]*c - ket[1]*s, ket[0]*s + ket[1]*c,

  M.ketPerp = ketOf(Math.PI - st.th, st.ph + Math.PI);

    { lab: '|0⟩',  r: [0, 0, 1] },   { lab: '|1⟩',  r: [0, 0, -1] },
    { lab: '|+⟩',  r: [1, 0, 0] },   { lab: '|−⟩',  r: [-1, 0, 0] },
    { lab: '|+i⟩', r: [0, 1, 0] },   { lab: '|−i⟩', r: [0, -1, 0] }];

  M.projIdem = mMaxAbsDiff(mMul(M.Pplus, M.Pplus), M.Pplus);

    const c = relaxClosed(M.rPure, st.T1, st.T2, st.req, t);

  {

/* ==========================================================================
 *  the Bloch sphere itself -- a shared 3-D renderer, used by four views
 * ======================================================================== */
const SPH_R = 1.0;

/* Painter's-algorithm wireframe.  The sphere is drawn as latitude and
   longitude circles split into far and near halves against the camera, so the
   far half can be dimmed -- without that the wireframe reads as flat and the
   state vector's depth is unreadable. */
function drawSphere(ctx, cam, B, cx, cy, pixR, o){
  o = o || {};
  /* pixR is the radius the AXES should occupy on screen.  Deriving the scale
     from the camera rather than hardcoding a divisor matters: the projected
     radius is f*R/dist, and f depends on the canvas height, so a fixed divisor
     that looks right at 820 px puts the sphere off the left edge at 430 px.
     The layout check found 117 labels outside the canvas that way. */
  const AXR = 1.68;
  const scale = pixR / (B.f * AXR / cam.dist);
  const P = (p) => {
    const q = project(cam, B, p);
    return q ? [cx + (q.x - cam.W / 2) * scale, cy + (q.y - cam.H / 2) * scale, q.z] : null;
  };
  const depth = (p) => (p[0] - B.eye[0]) * B.fwd[0] + (p[1] - B.eye[1]) * B.fwd[1]
                     + (p[2] - B.eye[2]) * B.fwd[2];
  const dTarget = depth([0, 0, 0]);
  const seg = (a, b, near, col, lw, dash) => {
    const A = P(a), Bp = P(b);
    if (!A || !Bp) return;
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(Bp[0], Bp[1]); ctx.stroke();
    ctx.setLineDash([]);
  };
  /* the disc, so the sphere reads as solid rather than as a cage */
  if (o.fill !== false){
    const c0 = P([0, 0, 0]);
    if (c0){
      const edge = P(v3.add([0, 0, 0], v3.mul(B.right, SPH_R)));
      const rr = edge ? Math.abs(edge[0] - c0[0]) : 60;
      ctx.fillStyle = 'rgba(20,26,40,0.55)';
      ctx.beginPath(); ctx.arc(c0[0], c0[1], rr, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#2b3346'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(c0[0], c0[1], rr, 0, TAU); ctx.stroke();
    }
  }
  if (o.grid !== false){
    const NL = 48;
    for (let k = 1; k <= 5; k++){                    /* latitudes */
      const th = Math.PI * k / 6, st_ = Math.sin(th), ct = Math.cos(th);
      for (let i = 0; i < NL; i++){
        const a = TAU * i / NL, b = TAU * (i + 1) / NL;
        const p = [st_ * Math.cos(a), st_ * Math.sin(a), ct];
        const q = [st_ * Math.cos(b), st_ * Math.sin(b), ct];
        const far = depth(p) > dTarget;
        seg(p, q, !far, far ? '#1d2330' : '#333c52', 1);
      }
    }
    for (let k = 0; k < 6; k++){                     /* longitudes */
      const ph = Math.PI * k / 6;
      for (let i = 0; i < NL; i++){
        const a = Math.PI * i / NL, b = Math.PI * (i + 1) / NL;
        const p = [Math.sin(a) * Math.cos(ph), Math.sin(a) * Math.sin(ph), Math.cos(a)];
        const q = [Math.sin(b) * Math.cos(ph), Math.sin(b) * Math.sin(ph), Math.cos(b)];
        const far = depth(p) > dTarget;
        seg(p, q, !far, far ? '#1d2330' : '#333c52', 1);
      }
    }
  }
  /* the three axes */
  const AX = [[[1,0,0], 'x', C_DIM], [[0,1,0], 'y', C_DIM], [[0,0,1], 'z', C_DIM]];
  for (const [a, lab, col] of AX){
    seg(v3.mul(a, -1.28), v3.mul(a, 1.28), true, '#3d465e', 1.2, [4, 3]);
    const t = pixR > 46 ? P(v3.mul(a, 1.62)) : null;
    if (t){ ctx.fillStyle = col; ctx.font = 'italic 12px Georgia, serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(lab, t[0], t[1]); }

function drawVec(ctx, S3, r, col, lw, lab){
  const A = S3.P([0, 0, 0]), Bp = S3.P(r);
  if (!A || !Bp) return;
  ctx.strokeStyle = col; ctx.lineWidth = lw || 2.6;
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(Bp[0], Bp[1]); ctx.stroke();

    ctx.fillStyle = col; ctx.font = 'italic 12px Georgia, serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';

    const q = S3.P(p);
    if (!q){ started = false; continue; }
    if (!started){ ctx.moveTo(q[0], q[1]); started = true; } else ctx.lineTo(q[0], q[1]);
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}
/* Labels are pushed AWAY from the sphere's centre in screen space rather than
   always upward.  Always-upward puts |0> directly under the z axis label, and
   on a 640x430 canvas the two collide -- caught by the layout check, invisible
   at the default size. */
function dot3(ctx, S3, p, col, r, lab){
  const q = S3.P(p);
  if (!q) return;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(q[0], q[1], r || 3.5, 0, TAU); ctx.fill();
  if (lab){
    const c = S3.P([0, 0, 0]);
    let ux = 0, uy = -1;
    if (c){
      const dx = q[0] - c[0], dy = q[1] - c[1], L = Math.hypot(dx, dy);
      if (L > 1e-6){ ux = dx / L; uy = dy / L; }
    }
    ctx.fillStyle = col; ctx.font = '10.5px -apple-system, sans-serif';
    ctx.textAlign = ux > 0.3 ? 'left' : (ux < -0.3 ? 'right' : 'center');
    ctx.textBaseline = uy > 0.3 ? 'top' : (uy < -0.3 ? 'bottom' : 'middle');
    ctx.fillText(plain(lab), q[0] + ux * 8, q[1] + uy * 8);
  }
}
/* render a 2x2 complex matrix as text, at (x,y).  Returns its height. */
function drawMatrix(ctx, x, y, Mx, title, col){
  ctx.save();
  ctx.font = '11px "SF Mono", ui-monospace, monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  if (title){ ctx.fillStyle = C_DIM; ctx.font = 'italic 12px Georgia, serif';
              ctx.fillText(plain(title), x, y); y += 17; }
  ctx.font = '11px "SF Mono", ui-monospace, monospace';
  const cell = (re, im) => {
    const s = (Math.abs(re) < 5e-4 ? '0' : re.toFixed(3))
            + (Math.abs(im) < 5e-4 ? '' : (im > 0 ? '+' : '−') + Math.abs(im).toFixed(3) + 'i');
    return s;
  };
  const rows = [[cell(Mx[0], Mx[1]), cell(Mx[2], Mx[3])],
                [cell(Mx[4], Mx[5]), cell(Mx[6], Mx[7])]];
  const w = 88;
  ctx.strokeStyle = '#3d465e'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + 5, y); ctx.lineTo(x, y); ctx.lineTo(x, y + 34); ctx.lineTo(x + 5, y + 34);
  ctx.moveTo(x + 2 * w + 3, y); ctx.lineTo(x + 2 * w + 8, y);
  ctx.lineTo(x + 2 * w + 8, y + 34); ctx.lineTo(x + 2 * w + 3, y + 34);
  ctx.stroke();
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++){
    ctx.fillStyle = col || C_TXT;
    ctx.fillText(rows[r][c], x + 8 + c * w, y + 3 + r * 17);
  }
  ctx.restore();
  return 40 + (title ? 17 : 0);
}

/* ==========================================================================
 *  view 1 -- the sphere
 * ======================================================================== */
function viewSphere(ctx, W, H, M, S){
  const st = M.st;
  const cap = 'A qubit\'s state is two complex numbers with a normalisation and an unobservable '
    + 'overall phase taken away, which leaves two real numbers — so it is a point on a sphere, '
    + 'not a vector in a plane. The angle is HALVED: θ = ' + sg(st.th * RAD, 4) + '° on the sphere '
    + 'is θ/2 = ' + sg(st.th * RAD / 2, 4) + '° in the amplitudes, which is why |0⟩ and |1⟩ are '
    + 'antipodal rather than perpendicular. Their overlap here is '
    + M.overlapPerp.toExponential(1) + '.';
  const foot = 'the global phase slider moves the ket and leaves the Bloch vector alone: '
    + 'measured displacement ' + M.phaseShift.toExponential(1) + ' — that is what projective means';
  const L = stage(ctx, W, H, cap, foot, Math.max(340, W - RO.w - 120));
  /* this view is one object, so centre it in the space the readout leaves
     rather than pinning it to the left margin with 350 px of nothing beside it */
  const avail = Math.max(240, W - RO.w - 130);
  const size = Math.min(L.plotH, avail);
  const cx = 66 + avail / 2, cy = L.top + L.plotH / 2;
  const cam = makeCamera(S.camTheta, S.camPhi, 5.2, [0, 0, 0]);
  cam.W = W; cam.H = H;
  const B = camBasis(cam);
  const pixR = size * 0.44;
  const S3 = drawSphere(ctx, cam, B, cx, cy, pixR, { grid: st.showGrid });
  /* the six labels need about 90 px of radius to sit apart from each other and
     from the axis letters; below that the dots go on without them rather than
     the labels going on top of one another */
  const roomForLabels = pixR > 90;
  if (st.showCardinal)
    for (const c of M.cardinal){
      /* a cardinal label is dropped when the state or its antipode is sitting
         on it -- at theta = 0 the state IS |0>, and two labels at one point is
         not a picture of anything */
      const near = (v) => (v[0]*c.r[0] + v[1]*c.r[1] + v[2]*c.r[2]) > 0.985;
      /* and a state pointing at or away from the camera projects onto the
         middle of the disc, where its label meets the axis letter */
      const q = S3.P(c.r), c0 = S3.P([0, 0, 0]);
      const edgeOn = !(q && c0) || Math.hypot(q[0] - c0[0], q[1] - c0[1]) < 0.5 * pixR;
      const clash = near(M.rPure) || near(M.antipode) || edgeOn;
      dot3(ctx, S3, c.r, '#5d6780', 3, (roomForLabels && !clash) ? c.lab : null);
    }
  /* the meridian and parallel through the state, so theta and phi are legible */
  if (st.showShadow){
    const mer = [], par = [];
    for (let i = 0; i <= 60; i++){
      mer.push(blochOfAngles(Math.PI * i / 60, st.ph));
      par.push(blochOfAngles(st.th, TAU * i / 60));
    }
    drawPath3(ctx, S3, mer, '#2f4a5c', 1.4, [4, 3]);
    drawPath3(ctx, S3, par, '#2f4a5c', 1.4, [4, 3]);
  }
  drawVec(ctx, S3, M.rPure, C_GREEN, 2.8, roomForLabels ? 'r' : null);
  dot3(ctx, S3, M.antipode, C_MAG, 4, roomForLabels ? 'orthogonal' : null);
  legend(ctx, 80, L.top + L.plotH - 52,
    [[C_GREEN, 'the state |ψ⟩', null], [C_MAG, 'the state orthogonal to it', null],
     ['#5d6780', 'the six cardinal states', null]]);
  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 2 -- projection versus identity
 * ======================================================================== */
function viewIdent(ctx, W, H, M, S){
  const st = M.st;
  const cap = 'Every qubit state is ρ = ½(𝟙 + r⃗·σ⃗). The identity half is the same for every state '
    + 'there is — it carries no information and fixes only Tr ρ = 1. Everything a qubit knows is in '
    + 'the vector multiplying the Pauli matrices. At |r| = ' + sg(st.rlen, 3) + ' the purity is '
    + sg(M.purity, 5) + ' and the entropy ' + sg(M.entropy, 4) + ' bits; ρ² − ρ has size '
    + M.isProjector.toExponential(1) + ', so this state '
    + (M.isProjector < 1e-9 ? 'IS a projector' : 'is NOT a projector — it is a mixture');
  const foot = 'purity = (1 + |r|²)/2 and the eigenvalues are (1 ± |r|)/2 — both exact, '
    + 'and both asserted against the matrix rather than against each other';
  const wTot = Math.max(320, W - RO.w - 120);
  const L = stage(ctx, W, H, cap, foot, wTot);
  /* left: the ball in cross-section, with the state at radius |r| */
  const bs = Math.min(L.plotH, 250);
  const cx = 90 + bs / 2, cy = L.top + bs / 2 + 10;
  ctx.save();
  ctx.strokeStyle = '#3d465e'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, bs / 2, 0, TAU); ctx.stroke();
  for (let k = 1; k <= 4; k++){
    ctx.strokeStyle = '#232a3a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, bs / 2 * k / 5, 0, TAU); ctx.stroke();
  }
  /* shade the interior by purity so "mixed" is visible rather than asserted */
  for (let k = 20; k >= 1; k--){
    const R = k / 20;
    ctx.fillStyle = 'rgba(184,236,76,' + (0.020 * purity(R)) + ')';
    ctx.beginPath(); ctx.arc(cx, cy, bs / 2 * R, 0, TAU); ctx.fill();
  }
  const ang = Math.atan2(M.rPure[1], M.rPure[0]);
  const px2 = cx + Math.cos(ang) * bs / 2 * st.rlen, py2 = cy - Math.sin(ang) * bs / 2 * st.rlen;
  ctx.strokeStyle = C_GREEN; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px2, py2); ctx.stroke();
  ctx.fillStyle = C_GREEN; ctx.beginPath(); ctx.arc(px2, py2, 4.5, 0, TAU); ctx.fill();
  ctx.fillStyle = C_CYAN; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, TAU); ctx.fill();
  ctx.font = '10.5px -apple-system, sans-serif'; ctx.fillStyle = C_DIM;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('𝟙/2 — maximally mixed', cx, cy + 8);
  ctx.textBaseline = 'bottom';
  ctx.fillText('pure states: the surface', cx, cy - bs / 2 - 6);
  ctx.restore();
  /* the matrices */
  let mx = 90 + bs + 46, my = L.top + 6;
  my += drawMatrix(ctx, mx, my, M.rho, 'ρ = ½(𝟙 + r·σ)', C_TXT) + 10;
  my += drawMatrix(ctx, mx, my, M.idPart, '½𝟙 — the same for every state', C_CYAN) + 10;
  my += drawMatrix(ctx, mx, my, M.projPart, '½ r·σ — the state itself', C_GREEN) + 10;
  /* right: purity, entropy and eigenvalues against |r| */
  const bx = mx + 252, bw = Math.max(120, wTot + 80 - (bx - 66));
  if (bw > 150){
    const b = box(bx, L.top + 12, bw, Math.max(120, L.plotH - 40));
    const yt = ticksN(0, 1, 5), xt = ticksN(0, 1, 5);
    axes(ctx, b, 0, 1, 0, 1.42, { xlab: '|r|', xticks: xt, yticks: yt,
      xfmt: tickfmt(xt), yfmt: tickfmt(yt), title: 'what |r| decides' });
    pl(ctx, b, M.purCurve, 0, 1, 0, 1.42, C_GREEN, 2.2);
    pl(ctx, b, M.entCurve, 0, 1, 0, 1.42, C_ORANGE, 2.0, [6, 4]);
    pl(ctx, b, M.eigCurve.map(q => [q[0], q[1]]), 0, 1, 0, 1.42, C_CYAN, 1.6);
    pl(ctx, b, M.eigCurve.map(q => [q[0], q[2]]), 0, 1, 0, 1.42, C_CYAN, 1.6);
    clipTo(ctx, b, () => {
      const X = px(b, st.rlen, 0, 1);
      ctx.strokeStyle = C_MAG; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(X, b.y); ctx.lineTo(X, b.y1); ctx.stroke(); ctx.setLineDash([]);
    });
    legend(ctx, b.x + 10, b.y + 12,
      [[C_GREEN, 'purity Tr ρ²', null], [C_ORANGE, 'entropy (bits)', [6, 4]],
       [C_CYAN, 'eigenvalues of ρ', null]]);
  }
  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 3 -- measurement
 * ======================================================================== */
function viewMeasure(ctx, W, H, M, S){
  const st = M.st;
  const cap = 'A projective measurement asks one yes/no question, and the two answers resolve the '
    + 'identity: P₊ + P₋ = 𝟙 to ' + M.resolveId.toExponential(1) + ', with P² = P to '
    + M.projIdem.toExponential(1) + '. The probability is ½(1 + r⃗·n̂) = cos²(Θ/2) with Θ = '
    + sg(M.betweenAngle * RAD, 4) + '° the angle BETWEEN the two directions on the sphere — '
    + 'p₊ = ' + sg(M.pPlus, 5) + '. ' + st.nShots + ' shots gave ' + M.shots.up + ' ('
    + sg(M.shots.frac, 4) + ' against ' + sg(M.pPlus, 4) + ' ± ' + sg(M.shotErr, 2) + ').';
  const foot = 'the half-angle is the whole difference between a spin and a polariser: '
    + 'a photon through crossed polarisers obeys cos²Θ, a spin-½ obeys cos²(Θ/2)';
  const wTot = Math.max(320, W - RO.w - 120);
  const L = stage(ctx, W, H, cap, foot, wTot);
  const size = Math.min(L.plotH, 260);
  const cx = 78 + size / 2, cy = L.top + size / 2;
  const cam = makeCamera(S.camTheta, S.camPhi, 5.2, [0, 0, 0]); cam.W = W; cam.H = H;
  const B = camBasis(cam);
  const pixR = size * 0.44, lab3 = pixR > 90;
  const S3 = drawSphere(ctx, cam, B, cx, cy, pixR, {});
  drawVec(ctx, S3, M.rPure, C_GREEN, 2.6, lab3 ? 'r' : null);
  drawVec(ctx, S3, M.n, C_ORANGE, 2.4, lab3 ? 'n' : null);
  dot3(ctx, S3, [-M.n[0], -M.n[1], -M.n[2]], '#7a4a2a', 3.2);
  legend(ctx, 74, L.top + size + 4,
    [[C_GREEN, 'the state', null], [C_ORANGE, 'the measurement axis', null]]);
  /* Malus */
  const bx = 78 + size + 44;
  const bw = Math.max(140, 66 + wTot - bx + (st.showCascade ? -180 : 0));
  if (bw > 150 && st.showMalus){
    /* the panel is shortened deliberately to leave room for the shot strip
       below it -- the strip is the only place nShots and seed are visible, and
       drawing it "if there is room" meant it was never drawn at all */
    const b = box(bx, L.top + 12, bw, Math.max(90, L.plotH - 104));
    const xt = ticksN(0, 180, 5), yt = ticksN(0, 1, 5);
    /* headroom, and the legend at the top.  The obvious empty corner is the
       top RIGHT -- and it is not empty: cos^2(Theta) comes back UP to 1 at
       180 degrees, so the polariser curve ends exactly there. */
    /* one constant, used by the axis AND by everything drawn on it -- writing
       the number four times means a change to the axis leaves the curves where
       they were, which is how a mutant that "removed the headroom" removed
       nothing at all */
    const MHI = 1.45;
    axes(ctx, b, 0, 180, 0, MHI, { xlab: 'angle between r and n  (°)', xticks: xt, yticks: yt,
      xfmt: tickfmt(xt), yfmt: tickfmt(yt), title: 'the half-angle' });
    pl(ctx, b, M.malus, 0, 180, 0, MHI, C_GREEN, 2.2);
    pl(ctx, b, M.malusPhoton, 0, 180, 0, MHI, '#4a5165', 1.8, [6, 4]);
    dot(ctx, b, M.betweenAngle * RAD, M.pPlus, 0, 180, 0, MHI, C_MAG, 4.5);
    /* both curves start at 1 on the left and fall to 0 on the right, so the
       bottom-LEFT corner is full and the top-RIGHT is empty */
    legend(ctx, b.x + 10, b.y + 12,
      [[C_GREEN, 'spin-½: cos²(Θ/2)', null], ['#4a5165', 'a polariser: cos²Θ', [6, 4]]]);
  }
  /* the shot tally.  Without this, nShots and seed are computed and thrown away
     -- the UI sweep caught them as sliders that move nothing, which they were. */
  if (st.showMalus && bw > 150){
    const sy = L.top + 12 + Math.max(90, L.plotH - 104) + 52;
    const runN = Math.min(M.shots.run.length, Math.floor(bw / 5));
    ctx.save();
    ctx.font = '10px -apple-system, sans-serif'; ctx.fillStyle = C_DIM;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    if (sy + 22 < L.capY - 2){
      ctx.fillText(plain('the first ' + runN + ' shots  (up = +, down = \u2212)'), bx, sy - 13);
      /* the outcome is up or down, not green or grey.  Colour alone is invisible
         to the display-list harness -- and to anyone reading it in greyscale. */
      const mid = sy + 10;
      ctx.strokeStyle = '#2b3346'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(bx, mid); ctx.lineTo(bx + runN * 5, mid); ctx.stroke();
      for (let i = 0; i < runN; i++){
        ctx.fillStyle = M.shots.run[i] ? C_GREEN : C_ORANGE;
        if (M.shots.run[i]) ctx.fillRect(bx + i * 5, mid - 9, 4, 9);
        else                ctx.fillRect(bx + i * 5, mid + 1, 4, 9);
      }
    }
    ctx.restore();
  }
  /* the cascade */
  if (st.showCascade && bw > 150){
    const gx = bx + bw + 26, gw = 66 + wTot - gx;
    if (gw > 120){
      const g = box(gx, L.top + 12, gw, Math.max(80, L.plotH - 104));
      axes(ctx, g, 0, 3, 0, 1, { xticks: [], yticks: ticksN(0, 1, 3),
        yfmt: tickfmt(ticksN(0, 1, 3)), title: 'three magnets in a row' });
      const bars = [['z', M.cascade.pz], ['n', M.cascade.p2], ['z again', M.cascade.p3]];
      bars.forEach(([lab, p], i) => {
        const xc = px(g, i + 0.5, 0, 3), bwid = Math.min(34, g.w / 3 * 0.5);
        const y0 = py(g, 0, 0, 1), y1 = py(g, p, 0, 1);
        ctx.fillStyle = i === 2 ? 'rgba(205,53,196,0.5)' : 'rgba(90,200,224,0.4)';
        ctx.fillRect(xc - bwid / 2, y1, bwid, y0 - y1);
        ctx.fillStyle = C_DIM; ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(plain(lab), xc, g.y1 + 5);
        /* inside the bar, not above it: a bar at p = 1 reaches the top of the
           box and its label then lands on the panel title */
        /* sg() would render a probability of 1.35e-11 in full, three of them
           side by side, and they collide.  Below a part in ten thousand the
           honest short answer is 0; the readout carries the exact figure.
           And the label goes INSIDE a tall bar and ABOVE a short one -- a
           zero-height bar labelled inside sits on the axis labels. */
        const txt = p < 1e-4 ? '0' : sg(p, 3);
        if (y0 - y1 > 22){ ctx.textBaseline = 'top';    ctx.fillText(txt, xc, y1 + 3); }
        else             { ctx.textBaseline = 'bottom'; ctx.fillText(txt, xc, y1 - 4); }
      });
    }
  }
  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 4 -- precession
 * ======================================================================== */
function viewPrecess(ctx, W, H, M, S){
  const st = M.st;
  const cap = 'A magnetic moment in a field does not line up with it, it goes round it: '
    + 'dr⃗/dt = −γ B⃗ × r⃗, at ' + sg(M.fLarmor, 7) + ' MHz for a ' + M.sp.name + ' in '
    + sg(st.Btesla, 3) + ' T — one turn every ' + sg(M.period * 1e9, 4) + ' ns. Add a drive at '
    + 'that frequency and, in the frame that turns with it, the vector simply rotates about a '
    + 'tilted axis: the Rabi flop is complete only on resonance, and off it the population never '
    + 'exceeds ' + sg(M.rabiCap, 4) + '.';
  const foot = 'γ/2π from CODATA 2022 · the sign of the precession was derived by integrating the '
    + 'Schrödinger equation and reading the azimuth, not chosen';
  const wTot = Math.max(320, W - RO.w - 120);
  const L = stage(ctx, W, H, cap, foot, wTot);
  const size = Math.min(L.plotH, 250);
  const cx = 78 + size / 2, cy = L.top + size / 2;
  const cam = makeCamera(S.camTheta, S.camPhi, 5.2, [0, 0, 0]); cam.W = W; cam.H = H;
  const B = camBasis(cam);
  const pixR = size * 0.44, lab3 = pixR > 90;
  const S3 = drawSphere(ctx, cam, B, cx, cy, pixR, {});
  drawPath3(ctx, S3, M.track, C_CYAN, 1.8);
  drawVec(ctx, S3, M.rPure, C_GREEN, 2.6, lab3 ? 'r' : null);
  drawVec(ctx, S3, [0, 0, 1.25], C_ORANGE, 2.0, lab3 ? 'B' : null);
  drawPath3(ctx, S3, M.rabiPath, C_MAG, 1.6, [5, 4]);
  /* below the sphere, not over it: the precession track is a wide ellipse that
     crosses the top-left corner at almost every camera angle */
  legend(ctx, 74, L.top + size + 4,
    [[C_CYAN, 'free precession about B', null], [C_MAG, 'driven, rotating frame', [5, 4]]]);
  const bx = 78 + size + 44, bw = Math.max(140, 66 + wTot - bx);
  if (bw > 160){
    const hh = Math.max(80, (L.plotH - 74) / 2);
    const b = box(bx, L.top + 12, bw, hh);
    const xt = ticksN(0, st.tau, 5), yt = ticksN(0, 1, 5);
    /* headroom above 1: the flop fills the whole box, so a legend inside it is
       crossed wherever it goes.  Give the axis a quarter more range and put the
       legend in the strip the curve cannot reach. */
    axes(ctx, b, 0, st.tau, 0, 1.34, { xticks: xt, yticks: yt, xfmt: tickfmt(xt), yfmt: tickfmt(yt),
      title: 'population of |1⟩' });
    pl(ctx, b, M.rabi, 0, st.tau, 0, 1.34, C_GREEN, 2.0);
    if (st.showDetuned) pl(ctx, b, M.rabiDet, 0, st.tau, 0, 1.34, C_MAG, 2.0, [6, 4]);
    clipTo(ctx, b, () => {
      const Y = py(b, M.rabiCap, 0, 1.34);
      ctx.strokeStyle = '#4a5165'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x, Y); ctx.lineTo(b.x1, Y); ctx.stroke(); ctx.setLineDash([]);
    });
    /* at Delta = 0 the "detuned" curve IS the resonant one, and a legend that
       says otherwise is claiming the picture shows two things when it shows one */
    legend(ctx, b.x + 10, b.y + 12, Math.abs(st.Delta) < 1e-9
      ? [[C_GREEN, 'on resonance', null],
         [C_MAG, 'detuned — Δ is zero, so it is the same curve', [6, 4]]]
      : [[C_GREEN, 'on resonance', null], [C_MAG, 'detuned Δ = ' + sg(st.Delta, 3), [6, 4]]]);
    const b2 = box(bx, b.y1 + 60, bw, hh);
    const xt2 = ticksN(-4 * st.Omega, 4 * st.Omega, 5);
    axes(ctx, b2, -4 * st.Omega, 4 * st.Omega, 0, 1.05,
      { xlab: 'detuning Δ', xticks: xt2, yticks: ticksN(0, 1, 3),
        xfmt: tickfmt(xt2), yfmt: tickfmt(ticksN(0, 1, 3)), title: 'how far off you can be' });
    pl(ctx, b2, M.lorentz, -4 * st.Omega, 4 * st.Omega, 0, 1.05, C_ORANGE, 2.0);
    dot(ctx, b2, st.Delta, M.rabiCap, -4 * st.Omega, 4 * st.Omega, 0, 1.05, C_MAG, 4);
  }
  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 5 -- decoherence
 * ======================================================================== */
function viewDecohere(ctx, W, H, M, S){
  const st = M.st;
  const cap = 'Relaxation is the Bloch vector leaving the surface. The transverse part dies at '
    + '1/T₂ and the longitudinal part crawls to its thermal value at 1/T₁, so a pure state spirals '
    + 'into the ball and its purity falls from 1 toward ½. T₂ ≤ 2T₁ is not a rule of thumb: past '
    + 'it the map stops being completely positive. Here T₂/T₁ = ' + sg(st.T2 / st.T1, 4)
    + ' and the smallest Choi eigenvalue anywhere on the path is ' + M.choiWorst.toExponential(2)
    + ' — ' + (M.cpOK ? 'still a legal quantum channel' : 'NEGATIVE: this is not a physical process');
  const foot = 'the Choi eigenvalues are (1 + e^{−t/T₁} ± 2e^{−t/T₂})/2 and (1 − e^{−t/T₁})/2, '
    + 'checked against a numerically-built Choi matrix';
  const wTot = Math.max(320, W - RO.w - 120);
  const L = stage(ctx, W, H, cap, foot, wTot);
  const size = Math.min(L.plotH, 250);
  const cx = 78 + size / 2, cy = L.top + size / 2;
  const cam = makeCamera(S.camTheta, S.camPhi, 5.2, [0, 0, 0]); cam.W = W; cam.H = H;
  const B = camBasis(cam);
  const pixR = size * 0.44, lab3 = pixR > 90;
  const S3 = drawSphere(ctx, cam, B, cx, cy, pixR, {});
  drawPath3(ctx, S3, M.relax, C_MAG, 1.6);
  drawVec(ctx, S3, M.rPure, '#4a5165', 1.8);
  drawVec(ctx, S3, M.relaxEnd, C_GREEN, 2.6, lab3 ? 'r(t)' : null);
  legend(ctx, 74, L.top + size + 4,
    [['#4a5165', 'where it started', null], [C_MAG, 'the path into the ball', null]]);
  const bx = 78 + size + 44, bw = Math.max(140, 66 + wTot - bx);
  if (bw > 160){
    const hh = Math.max(80, (L.plotH - 74) / 2);
    const b = box(bx, L.top + 12, bw, hh);
    const xt = ticksN(0, st.tmax, 5), yt = ticksN(0, 1, 5);
    axes(ctx, b, 0, st.tmax, 0, 1.38, { xticks: xt, yticks: yt, xfmt: tickfmt(xt), yfmt: tickfmt(yt),
      title: 'purity and |r|' });
    pl(ctx, b, M.relaxPur.map(q => [q[0], q[1]]), 0, st.tmax, 0, 1.38, C_GREEN, 2.0);
    pl(ctx, b, M.relaxPur.map(q => [q[0], q[2]]), 0, st.tmax, 0, 1.38, C_CYAN, 1.8, [6, 4]);
    clipTo(ctx, b, () => {
      const Y = py(b, 0.5, 0, 1.38);
      ctx.strokeStyle = '#4a5165'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x, Y); ctx.lineTo(b.x1, Y); ctx.stroke(); ctx.setLineDash([]);
    });
    legend(ctx, b.x + 10, b.y + 12, [[C_GREEN, 'purity', null], [C_CYAN, '|r|', [6, 4]]]);
    const b2 = box(bx, b.y1 + 60, bw, hh);
    const ys = M.cpCurve.map(q => q[1]);
    const lo = Math.min(-0.02, Math.min(...ys)), hi = Math.max(...ys) * 1.1 + 1e-6;
    const xt2 = ticksN(0.2, 3, 5), yt2 = ticksN(lo, hi, 4);
    axes(ctx, b2, 0.2, 3, lo, hi, { xlab: 'T₂ / T₁', xticks: xt2, yticks: yt2,
      xfmt: tickfmt(xt2), yfmt: tickfmt(yt2), title: 'where the channel stops being physical' });
    clipTo(ctx, b2, () => {
      const Y = py(b2, 0, lo, hi);
      ctx.fillStyle = 'rgba(232,132,58,0.10)';
      ctx.fillRect(px(b2, 2, 0.2, 3), b2.y, b2.x1 - px(b2, 2, 0.2, 3), b2.y1 - b2.y);
      ctx.strokeStyle = '#4a5165'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b2.x, Y); ctx.lineTo(b2.x1, Y); ctx.stroke(); ctx.setLineDash([]);
    });
    pl(ctx, b2, M.cpCurve, 0.2, 3, lo, hi, C_ORANGE, 2.0);
    dot(ctx, b2, st.T2 / st.T1, M.choiWorst, 0.2, 3, lo, hi, C_MAG, 4.5);
    ctx.fillStyle = '#8b6a3a'; ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('not completely positive', px(b2, 2.05, 0.2, 3), b2.y + 5);
  }
  drawStage(ctx, W, H, L);
}

/* ==========================================================================
 *  view 6 -- the double cover
 * ======================================================================== */
function viewCover(ctx, W, H, M, S){
  const st = M.st;
  const cap = 'Turn the state by ' + sg(st.turn, 3) + 'π about z. The Bloch vector has moved by '
    + sg(M.rMoved, 3) + ' and comes back after 2π — but the KET does not: U(2π) = −𝟙, and it takes '
    + '4π to return. Here ⟨ψ|U|ψ⟩ = ' + sg(M.ketPhaseArg / Math.PI, 4) + 'π in phase. The sphere '
    + 'is the space of states; the ket lives one dimension higher, on a circle above each point, '
    + 'and that circle is exactly the global phase the sphere threw away.';
  const foot = 'the geometric phase is −½ the enclosed solid angle: '
    + 'computed as a product of overlaps (' + sg(M.berry, 6) + ') against −Ω/2 ('
    + sg(M.berryClosed, 6) + '), agreeing to ' + M.berryDiff.toExponential(1);
  const wTot = Math.max(320, W - RO.w - 120);
  const L = stage(ctx, W, H, cap, foot, wTot);
  const size = Math.min(L.plotH, 240);
  const cx = 78 + size / 2, cy = L.top + size / 2;
  const cam = makeCamera(S.camTheta, S.camPhi, 5.2, [0, 0, 0]); cam.W = W; cam.H = H;
  const B = camBasis(cam);
  const pixR = size * 0.44, lab3 = pixR > 90;
  const S3 = drawSphere(ctx, cam, B, cx, cy, pixR, {});
  /* the cap the loop encloses, shaded, so "solid angle" is a picture */
  clipTo(ctx, box(cx - size, cy - size, 2 * size, 2 * size), () => {
    ctx.fillStyle = 'rgba(90,200,224,0.10)';
    ctx.beginPath();
    let started = false;
    for (const p of M.loop){
      const q = S3.P(p);
      if (!q){ started = false; continue; }
      if (!started){ ctx.moveTo(q[0], q[1]); started = true; } else ctx.lineTo(q[0], q[1]);
    }
    ctx.closePath(); ctx.fill();
  });
  drawPath3(ctx, S3, M.loop, C_CYAN, 2.0);
  drawVec(ctx, S3, M.rTurned, C_GREEN, 2.6, lab3 ? 'r' : null);
  drawVec(ctx, S3, M.rPure, '#4a5165', 1.6);
  legend(ctx, 74, L.top + size + 4,
    [[C_CYAN, 'the transport loop', null], [C_GREEN, 'the turned state', null]]);
  const bx = 78 + size + 44, bw = Math.max(140, 66 + wTot - bx);
  if (bw > 160){
    const hh = Math.max(80, (L.plotH - 74) / 2);
    const b = box(bx, L.top + 12, bw, hh);
    const xt = ticksN(0, 4, 5), yt = ticksN(-1, 1, 5);
    axes(ctx, b, 0, 4, -1.08, 1.72, { xlab: 'rotation  (units of π)', xticks: xt, yticks: yt,
      xfmt: tickfmt(xt), yfmt: tickfmt(yt), title: 'the vector returns at 2π, the ket at 4π' });
    pl(ctx, b, M.coverVec, 0, 4, -1.08, 1.72, C_CYAN, 2.0);
    pl(ctx, b, M.coverKet, 0, 4, -1.08, 1.72, C_GREEN, 2.2);
    clipTo(ctx, b, () => {
      for (const x of [2, 4]){
        const X = px(b, x, 0, 4);
        ctx.strokeStyle = '#3d465e'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(X, b.y); ctx.lineTo(X, b.y1); ctx.stroke(); ctx.setLineDash([]);
      }
      const X = px(b, st.turn, 0, 4);
      ctx.strokeStyle = C_MAG; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(X, b.y); ctx.lineTo(X, b.y1); ctx.stroke();
    });
    legend(ctx, b.x + 10, b.y + 12,
      [[C_CYAN, 'r_x, the Bloch vector', null], [C_GREEN, 'Re⟨ψ|U|ψ⟩, the ket', null]]);
    const b2 = box(bx, b.y1 + 60, bw, hh);
    const xt2 = ticksN(0, 4 * Math.PI, 5), yt2 = ticksN(-2 * Math.PI, 0, 4);
    axes(ctx, b2, 0, 4 * Math.PI, -2 * Math.PI, 0.2,
      { xlab: 'solid angle enclosed  (sr)', xticks: xt2, yticks: yt2,
        xfmt: tickfmt(xt2), yfmt: tickfmt(yt2), title: 'geometric phase = −Ω/2' });
    pl(ctx, b2, M.berryCurve, 0, 4 * Math.PI, -2 * Math.PI, 0.2, C_ORANGE, 2.0);
    dot(ctx, b2, M.solidAngle, M.berryClosed, 0, 4 * Math.PI, -2 * Math.PI, 0.2, C_MAG, 4.5);
  }
  drawStage(ctx, W, H, L);
}

/* ========================================================================== */
function drawView(ctx, W, H, M, S){
  LEGEND_BOXES = [];
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#070b18'; ctx.fillRect(0, 0, W, H);
  const f = { sphere: viewSphere, ident: viewIdent, measure: viewMeasure,
              precess: viewPrecess, decohere: viewDecohere, cover: viewCover }[M.view];
  if (f) f(ctx, W, H, M, S);
}

/* ============================================================================
 *  readout, equation bar, captions, the panel, and boot
 * ========================================================================== */
function cnum(re, im){
  const a = Math.abs(re) < 5e-5 ? '0' : re.toFixed(4);
  if (Math.abs(im) < 5e-5) return a;
  return a + (im > 0 ? ' + ' : ' &minus; ') + Math.abs(im).toFixed(4) + 'i';
}
function readoutHTML(M){
  const st = M.st, v = st.view;
  const row = (a, b, c) => '<tr><td>' + a + '</td><td class="v' + (c ? ' ' + c : '') + '">' + b + '</td></tr>';
  const hd  = (t) => '<tr><td class="hd" colspan="2">' + t + '</td></tr>';
  let name = '', sub = '', body = '', note = '';

  if (v === 'sphere' || v === 'ident'){
    name = (v === 'sphere') ? 'the sphere' : 'projection vs identity';
    sub = '&theta; = ' + sg(st.th * RAD, 4) + '&deg;, &phi; = ' + sg(st.ph * RAD, 4) + '&deg;';
    body = hd('the ket')
      + row('amplitude of |0&rang;', cnum(M.ketPhased[0], M.ketPhased[1]))
      + row('amplitude of |1&rang;', cnum(M.ketPhased[2], M.ketPhased[3]))
      + row('cos(&theta;/2)', sg(Math.cos(st.th / 2), 6))
      + row('norm', sg(ketNorm(M.ketPhased), 8))
      + row('global phase &chi;', sg(st.chi * RAD, 4) + '&deg;')
      + row('&nbsp;&nbsp;moved the Bloch vector by', M.phaseShift.toExponential(1), 'good')
      + hd('the Bloch vector')
      + row('r&#8339;', sg(M.r[0], 6)) + row('r&#8342;', sg(M.r[1], 6)) + row('r&#8354;', sg(M.r[2], 6))
      + row('|r|', sg(M.rlen, 6))
      + hd('&rho; = &frac12;(&#120793; + r&middot;&sigma;)')
      + row('Tr &rho;', sg(M.traceRho[0], 8))
      + row('Tr &rho;&sup2;  (purity)', sg(M.purity, 6))
      + row('eigenvalues', sg(M.eigs[0], 5) + ',  ' + sg(M.eigs[1], 5))
      + row('von Neumann entropy', sg(M.entropy, 5) + ' bits')
      + row('|&rho;&sup2; &minus; &rho;|', M.isProjector.toExponential(1),
            M.isProjector < 1e-9 ? 'good' : 'bad')
      + hd('the orthogonal state')
      + row('&lang;&psi;|&psi;&perp;&rang;', M.overlapPerp.toExponential(1), 'good')
      + row('r&middot;r&perp;', sg(-1, 3))
      + row('angle between them', '180&deg;');
    note = '<p class="note">The identity half of &rho; is the same for every state a qubit can be '
         + 'in. It fixes the trace and carries nothing else. Everything the state knows is the '
         + 'three real numbers multiplying the Pauli matrices &mdash; which is why the space of '
         + 'states is a ball and not a Hilbert space you can see.</p>';

  } else if (v === 'measure'){
    name = 'measurement';
    sub = 'along n̂ at ' + sg(st.mth * RAD, 4) + '&deg;, ' + sg(st.mph * RAD, 4) + '&deg;';
    body = hd('the two operators')
      + row('P&#8330; + P&#8331; &minus; &#120793;', M.resolveId.toExponential(1), 'good')
      + row('|P&sup2; &minus; P|', M.projIdem.toExponential(1), 'good')
      + row('Tr P&#8330;', '1')
      + hd('the Born rule')
      + row('angle between r and n', sg(M.betweenAngle * RAD, 5) + '&deg;')
      + row('r&middot;n', sg(M.cosTheta, 6))
      + row('p&#8330; = &frac12;(1 + r&middot;n)', sg(M.pPlus, 6), 'good')
      + row('&nbsp;&nbsp;= cos&sup2;(&Theta;/2)', sg(Math.pow(Math.cos(M.betweenAngle / 2), 2), 6))
      + row('a polariser would give cos&sup2;&Theta;', sg(M.cosTheta * M.cosTheta, 6), 'bad')
      + row('p&#8331;', sg(M.pMinus, 6))
      + hd('shots')
      + row('trials', String(M.shots.n))
      + row('came out +', String(M.shots.up))
      + row('fraction', sg(M.shots.frac, 5))
      + row('expected', sg(M.pPlus, 5) + ' &plusmn; ' + sg(M.shotErr, 2))
      + row('discrepancy', sg((M.shots.frac - M.pPlus) / Math.max(M.shotErr, 1e-12), 3) + ' &sigma;')
      + hd('three magnets in a row')
      + row('through the first (z)', sg(M.cascade.pz, 5))
      + row('then through n', sg(M.cascade.p2, 5))
      + row('then z again', sg(M.cascade.p3, 5), M.cascade.recovered ? 'bad' : '')
      + row('all three', sg(M.cascade.through, 5));
    note = '<p class="note">The third magnet is the point of the cascade: after the first two, a '
         + 'beam that was purely |0&rang; comes out of the z magnet split again. The middle '
         + 'measurement did not filter the beam, it <b>remade</b> it &mdash; unless n is along z, '
         + 'in which case nothing happens at all.</p>';

  } else if (v === 'precess'){
    name = 'precession';
    sub = M.sp.name + ' in ' + sg(st.Btesla, 4) + ' T';
    body = hd('Larmor')
      + row('&gamma;/2&pi;', sg(M.sp.gam, 11) + ' MHz/T')
      + row('&nbsp;&nbsp;CODATA uncertainty', '&plusmn;' + M.sp.u)
      + row('frequency', sg(M.fLarmor, 8) + ' MHz')
      + row('period', sg(M.period * 1e9, 6) + ' ns')
      + row('angular rate', sg(M.omegaLarmor, 6) + ' rad/s')
      + hd('the electron&rsquo;s anomaly')
      + row('g/2 measured', sg(M.gOver2, 15))
      + row('a&#8337; = g/2 &minus; 1', CODATA.a_e.v.toExponential(11))
      + row('Schwinger &alpha;/2&pi;', M.schwinger.toExponential(11))
      + row('one loop is high by', sg(100 * M.schwingerErr, 4) + '%', 'good')
      + hd('driving it')
      + row('&Omega;', sg(st.Omega, 5))
      + row('&Delta;', sg(st.Delta, 5))
      + row('&Omega;&#8341; = &radic;(&Omega;&sup2;+&Delta;&sup2;)', sg(M.rabiOR, 6))
      + row('largest population reached', sg(M.rabiCap, 6), M.rabiCap > 0.999 ? 'good' : 'bad')
      + row('&pi; pulse takes', sg(M.piTime, 5) + ' / &Omega;');
    note = '<p class="note">A proton in a 1.5 T scanner precesses at 63.87 MHz, which is why MRI '
         + 'is done with a radio transmitter. The value used in practice is the <b>shielded</b> '
         + 'one &mdash; a proton inside a water molecule sees 25.7 ppm less field than the bare '
         + 'number, because its own electrons screen it.</p>';

  } else if (v === 'decohere'){
    name = 'decoherence';
    sub = 'T&#8321; = ' + sg(st.T1, 4) + ', T&#8322; = ' + sg(st.T2, 4);
    body = hd('the two times')
      + row('T&#8321;  (longitudinal)', sg(st.T1, 5))
      + row('T&#8322;  (transverse)', sg(st.T2, 5))
      + row('T&#8322;/T&#8321;', sg(st.T2 / st.T1, 5), st.T2 <= 2 * st.T1 ? 'good' : 'bad')
      + row('the limit', '2 T&#8321; = ' + sg(M.t2Limit, 4))
      + hd('is it a legal channel?')
      + row('smallest Choi eigenvalue', M.choiWorst.toExponential(3), M.cpOK ? 'good' : 'bad')
      + row('&nbsp;&nbsp;at t =', sg(M.choiAt, 4))
      + row('completely positive', M.cpOK ? 'yes' : '<b>no</b>', M.cpOK ? 'good' : 'bad')
      + hd('where it ended up')
      + row('r&#8354;(t)', sg(M.relaxEnd[2], 6))
      + row('|r|(t)', sg(Math.hypot(M.relaxEnd[0], M.relaxEnd[1], M.relaxEnd[2]), 6))
      + row('purity', sg(purity(Math.hypot(M.relaxEnd[0], M.relaxEnd[1], M.relaxEnd[2])), 6))
      + row('thermal r&#8354;', sg(st.req, 4));
    note = '<p class="note">T&#8322; &le; 2T&#8321; is not a convention. Past it the map takes some '
         + 'legitimate input to a matrix with a negative eigenvalue, which is not a state; the '
         + 'Choi eigenvalue in this panel is that statement made arithmetic.</p>';

  } else {
    name = 'the double cover';
    sub = 'turned by ' + sg(st.turn, 4) + '&pi;';
    body = hd('what the rotation did')
      + row('|U &minus; &#120793;|', M.UvsI.toExponential(2))
      + row('|U + &#120793;|', M.UvsmI.toExponential(2))
      + row('Bloch vector moved by', sg(M.rMoved, 6))
      + row('&lang;&psi;|U|&psi;&rang; phase', sg(M.ketPhaseArg / Math.PI, 5) + '&pi;')
      + row('|&lang;&psi;|U|&psi;&rang;|', sg(M.ketOverlap, 6))
      + hd('the geometric phase')
      + row('cone half-angle', sg(st.cone * RAD, 5) + '&deg;')
      + row('solid angle &Omega;', sg(M.solidAngle, 6) + ' sr')
      + row('&minus;&Omega;/2', sg(M.berryClosed, 8))
      + row('product of overlaps', sg(M.berry, 8))
      + row('difference', M.berryDiff.toExponential(2), 'good')
      + hd('why the sphere is smaller than the ket')
      + row('states in a qubit', '2 complex = 4 real')
      + row('&minus; normalisation', '3')
      + row('&minus; global phase', '2  &rarr; a sphere');
    note = '<p class="note">A 2&pi; rotation sends |&psi;&rang; to &minus;|&psi;&rang;. On its own '
         + 'that is unobservable &mdash; which is exactly why the Bloch sphere can ignore it. Put '
         + 'the rotated half in a superposition with an unrotated half and the sign is a phase '
         + 'difference, and it has been seen with neutrons.</p>';
  }
  return '<div class="rname">' + name + '<small>' + sub + '</small></div>'
       + '<table>' + body + '</table>' + note;
}

function eqbarText(M){
  const v = M.view;
  if (v === 'sphere') return ['|&psi;&rang; = cos(&theta;/2)|0&rang; + e<sup>i&phi;</sup> sin(&theta;/2)|1&rang;'
    + ',&nbsp;&nbsp; r&#770; = (sin&theta;cos&phi;, sin&theta;sin&phi;, cos&theta;)',
    'Two complex amplitudes, minus a normalisation, minus a phase nobody can measure, leaves two angles.'];
  if (v === 'ident') return ['&rho; = &frac12;(&#120793; + r&middot;&sigma;),'
    + '&nbsp;&nbsp; Tr&rho;&sup2; = &frac12;(1 + |r|&sup2;),&nbsp;&nbsp; eig&rho; = (1 &plusmn; |r|)/2',
    'The identity part is the same for every state there is; the state is the vector multiplying the Pauli matrices.'];
  if (v === 'measure') return ['P&#8330; = &frac12;(&#120793; + n&middot;&sigma;),'
    + '&nbsp;&nbsp; P&#8330; + P&#8331; = &#120793;,&nbsp;&nbsp; p&#8330; = Tr(&rho;P&#8330;) = &frac12;(1 + r&middot;n) = cos&sup2;(&Theta;/2)',
    'Two projectors that sum to the identity: that is what having outcomes means, and the half-angle is what makes a spin not a polariser.'];
  if (v === 'precess') return ['dr&#8407;/dt = &minus;&gamma; B&#8407; &times; r&#8407;,'
    + '&nbsp;&nbsp; P&#8321;(t) = (&Omega;&sup2;/&Omega;&#8341;&sup2;) sin&sup2;(&Omega;&#8341;t/2),'
    + '&nbsp;&nbsp; &Omega;&#8341; = &radic;(&Omega;&sup2; + &Delta;&sup2;)',
    'A magnetic moment in a field goes round it rather than lining up with it &mdash; and a drive only flips it completely on resonance.'];
  if (v === 'decohere') return ['dr&#8339;,&#8342;/dt = &minus;r&#8339;,&#8342;/T&#8322;,'
    + '&nbsp;&nbsp; dr&#8354;/dt = &minus;(r&#8354; &minus; r&#8320;)/T&#8321;,&nbsp;&nbsp; T&#8322; &le; 2T&#8321;',
    'Relaxation is the vector leaving the surface; the inequality is where the map stops being completely positive.'];
  return ['U(n&#770;,&alpha;) = exp(&minus;i&alpha; n&middot;&sigma;/2),&nbsp;&nbsp; U(n&#770;,2&pi;) = &minus;&#120793;,'
    + '&nbsp;&nbsp; &gamma;<sub>Berry</sub> = &minus;&Omega;/2',
    'SU(2) covers the rotation group twice, and the phase left over after a closed loop is half the solid angle it enclosed.'];
}
function tagText(M){
  return 'CODATA 2022 (physics.nist.gov)  ·  everything else is exact linear algebra';
}

  decohere: 'Left alone with an environment, the Bloch vector leaves the surface. Phase '

    + 'the ball toward whatever the temperature says it should be. The constraint T₂ ≤ 2T₁ falls '
    + 'out of requiring the map to be completely positive, and this view computes the Choi '
    + 'eigenvalues rather than quoting the inequality.',
  cover: 'The Bloch sphere is the space of states, and it is smaller than the space of kets. '
    + 'Above every point on it sits a circle of kets differing only by a phase. Rotating by 2π '
    + 'brings the sphere back exactly and the ket back with a minus sign — the group SU(2) covers '
    + 'the rotations twice. The leftover phase after a closed loop is not arbitrary: it is half '
    + 'the solid angle the loop enclosed, which is geometry rather than dynamics.',
};

/* ------------------------------------------------------------------------ */
function makeScene(canvas){
  const st = Object.assign({}, DEFAULTS);
  const cam = { W: 900, H: 600 };
  let M = null;
  const S = {
    /* The default camera must not look ALONG the default state.  At
       camTheta 0.72 the view direction and r = (0.612, 0.612, 0.5) had a dot
       product of 0.99, so the one arrow the view exists to show was foreshortened
       to a 37 px stub inside a 168 px sphere.  2.4 rad puts it side-on (0.14). */
    st, cam, camTheta: 2.4, camPhi: 0.35, zoom: 1,
    model(){ if (!M) S.rebuild(); return M; },
    rebuild(){ M = buildModel(st); },
    resetView(){ S.camTheta = 2.4; S.camPhi = 0.35; S.zoom = 1; },
    orbit(dx, dy){
      S.camTheta -= dx * 0.008;
      S.camPhi = clamp(S.camPhi + dy * 0.008, -1.45, 1.45);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarText(S.model()); },
    tag(){ return tagText(S.model()); },
    draw(){ drawView(canvas.getContext('2d'), cam.W, cam.H, S.model(), S); },
  };
  return S;
}

  const S = makeScene(canvas), st = S.st;

  function fail(e){ errEl.style.display = 'block'; errEl.textContent = String(e && e.stack || e); }

      st.view = k;
      [].forEach.call(tabsEl.children, (b, i) => b.className = VIEWS[i][0] === k ? 'active' : '');
      S.rebuild(); syncPanel(); refresh(); } }, lab));
  });

  const rows = {};

    const row = h('div', { class: 'sliderrow' }, h('label', null, lab), inp, val);
    const sync = () => { inp.value = st[key]; val.textContent = fmtf(st[key]); };
    inp.addEventListener('input', () => { st[key] = parseFloat(inp.value);
      val.textContent = fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key] = { row, sync, inp }; sync(); return row;
  }
  function checkbox(key, lab){
    const inp = h('input', { type: 'checkbox' }); inp.checked = st[key];
    inp.addEventListener('change', () => { st[key] = inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label', null, inp, lab);

  function chipRow(list, key, idf, namef){
    const wrapEl = h('div', { class: 'chips' });
    list.forEach(o => {
      wrapEl.appendChild(h('button', { class: 'chip' + (st[key] === idf(o) ? ' on' : ''),

            b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));
          S.rebuild(); syncPanel(); refresh(); } }, namef(o)));
    });
    wrapEl._sync = () => [].forEach.call(wrapEl.children, (b, i) =>
      b.className = 'chip' + (idf(list[i]) === st[key] ? ' on' : ''));

    const g = h('div', { class: 'group' }, h('div', { class: 'gtitle' }, title), ...kids);
    groups.push(g); panel.appendChild(g); return g;
  }
  const spChips = chipRow(SPECIES.map(k => ({ k: k, n: GYRO[k].name })), 'species',
                          o => o.k, o => o.n);
  group('the state',
    slider('th', 'θ', 0, 3.1416, 0.0087, v => sg(v * RAD, 4) + '°'),
    slider('ph', 'φ', 0, 6.2832, 0.0087, v => sg(v * RAD, 4) + '°'),
    slider('chi', 'global phase', 0, 6.2832, 0.0087, v => sg(v * RAD, 4) + '°'),
    slider('rlen', '|r|', 0, 1, 0.01, v => sg(v, 3)),
    checkbox('showGrid', ' sphere grid'), checkbox('showCardinal', ' cardinal states'),
    checkbox('showShadow', ' θ and φ circles'));
  group('measurement',
    slider('mth', 'n̂ polar', 0, 3.1416, 0.0087, v => sg(v * RAD, 4) + '°'),
    slider('mph', 'n̂ azimuth', 0, 6.2832, 0.0087, v => sg(v * RAD, 4) + '°'),
    slider('nShots', 'shots', 20, 4000, 20, v => String(v)),
    slider('seed', 'seed', 1, 40, 1, v => String(v)),
    checkbox('showMalus', ' the half-angle curve'), checkbox('showCascade', ' three magnets'));
  group('precession', spChips,
    slider('Btesla', 'field', 0.01, 12, 0.01, v => sg(v, 4) + ' T'),
    slider('Omega', 'drive Ω', 0.1, 3, 0.05, v => sg(v, 3)),
    slider('Delta', 'detuning Δ', -3, 3, 0.05, v => sg(v, 3)),
    slider('tau', 'watch for', 1, 20, 0.5, v => sg(v, 3) + ' /Ω'),
    checkbox('showDetuned', ' show the detuned flop'));
  group('decoherence',
    slider('T1', 'T₁', 0.2, 4, 0.05, v => sg(v, 3)),
    slider('T2', 'T₂', 0.05, 8, 0.05, v => sg(v, 3)),
    slider('req', 'thermal r_z', -1, 1, 0.02, v => sg(v, 3)),
    slider('spin', 'precession rate', 0, 40, 0.5, v => sg(v, 3)),
    slider('tmax', 'watch for', 1, 20, 0.5, v => sg(v, 3)));
  group('the double cover',
    slider('turn', 'rotate by', 0, 4, 0.01, v => sg(v, 3) + 'π'),
    slider('cone', 'loop half-angle', 0.05, 3.09, 0.01, v => sg(v * RAD, 4) + '°'));
  const infoEl = h('div', { class: 'info' });
  panel.appendChild(infoEl);
  panel.appendChild(h('button', { class: 'chip', style: 'margin-top:10px',
    onclick: () => { Object.assign(st, DEFAULTS); S.resetView(); S.rebuild(); syncPanel(); refresh(); } },
    'reset all'));

  const VIS = { sphere: [0], ident: [0], measure: [0, 1], precess: [2], decohere: [3], cover: [0, 4] };
  function syncPanel(){
    const keep = VIS[st.view] || [];
    groups.forEach((g, i) => g.style.display = keep.indexOf(i) >= 0 ? '' : 'none');
    Object.keys(rows).forEach(k => rows[k].sync());
    spChips._sync();
    infoEl.textContent = INFO[st.view] || '';
    subEl.textContent = VIEWS.filter(v => v[0] === st.view)[0][1];
  }
  function refresh(){
    try {
      S.draw();
      roEl.innerHTML = S.readout();
      const [eq, sm] = S.eqbar();
      eqEl.innerHTML = '<div class="eq">' + eq + '</div><div class="sm">' + sm + '</div>';
      tagEl.textContent = S.tag();
      hintEl.textContent = 'drag to turn the sphere · ← → change view · r resets';
    } catch (e){ fail(e); }
  }
  function resize(){
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    S.cam.W = Math.max(420, Math.round(r.width));
    S.cam.H = Math.max(320, Math.round(r.height));
    canvas.width = Math.round(S.cam.W * dpr); canvas.height = Math.round(S.cam.H * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', () => { resize(); refresh(); });

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY };
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    S.orbit(e.clientX - drag.x, e.clientY - drag.y);
    drag = { x: e.clientX, y: e.clientY };
    refresh();
  });
  canvas.addEventListener('pointerup', () => { drag = null; });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R'){ S.resetView(); refresh(); }
    const i = VIEWS.map(v => v[0]).indexOf(st.view);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      const j = (i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length;
      st.view = VIEWS[j][0];
      [].forEach.call(tabsEl.children, (b, k) => b.className = k === j ? 'active' : '');
      S.rebuild(); syncPanel(); refresh();
    }
  });
  resize(); syncPanel(); refresh();
  window.__S = S;
}
