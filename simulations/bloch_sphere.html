/* ============================================================================
 *  selfTest -- runs when there is no document
 * ========================================================================== */
function selfTest(){
  let pass = 0, fail = 0;
  const ok = (c, n) => { if (c) pass++; else { fail++; console.log('FAIL: ' + n); } };
  const close = (a, b, tol, n) => ok(isFinite(a) && isFinite(b) && Math.abs(a - b) <= tol,
    n + '  (got ' + a + ', want ' + b + ', tol ' + tol + ')');
  const rel = (a, b, t, n) => ok(isFinite(a) && isFinite(b) && b !== 0
    && Math.abs(a / b - 1) <= t, n + '  (got ' + a + ', want ' + b + ', rel ' + t + ')');
  const d1 = (f, x, hh) => (f(x - 2*hh) - 8*f(x - hh) + 8*f(x + hh) - f(x + 2*hh)) / (12*hh);

  /* ---------------- the complex arithmetic, before any physics ----------- */
  {
    /* two matrices with no symmetry, multiplied by hand on paper */
    const A = [1,2, 3,4, 5,6, 7,8], Bm = [8,7, 6,5, 4,3, 2,1];
    const P = mMul(A, Bm);
    /* (1+2i)(8+7i) + (3+4i)(4+3i) = (8+7i+16i-14) + (12+9i+16i-12) = (-6+23i)+(0+25i) */
    close(P[0], -6, 1e-12, 'mMul entry (0,0) real');
    close(P[1], 48, 1e-12, 'mMul entry (0,0) imaginary');
    const T = mTrace(A);
    close(T[0], 8, 1e-14, 'mTrace real'); close(T[1], 10, 1e-14, 'mTrace imaginary');
    const D = mDag(A);
    close(D[0], 1, 1e-14, 'mDag transposes and conjugates (0,0) re');
    close(D[1], -2, 1e-14, '  and conjugates it');
    close(D[2], 5, 1e-14, '  and swaps (0,1) with (1,0)');
    ok(mMaxAbsDiff(mMul(M_I, A), A) < 1e-15, 'the identity multiplies to nothing');
    ok(mMaxAbsDiff(mDag(mDag(A)), A) < 1e-15, 'dagger is an involution');
    /* det and eigenvalues on something hermitian, where both are checkable */
    const Hm = mAdd(mScale(M_I, 0.5), mScale(M_SZ, 0.3));
    const ev = hermEig(Hm);
    close(ev[0] + ev[1], mTrace(Hm)[0], 1e-14, 'eigenvalues sum to the trace');
    close(ev[0] * ev[1], mDet(Hm)[0], 1e-14, 'and multiply to the determinant');
  }
  /* Pauli algebra: sigma_i sigma_j = delta_ij I + i eps_ijk sigma_k, all nine */
  {
    const eps = (i, j, k) => (i - j) * (j - k) * (k - i) / 2;
    let worst = 0;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++){
      let want = i === j ? M_I.slice() : [0,0,0,0,0,0,0,0];
      for (let k = 0; k < 3; k++){
        const e = eps(i, j, k);
        if (e !== 0) want = mAdd(want, mScaleC(PAULI[k], 0, e));
      }
      worst = Math.max(worst, mMaxAbsDiff(mMul(PAULI[i], PAULI[j]), want));
    }
    ok(worst < 1e-15, 'sigma_i sigma_j = delta_ij I + i eps_ijk sigma_k for all nine pairs ('
       + worst.toExponential(1) + ')');
    for (let i = 0; i < 3; i++){
      close(mTrace(PAULI[i])[0], 0, 1e-15, 'sigma_' + i + ' is traceless');
      ok(mMaxAbsDiff(mDag(PAULI[i]), PAULI[i]) < 1e-15, 'sigma_' + i + ' is hermitian');
      ok(mMaxAbsDiff(mMul(PAULI[i], PAULI[i]), M_I) < 1e-15, 'sigma_' + i + ' squares to I');
      close(mDet(PAULI[i])[0], -1, 1e-15, 'det sigma_' + i + ' = -1');
    }
    /* and they ANTIcommute, which is the half of the algebra the identity hides */
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (i !== j)
      ok(mMaxAbsDiff(mAdd(mMul(PAULI[i], PAULI[j]), mMul(PAULI[j], PAULI[i])),
                     [0,0,0,0,0,0,0,0]) < 1e-15, 'sigma_' + i + ' and sigma_' + j + ' anticommute');
  }

  /* ---------------- state, Bloch vector, density matrix ------------------ */
  {
    let wr = 0, wrho = 0, wnorm = 0;
    for (let a = 0; a <= 16; a++) for (let b = 0; b <= 18; b++){
      const th = Math.PI * a / 16, ph = TAU * b / 18;
      const k = ketOf(th, ph);
      wnorm = Math.max(wnorm, Math.abs(ketNorm(k) - 1));
      const r = blochOfKet(k), want = blochOfAngles(th, ph);
      wr = Math.max(wr, Math.abs(r[0]-want[0]), Math.abs(r[1]-want[1]), Math.abs(r[2]-want[2]));
      wrho = Math.max(wrho, mMaxAbsDiff(ketRho(k), rhoOfBloch(r)));
      const back = blochOfRho(rhoOfBloch(r));
      wr = Math.max(wr, Math.abs(back[0]-r[0]), Math.abs(back[1]-r[1]), Math.abs(back[2]-r[2]));
    }
    ok(wnorm < 1e-15, 'every ket is normalised (' + wnorm.toExponential(1) + ')');
    ok(wr < 1e-14, 'r = (sin th cos ph, sin th sin ph, cos th) and round-trips through rho ('
       + wr.toExponential(1) + ') over 323 states');
    ok(wrho < 1e-14, 'and |psi><psi| = (I + r.sigma)/2 for every one of them');
  }
  {
    /* the global phase is unobservable -- the whole reason the sphere exists */
    let worst = 0;
    for (const chi of [0.3, 1.7, Math.PI, 5.9]){
      const k = ketOf(1.1, 0.7), c = Math.cos(chi), s = Math.sin(chi);
      const kp = [k[0]*c - k[1]*s, k[0]*s + k[1]*c, k[2]*c - k[3]*s, k[2]*s + k[3]*c];
      const a = blochOfKet(k), b = blochOfKet(kp);
      worst = Math.max(worst, Math.abs(a[0]-b[0]), Math.abs(a[1]-b[1]), Math.abs(a[2]-b[2]));
      /* but the KET really did change, or the test is vacuous */
      ok(Math.abs(kp[0] - k[0]) + Math.abs(kp[1] - k[1]) > 1e-6 || Math.abs(Math.sin(chi)) < 1e-9,
         'the phase chi = ' + chi + ' really moved the ket');
    }
    ok(worst < 1e-15, 'and moved the Bloch vector by ' + worst.toExponential(1));
  }
  {
    /* orthogonal <-> antipodal.  This is the half-angle, and it is the single
       most misread thing about the picture. */
    let wov = 0, wdot = 0;
    for (const [th, ph] of [[0.4, 0.2], [1.1, 3.0], [2.6, 5.5], [Math.PI/2, 0]]){
      const a = ketOf(th, ph), b = ketOf(Math.PI - th, ph + Math.PI);
      const o = braket(a, b);
      wov = Math.max(wov, Math.hypot(o[0], o[1]));
      const ra = blochOfKet(a), rb = blochOfKet(b);
      wdot = Math.max(wdot, Math.abs(ra[0]*rb[0] + ra[1]*rb[1] + ra[2]*rb[2] + 1));
    }
    ok(wov < 1e-14, 'orthogonal states have zero overlap (' + wov.toExponential(1) + ')');
    ok(wdot < 1e-14, 'and their Bloch vectors are ANTIPODAL, r.r = -1 exactly');
    /* states at RIGHT ANGLES on the sphere are not orthogonal -- they overlap 1/sqrt2 */
    const p = ketOf(0, 0), q = ketOf(Math.PI/2, 0);
    close(Math.hypot(braket(p, q)[0], braket(p, q)[1]), Math.SQRT1_2, 1e-14,
          'and 90 degrees apart on the sphere means an overlap of 1/sqrt(2), not 0');
  }
  {
    for (const R of [0, 0.25, 0.5, 0.75, 1]){
      const rho = rhoOfBloch([0.6*R, -0.48*R, 0.64*R]);
      close(mTrace(rho)[0], 1, 1e-14, 'Tr rho = 1 at |r| = ' + R);
      close(mTrace(rho)[1], 0, 1e-15, 'and is real');
      ok(mMaxAbsDiff(mDag(rho), rho) < 1e-15, 'rho is hermitian at |r| = ' + R);
      close(mTrace(mMul(rho, rho))[0], purity(R), 1e-13, 'Tr rho^2 = (1+|r|^2)/2 at |r| = ' + R);
      const ev = hermEig(rho), want = rhoEigs(R);
      close(Math.min(ev[0], ev[1]), Math.min(want[0], want[1]), 1e-13,
            'eigenvalues are (1 -+ |r|)/2 at |r| = ' + R);
      ok(ev[0] > -1e-14, 'and non-negative, so it is a state');
    }
    close(vonNeumann(0), 1, 1e-14, 'the maximally mixed state carries exactly one bit');
    close(vonNeumann(1), 0, 1e-14, 'and a pure state carries none');
    ok(vonNeumann(0.5) > 0.7 && vonNeumann(0.5) < 0.95, 'and half way is ' + sg(vonNeumann(0.5), 4));
    /* purity is monotone in |r| -- the ball has an inside and it means something */
    let mono = true;
    for (let i = 1; i <= 100; i++) if (purity(i/100) <= purity((i-1)/100)) mono = false;
    ok(mono, 'purity increases with |r| all the way to the surface');
  }

  /* ---------------- projection versus identity --------------------------- */
  {
    let wid = 0, wsq = 0, wort = 0, wtr = 0;
    for (const [th, ph] of [[0,0],[1.0,0.6],[2.2,4.4],[Math.PI/2,Math.PI/2]]){
      const n = blochOfAngles(th, ph);
      const Pp = projector(n), Pm = projector([-n[0], -n[1], -n[2]]);
      wid  = Math.max(wid,  mMaxAbsDiff(mAdd(Pp, Pm), M_I));
      wsq  = Math.max(wsq,  mMaxAbsDiff(mMul(Pp, Pp), Pp));
      wort = Math.max(wort, mMaxAbsDiff(mMul(Pp, Pm), [0,0,0,0,0,0,0,0]));
      wtr  = Math.max(wtr,  Math.abs(mTrace(Pp)[0] - 1));
    }
    ok(wid  < 1e-15, 'P+ + P- = I exactly (' + wid.toExponential(1) + ') -- the resolution of '
       + 'the identity, which is what "the measurement has outcomes" means');
    ok(wsq  < 1e-15, 'P^2 = P (' + wsq.toExponential(1) + ')');
    ok(wort < 1e-15, 'P+ P- = 0 (' + wort.toExponential(1) + ')');
    ok(wtr  < 1e-14, 'Tr P = 1');
    /* a MIXED state is emphatically not a projector -- or the test above says nothing */
    const mix = rhoOfBloch([0, 0, 0.5]);
    ok(mMaxAbsDiff(mMul(mix, mix), mix) > 0.1, 'a mixed state is not a projector, by 0.1 or more');
  }
  {
    /* the Born rule three ways: from the trace, from the dot product, and from
       the overlap of the two kets */
    let worst = 0;
    for (const [th, ph] of [[0.7, 0.3], [1.9, 2.2], [2.9, 5.0]])
    for (const [mt, mp] of [[0, 0], [1.2, 0.9], [2.4, 3.3]]){
      const k = ketOf(th, ph), r = blochOfKet(k);
      const n = blochOfAngles(mt, mp);
      const fromTrace = mTrace(mMul(rhoOfBloch(r), projector(n)))[0];
      const fromDot   = bornP(r, n);
      const nk = ketOf(mt, mp), o = braket(nk, k);
      const fromKet = o[0]*o[0] + o[1]*o[1];
      const Theta = Math.acos(clamp(r[0]*n[0] + r[1]*n[1] + r[2]*n[2], -1, 1));
      const fromHalf = Math.pow(Math.cos(Theta/2), 2);
      worst = Math.max(worst, Math.abs(fromTrace - fromDot), Math.abs(fromTrace - fromKet),
                       Math.abs(fromTrace - fromHalf));
    }
    ok(worst < 1e-13, 'Tr(rho P), (1 + r.n)/2, |<n|psi>|^2 and cos^2(Theta/2) are the same '
       + 'number to ' + worst.toExponential(1) + ', over nine geometries');
    /* and it is NOT cos^2(Theta): a spin is not a polariser */
    const T = 1.0;
    ok(Math.abs(Math.pow(Math.cos(T/2), 2) - Math.pow(Math.cos(T), 2)) > 0.1,
       'cos^2(Theta/2) and cos^2(Theta) differ by more than 0.1 at 1 rad -- the half-angle is '
       + 'a real difference, not a convention');
    close(bornP([0,0,1], [0,0,1]), 1, 1e-15, 'measuring |0> along z always gives +');
    close(bornP([0,0,1], [1,0,0]), 0.5, 1e-15, 'and along x gives exactly a half');
    close(bornP([0,0,1], [0,0,-1]), 0, 1e-15, 'and along -z never gives +');
    /* The three-magnet cascade.  The point of it is that the middle magnet does
       not filter the beam, it REMAKES it: whatever went in, what comes out of
       the first magnet is |0>, so the second probability cannot depend on the
       original state at all.  Nothing asserted this and a mutant that fed the
       original state into the second magnet survived. */
    {
      const n = blochOfAngles(1.1, 0.4);
      const p2s = [];
      for (const [th, ph] of [[0.2, 0], [1.5, 2.0], [2.9, 5.0]]){
        const M = buildModel(Object.assign({}, DEFAULTS, { th: th, ph: ph, mth: 1.1, mph: 0.4 }));
        p2s.push(M.cascade.p2);
        close(M.cascade.pz, bornP(blochOfAngles(th, ph), [0, 0, 1]), 1e-14,
              'the first magnet passes (1 + r_z)/2');
        close(M.cascade.p3, bornP(n, [0, 0, 1]), 1e-14,
              'and the third sees a beam that is now along n, not along z');
      }
      ok(Math.abs(p2s[0] - p2s[1]) < 1e-15 && Math.abs(p2s[0] - p2s[2]) < 1e-15,
         'the second magnet\'s probability does not depend on the original state '
         + '(' + sg(p2s[0], 6) + ' for all three) -- the first measurement remade it');
      close(p2s[0], (1 + n[2]) / 2, 1e-14, 'and equals (1 + n_z)/2');
      /* and with n along z the cascade does nothing: the third magnet passes all */
      const Mz = buildModel(Object.assign({}, DEFAULTS, { mth: 0 }));
      close(Mz.cascade.p3, 1, 1e-14, 'with n along z the third magnet passes everything');
      ok(!Mz.cascade.recovered, 'and nothing was "recovered" -- there is nothing to recover');
      const Mx = buildModel(Object.assign({}, DEFAULTS, { mth: Math.PI / 2 }));
      close(Mx.cascade.p3, 0.5, 1e-14, 'with n along x it passes exactly half -- the beam that '
            + 'was purely |0> is split again, which is the whole point of the experiment');
      ok(Mx.cascade.recovered, 'and that IS a recovery');
    }
    /* probabilities sum to one for every state and every axis */
    let ws = 0;
    for (let i = 0; i < 40; i++){
      const r = blochOfAngles(Math.PI*i/40, 2.1*i), n = blochOfAngles(1.3*i, 0.7*i);
      ws = Math.max(ws, Math.abs(bornP(r, n) + bornP(r, [-n[0],-n[1],-n[2]]) - 1));
      ok(bornP(r, n) >= -1e-15 && bornP(r, n) <= 1 + 1e-15, 'and lies in [0,1]');
    }
    ok(ws < 1e-15, 'p+ + p- = 1 for every state and axis');
  }

  /* ---------------- unitary evolution = rotation ------------------------- */
  {
    for (const row of REF.U){
      const n = [row[0], row[1], row[2]], a = row[3];
      const U = unitary(n, a);
      let worst = 0;
      for (let i = 0; i < 8; i++) worst = Math.max(worst, Math.abs(U[i] - row[4 + i]));
      ok(worst < 1e-13, 'U(n,' + sg(a,3) + ') matches scipy expm to ' + worst.toExponential(1)
         + ' (scipy)');
      ok(mMaxAbsDiff(mMul(mDag(U), U), M_I) < 1e-14, '  and is unitary');
      close(mDet(U)[0], 1, 1e-13, '  with determinant +1 (real part)');
      close(mDet(U)[1], 0, 1e-13, '  and no imaginary part');
    }
    /* the double cover, which is the whole of view six */
    const n = norm3([0.3, -0.5, 0.8]);
    ok(mMaxAbsDiff(unitary(n, 0), M_I) < 1e-15, 'U(0) = I');
    ok(mMaxAbsDiff(unitary(n, TAU), mScale(M_I, -1)) < 1e-14,
       'U(2pi) = MINUS I -- not the identity');
    ok(mMaxAbsDiff(unitary(n, TAU), M_I) > 1.9, '  and is nowhere near +I');
    ok(mMaxAbsDiff(unitary(n, 2*TAU), M_I) < 1e-13, 'U(4pi) = +I: it takes two turns to get back');
    /* the Bloch vector, by contrast, is home after one */
    const r = blochOfAngles(1.1, 0.4);
    const back = rotate3(r, n, TAU);
    ok(Math.hypot(back[0]-r[0], back[1]-r[1], back[2]-r[2]) < 1e-13,
       'while the Bloch vector returns after 2pi');
  }
  {
    /* U rotates the Bloch vector by exactly alpha about n */
    let worst = 0;
    for (let ai = 1; ai <= 12; ai++){
      const a = 0.5 * ai, n = norm3([0.36, -0.48, 0.8]);
      const U = unitary(n, a);
      for (const [th, ph] of [[0.7, 0.3], [2.0, 4.1], [1.3, 5.5]]){
        const k = ketOf(th, ph);
        const got = blochOfKet(mApply(U, k));
        const want = rotate3(blochOfKet(k), n, a);
        worst = Math.max(worst, Math.abs(got[0]-want[0]), Math.abs(got[1]-want[1]),
                         Math.abs(got[2]-want[2]));
      }
    }
    ok(worst < 1e-13, 'the Bloch vector rotates by exactly alpha about n (' + worst.toExponential(1)
       + ' over 36 cases) -- SU(2) acting on the ket IS SO(3) acting on the vector');
    /* the rotation really is a rotation: lengths preserved, handedness kept */
    let wl = 0;
    for (let i = 0; i < 20; i++){
      const v = [Math.sin(i), Math.cos(2*i), Math.sin(3*i)];
      const L0 = Math.hypot(v[0], v[1], v[2]);
      const w = rotate3(v, norm3([1, 2, -1]), 0.9);
      wl = Math.max(wl, Math.abs(Math.hypot(w[0], w[1], w[2]) - L0));
    }
    ok(wl < 1e-14, 'and preserves length to ' + wl.toExponential(1));
    /* rotating by a then -a is the identity */
    const v = [0.3, -0.6, 0.74], nn = norm3([0.2, 0.9, -0.4]);
    const rt = rotate3(rotate3(v, nn, 1.3), nn, -1.3);
    ok(Math.hypot(rt[0]-v[0], rt[1]-v[1], rt[2]-v[2]) < 1e-14, 'and inverts');
  }

  /* ---------------- precession, driving ---------------------------------- */
  {
    /* THE SIGN.  Integrate the Bloch equation with no relaxation and compare
       against a Schrodinger integration done in Python.  Getting this wrong is
       a coin flip and the picture would still look plausible. */
    const L = REF.larmor;
    let r = L.r0.slice();
    const nst = 40000, dt = L.T / nst;
    for (let i = 0; i < nst; i++) r = blochStep(r, L.B, L.gam, 1e30, 1e30, 0, dt);
    let worst = 0;
    for (let i = 0; i < 3; i++) worst = Math.max(worst, Math.abs(r[i] - L.rT[i]));
    ok(worst < 1e-7, 'dr/dt = -gamma B x r reproduces the Schrodinger integration to '
       + worst.toExponential(1) + ' (scipy)');
    /* the opposite sign must be badly wrong, or the test above proves nothing */
    let r2 = L.r0.slice();
    for (let i = 0; i < nst; i++){
      const c = [L.B[1]*r2[2]-L.B[2]*r2[1], L.B[2]*r2[0]-L.B[0]*r2[2], L.B[0]*r2[1]-L.B[1]*r2[0]];
      r2 = [r2[0] + dt*L.gam*c[0], r2[1] + dt*L.gam*c[1], r2[2] + dt*L.gam*c[2]];
    }
    ok(Math.hypot(r2[0]-L.rT[0], r2[1]-L.rT[1], r2[2]-L.rT[2]) > 0.5,
       'and the opposite sign is wrong by more than 0.5, so the check is not vacuous');
    /* precession preserves |r| and the angle to B */
    let wlen = 0;
    let r3 = [0.6, -0.48, 0.64];
    const L0 = Math.hypot(r3[0], r3[1], r3[2]), z0 = r3[2];
    for (let i = 0; i < 2000; i++){
      r3 = blochStep(r3, [0,0,1], 3.0, 1e30, 1e30, 0, 0.002);
      wlen = Math.max(wlen, Math.abs(Math.hypot(r3[0], r3[1], r3[2]) - L0), Math.abs(r3[2] - z0));
    }
    ok(wlen < 1e-9, 'free precession keeps |r| and r_z fixed to ' + wlen.toExponential(1));
  }
  {
    for (const [Om, De, t, p] of REF.rabi)
      close(rabiP1(Om, De, t), p, 1e-12,
            'Rabi P1 at Omega=' + Om + ', Delta=' + De + ', t=' + t + ' (scipy)');
    close(rabiP1(1, 0, Math.PI), 1, 1e-14, 'a pi pulse on resonance is a complete flip');
    close(rabiP1(1, 0, Math.PI/2), 0.5, 1e-14, 'and a pi/2 pulse lands on the equator');
    for (const De of [0.5, 1, 3]){
      const cap = rabiMax(1, De);
      let m = 0;
      for (let i = 0; i <= 4000; i++) m = Math.max(m, rabiP1(1, De, 20 * i / 4000));
      close(m, cap, 1e-6, 'detuned by ' + De + ', the flop never exceeds Omega^2/OmegaR^2');
      ok(cap < 0.999, '  and that cap is ' + sg(cap, 4) + ', short of one');
    }
    close(rabiFreq(3, 4), 5, 1e-14, 'the generalised Rabi frequency is the hypotenuse');
    /* the sim's real frequencies, against CODATA directly */
    close(GYRO.p.gam * 1.5, 63.8662176915, 1e-6, 'a proton in 1.5 T precesses at 63.87 MHz (CODATA)');
    rel(GYRO.e.gam / GYRO.p.gam, 658.2107, 1e-5, 'the electron is 658 times faster than the proton');
    ok(GYRO.pshield.gam < GYRO.p.gam, 'the SHIELDED proton ratio is lower than the bare one');
    rel(1e6 * (1 - GYRO.pshield.gam / GYRO.p.gam), 25.67, 2e-3,
        'by 25.7 ppm -- the diamagnetic shielding of the water molecule it sits in');
  }
  {
    /* the anomaly: g/2 - 1 from CODATA against Schwinger's one loop */
    close(1 + CODATA.a_e.v, Math.abs(CODATA.g_e.v) / 2, 1e-15,
          'CODATA g/2 and 1 + a_e agree exactly, as they must');
    const s = schwinger();
    rel(s, CODATA.a_e.v, 2e-3, 'alpha/2pi lands within 0.2% of the measured electron anomaly');
    ok(s > CODATA.a_e.v, 'one loop overshoots -- the higher orders come in negative');
    ok(Math.abs(s / CODATA.a_e.v - 1) > 1e-3,
       'and it is NOT exact: the gap is ' + sg(100*(s/CODATA.a_e.v - 1), 4) + '%, which is where '
       + 'the two-loop term lives');
    /* the muon's anomaly is close to the electron's in value -- the reason it
       matters is not its size, and the file should not imply it is */
    rel(CODATA.a_mu.v / CODATA.a_e.v, 1.0054, 1e-3,
        'the muon anomaly is only 0.5% larger than the electron\'s in value');
  }

  /* ---------------- relaxation ------------------------------------------- */
  {
    for (const [t, xy, z] of REF.relax){
      const c = relaxClosed([1, 0, 0.5], 1.0, 0.6, 0.9, t);
      close(Math.hypot(c[0], c[1]), xy, 1e-12, 'transverse decay at t = ' + t + ' (scipy)');
      close(c[2], z, 1e-12, 'longitudinal relaxation at t = ' + t + ' (scipy)');
    }
    /* the integrator must reproduce the closed form when the field is off */
    let r = [1, 0, 0.5], worst = 0;
    const T1 = 1.0, T2 = 0.6, req = 0.9, dt = 0.0005;
    for (let i = 0; i <= 12000; i++){
      const t = i * dt;
      const c = relaxClosed([1, 0, 0.5], T1, T2, req, t);
      worst = Math.max(worst, Math.abs(r[0]-c[0]), Math.abs(r[1]-c[1]), Math.abs(r[2]-c[2]));
      r = blochStep(r, [0,0,0], 0, T1, T2, req, dt);
    }
    ok(worst < 1e-10, 'the RK4 step reproduces the closed relaxation to ' + worst.toExponential(1));
    /* and it must NOT be exact when a field is on and the two are inconsistent */
    ok(Math.abs(relaxClosed([1,0,0.5], T1, T2, req, 1.0)[0]
              - blochStep([1,0,0.5], [0,0,5], 3, T1, T2, req, 1.0)[0]) > 0.01,
       'while precession genuinely changes the answer, so that check is not vacuous');
  }
  {
    /* complete positivity, against a Choi matrix built numerically in Python */
    for (const row of REF.choi){
      const got = choiEigs(row[0], row[1], row[2]);
      let worst = 0;
      for (let i = 0; i < 4; i++) worst = Math.max(worst, Math.abs(got[i] - row[3 + i]));
      ok(worst < 1e-12, 'Choi eigenvalues at t=' + row[0] + ', T1=' + row[1] + ', T2=' + row[2]
         + ' match the built matrix to ' + worst.toExponential(1) + ' (scipy)');
    }
    /* the boundary is exactly T2 = 2 T1 */
    const worstOver = (ratio) => {
      let w = Infinity;
      for (let i = 1; i <= 4000; i++) w = Math.min(w, choiEigs(20 * i / 4000, 1, ratio)[0]);
      return w;
    };
    for (const ratio of [0.5, 1.0, 1.5, 1.99, 2.0])
      ok(worstOver(ratio) > -1e-9, 'T2/T1 = ' + ratio + ' is completely positive');
    for (const ratio of [2.01, 2.5, 3.0])
      ok(worstOver(ratio) < -1e-6, 'T2/T1 = ' + ratio + ' is NOT ('
         + worstOver(ratio).toExponential(2) + ') -- the boundary really is at 2');
    /* and the eigenvalues sum to 2, because the Choi matrix here is unnormalised */
    for (const [t, T1, T2] of [[0.4, 1, 0.7], [1.3, 2, 3]]){
      const e = choiEigs(t, T1, T2);
      close(e[0]+e[1]+e[2]+e[3], 2, 1e-13, 'the Choi eigenvalues sum to 2');
    }
  }

  /* ---------------- geometric phase -------------------------------------- */
  {
    for (const [th, g] of REF.berry){
      const got = berryDiscrete(th, 4000);
      close(Math.abs(wrapPi(got - g)), 0, 2e-5,
            'the Berry phase at a cone of ' + sg(th, 4) + ' matches the 200000-step product (scipy)');
    }
    let worst = 0;
    for (let i = 1; i < 12; i++){
      const th = Math.PI * i / 12;
      worst = Math.max(worst, Math.abs(wrapPi(berryDiscrete(th, 3000) - berryClosed(th))));
    }
    ok(worst < 5e-5, 'and equals -Omega/2 over eleven cones (' + worst.toExponential(1) + ')');
    close(solidAngleCone(Math.PI/2), TAU, 1e-14, 'a great circle encloses 2pi steradians');
    close(berryClosed(Math.PI/2), -Math.PI, 1e-14, 'so its geometric phase is -pi');
    close(solidAngleCone(Math.PI), 2*TAU, 1e-13, 'and the whole sphere is 4pi');
    close(berryClosed(0), 0, 1e-15, 'a loop that encloses nothing gives no phase');
    /* the connection itself, differentiated numerically */
    for (const th of [0.3, 1.4, 2.6]){
      const f = (p) => {
        const k = ketOf(th, p);
        return k;
      };
      const hh = 1e-5, p0 = 0.7;
      const kp = f(p0 + hh), km = f(p0 - hh), k0 = f(p0);
      const d = [(kp[0]-km[0])/(2*hh), (kp[1]-km[1])/(2*hh),
                 (kp[2]-km[2])/(2*hh), (kp[3]-km[3])/(2*hh)];
      /* A = i<psi|d psi>, real part */
      const A = -(k0[0]*d[1] - k0[1]*d[0] + k0[2]*d[3] - k0[3]*d[2]);
      close(A, -Math.pow(Math.sin(th/2), 2), 1e-8,
            'the Berry connection is -sin^2(th/2) at th = ' + th);
    }
  }

  /* ---------------- model, panels, corners ------------------------------- */
  {
    let bad = 0, n = 0, first = '';
    for (const [v] of VIEWS) for (const sp of SPECIES){
      const st = Object.assign({}, DEFAULTS, { view: v, species: sp });
      const M = buildModel(st); n++;
      const html = readoutHTML(M);
      if (/NaN|undefined|Infinity/.test(html)){ bad++; if (!first) first = v + '/' + sp; }
      const [eq, sm] = eqbarText(M);
      if (!eq || !sm || /NaN|undefined/.test(eq + sm)) bad++;
      if (!tagText(M)) bad++;
    }
    ok(bad === 0, n + ' view x species combinations build a clean readout and equation bar'
       + (first ? ' (first problem: ' + first + ')' : ''));
  }
  {
    const RANGES = { th: [0, 3.1416], ph: [0, 6.2832], chi: [0, 6.2832], rlen: [0, 1],
                     mth: [0, 3.1416], mph: [0, 6.2832], nShots: [20, 4000], seed: [1, 40],
                     Btesla: [0.01, 12], Omega: [0.1, 3], Delta: [-3, 3], tau: [1, 20],
                     T1: [0.2, 4], T2: [0.05, 8], req: [-1, 1], spin: [0, 40], tmax: [1, 20],
                     turn: [0, 4], cone: [0.05, 3.09] };
    let bad = 0, n = 0, first = '';
    for (const key of Object.keys(RANGES)){
      const [lo, hi] = RANGES[key];
      for (const val of [lo, 0.5*(lo+hi), hi]) for (const [v] of VIEWS){
        const st = Object.assign({}, DEFAULTS, { view: v }); st[key] = val; n++;
        try {
          const M = buildModel(st);
          if (/NaN|undefined|Infinity/.test(readoutHTML(M))){
            bad++; if (!first) first = key + '=' + val + ' in ' + v;
          }
        } catch (e){ bad++; if (!first) first = key + '=' + val + ' in ' + v + ': ' + e; }
      }
    }
    ok(bad === 0, n + ' slider corners give finite models and clean readouts'
       + (first ? ' (first: ' + first + ')' : ''));
  }
  {
    /* the model must respond to its inputs */
    const base = buildModel(Object.assign({}, DEFAULTS));
    ok(Math.abs(buildModel(Object.assign({}, DEFAULTS, { th: 2.4 })).r[2] - base.r[2]) > 0.5,
       'theta moves the state');
    ok(Math.abs(buildModel(Object.assign({}, DEFAULTS, { rlen: 0.2 })).purity - base.purity) > 0.3,
       '|r| changes the purity');
    ok(Math.abs(buildModel(Object.assign({}, DEFAULTS, { species: 'e' })).fLarmor
              - base.fLarmor) > 1000, 'the species changes the Larmor frequency by kilohertz');
    ok(Math.abs(buildModel(Object.assign({}, DEFAULTS, { chi: 2.0 })).phaseShift) < 1e-14,
       'and the global phase changes nothing at all');
  }

  /* ---------------- drawing ---------------------------------------------- */
  ok(plain('a &mdash; b') === 'a — b', 'plain() decodes the entities this file uses');
  ok(ticksFor(1, 10, 5).length >= 4, 'ticksFor gives several ticks on an ordinary range');
  ok(ticksFor(10, 1, 5).length === 1, 'and collapses on an unsorted one');
  ok(tickfmt([0, 100, 200])(200) === '200', 'integer ticks print no decimals');
  ok(tickfmt([0, 0.5, 1])(0.5) === '0.5', 'and half-unit ticks print one');
  {
    const rec = makeTestRecorder();
    /* Latin-1 letters (Schrodinger's o-umlaut) are universally supported and
       are not the class of glyph this check exists to catch. */
    const LATIN1 = (ch) => ch.charCodeAt(0) >= 0xA0 && ch.charCodeAt(0) <= 0xFF;
    const SAFE = '—–’‘“”·×→←↑↓°±≈∫∂√ΔΓΘΛΣΦΩ𝟙' +
                 'αβγδεζηθκλμνξπρστυφχψωσ' +
                 '₀₁₂₃₄₅₆₇₈₉₊₋⁰¹²³⁴⁵⁶⁷⁸⁹⁻′″∞≤≥≠−½⅓¼⟨⟩̂⃗|';
    let bad = 0, odd = '', minOps = 1e9, off = 0, over = 0, worstOver = '';
    const TOG = [{}, { showGrid: false }, { showCardinal: false }, { showMalus: false },
                 { showCascade: false }, { showDetuned: false }, { showShadow: false }];
    for (const [W, H] of [[1400, 820], [1100, 700], [820, 560], [640, 430]]){
      for (const [v] of VIEWS) for (const tg of TOG){
        rec.reset();
        const M = buildModel(Object.assign({}, DEFAULTS, { view: v }, tg));
        try { drawView(rec.ctx, W, H, M, { camTheta: 2.4, camPhi: 0.35, zoom: 1 }); }
        catch (e){ bad++; console.log('  draw threw in ' + v + ': ' + e); continue; }
        if (W === 1400) minOps = Math.min(minOps, rec.ops.length);
        const boxes = [];
        for (const o of rec.ops){
          if (o.op !== 'fillText'){
            if ((o.op === 'lineTo' || o.op === 'moveTo' || o.op === 'fillRect')
                && o.a.some(x => typeof x === 'number' && !isFinite(x))) bad++;
            continue;
          }
          const s = String(o.a[0]);
          if (/&\w+;|&#\d+;|<\/?\w+>|NaN|undefined|Infinity/.test(s)) bad++;
          for (const ch of s) if (ch.charCodeAt(0) > 127 && SAFE.indexOf(ch) < 0
                                  && !LATIN1(ch) && !(ch >= '̀' && ch <= 'ͯ')){
            bad++; if (!odd) odd = ch + ' (U+' + ch.charCodeAt(0).toString(16).toUpperCase() + ')';
          }
          if (o.rot) continue;
          const fs = parseFloat((/(\d+(?:\.\d+)?)px/.exec(o.font || '') || [0, 10])[1]);
          const w = s.length * fs * 0.52;
          let x = o.a[1];
          if (o.align === 'center') x -= w / 2; else if (o.align === 'right') x -= w;
          const y = o.a[2] - (o.baseline === 'top' ? 0 : fs * 0.8);
          if (x < -6 || x + w > W + 6 || y < -6 || y + fs > H + 6) off++;
          boxes.push({ x, y, w, h: fs * 1.15, s });
        }
        for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++){
          const a = boxes[i], b = boxes[j];
          if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h){
            over++;
            if (!worstOver) worstOver = v + ' @' + W + 'x' + H + ': "' + a.s.slice(0, 24)
              + '" vs "' + b.s.slice(0, 24) + '"';
          }
        }
      }
    }
    ok(bad === 0, 'no entity, tag, NaN or stray glyph reaches the canvas'
       + (odd ? ' (found ' + odd + ')' : '') + ', over 168 renders');
    ok(minOps > 60, 'and every view draws something (fewest ' + minOps + ' ops)');
    ok(off === 0, 'no text leaves the canvas at any of four sizes (' + off + ')');
    ok(over === 0, 'and no two text boxes overlap' + (worstOver ? ' -- ' + worstOver : ''));
  }
  {
    /* no data curve through a legend, and the camera must actually move things */
    const rec = makeTestRecorder();
    let hits = 0, worst = '';
    for (const [v] of VIEWS) for (const tg of [{}, { showCascade: false }, { showMalus: false }]){
      rec.reset();
      const M = buildModel(Object.assign({}, DEFAULTS, { view: v }, tg));
      try { drawView(rec.ctx, 1400, 820, M, { camTheta: 2.4, camPhi: 0.35, zoom: 1 }); }
      catch (e){ continue; }
      const boxes = LEGEND_BOXES.slice();
      if (!boxes.length) continue;
      let own = 0; for (const b of boxes) own += b.own;
      let n = 0;
      for (const o of rec.ops){
        if ((o.op !== 'lineTo' && o.op !== 'moveTo') || !(o.lw >= 1.5)) continue;
        for (const b of boxes)
          if (o.a[0] >= b.x && o.a[0] <= b.x + b.w && o.a[1] >= b.y && o.a[1] <= b.y + b.h){ n++; break; }
      }
      if (n - own > 0){ hits++; if (!worst) worst = v + ' (' + (n - own) + ' strays)'; }
    }
    ok(hits === 0, 'no data curve passes through a legend' + (worst ? ' -- ' + worst : ''));
    /* the camera: two real drawings, one axis at a time */
    const cap = (ct, cp) => {
      rec.reset();
      drawView(rec.ctx, 1400, 820, buildModel(Object.assign({}, DEFAULTS, { view: 'sphere' })),
               { camTheta: ct, camPhi: cp, zoom: 1 });
      return JSON.stringify(rec.ops.filter(o => o.op === 'lineTo' || o.op === 'moveTo'));
    };
    const a0 = cap(2.4, 0.35);
    ok(cap(3.1, 0.35) !== a0, 'orbiting in theta moves the drawn geometry');
    ok(cap(2.4, 0.85) !== a0, 'and orbiting in phi moves it too');
    ok(cap(2.4, 0.35) === a0, 'and returning to the same camera redraws identically');
  }

  console.log(pass + ' passed, ' + fail + ' failed');
  if (fail > 0) throw new Error(fail + ' self-test failure(s)');
  return true;
}

/* A canvas stub that records what was asked for.  Deliberately NOT called
   makeRecorder: tools/recorder.js declares a function of that name and is
   concatenated after this file for the display-list capture. */
function makeTestRecorder(){
  const ops = [];
  const noop = () => {};
  let rot = 0; const stack = [];
  const ctx = {
    ops: ops,
    save(){ stack.push(rot); }, restore(){ rot = stack.length ? stack.pop() : 0; },
    beginPath: noop, closePath: noop, stroke: noop, fill: noop, clip: noop,
    setLineDash: noop, translate: noop, rotate(a){ rot += a; }, scale: noop, setTransform: noop,
    arc: (...a) => ops.push({ op: 'arc', a }),
    moveTo: (...a) => ops.push({ op: 'moveTo', a, lw: ctx.lineWidth }),
    lineTo: (...a) => ops.push({ op: 'lineTo', a, lw: ctx.lineWidth }),
    rect: (...a) => ops.push({ op: 'rect', a }),
    fillRect: (...a) => ops.push({ op: 'fillRect', a }),
    strokeRect: (...a) => ops.push({ op: 'strokeRect', a }),
    clearRect: noop,
    fillText: (...a) => ops.push({ op: 'fillText', a, font: ctx.font, fill: ctx.fillStyle,
                                   align: ctx.textAlign, baseline: ctx.textBaseline,
                                   rot: Math.abs(rot) > 1e-9 }),
    measureText: (s) => ({ width: String(s).length * 6.0 }),
    createLinearGradient: () => ({ addColorStop: noop }),
    font: '', fillStyle: '', strokeStyle: '', lineWidth: 1, textAlign: 'left',
    textBaseline: 'alphabetic', globalAlpha: 1, lineJoin: '', lineCap: '',
  };
  return { ctx, ops, reset(){ ops.length = 0; } };
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
