<title>Nuclear &amp; Atomic Clocks — from caesium to the ²²⁹Th nuclear clock</title>
<!--
  Every clock does the same thing: count the swings of an oscillator whose
  frequency is pinned to an unchanging natural resonance. An atomic clock pins
  a local oscillator (quartz for microwave, a laser for optical) to a narrow
  atomic transition of frequency nu0; a NUCLEAR clock pins it to a transition
  inside the nucleus. The second is defined as a fixed number of swings:
  1 s == 9 192 631 770 periods of the caesium-133 hyperfine transition.

  This sim carries five references, spanning eleven decades of frequency:
    Rubidium-87   6.834 682 610 904 GHz   microwave hyperfine   (fountain / GPS cell)
    Caesium-133   9.192 631 770 GHz       microwave hyperfine   (defines the SI second)
    Mercury-199+  40.507 347 997 GHz      microwave, trapped ion, LAMP-pumped
    Ytterbium-171 518.295 836 590 863 THz  optical lattice (578.42 nm)
    Thorium-229m  2 020 407 384 335 kHz    NUCLEAR isomer (148.382 nm, 8.356 eV)

  Four views, one physics core:

  MECHANISM  — the universal locked loop. A local oscillator at frequency
    nu = nu0(1+y) interrogates the reference; a discriminator turns the
    excitation asymmetry into an error signal; feedback steers y -> 0. The
    device then COUNTS nu0 periods to mark a second. Watch the servo pull the
    oscillator onto the atoms until only quantum noise remains.

  RESONANCE  — where the line quality Q = nu0/dnu comes from. A single pulse
    gives the broad Rabi lineshape P = (Om^2/Om_R^2) sin^2(Om_R t/2); two
    separated pulses give Ramsey fringes whose central width is 1/(2T), so
    Q = 2 T nu0 grows with the interrogation time T. (Thorium in a crystal has
    no coherent interrogation: the 300 kHz crystal line sets Q, and the lamp
    simply floods it.)

  STABILITY  — the Allan deviation ladder. The quantum-projection-noise floor
    sigma_y(tau) = (1/pi Q)(1/sqrt N) sqrt(T_c/tau) falls as tau^-1/2. Optical
    (Yb) and a narrow-line Th crystal sit far below the microwave standards;
    today's Th crystal sits HIGH despite the enormous nu0, because Q -- not
    nu0 -- sets stability. Reference LO/Dick (~1e-16/sqrt tau) and systematics
    (~1e-18) floors are drawn for context.

  THORIUM + Kr2  — the headline question: what does it take to drive the
    229mTh nuclear clock with a Kr2* excimer LAMP instead of a bespoke tunable
    VUV comb? Top: the Kr2 second continuum (peak 146 nm, FWHM 14 nm) covers
    the 148.382 nm nuclear line at f_shape ~ 0.92 of its peak (Ar2 126 nm,
    Xe2 172 nm miss it). Bottom: the full photon budget, live --
        int sigma dnu = (lam0^2/8pi)(g_e/g_g) A21           (= 9.1e-19 m^2 Hz)
        E_nu = eta * G * (bright) * M_nu * n^2               (radiance, not power)
        R1   = (E_nu / h nu0) int sigma dnu ,  R_tot = N R1
        sigma_y(tau) = sqrt(S+B) / (pi Q S sqrt(tau)) ,  S = eps_det R_tot .
    A 30 W Kr2 lamp floods a cm-scale 229Th:CaF2 crystal at ~1.8e6 isomers/s --
    ~250x the lock floor -- so PHOTON SUPPLY IS NOT THE BOTTLENECK. Multiple
    lamps raise RATE, not radiance (brightness theorem: ceiling ~4 n^2 M_nu,
    ~23x). The dominant knob is the crystal linewidth Q (t ~ Q^-2); and a
    broadband lamp can PUMP the isomer but never DISCRIMINATE the frequency --
    a separate local oscillator is still required, exactly as in the
    lamp-pumped 199Hg+ microwave clock. Numbers anchored to Zhang et al.,
    Nature 633, 63 (2024) and the project's kr2_photon_budget_v2.py.

  Aesthetic matches the other sims here: black stage, Mathematica NeonColors
  accents, side panel with the governing mathematics. Single file, no
  dependencies, works over file://. Headless self-test: extract the script
  body (substring after the LAST <script>, cf. rindex) and run under
      osascript -l JavaScript nc_test.js
  -- with `document` undefined it runs the assertion suite (transition
  anchors, Q, Rabi/Ramsey lineshapes, QPN stability, and the full Kr2/Th
  photon budget) instead of booting the UI.
-->

<script>
'use strict';
/* =========================== constants =========================== */
const PI = Math.PI, TAU = 2*PI;
const C  = 2.99792458e8;          // m/s
const H  = 6.62607015e-34;        // J s
const EV = 1.602176634e-19;       // J
const YR = 3.155693e7;            // s (Julian-ish year used in the budget)

/* ===================== the reference transitions =================
   nu0 in Hz. kind selects the physics face (microwave / optical / nuclear).
   For the stability ladder each species carries a representative
   (Q, N, T_c): line quality, atoms/ions interrogated per cycle, cycle time.
   These are shot-noise (QPN) scenarios, not vendor spec sheets; the demo
   note records the real-world implementation.                              */
const SPE = {
  rb: {key:'rb', label:'Rubidium-87',  sym:'⁸⁷Rb', kind:'microwave',
       nu0:6.834682610904e9,
       eLo:'F=1', eHi:'F=2', trans:'ground-state hyperfine |F=1⟩ ↔ |F=2⟩',
       dnu:1.0, N:1e6, Tc:1.3, col:[0.35,0.77,0.87],
       demo:'fountain / vapor-cell (the GPS &amp; telecom workhorse)'},
  cs: {key:'cs', label:'Caesium-133',  sym:'¹³³Cs', kind:'microwave',
       nu0:9192631770,
       eLo:'F=3', eHi:'F=4', trans:'ground-state hyperfine |F=3⟩ ↔ |F=4⟩',
       dnu:1.0, N:1e6, Tc:1.3, col:[0.55,0.86,0.95],
       demo:'atomic fountain — <b>defines the SI second</b>'},
  hg: {key:'hg', label:'Mercury-199⁺', sym:'¹⁹⁹Hg⁺', kind:'microwave',
       nu0:40.5073479968e9,
       eLo:'F=0', eHi:'F=1', trans:'ground-state hyperfine, trapped ion cloud',
       dnu:0.04, N:1e6, Tc:1.0, col:[0.72,0.925,0.30], lamp:true,
       lampTxt:'²⁰²Hg⁺ discharge lamp, 194 nm (state prep + readout)',
       demo:'trapped-ion microwave standard, lamp-pumped (SWAP / DARPA)'},
  yb: {key:'yb', label:'Ytterbium-171', sym:'¹⁷¹Yb', kind:'optical',
       nu0:5.18295836590863e14, lam:578.42e-9,
       eLo:'¹S₀', eHi:'³P₀', trans:'¹S₀ ↔ ³P₀ optical lattice clock',
       dnu:1.0, N:1e4, Tc:1.0, col:null,
       demo:'optical lattice clock (578.42 nm)'},
  th: {key:'th', label:'Thorium-229m', sym:'²²⁹ᵐTh', kind:'nuclear',
       nu0:2.020407384335e15, lam:148.382e-9,
       eLo:'5/2⁺ g.s.', eHi:'3/2⁺ isomer', trans:'nuclear isomeric transition (²²⁹Th)',
       dnu:300e3, N:5e17, Tc:1.0, col:null, lamp:true,
       lampTxt:'Kr₂* excimer lamp, 146 nm (drives the nuclear transition)',
       demo:'solid-state nuclear clock (²²⁹Th:CaF₂ crystal)'},
};
const SPE_ORDER = ['rb','cs','hg','yb','th'];

/* ================== derived transition quantities ================ */
function wavelenOf(s){ return SPE[s].lam || C/SPE[s].nu0; }   // m
function photonEV(s){ return H*SPE[s].nu0/EV; }               // eV
function Qof(s){ return SPE[s].nu0/SPE[s].dnu; }              // nu0/dnu

/* ==================== interrogation lineshapes ===================
   Detuning d in Hz from line centre. Rabi: single pulse of duration tp,
   Rabi angular frequency Om set to a pi-pulse (Om*tp = pi) so P(0)=1.
     Om_R = sqrt(Om^2 + (2 pi d)^2),   P = (Om^2/Om_R^2) sin^2(Om_R tp/2).
   Ramsey: two pi/2 pulses split by free time T -> fringes of period 1/T,
   central-fringe FWHM 1/(2T); drawn as cos^2(pi d T) under a Rabi envelope
   of width ~1/tp (tp taken as a short fraction of T).                      */
function rabiP(d, tp){
  const Om = PI/tp, wd = TAU*d;
  const OmR = Math.sqrt(Om*Om + wd*wd);
  const s = Math.sin(OmR*tp/2);
  return (Om*Om/(OmR*OmR))*s*s;
}
function ramseyP(d, T){
  const tp = T*0.1;                       // pulse width = 10% of free time
  const Om = PI/(2*tp), wd = TAU*d;        // pi/2 pulses
  const OmR = Math.sqrt(Om*Om + wd*wd);
  const env = (Om*Om/(OmR*OmR))*Math.pow(Math.sin(OmR*tp/2)/Math.sin(Om*tp/2),2);
  const c = Math.cos(PI*d*T);
  return Math.max(0, env*c*c);
}
function lorentzP(d, fwhm){                // incoherent crystal absorption line
  const hw = fwhm/2; return 1/(1+(d/hw)*(d/hw));
}

/* ===================== clock stability (Allan) ===================
   Quantum-projection-noise floor for a passive standard interrogated with
   N atoms per cycle of duration T_c:
       sigma_y(tau) = (1/pi Q) (1/sqrt N) sqrt(T_c/tau).
   The frequency-discriminator (shot-noise) form used for the lamp-pumped
   nuclear clock, signal S on background B:
       sigma_y(tau) = sqrt(S+B) / (pi Q S sqrt(tau)).                        */
function sigYqpn(Q, N, Tc, tau){ return (1/(PI*Q))*(1/Math.sqrt(N))*Math.sqrt(Tc/tau); }
function sigYdisc(Q, S, B, tau){ return Math.sqrt(S+B)/(PI*Q*S*Math.sqrt(tau)); }

/* ============ Kr2-lamp / 229Th photon budget (radiance bound) ====
   All anchored to Zhang et al., Nature 633, 63 (2024) and the project's
   kr2_photon_budget_v2.py. Radiance, not power, sets the deliverable
   irradiance: no passive optic (or count of incoherent lamps) beats L_nu.  */
const TH = {
  nu0: 2.020407384335e15, tau_iso: 641.0,
  A21: 1/641.0, ge_gg: 4/6,
  lamPk: 146.0, lamFWHM: 14.0, thLine: 148.382,   // nm
  Asrc: 1e-2, nHost: 1.46,                          // m^2 ; CaF2/MgF2 index @148 nm
};
function sigmaInt(){                        // integrated cross section [m^2 Hz]
  const lam0 = C/TH.nu0;
  return (lam0*lam0/(8*PI))*TH.ge_gg*TH.A21;
}
function sigmaPk(){                          // peak cross section [m^2]
  const lam0 = C/TH.nu0;
  return (lam0*lam0/(2*PI))*TH.ge_gg;
}
function krShape(){                          // Kr2 spectral density at the Th line / peak
  const sig = TH.lamFWHM/(2*Math.sqrt(2*Math.log(2)));
  return Math.exp(-0.5*Math.pow((TH.thLine-TH.lamPk)/sig,2));
}
function lampExitance(P){                    // M_nu = pi L_nu  [W/m^2/Hz]
  const dnuLam = C*(TH.lamFWHM*1e-9)/Math.pow(TH.lamPk*1e-9,2);
  return (P/TH.Asrc)/dnuLam*krShape();
}
/* Full chain. p = {P, eps, dnu, surround, bright, filter, N}. */
function thBudget(p){
  const Mnu = lampExitance(p.P);
  const eta = p.surround ? 0.66 : 0.37;
  const G   = p.surround ? 3.0  : 1.0;
  const imm = p.surround ? TH.nHost*TH.nHost : 1.0;
  const br  = p.bright ? 3.0 : 1.0;
  const Enu = eta*G*br*Mnu*imm;
  const ceil = 4.0*Mnu*TH.nHost*TH.nHost;    // brightness ceiling: full 4pi surround + n^2 immersion (always)
  const sInt = sigmaInt();
  const R1 = (Enu/(H*TH.nu0))*sInt;
  const N = p.N, Rtot = N*R1;
  const S = p.eps*Rtot;
  const SB = p.filter ? 1.5 : 0.15;
  const B = S/SB;
  const Q = TH.nu0/p.dnu;
  const s1 = sigYdisc(Q,S,B,1.0), sday = sigYdisc(Q,S,B,86400.0);
  const lock = S/Math.sqrt(B);               // detected signal / sqrt(background)
  const act = N*Math.log(2)/(7917*YR);       // Bq (t_1/2(229Th)=7917 yr)
  return {Mnu:Mnu, Lnu:Mnu/PI, Enu:Enu, ceil:ceil, sInt:sInt, R1:R1, Rtot:Rtot,
          S:S, B:B, SB:SB, Q:Q, s1:s1, sday:sday, lock:lock, act:act,
          eta:eta, G:G, imm:imm, br:br, N:N};
}

/* ============ CIE colour (Wyman-Sloan-Shirley fit) ==============
   Shared with blackbody_radiation.html / scattering.html / refraction.html. */
function lobe(x,mu,s1,s2){ const s=x<mu?s1:s2, d=(x-mu)/s; return Math.exp(-0.5*d*d); }
function cieX(l){ return 1.056*lobe(l,599.8,37.9,31.0)+0.362*lobe(l,442.0,16.0,26.7)
                       -0.065*lobe(l,501.1,20.4,26.2); }
function cieY(l){ return 0.821*lobe(l,568.8,46.9,40.5)+0.286*lobe(l,530.9,16.3,31.1); }
function cieZ(l){ return 1.217*lobe(l,437.0,11.8,36.0)+0.681*lobe(l,459.0,26.0,13.8); }
function srgbGamma(v){ return v<=0.0031308 ? 12.92*v : 1.055*Math.pow(v,1/2.4)-0.055; }
function xyzToRgb(X,Y,Z){
  let r= 3.2406*X-1.5372*Y-0.4986*Z, g=-0.9689*X+1.8758*Y+0.0415*Z,
      b= 0.0557*X-0.2040*Y+1.0570*Z;
  const m=Math.max(r,g,b);
  if (m<=0) return [0,0,0];
  r=Math.max(0,r)/m; g=Math.max(0,g)/m; b=Math.max(0,b)/m;
  return [srgbGamma(r),srgbGamma(g),srgbGamma(b)];
}
function spectralRgb(lnm){ if (lnm<380||lnm>780) return null; return xyzToRgb(cieX(lnm),cieY(lnm),cieZ(lnm)); }
const UV_RGB=[0.55,0.40,0.98];              // stand-in colour for VUV (<380 nm)
function spectralRgbSafe(lnm){ if (lnm<380) return UV_RGB; if (lnm>750) return [0.34,0.16,0.11];
  return spectralRgb(lnm)||[0.34,0.16,0.11]; }
function cssOf(rgb,a){ const r=Math.round(255*rgb[0]),g=Math.round(255*rgb[1]),b=Math.round(255*rgb[2]);
  return a===undefined ? 'rgb('+r+','+g+','+b+')' : 'rgba('+r+','+g+','+b+','+a+')'; }
function colOf(s){                            // display colour of a species
  const S=SPE[s];
  if (S.col) return S.col;
  if (S.kind==='nuclear') return UV_RGB;
  return spectralRgbSafe((S.lam||5e-7)*1e9);
}

/* ============================ formatters ========================= */
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
           '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(n){ return String(n).split('').map(c=>SUP[c]||c).join(''); }
function sci(x,dig){ if(!isFinite(x)||x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x))); const m=x/Math.pow(10,e);
  return m.toFixed(dig===undefined?2:dig)+'×10'+sup(e); }
function fmtHz(f){
  if(f>=1e15)return (f/1e15).toFixed(6)+' PHz';
  if(f>=1e12)return (f/1e12).toFixed(6)+' THz';
  if(f>=1e9) return (f/1e9).toFixed(6)+' GHz';
  if(f>=1e6) return (f/1e6).toFixed(4)+' MHz';
  if(f>=1e3) return (f/1e3).toFixed(3)+' kHz';
  return f.toFixed(3)+' Hz';
}
function fmtDnu(f){
  if(f>=1e6)return (f/1e6).toFixed(2)+' MHz';
  if(f>=1e3)return (f/1e3).toFixed(0)+' kHz';
  if(f>=1)  return f.toFixed(2)+' Hz';
  return (f*1e3).toFixed(1)+' mHz';
}
function fmtLam(m){ const nm=m*1e9;
  if(nm>=1e7)return (nm/1e7).toFixed(2)+' cm';
  if(nm>=1e6)return (nm/1e6).toFixed(2)+' mm';
  if(nm>=1e3)return (nm/1e3).toFixed(2)+' µm';
  return nm.toFixed(3)+' nm'; }
function fmtTime(s){
  if(s<90)return s.toFixed(0)+' s';
  if(s<5400)return (s/60).toFixed(1)+' min';
  if(s<1.7*86400)return (s/3600).toFixed(1)+' h';
  if(s<400*86400)return (s/86400).toFixed(1)+' d';
  return (s/YR).toFixed(1)+' yr'; }
function commas(n){ return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function fmtN(x,d){ return x.toFixed(d===undefined?4:d); }

/* ======================== state & clamp ========================= */
const DEFAULTS={ view:'mechanism', species:'cs', mode:'ramsey', logT:-0.3, logTau:0,
                 thPreset:'v1', logDnu:Math.log10(300e3), P:30, epsPct:0.3,
                 surround:false, bright:false, filter:false, speed:1 };
function clampState(s){
  const c=Object.assign({},s);
  const f=(v,lo,hi)=>Math.max(lo,Math.min(hi,(+v||0)));
  if (['mechanism','resonance','stability','thorium'].indexOf(c.view)<0) c.view='mechanism';
  if (!SPE[c.species]) c.species='cs';
  if (['ramsey','rabi'].indexOf(c.mode)<0) c.mode='ramsey';
  c.logT=f(c.logT,-2.3,1.0); c.logTau=f(c.logTau,0,7);
  c.logDnu=f(c.logDnu,3.0,6.0); c.P=f(c.P,5,120); c.epsPct=f(c.epsPct,0.1,5);
  c.speed=f(c.speed,0,3);
  c.surround=!!c.surround; c.bright=!!c.bright; c.filter=!!c.filter;
  if (['v1','v2a','v2b','custom'].indexOf(c.thPreset)<0) c.thPreset='v1';
  return c;
}

/* ============================ boot (UI) ========================== */
function boot(){
  const $=id=>document.getElementById(id);
  const cv=$('wave'), ctx=cv.getContext('2d');
  if (!ctx) return;
  const dpr=(typeof window!=='undefined' && window.devicePixelRatio)||1;

  let state=clampState(Object.assign({},DEFAULTS));
  let W=940, HGT=620, paused=false, t=0;
  let geom={};
  // servo (mechanism view): fractional-error trace
  let servoY=5e-9, servoTrace=[], cyc=0, secs=0;

  /* ------------------------- primitives ------------------------- */
  function stageBox(){ return {x0:20, y0:22, x1:W-20, y1:HGT-18}; }
  function clear(){ ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,HGT); }
  function roundRect(x,y,w,h,r){ ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function arrow(x0,y0,x1,y1,col,wd){
    ctx.strokeStyle=col; ctx.lineWidth=wd||1.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    const a=Math.atan2(y1-y0,x1-x0), s=6;
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x1,y1);
    ctx.lineTo(x1-s*Math.cos(a-0.4),y1-s*Math.sin(a-0.4));
    ctx.lineTo(x1-s*Math.cos(a+0.4),y1-s*Math.sin(a+0.4));
    ctx.closePath(); ctx.fill();
  }
  function txt(s,x,y,col,font,al,ba){ ctx.fillStyle=col; ctx.font=font||'12px -apple-system, sans-serif';
    ctx.textAlign=al||'left'; ctx.textBaseline=ba||'alphabetic'; ctx.fillText(s,x,y); }

  // a small two-level energy diagram with the clock transition arrow
  function energyLevels(x,y,w,h,S){
    const col=colOf(S.key), rgb=cssOf(col);
    const yLo=y+h-14, yHi=y+16;
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+10,yLo); ctx.lineTo(x+w-10,yLo); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+10,yHi); ctx.lineTo(x+w-10,yHi); ctx.stroke();
    txt('|'+S.eHi+'⟩', x+w-8, yHi-6, 'rgba(255,255,255,.8)','11px -apple-system','right');
    txt('|'+S.eLo+'⟩', x+w-8, yLo+13, 'rgba(255,255,255,.8)','11px -apple-system','right');
    const ax=x+w*0.32;
    arrow(ax,yLo,ax,yHi,rgb,2);                 // absorption
    // a little wavy/label for the quantum being exchanged
    const tag = S.kind==='microwave' ? 'microwave' : S.kind==='optical' ? 'photon' : 'γ (VUV)';
    txt(tag, ax+8, (yLo+yHi)/2, rgb,'10.5px -apple-system','left','middle');
    txt(S.sym, x+10, y+12, '#fff','12px -apple-system','left','top');
    txt('ν₀ '+fmtHz(S.nu0), x+10, yLo+13, rgb,'10.5px "SF Mono", monospace','left');
  }

  /* ===================== MECHANISM view ===================== */
  function drawMechanism(){
    clear();
    const b=stageBox(), S=SPE[state.species], col=colOf(state.species), rgb=cssOf(col);
    const Q=Qof(state.species);
    const s1=sigYqpn(Q,S.N,S.Tc,1.0);          // per-second QPN

    // --- region A: energy levels (left) + LO oscillation & tick counter (right)
    const aY=b.y0, aH=132;
    energyLevels(b.x0, aY, 190, aH, S);
    // LO travelling wave
    const ox=b.x0+210, ow=b.x1-ox, oyc=aY+40;
    ctx.save(); ctx.beginPath(); ctx.rect(ox,aY+4,ow,72); ctx.clip();
    ctx.strokeStyle=rgb; ctx.lineWidth=1.8; ctx.beginPath();
    const kx=0.14, amp=24;
    for(let i=0;i<=ow;i++){ const ph=(i*kx - t*2.6*state.speed);
      const yy=oyc + amp*Math.sin(ph); if(i===0)ctx.moveTo(ox+i,yy); else ctx.lineTo(ox+i,yy); }
    ctx.stroke();
    // tick marks at crests
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<=ow;i++){ const ph=(i*kx - t*2.6*state.speed);
      if(Math.abs(Math.sin(ph)-1)<0.004){ ctx.fillRect(ox+i-0.5,oyc-amp-6,1,6); } }
    ctx.restore();
    txt('local oscillator  ν = ν₀(1+y)', ox, aY+2, 'rgba(255,255,255,.7)','11px -apple-system','left','top');
    // "counts N0 periods -> 1 s" progress bar
    const N0=S.nu0;
    if(!paused){ cyc += 0.017*state.speed*(1+0.0); if(cyc>=1){ cyc-=1; secs++; } }
    const barY=aY+92, barW=ow;
    txt('one second ≡ '+commas(Math.round(N0))+' periods', ox, barY-4,
        'rgba(255,255,255,.6)','11px -apple-system','left','bottom');
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(ox,barY,barW,10);
    ctx.fillStyle=cssOf(col,0.8); ctx.fillRect(ox,barY,barW*cyc,10);
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.strokeRect(ox+0.5,barY+0.5,barW,10);
    txt('ticks counted → seconds: '+secs+'   (illustrative, slowed)', ox, barY+24,
        'rgba(255,255,255,.55)','10.5px -apple-system','left');

    // --- region B: the locked feedback loop
    const bY=aY+aH+18, bH=126;
    const bw=(b.x1-b.x0-2*22)/3, bxs=[b.x0, b.x0+bw+22, b.x0+2*(bw+22)];
    const boxes=[['local oscillator','quartz / laser / VUV', rgb],
                 ['reference '+S.sym, S.trans, 'rgba(255,255,255,.8)'],
                 ['discriminator','error ∝ P₊ − P₋','rgba(255,255,255,.8)']];
    for(let i=0;i<3;i++){
      ctx.strokeStyle=(i===0)?rgb:'rgba(255,255,255,.3)'; ctx.lineWidth=1.3;
      roundRect(bxs[i],bY,bw,bH-30,7); ctx.stroke();
      txt(boxes[i][0], bxs[i]+bw/2, bY+22, '#fff','12.5px -apple-system','center');
      // wrap the subtitle
      wrapText(boxes[i][1], bxs[i]+bw/2, bY+40, bw-16, 14, boxes[i][2],'10.5px -apple-system','center');
    }
    // forward arrows
    arrow(bxs[0]+bw, bY+(bH-30)/2, bxs[1], bY+(bH-30)/2, 'rgba(255,255,255,.55)',1.5);
    txt('interrogate', (bxs[0]+bw+bxs[1])/2, bY+(bH-30)/2-6,'rgba(255,255,255,.55)','10px -apple-system','center','bottom');
    arrow(bxs[1]+bw, bY+(bH-30)/2, bxs[2], bY+(bH-30)/2, 'rgba(255,255,255,.55)',1.5);
    txt('measure P', (bxs[1]+bw+bxs[2])/2, bY+(bH-30)/2-6,'rgba(255,255,255,.55)','10px -apple-system','center','bottom');
    // feedback arrow (correct) running back underneath
    const fy=bY+bH-4;
    ctx.strokeStyle=cssOf(col,0.8); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(bxs[2]+bw/2,bY+bH-30); ctx.lineTo(bxs[2]+bw/2,fy);
    ctx.lineTo(bxs[0]+bw/2,fy); ctx.stroke();
    arrow(bxs[0]+bw/2, fy, bxs[0]+bw/2, bY+bH-30, cssOf(col,0.8),1.5);
    txt('steer ν → ν₀  (correct y)', (bxs[0]+bxs[2])/2+bw/2, fy-5, cssOf(col,0.85),'10.5px -apple-system','center','bottom');

    // --- region C: servo settling |y(t)|
    const cY=bY+bH+16, cH=b.y1-(bY+bH+16);
    // advance the servo model: y_{n+1} = (1-g) y - g*noise
    if(!paused && state.speed>0){
      const g=0.18;                       // loop gain
      const noise=(Math.random()*2-1)*s1*4; // per-cycle QPN-scale measurement noise
      servoY=(1-g)*servoY - g*noise;
      servoTrace.push(Math.abs(servoY)+1e-21);
      if(servoTrace.length>260) servoTrace.shift();
    }
    // frame
    const gx0=b.x0+46, gx1=b.x1-8, gy0=cY+14, gy1=b.y1-16;
    const yTop=1e-8, yBot=Math.max(1e-19, s1/6);
    const L=v=>{ const lv=Math.log10(Math.max(yBot,Math.min(yTop,v)));
      return gy1-(gy1-gy0)*(lv-Math.log10(yBot))/(Math.log10(yTop)-Math.log10(yBot)); };
    txt('servo settling  |y(t)| — fractional frequency error', gx0, cY+2,'rgba(255,255,255,.7)','11px -apple-system','left','top');
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1;
    for(let e=Math.ceil(Math.log10(yBot)); e<=Math.log10(yTop); e++){
      const yy=L(Math.pow(10,e)); ctx.beginPath(); ctx.moveTo(gx0,yy); ctx.lineTo(gx1,yy); ctx.stroke();
      txt('10'+sup(e), gx0-4, yy, '#777','10px "SF Mono", monospace','right','middle');
    }
    // QPN floor line
    const yf=L(s1); ctx.setLineDash([4,4]); ctx.strokeStyle=cssOf(col,0.8);
    ctx.beginPath(); ctx.moveTo(gx0,yf); ctx.lineTo(gx1,yf); ctx.stroke(); ctx.setLineDash([]);
    txt('QPN σᵧ(1s) = '+sci(s1), gx1-2, yf-4, cssOf(col,0.9),'10.5px "SF Mono", monospace','right','bottom');
    // the trace
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.beginPath();
    const n=servoTrace.length;
    for(let i=0;i<n;i++){ const xx=gx0+(gx1-gx0)*i/259, yy=L(servoTrace[i]);
      if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
    ctx.stroke();

    geom={view:'mechanism'};
    $('roMain').textContent=S.label;
    $('roSub').className='sub'; $('roSub').textContent='ν₀ = '+fmtHz(S.nu0);
    $('roSub2').className='sub'; $('roSub2').textContent='Q = '+sci(Q,1)+'   ('+S.kind+')';
    $('roSub3').className='sub good'; $('roSub3').textContent='σᵧ(1s) ≈ '+sci(s1)+'  (shot-noise)';
  }
  function wrapText(s,cx,y,maxw,lh,col,font,al){
    ctx.font=font||'11px -apple-system'; ctx.textAlign=al||'center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle=col;
    const words=s.split(' '); let line='', yy=y;
    for(const w of words){ const test=line?line+' '+w:w;
      if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,cx,yy); line=w; yy+=lh; }
      else line=test; }
    if(line)ctx.fillText(line,cx,yy);
  }

  /* ===================== RESONANCE view ===================== */
  function drawResonance(){
    clear();
    const b=stageBox(), S=SPE[state.species], col=colOf(state.species), rgb=cssOf(col);
    const px0=b.x0+50, py0=b.y0+30, px1=b.x1-16, py1=b.y1-42;
    const pw=px1-px0, ph=py1-py0;
    const isTh=(S.kind==='nuclear');
    const T=Math.pow(10,state.logT);           // interrogation time (s)
    // line width & axis span
    let fwhm, mode;
    if(isTh){ fwhm=S.dnu; mode='crystal'; }
    else if(state.mode==='rabi'){ fwhm=0.799/T; mode='rabi'; }   // Rabi FWHM ~ 0.799/tp
    else { fwhm=1/(2*T); mode='ramsey'; }
    const span=isTh? fwhm*4 : (state.mode==='rabi'? fwhm*3.2 : fwhm*7);
    const X=d=>px0+pw*(d+span)/(2*span), Yv=v=>py1-ph*v;
    // frame
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1;
    for(let v=0;v<=1.001;v+=0.25){ const yy=Yv(v);
      ctx.beginPath(); ctx.moveTo(px0,yy); ctx.lineTo(px1,yy); ctx.stroke();
      txt(v.toFixed(2), px0-8, yy, '#888','11px -apple-system','right','middle'); }
    // x ticks
    for(let k=-1;k<=1;k++){ const d=k*span, xx=X(d);
      ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.beginPath();
      ctx.moveTo(xx,py0); ctx.lineTo(xx,py1); ctx.stroke();
      txt((k===0?'0':(k>0?'+':'−')+fmtDnu(Math.abs(d))), xx, py1+6,'#888','10.5px -apple-system','center','top'); }
    txt('detuning  ν − ν₀', (px0+px1)/2, HGT-6,'rgba(255,255,255,.6)','11px -apple-system','center','bottom');
    ctx.save(); ctx.translate(b.x0+10,(py0+py1)/2); ctx.rotate(-PI/2);
    txt('excitation probability  P', 0,0,'rgba(255,255,255,.6)','11px -apple-system','center','top'); ctx.restore();

    // the lineshape
    const P = d => isTh? lorentzP(d,fwhm) : (state.mode==='rabi'? rabiP(d,T) : ramseyP(d,T));
    ctx.strokeStyle=rgb; ctx.lineWidth=1.9; ctx.beginPath();
    for(let i=0;i<=pw;i++){ const d=-span+2*span*i/pw, xx=px0+i, yy=Yv(Math.max(0,Math.min(1,P(d))));
      if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
    ctx.stroke();
    // shade under central feature
    ctx.fillStyle=cssOf(col,0.10);
    ctx.beginPath(); ctx.moveTo(px0,py1);
    for(let i=0;i<=pw;i++){ const d=-span+2*span*i/pw; ctx.lineTo(px0+i,Yv(Math.max(0,Math.min(1,P(d))))); }
    ctx.lineTo(px1,py1); ctx.closePath(); ctx.fill();

    // FWHM markers + the two servo probe points at +/- fwhm/2
    const halfd=fwhm/2;
    ctx.setLineDash([3,4]); ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1;
    for(const d of [-halfd,halfd]){ ctx.beginPath(); ctx.moveTo(X(d),Yv(0)); ctx.lineTo(X(d),Yv(0.5)); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(X(-halfd),Yv(0.5)); ctx.lineTo(X(halfd),Yv(0.5)); ctx.stroke(); ctx.setLineDash([]);
    txt('Δν = '+fmtDnu(fwhm), X(0), Yv(0.5)-6, 'rgba(255,255,255,.8)','11px -apple-system','center','bottom');
    // servo probe dots
    if(!isTh){ ctx.fillStyle=cssOf(col,0.95);
      for(const d of [-halfd,halfd]){ ctx.beginPath(); ctx.arc(X(d),Yv(P(d)),3.4,0,TAU); ctx.fill(); }
      txt('servo probes ±Δν/2 (steepest slope)', X(0), py0+2,'rgba(255,255,255,.55)','10.5px -apple-system','center','top'); }

    const Q=S.nu0/fwhm;
    geom={view:'resonance'};
    $('roMain').textContent=S.label+'  —  '+(isTh?'crystal line':(state.mode==='rabi'?'Rabi':'Ramsey'));
    $('roSub').className='sub';
    $('roSub').textContent=isTh? 'inhomogeneous crystal line' : ('interrogation T = '+fmtTime(T));
    $('roSub2').className='sub'; $('roSub2').textContent='Δν = '+fmtDnu(fwhm);
    $('roSub3').className='sub good'; $('roSub3').textContent='Q = ν₀/Δν = '+sci(Q,2);
  }

  /* ===================== STABILITY view ===================== */
  function stabCurves(){
    // QPN curves for the atomic species + the two Th discriminator curves.
    const out=[];
    for(const k of ['rb','cs','hg','yb']){ const S=SPE[k];
      out.push({key:k, label:S.label, col:colOf(k),
        f:tau=>sigYqpn(Qof(k),S.N,S.Tc,tau), kind:'qpn'}); }
    // Th today (300 kHz crystal, v1 budget) and improved (10 kHz, v2a)
    const bNow=thBudget({P:30,eps:0.003,dnu:300e3,surround:false,bright:false,filter:false,N:5e17});
    const bImp=thBudget({P:30,eps:0.03,dnu:10e3,surround:true,bright:false,filter:true,N:5e17});
    out.push({key:'th', label:'²²⁹ᵐTh  crystal (300 kHz, lamp)', col:UV_RGB,
      f:tau=>sigYdisc(bNow.Q,bNow.S,bNow.B,tau), kind:'th'});
    out.push({key:'thi', label:'²²⁹ᵐTh  narrow crystal (10 kHz)', col:[0.80,0.55,1.0],
      f:tau=>sigYdisc(bImp.Q,bImp.S,bImp.B,tau), kind:'thi', dash:true});
    return out;
  }
  function drawStability(){
    clear();
    const b=stageBox();
    const px0=b.x0+52, py0=b.y0+16, px1=b.x1-172, py1=b.y1-40;
    const pw=px1-px0, ph=py1-py0;
    const tauMin=1, tauMax=1e7, yTop=1e-11, yBot=1e-19;
    const Lx=tau=>px0+pw*(Math.log10(tau)-0)/(Math.log10(tauMax)-0);
    const Ly=v=>py1-ph*(Math.log10(v)-Math.log10(yBot))/(Math.log10(yTop)-Math.log10(yBot));
    // grid
    ctx.strokeStyle='rgba(255,255,255,.09)'; ctx.lineWidth=1;
    for(let e=0;e<=7;e++){ const xx=Lx(Math.pow(10,e));
      ctx.beginPath(); ctx.moveTo(xx,py0); ctx.lineTo(xx,py1); ctx.stroke();
      txt('10'+sup(e), xx, py1+6,'#888','10px "SF Mono", monospace','center','top'); }
    for(let e=-19;e<=-11;e++){ const yy=Ly(Math.pow(10,e));

  /* ========================= controls ========================= */
  function applyThPreset(name){
    state.thPreset=name;
    if(name==='v1'){ state.logDnu=Math.log10(300e3); state.P=30; state.epsPct=0.3;
      state.surround=false; state.bright=false; state.filter=false; }
    else if(name==='v2a'){ state.logDnu=Math.log10(10e3); state.P=30; state.epsPct=3;
      state.surround=true; state.bright=false; state.filter=true; }
    else if(name==='v2b'){ state.logDnu=Math.log10(1e3); state.P=30; state.epsPct=3;
      state.surround=true; state.bright=true; state.filter=true; }
  }
  function syncControls(){
    for(const [id,v] of [['viewM','mechanism'],['viewR','resonance'],['viewB','stability'],['viewT','thorium']])
      $(id).classList.toggle('on', state.view===v);
    for(const k of SPE_ORDER) $('sp'+k[0].toUpperCase()+k[1]).classList.toggle('on', state.species===k);
    $('mRamsey').classList.toggle('on', state.mode==='ramsey');
    $('mRabi').classList.toggle('on', state.mode==='rabi');
    for(const [id,v] of [['thV1','v1'],['thV2a','v2a'],['thV2b','v2b']])
      $(id).classList.toggle('on', state.thPreset===v);
    $('thGeom').classList.toggle('on', state.surround);
    $('thBright').classList.toggle('on', state.bright);
    $('thFilter').classList.toggle('on', state.filter);
    const T=Math.pow(10,state.logT); $('eTint').value=state.logT; $('eTintVal').textContent=fmtTime(T);
    const tau=Math.pow(10,state.logTau); $('eTau').value=state.logTau; $('eTauVal').textContent=fmtTime(tau);
    const dnu=Math.pow(10,state.logDnu); $('eDnu').value=state.logDnu; $('eDnuVal').textContent=fmtDnu(dnu);
    $('eP').value=state.P; $('ePVal').textContent=state.P.toFixed(0)+' W';
    $('eEps').value=state.epsPct; $('eEpsVal').textContent=state.epsPct.toFixed(1)+'%';
    $('eSpeed').value=state.speed; $('eSpeedVal').textContent=state.speed.toFixed(1)+'×';
    // group visibility
    const v=state.view;
    $('grpSpecies').hidden = (v==='thorium');
    $('grpResonance').hidden = (v!=='resonance');
    $('grpStab').hidden = (v!=='stability');
    $('grpTh').hidden = (v!=='thorium');
    $('grpAnim').hidden = (v!=='mechanism');
    // Ramsey/Rabi toggle disabled for thorium species (nuclear)
    const nuc = SPE[state.species].kind==='nuclear';
    $('mRamsey').style.opacity = nuc?0.4:1; $('mRabi').style.opacity = nuc?0.4:1;
  }
  function applyChange(){ state=clampState(state); syncControls(); updateHint(); updateInfo(); }
  function chip(id,fn){ $(id).addEventListener('click',()=>{ fn(); applyChange(); }); }
  chip('viewM',()=>state.view='mechanism'); chip('viewR',()=>state.view='resonance');
  chip('viewB',()=>state.view='stability');
  chip('viewT',()=>{ state.view='thorium'; state.species='th'; });
  for(const k of SPE_ORDER){ const id='sp'+k[0].toUpperCase()+k[1];
    chip(id,()=>{ state.species=k; if(state.view==='thorium') state.view='mechanism';
      servoY=5e-9; servoTrace=[]; secs=0; cyc=0; }); }
  chip('mRamsey',()=>state.mode='ramsey'); chip('mRabi',()=>state.mode='rabi');
  chip('thV1',()=>applyThPreset('v1')); chip('thV2a',()=>applyThPreset('v2a')); chip('thV2b',()=>applyThPreset('v2b'));
  chip('thGeom',()=>{ state.surround=!state.surround; state.thPreset='custom'; });
  chip('thBright',()=>{ state.bright=!state.bright; state.thPreset='custom'; });
  chip('thFilter',()=>{ state.filter=!state.filter; state.thPreset='custom'; });
  function slider(id,key,fn){ $(id).addEventListener('input',()=>{ state[key]=+$(id).value;
    if(fn)fn(); applyChange(); }); }
  slider('eTint','logT'); slider('eTau','logTau');
  slider('eDnu','logDnu',()=>state.thPreset='custom');
  slider('eP','P',()=>state.thPreset='custom');
  slider('eEps','epsPct',()=>state.thPreset='custom');
  $('eSpeed').addEventListener('input',()=>{ state.speed=+$('eSpeed').value; syncControls(); });
  function setPaused(p){ paused=p; $('pauseBtn').textContent=paused?'resume':'pause'; }
  $('pauseBtn').addEventListener('click',()=>setPaused(!paused));

  function resize(){
    W=cv.clientWidth||940; HGT=cv.clientHeight||620;
    cv.width=Math.round(W*dpr); cv.height=Math.round(HGT*dpr);
    if(ctx.setTransform) ctx.setTransform(dpr,0,0,dpr,0,0); else ctx.scale(dpr,dpr);
  }
  if(typeof window!=='undefined') window.addEventListener('resize',()=>resize());

  function frame(){
    if(!paused) t+=0.016*(state.speed||0.0001);
    drawView();
    requestAnimationFrame(frame);
  }
  resize(); syncControls(); updateHint(); updateInfo();
  requestAnimationFrame(frame);
}

/* =========================== self-test =========================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond){ pass++; console.log('ok — '+name); }
                          else { fail++; console.log('FAIL — '+name); } };
  const rel=(a,b)=>Math.abs(a/b-1);
  const close=(a,b,tol)=>Math.abs(a/b-1) < (tol===undefined?1e-9:tol);   // boolean predicate

  /* --- transition anchors --- */
  ok(SPE.cs.nu0===9192631770,'Cs-133 nu0 = 9 192 631 770 Hz exactly (the SI second)');
  ok(close(SPE.rb.nu0,6.834682610904e9,1e-15),'Rb-87 nu0 = 6.834 682 610 904 GHz');
  ok(close(SPE.hg.nu0,40.5073479968e9,1e-12),'Hg-199+ nu0 = 40.507 GHz');
  ok(close(SPE.yb.nu0,5.18295836590863e14,1e-14),'Yb-171 nu0 = 518.296 THz');
  ok(close(SPE.th.nu0,2.020407384335e15,1e-14),'Th-229m nu0 = 2.020 PHz');
  ok(close(wavelenOf('cs'),0.032612,1e-3),'lambda(Cs) = 3.26 cm (microwave)');
  ok(close(wavelenOf('hg'),7.401e-3,1e-3),'lambda(Hg+) = 7.40 mm');
  ok(close(wavelenOf('yb'),578.42e-9,1e-4),'lambda(Yb) = 578.42 nm (optical)');
  ok(close(wavelenOf('th'),148.382e-9,1e-4),'lambda(Th) = 148.382 nm (VUV)');
  ok(close(photonEV('th'),8.356,2e-3),'E(Th) = 8.356 eV');
  ok(close(photonEV('yb'),2.143,3e-3),'E(Yb) = 2.14 eV (yellow)');
  ok(SPE.th.nu0/SPE.cs.nu0>2e5,'Th nu0 is ~2.2e5 x the Cs nu0 (nuclear >> microwave)');

  /* --- Q = nu0/dnu --- */
  ok(close(Qof('cs'),9.19e9,1e-2),'Q(Cs) ~ 9.2e9 at 1 Hz line');
  ok(close(Qof('yb'),5.18e14,1e-2),'Q(Yb) ~ 5.2e14 at 1 Hz line');
  ok(close(Qof('th'),6.735e9,1e-2),'Q(Th) ~ 6.7e9 at the 300 kHz crystal line');
  ok(Qof('yb')>Qof('hg') && Qof('hg')>Qof('cs'),'optical Q > trapped-ion Q > fountain Q');

  /* --- Rabi lineshape: pi-pulse peak = 1, symmetric, decreasing --- */
  { const tp=0.5;
    ok(close(rabiP(0,tp),1,1e-9),'Rabi: on-resonance pi-pulse gives P = 1');
    ok(rabiP(0.4,tp)<rabiP(0.1,tp) && rabiP(0.1,tp)<1,'Rabi: P falls off resonance');
    ok(Math.abs(rabiP(0.3,tp)-rabiP(-0.3,tp))<1e-12,'Rabi lineshape is symmetric in detuning');
    // Rabi FWHM ~ 0.799/tp -> half-max at 0.799/(2 tp)
    const hw=0.799/tp/2; ok(Math.abs(rabiP(hw,tp)-0.5)<0.03,'Rabi FWHM ~ 0.799/tp (half-max at ~0.8/tp)'); }

  /* --- Ramsey: central fringe P(0)=1, first null at 1/(2T), revival at 1/T --- */
  { const T=1.0;
    ok(close(ramseyP(0,T),1,1e-6),'Ramsey: central fringe P(0) = 1');
    ok(ramseyP(0.5/T,T)<0.05,'Ramsey: first null at d = 1/(2T)');
    ok(ramseyP(1.0/T,T)>0.5,'Ramsey: fringe revives at d = 1/T (period 1/T)');
    const halfR = 1/(2*T)/2; ok(ramseyP(halfR,T)>0.4 && ramseyP(halfR,T)<0.6,'Ramsey half-max near 1/(4T)'); }

  /* --- Lorentzian crystal line --- */
  ok(close(lorentzP(0,300e3),1,1e-12),'crystal line peak P = 1 on resonance');
  ok(close(lorentzP(150e3,300e3),0.5,1e-9),'crystal line half-max at dnu/2 = 150 kHz');

  /* --- QPN stability: values & tau^-1/2 scaling --- */
  { const sCs=sigYqpn(Qof('cs'),SPE.cs.N,SPE.cs.Tc,1.0);
    ok(close(sCs,3.95e-14,0.1),'Cs QPN sigma_y(1s) ~ 4e-14');
    const sYb=sigYqpn(Qof('yb'),SPE.yb.N,SPE.yb.Tc,1.0);
    ok(close(sYb,6.1e-18,0.1),'Yb QPN sigma_y(1s) ~ 6e-18 (optical, far below microwave)');
    const sHg=sigYqpn(Qof('hg'),SPE.hg.N,SPE.hg.Tc,1.0);
    ok(close(sHg,3.14e-16,0.1),'Hg+ QPN sigma_y(1s) ~ 3e-16 (trapped-ion microwave)');
    ok(close(sigYqpn(Qof('cs'),SPE.cs.N,SPE.cs.Tc,100)/sCs, 0.1, 1e-9),'sigma_y scales as tau^-1/2 (x1/10 at 100 s)');
    ok(sYb<sHg && sHg<sCs,'stability ladder: Yb < Hg+ < Cs at 1 s'); }

  /* ============ Kr2 / 229Th photon budget (vs kr2_photon_budget_v2.py) ============ */
  ok(close(sigmaInt(),9.11e-19,0.02),'integrated cross section int sigma dnu = 9.1e-19 m^2 Hz');
  ok(close(sigmaPk(),2.34e-15,0.02),'peak cross section sigma_pk = 2.3e-15 m^2 (~lambda^2)');
  ok(close(krShape(),0.923,0.01),'Kr2 covers the Th line at f_shape = 0.92 of peak');
  ok(close(lampExitance(30),1.406e-11,0.02),'lamp exitance M_nu = 1.4e-11 W/m^2/Hz at 30 W');
  // v1 baseline
  { const b1=thBudget({P:30,eps:0.003,dnu:300e3,surround:false,bright:false,filter:false,N:5e17});
    ok(close(b1.Enu,5.203e-12,0.02),'v1 E_nu = 5.2e-12 W/m^2/Hz');
    ok(close(b1.R1,3.542e-12,0.03),'v1 per-nucleus rate R1 = 3.5e-12 /s');
    ok(close(b1.Rtot,1.771e6,0.03),'v1 total rate R_tot = 1.8e6 isomer/s (flooded cm-crystal)');
    ok(close(b1.act,1.387e6,0.03),'flooded crystal activity ~ 1.4 MBq');
    ok(close(b1.S,5.31e3,0.03),'v1 detected signal S = 5.3e3 cps');
    ok(close(b1.s1,1.807e-12,0.03),'v1 sigma_y(1s) = 1.8e-12 (matches the paper)');
    ok(close(b1.sday,6.15e-15,0.03),'v1 sigma_y(1 day) = 6.1e-15');
    ok(b1.lock>1 && close(b1.lock,28,0.1),'v1 clears the lock floor: S/sqrt(B) ~ 28x (self-consistent B)');
    ok(close(b1.ceil/b1.Enu,23.05,0.03),'radiance ceiling (4 n^2 M_nu) ~ 23x v1'); }
  // v2a geometry
  { const b2=thBudget({P:30,eps:0.03,dnu:10e3,surround:true,bright:false,filter:true,N:5e17});
    ok(close(b2.Enu,5.936e-11,0.02),'v2a E_nu = 5.9e-11 (x11 geometry+immersion)');
    ok(close(b2.s1,2.613e-15,0.03),'v2a sigma_y(1s) = 2.6e-15');
    ok(close(b2.sday,8.89e-18,0.03),'v2a sigma_y(1 day) = 8.9e-18'); }
  // v2b brighter
  { const b3=thBudget({P:30,eps:0.03,dnu:1e3,surround:true,bright:true,filter:true,N:5e17});
    ok(close(b3.Enu,1.781e-10,0.02),'v2b E_nu = 1.8e-10 (x34, brighter source)');
    ok(close(b3.s1,1.509e-16,0.03),'v2b sigma_y(1s) = 1.5e-16'); }
  // t ~ Q^-2 : narrowing dnu 300k->10k improves sigma_y at fixed S,B by exactly 30x from Q alone
  { const S=5.31e3,B=S/0.15;
    const a=sigYdisc(TH.nu0/300e3,S,B,1), c=sigYdisc(TH.nu0/10e3,S,B,1);
    ok(close(a/c,30,1e-9),'sigma_y ~ 1/Q : 30x narrower line -> 30x better (t ~ Q^-2)'); }

  /* --- colour pipeline sanity (shared fit) --- */
  { const g=spectralRgb(550), b=spectralRgb(460), r=spectralRgb(660);
    ok(g[1]>0.99,'CIE: 550 nm reads green'); ok(b[2]>0.99,'460 nm reads blue');
    ok(r[0]>0.99,'660 nm reads red');
    ok(colOf('th')===UV_RGB,'Th (148 nm VUV) uses the UV stand-in colour'); }

  /* --- state clamp & formatters --- */
  { const st=clampState({view:'zz',species:'xx',mode:'q',logT:9,logTau:-3,logDnu:9,P:999,epsPct:99,speed:9});
    ok(st.view==='mechanism'&&st.species==='cs'&&st.mode==='ramsey'&&st.logT===1.0&&st.logTau===0&&
       st.logDnu===6.0&&st.P===120&&st.epsPct===5&&st.speed===3,'clampState pins to sane state'); }
  ok(fmtHz(9192631770)==='9.192632 GHz','fmtHz GHz'); ok(fmtDnu(300e3)==='300 kHz','fmtDnu kHz');
  ok(sci(1.8e-12,1)==='1.8×10⁻¹²','sci superscripts');

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================ entry ============================== */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
