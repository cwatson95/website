<title>The microwave background — recombination, the sound horizon, and the size of the observable universe</title>
<!--
  ===================================================================
  THE MICROWAVE BACKGROUND
  the oldest light there is: where it came from, what it is a picture
  of, and how big the universe has become since it was released
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, pulsar.html,
  diffraction.html, wind_tunnel.html and standard_candle.html: one flat file,
  no build step, no network, works opened straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS COMPUTES
  ------------------------------------------------------------------
  Six views, following the light from the fireball to the far side of the sky:

    the fireball    the thermal history.  T = T0(1+z) exactly, and the three
                    densities crossing: radiation over matter until z_eq, then
                    matter, then Lambda.  Every epoch marked is computed here.
    recombination   the Saha equation, solved in the page: the ionisation
                    fraction collapsing from 1 to 1e-4 over a few hundred in
                    redshift, and the visibility function that follows.  Saha
                    is an EQUILIBRIUM calculation and gets the redshift wrong
                    by ~280; the file says so and says why.
    the spectrum    the blackbody, and COBE/FIRAS's 43 measured points on it.
                    Expansion maps a blackbody onto a blackbody — an exact
                    statement, asserted — so this spectrum is a thermometer
                    reading of the universe at any redshift you like.
    the horizon     the "diameter of the universe": the particle horizon, the
                    Hubble length and the event horizon, all three, all
                    computed, and why 13.8 Gyr of light travel puts the edge
                    of the observable universe 46 Gly away.
    the sound       the sound horizon at recombination, integrated over the
                    real photon-baryon sound speed, and the angular scale it
                    subtends — against Planck's measured TT power spectrum.
    the geometry    what curvature would do to that angle, which is how the
                    spatial flatness of the universe is actually measured.

  ------------------------------------------------------------------
  WHAT IS MEASURED — retrieved whole, never transcribed
  ------------------------------------------------------------------
    * COBE/FIRAS CMB monopole spectrum, 43 points: Fixsen et al. 1996
      (ApJ 473, 576) Table 4, via the LAMBDA archive file
      `firas_monopole_spec_v1.txt`.  Frequency, monopole, residual, and the
      1-sigma uncertainty, exactly as published.
    * Planck 2018 TT power spectrum: the binned spectrum (83 bins, l = 47 to
      2499, with Planck's own best-fit LCDM curve) and the low-l end of the
      unbinned spectrum (l = 2 to 46), from the Planck Legacy ancillary files
      `COM_PowerSpect_CMB-TT-binned_R3.01.txt` and `-full_R3.01.txt`.
    * Planck 2018 VI (arXiv:1807.06209) Table 2, TT,TE,EE+lowE+lensing, read
      out of the paper: z_* = 1089.92 +/- 0.25, r_* = 144.43 +/- 0.26 Mpc,
      100 theta_* = 1.04110 +/- 0.00031, z_drag = 1059.94 +/- 0.30,
      r_drag = 147.09 +/- 0.26 Mpc, z_eq = 3402 +/- 26, H0 = 67.36 +/- 0.54,
      Age = 13.797 +/- 0.023 Gyr, Ob h^2 = 0.02237, Oc h^2 = 0.1200,
      Y_p = 0.2454.  These are the numbers the computed ones are checked
      against; they are not used as inputs to the calculation.

  ------------------------------------------------------------------
  WHAT IS EXACT, AND HOW WELL IT AGREES
  ------------------------------------------------------------------
  The background model is flat LCDM with photons and N_eff = 3.046 massless
  neutrinos.  From it, computed here and compared with Planck's own derived
  values for the same data:

      z_eq          3402.07   against 3402 +/- 26        (0.00 sigma)
      r_s(z_*)      144.44 Mpc against 144.43 +/- 0.26   (0.04 sigma)
      r_s(z_drag)   147.10 Mpc against 147.09 +/- 0.26   (0.04 sigma)
      age           13.814 Gyr against 13.797 +/- 0.023  (0.74 sigma)

  The one number that does NOT land inside a sigma is the acoustic angle,
  100 theta_* = 1.0396 against 1.04110 — and the reason is stated rather than
  absorbed: Planck's baseline includes one neutrino of mass 0.06 eV, counted
  as matter (Om h^2 = 0.1430 against Ob h^2 + Oc h^2 = 0.14237).  This file
  treats all three as massless radiation, which is what makes 1+z_eq = Om/Or
  exact.  Putting Planck's Om into the distance integral instead moves the
  computed angle from 4.9 sigma out to 1.6 sigma, which is the demonstration
  that the 0.06 eV neutrino is the whole of the discrepancy.  The sim draws
  both and says which is which.

  ------------------------------------------------------------------
  WHAT IS NOT MODELLED, and is said so on the canvas
  ------------------------------------------------------------------
  * The power spectrum.  C_l requires integrating the Boltzmann hierarchy for
    photons, baryons, cold dark matter and neutrinos through recombination.
    That is a Boltzmann code and it is not in this file.  The TT curve drawn
    is PLANCK'S OWN published best-fit, shipped in the same file as the data,
    and it is labelled as such on the canvas.  What this file does compute is
    the acoustic scale that sets where the peaks fall, and it gets the first
    peak at 0.745 l_A against a measured l = 225.
  * Non-equilibrium recombination.  Saha assumes the ionisation is in thermal
    equilibrium; real recombination is held up by the Lyman-alpha and 2s-1s
    bottleneck, so it finishes later and more slowly.  Saha puts x_e = 1/2 at
    z = 1370 where Planck measures z_* = 1090.  The file computes Saha, plots
    it, and states the size and the cause of the error.  Reproducing 1089.92
    needs the Peebles ODE, which is not here.
  * Reionization, lensing, foregrounds, polarisation, and any anisotropy at
    all.  There is no sky map in this file, because generating one from a
    power spectrum would be a random realisation and not a measurement.

  ------------------------------------------------------------------
  VERIFICATION
  ------------------------------------------------------------------
  selfTest() runs when there is no document (osascript -l JavaScript).  It
  asserts the blackbody against its Wien, Rayleigh-Jeans and Stefan-Boltzmann
  limits and against FIRAS; the invariance of a blackbody under expansion;
  the Saha equation against its own closed form and its limits; the horizons
  against the closed forms available in the matter-only and Lambda-only
  limits; the sound horizon and z_eq against Planck; and that every leading
  constant matches an absolute number.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* ================================================================== *
 *  COBE/FIRAS CMB MONOPOLE SPECTRUM                                   *
 *                                                                     *
 *  Fixsen et al. 1996, ApJ 473, 576, Table 4, retrieved as the LAMBDA *
 *  archive file firas_monopole_spec_v1.txt.  43 points, verbatim.     *
 *                                                                     *
 *  [nu (cm^-1), monopole (MJy/sr), residual (kJy/sr),                 *
 *   1-sigma uncertainty (kJy/sr), modelled Galaxy at the poles (kJy/sr)]
 *                                                                     *
 *  The monopole column is the archive's own sum of a 2.725 K blackbody *
 *  and the measured residual; the residual and its error are what the *
 *  instrument actually reports.  The residuals are ~2e-4 of the peak, *
 *  which is the entire content of "the most perfect blackbody known". *

 * ================================================================== */
/* B_nu in W m^-2 Hz^-1 sr^-1.  expm1 rather than exp(x)-1: at the
   Rayleigh-Jeans end x is 1e-3 and forming exp(x)-1 throws away three
   digits before the division ever happens. */
function planckNu(nu,T){
  if(!(nu>0)||!(T>0)) return 0;
  const x=H_PL*nu/(K_B*T);
  if(x>700) return 2*H_PL*nu*nu*nu/(C_LIGHT*C_LIGHT)*Math.exp(-x);
  return 2*H_PL*nu*nu*nu/(C_LIGHT*C_LIGHT)/Math.expm1(x);
}
/* per unit WAVELENGTH, which peaks somewhere else entirely */
function planckLam(lam,T){
  if(!(lam>0)||!(T>0)) return 0;
  const x=H_PL*C_LIGHT/(lam*K_B*T);
  if(x>700) return 2*H_PL*C_LIGHT*C_LIGHT/Math.pow(lam,5)*Math.exp(-x);
  return 2*H_PL*C_LIGHT*C_LIGHT/Math.pow(lam,5)/Math.expm1(x);
}
function planckMJy(nu,T){ return planckNu(nu,T)*1e20; }   /* MJy/sr */

/* the two Wien constants are roots of transcendental equations, so they
   are SOLVED here rather than quoted: x = n(1 - e^-x) for n = 3 and 5 */
function wienRoot(n){
  let lo=n*0.5, hi=n*2;
  const f=(x)=>n*(1-Math.exp(-x))-x;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(f(m)>0) lo=m; else hi=m; }
  return (lo+hi)/2;
}
const WIEN_NU=wienRoot(3), WIEN_LAM=wienRoot(5);
function peakNu(T){ return WIEN_NU*K_B*T/H_PL; }
function peakLam(T){ return H_PL*C_LIGHT/(WIEN_LAM*K_B*T); }
/* number density and energy density of a photon gas */
function photonN(T){ return 16*PI*ZETA3*Math.pow(K_B*T/(H_PL*C_LIGHT),3); }
function photonU(T){ return A_RAD*Math.pow(T,4); }
/* the mean photon energy, pi^4/(30 zeta3) kT */
const MEAN_PHOTON=Math.pow(PI,4)/(30*ZETA3);

/* ================================================================== *
 *  the background                                                     *
 *                                                                     *
 *  Flat LCDM with photons and N_eff massless neutrinos.  Treating all
 *  neutrinos as massless is what makes 1+z_eq = Om/Or exact; Planck's
 *  baseline instead counts one 0.06 eV neutrino as matter, and the sim
 *  shows what that does rather than hiding it.
 * ================================================================== */
function makeCosmo(H0,Obh2,Och2,Neff,T0,Ok){
  const h=H0/100;
  const rhoC100=3*Math.pow(100e3/MPC,2)/(8*PI*G_NEWT);   /* kg/m^3 at h=1 */
  const Ogh2=A_RAD*Math.pow(T0,4)/(C_LIGHT*C_LIGHT)/rhoC100;
  const nuFac=Neff*(7/8)*Math.pow(4/11,4/3);
  const Orh2=Ogh2*(1+nuFac);
  const Omh2=Obh2+Och2;
  const C={H0:H0,h:h,Obh2:Obh2,Och2:Och2,Omh2:Omh2,Ogh2:Ogh2,Orh2:Orh2,
           Neff:Neff,T0:T0,
           Og:Ogh2/(h*h), Or:Orh2/(h*h), Om:Omh2/(h*h),
           Ok:(Ok===undefined)?0:Ok};
  C.OL=1-C.Om-C.Or-C.Ok;
  C.H0si=H0*1e3/MPC;
  C.DH=C_KMS/H0;                      /* Hubble length, Mpc            */
  C.zeq=C.Omh2/C.Orh2-1;
  C.zBounce=bounceZ(C);          /* null unless it never reached a = 0    */
  C.zCollapse=collapseZ(C);      /* null unless it recollapses            */
  /* baryon and hydrogen number density today */
  C.nb0=Obh2*rhoC100/M_H;
  C.nH0=(1-PLANCK.Yp)*Obh2*rhoC100/M_H;
  C.eta=C.nb0/photonN(T0);
  return C;
}
/* E^2 can go NEGATIVE at both ends of the slider space, and both cases are
   real universes rather than arithmetic accidents:
     - a closed universe with too little matter never had a big bang (going
       back, E^2 hits zero and the scale factor bounces);
     - a universe with Lambda < 0 recollapses (going forward, E^2 hits zero).
   Ez returns NaN there, the two turning points are found once in makeCosmo,
   and everything downstream reports "—" and says why rather than drawing a
   plausible-looking line through a region that does not exist. */
function e2OfZ(z,C){
  const a=1+z;
  return C.Or*a*a*a*a + C.Om*a*a*a + C.Ok*a*a + C.OL;
}
function Ez(z,C){
  const e2=e2OfZ(z,C);
  return e2>0?Math.sqrt(e2):NaN;
}
/* the largest redshift this universe ever reached (null if it goes to a=0) */
function bounceZ(C){
  if(!(e2OfZ(0,C)>0)) return 0;
  let hi=null;
  for(let i=1;i<=300;i++){
    const z=Math.exp(Math.log(1.000001)+(Math.log(1e9)-Math.log(1.000001))*i/300)-1;
    if(!(e2OfZ(z,C)>0)){ hi=z; break; }
  }
  if(hi===null) return null;
  let lo=0;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(e2OfZ(m,C)>0) lo=m; else hi=m; }
  return lo;
}
/* the least redshift it will ever reach (null if it expands forever) */
function collapseZ(C){
  if(!(e2OfZ(0,C)>0)) return 0;
  let lo=null;
  for(let i=1;i<=300;i++){
    const z=-1+Math.pow(1e-9,i/300);
    if(!(e2OfZ(z,C)>0)){ lo=z; break; }
  }
  if(lo===null) return null;
  let hi=0;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(e2OfZ(m,C)>0) hi=m; else lo=m; }
  return hi;
}
function Hz(z,C){ return C.H0si*Ez(z,C); }
function tempAt(z,C){ return C.T0*(1+z); }

/* 24-point Gauss-Legendre on each of a few segments: E(z) is smooth and
   the integrands here are not oscillatory, so this converges to ~1e-14
   and costs nothing.  Nodes and weights are GENERATED by Newton on the
   Legendre polynomial, not typed. */
const GLN=(function(){
  const n=24, x=[], w=[];
  for(let i=0;i<n;i++){
    let t=Math.cos(PI*(i+0.75)/(n+0.5));
    for(let it=0;it<100;it++){
      let p0=1,p1=0;
      for(let j=0;j<n;j++){ const p2=p1; p1=p0; p0=((2*j+1)*t*p1-j*p2)/(j+1); }
      const dp=n*(t*p0-p1)/(t*t-1);
      const dt=-p0/dp; t+=dt;
      if(Math.abs(dt)<1e-16) break;
    }
    let p0=1,p1=0;
    for(let j=0;j<n;j++){ const p2=p1; p1=p0; p0=((2*j+1)*t*p1-j*p2)/(j+1); }
    const dp=n*(t*p0-p1)/(t*t-1);
    x.push(t); w.push(2/((1-t*t)*dp*dp));
  }
  return {x:x,w:w};
})();
function gl(f,a,b,nseg){
  const N=nseg||8; let s=0;
  for(let k=0;k<N;k++){
    const p=a+(b-a)*k/N, q=a+(b-a)*(k+1)/N;
    const hm=(q-p)/2, mid=(p+q)/2;
    for(let i=0;i<GLN.x.length;i++) s+=hm*GLN.w[i]*f(mid+hm*GLN.x[i]);
  }
  return s;
}
/* Comoving distance between two redshifts, Mpc.
   Integrated in u = 1/sqrt(1+z), NOT in z.  Over 0 < z < 1090 the integrand
   1/E falls by four orders of magnitude and essentially all of the distance
   accumulates in the last few percent of the interval, so uniform panels in
   z converge to about 3e-5 and no further — which showed up as the acoustic
   angle disagreeing with the Python in the fifth digit.  In u the matter era
   makes E ~ sqrt(Om)/u^3, so the integrand 2/(u^3 E) is nearly CONSTANT and
   the same quadrature is exact to machine precision.
   (Known-bad list: never integrate uniformly in a parameter the integrand
   does not spread out in.) */
function comovingZ(z0,z1,C,nseg){
  const ua=1/Math.sqrt(1+z1), ub=1/Math.sqrt(1+z0);
  return C.DH*gl(u=>2/(u*u*u*Ez(1/(u*u)-1,C)),ua,ub,nseg||10);
}
/* the particle horizon: how far light has come since a = 0.  Substitute
   u = 1/sqrt(1+z) so the z -> infinity tail becomes a finite interval —
   integrating in z to a large cutoff instead silently truncates it. */
function particleHorizon(z,C,nseg){
  /* u = 1/sqrt(1+z), so dz = -2/u^3 du and dz/E -> 2/(u^3 E) du.  At u = 0
     the radiation era makes E ~ sqrt(Or)/u^4, so the integrand vanishes
     like 2u/sqrt(Or) — bounded, and Gauss-Legendre eats it. */
  /* If the universe bounced there was no a = 0, so "the distance light has
     come since the big bang" has no referent — and beyond the bounce the
     epoch never happened at all.  Returning a number here is worse than
     returning nothing: a closed matter-poor universe has a FORBIDDEN BAND in
     z, and the quadrature happily integrates the allowed region on the far
     side of it and hands back a finite, meaningless answer. */
  if(C.zBounce!==null&&C.zBounce!==undefined) return NaN;
  const u1=1/Math.sqrt(1+z);
  return C.DH*gl(u=>2/(u*u*u*Ez(1/(u*u)-1,C)),0,u1,nseg||14);
}
/* the event horizon: how far light emitted NOW will ever get */
function eventHorizon(z,C,nseg){
  if(C.zCollapse!==null&&C.zCollapse!==undefined) return NaN;
  return C.DH*gl(zz=>1/Ez(zz,C),-0.999999999,z,nseg||14);
}
function hubbleLength(z,C){ return C.DH/Ez(z,C); }
/* age of the universe at z, in Gyr.  a = u^2 again. */
function ageAt(z,C,nseg){
  if(C.zBounce!==null&&C.zBounce!==undefined) return NaN;
  const u1=1/Math.sqrt(1+z);
  const v=gl(u=>2/(u*Ez(1/(u*u)-1,C)),1e-9,u1,nseg||14);
  return v/C.H0si/YR/1e9;
}
/* curvature-aware transverse comoving distance */
function transverseZ(z,C){
  const dc=comovingZ(0,z,C);
  if(Math.abs(C.Ok)<1e-12) return dc;
  const rk=C.DH/Math.sqrt(Math.abs(C.Ok));
  return C.Ok>0 ? rk*Math.sinh(dc/rk) : rk*Math.sin(dc/rk);
}
function angDiamZ(z,C){ return transverseZ(z,C)/(1+z); }

/* ================================================================== *
 *  the sound horizon                                                  *
 *                                                                     *
 *   R = 3 rho_b / 4 rho_gamma,  c_s = c / sqrt(3(1+R))                *
 *   r_s(z) = int_z^inf c_s dz'/H(z')                                  *
 * ================================================================== */
function baryonR(z,C){ return 0.75*(C.Obh2/C.Ogh2)/(1+z); }
function soundSpeed(z,C){ return 1/Math.sqrt(3*(1+baryonR(z,C))); }   /* /c */
function soundHorizon(z,C,nseg){
  const u1=1/Math.sqrt(1+z);
  return C.DH*gl(u=>2/(u*u*u)*soundSpeed(1/(u*u)-1,C)/Ez(1/(u*u)-1,C),
                 0,u1,nseg||14);
}
/* the acoustic angle and the multipole it corresponds to */
function thetaStar(C,zst){ return soundHorizon(zst,C)/transverseZ(zst,C); }
function acousticL(C,zst){ return PI/thetaStar(C,zst); }

/* ================================================================== *
 *  recombination — the Saha equation                                  *
 *                                                                     *
 *   x^2/(1-x) = (1/n_H) (m_e k T / 2 pi hbar^2)^{3/2} exp(-B/kT)      *
 *                                                                     *
 *  This is EQUILIBRIUM ionisation.  Real recombination is held up by  *
 *  the Lyman-alpha and 2s-1s bottleneck and finishes later: Saha puts *
 *  x_e = 1/2 at z ~ 1370 where Planck measures z_* = 1089.92.  The    *
 *  sim computes Saha, draws it, and states the size of the error.     *
 * ================================================================== */
function sahaRHS(z,C){
  const T=tempAt(z,C);
  const nH=C.nH0*Math.pow(1+z,3);
  const lhs=Math.pow(M_E*K_B*T/(TAU*HBAR*HBAR),1.5);
  return lhs/nH*Math.exp(-RY_H/(K_B*T));
}
function sahaXe(z,C){
  const r=sahaRHS(z,C);
  if(!isFinite(r)) return 1;
  if(r>1e14) return 1;
  if(r<1e-30) return Math.sqrt(r);        /* x^2 = r when x << 1 */
  return 0.5*(Math.sqrt(r*r+4*r)-r);
}
/* dtau/dz for Thomson scattering off the free electrons */
function dTauDz(z,C){
  const ne=sahaXe(z,C)*C.nH0*Math.pow(1+z,3);
  return ne*SIGMA_T*C_LIGHT/((1+z)*Hz(z,C));
}
function tauTo(z,C,nseg){ return gl(zz=>dTauDz(zz,C),0,z,nseg||24); }
/* the visibility function g = e^-tau dtau/dz: the probability density in
   redshift that a photon we see last scattered there */
function visibility(z,C,tauCache){
  const t=(tauCache!==undefined)?tauCache:tauTo(z,C);
  return dTauDz(z,C)*Math.exp(-t);
}
/* where Saha says half the hydrogen is still ionised */
function sahaHalfZ(C){
  /* x_e RISES with z, so the crossing lies BELOW any m with x_e(m) > 1/2 */
  let lo=200, hi=6000;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(sahaXe(m,C)>0.5) hi=m; else lo=m; }
  return (lo+hi)/2;
}
/* the visibility peak and its width, sampled rather than assumed
   Gaussian — a cheap scan, but the tau integral is the expensive part so
   it is accumulated incrementally instead of being redone per sample. */
function visibilityCurve(C,z0,z1,n){
  const N=n||220, out=[];
  const h=(z1-z0)/N;
  let tau=tauTo(z0,C);
  out.push({z:z0, tau:tau, g:dTauDz(z0,C)*Math.exp(-tau)});
  for(let i=1;i<=N;i++){
    const za=z0+h*(i-1), zb=z0+h*i;
    tau+=gl(zz=>dTauDz(zz,C),za,zb,1);
    out.push({z:zb, tau:tau, g:dTauDz(zb,C)*Math.exp(-tau)});
  }
  let ip=0;
  for(let i=1;i<out.length;i++) if(out[i].g>out[ip].g) ip=i;
  /* parabolic refinement of the peak and LINEAR interpolation of the two
     half-crossings: read straight off the grid the width is a function of
     the sampling, and moving from 240 to 1200 samples changed it by 4% */
  let zPeak=out[ip].z;
  if(ip>0&&ip<out.length-1){
    const y0=out[ip-1].g, y1=out[ip].g, y2=out[ip+1].g;
    const den=y0-2*y1+y2;
    if(den!==0) zPeak=out[ip].z-0.5*(out[ip+1].z-out[ip].z)*(y2-y0)/den;
  }
  const half=out[ip].g/2;
  const cross=(i0,step)=>{
    for(let i=i0;i>=0&&i<out.length;i+=step){
      if(out[i].g<half){
        const j=i-step, f=(out[j].g-half)/(out[j].g-out[i].g);
        return out[j].z+(out[i].z-out[j].z)*f;
      }
    }
    return out[i0].z;
  };
  const a=cross(ip,-1), b=cross(ip,1);
  return {pts:out, zPeak:zPeak, gPeak:out[ip].g, fwhm:Math.abs(b-a),
          zLo:Math.min(a,b), zHi:Math.max(a,b)};
}

/* ================================================================== *
 *  fitting the FIRAS points                                           *
 * ================================================================== */
function firasNuHz(i){ return FIRAS[i][0]*100*C_LIGHT; }   /* cm^-1 -> Hz */
function firasChi2(T){
  let s=0;
  for(let i=0;i<FIRAS.length;i++){
    const r=(FIRAS[i][1]-planckMJy(firasNuHz(i),T))*1e3;   /* kJy/sr */
    s+=r*r/(FIRAS[i][3]*FIRAS[i][3]);
  }
  return s;
}
function firasFitT(){
  let lo=2.5, hi=3.0;
  const gr=(Math.sqrt(5)-1)/2;
  let a=lo,b=hi,c=b-gr*(b-a),d=a+gr*(b-a),fc=firasChi2(c),fd=firasChi2(d);
  for(let i=0;i<200;i++){
    if(fc<fd){ b=d; d=c; fd=fc; c=b-gr*(b-a); fc=firasChi2(c); }
    else     { a=c; c=d; fc=fd; d=a+gr*(b-a); fd=firasChi2(d); }
  }
  return (a+b)/2;
}
function firasResiduals(T){
  const out=[];
  for(let i=0;i<FIRAS.length;i++)
    out.push({nu:FIRAS[i][0], r:(FIRAS[i][1]-planckMJy(firasNuHz(i),T))*1e3,
              s:FIRAS[i][3], mono:FIRAS[i][1], gal:FIRAS[i][4]});
  return out;
}

/* ================================================================== *
 *  the measured power spectrum                                        *
 * ================================================================== */
/* the bin carrying the largest published best-fit D_l below l = 800 —
   reported WITH its bin width, because a binned maximum is not a peak
   position to better than the bin */
function firstPeakBin(){
  let ip=0;
  for(let i=0;i<TTBIN.length;i++){
    if(TTBIN[i][0]>800) break;
    if(TTBIN[i][4]>TTBIN[ip][4]) ip=i;
  }
  const w=(ip>0&&ip<TTBIN.length-1)?(TTBIN[ip+1][0]-TTBIN[ip-1][0])/2:30;
  return {i:ip, l:TTBIN[ip][0], Dl:TTBIN[ip][4], Dobs:TTBIN[ip][1], halfWidth:w};
}
/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis — a
     magnitude scale, where brighter is up — silently gets one tick label and
     no grid.  Sort the range before asking for ticks; the placement below
     already handles either direction.  (Found by looking at the picture: the
     audit cannot see a label that was never drawn.) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* the epochs worth naming.  Every redshift here is COMPUTED from the
   model except the two that are measurements, which say so. */
function epochsOf(M){
  const C=M.C;
  return [
    {z:C.zeq,      name:'matter–radiation equality', kind:'calc',
     note:'1+z = Ω_m/Ω_r'},

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sup(e){
  const d='⁰¹²³⁴⁵⁶⁷⁸⁹'; let s=(e<0?'⁻':''), a=Math.abs(e)+'';
  for(const ch of a) s+=d[+ch];
  return s;
}
function fmtExp(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x)));
  return fmt(x/Math.pow(10,e),n===undefined?2:n)+'×10'+sup(e);
}
function sig(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const d=Math.max(0,(n||3)-1-Math.floor(Math.log10(Math.abs(x))));
  if(Math.abs(x)>=1e5||Math.abs(x)<1e-4) return fmtExp(x,(n||3)-1);
  return Number(x).toFixed(Math.min(12,d));
}
function fmtMpc(d){
  if(!isFinite(d)) return '—';
  if(Math.abs(d)>=1e3) return sig(d/1e3,4)+' Gpc';
  return sig(d,4)+' Mpc';
}
function fmtGly(mpc){ return isFinite(mpc)?sig(mpc*MPC/GLY,4)+' Gly':'—'; }
/* an axis formatter that snaps -1e-17 to 0, because fmt(-1e-17,2) is
   "-0.00" and a tick label reading minus zero looks like a defect */
function axf(n){ return function(t){
  return fmt(Math.abs(t)<Math.pow(10,-n-3)?0:t,n); }; }
function fmtTime(gyr){
  if(!isFinite(gyr)) return '—';
  if(gyr<1e-6) return sig(gyr*1e9,3)+' yr';
  if(gyr<1e-3) return sig(gyr*1e6,3)+' kyr';
  if(gyr<1)    return sig(gyr*1e3,3)+' Myr';
  return sig(gyr,4)+' Gyr';
}
function fmtLam(m){
  if(!isFinite(m)) return '—';
  if(m>=1e-2) return sig(m*1e2,3)+' cm';
  if(m>=1e-3) return sig(m*1e3,3)+' mm';
  if(m>=1e-6) return sig(m*1e6,3)+' µm';
  return sig(m*1e9,3)+' nm';
}
function fmtT(T){
  if(!isFinite(T)) return '—';
  if(T>=1e4) return fmtExp(T,3)+' K';
  return sig(T,4)+' K';
}
/* how far from a published value, in that value's own sigma */
function sigmaFrom(v,ref,dref){ return Math.abs(v-ref)/dref; }

/* ================================================================== *
 *  caches — the visibility curve and the FIRAS fit are the expensive  *
 *  things and neither depends on most of the controls                 *
 * ================================================================== */
const _visCache={};
function visFor(C){
  const k=[C.H0,C.Obh2,C.Och2,C.Neff,C.T0].join('|');
  if(_visCache[k]) return _visCache[k];
  const v=visibilityCurve(C,700,1900,300);
  _visCache[k]=v; return v;
}
let _firasT=null;
function firasT(){ if(_firasT===null) _firasT=firasFitT(); return _firasT; }

/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
function buildModel(st){
  const M={st:st};
  M.C=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,st.Ok);
  /* Planck's 0.06 eV neutrino is RELATIVISTIC at recombination (T_nu there
     is 0.18 eV) and non-relativistic today, so counting it as matter must
     change the low-redshift DISTANCE and leave the sound horizon alone.
     Applying it to both — which is the easy mistake — moves r_s by 0.17 Mpc
     and pretends the ruler changed.  So it gets its own cosmology, used for
     the distance integral only. */
  const C=M.C;
  M.Cdist=C;
  if(st.useplanckOm){
    const Cd=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,st.Ok);
    Cd.Om=PLANCK.Om; Cd.OL=1-Cd.Om-Cd.Or-Cd.Ok;
    Cd.zBounce=bounceZ(Cd); Cd.zCollapse=collapseZ(Cd);
    M.Cdist=Cd;
  }

  M.T0=C.T0;
  M.zeq=C.zeq;
  M.aeq=1/(1+C.zeq);
  M.ngamma=photonN(C.T0);
  M.ugamma=photonU(C.T0);
  M.eta=C.eta;
  M.zBounce=C.zBounce; M.zCollapse=C.zCollapse;
  M.age=ageAt(0,C);
  M.ageStar=ageAt(st.zStar,C);
  M.ageEq=ageAt(C.zeq,C);

  /* horizons */
  M.dH=C.DH;
  M.particle=particleHorizon(0,C);
  M.event=eventHorizon(0,C);
  M.DM=transverseZ(st.zStar,M.Cdist);
  M.DA=angDiamZ(st.zStar,M.Cdist);
  M.phStar=particleHorizon(st.zStar,C);

  /* the sound */
  M.rs=soundHorizon(st.zStar,C);
  M.rdrag=soundHorizon(PLANCK.zdrag,C);
  M.theta=M.rs/M.DM;
  M.lA=PI/M.theta;
  M.Rstar=baryonR(st.zStar,C);
  M.csStar=soundSpeed(st.zStar,C);
  M.peak=firstPeakBin();
  M.peakRatio=M.peak.l/M.lA;

  /* recombination */
  M.saha={half:sahaHalfZ(C)};
  M.vis=visFor(C);
  M.tauStar=tauTo(st.zStar,C);

  /* the spectrum */
  M.Tfit=firasT();
  M.chi2=firasChi2(M.Tfit);
  M.resid=firasResiduals(M.Tfit);
  let s2=0; for(const r of M.resid) s2+=r.r*r.r;
  M.residRms=Math.sqrt(s2/M.resid.length);
  M.monoMax=M.resid.reduce((a,r)=>Math.max(a,r.mono),0)*1e3;
  M.residFrac=M.residRms/M.monoMax;

  /* the redshift the panel is talking about */
  M.z=st.zPick;
  M.Tz=tempAt(st.zPick,C);
  M.lamPeak=peakLam(M.Tz);
  M.nuPeak=peakNu(M.Tz);
  M.nz=photonN(M.Tz);
  M.uz=photonU(M.Tz);
  M.ageZ=ageAt(st.zPick,C);
  M.lookback=M.age-M.ageZ;

  M.epochs=epochsOf(M);

  /* how the computed numbers compare with Planck's own */
  M.cmp=[
    ['z_eq', M.zeq, PLANCK.zeq, PLANCK.dzeq, 0],
    ['r_s(z_*) [Mpc]', M.rs, PLANCK.rstar, PLANCK.drstar, 2],
    ['r_s(z_drag) [Mpc]', M.rdrag, PLANCK.rdrag, PLANCK.drdrag, 2],
    ['100 θ_*', 100*M.theta, PLANCK.th100, PLANCK.dth100, 5],
    ['age [Gyr]', M.age, PLANCK.Age, PLANCK.dAge, 3],
  ];
  return M;
}

      +row('photons per m³', fmtExp(M.nz,3))
      +row('energy density', fmtExp(M.uz,3)+' J/m³')
      +row('age then', fmtTime(M.ageZ))
      +row('lookback', fmtTime(M.lookback))
      +hd('today')
      +row('T₀', sig(C.T0,6)+' K')
      +row('photons per cm³', sig(M.ngamma/1e6,5))
      +row('baryon/photon η', fmtExp(M.eta,3))
      +hd('COBE/FIRAS')
      +row('fitted T', sig(M.Tfit,7)+' K','good')
      +row('vs Fixsen 2.72548', fmt(Math.abs(M.Tfit-2.72548),5)+' K')
      +row('residual rms', sig(M.residRms,3)+' kJy/sr')
      +row('as a fraction of peak', fmtExp(M.residFrac,2),'good');
    note='<p class="note">Expansion maps a blackbody onto a blackbody: every '
      +'photon redshifts by the same (1+z), so the shape survives and only the '
      +'temperature changes. That is why this spectrum is a <b>thermometer</b> '
      +'for the whole history, and why a measured departure from it would be '
      +'evidence of energy release. FIRAS finds none at the 1 part in 10⁴ level.</p>';
  } else if(v==='recomb'){
    name='recombination';
    sub='Saha equilibrium — and where it fails';
    body=hd('the Saha calculation')
      +row('x_e = 1/2 at z', sig(M.saha.half,6))
      +row('temperature there', fmtT(tempAt(M.saha.half,C)))
      +row('kT there', sig(K_B*tempAt(M.saha.half,C)/EV,4)+' eV')
      +row('hydrogen binding', sig(RY_H/EV,6)+' eV')
      +row('ratio B/kT', sig(RY_H/(K_B*tempAt(M.saha.half,C)),4))
      +hd('the visibility function')
      +row('peak at z', sig(M.vis.zPeak,6))
      +row('FWHM in z', sig(M.vis.fwhm,4))
      +row('optical depth to z_*', sig(M.tauStar,4))
      +hd('what Planck measures')
      +row('z_*', fmt(PLANCK.zstar,2)+' ± '+fmt(PLANCK.dzstar,2))
      +row('Saha is high by', sig(M.saha.half-PLANCK.zstar,4),'bad');
    note='<p class="note">Saha assumes the ionisation is in <b>equilibrium</b>. '
      +'It is not: every recombination straight to the ground state emits a '
      +'photon that ionises the next atom, so the universe can only recombine '
      +'through the slow two-photon 2s→1s route and the Lyman-α escape. That '
      +'delay is why the real surface sits at z ≈ 1090 and not 1370. Getting '
      +'1090 needs the Peebles ODE, which is <b>not in this file</b>.</p>';
  } else if(v==='horizon'){
    name='the horizon';
    sub='how big the observable universe got';
    body=hd('today')
      +row('age', fmtTime(M.age))
      +row('Hubble length c/H₀', fmtGly(M.dH))
      +row('particle horizon', fmtGly(M.particle),'good')
      +row('  — as a diameter', fmtGly(2*M.particle),'good')
      +row('  — in Mpc', fmtMpc(M.particle))
      +row('event horizon', fmtGly(M.event))
      +hd('to the last-scattering surface')
      +row('comoving D_M', fmtMpc(M.DM))
      +row('  in Gly', fmtGly(M.DM))
      +row('angular diameter D_A', fmtMpc(M.DA),'bad')
      +row('its horizon then', fmtMpc(M.phStar))
      +row('that on the sky', sig(M.phStar/M.DA*RAD,3)+'°');
    note='<p class="note">The universe is '+fmtTime(M.age)+' old and the edge of '
      +'what we can see is '+fmtGly(M.particle)+' away, which is not a '
      +'contradiction: the space the light crossed <b>expanded while it was '
      +'crossing</b>. The event horizon is the other one — light leaving here '
      +'now will never get further than '+fmtGly(M.event)+'.</p>';
  } else {
    name=v==='sound'?'the sound':'the geometry';
    sub='r_s = '+fmtMpc(M.rs)+' · 100θ_* = '+fmt(100*M.theta,5);
    body=hd('the acoustic scale')
      +row('R = 3ρ_b/4ρ_γ at z_*', sig(M.Rstar,5))
      +row('sound speed c_s/c', sig(M.csStar,5))
      +row('sound horizon r_s', fmtMpc(M.rs))
      +row('r_s at the drag epoch', fmtMpc(M.rdrag))
      +row('D_M(z_*)', fmtMpc(M.DM))
      +row('θ_*', fmtExp(M.theta,4)+' rad')
      +row('  in degrees', sig(M.theta*RAD,4)+'°')
      +row('ℓ_A = π/θ_*', sig(M.lA,5))
      +hd('what the data show')
      +row('first peak bin ℓ', fmt(M.peak.l,1)+' ± '+fmt(M.peak.halfWidth,0))
      +row('ℓ_peak / ℓ_A', fmt(M.peakRatio,4),'good')
      +hd('vs Planck')
      +row('100 θ_* (Planck)', fmt(PLANCK.th100,5)+' ± '+fmt(PLANCK.dth100,5))
      +row('this model is off by', fmt(sigmaFrom(100*M.theta,PLANCK.th100,
           PLANCK.dth100),2)+' σ', sigmaFrom(100*M.theta,PLANCK.th100,
           PLANCK.dth100)>3?'bad':'good');
    note='<p class="note">Before recombination the photons and baryons are one '
      +'fluid and pressure waves run through it at <b>c/√3</b>, slowed by the '
      +'baryons. The distance a wave covers by z_* is a <b>ruler of known '
      +'length</b>, and the angle it subtends is the most precisely measured '
      +'quantity in cosmology. The C_ℓ curve is Planck’s own best fit — this '
      +'file computes the <b>scale</b>, not the spectrum.</p>';
    if(v==='geometry') note+='<p class="note">Curvature changes D_M without '
      +'touching r_s, so it moves θ_* — which is how flatness is measured.</p>';
  }
  /* two corners of the slider space are universes that do not have the
     quantities the panel is asking for; say which, rather than printing a
     column of dashes and letting the reader guess */
  if(M.zBounce!=null) note='<p class="note"><b>This universe never had a big '
    +'bang.</b> It is closed and matter-poor, so going back the expansion '
    +'reverses at z = '+sig(M.zBounce,4)+' and bounces. There is no age, no '
    +'particle horizon and no distance to a last-scattering surface, so those '
    +'read “—” rather than a number.</p>'+note;
  else if(M.zCollapse!=null) note='<p class="note"><b>This universe '
    +'recollapses.</b> Ω_Λ = '+fmt(M.C.OL,3)+' is negative, so the expansion '
    +'turns over at z = '+fmt(M.zCollapse,4)+' and there is no event horizon.</p>'
    +note;
  return '<div class="rname">'+name+'<small>'+sub+'</small></div><table>'+body
        +'</table>'+note;
}

/* ================================================================== *

      +'<span class="hl2">'+sig(M.zeq,6)+'</span>'
      +'<span class="sm">radiation dilutes by one extra power of a because the '
      +'expansion redshifts each photon as well as spreading them out</span>';
  if(v==='recomb')
    return '<span class="lhs">x²/(1&minus;x)</span> = (1/n<sub>H</sub>) '
      +'(m<sub>e</sub>kT/2πℏ²)<sup>3/2</sup> e<sup>&minus;B/kT</sup>'
      +'<span class="sm">the Saha equation — equilibrium ionisation, which puts '
      +'x<sub>e</sub> = ½ at z = '+sig(M.saha.half,5)+' where the measured '

  if(v==='spectrum')
    return '<span class="lhs">B<sub>ν</sub>(T)</span> = '

      +'B<sub>ν</sub>/ν³ is <span class="hl">invariant</span> under expansion'
      +'<span class="sm">so a blackbody stays a blackbody and only its '
      +'temperature moves — the spectrum is a thermometer, not a fit</span>';
  if(v==='horizon')
    return '<span class="lhs">d<sub>p</sub></span> = (c/H₀) ∫₀<sup>∞</sup> '
      +'dz/E(z) = <span class="hl">'+fmtGly(M.particle)+'</span> &nbsp;·&nbsp; '
      +'age = <span class="hl2">'+fmtTime(M.age)+'</span>'

    return '<span class="lhs">r<sub>s</sub></span> = ∫<sub>z*</sub><sup>∞</sup> '

      +'<span class="hl">'+sig(M.theta*RAD,4)+'°</span>'
      +'<span class="sm">a ruler of known length at a known distance; the first '

  return '<span class="lhs">D<sub>M</sub></span> = (c/H₀)|Ω<sub>k</sub>|'
    +'<sup>&minus;1/2</sup> sinn[√|Ω<sub>k</sub>| ∫dz/E] &nbsp;→&nbsp; '
    +'θ<sub>*</sub> = <span class="hl">'+fmt(100*M.theta,5)+'</span>/100'
    +'<span class="sm">curvature bends the light path, so the same sound horizon '

function tagText(M){
  const v=M.st.view;
  if(v==='fireball') return '<b>the fireball</b> &mdash; every epoch computed, '
    +'except the two marked as measurements';
  if(v==='recomb') return '<b>recombination</b> &mdash; Saha, solved here, '
    +'and honest about what it gets wrong';
  if(v==='spectrum') return '<b>the spectrum</b> &mdash; COBE/FIRAS, '
    +'Fixsen+ 1996, 43 measured points';
  if(v==='horizon') return '<b>the horizon</b> &mdash; the diameter of the '
    +'observable universe';
  if(v==='sound') return '<b>the sound</b> &mdash; Planck 2018 TT; the C_ℓ '
    +'curve is Planck&rsquo;s fit, the scale is computed here';
  return '<b>the geometry</b> &mdash; how the peak position measures curvature';
}
/* ================================================================== *
 *  plotting extras — same rules as standard_candle.html: everything   *
 *  drawn inside a plot box is clipped to it unless it is a label, a   *
 *  title or a callout deliberately placed on the frame.               *
 * ================================================================== */
function clipTo(ctx,b){ ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip(); }
function sx(b,v,lo,hi){ return b.x+b.w*(v-lo)/((hi-lo)||1); }
function sy(b,v,lo,hi){ return b.y1-b.h*(v-lo)/((hi-lo)||1); }
function dot(ctx,X,Y,r,col){
  ctx.beginPath(); ctx.arc(X,Y,r,0,TAU); ctx.fillStyle=col; ctx.fill();
}
function errBarY(ctx,X,Y0,Y1,col,cap){
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X,Y0); ctx.lineTo(X,Y1);
  if(cap){ ctx.moveTo(X-2.5,Y0); ctx.lineTo(X+2.5,Y0);
           ctx.moveTo(X-2.5,Y1); ctx.lineTo(X+2.5,Y1); }
  ctx.stroke();
}
function legendAt(ctx,x,y,items){
  ctx.font='11px -apple-system, sans-serif'; ctx.textBaseline='middle';
  let yy=y;
  for(const [col,lab,dash] of items){
    ctx.strokeStyle=col; ctx.lineWidth=2;
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+16,yy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#8b93a6'; ctx.textAlign='left';
    ctx.fillText(plain(lab),x+22,yy);
    yy+=15;
  }
  return yy-y;
}
function logTick(t){
  const e=Math.round(t);
  if(Math.abs(t-e)>1e-9) return '';
  if(e>=0&&e<=4) return fmt(Math.pow(10,e),0);
  return '10'+sup(e);
}
/* a vertical marker with its label placed so it cannot run off the box */
function vMark(ctx,b,X,col,lab,yFrac,dash){
  if(X<b.x-1||X>b.x1+1) return;
  ctx.save(); clipTo(ctx,b);
  ctx.strokeStyle=col; ctx.lineWidth=1.2;
  if(dash!==false) ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  if(!lab) return;
  ctx.font='10.5px -apple-system,sans-serif'; ctx.fillStyle=col;
  const w=ctx.measureText(plain(lab)).width;
  const right=(X+6+w)>b.x1;
  ctx.textAlign=right?'right':'left'; ctx.textBaseline='top';
  ctx.fillText(plain(lab),X+(right?-6:6),b.y+(yFrac===undefined?0.06:yFrac)*b.h);
}

/* ================================================================== *
 *  view A — the fireball                                              *
 * ================================================================== */
function drawFireball(ctx,W,H,M){
  const st=M.st, C=M.C;
  const b=box(78,54,W-116,(H-160)*0.60);
  const b2=box(78,54+(H-160)*0.60+56,W-116,(H-160)*0.26);
  /* log10(1+z) from today out past equality */
  const lx0=0, lx1=Math.log10(1+1e7);
  /* Plotted as a ratio to TODAY'S critical density, not in kg/m^3: rho_c is
     8.5e-27 kg m^-3, so a kg/m^3 axis running -6 to 16 puts every curve in
     this view twenty decades off the bottom of the box.  It did, and the
     view rendered essentially empty.  Omega is also the quantity the reader
     wants: the curves cross where the Omegas cross. */
  const ly0=-1, ly1=25;
  axes(ctx,b,lx0,lx1,ly0,ly1,{title:'what the universe was made of',
    xlab:'1 + z', ylab:'log₁₀ ( ρ / ρ_crit,0 )',
    xfmt:logTick, yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  const curve=(f,col,lw,dash)=>{
    const xs=[],ys=[];
    for(let i=0;i<=260;i++){
      const lz=lx0+(lx1-lx0)*i/260, z=Math.pow(10,lz)-1;
      xs.push(lz); ys.push(Math.log10(Math.max(f(z),1e-40)));
    }
    polyline(ctx,b,xs,ys,lx0,lx1,ly0,ly1,col,lw,dash);
  };
  curve(z=>C.Or*Math.pow(1+z,4),'#e8843a',2.2);
  curve(z=>C.Om*Math.pow(1+z,3),'#b8ec4c',2.2);
  curve(z=>Math.max(C.OL,1e-30),'#cd35c4',2.2);
  if(Math.abs(C.Ok)>1e-9) curve(z=>Math.abs(C.Ok)*Math.pow(1+z,2),'#5ac8e0',1.4,[5,4]);
  ctx.restore();
  vMark(ctx,b,sx(b,Math.log10(1+C.zeq),lx0,lx1),'#7f8bd8',
        'equality  z = '+sig(C.zeq,5),0.05);
  if(st.showEpochs){
    vMark(ctx,b,sx(b,Math.log10(1+PLANCK.zstar),lx0,lx1),'#fff',
          'last scattering (measured)',0.14);
    vMark(ctx,b,sx(b,Math.log10(1+PLANCK.zre),lx0,lx1),'#8b93a6',
          'reionization (measured)',0.23);
  }
  vMark(ctx,b,sx(b,Math.log10(1+st.zPick),lx0,lx1),'#cd35c4','',0,false);
  /* upper LEFT, below the epoch markers (which sit at 0.05..0.23 of the
     height) and above the curves (which are near the floor at low z).  The
     obvious spot — 30% across the top — collides with the equality label
     whenever z_eq is small, which the matter-poor preset reaches. */
  legendAt(ctx,b.x+14,b.y+b.h*0.36,[['#e8843a','radiation ∝ a^-4'],
    ['#b8ec4c','matter ∝ a^-3'],['#cd35c4','Λ, constant'],
    ['#5ac8e0','|curvature| ∝ a^-2',[5,4]]]);

  /* the temperature, and the colour that temperature would look */
  axes(ctx,b2,lx0,lx1,0,1,{title:'the temperature, and the peak wavelength',
    xlab:'1 + z', xfmt:logTick, yticks:[]});
  ctx.save(); clipTo(ctx,b2);
  /* the strip fills the box and the log-T line is drawn ON it; the first
     version put the line at v = 0.42..0.98 and the strip at v = 0..0.58, so
     the line floated above the thing it was labelling */
  for(let i=0;i<180;i++){
    const lz=lx0+(lx1-lx0)*i/180, z=Math.pow(10,lz)-1;
    const T=tempAt(z,C);
    const X0=sx(b2,lz,lx0,lx1), X1=sx(b2,lx0+(lx1-lx0)*(i+1)/180,lx0,lx1);
    ctx.fillStyle=thermalCss(T);
    ctx.fillRect(X0,b2.y,X1-X0+1,b2.h);
  }
  const xs=[],ys=[];
  for(let i=0;i<=260;i++){
    const lz=lx0+(lx1-lx0)*i/260, z=Math.pow(10,lz)-1;
    xs.push(lz); ys.push(0.08+0.84*clamp((Math.log10(tempAt(z,C))+1)/9,0,1));
  }
  polyline(ctx,b2,xs,ys,lx0,lx1,0,1,'#fff',1.8);
  ctx.restore();
  ctx.font='10.5px -apple-system,sans-serif'; ctx.textBaseline='middle';
  for(const [z,lab] of [[0,'2.7 K'],[1089.92,'3000 K'],[C.zeq,fmtT(tempAt(C.zeq,C))]]){
    const X=sx(b2,Math.log10(1+z),lx0,lx1);
    if(X<b.x||X>b.x1) continue;
    ctx.fillStyle='#070b18'; ctx.textAlign=(X>b2.x1-60)?'right':'left';
    ctx.fillText(lab,X+(X>b2.x1-60?-5:5),b2.y1-10);
  }
  caption(ctx,b2.x,b2.y1+34,
    'The strip is the colour a blackbody of that temperature would be, sRGB, '
    +'saturating to white above about 10 000 K — decoration, not a measurement. '
    +'The white line is log T. At z = '+sig(st.zPick,5)+' the peak sits at '
    +fmtLam(M.lamPeak)+', which is '+(M.lamPeak<7e-7?'visible light':
      M.lamPeak<1e-4?'infrared':'microwave')+'.',W-160,'#767e92');
}
/* blackbody colour, for decoration only — a crude Planckian locus */
function thermalCss(T){
  const t=clamp((Math.log10(T)-0.3)/(4.2-0.3),0,1);
  const stops=[[0,'#120409'],[0.18,'#3a0a12'],[0.36,'#8c1d0a'],
               [0.52,'#d4560d'],[0.66,'#f0a33a'],[0.80,'#ffe0a8'],
               [0.90,'#ffffff'],[1,'#cfe0ff']];
  let i=0; while(i<stops.length-2&&t>stops[i+1][0]) i++;
  const a=stops[i], c=stops[i+1];
  return mix(a[1],c[1],(t-a[0])/((c[0]-a[0])||1));
}

/* ================================================================== *
 *  view B — recombination                                             *
 * ================================================================== */
function drawRecomb(ctx,W,H,M){
  const C=M.C;
  const b=box(78,54,W-116,(H-160)*0.52);
  const b2=box(78,54+(H-160)*0.52+56,W-116,(H-160)*0.30);
  const z0=1900, z1=700;              /* time runs left to right */
  axes(ctx,b,z0,z1,-5.2,0.2,{title:'the ionisation fraction — Saha equilibrium',
    xlab:'redshift z   (earlier ← → later)', ylab:'log₁₀ x_e',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  const xs=[],ys=[];
  for(let i=0;i<=300;i++){
    const z=z0+(z1-z0)*i/300;
    xs.push(z); ys.push(Math.log10(Math.max(sahaXe(z,C),1e-9)));
  }
  polyline(ctx,b,xs,ys,z0,z1,-5.2,0.2,'#b8ec4c',2.4);
  ctx.restore();
  vMark(ctx,b,sx(b,M.saha.half,z0,z1),'#b8ec4c',
        'Saha x_e = ½  at z = '+sig(M.saha.half,5),0.06);
  vMark(ctx,b,sx(b,PLANCK.zstar,z0,z1),'#fff',
        'Planck z_* = '+fmt(PLANCK.zstar,2),0.15);

  axes(ctx,b2,z0,z1,0,1.05,{title:'the visibility function — where the photons '
      +'we see actually last scattered',
    xlab:'redshift z', ylab:'g / g_max', xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  const g=M.vis.pts, gm=M.vis.gPeak;
  polyline(ctx,b2,g.map(p=>p.z),g.map(p=>p.g/gm),z0,z1,0,1.05,'#cd35c4',2.4);
  /* the optical depth on the same box, scaled and said so */
  polyline(ctx,b2,g.map(p=>p.z),g.map(p=>clamp(p.tau,0,6)/6),z0,z1,0,1.05,
           '#5ac8e0',1.6,[5,4]);
  const Yh=sy(b2,0.5,0,1.05);
  ctx.strokeStyle='rgba(205,53,196,0.4)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(sx(b2,M.vis.zLo,z0,z1),Yh); ctx.lineTo(sx(b2,M.vis.zHi,z0,z1),Yh);
  ctx.stroke();
  ctx.restore();
  vMark(ctx,b2,sx(b2,M.vis.zPeak,z0,z1),'#cd35c4','',0,false);
  legendAt(ctx,b2.x+12,b2.y+16,[['#cd35c4','visibility g(z), normalised'],
    ['#5ac8e0','optical depth τ / 6',[5,4]]]);
  ctx.fillStyle='#cd35c4'; ctx.font='11px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('peak z = '+sig(M.vis.zPeak,6)+',  FWHM = '+sig(M.vis.fwhm,4)
               +' in z',b2.x+12,b2.y1-8);
  caption(ctx,b2.x,b2.y1+34,
    'Saha puts recombination at z = '+sig(M.saha.half,5)+'; Planck measures the '
    +'last-scattering surface at 1089.9. The '+sig(M.saha.half-PLANCK.zstar,3)
    +' of difference is not arithmetic — it is that equilibrium recombination is '
    +'blocked. A recombination straight to the ground state emits a photon that '
    +'ionises the next atom, so the universe can only get there through the slow '
    +'two-photon 2s→1s decay and Lyman-α escape. That needs the Peebles ODE, '
    +'which is NOT in this file.',W-160,'#767e92');
}

/* ================================================================== *
 *  view C — the spectrum                                              *
 * ================================================================== */
function drawSpectrum(ctx,W,H,M){
  const st=M.st, C=M.C;
  const b=box(80,54,W-120,(H-160)*0.56);
  const b2=box(80,54+(H-160)*0.56+58,W-120,(H-160)*0.30);
  const nu0=0, nu1=24;                                 /* cm^-1 */
  const T=M.Tfit;
  let ymax=0;
  for(let i=0;i<=200;i++){
    const nu=nu0+(nu1-nu0)*i/200;
    ymax=Math.max(ymax,planckMJy(nu*100*C_LIGHT,T));
  }
  axes(ctx,b,nu0,nu1,0,ymax*1.10,{
    title:'the cosmic microwave background, and 43 points of COBE/FIRAS',
    xlab:'frequency  [cm⁻¹]', ylab:'intensity  [MJy sr⁻¹]',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  {
    const xs=[],ys=[];
    for(let i=0;i<=300;i++){
      const nu=nu0+(nu1-nu0)*i/300;
      xs.push(nu); ys.push(planckMJy(nu*100*C_LIGHT,T));
    }
    polyline(ctx,b,xs,ys,nu0,nu1,0,ymax*1.10,'#b8ec4c',2.2);
  }
  if(st.showFIRAS){
    for(const r of M.resid){
      dot(ctx,sx(b,r.nu,nu0,nu1),sy(b,r.mono,0,ymax*1.10),3.0,'#fff');
    }
  }
  ctx.restore();
  const lp=peakLam(T);
  vMark(ctx,b,sx(b,1/(peakNu(T)/C_LIGHT*100)*0+peakNu(T)/C_LIGHT/100,nu0,nu1),
        '#5ac8e0','peak '+fmtLam(lp)+' = '+sig(peakNu(T)/1e9,5)+' GHz',0.06);
  legendAt(ctx,b.x+14,b.y+b.h-40,[['#b8ec4c','blackbody at '+sig(T,7)+' K'],
    ['#fff','FIRAS, Fixsen+ 1996']]);

  /* Residuals, ACTUALLY magnified.  The first version auto-scaled this panel
     to the residuals and then printed "magnified ×200" on it, which was a
     scale claim the drawing did not honour — precisely the thing the house
     rule about printing scale distortions exists to prevent.  The panel's
     full scale is now literally the top panel's full scale divided by the
     magnification, so the number on the title is the number on the glass. */
  const mag=st.residMag;
  const rspan=ymax*1e3/mag;                 /* MJy/sr -> kJy/sr, then /mag  */
  let rmax=0, clipped=0;
  for(const r of M.resid){
    rmax=Math.max(rmax,Math.abs(r.r)+r.s);
    if(Math.abs(r.r)+r.s>rspan) clipped++;
  }
  axes(ctx,b2,nu0,nu1,-rspan,rspan,{
    title:'the residual, magnified ×'+fmt(mag,0)
      +' — the departure from a blackbody',
    xlab:'frequency  [cm⁻¹]', ylab:'monopole − blackbody  [kJy sr⁻¹]',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b2);
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1;
  const Y0=sy(b2,0,-rspan,rspan);
  ctx.beginPath(); ctx.moveTo(b2.x,Y0); ctx.lineTo(b2.x1,Y0); ctx.stroke();
  for(const r of M.resid){
    const X=sx(b2,r.nu,nu0,nu1);
    errBarY(ctx,X,sy(b2,r.r-r.s,-rspan,rspan),sy(b2,r.r+r.s,-rspan,rspan),
            '#8b93a6',true);
    dot(ctx,X,sy(b2,r.r,-rspan,rspan),2.6,'#fff');
  }
  if(st.showGal){
    polyline(ctx,b2,M.resid.map(r=>r.nu),M.resid.map(r=>r.gal),
             nu0,nu1,-rspan,rspan,'#e8843a',1.6,[5,4]);
  }
  ctx.restore();
  if(st.showGal) legendAt(ctx,b2.x+14,b2.y+16,
    [['#e8843a','modelled Galaxy at the poles',[5,4]]]);
  if(clipped){
    ctx.fillStyle='#e8843a'; ctx.font='11px -apple-system,sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText(clipped+' point'+(clipped>1?'s':'')+' run past this frame — '
      +'lower the magnification to see them',b2.x1-8,b2.y+8);
  }
  caption(ctx,b2.x,b2.y1+34,
    'The residual rms is '+sig(M.residRms,3)+' kJy/sr against a peak of '
    +sig(M.monoMax/1e3,4)+' MJy/sr — a departure from a perfect blackbody of '
    +fmtExp(M.residFrac,2)+'. The top panel is drawn at true scale; the bottom '
    +'one is the SAME data on an axis '+fmt(mag,0)+' times finer — literally '
    +'the top panel’s full scale divided by '+fmt(mag,0)+', which is the only '
    +'way the residual is visible at all. Fitting these 43 points gives T = '
    +sig(M.Tfit,7)+' K against Fixsen 2009’s 2.72548 ± 0.00057.',
    W-170,'#767e92');
}

/* ================================================================== *
 *  view D — the horizon                                               *
 * ================================================================== */
function drawHorizon(ctx,W,H,M){
  const st=M.st, C=M.C;
  const bw=(W-150)/2;
  const b=box(80,54,bw,(H-160)*0.60);
  const b3=box(80+bw+58,54,bw,(H-160)*0.60);
  const b2=box(80,54+(H-160)*0.60+56,W-120,(H-160)*0.34);

  /* left: the three lengths against the scale factor */
  const lx0=-6, lx1=1.0;                       /* log10 a */
  const ly0=-2, ly1=6;                         /* log10 Mpc (comoving) */
  axes(ctx,b,lx0,lx1,ly0,ly1,{title:'the three horizons',
    xlab:'log₁₀ scale factor a', ylab:'log₁₀ comoving size  [Mpc]',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  const ph=[],hu=[],ev=[],la=[];
  const lg=(v)=>isFinite(v)&&v>0?Math.log10(v):NaN;
  for(let i=0;i<=110;i++){
    const l=lx0+(lx1-lx0)*i/110, a=Math.pow(10,l), z=1/a-1;
    la.push(l);
    /* an epoch beyond a bounce never happened, and Ez is NaN in the
       forbidden band — but the quadrature can integrate the allowed region
       on the FAR side of that band and return a finite, meaningless
       number, so the sample is dropped explicitly */
    const gone=(C.zBounce!=null&&z>C.zBounce);
    ph.push(gone?NaN:lg(particleHorizon(z,C,10)));
    hu.push(gone?NaN:lg(hubbleLength(z,C)*(1+z)));
    ev.push((gone||z<=-0.999)?NaN:lg(eventHorizon(z,C,10)));
  }
  polyline(ctx,b,la,ph,lx0,lx1,ly0,ly1,'#b8ec4c',2.4);
  if(st.showHubble) polyline(ctx,b,la,hu,lx0,lx1,ly0,ly1,'#e8843a',1.8,[6,4]);
  if(st.showEvent)  polyline(ctx,b,la,ev,lx0,lx1,ly0,ly1,'#cd35c4',1.8,[2,3]);
  ctx.restore();
  vMark(ctx,b,sx(b,Math.log10(1/(1+C.zeq)),lx0,lx1),'#7f8bd8','equality',0.05);
  vMark(ctx,b,sx(b,Math.log10(1/(1+PLANCK.zstar)),lx0,lx1),'#fff','z_*',0.14);
  vMark(ctx,b,sx(b,0,lx0,lx1),'#8b93a6','now',0.23);
  legendAt(ctx,b.x+12,b.y+b.h-52,[['#b8ec4c','particle horizon'],
    ['#e8843a','comoving Hubble length',[6,4]],
    ['#cd35c4','event horizon',[2,3]]]);

  /* right: the observable universe, to scale, as nested shells */
  ctx.save();
  frame(ctx,b3,'#242a3a');
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('the observable universe, to scale',b3.x,b3.y-6);
  clipTo(ctx,b3);
  const cx=b3.x+b3.w/2, cy=b3.y+b3.h*0.52;
  const R=Math.min(b3.w/2-56,b3.h/2-42);
  const shells=[
    [M.particle,'#b8ec4c','particle horizon  '+fmtGly(M.particle)],
    [M.DM,'#fff','last scattering  '+fmtGly(M.DM)],
    [M.event,'#cd35c4','event horizon  '+fmtGly(M.event)],
    [M.dH,'#e8843a','Hubble length  '+fmtGly(M.dH)],
  ];
  const big=Math.max.apply(null,shells.map(s=>s[0]));
  for(const [d,col,lab] of shells){
    const rr=R*d/big;
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,TAU);
    ctx.strokeStyle=col; ctx.lineWidth=(col==='#b8ec4c')?2:1.3;
    if(col!=='#b8ec4c') ctx.setLineDash([4,3]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  dot(ctx,cx,cy,3,'#fff');
  ctx.restore();
  ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left';
  ctx.textBaseline='middle';
  let yy=b3.y+12;
  for(const [d,col,lab] of shells){
    ctx.fillStyle=col; ctx.fillText(plain(lab),b3.x+10,yy); yy+=15;
  }

  /* bottom: the numbers, spelled out */
  ctx.save();
  frame(ctx,b2,'#242a3a');
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('why 13.8 billion years of travel puts the source 46 billion '
    +'light years away',b2.x,b2.y-6);
  const rows=[
    ['age of the universe', fmtTime(M.age), 'the light has been travelling this long'],
    ['particle horizon (radius)', fmtGly(M.particle),
     'and the source is now this far — the space between grew on the way'],
    ['as a diameter', fmtGly(2*M.particle), 'which is the number usually quoted'],
    ['comoving D_M to z_*', fmtGly(M.DM), 'the last-scattering shell, almost the same'],
    ['angular-diameter D_A to z_*', fmtMpc(M.DA),
     'the same shell WAS this close when it emitted'],
    ['event horizon', fmtGly(M.event),
     'nothing we send now will ever pass this'],
  ];
  const rh=Math.min(24,(b2.h-12)/rows.length);
  for(let i=0;i<rows.length;i++){
    const y=b2.y+8+i*rh;
    ctx.font='12px -apple-system, sans-serif';
    ctx.fillStyle='#cfd4de'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(rows[i][0]),b2.x+12,y);
    ctx.fillStyle='#b8ec4c'; ctx.textAlign='right';
    ctx.fillText(plain(rows[i][1]),b2.x+330,y);
    ctx.fillStyle='#6b7284'; ctx.textAlign='left';
    ctx.font='11px -apple-system, sans-serif';
    ctx.fillText(plain(rows[i][2]),b2.x+348,y+1);
  }
  ctx.restore();
}

/* ================================================================== *
 *  view E — the sound                                                 *
 * ================================================================== */
function drawSound(ctx,W,H,M){
  const st=M.st, C=M.C;
  const b=box(80,54,W-120,(H-160)*0.60);
  const bw=(W-160)/2;
  const b2=box(80,54+(H-160)*0.60+58,bw,(H-160)*0.26);
  const b3=box(80+bw+62,54+(H-160)*0.60+58,bw,(H-160)*0.26);

  const lx0=Math.log10(2), lx1=Math.log10(2600);
  let ymax=0;
  for(const r of TTBIN) ymax=Math.max(ymax,r[1]+r[3]);
  for(const r of TTLOW) ymax=Math.max(ymax,r[1]);
  ymax*=1.08;
  axes(ctx,b,lx0,lx1,0,ymax,{
    title:'the Planck 2018 TT power spectrum — measured, with Planck’s own '
      +'best fit',
    xlab:'multipole ℓ   (logarithmic)', ylab:'D_ℓ = ℓ(ℓ+1)C_ℓ/2π  [µK²]',
    xticks:[Math.log10(2),Math.log10(5),1,Math.log10(20),Math.log10(50),2,
            Math.log10(200),Math.log10(500),3,Math.log10(2000)],
    xfmt:t=>fmt(Math.pow(10,t),0), yfmt:t=>fmt(t,0)});
  ctx.save(); clipTo(ctx,b);
  if(st.showBest){
    polyline(ctx,b,TTBIN.map(r=>Math.log10(r[0])),TTBIN.map(r=>r[4]),
             lx0,lx1,0,ymax,'#b8ec4c',2.2);
  }
  if(st.showLow){
    for(const r of TTLOW){
      const X=sx(b,Math.log10(r[0]),lx0,lx1);
      errBarY(ctx,X,sy(b,r[1]-r[2],0,ymax),sy(b,r[1]+r[3],0,ymax),
              'rgba(140,152,180,0.55)');
      dot(ctx,X,sy(b,r[1],0,ymax),2,'#8b98b4');
    }
  }
  if(st.showTT){
    for(const r of TTBIN){
      const X=sx(b,Math.log10(r[0]),lx0,lx1);
      errBarY(ctx,X,sy(b,r[1]-r[2],0,ymax),sy(b,r[1]+r[3],0,ymax),'#fff',true);
      dot(ctx,X,sy(b,r[1],0,ymax),2.6,'#fff');
    }
  }
  ctx.restore();
  if(st.showLa){
    vMark(ctx,b,sx(b,Math.log10(M.lA),lx0,lx1),'#cd35c4',
          'ℓ_A = π/θ_* = '+fmt(M.lA,0)+'  (computed here)',0.06);
    vMark(ctx,b,sx(b,Math.log10(M.peak.l),lx0,lx1),'#5ac8e0',
          'first peak ℓ = '+fmt(M.peak.l,0),0.15);
  }
  legendAt(ctx,b.x+14,b.y+b.h-52,[['#fff','Planck binned TT'],
    ['#8b98b4','unbinned ℓ < 47'],
    ['#b8ec4c','Planck’s best-fit ΛCDM — NOT computed here']]);

  /* the sound-horizon integrand */
  const u1=1/Math.sqrt(1+st.zStar);
  axes(ctx,b2,0,u1,0,1.05,{title:'where the sound horizon comes from',
    xlab:'u = 1/√(1+z)   (u = 0 is the big bang)', ylab:'integrand, normalised',
    xfmt:axf(4), yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  {
    const xs=[],ys=[]; let mx=0;
    for(let i=0;i<=200;i++){
      const u=u1*i/200, z=1/(u*u)-1;
      const v=(u>0)?2/(u*u*u)*soundSpeed(z,C)/Ez(z,C):0;
      xs.push(u); ys.push(v); mx=Math.max(mx,v);
    }
    polyline(ctx,b2,xs,ys.map(v=>v/mx),0,u1,0,1.05,'#cd35c4',2.2);
  }
  ctx.restore();
  caption(ctx,b2.x,b2.y1+34,
    'Integrating in u rather than z is not cosmetic: in z the integrand spans '
    +'four decades and uniform panels stall at 3×10⁻⁵.',bw,'#767e92');

  /* the sound speed */
  /* c_s/c falls to 0.02 by z = 0, so a 0.4-0.6 window clips most of the
     curve away and it appears to start in mid-air */
  axes(ctx,b3,0,3000,0,0.62,{title:'the sound speed of the photon–baryon fluid',
    xlab:'redshift z', ylab:'c_s / c', xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,2)});
  ctx.save(); clipTo(ctx,b3);
  {
    const xs=[],ys=[];
    for(let i=0;i<=200;i++){ const z=3000*i/200; xs.push(z); ys.push(soundSpeed(z,C)); }
    polyline(ctx,b3,xs,ys,0,3000,0,0.62,'#b8ec4c',2.2);
  }
  const Yr=sy(b3,1/Math.sqrt(3),0,0.62);
  ctx.strokeStyle='#5ac8e0'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(b3.x,Yr); ctx.lineTo(b3.x1,Yr); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.fillStyle='#5ac8e0'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillText('1/√3 — no baryons',b3.x1-6,Yr-3);
  vMark(ctx,b3,sx(b3,st.zStar,0,3000),'#fff','z_*',0.06);
}

/* ================================================================== *
 *  view F — the geometry                                              *
 * ================================================================== */
function drawGeometry(ctx,W,H,M){
  const st=M.st, C=M.C;
  const bw=(W-150)/2;
  const b=box(80,54,bw,(H-160)*0.66);
  const b2=box(80+bw+58,54,bw,(H-160)*0.66);
  const b3=box(80,54+(H-160)*0.66+62,W-120,(H-160)*0.22);

  /* theta_* against curvature */
  const k0=-0.20, k1=0.20;
  let tlo=1e9,thi=-1e9;
  const ks=[],ths=[];
  for(let i=0;i<=120;i++){
    const ok=k0+(k1-k0)*i/120;
    const Cx=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,ok);
    const Cd=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,ok);
    if(st.useplanckOm){ Cd.Om=PLANCK.Om; Cd.OL=1-Cd.Om-Cd.Or-Cd.Ok; }
    const th=100*soundHorizon(st.zStar,Cx)/transverseZ(st.zStar,Cd);
    ks.push(ok); ths.push(th);
    tlo=Math.min(tlo,th); thi=Math.max(thi,th);
  }
  const pad=(thi-tlo)*0.08;
  axes(ctx,b,k0,k1,tlo-pad,thi+pad,{
    title:'curvature moves the acoustic angle',
    xlab:'Ω_k', ylab:'100 θ_*', xfmt:axf(2), yfmt:t=>fmt(t,2)});
  ctx.save(); clipTo(ctx,b);
  /* Planck's measured band, which is far narrower than the line is thick */
  const Ya=sy(b,PLANCK.th100+PLANCK.dth100*30,tlo-pad,thi+pad);
  const Yb=sy(b,PLANCK.th100-PLANCK.dth100*30,tlo-pad,thi+pad);
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.fillRect(b.x,Math.min(Ya,Yb),b.w,Math.abs(Yb-Ya));
  polyline(ctx,b,ks,ths,k0,k1,tlo-pad,thi+pad,'#b8ec4c',2.4);
  const X0=sx(b,0,k0,k1);
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X0,b.y); ctx.lineTo(X0,b.y1); ctx.stroke();
  dot(ctx,sx(b,C.Ok,k0,k1),sy(b,100*M.theta,tlo-pad,thi+pad),4.5,'#fff');
  ctx.restore();
  ctx.fillStyle='#cfd4de'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('Planck’s 100θ_* = '+fmt(PLANCK.th100,5)+' ± '+fmt(PLANCK.dth100,5)
    +'  (band drawn ×30 to be visible)',b.x+10,b.y+8);

  /* the distance and the ruler, separately */
  axes(ctx,b2,k0,k1,0,1.6,{title:'what curvature does, and does not, change',
    xlab:'Ω_k', ylab:'ratio to the flat case', xfmt:axf(2),
    yfmt:t=>fmt(t,1)});
  ctx.save(); clipTo(ctx,b2);
  const Cflat=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,0);
  const Cdf=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,0);
  if(st.useplanckOm){ Cdf.Om=PLANCK.Om; Cdf.OL=1-Cdf.Om-Cdf.Or; }
  const rs0=soundHorizon(st.zStar,Cflat), dm0=transverseZ(st.zStar,Cdf);
  const rr=[],dd=[];
  for(const ok of ks){
    const Cx=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,ok);
    const Cd=makeCosmo(st.H0,st.Obh2,st.Och2,st.Neff,st.T0,ok);
    if(st.useplanckOm){ Cd.Om=PLANCK.Om; Cd.OL=1-Cd.Om-Cd.Or-Cd.Ok; }
    rr.push(soundHorizon(st.zStar,Cx)/rs0);
    dd.push(transverseZ(st.zStar,Cd)/dm0);
  }
  polyline(ctx,b2,ks,rr,k0,k1,0,1.6,'#cd35c4',2.2);
  polyline(ctx,b2,ks,dd,k0,k1,0,1.6,'#5ac8e0',2.2);
  ctx.restore();
  legendAt(ctx,b2.x+12,b2.y+16,[['#cd35c4','the ruler r_s — unchanged'],
    ['#5ac8e0','the distance D_M — changed']]);

  ctx.save();
  frame(ctx,b3,'#242a3a');
  ctx.restore();
  caption(ctx,b3.x+12,b3.y+10,
    'The sound horizon is set before recombination, where curvature is utterly '
    +'negligible — Ω_k grows only as a², so at z = 1090 a present-day Ω_k of 0.05 '
    +'is 4×10⁻⁵ of the density. So the RULER does not move. What moves is the '
    +'geometry of the path the light takes to us: in an open universe the rays '
    +'diverge and the same ruler looks smaller, in a closed one they converge '
    +'and it looks bigger. Planck measures that angle to 0.03%, and it lands on '
    +'flat. This model gives 100θ_* = '+fmt(100*M.theta,5)+' at Ω_k = '
    +fmt(C.Ok,3)+', which is '+fmt(sigmaFrom(100*M.theta,PLANCK.th100,
      PLANCK.dth100),1)+'σ from the measurement — and at Ω_k = 0 the residual is '
    +'the 0.06 eV neutrino, not the curvature.',W-170,'#8b93a6');
}

/* ================================================================== *
 *  dispatch and scene                                                 *
 * ================================================================== */
/* One banner, drawn on every view, for the two slider corners that are
   universes without the quantities being plotted.  An empty panel is not an
   answer — the same rule as the bouncing universe in standard_candle.html. */
function brokenBanner(ctx,W,H,M){
  let msg=null;
  if(M.zBounce!=null)
    msg='This universe never had a big bang: it is closed and matter-poor, so '
       +'going back the expansion reverses at z = '+sig(M.zBounce,4)
       +' and bounces. No age, no particle horizon, no last-scattering surface.';
  else if(M.zCollapse!=null)
    msg='This universe recollapses — Ω_Λ = '+fmt(M.C.OL,3)+' is negative, so it '
       +'turns over at z = '+fmt(M.zCollapse,4)+' and has no event horizon.';
  if(!msg) return 0;
  ctx.save();
  ctx.fillStyle='rgba(232,132,58,0.10)';
  ctx.fillRect(14,H-46,W-28,34);
  ctx.strokeStyle='#e8843a'; ctx.lineWidth=1;
  ctx.strokeRect(14.5,H-45.5,W-29,33);
  ctx.fillStyle='#e8843a'; ctx.font='11.5px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  const ls=wrapText(ctx,msg,W-56);
  for(let i=0;i<Math.min(2,ls.length);i++)
    ctx.fillText(ls[i],26,H-36+i*15);
  ctx.restore();
  return 34;
}
function drawView(ctx,W,H,M,S){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  brokenBanner(ctx,W,H,M);
  if(v==='fireball') return drawFireball(ctx,W,H,M);
  if(v==='recomb')   return drawRecomb(ctx,W,H,M);
  if(v==='spectrum') return drawSpectrum(ctx,W,H,M);
  if(v==='horizon')  return drawHorizon(ctx,W,H,M);
  if(v==='sound')    return drawSound(ctx,W,H,M);
  if(v==='geometry') return drawGeometry(ctx,W,H,M);
  return drawFireball(ctx,W,H,M);
}
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.62,0.30,12,[0,0,0]);
  let M=null;
  const S={
    st,cam,zoom:1,pan:{x:0,y:0},
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    fit(){ S.zoom=1; S.pan.x=0; S.pan.y=0; },
    resetView(){ S.fit(); },
    /* Every view here is a plot, so the pointer deliberately does nothing.
       Saying so is better than wiring a camera that moves invisible things. */
    pointer(){}, wheel(){}, step(){},
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarText(S.model()); },
    tag(){ return tagText(S.model()); },
    draw(){ drawView(canvas.getContext('2d'),cam.W,cam.H,S.model(),S); },
  };
  return S;
}
/* ================================================================== *
 *  boot                                                               *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  VIEWS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);

        act(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(isOn&&isOn(list[i])?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},namef(o));
      wrapEl.appendChild(c);
    });

    return wrapEl;
  }

  /* ------------------- the universe -------------------------------- */

    o=>Math.abs(st.H0-o.H0)<5e-3&&Math.abs(st.Obh2-o.Obh2)<5e-6
       &&Math.abs(st.Och2-o.Och2)<5e-6&&Math.abs(st.Ok-o.Ok)<5e-4);
  gCos.appendChild(cosChips);

  gCos.appendChild(slider('Och2','Ω_c h²',0,0.30,0.0001,v=>fmt(v,4)));
  gCos.appendChild(slider('Ok','Ω_k',-0.2,0.2,0.001,v=>fmt(v,3)));
  const cosTag=h('div',{class:'tag'}); gCos.appendChild(cosTag);

     Planck derived from the same data, and how far apart they are */

  function syncPanel(){
    const v=st.view;
    gRad.hidden  = !(v==='fireball'||v==='spectrum'||v==='sound'||v==='geometry');
    gSurf.hidden = false;
    gSpec.hidden = (v!=='spectrum');
    gTT.hidden   = (v!=='sound');

      inp.checked=st.useplanckOm; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();

        &&Math.abs(st.Ok-o.Ok)<5e-4);
      cosSrc.innerHTML=cp?cp.src:'a universe of your own';
      radTag.innerHTML='Ω_γh² = <b>'+fmtExp(M.C.Ogh2,4)+'</b> &nbsp; Ω_rh² = <b>'
        +fmtExp(M.C.Orh2,4)+'</b><br>n_γ = <b>'+sig(M.ngamma/1e6,5)
        +'</b> cm⁻³ &nbsp; η = <b>'+fmtExp(M.eta,3)+'</b>';

        +'</b> &nbsp; ℓ_A = <b>'+fmt(M.lA,0)+'</b>';

        +'<b>Planck’s own</b> — computing C_ℓ needs a Boltzmann code and this '
