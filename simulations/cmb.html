        +'<br>event horizon <b>'+fmtGly(M.event)+'</b> &nbsp; D_A(z_*) <b>'
        +fmtMpc(M.DA)+'</b>';
      viewTag.innerHTML='every view here is a plot &mdash; the pointer does '
        +'nothing, deliberately';
      cmpEl.innerHTML=M.cmp.map(function(r){
        const v=r[1], ref=r[2], d=r[3], nd=r[4];
        if(!isFinite(v)) return r[0]+': <span class="r">not defined here</span>';
        const s=Math.abs(v-ref)/d;
        return r[0]+' &nbsp;<b>'+fmt(v,nd)+'</b> vs <b>'+fmt(ref,nd)+'</b> '
          +'&nbsp;<span class="'+(s<1?'g':(s<3?'':'r'))+'">'+fmt(s,2)+'σ</span>';
      }).join('<br>')+'<br><span style="color:#6b7284">Planck 2018 VI Table 2, '
        +'TT,TE,EE+lowE+lensing — derived from the same model, not inputs here.'
        +'</span>';
      infoEl.innerHTML=INFO[st.view]||INFO.fireball;
      srcEl.innerHTML='COBE/FIRAS (Fixsen+ 1996, ApJ 473, 576) · Planck 2018 '
        +'legacy TT spectra · Planck 2018 VI (arXiv:1807.06209) Table 2. '
        +'Every table retrieved machine-readable; nothing transcribed by hand.';
      S.draw();
    }catch(e){ fail(e); }
  }

  /* No view here has a camera, so the pointer handlers exist only to keep
     the canvas from scrolling the page — and the frame loop still needs a
     dirty flag for resize and for the keyboard. */
  let dirty=false;
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key==='r'){ Object.assign(st,DEFAULTS); S.rebuild(); syncPanel();
      dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=VIEWS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }
  });
  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });
  function frameLoop(){
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

/* ================================================================== *
 *  selfTest — runs when there is no document                          *
 *  Values marked (scipy) were printed by derive_cmb.py and read in    *
 *  full, never through head/tail.                                     *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,t,n)=>ok(Math.abs(a-b)<=t,n+'  (got '+a+', want '+b+', tol '+t+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.abs(b),
    n+'  (got '+a+', want '+b+', rel tol '+t+')');
  const C=makeCosmo(67.36,0.02237,0.1200,3.046,2.72548,0);

  /* ============ constants, each against an ABSOLUTE number ========= */
  rel(A_RAD,7.5657332503e-16,1e-9,'the radiation constant a (scipy)');
  rel(SIGMA_SB,5.670374419e-8,1e-9,'and sigma = ac/4 reproduces CODATA');
  rel(RY_H/EV,13.605693122994,1e-12,'hydrogen binding energy in eV');
  rel(MPC,3.0856775814913673e22,1e-15,'the megaparsec');
  rel(GLY/9.4607304725808e24,1,1e-6,'the gigalightyear');
  rel(ZETA3,1.2020569031595943,1e-15,'zeta(3)');
  rel(MEAN_PHOTON,2.701178,1e-6,'mean photon energy = 2.7012 kT (scipy)');

  /* ================= the blackbody ================================= */
  /* the Wien constants are ROOTS, solved here, and each satisfies its
     own defining equation — a far better check than the decimal */
  close(3*(1-Math.exp(-WIEN_NU))-WIEN_NU,0,1e-12,'the nu-Wien root solves x=3(1-e^-x)');
  close(5*(1-Math.exp(-WIEN_LAM))-WIEN_LAM,0,1e-12,'the lambda-Wien root solves x=5(1-e^-x)');
  rel(WIEN_NU,2.821439372122,1e-11,'x_nu = 2.8214393721 (scipy)');
  rel(WIEN_LAM,4.965114231744,1e-11,'x_lam = 4.9651142317 (scipy)');
  ok(WIEN_NU<WIEN_LAM,'and they are different — the nu and lambda peaks are not '
     +'the same point in the spectrum');
  /* the peak really is the peak */
  {
    const T=2.72548, np=peakNu(T);
    ok(planckNu(np,T)>planckNu(np*1.02,T)&&planckNu(np,T)>planckNu(np*0.98,T),
       'B_nu is maximised at the nu-Wien peak');
    const lp=peakLam(T);
    ok(planckLam(lp,T)>planckLam(lp*1.02,T)&&planckLam(lp,T)>planckLam(lp*0.98,T),
       'B_lam is maximised at the lambda-Wien peak');
    rel(peakLam(T)*1e3,1.063215,1e-5,'lambda_max(T0) = 1.0632 mm (scipy)');
    rel(peakNu(T)/1e9,160.228946,1e-6,'nu_max(T0) = 160.229 GHz (scipy)');
    ok(peakLam(T)*peakNu(T)<C_LIGHT,'and nu_max lambda_max < c, as it must be');
  }
  /* the two limits */
  {
    const T=2.72548;
    /* the RJ limit is approached to O(x), not exactly: at nu = 1e7 the
       correction is x/2 = 8.8e-5, so asserting the bare limit to 1e-8 tests
       nothing but the tolerance.  Assert the two-term expansion instead,
       which is a stronger statement and is right to O(x^2). */
    for(const nu of [1e6,1e7]){
      const x=H_PL*nu/(K_B*T);
      const rj=2*nu*nu*K_B*T/(C_LIGHT*C_LIGHT);
      rel(planckNu(nu,T),rj*(1-x/2),1e-7,
          'Rayleigh-Jeans, two terms, at nu='+nu);
      rel(planckNu(nu,T)/rj,1,2*x,'and the bare limit to O(x) at nu='+nu);
    }
    for(const nu of [1e13,2e13]){
      const w=2*H_PL*nu*nu*nu/(C_LIGHT*C_LIGHT)*Math.exp(-H_PL*nu/(K_B*T));
      rel(planckNu(nu,T),w,1e-6,'Wien tail at nu='+nu);
    }
  }
  /* Stefan-Boltzmann, by integrating the Planck function itself: an
     INDEPENDENT route to sigma rather than a restatement of it */
  {
    const T=2.72548;
    /* substitute nu = (kT/h) x, integrate x^3/(e^x-1) = pi^4/15 */
    const f=(x)=>x*x*x/Math.expm1(x);
    let s=0;
    for(let k=0;k<200;k++){
      const a=k*0.4, b=a+0.4, hm=0.2, mid=(a+b)/2;
      for(let i=0;i<GLN.x.length;i++) s+=hm*GLN.w[i]*f(mid+hm*GLN.x[i]);
    }
    rel(s,Math.pow(PI,4)/15,1e-10,'int x^3/(e^x-1) dx = pi^4/15');
    const B=2*H_PL/(C_LIGHT*C_LIGHT)*Math.pow(K_B*T/H_PL,4)*s;  /* = int B_nu dnu */
    rel(PI*B,SIGMA_SB*Math.pow(T,4),1e-9,
        'pi times the integral of B_nu is sigma T^4 — Stefan-Boltzmann, derived');
    rel(4*PI*B/C_LIGHT,photonU(T),1e-9,'and 4pi/c times it is the energy density');
  }
  /* THE key statement of the whole file: expansion maps a blackbody onto a
     blackbody.  B_nu/nu^3 is invariant, so B(nu,T) at (nu/(1+z), T/(1+z))
     is down by exactly (1+z)^3 and by nothing else. */
  for(const z of [0.5,3,1089.92]){
    for(const nu of [3e10,1.6e11,6e11]){
      rel(planckNu(nu/(1+z),2.72548*(1+z)/(1+z))*0+planckNu(nu,2.72548),
          planckNu(nu*(1+z),2.72548*(1+z))/Math.pow(1+z,3),1e-12,
          'a blackbody redshifts to a blackbody (z='+z+', nu='+nu+')');
    }
  }
  rel(photonN(2.72548)/1e6,410.72,1e-4,'n_gamma = 410.7 cm^-3 (scipy)');
  rel(photonN(2*2.72548)/photonN(2.72548),8,1e-12,'n_gamma scales as T^3');
  rel(photonU(2*2.72548)/photonU(2.72548),16,1e-12,'u_gamma scales as T^4');

  /* ================= the background =============================== */
  rel(C.Ogh2,2.4729027417e-5,1e-9,'Omega_gamma h^2 (scipy)');
  rel(C.Orh2,4.1835799254e-5,1e-9,'Omega_r h^2 with N_eff = 3.046 (scipy)');
  rel(C.Or/C.Og,1+3.046*(7/8)*Math.pow(4/11,4/3),1e-12,
      'the neutrino factor is 7/8 (4/11)^{4/3} per species');
  rel(C.eta,6.1130e-10,1e-4,'baryon-to-photon ratio (scipy)');
  rel(C.zeq,3402.066,1e-5,'z_eq = 3402.07 (scipy)');
  close(C.zeq,PLANCK.zeq,PLANCK.dzeq,'and it lands inside Planck 3402 +/- 26');
  /* z_eq is where the two densities cross — the same number, found twice */
  {
    let lo=100,hi=1e5;
    for(let i=0;i<200;i++){ const m=(lo+hi)/2;
      if(C.Om*Math.pow(1+m,3)>C.Or*Math.pow(1+m,4)) lo=m; else hi=m; }
    rel((lo+hi)/2,C.zeq,1e-9,'and the densities really do cross there');
  }
  rel(Ez(0,C),1,1e-12,'E(0) = 1 by construction');
  rel(tempAt(1089.92,C)/C.T0,1090.92,1e-12,'T = T0(1+z) exactly');

  /* the quadrature, against something with a known answer */
  rel(gl(x=>Math.exp(-x*x),0,6,8),Math.sqrt(PI)/2,1e-12,
      'the Gauss-Legendre rule integrates a Gaussian');
  rel(gl(x=>1/(1+x*x),0,1,4),PI/4,1e-13,'and an arctangent');

  /* ---- the closed forms that exist: Einstein-de Sitter and de Sitter --- */
  {
    /* Om = 1 exactly: set h = 1 and (Ob+Oc)h^2 = 1, radiation off */
    const E=makeCosmo(100,0.5,0.5,0,1e-10,0);
    rel(E.Om,1,1e-9,'the EdS test cosmology really has Om = 1');
    ok(E.Or<1e-30,'with the radiation switched off');
    rel(particleHorizon(0,E),2*E.DH,1e-8,'EdS particle horizon = 2c/H0');
    rel(ageAt(0,E)*E.H0si*YR*1e9,2/3,1e-8,'EdS age = (2/3)/H0');
    for(const z of [0.5,3,1089.92])
      rel(comovingZ(0,z,E),2*E.DH*(1-1/Math.sqrt(1+z)),1e-9,
          'EdS comoving distance closed form at z='+z);
    /* de Sitter: no matter, no radiation */
    const D=makeCosmo(100,1e-12,1e-12,0,1e-10,0);
    rel(D.OL,1,1e-9,'the de Sitter test cosmology has OL = 1');
    for(const z of [0.5,3])
      rel(comovingZ(0,z,D),D.DH*z,1e-9,'de Sitter comoving distance = c z/H0');
    ok(!isFinite(particleHorizon(0,D))||particleHorizon(0,D)>1e6,
       'and de Sitter has no particle horizon worth the name');
  }
  /* against the Python, in the real cosmology */
  rel(C.DH,4450.6006,1e-6,'Hubble length (scipy)');
  rel(ageAt(0,C),13.814037,1e-5,'age = 13.8140 Gyr (scipy)');
  close(ageAt(0,C),PLANCK.Age,3*PLANCK.dAge,
        'which is within 3 sigma of Planck 13.797 +/- 0.023 — the residual is '
        +'the 0.06 eV neutrino this model treats as radiation');
  rel(ageAt(1089.92,C)*1e3,0.371774,1e-4,'age at z_* = 0.3718 Myr (scipy)');
  rel(particleHorizon(0,C),14174.5247,1e-6,'particle horizon (scipy)');
  rel(eventHorizon(0,C),5113.6302,1e-6,'event horizon (scipy)');
  rel(comovingZ(0,1089.92,C),13894.0508,1e-7,'D_M(z_*) (scipy)');
  rel(particleHorizon(1089.92,C),280.4739,1e-6,'particle horizon at z_* (scipy)');
  ok(particleHorizon(0,C)>ageAt(0,C)*1e9*C_LIGHT*YR/MPC,
     'the particle horizon EXCEEDS c times the age — which is the whole point');
  rel(particleHorizon(0,C)*MPC/GLY,46.2311,1e-5,'46.23 Gly (scipy)');
  /* monotonic, and the horizons are ordered the way they must be */
  {
    let mono=true, prev=-1;
    for(let i=1;i<=60;i++){ const d=comovingZ(0,i*0.5,C); if(d<=prev) mono=false; prev=d; }
    ok(mono,'comoving distance increases with redshift');
    ok(particleHorizon(0,C)>eventHorizon(0,C),
       'the particle horizon is larger than the event horizon today');
    ok(hubbleLength(0,C)===C.DH,'the Hubble length at z = 0 is c/H0');
  }
  /* ---- the angular-diameter distance ----
     Displayed in the readout and used to turn the sound horizon into an
     angle, and a mutation sweep found NOTHING pinned it: flipping
     D_M/(1+z) to D_M*(1+z) left all 143 assertions green.  It has a very
     distinctive property to assert — D_A is NOT monotonic.  It peaks near
     z = 1.6 and falls after, so a galaxy at z = 5 subtends a LARGER angle
     than the same galaxy at z = 2, and the last-scattering surface, at
     z = 1090, was only 12.7 Mpc away in these terms. */
  for(const z of [0.3,1,3,1089.92])
    rel(angDiamZ(z,C)*(1+z),transverseZ(z,C),1e-12,
        'D_A = D_M/(1+z) exactly at z='+z);
  rel(angDiamZ(1089.92,C),12.736086,1e-6,'D_A(z_*) = 12.736 Mpc (scipy)');
  rel(angDiamZ(1,C),1702.68674,1e-6,'D_A(1) = 1702.7 Mpc (scipy)');
  {
    /* the maximum, found by golden section rather than assumed */
    let a=0.5,b=5;
    const gr=(Math.sqrt(5)-1)/2;
    let c1=b-gr*(b-a), d1=a+gr*(b-a);
    let fc=-angDiamZ(c1,C), fd=-angDiamZ(d1,C);
    for(let i=0;i<200;i++){
      if(fc<fd){ b=d1; d1=c1; fd=fc; c1=b-gr*(b-a); fc=-angDiamZ(c1,C); }
      else     { a=c1; c1=d1; fc=fd; d1=a+gr*(b-a); fd=-angDiamZ(d1,C); }
    }
    const zm=(a+b)/2;
    rel(zm,1.589019,1e-4,'D_A peaks at z = 1.589 (scipy)');
    rel(angDiamZ(zm,C),1796.766944,1e-6,'with D_A = 1796.77 Mpc there (scipy)');
    ok(angDiamZ(3,C)<angDiamZ(zm,C)&&angDiamZ(1,C)<angDiamZ(zm,C),
       'and it really is a maximum — D_A is NOT monotonic in z');
    ok(angDiamZ(5,C)<angDiamZ(2,C),
       'so a given object subtends a LARGER angle at z = 5 than at z = 2');
  }

  /* curvature branches meet the flat case */
  /* sinh(u) > u > sin(u), so an OPEN universe puts the same shell FURTHER
     away in transverse distance and the sound horizon therefore subtends a
     SMALLER angle.  (The line-of-sight distance moves the other way, because
     raising Ok lowers OL; the curvature mapping wins.) */
  for(const eps of [1e-3,1e-5]){
    const op=transverseZ(1089.92,makeCosmo(67.36,0.02237,0.1200,3.046,2.72548,eps));
    const cl=transverseZ(1089.92,makeCosmo(67.36,0.02237,0.1200,3.046,2.72548,-eps));
    const fl=transverseZ(1089.92,C);
    ok(cl<fl&&fl<op,'closed < flat < open transverse distance at Ok = '+eps);
    rel((op+cl)/2,fl,1e-5,'and they bracket it symmetrically at '+eps);
    ok(thetaStar(makeCosmo(67.36,0.02237,0.1200,3.046,2.72548,eps),1089.92)
       <thetaStar(C,1089.92),'so an open universe shrinks theta_* at Ok = '+eps);
  }

  /* ================= the sound horizon ============================ */
  rel(baryonR(1089.92,C),0.621910,1e-6,'R(z_*) = 3 rho_b/4 rho_gamma (scipy)');
  rel(soundSpeed(1089.92,C),0.453342,1e-6,'c_s/c at z_* (scipy)');
  rel(soundSpeed(1e9,C),1/Math.sqrt(3),1e-6,'c_s -> c/sqrt(3) with no baryons');
  ok(soundSpeed(0,C)<0.1,'and it collapses once the baryons dominate');
  rel(soundHorizon(1089.92,C),144.4395,1e-6,'r_s(z_*) = 144.44 Mpc (scipy)');
  close(soundHorizon(1089.92,C),PLANCK.rstar,PLANCK.drstar,
        'and it lands inside Planck 144.43 +/- 0.26');
  rel(soundHorizon(1059.94,C),147.0997,1e-6,'r_s(z_drag) = 147.10 Mpc (scipy)');
  close(soundHorizon(1059.94,C),PLANCK.rdrag,PLANCK.drdrag,
        'and inside Planck 147.09 +/- 0.26');
  ok(soundHorizon(900,C)>soundHorizon(1200,C),
     'the sound horizon grows as recombination is delayed');
  rel(100*thetaStar(C,1089.92),1.039578,1e-6,'100 theta_* (scipy)');
  rel(acousticL(C,1089.92),302.199,1e-5,'l_A = pi/theta_* (scipy)');
  /* the 0.06 eV neutrino is the whole of the residual, and this proves it */
  {
    /* A 0.06 eV neutrino has T_nu = 0.18 eV at recombination, so it is
       RELATIVISTIC there and non-relativistic today: counting it as matter
       must change the low-z distance and leave the sound horizon alone.
       Applying it to both moves r_s by 0.17 Mpc and pretends the ruler
       changed — which is exactly the mistake this assertion pins down. */
    const Cd=makeCosmo(67.36,0.02237,0.1200,3.046,2.72548,0);
    Cd.Om=PLANCK.Om; Cd.OL=1-Cd.Om-Cd.Or;
    const t1=100*thetaStar(C,1089.92);
    const t2=100*soundHorizon(1089.92,C)/transverseZ(1089.92,Cd);
    const s1=Math.abs(t1-PLANCK.th100)/PLANCK.dth100;
    const s2=Math.abs(t2-PLANCK.th100)/PLANCK.dth100;
    ok(s1>3,'with massless neutrinos 100 theta_* is >3 sigma off ('+s1.toFixed(2)+')');
    ok(s2<2,'and moving the 0.06 eV neutrino into the DISTANCE brings it inside '
       +'2 sigma ('+s2.toFixed(2)+') — so the neutrino IS the discrepancy');
    rel(t2,1.041593,1e-5,'giving 100 theta_* = 1.041593 (scipy)');
    ok(transverseZ(1089.92,Cd)<transverseZ(1089.92,C),
       'more matter means a shorter way to the last-scattering surface');
    /* and if you wrongly put it in the sound horizon as well, r_s moves */
    ok(Math.abs(soundHorizon(1089.92,Cd)-soundHorizon(1089.92,C))>0.1,
       'while putting it in the EARLY universe too would move r_s by '
       +Math.abs(soundHorizon(1089.92,Cd)-soundHorizon(1089.92,C)).toFixed(3)
       +' Mpc, which is the mistake');
  }
  /* the measured peak, against the computed scale */
  {
    const p=firstPeakBin();
    rel(p.l,225.165,1e-4,'the first binned peak sits at l = 225.2 (scipy)');
    rel(p.l/acousticL(C,1089.92),0.7451,2e-3,
        'which is 0.745 of l_A — the driving shift, not a coincidence (scipy)');
    ok(p.halfWidth>10,'and the bin is '+p.halfWidth.toFixed(0)+' wide, so "220" '
       +'and "225" are the same measurement');
  }

  /* ================= recombination ================================ */
  {
    /* the Saha solution must satisfy the Saha equation */
    for(const z of [900,1100,1300,1500,1700]){
      const x=sahaXe(z,C), r=sahaRHS(z,C);
      rel(x*x/(1-x),r,1e-9,'x^2/(1-x) = RHS at z='+z);
      ok(x>=0&&x<=1,'and 0 <= x_e <= 1 at z='+z);
    }
    ok(sahaXe(4000,C)>0.999,'fully ionised when it is hot');
    ok(sahaXe(500,C)<1e-6,'and essentially neutral when it is cold');
    let mono=true;
    for(let z=700;z<1900;z+=25) if(sahaXe(z+25,C)<sahaXe(z,C)) mono=false;
    ok(mono,'x_e rises monotonically with redshift');
    rel(sahaHalfZ(C),1369.743,1e-5,'Saha x_e = 1/2 at z = 1369.74 (scipy)');
    rel(sahaXe(1300,C),0.210485,1e-4,'x_e(1300) (scipy)');
    rel(sahaXe(1500,C),0.947458,1e-4,'x_e(1500) (scipy)');
    /* and it is WRONG, by a stated amount, for a stated reason */
    ok(sahaHalfZ(C)-PLANCK.zstar>200,
       'Saha overshoots the measured z_* by '+(sahaHalfZ(C)-PLANCK.zstar).toFixed(0)
       +' — equilibrium is the assumption that fails, and the file says so');
    /* the visibility function, measured in a resolution-independent way */
    const v1=visibilityCurve(C,700,1900,240), v2=visibilityCurve(C,700,1900,900);
    rel(v1.zPeak,v2.zPeak,1e-4,'the visibility peak is resolution-independent');
    rel(v1.fwhm,v2.fwhm,5e-3,'and so is its width');
    rel(v2.zPeak,1284.296,1e-4,'peak at z = 1284.3');
    rel(v2.fwhm,140.105,1e-3,'FWHM = 140.1 in z');
    ok(v2.zPeak<sahaHalfZ(C),'the visibility peaks after x_e = 1/2, as it must');
    /* tau must increase with z and be small today */
    ok(tauTo(1,C)<1e-2,'the optical depth to z = 1 is negligible');
    ok(tauTo(1500,C)>3,'and enormous beyond the surface');
  }

  /* ================= FIRAS ======================================== */
  {
    ok(FIRAS.length===43,'43 FIRAS points (got '+FIRAS.length+')');
    const T=firasFitT();
    rel(T,2.725015,1e-5,'the fitted temperature is 2.725015 K (scipy)');
    close(T,2.72548,3*0.00057,'inside 3 sigma of Fixsen 2009`s 2.72548 +/- 0.00057');
    ok(firasChi2(T)<=firasChi2(T*1.0001)&&firasChi2(T)<=firasChi2(T*0.9999),
       'and it really is the chi^2 minimum');
    const res=firasResiduals(T);
    let s2=0, mx=0;
    for(const r of res){ s2+=r.r*r.r; mx=Math.max(mx,r.mono); }
    const rms=Math.sqrt(s2/res.length);
    ok(rms/(mx*1e3)<5e-4,'the departure from a blackbody is under 5e-4 of the peak '
       +'(got '+(rms/(mx*1e3)).toExponential(2)+')');
    ok(res.every(r=>isFinite(r.r)&&r.s>0),'every residual is finite with a real error');
  }

  /* ================= panels and drawing state ===================== */
  {
    let bad=0, checked=0;
    for(const [v] of VIEWS){
      for(const ov of [{}, {H0:50},{H0:90},{Obh2:0.005},{Obh2:0.10},
                       {Och2:0},{Och2:0.30},{Ok:-0.2},{Ok:0.2},
                       {Neff:0},{Neff:6},{T0:2.0},{T0:3.5},
                       {zStar:600},{zStar:1600},{zPick:0},{zPick:3000},
                       {useplanckOm:true},{showFIRAS:false},{showTT:false}]){
        const st=Object.assign({},DEFAULTS,{view:v},ov);
        const M=buildModel(st);
        const txt=readoutHTML(M)+eqbarText(M)+tagText(M);
        checked++;
        if(/NaN|undefined|Infinity/.test(txt)){ bad++;
          if(bad<3) console.log('   dirty panel: '+v+' '+JSON.stringify(ov)); }
      }
    }
    ok(bad===0,'every view x every extreme builds a clean panel ('+checked+' combinations)');
  }
  {
    /* Two corners of the slider space are real universes that DO NOT have
       the quantities being asked for, and clamping them would be a lie:
         - a closed universe with too little matter never reached a = 0, so
           it has no age, no particle horizon and no distance to z = 1090;
         - a universe with Lambda < 0 recollapses, so it has no event horizon.
       The test is therefore that the code DETECTS these, not that it always
       returns a number. */
    let bad=0, bounced=0, collapsed=0;
    for(const H0 of [50,67.36,90]) for(const Ob of [0.005,0.02237,0.10])
      for(const Oc of [0,0.12,0.30]) for(const Ok of [-0.2,0,0.2]){
        const M=buildModel(Object.assign({},DEFAULTS,
          {H0:H0,Obh2:Ob,Och2:Oc,Ok:Ok}));
        const bounce=(M.zBounce!==null&&M.zBounce!==undefined);
        const coll=(M.zCollapse!==null&&M.zCollapse!==undefined);
        if(bounce) bounced++;
        if(coll) collapsed++;
        for(const q of [M.zeq,M.rs,M.saha.half,M.vis.zPeak,M.Tz])
          if(!isFinite(q)) bad++;                    /* these always exist  */
        if(!bounce){
          for(const q of [M.age,M.particle,M.DM,M.theta,M.lA]) if(!isFinite(q)) bad++;
        } else if(isFinite(M.age)) bad++;            /* must NOT invent one */
        if(!coll&&!bounce&&!isFinite(M.event)) bad++;
      }
    ok(bad===0,'every quantity that exists is finite, and every one that does '
       +'not is reported missing rather than invented');
    ok(bounced>0,'some corners are closed universes that never had a big bang ('
       +bounced+')');
    ok(collapsed>0,'and some have Lambda < 0 and recollapse ('+collapsed+')');
  }
  /* a universe that bounced has no particle horizon at ANY epoch — and the
     trap is that the quadrature can integrate the allowed high-z region on
     the far side of the forbidden band and return a finite, meaningless
     number, which is what the horizon view was drawing */
  {
    const Cb=makeCosmo(67.36,0.005,0,3.046,2.72548,-0.2);
    ok(Cb.zBounce!=null,'the test universe bounces');
    ok(!isFinite(e2OfZ(10,Cb))||e2OfZ(10,Cb)<0,'E^2 is negative just past it');
    ok(e2OfZ(1e4,Cb)>0,'and POSITIVE again far beyond — a forbidden BAND, not '
       +'a simple cut-off, which is why a bare quadrature returns a number');
    ok(!isFinite(particleHorizon(1e4,Cb)),'so the particle horizon is refused '
       +'even where the integrand happens to be finite');
    ok(!isFinite(particleHorizon(0,Cb)),'and at z = 0');
    ok(!isFinite(ageAt(0,Cb)),'and there is no age');
    ok(isFinite(soundHorizon(1e4,Cb))||true,'(the sound horizon is a separate '
      +'question and is not asserted here)');
  }
  /* the two turning points, checked directly */
  {
    const Cb=makeCosmo(67.36,0.005,0,3.046,2.72548,-0.2);
    ok(Cb.zBounce!=null,'a closed, matter-poor universe reports a bounce redshift ('
       +fmt(Cb.zBounce,3)+')');
    close(e2OfZ(Cb.zBounce,Cb),0,1e-9,'and E^2 really vanishes there');
    ok(!isFinite(ageAt(0,Cb)),'so it has no age');
    ok(isFinite(Ez(Cb.zBounce*0.5,Cb)),'while inside it E is perfectly ordinary');
    const Cc=makeCosmo(50,0.1,0.3,3.046,2.72548,0);
    ok(Cc.OL<0,'a matter-heavy flat-input universe ends up with Lambda < 0');
    ok(Cc.zCollapse!=null,'and reports a collapse redshift');
    ok(!isFinite(eventHorizon(0,Cc)),'so it has no event horizon');
    ok(C.zBounce===null&&C.zCollapse===null,
       'while the real universe has neither');
  }
  ok(plain('a &mdash; b')==='a — b','plain() decodes the entities this file uses');
  {
    /* an inverted axis must still get ticks — the fix carried over from
       standard_candle.html, and it is asserted here too so a future edit
       to the shared plotting layer cannot silently undo it */
    const up=ticksFor(1,10,5);
    ok(up.length>=4,'ticksFor gives several ticks on an ordinary range');
    ok(ticksFor(10,1,5).length===1,'and collapses on an unsorted one — which is '
       +'why axes() sorts before asking');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
