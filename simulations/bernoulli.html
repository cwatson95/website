      pt:{M:0.25,alt:0,mano:'mercury',portD:8,showCp:true,showStream:true},
      cp:{M:0.60,gam:1.4},
      tk:{mode:'orifice',Hs:3.0,a:1.0,Do:0.05,Dt:1.2,orf:'sharp',zc:4.0,zd:2.0,
          fluid:'water',showFamily:true,drain:false}};
    const clone=o=>JSON.parse(JSON.stringify(o));
    /* the configurations to sweep — presets plus the corners of every slider,
       because that is where the layout runs out of room */
    const CONFIGS=[];
    for(const [nm,patch] of HEAD_CASES)
      CONFIGS.push(['heads: '+nm,{view:'heads',hd:patch}]);
    for(const extra of [{L:15,D1:0.05,Dt:0.03,De:0.02,zres:9,zin:0,zout:0,hump:2.5},
                        {L:3,D1:0.45,Dt:0.45,De:0.45,zres:0.6,zin:0,zout:0,hump:0},
                        {fluid:'glycerin',rough:'concrete',ent:'borda',station:1},
                        {fluid:'oil',friction:false,sudden:true,station:0}])
      CONFIGS.push(['heads: corner',{view:'heads',hd:extra}]);
    for(const M of [0.02,0.3,0.99,1.01,1.5,3])
      for(const alt of [0,16000])
        CONFIGS.push(['pitot M='+M,{view:'pitot',pt:{M,alt,portD:M>1?0.5:24}}]);
    for(const M of [0.02,1,3]) for(const gam of [1.1,1.7])
      CONFIGS.push(['compress M='+M,{view:'compress',cp:{M,gam}}]);
    for(const c of [{Hs:0.4,a:0.02,Do:0.005,Dt:0.15},{Hs:6,a:5.5,Do:0.30,Dt:4},
                    {Hs:3,a:1.5,orf:'borda'},{Hs:3,a:1.5,orf:'round',showFamily:false},
                    {Hs:1,a:0.5,fluid:'glycerin',drain:true}])
      CONFIGS.push(['tank',{view:'tank',tk:Object.assign({mode:'orifice'},c)}]);
    for(const c of [{zc:0.1,zd:0.05},{zc:6,zd:2},{zc:11.9,zd:6},{zc:2,zd:6}])
      CONFIGS.push(['siphon',{view:'tank',tk:Object.assign({mode:'siphon'},c)}]);

    const sizes=[[1280,800],[1000,640],[840,560],[700,440]];
    let nonFinite=0, offCanvas=0, empty=0, noClip=0, threw=0, nDraw=0;
    for(const [label,patch] of CONFIGS){
      const st2=clone(BASE);
      st2.view=patch.view;
      for(const k of ['hd','pt','cp','tk']) if(patch[k]) Object.assign(st2[k],patch[k]);
      try{ recompute(st2); }catch(e){ threw++;
        console.log('FAIL — '+label+' failed to solve: '+((e&&e.message)||e)); continue; }
      for(const [W,H] of sizes){
        nDraw++;
        const c=stub(W,H);
        try{ drawView(c,W,H,st2); }catch(e){ threw++;
          console.log('FAIL — '+label+' '+W+'x'+H+' threw: '+((e&&e.message)||e)); continue; }
        if(c.ops.length<20) empty++;
        if(c.nClip===0) noClip++;
        for(const o of c.ops){
          if(o.k==='t'){
            let x=o.x; if(o.a==='center') x-=o.w/2;
            else if(o.a==='right'||o.a==='end') x-=o.w;
            if(!isFinite(o.x)||!isFinite(o.y)) nonFinite++;
            else if(!o.rot&&(x<-2||x+o.w>W+2||o.y<-2||o.y>H+2)){ offCanvas++;
              console.log('  off-canvas in '+label+' at '+W+'x'+H+': "'+o.t.slice(0,50)+'"'); }
          } else for(const p of o.p) if(!isFinite(p[0])||!isFinite(p[1])) nonFinite++;
        }
      }
    }
    ok(nDraw===CONFIGS.length*sizes.length,'the sweep drew all '+nDraw+' frames');
    const st=clone(BASE);
    recompute(st);
    ok(threw===0,'every view draws at every size without throwing');
    ok(nonFinite===0,'no non-finite coordinate is ever emitted ('+nonFinite+')');
    ok(offCanvas===0,'no text box leaves the canvas ('+offCanvas+') — measured, not assumed');
    ok(empty===0,'every view actually draws something');
    ok(noClip===0,'every view clips its plot data to a frame');

    /* Dragging must MOVE the drawing.  Two real drawings, animation off, one
       axis at a time — the collection's Known-bad list records that comparing a
       repaint against an idle capture passes with the camera frozen. */
    const geo=(W,H)=>{ const c=stub(W,H); drawView(c,W,H,st);
      return c.ops.filter(o=>o.k!=='t').map(o=>JSON.stringify(o.p)).join('|'); };
    for(const [v,dx,dy] of [['heads',0.17,0],['pitot',0.17,0],
                            ['compress',0.17,0],['tank',0,0.17]]){
      st.view=v; recompute(st);
      const before=geo(1000,640);
      const what=dragBy(st,dx,dy); if(what) recompute(st,what);
      const after=geo(1000,640);
      ok(before!==after,'dragging moves the drawn geometry in the "'+v+'" view');
    }
    /* the siphon branch too */
    st.view='tank'; st.tk.mode='siphon'; recompute(st);
    { const before=geo(1000,640);
      const what=dragBy(st,0,0.2); if(what) recompute(st,what);
      ok(before!==geo(1000,640),'dragging moves the drawn geometry in the siphon view'); }
    st.tk.mode='orifice';

    /* the frame helper's own contract */
    { const F=makeFrame(10,20,300,150,0,10,0,5,false);
      chk('frame maps x0',F.sx(0),10,1e-12,false);
      chk('frame maps x1',F.sx(10),310,1e-12,false);
      chk('frame flips y',F.sy(0),170,1e-12,false);
      chk('frame inverts x',F.ix(F.sx(3.7)),3.7,1e-12,false);
      chk('frame inverts y',F.iy(F.sy(1.9)),1.9,1e-12,false);
      const E=makeFrame(0,0,400,200,0,10,0,10,true);
      chk('equal aspect gives one scale',(E.wx1-E.wx0)/400,(E.wy1-E.wy0)/200,1e-12,true);
      ok(E.wx1-E.wx0>9.99,'equal aspect widens rather than squashing'); }
    /* the readout and the equation bar render for every view */
    for(const v of ['heads','pitot','compress','tank']){
      st.view=v; recompute(st);
      let r='',q='',bad=false;
      try{ r=readoutHTML(st); q=eqbarHTML(st); }catch(e){ bad=true; }
      ok(!bad&&r.length>200&&q.length>60,'the readout and equation bar build for "'+v+'"');
      ok(r.indexOf('NaN')<0&&r.indexOf('undefined')<0,'no NaN or undefined in the "'+v+'" readout');
    }
    st.tk.mode='siphon'; recompute(st);
    { const r=readoutHTML(st);
      ok(r.indexOf('NaN')<0&&r.indexOf('undefined')<0,'no NaN in the siphon readout'); }
  }

  /* ============ I. formatting ============ */
  { ok(fmtP(500).indexOf('Pa')>0&&fmtP(5e4).indexOf('kPa')>0&&fmtP(5e6).indexOf('MPa')>0,
       'fmtP picks its unit');
    ok(fmtQ(0.001).indexOf('L/s')>0&&fmtQ(0.5).indexOf('m³/s')>0,'fmtQ picks its unit');
    ok(pct(0.0227,2)==='2.27 %','pct formats');
    ok(niceTicks(0,10,5).length>=5,'ticks span the range');
    ok(niceTicks(0,1e-9,4).every(isFinite),'ticks survive a tiny range'); }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
