<title>Bernoulli — the height a fluid's energy stands at</title>
<!--
  BERNOULLI'S EQUATION IS A HEIGHT.

  Euler's equation along a streamline, steady, inviscid, constant density,
  gravity the only body force:

        rho V dV/ds  =  -dp/ds  -  rho g dz/ds

  Every term is a perfect derivative in s, so it integrates once and the whole
  of fluid statics-plus-dynamics collapses into a statement that ONE number
  does not change along the streamline:

        p  +  (1/2) rho V^2  +  rho g z   =   const            [Pa]

  Divide it by rho g.  Every term becomes a LENGTH — and a length can be built
  out of glass tubing and looked at:

        p/(rho g)   +   V^2/(2g)   +   z    =   H              [m]
        ---------       --------       -        -
        pressure        velocity      elev.     TOTAL HEAD
        head            head          head

  That is what this file is about, and it is not an analogy.  A vertical tube
  let into the pipe wall fills to exactly p/(rho g) above the tap, so the free
  surfaces of a ROW of such piezometers trace out a line — the HYDRAULIC GRADE
  LINE.  A bent tube facing into the flow stagnates the fluid it catches and so
  fills to p/(rho g) + V^2/(2g): a row of those traces the ENERGY GRADE LINE.
  The vertical gap between the two lines IS the kinetic energy of the flow,
  drawn to scale, in metres of the fluid itself.  Bernoulli's theorem is then
  the claim that with no friction the upper line is FLAT, and every view below
  is a way of watching it stay flat, or watching it fail to.

  Two consequences are worth stating before any of the physics, because they
  are what make the picture worth drawing at all:

    - The pressure head is what is LEFT OVER.  H is fixed by the supply; z is
      fixed by the plumber; V is fixed by continuity.  So p/(rho g) = H - z -
      V^2/2g is a remainder, and it can go negative.  When it does, the HGL
      passes BELOW the pipe, a piezometer would suck air in rather than stand
      up, and if it falls below the vapour pressure the liquid boils.  That is
      cavitation, and on this canvas it is literally a line crossing another
      line.
    - Speeding a flow up costs pressure.  Not "causes" — the two are the same
      book-keeping entry seen from two sides, and which one you call the cause
      depends only on what you held fixed.

  ------------------------------------------------------------------
  THE FOUR VIEWS.

  1. HEADS.  A reservoir feeds a pipe that narrows to a throat and changes
     elevation, and discharges to atmosphere.  The reservoir level sets the
     total head; the pipe geometry and the friction decide what flow that head
     can push.  So the flow rate is SOLVED for, not dialled in: the exit
     velocity head plus the entrance loss plus the integrated Darcy-Weisbach
     friction must eat exactly the available elevation drop, and the friction
     factor itself depends on the flow through the Reynolds number, so the
     whole thing is one nonlinear root-find (a Colebrook solve nested inside a
     Brent solve).  With friction switched OFF that root-find has a closed-form
     answer and it is Torricelli's: V = sqrt(2 g dz).  The sim asserts that.

     Drawn: the duct in true elevation, piezometer columns standing at the HGL,
     Pitot columns standing at the EGL, the two grade lines, the datum, and at
     the station you drag, the three heads as a stacked column you can read off
     against the same vertical scale as the pipe itself.

  2. PITOT.  What the probe actually does.  The nose port stagnates the flow it
     catches (V -> 0, so p -> p0); the flank ports read the static pressure of
     the stream going past.  The difference is the dynamic pressure and the
     manometer turns it into a height:

           p0 - p = (1/2) rho V^2  =  (rho_m - rho) g h

     The flow field around the nose is not sketched.  A uniform stream plus a
     point source is the RANKINE HALF-BODY, an exact solution of Laplace's
     equation, and its stagnation point, its body shape and its Cp are closed
     forms; the nose drawn here IS that body and the pressure colouring IS its
     Cp.  It shows the thing a probe designer cares about: Cp = +1 exactly at
     the nose, but the flank falls to Cp = -0.587, so a static port put in the
     wrong place reads a pressure that is not the stream's.

  3. COMPRESSIBLE.  Where (1/2) rho V^2 stops being the answer.  For a gas the
     integral of dp/rho is not p/rho, and along an isentrope it is

           INT dp/rho  =  [gamma/(gamma-1)] p/rho  =  a^2/(gamma-1)  =  c_p T

     so the Bernoulli constant becomes V^2/2 + c_p T = c_p T0 — which is just
     "the stagnation temperature is constant".  Stagnating the flow then gives

           p0/p  =  [1 + (gamma-1)/2 M^2]^(gamma/(gamma-1))     (isentropic)

     against the incompressible p0/p = 1 + gamma M^2/2.  The two agree to
     O(M^2): the ratio of the dynamic pressures is 1 + M^2/4 + O(M^4), which is
     where the M < 0.3 rule of thumb comes from and how big it actually is
     (2.3% in dynamic pressure, 1.1% in the speed you infer).  Above M = 1 a
     probe cannot read the free stream at all — it sits behind its own bow
     shock — and the reading obeys the Rayleigh supersonic Pitot formula.  Both
     closed forms are checked here against independent constructions rather
     than quoted: the isentropic one against a numerically integrated
     INT dp/rho, the Rayleigh one against a normal-shock jump composed with an
     isentropic compression.

  4. TANK.  Torricelli, 1643, ninety-five years before Hydrodynamica, and the
     cleanest statement of the whole subject: open the tank at depth h and the
     jet leaves at sqrt(2gh), the speed a stone dropped from h arrives at.  All
     the pressure head has turned into velocity head and nothing else happened.
     The view adds the three things that make it real: the finite-tank
     correction 1/sqrt(1 - (Ao/At)^2), the vena contracta (with the two
     coefficients that are EXACT — 1/2 for a Borda mouthpiece by momentum,
     pi/(pi+2) for a slot by Kirchhoff's free-streamline solution — rather than
     the handbook 0.61 that is not), the drain-time integral, the jet's
     parabola and the classic result that the hole that throws furthest is the
     one at mid-depth and it throws exactly the tank's height.  The siphon is
     the same equation run the other way, and it has a ceiling: at 20 C water
     cannot be lifted more than (p_atm - p_vap)/(rho g) = 10.11 m however good
     the pump, because the crest pressure is a remainder too.

  ------------------------------------------------------------------
  WHAT IS ASSERTED, AND WHAT IS ONLY CITED.

  This collection's rule is that a number nobody recomputed is not verified.
  There is no fluid-mechanics text in this repo's books/ directory, so nothing
  here is asserted against a printed table.  What selfTest does instead:

    EXACT, to machine precision — the identities the models are made of.
    Bernoulli closes along the solved duct to 1e-12; the EGL is flat to 1e-12
    with friction off; the Pitot column stands at the EGL and the piezometer at
    the HGL by construction and are asserted to; the isentropic p0/p equals a
    numerically integrated INT dp/rho + V^2/2 = const to 1e-10; the normal-shock
    closed forms satisfy the RAW conservation laws (mass, momentum, energy) to
    1e-13; the Rayleigh Pitot formula equals shock-then-isentropic to 1e-13;
    the Colebrook root satisfies its own implicit equation to 1e-14; the
    drain-time closed form matches an RK4 integration of the tank ODE to 1e-9.

    EXACT BY DEFINITION — a millimetre of conventional mercury at standard
    gravity is 133.322387415 Pa, and the manometer routine has to reproduce
    that to 1e-12 or it is wrong.  (It must NOT reproduce "760 mmHg = 1 atm":
    the torr is 1/760 atm by definition and the mmHg is a density times a
    gravity, and they differ by 1.4e-7.  A check that found them equal would
    have been checking the torr.)  Standard gravity is 9.80665 m/s^2 exactly.
    The ISA sea-level triple (101325 Pa, 288.15 K, 1.225 kg/m^3) closes through
    p = rho R T on R_air = 287.0528 to 2.6e-7 — which is a statement about how
    the standard was rounded, so that is the tolerance used and the reason is
    recorded; the sound speed that follows is the published 340.294 m/s to six
    figures, and the 11 km line of the table (22 632 Pa, 216.65 K, 0.3639
    kg/m^3) comes out of integrating hydrostatic balance rather than being
    typed in.

    CITED, NOT ASSERTED — every transport property (rho, mu, p_vap, bulk
    modulus) is a handbook value at 20 C and is labelled as such in the fluid
    table and on the canvas; the pipe roughnesses are the usual quoted ranges;
    the sharp-edged-orifice C_d ~ 0.61 is quoted only where the two exact
    coefficients above are also shown, and the canvas says which is which.
    Nothing is compared against a table that could not be opened.

  All of it runs headless: no document, no network, `selfTest()` on load.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, DEG=Math.PI/180;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting, so the next such mistake fails loudly in
   selfTest instead of painting the duct black.  (steam_carnot_cycle shipped
   that defect; it is on this collection's Known-bad list.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
/* relative luminance, sRGB — used to assert that a colour ramp is actually
   ordered by eye rather than merely well-formed */
function lum(c){ const [r,g,b]=toRgb(c).map(v=>{ v/=255;
  return v<=0.04045? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*r+0.7152*g+0.0722*b; }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* The pressure-coefficient ramp.  NEON's own lightness is flat over its top
   half (this collection's Known-bad list measured 0.612, 0.624, 0.619, 0.612,
   0.612 in OKLCH over t = 0.5..1), so a magnitude map built straight on it
   loses half its range to the eye.  Cp is a SIGNED quantity anyway, so what it
   wants is a DIVERGING ramp, and for a diverging ramp "monotone lightness" is
   the wrong target — it would make one whole half unreadable.  The right
   target is lightness that rises away from the centre in BOTH directions, so
   that zero is the dim one and |Cp| large is legible either way:

       Cp = -1  bright blue   (fast, and the pressure has gone)
       Cp =  0  dim neutral   (the free stream: nothing to report)
       Cp = +1  bright amber  (stagnation)

   The first draft of this ramp failed that test — measured relative luminance
   came out 0.203 / 0.175 / 0.491, so the low end and the centre were within
   14% of each other and the suction side read as noise.  What selfTest asserts
   is the luminance of the colours ACTUALLY PAINTED, i.e. after the 0.62 mix
   against the page background that the field draw applies, because a ramp that
   is well ordered before compositing and flat after it is still flat. */
const CP_LOW='#4aa8f0', CP_MID='#3c4250', CP_HIGH='#f0b64e';
function cpColour(cp){                       // cp in [-1, 1] is the drawn range
  const t=clamp((cp+1)/2,0,1);
  return t<0.5 ? mix(CP_LOW,CP_MID,t*2) : mix(CP_MID,CP_HIGH,(t-0.5)*2);
}
/* what the canvas really gets */
const CP_FIELD_MIX=0.62;
const cpDrawn=cp=> mix('#070b18',cpColour(cp),CP_FIELD_MIX);

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k==='text') e.textContent=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){ const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c); }
  return e;
}

/* ------------------------------------------------------------------ *
 *  root finding.  Brent, because every solve in this file is a scalar  *
 *  root on a bracket and secant/Newton both fall over somewhere: the   *
 *  duct discharge has a square-root corner at zero flow, and the       *
 *  Rayleigh Pitot inversion is stiff just above M = 1.                 *
 * ------------------------------------------------------------------ */
function brent(f,a,b,tol,maxit){
  tol=tol||1e-14; maxit=maxit||200;
  let fa=f(a), fb=f(b);
  if(fa===0) return a;
  if(fb===0) return b;
  if(fa*fb>0) throw new Error('brent: root not bracketed on ['+a+','+b+'] '
                              +'(f = '+fa.toExponential(3)+', '+fb.toExponential(3)+')');
  let c=a, fc=fa, d=b-a, e=d;
  for(let it=0; it<maxit; it++){
    if(fb*fc>0){ c=a; fc=fa; d=b-a; e=d; }
    if(Math.abs(fc)<Math.abs(fb)){ a=b; b=c; c=a; fa=fb; fb=fc; fc=fa; }
    const tol1=2*Number.EPSILON*Math.abs(b)+0.5*tol;
    const xm=0.5*(c-b);
    if(Math.abs(xm)<=tol1 || fb===0) return b;
    if(Math.abs(e)>=tol1 && Math.abs(fa)>Math.abs(fb)){
      let p,q,r,s=fb/fa;
      if(a===c){ p=2*xm*s; q=1-s; }
      else { q=fa/fc; r=fb/fc;
             p=s*(2*xm*q*(q-r)-(b-a)*(r-1)); q=(q-1)*(r-1)*(s-1); }
      if(p>0) q=-q; p=Math.abs(p);
      const min1=3*xm*q-Math.abs(tol1*q), min2=Math.abs(e*q);
      if(2*p<Math.min(min1,min2)){ e=d; d=p/q; } else { d=xm; e=d; }
    } else { d=xm; e=d; }
    a=b; fa=fb;
    b += Math.abs(d)>tol1 ? d : (xm>0?tol1:-tol1);
    fb=f(b);
  }
  throw new Error('brent: no convergence in '+maxit+' iterations');
}
/* fixed-step RK4, used only to CHECK closed forms against their own ODEs */
function rk4(f,y0,t0,t1,n){
  let y=y0, t=t0; const dt=(t1-t0)/n;
  for(let i=0;i<n;i++){
    const k1=f(t,y), k2=f(t+dt/2,y+dt*k1/2), k3=f(t+dt/2,y+dt*k2/2), k4=f(t+dt,y+dt*k3);
    y += dt*(k1+2*k2+2*k3+k4)/6; t += dt;
  }
  return y;
}
/* adaptive-enough Simpson on a fixed even panel count */
function simpson(f,a,b,n){
  n=n||2000; if(n%2) n++;
  const dx=(b-a)/n; let s=f(a)+f(b);
  for(let i=1;i<n;i++) s += f(a+i*dx)*(i%2?4:2);
  return s*dx/3;
}
/* golden-section maximiser, for checking "the maximum is at ..." claims
   without reusing the analytic answer that is being checked */
function goldenMax(f,a,b,tol){
  tol=tol||1e-12; const gr=(Math.sqrt(5)-1)/2;
  let c=b-gr*(b-a), d=a+gr*(b-a);
  for(let i=0;i<400 && Math.abs(b-a)>tol;i++){
    if(f(c)>f(d)){ b=d; d=c; c=b-gr*(b-a); } else { a=c; c=d; d=a+gr*(b-a); }
  }
  return (a+b)/2;
}

/* ================================================================== *
 *  CONSTANTS                                                          *
 *  Only three of these are exact.  They are marked; everything else    *
 *  is a handbook value and is labelled as one wherever it is shown.    *
 * ================================================================== */
const G0      = 9.80665;          // m/s^2   EXACT — standard gravity, by definition (CGPM 1901)
const P_ATM   = 101325;           // Pa      EXACT — the standard atmosphere, by definition
/* The conventional density of mercury.  EXACT, and it DEFINES the millimetre
   of mercury:  13595.1 * 9.80665 * 1e-3 = 133.322387415 Pa, exactly.

   Careful — the mmHg and the torr are NOT the same unit, and this is the one
   place a manometer routine can be caught out.  The torr is defined as 1/760
   of the standard atmosphere, so it is 101325/760 = 133.32236842... Pa, while
   the mmHg comes from the density above.  They differ by 1.4e-7 relative, so
   760 mmHg is 101325.0144 Pa and NOT one atmosphere.  Irrelevant at any
   pressure anyone measures with a manometer, and worth having right anyway:
   selfTest pins both constants and pins the gap between them, because a
   routine that reproduced "760 mmHg = 101325 Pa exactly" would be wrong by
   exactly the amount that proves it used the torr's definition to check the
   mmHg's. */
const RHO_HG_CONV = 13595.1;      // kg/m^3  EXACT (conventional)
const MMHG    = RHO_HG_CONV*G0*1e-3;    // 133.322387415 Pa, exactly
const TORR    = P_ATM/760;              // 133.32236842... Pa, exactly

/* ISA / ICAO sea level.  These four are a CONSISTENT SET, not four independent
   measurements: R_air is chosen so that p = rho R T closes on the other three,
   and the sound speed follows.  selfTest checks the closure rather than
   trusting the quartet, because that closure is the only part of it that can
   be verified without a document. */
const R_AIR   = 287.0528;         // J/(kg K)  ISA
const GAMMA_A = 1.4;              //           diatomic ideal gas
const T_SL    = 288.15;           // K
const P_SL    = P_ATM;            // Pa
const RHO_SL  = 1.225;            // kg/m^3
const A_SL    = 340.294;          // m/s       published ISA value; recomputed in selfTest

/* ------------------------------------------------------------------ *
 *  Working fluids.  rho, mu, p_vap and the bulk modulus are HANDBOOK   *
 *  values at 20 C and 1 atm unless noted; they are quoted, never       *
 *  asserted against a table.  `a` is the sound speed, which is what     *
 *  turns "incompressible" from an assumption into a number: the ratio   *
 *  of dynamic pressure to elastic modulus is rho V^2 / K = V^2/a^2 =    *
 *  M^2 exactly, so a liquid is incompressible at any ordinary speed     *
 *  for the same reason a gas is not.                                    *
 * ------------------------------------------------------------------ */
const FLUIDS={
  water   :{name:'water',    rho:998.2, mu:1.002e-3, pv:2339,  K:2.18e9,  aQuoted:1481,  col:'#2f7fd0', gas:false, T:293.15},
  seawater:{name:'seawater', rho:1025,  mu:1.07e-3,  pv:2300,  K:2.34e9,  aQuoted:1521,  col:'#2a8f8a', gas:false, T:293.15},
  oil     :{name:'light oil',rho:870,   mu:0.10,     pv:5,     K:1.50e9,  aQuoted:1310,  col:'#a58433', gas:false, T:293.15},
  glycerin:{name:'glycerin', rho:1260,  mu:1.49,     pv:0.014, K:4.35e9,  aQuoted:1904,  col:'#8a7a3a', gas:false, T:293.15},
  mercury :{name:'mercury',  rho:13534, mu:1.55e-3,  pv:0.17,  K:28.5e9,  aQuoted:1450,  col:'#9aa2b2', gas:false, T:293.15},
  air     :{name:'air',      rho:1.204, mu:1.82e-5,  pv:0,     K:GAMMA_A*P_ATM, aQuoted:343.2, col:'#7e8798', gas:true, T:293.15},
};
/* The sound speed is DERIVED from the bulk modulus, a = sqrt(K/rho), not
   copied from the handbook's own column.  The reason is the identity this
   whole file leans on when it claims a liquid is incompressible:

        rho V^2 / K   =   V^2 / a^2   =   M^2

   — the ratio of dynamic pressure to elastic modulus IS the Mach number
   squared.  If a and K came from separate rows of a table that identity would
   hold only to whatever precision the table was internally consistent to, and
   selfTest could not assert it at machine precision.  Deriving one from the
   other makes it exact and moves the question to where it belongs: the quoted
   sound speeds are kept alongside as `aQuoted`, and selfTest reports that they
   agree with sqrt(K/rho) to about 0.3% — which is a measurement of the
   handbook's own consistency, not of this code, and is asserted only loosely
   and labelled as such. */
for(const k in FLUIDS){ const f=FLUIDS[k]; f.a=Math.sqrt(f.K/f.rho); }
/* manometer fluids — the tall-column trade: mercury reads compactly and
   coarsely, gauge oil reads long and finely.  Same handbook caveat. */
const MANO={
  mercury:{name:'mercury',   rho:13534, col:'#9aa2b2'},
  water  :{name:'water',     rho:998.2, col:'#2f7fd0'},
  oil    :{name:'gauge oil', rho:827,   col:'#c2762e'},  // "red oil", sp.gr. 0.827
};
/* Commercial pipe roughness, mm — the usual quoted ranges (Moody's table as it
   is reproduced in every text).  Ranges, because that is what they are: the
   value for commercial steel is a fit to a chart, not a measurement of YOUR
   pipe, and quoting it to three figures would be a lie about its provenance. */
const ROUGHNESS={
  glass   :{name:'drawn / glass',      eps:0.0015},
  steel   :{name:'commercial steel',   eps:0.045},
  galv    :{name:'galvanised iron',    eps:0.15},
  cast    :{name:'cast iron',          eps:0.26},
  concrete:{name:'rough concrete',     eps:2.0},
};
/* ================================================================== *
 *  1.  INCOMPRESSIBLE BERNOULLI, IN METRES                            *
 *                                                                     *
 *      p/(rho g)  +  V^2/(2g)  +  z   =  H                            *
 *                                                                     *
 *  Everything in this section is a length.  The only reason that is    *
 *  allowed is rho = const: the pressure term is the integral of        *
 *  dp/rho, and only for constant rho does that integral come out as    *
 *  p/rho.  Section 3 does the integral properly and shows what it      *
 *  costs to have pretended.                                           *
 * ================================================================== */

/* ---- head <-> pressure, the whole translation --------------------- */
const headOfP = (p,rho)=> p/(rho*G0);           // Pa -> m of that fluid
const pOfHead = (H,rho)=> H*rho*G0;             // m of that fluid -> Pa
const velHead = V => V*V/(2*G0);                // m
const velOfHead = Hv => Math.sqrt(2*G0*Math.max(Hv,0));

/* A U-tube manometer with working fluid `rho` in the legs above a heavier
   gauge fluid `rhom`, deflection `hm`.  Walking round the loop, the two
   columns of working fluid of height hm cancel one leg of gauge fluid:

        dp  =  (rho_m - rho) g h

   The buoyancy term matters more than it looks: for water over mercury it is
   7.4% of the reading, and dropping it is a 7.4% error in dp, i.e. 3.6% in
   every velocity inferred from it.  For air over mercury it is 0.009%.
   This routine is what has to reproduce the definition of the millimetre of
   mercury, and selfTest holds it to 1e-9 relative. */
const manoDp = (hm,rhom,rho)=> (rhom-rho)*G0*hm;
const manoH  = (dp,rhom,rho)=> dp/((rhom-rho)*G0);

/* ------------------------------------------------------------------ *
 *  FRICTION.  Darcy-Weisbach,  h_f = f (L/D) V^2/(2g),  written in     *
 *  differential form  dh_f/dx = f V^2 / (2 g D)  so it can be          *
 *  integrated along a duct whose D and V both vary.                    *
 * ------------------------------------------------------------------ */
const reynolds=(rho,V,D,mu)=> rho*Math.abs(V)*D/mu;

/* Colebrook (1939), solved rather than approximated:

        1/sqrt(f)  =  -2 log10[ eps/(3.7 D)  +  2.51/(Re sqrt f) ]

   implicit in f.  Substituting y = 1/sqrt(f) makes it a clean scalar root,
   y + 2 log10(eps/3.7D + 2.51 y/Re) = 0, monotone in y on the bracket.
   selfTest puts the returned f back into the ORIGINAL equation and requires
   the residual below 1e-14 — the only check that cannot be passed by a
   plausible-looking approximation. */
function colebrook(Re,relEps){
  const g=y=> y + 2*Math.log10(relEps/3.7 + 2.51*y/Re);
  /* Newton, started from Haaland's explicit estimate.  g is smooth and
     monotone on the bracket and the start is within a few percent, so this
     lands in three or four steps — which matters, because the duct solve calls
     it a few hundred thousand times per root-find.  The result is then CHECKED
     against the residual and falls back to a bracketed Brent solve if it is
     not converged, so the fast path cannot silently return a wrong branch. */
  let y=1/Math.sqrt(haaland(Re,relEps));
  for(let i=0;i<12;i++){
    const a=relEps/3.7+2.51*y/Re;
    if(!(a>0)) break;
    const dy=(y+2*Math.log10(a))/(1+2*(2.51/Re)/(a*Math.LN10));
    y-=dy;
    if(Math.abs(dy)<=1e-15*Math.abs(y)) break;
  }
  if(!(y>0)||!(Math.abs(g(y))<1e-12)) y=brent(g,1e-8,60,1e-15);
  return 1/(y*y);
}
/* Haaland (1983) and Swamee-Jain (1976): explicit, and quoted by their authors
   as within about 2% and 1% of Colebrook respectively over the turbulent
   range.  They exist here only as an independent cross-check on the root
   solve — if the Brent solve silently returned a wrong branch, these would
   not follow it. */
const haaland=(Re,relEps)=>{
  const y=-1.8*Math.log10(Math.pow(relEps/3.7,1.11)+6.9/Re); return 1/(y*y); };
const swameeJain=(Re,relEps)=>{
  const y=Math.log10(relEps/3.7+5.74/Math.pow(Re,0.9)); return 0.25/(y*y); };

const RE_LAM=2300, RE_TURB=4000;
/* The laminar branch is EXACT: integrating the Hagen-Poiseuille profile gives
   dp = 32 mu L V / D^2, and writing that as f (L/D) rho V^2/2 forces f = 64/Re
   identically.  No experiment enters.  The turbulent branch is Colebrook,
   which is a fit to Nikuradse's and Colebrook's own experiments — cited, not
   derived.  BETWEEN them is a genuine gap: the transition is not a function of
   Re alone (it depends on inlet disturbance, vibration, roughness history), so
   what is drawn there is an INTERPOLATION and both the code and the canvas
   say so rather than implying a law. */
function frictionFactor(Re,relEps){
  if(!(Re>0)) return 0;
  if(Re<RE_LAM)  return 64/Re;
  if(Re>RE_TURB) return colebrook(Re,relEps);
  const t=smoothstep((Math.log(Re)-Math.log(RE_LAM))/(Math.log(RE_TURB)-Math.log(RE_LAM)));
  return lerp(64/RE_LAM, colebrook(RE_TURB,relEps), t);
}
const flowRegime=Re=> Re<RE_LAM?'laminar' : Re>RE_TURB?'turbulent' : 'transitional';

/* Entrance losses, h = K V^2/2g.  These are quoted experimental values (they
   are geometry-dependent and nobody derives them); the sim shows K on the
   canvas next to the loss it causes so the reader can see it is an input. */
const ENTRANCE={ sharp:{name:'sharp-edged', K:0.50},
                 round:{name:'rounded',     K:0.04},
                 borda:{name:'re-entrant',  K:0.80} };

/* ------------------------------------------------------------------ *
 *  DUCT GEOMETRY.  A pipe of diameter D(x) on a centreline z(x).       *
 * ------------------------------------------------------------------ */
/* Four stages: bore -> venturi throat -> back to bore -> exit nozzle.
   The nozzle is what makes the picture worth drawing.  A pipe that discharges
   at full bore has, by the energy equation, spent its ENTIRE elevation drop on
   exit velocity head, so the pressure head along it is zero to within the
   friction — every piezometer stands flush with the pipe and there is nothing
   to see.  Throttle the exit and the flow drops, the pipe's own velocity head
   collapses as the square, and the pressure head it was hiding stands up in
   the tubes.  It is the same reason a hose with a thumb over the end goes hard
   and the same reason the HGL is a real diagnostic and not a decoration. */
const DUCT_N=361;
function ductD(x,P){
  const c0=Math.max(0,P.xt-P.Lc);                 // contraction start
  const xn=P.xn;                                  // nozzle start
  let D;
  if(x<=c0) D=P.D1;
  else if(x<P.xt) D=P.D1+(P.Dt-P.D1)*smoothstep((x-c0)/(P.xt-c0));
  else if(P.sudden) D=P.D3;                       // step change at the throat
  else{
    const e1=Math.min(xn,P.xt+P.Le);
    D = x<e1 ? P.Dt+(P.D3-P.Dt)*smoothstep((x-P.xt)/(e1-P.xt)) : P.D3;
  }
  if(x>xn && P.De!==P.D3 && P.L>xn)
    D = P.D3+(P.De-P.D3)*smoothstep((x-xn)/(P.L-xn));
  return D;
}
function ductZ(x,P){
  const base=P.zin+(P.zout-P.zin)*smoothstep(clamp(x/P.L,0,1));
  return base + P.hump*Math.exp(-Math.pow((x-P.xh)/P.wh,2));
}
function makeDuct(P){
  const N=DUCT_N, xs=new Float64Array(N), Ds=new Float64Array(N),
        As=new Float64Array(N), zs=new Float64Array(N);
  for(let i=0;i<N;i++){
    const x=P.L*i/(N-1);
    xs[i]=x; Ds[i]=ductD(x,P); As[i]=Math.PI*Ds[i]*Ds[i]/4; zs[i]=ductZ(x,P);
  }
  return {N,xs,Ds,As,zs,P};
}

/* ------------------------------------------------------------------ *
 *  THE DISCHARGE SOLVE.                                                *
 *                                                                      *
 *  A reservoir whose surface sits at z_res feeds the duct, which        *
 *  discharges to atmosphere at its far end.  Write the energy equation  *
 *  from the reservoir surface (V ~ 0, p = 0 gauge) to the exit plane    *
 *  (p = 0 gauge):                                                       *
 *                                                                      *
 *      z_res  =  z_exit + V_exit^2/2g + K_ent V_in^2/2g                 *
 *                       + INT f V^2/(2 g D) dx  +  h_expansion          *
 *                                                                      *
 *  Everything on the right is a function of Q alone, monotone           *
 *  increasing from 0, so there is exactly one root and Brent finds it.  *
 *                                                                      *
 *  The point of solving rather than dialling: with the losses switched  *
 *  off the equation collapses to z_res - z_exit = V_exit^2/2g, whose    *
 *  root is Torricelli's V = sqrt(2 g dz) — so the frictionless limit of  *
 *  a pipe network is the hole in the bucket of view 4, and selfTest      *
 *  asserts the solver reproduces it to 1e-12 rather than special-casing  *
 *  it.                                                                  *
 * ------------------------------------------------------------------ */

/* Sudden expansion, the one minor loss that is NOT empirical.  Take a control
   volume across the step, apply momentum with the standing pressure acting on
   the annular face, and combine with the energy equation; the leftover is

        h_L  =  (V1 - V2)^2 / (2g)                    (Borda-Carnot)

   Exactly the kinetic energy of the velocity DIFFERENCE.  It is why a venturi
   gets its pressure back and a sudden expansion does not, and selfTest derives
   it from the raw momentum balance rather than trusting the formula. */
const bordaCarnot=(V1,V2)=> (V1-V2)*(V1-V2)/(2*G0);

function ductLosses(D,Q,fl,opt){
  /* returns {cum, total, hEnt, hExp} — cum[i] is the head lost from the
     reservoir up to station i INCLUSIVE of the entrance loss.
     dh/dx = f V^2 / (2 g D) is evaluated ONCE per node and trapezoided; the
     first draft evaluated it twice per interval, which doubled the Colebrook
     count for a result identical to floating point. */
  const N=D.N, cum=new Float64Array(N);
  const hEnt=opt.friction ? opt.Kent*velHead(Q/D.As[0]) : 0;
  let acc=hEnt, hExp=0;
  cum[0]=acc;
  let gPrev=0;
  if(opt.friction){
    const V0=Q/D.As[0];
    gPrev=frictionFactor(reynolds(fl.rho,V0,D.Ds[0],fl.mu),opt.eps/D.Ds[0])
          *V0*V0/(2*G0*D.Ds[0]);
  }
  for(let i=1;i<N;i++){
    if(opt.friction){
      const V=Q/D.As[i];
      const g=frictionFactor(reynolds(fl.rho,V,D.Ds[i],fl.mu),opt.eps/D.Ds[i])
              *V*V/(2*G0*D.Ds[i]);
      acc += 0.5*(gPrev+g)*(D.xs[i]-D.xs[i-1]);
      gPrev=g;
    }
    /* the step, if the diffuser is sudden: charge it where D jumps */
    if(D.P.sudden && D.xs[i-1]<D.P.xt && D.xs[i]>=D.P.xt){
      const V1=Q/(Math.PI*D.P.Dt*D.P.Dt/4), V2=Q/(Math.PI*D.P.D3*D.P.D3/4);
      hExp=bordaCarnot(V1,V2); acc+=hExp;
    }
    cum[i]=acc;
  }
  return {cum,total:acc,hEnt,hExp};
}

function solveDuct(P,fl,opt){
  const D=makeDuct(P);
  const zExit=D.zs[D.N-1], Aexit=D.As[D.N-1];
  const dz=P.zres-zExit;
  /* residual: available head minus everything it must pay for */
  const resid=Q=>{
    const Vex=Q/Aexit;
    return dz - velHead(Vex) - ductLosses(D,Q,fl,opt).total;
  };
  let Q=0, solved=false;
  if(dz>1e-12){
    /* bracket by doubling from the frictionless answer, which is an upper
       bound: losses only ever reduce the flow */
    let hi=Aexit*Math.sqrt(2*G0*dz)*1.000001;
    if(resid(hi)>0){ for(let k=0;k<60 && resid(hi)>0;k++) hi*=2; }
    Q=brent(resid,0,hi,1e-15); solved=true;
  }
  /* march the grade lines */
  const N=D.N, V=new Float64Array(N), EGL=new Float64Array(N), HGL=new Float64Array(N),
        pg=new Float64Array(N), pa=new Float64Array(N), Re=new Float64Array(N),
        ff=new Float64Array(N);
  const L=ductLosses(D,Q,fl,opt);
  let cav=-1, minPa=Infinity;
  for(let i=0;i<N;i++){
    V[i]=Q/D.As[i];
    EGL[i]=P.zres-L.cum[i];
    HGL[i]=EGL[i]-velHead(V[i]);
    pg[i]=pOfHead(HGL[i]-D.zs[i],fl.rho);
    pa[i]=pg[i]+P_ATM;
    Re[i]=reynolds(fl.rho,V[i],D.Ds[i],fl.mu);
    ff[i]=opt.friction?frictionFactor(Re[i],opt.eps/D.Ds[i]):0;
    if(pa[i]<minPa){ minPa=pa[i]; }
    if(cav<0 && pa[i]<=fl.pv) cav=i;
  }
  return {D,Q,V,EGL,HGL,pg,pa,Re,ff,loss:L,solved,dz,zExit,
          cavIdx:cav, minPa, fl, opt, P,
          Vexit:Q/Aexit, Vthroat:Q/(Math.PI*P.Dt*P.Dt/4)};
}

/* the three heads at one station — this is the stacked column the view draws */
function headsAt(S,i){
  return { z:S.D.zs[i], p:S.HGL[i]-S.D.zs[i], v:velHead(S.V[i]),
           H:S.EGL[i], hgl:S.HGL[i], V:S.V[i], D:S.D.Ds[i],
           pg:S.pg[i], pa:S.pa[i], Re:S.Re[i], f:S.ff[i], x:S.D.xs[i] };
}

/* Venturi meter, the classic use of all this.  Bernoulli + continuity between
   an upstream tap (1) and the throat (2), no losses, same elevation:

        Q_ideal  =  A2 sqrt( 2 dp / (rho (1 - beta^4)) ),   beta = D2/D1

   The 1 - beta^4 is the finite-approach correction: the upstream fluid is
   already moving, so not all of the throat's kinetic energy was bought with
   pressure.  Real meters carry a discharge coefficient C ~ 0.98 for a machined
   venturi (cited, not derived); the ideal form is exact and is what selfTest
   checks against the general solver. */
function venturiQ(dp,D1,D2,rho,C){
  const b=D2/D1, A2=Math.PI*D2*D2/4;
  return (C===undefined?1:C)*A2*Math.sqrt(2*dp/(rho*(1-Math.pow(b,4))));
}
function venturiDp(Q,D1,D2,rho){
  const b=D2/D1, A2=Math.PI*D2*D2/4;
  return rho*(1-Math.pow(b,4))*Math.pow(Q/A2,2)/2;
}
/* ================================================================== *
 *  2.  WHEN rho STOPS BEING A CONSTANT                                *
 *                                                                     *
 *  Bernoulli's real content is that the steady Euler equation has a    *
 *  first integral along a streamline:                                 *
 *                                                                     *
 *        INT dp/rho  +  V^2/2  +  g z   =   const                     *
 *                                                                     *
 *  The incompressible form is the special case where the integral can  *
 *  be done by inspection.  For a perfect gas on an isentrope           *
 *  p/rho^gamma = const, so                                            *
 *                                                                     *
 *        INT dp/rho = [gamma/(gamma-1)] p/rho = a^2/(gamma-1) = c_p T  *
 *                                                                     *
 *  and the constant becomes V^2/2 + c_p T = c_p T0.  Bernoulli for a   *
 *  gas is nothing but "the stagnation temperature does not change".    *
 *  selfTest does that integral NUMERICALLY along the isentrope and     *
 *  checks it against the closed form, so the identity above is         *
 *  verified rather than quoted.                                       *
 *                                                                     *
 *  Two heights worth holding side by side, both computed below:        *
 *  one atmosphere is 10.3 m of water, and the stagnation enthalpy of   *
 *  still sea-level air is 29.5 KILOMETRES of air.  That ratio is why   *
 *  the g z term is the first thing a gas dynamicist throws away and    *
 *  the last thing a hydraulic engineer would.                          *
 * ================================================================== */

const soundSpeed=(T,R,gam)=> Math.sqrt((gam||GAMMA_A)*(R||R_AIR)*T);
const cpOf=(R,gam)=> (gam||GAMMA_A)*(R||R_AIR)/((gam||GAMMA_A)-1);

/* ---- isentropic stagnation ratios, the closed forms ---------------- */
const T0overT=(M,gam)=>{ const g=gam||GAMMA_A; return 1+(g-1)/2*M*M; };
const p0overp=(M,gam)=>{ const g=gam||GAMMA_A; return Math.pow(T0overT(M,g),g/(g-1)); };
const r0overr=(M,gam)=>{ const g=gam||GAMMA_A; return Math.pow(T0overT(M,g),1/(g-1)); };
/* subsonic/supersonic inversion of p0/p — algebraic, no iteration needed */
const machFromP0p=(r,gam)=>{ const g=gam||GAMMA_A;
  return Math.sqrt(2/(g-1)*(Math.pow(r,(g-1)/g)-1)); };
/* isentropic area ratio — only used for the choking inset */
const areaRatio=(M,gam)=>{ const g=gam||GAMMA_A;
  return (1/M)*Math.pow((2/(g+1))*T0overT(M,g),(g+1)/(2*(g-1))); };

/* ---- the incompressible pretender --------------------------------- *
 *  q = (1/2) rho V^2 = (gamma/2) p M^2 exactly, so "p0 = p + q" reads   *
 *  p0/p = 1 + gamma M^2/2 — a POLYNOMIAL where the truth is a power.    *
 *  They share their first two terms and part company at M^4.            */
const p0overpIncomp=(M,gam)=>{ const g=gam||GAMMA_A; return 1+g*M*M/2; };
const dynPressure=(rho,V)=> 0.5*rho*V*V;

/* The ratio the whole "is it compressible?" question reduces to:
 *
 *     dp_compressible / q   =  [ (1+(g-1)M^2/2)^(g/(g-1)) - 1 ] / (g M^2/2)
 *                           =  1 + M^2/4 + (2-g) M^4/24 + O(M^6)
 *
 * The series is derived in selfTest by finite-differencing this function at
 * M -> 0, not by trusting the algebra above. */
/* Written with expm1/log1p rather than as (p0overp - 1).  At small M the
   direct form subtracts two numbers that agree to fifteen digits: at M = 1e-3,
   p0/p - 1 is 7e-7 computed from quantities of order 1, and the ratio comes out
   0.2496 instead of 0.2500 — a 0.2% error in a quantity whose whole job is to
   be 1 + M^2/4 to high accuracy.  expm1(n log1p(x)) never forms the 1. */
function compressibilityFactor(M,gam){
  const g=gam||GAMMA_A;
  if(!(M>0)) return 1;
  const x=(g-1)/2*M*M;
  return Math.expm1((g/(g-1))*Math.log1p(x))/(g*M*M/2);
}
/* If you measure the TRUE dp and apply the incompressible formula, the speed
   you infer is too high by sqrt of that factor. */
const speedOverread=(M,gam)=> Math.sqrt(compressibilityFactor(M,gam));

/* ---- normal shock -------------------------------------------------- *
 *  The closed forms.  selfTest does not take them on trust: it puts the  *
 *  downstream state back into the RAW conservation laws                  *
 *      rho1 V1 = rho2 V2,  p1 + rho1 V1^2 = p2 + rho2 V2^2,              *
 *      h1 + V1^2/2 = h2 + V2^2/2                                         *
 *  and requires all three residuals below 1e-13.                         */
function normalShock(M1,gam){
  const g=gam||GAMMA_A, M1s=M1*M1;
  const M2s=(1+(g-1)/2*M1s)/(g*M1s-(g-1)/2);
  const pr=(2*g*M1s-(g-1))/(g+1);                 // p2/p1
  const rr=((g+1)*M1s)/((g-1)*M1s+2);             // rho2/rho1
  const Tr=pr/rr;                                 // T2/T1
  const p0r=Math.pow(((g+1)*M1s/2)/(1+(g-1)/2*M1s),g/(g-1))
           *Math.pow((g+1)/(2*g*M1s-(g-1)),1/(g-1));   // p02/p01
  return {M2:Math.sqrt(M2s), pr, rr, Tr, p0r,
          /* entropy rise, the reason the jump only goes one way */
          ds:(R_AIR)*(g/(g-1)*Math.log(Tr)-Math.log(pr))};
}

/* ---- RAYLEIGH SUPERSONIC PITOT ------------------------------------- *
 *  Above M = 1 a Pitot tube cannot see the free stream: it sits behind   *
 *  its own detached bow shock, and the stagnation streamline crosses     *
 *  that shock at its normal point.  So the nose reads p0 BEHIND a normal *
 *  shock, referred to the pressure AHEAD of it:                          *
 *                                                                       *
 *   p02/p1 = [ (g+1)^2 M1^2 / (4 g M1^2 - 2(g-1)) ]^(g/(g-1))            *
 *            x [ (1 - g + 2 g M1^2) / (g+1) ]                            *
 *                                                                       *
 *  At M1 = 1 the shock has zero strength and this must reduce to the     *
 *  isentropic p0/p; it does, and selfTest checks both that and the       *
 *  general agreement with shock-then-isentropic composed by hand.        */
function rayleighPitot(M1,gam){
  const g=gam||GAMMA_A, M1s=M1*M1;
  return Math.pow((g+1)*(g+1)*M1s/(4*g*M1s-2*(g-1)),g/(g-1))
       * ((1-g+2*g*M1s)/(g+1));
}
/* what a probe reads at ANY Mach number, as a ratio to the ambient static */
const pitotRatio=(M,gam)=> M<=1 ? p0overp(M,gam) : rayleighPitot(M,gam);
/* ...and its inversion, which is what a supersonic probe actually has to do */
function machFromPitot(ratio,gam){
  const g=gam||GAMMA_A;
  if(ratio<=1) return 0;
  const sub=machFromP0p(ratio,g);
  if(sub<=1) return sub;
  return brent(M=>rayleighPitot(M,g)-ratio,1,60,1e-14);
}

/* ---- ISA, so "at altitude" means something ------------------------- *
 *  Troposphere: linear lapse to 11 km, then isothermal.  The exponent    *
 *  g/(R L) is not a fitted number, it is what integrating hydrostatic     *
 *  balance dp/dz = -rho g through p = rho R T with T linear gives.        *
 *  selfTest checks the model reproduces the published 11 km values        *
 *  (22 632 Pa, 216.65 K, 0.3639 kg/m^3) — the one place in this file      *
 *  where a published number is used as a target, and it is legitimate     *
 *  because ISA is a DEFINITION, not a measurement.                        */
const ISA_L=0.0065, ISA_ZT=11000, ISA_TT=216.65;
function isa(z){
  let T,p;
  if(z<=ISA_ZT){ T=T_SL-ISA_L*z; p=P_SL*Math.pow(T/T_SL,G0/(R_AIR*ISA_L)); }
  else{ const pT=P_SL*Math.pow(ISA_TT/T_SL,G0/(R_AIR*ISA_L));
        T=ISA_TT; p=pT*Math.exp(-G0*(z-ISA_ZT)/(R_AIR*ISA_TT)); }
  const rho=p/(R_AIR*T);
  return {T,p,rho,a:soundSpeed(T,R_AIR,GAMMA_A),z};
}

/* ---- the three airspeeds ------------------------------------------- *
 *  An airspeed indicator is a pressure gauge with a speed printed on the  *
 *  dial, and the print is done ONCE, at sea level, with the compressible  *
 *  formula.  So the needle shows CAS wherever you are; EAS is CAS with     *
 *  the compressibility of the actual altitude taken out; TAS is what the   *
 *  aeroplane is doing.  Only TAS is a speed through the air, and only EAS  *
 *  is what the wing feels, which is why the two that matter are the two    *
 *  the instrument does not show.                                           */
/* The sea-level reference used by the instrument laws is taken from the SAME
   atmosphere model the flow is evaluated in, not from the published rounded
   pair.  Otherwise CAS and EAS miss TAS by 1.5e-7 at sea level — where all
   three are supposed to coincide identically — purely because 1.225 kg/m^3 and
   340.294 m/s are rounded versions of what p = rho R T actually gives.  The
   published values are still checked against the model in selfTest; they are
   just not used to define the instrument. */
const RHO_SL_MODEL=P_SL/(R_AIR*T_SL), A_SL_MODEL=Math.sqrt(GAMMA_A*R_AIR*T_SL);
function airspeeds(M,alt){
  const A=isa(alt);
  const V=M*A.a;
  const qc=A.p*(pitotRatio(M,GAMMA_A)-1);            // p0 - p, what the probe sees
  /* invert at SEA LEVEL to get CAS — subsonic calibration law */
  const cas=A_SL_MODEL*Math.sqrt(2/(GAMMA_A-1)*(Math.pow(qc/P_SL+1,(GAMMA_A-1)/GAMMA_A)-1));
  const eas=V*Math.sqrt(A.rho/RHO_SL_MODEL);
  const inc=Math.sqrt(2*qc/A.rho);                   // naive "V = sqrt(2 dp/rho)"
  return {V,qc,cas,eas,tas:V,incomp:inc,isa:A,M};
}

/* ---- area-velocity: why a venturi reverses above M = 1 -------------- *
 *  Continuity  d(rho)/rho + dA/A + dV/V = 0, Euler dp = -rho V dV and     *
 *  the isentrope dp = a^2 d(rho) combine to                               *
 *                                                                        *
 *        dA/A  =  (M^2 - 1) dV/V                                          *
 *                                                                        *
 *  Below M = 1 the bracket is negative and squeezing the duct speeds the   *
 *  flow up, exactly as the incompressible picture says.  Above M = 1 it     *
 *  changes sign: squeezing SLOWS it.  Nothing in view 1 survives that,      *
 *  and this one line is why.  Verified in selfTest by differentiating       *
 *  the area-ratio function instead of re-deriving it. */
const areaVelocityFactor=M=> M*M-1;
/* ================================================================== *
 *  3.  THE PROBE.  RANKINE HALF-BODY — AN EXACT NOSE.                 *
 *                                                                     *
 *  A Pitot nose is not sketched here.  Superpose a uniform stream U    *
 *  with a point source of strength Lambda at the origin and the        *
 *  dividing streamline closes round the source and opens downstream:   *
 *  a round-nosed semi-infinite body, the Rankine half-body, and an     *
 *  exact solution of Laplace's equation.  Writing b = Lambda/(2 pi U): *
 *                                                                     *
 *      psi   =  U y + U b theta,      body is psi = pi U b             *
 *      body  :  y = b (pi - theta),   x = y / tan(theta)               *
 *      nose  :  (x, y) = (-b, 0)      half-width -> pi b               *
 *      u = U (1 + b x/r^2),   v = U b y / r^2                          *
 *      Cp = 1 - (u^2+v^2)/U^2 = -2 b cos(theta)/r - b^2/r^2            *
 *                                                                     *
 *  Cp = +1 at the nose, exactly, and that is the whole Pitot principle: *
 *  the total port sits at the one point in the field where the fluid    *
 *  has been brought to rest without loss, so it reads p0.               *
 *                                                                     *
 *  The same solution then delivers the bad news about the STATIC port.  *
 *  On the flank Cp reaches -0.587 (found here by maximising, not        *
 *  quoted), and it only decays as -2b/x, so a port even ten probe       *
 *  diameters back still sits about 3% low in q.  Real Pitot-static      *
 *  tubes cancel that against the positive interference of the stem —    *
 *  which is NOT in this solution, and the canvas says so rather than    *
 *  letting the reader assume the model covers the whole instrument.     *
 * ================================================================== */
function halfBodyVel(x,y,U,b){
  const r2=x*x+y*y;
  if(r2<1e-14) return {u:0,v:0,V:0};
  const u=U*(1+b*x/r2), v=U*b*y/r2;
  return {u,v,V:Math.hypot(u,v)};
}
const halfBodyCp=(x,y,U,b)=>{ const q=halfBodyVel(x,y,U,b); return 1-(q.V*q.V)/(U*U); };
const halfBodyPsi=(x,y,U,b)=> U*y + U*b*Math.atan2(y,x);
/* the body outline, nose first.  y = b(pi - theta) is exact and linear in
   theta, so sampling theta uniformly samples the WIDTH uniformly — which is
   the coordinate that has to look smooth.  (Sampling x uniformly would crowd
   every point into the nose and draw the shoulder as three chords.) */
function halfBodyOutline(b,xMax,n){
  n=n||220; const pts=[[-b,0]];
  for(let i=1;i<=n;i++){
    const th=Math.PI*(1-i/(n+1));            // pi -> 0, never touching either end
    const y=b*(Math.PI-th), x=y/Math.tan(th);
    if(x>xMax) break;
    pts.push([x,y]);
  }
  /* run the flank straight out to the end of the frame.  The first draft
     interpolated towards the asymptotic half-width here and drew a visible
     notch where the body met the frame edge. */
  const last=pts[pts.length-1];
  if(last[0]<xMax) pts.push([xMax,last[1]]);
  return pts;
}
/* Cp on the body as a function of distance back from the NOSE, in probe
   diameters (d = 2 pi b, the asymptotic thickness) — the static-port curve */
function halfBodyFlankCp(sD,b){
  const xTarget=-b+sD*(2*Math.PI*b);
  if(xTarget<=-b) return 1;
  /* invert x(theta) = b(pi-theta)/tan(theta); x is monotone decreasing in
     theta on (0, pi), so a bracket is safe */
  const xOf=th=>{ const y=b*(Math.PI-th); return y/Math.tan(th); };
  const th=brent(t=>xOf(t)-xTarget,1e-9,Math.PI-1e-9,1e-14);
  const y=b*(Math.PI-th), x=xOf(th);
  return halfBodyCp(x,y,1,b);
}
/* streamlines by arc-length integration — robust where contouring psi is not,
   because the stagnation point is a coordinate singularity for the contour
   and merely a slow patch for the march */
function halfBodyStream(y0,x0,x1,b,ds,maxN){
  const pts=[[x0,y0]]; let x=x0,y=y0;
  const dir=(px,py)=>{ const q=halfBodyVel(px,py,1,b); const m=q.V||1e-12;
                       return [q.u/m,q.v/m]; };
  for(let i=0;i<(maxN||4000);i++){
    const k1=dir(x,y);
    const k2=dir(x+ds*k1[0]/2, y+ds*k1[1]/2);
    const k3=dir(x+ds*k2[0]/2, y+ds*k2[1]/2);
    const k4=dir(x+ds*k3[0],   y+ds*k3[1]);
    x += ds*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6;
    y += ds*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6;
    if(!isFinite(x)||!isFinite(y)) break;
    pts.push([x,y]);
    if(x>x1) break;
  }
  return pts;
}

/* ================================================================== *
 *  4.  THE TANK.  TORRICELLI, 1643.                                   *
 *                                                                     *
 *  Bernoulli from the free surface to the jet: atmosphere at both      *
 *  ends, so the pressure terms cancel and the elevation head turns     *
 *  wholly into velocity head.                                         *
 *                                                                     *
 *      V  =  sqrt( 2 g h / (1 - (Ao/At)^2) )                          *
 *                                                                     *
 *  the denominator being the only honest part most statements leave    *
 *  out: the surface is descending too, and its kinetic energy was      *
 *  paid for out of the same head.  It matters at the 1% level once     *
 *  Ao/At exceeds 1/7.                                                  *
 *                                                                     *
 *  TWO OF THE CONTRACTION COEFFICIENTS ARE EXACT AND ONE IS NOT, and   *
 *  keeping them apart is the point of this view:                       *
 *                                                                     *
 *   - Borda mouthpiece (a tube projecting INTO the tank): Cc = 1/2      *
 *     exactly.  The re-entrant tube leaves the tank wall as the only    *
 *     surface the gauge pressure can push on, so momentum reads         *
 *     rho V^2 Aj = rho g h Ao, and V^2 = 2 g h forces Aj = Ao/2.        *
 *     No experiment, no fit.                                           *
 *   - Sharp-edged SLOT in a plane wall, two-dimensional: Cc = pi/(pi+2) *
 *     = 0.6110155, Kirchhoff's free-streamline solution.  Exact.        *
 *   - Sharp-edged ROUND hole: about 0.61-0.64, measured.  There is no    *
 *     closed form, and the sim labels this one as quoted.                *
 * ================================================================== */
const CC_BORDA = 0.5;                     // EXACT, by momentum
const CC_SLOT  = Math.PI/(Math.PI+2);     // EXACT, Kirchhoff free-streamline
const ORIFICE={
  sharp:{name:'sharp-edged hole', Cc:0.62,     Cv:0.98, exact:false,
         note:'Cc quoted (0.61-0.64); no closed form for a round hole'},
  slot :{name:'sharp-edged slot',  Cc:CC_SLOT, Cv:0.98, exact:true,
         note:'Cc = pi/(pi+2) exactly — Kirchhoff free-streamline'},
  borda:{name:'Borda mouthpiece',  Cc:CC_BORDA,Cv:0.98, exact:true,
         note:'Cc = 1/2 exactly — momentum on the re-entrant tube'},
  round:{name:'well-rounded',      Cc:1.00,    Cv:0.98, exact:false,
         note:'a bellmouth has no contraction; Cv quoted'},
};
/* ideal efflux speed, with the finite-tank correction kept */
function torricelli(h,Ao,At){
  const r=At>0?Ao/At:0;
  return Math.sqrt(2*G0*Math.max(h,0)/(1-r*r));
}
/* what actually comes out */
function efflux(h,Ao,At,orf){
  const Vi=torricelli(h,Ao,At);
  const V=orf.Cv*Vi;                       // velocity coefficient: friction at the lip
  const Aj=orf.Cc*Ao;                      // contraction
  return {Vi,V,Aj,Q:V*Aj,Cd:orf.Cc*orf.Cv};
}
/* Drain time, quasi-steady: At dh/dt = -Cd Ao sqrt(2 g h) integrates to
      t = (At / (Cd Ao)) sqrt(2/g) (sqrt(h0) - sqrt(h1)).
   Quasi-steady is the assumption doing the work here — it drops the unsteady
   term d(phi)/dt from Bernoulli, which is legitimate only while the surface
   speed is small compared with the jet's, i.e. while Ao << At.  selfTest
   checks the closed form against an RK4 march of the same ODE (that tests the
   integration) AND reports the size of the neglected term (that tests the
   assumption, which is the part a formula check cannot see). */
function drainTime(h0,h1,Ao,At,Cd){
  return (At/(Cd*Ao))*Math.sqrt(2/G0)*(Math.sqrt(h0)-Math.sqrt(h1));
}
function drainHeight(t,h0,Ao,At,Cd){
  const s=Math.sqrt(h0)-0.5*Cd*(Ao/At)*Math.sqrt(2*G0)*t;
  return s>0? s*s : 0;
}
/* the jet's parabola: leaves horizontally at height `a` above the floor */
function jetPath(V,a,n){
  const tEnd=Math.sqrt(2*a/G0), pts=[];
  n=n||60;
  for(let i=0;i<=n;i++){ const t=tEnd*i/n; pts.push([V*t, a-G0*t*t/2]); }
  return pts;
}
/* Range on the floor.  With the surface at H and the hole at a, the head is
   h = H - a and the fall is a, so R = 2 sqrt((H-a) a): a semicircle in a.
   Maximum at a = H/2, where R = H exactly — the tank throws its own height.
   selfTest finds that maximum by golden section rather than reusing H/2. */
const jetRange=(H,a)=> 2*Math.sqrt(Math.max((H-a)*a,0));

/* ---- the siphon, and its ceiling ---------------------------------- *
 *  Source surface as datum, crest at +zc, outlet at -zd.  Bernoulli to   *
 *  the outlet gives V = sqrt(2 g zd) — the crest height does not appear,  *
 *  which is the surprising part.  It appears in the PRESSURE instead:     *
 *                                                                       *
 *      p_crest  =  p_atm - rho g ( zc + V^2/2g )                         *
 *                                                                       *
 *  a remainder again, and again it can run out.  Setting p_crest = p_vap  *
 *  gives a hard ceiling that does not care how good the pump is:          *
 *                                                                       *
 *      zc_max + zd  =  (p_atm - p_vap) / (rho g)                          *
 *                                                                       *
 *  = 10.11 m for water at 20 C, against the 10.35 m a perfect barometer   *
 *  would stand at.  The missing 24 cm is the vapour pressure.            */
function siphon(zc,zd,fl,pAtm){
  const pa=pAtm===undefined?P_ATM:pAtm;
  const V=Math.sqrt(2*G0*Math.max(zd,0));
  const pCrest=pa-fl.rho*G0*(zc+velHead(V));
  const barometric=pa/(fl.rho*G0);
  const zcMax=(pa-fl.pv)/(fl.rho*G0)-zd;
  return {V,pCrest,barometric,zcMax,ok:pCrest>fl.pv,
          Q:null, margin:pCrest-fl.pv};
}
/* ================================================================== *
 *  DRAWING.  Everything below takes (ctx, W, H, st) and touches no     *
 *  globals that need a document, so the whole display list can be      *
 *  captured headlessly and rasterised for a visual check.              *
 * ================================================================== */

/* A world->screen frame.  `equal` forces ONE scale on both axes and
   widens whichever world span has slack, because three of the four views draw
   a SHAPE (a duct, a probe nose, a jet) and fitting x and y independently does
   not distort such a picture, it draws a different one.  When even equal
   aspect cannot fit, the frame records `cropped` and the view says so on the
   canvas rather than quietly squashing. */
function makeFrame(x0,y0,w,h,wx0,wx1,wy0,wy1,equal){
  let cropped=false;
  if(equal){
    const sx=w/(wx1-wx0), sy=h/(wy1-wy0), s=Math.min(sx,sy);
    if(!(s>0)) cropped=true;
    const cx=(wx0+wx1)/2, cy=(wy0+wy1)/2;
    const hw=w/(2*s), hh=h/(2*s);
    wx0=cx-hw; wx1=cx+hw; wy0=cy-hh; wy1=cy+hh;
  }
  const F={x0,y0,w,h,wx0,wx1,wy0,wy1,cropped,equal:!!equal};
  F.sx=x=> x0 + (x-wx0)/(wx1-wx0)*w;
  F.sy=y=> y0+h - (y-wy0)/(wy1-wy0)*h;
  F.ix=px=> wx0 + (px-x0)/w*(wx1-wx0);
  F.iy=py=> wy0 + (y0+h-py)/h*(wy1-wy0);
  F.k =(dx)=> dx/(wx1-wx0)*w;              // world length -> px, x
  F.ky=(dy)=> dy/(wy1-wy0)*h;              // world length -> px, y
  return F;
}
/* Clip to the frame.  Plot data routinely runs past the axes (an isotherm
   below the pressure floor drew straight through the tick labels in
   steam_carnot_cycle), so nothing is drawn into a frame without this. */
function withClip(ctx,F,fn){
  ctx.save(); ctx.beginPath(); ctx.rect(F.x0,F.y0,F.w,F.h); ctx.clip();
  try{ fn(); } finally{ ctx.restore(); }

function niceTicks(lo,hi,target){
  target=target||6;
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  const step=(n<1.5?1:n<3?2:n<7?5:10)*mag;
  const out=[]; let v=Math.ceil(lo/step-1e-9)*step;
  for(;v<=hi+1e-9*span;v+=step) out.push(Math.abs(v)<1e-12*step?0:v);
  return out;
}
function tickText(v,step){
  const d=Math.max(0,Math.min(6,-Math.floor(Math.log10(Math.abs(step||1)))+ (Math.abs(step)<1?0:0)));
  return Math.abs(v)<1e-12?'0':v.toFixed(d);
}

function poly(ctx,F,pts,style,width,dash){

  for(let i=1;i<pts.length;i++) ctx.lineTo(F.sx(pts[i][0]),F.sy(pts[i][1]));
  ctx.stroke(); ctx.restore();
}
function fillPoly(ctx,F,pts,style){
  if(pts.length<3) return;

  ctx.moveTo(F.sx(pts[0][0]),F.sy(pts[0][1]));
  for(let i=1;i<pts.length;i++) ctx.lineTo(F.sx(pts[i][0]),F.sy(pts[i][1]));

function txt(ctx,x,y,s,o){

              ctx.strokeText(s,x,y); }

/* Canvas has no text wrapping and fillText does not honour "\n" — a long
   caption drawn in one call simply runs off the picture.  That is not a
   hypothetical: auditing the display list for text boxes that leave the canvas
   found exactly two of them in this file, in the probe view and the tank view,
   and neither was visible in the sizes being eyeballed at the time.  Returns
   the line count so callers can reserve the space. */
function wrapLines(ctx,s,maxW,font){
  ctx.save(); ctx.font=font||'11px -apple-system, sans-serif';
  const lines=[];
  for(const para of String(s).split('\n')){
    let cur='';
    for(const w of para.split(/\s+/)){
      const t=cur?cur+' '+w:w;
      if(cur && ctx.measureText(t).width>maxW){ lines.push(cur); cur=w; } else cur=t;
    }
    lines.push(cur);
  }
  ctx.restore();

}
/* `o.up` makes y the BOTTOM line rather than the top, so a caption anchored to
   the bottom of a panel can wrap upwards into space it actually has instead of
   growing downwards out of the frame. */
function txtWrap(ctx,x,y,s,maxW,lh,o){
  o=o||{}; lh=lh||13;
  const lines=wrapLines(ctx,s,maxW,o.font);
  const y0=o.up? y-(lines.length-1)*lh : y;
  lines.forEach((ln,i)=>txt(ctx,x,y0+i*lh,ln,o));

function arrow(ctx,x1,y1,x2,y2,col,wid,head){
  const a=Math.atan2(y2-y1,x2-x1), hl=head||7;
  ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=wid||1.5;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hl*Math.cos(a-0.38),y2-hl*Math.sin(a-0.38));
  ctx.lineTo(x2-hl*Math.cos(a+0.38),y2-hl*Math.sin(a+0.38));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function hatchBelow(ctx,x0,x1,y,col,n){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  const step=(x1-x0)/(n||40);
  ctx.beginPath();
  for(let x=x0;x<x1;x+=step){ ctx.moveTo(x,y); ctx.lineTo(x-6,y+7); }
  ctx.stroke(); ctx.restore();

/* ------------------------------------------------------------------ *
 *  streakline spacing.  A particle's position solves dx/dt = V(x), so   *
 *  the travel time tau(x) = INT dx/V is the natural coordinate: release  *
 *  particles at equal intervals of tau and they arrive at equal          *
 *  intervals of tau, which means their SPACING on the picture is         *
 *  proportional to the local speed.  That is Bernoulli's principle drawn  *
 *  without a single label: the dots pull apart in the throat exactly as   *
 *  the pressure head collapses.  Deterministic in t, so the headless      *
 *  capture reproduces any frame exactly.                                  *
 * ------------------------------------------------------------------ */
function streakX(S,t,count){
  const N=S.D.N, tau=new Float64Array(N);
  for(let i=1;i<N;i++){
    const v0=Math.max(S.V[i-1],1e-9), v1=Math.max(S.V[i],1e-9);
    tau[i]=tau[i-1]+(S.D.xs[i]-S.D.xs[i-1])*0.5*(1/v0+1/v1);
  }
  const T=tau[N-1]; if(!(T>0)) return [];
  const n=count||26, dt=T/n, out=[];
  for(let k=0;k<n;k++){
    const target=((t%dt)+dt)%dt + k*dt;
    if(target>T) continue;
    let lo=0,hi=N-1;
    while(hi-lo>1){ const m=(lo+hi)>>1; if(tau[m]<=target) lo=m; else hi=m; }
    const f=(target-tau[lo])/((tau[hi]-tau[lo])||1);
    out.push({x:lerp(S.D.xs[lo],S.D.xs[hi],f), i:lo,
              V:lerp(S.V[lo],S.V[hi],f), z:lerp(S.D.zs[lo],S.D.zs[hi],f),
              D:lerp(S.D.Ds[lo],S.D.Ds[hi],f)});
  }
  return out;
}

/* ================================================================== *
 *  VIEW 1 — HEADS.  The picture the whole file is for.                *
 * ================================================================== */
function ductParams(hd){
  const L=hd.L, xt=hd.xtf*L, xn=0.86*L;
  return {L, D1:hd.D1, Dt:Math.min(hd.Dt,hd.D1), D3:hd.D1, De:Math.min(hd.De,hd.D1),
          xt, xn, Lc:0.22*L, Le:Math.max(0.06*L,Math.min(0.34*L,xn-xt-0.02*L)),
          sudden:hd.sudden,
          zin:hd.zin, zout:hd.zout, hump:hd.hump, xh:0.62*L, wh:0.13*L,
          zres:hd.zres};
}
/* The worked cases, in a table rather than inline in the panel, so that
   selfTest can sweep every one of them and assert that none produces a NaN, an
   unbounded head or a flow the energy equation does not close on.  A preset
   that only ever runs when a human clicks it is a preset nobody tests. */
/* Elevations sit CLOSE TO THE DATUM on purpose.  Everything in this view is a
   height above z = 0, so the datum has to be on the canvas — and if the pipe
   floats three metres above it, three metres of picture are spent on nothing.
   Only the differences matter to the physics (zres - zout sets the flow,
   zres - z sets the pressure head), so the whole arrangement is dropped until
   the datum is just below the pipe.  The first draft ran the pipe at z = 2.6
   with the reservoir at 4.6 and gave away 45% of the vertical to empty water. */
const HEAD_CASES=[
  ['venturi',   {L:6, D1:0.30,Dt:0.16, De:0.15,xtf:0.42,zres:3.2,zin:1.2,zout:0.8,
                 hump:0,  sudden:false,friction:true, rough:'steel',   station:0.14}],
  /* Dt tuned so the red band appears at the throat alone rather than
     swallowing the picture.  Two things learned while tuning it, both real
     physics rather than fiddling:
       - the throat pressure is violently sensitive here — about 2 kPa per
         0.1 mm of throat diameter — so "just cavitating" is a knife edge and
         the preset deliberately sits 5 kPa past it;
       - a ROUGHER pipe cavitates LESS.  Roughness throttles the discharge, the
         throat velocity falls with it, and at eps = 0.15 mm this same geometry
         does not cavitate at all.  So the roughness is not a cosmetic input,
         and the selfTest assertion that this case cavitates legitimately
         depends on it. */
  ['cavitates', {L:6, D1:0.30,Dt:0.078,De:0.15,xtf:0.42,zres:3.2,zin:1.2,zout:0.8,
                 hump:0,  sudden:false,friction:true, rough:'steel',   station:0.42}],
  ['open the end',{L:6,D1:0.30,Dt:0.22,De:0.30,xtf:0.42,zres:3.2,zin:1.2,zout:0.8,
                 hump:0,  sudden:false,friction:true, rough:'steel',   station:0.14}],
  ['friction eats it',{L:15,D1:0.07,Dt:0.07,De:0.07,xtf:0.42,zres:4.0,zin:1.0,zout:0.0,
                 hump:0,  sudden:false,friction:true, rough:'concrete',station:0.50}],
  ['over a hump',{L:9,D1:0.20,Dt:0.20, De:0.115,xtf:0.42,zres:4.2,zin:1.2,zout:1.0,
                 hump:3.4,sudden:false,friction:true, rough:'steel',   station:0.62}],
  ['no losses', {friction:false,sudden:false}],
  ['sudden step',{L:6,D1:0.30,Dt:0.14, De:0.15,xtf:0.42,zres:3.2,zin:1.2,zout:0.8,
                 hump:0,  sudden:true, friction:true, rough:'steel',   station:0.55}],
];
function ductState(hd){
  const fl=FLUIDS[hd.fluid];
  const opt={friction:hd.friction, Kent:ENTRANCE[hd.ent].K, eps:ROUGHNESS[hd.rough].eps/1000};
  return solveDuct(ductParams(hd),fl,opt);
}
function drawHeads(ctx,W,H,st){
  const hd=st.hd, S=st.cache.duct, fl=FLUIDS[hd.fluid], P=S.P;
  const L=P.L;
  /* world extent: room on the left for the reservoir, on the right for the jet */
  const resW=Math.max(1.1,0.22*L);
  let ylo=Infinity, yhi=-Infinity, zPipeMin=Infinity;
  for(let i=0;i<S.D.N;i++){
    ylo=Math.min(ylo,S.D.zs[i]-S.D.Ds[i]/2, S.HGL[i]);
    yhi=Math.max(yhi,S.D.zs[i]+S.D.Ds[i]/2, S.EGL[i]);
    zPipeMin=Math.min(zPipeMin,S.D.zs[i]-S.D.Ds[i]/2);
  }
  ylo=Math.min(ylo,0)-0.35; yhi=Math.max(yhi,P.zres)+0.55;
  /* Cap how far below the pipe the frame will chase a collapsing HGL.  Squeeze
     the throat hard enough and p/rho g goes to −30 m and past it; following
     that shrinks the pipe to a hairline in order to display a region where the
     constant-density model is not true anyway.  When the cap bites the HGL
     runs off the bottom and the canvas SAYS so — a silently rescaled axis is
     how a picture starts lying about what it left out. */

     across it; the tick labels live outside the frame and are not covered. */

                  ylabel:'height above datum  (m)  =  head  (m of '+fl0.name+')',
                  ypad:40, grid:'#101620'});
  { const y0=F.sy(0);
    if(y0>F.y0&&y0<F.y0+F.h){
      hatchBelow(ctx,F.x0,F.x0+F.w,y0,'#39404f',Math.round(F.w/18));
      txt(ctx,F.x0+4,y0+18,'datum  z = 0',
          {col:'#6f7789',font:'10.5px -apple-system, sans-serif'}); } }

  /* ---- datum + reservoir ------------------------------------------- */
  withClip(ctx,F,()=>{
    /* reservoir body */
    const rx0=F.sx(-resW), rx1=F.sx(0), rtop=F.sy(P.zres), rbot=F.sy(F.wy0);
    ctx.fillStyle=rgba(fl.col,0.30); ctx.fillRect(rx0,rtop,rx1-rx0,rbot-rtop);
    ctx.strokeStyle=rgba(fl.col,0.85); ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(rx0,rtop); ctx.lineTo(rx1,rtop); ctx.stroke();
    ctx.strokeStyle='#39404f'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(rx0,rtop-30); ctx.lineTo(rx0,rbot); ctx.lineTo(rx1,rbot); ctx.stroke();
    /* free-surface triangle */
    ctx.fillStyle='#cfd4de'; ctx.beginPath();
    const tx=rx0+(rx1-rx0)*0.5;
    ctx.moveTo(tx-6,rtop-11); ctx.lineTo(tx+6,rtop-11); ctx.lineTo(tx,rtop-2); ctx.closePath(); ctx.fill();
  });

  /* ---- the duct itself --------------------------------------------- */
  withClip(ctx,F,()=>{
    const top=[],bot=[];
    for(let i=0;i<S.D.N;i++){
      top.push([S.D.xs[i],S.D.zs[i]+S.D.Ds[i]/2]);
      bot.push([S.D.xs[i],S.D.zs[i]-S.D.Ds[i]/2]);
    }
    fillPoly(ctx,F,top.concat(bot.slice().reverse()),rgba(fl.col,0.42));
    poly(ctx,F,top,'#59606e',1.6); poly(ctx,F,bot,'#59606e',1.6);
    /* centreline */
    const cl=[]; for(let i=0;i<S.D.N;i+=6) cl.push([S.D.xs[i],S.D.zs[i]]);
    poly(ctx,F,cl,'rgba(255,255,255,.13)',1,[4,5]);

    /* particles — spacing IS the speed */
    if(S.Q>0){
      for(const p of streakX(S,st.t*1.0,30)){
        const px=F.sx(p.x), py=F.sy(p.z);
        const r=clamp(F.ky(p.D)*0.13,1.3,3.4);
        ctx.fillStyle='rgba(255,255,255,.62)';

    }

      for(let k=0;k<=24;k++){ const t=k/24*Math.sqrt(2*fall/G0);
        pts.push([L+Ve*t, ze-G0*t*t/2]); }
      poly(ctx,F,pts,rgba(fl.col,0.9),Math.max(1.5,F.ky(S.D.Ds[S.D.N-1])*0.5));
    }
  });

  /* ---- cavitation band, drawn UNDER the grade lines ------------------ */
  if(S.cavIdx>=0){
    withClip(ctx,F,()=>{
      let i0=-1;

        const bad=S.pa[i]<=fl.pv;
        if(bad&&i0<0) i0=i;
