/* ================================================================== *
 *  the field: IGRF-14 on a map                                        *
 * ================================================================== */
const WHAT_RANGE={F:[20000,68000],H:[0,42000],Z:[-68000,68000],D:[-45,45],I:[-90,90],Br:[-9e5,9e5]};
const WHAT_NAME={F:'total intensity F',H:'horizontal intensity H',Z:'downward field Z',D:'declination D',I:'inclination I',Br:'radial field at the core'};
/* one convention for every signed map: orange where the field points up and out (of the Earth, or of the core), cyan
   where it points down and in.  B_r is positive outward, Z and I downward; D (no up or down) orange east, cyan west */
function fieldColour(what,v){
  const R=WHAT_RANGE[what];
  if(what==='F'||what==='H') return seqCol((v-R[0])/(R[1]-R[0]));
  return signCol(what==='Z'||what==='I'?-v/R[1]:v/R[1]);
}
const WHAT_SAYS={F:': strongest near the dip poles, weakest over the South Atlantic.',H:', the part a compass feels: it vanishes at the dip poles.',
  Z:': cyan where it points down into the Earth, orange where it points up; the white line, where it lies level, is the dip equator.',
  I:', the angle below level: cyan where the field dips down, orange where it points up; the white line is the dip equator.',
  D:', the angle from true north to the compass: orange east, cyan west; the white line, the agonic line, is where they agree.'};
/* a label beside a mark on the map, on whichever side keeps it inside the map (and so clear of the readout) */
function labBeside(ctx,W,H,X,Y,dy,txt,col,Fm){ const w=plain(txt).length*10.5*0.52;
  if(X+9+w<=Fm.x1) lab(ctx,W,H,X+9,Y+dy,txt,col,SM_FONT,'left','middle',PLATE);
  else lab(ctx,W,H,X-9,Y+dy,txt,col,SM_FONT,'right','middle',PLATE); }
function fieldCaption(M){
  const F=M.F;
  return {full:(F.cmb?'IGRF-14’s field continued down through the mantle (which carries no currents) to the core, 3480 km from the centre: orange where it points out of the core, cyan where it points in; the patches are where the dynamo’s field leaves and enters, and the southern cyan patches are reversed flux.':
    'IGRF-14’s '+WHAT_NAME[F.what]+' at the surface'+WHAT_SAYS[F.what])+' The magenta dots are the dip poles for '+fmt(F.year,0)+', the green line their track from 1900 (computed here), the orange dots NOAA’s modelled track back to 1590; '+
    'the cyan ring is the north geomagnetic pole (the dipole’s). '+(F.cmb?'':'The orange ring marks the weakest field, the South Atlantic Anomaly. ')+'Press the map to read the field there.',
    short:'IGRF-14 for '+fmt(F.year,0)+'; the dip poles and their tracks. Press to read the field.'};
}
function drawField(ctx,W,H,M){
  const F=M.F, cap=fieldCaption(M), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.28,nbNarrow(H));
  const Fm=mapFrame(mapBox(Lay,34),ST.fLon0);
  HIT.push({kind:'fmap',b:box(Fm.x,Fm.y,Fm.w,Fm.h),F:Fm});
  lab(ctx,W,H,Fm.x,Fm.y-8,'the '+WHAT_NAME[F.cmb?'Br':F.what]+', '+fmt(F.year,1),'#aeb6c6','italic 13px Georgia, serif','left','bottom');
  /* the cells: the 2-degree grid drawn at 1 degree, each value interpolated between the four cell centres around it
     (longitude wraps; the polar rows hold their row), in 64 levels of colour so the fills batch */
  const G=F.grid, S2=2, NL=G.nlat*S2, NM=G.nlon*S2, cw=Fm.w/NM, chh=Fm.h/NL, groups=new Map(), R=WHAT_RANGE[F.what];
  const seq=F.what==='F'||F.what==='H', lev=v=>{ const f=seq?(v-R[0])/(R[1]-R[0]):(v/R[1]+1)/2; return clamp(Math.round(clamp(f,0,1)*63),0,63); };
  for(let i=0;i<NL;i++){ const y=(i+0.5)/S2-0.5, i0=clamp(Math.floor(y),0,G.nlat-1), i1=clamp(i0+1,0,G.nlat-1), fy=clamp(y-Math.floor(y),0,1);
    for(let j=0;j<NM;j++){ const x=(j+0.5)/S2-0.5, jf=Math.floor(x), fx=x-jf, j0=(jf+G.nlon)%G.nlon, j1=(j0+1)%G.nlon;
      const v=(1-fy)*((1-fx)*G.v[i0*G.nlon+j0]+fx*G.v[i0*G.nlon+j1])+fy*((1-fx)*G.v[i1*G.nlon+j0]+fx*G.v[i1*G.nlon+j1]);
      const L=lev(v); let g=groups.get(L); if(!g){ g=[]; groups.set(L,g); } g.push(i,j); } }
  for(const [L,g] of groups){ ctx.beginPath();
    for(let q=0;q<g.length;q+=2){ const i=g[q], j=g[q+1], X=Fm.X(-180+j*360/NM), Y=Fm.Y(90-i*180/NL);
      const w=Math.min(cw+0.4,Fm.x1-X); ctx.rect(X,Y,w,chh+0.4); if(w<cw) ctx.rect(Fm.x,Y,cw+0.4-w,chh+0.4); }
    const f=L/63; ctx.fillStyle=fieldColour(F.what,seq?R[0]+f*(R[1]-R[0]):(2*f-1)*R[1]); ctx.fill(); }
  /* contours: zero lines for the signed elements (the dip equator for I and Z, the agonic line for D) */
  if(F.what!=='F'&&F.what!=='H'){ const segs=marchZero(G);
    ctx.beginPath(); for(const s of segs){ const X0=Fm.X(s[0]), Y0=Fm.Y(s[1]), X1=Fm.X(s[2]), Y1=Fm.Y(s[3]); if(Math.abs(X1-X0)>Fm.w/2) continue; ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1); }
    ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=1.2; ctx.stroke(); }
  mapCoast(ctx,Fm,F.cmb?'rgba(255,255,255,0.18)':'rgba(255,255,255,0.55)',0.7);
  /* the tracks and the poles */
  if(ST.fNOAA){ ctx.fillStyle='rgba(232,132,58,0.75)'; ctx.beginPath();
    for(const L of [NOAA_NP,NOAA_SP]) for(const [y,la,lo] of L){ if(y%5) continue; const X=Fm.X(((lo+180)%360+360)%360-180), Y=Fm.Y(la); ctx.moveTo(X+1.5,Y); ctx.arc(X,Y,1.5,0,TAU); }
    ctx.fill(); }
  if(ST.fPoles){ const tr=F.track.filter(q=>q.t<=F.year+1e-9);
    mapPath(ctx,Fm,tr.map(q=>[q.n[1],q.n[0]]),COL.igrf,1.6); mapPath(ctx,Fm,tr.map(q=>[q.s[1],q.s[0]]),COL.igrf,1.6);
    dot(ctx,Fm.X(F.poles.north[1]),Fm.Y(F.poles.north[0]),4.5,COL.live,'#fff',1.2); dot(ctx,Fm.X(F.poles.south[1]),Fm.Y(F.poles.south[0]),4.5,COL.live,'#fff',1.2);
    labBeside(ctx,W,H,Fm.X(F.poles.north[1]),Fm.Y(F.poles.north[0]),10,'north dip pole',COL.live,Fm);
    const d=F.poles.dip; ctx.beginPath(); ctx.arc(Fm.X(d.lon),Fm.Y(d.lat),5,0,TAU); ctx.strokeStyle=COL.geo; ctx.lineWidth=1.6; ctx.stroke();
    if(!F.cmb){ ctx.beginPath(); ctx.arc(Fm.X(F.saa.lon),Fm.Y(F.saa.lat),6,0,TAU); ctx.strokeStyle=COL.ref; ctx.lineWidth=1.8; ctx.stroke();
      labBeside(ctx,W,H,Fm.X(F.saa.lon),Fm.Y(F.saa.lat),8,'South Atlantic Anomaly',COL.ref,Fm); } }
  /* the probe */
  const X=Fm.X(ST.fLon), Y=Fm.Y(ST.fLat); ctx.strokeStyle=COL.live; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(X-6,Y); ctx.lineTo(X+6,Y); ctx.moveTo(X,Y-6); ctx.lineTo(X,Y+6); ctx.stroke();
  frame(ctx,box(Fm.x,Fm.y,Fm.w,Fm.h),'#2a3044');
  fieldKey(ctx,W,H,Fm,F.what);
  if(Lay.bottom.length){ plotDipole(ctx,W,H,Lay.bottom[0],F); if(Lay.bottom[1]) plotSpectrum(ctx,W,H,Lay.bottom[1],F); }
  drawCaption(ctx,Lay);
}
/* the zero contour of a grid (marching squares on the cell centres), as lon/lat segments */
function marchZero(G){
  const out=[], la=i=>90-(i+0.5)*180/G.nlat, lo=j=>-180+(j+0.5)*360/G.nlon;
  for(let i=0;i+1<G.nlat;i++) for(let j=0;j+1<G.nlon;j++){
    const a=G.v[i*G.nlon+j], b=G.v[i*G.nlon+j+1], c=G.v[(i+1)*G.nlon+j+1], d=G.v[(i+1)*G.nlon+j];
    const pts=[]; const edge=(v0,v1,p0,p1)=>{ if((v0<0)!==(v1<0)){ const f=v0/(v0-v1); pts.push([p0[0]+(p1[0]-p0[0])*f,p0[1]+(p1[1]-p0[1])*f]); } };
    const P00=[lo(j),la(i)], P01=[lo(j+1),la(i)], P11=[lo(j+1),la(i+1)], P10=[lo(j),la(i+1)];
    edge(a,b,P00,P01); edge(b,c,P01,P11); edge(c,d,P11,P10); edge(d,a,P10,P00);
    if(pts.length===2) out.push([pts[0][0],pts[0][1],pts[1][0],pts[1][1]]);
    else if(pts.length===4){ out.push([pts[0][0],pts[0][1],pts[1][0],pts[1][1]]); out.push([pts[2][0],pts[2][1],pts[3][0],pts[3][1]]); } }
  return out;
}
function fieldKey(ctx,W,H,Fm,what){
  const R=WHAT_RANGE[what], x=Fm.x, y=Fm.y1+8, w=Math.min(220,Fm.w*0.4), n=40;
  for(let k=0;k<n;k++){ const v=R[0]+(R[1]-R[0])*(k+0.5)/n; ctx.fillStyle=fieldColour(what,v); ctx.fillRect(x+w*k/n,y,w/n+0.5,8); }
  const f=v=>what==='D'||what==='I'?fmt(v,0)+'°':what==='Br'?fmt(v/1e6,1)+' mT':fmt(v/1000,0)+' µT';
  lab(ctx,W,H,x,y+11,f(R[0]),'#8b93a6','10px -apple-system, sans-serif','left','top');
  lab(ctx,W,H,x+w,y+11,f(R[1]),'#8b93a6','10px -apple-system, sans-serif','right','top');
}
function plotDipole(ctx,W,H,b,F){
  const tr=F.track, xs=tr.map(q=>q.t), ys=tr.map(q=>q.dip.M/1e22);
  axesT(ctx,b,1900,2030,7.4,8.5,{title:titleFor(b,'the dipole moment, 10²² A m² (IGRF-14; after 2025 its forecast)','the dipole moment, 10²² A m²'),ny:3,nx:5,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1)});
  HIT.push({kind:'fyear',b});
  polyline(ctx,b,xs,ys,1900,2030,7.4,8.5,COL.pos,1.8);
  marker(ctx,b,1900,2030,7.4,8.5,F.year,F.poles.dip.M/1e22,COL.live);
}
/* the Lowes-Mauersberger spectrum: 10^2 holds the surface's degree 13 (1.3e2 nT^2 in 2025), 10^11 the core's dipole
   (7.8e10 in 1900).  Before 2000 IGRF stops at degree 10: its higher degrees are zero and are not drawn */
function plotSpectrum(ctx,W,H,b,F){
  const lo=1e2, hi=1e11;
  logYAxes(ctx,b,1,13,lo,hi,{title:titleFor(b,'the power in each degree n at the surface (green) and at the core (orange), nT²','the power in each degree, nT²')});
  const ly=v=>b.y1-b.h*(Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo));
  let nTop=0;
  for(const [sp,col] of [[F.specS,COL.pos],[F.specC,COL.ref]]){ const xs=[], ys=[];
    sp.forEach((v,k)=>{ if(v>0){ xs.push(k+1); ys.push(Math.log10(v)); nTop=Math.max(nTop,k+1); } });
    polyline(ctx,b,xs,ys,1,13,Math.log10(lo),Math.log10(hi),col,1.6);
    for(let k=0;k<sp.length;k++){ if(!(sp[k]>0)) continue; const X=b.x+b.w*k/12, Y=ly(sp[k]); if(Y>=b.y&&Y<=b.y1) dot(ctx,X,Y,2.2,col); } }
  if(nTop<13) lab(ctx,W,H,b.x1-4,b.y1-8,'IGRF stops at n = '+nTop+' before 2000','#8b93a6',SM_FONT,'right','bottom');
}
/* a plot with a log y axis (decades) and an integer x axis */
function logYAxes(ctx,b,x0,x1,y0,y1,opt){
  const yt=logTicks(y0,y1);
  axesT(ctx,b,x0,x1,Math.log10(y0),Math.log10(y1),{title:opt.title,xticks:[1,4,7,10,13],yticks:yt.map(Math.log10),
    xfmt:v=>'n = '+fmt(v,0),yfmt:v=>'10'+String(Math.round(v)).split('').map(c=>c==='-'?'⁻':'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('')});
}

/* ================================================================== *
 *  the waves: rays through PREM                                       *
 * ================================================================== */
/* narrow: the stage has no room for the travel-time plot, and the caption does not name it */
function wavesCaption(M,narrow){
  const W=M.W, sh=W.shadow;
  return {full:'Rays through PREM from a quake '+fmt(ST.wDepth,0)+' km deep at the top, and the wavefronts '+fmt(ST.wT,0)+' s after it. P (compression) and S (shear) run through the mantle; '+
    'at the core S cannot pass (the outer core is liquid: it goes on only as P, and comes back as SKS), and P bends inward as it enters the slower core. Direct P therefore stops at '+fmt(sh.P,1)+
    '° and PKP returns only past '+fmt(sh.B,1)+'°: the shadow Oldham (1906) and Gutenberg (1913) read as a core. Inside it arrives PKIKP, from '+fmt(sh.C,1)+'°: the ray that crosses the solid inner core, which is how Lehmann (1936) found it. '+
    (narrow?'':'Right: the travel times (dots: ObsPy’s TauP on the same PREM).'),
    short:'Rays through PREM: S cannot cross the liquid core; the P shadow and PKIKP through the inner core.'};
}
function drawWaves(ctx,W,H,M){
  const Wm=M.W, cap=wavesCaption(M,isNarrow(W)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,0,0,0);
  const b=Lay.main, narrow=Lay.narrow;
  const dW=narrow?Math.min(b.h,b.w-86):Math.min(b.h,b.w*0.52), Rd=dW/2-6, cx=b.x+dW/2, cy=b.y+b.h/2;
  /* the disk: the mantle, the outer and the inner core, to scale */
  dot(ctx,cx,cy,Rd,'#2c1f24'); dot(ctx,cx,cy,Rd*R_CMB/R_E,'#3d2616'); dot(ctx,cx,cy,Rd*R_ICB/R_E,'#4d3f1c');
  ctx.beginPath(); ctx.arc(cx,cy,Rd,0,TAU); ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1; ctx.stroke();
  const XY=(r,th,s)=>[cx+s*(r/R_E)*Rd*Math.sin(th),cy-(r/R_E)*Rd*Math.cos(th)];
  /* the shadows on the surface, both sides */
  const sh=Wm.shadow, arc=(a0,a1,col,lw)=>{ for(const s of [1,-1]){ ctx.beginPath();
      for(let k=0;k<=40;k++){ const a=(a0+(a1-a0)*k/40)*PI/180, p=XY(R_E*1.02,a,s); if(k) ctx.lineTo(p[0],p[1]); else ctx.moveTo(p[0],p[1]); }
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); } };
  arc(sh.P,sh.B,'rgba(232,132,58,0.9)',5);
  arc(sh.S,180,'rgba(255,111,145,0.55)',3);
  HIT.push({kind:'wdisk',b:box(cx-Rd-8,cy-Rd-8,2*Rd+16,2*Rd+16),cx,cy,Rd});
  /* the rays (faint: every third of P's and S's, every other of the rest) and the wavefronts at time t (all of them) */
  for(const ph of Wm.on){ const rays=Wm.paths[ph]||[], every=ph==='P'||ph==='S'?3:2;
    if(ST.wRays){ ctx.beginPath();
      for(let i=0;i<rays.length;i+=every){ const ray=rays[i]; for(const s of [1,-1]){ let first=true; for(const q of ray.path){ const p=XY(q.r,q.th,s); if(first){ ctx.moveTo(p[0],p[1]); first=false; } else ctx.lineTo(p[0],p[1]); } } }
      ctx.strokeStyle=rgba(COL[ph],0.28); ctx.lineWidth=0.8; ctx.stroke(); }
    if(ST.wFronts){ const pts=rays.map(ray=>{ const P=ray.path, t=Wm.t; if(t<=0||t>P[P.length-1].t) return null;
        let k=1; while(k<P.length&&P[k].t<t) k++; const a=P[k-1], c=P[k], f=(t-a.t)/((c.t-a.t)||1);
        return {r:a.r+(c.r-a.r)*f, th:a.th+(c.th-a.th)*f, key:ray.key}; });
      for(const s of [1,-1]){ ctx.beginPath(); let prev=null;
        for(const q of pts){ if(!q){ prev=null; continue; } const p=XY(q.r,q.th,s);
          if(prev&&prev.key===q.key&&Math.hypot(p[0]-prev.x,p[1]-prev.y)<Rd*0.25){ ctx.lineTo(p[0],p[1]); } else ctx.moveTo(p[0],p[1]);
          prev={x:p[0],y:p[1],key:q.key}; }
        ctx.strokeStyle=COL[ph]; ctx.lineWidth=2.4; ctx.stroke(); } } }
  /* the quake and the station */
  const src=XY(R_E-ST.wDepth,0,1); star(ctx,src[0],src[1],7,'#fff');
  const st=XY(R_E*1.04,ST.wDist*PI/180,1); ctx.beginPath(); ctx.moveTo(st[0],st[1]-6); ctx.lineTo(st[0]+5,st[1]+4); ctx.lineTo(st[0]-5,st[1]+4); ctx.closePath(); ctx.fillStyle=COL.live; ctx.fill();
  lab(ctx,W,H,cx,cy,'inner core','#f0e6c0','10.5px -apple-system, sans-serif','center','middle',PLATE);
  lab(ctx,W,H,cx,cy+Rd*(R_ICB+R_CMB)/2/R_E,'outer core, liquid','#f0d0b0','10.5px -apple-system, sans-serif','center','middle',PLATE);
  const sp=XY(R_E*1.1,(sh.P+sh.B)/2*PI/180,1); lab(ctx,W,H,sp[0]+4,sp[1],'P shadow','#e8843a','10.5px -apple-system, sans-serif','left','middle',PLATE);
  /* the travel times */
  if(!narrow){ const tb=box(b.x+dW+64,b.y+6,b.x1-(b.x+dW+64),b.h-40);
    const tmax=1800;                      /* 30 minutes: SKS reaches 180 degrees in about 26 */
    axesT(ctx,tb,0,180,0,tmax/60,{title:titleFor(tb,'travel times, minutes (lines: here; dots: TauP)','travel times'),xlab:'distance, degrees',ylab:'minutes',nx:6,ny:5,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)});
    HIT.push({kind:'wtt',b:tb,tmax});
    for(const ph of Wm.on){ const S=Wm.samp[ph]; let xs=[], ys=[], key=null;
      const flush=()=>{ if(xs.length>1) polyline(ctx,tb,xs,ys,0,180,0,tmax/60,COL[ph],1.6); xs=[]; ys=[]; };
      for(const q of S){ if(q.key!==key){ flush(); key=q.key; } if(q.D<=180){ xs.push(q.D); ys.push(q.T/60); } }
      flush(); }
    const dz=[0,100,600].indexOf(ST.wDepth);
    if(dz>=0){ ctx.fillStyle='rgba(240,244,250,0.9)'; ctx.beginPath();
      for(const [d,dist,pi,t] of TAUP_TIMES){ if(d!==ST.wDepth||!ST['w'+TAUP_PHASES[pi]]||t>tmax) continue; const X=tb.x+tb.w*dist/180, Y=tb.y1-tb.h*t/tmax; ctx.moveTo(X+1.8,Y); ctx.arc(X,Y,1.8,0,TAU); }
      ctx.fill(); }
    const Yt=tb.y1-tb.h*Wm.t/tmax, Xd=tb.x+tb.w*ST.wDist/180;
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.setLineDash([4,3]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(tb.x,Yt); ctx.lineTo(tb.x1,Yt); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=COL.live; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(Xd,tb.y); ctx.lineTo(Xd,tb.y1); ctx.stroke(); MARKS.push({X:Xd,y0:tb.y,y1:tb.y1,seq:++DRAW_SEQ});
    legendR(ctx,tb,Wm.on.map(ph=>[COL[ph],ph])); }
  else phaseKeyCol(ctx,b.x+dW+14,b.y+10,Wm.on,b.y1);
  drawCaption(ctx,Lay);
}
/* the phases' colours in a column (the narrow layout, which has no travel-time plot to carry a legend) */
function phaseKeyCol(ctx,x,y,on,yMax){
  ctx.font='10.5px -apple-system, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  on.forEach((ph,i)=>{ const Y=y+i*15; if(Y>yMax){ KEY_DROPS++; return; }
    ctx.fillStyle=COL[ph]; ctx.fillRect(x,Y-1.5,12,3); ctx.fillStyle='#9aa2b4'; ctx.fillText(ph,x+16,Y);
    const bx=[x,Y-7,x+16+ph.length*6,Y+7]; bx.t=ph; bx.seq=++DRAW_SEQ; LABELS.push(bx); });
}

/* ================================================================== *
 *  the dispatch, the pointer, the scene                               *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='earth') drawEarth(ctx,W,H,M);
  else if(M.view==='plates') drawPlates(ctx,W,H,M);
  else if(M.view==='mantle') drawMantle(ctx,W,H,M);
  else if(M.view==='core') drawCore(ctx,W,H,M);
  else if(M.view==='field') drawField(ctx,W,H,M);
  else drawWaves(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  function setFrom(hit,x,y,down){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1), w=clamp((hit.b.y+hit.b.h-y)/hit.b.h,0,1);
    if(hit.kind==='pmap'){ if(!down) return false; const lon=hit.F.lonOf(x), lat=hit.F.latOf(y), k=plateAt(lon,lat); if(k<0) return false; ST.pSel=PB_ID[k]; return true; }
    if(hit.kind==='fmap'){ ST.fLon=((hit.F.lonOf(x)+180)%360+360)%360-180; ST.fLat=clamp(hit.F.latOf(y),-89.9,89.9); return true; }
    if(hit.kind==='fyear'){ ST.fYear=clamp(1900+130*u,LIM.year[0],LIM.year[1]); return true; }
    if(hit.kind==='cplot'){ ST.cDepth=clamp(hit.x0+(hit.x1-hit.x0)*u,0,R_E); return true; }
    if(hit.kind==='csec'){ ST.cDepth=clamp(R_E*(1-Math.hypot(x-hit.cx,y-hit.cy)/hit.Rd),0,R_E); return true; }
    if(hit.kind==='wtt'){ ST.wDist=clamp(180*u,0,180); ST.wT=clamp(hit.tmax*w,0,LIM.wT[1]); return true; }
    if(hit.kind==='wdisk'){ const a=Math.atan2(x-hit.cx,-(y-hit.cy)); ST.wDist=clamp(Math.abs(a)*180/PI,0,180); return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; }
      if(hit.kind==='cam'){ DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST.camTheta; DRAG.ph=ST.camPhi; return false; }
      if(hit.kind==='mfield'){ DRAG.what=null; return false; }
      DRAG.what=hit; return setFrom(hit,x,y,true); }
    if(type==='move'){ if(!DRAG.what) return false;
      if(DRAG.what==='cam'){ ST.camTheta=DRAG.th-(x-DRAG.x)*0.008; ST.camPhi=clamp(DRAG.ph+(y-DRAG.y)*0.006,-1.2,1.35); return true; }
      return setFrom(DRAG.what,x,y,false); }
    DRAG.what=null; return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
const MAJOR=['PA','NA','EU','AF','AN','AU','SA','NZ','IN','SO','AR','CO','PS','CA','JF','SU'].map(id=>({id,name:PB_PLATES[PB_INDEX[id]][1]}));
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    /* one key can have two sliders (the year, in the Earth's group and the field's): each is kept, and each synced */
    let rk=key; while(rows[rk]) rk+='+'; rows[rk]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  const logSlider=(key,lab,lo,hi,fmtf,onchg)=>slider(key,lab,0,LOGN,1,fmtf,onchg,logMap(lo,hi));
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')); }
  const yearRow=()=>slider('fYear','the year of the field',LIM.year[0],LIM.year[1],0.1,v=>fmt(v,1));

  /* ---- the Earth ---- */
  const gEarth=h('div',{class:'grp'},h('h3',null,'the Earth'));
  gEarth.appendChild(chipRow(CUT_LIST,'eCut'));
  gEarth.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'faces'),chipRow(FACE_LIST,'eFaces')));
  gEarth.appendChild(h('div',{class:'checks'},checkbox('ePlates','the plates on the surface'),checkbox('eLines','field lines (IGRF, degree 8)'),
    checkbox('eBr','the field on the core'),checkbox('eSpin','the Earth turns'),checkbox('eConv','the mantle model runs')));
  const eYear=yearRow(); gEarth.appendChild(eYear);
  gEarth.appendChild(h('div',{class:'btnrow'},h('button',{onclick:()=>{ st.camTheta=DEFAULTS.camTheta; st.camPhi=DEFAULTS.camPhi; dirty=true; refresh(); }},'turn it back')));
  const earthTag=h('div',{class:'tag'}); gEarth.appendChild(earthTag);

  /* ---- the plates ---- */
  const gPlates=h('div',{class:'grp'},h('h3',null,'the plates'));
  gPlates.appendChild(chipRow(FRAME_LIST,'pFrame'));
  gPlates.appendChild(chipRow(LON0_LIST,'pLon0'));
  gPlates.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'plate'),chipRow(MAJOR,'pSel')));
  gPlates.appendChild(h('div',{class:'checks'},checkbox('pArrows','the velocity arrows'),checkbox('pDrift','the plates drift'),checkbox('pOrog','the orogens')));
  const platesTag=h('div',{class:'tag'}); gPlates.appendChild(platesTag);

  /* ---- the mantle ---- */
  const gMantle=h('div',{class:'grp'},h('h3',null,'the mantle'));
  gMantle.appendChild(chipRow(GEOM_LIST,'mGeom',()=>convReset(st)));
  const benchRow=chipRow(BENCH_LIST,'mBench',()=>convReset(st)); gMantle.appendChild(benchRow);
  const raRow=logSlider('mRa','Rayleigh number',LIM.Ra[0],LIM.Ra[1],v=>sigf(v,3)); gMantle.appendChild(raRow);
  const heatRow=chipRow(HEAT_LIST,'mHeat',()=>convReset(st)); gMantle.appendChild(heatRow);
  const hRow=slider('mH','heat made within, H',LIM.H[0],LIM.H[1],0.5,v=>fmt(v,1)); gMantle.appendChild(hRow);
  gMantle.appendChild(h('div',{class:'qrow'},h('span',{class:'qlab'},'grid'),chipRow(RES_LIST,'mRes',()=>convReset(st))));
  gMantle.appendChild(slider('mSpeed','steps a frame',LIM.speed[0],LIM.speed[1],1,v=>fmt(v,0)));
  gMantle.appendChild(h('div',{class:'checks'},checkbox('mRun','the model runs'),checkbox('mArrows','the velocity')));
  gMantle.appendChild(h('div',{class:'btnrow'},h('button',{onclick:()=>{ convReset(st); dirty=true; refresh(); }},'a fresh start')));
  const mantleTag=h('div',{class:'tag'}); gMantle.appendChild(mantleTag);

  /* ---- the core ---- */
  const gCore=h('div',{class:'grp'},h('h3',null,'the core'));
  gCore.appendChild(slider('cDepth','depth, km',LIM.cDepth[0],LIM.cDepth[1],1,v=>fmt(v,0)));
  const coreTag=h('div',{class:'tag'}); gCore.appendChild(coreTag);

  /* ---- the field ---- */
  const gField=h('div',{class:'grp'},h('h3',null,'the field'));
  const fYear=yearRow(); gField.appendChild(fYear);
  gField.appendChild(chipRow(RAD_LIST,'fRad'));
  const whatRow=chipRow(WHAT_LIST,'fWhat'); gField.appendChild(whatRow);
  gField.appendChild(chipRow(LON0_LIST,'fLon0'));
  gField.appendChild(h('div',{class:'checks'},checkbox('fPlay','the years pass'),checkbox('fPoles','the poles and their tracks'),checkbox('fNOAA','NOAA’s track back to 1590')));
  const fieldTag=h('div',{class:'tag'}); gField.appendChild(fieldTag);

  /* ---- the waves ---- */
  const gWaves=h('div',{class:'grp'},h('h3',null,'the waves'));
  gWaves.appendChild(slider('wDepth','the quake’s depth, km',LIM.depth[0],LIM.depth[1],5,v=>fmt(v,0)));
  gWaves.appendChild(slider('wT','seconds after it',LIM.wT[0],LIM.wT[1],1,v=>fmt(v,0)));
  gWaves.appendChild(slider('wDist','the station, degrees',0,180,0.5,v=>fmt(v,1)));
  gWaves.appendChild(h('div',{class:'checks'},...SEIS_PH.map(ph=>checkbox('w'+ph,ph))));
  gWaves.appendChild(h('div',{class:'checks'},checkbox('wRays','the rays'),checkbox('wFronts','the wavefronts'),checkbox('wPlay','the waves travel')));
  const wavesTag=h('div',{class:'tag'}); gWaves.appendChild(wavesTag);

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset(); convReset(st);
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:SRC_LINE}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),h('div',{id:'phys'}));
  [gEarth,gPlates,gMantle,gCore,gField,gWaves,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncPanel(){
    const v=st.view;
    gEarth.hidden=v!=='earth'; gPlates.hidden=v!=='plates'; gMantle.hidden=v!=='mantle'; gCore.hidden=v!=='core'; gField.hidden=v!=='field'; gWaves.hidden=v!=='waves';
    /* the rows a state does not use are hidden, never left live and ignored */
    const box=st.mGeom==='box';
    benchRow.hidden=!box; raRow.hidden=box; heatRow.hidden=box; hRow.hidden=box||st.mHeat==='below';
    whatRow.hidden=st.fRad==='cmb';
    rows.cb_eBr.inp.disabled=st.eCut!=='core'; rows.cb_eConv.inp.disabled=st.eFaces!=='conv'||st.mGeom!=='ann';
    for(const k in rows) rows[k].sync();
    earthTag.innerHTML='drag the globe to turn it; the cut always faces you';
    platesTag.innerHTML='press a plate on the map to choose it';
    mantleTag.innerHTML=box?'Blankenbach et al. (1989): free slip all round, insulating sides, heated below':'the grid, the geometry and the heating start the model afresh';
    coreTag.innerHTML='press or drag any plot to probe a depth';
    fieldTag.innerHTML=st.fRad==='cmb'?'the field continued down to the core, 3480 km':'press the map to read the field there';
    wavesTag.innerHTML='press the travel-time plot to set the station and the time';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space starts or stops the motion';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='earth'?'drag to turn the Earth · space stops it · 1–6 switch views'
        :v==='plates'?'press a plate · space stops the drift · 1–6 switch views'
        :v==='mantle'?'space stops the model · 1–6 switch views'
        :v==='core'?'press or drag a plot to probe a depth · 1–6 switch views'
        :v==='field'?'press the map to read the field · space plays the years · 1–6 switch views':'press the travel-time plot · space stops the waves · 1–6 switch views';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ syncChips(); syncPanel(); dirty=true; refresh(); }
    if(DRAG.what) canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); S.pointer('up',0,0); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  const CLOCK={earth:'eSpin',plates:'pDrift',mantle:'mRun',field:'fPlay',waves:'wPlay'};
  window.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')) return;
    if(e.key===' '){ e.preventDefault(); const k=CLOCK[st.view]; if(k) st[k]=!st[k]; syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frames=0;
  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){ dirty=false;
      try{ S.draw(); if(advanced&&(++frames%6===0)){ syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); } }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* ---- the prose: every number in it is computed here and pinned in selfTest ---- */
const PX=(()=>{
  const sh=seisShadow(R_E), c1900=igrfCoeffs(1900), c2025=igrfCoeffs(2025);
  const d1900=igrfDipole(c1900), d2025=igrfDipole(c2025);
  const nr=netRotation(), pa=platePole(PB_INDEX.PA,'nnr');
  let paMax=0; for(const i of PB_PLATES[PB_INDEX.PA][4]){ const v=plateVel(PB_INDEX.PA,PB_V[2*i],PB_V[2*i+1],'nnr'); paMax=Math.max(paMax,Math.hypot(v[0],v[1])); }
  return {M:PREM_M, moi:PREM_MOI, core:premMass(R_CMB)/PREM_M, ic:premMass(R_ICB)/PREM_M, Pc:premP(0)/1e9, Picb:premP(R_ICB)/1e9, Pcmb:premP(R_CMB)/1e9,
    gcmb:premG(R_CMB), gsurf:premG(R_E), GMG:GM_IAU/G_NEWTON, sh, dM:1-d2025.M/d1900.M, M1900:d1900.M, M2025:d2025.M, dLat2025:d2025.lat,
    np2025:igrfDipPole(c2025,[85.8,138]), nr:v3.len(nr)*180/PI, pa, paMax, tUnit:T_UNIT_MYR, vUnit:V_UNIT_CMA, rac:27*PI*PI*PI*PI/4,

const INFO={
  earth:'The Earth is layered like an onion, and every layer on this globe is measured from outside. Its thin rocky <b>crust</b> rides on the <b>mantle</b>, 2891 km of solid rock that is hot enough to creep: over millions of years it flows like a very thick fluid, and that slow overturning (the level face shows a model of it) moves the <b>plates</b> on the surface a few centimetres a year. Below lies the <b>core</b>, mostly iron: its outer part is liquid, and the flow of that liquid iron is the dynamo that makes the Earth&rsquo;s magnetic field; its <b>inner core</b>, 1221.5 km in radius, is solid, frozen out under '+fmt(PX.Picb,0)+' GPa. The field lines are that field as IGRF-14 gives it, drawn from the surface out into space and down through the mantle to the core, where the field&rsquo;s patches (on the core&rsquo;s surface) show where the dynamo&rsquo;s field comes out and goes back in.',
  plates:'The Earth&rsquo;s surface is broken into rigid <b>plates</b>, and each one turns about its own <b>Euler pole</b>: every point on it moves along a circle round that pole, fastest 90&deg; from it. Bird&rsquo;s model has 52 of them, 14 large and 38 small, and classifies each of the 5,819 steps of their boundaries ('+fmt(PX.stepMean,0)+' km long on average): <b>ridges</b> where plates move apart and new sea floor forms, <b>transforms</b> where they slide past each other, <b>subduction zones</b> where one dives beneath the other (the teeth are on the plate that stays on top). Velocities have to be measured against something: against another plate, or against the whole lithosphere, in the frame where it has no net rotation. In that frame the fastest is the small '+PX.fast.name+' plate, up to '+fmt(PX.fast.v,0)+' mm a year; of the large ones, '+PX.fastLarge.name+' ('+fmt(PX.fastLarge.v,0)+'), and the Pacific reaches '+fmt(PX.paMax,0)+'.',
  mantle:'The mantle is solid rock, but hot enough to creep, and it is heated from below by the core and from within by radioactivity. Hot rock is lighter and rises; cold rock at the top sinks. Because the rock is so viscous its inertia counts for nothing: the flow at each instant is set by the buoyancy alone (the <b>Stokes</b> limit), and the <b>Rayleigh number</b> Ra measures how strongly buoyancy wins over viscosity and heat diffusion. Here the ring has the mantle&rsquo;s own proportions; the box runs the same solver on the standard benchmark. The Earth&rsquo;s Ra is of order 10<sup>7</sup>, and its plates move a few centimetres a year.',
  core:'Nobody has seen the core; PREM (the Preliminary Reference Earth Model) is what the Earth&rsquo;s seismic waves and free oscillations require, held to the Earth&rsquo;s mass and moment of inertia. <b>S waves</b> (shear) cannot travel through a liquid, and PREM&rsquo;s S speed is zero from 2891 to 5150 km: the <b>outer core is liquid</b>. Below it the S speed returns: the <b>inner core is solid</b>. The core is dense, 9.9 to 13.1 g/cm&sup3;, which only iron (with some nickel and a little lighter matter) can be at those pressures. The number &eta; (below) tests whether a layer is simply squeezed by its own weight: in the outer core it is 1 within '+fmt(100*PX.etaOC,1)+' %, so the liquid is well mixed, stirred by the same convection that drives the dynamo.',
  field:'The Earth&rsquo;s field is made by the moving liquid iron of the outer core. Measured at observatories and by satellites, it is summarised as <b>Gauss coefficients</b>, the IGRF, every five years since 1900. At the surface it is mostly a dipole, tilted '+fmt(90-PX.dLat2025,1)+'&deg; from the axis in 2025, but not all: the <b>South Atlantic Anomaly</b> is where it is weakest, and the <b>dip poles</b>, where a compass needle points straight down, wander: the north one has crossed from Canada toward Siberia. The dipole has weakened '+fmt(100*PX.dM,1)+' % since 1900. Continued down to the core, where the field is made, the small scales become as strong as the large ones, and the field breaks into patches.',
  waves:'Earthquakes send two kinds of wave through the Earth: <b>P</b> (compression, faster) and <b>S</b> (shear, slower). Their speeds rise with depth, so the rays curve back up. At the core, S cannot enter a liquid; P can, but slows sharply and bends toward the centre, leaving a <b>shadow</b> between about '+fmt(PX.sh.P,0)+'&deg; and '+fmt(PX.sh.B,0)+'&deg; from the quake where neither direct P nor PKP arrives. Oldham (1906) and Gutenberg (1913) read the shadow as a core; Inge Lehmann (1936) found faint arrivals inside it, from '+fmt(PX.sh.C,0)+'&deg;: waves that had crossed a faster, solid <b>inner core</b> (PKIKP).'

/* ================================================================== *
 *  makeShot: the recording context the selfTest draws into (build_aa   *
 *  lineage): every text with its box, every stroke with its path.      *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null, path=[], cur=null;       /* a stroke keeps its path, in canvas pixels */
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:''+ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle,paths:path.map(p=>p.slice())}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest — headless verification.  REF is build_earth/refvals.json, *
 *  the printed output of derive_prem/seis/igrf/plates/conv.py (scipy,  *
 *  numpy, the BGS service, ObsPy's TauP), read in full.                *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol*Math.max(Math.abs(b),1e-300),name+' ['+a+' vs '+b+']');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){ Object.assign(ST,DEFAULTS,over); simReset();
    for(const k in MEMO) delete MEMO[k];
    try{ return fn(); } finally{ Object.assign(ST,stSave); simReset(); } }

  /* ---------- 0. the shared helpers and the ramps ---------- */
  ok(plain('&Delta;V &omega; &#955; &frac58;')==='ΔV ω λ &frac58;','plain() decodes named and numeric entities and passes unknown ones through');
  ok(ticksFor(0.8,0.2,5).length===1&&ticksFor(0.2,0.8,5).length>=3,'ticksFor collapses an inverted range (axes() sorts it first)');
  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }
  eq(sigf(1.768e8,4),'1.768 × 10⁸','sigf writes a power of ten in superscripts');
  ok(fmt(-1e-9,2)==='0.00'&&fmt(-0.004,2)==='0.00'&&fmt(-0.006,2)==='-0.01'&&fmt(-0.4,0)==='0'&&pct(-1e-7,2)==='0.00 %','a value that rounds to zero prints unsigned (the converged box read "-0.00 %" from Table 9)');
  for(const [name,f] of [['temperature',tempCol],['sequential',seqCol]]){ let prev=-1, mono=true;
    for(let i=0;i<=40;i++){ const L=okL(f(i/40)); if(L<=prev) mono=false; prev=L; }
    ok(mono,'the '+name+' ramp rises in lightness all the way (NEON is flat over its top half)'); }
  { let mono=true; for(let i=1;i<=20;i++){ if(okL(signCol(i/20))<=okL(signCol((i-1)/20))||okL(signCol(-i/20))<=okL(signCol(-(i-1)/20))) mono=false; }
    ok(mono,'the signed ramp darkens toward zero on both sides'); eq(signCol(0),'rgb(7,11,24)','zero is the background'); }
  ok(okL(tempCol(0))<0.3&&okL(tempCol(1))>0.9,'cold is dark, hot is light');
  { const g=gaussLegendre(20); let s=0; for(let i=0;i<20;i++) s+=g.w[i]*Math.pow(g.x[i],38); rel(s,2/39,1e-13,'20-point Gauss-Legendre is exact for x^38'); }

  /* ---------- 1. PREM ---------- */
  const RP=REF.prem;
  rel(PREM_M,RP.M,1e-11,'PREM mass (derive_prem.py, exact antiderivatives)');
  rel(PREM_MOI,RP.moi,1e-11,'PREM I/MR^2');
  close(Math.round(PREM_MOI*1e4)/1e4,0.3308,1e-12,'I/MR^2 rounds to NASA\'s 0.3308');
  ok(Math.abs(PREM_M/(GM_IAU/G_NEWTON)-1)<2e-4&&PREM_M>GM_IAU/G_NEWTON,'PREM (as published) is within 2e-4 of GM/G, and above it');
  rel(premP(0),RP.Pc,1e-11,'centre pressure'); rel(premP(R_ICB),RP.P_icb,1e-11,'pressure at the inner core');
  rel(premP(R_CMB),RP.P_cmb,1e-11,'pressure at the core'); rel(premP(5701),RP.P_670,1e-11,'pressure at 670 km'); rel(premP(5971),RP.P_400,1e-11,'pressure at 400 km');
  for(const k in RP.P_samples) rel(premP(+k),RP.P_samples[k],2e-11,'P at r = '+k+' km');
  for(const k in RP.g_samples) rel(premG(+k),RP.g_samples[k],1e-11,'g at r = '+k+' km');
  for(const k in RP.m_samples) rel(premMass(+k),RP.m_samples[k],1e-11,'M(r) at r = '+k+' km');
  rel(premG(R_CMB),RP.g_cmb,1e-11,'g at the core'); rel(premG(R_E),G_NEWTON*PREM_M/Math.pow(R_E*1e3,2),1e-14,'g at the surface is GM/R^2');
  { let gmax=0, rmax=0; for(let r=10;r<=R_E;r+=10){ const g=premG(r); if(g>gmax){ gmax=g; rmax=r; } } close(rmax,R_CMB,10,'gravity peaks at the core-mantle boundary'); }
  const etaR={'inner core 600 km':600,'outer core 2000 km':2000,'outer core 3000 km':3000,"D'' 3550 km":3550,'lower mantle 4500 km':4500,
    'lower mantle 5500 km':5500,'transition zone 5800 km':5800,'transition zone 5900 km':5900,'upper mantle 6050 km':6050};
  for(const k in etaR) rel(premEta(etaR[k]),RP.eta[k],1e-10,'Bullen eta, '+k);
  { let w=0; for(let r=1300;r<=3400;r+=21) w=Math.max(w,Math.abs(premEta(r)-1)); ok(w<0.025&&w>0.01,'the outer core\'s eta stays within 2.5 % of 1 (and is not exactly 1: '+w.toFixed(4)+')'); }
  { let m=9; for(let r=5780;r<=5960;r+=9) m=Math.min(m,premEta(r)); ok(m>1.5,'the transition zone\'s eta is above 1.5: phase changes, not self-compression'); }
  /* the tabulations: a spline through PREM, to 2.5e-5 relative; the lid and LVZ print the Voigt average of the TI model */
  { let w=0, wl=0;
    /* the file lists the surface first: of two rows at one depth the first is the layer above */
    PREM_TAUP.forEach(([d,vp,vs,rho],i)=>{ const r=R_E-d, dup=(i+1<PREM_TAUP.length&&PREM_TAUP[i+1][0]===d)||(i>0&&PREM_TAUP[i-1][0]===d);
      const above=dup&&!(i>0&&PREM_TAUP[i-1][0]===d), k=premLayer(r,above), L=PREM_LAYERS[k], x=r/R_E;
      const lid=/^(lid|low-velocity)/.test(L.name);
      for(const [a,b] of [[polyv(L.vp,x),vp],[polyv(L.vs,x),vs]]){ if(b===0) continue; const e=Math.abs(a/b-1); if(lid) wl=Math.max(wl,e); else w=Math.max(w,e); }
      w=Math.max(w,Math.abs(polyv(L.rho,x)/rho-1)); });
    ok(w<2.5e-5,'TauP\'s prem.nd within 2.5e-5 of the polynomials outside the lid and LVZ (worst '+w.toExponential(2)+')');
    ok(wl>1e-4&&wl<3e-4,'in the lid and LVZ it prints the Voigt average, 1-3e-4 from the isotropic column ('+wl.toExponential(2)+')'); }
  { const ratios=PREM_PTAB.filter(([d])=>d>=670).map(([d,P])=>P/premP(R_E-d));
    const lo=Math.min(...ratios), hi=Math.max(...ratios);
    ok(hi-lo<5e-5&&lo>0.9993&&hi<0.9995,'below 670 km PREM\'s own pressure table is a constant 0.99934 of this integral ('+lo.toFixed(5)+'..'+hi.toFixed(5)+')'); }
  eq(premLayer(R_CMB,false),1,'the core-mantle boundary belongs to the outer core from below'); eq(premLayer(R_CMB,true),2,'and to D\'\' from above');
  ok(premVs(R_CMB-1)===0&&premVs(R_ICB-1)>3.5,'no S in the outer core; 3.5 km/s in the inner core');

  /* ---------- 2. seismic rays ---------- */
  const RS=REF.seis;
  { let wD=0, wT=0; for(const q of RS.pins){ const r=seisPhase(q.phase,q.p,R_E-q.depth); if(!r){ ok(false,'pin '+q.phase+' null'); continue; }
      wD=Math.max(wD,Math.abs(r.D-q.dist)); wT=Math.max(wT,Math.abs(r.T/q.time-1)); }
    ok(wD<1e-8,'72 (Delta, T) pins at fixed p: Delta within 1e-8 deg of scipy (worst '+wD.toExponential(2)+')');
    ok(wT<1e-10,'and T within 1e-10 (worst '+wT.toExponential(2)+')'); }

    close(r[0],2.6,1e-12,'and bottoms at the upper crust\'s 2.6 (PREM\'s 1.02 of water left out)');
    eq(earthFaceRange('vs',R_ICB)[0],0,'with the cut to the inner core, the S face reaches the liquid\'s 0'); }
  { const e=earthBands(R_CMB); ok(e[0]===R_CMB&&e[e.length-1]===R_E&&e.every((v,i)=>i===0||v>e[i-1]),'the faces\' bands run from the core to the surface, in order');
    ok([5701,5971,R_MOHO].every(b=>e.indexOf(b)>=0),'with 670 km, 400 km and the Moho as band edges (a jump stays sharp)'); }
  withState({view:'earth'},()=>{ const E=buildModel().E; ok(E.lines.length===20&&E.lines.rmax>2.3&&E.lines.rmax<2.6,'20 field lines, the widest reaching '+fmt(E.lines.rmax,2)+' Earth radii');
    has(earthCaption(buildModel()).full,fmt(E.lines.rmax,1)+' Earth radii','and the caption quotes it'); });
  for(const phi of [0.2,0.62,1.2]) for(const th of [-0.6,0.4,1.4,2.4,3.4,4.4]) withState({view:'earth',camPhi:phi,camTheta:th,eSpin:false},()=>{
    const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const b=HIT.find(q=>q.kind==='cam').b; let out=0, n=0;
    for(const o of c.ops) if(o.op==='stroke'&&/^rgba\(90,200,224/.test(o.style)) for(const p of o.paths) for(const q of p){ n++; if(q[0]<b.x-2||q[0]>b.x+b.w+2||q[1]<b.y-2||q[1]>b.y+b.h+2) out++; }
    ok(n>500&&out===0,'the field lines stay in the frame, elevation '+phi+', azimuth '+th+' ('+out+' of '+n+' points out)'); });
  { const b=box(56,120,700,480); ok(earthFit(b,0.62,[],2025)>0.45*Math.min(b.w,b.h),'without the lines the globe fills the frame'); }
  withState({view:'earth'},()=>{ const c=makeShot(420,520); drawView(c,420,520,buildModel()); const g=EARTH_GLOBE;
    ok(!!g&&KEY_DROPS>0&&!LEGEND_RECTS.some(q=>boxOnGlobe([q.x-22,q.y,q.x+q.w,q.y+q.h],g)),'on a 420-px stage the layer legend would reach the globe: it is dropped (counted: '+KEY_DROPS+'), not laid over it'); });

  /* ---------- 9. the plates ---------- */
  eq(PB_OROGENS.length,13,'Bird\'s 13 orogens (the caption counts them)'); eq(PB_STEPS.length,5819,'and his 5,819 steps (the prose)');
  { let bad=0; for(let i=0;i<PB_STEPS.length;i++){ const c=PB_STEPS[i].cls, d=stepModel(i).div; if(('Rr'.indexOf(c)>=0&&!(d>0))||('SCc'.indexOf(c)>=0&&!(d<0))) bad++; }
    eq(bad,0,'every ridge and rift step opens, every subduction and collision step closes'); }
  for(const id of ['PA','AF','NA','AN']){ const rows=boundaryRows(PB_INDEX[id]);
    ok(rows.length>20&&rows.every(r=>('Rr'.indexOf(r[3])<0||r[2]>0)&&('SCc'.indexOf(r[3])<0||r[2]<0)),id+'\'s boundary profile: its ridges open and its trenches close whichever side it is on'); }
  eq(PX.fast.id,'TO','the fastest plate without net rotation is Tonga'); close(PX.fast.v,197.35,0.01,'197 mm a year');
  eq(PX.fastLarge.id,'CO','of the 14 large, Cocos'); rel(PX.paMax,v3.len(plateOmega(PB_INDEX.PA,'nnr'))*R_E,1e-3,'the Pacific\'s greatest speed is omega R (its rotation\'s equator crosses it)');
  has(INFO.plates,'Tonga plate, up to '+fmt(PX.fast.v,0)+' mm','the prose: Tonga'); has(INFO.plates,'Cocos ('+fmt(PX.fastLarge.v,0)+')','and Cocos');
  { let L=0; const T=classTotals(); for(const c in T) L+=T[c].L; rel(PX.stepMean,L/PB_STEPS.length,1e-12,'the mean step, from the class totals'); has(INFO.plates,'('+fmt(PX.stepMean,0)+' km long on average)','the prose: 45 km'); }

  /* ---------- 10. the prose against its sources and the twins ---------- */
  for(const v of ['earth','plates','mantle','core','field','waves']){ ok(INFO[v].length>400,v+': its prose'); ok(DERIV[v].length>300,v+': its calculation');
    ok(!/NaN|undefined|Infinity/.test(INFO[v]+DERIV[v]),v+': the prose is clean'); }
  ok(!/Bullen/.test(Object.values(INFO).join(' ')+Object.values(DERIV).join(' ')),'no attribution of eta the sources do not make');
  has(INFO.waves,'Gutenberg (1913)','Gutenberg, 1913 (Shadow zone), in the prose'); withState({view:'waves'},()=>has(wavesCaption(buildModel()).full,'Gutenberg (1913)','and in the caption'));
  has(DERIV.core,'(Adams and Williamson, 1923)','eta = 1 is Adams and Williamson\'s (1923)'); has(DERIV.mantle,'(Rayleigh 1916)','Rayleigh, 1916');
  { let w=0; for(let r=R_ICB+0.1;r<R_CMB;r+=0.1) w=Math.max(w,Math.abs(premEta(r)-1)); rel(PX.etaOC,w,2e-3,'the outer core\'s largest |eta - 1|, '+pct(w,2));
    has(INFO.core,'1 within '+fmt(100*PX.etaOC,1)+' %','the prose: within 2.8 %'); }
  eq(REF.conv.ann_Rac.m,4,'the annulus\'s first mode is m = 4 (derive_conv.py\'s eigen-solve)'); has(DERIV.mantle,'m = 4, at Ra = '+REF.conv.ann_Rac.Ra_c.toFixed(1),'and the prose quotes its 673.4');
  rel(PX.rac,REF.conv.box_Rac,1e-15,'27 pi^4/4'); has(DERIV.mantle,fmt(PX.rac,2),'the prose: 657.51');
  rel(PX.dM,1-REF.igrf.dipole['2025'].M/REF.igrf.dipole['1900'].M,1e-12,'the dipole\'s decline since 1900'); has(INFO.field,fmt(100*PX.dM,1)+' %','the prose: 7.6 %');
  has(INFO.field,'tilted '+fmt(90-REF.igrf.dipole['2025'].lat,1)+'&deg;','the prose: the dipole\'s tilt'); rel(PX.Picb*1e9,REF.prem.P_icb,1e-11,'the inner core\'s pressure in the prose');
  has(DERIV.field,'up to about 14 come from the core','degree 14 and below from the core (Earth\'s magnetic field)');

  /* ---------- 11. the panels, across the views' states ---------- */
  const PANEL_STATES=[{view:'earth'},{view:'earth',eCut:'inner',eFaces:'rho'},{view:'earth',eFaces:'P',eLines:false,eBr:false},{view:'earth',mGeom:'box'},
    {view:'plates'},{view:'plates',pSel:'TO',pFrame:'AF'},{view:'plates',pSel:'',pFrame:'PA'},{view:'plates',pSel:'AN',pFrame:'NA'},
    {view:'mantle'},{view:'mantle',mHeat:'within',mH:20},{view:'mantle',mHeat:'below',mRa:1e3},{view:'mantle',mGeom:'box',mBench:'1c'},{view:'mantle',mGeom:'box',mBench:'1a',mRes:'coarse'},
    {view:'core'},{view:'core',cDepth:0},{view:'core',cDepth:6371},{view:'core',cDepth:2891},{view:'core',cDepth:4000},
    {view:'field'},{view:'field',fRad:'cmb',fYear:1900},{view:'field',fWhat:'D',fLat:-89.9,fLon:0},{view:'field',fWhat:'I',fYear:2030,fLat:0,fLon:-180},
    {view:'waves'},{view:'waves',wDepth:600,wDist:0},{view:'waves',wDist:180,wT:1800},{view:'waves',wDepth:100,wDist:103}];
  for(const over of PANEL_STATES) withState(over,()=>{ if(over.view==='mantle') convReset(ST); const M=buildModel(), s=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
    ok(!/NaN|undefined|Infinity|null/.test(s),'the panels are clean: '+JSON.stringify(over));
    ok(!/\b[A-Za-z]_[A-Za-z0-9{]|\^/.test(s.replace(/<[^>]*>/g,'')),'no raw subscript or caret in the panels: '+JSON.stringify(over)); });

  /* ---------- 12. the drawing: every view at four sizes (where the text audit is blind) ---------- */
  { const caps={earth:[0,0],plates:[2,0.30],mantle:[2,0.30],core:[3,0.30],field:[2,0.28],waves:[0,0]};
    for(const v in caps) withState({view:v},()=>{ const M=buildModel(), cap=v==='earth'?earthCaption(M):v==='plates'?platesCaption(M):v==='mantle'?mantleCaption(M):v==='core'?coreCaption(M):v==='field'?fieldCaption(M):wavesCaption(M);
      for(const [W,H] of [[1400,820],[1100,712],[820,520],[560,380]]){ const L=stageLayout(makeShot(W,H),W,H,cap.full,cap.short,...caps[v],caps[v][0]?nbNarrow(H):0);
        ok(L.main.h>=120&&L.bottom.every(q=>q.h>=60),v+' at '+W+'x'+H+': the picture keeps '+L.main.h.toFixed(0)+' px and every plot 60 or more ('+(L.bottom.map(q=>q.h.toFixed(0)).join(', ')||'none')+')'); } }); }
  const SIZES=[[1400,820],[1100,712],[820,520],[560,380]];
  const CONFIGS=[['earth',{view:'earth'}],['earth inner',{view:'earth',eCut:'inner',camTheta:0.9,camPhi:0.3}],['earth rho',{view:'earth',eFaces:'rho',eLines:false,camPhi:0.8}],
    ['earth vs plain',{view:'earth',eFaces:'vs',ePlates:false,eBr:false,fYear:1900}],['earth from below',{view:'earth',camPhi:-1.1}],['earth on the box',{view:'earth',mGeom:'box'}],
    ['plates',{view:'plates'}],['plates af',{view:'plates',pFrame:'AF',pSel:'AF',pLon0:0}],['plates none',{view:'plates',pSel:'',pArrows:false,pDrift:false,pOrog:false}],['plates tonga',{view:'plates',pSel:'TO',pFrame:'PA',pLon0:-180}],
    ['mantle',{view:'mantle'},60],['mantle arrows',{view:'mantle',mArrows:true,mRa:1e5},60],['mantle within',{view:'mantle',mHeat:'within',mH:20,mRes:'coarse'},60],['mantle fresh',{view:'mantle'},0],
    ['box 1b',{view:'mantle',mGeom:'box',mBench:'1b',mRes:'coarse'},60],['box 1c',{view:'mantle',mGeom:'box',mBench:'1c',mArrows:true},60],
    ['core',{view:'core'}],['core centre',{view:'core',cDepth:6371,cQ:'gp'}],['core top',{view:'core',cDepth:0}],
    ['field',{view:'field'}],['field cmb 1900',{view:'field',fRad:'cmb',fYear:1900}],['field D',{view:'field',fWhat:'D',fYear:1900,fLon0:180}],['field I',{view:'field',fWhat:'I',fYear:1965.3}],['field Z',{view:'field',fWhat:'Z',fYear:2030,fNOAA:false}],['field H bare',{view:'field',fWhat:'H',fPoles:false,fNOAA:false}],
    ['waves',{view:'waves'}],['waves 600',{view:'waves',wDepth:600,wT:420,wDist:40}],['waves S',{view:'waves',wP:false,wPKP:false,wPKIKP:false,wS:true,wScS:true,wSKS:true,wT:900}],['waves all',{view:'waves',wPcP:true,wScS:true,wPKiKP:true,wT:1800,wDist:180}],['waves none',{view:'waves',wP:false,wS:false,wPKP:false,wPKIKP:false,wSKS:false},0,3]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/, tDraw={};
  for(const [nm,over,nsteps,least] of CONFIGS) for(const [W,H] of SIZES) withState(over,()=>{
    if(over.view==='mantle'){ convReset(ST); for(let i=0;i<(nsteps||0);i+=5) convAdvance(ST,5); }
    const c=makeShot(W,H); let err=null; const t0=Date.now();
    try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
    tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
    ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):'')); if(err) return;
    const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke'), fills=c.ops.filter(o=>o.op==='fill');
    ok(strokes.length+fills.length>=(least||8)&&texts.length>=3,nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+fills.length+' fills, '+texts.length+' texts)');
    { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
    let bad=null;
    for(const t of texts){
      if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
      if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
      if(/\^/.test(t.t)){ bad='a caret power: "'+t.t.slice(0,40)+'"'; break; }
      if(/\d[eE][-+]?\d/.test(t.t)){ bad='a raw exponent: "'+t.t.slice(0,40)+'"'; break; }
      if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
      if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
    ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
    let hit=null;
    for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
      const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
      if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
    ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
    let leg=null;
    for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
      const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
      if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
      leg='a curve crosses the legend'; break; }
    ok(!leg,nm+' '+W+'x'+H+' legend clear');
    let across=null;
    for(const L of LABELS){ if(L.seq===undefined) continue;
      for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
      if(across) break; }
    ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
    if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key fits ('+KEY_DROPS+' dropped)');
    /* heated within only, the caption has no plumes from the core (the core is insulated) */
    if(over.view==='mantle'&&(over.mGeom||'ann')==='ann'){ const capT=texts.map(t=>t.t).join(' ');
      if(capT.indexOf('from the surface')>=0) ok((capT.indexOf('plumes from the core')>=0)===(over.mHeat!=='within'),nm+' '+W+'x'+H+': plumes from the core only when the core is heated'); }
    /* IGRF stops at degree 10 before 2000: the spectrum says so there (its zeros are not drawn), and only there */
    if(over.view==='field'&&W>=900){ const y=over.fYear||DEFAULTS.fYear, note=texts.some(t=>t.t==='IGRF stops at n = 10 before 2000');
      ok(note===(y<2000),nm+' '+W+'x'+H+': the spectrum '+(y<2000?'says IGRF stops at n = 10':'has all 13 degrees')); }
    /* a caption names only the plots that are drawn (below 900 px the house layout keeps one plot, or none) */
    { const capT=texts.map(t=>t.t).join(' ');
      if(over.view==='waves') ok(W>=900||capT.indexOf('travel times')<0,nm+' '+W+'x'+H+': no travel-time plot named where none is drawn');
      if(over.view==='core'){ const nb=W>=900?3:nbNarrow(H); ok((nb>=3||capT.indexOf('pressure integrated')<0)&&(nb>=1||capT.indexOf('Below, gravity')<0),nm+' '+W+'x'+H+': the caption names the '+nb+' plots drawn, no more'); } }
    /* the floating readout (the audit's rectangle): on a wide stage nothing is written under it */
    if(W>=900){ const u=texts.find(t=>t.bb[2]>W-317&&t.bb[1]<470); ok(!u,nm+' '+W+'x'+H+' nothing under the readout'+(u?' ("'+u.t.slice(0,30)+'")':'')); }
    if(over.view==='earth'){ const g=EARTH_GLOBE, r=LEGEND_RECTS.find(q=>boxOnGlobe([q.x-22,q.y,q.x+q.w,q.y+q.h],g));
      ok(!!g&&!r,nm+' '+W+'x'+H+' the keys leave the globe clear'); }
  });
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  console.log(pass+' passed, '+fail+' failed ('+(Date.now()-T0)+' ms)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
