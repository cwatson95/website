<title>The Earth&rsquo;s interior &mdash; the plates, the mantle, the iron core and its field</title>
<!--
  ===================================================================
  earth_interior.html — the Earth inside: the plates on its surface,
  the solid mantle that creeps beneath them, the iron core, and the
  magnetic field the core makes; and the seismic waves that found
  the core
  ===================================================================

  Six views.  THE EARTH: the globe to scale with the octant facing the
  camera cut away (to the core, or to the inner core); PREM's layers on
  the upright faces, the mantle view's convection model running on the
  level face, IGRF-14's radial field on the core's surface, Bird's 52
  plates and Natural Earth's coasts on the outside, and field lines of
  IGRF-14 (first eight degrees) from magnetic latitudes 30 and 45
  degrees, out to about 2.5 Earth radii and down to the core; the frame
  fitted to the lines at the camera's elevation.  THE PLATES: Bird's PB2002 on a map: the
  52 plates, the 229 boundary segments in his seven classes, the 13
  orogens, subduction teeth on the overriding side, velocity arrows from
  the Euler poles of his Table 1 in a chosen frame (no net rotation,
  computed here, or any plate held fixed), tracers riding the plates;
  a chosen plate's pole, small circles, area and boundary.  THE MANTLE:
  infinite-Prandtl Boussinesq convection in a 2-D ring with the
  mantle's radius ratio (3480/6371), free-slip walls, heated from the
  core, from within, or both, Ra up to 2 x 10^6 (both grids hold it);
  Fourier in angle, Chebyshev in radius, SBDF2 in time, the step set by
  the flow's own CFL number (0.06 to 0.14); the ring starts from its own
  developed mean profile (no first overturn), the box from boundary
  layers and one cell; the same solver in the box runs Blankenbach et
  al.'s benchmark beside its Table 9.  THE CORE: PREM's density and
  seismic speeds with depth (S speed zero in the liquid outer core),
  gravity and pressure integrated here from the density, the
  self-compression test eta, the mass and the moment of inertia.
  THE FIELD: IGRF-14
  at the surface (F, Z, H, D, I) or continued down to the core (B_r),
  any year 1900-2030; the dip poles and their tracks (NOAA's back to
  1590), the geomagnetic pole, the South Atlantic Anomaly, the dipole
  moment and the Lowes-Mauersberger spectrum at both radii.  THE WAVES:
  rays and moving wavefronts through PREM from a quake at a chosen
  depth: P, S, PcP, ScS, PKP, PKiKP, PKIKP, SKS; the shadow zones; the
  travel-time curves against ObsPy's TauP on the same model.

  WHAT IS MEASURED (the sources' own numbers, build_earth/raw/, fetched
  2026-09-27; build_earth/fetch_data.py lists every URL)
  -----------------------------------------------------------------------
  PREM (Dziewonski & Anderson 1981): the polynomials parsed from
  SPECFEM3D_GLOBE's src/shared/model_prem.f90 (isotropic; the ocean's
  density, 1.02, from its PREM_RHO_OCEANS); checked row by row against
  TauP's prem.nd and BurnMan's prem.txt (to 2.5e-5; both are a spline
  through PREM; BurnMan misprints vp at 1071 km and at the centre).
  PB2002 (Bird 2003, G-cubed 4(3) 1027): the boundaries, the plate
  outlines, the orogens, the step classes and Table 1's Euler poles and
  areas, from Bird's own files and paper.  IGRF-14 (IAGA V-MOD 2024):
  the Gauss coefficients 1900-2025 and the secular variation to 2030.
  NOAA NCEI's modelled dip-pole tracks, 1590-2025.  Natural Earth
  1:110m coastlines (public domain; rounded here to 0.01 degree).
  Blankenbach et al. (1989) Table 9 (via ASPECT's benchmark files).
  Scalars from Wikipedia: G (CODATA 2018), the IAU's GM, WGS84; the
  mantle's Rayleigh number "of order 10^7" and plate speeds of "a few
  cm per year" (Mantle convection); kappa ~ 1e-6 m2/s for silicate
  rocks (Lithosphere); the core's temperatures (Earth's outer core);
  47 +- 2 TW of heat (Earth's internal heat budget); Oldham 1906
  (Richard Dixon Oldham, Shadow zone), Gutenberg 1913 (Shadow zone),
  Lehmann 1936 (Inge Lehmann), Rayleigh 1916 and 27 pi^4/4
  (Rayleigh-Benard convection), Adams and Williamson 1923 (the
  Adams-Williamson equation), degrees 14 and below from the core
  (Earth's magnetic field).  NASA's fact sheet: M, I/MR^2 0.3308.

  WHAT IS COMPUTED HERE (and checked by build_earth/derive_*.py)
  -----------------------------------------------------------------------
  The mass, moment of inertia, gravity and pressure of PREM (mass within
  1.7e-4 of GM/G; I/MR^2 0.33080; the tabulated pressure runs 0.066 %
  below this integral below 670 km, a constant: its own G).  The tau-p
  ray integrals (every one of 710 ObsPy TauP arrivals on the same
  polynomials within 0.0014 s).  The IGRF synthesis (the BGS web
  service's 76 values within their rounding; NOAA's dip poles within
  0.14 km 1900-2006).  Every PB2002 step's velocity from the poles
  (Bird's printed columns to their last digit); the plate areas; the
  no-net-rotation frame (in it the fastest plate is Tonga, 197 mm a
  year; of the 14 large, Cocos, 104).  The convection solver
  (Blankenbach 1a, 1b, 1c to the table's printed digits on fine grids;
  the free-slip onset 27 pi^4/4; the ring's first mode m = 4 at Ra
  673.4; the page pinned to its numpy twin to 1e-10).  The largest
  departure of eta from 1 in the outer core, 2.8 %.

  WHAT IS NOT MODELLED
  -----------------------------------------------------------------------
  The geodynamo: nothing here solves for the core's flow or field; field
  lines stop at the core.  The real mantle's variable viscosity, plates,
  phase changes, melting and three dimensions: the convection model is a
  2-D, constant-viscosity demonstration of why the mantle turns over, not
  of how the Earth's does.  The crust's own magnetic field and the
  field of currents outside the Earth (IGRF is the core's field to
  degree 13).  Diffracted waves (Pdiff) and the ellipticity of the Earth.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
/* a number rounded to n places; a value that rounds to zero prints as 0, never -0.00 (toFixed keeps the sign) */
function fmt(x,n){ if(!isFinite(x)) return '—'; const s=Number(x).toFixed(n===undefined?3:n); return /^-0(\.0*)?$/.test(s)?s.slice(1):s; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* a power of ten in superscripts, never a caret: 1.768 × 10⁸, 2.5 × 10⁻⁵ */
  if(a>=1e5||a<1e-4){ const s=x.toExponential(n-1), k=s.indexOf('e'), SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return s.slice(0,k)+' × 10'+String(+s.slice(k+1)).split('').map(c=>c==='-'?'⁻':SUP[+c]).join(''); }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}

  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}

function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  /* integer multiples of the step, never an accumulated sum: a running t += step printed 0 as −5.55e-17 */
  for(let i=Math.ceil(lo/step-1e-9);i*step<=hi+step*1e-6;i++) out.push(i*step===0?0:i*step);

function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;

  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){

  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);

  ctx.setLineDash([]);
  ctx.restore();
}

let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });

  return box(x,y,bw,bh);

/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

/* ================================================================== *

const R_E=6371.0;                 /* km, PREM's radius */
const G_NEWTON=6.67430e-11;       /* CODATA 2018 */

function polyv(co,x){ return co[0]+x*(co[1]+x*(co[2]+x*co[3])); }
function polyd(co,x){ return co[1]+x*(2*co[2]+x*3*co[3]); }
/* the layer holding radius r (km); at a boundary the upper layer if above, else the lower */
function premLayer(r,above){
  const L=PREM_LAYERS;
  for(let k=0;k<L.length;k++){ const a=L[k].r0, b=L[k].r1;
    if((r>a&&r<b)||(!above&&r===b)||(above&&r===a)) return k; }

  if(r>=R_E) return L.length-1;
  return -1;

/* PREM as published: the top 3 km are ocean, 1.02 g/cm3 (density only; its speeds are the crust's, as in TauP) */
function premRhoCo(k){ return k===PREM_LAYERS.length-1?[PREM_RHO_OCEAN,0,0,0]:PREM_LAYERS[k].rho; }

function polyIntXn(co,n,x0,x1){ let s=0; for(let k=0;k<4;k++) s+=co[k]*(Math.pow(x1,k+n+1)-Math.pow(x0,k+n+1))/(k+n+1); return s; }

    m+=4*PI*Math.pow(R_E*1e3,3)*1e3*polyIntXn(premRhoCo(k),2,L.r0/R_E,L.r1/R_E); out.push(m); }

function gaussLegendre(n){
  const x=new Float64Array(n), w=new Float64Array(n);
  for(let i=0;i<n;i++){
    let z=Math.cos(PI*(i+0.75)/(n+0.5)), pp=0;

      for(let j=1;j<=n;j++){ const p3=p2; p2=p1; p1=((2*j-1)*z*p2-(j-1)*p3)/j; }

const PREM_PBOT=(()=>{ const n=PREM_LAYERS.length, out=new Float64Array(n); let P=0;

function premEta(r,above){

function seisSplit(a,b){

  C.buildHeat();

  const S=(M+1)*Nz;

  C.TpRe=new Float64Array(S); C.TpIm=new Float64Array(S); C.NpRe=new Float64Array(S); C.NpIm=new Float64Array(S);
  const bre=new Float64Array(Nx), bim=new Float64Array(Nx);

  C.toGrid=function(fre,fim,out){

      bre[0]=fre[j];

      /* rhs = Ra i k T (/ r), wall rows zero: i (a + i b) = -b + i a */
      for(let j=0;j<Nz;j++){ const ir=geom==='box'?1:1/C.r[j];

    C.toGrid(hre,him,G1);

function convStart(C,heat){
  const T=new Float64Array(C.Nz*C.Nx), rnd=mulberry32(20260927), md=[];
  for(let m=2;m<=9;m++) md.push([m,2*rnd()-1,2*PI*rnd()]);
  for(let j=0;j<C.Nz;j++){ const z=C.z[j], t0=convTbar(heat,z), sz=Math.sin(PI*z);
    for(let i=0;i<C.Nx;i++){ const th=2*PI*i/C.Nx; let d=0; for(const [m,a,p] of md) d+=a*Math.cos(m*th+p);
      T[j*C.Nx+i]=t0+0.1*d/Math.sqrt(md.length)*sz; } }

}
/* n steps, the step adapted to the flow every 5 (a steady state of SBDF2 does not depend on it) */
function convAdvance(st,n){
  const C=convEnsure(st);

    C.step();
    if(C.steps%5===0){ const cf=Math.max(...C.cfl());
      if(!isFinite(cf)){ SIM.blown++; SIM.conv=null; const N=convEnsure(st); N.cflScale=Math.pow(0.5,Math.min(SIM.blown,4)); return; }
      const w=C.cflScale||1;
      if(cf>w*CONV_CFL[1]) C.setDt(C.dt*0.5); else if(cf<w*CONV_CFL[0]&&C.dt*1.2<=C.dtMax) C.setDt(C.dt*1.2); }

function convReset(st){ SIM.conv=null; SIM.convKey=''; convEnsure(st); }
/* the Earth view's level face runs the model only when the mantle view has it on the annulus (the box has no place in

function earthRunsConv(st){ return st.eConv&&st.eFaces==='conv'&&st.mGeom==='ann'; }

/* ================================================================== *
 *  the view models                                                    *
 * ================================================================== */
function igrfAt(t){ return memo('igrf',t.toFixed(4),()=>igrfCoeffs(t)); }
/* field lines for the Earth view: start points on the surface at 10 magnetic longitudes (about the dipole's axis) and
   magnetic latitudes 30 and 45 degrees; a dipole's line from magnetic latitude L0 reaches 1/cos^2 L0 Earth radii
   (1.33 and 2.0), so every loop closes inside the frame (2.1 radii).  The internal field to degree 8 (the lines are
   drawings; the maps and the numbers use degree 13) */
const EARTH_MLAT=[30,45], EARTH_MLON=10;
function earthLines(t){
  return memo('elines',t.toFixed(2),()=>{ const co=igrfAt(t), out=[], d=igrfDipole(co);
    const e3=unitLL(d.lon,d.lat), e1=v3.norm(v3.cross([0,0,1],e3)), e2=v3.cross(e3,e1);
    for(let k=0;k<EARTH_MLON;k++){ const ph=k*2*PI/EARTH_MLON;
      for(const la of EARTH_MLAT){ const c=Math.cos(la*PI/180), s=Math.sin(la*PI/180);
        const u=v3.add(v3.add(v3.mul(e1,c*Math.cos(ph)),v3.mul(e2,c*Math.sin(ph))),v3.mul(e3,s));
        out.push(igrfFieldLine(co,v3.mul(u,IGRF_A),R_CMB,2.9*R_E,90,8)); } }
    out.rmax=0; for(const L of out) for(const x of L) out.rmax=Math.max(out.rmax,v3.len(x)/R_E);   /* the caption quotes it */
    return out; });
}
function earthModel(st){
  const co=igrfAt(st.fYear);
  const brGrid=st.eBr?memo('ebr',st.fYear.toFixed(2),()=>({lat:72,lon:144,v:igrfMap(co,'Br',72,144,R_CMB)})):null;
  const C=st.eFaces==='conv'&&st.mGeom==='ann'?convEnsure(st):null;
  const dip=igrfDipole(co);
  return {co, brGrid, conv:C, lines:st.eLines?earthLines(st.fYear):[], dip, year:st.fYear,
    shells:PREM_SHELLS.map(s=>({...s, m:premMass(s.r1)-premMass(s.r0), P0:premP(s.r0), P1:premP(s.r1)}))};
}
function platesModel(st){
  const k=PB_INDEX[st.pSel]!==undefined?PB_INDEX[st.pSel]:-1;
  const sel=k<0?null:(()=>{ const pole=platePole(k,st.pFrame);
    let vmax=0; for(const i of PB_PLATES[k][4]){ const ll=[PB_V[2*i],PB_V[2*i+1]], v=plateVel(k,ll[0],ll[1],st.pFrame); vmax=Math.max(vmax,Math.hypot(v[0],v[1])); }
    /* the boundary composition of this plate: the steps with it on either side */
    const comp={}; let Ltot=0;
    PB_STEPS.forEach((s,i)=>{ if(s.L===k||s.R===k){ const m=stepModel(i); comp[s.cls]=(comp[s.cls]||0)+m.len; Ltot+=m.len; } });
    return {k, id:PB_ID[k], name:PB_PLATES[k][1], area:PB_AREA[k], areaT1:PB_PLATES[k][2], pole, vmax, comp, Ltot}; })();
  const tot=memo('ptot','1',()=>classTotals());

}
function mantleModel(st){
  const C=convEnsure(st), nu=C.nusselt(), v=C.vrms(), us=C.surfaceSpeed();
  const o=convSettings(st);
  const bench=o.geom==='box'?BLANKENBACH[st.mBench]:null;
  /* the horizontally averaged temperature, node by node (mode 0 is the mean) */
  const Tbar=Array.from({length:C.Nz},(_,j)=>C.Tre[j]);
  const cond=C.conduction();
  /* the heat from the core against the heat out of the top (annulus: through each circle, r times the flux) */
  let coreShare=NaN;
  if(o.geom==='ann'){ const qc=r=>-1/(r*Math.log(C.ri/C.ro)); coreShare=o.bottom==='F'?0:(nu[1]*qc(C.ri)*C.ri)/(nu[0]*qc(C.ro)*C.ro); }
  return {C, o, nu, vrms:v, surf:us, bench, Tbar, cond, coreShare, tMyr:C.t*T_UNIT_MYR, vcm:v*V_UNIT_CMA, surfcm:us*V_UNIT_CMA,
    stepMyr:C.dt*T_UNIT_MYR, hist:SIM.hist};
}
function coreProfiles(){
  return memo('cprof','1',()=>{ const pts=[];
    const edges=[0]; for(const L of PREM_LAYERS) edges.push(L.r1);
    for(let k=0;k<PREM_LAYERS.length;k++){ const a=PREM_LAYERS[k].r0, b=PREM_LAYERS[k].r1, n=Math.max(2,Math.ceil((b-a)/20));
      for(let i=0;i<=n;i++){ const r=a+(b-a)*i/n, above=i===0&&k>0;
        pts.push({r, d:R_E-r, rho:premRho(r,above), vp:premVp(r,above), vs:premVs(r,above), g:premG(r), P:premP(r)/1e9,
          eta:r>1?premEta(r,above):NaN, m:premMass(r)/PREM_M}); } }
    return pts; });
}
function coreModel(st){
  const d=clamp(st.cDepth,0,R_E), r=R_E-d;
  const at={d, r, rho:premRho(r,false), vp:premVp(r,false), vs:premVs(r,false), g:premG(r), P:premP(r)/1e9, eta:r>1?premEta(r,false):NaN,
    m:premMass(r)/PREM_M, layer:PREM_LAYERS[premLayer(r,false)].name};

function fieldModel(st){
  const co=igrfAt(st.fYear), cmb=st.fRad==='cmb';
  const what=cmb?'Br':st.fWhat;

  const poles=memo('fpoles',st.fYear.toFixed(2),()=>{ const nG=igrfDipPole(co,guessPole(st.fYear,true)), sG=igrfDipPole(co,guessPole(st.fYear,false));
    return {north:nG, south:sG, dip:igrfDipole(co)}; });
  const track=memo('ftrack','1',()=>{ const out=[]; let gn=[70.5,-96.6], gs=[-72,148];
    for(let y=1900;y<=2030;y+=1){ const c=igrfCoeffs(y); gn=igrfDipPole(c,gn); gs=igrfDipPole(c,gs); out.push({t:y,n:gn,s:gs,dip:igrfDipole(c)}); }

/* a guess for the dip pole's Newton step: the previous whole year of the track, or NOAA's near the year */
function guessPole(t,north){
  const L=north?NOAA_NP:NOAA_SP; let best=L[L.length-1];
  for(const q of L) if(Math.abs(q[0]-t)<Math.abs(best[0]-t)) best=q;

}
function wavesModel(st){
  const rs=R_E-st.wDepth, on=SEIS_PH.filter(ph=>st['w'+ph]);
  const samp=memo('wsamp',st.wDepth.toFixed(1),()=>{ const o={}; for(const ph of SEIS_PH) o[ph]=seisSample(ph,rs,160); return o; });
  const paths=memo('wpaths',st.wDepth.toFixed(1),()=>{ const o={};
    for(const ph of SEIS_PH){ const [lo,hi]=seisPRange(ph,rs), arr=[]; const n=ph==='P'||ph==='S'?44:26;
      for(let i=0;i<n;i++){ const p=lo+(hi-lo)*(i+0.5)/n, path=seisPath(ph,p,rs,8); if(path) arr.push({p,path,key:seisPhase(ph,p,rs).key}); }
      o[ph]=arr; }
    return o; });
  const shadow=memo('wshadow',st.wDepth.toFixed(1),()=>seisShadow(rs));

function buildModel(){
  const v=ST.view, M={view:v};
  if(v==='earth') M.E=earthModel(ST);
  else if(v==='plates') M.P=platesModel(ST);
  else if(v==='mantle') M.C=mantleModel(ST);
  else if(v==='core') M.K=coreModel(ST);
  else if(v==='field') M.F=fieldModel(ST);
  else M.W=wavesModel(ST);

}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *

 *  pulsar.html (v3, makeCamera, camBasis, project)                    *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;

}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);

/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);

  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }

function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();

/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }

}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }
  }
  /* nothing clear: the legend is dropped rather than laid over a curve or a label (the captions
     name the colours); clebsch_gordan: forcing it in a big box put it on the mean's label */
  if(!pick){ KEY_DROPS+=items.length; return; }
  legendBox(ctx,pick[0],pick[1],items);
  const lb=[pick[0],pick[1],pick[0]+bw,pick[1]+bh]; lb.t='the legend'; lb.plate=true; lb.seq=++DRAW_SEQ; LABELS.push(lb);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);

function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
let KEY_DROPS=0, HIT=[], MARKS=[], W_STAGE=0, H_STAGE=0;
/* a narrow stage keeps one plot below its picture, a short one none (build_div) */
const nbNarrow=H=>H<520?0:1;
/* the globe's disc on the screen, as the Earth view last drew it (the selfTest keeps the keys off it) */
let EARTH_GLOBE=null;
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);

/* ---- orbit camera, perspective projection (z-up) — pulsar.html, unchanged (v3 is in the utilities) ---- */
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  /* the corner: an x tick at the left edge and a y tick at the bottom edge put their labels on each other
     (loop_quantum_gravity's Known-bad); the y tick gives way */
  const Xof=t=>b.x+b.w*(t-xlo)/(xhi-xlo||1), Yof=t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1);
  if(xt.some(t=>Math.abs(Xof(t)-b.x)<16)) yt=yt.filter(t=>Math.abs(Yof(t)-b.y1)>=7);
  o.xticks=xt; o.yticks=yt;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  map and globe helpers                                              *
 * ================================================================== */
/* a plate-carree map in box b centred on lon0: equal aspect (2:1), fitted to the box */
/* the box a map may fill: the stage's picture, less room for the key under the map when no plots follow (with plots

function mapBox(Lay,room){ const b=Lay.main; return Lay.bottom.length?b:box(b.x,b.y,b.w,b.h-room); }
function mapFrame(b,lon0){
  const w=Math.min(b.w,2*b.h), h=w/2, x=b.x+(b.w-w)/2, y=b.y+(b.h-h)/2;
  const X=lon=>x+(((lon-lon0+180)%360+360)%360)/360*w, Y=lat=>y+(90-lat)/180*h;
  return {x,y,w,h,x1:x+w,y1:y+h,lon0,X,Y,

/* a polyline in lon/lat drawn on the map, broken where it crosses the map's edge (|dlon| > 180 after centring) */
function mapPath(ctx,F,pts,col,lw,dash,rec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const X=F.X(p[0]), Y=F.Y(p[1]);
    if(prev&&Math.abs(X-prev[0])<F.w/2){ ctx.lineTo(X,Y); if(rec) POLY_SEGS.push(prev[0],prev[1],X,Y); n++; } else ctx.moveTo(X,Y);

function mapCoast(ctx,F,col,lw){ for(const c of COAST){ const pts=[]; for(let i=0;i<c.length;i+=2) pts.push([c[i],c[i+1]]); mapPath(ctx,F,pts,col,lw||0.7); } }
function mapGraticule(ctx,F){
  ctx.strokeStyle='#151b2c'; ctx.lineWidth=0.7;

  for(let lo=-180;lo<180;lo+=30){ const X=F.X(lo); ctx.beginPath(); ctx.moveTo(X,F.y); ctx.lineTo(X,F.y1); ctx.stroke(); }

/* a small circle of angular radius rho about the unit vector c, as lon/lat points */
function smallCircle(c,rho,n){
  const a=Math.abs(c[2])<0.9?[0,0,1]:[1,0,0], u=v3.norm(v3.cross(c,a)), w=v3.cross(c,u), out=[];
  for(let i=0;i<=n;i++){ const t=2*PI*i/n, p=v3.add(v3.mul(c,Math.cos(rho)),v3.add(v3.mul(u,Math.sin(rho)*Math.cos(t)),v3.mul(w,Math.sin(rho)*Math.sin(t))));

/* rotate the unit vector p about the unit axis k by angle a (Rodrigues) */
function rotAbout(p,k,a){ const c=Math.cos(a), s=Math.sin(a), d=v3.dot(k,p);
  return v3.add(v3.add(v3.mul(p,c),v3.mul(v3.cross(k,p),s)),v3.mul(k,d*(1-c))); }

/* ================================================================== *
 *  the Earth: a globe with an octant cut out, facing the camera       *
 * ================================================================== */
function earthCaption(M){
  const E=M.E, inner=ST.eCut==='inner';
  return {full:'The Earth to scale, with the octant that faces you cut away '+(inner?'down to the inner core (1221.5 km), so the liquid outer core is open too':'down to the core (3480 km)')+
    '. The two upright faces show PREM’s layers'+(ST.eFaces!=='conv'?' coloured by '+presetName(FACE_LIST,ST.eFaces):
      ST.mGeom==='ann'?'; the level face shows a quarter of the mantle view’s 2-D convection model'+(ST.eConv?' running':'')+' (a model, not the Earth’s actual mantle)':
      '; the level face shows them too (the mantle view has its model on Blankenbach’s box, which has no place in a sphere)')+'. '+
    'The white arcs are PREM’s boundaries at 400 and 670 km'+(inner?', the core and the inner core':' and the core')+'. '+
    (!inner&&ST.eBr?'The core’s surface carries IGRF’s radial field continued down to 3480 km for '+fmt(E.year,0)+' (orange out of the core, cyan into it). ':'')+
    (ST.eLines?'The lines are the field of IGRF’s first eight degrees, traced from the surface along the field (the widest loop reaches '+fmt(E.lines.rmax,1)+' Earth radii) and, inside the cut, down to the core. ':'')+
    'The surface shows Bird’s 52 plates and Natural Earth’s coasts. Drag to turn it.',
    short:'PREM’s layers to scale, the octant facing you cut away; IGRF field lines. Drag to turn.'};
}
function drawEarth(ctx,W,H,M){
  const E=M.E, cap=earthCaption(M), Lay=stageLayout(ctx,W,H,cap.full,cap.short,0,0,0);
  const b=Lay.main;
  HIT.push({kind:'cam',b});
  lab(ctx,W,H,b.x,b.y-8,'the Earth inside: '+presetName(CUT_LIST,ST.eCut),'#aeb6c6','italic 13px Georgia, serif','left','bottom');
  /* a long lens (17 degrees: the loops in front are not blown up) at the distance that fits the globe and its lines */
  const fov=EARTH_FOV, fr=(b.h/2)/Math.tan(fov/2), pxR=earthFit(b,ST.camPhi,ST.eLines?E.lines:[],E.year);

    if(inCut(mid)) continue;
    if(v3.dot(mid,v3.sub(eye,mid))<=0) continue;
    const P=(a,l)=>[Math.cos(l)*Math.cos(a),Math.cos(l)*Math.sin(a),Math.sin(l)];
    let lon=(am-spin)*180/PI; lon=((lon+180)%360+360)%360-180; const lat=lm*180/PI;
    let col='#1d3a5c';
    if(ST.ePlates){ const gi=clamp(Math.floor(90-lat),0,179), gj=clamp(Math.floor(lon+180),0,359); col=PLATE_COL[plateGrid(gi,gj)]; }
    const sh=0.45+0.55*Math.max(0,v3.dot(mid,light));

  const nLevel=[0,0,1], nA=[-Math.sin(ac),Math.cos(ac),0], nB=[Math.sin(ac+PI/2),-Math.cos(ac+PI/2),0];
  const rInK=rIn*R_E, qv=ST.eFaces==='conv'?null:ST.eFaces;
  const qOf=r=>qv==='rho'?premRho(r):qv==='vp'?premVp(r):qv==='vs'?premVs(r):qv==='P'?premP(r):premG(r);
  const qRange=qv?earthFaceRange(qv,rInK):null;
  const layerCol=r=>{ for(const s of PREM_SHELLS) if(r<=s.r1) return s.col; return PREM_SHELLS[PREM_SHELLS.length-1].col; };
  const upCol=r=>qv?seqCol((qOf(r)-qRange[0])/(qRange[1]-qRange[0])):layerCol(r);
  /* the bands: uniform, with every layer boundary an edge, so a discontinuity stays sharp */
  const edges=earthBands(rInK);

  const NTU=12;
  for(let k=0;k+1<edges.length;k++){ const r0=edges[k]/R_E, r1=edges[k+1]/R_E, rm=(edges[k]+edges[k+1])/2, fc=upCol(rm);
    for(let m=0;m<NTU;m++){ const t0=PI/2*m/NTU, t1=PI/2*(m+1)/NTU;
      quad([U(ac)(r0,t0),U(ac)(r1,t0),U(ac)(r1,t1),U(ac)(r0,t1)],shade(fc,0.8),nA);
      quad([U(ac+PI/2)(r0,t0),U(ac+PI/2)(r1,t0),U(ac+PI/2)(r1,t1),U(ac+PI/2)(r0,t1)],shade(fc,0.72),nB); } }
  const L=(r,t)=>[r*Math.cos(ac+t),r*Math.sin(ac+t),0];
  if(!qv&&E.conv&&E.conv.geom==='ann'){
    /* the model's own rows (between its Chebyshev nodes; the thin boundary layers need them) and 48 columns */
    const K=E.conv, rb=j=>j<=0?R_E:j>=K.Nz?R_CMB:R_CMB+(R_E-R_CMB)*(K.z[j-1]+K.z[j])/2, NTL=48;
    for(let j=0;j<K.Nz;j++){ const r0=rb(j+1)/R_E, r1=rb(j)/R_E, rm=R_CMB+(R_E-R_CMB)*K.z[j];
      for(let m=0;m<NTL;m++){ const t0=PI/2*m/NTL, t1=PI/2*(m+1)/NTL;
        quad([L(r0,t0),L(r1,t0),L(r1,t1),L(r0,t1)],shade(convColourAt(K,rm,(t0+t1)/2),0.95),nLevel); } }
    if(rInK<R_CMB) for(let k=0;k<6;k++){ const r0=rInK/R_E+(R_CMB-rInK)/R_E*k/6, r1=rInK/R_E+(R_CMB-rInK)/R_E*(k+1)/6;
      for(let m=0;m<12;m++){ const t0=PI/2*m/12, t1=PI/2*(m+1)/12; quad([L(r0,t0),L(r1,t0),L(r1,t1),L(r0,t1)],shade(PREM_SHELLS[1].col,0.95),nLevel); } }
  } else {
    for(let k=0;k+1<edges.length;k++){ const r0=edges[k]/R_E, r1=edges[k+1]/R_E, fc=upCol((edges[k]+edges[k+1])/2);
      for(let m=0;m<NTU;m++){ const t0=PI/2*m/NTU, t1=PI/2*(m+1)/NTU; quad([L(r0,t0),L(r1,t0),L(r1,t1),L(r0,t1)],shade(fc,0.95),nLevel); } }
  }

    for(const f of [t=>L(r,t),t=>U(ac)(r,t),t=>U(ac+PI/2)(r,t)]){ const pts=[]; for(let i=0;i<=n;i++) pts.push(f(PI/2*i/n));
      const q=pts.map(p=>C.P(p)); if(q.some(v=>!v)) continue; let z=0; for(const v of q) z+=v.z; items.push({z:z/q.length-0.01,q,stroke:'rgba(235,240,250,0.55)',lw:0.8}); } }

  const NS=18;

    const P=(a,l)=>[rIn*Math.cos(l)*Math.cos(a),rIn*Math.cos(l)*Math.sin(a),rIn*Math.sin(l)];
    let col=ST.eCut==='inner'?'#f2c46a':'#e8843a';
    if(ST.eCut==='core'&&E.brGrid) col=earthBrCol(E.brGrid,(am-spin)*180/PI,lm*180/PI);
    const nrm=[Math.cos(lm)*Math.cos(am),Math.cos(lm)*Math.sin(am),Math.sin(lm)];
    quad([P(a0,l0),P(a1,l0),P(a1,l1),P(a0,l1)],shade(col,0.55+0.45*Math.max(0,v3.dot(nrm,light))),nrm);
  }
  /* field lines: outside the globe, and inside only in the cut; chunks of segments in the painter's list, fainter
     behind the plane through the centre that faces you */

  if(ST.eLines) for(const line of E.lines){
    let chunk=[];
    const flush=()=>{ if(chunk.length>1){ const q=chunk.map(p=>C.P(p)); if(q.every(v=>v)){ let z=0; for(const v of q) z+=v.z; z/=q.length;

      const flush=()=>{ if(chunk.length>1){ const q=chunk.map(p=>C.P(p)); if(q.every(v=>v)){ let z=0; for(const v of q) z+=v.z; items.push({z:z/q.length-0.02,q,stroke:col,lw}); } } chunk=[]; };
      for(const [lon,lat] of pts){ const a=lon*PI/180+spin, l=lat*PI/180, p=[Math.cos(l)*Math.cos(a),Math.cos(l)*Math.sin(a),Math.sin(l)];

  for(const it of items){
    ctx.beginPath(); ctx.moveTo(it.q[0].x,it.q[0].y); for(let i=1;i<it.q.length;i++) ctx.lineTo(it.q[i].x,it.q[i].y);
    if(it.fill){ ctx.closePath(); ctx.fillStyle=it.fill; ctx.fill(); ctx.strokeStyle=it.fill; ctx.lineWidth=0.6; ctx.stroke(); }
    else { ctx.strokeStyle=it.stroke; ctx.lineWidth=it.lw; ctx.stroke(); }

  const np=C.P([0,0,1.08]); if(np) lab(ctx,W,H,np.x,np.y,'N','#8b93a6','10.5px -apple-system, sans-serif','center','bottom');

/* the Earth view's lens, and a box camera with it (boxCamera's is 45 degrees) */
const EARTH_FOV=0.3;
function boxCameraFov(b,theta,phi,dist,target,fov){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h; cam.fov=fov;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* the globe's radius in pixels that fits it and its field lines in the box at this elevation whatever the azimuth

   turns).  Every third point of the lines outside the globe (as far as they are traced), and the globe's outline */
function earthFit(b,phi,lines,year){
  return memo('efit',[b.w.toFixed(0),b.h.toFixed(0),phi.toFixed(3),lines.length,year.toFixed(2)].join('|'),()=>{
    const pts=[];
    for(const L of lines) for(let i=0;i<L.length;i+=3){ const x=L[i], r=v3.len(x)/R_E; if(r>=1&&r<3.0) pts.push([x[0]/R_E,x[1]/R_E,x[2]/R_E]); }
    for(let i=0;i<24;i++) for(let j=-6;j<=6;j++){ const a=2*PI*i/24, l=PI/2*j/6; pts.push([Math.cos(l)*Math.cos(a),Math.cos(l)*Math.sin(a),Math.sin(l)]); }

    for(let it=0;it<6;it++){ const dist=Math.sqrt(1+Math.pow(f/pxR,2)); let ex=0, ey=0;
      for(let k=0;k<16;k++){ const cam=makeCamera(2*PI*k/16,phi,dist,[0,0,0]); cam.W=b.w; cam.H=b.h; cam.fov=EARTH_FOV; const B=camBasis(cam);
        for(const p of pts){ const q=project(cam,B,p); if(!q) continue; ex=Math.max(ex,Math.abs(q.x-b.w/2)); ey=Math.max(ey,Math.abs(q.y-b.h/2)); } }

/* the colour of the core's surface at a longitude and latitude (degrees): the field view's B_r convention */

/* the range of a PREM quantity over the radii a face shows: from rIn km (the side above it) to the ocean floor (PREM's

/* the key to the faces' colours, at the stage's lower left: the model's temperature, or the PREM quantity's range */

/* does a box [x0, y0, x1, y1] reach into the globe's disc on the screen? (the keys step aside for the globe: on a small

function boxOnGlobe(bb,g){ if(!g) return false; const dx=Math.max(bb[0]-g.x,0,g.x-bb[2]), dy=Math.max(bb[1]-g.y,0,g.y-bb[3]); return dx*dx+dy*dy<g.r*g.r; }
function earthKey(ctx,W,H,b,qv,qRange,conv,rIn,globe){

    if(ST.eCut==='inner') items.push([PREM_SHELLS[0].col,'inner core']);

  lab(ctx,W,H,x,y+11,qv?F[2](qRange[0]):'surface','#8b93a6','10px -apple-system, sans-serif','left','top');
  lab(ctx,W,H,x+w,y+11,qv?F[2](qRange[1]):(conv.bottom==='F'?'hottest':'core'),'#8b93a6','10px -apple-system, sans-serif','right','top');

/* the bands of the faces: 24 uniform, with every PREM boundary between rIn and the surface added as an edge */
function earthBands(rIn){ return memo('ebands',''+rIn,()=>{ const s=new Set();

/* the colour of the convection model at radius r (km) and angle theta along its slice */
function convColourAt(C,r,theta){

/* the model's temperature grid, recomputed at most once per step */

/* ================================================================== *

function drawPlates(ctx,W,H,M){

  const byCls={}; for(const c of 'RTCSrtc') byCls[c]=[];

    for(const s of byCls[c]){ const X0=F.X(PB_V[2*s.a]), Y0=F.Y(PB_V[2*s.a+1]), X1=F.X(PB_V[2*s.b]), Y1=F.Y(PB_V[2*s.b+1]);
      if(Math.abs(X1-X0)>F.w/2) continue; ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1); }

    ctx.moveTo(mx-2.2*ux,my-2.2*uy); ctx.lineTo(mx+4*nx,my+4*ny); ctx.lineTo(mx+2.2*ux,my+2.2*uy); ctx.closePath(); }
  ctx.fillStyle=CLS_COL.S; ctx.fill();

  if(P.sel){ const pole=P.sel.pole, c=unitLL(pole[1],pole[0]);
    for(const rho of [15,30,45,60,75]) mapPath(ctx,F,smallCircle(c,rho*PI/180,120),'rgba(205,53,196,0.55)',0.9,[4,3]);
    const X=F.X(pole[1]), Y=F.Y(pole[0]); star(ctx,X,Y,6,COL.live);
    const a=v3.mul(c,-1), X2=F.X(llOf(a)[0]), Y2=F.Y(llOf(a)[1]); star(ctx,X2,Y2,4,'rgba(205,53,196,0.6)');
    }

      const v=plateVel(k,lo,la,P.frame), X=F.X(lo), Y=F.Y(la), L=Math.hypot(v[0],v[1])*sc;

  /* the pole's name last, over the arrows and the dots */

  /* the key: the seven classes and the arrow scale */
  keyRowCls(ctx,F.x,F.y1+8,F.w-ARROW_KEY-80);
  if(ST.pArrows){ arrowPx(ctx,F.x1-ARROW_KEY-2,F.y1+14,F.x1-2,F.y1+14,'#eef2f8',1.2);
    lab(ctx,W,H,F.x1-ARROW_KEY-8,F.y1+14,'100 mm/a','#9aa2b4','10.5px -apple-system, sans-serif','right','middle'); }
  if(Lay.bottom.length){ plotClassTotals(ctx,W,H,Lay.bottom[0],P); if(Lay.bottom[1]) plotBoundaryProfile(ctx,W,H,Lay.bottom[1],P); }

}
function star(ctx,x,y,r,col){ ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-PI/2+i*PI/5, rr=i%2?r*0.45:r; const X=x+rr*Math.cos(a), Y=y+rr*Math.sin(a); if(i) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); }
  ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
function plateTracers(){ return memo('ptrace','1',()=>{ const out=[]; const rnd=mulberry32(97531);
  for(let la=-72;la<=72;la+=6) for(let lo=-180;lo<180;lo+=6/Math.max(0.3,Math.cos(la*PI/180))){
    const gi=clamp(Math.floor(90-la),0,179), gj=clamp(Math.floor(lo+180),0,359);
    out.push({p:unitLL(lo,la),k:plateGrid(gi,gj),off:20*rnd()}); }
  return out; }); }
/* the runs of one plate along each row of the 1-degree grid: [row, first column, one past the last] */
function plateRuns(){ return memo('pruns','1',()=>{ const runs=PB_PLATES.map(()=>[]);
  for(let i=0;i<180;i++){ let j0=0, k0=plateGrid(i,0);
    for(let j=1;j<=360;j++){ const k=j<360?plateGrid(i,j):-1; if(k!==k0){ runs[k0].push([i,j0,j]); j0=j; k0=k; } } }
  return runs; }); }
function keyRowCls(ctx,x,y,w){

  for(const c of 'RTSCcrt'){ const t=PB_CLS_ABBR[c]; const tw=ctx.measureText(t).width;
    if(X+tw+26>x+w){ KEY_DROPS++; continue; }
    ctx.fillStyle=CLS_COL[c]; ctx.fillRect(X,y+4,14,3); ctx.fillStyle='#9aa2b4'; ctx.fillText(t,X+18,y+6); X+=tw+32; }
}
/* the seven classes: the model's length by class, Bird's Table 3 as a tick */
const T3_LEN={R:67338,T:47783,S:51310,C:17449,c:23003,r:27472,t:26132};
function plotClassTotals(ctx,W,H,b,P){

/* the chosen plate's boundary, walked round: the divergent part of each step's relative velocity (+ opening, - closing) */

function boundaryRows(k){ return memo('brows',''+k,()=>{ const rows=[]; let s0=0;
  PB_STEPS.forEach((s,i)=>{ if(s.L!==k&&s.R!==k) return; const m=stepModel(i); rows.push([s0,s0+m.len,m.div,s.cls]); s0+=m.len; });
  return rows; }); }
function plotBoundaryProfile(ctx,W,H,b,P){
  if(!P.sel){ caption(ctx,b.x,b.y+b.h/2,'Press a plate to walk its boundary.',b.w,'#767e92'); return; }
  const k=P.sel.k, rows=boundaryRows(k), s0=rows.length?rows[rows.length-1][1]:0;

    xlab:'along it, thousand km',yfmt:v=>fmt(v,0),ny:4,nx:5,xfmt:v=>fmt(v,0)});

/* ================================================================== *
 *  the mantle: the convection model running                           *
 * ================================================================== */
function mantleCaption(M){
  const C=M.C, o=C.o;
  if(o.geom==='box') return {full:'Blankenbach et al.’s benchmark box: rock heated from below and cooled from above, with free-slip insulating side walls, at Ra = '+sigf(o.Ra,2)+
    '. The same solver as the Earth’s slice in Cartesian form; beside the live Nusselt number and rms speed stand the benchmark’s own (Table 9). At this grid the box reads '+pct(C.nu[0]/C.bench.Nu-1,2)+
    ' from Table 9 in Nu; on finer grids the same solver reaches its printed digits (checked in Python).',
    short:'Blankenbach’s benchmark box, the same solver; its Table 9 beside the live numbers.'};
  return {full:'A slice through the mantle as a 2-D ring with the Earth’s radius ratio, heated '+presetName(HEAT_LIST,ST.mHeat).toLowerCase()+
    ' at Ra = '+sigf(o.Ra,2)+' (the Earth’s is about 10⁷, beyond this grid). '+(o.bottom==='F'?'With no heat from the core there are no plumes: cold rock (blue) sinks in sheets from the surface through rock heated where it is (yellow the hottest); ':'Hot rock (yellow) rises in plumes from the core, cold rock (blue) sinks in sheets from the surface; ')+
    'the rock is solid and creeps at centimetres a year. Speeds and times are scaled with the mantle’s depth, 2891 km, and κ = 10⁻⁶ m²/s: here '+fmt(M.C.surfcm,2)+' cm a year at the surface, '+
    fmt(M.C.stepMyr,2)+' Myr a step. Constant viscosity, no plates, no melting: the model shows why the mantle turns over, not how the Earth’s does. The core is drawn, not modelled.',
    short:'The mantle as a 2-D ring, hot plumes rising and cold sheets sinking; a model, not the Earth.'};
}
function drawMantle(ctx,W,H,M){
  const C=M.C.C, o=M.C.o, cap=mantleCaption(M), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.30,nbNarrow(H));
  const b=Lay.main;
  lab(ctx,W,H,b.x,b.y-8,o.geom==='box'?'the benchmark box, case '+ST.mBench:'the mantle, a 2-D slice','#aeb6c6','italic 13px Georgia, serif','left','bottom');
  const g=convGrid(C), tmax=C.bottom==='F'?convTmax(C):1;
  const Q=48, qcol=f=>tempCol(Math.round(clamp(f,0,1)*Q)/Q);
  if(o.geom==='ann'){
    const Rd=Math.min(b.w,b.h)/2*0.96, cx=b.x+b.w/2, cy=b.y+b.h/2, ro=C.ro;
    HIT.push({kind:'mfield',b});

    const rb=j=>j<=0?C.ro:j>=C.Nz?C.ri:(C.r[j-1]+C.r[j])/2;
    const dth=2*PI/C.Nx;
    for(let j=0;j<C.Nz;j++){ const r0=rb(j+1)/ro*Rd, r1=rb(j)/ro*Rd;
      let i=0;
      while(i<C.Nx){ const c=qcol(g[j*C.Nx+i]/tmax); let e=i+1; while(e<C.Nx&&qcol(g[j*C.Nx+e]/tmax)===c) e++;
        const a0=(i-0.5)*dth, a1=(e-0.5)*dth, n=Math.max(1,Math.ceil((a1-a0)/0.05));
        ctx.beginPath();
        for(let s=0;s<=n;s++){ const a=a0+(a1-a0)*s/n; ctx.lineTo(cx+r1*Math.cos(a),cy-r1*Math.sin(a)); }
        for(let s=n;s>=0;s--){ const a=a0+(a1-a0)*s/n; ctx.lineTo(cx+r0*Math.cos(a),cy-r0*Math.sin(a)); }
        ctx.closePath(); ctx.fillStyle=c; ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=0.5; ctx.stroke();
        i=e; } }
    /* the core, drawn (not modelled): to scale inside the ring */
    const rc=C.ri/ro*Rd, ric=rc*R_ICB/R_CMB;
    dot(ctx,cx,cy,rc,'#5a2a14'); dot(ctx,cx,cy,ric,'#8a6a2a');
    lab(ctx,W,H,cx,cy-ric-8,'the core, not modelled','#e9c9a0','10.5px -apple-system, sans-serif','center','bottom',PLATE);
    ctx.beginPath(); ctx.arc(cx,cy,Rd,0,TAU); ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1; ctx.stroke();
    if(ST.mArrows){ const f=C.fields(), vs=Math.max(1e-9,M.C.vrms), L=0.07*Rd;
      for(let j=2;j<C.Nz-2;j+=3) for(let i=0;i<C.Nx;i+=Math.max(1,Math.round(C.Nx/64))){ const q=j*C.Nx+i, a=i*dth, r=C.r[j]/ro*Rd;
        const ut=f.u[q], ur=f.w[q], ex=-Math.sin(a), ey=-Math.cos(a), rx=Math.cos(a), ry=-Math.sin(a);
        const X=cx+r*Math.cos(a), Y=cy-r*Math.sin(a), sx=(ut*ex+ur*rx)/vs*L, sy=(ut*ey+ur*ry)/vs*L;
        if(Math.hypot(sx,sy)>2) arrowPx(ctx,X,Y,X+sx,Y+sy,'rgba(240,244,250,0.85)',1); } }
    lab(ctx,W,H,cx+Rd*0.72,cy-Rd*0.72-10,'the surface','#8b93a6','10.5px -apple-system, sans-serif','left','bottom');
  } else {

      let i=0; while(i<=half){ const c=qcol(g[j*C.Nx+i]); let e=i+1; while(e<=half&&qcol(g[j*C.Nx+e])===c) e++;

        ctx.fillStyle=c; ctx.fillRect(Xa,Y1,Xb-Xa+0.5,Y0-Y1+0.5); i=e; } }
    frame(ctx,box(x0,y0,s,s),'#8b93a6');
    if(ST.mArrows){ const f=C.fields(), vs=Math.max(1e-9,M.C.vrms), L=0.06*s;
      for(let j=2;j<C.Nz-2;j+=3) for(let i=0;i<=half;i+=Math.max(1,Math.round(half/16))){ const q=j*C.Nx+i, X=x0+i/half*s, Y=y0+(1-C.z[j])*s;
        const sx=f.u[q]/vs*L, sy=-f.w[q]/vs*L; if(Math.hypot(sx,sy)>2) arrowPx(ctx,X,Y,X+sx,Y+sy,'rgba(240,244,250,0.85)',1); } }
  }
  if(Lay.bottom.length){ plotMantleHist(ctx,W,H,Lay.bottom[0],M); if(Lay.bottom[1]) plotMantleProfile(ctx,W,H,Lay.bottom[1],M); }
  drawCaption(ctx,Lay);

function drawCore(ctx,W,H,M){
  const K=M.K, cap=coreCaption(M,isNarrow(W)?nbNarrow(H):3), Lay=stageLayout(ctx,W,H,cap.full,cap.short,3,0.30,nbNarrow(H));
  const b=Lay.main, split=Math.min(b.h*0.95,b.w*0.34);
  /* the section: a half disk, the centre on its left edge */

  for(let k=PREM_SHELLS.length-1;k>=0;k--){ const s=PREM_SHELLS[k], r=Rd*s.r1/R_E;
    ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.arc(cx,cy,r,-PI/2,PI/2); ctx.closePath(); ctx.fillStyle=shade(s.col,0.8); ctx.fill(); }
  const rc=Rd*(R_E-K.at.d)/R_E; ctx.beginPath(); ctx.arc(cx,cy,Math.max(0.5,rc),-PI/2,PI/2); ctx.strokeStyle=COL.live; ctx.lineWidth=1.6; ctx.stroke();
  for(const s of PREM_SHELLS){ if(s.name==='crust'||s.name==='transition zone'||s.name==='inner core') continue;
    const rm=Rd*(s.r0+s.r1)/2/R_E; lab(ctx,W,H,cx+rm*0.72,cy-rm*0.69,s.name,'#f0f2f6','10.5px -apple-system, sans-serif','center','middle',PLATE); }
  /* the inner core is too small to hold its name: a leader from it, below the equator */
  { const ri=Rd*R_ICB/R_E, a=-0.7, x0=cx+0.55*ri*Math.cos(a), y0=cy-0.55*ri*Math.sin(a), x1=cx+(ri+16)*Math.cos(a), y1=cy-(ri+16)*Math.sin(a);
    ctx.strokeStyle='#f0f2f6'; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    lab(ctx,W,H,x1+3,y1+2,'inner core','#f0f2f6','10.5px -apple-system, sans-serif','left','top',PLATE); }
  HIT.push({kind:'csec',b:box(cx,cy-Rd,Rd,2*Rd),cx,cy,Rd});
  /* the profiles */
  const pb=box(b.x+Rd+70,b.y+4,b.x1-(b.x+Rd+70),b.h-30);
  const P=K.prof, ymax=14;
  axesT(ctx,pb,0,R_E,0,ymax,{title:titleFor(pb,'density and seismic speeds with depth (dots: TauP’s tabulation of the same PREM)','density and speeds'),
    xlab:'depth, km',ny:7,nx:6,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0)});
  HIT.push({kind:'cplot',b:pb,x0:0,x1:R_E});
  const seg=(q)=>{ const xs=[], ys=[]; let prevR=null;
    for(const p of P){ if(prevR!==null&&p.r===prevR){ xs.push(NaN); ys.push(NaN); } xs.push(p.d); ys.push(p[q]); prevR=p.r; }
    return [xs,ys]; };
  for(const [q,col] of [['rho',COL.pos],['vp',COL.struct],['vs',COL.ref]]){ const [xs,ys]=seg(q); polyline(ctx,pb,xs,ys,0,R_E,0,ymax,col,1.8); }
  ctx.fillStyle='rgba(235,240,250,0.8)';
  ctx.beginPath(); for(const [d,vp,vs,rho] of PREM_TAUP){ for(const v of [vp,vs,rho]){ const X=pb.x+pb.w*d/R_E, Y=pb.y1-pb.h*v/ymax; ctx.moveTo(X+1.4,Y); ctx.arc(X,Y,1.4,0,TAU); } } ctx.fill();
  for(const d of [R_E-5701,R_E-R_CMB,R_E-R_ICB]){ const X=pb.x+pb.w*d/R_E; ctx.strokeStyle='#39415a'; ctx.setLineDash([3,3]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X,pb.y); ctx.lineTo(X,pb.y1); ctx.stroke(); ctx.setLineDash([]); }
  const Xc=pb.x+pb.w*K.at.d/R_E; ctx.strokeStyle=COL.live; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(Xc,pb.y); ctx.lineTo(Xc,pb.y1); ctx.stroke(); MARKS.push({X:Xc,y0:pb.y,y1:pb.y1,seq:++DRAW_SEQ});
  lab(ctx,W,H,pb.x+pb.w*(R_E-(R_ICB+R_CMB)/2)/R_E,pb.y+14,'liquid: no S','#f0f2f6','10.5px -apple-system, sans-serif','center','middle',PLATE);
  /* each curve named where it ends, at the centre, in its own colour (the units with the names) */
  const c0=P[0];
  for(const [v,t,col] of [[c0.rho,'density, g/cm³',COL.pos],[c0.vp,'P speed, km/s',COL.struct],[c0.vs,'S speed, km/s',COL.ref]])
    lab(ctx,W,H,pb.x1-6,Math.max(pb.y+9,pb.y1-pb.h*v/ymax-10),t,col,'10.5px -apple-system, sans-serif','right','middle',PLATE);
  const Bt=Lay.bottom;
  if(Bt[0]) plotCoreQ(ctx,W,H,Bt[0],K,'g',11,'gravity, m/s²','g, m/s²',v=>fmt(v,0),null);
  if(Bt[1]) plotCoreQ(ctx,W,H,Bt[1],K,'P',380,'pressure, GPa (dots: PREM’s own table)','P, GPa',v=>fmt(v,0),PREM_PTAB);
  if(Bt[2]) plotCoreQ(ctx,W,H,Bt[2],K,'eta',2.2,'η, the self-compression test (1: well mixed, squeezed by its own weight)','η, self-compression',v=>fmt(v,1),null);
  drawCaption(ctx,Lay);
}
function plotCoreQ(ctx,W,H,b,K,q,ymax,title,short,yf,dots){
  axesT(ctx,b,0,R_E,0,ymax,{title:titleFor(b,title,short),xlab:'depth, km',ny:3,nx:3,xfmt:v=>fmt(v,0),yfmt:yf});
  HIT.push({kind:'cplot',b,x0:0,x1:R_E});
  const xs=[], ys=[]; let prevR=null;
  for(const p of K.prof){ if(prevR!==null&&p.r===prevR&&q==='eta'){ xs.push(NaN); ys.push(NaN); } xs.push(p.d); ys.push(p[q]); prevR=p.r; }
  if(q==='eta') polyline(ctx,b,[0,R_E],[1,1],0,R_E,0,ymax,COL.ref,1,[4,3]);
  polyline(ctx,b,xs,ys,0,R_E,0,ymax,COL.pos,1.6);
  if(dots){ ctx.fillStyle='rgba(235,240,250,0.8)'; ctx.beginPath();
    for(const [d,Pa] of dots){ const X=b.x+b.w*d/R_E, Y=b.y1-b.h*Pa/1e9/ymax; ctx.moveTo(X+1.3,Y); ctx.arc(X,Y,1.3,0,TAU); } ctx.fill(); }
  const Xc=b.x+b.w*K.at.d/R_E; ctx.strokeStyle=COL.live; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(Xc,b.y); ctx.lineTo(Xc,b.y1); ctx.stroke(); MARKS.push({X:Xc,y0:b.y,y1:b.y1,seq:++DRAW_SEQ});
