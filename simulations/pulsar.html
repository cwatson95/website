<title>Pulsar — the lighthouse, the ledger, and the test of general relativity</title>
<!--
  ===================================================================
  PULSAR
  the rotating magnetised neutron star, its beam, its ledger,
  and the binary that weighed general relativity
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, shock_flow.html,
  turbojet.html, wind_tunnel.html and diffraction.html: one flat file, no build
  step, no network, works opened straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS COMPUTES
  ------------------------------------------------------------------
  Six views, and each is a different way of asking what a pulsar is:

    the star      3-D: the crust, the inclined magnetic dipole, the closed and
                  open field lines, the light cylinder, the polar cap, and the
                  emission cone sweeping past a line of sight.
    the beam      what a telescope actually records — the pulse profile as the
                  cone crosses the sight line, and beneath it the polarisation
                  position angle, whose S-shaped swing is where the geometry is
                  actually measured from.
    the diagram   P against Pdot for 23 real pulsars, with lines of constant
                  field and constant characteristic age, and the death line.
    spin-down     the ledger: rotational energy in, magnetic-dipole radiation
                  out, and the age that follows.
    dispersion    the cold-plasma sweep: why a pulse arrives later at low
                  frequency, and how much of the Galaxy is in the way.
    the binary    PSR B1913+16, and the orbital decay that the quadrupole
                  formula predicts to a fraction of a percent.

  ------------------------------------------------------------------
  WHAT IS MEASURED — and it is retrieved, not remembered
  ------------------------------------------------------------------
  The 23 pulsars in this file are stored as the ATNF Pulsar Catalogue's own
  F0 and F1 (spin frequency and its derivative) and DM, transcribed verbatim
  from a psrcat query, and P and Pdot are DERIVED IN THE CODE as

        P = 1/F0 ,      Pdot = -F1/F0^2 .

  That arrangement is deliberate.  The repo's verification policy is that "an
  assertion against a table quoted from memory is worthless", and pulsar
  parameters carry ten to sixteen significant figures — exactly the kind of
  number that is easy to half-remember and impossible to spot-check by eye.
  Storing the catalogue's own primary quantities and deriving the rest means
  the only things typed by hand are the ones the catalogue actually prints.

  Everything downstream — surface field, characteristic age, spin-down
  luminosity, light-cylinder radius, polar-cap size — is COMPUTED, never
  stored, so it cannot drift away from the input.

  Two orbital systems carry a few more measured numbers, each cited in place:
  PSR B1913+16 (Pb, e from psrcat; masses and the observed/predicted ratio
  0.997 +/- 0.002 from its Wikipedia summary) and PSR J0737-3039A.

  NOT MEASURED, and labelled as such on the canvas: the emission geometry.
  The inclination alpha, the sight line zeta and the beam half-angle rho are
  free parameters here.  For a real pulsar they are inferred — from the pulse
  width and the position-angle swing, by exactly the two relations this file
  draws — and the inference is degenerate enough that published values for the
  same object disagree.  The sim will happily let you set them; it does not
  claim they are anybody's measurement.

  ------------------------------------------------------------------
  THE PHYSICS, AND WHAT IS EXACT IN IT
  ------------------------------------------------------------------
  * Spin-down.  A rotating magnetic dipole in vacuum radiates
    Edot = (mu0 m^2 Omega^4 sin^2 alpha)/(6 pi c^3).  Equating that to the loss
    of rotational energy -I Omega Omegadot = 4 pi^2 I Pdot / P^3 and writing
    m = B R^3 gives the standard field estimate.  With I = 10^45 g cm^2 and
    R = 10 km this file's own derivation returns

        B = 3.199608e19 sqrt(P Pdot) gauss

    which is the "3.2e19" of every textbook, recovered rather than copied.

  * Age.  With nudot = -K nu^n the integration is exact:
        t = P/((n-1) Pdot) * [ 1 - (P0/P)^(n-1) ],
    and the familiar characteristic age P/(2 Pdot) is its n = 3, P0 -> 0 limit
    — which selfTest checks by taking the limit numerically rather than by
    asserting the two formulas separately.

  * Geometry.  The pulse width from a circular beam obeys
        cos rho = cos alpha cos zeta + sin alpha sin zeta cos(W/2),
    equivalently  sin^2(W/4) = [sin^2(rho/2) - sin^2((zeta-alpha)/2)]
                               / (sin alpha sin zeta).
    Both forms are implemented and asserted equal to 1e-13; they are the same
    identity and disagreeing would mean one was mistyped.

  * Polarisation.  The rotating vector model,
        tan(PA - PA0) = sin alpha sin(phi-phi0)
                        / (sin zeta cos alpha - cos zeta sin alpha cos(phi-phi0)),
    whose steepest slope is exactly sin(alpha)/sin(beta) with beta = zeta-alpha.
    That single number is why the swing is worth recording: it is the only
    direct handle on the geometry, and it is asserted here against a numerical
    derivative of the model itself, for beta of both signs.

  * Dispersion.  The cold-plasma group delay,
        Dt = (e^2 / (8 pi^2 eps0 m_e c)) * DM / nu^2,
    evaluated from CODATA constants to 4148.8064 MHz^2 pc^-1 cm^3 s.  The
    canonical constant is 4148.808; the difference is in the seventh digit and
    comes from the constants used, not from the physics.

  * Gravitational radiation.  Peters' quadrupole result for an eccentric
    binary,
        Pbdot = -(192 pi/5) (2 pi G/Pb)^(5/3) (m1 m2)/(m1+m2)^(1/3) c^-5
                 * (1 + 73 e^2/24 + 37 e^4/96) (1 - e^2)^(-7/2).
    For B1913+16 this file returns -2.4029e-12 s/s against the published
    -2.40263e-12; the residue is the mass values, not the formula.

  ------------------------------------------------------------------
  WHAT IS NOT MODELLED
  ------------------------------------------------------------------
  The emission mechanism.  Nothing here explains how a polar cap makes coherent
  radio power; the beam is a geometric cone, which is a description and not a
  theory.  Also absent: the plasma-filled (force-free) magnetosphere, which is
  what actually spins a pulsar down — the vacuum dipole is a scaling law that
  happens to work, and the braking indices measured for real pulsars are 2 to
  3, not the 3 the vacuum model demands.  Glitches, timing noise, nulling,
  mode changing, general-relativistic light bending near the surface, and the
  interstellar scattering that smears the pulse are all left out.

  ------------------------------------------------------------------
  CAMERA / RENDERING
  ------------------------------------------------------------------
  Hand-rolled z-up orbit camera and perspective projection, painter's
  algorithm, canvas 2-D — identical to lattice.html, steam_carnot_cycle.html,
  wind_tunnel.html and diffraction.html.  Mathematica NeonColors (same
  NEON_STOPS table).  The star view is drawn far from scale: a 10 km star and a
  1600 km light cylinder cannot share one, and the compression is printed on
  the canvas rather than hidden.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}


/* ================================================================== *
 *  constants (CODATA 2018 / IAU 2015 nominal)                         *
 * ================================================================== */
const C_LIGHT = 2.99792458e8;          /* m/s, exact                   */
const G_NEWT  = 6.67430e-11;           /* m^3 kg^-1 s^-2               */
const Q_E     = 1.602176634e-19;       /* C, exact                     */
const M_E     = 9.1093837015e-31;      /* kg                           */
const EPS0    = 8.8541878128e-12;      /* F/m                          */
const MU0     = 4e-7*PI;               /* H/m                          */
/* GM_sun is known to ten digits; G and M_sun separately are not, so the
   binary work is done with GM throughout and never touches M_sun alone. */

/* ================================================================== *
 *  spin-down                                                          *
 * ================================================================== */
/* P and Pdot from what the catalogue actually prints */
function periodOf(F0){ return 1/F0; }
function pdotOf(F0,F1){ return (F1===0||F1===null)?0:-F1/(F0*F0); }

/* Rotational kinetic energy and the rate it is being lost. */
function eRot(P,I){ const om=TAU/P; return 0.5*I*om*om; }
function spinDownLum(P,Pdot,I){ return 4*PI*PI*I*Pdot/(P*P*P); }

/* The surface field, DERIVED rather than copied.
 *   vacuum orthogonal rotator:  Edot = mu0 m^2 Omega^4 / (6 pi c^3)
 *   set equal to  -I Omega Omegadot = 4 pi^2 I Pdot / P^3
 *   with m = B R^3 (so B is the field at the magnetic equator of the surface)
 * With I = 1e45 g cm^2 and R = 10 km this returns 3.199608e19 sqrt(P Pdot) G,
 * which is the textbook 3.2e19 — selfTest checks the coefficient rather than
 * trusting that the algebra above was typed correctly. */
function surfaceField(P,Pdot,I,R){
  if(!(Pdot>0)) return 0;
  const Om=TAU/P;
  const m2=(4*PI*PI*I*Pdot/(P*P*P))*(6*PI*C_LIGHT*C_LIGHT*C_LIGHT)/(MU0*Math.pow(Om,4));
  const m=Math.sqrt(m2);
  return MU0*m/(4*PI*R*R*R);            /* tesla */
}
const B_COEFF_GAUSS=(function(){        /* the 3.2e19, computed once */
  return surfaceField(1,1e-15,I_NS,R_NS)*1e4/Math.sqrt(1e-15);
})();

/* Ages.  With nudot = -K nu^n the integration is exact; the characteristic age
   is the n = 3, P0 -> 0 special case and selfTest reaches it by LIMIT, not by
   asserting a second formula. */
function charAge(P,Pdot){ return (Pdot>0)?P/(2*Pdot):Infinity; }
function trueAge(P,Pdot,n,P0){
  if(!(Pdot>0)) return Infinity;
  if(Math.abs(n-1)<1e-9) return Infinity;
  const r=clamp(P0/P,0,1);
  return P/((n-1)*Pdot)*(1-Math.pow(r,n-1));
}
/* the period a pulsar of braking index n had at birth, given its true age */
function birthPeriod(P,Pdot,n,tAge){
  if(!(Pdot>0)||Math.abs(n-1)<1e-9) return NaN;
  const x=1-tAge*(n-1)*Pdot/P;
  return (x<=0)?NaN:P*Math.pow(x,1/(n-1));
}
/* forward evolution: P(t) for constant braking index */
function periodAt(P,Pdot,n,t){
  if(!(Pdot>0)) return P;
  const x=1+(n-1)*Pdot*t/P;
  return (x<=0)?NaN:P*Math.pow(x,1/(n-1));
}

/* Geometry of the magnetosphere. */
function lightCylinder(P){ return C_LIGHT*P/TAU; }
/* the last open field line, r = r_e sin^2(theta), grazes the light cylinder,
   so its footpoint on the surface is at sin^2(theta_pc) = R/R_LC */
function polarCapAngle(P,R){
  const s=Math.sqrt(clamp(R/lightCylinder(P),0,1));
  return Math.asin(s);
}
function polarCapRadius(P,R){ return R*Math.sin(polarCapAngle(P,R)); }
/* Goldreich–Julian number density at the cap (SI: rho = -2 eps0 Omega.B) */
function gjDensity(P,B){ return 2*EPS0*(TAU/P)*B/Q_E; }
/* equatorial surface speed as a fraction of c */
function equatorBeta(P,R){ return TAU*R/(P*C_LIGHT); }

/* The death line, as a curve in the P-Pdot plane.
 * Convention here: the pulsar dies when B/P^2 falls below a threshold
 * (Ruderman & Sutherland-style polar-cap potential).  Substituting
 * B = k sqrt(P Pdot) gives  Pdot_death = (thresh/k)^2 P^3 — a straight line
 * of slope 3 on the log-log diagram.  Several conventions exist and they do
 * not agree; the value used is shown on the canvas. */
const DEATH_BP2=2e11;                   /* gauss s^-2 */
function deathPdot(P,thresh){
  const t=(thresh===undefined)?DEATH_BP2:thresh;
  const r=t/B_COEFF_GAUSS;
  return r*r*P*P*P;
}

/* ================================================================== *
 *  the beam                                                           *
 * ================================================================== */
/* angle between the sight line and the magnetic axis, at rotation phase phi */
function sightAngle(phi,alpha,zeta){
  const c=Math.cos(alpha)*Math.cos(zeta)+Math.sin(alpha)*Math.sin(zeta)*Math.cos(phi);
  return Math.acos(clamp(c,-1,1));
}
/* Pulse width from a circular beam of half-power radius rho.
 *   cos rho = cos a cos z + sin a sin z cos(W/2)
 * Returns the FULL width in radians of rotation phase, or NaN if the beam
 * never reaches the sight line (or never leaves it). */
function pulseWidth(rho,alpha,zeta){
  const den=Math.sin(alpha)*Math.sin(zeta);
  if(Math.abs(den)<1e-12) return NaN;
  const x=(Math.cos(rho)-Math.cos(alpha)*Math.cos(zeta))/den;
  if(x>1) return NaN;                   /* the cone misses entirely */
  if(x<-1) return TAU;                  /* the sight line never leaves it */
  return 2*Math.acos(x);
}
/* the same identity in half-angle form — implemented separately ON PURPOSE,
   so that selfTest comparing the two is a check on the typing, not a tautology */
function pulseWidthHalfAngle(rho,alpha,zeta){
  const sa=Math.sin(alpha), sz=Math.sin(zeta);
  if(Math.abs(sa*sz)<1e-12) return NaN;
  const sr=Math.sin(rho/2), sb=Math.sin((zeta-alpha)/2);
  const v=(sr*sr-sb*sb)/(sa*sz);
  if(v<0) return NaN;
  if(v>1) return TAU;
  return 4*Math.asin(Math.sqrt(v));
}
/* Inverting for the beam radius given an observed width — this is how rho is
   actually obtained, and why the two unknowns alpha and zeta are degenerate. */
function beamRadius(W,alpha,zeta){
  const c=Math.cos(alpha)*Math.cos(zeta)+Math.sin(alpha)*Math.sin(zeta)*Math.cos(W/2);
  return Math.acos(clamp(c,-1,1));
}

/* Intensity along the profile.  The pencil beam is a Gaussian in the angle
   from the magnetic axis, normalised so that I = 1/2 exactly at Theta = rho —
   which makes the FWHM of this curve identically the analytic pulseWidth(),
   and selfTest measures the drawn profile to confirm it. */
function beamIntensity(Theta,rho,kind,coneFrac){
  const r=Math.max(rho,1e-9);
  const core=Math.exp(-Math.LN2*(Theta/r)*(Theta/r));
  if(kind!=='cone') return core;
  /* a hollow cone: emission peaks on an annulus at Theta = rho, which is what
     produces the double-peaked profiles of real pulsars */
  const w=Math.max(r*0.32,1e-9), d=(Theta-r)/w;
  const cone=Math.exp(-Math.LN2*d*d);
  const f=clamp(coneFrac===undefined?0.75:coneFrac,0,1);
  return (1-f)*core+f*cone;
}
function profileAt(phi,alpha,zeta,rho,kind,coneFrac){
  return beamIntensity(sightAngle(phi,alpha,zeta),rho,kind,coneFrac);
}

/* ================================================================== *
 *  the rotating vector model                                          *
 * ================================================================== */
/* Position angle of the linear polarisation.  atan (not atan2): a position
   angle is defined modulo 180 degrees, and taking the principal value is what
   makes the swing continuous through phi = 0 for beta of either sign. */
function paRVM(phi,alpha,zeta){
  const num=Math.sin(alpha)*Math.sin(phi);
  const den=Math.sin(zeta)*Math.cos(alpha)-Math.cos(zeta)*Math.sin(alpha)*Math.cos(phi);
  return Math.atan2(num,den);
}
function paRVMprincipal(phi,alpha,zeta){
  const num=Math.sin(alpha)*Math.sin(phi);
  let den=Math.sin(zeta)*Math.cos(alpha)-Math.cos(zeta)*Math.sin(alpha)*Math.cos(phi);
  /* When the sight line passes exactly through the magnetic pole (beta = 0) the
     denominator vanishes at phi = 0 AND so does the numerator: the model is
     genuinely singular there, because the swing becomes a step of 180 degrees
     with infinite gradient.  Regularising the denominator gives the correct
     one-sided limits (+-90 either side, 0 at the centre) instead of a NaN that
     propagates into the whole profile array. */
  if(Math.abs(den)<1e-15) den=(den<0?-1:1)*1e-15;
  return Math.atan(num/den);
}
/* the steepest gradient of the swing, which is the whole reason to record it */
function rvmSlope(alpha,zeta){
  const b=zeta-alpha;
  if(Math.abs(Math.sin(b))<1e-14) return Infinity;
  return Math.sin(alpha)/Math.sin(b);
}

/* ================================================================== *
 *  dispersion                                                         *
 * ================================================================== */
/* Cold-plasma group delay.  Derived from CODATA constants rather than the
   quoted 4148.808: this file's own value is 4148.8064 MHz^2 pc^-1 cm^3 s and
   the difference is in the seventh digit. */
const DM_CONST=(function(){
  const dSI=Q_E*Q_E/(8*PI*PI*EPS0*M_E*C_LIGHT);   /* m^2/s */
  return dSI*(PC*1e6)/1e12;                        /* MHz^2 pc^-1 cm^3 s */
})();
function dispersionDelay(DM,fLoMHz,fHiMHz){
  return DM_CONST*DM*(1/(fLoMHz*fLoMHz)-1/(fHiMHz*fHiMHz));
}
/* arrival time of the pulse at one frequency, relative to infinite frequency */
function dmDelayAt(DM,fMHz){ return DM_CONST*DM/(fMHz*fMHz); }
/* the smearing inside one channel of width df, which is what limits how far
   you can see before the pulse is washed out */
function channelSmear(DM,fMHz,dfMHz){
  return 2*DM_CONST*DM*dfMHz/(fMHz*fMHz*fMHz);
}

/* the eccentricity enhancement of Peters (1964) */
function eccFactor(e){
  const e2=e*e;
  return (1+73*e2/24+37*e2*e2/96)*Math.pow(1-e2,-3.5);
}
/* Peters' quadrupole result, written with GM products so that neither G nor
   M_sun ever appears alone — both are known far less precisely than GM_sun. */
function pbdotGR(Pb,e,m1,m2){
  const gm1=m1*GM_SUN, gm2=m2*GM_SUN, gmt=gm1+gm2;
  const c5=Math.pow(C_LIGHT,5);
  return -(192*PI/5)*Math.pow(TAU/Pb,5/3)*gm1*gm2/Math.pow(gmt,1/3)/c5*eccFactor(e);
}
/* semi-major axis from Kepler's third law, again in GM */
function semiMajor(Pb,m1,m2){
  return Math.pow((m1+m2)*GM_SUN*Math.pow(Pb/TAU,2),1/3);
}
/* the shrink rate that follows: a ~ Pb^(2/3) so adot/a = (2/3) Pbdot/Pb */
function aDot(Pb,e,m1,m2){
  return (2/3)*semiMajor(Pb,m1,m2)/Pb*pbdotGR(Pb,e,m1,m2);
}
/* Peters' coalescence time.  The circular result times (1-e^2)^(7/2) is the
   standard high-eccentricity approximation, and is labelled as one. */
function mergerTime(Pb,e,m1,m2){
  const a=semiMajor(Pb,m1,m2);
  const gm1=m1*GM_SUN, gm2=m2*GM_SUN, gmt=gm1+gm2;
  const Tc=(5/256)*Math.pow(C_LIGHT,5)*Math.pow(a,4)/(gm1*gm2*gmt);
  return Tc*Math.pow(1-e*e,3.5);
}
/* the cumulative shift of periastron: the parabola that made the famous plot */
function periastronShift(t,Pb,pbdot){ return 0.5*pbdot*t*t/Pb; }

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function fmtExp(x,n){
  if(!isFinite(x)||x===0) return (x===0)?'0':'—';
  const e=Math.floor(Math.log10(Math.abs(x)));
  const m=x/Math.pow(10,e);
  return fmt(m,n===undefined?2:n)+'×10'+sup(e);
}
function sup(k){
  const map={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return String(k).split('').map(ch=>map[ch]||ch).join('');
}
function fmtTime(s){
  if(!isFinite(s)) return '—';
  const y=s/YR;
  if(y<1) return fmt(s,2)+' s';
  if(y<1e3) return fmt(y,1)+' yr';
  if(y<1e6) return fmt(y/1e3,2)+' kyr';
  if(y<1e9) return fmt(y/1e6,2)+' Myr';
  return fmt(y/1e9,2)+' Gyr';
}
/* four significant figures, not four decimal places: "986197.881 km" is a
   silly way to write a separation that is known to three figures at best */
function sig4(x){
  const a=Math.abs(x);
  if(!(a>0)) return '0';
  const d=clamp(3-Math.floor(Math.log10(a)),0,6);
  return fmt(x,d);
}
function fmtLenM(x){
  if(!isFinite(x)) return '—';
  const a=Math.abs(x);
  if(a>=PC*1e3) return sig4(x/(PC*1e3))+' kpc';
  if(a>=PC)     return sig4(x/PC)+' pc';
  if(a>=1e9)    return sig4(x/1e9)+' Gm';
  if(a>=1e3)    return sig4(x/1e3)+' km';
  if(a>=1)      return sig4(x)+' m';
  return sig4(x*1e3)+' mm';
}
function fmtGauss(T){ return isFinite(T)&&T>0?fmtExp(T*1e4,2)+' G':'—'; }
function fmtErg(W){ return isFinite(W)&&W>0?fmtExp(W*1e7,2)+' erg/s':'—'; }
function fmtSec(s){
  if(!isFinite(s)) return '—';
  const a=Math.abs(s);
  if(a>=1)    return fmt(s,4)+' s';
  if(a>=1e-3) return fmt(s*1e3,4)+' ms';
  if(a>=1e-6) return fmt(s*1e6,3)+' µs';
  return fmt(s*1e9,3)+' ns';
}

/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
function buildModel(st){
  const p=psrById(st.psr);
  const P=periodOf(p.F0), Pdot=pdotOf(p.F0,p.F1);
  const I=st.Iunit*I_NS, R=st.Rkm*1e3;
  const B=surfaceField(P,Pdot,I,R);
  const tauC=charAge(P,Pdot);
  const Edot=spinDownLum(P,Pdot,I);
  const Erot=eRot(P,I);
  const RLC=lightCylinder(P);
  const capAng=polarCapAngle(P,R);
  const capR=polarCapRadius(P,R);
  const nGJ=gjDensity(P,B);
  const betaEq=equatorBeta(P,R);

  const alpha=st.alpha*DEG, zeta=st.zeta*DEG, rho=st.rho*DEG;
  const beta=zeta-alpha;
  const W=pulseWidth(rho,alpha,zeta);
  const Whalf=pulseWidthHalfAngle(rho,alpha,zeta);
  const slope=rvmSlope(alpha,zeta);
  const hits=isFinite(W)&&W>0;

  /* the profile, sampled once */
  const n=Math.max(41,Math.round(st.nProf));
  const ph=new Float64Array(n), inten=new Float64Array(n), pa=new Float64Array(n);
  let mx=0;
  for(let i=0;i<n;i++){
    const f=-PI+TAU*i/(n-1);
    ph[i]=f;
    inten[i]=profileAt(f,alpha,zeta,rho,st.beamKind,st.coneFrac);
    pa[i]=paRVMprincipal(f,alpha,zeta);
    if(inten[i]>mx) mx=inten[i];
  }
  const peakRaw=mx;
  if(mx>0) for(let i=0;i<n;i++) inten[i]/=mx;
  /* The analytic W is the phase range over which the sight line is INSIDE the
     cone, i.e. Theta < rho.  The level that corresponds to on the drawn profile
     is the beam intensity AT Theta = rho — which for the pencil beam is the
     absolute half-power point, NOT half of the observed peak: the peak occurs
     at Theta = |beta|, not at zero, so the observed profile's own FWHM is
     wider.  Getting that wrong is a whole class of error in this subject and
     selfTest pins the correct statement. */
  const levelRho=(mx>0)?beamIntensity(rho,rho,st.beamKind,st.coneFrac)/mx:0;
  const fw=measuredWidthAt(ph,inten,levelRho);

  /* dispersion */
  const DM=(p.DM===null||p.DM===undefined)?0:p.DM;
  const fLo=Math.min(st.fLo,st.fHi), fHi=Math.max(st.fLo,st.fHi);
  const sweep=DM>0?dispersionDelay(DM,fLo,fHi):0;
  const dfch=(fHi-fLo)/Math.max(1,Math.round(st.nchan));
  const smear=DM>0?channelSmear(DM,(fLo+fHi)/2,dfch):0;

  /* ages */
  const P0=st.P0ms*1e-3;
  const tAge=trueAge(P,Pdot,st.nBrake,P0);
  const deathThr=st.deathK*1e11;
  const dead=(Pdot>0)&&(Pdot<deathPdot(P,deathThr));

  const bin=binaryById(st.binary);
  const pbd=pbdotGR(bin.Pb,bin.e,bin.m1,bin.m2);

  return {st,p,P,Pdot,I,R,B,tauC,Edot,Erot,RLC,capAng,capR,nGJ,betaEq,
          alpha,zeta,rho,beta,W,Whalf,slope,hits,
          prof:{ph,inten,pa},fwhm:fw,peakRaw,levelRho,
          DM,fLo,fHi,sweep,smear,dfch,
          P0,tAge,deathThr,dead,
          bin,pbd,
          hasPdot:Pdot>0};
}
/* width of a sampled profile at an absolute level, in phase radians */
function measuredWidthAt(ph,y,level){
  let imax=0;
  for(let i=1;i<y.length;i++) if(y[i]>y[imax]) imax=i;
  const half=level;
  const cross=(i0,i1)=>{
    const a=y[i0],b=y[i1];
    if(a===b) return ph[i0];
    return ph[i0]+(ph[i1]-ph[i0])*(half-a)/(b-a);
  };
  let lo=NaN,hi=NaN;
  for(let i=imax;i>0;i--) if(y[i-1]<half&&y[i]>=half){ lo=cross(i-1,i); break; }
  for(let i=imax;i<y.length-1;i++) if(y[i+1]<half&&y[i]>=half){ hi=cross(i,i+1); break; }
  return (isFinite(lo)&&isFinite(hi))?hi-lo:NaN;
}
function measuredFWHM(ph,y){
  let imax=0;
  for(let i=1;i<y.length;i++) if(y[i]>y[imax]) imax=i;
  return measuredWidthAt(ph,y,y[imax]/2);
}

function readoutHTML(M){
  const st=M.st, p=M.p;
  let s='';
  const title=(function(){
    if(st.view==='binary')     return {t:M.bin.name,s:M.bin.sub};

    s+='</table><div class="note"><b>Cited.</b> '+b.src+'</div>';
    return s;
  }

  hd('catalogue');
  row('F<sub>0</sub>', fmt(p.F0,p.F0>100?6:9)+' Hz');
  row('F<sub>1</sub>', M.hasPdot?fmtExp(p.F1,4)+' Hz/s':'not measured','');
  row('P = 1/F₀', fmtSec(M.P));
  row('Ṗ = −F₁/F₀²', M.hasPdot?fmtExp(M.Pdot,4):'—');
  row('DM', M.DM>0?fmt(M.DM,4)+' pc cm⁻³':'—');
  if(M.hasPdot){
    hd('derived');
    row('surface field B', fmtGauss(M.B), M.B*1e4>1e14?'bad':'');
    row('characteristic age', fmtTime(M.tauC));
    row('spin-down power', fmtErg(M.Edot));
    row('rotational energy', fmtExp(M.Erot*1e7,2)+' erg');
    row('fraction lost / yr', fmtExp(M.Edot*YR/M.Erot,2));
  }
  hd('magnetosphere');
  row('light cylinder', fmtLenM(M.RLC));
  row('  in stellar radii', fmt(M.RLC/M.R,1));
  row('polar cap', fmt(M.capAng*RAD,3)+'°, '+fmtLenM(M.capR));
  row('equator speed', fmt(M.betaEq,4)+' c', M.betaEq>0.15?'bad':'');
  if(M.hasPdot) row('n<sub>GJ</sub> at the cap', fmtExp(M.nGJ*1e-6,2)+' cm⁻³');

    row('pulse width W', M.hits?fmt(M.W*RAD,2)+'°':'the beam misses', M.hits?'':'bad');

     +'</div>';

}

      +'<span class="sm">the constant is e²/(8π²ε₀m<sub>e</sub>c), computed here from CODATA '

      +'<span class="sm">the width gives one relation between α, ζ and ρ; the polarisation '

}
