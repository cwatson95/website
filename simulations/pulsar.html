/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  const xt=o.xticks||ticksFor(xlo,xhi,6), yt=o.yticks||ticksFor(ylo,yhi,5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* ================================================================== *
 *  view: the star  (3-D)                                              *
 *                                                                     *
 *  A 10 km star inside a light cylinder 1600 km across cannot share a  *
 *  linear radial scale — for the Crab the star would be 1/159 of the   *
 *  picture and for B1919+21 one part in 6381.  The radius is therefore *
 *  mapped LOGARITHMICALLY, star surface to w = 1 and light cylinder to *
 *  w = LCW, which preserves the one thing the view exists to show —    *
 *  which field lines close and which do not — and distorts the shapes. *
 *  The compression factor is printed on the canvas.                    *
 * ================================================================== */
const LCW=3.15;                        /* world radius of the light cylinder */

function radialMap(M,r){               /* r in stellar radii -> world radius */
  const q=Math.max(M.RLC/M.R,1.0001);
  const x=clamp(r,1,q*4);
  return 1+(LCW-1)*Math.log(x)/Math.log(q);
}
/* the magnetic axis at rotation phase phi */
function magAxis(alpha,phi){
  return [Math.sin(alpha)*Math.cos(phi),Math.sin(alpha)*Math.sin(phi),Math.cos(alpha)];
}
/* an orthonormal frame with m as its third axis */
function magFrame(m){
  const t=(Math.abs(m[2])<0.9)?[0,0,1]:[1,0,0];
  const e1=v3.norm(v3.cross(t,m));
  const e2=v3.cross(m,e1);
  return [e1,e2,m];
}
/* One dipole field line, r = r_e sin^2(theta) about the magnetic axis at
   azimuth psi, in world coordinates with the radial map applied.
   Returns a LIST OF SEGMENTS, because a line whose equatorial radius exceeds
   the light cylinder does not close: the part with r > R_LC is not there.
   Drawing the whole loop anyway — which the first version did — draws exactly
   the thing the view exists to deny, an open line closing back on itself. */
function fieldLine(M,rE,psi,m,nSeg){
  const F=magFrame(m), segs=[];
  const n=nSeg||60;
  const q=M.RLC/M.R;
  const s=Math.sqrt(clamp(1/rE,0,1));
  const th0=Math.asin(s), th1=PI-th0;
  let cur=null;
  for(let i=0;i<=n;i++){
    const th=th0+(th1-th0)*i/n;
    const r=rE*Math.sin(th)*Math.sin(th);
    if(r>q){                       /* beyond the light cylinder: no field line */
      if(cur&&cur.length>1) segs.push(cur);
      cur=null; continue;
    }
    const w=radialMap(M,r);
    const st_=Math.sin(th), ct=Math.cos(th);
    const dir=[st_*Math.cos(psi),st_*Math.sin(psi),ct];
    const p=[w*(F[0][0]*dir[0]+F[1][0]*dir[1]+F[2][0]*dir[2]),
             w*(F[0][1]*dir[0]+F[1][1]*dir[1]+F[2][1]*dir[2]),
             w*(F[0][2]*dir[0]+F[1][2]*dir[1]+F[2][2]*dir[2])];
    if(!cur) cur=[];
    cur.push(p);
  }
  if(cur&&cur.length>1) segs.push(cur);
  return segs;
}

function drawStar(ctx,W,H,M,S){
  const st=M.st, cam=S.cam;
  cam.W=W; cam.H=H;
  const B=camBasis(cam);
  const P=p=>project(cam,B,p);
  const phi=S.phase;
  const m=magAxis(M.alpha,phi);
  const q=M.RLC/M.R;

  /* ---- floor grid ---- */
  if(st.showGrid){
    ctx.save(); ctx.strokeStyle='#111624'; ctx.lineWidth=1;
    for(let k=1;k<=4;k++){
      const rr=LCW*k/4, pts=[];
      for(let i=0;i<=64;i++){ const a=TAU*i/64; pts.push(P([rr*Math.cos(a),rr*Math.sin(a),0])); }
      ctx.beginPath(); let started=false;
      for(const s of pts){ if(!s){started=false;continue;}
        if(!started){ctx.moveTo(s.x,s.y);started=true;} else ctx.lineTo(s.x,s.y); }
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- the light cylinder ---- */
  if(st.showLC){
    ctx.save();
    ctx.strokeStyle=rgba('#5ac8e0',0.42); ctx.lineWidth=1.2;
    for(const z of [-LCW*0.95,LCW*0.95]){
      ctx.beginPath(); let started=false;
      for(let i=0;i<=72;i++){
        const a=TAU*i/72, s=P([LCW*Math.cos(a),LCW*Math.sin(a),z]);
        if(!s){started=false;continue;}
        if(!started){ctx.moveTo(s.x,s.y);started=true;} else ctx.lineTo(s.x,s.y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([4,5]);
    for(let i=0;i<8;i++){
      const a=TAU*i/8;
      const s0=P([LCW*Math.cos(a),LCW*Math.sin(a),-LCW*0.95]);
      const s1=P([LCW*Math.cos(a),LCW*Math.sin(a), LCW*0.95]);
      if(s0&&s1){ ctx.beginPath(); ctx.moveTo(s0.x,s0.y); ctx.lineTo(s1.x,s1.y); ctx.stroke(); }
    }
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* ---- field lines.  A line is OPEN if its equatorial radius exceeds the
         light cylinder; those are the ones that carry everything a pulsar
         emits, and they are coloured differently for that reason. ---- */
  if(st.showField){
    const closedRE=[1.6,2.6,4.5,8,16,q*0.55,q*0.85], openRE=[q*1.15,q*1.6,q*3,q*6];
    const azis=[0,PI/4,PI/2,3*PI/4,PI,5*PI/4,3*PI/2,7*PI/4];
    ctx.save();
    for(const rE of closedRE.concat(openRE)){
      if(!(rE>1.05)) continue;
      const open=rE>q;
      for(const psi of azis){
        const segs=fieldLine(M,Math.min(rE,q*6),psi,m,open?90:54);
        ctx.strokeStyle=open?rgba('#e8843a',0.8):rgba('#5f6a82',0.7);
        ctx.lineWidth=open?1.6:1;
        for(const pts of segs){
          ctx.beginPath(); let started=false;
          for(const p of pts){
            const s=P(p); if(!s){started=false;continue;}
            if(!started){ctx.moveTo(s.x,s.y);started=true;} else ctx.lineTo(s.x,s.y);
          }
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  /* ---- the star: a shaded ball of quads, painter-sorted ---- */
  {
    const quads=[], nl=14, nz=20;
    const lightDir=v3.norm([0.4,-0.8,0.6]);
    for(let i=0;i<nl;i++) for(let k=0;k<nz;k++){
      const t0=PI*i/nl, t1=PI*(i+1)/nl;
      const a0=TAU*k/nz, a1=TAU*(k+1)/nz;
      const pt=(t,a)=>[Math.sin(t)*Math.cos(a),Math.sin(t)*Math.sin(a),Math.cos(t)];
      const corners=[pt(t0,a0),pt(t0,a1),pt(t1,a1),pt(t1,a0)];
      const nrm=v3.norm(v3.add(v3.add(corners[0],corners[1]),v3.add(corners[2],corners[3])));
      const toEye=v3.norm(v3.sub(B.eye,nrm));
      if(v3.dot(nrm,toEye)<=0) continue;          /* back face */
      const ss=corners.map(P);
      if(ss.some(s=>!s)) continue;
      let d=0; for(const s of ss) d+=s.z; d/=4;
      const lam=clamp(0.18+0.82*Math.max(0,v3.dot(nrm,lightDir)),0,1);
      quads.push({ss,col:mix('#10141d','#8b93a6',lam*lam),d});
    }
    quads.sort((a,b)=>b.d-a.d);
    for(const qd of quads){
      ctx.beginPath(); ctx.moveTo(qd.ss[0].x,qd.ss[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(qd.ss[i].x,qd.ss[i].y);
      ctx.closePath(); ctx.fillStyle=qd.col; ctx.fill();
    }
  }

  /* ---- spin axis ---- */
  ctx.save();
  {
    const a=P([0,0,-LCW*1.15]), b=P([0,0,LCW*1.15]);
    if(a&&b){ ctx.strokeStyle=rgba('#cfd4de',0.5); ctx.lineWidth=1.2; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]); }
  }
  /* ---- magnetic axis ---- */
  {
    const a=P(v3.mul(m,-LCW*1.05)), b=P(v3.mul(m,LCW*1.05));
    if(a&&b){ ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  }
  ctx.restore();

  /* ---- polar caps ---- */
  if(st.showCap){
    const F=magFrame(m);
    ctx.save();
    for(const sgn of [1,-1]){
      const pts=[];
      for(let i=0;i<=40;i++){
        const a=TAU*i/40, th=M.capAng;
        const d=[Math.sin(th)*Math.cos(a),Math.sin(th)*Math.sin(a),sgn*Math.cos(th)];
        pts.push(P([1.005*(F[0][0]*d[0]+F[1][0]*d[1]+F[2][0]*d[2]),
                    1.005*(F[0][1]*d[0]+F[1][1]*d[1]+F[2][1]*d[2]),
                    1.005*(F[0][2]*d[0]+F[1][2]*d[1]+F[2][2]*d[2])]));
      }
      ctx.beginPath(); let started=false;
      for(const s of pts){ if(!s){started=false;continue;}
        if(!started){ctx.moveTo(s.x,s.y);started=true;} else ctx.lineTo(s.x,s.y); }
      ctx.closePath(); ctx.fillStyle=rgba('#e8843a',0.55); ctx.fill();
      ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.2; ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- the emission cone, half-angle rho about the magnetic axis ---- */
  if(st.showCone){
    const F=magFrame(m), L=LCW*0.92;
    ctx.save();
    for(const sgn of [1,-1]){
      const ring=[];
      for(let i=0;i<=48;i++){
        const a=TAU*i/48;
        const d=[Math.sin(M.rho)*Math.cos(a),Math.sin(M.rho)*Math.sin(a),sgn*Math.cos(M.rho)];
        ring.push([L*(F[0][0]*d[0]+F[1][0]*d[1]+F[2][0]*d[2]),
                   L*(F[0][1]*d[0]+F[1][1]*d[1]+F[2][1]*d[2]),
                   L*(F[0][2]*d[0]+F[1][2]*d[1]+F[2][2]*d[2])]);
      }
      const apex=P([0,0,0]);
      ctx.beginPath(); let started=false;
      for(const p of ring){ const s=P(p); if(!s){started=false;continue;}
        if(!started){ctx.moveTo(s.x,s.y);started=true;} else ctx.lineTo(s.x,s.y); }
      ctx.closePath();
      ctx.strokeStyle=rgba('#b8ec4c',0.75); ctx.lineWidth=1.3; ctx.stroke();
      ctx.fillStyle=rgba('#b8ec4c',0.07); ctx.fill();
      if(apex) for(let i=0;i<ring.length;i+=3){
        const s=P(ring[i]);
        if(s){ ctx.beginPath(); ctx.moveTo(apex.x,apex.y); ctx.lineTo(s.x,s.y);
               ctx.strokeStyle=rgba('#b8ec4c',0.30); ctx.lineWidth=1; ctx.stroke(); }
      }
    }
    ctx.restore();
  }

  /* ---- the sight line, and whether the beam is on it right now ---- */
  if(st.showSight){
    const los=[Math.sin(M.zeta),0,Math.cos(M.zeta)];
    const on=sightAngle(phi,M.alpha,M.zeta)<M.rho;
    ctx.save();
    const a=P([0,0,0]), b=P(v3.mul(los,LCW*1.22));
    if(a&&b){
      ctx.strokeStyle=on?'#b8ec4c':rgba('#cfd4de',0.45);
      ctx.lineWidth=on?2.6:1.4;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    if(b){
      ctx.fillStyle=on?'#b8ec4c':'#8b93a6';
      ctx.beginPath(); ctx.arc(b.x,b.y,on?6:4,0,TAU); ctx.fill();
      ctx.font='11px -apple-system, sans-serif'; ctx.textBaseline='middle';
      const lab=on?'the beam is on us':'to Earth';
      /* the readout panel floats over the top right of the stage: put the label
         on the inboard side rather than let it disappear underneath */
      const right=b.x<W-380;
      ctx.textAlign=right?'left':'right';
      ctx.fillText(lab,b.x+(right?10:-10),b.y);
    }
    ctx.restore();
  }

  /* ---- the running pulse profile, bottom right of the stage ---- */
  {
    const pb=box(W-330-24-300,H-140,300,86);
    if(pb.x>20){
      ctx.save();
      ctx.fillStyle=rgba('#0a0c12',0.72);
      ctx.fillRect(pb.x-8,pb.y-20,pb.w+16,pb.h+34);
      frame(ctx,pb,'#242a3a');
      const xs=[],ys=[];
      for(let i=0;i<M.prof.ph.length;i++){ xs.push(M.prof.ph[i]*RAD); ys.push(M.prof.inten[i]); }
      polyline(ctx,pb,xs,ys,-180,180,0,1.08,'#b8ec4c',1.6);
      const X=pb.x+pb.w*(((phi+PI)%TAU)/TAU);
      ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(X,pb.y); ctx.lineTo(X,pb.y1); ctx.stroke();
      ctx.fillStyle='#8b93a6'; ctx.font='10.5px -apple-system, sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText('what the telescope sees, one rotation',pb.x,pb.y-6);
      ctx.restore();
    }
  }

  /* ---- the caption: the compression must be stated ---- */
  ctx.save();
  caption(ctx,14,44,
    'The radial scale is logarithmic: the surface is at 1 and the light cylinder at '
    +fmt(LCW,2)+', which on this star are a factor of '+fmt(q,0)+' apart in reality. '
    +'Field lines whose equatorial radius clears the light cylinder cannot close — those '
    +'are drawn orange, and everything a pulsar emits leaves through the '
    +fmt(M.capAng*RAD,2)+'° cap where they meet the surface.',
    Math.max(240,Math.min(560,W-380)),'#6a7285');
  ctx.restore();
}

/* ================================================================== *
 *  view: the beam — the profile and the polarisation swing            *
 * ================================================================== */
function drawBeam(ctx,W,H,M,S){
  const st=M.st;
  const padL=76, padR=330, padT=52, padB=120;
  const bw=Math.max(200,W-padL-padR), availH=Math.max(200,H-padT-padB);
  const gap=64;
  const h1=Math.round((availH-gap)*0.56), h2=availH-gap-h1;
  const ib=box(padL,padT,bw,h1);
  const pb=box(padL,padT+h1+gap,bw,h2);

  /* ---- the profile ---- */
  axes(ctx,ib,-180,180,0,1.08,{xfmt:t=>fmt(t,0)+'°',yfmt:t=>fmt(t,1),
    xlab:'rotation phase',ylab:'intensity',
    title:'the pulse profile — '+(st.beamKind==='cone'?'hollow cone':'pencil beam')});
  const xs=[],ys=[];
  for(let i=0;i<M.prof.ph.length;i++){ xs.push(M.prof.ph[i]*RAD); ys.push(M.prof.inten[i]); }
  polyline(ctx,ib,xs,ys,-180,180,0,1.08,'#b8ec4c',1.9);
  /* the analytic width, drawn as a bar at half maximum */
  if(M.hits){
    const w=M.W*RAD;
    const x0=ib.x+ib.w*(-w/2+180)/360, x1=ib.x+ib.w*(w/2+180)/360;
    const Y=ib.y1-ib.h*clamp(M.levelRho,0,1)/1.08;
    ctx.save();
    ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(x0,Y); ctx.lineTo(x1,Y); ctx.stroke();
    for(const X of [x0,x1]){ ctx.beginPath(); ctx.moveTo(X,Y-6); ctx.lineTo(X,Y+6); ctx.stroke(); }
    ctx.fillStyle='#e8843a'; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('W = '+fmt(w,2)+'° — the phase with Θ < ρ, at the level Θ = ρ',
                 (x0+x1)/2,Y-9);
    ctx.restore();
  } else {
    ctx.save();
    ctx.fillStyle='#e8843a'; ctx.font='12px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('the cone never crosses the sight line — |ζ − α| = '
                 +fmt(Math.abs(M.beta)*RAD,2)+'° exceeds ρ = '+fmt(st.rho,2)+'°',
                 ib.x+ib.w/2,ib.y+ib.h/2);
    ctx.restore();
  }
  /* the live phase marker */
  {
    const X=ib.x+ib.w*(((S.phase+PI)%TAU)/TAU);
    ctx.save(); ctx.strokeStyle=rgba('#cd35c4',0.8); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(X,ib.y); ctx.lineTo(X,ib.y1); ctx.stroke(); ctx.restore();
  }

  /* ---- the position-angle swing ---- */
  axes(ctx,pb,-180,180,-95,95,{xfmt:t=>fmt(t,0)+'°',yfmt:t=>fmt(t,0)+'°',
    xlab:'rotation phase',ylab:'position angle ψ',
    title:'the rotating vector model'});
  {
    const px=[],py=[];
    for(let i=0;i<M.prof.ph.length;i++){ px.push(M.prof.ph[i]*RAD); py.push(M.prof.pa[i]*RAD); }
    /* break the polyline where the principal value wraps, or the jump is drawn
       as a near-vertical line that reads as part of the curve */
    let seg={x:[],y:[]};
    const segs=[];
    for(let i=0;i<px.length;i++){
      if(i>0&&Math.abs(py[i]-py[i-1])>90){ segs.push(seg); seg={x:[],y:[]}; }
      seg.x.push(px[i]); seg.y.push(py[i]);
    }
    segs.push(seg);
    for(const sg of segs) if(sg.x.length>1)
      polyline(ctx,pb,sg.x,sg.y,-180,180,-95,95,'#5ac8e0',1.9);
  }
  /* the steepest-gradient tangent at phi = 0 */
  if(isFinite(M.slope)){
    const sl=M.slope;                       /* degrees of PA per degree of phase */
    const dx=Math.min(60,90/Math.max(Math.abs(sl),0.05));
    const tx=[-dx,dx], ty=[-sl*dx,sl*dx];
    polyline(ctx,pb,tx,ty,-180,180,-95,95,rgba('#e8843a',0.9),1.5,[6,4]);
    ctx.save();
    ctx.fillStyle='#e8843a'; ctx.font='11px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('(dψ/dφ)max = sin α / sin β = '+fmt(sl,2),
                 pb.x+pb.w*0.52,pb.y+6);
    ctx.restore();
  }
  ctx.save();
  caption(ctx,pb.x,pb.y1+42,
    'The width gives one relation between α, ζ and ρ; the gradient of this swing gives '
    +'another between α and β = ζ − α. That is two equations for three unknowns, which is '
    +'exactly why published geometries for the same pulsar disagree — and why the swing is '
    +'recorded at all. β here is '+fmt(M.beta*RAD,2)+'°, so a beam narrower than that misses '
    +'us entirely and the pulsar is, from Earth, not a pulsar.',
    pb.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view: the P–Pdot diagram                                           *
 * ================================================================== */
function drawDiagram(ctx,W,H,M){
  const st=M.st;
  const padL=76, padR=330, padT=52, padB=118;
  const b=box(padL,padT,Math.max(220,W-padL-padR),Math.max(180,H-padT-padB));
  const xlo=-3.3, xhi=1.35, ylo=-21.6, yhi=-8.6;
  axes(ctx,b,xlo,xhi,ylo,yhi,
    {xfmt:t=>'10'+sup(Math.round(t)),yfmt:t=>'10'+sup(Math.round(t)),
     xlab:'period P, seconds',ylab:'period derivative Ṗ, s/s',
     title:'23 catalogue pulsars, and the two straight lines that organise them'});

  /* Everything below is a straight line across the whole plane, so it has to be
     CLIPPED to the plot box — the death line otherwise leaves the axes at the
     bottom left and runs off the canvas.  Labels are drawn after the restore,
     because several of them belong on the frame itself. */
  const clipBox=()=>{ ctx.save(); ctx.beginPath();
    ctx.rect(b.x,b.y,b.w,b.h); ctx.clip(); };

  /* lines of constant surface field: B = k sqrt(P Pdot) -> log Pdot = 2 log(B/k) - log P */
  if(st.showContours){
    clipBox();
    for(let e=8;e<=15;e++){
      const Bg=Math.pow(10,e);
      const yAt=x=>2*Math.log10(Bg/B_COEFF_GAUSS)-x;
      polyline(ctx,b,[xlo,xhi],[yAt(xlo),yAt(xhi)],xlo,xhi,ylo,yhi,rgba('#5f6a82',0.42),1,[3,4]);
    }
    for(const [tau] of [[1e3],[1e6],[1e9]]){
      const yAt=x=>x-Math.log10(2*tau*YR);
      polyline(ctx,b,[xlo,xhi],[yAt(xlo),yAt(xhi)],xlo,xhi,ylo,yhi,rgba('#b8ec4c',0.30),1,[6,4]);
    }
    ctx.restore();
    ctx.save(); ctx.font='9.5px -apple-system, sans-serif';
    for(let e=8;e<=15;e++){
      const Bg=Math.pow(10,e);
      const yAt=x=>2*Math.log10(Bg/B_COEFF_GAUSS)-x;
      /* label where the line leaves the box */
      let lx=xhi, ly=yAt(xhi);
      if(ly<ylo){ ly=ylo; lx=2*Math.log10(Bg/B_COEFF_GAUSS)-ylo; }
      if(lx>=xlo&&lx<=xhi&&ly>=ylo&&ly<=yhi){
        const X=b.x+b.w*(lx-xlo)/(xhi-xlo), Y=b.y1-b.h*(ly-ylo)/(yhi-ylo);
        ctx.fillStyle=rgba('#7d879b',0.95); ctx.textAlign='right'; ctx.textBaseline='bottom';
        ctx.fillText('10'+sup(e)+' G',X-3,Y-2);
      }
    }
    /* lines of constant characteristic age: Pdot = P/(2 tau) */
    for(const [tau,lab] of [[1e3,'1 kyr'],[1e6,'1 Myr'],[1e9,'1 Gyr']]){
      const yAt=x=>x-Math.log10(2*tau*YR);
      let lx=xhi, ly=yAt(xhi);
      if(ly>yhi){ ly=yhi; lx=yhi+Math.log10(2*tau*YR); }
      if(lx>=xlo&&lx<=xhi&&ly>=ylo&&ly<=yhi){
        const X=b.x+b.w*(lx-xlo)/(xhi-xlo), Y=b.y1-b.h*(ly-ylo)/(yhi-ylo);
        ctx.fillStyle=rgba('#8fae4a',0.95); ctx.textAlign='right'; ctx.textBaseline='top';
        ctx.fillText(lab,X-3,Y+3);
      }
    }
    ctx.restore();
  }
  /* the death line */
  if(st.showDeath){
    const xs=[],ys=[];
    for(let i=0;i<=40;i++){ const x=xlo+(xhi-xlo)*i/40;
      xs.push(x); ys.push(Math.log10(deathPdot(Math.pow(10,x),M.deathThr))); }
    clipBox();
    polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,rgba('#cd35c4',0.75),1.6);
    ctx.restore();
    ctx.save();
    ctx.fillStyle=rgba('#cd35c4',0.95); ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    const X=b.x+b.w*(0.15-xlo)/(xhi-xlo);
    const Y=b.y1-b.h*(Math.log10(deathPdot(Math.pow(10,0.15),M.deathThr))-ylo)/(yhi-ylo);
    if(Y>b.y&&Y<b.y1) ctx.fillText('death line,  B/P² = '+fmt(st.deathK,2)+'×10¹¹ G s⁻²',X+6,Y+4);
    ctx.restore();
  }

  /* the pulsars */
  ctx.save();
  ctx.font='10px -apple-system, sans-serif';
  const placed=[];
  for(const p of PSRS){
    const P=periodOf(p.F0), Pd=pdotOf(p.F0,p.F1);
    const X=b.x+b.w*(Math.log10(P)-xlo)/(xhi-xlo);
    const sel=(p.j===st.psr);
    if(!(Pd>0)){
      /* Pdot not measured: an arrow at the floor rather than a fake point */
      const Y=b.y1-6;
      ctx.strokeStyle=rgba('#8b93a6',0.9); ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X,Y-12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X-4,Y-8); ctx.lineTo(X,Y); ctx.lineTo(X+4,Y-8); ctx.stroke();
      if(st.showNames){
        ctx.fillStyle='#8b93a6'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('Ṗ not measured',X,Y-14);
      }
      continue;
    }
    const Y=b.y1-b.h*(Math.log10(Pd)-ylo)/(yhi-ylo);
    if(X<b.x-4||X>b.x1+4||Y<b.y-4||Y>b.y1+4) continue;
    const col=(PSR_CLASS[p.cls]||PSR_CLASS.normal).col;
    ctx.beginPath(); ctx.arc(X,Y,sel?6:3.6,0,TAU);
    ctx.fillStyle=sel?'#fff':col; ctx.fill();
    if(sel){ ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.stroke(); }
    if(st.showNames){
      const lab=p.b||p.j;
      const wpx=ctx.measureText(lab).width;
      /* nudge the label off any earlier one rather than letting them stack */
      let ly=Y-8, tries=0;
      while(tries<6&&placed.some(q=>Math.abs(q.x-X)<(q.w+wpx)/2+4&&Math.abs(q.y-ly)<11)){
        ly+=(tries%2?-1:1)*12*(1+Math.floor(tries/2)); tries++;
      }
      placed.push({x:X,y:ly,w:wpx});
      ctx.fillStyle=sel?'#fff':rgba(col,0.92);
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(lab,X,ly);
    }
  }
  ctx.restore();

  /* legend + caption */
  ctx.save();
  ctx.font='11px -apple-system, sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
  let lx=b.x, ly=b.y1+46;
  for(const k of ['young','normal','msp','binary','mag']){
    const c=PSR_CLASS[k];
    ctx.fillStyle=c.col; ctx.beginPath(); ctx.arc(lx+5,ly,4,0,TAU); ctx.fill();
    ctx.fillStyle='#8b93a6'; ctx.fillText(c.name,lx+14,ly);
    lx+=14+ctx.measureText(c.name).width+22;
  }
  caption(ctx,b.x,ly+14,
    'Two families, and the gap between them is the whole history of these objects. Pulsars are '
    +'born top left, drift right and down along their field line as they slow, and cross the '
    +'death line in a few million years. The millisecond pulsars in the bottom left are not '
    +'young — they are ancient stars spun back up by accretion from a companion, which is why '
    +'they carry weak fields and why so many of them are in binaries. J2144−3933 sits below the '
    +'death line and radiates anyway.',
    b.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view: spin-down — the ledger                                       *
 * ================================================================== */
function drawSpindown(ctx,W,H,M){
  const st=M.st;
  const padL=80, padR=330, padT=52, padB=118;
  const bw=Math.max(200,W-padL-padR), availH=Math.max(200,H-padT-padB);
  const gap=64, h1=Math.round((availH-gap)*0.54), h2=availH-gap-h1;
  const eb=box(padL,padT,bw,h1);
  const ab=box(padL,padT+h1+gap,bw,h2);

  if(!M.hasPdot){
    ctx.save();
    ctx.fillStyle='#e8843a'; ctx.font='13px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Ṗ is not measured for '+M.p.j+' — there is no ledger to draw.',
                 padL+bw/2,padT+availH/2);
    ctx.restore();
    return;
  }

  /* ---- P(t): the evolution track ---- */
  const tMax=Math.max(M.tauC*4,1e3*YR);
  const xs=[],ys=[];
  for(let i=0;i<=280;i++){
    const t=tMax*i/280;
    const p=periodAt(M.P0,pdotFromP0(M),st.nBrake,t);
    xs.push(t/YR); ys.push(isFinite(p)?p:NaN);
  }
  let pmax=0; for(const v of ys) if(isFinite(v)&&v>pmax) pmax=v;
  axes(ctx,eb,0,tMax/YR,0,pmax*1.08,
    {xfmt:t=>t>=1e6?fmt(t/1e6,1)+' Myr':(t>=1e3?fmt(t/1e3,1)+' kyr':fmt(t,0)+' yr'),
     yfmt:t=>fmt(t,2)+' s',
     xlab:'time since birth',ylab:'period P',
     title:'the spin-down track, n = '+fmt(st.nBrake,2)+', P₀ = '+fmt(st.P0ms,2)+' ms'});
  polyline(ctx,eb,xs,ys,0,tMax/YR,0,pmax*1.08,'#b8ec4c',1.9);
  /* where the pulsar is now */
  if(isFinite(M.tAge)&&M.tAge>0&&M.tAge<tMax){
    const X=eb.x+eb.w*(M.tAge/YR)/(tMax/YR), Y=eb.y1-eb.h*M.P/(pmax*1.08);
    ctx.save();
    ctx.strokeStyle=rgba('#cd35c4',0.85); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(X,eb.y1); ctx.lineTo(X,Y); ctx.lineTo(eb.x,Y); ctx.stroke();
    ctx.fillStyle='#cd35c4'; ctx.beginPath(); ctx.arc(X,Y,5,0,TAU); ctx.fill();
    ctx.font='11px -apple-system, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('now — '+fmtTime(M.tAge),X+8,Y-6);
    ctx.restore();
  }
  /* the characteristic age, for comparison */
  {
    const X=eb.x+eb.w*(M.tauC/YR)/(tMax/YR);
    if(X>eb.x&&X<eb.x1){
      ctx.save();
      ctx.strokeStyle=rgba('#8b93a6',0.6); ctx.setLineDash([4,4]); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(X,eb.y); ctx.lineTo(X,eb.y1); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#8b93a6'; ctx.font='10.5px -apple-system, sans-serif';
      ctx.textAlign='right'; ctx.textBaseline='top';
      ctx.fillText('τc = P/2Ṗ = '+fmtTime(M.tauC),X-5,eb.y+5);
      ctx.restore();
    }
  }

  /* ---- age against braking index ---- */
  const nx=[],ny=[],ny2=[];
  for(let i=0;i<=240;i++){
    const n=1.15+(5-1.15)*i/240;
    nx.push(n);
    ny.push(trueAge(M.P,M.Pdot,n,M.P0)/YR);
    ny2.push(trueAge(M.P,M.Pdot,n,0)/YR);
  }
  let amax=0; for(const v of ny2) if(isFinite(v)&&v>amax) amax=v;
  amax=Math.min(amax,M.tauC/YR*6);
  axes(ctx,ab,1.15,5,0,amax*1.05,
    {xfmt:t=>fmt(t,1),
     yfmt:t=>t>=1e6?fmt(t/1e6,1)+' Myr':(t>=1e3?fmt(t/1e3,0)+' kyr':fmt(t,0)+' yr'),
     xlab:'braking index n',ylab:'age',
     title:'how much the age depends on a number nobody can measure easily'});
  polyline(ctx,ab,nx,ny2,1.15,5,0,amax*1.05,rgba('#5ac8e0',0.85),1.6,[5,4]);
  polyline(ctx,ab,nx,ny,1.15,5,0,amax*1.05,'#b8ec4c',1.9);
  {
    const X=ab.x+ab.w*(3-1.15)/(5-1.15);
    const Y=ab.y1-ab.h*(M.tauC/YR)/(amax*1.05);
    ctx.save();
    ctx.strokeStyle=rgba('#8b93a6',0.5); ctx.setLineDash([3,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X,ab.y); ctx.lineTo(X,ab.y1); ctx.stroke(); ctx.setLineDash([]);
    if(Y>ab.y&&Y<ab.y1){
      ctx.fillStyle='#e8843a'; ctx.beginPath(); ctx.arc(X,Y,4.5,0,TAU); ctx.fill();
      ctx.font='11px -apple-system, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText('n = 3, P₀ → 0  is exactly τc',X+8,Y-5);
    }
    /* the current n */
    const Xn=ab.x+ab.w*(clamp(st.nBrake,1.15,5)-1.15)/(5-1.15);
    ctx.strokeStyle=rgba('#cd35c4',0.85); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(Xn,ab.y); ctx.lineTo(Xn,ab.y1); ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.font='11px -apple-system, sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
  let lx=ab.x, ly=ab.y1+46;
  const key=(c,l,d)=>{ ctx.strokeStyle=c; ctx.lineWidth=2; if(d) ctx.setLineDash(d);
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+18,ly); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#8b93a6'; ctx.fillText(l,lx+24,ly);
    lx+=24+ctx.measureText(l).width+22; };
  key('#b8ec4c','with P₀ = '+fmt(st.P0ms,1)+' ms');
  key(rgba('#5ac8e0',0.85),'with P₀ → 0',[5,4]);
  caption(ctx,ab.x,ly+14,
    'The characteristic age assumes two things that are not true: that the braking index is '
    +'exactly 3, and that the star was born spinning infinitely fast. The Crab is the test case '
    +'— its index is measured at 2.51 and its birth year is known from the 1054 record, and the '
    +'two together say it was born with a period near 19 ms rather than at zero. Slide n and P₀ '
    +'and watch how little the age is really pinned down.',
    ab.w,'#767e92');
  ctx.restore();
}
/* the Pdot the star had at birth, for the forward track */
function pdotFromP0(M){
  const n=M.st.nBrake;
  return M.Pdot*Math.pow(M.P0/M.P,2-n);
}

/* ================================================================== *
 *  view: dispersion                                                   *
 * ================================================================== */
function drawDispersion(ctx,W,H,M){
  const st=M.st;
  const padL=82, padR=330, padT=52, padB=118;
  const bw=Math.max(200,W-padL-padR), availH=Math.max(200,H-padT-padB);
  const gap=64, h1=Math.round((availH-gap)*0.60), h2=availH-gap-h1;
  const db=box(padL,padT,bw,h1);
  const cb=box(padL,padT+h1+gap,bw,h2);

  if(!(M.DM>0)){
    ctx.save();
    ctx.fillStyle='#e8843a'; ctx.font='13px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('no dispersion measure is catalogued for '+M.p.j,padL+bw/2,padT+availH/2);
    ctx.restore();
    return;
  }

  /* ---- the dynamic spectrum: time across, frequency up ---- */
  const nch=clamp(Math.round(st.nchan),4,64);
  const tSpan=Math.max(M.sweep*1.25,M.P*1.2);
  axes(ctx,db,0,tSpan,M.fLo,M.fHi,{xfmt:t=>fmt(t*1e3,0)+' ms',yfmt:t=>fmt(t,0),
    xlab:'time',ylab:'frequency, MHz',
    title:'the dynamic spectrum — DM = '+fmt(M.DM,3)+' pc cm⁻³'});
  {
    const t0=dmDelayAt(M.DM,M.fHi);
    const chH=db.h/nch;
    for(let k=0;k<nch;k++){
      const f0=M.fLo+(M.fHi-M.fLo)*k/nch, f1=M.fLo+(M.fHi-M.fLo)*(k+1)/nch;
      const fc=(f0+f1)/2;
      const tArr=dmDelayAt(M.DM,fc)-t0;
      const sm=channelSmear(M.DM,fc,f1-f0);
      const wpulse=Math.max(M.P*0.04,sm);
      const Y=db.y1-db.h*(fc-M.fLo)/(M.fHi-M.fLo);
      /* the pulse repeats every rotation */
      for(let rep=-2;rep<=4;rep++){
        const tc=tArr+rep*M.P;
        if(tc+wpulse<0||tc-wpulse>tSpan) continue;
        const X0=db.x+db.w*clamp((tc-wpulse/2)/tSpan,0,1);
        const X1=db.x+db.w*clamp((tc+wpulse/2)/tSpan,0,1);
        if(X1<=X0) continue;
        ctx.fillStyle=neonCss(0.15+0.7*(1-k/nch));
        ctx.fillRect(X0,Y-chH/2,Math.max(X1-X0,1.2),chH*0.92);
      }
    }
    frame(ctx,db,'#2b3243');
    /* the dispersion curve itself */
    const cx=[],cy=[];
    for(let i=0;i<=140;i++){
      const f=M.fLo+(M.fHi-M.fLo)*i/140;
      cx.push(dmDelayAt(M.DM,f)-t0); cy.push(f);
    }
    polyline(ctx,db,cx,cy,0,tSpan,M.fLo,M.fHi,rgba('#ffffff',0.55),1.4,[5,4]);
  }
  ctx.save();
  ctx.font='11px -apple-system, sans-serif'; ctx.fillStyle='#8b93a6';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText('sweep across the band: '+fmtSec(M.sweep)+' = '+fmt(M.sweep/M.P,2)+' rotations',
               db.x1-6,db.y+6);
  ctx.restore();

  /* ---- delay against frequency ---- */
  const fx=[],fy=[];
  for(let i=0;i<=200;i++){
    const f=M.fLo+(M.fHi-M.fLo)*i/200;
    fx.push(f); fy.push(dmDelayAt(M.DM,f)-dmDelayAt(M.DM,M.fHi));
  }
  axes(ctx,cb,M.fLo,M.fHi,0,Math.max(M.sweep*1.06,1e-9),
    {xfmt:t=>fmt(t,0),yfmt:t=>fmt(t*1e3,0)+' ms',
     xlab:'frequency, MHz',ylab:'extra delay',
     title:'Δt ∝ ν⁻², and that exponent is what makes DM measurable'});
  polyline(ctx,cb,fx,fy,M.fLo,M.fHi,0,Math.max(M.sweep*1.06,1e-9),'#5ac8e0',1.9);
  ctx.save();
  caption(ctx,cb.x,cb.y1+42,
    'A pulse leaves the star at every frequency at once. Free electrons between here and there '
    +'slow the low frequencies more, by exactly ν⁻², and the delay measures how many of them '
    +'are in the column — that is the dispersion measure, and it is the cheapest distance '
    +'estimate in radio astronomy. It also has to be removed before the pulse can be seen at '
    +'all: across this band the sweep is '+fmt(M.sweep/M.P,2)+' rotations, and within a single '
    +fmt(M.dfch,3)+' MHz channel the residual smearing is '+fmtSec(M.smear)+'.',
    cb.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view: the binary                                                   *
 * ================================================================== */
function drawBinary(ctx,W,H,M,S){
  const st=M.st, bn=M.bin;
  const padL=64, padR=330, padT=52, padB=124;
  const availW=Math.max(240,W-padL-padR), availH=Math.max(220,H-padT-padB);
  const gap=56;
  const leftW=Math.min(availH-40,Math.floor((availW-gap)*0.44));
  const ob=box(padL,padT,leftW,leftW);
  const rx=ob.x1+gap, rw=Math.max(160,availW-leftW-gap);
  const sb=box(rx,padT,rw,Math.max(150,availH-40));

  /* ---- the orbit, to scale ---- */
  const a=semiMajor(bn.Pb,bn.m1,bn.m2), e=bn.e;
  const bmin=a*Math.sqrt(1-e*e);
  {
    const R0=a*(1+e)*1.12;
    const sc=ob.w/(2*R0);
    /* the FOCUS is the physical centre, but centring the focus wastes half the
       box — offset by a*e so the ellipse itself is centred */
    const cx=ob.x+ob.w/2+sc*a*e, cy=ob.y+ob.h/2;
    frame(ctx,ob,'#242a3a');
    ctx.save();
    /* relative orbit */
    ctx.beginPath();
    for(let i=0;i<=200;i++){
      const th=TAU*i/200, r=a*(1-e*e)/(1+e*Math.cos(th));
      const X=cx+sc*r*Math.cos(th), Y=cy-sc*r*Math.sin(th);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath(); ctx.strokeStyle=rgba('#5ac8e0',0.85); ctx.lineWidth=1.6; ctx.stroke();
    /* A 0.1% shrink is sub-pixel and the dashed ellipse was invisible.  Draw a
       future orbit big enough to see and say WHEN it is, which is the more
       interesting number anyway. */
    const shrink=0.86;
    /* a ~ Pb^(2/3), so da/a = (2/3) dPb/Pb; invert for the time at this rate */
    const tShrink=(1-shrink)*1.5*bn.Pb/Math.abs(M.pbd);
    ctx.beginPath();
    for(let i=0;i<=200;i++){
      const th=TAU*i/200, r=shrink*a*(1-e*e)/(1+e*Math.cos(th));
      const X=cx+sc*r*Math.cos(th), Y=cy-sc*r*Math.sin(th);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath(); ctx.strokeStyle=rgba('#cd35c4',0.55); ctx.lineWidth=1.1;
    ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
    /* focus and the two stars at the current phase */
    ctx.fillStyle='#e8843a'; ctx.beginPath(); ctx.arc(cx,cy,4,0,TAU); ctx.fill();
    const th=S.orbPhase;
    const r=a*(1-e*e)/(1+e*Math.cos(th));
    const X=cx+sc*r*Math.cos(th), Y=cy-sc*r*Math.sin(th);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(X,Y,5,0,TAU); ctx.fill();
    ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#8b93a6';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('separation '+fmtLenM(r),cx,ob.y1-16);
    ctx.textBaseline='bottom';
    ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif'; ctx.textAlign='left';
    ctx.fillText('the orbit, to scale',ob.x,ob.y-6);
    ctx.restore();
    ctx.save();
    caption(ctx,ob.x,ob.y1+16,
      'a = '+fmtLenM(a)+', e = '+fmt(e,7)+' — the whole orbit would fit inside the Sun. '
      +'The dashed ellipse is the same orbit '+fmtTime(tShrink)+' from now at the present '
      +'rate of decay; the two stars finally meet in '+fmtTime(mergerTime(bn.Pb,e,bn.m1,bn.m2))+'.',
      ob.w,'#767e92');
    ctx.restore();
  }

  /* ---- the cumulative shift of periastron: the famous parabola ---- */
  const yrs=50;
  const xs=[],ys=[];
  for(let i=0;i<=200;i++){
    const t=yrs*YR*i/200;
    xs.push(1975+t/YR);
    ys.push(periastronShift(t,bn.Pb,M.pbd));
  }
  const ymin=Math.min.apply(null,ys);
  axes(ctx,sb,1975,1975+yrs,ymin*1.08,-ymin*0.06,
    {xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)+' s',
     xlab:'year',ylab:'cumulative shift of periastron',
     title:'general relativity, drawn — and this is a prediction with no free parameters'});
  polyline(ctx,sb,xs,ys,1975,1975+yrs,ymin*1.08,-ymin*0.06,'#b8ec4c',2.1);
  /* the "no decay" reference */
  polyline(ctx,sb,[1975,1975+yrs],[0,0],1975,1975+yrs,ymin*1.08,-ymin*0.06,
           rgba('#8b93a6',0.55),1.3,[6,4]);
  ctx.save();
  ctx.font='11px -apple-system, sans-serif';
  ctx.fillStyle='#8b93a6'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('if the orbit did not decay',sb.x+8,sb.y1-sb.h*(0-ymin*1.08)/(-ymin*1.14)+6);
  const ok=Math.abs(bn.ratio-1)<3*bn.rerr;
  ctx.fillStyle=ok?'#b8ec4c':'#e8843a';
  ctx.font='12px -apple-system, sans-serif'; ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText('observed / predicted = '+fmt(bn.ratio,4)+' ± '+fmt(bn.rerr,4),sb.x1-8,sb.y+8);
  ctx.restore();
  ctx.save();
  caption(ctx,sb.x,sb.y1+42,
    'Two neutron stars in a '+fmt(bn.Pb/3600,3)+'-hour orbit radiate gravitational waves, lose '
    +'energy, and fall together. The quadrupole formula predicts Ṗb = '+fmtExp(M.pbd,5)
    +' with no adjustable constant once the masses are known — '+fmt(-M.pbd*YR*1e6,1)
    +' microseconds a year, which accumulates into the parabola above. The measured shift '
    +'agrees to '+fmt(100*Math.abs(bn.ratio-1),1)+'%. This is the evidence gravitational waves '
    +'carry energy, and it arrived thirty years before one was caught directly.',
    sb.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view dispatch                                                      *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='star')            return drawStar(ctx,W,H,M,S);
  else if(v==='beam')       return drawBeam(ctx,W,H,M,S);
  else if(v==='diagram')    return drawDiagram(ctx,W,H,M);
  else if(v==='spindown')   return drawSpindown(ctx,W,H,M);
  else if(v==='dispersion') return drawDispersion(ctx,W,H,M);
  else if(v==='binary')     return drawBinary(ctx,W,H,M,S);
  return drawStar(ctx,W,H,M,S);
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.62,0.34,12.6,[0,0,0]);
  let M=null, t=0;
  const S={
    st,cam,phase:0,orbPhase:0,
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    fit(){ cam.target=[0,0,0]; cam.dist=clamp(2.7*LCW/(2*Math.tan(cam.fov/2))*1.05,5,80); },
    resetView(){ cam.theta=-0.62; cam.phi=0.34; S.fit(); },
    lookAxial(){ cam.theta=-0.62; cam.phi=1.40; S.fit(); },
    pointer(kind,d){
      if(kind!=='move') return;
      cam.theta-=d.dx*0.006;
      cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),3,260); },
    step(dt){
      if(!st.anim&&!st.spin) return;
      t+=dt*st.speed;
      if(st.anim){
        S.phase=(S.phase+dt*st.speed*1.5)%TAU;
        S.orbPhase=(S.orbPhase+dt*st.speed*0.9)%TAU;
      }
      if(st.spin) cam.theta+=dt*st.speed*0.14;
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{width:cam.W,height:cam.H};
      const Wd=r.width||cam.W, Hd=r.height||cam.H;
      cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  VIEWS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,idf,namef,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===idf(o)?' on':''),onclick:()=>{
        st[key]=idf(o); if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(idf(list[i])===st[key]?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},namef(o));
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }

  const gPsr=h('div',{class:'grp'},h('h3',null,'the pulsar'));
  gPsr.appendChild(chipRow(PSRS,'psr',p=>p.j,p=>p.b||p.j));
  const psrTag=h('div',{class:'src'}); gPsr.appendChild(psrTag);

  const gStar=h('div',{class:'grp'},h('h3',null,'the star'));
  gStar.appendChild(slider('Iunit','moment I',0.5,3,0.01,v=>fmt(v,2)+'×10⁴⁵'));
  gStar.appendChild(slider('Rkm','radius R',8,16,0.1,v=>fmt(v,1)+' km'));
  const starTag=h('div',{class:'tag'}); gStar.appendChild(starTag);

  const gGeo=h('div',{class:'grp'},h('h3',null,'geometry — not measured'));
  gGeo.appendChild(slider('alpha','inclination α',0,180,0.5,v=>fmt(v,1)+'°'));
  gGeo.appendChild(slider('zeta','sight line ζ',0,180,0.5,v=>fmt(v,1)+'°'));
  gGeo.appendChild(slider('rho','beam ρ',0.5,60,0.1,v=>fmt(v,1)+'°'));
  gGeo.appendChild(chipRow(BEAMS,'beamKind',o=>o.id,o=>o.name));
  gGeo.appendChild(slider('coneFrac','cone fraction',0,1,0.01,v=>fmt(v,2)));
  const geoTag=h('div',{class:'tag'}); gGeo.appendChild(geoTag);

  const gAge=h('div',{class:'grp'},h('h3',null,'the ledger'));
  gAge.appendChild(slider('nBrake','braking index n',1.2,5,0.01,v=>fmt(v,2)));
  gAge.appendChild(slider('P0ms','birth period P₀',0.1,200,0.1,v=>fmt(v,1)+' ms'));
  const ageTag=h('div',{class:'tag'}); gAge.appendChild(ageTag);

  const gDM=h('div',{class:'grp'},h('h3',null,'the receiver'));
  gDM.appendChild(slider('fLo','band low',50,3000,10,v=>fmt(v,0)+' MHz'));
  gDM.appendChild(slider('fHi','band high',60,3200,10,v=>fmt(v,0)+' MHz'));
  gDM.appendChild(slider('nchan','channels',4,64,1,v=>fmt(v,0)));
  const dmTag=h('div',{class:'tag'}); gDM.appendChild(dmTag);

  const gBin=h('div',{class:'grp'},h('h3',null,'the system'));
  gBin.appendChild(chipRow(BINARIES,'binary',o=>o.id,o=>o.name.replace('PSR ','')));
  const binTag=h('div',{class:'src'}); gBin.appendChild(binTag);

  const gDia=h('div',{class:'grp'},h('h3',null,'the diagram'));
  gDia.appendChild(h('div',{class:'checks'},
    checkbox('showNames','label the pulsars'),
    checkbox('showContours','field and age contours'),
    checkbox('showDeath','the death line')));
  gDia.appendChild(slider('deathK','B/P² threshold',0.2,10,0.05,v=>fmt(v,2)+'×10¹¹'));
  const diaTag=h('div',{class:'tag'}); gDia.appendChild(diaTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'the 3-D star'));
  const schecks=h('div',{class:'checks'},
    checkbox('showField','field lines'),
    checkbox('showLC','light cylinder'),
    checkbox('showCap','polar caps'),
    checkbox('showCone','emission cone'),
    checkbox('showSight','sight line'),
    checkbox('showGrid','floor grid'),
    checkbox('anim','animate'),
    checkbox('spin','auto-orbit'));
  gShow.appendChild(schecks);
  gShow.appendChild(slider('speed','speed',0.1,4,0.1,v=>fmt(v,1)+'×'));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.lookAxial(); dirty=true; refresh(); }},'look down the spin axis'),
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view')));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuild(); S.resetView();
                              syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gPsr,gStar,gGeo,gAge,gDM,gBin,gDia,gShow,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    const sets=[[gPsr,PSRS,'psr',p=>p.j],[gGeo,BEAMS,'beamKind',o=>o.id],
                [gBin,BINARIES,'binary',o=>o.id]];
    for(const [g,list,key,idf] of sets){
      const cw=g.querySelector('.chips'); if(!cw) continue;
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(idf(list[i])===st[key]?' on':''));
    }
  }
  function syncPanel(){
    const v=st.view;
    gPsr.hidden  = (v==='binary');
    gStar.hidden = (v==='binary'||v==='diagram');
    gGeo.hidden  = !(v==='star'||v==='beam');
    gAge.hidden  = (v!=='spindown');
    gDM.hidden   = (v!=='dispersion');
    gBin.hidden  = (v!=='binary');
    gDia.hidden  = (v!=='diagram');
    gShow.hidden = (v!=='star');
    rows.coneFrac.row.hidden = st.beamKind!=='cone';
    rows.speed.row.hidden = !(st.anim||st.spin);
    for(const k in rows) rows[k].sync();
    [].forEach.call(schecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showField','showLC','showCap','showCone','showSight','showGrid',
                      'anim','spin'][i]]; });
    [].forEach.call(gDia.querySelectorAll('input[type=checkbox]'),(inp,i)=>{
      inp.checked=st[['showNames','showContours','showDeath'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = (st.view==='star')
        ? 'drag to orbit · scroll to zoom · space stops the rotation · r resets'
        : st.view==='beam' ? 'slide α and ζ and watch the width and the swing move together'
        : st.view==='diagram' ? 'pick a pulsar from the panel to highlight it here'
        : st.view==='spindown' ? 'the two curves differ by the birth period alone'
        : st.view==='dispersion' ? 'narrow the channels until the smearing stops mattering'
        : 'a prediction with no free parameters, and it has held for fifty years';
      subEl.innerHTML = (st.view==='binary')
        ? 'two neutron stars, falling together at '+fmt(-M.pbd*YR*1e6,1)+' µs of orbit per year'
        : (M.hasPdot
          ? (M.p.b||M.p.j)+' &mdash; B = '+fmtGauss(M.B)+', age '+fmtTime(M.tauC)
          : (M.p.b||M.p.j)+' &mdash; P = '+fmtSec(M.P)+', spin-down not measured');
      psrTag.innerHTML='F₀ = <b>'+fmt(M.p.F0,M.p.F0>100?6:9)+'</b> Hz &nbsp; '
        +(M.hasPdot?'F₁ = <b>'+fmtExp(M.p.F1,3)+'</b>':'<span class="r">F₁ not measured</span>')
        +'<br>ATNF psrcat, transcribed verbatim; P and Ṗ are derived in code';
      starTag.innerHTML='R<sub>LC</sub> = <b>'+fmtLenM(M.RLC)+'</b> = '+fmt(M.RLC/M.R,0)
        +' R &nbsp; cap <b>'+fmt(M.capAng*RAD,2)+'°</b>'
        +'<br>equator at <b'+(M.betaEq>0.15?' class="r"':'')+'>'+fmt(M.betaEq,4)+'</b> c';
      geoTag.innerHTML='β = ζ − α = <b>'+fmt(M.beta*RAD,2)+'°</b> &nbsp; W = <b'
        +(M.hits?'':' class="r"')+'>'+(M.hits?fmt(M.W*RAD,2)+'°':'misses')+'</b>'
        +'<br>(dψ/dφ)<sub>max</sub> = <b>'+(isFinite(M.slope)?fmt(M.slope,2):'∞')+'</b>';
      ageTag.innerHTML=M.hasPdot
        ? 'true age <b>'+fmtTime(M.tAge)+'</b> vs τ<sub>c</sub> <b>'+fmtTime(M.tauC)+'</b>'
          +' &nbsp; ratio <b>'+fmt(M.tAge/M.tauC,3)+'</b>'
        : '<span class="r">Ṗ not measured — no age</span>';
      dmTag.innerHTML=M.DM>0
        ? 'sweep <b>'+fmtSec(M.sweep)+'</b> = <b>'+fmt(M.sweep/M.P,2)+'</b> rotations'
          +'<br>smearing per channel <b'+(M.smear>0.1*M.P?' class="r"':' class="g"')+'>'
          +fmtSec(M.smear)+'</b>'
        : '<span class="r">no DM catalogued for this object</span>';
      binTag.innerHTML=M.bin.src;
      diaTag.innerHTML='death line at B/P² = <b>'+fmt(st.deathK,2)+'×10¹¹</b> G s⁻²'
        +(M.hasPdot?'<br>this pulsar is <b'+(M.dead?' class="r">below':' class="g">above')
          +'</b> it':'');
      infoEl.innerHTML=INFO[st.view]||INFO.star;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it: the frame loop only
     redraws while something is animating, so every interaction that touches the
     camera must ask for a frame.  (steam_carnot_cycle.html Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='a'){ S.lookAxial(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=VIEWS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=VIEWS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    const live=(st.anim&&(st.view==='star'||st.view==='beam'||st.view==='binary'))
             ||(st.spin&&st.view==='star');
    if(live||dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

const INFO={
  star:'A neutron star is the collapsed core of a big star, and everything strange about it '
    +'follows from conservation. Angular momentum survived the collapse, so a 20-day rotation '
    +'became milliseconds; magnetic flux survived it, so a stellar field became 10<sup>12</sup> '
    +'gauss. The <b>light cylinder</b> is where corotation would need to exceed <i>c</i>: field '
    +'lines that reach past it cannot close, and those open lines — leaving through a polar cap '
    +'a few hundred metres across — carry everything we ever see. The magnetic axis is tilted '
    +'from the spin axis, so the beam sweeps, and a pulsar is only a pulsar for whoever happens '
    +'to be standing in it.',
  beam:'This is what a telescope records, and it is where the geometry is measured. The '
    +'<b>width</b> of the pulse fixes one combination of the inclination α, the sight line ζ '
    +'and the beam radius ρ. The <b>position-angle swing</b> beneath it fixes another: as the '
    +'beam crosses, the projected direction of the magnetic field rotates, and its steepest '
    +'gradient is exactly sin α / sin β. Two measurements, three unknowns — which is why the '
    +'literature contains disagreeing geometries for the same star, and why the numbers in this '
    +'panel are the one part of this file that is <b>not</b> a measurement.',
  diagram:'The single most useful plot in the subject, and it is just P against Ṗ. Because the '
    +'field goes as √(PṖ) and the age as P/Ṗ, both become straight lines here — which is the '
    +'only reason to draw it in logarithms. Pulsars are born in the top left with strong fields '
    +'and short periods, slide down and right as they radiate, and go quiet at the <b>death '
    +'line</b>. The island at the bottom left is not a young population: those are old stars '
    +'<b>spun back up</b> by accreting from a companion, which is why their fields are weak and '
    +'why they keep such extraordinary time.',
  spindown:'The ledger. A rotating magnet radiates, the energy comes out of the spin, and the '
    +'star slows. That single sentence gives the field, the age and the power — but only if you '
    +'assume the braking index is 3 and the star was born spinning infinitely fast, and neither '
    +'is true. Every pulsar with a measured index comes in <b>below 3</b>. The Crab is the case '
    +'that settles it: we know its birth year from a Chinese record of 1054, and reconciling '
    +'that with its measured index of 2.51 requires a birth period near <b>19 ms</b>, not zero.',
  dispersion:'Between here and the pulsar is a thin plasma, and a plasma is dispersive: the '
    +'group velocity depends on frequency, so a pulse that left the star all at once arrives '
    +'<b>later at lower frequencies</b>, by exactly ν⁻². The delay is proportional to the '
    +'number of electrons in the column, and that number — the <b>dispersion measure</b> — is '
    +'the cheapest distance estimate in radio astronomy. It is also a nuisance: across a wide '
    +'band the sweep can exceed a whole rotation, and unless it is removed the pulse is smeared '
    +'into nothing. This is the same physics that makes fast radio bursts measurable at all.',
  binary:'Two neutron stars in a close orbit are the cleanest gravitational-wave source that can '
    +'be watched for decades. General relativity says an accelerating mass quadrupole radiates, '
    +'the orbit loses energy, and the period shortens — and the <b>quadrupole formula</b> gives '
    +'the rate with no adjustable constant once the masses are known. For B1913+16 that is about '
    +'76 microseconds a year, which sounds unmeasurable and is not: pulsar timing counts '
    +'individual rotations, and the shift accumulates as <b>t²</b>. Fifty years of counting have '
    +'confirmed the prediction to a fraction of a percent.'};

/* ================================================================== *
 *  self-test                                                          *
 *                                                                     *
 *  Values marked (scipy) were computed OUTSIDE this file and pasted    *
 *  in.  The catalogue entries are the ATNF query's own F0/F1/DM, and   *
 *  everything derived from them is recomputed here rather than stored, *
 *  so these assertions test the physics, not the typing of a table.    *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,t,n)=>ok(Math.abs(a-b)<=t,n+'  (got '+a+', want '+b+', tol '+t+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.abs(b),
    n+'  (got '+a+', want '+b+', rel tol '+t+')');

  /* ---------- the field coefficient, DERIVED not copied -------------- */
  rel(B_COEFF_GAUSS,3.1996083063e19,1e-9,'the B coefficient derives to 3.1996e19 G (scipy)');
  ok(Math.abs(B_COEFF_GAUSS-3.2e19)/3.2e19<2e-3,'which is the textbook 3.2e19 to 0.2%');
  /* it must scale as sqrt(P Pdot) and as 1/R^3, sqrt(I) */
  {
    const b1=surfaceField(1,1e-15,I_NS,R_NS), b2=surfaceField(4,4e-15,I_NS,R_NS);
    rel(b2/b1,4,1e-12,'B scales as sqrt(P Ṗ)');
    rel(surfaceField(1,1e-15,I_NS,2*R_NS)/b1,1/8,1e-12,'and as R⁻³');
    rel(surfaceField(1,1e-15,4*I_NS,R_NS)/b1,2,1e-12,'and as √I');
    close(surfaceField(1,0,I_NS,R_NS),0,0,'and is zero when Ṗ is not measured');
  }

  /* ---------- the Crab, end to end, against scipy --------------------- */
  {
    const p=psrById('J0534+2200');
    const P=periodOf(p.F0), Pd=pdotOf(p.F0,p.F1);
    rel(P,3.339241230225889e-2,1e-14,'Crab P = 1/F₀ (scipy)');
    rel(Pd,4.209716096219071e-13,1e-13,'Crab Ṗ = −F₁/F₀² (scipy)');
    rel(surfaceField(P,Pd,I_NS,R_NS)*1e4,3.7935613906e12,1e-9,'Crab B = 3.79e12 G (scipy)');
    rel(charAge(P,Pd),3.9661121485e10,1e-9,'Crab τ_c = 1257 yr (scipy)');
    rel(spinDownLum(P,Pd,I_NS),4.4634344639e31,1e-9,'Crab Ė = 4.46e38 erg/s (scipy)');
    rel(eRot(P,I_NS),1.7702481651e42,1e-9,'Crab rotational energy (scipy)');
    rel(lightCylinder(P),1.5932672479e6,1e-10,'Crab light cylinder = 1593 km (scipy)');
    rel(polarCapAngle(P,R_NS)*RAD,4.5439513089,1e-9,'Crab polar cap = 4.544° (scipy)');
    rel(equatorBeta(P,R_NS),6.2764109492e-3,1e-10,'Crab equator at 0.0063 c (scipy)');
    rel(gjDensity(P,surfaceField(P,Pd,I_NS,R_NS)),7.8894644336e18,1e-8,
        'Crab Goldreich–Julian density (scipy)');
  }
  /* every catalogue entry must produce finite physics, or honestly nothing */
  {
    let bad=0, noPdot=0;
    for(const p of PSRS){
      const P=periodOf(p.F0), Pd=pdotOf(p.F0,p.F1);
      if(!(P>0)||!isFinite(P)) bad++;
      if(!(Pd>0)){ noPdot++;
        if(surfaceField(P,Pd,I_NS,R_NS)!==0) bad++;
        if(isFinite(charAge(P,Pd))) bad++;
        continue; }
      const B=surfaceField(P,Pd,I_NS,R_NS);
      if(!isFinite(B)||B<=0) bad++;
      if(!isFinite(charAge(P,Pd))||charAge(P,Pd)<=0) bad++;
      if(!isFinite(spinDownLum(P,Pd,I_NS))) bad++;
      if(!isFinite(lightCylinder(P))||lightCylinder(P)<=R_NS) bad++;
    }
    ok(bad===0,'all 23 catalogue entries produce finite physics');
    ok(noPdot===1,'and exactly one has no measured Ṗ (got '+noPdot+')');
    ok(PSRS.length===23,'the catalogue has 23 entries');
    /* the physical ranges these objects are supposed to span */
    let bmin=Infinity,bmax=0,pmin=Infinity,pmax=0;
    for(const p of PSRS){
      const P=periodOf(p.F0), Pd=pdotOf(p.F0,p.F1);
      pmin=Math.min(pmin,P); pmax=Math.max(pmax,P);
      if(Pd>0){ const B=surfaceField(P,Pd,I_NS,R_NS)*1e4;
        bmin=Math.min(bmin,B); bmax=Math.max(bmax,B); }
    }
    ok(pmin<2e-3&&pmax>10,'periods span milliseconds to ten seconds');
    ok(bmin<3e8&&bmax>1e15,'fields span 10⁸ G to above 10¹⁵ G — MSPs to magnetars');
  }

  /* ---------- ages: the characteristic age is a LIMIT, not a formula -- */
  {
    const P=1.0, Pd=1e-15;
    /* n -> 3 and P0 -> 0 must reproduce P/(2 Pdot); reached numerically */
    rel(trueAge(P,Pd,3,0),charAge(P,Pd),1e-14,'the n=3, P₀→0 age IS the characteristic age');
    for(const n of [2.9,2.99,2.999]) rel(trueAge(P,Pd,n,0),charAge(P,Pd),0.12,
      'and it is approached continuously from n = '+n);
    ok(trueAge(P,Pd,2.5,0)>charAge(P,Pd),'a smaller braking index means an older star');
    ok(trueAge(P,Pd,3,0.5)<charAge(P,Pd),'and a finite birth period means a younger one');
    /* round trip: birthPeriod inverts trueAge */
    for(const [n,P0] of [[3,0.02],[2.51,0.019],[4.2,0.3]]){
      const t=trueAge(P,Pd,n,P0);
      rel(birthPeriod(P,Pd,n,t),P0,1e-9,'birthPeriod inverts trueAge at n='+n);
    }
    /* and the forward track lands on the present period at the present age */
    for(const [n,P0] of [[3,0.02],[2.51,0.019],[4.2,0.3]]){
      const t=trueAge(P,Pd,n,P0);
      const Pd0=Pd*Math.pow(P0/P,2-n);
      rel(periodAt(P0,Pd0,n,t),P,1e-9,'the forward track returns P at t = age, n='+n);
    }
  }
  /* the Crab: its index and its birth year together fix the birth period */
  {
    const p=psrById('J0534+2200');
    const P=periodOf(p.F0), Pd=pdotOf(p.F0,p.F1);
    const t=(2026-1054)*YR;
    const P0=birthPeriod(P,Pd,2.51,t);
    ok(P0>0.017&&P0<0.021,'the Crab was born spinning at 19 ms, not at zero (got '
       +fmt(P0*1e3,2)+' ms)');
    /* for n < 3 the exponent (n-1) is below 2, so P/((n-1)Pdot) EXCEEDS P/(2Pdot) */
    ok(trueAge(P,Pd,2.51,0)>charAge(P,Pd),
       'n = 2.51 with P₀ → 0 gives an age above the characteristic age');
    ok(trueAge(P,Pd,3.5,0)<charAge(P,Pd),'and n = 3.5 gives one below it');
  }

  /* ---------- magnetosphere ------------------------------------------ */
  {
    rel(lightCylinder(1),C_LIGHT/TAU,1e-15,'R_LC = cP/2π');
    /* the polar cap is where the last closed line meets the surface */
    for(const P of [0.0015,0.033,1.34,8.5]){
      const th=polarCapAngle(P,R_NS);
      rel(Math.sin(th)*Math.sin(th),R_NS/lightCylinder(P),1e-12,
          'sin²θ_pc = R/R_LC at P='+P);
      ok(th>0&&th<PI/2,'and the cap angle is sane at P='+P);
    }
    ok(polarCapAngle(0.0015,R_NS)>polarCapAngle(1.34,R_NS),
       'a faster pulsar has a bigger polar cap');
    /* 2 pi R / (P c) with R = 10 km and P = 1.396 ms is 0.150, not the 0.24 that
       gets quoted — that figure assumes a radius nearer 16 km */
    rel(equatorBeta(periodOf(716.35556),R_NS),0.15013702343734092,1e-12,
        'the fastest known pulsar reaches 0.1501 c at the equator for a 10 km radius');
    rel(equatorBeta(periodOf(716.35556),1.6e4),0.24021923749974544,1e-12,'and 0.2402 c at 16 km');
    ok(equatorBeta(periodOf(716.35556),R_NS)<0.2,
       'which is NOT the 0.24 that gets quoted — that figure assumes a 16 km radius');
  }

  /* ---------- beam geometry ------------------------------------------ */
  {
    /* the two forms of the same identity, implemented separately */
    let worst=0;
    for(let i=0;i<400;i++){
      const rho=(2+38*((i*7)%97)/97)*DEG;
      const a=(5+170*((i*13)%89)/89)*DEG;
      const z=(5+170*((i*29)%83)/83)*DEG;
      const w1=pulseWidth(rho,a,z), w2=pulseWidthHalfAngle(rho,a,z);
      if(isFinite(w1)&&isFinite(w2)) worst=Math.max(worst,Math.abs(w1-w2));
      else ok(!isFinite(w1)===!isFinite(w2),'both width forms agree on whether the beam hits');
    }
    ok(worst<1e-12,'the two pulse-width identities agree to '+worst.toExponential(2));
    /* against scipy */
    rel(pulseWidth(10*DEG,45*DEG,50*DEG)*RAD,23.537780318681,1e-11,'W(10,45,50) (scipy)');
    rel(pulseWidth(12*DEG,60*DEG,65*DEG)*RAD,24.620894088039,1e-11,'W(12,60,65) (scipy)');
    rel(pulseWidth(5*DEG,30*DEG,32*DEG)*RAD,17.816707376879,1e-11,'W(5,30,32) (scipy)');
    /* beamRadius inverts pulseWidth */
    for(const [r,a,z] of [[10,45,50],[7,80,84],[25,30,20]]){
      const W=pulseWidth(r*DEG,a*DEG,z*DEG);
      rel(beamRadius(W,a*DEG,z*DEG)*RAD,r,1e-9,'beamRadius inverts the width at ρ='+r);
    }
    /* a beam smaller than the impact angle cannot be seen */
    ok(!isFinite(pulseWidth(3*DEG,45*DEG,60*DEG)),'a 3° beam misses a 15° impact angle');
    ok(isFinite(pulseWidth(20*DEG,45*DEG,60*DEG)),'a 20° beam does not');
    /* an aligned rotator: the sight line never leaves the beam, or never enters */
    ok(pulseWidth(30*DEG,1e-9,1e-9)!==undefined,'the aligned case does not throw');
  }

  /* ---------- the profile width at the level Theta = rho ------------- *
   * The analytic W is the phase range with Theta < rho.  It is NOT the FWHM of
   * the observed profile: the peak occurs at Theta = |beta|, not at zero, so
   * the observed half-maximum sits further out and the observed FWHM is wider.
   * Asserting the wrong one of those was a real error in the first draft, and
   * the test caught it — the right statement is the width at the level the
   * beam has AT its own edge. */
  {
    for(const [r,a,z] of [[10,45,50],[15,60,65],[8,80,86],[25,40,30],[12,20,25]]){
      const n=6001;
      const ph=new Float64Array(n), y=new Float64Array(n);
      let mx=0;
      for(let i=0;i<n;i++){
        const f=-PI+TAU*i/(n-1);
        ph[i]=f; y[i]=profileAt(f,a*DEG,z*DEG,r*DEG,'pencil');
        if(y[i]>mx) mx=y[i];
      }
      for(let i=0;i<n;i++) y[i]/=mx;
      const lvl=beamIntensity(r*DEG,r*DEG,'pencil')/mx;      /* = 0.5/mx */
      const w=measuredWidthAt(ph,y,lvl);
      const W=pulseWidth(r*DEG,a*DEG,z*DEG);
      rel(w,W,1e-3,'the profile width at Θ = ρ equals the analytic W (ρ='+r+', α='+a+', ζ='+z+')');
      /* and the observed FWHM is genuinely WIDER, which is the trap */
      const fw=measuredFWHM(ph,y);
      ok(fw>W*1.0001,'while the observed FWHM is wider than W, as it must be (ρ='+r+')');
    }
    /* the level itself: a pencil beam is at exactly half its on-axis value at rho */
    close(beamIntensity(0,0.2,'pencil'),1,1e-15,'the pencil beam is 1 on the magnetic axis');
    close(beamIntensity(0.2,0.2,'pencil'),0.5,1e-15,'and exactly 1/2 at Θ = ρ');
    /* the hollow cone peaks ON the ring instead */
    ok(beamIntensity(0.2,0.2,'cone',1)>beamIntensity(0,0.2,'cone',1),
       'the hollow cone peaks at Θ = ρ, not on the axis');
  }

  /* ---------- the rotating vector model ------------------------------ */
  {
    for(const [a,z,v] of [[45,50,8.113140441403],[60,65,9.936527146488],
                          [30,32,14.326854173922],[60,55,-9.936527146488]])
      rel(rvmSlope(a*DEG,z*DEG),v,1e-11,'rvmSlope('+a+','+z+') = sin α/sin β (scipy)');
    /* and that constant must be the actual gradient of the model, both signs */
    for(const [a,z] of [[45,50],[30,32],[80,95],[60,55],[20,19],[10,40]]){
      const ar=a*DEG, zr=z*DEG, hstep=1e-6;
      const d=(paRVMprincipal(hstep,ar,zr)-paRVMprincipal(-hstep,ar,zr))/(2*hstep);
      rel(d,rvmSlope(ar,zr),1e-6,'the RVM gradient at φ=0 is sin α/sin β for α='+a+', ζ='+z);
    }
    close(paRVMprincipal(0,45*DEG,50*DEG),0,1e-15,'the swing passes through zero at φ=0');
    /* an orthogonal rotator seen edge on swings through 180 degrees */
    ok(Math.abs(rvmSlope(90*DEG,90.001*DEG))>1e4,'β→0 makes the swing vertical');
    /* beta EXACTLY zero is a genuine singularity — the swing is a step — and it
       must yield the one-sided limits rather than a NaN that poisons the array */
    /* At zeta = alpha both numerator and denominator vanish like phi and phi^2/2,
       so the limit is atan(2/(cos a . phi)) = pi/2 - |cos a| phi/2 — asserting
       "it reaches 90 degrees" to 1e-6 at phi = 0.01 asserts the wrong thing, and
       the analytic limit is a far stronger check on the regularisation. */
    for(const a of [30,60,90,120]) for(const f of [1e-2,1e-3,1e-4]){
      const pa=paRVMprincipal(f,a*DEG,a*DEG), pb=paRVMprincipal(-f,a*DEG,a*DEG);
      ok(isFinite(pa)&&isFinite(pb),'the RVM is finite either side of β = 0 at α='+a);
      ok(Math.abs(pa+pb)<1e-12,'and antisymmetric about the centre, α='+a);
      /* the next term of atan(1/x) is O(phi^3), so the tolerance has to carry it */
      close(Math.abs(pa),PI/2-Math.abs(Math.cos(a*DEG))*f/2,1e-9+f*f*f,
            'matching the analytic limit π/2 − |cos α|φ/2 at α='+a+', φ='+f);
    }
    for(const a of [30,60,90,120])
      close(paRVMprincipal(0,a*DEG,a*DEG),0,1e-12,'with the centre taken as 0, α='+a);
  }

  /* ---------- dispersion --------------------------------------------- */
  {
    rel(DM_CONST,4148.8064238900,1e-10,'the dispersion constant derives to 4148.8064 (scipy)');
    ok(Math.abs(DM_CONST-4148.808)/4148.808<1e-6,'which is the canonical 4148.808 to 1e-6');
    rel(dispersionDelay(56.77118,400,1400),1.351909264338,1e-10,
        'Crab 400→1400 MHz sweep = 1.3519 s (scipy)');
    rel(dmDelayAt(56.77118,300),2.617029291954,1e-10,'and 2.617 s at 300 MHz (scipy)');
    /* the nu^-2 law itself */
    rel(dmDelayAt(100,200)/dmDelayAt(100,400),4,1e-13,'halving the frequency quadruples the delay');
    rel(dispersionDelay(200,400,1400)/dispersionDelay(100,400,1400),2,1e-13,
        'and the delay is linear in DM');
    /* channel smearing is the derivative of the delay across the channel */
    for(const f of [150,400,1400]){
      const df=1e-4*f;
      const exact=dmDelayAt(50,f-df/2)-dmDelayAt(50,f+df/2);
      rel(channelSmear(50,f,df),exact,1e-6,'channel smearing is dΔt/dν · δν at '+f+' MHz');
    }
  }

  /* ---------- gravitational radiation -------------------------------- */
  {
    const b=binaryById('ht');
    rel(eccFactor(b.e),11.856836688170,1e-11,'f(e) for B1913+16 = 11.857 (scipy)');
    rel(eccFactor(0),1,1e-15,'and f(0) = 1 for a circular orbit');
    rel(pbdotGR(b.Pb,b.e,b.m1,b.m2),-2.401917982350e-12,1e-10,
        'the quadrupole formula gives Ṗb = −2.4019e-12 (scipy)');
    ok(Math.abs(pbdotGR(b.Pb,b.e,b.m1,b.m2)/-2.40263e-12-1)<1e-3,
       'which is the published −2.40263e-12 to 0.1% — the residue is the masses');
    rel(semiMajor(b.Pb,b.m1,b.m2),1.9490320944e9,1e-9,'a = 1.949e9 m (scipy)');
    rel(mergerTime(b.Pb,b.e,b.m1,b.m2),9.6478290395e15,1e-9,'merger in 306 Myr (scipy)');
    const d=binaryById('dp');
    rel(pbdotGR(d.Pb,d.e,d.m1,d.m2),-1.247772225994e-12,1e-9,
        'and the double pulsar gives −1.2478e-12 (scipy)');
    /* scalings that pin the exponents */
    rel(pbdotGR(2*b.Pb,0,1,1)/pbdotGR(b.Pb,0,1,1),Math.pow(2,-5/3),1e-12,
        'Ṗb scales as Pb^(-5/3)');
    rel(pbdotGR(b.Pb,0,2,2)/pbdotGR(b.Pb,0,1,1),Math.pow(2,2)/Math.pow(2,1/3),1e-12,
        'and as m1 m2 (m1+m2)^(-1/3)');
    ok(pbdotGR(b.Pb,b.e,b.m1,b.m2)<pbdotGR(b.Pb,0,b.m1,b.m2),
       'an eccentric orbit decays faster than a circular one of the same period');
    rel(aDot(b.Pb,b.e,b.m1,b.m2)/semiMajor(b.Pb,b.m1,b.m2),
        (2/3)*pbdotGR(b.Pb,b.e,b.m1,b.m2)/b.Pb,1e-12,'ȧ/a = (2/3) Ṗb/Pb');
    /* the observed/predicted ratios must be consistent with GR */
    for(const bb of BINARIES)
      ok(Math.abs(bb.ratio-1)<3*bb.rerr,bb.name+' agrees with GR within 3σ');
  }

  /* ---------- the death line ----------------------------------------- */
  {
    const j=psrById('J2144-3933'), cr=psrById('J0534+2200');
    const Pj=periodOf(j.F0), Pdj=pdotOf(j.F0,j.F1);
    const Pc=periodOf(cr.F0), Pdc=pdotOf(cr.F0,cr.F1);
    ok(Pdj<deathPdot(Pj),'J2144−3933 sits BELOW the death line — and radiates anyway');
    ok(Pdc>deathPdot(Pc),'the Crab sits far above it');
    /* the line is B/P^2 = const by construction */
    for(const P of [0.1,1,8.5]){
      const Pd=deathPdot(P);
      rel(surfaceField(P,Pd,I_NS,R_NS)*1e4/(P*P),DEATH_BP2,1e-9,
          'the death line is exactly B/P² = 2e11 G s⁻² at P='+P);
    }
  }

  /* ---------- panels build clean ------------------------------------- */
  for(const view of ['star','beam','diagram','spindown','dispersion','binary']){
    for(const j of ['J0534+2200','J1748-2446ad','J1808-2024','J2144-3933','J0437-4715']){
      const s=Object.assign({},DEFAULTS,{view,psr:j,nProf:81});
      const M=buildModel(s);
      const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
      ok(html.length>200&&html.indexOf('NaN')<0&&html.indexOf('undefined')<0,
         'panels build clean for '+view+' / '+j);
      ok(eqbarText(M).indexOf('NaN')<0,'headless summary is clean for '+view+' / '+j);
    }
  }
  /* every pulsar, every binary, and extreme geometries */
  {
    let bad=0;
    for(const p of PSRS){
      const M=buildModel(Object.assign({},DEFAULTS,{psr:p.j,nProf:41}));
      const t=eqbarText(M);
      if(t.indexOf('NaN')>=0||t.indexOf('undefined')>=0) bad++;
      if(!M.prof.inten.every(isFinite)) bad++;
    }
    ok(bad===0,'every catalogue entry renders a clean panel and a finite profile');
    let bad2=0;
    for(const a of [0,0.5,90,179.5,180]) for(const z of [0,0.5,90,179.5,180])
      for(const r of [0.5,30,60]){
        const M=buildModel(Object.assign({},DEFAULTS,{alpha:a,zeta:z,rho:r,nProf:41}));
        if(!M.prof.inten.every(isFinite)) bad2++;
        if(!M.prof.pa.every(isFinite)) bad2++;
        if(eqbarText(M).indexOf('NaN')>=0) bad2++;
      }
    ok(bad2===0,'and no geometry in the slider ranges — including the aligned and orthogonal '
       +'limits — produces a non-finite profile or a NaN in the panel');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
