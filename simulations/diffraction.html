<title>Diffraction — single slit, double slit, and the integral behind both</title>
<!--
  ===================================================================
  DIFFRACTION
  single slit, double slit, gratings, circular apertures, near field
  ===================================================================

  Fifth in the optics/flow group of this collection, and built to the same
  house rules as steam_carnot_cycle.html, shock_flow.html, turbojet.html and
  wind_tunnel.html: one flat file, no build step, no network, works opened
  straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS SOLVES
  ------------------------------------------------------------------
  Scalar diffraction of a monochromatic wave through an aperture, by three
  routes, all three live at once so they can be watched disagreeing:

    (1) FRAUNHOFER — the far-field closed forms.  For a slit of width a,
        I/I0 = sinc^2(beta), beta = pi a sin(theta) / lambda.  For N slits of
        width a on pitch d, that envelope multiplied by the grating factor
        [sin(N gamma) / sin(gamma)]^2 / N^2, gamma = pi d sin(theta) / lambda.
        For a circular aperture of diameter D, the Airy form [2 J1(v)/v]^2 with
        v = pi D sin(theta) / lambda.

    (2) FRESNEL — the near-field closed form, in terms of the Fresnel integrals
        C(u) and S(u).  A slit running from x1 to x2 gives, at screen point x,
        I/I0 = 1/2 [ (C(u2)-C(u1))^2 + (S(u2)-S(u1))^2 ],
        u_i = (x_i - x) sqrt(2 / (lambda z)),
        which is exactly the chord of the Cornu spiral drawn in "near field".

    (3) RAYLEIGH-SOMMERFELD — no far-field assumption and no paraxial
        assumption, integrated numerically over the open aperture:
        U(x) = INT A(x') (z/r) H0(k r) dx',  r = sqrt(z^2 + (x-x')^2),
        with the large-argument Hankel form sqrt(2/(pi k r)) exp(i(kr - pi/4)),
        i.e. amplitude (z/r) r^(-1/2).  The slit is taken infinite in y, so this
        is the cylindrical-wave kernel; the only approximation left is k r >> 1,
        and k r here is of order 1e10.  The obliquity factor z/r is kept, which
        is the term the paraxial forms throw away and the reason (3) parts
        company with (1) and (2) at wide angle.

  Everything drawn is one of those three.  Which one is in use is printed on the
  canvas at all times, and "auto" picks by Fresnel number.

  ------------------------------------------------------------------
  WHAT IS MEASURED AND WHAT IS COMPUTED
  ------------------------------------------------------------------
  This sim is in the happy position that its calibration data are mathematical
  constants rather than somebody's scanned figure, and it is worth saying which
  is which.

  COMPUTED EXACTLY, and asserted against values obtained OUTSIDE this file
  (scipy 1.18 / numpy 2.5, run separately; the numbers are quoted in selfTest
  with the routine that produced them):

    j(1,1) = 3.831705970207512   -> Rayleigh criterion 1.219669891266504 l/D
    encircled energy inside the Airy disc          0.837784869173314
    Airy FWHM                                      1.028993969962   l/D
    Sparrow two-point limit                        0.947155238896   l/D
    intensity dip at Rayleigh separation           0.735031662423
    sinc^2 first sidelobe                          0.0471904492258113
    sinc^2 FWHM                                    0.885892941379   l/a
    straight-edge first maximum       I = 1.370442919703 at w = 1.217198238662
    straight edge at the geometric shadow edge     exactly 1/4
    circular aperture, on axis, I/I0 = 4 sin^2(pi NF / 2)   -- exact, verified
        against a direct radial Fresnel integral to 1e-10 at eight NF

  MEASURED, and cited: the spectral lines in "the grating".  Wavelengths of
  atomic transitions are among the best-measured numbers in physics, and they
  are used here as a real calibration -- the sodium doublet at 588.9950 and
  589.5924 nm (NIST ASD, air) needs a resolving power of 986.5, so a 600 l/mm
  grating in first order resolves it if and only if the beam covers at least
  986.5/600 = 1.64 mm of grating.  The sim computes that and says whether it is
  resolved, which is a claim that can be checked on a bench.

  MODELLED, and labelled as such on the canvas: the true-colour rendering.
  Wavelength -> CIE 1931 XYZ uses the multi-lobe Gaussian fit of Wyman, Sloan &
  Shirley, "Simple Analytic Approximations to the CIE XYZ Color Matching
  Functions", JCGT 2:2 (2013), then the standard sRGB matrix and D65 white.
  Spectral colours are outside the sRGB gamut, so out-of-gamut components are
  desaturated toward white -- a monochromatic red on a monitor is a lie, and the
  colour key says so.

  ------------------------------------------------------------------
  SPECIAL FUNCTIONS
  ------------------------------------------------------------------
  J0 and J1: power series for |x| < 15, Hankel asymptotic with four terms of
  each of P and Q above that.  Fresnel C and S: the Boersma/Numerical-Recipes
  scheme -- power series below u = 1.6, Lentz continued fraction above.  Both
  are asserted against scipy values at a dozen arguments, including across
  their own crossovers, which is where a hand-rolled special function actually
  breaks.

  ------------------------------------------------------------------
  WHAT IS NOT MODELLED
  ------------------------------------------------------------------
  Polarisation (this is scalar theory throughout; for a slit a few wavelengths
  wide the vector solution differs and the file says so where it matters),
  partial coherence and finite source size, the finite conductivity and
  thickness of the aperture screen, and any material dispersion.  The two-point
  resolution demonstration is incoherent; two mutually coherent points give a
  different and separation-dependent answer.

  ------------------------------------------------------------------
  CAMERA / RENDERING
  ------------------------------------------------------------------
  Hand-rolled z-up orbit camera and perspective projection, painter's algorithm,
  canvas 2-D -- identical to lattice.html, steam_carnot_cycle.html and
  wind_tunnel.html.  Mathematica NeonColors (same NEON_STOPS table) for scalar
  ramps; true spectral colour where the thing being drawn IS a colour.

  The bench view compresses the optical axis: an aperture 100 um across and a
  screen 2 m away cannot share a scale.  The compression factor is printed on
  the canvas rather than hidden.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  colour science:  wavelength -> CIE 1931 XYZ -> sRGB                *
 *                                                                     *
 *  The colour matching functions are the multi-lobe Gaussian fit of    *
 *  Wyman, Sloan & Shirley, "Simple Analytic Approximations to the CIE  *
 *  XYZ Color Matching Functions", Journal of Computer Graphics         *
 *  Techniques 2:2 (2013), Table 1 — an analytic fit, not the tabulated *
 *  standard observer, and the file says so on the canvas.              *
 *                                                                     *
 *  Spectral colours lie outside the sRGB gamut, so this CANNOT be an   *
 *  accurate rendering of a laser line; out-of-gamut components are     *
 *  desaturated toward white, which is the standard compromise and the  *
 *  reason a 632.8 nm HeNe looks pinker on screen than on the bench.    *
 * ================================================================== */
function gauss(x,mu,s1,s2){
  const s=(x<mu)?s1:s2, t=(x-mu)/s;
  return Math.exp(-0.5*t*t);
}
function cieXYZ(nm){
  const X= 1.056*gauss(nm,599.8,37.9,31.0)
          +0.362*gauss(nm,442.0,16.0,26.7)
          -0.065*gauss(nm,501.1,20.4,26.2);
  const Y= 0.821*gauss(nm,568.8,46.9,40.5)
          +0.286*gauss(nm,530.9,16.3,31.1);
  const Z= 1.217*gauss(nm,437.0,11.8,36.0)
          +0.681*gauss(nm,459.0,26.0,13.8);
  return [X,Y,Z];
}
/* sRGB (IEC 61966-2-1) primaries, D65.  The matrix times the D65 white point
   returns (1,1,1) to 2e-4, which selfTest asserts — a transposed or mistyped
   matrix fails that immediately and silently passes everything else. */
const SRGB_M=[[ 3.2406,-1.5372,-0.4986],
              [-0.9689, 1.8758, 0.0415],
              [ 0.0557,-0.2040, 1.0570]];
function srgbGamma(u){
  u=clamp(u,0,1);
  return u<=0.0031308 ? 12.92*u : 1.055*Math.pow(u,1/2.4)-0.055;
}
/* linear sRGB for a monochromatic line, normalised to peak 1 and desaturated
   into gamut.  Returns null-free [r,g,b] in 0..1 (linear, pre-gamma). */
function spectralLinear(nm){
  const xyz=cieXYZ(nm);
  let r=SRGB_M[0][0]*xyz[0]+SRGB_M[0][1]*xyz[1]+SRGB_M[0][2]*xyz[2];
  let g=SRGB_M[1][0]*xyz[0]+SRGB_M[1][1]*xyz[1]+SRGB_M[1][2]*xyz[2];
  let b=SRGB_M[2][0]*xyz[0]+SRGB_M[2][1]*xyz[1]+SRGB_M[2][2]*xyz[2];
  const lo=Math.min(r,g,b);
  if(lo<0){ r-=lo; g-=lo; b-=lo; }          // desaturate toward white
  const hi=Math.max(r,g,b,1e-12);
  return [r/hi,g/hi,b/hi];
}
/* wavelength + relative intensity -> a CSS colour.  Intensity is applied in
   LINEAR light and gamma-encoded afterwards, which is the whole point of doing
   this properly: scaling the 8-bit values instead makes a half-intensity fringe
   look far too bright. */
function spectralCss(nm,inten){
  const c=spectralLinear(nm), I=clamp(inten,0,1);
  return 'rgb('+Math.round(255*srgbGamma(c[0]*I))+','
               +Math.round(255*srgbGamma(c[1]*I))+','
               +Math.round(255*srgbGamma(c[2]*I))+')';
}
/* the false-colour alternative: NeonColors ramp, for when the eye needs to read
   a MAGNITUDE rather than recognise a colour */
function falseCss(inten){ return neonCss(clamp(inten,0,1)); }

/* ================================================================== *
 *  special functions                                                  *
 *                                                                     *
 *  Hand-rolled because the file may not load anything.  Both are       *
 *  asserted in selfTest against values computed OUTSIDE this file      *
 *  (scipy.special), at arguments that straddle their own crossovers —  *
 *  which is the only place a piecewise special function ever breaks.   *
 * ================================================================== */

/* Bessel J of order 0 and 1, to about 1e-10 absolute — which is eight orders
   finer than anything this file draws or asserts, and the crossover is placed
   where the two branches are equally bad rather than where either is good.

   |x| < J_SPLIT : ascending power series.  It loses roughly one digit per two
   units of x to cancellation (at x = 17 the largest term is 4.6e5 against a
   result of order 1e-2, so ~5e-11 survives).
   |x| >= J_SPLIT: Hankel asymptotic, A&S 9.2.5-9.2.10, carried to eight terms.
   The terms bottom out at ~2e-10 there and then diverge, as an asymptotic
   series must, so eight is not a budget — it is where it stops helping.

   selfTest asserts continuity ACROSS the join, which is the only place a
   piecewise special function is ever actually wrong. */
const J_SPLIT=17.0;
function besselAsym(nu,x){
  const mu=4*nu*nu, w=8*x;
  /* t_j = prod_{i<=j} (mu - (2i-1)^2) / (j! w^j); even j build P, odd j build Q,
     each with its own alternating sign. */
  let P=1, Q=0, t=1;
  for(let j=1;j<=8;j++){
    t*=(mu-(2*j-1)*(2*j-1))/(j*w);
    if(j%2===0) P+=(((j/2)%2)?-1:1)*t;
    else        Q+=((((j-1)/2)%2)?-1:1)*t;
  }
  const chi=x-(2*nu+1)*PI/4;
  return Math.sqrt(2/(PI*x))*(P*Math.cos(chi)-Q*Math.sin(chi));
}
function besselJ0(x){
  x=Math.abs(x);
  if(x<J_SPLIT){
    const y=x*x/4; let term=1, s=1;
    for(let k=1;k<80;k++){ term*=-y/(k*k); s+=term;
      if(Math.abs(term)<1e-18*Math.abs(s)) break; }
    return s;
  }
  return besselAsym(0,x);
}
function besselJ1(x){
  const sg=x<0?-1:1; x=Math.abs(x);
  if(x<J_SPLIT){
    const y=x*x/4; let term=1, s=1;
    for(let k=1;k<80;k++){ term*=-y/(k*(k+1)); s+=term;
      if(Math.abs(term)<1e-18*Math.abs(s)) break; }
    return sg*(x/2)*s;
  }
  return sg*besselAsym(1,x);
}

/* Fresnel integrals  C(u) = INT_0^u cos(pi t^2/2) dt,  S(u) = INT_0^u sin(...).
   Boersma / Numerical Recipes scheme: ascending series below u = 1.6, and above
   it the Lentz continued fraction for the complex Fresnel integral
      C + iS = (1+i)/2 [ 1 - exp(i pi u^2 / 2) h ]
   evaluated with a complex modified Lentz algorithm.  Full double precision on
   both branches; selfTest checks twelve arguments including 1.5, 1.6 and 2.0,
   which sit either side of the join. */
function fresnelCS(x){
  const ax=Math.abs(x), EPS=1e-16, XMIN=1.6, MAXIT=140;
  let c,s;
  if(ax<1e-30){ c=ax; s=0; }
  else if(ax<=XMIN){
    let sum=0,sums=0,sumc=ax,sign=1,fact=(PI/2)*ax*ax,odd=true,term=ax,n=3;
    for(let k=1;k<=MAXIT;k++){
      term*=fact/k;
      sum+=sign*term/n;
      const test=Math.abs(sum)*EPS;
      if(odd){ sign=-sign; sums=sum; sum=sumc; }
      else   { sumc=sum;  sum=sums; }
      if(term<test) break;
      odd=!odd; n+=2;
    }
    s=sums; c=sumc;
  } else {
    const pix2=PI*ax*ax;
    let br=1, bi=-pix2;
    let cr=1e300, ci=0;
    let den=br*br+bi*bi;
    let dr=br/den, di=-bi/den;
    let hr=dr, hi=di;
    let n=-1;
    for(let k=2;k<=MAXIT;k++){
      n+=2;
      const a=-n*(n+1);
      br+=4;
      let tr=a*dr+br, ti=a*di+bi;              /* d <- 1/(a d + b) */
      den=tr*tr+ti*ti; dr=tr/den; di=-ti/den;
      den=cr*cr+ci*ci;                         /* c <- b + a/c     */
      cr=br+a*cr/den; ci=bi-a*ci/den;
      const delr=cr*dr-ci*di, deli=cr*di+ci*dr;
      tr=hr*delr-hi*deli; ti=hr*deli+hi*delr;  /* h <- h * del     */
      hr=tr; hi=ti;
      if(Math.abs(delr-1)+Math.abs(deli)<EPS) break;
    }
    const tr=ax*hr+ax*hi, ti=ax*hi-ax*hr;      /* h <- (ax - i ax) h */
    hr=tr; hi=ti;
    const cw=Math.cos(0.5*pix2), sw=Math.sin(0.5*pix2);
    const er=cw*hr-sw*hi, ei=cw*hi+sw*hr;      /* e^(i pi u^2/2) h   */
    const ur=1-er, ui=-ei;
    c=0.5*ur-0.5*ui;                           /* (1+i)/2 * (1 - ...) */
    s=0.5*ui+0.5*ur;
  }
  if(x<0){ c=-c; s=-s; }
  return [c,s];
}

/* ================================================================== *
 *  the three propagators                                              *
 * ================================================================== */

/* sinc^2 with the series near zero — sin(b)/b at b = 1e-160 is 0/0 */
function sinc2(b){
  const ab=Math.abs(b);
  if(ab<1e-4){ const b2=b*b; return 1-b2/3+2*b2*b2/45; }
  const s=Math.sin(b)/b; return s*s;
}
/* the N-slit interference factor, NORMALISED so its principal maxima are 1.
   Near gamma = m pi both sin(N g) and sin(g) vanish; the expansion
   1 - (N^2-1) sin^2 g / 3 is used there, which is exact to O(eps^4). */
function gratingFactor(g,N){
  if(N<=1) return 1;
  const sg=Math.sin(g);
  if(Math.abs(sg)<1e-5) return 1-(N*N-1)*sg*sg/3;
  const r=Math.sin(N*g)/sg;
  return r*r/(N*N);
}
/* Airy:  [2 J1(v)/v]^2, unity at v = 0 */
function airyI(v){
  const av=Math.abs(v);
  if(av<1e-4){ const v2=v*v; return 1-v2/4+v2*v2/12; }
  const t=2*besselJ1(v)/v; return t*t;
}

/* ---- (1) Fraunhofer ------------------------------------------------ *
 * sinTh is the true sine of the diffraction angle, not xi/z: the closed
 * forms are exact in sin(theta), and using the tangent instead quietly
 * misplaces every order once the pattern is more than a few degrees wide. */
function fraunhofer(sinTh,ap){
  if(ap.kind==='circle') return airyI(PI*ap.D*sinTh/ap.lam);
  const b=PI*ap.a*sinTh/ap.lam;
  const env=sinc2(b);
  if(ap.N<=1) return env;
  const g=PI*ap.d*sinTh/ap.lam;
  return env*gratingFactor(g,ap.N);
}

/* ---- (2) Fresnel, via C and S -------------------------------------- *
 * Exactly the Cornu-spiral chord: the field contributed by one open
 * interval is the vector from u1 to u2 along the spiral. */
function fresnelSlits(xi,ap){
  const kf=Math.sqrt(2/(ap.lam*ap.z));
  let cr=0, ci=0;
  for(let i=0;i<ap.open.length;i++){
    const iv=ap.open[i];
    const A=fresnelCS((iv[0]-xi)*kf), B=fresnelCS((iv[1]-xi)*kf);
    cr+=B[0]-A[0]; ci+=B[1]-A[1];
  }
  return 0.5*(cr*cr+ci*ci);
}
/* the straight edge, as its own closed form: w > 0 is inside the lit region.
   I(0) = 1/4 exactly at the geometric shadow boundary. */
function edgeFresnel(w){
  const F=fresnelCS(w);
  return 0.5*((0.5+F[0])*(0.5+F[0])+(0.5+F[1])*(0.5+F[1]));
}

/* ---- (3) Rayleigh-Sommerfeld, integrated ---------------------------- *
 *
 * Filon-type quadrature: on each panel the PHASE is linearised and the
 * resulting integral  INT exp(i(p + q t)) dt  is done in closed form, giving
 * the factor sin(u)/u with u = q dx / 2.  The panel count is therefore set by
 * the CURVATURE of the phase, not by its total range.  That is the whole
 * difference between a usable integral and an unusable one here: a sampler
 * that must advance the phase by less than pi per step needs ~1300 points for
 * a 100 um slit at 633 nm and 2 m, and this needs 24.
 *
 * The kernel is the cylindrical (2-D) Rayleigh-Sommerfeld first-kind Green's
 * function with the large-argument Hankel form,
 *      (z/r) * sqrt(2/(pi k r)) exp(i(k r - pi/4)),
 * so the amplitude carried below is (z/r) r^(-1/2); the constant
 * sqrt(2/(pi k)) exp(-i pi/4) is common to every element and drops out when
 * the pattern is normalised.  k r here is of order 1e10, so the asymptotic is
 * not a meaningful approximation.  The obliquity factor z/r is KEPT — it is
 * the term the paraxial forms discard, and the reason this parts company with
 * them at wide angle. */
function filonPanels(k,z,L){
  const n=Math.ceil(6*L*Math.sqrt(k/Math.max(z,1e-12)));
  return clamp(n,24,20000)|0;
}
function rsIntervalField(xi,x1,x2,lam,z,boost){
  const k=TAU/lam, L=x2-x1;
  if(!(L>0)) return [0,0];
  const n=Math.max(4,Math.round(filonPanels(k,z,L)*(boost||1)));
  const dx=L/n;
  let re=0, im=0;
  for(let i=0;i<n;i++){
    const xm=x1+(i+0.5)*dx;
    const dxi=xi-xm, r=Math.sqrt(z*z+dxi*dxi);
    const A=(z/r)/Math.sqrt(r);
    const u=-0.5*k*dxi*dx/r;                       /* q dx / 2, q = d(kr)/dx' */
    const w=(Math.abs(u)<1e-9)?1:Math.sin(u)/u;
    const ph=k*r, aw=A*w;
    re+=aw*Math.cos(ph); im+=aw*Math.sin(ph);
  }
  return [re*dx,im*dx];
}
function rsSlits(xi,ap,boost){
  let re=0, im=0;
  for(let i=0;i<ap.open.length;i++){
    const f=rsIntervalField(xi,ap.open[i][0],ap.open[i][1],ap.lam,ap.z,boost);
    re+=f[0]; im+=f[1];
  }
  return re*re+im*im;
}

/* ---- circular aperture in the near field ---------------------------- *
 * Paraxial radial integral,  U(rho) = INT_0^a exp(i k r'^2 / 2z) J0(k rho r'/z) r' dr',
 * Simpson.  Labelled paraxial on the canvas: unlike the slit branch there is
 * no obliquity factor here, and for a fast aperture that matters. */
function circFresnel(rho,a,lam,z,nOpt){
  const k=TAU/lam, NF=a*a/(lam*z);
  const n=nOpt||clamp(Math.ceil(240+150*NF+60*k*Math.abs(rho)*a/z/TAU),240,24000);
  const N=(n%2)?n+1:n, dr=a/N;
  let re=0, im=0;
  for(let i=0;i<=N;i++){
    const r=i*dr, ph=k*r*r/(2*z), J=besselJ0(k*rho*r/z);
    const wgt=(i===0||i===N)?1:(i%2?4:2);
    const A=wgt*J*r;
    re+=A*Math.cos(ph); im+=A*Math.sin(ph);
  }
  const f=dr/3;
  re*=f; im*=f;
  return re*re+im*im;
}
/* the on-axis intensity of a circular aperture, in closed form and EXACT:
 *      I / I_unobstructed = 4 sin^2(pi N_F / 2),   N_F = a^2 / (lambda z).
 * Verified against a direct radial integration at eight Fresnel numbers to
 * 1e-10 (scipy, outside this file).  It swings between 0 and FOUR times the
 * unobstructed intensity, which is the cleanest demonstration in optics that
 * blocking light can make a point brighter. */
function circAxis(NF){ const s=Math.sin(PI*NF/2); return 4*s*s; }

/* ================================================================== *
 *  apertures                                                          *
 * ================================================================== */
const APERTURES=[
  {id:'single', name:'single slit'},
  {id:'double', name:'double slit'},
  {id:'grating',name:'N slits'},
  {id:'circle', name:'circular'},
  {id:'edge',   name:'straight edge'},
];
/* the open intervals of the aperture, in metres, centred on the axis */
function openIntervals(kind,a,d,N){
  const out=[];
  if(kind==='single'||kind==='circle'){ out.push([-a/2,a/2]); }
  else if(kind==='double'){ out.push([-d/2-a/2,-d/2+a/2],[d/2-a/2,d/2+a/2]); }
  else if(kind==='grating'){
    const n=Math.max(1,Math.round(N));
    for(let i=0;i<n;i++){ const c=(i-(n-1)/2)*d; out.push([c-a/2,c+a/2]); }
  }
  else if(kind==='edge'){ out.push([0,Math.max(400*a,0.02)]); }
  return out;
}
