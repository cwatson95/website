  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gSrc,gAp,gGeo,gMeth,gRes,gGrat,gDisp,gShow,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    [[gSrc,LASERS,'laser'],[gAp,APERTURES,'aperture'],[gMeth,PROPS,'prop'],
     [gGrat,LAMPS,'lamp']].forEach(([g,list,key])=>{
      const cw=g.querySelector('.chips'); if(!cw) return;
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
    });
  }
  function syncPanel(){
    const v=st.view, ap=st.aperture;
    gAp.hidden   = (v==='grating');
    gGeo.hidden  = (v==='grating'||v==='airy');
    gMeth.hidden = (v==='grating'||v==='airy');
    gRes.hidden  = (v!=='airy');
    gGrat.hidden = (v!=='grating');
    gDisp.hidden = false;
    gShow.hidden = (v!=='bench');
    rows.a.row.hidden    = (ap==='circle'||ap==='edge');
    rows.d.row.hidden    = !(ap==='double'||ap==='grating');
    rows.N.row.hidden    = (ap!=='grating');
    rows.D.row.hidden    = (ap!=='circle');
    rows.hgt.row.hidden  = (ap==='circle');
    rows.probe.row.hidden= (v!=='near');
    rows.speed.row.hidden= !(st.anim||st.spin);
    rows.planes.row.hidden=!st.showCarpet;
    rows.gam.row.hidden  = st.logI;
    for(const k in rows) rows[k].sync();
    [].forEach.call(dchecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['trueColour','logI','showEnv','showOrders','showCompare'][i]]; });
    [].forEach.call(schecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showCarpet','showPlate','showScreen','showRays','showGrid',
                      'anim','spin'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = (st.view==='bench')
        ? 'drag to orbit · scroll to zoom · a looks down the axis · r resets'
        : st.view==='near' ? 'the probe slider slides the observation point along the screen'
        : st.view==='airy' ? 'drag the separation through Sparrow and Rayleigh and watch the dip'
        : st.view==='grating' ? 'widen the beam to cover more grooves — that is the only thing R depends on'
        : 'switch the propagator and watch where the approximations part company';
      subEl.innerHTML = (st.view==='grating')
        ? 'a grating is a ruler for wavelength &mdash; R = mN, and nothing else'
        : (M.NF>1
          ? 'near field &mdash; N<sub>F</sub> = '+fmt(M.NF,2)+', the pattern still remembers the aperture'
          : 'far field &mdash; N<sub>F</sub> = '+(M.NF<0.01?M.NF.toExponential(1):fmt(M.NF,2))
            +', the pattern is the aperture&rsquo;s Fourier transform');
      srcTag.innerHTML=laserById(st.laser).src;
      apTag.innerHTML='a = <b>'+fmt(M.ap.a/M.lam,1)+'</b> λ'
        +(M.ap.N>1?' &nbsp; d/a = <b>'+fmt(M.ap.d/M.ap.a,2)+'</b>':'')
        +(M.missing.length?' &nbsp;<span class="r">orders ±'+M.missing.slice(0,2).join(', ±')
          +' missing</span>':'');
      geoTag.innerHTML='N<sub>F</sub> = <b>'+(M.NF<0.01?M.NF.toExponential(2):fmt(M.NF,3))+'</b>'
        +' &nbsp; screen <b>'+fmtLen(2*M.halfW,2)+'</b> wide'
        +' &nbsp; half-angle <b>'+fmt(M.maxAngle*RAD,2)+'°</b>';
      methTag.innerHTML='in force: <b>'+PROPS.find(p=>p.id===M.prop).name+'</b><br>'
        +'discarded paraxial phase <b'+(M.quartic>0.3?' class="r"':'')+'>'
        +(M.quartic<1e-3?'&lt; 0.001':fmt(M.quartic,3))+'</b> rad';
      resTag.innerHTML='λ/D = <b>'+fmt(M.lam/M.ap.D*1e6,2)+'</b> µrad &nbsp; Rayleigh <b>'
        +fmt(RAYLEIGH,4)+'</b> &nbsp; Sparrow <b>'+fmt(SPARROW,4)+'</b>';
      gratTag.innerHTML='N = <b>'+M.grat.N+'</b> grooves &nbsp; R = <b>'+M.grat.R+'</b>'
        +(M.grat.pair?'<br>needs <b'+(M.grat.resolved?' class="g"':' class="r"')+'>'
          +fmt(M.grat.pair.need,0)+'</b> for '+M.grat.lines[M.grat.pair.i].lab+'/'
          +M.grat.lines[M.grat.pair.j].lab:'');
      dispTag.innerHTML=st.trueColour
        ? 'CIE 1931 via the Wyman–Sloan–Shirley fit (JCGT 2013), sRGB/D65, out-of-gamut '
          +'components desaturated toward white'
        : 'NeonColors ramp — lightness is monotone in intensity, so it reads as a magnitude';
      infoEl.innerHTML=INFO[st.view]||INFO.bench;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it: the frame loop only
     redraws while something is animating, so every interaction that touches the
     camera must ask for a frame.  (steam_carnot_cycle.html Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='a'){ S.lookAxial(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(((st.anim||st.spin)&&st.view==='bench')||dirty){
      dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

const INFO={
  bench:'The surface is the intensity, drawn all the way from just behind the aperture to '
    +'the screen — a <b>diffraction carpet</b>. Near the plate the pattern still <i>is</i> the '
    +'aperture: two bright bars where the slits are. Further out the edges start to ring, the '
    +'bars broaden, merge, and finally reorganise into the far-field fringes. There is no '
    +'moment where near becomes far; the axis is logarithmic because the interesting part is. '
    +'The transverse direction is enormously exaggerated — a 40 µm slit and a 2 m bench cannot '
    +'share a scale, and the axial labels tell you the real distances.',
  screen:'What a camera would actually record. The horizontal structure is the slits; the '
    +'<b>vertical</b> structure is the finite height of the aperture, which is a diffraction '
    +'pattern of its own and the reason the real thing is a short bar rather than an infinite '
    +'line. Colour is the CIE fit for this wavelength — but a monochromatic line is outside the '
    +'sRGB gamut, so what you see is desaturated toward white. Switch to false colour when you '
    +'want to read a <i>magnitude</i>; the eye is much better at that with a lightness ramp.',
  profile:'The decomposition that makes a double slit make sense. The <b>envelope</b> is one '
    +'slit on its own — everything the aperture width does. The rapid <b>comb</b> is where the '
    +'slits are relative to each other, and knows nothing about their width. The pattern is the '
    +'product, which is why making d an exact multiple of a <b>deletes</b> orders: the comb '
    +'tooth lands exactly on a zero of the envelope. The dotted curves are the other two '
    +'propagators; where they separate from the solid one, the approximations have run out.',
  near:'The Cornu spiral is not an illustration — it is the answer, plotted. Each point on it '
    +'is the running sum of the phasors from the aperture up to that position, so an open '
    +'interval selects an <b>arc</b>, and the field is the straight <b>chord</b> across it. An '
    +'unobstructed wave spans the whole spiral, eye to eye, and the chord is the diameter. Put '
    +'an edge in and you take away half of it — the chord halves, the intensity quarters, and '
    +'that is the exact 1/4 at the geometric shadow boundary, with no approximation anywhere.',
  airy:'Every telescope, microscope and eye is here. A circular aperture cannot make a point; '
    +'it makes the <b>Airy pattern</b>, whose first zero is at 1.2197 λ/D — and 83.78% of the '
    +'light is inside it. Rayleigh&rsquo;s criterion puts one peak on the other&rsquo;s first '
    +'zero and calls it resolved, which leaves a 73.5% dip; Sparrow&rsquo;s puts them where the '
    +'dip vanishes, at 0.947 λ/D. Neither is a law of nature. They are conventions about how '
    +'much of a wiggle you are willing to call two things.',
  grating:'A grating is a ruler for wavelength, and its precision is <b>R = mN</b>: the order '
    +'times the number of grooves the beam actually covers. That is the whole story — not the '
    +'ruling density, not the size of the grating, not the focal length. The classic test is '
    +'the sodium doublet: 0.5974 nm apart at 589 nm needs R = 986.5, so a 600 lines/mm grating '
    +'in first order needs 1.64 mm of beam. Widen the beam past that and the two lines come '
    +'apart in front of you. The wavelengths here are NIST values, and the claim is checkable.'};

/* ================================================================== *
 *  self-test                                                          *
 *                                                                     *
 *  Reference values marked (scipy) were computed OUTSIDE this file     *
 *  with scipy 1.18 / numpy 2.5 and pasted in.  Asserting against a     *
 *  table quoted from memory is worthless — that is on this project's   *
 *  Known-bad list from wind_tunnel.html — so every such number here    *
 *  has a routine behind it that produced it.                           *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,t,n)=>ok(Math.abs(a-b)<=t,n+'  (got '+a+', want '+b+', tol '+t+')');

  /* ---------- Bessel, against scipy ---------------------------------- */
  const J0REF=[[0,1],[0.5,0.938469807240813],[1,0.765197686557966],
   [2.4048255577,-0.000000000002195],[3.8317059702,-0.402759395702553],[5,-0.177596771314338],
   [8,0.171650807137554],[12,0.047689310796834],[15,-0.014224472826781],
   [30,-0.086367983581040],[60,-0.091471804089062]];
  const J1REF=[[0,0],[0.5,0.242268457674874],[1,0.440050585744934],
   [2.4048255577,0.519147497288554],[3.8317059702,0.000000000003026],[5,-0.327579137591465],
   [8,0.234636346853915],[12,-0.223447104490628],[15,0.205104038613523],
   [30,-0.118751062616623],[60,0.046598383758166]];
  for(const [x,v] of J0REF) close(besselJ0(x),v,3e-10,'J0('+x+') (scipy)');
  for(const [x,v] of J1REF) close(besselJ1(x),v,3e-10,'J1('+x+') (scipy)');
  for(const x of [16.9,17.0,17.1]){
    close(besselJ0(x),besselAsym(0,x),3e-10,'J0 is continuous across its split, x='+x);
    close(besselJ1(x),besselAsym(1,x),3e-10,'J1 is continuous across its split, x='+x);
  }
  ok(besselJ0(-3)===besselJ0(3),'J0 is even');
  ok(besselJ1(-3)===-besselJ1(3),'J1 is odd');

  /* ---------- Fresnel, against scipy --------------------------------- */
  const FREF=[[0.1,0.099997532627085,0.000523589547612],[0.5,0.492344225871446,0.064732432859999],
   [1.0,0.779893400376823,0.438259147390355],[1.5,0.445261176039821,0.697504960082093],
   [1.6,0.365461683440488,0.638887683509381],[2.0,0.488253406075341,0.343415678363698],
   [2.5,0.457413009641777,0.619181755819593],[3.0,0.605720789297686,0.496312998967375],
   [4.0,0.498426033038178,0.420515754246928],[5.0,0.563631188704012,0.499191381917117],
   [8.0,0.499802180377197,0.460214214393014],[10.0,0.499898694205516,0.468169978584882]];
  for(const [u,c,s] of FREF){
    const r=fresnelCS(u);
    close(r[0],c,2e-13,'C('+u+') (scipy)'); close(r[1],s,2e-13,'S('+u+') (scipy)');
  }
  {
    const n=fresnelCS(-2), p=fresnelCS(2);
    ok(n[0]===-p[0]&&n[1]===-p[1],'C and S are odd');
    /* the limit is 1/2 but it OSCILLATES about it as 1/(pi u); asserting
       C(60) ~ 1/2 to 2e-3 asserts the wrong thing — 1/(60 pi) is 5.3e-3. */
    for(const u of [20,60,200]){
      const r=fresnelCS(u), ph=PI*u*u/2, tol=4/(PI*u*u*u);
      close(r[0],0.5+Math.sin(ph)/(PI*u),tol,'C('+u+') follows its asymptotic');
      close(r[1],0.5-Math.cos(ph)/(PI*u),tol,'S('+u+') follows its asymptotic');
    }
  }

  /* ---------- exact landmarks ---------------------------------------- */
  close(edgeFresnel(0),0.25,1e-15,'a straight edge is exactly 1/4 at the shadow boundary');
  close(edgeFresnel(1.217198238661835),1.370442919703110,1e-12,
        'the edge first maximum is 1.3704 (scipy)');
  ok(edgeFresnel(-3)<6e-3,'and it decays into the geometric shadow');
  close(airyI(0),1,0,'Airy is 1 on axis');
  close(airyI(AIRY_ZERO),0,1e-20,'Airy vanishes at j(1,1)');
  close(besselJ1(RAYLEIGH*PI),0,1e-12,'the Rayleigh constant IS j(1,1)/pi');
  close(airyI(5.135622301841),1.749786278577499e-2,1e-12,'Airy first sidelobe (scipy)');
  close(airyI(AIRY_FWHM*PI/2),0.5,2e-11,'the Airy FWHM constant reproduces half maximum');
  close(sinc2(0),1,0,'sinc2(0) = 1');
  close(sinc2(PI),0,1e-30,'sinc2 first zero');
  close(sinc2(4.49340945790906),4.71904492258113e-2,1e-14,'sinc2 first sidelobe (scipy)');
  close(sinc2(1.391557378251510),0.5,2e-13,'sinc2 half maximum at 0.8859/2 (scipy)');
  /* the Sparrow constant must be where the central curvature vanishes — this
     pins the CONSTANT against airyI, so mutating either one is caught */
  {
    const sv=SPARROW*PI, e=1e-3;
    const f=x=>airyI(Math.abs(x-sv/2))+airyI(Math.abs(x+sv/2));
    const d2=(f(e)-2*f(0)+f(-e))/(e*e);
    close(d2,0,4e-4,'Sparrow is where the dip curvature vanishes');
    const rv=RAYLEIGH*PI;
    const g=x=>airyI(Math.abs(x-rv/2))+airyI(Math.abs(x+rv/2));
    let pk=0; for(let i=0;i<=4000;i++){ const x=-rv+2*rv*i/4000; if(g(x)>pk) pk=g(x); }
    close(g(0)/pk,0.735031662423,2e-6,'the dip at Rayleigh separation is 73.5% (scipy)');
  }
  /* encircled energy, against scipy */
  for(const [v,e] of [[1.0,0.220827982472],[2.0,0.617261415133],[AIRY_ZERO,0.837784869173314],
                      [5.0,0.861151295434],[7.015586669815619,0.909930535086],
                      [10.0,0.937625720104],[20.0,0.967636095015]])
    close(encircled(v),e,3e-10,'encircled energy at v='+fmt(v,4)+' (scipy)');
  /* grating factor */
  for(const N of [2,3,5,10,37]){
    close(gratingFactor(0,N),1,1e-14,'grating principal maximum is 1, N='+N);
    close(gratingFactor(PI/N,N),0,1e-15,'grating first zero at pi/N, N='+N);
    for(const e of [1e-6,1.1e-5,5e-5]){
      const sg=Math.sin(e), r=Math.sin(N*e)/sg;
      close(gratingFactor(e,N),r*r/(N*N),1e-9,'grating series joins the direct form, N='+N);
    }
  }
  /* The small-argument SERIES branches must join their direct forms.
     Three mutations survived a 327-assertion suite for want of these: sinc2's
     1 - b²/3, airyI's 1 - v²/4 and the grating factor's 1 - (N²-1)sin²γ/3 are
     each reached only below a threshold no other test ever crossed.  A branch
     that is never evaluated is not covered by anything, however many
     assertions surround it. */
  for(const b of [1e-6,1e-5,5e-5,9.9e-5]){
    const s=Math.sin(b)/b;
    close(sinc2(b),s*s,1e-14,'the sinc2 series joins its direct form at b='+b);
  }
  for(const v of [1e-6,1e-5,5e-5,9.9e-5]){
    const t=2*besselJ1(v)/v;
    close(airyI(v),t*t,1e-14,'the airyI series joins its direct form at v='+v);
  }
  for(const N of [2,5,37]) for(const e of [1e-7,1e-6,5e-6,9.9e-6]){
    const sg=Math.sin(e), r=Math.sin(N*e)/sg;
    close(gratingFactor(e,N),r*r/(N*N),1e-13,'the grating series joins at N='+N+', γ='+e);
  }

  /* the tallest secondary maximum of an N-slit pattern tends to the sinc^2
     sidelobe as N grows — an independent cross-check of BOTH functions */
  {
    /* the scan has to exclude BOTH principal maxima — gamma = pi is one too,
       and a range that runs to pi finds it and reports 1.0 */
    let best=0;
    const N=60, lo=PI/N*1.4, hi=PI-PI/N*1.4;
    for(let i=1;i<40000;i++){ const g=PI*i/40000;
      if(g<lo||g>hi) continue;
      const v=gratingFactor(g,N); if(v>best) best=v; }
    close(best,4.71904492258113e-2,1.5e-3,'the tallest N-slit sidelobe tends to the sinc² one');
  }
  /* the circular on-axis closed form */
  for(const [nf,v] of [[0.5,2],[1,4],[1.5,2],[2,0],[2.5,2],[3,4],[4,0],[7,4]])
    close(circAxis(nf),v,1e-13,'4 sin²(πN_F/2) at N_F='+nf);

  /* ---------- the propagators agree where they must, and only there --- */
  const lam=632.8e-9;
  const apOf=(kind,a,d,N,z)=>({kind,a,d,N,z,lam,D:a,open:openIntervals(kind,a,d,N)});
  {
    const a=100e-6, z=5.0, ap=apOf('single',a,0,1,z);
    const nr=rsSlits(0,ap), nf=fresnelSlits(0,ap);
    let wr=0, wf=0;
    for(const x of [0,4e-3,8e-3,12e-3,20e-3,24e-3]){
      const s=x/Math.sqrt(x*x+z*z), fr=fraunhofer(s,ap);
      wr=Math.max(wr,Math.abs(rsSlits(x,ap)/nr-fr));
      wf=Math.max(wf,Math.abs(fresnelSlits(x,ap)/nf-fr));
    }
    ok(wr<2e-4,'Rayleigh–Sommerfeld reproduces sinc² in the far field ('+wr.toExponential(2)+')');
    ok(wf<2e-4,'and so does the Fresnel form ('+wf.toExponential(2)+')');
  }
  /* The far-field check has to cover a MULTI-slit aperture or nothing pins γ:
     halving πd sinθ/λ moves every order, and a single slit never notices
     because it has no comb at all.  That mutant survived until this ran. */
  {
    const a=30e-6, d=150e-6, z=4.0;
    for(const [kind,N] of [['double',2],['grating',5]]){
      const ap=apOf(kind,a,d,N,z), nr=rsSlits(0,ap);
      let w=0;
      for(let i=0;i<=48;i++){
        const x=-0.06+0.12*i/48, s=x/Math.sqrt(x*x+z*z);
        w=Math.max(w,Math.abs(rsSlits(x,ap)/nr-fraunhofer(s,ap)));
      }
      ok(w<4e-3,'RS reproduces the whole '+kind+' pattern in the far field ('
         +w.toExponential(2)+')');
    }
    /* and every order lands exactly where d sinθ = mλ puts it, ON the envelope —
       one assertion that pins the order positions and the envelope together */
    const ap=apOf('double',a,d,2,z), n0=rsSlits(0,ap);
    for(const m of [1,2,3,4]){
      const s=m*lam/d, xi=z*s/Math.sqrt(1-s*s);
      close(rsSlits(xi,ap)/n0,sinc2(PI*a*s/lam),5e-3,
            'order '+m+' sits at d sinθ = mλ, at exactly the envelope height');
    }
  }
  /* near field, both directions: agreement at N_F = 2, DISAGREEMENT at 10 */
  {
    const a=100e-6;
    const zs={2:7.901390644753477e-3,10:1.580278128950695e-3};
    const XS=[0,20e-6,50e-6,90e-6,110e-6];
    const CSREF={2:[0.712651433380,1.215598180251,1.396675889688,0.372302008769,0.214659791313],
                 10:[0.865617000946,1.102469788244,1.197066835762,0.585757172300,0.090996253671]};
    const RSREF={2:[1,1.705953456,1.959788157,0.522798129,0.301214803],
                 10:[1,1.272243815,1.379654691,0.662588707,0.104280741]};
    for(const NF of [2,10]){
      const z=zs[NF], ap=apOf('single',2*a,0,1,z);
      const n0=rsSlits(0,ap,4);
      let wcs=0,wrs=0,wd=0;
      for(let i=0;i<XS.length;i++){
        wcs=Math.max(wcs,Math.abs(fresnelSlits(XS[i],ap)-CSREF[NF][i]));
        wrs=Math.max(wrs,Math.abs(rsSlits(XS[i],ap,4)/n0-RSREF[NF][i]));
        wd =Math.max(wd ,Math.abs(rsSlits(XS[i],ap,4)/n0-fresnelSlits(XS[i],ap)/CSREF[NF][0]));
      }
      ok(wcs<2e-9,'the Fresnel slit matches scipy at N_F='+NF+' ('+wcs.toExponential(2)+')');
      ok(wrs<2e-6,'the Filon RS matches a 4e6-sample direct sum at N_F='+NF
         +' ('+wrs.toExponential(2)+')');
      if(NF===2) ok(wd<8e-4,'at N_F=2 the paraxial form agrees with it ('+wd.toExponential(2)+')');
      else ok(wd>5e-3,'but at N_F=10 the paraxial form is measurably wrong ('
             +wd.toExponential(2)+') — 0.50 rad of discarded quartic phase');
    }
  }
  /* the Filon panel count is converged */
  {
    const ap=apOf('single',100e-6,0,1,0.05);
    let w=0;
    for(const x of [0,40e-6,80e-6,120e-6,200e-6]){
      const lo=rsSlits(x,ap,1), hi=rsSlits(x,ap,6);
      w=Math.max(w,Math.abs(lo-hi)/Math.max(hi,1e-30));
    }
    ok(w<2e-3,'the Filon panel count is converged (×6 moves it '+w.toExponential(2)+')');
  }
  /* the circular radial integral must reproduce the Airy form in the far field
     and the exact on-axis closed form in the near */
  {
    const D=200e-6, z=6.0;
    const n0=circFresnel(0,D/2,lam,z,3000);
    let w=0;
    for(const r of [0,6e-3,12e-3,20e-3]){
      const s=r/Math.sqrt(r*r+z*z);
      w=Math.max(w,Math.abs(circFresnel(r,D/2,lam,z,3000)/n0-airyI(PI*D*s/lam)));
    }
    ok(w<3e-3,'the radial Fresnel integral reproduces the Airy pattern ('+w.toExponential(2)+')');
    for(const NF of [0.5,1,2,3]){
      const a=100e-6, zz=a*a/(lam*NF);
      const U0=lam*zz/TAU;
      close(circFresnel(0,a,lam,zz,6000)/(U0*U0),circAxis(NF),4e-6,
            'the radial integral reproduces 4sin²(πN_F/2) at N_F='+NF);
    }
  }

  /* ---------- colour ------------------------------------------------- */
  {
    /* the sRGB matrix applied to the D65 white point must return (1,1,1) */
    const wp=[0.3127/0.3290,1,(1-0.3127-0.3290)/0.3290];
    for(let i=0;i<3;i++){
      const v=SRGB_M[i][0]*wp[0]+SRGB_M[i][1]*wp[1]+SRGB_M[i][2]*wp[2];
      close(v,1,3e-4,'the sRGB matrix maps D65 to white, row '+i);
    }
    /* the CIE fit at specific wavelengths (values from the same fit evaluated
       in numpy, so a mistyped coefficient is caught rather than absorbed) */
    for(const [nm,X,Y,Z] of [[400,0.011547,0.001263,0.060795],
                             [500,0.002253,0.327358,0.271444],
                             [555,0.517327,0.998039,0.005653],
                             [589,1.013750,0.774924,0.000164],
                             [632.8,0.599230,0.236886,0.000000]]){
      const c=cieXYZ(nm);
      close(c[0],X,1e-5,'CIE x̄ at '+nm+' nm'); close(c[1],Y,1e-5,'CIE ȳ at '+nm+' nm');
      close(c[2],Z,1e-5,'CIE z̄ at '+nm+' nm');
    }
    ok(Math.abs(cieXYZ(555)[1]-1)<0.005,'ȳ peaks at ~555 nm, as the luminosity function must');
    for(const nm of [380,450,532,589,632.8,700,760]){
      const c=spectralLinear(nm);
      ok(c.every(v=>v>=-1e-12&&v<=1+1e-12),'spectral sRGB is in gamut after desaturation at '+nm);
      ok(Math.max.apply(null,c)>0.999,'and is normalised to peak 1 at '+nm);
    }
    ok(spectralLinear(632.8)[0]>0.9&&spectralLinear(632.8)[2]<0.5,'632.8 nm is red');
    ok(spectralLinear(532)[1]>0.9&&spectralLinear(532)[0]<0.9,'532 nm is green');
    ok(spectralLinear(445)[2]>0.9&&spectralLinear(445)[0]<0.6,'445 nm is blue');
    /* the transfer function itself — nothing else pins the 1/2.4 exponent, and
       changing it to 1/2.2 (the old "gamma 2.2" folklore) survived otherwise */
    close(srgbGamma(0.5),0.7353569830524495,1e-12,'the sRGB transfer curve at 0.5');
    close(srgbGamma(1),1,1e-15,'and it maps 1 to 1');
    close(srgbGamma(0.0031308),0.040449936,1e-15,'its linear and power segments join');
    close(srgbGamma(0),0,0,'and 0 to 0');
  }
  /* canvas text is not HTML — entities must be decoded before fillText */
  {
    ok(plain('Rayleigh&rsquo;s')==='Rayleigh\u2019s','caption() decodes &rsquo;');
    ok(plain('a &mdash; b')==='a \u2014 b','and &mdash;');
    ok(plain('3 &times; 4')==='3 \u00d7 4','and &times;');
    ok(plain('plain text')==='plain text','and leaves plain text alone');
    ok(plain('&unknown;')==='&unknown;','and leaves an unknown entity visible rather than eating it');
    /* intensity must be applied in LINEAR light: half intensity is NOT half
       the 8-bit value, and getting that backwards makes every fringe too bright */
    const full=toRgb(spectralCss(632.8,1)), half=toRgb(spectralCss(632.8,0.5));
    ok(half[0]>0.5*full[0]+8,'intensity is gamma-encoded after scaling, not before');
    close(toRgb(spectralCss(632.8,0))[0],0,0,'zero intensity is black');
  }

  /* ---------- geometry, orders, missing orders ------------------------ */
  {
    const iv=openIntervals('double',40e-6,200e-6,2);
    ok(iv.length===2,'a double slit has two openings');
    close(iv[0][1]-iv[0][0],40e-6,1e-18,'each is a wide');
    close((iv[1][0]+iv[1][1])/2-(iv[0][0]+iv[0][1])/2,200e-6,1e-18,'and they are d apart');
    for(const N of [3,7,16]){
      const g=openIntervals('grating',20e-6,100e-6,N);
      ok(g.length===N,'an N-slit aperture has N openings, N='+N);
      close((g[N-1][0]+g[N-1][1])/2,(N-1)/2*100e-6,1e-18,'and is centred, N='+N);
    }
  }
  {
    /* missing orders: d/a = 3 must delete orders 3, 6, 9 */
    const s=Object.assign({},DEFAULTS,{aperture:'double',a:50,d:150,z:2,nProf:161});
    const M=buildModel(s);
    ok(M.missing.indexOf(3)>=0&&M.missing.indexOf(6)>=0,'d/a = 3 deletes orders 3 and 6');
    const bad=M.orders.filter(o=>Math.abs(o.m)===3)[0];
    ok(bad&&bad.miss,'and the third order is flagged as missing');
    /* and the intensity there really is zero */
    const ap=apertureOf(s);
    const sinTh=3*ap.lam/ap.d;
    close(fraunhofer(sinTh,ap),0,1e-24,'the intensity at a missing order is exactly zero');
    /* whereas d/a = 3.5 deletes nothing */
    const M2=buildModel(Object.assign({},s,{d:175}));
    ok(M2.missing.length===0,'d/a = 3.5 deletes nothing');
  }
  {
    /* a symmetric aperture must give a symmetric pattern */
    for(const kind of ['single','double','grating']){
      const s=Object.assign({},DEFAULTS,{aperture:kind,N:5,z:1.5,nProf:121});
      const M=buildModel(s);
      let w=0;
      const n=M.prof.ys.length;
      for(let i=0;i<n;i++) w=Math.max(w,Math.abs(M.prof.ys[i]-M.prof.ys[n-1-i]));
      ok(w<1e-9,'a symmetric aperture gives a symmetric pattern ('+kind+', '+w.toExponential(1)+')');
    }
    /* and the profile is normalised */
    const M=buildModel(Object.assign({},DEFAULTS,{nProf:121}));
    let mx=0; for(const v of M.prof.ys) mx=Math.max(mx,v);
    close(mx,1,1e-12,'the profile is normalised to its peak');
    ok(M.prof.ys.every(v=>v>=-1e-15),'and never negative');
  }
  {
    /* the finite slit height is a real diffraction pattern, not a decoration */
    const s=Object.assign({},DEFAULTS,{hgt:2000});
    const ap=apertureOf(s);
    const eta=ap.lam*ap.z/(2000e-6);          /* the first zero of the height factor */
    close(heightFactor(eta,s,ap),0,2e-7,'the slit height has its own first zero at λz/h');
    close(heightFactor(0,s,ap),1,0,'and is unity on axis');
    /* A zero is not enough: DOUBLING the argument keeps that zero (it lands on
       the second one instead) and the mutant survived.  Half the angle is where
       the two forms actually differ — sinc²(π/2) against sinc²(π) = 0. */
    close(heightFactor(eta/2,s,ap),4/(PI*PI),1e-5,
          'and is sinc²(π/2) = 0.40528 at half that angle');
    close(heightFactor(eta/4,s,ap),sinc2(PI/4),1e-5,'and sinc²(π/4) at a quarter');
  }

  /* ---------- the grating as an instrument ---------------------------- */
  {
    const g=gratingModel(Object.assign({},DEFAULTS,{lines:600,beamW:5,order:1,lamp:'sodium'}));
    close(g.d,1/600000,1e-18,'600 lines/mm is a 1.667 µm pitch');
    ok(g.N===3000,'5 mm of a 600 l/mm grating is 3000 grooves (got '+g.N+')');
    ok(g.R===3000,'R = mN = 3000');
    close(g.pair.need,589.29370/0.5974,2e-3,'the sodium doublet needs R = 986.5');
    ok(g.resolved,'and 3000 resolves it');
    /* the threshold: 1.64 mm of beam is the boundary, and it must bracket */
    const lo=gratingModel(Object.assign({},DEFAULTS,{lines:600,beamW:1.60,order:1,lamp:'sodium'}));
    const hi=gratingModel(Object.assign({},DEFAULTS,{lines:600,beamW:1.70,order:1,lamp:'sodium'}));
    ok(!lo.resolved&&hi.resolved,'and 1.64 mm of beam is the threshold (1.60 fails, 1.70 passes)');
    /* the grating equation itself */
    for(const [nm,m,deg] of [[589.2950,1,20.706257],[632.8,1,22.313863],[632.8,2,49.407809]]){
      const d=1/600000, s=m*nm*1e-9/d;
      close(Math.asin(s)*RAD,deg,2e-5,'d sinθ = mλ at '+nm+' nm, order '+m+' (scipy)');
    }
    /* dispersion */
    const gg=gratingModel(Object.assign({},DEFAULTS,{lines:600,order:1,lamp:'sodium'}));
    const L0=gg.lines[0];
    close(L0.disp*1e-9*RAD,0.036751,2e-5,'dθ/dλ = m/(d cosθ) = 0.0368 °/nm (scipy)');
    /* R depends on the beam, not on the ruling, at fixed groove count */
    const A=gratingModel(Object.assign({},DEFAULTS,{lines:600,beamW:5,order:1}));
    const Bm=gratingModel(Object.assign({},DEFAULTS,{lines:1200,beamW:2.5,order:1}));
    ok(A.R===Bm.R,'the same groove count gives the same R at half the beam and twice the ruling');
    ok(Bm.lines[0].disp>A.lines[0].disp,'but twice the ruling gives more angular dispersion');
    /* higher orders resolve better, in exact proportion */
    const m2=gratingModel(Object.assign({},DEFAULTS,{lines:600,beamW:5,order:2}));
    ok(m2.R===2*A.R,'second order doubles R');
    /* the mercury yellow pair */
    const hg=gratingModel(Object.assign({},DEFAULTS,{lamp:'mercury',lines:600,beamW:1,order:1}));
    close(hg.pair.dl,2.1065,1e-3,'the mercury yellow pair is 2.107 nm apart');
    ok(hg.pair.need<280,'which needs only R = 274');
  }

  /* ---------- the model's own scalars, pinned absolutely --------------
     A leading constant that only ever appears as a scale factor is invisible
     to range and monotonicity assertions — that is on this project's Known-bad
     list from wind_tunnel.html (Prandtl's 2/pi survived 110 green assertions).
     Every one of these would move if its coefficient changed. */
  {
    const M=buildModel(Object.assign({},DEFAULTS,{nProf:81}));
    close(M.halfW,8.226608000000001e-2,1e-12,'the default window is 82.27 mm across the half');
    close(M.halfW/M.envZero,2.6,1e-12,'which is 2.6 envelope zeros — 2 full lobes each side');
    close(M.envZero,3.164080000000000e-2,1e-15,'the envelope zero is at λz/a');
    close(M.fringe,6.328160000000000e-3,1e-16,'the fringe spacing is λz/d');
    close(M.NF,3.160476346995020e-4,1e-16,'and N_F = (a/2)²/λz');
    close(M.quartic,4.145969388328887e-2,1e-12,
          'the discarded paraxial phase is k A tan³θ / 2 = 0.0415 rad here');
    ok(M.zeros.length>=2,'the window contains at least two envelope zeros');
    close(M.zeros[0],M.z*Math.tan(Math.asin(M.lam/M.ap.a)),1e-15,
          'and the first is where sinθ = λ/a, not where tanθ = λ/a');
  }

  /* ---------- regime classification ---------------------------------- */
  {
    const near=buildModel(Object.assign({},DEFAULTS,{z:0.003,nProf:81}));
    const far =buildModel(Object.assign({},DEFAULTS,{z:6.0,nProf:81}));
    ok(near.NF>far.NF,'the Fresnel number falls as the screen moves away');
    ok(far.NF<0.01,'and the default bench at 6 m is deep in the far field');
    ok(near.quartic>far.quartic,'the discarded paraxial phase falls too');
    const autoNear=chooseProp({prop:'auto'},50,0.4), autoFar=chooseProp({prop:'auto'},1e-4,0.01);
    ok(autoNear==='rs','auto picks Rayleigh–Sommerfeld when it is near and wide');
    ok(autoFar==='fraunhofer','and Fraunhofer when it is far');
  }

  /* ---------- carpet and screen build without exploding --------------- */
  {
    for(const kind of ['single','double','grating','circle','edge']){
      const s=Object.assign({},DEFAULTS,{aperture:kind,view:'bench',nProf:61,planes:7});
      const M=buildModel(s);
      const c=buildCarpet(M,7,24);
      ok(c.length===7,'the carpet builds for '+kind);
      ok(c.every(p=>p.ys.every(v=>isFinite(v)&&v>=-1e-12&&v<=1+1e-9)),
         'and is finite and normalised for '+kind);
      ok(c[0].x<c[c.length-1].x,'and runs from the aperture outward for '+kind);
      ok(c[0].hw<=c[c.length-1].hw+1e-18,'and opens as it goes for '+kind);
    }
  }

  /* ---------- panels build clean for every view ----------------------- */
  for(const view of ['bench','screen','profile','near','airy','grating']){
    for(const ap of ['single','double','grating','circle','edge']){
      const s=Object.assign({},DEFAULTS,{view,aperture:ap,nProf:61,probe:0.3});
      const M=buildModel(s);
      const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
      ok(html.length>200&&html.indexOf('NaN')<0&&html.indexOf('undefined')<0,
         'panels build clean for '+view+' / '+ap);
      ok(eqbarText(M).indexOf('NaN')<0,'headless summary is clean for '+view+' / '+ap);
    }
  }
  /* every lamp, every order */
  for(const L of LAMPS) for(const m of [1,2,3]){
    const M=buildModel(Object.assign({},DEFAULTS,{view:'grating',lamp:L.id,order:m,nProf:41}));
    const html=readoutHTML(M);
    ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0,
       'the grating panel is clean for '+L.id+' order '+m);
    ok(M.grat.R===m*M.grat.N,'R = mN for '+L.id+' order '+m);
  }
  /* extreme geometry must not produce NaN anywhere */
  {
    let bad=0;
    for(const z of [0.002,0.05,8]) for(const a of [1,400]) for(const kind of ['single','double','circle']){
      const M=buildModel(Object.assign({},DEFAULTS,{z,a,D:a,aperture:kind,nProf:41}));
      if(!M.prof.ys.every(isFinite)) bad++;
      if(!isFinite(M.NF)||!isFinite(M.halfW)) bad++;
    }
    ok(bad===0,'no configuration in the slider ranges produces a non-finite profile');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
