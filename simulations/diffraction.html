/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function fmtSI(x,unit,n){
  if(!isFinite(x)) return '—';
  const a=Math.abs(x);
  if(a>=1)      return fmt(x,n===undefined?3:n)+' '+unit;
  if(a>=1e-3)   return fmt(x*1e3,n===undefined?2:n)+' m'+unit;
  if(a>=1e-6)   return fmt(x*1e6,n===undefined?2:n)+' µ'+unit;
  return fmt(x*1e9,n===undefined?2:n)+' n'+unit;
}
function fmtLen(x,n){ return fmtSI(x,'m',n); }
function fmtDeg(r){ return isFinite(r)?fmt(r*RAD,3)+'°':'—'; }

/* which propagator is actually in force */
function chooseProp(st,NF,maxAngle){
  if(st.prop!=='auto') return st.prop;
  if(NF<0.01) return 'fraunhofer';
  if(maxAngle<0.25) return 'fresnel';
  return 'rs';
}

function apertureOf(st){
  const lam=st.lam*1e-9;
  const kind=st.aperture;
  const a=(kind==='circle')?st.D*1e-6:st.a*1e-6;
  const d=st.d*1e-6;
  const N=(kind==='double')?2:(kind==='grating'?Math.max(1,Math.round(st.N)):1);
  return {kind,lam,a,d,N,D:st.D*1e-6,z:st.z,
          open:openIntervals(kind,a,d,N)};
}

/* the natural transverse scale of the pattern on the screen */
function screenHalfWidth(st,ap){
  const lam=ap.lam, z=ap.z;
  let w;
  if(ap.kind==='circle')     w=4.2*1.2196698912665045*lam*z/Math.max(ap.D,1e-9);
  else if(ap.kind==='edge')  w=7.0*Math.sqrt(lam*z/2);
  else                       w=2.6*lam*z/Math.max(ap.a,1e-9);
  /* in the deep near field the pattern is the aperture, not the far-field lobe */
  const geo=(ap.kind==='grating')?1.4*ap.d*ap.N:2.2*Math.max(ap.a,ap.d*(ap.N-1)+ap.a);
  w=Math.max(w,geo);
  return clamp(w/Math.max(st.zoom,1e-3),1e-9,0.92*z);
}

/* intensity at one screen point, UNNORMALISED (each branch has its own scale) */
function intensityRaw(xi,ap,prop,boost){
  if(prop==='fraunhofer'){
    const s=xi/Math.sqrt(xi*xi+ap.z*ap.z);
    if(ap.kind==='edge') return 1;
    return fraunhofer(s,ap);
  }
  if(prop==='fresnel'){
    if(ap.kind==='edge') return edgeFresnel(xi*Math.sqrt(2/(ap.lam*ap.z)));
    if(ap.kind==='circle') return circFresnel(Math.abs(xi),ap.D/2,ap.lam,ap.z);
    return fresnelSlits(xi,ap);
  }
  if(ap.kind==='circle') return circFresnel(Math.abs(xi),ap.D/2,ap.lam,ap.z);
  return rsSlits(xi,ap,boost);
}

/* the y (height) factor: Fraunhofer for the finite slit height, paraxial.
   A slit 2 mm tall at 633 nm and 2 m has its first zero 0.63 mm off axis, so
   this is not a decoration — it is why a real single-slit pattern is a short
   bar and not an infinite line. */
function heightFactor(eta,st,ap){
  const hM=st.hgt*1e-6;
  if(!(hM>0)) return 1;
  return sinc2(PI*hM*eta/(ap.lam*Math.sqrt(eta*eta+ap.z*ap.z)));
}

function sampleProfile(ap,prop,halfW,n,boost){
  const xs=new Float64Array(n), ys=new Float64Array(n);
  let mx=0;
  for(let i=0;i<n;i++){
    const xi=-halfW+2*halfW*i/(n-1);
    const v=intensityRaw(xi,ap,prop,boost);
    xs[i]=xi; ys[i]=isFinite(v)?v:0;
    if(ys[i]>mx) mx=ys[i];
  }
  if(mx>0) for(let i=0;i<n;i++) ys[i]/=mx;
  return {xs,ys,peak:mx};
}

/* the grating spectrometer is its own geometry: pitch and line count come from
   lines/mm and the illuminated width, which is how a real instrument is
   specified and the only way the resolving-power claim means anything. */
function gratingModel(st){
  const linesPerM=st.lines*1000;
  const d=1/linesPerM;
  const N=Math.max(1,Math.round(st.beamW*1e-3*linesPerM));
  const m=Math.round(st.order);
  const lamp=lampById(st.lamp);
  const R=Math.abs(m)*N;
  const out=[];
  for(const [nm,rel,lab] of lamp.lines){
    const lam=nm*1e-9, s=m*lam/d;
    out.push({nm,rel,lab,lam,sin:s,ok:Math.abs(s)<=1,
              th:Math.abs(s)<=1?Math.asin(s):NaN,
              disp:Math.abs(s)<=1?m/(d*Math.sqrt(1-s*s)):NaN});
  }
  /* The pair that is HARDEST to separate — the largest required resolving
     power, not the smallest wavelength gap: 0.6 nm at 589 nm is a harder ask
     than 0.6 nm at 410 nm, and it is the ratio that the instrument has to meet. */
  let pair=null;
  for(let i=0;i<out.length;i++) for(let j=i+1;j<out.length;j++){
    const dl=Math.abs(out[i].nm-out[j].nm);
    if(!(dl>0)) continue;
    const need=(out[i].nm+out[j].nm)/2/dl;
    if(!pair||need>pair.need) pair={i,j,dl,need,mean:(out[i].nm+out[j].nm)/2};
  }
  const maxOrder=Math.floor(d/(Math.min.apply(null,lamp.lines.map(l=>l[0]))*1e-9));
  return {d,N,m,R,lines:out,lamp,pair,linesPerM,maxOrder,
          resolved:pair?R>=pair.need:true};
}

function buildModel(st){
  const ap=apertureOf(st);
  const lam=ap.lam, z=ap.z;
  const halfW=screenHalfWidth(st,ap);
  const maxAngle=Math.atan2(halfW,z);
  /* Fresnel number on the half-width, which is the convention that makes
     N_F >> 1 "near field" and N_F << 1 "far field" */
  const half=(ap.kind==='circle')?ap.D/2:ap.a/2;
  const NF=half*half/(lam*z);
  const prop=chooseProp(st,NF,maxAngle);
  const n=Math.max(21,Math.round(st.nProf));
  const prof=sampleProfile(ap,prop,halfW,n);

  /* the landmarks worth printing */
  const envZero=lam*z/Math.max(ap.a,1e-12);            /* small-angle */
  const fringe =lam*z/Math.max(ap.d,1e-12);
  const airy1  =1.2196698912665045*lam*z/Math.max(ap.D,1e-12);
  const missing=[];
  if(ap.kind!=='circle'&&ap.kind!=='edge'&&ap.N>1){
    const ratio=ap.d/Math.max(ap.a,1e-12);
    const r=Math.round(ratio);
    if(Math.abs(ratio-r)<1e-6&&r>=2) for(let q=1;q<=4;q++) missing.push(q*r);
  }
  const orders=[];
  if(ap.kind!=='circle'&&ap.kind!=='edge'&&ap.N>1){
    for(let m=-8;m<=8;m++){
      const s=m*lam/ap.d;
      if(Math.abs(s)>0.999) continue;
      const xi=z*s/Math.sqrt(1-s*s);
      if(Math.abs(xi)>halfW) continue;
      orders.push({m,xi,miss:missing.indexOf(Math.abs(m))>=0});
    }
  }
  const zeros=[];
  if(ap.kind!=='circle'&&ap.kind!=='edge'){
    for(let m=1;m<=8;m++){
      const s=m*lam/ap.a;
      if(s>0.999) break;
      const xi=z*s/Math.sqrt(1-s*s);
      if(xi>halfW) break;
      zeros.push(xi);
    }
  }
  /* How far past paraxial this bench is, in radians.
     The term the Fresnel expansion throws away is  -k (xi - x')^4 / (8 z^3), but
     its ABSOLUTE value is not the error: a phase common to the whole aperture
     cancels out of the intensity.  What matters is how much it VARIES across the
     open aperture, which is the derivative k (xi - x')^3 / (2 z^3) times the
     aperture half-extent A:
            dphi  =  k A tan^3(theta) / 2 .
     Using the absolute term instead reports 7 rad for a bench that is manifestly
     paraxial (2.4 degrees), because the screen half-width grows with z and the
     quartic then grows like z — which is why the indicator is written this way. */
  const apHalf=(ap.kind==='circle')?ap.D/2
              :(ap.kind==='edge')?halfW
              :Math.max(ap.a,ap.d*(ap.N-1)+ap.a)/2;
  const quartic=(TAU/lam)*Math.min(apHalf,halfW)*Math.pow(halfW/z,3)/2;

  return {st,ap,lam,z,halfW,NF,prop,prof,maxAngle,
          envZero,fringe,airy1,orders,zeros,missing,quartic,
          grat:gratingModel(st),
          nmLabel:st.lam};
}

/* ================================================================== *
 *  readout / equation bar / captions                                  *
 * ================================================================== */
function readoutHTML(M){
  const st=M.st, ap=M.ap;
  let s='';
  const nm=(function(){
    if(st.view==='grating') return {t:'the grating',s:M.grat.lamp.name+' &mdash; order '+M.grat.m};
    if(st.view==='airy')    return {t:'the Airy disc',s:'a circular aperture, and the limit it sets'};
    if(st.view==='near')    return {t:'near field',s:'the Cornu spiral, and what it is a picture of'};
    if(st.view==='profile') return {t:'the profile',s:'envelope × interference'};
    if(st.view==='screen')  return {t:'the screen',s:fmtLen(2*M.halfW,2)+' across'};
    return {t:'the bench',s:fmtLen(M.z,2)+' from aperture to screen'};
  })();
  s+='<div class="rname">'+nm.t+'<small>'+nm.s+'</small></div><table>';
  const row=(k,v,cls)=>{ s+='<tr><td>'+k+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>'; };
  const hd=t=>{ s+='<tr><td class="hd" colspan="2">'+t+'</td></tr>'; };

  if(st.view==='grating'){
    const g=M.grat;
    hd('instrument');
    row('ruling', fmt(st.lines,0)+' lines/mm');
    row('pitch d', fmtLen(g.d,3));
    row('illuminated', fmt(st.beamW,2)+' mm');
    row('grooves N', g.N.toLocaleString?g.N.toLocaleString('en-US'):String(g.N));
    row('order m', String(g.m));
    hd('resolving power');
    row('R = mN', String(g.R));
    if(g.pair){
      row('closest pair', g.lines[g.pair.i].lab+' / '+g.lines[g.pair.j].lab);
      row('Δλ', fmt(g.pair.dl,4)+' nm');
      row('R needed', fmt(g.pair.need,1));
      row(g.resolved?'resolved':'NOT resolved',
          (g.resolved?'×':'÷')+fmt(g.resolved?g.R/g.pair.need:g.pair.need/g.R,2),
          g.resolved?'good':'bad');
    }
    hd('dispersion');
    const l0=g.lines.find(l=>l.ok);
    if(l0){
      row('θ at '+fmt(l0.nm,1)+' nm', fmtDeg(l0.th));
      row('dθ/dλ', fmt(l0.disp*1e-9*RAD,4)+' °/nm');
    }
    row('highest order', String(g.maxOrder));
    s+='</table>';
    s+='<div class="note"><b>Measured input.</b> '+g.lamp.src+'</div>';
    return s;
  }

  hd('the wave');
  row('λ', fmt(st.lam,3)+' nm');
  row('k', fmt(TAU/M.lam/1e6,3)+' rad/µm');
  hd('the aperture');
  if(ap.kind==='circle') row('diameter D', fmtLen(ap.D,1));
  else if(ap.kind==='edge') row('geometry','half plane');
  else{
    row('slit width a', fmtLen(ap.a,1));
    if(ap.N>1){ row('pitch d', fmtLen(ap.d,1)); row('slits N', String(ap.N)); }
    row('height', fmtLen(st.hgt*1e-6,1));
  }
  row('screen at z', fmtLen(M.z,3));
  hd('regime');
  row('Fresnel number', M.NF<0.01?M.NF.toExponential(2):fmt(M.NF,3),
      M.NF>1?'bad':'good');
  row('', M.NF>1?'near field':(M.NF>0.05?'transition':'far field'));
  row('half-angle', fmtDeg(M.maxAngle));
  row('propagator', PROPS.find(p=>p.id===M.prop).name,
      M.prop==='rs'?'good':'');
  row('paraxial error', M.quartic<0.05?'&lt; 0.05 rad':fmt(M.quartic,2)+' rad',
      M.quartic>0.3?'bad':'');
  hd('landmarks');
  if(ap.kind==='circle'){
    row('Airy radius', fmtLen(M.airy1,3));
    row('1.22 λ/D', fmtDeg(Math.asin(clamp(1.2196698912665045*M.lam/ap.D,-1,1))));
  } else if(ap.kind!=='edge'){
    row('envelope zero', fmtLen(M.envZero,3));
    if(ap.N>1){
      row('fringe spacing', fmtLen(M.fringe,3));
      row('fringes / envelope', fmt(ap.d/ap.a,2));
      if(M.missing.length) row('missing orders','±'+M.missing.slice(0,3).join(', ±'),'bad');
    }
  } else {
    row('shadow edge', 'I = 1/4 exactly');
    row('first maximum', fmt(1.370442919703110,4)+' of I₀');
  }
  s+='</table>';
  if(M.quartic>0.3&&M.prop!=='rs')
    s+='<div class="note bad"><b>The paraxial forms are past their range here</b> — the '
      +'first discarded phase term is '+fmt(M.quartic,2)+' rad. Switch to Rayleigh–Sommerfeld.</div>';
  else if(ap.kind!=='circle'&&ap.a<4*M.lam)
    s+='<div class="note"><b>Scalar theory is thin here.</b> The slit is '
      +fmt(ap.a/M.lam,1)+' wavelengths wide; polarisation matters below about 4 and this '
      +'file has no vector solution.</div>';
  else
    s+='<div class="note">Intensities are normalised to the peak on screen. '
      +(st.trueColour?'Colour is the CIE fit for '+fmt(st.lam,1)+' nm, desaturated into '
        +'the sRGB gamut — a monochromatic line cannot be shown correctly on a monitor.'
       :'False colour: the NeonColors ramp reads as a magnitude, not a hue.')+'</div>';
  return s;
}

function eqbarHTML(M){
  const st=M.st, ap=M.ap;
  if(st.view==='grating'){
    const g=M.grat;
    return '<span class="lhs">d sin θ = m λ</span> &nbsp;&nbsp; '
      +'<span class="hl">R = λ/Δλ = mN</span> = '+g.m+'×'+g.N+' = <span class="hl">'+g.R+'</span>'
      +(g.pair?' &nbsp;&nbsp; needs <span class="hl2">'+fmt(g.pair.need,1)+'</span>':'')
      +'<span class="sm">the resolving power of a grating is the order times the number of '
      +'grooves the beam actually covers — nothing else about the instrument enters</span>';
  }
  if(st.view==='airy'){
    return '<span class="lhs">I/I<sub>0</sub> = [2J<sub>1</sub>(v)/v]<sup>2</sup></span>, '
      +'v = πD sin θ/λ &nbsp;&nbsp; first zero at <span class="hl">1.2197 λ/D</span>'
      +'<span class="sm">the Rayleigh criterion is that zero; Sparrow&rsquo;s is 0.9472 λ/D, '
      +'where the dip between two sources just disappears</span>';
  }
  if(st.view==='near'){
    return '<span class="lhs">C(u) + iS(u) = ∫<sub>0</sub><sup>u</sup> e<sup>iπt²/2</sup> dt</span>'
      +' &nbsp;&nbsp; I = ½|Δ(C+iS)|<sup>2</sup>'
      +'<span class="sm">the intensity is the square of a <i>chord</i> of the Cornu spiral — '
      +'the aperture picks the arc, and the straight line across it is the field</span>';
  }
  const lhs=(ap.kind==='circle')
    ? 'I/I<sub>0</sub> = [2J<sub>1</sub>(v)/v]<sup>2</sup>'
    : (ap.N>1
      ? 'I/I<sub>0</sub> = <span class="hl">sinc²β</span> · <span class="hl2">[sin Nγ / N sin γ]²</span>'
      : 'I/I<sub>0</sub> = <span class="hl">sinc²β</span>');
  const sub=(ap.kind==='circle')
    ? 'v = πD sin θ / λ = '+fmt(PI*ap.D/M.lam,1)+' sin θ'
    : 'β = πa sin θ/λ'+(ap.N>1?', γ = πd sin θ/λ':'')
      +' &nbsp;·&nbsp; the envelope is one slit, the comb is where they are';
  return '<span class="lhs">'+lhs+'</span><span class="sm">'+sub+'</span>';
}

function tagHTML(M){
  const st=M.st;
  const pname=PROPS.find(p=>p.id===M.prop).name;
  if(st.view==='grating')
    return '<b>'+M.grat.lamp.name+'</b> through '+fmt(st.lines,0)+' lines/mm, order '+M.grat.m;
  if(st.view==='airy') return '<b>circular aperture</b> — the resolution limit, and where it comes from';
  return '<b>'+pname+'</b> &nbsp; N<sub>F</sub> = '
    +(M.NF<0.01?M.NF.toExponential(1):fmt(M.NF,2))
    +' &nbsp; '+(M.NF>1?'near field':(M.NF>0.05?'transition':'far field'));
}

/* the headless summary — same numbers, no markup, so selfTest can scan it */
function eqbarText(M){
  return (eqbarHTML(M)+' '+readoutHTML(M)+' '+tagHTML(M)).replace(/<[^>]*>/g,' ');
}

/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  const xt=o.xticks||ticksFor(xlo,xhi,6), yt=o.yticks||ticksFor(ylo,yhi,5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* The vertical extent of the pattern, and how much it has to be stretched.
   A 40 um x 2 mm slit spreads 31.6 mm horizontally and 0.63 mm vertically at
   2 m — a ratio of fifty.  Drawing the screen at true aspect is therefore
   correct and useless: the fringes occupy about one percent of the box and
   the picture is an empty rectangle with a scratch across it.  (Same trap as
   the opaque streamtube in wind_tunnel.html: geometrically right, practically
   blind.)  The vertical is fitted to the vertical pattern instead, and the
   exaggeration is PRINTED rather than hidden. */
function verticalHalf(M,aspect){
  const nat=M.halfW*aspect;
  if(M.ap.kind==='circle') return {eta:nat,exag:1};
  const hM=M.st.hgt*1e-6;
  const pat=(hM>0)?3.2*M.lam*M.z/hM:nat;
  const eta=clamp(Math.min(nat,Math.max(pat,1e-9)),1e-12,nat);
  return {eta,exag:nat/eta};
}
/* A circular pattern is radial, so it is one curve, not an image: sampling
   circFresnel per pixel costs 190x64 radial integrals for a picture that has
   only ~280 distinct values in it. */
function radialLUT(M){
  const n=clamp(Math.round(240+60*M.NF),240,1400);
  const rmax=M.halfW*1.45, ys=new Float64Array(n);
  let mx=0;
  for(let i=0;i<n;i++){
    const r=rmax*i/(n-1);
    const v=(M.prop==='fraunhofer')
      ? airyI(PI*M.ap.D*(r/Math.sqrt(r*r+M.z*M.z))/M.lam)
      : circFresnel(r,M.ap.D/2,M.lam,M.z,900);
    ys[i]=isFinite(v)?v:0;
    if(ys[i]>mx) mx=ys[i];
  }
  if(mx>0) for(let i=0;i<n;i++) ys[i]/=mx;
  return {rmax,ys,n};
}
function radialAt(L,r){
  const t=clamp(r/L.rmax,0,1)*(L.n-1);
  const i=Math.min(L.n-2,Math.floor(t)), f=t-i;
  return L.ys[i]+(L.ys[i+1]-L.ys[i])*f;
}

/* display mapping: raw intensity -> 0..1 for drawing */
function display(v,st){
  const x=clamp(v,0,1);
  if(st.logI){ const f=1e-5; return clamp((Math.log10(x+f)-Math.log10(f))/(-Math.log10(f)),0,1); }
  return Math.pow(x,clamp(st.gam,0.15,1.6));
}
function patCss(v,st,nm){
  const u=display(v,st);
  return st.trueColour?spectralCss(nm,u):falseCss(u);
}

/* ================================================================== *
 *  view: the bench  (3-D)                                             *
 * ================================================================== */
/* The carpet is a HEIGHT FIELD, and a height field seen edge-on is a wall.
   The default camera therefore looks down at it (phi = 0.52, set in makeScene)
   and the relief is kept low enough that the screen behind it stays legible. */
const AXL=5.4, TRW=2.15, HTZ=1.05;
/* the carpet stops short of the screen: run it all the way and its far end,
   which is as tall as the pattern is bright, stands in front of the lower half
   of the screen and hides the answer behind the working */
const CARPET_END=0.84;

/* the carpet: I(xi, x) from just behind the aperture to the screen.  The
   transverse half-width of each plane is the beam's own, so the surface is a
   cone that opens — near the aperture the pattern IS the aperture. */
function buildCarpet(M,nPlane,nS){
  const st=M.st, ap=M.ap, z=M.z;
  const apHalf=(ap.kind==='circle')?ap.D/2
              :(ap.kind==='edge')?M.halfW*0.5
              :Math.max(ap.a,ap.d*(ap.N-1)+ap.a)/2;
  const zNear=Math.max(z/300,2e-4);
  const planes=[];
  for(let p=0;p<nPlane;p++){
    const u=p/(nPlane-1);
    const x=zNear*Math.pow(z/zNear,u);
    const hw=clamp(Math.max(apHalf*1.35,M.halfW*x/z),1e-9,M.halfW);
    const sub={kind:ap.kind,lam:ap.lam,a:ap.a,d:ap.d,N:ap.N,D:ap.D,z:x,open:ap.open};
    const prop=(M.prop==='fraunhofer')?'fresnel':M.prop;   /* far-field form is meaningless here */
    const ys=new Float64Array(nS), xs=new Float64Array(nS);
    let mx=0;
    for(let i=0;i<nS;i++){
      const xi=-hw+2*hw*i/(nS-1);
      const v=intensityRaw(xi,sub,prop,1);
      xs[i]=xi; ys[i]=isFinite(v)?v:0;
      if(ys[i]>mx) mx=ys[i];
    }
    if(mx>0) for(let i=0;i<nS;i++) ys[i]/=mx;
    planes.push({u,x,hw,xs,ys});
  }
  return planes;
}
function drawBench(ctx,W,H,M,S){
  const st=M.st, cam=S.cam;
  cam.W=W; cam.H=H;
  const B=camBasis(cam);
  const nm=st.lam;
  const P=p=>project(cam,B,p);
  const quads=[];
  const push=(pts,col,edge)=>{
    const ss=pts.map(P);
    if(ss.some(s=>!s)) return;
    let d=0; for(const s of ss) d+=s.z; d/=ss.length;
    quads.push({ss,col,edge,d});
  };
  const Ymap=xi=>clamp(xi/M.halfW,-1.6,1.6)*TRW;

  /* floor grid */
  if(st.showGrid){
    ctx.save(); ctx.strokeStyle='#141926'; ctx.lineWidth=1;
    for(let i=0;i<=10;i++){
      const t=i/10;
      const a=P([t*AXL,-TRW,0]), b=P([t*AXL,TRW,0]);
      if(a&&b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      const c=P([0,(2*t-1)*TRW,0]), e=P([AXL,(2*t-1)*TRW,0]);
      if(c&&e){ ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(e.x,e.y); ctx.stroke(); }
    }
    ctx.restore();
  }

  /* The carpet.
     Each plane is drawn across ITS OWN beam width, not across the far-field
     width.  The beam at 6.7 mm is 0.27 mm across and at 2 m it is 82 mm — a
     factor of three hundred — so a common transverse scale renders the whole
     near-field half of the carpet as a knife-edge wall a third of a pixel wide,
     which is where the interesting part lives.  Normalising the width per plane
     turns it into the classic diffraction carpet: the two slits at one end, the
     fringes at the other, and the transition in between.  The scaling is
     printed on the canvas, and the two end widths with it. */
  if(st.showCarpet&&S.carpet){
    const pl=S.carpet;
    for(let p=0;p<pl.length-1;p++){
      const A=pl[p], Bp=pl[p+1];
      const XA=A.u*AXL*CARPET_END, XB=Bp.u*AXL*CARPET_END;
      const n=A.xs.length;
      for(let i=0;i<n-1;i++){
        const t0=i/(n-1), t1=(i+1)/(n-1);
        const Y0=(-1+2*t0)*TRW, Y1=(-1+2*t1)*TRW;
        const jA0=Math.round(t0*(A.xs.length-1)), jA1=Math.round(t1*(A.xs.length-1));
        const jB0=Math.round(t0*(Bp.xs.length-1)), jB1=Math.round(t1*(Bp.xs.length-1));
        const v=(A.ys[jA0]+A.ys[jA1]+Bp.ys[jB0]+Bp.ys[jB1])/4;
        if(v<3e-4) continue;
        const pts=[[XA,Y0,A.ys[jA0]*HTZ],
                   [XA,Y1,A.ys[jA1]*HTZ],
                   [XB,Y1,Bp.ys[jB1]*HTZ],
                   [XB,Y0,Bp.ys[jB0]*HTZ]];
        push(pts,patCss(v,st,nm),null);
      }
    }
  }

  /* the aperture plate, at X = -0.35, drawn with the slots open.  The
     transverse exaggeration is enormous and is printed on the canvas. */
  if(st.showPlate){
    const XP=-0.42, ap=M.ap;
    const plateH=HTZ*1.15, top=plateH;
    /* the plate shares the FIRST carpet plane's scale, so the slots line up
       with the bars they produce instead of being a scale apart */
    const hw0=(S.carpet&&S.carpet.length)?S.carpet[0].hw:M.halfW;
    const Yp=xi=>clamp(xi/hw0,-1.35,1.35)*TRW;
    const segs=[];
    if(ap.kind==='circle'){
      segs.push([-TRW*1.35,Yp(-ap.D/2)],[Yp(ap.D/2),TRW*1.35]);
    } else if(ap.kind==='edge'){
      segs.push([-TRW*1.35,0]);
    } else {
      let prev=-TRW*1.35;
      for(const iv of ap.open){
        const y0=Yp(iv[0]), y1=Yp(iv[1]);
        segs.push([prev,y0]); prev=y1;
      }
      segs.push([prev,TRW*1.35]);
    }
    for(const [y0,y1] of segs){
      if(!(y1>y0)) continue;
      push([[XP,y0,0],[XP,y1,0],[XP,y1,top],[XP,y0,top]],'#39404f','#4a5265');
    }
  }

  /* the screen at X = AXL, carrying the real 2-D pattern */
  if(st.showScreen){
    const nS=Math.min(140,M.prof.xs.length), nH=34;
    const hh=HTZ*1.3;
    /* the vertical is fitted to the vertical pattern, not to the horizontal
       one — see verticalHalf() */
    const VHb=verticalHalf(M,hh/(TRW*1.3));
    const LUT=(M.ap.kind==='circle')?radialLUT(M):null;
    for(let i=0;i<nS-1;i++){
      const j0=Math.round(i/(nS-1)*(M.prof.xs.length-1));
      const j1=Math.round((i+1)/(nS-1)*(M.prof.xs.length-1));
      const y0=Ymap(M.prof.xs[j0]), y1=Ymap(M.prof.xs[j1]);
      const ix=(M.prof.ys[j0]+M.prof.ys[j1])/2;
      const xiMid=(M.prof.xs[j0]+M.prof.xs[j1])/2;
      for(let q=0;q<nH;q++){
        const e0=(q/nH*2-1)*hh, e1=((q+1)/nH*2-1)*hh;
        const eta=(e0+e1)/2/hh*VHb.eta;
        const hf=LUT?1:heightFactor(eta,st,M.ap);
        const v=LUT?radialAt(LUT,Math.hypot(xiMid,eta)):ix*hf;
        if(v<2e-4) continue;
        push([[AXL,y0,e0+hh],[AXL,y1,e0+hh],[AXL,y1,e1+hh],[AXL,y0,e1+hh]],
             patCss(v,st,nm),null);
      }
    }
    /* the screen's own frame */
    ctx.save();
    const c=[P([AXL,-TRW*1.3,0]),P([AXL,TRW*1.3,0]),P([AXL,TRW*1.3,2*hh]),P([AXL,-TRW*1.3,2*hh])];
    if(c.every(Boolean)){
      ctx.strokeStyle='#2b3243'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(c[0].x,c[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(c[i].x,c[i].y);
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  /* painter's algorithm */
  quads.sort((p,q)=>q.d-p.d);
  for(const q of quads){
    ctx.beginPath();
    ctx.moveTo(q.ss[0].x,q.ss[0].y);
    for(let i=1;i<q.ss.length;i++) ctx.lineTo(q.ss[i].x,q.ss[i].y);
    ctx.closePath();
    ctx.fillStyle=q.col; ctx.fill();
    if(q.edge){ ctx.strokeStyle=q.edge; ctx.lineWidth=1; ctx.stroke(); }
  }

  /* rays to the first orders, and the axis */
  if(st.showRays){
    ctx.save();
    const ax0=P([-0.42,0,0]), ax1=P([AXL,0,0]);
    if(ax0&&ax1){ ctx.strokeStyle='#2f3646';
      ctx.setLineDash([5,5]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(ax0.x,ax0.y); ctx.lineTo(ax1.x,ax1.y); ctx.stroke();
      ctx.setLineDash([]); }
    for(const o of M.orders){
      if(o.m===0||o.miss) continue;
      const a=P([-0.42,0,0]), b=P([AXL,Ymap(o.xi),0]);
      if(a&&b){
        ctx.strokeStyle=rgba('#5ac8e0',0.34); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* axial scale — the axis is logarithmic and that must be said, and so must
     the fact that every plane carries its own transverse scale */
  ctx.save();
  ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#6f7789';
  ctx.textAlign='center'; ctx.textBaseline='top';
  if(S.carpet&&S.carpet.length){
    for(let p=0;p<S.carpet.length;p+=Math.max(1,Math.floor(S.carpet.length/5))){
      const pl=S.carpet[p], s=P([pl.u*AXL*CARPET_END,-TRW*1.32,0]);
      if(s) ctx.fillText(fmtLen(pl.x,2),s.x,s.y+4);
    }
    const s2=P([AXL,-TRW*1.32,0]);
    if(s2) ctx.fillText(fmtLen(M.z,2),s2.x,s2.y+4);
  }
  /* The caption goes TOP-left, not bottom-left.  The axial labels are projected,
     so they move with the camera, and raising the target dropped "2.00 m" onto
     the bottom caption; the bottom-left is also where the HTML hint sits. */
  ctx.textAlign='left'; ctx.textBaseline='top';
  if(S.carpet&&S.carpet.length){
    const w0=2*S.carpet[0].hw, w1=2*S.carpet[S.carpet.length-1].hw;
    caption(ctx,14,44,
      'The axial scale is logarithmic — the interesting part is. Each slice is drawn '
      +'across its own beam width, which runs from '+fmtLen(w0,2)+' just behind the '
      +'aperture to '+fmtLen(w1,2)+' at the screen; on one common scale the whole '
      +'near-field half would be a third of a pixel wide. Heights are per-slice peaks.',
      Math.max(240,Math.min(560,W-380)),'#6a7285');
  }
  ctx.restore();
  return {Ymap};
}

/* ================================================================== *
 *  view: the screen  (the 2-D pattern as it lands)                    *
 * ================================================================== */
function drawScreen(ctx,W,H,M){
  const st=M.st, nm=st.lam;
  const padL=70, padR=326, padT=46, padB=118;
  const availW=Math.max(120,W-padL-padR), availH=Math.max(120,H-padT-padB);
  /* the full available width: a square-ish box left a third of the stage empty */
  const b=box(padL,padT,availW,Math.min(availW*0.40,Math.round(availH*0.54)));
  const nx=Math.min(190,M.prof.xs.length), ny=64;
  const dx=b.w/nx, dy=b.h/ny;
  /* separable: I(xi,eta) = Ix(xi) * Iy(eta), so the inner loop is a multiply */
  const Ix=new Float64Array(nx), Iy=new Float64Array(ny);
  for(let i=0;i<nx;i++){
    const j=Math.round(i/(nx-1)*(M.prof.xs.length-1));
    Ix[i]=M.prof.ys[j];
  }
  const VH=verticalHalf(M,b.h/b.w), etaHalf=VH.eta;
  for(let q=0;q<ny;q++){
    const eta=(-1+2*(q+0.5)/ny)*etaHalf;
    Iy[q]=(M.ap.kind==='circle')?1:heightFactor(eta,st,M.ap);
  }
  if(M.ap.kind==='circle'){
    /* genuinely 2-D and radial — but radial means ONE curve, so it is sampled
       once into a lookup table rather than integrated per pixel */
    const L=radialLUT(M);
    for(let q=0;q<ny;q++){
      const eta=(-1+2*(q+0.5)/ny)*etaHalf;
      for(let i=0;i<nx;i++){
        const xi=M.prof.xs[Math.round(i/(nx-1)*(M.prof.xs.length-1))];
        const v=radialAt(L,Math.hypot(xi,eta));
        if(v<2e-4) continue;
        ctx.fillStyle=patCss(v,st,nm);
        ctx.fillRect(b.x+i*dx,b.y+q*dy,dx+0.7,dy+0.7);
      }
    }
  } else {
    for(let q=0;q<ny;q++){
      if(Iy[q]<2e-4) continue;
      for(let i=0;i<nx;i++){
        const v=Ix[i]*Iy[q];
        if(v<2e-4) continue;
        ctx.fillStyle=patCss(v,st,nm);
        ctx.fillRect(b.x+i*dx,b.y+q*dy,dx+0.7,dy+0.7);
      }
    }
  }
  frame(ctx,b,'#2b3243');
  ctx.save();
  ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#6f7789';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(const t of ticksFor(-M.halfW*1e3,M.halfW*1e3,6)){
    const X=b.x+b.w*(t*1e-3+M.halfW)/(2*M.halfW);
    if(X<b.x-1||X>b.x1+1) continue;
    ctx.fillText(fmt(t,t===0?0:2),X,b.y1+5);
  }
  ctx.fillStyle='#8b93a6'; ctx.font='11px -apple-system, sans-serif';
  ctx.fillText('position on the screen, mm',b.x+b.w/2,b.y1+21);
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.fillText('what lands on the screen',b.x,b.y-6);
  if(VH.exag>1.05){
    ctx.textAlign='right'; ctx.font='11px -apple-system, sans-serif';
    ctx.fillStyle='#e8843a';
    ctx.fillText('vertical ×'+fmt(VH.exag,VH.exag<10?1:0)+' — the real pattern is '
                 +fmtLen(2*etaHalf,2)+' tall',b.x1,b.y-6);
  }
  ctx.restore();

  /* the cross-section under it, on the same x scale */
  const pb=box(b.x,b.y1+38,b.w,Math.max(70,H-padB-(b.y1+38)+40));
  const xs=[],ys=[];
  for(let i=0;i<M.prof.xs.length;i++){ xs.push(M.prof.xs[i]*1e3); ys.push(display(M.prof.ys[i],st)); }
  axes(ctx,pb,-M.halfW*1e3,M.halfW*1e3,0,1.04,
       {xfmt:t=>fmt(t,t===0?0:2),yfmt:t=>fmt(t,1),
        xlab:'position on the screen, mm',
        ylab:st.logI?'log I':'I '+(Math.abs(st.gam-1)>0.02?'(γ '+fmt(st.gam,2)+')':'')});
  polyline(ctx,pb,xs,ys,-M.halfW*1e3,M.halfW*1e3,0,1.04,'#b8ec4c',1.7);
  ctx.save();
  caption(ctx,pb.x,pb.y1+34,
    (M.ap.kind==='circle')
      ? 'A circular aperture has no preferred direction, so the pattern is the Airy '
        +'rings — drawn at true aspect here, and the curve below is one radial cut '
        +'through them. The first dark ring is at '+fmtLen(M.airy1,2)+'.'
      : 'The vertical extent is the finite slit height — '+fmtLen(st.hgt*1e-6,1)
        +' tall gives a first zero '+fmtLen(M.lam*M.z/Math.max(st.hgt*1e-6,1e-12),2)
        +' off axis, which is why a real single-slit pattern is a short bar and not a line.',
    pb.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view: the profile                                                  *
 * ================================================================== */
function drawProfile(ctx,W,H,M){
  const st=M.st, ap=M.ap;
  const padL=74, padR=330, padT=52, padB=96;
  const b=box(padL,padT,Math.max(160,W-padL-padR),Math.max(140,H-padT-padB));
  const xlo=-M.halfW*1e3, xhi=M.halfW*1e3;
  axes(ctx,b,xlo,xhi,0,1.06,{xfmt:t=>fmt(t,Math.abs(xhi)<1?3:2),yfmt:t=>fmt(t,1),
    xlab:'position on the screen, mm    ( sinθ at the right edge = '
         +fmt(M.halfW/Math.sqrt(M.halfW*M.halfW+M.z*M.z),4)+' )',
    ylab:st.logI?'log I / I₀':'I / I₀'+(Math.abs(st.gam-1)>0.02?'  (γ '+fmt(st.gam,2)+')':''),
    title:'the profile — '+PROPS.find(p=>p.id===M.prop).name});

  /* the envelope, drawn separately: the whole point of the decomposition */
  if(st.showEnv&&ap.kind!=='circle'&&ap.kind!=='edge'&&ap.N>1){
    const xs=[],ys=[];
    for(let i=0;i<M.prof.xs.length;i++){
      const xi=M.prof.xs[i], s=xi/Math.sqrt(xi*xi+M.z*M.z);
      xs.push(xi*1e3); ys.push(display(sinc2(PI*ap.a*s/M.lam),st));
    }
    polyline(ctx,b,xs,ys,xlo,xhi,0,1.06,rgba('#e8843a',0.85),1.4,[6,4]);
  }
  /* the other two propagators, for comparison */
  if(st.showCompare){
    const others=['fraunhofer','fresnel','rs'].filter(p=>p!==M.prop);
    const cols={fraunhofer:rgba('#8b93a6',0.7),fresnel:rgba('#cd35c4',0.7),rs:rgba('#5ac8e0',0.7)};
    for(const p of others){
      if(ap.kind==='edge'&&p==='fraunhofer') continue;
      if(ap.kind==='circle'&&p==='rs') continue;
      const n=Math.min(200,M.prof.xs.length);
      const xs=[],ys=[]; let mx=0; const raw=[];
      for(let i=0;i<n;i++){
        const xi=-M.halfW+2*M.halfW*i/(n-1);
        const v=intensityRaw(xi,ap,p,1);
        raw.push(isFinite(v)?v:0); if(raw[i]>mx) mx=raw[i]; xs.push(xi*1e3);
      }
      for(let i=0;i<n;i++) ys.push(display(mx>0?raw[i]/mx:0,st));
      polyline(ctx,b,xs,ys,xlo,xhi,0,1.06,cols[p],1.15,[2,3]);
    }
  }
  /* the active one, on top */
  {
    const xs=[],ys=[];
    for(let i=0;i<M.prof.xs.length;i++){ xs.push(M.prof.xs[i]*1e3); ys.push(display(M.prof.ys[i],st)); }
    polyline(ctx,b,xs,ys,xlo,xhi,0,1.06,'#b8ec4c',1.9);
  }
  /* orders and zeros */
  if(st.showOrders){
    ctx.save(); ctx.font='10px -apple-system, sans-serif';
    for(const z of M.zeros) for(const sgn of [-1,1]){
      const X=b.x+b.w*(sgn*z*1e3-xlo)/(xhi-xlo);
      if(X<b.x||X>b.x1) continue;
      ctx.strokeStyle=rgba('#e8843a',0.3); ctx.setLineDash([2,4]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(const o of M.orders){
      const X=b.x+b.w*(o.xi*1e3-xlo)/(xhi-xlo);
      if(X<b.x+4||X>b.x1-4) continue;
      ctx.fillStyle=o.miss?'#e8843a':'#8b93a6';
      ctx.fillText(o.miss?'('+o.m+')':String(o.m),X,b.y+3);
    }
    ctx.restore();
  }
  /* legend + caption */
  ctx.save();
  ctx.font='11px -apple-system, sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
  let lx=b.x, ly=b.y1+52;
  const key=(col,lab,dash)=>{
    ctx.strokeStyle=col; ctx.lineWidth=2; if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+18,ly); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#8b93a6'; ctx.fillText(lab,lx+24,ly);
    lx+=24+ctx.measureText(lab).width+22;
  };
  key('#b8ec4c',PROPS.find(p=>p.id===M.prop).name);
  if(st.showEnv&&ap.N>1&&ap.kind!=='circle'&&ap.kind!=='edge') key(rgba('#e8843a',0.85),'one slit (the envelope)',[6,4]);
  if(st.showCompare){
    if(M.prop!=='fraunhofer'&&ap.kind!=='edge') key(rgba('#8b93a6',0.7),'Fraunhofer',[2,3]);
    if(M.prop!=='fresnel') key(rgba('#cd35c4',0.7),'Fresnel',[2,3]);
    if(M.prop!=='rs'&&ap.kind!=='circle') key(rgba('#5ac8e0',0.7),'Rayleigh–Sommerfeld',[2,3]);
  }
  const txt=(M.missing.length
    ? 'd/a = '+fmt(ap.d/ap.a,2)+' exactly, so orders ±'+M.missing.slice(0,3).join(', ±')
      +' fall on zeros of the envelope and vanish — the bracketed labels. '
    : '')
    +(M.quartic>0.3
      ? 'The paraxial curves are '+fmt(M.quartic,2)+' rad of phase past their range here; '
        +'where they separate from Rayleigh–Sommerfeld, it is they that are wrong.'
      : 'All three agree to the width of the line — which is the statement that this '
        +'geometry is in the far field.');
  caption(ctx,b.x,ly+16,txt,b.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view: near field — the Cornu spiral IS the answer                  *
 * ================================================================== */
function drawNear(ctx,W,H,M){
  const st=M.st, ap=M.ap;
  const padL=64, padR=326, padT=50, padB=88;
  const availW=Math.max(240,W-padL-padR), availH=Math.max(220,H-padT-padB);
  const gap=54;
  const leftW=Math.min(availH-58,Math.floor((availW-gap)*0.52));
  const cb=box(padL,padT,leftW,leftW);
  const rx=cb.x1+gap, rw=Math.max(150,availW-leftW-gap);
  /* 62, not 46: at 46 the upper panel's x-axis label sits on the lower
     panel's title (the audit caught it in the Airy view, same layout) */
  const rh=Math.floor((availH-62)/2);
  const pb=box(rx,padT,rw,rh);
  const nb=box(rx,padT+rh+62,rw,rh);

  /* ---- the spiral ---- */
  const UMAX=4.6;
  axes(ctx,cb,-0.85,0.85,-0.85,0.85,{xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,1),
    xlab:'C(u)',ylab:'S(u)',title:'the Cornu spiral'});
  {
    const xs=[],ys=[];
    for(let i=0;i<=1400;i++){ const u=-UMAX+2*UMAX*i/1400; const r=fresnelCS(u);
      xs.push(r[0]); ys.push(r[1]); }
    polyline(ctx,cb,xs,ys,-0.85,0.85,-0.85,0.85,rgba('#5ac8e0',0.55),1.2);
    /* the eyes of the spiral, at (±1/2, ±1/2) */
    ctx.save(); ctx.fillStyle=rgba('#8b93a6',0.8);
    for(const s of [1,-1]){
      const X=cb.x+cb.w*(s*0.5+0.85)/1.7, Y=cb.y1-cb.h*(s*0.5+0.85)/1.7;
      ctx.beginPath(); ctx.arc(X,Y,2,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  /* the arc the aperture selects, and the chord across it */
  const probeXi=(st.probe===undefined?0:st.probe)*M.halfW;
  if(ap.kind!=='circle'){
    const kf=Math.sqrt(2/(M.lam*M.z));
    let cr=0,ci=0, first=null,last=null;
    for(const iv of ap.open){
      const u1=(iv[0]-probeXi)*kf, u2=(iv[1]-probeXi)*kf;
      const A=fresnelCS(clamp(u1,-UMAX,UMAX)), Bv=fresnelCS(clamp(u2,-UMAX,UMAX));
      const xs=[],ys=[];
      const n=180;
      for(let i=0;i<=n;i++){
        const u=clamp(u1+(u2-u1)*i/n,-UMAX,UMAX);
        const r=fresnelCS(u); xs.push(r[0]); ys.push(r[1]);
      }
      polyline(ctx,cb,xs,ys,-0.85,0.85,-0.85,0.85,'#b8ec4c',2.4);
      const F1=fresnelCS(u1), F2=fresnelCS(u2);
      cr+=F2[0]-F1[0]; ci+=F2[1]-F1[1];
      if(!first) first=F1;
      last=F2;
    }
    if(first&&last){
      ctx.save();
      const X0=cb.x+cb.w*(first[0]+0.85)/1.7, Y0=cb.y1-cb.h*(first[1]+0.85)/1.7;
      const X1=cb.x+cb.w*(last[0]+0.85)/1.7,  Y1=cb.y1-cb.h*(last[1]+0.85)/1.7;
      ctx.strokeStyle='#cd35c4'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1); ctx.stroke();
      ctx.fillStyle='#cd35c4';
      ctx.beginPath(); ctx.arc(X0,Y0,3,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(X1,Y1,3,0,TAU); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    caption(ctx,cb.x,cb.y1+42,
      'The green arc is the open part of the aperture, measured from the observation '
      +'point. The magenta chord is the resultant field: I = ½|chord|² = '
      +fmt(0.5*(cr*cr+ci*ci),3)+' of the unobstructed intensity. Push the probe off '
      +'axis and watch the arc slide round the spiral.',
      cb.w,'#767e92');
    ctx.restore();
  } else {
    ctx.save();
    caption(ctx,cb.x,cb.y1+42,
      'The Cornu construction is one-dimensional — it is the slit branch. A circular '
      +'aperture needs the radial integral instead, which is what the panels to the '
      +'right are computing.',cb.w,'#767e92');
    ctx.restore();
  }

  /* ---- the profile at this z ---- */
  const xs=[],ys=[];
  for(let i=0;i<M.prof.xs.length;i++){ xs.push(M.prof.xs[i]*1e3); ys.push(M.prof.ys[i]); }
  let ymax=1.06; for(const v of ys) if(v>ymax-0.06) ymax=v+0.06;
  axes(ctx,pb,-M.halfW*1e3,M.halfW*1e3,0,ymax,
    {xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,1),xlab:'screen position, mm',ylab:'I / I(peak)',
     title:'at N_F = '+(M.NF<0.01?M.NF.toExponential(1):fmt(M.NF,2))});
  polyline(ctx,pb,xs,ys,-M.halfW*1e3,M.halfW*1e3,0,ymax,'#b8ec4c',1.7);
  {
    const X=pb.x+pb.w*(probeXi*1e3+M.halfW*1e3)/(2*M.halfW*1e3);
    ctx.save(); ctx.strokeStyle=rgba('#cd35c4',0.8); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(X,pb.y); ctx.lineTo(X,pb.y1); ctx.stroke(); ctx.restore();
  }
  /* the geometric shadow, for reference */
  if(ap.kind!=='circle'&&ap.kind!=='edge'){
    ctx.save(); ctx.strokeStyle=rgba('#8b93a6',0.35); ctx.setLineDash([3,4]); ctx.lineWidth=1;
    for(const iv of ap.open) for(const e of iv){
      const X=pb.x+pb.w*(e+M.halfW)/(2*M.halfW);
      if(X<pb.x||X>pb.x1) continue;
      ctx.beginPath(); ctx.moveTo(X,pb.y); ctx.lineTo(X,pb.y1); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.restore();
  }

  /* ---- on-axis intensity against Fresnel number ---- */
  const isCirc=(ap.kind==='circle');
  axes(ctx,nb,0,6,0,4.35,{xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0),
    xlab:'Fresnel number  N_F = a²/λz   (a = half width)',
    ylab:'I(0) / I unobstructed',
    title:isCirc?'on axis: 4 sin²(πN_F/2), exactly':'on axis, against N_F'});
  {
    const xs2=[],ys2=[];
    for(let i=0;i<=340;i++){
      const nf=6*i/340;
      if(isCirc){ xs2.push(nf); ys2.push(circAxis(nf)); }
      else{
        if(nf<1e-4){ xs2.push(nf); ys2.push(0); continue; }
        const half=ap.a/2, zz=half*half/(M.lam*nf);
        const sub={kind:ap.kind,lam:M.lam,a:ap.a,d:ap.d,N:ap.N,D:ap.D,z:zz,open:ap.open};
        xs2.push(nf); ys2.push(fresnelSlits(0,sub));
      }
    }
    polyline(ctx,nb,xs2,ys2,0,6,0,4.35,isCirc?'#e8843a':'#b8ec4c',1.8);
  }
  {
    const X=nb.x+nb.w*clamp(M.NF,0,6)/6;
    ctx.save(); ctx.strokeStyle=rgba('#cd35c4',0.8); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(X,nb.y); ctx.lineTo(X,nb.y1); ctx.stroke(); ctx.restore();
  }
  ctx.save();
  caption(ctx,nb.x,nb.y1+40,
    isCirc
      ? 'A circular aperture on axis is exactly 4 sin²(πN_F/2): it reaches FOUR times '
        +'the intensity that would be there with no aperture at all, and falls to zero '
        +'in between. Blocking light can make a point brighter.'
      : 'A slit does not have that closed form, but the same oscillation is there — each '
        +'time the aperture admits one more half-period of the Cornu spiral, the chord '
        +'swings. The magenta line is where this bench sits.',
    nb.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view: the Airy disc and the resolution limit                       *
 * ================================================================== */
const AIRY_ZERO=3.831705970207512;       /* j(1,1) */
const RAYLEIGH=1.2196698912665045;       /* j(1,1)/pi, in lambda/D          */
const SPARROW =0.947155238896;           /* dip vanishes; computed in scipy */
const AIRY_FWHM=1.028993969962;
function encircled(v){ const j0=besselJ0(v), j1=besselJ1(v); return 1-j0*j0-j1*j1; }

function drawAiry(ctx,W,H,M){
  const st=M.st;
  /* padB has to hold the four-line caption under the bottom-right panel —
     it overran the canvas by 2 px at 92 and the audit caught it */
  const padL=64, padR=326, padT=50, padB=124;
  const availW=Math.max(240,W-padL-padR), availH=Math.max(220,H-padT-padB);
  const gap=54;
  const leftW=Math.min(availH-58,Math.floor((availW-gap)*0.50));
  const ib=box(padL,padT,leftW,leftW);
  const rx=ib.x1+gap, rw=Math.max(150,availW-leftW-gap);
  const rh=Math.floor((availH-62)/2);
  const pb=box(rx,padT,rw,rh);
  const eb=box(rx,padT+rh+62,rw,rh);

  const D=Math.max(M.ap.D,1e-9), lamD=M.lam/D;
  const sepV=st.sep*PI;                       /* separation in v units */
  /* the window has to be tight enough that the PAIR is the picture: at
     ±4 λ/D two sources one Rayleigh apart occupy a fifth of the frame and read
     as a single blob, however clearly the profile beside them shows two peaks */
  const VMAX=Math.max(6.5,sepV*1.15+4.6);
  /* ---- the image ---- */
  const nn=74, dpx=ib.w/nn;
  let mx=0; const grid=new Float64Array(nn*nn);
  for(let q=0;q<nn;q++) for(let i=0;i<nn;i++){
    const vx=(-1+2*(i+0.5)/nn)*VMAX, vy=(-1+2*(q+0.5)/nn)*VMAX;
    const v=airyI(Math.hypot(vx-sepV/2,vy))+airyI(Math.hypot(vx+sepV/2,vy));
    grid[q*nn+i]=v; if(v>mx) mx=v;
  }
  for(let q=0;q<nn;q++) for(let i=0;i<nn;i++){
    const v=grid[q*nn+i]/mx;
    if(v<2e-4) continue;
    ctx.fillStyle=patCss(v,st,st.lam);
    ctx.fillRect(ib.x+i*dpx,ib.y+q*dpx,dpx+0.7,dpx+0.7);
  }
  frame(ctx,ib,'#2b3243');
  ctx.save();
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('two point sources, incoherent',ib.x,ib.y-6);
  ctx.restore();

  /* ---- the radial profile with the criteria ---- */
  axes(ctx,pb,-VMAX,VMAX,0,1.06,
    {xfmt:t=>fmt(t/PI,1),yfmt:t=>fmt(t,1),
     xlab:'angle, in units of λ/D',ylab:'I (sum, normalised)',
     title:'separation '+fmt(st.sep,3)+' λ/D'});
  {
    const xs=[],ys=[],x1=[],y1=[],x2=[],y2=[];
    let pk=0;
    for(let i=0;i<=520;i++){
      const v=-VMAX+2*VMAX*i/520;
      const s=airyI(Math.abs(v-sepV/2))+airyI(Math.abs(v+sepV/2));
      if(s>pk) pk=s;
    }
    for(let i=0;i<=520;i++){
      const v=-VMAX+2*VMAX*i/520;
      const A=airyI(Math.abs(v-sepV/2)), B=airyI(Math.abs(v+sepV/2));
      xs.push(v); ys.push((A+B)/pk);
      x1.push(v); y1.push(A/pk); x2.push(v); y2.push(B/pk);
    }
    polyline(ctx,pb,x1,y1,-VMAX,VMAX,0,1.06,rgba('#5ac8e0',0.6),1.1,[3,3]);
    polyline(ctx,pb,x2,y2,-VMAX,VMAX,0,1.06,rgba('#cd35c4',0.6),1.1,[3,3]);
    polyline(ctx,pb,xs,ys,-VMAX,VMAX,0,1.06,'#b8ec4c',1.9);
    /* the dip */
    const mid=(airyI(sepV/2)*2)/pk;
    let peak=0;
    for(let i=0;i<=520;i++){
      const v=-VMAX+2*VMAX*i/520;
      const s=(airyI(Math.abs(v-sepV/2))+airyI(Math.abs(v+sepV/2)))/pk;
      if(s>peak) peak=s;
    }
    ctx.save();
    const X=pb.x+pb.w*0.5, Y=pb.y1-pb.h*mid/1.06;
    ctx.strokeStyle=rgba('#e8843a',0.8); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X,pb.y1-pb.h*peak/1.06); ctx.stroke();
    ctx.fillStyle='#e8843a'; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('dip '+fmt(100*mid/peak,1)+'%',X+6,(Y+pb.y1-pb.h*peak/1.06)/2);
    ctx.restore();
  }
  /* Criteria markers.  The three sit at 0.947, 1.029 and 1.220 λ/D — within a
     tenth of each other, so a single label row collides every time (the audit
     caught all three pairs).  Sorted by position and stacked, one row each. */
  ctx.save();
  ctx.font='10px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  const CRIT=[[SPARROW,'Sparrow','#5ac8e0'],[AIRY_FWHM,'FWHM','#8b93a6'],
              [RAYLEIGH,'Rayleigh','#b8ec4c']].slice().sort((p,q)=>p[0]-q[0]);
  let crow=0, lastCX=-1e9;
  for(const [val,lab,col] of CRIT){
    const X=pb.x+pb.w*(val*PI+VMAX)/(2*VMAX);
    if(X<pb.x+2||X>pb.x1-2) continue;
    ctx.strokeStyle=rgba(col,0.45); ctx.setLineDash([2,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X,pb.y); ctx.lineTo(X,pb.y1); ctx.stroke(); ctx.setLineDash([]);
    const wpx=ctx.measureText(lab).width;
    if(X-lastCX<wpx+8) crow++; else crow=0;
    lastCX=X;
    ctx.fillStyle=rgba(col,0.9); ctx.fillText(lab,X,pb.y+3+crow*12);
  }
  ctx.restore();

  /* ---- encircled energy ---- */
  axes(ctx,eb,0,14,0,1.02,{xfmt:t=>fmt(t/PI,1),yfmt:t=>fmt(t,1),
    xlab:'radius, in units of λ/D',ylab:'fraction of the power',
    title:'where the light actually is'});
  {
    const xs=[],ys=[];
    for(let i=0;i<=400;i++){ const v=14*i/400; xs.push(v); ys.push(encircled(v)); }
    polyline(ctx,eb,xs,ys,0,14,0,1.02,'#b8ec4c',1.8);
    ctx.save();
    for(const [v,lab] of [[AIRY_ZERO,'Airy disc'],[7.015586669815619,'2nd ring']]){
      const X=eb.x+eb.w*v/14, Y=eb.y1-eb.h*encircled(v)/1.02;
      ctx.fillStyle='#e8843a';
      ctx.beginPath(); ctx.arc(X,Y,3,0,TAU); ctx.fill();
      ctx.font='10px -apple-system, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText(lab+' '+fmt(100*encircled(v),2)+'%',X+6,Y-2);
    }
    ctx.restore();
  }
  ctx.save();
  caption(ctx,eb.x,eb.y1+40,
    'Rayleigh&rsquo;s criterion is not a law — it is the convenient statement that one peak '
    +'sits on the other&rsquo;s first zero, which leaves a '+fmt(73.5,1)+'% dip. Sparrow&rsquo;s '
    +'is where the dip disappears entirely, at 0.947 λ/D. Both are conventions about a '
    +'continuous curve; with enough photons and a known point-spread function you can do better.',
    eb.w,'#767e92');
  ctx.restore();
  ctx.save();
  caption(ctx,ib.x,ib.y1+16,
    'D = '+fmtLen(D,1)+' at λ = '+fmt(st.lam,1)+' nm gives λ/D = '
    +fmt(lamD*1e6,2)+' µrad; the Airy radius on this screen is '+fmtLen(M.airy1,2)+'.',
    ib.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view: the grating as a spectrometer                                *
 * ================================================================== */
function drawGrating(ctx,W,H,M){
  const st=M.st, g=M.grat;
  const padL=64, padR=326, padT=52, padB=112;
  const bw=Math.max(220,W-padL-padR), availH=Math.max(220,H-padT-padB);
  const h1=Math.round(availH*0.25), h2=Math.round(availH*0.50);
  const sb=box(padL,padT,bw,h1);
  const zb=box(padL,padT+h1+52,bw,h2);
  /* a FIXED bar height: letting it take the leftover made it 138 px tall and
     pushed its caption off the bottom of the canvas */
  const rb=box(padL,padT+h1+h2+102,bw,30);

  /* ---- the dispersed spectrum, angle across ---- */
  let thMax=0;
  for(const L of g.lines) if(L.ok) thMax=Math.max(thMax,L.th);
  thMax=Math.max(thMax*1.18,0.12);
  axes(ctx,sb,0,thMax*RAD,0,1.06,{xfmt:t=>fmt(t,1)+'°',yfmt:t=>'',
    xlab:'diffraction angle θ,  d sin θ = m λ',
    title:'order '+g.m+' of '+g.lamp.name});
  for(const L of g.lines){
    if(!L.ok) continue;
    const X=sb.x+sb.w*(L.th*RAD)/(thMax*RAD);
    ctx.save();
    ctx.strokeStyle=spectralCss(L.nm,1); ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(X,sb.y1); ctx.lineTo(X,sb.y1-sb.h*clamp(L.rel,0.06,1)); ctx.stroke();
    ctx.restore();
  }
  /* labels, laid out so they cannot collide: alternate two rows */
  ctx.save();
  ctx.font='10px -apple-system, sans-serif'; ctx.textBaseline='bottom';
  let lastX=-1e9, row=0;
  const sorted=g.lines.filter(L=>L.ok).slice().sort((p,q)=>p.th-q.th);
  for(const L of sorted){
    const X=sb.x+sb.w*(L.th*RAD)/(thMax*RAD);
    const lab=fmt(L.nm,1);
    const wpx=ctx.measureText(lab).width;
    if(X-lastX<wpx+10) row=1-row; else row=0;
    lastX=X;
    ctx.fillStyle=spectralCss(L.nm,1);
    ctx.textAlign=(X>sb.x1-wpx)?'right':'center';
    ctx.fillText(lab,X,sb.y-4-row*13);
  }
  ctx.restore();

  /* ---- the hardest pair, at instrument resolution ---- */
  if(g.pair){
    const A=g.lines[g.pair.i], Bl=g.lines[g.pair.j];
    const ok1=A.ok&&Bl.ok;
    const th0=ok1?(A.th+Bl.th)/2:0;
    /* a window a few instrumental widths wide */
    const dth=ok1?Math.abs(A.th-Bl.th):1;
    const halfWin=Math.max(dth*2.4,3*Math.abs(A.disp||1)*1e-9*(A.nm/Math.max(g.R,1)));
    axes(ctx,zb,(th0-halfWin)*RAD,(th0+halfWin)*RAD,0,1.12,
      {xfmt:t=>fmt(t,4)+'°',yfmt:t=>fmt(t,1),
       xlab:'θ, degrees — the same axis, magnified',ylab:'I',
       title:A.lab+' and '+Bl.lab+', as this instrument sees them'});
    if(ok1){
      const n=700;
      /* the pair is normalised to ITS OWN peak: mercury's yellow lines have
         relative intensities near 0.42, and plotted against an absolute 1.0
         they sit in the bottom third of a panel whose whole job is to show
         whether the two are separated */
      let pk=0;
      for(const L of [A,Bl]) pk=Math.max(pk,L.rel);
      const SC=1/Math.max(pk,1e-9);
      const line=(L,col,acc)=>{
        const xs=[],ys=[];
        for(let i=0;i<=n;i++){
          const th=th0-halfWin+2*halfWin*i/n;
          const gam=PI*g.d*Math.sin(th)/L.lam;
          const v=gratingFactor(gam,g.N)*L.rel*SC;
          xs.push(th*RAD); ys.push(v);
          if(acc) acc[i]=(acc[i]||0)+v;
        }
        if(col) polyline(ctx,zb,xs,ys,(th0-halfWin)*RAD,(th0+halfWin)*RAD,0,1.12,col,1.4,[4,3]);
      };
      /* accumulate first, draw the SUM, then the two components over it: each
         component equals the sum at its own peak, so drawing them underneath
         leaves only their tails visible and the panel looks like one curve */
      const acc=new Float64Array(n+1);
      line(A,null,acc); line(Bl,null,acc);
      const xs=[],ys=[];
      for(let i=0;i<=n;i++){ xs.push((th0-halfWin+2*halfWin*i/n)*RAD); ys.push(acc[i]); }
      polyline(ctx,zb,xs,ys,(th0-halfWin)*RAD,(th0+halfWin)*RAD,0,1.12,'#b8ec4c',1.9);
      line(A,rgba('#5ac8e0',0.95),null); line(Bl,rgba('#cd35c4',0.95),null);
      ctx.save();
      ctx.font='10.5px -apple-system, sans-serif'; ctx.textBaseline='top';
      ctx.textAlign='left'; ctx.fillStyle=rgba('#5ac8e0',0.95);
      ctx.fillText(A.lab+'  '+fmt(A.nm,4)+' nm',zb.x+8,zb.y+22);
      ctx.fillStyle=rgba('#cd35c4',0.95);
      ctx.fillText(Bl.lab+'  '+fmt(Bl.nm,4)+' nm',zb.x+8,zb.y+36);
      ctx.restore();
      ctx.save();
      ctx.font='11px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillStyle=g.resolved?'#b8ec4c':'#e8843a';
      ctx.fillText(g.resolved?'resolved — R = '+g.R+' against '+fmt(g.pair.need,0)+' needed'
                             :'NOT resolved — R = '+g.R+', needs '+fmt(g.pair.need,0),
                   zb.x+zb.w/2,zb.y+5);
      ctx.restore();
    } else {
      ctx.save();
      caption(ctx,zb.x+8,zb.y+10,'This order falls outside ±90° for at least one of the pair — '
        +'d sin θ = mλ has no solution. Lower the order or the ruling.',zb.w-16,'#e8843a');
      ctx.restore();
    }
  }

  /* ---- the resolving-power bar ---- */
  {
    const need=g.pair?g.pair.need:1;
    const hi=Math.max(g.R,need)*1.18;
    ctx.save();
    frame(ctx,rb,'#242a3a');
    const fw=rb.w*clamp(g.R/hi,0,1);
    ctx.fillStyle=g.resolved?'#4a7f3a':'#7c3a20';
    ctx.fillRect(rb.x+1,rb.y+1,fw-2,rb.h-2);
    const X=rb.x+rb.w*clamp(need/hi,0,1);
    ctx.strokeStyle='#e8e8f0'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(X,rb.y-3); ctx.lineTo(X,rb.y1+3); ctx.stroke();
    ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#cfd4de';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('R = mN = '+g.R,rb.x+8,rb.y+rb.h/2);
    /* the threshold label goes ABOVE the bar: when R is many times what is
       needed the marker sits well inside the filled region and the two labels
       land on top of each other (mercury, order 2, caught by the audit) */
    ctx.textBaseline='bottom';
    const lab='needs '+fmt(need,0);
    const lw=ctx.measureText(lab).width;
    ctx.textAlign='center';
    ctx.fillText(lab,clamp(X,rb.x+lw/2,rb.x1-lw/2),rb.y-5);
    ctx.restore();
  }
  ctx.save();
  caption(ctx,rb.x,rb.y1+16,
    'Resolving power is m×N and nothing else: the order, times the number of grooves the '
    +'beam actually covers. Widening the beam improves it; a finer ruling at the same beam '
    +'width buys nothing directly — it buys angular dispersion, which is a different quantity '
    +'and is what makes the improvement usable. Measured input: '+g.lamp.src,
    rb.w,'#767e92');
  ctx.restore();
}

/* ================================================================== *
 *  view dispatch                                                      *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='bench')        return drawBench(ctx,W,H,M,S);
  else if(v==='screen')  return drawScreen(ctx,W,H,M);
  else if(v==='profile') return drawProfile(ctx,W,H,M);
  else if(v==='near')    return drawNear(ctx,W,H,M);
  else if(v==='airy')    return drawAiry(ctx,W,H,M);
  else if(v==='grating') return drawGrating(ctx,W,H,M);
  return drawProfile(ctx,W,H,M);
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS,{probe:0});
  const cam=makeCamera(-0.78,0.52,11.5,[AXL*0.46,0,0.95]);
  let M=null, carpet=null, t=0;
  const S={
    st,cam,
    get carpet(){ return carpet; },
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){
      M=buildModel(st);
      carpet=(st.view==='bench'&&st.showCarpet)
        ? buildCarpet(M,clamp(Math.round(st.planes),6,44),Math.min(110,Math.max(24,Math.round(st.nProf/4))))
        : null;
    },
    fit(){
      cam.target=[AXL*0.46,0,0.95];
      cam.dist=clamp(2.35*AXL/(2*Math.tan(cam.fov/2))*0.56,5,60);
    },
    resetView(){ cam.theta=-0.78; cam.phi=0.52; S.fit(); },
    lookAxial(){ cam.theta=Math.PI; cam.phi=0.03; S.fit(); },
    pointer(kind,d){
      if(kind!=='move') return;
      cam.theta-=d.dx*0.006;
      cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),2.5,220); },
    step(dt){
      if(!st.anim&&!st.spin) return;
      t+=dt*st.speed;
      if(st.spin) cam.theta+=dt*st.speed*0.16;
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{width:cam.W,height:cam.H};
      const Wd=r.width||cam.W, Hd=r.height||cam.H;
      cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}

              ['near','near field'],['airy','the Airy disc'],['grating','the grating']];

      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });

  }

    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;

        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},o.name);

    });

  }

  gSrc.appendChild(slider('lam','λ',380,760,0.1,v=>fmt(v,1)+' nm'));

  gAp.appendChild(slider('d','pitch d',5,1200,1,v=>fmt(v,0)+' µm'));
  gAp.appendChild(slider('N','slits N',2,64,1,v=>fmt(v,0)));
  gAp.appendChild(slider('D','diameter D',2,600,1,v=>fmt(v,0)+' µm'));
  gAp.appendChild(slider('hgt','slit height',100,20000,50,v=>fmt(v/1000,2)+' mm'));
  const apTag=h('div',{class:'tag'}); gAp.appendChild(apTag);

  const gGeo=h('div',{class:'grp'},h('h3',null,'the bench'));

  gGeo.appendChild(slider('zoom','screen zoom',0.25,12,0.05,v=>fmt(v,2)+'×'));
  gGeo.appendChild(slider('probe','probe',-1,1,0.005,v=>fmt(v,3)));
  const geoTag=h('div',{class:'tag'}); gGeo.appendChild(geoTag);

  const gMeth=h('div',{class:'grp'},h('h3',null,'propagator'));
  gMeth.appendChild(chipRow(PROPS,'prop'));

  gGrat.appendChild(slider('beamW','beam width',0.1,40,0.1,v=>fmt(v,1)+' mm'));
  gGrat.appendChild(slider('order','order m',1,5,1,v=>fmt(v,0)));

  gDisp.appendChild(slider('gam','γ',0.15,1.6,0.01,v=>fmt(v,2)));
  const dispTag=h('div',{class:'src'}); gDisp.appendChild(dispTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'the 3-D bench'));
  const schecks=h('div',{class:'checks'},
    checkbox('showCarpet','the carpet'),
    checkbox('showPlate','the aperture plate'),
    checkbox('showScreen','the screen'),
    checkbox('showRays','rays to the orders'),
    checkbox('showGrid','floor grid'),
    checkbox('anim','animate'),
    checkbox('spin','auto-orbit'));
  gShow.appendChild(schecks);
  gShow.appendChild(slider('planes','carpet planes',6,44,1,v=>fmt(v,0)));
  gShow.appendChild(slider('speed','speed',0.2,4,0.1,v=>fmt(v,1)+'×'));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.lookAxial(); dirty=true; refresh(); }},'look down the axis'),
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view')));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS,{probe:0}); S.rebuild(); S.resetView();
