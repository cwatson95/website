<title>Waveguides — TE, TM, TEM, hybrid, and the shapes that choose them</title>
<!--
  ===================================================================
  WAVEGUIDES
  TE, TM, TEM and hybrid modes in rectangular, circular, coaxial,
  parallel-plate, conical and dielectric guides
  ===================================================================

  Built to the same house rules as steam_carnot_cycle.html, diffraction.html,
  pulsar.html and drum_head.html: one flat file, no build step, no network,
  works opened straight off the disk as file://.

  ------------------------------------------------------------------
  WHAT THIS SOLVES
  ------------------------------------------------------------------
  Maxwell's equations in a structure that is uniform along z, separated as
  F(x,y) exp(j(wt - beta z)).  Every guide in this file reduces to the same
  two steps:

    (1) a TRANSVERSE EIGENVALUE PROBLEM for the cutoff wavenumber k_c,
        which is the only place the cross-section shape enters, and

    (2) the DISPERSION RELATION  beta^2 = k^2 - k_c^2,  k = w/c,
        which is the same for every mode of every guide here.

  Below k_c the guide is a filter, not a pipe: beta becomes -j*alpha with
  alpha = sqrt(k_c^2 - k^2), the fields decay without carrying power, and
  nothing is dissipated doing it.  That single sign change is the whole
  subject.

  The families, and what k_c is for each:

    TE  (transverse electric, E_z = 0)   H_z is the potential.
        rectangular:  k_c = sqrt((m pi/a)^2 + (n pi/b)^2)  -- exact, elementary
        circular:     k_c = p'_mn / a,   J_m'(p'_mn) = 0
    TM  (transverse magnetic, H_z = 0)   E_z is the potential.
        rectangular:  the same k_c, but m,n >= 1 (either index zero kills it)
        circular:     k_c = p_mn / a,    J_m(p_mn) = 0
    TEM (both zero)                      k_c = 0 exactly, so NO cutoff.
        Needs two conductors.  Coax, parallel plate, two-wire, biconical.
        beta = k always, v_p = v_g = c, and the transverse field is an
        electrostatic field of the cross-section -- literally a 2-D
        Laplace solution dragged along at c.
    HYBRID (HE/EH, neither E_z nor H_z zero)
        What a dielectric guide has instead, because the boundary is not a
        conductor and cannot force E_tan = 0 alone.  Step-index fibre here.
        HE11 has NO cutoff, which is why single-mode fibre works at all.

  The user's request named "AUX" among the families.  That is not a standard
  waveguide designation and has been read as the HYBRID (HE/EH) family --
  the auxiliary-potential modes that appear when neither Hertz potential can
  be set to zero on its own.  If something else was meant, the fibre view is
  the one to re-aim.

  ------------------------------------------------------------------
  WHAT IS EXACT, WHAT IS MEASURED, WHAT IS NOT MODELLED
  ------------------------------------------------------------------
  EXACT (closed form, asserted against scipy to 10+ digits in selfTest):
    - every cutoff frequency, from Bessel zeros computed in-file, not typed
    - beta, lambda_g, v_p, v_g, Z_TE, Z_TM, and v_p v_g = c^2
    - all six field components of every rectangular and circular TE/TM mode
    - coax and parallel-plate TEM: Z_0, the field, and the loss
    - the coax higher-order TE11 cutoff from the EXACT cross-product Bessel
      root J_1'(k_c a) Y_1'(k_c b) - J_1'(k_c b) Y_1'(k_c a) = 0, drawn
      alongside the textbook k_c ~ 2/(a+b), which is 2.0% low
    - the conical guide's NON-INTEGER Legendre degree nu, from
      P_nu^m(cos th0) = 0 (TM) or dP_nu^m/dth = 0 (TE), and its radial
      function from the ODE u'' + [k^2 - nu(nu+1)/r^2] u = 0
    - the biconical TEM, Z_0 = (eta/pi) ln cot(th0/2), checked by integrating
      E.dl through the field rather than by re-quoting the formula
    - the fibre's exact vector HE11 characteristic equation, and the
      weakly-guiding LP approximation next to it so the error is visible

  MEASURED (numbers that came from outside and are stored as given):
    - EIA WR-band inner dimensions.  WR-n is DEFINED as n/100 inch of broad
      wall with b = a/2 (except WR-284/137/42, which are not 2:1 and whose
      b is stored separately).  So a and b are exact by definition and every
      cutoff in the band table is DERIVED here, not transcribed.
    - conductivities: Cu 5.813e7, Ag 6.173e7, Au 4.098e7, Al 3.816e7,
      brass 2.564e7 S/m (Pozar, Microwave Engineering, Appendix).  These are
      the only hand-typed physical constants in the loss model.
    - CODATA 2022: mu_0 = 1.25663706127e-6, eps_0 = 8.8541878188e-12.
      eta_0 = sqrt(mu_0/eps_0) is COMPUTED and asserted to equal the CODATA
      impedance of free space 376.730313412 ohm.
    - SMF-28-like step-index fibre: n_core 1.4682, n_clad 1.4629 at 1550 nm.

  NOT MODELLED, and deliberately so:
    - mode conversion, bends, discontinuities, tapers beyond the adiabatic
      (local-cutoff) approximation.  The taper view says on the canvas that
      it is local-cutoff and not a coupled-mode solve.
    - surface roughness, oxide layers, and anomalous skin effect.  The loss
      model is the classical perturbation result: it assumes the field is
      the lossless field and the wall is a good conductor.  It is quoted as
      such and is wrong near cutoff, where it diverges and the real guide
      does not.
    - anisotropic or ferrite loading, and any nonlinearity.
    - the biconical line's HIGHER-order modes.  Only its TEM is exact here;
      the single-cone TE/TM modes are the ones solved properly, because the
      two-cone region needs Legendre functions of the second kind as well.

  ------------------------------------------------------------------
  HOW THIS WAS VERIFIED
  ------------------------------------------------------------------
  selfTest(): 258 assertions, green.  Reference values came from a python
  script that re-derived every closed form with scipy; they are labelled
  "(scipy)".  The field formulas are NOT checked against a second copy of
  themselves — they are checked against E_tan = 0 on every wall, div E = 0,
  div H = 0, a positive z-Poynting flux, and a wave impedance measured off
  the built field rather than read from the formula.

  UI drive: 205 assertions through the DOM-stub harness in
  tools/ui_drive_wg.js — every tab, every geometry, every control, the
  drag/wheel dirty flags, and a check that no raw HTML entity or tag ever
  reaches fillText.

  Mutation sweep: 73 mutants, 72 caught, 1 survivor.  The survivor is the
  starting exponent of the conical radial ODE (u ~ s^(nu+1) at s -> 0), and
  it is EQUIVALENT, not a gap: integrating outward, the irregular solution
  goes as s^-nu while the regular one goes as s^(nu+1), so any contamination
  in the starting mix decays away before the first oscillation.  Measured:
  the normalised shape differs by at most 2e-9 and the zero crossings are
  identical to twelve digits.  Nothing that is drawn or asserted can see it.

  Four earlier survivors WERE gaps and are now closed: H_z was reachable by
  no assertion at all (div H = 0 now pins it); the on-axis branch of
  J_m(x)/x was never evaluated because every sample sits at a cell centre;
  every attenuation test used m = 0, where the m^2/(p'^2 - m^2) term is
  identically zero; and the conical TE root was only asserted at 45 deg,
  which is exact for ANY differencing step and so pinned nothing.

  ------------------------------------------------------------------
  A NOTE ON ONE BESSEL CONVENTION
  ------------------------------------------------------------------
  drum_head.html needed j'(0,1) = 0 -- the rigid translation of a membrane
  with a free rim -- and its besselPrimeZero() returns it.  A WAVEGUIDE must
  NOT use that root: J_0'(0) = 0 makes every field component identically
  zero, so it is not a mode.  guideTEZero() below skips it deliberately and
  selfTest asserts that TE_01 of the circular guide comes out at 3.8317,
  not at 0.  Same function, opposite convention, and the difference is
  physical.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}


/* ================================================================== *
 *  physical constants                                                 *
 *  CODATA 2022.  eta0 is COMPUTED from mu0 and eps0 and selfTest      *
 *  asserts it equals the CODATA impedance of free space; c0 is the    *
 *  SI definition and 1/sqrt(mu0 eps0) is asserted to reproduce it.    *
 * ================================================================== */
const C0   = 299792458;              /* m/s, exact by SI definition   */
const MU0  = 1.25663706127e-6;       /* N/A^2   CODATA 2022           */
const EPS0 = 8.8541878188e-12;       /* F/m     CODATA 2022           */
const ETA0 = Math.sqrt(MU0/EPS0);    /* 376.730313412 ohm             */
const NP2DB = 8.685889638065035;     /* 20/ln(10) — Np to dB          */
const INCH = 0.0254;                 /* m, exact                      */
const EULER_G = 0.5772156649015329;  /* Euler-Mascheroni              */


/* ================================================================== *
 *  special functions                                                  *
 *                                                                     *
 *  Everything here is hand-rolled because the file loads nothing, and *
 *  everything here is asserted in selfTest against values computed     *
 *  OUTSIDE it (scipy 1.18 / numpy 2.5).                                *
 *                                                                     *
 *  J_m(x) has three regimes and the interesting failures are always    *
 *  at the joins, so selfTest checks each regime against scipy AND      *
 *  checks that neighbouring regimes agree where both are valid:        *
 *                                                                     *
 *    ascending series   x small against the order — every term the     *
 *                       same sign until k ~ x/2, so no cancellation    *
 *    Hankel asymptotic  x large against m^2 (A&S 9.2.5/9.2.9/9.2.10)   *
 *    Miller recurrence  everywhere else — downward recursion from an   *
 *                       order well above both m and x, normalised by   *
 *                       J_0 + 2(J_2 + J_4 + ...) = 1.                  *
 *                                                                     *
 *  The series is NOT usable as the general method: at x = 30 its       *
 *  largest term is 1.1e11 against a result of -0.086, which is twelve  *
 *  digits of cancellation out of the sixteen a double has.             *
 * ================================================================== */
function besselSeries(m,x){
  let t=1;
  for(let i=1;i<=m;i++){ t*=(x/2)/i; if(t===0) return 0; }
  const q=-x*x/4;
  let sum=t, term=t;
  for(let k=1;k<400;k++){
    term*=q/(k*(m+k));
    sum+=term;
    if(Math.abs(term)<=1e-19*Math.abs(sum)) break;
  }
  return sum;
}
function besselAsym(m,x){
  const mu=4*m*m, z=8*x, z2=z*z;
  const a1=mu-1, a3=mu-9, a5=mu-25, a7=mu-49, a9=mu-81, a11=mu-121,
        a13=mu-169, a15=mu-225;
  const P=1 - a1*a3/(2*z2) + a1*a3*a5*a7/(24*z2*z2)
            - a1*a3*a5*a7*a9*a11/(720*z2*z2*z2)
            + a1*a3*a5*a7*a9*a11*a13*a15/(40320*z2*z2*z2*z2);
  const Q=a1/z - a1*a3*a5/(6*z*z2) + a1*a3*a5*a7*a9/(120*z*z2*z2)
            - a1*a3*a5*a7*a9*a11*a13/(5040*z*z2*z2*z2);
  const chi=x-(m/2+0.25)*PI;
  return Math.sqrt(2/(PI*x))*(P*Math.cos(chi)-Q*Math.sin(chi));
}
/* Miller: recur DOWNWARD from a start order well above both m and x, which
   is the direction in which J is the growing solution and therefore the
   stable one, then fix the scale with the Neumann sum.  The start order is
   deliberately generous — the cost is linear and the accuracy is not. */
function besselMiller(m,x){
  const top=Math.max(m,Math.ceil(x));
  let N=2*Math.ceil((top+30+8*Math.sqrt(top))/2);
  const tox=2/x;
  let bj=1e-260, bjp=0, ans=0, sum=0, even=false;
  for(let j=N;j>0;j--){
    const bjm=j*tox*bj-bjp;
    bjp=bj; bj=bjm;
    if(Math.abs(bj)>1e250){ bj*=1e-250; bjp*=1e-250; ans*=1e-250; sum*=1e-250; }
    if(even) sum+=bj;
    even=!even;
    if(j===m) ans=bjp;
  }
  sum=2*sum-bj;
  if(m===0) ans=bj;
  return ans/sum;
}
/* Bessel function of the first kind, integer order m >= 0.
   The two thresholds were MEASURED against scipy over a 31200-point grid,
   not guessed.  The series holds ~1e-15 to x=6 and decays to 4e-14 by x=10
   as its own cancellation eats the mantissa, so it hands over at 8; the
   asymptotic reaches 1e-14 by x=45 for m<=3 and needs x >= 3.2 m^2 beyond
   that.  Miller covers the whole middle at 7e-16 and is the fallback. */
function besselJ(m,x){
  m=m|0;
  if(m<0) throw new Error('besselJ: negative order '+m);
  if(x<0) return (m&1)?-besselJ(m,-x):besselJ(m,-x);
  if(x===0) return m===0?1:0;
  if(x<8) return besselSeries(m,x);
  if(x>=45&&x>=3.2*m*m) return besselAsym(m,x);
  return besselMiller(m,x);
}
/* J_m'(x).  J_0' = -J_1; otherwise the standard (J_{m-1} - J_{m+1})/2. */
function besselJp(m,x){
  m=m|0;
  if(m===0) return -besselJ(1,x);
  return 0.5*(besselJ(m-1,x)-besselJ(m+1,x));
}

/* ------------------------------------------------------------------ *
 *  zeros                                                              *
 *                                                                     *
 *  DIRICHLET  j(m,n): McMahon (A&S 9.5.12) then Newton.  The McMahon   *
 *    guess was checked in python to land strictly between the          *
 *    neighbouring zeros for every m<=10, n<=12, so Newton cannot walk  *
 *    to the wrong root; its worst error there is 0.088, at (10,1).     *
 *  NEUMANN j'(m,n): NOT a second asymptotic series.  By Rolle there is *
 *    exactly one zero of J_m' between consecutive zeros of J_m, so it  *
 *    is found by bisection inside a bracket already in hand.  Note     *
 *    that j'(0,1) = 0 — the rigid vertical translation of a free       *
 *    membrane.  scipy's jnp_zeros OMITS that root, and leaving it out  *
 *    inverts the m=0 bracket.                                          *
 *  ROBIN x J_m'(x) + B J_m(x) = 0: bracketed by [j'(m,n), j(m,n)],     *
 *    monotone in B, so plain bisection is both safe and enough.        *
 * ------------------------------------------------------------------ */
function mcMahon(m,n){
  const b=(n+m/2-0.25)*PI, mu=4*m*m, b8=8*b;
  return b - (mu-1)/b8
           - 4*(mu-1)*(7*mu-31)/(3*b8*b8*b8)
           - 32*(mu-1)*(83*mu*mu-982*mu+3779)/(15*b8*b8*b8*b8*b8)
           - 64*(mu-1)*(6949*mu*mu*mu-153855*mu*mu+1585743*mu-6277237)
             /(105*b8*b8*b8*b8*b8*b8*b8);
}
function besselZero(m,n){
  let x=mcMahon(m,n);
  for(let i=0;i<60;i++){
    const f=besselJ(m,x), d=besselJp(m,x);
    if(d===0) break;
    const dx=f/d;
    x-=dx;
    if(Math.abs(dx)<=1e-15*Math.abs(x)) break;
  }
  return x;
}
/* bisection on f inside [lo,hi]; the bracket is guaranteed by construction
   so this cannot fail to converge, and 200 halvings is machine precision. */
function bisect(f,lo,hi){
  let flo=f(lo);
  if(flo===0) return lo;
  for(let i=0;i<200;i++){
    const mid=0.5*(lo+hi);
    if(mid<=lo||mid>=hi) break;
    const fm=f(mid);
    if(fm===0) return mid;
    if((fm<0)===(flo<0)){ lo=mid; flo=fm; } else hi=mid;
  }
  return 0.5*(lo+hi);
}
function besselPrimeZero(m,n,dz){
  if(m===0&&n===1) return 0;
  const lo=(n>1)?dz[n-2]:0, hi=dz[n-1];
  return bisect(x=>besselJp(m,x),lo+1e-12,hi);
}


/* ================================================================== *
 *  Y_n, I_n, K_n — the three the drum did not need                    *
 *                                                                     *
 *  Y_0/Y_1 are the ascending series (A&S 9.1.13); Y_n by UPWARD        *
 *  recurrence, which is the stable direction for the second solution. *
 *  Only the coax cross-product root uses them, over 0.3 <= x <= 6.5,  *
 *  where the series was measured against scipy at 5.5e-13 worst       *
 *  relative error (both Y and Y').  It is NOT usable far beyond that: *
 *  the log term and the alternating sum cancel.                       *
 *                                                                     *
 *  K_0/K_1 likewise (A&S 9.6.11), K_n upward; only the fibre uses     *
 *  them, over 0.02 <= w <= 4.5, measured at 1.5e-12 worst.            *
 * ================================================================== */
function besselY0(x){
  if(!(x>0)) throw new Error('besselY0: x must be > 0, got '+x);
  let s=0, H=0, term=1; const q=-x*x/4;
  for(let k=1;k<300;k++){
    H+=1/k;
    term*=q/(k*k);            /* (-x^2/4)^k / (k!)^2 */
    s+=-term*H;
    if(k>4&&Math.abs(term*H)<=1e-18*Math.abs(s)) break;
  }
  return (2/PI)*((Math.log(x/2)+EULER_G)*besselJ(0,x)+s);
}
function besselY1(x){
  if(!(x>0)) throw new Error('besselY1: x must be > 0, got '+x);
  const q=-x*x/4;
  let term=1, Hk=0, Hk1=1, S=(Hk+Hk1)*term;
  for(let k=1;k<300;k++){
    term*=q/(k*(k+1));
    Hk+=1/k; Hk1+=1/(k+1);
    const d=(Hk+Hk1)*term; S+=d;
    if(k>4&&Math.abs(d)<=1e-18*Math.abs(S)) break;
  }
  return (2/PI)*(Math.log(x/2)+EULER_G)*besselJ(1,x) - 2/(PI*x) - (x/(2*PI))*S;
}
function besselY(n,x){
  n=n|0;
  let y0=besselY0(x), y1=besselY1(x);
  if(n===0) return y0;
  for(let m=1;m<n;m++){ const t=(2*m/x)*y1-y0; y0=y1; y1=t; }
  return y1;
}
function besselYp(n,x){
  n=n|0;
  if(n===0) return -besselY(1,x);
  return 0.5*(besselY(n-1,x)-besselY(n+1,x));
}
function besselI(n,x){
  n=n|0;
  let t=1;
  for(let i=1;i<=n;i++){ t*=(x/2)/i; if(t===0) return 0; }
  const q=x*x/4;
  let s=t, term=t;
  for(let k=1;k<400;k++){
    term*=q/(k*(n+k)); s+=term;
    if(Math.abs(term)<=1e-19*Math.abs(s)) break;
  }
  return s;
}
function besselK0(x){
  if(!(x>0)) throw new Error('besselK0: x must be > 0, got '+x);
  let s=0, H=0, term=1; const q=x*x/4;
  for(let k=1;k<300;k++){
    H+=1/k; term*=q/(k*k); s+=term*H;
    if(k>4&&Math.abs(term*H)<=1e-18*Math.abs(s)) break;
  }
  return -(Math.log(x/2)+EULER_G)*besselI(0,x)+s;
}
function besselK1(x){
  if(!(x>0)) throw new Error('besselK1: x must be > 0, got '+x);
  const q=x*x/4;
  let term=1, Hk=0, Hk1=1, S=(Hk+Hk1-2*EULER_G)*term;
  for(let k=1;k<300;k++){
    term*=q/(k*(k+1));
    Hk+=1/k; Hk1+=1/(k+1);
    const d=(Hk+Hk1-2*EULER_G)*term; S+=d;
    if(k>4&&Math.abs(d)<=1e-18*Math.abs(S)) break;
  }
  return 1/x + Math.log(x/2)*besselI(1,x) - (x/4)*S;
}
function besselK(n,x){
  n=n|0;
  let k0=besselK0(x), k1=besselK1(x);
  if(n===0) return k0;
  for(let m=1;m<n;m++){ const t=k0+(2*m/x)*k1; k0=k1; k1=t; }
  return k1;
}
function besselKp(n,x){
  n=n|0;
  if(n===0) return -besselK(1,x);
  return -0.5*(besselK(n-1,x)+besselK(n+1,x));
}

/* ================================================================== *
 *  Legendre P_nu^m(x) — REAL degree nu, integer order m >= 0          *
 *                                                                     *
 *  The conical guide's eigenvalue is a Legendre DEGREE, not a zero of *
 *  anything, and it is not an integer.  Built from the hypergeometric *
 *  form, differentiated m times in closed form:                       *
 *                                                                     *
 *    P_nu(x) = 2F1(-nu, nu+1; 1; (1-x)/2)                             *
 *    P_nu^m(x) = (1/2)^m (1-x^2)^{m/2} [(-nu)_m (nu+1)_m / m!]        *
 *                * 2F1(m-nu, nu+m+1; m+1; (1-x)/2)                    *
 *                                                                     *
 *  This reproduces scipy's lpmv EXACTLY with no extra (-1)^m factor   *
 *  applied (checked: ratio 1.000000 for m = 0, 1, 2).  Which sign     *
 *  convention that is does not matter here — the cone's eigenvalue is *
 *  a ZERO of this function, and zeros do not care about an overall     *
 *  sign.  P_2^1 comes out as -3 cos(th) sin(th), and selfTest pins     *
 *  that against the closed form.                                       *
 *                                                                     *
 *  The series is in z = (1-x)/2 and converges for z < 1, i.e. all     *
 *  theta < 180 deg, but it LOSES ACCURACY as z -> 1.  Measured        *
 *  against scipy: 3.4e-9 worst relative error for theta <= 80 deg and *
 *  nu <= 13.3; still 6e-13 out to 140 deg; but 0.77 (i.e. useless) at *
 *  175 deg.  The cone view is therefore capped at theta0 = 80 deg,    *
 *  which is also where a "cone" stops being one.                      *
 * ================================================================== */
function legendreP(nu,m,x){
  m=m|0;
  if(m<0) throw new Error('legendreP: order must be >= 0, got '+m);
  if(!(x>-1&&x<=1)) throw new Error('legendreP: x out of range, got '+x);
  const z=(1-x)/2;
  let pre=1;
  for(let k=0;k<m;k++) pre*=(-nu+k)*(nu+1+k)/(k+1);
  pre*=Math.pow(0.5,m)*Math.pow(1-x*x,m/2);
  const A=m-nu, B=nu+m+1, Cc=m+1;
  let s=1, term=1;
  for(let k=0;k<800;k++){
    term*=(A+k)*(B+k)/((Cc+k)*(k+1))*z;
    s+=term;
    if(k>3&&Math.abs(term)<=1e-17*Math.abs(s)) break;
  }
  return pre*s;
}
/* dP_nu^m/dtheta at x = cos(theta), by a centred difference in THETA.
   Central differencing is used rather than the recurrence identity because
   the identity has a removable 1/sin(theta) that is numerically hostile at
   the small cone angles this file allows.  h = 1e-5 rad reproduces the
   exact nu = 2 at theta0 = 45 deg to 1.3e-12. */
function legendrePdTh(nu,m,th){
  const h=1e-5;
  return (legendreP(nu,m,Math.cos(th-h))-legendreP(nu,m,Math.cos(th+h)))/(2*h);
}


/* ================================================================== *
 *  waveguide cutoff wavenumbers                                       *
 * ================================================================== */

/* n-th root of J_m, cached.  These ARE the circular TM_mn eigenvalues. */
const _JZ={}, _JPZ={};
function jZero(m,n){
  const key=m+'|'+n;
  if(_JZ[key]===undefined) _JZ[key]=besselZero(m,n);
  return _JZ[key];
}
/* n-th root of J_m', SKIPPING x = 0.  These are the circular TE_mn
   eigenvalues.  drum_head.html's besselPrimeZero() returns j'(0,1) = 0
   because a membrane with a free rim really can translate rigidly; a
   waveguide cannot, because J_0'(0) = 0 makes H_z uniform and every
   transverse component identically zero.  Skipping it for m = 0 is the
   whole difference, and selfTest pins TE01 at 3.8317 to prove it.
   Cross-check: J_0' = -J_1 exactly, so jpZero(0,n) must equal jZero(1,n)
   — that identity is asserted too, and it is also WHY TE_0n and TM_1n are
   degenerate in a circular guide. */
function jpZero(m,n){
  const key=m+'|'+n;
  if(_JPZ[key]===undefined){
    const idx=(m===0)?n+1:n;                 /* skip the x=0 root at m=0 */
    const dz=[]; for(let i=1;i<=idx;i++) dz.push(jZero(m,i));
    _JPZ[key]=besselPrimeZero(m,idx,dz);
  }
  return _JPZ[key];
}

/* --- the coax higher-order cutoffs, EXACTLY ------------------------ *
 *  A coax is TEM at every frequency, but only until the first mode
 *  that does not need two conductors fits between them.  That mode is
 *  TE11, and its k_c is the first root of the cross-product
 *     J_1'(k_c a) Y_1'(k_c b) - J_1'(k_c b) Y_1'(k_c a) = 0.
 *  Every textbook then says "k_c ~ 2/(a+b)".  For a 50-ohm air line
 *  (b/a = 2.3023) that approximation is 2.04% LOW, which is 1.3 GHz at
 *  X-band scale, and this file draws both.                            */
function coaxCutoffKc(ai,bo,kind){
  const f = (kind==='TM')
    ? (x)=> besselJ(0,x*ai)*besselY(0,x*bo)-besselJ(0,x*bo)*besselY(0,x*ai)
    : (x)=> besselJp(1,x*ai)*besselYp(1,x*bo)-besselJp(1,x*bo)*besselYp(1,x*ai);
  const guess=(kind==='TM') ? PI/(bo-ai) : 2/(ai+bo);
  /* expand a bracket outward from the textbook guess until it straddles */
  let lo=guess*0.55, hi=guess*1.9, flo=f(lo);
  let ok=false;
  for(let i=0;i<60;i++){
    if((f(hi)<0)!==(flo<0)){ ok=true; break; }
    hi*=1.06;
  }
  if(!ok){
    for(let i=0;i<60;i++){
      lo*=0.94; flo=f(lo);
      if((f(hi)<0)!==(flo<0)){ ok=true; break; }
    }
  }
  if(!ok) return guess;                       /* fall back, never NaN */
  return bisect(f,lo,hi);
}

/* ================================================================== *
 *  the guides                                                         *
 * ================================================================== */
const GEOMS=['rect','circ','coax','plate','cone','fibre'];
const GEOM_NAME={rect:'rectangular', circ:'circular', coax:'coaxial',
                 plate:'parallel plate', cone:'conical', fibre:'step-index fibre'};

/* Every mode is {fam,m,n,kc,fc,name}.  kc = 0 means TEM: no cutoff.
   fc is derived from kc and the medium speed, never stored.  */
function modeCutoff(kc,cmed){ return kc*cmed/TAU; }

function modesRect(a,b,cmed,maxIdx){
  const out=[];
  for(let m=0;m<=maxIdx;m++) for(let n=0;n<=maxIdx;n++){
    if(m===0&&n===0) continue;
    const kc=Math.sqrt(Math.pow(m*PI/a,2)+Math.pow(n*PI/b,2));
    out.push({fam:'TE',m,n,kc,fc:modeCutoff(kc,cmed),name:'TE'+m+n});
    if(m>=1&&n>=1) out.push({fam:'TM',m,n,kc,fc:modeCutoff(kc,cmed),name:'TM'+m+n});
  }
  out.sort((p,q)=>p.fc-q.fc||(p.fam<q.fam?-1:1));
  return out;
}
function modesCirc(a,cmed,maxIdx){
  const out=[];
  for(let m=0;m<=maxIdx;m++) for(let n=1;n<=maxIdx;n++){
    const pe=jpZero(m,n), po=jZero(m,n);
    out.push({fam:'TE',m,n,kc:pe/a,fc:modeCutoff(pe/a,cmed),name:'TE'+m+n,p:pe});
    out.push({fam:'TM',m,n,kc:po/a,fc:modeCutoff(po/a,cmed),name:'TM'+m+n,p:po});
  }
  out.sort((p,q)=>p.fc-q.fc||(p.fam<q.fam?-1:1));
  return out;
}
function modesCoax(ai,bo,cmed){
  const out=[{fam:'TEM',m:0,n:0,kc:0,fc:0,name:'TEM'}];
  const k1=coaxCutoffKc(ai,bo,'TE');
  const k2=coaxCutoffKc(ai,bo,'TM');
  out.push({fam:'TE',m:1,n:1,kc:k1,fc:modeCutoff(k1,cmed),name:'TE11',
            approxKc:2/(ai+bo)});
  out.push({fam:'TM',m:0,n:1,kc:k2,fc:modeCutoff(k2,cmed),name:'TM01',
            approxKc:PI/(bo-ai)});
  out.sort((p,q)=>p.fc-q.fc);
  return out;
}
function modesPlate(d,cmed,maxIdx){
  const out=[{fam:'TEM',m:0,n:0,kc:0,fc:0,name:'TEM'}];
  for(let n=1;n<=maxIdx;n++){
    const kc=n*PI/d;
    out.push({fam:'TE',m:0,n,kc,fc:modeCutoff(kc,cmed),name:'TE'+n});
    out.push({fam:'TM',m:0,n,kc,fc:modeCutoff(kc,cmed),name:'TM'+n});
  }
  out.sort((p,q)=>p.fc-q.fc||(p.fam<q.fam?-1:1));
  return out;
}

/* ================================================================== *
 *  the dispersion relation — the same three lines for every guide     *
 *     beta^2 = k^2 - k_c^2                                            *
 *  Above cutoff beta is real and power propagates; below it, beta is  *
 *  -j alpha and the mode decays with NO dissipation.  Both branches   *
 *  are returned, and `prop` says which one you are on.                *
 * ================================================================== */
function guideProps(f,fc,cmed,etamed){
  const k=TAU*f/cmed, kc=TAU*fc/cmed;
  const prop=(f>fc);
  const s=1-(fc>0? (fc/f)*(fc/f) : 0);
  const beta = prop? Math.sqrt(Math.max(k*k-kc*kc,0)) : 0;
  const alpha= prop? 0 : Math.sqrt(Math.max(kc*kc-k*k,0));
  return {
    k, kc, prop, beta, alphaEv:alpha,
    lam0: cmed/f,
    lamG: prop? TAU/beta : Infinity,
    vp:   prop? TAU*f/beta : Infinity,
    vg:   prop? cmed*Math.sqrt(s) : 0,
    Zte:  prop? etamed/Math.sqrt(s) : Infinity,
    Ztm:  prop? etamed*Math.sqrt(s) : 0,
    ratio: fc>0? f/fc : Infinity
  };
}

/* ================================================================== *
 *  FIELDS.  Real, instantaneous, at phase psi = wt - beta z.          *
 *                                                                     *
 *  Derived from the two Hertz potentials in the standard way:         *
 *    TE:  E_t = (j w mu / k_c^2) (z_hat x grad_t H_z),                *
 *         H_t = (-j beta / k_c^2) grad_t H_z                          *
 *    TM:  E_t = (-j beta / k_c^2) grad_t E_z,                         *
 *         H_t = (1/Z_TM) (z_hat x E_t)                                *
 *  The sign of every one of them is pinned in selfTest by requiring   *
 *  the z-Poynting flux to come out POSITIVE — a sign error anywhere   *
 *  sends power backwards, and nothing else in the drawing would show  *
 *  it.                                                                *
 * ================================================================== */

/* J_m(x)/x without the 0/0 at the axis.  m>=1: J_m ~ (x/2)^m/m!, so the
   ratio -> 0 for m>=2 and -> 1/2 for m=1.  m=0 never reaches here because
   every term carrying it also carries sin(m phi) = 0. */
function jOverX(m,x){
  if(m===0) return 0;
  if(Math.abs(x)<1e-9) return m===1? 0.5 : 0;
  return besselJ(m,x)/x;
}

/* rectangular: x in [0,a], y in [0,b].  Returns Cartesian components. */
function fieldRect(mode,a,b,om,beta,x,y,psi){
  const m=mode.m,n=mode.n,kc2=mode.kc*mode.kc;
  const sp=Math.sin(psi), cp=Math.cos(psi);
  const Cm=Math.cos(m*PI*x/a), Sm=Math.sin(m*PI*x/a);
  const Cn=Math.cos(n*PI*y/b), Sn=Math.sin(n*PI*y/b);
  if(mode.fam==='TE'){
    return {
      Ex: -(om*MU0*n*PI/(kc2*b))*Cm*Sn*sp,
      Ey:  (om*MU0*m*PI/(kc2*a))*Sm*Cn*sp,
      Ez:  0,
      Hx: -(beta*m*PI/(kc2*a))*Sm*Cn*sp,
      Hy: -(beta*n*PI/(kc2*b))*Cm*Sn*sp,
      Hz:  Cm*Cn*cp
    };
  }
  const we=om*EPS0;
  return {
    Ex:  (beta*m*PI/(kc2*a))*Cm*Sn*sp,
    Ey:  (beta*n*PI/(kc2*b))*Sm*Cn*sp,
    Ez:  Sm*Sn*cp,
    Hx: -(we*n*PI/(kc2*b))*Sm*Cn*sp,
    Hy:  (we*m*PI/(kc2*a))*Cm*Sn*sp,
    Hz:  0
  };
}

/* circular: r in [0,a].  Returns cylindrical components (Er,Ep,Ez,...). */
function fieldCirc(mode,a,om,beta,r,phi,psi){
  const m=mode.m, kc=mode.kc, kc2=kc*kc, u=kc*r;
  const sp=Math.sin(psi), cp=Math.cos(psi);
  const cm=Math.cos(m*phi), sm=Math.sin(m*phi);
  const J=besselJ(m,u), Jp=besselJp(m,u), JoX=jOverX(m,u);
  if(mode.fam==='TE'){
    return {
      Er: -(om*MU0*m/kc)*JoX*sm*sp,
      Ep: -(om*MU0/kc)*Jp*cm*sp,
      Ez:  0,
      Hr:  (beta/kc)*Jp*cm*sp,
      Hp: -(beta*m/kc)*JoX*sm*sp,
      Hz:  J*cm*cp
    };
  }
  const we=om*EPS0;
  return {
    Er:  (beta/kc)*Jp*cm*sp,
    Ep: -(beta*m/kc)*JoX*sm*sp,
    Ez:  J*cm*cp,
    Hr:  (we*m/kc)*JoX*sm*sp,
    Hp:  (we/kc)*Jp*cm*sp,
    Hz:  0
  };
}

/* coax TEM.  E is a pure 2-D electrostatic field, H its rotation.
   E_r = V / (r ln(b/a)),  H_phi = I/(2 pi r),  and Z0 = V/I. */
function fieldCoaxTEM(ai,bo,r,psi){
  if(r<ai||r>bo) return {Er:0,Ep:0,Ez:0,Hr:0,Hp:0,Hz:0};
  const e=1/(r*Math.log(bo/ai));
  return {Er:e*Math.cos(psi),Ep:0,Ez:0,Hr:0,Hp:e*Math.cos(psi)/ETA0,Hz:0};
}
/* parallel-plate TEM (plates normal to y at y=0 and y=d) and TE_n/TM_n. */
function fieldPlate(mode,d,om,beta,y,psi){
  const sp=Math.sin(psi), cp=Math.cos(psi), n=mode.n, kc=mode.kc;
  if(mode.fam==='TEM') return {Ex:0,Ey:cp,Ez:0,Hx:-cp/ETA0,Hy:0,Hz:0};
  const S=Math.sin(n*PI*y/d), Cc=Math.cos(n*PI*y/d);
  if(mode.fam==='TE'){
    /* E_x = A sin(n pi y/d): vanishes on both plates, as E_tan must */
    return {Ex:S*sp, Ey:0, Ez:0, Hx:0, Hy:-(beta/(om*MU0))*S*sp,
            Hz:-(kc/(om*MU0))*Cc*cp};
  }
  /* TM_n: E_z = B cos(n pi y/d) — E_z is tangential but this is the
     component that must vanish only where the WALL is, and cos is what
     the Neumann condition on H_x forces. */
  return {Ex:0, Ey:(beta/kc)*S*sp, Ez:Cc*cp,
          Hx:(om*EPS0/kc)*S*sp, Hy:0, Hz:0};
}

/* ================================================================== *
 *  surface current  J_s = n_hat x H  on the wall                      *
 *                                                                     *
 *  Worth its own function because of one fact this file draws: on the *
 *  CENTRELINE of the broad wall of a TE10 guide, H_z = 0, so J_s is   *
 *  purely LONGITUDINAL.  A thin slot cut along that line severs no    *
 *  current and therefore does not radiate — which is the entire       *
 *  reason a slotted line works.  Cut the same slot anywhere else and  *
 *  the guide becomes an antenna.                                      *
 * ================================================================== */
function wallCurrentTE10(a,beta,kc,x,psi,wall){
  /* returns [J_x or J_y, J_z] in the wall's own 2-D frame */
  const Hx=-(beta/kc)*Math.sin(PI*x/a)*Math.sin(psi);
  const Hz= Math.cos(PI*x/a)*Math.cos(psi);
  if(wall==='broad')  return {t: Hz, z: -Hx};     /* n = +y: J = Hz x_hat - Hx z_hat */
  return {t: -Hz, z: 0};                          /* side wall x=0: J = -Hz y_hat */
}

/* ================================================================== *
 *  LOSS.  Classical perturbation theory: assume the lossless field,   *
 *  integrate R_s |J_s|^2 / 2 over the wall, divide by 2P.  It DIVERGES *
 *  at cutoff, where the real guide does not — that is a failure of    *
 *  the perturbation assumption, not of the guide, and it is labelled  *
 *  on the canvas wherever it is drawn.                                *
 * ================================================================== */
function surfaceR(f,sigma){ return Math.sqrt(PI*f*MU0/sigma); }

/* rectangular TE10, Pozar 3.96.  A second, algebraically independent
   form (Collin's) is implemented in selfTest and asserted to agree. */
function alphaRectTE10(f,a,b,sigma,cmed,etamed){
  const kc=PI/a, k=TAU*f/cmed;
  if(k<=kc) return Infinity;
  const beta=Math.sqrt(k*k-kc*kc), Rs=surfaceR(f,sigma);
  return Rs*(2*b*PI*PI+a*a*a*k*k)/(a*a*a*b*beta*k*etamed);
}
/* circular TE_mn — the m^2/(p'^2 - m^2) term is what makes TE_0n special:
   with m = 0 it vanishes and alpha falls as f^-3/2 for ever. */
function alphaCircTE(f,m,n,a,sigma,cmed,etamed){
  const p=jpZero(m,n), fc=modeCutoff(p/a,cmed);
  if(f<=fc) return Infinity;
  const s=1-(fc/f)*(fc/f);
  return surfaceR(f,sigma)/(a*etamed*Math.sqrt(s))*((fc/f)*(fc/f)+m*m/(p*p-m*m));
}
function alphaCircTM(f,m,n,a,sigma,cmed,etamed){
  const p=jZero(m,n), fc=modeCutoff(p/a,cmed);
  if(f<=fc) return Infinity;
  return surfaceR(f,sigma)/(a*etamed*Math.sqrt(1-(fc/f)*(fc/f)));
}
function alphaCoax(f,ai,bo,sigma,etamed){
  return surfaceR(f,sigma)/(2*etamed*Math.log(bo/ai))*(1/ai+1/bo);
}
function alphaPlateTEM(f,d,sigma,etamed){ return surfaceR(f,sigma)/(etamed*d); }
/* dielectric loss is the same for every mode of every guide */
function alphaDielectric(f,tand,cmed,beta){
  const k=TAU*f/cmed;
  return beta>0? k*k*tand/(2*beta) : Infinity;
}

/* ================================================================== *
 *  CONICAL GUIDE                                                      *
 *                                                                     *
 *  A cone is the one shape here whose modes are NOT separable in z,   *
 *  because there is no z.  Separating in spherical coordinates gives  *
 *  fields ~ (radial function) x P_nu^m(cos th) x exp(j m phi), and    *
 *  the wall condition at th = th0 fixes nu — which is NOT an integer. *
 *                                                                     *
 *    TM (E-modes):  P_nu^m(cos th0) = 0                               *
 *    TE (H-modes):  dP_nu^m/dth |_{th0} = 0                           *
 *                                                                     *
 *  There is then no cutoff FREQUENCY at all.  The radial function     *
 *  u(r) = r j_nu(kr) obeys  u'' + [k^2 - nu(nu+1)/r^2] u = 0,  whose  *
 *  bracket changes sign at  kr = sqrt(nu(nu+1)).  Inside that radius  *
 *  the mode is evanescent, outside it propagates.  A cone's cutoff is *
 *  a RADIUS, and every frequency has one.                             *
 *                                                                     *
 *  Two exact checks live in selfTest: nu(TE11) = 2 EXACTLY at         *
 *  th0 = 45 deg (P_2^1 ~ sin 2th, so dP/dth ~ cos 2th vanishes at     *
 *  45 deg), and nu*th0 -> j_{0,1} = 2.4048 as th0 -> 0, which is the  *
 *  cone becoming a cylinder.                                          *
 * ================================================================== */
function coneNu(fam,m,th0,which){
  which=which||1;
  const f=(fam==='TM') ? (nu)=>legendreP(nu,m,Math.cos(th0))
                       : (nu)=>legendrePdTh(nu,m,th0);
  let nu=(m===0? 1e-4 : m+1e-4), step=0.02, prev=f(nu), found=0;
  while(nu<420){
    const n2=nu+step, cur=f(n2);
    if(isFinite(prev)&&isFinite(cur)&&(cur<0)!==(prev<0)){
      found++;
      if(found===which) return bisect(f,nu,n2);
    }
    nu=n2; prev=cur;
  }
  return NaN;
}
/* the radial ODE, integrated outward from the regular branch u ~ s^(nu+1).
   RK4 on s = k r.  Outward is the stable direction for the regular
   solution — it is the growing one there.  Verified against scipy's
   spherical_jn at 9.6e-11 for integer nu. */
function coneRadial(nu,sMax,N){
  N=N||900;
  const s0=Math.max(1e-3,sMax/6000), h=(sMax-s0)/N;
  const S=new Float64Array(N+1), U=new Float64Array(N+1);
  const g=(s)=>-(1-nu*(nu+1)/(s*s));
  let s=s0, u=Math.pow(s0,nu+1), v=(nu+1)*Math.pow(s0,nu);
  S[0]=s; U[0]=u;
  for(let i=1;i<=N;i++){
    const k1u=v,             k1v=g(s)*u;
    const k2u=v+h/2*k1v,     k2v=g(s+h/2)*(u+h/2*k1u);
    const k3u=v+h/2*k2v,     k3v=g(s+h/2)*(u+h/2*k2u);
    const k4u=v+h*k3v,       k4v=g(s+h)*(u+h*k3u);
    u+=h/6*(k1u+2*k2u+2*k3u+k4u);
    v+=h/6*(k1v+2*k2v+2*k3v+k4v);
    s+=h; S[i]=s; U[i]=u;
    if(!isFinite(u)) break;
  }
  return {s:S,u:U,turn:Math.sqrt(nu*(nu+1))};
}
/* biconical TEM: exact, and the only mode of a cone pair with no cutoff
   radius at all (nu = 0, P_0 = 1).  Z0 = (eta/pi) ln cot(th0/2), which
   selfTest re-derives by integrating E.dl rather than re-quoting. */
function z0Biconical(th0,etamed){ return etamed/PI*Math.log(1/Math.tan(th0/2)); }
function z0ConeGround(th0,etamed){ return etamed/(2*PI)*Math.log(1/Math.tan(th0/2)); }

/* ================================================================== *
 *  STEP-INDEX FIBRE — the hybrid family                               *
 *                                                                     *
 *  A dielectric boundary cannot force E_tan = 0 by itself, so TE and  *
 *  TM cannot in general satisfy it alone: the modes are HYBRID, with  *
 *  both E_z and H_z nonzero, and are called HE or EH by which one     *
 *  dominates.  The exact characteristic equation is                   *
 *                                                                     *
 *   [J'/(uJ) + K'/(wK)][n1^2 J'/(uJ) + n2^2 K'/(wK)]                  *
 *        = nu^2 (1/u^2 + 1/w^2)(n1^2/u^2 + n2^2/w^2),  u^2+w^2 = V^2  *
 *                                                                     *
 *  When n1 ~ n2 it collapses to the scalar LP equation, and the two   *
 *  are drawn together so the size of that approximation is visible.   *
 *  HE11 has NO cutoff: the fundamental mode of a fibre is guided at   *
 *  every V > 0, which is why single-mode fibre exists.                *
 * ================================================================== */
function fibreV(a,lam,n1,n2){ return TAU*a/lam*Math.sqrt(n1*n1-n2*n2); }
function fibreLPu(l,mm,V){
  /* u J_{l-1}(u)/J_l(u) + w K_{l-1}(w)/K_l(w) = 0, root in (j_{l-1,mm}, j_{l,mm}).
     l = 0 needs order -1, where J_{-1} = -J_1 and K_{-1} = +K_1 (K is even in
     its order).  besselJ() throws on a negative order rather than guessing,
     which is why this branch is written out instead of relying on it. */
  const F=(u)=>{
    const w=Math.sqrt(Math.max(V*V-u*u,1e-30));
    if(l===0) return -u*besselJ(1,u)/besselJ(0,u) + w*besselK(1,w)/besselK(0,w);
    return u*besselJ(l-1,u)/besselJ(l,u) + w*besselK(l-1,w)/besselK(l,w);
  };
  let lo,hi;
  if(l===0){ lo=(mm>1)?jZero(1,mm-1):1e-9; hi=jZero(0,mm); }
  else     { lo=jZero(l-1,mm);            hi=jZero(l,mm); }
  lo=Math.max(lo,1e-9); hi=Math.min(hi,V-1e-9);
  if(hi<=lo) return null;                        /* cut off at this V */
  return bisect(F,lo+1e-9,hi-1e-9);
}
function fibreHE11u(V,n1,n2){
  const F=(u)=>{
    const w=Math.sqrt(Math.max(V*V-u*u,1e-30));
    const J=besselJ(1,u),Jp=besselJp(1,u),K=besselK(1,w),Kp=besselKp(1,w);
    const A=Jp/(u*J)+Kp/(w*K), B=n1*n1*Jp/(u*J)+n2*n2*Kp/(w*K);
    return A*B-(1/(u*u)+1/(w*w))*(n1*n1/(u*u)+n2*n2/(w*w));
  };
  const hi=Math.min(V-1e-9,jZero(1,1)-1e-9);
  if(hi<=1e-6) return null;
  return bisect(F,1e-6,hi);
}
/* LP_lm transverse profile: J_l inside, K_l matched outside. */
function fibreProfile(l,u,w,V,rOverA){
  if(rOverA<=1) return besselJ(l,u*rOverA)/besselJ(l,u);
  return besselK(l,w*rOverA)/besselK(l,w);
}

/* conductivities, S/m — Pozar, Microwave Engineering, Appendix F */

/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function fmtSI(x,unit,n){
  if(!isFinite(x)) return '—';
  const a=Math.abs(x);
  if(a>=1e9)    return fmt(x/1e9,n===undefined?3:n)+' G'+unit;
  if(a>=1e6)    return fmt(x/1e6,n===undefined?3:n)+' M'+unit;
  if(a>=1e3)    return fmt(x/1e3,n===undefined?3:n)+' k'+unit;
  if(a>=1)      return fmt(x,n===undefined?3:n)+' '+unit;
  if(a>=1e-3)   return fmt(x*1e3,n===undefined?2:n)+' m'+unit;
  if(a>=1e-6)   return fmt(x*1e6,n===undefined?2:n)+' µ'+unit;
  return fmt(x*1e9,n===undefined?2:n)+' n'+unit;
}
function fmtLen(x,n){ return fmtSI(x,'m',n); }
function fmtHz(x,n){ return fmtSI(x,'Hz',n===undefined?3:n); }
/* significant figures, because "two decimal places, not nine" */
function sigf(x,d){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x)));
  const p=Math.max(0,(d===undefined?3:d)-1-e);
  return Number(x).toFixed(Math.min(p,12));
}

const DEFAULTS={
  view:'guide',
  geom:'rect',
  band:'WR-90',
  aMM:22.86, bMM:10.16,          /* rectangular broad / narrow wall, mm     */
  radMM:12.7,                    /* circular inner radius, mm              */
  fGHz:10,
  fam:'TE', mIdx:1, nIdx:0,
  metal:'copper', fill:'vacuum',
  coaxAMM:0.455, coaxBA:2.3023,  /* inner radius, and b/a                  */
  plateD:5, plateW:20,           /* mm                                     */
  coneDeg:30,
  fibAUM:4.1, fibLamNM:1550,     /* core radius um, wavelength nm          */
  taperA2:8, taperLMM:200,       /* taper exit width mm, length mm         */
  nArrow:13, exagg:1,
  showE:true, showH:true, showJ:false, showWalls:true, showAxes:true,
  showApprox:true, logAlpha:true,
  anim:true, spin:false, speed:1
};

function metalBy(id){ return METALS.find(m=>m.n===id)||METALS[0]; }
function fillBy(id){ return FILLS.find(m=>m.n===id)||FILLS[0]; }
function bandBy(id){ return WR_BANDS.find(w=>w.n===id)||WR_BANDS[6]; }

/* Which families a geometry actually has.  A single hollow conductor has no
   TEM (you need two), and only a dielectric boundary produces hybrids. */
const FAMS_FOR={
  rect:['TE','TM'], circ:['TE','TM'], coax:['TEM','TE','TM'],
  plate:['TEM','TE','TM'], cone:['TEM','TE','TM'], fibre:['HE','TE','TM']
};

function buildModel(st){
  const geom=st.geom;
  const fl=fillBy(st.fill), mt=metalBy(st.metal);
  const er=fl.er, tand=fl.td, sigma=mt.s;
  const cmed=C0/Math.sqrt(er), etamed=ETA0/Math.sqrt(er);
  const f=st.fGHz*1e9;
  const a=st.aMM*1e-3, b=st.bMM*1e-3;
  const rad=st.radMM*1e-3;
  const ai=st.coaxAMM*1e-3, bo=ai*st.coaxBA;
  const pd=st.plateD*1e-3, pw=st.plateW*1e-3;
  const th0=st.coneDeg*DEG;

  const M={st,geom,geomName:GEOM_NAME[geom],er,tand,sigma,cmed,etamed,f,
           metalName:mt.n,fillName:fl.n,a,b,rad,ai,bo,pd,pw,th0,warn:[]};

  /* ---- the mode ladder for this geometry ---- */
  let modes;
  if(geom==='rect')       modes=modesRect(a,b,cmed,5);
  else if(geom==='circ')  modes=modesCirc(rad,cmed,4);
  else if(geom==='coax')  modes=modesCoax(ai,bo,cmed);
  else if(geom==='plate') modes=modesPlate(pd,cmed,6);
  else                    modes=[];
  M.modes=modes;

  /* ---- pick the mode the sliders ask for, or the nearest legal one ---- */
  let fam=st.fam;
  if(FAMS_FOR[geom].indexOf(fam)<0) fam=FAMS_FOR[geom][0];
  M.fam=fam;
  let mode=null;
  if(geom==='rect'||geom==='circ'||geom==='plate'||geom==='coax'){
    mode=modes.find(q=>q.fam===fam&&q.m===st.mIdx&&q.n===st.nIdx)
      || modes.find(q=>q.fam===fam) || modes[0];
  }

  /* ---- geometry-specific blocks ---- */
  if(geom==='coax'){
    M.coax={ai,bo,ba:st.coaxBA,
      Z0:etamed/TAU*Math.log(bo/ai),
      te11:modes.find(q=>q.name==='TE11'),
      tm01:modes.find(q=>q.name==='TM01'),
      /* the two optima, and why 50 ohm sits between them */
      baMinLoss:3.591121476668, baMaxPower:Math.sqrt(Math.E)};
    M.coax.Z0MinLoss=etamed/TAU*Math.log(M.coax.baMinLoss);
    M.coax.Z0MaxPower=etamed/TAU*Math.log(M.coax.baMaxPower);
    M.coax.Z0Compromise=Math.sqrt(M.coax.Z0MinLoss*M.coax.Z0MaxPower);
  }
  if(geom==='plate') M.plate={d:pd,w:pw,Z0:etamed*pd/pw};
  if(geom==='cone'){
    const nuTM=coneNu('TM',0,th0), nuTE=coneNu('TE',1,th0);
    const nu=(fam==='TE')? nuTE : nuTM;
    const k=TAU*f/cmed;
    M.cone={th0,nuTM,nuTE,nu,
      Z0bi:z0Biconical(th0,etamed), Z0gnd:z0ConeGround(th0,etamed),
      turn:Math.sqrt(nu*(nu+1)),
      rCut:Math.sqrt(nu*(nu+1))/k,          /* the cutoff RADIUS, in metres */
      k};
    /* A cone HAS modes; what it does not have is a cutoff frequency, so
       fc = 0 here is the physical answer and not a placeholder.  The biconical
       TEM is nu = 0 exactly and has no turning point either. */
    mode=(fam==='TEM') ? {fam:'TEM',m:0,n:0,kc:0,fc:0,name:'TEM (biconical)',nu:0}
       : (fam==='TE')  ? {fam:'TE', m:1,n:1,kc:0,fc:0,name:'TE11',nu:nuTE}
                       : {fam:'TM', m:0,n:1,kc:0,fc:0,name:'TM01',nu:nuTM};
  }
  if(geom==='fibre'){
    const acore=st.fibAUM*1e-6, lam=st.fibLamNM*1e-9;
    const n1=1.4682, n2=1.4629;
    const NA=Math.sqrt(n1*n1-n2*n2), V=fibreV(acore,lam,n1,n2);
    const u=fibreLPu(0,1,V), uEx=fibreHE11u(V,n1,n2);
    const k0=TAU/lam;
    const neff=(u!==null)? Math.sqrt(Math.pow(n1*k0,2)-Math.pow(u/acore,2))/k0 : NaN;
    const neffEx=(uEx!==null)? Math.sqrt(Math.pow(n1*k0,2)-Math.pow(uEx/acore,2))/k0 : NaN;
    const guided=[];
    [[0,1,'LP01 · HE11'],[1,1,'LP11 · TE01/TM01/HE21'],[2,1,'LP21 · EH11/HE31'],
     [0,2,'LP02 · HE12'],[3,1,'LP31'],[1,2,'LP12']].forEach(([l,mm,nm])=>{
      const uu=fibreLPu(l,mm,V);
      if(uu!==null) guided.push({l,m:mm,name:nm,u:uu,w:Math.sqrt(V*V-uu*uu)});
    });
    /* GROUP index, from a numerical dn_eff/dlambda on the exact vector root:
       n_g = n_eff - lambda dn_eff/dlambda.  n1 and n2 are held fixed here, so
       this is WAVEGUIDE dispersion only — material dispersion is not modelled
       and the readout says so. */
    const dl=lam*2e-4;
    const neffAt=(L)=>{
      const VV=fibreV(acore,L,n1,n2), uu=fibreHE11u(VV,n1,n2);
      if(uu===null) return NaN;
      const kk=TAU/L;
      return Math.sqrt(Math.pow(n1*kk,2)-Math.pow(uu/acore,2))/kk;
    };
    const dn=(neffAt(lam+dl)-neffAt(lam-dl))/(2*dl);
    const ng=isFinite(dn)? neffEx-lam*dn : NaN;
    M.fibre={acore,lam,n1,n2,NA,V,u,uEx,neff,neffEx,guided,ng,
      lamC:TAU*acore*NA/jZero(0,1),
      Vc:jZero(0,1),
      single:V<jZero(0,1),
      delta:(n1*n1-n2*n2)/(2*n1*n1)};
    /* the fibre's "mode" for the field views is the fundamental */
    mode={fam:'HE',m:1,n:1,kc:0,fc:0,name:'HE11'};
  }
  M.mode=mode;

  /* ---- dispersion at the operating point ---- */
  const fc=mode?mode.fc:0;
  M.fc=fc;
  M.gp=guideProps(f,fc,cmed,etamed);
  /* A FIBRE does not run at the microwave frequency slider — it runs at its own
     wavelength, 1550 nm being 193 THz.  Left on the shared slider it reported
     lambda_g = 29.98 mm for a single-mode fibre, which is a 10 GHz free-space
     wavelength and nonsense.  Its guide wavelength is lambda/n_eff, and its
     group velocity comes from the group index, not from a cutoff. */
  if(geom==='fibre'&&isFinite(M.fibre.neffEx)){
    const k0=TAU/M.fibre.lam, beta=M.fibre.neffEx*k0;
    M.f=C0/M.fibre.lam;
    M.gp={k:k0,kc:0,prop:true,beta,alphaEv:0,
      lam0:M.fibre.lam, lamG:TAU/beta,
      vp:C0/M.fibre.neffEx,
      vg:isFinite(M.fibre.ng)?C0/M.fibre.ng:NaN,
      Zte:etamed/M.fibre.neffEx, Ztm:etamed/M.fibre.neffEx,
      ratio:Infinity};
  }
  const f2=M.f;
  M.om=TAU*f2;
  M.Zw=(mode&&mode.fam==='TM')?M.gp.Ztm:(mode&&mode.fam==='TEM')?etamed:M.gp.Zte;

  /* ---- single-mode window: from the lowest cutoff to the next one up ---- */
  if(modes.length>1){
    const lo=modes[0], hiM=modes.find(q=>q.fc>lo.fc+1e-6);
    M.single={lo:lo.fc,hi:hiM?hiM.fc:Infinity,loName:lo.name,hiName:hiM?hiM.name:'—'};
  }

  /* ---- loss ---- */
  let ac=Infinity;
  if(geom==='rect'&&mode&&mode.fam==='TE'&&mode.m===1&&mode.n===0)
    ac=alphaRectTE10(f,a,b,sigma,cmed,etamed);
  else if(geom==='circ'&&mode)
    ac=(mode.fam==='TE')?alphaCircTE(f,mode.m,mode.n,rad,sigma,cmed,etamed)
                        :alphaCircTM(f,mode.m,mode.n,rad,sigma,cmed,etamed);
  else if(geom==='coax'&&mode&&mode.fam==='TEM') ac=alphaCoax(f,ai,bo,sigma,etamed);
  else if(geom==='plate'&&mode&&mode.fam==='TEM') ac=alphaPlateTEM(f,pd,sigma,etamed);
  /* the fill dielectric is a microwave-guide notion; applying it to a fibre or
     a cone would print a number for a mechanism neither of them has */
  const ad=(M.gp.prop&&tand>0&&geom!=='fibre'&&geom!=='cone')
    ? alphaDielectric(f,tand,cmed,M.gp.beta) : 0;
  M.loss={c:ac,d:ad,tot:ac+ad,
    cDB:ac*NP2DB,dDB:ad*NP2DB,totDB:(ac+ad)*NP2DB,
    Rs:surfaceR(f,sigma),
    skin:Math.sqrt(1/(PI*f*MU0*sigma)),
    modelled:isFinite(ac)};

  /* ---- the taper (view F) ---- */
  {
    const a1=a, a2=st.taperA2*1e-3, L=st.taperLMM*1e-3;
    const aCut=cmed/(2*f);                        /* width whose fc equals f */
    let zTurn=NaN;
    if((a1-aCut)*(a2-aCut)<0) zTurn=(aCut-a1)/((a2-a1)/L);
    M.taper={a1,a2,L,aCut,zTurn,
      fc1:cmed/(2*a1),fc2:cmed/(2*a2),
      cutsOff:isFinite(zTurn)};
  }

  /* ---- warnings the canvas will print ---- */
  if(mode&&!M.gp.prop&&geom!=='cone'&&geom!=='fibre')
    M.warn.push(mode.name+' is BELOW cutoff — evanescent, carries no power');
  if(M.gp.prop&&fc>0&&f<1.05*fc)
    M.warn.push('within 5% of cutoff — the perturbation loss model diverges here');
  return M;
}

/* ================================================================== *
 *  readout / equation bar / corner tag                                *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function row(l,v,cls){ return '<tr><td>'+l+'</td><td class="v'+(cls?' '+cls:'')
  +'">'+v+'</td></tr>'; }

function readoutHTML(M){
  const g=M.gp, md=M.mode, st=M.st;
  let s='<div class="rname">'+(md?md.name:'—')
    +'<small>'+M.geomName+' &middot; '+(M.fillName==='vacuum'?'air-filled':M.fillName)+'</small></div><table>';

  if(M.geom==='cone'){
    s+=hd('the cone');
    s+=row('half-angle &theta;<sub>0</sub>',fmt(M.st.coneDeg,1)+'&deg;');
    s+=row('Legendre degree &nu;',sigf(M.cone.nu,6));
    s+=row('&nu;(TM<sub>01</sub>)',sigf(M.cone.nuTM,6));
    s+=row('&nu;(TE<sub>11</sub>)',sigf(M.cone.nuTE,6));
    s+=hd('cutoff is a radius, not a frequency');
    s+=row('turning point kr',sigf(M.cone.turn,5));
    s+=row('r<sub>cut</sub> at this f',fmtLen(M.cone.rCut,2));
    s+=hd('the biconical TEM');
    s+=row('Z<sub>0</sub> two cones',fmt(M.cone.Z0bi,1)+' &Omega;');
    s+=row('Z<sub>0</sub> cone + ground',fmt(M.cone.Z0gnd,1)+' &Omega;');
    s+='</table><p class="note">A cone has <b>no cutoff frequency</b>. Its radial '
      +'equation turns over at kr = &radic;(&nu;(&nu;+1)), so every frequency is '
      +'evanescent near the apex and propagating past it. Only the two-cone TEM '
      +'(&nu; = 0) escapes that entirely.</p>';
    return s;
  }

  if(M.geom==='fibre'){
    const F=M.fibre;
    s+=hd('the fibre');
    s+=row('core radius',fmt(M.st.fibAUM,2)+' µm');
    s+=row('&lambda;',fmt(M.st.fibLamNM,0)+' nm');
    s+=row('NA',sigf(F.NA,5));
    s+=row('V',sigf(F.V,6),F.single?'good':'bad');
    s+=row('V<sub>c</sub> (LP<sub>11</sub> cuts in)',sigf(F.Vc,6));
    s+=row('&lambda;<sub>c</sub>',fmt(F.lamC*1e9,1)+' nm');
    s+=hd('the operating point');
    s+=row('f',fmtHz(M.f,4));
    s+=row('&lambda;<sub>g</sub> = &lambda;/n<sub>eff</sub>',fmtLen(M.gp.lamG,4));
    s+=row('n<sub>g</sub> (group index)',isFinite(F.ng)?sigf(F.ng,8):'&mdash;');
    s+=row('v<sub>g</sub> / c',isFinite(F.ng)?sigf(1/F.ng,6):'&mdash;');
    s+=hd('the fundamental HE11');
    s+=row('u  exact vector',sigf(F.uEx,7));
    s+=row('u  weak-guidance LP',sigf(F.u,7));
    s+=row('n<sub>eff</sub> exact',sigf(F.neffEx,8));
    s+=row('n<sub>eff</sub> LP',sigf(F.neff,8));
    s+=row('&Delta;n<sub>eff</sub>',(Math.abs(F.neffEx-F.neff)).toExponential(2));
    s+=row('&Delta; = (n1&sup2;-n2&sup2;)/2n1&sup2;',F.delta.toExponential(3));
    s+=hd('guided modes');
    s+=row('count',String(F.guided.length),F.single?'good':'');
    s+='</table><p class="note">'+(F.single
      ? '<b>Single mode.</b> Only HE<sub>11</sub> is guided, and it has <b>no cutoff</b> — '
        +'the reason single-mode fibre exists at all.'
      : '<b>Multimode.</b> V is past 2.405, so LP<sub>11</sub> is guided too and the '
        +'pulse will spread by intermodal dispersion.')
      +' The group index is WAVEGUIDE dispersion only &mdash; n<sub>1</sub> and '
      +'n<sub>2</sub> are held fixed, so material dispersion is not in it.</p>';
    return s;
  }

  s+=hd('the operating point');
  s+=row('f',fmt(M.st.fGHz,3)+' GHz');
  s+=row('f<sub>c</sub>',md&&md.fc>0?fmtHz(md.fc,4):'0 (TEM)');
  s+=row('f / f<sub>c</sub>',md&&md.fc>0?sigf(g.ratio,4):'&infin;',
        g.prop?'good':'bad');
  s+=row('&lambda;<sub>0</sub>',fmtLen(g.lam0,2));
  s+=hd(g.prop?'propagating':'BELOW CUTOFF — evanescent');
  if(g.prop){
    s+=row('&beta;',sigf(g.beta,6)+' rad/m');
    s+=row('&lambda;<sub>g</sub>',fmtLen(g.lamG,2));
    s+=row('v<sub>p</sub> / c',sigf(g.vp/C0,5));
    s+=row('v<sub>g</sub> / c',sigf(g.vg/C0,5));
    s+=row('v<sub>p</sub>v<sub>g</sub> / c&sup2;',sigf(g.vp*g.vg/(C0*C0),8),'good');
    s+=row('Z<sub>w</sub>',fmt(M.Zw,1)+' &Omega;');
  }else{
    s+=row('&alpha;',sigf(g.alphaEv,5)+' Np/m');
    s+=row('&alpha;',sigf(g.alphaEv*NP2DB,4)+' dB/m');
    s+=row('per cm',sigf(g.alphaEv*0.01*NP2DB,3)+' dB');
    s+=row('&eta; dissipated','0','good');
  }
  if(M.geom==='coax'){
    s+=hd('the line');
    s+=row('Z<sub>0</sub>',fmt(M.coax.Z0,2)+' &Omega;');
    s+=row('b / a',sigf(M.coax.ba,5));
    s+=row('TE<sub>11</sub> f<sub>c</sub> exact',fmtHz(M.coax.te11.fc,4));
    s+=row('&nbsp;&nbsp;textbook 2/(a+b)',
        fmtHz(modeCutoff(M.coax.te11.approxKc,M.cmed),4),'bad');
    s+=row('&nbsp;&nbsp;error',fmt(100*(M.coax.te11.approxKc/M.coax.te11.kc-1),2)+' %');
  }
  if(M.geom==='plate'){
    s+=hd('the line');
    s+=row('Z<sub>0</sub> = &eta;d/w',fmt(M.plate.Z0,2)+' &Omega;');
  }
  if(M.single){
    s+=hd('single-mode window');
    s+=row('from '+M.single.loName,fmtHz(M.single.lo,4));
    s+=row('to '+M.single.hiName,isFinite(M.single.hi)?fmtHz(M.single.hi,4):'&infin;');
    s+=row('ratio',isFinite(M.single.hi)?sigf(M.single.hi/M.single.lo,4):'&infin;');
  }
  s+=hd('loss — '+M.metalName);
  s+=row('R<sub>s</sub>',sigf(M.loss.Rs,4)+' &Omega;/&#9633;');
  s+=row('skin depth',fmtLen(M.loss.skin,2));
  s+=row('&alpha;<sub>c</sub>',M.loss.modelled?sigf(M.loss.cDB,4)+' dB/m':'not modelled');
  if(M.tand>0) s+=row('&alpha;<sub>d</sub>',sigf(M.loss.dDB,4)+' dB/m');
  s+='</table>';

  s+='<p class="note">'+(g.prop
    ? 'Above cutoff the guide is a pipe. <b>v<sub>p</sub> exceeds c and that is fine</b> — '
      +'no information rides the phase; v<sub>g</sub> is what carries it, and '
      +'v<sub>p</sub>v<sub>g</sub> = c&sup2; exactly.'
    : 'Below cutoff the guide is a <b>filter, not an absorber</b>. &beta; has become '
      +'&minus;j&alpha;: the field decays, but a lossless guide dissipates nothing '
      +'doing it. The energy is reflected back to the source.')+'</p>';
  if(M.warn.length) s+='<p class="note"><b class="bad">'+M.warn[0]+'</b></p>';
  return s;
}

function eqbarHTML(M){
  const v=M.st.view, md=M.mode, g=M.gp;
  const E=(lhs,rhs,sm)=>'<span class="lhs">'+lhs+'</span> = '+rhs
    +'<span class="sm">'+sm+'</span>';
  if(v==='guide'){
    if(M.geom==='fibre')
      return E('V','(2&pi;a/&lambda;)&radic;(n<sub>1</sub><sup>2</sup>&minus;n<sub>2</sub><sup>2</sup>) = <span class="hl">'
        +sigf(M.fibre.V,5)+'</span>',
        'the one number a step-index fibre has. Below 2.405 exactly one mode is guided.');
    if(M.geom==='cone')
      return E('P<sub><span class="hl2">&nu;</span></sub><sup>m</sup>(cos&theta;<sub>0</sub>)','0'
        +' &nbsp;&rarr;&nbsp; <span class="hl2">&nu;</span> = <span class="hl">'+sigf(M.cone.nu,6)+'</span>',
        'a cone quantises the Legendre DEGREE, and it is not an integer.');
    return E('&beta;','&radic;(k<sup>2</sup> &minus; k<sub>c</sub><sup>2</sup>) = <span class="hl">'
      +(g.prop?sigf(g.beta,5)+' rad/m':'&minus;j '+sigf(g.alphaEv,5)+' /m')+'</span>',
      g.prop?'above cutoff k &gt; k<sub>c</sub>: &beta; is real and the mode propagates.'
            :'below cutoff k &lt; k<sub>c</sub>: &beta; is imaginary and the mode decays without loss.');
  }
  if(v==='xsec'){
    if(M.geom==='rect'&&md&&md.fam==='TE')
      return E('H<sub>z</sub>','A cos(<span class="hl">'+md.m+'</span>&pi;x/a) cos(<span class="hl2">'
        +md.n+'</span>&pi;y/b)',
        'the whole mode follows from this one scalar. m and n count the half-waves across each wall.');
    if(M.geom==='circ'&&md)
      return E(md.fam==='TE'?'H<sub>z</sub>':'E<sub>z</sub>',
        'A J<sub><span class="hl">'+md.m+'</span></sub>('+(md.fam==='TE'?'p&prime;':'p')
        +'<sub>'+md.m+md.n+'</sub> r/a) cos('+md.m+'&phi;)',
        'the rim picks the Bessel root: '+(md.fam==='TE'?'J&prime;':'J')+'<sub>'+md.m
        +'</sub> = 0 at <span class="hl">'+sigf(md.p||md.kc*M.rad,7)+'</span>.');
    if(M.geom==='coax')
      return E('E<sub>r</sub>','V / (r ln(b/a))  &nbsp;&nbsp; Z<sub>0</sub> = (&eta;/2&pi;) ln(b/a) = <span class="hl">'
        +fmt(M.coax.Z0,2)+' &Omega;</span>',
        'a TEM field is a 2-D electrostatic field towed along at c. No cutoff, no dispersion.');
    return E('k<sub>c</sub>','n&pi;/d &nbsp;&nbsp; f<sub>c</sub> = nc/2d',
      'parallel plates: the TEM mode is n = 0 and has no cutoff at all.');
  }
  if(v==='disp')
    return E('&omega;<sup>2</sup>','c<sup>2</sup>&beta;<sup>2</sup> + &omega;<sub>c</sub><sup>2</sup>'
      +' &nbsp;&rarr;&nbsp; <span class="hl">v<sub>p</sub>v<sub>g</sub> = c<sup>2</sup></span>',
      'a hyperbola with the light line as its asymptote. v<sub>p</sub> is the secant slope, '
      +'v<sub>g</sub> the tangent — they meet only at infinity.');
  if(v==='chart')
    return E('f<sub>c</sub>',M.geom==='circ'
        ? '(p<sub>mn</sub>/a) c/2&pi;'
        : '(c/2)&radic;((m/a)<sup>2</sup> + (n/b)<sup>2</sup>)',
      M.geom==='circ'
        ? 'TE takes the roots of J&prime;<sub>m</sub>, TM the roots of J<sub>m</sub>. '
          +'J&prime;<sub>0</sub> = &minus;J<sub>1</sub>, so TE<sub>0n</sub> and TM<sub>1n</sub> are degenerate.'
        : 'the whole mode chart of a rectangular guide is one ellipse equation in (m/a, n/b).');
  if(v==='atten')
    return E('&alpha;<sub>c</sub>','R<sub>s</sub> &int;|J<sub>s</sub>|<sup>2</sup>d&ell; / 2P'
      +' &nbsp;&nbsp; R<sub>s</sub> = <span class="hl">'+sigf(M.loss.Rs,4)+' &Omega;/&#9633;</span>',
      'perturbation theory: assume the lossless field, then charge the wall for carrying it. '
      +'It diverges at cutoff; a real guide does not.');
  return E('u&Prime; + [k<sup>2</sup> &minus; &nu;(&nu;+1)/r<sup>2</sup>]u','0',
    'the conical radial equation. The bracket changes sign at kr = &radic;(&nu;(&nu;+1)) — '
    +'that is the cone&rsquo;s cutoff, and it is a radius.');
}

function tagHTML(M){
  const md=M.mode, g=M.gp;
  const v=M.st.view;
  if(M.geom==='cone')
    return '<b>'+(M.fam==='TE'?'TE':'TM')+'</b> in a '+fmt(M.st.coneDeg,0)
      +'&deg; cone &nbsp; &nu; = '+sigf(M.cone.nu,5)+' &nbsp; r<sub>cut</sub> = '+fmtLen(M.cone.rCut,2);
  if(M.geom==='fibre')
    return '<b>HE<sub>11</sub></b> &nbsp; V = '+sigf(M.fibre.V,4)+' &nbsp; '
      +(M.fibre.single?'single mode':M.fibre.guided.length+' guided modes');
  if(!md) return '';
  return '<b>'+md.name+'</b> in '+M.geomName+' &nbsp; '
    +(md.fc>0? 'f<sub>c</sub> = '+fmtHz(md.fc,3)+' &nbsp; f/f<sub>c</sub> = '+sigf(g.ratio,3)
             : 'no cutoff (TEM)')
    +(g.prop?'':' &nbsp; <b>evanescent</b>');
}

/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  const xt=o.xticks||ticksFor(xlo,xhi,6), yt=o.yticks||ticksFor(ylo,yhi,5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}


/* ================================================================== *
 *  small drawing helpers particular to this file                      *
 * ================================================================== */

/* The floating readout covers the top-right of the stage, and views have to
   RESERVE it rather than hope — it is about 320 px wide and reaches ~470 px
   down.  (Known-bad list: a full-width top row on drum_head.html put two whole
   panels and three views' axis labels underneath it.)  Every panel whose top
   is above roBottom() keeps its right edge at or left of roLeft(). */
function roLeft(W){ return W-13-280-24-8; }
function roBottom(){ return 478; }
/* the right edge a top panel may use */
function topRight(W,pad){ return Math.min(W-pad,roLeft(W)); }

/* wrapText() in the shared 2-D layer splits on /\s+/, which swallows '\n' —
   so an explicit line break in a caption silently becomes a space.  Rather than
   change a helper three other sims depend on, break the blocks here and hand
   each one to caption() separately. */
function captionBlock(ctx,x,y,txt,maxW,col,font){
  let dy=0;
  String(txt).split('\n').forEach(part=>{
    if(part===''){ dy+=8; return; }
    dy+=caption(ctx,x,y+dy,part,maxW,col,font);
  });
  return dy;
}

/* A field-magnitude map has to be DARK where the field is zero.  neon(0) is a
   bright yellow-green, so painting the ramp raw floods the whole cross-section
   with colour and drowns the arrows on top of it — which is exactly what the
   first rasterisation showed.  Fade the ramp toward the background by its own
   magnitude. */
function fieldCss(t){
  const u=clamp(t,0,1);
  /* single hue, not the full neon ramp.  The ramp ends at MAGENTA, which is
     this file's colour for H — so a strong |E| region was being painted in the
     H colour, directly under magenta H arrows.  Green is "the thing being
     computed"; the wash is a muted green and the arrows on top are bright. */
  return shade('#6fa32b',Math.pow(u,0.72));
}

function arrow(ctx,x0,y0,x1,y1,col,lw,hd){
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy);
  if(!(L>0.35)) return;
  hd=hd===undefined?Math.min(5.5,L*0.42):hd;
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  const ux=dx/L, uy=dy/L, px=-uy, py=ux;
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1-ux*hd+px*hd*0.42, y1-uy*hd+py*hd*0.42);
  ctx.lineTo(x1-ux*hd-px*hd*0.42, y1-uy*hd-py*hd*0.42);
  ctx.closePath(); ctx.fill();
}
/* a dot with a ring = field out of the page; a cross = into it.  This is the
   only honest way to draw a component perpendicular to the screen. */
function outOfPage(ctx,x,y,r,col,into){
  ctx.strokeStyle=col; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
  if(into){
    const d=r*0.62;
    ctx.beginPath(); ctx.moveTo(x-d,y-d); ctx.lineTo(x+d,y+d);
    ctx.moveTo(x+d,y-d); ctx.lineTo(x-d,y+d); ctx.stroke();
  }else{
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,Math.max(1,r*0.3),0,TAU); ctx.fill();
  }
}
/* the house scalar ramp, signed: magenta for negative, green for positive,
   near-background at zero.  Used for every scalar field map in this file. */
function signedRamp(t){
  const u=clamp(Math.abs(t),0,1);
  const base=(t>=0)?'#b8ec4c':'#cd35c4';
  return mix('#0a0d14',base,Math.pow(u,0.72));
}

/* ================================================================== *
 *  the field sampler                                                  *
 *                                                                     *
 *  Every view asks the same question — "what are E and H at this point *
 *  of the cross-section?" — and every geometry answers it in its own   *
 *  natural coordinates.  This is the one place that difference lives.  *
 *  Returns CARTESIAN transverse components (Ex,Ey) plus the two        *
 *  longitudinal scalars, all in the guide's own frame: x across the    *
 *  broad dimension, y across the narrow one, z along the guide.        *
 * ================================================================== */
function sampleXY(M,x,y,psi){
  const md=M.mode, g=M.gp, om=M.om, beta=g.prop?g.beta:0;
  if(M.geom==='rect'){
    const F=fieldRect(md,M.a,M.b,om,beta,x,y,psi);
    return {Ex:F.Ex,Ey:F.Ey,Ez:F.Ez,Hx:F.Hx,Hy:F.Hy,Hz:F.Hz,inside:
            x>=0&&x<=M.a&&y>=0&&y<=M.b};
  }
  if(M.geom==='circ'){
    const r=Math.hypot(x,y), ph=Math.atan2(y,x);
    if(r>M.rad) return {Ex:0,Ey:0,Ez:0,Hx:0,Hy:0,Hz:0,inside:false};
    const F=fieldCirc(md,M.rad,om,beta,r,ph,psi);
    const c=Math.cos(ph), s=Math.sin(ph);
    return {Ex:F.Er*c-F.Ep*s, Ey:F.Er*s+F.Ep*c, Ez:F.Ez,
            Hx:F.Hr*c-F.Hp*s, Hy:F.Hr*s+F.Hp*c, Hz:F.Hz, inside:true};
  }
  if(M.geom==='coax'){
    const r=Math.hypot(x,y), ph=Math.atan2(y,x);
    if(r<M.ai||r>M.bo) return {Ex:0,Ey:0,Ez:0,Hx:0,Hy:0,Hz:0,inside:false};
    if(md&&md.fam==='TEM'){
      const F=fieldCoaxTEM(M.ai,M.bo,r,psi);
      const c=Math.cos(ph), s=Math.sin(ph);
      return {Ex:F.Er*c, Ey:F.Er*s, Ez:0, Hx:-F.Hp*s, Hy:F.Hp*c, Hz:0, inside:true};
    }
    /* higher-order coax modes: drawn with the SOLID-guide radial shape, which
       is qualitatively right and quantitatively not.  Said so on the canvas. */
    const F=fieldCirc({fam:md.fam,m:md.m,n:md.n,kc:md.kc},M.bo,om,beta,r,ph,psi);
    const c=Math.cos(ph), s=Math.sin(ph);
    return {Ex:F.Er*c-F.Ep*s, Ey:F.Er*s+F.Ep*c, Ez:F.Ez,
            Hx:F.Hr*c-F.Hp*s, Hy:F.Hr*s+F.Hp*c, Hz:F.Hz, inside:true, approx:true};
  }
  if(M.geom==='plate'){
    const F=fieldPlate(md,M.pd,om,beta,y,psi);
    return {Ex:F.Ex,Ey:F.Ey,Ez:F.Ez,Hx:F.Hx,Hy:F.Hy,Hz:F.Hz,
            inside:y>=0&&y<=M.pd&&Math.abs(x)<=M.pw/2};
  }
  if(M.geom==='cone'){
    /* A cone has no uniform cross-section, so "the transverse plane" here is
       the SPHERICAL CAP at some radius, flattened by rho = theta/theta0.  The
       angular pattern is the whole content; the radial function is a constant
       multiplier at fixed r and is drawn separately in "the cone".
         TM:  E_th ~ dP/dth cos(m phi),   E_phi ~ -(m/sin th) P sin(m phi)
         TE:  E_th ~ (m/sin th) P sin(m phi), E_phi ~ dP/dth cos(m phi)
       Both vanish where they must on the wall: TM has P(cos th0) = 0 and TE
       has dP/dth = 0 there, which is exactly how nu was chosen. */
    const rho=Math.hypot(x,y);
    if(rho>1||M.cone.nu===undefined||!isFinite(M.cone.nu))
      return {Ex:0,Ey:0,Ez:0,Hx:0,Hy:0,Hz:0,inside:false};
    const th=Math.max(rho*M.th0,1e-6), ph=Math.atan2(y,x);
    const mOrd=(md&&md.fam==='TE')?1:0;
    const P=legendreP(M.cone.nu,mOrd,Math.cos(th));
    const dP=legendrePdTh(M.cone.nu,mOrd,th);
    const cs=Math.cos(mOrd*ph), sn=Math.sin(mOrd*ph);
    const cw=Math.cos(psi);
    let Eth,Eph;
    if(md&&md.fam==='TE'){ Eth=(mOrd/Math.sin(th))*P*sn; Eph=dP*cs; }
    else                 { Eth=dP*cs;                    Eph=-(mOrd/Math.sin(th))*P*sn; }
    Eth*=cw; Eph*=cw;
    const c2=Math.cos(ph), s2=Math.sin(ph);
    return {Ex:Eth*c2-Eph*s2, Ey:Eth*s2+Eph*c2,
            Ez:(md&&md.fam==='TM')?M.cone.nu*(M.cone.nu+1)*P*cs*cw*0.35:0,
            Hx:-(Eth*s2+Eph*c2)/ETA0, Hy:(Eth*c2-Eph*s2)/ETA0,
            Hz:(md&&md.fam==='TE')?M.cone.nu*(M.cone.nu+1)*P*cs*cw*0.35:0,
            inside:true};
  }
  if(M.geom==='fibre'){
    const F=M.fibre;
    if(F.u===null) return {Ex:0,Ey:0,Ez:0,Hx:0,Hy:0,Hz:0,inside:false};
    const r=Math.hypot(x,y)/F.acore;
    const w=Math.sqrt(Math.max(F.V*F.V-F.u*F.u,1e-30));
    const amp=fibreProfile(0,F.u,w,F.V,r)*Math.cos(psi);
    /* HE11 is very nearly linearly polarised — that is the whole content of
       the LP approximation, and it is what a real fibre mode looks like. */
    return {Ex:0,Ey:amp,Ez:0,Hx:-amp/(ETA0/F.n1),Hy:0,Hz:0,inside:r<=3};
  }
  return {Ex:0,Ey:0,Ez:0,Hx:0,Hy:0,Hz:0,inside:false};
}

/* How much guide gets drawn, in world units where the transverse width is 1.
   ONE definition, used by both drawGuide() and the camera fit.  They had a copy
   each and the caps drifted apart (6 against 14), so the camera was fitting a
   box twice as long as the one being drawn and a coax came out at 18% of frame.
   Same lesson as the drum's group velocity written out three times. */
function guideDrawLength(M){
  if(M.geom==='cone') return 3.4;
  const bx=xsecBounds(M), g=M.gp;
  const tw=Math.max(bx[1]-bx[0],1e-12), SC=1/tw;
  const lamG=g.prop?g.lamG:(g.alphaEv>0?3/g.alphaEv:tw*4);
  return clamp(lamG*1.6*SC,0.9,6);
}

/* the transverse extent of whatever geometry is loaded, as [xlo,xhi,ylo,yhi] */
function xsecBounds(M){
  if(M.geom==='rect')  return [0,M.a,0,M.b];
  if(M.geom==='circ')  return [-M.rad,M.rad,-M.rad,M.rad];
  if(M.geom==='coax')  return [-M.bo,M.bo,-M.bo,M.bo];
  if(M.geom==='plate') return [-M.pw/2,M.pw/2,0,M.pd];
  if(M.geom==='fibre') return [-3*M.fibre.acore,3*M.fibre.acore,
                               -3*M.fibre.acore,3*M.fibre.acore];
  /* cone: the flattened spherical cap, rho = theta/theta0 in [0,1] */
  return [-1,1,-1,1];
}
/* Peak |E_t| over the cross-section, for normalising every arrow length.
   Maximised over PHASE as well as position.  Evaluating at a single psi looks
   safe only because a TE/TM transverse field carries sin(psi), which is 1 at
   pi/2 — but a TEM line and the fibre carry cos(psi), which is 0 there, so the
   normaliser came back as 1e-16 and every arrow and every wash pixel clamped
   to full scale.  That is exactly what a uniformly bright fibre core was. */
const _PHASES=[0,0.3927,0.7854,1.1781];
function peakEt(M){
  const B=xsecBounds(M); let mx=1e-30;
  for(const ps of _PHASES)
    for(let i=0;i<=24;i++) for(let j=0;j<=24;j++){
      const x=B[0]+(B[1]-B[0])*i/24, y=B[2]+(B[3]-B[2])*j/24;
      const F=sampleXY(M,x,y,ps);
      if(F.inside) mx=Math.max(mx,Math.hypot(F.Ex,F.Ey));
    }
  return mx;
}
function peakScalar(M,which){
  const B=xsecBounds(M); let mx=1e-30;
  for(const ps of _PHASES)
    for(let i=0;i<=24;i++) for(let j=0;j<=24;j++){
      const x=B[0]+(B[1]-B[0])*i/24, y=B[2]+(B[3]-B[2])*j/24;
      const F=sampleXY(M,x,y,ps);
      if(F.inside) mx=Math.max(mx,Math.abs(which==='E'?F.Ez:F.Hz));
    }
  return mx;
}

/* ================================================================== *
 *  VIEW A — the guide                                                 *
 *  A length of the real thing, cut open, with the fields inside.       *
