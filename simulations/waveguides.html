 *  Drawn TO SCALE in all three dimensions: the drawn length is a whole *
 *  number of guide wavelengths, so there is no distortion to declare.  *
 * ================================================================== */
/* The cone gets its own 3-D routine: it has no uniform cross-section to slide
   a pattern along, so nothing in the straight-guide renderer applies. */
function drawGuideCone(ctx,W,H,M,S){
  const cam=S.cam;
  cam.W=W; cam.H=H;
  const B=camBasis(cam);
  const nu=M.cone.nu, th0=M.th0;
  const sMax=Math.max(M.cone.turn*2.6,7);
  const SCw=3.4/sMax;                        /* kr -> world units */
  const RR=coneRadial(nu,sMax,420);
  let umax=1e-30;
  for(let i=0;i<RR.u.length;i++) if(isFinite(RR.u[i])) umax=Math.max(umax,Math.abs(RR.u[i]));
  const uAt=(s)=>{
    const i=clamp(Math.round((s-RR.s[0])/(RR.s[1]-RR.s[0])),0,RR.u.length-1);
    return RR.u[i]/umax;
  };
  /* spherical (s=kr, th, ph) -> world, apex at the origin, axis along +X */
  const w3=(s,th,ph)=>[s*SCw*Math.cos(th), s*SCw*Math.sin(th)*Math.cos(ph),
                       s*SCw*Math.sin(th)*Math.sin(ph)];
  const pj=(p)=>project(cam,B,p);
  const prims=[]; const push=(d,fn)=>prims.push({d,fn});

  /* the cone wall — far half only, so the inside stays visible */
  const nPh=48, nS=Math.max(6,Math.round(sMax*2.2));
  for(let i=0;i<nS;i++){
    const s0=sMax*i/nS, s1=sMax*(i+1)/nS;
    for(let j=0;j<nPh;j++){
      const p0=TAU*j/nPh, p1=TAU*(j+1)/nPh;
      const pm=(p0+p1)/2;
      /* outward normal of the cone surface has no radial part along the axis */
      const nrm=v3.norm([-Math.sin(th0), Math.cos(th0)*Math.cos(pm),
                          Math.cos(th0)*Math.sin(pm)]);
      const mid=w3((s0+s1)/2,th0,pm);
      if(v3.dot(nrm,v3.norm(v3.sub(B.eye,mid)))>0) continue;
      const q=[pj(w3(s0,th0,p0)),pj(w3(s1,th0,p0)),pj(w3(s1,th0,p1)),pj(w3(s0,th0,p1))];
      if(q.some(v=>!v)) continue;
      const dep=(q[0].z+q[1].z+q[2].z+q[3].z)/4;
      const sh=shade('#39404f',0.45+0.5*clamp(0.5+0.5*Math.sin(pm),0,1));
      push(dep,()=>{
        ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y);
        for(let k=1;k<4;k++) ctx.lineTo(q[k].x,q[k].y);
        ctx.closePath(); ctx.globalAlpha=0.45; ctx.fillStyle=sh; ctx.fill();
        ctx.globalAlpha=1;
      });
    }
  }
  /* the turning-point sphere, as a ring on the cap */
  {
    const pts=[];
    for(let j=0;j<=72;j++) pts.push(pj(w3(M.cone.turn,th0,TAU*j/72)));
    push(1e-6,()=>{
      ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath();
      pts.forEach((q,k)=>{ if(!q) return; if(k===0) ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y); });
      ctx.stroke(); ctx.setLineDash([]);
    });
  }
  /* the field, on rays inside the cone */
  const psi=S.phase();
  /* sparse on purpose: at nine rays by twelve azimuths by three samples per
     unit of kr the cone filled with a solid spray of arrows and nothing —
     not the wall, not the turning ring — could be seen through it */
  const nRay=5, nRad=Math.max(8,Math.round(sMax*1.6));
  for(let a2=0;a2<nRay;a2++){
    const th=th0*(a2+0.5)/nRay;
    for(let b2=0;b2<8;b2++){
      const ph=TAU*b2/8;
      for(let c2=1;c2<nRad;c2++){
        const s=sMax*c2/nRad;
        const amp=uAt(s)/Math.max(s*SCw,1e-6)*Math.cos(psi);
        const F=sampleXY(M,(th/th0)*Math.cos(ph),(th/th0)*Math.sin(ph),psi);
        if(!F.inside) continue;
        const mag=Math.hypot(F.Ex,F.Ey)*Math.abs(amp);
        if(mag<0.02) continue;
        const p0=w3(s,th,ph);
        const q0=pj(p0); if(!q0) continue;
        /* the E vector points mostly in theta; draw it in the meridian plane */
        const dTh=0.10*th0*Math.sign(amp)*clamp(mag*3,0,1);
        const q1=pj(w3(s,clamp(th+dTh,1e-4,th0),ph));
        if(!q1) continue;
        push((q0.z+q1.z)/2,()=>arrow(ctx,q0.x,q0.y,q1.x,q1.y,
          mix('#4a7f3a','#d4ff6a',clamp(mag*2.2,0,1)),1.1+1.2*clamp(mag*2.2,0,1)));
      }
    }
  }
  prims.sort((p,q)=>q.d-p.d);
  prims.forEach(p=>p.fn());

  captionBlock(ctx,14,H-72,
    ['a '+fmt(th0*RAD,1)+'° cone, ν = '+sigf(nu,6)+'  ('+(M.fam==='TE'?'TE':'TM')+' family)',
     'radial axis is kr, drawn to '+fmt(sMax,1)+'; the dashed ring is the turning point at kr = '
      +sigf(M.cone.turn,5),
     'inside it the mode is evanescent — that is what a cone has instead of a cutoff frequency',
     'at this frequency the ring sits at r = '+fmtLen(M.cone.rCut,2)
    ].join('\n'),W*0.66,'#8b93a6','11px -apple-system,sans-serif');
  return;
}

function drawGuide(ctx,W,H,M,S){
  if(M.geom==='cone') return drawGuideCone(ctx,W,H,M,S);
  const cam=S.cam, st=M.st;
  cam.W=W; cam.H=H;
  const B=camBasis(cam);
  const g=M.gp;

  /* world units: the broad transverse dimension is 1.  Everything else
     follows from the true aspect ratio. */
  const bx=xsecBounds(M);
  const tw=Math.max(bx[1]-bx[0],1e-12), thh=Math.max(bx[3]-bx[2],1e-12);
  const SC=1/tw;                                   /* metres -> world units */
  const lamG=g.prop?g.lamG:(M.gp.alphaEv>0?3/M.gp.alphaEv:tw*4);
  const Lw=guideDrawLength(M);                      /* drawn length, world  */

  /* map a guide point (x,y in metres, zz in world units) to world xyz */
  const w3=(x,y,zz)=>[zz, (x-(bx[0]+bx[1])/2)*SC, (y-(bx[2]+bx[3])/2)*SC];
  const pj=(p)=>project(cam,B,p);

  const prims=[];
  const push=(depth,fn)=>prims.push({d:depth,fn});
  const depthOf=(p)=>{ const q=pj(p); return q?q.z:1e9; };

  /* ---------------- the walls ---------------- */
  const wallCol='#39404f';
  function quad(p0,p1,p2,p3,fill,stroke,alpha){
    const q=[pj(p0),pj(p1),pj(p2),pj(p3)];
    if(q.some(v=>!v)) return;
    const dep=(q[0].z+q[1].z+q[2].z+q[3].z)/4;
    push(dep,()=>{
      ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(q[i].x,q[i].y);
      ctx.closePath();
      if(fill){ ctx.globalAlpha=alpha===undefined?0.5:alpha; ctx.fillStyle=fill; ctx.fill();
                ctx.globalAlpha=1; }
      if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
    });
  }
  const nzWall=Math.max(2,Math.round(Lw*7));

  if(M.geom==='rect'||M.geom==='plate'){
    const x0=bx[0],x1=bx[1],y0=bx[2],y1=bx[3];
    for(let i=0;i<nzWall;i++){
      const za=Lw*i/nzWall, zb=Lw*(i+1)/nzWall;
      /* floor and the far side wall are kept; the near side and the roof are
         culled so the inside is visible.  Culling by a direction we KNOW
         rather than by a winding we would have to get right. */
      quad(w3(x0,y0,za),w3(x1,y0,za),w3(x1,y0,zb),w3(x0,y0,zb),wallCol,null,0.45);
      if(M.geom==='rect'){
        quad(w3(x0,y0,za),w3(x0,y1,za),w3(x0,y1,zb),w3(x0,y0,zb),
             shade(wallCol,0.75),null,0.4);
        quad(w3(x0,y1,za),w3(x1,y1,za),w3(x1,y1,zb),w3(x0,y1,zb),
             shade(wallCol,0.55),null,0.18);
      }else{
        quad(w3(x0,y1,za),w3(x1,y1,za),w3(x1,y1,zb),w3(x0,y1,zb),wallCol,null,0.2);
      }
    }
    /* the open mouth, drawn as a bright rim */
    push(1e-6,()=>{
      const c=[pj(w3(x0,y0,0)),pj(w3(x1,y0,0)),pj(w3(x1,y1,0)),pj(w3(x0,y1,0))];
      if(c.some(v=>!v)) return;
      ctx.strokeStyle='#5ac8e0'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.moveTo(c[0].x,c[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(c[i].x,c[i].y);
      ctx.closePath(); ctx.stroke();
    });
  } else if(M.geom==='circ'||M.geom==='coax'||M.geom==='fibre'){
    const R=(M.geom==='circ')?M.rad:(M.geom==='coax')?M.bo:M.fibre.acore;
    const nPhi=40;
    /* only the far half of the tube is drawn, so the near wall does not hide
       the field.  phi in (0, pi) is the far half for this camera. */
    for(let i=0;i<nzWall;i++){
      const za=Lw*i/nzWall, zb=Lw*(i+1)/nzWall;
      for(let j=0;j<nPhi;j++){
        const p0=TAU*j/nPhi, p1=TAU*(j+1)/nPhi;
        const nx=Math.cos((p0+p1)/2), ny=Math.sin((p0+p1)/2);
        const outward=[0,nx,ny];
        const toEye=v3.norm(v3.sub(B.eye,w3(R*nx,R*ny,(za+zb)/2)));
        if(v3.dot(outward,toEye)>0) continue;         /* keep the FAR half   */
        quad(w3(R*Math.cos(p0),R*Math.sin(p0),za),w3(R*Math.cos(p1),R*Math.sin(p1),za),
             w3(R*Math.cos(p1),R*Math.sin(p1),zb),w3(R*Math.cos(p0),R*Math.sin(p0),zb),
             shade(wallCol,0.45+0.45*Math.max(0,ny)),null,
             M.geom==='fibre'?0.22:0.5);
      }
    }
    if(M.geom==='coax'){                               /* the centre conductor */
      for(let i=0;i<nzWall;i++){
        const za=Lw*i/nzWall, zb=Lw*(i+1)/nzWall;
        for(let j=0;j<nPhi;j++){
          const p0=TAU*j/nPhi, p1=TAU*(j+1)/nPhi;
          const nx=Math.cos((p0+p1)/2), ny=Math.sin((p0+p1)/2);
          const toEye=v3.norm(v3.sub(B.eye,w3(M.ai*nx,M.ai*ny,(za+zb)/2)));
          if(v3.dot([0,nx,ny],toEye)<0) continue;      /* keep the NEAR half  */
          quad(w3(M.ai*Math.cos(p0),M.ai*Math.sin(p0),za),
               w3(M.ai*Math.cos(p1),M.ai*Math.sin(p1),za),
               w3(M.ai*Math.cos(p1),M.ai*Math.sin(p1),zb),
               w3(M.ai*Math.cos(p0),M.ai*Math.sin(p0),zb),
               mix('#c98a3a','#f0c070',clamp(0.3+0.7*ny,0,1)),null,0.95);
        }
      }
    }
    push(1e-6,()=>{
      ctx.strokeStyle='#5ac8e0'; ctx.lineWidth=1.6;
      ctx.beginPath();
      for(let j=0;j<=64;j++){
        const p=TAU*j/64, q=pj(w3(R*Math.cos(p),R*Math.sin(p),0));
        if(!q) continue; if(j===0) ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y);
      }
      ctx.stroke();
    });
  }

  /* ---------------- the fields ---------------- */
  const psi0=S.phase();
  const pk=peakEt(M)||1;
  const nSlice=clamp(Math.round(Lw*3.4),3,16);
  const nA=clamp(st.nArrow|0,5,20);

  for(let s=0;s<nSlice;s++){
    const zz=Lw*(s+0.5)/nSlice;
    /* psi = wt - beta z, and z here is in WORLD units: convert back */
    const psi=psi0-(g.prop?g.beta*(zz/SC):0);
    const decay=g.prop?1:Math.exp(-g.alphaEv*(zz/SC));
    for(let i=0;i<nA;i++) for(let j=0;j<Math.max(2,Math.round(nA*thh/tw));j++){
      const nyq=Math.max(2,Math.round(nA*thh/tw));
      const x=bx[0]+(bx[1]-bx[0])*(i+0.5)/nA;
      const y=bx[2]+(bx[3]-bx[2])*(j+0.5)/nyq;
      const F=sampleXY(M,x,y,psi);
      if(!F.inside) continue;
      const p0=w3(x,y,zz);
      const q0=pj(p0); if(!q0) continue;
      /* CLAMP the normalised magnitude.  A coax TEM field goes as 1/r and the
         peak used for normalisation is found on a coarse grid, so a drawing
         sample landing nearer the inner conductor than any of them produced
         arrows tens of screens long.  Direction is kept, length is bounded. */
      if(st.showE){
        const ex=F.Ex/pk*decay, ey=F.Ey/pk*decay;
        const mag=Math.hypot(ex,ey);
        if(mag>0.035){
          /* centred on the sample, not anchored at it: anchored, every arrow
             near a wall stuck straight out through the conductor */
          const m2=Math.min(mag,1), AL=1.05*tw/nA;
          const ux=ex/mag*m2*AL, uy=ey/mag*m2*AL;
          const qa=pj(w3(x-ux,y-uy,zz)), q1=pj(w3(x+ux,y+uy,zz));
          if(qa&&q1) push((qa.z+q1.z)/2,()=>arrow(ctx,qa.x,qa.y,q1.x,q1.y,
            mix('#4a7f3a','#d4ff6a',m2),1.15+1.4*m2));
        }
      }
      if(st.showH){
        const hpk=pk/Math.max(M.Zw,1e-9);
        const hx=F.Hx/(hpk||1)*decay, hy=F.Hy/(hpk||1)*decay;
        const hn=Math.hypot(hx,hy);
        if(hn>0.035){
          const m2=Math.min(hn,1), AL=0.9*tw/nA;
          const ux=hx/hn*m2*AL, uy=hy/hn*m2*AL;
          const qa=pj(w3(x-ux,y-uy,zz)), q1=pj(w3(x+ux,y+uy,zz));
          if(qa&&q1) push((qa.z+q1.z)/2,()=>arrow(ctx,qa.x,qa.y,q1.x,q1.y,
            mix('#7a2f70','#e878dd',m2),1.0+1.1*m2));
        }
      }
    }
  }

  /* ---------------- draw, back to front ---------------- */
  prims.sort((p,q)=>q.d-p.d);
  prims.forEach(p=>p.fn());

  /* ---------------- annotation ---------------- */
  const md=M.mode;
  const lines=[];
  lines.push(md?md.name+(M.geom==='coax'&&md.fam!=='TEM'?' (radial shape approximated)':''):'');
  if(g.prop){
    lines.push('drawn to scale: '+fmt(Lw/SC*1e3,1)+' mm of guide = '
      +fmt(Lw/(lamG*SC),2)+' guide wavelengths');
    lines.push('λ_g = '+fmtLen(g.lamG,2)+'   vs free space '+fmtLen(g.lam0,2));
  }else{
    lines.push('BELOW CUTOFF — amplitude falls e-fold every '+fmtLen(1/g.alphaEv,2));
    lines.push('drawn to scale: '+fmt(Lw/SC*1e3,1)+' mm of guide');
  }
  if(M.geom==='fibre') lines.push('core drawn at true radius; cladding continues past the frame');
  captionBlock(ctx,14,H-58,lines.join('\n'),W*0.62,'#8b93a6','11px -apple-system,sans-serif');

  /* legend — laid out RIGHT to LEFT from the corner and measured, because
     stepping left-to-right from a guessed origin ran "conductor" off the
     canvas edge by 9 px at 1400 wide. */
  ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left';
  const lg=[['E','#b8ec4c'],['H','#cd35c4'],['conductor','#39404f']];
  const wOf=([t])=>14+ctx.measureText(plain(t)).width+20;
  let lx=W-16-lg.reduce((s,e)=>s+wOf(e),0);
  lg.forEach(([t,c])=>{
    ctx.fillStyle=c; ctx.fillRect(lx,H-24,9,9);
    ctx.fillStyle='#8b93a6'; ctx.fillText(plain(t),lx+14,H-16);
    lx+=wOf([t,c]);
  });
}


/* The cone's stand-in for "the cut along the guide": its radial function,
   with the turning point that replaces cutoff.  Shared with "the cone". */
function coneRadialPanel(ctx,R,M){
  const nu=M.cone.nu;
  const sMax=Math.max(Math.sqrt(nu*(nu+1))*2.4,6);
  const RR=coneRadial(nu,sMax,600);
  let umax=1e-30;
  for(let i=0;i<RR.u.length;i++) if(isFinite(RR.u[i])) umax=Math.max(umax,Math.abs(RR.u[i]));
  const xs=[],ys=[];
  for(let i=0;i<RR.s.length;i++){ xs.push(RR.s[i]); ys.push(RR.u[i]/umax); }
  const b=box(R.x,R.y,R.w,R.h);
  axes(ctx,b,0,sMax,-1.15,1.15,{xlab:'kr',ylab:'u = r × radial function',
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  clipped(ctx,b,()=>{
    const TX=b.x+b.w*RR.turn/sMax;
    ctx.fillStyle=rgba('#e8843a',0.10); ctx.fillRect(b.x,b.y,TX-b.x,b.h);
    polyline(ctx,b,[0,sMax],[0,0],0,sMax,-1.15,1.15,'#2a2f3d',1);
    polyline(ctx,b,xs,ys,0,sMax,-1.15,1.15,'#b8ec4c',2.2);
    ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(TX,b.y); ctx.lineTo(TX,b.y1); ctx.stroke(); ctx.setLineDash([]);
  });
  ctx.fillStyle='#8b93a6'; ctx.font='italic 13px Georgia,serif'; ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.fillText(plain('outward from the apex — cutoff is a radius here'),b.x+b.w/2,b.y-14);
  ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#e8843a'; ctx.fillText(plain('evanescent'),b.x+6,b.y+6);
  ctx.fillText(plain('kr = '+sigf(RR.turn,5)),b.x+b.w*RR.turn/sMax+5,b.y+6);
  ctx.fillStyle='#b8ec4c'; ctx.textAlign='right';
  ctx.fillText(plain('propagating'),b.x1-8,b.y+6);
  ctx.textAlign='left';
  caption(ctx,b.x,b.y1+40,
    'There is no guide wavelength here because there is no z. The mode spreads '
    +'outward as a spherical wave, evanescent until kr passes √(ν(ν+1)) = '
    +sigf(RR.turn,4)+', which at this frequency is r = '+fmtLen(M.cone.rCut,2)+'.',
    b.w,'#8b93a6','11px -apple-system,sans-serif');
}

/* ================================================================== *
 *  VIEW B — the cross-section                                         *
 *  Left: the transverse plane, the picture every textbook draws.       *
 *  Right: a cut ALONG the guide, where lambda_g lives.                 *
 * ================================================================== */
function drawXsec(ctx,W,H,M,S){
  const st=M.st, g=M.gp, md=M.mode;
  const psi=S.phase();
  /* Both panels stay LEFT of the floating readout and stop well short of the
     bottom, because the guide-wavelength scale bars need 75 px under the right
     panel and the audit found them running off the canvas. */
  const pad=48, top=64, gapX=42;
  const rightMax=topRight(W,pad);
  const panelH=Math.min(H-top-210,545);
  const LW=Math.round((rightMax-pad-gapX)*0.58);
  const L=box(pad,top,LW,panelH);
  const R=box(pad+LW+gapX,top,rightMax-pad-LW-gapX,panelH);

  /* ---------------- left: the transverse plane ---------------- */
  const bx=xsecBounds(M);
  const aspect=(bx[3]-bx[2])/(bx[1]-bx[0]);
  let pw=L.w, ph=pw*aspect;
  if(ph>L.h){ ph=L.h; pw=ph/aspect; }
  /* top-aligned, not centred: centring left a band of dead canvas above a
     wide-aspect guide and pushed its captions to the middle of nowhere */
  const px=L.x+(L.w-pw)/2, py=L.y;
  const X=(x)=>px+(x-bx[0])/(bx[1]-bx[0])*pw;
  const Y=(y)=>py+ph-(y-bx[2])/(bx[3]-bx[2])*ph;

  /* the scalar background: |E_t|, which is what "the field pattern" means */
  const NG=54, NGy=Math.max(6,Math.round(NG*aspect));
  const pk=peakEt(M)||1;
  for(let i=0;i<NG;i++) for(let j=0;j<NGy;j++){
    const x=bx[0]+(bx[1]-bx[0])*(i+0.5)/NG, y=bx[2]+(bx[3]-bx[2])*(j+0.5)/NGy;
    const F=sampleXY(M,x,y,psi);
    if(!F.inside) continue;
    const t=clamp(Math.hypot(F.Ex,F.Ey)/pk,0,1);
    if(t<0.012) continue;
    ctx.fillStyle=fieldCss(t);
    ctx.fillRect(X(x)-pw/NG/2-0.6,Y(y)-ph/NGy/2-0.6,pw/NG+1.2,ph/NGy+1.2);
  }
  ctx.globalAlpha=1;

  /* the boundary */
  ctx.strokeStyle='#5ac8e0'; ctx.lineWidth=2;
  if(M.geom==='rect'||M.geom==='plate'){
    if(M.geom==='rect'){ ctx.strokeRect(X(bx[0]),Y(bx[3]),pw,ph); }
    else{
      ctx.beginPath(); ctx.moveTo(X(bx[0]),Y(bx[2])); ctx.lineTo(X(bx[1]),Y(bx[2]));
      ctx.moveTo(X(bx[0]),Y(bx[3])); ctx.lineTo(X(bx[1]),Y(bx[3])); ctx.stroke();
    }
  }else{
    const Rr=(M.geom==='circ')?M.rad:(M.geom==='coax')?M.bo
            :(M.geom==='cone')?1:M.fibre.acore;
    ctx.beginPath();
    for(let k=0;k<=90;k++){ const p=TAU*k/90;
      const xx=X(Rr*Math.cos(p)), yy=Y(Rr*Math.sin(p));
      if(k===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
    ctx.stroke();
    if(M.geom==='coax'){
      ctx.fillStyle='#c98a3a'; ctx.beginPath();
      for(let k=0;k<=64;k++){ const p=TAU*k/64;
        const xx=X(M.ai*Math.cos(p)), yy=Y(M.ai*Math.sin(p));
        if(k===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
      ctx.closePath(); ctx.fill();
    }
    if(M.geom==='fibre'){
      ctx.strokeStyle='#3a4152'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
      ctx.beginPath();
      for(let k=0;k<=90;k++){ const p=TAU*k/90;
        const xx=X(2*Rr*Math.cos(p)), yy=Y(2*Rr*Math.sin(p));
        if(k===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
      ctx.stroke(); ctx.setLineDash([]);
    }
  }

  /* transverse vectors */
  const nA=clamp(st.nArrow|0,5,20);
  const nAy=Math.max(3,Math.round(nA*aspect));
  const cell=Math.min(pw/nA,ph/nAy);
  const hpk=pk/Math.max(M.Zw,1e-9);
  for(let i=0;i<nA;i++) for(let j=0;j<nAy;j++){
    const x=bx[0]+(bx[1]-bx[0])*(i+0.5)/nA, y=bx[2]+(bx[3]-bx[2])*(j+0.5)/nAy;
    const F=sampleXY(M,x,y,psi);
    if(!F.inside) continue;
    const cx=X(x), cy=Y(y);
    /* magnitudes clamped for the same reason as in the 3-D view: the coax TEM
       field diverges at the inner conductor and would draw off the panel */
    if(st.showE){
      const ex=F.Ex/pk, ey=F.Ey/pk, mg=Math.hypot(ex,ey);
      if(mg>0.05){ const m2=Math.min(mg,1), ux=ex/mg*m2, uy=ey/mg*m2;
        arrow(ctx,cx-ux*cell*0.45,cy+uy*cell*0.45,cx+ux*cell*0.45,cy-uy*cell*0.45,
              mix('#9ad84a','#eaffb0',m2),1.4); }
    }
    if(st.showH){
      const hx=F.Hx/(hpk||1), hy=F.Hy/(hpk||1), hm=Math.hypot(hx,hy);
      if(hm>0.05){ const m2=Math.min(hm,1), ux=hx/hm*m2, uy=hy/hm*m2;
        arrow(ctx,cx-ux*cell*0.38,cy+uy*cell*0.38,cx+ux*cell*0.38,cy-uy*cell*0.38,
              mix('#7a2f70','#e878dd',m2),1.1); }
    }
  }
  /* the longitudinal component, as dots and crosses */
  const lz=(md&&md.fam==='TM')?'E':'H';
  const lpk=peakScalar(M,lz)||1;
  if(md&&md.fam!=='TEM'&&M.geom!=='fibre'){
    const nD=Math.max(4,Math.round(nA*0.62)), nDy=Math.max(2,Math.round(nD*aspect));
    for(let i=0;i<nD;i++) for(let j=0;j<nDy;j++){
      const x=bx[0]+(bx[1]-bx[0])*(i+0.5)/nD, y=bx[2]+(bx[3]-bx[2])*(j+0.5)/nDy;
      const F=sampleXY(M,x,y,psi);
      if(!F.inside) continue;
      const s=(lz==='E')?F.Ez:F.Hz;
      const t=clamp(Math.abs(s)/lpk,0,1);
      if(t<0.14) continue;
      outOfPage(ctx,X(x),Y(y),2.2+3.4*t,
        lz==='E'?rgba('#b8ec4c',0.5+0.5*t):rgba('#cd35c4',0.5+0.5*t), s<0);
    }
  }

  /* wall currents — and the slotted-line fact */
  if(st.showJ&&M.geom==='rect'&&md&&md.fam==='TE'&&md.m===1&&md.n===0){
    const nJ=17;
    for(let i=1;i<nJ;i++){
      const x=M.a*i/nJ;
      const J=wallCurrentTE10(M.a,g.beta,md.kc,x,psi,'broad');
      const sc=26/Math.max(1,Math.abs(g.beta/md.kc));
      arrow(ctx,X(x),Y(bx[2])+12,X(x)+J.t*sc*0.5,Y(bx[2])+12,'#e8843a',1.2);
      const dot=Math.abs(J.z)*sc*0.16;
      if(dot>1.2) outOfPage(ctx,X(x),Y(bx[2])+25,Math.min(5,dot),'#e8843a',J.z<0);
    }
    ctx.strokeStyle=rgba('#e8843a',0.5); ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(X(M.a/2),Y(bx[2])+3); ctx.lineTo(X(M.a/2),Y(bx[3])-3);
    ctx.stroke(); ctx.setLineDash([]);
    /* below the panel, not above it: above, this ran straight through the
       "the transverse plane" title (the audit caught the collision) */
    caption(ctx,px,py+ph+74,
      'on this centreline H_z = 0, so the wall current is purely along the guide.\n'
      +'a thin slot cut here severs nothing and does not radiate — the slotted line.',
      pw,'#e8843a','10.5px -apple-system,sans-serif');
  }

  frame(ctx,box(px,py,pw,ph),'#1e222c');
  ctx.fillStyle='#8b93a6'; ctx.font='italic 13px Georgia,serif'; ctx.textAlign='center';
  ctx.fillText(plain('the transverse plane'),px+pw/2,py-14);
  ctx.font='10.5px "SF Mono",Menlo,monospace'; ctx.textAlign='left';
  ctx.fillStyle='#6b7284';
  const dimTxt=(M.geom==='rect')?('a = '+fmt(M.st.aMM,2)+' mm × b = '+fmt(M.st.bMM,2)+' mm')
    :(M.geom==='circ')?('a = '+fmt(M.st.radMM,2)+' mm radius')
    :(M.geom==='coax')?('a = '+fmt(M.st.coaxAMM,3)+' mm, b = '+fmt(M.st.coaxAMM*M.st.coaxBA,3)+' mm')
    :(M.geom==='plate')?('d = '+fmt(M.st.plateD,2)+' mm')
    :(M.geom==='cone')?('spherical cap, half-angle θ₀ = '+fmt(M.st.coneDeg,1)+'°')
    :('core radius '+fmt(M.st.fibAUM,2)+' µm; dashed ring at 2×core');
  ctx.fillText(plain(dimTxt),px,py+ph+42);
  ctx.fillText(plain(M.geom==='cone'
    ? 'FLATTENED: the radius of this disc is ρ = θ/θ₀, not a length'
    : 'drawn at true aspect ratio'),px,py+ph+56);

  /* ---------------- right: the cut along the guide ---------------- */
  /* Its vertical axis IS the transverse y of the panel on the left, so the two
     share a height and a top edge and read as one row.  Left at full panel
     height the longitudinal cut was twice the size of the mode pattern it is
     supposed to illustrate. */
  const R2=box(R.x,py,R.w,ph);
  if(M.geom==='cone'){ coneRadialPanel(ctx,R2,M); } else {
  const zSpan=g.prop?g.lamG*2:Math.min(6/Math.max(g.alphaEv,1e-9),(bx[1]-bx[0])*10);
  const rw=R2.w, rh=R2.h;
  const RX=(z)=>R2.x+z/zSpan*rw;
  const RY=(y)=>R2.y+rh-(y-bx[2])/(bx[3]-bx[2])*rh;

  const NZ=150, NY=Math.max(8,Math.round(NG*aspect));
  const midX=(M.geom==='rect')?M.a/2:0;
  for(let i=0;i<NZ;i++) for(let j=0;j<NY;j++){
    const z=zSpan*(i+0.5)/NZ, y=bx[2]+(bx[3]-bx[2])*(j+0.5)/NY;
    const ps=psi-(g.prop?g.beta*z:0);
    const dec=g.prop?1:Math.exp(-g.alphaEv*z);
    const F=sampleXY(M,midX,y,ps);
    if(!F.inside) continue;
    const t=clamp(Math.hypot(F.Ex,F.Ey)*dec/pk,0,1);
    if(t<0.012) continue;
    ctx.fillStyle=fieldCss(t);
    ctx.fillRect(RX(z)-rw/NZ/2-0.6,RY(y)-rh/NY/2-0.6,rw/NZ+1.2,rh/NY+1.2);
  }
  ctx.globalAlpha=1;
  frame(ctx,box(R2.x,R2.y,rw,rh),'#1e222c');
  ctx.fillStyle='#8b93a6'; ctx.font='italic 13px Georgia,serif'; ctx.textAlign='center';
  ctx.fillText(plain(g.prop?'along the guide — one λ_g is marked'
                            :'along the guide — evanescent decay'),R2.x+rw/2,R2.y-14);

  if(g.prop){
    /* the guide wavelength, marked on the drawing it belongs to */
    const z0=g.lamG*0.25, z1=z0+g.lamG;
    ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(RX(z0),R2.y+rh+10); ctx.lineTo(RX(z1),R2.y+rh+10); ctx.stroke();
    [z0,z1].forEach(z=>{ ctx.beginPath(); ctx.moveTo(RX(z),R2.y+rh+5);
      ctx.lineTo(RX(z),R2.y+rh+15); ctx.stroke(); });
    ctx.fillStyle='#e8843a'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText(plain('λ_g = '+fmtLen(g.lamG,2)),RX((z0+z1)/2),R2.y+rh+27);
    /* free-space wavelength alongside, to the same scale */
    const w0=g.lamG*0.25, w1=w0+g.lam0;
    ctx.strokeStyle='#5ac8e0';
    ctx.beginPath(); ctx.moveTo(RX(w0),R2.y+rh+38); ctx.lineTo(RX(w1),R2.y+rh+38); ctx.stroke();
    [w0,w1].forEach(z=>{ ctx.beginPath(); ctx.moveTo(RX(z),R2.y+rh+33);
      ctx.lineTo(RX(z),R2.y+rh+43); ctx.stroke(); });
    ctx.fillStyle='#5ac8e0';
    ctx.fillText(plain('λ_0 = '+fmtLen(g.lam0,2)),RX((w0+w1)/2),R2.y+rh+55);
    /* NOT "lambda_g > lambda_0 always" — that is a hollow-metal-guide fact and
       it is false for both of the other cases here.  In glass the mode travels
       at c/n_eff and lambda_g is SHORTER; in a vacuum-filled TEM line the two
       are equal exactly.  The drawn scale bars showed the fibre's lambda_g as
       the shorter of the two directly beneath a caption claiming the opposite. */
    ctx.fillStyle='#8b93a6'; ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left';
    const rel=(g.lamG>g.lam0*1.0001)?'long':(g.lamG<g.lam0*0.9999)?'short':'same';
    ctx.fillText(plain(
      rel==='long'
        ? 'λ_g > λ_0: the wave zig-zags between the walls, so it advances more slowly along z'
      : rel==='short'
        ? (M.geom==='fibre'
            ? 'λ_g < λ_0: the mode travels in glass at c/n_eff — nothing here is zig-zagging'
            : 'λ_g < λ_0: the fill slows the wave; a TEM mode has no cutoff and no zig-zag')
        : 'λ_g = λ_0 exactly: a TEM mode in vacuum has β = k, and no dispersion at all'),
      R2.x,R2.y+rh+72);
  }else{
    const dz=1/g.alphaEv;
    ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.4; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(RX(dz),R2.y); ctx.lineTo(RX(dz),R2.y+rh); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#e8843a'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText(plain('1/α = '+fmtLen(dz,2)+'  (one e-fold)'),RX(dz)+6,R2.y+16);
    caption(ctx,R2.x,R2.y+rh+14,
      'The pattern does not travel — it decays in place. There is no λ_g because '
      +'there is no propagation, and a lossless guide below cutoff absorbs nothing: '
      +'the power is all reflected.',rw,'#8b93a6','10.5px -apple-system,sans-serif');
  }

  }

  /* legend */
  ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left';
  let lx=pad, ly=H-18;
  [['E (transverse)','#b8ec4c'],['H (transverse)','#cd35c4'],
   [(lz==='E'?'E_z':'H_z')+' out of / into page','#5ac8e0'],
   ['wall current J_s','#e8843a']].forEach(([t,c])=>{
    ctx.fillStyle=c; ctx.fillRect(lx,ly-8,9,9);
    ctx.fillStyle='#8b93a6'; ctx.fillText(plain(t),lx+14,ly);
    lx+=ctx.measureText(plain(t)).width+40;
  });
  if(M.geom==='coax'&&md&&md.fam!=='TEM')
    caption(ctx,pad,py+ph+74,'The higher-order coax modes use the SOLID-guide radial shape here: '
      +'the cutoff frequency is exact (cross-product Bessel) but this picture is qualitative.',
      pw,'#e8843a','10.5px -apple-system,sans-serif');
}


/* clip helper — polyline() draws from axis limits and does NOT clip itself,
   and an unclipped reference curve running out of its box has been a defect
   in this collection before. */
function clipped(ctx,b,fn){
  ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip(); fn(); ctx.restore();
}

/* ================================================================== *
 *  VIEW C — dispersion                                                *
 *  The omega-beta diagram, with v_p as the SECANT slope and v_g as the *
 *  TANGENT slope drawn at the operating point.  That is the whole      *
 *  reason v_p can exceed c without anything travelling faster than c.  *
 * ================================================================== */
function drawDispersion(ctx,W,H,M,S){
  const g=M.gp, md=M.mode, cm=M.cmed;
  const pad=62, gap=44;
  const rightMax=topRight(W,pad), avail=rightMax-pad;
  const bw=(avail-gap)*0.60, bh=H-pad-104;
  const A=box(pad,pad-16,bw,bh);
  const Bx=box(pad+bw+gap,pad-16,avail-gap-bw,bh);

  /* --- panel A: omega-beta --- */
  const fcMax=Math.max(md?md.fc:0,M.f)*1.9;
  const fhi=Math.max(fcMax,M.f*1.6)/1e9;
  const betaMax=TAU*(fhi*1e9)/cm;
  const bhi=betaMax*1.05;

  axes(ctx,A,0,bhi,0,fhi,{xlab:'β  (rad/m)',ylab:'f  (GHz)',
    title:'the ω–β diagram',
    xfmt:t=>fmt(t,0), yfmt:t=>fmt(t,1)});

  /* the light line: f = c beta / 2pi.  Clipped, because it is drawn from
     axis limits rather than from data. */
  clipped(ctx,A,()=>{
    polyline(ctx,A,[0,bhi],[0,cm*bhi/TAU/1e9],0,bhi,0,fhi,'#5ac8e0',1.3,[6,4]);
  });

  /* every mode's hyperbola */
  const show=(M.modes||[]).filter(q=>q.fc/1e9<fhi*1.02).slice(0,14);
  const used=[];
  show.forEach(q=>{
    const xs=[],ys=[];
    for(let i=0;i<=180;i++){
      const be=bhi*i/180;
      xs.push(be); ys.push(cm*Math.sqrt(be*be+q.kc*q.kc)/TAU/1e9);
    }
    const isSel=md&&q.name===md.name;
    clipped(ctx,A,()=>polyline(ctx,A,xs,ys,0,bhi,0,fhi,
      isSel?'#b8ec4c':rgba('#5b6478',0.85),isSel?2.4:1.05));
    /* cutoff intercept */
    const Yc=A.y1-A.h*(q.fc/1e9)/fhi;
    if(Yc>A.y&&Yc<A.y1){
      ctx.fillStyle=isSel?'#b8ec4c':'#5b6478';
      ctx.font=isSel?'11px -apple-system,sans-serif':'10px -apple-system,sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      /* degenerate modes share a cutoff exactly, so their labels would be drawn
         one on top of the other — TE11 over TM11 in a circular guide.  Step the
         later one down until it clears. */
      let ly=Yc-6;
      while(used.some(v=>Math.abs(v-ly)<11)) ly+=11;
      used.push(ly);
      ctx.fillText(plain(q.name),A.x+5,ly);
      ctx.strokeStyle=rgba(isSel?'#b8ec4c':'#5b6478',0.35); ctx.lineWidth=1;
      ctx.setLineDash([2,3]); ctx.beginPath();
      ctx.moveTo(A.x,Yc); ctx.lineTo(A.x1,Yc); ctx.stroke(); ctx.setLineDash([]);
    }
  });

  /* the operating point, with the two slopes */
  if(g.prop&&md){
    const PX=A.x+A.w*g.beta/bhi, PY=A.y1-A.h*(M.f/1e9)/fhi;
    /* secant from the origin -> v_p */
    clipped(ctx,A,()=>{
      ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
      ctx.beginPath(); ctx.moveTo(A.x,A.y1); ctx.lineTo(PX+(PX-A.x)*0.35,PY-(A.y1-PY)*0.35);
      ctx.stroke(); ctx.setLineDash([]);
      /* tangent -> v_g */
      const slope=g.vg;                                   /* df/dbeta * 2pi   */
      const dB=bhi*0.22;
      const f2=(be)=>(M.f+slope*(be-g.beta)/TAU)/1e9;
      polyline(ctx,A,[g.beta-dB,g.beta+dB],[f2(g.beta-dB),f2(g.beta+dB)],
               0,bhi,0,fhi,'#cd35c4',1.9);
    });
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(PX,PY,4.2,0,TAU); ctx.fill();
    ctx.strokeStyle='#070b18'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillStyle='#e8843a'; ctx.fillText(plain('secant slope = v_p = '+sigf(g.vp/C0,3)+' c'),
      A.x+A.w*0.06,A.y+16);
    ctx.fillStyle='#cd35c4'; ctx.fillText(plain('tangent slope = v_g = '+sigf(g.vg/C0,3)+' c'),
      A.x+A.w*0.06,A.y+32);
    ctx.fillStyle='#5ac8e0'; ctx.fillText(plain('light line  f = cβ/2π'),A.x+A.w*0.06,A.y+48);
  }
  caption(ctx,A.x,A.y1+40,
    'Every mode is the same hyperbola shifted up by its own cutoff, and every one of them '
    +'approaches the light line from ABOVE. That is why v_p = ω/β is always greater than c '
    +'and v_g = dω/dβ always less — and why their product is exactly c².',
    A.w,'#8b93a6','11px -apple-system,sans-serif');

  /* --- panel B: velocities against f/fc --- */
  if(md&&md.fc>0){
    axes(ctx,Bx,1,6,0,3,{xlab:'f / f_c',ylab:'v / c',title:'the two velocities',
      xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    const xs=[],vp=[],vg=[],pr=[];
    for(let i=0;i<=240;i++){
      const r=1+5*i/240; xs.push(r);
      const s=Math.sqrt(Math.max(1-1/(r*r),0));
      vp.push(s>0?1/s:NaN); vg.push(s); pr.push(s>0?1:NaN);
    }
    clipped(ctx,Bx,()=>{
      polyline(ctx,Bx,xs,vp,1,6,0,3,'#e8843a',2);
      polyline(ctx,Bx,xs,vg,1,6,0,3,'#cd35c4',2);
      polyline(ctx,Bx,xs,pr,1,6,0,3,'#b8ec4c',1.6,[5,3]);
      polyline(ctx,Bx,[1,6],[1,1],1,6,0,3,'#5ac8e0',1,[3,3]);
      if(g.ratio>=1&&g.ratio<=6){
        const PX=Bx.x+Bx.w*(g.ratio-1)/5;
        ctx.strokeStyle=rgba('#fff',0.35); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(PX,Bx.y); ctx.lineTo(PX,Bx.y1); ctx.stroke();
      }
    });
    ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle='#e8843a'; ctx.fillText(plain('v_p/c'),Bx.x+Bx.w*0.42,Bx.y1-Bx.h*0.62);
    ctx.fillStyle='#cd35c4'; ctx.fillText(plain('v_g/c'),Bx.x+Bx.w*0.42,Bx.y1-Bx.h*0.24);
    ctx.fillStyle='#b8ec4c'; ctx.fillText(plain('v_p v_g / c² = 1'),Bx.x+Bx.w*0.30,Bx.y1-Bx.h*0.355);
    caption(ctx,Bx.x,Bx.y1+40,
      'At cutoff the energy stands still (v_g = 0) while the phase pattern sweeps '
      +'sideways infinitely fast. Far above cutoff both tend to c and the guide stops '
      +'mattering.',Bx.w,'#8b93a6','11px -apple-system,sans-serif');
  }else{
    axes(ctx,Bx,0,1,0,1,{title:'the two velocities'});
    caption(ctx,Bx.x+10,Bx.y+30,
      'A TEM mode has k_c = 0, so β = k at every frequency: v_p = v_g = c exactly, '
      +'with no dispersion at all. There is nothing to plot — that is the point of a '
      +'two-conductor line.',Bx.w-20,'#8b93a6','11.5px -apple-system,sans-serif');
  }
}

/* ================================================================== *
 *  VIEW D — the mode chart                                            *
 * ================================================================== */
function drawChart(ctx,W,H,M,S){
  const pad=58;
  const A=box(pad,pad-14,topRight(W,pad)-pad,(H-pad*2)*0.56);

  if(M.geom==='fibre'){ return drawFibreChart(ctx,W,H,M,A,pad); }
  if(M.geom==='cone'){  return drawConeChart(ctx,W,H,M,A,pad); }

  const modes=(M.modes||[]).filter(q=>isFinite(q.fc));
  if(!modes.length){ caption(ctx,pad,pad,'no modes',W-pad*2,'#8b93a6','12px sans-serif'); return; }
  const shown=modes.slice(0,16);
  const fhi=Math.max(shown[shown.length-1].fc,M.f)*1.08/1e9;

  axes(ctx,A,0,fhi,0,1,{xlab:'cutoff frequency  (GHz)',yticks:[],
    title:'the cutoff ladder — every mode of this guide, in order',
    xfmt:t=>fmt(t,t<10?1:0)});

  /* the single-mode window, shaded */
  if(M.single&&isFinite(M.single.hi)){
    const x0=A.x+A.w*(M.single.lo/1e9)/fhi, x1=A.x+A.w*(M.single.hi/1e9)/fhi;
    ctx.fillStyle=rgba('#b8ec4c',0.09); ctx.fillRect(x0,A.y,x1-x0,A.h);
    ctx.strokeStyle=rgba('#b8ec4c',0.4); ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(x0,A.y); ctx.lineTo(x0,A.y1);
    ctx.moveTo(x1,A.y); ctx.lineTo(x1,A.y1); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#b8ec4c'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText(plain('single-mode window  ×'+sigf(M.single.hi/M.single.lo,3)),
      clamp((x0+x1)/2,A.x+90,A.x1-90),A.y1-10);
  }
  /* one row per mode; degenerate pairs share a row and are marked */
  const rowH=Math.min(23,A.h/(shown.length+1));
  shown.forEach((q,i)=>{
    const y=A.y+12+rowH*(i+0.5);
    if(y>A.y1-4) return;
    const X=A.x+A.w*(q.fc/1e9)/fhi;
    const sel=M.mode&&q.name===M.mode.name;
    const deg=shown.filter(r=>Math.abs(r.fc-q.fc)<q.fc*1e-9).length>1;
    const col=sel?'#b8ec4c':(q.fam==='TM'?'#e8843a':q.fam==='TEM'?'#5ac8e0':'#7f8798');
    ctx.strokeStyle=rgba(col,sel?1:0.55); ctx.lineWidth=sel?2.6:1.4;
    ctx.beginPath(); ctx.moveTo(A.x,y); ctx.lineTo(X,y); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X,y,sel?4:2.6,0,TAU); ctx.fill();
    ctx.font=(sel?'600 11.5px':'11px')+' -apple-system,sans-serif';
    ctx.textBaseline='middle';
    const lab=plain(q.name+(deg?'  ‡':'')), freq=plain(fmt(q.fc/1e9,3)+' GHz');
    const wLab=ctx.measureText(lab).width;
    ctx.font='10px "SF Mono",Menlo,monospace';
    const wFreq=ctx.measureText(freq).width;
    /* a high-cutoff mode sits far right, and its trailing labels would run in
       under the floating readout — flip them to the left of the marker there */
    const flip=(y<roBottom())&&(X+18+wLab+wFreq>roLeft(W));
    ctx.textAlign=flip?'right':'left';
    ctx.font=(sel?'600 11.5px':'11px')+' -apple-system,sans-serif';
    ctx.fillText(lab,flip?X-8-wFreq-10:X+8,y);
    ctx.fillStyle='#6b7284'; ctx.font='10px "SF Mono",Menlo,monospace';
    ctx.fillText(freq,flip?X-8:X+8+wLab+10,y);
    ctx.textAlign='left';
  });
  /* where we are now */
  const FX=A.x+A.w*(M.f/1e9)/fhi;
  if(FX>A.x&&FX<A.x1){
    ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(FX,A.y); ctx.lineTo(FX,A.y1); ctx.stroke();
    /* inside the box, not above it: above, this collided with the panel title */
    ctx.fillStyle='#cd35c4'; ctx.font='11px -apple-system,sans-serif';
    const rightish=FX>A.x+A.w*0.6;
    ctx.textAlign=rightish?'right':'left'; ctx.textBaseline='bottom';
    ctx.fillText(plain('f = '+fmt(M.st.fGHz,2)+' GHz'),FX+(rightish?-6:6),A.y1-26);
  }

  /* --- lower half --- */
  const B2=box(pad,A.y1+58,W-pad*2,H-A.y1-58-pad+18);
  if(M.geom==='circ'){
    ctx.font='italic 13px Georgia,serif'; ctx.fillStyle='#aeb6c6'; ctx.textAlign='left';
    ctx.textBaseline='alphabetic';
    ctx.fillText(plain('the Bessel roots the rim selects'),B2.x,B2.y-8);
    const rows=[['TE_mn','k_c a = p′_mn','J′_m(p′) = 0'],['TM_mn','k_c a = p_mn','J_m(p) = 0']];
    ctx.font='11px "SF Mono",Menlo,monospace';
    let yy=B2.y+16;
    for(let m=0;m<=3;m++){
      let s="p'_"+m+"n = ";
      for(let n=1;n<=4;n++) s+=fmt(jpZero(m,n),6)+'  ';
      s+='   p_'+m+'n = ';
      for(let n=1;n<=4;n++) s+=fmt(jZero(m,n),6)+'  ';
      ctx.fillStyle=m===(M.mode?M.mode.m:0)?'#b8ec4c':'#8b93a6';
      ctx.fillText(plain(s),B2.x,yy); yy+=17;
    }
    caption(ctx,B2.x,yy+10,
      '‡ TE_0n and TM_1n are EXACTLY degenerate, and not by coincidence: J_0′ = −J_1 '
      +'identically, so the two families read their cutoffs off the same list of roots. '
      +'It is the reason the low-loss TE_01 mode is so hard to use — TM_11 rides along '
      +'at the same cutoff and any bend converts into it.',
      B2.w,'#8b93a6','11px -apple-system,sans-serif');
  } else if(M.geom==='rect'){
    ctx.font='italic 13px Georgia,serif'; ctx.fillStyle='#aeb6c6'; ctx.textAlign='left';
    ctx.textBaseline='alphabetic';
    ctx.fillText(plain('the EIA WR bands — dimensions are the standard, cutoffs are computed here'),
                 B2.x,B2.y-8);
    ctx.font='10.5px "SF Mono",Menlo,monospace';
    const colW=B2.w/7;
    WR_BANDS.forEach((b,i)=>{
      const cx=B2.x+colW*(i%7), cy=B2.y+16+Math.floor(i/7)*62;
      const aa=b.a*INCH, bb=b.b*INCH;
      const fc10=C0/2*Math.hypot(1/aa,0)/1e9, fc20=C0/aa/1e9;
      const sel=(M.st.band===b.n);
      ctx.fillStyle=sel?'#b8ec4c':'#8b93a6';
      ctx.fillText(plain(b.n+'  ('+b.band+')'),cx,cy);
      ctx.fillStyle=sel?'#cfd4de':'#6b7284';
      ctx.fillText(plain(fmt(b.a,3)+'″ × '+fmt(b.b,3)+'″'),cx,cy+14);
      ctx.fillText(plain('f_c '+fmt(fc10,3)+' GHz'),cx,cy+28);
      ctx.fillText(plain('use '+fmt(b.lo,2)+'–'+fmt(b.hi,2)),cx,cy+42);
    });
    caption(ctx,B2.x,B2.y+16+2*62+6,
      'WR-n is DEFINED as n/100 inch of broad wall, so a and b are exact and every f_c '
      +'above is derived from them. The recommended band is the stored quantity: it runs '
      +'roughly 1.25 f_c to 1.9 f_c, keeping clear of both the cutoff and TE_20.',
      B2.w,'#8b93a6','11px -apple-system,sans-serif');
  } else {
    caption(ctx,B2.x,B2.y,
      M.geom==='coax'
      ? 'A coax is TEM at every frequency down to DC — there is no lower cutoff at all, '
        +'because two conductors can hold a static field between them. Its band ends where '
        +'TE_11 first fits, and this file finds that from the exact cross-product Bessel '
        +'root rather than the usual k_c ≈ 2/(a+b), which is 2.0% low.'
      : 'Parallel plates carry a TEM mode (n = 0) with no cutoff, and a ladder of TE_n and '
        +'TM_n above f = nc/2d. The TE_n and TM_n of the same n are degenerate: the plates '
        +'cannot tell the two polarisations apart.',
      B2.w,'#8b93a6','11.5px -apple-system,sans-serif');
  }
}

/* the fibre's own chart: b(V) for each LP mode */
function drawFibreChart(ctx,W,H,M,A,pad){
  const F=M.fibre;
  axes(ctx,A,0,8,0,1,{xlab:'normalised frequency  V',ylab:'normalised index  b',
    title:'the LP mode chart — where each mode switches on',
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  const SET=[[0,1,'LP01 (HE11)','#b8ec4c'],[1,1,'LP11','#e8843a'],[2,1,'LP21','#cd35c4'],
             [0,2,'LP02','#5ac8e0'],[3,1,'LP31','#7f8798'],[1,2,'LP12','#8f7fd8']];
  SET.forEach(([l,mm,nm,col])=>{
    const xs=[],ys=[];
    for(let i=0;i<=200;i++){
      const V=8*i/200; if(V<0.02) continue;
      const u=fibreLPu(l,mm,V);
      if(u===null) continue;
      const w=Math.sqrt(Math.max(V*V-u*u,0));
      xs.push(V); ys.push(w*w/(V*V));
    }
    if(xs.length) clipped(ctx,A,()=>polyline(ctx,A,xs,ys,0,8,0,1,col,2));
    if(xs.length){
      ctx.fillStyle=col; ctx.font='10.5px -apple-system,sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      const lx=A.x+A.w*(xs[xs.length-1])/8, ly=A.y1-A.h*ys[ys.length-1];
      const wNm=ctx.measureText(plain(nm)).width;
      const cap=(ly<roBottom())?roLeft(W)-wNm-4:A.x1-46;
      ctx.fillText(plain(nm),Math.min(lx+5,cap),ly);
    }
  });
  /* the single-mode boundary */
  const xc=A.x+A.w*F.Vc/8;
  ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.3; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(xc,A.y); ctx.lineTo(xc,A.y1); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=rgba('#b8ec4c',0.08); ctx.fillRect(A.x,A.y,xc-A.x,A.h);
  ctx.fillStyle='#b8ec4c'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='center';
  ctx.fillText(plain('single mode'),(A.x+xc)/2,A.y+15);
  ctx.textAlign='left';
  ctx.fillText(plain('V_c = '+sigf(F.Vc,7)+' — the first zero of J_0'),xc+6,A.y+15);
  /* where we are */
  const vx=A.x+A.w*clamp(F.V,0,8)/8;
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(vx,A.y); ctx.lineTo(vx,A.y1); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(plain('V = '+sigf(F.V,4)),vx,A.y-4);

  const B2=box(pad,A.y1+56,W-pad*2,H-A.y1-56-pad+20);
  ctx.font='italic 13px Georgia,serif'; ctx.fillStyle='#aeb6c6'; ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.fillText(plain('exact vector solution against the weakly-guiding approximation'),B2.x,B2.y-6);
  ctx.font='11px "SF Mono",Menlo,monospace';
  const L=[
    'HE11  u  exact vector    '+sigf(F.uEx,10),
    'LP01  u  weak guidance   '+sigf(F.u,10),
    'difference               '+(Math.abs(F.uEx-F.u)).toExponential(3),
    '',
    'n_eff exact              '+sigf(F.neffEx,10),
    'n_eff LP                 '+sigf(F.neff,10),
    'difference               '+(Math.abs(F.neffEx-F.neff)).toExponential(3),
    'Δ = (n1²−n2²)/2n1²       '+F.delta.toExponential(3)
  ];
  L.forEach((s,i)=>{ ctx.fillStyle=i===2||i===6?'#e8843a':'#8b93a6';
    ctx.fillText(plain(s),B2.x,B2.y+14+i*15); });
  caption(ctx,B2.x+330,B2.y+14,
    'The LP modes are not modes. They are near-degenerate GROUPS of the true hybrid modes, '
    +'which separate only at order Δ — here 3.6×10⁻³. LP11 is really TE01, TM01 and HE21 '
    +'travelling at very slightly different speeds; over a long enough fibre they do come '
    +'apart, and that is polarisation-mode dispersion. HE11 is the exception with no '
    +'cutoff: it is guided at every V, which is what makes single-mode fibre possible.',
    B2.w-340,'#8b93a6','11.5px -apple-system,sans-serif');
}

/* the cone's chart: nu against half-angle, and the cylinder limit */
function drawConeChart(ctx,W,H,M,A,pad){
  axes(ctx,A,5,80,0,26,{xlab:'cone half-angle θ₀  (degrees)',ylab:'Legendre degree ν',
    title:'the conical eigenvalue — and how it becomes a cylinder',
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  const SET=[['TM',0,'TM01  P_ν(cos θ₀) = 0','#b8ec4c'],
             ['TE',1,'TE11  dP_ν¹/dθ = 0','#cd35c4'],
             ['TM',1,'TM11','#e8843a']];
  SET.forEach(([fam,m,nm,col])=>{
    const xs=[],ys=[];
    for(let d=5;d<=80;d+=1){
      const nu=coneNu(fam,m,d*DEG);
      if(isFinite(nu)){ xs.push(d); ys.push(nu); }
    }
    clipped(ctx,A,()=>polyline(ctx,A,xs,ys,5,80,0,26,col,2));
    ctx.fillStyle=col; ctx.font='10.5px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    const i0=Math.max(0,xs.indexOf(24));
    ctx.fillText(plain(nm),A.x+A.w*(xs[i0]-5)/75+6,A.y1-A.h*ys[i0]/26-9);
  });
  /* the operating angle */
  const dx=A.x+A.w*(clamp(M.st.coneDeg,5,80)-5)/75;
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(dx,A.y); ctx.lineTo(dx,A.y1); ctx.stroke();
  /* the exact point nu = 2 at 45 degrees */
  const ex=A.x+A.w*(45-5)/75, ey=A.y1-A.h*2/26;
  ctx.fillStyle='#5ac8e0'; ctx.beginPath(); ctx.arc(ex,ey,4,0,TAU); ctx.fill();
  ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain('ν = 2 EXACTLY at θ₀ = 45°'),ex+7,ey-3);

  const B2=box(pad,A.y1+56,W-pad*2,H-A.y1-56-pad+20);
  caption(ctx,B2.x,B2.y,
    'At θ₀ = 45° the TE11 root is exactly 2, because P₂¹(cos θ) ∝ sin 2θ and its θ-derivative '
    +'∝ cos 2θ vanishes at 45°. It is the only integer in the family, and it is a check, not '
    +'a coincidence.\n\n'
    +'As the cone narrows, ν·θ₀ tends to 2.4048 — the first zero of J₀ — because a thin cone '
    +'is a cylinder and P_ν(cos θ) becomes J₀(νθ). At θ₀ = 5° that product is already 2.361, '
    +'and at 1° it is 2.396. The conical guide and the circular guide are the same problem '
    +'in different coordinates.',
    B2.w*0.62,'#8b93a6','11.5px -apple-system,sans-serif');
  ctx.font='11px "SF Mono",Menlo,monospace'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const cx=B2.x+B2.w*0.66;
  ctx.fillStyle='#aeb6c6'; ctx.fillText(plain('θ₀      ν(TM01)     ν·θ₀ (rad)'),cx,B2.y+2);
  [20,10,5,2,1].forEach((d,i)=>{
    const nu=coneNu('TM',0,d*DEG);
    ctx.fillStyle='#8b93a6';
    ctx.fillText(plain(fmt(d,0).padStart(3)+'°   '+fmt(nu,6).padStart(10)+'   '
      +fmt(nu*d*DEG,6)),cx,B2.y+20+i*16);
  });
  ctx.fillStyle='#b8ec4c';
  ctx.fillText(plain('limit           →        2.404826'),cx,B2.y+20+5*16);
}


/* ================================================================== *
 *  VIEW E — attenuation                                               *
 * ================================================================== */
function drawAtten(ctx,W,H,M,S){
  const pad=62, gap=52;
  const rightMax=topRight(W,pad), avail=rightMax-pad;
  const bw=(avail-gap)*0.58;
  /* 58 px of headroom, not 30: the five-line "why 50 ohm" caption under the
     right panel was running off the bottom of the canvas. */
  const A=box(pad,pad-14,bw,H-pad*2-58);
  const B2=box(pad+bw+gap,pad-14,avail-gap-bw,H-pad*2-58);
  const sigma=M.sigma, cm=M.cmed, em=M.etamed;

  /* --- panel A: alpha against frequency, log-log ---
     A TEM line has NO cutoff, so there is no f_c to scale the axis from and
     using the 0.1 GHz floor gave a coax a 0.1-4 GHz sweep that stopped three
     decades short of anything interesting.  For those, scale from the first
     HIGHER-ORDER cutoff — the frequency at which the line stops being a line. */
  const modes=M.modes||[];
  const fcLow=modes.length?modes[0].fc:0;
  const fcHigh=(modes.find(q=>q.fc>0)||{}).fc||0;
  const isTEM=(fcLow<=0);
  const fc0=isTEM?(fcHigh||1e10):fcLow;
  const flo=isTEM?Math.log10(fc0/300/1e9):Math.log10(Math.max(fc0*0.9,1e8)/1e9);
  const fhi=isTEM?Math.log10(fc0*1.15/1e9):Math.log10(fc0*40/1e9);
  const CURVES=[];
  if(M.geom==='rect'){
    CURVES.push({n:'TE10',c:'#b8ec4c',f:(fq)=>alphaRectTE10(fq,M.a,M.b,sigma,cm,em)});
  } else if(M.geom==='circ'){
    CURVES.push({n:'TE01  — falls for ever',c:'#b8ec4c',
      f:(fq)=>alphaCircTE(fq,0,1,M.rad,sigma,cm,em)});
    CURVES.push({n:'TE11',c:'#5ac8e0',f:(fq)=>alphaCircTE(fq,1,1,M.rad,sigma,cm,em)});
    CURVES.push({n:'TM01',c:'#e8843a',f:(fq)=>alphaCircTM(fq,0,1,M.rad,sigma,cm,em)});
  } else if(M.geom==='coax'){
    CURVES.push({n:'TEM',c:'#b8ec4c',f:(fq)=>alphaCoax(fq,M.ai,M.bo,sigma,em)});
  } else if(M.geom==='plate'){
    CURVES.push({n:'TEM',c:'#b8ec4c',f:(fq)=>alphaPlateTEM(fq,M.pd,sigma,em)});
  }
  if(M.tand>0) CURVES.push({n:'dielectric  ('+M.fillName+')',c:'#8f7fd8',
    f:(fq)=>{ const g2=guideProps(fq,M.mode?M.mode.fc:0,cm,em);
              return g2.prop?alphaDielectric(fq,M.tand,cm,g2.beta):Infinity; }});

  /* Two geometries have no conductor-loss model here, and an empty plot would
     imply they were lossless.  Say what is missing instead of drawing nothing. */
  if(M.geom==='cone'||M.geom==='fibre'){
    const b=box(pad,pad+10,W-pad*2,H-pad*2);
    ctx.fillStyle='#aeb6c6'; ctx.font='italic 15px Georgia,serif';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText(plain(M.geom==='cone' ? 'a cone’s loss is not modelled here'
                                       : 'a fibre’s loss is not modelled here'),b.x,b.y+18);
    caption(ctx,b.x,b.y+40, M.geom==='cone'
      ? 'The perturbation formula this view is built on assumes a guide of CONSTANT '
        +'cross-section, so that a single α in nepers per metre means anything. A cone '
        +'has neither: its wall area grows as r² while the power spreads over the same '
        +'r², and the honest statement is a loss per decade of radius, not per metre. '
        +'It is left out rather than faked.\n\n'
        +'What IS exact for the cone is in "the cone": the Legendre degree ν, the '
        +'turning radius, and the biconical TEM impedance.'
      : 'Fibre loss is not a conductor loss at all — there is no conductor. It is '
        +'Rayleigh scattering off frozen-in density fluctuations (falling as λ⁻⁴), '
        +'the OH⁻ overtone absorptions, and the infrared multiphonon edge, which together '
        +'put the famous minimum near 1550 nm at about 0.2 dB per KILOMETRE. None of those '
        +'mechanisms is in this file, and inventing a curve for them would be worse than '
        +'saying so.\n\n'
        +'What IS exact for the fibre is in "the mode chart": the LP ladder, the exact '
        +'vector HE₁₁ root, and the size of the weak-guidance error.',
      Math.min(b.w*0.72,760),'#8b93a6','12px -apple-system,sans-serif');
    return;
  }

  /* sample first, then fit the axis to the DATA — not the other way round */
  let ylo=1e30, yhi=-1e30;
  CURVES.forEach(cv=>{
    cv.xs=[]; cv.ys=[];
    for(let i=0;i<=260;i++){
      const lf=flo+(fhi-flo)*i/260, fq=Math.pow(10,lf)*1e9;
      const a=cv.f(fq)*NP2DB;
      if(!isFinite(a)||a<=0) continue;
      const ly=Math.log10(a);
      cv.xs.push(lf); cv.ys.push(ly);
      if(ly<ylo) ylo=ly; if(ly>yhi) yhi=ly;
    }
  });
  if(!isFinite(ylo)){ ylo=-3; yhi=1; }
  ylo=Math.floor(ylo-0.25); yhi=Math.ceil(yhi+0.25);
  if(yhi-ylo>7) ylo=yhi-7;

  axes(ctx,A,flo,fhi,ylo,yhi,{
    xlab:'frequency  (GHz)', ylab:'attenuation  (dB/m)',
    title:'conductor loss — '+M.metalName,
    xfmt:t=>{const v=Math.pow(10,t); return v>=10?fmt(v,0):v>=1?fmt(v,1):fmt(v,2);},
    yfmt:t=>{const v=Math.pow(10,t); return v>=1?fmt(v,0):v>=0.01?fmt(v,2):v.toExponential(0);}});

  CURVES.forEach(cv=>{
    clipped(ctx,A,()=>polyline(ctx,A,cv.xs,cv.ys,flo,fhi,ylo,yhi,cv.c,2.1));
    if(cv.xs.length){
      const k=Math.round(cv.xs.length*0.72);
      ctx.fillStyle=cv.c; ctx.font='11px -apple-system,sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      const lx=A.x+A.w*(cv.xs[k]-flo)/(fhi-flo), ly=A.y1-A.h*(cv.ys[k]-ylo)/(yhi-ylo);
      if(lx<A.x1-70&&ly>A.y+10) ctx.fillText(plain(cv.n),lx+4,ly-4);
    }
  });
  /* the cutoff wall, and the operating point */
  if(fc0>1e8){
    const cx=A.x+A.w*(Math.log10(fc0/1e9)-flo)/(fhi-flo);
    if(cx>A.x&&cx<A.x1){
      ctx.strokeStyle=rgba('#e8843a',0.55); ctx.lineWidth=1.2; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx,A.y); ctx.lineTo(cx,A.y1); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#e8843a'; ctx.font='10.5px -apple-system,sans-serif';
      ctx.textBaseline='top';
      const nearRight=cx>A.x+A.w*0.62;
      ctx.textAlign=nearRight?'right':'left';
      ctx.fillText(plain(isTEM
        ? 'TE11 fits here — the line stops being a line'
        : 'f_c — the model diverges here'),cx+(nearRight?-5:4),A.y+4);
    }
  }
  const opx=A.x+A.w*(Math.log10(M.st.fGHz)-flo)/(fhi-flo);
  if(opx>A.x&&opx<A.x1&&M.loss.modelled&&isFinite(M.loss.totDB)&&M.loss.totDB>0){
    const opy=A.y1-A.h*(Math.log10(M.loss.totDB)-ylo)/(yhi-ylo);
    ctx.strokeStyle=rgba('#fff',0.3); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(opx,A.y); ctx.lineTo(opx,A.y1); ctx.stroke();
    if(opy>A.y&&opy<A.y1){
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(opx,opy,4,0,TAU); ctx.fill();
      ctx.strokeStyle='#070b18'; ctx.lineWidth=1.3; ctx.stroke();
    }
  }
  caption(ctx,A.x,A.y1+42,
    M.geom==='circ'
    ? 'TE_01 is the only mode in this collection whose loss falls without limit: with m = 0 '
      +'the m²/(p′²−m²) term vanishes and α ∝ f^(−3/2) for ever. It was the basis of a '
      +'transcontinental millimetre-wave waveguide programme — killed by the fact that '
      +'TM_11 shares its cutoff exactly and every bend feeds it.'
    : 'Perturbation theory: take the LOSSLESS field, integrate R_s|J_s|²/2 over the wall, '
      +'divide by twice the power. It diverges at cutoff because the assumed field does; '
      +'a real guide does not. R_s ∝ √f is why loss grows with frequency at all.',
    A.w,'#8b93a6','11px -apple-system,sans-serif');

  /* --- panel B: the geometry-specific optimisation --- */
  if(M.geom==='coax'){
    const CX=M.coax;
    axes(ctx,B2,1.2,8,0,2.2,{xlab:'b / a',ylab:'relative to the minimum',
      title:'why 50 Ω',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    const xs=[],al=[],pw=[];
    for(let i=0;i<=240;i++){
      const x=1.2+(8-1.2)*i/240; xs.push(x);
      al.push(((1+x)/Math.log(x))/((1+CX.baMinLoss)/Math.log(CX.baMinLoss)));
      pw.push((Math.log(x)/(x*x))/(Math.log(CX.baMaxPower)/(CX.baMaxPower*CX.baMaxPower)));
    }
    clipped(ctx,B2,()=>{
      polyline(ctx,B2,xs,al,1.2,8,0,2.2,'#e8843a',2.1);
      polyline(ctx,B2,xs,pw,1.2,8,0,2.2,'#5ac8e0',2.1);
      [[CX.baMinLoss,'#e8843a'],[CX.baMaxPower,'#5ac8e0'],[CX.ba,'#fff']].forEach(([v,c])=>{
        const X=B2.x+B2.w*(v-1.2)/6.8;
        ctx.strokeStyle=rgba(c,0.6); ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(X,B2.y); ctx.lineTo(X,B2.y1); ctx.stroke();
        ctx.setLineDash([]);
      });
    });
    /* bottom-left, not top-left: the loss curve rises steeply on the left and
       ran straight through all three of these */
    ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillStyle='#e8843a';
    ctx.fillText(plain('loss  (min at b/a = '+fmt(CX.baMinLoss,4)+')'),B2.x+8,B2.y1-40);
    ctx.fillStyle='#5ac8e0';
    ctx.fillText(plain('1/power  (max at b/a = √e = '+fmt(CX.baMaxPower,4)+')'),B2.x+8,B2.y1-25);
    ctx.fillStyle='#fff';
    ctx.fillText(plain('you are at b/a = '+fmt(CX.ba,3)+'  →  '+fmt(CX.Z0,1)+' Ω'),B2.x+8,B2.y1-10);
    caption(ctx,B2.x,B2.y1+42,
      'Minimum loss wants b/a = '+fmt(CX.baMinLoss,4)+', i.e. '+fmt(CX.Z0MinLoss,1)+' Ω. '
      +'Maximum power at a fixed breakdown field wants b/a = √e, i.e. '+fmt(CX.Z0MaxPower,1)+' Ω. '
      +'You cannot have both, and the geometric mean of the two is '
      +fmt(CX.Z0Compromise,1)+' Ω. That is where 50 Ω comes from — it is a compromise '
      +'nobody derived, halfway between two things that were.',
      B2.w,'#8b93a6','11px -apple-system,sans-serif');
  } else {
    /* alpha against f/fc, showing the minimum */
    axes(ctx,B2,1,10,0,3,{xlab:'f / f_c',ylab:'α / α(min)',
      title:'the loss minimum',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    const base=CURVES.length?CURVES[0]:null;
    if(base&&fc0>1e8){
      const xs=[],ys=[]; let amin=Infinity,rmin=NaN;
      for(let i=0;i<=300;i++){
        const r=1+9*i/300, a=base.f(r*fc0);
        if(!isFinite(a)) continue;
        xs.push(r); ys.push(a);
        if(a<amin){ amin=a; rmin=r; }
      }
      const yn=ys.map(v=>v/amin);
      clipped(ctx,B2,()=>{
        polyline(ctx,B2,xs,yn,1,10,0,3,'#b8ec4c',2.1);
        const X=B2.x+B2.w*(rmin-1)/9;
        ctx.strokeStyle=rgba('#e8843a',0.6); ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(X,B2.y); ctx.lineTo(X,B2.y1); ctx.stroke(); ctx.setLineDash([]);
        if(M.gp.ratio>=1&&M.gp.ratio<=10){
          const XX=B2.x+B2.w*(M.gp.ratio-1)/9;
          ctx.strokeStyle=rgba('#fff',0.35); ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(XX,B2.y); ctx.lineTo(XX,B2.y1); ctx.stroke();
        }
      });
      ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillStyle='#e8843a';
      ctx.fillText(plain('minimum at f = '+fmt(rmin,3)+' f_c'),B2.x+6,B2.y+6);
      ctx.fillStyle='#8b93a6';
      ctx.fillText(plain('= '+fmt(rmin*fc0/1e9,3)+' GHz'),B2.x+6,B2.y+21);
      caption(ctx,B2.x,B2.y1+42,
        'Two effects fight: R_s grows as √f, but near cutoff the field is squeezed against '
        +'the walls and the power flow is small, so α blows up. The minimum sits where they '
        +'balance — well above the top of the recommended band, which is set by TE_20, not '
        +'by loss.',B2.w,'#8b93a6','11px -apple-system,sans-serif');
    }
  }
}

/* ================================================================== *
 *  VIEW F — the cone                                                  *
 * ================================================================== */
function drawCone(ctx,W,H,M,S){
  const pad=54;
  const th0=(M.geom==='cone')?M.th0:30*DEG;
  const nu=(M.geom==='cone')?M.cone.nu:coneNu('TM',0,th0);
  const nuTM=(M.geom==='cone')?M.cone.nuTM:nu;
  const fam=(M.geom==='cone')?M.fam:'TM';
  const mOrd=(fam==='TE')?1:0;
  /* top row clears the readout; bottom row is below it and may use full width */
  const rightMax=topRight(W,pad), availW=rightMax-pad;
  const topH=(H-pad*2)*0.46;
  const A=box(pad,pad-16,availW*0.44,topH);
  const B2=box(pad+availW*0.52,pad-16,availW*0.48,topH);

  /* --- A: the cone in section, with the cutoff radius --- */
  const cx=A.x+A.w*0.12, cy=A.y+A.h*0.5;
  /* The fan spans +-theta0, so its HEIGHT is 2 R sin(theta0): sizing off a flat
     0.46 of the panel height made a 30-degree cone a third of the size it could
     be.  Scale by sin(theta0) so a narrow cone gets to be long. */
  const RR=Math.min(A.w*0.80,A.h*0.46/Math.max(Math.sin(th0),0.18));
  ctx.strokeStyle='#39404f'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+RR*Math.cos(th0),cy-RR*Math.sin(th0));
  ctx.moveTo(cx,cy); ctx.lineTo(cx+RR*Math.cos(th0),cy+RR*Math.sin(th0)); ctx.stroke();
  /* the angular mode profile, drawn as a filled fan */
  const NN=90;
  for(let i=0;i<NN;i++){
    const t0=th0*i/NN, t1=th0*(i+1)/NN;
    const p=legendreP(nu,mOrd,Math.cos((t0+t1)/2));
    const pmax=Math.max(1e-12,Math.abs(legendreP(nu,mOrd,Math.cos(th0*0.001))),
                        Math.abs(legendreP(nu,mOrd,Math.cos(th0*0.5))));
    const t=clamp(p/pmax,-1,1);
    [1,-1].forEach(sgn=>{
      ctx.fillStyle=signedRamp(t); ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,RR*0.92,sgn*t0,sgn*t1,sgn<0);
      ctx.closePath(); ctx.fill();
    });
  }
  ctx.globalAlpha=1;
  /* the cutoff radius */
  if(M.geom==='cone'){
    const rc=M.cone.rCut;
    const sMax=Math.max(M.cone.turn*2.4,6);
    const rDraw=RR*0.92*(M.cone.turn/sMax);
    ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.arc(cx,cy,rDraw,-th0,th0); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#e8843a'; ctx.font='10.5px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    /* above the fan, not across it — inside, it sat on the shaded wedge */
    ctx.fillText(plain('r_cut = '+fmtLen(rc,2)),
                 cx+rDraw*Math.cos(th0)+7,cy-rDraw*Math.sin(th0)-5);
    caption(ctx,A.x,A.y1+8,
      'Inside the dashed arc the mode is evanescent; outside it propagates. The radial '
      +'scale is kr, drawn to '+fmt(sMax,1)+'. The colour is the angular profile '
      +'P_ν'+(mOrd?'¹':'')+'(cos θ) — green positive, magenta negative.',
      A.w,'#8b93a6','10.5px -apple-system,sans-serif');
  }
  ctx.fillStyle='#8b93a6'; ctx.font='italic 13px Georgia,serif';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(plain('the cone, in section'),A.x,A.y-6);
  ctx.font='10.5px "SF Mono",Menlo,monospace'; ctx.fillStyle='#6b7284';
  ctx.fillText(plain('θ₀ = '+fmt(th0*RAD,1)+'°   ν = '+sigf(nu,7)),A.x,A.y+A.h+0);

  /* --- B: the radial function and its turning point --- */
  const sMax=Math.max(Math.sqrt(nu*(nu+1))*2.4,6);
  const R=coneRadial(nu,sMax,700);
  let umax=1e-30;
  for(let i=0;i<R.u.length;i++) if(isFinite(R.u[i])) umax=Math.max(umax,Math.abs(R.u[i]));
  const xs=[],ys=[];
  for(let i=0;i<R.s.length;i++){ xs.push(R.s[i]); ys.push(R.u[i]/umax); }
  axes(ctx,B2,0,sMax,-1.15,1.15,{xlab:'kr',ylab:'u = r·(radial function)',
    title:'the radial equation turns over at kr = √(ν(ν+1))',
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  clipped(ctx,B2,()=>{
    polyline(ctx,B2,[0,sMax],[0,0],0,sMax,-1.15,1.15,'#2a2f3d',1);
    polyline(ctx,B2,xs,ys,0,sMax,-1.15,1.15,'#b8ec4c',2.2);
    const TX=B2.x+B2.w*R.turn/sMax;
    ctx.fillStyle=rgba('#e8843a',0.10); ctx.fillRect(B2.x,B2.y,TX-B2.x,B2.h);
    ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(TX,B2.y); ctx.lineTo(TX,B2.y1); ctx.stroke(); ctx.setLineDash([]);
  });
  ctx.fillStyle='#e8843a'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(plain('evanescent'),B2.x+6,B2.y+6);
  ctx.fillText(plain('kr = '+sigf(R.turn,5)),B2.x+B2.w*R.turn/sMax+5,B2.y+6);
  ctx.fillStyle='#b8ec4c'; ctx.textAlign='right';
  ctx.fillText(plain('propagating'),B2.x1-8,B2.y+6);

  /* --- lower: the biconical TEM and the linear taper --- */
  /* The bottom row starts below the READOUT (not merely below panel A), so its
     top-left annotations do not land underneath the floating overlay; and it
     keeps 96 px of headroom, or the four-line captions leave the canvas. */
  const botY=Math.max(A.y1+62,roBottom()+8), botH=H-botY-96;
  const C=box(pad,botY,(W-pad*2)*0.46,botH);
  const D=box(pad+(W-pad*2)*0.52,botY,(W-pad*2)*0.48,botH);

  /* biconical Z0 against half-angle */
  axes(ctx,C,2,80,0,600,{xlab:'half-angle θ₀  (degrees)',ylab:'Z₀  (Ω)',
    title:'the biconical line — an exact spherical TEM',
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  {
    const xs2=[],y1=[],y2=[];
    for(let d=2;d<=80;d+=0.5){
      xs2.push(d);
      y1.push(z0Biconical(d*DEG,M.etamed));
      y2.push(z0ConeGround(d*DEG,M.etamed));
    }
    clipped(ctx,C,()=>{
      polyline(ctx,C,xs2,y1,2,80,0,600,'#b8ec4c',2.1);
      polyline(ctx,C,xs2,y2,2,80,0,600,'#5ac8e0',2.1);
      const X=C.x+C.w*(clamp(th0*RAD,2,80)-2)/78;
      ctx.strokeStyle=rgba('#fff',0.35); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(X,C.y); ctx.lineTo(X,C.y1); ctx.stroke();
    });
    ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='#b8ec4c'; ctx.fillText(plain('two cones  (η/π) ln cot(θ₀/2)'),C.x+6,C.y+6);
    ctx.fillStyle='#5ac8e0'; ctx.fillText(plain('cone over ground  — half of it'),C.x+6,C.y+21);
    caption(ctx,C.x,C.y1+34,
      'ν = 0 for this one, so P₀ = 1 and there is no turning point at all: the biconical '
      +'TEM propagates at c from the apex outward, at every frequency. It is the only '
      +'truly frequency-independent transmission line in this file, and it needs TWO '
      +'conductors to exist.',C.w,'#8b93a6','11px -apple-system,sans-serif');
  }

  /* the linear taper and its local cutoff */
  {
    const T=M.taper;
    const zs=[],fcs=[];
    for(let i=0;i<=200;i++){
      const z=T.L*i/200, aw=T.a1+(T.a2-T.a1)*i/200;
      zs.push(z*1e3); fcs.push(M.cmed/(2*aw)/1e9);
    }
    const ylo2=0, yhi2=Math.max(T.fc2,T.fc1,M.f)*1.15/1e9;
    axes(ctx,D,0,T.L*1e3,ylo2,yhi2,{xlab:'distance along the taper  (mm)',
      ylab:'local cutoff  (GHz)',title:'a tapered guide — where it turns the wave back',
      xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    clipped(ctx,D,()=>{
      polyline(ctx,D,zs,fcs,0,T.L*1e3,ylo2,yhi2,'#b8ec4c',2.2);
      polyline(ctx,D,[0,T.L*1e3],[M.st.fGHz,M.st.fGHz],0,T.L*1e3,ylo2,yhi2,'#cd35c4',1.8,[6,4]);
      if(T.cutsOff){
        const X=D.x+D.w*(T.zTurn/T.L);
        ctx.fillStyle=rgba('#e8843a',0.12); ctx.fillRect(X,D.y,D.x1-X,D.h);
        ctx.strokeStyle='#e8843a'; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(X,D.y); ctx.lineTo(X,D.y1); ctx.stroke(); ctx.setLineDash([]);
      }
    });
    ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='#cd35c4'; ctx.fillText(plain('operating f = '+fmt(M.st.fGHz,2)+' GHz'),D.x+6,D.y+6);
    if(T.cutsOff){
      ctx.fillStyle='#e8843a';
      ctx.fillText(plain('turns back at '+fmt(T.zTurn*1e3,1)+' mm'),
        D.x+D.w*(T.zTurn/T.L)+5,D.y+21);
    }else{
      ctx.fillStyle='#b8ec4c';
      ctx.fillText(plain('propagates all the way through'),D.x+6,D.y+21);
    }
    caption(ctx,D.x,D.y1+34,
      'LOCAL-CUTOFF (adiabatic) approximation only: the taper is treated as a stack of '
      +'uniform guides, each with its own f_c. That is good when the taper is long compared '
      +'with λ_g and wrong when it is not — a real short taper couples modes, and this file '
      +'does not solve for that.',D.w,'#8b93a6','11px -apple-system,sans-serif');
  }
}


/* ================================================================== *
 *  dispatch                                                           *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='guide')      return drawGuide(ctx,W,H,M,S);
  if(v==='xsec')       return drawXsec(ctx,W,H,M,S);
  if(v==='disp')       return drawDispersion(ctx,W,H,M,S);
  if(v==='chart')      return drawChart(ctx,W,H,M,S);
  if(v==='atten')      return drawAtten(ctx,W,H,M,S);
  if(v==='cone')       return drawCone(ctx,W,H,M,S);
  return drawGuide(ctx,W,H,M,S);
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.62,0.34,4.4,[1.6,0,0]);
  let M=null, t=0;
  const S={
    st,cam,
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    /* The animation phase.  Frozen when not animating, so every capture and
       every headless drive is reproducible.  The frozen value is 0.7 rad and
       NOT pi/2: at pi/2 the cos(psi) factor is zero, which is exactly the
       longitudinal component, and every still would lose the E_z / H_z dots
       that half the physics lives in.  0.7 rad shows both. */
    phase(){ return st.anim? t*TAU*0.55 : 0.7; },
    /* Fit by MEASURING, not by guessing a distance.  The drawn object is a box
       Lw long and about one unit across, but how much of the frame it covers
       depends on the camera angle, so a fixed dist left the guide filling ~40%
       of the canvas at some settings and overflowing at others.  Project the
       eight corners at a trial distance, measure the pixel extent, and scale. */
    fit(){
      const m=S.model();
      const Lw=guideDrawLength(m);          /* the SAME length drawGuide draws */
      let halfY=0.5, halfZ=0.5;
      if(m.geom==='cone'){
        /* 0.78 because the cone mouth is a CIRCLE and the fitted box is square:
           the corner-to-corner diagonal overestimates its projected extent by
           up to sqrt(2), which left the cone at two-thirds of the size it could
           have been. */
        halfY=halfZ=Lw*Math.sin(m.th0)*1.05*0.78;
      }else{
        const bx=xsecBounds(m), SC=1/Math.max(bx[1]-bx[0],1e-12);
        halfZ=Math.max((bx[3]-bx[2])*SC/2,0.06);
      }
      /* A small margin for the field arrows, which are centred on their sample
         points and so overhang a wall by only half their length.  0.32 here was
         inflating the fitted box until the guide itself filled barely half the
         frame. */
      halfY+=0.12; halfZ+=0.12;
      const base=[(m.geom==='cone')?Lw*0.46:Lw/2,0,0];
      cam.target=base.slice();
      const corners=[];
      for(const sx of [0,Lw]) for(const sy of [-halfY,halfY]) for(const sz of [-halfZ,halfZ])
        corners.push([sx,sy,sz]);
      /* measure the projected box at the current distance; null if any corner
         falls behind the eye */
      const meas=()=>{
        const B=camBasis(cam);
        let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,zs=0;
        for(const p of corners){
          const q=project(cam,B,p);
          if(!q) return null;
          x0=Math.min(x0,q.x); x1=Math.max(x1,q.x);
          y0=Math.min(y0,q.y); y1=Math.max(y1,q.y); zs+=q.z;
        }
        return {x0,x1,y0,y1,z:zs/corners.length,B};
      };
      /* Distance, by BISECTION.  Multiplying the distance by the fill error
         does not converge: too close makes meas() null, the step backs off, and
         the loop oscillates and exits at whatever it happened to be holding —
         which left a coax the size of a postage stamp.  Screen size falls
         monotonically with distance, so bisect on it instead. */
      const fitDist=()=>{
        let lo=0.6, hi=24;
        for(let i=0;i<14;i++){ cam.dist=hi; if(meas()) break; hi*=2; }
        for(let i=0;i<44;i++){
          const mid=Math.sqrt(lo*hi);
          cam.dist=mid;
          const r=meas();
          if(!r){ lo=mid; continue; }            /* too close: raise the floor */
          const f=Math.max((r.x1-r.x0)/(cam.W*0.88),(r.y1-r.y0)/(cam.H*0.84));
          if(f>1) lo=mid; else hi=mid;
          if(Math.abs(f-1)<0.01){ hi=mid; break; }
        }
        cam.dist=clamp(hi,0.6,400);
      };
      /* The camera must look AT the guide.  Without this the centring search
         walked a coax's target out to x = 8.7 on an object only 6 long, which
         is "centred" on a metric and useless as a picture. */
      const clampTarget=()=>{
        cam.target=[clamp(cam.target[0],0,Lw),
                    clamp(cam.target[1],-halfY,halfY),
                    clamp(cam.target[2],-halfZ,halfZ)];
      };
      fitDist();
      /* 2. centre it, by SEARCH rather than by a derived sign.  Translating the
         camera moves the image, but the sign that does it depends on the basis
         convention, and getting it backwards drove a coax's target out to
         x = 8.7 on a guide only 6 long — off-screen and 16% of frame.  So try
         the step both ways, keep whichever actually reduces the offset, damp,
         and never keep a target that loses the object. */
      const offOf=(r)=>Math.abs((r.x0+r.x1)/2-cam.W/2)+Math.abs((r.y0+r.y1)/2-cam.H/2);
      for(let pass=0;pass<2;pass++){
        for(let it=0;it<6;it++){
          const r0=meas();
          if(!r0) break;
          const off0=offOf(r0);
          if(off0<3) break;
          const dxp=(r0.x0+r0.x1)/2-cam.W/2, dyp=(r0.y0+r0.y1)/2-cam.H/2;
          const sc=r0.z/r0.B.f*0.8, keep=cam.target.slice();
          let best=null, bestOff=off0;
          for(const sgn of [1,-1]){
            cam.target=v3.add(keep,
              v3.add(v3.mul(r0.B.right,sgn*dxp*sc), v3.mul(r0.B.up,-sgn*dyp*sc)));
            clampTarget();
            const r1=meas();
            if(r1&&offOf(r1)<bestOff){ bestOff=offOf(r1); best=cam.target.slice(); }
          }
          cam.target=best||keep;
          if(!best) break;
        }
        fitDist();   /* re-fit: moving the target changed the projected size */
      }
    },
    /* Each geometry wants a different vantage.  A straight guide reads well
       from three-quarters ahead; a CONE seen from there is looking straight
       down its own axis and draws as a flat disc with the apex hidden — so it
       gets a side-on view where the wall angle is actually visible. */
    defaultAngles(){
      const m=S.model();
      return (m.geom==='cone') ? [-1.18,0.20] : [-0.62,0.34];
    },
    resetView(){ const a=S.defaultAngles(); cam.theta=a[0]; cam.phi=a[1]; S.fit(); },
    lookAxial(){ cam.theta=PI; cam.phi=0.02; S.fit(); },
    lookSide(){ cam.theta=-PI/2; cam.phi=0.03; S.fit(); },
    pointer(kind,d){
      if(kind!=='move') return;
      cam.theta-=d.dx*0.006;
      cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),0.9,400); },
    step(dt){
      if(!st.anim&&!st.spin) return;
      t+=dt*st.speed;
      if(st.spin) cam.theta+=dt*st.speed*0.15;
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{width:cam.W,height:cam.H};
      const Wd=r.width||cam.W, Hd=r.height||cam.H;
      cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}


/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
const GEOM_CHIPS=GEOMS.map(g=>({id:g,name:GEOM_NAME[g]}));
const FAM_CHIPS=[{id:'TEM',name:'TEM'},{id:'TE',name:'TE'},{id:'TM',name:'TM'},
                 {id:'HE',name:'hybrid HE/EH'}];
const BAND_CHIPS=WR_BANDS.map(b=>({id:b.n,name:b.n}));
const METAL_CHIPS=METALS.map(m=>({id:m.n,name:m.n}));
const FILL_CHIPS=FILLS.map(m=>({id:m.n,name:m.n}));

function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['guide','the guide'],['xsec','the cross-section'],['disp','dispersion'],
              ['chart','the mode chart'],['atten','attenuation'],['cone','the cone']];
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }

  /* ---- the guide ---- */
  const gGeo=h('div',{class:'grp'},h('h3',null,'the guide'));
  gGeo.appendChild(chipRow(GEOM_CHIPS,'geom',o=>{
    /* every geometry has its own natural mode: land on it rather than on a
       mode that geometry does not have */
    if(o.id==='coax'||o.id==='plate'){ st.fam='TEM'; st.mIdx=0; st.nIdx=0; }
    else if(o.id==='fibre'){ st.fam='HE'; st.mIdx=1; st.nIdx=1; }
    else if(o.id==='circ'){ st.fam='TE'; st.mIdx=1; st.nIdx=1; }
    else if(o.id==='cone'){ st.fam='TM'; st.mIdx=0; st.nIdx=1; }
    else { st.fam='TE'; st.mIdx=1; st.nIdx=0; }
    /* a new geometry is a new object — re-aim the camera at it */
    S.rebuild(); S.resetView(); dirty=true;
  }));
  const gBand=h('div',{class:'grp'},h('h3',null,'EIA band'));
  gBand.appendChild(chipRow(BAND_CHIPS,'band',o=>{
    const b=bandBy(o.id);
    st.aMM=b.a*25.4; st.bMM=b.b*25.4;
    st.fGHz=clamp((b.lo+b.hi)/2,0.2,300);
  }));
  const gDim=h('div',{class:'grp'},h('h3',null,'dimensions'));
  gDim.appendChild(slider('aMM','broad wall a',2,180,0.01,v=>fmt(v,2)+' mm'));
  gDim.appendChild(slider('bMM','narrow wall b',0.5,90,0.01,v=>fmt(v,2)+' mm'));
  gDim.appendChild(slider('radMM','radius a',1,90,0.01,v=>fmt(v,2)+' mm'));
  gDim.appendChild(slider('coaxAMM','inner radius a',0.05,10,0.005,v=>fmt(v,3)+' mm'));
  gDim.appendChild(slider('coaxBA','b / a',1.2,8,0.001,v=>fmt(v,3)));
  gDim.appendChild(slider('plateD','plate gap d',0.5,40,0.01,v=>fmt(v,2)+' mm'));
  gDim.appendChild(slider('plateW','plate width w',2,200,0.1,v=>fmt(v,1)+' mm'));
  gDim.appendChild(slider('coneDeg','half-angle θ₀',5,80,0.1,v=>fmt(v,1)+'°'));
  gDim.appendChild(slider('fibAUM','core radius',1,30,0.05,v=>fmt(v,2)+' µm'));
  gDim.appendChild(slider('fibLamNM','λ',600,2000,1,v=>fmt(v,0)+' nm'));
  const dimTag=h('div',{class:'tag'}); gDim.appendChild(dimTag);

  /* ---- the mode ---- */
  const gMode=h('div',{class:'grp'},h('h3',null,'the mode'));
  const famRow=chipRow(FAM_CHIPS,'fam');
  gMode.appendChild(famRow);
  gMode.appendChild(slider('mIdx','index m',0,5,1,v=>fmt(v,0)));
  gMode.appendChild(slider('nIdx','index n',0,5,1,v=>fmt(v,0)));
  const modeTag=h('div',{class:'tag'}); gMode.appendChild(modeTag);

  /* ---- the signal ---- */
  const gSig=h('div',{class:'grp'},h('h3',null,'the signal'));
  gSig.appendChild(slider('fGHz','frequency',0.2,300,0.01,v=>fmt(v,2)+' GHz'));
  const sigTag=h('div',{class:'tag'}); gSig.appendChild(sigTag);

  /* ---- materials ---- */
  const gMat=h('div',{class:'grp'},h('h3',null,'walls and fill'));
  gMat.appendChild(chipRow(METAL_CHIPS,'metal'));
  gMat.appendChild(chipRow(FILL_CHIPS,'fill'));
  const matTag=h('div',{class:'src'}); gMat.appendChild(matTag);

  /* ---- the taper ---- */
  const gTap=h('div',{class:'grp'},h('h3',null,'the taper'));
  gTap.appendChild(slider('taperA2','exit width',2,180,0.1,v=>fmt(v,1)+' mm'));
  gTap.appendChild(slider('taperLMM','taper length',10,600,1,v=>fmt(v,0)+' mm'));
  const tapTag=h('div',{class:'tag'}); gTap.appendChild(tapTag);

  /* ---- display ---- */
  const gDisp=h('div',{class:'grp'},h('h3',null,'display'));
