  const dchecks=h('div',{class:'checks'},
    checkbox('showE','the electric field'),
    checkbox('showH','the magnetic field'),
    checkbox('showJ','wall currents'),
    checkbox('anim','animate'),
    checkbox('spin','auto-orbit'));
  gDisp.appendChild(dchecks);
  gDisp.appendChild(slider('nArrow','arrow density',5,20,1,v=>fmt(v,0)));
  gDisp.appendChild(slider('speed','speed',0.2,4,0.1,v=>fmt(v,1)+'×'));
  gDisp.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.lookAxial(); dirty=true; refresh(); }},'down the axis'),
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view')));
  gDisp.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuild(); S.resetView();
                              syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gGeo,gBand,gDim,gMode,gSig,gMat,gTap,gDisp,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    [[gGeo,GEOM_CHIPS,'geom'],[gBand,BAND_CHIPS,'band'],[gMode,FAM_CHIPS,'fam']].forEach(
      ([g,list,key])=>{
        const cw=g.querySelector('.chips'); if(!cw) return;
        [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      });
    const cws=gMat.querySelectorAll('.chips');
    [].forEach.call(cws[0].children,(b,i)=>b.className='chip'+(METAL_CHIPS[i].id===st.metal?' on':''));
    [].forEach.call(cws[1].children,(b,i)=>b.className='chip'+(FILL_CHIPS[i].id===st.fill?' on':''));
  }
  function syncPanel(){
    const v=st.view, gm=st.geom;
    gBand.hidden = (gm!=='rect');
    gTap.hidden  = (v!=='cone');
    gMode.hidden = (gm==='cone'||gm==='fibre');
    rows.aMM.row.hidden     = (gm!=='rect');
    rows.bMM.row.hidden     = (gm!=='rect');
    rows.radMM.row.hidden   = (gm!=='circ');
    rows.coaxAMM.row.hidden = (gm!=='coax');
    rows.coaxBA.row.hidden  = (gm!=='coax');
    rows.plateD.row.hidden  = (gm!=='plate');
    rows.plateW.row.hidden  = (gm!=='plate');
    rows.coneDeg.row.hidden = (gm!=='cone');
    rows.fibAUM.row.hidden  = (gm!=='fibre');
    rows.fibLamNM.row.hidden= (gm!=='fibre');
    rows.speed.row.hidden   = !(st.anim||st.spin);
    rows.nArrow.row.hidden  = !(v==='guide'||v==='xsec');
    /* families a geometry does not have are hidden, not merely inert */
    const allowed=FAMS_FOR[gm]||[];
    [].forEach.call(famRow.children,(b,i)=>{
      b.hidden = allowed.indexOf(FAM_CHIPS[i].id)<0;
    });
    for(const k in rows) rows[k].sync();
    [].forEach.call(dchecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showE','showH','showJ','anim','spin'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = (st.view==='guide')
        ? 'drag to orbit · scroll to zoom · a looks down the axis · r resets'
        : st.view==='xsec' ? 'turn on wall currents in a rectangular TE10 to see why a slotted line works'
        : st.view==='disp' ? 'the secant slope is v_p, the tangent slope is v_g — only their product is fixed'
        : st.view==='chart' ? 'drag the frequency through the ladder and watch modes switch on'
        : st.view==='atten' ? 'switch to circular and watch TE01 fall while everything else rises'
        : 'the cone has no cutoff frequency — it has a cutoff radius, and every frequency has one';
      subEl.innerHTML = (M.geom==='fibre')
        ? 'a dielectric cannot force E<sub>tan</sub> = 0 alone &mdash; so its modes are hybrid'
        : (M.geom==='cone')
        ? 'a cone quantises a Legendre degree, and cutoff becomes a radius'
        : (M.mode&&M.mode.fam==='TEM')
        ? 'two conductors, k<sub>c</sub> = 0, no cutoff &mdash; a static field towed along at c'
        : (M.gp.prop
          ? 'above cutoff &mdash; f/f<sub>c</sub> = '+sigf(M.gp.ratio,3)
            +', &lambda;<sub>g</sub> = '+fmtLen(M.gp.lamG,2)
          : 'below cutoff &mdash; the guide is a filter, and a lossless one');
      dimTag.innerHTML = (M.geom==='rect')
        ? 'a/b = <b>'+fmt(st.aMM/st.bMM,3)+'</b> &nbsp; λ_c = 2a = <b>'+fmtLen(2*M.a,2)+'</b>'
        : (M.geom==='coax')
        ? 'Z<sub>0</sub> = <b>'+fmt(M.coax.Z0,2)+' Ω</b> &nbsp; b = <b>'+fmt(st.coaxAMM*st.coaxBA,3)+' mm</b>'
        : (M.geom==='plate')
        ? 'Z<sub>0</sub> = <b>'+fmt(M.plate.Z0,2)+' Ω</b>'
        : (M.geom==='cone')
        ? 'ν = <b>'+sigf(M.cone.nu,6)+'</b> &nbsp; Z<sub>0</sub>(bicone) = <b>'+fmt(M.cone.Z0bi,1)+' Ω</b>'
        : (M.geom==='fibre')
        ? 'V = <b>'+sigf(M.fibre.V,4)+'</b> &nbsp; λ_c = <b>'+fmt(M.fibre.lamC*1e9,0)+' nm</b>'
        : 'radius <b>'+fmt(st.radMM,2)+' mm</b>';
      modeTag.innerHTML = M.mode
        ? 'selected <b>'+M.mode.name+'</b> &nbsp; f<sub>c</sub> = <b>'
          +(M.mode.fc>0?fmtHz(M.mode.fc,4):'0')+'</b>'
          +(M.gp.prop?'':' &nbsp;<span class="r">evanescent</span>')
        : '&mdash;';
      sigTag.innerHTML = M.gp.prop
        ? 'λ<sub>g</sub> = <b>'+fmtLen(M.gp.lamG,2)+'</b> &nbsp; v<sub>g</sub>/c = <b>'
          +sigf(M.gp.vg/C0,3)+'</b>'
        : '<span class="r">below cutoff</span> &nbsp; α = <b>'
          +sigf(M.gp.alphaEv*NP2DB,3)+' dB/m</b>';
      matTag.innerHTML='σ = '+M.sigma.toExponential(3)+' S/m (Pozar) &nbsp; ε<sub>r</sub> = '
        +fmt(M.er,2)+(M.tand>0?', tan δ = '+M.tand.toExponential(1):'')
        +'<br>skin depth '+fmtLen(M.loss.skin,2)+' at this frequency';
      tapTag.innerHTML=M.taper.cutsOff
        ? 'turns back at <b>'+fmt(M.taper.zTurn*1e3,1)+' mm</b> of '+fmt(M.taper.L*1e3,0)+' mm'
        : 'propagates the whole length';
      infoEl.innerHTML=INFO[st.view]||INFO.guide;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it: the frame loop only
     redraws while something is animating, so every interaction that touches the
     camera must ask for a frame.  (steam_carnot_cycle.html Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='a'){ S.lookAxial(); dirty=true; refresh(); }
    else if(e.key==='s'){ S.lookSide(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(((st.anim||st.spin)&&(st.view==='guide'||st.view==='xsec'))||dirty){
      dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

/* ================================================================== *
 *  selfTest — runs when there is no document                          *
 *                                                                     *
 *  Reference values marked (scipy) were printed by a throwaway python *
 *  script that re-derived every closed form here independently.  The  *
 *  field formulas are NOT checked against a second copy of themselves: *
 *  they are checked against the boundary conditions they must satisfy, *
 *  against div E = 0, against the Poynting direction, and against the  *
 *  wave impedance measured off the built field rather than the formula.*
 * ================================================================== */
function selfTest(){
  let np=0,nf=0;
  const ok=(c,n)=>{ if(c) np++; else { nf++; console.log('  FAIL '+n); } };
  const close=(a,b,t,n)=>{ if(Math.abs(a-b)<=t) np++; else { nf++;
    console.log('  FAIL '+n+'  got '+a+'  want '+b); } };
  const rel=(a,b,t,n)=>{ const e=Math.abs(a-b)/Math.max(Math.abs(b),1e-300);
    if(e<=t) np++; else { nf++;
      console.log('  FAIL '+n+'  got '+a+'  want '+b+'  rel '+e); } };

  /* ---------------- constants ---------------- */
  rel(ETA0,376.730313412,1e-9,'eta0 = sqrt(mu0/eps0) = CODATA Z0');
  rel(1/Math.sqrt(MU0*EPS0),C0,1e-9,'1/sqrt(mu0 eps0) = c0');
  rel(MU0*C0,ETA0,1e-12,'mu0 c0 = eta0');
  rel(NP2DB,20/Math.LN10,1e-15,'Np->dB is 20/ln10');

  /* ---------------- special functions vs scipy ---------------- */
  rel(besselJ(0,1),0.7651976865579666,1e-13,'J_0(1) (scipy)');
  rel(besselJ(3,7.5),-0.25806091319346036,1e-12,'J_3(7.5) (scipy)');
  rel(besselY0(1),0.0882569642156770,1e-11,'Y_0(1) (scipy)');
  rel(besselY1(1),-0.7812128213002887,1e-11,'Y_1(1) (scipy)');
  rel(besselY(2,3),-0.1604003934849237,1e-10,'Y_2(3) (scipy)');
  rel(besselY(0,5.5),-0.33948059288191107,1e-10,'Y_0(5.5) (scipy)');
  rel(besselK0(1),0.4210244382407083,1e-11,'K_0(1) (scipy)');
  rel(besselK1(1),0.6019072301972346,1e-11,'K_1(1) (scipy)');
  rel(besselK(2,2),0.2537597545660558,1e-10,'K_2(2) (scipy)');
  rel(besselI(0,1),1.2660658777520084,1e-12,'I_0(1) (scipy)');
  /* the derivative identities, implemented twice and required to agree */
  for(const x of [0.4,1.3,3.7,6.2]){
    close(besselYp(0,x),-besselY(1,x),1e-11,'Y_0\' = -Y_1 at '+x);
    close(besselKp(0,x),-besselK(1,x),1e-11,'K_0\' = -K_1 at '+x);
    close(besselJp(0,x),-besselJ(1,x),1e-13,'J_0\' = -J_1 at '+x);
    /* and against a centred difference, which shares no code with either */
    const hstep=1e-6;
    close(besselYp(1,x),(besselY(1,x+hstep)-besselY(1,x-hstep))/(2*hstep),1e-6,
          'Y_1\' vs finite difference at '+x);
    close(besselKp(1,x),(besselK(1,x+hstep)-besselK(1,x-hstep))/(2*hstep),1e-6,
          'K_1\' vs finite difference at '+x);
  }
  rel(legendreP(0.5,0,0.3),0.7009385309696583,1e-9,'P_0.5(0.3) (scipy)');
  /* the on-axis branch of J_m(x)/x.  Every field sample sits at a cell centre,
     so r = 0 is never hit and a mutation sweep found this branch covered by
     nothing at all.  Assert the limit AND its continuity with the series. */
  close(jOverX(1,0),0.5,1e-15,'J_1(x)/x -> 1/2 on the axis');
  close(jOverX(2,0),0,1e-15,'J_2(x)/x -> 0 on the axis');
  close(jOverX(0,0),0,1e-15,'m = 0 never contributes (sin(m phi) = 0)');
  rel(jOverX(1,1e-7),besselJ(1,1e-7)/1e-7,1e-9,'and it joins the series continuously');
  rel(jOverX(1,1e-5),0.5,1e-9,'the limit is approached from the series side too');
  rel(legendreP(2,0,0.3),-0.365,1e-12,'P_2(0.3) = (3x^2-1)/2 exactly');
  rel(legendreP(3,0,0.7),(5*Math.pow(0.7,3)-3*0.7)/2,1e-12,'P_3(0.7) = (5x^3-3x)/2 exactly');
  /* P_2^1(cos th) = -3 cos th sin th in this (and scipy lpmv) convention */
  {
    const th=0.7;
    rel(legendreP(2,1,Math.cos(th)),-3*Math.cos(th)*Math.sin(th),1e-11,
        'P_2^1 = -3 cos sin (closed form, matches scipy lpmv)');
  }

  /* ---------------- Bessel zeros and the waveguide convention -------- */
  rel(jZero(0,1),2.404825557695773,1e-13,'j_{0,1} (scipy)');
  rel(jZero(1,1),3.831705970207512,1e-13,'j_{1,1} (scipy)');
  rel(jZero(2,1),5.135622301840683,1e-13,'j_{2,1} (scipy)');
  rel(jZero(0,2),5.520078110286311,1e-13,'j_{0,2} (scipy)');
  rel(jpZero(1,1),1.841183781340659,1e-13,"p'_{1,1} (scipy)");
  rel(jpZero(2,1),3.054236928227140,1e-13,"p'_{2,1} (scipy)");
  rel(jpZero(3,1),4.201188941210394,1e-12,"p'_{3,1} (scipy)");
  rel(jpZero(1,2),5.331442773525032,1e-12,"p'_{1,2} (scipy)");
  /* THE convention test: a waveguide must not take j'(0,1) = 0 */
  rel(jpZero(0,1),3.831705970207512,1e-13,"p'_{0,1} = 3.8317, NOT 0 (waveguide convention)");
  ok(jpZero(0,1)>1,'TE_01 cutoff is nonzero — the x=0 root is not a mode');
  /* and the identity that makes TE_0n / TM_1n degenerate */
  for(let n=1;n<=3;n++)
    rel(jpZero(0,n),jZero(1,n),1e-13,"J_0' = -J_1 so p'_{0,"+n+'} = j_{1,'+n+'}');
  /* every root really is a root */
  for(let m=0;m<=3;m++) for(let n=1;n<=3;n++){
    close(besselJ(m,jZero(m,n)),0,1e-12,'J_'+m+' vanishes at j_{'+m+','+n+'}');
    close(besselJp(m,jpZero(m,n)),0,1e-12,"J_"+m+"' vanishes at p'_{"+m+','+n+'}');
  }

  /* ---------------- rectangular guide ---------------- */
  const a=0.900*INCH, b=0.400*INCH;
  const mr=modesRect(a,b,C0,4);
  rel(mr[0].fc,6557140376.203,1e-11,'WR-90 f_c TE10 (scipy)');
  ok(mr[0].name==='TE10','the lowest rectangular mode is TE10');
  rel(mr[1].fc,13114280752.41,1e-11,'WR-90 f_c TE20 (scipy)');
  rel(mr[2].fc,14753565846.5,1e-10,'WR-90 f_c TE01 (scipy)');
  ok(!mr.some(q=>q.fam==='TM'&&(q.m===0||q.n===0)),
     'no TM mode has a zero index — either one kills the field');
  /* the cutoff ladder must be sorted */
  for(let i=1;i<mr.length;i++) ok(mr[i].fc>=mr[i-1].fc-1e-6,'ladder sorted at '+i);
  /* WR-90 at 10 GHz, the canonical set */
  const gp=guideProps(10e9,mr[0].fc,C0,ETA0);
  rel(gp.beta,158.23825631302,1e-11,'beta @ 10 GHz (scipy)');
  rel(gp.lamG,0.039707119211112,1e-11,'lambda_g (scipy)');
  rel(gp.vp,397071192.11112,1e-11,'v_p (scipy)');
  rel(gp.vg,226346105.33148,1e-11,'v_g (scipy)');
  rel(gp.Zte,498.9743759692,1e-11,'Z_TE (scipy)');
  rel(gp.Ztm,284.4349046335,1e-11,'Z_TM (scipy)');
  rel(gp.vp*gp.vg,C0*C0,1e-13,'v_p v_g = c^2 exactly');
  rel(gp.Zte*gp.Ztm,ETA0*ETA0,1e-13,'Z_TE Z_TM = eta^2 exactly');
  /* lambda_g by a route that shares no code: 1/lg^2 = 1/l0^2 - 1/lc^2 */
  rel(gp.lamG,1/Math.sqrt(1/Math.pow(C0/10e9,2)-1/Math.pow(2*a,2)),1e-12,
      'lambda_g via the 1/lambda^2 identity (independent route)');
  /* v_g as a NUMERICAL derivative dw/dbeta, not as a second formula */
  {
    const kc=PI/a, w=(be)=>C0*Math.sqrt(be*be+kc*kc), db=gp.beta*1e-6;
    rel((w(gp.beta+db)-w(gp.beta-db))/(2*db),gp.vg,1e-9,
        'v_g = dw/dbeta taken numerically');
  }
  /* round trip: recover f from beta */
  {
    const kc=PI/a, fBack=C0*Math.sqrt(gp.beta*gp.beta+kc*kc)/TAU;
    rel(fBack,10e9,1e-12,'f recovered from beta (round trip)');
  }
  /* below cutoff: alpha/k_c = sqrt(3)/2 at f = f_c/2, exactly */
  {
    const ge=guideProps(mr[0].fc/2,mr[0].fc,C0,ETA0);
    ok(!ge.prop,'f_c/2 is below cutoff');
    rel(ge.alphaEv/ge.kc,Math.sqrt(3)/2,1e-12,'alpha/k_c = sqrt(3)/2 at f = f_c/2');
    rel(ge.alphaEv,119.015706315,1e-10,'evanescent alpha (scipy)');
    ok(ge.vg===0,'v_g is zero below cutoff');
  }

  /* ---------------- the field formulas, checked against physics ------ */
  const testModes=[{fam:'TE',m:1,n:0},{fam:'TE',m:2,n:0},{fam:'TE',m:0,n:1},
                   {fam:'TE',m:1,n:1},{fam:'TE',m:2,n:1},
                   {fam:'TM',m:1,n:1},{fam:'TM',m:2,n:1},{fam:'TM',m:1,n:2}];
  testModes.forEach(md=>{
    md.kc=Math.sqrt(Math.pow(md.m*PI/a,2)+Math.pow(md.n*PI/b,2));
    const fc=modeCutoff(md.kc,C0), fq=Math.max(2.1*fc,2e10);
    const g=guideProps(fq,fc,C0,ETA0), om=TAU*fq;
    const nm=md.fam+md.m+md.n;
    /* 1. E_tangential = 0 on all four walls — the condition that DEFINES
          these modes.  Nothing in fieldRect() enforces it directly. */
    let worst=0, scale=0;
    for(let i=1;i<24;i++){
      const x=a*i/24, y=b*i/24;
      const F1=fieldRect(md,a,b,om,g.beta,0,y,0.9);   /* x = 0 wall  */
      const F2=fieldRect(md,a,b,om,g.beta,a,y,0.9);   /* x = a wall  */
      const F3=fieldRect(md,a,b,om,g.beta,x,0,0.9);   /* y = 0 wall  */
      const F4=fieldRect(md,a,b,om,g.beta,x,b,0.9);   /* y = b wall  */
      const Fm=fieldRect(md,a,b,om,g.beta,x,y,0.9);
      scale=Math.max(scale,Math.abs(Fm.Ex),Math.abs(Fm.Ey),Math.abs(Fm.Ez));
      worst=Math.max(worst,Math.abs(F1.Ey),Math.abs(F1.Ez),
                           Math.abs(F2.Ey),Math.abs(F2.Ez),
                           Math.abs(F3.Ex),Math.abs(F3.Ez),
                           Math.abs(F4.Ex),Math.abs(F4.Ez));
    }
    ok(worst<=1e-9*Math.max(scale,1e-300),
       'E_tan = 0 on every wall for '+nm+'  (worst/scale '+(worst/scale).toExponential(1)+')');
    /* 2. div E = 0 in the source-free interior, by finite difference.
          For TE, E_z = 0 and the transverse divergence must vanish; for TM
          the dE_z/dz term must cancel it, and dE_z/dz = -j beta E_z, whose
          real part at phase psi is +beta*Ez_amp*sin(psi). */
    {
      const hx=a*2e-4, hy=b*2e-4, psi=0.9;
      let wd=0, sc2=0;
      for(let i=1;i<7;i++) for(let j=1;j<7;j++){
        const x=a*i/7, y=b*j/7;
        const dEx=(fieldRect(md,a,b,om,g.beta,x+hx,y,psi).Ex
                  -fieldRect(md,a,b,om,g.beta,x-hx,y,psi).Ex)/(2*hx);
        const dEy=(fieldRect(md,a,b,om,g.beta,x,y+hy,psi).Ey
                  -fieldRect(md,a,b,om,g.beta,x,y-hy,psi).Ey)/(2*hy);
        /* d/dz of Re[Ez_a cos-part] with psi = wt - beta z */
        const hz=1e-7;
        const dEz=(fieldRect(md,a,b,om,g.beta,x,y,psi-g.beta*hz).Ez
                  -fieldRect(md,a,b,om,g.beta,x,y,psi+g.beta*hz).Ez)/(2*hz);
        wd=Math.max(wd,Math.abs(dEx+dEy+dEz));
        sc2=Math.max(sc2,Math.abs(dEx),Math.abs(dEy),Math.abs(dEz));
      }
      ok(wd<=1e-6*Math.max(sc2,1e-300),'div E = 0 for '+nm
         +'  (worst/scale '+(wd/sc2).toExponential(1)+')');
    }
    /* 2b. div H = 0.  This is the ONLY check that reaches H_z: the boundary
       conditions constrain E, the Poynting and impedance tests use only the
       TRANSVERSE H, and a mutation sweep duly found that H_z could be changed
       from cos(m pi x/a) to sin(m pi x/a) with the whole suite still green.
       div H ties H_z to H_x and H_y exactly, and kills that. */
    {
      const hx=a*2e-4, hy=b*2e-4, psi=0.9;
      let wd=0, sc2=0;
      for(let i=1;i<7;i++) for(let j=1;j<7;j++){
        const x=a*i/7, y=b*j/7;
        const dHx=(fieldRect(md,a,b,om,g.beta,x+hx,y,psi).Hx
                  -fieldRect(md,a,b,om,g.beta,x-hx,y,psi).Hx)/(2*hx);
        const dHy=(fieldRect(md,a,b,om,g.beta,x,y+hy,psi).Hy
                  -fieldRect(md,a,b,om,g.beta,x,y-hy,psi).Hy)/(2*hy);
        const hz=1e-7;
        const dHz=(fieldRect(md,a,b,om,g.beta,x,y,psi-g.beta*hz).Hz
                  -fieldRect(md,a,b,om,g.beta,x,y,psi+g.beta*hz).Hz)/(2*hz);
        wd=Math.max(wd,Math.abs(dHx+dHy+dHz));
        sc2=Math.max(sc2,Math.abs(dHx),Math.abs(dHy),Math.abs(dHz));
      }
      ok(wd<=1e-6*Math.max(sc2,1e-300),'div H = 0 for '+nm
         +'  (worst/scale '+(wd/sc2).toExponential(1)+')');
    }
    /* 3. power flows in +z everywhere it is nonzero */
    let tot=0, neg=0;
    for(let i=1;i<20;i++) for(let j=1;j<20;j++){
      const F=fieldRect(md,a,b,om,g.beta,a*i/20,b*j/20,0.7);
      const sz=F.Ex*F.Hy-F.Ey*F.Hx;
      tot+=sz; if(sz<-1e-18*Math.max(1,Math.abs(tot))) neg++;
    }
    ok(tot>0&&neg===0,'S_z > 0 everywhere for '+nm);
    /* 4. the wave impedance MEASURED off the built field, not the formula */
    {
      const x=a*0.31, y=b*0.37;
      const F=fieldRect(md,a,b,om,g.beta,x,y,0.9);
      const Et=Math.hypot(F.Ex,F.Ey), Ht=Math.hypot(F.Hx,F.Hy);
      const want=(md.fam==='TE')?g.Zte:g.Ztm;
      if(Ht>1e-30&&Et>1e-30) rel(Et/Ht,want,1e-10,'Z_w measured off the field for '+nm);
    }
  });

  /* the TE10 power integral against the closed form */
  {
    const md=mr[0], fq=10e9, g=guideProps(fq,md.fc,C0,ETA0);
    const N=4001; let s=0;
    for(let i=0;i<=N;i++){
      const w=(i===0||i===N)?0.5:1;
      s+=w*Math.pow(Math.sin(PI*(a*i/N)/a),2);
    }
    s*=a/N;
    rel(s*b/(2*g.Zte),a*b/(4*g.Zte),1e-9,'TE10 power: trapezoid = |E0|^2 ab/4Z_TE');
  }

  /* ---------------- circular guide ---------------- */
  const ar=0.5*INCH, mc=modesCirc(ar,C0,3);
  ok(mc[0].name==='TE11','the lowest circular mode is TE11');
  rel(mc[0].fc,6.9172624586e9,1e-10,'circular f_c TE11 (scipy)');
  ok(mc[1].name==='TM01','the second circular mode is TM01');
  rel(mc[1].fc,9.0348447114e9,1e-10,'circular f_c TM01 (scipy)');
  rel(jZero(0,1)/jpZero(1,1),1.30613010068,1e-11,'TM01/TE11 cutoff ratio (scipy)');
  /* E_tan = 0 at r = a, and S_z > 0 */
  [{fam:'TE',m:1,n:1},{fam:'TE',m:0,n:1},{fam:'TE',m:2,n:1},
   {fam:'TM',m:0,n:1},{fam:'TM',m:1,n:1}].forEach(md=>{
    md.kc=(md.fam==='TE'?jpZero(md.m,md.n):jZero(md.m,md.n))/ar;
    const fc=modeCutoff(md.kc,C0), fq=2.1*fc, g=guideProps(fq,fc,C0,ETA0), om=TAU*fq;
    const nm='circ '+md.fam+md.m+md.n;
    let worst=0, scale=0;
    for(let i=0;i<32;i++){
      const ph=TAU*i/32;
      const Fw=fieldCirc(md,ar,om,g.beta,ar,ph,0.9);
      const Fm=fieldCirc(md,ar,om,g.beta,ar*0.55,ph,0.9);
      worst=Math.max(worst,Math.abs(Fw.Ep),Math.abs(Fw.Ez));
      scale=Math.max(scale,Math.abs(Fm.Er),Math.abs(Fm.Ep),Math.abs(Fm.Ez));
    }
    ok(worst<=1e-9*Math.max(scale,1e-300),'E_tan = 0 at r=a for '+nm);
    let tot=0;
    for(let i=1;i<20;i++) for(let j=0;j<24;j++){
      const F=fieldCirc(md,ar,om,g.beta,ar*i/20,TAU*j/24,0.7);
      tot+=(F.Er*F.Hp-F.Ep*F.Hr)*(i/20);
    }
    ok(tot>0,'S_z > 0 for '+nm);
  });
  /* TE01 and TM11 must be degenerate to the last bit */
  {
    const te01=mc.find(q=>q.name==='TE01'), tm11=mc.find(q=>q.name==='TM11');
    ok(te01&&tm11,'both TE01 and TM11 are in the ladder');
    rel(te01.fc,tm11.fc,1e-13,'TE01 and TM11 are EXACTLY degenerate');
  }

  /* ---------------- coax ---------------- */
  {
    const ai=0.455e-3, ba=Math.exp(TAU*50/ETA0), bo=ai*ba;
    rel(ETA0/TAU*Math.log(bo/ai),50,1e-12,'coax Z0 = 50 ohm by construction');
    rel(coaxCutoffKc(ai,bo,'TE'),1358.7253199422,1e-9,'coax TE11 k_c EXACT (scipy)');
    rel(coaxCutoffKc(ai,bo,'TM'),5257.07478763,1e-8,'coax TM01 k_c EXACT (scipy)');
    /* the textbook approximation is 2.0% low — that is the point of the view */
    const err=(2/(ai+bo))/coaxCutoffKc(ai,bo,'TE')-1;
    close(err,-0.0203523,1e-6,'2/(a+b) is 2.035% low (scipy)');
    /* the root really is a root of the cross-product */
    const kc=coaxCutoffKc(ai,bo,'TE');
    const F=besselJp(1,kc*ai)*besselYp(1,kc*bo)-besselJp(1,kc*bo)*besselYp(1,kc*ai);
    ok(Math.abs(F)<1e-9,'the cross-product really vanishes at k_c');
    /* the two optima, from their own transcendental equations */
    const xMin=3.591121476668;
    close(Math.log(xMin)-1-1/xMin,0,1e-11,'min-loss b/a satisfies ln x = 1 + 1/x');
    rel(ETA0/TAU*Math.log(xMin),76.6548055379,1e-9,'min-loss Z0 = 76.65 ohm (scipy)');
    rel(ETA0/TAU*Math.log(Math.sqrt(Math.E)),29.979245796,1e-9,'max-power Z0 = 29.98 ohm');
    rel(ETA0/(4*PI),29.979245796,1e-11,'max-power Z0 = eta/4pi exactly');
    rel(Math.sqrt(76.6548055379*29.979245796),47.9380147343,1e-9,
        'geometric mean of the two optima = 47.94 ohm');
    /* min-loss really is the minimum, by direct search */
    const gfun=x=>(1+x)/Math.log(x);
    let best=1e30,bx=0;
    for(let x=1.5;x<8;x+=0.0005){ const v=gfun(x); if(v<best){best=v;bx=x;} }
    close(bx,xMin,1e-3,'direct search finds the same min-loss b/a');
    rel(alphaCoax(10e9,ai,bo,5.813e7,ETA0),0.13075034410511,1e-10,'coax alpha (scipy)');
  }

  /* ---------------- loss ---------------- */
  {
    const f=10e9, sg=5.813e7;
    rel(surfaceR(f,sg),0.026060317758842,1e-11,'R_s copper 10 GHz (scipy)');
    const aA=alphaRectTE10(f,a,b,sg,C0,ETA0);
    rel(aA,0.012464362158126,1e-11,'alpha_c TE10 (scipy)');
    /* Collin's algebraically independent form must agree */
    const fc=mr[0].fc, s=1-Math.pow(fc/f,2);
    const aB=surfaceR(f,sg)/(b*ETA0*Math.sqrt(s))*(1+(2*b/a)*Math.pow(fc/f,2));
    rel(aA,aB,1e-13,'Pozar and Collin alpha forms agree');
    /* R_s must scale as sqrt(f) */
    rel(surfaceR(4*f,sg)/surfaceR(f,sg),2,1e-13,'R_s scales as sqrt(f)');
    /* circular TE01 falls as f^-3/2, TM01 rises as f^+1/2 */
    const s1=Math.log(alphaCircTE(4e12,0,1,ar,sg,C0,ETA0)/alphaCircTE(1e12,0,1,ar,sg,C0,ETA0))
             /Math.log(4);
    close(s1,-1.5,2e-3,'circular TE01 alpha ~ f^-3/2 far above cutoff');
    const s2=Math.log(alphaCircTM(4e12,0,1,ar,sg,C0,ETA0)/alphaCircTM(1e12,0,1,ar,sg,C0,ETA0))
             /Math.log(4);
    close(s2,0.5,2e-3,'circular TM01 alpha ~ f^+1/2 far above cutoff');
    /* Every loss assertion above uses TE_0n or TM_0n, where m = 0 and the
       m^2/(p'^2 - m^2) term is identically zero — so a mutation sweep changed
       that denominator's sign and nothing noticed.  The same shape as the
       drum's cancelled radius: a term that vanishes from everything you check
       has to be pinned on its own, at an m that reaches it. */
    rel(alphaCircTE(12e9,1,1,ar,sg,C0,ETA0),0.0054815709755933,1e-10,
        'circular TE11 alpha, m=1 (scipy)');
    rel(alphaCircTE(20e9,2,1,ar,sg,C0,ETA0),0.010156058028817,1e-10,
        'circular TE21 alpha, m=2 (scipy)');
    rel(alphaCircTE(30e9,1,2,ar,sg,C0,ETA0),0.0061112868056618,1e-10,
        'circular TE12 alpha, m=1 n=2 (scipy)');
    /* the TE10 loss minimum, located numerically */
    let amin=Infinity,fmin=0;
    for(let lf=Math.log10(mr[0].fc*1.02);lf<12;lf+=0.0005){
      const fq=Math.pow(10,lf), av=alphaRectTE10(fq,a,b,sg,C0,ETA0);
      if(av<amin){ amin=av; fmin=fq; }
    }
    close(fmin/mr[0].fc,2.34631940399,3e-3,'TE10 loss minimum at 2.346 f_c (scipy)');
    ok(!isFinite(alphaRectTE10(mr[0].fc*0.9,a,b,sg,C0,ETA0)),
       'loss is Infinity below cutoff, not a number');
  }

  /* ---------------- the cone ---------------- */
  rel(coneNu('TM',0,PI/6),4.083687067028,1e-10,'cone nu TM01 at 30 deg (scipy)');
  rel(coneNu('TM',0,PI/12),8.681206247174,1e-9,'cone nu TM01 at 15 deg (scipy)');
  rel(coneNu('TM',0,PI/3),1.777288270159,1e-10,'cone nu TM01 at 60 deg (scipy)');
  rel(coneNu('TE',1,PI/4),2.0,1e-9,'cone nu TE11 at 45 deg = 2 EXACTLY');
  /* 45 deg is exact for ANY differencing step, because the centred difference
     of P_2^1 ~ sin(2th) is cos(2th) times sin(2h)/2h — the scale changes, the
     ZERO does not.  A mutation sweep coarsening h from 1e-5 to 1e-1 therefore
     survived on that assertion alone.  These two angles are not exact and move
     by 1.8e-3 and 2.3e-4 under the same change. */
  rel(coneNu('TE',1,PI/6),3.119597085802,1e-8,'cone nu TE11 at 30 deg (scipy)');
  rel(coneNu('TE',1,PI/3),1.467987383577,1e-8,'cone nu TE11 at 60 deg (scipy)');
  /* the eigenvalue really solves its own equation */
  close(legendreP(coneNu('TM',0,PI/6),0,Math.cos(PI/6)),0,1e-11,
        'P_nu(cos 30) really vanishes at the root');
  close(legendrePdTh(coneNu('TE',1,PI/4),1,PI/4),0,1e-7,
        'dP_nu^1/dth really vanishes at the TE root');
  /* the cylinder limit: nu*th0 -> j_{0,1} */
  {
    const p1=coneNu('TM',0,2*DEG)*2*DEG, p2=coneNu('TM',0,1*DEG)*1*DEG;
    ok(p2>p1,'nu*th0 increases as the cone narrows');
    close(p2,2.396,2e-3,'nu*th0 -> 2.4048 (the cone becomes a cylinder)');
    ok(Math.abs(p2-jZero(0,1))<Math.abs(p1-jZero(0,1)),
       'and it is closer to j_{0,1} at the smaller angle');
  }
  rel(z0Biconical(PI/6,ETA0),157.9256179797,1e-11,'biconical Z0 at 30 deg (scipy)');
  rel(z0ConeGround(PI/6,ETA0),z0Biconical(PI/6,ETA0)/2,1e-13,
      'cone over ground is exactly half the biconical');
  /* Z0 re-derived by integrating E.dl through the field rather than quoting */
  {
    const th0=PI/6, N=200000;
    let s=0;
    for(let i=1;i<N;i++) s+=1/Math.sin(th0+(PI-2*th0)*i/N);
    s+= 0.5*(1/Math.sin(th0)+1/Math.sin(PI-th0));
    s*=(PI-2*th0)/N;
    rel(ETA0/TAU*s,z0Biconical(th0,ETA0),1e-8,
        'biconical Z0 by integrating E.dl (independent of the closed form)');
  }
  /* the radial ODE reproduces s*j_2(s) for nu = 2 */
  {
    const R=coneRadial(2,20,2000);
    const j2=s=>(3/(s*s*s)-1/s)*Math.sin(s)-3*Math.cos(s)/(s*s);
    const k=R.s.length-1, sc=R.u[k]/(R.s[k]*j2(R.s[k]));
    let worst=0, mx=0;
    for(let i=200;i<R.s.length;i++){
      worst=Math.max(worst,Math.abs(R.u[i]-R.s[i]*j2(R.s[i])*sc));
      mx=Math.max(mx,Math.abs(R.s[i]*j2(R.s[i])*sc));
    }
    ok(worst<1e-7*mx,'cone radial ODE reproduces s j_2(s) to '+(worst/mx).toExponential(1));
    rel(R.turn,Math.sqrt(6),1e-13,'turning point is sqrt(nu(nu+1)) = sqrt(6)');
    /* and it really IS small inside the turning point */
    let inside=0, outside=0;
    for(let i=0;i<R.s.length;i++){
      if(R.s[i]<R.turn*0.55) inside=Math.max(inside,Math.abs(R.u[i]));
      else outside=Math.max(outside,Math.abs(R.u[i]));
    }
    ok(inside<0.35*outside,'the radial function is suppressed inside the turning point');
  }

  /* ---------------- the fibre ---------------- */
  {
    const n1=1.4682,n2=1.4629, acore=4.1e-6, lam=1.55e-6;
    const V=fibreV(acore,lam,n1,n2);
    rel(V,2.0715016303513,1e-11,'fibre V at 1550 nm (scipy)');
    rel(fibreLPu(0,1,V),1.5517781345132,1e-9,'LP01 u (scipy)');
    rel(fibreHE11u(V,n1,n2),1.5531361180885,1e-9,'exact vector HE11 u (scipy)');
    ok(fibreHE11u(V,n1,n2)>fibreLPu(0,1,V),'the exact root sits above the LP one');
    ok(fibreLPu(1,1,V)===null,'LP11 is cut off at V = 2.07');
    ok(fibreLPu(1,1,3.0)!==null,'LP11 is guided at V = 3.0');
    rel(jZero(0,1),2.404825557695773,1e-13,'the single-mode limit is j_{0,1}');
    /* HE11 has no cutoff: it must exist at arbitrarily small V */
    ok(fibreHE11u(0.15,n1,n2)!==null,'HE11 is still guided at V = 0.15 (no cutoff)');
    ok(fibreHE11u(0.02,n1,n2)!==null,'HE11 is still guided at V = 0.02 (no cutoff)');
    /* u and w must sit on the circle u^2 + w^2 = V^2 */
    const u=fibreLPu(0,1,V), w=Math.sqrt(V*V-u*u);
    rel(u*u+w*w,V*V,1e-12,'u^2 + w^2 = V^2');
    /* the profile is continuous across the core boundary */
    const p1=fibreProfile(0,u,w,V,1-1e-7), p2=fibreProfile(0,u,w,V,1+1e-7);
    rel(p1,p2,1e-6,'the LP profile is continuous at r = a');
    rel(p1,1,1e-6,'and equals 1 there by construction');
  }

  /* ---------------- the model builds clean everywhere ---------------- */
  {
    const VIEWS=['guide','xsec','disp','chart','atten','cone'];
    let bad=0, checked=0;
    const scan=(o,path,depth)=>{
      if(depth>4||o===null||o===undefined) return;
      if(typeof o==='number'){ if(!isFinite(o)&&o!==Infinity&&o!==-Infinity){
        bad++; console.log('  FAIL non-finite at '+path); } return; }
      if(typeof o!=='object') return;
      if(o.length!==undefined&&o.length>60) return;
      for(const k in o){ if(k==='st') continue; scan(o[k],path+'.'+k,depth+1); }
    };
    GEOMS.forEach(gm=>{
      VIEWS.forEach(v=>{
        const st=Object.assign({},DEFAULTS,{geom:gm,view:v});
        if(gm==='coax'||gm==='plate'){ st.fam='TEM'; st.mIdx=0; st.nIdx=0; }
        else if(gm==='fibre'){ st.fam='HE'; }
        else if(gm==='cone'){ st.fam='TM'; }
        else if(gm==='circ'){ st.fam='TE'; st.mIdx=1; st.nIdx=1; }
        const M=buildModel(st);
        checked++;
        scan(M,gm+'/'+v,0);
        const rh=readoutHTML(M), eb=eqbarHTML(M), tg=tagHTML(M);
        if(/undefined|NaN|\[object/.test(rh)){ bad++; console.log('  FAIL readout '+gm+'/'+v); }
        if(/undefined|NaN|\[object/.test(eb)){ bad++; console.log('  FAIL eqbar '+gm+'/'+v); }
        if(/undefined|NaN|\[object/.test(tg)){ bad++; console.log('  FAIL tag '+gm+'/'+v); }
      });
    });
    ok(bad===0,'all '+checked+' geometry x view models build clean (no NaN, no undefined)');
  }

  /* no slider combination may produce a non-finite result */
  {
    let bad=0, n=0;
    const SW=[['fGHz',[0.2,1,6.5,10,60,300]],
              ['aMM',[2,10,22.86,90,180]],
              ['bMM',[0.5,3,10.16,45,90]],
              ['radMM',[1,6,12.7,50,90]],
              ['coaxAMM',[0.05,0.455,3,10]],
              ['coaxBA',[1.2,2.3023,3.591,8]],
              ['plateD',[0.5,5,20,40]],
              ['coneDeg',[5,15,30,45,60,80]],
              ['fibAUM',[1,4.1,12,30]],
              ['fibLamNM',[600,1310,1550,2000]],
              ['mIdx',[0,1,2,5]],['nIdx',[0,1,2,5]],
              ['taperA2',[2,8,60,180]],['taperLMM',[10,200,600]]];
    GEOMS.forEach(gm=>{
      SW.forEach(([key,vals])=>{
        vals.forEach(v=>{
          const st=Object.assign({},DEFAULTS,{geom:gm});
          if(gm==='coax'||gm==='plate') st.fam='TEM';
          else if(gm==='fibre') st.fam='HE';
          else if(gm==='cone') st.fam='TM';
          st[key]=v;
          n++;
          try{
            const M=buildModel(st);
            const g=M.gp;
            if(!isFinite(g.k)||!isFinite(g.kc)) { bad++; console.log('  FAIL k at '+gm+' '+key+'='+v); }
            if(g.prop&&(!isFinite(g.beta)||!isFinite(g.lamG)||!isFinite(g.vg))){
              bad++; console.log('  FAIL beta at '+gm+' '+key+'='+v); }
            if(!g.prop&&!isFinite(g.alphaEv)){ bad++; console.log('  FAIL alpha at '+gm+' '+key+'='+v); }
            readoutHTML(M); eqbarHTML(M); tagHTML(M);
          }catch(e){ bad++; console.log('  FAIL threw at '+gm+' '+key+'='+v+': '+e.message); }
        });
      });
    });
    ok(bad===0,'all '+n+' slider settings x geometries stay finite');
  }

  /* the mode families offered really exist for their geometry */
  {
    let bad=0;
    GEOMS.forEach(gm=>{
      FAMS_FOR[gm].forEach(fam=>{
        const st=Object.assign({},DEFAULTS,{geom:gm,fam:fam});
        const M=buildModel(st);
        if(!M.mode){ bad++; console.log('  FAIL no mode for '+gm+'/'+fam); }
      });
    });
    ok(bad===0,'every offered family yields a mode');
    ok(FAMS_FOR.rect.indexOf('TEM')<0,'a single hollow conductor is offered no TEM');
    ok(FAMS_FOR.circ.indexOf('TEM')<0,'nor is a circular one');
    ok(FAMS_FOR.coax.indexOf('TEM')>=0,'coax is');
    ok(FAMS_FOR.fibre.indexOf('HE')>=0,'the fibre offers hybrids');
  }

  /* the WR table: a must be the WR number in hundredths of an inch */
  {
    let bad=0;
    WR_BANDS.forEach(w=>{
      const want=parseFloat(w.n.slice(3))/100;
      if(Math.abs(w.a-want)>0.0051){ bad++; console.log('  FAIL WR dim '+w.n+' a='+w.a); }
      if(!(w.lo<w.hi)){ bad++; console.log('  FAIL WR band order '+w.n); }
      /* the recommended band must sit above the TE10 cutoff and below TE20 */
      const fc10=C0/(2*w.a*INCH)/1e9, fc20=2*fc10;
      if(!(w.lo>fc10)){ bad++; console.log('  FAIL '+w.n+' band starts below cutoff'); }
      if(!(w.hi<fc20*1.02)){ bad++; console.log('  FAIL '+w.n+' band runs past TE20'); }
    });
    ok(bad===0,'every WR band is self-consistent with its own dimensions');
    rel(bandBy('WR-90').a*INCH,0.02286,1e-15,'WR-90 a = 22.86 mm exactly');
  }

  console.log(np+' passed, '+nf+' failed');
  /* THROW, do not merely report.  The mutation runner decides caught-vs-survived
     from the process exit code, so a selfTest that logs failures and returns
     cleanly makes EVERY mutant look like a survivor.  That is exactly what the
     first sweep on this file reported, and it was a defect in this line, not in
     the physics. */
  if(nf>0) throw new Error(nf+' self-test failure(s)');
  return true;
}

/* ================================================================== *
 *  entry                                                              *
 * ================================================================== */
if(typeof document==='undefined'){
  selfTest();
}else if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{
  boot();
}
</script>
