    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),html:o.name,onclick:()=>{
      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function syncChips(){ for(const [wrapEl,list,key] of CHIPROWS) [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')); }
  const btn=(lab,fn)=>h('button',{onclick:()=>{ fn(); syncChips(); syncPanel(); dirty=true; refresh(); }},lab);
  const logMap=(lo,hi)=>({to:u=>lo*Math.pow(hi/lo,u/1000),from:v=>Math.round(1000*Math.log(clamp(v,lo,hi)/lo)/Math.log(hi/lo))});
  const degMap={to:u=>u*PI/180,from:v=>Math.round(v*180/PI)};

  /* ---- the field near a point ---- */
  const gLocal=h('div',{class:'grp'},h('h3',null,'the field near a point'));
  gLocal.appendChild(chipRow(FIELDS2.map(o=>({id:o.id,name:o.name})),'lField'));
  gLocal.appendChild(slider('lR','the circle’s radius r',0,1000,1,v=>num(v,3),null,logMap(LIM.lR[0],LIM.lR[1])));
  gLocal.appendChild(chipRow(HEAT_KINDS,'lHeat'));
  gLocal.appendChild(h('div',{class:'checks'},checkbox('lStream','streamlines'),checkbox('lPlay','the parcel moves')));
  gLocal.appendChild(h('div',{class:'btnrow'},btn('the probe back',()=>{ st.lPx=DEFAULTS.lPx; st.lPy=DEFAULTS.lPy; })));
  const localTag=h('div',{class:'tag'}); gLocal.appendChild(localTag);

  /* ---- the gradient ---- */
  const gGrad=h('div',{class:'grp'},h('h3',null,'the gradient'));
  gGrad.appendChild(chipRow(LANDS.map(o=>({id:o.id,name:o.name})),'gLand'));
  gGrad.appendChild(chipRow(GRAD_MODES,'gMode'));
  gGrad.appendChild(h('div',{class:'checks'},checkbox('gCurl','integrate the general field instead')));
  const gCamRow=h('div',{class:'btnrow'},btn('turn it back',()=>{ st.camTheta=DEFAULTS.camTheta; st.camPhi=DEFAULTS.camPhi; }));
  gGrad.appendChild(gCamRow);
  gGrad.appendChild(h('div',{class:'btnrow'},btn('the probe back',()=>{ st.gPx=DEFAULTS.gPx; st.gPy=DEFAULTS.gPy; })));
  const gradTag=h('div',{class:'tag'}); gGrad.appendChild(gradTag);

  /* ---- the divergence ---- */
  const gDiv=h('div',{class:'grp'},h('h3',null,'the divergence'));
  gDiv.appendChild(chipRow(DIV_MODES,'dMode'));
  const dChRows=[slider('dLr','the loop’s radius',LIM.dLr[0],LIM.dLr[1],0.01,v=>numF(v,2)),
    h('div',{class:'btnrow'},btn('the charges back',()=>{ CHARGES=CHARGES0.map(c=>c.slice()); st.dLx=DEFAULTS.dLx; st.dLy=DEFAULTS.dLy; st.dLr=DEFAULTS.dLr; }))];
  dChRows.forEach(r=>gDiv.appendChild(r));
  const dFlRows=[slider('dMix','compressible to incompressible',LIM.dMix[0],LIM.dMix[1],0.01,v=>numF(v,2)),
    h('div',{class:'checks'},checkbox('dPlay','the blobs move')),h('div',{class:'btnrow'},btn('start the blobs again',()=>{ SIM.blobKey=''; }))];
  dFlRows.forEach(r=>gDiv.appendChild(r));
  const dThRows=[chipRow(REGIONS.map(r=>({id:r.id,name:r.name})),'dRegion'),slider('dN','quadrature points n',LIM.dN[0],LIM.dN[1],1,v=>String(Math.round(v)))];
  dThRows.forEach(r=>gDiv.appendChild(r));
  const divTag=h('div',{class:'tag'}); gDiv.appendChild(divTag);

  /* ---- the curl ---- */
  const gCurl=h('div',{class:'grp'},h('h3',null,'the curl'));
  gCurl.appendChild(chipRow(CURL_MODES,'cMode'));
  const cWhRows=[chipRow(ZOO.map(z=>({id:z.id,name:z.name})),'cZoo'),h('div',{class:'checks'},checkbox('cPlay','the wheels move')),
    h('div',{class:'btnrow'},btn('start the wheels again',()=>{ SIM.wheelKey=''; SIM.t=0; }))];
  cWhRows.forEach(r=>gCurl.appendChild(r));
  const cWiRows=[slider('cI1','the first wire’s current (A)',LIM.cI[0],LIM.cI[1],0.5,v=>numF(v,1)),slider('cI2','the second wire’s current (A)',LIM.cI[0],LIM.cI[1],0.5,v=>numF(v,1)),
    slider('cLr','the loop’s radius (mm)',LIM.cLr[0],LIM.cLr[1],0.1,v=>numF(v,1)),
    h('div',{class:'btnrow'},btn('the wires back',()=>{ WIRES=WIRES0.map(w=>w.slice()); st.cI1=DEFAULTS.cI1; st.cI2=DEFAULTS.cI2; st.cLx=DEFAULTS.cLx; st.cLy=DEFAULTS.cLy; st.cLr=DEFAULTS.cLr; }))];
  cWiRows.forEach(r=>gCurl.appendChild(r));
  const cWgRows=[slider('cG','the spin Γ/(4πUR)',LIM.cG[0],LIM.cG[1],0.01,v=>numF(v,2))];
  cWgRows.forEach(r=>gCurl.appendChild(r));
  const curlTag=h('div',{class:'tag'}); gCurl.appendChild(curlTag);

  /* ---- in three dimensions ---- */
  const gSpace=h('div',{class:'grp'},h('h3',null,'in three dimensions'));
  gSpace.appendChild(chipRow(SPACE_MODES,'sMode'));
  gSpace.appendChild(chipRow(F3.map(o=>({id:o.id,name:o.name})),'sField'));
  const sPRows=[slider('sPx','the point, x',LIM.sP[0],LIM.sP[1],0.05,v=>numF(v,2)),slider('sPy','the point, y',LIM.sP[0],LIM.sP[1],0.05,v=>numF(v,2)),slider('sPz','the point, z',LIM.sP[0],LIM.sP[1],0.05,v=>numF(v,2))];
  sPRows.forEach(r=>gSpace.appendChild(r));
  const sGRows=[slider('sR','the sphere’s radius',LIM.sR[0],LIM.sR[1],0.01,v=>numF(v,2))];
  sGRows.forEach(r=>gSpace.appendChild(r));
  const sSRows=[slider('sAl','the loop’s tilt from z (°)',0,180,1,v=>numF(v*180/PI,0),null,degMap),slider('sBe','its azimuth (°)',-180,180,1,v=>numF(v*180/PI,0),null,degMap),
    slider('sRho','the loop’s radius',LIM.sRho[0],LIM.sRho[1],0.01,v=>numF(v,2)),slider('sH','the cap’s height',LIM.sH[0],LIM.sH[1],0.01,v=>numF(v,2))];
  sSRows.forEach(r=>gSpace.appendChild(r));
  gSpace.appendChild(h('div',{class:'btnrow'},btn('turn it back',()=>{ st.cam3Theta=DEFAULTS.cam3Theta; st.cam3Phi=DEFAULTS.cam3Phi; })));
  const spaceTag=h('div',{class:'tag'}); gSpace.appendChild(spaceTag);

  /* ---- the decomposition ---- */
  const gHelm=h('div',{class:'grp'},h('h3',null,'the decomposition'));
  gHelm.appendChild(chipRow(HELM_PRESETS,'hPreset'));
  const hBRows=[chipRow(BUMP_KINDS,'hBump'),h('div',{class:'btnrow'},btn('the bumps back',()=>{ HBUMPS={src:HSRC0.map(b=>b.slice()),vtx:HVTX0.map(b=>b.slice())}; }))];
  hBRows.forEach(r=>gHelm.appendChild(r));
  const helmTag=h('div',{class:'tag'}); gHelm.appendChild(helmTag);

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v;
      CHARGES=CHARGES0.map(c=>c.slice()); WIRES=WIRES0.map(w=>w.slice()); HBUMPS={src:HSRC0.map(b=>b.slice()),vtx:HVTX0.map(b=>b.slice())}; simReset();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),h('div',{class:'src',html:SRC_LINE}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),h('div',{id:'phys'}));
  [gLocal,gGrad,gDiv,gCurl,gSpace,gHelm,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncPanel(){
    const v=st.view;
    gLocal.hidden=v!=='local'; gGrad.hidden=v!=='grad'; gDiv.hidden=v!=='div'; gCurl.hidden=v!=='curl'; gSpace.hidden=v!=='space'; gHelm.hidden=v!=='helm';
    /* the rows a state does not use are hidden, never left live and ignored */
    gCamRow.hidden=st.gMode!=='surface';
    dChRows.forEach(r=>{ r.hidden=st.dMode!=='charges'; }); dFlRows.forEach(r=>{ r.hidden=st.dMode!=='flow'; }); dThRows.forEach(r=>{ r.hidden=st.dMode!=='theorem'; });
    cWhRows.forEach(r=>{ r.hidden=st.cMode!=='wheels'; }); cWiRows.forEach(r=>{ r.hidden=st.cMode!=='wires'; }); cWgRows.forEach(r=>{ r.hidden=st.cMode!=='wing'; });
    sGRows.forEach(r=>{ r.hidden=st.sMode!=='gauss'; }); sSRows.forEach(r=>{ r.hidden=st.sMode!=='stokes'; });
    hBRows.forEach(r=>{ r.hidden=st.hPreset!=='bumps'; });
    for(const k in rows) rows[k].sync();
    localTag.innerHTML='press the map to move the probe; press the lower-left plot to set r';
    gradTag.innerHTML=st.gMode==='surface'?'drag the surface to turn it':'press the map to move the probe, where the descent starts';
    divTag.innerHTML=st.dMode==='charges'?'drag a charge; press elsewhere to move the loop':st.dMode==='flow'?'press the map to drop a blob':'press the lower plot to set n';
    curlTag.innerHTML=st.cMode==='wheels'?'press the map to drop a wheel':st.cMode==='wires'?'drag a wire; press elsewhere to move the loop':'the spin sets the circulation Γ';
    spaceTag.innerHTML='drag the picture to turn it';
    helmTag.innerHTML=st.hPreset==='bumps'?'press the left square to put one down':'the field and its three parts';
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space starts or stops what moves';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='local'?'press the map to move the probe · space stops the parcel · 1–6 switch views'
        :v==='grad'?(st.gMode==='surface'?'drag to turn the surface · 1–6 switch views':'press the map to move the probe · 1–6 switch views')
        :v==='div'?'press the map · space stops the blobs · 1–6 switch views':v==='curl'?'press the map · space stops the wheels · 1–6 switch views'
        :v==='space'?'drag to turn the view · 1–6 switch views':'press the left square · 1–6 switch views';
      infoEl.innerHTML=infoFor(M);
      physEl.innerHTML=derivFor(M);
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ syncChips(); syncPanel(); dirty=true; refresh(); }
    if(DRAG.what) canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  /* a drag updates only the readout and the picture as it goes: the prose and the calculation catch up on release */
  const up=()=>{ const was=!!DRAG.what; canvas.classList.remove('dragging'); S.pointer('up',0,0); if(was){ syncChips(); syncPanel(); refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    const tg=e.target&&e.target.tagName;
    if(e.key===' '&&tg!=='INPUT'&&tg!=='BUTTON'){ e.preventDefault();
      if(st.view==='local') st.lPlay=!st.lPlay;
      else if(st.view==='div'&&st.dMode==='flow') st.dPlay=!st.dPlay;
      else if(st.view==='curl'&&st.cMode==='wheels') st.cPlay=!st.cPlay;
      syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)&&tg!=='INPUT') setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    const advanced=S.step();
    if(advanced){ dirty=false; refresh(); }
    else if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* ---- the prose: every number in it is computed here and pinned in selfTest; every date and name is quoted from the
   articles listed in build_dgc/data/sources.json, whose needles check_sources.py finds verbatim ---- */
const SRC_LINE='Numbers: computed on the page and pinned to build_dgc/derive.py (sympy exact, mpmath at 25 to 40 figures, numpy, scipy), which shares no code with it. μ₀ = 1.256 637 061 27 × 10⁻⁶ N A⁻² from NIST (CODATA 2022); the line charges are counted in charge per length over ε₀, so ε₀ never enters. History: the English Wikipedia articles on the curl, the nabla symbol, the divergence theorem, Gauss’s law, Green’s and Stokes’ theorems, the Helmholtz decomposition, Ampère’s law, d’Alembert’s paradox, the Kutta–Joukowski theorem and the named flows (fetched 2026-09-27), each claim quoted verbatim in build_dgc/data/sources.json.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }

function infoFor(M){
  const v=M.view;
  if(v==='local') return '<p>A vector field gives an arrow at every point. Near any one point p it is, to first order, its value there plus a linear map: v(p + d) ≈ v(p) + J d, where J, the Jacobian, holds the four slopes ∂P/∂x, ∂P/∂y, ∂Q/∂x, ∂Q/∂y. That map splits in exactly one way into three motions of the neighbours relative to p: a uniform expansion at the rate div/2 in every direction, a rigid rotation at the rate curl/2, and a shear S that stretches along one axis and squeezes along the other without changing area or turning. The divergence is the trace of J; the curl is ∂Q/∂x − ∂P/∂y.</p>'+
    '<p>Two integrals measure them without derivatives: the flux out of a small circle is its area times the divergence, and the circulation round it is its area times the curl, both with a correction of order r² that the plot below shows vanishing. The point vortex has no curl anywhere you can put the probe, yet a circle round its centre has circulation 2π: the curl is all at one point. The name curl was first suggested by James Clerk Maxwell in 1871; the idea was used by James MacCullagh in an optical field theory in 1839. The symbol ∇ was named nabla, after the Greek word for a Phoenician harp of that shape, by William Robertson Smith in an 1870 letter to Peter Guthrie Tait.</p>';
  if(v==='grad') return '<p>A landscape φ(x, y) has a gradient ∇φ = (∂φ/∂x, ∂φ/∂y) at every point: the direction of steepest ascent, as long as the slope there. The slope in any other direction u is ∇φ·u, so it is largest along ∇φ, zero along the contour, and the gradient crosses every contour at a right angle. At the probe the circle of directional derivatives shows this: the chord of the circle in the direction u is the slope that way.</p>'+
    '<p>A gradient field has no curl, since ∂²φ/∂x∂y = ∂²φ/∂y∂x, and so its line integral from A to B is φ(B) − φ(A) along every path; round any closed loop it is zero. That is what makes a potential energy possible. Tick the box to integrate a field that is not a gradient along the same two paths: the answers differ, and by exactly the curl between the paths (Green’s theorem). The path of steepest descent follows −∇φ downhill and ends on a minimum.</p>';
  if(v==='div'){ const D=M.D;
    if(D.mode==='charges') return '<p>In the plane a line of charge q (per unit length, over ε₀) makes the field E = q r̂/(2πr), whose divergence is zero everywhere except on the charge. The flux of E out of a loop is therefore the same for every loop round the charge, q, and zero for every loop that misses it: Gauss’s law, formulated by Joseph-Louis Lagrange in 1773 and followed by Carl Friedrich Gauss in 1835. Drag a charge across the loop and the flux jumps by q; move the loop and it does not change until a charge crosses it.</p>';
    if(D.mode==='flow') return '<p>A blob of dye carried by a flow changes its area at the rate of the flux out of it, which is the divergence integrated over it. At mix 0 the flow is a gradient: the cells alternate between sources, where blobs grow, and sinks, where they shrink. At mix 1 it is the Taylor–Green vortex array (G. I. Taylor and A. E. Green, 1937), which has no divergence at all: every blob is stretched and folded but keeps its area. The logarithm of each blob’s area starts out at the slope of the mean divergence under it.</p>';
    return '<p>The divergence theorem says the flux out through the boundary of a region equals the integral of the divergence over the inside. Carl Friedrich Gauss proved special cases of it in 1813, working on the attraction of an ellipsoid; Mikhail Ostrogradsky gave the first proof of the general theorem in 1826, in a study of heat flow. Both sides are computed here by quadrature, and they agree to the rounding of the arithmetic.</p>'; }
  if(v==='curl'){ const C=M.C;
    if(C.mode==='wheels') return '<p>Put a small paddle wheel in a flow: the vanes on one side are pushed harder than on the other, and it turns at half the curl. In solid rotation (curl 2) the wheels turn once per orbit, always facing the centre. In the point vortex, whose speed falls as 1/r, the curl is zero except at the centre and the wheels go round without turning at all. The Rankine vortex (after William Rankine) rotates as a solid inside its core and as a point vortex outside it; the Lamb–Oseen vortex (after Horace Lamb and Carl Wilhelm Oseen) is the smooth vortex a line vortex diffuses into. Shear flow has straight streamlines and a curl of −1: its wheels turn as they travel.</p>';
    if(C.mode==='wires') return '<p>A steady current makes a magnetic field that curls round it: B = μ₀I/(2πr) outside a straight wire. Inside a wire of radius a carrying a uniform current the field grows as r, and the curl of B is μ₀ times the current density there, zero outside: a Rankine vortex in the magnetic field. The circulation of B round any loop is μ₀ times the current through it (Ampère’s law, which James Clerk Maxwell published in 1855). A loop that cuts a wire encloses only the part of its current inside, which is why the circulation changes smoothly as the loop slides across the wire.</p>';
    return '<p>A cylinder spinning in a stream carries circulation Γ round it: the flow is faster over one side than the other, the pressure lower there, and the cylinder is pushed across the stream (the Magnus effect). Martin Kutta and Nikolai Zhukovsky (Joukowski) showed early in the twentieth century that the force per unit length on a right cylinder of any cross section is ρUΓ, across the stream. Along the stream the pressure integrates to exactly zero: in a steady inviscid flow there is no drag, the paradox Jean le Rond d’Alembert found in 1752.</p>'; }
  if(v==='space'){ const S=M.S;
    if(S.mode==='field') return '<p>In space the curl is a vector: its direction is the axis a small wheel at the point turns about, its length twice the rate. The Arnold–Beltrami–Childress flow (introduced by Arnold in 1965 and Childress in 1970) is a Beltrami field: its curl is the field itself, so the axis of rotation lies along the flow at every point. A point charge’s field has no divergence except at the charge; a source has the same divergence everywhere.</p>';
    if(S.mode==='gauss') return '<p>The flux out of a closed surface is the divergence integrated over the volume inside: Gauss’s theorem in space. For the point charge the divergence is all at the charge, so the flux is 4π whenever the sphere encloses it and zero when it does not, however large or small the sphere.</p>';
    return '<p>The circulation round a loop equals the flux of the curl through a surface bounded by it, and it does not matter which surface: the flat disk and a cap of any height give the same number, because the curl has no divergence and so no flux can leak between two surfaces on the same loop. The theorem first appears in a letter from William Thomson to George Stokes dated 2 July 1850; Stokes set it as question 8 on the 1854 Smith’s Prize examination, which is how it got his name. Green’s theorem (George Green, 1828) is its flat case.</p>'; }
  return '<p>Every smooth field on the torus is a gradient, which carries all its divergence and no curl, plus a rotational field, which carries all its curl and no divergence, plus a constant. The split is unique and the three parts are orthogonal, so their energies add. In Fourier space it is a projection: each wave’s arrow splits into the part along its wave vector (the gradient) and the part across it (the rotational part). The decomposition in three dimensions was first described by George Gabriel Stokes in 1849; Hermann von Helmholtz used it in 1858 in his work on vortex motion.</p>';
}

function derivFor(M){
  const v=M.view;
  if(v==='local'){ const L=M.L, P=L.L;
    let s='<h4>the split of J</h4>'+EQ(1,'J = ½ (∇·v) I + ½ (∇×v) R + S, &nbsp; R = (0 −1; 1 0), &nbsp; S = (s₁ s₂; s₂ −s₁)')
      +EQ(2,'s₁ = ½(∂P/∂x − ∂Q/∂y), &nbsp; s₂ = ½(∂P/∂y + ∂Q/∂x), &nbsp; det J = ¼ div² + ¼ curl² − |S|²')
      +'<p>The motion relative to p spirals when the discriminant tr² − 4 det = 4|S|² − curl² is negative, that is when the curl beats twice the shear; it is a saddle when det J &lt; 0.</p>';
    if(P) s+='<p>At the probe: div = '+num(P.div,6)+', curl = '+num(P.curl,6)+', |S| = '+num(P.S,5)+', det J = '+num(P.det,5)+', 4|S|² − curl² = '+num(P.disc,5)+': '+P.cls+'.</p>';
    s+='<h4>flux and circulation of a small circle</h4>'+EQ(3,'∮ v·n ds = πr² div + '+FR('πr⁴','8')+' ∇²(div) + O(r⁶), &nbsp; ∮ v·dl = πr² curl + '+FR('πr⁴','8')+' ∇²(curl) + O(r⁶)')
      +'<p>(integrate the Taylor series of div over the disk: the linear terms cancel by symmetry, and the quadratic ones give ¼ r² of the disk’s area times each second derivative).';
    if(P&&isFinite(L.lap[0])) s+=' Here ∇²(div) = '+num(L.lap[0],4)+' and ∇²(curl) = '+num(L.lap[1],4)+' (by a five-point stencil), so at r = '+num(L.r,3)+' the corrections are '+num(L.r*L.r*L.lap[0]/8,3)+' and '+num(L.r*L.r*L.lap[1]/8,3)+'.';
    s+=' The page integrates round the circle by the trapezoid rule, with '+L.M+' points here, more as a singular point comes close.</p>';
    s+='<h4>the parcel</h4>'+EQ(4,'d(t) = e<sup>Jt</sup> d(0), &nbsp; e<sup>Jt</sup> = e<sup>at</sup>(cosh ωt I + '+FR('sinh ωt','ω')+' N), &nbsp; a = ½ tr J, N = J − aI, ω² = ¼(4|S|² − curl²)')
      +'<p>(cos and sin when ω² &lt; 0). The parcel’s area grows as e<sup>div·t</sup>, whatever the rest of J does.</p>';
    return s; }
  if(v==='grad'){ const G=M.G, P=G.paths;
    let s='<h4>the gradient and the slopes</h4>'+EQ(1,'∇φ = (∂φ/∂x, ∂φ/∂y), &nbsp; D<sub>u</sub>φ = ∇φ · u = |∇φ| cos(θ − θ<sub>∇φ</sub>)');
    if(!G.onSing) s+='<p>At the probe φ = '+num(G.p[0],6)+', ∇φ = '+vec(G.g[0],G.g[1],5)+', the steepest slope |∇φ| = '+num(G.gn,5)+' uphill at '+numF(G.angle*DEG,2)+'° from the x axis.</p>';
    s+='<h4>the path of steepest descent</h4>'+EQ(2,'dx/ds = −∇φ/|∇φ|')+'<p>traced by RK4 at unit speed, the step shortened near the bottom, then finished by Newton’s method on ∇φ = 0 with the Hessian.'
      +(G.desc&&G.desc.min?' It ends at '+vec(G.desc.min[0],G.desc.min[1],8)+', where φ = '+num(G.desc.min[2],8)+'.':'')+'</p>';
    s+='<h4>line integrals</h4>'+EQ(3,'∫<sub>A</sub><sup>B</sup> ∇φ · dl = φ(B) − φ(A), &nbsp; ∮ v · dl = ∬ (∂Q/∂x − ∂P/∂y) dA')
      +'<p>along the straight path from A = (−2.2, −1.5) to B = (2, 1.8) and a detour through the control point (−1.8, 2.6), by 64-point Gauss–Legendre quadrature.';
    if(P.curl) s+=' For the general field they are '+num(P.I[0],10)+' and '+num(P.I[1],10)+'; their difference '+num(P.I[0]-P.I[1],10)+' is the curl integrated over the region between the paths, '+num(P.between,10)+' (Green’s theorem, the loop running anticlockwise).';
    else if(isFinite(P.dphi)) s+=' For ∇φ both are '+num(P.I[0],10)+' and '+num(P.I[1],10)+', and φ(B) − φ(A) = '+num(P.dphi,10)+'.';
    return s+'</p>'; }
  if(v==='div'){ const D=M.D;
    if(D.mode==='charges') return '<h4>Gauss in the plane</h4>'+EQ(1,'E = '+FR('q (r − r₀)','2π |r − r₀|²')+', &nbsp; ∇·E = 0 off the charge, &nbsp; ∮ E·n ds = Σ q<sub>inside</sub>')
      +'<p>The flux of one charge through a circle about it is q for every radius (the field falls as 1/r while the circle grows as r). '
      +(D.through?'The loop runs through a charge, where the integral does not exist.':'Here the flux, by the trapezoid rule with '+D.N+' points, is '+num(D.flux,10)+'; the charge inside is '+D.enclosed+'.')+'</p>';
    if(D.mode==='flow') return '<h4>the cells</h4>'+EQ(1,'v = ((a + b) sin kx cos ky, (a − b) cos kx sin ky), &nbsp; a = 1 − m, b = m, &nbsp; k = π/3')
      +EQ(2,'∇·v = 2ak cos kx cos ky, &nbsp; ∇×v = 2bk sin kx sin ky')
      +'<h4>the blobs</h4>'+EQ(3,'dA/dt = ∮ v·n ds = ∬ ∇·v dA')+'<p>Each blob is a polygon of '+BLOB_N+' points carried by RK4 in steps of '+BLOB_DT+'; its area by the shoelace formula. At the start their mean divergences are '+D.rates.map(r=>num(r,4)).join(', ')+'.</p>';
    return '<h4>the divergence theorem</h4>'+EQ(1,'∮ (P dy − Q dx) = ∬ (∂P/∂x + ∂Q/∂y) dA')
      +'<p>for the general field P = sin y + 0.3x cos(y/2), Q = sin x + 0.2xy − 0.25y on '+D.rg.name+'. The boundary integral uses the trapezoid rule in the angle on the smooth curves (Gauss–Legendre on each side of the square), the area integral Gauss–Legendre in the radius; with n = '+D.n+' they give '+num(D.flux,12)+' and '+num(D.area,12)+', against '+num(D.ref,12)+'.</p>'; }
  if(v==='curl'){ const C=M.C;
    if(C.mode==='wheels'){ let s='<h4>the vortices (circulation 2π, core radius 1)</h4>'+EQ(1,'∇×v = '+FR('1','r')+' '+FR('d(r v<sub>θ</sub>)','dr')+' for a flow round the centre')
        +'<p>Rankine: v<sub>θ</sub> = r inside the core, 1/r outside (the curl 2 inside, 0 outside). Lamb–Oseen: v<sub>θ</sub> = (1 − e<sup>−r²</sup>)/r, curl 2e<sup>−r²</sup>. Point vortex: 1/r, curl 0 for r &gt; 0. Rotation: v<sub>θ</sub> = r, curl 2.</p>';
      s+='<h4>the wheels</h4>'+EQ(2,'dx/dt = v, &nbsp; dα/dt = ½ ∇×v')+'<p>integrated together by RK4 in steps of '+WHEEL_DT+'. In one orbit of radius r₀ a wheel turns ½ curl × 2πr₀/v<sub>θ</sub>: once in the Rankine core, not at all outside it.</p>';
      return s; }
    if(C.mode==='wires') return '<h4>Ampère</h4>'+EQ(1,'B = '+FR('μ₀ I','2π')+' × (r/a² inside, 1/r outside), &nbsp; ∇×B = μ₀ J, &nbsp; ∮ B·dl = μ₀ I<sub>inside</sub>')
      +'<p>with μ₀ = '+num(SRC.constants.mu0,12)+' N A⁻² (CODATA 2022) and a = '+numF(WIRE_A/MM,1)+' mm. A wire the loop cuts contributes I times the area of its disk inside the loop over πa² (the lens of two circles). Here ∮B·dl = '+num(C.circ,10)+' T m and μ₀ I<sub>inside</sub> = '+num(C.mu0I,10)+' T m, with I<sub>inside</sub> = '+num(C.Iin,8)+' A; the integral runs in Gauss–Legendre pieces between the points where the loop crosses a wire’s surface.</p>';
    return '<h4>the flow</h4>'+EQ(1,'w(z) = U(z + R²/z) + '+FR('iΓ','2π')+' ln z, &nbsp; the surface speed 2U|sin θ + Γ/(4πUR)|')
      +EQ(2,'C<sub>p</sub> = 1 − 4 (sin θ + g)², &nbsp; g = Γ/(4πUR) = '+numF(C.g,3))
      +'<p>(with Γ clockwise). The stagnation points sit at sin θ = −g while g ≤ 1 and leave the surface after. The pressure integrated round the surface gives the lift '+num(C.force[1],10)+' per unit length (U = R = ρ = 1) against ρUΓ = '+num(C.Gamma,10)+', and the drag '+num(C.force[0],3)+'.</p>'; }
  if(v==='space'){ const S=M.S;
    if(S.mode==='field') return '<h4>the curl in space</h4>'+EQ(1,'∇×v = (∂W/∂y − ∂Q/∂z, ∂P/∂z − ∂W/∂x, ∂Q/∂x − ∂P/∂y)')
      +(S.v?'<p>At the probe v = '+vec3(S.v.slice(0,3),5)+', ∇×v = '+vec3(S.parts.curl,5)+' and ∇·v = '+num(S.parts.div,5)+'.</p>':'<p>The probe sits on the charge.</p>')
      +'<p>The ABC flow with A = B = C = 1 is (sin z + cos y, sin x + cos z, sin y + cos x); its curl is itself.</p>';
    if(S.mode==='gauss') return '<h4>Gauss</h4>'+EQ(1,'∯ v·n dA = ∭ ∇·v dV')+'<p>The surface integral is Gauss–Legendre in cos θ times the trapezoid rule in φ (48 × 96 points), the volume integral Gauss–Legendre in the radius over spheres.'
      +(S.through?' The sphere runs through the charge.':' Here they are '+num(S.flux,12)+' and '+num(S.vol,12)+'.')+'</p>';
    return '<h4>Stokes</h4>'+EQ(1,'∮ v·dl = ∬<sub>disk</sub> (∇×v)·n dA = ∬<sub>cap</sub> (∇×v)·n dA')
      +'<p>The cap is the part of a sphere of radius (ρ² + h²)/2h through the loop, bulging a height h along the normal. '
      +(S.S?'Here the three are '+num(S.S.circ,12)+', '+num(S.S.disk,12)+' and '+num(S.S.cap,12)+'.':'The point charge’s curl is zero where it is defined.')+'</p>'; }
  const Hm=M.H;
  return '<h4>the projection</h4>'+EQ(1,'v̂(k) = '+FR('k (k·v̂)','|k|²')+' + (v̂ − '+FR('k (k·v̂)','|k|²')+'), &nbsp; φ̂ = −i '+FR('k·v̂','|k|²')+', &nbsp; ψ̂ = −i '+FR('k × v̂','|k|²'))
    +'<p>on a '+HN+' × '+HN+' grid by the fast Fourier transform (radix 2), the mean h = v̂(0) set apart. The parts sum back to the field to '+sigf(Math.max(Hm.back,1e-17),1)+', the curl of the gradient part is at most '+sigf(Math.max(Hm.curlOfGrad,1e-17),1)+' and the divergence of the rotational part at most '+sigf(Math.max(Hm.divOfRot,1e-17),1)+'; the energies are '+num(Hm.energy[0],6)+' = '+num(Hm.energy[1],6)+' + '+num(Hm.energy[2],6)+' + '+num(Hm.S.h[0]*Hm.S.h[0]+Hm.S.h[1]*Hm.S.h[1],6)+'.</p>';
}

 *  selfTest — headless verification.  REF is build_cg/refvals.json,   *
 *  the printed output of derive.py (sympy, numpy, mpmath), read in    *

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null, path=[], cur=null;       /* a stroke keeps its path, in canvas pixels */
  let clipR=null;                                           /* the current clip, [x0, y0, x1, y1] in canvas pixels */
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base,c:clipR&&clipR.slice()}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; clipR=s.c; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; cur=[app(a[0],a[1]),app(a[0]+a[2],a[1]),app(a[0]+a[2],a[1]+a[3]),app(a[0],a[1]+a[3]),app(a[0],a[1])]; path.push(cur); cur=null; },
    arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; const [x,y,r,a0,a1,ccw]=a; let sw=a1-a0;
      if(ccw){ if(sw>0) sw-=TAU*Math.ceil(sw/TAU); } else if(sw<0) sw+=TAU*Math.ceil(-sw/TAU);
      sw=Math.max(-TAU,Math.min(TAU,sw)); if(!cur){ cur=[]; path.push(cur); }
      for(let i=0;i<=32;i++){ const t=a0+sw*i/32; cur.push(app(x+r*Math.cos(t),y+r*Math.sin(t))); } },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:''+ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle,paths:path.map(p=>p.slice()),clip:clipR&&clipR.slice()}); },
    clip(){ const P=path.flat(); if(!P.length) return; const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]);
      const r=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
      clipR=clipR?[Math.max(r[0],clipR[0]),Math.max(r[1],clipR[1]),Math.min(r[2],clipR[2]),Math.min(r[3],clipR[3])]:r; },
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

    close(stretchOf(L.J,L.tp),4,1e-9,'when it has stretched four-fold'); let mx=0; for(let i=0;i<=200;i++) mx=Math.max(mx,stretchOf(L.J,L.tp*i/200)); ok(mx<=4+1e-9,'and never more before');
    const E=expJ(L.J,0.3), a=E[0]*E[0]+E[2]*E[2], c=E[1]*E[1]+E[3]*E[3], d=E[0]*E[3]-E[1]*E[2]; close(stretchOf(L.J,0.3)*Math.sqrt(a+c-stretchOf(L.J,0.3)**2),Math.abs(d),1e-9*Math.abs(d),'the two singular values multiply to |det exp(Jt)| = e^(div t)'); });
  withState({view:'div',dMode:'flow'},()=>{ buildModel(); const A0=SIM.blobs[0].A0; for(let i=0;i<25;i++) runStep(ST); ok(SIM.blobs[0].hist.length===26&&polyArea(SIM.blobs[0].p)>A0,'the blob at the source grows as the clock runs');
    close(SIM.blobT,0.5,1e-12,'the blobs’ clock runs in steps of '+BLOB_DT);
    for(let i=0;i<200;i++) runStep(ST); ok(SIM.blobT<=BLOB_TMAX+1e-9,'and starts them over after '+BLOB_TMAX); });
  withState({view:'curl'},()=>{ buildModel(); const w0=Object.assign({},SIM.wheels[0]); for(let i=0;i<50;i++) runStep(ST); const w=SIM.wheels[0];
    close(Math.hypot(w.x,w.y),Math.hypot(w0.x,w0.y),1e-9,'a wheel in the Rankine core keeps its radius'); close(w.a,1.0,1e-9,'and turns with the flow (curl/2 = 1 for a time 1)'); });
  withState({view:'curl',cZoo:'shear'},()=>{ buildModel(); for(let i=0;i<400;i++) runStep(ST); ok(SIM.wheels.every(w=>Math.abs(w.x)<=WIN),'a wheel carried out of the window starts again'); });
  for(const v of ['grad','space','helm']) withState({view:v},()=>{ ok(!runStep(ST),v+' stands still'); });
  withState({view:'div'},()=>{ ok(!runStep(ST),'the charges stand still'); });

  /* ---------- 17. the pointer ---------- */
  const shot=(over,W,H)=>withState(over,()=>{ const c=makeShot(W||1100,H||712); drawView(c,W||1100,H||712,buildModel()); return {ops:c.ops,hit:HIT.slice()}; });
  const pressAt=(over,kind,fx,fy,moveTo)=>withState(over,()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const h2=HIT.find(q=>q.kind===kind);
    if(!h2) return {missing:true}; const S=makeScene({getContext:()=>c}); S.pointer('down',h2.b.x+h2.b.w*fx,h2.b.y+h2.b.h*fy);
    if(moveTo) S.pointer('move',h2.b.x+h2.b.w*moveTo[0],h2.b.y+h2.b.h*moveTo[1]); S.pointer('up',0,0);
    return {st:Object.assign({},ST),charges:CHARGES.map(q=>q.slice()),wires:WIRES.map(q=>q.slice()),bumps:JSON.parse(JSON.stringify(HBUMPS)),blobs:SIM.blobs?SIM.blobs.length:0,wheels:SIM.wheels?SIM.wheels.length:0}; });
  { const r=pressAt({view:'local'},'lmap',0.25,0.4); close(r.st.lPx,-1.5,1e-9,'a press on the map moves the probe: x'); close(r.st.lPy,0.6,1e-9,'and y'); }
  { const r=pressAt({view:'local'},'lr',0.5,0.5); close(r.st.lR,0.01*Math.sqrt(160),1e-12,'a press half-way along the lower-left plot sets r (log scale)'); }
  { const r=pressAt({view:'grad'},'gmap',0.75,0.25); close(r.st.gPx,1.5,1e-9,'a press on the landscape moves the probe'); close(r.st.gPy,1.5,1e-9,'and y'); }
  { const r=pressAt({view:'div'},'dmap',0.1,0.9); close(r.st.dLx,-2.4,1e-9,'a press away from the charges moves the loop'); close(r.st.dLy,-2.4,1e-9,'and y'); }
  { const c0=CHARGES0[0], u=(c0[1]+WIN)/(2*WIN), w=(WIN-c0[2])/(2*WIN); const r=pressAt({view:'div'},'dmap',u,w,[u+0.1,w]);
    close(r.charges[0][1],c0[1]+0.6,1e-9,'a press on a charge picks it up and a drag moves it'); eq(r.st.dLx,DEFAULTS.dLx,'and leaves the loop where it was'); }
  { const c0=CHARGES0[2], u=(c0[1]+WIN)/(2*WIN)+0.006, w=(WIN-c0[2])/(2*WIN)-0.004; const r=pressAt({view:'div'},'dmap',u,w,[u+0.1,w+0.05]);
    close(r.charges[2][1],c0[1]+0.6,1e-9,'a charge grabbed off its centre keeps the offset: a drag of 0.6 moves it 0.6'); close(r.charges[2][2],c0[2]-0.3,1e-9,'and of −0.3 in y, −0.3'); }
  { const w0=WIRES0[0], u=(w0[1]/MM+30)/60+0.01, w=(30-w0[2]/MM)/60+0.01; const r=pressAt({view:'curl',cMode:'wires'},'wmap',u,w,[u+0.1,w]);
    close(r.wires[0][1],w0[1]+6*MM,1e-12,'a wire grabbed off its centre moves by the drag, 6 mm'); close(r.wires[0][2],w0[2],1e-12,'and not across it'); }
  { const r=pressAt({view:'div',dMode:'flow'},'fmap',0.5,0.5); eq(r.blobs,5,'a press on the flow drops a fifth blob'); }
  { const r=pressAt({view:'div',dMode:'theorem'},'dn',0.5,0.5); eq(r.st.dN,17,'a press half-way along the error plot sets n = 17'); }
  { const r=pressAt({view:'curl'},'cmap',0.2,0.2); eq(r.wheels,5,'a press puts a fifth wheel down'); }
  { const w0=WIRES0[1], u=(w0[1]/MM+30)/60, w=(30-w0[2]/MM)/60; const r=pressAt({view:'curl',cMode:'wires'},'wmap',u,w,[u,w+0.1]);
    close(r.wires[1][2],w0[2]-6*MM,1e-12,'a press on a wire picks it up and a drag moves it'); }
  { const r=pressAt({view:'curl',cMode:'wires'},'wmap',0.9,0.1); close(r.st.cLx,24,1e-9,'a press away from the wires moves the loop (mm)'); close(r.st.cLy,24,1e-9,'and y'); }
  { const r=pressAt({view:'helm',hPreset:'bumps',hBump:'ccw'},'hmap',0.5,0.5); eq(r.bumps.vtx.length,3,'a press puts down a vortex'); close(r.bumps.vtx[2][1],PI,1e-9,'where it was pressed'); }
  { const r=pressAt({view:'helm'},'hmap',0.5,0.5); eq(r.bumps.src.length+r.bumps.vtx.length,4,'and nothing on the other presets'); }
  { const r=withState({view:'space'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const h2=HIT.find(q=>q.kind==='cam'), S=makeScene({getContext:()=>c});
      const th0=ST.cam3Theta, x0=h2.b.x+h2.b.w/2, y0=h2.b.y+h2.b.h/2; S.pointer('down',x0,y0); S.pointer('move',x0+50,y0+30); S.pointer('up',0,0); return {dth:ST.cam3Theta-th0,ph:ST.cam3Phi}; });
    close(r.dth,-50*0.008,1e-12,'a drag turns the view in space'); close(r.ph,DEFAULTS.cam3Phi+30*0.006,1e-12,'and tilts it'); }
  { const r=withState({view:'grad',gMode:'surface'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); const h2=HIT.find(q=>q.kind==='cam'), S=makeScene({getContext:()=>c});
      const x0=h2.b.x+h2.b.w/2, y0=h2.b.y+h2.b.h/2; S.pointer('down',x0,y0); S.pointer('move',x0-20,y0); S.pointer('up',0,0); return {th:ST.camTheta,th3:ST.cam3Theta}; });
    close(r.th,DEFAULTS.camTheta+20*0.008,1e-12,'the surface turns its own camera'); eq(r.th3,DEFAULTS.cam3Theta,'not the one in space'); }

  /* ---------- 18. the drawing: every view and mode at four sizes ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[...FIELDS2.map(f=>['local '+f.id,{view:'local',lField:f.id}]),['local div',{view:'local',lHeat:'div'}],['local curl cells',{view:'local',lHeat:'curl',lField:'cells'}],['local zero map',{view:'local',lHeat:'curl',lField:'vortex'}],
    ['local r min',{view:'local',lR:0.02}],['local r max',{view:'local',lR:1.6}],['local corner',{view:'local',lPx:3,lPy:-3,lR:1.6}],['local pair source',{view:'local',lField:'pair',lPx:-1.2,lPy:0.5}],['local on sing',{view:'local',lField:'vortex',lPx:0,lPy:0}],['local no streams',{view:'local',lStream:false}],
    ...LANDS.map(l=>['grad '+l.id,{view:'grad',gLand:l.id}]),['grad curl',{view:'grad',gCurl:true}],['grad surface',{view:'grad',gMode:'surface'}],['grad surface monkey',{view:'grad',gMode:'surface',gLand:'monkey',camPhi:1.4}],['grad corner',{view:'grad',gPx:2.9,gPy:-2.9}],
    ['div',{view:'div'}],['div small loop',{view:'div',dLr:0.1,dLx:-1.3,dLy:0.2}],['div loop edge',{view:'div',dLx:2.6,dLy:-2.4,dLr:2}],['div flow',{view:'div',dMode:'flow'}],['div flow 1',{view:'div',dMode:'flow',dMix:1}],
    ['div flow late',{view:'div',dMode:'flow'},190],['div flow 1 late',{view:'div',dMode:'flow',dMix:1},190],...REGIONS.map(r=>['div '+r.id,{view:'div',dMode:'theorem',dRegion:r.id}]),['div n2',{view:'div',dMode:'theorem',dN:2}],
    ...ZOO.map(z=>['curl '+z.id,{view:'curl',cZoo:z.id}]),['curl wheels late',{view:'curl'},300],['curl shear late',{view:'curl',cZoo:'shear'},300],['curl wires',{view:'curl',cMode:'wires'}],['curl wires edge',{view:'curl',cMode:'wires',cLx:25,cLy:-25,cLr:12}],['curl wires 0',{view:'curl',cMode:'wires',cI1:0,cI2:0}],['curl wires big',{view:'curl',cMode:'wires',cLr:28}],['curl wing',{view:'curl',cMode:'wing'}],['curl wing 0',{view:'curl',cMode:'wing',cG:0}],['curl wing 1.6',{view:'curl',cMode:'wing',cG:1.6}],
    ...F3.map(f=>['space '+f.id,{view:'space',sField:f.id}]),['space gauss',{view:'space',sMode:'gauss'}],['space gauss charge',{view:'space',sMode:'gauss',sField:'charge'}],['space stokes',{view:'space',sMode:'stokes'}],['space stokes flat',{view:'space',sMode:'stokes',sH:0.05,sAl:0}],['space top',{view:'space',cam3Phi:1.45}],
    ...HELM_PRESETS.map(p=>['helm '+p.id,{view:'helm',hPreset:p.id}])];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over,steps] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      if(steps){ buildModel(); for(let i=0;i<steps;i++) runStep(ST); }
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[nm]=Math.max(tDraw[nm]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke'), fills=c.ops.filter(o=>o.op==='fill');
      ok(strokes.length+fills.length>=10&&texts.length>=3,nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+fills.length+' fills, '+texts.length+' texts)');
      { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/\^/.test(t.t)){ bad='a caret power: "'+t.t.slice(0,40)+'"'; break; }
        if(/\d[eE][-+]?\d/.test(t.t)){ bad='a raw exponent: "'+t.t.slice(0,40)+'"'; break; }
        if(/\S_\S/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
      /* a stroke that runs from inside a map to beyond its frame is clipped to the map (marker dots, under 12 px, may overhang) */
      let stray=null;
      const maps=HIT.filter(q=>/map$/.test(q.kind)).map(q=>q.b);
      for(const o of strokes){ if(!o.paths||stray) continue; const P=o.paths.flat(); if(P.length<2) continue;
        const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]); if(Math.max(...xs)-Math.min(...xs)<12&&Math.max(...ys)-Math.min(...ys)<12) continue;
        for(const mb of maps){ const inside=P.some(p=>p[0]>mb.x+0.5&&p[0]<mb.x+mb.w-0.5&&p[1]>mb.y+0.5&&p[1]<mb.y+mb.h-0.5), outside=P.some(p=>p[0]<mb.x-1.5||p[0]>mb.x+mb.w+1.5||p[1]<mb.y-1.5||p[1]>mb.y+mb.h+1.5);
          if(inside&&outside&&!(o.clip&&o.clip[0]>=mb.x-0.5&&o.clip[1]>=mb.y-0.5&&o.clip[2]<=mb.x+mb.w+0.5&&o.clip[3]<=mb.y+mb.h+0.5)){ const q=P.find(p=>p[0]<mb.x-1.5||p[0]>mb.x+mb.w+1.5||p[1]<mb.y-1.5||p[1]>mb.y+mb.h+1.5); stray=o.style+' reaches ('+fmt(q[0],0)+', '+fmt(q[1],0)+')'; break; } } }
      ok(!stray,nm+' '+W+'x'+H+' nothing crosses a map\u2019s frame unclipped ('+(stray||'ok')+')');
      let across=null;
      for(const L of LABELS){ if(L.seq===undefined) continue;
        for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
        if(across) break; }
      ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
    });
  }
  /* the trace-determinant plot: the probe inside it, clear of the edges and of the regions' names */
  const TD_STATES=[...FIELDS2.map(f=>({view:'local',lField:f.id})),{view:'local',lField:'pair',lPx:-1.2,lPy:0.5},{view:'local',lField:'spiral',lPx:-0.2,lPy:0.3},{view:'local',lField:'general',lPx:-2,lPy:2},{view:'local',lField:'general',lPx:2.4,lPy:-1.4},{view:'local',lField:'cells',lPx:1,lPy:1}];
  for(const over of TD_STATES) for(const [W,H] of [[1100,700],[1400,820]]) withState(over,()=>{ TRDET=null; const c=makeShot(W,H), M=buildModel(); drawView(c,W,H,M); const L=M.L.L; if(!L) return;
    ok(!!TRDET,JSON.stringify(over)+' '+W+'x'+H+': the tr-det plot is drawn'); if(!TRDET) return;
    const T=TRDET, fx=(L.div-T.tlo)/(T.thi-T.tlo), fy=(L.det-T.dlo)/(T.dhi-T.dlo);
    ok(fx>0.05&&fx<0.95&&fy>0.05&&fy<0.95,JSON.stringify(over)+' '+W+'x'+H+': the probe (tr '+fmt(L.div,3)+', det '+fmt(L.det,3)+') sits inside the tr-det plot');
    const X=xOf(T.b,L.div,T.tlo,T.thi), Y=yOf(T.b,L.det,T.dlo,T.dhi);
    const hitLab=c.ops.filter(o=>o.op==='text'&&/^(saddles|spirals|nodes)$/.test(o.t)).find(o=>X+5>o.bb[0]&&X-5<o.bb[2]&&Y+5>o.bb[1]&&Y-5<o.bb[3]);
    ok(!hitLab,JSON.stringify(over)+' '+W+'x'+H+': and clear of the regions\u2019 names'+(hitLab?' (on "'+hitLab.t+'")':''));
    const sad=c.ops.find(o=>o.op==='text'&&o.t==='saddles'), mid=T.b.x+T.b.w/2;
    ok(!!sad&&(L.div<0?(sad.bb[0]+sad.bb[2])/2>mid:(sad.bb[0]+sad.bb[2])/2<mid),JSON.stringify(over)+' '+W+'x'+H+': the names sit on the side away from the probe (div '+fmt(L.div,3)+')'); });
  /* a drag on the canvas never re-lays the stage: the boxes are the same wherever the probe, the loop, a charge, a wire
     or the camera is (a caption that named the parcel's time moved the map under the pointer) */
  const LAYOUT_PAIRS=[[{view:'local'},{view:'local',lPx:-1.5,lPy:0.6}],[{view:'local',lField:'vortex'},{view:'local',lField:'vortex',lPx:0.1,lPy:0.2}],[{view:'local',lField:'pair'},{view:'local',lField:'pair',lPx:-1.2,lPy:0.5}],
    [{view:'grad'},{view:'grad',gPx:1.5,gPy:1.5}],[{view:'grad',gMode:'surface'},{view:'grad',gMode:'surface',camTheta:1.2,camPhi:1.3}],
    [{view:'div'},{view:'div',dLx:-2.4,dLy:-2.4}],[{view:'curl',cMode:'wires'},{view:'curl',cMode:'wires',cLx:24,cLy:24}],[{view:'space'},{view:'space',cam3Theta:2,cam3Phi:-1}],[{view:'helm',hPreset:'bumps'},{view:'helm',hPreset:'bumps',hBump:'cw'}]];
  for(const [A,B] of LAYOUT_PAIRS) for(const [W,H] of [[1100,700],[820,520]]){ const box2=o=>withState(o,()=>{ const c=makeShot(W,H); drawView(c,W,H,buildModel()); return JSON.stringify(HIT.map(h=>[h.kind,h.b.x,h.b.y,h.b.w,h.b.h])); });
    eq(box2(B),box2(A),JSON.stringify(B)+' '+W+'x'+H+': the stage keeps its layout'); }
  const capOf=M=>JSON.stringify(M.view==='local'?localCaption(M):M.view==='grad'?gradCaption(M):M.view==='div'?divCaption(M.D):M.view==='curl'?curlCaption(M.C):M.view==='space'?spaceCaption(M.S):helmCaption(M.H));
  /* (the bump chip names what a press puts down in the caption: a panel choice, not a drag) */
  for(const [A,B] of LAYOUT_PAIRS.filter(p=>!('hBump' in p[1]))) eq(withState(B,()=>capOf(buildModel())),withState(A,()=>capOf(buildModel())),JSON.stringify(B)+': and its caption, word for word');
  withState({view:'local',lField:'pair',lPx:-1.2,lPy:0.5},()=>{ const M=buildModel(); has(readoutHTML(M),numF(M.L.tp,2)+' of each 1.6 s','the readout says how long the parcel runs near the pair\u2019s source'); });
  withState({view:'local',lField:'rotation'},()=>{ has(readoutHTML(buildModel()),'the whole 1.6 s','and that rotation\u2019s runs the whole time'); });
  /* the plane maps keep equal aspect: circles are round */
  for(const [W,H] of SIZES) for(const v of [{view:'local'},{view:'div'},{view:'curl'}]){ const S=shot(v,W,H), h2=S.hit.find(q=>/map$/.test(q.kind)); ok(!!h2&&Math.abs(h2.b.w-h2.b.h)<1e-9,JSON.stringify(v)+' '+W+'x'+H+': the map is square'); }
  for(const [W,H] of SIZES) for(const nb of [0,1,2]){ const L=stageLayout(makeShot(W,H),W,H,'x '.repeat(200),'x',nb,0.34,nbNarrow(H));
    ok(L.main.h>=110&&L.bottom.every(q=>q.h>=55),W+'x'+H+', '+nb+' plots: the picture keeps '+L.main.h.toFixed(0)+' px and every plot 55 or more'); }
  let slow=Object.entries(tDraw).sort((a,b)=>b[1]-a[1]).slice(0,5);
  console.log('slowest draws (ms): '+JSON.stringify(slow));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
