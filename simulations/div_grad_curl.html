<title>Div, Grad, Curl &mdash; vector fields, their gradient, divergence and curl, Gauss, Green, Stokes and Helmholtz</title>
<!--
  ===================================================================
  div_grad_curl.html — vector fields and their three derivatives:
  what the gradient, the divergence and the curl are near a point,
  what they add up to over a region (Gauss, Green, Stokes), and how
  every field splits into a gradient and a curl (Helmholtz)
  ===================================================================

  Six views.  THE FIELD NEAR A POINT: eleven plane fields (uniform,
  source, rotation, shear, strain, spiral, point vortex, a source and
  a sink, Taylor-Green cells, a gradient, a general field) with
  arrows, streamlines and a heat map of div or curl; at a probe the
  Jacobian split into expansion, rotation and shear, a parcel moved
  by exp(Jt), a paddle wheel at curl/2, and the flux and circulation
  of a circle over its area converging to div and curl.  THE
  GRADIENT: six landscapes as maps or turnable surfaces, the slope in
  every direction, the path of steepest descent, and line integrals
  along two paths (equal for a gradient, apart by Green's curl for a
  field that is not one).  THE DIVERGENCE: line charges and Gauss's
  law in the plane; dye blobs in a flow between compressible and
  incompressible cells; the divergence theorem on three regions.  THE
  CURL: paddle wheels in a vortex zoo (rotation, point vortex,
  Rankine, Lamb-Oseen, shear, Taylor-Green); wires and Ampere's law
  in SI; a spinning cylinder with Kutta-Joukowski lift and no drag.
  IN THREE DIMENSIONS: five fields (the ABC flow among them) with the
  curl vector at a probe; Gauss on a sphere; Stokes on a loop with a
  disk and a cap.  THE DECOMPOSITION: Helmholtz on the torus by FFT.

  WHAT IS EXACT, WHAT IS MEASURED, WHAT IS MODELLED
  -------------------------------------------------------------------
  Nearly everything is mathematics, computed on the page and pinned
  in selfTest to build_dgc/derive.py (sympy exact, mpmath at 25 to 40
  figures, numpy, scipy; no code shared): every field's value and
  Jacobian, the flux and circulation of circles, the minima the
  descents reach, the path and region integrals, the charges' fluxes,
  the blobs' areas (scipy's DOP853 against the page's RK4), the
  divergence theorem's two sides, the vortices, the wheels' turns,
  Ampere's circulations, the cylinder's pressure, lift and drag,
  Gauss and Stokes in space, and the Helmholtz parts.
  Measured, and quoted with their sources (build_dgc/data/sources.json,
  every needle checked by check_sources.py): the magnetic constant
  mu0 = 1.25663706127e-6 N/A^2 (NIST, CODATA 2022).  The line
  charges are counted in charge per length over eps0, so the
  electric constant never enters.  The dates and names in the prose are quoted from the
  English Wikipedia articles listed there.
  Modelled: the line charges and wires are infinitely long (fields in
  the plane); the cylinder's flow is steady, inviscid and
  irrotational outside it (potential flow), which is why it feels no
  drag.
  Not modelled: the boundary layer and wake of a real cylinder, the
  finite length of real wires.
-->

/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';

            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ',
            /* standard_model.html: the group-theory symbols */
            '&otimes;':'⊗','&oplus;':'⊕','&Xi;':'Ξ','&xi;':'ξ','&psi;':'ψ','&chi;':'χ','&zeta;':'ζ',
            '&partial;':'∂','&sum;':'∑','&nabla;':'∇','&dagger;':'†','&frac14;':'¼','&frac34;':'¾',

            '&Psi;':'Ψ','&sup1;':'¹','&lang;':'⟨','&rang;':'⟩','&macr;':'¯',

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}

/* the largest stretch of exp(Jt), its largest singular value */
function stretchOf(J,t){ const E=expJ(J,t), a=E[0]*E[0]+E[2]*E[2], b=E[0]*E[1]+E[2]*E[3], c=E[1]*E[1]+E[3]*E[3];
  return Math.sqrt((a+c)/2+Math.sqrt((a-c)*(a-c)/4+b*b)); }
/* how long the parcel runs: PARCEL_T, or up to the first moment it has stretched four-fold (scanned in 64 steps, then
   bisected), so that a parcel near a source or a sink stays on the map */
function parcelTime(J){
  let prev=0; for(let i=1;i<=64;i++){ const t=PARCEL_T*i/64; if(stretchOf(J,t)>4){ let lo=prev, hi=t; for(let k=0;k<50;k++){ const m=(lo+hi)/2; if(stretchOf(J,m)>4) hi=m; else lo=m; } return lo; } prev=t; }
  return PARCEL_T; }

/* ---- 2. the gradient ---- */
const LAND_N=121;
function landGrid(id){ return memo('land',id,()=>{ const L=LAND[id], g=new Float64Array(LAND_N*LAND_N); let lo=Infinity, hi=-Infinity;
  for(let j=0;j<LAND_N;j++) for(let i=0;i<LAND_N;i++){ const x=-WIN+2*WIN*i/(LAND_N-1), y=-WIN+2*WIN*j/(LAND_N-1);
    const v=(L.sing||[]).some(s=>Math.hypot(x-s[0],y-s[1])<0.05)?NaN:L.phi(x,y)[0]; g[j*LAND_N+i]=v; if(isFinite(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v); } }
  /* the contour levels: 14 between the 2nd and 98th percentiles (a charge's logarithm would otherwise take them all) */
  const s=Array.from(g).filter(isFinite).sort((a,b)=>a-b), q=p=>s[Math.floor(p*(s.length-1))], a=q(0.02), b=q(0.98), levels=[];
  for(let k=1;k<=14;k++) levels.push(a+(b-a)*k/15);
  return {g,lo,hi,levels,segs:levels.map(l=>contours(g,LAND_N,LAND_N,-WIN,WIN,-WIN,WIN,l))}; }); }
function gradView(st){
  const L=LAND[st.gLand], px=clamp(st.gPx,LIM.gP[0],LIM.gP[1]), py=clamp(st.gPy,LIM.gP[0],LIM.gP[1]);
  const onSing=(L.sing||[]).some(s=>Math.hypot(px-s[0],py-s[1])<0.08);
  const p=onSing?[NaN,NaN,NaN,NaN,NaN,NaN]:L.phi(px,py), g=[p[1],p[2]], gn=Math.hypot(p[1],p[2]);
  const dd=[]; for(let i=0;i<=72;i++){ const t=-PI+TAU*i/72; dd.push([t,p[1]*Math.cos(t)+p[2]*Math.sin(t)]); }
  const desc=onSing?null:memo('descent',[L.id,px,py].join(':'),()=>descent(L,px,py));
  const gv=(x,y)=>{ const q=L.phi(x,y); return [q[1],q[2]]; }, genf=(x,y)=>FIELD2.general.f(x,y);
  const paths=memo('paths',L.id+':'+st.gCurl,()=>{
    if(st.gCurl){ const I0=pathIntegral(genf,0,64), I1=pathIntegral(genf,1,64), A=regionIntegral((x,y)=>{ const v=genf(x,y); return v[4]-v[3]; },40);
      return {curl:true,I:[I0,I1],between:A,run:[0,1].map(k=>runningIntegral(genf,k))}; }
    const ok=!(L.sing||[]).length;
    const I=ok?[pathIntegral(gv,0,64),pathIntegral(gv,1,64)]:[NaN,NaN], ph=(q)=>L.phi(q[0],q[1])[0];
    return {curl:false,I,dphi:ok?ph(PATH_B)-ph(PATH_A):NaN,run:ok?[0,1].map(k=>runningIntegral(gv,k)):null}; });
  return {L,px,py,onSing,p,g,gn,angle:Math.atan2(g[1],g[0]),dd,desc,paths,grid:landGrid(L.id),mode:st.gMode};
}
/* the line integral along path k from A as it runs, at 60 points of the parameter (for the plot) */
function runningIntegral(fv,k){ const out=[[0,0]]; let s=0;
  for(let i=0;i<60;i++){ s+=glInt(t=>{ const p=pathPoint(k,t,PATH_A,PATH_B,PATH_C), v=fv(p[0],p[1]); return v[0]*p[2]+v[1]*p[3]; },i/60,(i+1)/60,8); out.push([(i+1)/60,s]); }
  return out; }

/* ---- 3. the divergence ---- */
let CHARGES=CHARGES0.map(c=>c.slice());
function divView(st){
  const M={mode:st.dMode};
  if(st.dMode==='charges'){
    const fv=chargeField(CHARGES), key=JSON.stringify(CHARGES), sing=CHARGES.map(c=>[c[1],c[2]]);
    const cx=clamp(st.dLx,-WIN,WIN), cy=clamp(st.dLy,-WIN,WIN), r=clamp(st.dLr,LIM.dLr[0],LIM.dLr[1]);
    const through=circleThroughSingular(sing,cx,cy,r), N=circlePoints(r,sing,cx,cy);
    const fc=through?[NaN,NaN]:circleFC(fv,cx,cy,r,N);
    const integrand=[]; for(let i=0;i<=180;i++){ const t=TAU*i/180, v=fv(cx+r*Math.cos(t),cy+r*Math.sin(t)); integrand.push([t,(v[0]*Math.cos(t)+v[1]*Math.sin(t))*r]); }
    Object.assign(M,{fv,sing,cx,cy,r,through,N,flux:fc[0],enclosed:enclosedCharge(CHARGES,cx,cy,r),integrand,charges:CHARGES,
      lines:memo('flines',key,()=>fieldLines(CHARGES,fv,12)),arrows:arrowGrid('ch'+key,fv,sing,17)});
  } else if(st.dMode==='flow'){
    const m=clamp(st.dMix,0,1), fv=cellsField(m);
    Object.assign(M,{m,fv,blobs:blobState(st),t:SIM.blobT,heat:fieldGrid('cells'+m,'div',fv,[]),stream:memo('fstream',String(m),()=>streamlines(fv,0.34,{})),
      rates:BLOBS0.map(c=>regionDiv({id:'circle',c,s:BLOB_R},fv,16)/(PI*BLOB_R*BLOB_R))});
  } else {
    const rg=REGIONS.find(q=>q.id===st.dRegion), fv=FIELD2.general.f, n=Math.round(clamp(st.dN,LIM.dN[0],LIM.dN[1]));
    const conv=memo('conv',rg.id,()=>{ const ref=regionDiv(rg,fv,48), out=[];
      for(let k=2;k<=32;k++) out.push([k,Math.abs(regionFlux(rg,fv,rg.id==='square'?k:3*k)-ref),Math.abs(regionDiv(rg,fv,k)-ref)]); return {ref,out}; });
    Object.assign(M,{rg,fv,n,flux:regionFlux(rg,fv,rg.id==='square'?n:3*n),area:regionDiv(rg,fv,n),ref:conv.ref,conv:conv.out,
      heat:fieldGrid('general','div',fv,[]),arrows:arrowGrid('general',fv,[],17),path:regionPath(rg,240)});
  }
  return M;
}

/* ---- 4. the curl ---- */
let WIRES=WIRES0.map(w=>w.slice());
function curlView(st){
  const M={mode:st.cMode};
  if(st.cMode==='wheels'){
    const Z=ZOOM[st.cZoo];
    Object.assign(M,{Z,fv:Z.f,wheels:wheelState(st),t:SIM.t,heat:fieldGrid('zoo'+Z.id,'curl',Z.f,Z.sing),arrows:arrowGrid('zoo'+Z.id,Z.f,Z.sing,17),
      stream:memo('zstream',Z.id,()=>streamlines(Z.f,0.36,{sing:Z.sing}))});
  } else if(st.cMode==='wires'){
    WIRES[0][0]=st.cI1; WIRES[1][0]=st.cI2;
    const cx=st.cLx*MM, cy=st.cLy*MM, r=clamp(st.cLr,LIM.cLr[0],LIM.cLr[1])*MM;
    const circ=loopCirculationB(WIRES,cx,cy,r), Iin=currentInside(WIRES,cx,cy,r), bp=wireB(WIRES,cx,cy);
    /* the curl of B inside each wire, mu0 J = mu0 I / (pi a^2), uniform (zero outside): drawn as the wire's own disk,
       exact, where a 96-cell heat map made a 4 mm disk a blocky square */
    Object.assign(M,{wires:WIRES,cx,cy,r,circ,Iin,mu0I:SRC.constants.mu0*Iin,Bprobe:bp,curlIn:WIRES.map(w=>SRC.constants.mu0*w[0]/(PI*WIRE_A*WIRE_A))});
  } else {
    const g=clamp(st.cG,LIM.cG[0],LIM.cG[1]), cp=[]; for(let i=0;i<=180;i++){ const t=-PI+TAU*i/180; cp.push([t,wingCp(g,t)]); }
    const F=wingForce(g,256);
    Object.assign(M,{g,Gamma:4*PI*g,cp,force:F,stag:wingStag(g),psi:memo('wpsi',String(g),()=>{ const n=141, v=new Float64Array(n*n);
      for(let j=0;j<n;j++) for(let i=0;i<n;i++){ const x=-WIN+2*WIN*i/(n-1), y=-WIN+2*WIN*j/(n-1); v[j*n+i]=x*x+y*y<1?NaN:wingPsi(g,x,y); }
      const levels=[]; for(let k=-12;k<=12;k++) levels.push(k*0.25);
      return {n,levels,segs:levels.map(l=>contours(v,n,n,-WIN,WIN,-WIN,WIN,l+1e-9))}; })});
  }
  return M;
}

/* ---- 5. in three dimensions ---- */
function spaceView(st){
  const F=F3M[st.sField], fv=F.f, M={mode:st.sMode,F,fv};
  if(st.sMode==='field'){
    const p=[st.sPx,st.sPy,st.sPz].map(v=>clamp(v,LIM.sP[0],LIM.sP[1])), onSing=(F.sing||[]).some(s=>Math.hypot(p[0]-s[0],p[1]-s[1],p[2]-s[2])<0.1);
    const v=onSing?null:fv(p[0],p[1],p[2]);
    Object.assign(M,{p,onSing,v,parts:v?parts3(v):null,lattice:memo('lat3',F.id,()=>{ const out=[];
      for(let i=0;i<5;i++) for(let j=0;j<5;j++) for(let k=0;k<5;k++){ const x=-1.6+0.8*i, y=-1.6+0.8*j, z=-1.6+0.8*k;
        if((F.sing||[]).some(s=>Math.hypot(x-s[0],y-s[1],z-s[2])<0.3)) continue; const q=fv(x,y,z); out.push([x,y,z,q[0],q[1],q[2]]); } return out; })});
  } else if(st.sMode==='gauss'){
    const c=[st.sPx,st.sPy,st.sPz].map(v=>clamp(v,LIM.sP[0],LIM.sP[1])), R=clamp(st.sR,LIM.sR[0],LIM.sR[1]);
    const through=(F.sing||[]).some(s=>Math.abs(Math.hypot(c[0]-s[0],c[1]-s[1],c[2]-s[2])-R)<1e-3);
    const flux=through?NaN:sphereFlux(fv,c,R,48), inside=(F.sing||[]).filter(s=>Math.hypot(c[0]-s[0],c[1]-s[1],c[2]-s[2])<R).length;
    Object.assign(M,{c,R,through,flux,vol:F.sing?4*PI*inside:sphereDivIntegral(fv,c,R,24),inside,point:!!F.sing});
  } else {
    const c=[st.sPx,st.sPy,st.sPz].map(v=>clamp(v,LIM.sP[0],LIM.sP[1])), fr=loopFrame(clamp(st.sAl,LIM.sAl[0],LIM.sAl[1]),clamp(st.sBe,LIM.sBe[0],LIM.sBe[1]));
    const rho=clamp(st.sRho,LIM.sRho[0],LIM.sRho[1]), h=clamp(st.sH,LIM.sH[0],LIM.sH[1]);
    Object.assign(M,{c,fr,rho,h,S:(F.sing?null:stokes3(fv,c,fr,rho,h,32))});
  }
  return M;
}

/* ---- 6. the decomposition ---- */
let HBUMPS={src:HSRC0.map(b=>b.slice()),vtx:HVTX0.map(b=>b.slice())};
function helmField(st){ return st.hPreset==='modes'?helmModes:st.hPreset==='stirred'?helmStirred:helmBumps(HBUMPS.src,HBUMPS.vtx); }
function helmView(st){
  const key=st.hPreset+(st.hPreset==='bumps'?JSON.stringify(HBUMPS):'');
  return memo('helm',key,()=>{ const [vx,vy]=helmGrid(helmField(st),HN), S=helmSplit(vx,vy,HN), n=HN*HN;
    let e=[0,0,0], dot=0, back=0, dg=0, cr=0;
    for(let q=0;q<n;q++){ e[0]+=vx[q]*vx[q]+vy[q]*vy[q]; e[1]+=S.gx[q]*S.gx[q]+S.gy[q]*S.gy[q]; e[2]+=S.rx[q]*S.rx[q]+S.ry[q]*S.ry[q];
      dot+=S.gx[q]*S.rx[q]+S.gy[q]*S.ry[q]; back=Math.max(back,Math.abs(S.gx[q]+S.rx[q]+S.h[0]-vx[q]),Math.abs(S.gy[q]+S.ry[q]+S.h[1]-vy[q])); }
    const sd=helmSplit(S.gx,S.gy,HN), sr=helmSplit(S.rx,S.ry,HN);
    for(let q=0;q<n;q++){ dg=Math.max(dg,Math.abs(sd.curl[q])); cr=Math.max(cr,Math.abs(sr.div[q])); }
    return {preset:st.hPreset,vx,vy,S,energy:e.map(v=>v/n),dot:dot/n,back,curlOfGrad:dg,divOfRot:cr,bumps:st.hPreset==='bumps'?JSON.parse(JSON.stringify(HBUMPS)):null}; });
}

function buildModel(){
  const v=ST.view, M={view:v};
  if(v==='local') M.L=localView(ST);
  else if(v==='grad') M.G=gradView(ST);
  else if(v==='div') M.D=divView(ST);
  else if(v==='curl') M.C=curlView(ST);
  else if(v==='space') M.S=spaceView(ST);
  else M.H=helmView(ST);
  return M;
}

/* ================================================================== *
 *  number formatting, readout / equation bar / tag                    *
 * ================================================================== */
function num(x,n){ if(!isFinite(x)) return '—'; const s=sigf(Math.abs(x),n||4); return (x<0&&s!=='0'?'−':'')+s; }
function numF(x,d){ if(!isFinite(x)) return '—'; const s=Math.abs(x).toFixed(d); return (x<0&&Number(s)!==0?'−':'')+s; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
const SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','−':'⁻','+':'⁺','(':'⁽',')':'⁾'};
const SUBD2={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','x':'ₓ','y':'ᵧ'};
const sup=s=>String(s).split('').map(c=>SUPD[c]||c).join(''), sub=s=>String(s).split('').map(c=>SUBD2[c]||c).join('');
const vec=(a,b,n)=>'('+num(a,n||4)+', '+num(b,n||4)+')';
const vec3=(v,n)=>'('+v.map(x=>num(x,n||4)).join(', ')+')';
/* two numbers a theorem says are equal, and how far apart they came out, relative to the larger of them and the problem's
   own scale sc (so that two zeros agree) */
function agree(a,b,sc){ const d=Math.abs(a-b), s=Math.max(Math.abs(a),Math.abs(b),sc||1e-300); return d<=1e-9*s?'agree to '+sigf(Math.max(d/s,1e-17),1):'differ by '+num(a-b,2); }
const DEG=180/PI;

function readoutHTML(M){
  let s='';
  if(M.view==='local'){ const L=M.L, P=L.L;
    s+='<div class="rname">the field near a point<small>'+L.F.name+', the probe at '+vec(L.px,L.py,3)+'</small></div><table>';
    if(!P) s+=hd('the probe')+rrow('at the probe','a singular point: no value');
    else {
      s+=hd('the field and its Jacobian')+rrow('v = (P, Q)',vec(P.P,P.Q))+rrow('∂P/∂x, ∂P/∂y',num(P.Px)+', '+num(P.Py))+rrow('∂Q/∂x, ∂Q/∂y',num(P.Qx)+', '+num(P.Qy));
      s+=hd('J = ½ div I + ½ curl R + S')+rrow('div = tr J',num(P.div,5))+rrow('curl',num(P.curl,5))+rrow('the shear |S|',num(P.S,4)+(P.S>1e-12?' along '+numF(P.axis*DEG,1)+'°':''))
        +rrow('det J',num(P.det,4))+rrow('the motion near it',P.cls)
        /* how long the parcel runs lives here, not in the caption: a caption that changed with the probe re-laid the stage under a drag */
        +rrow('the parcel runs',L.tp<PARCEL_T?numF(L.tp,2)+' of each '+numF(PARCEL_T,1)+' s (then it has stretched four-fold)':'the whole '+numF(PARCEL_T,1)+' s');
    }
    s+=hd('the circle of radius '+num(L.r,3));
    if(L.through) s+=rrow('flux, circulation','the circle runs through a singular point');
    else s+=rrow('flux out',num(L.flux,6))+rrow('circulation',num(L.circ,6))+rrow('flux/πr², circ./πr²',num(L.flux/(PI*L.r*L.r),5)+', '+num(L.circ/(PI*L.r*L.r),5));
    s+='</table><div class="note">'+noteFor('local',M)+'</div>';
  } else if(M.view==='grad'){ const G=M.G;
    s+='<div class="rname">the gradient<small>'+G.L.name+', the probe at '+vec(G.px,G.py,3)+'</small></div><table>';
    if(G.onSing) s+=hd('at the probe')+rrow('φ','a singular point');
    else s+=hd('at the probe')+rrow('φ',num(G.p[0],5))+rrow('∇φ',vec(G.g[0],G.g[1]))+rrow('the steepest slope |∇φ|',num(G.gn,5))+rrow('uphill, from the x axis',numF(G.angle*DEG,1)+'°');
    const d=G.desc; s+=hd('the path of steepest descent');
    s+=rrow('it ends',!d?'—':d.min?'on a minimum at '+vec(d.min[0],d.min[1],5):d.end==='left'?'at the edge of the map':d.end==='flat'?'on a flat point that is not a minimum':'still moving after 4000 steps');
    if(d&&d.min) s+=rrow('φ there',num(d.min[2],6));
    const P=G.paths; s+=hd(P.curl?'from A to B, with the general field':'from A to B, with ∇φ');
    if(P.curl) s+=rrow('straight',num(P.I[0],8))+rrow('the detour',num(P.I[1],8))+rrow('straight − detour',num(P.I[0]-P.I[1],8))+rrow('∬ curl between (Green)',num(P.between,8));
    else if(isFinite(P.dphi)) s+=rrow('straight',num(P.I[0],8))+rrow('the detour',num(P.I[1],8))+rrow('φ(B) − φ(A)',num(P.dphi,8));
    else s+=rrow('the integrals','the paths cross a singular point of φ');
    s+='</table><div class="note">'+noteFor('grad',M)+'</div>';
  } else if(M.view==='div'){ const D=M.D;
    if(D.mode==='charges'){
      s+='<div class="rname">Gauss in the plane<small>the loop about '+vec(D.cx,D.cy,3)+', radius '+num(D.r,3)+'</small></div><table>';
      s+=hd('the loop')+(D.through?rrow('the flux','the loop runs through a charge'):rrow('the flux of E out of it',num(D.flux,8))+rrow('the charge inside',String(D.enclosed))+rrow('flux and charge',agree(D.flux,D.enclosed,D.charges.reduce((t,c)=>t+Math.abs(c[0]),0))));
      s+=rrow('points on the loop',String(D.N));
      s+=hd('the charges')+D.charges.map(c=>rrow((c[0]>0?'+':'−')+Math.abs(c[0])+' at',vec(c[1],c[2],3))).join('');
    } else if(D.mode==='flow'){
      s+='<div class="rname">a flow<small>the mix '+numF(D.m,2)+' (0 compressible, 1 not), t = '+numF(D.t,2)+'</small></div><table>';
      s+=hd('the blobs: area now over area first');
      D.blobs.forEach((B,k)=>{ s+=rrow('blob '+(k+1)+' from '+vec(B.c[0],B.c[1],2),numF(polyArea(B.p)/B.A0,4)+(k<D.rates.length?'; div under it at first '+num(D.rates[k],3):'')); });
    } else {
      s+='<div class="rname">the divergence theorem<small>the general field on '+D.rg.name+'</small></div><table>';
      s+=hd('with '+D.n+' points')+rrow('the flux out ∮v·n ds',num(D.flux,10))+rrow('∬ div dA',num(D.area,10))+rrow('the answer (48 points)',num(D.ref,12));
    }
    s+='</table><div class="note">'+noteFor('div',M)+'</div>';
  } else if(M.view==='curl'){ const C=M.C;
    if(C.mode==='wheels'){
      s+='<div class="rname">paddle wheels<small>'+C.Z.name+', t = '+numF(C.t,2)+'</small></div><table>'+hd('each wheel: where it is, how far it has turned');
      C.wheels.forEach((w,k)=>{ const f=C.fv(w.x,w.y); s+=rrow('wheel '+(k+1)+' at '+vec(w.x,w.y,2),numF(w.a/TAU,3)+' turns; curl/2 = '+num((f[4]-f[3])/2,3)); });
    } else if(C.mode==='wires'){
      s+='<div class="rname">Ampère<small>the loop about '+vec(C.cx/MM,C.cy/MM,3)+' mm, radius '+num(C.r/MM,3)+' mm</small></div><table>';
      s+=hd('round the loop')+rrow('∮ B·dl (T m)',num(C.circ,8))+rrow('μ₀ × the current inside',num(C.mu0I,8))+rrow('the current inside',num(C.Iin,6)+' A')+rrow('the two',agree(C.circ,C.mu0I,SRC.constants.mu0*C.wires.reduce((t,w)=>t+Math.abs(w[0]),0)));
      s+=hd('the wires')+C.wires.map((w,k)=>rrow('wire '+(k+1),numF(w[0],1)+' A at '+vec(w[1]/MM,w[2]/MM,3)+' mm')).join('');
      s+=rrow('B at the loop’s centre',num(Math.hypot(C.Bprobe[0],C.Bprobe[1])*1e3,4)+' mT');
    } else {
      s+='<div class="rname">a spinning cylinder<small>Γ/(4πUR) = '+numF(C.g,2)+'; U = R = ρ = 1</small></div><table>';
      s+=hd('the force per unit length')+rrow('the lift from the pressure',num(C.force[1],10))+rrow('ρUΓ (Kutta, Joukowski)',num(C.Gamma,10))+rrow('the drag',num(C.force[0],3));
      s+=hd('the stagnation points')+(C.stag.length===2?rrow('on the surface at',C.stag.map(p=>numF(Math.atan2(p[1],p[0])*DEG,2)+'°').join(', ')):rrow('off the surface at','(0, '+num(C.stag[0][1],5)+')'));
    }
    s+='</table><div class="note">'+noteFor('curl',M)+'</div>';
  } else if(M.view==='space'){ const S=M.S;
    if(S.mode==='field'){
      s+='<div class="rname">a field in space<small>'+S.F.name+', the probe at '+vec3(S.p,3)+'</small></div><table>';
      if(!S.v) s+=hd('at the probe')+rrow('v','a singular point');

    } else {
      s+='<div class="rname">Stokes<small>'+S.F.name+'; a loop of radius '+num(S.rho,3)+'</small></div><table>';
      if(!S.S) s+=hd('round the loop')+rrow('the curl','singular at the charge');
      else s+=hd('round the loop')+rrow('∮ v·dl',num(S.S.circ,10))+rrow('∬ (∇×v)·n, the disk',num(S.S.disk,10))+rrow('∬ (∇×v)·n, the cap',num(S.S.cap,10))+rrow('the loop and the cap',agree(S.S.circ,S.S.cap,Math.max(1,Math.abs(S.S.disk))));

  } else { const Hm=M.H, S=Hm.S;
    s+='<div class="rname">Helmholtz on the torus<small>'+HELM_PRESETS.find(p=>p.id===Hm.preset).name+', '+HN+' × '+HN+' points</small></div><table>';
    s+=hd('the energies ⟨|·|²⟩')+rrow('the field',num(Hm.energy[0],6))+rrow('∇φ',num(Hm.energy[1],6))+rrow('rot ψ',num(Hm.energy[2],6))+rrow('the mean h',vec(S.h[0],S.h[1],4));

function noteFor(v,M){
  switch(v){
    case 'local': return M.L.L&&M.L.L.cls==='saddle'&&Math.abs(M.L.L.curl)<1e-9&&Math.abs(M.L.L.div)<1e-9?'No divergence and no curl here, yet the neighbours move: the shear alone stretches one way and squeezes the other.':

    case 'grad': return M.G.paths.curl?'With curl, the integral depends on the path: the difference is the curl between the paths.':'A gradient’s line integral depends only on the ends.';
    case 'div': return M.D.mode==='charges'?'Drag a charge across the loop and the flux jumps by its size.':M.D.mode==='flow'?'At mix 1 the flow has no divergence and every blob keeps its area.':'Both sides converge to one number.';
    case 'curl': return M.C.mode==='wheels'?'In a point vortex the wheels orbit without turning; in solid rotation they turn once per orbit.':M.C.mode==='wires'?'A loop cutting a wire encloses the part of its current inside.':'Lift without drag: d’Alembert’s paradox (1752).';

function eqbarHTML(M){

  if(M.view==='div') return M.D.mode==='charges'?E('∮ E · n ds = q<sub>inside</sub>','in the plane E = q r̂/(2πr): the flux out of any loop counts the charge inside it (Gauss, Lagrange)')

    :E('∮ v · n ds = ∬ ∇·v dA','the flux out of a region is the divergence added up inside it (Gauss, Ostrogradsky)');

const CAP_FONT='11.5px -apple-system, sans-serif';

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;

function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){

    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }

/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);

    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }

function seg(ctx,map,a,b,col,lw,dash){

  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }

function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);

function diamond(ctx,x,y,r,fill,stroke){

function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){

  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);

/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,

let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* does the segment a-c, or the polyline p (a list of [x, y]), pass through the box bb = [x0, y0, x1, y1]? (Liang-Barsky) */
function segHitsBox(a,c,bb){ const dx=c[0]-a[0], dy=c[1]-a[1]; let t0=0, t1=1;
  for(const [p,q] of [[-dx,a[0]-bb[0]],[dx,bb[2]-a[0]],[-dy,a[1]-bb[1]],[dy,bb[3]-a[1]]]){
    if(p===0){ if(q<0) return false; } else { const r=q/p; if(p<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } } }
  return true; }
function polyHitsBox(p,bb){ for(let i=1;i<p.length;i++) if(segHitsBox(p[i-1],p[i],bb)) return true; return false; }
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }

/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){

function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

function floorGrid(ctx,C,ext,step,col){

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
/* tick labels with as many decimals as the spacing needs, and a proper minus: 5 not 5.00, 0.25 not 0.3 */
function autoFmt(ts){ let step=Infinity; for(let i=1;i<ts.length;i++) step=Math.min(step,Math.abs(ts[i]-ts[i-1]));
  /* the fewest decimals that print every tick exactly: a step of 0.25 needs two and 2.5 needs one (the ceiling of
     -log10(step) gave one and none, and printed -0.25 as -0.3 and 2.5 as 3) */
  let d=0; if(isFinite(step)) while(d<6&&ts.some(t=>Math.abs(Math.round(t*Math.pow(10,d))/Math.pow(10,d)-t)>1e-9*step)) d++;
  return t=>{ const s=Math.abs(t).toFixed(d); return (t<0&&Number(s)!==0?'−':'')+s; }; }
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  const fs=10.5, hh=fs*1.15;
  let xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  /* a short or narrow plot asks for fewer ticks until neighbouring labels clear each other */
  const gapY=t=>t.length<2?Infinity:b.h*Math.abs(t[1]-t[0])/Math.abs(yhi-ylo||1);
  if(!o.yticks) for(let n=(o.ny||5)-1;n>=1&&gapY(yt)<hh+3;n--) yt=ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),n);
  const gapX=t=>t.length<2?Infinity:b.w*Math.abs(t[1]-t[0])/Math.abs(xhi-xlo||1)-Math.max(...t.map(v=>plain((o.xfmt||autoFmt(t))(v)).length*fs*0.52));
  if(!o.xticks) for(let n=(o.nx||6)-1;n>=1&&gapX(xt)<8;n--) xt=ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),n);
  if(!o.xfmt) o.xfmt=autoFmt(xt);
  if(!o.yfmt) o.yfmt=autoFmt(yt);
  /* the corner: an x tick at the left edge and a y tick at the bottom edge put their labels on each other
     (loop_quantum_gravity's Known-bad); the y tick gives way */
  const Xof=t=>b.x+b.w*(t-xlo)/(xhi-xlo||1), Yof=t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1);
  if(xt.some(t=>Math.abs(Xof(t)-b.x)<16)) yt=yt.filter(t=>Math.abs(Yof(t)-b.y1)>=7);
  o.xticks=xt; o.yticks=yt;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  the drawing, part 1: shared state and colour fields (from build_sf),*
 *  plane maps, arrows and streamlines; the field near a point; the     *
 *  gradient                                                            *
 * ================================================================== */
let HIT=[], W_STAGE=1100, H_STAGE=712, MARKS=[], KEY_DROPS=0;
const nbNarrow=H=>H<520?0:1;
function sLine(ctx,pts,col,lw,dash){
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
}
function vMark(ctx,b,X,col,y0,y1){ const a=y0===undefined?b.y:y0, c=y1===undefined?b.y1:y1;

const xOf=(b,v,lo,hi)=>b.x+b.w*(v-lo)/(hi-lo), yOf=(b,v,lo,hi)=>b.y1-b.h*(v-lo)/(hi-lo);

/* ---- colour fields.  In a browser: one image, putImageData on an offscreen canvas drawn scaled into the box.  Under

const HEAT_CACHE={};
function heatField(ctx,b,nx,ny,colorAt,key){
  let off=null;
  if(typeof document!=='undefined'&&ctx.drawImage){
    try{
      if(key&&HEAT_CACHE[key]) off=HEAT_CACHE[key];
      else { const c=document.createElement('canvas'); c.width=nx; c.height=ny; const oc=c.getContext('2d');
        if(oc&&oc.createImageData&&oc.putImageData){ const img=oc.createImageData(nx,ny);
          for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const col=colorAt(i,j), k=4*(j*nx+i); img.data[k]=col[0]; img.data[k+1]=col[1]; img.data[k+2]=col[2]; img.data[k+3]=255; }
          oc.putImageData(img,0,0); off=c; if(key){ for(const k in HEAT_CACHE) delete HEAT_CACHE[k]; HEAT_CACHE[key]=c; } } }
    }catch(e){ off=null; }
  }
  if(off){ ctx.save(); ctx.imageSmoothingEnabled=nx<b.w; ctx.drawImage(off,b.x,b.y,b.w,b.h); ctx.restore(); return 'image'; }
  const cx=Math.min(nx,48), cy=Math.min(ny,48), sx=nx/cx, sy=ny/cy;
  for(let j=0;j<cy;j++) for(let i=0;i<cx;i++){
    const col=colorAt(Math.min(nx-1,Math.floor((i+0.5)*sx)),Math.min(ny-1,Math.floor((j+0.5)*sy)));
    ctx.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')';
    ctx.fillRect(b.x+b.w*i/cx,b.y+b.h*j/cy,b.w/cx+0.6,b.h/cy+0.6);
  }

}
/* signed div or curl in [-1, 1]: green where positive, magenta where negative, faded towards the page by its size */
const BG=[7,11,24];
function divCol(t){ t=clamp(isFinite(t)?t:0,-1,1); const a=toRgb(t>=0?COL.pos:COL.live), s=Math.pow(Math.abs(t),0.7);
  return [0,1,2].map(i=>Math.round(BG[i]+(a[i]-BG[i])*s)); }
/* a height in [0, 1] on a ramp whose lightness rises all the way (navy, blue, cyan, lime, orange) */
const SEQ_STOPS=[[0,'#0d1a33'],[0.3,'#2f6fa0'],[0.55,'#5ac8e0'],[0.8,'#c8ee6a'],[1,'#f0a060']];
function seqCol(t){ t=clamp(isFinite(t)?t:0,0,1); let i=0; while(i<SEQ_STOPS.length-2&&t>SEQ_STOPS[i+1][0]) i++;
  const a=toRgb(SEQ_STOPS[i][1]), c=toRgb(SEQ_STOPS[i+1][1]), u=(t-SEQ_STOPS[i][0])/(SEQ_STOPS[i+1][0]-SEQ_STOPS[i][0]);
  return [0,1,2].map(k=>Math.round(a[k]+(c[k]-a[k])*u)); }

/* ---- plane maps: a square box (equal aspect: angles and circles are true) of the window [-w, w]^2 ---- */
function mapBox(L,top){ const bm=L.main, side=Math.max(60,Math.min(bm.w,bm.h-(top||22)));
  return box(bm.x+(bm.w-side)/2,bm.y+(top||22),side,side); }
function mapXY(b,w){ const s=b.w/(2*w); return {X:x=>b.x+(x+w)*s, Y:y=>b.y+(w-y)*s, s, ix:X=>(X-b.x)/s-w, iy:Y=>w-(Y-b.y)/s}; }
function arrowHead(ctx,x0,y0,x1,y1,col,lw,hh){
  const L=Math.hypot(x1-x0,y1-y0); if(L<1.5) return;
  const ux=(x1-x0)/L, uy=(y1-y0)/L, h=Math.min(hh||6,L*0.45);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
  ctx.moveTo(x1,y1); ctx.lineTo(x1-h*ux+0.5*h*uy,y1-h*uy-0.5*h*ux); ctx.moveTo(x1,y1); ctx.lineTo(x1-h*ux-0.5*h*uy,y1-h*uy+0.5*h*ux);

}
/* arrows on a lattice, each as long as 0.85 of the spacing times |v|/ref, ref the 90th percentile of the speeds shown; a

function drawArrows(ctx,b,w,A,col,n){
  const T=mapXY(b,w), cell=b.w/n;
  for(const [x,y,u,v] of A.arrows){ const s=Math.hypot(u,v); if(!(s>0)) continue; const len=0.85*cell*Math.min(1,s/A.ref);
    const X=T.X(x), Y=T.Y(y), dx=len*u/s, dy=-len*v/s; arrowHead(ctx,X-dx/2,Y-dy/2,X+dx/2,Y+dy/2,col,1,4); }
}
function drawStreams(ctx,b,w,lines,col,lw){
  const T=mapXY(b,w);
  for(const l of lines){ ctx.beginPath(); l.pts.forEach((p,i)=>{ const X=T.X(p[0]), Y=T.Y(p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.strokeStyle=col; ctx.lineWidth=lw||1; ctx.stroke();
    /* the direction: a small head at the middle of each line */
    const k=Math.floor(l.pts.length/2); if(k>0&&k<l.pts.length){ const a=l.pts[k-1], c=l.pts[k]; arrowHead(ctx,T.X(a[0]),T.Y(a[1]),T.X(c[0]),T.Y(c[1]),col,lw||1,5); } }
}
function drawHeat(ctx,b,H,key){ if(!H||!(H.mx>0)) return; heatField(ctx,b,HEAT_N,HEAT_N,(i,j)=>divCol(H.g[j*HEAT_N+i]/H.mx),key); }
function mapFrame(ctx,b,w,ticks){ frame(ctx,b,'#2a2f3d'); const T=mapXY(b,w);
  if(ticks!==false){ ctx.font='10px -apple-system, sans-serif'; ctx.fillStyle='#6f7789'; ctx.textAlign='center'; ctx.textBaseline='top';
    for(const v of [-w,0,w]){ const s=v===0?'0':(v<0?'−':'')+Math.abs(v); ctx.fillText(s,T.X(v),b.y1+4); LABELS.push([T.X(v)-8,b.y1+4,T.X(v)+8,b.y1+16]); }

    for(const v of [0,w]){ const s=String(Math.abs(v)); ctx.fillText(s,b.x-5,T.Y(v)); LABELS.push([b.x-5-s.length*6,T.Y(v)-6,b.x-5,T.Y(v)+6]); } } }
/* a paddle wheel of radius R px at (X, Y), turned by angle a (anticlockwise on the page for a > 0) */
function paddle(ctx,X,Y,R,a,col){
  ctx.beginPath(); ctx.arc(X,Y,R*0.28,0,TAU); ctx.fillStyle='#070b18'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.2; ctx.stroke();
  for(let k=0;k<4;k++){ const t=a+k*PI/2, c=Math.cos(t), s=-Math.sin(t);
    ctx.beginPath(); ctx.moveTo(X+0.28*R*c,Y+0.28*R*s); ctx.lineTo(X+R*c,Y+R*s); ctx.strokeStyle=k===0?COL.zero:col; ctx.lineWidth=k===0?2.2:1.6; ctx.stroke(); }

/* ================================================================== *
 *  view 1: the field near a point                                     *
 * ================================================================== */
function localCaption(M){
  const L=M.L, heat=ST.lHeat;
  const cap=M.L.arrows.capped?' Arrows are drawn against the speed '+sigf(L.arrows.ref,2)+'; '+L.arrows.capped+' faster ones at that length.':' Arrows are drawn against the speed '+sigf(L.arrows.ref,2)+'.';
  const zero=heat!=='none'&&!(L.heat&&L.heat.mx>1e-12);
  return {full:L.F.name[0].toUpperCase()+L.F.name.slice(1)+' on [−3, 3]² (grey arrows'+(ST.lStream?', green streamlines':'')+(heat!=='none'?(zero?'; its '+(heat==='div'?'divergence':'curl')+' is zero at every point drawn, so the map is blank':', the '+(heat==='div'?'divergence':'curl')+' as colour: green positive, magenta negative'):'')+').'+cap+
    ' At the probe (magenta) a parcel moves as the linear part of the field carries it, magnified, for '+numF(PARCEL_T,1)+' s or until it has stretched four-fold, and a paddle wheel turns at curl/2; the dashed circle is the one whose flux and circulation are measured. Below: flux and circulation divided by the area πr² as the circle shrinks, and the probe on the plane of the trace and determinant of J.',
    short:L.F.name[0].toUpperCase()+L.F.name.slice(1)+'; the probe (magenta) with its parcel and wheel.'};
}
/* what a map draws in its own coordinates stays inside it: save, clip to the box (the caller restores) */
function clipBox(ctx,b){ ctx.save(); ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip(); }
function drawLocal(ctx,W,H,M){
  const L=M.L, cap=localCaption(M), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.34,nbNarrow(H));
  const b=mapBox(Lay), T=mapXY(b,WIN);
  lab(ctx,W,H,b.x,b.y-18,titleFor(b,'the field near a point',L.F.name),'#aeb6c6','italic 13px Georgia, serif','left','top');
  ctx.fillStyle='#070b18'; ctx.fillRect(b.x,b.y,b.w,b.h);
  if(L.heat) drawHeat(ctx,b,L.heat,'l'+L.F.id+ST.lHeat);
  drawArrows(ctx,b,WIN,L.arrows,'#5a6278',17);
  if(L.stream) drawStreams(ctx,b,WIN,L.stream,'rgba(184,236,76,0.75)',1.1);
  for(const s of (L.F.sing||[])) dot(ctx,T.X(s[0]),T.Y(s[1]),3.5,COL.zero,'#070b18');
  mapFrame(ctx,b,WIN);
  /* the circle, the parcel, the wheel: clipped to the map */
  const X=T.X(L.px), Y=T.Y(L.py);
  clipBox(ctx,b);
  ctx.beginPath(); ctx.arc(X,Y,L.r*T.s,0,TAU); ctx.strokeStyle=COL.live; ctx.lineWidth=1.2; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
  if(L.J){
    const E=expJ(L.J,L.t), a=0.22, corners=[[-a,-a],[a,-a],[a,a],[-a,a],[-a,-a]].map(c=>[L.px+E[0]*c[0]+E[1]*c[1],L.py+E[2]*c[0]+E[3]*c[1]]);
    ctx.beginPath(); corners.forEach((c,i)=>{ const x=T.X(c[0]), y=T.Y(c[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.fillStyle='rgba(205,53,196,0.22)'; ctx.fill(); ctx.strokeStyle=COL.live; ctx.lineWidth=1.4; ctx.stroke();
    /* the stretching axis of the shear */
    if(L.L.S>1e-9){ const c=Math.cos(L.L.axis), s=Math.sin(L.L.axis), d=0.5*T.s; sLine(ctx,[[X-d*c,Y+d*s],[X+d*c,Y-d*s]],COL.struct,1,[2,3]); }
    paddle(ctx,X,Y,11,L.L.curl/2*L.t,COL.text);
  }
  ctx.restore();
  dot(ctx,X,Y,3,COL.live,'#fff');
  HIT.push({kind:'lmap',b,w:WIN});
  if(Lay.bottom[0]) drawFluxCurve(ctx,Lay.bottom[0],M);
  if(Lay.bottom[1]) drawTrDet(ctx,Lay.bottom[1],M);

}
/* flux/(pi r^2) and circulation/(pi r^2) against r (log r), with div and curl at the probe */
function drawFluxCurve(ctx,b,M){
  const L=M.L, c=L.curve.filter(q=>isFinite(q[1])&&isFinite(q[2]));
  const vals=c.flatMap(q=>[q[1],q[2]]).concat(L.L?[L.L.div,L.L.curl]:[]).filter(isFinite);
  let lo=Math.min(...vals,0), hi=Math.max(...vals,0); const pad=0.12*Math.max(hi-lo,1e-6); lo-=pad; hi+=pad;
  axesT(ctx,b,Math.log10(0.01),Math.log10(1.6),lo,hi,{title:titleFor(b,'flux and circulation over πr² as the circle shrinks','over πr²'),xlab:'the radius r',
    xticks:[-2,-1,0],xfmt:t=>t===-2?'0.01':t===-1?'0.1':'1'});
  const xs=c.map(q=>Math.log10(q[0]));
  if(L.L){ sLine(ctx,[[b.x,yOf(b,L.L.div,lo,hi)],[b.x1,yOf(b,L.L.div,lo,hi)]],COL.pos,1,[5,4]); sLine(ctx,[[b.x,yOf(b,L.L.curl,lo,hi)],[b.x1,yOf(b,L.L.curl,lo,hi)]],COL.q,1,[5,4]); }
  polyline(ctx,b,xs,c.map(q=>q[1]),Math.log10(0.01),Math.log10(1.6),lo,hi,COL.pos,1.6);
  polyline(ctx,b,xs,c.map(q=>q[2]),Math.log10(0.01),Math.log10(1.6),lo,hi,COL.q,1.6);
  vMark(ctx,b,xOf(b,Math.log10(L.r),Math.log10(0.01),Math.log10(1.6)),COL.live);
  legendAuto(ctx,b,[[COL.pos,'flux/πr² → div'],[COL.q,'circulation/πr² → curl']]);
  HIT.push({kind:'lr',b});
}
/* the trace-determinant plane: saddles below det = 0, spirals above the parabola det = tr²/4, nodes between */
let TRDET=null;          /* the plot's last range, for selfTest */
function drawTrDet(ctx,b,M){
  /* R = 1.25 max(|div|, 2 sqrt|det|) puts a saddle's marker at 1/1.5625 of the lower half, never on the edge */
  const L=M.L.L; const R=L?Math.max(2,1.25*Math.max(Math.abs(L.div),2*Math.sqrt(Math.abs(L.det)))):2;
  const tlo=-R, thi=R, dlo=-R*R/4, dhi=R*R/2;
  TRDET={tlo,thi,dlo,dhi,b};
  axesT(ctx,b,tlo,thi,dlo,dhi,{title:titleFor(b,'the probe on the trace–determinant plane of J','tr and det'),xlab:'tr J = div',ny:3});
  const xs=[], ys=[]; for(let i=0;i<=60;i++){ const t=tlo+(thi-tlo)*i/60; xs.push(t); ys.push(t*t/4); }
  polyline(ctx,b,xs,ys,tlo,thi,dlo,dhi,COL.ref,1.2,[5,4]);
  sLine(ctx,[[b.x,yOf(b,0,dlo,dhi)],[b.x1,yOf(b,0,dlo,dhi)]],'#3a4256',1);
  sLine(ctx,[[xOf(b,0,tlo,thi),b.y],[xOf(b,0,tlo,thi),b.y1]],'#3a4256',1);
  /* the regions' names on the side away from the probe (a divergence-free probe sits on tr = 0) */
  const sd=L&&L.div<0?1:-1;
  lab(ctx,W_STAGE,H_STAGE,xOf(b,sd*0.55*R,tlo,thi),yOf(b,dlo*0.55,dlo,dhi),'saddles','#8b93a6',SM_FONT,'center','middle',PLATE);
  lab(ctx,W_STAGE,H_STAGE,xOf(b,sd*0.5*R,tlo,thi),yOf(b,dhi*0.8,dlo,dhi),'spirals','#8b93a6',SM_FONT,'center','middle',PLATE);
  lab(ctx,W_STAGE,H_STAGE,xOf(b,sd*0.72*R,tlo,thi),yOf(b,0.07*dhi,dlo,dhi),'nodes','#8b93a6',SM_FONT,'center','middle',PLATE);
  if(L) marker(ctx,b,tlo,thi,dlo,dhi,clamp(L.div,tlo,thi),clamp(L.det,dlo,dhi),COL.live);
}

/* ================================================================== *
 *  view 2: the gradient                                               *
 * ================================================================== */
function gradCaption(M){
  const G=M.G;
  if(G.mode==='surface') return {full:'The landscape φ = '+G.L.name+' as a surface over [−3, 3]², turned by dragging, with its contours on the floor and the path of steepest descent from the probe (orange) drawn on the surface. Below: the slope in every direction at the probe, and the two line integrals from A to B.',
    short:'The landscape as a surface; drag to turn it.'};
  return {full:'The landscape φ = '+G.L.name+' as colour (higher is lighter) with its contours; grey arrows are the gradient ∇φ, which crosses every contour at a right angle. At the probe (magenta): ∇φ, and the circle of directional derivatives (the slope in the direction u is the chord of that circle along u). Orange: the path of steepest descent from the probe. Cyan: two paths from A to B'+(G.paths.curl?', integrating a field with curl':'')+'. Below: the slope against the direction, and the line integrals as they run.',
    short:'The landscape, its contours and gradient; press to move the probe.'};
}
function drawGrad(ctx,W,H,M){
  const G=M.G, cap=gradCaption(M), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.34,nbNarrow(H));
  if(G.mode==='surface') drawGradSurface(ctx,W,H,Lay,M); else drawGradMap(ctx,W,H,Lay,M);
  if(Lay.bottom[0]) drawSlopes(ctx,Lay.bottom[0],M);

}
function drawGradMap(ctx,W,H,Lay,M){
  const G=M.G, b=mapBox(Lay), T=mapXY(b,WIN), g=G.grid;

/* ================================================================== *
 *  view 5: in three dimensions                                        *
 * ================================================================== */
function spaceCaption(S){
  if(S.mode==='field') return {full:S.F.name[0].toUpperCase()+S.F.name.slice(1)+' in the cube [−2, 2]³, as arrows on a 5 × 5 × 5 lattice (nearer is brighter; drag to turn it). At the probe: the direction of the field (green) and of its curl (magenta), the axis a small wheel there would turn about; the readout gives their sizes.',
    short:S.F.name+' in space; the curl at the probe (magenta).'};
  if(S.mode==='gauss') return {full:'Gauss in space: the flux of '+S.F.name+' out of a sphere (its surface coloured by v·n, green outwards, magenta inwards) equals the integral of its divergence inside'+(S.point?'; for the point charge that is 4π if the charge is inside and 0 if not':'')+'. Below: the flux and the integral as the sphere grows.',
    short:'Gauss: the flux out of the sphere is the integral of div inside.'};
  return {full:'Stokes in space: the circulation of '+S.F.name+' round the loop (magenta) equals the flux of its curl through the flat disk it bounds and through the cap of height '+numF(S.h,2)+' on it (both coloured by curl·n). Below: the curl’s flux through caps of every height is one number, the circulation, while the flux of the field itself through the same caps is not.',
    short:'Stokes: every surface on the loop carries the same flux of curl.'};
}
function drawSpace(ctx,W,H,M){

  /* the sphere through the axis labels, radius sqrt(2.3^2 + 2^2 + 2^2) = 3.65 (the cube's own is 2 sqrt 3), and the

  /* the cube's edges */
  const e=2; for(const [a,c] of [[[-e,-e,-e],[e,-e,-e]],[[-e,e,-e],[e,e,-e]],[[-e,-e,e],[e,-e,e]],[[-e,e,e],[e,e,e]],[[-e,-e,-e],[-e,e,-e]],[[e,-e,-e],[e,e,-e]],[[-e,-e,e],[-e,e,e]],[[e,-e,e],[e,e,e]],[[-e,-e,-e],[-e,-e,e]],[[e,-e,-e],[e,-e,e]],[[-e,e,-e],[-e,e,e]],[[e,e,-e],[e,e,e]]]) seg3(ctx,C,a,c,'#2a2f3d',1,null,true);
  for(const [p,t] of [[[e+0.3,-e,-e],'x'],[[-e,e+0.3,-e],'y'],[[-e,-e,e+0.3],'z']]){ const q=C.P(p); if(q) lab(ctx,W,H,q.x,q.y,t,'#6f7789',SM_FONT,'center','middle'); }
  const arrow3=(p,d,col,lw)=>{ const a=C.P(p), c=C.P([p[0]+d[0],p[1]+d[1],p[2]+d[2]]); if(a&&c) arrowHead(ctx,a.x,a.y,c.x,c.y,col,lw,6); };
  if(S.mode==='field'){
    const sp=S.lattice.map(q=>Math.hypot(q[3],q[4],q[5])).sort((a,c)=>a-c), ref=Math.max(1e-12,sp[Math.floor(0.9*(sp.length-1))]||1);
    const items=S.lattice.map(q=>{ const s=Math.hypot(q[3],q[4],q[5]), k=0.35*Math.min(1,s/ref)/Math.max(s,1e-12), a=C.P(q); return {q,k,d:a?a.z:1e9}; }).sort((a,c)=>c.d-a.d);
    const dmin=Math.min(...items.map(i=>i.d)), dmax=Math.max(...items.filter(i=>i.d<1e8).map(i=>i.d));

      arrow3([q[0]-q[3]*it.k/2,q[1]-q[4]*it.k/2,q[2]-q[5]*it.k/2],[q[3]*it.k,q[4]*it.k,q[5]*it.k],mix('#3a4256','#cfd4de',0.25+0.75*br),1.1); }
    if(S.v){ const pr=C.P(S.p); const vs=Math.hypot(S.v[0],S.v[1],S.v[2]), cs=Math.hypot(...S.parts.curl);

  } else if(S.mode==='gauss'){

    for(let i=0;i<nt;i++) for(let j=0;j<np;j++){ const t0=PI*i/nt, t1=PI*(i+1)/nt, p0=TAU*j/np, p1=TAU*(j+1)/np;
      const P=(t,p)=>[S.c[0]+S.R*Math.sin(t)*Math.cos(p),S.c[1]+S.R*Math.sin(t)*Math.sin(p),S.c[2]+S.R*Math.cos(t)];
      const tm=(t0+t1)/2, pm=(p0+p1)/2, n=[Math.sin(tm)*Math.cos(pm),Math.sin(tm)*Math.sin(pm),Math.cos(tm)], X=P(tm,pm), v=S.fv(X[0],X[1],X[2]);
      const pr=[P(t0,p0),P(t1,p0),P(t1,p1),P(t0,p1)].map(q=>C.P(q)); if(pr.some(q=>!q)) continue;
      patches.push({pr,d:pr.reduce((s,q)=>s+q.z,0)/4,f:v[0]*n[0]+v[1]*n[1]+v[2]*n[2]}); }

    for(const s of (S.F.sing||[])){ const q=C.P(s); if(q) dot(ctx,q.x,q.y,4,COL.zero,'#070b18'); }
    const pc=C.P(S.c); if(pc) dot(ctx,pc.x,pc.y,3,COL.live,'#fff');
    const bb=Lay.bottom[0];
    if(bb){ const curve=memo('gcurve',[S.F.id,S.c].join(':'),()=>{ const out=[]; for(let i=1;i<=36;i++){ const R=1.8*i/36;
        const through=(S.F.sing||[]).some(s=>Math.abs(Math.hypot(S.c[0]-s[0],S.c[1]-s[1],S.c[2]-s[2])-R)<1e-3);
        const inside=(S.F.sing||[]).filter(s=>Math.hypot(S.c[0]-s[0],S.c[1]-s[1],S.c[2]-s[2])<R).length;
        out.push([R,through?NaN:sphereFlux(S.fv,S.c,R,24),S.point?4*PI*inside:sphereDivIntegral(S.fv,S.c,R,12)]); } return out; });
      const ys=curve.flatMap(q=>[q[1],q[2]]).filter(isFinite), lo=Math.min(0,...ys), hi=Math.max(1e-6,...ys)*1.1, lo2=lo-0.05*(hi-lo);
      axesT(ctx,bb,0,1.8,lo2,hi,{title:titleFor(bb,'the flux out of the sphere and ∫div inside, as it grows','flux and ∫div'),xlab:'the radius',ny:4});
      polyline(ctx,bb,curve.map(q=>q[0]),curve.map(q=>q[1]),0,1.8,lo2,hi,COL.pos,2.4);
      polyline(ctx,bb,curve.map(q=>q[0]),curve.map(q=>q[2]),0,1.8,lo2,hi,COL.ref,1.4,[5,4]);
      vMark(ctx,bb,xOf(bb,S.R,0,1.8),COL.live);
      legendAuto(ctx,bb,[[COL.pos,'the flux'],[COL.ref,S.point?'4π × the charges inside (dashed)':'∫div inside (dashed)']]); }
  } else {
    const {n,e1,e2}=S.fr, patches=[], cu=X=>{ const v=S.fv(X[0],X[1],X[2]); return [v[10]-v[8],v[5]-v[9],v[6]-v[4]]; };
    const disk=(t,s)=>[0,1,2].map(i=>S.c[i]+s*(Math.cos(t)*e1[i]+Math.sin(t)*e2[i]));
    const Rs=(S.rho*S.rho+S.h*S.h)/(2*S.h), O=[0,1,2].map(i=>S.c[i]+n[i]*(S.h-Rs)), psim=Math.acos(clamp(1-S.h/Rs,-1,1));

      const cq=[capP(t0,psim*j/NR)[0],capP(t1,psim*j/NR)[0],capP(t1,psim*(j+1)/NR)[0],capP(t0,psim*(j+1)/NR)[0]], [cm,U]=capP((t0+t1)/2,psim*(j+0.5)/NR), w2=cu(cm);

    if(bb&&S.S){ const curve=memo('scurve',[S.F.id,S.c,S.fr.n,S.rho].join(':'),()=>{ const out=[];

/* ================================================================== *
 *  view 6: the decomposition                                          *
 * ================================================================== */
function helmCaption(Hm){ return {full:'Helmholtz on the torus (the square is periodic: what leaves one side enters the opposite one). Left: the field, coloured by speed. Middle: its gradient part ∇φ over φ (green high, magenta low), all its divergence. Right: its rotational part (∂ψ/∂y, −∂ψ/∂x) with the contours of ψ, which are its streamlines, all its curl. The mean, the third part, has neither.'+(Hm.preset==='bumps'?' Dots mark the sources (green) and sinks (magenta), rings the vortices (blue anticlockwise, orange clockwise); press to put down a '+BUMP_KINDS.find(k=>k.id===ST.hBump).name.replace(/^[^a-z]+/,'')+'.':'')+' Below: the energy of each part; they add up because the parts are orthogonal.',
  short:'A field split into a gradient, a curl and a mean.'}; }
function drawHelm(ctx,W,H,M){
  const Hm=M.H, cap=helmCaption(Hm), Lay=stageLayout(ctx,W,H,cap.full,cap.short,1,0.26,nbNarrow(H));
  const bm=Lay.main, gap=16, side=Math.max(60,Math.min((bm.w-2*gap)/3,bm.h-22)), x0=bm.x+(bm.w-3*side-2*gap)/2, N=HN, S=Hm.S;
  const panels=[['the field','v'],['its gradient part','∇φ'],['its rotational part','rot ψ']];
  panels.forEach((pn,k)=>{ const b=box(x0+k*(side+gap),bm.y+22,side,side);
    lab(ctx,W,H,b.x,b.y-18,titleFor(b,pn[0],pn[1]),'#aeb6c6','italic 13px Georgia, serif','left','top');
    let g, mx;
    if(k===0){ g=new Float64Array(N*N); mx=0; for(let q=0;q<N*N;q++){ g[q]=Math.hypot(Hm.vx[q],Hm.vy[q]); mx=Math.max(mx,g[q]); } }
    else { g=k===1?S.phi:S.psi; mx=0; for(let q=0;q<N*N;q++) mx=Math.max(mx,Math.abs(g[q])); }
    heatField(ctx,b,N,N,(i,j)=>{ const v=g[(N-1-j)*N+i]; return k===0?seqCol(0.08+0.72*v/Math.max(mx,1e-12)):divCol(v/Math.max(mx,1e-12)); },'h'+k+Hm.preset+(Hm.bumps?JSON.stringify(Hm.bumps):''));
    if(k===2){ const lv=[]; for(let i=-6;i<=6;i++) if(i) lv.push(mx*i/7); for(const l of lv) for(const s of contours(S.psi,N,N,0,TAU*(N-1)/N,0,TAU*(N-1)/N,l))
      sLine(ctx,s.map(p=>[b.x+b.w*p[0]/TAU,b.y+b.h*(1-p[1]/TAU)]),'rgba(233,236,244,0.45)',0.8); }
    const ax=k===0?Hm.vx:k===1?S.gx:S.rx, ay=k===0?Hm.vy:k===1?S.gy:S.ry, st=4; let ref=0;
    for(let q=0;q<N*N;q++) ref=Math.max(ref,Math.hypot(Hm.vx[q],Hm.vy[q]));
    for(let j=st/2;j<N;j+=st) for(let i=st/2;i<N;i+=st){ const q=j*N+i, u=ax[q], v=ay[q], s=Math.hypot(u,v), len=0.9*b.w/(N/st)*s/Math.max(ref,1e-12);
      if(s<1e-12) continue; const X=b.x+b.w*i/N, Y=b.y+b.h*(1-j/N); arrowHead(ctx,X-len*u/s/2,Y+len*v/s/2,X+len*u/s/2,Y-len*v/s/2,'rgba(233,236,244,0.8)',1,4); }
    frame(ctx,b,'#2a2f3d');
    if(k===0){ HIT.push({kind:'hmap',b});
      /* the bumps: sources green and sinks magenta as dots, vortices as rings (blue anticlockwise, orange clockwise) */
      if(Hm.bumps){ for(const [s,a,c] of Hm.bumps.src) dot(ctx,b.x+b.w*a/TAU,b.y+b.h*(1-c/TAU),3,s>0?COL.pos:COL.live,'#070b18');
        for(const [w,a,c] of Hm.bumps.vtx){ ctx.beginPath(); ctx.arc(b.x+b.w*a/TAU,b.y+b.h*(1-c/TAU),4.5,0,TAU); ctx.strokeStyle=w>0?COL.q:COL.ref; ctx.lineWidth=1.8; ctx.stroke(); } }
      if(Math.hypot(S.h[0],S.h[1])>1e-9){ const hs=Math.hypot(S.h[0],S.h[1]), L=Math.min(40,0.9*b.w/(N/st)*hs/Math.max(ref,1e-12)*3); arrowHead(ctx,b.x+12,b.y1-12,b.x+12+L*S.h[0]/hs,b.y1-12-L*S.h[1]/hs,COL.zero,2,6); } }
  });

    const bars=[['the field',e[0],COL.text],['∇φ',e[1],COL.pos],['rot ψ',e[2],COL.q],['the mean',hh,COL.zero]];
    bars.forEach(([nm,v,col],k)=>{ const X0=xOf(bb,0.5+k*1.1,0,5), X1=xOf(bb,1.3+k*1.1,0,5), Y=yOf(bb,v,0,hi); ctx.fillStyle=col; ctx.fillRect(X0,Y,X1-X0,bb.y1-Y);

/* ================================================================== *
 *  the scene                                                           *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);

  else if(M.view==='grad') drawGrad(ctx,W,H,M);
  else if(M.view==='div') drawDiv(ctx,W,H,M);
  else if(M.view==='curl') drawCurl(ctx,W,H,M);
  else if(M.view==='space') drawSpace(ctx,W,H,M);
  else drawHelm(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }

  function setFrom(hit,x,y,down){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1);
    if(hit.kind==='lmap'){ const p=world(hit,x,y); ST.lPx=clamp(p[0],-WIN,WIN); ST.lPy=clamp(p[1],-WIN,WIN); return true; }
    if(hit.kind==='lr'){ ST.lR=clamp(0.01*Math.pow(160,u),LIM.lR[0],LIM.lR[1]); return true; }
    if(hit.kind==='gmap'){ const p=world(hit,x,y); ST.gPx=clamp(p[0],LIM.gP[0],LIM.gP[1]); ST.gPy=clamp(p[1],LIM.gP[0],LIM.gP[1]); return true; }
    if(hit.kind==='dmap'){ const p=world(hit,x,y);
      /* a charge within 14 px is picked up where it was grabbed (it keeps its offset from the pointer, never jumps to it) */
      if(down){ const T=mapXY(hit.b,hit.w); let best=-1, d=14; CHARGES.forEach((c,k)=>{ const dd=Math.hypot(T.X(c[1])-x,T.Y(c[2])-y); if(dd<d){ d=dd; best=k; } }); DRAG.charge=best;
        if(best>=0) DRAG.off=[CHARGES[best][1]-p[0],CHARGES[best][2]-p[1]]; }
      if(DRAG.charge>=0){ CHARGES[DRAG.charge][1]=clamp(p[0]+DRAG.off[0],-2.8,2.8); CHARGES[DRAG.charge][2]=clamp(p[1]+DRAG.off[1],-2.8,2.8); }
      else { ST.dLx=clamp(p[0],-WIN,WIN); ST.dLy=clamp(p[1],-WIN,WIN); }
      return true; }
    if(hit.kind==='fmap'){ if(!down) return false; const p=world(hit,x,y), st=blobState(ST), c=[p[0],p[1]], q=blobStart(c), A=polyArea(q);
      st.push({c,p:q,A0:A,hist:[[SIM.blobT,A]]}); if(st.length>6) st.splice(4,1); return true; }
    if(hit.kind==='dn'){ ST.dN=clamp(Math.round(2+30*u),LIM.dN[0],LIM.dN[1]); return true; }
    if(hit.kind==='cmap'){ if(!down) return false; const p=world(hit,x,y); addWheel(ST,p[0],p[1]); return true; }
    if(hit.kind==='wmap'){ const p=world(hit,x,y);
      if(down){ const T=mapXY(hit.b,hit.w); let best=-1, d=Infinity; WIRES.forEach((w,k)=>{ const dd=Math.hypot(T.X(w[1]/MM)-x,T.Y(w[2]/MM)-y); if(dd<Math.max(10,WIRE_A/MM*T.s+4)&&dd<d){ d=dd; best=k; } }); DRAG.wire=best;
        if(best>=0) DRAG.off=[WIRES[best][1]/MM-p[0],WIRES[best][2]/MM-p[1]]; }
      if(DRAG.wire>=0){ WIRES[DRAG.wire][1]=clamp(p[0]+DRAG.off[0],-27,27)*MM; WIRES[DRAG.wire][2]=clamp(p[1]+DRAG.off[1],-27,27)*MM; }
      else { ST.cLx=clamp(p[0],-30,30); ST.cLy=clamp(p[1],-30,30); }
      return true; }
    if(hit.kind==='hmap'){ if(!down||ST.hPreset!=='bumps') return false; const a=TAU*u, c=TAU*clamp((hit.b.y+hit.b.h-y)/hit.b.h,0,1), k=ST.hBump;
      if(k==='src'||k==='snk') HBUMPS.src.push([k==='src'?1:-1,a,c]); else HBUMPS.vtx.push([k==='ccw'?1:-1,a,c]);
      while(HBUMPS.src.length+HBUMPS.vtx.length>12) (HBUMPS.src.length>HBUMPS.vtx.length?HBUMPS.src:HBUMPS.vtx).shift();
      return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; }
      if(hit.kind==='cam'){ DRAG.what='cam'; DRAG.key=hit.key; DRAG.x=x; DRAG.y=y; DRAG.th=ST[hit.key[0]]; DRAG.ph=ST[hit.key[1]]; return false; }
      DRAG.what=hit; DRAG.charge=-1; DRAG.wire=-1; return setFrom(hit,x,y,true); }
    if(type==='move'){ if(!DRAG.what) return false;
      if(DRAG.what==='cam'){ ST[DRAG.key[0]]=DRAG.th-(x-DRAG.x)*0.008; ST[DRAG.key[1]]=clamp(DRAG.ph+(y-DRAG.y)*0.006,-1.45,1.45); return true; }
      return setFrom(DRAG.what,x,y,false); }
    DRAG.what=null; return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');

  const errEl=document.getElementById('errbox');

  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');

    const val=h('span',{class:'val'});
