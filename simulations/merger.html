/* ================================================================== *
 *  self-test                                                          *
 *                                                                     *
 *  Values marked (scipy) were computed OUTSIDE this file.  The         *
 *  catalogue check is the interesting one: GWOSC publishes m1, m2 AND  *
 *  Mc as separate entries of the same posterior, so recomputing Mc     *
 *  and comparing tests the formula and the transcription together.     *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(c,n)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+n); } };
  const close=(a,b,t,n)=>ok(Math.abs(a-b)<=t,n+'  (got '+a+', want '+b+', tol '+t+')');
  const rel=(a,b,t,n)=>ok(Math.abs(a-b)<=t*Math.abs(b),
    n+'  (got '+a+', want '+b+', rel tol '+t+')');

  /* ---------- the catalogue checks itself ---------------------------- */
  {
    ok(EVENTS.length===11,'GWTC-1 has eleven confident events');
    let worst=0, worstId='';
    for(const e of EVENTS){
      const mine=chirpMass(e.m1,e.m2);
      const d=Math.abs(mine-e.mc)/e.mc;
      if(d>worst){ worst=d; worstId=e.id; }
      ok(d<0.02,'recomputed chirp mass matches the published one for '+e.id
         +' ('+fmt(100*d,2)+'%)');
    }
    ok(worst<0.013,'and the worst disagreement over the catalogue is '+fmt(100*worst,2)
       +'% ('+worstId+')');
    /* the radiated fraction must be physical for every binary black hole */
    for(const e of EVENTS){
      if(e.mf===null) continue;
      const fr=(e.m1+e.m2-e.mf)/(e.m1+e.m2);
      ok(fr>0.02&&fr<0.08,'radiated fraction for '+e.id+' is '+fmt(100*fr,2)+'%, in 2–8%');
      ok(e.mf<e.m1+e.m2,'and the remnant is lighter than the sum for '+e.id);
      ok(e.m1>=e.m2,'m1 >= m2 by convention for '+e.id);
    }
    ok(EVENTS.filter(e=>e.mf===null).length===1,
       'exactly one event has no published final mass (GW170817)');
    ok(eventById('GW170817').kind==='bns','and it is the neutron-star binary');
  }

  /* ---------- chirp mass, exactly --------------------------------- */
  {
    rel(chirpMass(35.6,30.6),28.716496,1e-6,'Mc(35.6,30.6) = 28.7165 (scipy)');
    rel(chirpMass(1.46,1.27),1.184844662948,1e-11,'Mc(1.46,1.27) = 1.1848447 (scipy)');
    /* equal masses: Mc = M / 2^(6/5) exactly */
    for(const m of [1.4,10,35,80]) rel(chirpMass(m,m),2*m/Math.pow(2,1.2),1e-14,
      'equal masses give Mc = M/2^(6/5) at m='+m);
    /* it is symmetric, and scales linearly */
    rel(chirpMass(20,7),chirpMass(7,20),1e-15,'chirp mass is symmetric');
    rel(chirpMass(60,20),3*chirpMass(20,20/3),1e-13,'and is homogeneous of degree one');
    rel(symRatio(30,30),0.25,1e-15,'eta = 1/4 for equal masses');
    ok(symRatio(50,5)<0.25,'and less than that otherwise');
  }

  /* ---------- the chirp, against scipy ----------------------------- */
  {
    const mc=chirpMass(35.6,30.6), M=66.2;
    rel(timeToMerge(mc,20),0.815234,1e-5,'t to merge from 20 Hz = 0.8152 s (scipy)');
    rel(timeToMerge(mc,35),0.183308,1e-5,'from 35 Hz = 0.1833 s (scipy)');
    rel(timeToMerge(mc,150),3.782559058601e-3,1e-10,'from 150 Hz = 3.7826 ms (scipy)');
    rel(freqDot(mc,100),3362.5508,1e-5,'fdot at 100 Hz = 3362.55 Hz/s (scipy)');
    rel(strainAmp(mc,150,440),2.053712e-21,1e-5,'h at 150 Hz, 440 Mpc = 2.05e-21 (scipy)');
    /* This one was asserted against 67.4157 in the first draft — a number that was
       never actually read, because the terminal output carrying it had been
       truncated.  The test caught it.  The value is 66.4226. */
    rel(fISCO(M),66.422579457,1e-9,'f_ISCO for 66.2 M☉ = 66.4226 Hz (scipy)');
    rel(separation(M,35),899038,1e-4,'separation at 35 Hz = 899 km (scipy)');
    /* freqAtTime inverts timeToMerge */
    for(const f of [15,35,80,200]) rel(freqAtTime(mc,timeToMerge(mc,f)),f,1e-9,
      'freqAtTime inverts timeToMerge at f='+f);
    /* the scaling laws that pin the exponents */
    rel(timeToMerge(mc,2*35)/timeToMerge(mc,35),Math.pow(2,-8/3),1e-12,'t ∝ f^(−8/3)');
    rel(freqDot(mc,2*35)/freqDot(mc,35),Math.pow(2,11/3),1e-12,'ḟ ∝ f^(11/3)');
    rel(strainAmp(mc,2*35,440)/strainAmp(mc,35,440),Math.pow(2,2/3),1e-12,'h ∝ f^(2/3)');
    rel(strainAmp(mc,35,880)/strainAmp(mc,35,440),0.5,1e-13,'and h ∝ 1/D');
    rel(strainAmp(2*mc,35,440)/strainAmp(mc,35,440),Math.pow(2,5/3),1e-12,'h ∝ Mc^(5/3)');
    rel(fISCO(2*M)/fISCO(M),0.5,1e-13,'f_ISCO ∝ 1/M — heavier binaries merge LOWER');
    /* the Schwarzschild radius: nothing else pinned its factor of two */
    rel(schwarzschild(1),2953.2500,1e-6,'2GM/c² for one solar mass is 2.9533 km');
    rel(schwarzschild(2*M)/schwarzschild(M),2,1e-14,'and it is linear in mass');
    rel(schwarzschild(M),2*lenM(M),1e-15,'with lenM half of it');
    /* cycles: half of them happen in the last few percent of the time */
    const nAll=cyclesBetween(mc,20,fISCO(M),600);
    rel(nAll,22.55873,2e-3,'22.6 GW cycles from 20 Hz to ISCO (scipy)');
    const fHalf=(function(){ let lo=20,hi=fISCO(M);
      for(let i=0;i<60;i++){ const m=0.5*(lo+hi);
        if(cyclesBetween(mc,20,m,200)<nAll/2) lo=m; else hi=m; }
      return 0.5*(lo+hi); })();
    const tHalf=timeToMerge(mc,fHalf);
    const frac=tHalf/timeToMerge(mc,20);
    /* for an UNBOUNDED inspiral the answer is exactly 2^(-8/5) = 0.3299; the ISCO
       cutoff removes the last, fastest cycles and pushes it to 0.404 */
    rel(frac,0.404118,2e-3,'half the cycles happen in the last 40% of the time (scipy)');
    ok(frac>Math.pow(2,-8/5),'which is later than the unbounded-inspiral value 2^(-8/5)');
  }

  /* ---------- the ringdown ----------------------------------------- */
  {
    rel(qnmFreq(63.1,0.69),271.78517,1e-6,'QNM of a 63.1 M☉, a=0.69 remnant = 271.8 Hz (scipy)');
    rel(qnmQ(0.69),3.24508,1e-5,'its quality factor is 3.245 (scipy)');
    rel(qnmTau(63.1,0.69),0.003800577,1e-5,'and it decays in 3.80 ms (scipy)');
    rel(qnmFreq(2.70,0.70),6402.02738,1e-6,'a 2.7 M☉ remnant rings at 6.4 kHz (scipy)');
    /* the frequency scales as 1/M at fixed spin, exactly */
    rel(qnmFreq(2*63.1,0.69)/qnmFreq(63.1,0.69),0.5,1e-13,'QNM frequency ∝ 1/M');
    ok(qnmFreq(63.1,0.9)>qnmFreq(63.1,0.3),'a faster-spinning remnant rings higher');
    ok(qnmQ(0.9)>qnmQ(0.3),'and rings for longer');
    /* about one cycle of decay — the ringdown is over almost before it starts */
    /* one cycle at moderate spin, and not many more even near extremal:
       Q/pi is 0.76 at a=0.3, 1.03 at 0.69 and 1.65 at 0.9 */
    for(const a of [0.3,0.69,0.9]) ok(qnmQ(a)/PI<2.0,
       'the remnant rings for order one cycle, not many, at a='+a);
    rel(qnmQ(0.9)/PI,1.647629,1e-4,'1.65 cycles at a = 0.9 (scipy)');
    ok(qnmQ(0.3)/PI<1,'and under one cycle at a = 0.3');
  }

  /* ---------- the remnant fits, and their honesty ------------------- */
  {
    rel(finalSpinFit(30,30),0.6864,2e-3,'the final-spin fit gives 0.686 at equal mass');
    rel(finalSpinFit(35.6,30.6),0.69,0.03,'and 0.68 for GW150914 against the published 0.69');
    ok(finalSpinFit(100,1)<finalSpinFit(30,30),'an extreme mass ratio spins the remnant up less');
    /* the eta-scaling for the radiated fraction, against the catalogue it was fitted to */
    let worst=0;
    for(const e of EVENTS){
      if(e.mf===null) continue;
      const pub=(e.m1+e.m2-e.mf)/(e.m1+e.m2);
      const fit=radiatedFractionFit(e.m1,e.m2);
      worst=Math.max(worst,Math.abs(fit-pub)/pub);
    }
    ok(worst<0.30,'the radiated-fraction fit is within 30% on every catalogue event ('
       +fmt(100*worst,1)+'%)');
    ok(worst>0.20,'and it is NOT better than 20% — it leaves out spin, and the file says so');
    rel(finalMassFit(30,30)+ERAD_K*4*0.25*60,60,1e-12,'the final-mass fit conserves the budget');
  }

  /* ---------- the detector ----------------------------------------- */
  {
    rel(noiseASD(100),2.855036e-24,1e-5,'aLIGO fit at 100 Hz = 2.86e-24 /√Hz (scipy)');
    rel(noiseASD(215),1.816590e-24,1e-5,'at 215 Hz = 1.82e-24 (scipy)');
    rel(noiseASD(30),1.823862e-23,1e-5,'at 30 Hz = 1.82e-23 (scipy)');
    /* the minimum is where it should be */
    let fb=0,vb=Infinity;
    for(let f=30;f<600;f+=0.05){ const v=noisePSD(f); if(v<vb){ vb=v; fb=f; } }
    rel(fb,228.268,2e-3,'the curve bottoms out at 228 Hz (scipy)');
    rel(Math.sqrt(vb),1.800389e-24,1e-4,'at 1.80e-24 /√Hz (scipy)');
    ok(noiseASD(10)>10*noiseASD(200),'and it walls up steeply at low frequency');
    /* SNR: scaling, then the absolute value */
    const mc=chirpMass(35.6,30.6);
    rel(snrOptimal(mc,66.2,880,20,800)/snrOptimal(mc,66.2,440,20,800),0.5,1e-6,'SNR ∝ 1/D');
    rel(snrOptimal(mc,66.2,440,20,800),55.916,0.02,
        'optimal single-detector SNR for GW150914 ≈ 56 (scipy)');
    ok(snrOptimal(mc,66.2,440,20,800)>2*eventById('GW150914').snr*0.9,
       'which is about twice the published network SNR, as an optimal orientation should be');
    rel(horizonDistance(mc,66.2,20,8),snrOptimal(mc,66.2,440,20,800)/8*440,1e-3,
        'the horizon is just the SNR scaled to threshold');
    /* Characteristic strain exists so that AREA ON THE PAGE is signal-to-noise:
         rho^2 = 4 INT |h~|^2/S_n df  ==  INT (2f|h~|)^2/(f S_n) d(ln f).
       Recomputing the SNR the second way pins the factor of two in charStrain
       and the definition of noiseStrain together — nothing else did, and the
       mutation sweep found both. */
    {
      const D=440, fhi=fISCO(66.2), a=Math.log(20), b=Math.log(fhi);
      const N=800; let s=0;
      for(let i=0;i<=N;i++){
        const f=Math.exp(a+(b-a)*i/N);
        const w=(i===0||i===N)?1:(i%2?4:2);
        const r=charStrain(mc,f,D)/noiseStrain(f);
        s+=w*r*r;
      }
      const rhoLog=Math.sqrt(s*(b-a)/(3*N));
      rel(rhoLog,snrOptimal(mc,66.2,D,20,800),2e-4,
          'the characteristic-strain log-integral reproduces the SNR exactly');
    }
    rel(charStrain(mc,100,440),2*100*hTilde(mc,100,440),1e-15,'h_c is 2f|h̃| by definition');
    rel(noiseStrain(100),Math.sqrt(100*noisePSD(100)),1e-15,'and h_n is √(f S_n)');
    /* the horizon must turn over: a heavy enough binary merges below the band */
    const hz=m=>fISCO(m)>20?horizonDistance(chirpMass(m/2,m/2),m,20,8):0;
    let peakM=0,peakD=0;
    for(let m=5;m<600;m*=1.05){ const d=hz(m); if(d>peakD){ peakD=d; peakM=m; } }
    /* ~51 Msun for an INSPIRAL-ONLY horizon integrated to ISCO.  Real published
       horizon curves peak higher because they count the merger and ringdown,
       which this file does not have and does not pretend to. */
    rel(peakM,50.663,0.06,'the horizon peaks near 51 M☉ for an inspiral-only SNR (scipy)');
    ok(hz(1000)===0,'and a 1000 M☉ binary merges below the band entirely');
    ok(hz(300)<peakD*0.6,'with the collapse well under way by 300 M☉');
  }

  /* ---------- energy and luminosity -------------------------------- */
  {
    rel(L_PLANCK,3.628254904e52,1e-9,'c⁵/G = 3.628e52 W (scipy)');
    rel(MSUN_C2,1.787093669e47,1e-9,'one solar mass is 1.787e47 J (scipy)');
    rel(radiatedEnergyJ(3.1),5.539990e47,1e-6,'GW150914 radiated 5.54e47 J (scipy)');
    rel(luminosityFraction(3.6e49),0.00099221,1e-4,
        'the published peak is 0.00099 c⁵/G — a thousandth of the Planck luminosity');
    ok(luminosityFraction(3.6e49)<1,'which is, as it must be, below c⁵/G');
    /* the quadrupole luminosity scaling */
    const mc=chirpMass(35.6,30.6);
    const L=f=>(32/5)*L_PLANCK*Math.pow(tauM(mc)*PI*f,10/3);
    rel(L(2*40)/L(40),Math.pow(2,10/3),1e-12,'L ∝ f^(10/3)');
    ok(L(fISCO(66.2))<3.6e49,'and at ISCO it is still below the merger peak, as it should be');
  }

  /* ---------- the waveform ----------------------------------------- */
  {
    const M=buildModel(Object.assign({},DEFAULTS,{nProf:401}));
    ok(M.wave.hs.every(isFinite),'the strain series is finite everywhere');
    ok(M.wave.fs.every(v=>isFinite(v)&&v>0),'and so is the frequency track');
    ok(M.wave.hmax>0,'the waveform is not identically zero');
    /* the three segments must all be present and in order */
    const seen=[]; for(const s of M.wave.segs) if(seen[seen.length-1]!==s) seen.push(s);
    ok(seen.length===3&&seen[0]==='inspiral'&&seen[1]==='merger'&&seen[2]==='ringdown',
       'the waveform runs inspiral → merger → ringdown, in that order (got '+seen.join('→')+')');
    /* the frequency must increase monotonically through inspiral and merger */
    let mono=true;
    for(let i=1;i<M.wave.fs.length;i++)
      if(M.wave.segs[i]!=='ringdown'&&M.wave.fs[i]<M.wave.fs[i-1]-1e-9) mono=false;
    ok(mono,'and the frequency never decreases before the ringdown');
    /* the ringdown decays */
    const rd=[]; for(let i=0;i<M.wave.ts.length;i++) if(M.wave.segs[i]==='ringdown')
      rd.push(Math.abs(M.wave.hs[i]));
    ok(rd.length>10&&Math.max.apply(null,rd.slice(-5))<Math.max.apply(null,rd.slice(0,5)),
       'and the ringdown decays');
    /* the inspiral amplitude must track the analytic envelope exactly */
    let wenv=0;
    for(let i=0;i<M.wave.ts.length;i++){
      const t=M.wave.ts[i];
      if(M.wave.segs[i]!=='inspiral') continue;
      const env=strainAmp(M.mc,freqAtTime(M.mc,-t),M.D);
      if(Math.abs(M.wave.hs[i])>env*(1+1e-9)) wenv=Math.max(wenv,Math.abs(M.wave.hs[i])/env-1);
    }
    ok(wenv<1e-9,'the inspiral never exceeds its own analytic envelope');
  }

  /* ---------- panels build clean ----------------------------------- */
  for(const view of ['inspiral','wave','spectrogram','catalogue','detector','ledger']){
    for(const id of ['GW150914','GW170817','GW170729','GW170608']){
      const s=Object.assign({},DEFAULTS,{view,event:id,nProf:151});
      const M=buildModel(s);
      const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
      ok(html.length>200&&html.indexOf('NaN')<0&&html.indexOf('undefined')<0,
         'panels build clean for '+view+' / '+id);
      ok(eqbarText(M).indexOf('NaN')<0,'headless summary is clean for '+view+' / '+id);
    }
  }
  {
    let bad=0;
    for(const e of EVENTS){
      const M=buildModel(Object.assign({},DEFAULTS,{event:e.id,nProf:121}));
      if(eqbarText(M).indexOf('NaN')>=0) bad++;
      if(!M.wave.hs.every(isFinite)) bad++;
    }
    ok(bad===0,'every catalogue event renders a clean panel and a finite waveform');
    /* the whole slider space, including binaries that never enter the band */
    let bad2=0, outOfBand=0;
    for(const m1 of [1,5,35,150]) for(const m2 of [1,5,35,150]) for(const fl of [5,20,100])
      for(const D of [10,440,8000]){
        const M=buildModel(Object.assign({},DEFAULTS,
          {custom:true,m1,m2,D,fLow:fl,nProf:81}));
        if(!M.wave.hs.every(isFinite)) bad2++;
        if(!isFinite(M.mc)||!isFinite(M.snr)||!isFinite(M.horiz)) bad2++;
        if(eqbarText(M).indexOf('NaN')>=0) bad2++;
        if(!M.inBand) outOfBand++;
      }
    ok(bad2===0,'and no combination of masses, distance and cutoff produces a NaN');
    ok(outOfBand>0,'including the heavy binaries that merge below the band entirely');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
