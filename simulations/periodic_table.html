<title>Periodic table — the periodic law and what it is made of</title>
<!--
  THE PERIODIC TABLE, AND WHY IT HAS THE SHAPE IT HAS.

  The table is not a list of elements. It is a PICTURE OF ONE QUANTUM NUMBER
  SEQUENCE, folded so that atoms with the same outer-shell occupancy stand in
  the same column. Everything else — the trends, the block widths, the two
  detached rows — is a consequence of that fold.

  ORDER IS NUCLEAR CHARGE, NOT MASS. Mendeleev ordered by atomic weight and had
  to transpose pairs (Ar/K, Co/Ni, Te/I) to keep the chemistry right. Moseley
  settled it in 1913 by measuring K-alpha X-ray lines and finding

      sqrt(nu) = k (Z - sigma)          (Moseley's law)

  linear in an INTEGER Z, not in mass. The transpositions vanish the moment the
  table is ordered by Z: this sim's self-test checks that all four classical
  weight-order inversions are real in the data and that ordering by Z removes
  them.

  BLOCK WIDTHS ARE 2(2l+1). A subshell of angular momentum l holds 2(2l+1)
  electrons — 2, 6, 10, 14 for s, p, d, f. Those are exactly the widths of the
  four blocks. The table is 18 wide because 2 + 6 + 10 = 18, and the f-block is
  pulled out below only to keep the page from being 32 columns wide (the "wide"
  layout button puts it back where it belongs).

  ROW LENGTHS COME FROM THE MADELUNG RULE. Subshells fill in order of increasing
  (n + l), ties broken by increasing n:

      1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p

  which gives period lengths 2, 8, 8, 18, 18, 32, 32 — the shape of the table.
  The rule is a rule of thumb, not a theorem, and this sim does not pretend
  otherwise: it CONSTRUCTS the Madelung prediction for all 118 elements,
  compares it against the measured ground-state configurations, and the
  Electrons tab marks every element where nature disagrees. There are 20 such
  anomalies (Cr, Cu, Nb, Mo, Ru, Rh, Pd, Ag, La, Ce, Gd, Pt, Au, Ac, Th, Pa, U,
  Np, Cm, Lr) and the self-test asserts that the anomaly set is EXACTLY that —
  so a data typo cannot quietly add or remove one. They are where d/f-shell
  exchange energy beats the (n+l) ordering; Pd is the extreme case, jumping two
  electrons at once to [Kr] 4d10 with no 5s at all.

  IONIZATION ENERGY IS THE SHELL STRUCTURE MADE VISIBLE. The Electrons tab plots
  the SUCCESSIVE ionization energies of one atom on a log axis. The staircase
  jumps by roughly an order of magnitude every time a closed shell is broken
  into — the plot of sodium falls 5.14, 47.3, 71.6 ... and the big step from the
  1st to the 2nd is the 2-8-1 structure showing itself. The core-break indices
  are computed from the shell occupancies and drawn as vertical rules, so the
  claim is checkable by eye rather than asserted.

  ISOTOPES: the chart of nuclides is the table's second dimension. Elements are
  one axis (Z); the neutron number N is the other, and the Isotopes tab draws
  all 3400 known ground-state nuclides coloured by decay mode. The band of
  stability sits at N ~ Z for light nuclei and bends to N ~ 1.5 Z by lead,
  because the Coulomb repulsion between protons grows like Z^2 while the strong
  force is short-ranged and saturates.

  WHERE THE NUMBERS COME FROM, AND WHERE THEY STOP.
    - Element properties: the mendeleev database (Mentel), which aggregates
      CRC/Wikipedia/Rahm-Hoffmann-Ashcroft radii, Pyykko covalent radii, Allen
      and Pauling electronegativities.
    - Ionization energies: NIST Atomic Spectra Database, all successive stages.
    - Isotope masses and natural abundances: NIST Atomic Weights and Isotopic
      Compositions (which is the IUPAC representative composition).
    - Half-lives, spin-parities and decay modes: NUBASE via mendeleev/IAEA.

  Three limits are real and are shown as limits rather than papered over:

  1. NIST's isotopic-composition table and its standard-atomic-weight table are
     of different vintages and do NOT perfectly reconcile. Summing abundance x
     mass reproduces the published weight to better than 2e-4 relative for every
     element, but two are visibly off — SELENIUM (78.9594 computed vs 78.971
     published) and MOLYBDENUM (95.9598 vs 95.95) — because both weights were
     revised in 2013 while the composition table was not. selfTest asserts the
     2e-4 bound AND asserts that Se and Mo are the only two beyond 5e-5, so the
     day a data update fixes them the test will say so.
  2. Twenty-two elements have no single standard atomic weight at all. IUPAC
     gives them an INTERVAL, because their isotopic composition varies measurably
     between natural sources — lithium's is [6.938, 6.997], a 0.8% spread caused
     by industrial Li-6 depletion. Those elements are shown with the interval,
     not a fake single number, and selfTest checks the computed weight falls
     inside the published interval rather than equalling a midpoint.
  3. Isomers are not included. The only place this bites a headline number is
     tantalum, whose weight depends on the 0.012% Ta-180m isomer; the natural
     abundance therefore sums to 99.988% for Ta and to 100% everywhere else.
     selfTest pins that exact exception.
     Elements 104-118 have essentially no measured bulk properties (no melting
     point, no density, no electronegativity). Their tiles read "—" rather than
     an extrapolation.

  COLOUR IS COMPUTED, NOT CHOSEN. Two scales, both validated rather than eyeballed:
    - The 10 category hues are the solution of a constrained search over the
      sRGB cube: OKLCH lightness inside the dark-mode band 0.48-0.67, chroma
      >= 0.105, WCAG contrast >= 3:1 against the #070b18 surface, and — over ALL
      45 pairs, not just adjacent ones — OKLab dE >= 15 under normal vision and
      >= 6 under simulated protanopia and deuteranopia (Machado 2009). Subject to
      those, the hues were pulled as close as possible to their conventional
      associations, which is why alkali metals still read warm and noble gases
      still read violet. Ten categories cannot clear the dE >= 8 CVD target — the
      dichromat gamut is not big enough — so the set sits in the documented 6-8
      relief band, which is legal only with secondary encoding. That encoding is
      present and is not optional here: every tile carries its symbol and name,
      the legend is labelled, and category is ALSO encoded positionally, since
      the categories are contiguous regions of the table.
    - The sequential ramp for property heat maps follows the same Mathematica
      NeonColors hue path used by every other sim in this collection, but its
      lightness is FORCED monotone (OKLCH L from 0.88 down to 0.52 — the lower
      end is set by the 3:1 contrast floor against the surface). The raw
      NEON ramp is not usable for magnitude: its top half is flat in lightness
      (L = 0.612, 0.624, 0.619, 0.612, 0.612 over t = 0.5..1.0), so half the
      range cannot be ordered by eye. selfTest asserts strict monotonicity and
      the 3:1 contrast floor, so the defect cannot come back.

  Single file, no dependencies, works over file://. The table is DOM (crisp text,
  real hit targets, keyboard navigation); the four analysis strips are hand-rolled
  canvas 2-D.

  Headless self-test: extract the script body (between the LAST script open/close
  tags, cf. rindex) and run it with
      osascript -l JavaScript ptable_test.js
  — with `document` undefined it runs the assertion suite (data integrity, the
  Madelung construction and its 20 anomalies, atomic-weight closure against the
  IUPAC intervals, isotope abundance sums, layout collision-freedom, formula
  charge balance, periodic trends, colour-scale monotonicity) instead of booting
  the UI.
-->

  #wrap{display:flex; flex:1; min-height:0;}
  #stage{position:relative; flex:1; min-width:0; display:flex; flex-direction:column;}
  #tablewrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;

  #table{display:grid; gap:2px; position:relative;}
  #table.std{grid-template-columns:repeat(18,var(--ts));
             grid-template-rows:repeat(7,var(--ts)) calc(var(--ts)*.42) repeat(2,var(--ts));}
  #table.wide{grid-template-columns:repeat(32,var(--ts)); grid-template-rows:repeat(7,var(--ts));}

  .tile{position:relative; border-radius:3px; overflow:hidden; cursor:pointer;
        background:var(--unk); border:1px solid rgba(255,255,255,.07);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        line-height:1.02; transition:box-shadow .1s, transform .1s; user-select:none;}
  .tile:hover{box-shadow:0 0 0 2px var(--accent); z-index:5; transform:scale(1.06);}
  .tile.sel{box-shadow:0 0 0 2px #fff; z-index:6;}
  .tile.dim{opacity:.2;}
  .tile .tz{position:absolute; top:1px; left:3px; font-size:calc(var(--ts)*.17);

  .tile .tsym{font-weight:600; font-size:calc(var(--ts)*.36); letter-spacing:.2px;}

  .tile .tval{font-size:calc(var(--ts)*.155); font-family:"SF Mono",Menlo,monospace; opacity:.95;
              max-width:98%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .glabel{color:#5d6577; font:calc(var(--ts)*.19) "SF Mono",Menlo,monospace;

  #chart{position:absolute; inset:0; width:100%; height:100%; display:block;}

  .checks label{font-size:12.5px; color:var(--text); display:flex; align-items:center;

  .checks input{accent-color:var(--accent); width:13px; height:13px;}
  .tag{font:11px "SF Mono", Menlo, monospace; color:#868e9f; margin-top:5px; line-height:1.55;}

  .card .csym{font:600 30px -apple-system,sans-serif; line-height:1; letter-spacing:.5px;}
  .card .cnm{font:italic 17px Georgia,serif; color:#fff; line-height:1.1;}
  .card .cmeta{font-size:11px; color:var(--dim); margin-top:3px; letter-spacing:.2px;}
  .card .cz{margin-left:auto; text-align:right; font:11px "SF Mono",Menlo,monospace; color:var(--dim);}

  .desc{font-size:11.5px; line-height:1.6; color:#8f97a8; margin-top:9px;}

  .scaleends{display:flex; justify-content:space-between; font:10.5px "SF Mono",Menlo,monospace;

  .isotab{width:100%; border-collapse:collapse; font-size:11px; margin-top:5px;}

  .isotab th:first-child{text-align:left; padding-left:0;}
  .isotab td{padding:1.4px 0 1.4px 8px; text-align:right; font-family:"SF Mono",Menlo,monospace;

  .isotab td:first-child{text-align:left; color:var(--text); padding-left:0;}
  .isotab td:last-child{white-space:normal; overflow-wrap:anywhere;}
  .isotab tr.stable td{color:var(--neon-a);}
  .isotab tr.stable td:first-child{color:var(--neon-a);}
  .fml{font-size:13px; color:var(--text); font-family:Georgia,serif;}
  .fml sub{font-size:9.5px;}
  .fmlrow{display:flex; align-items:baseline; gap:8px; padding:2.5px 0; border-bottom:1px solid #14171f;}

  [hidden]{display:none !important;}

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, simulations/CHANGELOG.md.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(c,a){ const q=toRgb(c); return 'rgba('+q[0]+','+q[1]+','+q[2]+','+a+')'; }

/* ---- sRGB <-> OKLab, and the brand sequential ramp ---------------- *
   The Mathematica NeonColors table used by every other sim in this
   collection is a fine IDENTITY ramp but a bad MAGNITUDE ramp: over
   t = 0.5..1 its OKLCH lightness is 0.612, 0.624, 0.619, 0.612, 0.612 —
   flat, so half the range cannot be ordered by eye.  ramp() keeps the
   NEON hue path and forces lightness monotone from 0.88 down to 0.50.  */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while(i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}

function lin2lab(r,g,b){
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b);
  const m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b);
  const s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,
          1.9779984951*l-2.4285922050*m+0.4505937099*s,
          0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
function lab2lin(L,a,b){
  const l=Math.pow(L+0.3963377774*a+0.2158037573*b,3);
  const m=Math.pow(L-0.1055613458*a-0.0638541728*b,3);
  const s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
  return [ 4.0767416621*l-3.3077115913*m+0.2309699292*s,
          -1.2684380046*l+2.6097574011*m-0.3413193965*s,
          -0.0041960863*l-0.7034186147*m+1.7076147010*s];
}
function labHex(L,C,H){                       // binary-search chroma into gamut
  let lo=0, hi=C;
  for(let k=0;k<22;k++){ const mid=(lo+hi)/2, c=lab2lin(L,mid*Math.cos(H),mid*Math.sin(H));
    if(c.every(v=>v>=-1e-4&&v<=1+1e-4)) lo=mid; else hi=mid; }
  const c=lab2lin(L,lo*Math.cos(H),lo*Math.sin(H));
  const q=v=>{const n=Math.round(255*clamp(lin2s(v),0,1)); return (n<16?'0':'')+n.toString(16);};
  return '#'+q(c[0])+q(c[1])+q(c[2]);
}
const RAMP_L0=0.88, RAMP_L1=0.52;
function ramp(t){
  t=clamp(t,0,1);
  const c=neon(t), lab=lin2lab(s2lin(c[0]),s2lin(c[1]),s2lin(c[2]));
  return labHex(lerp(RAMP_L0,RAMP_L1,t), Math.max(Math.hypot(lab[1],lab[2]),0.13),

function oklabOf(hex){ const c=toRgb(hex); return lin2lab(s2lin(c[0]/255),s2lin(c[1]/255),s2lin(c[2]/255)); }
function relLum(hex){ const c=toRgb(hex).map(v=>s2lin(v/255));

function contrastRatio(a,b){ const x=relLum(a),y=relLum(b);

/* ink that stays readable on an arbitrary fill */
function inkOn(hex){ return relLum(hex)>0.22?'#08090d':'#eef1f6'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k==='text') e.textContent=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){ const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c); }
  return e;
}

[21,"Sc","Scandium",3,4,2,8,"44.955908(5)",44.955908,0,1814.15,3109.15,2.99,1.36,0.188,263.0,148.0,215.0,15.8,25.52,22.0,6e-07,"1s2 2s2 2p6 3s2 3p6 3d1 4s2",[3],[0,1,2],"HEX",1879,"Lars Nilson","Latin: Scandia, Scandinavia.","#ff1493",97.0,7.042,15.8,332.7,3460.0,"Rare soft silvery metallic element belonging to group 3 of the periodic table. There are ten isotopes, nine of which are radioactive and have short half-lives. Predicted in 1869 by Mendeleev, isolated by Nilson in 1879.","Scandium metal is used in some aerospace applications. Scandum oxide (Sc2O3) is used in the manufacture of high-intensity electric lamps. Scandium iodide (ScI3) is used in lamps that produce light having a color closely matching natural sunlight.","Occurs mainly in the minerals thortveitile (~34% scandium) and wiikite. Also in some tin and tungsten ores. Pure scandium is obtained as a by-product of uranium refining.",null,3,4,17,4,44.955908,0],
[22,"Ti","Titanium",4,4,2,8,"47.867(1)",47.867,0,1943.15,3560.15,4.506,1.54,0.079,257.0,136.0,211.0,21.9,25.06,5650.0,0.001,"1s2 2s2 2p6 3s2 3p6 3d2 4s2",[4],[-2,-1,0,1,2,3],"HEX",1791,"William Gregor","Greek: titanos (Titans).","#808090",87.0,8.17,18.8,422.6,11.1,"White metallic transition element. Occurs in numerous minerals. Used in strong, light corrosion-resistant alloys. Forms a passive oxide coating when exposed to air. First discovered by Gregor in 1789.","Since it is strong and resists acids it is used in many alloys. Titanium dioxide (TiO2), a white pigment that covers surfaces very well, is used in paint, rubber, paper and many others.","Usually occurs in the minerals ilmenite (FeTiO3) or rutile (TiO2). Also in Titaniferous magnetite, titanite (CaTiSiO5), and iron ores. Pure metal produced by heating TiO2 with C and Cl2 to produce TiCl4 then heated with Mg gas in Ar atmosphere.",null,4,4,18,4,47.867,0],
[23,"V","Vanadium",5,4,2,8,"50.9415(1)",50.9415,0,2183.15,3680.15,6.0,1.63,0.525,252.0,134.0,207.0,30.7,24.89,120.0,0.0025,"1s2 2s2 2p6 3s2 3p6 3d3 4s2",[5],[-3,-1,0,1,2,3,4],"BCC",1830,"Nils Sefström","From Scandinavian goddess, Vanadis.","#ff1493",87.0,9.063,17.5,460.0,357.0,"Soft and ductile, bright white metal. Good resistance to corrosion by alkalis, sulphuric and hydrochloric acid. It oxidizes readily about 933K. There are two naturally occurring isotopes of vanadium, and 5 radioisotopes, V-49 having the longest half-life at 337 days. Vanadium has nuclear applications, the foil is used in cladding titanium to steel, and vanadium-gallium tape is used to produce a superconductive magnet. Originally discovered by Andres Manuel del Rio of Mexico City in 1801. His discovery went unheeded, however, and in 1820, Nils Gabriel Sefstron of Sweden rediscovered it. Metallic vanadium was isolated by Henry Enfield Roscoe in 1867. The name vanadium comes from Vanadis, a goddess of Scandinavian mythology. Silvery-white metallic transition element. Vanadium is essential to Ascidians. Rats and chickens are also known to require it. Metal powder is a fire hazard, and vanadium compounds should be considered highly toxic. May cause lung cancer if inhaled.","It is mixed with other metals to make very strong and durable alloys. Vanadium pentoxide (V2O5) is used as a catalyst, dye and color-fixer.","Found in the minerals patronite (VS4), vanadinite [Pb5(VO4)3Cl], and carnotite [K2(UO2)2(VO4)2.3H2O]. Pure metal produced by heating with C and Cl to produce VCl3 which is heated with Mg in Ar atmosphere.",null,5,4,19,4,50.9415,0],
[24,"Cr","Chromium",6,4,2,8,"51.9961(6)",51.9961,0,2180.15,2944.15,7.15,1.66,0.666,233.0,122.0,206.0,93.9,23.35,102.0,0.0003,"1s2 2s2 2p6 3s2 3p6 3d5 4s1",[3,6],[-4,-2,-1,0,1,2,4,5],"BCC",1797,"Louis Vauquelin","Greek: chrôma (color).","#808090",83.0,9.77,21.0,342.0,9.4,"Hard silvery transition element. Used in decorative electroplating. Discovered in 1797 by Vauquelin.","Used to make stainless steel. It gives the color to rubies and emeralds. Iron-nickel-chromium alloys in various percentages yield an incredible variety of the most important metals in modern technology.","Chromite [Fe,Mg(CrO4)] is its most important mineral. Produced commercially by heating its ore in the presence of silicon or aluminium.",null,6,4,20,4,51.9961,0],
[25,"Mn","Manganese",7,4,2,8,"54.938044(3)",54.938044,0,1519.15,2334.15,7.3,1.55,null,242.0,119.0,205.0,null,26.32,950.0,0.0002,"1s2 2s2 2p6 3s2 3p6 3d5 4s2",[2,4,7],[-3,-1,0,1,3,5,6],"CUB",1774,"Johann Gahn","Latin: magnes (magnet); Italian: manganese.","#808090",68.0,10.34,13.4,221.0,1.82,"Grey brittle metallic transition element. Rather electropositive, combines with some non-metals when heated. Discovered in 1774 by Scheele.","Used in steel, batteries and ceramics. The steel in railroad tracks can contain as much as 1.2% manganese. It is crucial to the effectiveness of vitamin B1.","Most abundant ores are pyrolusite (MnO2), psilomelane [(Ba,H2O)2Mn5O10] and rhodochrosite (MnCO3). Pure metal produced by mixing MnO2 with powered Al and ignited in a furnace.",4325.15,7,4,21,4,54.938044,0],
[26,"Fe","Iron",8,4,2,8,"55.845(2)",55.845,0,1811.15,3134.15,7.87,1.83,0.151,237.0,116.0,204.0,80.4,25.1,56300.0,0.002,"1s2 2s2 2p6 3s2 3p6 3d6 4s2",[2,3],[-4,-2,-1,0,1,4,5,6,7],"BCC",null,"Known to the ancients.","Anglo-Saxon: iron; symbol from Latin: ferrum (iron).","#ffa500",62.0,10.64,13.8,340.0,0.424,"Silvery malleable and ductile metallic transition element. Has nine isotopes and is the fourth most abundant element in the earth's crust. Required by living organisms as a trace element (used in hemoglobin in humans.) Quite reactive, oxidizes in moist air, displaces hydrogen from dilute acids and combines with nonmetallic elements.","Used in steel and other alloys. Essential for humans. It is the chief constituent of hemoglobin which carries oxygen in blood vessels. Its oxides are used in magnetic tapes and disks.","Obtained from iron ores. Pure metal produced in blast furnaces by layering limestone, coke and iron ore and forcing hot gasses into the bottom. This heats the coke red hot and the iron is reduced from its oxides and liquified where it flows to the bottom",9340.15,8,4,22,4,55.845,0],
[27,"Co","Cobalt",9,4,2,8,"58.933194(4)",58.933194,0,1768.15,3200.15,8.86,1.88,0.662256,233.0,111.0,200.0,100.0,24.81,25.0,2e-05,"1s2 2s2 2p6 3s2 3p6 3d7 4s2",[2,3],[-3,-1,0,1,4,5],"HEX",1739,"George Brandt","German: kobold (goblin).","#ff1493",55.0,10.86,15.48,389.1,32.8,"Light grey transition element. Some meteorites contain small amounts of metallic cobalt. Generally alloyed for use. Mammals require small amounts of cobalt salts. Cobalt-60, an artificially produced radioactive isotope of Cobalt is an important radioactive tracer and cancer-treatment agent. Discovered by G. Brandt in 1737.","Used in many hard alloys; for magnets, ceramics and special glasses. Remains hard up to 982°C. Radioactive cobalt-60 is used in cancer therapy.","Occurs in compounds with arsenic, oxygen and sulfur as in cobaltine (CoAsS) and linneite (Co3S4). Pure cobalt is obtained as a byproduct of refining nickel, copper and iron.",null,9,4,23,4,58.933194,0],
[28,"Ni","Nickel",10,4,2,8,"58.6934(4)",58.6934,0,1728.15,3186.15,8.9,1.91,1.156,229.0,110.0,197.0,90.9,26.07,84.0,0.00056,"1s2 2s2 2p6 3s2 3p6 3d8 4s2",[2],[-2,-1,0,1,3,4],"FCC",1751,"Axel Cronstedt","German: kupfernickel (false copper).","#a52a2a",49.0,11.13,17.61,378.6,13.9,"Malleable ductile silvery metallic transition element. Discovered by A.F. Cronstedt in 1751.","Used in electroplating and metal alloys because of its resistance to corrosion. Also in nickel-cadmium batteries; as a catalyst and for coins.","Chiefly found in pentlandite [(Ni,Fe)9S8] ore. The metal is produced by heating the ore in a blast furnace which replaces the sulfur with oxygen. The oxides are then treated with an acid that reacts with the iron not the nickel.",null,10,4,24,4,58.6934,0],
[29,"Cu","Copper",11,4,2,8,"63.546(3)",63.546,0,1357.77,2833.15,8.96,1.9,1.235,217.0,112.0,196.0,401.0,24.44,60.0,0.00025,"1s2 2s2 2p6 3s2 3p6 3d10 4s1",[2],[-2,0,1,3,4],"FCC",null,"Known to the ancients.","Symbol from Latin: cuprum (island of Cyprus famed for its copper mines).","#a52a2a",46.5,10.96,13.01,304.6,6.0,"Red-brown transition element. Known by the Romans as 'cuprum.' Extracted and used for thousands of years. Malleable, ductile and an excellent conductor of heat and electricity. When in moist conditions, a greenish layer forms on the outside.","Most often used as an electrical conductor. Also used in the manufacture of water pipes. Its alloys are used in jewelry and for coins.","Pure copper occurs rarely in nature. Usually found in sulfides as in chalcopyrite (CuFeS2), coveline (CuS), chalcosine (Cu2S) or oxides like cuprite (Cu2O).",null,11,4,25,4,63.546,0],
