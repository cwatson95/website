[31,"Ga","Gallium",13,4,1,7,"69.723(1)",69.723,0,302.915,2502.15,5.91,1.81,0.43,233.0,124.0,187.0,28.1,26.03,19.0,3e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p1",[3],[-5,-4,-3,-2,-1,0,1,2],"ORC",1875,"Paul Émile Lecoq de Boisbaudran","Latin: Gallia (France).","#ff1493",50.0,10.39,5.59,270.3,148.0,"Soft silvery metallic element, belongs to group 13 of the periodic table. The two stable isotopes are Ga-69 and Ga-71. Eight radioactive isotopes are known, all having short half-lives. Gallium Arsenide is used as a semiconductor. Corrodes most other metals by diffusing into their lattice. First identified by Francois Lecoq de Boisbaudran in 1875.","Used in semiconductor production. It us used in making LEDs (light-emitting diodes) and GaAs laser diodes.","Found throughout the crust in minerals like bauxite, germanite and coal.",null,13,4,27,4,69.723,0],
[32,"Ge","Germanium",14,4,1,5,"72.630(8)",72.63,0,1211.4,3106.15,5.3234,2.01,1.23271,234.0,121.0,211.0,60.2,23.222,1.5,5e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p2",[-4,2,4],[-3,-2,-1,0,1,3],"DIA",1886,"Clemens Winkler","Latin: Germania (Germany).","#ff1493",40.0,11.8,36.8,328.0,914.0,"Lustrous hard metalloid element, belongs to group 14 of the periodic table. Forms a large number of organometallic compounds. Predicted by Mendeleev in 1871, it was actually found in 1886 by Winkler.","Widely used in semiconductors. It is a good semiconductor when combined with tiny amounts of phosphorus, arsenic, gallium, and antimony.","Obtained from refining copper, zinc and lead.",9802.15,14,4,28,4,72.63,0],
[33,"As","Arsenic",15,4,1,5,"74.921595(6)",74.921595,0,1090.15,889.15,5.75,2.18,0.804,231.0,121.0,185.0,null,24.64,1.8,0.0037,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p3",[-3,3,5],[-2,-1,0,1,2,4],"RHL",null,"Known to the ancients.","Greek: arsenikon; Latin: arsenicum, (both names for yellow pigment).","#ff1493",30.0,13.08,null,32.4,0.999,"Metalloid element of group 15. There are three allotropes, yellow, black, and grey. Reacts with halogens, concentrated oxidizing acids and hot alkalis. Albertus Magnus is believed to have been the first to isolate the element in 1250.","Many of its compounds are deadly poison and used as weed killer and rat poison. Conducts electricity. Used in semiconductors. Some compounds, called arsenides, are used in the manufacture of paints, wallpapers, and ceramics.","Found in mispickel (arsenopyrite)",1673.15,15,4,29,4,74.921595,1],
[34,"Se","Selenium",16,4,1,1,"78.971(8)",78.971,0,493.95,958.15,4.809,2.55,2.02067,224.0,116.0,190.0,0.52,25.363,0.05,0.0002,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p4",[-2,2,4,6],[-1,0,1,3,5],"HEX",1818,"Jöns Berzelius","Greek: selênê (moon).","#ff1493",28.9,14.34,5.23,59.7,21.4,"Metalloid element, belongs to group 16 of the periodic table. Multiple allotropic forms exist. Chemically resembles sulphur. Discovered in 1817 by Jons J. Berzelius.","Light causes it to conduct electricity more easily. It is used in photoelectric cells, TV cameras, xerography machines and as a semiconductor in solar batteries and rectifiers. Also colors glass red.","Obtained from lead, copper and nickel refining. Conducts electricity when struck by light.",1766.15,16,4,30,4,78.971,0],
[35,"Br","Bromine",17,4,1,6,"[79.901,79.907]",79.904,0,265.95,331.95,3.1028,2.96,3.36359,219.0,114.0,185.0,0.005,75.69,2.4,67.3,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p5",[-1,1,3,5],[2,4,7],"ORC",1826,"Antoine J. Balard","Greek: brômos (stench).","#a52a2a",21.0,15.88,10.57,29.56,4.39,"Halogen element. Red volatile liquid at room temperature. Its reactivity is somewhere between chlorine and iodine. Harmful to human tissue in a liquid state, the vapour irritates eyes and throat. Discovered in 1826 by Antoine Balard.","It was once used in large quantities to make a compound that removed lead compound build up in engines burning leaded gasoline. Now it is primarily used in dyes, disinfectants, and photographic chemicals.","Occurs in compounds in sea water.",588.15,17,4,31,4,null,0],
[36,"Kr","Krypton",18,4,1,2,"83.798(2)",83.798,0,115.78,119.735,0.003425,null,null,212.0,117.0,202.0,0.0095,20.786,0.0001,0.00021,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6",[2],[1],"FCC",1898,"Sir William Ramsey, M.W. Travers","Greek: kryptos (hidden).","#ff1493",16.78,17.54,null,9.05,290.0,"Colorless gaseous element, belongs to the noble gases. Occurs in the air, 0.0001% by volume. It can be extracted from liquid air by fractional distillation. Generally not isolated, but used with other inert gases in fluorescent lamps. Five natural isotopes, and five radioactive isotopes. Kr-85, the most stable radioactive isotope, has a half-life of 10.76 years and is produced in fission reactors. Practically inert, though known to form compounds with Fluorine.","Used in lighting products. Some is used as inert filler-gas in incandescent bulbs. Some is mixed with argon in fluorescent lamps. The most important use is in flashing stroboscopic lamps that outline airport runways.","Forms 1 millionth of the atmosphere. Obtained from production of liquid air.",209.48,18,4,32,4,83.798,0],
[37,"Rb","Rubidium",1,5,0,3,"85.4678(3)",85.4678,0,312.45,961.15,1.53,0.82,0.48592,240.0,210.0,303.0,58.2,31.06,90.0,0.12,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 5s1",[1],[-1],"BCC",1861,"R. Bunsen, G. Kirchoff","Latin: rubidus (deep red); the color its salts impart to flames.","#ff1493",319.8,4.177,2.2,75.8,15500.0,"Soft silvery metallic element, belongs to group 1 of the periodic table. Rb-97, the naturally occurring isotope, is radioactive. It is highly reactive, with properties similar to other elements in group 1, like igniting spontaneously in air. Discovered spectroscopically in 1861 by W. Bunsen and G.R. Kirchoff.","Used as a catalyst, photocells, and vacuum and cathode-ray tubes.","Occurs abundantly, but so widespread that production is limited. Usually obtained from lithium production.",2093.15,1,5,1,5,85.4678,0],
[38,"Sr","Strontium",2,5,0,4,"87.62(1)",87.62,0,1050.15,1650.15,2.64,0.95,0.048,279.0,185.0,249.0,null,26.79,370.0,7.9,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 5s2",[2],[1],"FCC",1790,"A. Crawford","From the Scottish town, Strontian.","#ff1493",197.2,5.695,9.2,144.0,6.53,"Soft yellowish metallic element, belongs to group 2 of the periodic table. Highly reactive chemically. Sr-90 is present in radioactive fallout and has a half-life of 28 years. Discovered in 1798 by Klaproth and Hope, isolated in 1808 by Humphry Davy.","Used in flares and fireworks for crimson color. Strontium-90 is a long lived highly radioactive fallout product of atomic-bomb explosions.","Found in minerals celestite and strontianite.",null,2,5,2,5,87.62,0],
[39,"Y","Yttrium",3,5,2,8,"88.90584(2)",88.90584,0,1795.15,3618.15,4.47,1.22,0.307,274.0,163.0,232.0,null,26.53,33.0,1.3e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d1 5s2",[3],[0,1,2],"HEX",1789,"Johann Gadolin","From the Swedish village, Ytterby, where one of its minerals was first found.","#ff1493",162.0,6.631,11.5,367.0,31.0,"Silvery-grey metallic element of group 3 on the periodic table. Found in uranium ores. The only natural isotope is Y-89, there are 14 other artificial isotopes. Chemically resembles the lanthanoids. Stable in the air below 400 degrees, celsius. Discovered in 1828 by Friedrich Wohler.","Combined with europium to make red phosphors for color TV's. Yttrium oxide and iron oxide combine to form a crystal garnet used in radar.","Found in minerals such as monazite, xenotime, and yttria.",null,3,5,17,5,88.90584,0],
[40,"Zr","Zirconium",4,5,2,8,"91.224(2)",91.224,0,2127.15,4679.15,6.52,1.33,0.426,269.0,154.0,223.0,22.7,25.36,165.0,3e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d2 5s2",[4],[1,2,3],"HEX",1789,"Martin Klaproth","From the mineral, zircon.","#ff1493",112.0,7.808,19.2,567.0,35.7,"Grey-white metallic transition element. Five natural isotopes and six radioactive isotopes are known. Used in nuclear reactors for a Neutron absorber. Discovered in 1789 by Martin Klaproth, isolated in 1824 by Berzelius.","Used in alloys such as zircaloy which is used in nuclear applications since it does not readily absorb neutrons. Also baddeleyite is used in lab crucibles. Used in high-performance pumps and valves. Clear zircon (ZrSiO4) is a popular gemstone.","Found in many minerals such as zircon and baddeleyite.",null,4,5,18,5,91.224,0],
[41,"Nb","Niobium",5,5,2,8,"92.90637(2)",92.90637,0,2750.15,5014.15,8.57,1.6,0.917406,251.0,147.0,218.0,53.7,24.6,20.0,1e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d4 5s1",[5],[-3,-1,0,1,2,3,4],"BCC",1801,"Charles Hatchet","From Niobe; daughter of the mythical Greek king Tantalus.","#ff1493",98.0,8.34,26.8,680.0,61.4,"Soft, ductile grey-blue metallic transition element. Used in special steels and in welded joints to increase strength. Combines with halogens and oxidizes in air at 200 degrees celsius. Discovered by Charles Hatchett in 1801 and isolated by Blomstrand in 1864. Called Columbium originally.","Used as an alloy with iron and nickel. It can be used in nuclear reactors and is known to be superconductive when alloyed with tin, aluminum or zirconium.","Occurs in a mineral columbite. Formerly known as colombium (Cb). It is used in stainless steel alloys for nuclear reactors, jets and missiles.",null,5,5,19,5,92.90637,0],
[42,"Mo","Molybdenum",6,5,2,8,"95.95(1)",95.95,0,2895.15,4912.15,10.2,2.16,0.748,244.0,138.0,217.0,null,24.06,1.2,0.01,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d5 5s1",[4,6],[-4,-2,-1,0,1,2,3,5],"BCC",1778,"Carl Wilhelm Scheele","Greek: molybdos (lead).","#ff1493",87.0,8.71,28.0,590.0,40.1,"Silvery-white, hard metallic transition element. It is chemically unreactive and is not affected by most acids. It oxidizes at high temperatures. There are seven natural isotopes, and four radioisotopes, Mo-93 being the most stable with a half-life of 3500 years. Molybdenum is used in almost all high-strength steels, it has nuclear applications, and is a catalyst in petroleum refining. Discovered in 1778 by Carl Welhelm Scheele of Sweden. Impure metal was prepared in 1782 by Peter Jacob Hjelm. The name comes from the Greek word molybdos which means lead. Trace amounts of molybdenum are required for all known forms of life. All molybdenum compounds should be considered highly toxic, and will also cause severe birth defects.","Its alloys are used in aircraft, missiles, and protective coatings in boiler plate.","Found in the minerals molybdenite (MoS2) and wulfenite (MoO4Pb).",null,6,5,20,5,95.95,0],
[43,"Tc","Technetium",7,5,2,8,"[98]",97.90721,1,2430.15,4535.15,11.0,2.1,0.55,252.0,128.0,216.0,50.6,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d5 5s2",[4,7],[-3,-1,1,2,3,5,6],"HEX",1937,"Carlo Perrier, Émillo Segrè","Greek: technêtos (artificial).","#ff1493",79.0,8.94,23.8,585.0,100000.0,"Radioactive metallic transition element. Can be detected in some stars and the fission products of uranium. First made by Perrier and Segre by bombarding molybdenum with deutrons, giving them Tc-97. Tc-99 is the most stable isotope with a half-life of 2.6*10^6 years. Sixteen isotopes are known. Organic technetium compounds are used in bone imaging. Chemical properties are intermediate between rhenium and manganese.","Added to iron in quantities as low as 55 part-per-million transforms the iron into a corrosion-resistant alloy.","Made first by bombarding molybdenum with deuterons (heavy hydrogen) in a cyclotron.",null,7,5,21,5,null,0],
[44,"Ru","Ruthenium",8,5,2,8,"101.07(2)",101.07,0,2606.15,4420.15,12.1,2.2,1.05,237.0,125.0,213.0,117.0,24.06,0.001,7e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d7 5s1",[3,4],[-4,-2,1,2,5,6,7,8],"HEX",1844,"Karl Klaus","Latin: Ruthenia (Russia).","#ff1493",72.0,9.1,25.5,null,10400.0,"Hard white metallic transition element. Found with platinum, used as a catalyst in some platinum alloys. Dissolves in fused alkalis, and is not attacked by acids. Reacts with halogens and oxygen at high temperatures. Isolated in 1844 by K.K. Klaus.","Used to harden platinum and palladium. Aircraft magnetos use platinum alloy with 10% ruthenium.","Found in pentlandite and pyroxinite.",null,8,5,22,5,101.07,0],
[45,"Rh","Rhodium",9,5,2,8,"102.90550(2)",102.9055,0,2236.15,3968.15,12.4,2.28,1.137,233.0,125.0,210.0,150.0,24.98,0.001,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d8 5s1",[3],[-3,-1,1,2,4,5,6,7],"FCC",1803,"William Wollaston","Greek: rhodon (rose). Its salts give a rosy solution.","#ff1493",66.0,9.259,21.8,494.0,147000.0,"Silvery white metallic transition element. Found with platinum and used in some platinum alloys. Not attacked by acids, dissolves only in aqua regia. Discovered in 1803 by W.H. Wollaston.","Used as a coating to prevent wear on high quality science equipment and with platinum to make thermocouples.","Obtained as a by-product of nickel production.",null,9,5,23,5,102.9055,0],
[46,"Pd","Palladium",10,5,2,8,"106.42(1)",106.42,0,1827.95,3236.15,12.0,2.2,0.562,215.0,120.0,210.0,71.8,25.98,0.015,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10",[2,4],[1,3,5],"FCC",1803,"William Wollaston","Named after the asteroid, Pallas, discovered in 1803.","#ff1493",26.14,9.402,17.24,372.4,49500.0,"Soft white ductile transition element. Found with some copper and nickel ores. Does not react with oxygen at normal temperatures. Dissolves slowly in hydrochloric acid. Discovered in 1803 by W.H. Wollaston.","Used as a substitue for silver in dental items and jewelry. The pure metal is used as the delicate mainsprings in analog wristwatches. Also used in surgical instruments and as catalyst .","Obtained with platinum, nickel, copper and mercury ores.",null,10,5,24,5,106.42,0],
[47,"Ag","Silver",11,5,2,8,"107.8682(2)",107.8682,0,1234.93,2435.15,10.5,1.93,1.302,225.0,128.0,211.0,429.0,25.35,0.075,4e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s1",[1],[-2,-1,0,2,3],"FCC",null,"Known to the ancients.","Anglo-Saxon: siolful, (silver); symbol from Latin: argentium.","#808090",55.0,11.05,11.95,254.1,521.0,"White lustrous soft metallic transition element. Found in both its elemental form and in minerals. Used in jewellery, tableware and so on. Less reactive than silver, chemically.","Used in alloys for jewelry and in other compounds for photography. It is also a good conductor, but expensive.","Found in ores called argentite (AgS), light ruby silver (Ag3AsS3), dark ruby silver(Ag3SbS3) and brittle silver.",6410.15,11,5,25,5,107.8682,0],
[48,"Cd","Cadmium",12,5,2,8,"112.414(4)",112.414,0,594.219,1040.15,8.69,1.69,null,238.0,136.0,218.0,96.9,26.02,0.15,0.00011,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2",[2],[-2,1],"HEX",1817,"Fredrich Stromeyer","Greek: kadmeia (ancient name for calamine (zinc oxide)).","#ff1493",46.0,8.995,6.11,59.1,2.73,"Soft bluish metal belonging to group 12 of the periodic table. Extremely toxic even in low concentrations. Chemically similar to zinc, but lends itself to more complex compounds. Discovered in 1817 by F. Stromeyer.","Used in nickel-cadmium batteries. Also in electroplating steel and in the manufacture of berings. Its compounds are found in paint pigments and a wide variety of intense colors. Boiling cadmium gives off a weird, yellow-colored vapor that is poisonous.","Obtained as a by product of zinc refining.",null,12,5,26,5,112.414,0],
[49,"In","Indium",13,5,1,7,"114.818(1)",114.818,0,429.748,2300.15,7.31,1.78,0.3,246.0,142.0,193.0,81.8,26.74,0.25,0.02,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p1",[3],[-5,-2,-1,0,1,2],"TET",1863,"Ferdinand Reich, T. Richter","Latin: indicum (color indigo), the color it shows in a spectroscope.","#ff1493",65.0,9.793,3.24,225.1,167.0,"Soft silvery element belonging to group 13 of the periodic table. The most common natural isotope is In-115, which has a half-life of 6*10^4 years. Five other radioisotopes exist. Discovered in 1863 by Reich and Richter.","Used to coat high speed bearings and as an alloy that lowers the melting point of other metals. Relativly small amounts are used in dental items and in electronic semiconductors.","Found in certain zinc ores.",null,13,5,27,5,114.818,0],
[50,"Sn","Tin",14,5,1,7,"118.710(7)",118.71,0,505.078,2859.15,7.287,1.96,1.11207,248.0,140.0,217.0,66.8,26.99,2.3,4e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p2",[-4,2,4],[-3,-2,-1,0,1,3],"TET",null,"Known to the ancients.","Named after Etruscan god, Tinia; symbol from Latin: stannum (tin).","#ff1493",53.0,10.79,7.07,296.0,18.7,"Silvery malleable metallic element belonging to group 14 of the periodic table. Twenty-six isotopes are known, five of which are radioactive. Chemically reactive. Combines directly with chlorine and oxygen and displaces hydrogen from dilute acids.","Used as a coating for steel cans since it is nontoxic and noncorrosive. Also in solder (33%Sn:67%Pb), bronze (20%Sn:80%Cu), and pewter. Stannous fluoride (SnF2), a compound of tin and fluorine is used in some toothpaste.","Principally found in the ore cassiterite(SnO2) and stannine (Cu2FeSnS4).",null,14,5,28,5,118.71,0],
[51,"Sb","Antimony",15,5,1,5,"121.760(1)",121.76,0,903.778,1860.15,6.68,2.05,1.046,246.0,140.0,206.0,24.43,25.23,0.2,0.00024,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p3",[-3,3,5],[-2,-1,0,1,2,4],"RHL",null,"Known to the ancients.","Greek: anti and monos (not alone); symbol from mineral stibnite.","#ff1493",43.0,11.74,20.08,195.2,5.79,"Element of group 15. Multiple allotropic forms. The stable form of antimony is a blue-white metal. Yellow and black antimony are unstable non-metals. Used in flame-proofing, paints, ceramics, enamels, and rubber. Attacked by oxidizing acids and halogens. First reported by Tholden in 1450.","It is alloyed with other metals to increase their hardness. Also in the manufacture of a few special types of semiconductor devices. Also in plastics and chemicals. A few kinds of over-the-counter cold and flu remedies use antimony compounds.","Found in stibnite (Sb2S3) and in valentinite (Sb2O3).",null,15,5,29,5,121.76,0],
[52,"Te","Tellurium",16,5,1,5,"127.60(3)",127.6,0,722.66,1261.15,6.232,2.1,1.97088,242.0,136.0,206.0,14.3,25.73,0.001,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p4",[-2,2,4,6],[-1,0,1,3,5],"HEX",1782,"Franz Müller von Reichenstein","Latin: tellus (earth).","#ff1493",38.0,12.76,17.91,49.8,63.5,"Silvery metalloid element of group 16. Eight natural isotopes, nine radioactive isotopes. Used in semiconductors and to a degree in some steels. Chemistry is similar to Sulphur. Discovered in 1782 by Franz Miller.","Used to improve the machining quality of copper and stainless steel products and to color glass and ceramics. Also in thermoelectric devices. Some is used in the rubber industry and it is a basic ingredient in manufacturing blasting caps.","Obtained as a by-product of copper and lead refining.",2329.15,16,5,30,5,127.6,0],
[53,"I","Iodine",17,5,1,6,"126.90447(3)",126.90447,0,386.85,457.55,4.933,2.66,3.05904,238.0,133.0,198.0,null,54.43,0.45,0.06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p5",[-1,1,3,5,7],[2,4,6],"ORC",1811,"Bernard Courtois","Greek: iôeides (violet colored).","#a020f0",32.9,13.95,15.52,41.95,35.0,"Dark violet nonmetallic element, belongs to group 17 of the periodic table. Insoluble in water. Required as a trace element for living organisms. One stable isotope, I-127 exists, in addition to fourteen radioactive isotopes. Chemically the least reactive of the halogens, and the most electropositive metallic halogen. Discovered in 1812 by Courtois.","Required in small amounts by humans. Once used as an antiseptic, but no longer due to its poisonous nature.","Occurs on land and in the sea in sodium and potassium compounds.",819.15,17,5,31,5,126.90447,0],
[54,"Xe","Xenon",18,5,1,2,"131.293(6)",131.293,0,161.4,165.051,0.005366,2.6,-0.056,232.0,131.0,216.0,0.0057,20.786,3e-05,5e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p6",[2,4,6],[8],"FCC",1898,"Sir William Ramsay; M. W. Travers","Greek: xenos (strange).","#ff1493",27.32,15.27,null,12.65,1800.0,"Colourless, odourless gas belonging to group 18 on the periodic table (the noble gases.) Nine natural isotopes and seven radioactive isotopes are known. Xenon was part of the first noble-gas compound synthesized. Several others involving Xenon have been found since then. Xenon was discovered by Ramsey and Travers in 1898.","Used for filling flash lamps and other powerful lamps. Electrical excitation of xenon produces a burst of brilliant whtie light. Also used in bubble chambers and modern nuclear power reactors.","Obtain from the small quantities in liquid air.",289.733,18,5,32,5,131.293,0],
[55,"Cs","Cesium",1,6,0,3,"132.90545196(6)",132.905452,0,301.65,944.15,1.873,0.79,0.471626,249.0,232.0,343.0,35.9,32.21,3.0,0.0003,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p6 6s1",[1],[-1],"BCC",1860,"Gustov Kirchoff, Robert Bunsen","Latin: coesius (sky blue); for the blue lines of its spectrum.","#ff1493",400.9,3.898,2.09,68.3,61800.0,"Soft silvery-white metallic element belonging to group 1 of the periodic table. One of the three metals which are liquid at room temperature. Cs-133 is the natural, and only stable, isotope. Fifteen other radioisotopes exist. Caesium reacts explosively with cold water, and ice at temperatures above 157K. Caesium hydroxide is the strongest base known. Caesium is the most electropositive, most alkaline and has the least ionization potential of all the elements. Known uses include the basis of atomic clocks, catalyst for the hydrogenation of some organic compounds, and in photoelectric cells. Caesium was discovered by Gustav Kirchoff and Robert Bunsen in Germany in 1860 spectroscopically. Its identification was based upon the bright blue lines in its spectrum. The name comes from the latin word caesius, which means sky blue. Caesium should be considered highly toxic. Some of the radioisotopes are even more toxic.","Used as a 'getter' to remove air traces in vacuum and cathode-ray tubes. Also used in producing photoelectric devices and atomic clocks. Since it ionizes readily, it is used as an ion rocket motor propellant.","Found in pollucite [(Cs4Al4Si9O26).H2O] and as trace in lepidolite.",1938.15,1,6,1,6,132.90545196,0],
[56,"Ba","Barium",2,6,0,4,"137.327(7)",137.327,0,1000.15,2118.15,3.62,0.89,0.14462,293.0,196.0,268.0,null,28.07,425.0,0.013,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p6 6s2",[2],[1],"BCC",1808,"Sir Humphrey Davy","Greek: barys (heavy or dense).","#ffa500",272.0,5.211,7.66,142.0,0.246,"Silvery-white reactive element, belonging to group 2 of the periodic table. Soluble barium compounds are extremely poisonous. Identified in 1774 by Karl Scheele and extracted in 1808 by Humphry Davy.","Barite, or barium sulfate (BaSO4), when ground is used as a filter for rubber, plastics, and resins. It is insoluable in water and so is used in X-rays of the digestive system. Barium nitrate, Ba(NO3)2, burns brilliant green and is used in fireworks.","Found in barytine (BaSO4) and witherite (BaCO3), never found in pure form due to its reactivity. Must be stored under kerosene to remain pure.",null,2,6,2,6,137.327,0],
[57,"La","Lanthanum",3,6,2,9,"138.90547(7)",138.90547,0,1193.15,3737.15,6.15,1.1,0.47,284.0,180.0,243.0,13.4,27.11,39.0,3.4e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p6 5d1 6s2",[3],[0,1,2],"HEX",1839,"Carl Mosander","Greek: lanthanein (to be hidden).","#ff1493",215.0,null,8.5,402.0,4.78,"(From the Greek word lanthanein, to line hidden) Silvery metallic element belonging to group 3 of the periodic table and oft considered to be one of the lanthanoids. Found in some rare-earth minerals. Twenty-five natural isotopes exist. La-139 which is stable, and La-138 which has a half-life of 10^10 to 10^15 years. The other twenty-three isotopes are radioactive. It resembles the lanthanoids chemically. Lanthanum has a low to moderate level of toxicity, and should be handled with care. Discovered in 1839 by C.G. Mosander.","It is used in the electodes of high-intensity, carbon-arc lights. Also used in the production of high-grade europium metal. Because it gives glass refractive properties, it is used in expensive camera lenses.","Found with rare earths in monazite and bastnasite. Monazite sand typicall contains 25% lanthanum.",null,3,9,3,6,138.90547,0],
[58,"Ce","Cerium",0,6,3,9,"140.116(1)",140.116,0,1072.15,3716.15,6.77,1.12,0.65,282.0,163.0,242.0,11.3,26.94,66.5,1.2e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f1 5s2 5p6 5d1 6s2",[3,4],[1,2],"FCC",1803,"W. von Hisinger, J. Berzelius, M. Klaproth","Named after the asteroid, Ceres, discovered two years before the element.","#ff1493",205.0,null,5.2,398.0,4.57,"Silvery metallic element, belongs to the lanthanoids. Four natural isotopes exist, and fifteen radioactive isotopes have been identified. Used in some rare-earth alloys. The oxidized form is used in the glass industry. Discovered by Martin .H. Klaproth in 1803.","Its oxides are used in the optics and glass-making industries. Its salts are used in the photography and textile industry. Used in high-intensity carbon lamps and as alloying agents in special metals.","Most abundant rare earth metal. Found in many minerals like monazite sand [Ce(PO4)].",null,4,9,4,6,140.116,0],
[59,"Pr","Praseodymium",0,6,3,9,"140.90766(2)",140.90766,0,1204.15,3793.15,6.773,1.13,0.962,286.0,176.0,240.0,12.5,27.2,9.2,6.4e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f3 5s2 5p6 6s2",[3],[0,1,2,4,5],"HEX",1885,"C.F. Aver von Welsbach","Greek: prasios and didymos (green twin); from its green salts.","#ff1493",216.0,null,11.3,331.0,103.0,"Soft silvery metallic element, belongs to the lanthanoids. Only natural isotope is Pr-141 which is not radioactive. Fourteen radioactive isotopes have been artificially produced. Used in rare-earth alloys. Discovered in 1885 by C.A. von Welsbach.","Used with neodymium to make lenses for glass maker's goggles since it filters out the yellow light present in glass blowing. Alloyed with magnesium creates a high-strength metal used in aircraft engines. Makes up 5% of Mich metal.","Obtained from same salts as neodymium.",null,5,9,5,6,140.90766,0],
[60,"Nd","Neodymium",0,6,3,9,"144.242(3)",144.242,0,1289.15,3347.15,7.01,1.14,1.916,284.0,174.0,239.0,null,27.45,41.5,2.8e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f4 5s2 5p6 6s2",[3],[0,2,4],"HEX",1925,"C.F. Aver von Welsbach","Greek: neos and didymos (new twin).","#ff1493",208.0,null,7.1,289.0,57.5,"Soft bright silvery metallic element, belongs to the lanthanoids. Seven natural isotopes, Nd-144 being the only radioactive one with a half-life of 10^10 to 10^15 years. Six artificial radioisotopes have been produced. The metal is used in glass works to color class a shade of violet-purple and make it dichroic. One of the more reactive rare-earth metals, quickly reacts with air. Used in some rare-earth alloys. Neodymium is used to color the glass used in welder's glasses. Neodymium is also used in very powerful, permanent magnets (Nd2Fe14B). Discovered by Carl F. Auer von Welsbach in Austria in 1885 by separating didymium into its elemental components Praseodymium and neodymium. The name comes from the Greek words 'neos didymos' which means 'new twin'. Neodymium should be considered highly toxic, however evidence would seem to show that it acts as little more than a skin and eye irritant. The dust however, presents a fire and explosion hazard.","Used in making artificial ruby for lasers. Also in ceramics and for a special lens with praseodymium. Also to produce bright purple glass and special glass that filters infrared radiation. Makes up 18% of Mich metal, which is used in making steel.","Made from electrolysis of its halide salts, which are made from monazite sand.",null,6,9,6,6,144.242,0],
[61,"Pm","Promethium",0,6,3,9,"[145]",144.91276,1,1315.15,3273.0,7.26,null,null,283.0,173.0,238.0,17.9,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f5 5s2 5p6 6s2",[3],[2],null,1945,"J.A. Marinsky, L.E. Glendenin, C.D. Coryell","Named for the Greek god, Prometheus.","#ff1493",200.0,null,null,null,460000.0,"Soft silvery metallic element, belongs to the lanthanoids. Pm-147, the only natural isotope, is radioactive and has a half-life of 252 years. Eighteen radioisotopes have been produced, but all have very short half-lives. Found only in nuclear decay waste. Pm-147 is of interest as a beta-decay source, however Pm-146 and Pm-148 have to be removed from it first, as they generate gamma radiation. Discovered by J.A. Marinsky, L.E. Glendenin and C.D. Coryell in 1947.","It has been used as a source of radioactivity for thickness-measuring gages.","Does not occur naturally. Found among fission products of uranium, thorium, and plutonium.",null,7,9,7,6,null,0],
[62,"Sm","Samarium",0,6,3,9,"150.36(2)",150.36,0,1345.15,2067.15,7.52,1.17,null,280.0,172.0,236.0,null,29.54,7.05,4.5e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f6 5s2 5p6 6s2",[3],[0,1,2],"RHL",1879,"Paul Émile Lecoq de Boisbaudran","Named after the mineral samarskite.","#ff1493",192.0,null,8.9,165.0,13.9,"Soft silvery metallic element, belongs to the lanthanoids. Seven natural isotopes, Sm-147 is the only radioisotope, and has a half-life of 2.5*10^11 years. Used for making special alloys needed in the production of nuclear reactors. Also used as a neutron absorber. Small quantities of samarium oxide is used in special optical glasses. The largest use of the element is its ferromagnetic alloy which produces permanent magnets that are five times stronger than magnets produced by any other material. Discovered by Francois Lecoq de Boisbaudran in 1879.","It is used in the electronics and ceramics industries. It is easily magnetized and very difficult to demagnetize. This suggests important future applications in solid-state and superconductor technologies.","Found with other rare earths in monazite sand. The sand is often 50% rare earths by weight and 2.8% samarium.",null,8,9,8,6,150.36,0],
[63,"Eu","Europium",0,6,3,9,"151.964(1)",151.964,0,1095.15,1802.15,5.24,null,0.864,280.0,168.0,235.0,13.9,27.66,2.0,1.3e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f7 5s2 5p6 6s2",[2,3],[0],"BCC",1901,"Eugène Demarçay","Named for the continent of Europe.","#ff1493",184.0,null,null,176.0,31.4,"Soft silvery metallic element belonging to the lanthanoids. Eu-151 and Eu-153 are the only two stable isotopes, both of which are Neutron absorbers. Discovered in 1889 by Sir William Crookes.","Used with yttrium oxide to make red phosphors for color televisions.","Obtained from monazite sand, which is a mixture of phosphates of calcium, thorium, cerium, and most other rare earths.",null,9,9,9,6,151.964,0],
[64,"Gd","Gadolinium",0,6,3,9,"157.25(3)",157.25,0,1586.15,3546.15,7.9,1.2,null,277.0,169.0,234.0,null,37.03,6.2,7e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f7 5s2 5p6 5d1 6s2",[3],[0,1,2],"HEX",1880,"Jean de Marignac","Named after the mineral gadolinite.","#ff1493",158.0,null,null,398.0,28.6,"Soft silvery metallic element belonging to the lanthanoids. Seven natural, stable isotopes are known in addition to eleven artificial isotopes. Gd-155 and Gd-157 and the best neutron absorbers of all elements. Gadolinium compounds are used in electronics. Discovered by J.C.G Marignac in 1880.","Used in steel alloying agents and the manufacture of electronic components.","Found with other rare earths in gadolinite and monazite sand.",null,10,9,10,6,157.25,0],
[65,"Tb","Terbium",0,6,3,9,"158.92535(2)",158.92535,0,1632.15,3503.15,8.23,null,1.165,276.0,168.0,233.0,11.1,28.91,1.2,1.4e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f9 5s2 5p6 6s2",[3],[0,1,2,4],"HEX",1843,"Carl Mosander","Named after Ytterby, a village in Sweden.","#ff1493",170.0,null,null,389.0,658.0,"Silvery metallic element belonging to the lanthanoids. Tb-159 is the only stable isotope, there are seventeen artificial isotopes. Discovered by G.G. Mosander in 1843.","It is used in modest amounts in special lasers and solid-state devices.","Found with other rare earths in monazite sand, which typically contain 0.03% terbium. Other sources are xenotime and euxenite, both of which are oxide mixtures that can contain up to 1% terbium.",null,11,9,11,6,158.92535,0],
[66,"Dy","Dysprosium",0,6,3,9,"162.500(1)",162.5,0,1685.15,2840.15,8.55,1.22,0.352,275.0,167.0,231.0,10.7,28.16,5.2,9.1e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f10 5s2 5p6 6s2",[3],[0,1,2,4],"HEX",1886,"Paul Émile Lecoq de Boisbaudran","Greek: dysprositos (hard to get at).","#ff1493",163.0,null,null,291.0,307.0,"Metallic with a bright silvery-white lustre. Dysprosium belongs to the lanthanoids. It is relatively stable in air at room temperatures, it will however dissolve in mineral acids, evolving hydrogen. It is found in from rare-earth minerals. There are seven natural isotopes of dysprosium, and eight radioisotopes, Dy-154 being the most stable with a half-life of 3*10^6 years. Dysprosium is used as a neutron absorber in nuclear fission reactions, and in compact disks. It was discovered by Paul Emile Lecoq de Boisbaudran in 1886 in France. Its name comes from the Greek word dysprositos, which means hard to obtain.","Its uses are limited to the experimental and esoteric.","Usually found with erbium, holmium and other rare earths in some minerals such as monazite sand, which is often 50% rare earth by weight.",null,12,9,12,6,162.5,0],
[67,"Ho","Holmium",0,6,3,9,"164.93033(2)",164.93033,0,1745.15,2973.15,8.8,1.23,null,273.0,166.0,230.0,null,27.15,1.3,2.2e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f11 5s2 5p6 6s2",[3],[0,1,2],"HEX",1878,"J.L. Soret","From Holmia, the Latinized name for Stockholm, Sweden.","#ff1493",165.0,null,null,301.0,57.1,"Relatively soft and malleable silvery-white metallic element, which is stable in dry air at room temperature. It oxidizes in moist air and at high temperatures. It belongs to the lanthanoids. A rare-earth metal, it is found in the minerals monazite and gadolinite. It possesses unusual magnetic properties. One natural isotope, Ho-165 exists, six radioisotopes exist, the most stable being Ho-163 with a half-life of 4570 years. Holmium is used in some metal alloys, it is also said to stimulate the metabolism. Discovered by Per Theodor Cleve and J.L. Soret in Switzerland in 1879. The name homium comes from the Greek word Holmia which means Sweden. While all holmium compounds should be considered highly toxic, initial evidence seems to indicate that they do not pose much danger. The metal's dust however, is a fire hazard.","It has very few practical applications; however, it has some unusual magnetic properties that offer some hope for future applications.","Occurs in gadolinite. Most often from monazite which is often 50% rare earth and typically 0.05% holmium.",null,13,9,13,6,164.93033,0],
[68,"Er","Erbium",0,6,3,9,"167.259(3)",167.259,0,1802.15,3141.15,9.07,1.24,null,272.0,165.0,229.0,null,28.12,3.5,8.7e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f12 5s2 5p6 6s2",[3],[0,1,2],"HEX",1843,"Carl Mosander","Named after the Swedish town, Ytterby.","#ff1493",150.0,null,null,317.0,26.4,"Soft silvery metallic element which belongs to the lanthanoids. Six natural isotopes that are stable. Twelve artificial isotopes are known. Used in nuclear technology as a neutron absorber. It is being investigated for other possible uses. Discovered by Carl G. Mosander in 1843.","Erbium oxide is used in ceramics to obtain a pink glaze. Also a few uses in the nuclear industry and as an alloying agent for other exotic metals. For example, it increases the malleability of vanadium.","Found with other heavier rare earths in xenotime and euxerite.",null,14,9,14,6,167.259,0],
[69,"Tm","Thulium",0,6,3,9,"168.93422(2)",168.93422,0,1818.15,2223.15,9.321,1.25,1.029,271.0,164.0,227.0,null,27.03,0.52,1.7e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f13 5s2 5p6 6s2",[3],[0,1,2],"HEX",1879,"Per Theodor Cleve","From Thule ancient name of Scandinavia.","#ff1493",144.0,null,null,232.0,3000.0,"Soft grey metallic element that belongs to the lanthanoids. One natural isotope exists, Tm-169, and seventeen artificial isotopes have been produced. No known uses for the element. Discovered in 1879 by Per Theodor Cleve.","Radioactive thulium is used to power portable x-ray machines, eliminating the need for electrical equipment.","Found with other rare earths in the minerals gadolinite, euxenite, xenotime, and monazite. Monazite is often 50% rare earth by weight and 0.007% thulium.",null,15,9,15,6,168.93422,0],
[70,"Yb","Ytterbium",0,6,3,9,"173.054(5)",173.045,0,1097.15,1469.15,6.9,null,-0.02,277.0,170.0,226.0,null,26.74,3.2,8.2e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 6s2",[3],[0,1,2],"FCC",1878,"Jean de Marignac","Named for the Swedish village of Ytterby.","#ff1493",139.0,null,3.35,159.0,17.1,"Silvery metallic element of the lanthanoids. Seven natural isotopes and ten artificial isotopes are known. Used in certain steels. Discovered by J.D.G. Marignac in 1878.","Used in metallurgical and chemical experiments.","Found in minerals such as yttria, monazite, gadolinite, and xenotime. Monazite is often 50% rare earth by weight and typically 0.03% ytterbium.",null,16,9,16,6,173.054,0],
[71,"Lu","Lutetium",0,6,3,8,"174.9668(1)",174.9668,0,1936.15,3675.15,9.84,1.0,0.34,270.0,162.0,224.0,null,26.86,0.8,1.5e-07,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d1 6s2",[3],[0,1,2],"HEX",1907,"Georges Urbain","Named for the ancient name of Paris, Lutecia.","#ff1493",137.0,6.455,null,414.0,643.0,"Silvery-white rare-earth metal which is relatively stable in air. It happens to be the most expensive rare-earth metal. Its found with almost all rare-earth metals, but is very difficult to separate from other elements. Least abundant of all natural elements. Used in metal alloys, and as a catalyst in various processes. There are two natural, stable isotopes, and seven radioisotopes, the most stable being Lu-174 with a half-life of 3.3 years. The separation of lutetium from Ytterbium was described by Georges Urbain in 1907. It was discovered at approximately the same time by Carl Auer von Welsbach. The name comes from the Greek word lutetia which means Paris.","It has no practical applications.","Found with ytterbium in gadolinite and xenotime. Usually obtained from monazite sand which is ofter 50% rare earth by weight and 0.003% lutetium.",null,17,9,17,6,174.9668,0],
[72,"Hf","Hafnium",4,6,2,8,"178.49(2)",178.49,0,2506.15,4873.15,13.3,1.3,0.014,264.0,152.0,223.0,23.0,25.73,3.0,7e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d2 6s2",[4],[-2,0,1,2,3],"HEX",1923,"Dirk Coster, Georg von Hevesy","From Hafnia, the Latin name of Copenhagen.","#ff1493",103.0,6.83,25.1,575.0,900.0,"Silvery lustrous metallic transition element. Used in tungsten alloys in filaments and electrodes, also acts as a neutron absorber. First reported by Urbain in 1911, existence was finally established in 1923 by D. Coster, G.C. de Hevesy in 1923.","Used in reactor control rods because of its ability to absorb neutrons.","Obtained from mineral zircon or baddeleyite.",null,4,6,18,6,178.49,0],
[73,"Ta","Tantalum",5,6,2,8,"180.94788(2)",180.94788,0,3290.15,5728.15,16.4,1.5,0.322,258.0,146.0,222.0,57.5,25.36,2.0,2e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d3 6s2",[5],[-3,-1,0,1,2,3,4],"BCC",1802,"Anders Ekeberg","From king Tantalus of Greek mythology, father of Niobe.","#ff1493",74.0,7.93,24.7,758.0,298.0,"Heavy blue-grey metallic transition element. Ta-181 is a stable isotope, and Ta-180 is a radioactive isotope, with a half-life in excess of 10^7 years. Used in surgery as it is unreactive. Forms a passive oxide layer in air. Identified in 1802 by Ekeberg and isolated in 1820 by Jons J. Berzelius.","Often used as an economical substitute for platinum. Tantalum pentoxide is used in capacitors and in camera lenses to increase refracting power. It and its alloys are corrosion and wear resistant so it is used to make surgical and dental tools.","Chiefly occurs in the mineral tantalite. Always found with niobium.",null,5,6,19,6,180.94788,0],
[74,"W","Tungsten",6,6,2,8,"183.84(1)",183.84,0,3687.15,5828.15,19.3,1.7,0.81626,253.0,137.0,218.0,173.0,24.27,1.25,0.0001,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d4 6s2",[4,6],[-4,-2,-1,0,1,2,3,5],"BCC",1783,"Fausto and Juan José de Elhuyar","Swedish: tung sten (heavy stone): symbol from its German name wolfram.","#ff1493",68.0,8.67,35.0,824.0,35.3,"White or grey metallic transition element,formerly called Wolfram. Forms a protective oxide in air and can be oxidized at high temperature. First isolated by Jose and Fausto de Elhuyer in 1783.","Made into filaments for vacuum tubes and electric lights. Also as contact points in cars. Combined with calcium or magnesium it makes phosphors. Tungsten carbide is extremely hard and is used for making cutting tools and abrasives.","Occurs in the minerals scheelite (CaWO4) and wolframite [(Fe,Mn)WO4].",null,6,6,20,6,183.84,0],
[75,"Re","Rhenium",7,6,2,8,"186.207(1)",186.207,0,3458.15,5863.15,20.8,1.9,0.15,249.0,131.0,216.0,48.0,25.48,0.0007,4e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d5 6s2",[4],[-3,-1,0,1,2,3,5,6,7],"HEX",1925,"Walter Noddack, Ida Tacke, Otto Berg","Latin: Rhenus, the Rhine River.","#ff1493",62.0,9.46,34.0,704.0,3010.0,"Silvery-white metallic transition element. Obtained as a by-product of molybdenum refinement. Rhenium-molybdenum alloys are superconducting.","Mixed with tungsten or platinum to make filaments for mass spectrographs. Its main value is as a trace alloying agent for hardening metal components that are subjected to continuous frictional forces.","Found in small amounts in gadolinite and molybdenite. Has a very high melting point.",null,7,6,21,6,186.207,0],
[76,"Os","Osmium",8,6,2,8,"190.23(3)",190.23,0,3306.15,5281.15,22.5872,2.2,1.1,244.0,129.0,216.0,null,24.7,0.0015,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d6 6s2",[4],[-4,-2,-1,0,1,2,3,5,6,7,8],"HEX",1804,"Smithson Tenant","Greek: osmê (odor).","#ff1493",57.0,9.78,31.7,738.0,12000.0,"Hard blue-white metallic transition element. Found with platinum and used in some alloys with platinum and iridium.","Used to tip gold pen points, instrument pivots, to make electric light filaments. Used for high temp. alloys and pressure bearings. Very hard and resists corrosion better than any other.","Obtained from the same ores as platinum.",null,8,6,22,6,190.23,0],
[77,"Ir","Iridium",9,6,2,8,"192.217(3)",192.217,0,2719.15,4701.15,22.5622,2.2,1.5638,240.0,122.0,213.0,147.0,25.1,0.001,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d7 6s2",[3,4],[-3,-2,-1,1,2,5,6,7,8,9],"FCC",1804,"S.Tenant, A.F.Fourcory, L.N.Vauquelin, H.V.Collet-Descoltils","Latin: iris (rainbow).","#ff1493",54.0,9.96,27.61,604.0,55500.0,"Very hard and brittle, silvery metallic transition element. It has a yellowish cast to it. Salts of iridium are highly colored. It is the most corrosion resistant metal known, not attacked by any acid, but is attacked by molten salts. There are two natural isotopes of iridium, and 4 radioisotopes, the most stable being Ir-192 with a half-life of 73.83 days. Ir-192 decays into Platinum, while the other radioisotopes decay into Osmium. Iridium is used in high temperature apparatus, electrical contacts, and as a hardening agent for platinumpy. Discovered in 1803 by Smithson Tennant in England. The name comes from the Greek word iris, which means rainbow. Iridium metal is generally non-toxic due to its relative unreactivity, but iridium compounds should be considered highly toxic.","Used with osmium to tip gold pen points, to make crucible and special containers. Also to make alloys used for standard weights and measures, and heat-resistant alloys. Also as hardening agent for platinum.","Found in gravel deposits with platinum.",null,9,6,23,6,192.217,0],
[78,"Pt","Platinum",10,6,2,8,"195.084(9)",195.084,0,2041.35,4098.15,21.5,2.2,2.128,230.0,123.0,213.0,71.6,25.86,0.005,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d9 6s1",[2,4],[-3,-2,-1,0,1,3,5,6],"FCC",1735,"Julius Scaliger","Spanish: platina (little silver).","#ff1493",48.0,10.16,21.76,470.0,27800.0,"Attractive greyish-white metal. When pure, it is malleable and ductile. Does not oxidize in air, insoluble in hydrochloric and nitric acid. Corroded by halogens, cyandies, sulphur and alkalis. Hydrogen and Oxygen react explosively in the presence of platinumpy. There are six stable isotopes and three radioisotopes, the most stable being Pt-193 with a half-life of 60 years. Platinum is used in jewelry, laboratory equipment, electrical contacts, dentistry, and anti-pollution devices in cars. PtCl2(NH3)2 is used to treat some forms of cancer. Platinum-Cobalt alloys have magnetic properties. It is also used in the definition of the Standard Hydrogen Electrode. Discovered by Antonio de Ulloa in South America in 1735. The name comes from the Spanish word platina which means silver. Platinum metal is generally not a health concern due to its unreactivity, however platinum compounds should be considered highly toxic.","Used in jewelry, to make crucible and special containers and as a catalyst. Used with cobalt to produce very strong magnets. Also to make standard weights and measures. Resists corrosion and acid attacks except aqua regia.","Produced from deposits of native, or elemental, platinum.",null,10,6,24,6,195.084,0],
[79,"Au","Gold",11,6,2,8,"196.966569(5)",196.966569,0,1337.33,3109.15,19.3,2.4,2.30863,226.0,124.0,214.0,318.0,25.418,0.004,4e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s1",[3],[-3,-2,-1,0,1,2,5],"FCC",null,"Known to the ancients.","Anglo-Saxon: geolo (yellow); symbol from Latin: aurum (shining dawn).","#daa520",36.0,11.33,12.68,340.0,75430.0,"Gold is gold colored. It is the most malleable and ductile metal known. There is only one stable isotope of gold, and five radioisotopes of gold, Au-195 being the most stable with a half-life of 186 days. Gold is used as a monetary standard, in jewelry, dentistry, electronics. Au-198 is used in treating cancer and some other medical conditions. Gold has been known to exist as far back as 2600 BC. Gold comes from the Anglo-Saxon word gold. Its symbol, Au, comes from the Latin word aurum, which means gold. Gold is not particularly toxic, however it is known to cause damage to the liver and kidneys in some.","Very malleable. Used in electronics, jewelry and coins. It is a good reflector of infrared radiation, so a thin film of gold is applied to the glass of skyscrapers to reduce internal heating from sunlight.","Found in veins in the crust, with cooper ore and native .",null,11,6,25,6,196.966569,0],
[80,"Hg","Mercury",12,6,2,8,"200.592(3)",200.592,0,234.321,629.769,13.5336,1.9,null,229.0,133.0,223.0,8.3,27.983,0.085,3e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2",[1,2],[-2],"RHL",null,"Known to the ancients.","From the Roman god Mercury; symbol from Latin: hydrargyrus (liquid silver).","#ff1493",33.91,10.44,2.295,58.5,30.2,"Heavy silvery liquid metallic element, belongs to the zinc group. Used in thermometers, barometers and other scientific apparatus. Less reactive than zinc and cadmium, does not displace hydrogen from acids. Forms a number of complexes and organomercury compounds.","Used in thermometers, barometers, and batteries. Also used in electrical switches and mercury-vapor lighting products.","Virtually all mercury comes from cinnabar or mercury sulfide (HgS). Some sources of red cinnabar are so rich in mercury that droplets of elemental mercury can be found in random samples.",1764.15,12,6,26,6,200.592,0],
[81,"Tl","Thallium",13,6,1,7,"[204.382,204.385]",204.38,0,577.15,1746.15,11.8,1.8,0.377,242.0,144.0,196.0,46.1,26.32,0.85,1.9e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p1",[1,3],[-5,-2,-1,2],"HEX",1861,"Sir William Crookes","Greek: thallos (green twig), for a bright green line in its spectrum.","#ff1493",50.0,null,4.31,162.4,4200.0,"Pure, unreacted thallium appears silvery-white and exhibits a metallic lustre. Upon reacting with air, it begins to turn bluish-grey and looks like lead. It is very malleable, and can be cut with a knife. There are two stable isotopes, and four radioisotopes, Tl-204 being the most stable with a half-life of 3.78 years. Thallium sulphate was used as a rodenticide. Thallium sulphine's conductivity changes with exposure to infrared light, this gives it a use in infrared detectors. Discovered by Sir William Crookes via spectroscopy. Its name comes from the Greek word thallos, which means green twig. Thallium and its compounds are toxic and can cause cancer.","Its compounds are used in rat and ant poisons. Also for detecting infrared radiation.","Found in iron pyrites. Also in crookesite, hutchinsonite and lorandite. Most is recovered from the byproducts of lead and zinc refining.",null,13,6,27,6,null,0],
[82,"Pb","Lead",14,6,1,7,"207.2(1)",207.2,0,600.612,2022.15,11.3,1.8,0.356743,249.0,144.0,202.0,35.3,26.84,14.0,3e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p2",[2,4],[-4,-2,-1,0,1,3],"FCC",null,"Known to the ancients.","Anglo-Saxon: lead; symbol from Latin: plumbum.","#ff1493",47.0,10.97,4.77,177.8,2.0,"Heavy dull grey ductile metallic element, belongs to group 14. Used in building construction, lead-place accumulators, bullets and shot, and is part of solder, pewter, bearing metals, type metals and fusible alloys.","Used in solder, shielding against radiation and in batteries.","Found most often in ores called galena or lead sulfide (PbS). Some is found in its native state.",null,14,6,28,6,207.2,0],
[83,"Bi","Bismuth",15,6,1,7,"208.98040(1)",208.9804,0,544.552,1837.15,9.79,1.9,0.942362,250.0,151.0,207.0,7.9,25.52,0.0085,2e-05,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p3",[3],[-3,-2,-1,0,1,2,4,5],"RHL",null,"Known to the ancients.","German: bisemutum, (white mass), Now spelled wismut.","#ff1493",48.0,11.9,11.0,172.0,6.36,"White crystalline metal with a pink tinge, belongs to group 15. Most diamagnetic of all metals and has the lowest thermal conductivity of all the elements except mercury. Lead-free bismuth compounds are used in cosmetics and medical procedures. Burns in the air and produces a blue flame. In 1753, C.G. Junine first demonstrated that it was different from lead.","Main use is in pharmaceuticals and low melting point alloys used as fuses.","It can be found free in nature and in minerals like bismuthine (Bi2O3) and in bismuth ochre (Bi2O3)",4620.15,15,6,29,6,208.9804,0],
[84,"Po","Polonium",16,6,1,5,"[209]",209.0,1,527.15,1235.15,9.2,2.0,1.9,250.0,145.0,197.0,null,null,2e-10,1.5e-14,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p4",[-2,2,4],[5,6],"SC",1898,"Pierre and Marie Curie","Named for Poland, native country of Marie Curie.","#ff1493",44.0,13.0,10.0,102.9,49200000000000.0,"Rare radioactive metallic element, belongs to group 16 of the periodic table. Over 30 known isotopes exist, the most of all elements. Po-209 has a half-life of 103 years. Possible uses in heating spacecraft. Discovered by Marie Curie in 1898 in a sample of pitchblende.","Used in industrial equipment that eliminates static electricity caused by such processes as rolling paper, wire, and sheet metal.","Occurs in pitchblende from decay of bismuth.",null,16,6,30,6,null,0],
[85,"At","Astatine",17,6,1,6,"[210]",210.0,1,575.15,610.0,7.0,2.2,2.8,247.0,147.0,202.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p5",[-1,1],[3,5,7],null,1940,"D.R.Corson, K.R.MacKenzie, E.Segré","Greek: astatos (unstable).","#ff1493",42.0,14.1,null,null,null,"Radioactive halogen element. Occurs naturally from uranium and thorium decay. At least 20 known isotopes. At-210, the most stable, has a half-life of 8.3 hours. Synthesized by nuclear bombardment in 1940 by D.R. Corson, K.R. MacKenzie and E. Segre at the University of California.","Since its isotopes have such short half-lives there are no commercially significant compounds of astatine.","Does not occur in nature. Similar to iodine. Produced by bombarding bismuth with alpha particles.",null,17,6,31,6,null,0],
[86,"Rn","Radon",18,6,1,2,"[222]",222.0,1,202.15,211.45,0.009074,null,null,243.0,142.0,220.0,0.0036,20.786,4e-13,6e-16,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6",[],[2,6],"FCC",1898,"Fredrich Ernst Dorn","Variation of the name of another element, radium.","#ffffff",35.0,15.4,null,18.1,null,"Colorless radioactive gaseous element, belongs to the noble gases. Of the twenty known isotopes, the most stable is Rn-222 with a half-life of 3.8 days. Formed by the radioactive decay of Radium-226. Radon itself decays into Polonium. Used in radiotherapy. As a noble gas, it is effectively inert, though radon fluoride has been synthesized. First isolated in 1908 by Ramsey and Gray.","Used to treat some forms of cancer.","Formed from the decay of radium in the earths crust.",377.15,18,6,32,6,null,0],
[87,"Fr","Francium",1,7,0,3,"[223]",223.0,1,294.15,950.0,1.87,0.7,0.486,258.0,223.0,348.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 7s1",[1],[],"BCC",1939,"Marguerite Derey","Named for France, the nation of its discovery.","#ffffff",317.8,null,15.0,null,null,"Radioactive element, belongs to group 1 of the periodic table. Found in uranium and thorium ores. The 22 known isotopes are all radioactive, with the most stable being Fr-223. Its existence was confirmed in 1939 by Marguerite Perey.","Since its isotopes have such short half-lives there are no commercially significant compounds of francium.","Formed by decay of actinium. Chemical properties similar to cesium. Decays to radium or astatine.",null,1,7,1,7,null,0],
[88,"Ra","Radium",2,7,0,4,"[226]",226.0,1,969.15,2010.0,5.0,0.9,0.1,292.0,201.0,283.0,null,null,9e-07,8.9e-11,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 7s2",[2],[],null,1898,"Pierre and Marie Curie","Latin: radius (ray).","#ffffff",246.0,null,9.6,113.0,null,"Radioactive metallic transuranic element, belongs to group 2 of the periodic table. Most stable isotope, Ra-226 has a half-life of 1602 years, which decays into radon. Isolated from pitchblende in 1898 Marie and Pierre Curie.","Used in treating cancer because of the gamma rays it gives off.","Found in uranium ores at 1 part per 3 million parts uranium.",null,2,7,2,7,null,0],
[89,"Ac","Actinium",3,7,2,10,"[227]",227.0,1,1323.15,3473.15,10.0,1.1,0.35,293.0,186.0,247.0,null,27.2,5.5e-10,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 6d1 7s2",[3],[],"FCC",1899,"André Debierne","Greek: akis, aktinos (ray).","#ffffff",203.0,null,10.5,292.9,29000000000000.0,"Silvery radioactive metallic element, belongs to group 3 of the periodic table. The most stable isotope, Ac-227, has a half-life of 217 years. Ac-228 (half-life of 6.13 hours) also occurs in nature. There are 22 other artificial isotopes, all radioactive and having very short half-lives. Chemistry similar to lanthanumpy. Used as a source of alpha particles. Discovered by A. Debierne in 1899.","It has no significant commercial applications.","Extremely rare, found in all uranium ores. Usually obtained by treating radium with neutrons in a reactor.",null,3,10,3,7,null,0],
[90,"Th","Thorium",0,7,3,10,"232.0377(4)",232.0377,1,2023.15,5058.15,11.7,1.3,null,288.0,175.0,245.0,null,27.32,9.6,1e-06,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 6d2 7s2",[4],[-1,1,2,3],"FCC",1828,"Jöns Berzelius","Named for Thor, Norse god of thunder.","#ff1493",217.0,null,16.11,513.7,287.0,"Grey radioactive metallic element. Belongs to actinoids. Found in monazite sand in Brazil, India and the US. Thorium-232 has a half-life of 1.39x10^10 years. Can be used as a nuclear fuel for breeder reactors. Thorium-232 captures slow Neutrons and breeds uranium-233. Discovered by Jons J. Berzelius in 1829.","Used in making strong alloys. Also in ultraviolet photoelectric cells. It is a common ingredient in high-quality lenses. Bombarded with neutrons make uranium-233, a nuclear fuel.","Found in various minerals like monazite and thorite.",null,4,10,4,7,232.0377,0],
[91,"Pa","Protactinium",0,7,3,10,"231.03588(2)",231.03588,1,1845.15,4300.0,15.4,1.5,null,285.0,169.0,243.0,null,null,1.4e-06,5e-11,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f2 6s2 6p6 6d1 7s2",[5],[2,3,4],"TET",1917,"Fredrich Soddy, John Cranston, Otto Hahn, Lise Meitner","Greek: proto and actinium (parent of actinium); it forms actinium when it radioactively decays.","#ffffff",154.0,null,16.7,481.2,null,"Radioactive metallic element, belongs to the actinoids. The most stable isotope, Pa-231 has a half-life of 2.43*10^4 years. At least 10 other radioactive isotopes are known. No practical applications are known. Discovered in 1917 by Lise Meitner and Otto Hahn.","It has no significant commercial applications.","Does not occur in nature. Found among fission products of uranium, thorium, and plutonium.",null,5,10,5,7,231.03588,0],
[92,"U","Uranium",0,7,3,10,"238.02891(3)",238.02891,1,1408.15,4404.15,19.1,1.7,null,283.0,170.0,241.0,27.5,27.665,2.7,0.0032,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f3 6s2 6p6 6d1 7s2",[6],[-1,1,2,3,4,5],"ORC",1789,"Martin Klaproth","Named for the planet Uranus.","#ff1493",129.0,null,12.6,417.0,101.0,"White radioactive metallic element belonging to the actinoids. Three natural isotopes, U-238, U-235 and U-234. Uranium-235 is used as the fuel for nuclear reactors and weapons. Discovered by Martin H. Klaproth in 1789.","For many centuries it was used as a pigment for glass. Now it is used as a fuel in nuclear reactors and in bombs.","Occurs in many rocks, but in large amounts only in such minerals as pitchblende and carnotite.",null,6,10,6,7,238.02891,0],
[93,"Np","Neptunium",0,7,3,10,"[237]",237.0,1,917.15,4447.0,20.2,1.3,null,281.0,171.0,239.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f4 6s2 6p6 6d1 7s2",[5],[2,3,4,6,7],"ORC",1940,"E.M. McMillan, P.H. Abelson","Named for the planet Neptune.","#ffffff",151.0,null,9.6,336.0,660000.0,"Radioactive metallic transuranic element, belongs to the actinoids. Np-237, the most stable isotope, has a half-life of 2.2*10^6 years and is a by product of nuclear reactors. The other known isotopes have mass numbers 229 through 236, and 238 through 241. Np-236 has a half-life of 5*10^3 years. First produced by Edwin M. McMillan and P.H. Abelson in 1940.","It has no significant commercial applications.","Produced by bombarding uranium with slow neutrons.",null,7,10,7,7,null,0],
[94,"Pu","Plutonium",0,7,3,10,"[244]",244.0,1,913.15,3501.15,19.7,1.3,null,278.0,172.0,243.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f6 6s2 6p6 7s2",[4],[2,3,5,6,7,8],"MCL",1940,"G.T.Seaborg, J.W.Kennedy, E.M.McMillan, A.C.Wohl","Named for the planet Pluto.","#ffffff",132.0,null,2.8,343.5,6490000.0,"Dense silvery radioactive metallic transuranic element, belongs to the actinoids. Pu-244 is the most stable isotope with a half-life of 7.6*10^7 years. Thirteen isotopes are known. Pu-239 is the most important, it undergoes nuclear fission with slow neutrons and is hence important to nuclear weapons and reactors. Plutonium production is monitored down to the gram to prevent military misuse. First produced by Gleen T. Seaborg, Edwin M. McMillan, J.W. Kennedy and A.C. Wahl in 1940.","Used in bombs and reactors. Small quantities are used in thermo-electric generators.","Found rarely in some uranium ores. Made by bombarding uranium with neutrons.",null,8,10,8,7,null,0],
[95,"Am","Americium",0,7,3,10,"",243.0,1,1449.15,2880.0,12.0,null,null,276.0,166.0,244.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f7 6s2 6p6 7s2",[3],[2,4,5,6,7],null,1945,"G.T.Seaborg, R.A.James, L.O.Morgan, A.Ghiorso","Named for the American continent, by analogy with europium.","#ffffff",131.0,null,10.0,238.5,728000.0,"Radioactive metallic transuranic element, belongs to the actinoids. Ten known isotopes. Am-243 is the most stable isotope, with a half-life of 7.95*10^3 years. Discovered by Glenn T. Seaborg and associates in 1945, it was obtained by bombarding Uranium-238 with alpha particles.","Americium-241 is currently used in smoke detectors.","Produced by bombarding plutonium with neutrons.",null,9,10,9,7,null,0],
[96,"Cm","Curium",0,7,3,10,"",247.0,1,1618.15,3383.0,13.51,null,null,276.0,166.0,245.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f7 6s2 6p6 6d1 7s2",[3],[4,5,6],null,1944,"G.T.Seaborg, R.A.James, A.Ghiorso","Named in honor of Pierre and Marie Curie.","#ffffff",144.0,null,null,null,185000000.0,"Radioactive metallic transuranic element. Belongs to actinoid series. Nine known isotopes, Cm-247 has a half-life of 1.64*10^7 years. First identified by Glenn T. Seaborg and associates in 1944, first produced by L.B. Werner and I. Perlman in 1947 by bombarding americium-241 with Neutrons. Named for Marie Curie.","It has no significant commercial applications.","Made by bombarding plutonium with helium ions. So radioactive it glows in the dark.",null,10,10,10,7,null,0],
[97,"Bk","Berkelium",0,7,3,10,"",247.0,1,1259.15,2900.0,14.78,null,null,null,168.0,244.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f9 6s2 6p6 7s2",[3],[2,4,5],null,1949,"G.T.Seaborg, S.G.Tompson, A.Ghiorso","Named after Berkeley, California the city of its discovery.","#ffffff",125.0,null,null,null,185000000000.0,"Radioactive metallic transuranic element. Belongs to actinoid series. Eight known isotopes, the most common Bk-247, has a half-life of 1.4*10^3 years. First produced by Glenn T. Seaborg and associates in 1949 by bombarding americium-241 with alpha particles.","It has no significant commercial applications.","Some compounds have been made and studied. Made by bombarding americium with alpha particles.",null,11,10,11,7,null,0],
[98,"Cf","Californium",0,7,3,10,"",251.0,1,1173.15,1743.0,15.1,null,null,null,168.0,245.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f10 6s2 6p6 7s2",[3],[2,4,5],null,1950,"G.T.Seaborg, S.G.Tompson, A.Ghiorso, K.Street Jr.","Named after the state and University of California.","#ffffff",122.0,null,null,null,60000000000.0,"Radioactive metallic transuranic element. Belongs to actinoid series. Cf-251 has a half life of about 700 years. Nine isotopes are known. Cf-252 is an intense Neutron source, which makes it an intense Neutron source and gives it a use in Neutron activation analysis and a possible use as a radiation source in medicine. First produced by Glenn T. Seaborg and associates in 1950.","It has no significant commercial applications.","Made by bombarding curium with helium ions.",null,12,10,12,7,null,0],
[99,"Es","Einsteinium",0,7,3,10,"",252.0,1,1133.15,1269.0,8.84,null,null,null,165.0,245.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f11 6s2 6p6 7s2",[3],[2,4],null,1952,"Argonne, Los Alamos, U of Calif","Named in honor of the scientist Albert Einstein.","#ffffff",118.0,null,null,null,null,"Appearance is unknown, however it is most probably metallic and silver or gray in color. Radioactive metallic transuranic element belonging to the actinoids. Es-254 has the longest half-life of the eleven known isotopes at 270 days. First identified by Albert Ghiorso and associates in the debris of the 1952 hydrogen bomb explosion. In 1961 the first microgram quantities of Es-232 were separated. While einsteinium never exists naturally, if a sufficient amount was assembled, it would pose a radiation hazard.","It has no significant commercial applications.","Made by bombarding uranium with neutrons.",null,13,10,13,7,null,0],
[100,"Fm","Fermium",0,7,3,10,"",257.0,1,1800.15,null,9.7,null,null,null,167.0,245.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f12 6s2 6p6 7s2",[3],[2],null,1953,"Argonne, Los Alamos, U of Calif","Named in honor of the scientist Enrico Fermi.","#ffffff",113.0,null,null,null,null,"Radioactive metallic transuranic element, belongs to the actinoids. Ten known isotopes, most stable is Fm-257 with a half-life of 10 days. First identified by Albert Ghiorso and associates in the debris of the first hydrogen-bomb explosion in 1952.","It has no significant commercial applications.","Produced by bombarding lighter transuranium elements with still lighter particles or by neutron capture.",null,14,10,14,7,null,0],
[101,"Md","Mendelevium",0,7,3,10,"",258.0,1,1100.15,null,10.3,null,null,null,173.0,246.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f13 6s2 6p6 7s2",[3],[2],null,1955,"G.T.Seaborg, S.G.Tompson, A.Ghiorso, K.Street Jr.","Named in honor of the scientist Dmitri Ivanovitch Mendeleyev, who devised the periodic table.","#ffffff",109.0,null,null,null,null,"Radioactive metallic transuranic element. Belongs to the actinoid series. Only known isotope, Md-256 has a half-life of 1.3 hours. First identified by Glenn T. Seaborg, Albert Ghiorso and associates in 1955. Alternative name Unnilunium has been proposed. Named after the 'inventor' of the periodic table, Dmitri Mendeleev.","It has no significant commercial applications.","Made by bombarding einsteinium with helium ions.",null,15,10,15,7,null,0],
[102,"No","Nobelium",0,7,3,10,"",259.0,1,1100.15,null,9.9,null,null,null,176.0,246.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f14 6s2 6p6 7s2",[3],[2],null,1957,"Nobel Institute for Physics","Named in honor of Alfred Nobel, who invented dynamite and founded Nobel prize.","#ffffff",110.0,null,null,null,null,"Radioactive metallic transuranic element, belongs to the actinoids. Seven known isotopes exist, the most stable being No-254 with a half-life of 255 seconds. First identified with certainty by Albert Ghiorso and Glenn T. Seaborg in 1966. Unnilbium has been proposed as an alternative name.","It has no significant commercial applications.","Made by bombarding curium with carbon-13",null,16,10,16,7,null,0],
[103,"Lr","Lawrencium",0,7,3,8,"",262.0,1,1900.15,null,15.6,null,null,null,161.0,246.0,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f14 6s2 6p6 7s2 7p1",[3],[],null,1961,"A.Ghiorso, T.Sikkeland, A.E.Larsh, R.M.Latimer","Named in honor of Ernest O. Lawrence, inventor of the cyclotron.","#ffffff",320.0,null,null,null,null,"Appearance unknown, however it is most likely silvery-white or grey and metallic. Lawrencium is a synthetic rare-earth metal. There are eight known radioisotopes, the most stable being Lr-262 with a half-life of 3.6 hours. Due to the short half-life of lawrencium, and its radioactivity, there are no known uses for it. Identified by Albert Ghiorso in 1961 at Berkeley. It was produced by bombarding californium with boron ions. The name is temporary IUPAC nomenclature, the origin of the name comes from Ernest O. Lawrence, the inventor of the cyclotron. If sufficient amounts of lawrencium were produced, it would pose a radiation hazard.","It has no significant commercial applications.","Produced by bombarding californium with boron ions.",null,17,10,17,7,null,0],
[104,"Rf","Rutherfordium",4,7,2,8,"",267.0,1,null,null,23.3,null,null,null,157.0,null,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f14 6s2 6p6 6d2 7s2",[4],[3],null,1969,"A. Ghiorso, et al","Named in honor of Ernest Rutherford","#cc0059",112.0,null,null,null,null,"Radioactive transactinide element. Expected to have similar chemical properties to those displayed by hafnium. Rf-260 was discovered by the Joint Nuclear Research Institute at Dubna (U.S.S.R.) in 1964. Researchers at Berkeley discovered Unq-257 and Unq-258 in 1964.","It has no significant commercial applications.","Made by bombarding californium-249 with beams of carbon-12 and 13, which produced an isotope with half lives of 4+ and 3 sec.",null,4,7,18,7,null,0],
[105,"Db","Dubnium",5,7,2,8,"",268.0,1,null,null,29.3,null,null,null,149.0,null,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f14 6s2 6p6 6d3 7s2",[],[3,4,5],null,1970,"A. Ghiorso, et al","Named after the city of Dubna, the site of the JINR.","#d1004f",42.0,null,null,null,null,"Also known as Hahnium, Ha. Radioactive transactinide element. Half-life of 1.6s. Discovered in 1970 by Berkeley researchers. So far, seven isotopes have been discovered.","It has no significant commercial applications.","Made by bombarding californium-249 with a beam of nitrogen-15",null,5,7,19,7,null,0],
[106,"Sg","Seaborgium",6,7,2,8,"",271.0,1,null,null,35.0,null,null,null,143.0,null,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f14 6s2 6p6 6d4 7s2",[],[3,4,5,6],null,1974,"Soviet Nuclear Research/ U. of Cal at Berkeley","Named in honor of Glenn Seaborg, American physical chemist known for research on transuranium elements.","#d90045",40.0,null,null,null,null,"Half-life of 0.9 +/- 0.2 s. Discovered by the Joint Institute for Nuclear Research at Dubna (U.S.S.R.) in June of 1974. Its existence was confirmed by the Lawrence Berkeley Laboratory and Livermore National Laboratory in September of 1974.","It has no significant commercial applications.","Made by bombarding californium-249 with oxygen-18.",null,6,7,20,7,null,0],
[107,"Bh","Bohrium",7,7,2,8,"",274.0,1,null,null,37.1,null,null,null,141.0,null,null,null,null,null,"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 5f14 6s2 6p6 6d5 7s2",[],[3,4,5,7],null,1976,"Heavy Ion Research Laboratory (HIRL)","Named in honor of Niels Bohr","#e00038",38.0,null,null,null,null,"Radioactive transition metal. Half-life of approximately 1/500 s. Discovered by the Joint Institute for Nuclear Research at Dubna (U.S.S.R.) in 1976. Confirmed by West German physicists at the Heavy Ion Research Laboratory at Darmstadt.","It has no significant commercial applications.","Obtained by bombarding bismuth-204 with chromium-54.",null,7,7,21,7,null,0],

const LMAP={s:0,p:1,d:2,f:3};
function parseCfg(s){
  const out=[];
  for(const tok of String(s).trim().split(/\s+/)){
    const m=tok.match(/^(\d+)([spdf])(\d+)$/);
    if(!m) throw new Error('parseCfg: bad token "'+tok+'" in "'+s+'"');
    out.push({n:+m[1], l:LMAP[m[2]], count:+m[3]});
  }
  return out;
}
function cfgElectrons(s){ return parseCfg(s).reduce((a,x)=>a+x.count,0); }
function shellsOf(s){
  const sh=[];
  for(const x of parseCfg(s)){ sh[x.n-1]=(sh[x.n-1]||0)+x.count; }
  for(let i=0;i<sh.length;i++) if(!sh[i]) sh[i]=0;
  return sh;
}
/* Madelung: increasing (n+l), ties by increasing n. */
function madelungOrder(){
  const o=[];
  for(let n=1;n<=8;n++) for(let l=0;l<Math.min(n,4);l++) o.push({n,l});
  o.sort((a,b)=>(a.n+a.l)-(b.n+b.l) || a.n-b.n);
  return o;
}
const MADELUNG=madelungOrder();
function madelungCfg(Z){
  const out=[]; let left=Z;
  for(const {n,l} of MADELUNG){
    if(left<=0) break;
    const cap=2*(2*l+1), take=Math.min(cap,left);
    out.push({n,l,count:take}); left-=take;
  }
  return out;
}
const cfgKey=a=>a.slice().sort((x,y)=>x.n-y.n||x.l-y.l)
                 .map(x=>x.n+BLOCKN[x.l]+x.count).join(' ');
/* elements whose measured ground state differs from the Madelung prediction */
const ANOMALIES=ELS.filter(e=>cfgKey(parseCfg(e.cfg))!==cfgKey(madelungCfg(e.Z))).map(e=>e.Z);
const ANOM=new Set(ANOMALIES);
/* pretty configuration, noble-gas abbreviated */
const NOBLE=[2,10,18,36,54,86];
function cfgShort(e){
  const parts=parseCfg(e.cfg);
  let core=0, coreZ=0;
  for(const nz of NOBLE){ if(nz<e.Z) { core=nz; } }
  if(!core) return e.cfg;
  const coreParts=parseCfg(BYZ[core].cfg), ck=new Set(coreParts.map(x=>x.n+'.'+x.l+'.'+x.count));
  const rest=parts.filter(x=>!ck.has(x.n+'.'+x.l+'.'+x.count));
  if(rest.length===parts.length) return e.cfg;
  coreZ=core;
  return '['+BYZ[coreZ].sym+'] '+rest.sort((a,b)=>a.n-b.n||a.l-b.l)
              .map(x=>x.n+BLOCKN[x.l]+x.count).join(' ');
}

/* ---- phase at a temperature -------------------------------------- */
/* A state is only claimed when the transition that bounds it has been measured.
   Knowing only the melting point does NOT make an element liquid above it — it
   may already have boiled.  Hassium shipped as a room-temperature liquid on
   exactly that mistake (a stray predicted melting point, no boiling point). */
function phaseAt(e,T){
  if(e.boil!=null&&T>=e.boil) return 'gas';
  if(e.melt!=null&&T<e.melt) return 'solid';
  /* a sublimation point has no liquid below it — solid goes straight to gas,
     which is how carbon (no melting point at 1 atm) is solid at all */
  if(e.melt==null&&e.subl&&e.boil!=null&&T<e.boil) return 'solid';
  if(e.melt!=null&&e.boil!=null) return 'liquid';   /* both known, between them */
  return 'unknown';
}

/* ---- formatting --------------------------------------------------- */
function fmt(v,d){
  if(v==null||!isFinite(v)) return '—';
  const a=Math.abs(v);
  if(a!==0&&(a<1e-3||a>=1e5)) return v.toExponential(d==null?2:d);
  if(d!=null) return v.toFixed(d);
  if(a>=100) return v.toFixed(0);
  if(a>=10) return v.toFixed(1);
  if(a>=1) return v.toFixed(2);
  return v.toFixed(3);
}
function fmtT(K,unit){
  if(K==null) return '—';
  if(unit==='C') return (K-273.15).toFixed(1)+' °C';
  if(unit==='F') return ((K-273.15)*9/5+32).toFixed(1)+' °F';
  return K.toFixed(K<10?2:0)+' K';
}
/* How to print an atomic weight. Three cases, and only one of them is a number:
   an IUPAC interval ([6.938, 6.997]) prints as the interval; an element with no
   standard atomic weight has only the mass number of its longest-lived isotope,
   which IUPAC prints bracketed ([294]) and never as a float; everything else is
   a measured weight. */
function wDisp(e,d){
  if(e.wstr && e.wstr[0]==='[') return e.wstr;
  if(e.wnist==null) return '['+Math.round(e.weight)+']';
  return fmt(e.weight,d);
}
function fmtHL(s){
  if(s==null) return '—';
  if(s===Infinity) return 'stable';
  /* Gyr is the last prefix worth having; past ~1000 Gyr the year count itself
     is the readable quantity. Te-128 is 2.2x10^24 yr, not 7x10^13 Gyr. */
  if(s>=3.1557e19) return sci(s/3.1557e7)+' yr';
  const U=[[3.1557e16,'Gyr'],[3.1557e13,'Myr'],[3.1557e10,'kyr'],[3.1557e7,'yr'],
           [86400,'d'],[3600,'h'],[60,'min'],[1,'s'],[1e-3,'ms'],[1e-6,'µs'],
           [1e-9,'ns'],[1e-12,'ps'],[1e-15,'fs'],[1e-18,'as'],[1e-21,'zs'],[1e-24,'ys']];
  for(const [f,u] of U) if(s>=f) return (s/f<10?(s/f).toFixed(2):(s/f).toFixed(s/f<100?1:0))+' '+u;
  return s.toExponential(2)+' s';
}
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sub=n=>String(n).split('').map(c=>SUB[c]||c).join('');
const SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUPD[c]||c).join('');
function sci(v,d){                          // 2.2×10²⁴
  let ex=Math.floor(Math.log10(v)), m=v/Math.pow(10,ex);
  if(m>=9.95){ m=1; ex++; }                 // 9.99 must not print as 10.0×10^n
  return m.toFixed(d==null?1:d)+'×10'+sup(ex);
}
const signed=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);

/* ---- binary compound from charge balance -------------------------- */
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
/* smallest integers (a,b) with a*qA + b*qB = 0 */
function balance(qA,qB){
  if(qA===0||qB===0||Math.sign(qA)===Math.sign(qB)) return null;
  const g=gcd(qA,qB);
  return [Math.abs(qB)/g, Math.abs(qA)/g];
}
function formula(symA,qA,symB,qB){
  const r=balance(qA,qB); if(!r) return null;
  const [a,b]=r;
  return symA+(a>1?sub(a):'')+symB+(b>1?sub(b):'');
}
function molarMass(symA,qA,symB,qB){
  const r=balance(qA,qB); if(!r) return null;
  const A=BYSYM[symA.toLowerCase()], B=BYSYM[symB.toLowerCase()];
  if(!A||!B||A.weight==null||B.weight==null) return null;
  return r[0]*A.weight+r[1]*B.weight;
}

/* ---- decay-mode vocabulary and colours ---------------------------- */
const DECAYC={'B-':'#3aa6d8','B+':'#e0913f','EC':'#e0913f','A':'#e3cf5c','SF':'#b86cdc',
  'N':'#cc5555','2N':'#cc5555','P':'#e05a5a','2P':'#e05a5a','IT':'#8b93a6','B-N':'#5f8fd0',
  'B+P':'#d0803a','2B-':'#3a86b8','2B+':'#c07a2a','B-A':'#7fbf8f','B+A':'#d0a060',
  'D':'#cc5555','3P':'#e05a5a','B-2N':'#5f8fd0','B+2P':'#d0803a','B-SF':'#a06cbc',
  'B-3N':'#5f8fd0','B-P':'#5f8fd0','ECP':'#d0803a','ECA':'#d0a060','24NE':'#9b7fd0',
  '14C':'#9b7fd0','20O':'#9b7fd0','23F':'#9b7fd0','22NE':'#9b7fd0','28MG':'#9b7fd0',
  '34SI':'#9b7fd0','25NE':'#9b7fd0','2A':'#e3cf5c','B+2P':'#d0803a','B+3P':'#d0803a'};
const DECAY_LABEL={'B-':'β⁻','B+':'β⁺ / EC','EC':'β⁺ / EC','A':'α','SF':'fission',
  'N':'neutron','P':'proton','2P':'2-proton','IT':'isomeric'};
function isoDecay(rec){                       // dominant mode string, '' if none
  const s=rec[5]||''; if(!s) return '';
  return s.split(';')[0].split(':')[0].trim().toUpperCase();
}
function isoStable(rec){ return rec[3]==null && (rec[2]!=null || !(rec[5]||'')); }
function decayColor(m){ return DECAYC[m]||'#6a7286'; }

  {k:'series',  lab:'category',            kind:'cat'},

  {k:'weight',  lab:'atomic weight',       u:'u'},
  {k:'radius',  lab:'atomic radius',       u:'pm'},

  {k:'vdw',     lab:'van der Waals radius',u:'pm'},
  {k:'en',      lab:'electronegativity',   u:'Pauling'},
  {k:'ie1',     lab:'ionization energy',   u:'eV'},
  {k:'ea',      lab:'electron affinity',   u:'eV'},
  {k:'melt',    lab:'melting point',       u:'K'},
  {k:'boil',    lab:'boiling point',       u:'K'},
  {k:'density', lab:'density',             u:'g/cm³', log:true},
  {k:'cond',    lab:'thermal conductivity',u:'W/m·K', log:true},
  {k:'heat',    lab:'molar heat capacity', u:'J/mol·K'},
  {k:'polar',   lab:'polarizability',      u:'a.u.'},
