  {k:'year',    lab:'year discovered'},
  {k:'price',   lab:'price',               u:'USD/kg',log:true},
];
const PROPBY={}; for(const p of PROPS) PROPBY[p.k]=p;

const TABS=[['props','Properties'],['electrons','Electrons'],
            ['isotopes','Isotopes'],['compounds','Compounds']];

const st={ tab:'props', prop:'series', T:293.15, tunit:'K', wide:false, strip:true,
           sel:26, hover:null, search:'', hidden:new Set(), logIE:true };

/* ================================================================== *
 *  colour mapping                                                     *
 * ================================================================== */
function propRange(k){
  const p=PROPBY[k]; let lo=Infinity, hi=-Infinity;
  for(const e of ELS){
    let v=e[k]; if(v==null||!isFinite(v)) continue;
    if(p&&p.log){ if(v<=0) continue; v=Math.log10(v); }
    if(v<lo) lo=v; if(v>hi) hi=v;
  }
  return isFinite(lo)?[lo,hi]:[0,1];
}
function propT(e,k,rng){
  const p=PROPBY[k]; let v=e[k];
  if(v==null||!isFinite(v)) return null;
  if(p&&p.log){ if(v<=0) return null; v=Math.log10(v); }
  const [lo,hi]=rng;
  return hi>lo?(v-lo)/(hi-lo):0.5;
}
function tileColor(e,rng){
  if(st.tab==='electrons') return ['#948004','#08a8b8','#b86cdc','#cc7874'][e.block];
  if(st.tab==='isotopes'){
    const st_=e.iso.filter(isoStable).length;
    if(st_===0) return '#7a2e3e';
    return ramp(clamp(1-(st_-1)/9,0,1));
  }
  if(st.tab==='compounds'){
    const ox=e.oxMain&&e.oxMain.length?e.oxMain:e.oxExt;
    if(!ox||!ox.length) return PHASEC.unknown;
    const mx=Math.max.apply(null,ox);
    return ramp(clamp((mx+4)/12,0,1));
  }
  if(st.prop==='series') return CATC[e.series-1];
  if(st.prop==='phase')  return PHASEC[phaseAt(e,st.T)];
  const t=propT(e,st.prop,rng);
  return t==null?PHASEC.unknown:ramp(t);
}
function tileValue(e){
  if(st.tab==='electrons') return cfgShort(e).replace(/^\[[A-Za-z]+\] ?/,'');
  if(st.tab==='isotopes'){
    const n=e.iso.filter(isoStable).length;
    return n?n+' stable':'no stable';
  }
  if(st.tab==='compounds'){
    const ox=e.oxMain&&e.oxMain.length?e.oxMain:e.oxExt;
    return ox&&ox.length?ox.map(signed).join(' '):'—';
  }
  if(st.prop==='series') return wDisp(e,3);
  if(st.prop==='phase')  return phaseAt(e,st.T);
  const p=PROPBY[st.prop], v=e[st.prop];
  if(v==null) return '—';
  if(p.k==='year') return String(v);
  return fmt(v);
}

function boot(){
  const tableEl=document.getElementById('table');
  const wrapEl=document.getElementById('tablewrap');
  const panelEl=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const eqEl=document.getElementById('eqbar');
  const stripEl=document.getElementById('strip');
  const stripTag=document.getElementById('striptag');
  const cv=document.getElementById('chart');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const ctx=cv.getContext('2d');

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  /* ---- tabs ---- */
  TABS.forEach(([k,label])=>{
    tabsEl.appendChild(h('button',{class:st.tab===k?'active':'',onclick:()=>{
      st.tab=k; syncTabs(); buildPanel(); refresh(); }},label));
  });
  function syncTabs(){ [].forEach.call(tabsEl.children,(b,i)=>
    b.className=TABS[i][0]===st.tab?'active':''); }

  /* ---- table ---- */
  const tiles={};
  function buildTable(){
    tableEl.textContent='';
    for(const e of ELS){
      const t=h('div',{class:'tile','data-z':e.Z},
        h('span',{class:'tz',text:String(e.Z)}),
        h('span',{class:'tsym',text:e.sym}),
        h('span',{class:'tname',text:e.name}),
        h('span',{class:'tval'}));
      t.addEventListener('mouseenter',()=>{ st.hover=e.Z; renderCard(); });
      t.addEventListener('mouseleave',()=>{ st.hover=null; renderCard(); });
      t.addEventListener('click',()=>{ st.sel=e.Z; paint(); buildPanel(); drawStrip(); });
      tiles[e.Z]=t; tableEl.appendChild(t);
    }
    /* the two f-block placeholders, standard layout only */
    for(const [x,y,txt] of [[3,6,'57–71'],[3,7,'89–103']]){
      const m=h('div',{class:'marker',text:txt});
      m.style.gridColumn=x; m.style.gridRow=y; tableEl.appendChild(m);
    }
  }
  function placeTiles(){
    tableEl.className=st.wide?'wide':'std';
    for(const e of ELS){
      const t=tiles[e.Z];
      t.style.gridColumn=st.wide?e.wx:e.x;
      t.style.gridRow=st.wide?e.wy:e.y;
    }
  }
  function sizeTable(){
    const cols=st.wide?32:18, rows=st.wide?7:9.42;
    const W=wrapEl.clientWidth-24, H=wrapEl.clientHeight-14;
    const ts=Math.max(16,Math.min((W-(cols-1)*2)/cols,(H-(rows-1)*2)/rows));
    document.documentElement.style.setProperty('--ts',ts.toFixed(2)+'px');
  }
  function paint(){
    const rng=propRange(st.prop);
    const q=st.search.trim().toLowerCase();
    for(const e of ELS){
      const t=tiles[e.Z], c=tileColor(e,rng), ink=inkOn(c);
      t.style.background=c; t.style.color=ink;
      t.lastChild.textContent=tileValue(e);
      let dim=false;
      if(q) dim=!(e.sym.toLowerCase().startsWith(q)||e.name.toLowerCase().indexOf(q)>=0||String(e.Z)===q);
      if(st.tab==='props'&&st.prop==='series'&&st.hidden.has(e.series)) dim=true;
      t.classList.toggle('dim',dim);
      t.classList.toggle('sel',e.Z===st.sel);
    }
  }

  /* ---- the element card (top of panel) ---- */
  let cardEl=null;
  function renderCard(){
    if(!cardEl) return;
    const e=BYZ[st.hover||st.sel];
    const c=CATC[e.series-1];
    cardEl.textContent='';
    cardEl.appendChild(h('div',{class:'chead'},
      h('div',null,
        h('div',{class:'csym',text:e.sym}),
        h('div',{class:'cnm',text:e.name}),
        h('div',{class:'cmeta',html:'<span style="color:'+c+'">■</span> '+e.catName
          +' · '+e.blockn+'-block · period '+e.period+(e.group?' · group '+e.group:'')
          +(e.radio?' · <span style="color:#e8843a">radioactive</span>':'')})),
      h('div',{class:'cz'},h('b',{text:String(e.Z)}),
        h('span',{text:wDisp(e,4)}))));
    const rows=[];
    const R=(k,v)=>rows.push([k,v]);
    const P=(k,v)=>rows.push([k,v,1]);        /* a sentence: full-width, wraps */
    R('HD','configuration');
    R('electron cfg',cfgShort(e));
    R('shells',shellsOf(e.cfg).join(','));   /* no space: keeps the widest value inside the card */
    if(ANOM.has(e.Z)) R('Madelung','anomalous');
    R('HD','physical');
    R('melting point',e.melt==null?(e.subl?'none — sublimes':'—'):fmtT(e.melt,st.tunit));
    R(e.subl?'sublimes at':'boiling point',fmtT(e.boil,st.tunit));
    R('state at '+fmtT(st.T,st.tunit),phaseAt(e,st.T));
    R('density',e.density==null?'—':fmt(e.density)+' g/cm³');
    R('HD','atomic');
    R('electronegativity',e.en==null?'—':fmt(e.en,2)+' Pauling');
    R('1st ionization',e.ie1==null?'—':fmt(e.ie1,3)+' eV');
    R('electron affinity',e.ea==null?'—':fmt(e.ea,3)+' eV');
    R('atomic radius',e.radius==null?'—':fmt(e.radius,0)+' pm');
    R('covalent radius',e.covalent==null?'—':fmt(e.covalent,0)+' pm');
    R('oxidation states',(e.oxMain&&e.oxMain.length?e.oxMain:e.oxExt||[]).map(signed).join(' ')||'—');
    R('HD','occurrence & history');
    R('crustal abundance',e.crust==null?'—':fmt(e.crust)+' mg/kg');
    R('discovered',e.year==null?'—':String(e.year));
    if(e.who) P('by',e.who);
    if(e.origin) P('name from',e.origin);
    const tb=h('table',{class:'props'});
    for(const [k,v,prose] of rows){
      if(k==='HD'){ tb.appendChild(h('tr',null,h('td',{class:'hd',colspan:'2',text:v}))); continue; }
      if(prose){ tb.appendChild(h('tr',null,h('td',{class:'pr',colspan:'2'},
        h('i',{text:k+' · '}),String(v)))); continue; }
      tb.appendChild(h('tr',null,h('td',{text:k}),h('td',{class:'v',text:String(v)})));
    }
    cardEl.appendChild(tb);
    if(e.desc) cardEl.appendChild(h('div',{class:'desc',text:e.desc}));
  }

  /* ---- panel ---- */
  function buildPanel(){
    panelEl.textContent='';
    cardEl=h('div',{class:'card'}); panelEl.appendChild(cardEl); renderCard();

    const gS=h('div',{class:'grp'},h('h3',null,'find'));
    const si=h('input',{type:'search',placeholder:'symbol, name or Z…',value:st.search});
    si.addEventListener('input',()=>{ st.search=si.value; paint(); });
    si.addEventListener('keydown',ev=>{ if(ev.key!=='Enter') return;
      const q=st.search.trim().toLowerCase();
      const m=BYSYM[q]||BYNAME[q]||BYZ[+q]||ELS.find(e=>e.name.toLowerCase().indexOf(q)===0);
      if(m){ st.sel=m.Z; paint(); buildPanel(); drawStrip(); } });
    gS.appendChild(si); panelEl.appendChild(gS);

    if(st.tab==='props') panelProps();
    else if(st.tab==='electrons') panelElectrons();

    cw.addEventListener('change',()=>{ st.wide=cw.checked; placeTiles(); sizeTable(); });
    const cs=h('input',{type:'checkbox'}); cs.checked=st.strip;

      h('label',null,cs,'show analysis strip')));
    gV.appendChild(h('div',{class:'tag',html:
      'The f-block is 14 wide because a subshell of angular momentum <b>ℓ</b> holds '+
      '<b>2(2ℓ+1)</b> electrons. Pulling it out below is a printing convention, not physics.'}));
    panelEl.appendChild(gV);
  }

  function panelProps(){
    const g=h('div',{class:'grp'},h('h3',null,'colour by'));

    const btns=PROPS.map(p=>{
      const b=h('button',{class:'chip sm'+(st.prop===p.k?' on':''),onclick:()=>{

      gt.appendChild(h('div',{class:'sliderrow'},h('label',null,'T'),inp,val));
      const uw=h('div',{class:'chips'});
      const ub=[['K','kelvin'],['C','°C'],['F','°F']].map(([k,lab])=>{
        const b=h('button',{class:'chip sm'+(st.tunit===k?' on':''),onclick:()=>{
          st.tunit=k; ub.forEach((bb,i)=>bb.className='chip sm'+(['K','C','F'][i]===st.tunit?' on':''));

        uw.appendChild(b); return b; });

        presets.appendChild(h('button',{class:'chip sm',onclick:()=>{

        lg.appendChild(h('span',null,h('i',{style:'background:'+PHASEC[k]}),lab));

    } else if(st.prop==='series'){

          if(st.hidden.has(id)) st.hidden.delete(id); else st.hidden.add(id);
          buildPanel(); paint(); }},h('i',{style:'background:'+CATC[id-1]}),name);
        lg.appendChild(sp);
      });
      gl.appendChild(lg);
      gl.appendChild(h('div',{class:'tag',html:
        'Hues are a constrained search: OKLab ΔE ≥ 15 over <b>all 45 pairs</b> under normal '+
        'vision, ≥ 6 under simulated protanopia/deuteranopia. Ten categories cannot reach the '+
        'ΔE ≥ 8 CVD target, so category is also carried by the label and by position.'}));
      panelEl.appendChild(gl);
    } else {
      const p=PROPBY[st.prop], rng=propRange(st.prop);
      const gl=h('div',{class:'grp'},h('h3',null,p.lab+(p.u?' · '+p.u:'')));
      const bar=h('div',{class:'scale'});
      const stops=[]; for(let i=0;i<=20;i++) stops.push(ramp(i/20)+' '+(i*5)+'%');
      bar.style.background='linear-gradient(90deg,'+stops.join(',')+')';
      gl.appendChild(bar);
      const lo=p.log?Math.pow(10,rng[0]):rng[0], hi=p.log?Math.pow(10,rng[1]):rng[1];
      gl.appendChild(h('div',{class:'scaleends'},h('span',{text:fmt(lo)}),
        h('span',{text:(p.log?'log scale':'')}),h('span',{text:fmt(hi)})));
      const miss=ELS.filter(e=>propT(e,st.prop,rng)==null).length;
      gl.appendChild(h('div',{class:'tag',html:'<b>'+(118-miss)+'</b> of 118 measured'+
        (miss?'; the remaining <b>'+miss+'</b> are drawn in the unmeasured grey rather than extrapolated.':'.')}));
      panelEl.appendChild(gl);
    }
  }
  function countTag(){
    const ct=window.__countTag; if(!ct) return;
    let s=0,l=0,g=0,u=0;
    for(const e of ELS){ const p=phaseAt(e,st.T);
      if(p==='solid')s++; else if(p==='liquid')l++; else if(p==='gas')g++; else u++; }
    ct.innerHTML='At <b>'+fmtT(st.T,st.tunit)+'</b>: <b>'+s+'</b> solid · <b>'+l+
      '</b> liquid · <b>'+g+'</b> gas · '+u+' unmeasured';
  }

  function panelIsotopes(){
    const e=BYZ[st.sel];
    const g=h('div',{class:'grp'},h('h3',null,e.name+' · isotopes'));
    const stable=e.iso.filter(isoStable);
    const natural=e.iso.filter(r=>r[2]!=null);
    let sum=0; for(const r of natural) sum+=r[2];
    g.appendChild(h('div',{class:'tag',html:'<b>'+e.iso.length+'</b> known · <b>'+stable.length+
      '</b> stable · <b>'+natural.length+'</b> naturally occurring'+
      (natural.length?' summing to <b>'+sum.toFixed(3)+'%</b>':'')}));
    const tb=h('table',{class:'isotab'});
    tb.appendChild(h('tr',null,h('th',{text:'isotope'}),h('th',{text:'abundance'}),
      h('th',{text:'half-life'}),h('th',{text:'decay'})));
    const list=e.iso.slice().sort((a,b)=>{
      const aa=a[2]||0, bb=b[2]||0; if(aa!==bb) return bb-aa;
      const ah=a[3]==null?Infinity:a[3], bh=b[3]==null?Infinity:b[3];
      return bh-ah;
    }).slice(0,26);
    for(const r of list){
      const dm=isoDecay(r);
      const tr=h('tr',{class:isoStable(r)?'stable':''},
        h('td',{text:e.sym+'-'+r[0]}),
        h('td',{text:r[2]==null?'—':(r[2]<0.01?r[2].toExponential(1):r[2].toFixed(r[2]>=10?3:4))+'%'}),
        h('td',{text:isoStable(r)?'stable':fmtHL(r[3])}),
        h('td',{text:dm?(DECAY_LABEL[dm]||dm.toLowerCase()):'—'}));
      tb.appendChild(tr);
    }
    g.appendChild(tb);
    if(e.iso.length>26) g.appendChild(h('div',{class:'tag',text:'showing 26 of '+e.iso.length+
      ' — the rest are on the chart'}));
    panelEl.appendChild(g);

    const gl=h('div',{class:'grp'},h('h3',null,'decay mode'));
    const lg=h('div',{class:'legend'});
    for(const [k,lab] of [['stable','stable'],['B-','β⁻'],['B+','β⁺ / EC'],['A','α'],
                          ['SF','spontaneous fission'],['P','proton'],['N','neutron']])
      lg.appendChild(h('span',null,h('i',{style:'background:'+(k==='stable'?'#e8ecf4':decayColor(k))}),lab));
    gl.appendChild(lg);
    gl.appendChild(h('div',{class:'tag',html:'The stability band sits at <b>N ≈ Z</b> for light '+
      'nuclei and bends to <b>N ≈ 1.5 Z</b> by lead: Coulomb repulsion grows like <b>Z²</b> '+
      'while the strong force is short-ranged and saturates.'}));
    panelEl.appendChild(gl);
  }

  const PARTNERS=[['O',-2],['F',-1],['Cl',-1],['H',-1],['S',-2],['N',-3]];
  function panelCompounds(){
    const e=BYZ[st.sel];
    const g=h('div',{class:'grp'},h('h3',null,'oxidation states'));
    const main=e.oxMain||[], ext=e.oxExt||[];
    g.appendChild(h('div',{class:'tag',html:'common <b>'+(main.map(signed).join(' ')||'—')+
      '</b>'+(ext.length?'<br>all known '+ext.map(signed).join(' '):'')}));
    panelEl.appendChild(g);

    const gf=h('div',{class:'grp'},h('h3',null,'binary compounds · charge balance'));
    const states=(main.length?main:ext).filter(v=>v>0);
    if(!states.length) gf.appendChild(h('div',{class:'tag',
      text:e.sym+' has no positive oxidation state in this data — no binary formula is generated.'}));
    for(const q of states){
      for(const [psym,pq] of PARTNERS){
        if(psym===e.sym) continue;
        const f=formula(e.sym,q,psym,pq); if(!f) continue;
        const mm=molarMass(e.sym,q,psym,pq);
        gf.appendChild(h('div',{class:'fmlrow'},
          h('span',{class:'ox',text:signed(q)}),
          h('span',{class:'fml',text:f}),
          h('span',{class:'mm',text:mm==null?'':fmt(mm,2)+' g/mol'})));
      }
    }
    gf.appendChild(h('div',{class:'tag',html:'Formulae are <b>computed</b>, not tabulated: the '+
      'smallest integers with <b>Σ qᵢnᵢ = 0</b>, reduced by their gcd. They are the '+
      'stoichiometry the oxidation state implies — not a claim that every one has been made.'}));
    panelEl.appendChild(gf);
  }

  /* ---- the analysis strip ---- */
  function fitCanvas(){
    const dpr=window.devicePixelRatio||1;
    const w=cv.clientWidth, hh=cv.clientHeight;
    if(!w||!hh) return false;
    cv.width=Math.round(w*dpr); cv.height=Math.round(hh*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return true;
  }
  function axes(x0,y0,x1,y1){
    ctx.strokeStyle='#232833'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0,y1); ctx.lineTo(x1,y1); ctx.stroke();
  }
  function drawStrip(){
    if(!st.strip) return;
    if(!fitCanvas()) return;
    const W=cv.clientWidth, H=cv.clientHeight;
    ctx.clearRect(0,0,W,H);
    if(st.tab==='props') drawTrend(W,H);
    else if(st.tab==='electrons') drawElectrons(W,H);
    else if(st.tab==='isotopes') drawNuclides(W,H);
    else drawOxidation(W,H);
  }

  function drawTrend(W,H){
    const k=(st.prop==='series'||st.prop==='phase')?'en':st.prop;
    const p=PROPBY[k], rng=propRange(k);
    const L=54,R=14,Tp=22,B=26, x0=L, x1=W-R, y0=Tp, y1=H-B;
    /* period bands */
    for(const e of ELS){
      if(e.Z>1&&BYZ[e.Z-1].period===e.period) continue;
      const x=x0+(e.Z-0.5)/118*(x1-x0);
      ctx.strokeStyle='#171b24'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
      ctx.fillStyle='#4a5165'; ctx.font='10px "SF Mono",Menlo,monospace';
      ctx.fillText(String(e.period),x+3,y0+10);
    }
    axes(x0,y0,x1,y1);
    /* the trace */
    ctx.lineWidth=2; ctx.strokeStyle=rgba('#5ac8e0',.55);
    ctx.beginPath(); let started=false;
    for(const e of ELS){
      const t=propT(e,k,rng);
      const x=x0+(e.Z-0.5)/118*(x1-x0);
      if(t==null){ started=false; continue; }
      const y=y1-t*(y1-y0);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
    for(const e of ELS){
      const t=propT(e,k,rng); if(t==null) continue;
      const x=x0+(e.Z-0.5)/118*(x1-x0), y=y1-t*(y1-y0);
      ctx.fillStyle=ramp(t);
      const sel=e.Z===st.sel||e.Z===st.hover;
      ctx.beginPath(); ctx.arc(x,y,sel?4.5:2.4,0,TAU); ctx.fill();
      if(sel){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='11px -apple-system,sans-serif';
        ctx.textAlign=x>x1-60?'right':'left';
        ctx.fillText(e.sym+' '+fmt(e[k]),x+(x>x1-60?-7:7),y-7); ctx.textAlign='left'; }
    }
    /* y labels */
    ctx.fillStyle='#5d6577'; ctx.font='10px "SF Mono",Menlo,monospace';
    const lo=p.log?Math.pow(10,rng[0]):rng[0], hi=p.log?Math.pow(10,rng[1]):rng[1];
    ctx.fillText(fmt(hi),6,y0+9); ctx.fillText(fmt(lo),6,y1);
    ctx.fillStyle='#8b93a6'; ctx.font='11px -apple-system,sans-serif';
    ctx.fillText('Z →',x1-24,y1+17);
    stripTag.innerHTML='<b>'+p.lab+'</b> against atomic number'+(p.log?' · log scale':'')+
      ' — the sawtooth <i>is</i> the periodic law; vertical rules start new periods';
  }

  function drawElectrons(W,H){
    const e=BYZ[st.sel];
    const mid=Math.min(300,W*0.34);
    /* --- left: shell diagram --- */
    const cx=mid/2, cy=H/2, sh=shellsOf(e.cfg);
    const rmax=Math.min(mid,H)/2-16;
    ctx.save();
    for(let i=0;i<sh.length;i++){
      const r=rmax*(i+1)/sh.length;
      ctx.strokeStyle='#1e2430'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      const n=sh[i]; if(!n) continue;
      for(let k=0;k<n;k++){
        const a=-Math.PI/2+k/n*TAU;
        ctx.fillStyle=ramp(i/Math.max(1,sh.length-1));
        ctx.beginPath(); ctx.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),2.6,0,TAU); ctx.fill();
      }
      ctx.fillStyle='#6a7286'; ctx.font='9px "SF Mono",Menlo,monospace';
      ctx.fillText(String(n),cx+r+3,cy-2);
    }
    ctx.fillStyle='#fff'; ctx.font='600 15px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText(e.sym,cx,cy+5); ctx.textAlign='left';
    ctx.restore();
    /* --- right: successive ionization energies --- */
    const seq=(IE[e.Z-1]||[]).filter(v=>v!=null);
    const L=mid+50,R=16,Tp=24,B=28, x0=L,x1=W-R,y0=Tp,y1=H-B;
    axes(x0,y0,x1,y1);
    if(seq.length<2){
      ctx.fillStyle='#5d6577'; ctx.font='12px -apple-system,sans-serif';
      ctx.fillText('no successive ionization data',x0+14,(y0+y1)/2);
      stripTag.innerHTML='<b>'+e.name+'</b> — shell occupancies '+sh.join(', ');
      return;
    }
    const lo=Math.log10(Math.min.apply(null,seq)), hi=Math.log10(Math.max.apply(null,seq));
    const X=i=>x0+(seq.length===1?0.5:i/(seq.length-1))*(x1-x0);
    const Y=v=>y1-(Math.log10(v)-lo)/((hi-lo)||1)*(y1-y0);
    /* decade rules */
    for(let d=Math.floor(lo);d<=Math.ceil(hi);d++){
      const y=Y(Math.pow(10,d)); if(y<y0-1||y>y1+1) continue;
      ctx.strokeStyle='#161a22'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
      ctx.fillStyle='#4a5165'; ctx.font='9px "SF Mono",Menlo,monospace';
      ctx.fillText('1e'+d,x0-30,y+3);
    }
    /* core-break rules: cumulative shell occupancies from the outside in */
    let cum=0; const breaks=[];
    for(let i=sh.length-1;i>=0;i--){ if(!sh[i]) continue; cum+=sh[i]; if(cum<seq.length) breaks.push(cum); }
    for(const b of breaks){
      const xm=(X(b-1)+X(b))/2;          /* the rule sits BETWEEN the two stages */
      ctx.strokeStyle=rgba('#cd35c4',.45); ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(xm,y0); ctx.lineTo(xm,y1); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=2;
    ctx.beginPath();
    seq.forEach((v,i)=>{ const x=X(i),y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
    seq.forEach((v,i)=>{ ctx.fillStyle='#b8ec4c';
      ctx.beginPath(); ctx.arc(X(i),Y(v),seq.length>40?1.6:2.6,0,TAU); ctx.fill(); });
    ctx.fillStyle='#8b93a6'; ctx.font='11px -apple-system,sans-serif';
    ctx.fillText('electron removed →',x1-108,y1+18);
    ctx.fillText('eV',x0-34,y0+2);
    stripTag.innerHTML='<b>'+e.name+'</b> · shells '+sh.join(', ')+
      ' — each dashed rule is a closed shell breaking open; the jump across it is the '+
      'shell structure made visible';
  }

  function drawNuclides(W,H){
    const L=40,R=12,Tp=14,B=26, x0=L,x1=W-R,y0=Tp,y1=H-B;
    let Nmax=0; for(let z=1;z<=118;z++) for(const r of (ISO[z]||[])) Nmax=Math.max(Nmax,r[0]-z);
    const sx=(x1-x0)/(Nmax+2), sy=(y1-y0)/119;
    const X=n=>x0+n*sx, Y=z=>y1-z*sy;
    const w=Math.max(1,sx-0.4), hgt=Math.max(1,sy-0.4);
    for(let z=1;z<=118;z++){
      for(const r of (ISO[z]||[])){
        const n=r[0]-z;
        ctx.fillStyle=isoStable(r)?'#e8ecf4':decayColor(isoDecay(r));
        ctx.globalAlpha=isoStable(r)?1:0.82;
        ctx.fillRect(X(n),Y(z)-hgt,w,hgt);
      }
    }
    ctx.globalAlpha=1;
    /* N = Z guide */
    ctx.strokeStyle=rgba('#5ac8e0',.35); ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(118),Y(118)); ctx.stroke(); ctx.setLineDash([]);
    /* selected element row */
    const e=BYZ[st.sel];
    ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    ctx.strokeRect(x0-1,Y(e.Z)-hgt-1,x1-x0+1,hgt+2);
    ctx.fillStyle='#fff'; ctx.font='10px -apple-system,sans-serif';
    ctx.fillText(e.sym,x0-26,Y(e.Z)-1);
    axes(x0,y0,x1,y1);
    ctx.fillStyle='#5d6577'; ctx.font='10px "SF Mono",Menlo,monospace';
    for(let z=20;z<=118;z+=20){ ctx.fillText(String(z),8,Y(z)+3); }
    for(let n=20;n<=Nmax;n+=20){ ctx.fillText(String(n),X(n)-6,y1+13); }
    ctx.fillStyle='#8b93a6'; ctx.font='11px -apple-system,sans-serif';
    ctx.fillText('N (neutrons) →',x1-96,y1+22); ctx.fillText('Z',6,y0+8);
    stripTag.innerHTML='<b>chart of nuclides</b> — 3400 ground states; the dashed line is '+
      'N = Z, and the band bends above it because Coulomb repulsion grows like Z²';
  }

  function drawOxidation(W,H){
    const L=44,R=14,Tp=16,B=26, x0=L,x1=W-R,y0=Tp,y1=H-B;
    let lo=0,hi=0;
    for(const e of ELS) for(const v of (e.oxExt||[])){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
    const X=z=>x0+(z-0.5)/118*(x1-x0), Y=v=>y1-(v-lo)/((hi-lo)||1)*(y1-y0);
    /* zero line */
    ctx.strokeStyle='#2a3040'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0,Y(0)); ctx.lineTo(x1,Y(0)); ctx.stroke();
    for(const e of ELS){
      const mainSet=new Set(e.oxMain||[]);
      for(const v of (e.oxExt&&e.oxExt.length?e.oxExt:e.oxMain||[])){
        const x=X(e.Z), y=Y(v), isMain=mainSet.has(v);
        ctx.beginPath(); ctx.arc(x,y,isMain?3:1.8,0,TAU);
        if(isMain){ ctx.fillStyle=CATC[e.series-1]; ctx.fill(); }
        else { ctx.strokeStyle=rgba(CATC[e.series-1],.5); ctx.lineWidth=1; ctx.stroke(); }
      }
    }
    const e=BYZ[st.sel];
    ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(e.Z),y0); ctx.lineTo(X(e.Z),y1); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='11px -apple-system,sans-serif';
    ctx.fillText(e.sym,X(e.Z)+4,y0+10);
    axes(x0,y0,x1,y1);
    ctx.fillStyle='#5d6577'; ctx.font='10px "SF Mono",Menlo,monospace';
    for(let v=Math.ceil(lo);v<=hi;v++){ if(v%2) continue;
      ctx.fillText(signed(v),8,Y(v)+3); }
    ctx.fillStyle='#8b93a6'; ctx.font='11px -apple-system,sans-serif';
    ctx.fillText('Z →',x1-24,y1+18);
    stripTag.innerHTML='<b>oxidation states</b> — filled dots are the common states, hollow the '+
      'rest; the +2 ridge across the d-block is the ns² pair, and the fan to +7 tracks the '+
      'd-electron count';
  }

  /* ---- equation bar ---- */
  const EQ={
    props:'<span class="hl">&radic;&nu;</span> = k ( <span class="hl2">Z</span> &minus; &sigma; )'+
      '<span class="sm">Moseley 1913 — the K&alpha; line is linear in an integer nuclear charge, '+
      'not in atomic mass. That is why the table is ordered by Z, and why Mendeleev&rsquo;s '+
      'Ar/K, Co/Ni and Te/I transpositions stop being exceptions.</span>',
    electrons:'fill by increasing ( <span class="hl">n</span> + <span class="hl2">&ell;</span> ), '+
      'ties by increasing <span class="hl">n</span>'+
      '<span class="sm">The Madelung rule. Period lengths 2, 8, 8, 18, 18, 32, 32 follow from it, '+
      'and a subshell holds 2(2&ell;+1) — so the blocks are 2, 6, 10, 14 wide.</span>',
    isotopes:'N(t) = N<sub>0</sub> e<sup>&minus;<span class="hl2">&lambda;</span>t</sup> , '+
      '<span class="hl">t<sub>&frac12;</sub></span> = ln2 / <span class="hl2">&lambda;</span>'+
      '<span class="sm">Half-lives on the chart span 55 orders of magnitude, from ~10<sup>&minus;22</sup> s '+
      'to &gt;10<sup>24</sup> yr — which is why the isotope axis is drawn logarithmically.</span>',
    compounds:'&Sigma; <span class="hl">q</span><sub>i</sub> <span class="hl2">n</span><sub>i</sub> = 0'+
      '<span class="sm">Charge balance. Every formula in the panel is the smallest integer solution '+
      'reduced by its gcd — computed from the oxidation state, not looked up.</span>',
  };
  const SUBT={
    props:'ordered by nuclear charge — the shape is the Madelung filling order',
    electrons:'the blocks are 2(2ℓ+1) wide, and 20 elements disobey the rule that draws them',

  function refresh(){
    paint(); renderCard();
    eqEl.innerHTML=EQ[st.tab]; subEl.textContent=SUBT[st.tab];
    drawStrip();
  }

  /* ---- keyboard ---- */
  window.addEventListener('keydown',ev=>{
    if(ev.target&&/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if(ev.key>='1'&&ev.key<='4'){ st.tab=TABS[+ev.key-1][0]; syncTabs(); buildPanel(); refresh(); return; }
    const e=BYZ[st.sel]; if(!e) return;
    let dx=0,dy=0;
    if(ev.key==='ArrowLeft') dx=-1; else if(ev.key==='ArrowRight') dx=1;
    else if(ev.key==='ArrowUp') dy=-1; else if(ev.key==='ArrowDown') dy=1;
    else return;
    ev.preventDefault();
    const gx=st.wide?'wx':'x', gy=st.wide?'wy':'y';
    let best=null,bd=1e9;
    for(const c of ELS){
      if(c.Z===e.Z) continue;
      const ddx=c[gx]-e[gx], ddy=c[gy]-e[gy];
      if(dx&&(Math.sign(ddx)!==dx||ddy!==0)) continue;
      if(dy&&(Math.sign(ddy)!==dy||ddx!==0)) continue;
      const d=Math.abs(ddx)+Math.abs(ddy);
      if(d<bd){ bd=d; best=c; }
    }
    if(!best){                                  /* fall back to Z order */
      const nz=clamp(st.sel+(dx||dy),1,118); best=BYZ[nz];
    }
    if(best){ st.sel=best.Z; paint(); buildPanel(); drawStrip(); }
  });

  window.addEventListener('resize',()=>{ sizeTable(); drawStrip(); });

  buildTable(); placeTiles(); sizeTable(); buildPanel(); refresh();
  /* a second pass once fonts/layout settle */
  requestAnimationFrame(()=>{ sizeTable(); drawStrip(); });
}

/* ================================================================== *
 *  self-test — runs when there is no document                         *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond){ pass++; } else { fail++; console.log('FAIL — '+name); } };
  const chk=(name,got,want,tol,rel)=>{
    const e=rel?Math.abs(got-want)/Math.abs(want):Math.abs(got-want);
    if(e<=tol) pass++; else { fail++;
      console.log('FAIL — '+name+': got '+got+' want '+want+' err '+e.toExponential(3)); } };

  /* ---------- data integrity ---------- */
  ok(ELS.length===118,'118 elements');
  ok(ELS.every((e,i)=>e.Z===i+1),'Z is 1..118 in order');
  ok(new Set(ELS.map(e=>e.sym)).size===118,'symbols unique');
  ok(new Set(ELS.map(e=>e.name)).size===118,'names unique');
  ok(ELS.every(e=>e.period>=1&&e.period<=7),'periods in 1..7');
  ok(ELS.every(e=>e.block>=0&&e.block<=3),'block index valid');
  ok(ELS.every(e=>e.series>=1&&e.series<=10),'series id valid');
  ok(SERIES.length===10,'10 categories');
  ok(CATC.length===10,'10 category colours');
  ok(IE.length===118,'IE table covers 118 elements');
  ok(Object.keys(ISO).length===118,'isotope table covers 118 elements');

  /* ---------- layout ---------- */
  { const seen={}, wseen={}; let coll=0, wcoll=0;
    for(const e of ELS){
      const k=e.x+','+e.y, w=e.wx+','+e.wy;
      if(seen[k]) coll++; if(wseen[w]) wcoll++;
      seen[k]=1; wseen[w]=1; }
    ok(coll===0,'standard layout is collision-free');
    ok(wcoll===0,'wide layout is collision-free');
    ok(ELS.every(e=>e.x>=1&&e.x<=18),'standard layout is 18 columns');
    ok(ELS.every(e=>e.wx>=1&&e.wx<=32),'wide layout is 32 columns');
    /* group must equal the column, for everything outside the f-block strip */
    let gmis=0;
    for(const e of ELS){ if(!e.group) continue; if(e.y<=7&&e.x!==e.group) gmis++; }
    ok(gmis===0,'group number equals the column in the main body');
    /* period must equal the row in the wide layout — that is what "wide" means */
    ok(ELS.every(e=>e.wy===e.period),'wide layout row equals period');
  }

  /* ---------- electron configurations ---------- */
  { let bad=0;
    for(const e of ELS){ if(cfgElectrons(e.cfg)!==e.Z) { bad++; console.log('  cfg sum != Z for '+e.sym); } }
    ok(bad===0,'every configuration has exactly Z electrons');
    let capbad=0;
    for(const e of ELS) for(const x of parseCfg(e.cfg)) if(x.count>2*(2*x.l+1)) capbad++;
    ok(capbad===0,'no subshell exceeds 2(2l+1)');
    /* shells must sum to Z too */
    ok(ELS.every(e=>shellsOf(e.cfg).reduce((a,b)=>a+b,0)===e.Z),'shell occupancies sum to Z');
  }

  /* ---------- the Madelung construction ---------- */
  { const o=MADELUNG.slice(0,19).map(x=>x.n+BLOCKN[x.l]).join(' ');
    ok(o==='1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p',
       'Madelung order reproduces the aufbau sequence  ['+o+']');
    /* period lengths implied by the rule */
    const lens=[]; let cur=0, lastN=1;
    for(const {n,l} of MADELUNG){
      const row=n+ (l===0?0:0);
      void row;
    }
    /* period length = electrons added between successive ns subshells */
    const seq=[]; for(const {n,l} of MADELUNG) seq.push({n,l,cap:2*(2*l+1)});
    let acc=0; const plens=[];
    for(let i=0;i<seq.length;i++){
      if(seq[i].l===0&&i>0){ plens.push(acc); acc=0; }
      acc+=seq[i].cap;
    }
    plens.push(acc);
    ok(plens.slice(0,7).join(',')==='2,8,8,18,18,32,32',
       'Madelung gives period lengths 2,8,8,18,18,32,32  ['+plens.slice(0,7).join(',')+']');
    /* The anomaly set must be EXACTLY these 20, over the range where ground-state
       configurations have actually been MEASURED (Z <= 103).  Beyond that the
       configurations in any table are relativistic predictions, and different
       sources disagree — this data set has Ds and Rg deviating, others predict
       they do not, so nothing is asserted about their values. */
    const want=[24,29,41,42,44,45,46,47,57,58,64,78,79,89,90,91,92,93,96,103];
    const measured=ANOMALIES.filter(z=>z<=103);
    ok(measured.join(',')===want.join(','),
       'exactly the 20 measured configuration anomalies  [got '+measured.length+': '+
       measured.map(z=>BYZ[z].sym).join(' ')+']');
    ok(ANOMALIES.filter(z=>z>103).every(z=>z>=104),
       'any further anomalies are superheavy, i.e. predicted rather than measured  ['+
       (ANOMALIES.filter(z=>z>103).map(z=>BYZ[z].sym).join(' ')||'none')+']');
    /* palladium is the two-electron jump */
    ok(BYZ[46].cfg.indexOf('5s')<0,'Pd has no 5s electron at all');
  }

  /* ---------- Moseley: ordering by Z removes the weight inversions ---------- */
  /* Only elements with a real published standard atomic weight can be compared:
     for the synthetics the "weight" is just the mass number of the longest-lived
     isotope in square brackets, so ordering them by it is meaningless. */
  { const inv=[];
    for(let z=1;z<118;z++){
      const a=BYZ[z], b=BYZ[z+1];
      if(a.wnist!=null&&b.wnist!=null&&a.wnist>b.wnist) inv.push(a.sym+'/'+b.sym);
    }
    ok(inv.join(',')==='Ar/K,Co/Ni,Te/I,Th/Pa',
       'the four atomic-weight inversions are Ar/K, Co/Ni, Te/I, Th/Pa  [got '+inv.join(',')+']');
    /* and Z is, by construction, monotone — the point of Moseley's law */
    ok(ELS.every((e,i)=>i===0||e.Z>ELS[i-1].Z),'Z is strictly increasing');
  }

  /* ---------- atomic weight closure against the isotope table ---------- */
  { let worst=0, worstSym='', beyond=[];
    for(const e of ELS){
      const nat=e.iso.filter(r=>r[2]!=null);
      if(!nat.length) continue;
      let tot=0, w=0;
      for(const r of nat){ const m=r[0]+(r[1]==null?0:r[1]/931494.10242);
        tot+=r[2]/100; w+=r[2]/100*m; }
      if(tot<0.999) { ok(e.sym==='Ta','only Ta has an abundance sum below 99.9% (isomer Ta-180m omitted)'); continue; }
      const iv=/^\[([\d.]+),([\d.]+)\]$/.exec(e.wstr||'');
      if(iv){
        const lo=+iv[1], hi=+iv[2];
        ok(w>=lo&&w<=hi, e.sym+' computed weight '+w.toFixed(5)+' inside IUPAC interval '+e.wstr);
      } else if(e.wnist!=null){
        /* compared against NIST's OWN standard weight, so this is an internal
           consistency check of one publication rather than a clash of two */
        const rel=Math.abs(w-e.wnist)/e.wnist;
        if(rel>worst){ worst=rel; worstSym=e.sym; }
        if(rel>5e-5) beyond.push(e.sym);
      }
    }
    ok(worst<2e-4,'abundance-weighted mass reproduces the published weight to <2e-4 (worst '+
       worstSym+' '+worst.toExponential(2)+')');
    ok(beyond.join(',')==='Se,Mo,Ru,Pb',
       'exactly four elements exceed 5e-5: Se and Mo had their weights revised in 2013 while '+
       'the composition table was not, Pb carries a conventional weight because radiogenic '+
       'lead varies by source, Ru is 4-figure rounding  [got '+beyond.join(',')+']');
  }

  /* ---------- how a weight is printed ---------- */
  { /* An element with no standard atomic weight has only a mass number, and a
       mass number is an integer. Printing tennessine as "294.0000" claims seven
       significant figures of a measurement nobody has made. */
    const noStd=ELS.filter(e=>e.wnist==null && !(e.wstr&&e.wstr[0]==='['));
    ok(noStd.length===24,'24 elements have neither a NIST standard weight nor a bracketed '+
       'wstr from the source (got '+noStd.length+')');
    ok(noStd[0].sym==='Am'&&noStd[noStd.length-1].sym==='Og',
       'they run from americium to oganesson (got '+noStd[0].sym+'..'+noStd[noStd.length-1].sym+')');
    ok(noStd.every(e=>/^\[\d+\]$/.test(wDisp(e,4))),
       'every one of them prints as a bracketed integer mass number');
    ok(ELS.every(e=>e.wnist!=null || wDisp(e,4).indexOf('.')<0 || wDisp(e,4)[0]==='['),
       'no element without a standard weight prints a bare decimal');
    ok(wDisp(BYZ[117],4)==='[294]'&&wDisp(BYZ[95],4)==='[243]'&&wDisp(BYZ[118],4)==='[294]',
       'Ts [294], Am [243], Og [294]');
    ok(wDisp(BYZ[43],4)==='[98]'&&wDisp(BYZ[84],4)==='[209]',
       'the source-bracketed radioelements are unchanged: Tc [98], Po [209]');
    ok(wDisp(BYZ[79],4)==='196.9666'&&wDisp(BYZ[92],4)==='238.0289',
       'measured weights still print as numbers: Au 196.9666, U 238.0289');
    ok(wDisp(BYZ[3],4)==='[6.938,6.997]','lithium still prints its IUPAC interval');
  }

  /* ---------- isotopes ---------- */
  { let n=0, stableN=0, badHL=0, badA=0;
    for(let z=1;z<=118;z++) for(const r of ISO[z]){
      n++;
      if(r[0]<z) badA++;                       /* A must be at least Z */
      if(r[3]!=null&&!(r[3]>0)) badHL++;
      if(isoStable(r)) stableN++;
    }
    ok(n>3000,'more than 3000 nuclides ('+n+')');
    ok(badA===0,'every isotope has A >= Z');
    ok(badHL===0,'every half-life is positive');
    ok(stableN>=250&&stableN<=300,'stable-nuclide count is in the expected 250-300 band ('+stableN+')');
    /* the elements with no stable isotope */
    const nostab=ELS.filter(e=>e.iso.filter(isoStable).length===0).map(e=>e.Z);
    ok(nostab.indexOf(43)>=0&&nostab.indexOf(61)>=0,'Tc and Pm have no stable isotope');
    /* Bismuth belongs on this list: Bi-209 was long called the heaviest stable
       nuclide, until its alpha decay was observed in 2003 at t(1/2) ~ 2e19 yr. */
    ok(nostab.every(z=>z===43||z===61||z>=83),'the only stable-free elements are Tc, Pm and Z>=83');
    ok(nostab.indexOf(83)>=0,'bismuth has no stable isotope (Bi-209 alpha-decays, observed 2003)');
    ok(nostab.indexOf(82)<0,'lead does have stable isotopes');
    /* Sn should be the champion */
    const best=ELS.slice().sort((a,b)=>b.iso.filter(isoStable).length-a.iso.filter(isoStable).length)[0];
    ok(best.sym==='Sn','tin has the most stable isotopes ('+
       best.sym+', '+best.iso.filter(isoStable).length+')');
  }

  /* ---------- periodic trends ---------- */
  { const p2=[3,4,5,6,7,8,9].map(z=>BYZ[z]);
    ok(p2.every((e,i)=>i===0||e.en>p2[i-1].en),'electronegativity rises Li→F across period 2');
    const g1=[3,11,19,37,55].map(z=>BYZ[z]);
    ok(g1.every((e,i)=>i===0||e.en<=g1[i-1].en),'electronegativity falls down group 1');
    ok(Math.max.apply(null,ELS.filter(e=>e.en!=null).map(e=>e.en))===BYZ[9].en,'fluorine is the most electronegative');
    const ie=ELS.filter(e=>e.ie1!=null);
    ok(ie.reduce((a,b)=>a.ie1>b.ie1?a:b).sym==='He','helium has the largest 1st ionization energy');
    ok(BYZ[55].ie1<BYZ[11].ie1&&BYZ[11].ie1<BYZ[3].ie1,'1st ionization energy falls Li>Na>Cs');
    /* noble gases sit at the local IE maxima */
    for(const z of [10,18,36,54,86])
      ok(BYZ[z].ie1>BYZ[z+1].ie1&&BYZ[z].ie1>BYZ[z-1].ie1,'Z='+z+' is a local ionization maximum');
  }

  /* ---------- phase logic ---------- */
  { const at=T=>{ const c={solid:0,liquid:0,gas:0,unknown:0};
      for(const e of ELS) c[phaseAt(e,T)]++; return c; };
    const room=at(293.15);
    ok(room.gas===11,'11 elements are gases at 293.15 K (got '+room.gas+')');
    ok(room.liquid===2,'2 elements are liquid at 293.15 K (got '+room.liquid+')');
    const liq=ELS.filter(e=>phaseAt(e,293.15)==='liquid').map(e=>e.sym).sort().join(',');
    ok(liq==='Br,Hg','the two room-temperature liquids are Br and Hg (got '+liq+')');
    ok(at(1).gas===0,'nothing boils at 1 K');
    ok(at(6000).solid===0,'nothing is solid at 6000 K');
    /* monotone: heating never turns a gas back into a solid */
    let mono=true;
    for(const e of ELS){ let seenGas=false;
      for(let T=1;T<=6000;T+=97){ const p=phaseAt(e,T);
        if(p==='gas') seenGas=true; else if(seenGas&&p==='solid') mono=false; } }
    ok(mono,'heating never returns an element from gas to solid');
    ok(BYZ[74].melt>=3600,'tungsten melts above 3600 K');
    /* Carbon is the usual answer to "highest melting point", but at 1 atm it has
       no melting point at all — it sublimes, and the 3823 K figure needs ~10 MPa.
       Among elements that actually melt at 1 atm, tungsten is the champion. */
    ok(ELS.filter(e=>e.melt!=null).reduce((a,b)=>a.melt>b.melt?a:b).sym==='W',
       'tungsten has the highest melting point of any element that melts at 1 atm');
    ok(BYZ[6].melt==null&&BYZ[6].subl===1,'carbon has no melting point at 1 atm — it sublimes');
    ok(phaseAt(BYZ[6],293.15)==='solid','carbon is still solid at room temperature');
    ok(phaseAt(BYZ[6],5000)==='gas','carbon has sublimed by 5000 K');
    ok(ELS.filter(e=>e.subl).map(e=>e.sym).join(',')==='C,As',
       'C and As are the elements whose 1 atm transition is a sublimation point');
  }

  /* ---------- compound charge balance ---------- */
  { ok(formula('Al',3,'O',-2)==='Al'+sub(2)+'O'+sub(3),'Al(+3) + O(-2) -> Al2O3');
    ok(formula('C',4,'O',-2)==='CO'+sub(2),'C(+4) + O(-2) -> CO2  (gcd reduced)');
    ok(formula('Na',1,'Cl',-1)==='NaCl','Na(+1) + Cl(-1) -> NaCl');
    ok(formula('Ca',2,'O',-2)==='CaO','Ca(+2) + O(-2) -> CaO  (gcd reduced)');
    ok(formula('Fe',3,'O',-2)==='Fe'+sub(2)+'O'+sub(3),'Fe(+3) + O(-2) -> Fe2O3');
    ok(formula('S',6,'O',-2)==='SO'+sub(3),'S(+6) + O(-2) -> SO3');
    ok(formula('Ti',4,'Cl',-1)==='TiCl'+sub(4),'Ti(+4) + Cl(-1) -> TiCl4');
    ok(formula('O',-2,'S',-2)===null,'two anions do not balance');
    ok(formula('Na',1,'K',1)===null,'two cations do not balance');
    /* charge really is balanced, for every generated formula in the table */
    let unbal=0, cnt=0;
    for(const e of ELS){
      const states=(e.oxMain&&e.oxMain.length?e.oxMain:e.oxExt||[]).filter(v=>v>0);
      for(const q of states) for(const [ps,pq] of [['O',-2],['F',-1],['Cl',-1],['S',-2],['N',-3]]){
        if(ps===e.sym) continue;
        const r=balance(q,pq); if(!r) continue;
        cnt++;
        if(r[0]*q+r[1]*pq!==0) unbal++;
        if(gcd(r[0],r[1])!==1) unbal++;        /* must be in lowest terms */
      }
    }
    ok(cnt>300,'generated a meaningful number of formulae ('+cnt+')');
    ok(unbal===0,'every generated formula is charge-balanced and in lowest terms');
    chk('molar mass of Al2O3',molarMass('Al',3,'O',-2),101.96,0.02,false);
    chk('molar mass of CO2',molarMass('C',4,'O',-2),44.009,0.01,false);
    chk('molar mass of NaCl',molarMass('Na',1,'Cl',-1),58.44,0.01,false);
  }

  /* ---------- colour ---------- */
  { ok(toRgb('#2b5f96').join()==='43,95,150','toRgb parses 6-digit hex');
    ok(toRgb('#abc').join()==='170,187,204','toRgb parses 3-digit hex');
    ok(toRgb('rgb(58,111,142)').join()==='58,111,142','toRgb parses rgb()');
    ok(toRgb(mix('#3a6f8e','#d8a04a',0.5)).every(c=>c>0),'mix output re-parses non-black');
    const two=mix('#070b18',mix('#3a6f8e','#d8a04a',0.4),0.8);
    ok(toRgb(two).reduce((a,b)=>a+b)>150,'two-stage blend stays bright ('+two+')');
    let threw=false; try{ toRgb('chartreuse'); }catch(e){ threw=true; }
    ok(threw,'toRgb throws on an unparseable colour instead of silently going black');

    /* the sequential ramp must be strictly ordered in lightness — the whole
       reason it exists rather than using neon() directly */
    let prev=Infinity, mono=true, minC=Infinity;
    for(let i=0;i<=40;i++){
      const c=ramp(i/40), L=oklabOf(c)[0];
      if(L>prev-1e-4) mono=false;
      prev=L; minC=Math.min(minC,contrastRatio(c,'#070b18'));
    }
    ok(mono,'the sequential ramp is strictly decreasing in OKLab lightness');
    ok(minC>=3.0,'every ramp step clears 3:1 against the surface (worst '+minC.toFixed(2)+')');
    /* and the raw NEON ramp is NOT — this is the defect ramp() exists to fix */
    let neonMono=true, p2=Infinity;
    for(let i=0;i<=40;i++){
      const c=neon(i/40);
      const L=lin2lab(s2lin(c[0]),s2lin(c[1]),s2lin(c[2]))[0];
      if(L>p2-1e-4) neonMono=false; p2=L;
    }
    ok(!neonMono,'the raw NEON ramp is confirmed non-monotone (the reason ramp() re-lights it)');

    /* category palette: the gates that were solved for */
    const sim=(hex,M)=>{
      const c=toRgb(hex).map(v=>s2lin(v/255));
      const f=r=>clamp(r[0]*c[0]+r[1]*c[1]+r[2]*c[2],0,1);
      return lin2lab(f(M[0]),f(M[1]),f(M[2]));
    };
    const PROTAN=[[0.152286,1.052583,-0.204868],[0.114503,0.786281,0.099216],[-0.003882,-0.048116,1.051998]];
    const DEUTAN=[[0.367322,0.860646,-0.227968],[0.280085,0.672501,0.047413],[-0.011820,0.042940,0.968881]];
    const dE=(a,b)=>100*Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
    let wn=Infinity, wc=Infinity, offband=0, lowchroma=0, lowcontrast=0;
    for(let i=0;i<10;i++){
      const lab=oklabOf(CATC[i]);
      if(lab[0]<0.48||lab[0]>0.67) offband++;
      if(Math.hypot(lab[1],lab[2])<0.105) lowchroma++;
      if(contrastRatio(CATC[i],'#070b18')<3) lowcontrast++;
      for(let j=i+1;j<10;j++){
        wn=Math.min(wn,dE(oklabOf(CATC[i]),oklabOf(CATC[j])));
        wc=Math.min(wc,dE(sim(CATC[i],PROTAN),sim(CATC[j],PROTAN)),
                       dE(sim(CATC[i],DEUTAN),sim(CATC[j],DEUTAN)));
      }
    }
    ok(offband===0,'all 10 category hues sit in the dark-mode lightness band 0.48-0.67');
    ok(lowchroma===0,'all 10 category hues clear the 0.105 chroma floor');
    ok(lowcontrast===0,'all 10 category hues clear 3:1 against the surface');
    ok(wn>=15,'worst ALL-PAIRS normal-vision separation >= 15 (got '+wn.toFixed(1)+')');
    ok(wc>=6,'worst all-pairs CVD separation >= 6, the labelled-relief floor (got '+wc.toFixed(1)+')');
    ok(inkOn('#b8ec4c')==='#08090d'&&inkOn('#1c74b4')==='#eef1f6','ink flips with fill lightness');
  }

  /* ---------- formatting helpers ---------- */
  { ok(fmt(null)==='—','fmt handles null');
    ok(fmtT(273.15,'C').indexOf('0.0')===0,'fmtT converts to Celsius');
    ok(fmtT(273.15,'F').indexOf('32.0')===0,'fmtT converts to Fahrenheit');
    ok(fmtHL(1)==='1.00 s','fmtHL seconds');
    ok(fmtHL(3.1557e16).indexOf('Gyr')>0,'fmtHL gigayears');
    ok(fmtHL(1e-21).indexOf('zs')>0,'fmtHL zeptoseconds');
    ok(sub(23)==='₂₃','subscript digits');
    ok(signed(-2)==='−2'&&signed(3)==='+3','signed oxidation states');
    ok(cfgShort(BYZ[26]).indexOf('[Ar]')===0,'Fe abbreviates to [Ar] core');
    ok(cfgShort(BYZ[2])==='1s2','He has no noble-gas core to abbreviate');
    ok(phaseAt(BYZ[80],293.15)==='liquid','Hg is liquid at room temperature');
    ok(phaseAt(BYZ[2],293.15)==='gas','He is a gas at room temperature');
    ok(phaseAt(BYZ[26],293.15)==='solid','Fe is solid at room temperature');
    ok(phaseAt(BYZ[118],293.15)==='unknown','Og has no measured phase');
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
