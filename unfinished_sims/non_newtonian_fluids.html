  frame(ctx,box(cbx,cby,12,cbh),'#2a2f3d');
  const cbl=ST.cField==='visc'?[lo,hi].map(v=>sigf(Math.pow(10,v),2)):[fmt(lo,ST.cField==='vort'?0:1),fmt(hi,ST.cField==='vort'?0:1)];
  lab(ctx,W,H,cbx+16,cby+cbh,cbl[0],'#8b93a6',SM_FONT,'left','middle'); lab(ctx,W,H,cbx+16,cby,cbl[1],'#8b93a6',SM_FONT,'left','middle');
  lab(ctx,W,H,cbx,cby-8,ST.cField==='speed'?'|u| / U':ST.cField==='vort'?'ω L / U':'ν, lattice','#8b93a6',SM_FONT,'left','bottom');
  /* the centrelines */

  if(L.bottom[1]){ const b=L.bottom[1], A=plotAxes(ctx,b,{lo:0,hi:1},{lo:-0.6,hi:0.45},{title:titleFor(b,'v on the horizontal centreline','v(x) / U'),xlab:'x / L',ylab:'v / U',xticks:[0,0.5,1],yticks:[-0.5,0,0.4]});
    curve(ctx,A,C.cl.pos,C.cl.vc,COL.pos,1.8);
    if(C.ghia) GHIA_T.pos_v.forEach((x,i)=>{ const odd=GHIA_ODD[C.ghia]&&GHIA_ODD[C.ghia].v===i;
      dot(ctx,A.X(x),A.Y(GHIA_T.v[C.ghia][i]),2.8,odd?null:COL.ghia,odd?COL.ghia:null,1.2); }); }
  if(L.bottom[2]){ const b=L.bottom[2], hs=C.hist.filter(h=>h[1]>0);
    const xs=hs.map(h=>h[0]), ys=hs.map(h=>Math.log10(h[1])), xmax=Math.max(4000,C.L.steps);
    const A=plotAxes(ctx,b,{lo:0,hi:xmax},{lo:-12,hi:0,log:true},{title:titleFor(b,'the change per 400 steps, over U','still changing'),xlab:'steps',
      nx:Math.max(2,Math.floor(b.w/70)),xfmt:t=>t>=1e6?fmt(t/1e6,t%1e6?1:0)+'M':t>=1e3?fmt(t/1e3,t%1e3?1:0)+'k':fmt(t,0)});
    curve(ctx,A,xs,ys,COL.struct,1.4); }

/* ================================================================== *
 *  views 4-6, the dispatch, the pointer, the scene                    *
 * ================================================================== */
/* ---- springs and dashpots: the elements ---- */
function springPx(ctx,x0,x1,y,amp,col){
  const n=8, lead=Math.min(10,(x1-x0)*0.15), a=x0+lead, b=x1-lead;
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(a,y);
  for(let i=0;i<n;i++){ const xm=a+(b-a)*(i+0.5)/n; ctx.lineTo(xm,y+(i%2?amp:-amp)); }
  ctx.lineTo(b,y); ctx.lineTo(x1,y); ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.stroke();
  POLY_SEGS.push(x0,y-amp,x1,y+amp);
}
/* a dashpot from x0 to x1: its cylinder fixed to x0 (a fixed length), its piston on a rod from x1 */
function dashPx(ctx,x0,x1,y,h,col,cyl){
  const cx1=x0+cyl, rod=Math.max(6,x1-x0-cyl*0.55);
  const px=x1-rod;                                                  /* the piston's face */
  ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.beginPath();
  ctx.moveTo(x0,y); ctx.lineTo(x0+6,y);
  ctx.moveTo(x0+6,y-h); ctx.lineTo(cx1,y-h); ctx.moveTo(x0+6,y+h); ctx.lineTo(cx1,y+h); ctx.moveTo(x0+6,y-h); ctx.lineTo(x0+6,y+h);
  ctx.moveTo(clamp(px,x0+9,cx1-2),y-h*0.75); ctx.lineTo(clamp(px,x0+9,cx1-2),y+h*0.75);
  ctx.moveTo(clamp(px,x0+9,cx1-2),y); ctx.lineTo(x1,y); ctx.stroke();
  ctx.fillStyle=rgba(col,0.12); ctx.fillRect(x0+6,y-h,cyl-6,2*h);
  POLY_SEGS.push(x0,y-h,x1,y+h);
}
function drawSprings(ctx,W,H,M){
  const S=M.S, test=ST.sTest;
  const capFull='A spring stores (its stress is its modulus times its strain) and a dashpot flows (its stress is its viscosity times its strain rate); every linear viscoelastic material is a network of them. The network is drawn at the moment the plots mark: '+(test==='relax'?'held at a fixed stretch, its stress relaxing':test==='creep'?'pulled with a fixed force, creeping':'stretched back and forth, the stress leading the strain by the loss angle')+'. Below: the storage and loss moduli over frequency, and the Deborah number: the time the network takes to adjust against the time of the process watching it (log axis, from a molecule of water to about twelve days).';
  const capShort='Springs store, dashpots flow; the network at the plots’ moment, its moduli over frequency, and the Deborah number on a log time axis.';
  const L=fluidLayout(ctx,W,H,capFull,capShort,2,0.32);
  const sp=splitMain(L.main,0.4,74);
  if(sp.pic) drawNetwork(ctx,W,H,sp.pic,S);
  /* the response in time */
  { const b=sp.plot, ts=S.ts, ys=S.ys, ymax=Math.max(...ys.map(Math.abs))*1.08||1, ymin=test==='osc'?-ymax:0;
    const yl=test==='creep'?'strain (per unit stress, 1/Pa)':'stress (per unit strain, Pa)';
    const A=plotAxes(ctx,b,{lo:0,hi:S.span},{lo:ymin,hi:ymax},{title:titleFor(b,test==='relax'?'relaxation: the stress after a step of strain, G(t)':test==='creep'?'creep: the strain under a step of stress, J(t)':'oscillation: stress (green) and strain (cyan), scaled','the response',test==='relax'?'relaxation: the stress, G(t)':test==='creep'?'creep: the strain, J(t)':'stress (green), strain (cyan, scaled)'),
      xlab:'time, s',ylab:yl,xfmt:t=>sigf(t,2),yfmt:t=>sigf(t,2)});
    HIT.push({kind:'stime',b,span:S.span});
    if(test==='osc'){ const ea=Math.max(...S.xs2.map(Math.abs))||1; curve(ctx,A,ts,S.xs2.map(e=>e/ea*ymax/1.08),COL.struct,1.4,[5,3]); }
    curve(ctx,A,ts,ys,COL.pos,2);
    curve(ctx,A,[S.t,S.t],[ymin,ymax],COL.live,1.1,[3,3]);
    const yn=test==='creep'?S.now.eps:S.now.sig; if(yn>=ymin&&yn<=ymax) dot(ctx,A.X(S.t),A.Y(yn),4,COL.live,'#fff');
    /* the times this test shows: relaxation times in relaxation, retardation times in creep (a Burgers body's slow
       relaxation leaves no mark on its creep curve) */
    S.taus.forEach((t,i)=>{ if(t<S.span&&test!=='osc'&&(S.kinds[i]==='relax')===(test==='relax')){ curve(ctx,A,[t,t],[ymin,ymax],'#3a4256',1,[2,4]); lab(ctx,W,H,A.X(t)+3,b.y+4,(S.kinds[i]==='relax'?'relaxation ':'retardation ')+plain(timeS(t)),'#6f7789',SM_FONT,'left','top'); } });
  }
  if(L.bottom[0]){ const b=L.bottom[0];
    const all=S.g1.concat(S.g2).filter(v=>v>0).map(Math.log10), ylo=Math.floor(Math.max(Math.min(...all),Math.max(...all)-8)), yhi=Math.ceil(Math.max(...all));
    const A=plotAxes(ctx,b,{lo:-3,hi:3,log:true},{lo:ylo,hi:yhi,log:true},{title:titleFor(b,'G&prime; (green) and G&Prime; (orange) over frequency, Pa','G&prime;, G&Prime;','G&prime; (green), G&Prime; (orange), Pa'),xlab:'&omega;, rad/s'});
    HIT.push({kind:'sw',b});
    const lx=S.ws.map(Math.log10), p1=[], p2=[], q1=[], q2=[];
    S.ws.forEach((w,i)=>{ if(S.g1[i]>0){ p1.push(lx[i]); p2.push(Math.log10(S.g1[i])); } if(S.g2[i]>0){ q1.push(lx[i]); q2.push(Math.log10(S.g2[i])); } });
    curve(ctx,A,p1,p2,COL.pos,1.8); curve(ctx,A,q1,q2,COL.ref,1.8);
    curve(ctx,A,[Math.log10(ST.sW),Math.log10(ST.sW)],[ylo,yhi],COL.live,1.1,[3,3]);
    if(S.k==='maxwell'){ const wc=1/S.tmax; if(wc>1e-3&&wc<1e3){ dot(ctx,A.X(Math.log10(wc)),A.Y(Math.log10(S.P.E/2)),3.5,null,'#fff',1.2);
      lab(ctx,W,H,A.X(Math.log10(wc))+6,A.Y(Math.log10(S.P.E/2))+4,'G&prime; = G&Prime; at &omega;&tau; = 1','#aeb6c6',SM_FONT,'left','top',PLATE); } }
  }
  if(L.bottom[1]){ const b=L.bottom[1], A=plotAxes(ctx,b,{lo:-13,hi:6,log:true},{lo:0,hi:1},{title:titleFor(b,'the Deborah number: its times against the process','De = &tau; / t'),xlab:'time, s',yticks:[]});
    HIT.push({kind:'sT',b});
    const xT=A.X(Math.log10(ST.sTobs));
    ctx.fillStyle=rgba(COL.struct,0.08); ctx.fillRect(b.x,b.y,Math.max(0,xT-b.x),b.h);
    /* a liquid relaxes to nothing; a solid settles, softer when given the time and stiffer when not, and never flows */
    lab(ctx,W,H,b.x+4,b.y+4,S.liquid?'relaxes faster than the process (De < 1): liquid-like':'settles faster than the process (De < 1): a soft solid','#5ac8e0',SM_FONT,'left','top');
    if(b.x1-xT>150) lab(ctx,W,H,b.x1-4,b.y+4,S.liquid?'slower (De > 1): solid-like':'slower (De > 1): stiffer','#aeb6c6',SM_FONT,'right','top');
    let yk=0.8;
    for(const d of DEB_TIMES){ const x0=A.X(Math.log10(d.lo)), x1=A.X(Math.log10(d.hi));
      ctx.fillStyle=rgba(COL.ref,0.5); ctx.fillRect(x0-2,A.Y(yk)-3,Math.max(4,x1-x0+4),6);
      lab(ctx,W,H,x1+5,A.Y(yk),d.name,'#e8a86a',SM_FONT,'left','middle'); yk-=0.2; }
    for(const t of S.taus){ const x=A.X(Math.log10(t)); diamond(ctx,x,A.Y(0.2),5,COL.pos,null); }
    lab(ctx,W,H,A.X(Math.log10(S.tmax))+7,A.Y(0.2),(S.putty?'the putty: ':'this network: ')+'τ = '+plain(timeS(S.tmax)),COL.pos,SM_FONT,'left','middle',PLATE);
    curve(ctx,A,[Math.log10(ST.sTobs),Math.log10(ST.sTobs)],[0,1],COL.live,1.6);
    lab(ctx,W,H,xT-4,b.y1-4,'the process: '+plain(timeS(ST.sTobs)),COL.live,SM_FONT,'right','bottom',PLATE);
  }
  drawCaption(ctx,L);
}
/* the network, horizontal: a wall on the left, the load plate on the right moving with the strain */
function drawNetwork(ctx,W,H,b,S){
  const k=S.k, p=S.now.parts, test=ST.sTest;
  title(ctx,W,H,b,(S.putty?'the putty: ':'')+presetName(VE_LIST,k)+', '+presetName(TEST_LIST,test),presetName(VE_LIST,k));
  /* the drawing's scale: the largest total strain the test reaches spans a third of the width */
  const emax=Math.max(...S.ts.map(t=>Math.abs(veState(k,S.P,test,t,1,ST.sW).eps)))||1;
  /* under oscillation the strain swings both ways: the network sits at half the box and swings a fifth of it either
     way; a step of strain or stress only lengthens it */
  const osc=test==='osc', x0=b.x+14, base=(b.w-40)*(osc?0.5:0.42), gain=(b.w-40)*(osc?0.2:0.33)/emax, yc=b.y+b.h*0.5;
  ctx.fillStyle='#2a2f3d'; ctx.fillRect(x0-8,yc-60,8,120);
  for(let i=0;i<8;i++){ ctx.strokeStyle='#3a4256'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x0-8,yc-60+i*15+15); ctx.lineTo(x0-16,yc-60+i*15+5); ctx.stroke(); }
  const X=x=>x0+x, len=e=>e*gain;
  let xe;
  if(k==='maxwell'){ const a=base*0.5+len(p.spring), bb=a+base*0.5+len(p.dash);
    springPx(ctx,X(0),X(a),yc,9,COL.spring); dashPx(ctx,X(a),X(bb),yc,11,COL.dash,base*0.4); xe=bb; }
  else if(k==='kelvin'){ const e=base+len(p.kel);
    ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(X(0),yc-24); ctx.lineTo(X(0),yc+24); ctx.moveTo(X(e),yc-24); ctx.lineTo(X(e),yc+24); ctx.stroke();
    springPx(ctx,X(0),X(e),yc-24,8,COL.spring); dashPx(ctx,X(0),X(e),yc+24,10,COL.dash,base*0.55); xe=e; }
  else if(k==='sls'){ const e=base+len(p.arm), a=base*0.45+len(p.spring2);
    ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(X(0),yc-28); ctx.lineTo(X(0),yc+28); ctx.moveTo(X(e),yc-28); ctx.lineTo(X(e),yc+28); ctx.stroke();
    springPx(ctx,X(0),X(e),yc-28,8,COL.spring); springPx(ctx,X(0),X(a),yc+28,8,COL.spring); dashPx(ctx,X(a),X(e),yc+28,10,COL.dash,base*0.3); xe=e; }
  else { const a=base*0.3+len(p.spring), bb=a+base*0.3+len(p.dash), e=bb+base*0.4+len(p.kel);
    springPx(ctx,X(0),X(a),yc,9,COL.spring); dashPx(ctx,X(a),X(bb),yc,11,COL.dash,base*0.25);
    ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(X(bb),yc-20); ctx.lineTo(X(bb),yc+20); ctx.moveTo(X(e),yc-20); ctx.lineTo(X(e),yc+20); ctx.stroke();
    springPx(ctx,X(bb),X(e),yc-20,7,COL.spring); dashPx(ctx,X(bb),X(e),yc+20,9,COL.dash,base*0.25); xe=e; }
  ctx.fillStyle='#cfd4de'; ctx.fillRect(X(xe),yc-34,6,68);
  const sg=S.now.sig, fl=clamp(Math.abs(sg)/(Math.max(...S.ys.map(Math.abs))||1),0,1)*Math.min(70,b.x1-X(xe)-20);
  if(fl>3) arrowPx(ctx,X(xe)+8,yc,X(xe)+8+fl*(sg>=0?1:-1),yc,COL.live,2);
  lab(ctx,W,H,b.x+8,b.y1-6,'spring: stores     dashpot: flows','#8b93a6',SM_FONT,'left','bottom');
  lab(ctx,W,H,b.x1-8,b.y1-6,'the load: '+sigf(sg,3)+' Pa',COL.live,SM_FONT,'right','bottom');
}

/* ---- the jam ---- */
function drawJam(ctx,W,H,M){
  const J=M.J, S=J.S, u=S.units;
  const capFull='Grains in a liquid: at low stress lubricating films keep them apart and the suspension flows like a thick liquid; pressed harder, a growing fraction of the contacts turns frictional (bright lines) and the packing at which the grains jam falls, from φ₀ to φ₁. The flow curves (stress against rate, log axes) turn back into an S from φ = '+fmt(J.dst,3)+' on: under a set rate the flow jumps between the lower and upper branches, and past φ₁ it jams outright. Below: the phase diagram, and the viscosity against stress at this packing.';
  const capShort='Grains in a liquid: pressed harder, their contacts turn frictional and they thicken, then jam. Log axes.';
  const L=fluidLayout(ctx,W,H,capFull,capShort,2,0.33);
  const sp=splitMain(L.main,0.32,74);
  if(sp.pic) drawGrains(ctx,W,H,sp.pic,J);
  /* the flow curves */
  { const b=sp.plot, xlo=u?-3:-6, xhi=u?5:3, ylo=u?-2:-3, yhi=u?4:3;
    const A=plotAxes(ctx,b,{lo:xlo,hi:xhi,log:true},{lo:ylo,hi:yhi,log:true},{title:titleFor(b,'the flow curves: stress against rate'+(u?', Pa and s&minus;&sup1;':''),'&sigma;(&gamma;&#775;)'),xlab:u?'shear rate, s&minus;&sup1;':'shear rate (&lambda; = 1)',ylab:u?'stress, Pa':'stress'});
    HIT.push({kind:'jsig',b,ylo,yhi});
    for(const f of J.fam) curve(ctx,A,f.c.xs,f.c.ys,'#3a4256',1.1);
    curve(ctx,A,J.cur.xs,J.cur.ys,COL.pos,2.2);
    if(isFinite(J.sJ)&&J.sJ>0){ const y=Math.log10(J.sJ); curve(ctx,A,[xlo,xhi],[y,y],COL.ref,1.1,[5,4]); lab(ctx,W,H,A.X(xhi)-4,A.Y(y)-3,'it jams here','#e8843a',SM_FONT,'right','bottom',PLATE); }
    J.turn.forEach((s,i)=>{ const g=J.rates[i]; if(g>0) diamond(ctx,A.X(Math.log10(g)),A.Y(Math.log10(s)),5,COL.live,'#fff'); });
    const ys=Math.log10(J.sig); curve(ctx,A,[xlo,xhi],[ys,ys],COL.live,1,[3,3]);
    if(J.g>0) dot(ctx,A.X(Math.log10(J.g)),A.Y(ys),4,COL.live,'#fff');
    if(ST.jPlay&&J.ramp.g>0) dot(ctx,A.X(Math.log10(J.ramp.g)),A.Y(Math.log10(J.ramp.s)),5,'#fff',COL.live,2);
    lab(ctx,W,H,A.X(xlo)+6,A.Y(yhi)+6,'grey: φ from '+fmt(JAM_FAM[S.id][0],3)+' (right) to '+fmt(JAM_FAM[S.id][JAM_FAM[S.id].length-1],3)+' (left); green: φ = '+fmt(J.phi,3),'#8b93a6',SM_FONT,'left','top');
  }
  if(L.bottom[0]){ const b=L.bottom[0], P=J.ph, xlo=S.id==='starch'?0.30:0.50, xhi=S.phi0+0.005, ylo=u?-2:-3, yhi=u?4:3;
    const A=plotAxes(ctx,b,{lo:xlo,hi:xhi},{lo:ylo,hi:yhi,log:true},{title:titleFor(b,'the phase diagram: packing and stress','the phases'),xlab:'&phi;',xfmt:t=>fmt(t,2)});
    HIT.push({kind:'jphase',b,xlo,xhi,ylo,yhi});
    /* the shear-jammed region above the jamming line, and the unstable band between the turning stresses */
    ctx.fillStyle=rgba(COL.ref,0.10); ctx.beginPath(); let first=true;
    for(const [ph,s] of P.jl){ const X=A.X(ph), Y=A.Y(clamp(Math.log10(s),ylo,yhi)); if(first){ ctx.moveTo(X,A.Y(yhi)); ctx.lineTo(X,Y); first=false; } else ctx.lineTo(X,Y); }
    if(!first){ ctx.lineTo(A.X(xhi),A.Y(ylo)); ctx.lineTo(A.X(xhi),A.Y(yhi)); ctx.closePath(); ctx.fill(); }
    curve(ctx,A,P.lo.map(q=>q[0]),P.lo.map(q=>Math.log10(q[1])),COL.live,1.4);
    curve(ctx,A,P.hi.map(q=>q[0]),P.hi.map(q=>Math.log10(q[1])),COL.live,1.4);
    curve(ctx,A,P.jl.map(q=>q[0]),P.jl.map(q=>Math.log10(q[1])),COL.ref,1.8);
    for(const [ph,nm] of [[J.dst,'φ_DST'],[S.phi1,'φ₁'],[S.phi0,'φ₀']]){ curve(ctx,A,[ph,ph],[ylo,yhi],'#3a4256',1,[3,3]);
      lab(ctx,W,H,A.X(ph)+2,b.y+3,nm.replace('_DST',' DST'),'#8b93a6',SM_FONT,'left','top'); }
    dot(ctx,A.X(J.phi),A.Y(clamp(Math.log10(J.sig),ylo,yhi)),4,COL.live,'#fff');
    lab(ctx,W,H,A.X(xlo)+4,A.Y(ylo)-4,'flowing, near-Newtonian','#8b93a6',SM_FONT,'left','bottom');
    lab(ctx,W,H,A.X(xhi)-4,A.Y(yhi)+16,'jammed','#e8843a',SM_FONT,'right','top');
  }
  if(L.bottom[1]){ const b=L.bottom[1], xs=[], ys=[];
    for(let i=0;i<=200;i++){ const s=S.sstar*Math.pow(10,-3+6*i/200), g=jamRate(S,s,J.phi); if(!(g>0)) break; xs.push(Math.log10(s)); ys.push(Math.log10(s/g)); }
    const all=ys.concat([Math.log10(J.eta0)].concat(isFinite(J.eta1)?[Math.log10(J.eta1)]:[]));
    const ylo=Math.floor(Math.min(...all)-0.3), yhi=Math.ceil(Math.min(Math.max(...all),Math.min(...all)+7)+0.3);
    const A=plotAxes(ctx,b,{lo:Math.log10(S.sstar)-3,hi:Math.log10(S.sstar)+3,log:true},{lo:ylo,hi:yhi,log:true},{title:titleFor(b,'the viscosity against stress'+(u?', Pa s':''),'&eta;(&sigma;)'),xlab:u?'stress, Pa':'stress'});
    curve(ctx,A,[A.x.lo,A.x.hi],[Math.log10(J.eta0),Math.log10(J.eta0)],COL.newt,1,[4,4]);
    if(isFinite(J.eta1)) curve(ctx,A,[A.x.lo,A.x.hi],[Math.log10(J.eta1),Math.log10(J.eta1)],COL.ref,1,[4,4]);
    curve(ctx,A,xs,ys,COL.pos,2);
    lab(ctx,W,H,A.b.x+4,A.Y(Math.log10(J.eta0))-3,'frictionless','#8fb8d4',SM_FONT,'left','bottom');
    if(isFinite(J.eta1)) lab(ctx,W,H,A.b.x1-4,A.Y(Math.log10(J.eta1))-3,'frictional','#e8a86a',SM_FONT,'right','bottom');
  }
  drawCaption(ctx,L);
}
/* the grains: a jittered triangular packing whose spacing follows phi; contacts where two grains nearly touch,
   the first round(f N) of them in a fixed random order drawn frictional */
function drawGrains(ctx,W,H,b,J){
  const S=J.S, f=ST.jPlay?jamF(S,J.ramp.s):J.f;
  title(ctx,W,H,b,'the grains, &phi; = '+fmt(J.phi,3));
  const rnd=mulberry32(1311), gap=clamp((S.phi0-J.phi)/(S.phi0-(S.id==='starch'?0.30:0.50)),0.02,1);
  const r=Math.min(b.w,b.h)/22, d=2*r*(1+0.35*gap), cols=Math.floor((b.w-2*r)/d), rows=Math.floor((b.h-60)/(d*0.866));
  const pts=[];
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ const x=b.x+r+i*d+(j%2?d/2:0)+(rnd()-0.5)*d*0.12, y=b.y+34+r+j*d*0.866+(rnd()-0.5)*d*0.12; if(x<b.x1-r) pts.push([x,y]); }
  const con=[];
  for(let a=0;a<pts.length;a++) for(let c=a+1;c<pts.length;c++){ const dd=Math.hypot(pts[a][0]-pts[c][0],pts[a][1]-pts[c][1]); if(dd<d*1.08) con.push([a,c,rnd()]); }
  con.sort((p,q)=>p[2]-q[2]);
  const nf=Math.round(f*con.length);
  for(const [x,y] of pts) dot(ctx,x,y,r*0.92,'#3a4256','#6f7789',0.8);
  con.forEach(([a,c],i)=>{ ctx.beginPath(); ctx.moveTo(pts[a][0],pts[a][1]); ctx.lineTo(pts[c][0],pts[c][1]);
    ctx.strokeStyle=i<nf?'rgba(247,228,107,0.95)':'rgba(90,200,224,0.35)'; ctx.lineWidth=i<nf?2.6:0.9; ctx.stroke(); });
  lab(ctx,W,H,b.x+6,b.y1-4,'frictional contacts: '+fmt(100*f,0)+' %','#f7e46b',SM_FONT,'left','bottom');
}

/* ---- the gel ---- */
function drawGel(ctx,W,H,M){
  const G=M.G, loop=ST.gProt==='loop';
  const capFull='A gel’s network (drawn: the bonds still intact, a fraction λ of them) breaks under shear faster than it rebuilds, and rebuilds at rest. '+(loop?'Ramped up and down again, it carries more stress on the way up than on the way down: the loop encloses the structure it lost.':'Its stress and viscosity follow the structure in time.')+' The model is the Houska structural kinetics Liu et al. fitted to a kerosene gel (Gels 2023)'+(!loop?', which covered 75–1200 s⁻¹':ST.gMax>HK_FIT[0]?'; the band marks the rates the fit covered (75–1200 s⁻¹); the dashed curve is the steady state':'; the fit covered 75–1200 s⁻¹, above this whole loop; the dashed curve is the steady state')+'. '+(ST.gSpeed>1?'The run is played faster than real time (×'+sigf(ST.gSpeed,2)+').':'The run is played in real time.');
  const capShort='A thixotropic gel: its network breaks under shear and rebuilds at rest. '+(ST.gSpeed>1?'The run plays ×'+sigf(ST.gSpeed,2)+' real time.':'The run plays in real time.');
  const L=fluidLayout(ctx,W,H,capFull,capShort,2,0.32);
  const sp=splitMain(L.main,0.3,74);
  if(sp.pic) drawGelNet(ctx,W,H,sp.pic,G);
  { const b=sp.plot;
    if(loop){ const gm=ST.gMax, tm=Math.max(...G.run.tau)*1.08;
      const A=plotAxes(ctx,b,{lo:0,hi:gm},{lo:0,hi:tm},{title:titleFor(b,'the loop: stress against rate, up and back','&tau;(&gamma;&#775;)'),xlab:'shear rate, s&minus;&sup1;',ylab:'stress, Pa',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
      const xa=A.X(clamp(HK_FIT[0],0,gm)), xb=A.X(clamp(HK_FIT[1],0,gm)); ctx.fillStyle=rgba(COL.struct,0.06); ctx.fillRect(xa,b.y,xb-xa,b.h);
      const xs=[], ys=[]; for(let i=0;i<=120;i++){ const g=gm*i/120; xs.push(g); ys.push(hkTauSS(g)); } curve(ctx,A,xs,ys,'#8b93a6',1.2,[5,4]);
      curve(ctx,A,G.run.g,G.run.tau,COL.pos,2);
      dot(ctx,A.X(G.g),A.Y(G.tau),4,COL.live,'#fff');
      lab(ctx,W,H,A.X(gm*0.55),A.Y(hkTauSS(gm*0.55))+6,'steady state','#8b93a6',SM_FONT,'left','top',PLATE);
    } else { const em=Math.max(...G.run.tau.map((t,i)=>G.run.g[i]>0?t/G.run.g[i]:0))*1.08||1;
      const A=plotAxes(ctx,b,{lo:0,hi:G.span},{lo:0,hi:em},{title:titleFor(b,'the viscosity in time, Pa s','&eta;(t)'),xlab:'time, s',ylab:'viscosity, Pa s',xfmt:t=>fmt(t,0),yfmt:t=>sigf(t,2)});
      const xs=[], ys=[]; G.run.t.forEach((t,i)=>{ if(G.run.g[i]>0){ xs.push(t); ys.push(G.run.tau[i]/G.run.g[i]); } });
      curve(ctx,A,xs,ys,COL.pos,2);
      curve(ctx,A,[G.t,G.t],[0,em],COL.live,1.1,[3,3]);
      if(G.g>0) dot(ctx,A.X(G.t),A.Y(G.eta),4,COL.live,'#fff');
      else lab(ctx,W,H,A.X(G.t)+4,b.y+14,'at rest: no rate, no viscosity to show','#8b93a6',SM_FONT,'left','top',PLATE); }
    HIT.push({kind:'gtime',b,span:G.span,loop});
  }
  if(L.bottom[0]){ const b=L.bottom[0], A=plotAxes(ctx,b,{lo:0,hi:G.span},{lo:0,hi:1.05},{title:titleFor(b,'the network intact, &lambda;(t)','&lambda;(t)'),xlab:'time, s',xfmt:t=>fmt(t,0),yticks:[0,0.5,1]});
    HIT.push({kind:'gtime',b,span:G.span});
    curve(ctx,A,G.run.t,G.run.lam,COL.pos,2); curve(ctx,A,[G.t,G.t],[0,1.05],COL.live,1.1,[3,3]); dot(ctx,A.X(G.t),A.Y(G.lam),4,COL.live,'#fff'); }
  if(L.bottom[1]){ const b=L.bottom[1], gm=Math.max(...G.run.g)*1.08||1, A=plotAxes(ctx,b,{lo:0,hi:G.span},{lo:0,hi:gm},{title:titleFor(b,'the shear rate it is driven at, s&minus;&sup1;','&gamma;&#775;(t)'),xlab:'time, s',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    HIT.push({kind:'gtime',b,span:G.span});
    curve(ctx,A,G.run.t,G.run.g,COL.struct,1.8); curve(ctx,A,[G.t,G.t],[0,gm],COL.live,1.1,[3,3]); }

}
/* the network: nodes on a jittered grid in the gap, bonds to their neighbours; the fraction lambda of bonds intact is
   drawn, chosen by a fixed random order (so a bond breaks once and stays broken until the structure returns) */
function drawGelNet(ctx,W,H,b,G){
  title(ctx,W,H,b,'the network, &lambda; = '+fmt(100*G.lam,0)+' % intact');
  const rnd=mulberry32(2023), nx=9, ny=7, x0=b.x+14, y0=b.y+40, dx=(b.w-28)/(nx-1), dy=(b.h-90)/(ny-1);
  ctx.fillStyle='#3a4256'; ctx.fillRect(b.x+4,y0-16,b.w-8,6); ctx.fillStyle='#2a2f3d'; ctx.fillRect(b.x+4,y0+(ny-1)*dy+10,b.w-8,6);
  const pts=[]; for(let j=0;j<ny;j++) for(let i=0;i<nx;i++) pts.push([x0+i*dx+(rnd()-0.5)*dx*0.4,y0+j*dy+(rnd()-0.5)*dy*0.4]);
  const bonds=[]; for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const k=j*nx+i; if(i<nx-1) bonds.push([k,k+1,rnd()]); if(j<ny-1) bonds.push([k,k+nx,rnd()]); if(i<nx-1&&j<ny-1) bonds.push([k,k+nx+1,rnd()]); }
  for(const [a,c,q] of bonds){ if(q>=G.lam) continue; ctx.beginPath(); ctx.moveTo(pts[a][0],pts[a][1]); ctx.lineTo(pts[c][0],pts[c][1]); ctx.strokeStyle='rgba(159,216,232,0.75)'; ctx.lineWidth=1.3; ctx.stroke(); }
  for(const [x,y] of pts) dot(ctx,x,y,2.6,'#cfd4de',null);
  if(G.g>0) arrowPx(ctx,b.x+b.w*0.35,y0-24,b.x+b.w*0.35+clamp(12+10*Math.log10(G.g),8,80),y0-24,COL.live,1.8);
  lab(ctx,W,H,b.x+6,b.y1-4,G.g>0?'sheared at '+plain(rateS(G.g)):'at rest: the bonds re-form','#aeb6c6',SM_FONT,'left','bottom');
}

 *  the dispatch, the pointer, the scene                               *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='rheo') drawRheo(ctx,W,H,M);
  else if(M.view==='pipe') drawPipe(ctx,W,H,M);
  else if(M.view==='cavity') drawCavity(ctx,W,H,M);
  else if(M.view==='springs') drawSprings(ctx,W,H,M);
  else if(M.view==='jam') drawJam(ctx,W,H,M);
  else drawGel(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  function setFrom(hit,x,y){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1), w=clamp((hit.b.y+hit.b.h-y)/hit.b.h,0,1);
    if(hit.kind==='rrate'){ ST.rRate=clamp(Math.pow(10,RH_LG[0]+(RH_LG[1]-RH_LG[0])*u),LIM.rate[0],LIM.rate[1]); return true; }
    if(hit.kind==='pG'){ ST.pG=clamp(Math.pow(10,1+5*u),LIM.pG[0],LIM.pG[1]); return true; }
    if(hit.kind==='sw'){ ST.sW=clamp(Math.pow(10,-3+6*u),LIM.sW[0],LIM.sW[1]); return true; }
    if(hit.kind==='sT'){ ST.sTobs=clamp(Math.pow(10,-13+19*u),LIM.sTobs[0],LIM.sTobs[1]); return true; }
    if(hit.kind==='stime'){ SIM.sT=hit.span*u; ST.sPlay=false; return true; }
    if(hit.kind==='jsig'){ const s=Math.pow(10,hit.ylo+(hit.yhi-hit.ylo)*w); if(ST.jSet==='starch') ST.jSigS=clamp(s,LIM.jSigS[0],LIM.jSigS[1]); else ST.jSigW=clamp(s,LIM.jSigW[0],LIM.jSigW[1]); return true; }
    if(hit.kind==='jphase'){ const ph=hit.xlo+(hit.xhi-hit.xlo)*u, s=Math.pow(10,hit.ylo+(hit.yhi-hit.ylo)*w);
      if(ST.jSet==='starch'){ ST.jPhiS=clamp(ph,LIM.jPhiS[0],LIM.jPhiS[1]); ST.jSigS=clamp(s,LIM.jSigS[0],LIM.jSigS[1]); }
      else { ST.jPhiW=clamp(ph,LIM.jPhiW[0],LIM.jPhiW[1]); ST.jSigW=clamp(s,LIM.jSigW[0],LIM.jSigW[1]); } return true; }
    if(hit.kind==='gtime'){ if(hit.loop) return false; SIM.gT=hit.span*u; ST.gPlay=false; return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; }
      DRAG.what=hit; return setFrom(hit,x,y); }
    if(type==='move'){ if(!DRAG.what) return false; return setFrom(DRAG.what,x,y); }
    DRAG.what=null; return false;
  };
  return S;
}

 *  boot — panel, tabs, handlers, frame loop                           *

function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg,map){
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',{html:lab}),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });

const INFO={
  rheo:'Water and honey are <b>Newtonian</b>: stir them faster and the stress rises in proportion, so one number, the viscosity, describes each at a given temperature. Most everyday fluids are not. <b>Blood</b> thins as it is sheared faster, from '+plain(visc(PX.bl1))+' at 1 s<sup>&minus;1</sup> to '+plain(visc(PX.bl100))+' at 100 s<sup>&minus;1</sup> in the fit shown. A <b>ketchup</b> base has a <b>yield stress</b>: below about 64 Pa it does not flow at all, and above it, it thins. <b>Cornstarch</b> in water does the opposite and thickens. A <b>rheometer</b> shears a thin layer of the sample at a set rate and measures the stress it takes; the result, over every rate, is the fluid&rsquo;s <b>flow curve</b>.',
  pipe:'Pressure pushes the fluid along a pipe and the wall holds it back, and in steady flow the shear stress rises in a straight line from zero on the axis to G R/2 at the wall, whatever the fluid. A Newtonian fluid answers with a parabola (Poiseuille&rsquo;s law). A thinning fluid, thinnest where it is sheared hardest, runs flatter in the middle and steeper at the wall; a thickening one comes to a point. A fluid with a <b>yield stress</b> cannot shear where the stress is below it, so the middle of the pipe moves as a solid <b>plug</b>: at the defaults, the ketchup base&rsquo;s plug fills '+fmt(100*PX.ketPlug,0)+' % of the radius, and below '+plain(gradS(PX.ketGc))+' nothing moves at all.',
  cavity:'A square box of fluid whose lid slides sideways drags the fluid round into a vortex: the <b>lid-driven cavity</b>, the classic test of a flow solver. Here it is solved live by the <b>lattice-Boltzmann</b> method. Populations of fictitious particles hop from node to node and collide, and their averages obey the Navier&ndash;Stokes equations; each node takes the viscosity its own shear rate asks for, so the same solver runs any of these fluids. '+(PX.c100?'At Re 100 on the 64 &times; 64 grid its centreline velocities come within '+g4(Math.max(PX.c100.du,PX.c100.dv))+' of the lid speed of Ghia, Ghia and Shin&rsquo;s at every one of their 34 points. ':'')+'A thinning fluid runs thinnest near the lid, where it is sheared fastest; a <b>Bingham</b> plastic stops moving where the stress falls below its yield stress'+(PX.bing?' ('+fmt(100*PX.bing.unyield,0)+' % of the box at Bn 10)':'')+', and its unyielded regions move as rigid solids: at Bn 10 a dead zone at rest on the floor and, under the vortex&rsquo;s centre, a crescent that turns as one piece.',
  springs:'A solid springs back and a liquid flows. Many materials do both, and which one you see depends on how long you watch. A <b>bouncing putty</b> is the classic: it bounces when dropped, and given enough time it forms a puddle (Wikipedia, Silly Putty). Its polymer relaxes in about a second (1.1 s for the one measured here), so anything much faster than that sees a solid and anything much slower sees a liquid. The ratio of the two times is the <b>Deborah number</b>. Water relaxes in about 10<sup>&minus;12</sup> s, so to anything we do it is a liquid. The four networks of springs and dashpots are the simplest models of this. Two are liquids, Maxwell&rsquo;s and Burgers&rsquo;, whose dashpot in series flows for as long as it is pushed; the other two, the Kelvin&ndash;Voigt body and the standard linear solid, are solids, whose springs hold in the end: soft when given the time, stiffer when not. The plots are their exact responses to a step of strain (relaxation), a step of stress (creep) and a steady oscillation.',
  jam:'<b>Cornstarch in water</b> (oobleck) flows like a thick liquid when stirred gently, '+plain(visc(PX.sEta0))+' at &phi; = 0.40 in the fit, yet acts in counterintuitive ways when struck (Wikipedia, Dilatant). It is a dense suspension of grains. At low stress, thin films of water between the grains keep them apart and they slide past each other; pressed hard, the films give way, the grains touch and grip, and a packing that flowed can jam. The <b>Wyart&ndash;Cates</b> model makes this one equation: the packing at which the suspension jams falls from &phi;<sub>0</sub> (grains that slide) to &phi;<sub>1</sub> (grains that grip) as the stress rises. With the fit made to cornstarch, the flow curve turns back into an S from &phi;<sub>DST</sub> = '+fmt(PX.sDST,3)+': forced at a set rate, the flow jumps from the thin branch to the thick one, <b>discontinuous shear thickening</b>. Past &phi;<sub>1</sub> = 0.385 it jams outright above a certain stress ('+fmt(PX.sTJ,1)+' Pa at &phi; = 0.405).',

/* ================================================================== *
 *  makeShot: the recording context the selfTest draws into (build_aa   *
 *  lineage): every text with its box, every stroke with its path.      *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null, path=[], cur=null;       /* a stroke keeps its path, in canvas pixels */
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:''+ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle,paths:path.map(p=>p.slice())}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

  const stSave=Object.assign({},ST);
  function withState(over,fn){ Object.assign(ST,DEFAULTS,over); simReset(); SIM.lbm=null; SIM.lbmKey='';
    for(const k in MEMO) delete MEMO[k];

  /* ---------- 0. the shared helpers ---------- */
  ok(plain('&Delta;V &omega; &#955; &frac58;')==='ΔV ω λ &frac58;','plain() decodes named and numeric entities and passes unknown ones through');
  ok(ticksFor(0.8,0.2,5).length===1&&ticksFor(0.2,0.8,5).length>=3,'ticksFor collapses an inverted range (axes() sorts it first)');

  eq(decLab(-3),'10⁻³','decLab(-3)'); eq(decLab(0),'1','decLab(0)'); eq(decLab(1),'10','decLab(1)'); eq(decLab(12),'10¹²','decLab(12)');
  ok(JSON.stringify(decTicks(-3,4,20))==='[-3,-2,-1,0,1,2,3,4]'&&decTicks(-13,6,6).length<=6,'decTicks: every decade, thinned to the room');
  { let prev=-1, mono=true; for(let i=0;i<=40;i++){ const L=okL(seqCol(i/40)); if(L<=prev) mono=false; prev=L; } ok(mono,'the sequential ramp rises in lightness all the way'); }
  { let mono=true; for(let i=1;i<=20;i++) if(okL(signCol(i/20))<=okL(signCol((i-1)/20))||okL(signCol(-i/20))<=okL(signCol(-(i-1)/20))) mono=false;
    ok(mono,'the signed ramp darkens toward zero on both sides'); eq(signCol(0),'rgb(7,11,24)','zero is the background'); }
  { let s=0; for(let i=0;i<16;i++) s+=GL16.w[i]*Math.pow(GL16.x[i],30); rel(s,2/31,1e-13,'16-point Gauss-Legendre is exact for x^30');
    let w=0; for(let i=0;i<16;i++) w+=GL16.w[i]; rel(w,2,1e-15,'its weights sum to 2'); }
  /* marching squares on a circle: every segment end lies on the level set (bilinear between nodes), and the length of
     the contour approaches the circumference */
  { const n=40, F=new Float64Array(n*n); for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const x=i+0.5-20, y=j+0.5-20; F[i*n+j]=x*x+y*y; }
    const sg=contourSegs(F,n,n,144); let len=0, worst=0;
    for(let q=0;q<sg.length;q+=4){ len+=Math.hypot(sg[q+2]-sg[q],sg[q+3]-sg[q+1]); worst=Math.max(worst,Math.abs(Math.hypot(sg[q]-20,sg[q+1]-20)-12)); }
    rel(len,2*PI*12,0.01,'contours: a circle of radius 12 cells comes out '+len.toFixed(3)+' long (2 pi r = 75.398)');
    ok(worst<0.06,'contours: every segment end within 0.06 cells of the circle ('+worst.toFixed(4)+')');
    const sg2=contourSegs(F,n,n,-1); eq(sg2.length,0,'contours: a level no cell straddles has no segments'); }

    for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
      const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
      if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
    ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
    let leg=null;
    for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
      const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
      if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
      leg='a curve crosses the legend'; break; }
    ok(!leg,nm+' '+W+'x'+H+' legend clear');
    if(W>=900){ const u=texts.find(t=>t.bb[2]>W-317&&t.bb[1]<470); ok(!u,nm+' '+W+'x'+H+' nothing under the readout'+(u?' ("'+u.t.slice(0,30)+'")':'')); }
    /* the gel's caption names only what its plot draws: the fit's band where the loop reaches it, the dashed steady
       state in the loop (elsewhere the dashed line is the time cursor), a speed-up only when there is one */
    if(over.view==='gel'){ const capT=texts.map(t=>t.t).join(' '), full=capT.indexOf('A gel’s network')>=0, loop=ST.gProt==='loop';
      ok(full||capT.indexOf('A thixotropic gel:')>=0,nm+' '+W+'x'+H+': one of the gel\'s two captions is drawn');
      if(full){ ok((capT.indexOf('the band marks')>=0)===(loop&&ST.gMax>HK_FIT[0]),nm+' '+W+'x'+H+': the caption names the band only where the loop draws it');
        ok((capT.indexOf('dashed curve')>=0)===loop,nm+' '+W+'x'+H+': the caption names the dashed curve only in the loop'); }
      ok(ST.gSpeed>1?capT.indexOf('×'+sigf(ST.gSpeed,2)+(full?')':' real'))>=0&&capT.indexOf('in real time')<0:capT.indexOf('in real time')>=0&&capT.indexOf('faster than real time')<0&&capT.indexOf('plays ×')<0,
        nm+' '+W+'x'+H+': the caption\'s speed-up is the slider\'s ('+sigf(ST.gSpeed,2)+')'); }
    /* the springs' plots name their curves' colours at the page's size (the long titles fall back below 1400 px) */
    if(over.view==='springs'&&W>=1100){ ok(ST.sTest!=='osc'||texts.some(t=>t.t.indexOf('stress (green)')>=0),nm+' '+W+'x'+H+': the response names its stress and strain');
      ok(texts.some(t=>t.t.indexOf('G′ (green)')>=0),nm+' '+W+'x'+H+': the moduli name G′ and G″'); }
    /* the rheometer's labels stay inside its picture's box (the plate's label once ran to the canvas edge) */
    if(over.view==='rheo'&&W>=900){ const pl=texts.find(t=>t.t.indexOf('top plate:')===0); ok(!!pl&&pl.bb[0]>=50,nm+' '+W+'x'+H+': the plate\'s label starts inside the picture'); }
  });
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));
  /* the Deborah strip names its sides the right way round: the shaded side (relaxation times shorter than the process)
     is the liquid-like one */
  withState({view:'springs'},()=>{ const c=makeShot(1400,820); drawView(c,1400,820,buildModel()); const tx=c.ops.filter(o=>o.op==='text').map(o=>o.t);
    ok(tx.some(t=>/faster than the process \(De < 1\): liquid-like/.test(t))&&!tx.some(t=>/faster.*solid/.test(t)),'the Deborah strip: faster than the process is liquid-like'); });
  /* the Deborah strip calls only a liquid liquid-like, and each time plot marks the kind of time its test shows */
  for(const [k,test] of [['maxwell','relax'],['maxwell','creep'],['kelvin','creep'],['kelvin','relax'],['sls','relax'],['sls','creep'],['burgers','relax'],['burgers','creep']])
    withState({view:'springs',sPutty:'none',sModel:k,sTest:test},()=>{ const c=makeShot(1400,820); drawView(c,1400,820,buildModel()); const tx=c.ops.filter(o=>o.op==='text').map(o=>o.t), M=springsModel(ST);
      ok(tx.some(t=>/liquid-like/.test(t))===veLiquid(k)&&tx.some(t=>/a soft solid/.test(t))===!veLiquid(k),k+': the Deborah strip calls it '+(veLiquid(k)?'liquid-like when relaxed':'a soft solid when settled'));
      const want=M.taus.filter((t,i)=>t<M.span&&(M.kinds[i]==='relax')===(test==='relax')).length, got=tx.filter(t=>/^(relaxation|retardation) \d/.test(t));
      ok(got.length===want&&got.every(t=>t.indexOf(test==='relax'?'relaxation':'retardation')===0),k+' '+test+': the plot marks its '+want+' '+(test==='relax'?'relaxation':'retardation')+' time(s) and no other ('+got.join(', ')+')'); });
  /* the pipe's viscosity plot draws the yielded fluid (its range is not set by the plug's unbounded viscosity) */
  for(const pm of ['ketchup','bloodc','blood','water']) withState({view:'pipe',pMat:pm},()=>{ const c=makeShot(1400,820); drawView(c,1400,820,buildModel());
    const L=stageLayout(c,1400,820,'x','x',3,0.34,nbNarrow(820)); const b=L.bottom[1]; let n=0;
    for(let i=0;i<POLY_SEGS.length;i+=4){ const x=POLY_SEGS[i], y=POLY_SEGS[i+1]; if(x>=b.x&&x<=b.x1&&y>=b.y&&y<=b.y1) n++; }
    ok(n>20,'the pipe, '+pm+': the viscosity across the pipe is drawn ('+n+' segments)'); });
  /* a long run's record: the step ticks do not collide */
  withState({view:'cavity'},()=>{ const L=cavEnsure(ST); L.steps=420000; SIM.hist=[]; for(let i=1;i<=500;i++) SIM.hist.push([i*840,Math.pow(10,-1-10*i/500)]);
    for(const [W,H] of SIZES){ const c=makeShot(W,H); drawView(c,W,H,buildModel()); const t=c.ops.filter(o=>o.op==='text'); let hit=null;
      for(let i=0;i<t.length&&!hit;i++) for(let j=i+1;j<t.length;j++){ const a=t[i].bb,bb=t[j].bb; if(Math.min(a[2],bb[2])-Math.max(a[0],bb[0])>0.5&&Math.min(a[3],bb[3])-Math.max(a[1],bb[1])>0.5){ hit=t[i].t+' / '+t[j].t; break; } }
      ok(!hit,'cavity after 420k steps, '+W+'x'+H+': no text collides ('+(hit||'ok')+')'); } });

  console.log(pass+' passed, '+fail+' failed ('+(Date.now()-T0)+' ms)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
