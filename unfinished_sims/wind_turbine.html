<title>Wind tunnel — the walls are in the answer</title>
<!--
  A WIND TUNNEL DOES NOT MEASURE FREE AIR.

  Put a rotor in a closed test section and the walls will not let its wake
  expand.  The bypass flow between wake and wall must therefore accelerate, its
  static pressure falls, and that suction pulls MORE mass through the disc than
  the same rotor would swallow in the open.  The tunnel reads high.  Every
  number a wind-tunnel rotor test produces is a number about the tunnel until
  the blockage is taken out of it, and this sim is about that correction and
  about the blade design it distorts.

  THE RESULT THIS FILE IS BUILT AROUND.  For an actuator disc of area A in a
  closed section of area C, with blockage B = A/C, the ceiling on the power
  coefficient is not Betz's 16/27 but

        CP_max(B)  =  (16/27) (1 - B)^-2                                  (*)

  and the loading that achieves it is not a = 1/3 but

        a*(B)      =  (1 + 3B) / (3 (1 + B))                              (**)

  Both are EXACT, not small-B expansions, and both are derived here rather than
  quoted.  Writing the duct momentum balance, the bypass Bernoulli and the two
  continuity statements, eliminating the wake area and the bypass speed, and
  deflating the trivial unloaded root w = 1 leaves one clean monic cubic in the
  wake speed ratio w = U_wake/U_0:

        w^3 + [1 - 2(1-a)(1+B)] w^2 + 3B(1-a)^2 w - B(1-a)^2  =  0        (***)

  At B = 0 it degenerates to w^2 (w - (1-2a)) = 0 and hands back the classical
  actuator disc, U_wake = U_0(1-2a), exactly.  selfTest solves (***) and checks
  (*) and (**) against it over B = 0.001 .. 0.5 -- agreement is 1e-15 relative,
  i.e. these are identities of the model and not fits.  It also checks that the
  cubic's root satisfies the ORIGINAL momentum residual, so the algebra that
  produced (***) is verified rather than trusted.

  WHY IT MATTERS, IN THE ONE CASE EVERYONE CITES.  The NREL Phase VI rotor in
  the NASA Ames 80 x 120 ft tunnel: rotor radius 5.029 m in a 24.4 x 36.6 m
  section is B = 0.0890.  By (*) the Betz ceiling in that tunnel is 0.7140, not
  0.5926 -- a 20.5 % inflation.  NASA Ames is the largest wind tunnel on earth
  and the blockage is still a fifth of the answer.  That is the whole argument
  for the correction, and it is why the sim defaults to that configuration.

  WHAT IS MEASURED AND WHAT IS MODELLED -- read this before quoting a number.

    MEASURED, cited, embedded as anchors (see AIRFOILS and RIG):
      - NREL Phase VI geometry and test condition: 2 blades, R = 5.029 m, hub
        0.508 m, 72 rpm, 19.8 kW rated, 3 deg tip pitch, S809 section t/c 0.21,
        twist 18.074 deg (root) to -1.816 deg (tip), chord 0.737 m at 0.25R
        tapering to 0.356 m at the tip, NASA Ames section 24.4 x 36.6 m,
        blockage < 0.09.
      - Airfoil polar ANCHORS ONLY -- zero-lift angle, lift slope, stall angle,
        maximum lift, minimum drag -- at a stated Reynolds number, from the
        stated source.  Two of them are the same section at two Reynolds
        numbers (NACA 0012 at Re 5e5 and 6e6), which is what calibrates the
        Reynolds trend.
    MODELLED, and labelled as such wherever it is drawn:
      - The polar BETWEEN the anchors: a C1 Hermite bend from the linear lift
        line onto (alpha_stall, Cl_max), a quadratic drag bucket, and the
        Viterna-Corrigan extrapolation past stall -- the published method
        AeroDyn uses, not a fit to any table here.
      - The reversed-flow branch beyond 90 deg is a flat-plate mirror.  It is a
        convention, it is drawn dashed, and no claim is made for it.
      - The Phase VI chord and twist BETWEEN the published endpoints.  The
        endpoints are the NREL spec; the distribution between them is
        reconstructed from the ideal-twist law and is NOT the NREL table.  The
        preset says so on the canvas.

    NOT CLAIMED AT ALL.  No digitised experimental polar and no digitised
    measured power curve is embedded anywhere in this file.  The 1981 Sandia
    scan (SAND80-2114) that tabulates NACA 0012 through 180 deg OCRs to
    "o.oooo" and ".03~3"; reading numbers off Fig. 6 of a CFD paper is not
    measurement either.  So the calibration here is: exact theory asserted to
    machine precision, published closed forms, and cited scalar anchors.  Where
    the sim would need a table it does not have, it says so instead of
    inventing one.

  THE REST OF THE PHYSICS.
    - Blade element momentum, 60 annuli, with Prandtl tip AND hub loss, wake
      rotation, and Buhl's empirical high-induction correction (NREL/TP-500-
      36834).  The momentum side of each annulus is the DUCT relation (***),
      not 4a(1-a), so the walls enter the blade loading and not merely the
      final coefficient -- set blockage to zero and it is the textbook BEM.
    - Glauert's optimum rotor WITH wake rotation, integrated in the induction
      parameter, used as the reference ceiling on the CP-lambda plot.  It
      reproduces Glauert's tabulated optimum at 6 of his 8 tabulated tip-speed
      ratios to the table's own half-last-digit, and tends to 16/27; the two
      that miss (lambda = 0.5 and 1.5) are named in selfTest rather than
      absorbed into a loose tolerance.
    - Axial velocity along the tunnel from the vortex-cylinder closed form
      u(x)/U0 = 1 - a[1 + x/sqrt(x^2+R^2)], with the endpoints replaced by the
      exact duct solution, and the streamtube radius from continuity.  The
      bypass speed is then continuity against the wall, which is what makes the
      3-D picture a wind tunnel rather than a rotor in a void.

  WHAT IS NOT MODELLED.  Compressibility (tip Mach is ~0.1 here), tunnel
  boundary-layer growth, the solid-blockage of the tower and nacelle, dynamic
  stall, yaw, and radial (spanwise) flow -- which is exactly the thing that
  makes real stall-regulated rotors deviate from BEM past stall, and is why the
  post-stall part of any BEM power curve should be distrusted.  The sim says so
  on the power view rather than quietly drawing a confident line.

  Single file, no dependencies, works over file://.  All 3-D -- orbit camera,
  perspective projection, painter's algorithm -- is hand-rolled on canvas 2D,
  same z-up camera as lattice.html, steam_carnot_cycle.html, turbojet.html and
  phase_optimization.html.  Mathematica NeonColors (same NEON_STOPS table).

  Headless self-test: extract the script body (between the LAST script
  open/close tags, cf. rindex) and run it with
      osascript -l JavaScript wind_tunnel_test.js
  -- with `document` undefined it runs the assertion suite instead of booting
  the UI.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* velocity ramp: fast = pale green (free stream), slow = magenta (deep wake).
   Lightness is monotone in speed so it reads as a magnitude, not a category. */
function speedCol(u){ return mix('#cd35c4','#d8f59a',clamp(u,0,1)); }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ================================================================== *
 *  AIR                                                                *
 *  Sutherland's law for viscosity, ideal gas for density.  Both are   *
 *  needed only to get the chord Reynolds number right, which is what  *
 *  selects the polar — the aerodynamics below is incompressible.      *
 * ================================================================== */
const R_AIR=287.058;                     // J/(kg K)
function airDensity(P,T){ return P/(R_AIR*T); }
function airViscosity(T){                // Sutherland, mu_ref at 273.15 K
  const mu0=1.716e-5, T0=273.15, S=110.4;
  return mu0*Math.pow(T/T0,1.5)*(T0+S)/(T+S);
}

/* ================================================================== *
 *  AIRFOIL SECTIONS                                                   *
 *                                                                     *
 *  Each entry carries ANCHORS ONLY, at a stated Reynolds number, from *
 *  a stated source.  The curve between the anchors is the model       *
 *  described in the header: a linear lift line, a C1 Hermite bend     *
 *  onto (aStall, clMax), a quadratic drag bucket, then the published  *
 *  Viterna-Corrigan extrapolation.  No digitised table is embedded.   *
 *                                                                     *
 *  The two NACA 0012 entries are the SAME SECTION at two Reynolds     *
 *  numbers, an order of magnitude apart.  That pair is what calibrates *
 *  the Reynolds trend used when "scale with Reynolds" is on, and it is *
 *  itself a wind-tunnel result: stall is a viscous event, so both the  *
 *  maximum lift and the angle at which it happens move with Re.        *
 * ================================================================== */
const AIRFOILS=[
  {id:'s809', name:'S809', tc:0.21,
   a0:-1.0, clAlpha:6.20, aStall:9.2, clMax:1.00, cd0:0.0065, cdStall:0.0190,
   ReRef:1.0e6,
   src:'Somers, Delft LSWT (NREL/SR-440-6918) — 21% laminar-flow section, '
      +'restrained maximum lift, docile stall'},
  {id:'n0012hi', name:'NACA 0012 @ Re 6e6', tc:0.12,
   a0:0.0, clAlpha:6.28, aStall:16.0, clMax:1.60, cd0:0.0060, cdStall:0.0220,
   ReRef:6.0e6,
   src:'Ladson, NASA TM-4074 — Langley low-turbulence pressure tunnel'},
  {id:'n0012lo', name:'NACA 0012 @ Re 5e5', tc:0.12,
   a0:0.0, clAlpha:5.73, aStall:11.0, clMax:0.95, cd0:0.0100, cdStall:0.0300,
   ReRef:5.0e5,
   src:'Sheldahl & Klimas, SAND80-2114 — Cl_max 0.9–1.0, stall 10–12 deg'},
  {id:'n4415', name:'NACA 4415', tc:0.15,
   a0:-4.0, clAlpha:6.28, aStall:15.0, clMax:1.45, cd0:0.0070, cdStall:0.0250,
   ReRef:3.0e6,
   src:'Abbott & von Doenhoff, Theory of Wing Sections'},
  {id:'plate', name:'flat plate', tc:0.02,
   a0:0.0, clAlpha:6.28, aStall:8.0, clMax:0.80, cd0:0.0200, cdStall:0.0500,
   ReRef:1.0e6,
   src:'thin-plate reference — sharp leading edge, early separation'},
];
function airfoilById(id){ return AIRFOILS.find(f=>f.id===id)||AIRFOILS[0]; }

/* Reynolds trend, calibrated on the NACA 0012 pair above and NOWHERE ELSE.
   Cl_max 0.95 at Re 5e5 -> 1.60 at Re 6e6 and stall 11 deg -> 16 deg give the
   two slopes per natural log of Re; cd0 uses the turbulent flat-plate exponent
   Re^-0.2.  Clamped to the decade either side of the fitted range, because
   extrapolating a two-point fit is how you get a lift coefficient of three. */
const RE_SPAN=6.0e6/5.0e5;               // the factor actually spanned by the fit
const RE_FIT={ lnSpan:Math.log(RE_SPAN),
               dClMax:(1.60-0.95), dAStall:(16.0-11.0), base:0.95 };
function reScale(f,Re){
  if(!(Re>0)) return {clMax:f.clMax, aStall:f.aStall, cd0:f.cd0};
  /* clamp to the span the fit was made over — one span either side of the
     section's own reference — because extrapolating a two-point fit is how you
     end up quoting a lift coefficient of three. */
  const ReC=clamp(Re,f.ReRef/RE_SPAN,f.ReRef*RE_SPAN);
  const u=Math.log(ReC/f.ReRef)/RE_FIT.lnSpan;         // in units of the fitted span
  const kCl=RE_FIT.dClMax/RE_FIT.base;                  // fractional Cl_max per span
  return { clMax: Math.max(0.15, f.clMax*(1+kCl*u)),
           aStall: Math.max(3.0, f.aStall+RE_FIT.dAStall*u),
           cd0:    Math.max(1e-4, f.cd0*Math.pow(ReC/f.ReRef,-0.2)) };
}

/* Viterna–Corrigan post-stall extrapolation (the method AeroDyn uses).
   At alpha = 90 deg it gives Cl = 0 and Cd = cdMax exactly, which is the one
   place the flat-plate limit is genuinely known: Sheldahl & Klimas measured
   Cd(90 deg) = 1.80 for the NACA 0012, and cdMax is exposed so that value can
   be dialled in and checked. */
function viternaCoef(aStallRad,clS,cdS,cdMax){
  const sa=Math.sin(aStallRad), ca=Math.cos(aStallRad);
  const B1=cdMax, A1=B1/2;
  const A2=(clS-cdMax*sa*ca)*sa/(ca*ca);
  const B2=(cdS-cdMax*sa*sa)/ca;
  return {A1,A2,B1,B2};
}

/* The polar.  alpha in DEGREES, returns {cl, cd, stalled, region}.
   region: 'lin' | 'bend' | 'viterna' | 'reversed' — the canvas draws the last
   one dashed because it is a convention, not a measurement. */
function polar(f,alphaDeg,opts){
  const o=opts||{};
  const sc = o.reScale ? reScale(f,o.Re) : {clMax:f.clMax, aStall:f.aStall, cd0:f.cd0};
  const cdMax = o.cdMax===undefined ? 2.0 : o.cdMax;
  const revEff = o.revEff===undefined ? 0.80 : o.revEff;
  const cd180 = o.cd180===undefined ? 0.025 : o.cd180;

  /* fold into [-180,180], then work with the positive-alpha branch measured
     from the zero-lift angle; negative alpha is the mirror image. */
  let a=alphaDeg;
  while(a>180) a-=360; while(a<-180) a+=360;
  const sgn = (a-f.a0)>=0 ? 1 : -1;
  let ae = Math.abs(a-f.a0);                 // effective angle from zero lift
  let reversed=false;
  if(ae>180){ ae=360-ae; }
  if(ae>90){ ae=180-ae; reversed=true; }     // running backwards

  /* Sources quote the stall angle geometrically; `ae` is measured from the
     zero-lift angle, so shift it once here.  The negative-alpha branch is
     taken as the mirror of the positive one, which is exact for the symmetric
     sections and an approximation for the cambered ones — turbine blades do
     not operate there, and the polar view draws both so the asymmetry that is
     being neglected is visible rather than hidden. */
  const aSt=Math.max(2, sc.aStall-f.a0);
  const clMax=sc.clMax;

  const bend=Math.min(5.0, 0.55*aSt);        // width of the C1 bend, degrees
  const aLin=Math.max(0.5, aSt-bend);
  const clLin=x=>f.clAlpha*(x*DEG);

  let cl, cd, region;
  if(ae<=aLin){
    cl=clLin(ae); region='lin';
  } else if(ae<=aSt){
    /* cubic Hermite from (aLin, clLin(aLin), slope clAlpha) to (aSt, clMax, 0) */
    const t=(ae-aLin)/(aSt-aLin), t2=t*t, t3=t2*t;
    const h00=2*t3-3*t2+1, h10=t3-2*t2+t, h01=-2*t3+3*t2, h11=t3-t2;
    const m0=f.clAlpha*DEG*(aSt-aLin);       // slope scaled to the interval
    cl=h00*clLin(aLin)+h10*m0+h01*clMax+h11*0; region='bend';
  } else {
    const vc=viternaCoef(aSt*DEG, clMax, sc.cd0+(f.cdStall-f.cd0), cdMax);
    const ar=ae*DEG, s=Math.sin(ar), c=Math.cos(ar);
    cl=vc.A1*Math.sin(2*ar)+vc.A2*c*c/Math.max(s,1e-6);
    region='viterna';
  }
  /* drag: quadratic bucket to the stall anchor, then Viterna */
  if(ae<=aSt){
    const q=(ae/aSt); cd=sc.cd0+(f.cdStall-f.cd0)*q*q;
  } else {
    const vc=viternaCoef(aSt*DEG, clMax, sc.cd0+(f.cdStall-f.cd0), cdMax);
    const ar=ae*DEG, s=Math.sin(ar), c=Math.cos(ar);
    cd=vc.B1*s*s+vc.B2*c;
  }
  if(reversed){ cl*=-revEff; region='reversed';
    /* blend the drag onto the measured 180-degree anchor near alpha = 180 */
    const w=clamp((90-ae)/90,0,1); cd=lerp(cd,cd180,w*w);
  }
  cd=Math.max(cd,1e-4);
  return {cl:sgn*cl, cd, stalled:(ae>aSt), region};
}

/* ================================================================== *
 *  THE CLOSED TEST SECTION — actuator disc between walls              *
 *                                                                     *
 *  Unknowns, normalised by the empty-tunnel speed U0:                 *
 *     w    = U_wake/U0     be = U_bypass/U0     b = A_wake/C          *
 *  Given blockage B = A/C and induction a (disc speed = U0(1-a)):     *
 *                                                                     *
 *     streamtube continuity   b  = B(1-a)/w            (k := B(1-a))  *
 *     duct continuity         w b + be(1-b) = 1                       *
 *     bypass Bernoulli        p0-p4 = rho U0^2 (be^2-1)/2             *
 *     disc pressure jump      CT = be^2 - w^2                         *
 *     duct momentum           (be^2-1)/2 - B CT/2 = w^2 b + be^2(1-b) - 1
 *                                                                     *
 *  Eliminating b and be and deflating the trivial root w = 1 leaves    *
 *  the monic cubic (***) of the header.  Its coefficients are simple   *
 *  enough to write down, so there is no root-finding fragility and no  *
 *  special case at B = 0 — the cubic degenerates to w^2(w-(1-2a)) and  *
 *  hands back the classical disc.                                      *
 * ================================================================== */

/* real roots of x^3 + c2 x^2 + c1 x + c0, trigonometric/Cardano form */
function cubicRoots(c2,c1,c0){
  const p=c1-c2*c2/3, q=2*c2*c2*c2/27-c2*c1/3+c0, sh=-c2/3;
  const disc=q*q/4+p*p*p/27;
  if(disc>0){
    const s=Math.sqrt(disc);
    const u=Math.cbrt(-q/2+s), v=Math.cbrt(-q/2-s);
    return [u+v+sh];
  }
  if(Math.abs(p)<1e-300) return [sh,sh,sh];
  const r=2*Math.sqrt(-p/3);
  const cosArg=clamp(3*q/(p*r),-1,1);
  const th=Math.acos(cosArg)/3;
  return [ r*Math.cos(th)+sh,
           r*Math.cos(th-TAU/3)+sh,
           r*Math.cos(th-2*TAU/3)+sh ];
}

/* wake speed ratio w = U_wake/U0 for blockage B and induction a.

   The closed-form cubic solution loses digits to cancellation, and at small B
   the cubic is nearly degenerate (two roots collapse toward zero), so the
   trigonometric root is POLISHED by Newton on the cubic itself.  Without the
   polish the residual against the original momentum balance is ~4e-12 and the
   B -> 0 limit only reproduces the classical disc to ~1e-5; with it, both are
   at machine precision.  Three iterations are enough — Newton doubles the
   correct digits each step and the starting point is already close. */
function wakeSpeed(B,a){
  if(B<=1e-12) return 1-2*a;
  const om=1-a, k=B*om;
  const c2=1-2*om*(1+B), c1=3*B*om*om, c0=-B*om*om;
  const rts=cubicRoots(c2,c1,c0);
  let best=NaN;
  for(const r of rts){
    if(!isFinite(r)) continue;
    if(r>k-1e-13 && r<=1+1e-13){ if(!(best>=r)) best=r; }
  }
  if(!isFinite(best)) return best;
  for(let i=0;i<3;i++){
    const f=((best+c2)*best+c1)*best+c0;
    const fp=(3*best+2*c2)*best+c1;
    if(!isFinite(fp)||Math.abs(fp)<1e-300) break;
    const step=f/fp;
    if(!isFinite(step)) break;
    best-=step;
  }
  return best;
}
/* the whole disc state.  CT and CP are referenced to the EMPTY-TUNNEL speed U0
   and the disc area, which is what a tunnel balance actually reports. */
function ductDisc(B,a){
  const om=1-a;
  if(B<=1e-12){
    const w=1-2*a, CT=4*a*om;
    return {w, be:1, b:0, CT, CP:CT*om, ok:true};
  }
  const w=wakeSpeed(B,a), k=B*om;
  if(!isFinite(w)||w<=k){ return {w:NaN,be:NaN,b:NaN,CT:NaN,CP:NaN,ok:false}; }
  const be=w*(1-k)/(w-k), b=k/w, CT=be*be-w*w;
  return {w, be, b, CT, CP:CT*om, ok:true};
}
/* the two exact consequences, for the plots and for selfTest to check against */
function betzInTunnel(B){ return (16/27)/((1-B)*(1-B)); }
function aStarInTunnel(B){ return (1+3*B)/(3*(1+B)); }

/* Buhl's empirical high-induction correction (NREL/TP-500-36834).  Momentum
   theory stops being true once the wake turns over (a > ~0.4); Buhl replaces
   CT(a) with a parabola matching 0.96F at a = 0.4 and CT = 2 at a = 1.
   It is a FREE-AIR fit.  In a blocked section it is applied scaled by the duct
   solution's own value at the match point, so it joins continuously — that
   scaling is an engineering choice, is labelled as one, and is why the sim
   warns when the operating point sits above the match. */
const A_MATCH=0.4;
function momentumCT(a,F,B){
  if(a<=A_MATCH) return F*ductDisc(B,a).CT;
  const scale = B<=1e-12 ? 1 : (ductDisc(B,A_MATCH).CT/(4*A_MATCH*(1-A_MATCH)));
  return F*scale*(8/9+(4*F-40/9)*a+(50/9-4*F)*a*a);
}
/* invert CT -> a by bisection (momentumCT is increasing in a on [0,1]) */
function inverseCT(CTt,F,B){
  let lo=0, hi=0.99;
  if(momentumCT(hi,F,B)<CTt) return hi;
  for(let i=0;i<60;i++){ const m=0.5*(lo+hi);
    if(momentumCT(m,F,B)<CTt) lo=m; else hi=m; }
  return 0.5*(lo+hi);
}

/* ================================================================== *
 *  BLADE GEOMETRY                                                     *
 *                                                                     *
 *  'phase6' reproduces the published Phase VI ENDPOINTS exactly and    *
 *  reconstructs the distribution between them from the ideal-twist     *
 *  law — it is not the NREL table, and the canvas says so.             *
 *  'betz' is the design the sim optimises toward: Glauert's optimum    *
 *  chord and twist for the current tip-speed ratio and design lift.    *
 * ================================================================== */
const RIG={                              // NREL Phase VI / NASA Ames 80 x 120
  R:5.029, rHub:0.508, nB:2, rpm:72, pitch:3.0,
  chordRoot:0.737, chordTip:0.356, rChordRoot:0.25,   // r/R at which 0.737 holds
  twistRoot:18.074, twistTip:-1.816,
  rated:19.8e3, tunnelW:24.4, tunnelH:36.6,
  src:'NREL Phase VI, NASA Ames 80x120 ft, May 2000'
};

/* Flow angle of Glauert's optimum rotor WITH wake rotation (Manwell §3.11):
       phi_opt(lam_r) = (2/3) arctan(1 / lam_r)
   As lam_r grows this tends to arctan(2/(3 lam_r)), the flow angle at Betz
   loading with no wake rotation — but at small lam_r the two differ badly
   (60 deg against 90 deg at lam_r -> 0), and it is the wake-rotation form that
   belongs with the chord law below. */
function optFlowAngle(lr){ return (2/3)*Math.atan2(1,Math.max(lr,1e-9)); }
function idealTwist(x,lam){              // x = r/R ; degrees
  return optFlowAngle(lam*Math.max(x,1e-6))*RAD;
}
/* Chord of Glauert's optimum rotor, c = (8 pi r / (N Cl_des))(1 - cos phi).
   This is only the optimum if Cl_des is the lift the section ACTUALLY makes at
   the design angle — see bladeGeom, where it is read off the polar rather than
   set independently.  With the two inconsistent the blade is under- or
   over-solid and the induction misses 1/3, which is exactly the defect the
   mutation sweep turned up. */
function betzChord(x,lam,nB,R,clDes){
  const lr=Math.max(lam*x,1e-6);
  return (8*Math.PI*R*x)/(nB*Math.max(clDes,0.05))*(1-Math.cos(optFlowAngle(lr)));
}

function tipSpeedRatio(st){ return (st.rpm*TAU/60)*st.R/Math.max(st.U,0.05); }

/* The design lift is NOT a free parameter: it is whatever the chosen section
   actually produces at the design angle of attack.  Setting the two
   independently (as an earlier version did) makes the "optimum" blade
   under-solid — with the S809 at 6 deg the section makes Cl = 0.76, so asking
   for 1.0 shrinks every chord by a quarter, the induction lands near 0.16
   instead of 1/3, and the blade labelled optimum loses ~0.12 of CP to the
   curve it is supposed to touch. */
function designCl(st){
  const f=airfoilById(st.foil);
  return Math.max(0.05,polar(f,st.alphaDes,{}).cl);
}

function bladeGeom(st){
  const R=st.R, rh=st.rHub, nB=st.nB;
  const lam=(st.lamDesign!==undefined&&st.lamDesign>0)?st.lamDesign:tipSpeedRatio(st);
  const kind=st.blade;
  const clDes=designCl(st);
  return function(r){
    const x=clamp(r/R,1e-4,1);
    let c,tw;
    if(kind==='betz'){
      /* The rig's tip pitch is added to every station's twist downstream
         (alpha = phi - (twist + pitch)), so the optimum twist has to be defined
         RELATIVE to it — otherwise turning the pitch knob silently de-tunes the
         blade that is supposed to be optimal.  With the Phase VI default of 3
         deg that cost the "optimum" blade about 0.06 of CP and pulled the
         induction down to 0.24 from 1/3. */
      c=betzChord(x,lam,nB,R,clDes);
      tw=idealTwist(x,lam)-st.alphaDes-st.pitch;
    } else if(kind==='phase6'){
      /* endpoints are the NREL spec; the shape between is the ideal-twist law
         rescaled to land on them — reconstruction, not the NREL table. */
      const x0=RIG.rChordRoot;
      c=lerp(RIG.chordRoot,RIG.chordTip,clamp((x-x0)/(1-x0),0,1));
      const s0=idealTwist(x0,lam), s1=idealTwist(1,lam);
      const u=(idealTwist(Math.max(x,x0),lam)-s1)/((s0-s1)||1);
      tw=lerp(RIG.twistTip,RIG.twistRoot,clamp(u,0,1));
    } else if(kind==='linear'){
      c=lerp(st.cRoot,st.cTip,x);
      tw=lerp(st.twRoot,st.twTip,x);
    } else {                              // 'flat' — untapered, untwisted
      c=st.cTip; tw=0;
    }
    return {c:Math.max(c,1e-3), twist:tw*st.twScale};
  };
}

/* ================================================================== *
 *  BLADE ELEMENT MOMENTUM                                             *
 *                                                                     *
 *  Standard BEM, except that the momentum side of every annulus is    *
 *  the DUCT relation, so the walls change the blade loading and not   *
 *  just the reported coefficient.  Set blockage to zero and this is   *
 *  the textbook method.                                               *
 * ================================================================== */
function prandtlF(nB,r,R,rh,sinPhi,tip,hub){
  let F=1;
  const s=Math.max(Math.abs(sinPhi),1e-4);
  if(tip){ const ft=nB*(R-r)/(2*r*s);
    F*= (2/Math.PI)*Math.acos(clamp(Math.exp(-ft),-1,1)); }
  if(hub){ const fh=nB*(r-rh)/(2*Math.max(rh,1e-4)*s);
    F*= (2/Math.PI)*Math.acos(clamp(Math.exp(-fh),-1,1)); }
  return clamp(F,1e-4,1);
}

function runBEM(st){
  const R=st.R, rh=st.rHub, nB=st.nB, U=st.U, om=st.rpm*TAU/60;
  const geom=bladeGeom(st), foil=airfoilById(st.foil);
  const rho=airDensity(st.P*1000,st.T), mu=airViscosity(st.T), nu=mu/rho;
  const A=Math.PI*R*R;
  const Bk=st.tunnel==='free' ? 0 : A/(st.tw*st.th);
  const n=st.nAnn||60;
  const el=[]; let T=0,Q=0, worstA=0, anyStall=false, aboveMatch=false;
  for(let i=0;i<n;i++){
    const r=rh+(R-rh)*(i+0.5)/n, dr=(R-rh)/n;
    const g=geom(r), c=g.c, tw=g.twist;
    const sig=nB*c/(TAU*r);
    let a=0.3, ap=0.0, phi=0.3, alpha=0, cl=0, cd=0, W=0, F=1, Re=0;
    for(let it=0; it<220; it++){
      const Un=U*(1-a), Ut=om*r*(1+ap);
      phi=Math.atan2(Un,Ut);
      const sp=Math.sin(phi), cp=Math.cos(phi);
      alpha=(phi*RAD)-(tw+st.pitch);
      W=Math.hypot(Un,Ut); Re=W*c/nu;
      const pl=polar(foil,alpha,{reScale:st.reScale,Re,cdMax:st.cdMax});
      cl=pl.cl; cd=st.drag?pl.cd:0;
      if(pl.stalled) anyStall=true;
      const Cn=cl*cp+cd*sp, Ct=cl*sp-cd*cp;
      F=prandtlF(nB,r,R,rh,sp,st.tipLoss,st.hubLoss);
      const CTb=sig*(1-a)*(1-a)*Cn/Math.max(sp*sp,1e-8);
      let aNew=inverseCT(CTb,F,Bk);
      let apNew=0;
      if(st.wakeRot){
        const den=4*F*sp*cp/Math.max(sig*Ct,1e-9)-1;
        apNew = Math.abs(den)<1e-6 ? ap : 1/den;
        apNew = clamp(apNew,-0.9,4);
      }
      const relax=0.30;
      const da=Math.abs(aNew-a), dap=Math.abs(apNew-ap);
      a+=relax*(aNew-a); ap+=relax*(apNew-ap);
      a=clamp(a,-0.5,0.95);
      if(da<1e-10&&dap<1e-10) break;
    }
    if(a>A_MATCH) aboveMatch=true;
    worstA=Math.max(worstA,a);
    const sp=Math.sin(phi), cp=Math.cos(phi);
    const Cn=cl*cp+cd*sp, Ct=cl*sp-cd*cp;
    const q=0.5*rho*W*W*c;
    const dT=nB*q*Cn*dr, dQ=nB*q*Ct*r*dr;
    T+=dT; Q+=dQ;
    el.push({r,x:r/R,c,twist:tw,a,ap,phi,alpha,cl,cd,W,F,Re,dT:dT/dr,dQ:dQ/dr,
             ld:cd>0?cl/cd:Infinity});
  }
  const P=Q*om;
  const qInf=0.5*rho*U*U*A;
  return {el,T,Q,P,rho,nu,A,B:Bk,om,
          CT:T/qInf, CP:P/(qInf*U), CQ:Q/(qInf*R),
          lam:om*R/U, worstA, anyStall, aboveMatch,
          tipSpeed:om*R, tipMach:om*R/Math.sqrt(1.4*R_AIR*st.T)};
}

/* ================================================================== *
 *  GLAUERT'S OPTIMUM ROTOR (with wake rotation)                       *
 *                                                                     *
 *    a' = (1-3a)/(4a-1),   lam_r^2 = (1-a)(4a-1)^2/(1-3a)             *
 *    CP = (8/lam^2) INT lam_r^3 a'(1-a) d lam_r                       *
 *                                                                     *
 *  Integrated in the parameter a from 1/4 (the axis) to a_tip, with    *
 *  the analytic d lam_r/da, so no root solving and no singular         *
 *  endpoint.  Tends to 16/27; selfTest checks that and checks the      *
 *  values Glauert tabulated.                                          *
 * ================================================================== */
function glauertLamR(a){
  return Math.sqrt((1-a)*(4*a-1)*(4*a-1)/(1-3*a));
}
function glauertDLam(a){
  return 0.5*glauertLamR(a)*(-1/(1-a)+8/(4*a-1)+3/(1-3*a));
}
function glauertAofLamR(lr){             // solve lam_r(a) = lr on (1/4, 1/3)
  let lo=0.25, hi=1/3;
  for(let i=0;i<90;i++){ const m=0.5*(lo+hi);
    if(glauertLamR(m)<lr) lo=m; else hi=m; }
  return 0.5*(lo+hi);
}
/* Integrating uniformly in `a` FAILS: as lambda grows, a_tip -> 1/3 and the
   integrand behaves as (1-3a)^-2, so essentially all of the integral lives in
   the last sliver of the interval and a uniform Simpson rule returns nonsense
   (CP = 5.37 at lambda = 400, against a ceiling of 16/27).  Substituting
   lam_r = lambda v moves the whole thing onto a fixed interval with a smooth
   bounded integrand:

       CP = 8 lambda^2  INT_0^1  v^3 a'(v) (1 - a(v))  dv

   which costs one bisection per sample and is uniformly accurate in lambda.
   selfTest cross-checks this quadrature against an independent one. */
function glauertCP(lam,n){
  if(!(lam>0)) return 0;
  const N=Math.max(4,2*Math.ceil((n||200)/2));   // Simpson needs an even count
  let s=0;
  for(let i=0;i<=N;i++){
    const v=i/N;
    let f=0;
    if(v>0){
      const a=glauertAofLamR(lam*v);
      const den=4*a-1;
      f = den>1e-14 ? v*v*v*((1-3*a)/den)*(1-a) : 0;
    }
    const wgt=(i===0||i===N)?1:(i%2?4:2);
    s+=wgt*(isFinite(f)?f:0);
  }
  s/=(3*N);
  return 8*lam*lam*s;
}
/* An independent evaluation of the same integral, by the trapezoid rule in the
   ORIGINAL variable a with the analytic d lam_r/da — different variable,
   different rule, no shared code path beyond the parametrisation itself.  Only
   used by selfTest, and only at moderate lambda where integrating in a is
   still well conditioned. */
function glauertCPalt(lam,n){
  if(!(lam>0)) return 0;
  const aT=glauertAofLamR(lam), a0=0.25, N=n||200000;
  let s=0;
  for(let i=0;i<=N;i++){
    const a=a0+(aT-a0)*i/N;
    const den=4*a-1;
    const f = den>1e-14
      ? Math.pow(glauertLamR(a),3)*((1-3*a)/den)*(1-a)*glauertDLam(a) : 0;
    s+=(i===0||i===N?0.5:1)*(isFinite(f)?f:0);
  }
  s*=(aT-a0)/N;
  return (8/(lam*lam))*s;
}

/* ================================================================== *
 *  THE FLOW ALONG THE TUNNEL                                          *
 *                                                                     *
 *  Axial speed on the streamtube from the vortex-cylinder closed form  *
 *      u(x)/U0 = 1 - a [ 1 + x / sqrt(x^2 + R^2) ]                     *
 *  which is exact for a uniformly loaded disc in free air: it gives    *
 *  U0 far upstream, U0(1-a) at the disc, U0(1-2a) far downstream.      *
 *  In a tunnel the far-wake value is not U0(1-2a) but the duct         *
 *  solution's w, so the profile is rescaled to land on the exact       *
 *  endpoints while keeping the closed form's SHAPE.  That rescaling is *
 *  drawing, not physics, and is labelled on the canvas.                *
 *                                                                     *
 *  The streamtube radius then follows from continuity alone, and the   *
 *  bypass speed from continuity against the wall — which is the whole  *
 *  point: the wall is what makes the bypass accelerate.                *
 * ================================================================== */
/* s(x) = 1 + x/sqrt(x^2+R^2) runs 0 -> 1 -> 2 from far upstream, through the
   disc, to far downstream.  The free-air vortex-cylinder result is u = 1 - a s,
   i.e. LINEAR in s.  To land on a different far-wake value without abandoning
   that shape, take the smallest correction that still passes through all three
   known points — a quadratic in s:

       u(s) = 1 + c1 s + c2 s^2 ,   u(0)=1, u(1)=1-a, u(2)=wEnd

   giving c1 = (1-4a-wEnd)/2 and c2 = (wEnd-1+2a)/2.  In free air wEnd = 1-2a,
   c2 vanishes identically and this IS the vortex-cylinder form, so nothing is
   distorted in the case where the closed form is exact.  selfTest checks both
   the three anchors and the free-air reduction. */
function axialProfile(x,R,a,wEnd){
  const s=1+x/Math.sqrt(x*x+R*R);
  const wE=(wEnd===undefined)?1-2*a:wEnd;
  const c1=(1-4*a-wE)/2, c2=(wE-1+2*a)/2;
  return 1+c1*s+c2*s*s;
}
function tubeRadius(uAtX,uDisc,Rdisc){
  return Rdisc*Math.sqrt(Math.max(uDisc,1e-6)/Math.max(uAtX,1e-6));
}

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function fmtPct(x){ return isFinite(x)?(100*x).toFixed(1)+'%':'—'; }
function fmtPow(W){
  if(!isFinite(W)) return '—';
  const a=Math.abs(W);
  if(a>=1e6) return (W/1e6).toFixed(2)+' MW';
  if(a>=1e3) return (W/1e3).toFixed(2)+' kW';
  return W.toFixed(1)+' W';
}
function fmtRe(Re){
  if(!isFinite(Re)||Re<=0) return '—';
  const e=Math.floor(Math.log10(Re));
  return (Re/Math.pow(10,e)).toFixed(2)+'×10'+sup(e);
}
function sup(n){
  const M={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
           '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return String(n).split('').map(c=>M[c]||c).join('');
}

/* ================================================================== *
 *  MODEL — everything the views read, computed once per refresh       *
 * ================================================================== */
function buildModel(st){
  const bem=runBEM(st);
  const A=bem.A, B=bem.B;
  const free=st.tunnel==='free';

  /* the same rotor read as if the walls were not there.  The standard tunnel
     correction: find the equivalent free-stream Ue that a FREE-AIR disc would
     need to produce the thrust actually measured, then re-reference. */
  const aEq=(function(){
    /* invert CT_free = 4a(1-a) for the measured CT (take the lower root) */
    const CT=clamp(bem.CT,0,0.999);
    return 0.5*(1-Math.sqrt(Math.max(1-CT,0)));
  })();
  const ductAtA=ductDisc(B,aEq);
  /* velocity-equivalence correction (Glauert's form): the tunnel disc at the
     same thrust behaves like a free disc in a stream of Ue > U0. */
  const Ue = free ? st.U : st.U*Math.sqrt(Math.max(ductAtA.CT,1e-9)/Math.max(4*aEq*(1-aEq),1e-9));
  const CPcorr = free ? bem.CP : bem.CP*Math.pow(st.U/Math.max(Ue,1e-6),3);
  const CTcorr = free ? bem.CT : bem.CT*Math.pow(st.U/Math.max(Ue,1e-6),2);

  const ceiling = free ? 16/27 : betzInTunnel(B);
  const aStar   = free ? 1/3   : aStarInTunnel(B);

  /* CP(lambda) sweep for the power view — the expensive one, so it is built
     with a coarser annulus count and cached by the scene. */
  /* The lambda sweep is the expensive part of a rebuild — one full BEM solve
     per point.  Resolution follows the annulus count, so the interactive path
     stays smooth while selfTest (which builds a dozen models at nAnn = 16) does
     not spend a minute on curves it never draws. */
  const NS = st.nAnn>=40 ? 44 : 14;
  const sweep=[];
  {
    const s2=Object.assign({},st,{nAnn:Math.min(st.nAnn,26)});
    for(let i=0;i<=NS;i++){
      const lam=0.5+i*(16-0.5)/NS;
      s2.rpm = lam*st.U*60/(TAU*st.R);
      const r2=runBEM(s2);
      sweep.push({lam, CP:r2.CP, CT:r2.CT, stall:r2.anyStall});
    }
  }
  /* Glauert's optimum, and the blockage curves */
  const glau=[]; for(let i=0;i<=NS;i++){ const lam=0.5+i*(16-0.5)/NS;
    glau.push({lam, CP:glauertCP(lam,160)}); }
  const blk=[]; for(let i=0;i<=60;i++){ const b=i*0.30/60;
    blk.push({B:b, ceil:betzInTunnel(b), aStar:aStarInTunnel(b)}); }

  /* disc-state curve CT(a), CP(a) at the current blockage */
  const discCurve=[]; for(let i=0;i<=100;i++){ const a=i*0.6/100;
    const d=ductDisc(B,a), f=ductDisc(0,a);
    discCurve.push({a, CT:d.CT, CP:d.CP, CTf:f.CT, CPf:f.CP}); }

  const foil=airfoilById(st.foil);
  const stEl=bem.el[Math.min(bem.el.length-1,
              Math.max(0,Math.round(st.station*(bem.el.length-1))))];

  return {st,bem,A,B,free,Ue,CPcorr,CTcorr,ceiling,aStar,aEq,
          sweep,glau,blk,discCurve,foil,stEl,
          rho:bem.rho, lam:bem.lam,
          blockPct:B, overRead: free?0:(betzInTunnel(B)-16/27)/(16/27)};
}

  hd('coefficients');

  }
  row('C<sub>T</sub>', fmt(b.CT,4));

  hd('the test section');
  row('blockage B = A/C', M.free?'— (free air)':fmtPct(M.B));
  row('ceiling inflation', M.free?'—':'+'+fmtPct(M.overRead), M.free?'':'bad');
  row('a* (optimal loading)', fmt(M.aStar,4));
  row('max induction a', fmt(b.worstA,3), b.worstA>A_MATCH?'bad':'');

  const bar=(v,max,cls)=>'<div class="bar"><div class="fill '+(cls||'')+'" style="width:'

    +'<table>'+rows.join('')+'</table>'

    +'<div class="note">bar is C<sub>P</sub>; the tick is Betz. '
    +(M.free?'With no walls the tick is the ceiling.'
      :'In this section the ceiling is <b>'+fmt(M.ceiling,4)+'</b>, so a rotor may sit '
      +'right of the tick without breaking anything.')+'</div>'
    +'<div class="legend"><span><i style="background:#b8ec4c"></i>free stream</span>'
    +'<span><i style="background:#cd35c4"></i>wake</span>'
    +'<span><i style="background:#5ac8e0"></i>streamtube</span>'
    +'<span><i style="background:#3a4152"></i>walls</span></div>';
}
