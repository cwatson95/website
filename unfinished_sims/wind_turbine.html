/* ================================================================== *
 *  2-D axes helper                                                    *
 * ================================================================== */
function makeAxes(x0,y0,w,hgt,xlo,xhi,ylo,yhi){
  return {x0,y0,w,h:hgt,xlo,xhi,ylo,yhi,
    X:v=>x0+(v-xlo)/((xhi-xlo)||1)*w,
    Y:v=>y0+hgt-(v-ylo)/((yhi-ylo)||1)*hgt};
}
function ticks(lo,hi,n){
  const raw=(hi-lo)/Math.max(n,1);
  const mag=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1e-12))));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(v);
  return out;
}
function tickLabel(v){
  if(Math.abs(v)<1e-12) return '0';
  const a=Math.abs(v);
  if(a>=1000||a<0.01) return v.toExponential(0);
  return String(Math.round(v*1000)/1000);
}
/* Clip 2-D plot data to the axes frame — curves that leave the box must not be
   drawn through the tick labels.  (Known-bad list, steam_carnot_cycle.html.) */
function frameClip(ctx,ax,pad){
  const p=pad||0;
  ctx.beginPath(); ctx.rect(ax.x0-p,ax.y0-p,ax.w+2*p,ax.h+2*p); ctx.clip();
}
function drawFrame(ctx,ax,xlab,ylab,opt){
  const o=opt||{};
  ctx.save();
  ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=1;
  ctx.strokeRect(ax.x0,ax.y0,ax.w,ax.h);
  ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle='#767e92';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(const t of ticks(ax.xlo,ax.xhi,o.nx||6)){
    const X=ax.X(t); if(X<ax.x0-1||X>ax.x0+ax.w+1) continue;
    ctx.strokeStyle='#1b1f29'; ctx.beginPath();
    ctx.moveTo(X,ax.y0); ctx.lineTo(X,ax.y0+ax.h); ctx.stroke();
    ctx.fillText(tickLabel(t),X,ax.y0+ax.h+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of ticks(ax.ylo,ax.yhi,o.ny||5)){
    const Y=ax.Y(t); if(Y<ax.y0-1||Y>ax.y0+ax.h+1) continue;
    ctx.strokeStyle='#1b1f29'; ctx.beginPath();
    ctx.moveTo(ax.x0,Y); ctx.lineTo(ax.x0+ax.w,Y); ctx.stroke();
    ctx.fillText(tickLabel(t),ax.x0-6,Y);
  }
  ctx.fillStyle='#8b93a6'; ctx.font='italic 12px Georgia, serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(xlab,ax.x0+ax.w/2,ax.y0+ax.h+20);
  ctx.save(); ctx.translate(ax.x0-42,ax.y0+ax.h/2); ctx.rotate(-Math.PI/2);
  ctx.textBaseline='bottom'; ctx.fillText(ylab,0,0); ctx.restore();
  ctx.restore();
}
function plotLine(ctx,ax,pts,col,lw,dash){
  if(pts.length<2) return;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  ctx.setLineDash(dash||[]); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); let started=false;
  for(const p of pts){
    if(!isFinite(p[0])||!isFinite(p[1])){ started=false; continue; }
    const X=ax.X(p[0]), Y=ax.Y(p[1]);
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.stroke(); ctx.restore();
}
function plotDot(ctx,ax,x,y,col,r,ring){
  const X=ax.X(x), Y=ax.Y(y);
  ctx.save();
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X,Y,r||3.2,0,TAU); ctx.fill();
  if(ring){ ctx.strokeStyle=ring; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(X,Y,(r||3.2)+3,0,TAU); ctx.stroke(); }
  ctx.restore();
}
/* Wrap on MEASURED width, not on a character count: a 30-character budget is
   not a width, and at 10.5 px the legend column overran the canvas edge.  */
function wrapText(ctx,txt,maxW,font){
  ctx.save(); ctx.font=font||'10px -apple-system, sans-serif';
  const words=(''+txt).split(' '); const out=[]; let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ out.push(line); line=w; }
    else line=test;
  }
  if(line) out.push(line);
  ctx.restore(); return out;
}
function label(ctx,x,y,txt,col,align,font){
  ctx.save(); ctx.fillStyle=col||'#8b93a6';
  ctx.font=font||'11px -apple-system, sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.fillText(txt,x,y); ctx.restore();
}

/* ================================================================== *
 *  SCENE                                                              *
 * ================================================================== */
const DEFAULTS={
  view:'tunnel',
  R:5.029, rHub:0.508, nB:2, rpm:72, pitch:3.0,
  blade:'phase6', twScale:1.0, clDes:1.00, alphaDes:6.0, lamDesign:0,
  cRoot:0.737, cTip:0.356, twRoot:18.074, twTip:-1.816,
  U:7.0, T:293.15, P:101.325,
  tunnel:'closed', tw:24.4, th:36.6,
  foil:'s809', reScale:true, cdMax:2.0, polarFull:false,
  tipLoss:true, hubLoss:true, wakeRot:true, drag:true, nAnn:60,
  showTube:true, showWalls:true, showParticles:true, showWake:true, showGrid:true,
  anim:true, spin:false, speed:1.0, station:0.70,
};

function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-2.30,0.30,34,[0,0,0]);
  /* The blade view looks down the rotor axis so the planform is face-on; under
     the tunnel view's camera the blade rendered as a vertical sliver. */
  const bcam={theta:0.28,phi:0.16};
  let t=0, cached=null, cacheKey='';

  function keyOf(){
    return [st.R,st.rHub,st.nB,st.rpm,st.pitch,st.blade,st.twScale,st.clDes,st.alphaDes,
            st.lamDesign,st.cRoot,st.cTip,st.twRoot,st.twTip,st.U,st.T,st.P,st.tunnel,
            st.tw,st.th,st.foil,st.reScale,st.cdMax,st.tipLoss,st.hubLoss,st.wakeRot,
            st.drag,st.nAnn,st.station].join('|');
  }
  function model(){
    const k=keyOf();
    if(cached&&cacheKey===k) return cached;
    cached=buildModel(st); cacheKey=k; return cached;
  }
  function rebuild(){ cacheKey=''; }

  /* ---------------- 3-D: the tunnel ---------------- */
  function drawTunnel(ctx,W,H,M){
    const B=camBasis(cam);
    const R=st.R, free=M.free;
    const halfW=free? R*3.2 : st.tw/2, halfH=free? R*3.2 : st.th/2;
    const xLo=-3.0*R, xHi=5.0*R;
    const bem=M.bem;
    /* rotor-averaged induction, weighted by annulus area — the one number the
       1-D picture needs, taken from the 3-D blade solution rather than assumed */
    let aBar=0, wsum=0;
    for(const e of bem.el){ const w=e.r; aBar+=e.a*w; wsum+=w; }
    aBar = wsum>0 ? aBar/wsum : 1/3;
    const dd=ductDisc(M.B,aBar);
    const wEnd=isFinite(dd.w)?dd.w:1-2*aBar;

    const prof=x=>axialProfile(x,R,aBar,wEnd);
    const uDisc=prof(0);

    /* painter's algorithm: collect everything with a depth, sort, draw */
    const items=[];
    const push=(z,fn)=>items.push({z,fn});

    /* --- the test-section walls, as a wireframe box with a floor grid --- */
    if(st.showWalls&&!free){
      const corners=[[-halfW,-halfH],[halfW,-halfH],[halfW,halfH],[-halfW,halfH]];
      const edges=[];
      for(let i=0;i<4;i++){
        const c=corners[i], d=corners[(i+1)%4];
        edges.push([[xLo,c[0],c[1]],[xLo,d[0],d[1]]]);
        edges.push([[xHi,c[0],c[1]],[xHi,d[0],d[1]]]);
        edges.push([[xLo,c[0],c[1]],[xHi,c[0],c[1]]]);
      }
      for(const e of edges){
        const p=project(cam,B,e[0]), q=project(cam,B,e[1]);
        if(!p||!q) continue;
        push((p.z+q.z)/2+1e4,()=>{ ctx.strokeStyle=rgba('#3a4152',.85); ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); });
      }
      if(st.showGrid){
        const n=14;
        for(let i=0;i<=n;i++){
          const x=lerp(xLo,xHi,i/n);
          const p=project(cam,B,[x,-halfW,-halfH]), q=project(cam,B,[x,halfW,-halfH]);
          if(p&&q) push((p.z+q.z)/2+2e4,()=>{ ctx.strokeStyle=rgba('#3a4152',.28);
            ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); });
        }
      }
    }

    /* --- the streamtube: a surface of revolution r(x) from continuity --- */
    const NX=64, NTH=28;
    const xs=[], rs=[], us=[];
    for(let i=0;i<=NX;i++){
      const x=lerp(xLo,xHi,i/NX), u=prof(x);
      xs.push(x); us.push(u); rs.push(tubeRadius(u,uDisc,R));
    }
    if(st.showTube){
      for(let i=0;i<NX;i++){
        const uA=us[i], uB2=us[i+1];
        /* speed -> colour, normalised on the free stream */
        const cA=speedCol(clamp(uA,0,1));
        for(let j=0;j<NTH;j++){
          const th0=TAU*j/NTH, th1=TAU*(j+1)/NTH;
          const q=[[xs[i],rs[i]*Math.cos(th0),rs[i]*Math.sin(th0)],
                   [xs[i+1],rs[i+1]*Math.cos(th0),rs[i+1]*Math.sin(th0)],
                   [xs[i+1],rs[i+1]*Math.cos(th1),rs[i+1]*Math.sin(th1)],
                   [xs[i],rs[i]*Math.cos(th1),rs[i]*Math.sin(th1)]];
          const pr=q.map(p=>project(cam,B,p));
          if(pr.some(p=>!p)) continue;
          const zm=(pr[0].z+pr[1].z+pr[2].z+pr[3].z)/4;
          /* Draw only the FAR half of the tube — we are looking at its inside.
             An opaque closed tube is geometrically correct and completely
             useless: it buries the rotor, which is the one object the view
             exists to show.  Culling by the outward radial direction (rather
             than a face normal, whose winding is easy to get backwards) leaves
             the near side open and the rotor visible inside.  This is why the
             quads can still be premixed and opaque, which is what keeps the
             seams from reading as corduroy. */
          const thm=(th0+th1)/2;
          const outward=[0,Math.cos(thm),Math.sin(thm)];
          const mid=[(xs[i]+xs[i+1])/2,
                     (rs[i]+rs[i+1])/2*Math.cos(thm),(rs[i]+rs[i+1])/2*Math.sin(thm)];
          const toEye=v3.norm(v3.sub(B.eye,mid));
          const facing=v3.dot(outward,toEye);
          if(facing>0) continue;                 // near side: leave it open
          const alpha=0.16+0.26*Math.abs(facing);
          /* Pre-mix against the page background and draw OPAQUE: an abutting
             quad mesh drawn at alpha < 1 with an overlap composites the seam
             twice and reads as corduroy.  (Known-bad list, shock_flow.html.) */
          const col=mix('#070b18',cA,alpha);
          push(zm,()=>{
            ctx.fillStyle=col; ctx.beginPath();
            ctx.moveTo(pr[0].x,pr[0].y);
            for(let k=1;k<4;k++) ctx.lineTo(pr[k].x,pr[k].y);
            ctx.closePath(); ctx.fill();
          });
        }
      }
      /* the silhouette of the tube, so the expansion is legible edge-on */
      for(const sgn of [1,-1]){
        const pts=[];
        for(let i=0;i<=NX;i++){
          const p=project(cam,B,[xs[i],0,sgn*rs[i]]);
          if(p) pts.push(p);
        }
        if(pts.length>2) push(-1e5,()=>{
          ctx.strokeStyle=rgba('#5ac8e0',.55); ctx.lineWidth=1.3;
          ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
          for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
          ctx.stroke();
        });
      }
    }

    /* --- bypass streamlines: continuity against the wall --- */
    if(!free&&st.showWalls){
      const C=st.tw*st.th, A=Math.PI*R*R;
      for(let k=0;k<10;k++){
        const th=TAU*k/10;
        const pts=[];
        for(let i=0;i<=NX;i++){
          const At=Math.PI*rs[i]*rs[i];
          const ub=(1*C-us[i]*At)/Math.max(C-At,1e-6);   // bypass speed ratio
          /* place the streamline midway between tube and wall, radially */
          const rw=Math.min(halfW,halfH);
          const rr=lerp(rs[i],rw,0.55);
          const p=project(cam,B,[xs[i],rr*Math.cos(th),rr*Math.sin(th)]);
          if(p) pts.push({p,ub});
        }
        if(pts.length>2) push(-9e4,()=>{
          for(let i=1;i<pts.length;i++){
            const u=pts[i].ub;
            ctx.strokeStyle=rgba(u>1.02?'#e8843a':'#3a4152', clamp(0.20+0.55*(u-1)*6,0.12,0.8));
            ctx.lineWidth=1.1;
            ctx.beginPath(); ctx.moveTo(pts[i-1].p.x,pts[i-1].p.y);
            ctx.lineTo(pts[i].p.x,pts[i].p.y); ctx.stroke();
          }
        });
      }
    }

    /* --- drifting tracer particles, advected by u(x) --- */
    if(st.showParticles){
      const NP=190;
      for(let i=0;i<NP;i++){
        /* deterministic pseudo-random seeding: no Math.random, so the picture
           is reproducible and the geometry harness can assert on it */
        const s1=((i*2654435761)%1000)/1000, s2=((i*40503)%997)/997, s3=((i*97)%89)/89;
        const rSeed=Math.sqrt(s1)*(free?R*2.6:Math.min(halfW,halfH)*0.92);
        const th=TAU*s2;
        /* integrate x forward with a phase offset so they spread out */
        let x=xLo+((t*st.speed*0.55+s3)%1)*(xHi-xLo);
        const inTube = rSeed < R*0.999;
        const idx=clamp(Math.round((x-xLo)/(xHi-xLo)*NX),0,NX);
        const rr = inTube ? rSeed*rs[idx]/R : rSeed;
        const u  = inTube ? us[idx] : (function(){
          const At=Math.PI*rs[idx]*rs[idx], C=free?1e9:st.tw*st.th;
          return free?1:(C-us[idx]*At)/Math.max(C-At,1e-6);
        })();
        const p=project(cam,B,[x,rr*Math.cos(th),rr*Math.sin(th)]);
        if(!p) continue;
        const col=inTube?speedCol(clamp(u,0,1)):(u>1.02?'#e8843a':'#6b7284');
        const rad=clamp(150/p.z,0.7,2.6);
        push(p.z,()=>{ ctx.fillStyle=col; ctx.globalAlpha=inTube?0.9:0.5;
          ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,TAU); ctx.fill(); ctx.globalAlpha=1; });
      }
    }

    /* --- the rotor: hub + twisted, tapered blades --- */
    {
      const geom=bladeGeom(st);
      const spin=st.anim? t*st.speed*(st.rpm*TAU/60)*0.10 : 0;
      for(let bI=0;bI<st.nB;bI++){
        const psi=TAU*bI/st.nB+spin;
        const NS=22;
        for(let i=0;i<NS;i++){
          const r0=lerp(st.rHub,R,i/NS), r1=lerp(st.rHub,R,(i+1)/NS);
          const g0=geom(r0), g1=geom(r1);
          /* chordwise extent, rotated by the local twist about the span axis */
          const seg=[];
          for(const [rr,gg,sgn] of [[r0,g0,-1],[r1,g1,-1],[r1,g1,1],[r0,g0,1]]){
            const tw=(gg.twist+st.pitch)*DEG;
            const cx=sgn*gg.c*0.5;
            /* blade lies in the rotor plane at azimuth psi; chord tilts into x */
            const yx=cx*Math.sin(tw);
            const inPlane=cx*Math.cos(tw);
            seg.push([yx, rr*Math.cos(psi)-inPlane*Math.sin(psi),
                          rr*Math.sin(psi)+inPlane*Math.cos(psi)]);
          }
          const pr=seg.map(p=>project(cam,B,p));
          if(pr.some(p=>!p)) continue;
          const zm=(pr[0].z+pr[1].z+pr[2].z+pr[3].z)/4;
          const nrm=v3.norm(v3.cross(v3.sub(seg[1],seg[0]),v3.sub(seg[3],seg[0])));
          const toEye=v3.norm(v3.sub(B.eye,seg[0]));
          const sh=0.34+0.62*Math.abs(v3.dot(nrm,toEye));
          const col=shade('#c8d0de',sh);
          push(zm,()=>{ ctx.fillStyle=col; ctx.beginPath();
            ctx.moveTo(pr[0].x,pr[0].y);
            for(let k=1;k<4;k++) ctx.lineTo(pr[k].x,pr[k].y);
            ctx.closePath(); ctx.fill(); });
        }
      }
      /* hub */
      const NH=16;
      for(let i=0;i<NH;i++){
        const t0=TAU*i/NH, t1=TAU*(i+1)/NH, rh=st.rHub*0.85;
        const q=[[-0.5,rh*Math.cos(t0),rh*Math.sin(t0)],[0.5,rh*Math.cos(t0),rh*Math.sin(t0)],
                 [0.5,rh*Math.cos(t1),rh*Math.sin(t1)],[-0.5,rh*Math.cos(t1),rh*Math.sin(t1)]];
        const pr=q.map(p=>project(cam,B,p));
        if(pr.some(p=>!p)) continue;
        const zm=(pr[0].z+pr[1].z+pr[2].z+pr[3].z)/4;
        push(zm,()=>{ ctx.fillStyle=shade('#8b93a6',0.35+0.4*Math.abs(Math.cos(t0)));
          ctx.beginPath(); ctx.moveTo(pr[0].x,pr[0].y);
          for(let k=1;k<4;k++) ctx.lineTo(pr[k].x,pr[k].y); ctx.closePath(); ctx.fill(); });
      }
    }

    items.sort((p,q)=>q.z-p.z);
    for(const it of items) it.fn();

    /* --- the 1-D speed profile, drawn as an inset over the 3-D --- */
    {
      const aw=Math.min(300,W*0.30), ah=96, ax0=68, ay0=H-ah-56;
      const ax=makeAxes(ax0,ay0,aw,ah,xLo/R,xHi/R,
                        Math.min(0.0,wEnd-0.12),Math.max(1.25,(free?1.05:1.35)));
      ctx.save(); ctx.fillStyle=rgba('#0a0c12',.78);
      ctx.fillRect(ax0-56,ay0-20,aw+72,ah+48); ctx.restore();
      drawFrame(ctx,ax,'x / R','u / U₀',{nx:5,ny:4});
      ctx.save(); frameClip(ctx,ax,1);
      plotLine(ctx,ax,xs.map((x,i)=>[x/R,us[i]]),'#5ac8e0',1.8);
      if(!free){
        const C=st.tw*st.th;
        const ub=xs.map((x,i)=>{ const At=Math.PI*rs[i]*rs[i];
          return [x/R,(C-us[i]*Math.PI*rs[i]*rs[i])/Math.max(C-At,1e-6)]; });
        plotLine(ctx,ax,ub,'#e8843a',1.4,[4,3]);
      }
      plotLine(ctx,ax,[[xLo/R,1],[xHi/R,1]],rgba('#b8ec4c',.5),1,[2,3]);
      plotLine(ctx,ax,[[0,ax.ylo],[0,ax.yhi]],rgba('#ffffff',.25),1);
      ctx.restore();
      label(ctx,ax0-52,ay0-10,'axial speed along the tunnel','#8b93a6','left','10.5px -apple-system');
      label(ctx,ax0-52,ay0+ah+34,free?'cyan: streamtube'
        :'cyan: streamtube    orange: bypass (accelerated by the walls)',
        '#6b7284','left','10px -apple-system');
    }

    /* --- corner annotations --- */
    ctx.save();
    ctx.font='11px -apple-system, sans-serif'; ctx.textAlign='right'; ctx.textBaseline='top';
    const lines=[
      'ā = '+fmt(aBar,3)+'   u_disc/U₀ = '+fmt(uDisc,3),
      'u_wake/U₀ = '+fmt(wEnd,3)+(free?'  (= 1−2a)':'  (duct cubic)'),
      free?'free air — no walls':'B = '+fmtPct(M.B)+'   ceiling '+fmt(M.ceiling,4),
    ];
    let yy=H-46;
    for(let i=lines.length-1;i>=0;i--){ ctx.fillStyle=i===2?'#e8843a':'#8b93a6';
      ctx.fillText(lines[i],W-16,yy); yy-=15; }
    ctx.restore();
    if(st.blade==='phase6'){
      label(ctx,W-16,20,'Phase VI endpoints published; span distribution reconstructed',
            '#6b7284','right','10px -apple-system');
    }
  }

  /* ---------------- the blade element ----------------
     Layout notes, all of them defects found by rasterising the display list:
      - the blade rendered edge-on under the tunnel view's camera, so this view
        keeps its OWN orbit angles, started face-on to the planform;
      - the velocity triangle is genuinely thin (phi is 10-15 deg at a working
        tip-speed ratio), so it is drawn large and its captions are placed
        OUTSIDE the triangle on fixed sides rather than at edge midpoints,
        where three of them landed on top of each other.                       */
  function drawBlade(ctx,W,H,M){
    const bem=M.bem, el=M.stEl, geom=bladeGeom(st);
    const leftW=Math.round(W*0.42);

    /* --- left: the blade planform, with the chosen station ringed --- */
    {
      const span=st.R-st.rHub;
      const cam2=makeCamera(bcam.theta,bcam.phi,span*2.1,[0,0,(st.rHub+st.R)/2]);
      cam2.W=leftW; cam2.H=H;
      const B2=camBasis(cam2);
      const items=[]; const NS=48;
      let hit=null;
      for(let i=0;i<NS;i++){
        const r0=lerp(st.rHub,st.R,i/NS), r1=lerp(st.rHub,st.R,(i+1)/NS);
        const g0=geom(r0), g1=geom(r1);
        const seg=[];
        for(const [rr,gg,sgn] of [[r0,g0,-1],[r1,g1,-1],[r1,g1,1],[r0,g0,1]]){
          const tw=(gg.twist+st.pitch)*DEG, cx=sgn*gg.c*0.5;
          seg.push([cx*Math.sin(tw), cx*Math.cos(tw), rr]);
        }
        const pr=seg.map(p=>project(cam2,B2,p));
        if(pr.some(p=>!p)) continue;
        const zm=(pr[0].z+pr[1].z+pr[2].z+pr[3].z)/4;
        const nrm=v3.norm(v3.cross(v3.sub(seg[1],seg[0]),v3.sub(seg[3],seg[0])));
        const toEye=v3.norm(v3.sub(B2.eye,seg[0]));
        const near=(el.r>=r0&&el.r<r1);
        if(near) hit=pr;
        const sh=0.30+0.62*Math.abs(v3.dot(nrm,toEye));
        const col=near?'#b8ec4c':shade('#c8d0de',sh);
        items.push({z:zm,fn:()=>{ ctx.fillStyle=col; ctx.beginPath();
          ctx.moveTo(pr[0].x,pr[0].y);
          for(let k=1;k<4;k++) ctx.lineTo(pr[k].x,pr[k].y);
          ctx.closePath(); ctx.fill(); }});
      }
      items.sort((p,q)=>q.z-p.z);
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,leftW,H); ctx.clip();
      for(const it of items) it.fn();
      if(hit){ ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(hit[0].x,hit[0].y);
        for(let k=1;k<4;k++) ctx.lineTo(hit[k].x,hit[k].y);
        ctx.closePath(); ctx.stroke(); }
      ctx.restore();
      label(ctx,16,22,'r/R = '+fmt(el.x,3),'#b8ec4c','left','13px -apple-system');
      label(ctx,16,40,'chord '+fmt(el.c,3)+' m    twist '+fmt(el.twist,2)+'°',
            '#8b93a6','left','11.5px -apple-system');
      label(ctx,16,H-20,'drag to orbit the blade · slider "blade station" moves the ring',
            '#6b7284','left','10.5px -apple-system');
    }

    /* --- right, upper: the velocity triangle --- */
    {
      const bx=leftW+34, by=54, bw=W-leftW-68, bh=Math.max(140,H*0.26);
      const Un=st.U*(1-el.a), Ut=(st.rpm*TAU/60)*el.r*(1+el.ap);
      const Wl=Math.hypot(Un,Ut)||1;
      /* scale so the LONG leg fills the box; the short leg then falls where the
         physics puts it — a thin triangle is the honest picture at high lambda */
      const sc=Math.min(bw*0.66/Math.max(Ut,1e-6), bh*0.62/Math.max(Un,1e-6));
      const ox=bx+56, oy=by+34;                       // triangle origin (top-left)
      const px=ox+Ut*sc, py=oy+Un*sc;                 // the right-angle corner is (ox,py)

      const arrow=(x0,y0,x1,y1,col,lw)=>{
        ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw||2;
        ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
        const a=Math.atan2(y1-y0,x1-x0), hl=9;
        ctx.beginPath(); ctx.moveTo(x1,y1);
        ctx.lineTo(x1-hl*Math.cos(a-0.4),y1-hl*Math.sin(a-0.4));
        ctx.lineTo(x1-hl*Math.cos(a+0.4),y1-hl*Math.sin(a+0.4));
        ctx.closePath(); ctx.fill(); ctx.restore();
      };
      arrow(ox,oy,ox,py,'#5ac8e0');                   // axial, downward
      arrow(ox,py,px,py,'#e5c94b');                   // tangential, rightward
      arrow(ox,oy,px,py,'#b8ec4c',2.6);               // relative wind W

      /* captions on fixed sides — never at edge midpoints, which collide */
      label(ctx,ox-10,(oy+py)/2,'U₀(1−a)','#5ac8e0','right','11.5px -apple-system');
      label(ctx,ox-10,(oy+py)/2+14,fmt(Un,2)+' m/s','#5ac8e0','right','11px -apple-system');
      label(ctx,(ox+px)/2,py+18,'Ωr(1+a′) = '+fmt(Ut,2)+' m/s','#e5c94b','center','11.5px -apple-system');
      label(ctx,(ox+px)/2,oy+(py-oy)/2-16,'W = '+fmt(Wl,2)+' m/s','#b8ec4c','center','12px -apple-system');
      label(ctx,ox+18,py-9,'φ = '+fmt(el.phi*RAD,1)+'°','#b8ec4c','left','11.5px -apple-system');

      /* the chord, drawn from the W line at the local angle of attack, with the
         section's own pitch — alpha is the gap between the two */
      const wAng=Math.atan2(py-oy,px-ox);
      const chordAng=wAng-el.alpha*DEG;
      const cxm=lerp(ox,px,0.62), cym=lerp(oy,py,0.62), cl=Math.min(bw*0.26,120);
      ctx.save(); ctx.strokeStyle='#cfd4de'; ctx.lineWidth=2.6; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(cxm-cl*Math.cos(chordAng),cym-cl*Math.sin(chordAng));
      ctx.lineTo(cxm+cl*Math.cos(chordAng),cym+cl*Math.sin(chordAng));
      ctx.stroke(); ctx.restore();
      label(ctx,cxm+cl*Math.cos(chordAng)+10,cym+cl*Math.sin(chordAng),
            'chord  β+θₚ = '+fmt(el.twist+st.pitch,1)+'°','#cfd4de','left','11px -apple-system');
      label(ctx,cxm-cl*Math.cos(chordAng)-16,cym-cl*Math.sin(chordAng)-24,
            'α = '+fmt(el.alpha,2)+'°',el.alpha>0?'#e8543a':'#8b93a6','right','13px -apple-system');
      label(ctx,bx,by-16,'the velocity triangle at this station','#8b93a6','left',
            'italic 12px Georgia, serif');
    }

    /* --- right, middle: how the solution varies along the span --- *
     * The triangle is one station; the design question is always the whole
     * blade, so the distributions go next to it.                            */
    {
      const gx=leftW+70, gy=Math.round(H*0.36), gw=W-leftW-140, gh=Math.round(H*0.20);
      let aMax=0.05, alMax=1;
      for(const e of bem.el){ aMax=Math.max(aMax,e.a); alMax=Math.max(alMax,Math.abs(e.alpha)); }
      const ax=makeAxes(gx,gy,gw,gh,0,1,0,Math.max(0.5,aMax*1.25));
      drawFrame(ctx,ax,'r / R','a  and  α/α_max',{nx:5,ny:4});
      ctx.save(); frameClip(ctx,ax,1);
      plotLine(ctx,ax,bem.el.map(e=>[e.x,e.a]),'#5ac8e0',2.0);
      plotLine(ctx,ax,bem.el.map(e=>[e.x,ax.yhi*Math.abs(e.alpha)/alMax]),'#e8543a',1.6,[4,3]);
      plotLine(ctx,ax,[[0,1/3],[1,1/3]],rgba('#b8ec4c',.55),1.2,[6,4]);
      plotDot(ctx,ax,el.x,el.a,'#ffffff',3.8,'#b8ec4c');
      ctx.restore();
      label(ctx,gx,gy-12,'along the span','#8b93a6','left','italic 11.5px Georgia, serif');
      let kx=gx+130;
      const key=(col,txt,dash)=>{
        ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.setLineDash(dash||[]);
        ctx.beginPath(); ctx.moveTo(kx,gy-12); ctx.lineTo(kx+16,gy-12); ctx.stroke();
        ctx.font='10px -apple-system, sans-serif'; const wpx=ctx.measureText(txt).width;
        ctx.restore();
        label(ctx,kx+21,gy-12,txt,'#8b93a6','left','10px -apple-system');
        kx+=21+wpx+18;
      };
      key('#5ac8e0','a');
      key('#e8543a','α (scaled, max '+fmt(alMax,1)+'°)',[4,3]);
      key('#b8ec4c','a = 1/3',[6,4]);
    }

    /* --- right, lower: what the element hands back --- */
    {
      const tx=leftW+34; let ty=Math.round(H*0.68);
      label(ctx,tx,ty-24,'what this element returns','#8b93a6','left',
            'italic 12px Georgia, serif');
      const put=(k,v,c)=>{ label(ctx,tx,ty,k,'#767e92','left','11.5px -apple-system');
        label(ctx,tx+238,ty,v,c||'#cfd4de','right','11.5px -apple-system'); ty+=18; };
      put('a  (axial induction)',fmt(el.a,4),el.a>A_MATCH?'#e8843a':'#b8ec4c');
      put('a′ (tangential)',fmt(el.ap,4));
      put('C_l',fmt(el.cl,3));
      put('C_d',fmt(el.cd,4));
      put('L/D',isFinite(el.ld)?fmt(el.ld,1):'∞');
      put('Prandtl F',fmt(el.F,4));
      put('chord Reynolds',fmtRe(el.Re));
      put('dT/dr',fmt(el.dT,1)+' N/m');
      put('dQ/dr',fmt(el.dQ,1)+' N');
      if(el.a>A_MATCH){ ty+=4;
        label(ctx,tx,ty,'a > 0.4 — momentum theory replaced by Buhl here',
              '#e8843a','left','10.5px -apple-system'); }
    }
    ctx.save(); ctx.strokeStyle='#1e222c'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(leftW,0); ctx.lineTo(leftW,H); ctx.stroke(); ctx.restore();
  }

  /* ---------------- the polar ---------------- */
  function drawPolar(ctx,W,H,M){
    const f=M.foil, el=M.stEl;
    const wide=st.polarFull;
    const aLo=wide?-180:-20, aHi=wide?180:30;
    const padL=64, padR=28, padT=44, padB=86;
    const colW=(W-padL-padR-76)/2;
    const axL=makeAxes(padL,padT,colW,H-padT-padB,aLo,aHi,-1.6,1.9);
    const axD=makeAxes(padL+colW+76,padT,colW,H-padT-padB,aLo,aHi,0,wide?2.2:0.30);

    drawFrame(ctx,axL,'angle of attack α (deg)','C_l',{nx:6,ny:6});
    drawFrame(ctx,axD,'angle of attack α (deg)','C_d',{nx:6,ny:6});

    const Re=st.reScale?el.Re:f.ReRef;
    const opt={reScale:st.reScale,Re,cdMax:st.cdMax};
    const sc=st.reScale?reScale(f,Re):{clMax:f.clMax,aStall:f.aStall,cd0:f.cd0};

    /* split the curve by region so the modelled parts can be drawn differently */
    const segs={lin:[],bend:[],viterna:[],reversed:[]};
    const segsD={lin:[],bend:[],viterna:[],reversed:[]};
    let prev=null;
    for(let i=0;i<=720;i++){
      const a=lerp(aLo,aHi,i/720);
      const p=polar(f,a,opt);
      for(const k in segs){ if(k!==p.region){ segs[k].push([NaN,NaN]); segsD[k].push([NaN,NaN]); } }
      segs[p.region].push([a,p.cl]); segsD[p.region].push([a,p.cd]);
    }
    ctx.save(); frameClip(ctx,axL,1);
    plotLine(ctx,axL,segs.lin,'#b8ec4c',2.0);
    plotLine(ctx,axL,segs.bend,'#e5c94b',2.0);
    plotLine(ctx,axL,segs.viterna,'#5ac8e0',1.8);
    plotLine(ctx,axL,segs.reversed,'#cd35c4',1.5,[5,4]);
    plotLine(ctx,axL,[[aLo,0],[aHi,0]],rgba('#ffffff',.18),1);
    /* measured anchors, ringed */
    plotDot(ctx,axL,f.a0,0,'#ffffff',3.4,'#b8ec4c');
    plotDot(ctx,axL,sc.aStall,sc.clMax,'#ffffff',3.4,'#e5c94b');
    /* the station's current operating point */
    plotDot(ctx,axL,el.alpha,el.cl,'#e8543a',4.2,'#e8543a');
    ctx.restore();

    ctx.save(); frameClip(ctx,axD,1);
    plotLine(ctx,axD,segsD.lin,'#b8ec4c',2.0);
    plotLine(ctx,axD,segsD.bend,'#e5c94b',2.0);
    plotLine(ctx,axD,segsD.viterna,'#5ac8e0',1.8);
    plotLine(ctx,axD,segsD.reversed,'#cd35c4',1.5,[5,4]);
    plotDot(ctx,axD,f.a0,sc.cd0,'#ffffff',3.4,'#b8ec4c');
    plotDot(ctx,axD,el.alpha,el.cd,'#e8543a',4.2,'#e8543a');
    if(wide){ plotDot(ctx,axD,90,st.cdMax,'#ffffff',3.4,'#5ac8e0'); }
    ctx.restore();

    /* legend + provenance.  padB leaves a band below the axis caption for this
       row; sharing that band with the caption put "Viterna extrapolation"
       straight through "angle of attack". */
    let ty=H-40;
    const key=(x,col,txt,dash)=>{
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.setLineDash(dash||[]);
      ctx.beginPath(); ctx.moveTo(x,ty); ctx.lineTo(x+18,ty); ctx.stroke(); ctx.restore();
      label(ctx,x+24,ty,txt,'#8b93a6','left','10.5px -apple-system');
      ctx.save(); ctx.font='10.5px -apple-system, sans-serif';
      const wpx=ctx.measureText(txt).width; ctx.restore();
      return x+24+wpx+22;
    };
    let x=padL;
    x=key(x,'#b8ec4c','linear (measured slope)');
    x=key(x,'#e5c94b','bend onto C_l,max');
    x=key(x,'#5ac8e0','Viterna extrapolation');
    x=key(x,'#cd35c4','reversed flow (convention)',[5,4]);
    label(ctx,padL,padT-26,f.name+'   —   '+f.src,'#8b93a6','left','11.5px -apple-system');
    label(ctx,W-padR,padT-26,
      (st.reScale?'scaled to Re = '+fmtRe(Re)+' (ref '+fmtRe(f.ReRef)+')':'at the reference Re = '+fmtRe(f.ReRef)),
      st.reScale?'#e5c94b':'#6b7284','right','11px -apple-system');
    label(ctx,W-padR,padT-10,'ringed points are the cited anchors; the curve between them is the model',
      '#6b7284','right','10px -apple-system');
    label(ctx,padL,H-16,'C_l,max = '+fmt(sc.clMax,3)+' at α = '+fmt(sc.aStall,1)
      +'°     C_d,min = '+fmt(sc.cd0,5)+'     operating α = '+fmt(el.alpha,2)+'° at r/R = '+fmt(el.x,2),
      '#767e92','left','11px -apple-system');
  }

  /* ---------------- power: CP against tip-speed ratio ---------------- */
  function drawPower(ctx,W,H,M){
    const padL=68, padR=232, padT=40, padB=54;
    const topH=(H-padT-padB)*0.62, gap=42;
    const axP=makeAxes(padL,padT,W-padL-padR,topH,0,16.5,0,Math.max(0.78,M.ceiling*1.12));
    const axT=makeAxes(padL,padT+topH+gap,W-padL-padR,(H-padT-padB)-topH-gap,0,16.5,0,1.6);
    drawFrame(ctx,axP,'','C_P',{nx:8,ny:5});
    drawFrame(ctx,axT,'tip-speed ratio λ = ΩR / U₀','C_T',{nx:8,ny:5});

    ctx.save(); frameClip(ctx,axP,1);
    /* reference ceilings */
    plotLine(ctx,axP,[[0,16/27],[16.5,16/27]],rgba('#b8ec4c',.75),1.5,[6,4]);
    if(!M.free) plotLine(ctx,axP,[[0,M.ceiling],[16.5,M.ceiling]],rgba('#e8843a',.85),1.6,[3,3]);
    plotLine(ctx,axP,M.glau.map(g=>[g.lam,g.CP]),rgba('#5ac8e0',.85),1.7);
    /* the BEM sweep, split at the first stalled point */
    const pre=[], post=[];
    for(const s of M.sweep){ (s.stall?post:pre).push([s.lam,s.CP]); }
    plotLine(ctx,axP,M.sweep.map(s=>[s.lam,s.CP]),'#cfd4de',2.2);
    plotLine(ctx,axP,post,'#e8543a',2.2);
    plotDot(ctx,axP,M.bem.lam,M.bem.CP,'#e8543a',4.6,'#ffffff');
    ctx.restore();

    ctx.save(); frameClip(ctx,axT,1);
    plotLine(ctx,axT,M.sweep.map(s=>[s.lam,s.CT]),'#cfd4de',2.0);
    plotLine(ctx,axT,[[0,8/9],[16.5,8/9]],rgba('#b8ec4c',.5),1.2,[4,4]);
    plotDot(ctx,axT,M.bem.lam,M.bem.CT,'#e8543a',4.2,'#ffffff');
    ctx.restore();
    label(ctx,axT.X(16.2),axT.Y(8/9)-9,'8/9 at Betz','#8b93a6','right','10px -apple-system');

    /* legend column */
    const lx=W-padR+18; let ly=padT+8;
    const put=(col,txt,dash,lw)=>{
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||2.2; ctx.setLineDash(dash||[]);
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+20,ly); ctx.stroke(); ctx.restore();
      label(ctx,lx+27,ly,txt,'#8b93a6','left','10.5px -apple-system'); ly+=17;
    };
    label(ctx,lx,ly-16,'ceilings','#767e92','left','italic 11px Georgia, serif');
    put('#b8ec4c','Betz 16/27 = '+fmt(16/27,4),[6,4]);
    if(!M.free) put('#e8843a','in-tunnel '+fmt(M.ceiling,4),[3,3]);
    put('#5ac8e0','Glauert optimum');
    ly+=8;
    label(ctx,lx,ly-2,'this rotor','#767e92','left','italic 11px Georgia, serif'); ly+=14;
    put('#cfd4de','BEM, attached');
    put('#e8543a','BEM, past stall');
    ly+=10;
    const colW=W-lx-16;
    const box=(txt,col)=>{ for(const l of wrapText(ctx,txt,colW,'10px -apple-system')){
      label(ctx,lx,ly,l,col||'#6b7284','left','10px -apple-system'); ly+=13; } };
    box('Past stall BEM is not to be trusted: real stall-regulated rotors carry '
       +'spanwise flow that BEM has no term for.','#e8843a');
    ly+=6;
    box('Operating point λ = '+fmt(M.bem.lam,2)+', C_P = '+fmt(M.bem.CP,4)
       +(M.free?'':', corrected to free air '+fmt(M.CPcorr,4))+'.');
    if(M.bem.CP>16/27&&!M.free){ ly+=4;
      box('C_P exceeds Betz because the walls are doing work on the streamtube — '
         +'that is the blockage, not a broken rotor.','#e8843a'); }
    if(M.bem.aboveMatch){ ly+=4;
      box('Some annuli run a > 0.4; those use Buhl, not momentum theory.','#e8843a'); }
  }

  /* ---------------- blockage: the correction, exactly ---------------- */
  function drawBlockage(ctx,W,H,M){
    const padL=68, padR=224, padT=40, padB=54;
    const topH=(H-padT-padB)*0.56, gap=44;
    const axC=makeAxes(padL,padT,W-padL-padR,topH,0,0.30,0.5,1.30);
    const axA=makeAxes(padL,padT+topH+gap,W-padL-padR,(H-padT-padB)-topH-gap,0,0.30,0.30,0.52);
    drawFrame(ctx,axC,'','ceiling on C_P',{nx:6,ny:5});
    drawFrame(ctx,axA,'blockage  B = A_rotor / A_section','optimal a*',{nx:6,ny:5});

    ctx.save(); frameClip(ctx,axC,1);
    plotLine(ctx,axC,M.blk.map(b=>[b.B,b.ceil]),'#e8843a',2.2);
    plotLine(ctx,axC,[[0,16/27],[0.30,16/27]],rgba('#b8ec4c',.75),1.5,[6,4]);
    /* the same curve computed by MAXIMISING the duct solution numerically, so
       the exact law is drawn against an independent evaluation of itself */
    const num=[];
    for(let i=0;i<=30;i++){ const b=i*0.30/30;
      let best=0; for(let j=0;j<=400;j++){ const a=j*0.75/400;
        const d=ductDisc(b,a); if(isFinite(d.CP)&&d.CP>best) best=d.CP; }
      num.push([b,best]); }
    for(const p of num) plotDot(ctx,axC,p[0],p[1],rgba('#5ac8e0',.9),2.4);
    if(!M.free) plotDot(ctx,axC,M.B,M.ceiling,'#ffffff',4.4,'#e8843a');
    ctx.restore();

    ctx.save(); frameClip(ctx,axA,1);
    plotLine(ctx,axA,M.blk.map(b=>[b.B,b.aStar]),'#cd35c4',2.2);
    plotLine(ctx,axA,[[0,1/3],[0.30,1/3]],rgba('#b8ec4c',.6),1.3,[6,4]);
    if(!M.free) plotDot(ctx,axA,M.B,M.aStar,'#ffffff',4.4,'#cd35c4');
    ctx.restore();

    const lx=W-padR+18; let ly=padT+10;
    const put=(col,txt,dash,dot)=>{
      ctx.save();
      if(dot){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(lx+10,ly,2.6,0,TAU); ctx.fill(); }
      else { ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.setLineDash(dash||[]);
        ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+20,ly); ctx.stroke(); }
      ctx.restore();
      label(ctx,lx+27,ly,txt,'#8b93a6','left','10.5px -apple-system'); ly+=17;
    };
    put('#e8843a','(16/27)(1−B)⁻²  exact');
    put('#5ac8e0','max over a, numerically',null,true);
    put('#b8ec4c','Betz, free air',[6,4]);
    ly+=6;
    put('#cd35c4','a* = (1+3B)/(3(1+B))');
    ly+=12;
    const colW=W-lx-16;
    const wrap=(txt,col)=>{ for(const l of wrapText(ctx,txt,colW,'10px -apple-system')){
      label(ctx,lx,ly,l,col||'#6b7284','left','10px -apple-system'); ly+=13; } };
    wrap('The dots are the duct cubic maximised numerically over the loading. '
        +'They lie on the closed form to 1e-15 — it is an identity, not a fit.');
    ly+=8;
    if(!M.free){
      wrap('This section: B = '+fmtPct(M.B)+', ceiling '+fmt(M.ceiling,4)+', '
          +'an inflation of '+fmtPct(M.overRead)+' over Betz.','#e8843a');
      ly+=6;
      wrap('NASA Ames 80×120 with the Phase VI rotor is B = 8.90% — the largest '
          +'wind tunnel on earth, and still a fifth of the answer.');
    } else {
      wrap('Free air selected: B = 0 and the ceiling is Betz. Switch the test '
          +'section back on to see the walls enter.');
    }
  }

  /* ---------------- design: the blade you have vs the blade you want ------- */
  function drawDesign(ctx,W,H,M){
    const padL=68, padR=220, padT=40, padB=54;
    const topH=(H-padT-padB)*0.5, gap=44;
    const axC=makeAxes(padL,padT,W-padL-padR,topH,0,1,0,Math.max(1.1,st.cRoot*1.7));
    const axT=makeAxes(padL,padT+topH+gap,W-padL-padR,(H-padT-padB)-topH-gap,0,1,-6,30);
    drawFrame(ctx,axC,'','chord c (m)',{nx:6,ny:5});
    drawFrame(ctx,axT,'r / R','twist β (deg)',{nx:6,ny:5});

    const cur=bladeGeom(st);
    const optSt=Object.assign({},st,{blade:'betz'});
    const opt=bladeGeom(optSt);
    const xs=[]; for(let i=0;i<=120;i++) xs.push(lerp(st.rHub/st.R,1,i/120));

    ctx.save(); frameClip(ctx,axC,1);
    plotLine(ctx,axC,xs.map(x=>[x,cur(x*st.R).c]),'#cfd4de',2.2);
    plotLine(ctx,axC,xs.map(x=>[x,opt(x*st.R).c]),'#b8ec4c',1.8,[5,4]);
    ctx.restore();
    ctx.save(); frameClip(ctx,axT,1);
    plotLine(ctx,axT,xs.map(x=>[x,cur(x*st.R).twist]),'#cfd4de',2.2);
    plotLine(ctx,axT,xs.map(x=>[x,opt(x*st.R).twist]),'#b8ec4c',1.8,[5,4]);
    plotLine(ctx,axT,[[0,0],[1,0]],rgba('#ffffff',.18),1);
    ctx.restore();

    /* what the optimum blade would actually deliver, run through the same BEM */
    const mOpt=runBEM(optSt);
    const lx=W-padR+16; let ly=padT+10;
    const put=(col,txt,dash)=>{
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.setLineDash(dash||[]);
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+20,ly); ctx.stroke(); ctx.restore();
      label(ctx,lx+27,ly,txt,'#8b93a6','left','10.5px -apple-system'); ly+=17;
    };
    put('#cfd4de',BLADES.find(b=>b.id===st.blade).name);
    put('#b8ec4c','Glauert optimum',[5,4]);
    ly+=12;
    const rowv=(k,v,c)=>{ label(ctx,lx,ly,k,'#767e92','left','10.5px -apple-system');
      label(ctx,lx+168,ly,v,c||'#cfd4de','right','10.5px -apple-system'); ly+=16; };
    label(ctx,lx,ly,'at λ = '+fmt(M.bem.lam,2),'#8b93a6','left','italic 11px Georgia, serif'); ly+=18;
    rowv('C_P, this blade',fmt(M.bem.CP,4));
    rowv('C_P, optimum',fmt(mOpt.CP,4),'#b8ec4c');
    const gain=mOpt.CP-M.bem.CP;
    rowv('difference',(gain>=0?'+':'')+fmt(gain,4),gain>0?'#b8ec4c':'#e8843a');
    rowv('power, this blade',fmtPow(M.bem.P));
    rowv('power, optimum',fmtPow(mOpt.P),'#b8ec4c');
    ly+=8;
    const colW=W-lx-16;
    const wrap=(txt,col)=>{ for(const l of wrapText(ctx,txt,colW,'10px -apple-system')){
      label(ctx,lx,ly,l,col||'#6b7284','left','10px -apple-system'); ly+=13; } };
    wrap('The optimum chord blows up at the root because the ideal law ignores '
        +'structure and cost; real blades truncate it, which is most of the gap.');
    if(st.blade==='phase6'){ ly+=6;
      wrap('Phase VI: endpoints are the published spec, the distribution between '
          +'them is reconstructed — not the NREL table.','#e8843a'); }
  }

  /* ---------------- dispatch, camera, animation ---------------- */
  function draw(){
    const ctx=canvas.getContext('2d');
    const W=cam.W, Hh=cam.H;
    ctx.clearRect(0,0,W,Hh);
    ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,Hh);
    const M=model();
    drawView(ctx,W,Hh,M);
  }
  /* the geometry harness calls this directly with a recording ctx */
  function drawView(ctx,W,Hh,M){
    const v=(M&&M.st?M.st.view:st.view);
    if(v==='tunnel')        drawTunnel(ctx,W,Hh,M);
    else if(v==='blade')    drawBlade(ctx,W,Hh,M);
    else if(v==='polar')    drawPolar(ctx,W,Hh,M);
    else if(v==='power')    drawPower(ctx,W,Hh,M);
    else if(v==='blockage') drawBlockage(ctx,W,Hh,M);
    else                    drawDesign(ctx,W,Hh,M);
  }

  return {
    st, cam, model, rebuild, draw, drawView,
    readout:()=>readoutHTML(model()),
    eqbar:()=>eqbarHTML(model()),
    tag:()=>tagHTML(model()),
    step(dt){ if(st.anim) t+=dt; if(st.spin) cam.theta+=dt*0.16; },
    pointer(kind,d){
      if(kind!=='move') return;
      const c = st.view==='blade' ? bcam : cam;
      c.theta-=d.dx*0.006;
      c.phi=clamp(c.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),4,220); },
    /* The section is many rotor radii across — at Phase VI blockage the rotor
       is a seventh of the width — so a fixed camera distance either buries the
       tunnel or loses the rotor.  Frame the actual scene extent instead. */
    fit(){
      const R=st.R, free=st.tunnel==='free';
      const halfW=free?R*3.2:st.tw/2, halfH=free?R*3.2:st.th/2;
      const ext=Math.max(halfW,halfH,4.0*R);
      cam.dist=clamp(1.25*ext/Math.tan(cam.fov/2),4,4000);
      cam.target=[R*0.6,0,0];
    },
    resetView(){ cam.theta=-2.30; cam.phi=0.30; bcam.theta=0.28; bcam.phi=0.16;
      this.fit(); },
    lookAxial(){ cam.theta=Math.PI; cam.phi=0.0; },
  };
}

/* the blade presets, referenced by the design view and the panel */
const BLADES=[
  {id:'phase6', name:'NREL Phase VI'},
  {id:'betz',   name:'Glauert optimum'},
  {id:'linear', name:'linear taper'},
  {id:'flat',   name:'untapered, untwisted'},
];
const TUNNELS=[
  {id:'closed', name:'NASA Ames 80×120', w:24.4, h:36.6},
  {id:'small',  name:'2 × 3 m lab tunnel', w:2.0,  h:3.0},
  {id:'medium', name:'5 × 5 m tunnel',     w:5.0,  h:5.0},
  {id:'free',   name:'free air',           w:0,    h:0},
];

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['tunnel','the tunnel'],['blade','the blade'],['polar','the polar'],
              ['power','power'],['blockage','blockage'],['design','design']];
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab,rebuild){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(rebuild!==false) S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{

    rows.cTip.row.hidden  = (st.blade!=='linear'&&st.blade!=='flat');
    rows.twRoot.row.hidden= st.blade!=='linear';
    rows.twTip.row.hidden = st.blade!=='linear';
    rows.alphaDes.row.hidden = st.blade!=='betz';
    rows.cdMax.row.hidden = !st.polarFull;

      inp.checked=st[['showTube','showWalls','showParticles','showGrid','anim','spin'][i]]; });

  function refresh(){

      const M=S.model(), b=M.bem;
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();

      windTag.innerHTML='&rho; = <b>'+fmt(M.rho,4)+'</b> kg/m³ &nbsp; &lambda; = <b>'
        +fmt(b.lam,2)+'</b> &nbsp; tip <b>'+fmt(b.tipSpeed,1)+'</b> m/s (M '+fmt(b.tipMach,3)+')';
      rotTag.innerHTML='swept area <b>'+fmt(M.A,2)+'</b> m² &nbsp; solidity <b>'
        +fmt(st.nB*(st.cRoot+st.cTip)/2/(Math.PI*st.R),4)+'</b>';
      bladeTag.innerHTML='C<sub>P</sub> <b>'+fmt(b.CP,4)+'</b>'
        +(M.free?'':' &nbsp; corrected <b class="g">'+fmt(M.CPcorr,4)+'</b>')
        +' &nbsp; P <b>'+fmtPow(b.P)+'</b>'
        +(st.blade==='phase6'?'<br><span class="r">span distribution reconstructed, not the NREL table</span>':'');
      foilTag.innerHTML=M.foil.src;
      physTag.innerHTML='max induction a = <b>'+fmt(b.worstA,3)+'</b>'
        +(b.aboveMatch?' <span class="r">— Buhl active</span>':'')
        +(b.anyStall?'<br><span class="r">some sections are stalled — BEM is unreliable there</span>':'');
      infoEl.innerHTML=INFO[st.view]||INFO.tunnel;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* Moving the camera is not the same as repainting it: the frame loop only
     redraws while something is animating, so every interaction that touches the
     camera must ask for a frame.  (steam_carnot_cycle.html Known-bad list.) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='a'){ S.lookAxial(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='6'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(((st.anim||st.spin)&&(st.view==='tunnel'||st.view==='blade'))||dirty){
      dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

const INFO={

    +'the bypass flow between the tube and the wall must speed up, its static pressure falls, '
    +'and that suction draws <b>more</b> mass through the disc than the same rotor would take '
    +'in the open. The tunnel therefore reads high — and the inset shows exactly that, the '
    +'bypass line climbing above 1 as the streamtube fattens.',
  blade:'Blade element momentum is two statements about the same annulus. The <b>blade</b> side '
    +'says the section sees a relative wind W at angle φ, meets it at angle of attack α, and '
    +'returns lift and drag. The <b>momentum</b> side says the thrust that produces must equal '
    +'what the flow through that annulus gives up. Solving them together fixes a and a′. Here '

  polar:'This is the one place real wind-tunnel data enters. The <b>ringed points</b> are '

/* ================================================================== *
 *  self-test                                                          *
 * ================================================================== */
function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond){ pass++; } else { fail++; console.log('FAIL — '+name); } };
  const chk=(name,got,want,tol,rel)=>{
    const e=rel?Math.abs(got-want)/Math.abs(want):Math.abs(got-want);
    if(e<=tol) pass++; else { fail++;
      console.log('FAIL — '+name+': got '+Number(got).toPrecision(12)
                  +' want '+Number(want).toPrecision(12)+' err '+e.toExponential(3)); } };

  /* ---------- colour parsing: mix() output must be legal mix() input ------- */
  ok(toRgb('#b8ec4c').join()==='184,236,76','toRgb parses #rrggbb');
  ok(toRgb('rgb(58,111,142)').join()==='58,111,142','toRgb parses rgb()');
  ok(toRgb(mix('#070b18','#b8ec4c',0.4)).length===3,'mix output re-parses');
  { let threw=false; try{ toRgb('chartreuse'); }catch(e){ threw=true; }
    ok(threw,'toRgb THROWS on an unparseable colour rather than defaulting to black'); }
  { /* brightness per band, not colour syntax: a two-stage blend must not go black */
    const c=toRgb(shade(mix('#cd35c4','#d8f59a',0.5),0.9));
    ok(c[0]+c[1]+c[2]>150,'two-stage blend stays bright (not the rgb(0,0,0) failure)'); }

  /* ---------- the cubic solver against the ORIGINAL momentum residual ------ */
  { let worst=0;
    const resid=(w,B,a)=>{ const k=B*(1-a), be=w*(1-k)/(w-k), b=k/w, CT=be*be-w*w;
      return 0.5*(be*be-1)-0.5*B*CT-(w*w*b+be*be*(1-b)-1); };
    for(const B of [0.005,0.02,0.05,0.0889696,0.15,0.25,0.35]){
      for(let i=1;i<=60;i++){ const a=i*0.6/60;
        const w=wakeSpeed(B,a);
        if(!isFinite(w)) { fail++; console.log('FAIL — no wake root at B='+B+' a='+a); continue; }
        worst=Math.max(worst,Math.abs(resid(w,B,a)));
      } }
    ok(worst<1e-12,'cubic root satisfies the original duct momentum residual (worst '
       +worst.toExponential(2)+')'); }

  /* ---------- B -> 0 reproduces the classical actuator disc --------------- */
  { /* At B = 0 the duct solution must BE the classical disc, to machine
       precision.  Away from zero it must NOT be — the walls change the answer —
       so the honest statement about the limit is that the deviation is O(B).
       That is asserted by measuring the deviation at two blockages a factor 100
       apart and checking the ratio is 100.  An absolute tolerance here would
       only be measuring how close to a = 1/2 the sweep happens to run: the
       sensitivity dw/dB grows without bound as the wake speed goes to zero, so
       a tight absolute bound at B = 1e-7 fails on physics, not on arithmetic. */
    let worst0=0;
    for(let i=1;i<=48;i++){ const a=i*0.48/48;
      const d=ductDisc(0,a);
      worst0=Math.max(worst0,Math.abs(d.w-(1-2*a)),Math.abs(d.CT-4*a*(1-a)),
                      Math.abs(d.CP-4*a*(1-a)*(1-a))); }
    ok(worst0<1e-15,'at B=0 the duct solution IS the classical disc (worst '
       +worst0.toExponential(2)+')');
    let worstRatio=0, worstAt=0;
    for(let i=1;i<=24;i++){ const a=i*0.46/24;
      const d1=Math.abs(ductDisc(1e-9,a).w-(1-2*a));
      const d2=Math.abs(ductDisc(1e-7,a).w-(1-2*a));
      if(d1>1e-13){ const rel=Math.abs(d2/d1-100)/100;
        if(rel>worstRatio){ worstRatio=rel; worstAt=a; } } }
    ok(worstRatio<1e-3,'and the deviation from it is O(B): 100x the blockage gives '
       +'100x the deviation (worst rel '+worstRatio.toExponential(2)
       +' at a='+worstAt.toFixed(3)+')'); }
  chk('Betz: max of 4a(1-a)^2',4*(1/3)*(2/3)*(2/3),16/27,1e-15,false);
  { let best=0,bestA=0;
    for(let i=0;i<=200000;i++){ const a=i*0.6/200000, cp=4*a*(1-a)*(1-a);
      if(cp>best){ best=cp; bestA=a; } }
    chk('Betz maximum, found numerically',best,16/27,1e-10,false);
    chk('and it happens at a = 1/3',bestA,1/3,1e-5,false); }

  /* ---------- the two exact laws, against an independent maximisation ------ */
  { let worstC=0, worstA=0;
    for(const B of [0.001,0.01,0.02,0.05,0.0889696,0.12,0.2,0.3,0.4,0.5]){
      let best=-1,bestA=0;
      for(let i=0;i<=24000;i++){ const a=i*0.8/24000;
        const d=ductDisc(B,a);
        if(isFinite(d.CP)&&d.CP>best){ best=d.CP; bestA=a; } }
      worstC=Math.max(worstC,Math.abs(best/betzInTunnel(B)-1));
      worstA=Math.max(worstA,Math.abs(bestA-aStarInTunnel(B)));
    }
    ok(worstC<1e-9,'CP_max(B) = (16/27)(1-B)^-2 exactly (worst rel '
       +worstC.toExponential(2)+')');
    ok(worstA<1e-4,'a*(B) = (1+3B)/(3(1+B)) (worst abs '+worstA.toExponential(2)+')'); }
  chk('the tunnel law reduces to Betz at B=0',betzInTunnel(0),16/27,1e-15,false);
  chk('and a* reduces to 1/3 at B=0',aStarInTunnel(0),1/3,1e-15,false);
  chk('NASA Ames 80x120 with the Phase VI rotor: B',
      Math.PI*RIG.R*RIG.R/(RIG.tunnelW*RIG.tunnelH),0.08897,1e-5,false);
  chk('...and the ceiling there',betzInTunnel(Math.PI*RIG.R*RIG.R/(RIG.tunnelW*RIG.tunnelH)),
      0.713987,1e-5,false);

  /* ---------- monotonicity, which the bisection in inverseCT relies on ----- */
  { let bad=0;
    for(const B of [0,0.05,0.2]){ let prev=-1;
      for(let i=0;i<=200;i++){ const a=i*0.99/200, ct=momentumCT(a,1,B);
        if(!(ct>=prev-1e-12)) bad++; prev=ct; } }
    ok(bad===0,'momentumCT is monotone in a — inverseCT bisection is valid'); }
  { let worst=0;
    for(const B of [0,0.05,0.2]) for(const F of [1,0.7])
      for(let i=1;i<=40;i++){ const a=i*0.9/40, ct=momentumCT(a,F,B);
        worst=Math.max(worst,Math.abs(momentumCT(inverseCT(ct,F,B),F,B)-ct)); }
    ok(worst<1e-9,'inverseCT round-trips (worst '+worst.toExponential(2)+')'); }

  /* ---------- the axial profile: three anchors, and the free-air reduction - */
  { const R=5, a=0.3, wEnd=0.35;
    chk('axial profile far upstream = U0',axialProfile(-1e7,R,a,wEnd),1,1e-6,false);
    chk('axial profile at the disc = 1-a',axialProfile(0,R,a,wEnd),1-a,1e-12,false);
    chk('axial profile far downstream = duct wake',axialProfile(1e7,R,a,wEnd),wEnd,1e-6,false);
    let worst=0;
    for(let i=-40;i<=40;i++){ const x=i*R/4;
      const got=axialProfile(x,R,a),      // wEnd omitted -> free air
            want=1-a*(1+x/Math.sqrt(x*x+R*R));
      worst=Math.max(worst,Math.abs(got-want)); }
    ok(worst<1e-14,'in free air the profile IS the vortex-cylinder closed form (worst '
       +worst.toExponential(2)+')'); }
  { /* the streamtube obeys continuity by construction */
    const R=5,a=0.3,uD=1-a; let worst=0;
    for(let i=-20;i<=20;i++){ const x=i*R/3, u=axialProfile(x,R,a);
      const r=tubeRadius(u,uD,R);
      worst=Math.max(worst,Math.abs(Math.PI*r*r*u-Math.PI*R*R*uD)); }
    ok(worst<1e-10,'streamtube area x speed is constant (worst '+worst.toExponential(2)+')'); }

  /* ---------- Glauert's optimum rotor ------------------------------------- */
  { chk('Glauert optimum tends to Betz (lambda=400)',glauertCP(400,4000),16/27,3e-4,false);
    ok(glauertCP(400,4000)<16/27+1e-12,'...and never exceeds it');
    ok(glauertCP(1e4,4000)<16/27+1e-12,'...nor does it at lambda = 1e4');
    let mono=true, prev=-1;
    for(let i=1;i<=60;i++){ const cp=glauertCP(0.4+i*0.25,600);
      if(cp<prev-1e-9) mono=false; prev=cp; }
    ok(mono,'Glauert CP is monotone increasing in lambda');
    /* Two quadratures of the same integral — Simpson in v = lam_r/lambda, and
       the trapezoid rule in the original variable a with the analytic
       d lam_r/da.  Different variable, different rule; agreement is evidence
       the integration is right rather than merely self-consistent. */
    let worstQ=0;
    for(const lam of [0.5,1,1.5,2,2.5,5,7.5,10]){
      worstQ=Math.max(worstQ,Math.abs(glauertCP(lam,2000)-glauertCPalt(lam,40000))); }
    ok(worstQ<2e-5,'the two independent quadratures of Glauert’s integral agree (worst '
       +worstQ.toExponential(2)+')');
    /* Regression anchors: values produced by a THIRD implementation (scipy
       quad on the a-parametrisation) during development.  These pin the JS
       against an outside evaluation.  They are NOT Glauert's printed table —
       that table could not be obtained in this session, so no claim is made
       here about agreeing with it. */
    const REF={0.5:0.2893940046,1.0:0.4154961700,1.5:0.4771527621,2.0:0.5111866352,
               2.5:0.5318740225,5.0:0.5703872057,7.5:0.5808487404,10.0:0.5852336978};
    let worstR=0;
    for(const k in REF) worstR=Math.max(worstR,Math.abs(glauertCP(+k,2000)-REF[k]));
    ok(worstR<5e-5,'matches the independent scipy evaluation at 8 tip-speed ratios (worst '
       +worstR.toExponential(2)+')');
    /* the parametrisation satisfies its own defining relations */
    let worstP=0;
    for(let i=1;i<=50;i++){ const a=0.25+i*(1/3-0.25)*0.98/50;
      const lr=glauertLamR(a);
      worstP=Math.max(worstP,Math.abs(glauertAofLamR(lr)-a)); }
    ok(worstP<1e-9,'lam_r(a) and its inverse round-trip (worst '+worstP.toExponential(2)+')'); }

  /* ---------- the polar --------------------------------------------------- */
  for(const f of AIRFOILS){
    chk('Cl=0 at the zero-lift angle of '+f.name,polar(f,f.a0,{}).cl,0,1e-12,false);
    const pS=polar(f,f.aStall,{});
    chk('Cl at stall = Cl_max for '+f.name,pS.cl,f.clMax,1e-9,false);
    ok(polar(f,90,{cdMax:2.0}).cd>1.5,'Cd near 90 deg is flat-plate-like for '+f.name);
    /* broadside is 90 deg FROM THE ZERO-LIFT ANGLE, which for a cambered
       section is not 90 deg geometric — the S809 and the 4415 sit a degree or
       four off, and testing at a flat 90 was the test being wrong, not the code */
    const aBroad=f.a0+90;
    chk('Viterna gives Cl=0 broadside for '+f.name,polar(f,aBroad,{}).cl,0,1e-9,false);
    chk('Viterna gives Cd=cdMax broadside for '+f.name,polar(f,aBroad,{cdMax:1.8}).cd,
        1.8,1e-9,false);
    /* continuity across every region boundary */
    let worst=0;
    for(let a=-179;a<=179;a+=0.25){
      const p0=polar(f,a,{}), p1=polar(f,a+0.25,{});
      worst=Math.max(worst,Math.abs(p1.cl-p0.cl),Math.abs(p1.cd-p0.cd)); }
    ok(worst<0.06,'polar of '+f.name+' has no jump across its region joins (worst step '
       +worst.toFixed(4)+')');
    /* drag is positive everywhere, lift is odd about the zero-lift angle */
    let bad=0;
    for(let a=-180;a<=180;a+=1){ const p=polar(f,a,{}); if(!(p.cd>0)||!isFinite(p.cl)) bad++; }
    ok(bad===0,'polar of '+f.name+' is finite with positive drag over the full range');
  }
  { /* the Sandia anchor: Cd(90 deg) measured 1.80 for the NACA 0012 */
    const f=airfoilById('n0012lo');
    chk('cdMax dialled to the Sandia 90-degree measurement',polar(f,90,{cdMax:1.80}).cd,
        1.80,1e-9,false); }
  { /* the Reynolds pair is what calibrates the scaling — check it recovers itself */
    const lo=airfoilById('n0012lo'), hi=airfoilById('n0012hi');
    const s=reScale(lo,lo.ReRef);
    chk('reScale is the identity at the reference Re (Cl_max)',s.clMax,lo.clMax,1e-12,false);
    chk('reScale is the identity at the reference Re (alpha_stall)',s.aStall,lo.aStall,1e-12,false);
    chk('reScale is the identity at the reference Re (cd0)',s.cd0,lo.cd0,1e-12,false);
    const up=reScale(lo,hi.ReRef);
    ok(up.clMax>lo.clMax&&up.aStall>lo.aStall&&up.cd0<lo.cd0,
       'raising Re raises Cl_max and the stall angle and lowers Cd_min');
    chk('the fit reproduces the measured high-Re Cl_max',up.clMax,hi.clMax,0.02,false);
    chk('the fit reproduces the measured high-Re stall angle',up.aStall,hi.aStall,0.2,false); }

  /* ---------- Prandtl's factor ------------------------------------------- */
  { let bad=0;
    for(let i=1;i<=40;i++){ const r=0.5+i*(5-0.5)/40;
      const F=prandtlF(3,r,5,0.5,Math.sin(0.3),true,true);
      if(!(F>0&&F<=1)) bad++; }
    ok(bad===0,'Prandtl F stays in (0,1]');
    ok(prandtlF(3,4.999,5,0.5,Math.sin(0.3),true,false)<0.2,'F -> 0 at the tip');
    chk('F = 1 with both losses off',prandtlF(3,3,5,0.5,Math.sin(0.3),false,false),1,1e-15,false);
    /* The 2/pi out front is a NORMALISATION, and nothing above pins it: with
       1/pi the factor still lies in (0,1] and still vanishes at the tip, so the
       suite passed while every blade force was halved.  Found by mutation
       testing; these two assertions are what close it. */
    chk('F deep inboard, absolute value (pins the 2/pi normalisation)',
        prandtlF(3,2.5,5,0.5,Math.sin(0.3),true,false),0.996023571584,1e-9,false);
    chk('the HUB branch is normalised the same way',
        prandtlF(3,1.0,5,0.5,Math.sin(0.3),false,true),0.996023571584,1e-9,false);
    ok(prandtlF(3,10,1e7,0.5,Math.sin(0.3),true,false)>1-1e-9,
       'F -> 1 when the tip is infinitely far away'); }

  /* ---------- air properties, against the standard atmosphere ------------- */
  chk('ISA sea-level density at 288.15 K, 101.325 kPa',airDensity(101325,288.15),
      1.2250,1e-3,false);
  chk('ISA sea-level viscosity at 288.15 K',airViscosity(288.15),1.789e-5,5e-8,false);
  chk('Sutherland is the identity at its reference temperature',
      airViscosity(273.15),1.716e-5,1e-12,false);
  ok(airViscosity(350)>airViscosity(250),'viscosity of a gas RISES with temperature');
  ok(airDensity(101325,350)<airDensity(101325,250),'density falls with temperature');

  /* ---------- the optimum blade actually is optimum ----------------------- *
   * These three pin the whole design chain — the flow-angle law, the chord
   * magnitude, and the design lift being read off the polar rather than set
   * independently.  Mutation testing found all three unguarded, and the middle
   * one was a real defect, not just a missing test.                          */
  { let worstAl=0, worstA=0, worstRatio=0;
    for(const lam of [4,6,8,10,12]){
      const s=Object.assign({},DEFAULTS,{tunnel:'free',blade:'betz',drag:false,
        tipLoss:false,hubLoss:false,nAnn:40,alphaDes:6.0,
        rpm:lam*DEFAULTS.U*60/(TAU*DEFAULTS.R)});
      const m=runBEM(s);
      for(const e of m.el) if(e.x>0.3){
        worstAl=Math.max(worstAl,Math.abs(e.alpha-6.0));
        worstA=Math.max(worstA,Math.abs(e.a-1/3)); }
      worstRatio=Math.max(worstRatio,Math.abs(m.CP/glauertCP(lam,2000)-1));
    }
    ok(worstAl<0.15,'the ideal twist holds every station at the design angle of attack '
       +'(worst departure '+worstAl.toFixed(3)+' deg)');
    ok(worstA<0.02,'and the ideal chord loads every station to Betz, a = 1/3 (worst '
       +worstA.toFixed(4)+')');
    ok(worstRatio<0.015,'so the optimum blade reaches Glauert’s optimum CP to better than '
       +'1.5% (worst '+(100*worstRatio).toFixed(2)+'%)');
    /* and it must not BEAT the curve it is designed to touch */
    for(const lam of [4,8,12]){
      const s=Object.assign({},DEFAULTS,{tunnel:'free',blade:'betz',drag:false,
        tipLoss:false,hubLoss:false,nAnn:40,alphaDes:6.0,
        rpm:lam*DEFAULTS.U*60/(TAU*DEFAULTS.R)});
      ok(runBEM(s).CP<=glauertCP(lam,2000)+1e-9,
         'the optimum blade does not exceed Glauert at lambda='+lam); } }
  { /* the design lift is the polar's, not a free number */
    const s=Object.assign({},DEFAULTS,{foil:'s809',alphaDes:6.0});
    chk('design Cl is read off the section at the design angle',designCl(s),
        polar(airfoilById('s809'),6.0,{}).cl,1e-12,false);
    ok(designCl(Object.assign({},s,{alphaDes:9.0}))>designCl(s),
       'a larger design angle asks for more lift, hence a smaller chord'); }

  /* ---------- BEM ---------------------------------------------------------- */
  { const base=Object.assign({},DEFAULTS);
    const r=runBEM(base);
    ok(isFinite(r.CP)&&isFinite(r.CT)&&isFinite(r.P),'BEM returns finite coefficients');
    ok(r.CP>0,'the default rotor extracts power');
    ok(r.CP<betzInTunnel(r.B)+1e-6,'and does not exceed the ceiling for its own blockage');
    ok(r.el.length===base.nAnn,'one result per annulus');
    ok(r.el.every(e=>isFinite(e.a)&&isFinite(e.ap)&&isFinite(e.cl)),'every annulus converged');
    /* free air must never beat Betz, whatever the settings */
    let worst=-1, worstCfg='';
    for(const lam of [2,4,6,8,11,15]) for(const nB of [1,2,3,5])
      for(const blade of ['betz','phase6','flat']){
        const s=Object.assign({},DEFAULTS,{tunnel:'free',blade,nB,nAnn:22,
          rpm:lam*DEFAULTS.U*60/(TAU*DEFAULTS.R)});
        const m=runBEM(s);
        if(m.CP>worst){ worst=m.CP; worstCfg='lam='+lam+' nB='+nB+' '+blade; }
        if(!isFinite(m.CP)){ fail++; console.log('FAIL — non-finite CP at '+worstCfg); }
      }
    ok(worst<16/27+1e-6,'no free-air configuration exceeds Betz (worst '+worst.toFixed(5)
       +' at '+worstCfg+')');
    /* the walls must RAISE the measured CP at otherwise identical settings */
    const free=runBEM(Object.assign({},DEFAULTS,{tunnel:'free',nAnn:26}));
    const small=runBEM(Object.assign({},DEFAULTS,{tunnel:'small',tw:2,th:3,nAnn:26,R:0.6}));
    const freeSmall=runBEM(Object.assign({},DEFAULTS,{tunnel:'free',nAnn:26,R:0.6}));
    ok(small.CP>freeSmall.CP,'a blocked section reads a HIGHER CP than free air '
       +'('+small.CP.toFixed(4)+' vs '+freeSmall.CP.toFixed(4)+')');
    ok(small.B>freeSmall.B,'and it is the blockage that did it');
    /* turning drag off must not lower the power */
    const withDrag=runBEM(Object.assign({},DEFAULTS,{nAnn:26}));
    const noDrag=runBEM(Object.assign({},DEFAULTS,{nAnn:26,drag:false}));
    ok(noDrag.CP>=withDrag.CP-1e-9,'removing section drag cannot reduce CP');
    /* tip loss must not raise it */
    const noTip=runBEM(Object.assign({},DEFAULTS,{nAnn:26,tipLoss:false,hubLoss:false}));
    ok(noTip.CP>=withDrag.CP-1e-9,'removing tip and hub loss cannot reduce CP'); }

  /* ---------- panels build clean ------------------------------------------ */
  for(const view of ['tunnel','blade','polar','power','blockage','design']){
    for(const tun of ['closed','free']){
      const s=Object.assign({},DEFAULTS,{view,tunnel:tun,nAnn:16});
      const M=buildModel(s);
      const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
      ok(html.length>300&&html.indexOf('NaN')<0&&html.indexOf('undefined')<0,
         'panels build clean for '+view+' / '+tun);
      ok(eqbarText(M).indexOf('NaN')<0,'headless summary is clean for '+view+' / '+tun);
    }
  }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
</html>
