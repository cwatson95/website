<title>SBS &mdash; sound written by light in a pressure cell</title>
<!--
  ===================================================================
  sbs_sims.html  —  Stimulated Brillouin Scattering in a gas cell
  ===================================================================

  Two laser beams crossing head-on in a gas cell beat together.  The beat
  note squeezes the gas by electrostriction, and if the beat frequency
  matches a longitudinal acoustic mode the squeeze reinforces the sound it
  is making.  That travelling density grating then Bragg-reflects the pump
  into the Stokes beam: light is converted into backward light plus sound.
  This file lets you push on pressure, gas, wavelength and temperature and
  watch the phonon lifetime, the Brillouin shift, the linewidth and the
  gain move.

  WHAT IS MEASURED (tabulated inputs, not fits)
  ---------------------------------------------
  * Gas properties rho, eta, kappa, Cv, Cp and the sound speed c0 are NIST
    WebBook 298 K isotherms, taken from the SBS project's own data/ files
    through papers/code/lib/sbs_gain.py, then resampled onto a 48-point log
    grid in pressure (worst resample error 2.4e-3 on SF6 rho, <= 3.2e-4 for
    every other gas/column — printed by tools in the build directory).
  * Refractive index: Sellmeier fits whose STP values reproduce the
    documented 0 C refractivities (Kr 4.275e-4, N2 2.986e-4, Ar 2.817e-4 at
    589.3 nm) to 0.015%, scaled to density by Lorentz-Lorenz.
  * Reference SBS data are sbs_gain.CF_TABLES verbatim: Mironov (Kr, N2, Ar,
    1-6 atm, 266 nm) and Offenberger 1993 (SF6, 5.4-14.7 atm, 248 nm).
    Kr linewidths carry PRA_v13 App. B provenance — only 3/4/5 atm are
    bootstrap 1-sigma; 2 atm is a figure digitization and 6 atm a text value,
    and the sim draws those two as HOLLOW markers.
  * Boyd, Nonlinear Optics 4th ed, Table 9.3.1 (p. 431) for the liquid/solid
    landmarks, quoted at 694 nm as the book does.

  WHAT IS MODELLED
  ----------------
  * Brillouin shift, Eq. (29) of the project's closed form:
        nu_B = (q v0 / 2 pi) sqrt( (1 + gamma y^2) / (2 (1 + y^2)) )
    which bridges the free-streaming Doppler corner (y -> 0) and the
    acoustic corner (y -> inf, where it becomes q c_s / 2 pi).
  * Linewidth, the crossover bridge of PRA_v13 App. B:
        dnu = 1.1332 (q v0 / 2 pi) / sqrt(1 + y^2)
    1.1332 being the FWHM of the y = 0 kinetic lobe x exp(-x^2).
  * Linewidth, hydrodynamic (Navier-Stokes / Stokes-Kirchhoff):
        Gamma_B = C q^2 eta / rho,  C = 4/3 + eta_b/eta + (gamma-1)/Pr
    with Pr from Eucken 4 gamma/(9 gamma - 5) — exactly 2/3 at gamma = 5/3 —
    and eta_b from one relaxing rotational channel,
        eta_b/eta = Z_rot (cv_inf/cv_0)(gamma_inf - gamma_0),
    which returns the literature 0.7-0.8 for N2 at Z_rot = 5.  eta_b is
    STRUCTURALLY zero for monatomics (and for H2, whose Z_rot ~ 200-400
    makes it kinetically monatomic at GHz).
  * Gain, two independent routes, deliberately both drawn:
      - the project's kinetic closed form, Eq. (27);
      - Boyd Eq. (9.3.24)  g0 = gamma_e^2 omega^2 / (n v c^3 rho0 Gamma_B).
    They are NOT the same calculation, and where they part company is the
    point of the "the scan" view.
  * Amplifier: Boyd Eqs. (9.3.22), dI1/dz = -g I1 I2, dI2/dz = -g I1 I2,
    integrated as a two-point boundary-value problem (shooting on I2(L)).

  WHAT IS **NOT** MODELLED
  ------------------------
  * Transient SBS.  Everything here is steady state; if your pump is shorter
    than a few phonon lifetimes the real gain is smaller than what is drawn,
    and the readout says so when the pulse slider goes below ~10 tau_B.
  * Optical breakdown, thermal/Rayleigh-wing scattering, self-focusing,
    beam geometry, and the Stokes seed's actual thermal-noise origin (the
    seed is a slider, not a calculation).
  * The velocity-dependent-collision (beta) corrections that the project's
    published papers add: this file is the beta = 0 backbone.
  * Any gas outside the seven with NIST tables, or any pressure outside
    those tables' range (0.013-10 atm; SF6 to 15 atm).  Sliders clamp.

  A CAVEAT WORTH READING
  ----------------------
  "SBS is a sound wave in a gas" is only true at the hydrodynamic end.  The
  acoustic wavelength is Lambda = lambda/2n = 133 nm at 266 nm, and krypton's
  mean free path at 1 atm is 61 nm — so the "sound wave" is shorter than the
  distance between collisions and there is no phonon at all, only Doppler-
  selected free-streaming atoms.  The collisionality y = P/(eta q v0) is
  EXACTLY the inverse Knudsen number 1/(q * mfp) (asserted to 2e-16), and it
  runs 0.35 -> 2.07 across Mironov's 1-6 atm.  The whole published dataset
  sits in the crossover.  "the regimes" view is about this.

  VERIFICATION
  ------------
  selfTest() runs headlessly (osascript -l JavaScript) whenever there is no
  document, and asserts every number above against values printed to 12
  digits by the project's own library.  Boyd's worked CS2 example is pinned
  too — and does NOT reproduce: his stated inputs give 1.3126 m/GW where the
  book prints 1.5 m/GW, and his Table 9.3.1 width of 52.3 MHz implies
  tau_p = 3.04 ns where his text uses 4 ns.  The implementation is right and
  the textbook example is loose; see selfTest.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

/* ============ measured + tabulated data (generated) ============ */
/* ---- gas property tables: NIST isotherms at 298 K, resampled onto a
   48-point log grid in pressure.  Columns: P(atm) rho(kg/m3) eta(Pa s)
   kappa(W/m/K) cv(J/mol/K) cp(J/mol/K) c0(m/s).  Extracted from the SBS
   project's own data/ tables through lib/sbs_gain.py. ---- */
const GASTAB = {
  Ar: { m: 6.6335209e-26, sExp: 0.5, alpha: 0, nRot: 0, Zrot: 0, nGas: 'Ar',

const K_B=1.380649e-23, R_GAS=8.31446261815324, C_SI=2.99792458e8;
const ATM=101325.0, T_STP=273.15, T_TAB=298.0;
const N_STP=ATM/(K_B*T_STP);
/* FWHM of the y=0 kinetic gain lobe x*exp(-x^2) — the Doppler ceiling.
   Re-derived below in selfTest by root-finding, not taken on trust. */
const W_KIN=1.13320;

/* CRC static polarizability volumes, Angstrom^3 — the alpha^2 of Eq. (27).
   (sbs_gain.POLARIZABILITY_A3, verbatim.) */
const POL_A3={He:0.2050,Ne:0.3956,Ar:1.6411,Kr:2.4844,Xe:4.044,
              N2:1.7403,O2:1.5812,H2:0.8023,SF6:4.490};

/* Rotational collision number.  N2/O2: the literature ~5, which returns the
   measured eta_b/eta ~ 0.8.  SF6: 1 — poorly constrained, and at GHz its
   vibrational ladder is FROZEN, so only rotation dissipates.  Monatomics and
   H2 (Z_rot ~ 200-400, kinetically monatomic at GHz) get eta_b == 0
   structurally, keyed on GASTAB.alpha, never on a subtraction. */
const ZROT={N2:5.0,O2:5.0,SF6:1.0};

/* linear interpolation on an ascending grid; clamps at both ends */
function interpAt(xs,ys,x){
  const n=xs.length;
  if(x<=xs[0]) return ys[0];
  if(x>=xs[n-1]) return ys[n-1];
  let lo=0, hi=n-1;
  while(hi-lo>1){ const md=(lo+hi)>>1; if(xs[md]<=x) lo=md; else hi=md; }
  const f=(x-xs[lo])/(xs[hi]-xs[lo]);
  return ys[lo]+(ys[hi]-ys[lo])*f;
}
function pressureRange(gas){ const t=GASTAB[gas]; return [t.P[0],t.P[t.P.length-1]]; }

/* Sellmeier n at the STP the refractivities are quoted at (0 C, 1 atm) */
function sellmeier(nGas,lamUm){
  if(!GASTAB[nGas]) throw new Error('sellmeier: no coefficients for "'+nGas+'"');
  const s=GASTAB[nGas].sell;
  const kind=s[0], B=s[1], C=s[2];
  if(kind==='const') return 1+B[0];
  if(kind==='sqrt'){
    const l2=lamUm*lamUm;
    return Math.sqrt(1 + B[0]*l2/(l2+C[0]) + B[1]*l2/(l2-C[1]) + B[2]*l2/(l2-C[2]));
  }
  let v=1; const il2=1/(lamUm*lamUm);
  for(let i=0;i<B.length;i++) v+=B[i]/(C[i]-il2);
  return v;
}
/* Standard Lorentz-Lorenz: refractivity scales with number density from the
   STP reference the Sellmeier fit IS.  (The project's Stephen.m port inverts
   at the session temperature and uses eps_r = sqrt(n); it runs a uniform
   +2.67% high on n-1 — which is 0.003% on nu_B, negligible, but this is the
   correct form.) */
function refIndex(nGas,P_atm,T,lamUm){
  const nref=sellmeier(nGas,lamUm);
  const Lref=(nref*nref-1)/(nref*nref+2);
  const L=Lref*(P_atm*ATM/(K_B*T))/N_STP;
  return Math.sqrt((1+2*L)/(1-L));
}

/* Eucken Prandtl number: exactly 2/3 at gamma = 5/3, so monatomics need no
   special case. */
function prandtl(gam){ return 4*gam/(9*gam-5); }

/* ------------------------------------------------------------------ *
 *  sbsState — everything the whole file is built on.
 *
 *  P_atm  pressure          T  temperature (K)       lam  pump wavelength (nm)
 *
 *  The 298 K NIST isotherm is used verbatim at T = 298.  Away from it the
 *  sim EXTRAPOLATES, by rules that are stated on the canvas:
 *    rho  ideal at the table's own compressibility factor Z(P)
 *    eta  ~ T^s, s = 1 - Phi from the project's viscosity-slope table
 *    c0   ~ sqrt(T)  at fixed gamma
 * ------------------------------------------------------------------ */
function sbsState(gas,P_atm,T,lam_nm,opt){
  opt=opt||{};
  const g=GASTAB[gas];
  if(!g) throw new Error('sbsState: no table for gas "'+gas+'"');
  const rng=pressureRange(gas);
  const P=clamp(P_atm,rng[0],rng[1]);
  const rho298=interpAt(g.P,g.rho,P), eta298=interpAt(g.P,g.eta,P);
  const kap  =interpAt(g.P,g.kap,P);
  const cv   =interpAt(g.P,g.cv ,P), cp    =interpAt(g.P,g.cp ,P);
  const c0298=interpAt(g.P,g.c0 ,P);
  const m=g.m, Ppa=P*ATM;

  /* compressibility factor of the tabulated isotherm; 1 for an ideal gas */
  const Zc=Ppa/((rho298/m)*K_B*T_TAB);
  const rho=Ppa*m/(Zc*K_B*T);
  const eta=eta298*Math.pow(T/T_TAB,g.sExp);
  const c0 =c0298*Math.sqrt(T/T_TAB);
  const gam=cp/cv;

  const n=opt.noIndex?1:refIndex(g.nGas,P,T,lam_nm*1e-3);
  const lam=lam_nm*1e-9;
  const q=4*Math.PI*n/lam;                 /* backscatter phonon wavevector */
  const Lam=2*Math.PI/q;                   /* acoustic wavelength = lam/2n   */
  const v0=Math.sqrt(2*K_B*T/m);           /* most-probable thermal speed    */

  const P_K=eta*q*v0;                      /* Knudsen pressure               */
  const y=Ppa/P_K;                         /* collisionality (shear form)    */
  const mfp=eta*v0/Ppa;                    /* mean free path, nu_coll = P/eta*/
  const Kn=q*mfp;                          /* EXACTLY 1/y                    */

  /* --- shift: Doppler corner -> acoustic corner --------------------- */
  const nuB=(q*v0/(2*Math.PI))*Math.sqrt((1+gam*y*y)/(2*(1+y*y)));
  /* --- width: the crossover bridge --------------------------------- */
  const dnuKin=W_KIN*(q*v0/(2*Math.PI))/Math.sqrt(1+y*y);
  /* --- width: pure Navier-Stokes ----------------------------------- */
  const Pr=prandtl(gam);
  let etab=0;
  if(g.nRot>0){
    /* nRot is an INTEGER in the table (2 linear, 3 nonlinear, 0 = no relaxing
       channel).  It is deliberately NOT recovered by comparing the rounded
       delta against 2/3: the blob carries 0.6666667, which fails that test,
       and N2's eta_b came out exactly 1.5x too large until this was structural. */
    const cRot=R_GAS*g.nRot/2;
    const cvInf=cv-cRot;                     /* rotation frozen out         */
    /* gamma_inf from the MEASURED cp-cv, not R: for a real gas (SF6) the
       departure is enough to send eta_b negative if you use R. */
    const gamInf=1+(cp-cv)/cvInf;
    etab=(opt.Zrot!==undefined?opt.Zrot:g.Zrot)*(cvInf/cv)*(gamInf-gam);
  }
  const Cq=4/3+etab+(gam-1)/Pr;             /* Stokes-Kirchhoff coefficient */
  const GamNS=Cq*q*q*eta/rho;               /* rad/s                        */
  const dnuNS=GamNS/(2*Math.PI);

  /* --- phonon lifetime.  tau = 1/Gamma_B is the INTENSITY 1/e time; the
     acoustic amplitude decays at 2 tau.  Offenberger's tabulated tau_B is
     this one (their dnu = 1/(2 pi tau_B)). ------------------------------ */
  const tauKin=1/(2*Math.PI*dnuKin);
  const tauNS =1/GamNS;
  const vAc=2*Math.PI*nuB/q;                /* actual Brillouin phase speed */
  const Q=nuB/dnuKin;                       /* acoustic quality factor      */
  const decayLen=vAc*tauKin;                /* how far a phonon gets        */

  /* --- gain, route 1: the project's kinetic closed form, Eq. (27) ---- */
  let gKin=null;
  const a3=POL_A3[gas];
  if(a3!==undefined){
    const alpha=a3*1e-24;                   /* Angstrom^3 -> cm^3           */
    const kB_cgs=K_B*1e7, C_CGS=C_SI*100;
    const n0=(Ppa*10)/(kB_cgs*T);           /* Pa -> barye ; cm^-3          */
    const kbar_cm=(2*Math.PI/lam)/100;
    gKin=(8*Math.PI*Math.PI*alpha*alpha*n0*kbar_cm/(C_CGS*kB_cgs*T)
          *Math.sqrt(Math.PI/(2*Math.E))*Math.sqrt(1+y*y))*1e16;
  }
  /* --- gain, route 2: Boyd Eq. (9.3.24), pure hydrodynamics ---------- */
  const ge=n*n-1;                           /* electrostrictive constant    */
  const ws=2*Math.PI*C_SI/lam;
  const gHyd=boydGain(ge,ws,n,c0,rho,GamNS);
  /* --- Boyd's COUPLING fed the correct (kinetic) width.  This separates
     "is the gain formula right?" from "is the width right?", and it shares
     Eq. (27)'s pressure dependence exactly, so their ratio is a constant
     that measures only the polarizability convention (static CRC alpha vs
     the optical n^2-1).  NB it must use c0, not the Brillouin phase speed:
     v_ac drifts by sqrt(gamma) from the Doppler to the acoustic corner and
     would tilt the ratio by ~25%. ------------------------------------- */
  const gBoydKin=boydGain(ge,ws,n,c0,rho,2*Math.PI*dnuKin);

  return {gas,P:P_atm,Pclamped:P,T,lam_nm,clamped:(P!==P_atm),
          rho,eta,kap,cv,cp,gam,c0,Zc,n,q,Lam,v0,P_K,y,mfp,Kn,
          nuB,dnuKin,dnuNS,Pr,etab,Cq,GamNS,tauKin,tauNS,vAc,Q,decayLen,
          gKin,gHyd,gBoydKin,m,
          nDens:Ppa/(Zc*K_B*T)};
}

/* Boyd, Nonlinear Optics 4th ed, Eq. (9.3.24), p. 430:
       g0 = gamma_e^2 omega^2 / (n v c^3 rho0 Gamma_B)
   SI in, m/W out; the 1e11 converts m/W -> cm/GW.  Kept as its own function
   so selfTest can drive it with Boyd's own CS2 numbers. */
function boydGain(ge,ws,n,v,rho,GamB){
  return ge*ge*ws*ws/(n*v*C_SI*C_SI*C_SI*rho*GamB)*1e11;
}

/* ------------------------------------------------------------------ *
 *  lineshapes
 * ------------------------------------------------------------------ */
/* Boyd Eq. (9.3.23): a Lorentzian of FWHM Gamma_B centred on Omega_B. */
function lorentzian(nu,nuB,dnu){
  const hw=dnu/2, d=nu-nuB;
  return hw*hw/(d*d+hw*hw);
}
/* The kinetic (Doppler) lobe in reduced detuning x = 2 pi nu/(q v0).  This is
   the y -> 0 limit of the gain spectrum and it is ANTISYMMETRIC: the positive
   lobe is Stokes gain, the negative one is anti-Stokes loss.  Its peak sits at
   x = 1/sqrt(2) (the Doppler shift corner) and its FWHM is the 1.1332 anchor.
   Both facts are re-derived in selfTest rather than assumed. */
const X_PEAK=1/Math.SQRT2;
function kineticLobe(x){ return x*Math.exp(-x*x); }

/* Three named lineshapes, each normalised to unit peak.  There is deliberately
   NO blended "crossover lineshape" here: the sim's crossover claim is about
   the peak POSITION and the WIDTH (both exact), not about the wings, and an
   interpolated shape would dress a guess up as a solve.  The spectrum view
   draws these three and says which one the current y is near. */
function shapeKinetic(nu,S){                 /* y -> 0 limit, exact          */
  const x=2*Math.PI*nu/(S.q*S.v0);
  return kineticLobe(x)/kineticLobe(X_PEAK);
}
function shapeHydro(nu,S){                   /* y -> inf limit, Boyd 9.3.23  */
  return lorentzian(nu,S.nuB,S.dnuNS);
}
function shapeBridge(nu,S){                  /* the sim's working model      */
  return lorentzian(nu,S.nuB,S.dnuKin);
}

/* ------------------------------------------------------------------ *
 *  the amplifier — Boyd Eqs. (9.3.22)
 *      dI1/dz = -g I1 I2      (pump, +z)
 *      dI2/dz = -g I1 I2      (Stokes, travelling -z)
 *  with I1(0) = Ip given and I2(L) = seed given.  Boyd Eq. (9.3.26) gives
 *  the invariant I1 - I2 = C, so the pair collapses to one ODE and the
 *  two-point problem is a scalar root-find on C.
 * ------------------------------------------------------------------ */
function amplifier(gB_cmGW,Ip_GWcm2,L_cm,seedFrac,nStep){
  const g=gB_cmGW, Ip=Ip_GWcm2, seed=Math.max(seedFrac,1e-18)*Ip;
  nStep=nStep||400;
  /* dI2/dz = -g I2 (I2 + C) has a CLOSED FORM — Boyd integrates it that way
     himself at Eqs. (9.3.27)-(9.3.29).  Using it instead of stepping an ODE
     removes the stiffness outright: at high gain the transition in z is sharp
     enough that fixed-step RK4 overshot into I2 < 0, which the old clamp then
     hid, and the depleted branch silently returned nonsense.
        u/(u+C) = [s/(s+C)] exp(+g C (L-z))        (s = I2(L))
     so   u(z) = C r / (1 - r)  with r that exponential ratio.            */
  function solveAt(C,z){
    if(C<=0) return seed/(1-g*seed*(L_cm-z));       /* C -> 0 branch      */
    const r=(seed/(seed+C))*Math.exp(g*C*(L_cm-z));
    if(!(r<1)) return Infinity;                     /* blow-up, reject C  */
    return C*r/(1-r);
  }
  /* bisect on C = I1 - I2 in (0, Ip]: I1(0) = u(0) + C rises with C.
     60 halvings take the bracket to 2^-60 ~ 1e-18 of Ip, which is already
     below double precision; 200 was pure waste in a function the amplifier
     view calls ~50 times per frame. */
  let lo=0, hi=Ip;
  for(let it=0;it<60;it++){
    const mid=0.5*(lo+hi), v=solveAt(mid,0)+mid;
    if(!isFinite(v)||v>Ip) hi=mid; else lo=mid;
  }
  const C=0.5*(lo+hi);
  const prof=[];
  for(let i=0;i<=nStep;i++){
    const z=L_cm*i/nStep;
    let I2=solveAt(C,z);
    if(!isFinite(I2)||I2<0) I2=0;
    prof.push({z,I1:I2+C,I2});
  }
  const R=Math.min(prof[0].I2/Ip,1);         /* Stokes reflectivity at z=0 */
  return {prof,R,C,G:g*Ip*L_cm,
          depletion:1-prof[prof.length-1].I1/Ip};
}

/* Reflectivity only — no profile array.  The threshold curve needs ~50 of
   these per frame and allocating 50 x 90 profile points for one number each
   was the amplifier view's whole cost. */
function amplifierR(gB_cmGW,Ip_GWcm2,L_cm,seedFrac){
  return amplifier(gB_cmGW,Ip_GWcm2,L_cm,seedFrac,1).R;
}

/* Undepleted-pump limit, Boyd Eq. (9.3.25): I2(0) = I2(L) exp(g I1 L). */
function amplifierUndepleted(gB,Ip,L,seedFrac){
  return seedFrac*Math.exp(gB*Ip*L);
}

/* ================================================================== *
 *  the Averbakh kinetic lineshape                                     *
 *                                                                     *
 *  The EXACT linearised-kinetic (BGK) solve that anchors this whole    *
 *  research programme — Averbakh, Makarov & Talanov, Sov. J. Quantum   *
 *  Electron. 5, 1201 (1975), as ported in the project's own            *
 *  lib/sbs_gain.py (itself a port of the group's Stephen.m).  It is a  *
 *  genuinely different calculation from the closed form: no crossover  *
 *  interpolation, no Padé bridge — the 3x3/4x4 moment system solved    *
 *  outright at every detuning.                                         *
 *                                                                     *
 *  Needs the Faddeeva function w(z) = exp(-z^2) erfc(-iz) for complex  *
 *  argument, which is why this is the only block in the file that      *
 *  carries its own complex arithmetic.                                 *
 * ================================================================== */

/* --- minimal complex arithmetic (re, im pairs) --------------------- */
function cx(re,im){ return {re:re,im:im||0}; }
function cadd(a,b){ return {re:a.re+b.re, im:a.im+b.im}; }
function csub(a,b){ return {re:a.re-b.re, im:a.im-b.im}; }
function cmul(a,b){ return {re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re}; }
function cdiv(a,b){
  const d=b.re*b.re+b.im*b.im;
  return {re:(a.re*b.re+a.im*b.im)/d, im:(a.im*b.re-a.re*b.im)/d};
}
function cscale(a,s){ return {re:a.re*s, im:a.im*s}; }
function caddr(a,s){ return {re:a.re+s, im:a.im}; }
function cexp(a){ const e=Math.exp(a.re);
  return {re:e*Math.cos(a.im), im:e*Math.sin(a.im)}; }

/* --- Faddeeva w(z), Weideman rational approximation ----------------
   FAD_L / FAD_A are generated by build_sbs/gen_averbakh.py and verified
   against scipy.special.wofz to 1.3e-14 over the domain this solve uses.
   For Im(z) < 0 the reflection w(z) = 2 exp(-z^2) - w(-z) is applied, so the
   function is total even though the Averbakh call stays in the upper half
   plane for every physical input. */
function faddeeva(z){
  if(z.im<0){
    const w=faddeeva({re:-z.re,im:-z.im});
    const e=cexp({re:z.im*z.im-z.re*z.re, im:-2*z.re*z.im});
    return csub(cscale(e,2),w);
  }
  const iz={re:-z.im, im:z.re};                       /* i*z */
  const den={re:FAD_L-iz.re, im:-iz.im};              /* L - i z */
  const num={re:FAD_L+iz.re, im:iz.im};               /* L + i z */
  const Z=cdiv(num,den);
  let p={re:0,im:0};
  for(let k=0;k<FAD_A.length;k++) p=caddr(cmul(p,Z),FAD_A[k]);
  const d2=cmul(den,den);
  return cadd(cdiv(cscale(p,2),d2),
              cdiv({re:1/Math.sqrt(Math.PI),im:0},den));
}

/* --- collision frequency, Stephen.m KineticVars --------------------
   NOTE 101300, not 101325: the reference implementation uses that value and
   the whole Averbakh calibration is tied to it.  Reproduced deliberately —
   changing it silently shifts every kinetic curve by 2.5e-4. */
function collisionFreq(gas,P_atm,T){
  const g=GASTAB[gas];
  const v_rel=Math.sqrt(8*K_B*T/Math.PI/g.m/2);
  const sig=Math.PI*g.radius*g.radius+g.sigExtra;
  const N=(P_atm*760.0)*101300/760/K_B/T;
  return sig*v_rel*N*g.sigScale;
}

/* --- the lineshape.  Returns Im R at reduced detuning x = -Omega/(q v0).
   A is the velocity-dependence parameter beta (0 = conventional BGK). --- */
function averbakhImR(x,yv,a,d,A){
  const I=cx(0,1);
  const Z=cx(x,-yv);
  const u=yv/(1+a)*(1+(a/(1+d)));
  const s=yv/(1+a)*(1+(a*d/(1+d)));
  const den_w=cx(1,A*yv/Math.sqrt(3));
  const W=cmul(cdiv(cx(0,Math.sqrt(Math.PI)),den_w),faddeeva(cdiv(Z,den_w)));
  const p1=cx(1,A*yv);
  const p1_2=cmul(p1,p1), p1_3=cmul(p1_2,p1);
  const ZW=cmul(Z,W);
  const oneZW=caddr(ZW,1);                        /* 1 + Z W */

  const M=csub(cdiv(cmul(Z,oneZW),p1_2),cscale(W,0.5));
  const NV=csub(cdiv(cmul(cmul(Z,Z),oneZW),p1_3),cdiv(ZW,p1));
  const PV=cadd(cscale(W,0.5),cdiv(cmul(Z,oneZW),p1_2));
  const Delta=cadd(W,cscale(cdiv(cscale(oneZW,2),p1),x));
  const RV=cadd(cdiv(oneZW,p1),cdiv(cscale(cmul(Z,oneZW),2),p1_2));
  const Q=cadd(cadd(NV,cmul(cscale(cmul(I,PV),2*yv),oneZW)),
               cdiv(cmul(cscale(cmul(I,PV),2*A*yv),oneZW),p1));
  const eta=cadd(cadd(cdiv(cscale(I,yv),p1),cdiv(cscale(cmul(I,Z),yv*A),p1_2)),
                 cscale(cmul(I,cadd(cscale(W,0.5),cdiv(Z,p1_2))),2*A*yv));
  const curlyPhi=cadd(cdiv(cx(1.5,0),p1),cdiv(ZW,p1));
  const chi=cadd(cadd(cadd(cdiv(cmul(Z,Z),p1_2),cdiv(cscale(I,yv*A/2),p1)),
                      cadd(cx(-0.5,0),cdiv(cscale(cmul(I,Z),yv),p1_2))),
                 cscale(eta,x));
  const CapOm=cadd(cadd(W,cscale(cmul(cmul(p1,PV),eta),A)),cscale(curlyPhi,A));
  const Beta=cadd(W,cscale(cdiv(oneZW,p1),A));
  const L1=cadd(csub(cmul(I,cadd(cscale(CapOm,u),cscale(Beta,1.5*s))),cx(1.5,0)),
                cscale(cmul(CapOm,Beta),yv*yv/(1+a)));
  const MAQ=cadd(M,cscale(Q,A));
  const IuB=cadd(cscale(I,u),cscale(Beta,yv*yv/(1+a)));
  const Rn=csub(cdiv(cmul(L1,oneZW),p1),cscale(cdiv(cmul(IuB,MAQ),p1),0.5));
  const Rd=csub(cmul(csub(cadd(cscale(cmul(I,Delta),yv),cscale(cmul(I,RV),yv*A)),
                          cx(1,0)),L1),
                cmul(cmul(IuB,MAQ),chi));
  return cdiv(Rn,Rd).im;
}

/* --- the spectrum, with a PARABOLA-REFINED peak --------------------
   A raw grid argmax staircases as the axis is rescaled (it bit the parent-law
   sim's competitor tables), so the peak position and height come from a
   parabola through the three samples around the maximum, and the FWHM from
   linear interpolation of the half-height crossings. */
function averbakhSpectrum(S,beta,nGrid){
  const gas=S.gas, g=GASTAB[gas];
  nGrid=nGrid||301;
  const sigma=collisionFreq(gas,S.Pclamped,S.T);
  const yv=-sigma/(S.q*S.v0);
  /* window follows the gas: on a fixed 0-6 GHz grid H2's 8.4 GHz peak lands
     on the last sample and both the peak and the width are junk. */
  const nuMax=Math.max(6e9,3.0*S.q*S.v0/(2*Math.PI));
  const nu=new Array(nGrid), R=new Array(nGrid);
  for(let i=0;i<nGrid;i++){
    nu[i]=nuMax*i/(nGrid-1);
    R[i]=averbakhImR(-2*Math.PI*nu[i]/(S.q*S.v0),yv,g.avbAlpha,g.avbDelta,beta);
  }
  let ip=0;
  for(let i=1;i<nGrid;i++) if(R[i]>R[ip]) ip=i;
  let nuPk=nu[ip], Rpk=R[ip];
  if(ip>0&&ip<nGrid-1){
    const y0=R[ip-1], y1=R[ip], y2=R[ip+1], den=(y0-2*y1+y2);
    if(den!==0){
      const dlt=0.5*(y0-y2)/den;                 /* in samples, |dlt| <= 0.5 */
      nuPk=nu[ip]+dlt*(nu[1]-nu[0]);
      Rpk=y1-0.25*(y0-y2)*dlt;
    }
  }
  /* FWHM, half height measured from the same baseline the library uses
     (max-min)/2, with interpolated crossings */
  let lo=R[0], hi=R[0];
  for(let i=1;i<nGrid;i++){ if(R[i]<lo) lo=R[i]; if(R[i]>hi) hi=R[i]; }
  const half=(hi-lo)/2;
  let a1=null,a2=null;
  for(let i=1;i<nGrid;i++){
    if(a1===null&&R[i-1]<half&&R[i]>=half)
      a1=nu[i-1]+(nu[i]-nu[i-1])*(half-R[i-1])/(R[i]-R[i-1]);
    if(R[i-1]>=half&&R[i]<half)
      a2=nu[i-1]+(nu[i]-nu[i-1])*(half-R[i-1])/(R[i]-R[i-1]);
  }
  const fw=(a1!==null&&a2!==null&&a2>a1)?a2-a1:0;
  return {nu,R,y:yv,nuB:nuPk,Rpk,fwhm:fw,nuMax};
}

/* --- peak gain from the Averbakh lineshape -------------------------
   Stephen.m's electrostrictive prefactor in CGS.  IMPORTANT: the shipped
   gain_spectrum() forms  gB0 = C * R_max  and then  g = gB0 * R, so its
   reported peak carries R_max TWICE — the R_max^2 entry on the project's
   own Known-bad list.  The physically-correct peak is C * R_max, which is
   what this returns; selfTest pins the size of the difference so nobody
   "restores" the calibrated version by accident. */
function averbakhGain(S,spec){
  const g=GASTAB[S.gas];
  const kL_cm=(2*Math.PI/(S.lam_nm*1e-9))/100;
  const rho_cgs=S.rho/1e3, v_cgs=S.v0*100, C_CGS=C_SI*100;
  const n=S.n;
  const C=kL_cm*Math.pow(n*n-1,2)/(v_cgs*v_cgs*rho_cgs)/C_CGS/(n*n)*1e16;
  return C*spec.Rpk;
}

/* Caches.  The Averbakh solve is ~40x the cost of a closed form: a Faddeeva
   evaluation per detuning, with complex allocations.  Two callers hammer it —
   the scan view (every pressure, every rebuild) and the readout (every
   rebuild, for the current point).  Without the SPECTRUM cache below,
   selfTest's "every gas x pressure x wavelength x view" sweep recomputed the
   same 301-point solve once per VIEW, seven times over, and the suite took
   62 s instead of 9. */
const _avbSpecCache={}; const _avbSpecKeys=[];
function averbakhSpecAt(S,beta,nGrid){
  const k=S.gas+'|'+S.Pclamped+'|'+S.T+'|'+S.lam_nm+'|'+beta+'|'+(nGrid||301);
  let v=_avbSpecCache[k];
  if(v===undefined){
    v=averbakhSpectrum(S,beta,nGrid);
    _avbSpecCache[k]=v; _avbSpecKeys.push(k);
    /* bounded: full spectra are two 301-element arrays each */
    while(_avbSpecKeys.length>48) delete _avbSpecCache[_avbSpecKeys.shift()];
  }
  return v;
}
const _avbCache={};
function averbakhAt(gas,P,T,lam,beta,nGrid){
  const k=gas+'|'+P+'|'+T+'|'+lam+'|'+beta+'|'+(nGrid||301);
  if(_avbCache[k]===undefined){
    if(Object.keys(_avbCache).length>4000) for(const kk in _avbCache) delete _avbCache[kk];
    const S=sbsState(gas,P,T,lam);
    const sp=averbakhSpectrum(S,beta,nGrid);
    _avbCache[k]={nuB:sp.nuB,fwhm:sp.fwhm,Rpk:sp.Rpk,y:sp.y,
                  gB:averbakhGain(S,sp)};
  }
  return _avbCache[k];
}

/* ================================================================== *
 *  transient SBS — pulse amplification and compression                *
 *                                                                     *
 *  The steady-state amplifier of "the amplifier" view assumes the      *
 *  acoustic wave has settled.  It has not, if the pulse is not long    *
 *  compared with tau_B — and that failure is exactly what makes SBS a  *
 *  pulse COMPRESSOR.  A short Stokes seed meets a long pump; the       *
 *  leading edge of the seed eats the pump first, so the trailing edge  *
 *  finds nothing left to amplify and the pulse sharpens.               *
 *                                                                     *
 *  Three-wave transient equations, at exact resonance, with real       *
 *  envelopes (dimensionless):                                          *
 *                                                                     *
 *      dA/dth + dA/dz = -(G/2) Q B          A = pump,   -> +z          *
 *      dB/dth - dB/dz = +(G/2) Q A          B = Stokes, -> -z          *
 *      dQ/dth         = (A B - Q)/T         Q = acoustic              *
 *                                                                     *
 *  z = position/L, th = time/(L/v), A,B in units of sqrt(I_pump,0).    *
 *  Exactly TWO parameters, both computed from the rest of the sim:     *
 *      G = g_B I_p L       the steady-state gain exponent              *
 *      T = tau_B v / L     phonon lifetime in transit times            *
 *  In steady state Q -> A B and the pair collapses to Boyd (9.3.22)    *
 *  with the same g_B — asserted in selfTest, so the two views cannot   *
 *  drift apart.                                                        *
 *                                                                     *
 *  EXACT INVARIANT (Manley-Rowe): d(A^2+B^2)/dth + d(A^2-B^2)/dz = 0.  *
 *  Photon number is conserved because the acoustic quantum is ~1e-6 of *
 *  the optical one.  selfTest checks the numerics against it.          *
 * ================================================================== */

/* super-Gaussian pulse, order p (p=1 Gaussian, large p flat-top) */
function pulseShape(t,t0,fwhm,p){
  if(fwhm<=0) return 0;
  const s=fwhm/(2*Math.pow(Math.log(2),1/(2*p)));
  const u=(t-t0)/s;
  return Math.exp(-Math.pow(u*u,p));
}

/* Solve the transient system.  Advection is exact (CFL = 1, dz = dth), so the
   scheme is non-dissipative; the source is stepped with Heun's method along
   the characteristics.  A first-order source made the compression ratio drift
   ~4% with grid size, which would have looked like physics. */
/* Work budget, in cell-updates.  CFL = 1 ties dz to dth, so the cost of a run
   is nz * nSteps = nz^2 * thMax — QUADRATIC in the grid and linear in the
   simulated time.  A short cell makes one transit short, so a fixed pulse
   length is many transits: 1 cm with a 60 ns pump is 4139 transits and 165
   MILLION cell-updates, which freezes the page.  Both of those are ordinary
   slider positions, so this is a real hang, not a pathological input.  Hold
   the product instead, by dropping the SPATIAL resolution (time is still
   integrated in full) and reporting the reduction. */
const PULSE_BUDGET=2.5e6, PULSE_NZ_MIN=30;
function solvePulse(par){
  const nzReq=par.nz||220;
  const thMax=Math.max(par.thMax,0.5);
  const nz=Math.min(nzReq,Math.max(PULSE_NZ_MIN,
                    Math.floor(Math.sqrt(PULSE_BUDGET/thMax))));
  const h=1.0/(nz-1);
  const G=par.G, T=Math.max(par.T,1e-6);
  const nSteps=Math.max(4,Math.round(thMax/h));
  const nSnap=Math.min(par.nSnap||90,nSteps);

  let A=new Float64Array(nz), B=new Float64Array(nz), Q=new Float64Array(nz);
  const An=new Float64Array(nz), Bn=new Float64Array(nz), Qn=new Float64Array(nz);
  const snaps=[], outB=[], outA=[], tOut=[];
  const SA=(a,b,q)=>-0.5*G*q*b;
  const SB=(a,b,q)=>+0.5*G*q*a;
  const SQ=(a,b,q)=>(a*b-q)/T;

  /* Manley-Rowe bookkeeping */
  let fluxIn=0, fluxOut=0;
  const N0=0;

  for(let n=0;n<=nSteps;n++){
    const th=n*h;
    if(n>0){
      /* --- interior: exact advection + Heun source ------------------ */
      for(let j=0;j<nz;j++){
        const jA=Math.max(j-1,0), jB=Math.min(j+1,nz-1);
        const aD=A[jA], bD=B[jA], qD=Q[jA];         /* pump departure   */
        const aE=A[jB], bE=B[jB], qE=Q[jB];         /* Stokes departure */
        const aP=A[j],  bP=B[j],  qP=Q[j];          /* acoustic, in place */
        const ap=aD+h*SA(aD,bD,qD);
        const bp=bE+h*SB(aE,bE,qE);
        const qp=qP+h*SQ(aP,bP,qP);
        An[j]=aD+0.5*h*(SA(aD,bD,qD)+SA(ap,bp,qp));
        Bn[j]=bE+0.5*h*(SB(aE,bE,qE)+SB(ap,bp,qp));
        Qn[j]=qP+0.5*h*(SQ(aP,bP,qP)+SQ(ap,bp,qp));
      }
      A.set(An); B.set(Bn); Q.set(Qn);
    }
    /* --- boundaries: the two pulses being launched ------------------- */
    A[0]=par.pumpAt(th);
    B[nz-1]=par.seedAt(th);
    /* --- record ------------------------------------------------------ */
    outB.push(B[0]);                 /* the compressed Stokes leaving z=0 */
    outA.push(A[nz-1]);              /* transmitted pump leaving z=1      */
    tOut.push(th);
    fluxIn +=h*(A[0]*A[0]+B[nz-1]*B[nz-1]);
    fluxOut+=h*(A[nz-1]*A[nz-1]+B[0]*B[0]);
    if(nSnap>0&&(n%Math.max(1,Math.round(nSteps/nSnap))===0))
      snaps.push({th,A:Array.from(A),B:Array.from(B),Q:Array.from(Q)});
  }
  /* residual photon number left inside the cell at the end */
  let nLeft=0;
  for(let j=0;j<nz;j++) nLeft+=h*(A[j]*A[j]+B[j]*B[j]);
  return {nz,nzReq,h,G,T,snaps,outB,outA,tOut,nSteps,
          derated:(nz<nzReq),
          fluxIn,fluxOut,nLeft,N0,
          balance:(fluxIn-fluxOut-nLeft)/(fluxIn||1)};
}

/* FWHM of a sampled trace, with interpolated crossings; 0 if it never
   reaches half of its own peak. */
function traceFWHM(t,y){
  let pk=0,ip=0;
  for(let i=0;i<y.length;i++) if(y[i]>pk){ pk=y[i]; ip=i; }
  if(pk<=0) return {fwhm:0,peak:0,tPeak:0};
  const half=pk/2;
  let a=null,b=null;
  for(let i=ip;i>0;i--) if(y[i-1]<half){ a=t[i-1]+(t[i]-t[i-1])*(half-y[i-1])/(y[i]-y[i-1]); break; }
  for(let i=ip;i<y.length-1;i++) if(y[i+1]<half){ b=t[i]+(t[i+1]-t[i])*(y[i]-half)/(y[i]-y[i+1]); break; }
  return {fwhm:(a!==null&&b!==null)?b-a:0, peak:pk, tPeak:t[ip]};
}

/* Build the compressor case from the sim's own state. */
function buildPulse(st,S,gB){
  const v=C_SI/S.n;                        /* m/s                        */
  const L=st.Lcell/100;                    /* cm -> m                    */
  const tTransit=L/v;                      /* s                          */
  const G=gB*st.Ip*st.Lcell;               /* cm/GW * GW/cm^2 * cm       */
  const T=S.tauKin/tTransit;               /* phonon lifetime, transits  */
  const ns=1e-9/tTransit;                  /* one nanosecond, in transits*/
  const pumpFW=st.pumpNs*ns, seedFW=st.seedNs*ns;
  const pumpT0=Math.max(pumpFW,1.0)*0.9;
  const seedT0=pumpT0+st.seedDelay*ns;
  const thMax=Math.max(pumpT0+pumpFW*1.4+2.2, seedT0+seedFW*1.4+2.2);
  const seedAmp=Math.sqrt(Math.max(st.seed,1e-18));
  const sol=solvePulse({
    G,T,thMax,nz:st.pulseNz,nSnap:90,
    pumpAt:th=>pulseShape(th,pumpT0,pumpFW,3),      /* near flat-top */
    seedAt:th=>seedAmp*pulseShape(th,seedT0,seedFW,1),
  });
  /* in/out pulse metrics, in NANOSECONDS */
  const tns=sol.tOut.map(x=>x*tTransit/1e-9);
  const Iout=sol.outB.map(x=>x*x);
  const Iin =sol.tOut.map(th=>Math.pow(seedAmp*pulseShape(th,seedT0,seedFW,1),2));
  const Ipump=sol.tOut.map(th=>Math.pow(pulseShape(th,pumpT0,pumpFW,3),2));
  const mo=traceFWHM(tns,Iout), mi=traceFWHM(tns,Iin), mp=traceFWHM(tns,Ipump);
  /* Which snapshots are worth looking at?  The solve runs long enough for the
     whole pump to clear, so a scrub over the FULL run spends most of its
     travel on an empty cell — the default view showed nothing at all.  Find
     the window in which the Stokes pulse is actually inside the cell and let
     the time slider address that instead. */
  let sMax=0;
  const sEnergy=sol.snaps.map(sn=>{
    let e=0; for(let j=0;j<sn.B.length;j++) e+=sn.B[j]*sn.B[j];
    if(e>sMax) sMax=e; return e;
  });
  let k0=0, k1=sol.snaps.length-1;
  if(sMax>0){
    const thr=sMax*1e-4;
    while(k0<k1&&sEnergy[k0]<thr) k0++;
    while(k1>k0&&sEnergy[k1]<thr) k1--;
    k0=Math.max(0,k0-2); k1=Math.min(sol.snaps.length-1,k1+2);
  }
  if(k1-k0<4){ k0=0; k1=sol.snaps.length-1; }
  /* energies (arbitrary common units): integrate the intensity traces */
  const trapz=(x,y)=>{ let s=0; for(let i=1;i<x.length;i++)
    s+=0.5*(y[i]+y[i-1])*(x[i]-x[i-1]); return s; };
  const Ein=trapz(tns,Ipump), Eout=trapz(tns,Iout), Eseed=trapz(tns,Iin);
  /* Is the grid actually resolving this?  At large G the Stokes pulse steepens
     into a near-shock and a fixed grid stops tracking it — SF6 at 14.9 atm in
     a 1 m cell gives G ~ 370 and the photon-number residual reaches ~10%.
     Manley-Rowe is the honest self-diagnosis: the solve knows it has lost
     photons, so the view says so instead of printing a compression ratio it
     cannot support. */
  const resid=Math.abs(sol.balance);
  const converged=resid<0.02;
  return {sol,tns,Iout,Iin,Ipump,G,T,tTransit,snapLo:k0,snapHi:k1,
          resid,converged,
          mOut:mo,mIn:mi,mPump:mp,
          compression:(mi.fwhm>0&&mo.fwhm>0)?mi.fwhm/mo.fwhm:0,
          peakGain:(mi.peak>0)?mo.peak/mi.peak:0,
          efficiency:(Ein>0)?Eout/Ein:0,
          Ein,Eout,Eseed,
          tauNs:S.tauKin/1e-9,
          /* the compressed pulse cannot be shorter than the acoustic response */
          floorNs:S.tauKin/1e-9};
}

     needs I_p L ~ 330 GW cm/cm².  At 20 cm and 0.5 GW/cm² the view was blank,
     which is true but useless.  3.5 GW/cm² is still an order of magnitude
     below gas breakdown, which this file does not model. */
  Ip:3.5, Lcell:100.0, seed:1e-11, pulse:20.0,
  /* the transient compressor */
  pumpNs:12.0, seedNs:4.0, seedDelay:3.0, pulseNz:200, pulseT:0.62,
  /* the scan */
  scanQty:'gain', scanAllGases:false,
  /* beta: the velocity-dependence parameter of the Averbakh kernel.  0 is the
     conventional BGK backbone; the published velocity-dependent papers use
     0.005.  Above ~0.02 the kernel develops a spurious sharp resonance and
     the gain overshoots by ~10x, so the slider stops well short of that. */
  beta:0.0,
  /* display */
  showData:true, showNS:true, showBridge:true, showBoyd:true, showAvb:true,
  logY:true,

  anim:true, speed:1.0, spin:false, probe:0,

/* pump-wavelength presets — the two that matter to this project plus the two
   standard lab lines */
const PUMPS=[
  {id:'266',  name:'266 nm', lam:266.1165, note:'Mironov&rsquo;s 4th harmonic &mdash; the Kr/N₂/Ar data'},
  {id:'248',  name:'248 nm', lam:248.0,    note:'KrF &mdash; the Offenberger SF₆ data'},
  {id:'532',  name:'532 nm', lam:532.233,  note:'2nd harmonic &mdash; halves q, doubles y'},
  {id:'1064', name:'1064 nm',lam:1064.466, note:'Nd:YAG fundamental'},
];

/* Boyd, Nonlinear Optics 4th ed, Table 9.3.1 (p. 431), quoted at 694 nm.
   g0 in m/GW as printed; 1 m/GW = 100 cm/GW.  These are the LANDMARKS the
   gas numbers should be read against — the whole point of a pressure vessel
   is that gases start ~3 decades below a liquid. */
const BOYD_TABLE=[
  {name:'CS₂',        nuB:5850, dnu:52.3, g0:1.5},
  {name:'acetone',    nuB:4600, dnu:224,  g0:0.2},
  {name:'toluene',    nuB:5910, dnu:579,  g0:0.13},
  {name:'CCl₄',       nuB:4390, dnu:520,  g0:0.06},
  {name:'methanol',   nuB:4250, dnu:250,  g0:0.13},
  {name:'benzene',    nuB:6470, dnu:289,  g0:0.18},
  {name:'water',      nuB:5690, dnu:317,  g0:0.048},
  {name:'CH₄ 1400 atm',nuB:150, dnu:10,   g0:1.0},
  {name:'fused silica',nuB:25800,dnu:78,  g0:0.045},
];

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
/* NB: fmt() returns an em-dash for a non-finite value.  A panel check that
   only looks for NaN/undefined is therefore BLIND to it — the sims
   Known-bad list records this.  checkPanels() below looks for the dash too. */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
function fmtSI(x,unit,n){
  if(!isFinite(x)) return '—';
  const A=Math.abs(x);
  const P=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],
           [1e-9,'n'],[1e-12,'p'],[1e-15,'f']];
  for(const [s,p] of P) if(A>=s||s===1e-15) return sigf(x/s,n||3)+' '+p+unit;
  return sigf(x,n||3)+' '+unit;
}
function fmtHz(x,n){ return fmtSI(x,'Hz',n); }
function fmtM(x,n){ return fmtSI(x,'m',n); }
function fmtS(x,n){ return fmtSI(x,'s',n); }

/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
function buildModel(st){
  const rng=pressureRange(st.gas);
  const S=sbsState(st.gas,st.P,st.T,st.lam,{Zrot:st.Zrot});
  const meas=measuredAt(st.gas,st.P,st.lam);

  /* the amplifier, at the current gain */
  const gUse=S.gKin!==null?S.gKin:S.gHyd;
  const amp=amplifier(gUse,st.Ip,st.Lcell,st.seed,240);
  /* steady state needs the pump to last many phonon lifetimes */
  const nTau=st.pulse*1e-9/S.tauKin;

  /* where does this gas sit in the crossover? */
  const regime = S.y<0.5?'kinetic' : S.y>2?'hydrodynamic' : 'crossover';

  /* The pressure sweep is LAZY.  buildModel runs on every slider tick, but
     only the scan and regimes views read it; building 140 states eagerly made
     the headless UI drive (and therefore every mutation run) several times
     slower for nothing. */
  const NS=140;
  /* The Averbakh solve costs ~40x a closed form (a Faddeeva evaluation per
     detuning per pressure), so its sweep gets its own coarser grid.  30
     points over three decades is still smooth on a log axis. */
  const NS_AVB=30;
  let _sweep=null, _avb=null, _pulse=null, _avbHere=null;
  const M={st,S,meas,amp,gUse,nTau,regime,rng,
           pumps:PUMPS, boyd:BOYD_TABLE, NS_AVB,
           /* endpoints are cheap and the panel tag wants only these */
           yLo:sbsState(st.gas,rng[0],st.T,st.lam,{Zrot:st.Zrot}).y,
           yHi:sbsState(st.gas,rng[1],st.T,st.lam,{Zrot:st.Zrot}).y};
  Object.defineProperty(M,'sweep',{get(){
    if(!_sweep){
      _sweep=[];
      for(let i=0;i<NS;i++){
        const f=i/(NS-1);
        const P=Math.exp(lerp(Math.log(rng[0]),Math.log(rng[1]),f));
        _sweep.push(sbsState(st.gas,P,st.T,st.lam,{Zrot:st.Zrot}));
      }
    }
    return _sweep;
  }});
  /* the exact kinetic solve at the CURRENT point */
  Object.defineProperty(M,'avb',{get(){
    if(!_avbHere) _avbHere=averbakhSpecAt(S,st.beta,301);
    return _avbHere;
  }});
  /* and swept in pressure, for the scan view */
  Object.defineProperty(M,'avbSweep',{get(){
    if(!_avb){
      _avb=[];
      for(let i=0;i<NS_AVB;i++){
        const f=i/(NS_AVB-1);
        const P=Math.exp(lerp(Math.log(rng[0]),Math.log(rng[1]),f));
        const a=averbakhAt(st.gas,P,st.T,st.lam,st.beta,301);
        _avb.push({P,nuB:a.nuB,fwhm:a.fwhm,gB:a.gB,Rpk:a.Rpk,y:a.y,
                   tau:1/(2*Math.PI*a.fwhm)});
      }
    }
    return _avb;
  }});
  /* the transient compressor */
  Object.defineProperty(M,'pulse',{get(){
    if(!_pulse) _pulse=buildPulse(st,S,gUse);
    return _pulse;
  }});
  return M;
}

/* The measured (nu_B, g_B) point as the SPECTRUM view plots it — the same
   plane sbs_gui.py uses, with both error bars.  The spectrum's y axis is
   normalised to the model peak, so the gain and its bar are divided by it:
   the vertical offset then reads as "how wrong is the predicted gain" and the
   horizontal one as "how wrong is the predicted shift".

   This lives in the model rather than inside the draw call so selfTest can
   pin the normalisation; buried in the drawing it was untestable, and a
   mutant that dropped the division survived. */
function spectrumDatum(M){
  const m=M.meas, S=M.S;
  if(!m||!m.lamMatch||!(S.gKin>0)) return null;
  return {nu:m.nuB, nuErr:m.nuB_err,
          g:m.gB/S.gKin, gErr:m.gB_err/S.gKin,
          gAbs:m.gB, exact:m.exact};
}

/* Measured reference point, from CF_TABLES, with the pump-wavelength guard:
   the SF6 rows are 248 nm and the Mironov rows 266 nm, so a datum is only
   comparable when the sim is set to the table's own wavelength. */
function measuredAt(gas,P_atm,lam_nm){
  const t=CFTAB[gas];
  if(!t) return null;
  const pa=t.p_atm;
  if(P_atm<pa[0]-1e-6||P_atm>pa[pa.length-1]+1e-6) return null;
  const lamTab=t.lambda_nm!==undefined&&t.lambda_nm!==null?t.lambda_nm:266.1165;
  let exact=-1;
  for(let j=0;j<pa.length;j++) if(Math.abs(P_atm-pa[j])<1e-3) exact=j;
  const ne=t.nuB_err!==undefined?t.nuB_err:0.05;
  const out={
    gB:interpAt(pa,t.gB,P_atm),
    gB_err:interpAt(pa,t.gB_err,P_atm),
    nuB:interpAt(pa,t.nuB,P_atm),
    nuB_err:(Array.isArray(ne)?interpAt(pa,ne,P_atm):ne),
    exact:exact>=0, src:t.src||'Mironov', lamTab,
    lamMatch:Math.abs(lamTab-lam_nm)<0.5,
    dnu:null, dnu_err:null, dnuBootstrap:false,
  };
  /* widths are NEVER interpolated — exact tabulated points only */
  if(exact>=0&&t.dnu&&t.dnu[exact]!==null&&t.dnu[exact]!==undefined){
    out.dnu=t.dnu[exact];
    if(Array.isArray(t.dnu_err)&&t.dnu_err[exact]!==null&&t.dnu_err[exact]!==undefined){
      out.dnu_err=t.dnu_err[exact];
      /* PRA_v13 App. B: only 3/4/5 atm Kr are bootstrap 1-sigma.  2 atm is a
         Fig. 9c digitization, 6 atm a Mironov text value.  Drawn hollow. */
      out.dnuBootstrap=(gas==='Kr'&&[3,4,5].indexOf(t.p_atm[exact])>=0);
    }
  }
  return out;
}

/* ================================================================== *
 *  readout / equation bar / corner tag                                *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function row(k,v,cls){ return '<tr><td>'+k+'</td><td class="v'+(cls?' '+cls:'')
  +'">'+v+'</td></tr>'; }

function readoutHTML(M){
  const S=M.S, st=M.st, m=M.meas;
  const gl=GAS_LABEL[st.gas]||st.gas;
  let s='<div class="rname">'+gl+' at '+fmt(S.Pclamped,2)+' atm'
       +'<small>'+fmt(st.lam,1)+' nm pump &middot; '+fmt(st.T,0)+' K &middot; '
       +M.regime+'</small></div><table>';

  s+=hd('the acoustic wave');
  s+=row('Brillouin shift &nu;<sub>B</sub>',fmt(S.nuB/1e9,3)+' GHz');
  s+=row('grating period &Lambda;',fmt(S.Lam*1e9,2)+' nm');
  s+=row('phase speed',fmt(S.vAc,1)+' m/s');
  s+=row('sound speed c<sub>0</sub>',fmt(S.c0,1)+' m/s');
  s+=row('linewidth &Delta;&nu;',fmt(S.dnuKin/1e9,3)+' GHz');
  s+=row('phonon lifetime &tau;<sub>B</sub>',fmtS(S.tauKin,3));
  s+=row('decay length',fmtM(S.decayLen,3));
  s+=row('quality factor Q',fmt(S.Q,2));

  s+=hd('the regime');
  s+=row('collisionality y',fmt(S.y,3),S.y<0.5?'bad':S.y>2?'good':'');
  s+=row('Knudsen 1/y',fmt(S.Kn,3));
  s+=row('mean free path &ell;',fmtM(S.mfp,3));
  s+=row('&Lambda;/&ell;',fmt(S.Lam/S.mfp,3));

  if(st.view==='pulse'){
    const p=M.pulse;
    s+=hd('the compressor');
    s+=row('gain exponent G',fmt(p.G,2));
    s+=row('&tau;<sub>B</sub> / transit',sigf(p.T,3));
    s+=row('transit time',fmtS(p.tTransit,3));
    s+=row('seed width',fmt(p.mIn.fwhm,3)+' ns');
    s+=row('output width',fmt(p.mOut.fwhm,3)+' ns',
           p.mOut.fwhm<p.mIn.fwhm?'good':'bad');
    s+=row('compression',fmt(p.compression,2)+'&times;',
           p.compression>1.05?'good':'');
    s+=row('peak enhancement',sigf(p.peakGain,3)+'&times;');
    s+=row('energy extracted',fmt(100*p.efficiency,2)+'%');
    s+=row('acoustic floor',fmt(p.floorNs,3)+' ns',
           p.mOut.fwhm<1.5*p.floorNs?'bad':'');
  }

  s+=hd('the gain');
  s+=row('Averbakh (exact BGK)',fmt(M.avb?averbakhGain(S,M.avb):NaN,4)+' cm/GW');
  s+=row('kinetic, Eq.&nbsp;(27)',S.gKin!==null?fmt(S.gKin,4)+' cm/GW':'—');
  s+=row('Boyd (9.3.24)',fmt(S.gHyd,4)+' cm/GW');
  if(m&&m.lamMatch)
    s+=row('measured',fmt(m.gB,4)+' &plusmn; '+fmt(m.gB_err,4)
          +(m.exact?'':'<sup>i</sup>'),'good');

  /* the measured pair, as sbs_gui.py reports it: value +/- bar for BOTH the
     gain and the shift, interpolated between the tabulated pressures, with
     the interpolation flagged rather than hidden */
  if(m&&m.lamMatch){
    s+=hd('measured'+(m.exact?' (tabulated)':' (interpolated)'));
    s+=row('&nu;<sub>B</sub>',fmt(m.nuB,3)+' &plusmn; '+fmt(m.nuB_err,3)+' GHz');
    s+=row('g<sub>B</sub>',fmt(m.gB,4)+' &plusmn; '+fmt(m.gB_err,4)+' cm/GW');
    if(m.dnu!==null)
      s+=row('&Delta;&nu;',fmt(m.dnu,3)
            +(m.dnu_err!==null?' &plusmn; '+fmt(m.dnu_err,3):'')+' GHz'
            +(m.dnuBootstrap?'':'<sup>*</sup>'));
    s+=row('shift vs Eq.&nbsp;(29)',fmt(100*(S.nuB/1e9/m.nuB-1),2)+'%',
           Math.abs(S.nuB/1e9/m.nuB-1)<0.02?'good':'');
    s+=row('gain vs Eq.&nbsp;(27)',
           S.gKin!==null?fmt(100*(S.gKin/m.gB-1),1)+'%':'—',
           (S.gKin!==null&&Math.abs(S.gKin-m.gB)<m.gB_err)?'good':'');
    s+=row('gain vs Averbakh',
           fmt(100*(averbakhGain(S,M.avb)/m.gB-1),1)+'%',
           Math.abs(averbakhGain(S,M.avb)-m.gB)<m.gB_err?'good':'');
  }

  s+=hd('the exact kinetic solve');
  s+=row('&nu;<sub>B</sub> (Averbakh)',fmt(M.avb.nuB/1e9,3)+' GHz');
  s+=row('&Delta;&nu; (Averbakh)',fmt(M.avb.fwhm/1e9,3)+' GHz');
  s+=row('collisional y',fmt(-M.avb.y,3));
  s+=row('&beta;',fmt(st.beta,4));

  s+=hd('the gas');
  s+=row('density &rho;',sigf(S.rho,4)+' kg/m³');
  s+=row('viscosity &eta;',sigf(S.eta*1e6,4)+' µPa&middot;s');
  s+=row('&gamma; = C<sub>p</sub>/C<sub>v</sub>',fmt(S.gam,4));
  s+=row('Prandtl (Eucken)',fmt(S.Pr,4));
  s+=row('&eta;<sub>b</sub>/&eta;',fmt(S.etab,4));
  s+=row('damping &Cscr;',fmt(S.Cq,4));
  s+=row('compressibility Z',fmt(S.Zc,4),Math.abs(S.Zc-1)>0.02?'bad':'');
  s+='</table>';

  /* the honest notes */
  const notes=[];
  if(S.y<0.5) notes.push('<b>y &lt; 0.5:</b> the mean free path is longer than the '
    +'acoustic wavelength. There is no phonon here &mdash; the &ldquo;wave&rdquo; is '
    +'Doppler-selected free streaming, and the Navier&ndash;Stokes width diverges.');
  else if(S.y>2) notes.push('<b>y &gt; 2:</b> genuinely hydrodynamic &mdash; a real '
    +'longitudinal sound wave, which is the picture the textbook formula assumes.');
  else notes.push('<b>crossover:</b> neither limit is clean. Every published '
    +'measurement in this project sits here.');
  if(st.T!==T_TAB) notes.push('<b>T &ne; 298 K:</b> the NIST isotherm is 298 K; '
    +'&rho;, &eta; and c<sub>0</sub> are EXTRAPOLATED (ideal-Z, T<sup>'
    +fmt(GASTAB[st.gas].sExp,2)+'</sup>, &radic;T).');
  if(m&&!m.lamMatch) notes.push('<b>measured points hidden:</b> the '+m.src
    +' data are at '+fmt(m.lamTab,0)+' nm; set the pump there to compare.');
  if(S.clamped) notes.push('<b>pressure clamped</b> to the table range '
    +fmt(M.rng[0],3)+'&ndash;'+fmt(M.rng[1],2)+' atm.');
  s+='<div class="note">'+notes.join('<br>')+'</div>';
  return s;
}

function eqbarHTML(M){
  const S=M.S, v=M.st.view;
  const E={
    cell:['&Lambda; = <span class="hl">&lambda;/2n</span> &nbsp;&middot;&nbsp; '
      +'&nu;<sub>B</sub> = <span class="hl2">2n v/&lambda;</span>',
      'the pump and the Stokes beam beat together; the beat note is a moving '
      +'ruler of period &Lambda;, and it scatters the pump into the Stokes'],
    phonon:['&tau;<sub>B</sub> = <span class="hl">1/&Gamma;<sub>B</sub></span> '
      +'= <span class="hl">1/2&pi;&Delta;&nu;</span>',
      'the linewidth IS the reciprocal lifetime &mdash; a narrow line is a '
      +'long-lived phonon (intensity 1/e time; the amplitude lives twice as long)'],
    scan:['&Gamma;<sub>B</sub> = <span class="hl">&Cscr;&eta;q²/&rho;</span> '
      +'&nbsp;&rarr;&nbsp; &Delta;&nu; &prop; 1/P, &nbsp; &tau;<sub>B</sub> &prop; P',
      'raise the pressure and collisions damp the sound LESS per cycle, because '
      +'&eta; barely moves while &rho; grows'],
    spectrum:['g(&nu;) = g<sub>0</sub> <span class="hl">(&Gamma;<sub>B</sub>/2)² / '
      +'[(&Omega;<sub>B</sub>&minus;&Omega;)² + (&Gamma;<sub>B</sub>/2)²]</span>',
      'Boyd Eq. (9.3.23) &mdash; a Lorentzian of full width &Gamma;<sub>B</sub>, '
      +'but only once there is a phonon to be Lorentzian about'],
    amp:['dI<sub>1</sub>/dz = &minus;g I<sub>1</sub>I<sub>2</sub>, &nbsp; '
      +'dI<sub>2</sub>/dz = &minus;g I<sub>1</sub>I<sub>2</sub> &nbsp;&middot;&nbsp; '
      +'G = <span class="hl">g I<sub>p</sub> L</span>',
      'Boyd Eqs. (9.3.22): the pump feeds the Stokes wave, and the gain exponent '
      +'G is the only thing that matters'],
    regimes:['y = <span class="hl">P/(&eta; q v<sub>0</sub>)</span> = '
      +'<span class="hl2">1/(q&ell;)</span>',
      'collisionality is EXACTLY the inverse Knudsen number &mdash; how many '
      +'collisions happen per acoustic wavelength'],
    pulse:['&part;<sub>t</sub>Q + Q/&tau;<sub>B</sub> = '
      +'<span class="hl">A B</span> &nbsp;&middot;&nbsp; '
      +'&part;<sub>t</sub>B &minus; v&part;<sub>z</sub>B = '
      +'<span class="hl2">&frac12;gv Q A</span>',
      'the acoustic wave has MEMORY &mdash; the seed&rsquo;s leading edge eats the '
      +'pump first, so the trailing edge finds nothing left and the pulse sharpens'],
  };
  const e=E[v]||E.cell;
  return e[0]+'<span class="sm">'+e[1]+'</span>';
}

function eqbarText(M){ return plain(eqbarHTML(M).replace(/<[^>]*>/g,' ')); }

function tagHTML(M){
  const S=M.S, st=M.st;
  const gl=GAS_LABEL[st.gas]||st.gas;
  const T={
    cell:'<b>the cell</b> &mdash; a gas at '+fmt(S.Pclamped,2)+' atm, and the '
      +'&Lambda; = '+fmt(S.Lam*1e9,1)+' nm grating the two beams write into it',
    phonon:'<b>the phonon</b> &mdash; one longitudinal wave, living '
      +fmtS(S.tauKin,2)+' and travelling '+fmtM(S.decayLen,2)+' before it is gone',
    scan:'<b>the scan</b> &mdash; '+gl+' from '+fmt(M.rng[0],3)+' to '
      +fmt(M.rng[1],1)+' atm',
    spectrum:'<b>the spectrum</b> &mdash; gain against detuning, and which limit '
      +'the lineshape is actually in',
    amp:'<b>the amplifier</b> &mdash; G = '+fmt(M.amp.G,2)+', reflectivity '
      +fmt(100*M.amp.R,2)+'%',
    regimes:'<b>the regimes</b> &mdash; where every gas sits between free '
      +'streaming and sound',
    pulse:'<b>the pulse</b> &mdash; a '+fmt(st.seedNs,1)+' ns seed on a '
      +fmt(st.pumpNs,1)+' ns pump, compressed '
      +fmt(M.pulse.compression,2)+'&times; to '+fmt(M.pulse.mOut.fwhm,2)+' ns',
  };
  return T[st.view]||T.cell;
}

/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
/* EXTENDED for this sim.  Two defects in the shared version were found by the
   UI-drive assertion that no entity may reach fillText:
     (1) the table had no Greek, and plain() returns an unknown entity
         UNCHANGED, so '&rho;' was drawn as six characters on the canvas;
     (2) the regex was /&[a-z]+;/g \u2014 LOWERCASE ONLY \u2014 so '&Lambda;' and
         '&Delta;' could never have matched even once they were in the table.
   plain() now also strips tags, per the Known-bad list: canvas has no markup
   parser and '<sub>' is five characters. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026',
            '&alpha;':'\u03b1','&beta;':'\u03b2','&gamma;':'\u03b3','&delta;':'\u03b4',
            '&epsilon;':'\u03b5','&eta;':'\u03b7','&kappa;':'\u03ba','&lambda;':'\u03bb',
            '&mu;':'\u03bc','&nu;':'\u03bd','&pi;':'\u03c0','&rho;':'\u03c1',
            '&sigma;':'\u03c3','&tau;':'\u03c4','&phi;':'\u03c6','&omega;':'\u03c9',
            '&Gamma;':'\u0393','&Delta;':'\u0394','&Lambda;':'\u039b','&Pi;':'\u03a0',
            '&Sigma;':'\u03a3','&Phi;':'\u03a6','&Omega;':'\u03a9',
            '&plusmn;':'\u00b1','&ne;':'\u2260','&asymp;':'\u2248','&equiv;':'\u2261',
            '&prop;':'\u221d','&radic;':'\u221a','&infin;':'\u221e','&middot;':'\u00b7',
            '&rarr;':'\u2192','&larr;':'\u2190','&ell;':'\u2113','&sup2;':'\u00b2',
            '&sup3;':'\u00b3','&frac12;':'\u00bd','&le;':'\u2264','&ge;':'\u2265'};
function plain(s){
  return String(s).replace(/&[a-zA-Z][a-zA-Z0-9]*;/g,
                           m=>ENTS[m]!==undefined?ENTS[m]:m)
                  .replace(/<\/?[a-zA-Z][^>]*>/g,'');
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  const xt=o.xticks||ticksFor(xlo,xhi,6), yt=o.yticks||ticksFor(ylo,yhi,5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range.
   The house rule is that anything drawn from axis limits rather than from data
   must be clipped to the plot box, and this helper did not: the amplifier's
   undepleted-limit curve reaches 11 GW/cm² on a 3.9 axis and was drawn right
   across the title and off the top of the stage.
   A canvas ctx.clip() would fix the browser but NOT the audit — the display-list
   recorder treats clip() as a no-op, so the captured geometry would still lie.
   Clipping the segments themselves keeps the recorded display list honest, and
   the crossing points are interpolated so a curve still meets the frame edge
   exactly instead of stopping short. */
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const inY=y=>y>=ylo&&y<=yhi;
  let started=false;
  for(let i=0;i<n-1;i++){
    let x0=xs[i], y0=ys[i], x1=xs[i+1], y1=ys[i+1];
    if(!isFinite(x0)||!isFinite(y0)||!isFinite(x1)||!isFinite(y1)){
      started=false; continue; }
    const a=inY(y0), c=inY(y1);
    if(!a&&!c){ started=false; continue; }          /* wholly outside */
    if(!a){                                          /* entering: clip start */
      const yc=y0<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x0=x0+(x1-x0)*t; y0=yc; started=false;
    }
    if(!c){                                          /* leaving: clip end   */
      const yc=y1<ylo?ylo:yhi, t=(yc-y0)/(y1-y0);
      x1=x0+(x1-x0)*t; y1=yc;
    }
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    if(!c) started=false;
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* ================================================================== *
 *  shared drawing bits                                                *
 * ================================================================== */
const COL={
  pump:'#5ac8e0', stokes:'#cd35c4', sound:'#b8ec4c', ref:'#e8843a',
  cell:'#39404f', dim:'#8b93a6', data:'#f2f4f8',
  /* The exact kinetic solve needs its OWN slot: drawn in the magenta the
     house reserves for live markers, the Averbakh curve was the same colour
     as the nu_B rule beside it and as the pressure cursor in the scan. */
  exact:'#a98bff',
};

/* A caption stating a scale distortion.  The house rule is that ANY
   exaggeration is printed on the canvas; these views are full of them. */
function scaleNote(ctx,x,y,txt,maxW){
  caption(ctx,x,y,txt,maxW||420,'#7a8296','10.5px -apple-system, sans-serif');
}

/* ---- bottom-caption geometry -------------------------------------------
   Captions live in a reserved strip at the foot of the stage.  A plot box
   must stop far enough above it to leave room for the x-axis label, which
   axes() draws 21 px below the box and which is ~11 px tall.  Getting this
   wrong is invisible in a browser at one size and obvious in the audit, so
   the arithmetic lives in one place.                                       */
const CAP_LINE=24, CAP_BOT=20, XLAB_DROP=21, XLAB_H=13, CAP_GAP=10;
function capY(H,i,n){ return H-CAP_BOT-(n-1-i)*CAP_LINE; }
function plotBottom(H,n){                    /* lowest legal b.y1 */
  return capY(H,0,n)-CAP_GAP-XLAB_H-XLAB_DROP;
}

/* A legend, drawn INSIDE the box at the bottom-left.  It used to sit at the
   top right, where it fell under the floating readout panel (which covers
   x > W-317, y < 470) and in the 2x2 scan layout ran clean off the canvas.
   Bottom-left is empty for every curve this file draws: gain, shift and
   lifetime all rise with pressure, and the width falls from the left. */
function legendAt(ctx,b,items){
  const n=items.length;
  let ly=b.y1-8-14*n;
  ctx.save();
  ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  for(const it of items){
    if(it.diamond){
      const X=b.x+22, Y=ly+5;
      ctx.beginPath();
      ctx.moveTo(X,Y-4.6); ctx.lineTo(X+4.6,Y);
      ctx.lineTo(X,Y+4.6); ctx.lineTo(X-4.6,Y); ctx.closePath();
      if(it.hollow){ ctx.fillStyle='#070b18'; ctx.fill();
                     ctx.strokeStyle=it.col; ctx.lineWidth=1.5; ctx.stroke(); }
      else { ctx.fillStyle=it.col; ctx.fill(); }
    } else if(it.dot){
      ctx.beginPath(); ctx.arc(b.x+22,ly+5,3.2,0,TAU);
      if(it.hollow){ ctx.fillStyle='#070b18'; ctx.fill();
                     ctx.strokeStyle=it.col; ctx.lineWidth=1.3; ctx.stroke(); }
      else { ctx.fillStyle=it.col; ctx.fill(); }
    } else {
      ctx.save(); ctx.strokeStyle=it.col; ctx.lineWidth=it.lw||1.8;
      if(it.dash) ctx.setLineDash(it.dash);
      ctx.beginPath(); ctx.moveTo(b.x+10,ly+5); ctx.lineTo(b.x+34,ly+5);
      ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it.lab),b.x+40,ly);
    ly+=14;
  }
  ctx.restore();
}

function drawArrow(ctx,x1,y1,x2,y2,col,lw,head){
  const a=Math.atan2(y2-y1,x2-x1); head=head||7;
  ctx.strokeStyle=col; ctx.lineWidth=lw||2; ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-0.4),y2-head*Math.sin(a-0.4));
  ctx.lineTo(x2-head*Math.cos(a+0.4),y2-head*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill();
}

/* painter's algorithm over a quad list */
function paintQuads(ctx,cam,B,quads){
  const out=[];
  for(const q of quads){
    const ps=q.p.map(p=>project(cam,B,p));
    if(ps.some(p=>p===null)) continue;
    let z=0; for(const p of ps) z+=p.z; z/=ps.length;
    out.push({ps,z,fill:q.fill,stroke:q.stroke,lw:q.lw,alpha:q.alpha});
  }
  out.sort((a,b)=>b.z-a.z);
  for(const o of out){
    ctx.save();
    if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
    ctx.beginPath(); ctx.moveTo(o.ps[0].x,o.ps[0].y);
    for(let i=1;i<o.ps.length;i++) ctx.lineTo(o.ps[i].x,o.ps[i].y);
    ctx.closePath();
    if(o.fill){ ctx.fillStyle=o.fill; ctx.fill(); }
    if(o.stroke){ ctx.strokeStyle=o.stroke; ctx.lineWidth=o.lw||1; ctx.stroke(); }
    ctx.restore();
  }
  return out.length;
}

/* ================================================================== *
 *  VIEW: the cell                                                     *
 * ================================================================== */
const CELL_L=6.0, CELL_R=1.25, BEAM_R=0.30;
const NFRINGE=26;                 /* fringes DRAWN across the cell        */

function drawCell(ctx,W,H,M,S_){
  const S=M.S, st=M.st;
  const cam=S_.cam; cam.W=W; cam.H=H;
  const B=camBasis(cam);
  const t=S_.time();
  const quads=[];

  /* --- the vessel: an open cylinder, so the inside is visible --------- */
  const NA=48;
  for(let i=0;i<NA;i++){
    const a0=i/NA*TAU, a1=(i+1)/NA*TAU;
    const nx=Math.cos((a0+a1)/2), ny=Math.sin((a0+a1)/2);
    /* outward normal in the y-z plane; cull the near half so we see in */
    const toEye=v3.norm(v3.sub(B.eye,[0,CELL_R*nx,CELL_R*ny]));
    if(v3.dot([0,nx,ny],toEye)>0) continue;         /* near half: skip    */
    const sh=0.30+0.30*Math.max(0,ny);
    quads.push({p:[[-CELL_L/2,CELL_R*Math.cos(a0),CELL_R*Math.sin(a0)],
                   [ CELL_L/2,CELL_R*Math.cos(a0),CELL_R*Math.sin(a0)],
                   [ CELL_L/2,CELL_R*Math.cos(a1),CELL_R*Math.sin(a1)],
                   [-CELL_L/2,CELL_R*Math.cos(a1),CELL_R*Math.sin(a1)]],
                fill:shade(COL.cell,sh)});
  }
  /* --- windows ------------------------------------------------------- */
  for(const sx of [-1,1]){
    const x=sx*CELL_L/2, pts=[];
    for(let i=0;i<NA;i++){ const a=i/NA*TAU;
      pts.push([x,CELL_R*Math.cos(a),CELL_R*Math.sin(a)]); }
    /* One filled disc, NOT a stroked triangle fan: stroking each wedge drew
       48 radial spokes converging on the axis, which reads as a shading
       defect (the polar-mesh seam artefact on the Known-bad list).  The rim
       is drawn once, separately. */
    quads.push({p:pts,fill:'rgba(120,170,200,0.10)'});
    quads.push({p:pts,stroke:'rgba(150,200,230,0.22)',lw:1.0});
  }

  /* --- the acoustic grating inside the beam -------------------------- */
  /* The real grating has Lambda = S.Lam; the cell is ~20 cm.  We draw
     NFRINGE fringes and PRINT the magnification. */
  if(st.showGrating){
    const NSEG=NFRINGE*5, NK=8;
    const phase=t*S.nuB*1e-9*TAU*st.speed*0.35;   /* slowed, and labelled  */
    const r=BEAM_R*1.16;
    for(let i=0;i<NSEG;i++){
      const f0=i/NSEG, f1=(i+1)/NSEG;
      const x0=-CELL_L/2+CELL_L*f0, x1=-CELL_L/2+CELL_L*f1;
      const ph=TAU*NFRINGE*(f0+f1)/2-phase;
      const amp=0.5+0.5*Math.cos(ph);
      const c=mix('#0d1420',COL.sound,0.16+0.84*amp);
      for(let k=0;k<NK;k++){
        const a0=k/NK*TAU, a1=(k+1)/NK*TAU;
        const nx=Math.cos((a0+a1)/2), ny=Math.sin((a0+a1)/2);
        /* cull the far half of the tube: it is hidden behind the near half
           anyway, and halving the quad count halves what the headless
           recorder has to JSON.stringify on every captured frame. */
        const toEye=v3.norm(v3.sub(B.eye,[0,r*nx,r*ny]));
        if(v3.dot([0,nx,ny],toEye)<0) continue;
        quads.push({p:[[x0,r*Math.cos(a0),r*Math.sin(a0)],
                       [x1,r*Math.cos(a0),r*Math.sin(a0)],
                       [x1,r*Math.cos(a1),r*Math.sin(a1)],
                       [x0,r*Math.cos(a1),r*Math.sin(a1)]],
                    fill:c,alpha:0.30+0.55*amp});
      }
    }
  }
  /* --- the two beams ------------------------------------------------- */
  if(st.showBeams){
    for(const bm of [{r:BEAM_R*0.62,c:COL.pump,off:0.0},
                     {r:BEAM_R*0.30,c:COL.stokes,off:0.0}]){
      for(let k=0;k<14;k++){
        const a0=k/14*TAU, a1=(k+1)/14*TAU;
        quads.push({p:[[-CELL_L/2-1.6,bm.r*Math.cos(a0),bm.r*Math.sin(a0)+bm.off],
                       [ CELL_L/2+0.5,bm.r*Math.cos(a0),bm.r*Math.sin(a0)+bm.off],
                       [ CELL_L/2+0.5,bm.r*Math.cos(a1),bm.r*Math.sin(a1)+bm.off],
                       [-CELL_L/2-1.6,bm.r*Math.cos(a1),bm.r*Math.sin(a1)+bm.off]],
                    fill:bm.c,alpha:0.16});
      }
    }
  }
  const nq=paintQuads(ctx,cam,B,quads);

  /* --- labels in screen space ---------------------------------------- */
  const pIn =project(cam,B,[-CELL_L/2-1.75,0,0]);
  const pOut=project(cam,B,[ CELL_L/2+0.7,0,0]);
  const pTop=project(cam,B,[0,0,CELL_R+0.45]);
  ctx.font='12px -apple-system, sans-serif';
  if(pIn){
    drawArrow(ctx,pIn.x-56,pIn.y-16,pIn.x+6,pIn.y-16,COL.pump,2.4);
    ctx.fillStyle=COL.pump; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('pump  '+fmt(st.lam,1)+' nm',pIn.x-56,pIn.y-21);
    drawArrow(ctx,pIn.x+6,pIn.y+18,pIn.x-56,pIn.y+18,COL.stokes,2.4);
    ctx.fillStyle=COL.stokes; ctx.textBaseline='top';
    /* literal U+2212, NOT '&minus;': canvas has no entity parser, and the
       .replace() that used to patch this bound to ' GHz' alone by operator
       precedence, so the entity reached fillText verbatim. */
    ctx.fillText('Stokes  −'+fmt(S.nuB/1e9,2)+' GHz',pIn.x-56,pIn.y+23);
  }
  if(pTop){
    ctx.fillStyle=COL.sound; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(plain('acoustic grating &mdash; travelling right at '
                       +fmt(S.vAc,0)+' m/s'),pTop.x,pTop.y-4);
  }
  if(pOut){
    ctx.fillStyle='#6f7789'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('depleted pump',pOut.x+8,pOut.y);
  }

  /* --- the magnified callout: what the grating REALLY looks like ------ */
  if(st.showCallout) drawGratingCallout(ctx,W,H,M);

  /* --- captions ------------------------------------------------------ */
  const realFringes=0.20/S.Lam;              /* a 20 cm cell              */
  scaleNote(ctx,14,H-56,plain(
    'SCALE: the grating is drawn with '+NFRINGE+' fringes across the cell. A real '
    +'20 cm cell at &Lambda; = '+fmt(S.Lam*1e9,1)+' nm holds '
    +sigf(realFringes,3)+' of them &mdash; a magnification of ×'
    +sigf(realFringes/NFRINGE,3)+'. The fringe motion is slowed by ~10⁹ '
    +'(a real '+fmt(S.nuB/1e9,2)+' GHz).'),W-330);
  scaleNote(ctx,14,H-24,plain(
    'The cell body is drawn open (near half culled) so the interior is visible. '
    +'Beam radii are arbitrary; nothing transverse is to scale.'),W-330);
  return nq;
}

/* the inset: one honest picture of the density wave over a few Lambda */
function drawGratingCallout(ctx,W,H,M){
  const S=M.S, st=M.st;
  const bw=Math.min(330,W*0.34), bh=124;
  const b=box(W-bw-16,H-bh-92,bw,bh);
  ctx.save();
  ctx.fillStyle='rgba(8,10,16,0.88)'; ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.fill(); ctx.stroke();
  const inner=box(b.x+10,b.y+24,b.w-20,b.h-46);
  const nP=180, xs=[], ys=[];
  const t=0;
  for(let i=0;i<nP;i++){
    const f=i/(nP-1);
    xs.push(f*3);                                    /* 3 acoustic periods */
    ys.push(Math.cos(TAU*f*3));
  }
  axes(ctx,inner,0,3,-1.35,1.35,{xticks:[0,1,2,3],yticks:[-1,0,1],
       xfmt:v=>fmt(v,0)+'Λ',yfmt:v=>fmt(v,0)});
  polyline(ctx,inner,xs,ys,0,3,-1.35,1.35,COL.sound,1.8);
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 11.5px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(plain('density ripple &delta;&rho;/&rho;, three periods'),
               b.x+10,b.y+7);
  /* top-right, not bottom-right: the bottom-right corner is where the last
     x-tick ("3Λ") lands, and the two overlapped. */
  ctx.fillStyle='#6f7789'; ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(plain('&Lambda; = '+fmt(S.Lam*1e9,2)+' nm'),b.x1-10,b.y+8);
  ctx.restore();
}

/* ================================================================== *
 *  VIEW: the phonon                                                   *
 * ================================================================== */
function drawPhonon(ctx,W,H,M,S_){
  const S=M.S, st=M.st;
  const t=S_.time();
  const pad=58, RO_X=W-13-280-24;
  /* Three stacked panels, each with room BELOW it for its own caption and
     ABOVE it for the next panel's title.  Cramming them cost four text
     collisions in the first layout audit. */
  const NCAP=1;
  const top=48, bot=plotBottom(H,NCAP);
  const hEach=(bot-top)/3;
  const PANEL_H=hEach-56;                  /* 22 caption + 34 title/x-label */
  const bA=box(pad,top,RO_X-pad-14,PANEL_H);
  const bB=box(pad,top+hEach,RO_X-pad-14,PANEL_H);
  const bC=box(pad,top+2*hEach,RO_X-pad-14,PANEL_H);

  /* ---- A: the longitudinal displacement, drawn as moving planes ------ */
  const nAtom=170;
  ctx.save();
  frame(ctx,bA,'#242a3a');
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain('a longitudinal wave: the gas bunches and rarefies along the beam'),
               bA.x,bA.y-9);
  const cyc=3.0;                                   /* periods across panel */
  const ph=TAU*t*st.speed*0.6;
  /* For a longitudinal wave the density perturbation is MINUS the displacement
     gradient: delta-rho/rho = -du/dx.  Writing u = +A sin(kx-wt) and colouring
     by +cos(kx-wt) put the two in ANTIPHASE — the atoms were drawn most spread
     out exactly where they were coloured densest.  Parameterise by the
