     compression depth itself so the two cannot drift apart again:
        u = -(MOD / 2 pi c) sin(theta)   =>   -du/df = +MOD cos(theta)
     which is the same cos(theta) the colour and the curve below use. */
  const MOD=0.55;                       /* peak fractional density modulation */
  for(let i=0;i<nAtom;i++){
    const f=i/(nAtom-1);
    const th=TAU*cyc*f-ph;
    const u=-(MOD/(TAU*cyc))*Math.sin(th);
    const X=bA.x+bA.w*(f+u);
    if(X<bA.x||X>bA.x1) continue;
    const dens=0.5+0.5*Math.cos(th);
    for(let k=0;k<5;k++){
      const Y=bA.y+bA.h*(0.18+0.16*k);
      ctx.fillStyle=mix('#26303f',COL.sound,0.25+0.75*dens);
      ctx.beginPath(); ctx.arc(X,Y,1.7,0,TAU); ctx.fill();
    }
  }
  /* the density envelope under it */
  const xs1=[],ys1=[];
  for(let i=0;i<220;i++){ const f=i/219;
    xs1.push(f); ys1.push(Math.cos(TAU*cyc*f-ph)); }
  const bAl=box(bA.x,bA.y+bA.h*0.62,bA.w,bA.h*0.34);
  polyline(ctx,bAl,xs1,ys1,0,1,-1.25,1.25,COL.sound,1.6);
  ctx.strokeStyle='#242a3a'; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(bAl.x,bAl.y+bAl.h/2); ctx.lineTo(bAl.x1,bAl.y+bAl.h/2); ctx.stroke();
  ctx.restore();
  scaleNote(ctx,bA.x,bA.y1+8,plain(
    'Drawn at &delta;&rho;/&rho; = '+fmt(MOD,2)+' (really ~10⁻⁵); atoms crowd where '
    +'the curve peaks, since &delta;&rho;/&rho; = &minus;du/dx. '+fmt(cyc,0)
    +' periods shown, real period '+fmt(S.Lam*1e9,1)+' nm.'),bA.w);

  /* ---- B: the ring-down — amplitude against time -------------------- */
  const tau=S.tauKin;
  const tMax=6*tau;
  const nB=400, xsB=[], ysB=[], xsE=[], ysE=[];
  for(let i=0;i<nB;i++){
    const f=i/(nB-1), tt=f*tMax;
    /* the ACOUSTIC AMPLITUDE decays at 2 tau (intensity at tau) */
    const env=Math.exp(-tt/(2*tau));
    xsB.push(tt/1e-9); ysB.push(env*Math.cos(TAU*S.nuB*tt));
    xsE.push(tt/1e-9); ysE.push(env);
  }
  axes(ctx,bB,0,tMax/1e-9,-1.15,1.15,{
    xlab:'time after the drive stops  (ns)',
    /* Q is the point of this panel: at Kr/3 atm it is ~1, so the phonon does
       not even finish one oscillation.  Without saying so the single visible
       wobble looks like a drawing error rather than the physics. */
    title:'ring-down after the light stops — Q = '+fmt(S.Q,2)+', i.e. '
      +(S.Q<2?'barely one oscillation before it dies'
             :fmt(S.Q,1)+' oscillations before it dies'),
    xfmt:v=>fmt(v,2),yfmt:v=>fmt(v,1)});
  polyline(ctx,bB,xsB,ysB,0,tMax/1e-9,-1.15,1.15,COL.sound,1.4);
  polyline(ctx,bB,xsE,ysE,0,tMax/1e-9,-1.15,1.15,COL.ref,1.4,[5,4]);
  polyline(ctx,bB,xsE,ysE.map(v=>-v),0,tMax/1e-9,-1.15,1.15,COL.ref,1.4,[5,4]);
  /* mark tau and 2 tau */
  [[tau,'τ_B (intensity 1/e)'],[2*tau,'2τ_B (amplitude 1/e)']].forEach(([tv,lab],i)=>{
    const X=bB.x+bB.w*(tv/1e-9)/(tMax/1e-9);
    if(X>bB.x&&X<bB.x1){
      ctx.save(); ctx.strokeStyle=rgba(COL.ref,0.55); ctx.lineWidth=1;
      ctx.setLineDash([3,3]); ctx.beginPath();
      ctx.moveTo(X,bB.y); ctx.lineTo(X,bB.y1); ctx.stroke(); ctx.restore();
      ctx.fillStyle=COL.ref; ctx.font='10px -apple-system, sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText(plain(lab),X+4,bB.y+4+12*i);
    }
  });

  /* ---- C: how far it gets -------------------------------------------- */
  const Ld=S.decayLen, xMax=6*Ld;
  /* The decay length runs from ~20 nm to a few µm depending on the gas and
     pressure, so a FIXED µm axis printed every tick as "0.0" or "0.1".  Pick
     the unit from the range. */
  const U=xMax<1e-6?[1e9,'nm']:xMax<1e-3?[1e6,'µm']:[1e3,'mm'];
  const xMaxU=xMax*U[0];
  const nC=420, xsD=[], ysD=[];
  for(let i=0;i<nC;i++){
    const f=i/(nC-1), zz=f*xMax;
    xsD.push(zz*U[0]); ysD.push(Math.exp(-zz/(2*Ld)));
  }
  /* the carrier is far too fine to draw at this scale: draw the envelope
     and say so, rather than aliasing a 133 nm wave across 600 px. */
  axes(ctx,bC,0,xMaxU,0,1.15,{
    xlab:'distance travelled  ('+U[1]+')',
    title:'how far one phonon gets before it is gone',
    xfmt:v=>sigf(v,2),yfmt:v=>fmt(v,1)});
  polyline(ctx,bC,xsD,ysD,0,xMaxU,0,1.15,COL.ref,1.8);
  const XL=bC.x+bC.w*(Ld*U[0])/xMaxU;
  ctx.save(); ctx.strokeStyle=rgba(COL.sound,0.6); ctx.lineWidth=1.2;
  ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(XL,bC.y); ctx.lineTo(XL,bC.y1);
  ctx.stroke(); ctx.restore();
  ctx.fillStyle=COL.sound; ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(plain('decay length v&tau;_B = '+fmtM(Ld,3)+'  =  '
    +sigf(Ld/S.Lam,3)+' acoustic wavelengths'),XL+5,bC.y+5);
  scaleNote(ctx,bC.x,capY(H,0,NCAP),plain(
    'Only the ENVELOPE is drawn here: at '+fmt(S.Lam*1e9,1)+' nm the carrier '
    +'would be '+sigf(xMax/S.Lam,3)+' cycles across the panel, which is pure '
    +'aliasing, not physics.'),RO_X-bC.x);
  return 3;
}

/* ================================================================== *
 *  VIEW: the pulse — transient amplification and compression          *
 * ================================================================== */
function drawPulse(ctx,W,H,M,S_){
  const S=M.S, st=M.st, p=M.pulse, sol=p.sol;
  const NCAP=3, RO_X=readoutX(W);
  const yBot=plotBottom(H,NCAP);
  const cw=(RO_X-YGUT-14-YGUT)/2;
  const bL=box(YGUT,54,cw,yBot-54);
  const bR=box(YGUT+cw+YGUT,54,cw,yBot-54);

  /* ---- left: the snapshot inside the cell ---------------------------- */
  /* the time slider addresses only the window where the Stokes pulse is
     actually inside the cell — see buildPulse */
  const k=clamp(Math.round(p.snapLo+st.pulseT*(p.snapHi-p.snapLo)),
                0,sol.snaps.length-1);
  const sn=sol.snaps[k]||{th:0,A:[],B:[],Q:[]};
  const z=[], AA=[], BB=[], QQ=[];
  for(let j=0;j<sn.A.length;j++){
    z.push(j/(sn.A.length-1)*st.Lcell);
    AA.push(sn.A[j]*sn.A[j]);            /* intensities, normalised to I_p0 */
    BB.push(sn.B[j]*sn.B[j]);
    QQ.push(Math.abs(sn.Q[j]));
  }
  let ymax=1.15;
  for(const v of AA) if(v>ymax) ymax=v*1.08;
  for(const v of BB) if(v>ymax) ymax=v*1.08;
  axes(ctx,bL,0,st.Lcell,0,ymax,{
    xlab:'position along the cell  (cm)',
    ylab:'intensity / peak pump in',
    title:'inside the cell at t = '+fmt(sn.th*p.tTransit/1e-9,2)+' ns',
    xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,2)});
  polyline(ctx,bL,z,AA,0,st.Lcell,0,ymax,COL.pump,2.0);
  polyline(ctx,bL,z,BB,0,st.Lcell,0,ymax,COL.stokes,2.0);
  /* the acoustic amplitude on its own scale — it is the memory that makes
     the compression happen, and it is far smaller than either beam */
  let qmax=1e-30; for(const v of QQ) if(v>qmax) qmax=v;
  const QN=QQ.map(v=>v/qmax*ymax*0.34);
  polyline(ctx,bL,z,QN,0,st.Lcell,0,ymax,COL.sound,1.5,[4,3]);
  legendAt(ctx,bL,[
    {col:COL.pump,lw:2,lab:'pump (→)'},
    {col:COL.stokes,lw:2,lab:'Stokes (←)'},
    {col:COL.sound,lw:1.5,dash:[4,3],
     lab:'acoustic |Q|, rescaled ×'+sigf(ymax*0.34/qmax,2)}]);

  /* ---- right: the pulses in time, in and out ------------------------- */
  const tns=p.tns;
  let pmax=Math.max(p.mOut.peak,p.mIn.peak,1.0)*1.12;
  axes(ctx,bR,tns[0],tns[tns.length-1],0,pmax,{
    xlab:'time  (ns)',ylab:'intensity / peak pump in',
    title:'what goes in, and what comes out',
    xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,2)});
  polyline(ctx,bR,tns,p.Ipump,tns[0],tns[tns.length-1],0,pmax,COL.pump,1.6,[5,4]);
  polyline(ctx,bR,tns,p.Iout,tns[0],tns[tns.length-1],0,pmax,COL.stokes,2.2);
  /* the seed, scaled up so it is visible at all next to the output */
  let smax=1e-30; for(const v of p.Iin) if(v>smax) smax=v;
  const seedScale=(smax>0)?(pmax*0.22/smax):1;
  polyline(ctx,bR,tns,p.Iin.map(v=>v*seedScale),tns[0],tns[tns.length-1],
           0,pmax,COL.sound,1.6);
  legendAt(ctx,bR,[
    {col:COL.pump,lw:1.8,dash:[5,4],lab:'pump in (at z = 0)'},
    {col:COL.sound,lw:1.8,lab:'seed in, ×'+sigf(seedScale,2)+' to be visible'},
    {col:COL.stokes,lw:2.2,lab:'Stokes out (at z = 0)'}]);
  /* mark the two widths */
  if(p.mOut.fwhm>0){
    const X=bR.x+bR.w*(p.mOut.tPeak-tns[0])/(tns[tns.length-1]-tns[0]);
    ctx.save(); ctx.strokeStyle=rgba(COL.stokes,0.55); ctx.lineWidth=1;
    ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(X,bR.y); ctx.lineTo(X,bR.y1);
    ctx.stroke(); ctx.restore();
    /* Anchored to the PANEL, not to the marker: keyed to the peak time this
       label ran under the floating readout whenever the pulse arrived late. */
    ctx.fillStyle=COL.stokes; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(fmt(p.mIn.fwhm,2)+' ns → '+fmt(p.mOut.fwhm,2)+' ns  ('
      +fmt(p.compression,2)+'× shorter, ×'+sigf(p.peakGain,3)+' taller)'),
      bR.x+8,bR.y+6);
  }

  /* ---- the honest notes ---------------------------------------------- */
  const notes=[];
  if(!p.converged)
    notes.push('⚠ UNDER-RESOLVED at G = '+fmt(p.G,1)+': '+sigf(p.resid*100,2)
      +'% of the photons are lost numerically (Manley–Rowe is exact). That is an '
      +'UPPER bound — at G = 368, 200→400 cells cuts it 8.1%→3.5% (and 0.1% by '
      +'3200) while the width moves under 5%. Raise the grid to check.');
  else
    notes.push('G = '+fmt(p.G,2)+',  τ_B = '+fmt(p.tauNs,3)+' ns = '+sigf(p.T,3)
      +' of a cell transit ('+fmt(p.tTransit/1e-9,2)+' ns). Photon number is '
      +'conserved to '+sigf(p.resid*100,2)+'%, so the grid is tracking it.');
  if(p.mOut.fwhm>0&&p.mOut.fwhm<1.5*p.floorNs)
    notes.push('⚠ The output is within 1.5× of τ_B = '+fmt(p.floorNs,3)+' ns, the '
      +'FLOOR on SBS compression: the grating cannot be written or erased faster '
      +'than the gas responds. Below it the model is extrapolating.');
  else
    notes.push('The compression floor is τ_B = '+fmt(p.floorNs,3)+' ns: the '
      +'grating cannot be written or erased faster than the phonon responds, so '
      +'no amount of gain shortens the pulse past it.');
  /* When the grid has been derated that is the more actionable thing to say,
     so it REPLACES the modelling caveat rather than being appended to it —
     appended, it wrapped past the bottom of the stage. */
  notes.push(sol.derated
    ? '⚠ Grid auto-reduced to '+sol.nz+' of the '+sol.nzReq+' cells asked: this '
      +'run is '+sigf(sol.nSteps*1.0/(sol.nz-1),3)+' cell transits and the cost '
      +'goes as nz²×transits. Lengthen the cell or shorten the pump.'
    : 'Real envelopes at exact resonance (no phase), a chosen seed rather than '
      +'thermal noise, and depletion as the only saturation.');
  scaleNote(ctx,14,capY(H,0,NCAP),plain(notes[0]),RO_X-30);
  scaleNote(ctx,14,capY(H,1,NCAP),plain(notes[1]),RO_X-30);
  scaleNote(ctx,14,capY(H,2,NCAP),plain(notes[2]),RO_X-30);
  return 2;
}

/* ================================================================== *
 *  VIEW: the scan  — the one this file exists for                     *
 * ================================================================== */
/* Y-GUTTER: the rotated y-axis label is drawn at b.x-40 and tools/audit.py
   skips rotated text by design, so an overrun is raster-only.  Two columns
   therefore need >= 46 px of gutter.  (sims Known-bad list.) */
const YGUT=52;
/* Left edge of the floating readout panel (280 px wide, 13 px inset, plus the
   audit's 24 px allowance).  Plot content that carries LABELS must stop here;
   tools/audit.py reports text past it as hidden, and it genuinely is. */
function readoutX(W){ return W-13-280-24; }

/* Decade ticks.  The guard is NOT decoration: Math.log10(0) is -Infinity, so a
   non-positive low bound turns the loop below into an infinite one.  That
   really happened — unchecking every display box left the scan panel with no
   curves, the empty-range fallback set the bound to 0, and the page hung. */
function logTicks(lo,hi,maxN){
  const out=[];
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)||hi<lo) return out;
  maxN=maxN||9;
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  /* Thin as the span widens.  The amplifier's threshold auto-range can cover
     seven decades, where 1-2-5 per decade is 22 ticks and the labels overlap
     each other into mush (12 collisions in the layout audit). */
  const decades=e1-e0;
  const mant=decades<=2?[1,2,5]:[1];
  const step=Math.max(1,Math.ceil((decades+1)/maxN));
  for(let e=e0;e<=e1;e+=step){
    for(const mDigit of mant){
      const v=mDigit*Math.pow(10,e);
      if(v>=lo*0.999&&v<=hi*1.001) out.push(v);
    }
  }
  return out;
}

const SCAN_QTY=[
  {id:'shift', name:'shift'},
  {id:'width', name:'width'},
  {id:'tau',   name:'lifetime'},
  {id:'gain',  name:'gain'},
  {id:'all',   name:'all four'},
];

/* The Averbakh curve rides its own coarser pressure grid, so it carries its
   own x array rather than sharing the closed form's. */
function avbCurve(M,pick,col,lab,dash){
  if(!M.st.showAvb) return null;
  const s=M.avbSweep;
  return {x:s.map(r=>r.P), y:s.map(pick), col:col||COL.exact, lw:1.8,
          dash:dash||null, lab:lab};
}

/* The measured value AND its error bar at the pressure currently set, per
   scanned quantity — sbs_gui.py's experimental_peak() interpolates both
   linearly between the tabulated pressures and tags the point "interp".

   WIDTH and LIFETIME deliberately return null unless the cursor sits exactly
   on a tabulated pressure: CF_TABLES' widths are never interpolated (the Kr
   grid has no 1-atm width at all and the SF6 grid is ~3 atm coarse), so an
   interpolated width would be an invention, not a measurement. */
function liveDatum(M,qty){
  const m=M.meas;
  if(!m||!m.lamMatch) return null;
  if(qty==='shift') return {v:m.nuB, e:m.nuB_err, exact:m.exact, unit:'GHz'};
  if(qty==='gain')  return {v:m.gB,  e:m.gB_err,  exact:m.exact, unit:'cm/GW'};
  if(m.dnu===null||m.dnu===undefined) return null;
  if(qty==='width') return {v:m.dnu, e:(m.dnu_err||0), exact:true, unit:'GHz'};
  if(qty==='tau'){
    const t=1/(2*Math.PI*m.dnu*1e9)*1e9;
    return {v:t, e:(m.dnu_err?t*m.dnu_err/m.dnu:0), exact:true, unit:'ns'};
  }
  return null;
}

function scanSeries(M,qty){
  const st=M.st;
  const P=M.sweep.map(s=>s.P);
  const out={P,curves:[],pts:[],ylab:'',title:'',log:true};
  const tab=CFTAB[st.gas];
  const lamTab=(tab&&tab.lambda_nm!==undefined&&tab.lambda_nm!==null)?tab.lambda_nm:266.1165;
  const lamOK=tab&&Math.abs(lamTab-st.lam)<0.5;

  if(qty==='shift'){
    out.ylab='Brillouin shift  ν_B  (GHz)'; out.log=false;
    out.title='the shift: Doppler corner → acoustic corner';
    out.curves.push({y:M.sweep.map(s=>s.nuB/1e9),col:COL.sound,lw:2,
                     lab:'Eq. (29) bridge'});
    const a=avbCurve(M,r=>r.nuB/1e9,COL.exact,'Averbakh (exact BGK)');
    if(a) out.curves.push(a);
    /* the two exact corners, as reference lines */
    out.curves.push({y:M.sweep.map(s=>s.q*s.v0/(2*Math.PI)/Math.SQRT2/1e9),
                     col:COL.ref,lw:1.2,dash:[5,4],lab:'Doppler corner  q v₀/2√2π'});
    out.curves.push({y:M.sweep.map(s=>s.q*Math.sqrt(s.gam/2)*s.v0/(2*Math.PI)/1e9),
                     col:COL.pump,lw:1.2,dash:[2,3],lab:'acoustic corner  q c_s/2π'});
    if(lamOK&&st.showData) out.pts=tab.p_atm.map((p,i)=>({
      x:p,y:tab.nuB[i],
      e:(Array.isArray(tab.nuB_err)?tab.nuB_err[i]:(tab.nuB_err!==undefined?tab.nuB_err:0.05)),
      filled:true}));
  }
  else if(qty==='width'){
    out.ylab='linewidth  Δν  (GHz)';
    out.title='the width: the kinetic ceiling vs the 1/P hydrodynamic law';
    if(st.showBridge) out.curves.push({y:M.sweep.map(s=>s.dnuKin/1e9),col:COL.sound,
                                       lw:2,lab:'crossover bridge'});
    const a=avbCurve(M,r=>r.fwhm/1e9,COL.exact,'Averbakh (exact BGK)');
    if(a) out.curves.push(a);
    if(st.showNS) out.curves.push({y:M.sweep.map(s=>s.dnuNS/1e9),col:COL.ref,lw:1.6,
                                   dash:[6,4],lab:'Navier–Stokes  𝒞ηq²/ρ'});
    if(lamOK&&st.showData&&tab.dnu) tab.p_atm.forEach((p,i)=>{
      if(tab.dnu[i]===null||tab.dnu[i]===undefined) return;
      const de=Array.isArray(tab.dnu_err)?tab.dnu_err[i]:null;
      out.pts.push({x:p,y:tab.dnu[i],e:de,
        /* hollow = not a bootstrap error bar (digitized / text value) */
        filled:(st.gas==='Kr'&&[3,4,5].indexOf(p)>=0)});
    });
  }
  else if(qty==='tau'){
    out.ylab='phonon lifetime  τ_B  (ns)';
    out.title='the lifetime: τ_B = 1/2πΔν, rising roughly ∝ P once collisions rule';
    out.curves.push({y:M.sweep.map(s=>s.tauKin*1e9),col:COL.sound,lw:2,
                     lab:'from the bridge width'});
    const a=avbCurve(M,r=>r.tau*1e9,COL.exact,'from the Averbakh width');
    if(a) out.curves.push(a);
    if(st.showNS) out.curves.push({y:M.sweep.map(s=>s.tauNS*1e9),col:COL.ref,lw:1.6,
                                   dash:[6,4],lab:'from the N–S width'});
    if(lamOK&&st.showData&&tab.dnu) tab.p_atm.forEach((p,i)=>{
      if(tab.dnu[i]===null||tab.dnu[i]===undefined) return;
      const tv=1/(2*Math.PI*tab.dnu[i]*1e9)*1e9;
      const de=Array.isArray(tab.dnu_err)?tab.dnu_err[i]:null;
      out.pts.push({x:p,y:tv,
        e:(de!==null&&de!==undefined)?tv*de/tab.dnu[i]:null,
        filled:(st.gas==='Kr'&&[3,4,5].indexOf(p)>=0)});
    });
  }
  else {
    out.ylab='peak gain  g_B  (cm/GW)';
    out.title='the gain: the kinetic closed form vs the textbook hydrodynamic one';
    out.curves.push({y:M.sweep.map(s=>s.gKin),col:COL.sound,lw:2,
                     lab:'kinetic, Eq. (27)'});
    const a=avbCurve(M,r=>r.gB,COL.exact,'Averbakh (exact BGK)');
    if(a) out.curves.push(a);
    if(st.showBoyd) out.curves.push({y:M.sweep.map(s=>s.gHyd),col:COL.ref,lw:1.6,
                                     dash:[6,4],lab:'Boyd (9.3.24), N–S width'});
    if(lamOK&&st.showData) out.pts=tab.p_atm.map((p,i)=>({
      x:p,y:tab.gB[i],e:tab.gB_err[i],filled:true}));
  }
  return out;
}

function drawScanPanel(ctx,b,M,qty){
  const st=M.st, ser=scanSeries(M,qty), P=ser.P;
  const xlo=M.rng[0], xhi=M.rng[1];
  /* y range from the drawn content only */
  let ylo=Infinity, yhi=-Infinity;
  const consider=v=>{ if(isFinite(v)&&(!ser.log||v>0)){ ylo=Math.min(ylo,v); yhi=Math.max(yhi,v); } };
  ser.curves.forEach(c=>c.y.forEach(consider));
  ser.pts.forEach(p=>{ consider(p.y); if(p.e){ consider(p.y+p.e); consider(Math.max(p.y-p.e,1e-30)); } });
  /* the interpolated datum counts toward the range too, or a point between
     two tabulated pressures can be drawn outside the box */
  {
    const lp0=liveDatum(M,qty);
    if(lp0){ consider(lp0.v);
             if(lp0.e>0){ consider(lp0.v+lp0.e); consider(Math.max(lp0.v-lp0.e,1e-30)); } }
  }
  /* Nothing drawn (every display box off) must still give a LEGAL range —
     on a log axis the fallback has to be positive, not 0. */
  const empty=!isFinite(ylo)||!isFinite(yhi)||yhi<=ylo;
  if(empty){ ylo=ser.log?0.1:0; yhi=ser.log?10:1; }
  if(ser.log){ ylo=Math.log10(Math.max(ylo*0.7,1e-30));
               yhi=Math.log10(Math.max(yhi*1.45,1e-29)); }
  else { const pad=(yhi-ylo)*0.14||1; ylo-=pad; yhi+=pad; }
  const LX=Math.log10(xlo), HX=Math.log10(xhi);
  const fy=v=>ser.log?Math.log10(Math.max(v,1e-30)):v;

  axes(ctx,b,LX,HX,ylo,yhi,{
    xticks:logTicks(xlo,xhi).map(Math.log10),
    yticks:ser.log?logTicks(Math.pow(10,ylo),Math.pow(10,yhi)).map(Math.log10):undefined,
    xfmt:v=>{ const q=Math.pow(10,v); return q>=1?fmt(q,0):fmt(q,q<0.1?2:1); },
    yfmt:v=>{ const q=ser.log?Math.pow(10,v):v;
              return q>=100?fmt(q,0):q>=1?fmt(q,q>=10?1:2):sigf(q,2); },
    xlab:'pressure  (atm)', ylab:ser.ylab, title:ser.title});

  if(empty){
    /* say so, rather than presenting an empty box as if it were a result */
    ctx.fillStyle='#6f7789'; ctx.font='italic 12.5px Georgia, serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('nothing selected to draw',b.x+b.w/2,b.y+b.h/2);
  }
  ser.curves.forEach(c=>{
    /* a curve may carry its own x grid — the Averbakh sweep is coarser */
    const xs=(c.x||P).map(Math.log10);
    polyline(ctx,b,xs,c.y.map(fy),LX,HX,ylo,yhi,c.col,c.lw,c.dash);
  });

  /* the measured points, with error bars — clipped to the box (Known-bad:
     a data bar wider than the axis still needs clipping) */
  ctx.save();
  ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
  ser.pts.forEach(p=>{
    const X=b.x+b.w*(Math.log10(p.x)-LX)/(HX-LX);
    const Y=b.y1-b.h*(fy(p.y)-ylo)/(yhi-ylo);
    if(p.e){
      const Y1=b.y1-b.h*(fy(p.y+p.e)-ylo)/(yhi-ylo);
      const Y2=b.y1-b.h*(fy(Math.max(p.y-p.e,1e-30))-ylo)/(yhi-ylo);
      ctx.strokeStyle=rgba(COL.data,0.75); ctx.lineWidth=1.1;
      ctx.beginPath(); ctx.moveTo(X,Y1); ctx.lineTo(X,Y2);
      ctx.moveTo(X-3,Y1); ctx.lineTo(X+3,Y1);
      ctx.moveTo(X-3,Y2); ctx.lineTo(X+3,Y2); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(X,Y,3.4,0,TAU);
    if(p.filled){ ctx.fillStyle=COL.data; ctx.fill(); }
    else { ctx.fillStyle='#070b18'; ctx.fill();
           ctx.strokeStyle=COL.data; ctx.lineWidth=1.3; ctx.stroke(); }
  });
  /* the live marker */
  const XM=b.x+b.w*(Math.log10(M.S.Pclamped)-LX)/(HX-LX);
  ctx.strokeStyle=rgba(COL.stokes,0.75); ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(XM,b.y); ctx.lineTo(XM,b.y1); ctx.stroke();
  ctx.setLineDash([]);

  /* THE INTERPOLATED DATUM at the pressure you have set, with its error bar —
     the same thing sbs_gui.py plots: experimental_peak() interpolates the
     value AND the bar linearly between the tabulated pressures, and the
     marker is FILLED when it lands on a table point and HOLLOW when it is an
     interpolation.  Drawn as a diamond so it cannot be confused with the
     hollow CIRCLES in the width panels, which mean something else entirely
     (no bootstrap error bar). */
  const lp=liveDatum(M,qty);
  if(lp){
    const Y=b.y1-b.h*(fy(lp.v)-ylo)/(yhi-ylo);
    if(lp.e>0){
      const Y1=b.y1-b.h*(fy(lp.v+lp.e)-ylo)/(yhi-ylo);
      const Y2=b.y1-b.h*(fy(Math.max(lp.v-lp.e,1e-30))-ylo)/(yhi-ylo);
      ctx.strokeStyle=COL.stokes; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(XM,Y1); ctx.lineTo(XM,Y2);
      ctx.moveTo(XM-4,Y1); ctx.lineTo(XM+4,Y1);
      ctx.moveTo(XM-4,Y2); ctx.lineTo(XM+4,Y2); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(XM,Y-5.2); ctx.lineTo(XM+5.2,Y);
    ctx.lineTo(XM,Y+5.2); ctx.lineTo(XM-5.2,Y); ctx.closePath();
    if(lp.exact){ ctx.fillStyle=COL.stokes; ctx.fill();
                  ctx.strokeStyle='#070b18'; ctx.lineWidth=1.1; ctx.stroke(); }
    else { ctx.fillStyle='#070b18'; ctx.fill();
           ctx.strokeStyle=COL.stokes; ctx.lineWidth=1.6; ctx.stroke(); }
  }
  ctx.restore();

  /* the legend, bottom-left inside the box */
  const items=ser.curves.map(c=>({col:c.col,lw:c.lw,dash:c.dash,lab:c.lab}));
  if(ser.pts.length){
    items.push({dot:true,col:COL.data,
                lab:'measured ('+(CFTAB[st.gas].src||'Mironov')+')'});
    if(qty==='width'||qty==='tau')
      items.push({dot:true,hollow:true,col:COL.data,lab:'hollow: no bootstrap bar'});
  }
  const lpL=liveDatum(M,qty);
  if(lpL) items.push({diamond:true,hollow:!lpL.exact,col:COL.stokes,
    lab:lpL.exact?'at your pressure (tabulated)'
                 :'at your pressure (interpolated)'});
  legendAt(ctx,b,items);
}

function drawScan(ctx,W,H,M,S_){
  const st=M.st, NCAP=2, RO_X=readoutX(W);
  const yBot=plotBottom(H,NCAP);
  if(st.scanQty==='all'){
    /* The 2x2 grid stops at RO_X: the readout panel floats over the top-right
       of the stage, and a panel drawn under it is not merely overlapped, its
       labels are unreadable.  Right column ends clear of it. */
    const usable=RO_X-YGUT-14;
    const cw=(usable-YGUT)/2;
    /* Between two stacked panels there must be room for the upper one's
       x-axis label AND the lower one's title, or they overlap — which is
       exactly what the audit caught: 21 px drop + 13 label + 8 gap + 13 title
       + 9 title offset = 64. */
    const ROW_GAP=64;
    const hh=(yBot-52-ROW_GAP)/2;
    const y2=52+hh+ROW_GAP;
    const B=[box(YGUT,52,cw,hh),box(YGUT+cw+YGUT,52,cw,hh),
             box(YGUT,y2,cw,hh),box(YGUT+cw+YGUT,y2,cw,hh)];
    ['shift','width','tau','gain'].forEach((q,i)=>drawScanPanel(ctx,B[i],M,q));
  } else {
    const b=box(YGUT+18,52,RO_X-YGUT-30,yBot-52);
    drawScanPanel(ctx,b,M,st.scanQty);
  }
  const S=M.S;
  scaleNote(ctx,14,capY(H,0,NCAP),plain(
    'Both axes are logarithmic except the shift. The dashed vertical is the '
    +'pressure you have set (y = '+fmt(S.y,2)+'). Measured points are drawn only '
    +'when the pump matches the table&rsquo;s own wavelength.'),RO_X-30);
  scaleNote(ctx,14,capY(H,1,NCAP),plain(
    'Kr widths: only 3/4/5 atm carry bootstrap 1σ bars; 2 atm is a figure '
    +'digitization and 6 atm a text value (PRA_v13 App. B) — drawn hollow.'),RO_X-30);
  return 4;
}

/* ================================================================== *
 *  VIEW: the spectrum                                                 *
 * ================================================================== */
function drawSpectrum(ctx,W,H,M,S_){
  const S=M.S, st=M.st, NCAP=3, RO_X=readoutX(W);
  const b=box(YGUT+18,54,RO_X-YGUT-30,plotBottom(H,NCAP)-54);
  const nuRef=S.q*S.v0/(2*Math.PI);
  const xhi=2.6*nuRef/1e9, xlo=-xhi;
  const n=700, xs=[];
  for(let i=0;i<n;i++) xs.push(xlo+(xhi-xlo)*i/(n-1));

  const yKin=xs.map(g=>shapeKinetic(g*1e9,S));
  const yBri=xs.map(g=>shapeBridge(g*1e9,S)-shapeBridge(-g*1e9,S));
  const yHyd=xs.map(g=>shapeHydro(g*1e9,S)-shapeHydro(-g*1e9,S));
  /* The EXACT kinetic lineshape.  Unlike the other three this is not a
     model of the shape — it IS the shape, solved at every detuning, and it
     is antisymmetric of its own accord (Im R is odd in the detuning), so it
     needs no antisymmetrising by hand. */
  const avb=M.avb;
  const g_=GASTAB[S.gas];
  const yAvb=st.showAvb?xs.map(f=>
    averbakhImR(-2*Math.PI*(f*1e9)/(S.q*S.v0),avb.y,g_.avbAlpha,g_.avbDelta,st.beta)
      /avb.Rpk):null;
  let ylo=-1.25,yhi=1.25;

  axes(ctx,b,xlo,xhi,ylo,yhi,{
    xlab:'detuning from the pump  (GHz)   —   Stokes side is positive',
    ylab:'gain, normalised to peak',
    title:'the gain spectrum: which limit is the lineshape actually in?',
    xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,1)});

  /* zero lines */
  ctx.save(); ctx.strokeStyle='#2a3142'; ctx.lineWidth=1;
  const Y0=b.y1-b.h*(0-ylo)/(yhi-ylo);
  ctx.beginPath(); ctx.moveTo(b.x,Y0); ctx.lineTo(b.x1,Y0); ctx.stroke();
  const X0=b.x+b.w*(0-xlo)/(xhi-xlo);
  ctx.beginPath(); ctx.moveTo(X0,b.y); ctx.lineTo(X0,b.y1); ctx.stroke();
  ctx.restore();

  polyline(ctx,b,xs,yHyd,xlo,xhi,ylo,yhi,COL.ref,1.5,[6,4]);
  polyline(ctx,b,xs,yBri,xlo,xhi,ylo,yhi,COL.sound,2.0);
  polyline(ctx,b,xs,yKin,xlo,xhi,ylo,yhi,COL.pump,1.5,[2,3]);
  if(yAvb) polyline(ctx,b,xs,yAvb,xlo,xhi,ylo,yhi,COL.exact,2.0);

  /* mark nu_B and the FWHM of the working model */
  const XB=b.x+b.w*((S.nuB/1e9)-xlo)/(xhi-xlo);
  ctx.save(); ctx.strokeStyle=rgba(COL.stokes,0.8); ctx.lineWidth=1.2;
  ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(XB,b.y); ctx.lineTo(XB,b.y1);
  ctx.stroke(); ctx.restore();
  ctx.fillStyle=COL.stokes; ctx.font='11px -apple-system, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(plain('model ν_B = '+fmt(S.nuB/1e9,3)+' GHz'),XB,b.y-2);

  /* The DRAWN curve is the Stokes lobe minus the anti-Stokes lobe.  When the
     width is comparable to the shift — which is the whole point of the
     crossover — the two overlap and the visible maximum is pulled toward zero,
     so it does NOT sit on the model nu_B.  Find it numerically and say so,
     rather than letting the mismatch look like a drawing error. */
  let iPk=0;
  for(let i=0;i<n;i++) if(yBri[i]>yBri[iPk]) iPk=i;
  const nuDrawn=xs[iPk];
  const pkShift=Math.abs(nuDrawn-S.nuB/1e9)/(S.nuB/1e9);
  if(pkShift>0.02){
    const XP=b.x+b.w*(nuDrawn-xlo)/(xhi-xlo);
    const YP=b.y1-b.h*(yBri[iPk]-ylo)/(yhi-ylo);
    ctx.save(); ctx.strokeStyle=COL.sound; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(XP,YP-9); ctx.lineTo(XP,YP-2); ctx.stroke();
    ctx.restore();
    ctx.fillStyle=COL.sound; ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText(plain('drawn peak '+fmt(nuDrawn,3)+' GHz ('+fmt(-100*
      (1-nuDrawn/(S.nuB/1e9)),1)+'%)'),XP-4,YP-10);
  }

  const XA=b.x+b.w*((S.nuB-S.dnuKin/2)/1e9-xlo)/(xhi-xlo);
  const XC=b.x+b.w*((S.nuB+S.dnuKin/2)/1e9-xlo)/(xhi-xlo);
  const YH=b.y1-b.h*(0.5-ylo)/(yhi-ylo);
  ctx.save(); ctx.strokeStyle=COL.sound; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(XA,YH); ctx.lineTo(XC,YH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(XA,YH-4); ctx.lineTo(XA,YH+4);
  ctx.moveTo(XC,YH-4); ctx.lineTo(XC,YH+4); ctx.stroke(); ctx.restore();
  ctx.fillStyle=COL.sound; ctx.textBaseline='top'; ctx.textAlign='center';
  ctx.fillText(plain('Δν = '+fmt(S.dnuKin/1e9,3)+' GHz'),(XA+XC)/2,YH+6);

  /* THE MEASURED POINT, with BOTH error bars — the (nu_B, g_B) plane is
     exactly what sbs_gui.py plots, x = the Brillouin shift and y = the peak
     gain, each interpolated between the tabulated pressures along with its
     bar.  The y axis here is normalised to the model peak, so the measured
     gain is divided by the model's: the vertical offset then reads directly
     as "how far off is the predicted gain", and the horizontal one as "how
     far off is the predicted shift". */
  const md=spectrumDatum(M);
  if(md){
    const gN=md.g, gE=md.gErr;
    const px=v=>b.x+b.w*(v-xlo)/(xhi-xlo);
    const py=v=>b.y1-b.h*(v-ylo)/(yhi-ylo);
    const X=px(md.nu), Y=py(gN);
    ctx.save();
    ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
    ctx.strokeStyle=COL.data; ctx.lineWidth=1.3;
    /* x bar: the shift uncertainty */
    ctx.beginPath();
    ctx.moveTo(px(md.nu-md.nuErr),Y); ctx.lineTo(px(md.nu+md.nuErr),Y);
    ctx.moveTo(px(md.nu-md.nuErr),Y-4); ctx.lineTo(px(md.nu-md.nuErr),Y+4);
    ctx.moveTo(px(md.nu+md.nuErr),Y-4); ctx.lineTo(px(md.nu+md.nuErr),Y+4);
    /* y bar: the gain uncertainty */
    ctx.moveTo(X,py(gN-gE)); ctx.lineTo(X,py(gN+gE));
    ctx.moveTo(X-4,py(gN-gE)); ctx.lineTo(X+4,py(gN-gE));
    ctx.moveTo(X-4,py(gN+gE)); ctx.lineTo(X+4,py(gN+gE));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(X,Y,4.2,0,TAU);
    if(md.exact){ ctx.fillStyle=COL.data; ctx.fill();
                  ctx.strokeStyle='#070b18'; ctx.lineWidth=1.1; ctx.stroke(); }
    else { ctx.fillStyle='#070b18'; ctx.fill();
           ctx.strokeStyle=COL.data; ctx.lineWidth=1.6; ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle=COL.data; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(plain(fmt(md.nu,3)+' GHz, '+fmt(md.gAbs,4)+' cm/GW'
      +(md.exact?'':' (interp)')),Math.min(X+9,b.x1-160),Y);
  }

  /* legend — bottom-left, which on this view is the anti-Stokes floor */
  const leg=[{col:COL.sound,lw:1.8,lab:'crossover bridge (this sim&rsquo;s working model)'}];
  if(yAvb) leg.push({col:COL.exact,lw:1.8,
    lab:'Averbakh — the EXACT kinetic solve, at every detuning'});
  leg.push({col:COL.pump,lw:1.6,dash:[2,3],
            lab:'kinetic limit, x·e^(−x²)  — exact at y → 0'});
  leg.push({col:COL.ref,lw:1.6,dash:[6,4],
            lab:'hydrodynamic Lorentzian, N–S width — exact at y → ∞'});
  if(md)
    leg.push({dot:true,hollow:!md.exact,col:COL.data,
      lab:'measured (ν_B, g_B) '+(md.exact?'— tabulated':'— interpolated')
          +', both bars, g ÷ model peak'});
  legendAt(ctx,b,leg);

  const verdict=S.y<0.5
    ? 'y = '+fmt(S.y,2)+' → you are near the KINETIC limit: the blue lobe is the '
      +'right shape and the Lorentzian is not.'
    : S.y>2
    ? 'y = '+fmt(S.y,2)+' → genuinely HYDRODYNAMIC: the orange Lorentzian is the '
      +'right shape, and it is a real phonon resonance.'
    : 'y = '+fmt(S.y,2)+' → the CROSSOVER: neither limiting shape is correct. The '
      +'sim pins the peak and the width exactly and does not pretend to know the wings.';
  scaleNote(ctx,14,capY(H,0,NCAP),plain(verdict),RO_X-30);
  scaleNote(ctx,14,capY(H,1,NCAP),plain(
    'Negative detuning is anti-Stokes LOSS, not gain. All three curves are '
    +'antisymmetrised alike; where Δν approaches ν_B the two lobes overlap and '
    +'pull the visible maximum below the model ν_B (marked when it exceeds 2%).'),
    RO_X-30);
  scaleNote(ctx,14,capY(H,2,NCAP),plain(
    'There is deliberately no interpolated “crossover lineshape”: only the peak '
    +'position and the width bridge across, and inventing wings would dress a '
    +'guess up as a solve.'),RO_X-30);
  return 1;
}

/* ================================================================== *
 *  VIEW: the amplifier                                                *
 * ================================================================== */
function drawAmp(ctx,W,H,M,S_){
  const S=M.S, st=M.st, A=M.amp, NCAP=3, RO_X=readoutX(W);
  const yBot=plotBottom(H,NCAP);
  const cw=(RO_X-YGUT-14-YGUT)/2;
  const bL=box(YGUT,54,cw,yBot-54);
  const bR=box(YGUT+cw+YGUT,54,cw,yBot-54);

  /* ---- left: the two intensities along the cell --------------------- */
  const z=A.prof.map(p=>p.z), I1=A.prof.map(p=>p.I1), I2=A.prof.map(p=>p.I2);
  const ymax=Math.max(st.Ip,Math.max.apply(null,I1))*1.12;
  axes(ctx,bL,0,st.Lcell,0,ymax,{
    xlab:'position along the cell  (cm)',ylab:'intensity  (GW/cm²)',
    title:'pump depletion and Stokes growth',
    xfmt:v=>fmt(v,0),yfmt:v=>sigf(v,2)});
  polyline(ctx,bL,z,I1,0,st.Lcell,0,ymax,COL.pump,2.0);
  polyline(ctx,bL,z,I2,0,st.Lcell,0,ymax,COL.stokes,2.0);
  /* the undepleted-pump comparison, Boyd (9.3.25) */
  const zU=[],iU=[];
  for(let i=0;i<160;i++){ const f=i/159, zz=f*st.Lcell;
    zU.push(zz); iU.push(st.seed*st.Ip*Math.exp(S.gKin*st.Ip*(st.Lcell-zz))); }
  polyline(ctx,bL,zU,iU,0,st.Lcell,0,ymax,COL.ref,1.3,[5,4]);
  legendAt(ctx,bL,[
    {col:COL.pump,lw:1.8,lab:'pump I₁ (→)'},
    {col:COL.stokes,lw:1.8,lab:'Stokes I₂ (←)'},
    {col:COL.ref,lw:1.4,dash:[5,4],lab:'undepleted, Boyd (9.3.25)'}]);

  /* ---- right: reflectivity against pump intensity -------------------
     The x-range spans the THRESHOLD as well as the current setting.  Keying
     it to st.Ip alone put the turn-on off-scale whenever the user sat far
     below threshold — which, for a gas, is most of the time. */
  const Ith0=25/(M.gUse*st.Lcell);
  const xLo=Math.min(st.Ip*0.02,Ith0*0.04);
  const xHi=Math.max(st.Ip*8,Ith0*4);
  const nR=54, xr=[], yr=[];
  for(let i=0;i<nR;i++){
    const f=i/(nR-1), Ip=Math.exp(lerp(Math.log(xLo),Math.log(xHi),f));
    xr.push(Ip); yr.push(100*amplifierR(M.gUse,Ip,st.Lcell,st.seed));
  }
  axes(ctx,bR,Math.log10(xr[0]),Math.log10(xr[nR-1]),0,100,{
    xticks:logTicks(xr[0],xr[nR-1]).map(Math.log10),
    xlab:'pump intensity  (GW/cm²)',ylab:'Stokes reflectivity  (%)',
    title:'threshold: reflectivity turns on when G ≈ 25–30',
    xfmt:v=>sigf(Math.pow(10,v),2),yfmt:v=>fmt(v,0)});
  polyline(ctx,bR,xr.map(Math.log10),yr,Math.log10(xr[0]),Math.log10(xr[nR-1]),
           0,100,COL.sound,2.0);
  /* the G = 25 landmark and the live point */
  const Ith=25/(M.gUse*st.Lcell);
  if(Ith>xr[0]&&Ith<xr[nR-1]){
    const X=bR.x+bR.w*(Math.log10(Ith)-Math.log10(xr[0]))
             /(Math.log10(xr[nR-1])-Math.log10(xr[0]));
    ctx.save(); ctx.strokeStyle=rgba(COL.ref,0.7); ctx.lineWidth=1.2;
    ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(X,bR.y); ctx.lineTo(X,bR.y1);
    ctx.stroke(); ctx.restore();
    ctx.fillStyle=COL.ref; ctx.font='10.5px -apple-system, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain('G = 25 at '+sigf(Ith,3)+' GW/cm²'),X+4,bR.y+6);
  }
  const XL=bR.x+bR.w*(Math.log10(st.Ip)-Math.log10(xr[0]))
           /(Math.log10(xr[nR-1])-Math.log10(xr[0]));
  const YL=bR.y1-bR.h*(100*A.R)/100;
  if(XL>=bR.x&&XL<=bR.x1){
    ctx.fillStyle=COL.stokes; ctx.beginPath(); ctx.arc(XL,clamp(YL,bR.y,bR.y1),4,0,TAU);
    ctx.fill();
  }

  /* ---- the honest warnings ------------------------------------------ */
  const warn=[];
  warn.push('G = g·I_p·L = '+fmt(A.G,2)+',  reflectivity '+fmt(100*A.R,2)
    +'%,  pump depleted by '+fmt(100*A.depletion,1)+'%.');
  if(M.nTau<10) warn.push('⚠ STEADY STATE IS NOT VALID HERE: the pulse is '
    +fmt(M.nTau,1)+' phonon lifetimes long. Below ~10 τ_B the real gain is '
    +'smaller than this — transient SBS is not modelled.');
  else warn.push('The pulse is '+sigf(M.nTau,3)+' phonon lifetimes long, so steady '
    +'state is a fair approximation.');
  warn.push('The seed is a SLIDER and breakdown is not modelled. Threshold needs '
    +'I_p·L ≈ 25/g = '+sigf(25/M.gUse,3)+' GW·cm/cm² here.');
  scaleNote(ctx,14,capY(H,0,NCAP),plain(warn[0]),RO_X-30);
  scaleNote(ctx,14,capY(H,1,NCAP),plain(warn[1]),RO_X-30);
  scaleNote(ctx,14,capY(H,2,NCAP),plain(warn[2]),RO_X-30);
  return 2;
}

/* ================================================================== *
 *  VIEW: the regimes                                                  *
 * ================================================================== */
function drawRegimes(ctx,W,H,M,S_){
  const S=M.S, st=M.st, NCAP=3, RO_X=readoutX(W);
  const yBot=plotBottom(H,NCAP);
  const cw=(RO_X-YGUT-14-YGUT)/2;
  const bL=box(YGUT,54,cw,yBot-54);
  const bR=box(YGUT+cw+YGUT,54,cw,yBot-54);

  /* ---- left: collisionality against pressure, every gas ------------- */
  const xlo=0.013, xhi=15, LX=Math.log10(xlo), HX=Math.log10(xhi);
  let ylo=-2.1, yhi=1.6;
  axes(ctx,bL,LX,HX,ylo,yhi,{
    xticks:logTicks(xlo,xhi).map(Math.log10),
    yticks:[-2,-1,0,1].map(v=>v),
    xlab:'pressure  (atm)',ylab:'collisionality  y = 1/(qℓ)',
    title:'where each gas sits between free streaming and sound',
    xfmt:v=>{ const q=Math.pow(10,v); return q>=1?fmt(q,0):fmt(q,2); },
    yfmt:v=>sigf(Math.pow(10,v),2)});
  const labels=[];
  GAS_LIST.forEach((g,i)=>{
    const rng=pressureRange(g), xs=[], ys=[];
    for(let k=0;k<50;k++){
      const f=k/49;
      const P=Math.exp(lerp(Math.log(rng[0]),Math.log(rng[1]),f));
      const s=sbsState(g,P,st.T,st.lam,{Zrot:st.Zrot});
      xs.push(Math.log10(P)); ys.push(Math.log10(s.y));
    }
    const on=(g===st.gas);
    polyline(ctx,bL,xs,ys,LX,HX,ylo,yhi,on?COL.sound:rgba(COL.dim,0.42),on?2.2:1.1);
    const X=bL.x+bL.w*(xs[xs.length-1]-LX)/(HX-LX);
    const Y=bL.y1-bL.h*(ys[ys.length-1]-ylo)/(yhi-ylo);
    if(Y>bL.y&&Y<bL.y1) labels.push({g,on,X,Y});
  });
  /* End-of-curve labels COLLIDE where the curves converge — Ar, N2 and O2 all
     landed on the same pixel.  Sort by y and push each at least 11 px clear of
     the one above it, then draw a short leader so a nudged label still points
     at its own curve. */
  labels.sort((a,b2)=>a.Y-b2.Y);
  for(let i=1;i<labels.length;i++)
    if(labels[i].Y-labels[i-1].Y<11) labels[i].Y=labels[i-1].Y+11;
  labels.forEach(L=>{
    ctx.fillStyle=L.on?COL.sound:'#8a93a6';
    ctx.font=(L.on?'bold ':'')+'10px -apple-system, sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(plain(GAS_LABEL[L.g]),L.X-6,L.Y);
  });
  /* y = 1: the crossover */
  const Y1=bL.y1-bL.h*(0-ylo)/(yhi-ylo);
  ctx.save(); ctx.strokeStyle=rgba(COL.ref,0.8); ctx.lineWidth=1.4; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(bL.x,Y1); ctx.lineTo(bL.x1,Y1); ctx.stroke(); ctx.restore();
  ctx.fillStyle=COL.ref; ctx.font='10.5px -apple-system, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain('y = 1: one collision per acoustic wavelength'),bL.x+6,Y1-3);
  ctx.textBaseline='top';
  ctx.fillStyle='#6f7789';
  ctx.fillText(plain('above: sound  ·  below: free streaming'),bL.x+6,Y1+4);
  /* the measured window */
  const tab=CFTAB[st.gas];
  if(tab){
    const p0=tab.p_atm[0], p1=tab.p_atm[tab.p_atm.length-1];
    const X0=bL.x+bL.w*(Math.log10(p0)-LX)/(HX-LX);
    const X1=bL.x+bL.w*(Math.log10(p1)-LX)/(HX-LX);
    ctx.save(); ctx.fillStyle=rgba(COL.stokes,0.10);
    ctx.fillRect(X0,bL.y,X1-X0,bL.h); ctx.restore();
    ctx.fillStyle=rgba(COL.stokes,0.85); ctx.font='10px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(plain('the measured window'),(X0+X1)/2,bL.y+4);
  }
  /* the live point */
  const XM=bL.x+bL.w*(Math.log10(S.Pclamped)-LX)/(HX-LX);
  const YM=bL.y1-bL.h*(Math.log10(S.y)-ylo)/(yhi-ylo);
  if(YM>bL.y&&YM<bL.y1){
    ctx.fillStyle=COL.stokes; ctx.beginPath(); ctx.arc(XM,YM,4.2,0,TAU); ctx.fill();
  }

  /* ---- right: the two lengths that decide everything ---------------- */
  const rng=pressureRange(st.gas);
  const xs2=[],ysL=[],ysM=[];
  for(let k=0;k<120;k++){
    const f=k/119;
    const P=Math.exp(lerp(Math.log(rng[0]),Math.log(rng[1]),f));
    const s=sbsState(st.gas,P,st.T,st.lam,{Zrot:st.Zrot});
    xs2.push(Math.log10(P)); ysL.push(Math.log10(s.Lam)); ysM.push(Math.log10(s.mfp));
  }
  const allY=ysL.concat(ysM);
  const ylo2=Math.min.apply(null,allY)-0.4, yhi2=Math.max.apply(null,allY)+0.4;
  axes(ctx,bR,Math.log10(rng[0]),Math.log10(rng[1]),ylo2,yhi2,{
    xticks:logTicks(rng[0],rng[1]).map(Math.log10),
    xlab:'pressure  (atm)',ylab:'length  (m)',
    title:'the acoustic wavelength against the mean free path',
    xfmt:v=>{ const q=Math.pow(10,v); return q>=1?fmt(q,0):fmt(q,2); },
    yfmt:v=>fmtM(Math.pow(10,v),2)});
  polyline(ctx,bR,xs2,ysL,Math.log10(rng[0]),Math.log10(rng[1]),ylo2,yhi2,COL.sound,2.0);
  polyline(ctx,bR,xs2,ysM,Math.log10(rng[0]),Math.log10(rng[1]),ylo2,yhi2,COL.pump,2.0);
  legendAt(ctx,bR,[
    {col:COL.sound,lw:2,lab:'acoustic wavelength Λ = λ/2n'},
    {col:COL.pump,lw:2,lab:'mean free path ℓ = ηv₀/P'}]);
  scaleNote(ctx,14,capY(H,0,NCAP),plain(
    'y = P/(η q v₀) is EXACTLY the inverse Knudsen number 1/(qℓ) — asserted to '
    +'2e-16. Where the blue curve is above the green one, there is no phonon.'),
    RO_X-30);
  scaleNote(ctx,14,capY(H,1,NCAP),plain(
    'Λ is nearly pressure-independent (only the refractive index moves it), so '
    +'the whole story is the mean free path falling as 1/P.'),RO_X-30);
  scaleNote(ctx,14,capY(H,2,NCAP),plain(
    'Every published measurement in this project — Kr, N₂, Ar at 1–6 atm — sits '
    +'in the shaded window, i.e. in the crossover, not in either clean limit.'),RO_X-30);
  return 2;
}

/* ================================================================== *
 *  dispatch                                                           *
 * ================================================================== */
function drawView(ctx,W,H,M,S_){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.st.view;
  if(v==='cell')          return drawCell(ctx,W,H,M,S_);
  else if(v==='phonon')   return drawPhonon(ctx,W,H,M,S_);
  else if(v==='scan')     return drawScan(ctx,W,H,M,S_);
  else if(v==='spectrum') return drawSpectrum(ctx,W,H,M,S_);
  else if(v==='amp')      return drawAmp(ctx,W,H,M,S_);
  else if(v==='pulse')    return drawPulse(ctx,W,H,M,S_);
  else if(v==='regimes')  return drawRegimes(ctx,W,H,M,S_);
  return drawScan(ctx,W,H,M,S_);
}

/* ================================================================== *
 *  the scene                                                          *
 * ================================================================== */
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  /* dist 10.2, not 13.5: at 13.5 the cell filled barely a third of the stage
     and the top half was empty.  Target lifted slightly so the object sits
     just below centre, clear of the floating readout. */
  const cam=makeCamera(-0.86,0.36,10.2,[0,0,0.25]);
  let M=null, t=0;
  const S={
    st,cam,
    time(){ return t; },
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    fit(){ cam.target=[0,0,0.25]; cam.dist=10.2; },
    resetView(){ cam.theta=-0.86; cam.phi=0.36; S.fit(); },
    lookAxial(){ cam.theta=Math.PI; cam.phi=0.02; S.fit(); },
    pointer(kind,d){
      if(kind!=='move') return;
      cam.theta-=d.dx*0.006;
      cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),4,60); },
    step(dt){
      if(!st.anim&&!st.spin) return;
      t+=dt*st.speed;
      if(st.spin) cam.theta+=dt*st.speed*0.14;
      /* the pulse view animates by scrubbing its own time slider, so the
         solve stays deterministic and the headless capture is reproducible */
      if(st.anim&&st.view==='pulse'){
        st.pulseT+=dt*st.speed*0.16;
        if(st.pulseT>1) st.pulseT-=1;
      }
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{width:cam.W,height:cam.H};
      const Wd=r.width||cam.W, Hd=r.height||cam.H;
      cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
const TABS=[['cell','the cell'],['phonon','the phonon'],['scan','the scan'],
            ['spectrum','the spectrum'],['amp','the amplifier'],
            ['pulse','the pulse'],['regimes','the regimes']];
/* Named, not literal: a UI harness that hard-codes tab indices breaks the
   moment a view is inserted ahead of the one it meant. (sims Known-bad.)
   'the pulse' was inserted at index 5, which is exactly that situation. */
const TAB_CELL=0, TAB_PHONON=1, TAB_SCAN=2, TAB_SPECTRUM=3, TAB_AMP=4,
      TAB_PULSE=5, TAB_REGIMES=6;

function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  /* pressure runs on a LOG slider: the interesting structure is decades wide */
  function logSlider(key,lab,lo,hi,fmtf){
    const inp=h('input',{type:'range',min:0,max:1000,step:1,
                         value:Math.round(1000*(Math.log(st[key])-Math.log(lo))
                                          /(Math.log(hi)-Math.log(lo)))});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=Math.round(1000*(Math.log(st[key])-Math.log(lo))
                                          /(Math.log(hi)-Math.log(lo)));
                     val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{
      const f=parseFloat(inp.value)/1000;
      st[key]=Math.exp(lerp(Math.log(lo),Math.log(hi),f));
      val.textContent=fmtf(st[key]); S.rebuild(); syncPanel(); refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        S.rebuild(); syncPanel(); refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }

  const GASCHIPS=GAS_LIST.map(g=>({id:g,name:GAS_LABEL[g]||g}));

  const gGas=h('div',{class:'grp'},h('h3',null,'the gas'));
  gGas.appendChild(chipRow(GASCHIPS,'gas',o=>{
    const r=pressureRange(o.id); st.P=clamp(st.P,r[0],r[1]);
    st.Zrot=GASTAB[o.id].Zrot; }));
  gGas.appendChild(logSlider('P','pressure',0.0132,15,v=>fmt(v,v<1?3:2)+' atm'));
  gGas.appendChild(slider('T','temperature',180,600,1,v=>fmt(v,0)+' K'));
  const gasTag=h('div',{class:'tag'}); gGas.appendChild(gasTag);

  const gPump=h('div',{class:'grp'},h('h3',null,'the pump'));
  gPump.appendChild(chipRow(PUMPS,'pump',o=>{ st.lam=o.lam; }));
  gPump.appendChild(slider('lam','wavelength',200,1100,0.1,v=>fmt(v,1)+' nm'));
  const pumpTag=h('div',{class:'src'}); gPump.appendChild(pumpTag);

  const gScan=h('div',{class:'grp'},h('h3',null,'the scan'));
  gScan.appendChild(chipRow(SCAN_QTY,'scanQty'));
  const gScanChecks=h('div',{class:'checks'},
    checkbox('showData','measured points'),
    checkbox('showBridge','the crossover bridge'),
    checkbox('showAvb','the exact Averbakh solve'),
    checkbox('showNS','the Navier–Stokes law'),
    /* literal U+2019: h() appends a plain string as a TEXT node, so an HTML
       entity here would render as the seven characters '&rsquo;'. */
    checkbox('showBoyd','Boyd’s gain formula'));
  gScan.appendChild(gScanChecks);
  const scanTag=h('div',{class:'tag'}); gScan.appendChild(scanTag);

  const gAmp=h('div',{class:'grp'},h('h3',null,'the amplifier'));
  gAmp.appendChild(logSlider('Ip','pump intensity',1e-3,50,v=>sigf(v,3)+' GW/cm²'));
  gAmp.appendChild(slider('Lcell','cell length',1,200,1,v=>fmt(v,0)+' cm'));
  gAmp.appendChild(logSlider('seed','Stokes seed',1e-16,1e-3,v=>sigf(v,2)));
  gAmp.appendChild(logSlider('pulse','pulse length',0.05,1e4,v=>sigf(v,3)+' ns'));
  const ampTag=h('div',{class:'tag'}); gAmp.appendChild(ampTag);

  const gPulse=h('div',{class:'grp'},h('h3',null,'the compressor'));
  gPulse.appendChild(slider('pumpNs','pump length',1,60,0.5,v=>fmt(v,1)+' ns'));
  gPulse.appendChild(slider('seedNs','seed length',0.2,30,0.1,v=>fmt(v,1)+' ns'));
  gPulse.appendChild(slider('seedDelay','seed delay',-10,30,0.5,v=>fmt(v,1)+' ns'));
  gPulse.appendChild(slider('pulseT','time',0,1,0.005,v=>fmt(100*v,0)+'%'));
  /* 400, not 1200: the work budget in solvePulse caps the usable grid at
     sqrt(BUDGET/thMax) anyway, so a higher slider would just report a
     derating on every move. */
  gPulse.appendChild(slider('pulseNz','grid',80,400,20,v=>fmt(v,0)+' cells'));
  const pulseTag=h('div',{class:'tag'}); gPulse.appendChild(pulseTag);

  const gKinet=h('div',{class:'grp'},h('h3',null,'the kinetic kernel'));
  gKinet.appendChild(slider('beta','β',0,0.02,0.0005,v=>fmt(v,4)));
  const kinTag=h('div',{class:'tag'}); gKinet.appendChild(kinTag);

  const gMol=h('div',{class:'grp'},h('h3',null,'the molecular channel'));
  gMol.appendChild(slider('Zrot','Z_rot',0,15,0.1,v=>fmt(v,1)));
  const molTag=h('div',{class:'tag'}); gMol.appendChild(molTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'the cell'));
  const schecks=h('div',{class:'checks'},
    checkbox('showGrating','the acoustic grating'),
    checkbox('showBeams','the beams'),
    checkbox('showCallout','the magnified callout'),
    checkbox('anim','animate'),
    checkbox('spin','auto-orbit'));
  gShow.appendChild(schecks);
  gShow.appendChild(slider('speed','speed',0.2,4,0.1,v=>fmt(v,1)+'×'));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.lookAxial(); dirty=true; refresh(); }},'look down the axis'),
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view')));
  gShow.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuild(); S.resetView();
                              syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gGas,gPump,gScan,gAmp,gPulse,gKinet,gMol,gShow,gInfo]
    .forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    [[gGas,GASCHIPS,'gas'],[gPump,PUMPS,'pump'],[gScan,SCAN_QTY,'scanQty']]
      .forEach(([g,list,key])=>{
        const cw=g.querySelector('.chips'); if(!cw) return;
        [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      });
  }
  function syncPanel(){
    const v=st.view;
    gScan.hidden = (v!=='scan'&&v!=='spectrum');
    gAmp.hidden  = (v!=='amp'&&v!=='pulse');
    gPulse.hidden= (v!=='pulse');
    gKinet.hidden= (v!=='scan'&&v!=='spectrum');
    gShow.hidden = (v!=='cell'&&v!=='phonon');
    gMol.hidden  = (GASTAB[st.gas].nRot===0);
    rows.speed.row.hidden = !(st.anim||st.spin);
    for(const k in rows) rows[k].sync();
    [].forEach.call(gScanChecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showData','showBridge','showAvb','showNS','showBoyd'][i]]; });
    [].forEach.call(schecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showGrating','showBeams','showCallout','anim','spin'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model(), Sx=M.S;
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = (st.view==='cell')
        ? 'drag to orbit · scroll to zoom · a looks down the axis · r resets · space animates'
        : st.view==='phonon' ? 'the ring-down is what a phonon lifetime actually looks like'
        : st.view==='scan' ? 'switch the quantity, or take all four at once'
        : st.view==='amp' ? 'push the pump intensity until the reflectivity turns on'
        : st.view==='pulse' ? 'scrub the time slider, or hit space to run the collision'
        : st.view==='regimes' ? 'the dashed line is where sound starts to exist'
        : 'the three curves are three different theories of the same lineshape';
      subEl.innerHTML = 'y = <b>'+fmt(Sx.y,2)+'</b> &mdash; '
        +(Sx.y<0.5?'free streaming, not sound'
          :Sx.y>2?'a real longitudinal phonon'
          :'the crossover, where every measurement in this project sits');
      gasTag.innerHTML='&Lambda; = <b>'+fmt(Sx.Lam*1e9,2)+'</b> nm &nbsp; &ell; = <b>'
        +fmtM(Sx.mfp,2)+'</b><br>&nu;<sub>B</sub> = <b>'+fmt(Sx.nuB/1e9,3)
        +'</b> GHz &nbsp; &tau;<sub>B</sub> = <b>'+fmtS(Sx.tauKin,3)+'</b>'
        +(st.T!==T_TAB?'<br><span class="r">T &ne; 298 K: gas data extrapolated</span>':'');
      const pk=PUMPS.filter(p=>Math.abs(p.lam-st.lam)<0.05)[0];
      pumpTag.innerHTML=(pk?pk.note:'y &prop; &lambda;, so the pump wavelength is a '
        +'real lever on the regime')
        +'<br>q = '+sigf(Sx.q,4)+' m<sup>&minus;1</sup>, n = '+fmt(Sx.n,6);
      scanTag.innerHTML='sweeping '+fmt(M.rng[0],3)+'&ndash;'+fmt(M.rng[1],1)
        +' atm &nbsp; y: <b>'+sigf(M.yLo,2)+'</b> &rarr; <b>'+sigf(M.yHi,2)+'</b>';
      ampTag.innerHTML='G = <b>'+fmt(M.amp.G,2)+'</b> &nbsp; R = <b>'
        +fmt(100*M.amp.R,2)+'%</b><br>pulse = <b'+(M.nTau<10?' class="r"':'')+'>'
        +sigf(M.nTau,3)+'</b> &tau;<sub>B</sub>'
        +(M.nTau<10?' &mdash; steady state invalid':'');
      molTag.innerHTML=GASTAB[st.gas].nRot===0
        ? 'monatomic: &eta;<sub>b</sub> &equiv; 0 structurally'
        : '&eta;<sub>b</sub>/&eta; = <b>'+fmt(Sx.etab,3)+'</b> &nbsp; &Cscr; = <b>'
          +fmt(Sx.Cq,3)+'</b><br>literature N₂ &asymp; 0.7&ndash;0.8 at Z<sub>rot</sub> = 5';
      if(st.view==='pulse'){
        const p=M.pulse;
        pulseTag.innerHTML='G = <b>'+fmt(p.G,2)+'</b> &nbsp; &tau;<sub>B</sub>/transit = <b>'
          +sigf(p.T,3)+'</b><br>'+fmt(p.mIn.fwhm,2)+' ns &rarr; <b'
          +(p.compression>1.05?' class="g"':'')+'>'+fmt(p.mOut.fwhm,2)+'</b> ns ('
          +fmt(p.compression,2)+'&times;)<br>peak &times;<b>'+sigf(p.peakGain,3)
          +'</b> &nbsp; extraction <b>'+fmt(100*p.efficiency,1)+'%</b>'
          +'<br>photon residual <b'+(p.converged?'':' class="r"')+'>'
          +sigf(p.resid*100,2)+'%</b>'+(p.converged?'':' &mdash; raise the grid');
      }
      kinTag.innerHTML='Averbakh: &nu;<sub>B</sub> = <b>'+fmt(M.avb.nuB/1e9,3)
        +'</b> GHz, &Delta;&nu; = <b>'+fmt(M.avb.fwhm/1e9,3)+'</b> GHz'
        +'<br>&beta; = 0 is conventional BGK; the published velocity-dependent '
        +'papers use 0.005'+(st.beta>0.01?'<br><span class="r">&beta; &gt; 0.01: '
        +'the kernel is heading for its spurious resonance</span>':'');
      infoEl.innerHTML=INFO[st.view]||INFO.cell;
      S.draw();
    }catch(e){ fail(e); }
  }

  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key==='a'){ S.lookAxial(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    const animating=(st.anim||st.spin)
      &&(st.view==='cell'||st.view==='phonon'||st.view==='pulse');
    if(animating||dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}
