<title>SBS phase space — the three axes of the acoustic gas law</title>
<!--
  sbs_axes_phase.html — the three SBS observables (peak gain G, shift S,
  width W) as a state curve in phase space, and the three relaxation axes
  as its deformation fields.

  WHAT IS EXACT: every curve is the conserving three-axis collision
  operator (papers/math_derivations/three_axis.py — ES stress freedom,
  nu-weighted speed law, conserving internal exchange) solved in Python at
  MATCHED MEASURED VISCOSITY and embedded here as tables
  (papers/math_derivations/make_phase_tables.py, checks T1-T10 ALL PASS;
  17-point log grid in shear yhat = P/(eta q v0), 4 strengths per axis,
  zrot = 5 fixed).  Sliders interpolate the tables LINEARLY in the axis
  strength; combined settings use first-order superposition of the three
  single-axis responses (dln add) — the exact all-on curves for the two
  presets are also embedded, and the readout prints the superposition gap
  (the cross-terms), so the approximation is measured on screen, not
  assumed.  The Kr points are Mironov's 266-nm data made dimensionless
  with the Eq.-27 prefactor (verify_sumrules.py rows) — measured, with
  the width channel's purity question stated where they are drawn.

  WHAT IS MODELLED: the closed-form (Pade) family overlays are the
  ALT_MAIN_v2 formulas; gamma = 5/3 monatomic except where the axis-3
  slider adds rotational capacity.  NOT MODELLED: vibration (frozen at
  GHz), real-gas kappa_T, beyond-conserving (atom-atom) broadening — the
  last is exactly what the residual view shows the data demanding.

  Physics/data: three_axis.ThreeAxis + verify_sumrules.py (Mironov Kr,
  266 nm); companion documents sumrules.tex, EOS.tex, axes_phase.png.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);

}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *

const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}

const SQ=Math.sqrt(Math.PI/(2*Math.E));          // 0.7601734505  kinetic peak
const DXKIN=1.13320;                             // kinetic lobe FWHM
const PHI0=Math.SQRT2*SQ*DXKIN;                  // 1.2182  the kinetic corner
const GAM=5/3;

/* strength grids: value 0 means "ideal" for every axis */
const SGRID={ax1:[0].concat(TAB.s1), ax2:[0].concat(TAB.s2), ax3:[0].concat(TAB.s3)};
function axisCurve(ax,k){          // k=0 -> ideal, k>=1 -> TAB[ax][k-1]
  return k===0 ? TAB.ideal : TAB[ax][k-1];
}
/* (G,S,W) of ONE axis at strength v, grid column j — linear in strength */
function singleAxis(ax,v,j){
  const g=SGRID[ax];
  let k=0; while(k<g.length-2 && v>g[k+1]) k++;
  const t=clamp((v-g[k])/((g[k+1]-g[k])||1),0,1);
  const A=axisCurve(ax,k)[j], B=axisCurve(ax,k+1)[j];
  return [lerp(A[0],B[0],t), lerp(A[1],B[1],t), lerp(A[2],B[2],t)];
}
/* log-response of one axis at strength v, column j */
function dlnAxis(ax,v,j){
  const c=singleAxis(ax,v,j), i=TAB.ideal[j];
  return [Math.log(c[0]/i[0]), Math.log(c[1]/i[1]), Math.log(c[2]/i[2])];
}
/* combined observables at column j: ideal x exp(sum of single-axis dln).
   First order in the axis strengths; the exact all-on combos for the two
   presets are TAB.kr / TAB.n2 and the gap is printed in the readout. */
function combined(st,j){
  const i=TAB.ideal[j];
  const d1=dlnAxis('ax1',st.s1,j), d2=dlnAxis('ax2',st.p,j), d3=dlnAxis('ax3',st.dl,j);
  return [i[0]*Math.exp(d1[0]+d2[0]+d3[0]),
          i[1]*Math.exp(d1[1]+d2[1]+d3[1]),
          i[2]*Math.exp(d1[2]+d2[2]+d3[2])];
}
function exactCombo(st){           // exact table if the state IS a preset
  const eq=(a,b)=>Math.abs(a-b)<1e-9;
  if(eq(st.s1,0.5)&&eq(st.p,0.26)&&eq(st.dl,0))   return TAB.kr;
  if(eq(st.s1,0.5)&&eq(st.p,0.26)&&eq(st.dl,2/3)) return TAB.n2;
  if(eq(st.s1,0)&&eq(st.p,0)&&eq(st.dl,0))        return TAB.ideal;
  return null;
}
/* value at the marker yhat (log-linear between grid columns) */
function atY(rowFn,yh){
  const Y=TAB.yh;
  let j=0; while(j<Y.length-2 && yh>Y[j+1]) j++;
  const t=clamp((Math.log(yh)-Math.log(Y[j]))/(Math.log(Y[j+1])-Math.log(Y[j])),0,1);
  const A=rowFn(j), B=rowFn(j+1);
  return [lerp(A[0],B[0],t), lerp(A[1],B[1],t), lerp(A[2],B[2],t)];
}

/* closed-form (Pade) family of ALT_MAIN_v2 — the analytic reference */
function cfS(y,G){ return Math.sqrt((1+G*y*y)/(2*(1+y*y))); }
function cfW(y){ return DXKIN/Math.sqrt(1+y*y); }
function cfG(y){ return SQ*Math.sqrt(1+y*y); }

  preset:'kr',

  showData:true, showParts:true, showCF:false, showIdeal:true,
  anim:false, spin:false, speed:1,

  {id:'ideal', name:'ideal (single τ)', s1:0, p:0, dl:0},
  {id:'kr',    name:'Kr-like',          s1:0.5, p:0.26, dl:0},
  {id:'n2',    name:'N2-like',          s1:0.5, p:0.26, dl:2/3},
];

function buildModel(st){
  const n=TAB.yh.length;
  const cur=[], d1=[], d2=[], d3=[];
  for(let j=0;j<n;j++){
    cur.push(combined(st,j));
    d1.push(dlnAxis('ax1',st.s1,j));
    d2.push(dlnAxis('ax2',st.p,j));
    d3.push(dlnAxis('ax3',st.dl,j));
  }
  const exact=exactCombo(st);
  let gap=0;
  if(exact) for(let j=0;j<n;j++)
    for(let k=0;k<3;k++)
      gap=Math.max(gap,Math.abs(Math.log(exact[j][k]/cur[j][k])));
  const mk=atY(j=>cur[j],st.yh), mi=atY(j=>TAB.ideal[j],st.yh);
  const J=[atY(j=>d1[j],st.yh), atY(j=>d2[j],st.yh), atY(j=>d3[j],st.yh)];
  const detJ=J[0][0]*(J[1][1]*J[2][2]-J[1][2]*J[2][1])
            -J[0][1]*(J[1][0]*J[2][2]-J[1][2]*J[2][0])
            +J[0][2]*(J[1][0]*J[2][1]-J[1][1]*J[2][0]);
  return {st,n,cur,d1,d2,d3,exact,gap,mk,mi,J,detJ,
          Pr:1/(1+st.s1),
          phi:mk[0]*mk[2]/mk[1], phiI:mi[0]*mi[2]/mi[1],
          gamEq:st.dl>0?(1+2/(3*(1+st.dl))):5/3};
}

function readoutHTML(M){
  const st=M.st, r=[];
  const row=(a,b,cls)=>'<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>';

  r.push('<div class="rname">SBS phase space<small>the three observables on one state curve '
        +'&mdash; conserving operator, matched viscosity</small></div>');
  r.push('<table>');
  r.push(hd('at the marker &nbsp; ŷ = '+fmt(st.yh,2)));
  r.push(row('peak gain G','<b>'+fmt(M.mk[0],3)+'</b> &nbsp;(ideal '+fmt(M.mi[0],3)+')'));
  r.push(row('shift S','<b>'+fmt(M.mk[1],4)+'</b> &nbsp;(ideal '+fmt(M.mi[1],4)+')'));
  r.push(row('width W','<b>'+fmt(M.mk[2],4)+'</b> &nbsp;(ideal '+fmt(M.mi[2],4)+')'));
  r.push(row('product Φ = G·W/S',fmt(M.phi,4)+' &nbsp;(ideal '+fmt(M.phiI,4)+')'));
  r.push(hd('the axes (response at the marker)'));
  const nm=['axis 1 · Pr = '+fmt(M.Pr,3),'axis 2 · p = '+fmt(st.p,3),
            'axis 3 · δ = '+fmt(st.dl,3)];
  for(let k=0;k<3;k++){
    const d=M.J[k];
    r.push(row(nm[k],(100*d[0]).toFixed(1)+', '+(100*d[1]).toFixed(1)+', '
      +(100*d[2]).toFixed(1)+'% <span style="color:#6f7789">(G,S,W)</span>'));
  }
  r.push(row('det J (independence)',

                         :'<span class="bad">'+M.detJ.toExponential(1)+'</span>'));
  r.push(hd('honesty'));

  if(M.exact) r.push(row('superposition gap','max '+(100*M.gap).toFixed(2)+'%'));
  r.push(row('corners Φ(0), 1/Γ',fmt(PHI0,4)+', '+fmt(1/M.gamEq,4)));
  r.push('</table>');
  r.push('<div class="note">Curves are the exact conserving three-axis operator, '
    +'precomputed in Python at matched measured viscosity and interpolated in the '
    +'axis strength. Off the presets the combined curve adds the three single-axis '
    +'responses (first order); on a preset the exact all-on curve is drawn and the '

    +'dimensionless via the Eq.-27 prefactor. Their widths carry the unresolved '

  if(v==='collapse') return '<span class="lhs">δln O<sub>k</sub></span> per axis — '
    +'silent at ŷ→0, <span class="hl">polarised</span> by the hydro end'
    +'<span class="sm">the Doppler profile is axis-blind (the universal corner); each axis&rsquo;s '
    +'response concentrates into its own observable as collisions take over</span>';
  if(v==='resid') return '<span class="lhs">(δlnW, δlnG)</span> vs the single-τ ideal — '
    +'<span class="hl2">the data sit off every axis ray</span>'
    +'<span class="sm">axis 1 moves along the product diagonal, axis 2 barely reaches off the '
    +'origin — the measured drift is the width-purity / atom&ndash;atom question</span>';
  if(v==='predict') return '<span class="lhs">[(Δx/w)²−1](Γ−2s²)</span> = <span class="hl">(2Δx/C)²(2s²−1)</span>'
    +'<span class="sm">the universal equation: eliminate ŷ and every gas, pressure and pump lies on one surface — the material content is (Γ, C), the state is gone</span>';
  return '<span class="lhs">J<sub>kj</sub> = ∂ln O<sub>j</sub>/∂ε<sub>k</sub></span>, '
    +'<span class="hl">det J ≠ 0</span>'
    +'<span class="sm">three observables measure three axes because the response matrix is '
    +'invertible — the phase-space statement of the whole programme</span>';
}

function tagHTML(M){
  const names={space:'the phase space',spine:'the spine',shift:'the shift',
               collapse:'the collapse',resid:'the residuals',matrix:'the matrix',predict:'the prediction'};
  return '<b>'+names[M.st.view]+'</b> — Pr '+fmt(M.Pr,2)+' · p '+fmt(M.st.p,2)
    +' · δ '+fmt(M.st.dl,2)+(M.exact?' (exact)':' (superposed)');
}

/* ================================================================== *
 *  drawing helpers                                                    *
 *                                                                     *
 *  Text is wrapped on a MEASURED width, never on a character count —   *
 *  a character budget overran the panel edge in wind_tunnel.html and   *
 *  is on this project's Known-bad list.                                *
 * ================================================================== */
/* Canvas text is not HTML: fillText draws "&rsquo;" as seven characters on the
   screen.  The readout and the info panel ARE HTML and use entities correctly,
   and prose gets copied between the two, so rather than trusting nobody ever
   pastes the wrong way, caption() decodes the handful this file uses. */
const ENTS={'&rsquo;':'\u2019','&lsquo;':'\u2018','&mdash;':'\u2014','&ndash;':'\u2013',
            '&times;':'\u00d7','&deg;':'\u00b0','&nbsp;':' ','&minus;':'\u2212',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'\u2026'};
function plain(s){ return String(s).replace(/&[a-z]+;/g,m=>ENTS[m]!==undefined?ENTS[m]:m); }
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  const xt=o.xticks||ticksFor(xlo,xhi,6), yt=o.yticks||ticksFor(ylo,yhi,5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.xlab,b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(o.ylab,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(o.title,b.x,b.y-6); }
  ctx.restore();
}
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  let started=false;
  const n=Math.min(xs.length,ys.length);
  for(let i=0;i<n;i++){
    const X=b.x+b.w*(xs[i]-xlo)/(xhi-xlo||1);
    const Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo||1);
    if(!isFinite(X)||!isFinite(Y)) { started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }

/* ================================================================== *
 *  view A — the phase space (3-D):  x = ln W,  y = S,  z = ln G       *
 * ================================================================== */
const CUBE={
  wLo:Math.log(0.11), wHi:Math.log(1.30),
  sLo:0.68,           sHi:0.96,
  gLo:Math.log(0.65), gHi:Math.log(22.0),
};
function toCube(o){          // (G,S,W) -> cube [-1,1]^3, z-up
  return [ 2*(Math.log(o[2])-CUBE.wLo)/(CUBE.wHi-CUBE.wLo)-1,
           2*(o[1]-CUBE.sLo)/(CUBE.sHi-CUBE.sLo)-1,
           2*(Math.log(o[0])-CUBE.gLo)/(CUBE.gHi-CUBE.gLo)-1 ];
}
function strokePath3(ctx,cam,B,pts,col,lw,dash){
  ctx.save(); ctx.beginPath();
  let started=false;
  for(const p of pts){
    const q=project(cam,B,p);
    if(!q){ started=false; continue; }
    if(!started){ ctx.moveTo(q.x,q.y); started=true; } else ctx.lineTo(q.x,q.y);
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}
function drawSpace(ctx,W,H,M,S){
  const st=M.st, cam=S.cam, B=camBasis(cam);
  // cube edges, back faces first (painter by eye-distance of edge midpoint)
  const C=[-1,1], edges=[];
  for(const a of C)for(const b of C){
    edges.push([[a,b,-1],[a,b,1]]); edges.push([[a,-1,b],[a,1,b]]); edges.push([[-1,a,b],[1,a,b]]);
  }
  edges.sort((e,f)=>{
    const me=v3.mul(v3.add(e[0],e[1]),0.5), mf=v3.mul(v3.add(f[0],f[1]),0.5);
    return v3.len(v3.sub(mf,B.eye))-v3.len(v3.sub(me,B.eye));
  });
  for(const e of edges) strokePath3(ctx,cam,B,e,'#1c2130',1);
  // floor grid (z = -1)
  for(let i=1;i<4;i++){
    const t=-1+i*0.5;
    strokePath3(ctx,cam,B,[[t,-1,-1],[t,1,-1]],'#141926',1);
    strokePath3(ctx,cam,B,[[-1,t,-1],[1,t,-1]],'#141926',1);
  }
  // axis ticks + labels (real units; G and W are logarithmic)
  ctx.font='10px -apple-system, sans-serif'; ctx.fillStyle='#6f7789';
  ctx.textAlign='center'; ctx.textBaseline='top';
  const tick=(p3,txt)=>{ const q=project(cam,B,p3); if(q) ctx.fillText(txt,q.x,q.y+4); };
  for(const wv of [0.2,0.5,1.0]){
    const x=2*(Math.log(wv)-CUBE.wLo)/(CUBE.wHi-CUBE.wLo)-1;
    strokePath3(ctx,cam,B,[[x,-1,-1],[x,-1.06,-1]],'#39404f',1);
    tick([x,-1.14,-1],fmt(wv,1));
  }
  for(const sv of [0.7,0.8,0.9]){
    const y=2*(sv-CUBE.sLo)/(CUBE.sHi-CUBE.sLo)-1;
    strokePath3(ctx,cam,B,[[1,y,-1],[1.06,y,-1]],'#39404f',1);
    tick([1.16,y,-1],fmt(sv,1));
  }
  for(const gv of [1,3,10]){
    const z=2*(Math.log(gv)-CUBE.gLo)/(CUBE.gHi-CUBE.gLo)-1;
    strokePath3(ctx,cam,B,[[-1,-1,z],[-1.05,-1.05,z]],'#39404f',1);
    tick([-1.12,-1.12,z],fmt(gv,0));
  }
  const lab=(p3,txt,col)=>{ const q=project(cam,B,p3);
    if(q){ ctx.fillStyle=col||'#8b93a6'; ctx.font='italic 12px Georgia, serif';
           ctx.fillText(txt,q.x,q.y); } };
  lab([0,-1.32,-1],'width W (log)'); lab([1.42,0,-1],'shift S');
  lab([-1.25,-1.25,0.2],'gain G (log)');
  // curves: ideal spine, single-axis parts, combined; then data, then marker
  const path=arr=>arr.map(toCube);
  if(st.showIdeal) strokePath3(ctx,cam,B,path(TAB.ideal),'#8b93a6',2.6);
  if(st.showParts){
    const parts=[['ax1',st.s1,'#5ac8e0'],['ax2',st.p,'#e8843a'],['ax3',st.dl,'#cd35c4']];
    for(const [ax,v,col] of parts){
      if(v<=1e-9) continue;
      const c=[]; for(let j=0;j<M.n;j++) c.push(singleAxis(ax,v,j));
      strokePath3(ctx,cam,B,path(c),col,1.3,[5,4]);
    }
  }
  strokePath3(ctx,cam,B,path(M.cur),'#b8ec4c',2.2);
  if(M.exact&&M.gap>1e-4) strokePath3(ctx,cam,B,path(M.exact),'#e6f7c2',1.0,[2,4]);
  if(st.showData){
    for(const d of KRDATA){
      const q=project(cam,B,toCube([d.G,d.S,d.W]));
      if(!q) continue;
      ctx.fillStyle='#f2f4f8'; ctx.beginPath(); ctx.arc(q.x,q.y,3.6,0,TAU); ctx.fill();
      ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#aeb6c6'; ctx.font='10px -apple-system,sans-serif';
      ctx.textAlign='left'; ctx.fillText(d.P+' atm',q.x+6,q.y-4);
    }
  }
  const mq=project(cam,B,toCube(M.mk));
  if(mq){ ctx.fillStyle='#cd35c4'; ctx.beginPath(); ctx.arc(mq.x,mq.y,4.5,0,TAU); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke(); }
  caption(ctx,14,H-58,'G and W axes are logarithmic; S is linear. The gray spine is the '
    +'ideal single-τ gas from ŷ = 0.15 (bottom right) to 8 (top left); green is the '
    +'current operator; dashes are the single-axis parts.',W*0.55,'#767e92');
}

/* ================================================================== *
 *  view B — the spine (the W–G face, log–log)                         *
 * ================================================================== */
function drawSpine(ctx,W,H,M,S){
  const st=M.st;
  const b=box(70,46,W-100,H-120);
  const xlo=CUBE.wLo, xhi=CUBE.wHi, ylo=CUBE.gLo, yhi=CUBE.gHi;
  axes(ctx,b,xlo,xhi,ylo,yhi,{
    title:'the W–G face — axis 1 slides along G·W = const',
    xlab:'reduced width  W = Δx  (log axis)', ylab:'reduced peak gain  G  (log axis)',
    xticks:[0.15,0.3,0.6,1.2].map(Math.log), xfmt:t=>fmt(Math.exp(t),2),
    yticks:[1,2,5,10,20].map(Math.log), yfmt:t=>fmt(Math.exp(t),0)});
  for(const lev of [0.4,0.861,2.0]){
    // straight in ln-ln: lnG = ln(lev) - lnW, clamped to the plot box
    const x0=Math.max(xlo,Math.log(lev)-yhi), x1=Math.min(xhi,Math.log(lev)-ylo);
    if(x0<x1) polyline(ctx,b,[x0,x1],[Math.log(lev)-x0,Math.log(lev)-x1],
                       xlo,xhi,ylo,yhi,'#1e2534',1,[3,4]);
  }
  const put=(arr,col,lw,dash)=>polyline(ctx,b,arr.map(o=>Math.log(o[2])),
    arr.map(o=>Math.log(o[0])),xlo,xhi,ylo,yhi,col,lw,dash);
  if(st.showIdeal) put(TAB.ideal,'#8b93a6',2.6);
  if(st.showParts){
    if(st.s1>1e-9){ const c=[]; for(let j=0;j<M.n;j++) c.push(singleAxis('ax1',st.s1,j)); put(c,'#5ac8e0',1.2,[5,4]); }
    if(st.p >1e-9){ const c=[]; for(let j=0;j<M.n;j++) c.push(singleAxis('ax2',st.p ,j)); put(c,'#e8843a',1.2,[5,4]); }
    if(st.dl>1e-9){ const c=[]; for(let j=0;j<M.n;j++) c.push(singleAxis('ax3',st.dl,j)); put(c,'#cd35c4',1.2,[5,4]); }
  }
  put(M.cur,'#b8ec4c',2.2);
  if(st.showCF){
    const cf=[]; for(const y of TAB.yh) cf.push([cfG(y),0,cfW(y)]);
    put(cf,'#e8843a',1.4,[7,4]);
  }
  if(st.showData) for(const d of KRDATA){
    const X=b.x+b.w*(Math.log(d.W)-xlo)/(xhi-xlo), Y=b.y1-b.h*(Math.log(d.G)-ylo)/(yhi-ylo);
    ctx.fillStyle='#f2f4f8'; ctx.beginPath(); ctx.arc(X,Y,3.4,0,TAU); ctx.fill();
  }
  const mk=M.mk, mx=b.x+b.w*(Math.log(mk[2])-xlo)/(xhi-xlo),
        my=b.y1-b.h*(Math.log(mk[0])-ylo)/(yhi-ylo);
  ctx.fillStyle='#cd35c4'; ctx.beginPath(); ctx.arc(mx,my,4.5,0,TAU); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.1; ctx.stroke();
  caption(ctx,b.x+8,b.y+8,'dotted diagonals: G·W = const (the product law). '
    +'Kinetic corner bottom right, hydrodynamic top left.',b.w*0.5,'#6f7789');
}

/* ================================================================== *
 *  view C — the shift channel                                         *
 * ================================================================== */
const LY=TAB!==null?TAB.yh.map(Math.log):[];
function drawShift(ctx,W,H,M,S){
  const st=M.st;
  const b=box(70,46,W-100,H-120);
  const xlo=LY[0], xhi=LY[LY.length-1], ylo=0.69, yhi=0.955;
  axes(ctx,b,xlo,xhi,ylo,yhi,{
    title:'the shift channel — axis 3 owns the hydrodynamic end',
    xlab:'shear collisionality  ŷ  (log axis)', ylab:'reduced shift  S = x_peak',
    xticks:[0.15,0.3,0.6,1.2,2.5,5,8].map(Math.log), xfmt:t=>fmt(Math.exp(t),2)});
  for(const [v,lab] of [[Math.sqrt(5/6),'√(5/6) monatomic'],[Math.sqrt(0.7),'√0.7 diatomic eq.'],
                        [Math.SQRT1_2,'1/√2 Doppler']]){
    if(v<ylo||v>yhi) continue;
    polyline(ctx,b,[xlo,xhi],[v,v],xlo,xhi,ylo,yhi,'#242b3c',1,[3,4]);
    ctx.fillStyle='#6f7789'; ctx.font='10px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText(plain(lab),b.x+6,
      b.y1-b.h*(v-ylo)/(yhi-ylo)-2);
  }
  const put=(arr,col,lw,dash)=>polyline(ctx,b,LY,arr.map(o=>o[1]),xlo,xhi,ylo,yhi,col,lw,dash);
  if(st.showIdeal) put(TAB.ideal,'#8b93a6',2.6);
  if(st.showParts){
    if(st.s1>1e-9){ const c=[]; for(let j=0;j<M.n;j++) c.push(singleAxis('ax1',st.s1,j)); put(c,'#5ac8e0',1.2,[5,4]); }
    if(st.p >1e-9){ const c=[]; for(let j=0;j<M.n;j++) c.push(singleAxis('ax2',st.p ,j)); put(c,'#e8843a',1.2,[5,4]); }
    if(st.dl>1e-9){ const c=[]; for(let j=0;j<M.n;j++) c.push(singleAxis('ax3',st.dl,j)); put(c,'#cd35c4',1.2,[5,4]); }
  }
  put(M.cur,'#b8ec4c',2.2);
  if(st.showCF){
    const cf=TAB.yh.map(y=>[0,cfS(y,GAM),0]); put(cf,'#e8843a',1.4,[7,4]);
  }
  if(st.showData) for(const d of KRDATA){
    const X=b.x+b.w*(Math.log(d.yh)-xlo)/(xhi-xlo), Y=b.y1-b.h*(d.S-ylo)/(yhi-ylo);
    ctx.fillStyle='#f2f4f8'; ctx.beginPath(); ctx.arc(X,Y,3.4,0,TAU); ctx.fill();
  }
  const mx=b.x+b.w*(Math.log(st.yh)-xlo)/(xhi-xlo),
        my=b.y1-b.h*(M.mk[1]-ylo)/(yhi-ylo);
  ctx.fillStyle='#cd35c4'; ctx.beginPath(); ctx.arc(mx,my,4.5,0,TAU); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.1; ctx.stroke();
}

/* ================================================================== *
 *  view D — the collapse: |dln O| per axis and channel                *
 * ================================================================== */
function drawCollapse(ctx,W,H,M,S){
  const b=box(70,46,W-100,H-132);
  let top=2;
  for(const d of [M.d1,M.d2,M.d3]) for(const r of d) for(const v of r)
    top=Math.max(top,100*Math.abs(v)+2);
  const xlo=LY[0], xhi=LY[LY.length-1];
  axes(ctx,b,xlo,xhi,0,top,{
    title:'the collapse — silent at the kinetic corner, polarised by the hydro end',
    xlab:'shear collisionality  ŷ  (log axis)', ylab:'|response|  |δln O|  [%]',
    xticks:[0.15,0.3,0.6,1.2,2.5,5,8].map(Math.log), xfmt:t=>fmt(Math.exp(t),2)});
  const CH=[[0,null],[1,[2,3]],[2,[6,4]]];           // G solid, S dot, W dash
  const AXC=[['d1','#5ac8e0'],['d2','#e8843a'],['d3','#cd35c4']];
  for(const [dk,col] of AXC){
    for(const [ch,dash] of CH){
      polyline(ctx,b,LY,M[dk].map(r=>100*Math.abs(r[ch])),xlo,xhi,0,top,col,1.5,dash);
    }
  }
  const mx=b.x+b.w*(Math.log(M.st.yh)-xlo)/(xhi-xlo);
  polyline(ctx,b,[Math.log(M.st.yh),Math.log(M.st.yh)],[0,top],xlo,xhi,0,top,'#39404f',1,[2,4]);
  caption(ctx,b.x+8,b.y+8,'line style is the channel — solid G, dotted S, dashed W; '
    +'colour is the axis — cyan 1 (Pr), orange 2 (p), magenta 3 (δ). Every curve → 0 at '
    +'the Doppler corner.',b.w*0.55,'#6f7789');
  void mx;
}

/* ================================================================== *
 *  view E — the residual plane (Kr data vs single-τ ideal)            *
 * ================================================================== */
function residRays(M){
  // axis-1 and axis-2 reach at the data rows' yhat, from the tables
  const r1=[],r2=[];
  for(const d of KRDATA){
    const a1=atY(j=>dlnAxis('ax1',0.5,j),d.yh);
    const a2=atY(j=>dlnAxis('ax2',0.26,j),d.yh);
    r1.push([100*a1[2],100*a1[0]]);       // (dlnW, dlnG) %
    r2.push([100*a2[2],100*a2[0]]);
  }
  return {r1,r2};
}
function drawResid(ctx,W,H,M,S){
  const b=box(76,46,Math.max(560,W-380),H-126);   // clear of the readout
  const xlo=-14, xhi=36, ylo=-30, yhi=18;
  axes(ctx,b,xlo,xhi,ylo,yhi,{
    title:'krypton in the residual plane — the axes cannot reach the data',
    xlab:'width residual  δlnW vs single-τ ideal  [%]',
    ylab:'gain residual  δlnG  [%]'});
  polyline(ctx,b,[xlo,xhi],[0,0],xlo,xhi,ylo,yhi,'#242b3c',1);
  polyline(ctx,b,[0,0],[ylo,yhi],xlo,xhi,ylo,yhi,'#242b3c',1);
  polyline(ctx,b,[0,28],[0,-28],xlo,xhi,ylo,yhi,'#39404f',1,[3,4]); // product diagonal
  const R=residRays(M);
  polyline(ctx,b,R.r1.map(p=>p[0]),R.r1.map(p=>p[1]),xlo,xhi,ylo,yhi,'#5ac8e0',1.8);
  polyline(ctx,b,R.r2.map(p=>p[0]),R.r2.map(p=>p[1]),xlo,xhi,ylo,yhi,'#e8843a',3.2);
  const px=[],py=[];
  for(const d of KRDATA){ px.push(100*d.dlnW); py.push(100*d.dlnG); }
  polyline(ctx,b,px,py,xlo,xhi,ylo,yhi,'#6b7284',1);
  for(let i=0;i<KRDATA.length;i++){
    const X=b.x+b.w*(px[i]-xlo)/(xhi-xlo), Y=b.y1-b.h*(py[i]-ylo)/(yhi-ylo);
    ctx.fillStyle='#f2f4f8'; ctx.beginPath(); ctx.arc(X,Y,3.8,0,TAU); ctx.fill();
    ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#aeb6c6'; ctx.font='10px -apple-system,sans-serif';
    ctx.textAlign='left';
    ctx.fillText(KRDATA[i].P+' atm',X+6,Y+(KRDATA[i].P>=5?12:-6));
  }
  ctx.fillStyle='#5ac8e0'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.fillText('axis-1 reach (Pr→2/3)',b.x+b.w*0.52,b.y1-b.h*0.22);
  ctx.fillStyle='#e8843a';
  ctx.fillText('axis-2 reach (p→0.26): barely off the origin',b.x+b.w*0.30,b.y1-b.h*0.55);
  caption(ctx,b.x+8,b.y+8,'the measured drift is off every ray the conserving axes can '
    +'draw — the width-purity / atom–atom question of sumrules.tex.',b.w*0.5,'#6f7789');
}

/* ================================================================== *
 *  view F — the response matrix                                       *
 * ================================================================== */
function drawMatrix(ctx,W,H,M,S){
  const bl=box(76,70,Math.min(360,W*0.38),Math.min(300,H-190));
  const cw=bl.w/3, ch=bl.h/3;
  const NM=['axis 1 (Pr)','axis 2 (p)','axis 3 (δ)'], CH=['G','S','W'];
  ctx.font='italic 13px Georgia, serif'; ctx.fillStyle='#aeb6c6';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('J = ∂ln(G,S,W) per axis at ŷ = '+fmt(M.st.yh,2),bl.x,bl.y-26);
  let vmax=0.02;
  for(const r of M.J) for(const v of r) vmax=Math.max(vmax,Math.abs(v));
  for(let k=0;k<3;k++) for(let c=0;c<3;c++){
    const v=M.J[k][c];
    const X=bl.x+c*cw, Y=bl.y+k*ch;
    ctx.fillStyle=v>=0?rgba('#b8ec4c',0.12+0.55*Math.abs(v)/vmax)
                      :rgba('#e8843a',0.12+0.55*Math.abs(v)/vmax);
    ctx.fillRect(X+2,Y+2,cw-4,ch-4);
    ctx.strokeStyle='#2a2f3d'; ctx.strokeRect(X+2.5,Y+2.5,cw-5,ch-5);
    ctx.fillStyle='#e9ecf3'; ctx.font='12px "SF Mono", Menlo, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText((100*v).toFixed(1)+'%',X+cw/2,Y+ch/2);
  }
  ctx.font='10.5px -apple-system,sans-serif'; ctx.fillStyle='#8b93a6';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let c=0;c<3;c++) ctx.fillText(CH[c],bl.x+c*cw+cw/2,bl.y1+6);
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let k=0;k<3;k++) ctx.fillText(NM[k],bl.x-8,bl.y+k*ch+ch/2);
  // right: |det J| across yhat
  const br=box(bl.x1+90,70,Math.max(360,W-bl.x1-380),Math.min(300,H-190));
  const dets=[];
  for(let j=0;j<M.n;j++){
    const J=[M.d1[j],M.d2[j],M.d3[j]];
    dets.push(Math.abs(
      J[0][0]*(J[1][1]*J[2][2]-J[1][2]*J[2][1])
     -J[0][1]*(J[1][0]*J[2][2]-J[1][2]*J[2][0])
     +J[0][2]*(J[1][0]*J[2][1]-J[1][1]*J[2][0]))*1e6);
  }
  const detsFull=[];
  for(let j=0;j<M.n;j++){
    const F=[dlnAxis('ax1',0.5,j),dlnAxis('ax2',0.26,j),dlnAxis('ax3',2/3,j)];
    detsFull.push(Math.abs(
      F[0][0]*(F[1][1]*F[2][2]-F[1][2]*F[2][1])
     -F[0][1]*(F[1][0]*F[2][2]-F[1][2]*F[2][0])
     +F[0][2]*(F[1][0]*F[2][1]-F[1][1]*F[2][0]))*1e6);
  }
  const top=Math.max(2,...dets,...detsFull)*1.15;
  axes(ctx,br,LY[0],LY[LY.length-1],0,top,{
    title:'|det J| × 10⁶ — the independence of the axes',
    xlab:'ŷ (log axis)',
    xticks:[0.15,0.5,1.5,4,8].map(Math.log), xfmt:t=>fmt(Math.exp(t),2)});
  polyline(ctx,br,LY,detsFull,LY[0],LY[LY.length-1],0,top,'#39404f',1.4,[5,4]);
  polyline(ctx,br,LY,dets,LY[0],LY[LY.length-1],0,top,'#b8ec4c',2);
  ctx.fillStyle='#6f7789'; ctx.font='10px -apple-system,sans-serif';
  ctx.textAlign='left';
  ctx.fillText('dashed: all axes at full strength (reference)',br.x+8,br.y1-10);
  caption(ctx,br.x+8,br.y+8,'nonzero everywhere the axes are on: three observables '
    +'measure three axes. It vanishes when any slider is at zero (green = the '
    +'current sliders).',br.w*0.55,'#6f7789');
  caption(ctx,bl.x,bl.y1+34,'green = positive response, orange = negative; each row is '
    +'one axis at its current slider strength.',bl.w+40,'#767e92');
}

/* ================================================================== *
 *  dispatch + scene                                                   *
 * ================================================================== */
function drawView(ctx,W,H,M,S){
  ctx.clearRect(0,0,W,H);
  const v=M.st.view;
  if(v==='space') drawSpace(ctx,W,H,M,S);
  else if(v==='spine') drawSpine(ctx,W,H,M,S);
  else if(v==='shift') drawShift(ctx,W,H,M,S);
  else if(v==='collapse') drawCollapse(ctx,W,H,M,S);
  else if(v==='resid') drawResid(ctx,W,H,M,S);
  else if(v==='predict') drawPredict(ctx,W,H,M,S);
  else drawMatrix(ctx,W,H,M,S);
}
function makeScene(canvas){
  const st=Object.assign({},DEFAULTS);
  const cam=makeCamera(-0.95,0.40,5.4,[0,0,0]);
  let M=null;
  const S={
    st,cam,
    model(){ if(!M) S.rebuild(); return M; },
    rebuild(){ M=buildModel(st); },
    fit(){ cam.target=[0,0,0]; cam.dist=5.4; },
    resetView(){ cam.theta=-0.95; cam.phi=0.40; S.fit(); },
    pointer(kind,d){
      if(kind!=='move'||st.view!=='space') return;
      cam.theta-=d.dx*0.006;
      cam.phi=clamp(cam.phi+d.dy*0.006,-1.45,1.45);
    },
    wheel(dy){ if(st.view==='space') cam.dist=clamp(cam.dist*Math.exp(dy*0.0012),2.2,18); },
    step(dt){
      if(st.anim){
        const lo=Math.log(TAB.yh[0]), hi=Math.log(TAB.yh[TAB.yh.length-1]);
        let t=(Math.log(st.yh)-lo)/(hi-lo); t+=dt*st.speed*0.12;
        if(t>1) t-=1;
        st.yh=Math.exp(lo+t*(hi-lo)); S.rebuild();
      }
      if(st.spin&&st.view==='space') cam.theta+=dt*st.speed*0.16;
    },
    draw(){
      const ctx=canvas.getContext('2d');
      const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{width:cam.W,height:cam.H};
      const Wd=r.width||cam.W, Hd=r.height||cam.H;
      cam.W=Wd; cam.H=Hd;
      if(!M) S.rebuild();
      drawView(ctx,Wd,Hd,M,S);
    },
    readout(){ return readoutHTML(S.model()); },
    eqbar(){ return eqbarHTML(S.model()); },
    tag(){ return tagHTML(S.model()); },
  };
  return S;
}

/* ================================================================== *
 *  view G — the prediction: the universal equation, worked live       *
 *  (closed_system.tex: three tiers, one state variable)              *
 * ================================================================== */
function sOfU(u,G){ return Math.sqrt((G-(G-1)*u)/2); }
function wOfU(u,C){ const r=(2*DXKIN/C)*(2*DXKIN/C)*(1-u)/u;
  return DXKIN/Math.sqrt(1+r); }
function phiOfTab(yh){                    // Pr=2/3 member of the tables
  const Y=TAB.yh, A=TAB.ax1[TAB.ax1.length-1];
  let j=0; while(j<Y.length-2 && yh>Y[j+1]) j++;
  const t=clamp((Math.log(yh)-Math.log(Y[j]))/(Math.log(Y[j+1])-Math.log(Y[j])),0,1);
  const p=(r)=>r[0]*r[2]/r[1];
  return lerp(p(A[j]),p(A[j+1]),t);
}
const NUREF_KR=1.8273, PK_KR=2.870, KPREF_KR=0.0662;   // Kr 266 nm consts

function drawPredict(ctx,W,H,M,S){
  const st=M.st;
  const G=M.gamEq, Pr=M.Pr, C=4/3+(G-1)/Pr;
  const yh=st.yh, u=1/(1+yh*yh);
  const s=sOfU(u,G), w=wOfU(u,C), phi=phiOfTab(yh), g=phi*s/w;
  // ---- left: the worked example ------------------------------------
  const x0=64; let y=64;
  const line=(txt,col,fnt)=>{ ctx.fillStyle=col||'#cfd4de';
    ctx.font=fnt||'12.5px "SF Mono", Menlo, monospace';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(txt),x0,y); y+=20; };
  ctx.font='italic 15px Georgia, serif'; ctx.fillStyle='#e9e9f0';
  ctx.fillText('predicting the three observables from the universal system',x0,y-28);
  line('INPUTS (the three tier constants + the state)','#8b93a6',
       'italic 12.5px Georgia, serif');
  line('  Gamma = '+fmt(G,4)+'   (thermodynamic: axis-3 slider, counted modes)');
  line('  C     = '+fmt(C,4)+'   = 4/3 + (Gamma-1)/Pr,  Pr = '+fmt(Pr,3));
  line('  Phi(ŷ) = '+fmt(phi,4)+'  (conservation partition, Pr=2/3 tables)');
  line('  ŷ = '+fmt(yh,3)+'  ->  u = 1/(1+ŷ²) = '+fmt(u,4),'#b8ec4c');
  y+=6;
  line('STEP 1 · thermodynamic tier','#5ac8e0','italic 12.5px Georgia, serif');
  line('  2s² = Γ − (Γ−1)u   ->  s = '+fmt(s,4));
  y+=6;
  line('STEP 2 · kinetic tier','#5ac8e0','italic 12.5px Georgia, serif');
  line('  (Δx/w)² = 1 + (2Δx/C)²(1−u)/u   ->  w = '+fmt(w,4));
  y+=6;
  line('STEP 3 · conservation tier','#5ac8e0','italic 12.5px Georgia, serif');
  line('  g = Φ(ŷ)·s/w = '+fmt(g,4));
  y+=6;
  line('DIMENSIONAL (Kr, 266 nm: ν_ref = '+NUREF_KR+' GHz, P_K = '
       +PK_KR+' atm)','#8b93a6','italic 12.5px Georgia, serif');
  line('  P    = ŷ·P_K            = '+fmt(yh*PK_KR,2)+' atm');
  line('  ν_B  = s·ν_ref          = '+fmt(s*NUREF_KR,3)+' GHz');
  line('  Δν   = w·ν_ref          = '+fmt(w*NUREF_KR,3)+' GHz');
  line('  γ_B  ≈ '+KPREF_KR+'·ŷ·g   = '+fmt(KPREF_KR*yh*g,3)+' cm/GW');
  y+=6;
  line('vs the EXACT operator at these sliders:','#8b93a6',
       'italic 12.5px Georgia, serif');
  line('  (G, S, W)_op = ('+fmt(M.mk[0],3)+', '+fmt(M.mk[1],4)+', '
       +fmt(M.mk[2],4)+')');
  line('  closed system vs operator: ΔS '+(100*(s/M.mk[1]-1)).toFixed(1)
       +'%,  ΔW '+(100*(w/M.mk[2]-1)).toFixed(1)+'%,  ΔG '
       +(100*(g/M.mk[0]-1)).toFixed(1)+'%','#e8843a');
  // ---- right: the universal-equation curve in the (w, s) plane -----
  const b=box(660,56,Math.max(300,W-660-330),H-176);
  axes(ctx,b,0,1.25,0.68,0.96,{
    title:'the universal equation: all (w, s) the law allows',
    xlab:'reduced width  w', ylab:'reduced shift  s'});
  const us=[],ws=[],ss=[];
  for(let i=0;i<=120;i++){ const uu=Math.pow(10,-3+3*i/120);
    if(uu>1) continue; us.push(uu); ws.push(wOfU(uu,C)); ss.push(sOfU(uu,G)); }
  polyline(ctx,b,ws,ss,0,1.25,0.68,0.96,'#b8ec4c',2.2);
  const wsE=us.map(uu=>wOfU(uu,2*DXKIN)), ssE=us.map(uu=>sOfU(uu,G));
  polyline(ctx,b,wsE,ssE,0,1.25,0.68,0.96,'#e8843a',1.3,[6,4]);
  for(const [uu,tag] of [[0.9,'u=0.9'],[0.5,'0.5'],[0.2,'0.2'],[0.05,'0.05']]){
    const X=b.x+b.w*(wOfU(uu,C)-0)/1.25, Y=b.y1-b.h*(sOfU(uu,G)-0.68)/0.28;
    ctx.fillStyle='#39404f'; ctx.beginPath(); ctx.arc(X,Y,2.6,0,TAU); ctx.fill();
    ctx.fillStyle='#6f7789'; ctx.font='9.5px -apple-system,sans-serif';
    ctx.textAlign='left'; ctx.fillText(tag,X+5,Y+3);
  }
  if(st.showData) for(const d of KRDATA){
    const X=b.x+b.w*(d.W-0)/1.25, Y=b.y1-b.h*(d.S-0.68)/0.28;
    ctx.fillStyle='#f2f4f8'; ctx.beginPath(); ctx.arc(X,Y,3.6,0,TAU); ctx.fill();
    ctx.strokeStyle='#070b18'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#aeb6c6'; ctx.font='9.5px -apple-system,sans-serif';
    ctx.fillText(d.P+' atm',X+6,Y-4);
  }
  const mx=b.x+b.w*(w-0)/1.25, my=b.y1-b.h*(s-0.68)/0.28;
  ctx.fillStyle='#cd35c4'; ctx.beginPath(); ctx.arc(mx,my,4.5,0,TAU); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.1; ctx.stroke();
  caption(ctx,b.x+8,b.y+8,'green: the current (Γ, C) member, swept by u. '
    +'Dashed orange: the C = 2Δx_kin member — the observable-EOS ellipse. '
    +'White: measured Kr. The data sit right of the C = 7/3 curve at high P '
    +'— the width anomaly (C_rec rises to 2.95).',b.w*0.55,'#6f7789');
}

/* ================================================================== *
 *  UI                                                                 *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const subEl=document.getElementById('sub');
  const S=makeScene(canvas), st=S.st;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  const TABS=[['space','the phase space'],['spine','the spine'],['shift','the shift'],
              ['collapse','the collapse'],['resid','the residuals'],['matrix','the matrix'],['predict','the prediction']];
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>{
      st.view=k; [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const row=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value); st.preset='';
      val.textContent=fmtf(st[key]); S.rebuild(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row,sync}; sync(); return row;
  }
  function checkbox(key,lab){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      S.rebuild(); syncPanel(); dirty=true; refresh(); });
    return h('label',null,inp,lab);
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        S.rebuild(); syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }

  const gPre=h('div',{class:'grp'},h('h3',null,'the gas'));
  gPre.appendChild(chipRow(PRESETS,'preset',o=>{
    st.s1=o.s1; st.p=o.p; st.dl=o.dl; }));
  const preTag=h('div',{class:'tag'}); gPre.appendChild(preTag);

  const gAx=h('div',{class:'grp'},h('h3',null,'the three axes'));
  gAx.appendChild(slider('s1','axis 1 · Pr',0,0.5,0.005,v=>'Pr '+fmt(1/(1+v),3)));
  gAx.appendChild(slider('p','axis 2 · p',0,0.26,0.005,v=>'p '+fmt(v,3)));
  gAx.appendChild(slider('dl','axis 3 · δ',0,2/3,0.005,v=>'δ '+fmt(v,3)));
  gAx.appendChild(h('div',{class:'src'},
    'axis 1 rescales the heat channel (ES); axis 2 is the ν(u) ∝ u^p speed law with the '
    +'conserving starred target; axis 3 is a conserving internal-exchange channel of capacity '
    +'(3/2)δ at Z_rot = 5. All at matched measured viscosity.'));

  const gMk=h('div',{class:'grp'},h('h3',null,'the marker'));
  gMk.appendChild(slider('yh','ŷ = P/ηqv₀',0.15,8,0.01,v=>fmt(v,2)));
  gMk.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ st.yh=1.1; S.rebuild(); syncPanel(); dirty=true; refresh(); }},'crossover'),
    h('button',{onclick:()=>{ st.yh=0.15; S.rebuild(); syncPanel(); dirty=true; refresh(); }},'kinetic'),
    h('button',{onclick:()=>{ st.yh=8; S.rebuild(); syncPanel(); dirty=true; refresh(); }},'hydro')));

  const gDisp=h('div',{class:'grp'},h('h3',null,'display'));
  const dchecks=h('div',{class:'checks'},
    checkbox('showIdeal','the ideal spine'),
    checkbox('showParts','single-axis parts'),
    checkbox('showData','the Kr data'),
    checkbox('showCF','closed-form (Padé) overlay'),
    checkbox('anim','animate ŷ'),
    checkbox('spin','auto-orbit (3-D)'));
  gDisp.appendChild(dchecks);
  gDisp.appendChild(slider('speed','speed',0.2,4,0.1,v=>fmt(v,1)+'×'));
  gDisp.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ S.resetView(); dirty=true; refresh(); }},'reset view'),
    h('button',{onclick:()=>{ Object.assign(st,DEFAULTS); S.rebuild(); S.resetView();
                              syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}));
  [gPre,gAx,gMk,gDisp,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    const cw=gPre.querySelector('.chips'); if(!cw) return;
    const cur=PRESETS.findIndex(o=>Math.abs(st.s1-o.s1)<1e-9&&Math.abs(st.p-o.p)<1e-9
      &&Math.abs(st.dl-o.dl)<1e-9);
    st.preset=cur>=0?PRESETS[cur].id:'';
    [].forEach.call(cw.children,(b,i)=>b.className='chip'+(PRESETS[i].id===st.preset?' on':''));
  }
  function syncPanel(){
    rows.speed.row.hidden=!(st.anim||st.spin);
    for(const k in rows) rows[k].sync();
    [].forEach.call(dchecks.querySelectorAll('input'),(inp,i)=>{
      inp.checked=st[['showIdeal','showParts','showData','showCF','anim','spin'][i]]; });
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=S.readout(); eqEl.innerHTML=S.eqbar(); tagEl.innerHTML=S.tag();
      hintEl.textContent = st.view==='space'
        ? 'drag to orbit · scroll to zoom · space animates ŷ · r resets the view'
        : 'the ŷ slider moves the magenta marker; space animates it';
      subEl.innerHTML = M.exact
        ? 'exact all-on operator curve — superposition gap max '+(100*M.gap).toFixed(2)+'%'
        : 'combined curve = first-order sum of the three single-axis responses';
      preTag.innerHTML='Pr <b>'+fmt(M.Pr,3)+'</b> · p <b>'+fmt(st.p,2)+'</b> · δ <b>'
        +fmt(st.dl,2)+'</b>'+(st.dl>0?' (γ<sub>eq</sub> = '+fmt(M.gamEq,3)+')':'');
      infoEl.innerHTML=INFO[st.view]||INFO.space;
      S.draw();
    }catch(e){ fail(e); }
  }

  /* camera moves must ask for a frame (steam_carnot Known-bad) */
  let down=false,lx=0,ly=0,dirty=false;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId);
    down=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('dragging'); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return;
    S.pointer('move',{dx:e.clientX-lx,dy:e.clientY-ly}); lx=e.clientX; ly=e.clientY;
    dirty=true; });
  const up=()=>{ down=false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.wheel(e.deltaY); dirty=true; },
    {passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ S.resetView(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<='7'){ st.view=TABS[+e.key-1][0];
      [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
      S.rebuild(); syncPanel(); dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.cam.W=r.width; S.cam.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=0, roT=0;
  function frameLoop(tm){
    const dt=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    S.step(dt);
    if(st.anim||(st.spin&&st.view==='space')||dirty){
      dirty=false;
      try{
        S.draw();
        roT+=dt;
        if(st.anim&&roT>0.2){ roT=0; roEl.innerHTML=S.readout(); tagEl.innerHTML=S.tag();
          rows.yh.sync(); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); S.fit(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
}

/* ================================================================== *
 *  self-test                                                          *
 *                                                                     *
 *  Reference values marked (make_phase_tables.py) were computed        *
 *  OUTSIDE this file by the exact three-axis operator in Python        *
 *  (checks T1-T10 there, incl. a cross-instrument pin against          *
 *  relax_lineshape.py) and pasted in at assembly.                      *
 * ================================================================== */
const REFS={"SQ":0.7601734505,"PHI0":1.2182439443,"idl0":[0.78384317,0.73749834,1.09867253],"idl8":[1.03812604,0.88721653,0.77756898],"idl16":[4.48164301,0.91303623,0.12419998],"kr10":[1.24722922,0.89189823,0.59055824],"n210":[1.30899353,0.87691651,0.56230127],"gap_kr":0.012744,"gap_n2":0.063731,"detJ":-3.64459e-05};
function selfTest(){
  let pass=0, failN=0;
  const ok=(c,n)=>{ if(c) pass++; else { failN++; console.log('FAIL — '+n); } };
  const close=(a,b,tol,n)=>ok(Math.abs(a-b)<=tol,n+' ('+a+' vs '+b+')');

  ok(TAB&&TAB.yh.length===17,'table present, 17 yhat columns');
  ok(TAB.ax1.length===4&&TAB.ax2.length===4&&TAB.ax3.length===4,'4 strengths per axis');
  let fin=true;
  const scan=c=>{ for(const r of c) for(const v of r) if(!isFinite(v)) fin=false; };
  scan(TAB.ideal); TAB.ax1.forEach(scan); TAB.ax2.forEach(scan); TAB.ax3.forEach(scan);
  scan(TAB.kr); scan(TAB.n2);
  ok(fin,'every table value finite');
  for(let k=0;k<3;k++){
    close(TAB.ideal[0][k],REFS.idl0[k],1e-6,'ideal[0]['+k+'] pin (make_phase_tables.py)');
    close(TAB.ideal[8][k],REFS.idl8[k],1e-6,'ideal[8]['+k+'] pin');
    close(TAB.ideal[16][k],REFS.idl16[k],1e-6,'ideal[16]['+k+'] pin');
    close(TAB.kr[10][k],REFS.kr10[k],1e-6,'kr combo[10] pin');
    close(TAB.n2[10][k],REFS.n210[k],1e-6,'n2 combo[10] pin');
  }
  close(SQ,0.7601734505,5e-10,'sqrt(pi/2e) (make_phase_tables.py)');
  close(PHI0,1.2182439443,5e-9,'PHI(0) = sqrt2*SQ*DXKIN = 1.2182439443');
  const p0=TAB.ideal[0][0]*TAB.ideal[0][2]/TAB.ideal[0][1];
  close(p0,1.1677,0.01,'table product at yhat=0.15 (the corner 1.21823 is the y->0 limit)');
  // interpolators
  const g5=singleAxis('ax1',TAB.s1[1],5);
  for(let k=0;k<3;k++) close(g5[k],TAB.ax1[1][5][k],1e-12,'singleAxis hits grid node');
  const mid=singleAxis('ax1',(TAB.s1[0]+TAB.s1[1])/2,5);
  ok((mid[0]-TAB.ax1[0][5][0])*(TAB.ax1[1][5][0]-mid[0])>=0,'strength interp between neighbours');
  const nodeY=atY(j=>TAB.ideal[j],TAB.yh[8]);
  for(let k=0;k<3;k++) close(nodeY[k],TAB.ideal[8][k],1e-9,'atY hits grid column');
  // combined + exact combos
  const stKr={s1:0.5,p:0.26,dl:0}, stN2={s1:0.5,p:0.26,dl:2/3};
  ok(exactCombo(stKr)===TAB.kr&&exactCombo(stN2)===TAB.n2,'preset states find exact combos');
  let gk=0;
  for(let j=0;j<17;j++) for(let k=0;k<3;k++)
    gk=Math.max(gk,Math.abs(Math.log(TAB.kr[j][k]/combined(stKr,j)[k])));
  close(gk,REFS.gap_kr,1e-4,'KR superposition gap == generator value');
  let gn=0;
  for(let j=0;j<17;j++) for(let k=0;k<3;k++)
    gn=Math.max(gn,Math.abs(Math.log(TAB.n2[j][k]/combined(stN2,j)[k])));
  close(gn,REFS.gap_n2,1e-4,'N2 superposition gap == generator value');
  // closed-form family identities (independent JS algebra)
  for(const y of [0.3,1,4]){
    const s=cfS(y,GAM), w=cfW(y);
    close(2*s*s+(GAM-1)*Math.pow(w/DXKIN,2),GAM,1e-12,'ellipse identity at y='+y);
    const us=(GAM-2*s*s)/(GAM-1), uw=Math.pow(w/DXKIN,2);
    close(us,uw,1e-12,'u_shift == u_width at y='+y);
    close(cfG(y)*w,SQ*DXKIN,1e-12,'family G·W constant at y='+y);
  }
  // absolute pins for the constants the identities cannot see
  close(cfS(1e9,GAM),0.9128709292,1e-6,
    'hydro shift corner sqrt(5/6) = 0.9128709292 (scipy) -- pins gamma');
  const ymA=Math.sqrt(TAB.yh[8]*TAB.yh[9]), ymB=Math.sqrt(TAB.yh[0]*TAB.yh[1]);
  for(let k=0;k<3;k++){
    close(atY(j=>TAB.ideal[j],ymA)[k],
      0.5*(TAB.ideal[8][k]+TAB.ideal[9][k]),1e-9,
      'atY log-midpoint blend, mid grid, ch '+k);
    close(atY(j=>TAB.ideal[j],ymB)[k],
      0.5*(TAB.ideal[0][k]+TAB.ideal[1][k]),1e-9,
      'atY log-midpoint blend, low end, ch '+k);
  }
  const Mpin=buildModel(Object.assign({},DEFAULTS,{s1:0.5,p:0,dl:2/3,yh:TAB.yh[0]}));
  close(Mpin.Pr,2/3,1e-12,'Pr map: s1=0.5 -> Pr = 2/3 exactly');
  close(Mpin.gamEq,1.4,1e-12,'gamma_eq at delta=2/3 -> 7/5 exactly');
  const Mph=buildModel(Object.assign({},DEFAULTS,{s1:0,p:0,dl:0,yh:TAB.yh[0]}));
  close(Mph.phi,TAB.ideal[0][0]*TAB.ideal[0][2]/TAB.ideal[0][1],1e-9,
    'phi = G*W/S read from the table directly');
  const Mgap=buildModel(Object.assign({},DEFAULTS,{s1:0.5,p:0.26,dl:0,yh:1.0}));
  close(Mgap.gap,REFS.gap_kr,1e-4,'model gap field == generator gap (norm kept)');

  // structure: signs and ownership
  const d1=dlnAxis('ax1',0.5,10);
  ok(d1[2]>0&&d1[0]<0,'axis 1 at yhat~2: width up, gain down (matched viscosity)');
  const d3=dlnAxis('ax3',2/3,14);
  ok(d3[1]<0,'axis 3 pulls the hydro shift down toward sqrt(0.7)');
  const d2m=Math.max(...[5,8,11,14].map(j=>{
    const d=dlnAxis('ax2',0.26,j); return Math.max(Math.abs(d[0]),Math.abs(d[1]),Math.abs(d[2]));}));
  ok(d2m<0.045,'axis 2 stays the smallest tier at matched viscosity (<4.5%)');
  // det J
  const M1=buildModel(Object.assign({},DEFAULTS,{s1:0.5,p:0.26,dl:2/3,yh:2.0}));
  close(Math.abs(M1.detJ)>0?1:0,1,0,'det J nonzero with all axes on');
  const M0=buildModel(Object.assign({},DEFAULTS,{s1:0,p:0,dl:0,yh:2.0}));
  close(M0.detJ,0,1e-12,'det J exactly zero with every axis off');
  const Mref=buildModel(Object.assign({},DEFAULTS,
    {s1:0.5,p:0.26,dl:2/3,yh:TAB.yh[10]}));
  close(Mref.detJ,REFS.detJ,1e-6,
    'det J at grid column 10, all axes on == generator value');
  // data
  ok(KRDATA.length===5,'five Kr rows');
  close(KRDATA[4].dlnW,0.2860,5e-3,'Kr 6 atm width residual (verify_sumrules D4)');
  close(KRDATA[4].dlnG,0.0999,5e-3,'Kr 6 atm gain residual');
  const R=residRays({});
  ok(R.r2.every(p=>Math.hypot(p[0],p[1])<4.5),'axis-2 reach < 4.5% everywhere (vs the 29% data drift)');
  ok(R.r1[4][0]>6&&R.r1[4][1]<-2,
    'axis-1 ray at 6 atm points down-right: (dW,dG) = ('
    +R.r1[4][0].toFixed(1)+', '+R.r1[4][1].toFixed(1)+')%');
  const Sx=makeScene({}); Sx.st.anim=true; Sx.st.speed=4; Sx.st.yh=7.9;
  for(let i=0;i<40;i++) Sx.step(0.1);
  ok(Sx.st.yh>=0.149&&Sx.st.yh<=8.001,
    'the animated marker wraps and stays on the grid (yh='+Sx.st.yh.toFixed(3)+')');
  Sx.st.yh=1.0; Sx.st.speed=1; Sx.step(0.1);
  { const lo=Math.log(0.15), hi=Math.log(8.0);
    const tExp=(Math.log(1.0)-lo)/(hi-lo)+0.1*1*0.12;
    close(Sx.st.yh,Math.exp(lo+tExp*(hi-lo)),1e-9,
      'one animation step lands exactly where the log sweep says'); }
  Sx.st.yh=7.99; Sx.st.speed=1; Sx.step(0.1);
  ok(Sx.st.yh<0.2,'crossing the top of the sweep wraps to the bottom '
    +'(yh='+Sx.st.yh.toFixed(3)+')');
  // cube mapping sane
  let inCube=true;
  for(const c of [TAB.ideal,TAB.kr,TAB.n2]) for(const o of c){
    const q=toCube(o); if(Math.max(...q.map(Math.abs))>1.05) inCube=false; }
  for(const d of KRDATA){ const q=toCube([d.G,d.S,d.W]);
    if(Math.max(...q.map(Math.abs))>1.05) inCube=false; }
  ok(inCube,'every curve and data point inside the drawn cube');
  // the universal equation (closed_system.tex)
  let devU=0, devE=0;
  for(const yh2 of [0.3,1,2.5,6]) for(const G2 of [1.4,5/3]) for(const C2 of [1.43,7/3,2*DXKIN]){
    const u2=1/(1+yh2*yh2), s2=sOfU(u2,G2), w2=wOfU(u2,C2);
    devU=Math.max(devU,Math.abs(((DXKIN/w2)**2-1)*(G2-2*s2*s2)-(2*DXKIN/C2)**2*(2*s2*s2-1)));
    const wE=wOfU(u2,2*DXKIN);
    devE=Math.max(devE,Math.abs(2*s2*s2+(G2-1)*(wE/DXKIN)**2-G2));
  }
  ok(devU<1e-12,'the UNIVERSAL EQUATION is an exact identity (closed_system)');
  ok(devE<1e-12,'it reduces to the observable-EOS ellipse at C = 2*Dxkin');
  { const yh2=1.3,G2=1.55,C2=2.1,u2=1/(1+yh2*yh2);
    const s2=sOfU(u2,G2), w2=wOfU(u2,C2);
    close((2*s2*s2*(1+yh2*yh2)-1)/(yh2*yh2),G2,1e-12,'inversion: Gamma recovered exactly');
    close(2*DXKIN*yh2/Math.sqrt((DXKIN/w2)**2-1),C2,1e-12,'inversion: C recovered exactly'); }
  { const u2=1/(1+2.076*2.076);
    close(sOfU(u2,5/3)*NUREF_KR,1.6040,2e-3,
      'Kr 6-atm shift from the universal system: 1.604 GHz (data 1.60)');
    close(wOfU(u2,7/3)*NUREF_KR,0.9200,3e-3,
      'Kr 6-atm width at C = 7/3: 0.920 GHz vs data 1.10 -- the open width anomaly'); }
  close(phiOfTab(TAB.yh[8]),TAB.ax1[3][8][0]*TAB.ax1[3][8][2]/TAB.ax1[3][8][1],1e-12,
    'phiOfTab hits the Pr=2/3 table node');
  // panels build clean for every view x preset
  for(const pre of PRESETS){
    for(const v of ['space','spine','shift','collapse','resid','matrix','predict']){
      const M=buildModel(Object.assign({},DEFAULTS,{view:v,s1:pre.s1,p:pre.p,dl:pre.dl}));
      const txt=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
      ok(txt.indexOf('NaN')<0&&txt.indexOf('undefined')<0,
        'panels clean: '+v+' / '+pre.id);
    }
  }
  for(const yh of [0.15,8]){
    const M=buildModel(Object.assign({},DEFAULTS,{yh}));
    ok(isFinite(M.phi)&&isFinite(M.detJ),'marker extremes finite at yhat='+yh);
  }
  console.log(pass+' passed, '+failN+' failed');
  if(failN>0) throw new Error(failN+' self-test failure(s)');
  return true;
}

if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
