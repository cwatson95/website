<!--
  ===================================================================
  pupil_plane_interferometry.html — active pupil-plane intensity
  interferometry: one laser, N random phases, four pupils on one camera
  ===================================================================

  The concept being visualised (projects/pupil_plane/, "Active Pupil-Plane
  Intensity Interferometry for Imaging Flying Mosquitoes", technical concept
  summary, August 2026): a single narrow-linewidth 785 nm laser is split into
  N branches with independent phase modulators and the overlapped beams
  illuminate a flight volume 20-30 m away with ENGINEERED pseudothermal light;
  four small telescopes on a rigid 0.30-0.35 m frame each relay a conjugate of
  their entrance pupil onto its own region of ONE high-speed camera, where each
  pupil is binned into M sub-apertures; every pair of segments (p,q) is a
  baseline B_pq = r_q - r_p with (u,v) = B_pq/lambda, and the normalised
  intensity correlation g2_pq - 1 = |V(u,v)|^2 measures the squared Fourier
  magnitude of the target; delta x ~ 1.22 lambda L/B sets the nominal scale
  (0.19-0.29 m for 0.1 mm at 20-30 m), SNR ~ |V|^2 sqrt(N) over N independent
  realisations, and reconstruction needs phase retrieval.

  Its four parent papers (also in projects/pupil_plane/, renamed author_year):
    matthews_2025  Matthews, Gori & Vakili, MNRAS 538, 867 — pupil-plane II on
                   an imaging air Cherenkov telescope (2P2I): 61 hexagonal
                   detector pixels over a re-imaged 12 m Davies-Cotton pupil ->
                   1830 simultaneous baselines, 1.5-11.7 m; Gam Cas's H-alpha
                   disc; eq.(4) S/N = sqrt(N1 N2) tau_o |V|^2 sqrt(T/dt) = 36.7
                   for 86.9 Mcps, 445 fs, 2 ns, 30 min (reproduced here to
                   0.01).  5.4 ns Davies-Cotton arrival spread (reproduced:
                   (f - sqrt(f^2 - rho^2))/c = 5.36 ns at rho = 6 m, f = 12 m).
    liu_2025       Liu ... Wilczek ... Pan, PRL 134, 180201 — ACTIVE II: eight
                   phase-independent 1064 nm emitters make pseudothermal light;
                   <c2> = c0 + c1 |f(k_a - k_b)|^2 with c0 = c/n, c1 = (n-1+c)/n;
                   1.36 km, baselines 0.07-0.87 m x 60 rotations = 1260 points,
                   1.22 lambda L/B = 2.03 mm against 41.5 mm for one 42.5 mm
                   telescope.
    dravins_2012   Dravins, LeBohec, Jensen & Nunez, New Astron. Rev. 56, 143 —
                   the review: Siegert g2 = 1 + |gamma12|^2 for chaotic light,
                   (S/N)_RMS = A alpha n |gamma|^2 sqrt(dF) sqrt(T/2), the (u,v)
                   rotation, QuantEYE's sliced ELT pupil (the ancestor of 2P2I),
                   Narrabri's 6.5 m mirrors and 188 m track.
    malvimat_2014  Malvimat, Wucknitz & Saha, MNRAS 437, 798 — many-detector
                   HBT: G2 = G11 G22 + |G12|^2, SNR ~ r dtau sqrt(T/dt),
                   1 + g12 + g13 + g23 + 2 g123 (bispectrum / closure phase),
                   r dtau = (A/A_airy)/(e^z - 1) = 0.05 (F/Jy)(lambda/m)(A/m^2).

  WHAT IS EXACT HERE (derived in build_pupil/derive.py, values pinned)
  --------------------------------------------------------------------
  * g2(0) = 2 - 1/N for N equal-amplitude branches with uniform random phases
    (exact by the phasor-sum moment; MC-checked).  Hold-and-jump modulation
    with ONE master clock gives a TRIANGULAR g2(tau) - 1 = (1-1/N)(1-|tau|/T_u),
    1/e width (1-1/e) T_u = 0.632 T_u; INDEPENDENT per-branch clocks give the
    squared triangle (1-|tau|/T_u)^2 with 1/e width (1-e^-1/2) T_u = 0.393 T_u,
    the number the concept document quotes.  Both MC-checked; the view shows
    which assumption gives which.
  * Receiver census: hexagonal segmentation 3r^2+3r+1 per pupil, every pair a
    baseline, B_max and delta x_nom = 1.22 lambda L/B_max, largest structure
    lambda L/B_min, speckle grain lambda L/a_fs — all closed-form.
  * Target Fourier magnitude from analytic primitives (uniform ellipse ->
    2 J1(pi rho)/(pi rho), rectangle -> sinc x sinc), checked against
    quadrature to 1e-10 and a 5 um raster to 1e-3; translation invariance of
    |O(u)|^2 exact; J1 by the spectrally exact trapezoid (1.5e-15 vs scipy)
    and the NR rational form (4.9e-9) for grids.
  * Finite sub-aperture smear: |V|^2 averaged over the disc-autocorrelation
    kernel (Gauss-Legendre 16x24 vs scipy dblquad, 3e-7).
  * Correlation SNR for Gaussian (thermal) intensity statistics:
    Var(dI1 dI2) = (1+|V|^2)(1+3|V|^2), the photon-counting generalisation
    with nbar photoelectrons and read noise sigma_r, MC-checked to ~1%; the
    document's SNR ~ |V|^2 sqrt(N) is its small-|V|^2, high-flux ceiling.
  * The HERITAGE view reproduces Matthews' 2P2I numbers, the Gam Cas uv
    rosette from the VERITAS site (alt-az rotation = parallactic angle, vector
    construction checked against the TMS (u,v,w) matrix to 1e-8), and the
    Narrabri uniform-disc 2J1(x)/x with its first zero 3.8317 lambda/(pi theta).

  WHAT IS MODELLED / CHOSEN (illustrative, labelled on canvas)
  ------------------------------------------------------------
  The mosquito brightness model (body 4 x 1.2 mm, head, proboscis, six 40 um
  legs, two averaged wings) and its co-/cross-pol amplitudes; the telescope
  aperture (50 mm, not specified in the document); the radiometric inputs
  (laser power on target, beam radius, reflective area, albedo, QE x optics,
  read noise) — every one is a slider and the readout says "assumed".  HIO
  phase retrieval is a demonstration (Fienup 1982 form), not a claim about
  what the real instrument will reconstruct.

  NOT MODELLED
  ------------
  Atmospheric scintillation and beam wander, target depth/Fresnel effects
  (|mu|^2 is independent of the quadratic near-field phase for a planar
  incoherent source), optical memory effect and emitter-statistics corrections
  (Liu SM Sec. H), camera rolling-shutter timing, polarisation physics of the
  cuticle, the photometric background.

  Scaffold: the house extracts (x_style with a wider right column and the
  equation styles, x_utils/x_fit verbatim from build_doppler, x_plot with a
  numeric-entity-aware plain() and x-AND-y data-space clipping).  Entirely 2-D.
-->

  <span class="sub" id="sub">one laser, N random phases, four pupils on one camera — the second-order coherence of the return measures the Fourier magnitude of a mosquito 25 m away</span>

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));

  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));

  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data

let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';

  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);

/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

/* ================================================================== *
 *  the physics — every function mirrors build_pupil/derive.py and is  *
 *  pinned to its printed values in selfTest.  Units: SI unless a name *
 *  says otherwise (mm for the target primitives, cycles/mm for their  *
 *  spatial frequencies, nm only in the UI).                           *
 * ================================================================== */
const PHYS={c:299792458, h:6.62607015e-34, kB:1.380649e-23};   /* SI 2019 exact */
const MAS=Math.PI/180/3600e3;                                     /* 1 mas in rad */
const J11=3.8317059702075125;        /* first zero of J1 (scipy jn_zeros(1,1)) */
const LAMBDAS=[{id:532,name:'532 nm'},{id:785,name:'785 nm'},{id:1064,name:'1064 nm'}];

/* ------------------------------------------------ 1. geometry */
function rayleighRes(lam,L,B){ return 1.22*lam*L/B; }       /* object-plane scale, m */
function baselineFor(lam,L,dx){ return 1.22*lam*L/dx; }
function speckleGrain(lam,L,a){ return lam*L/a; }           /* field correlation length at the receiver */
function uOfB(B,lam,L){ return B/(lam*L); }                 /* cycles per metre on the target */
function fresnelVariation(lam,r,a,L){ return (2*Math.PI/lam)*r*r*r*a/(2*L*L*L); }

/* ------------------------------------------------ 2. the engineered source */
function g2zero(N){ return 2-1/N; }
function contrastOf(N){ return Math.sqrt(1-1/N); }
/* g2(tau) of the hold-and-jump process.  sync=true: one master clock, all
   branches jump together -> I(t) piecewise constant -> TRIANGLE.  sync=false:
   independent per-branch clocks -> each pair needs BOTH unchanged -> squared
   triangle (the concept document's form). */
function g2tau(tau,Tu,N,sync){
  const a=Math.abs(tau)/Tu; if(a>=1) return 1;
  const p=1-a; return 1+(1-1/N)*(sync?p:p*p);
}
function tauC(Tu,sync){ return sync?(1-Math.exp(-1))*Tu:(1-Math.exp(-0.5))*Tu; }
function realisations(Tacq,Tu){ return Tacq/Tu; }
/* 31-bit LCG, identical to derive.py's (Math.imul keeps the product mod 2^32) */
function lcg32(seed){
  let x=(seed>>>0)%2147483648;
  return ()=>{ x=((Math.imul(1103515245,x)>>>0)+12345)&0x7fffffff; return x/2147483648; };
}
/* a deterministic intensity series: nInt hold intervals, sub samples each.
   Returns normalised I (mean 1), the branch phases of the last interval, and
   the raw (un-normalised) mean. */
function sourceSeries(N,nInt,sub,sync,seed){
  const rnd=lcg32(seed), n=nInt*sub;
  const I=new Float64Array(n);
  const ph=new Float64Array(N*(nInt+1));
  const off=new Int32Array(N);
  for(let k=0;k<N;k++) off[k]=sync?0:Math.floor(rnd()*sub);
  for(let i=0;i<N*(nInt+1);i++) ph[i]=TAU*rnd();
  const last=new Float64Array(N);
  for(let s=0;s<n;s++){
    let re=0,im=0;
    for(let k=0;k<N;k++){
      const j=Math.floor((s+off[k])/sub);      /* which hold interval branch k is in */
      const p=ph[k*(nInt+1)+j];
      re+=Math.cos(p); im+=Math.sin(p);
      if(s===n-1) last[k]=p;
    }
    I[s]=re*re+im*im;
  }
  let m=0; for(let s=0;s<n;s++) m+=I[s]; m/=n;
  for(let s=0;s<n;s++) I[s]/=m;
  return {I,last,rawMean:m,N,sub,nInt,ph,off};
}
/* the phase word each branch holds at sample s (for the phasor diagram) */
function phasesAt(ser,s){
  const out=[]; for(let k=0;k<ser.N;k++) out.push(ser.ph[k*(ser.nInt+1)+Math.floor((s+ser.off[k])/ser.sub)]);
  return out;
}
function g2Estimate(I,lag){
  const n=I.length-lag; let s=0,m1=0,m2=0;
  for(let i=0;i<n;i++){ s+=I[i]*I[i+lag]; m1+=I[i]; m2+=I[i+lag]; }
  return (s/n)/((m1/n)*(m2/n));
}
function intensityHist(I,nb,imax){
  const h=new Float64Array(nb); const w=imax/nb;
  for(let i=0;i<I.length;i++){ const k=Math.floor(I[i]/w); if(k>=0&&k<nb) h[k]++; }
  for(let k=0;k<nb;k++) h[k]/=I.length*w;        /* density */
  return {h,w};
}

/* ------------------------------------------------ 3. receiver geometry */
function hexCount(rings){ return 3*rings*rings+3*rings+1; }
function hexCentres(rings,pitch){
  const out=[];
  for(let q=-rings;q<=rings;q++) for(let r=-rings;r<=rings;r++)
    if(Math.abs(q+r)<=rings) out.push([pitch*(q+0.5*r),pitch*r*Math.sqrt(3)/2]);
  return out;
}
const LAYOUTS=[{id:'square',name:'four, square'},{id:'Y',name:'three + centre'},
               {id:'line',name:'four in a line'},{id:'pair',name:'one pair'}];
function telescopeCentres(layout,F){
  const R=F/2, c=[];
  const ring=(angs)=>angs.forEach(a=>c.push([R*Math.cos(a*PI/180),R*Math.sin(a*PI/180)]));
  if(layout==='square') ring([45,135,225,315]);
  else if(layout==='Y'){ ring([90,210,330]); c.push([0,0]); }
  else if(layout==='line'){ for(let i=0;i<4;i++) c.push([-R+F*i/3,0]); }
  else if(layout==='pair'){ c.push([-R,0],[R,0]); }

}
function receiverSegments(layout,F,D,rings){
  const pitch=D/(2*rings+1), tel=telescopeCentres(layout,F), hg=hexCentres(rings,pitch);
  const segs=[];
  tel.forEach((c,ti)=>hg.forEach(p=>segs.push({x:c[0]+p[0],y:c[1]+p[1],tel:ti})));
  return {segs,pitch,tel,S:segs.length,perPupil:hg.length};

/* every pair once; bx,by in metres; returns the census with min/max length */
function baselineCensus(segs){
  const S=segs.length, n=S*(S-1)/2;

  const pa=new Int32Array(n), qa=new Int32Array(n);
  let k=0, bmin=Infinity, bmax=0;
  for(let p=0;p<S;p++) for(let q=p+1;q<S;q++){
    const dx=segs[q].x-segs[p].x, dy=segs[q].y-segs[p].y;
    bx[k]=dx; by[k]=dy; len[k]=Math.hypot(dx,dy); pa[k]=p; qa[k]=q;
    if(len[k]<bmin) bmin=len[k]; if(len[k]>bmax) bmax=len[k];
    k++;

function baselineRedundancy(cen){
  const m=new Map();

    let x=Math.round(cen.bx[i]*1e9), y=Math.round(cen.by[i]*1e9);
    if(x<0||(x===0&&y<0)){ x=-x; y=-y; }
    const key=x+','+y; m.set(key,(m.get(key)||0)+1);

/* 2-D histogram of +-B over [-range,range]^2, nb x nb cells */
function uvHistogram(cen,nb,range){

/* ------------------------------------------------ 4. Bessel, Airy, sinc */
/* J1 by the trapezoid rule on (1/2pi) int_0^2pi cos(t - x sin t) dt: the
   integrand is smooth and periodic, so 256 points are spectrally exact for
   x < ~100 (1.5e-15 against scipy on [0,100], derive.py) */
function j1trap(x){
  const M=256; let s=0;
  for(let k=0;k<M;k++){ const t=TAU*k/M; s+=Math.cos(t-x*Math.sin(t)); }
  return s/M;

/* the Numerical-Recipes rational form, VERIFIED in derive.py to 4.9e-9 on

function j1fast(x){
  const ax=Math.abs(x);
  if(ax<8){
    const y=x*x;
    const a1=x*(72362614232.0+y*(-7895059235.0+y*(242396853.1+y*(-2972611.439
             +y*(15704.48260+y*(-30.16036606))))));
    const a2=144725228442.0+y*(2300535178.0+y*(18583304.74+y*(99447.43394
             +y*(376.9991397+y*1.0))));

  const z=8/ax, y=z*z, xx=ax-2.356194491;
  const a1=1.0+y*(0.183105e-2+y*(-0.3516396496e-4+y*(0.2457520174e-5+y*(-0.240337019e-6))));
  const a2=0.04687499995+y*(-0.2002690873e-3+y*(0.8449199096e-5+y*(-0.88228987e-6

/* in-place iterative radix-2 complex FFT; n a power of two */

    j^=bit;
    if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; }
  }
  for(let len=2;len<=n;len<<=1){
    const ang=(inverse?2:-2)*PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cr=1,ci=0;
      for(let k=0;k<len/2;k++){
        const a=i+k, b=a+len/2;
        const xr=re[b]*cr-im[b]*ci, xi=re[b]*ci+im[b]*cr;
        re[b]=re[a]-xr; im[b]=im[a]-xi; re[a]+=xr; im[a]+=xi;
        const t=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=t;

    fft1d(tr,ti,n,inverse);
    for(let k=0;k<n;k++){ re[r*n+k]=tr[k]; im[r*n+k]=ti[k]; }
  }
  for(let c=0;c<n;c++){
    for(let k=0;k<n;k++){ tr[k]=re[k*n+c]; ti[k]=im[k*n+c]; }
    fft1d(tr,ti,n,inverse);
    for(let k=0;k<n;k++){ re[k*n+c]=tr[k]; im[k*n+c]=ti[k]; }

      const m=Math.hypot(re[i],im[i]); err+=(m-S.mag[i])*(m-S.mag[i]); norm+=S.mag[i]*S.mag[i];

/* the truth along the row: |FT[O](u,0)|^2 / |FT[O](0,0)|^2 at u = k/field, k = 0..n-1 (FFT order) */
function repTruthRow(O,n){
  const re=new Float64Array(n), im=new Float64Array(n);
  for(let i=0;i<n;i++){ let s=0; for(let j=0;j<n;j++) s+=O[j*n+i]; const ii=(i-n/2+n)%n; re[ii]=s; }  /* ifftshift in x */
  fft1d(re,im,n,false);
  const out=new Float64Array(n), d=re[0]*re[0]+im[0]*im[0];
  for(let k=0;k<n;k++) out[k]=(re[k]*re[k]+im[k]*im[k])/(d||1);
  return out;
}
function repEmitters(N,r){ const E=[]; for(let k=0;k<N;k++){ const a=TAU*(k+0.25)/N; E.push([r*Math.cos(a),r*Math.sin(a)]); } return E; }
/* the emitters' tilt phasors on the target grid, re/im packed (N x n x n) */
function repTilts(E,n,pt,lam,L){
  const N=E.length, re=new Float64Array(N*n*n), im=new Float64Array(N*n*n);
  for(let k=0;k<N;k++) for(let j=0;j<n;j++){ const y=(j-n/2)*pt;
    for(let i=0;i<n;i++){ const x=(i-n/2)*pt, ph=-TAU*(x*E[k][0]+y*E[k][1])/(lam*L);
      re[k*n*n+j*n+i]=Math.cos(ph); im[k*n*n+j*n+i]=Math.sin(ph); } }
  return {re,im,N};
}
/* a rough-surface realisation of the target: sqrt(O) e^{i psi} */
function repRough(O,n,rnd){
  const re=new Float64Array(n*n), im=new Float64Array(n*n);
  for(let i=0;i<n*n;i++){ if(O[i]>0){ const a=Math.sqrt(O[i]), ph=TAU*rnd(); re[i]=a*Math.cos(ph); im[i]=a*Math.sin(ph); } }
  return {re,im};
}
/* the row-0 receiver field of a target field (re,im): 1-D FFT of the column sums,
   sampled at the detector indices; returns complex pairs [re_j, im_j] */
function repRowField(fre,fim,n,idx){
  const re=new Float64Array(n), im=new Float64Array(n);
  for(let i=0;i<n;i++){ let sr=0,si=0; for(let j=0;j<n;j++){ sr+=fre[j*n+i]; si+=fim[j*n+i]; }
    const ii=(i-n/2+n)%n; re[ii]=sr; im[ii]=si; }
  fft1d(re,im,n,false);
  const out=new Float64Array(2*idx.length);
  for(let q=0;q<idx.length;q++){ out[2*q]=re[idx[q]]; out[2*q+1]=im[idx[q]]; }
  return out;
}
/* branch speckle fields at the detectors for one rough realisation: a[k] = row field of rho*T_k */
function repBranchFields(rho,T,n,idx){
  const N=T.N, out=[];
  const fre=new Float64Array(n*n), fim=new Float64Array(n*n);
  for(let k=0;k<N;k++){
    for(let i=0;i<n*n;i++){ const tr=T.re[k*n*n+i], ti=T.im[k*n*n+i];
      fre[i]=rho.re[i]*tr-rho.im[i]*ti; fim[i]=rho.re[i]*ti+rho.im[i]*tr; }
    out.push(repRowField(fre,fim,n,idx));
  }
  return out;
}
/* one frame's detector intensities.  static: combine the precomputed branch
   fields with a fresh phase word; jitter: a fresh rough surface too (one FFT) */
function repFrameStatic(a,N,nd,rnd){
  const I=new Float64Array(nd), w=1/Math.sqrt(N);
  const cr=new Float64Array(N), ci=new Float64Array(N);
  for(let k=0;k<N;k++){ const ph=TAU*rnd(); cr[k]=w*Math.cos(ph); ci[k]=w*Math.sin(ph); }
  for(let q=0;q<nd;q++){ let er=0,ei=0;
    for(let k=0;k<N;k++){ const ar=a[k][2*q], ai=a[k][2*q+1]; er+=cr[k]*ar-ci[k]*ai; ei+=cr[k]*ai+ci[k]*ar; }
    I[q]=er*er+ei*ei; }
  return I;
}
function repFrameJitter(O,T,n,idx,rnd){
  const N=T.N, w=1/Math.sqrt(N), cr=new Float64Array(N), ci=new Float64Array(N);
  for(let k=0;k<N;k++){ const ph=TAU*rnd(); cr[k]=w*Math.cos(ph); ci[k]=w*Math.sin(ph); }
  const fre=new Float64Array(n*n), fim=new Float64Array(n*n);
  for(let i=0;i<n*n;i++){ if(!(O[i]>0)) continue;
    let ur=0,ui=0; for(let k=0;k<N;k++){ const tr=T.re[k*n*n+i], ti=T.im[k*n*n+i]; ur+=cr[k]*tr-ci[k]*ti; ui+=cr[k]*ti+ci[k]*tr; }
    const a=Math.sqrt(O[i]), ph=TAU*rnd(), rr=a*Math.cos(ph), ri=a*Math.sin(ph);
    fre[i]=rr*ur-ri*ui; fim[i]=rr*ui+ri*ur; }
  const F=repRowField(fre,fim,n,idx), I=new Float64Array(idx.length);
  for(let q=0;q<idx.length;q++) I[q]=F[2*q]*F[2*q]+F[2*q+1]*F[2*q+1];
  return I;
}
/* photon counting: Poisson(mu) (Knuth for small mu, normal for large) + read noise */
function poisson(mu,rnd){
  if(mu<=0) return 0;
  if(mu>40){ const u1=rnd()||1e-12, u2=rnd(); return Math.max(0,Math.round(mu+Math.sqrt(mu)*Math.sqrt(-2*Math.log(u1))*Math.cos(TAU*u2))); }
  const Lm=Math.exp(-mu); let k=0,p=1; do{ k++; p*=rnd(); }while(p>Lm); return k-1;
}
function gaussRnd(rnd){ const u1=rnd()||1e-12, u2=rnd(); return Math.sqrt(-2*Math.log(u1))*Math.cos(TAU*u2); }
/* the running estimator over pairs (p<q) of nd detectors */
function repAccInit(nd){ const np=nd*(nd-1)/2; return {nd,np,nf:0,s1:new Float64Array(nd),s2:new Float64Array(nd),spq:new Float64Array(np)}; }
function repAccAdd(A,n){
  const nd=A.nd; let k=0;
  for(let p=0;p<nd;p++){ A.s1[p]+=n[p]; A.s2[p]+=n[p]*n[p]; for(let q=p+1;q<nd;q++){ A.spq[k]+=n[p]*n[q]; k++; } }
  A.nf++;
}
function repAccEstimate(A){
  const nd=A.nd, c=new Float64Array(A.np), m=new Float64Array(nd); let k=0;
  for(let p=0;p<nd;p++) m[p]=A.s1[p]/A.nf;
  for(let p=0;p<nd;p++) for(let q=p+1;q<nd;q++){ c[k]=(A.spq[k]/A.nf-m[p]*m[q])/((m[p]*m[q])||1); k++; }
  return c;
}
/* the pair table: baseline (m) and the truth for each pair */
function repPairs(idx,truthRow,n,dxi){
  const nd=idx.length, B=[], V2=[];
  for(let p=0;p<nd;p++) for(let q=p+1;q<nd;q++){ const d=idx[q]-idx[p]; B.push(d*dxi); V2.push(truthRow[((d%n)+n)%n]); }
  return {B,V2};
}
/* the recovery slope alpha of the least-squares fit c = alpha*|V|^2 over pairs
   with |V|^2 > thresh — a far more stable statistic than a mean of ratios from a
   handful of pairs (jitter -> alpha ~ 1, frozen speckle -> alpha ~ 1-1/N with a
   large residual).  Also returns the rms residual about the fitted line. */
function repSlope(c,pairs,thresh){
  let sxy=0,sxx=0,cnt=0; for(let k=0;k<c.length;k++){ const v=pairs.V2[k]; if(v>thresh){ sxy+=c[k]*v; sxx+=v*v; cnt++; } }
  const a=sxx>0?sxy/sxx:0; let rss=0,tss=0; for(let k=0;k<c.length;k++){ const v=pairs.V2[k]; if(v>thresh){ rss+=(c[k]-a*v)*(c[k]-a*v); } }
  return {alpha:a,rms:cnt?Math.sqrt(rss/cnt):0,cnt};
}
/* ================================================================== *
 *  state, presets, model                                              *
 * ================================================================== */
const TABS=[['bench','the bench'],['source','the source'],['pupils','the pupils'],
            ['target','the target'],['signal','the signal'],['telescope','the telescope'],
            ['rep','the replication']];
const REPMODES=[{id:'jitter',name:'jittering target'},{id:'static',name:'static target'}];
const REPPH=[{id:0,name:'ideal photons'},{id:1.4,name:'n̄ = 1.4'},{id:10,name:'n̄ = 10'},{id:100,name:'n̄ = 100'},{id:1000,name:'n̄ = 1000'}];
const CHANS=[{id:'co',name:'co-pol'},{id:'cross',name:'cross-pol'}];
const KFPS=[{id:18,name:'18 kfps'},{id:100,name:'100 kfps'},{id:200,name:'200 kfps'}];
const STARSEL=[{id:'gamcas',name:'γ Cas disc'},{id:'disc',name:'uniform star'}];
const RINGSEL=[{id:2,name:'19'},{id:4,name:'61'},{id:6,name:'127'},{id:8,name:'217'}];

const DEFAULTS={view:'bench', L:25, lamnm:785, Nbr:8, Tu:10, sync:true,
                layout:'square', F:0.29, Dmm:50, rings:6, afs:10,
                target:'mosquito', chan:'co', rot:0, tdx:0, tdy:0, fly:true,
                Nfr:500, kfps:100, V2pick:0.2,
                Pt:0.5, wbeam:0.10, Am:5, rho:0.30, eta:0.25, sigr:1.5,
                star:'gamcas', thmas:5.6, hrange:4, showPaper:true,
                pick:-1, pick2:-1, hio:false,
                repMode:'jitter', repPh:0,
                anim:true, speed:1.0, t:0};
const ST=Object.assign({},DEFAULTS);

const GRID_N=512, GRID_PX=0.028;          /* mm per pixel on the target plane */
const SRC_NINT=20000, SRC_SUB=8, SRC_SEED=7;
const HIO_MAX=300, HIO_PER_FRAME=2;

/* ---- caches keyed on the parameters that actually enter each quantity ---- */
const CACHE={};
function cached(key,fn){ if(CACHE[key]===undefined) CACHE[key]=fn(); return CACHE[key]; }
function clearCache(){ for(const k in CACHE) delete CACHE[k]; }
let HIO_STATE=null, HIO_KEY='';
let REP_STATE=null, REP_KEY='';
const REP_CAP=2000, REP_BATCH=20;

function rateFor(view){ return view==='source'?3.0:(view==='target'?0.8:1.0); }
function lazyC(obj,name,fn){
  let has=false,v;
  Object.defineProperty(obj,name,{get(){ if(!has){ v=fn(); has=true; } return v; },
                                  configurable:true, enumerable:false});
}
/* the target's translation as it "flies": a closed Lissajous path in mm */
function flyOffset(t){ return [2.2*Math.sin(0.9*t), 1.3*Math.sin(1.7*t+0.6)]; }

function buildModel(){
  const st=ST, view=st.view;
  const lam=st.lamnm*1e-9, L=st.L, D=st.Dmm/1000;
  const M={view, t:st.t, lam, L, D};
  /* ---- geometry numbers every view may quote ---- */
  M.Bdoc=baselineFor(lam,L,1e-4);                 /* baseline for 0.1 mm at this L */
  M.single=rayleighRes(lam,L,D);                  /* one telescope alone */
  M.grain=speckleGrain(lam,L,st.afs*1e-3);        /* speckle grain at the receiver */
  const recKey='rec|'+[st.layout,st.F,st.Dmm,st.rings].join('|');
  lazyC(M,'rec',()=>cached(recKey,()=>receiverSegments(st.layout,st.F,D,st.rings)));
  lazyC(M,'cen',()=>cached(recKey+'|cen',()=>baselineCensus(M.rec.segs)));
  lazyC(M,'red',()=>cached(recKey+'|red',()=>baselineRedundancy(M.cen)));
  lazyC(M,'dsub',()=>M.rec.pitch);
  lazyC(M,'bmax',()=>M.cen.bmax);
  lazyC(M,'bmin',()=>M.cen.bmin);
  lazyC(M,'dxnom',()=>rayleighRes(lam,L,M.cen.bmax));
  lazyC(M,'largest',()=>lam*L/M.cen.bmin);
  lazyC(M,'ratio',()=>M.rec.pitch/M.grain);
  lazyC(M,'uvhist',()=>cached(recKey+'|uvh',()=>uvHistogram(M.cen,72,Math.max(0.12,M.cen.bmax*1.05))));
  lazyC(M,'lenhist',()=>cached(recKey+'|lh',()=>lengthHistogram(M.cen,48,M.cen.bmax*1.0001)));
  /* ---- the source ---- */
  M.g20=g2zero(st.Nbr); M.contrast=contrastOf(st.Nbr);
  M.tauc=tauC(st.Tu*1e-6,st.sync);                /* s */
  M.Tframe=1/(st.kfps*1000);                      /* s, exposure = frame period */
  M.Tacq=st.Nfr*M.Tframe;
  M.nreal=realisations(M.Tacq,st.Tu*1e-6);
  /* independent realisations actually used: whole phase words inside the
     acquisition, never more than the frames (1e-9 guards 5e-3/5e-5 = 100.0000001) */
  M.nIndep=Math.min(st.Nfr,Math.floor(M.nreal+1e-9));
  const srcKey='src|'+st.Nbr+'|'+st.sync;
  lazyC(M,'series',()=>cached(srcKey,()=>sourceSeries(st.Nbr,SRC_NINT,SRC_SUB,st.sync,SRC_SEED)));
  lazyC(M,'g2mc',()=>cached(srcKey+'|mc',()=>{
    const out=[]; for(let lag=0;lag<=2*SRC_SUB;lag++) out.push([lag/SRC_SUB,g2Estimate(M.series.I,lag)]);
    return out; }));
  lazyC(M,'ihist',()=>cached(srcKey+'|hist',()=>intensityHist(M.series.I,30,5)));
  M.srcIdx=40+Math.floor(st.t*2.0)%(SRC_NINT-80);  /* the trace window (40 words) ends here; starts full */
  /* ---- the target ---- */
  const off=st.fly&&view==='target'?flyOffset(st.t):[0,0];
  M.tdx=st.tdx+off[0]; M.tdy=st.tdy+off[1];
  M.prims=targetPrims(st.target,st.chan,st.rot,M.tdx,M.tdy);
  M.prims0=targetPrims(st.target,st.chan,st.rot,0,0);
  M.F0=targetF0(M.prims);
  const gKey='grid|'+[st.target,st.chan,st.rot].join('|');
  lazyC(M,'grid',()=>cached(gKey,()=>targetGrid(M.prims0,GRID_N,GRID_PX)));
  const mKey='mask|'+recKey+'|'+st.lamnm+'|'+L;
  lazyC(M,'cov',()=>cached(mKey,()=>coverageMask(M.cen,GRID_N,GRID_PX,lam,L)));
  lazyC(M,'acTrue',()=>cached(gKey+'|ac',()=>autocorrFrom(M.grid,null,GRID_N)));
  lazyC(M,'acDirty',()=>cached(gKey+'|'+mKey+'|acd',()=>autocorrFrom(M.grid,M.cov.mask,GRID_N)));
  lazyC(M,'acCorr',()=>normCorr(M.acTrue,M.acDirty));
  M.cell=1/(GRID_N*GRID_PX);                      /* cycles/mm per uv cell */
  M.dBcell=M.cell*1000*lam*L;                     /* metres of baseline per cell */
  M.uSpan=(GRID_N/2)*M.cell;                      /* cycles/mm half-span */
  M.Bspan=M.uSpan*1000*lam*L;                     /* metres */
  M.hioKey=gKey+'|'+mKey;
  /* ---- the signal ---- */
  lazyC(M,'rad',()=>nbarOf(st.Pt,st.wbeam,st.Am*1e-6,st.rho,st.eta,M.rec.pitch,L,M.Tframe,lam));
  lazyC(M,'nbar',()=>M.rad.nbar);
  lazyC(M,'snrCeil',()=>snrCeiling(st.V2pick,M.nIndep));
  lazyC(M,'snrHF',()=>snrGaussHF(st.V2pick,M.nIndep));
  lazyC(M,'snrPh',()=>snrFrames(st.V2pick,M.nIndep,M.nbar,st.sigr));
  lazyC(M,'snrRows',()=>FRAME_TABLE.map(r=>[r[0],r[1],r[2],snrCeiling(st.V2pick,r[2]),
                                          snrGaussHF(st.V2pick,r[2])]));
  lazyC(M,'starDil',()=>MATTHEWS.tauo/MATTHEWS.dt);   /* starlight dilution tau_o/dt */
  lazyC(M,'engDil',()=>Math.min(1,st.Tu*1e-6/M.Tframe)); /* engineered: one realisation per frame */
  /* |V|^2 along two cuts vs baseline: raw and sub-aperture-smeared */
  lazyC(M,'cuts',()=>cached('cuts|'+gKey+'|'+st.lamnm+'|'+L+'|'+recKey,()=>{
    const F0=targetF0(M.prims0), n=64, bmax=M.cen.bmax*1.02;
    const fn=(bx,by)=>v2AtBaseline(M.prims0,F0,bx,by,lam,L);
    const out={B:[],x:[],y:[],xs:[],ys:[]};
    for(let i=0;i<n;i++){ const B=bmax*i/(n-1); out.B.push(B);
      out.x.push(fn(B,0)); out.y.push(fn(0,B));
      out.xs.push(smearV2(fn,B,0,M.rec.pitch)); out.ys.push(smearV2(fn,0,B,M.rec.pitch)); }
    return out; }));
  /* ---- the telescope (heritage) ---- */
  lazyC(M,'her',()=>cached('her|'+st.hrange+'|'+st.thmas+'|'+st.star,()=>{
    const pitch=IACT.longest/(2*IACT.hexRings);
    const hx=hexCentres(IACT.hexRings,pitch);
    const n=hx.length, pairs=[];
    for(let p=0;p<n;p++) for(let q=p+1;q<n;q++) pairs.push([hx[q][0]-hx[p][0],hx[q][1]-hx[p][1]]);
    const lat=VERITAS.latDeg*PI/180, dec=GAMCAS.decDeg*PI/180;
    const nsnap=Math.max(1,Math.round(st.hrange*2*2));          /* 30-min snapshots */
    const hours=[]; for(let k=0;k<nsnap;k++) hours.push(-st.hrange+(k+0.5)*(2*st.hrange/nsnap));
    const snaps=hours.map(hh=>{ const vec=skyVectors(hh*15*PI/180,lat,dec);
      const q=parallactic(hh*15*PI/180,lat,dec);
      return {h:hh,q,vec,uv:pairs.map(b=>dishToUV(b[0],b[1],vec))}; });
    /* |V|^2 along major/minor for the gaussian disc; uniform disc for the star */
    const lamH=GAMCAS.lam, th=GAMCAS.thMaj;
    const Bs=[]; for(let i=0;i<=60;i++) Bs.push(12*i/60);
    const pa=GAMCAS.paDeg*PI/180;
    const vMaj=Bs.map(B=>gaussDiscV2(B*Math.sin(pa),B*Math.cos(pa),th,GAMCAS.ratio,GAMCAS.paDeg,lamH));
    const vMin=Bs.map(B=>gaussDiscV2(B*Math.cos(pa),-B*Math.sin(pa),th,GAMCAS.ratio,GAMCAS.paDeg,lamH));
    const pMaj=Bs.map(B=>paperCurve(B,th,lamH)), pMin=Bs.map(B=>paperCurve(B,GAMCAS.ratio*th,lamH));
    /* redundancy-weighted error bars: the hex lattice repeats each vector */
    const mult=new Map(); for(const b of pairs){ let x=Math.round(b[0]*1e6),y=Math.round(b[1]*1e6);
      if(x<0||(x===0&&y<0)){x=-x;y=-y;} const k=x+','+y; mult.set(k,(mult.get(k)||0)+1); }
    const sn=snMatthews(MATTHEWS.rate,MATTHEWS.tauo,MATTHEWS.T,MATTHEWS.dt);
    const thStar=st.thmas*MAS, lamS=450e-9;
    const vStar=Bs.map(B=>uniformDiscV2(B*10,thStar,lamS));     /* star axis runs to 120 m */
    return {pitch,hx,pairs,snaps,hours,Bs,vMaj,vMin,pMaj,pMin,mult,sn,sigma:1/sn,
            nB:pairs.length,nTot:pairs.length*nsnap,nsnap,
            dcRim:dcSpread(IACT.D/2,IACT.f),dcHex:dcSpread(6,IACT.f)-dcSpread(6-pitch,IACT.f),
            vStar,thStar,lamS,zeroB:firstZeroB(thStar,lamS),
            rd:STARS.map(s=>{ const th_=s.th*PI/180/3600; const lams=[]; const vals=[];
              for(let i=0;i<=60;i++){ const lm=Math.pow(10,-1+2*i/60)*1e-6; lams.push(lm); vals.push(rdtau(s.T,th_,lm)); }
              return {name:s.name,lams,vals}; })};
  }));
  /* ---- the replication (forward Monte Carlo) — cached static pieces only ---- */
  if(view==='rep'){
    const rn=REP.n;
    M.repKey='rep|'+[st.target,st.chan,st.lamnm,L,st.Nbr,st.repMode].join('|');
    lazyC(M,'repO',()=>cached('repO|'+[st.target,st.chan].join('|'),
      ()=>applyStop(rasterTarget(targetPrims(st.target,st.chan,0,0,0),rn,REP.pt),rn,REP.pt,st.afs)));
    lazyC(M,'repTruth',()=>cached('repT|'+[st.target,st.chan,st.afs].join('|'),()=>repTruthRow(M.repO,rn)));
    M.repIdx=repDetectorIdx(); M.repDxi=repDxi(lam,L);
    lazyC(M,'repPairs',()=>cached('repP|'+[st.target,st.chan,st.afs,st.lamnm,L].join('|'),()=>repPairs(M.repIdx,M.repTruth,rn,M.repDxi)));
    lazyC(M,'repTilts',()=>cached('repTi|'+[st.Nbr,st.lamnm,L].join('|'),()=>repTilts(repEmitters(st.Nbr,REP.ring),rn,REP.pt,lam,L)));
    M.repNbr=st.Nbr; M.repMode=st.repMode; M.repPh=st.repPh;
    M.repState=(REP_STATE&&REP_KEY===M.repKey+'|'+st.repPh)?REP_STATE:null;
  }
  return M;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function row(k,v,cls){ return '<tr><td>'+k+'</td><td class="v'+(cls?' '+cls:'')
  +'">'+v+'</td></tr>'; }
function mm(x){ return sigf(x*1e3,3)+' mm'; }
function um(x){ return sigf(x*1e6,3)+' µm'; }
function mOf(x){ return sigf(x,3)+' m'; }
function ns(x){ return sigf(x*1e9,3)+' ns'; }
function us(x){ return sigf(x*1e6,3)+' µs'; }

function readoutHTML(M){
  const st=ST, v=M.view;
  let s='<div class="rname">pupil-plane intensity interferometry<small>'
    +TABS.filter(tb=>tb[0]===v)[0][1]+'</small></div>';
  s+='<table>';
  if(v==='bench'){
    s+=hd('the design point');
    s+=row('range L · λ',sigf(M.L,3)+' m · '+st.lamnm+' nm');
    s+=row('B for 0.1 mm = 1.22λL/0.1 mm',mOf(M.Bdoc));
    s+=row('frame B<sub>max</sub> (pupil to pupil)',mOf(M.bmax));
    s+=row('δx<sub>nom</sub> = 1.22λL/B<sub>max</sub>',um(M.dxnom),M.dxnom<=1e-4?'good':'bad');
    s+=row('one '+st.Dmm+' mm telescope alone',um(M.single));
    s+=hd('the source');
    s+=row('branches N · g<sup>(2)</sup>(0) = 2−1/N',st.Nbr+' · '+fmt(M.g20,3));
    s+=row('update T<sub>u</sub> · τ<sub>c</sub> ('+(st.sync?'one clock':'independent')+')',

    s+=row('sub-aperture d · speckle grain',mm(M.dsub)+' · '+mm(M.grain),M.ratio>1?'bad':'good');
    s+='</table><div class="note">Everything above is closed-form geometry from the '
      +'concept document: δx ≈ 1.22λL/B is the nominal scale set by the longest '
      +'sampled baseline, not a guarantee of reconstructed detail. The speckle grain '
      +'λL/a<sub>fs</sub> is the field correlation length at the receiver for a field '

  if(v==='source'){

    s+=row('g<sup>(2)</sup>(τ)−1 shape',st.sync?'triangle (1−|τ|/T<sub>u</sub>)':'squared triangle');
    s+=row('τ<sub>c</sub> (1/e)',us(M.tauc)+' = '+fmt(M.tauc/(st.Tu*1e-6),3)+' T<sub>u</sub>');
    s+=row('frame period 1/kfps',us(M.Tframe),st.Tu*1e-6<=M.Tframe?'good':'bad');
    s+=row('realisations in '+sigf(M.Tacq*1e3,3)+' ms',fmt(M.nreal,0));
    s+='</table><div class="note">With one shared FPGA clock every branch jumps at once, '
      +'so the intensity is piecewise constant and its correlation falls LINEARLY to zero '
      +'at T<sub>u</sub>: 1/e at 0.632 T<sub>u</sub>. The 0.393 T<sub>u</sub> of the concept '
      +'document is the squared triangle, which needs independent per-branch clocks. '
      +'Either way one frame per T<sub>u</sub> is one independent realisation.</div>';

  if(v==='pupils'){

    s+=row('sub-aperture pitch d<sub>sub</sub>',mm(R.pitch));

    s+=row('B<sub>min</sub> = d<sub>sub</sub>',mm(C.bmin));
    s+=row('B<sub>max</sub>',mOf(C.bmax));

    s+=row('finest δx<sub>nom</sub> = 1.22λL/B<sub>max</sub>',um(M.dxnom));
    s+=row('largest structure λL/B<sub>min</sub>',mm(M.largest));
    s+=row('speckle grain λL/a<sub>fs</sub> ('+st.afs+' mm stop)',mm(M.grain));
    s+=row('d<sub>sub</sub> / grain',fmt(M.ratio,2),M.ratio>1?'bad':'good');
    if(st.pick>=0&&st.pick2>=0){
      const p=R.segs[st.pick],q=R.segs[st.pick2];

    s+='</table><div class="note">Each segment pair is one baseline; every pupil '
      +'contributes all its internal pairs (dense, short) and every telescope pair '

      +'several grains and the measured correlation drops — the binning trades '

  }
  if(v==='signal'){
    const R=M.rad;

    s+='</table><div class="note">Starlight\'s coherence time is ~10⁻⁴ of a 2 ns '
      +'resolution, so the bunching peak is diluted to ~10⁻⁴ (Matthews eq. 4); '

      +'sees full contrast — and the noise becomes the speckle\'s own wave noise '

  if(v==='rep'){
    const R=M.repState;

    s+=row('target · illumination',(st.target==='usaf'?'resolution target':st.target)+' · '+(st.repMode==='jitter'?'new speckle / frame':'frozen speckle'));
    s+=row('branches N · photons',String(st.Nbr)+' · '+(st.repPh?('n̄ = '+st.repPh+' e⁻'):'ideal'));
    s+=row('detectors · pairs',M.repIdx.length+' · '+M.repPairs.B.length);

      const ratio=cnt?num/cnt:NaN, expect=st.repMode==='jitter'?1:(1-1/st.Nbr);
      s+=hd('does c recover |V|²?  (baselines with |V|² > 0.05)');

      s+=row('expected '+(st.repMode==='jitter'?'(jitter → 1)':'(static → 1−1/N)'),fmt(expect,3));
      s+=row('rms relative scatter',fmt(Math.sqrt(rms/Math.max(1,cnt)),3));

    }
    s+='</table><div class="note">'+(st.repMode==='jitter'

       +'the estimate <b>converges to the true |V|²</b> (ratio → 1) with scatter falling as 1/√N_f — '
       +'the concept works in principle, for a target whose speckle renews frame to frame.'
      :'A frozen speckle (a truly static, rigid target) gives one realisation of a random field: '
       +'c → about (1−1/N)|V|² with a <b>speckle noise ~|V|/√N that more frames CANNOT remove</b>. '
       +'A static target needs many source patterns or many N, not many frames.')+'</div>';
    return s;
  }
  /* the telescope (heritage) */
  { const H=M.her;
    s+=hd('the 12-m Davies–Cotton IACT');
    s+=row('f = D = 12 m · facets on a 12-m sphere','VERITAS-like');
    s+=row('arrival spread rim − centre',ns(H.dcRim)+' (paper ~5.4)');
    s+=row('within one rim hex cell',ns(H.dcHex));
    s+=hd('the re-imaged pupil');
    s+=row('hexagons · baselines',H.hx.length+' · '+H.nB);
    s+=row('pitch on the dish · longest',mOf(H.pitch)+' · '+mOf(IACT.longest));
    s+=row('snapshots (30 min, ±'+st.hrange+' h) · points',H.nsnap+' · '+H.nTot);
    s+=hd('γ Cas, Hα 656.3 nm');
    s+=row('disc FWHM · ratio · PA','4.4 mas · 0.74 · 17°');
    s+=row('S/N per point (eq. 4)',fmt(H.sn,1)+' → σ<sub>|V|²</sub> = '+fmt(H.sigma,3));
    s+=row('inputs','86.9 Mcps · 445 fs · 2 ns · 30 min');
    if(st.star==='disc'){

    }
    s+='</table><div class="note">Matthews, Gori & Vakili turn one Cherenkov dish into '
      +'an 1830-baseline intensity interferometer by imaging its pupil onto 61 '
      +'detectors — the 0.3-m mosquito frame is the same idea at 1/40 scale with an '
      +'engineered source. The alt-az mount rotates the baselines by the parallactic '
      +'angle, so 8 h of γ Cas paint the rosette.</div>';
    return s;
  }
}

/* ---- role colours: green = the measured/computed thing (|V|^2, correlation,
   reconstruction), orange = analytic reference / ceiling / warning, magenta =
   the live object (selected pair, current frame, the target), cyan =
   structure (pupils, telescopes, optics). ---- */
const COL={meas:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', gridtx:'#6f7789', tel:['#5ac8e0','#7db8ff','#4fd1b3','#9fa8ff'],
           beam:'#e8843a', laser:'#ff6b6b'};
const RO_W=310;
const NARROW_W=430;           /* below this column width a view draws its one primary panel */

/* equal-aspect world mapping: ONE scale for both axes (a pupil is round) */
function worldMap(b,X0,X1,Y0,Y1){
  const s=Math.min(b.w/(X1-X0),b.h/(Y1-Y0));
  const cx=b.x+(b.w-s*(X1-X0))/2, cy=b.y+(b.h-s*(Y1-Y0))/2;
  return {s, X:x=>cx+(x-X0)*s, Y:y=>cy+(Y1-y)*s, inX:X=>X0+(X-cx)/s, inY:Y=>Y1-(Y-cy)/s,
          x0:cx, y0:cy, x1:cx+s*(X1-X0), y1:cy+s*(Y1-Y0)};
}
function txt(ctx,s,x,y,col,font,align,base){
  ctx.fillStyle=col||COL.gridtx; ctx.font=font||'10.5px -apple-system, sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline=base||'top'; ctx.fillText(plain(s),x,y);
}
function arrow(ctx,x0,y0,x1,y1,col,lw){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw||1.5;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0), h=6;
  ctx.beginPath(); ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(a-0.45),y1-h*Math.sin(a-0.45));
  ctx.lineTo(x1-h*Math.cos(a+0.45),y1-h*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();
}
function hexPath(ctx,X,Y,r){
  ctx.beginPath();
  for(let k=0;k<6;k++){ const a=PI/6+k*PI/3; const x=X+r*Math.cos(a), y=Y+r*Math.sin(a);
    if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.closePath();
}
/* draw a list of brightness primitives (mm) through a map; alpha by amplitude.
   Explicit polygons in DEVICE coordinates — no translate/rotate/scale — so the
   display-list recorder (which has no ellipse() and does not carry a scaled
   arc through a restore) sees exactly what the browser draws. */
function drawPrims(ctx,mp,prims,col,amax){
  for(const p of prims){
    const t=p[5]*PI/180, c=Math.cos(t), s=Math.sin(t), X=mp.X(p[1]), Y=mp.Y(p[2]);
    ctx.globalAlpha=0.25+0.75*p[6]/(amax||1);
    ctx.fillStyle=col;
    ctx.beginPath();
    if(p[0]==='ell'){
      const a=Math.max(0.6,p[3]/2*mp.s), b=Math.max(0.6,p[4]/2*mp.s);
      for(let k=0;k<36;k++){ const ph=TAU*k/36, ex=a*Math.cos(ph), ey=b*Math.sin(ph);
        const x=X+ex*c-ey*s, y=Y-(ex*s+ey*c);           /* canvas y runs down */
        if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    } else {
      const a=p[3]/2*mp.s, b=Math.max(0.8,p[4]*mp.s)/2;
      for(const [ex,ey] of [[-a,-b],[a,-b],[a,b],[-a,b]]){ const x=X+ex*c-ey*s, y=Y-(ex*s+ey*c);
        if(ex===-a&&ey===-b) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
}
/* shaded cell map of a values array (m x m) in panel b; v in [0,1] -> colour */
function cellMap(ctx,b,vals,m,colFn){
  const cw=b.w/m, ch=b.h/m;
  for(let j=0;j<m;j++) for(let i=0;i<m;i++){
    const v=vals[j*m+i]; if(!(v>0)) continue;
    ctx.fillStyle=colFn(v);
    ctx.fillRect(b.x+i*cw,b.y1-(j+1)*ch,cw+0.6,ch+0.6);
  }
}
function scaleBar(ctx,mp,x,y,len,label){
  ctx.strokeStyle='#aeb6c6'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len*mp.s,y); ctx.stroke();
  txt(ctx,label,x+len*mp.s/2,y+3,'#aeb6c6','10px -apple-system, sans-serif','center','top');
}
/* a small pseudo-random hash for the speckle flicker (drawing only) */
function hash2(i,j){ let h=(i*73856093)^(j*19349663); h=(h^(h>>>13))>>>0; return ((h*2654435761)>>>0)/4294967296; }
function panelTitle(ctx,b,s){ txt(ctx,s,b.x,b.y-9,'#aeb6c6','italic 13px Georgia, serif','left','bottom'); }

    +'chaotic by construction. The return enters four small telescopes on a rigid frame; '
    +'each pupil is relayed onto its own region of ONE camera and binned into segments, '
    +'and every segment pair is a baseline. Lengths are NOT to scale: L is '+sigf(M.L,3)
    +' m, the frame '+fmt(st.F*100,0)+' cm, the mosquito a few mm. Below: the nominal '
    +'scale 1.22λL/B against baseline, with the document\'s 0.1 mm design points.',short,colW,330);
  const top=stageTop()+24;
  /* ---- the resolution plot ---- */
  const plotPanel=(pb)=>{
    const Blo=0.05,Bhi=0.42, dlo=0,dhi=0.45;
    axes(ctx,pb,Blo,Bhi,dlo,dhi,{xlab:'longest baseline B (m)',ylab:'nominal scale δx (mm)',
      title:'δx = 1.22 λL/B — the document\'s design relation',xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,2),
      nx:pb.w<260?3:(pb.w<450?4:6),ny:pb.h<120?3:5});
    const xs=[]; for(let i=0;i<=80;i++) xs.push(Blo+(Bhi-Blo)*i/80);
    const Ls=[20,25,30]; if(Ls.every(Lc=>Math.abs(Lc-M.L)>1e-9)) Ls.push(M.L);
    for(const Lc of Ls){
      const mine=Math.abs(Lc-M.L)<1e-9;
      polyline(ctx,pb,xs,xs.map(B=>rayleighRes(M.lam,Lc,B)*1e3),Blo,Bhi,dlo,dhi,mine?COL.meas:'#3a4658',mine?2:1.2);
    }
    polyline(ctx,pb,[Blo,Bhi],[0.1,0.1],Blo,Bhi,dlo,dhi,COL.ref,1,[4,3]);
    txt(ctx,'0.1 mm target',pb.x+6,pb.y1-pb.h*(0.1-dlo)/(dhi-dlo)-4,COL.ref,'10px -apple-system, sans-serif','left','bottom');
    for(const [Lc,Bd] of [[20,0.1915],[25,0.2394],[30,0.2873]]){
      const X2=pb.x+pb.w*(Bd-Blo)/(Bhi-Blo), Y2=pb.y1-pb.h*(0.1-dlo)/(dhi-dlo);
      ctx.strokeStyle=COL.ref; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(X2,Y2,3.5,0,TAU); ctx.stroke();
      if(pb.w>450) txt(ctx,fmt(Bd,4)+' m @'+Lc,X2,Y2+6,COL.ref,'9.5px -apple-system, sans-serif','center','top');
    }
    { const X2=pb.x+pb.w*(M.bmax-Blo)/(Bhi-Blo), Y2=pb.y1-pb.h*(M.dxnom*1e3-dlo)/(dhi-dlo);
      if(M.bmax>=Blo&&M.bmax<=Bhi&&M.dxnom*1e3<=dhi){
        ctx.fillStyle=COL.live; ctx.beginPath(); ctx.arc(X2,Y2,4.5,0,TAU); ctx.fill();
        if(pb.w>450) txt(ctx,'this frame: B_max '+fmt(M.bmax,3)+' m → '+fmt(M.dxnom*1e6,0)+' µm',X2-8,Y2+8,COL.live,'10px -apple-system, sans-serif','right','top'); } }
    if(pb.w>300) legendAuto(ctx,pb,[[COL.meas,'L = '+sigf(M.L,3)+' m (current)'],['#3a4658','L = 20, 25, 30 m'],[COL.ref,'the document\'s 0.1 mm design points']]);
  };
  if(narrow){ plotPanel(box(colX+46,top+26,colW-50,Math.max(80,fit.capY-top-60))); caption(ctx,colX,fit.capY,fit.txt,fit.capW); return; }
  /* ---- the schematic ---- */
  const schemH=Math.max(150,Math.min(300,(fit.capY-top-60)*0.56));
  const b=box(colX,top,colW,schemH);
  frame(ctx,b,'#242a3a');
  const X=f=>b.x+f*b.w, Ym=b.y+b.h*0.52;
  ctx.fillStyle='#2a1620'; ctx.strokeStyle=COL.laser; ctx.lineWidth=1.2;
  ctx.fillRect(X(0.015),Ym-14,b.w*0.075,28); ctx.strokeRect(X(0.015),Ym-14,b.w*0.075,28);
  txt(ctx,st.lamnm+' nm laser',X(0.052),Ym+18,COL.dim,'10px -apple-system, sans-serif','center');
  ctx.strokeStyle=COL.struct; ctx.beginPath(); ctx.moveTo(X(0.09),Ym); ctx.lineTo(X(0.125),Ym); ctx.stroke();
  ctx.fillStyle='#0f1a24'; ctx.fillRect(X(0.125),Ym-16,b.w*0.035,32); ctx.strokeRect(X(0.125),Ym-16,b.w*0.035,32);
  txt(ctx,'1×N',X(0.1425),Ym-5,COL.struct,'10px -apple-system, sans-serif','center');
  const nm=Math.min(st.Nbr,8), spread=Math.min(b.h*0.84,nm*20);
  for(let k=0;k<nm;k++){
    const y=Ym-spread/2+spread*(k+0.5)/nm;
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X(0.16),Ym); ctx.lineTo(X(0.205),y); ctx.stroke();
    ctx.fillStyle='#0f1a24'; ctx.fillRect(X(0.205),y-6,b.w*0.04,12); ctx.strokeRect(X(0.205),y-6,b.w*0.04,12);
    const ph=hash2(k+1,Math.floor(st.t*6)+1);
    ctx.strokeStyle=COL.beam; ctx.globalAlpha=0.35+0.6*ph; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(X(0.245),y); ctx.lineTo(X(0.39),y*0.6+Ym*0.4); ctx.moveTo(X(0.43),y*0.6+Ym*0.4); ctx.lineTo(X(0.565),Ym+(y-Ym)*0.08); ctx.stroke();
    ctx.globalAlpha=1;
  }
  txt(ctx,'N = '+st.Nbr+' phase modulators',X(0.225),Ym+spread/2+4,COL.dim,'10px -apple-system, sans-serif','center');
  ctx.strokeStyle='#4a5160'; ctx.lineWidth=1.2;
  for(const fx of [0.405,0.415]){ ctx.beginPath(); ctx.moveTo(X(fx),b.y+8); ctx.lineTo(X(fx-0.012),b.y+b.h/2); ctx.lineTo(X(fx),b.y1-8); ctx.stroke(); }
  txt(ctx,'break: L = '+sigf(M.L,3)+' m',X(0.41),b.y1-14,COL.dim,'10px -apple-system, sans-serif','center','bottom');
  const pr=Math.min(b.h*0.36,b.w*0.07), px0=X(0.60);
  ctx.save(); ctx.beginPath(); ctx.arc(px0,Ym,pr,0,TAU); ctx.clip();
  const nc=9; for(let i=0;i<nc;i++) for(let j=0;j<nc;j++){
    const v=hash2(i+11,j+17+Math.floor(st.t*6)); ctx.fillStyle=shade(COL.beam,0.15+0.85*v*v);
    ctx.fillRect(px0-pr+2*pr*i/nc,Ym-pr+2*pr*j/nc,2*pr/nc+0.5,2*pr/nc+0.5); }
  ctx.restore();
  ctx.strokeStyle=COL.dim; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(px0,Ym,pr,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  const mpT={s:pr/4.5,X:x=>px0+x*pr/4.5,Y:y=>Ym-y*pr/4.5};
  drawPrims(ctx,mpT,targetPrims('mosquito','co',20,0,0),COL.live,1);
  txt(ctx,'target ('+st.afs+' mm stop)',px0,Ym+pr+4,COL.dim,'10px -apple-system, sans-serif','center');
  txt(ctx,'speckle changes every T_u = '+sigf(st.Tu,3)+' µs',px0,b.y+6,COL.dim,'10px -apple-system, sans-serif','center');
  const fx0=X(0.78), fr=Math.min(b.h*0.40,b.w*0.075);
  ctx.strokeStyle=COL.meas; ctx.globalAlpha=0.7; ctx.lineWidth=1.2;
  for(const t of telescopeCentres(st.layout,1)){ ctx.beginPath(); ctx.moveTo(px0+pr,Ym); ctx.lineTo(fx0+t[0]*fr*0.9,Ym-t[1]*fr*0.9); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.strokeStyle='#3a4150'; ctx.lineWidth=1; ctx.strokeRect(fx0-fr,Ym-fr,2*fr,2*fr);
  const tel=telescopeCentres(st.layout,1);
  tel.forEach((t,i)=>{ const r=Math.max(3,fr*0.9*(st.Dmm/1000)/st.F);
    ctx.fillStyle=shade(COL.tel[i%4],0.35); ctx.strokeStyle=COL.tel[i%4]; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(fx0+t[0]*fr*0.9,Ym-t[1]*fr*0.9,Math.min(r,fr*0.45),0,TAU); ctx.fill(); ctx.stroke(); });
  txt(ctx,'frame F = '+fmt(st.F*100,0)+' cm',fx0,Ym+fr+4,COL.dim,'10px -apple-system, sans-serif','center');
  const ox=X(0.885), ow=b.w*0.1, oy=Ym-fr*0.9, oh=fr*1.8;
  ctx.fillStyle='#0c1018'; ctx.fillRect(ox,oy,ow,oh); ctx.strokeStyle=COL.struct; ctx.strokeRect(ox,oy,ow,oh);
  tel.forEach((t,i)=>{ ctx.strokeStyle=COL.tel[i%4]; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(fx0+t[0]*fr*0.9,Ym-t[1]*fr*0.9); ctx.lineTo(ox,oy+oh*(i+0.5)/tel.length); ctx.stroke(); });
  txt(ctx,'field stops',ox+ow/2,oy+4,COL.dim,'9.5px -apple-system, sans-serif','center');
  txt(ctx,'pupil relays',ox+ow/2,oy+16,COL.dim,'9.5px -apple-system, sans-serif','center');
  txt(ctx,'PBS · filter',ox+ow/2,oy+28,COL.dim,'9.5px -apple-system, sans-serif','center');
  const cy=oy+oh-Math.min(26,oh*0.45), ch=Math.min(22,oh*0.4), rr=Math.min(ch*0.42,ow/(2*tel.length+1));
  ctx.fillStyle='#161b26'; ctx.fillRect(ox+3,cy,ow-6,ch);
  tel.forEach((t,i)=>{ ctx.fillStyle=shade(COL.tel[i%4],0.8); ctx.beginPath();
    ctx.arc(ox+3+(ow-6)*(i+0.5)/tel.length,cy+ch/2,rr,0,TAU); ctx.fill(); });
  txt(ctx,'one camera: a ROI per pupil',ox+ow/2,oy+oh+18,COL.dim,'9.5px -apple-system, sans-serif','center');
  const py0=b.y1+46;
  plotPanel(box(colX+46,py0,colW-60,Math.max(80,fit.capY-py0-34)));
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the source — an engineered chaotic light                     *
 * ================================================================== */
function drawSource(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-84, narrow=colW<NARROW_W;
  const short='Random-phase phasor sum → chaotic intensity; g²(τ) is a triangle (one clock) or its square.';
  const fit=fitCaption(ctx,W,H,narrow?short:
    'N unit phasors with random phases (left) add to a resultant whose squared length is '
    +'the instantaneous intensity; held for T_u and then re-drawn, the intensity is a '
    +'piecewise-constant chaotic trace (top right) whose histogram tends to the exponential '
    +'of thermal light as N grows (contrast √(1−1/N)). Bottom right: g²(τ) — with one '
    +'master clock every branch jumps together, so the correlation falls LINEARLY to zero '
    +'at T_u (1/e at 0.632 T_u); independent branch clocks give the squared triangle and the '
    +'document\'s 0.393 T_u. Magenta dots are the estimate from the drawn series.',short,colW,330);
  const top=stageTop()+10, hgt=fit.capY-top-12;
  const ser=M.series, N=st.Nbr, idx=M.srcIdx, Tu=st.Tu;
  const g2plot=(bD)=>{
    const xhi=2;
    axes(ctx,bD,0,xhi,0.9,2.1,{xlab:'lag τ (units of T_u = '+sigf(Tu,3)+' µs)',ylab:'g⁽²⁾(τ)',title:'the intensity correlation',nx:4,ny:4,xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,1)});
    { const xs=[],ya=[],yb=[]; for(let i=0;i<=80;i++){ const x=xhi*i/80; xs.push(x); ya.push(g2tau(x,1,N,true)); yb.push(g2tau(x,1,N,false)); }
      polyline(ctx,bD,xs,st.sync?yb:ya,0,xhi,0.9,2.1,'#3a4658',1.2,[4,3]);
      polyline(ctx,bD,xs,st.sync?ya:yb,0,xhi,0.9,2.1,COL.meas,2); }
    for(const [x,g] of M.g2mc){ if(x>xhi) continue; const X2=bD.x+bD.w*x/xhi, Y2=bD.y1-bD.h*(g-0.9)/1.2;
      if(Y2>=bD.y&&Y2<=bD.y1){ ctx.fillStyle=COL.live; ctx.beginPath(); ctx.arc(X2,Y2,2.6,0,TAU); ctx.fill(); } }
    { const tc=M.tauc/(Tu*1e-6); const X2=bD.x+bD.w*tc/xhi;
      ctx.strokeStyle=COL.ref; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(X2,bD.y); ctx.lineTo(X2,bD.y1); ctx.stroke(); ctx.setLineDash([]);
      txt(ctx,'τ_c = '+fmt(tc,3)+' T_u',X2+4,bD.y+6,COL.ref,'10px -apple-system, sans-serif');
      const fr=M.Tframe/(Tu*1e-6); if(fr<=xhi){ const X3=bD.x+bD.w*fr/xhi;
        ctx.strokeStyle=COL.struct; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(X3,bD.y); ctx.lineTo(X3,bD.y1); ctx.stroke(); ctx.setLineDash([]);
        txt(ctx,'frame',X3+3,bD.y1-16,COL.struct,'10px -apple-system, sans-serif'); } }
    txt(ctx,'2 − 1/N = '+fmt(M.g20,3),bD.x1-6,bD.y1-30,COL.meas,'10px -apple-system, sans-serif','right','bottom');
    if(bD.w>280) legendAuto(ctx,bD,[[COL.meas,st.sync?'triangle (one clock)':'squared triangle (independent)'],['#3a4658',st.sync?'squared (independent clocks)':'triangle (one clock)'],[COL.live,'estimate from the series']]);
  };
  if(narrow){ g2plot(box(colX+46,top+26,colW-50,Math.max(80,fit.capY-top-60))); caption(ctx,colX,fit.capY,fit.txt,fit.capW); return; }
  const leftW=Math.min(colW*0.34,hgt*0.55);
  const bA=box(colX,top+26,leftW,Math.min(leftW,hgt*0.46));
  const bC=box(colX+46,bA.y1+56,leftW-50,Math.max(70,fit.capY-bA.y1-96));
  const rx=colX+leftW+62, rw=colW-leftW-62;
  const bB=box(rx,top+26,rw,Math.max(70,hgt*0.40-30));
  const bD=box(rx,bB.y1+60,rw,Math.max(70,fit.capY-bB.y1-94));
  /* (a) phasors at the current interval */
  frame(ctx,bA,'#242a3a');
  panelTitle(ctx,bA,'the phasor sum at this T_u word');
  const phases=phasesAt(ser,idx*SRC_SUB+SRC_SUB-1);
  /* scale: the dashed circle is the rms resultant sqrt(N) units; the chain may
     exceed it (that is the bunching) and the maximum N units is off the panel */
  const cxA=bA.x+bA.w/2, cyA=bA.y+bA.h/2, R=Math.min(bA.w,bA.h)*0.46, unit=R/(2.4*Math.sqrt(N));
  ctx.strokeStyle='#2e3546'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(cxA,cyA,unit*Math.sqrt(N),0,TAU); ctx.stroke(); ctx.setLineDash([]);
  txt(ctx,'rms |ΣE| = √N',cxA+unit*Math.sqrt(N)*0.72,cyA-unit*Math.sqrt(N)*0.72-12,COL.dim,'9.5px -apple-system, sans-serif');
  /* the carrier e^{i omega t} turns every phasor together (drawn slowly); the
     resultant's length — the intensity — does not depend on it */
  const wt=st.t*1.5;
  let px=cxA,py=cyA;
  for(let k=0;k<N;k++){ const nx=px+unit*Math.cos(phases[k]+wt), ny=py-unit*Math.sin(phases[k]+wt);
    arrow(ctx,px,py,nx,ny,COL.struct,1.2); px=nx; py=ny; }
  arrow(ctx,cxA,cyA,px,py,COL.meas,2.2);
  const Inow=((px-cxA)*(px-cxA)+(py-cyA)*(py-cyA))/(unit*unit);
  txt(ctx,'|ΣE|² = '+fmt(Inow,2)+' (mean N = '+N+')',bA.x+6,bA.y+6,COL.meas,'10.5px -apple-system, sans-serif');
  txt(ctx,'word #'+idx,bA.x1-6,bA.y1-16,COL.dim,'10px -apple-system, sans-serif','right');
  /* (c) histogram */
  const hh=M.ihist, nb=hh.h.length, imax=5;
  axes(ctx,bC,0,imax,0,1.05,{xlab:'I / ⟨I⟩',ylab:'probability density',title:'intensity histogram vs e^{−I}',ny:3,nx:5,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  for(let k=0;k<nb;k++){ const v=Math.min(1.05,hh.h[k]); if(!(v>0)) continue;
    ctx.fillStyle=rgba(COL.meas,0.55); const X0=bC.x+bC.w*(k*hh.w)/imax, X1=bC.x+bC.w*((k+1)*hh.w)/imax;
    ctx.fillRect(X0,bC.y1-bC.h*v/1.05,X1-X0-0.5,bC.h*v/1.05); }
  { const xs=[],ys=[]; for(let i=0;i<=60;i++){ const I=imax*i/60; xs.push(I); ys.push(Math.exp(-I)); }
    polyline(ctx,bC,xs,ys,0,imax,0,1.05,COL.ref,1.6,[4,3]); }
  txt(ctx,'C = √(1−1/N) = '+fmt(M.contrast,3),bC.x1-6,bC.y+6,COL.dim,'10px -apple-system, sans-serif','right');
  /* (b) the trace */
  const win=40, s0=Math.max(0,(idx-win+1))*SRC_SUB, s1=(idx+1)*SRC_SUB, ymax=Math.max(4,Math.ceil(M.g20*2.2));
  axes(ctx,bB,0,win,0,ymax,{xlab:'time (units of T_u, the last '+win+' phase words)',ylab:'I / ⟨I⟩',title:'intensity at one point of the target',nx:8,ny:4,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  { const xs=[],ys=[]; for(let s=s0;s<s1;s++){ const t=(s-s0)/SRC_SUB; xs.push(t,t+1/SRC_SUB); ys.push(ser.I[s],ser.I[s]); }
    polyline(ctx,bB,xs,ys,0,win,0,ymax,COL.meas,1.4);
    polyline(ctx,bB,[0,win],[1,1],0,win,0,ymax,COL.dim,1,[3,3]); }
  { const X0=bB.x+bB.w*(win-1)/win; ctx.fillStyle=rgba(COL.live,0.18); ctx.fillRect(X0,bB.y,bB.w/win,bB.h); }
  txt(ctx,(st.sync?'one master clock: all N jump together':'independent clocks: branches jump separately'),bB.x+6,bB.y+6,COL.dim,'10px -apple-system, sans-serif');
  /* (d) g2(tau) */
  g2plot(bD);
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the pupils — every pair of segments is a baseline            *
 * ================================================================== */
/* the pupils view's layout is ONE function so the pointer hit-test and the
   drawing use the identical frame map (a second copy would drift) */
function pupilLayout(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-84, R=M.rec, C=M.cen, narrow=colW<NARROW_W;
  const short='Pupils → segments → baselines → uv coverage; click two segments to see B_pq.';
  const fit=fitCaption(ctx,W,H,narrow?short:
    'Left: the receiver frame — '+R.tel.length+' pupils of '+st.Dmm+' mm, each binned into '
    +R.perPupil+' hexagonal segments of pitch '+fmt(R.pitch*1e3,1)+' mm; click two segments to '
    +'see their baseline B_pq = r_q − r_p. Middle: the same pupils as the camera sees them, '
    +'one relayed image per ROI (the PBS would double the row into co- and cross-pol). '
    +'Right: the uv coverage, every ±B_pq of the '+C.n+' pairs binned by position (log '
    +'shade), and the baseline-length census with the sub-aperture, speckle grain, '
    +'aperture and frame marked. '+(M.ratio>1?'The segment is WIDER than the speckle grain (ratio '
    +fmt(M.ratio,2)+'): each one averages several grains and the measured correlation drops.'
    :'The segment is narrower than the speckle grain (ratio '+fmt(M.ratio,2)+'): each one sees full contrast.'),
    short,colW,330);
  const top=stageTop()+10, hgt=fit.capY-top-14;
  const ext=st.F/2+st.Dmm/1000*0.75;
  if(narrow){ const bA=box(colX,top+26,colW,Math.max(80,fit.capY-top-44));
    return {fit,colX,colW,narrow,bA,ext,mp:worldMap(bA,-ext,ext,-ext,ext)}; }
  const leftW=Math.min(colW*0.40,hgt*0.62);
  const bA=box(colX,top+26,leftW,hgt*0.66-26);
  const bB=box(colX,bA.y1+34,leftW,Math.max(54,fit.capY-bA.y1-48));
  const rx=colX+leftW+58, rw=colW-leftW-58;
  const sq=Math.min(rw,hgt*0.62-26);
  const bC=box(rx,top+26,sq,sq);
  const bD=box(rx,bC.y1+60,rw,Math.max(54,fit.capY-bC.y1-96));
  return {fit,colX,colW,narrow,bA,bB,bC,bD,ext,mp:worldMap(bA,-ext,ext,-ext,ext)};
}
function drawPupils(ctx,W,H,M){
  const st=ST, R=M.rec, C=M.cen;
  const LY=pupilLayout(ctx,W,H,M);
  const fit=LY.fit, colX=LY.colX, bA=LY.bA, mp=LY.mp;
  /* (a) the frame */
  frame(ctx,bA,'#242a3a');
  panelTitle(ctx,bA,'the receiver frame (click two segments)');
  const hr=R.pitch/Math.sqrt(3)*mp.s;            /* hex circumradius in px */
  R.tel.forEach((c,i)=>{ ctx.strokeStyle=COL.tel[i%4]; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(mp.X(c[0]),mp.Y(c[1]),M.D/2*mp.s,0,TAU); ctx.stroke(); });
  R.segs.forEach((sg,i)=>{ const sel=(i===st.pick||i===st.pick2);
    ctx.fillStyle=sel?COL.live:shade(COL.tel[sg.tel%4],0.35);
    hexPath(ctx,mp.X(sg.x),mp.Y(sg.y),Math.max(1.2,hr*0.92)); ctx.fill(); });
  if(st.pick>=0&&st.pick2>=0){ const p=R.segs[st.pick],q=R.segs[st.pick2];
    arrow(ctx,mp.X(p.x),mp.Y(p.y),mp.X(q.x),mp.Y(q.y),COL.meas,2);
    const B=Math.hypot(q.x-p.x,q.y-p.y);
    txt(ctx,'B_pq = '+fmt(B*1e3,1)+' mm',mp.X((p.x+q.x)/2)+6,mp.Y((p.y+q.y)/2)-14,COL.meas,'10.5px -apple-system, sans-serif'); }
  else if(st.pick>=0) txt(ctx,'now click the second segment',bA.x+6,bA.y+6,COL.live,'10px -apple-system, sans-serif');
  scaleBar(ctx,mp,bA.x+8,bA.y1-10,0.1,'10 cm');
  if(LY.narrow){ caption(ctx,colX,fit.capY,fit.txt,fit.capW); return; }

    let slot=0; for(const [x,lab,col] of marks){ if(x>xhi) continue; const X2=bD.x+bD.w*x/xhi;

/* ================================================================== *
 *  view: the target — what the Fourier magnitude keeps and drops      *

const MAP_M=80;               /* cells per side for the shaded maps */
function logShade(v,lo){ return v>0?Math.max(0,Math.min(1,(Math.log10(v)-lo)/(-lo))):0; }
function drawTarget(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-84, narrow=colW<NARROW_W;
  const short='|Õ|² is translation-invariant; sampled cells, autocorrelations, and an HIO reconstruction.';
  const fit=fitCaption(ctx,W,H,narrow?short:
    'Top left: the brightness model (illustrative amplitudes, co-/cross-pol) inside the '
    +st.afs+' mm field-stop patch — it flies, and the |Õ(u,v)|² map beside it does not move: a '
    +'rigid translation only changes the Fourier phase the interferometer never sees. '
    +'Cyan cells on the map are the uv cells the '+M.cen.n+' baselines actually sample at '
    +'L = '+sigf(M.L,3)+' m (log shade over 5 decades; the finest features — legs, bars — carry '
    +'the high frequencies). Bottom: what the data determine — the true autocorrelation, the one '
    +'the sampled cells give (convolved with the coverage\'s transform), and the HIO '
    +'phase-retrieval reconstruction from the sampled magnitudes (box support + positivity; '
    +'a demonstration, not a prediction).',short,colW,340);
  const top=stageTop()+10, hgt=fit.capY-top-14;
  const us=M.uSpan;
  const mapPanel=(bB)=>{
    axes(ctx,bB,-us,us,-us,us,{xlab:'u (cycles/mm) — ±'+fmt(us,1)+' ↔ ±'+fmt(M.Bspan,2)+' m of baseline',ylab:'v (cycles/mm)',title:'|Õ(u,v)|², log10 over 5 decades · cyan = sampled',nx:4,ny:4,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    const gC=downsample(centred(M.grid,GRID_N),GRID_N,MAP_M,'max');
    cellMap(ctx,bB,gC,MAP_M,v=>shade('#d8dce6',0.12+0.88*logShade(v,-5)));
    const mC=downsample(centred(M.cov.mask,GRID_N),GRID_N,MAP_M,'max');
    cellMap(ctx,bB,mC,MAP_M,v=>rgba(COL.struct,0.55));
  };
  if(narrow){ const s=Math.min(colW-50,Math.max(80,fit.capY-top-60)); mapPanel(box(colX+46,top+26,s,s)); caption(ctx,colX,fit.capY,fit.txt,fit.capW); return; }
  const hA=Math.min(hgt*0.50,colW*0.36), sq=hA-26;
  const bA=box(colX,top+26,sq,sq);
  const bB=box(colX+sq+64,top+26,Math.min(sq,colW-sq-70),sq);
  const rowY=bA.y1+64, rowH=Math.max(60,fit.capY-rowY-36);
  const sq2=Math.min(rowH,(colW-2*56)/3);
  const bC=box(colX,rowY,sq2,sq2), bD=box(colX+sq2+56,rowY,sq2,sq2), bE=box(colX+2*(sq2+56),rowY,sq2,sq2);
  /* (a) the target */
  const ext=8;
  const mp=worldMap(bA,-ext,ext,-ext,ext);
  frame(ctx,bA,'#242a3a');
  panelTitle(ctx,bA,'the target, '+(st.chan==='co'?'co-pol':'cross-pol')+' amplitudes (mm)');
  ctx.strokeStyle=COL.dim; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(mp.X(0),mp.Y(0),st.afs/2*mp.s,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  drawPrims(ctx,mp,M.prims,COL.live,1);
  scaleBar(ctx,mp,bA.x+8,bA.y1-10,2,'2 mm');
  txt(ctx,'offset ('+fmt(M.tdx,1)+', '+fmt(M.tdy,1)+') mm · rot '+fmt(st.rot,0)+'°',bA.x+6,bA.y+6,COL.dim,'10px -apple-system, sans-serif');
  txt(ctx,'field stop '+st.afs+' mm',mp.X(0),mp.Y(-st.afs/2)+3,COL.dim,'9.5px -apple-system, sans-serif','center','top');
  /* (b) |O|^2 with coverage */
  mapPanel(bB);
  /* (c,d,e) the autocorrelations and the reconstruction */
  const acx=7;
  const drawMap=(b,arr,title,col)=>{
    axes(ctx,b,-acx,acx,-acx,acx,{xlab:'mm',title:title,nx:3,ny:3,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    if(!arr) return;
    const half=Math.round(acx/GRID_PX), n2=2*half, crop=new Float64Array(n2*n2);
    for(let j=0;j<n2;j++) for(let i=0;i<n2;i++) crop[j*n2+i]=arr[(GRID_N/2-half+j)*GRID_N+(GRID_N/2-half+i)];
    const m=50, d=downsample(crop,n2,m,'avg'); let mx=0; for(let i=0;i<d.length;i++) if(d[i]>mx) mx=d[i];
    if(mx>0) cellMap(ctx,b,d,m,v=>shade(col,0.1+0.9*Math.sqrt(Math.max(0,v/mx))));
  };
  drawMap(bC,M.acTrue,'autocorrelation — full |Õ|²',COL.meas);
  drawMap(bD,M.acDirty,'autocorrelation — sampled cells',COL.meas);
  txt(ctx,'corr with full: '+fmt(M.acCorr,3),bD.x+5,bD.y+5,COL.ref,'10px -apple-system, sans-serif');
  if(HIO_STATE&&HIO_KEY===M.hioKey){
    drawMap(bE,centred(HIO_STATE.g,GRID_N),'HIO reconstruction, iter '+HIO_STATE.iter,COL.live);
    txt(ctx,'Fourier error '+fmt(HIO_STATE.err,3),bE.x+5,bE.y+5,COL.ref,'10px -apple-system, sans-serif');
  } else {
    drawMap(bE,null,'HIO reconstruction',COL.live);
    txt(ctx,'press "reconstruct" in the panel',bE.x+bE.w/2,bE.y+bE.h/2-6,COL.dim,'10.5px -apple-system, sans-serif','center','middle');
    txt(ctx,'('+HIO_MAX+' HIO iterations, β = 0.9, box support)',bE.x+bE.w/2,bE.y+bE.h/2+10,COL.dim,'9.5px -apple-system, sans-serif','center','middle');
  }
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}

/* ================================================================== *
 *  view: the signal — frames, photons, the ceiling                    *

function drawSignal(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-84, narrow=colW<NARROW_W;
  const short='Dilution, SNR vs frames (ceiling / Gaussian / photon-limited), |V|² cuts with the noise floor.';
  const fit=fitCaption(ctx,W,H,narrow?short:
    'Left top: why the active scheme is cheap in photons — starlight\'s bunching peak '
    +'survives only τ_o/Δt ≈ 2×10⁻⁴ of a 2 ns resolution, while one engineered phase word '
    +'per frame keeps the full contrast. Left bottom: the correlation SNR against the number '
    +'of independent frames at |V|² = '+fmt(st.V2pick,2)+' — the document\'s ceiling |V|²√N '
    +'(orange), the exact Gaussian-statistics form (green), and the photon-limited form with '
    +'n̄ = '+sigf(M.nbar,3)+' e⁻ per segment per frame and σ_r = '+fmt(st.sigr,1)+' e⁻ (magenta); '
    +'orange dots are the document\'s table rows. Right: |V|² along two cuts through the '
    +'target\'s transform against baseline, raw and smeared over the '+fmt(M.dsub*1e3,1)
    +' mm sub-aperture, with the 1σ noise floor of one baseline over the '+fmt(M.nIndep,0)+' frames.',short,colW,330);
  const top=stageTop()+10, hgt=fit.capY-top-14;
  const snrPanel=(bB)=>{
    const Nlo=1,Nhi=4, ymax=Math.max(12,Math.ceil(snrCeiling(st.V2pick,10000)*1.05));
    axes(ctx,bB,Nlo,Nhi,0,ymax,{xlab:'independent frames N (log10)',ylab:'correlation SNR',title:'SNR against frames at |V|² = '+fmt(st.V2pick,2),nx:3,ny:5,xfmt:t=>'10^'+fmt(t,0),yfmt:t=>fmt(t,0)});
    { const xs=[],yc=[],yg=[],yp=[]; for(let i=0;i<=60;i++){ const lg=Nlo+(Nhi-Nlo)*i/60, N=Math.pow(10,lg); xs.push(lg);
        yc.push(snrCeiling(st.V2pick,N)); yg.push(snrGaussHF(st.V2pick,N)); yp.push(snrFrames(st.V2pick,N,M.nbar,st.sigr)); }
      polyline(ctx,bB,xs,yc,Nlo,Nhi,0,ymax,COL.ref,1.6,[5,3]);
      polyline(ctx,bB,xs,yg,Nlo,Nhi,0,ymax,COL.meas,2);
      polyline(ctx,bB,xs,yp,Nlo,Nhi,0,ymax,COL.live,2);
      polyline(ctx,bB,[Nlo,Nhi],[5,5],Nlo,Nhi,0,ymax,COL.dim,1,[2,3]); }
    for(const r of M.snrRows){ const X2=bB.x+bB.w*(Math.log10(r[2])-Nlo)/(Nhi-Nlo), Y2=bB.y1-bB.h*r[3]/ymax;
      if(Y2>=bB.y){ ctx.fillStyle=COL.ref; ctx.beginPath(); ctx.arc(X2,Y2,3,0,TAU); ctx.fill(); } }
    txt(ctx,'SNR 5',bB.x+4,bB.y1-bB.h*5/ymax-3,COL.dim,'9.5px -apple-system, sans-serif','left','bottom');
    /* the legend goes first; the N marker's label then dodges it (the audit
       caught "N = 50" under the legend in the photon-starved configuration) */
    const LG=bB.w>280?legendAuto(ctx,bB,[[COL.ref,'ceiling |V|²√N (document)'],[COL.meas,'Gaussian statistics, high flux'],[COL.live,'photon-limited, n̄ = '+sigf(M.nbar,2)+', σ_r = '+fmt(st.sigr,1)]]):null;
    { const X2=bB.x+bB.w*(Math.log10(Math.max(10,M.nIndep))-Nlo)/(Nhi-Nlo);
      ctx.strokeStyle=COL.struct; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(X2,bB.y); ctx.lineTo(X2,bB.y1); ctx.stroke(); ctx.setLineDash([]);
      let ly=bB.y+6;
      if(LG&&X2+4<LG.x1+4&&X2+60>LG.x&&ly<LG.y1) ly=LG.y1+4;
      txt(ctx,'N = '+fmt(M.nIndep,0),X2+4,ly,COL.struct,'10px -apple-system, sans-serif'); }
  };
  if(narrow){ snrPanel(box(colX+46,top+26,colW-50,Math.max(80,fit.capY-top-60))); caption(ctx,colX,fit.capY,fit.txt,fit.capW); return; }
  const leftW=colW*0.47;
  const bA=box(colX+46,top+26,leftW-46,Math.max(44,hgt*0.20));
  const bB=box(colX+46,bA.y1+60,leftW-46,Math.max(70,fit.capY-bA.y1-96));
  const rx=colX+leftW+64, rw=colW-leftW-64;
  const bC=box(rx,top+26,rw,Math.max(70,hgt*0.56));
  const bD=box(rx,bC.y1+58,rw,Math.max(44,fit.capY-bC.y1-76));
  /* (a) dilution bars, log axis */
  const lo=-5, hi=0;
  axes(ctx,bA,lo,hi,0,2,{xlab:'surviving fraction of the bunching peak (log10)',title:'the dilution',nx:5,ny:1,xfmt:t=>'10^'+fmt(t,0),yticks:[],yfmt:()=>''});
  const bars=[['starlight: τ_o/Δt = 445 fs / 2 ns',M.starDil,COL.ref],['engineered: T_u/frame',M.engDil,COL.meas]];
  bars.forEach(([lab,v,col],i)=>{ const y0=bA.y+bA.h*(0.15+0.45*i), hB=bA.h*0.28;
    const X1=bA.x+bA.w*(Math.log10(Math.max(1e-5,v))-lo)/(hi-lo);
    ctx.fillStyle=rgba(col,0.7); ctx.fillRect(bA.x,y0,Math.max(2,X1-bA.x),hB);
    txt(ctx,lab+' = '+sigf(v,2),bA.x+4,y0+hB/2,'#e9e9f0','10px -apple-system, sans-serif','left','middle'); });
  /* (b) SNR vs N */
  snrPanel(bB);
  /* (c) |V|^2 cuts — LOG y: at 25 m the 4 mm body's |V|^2 is gone within a
     centimetre of baseline and the legs' high-frequency power sits at 1e-3..1e-4,

  const cu=M.cuts, bmax=M.cen.bmax*1.02, ylo=-6, yhi=0;
  const lg=v=>Math.log10(Math.max(1e-9,v));
  axes(ctx,bC,0,bmax,ylo,yhi,{xlab:'baseline |B| (m): cuts along x and along y of the target frame',ylab:'|V|² (log10)',title:'|V|² along two cuts, raw and sub-aperture-smeared',nx:5,ny:6,xfmt:t=>fmt(t,2),yfmt:t=>'10^'+fmt(t,0)});
  { const sig=Math.sqrt(varProd(st.V2pick,M.nbar,st.sigr))/(M.nbar*M.nbar*Math.sqrt(Math.max(1,M.nIndep)));
    const ys=lg(sig), Ys=bC.y1-bC.h*(ys-ylo)/(yhi-ylo);
    if(ys>ylo&&ys<yhi){ ctx.fillStyle=rgba(COL.ref,0.16); ctx.fillRect(bC.x,Ys,bC.w,bC.y1-Ys); }
    polyline(ctx,bC,cu.B,cu.x.map(lg),0,bmax,ylo,yhi,COL.meas,1.8);
    polyline(ctx,bC,cu.B,cu.y.map(lg),0,bmax,ylo,yhi,COL.struct,1.8);
    polyline(ctx,bC,cu.B,cu.xs.map(lg),0,bmax,ylo,yhi,COL.meas,1.4,[5,3]);
    polyline(ctx,bC,cu.B,cu.ys.map(lg),0,bmax,ylo,yhi,COL.struct,1.4,[5,3]);
    /* legend first; the noise-floor label then takes the first corner of the
       floor line that the legend does not cover */
    const LG=bC.w>280?legendAuto(ctx,bC,[[COL.meas,'cut along x (raw / smeared dashed)'],[COL.struct,'cut along y (raw / smeared dashed)'],[COL.ref,'1σ noise floor, below it is unusable']]):null;
    if(ys>ylo&&ys<yhi){
      const lab='1σ of one baseline over '+fmt(M.nIndep,0)+' frames: '+sigf(sig,2), lw=lab.length*5.3;
      const cands=[[bC.x+6,Ys-4,'left','bottom'],[bC.x1-6,Ys-4,'right','bottom'],[bC.x+6,Ys+4,'left','top'],[bC.x1-6,Ys+4,'right','top']];
      if(LG) cands.push([bC.x+6,LG.y1+6,'left','top'],[bC.x1-6,LG.y1+6,'right','top'],[bC.x+6,LG.y-4,'left','bottom']);
      cands.push([bC.x+6,bC.y1-16,'left','top']);
      let pick=cands[0];
      for(const c of cands){ const x0=c[2]==='left'?c[0]:c[0]-lw, x1=x0+lw, y0=c[3]==='bottom'?c[1]-11:c[1], y1=y0+11;
        if(!LG||x1<LG.x||x0>LG.x1||y1<LG.y||y0>LG.y1){ pick=c; break; } }
      txt(ctx,lab,pick[0],pick[1],COL.ref,'10px -apple-system, sans-serif',pick[2],pick[3]); } }
  /* (d) the document's table */
  frame(ctx,bD,'#242a3a');
  panelTitle(ctx,bD,'the document\'s frame-count table at |V|² = '+fmt(st.V2pick,2));
  const cols=['acquisition','camera','frames N','ceiling','Gaussian','n̄ = '+sigf(M.nbar,2)];
  const cw=bD.w/cols.length, rh=Math.min(16,(bD.h-6)/(M.snrRows.length+1));
  if(bD.w>300){
    cols.forEach((c,i)=>txt(ctx,c,bD.x+cw*(i+0.5),bD.y+4,COL.dim,'9.5px -apple-system, sans-serif','center'));

      vals.forEach((v,i)=>txt(ctx,v,bD.x+cw*(i+0.5),y,i>=3?(i===3?COL.ref:(i===4?COL.meas:COL.live)):'#cfd4de','10px -apple-system, sans-serif','center')); });
  } else txt(ctx,'table needs a wider stage',bD.x+6,bD.y+6,COL.dim,'10px -apple-system, sans-serif');
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);

/* ================================================================== *

function drawTelescope(ctx,W,H,M){

    :'a uniform stellar disc of '+fmt(st.thmas,1)+' mas at 450 nm, the Narrabri measurement, with its first zero at 3.8317 λ/(πθ) = '+fmt(Hh.zeroB,1)+' m')+'.',short,colW,340);
  const top=stageTop()+10, hgt=fit.capY-top-14;
  const uvPanel=(bC)=>{
    const uvr=12.5;
    axes(ctx,bC,uvr,-uvr,-uvr,uvr,{xlab:'uλ (m), east to the left',ylab:'vλ (m)',title:'γ Cas from VERITAS, ±'+st.hrange+' h',nx:5,ny:5,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    { const pa=GAMCAS.paDeg*PI/180, cx=bC.x+bC.w/2, cy=bC.y+bC.h/2, wdt=bC.w*0.07;
      for(const [ang,col] of [[pa,'#5a7fd0'],[pa+PI/2,'#d06070']]){
