function drawView(ctx,W,H,M){
  LEGEND_RECTS=[];
  POLY_SEGS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='bench') drawBench(ctx,W,H,M);
  else if(M.view==='source') drawSource(ctx,W,H,M);
  else if(M.view==='pupils') drawPupils(ctx,W,H,M);
  else if(M.view==='target') drawTarget(ctx,W,H,M);
  else if(M.view==='signal') drawSignal(ctx,W,H,M);
  else if(M.view==='telescope') drawTelescope(ctx,W,H,M);
  else drawReplication(ctx,W,H,M);
}
/* ================================================================== *
 *  view: the replication — simulate the whole chain, does c → |V|²?   *
 * ================================================================== */
function drawReplication(ctx,W,H,M){
  const st=ST, colX=56, colW=W-RO_W-84, narrow=colW<NARROW_W;
  const R=M.repState, pr=M.repPairs, nf=R?R.acc.nf:0;
  const c=(R&&nf>0)?repAccEstimate(R.acc):null;
  const short='Whole chain from scratch; does the recovered ĉ track the true |V|²?';
  const fit=fitCaption(ctx,W,H,narrow?short:
    'A first-principles Monte Carlo of the entire measurement chain — a rough-surfaced '
    +(st.target==='usaf'?'resolution target':st.target)+' lit by '+st.Nbr+' random-phase 785 nm branches, the return speckle sampled '
    +'by '+M.repIdx.length+' point detectors on the receiver row, photon-counted '
    +'('+(st.repPh?'n̄ = '+st.repPh+' e⁻/detector/frame':'ideal photons')+') — and the '
    +'estimator ĉ_pq = ⟨Δn_p Δn_q⟩/(n̄_p n̄_q) compared with the TRUE |V(B/λL)|². '
    +(st.repMode==='jitter'
      ?'A new rough surface every frame (attitude jitter): ĉ converges to |V|² and the '
       +'scatter falls as 1/√N_f — it works in principle.'
      :'A frozen speckle (a perfectly rigid static target): ĉ saturates near (1−1/N)|V|² with a '
       +'speckle noise ~|V|/√N that more frames cannot remove — a static target needs many N '
       +'or many source patterns, not many frames.')
    +' Press run and watch it accumulate.',short,colW,340);
  const top=stageTop()+10, hgt=fit.capY-top-14;
  /* the money plot: ĉ vs baseline against |V|^2, log y */
  const scatterPanel=(b)=>{
    const bmax=pr.B[pr.B.length-1]*1.03, ylo=-6, yhi=0.3, lg=v=>Math.log10(Math.max(1e-9,v));
    axes(ctx,b,0,bmax,ylo,yhi,{xlab:'baseline B = (ξ_q − ξ_p) (m)',ylab:'squared visibility (log10)',
      title:'recovered ĉ vs the true |V|²'+(nf?'  ('+nf+' frames)':''),nx:5,ny:6,xfmt:t=>fmt(t,2),yfmt:t=>'10^'+fmt(t,0)});
    /* truth as a line (sorted by baseline) and the 1-1/N reference for static */
    const ord=pr.B.map((v,i)=>i).sort((p,q)=>pr.B[p]-pr.B[q]);
    const bx=ord.map(i=>pr.B[i]), vy=ord.map(i=>lg(pr.V2[i]));
    polyline(ctx,b,bx,vy,0,bmax,ylo,yhi,COL.ref,1.6);
    if(st.repMode==='static'){ const f=(1-1/st.Nbr);
      polyline(ctx,b,bx,ord.map(i=>lg(f*pr.V2[i])),0,bmax,ylo,yhi,'#7a5a2a',1.2,[4,3]); }
    if(c) for(let k=0;k<pr.B.length;k++){ const X=b.x+b.w*pr.B[k]/bmax, Y=b.y1-b.h*(lg(c[k])-ylo)/(yhi-ylo);
      if(Y>=b.y-2&&Y<=b.y1+2&&c[k]>0){ ctx.fillStyle=COL.meas; ctx.beginPath(); ctx.arc(X,Y,2.3,0,TAU); ctx.fill(); } }
    if(b.w>280) legendAuto(ctx,b,[[COL.meas,'recovered ĉ (this run)'],[COL.ref,'true |V|²']].concat(st.repMode==='static'?[['#7a5a2a','(1−1/N)|V|²']]:[]));
    if(!nf) txt(ctx,'press run',b.x+b.w/2,b.y+b.h*0.32,COL.dim,'11px -apple-system, sans-serif','center','middle');
  };
  if(narrow){ scatterPanel(box(colX+46,top+26,colW-50,Math.max(80,fit.capY-top-60))); caption(ctx,colX,fit.capY,fit.txt,fit.capW); return; }
  const leftW=Math.min(colW*0.34,hgt*0.52);
  const bA=box(colX,top+26,leftW,leftW*0.9);
  const bC=box(colX,bA.y1+42,leftW,Math.max(58,fit.capY-bA.y1-80));
  const bB=box(colX+leftW+58,top+26,colW-leftW-58,Math.max(90,fit.capY-top-60));
  /* (a) the rough target + detector row */
  const ext=st.afs*0.6;
  const mp=worldMap(bA,-ext,ext,-ext,ext);
  frame(ctx,bA,'#242a3a'); panelTitle(ctx,bA,'the rough target ('+(st.repMode==='jitter'?'renewing':'frozen')+')');
  { const rn=REP.n, O=M.repO, mm=REP.pt*1e3, cell=Math.max(1,bA.w/(2*ext/mm)*REP.pt*1e3/1);
    const half=Math.round(ext/(REP.pt*1e3)); const stepx=Math.max(1,Math.round(half*2/70));
    for(let j=-half;j<half;j+=stepx) for(let i=-half;i<half;i+=stepx){ const o=O[(j+rn/2)*rn+(i+rn/2)]; if(!(o>0)) continue;
      ctx.fillStyle=shade(COL.live,0.3+0.7*Math.min(1,o)); ctx.fillRect(mp.X(i*mm),mp.Y((j+stepx)*mm),Math.abs(mp.X(stepx*mm)-mp.X(0))+0.6,Math.abs(mp.Y(stepx*mm)-mp.Y(0))+0.6); } }
  ctx.strokeStyle=COL.dim; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(mp.X(0),mp.Y(0),st.afs/2*mp.s,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  scaleBar(ctx,mp,bA.x+8,bA.y1-10,1,'1 mm');
  txt(ctx,'sqrt(brightness) × random phase / pixel',bA.x+6,bA.y+6,COL.dim,'9.5px -apple-system, sans-serif');
  /* (c) the convergence ratio */
  frame(ctx,bC,'#242a3a'); panelTitle(ctx,bC,'⟨ĉ / |V|²⟩ as frames accumulate');
  if(R){ const hist=R.hist||[];
    const expect=st.repMode==='jitter'?1:(1-1/st.Nbr);
    axes(ctx,bC,0,REP_CAP,0,1.4,{xlab:'frames',ylab:'⟨ĉ/|V|²⟩',nx:4,ny:4,xfmt:t=>fmt(t/1000,1)+'k',yfmt:t=>fmt(t,1)});
    polyline(ctx,bC,[0,REP_CAP],[expect,expect],0,REP_CAP,0,1.4,COL.ref,1.2,[4,3]);
    if(hist.length>1) polyline(ctx,bC,hist.map(h=>h[0]),hist.map(h=>h[1]),0,REP_CAP,0,1.4,COL.meas,1.8);
    txt(ctx,st.repMode==='jitter'?'→ 1 (full |V|² recovered)':'→ 1 − 1/N = '+fmt(expect,3),bC.x+6,bC.y+6,COL.ref,'10px -apple-system, sans-serif');
  } else txt(ctx,'press run',bC.x+bC.w/2,bC.y+bC.h/2,COL.dim,'11px -apple-system, sans-serif','center','middle');
  /* (b) the money plot */
  scatterPanel(bB);
  caption(ctx,colX,fit.capY,fit.txt,fit.capW);
}
function pickSegment(M,wx,wy){
  const R=M.rec; let best=-1,bd=Infinity;
  R.segs.forEach((sg,i)=>{ const d=Math.hypot(sg.x-wx,sg.y-wy); if(d<bd){ bd=d; best=i; } });
  return bd<=R.pitch*0.75?best:-1;
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){
    const ctx=canvas.getContext('2d');
    drawView(ctx,S.W,S.H,buildModel());
  };
  S.step=function(){
    let did=false;
    if(ST.anim){ ST.t+=0.016*ST.speed*rateFor(ST.view); did=true; }
    if(ST.hio&&ST.view==='target'){
      const M=buildModel();
      if(!HIO_STATE||HIO_KEY!==M.hioKey){
        /* magnitudes are enforced only on the SAMPLED uv cells (M.cov.mask);
           the unsampled ones are unknown and left free */
        const n=GRID_N, mag=new Float64Array(n*n), supp=new Uint8Array(n*n);
        for(let i=0;i<n*n;i++) mag[i]=Math.sqrt(M.grid[i]);
        for(let j=0;j<n;j++) for(let i=0;i<n;i++){ const x=((i<n/2)?i:i-n)*GRID_PX, y=((j<n/2)?j:j-n)*GRID_PX;
          if(Math.abs(x)<=7&&Math.abs(y)<=6) supp[j*n+i]=1; }
        HIO_STATE=hioInit(mag,supp,n,1,M.cov.mask); HIO_KEY=M.hioKey;
      }
      if(HIO_STATE.iter<HIO_MAX){ hioStep(HIO_STATE,HIO_PER_FRAME,0.9,HIO_STATE.iter>=HIO_MAX-20); did=true; }
      else ST.hio=false;
    }
    if(ST.view==='rep'&&ST.anim){
      const M=buildModel(), key=M.repKey+'|'+ST.repPh;
      if(!REP_STATE||REP_KEY!==key){
        const rn=REP.n, idx=M.repIdx;
        REP_STATE={acc:repAccInit(idx.length),rnd:lcg32(12345+ST.Nbr),hist:[],
          a:ST.repMode==='static'?repBranchFields(repRough(M.repO,rn,lcg32(777)),M.repTilts,rn,idx):null};
        REP_KEY=key;
      }
      if(REP_STATE.acc.nf<REP_CAP){
        const rn=REP.n, idx=M.repIdx, rnd=REP_STATE.rnd;
        for(let b=0;b<REP_BATCH;b++){
          const I=ST.repMode==='static'?repFrameStatic(REP_STATE.a,ST.Nbr,idx.length,rnd)
                                       :repFrameJitter(M.repO,M.repTilts,rn,idx,rnd);
          let m=0; for(const v of I) m+=v; m/=I.length;
          const nb=ST.repPh;
          if(nb){ const cn=new Float64Array(I.length);
            for(let q=0;q<I.length;q++) cn[q]=poisson(nb*I[q]/m,rnd)+1.5*gaussRnd(rnd);
            repAccAdd(REP_STATE.acc,cn); }
          else repAccAdd(REP_STATE.acc,I);
        }
        /* record the running mean ratio over |V|^2 > 0.05 for the convergence panel */
        { const c=repAccEstimate(REP_STATE.acc), pr=M.repPairs; let num=0,cnt=0;
          for(let k=0;k<pr.B.length;k++) if(pr.V2[k]>0.05){ num+=c[k]/pr.V2[k]; cnt++; }
          REP_STATE.hist.push([REP_STATE.acc.nf,cnt?num/cnt:0]); }
        did=true;
      }
    }
    return did;
  };
  /* pointer: in the pupils view a click picks a segment (first p, then q, then clears) */
  S.pointer=function(kind,x,y){
    if(kind!=='down'||ST.view!=='pupils') return false;
    const M=buildModel(), mp=pupilLayout(canvas.getContext('2d'),S.W,S.H,M).mp;
    const i=pickSegment(M,mp.inX(x),mp.inY(y));
    if(i<0) return false;
    if(ST.pick<0) ST.pick=i;
    else if(ST.pick2<0&&i!==ST.pick) ST.pick2=i;
    else { ST.pick=i; ST.pick2=-1; }
    return true;
  };
  return S;
}
/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k; st.t=0;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===k?'active':'');
    syncChips(); syncPanel(); refresh();
  }
  TABS.forEach(([k,lab])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',
      onclick:()=>setView(k)},lab));
  });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;

  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{

        [].forEach.call(wrapEl.children,(b,i)=>
          b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }
  const clearPicks=()=>{ st.pick=-1; st.pick2=-1; };
  const stopHio=()=>{ st.hio=false; };

  const gGeo=h('div',{class:'grp'},h('h3',null,'the design point'));
  gGeo.appendChild(slider('L','range L (m)',20,30,0.5,v=>fmt(v,1)+' m'));
  const lamChips=chipRow(LAMBDAS,'lamnm',null); gGeo.appendChild(lamChips); trackChips(gGeo,LAMBDAS,'lamnm');
  gGeo.appendChild(slider('afs','field-stop patch',4,20,1,v=>fmt(v,0)+' mm'));
  const geoTag=h('div',{class:'tag'}); gGeo.appendChild(geoTag);

  const gSrc=h('div',{class:'grp'},h('h3',null,'the source'));
  gSrc.appendChild(slider('Nbr','branches N',2,16,1,v=>fmt(v,0)));
  gSrc.appendChild(slider('Tu','update T_u',2,100,1,v=>fmt(v,0)+' µs'));
  gSrc.appendChild(h('div',{class:'checks'},checkbox('sync','one master clock for all branches')));
  const srcTag=h('div',{class:'tag'}); gSrc.appendChild(srcTag);

  const gRec=h('div',{class:'grp'},h('h3',null,'the receiver'));
  const layChips=chipRow(LAYOUTS,'layout',clearPicks); gRec.appendChild(layChips); trackChips(gRec,LAYOUTS,'layout');
  gRec.appendChild(slider('F','frame F (max spacing)',0.10,0.35,0.01,v=>fmt(v,2)+' m',clearPicks));
  gRec.appendChild(slider('Dmm','aperture D (assumed)',25,100,5,v=>fmt(v,0)+' mm',clearPicks));
  const ringChips=chipRow(RINGSEL,'rings',clearPicks); gRec.appendChild(ringChips); trackChips(gRec,RINGSEL,'rings');
  const pickBtn=h('div',{class:'btnrow'},h('button',{onclick:()=>{ clearPicks(); refresh(); }},'clear picked pair'));
  gRec.appendChild(pickBtn);
  const recTag=h('div',{class:'tag'}); gRec.appendChild(recTag);

  const gTgt=h('div',{class:'grp'},h('h3',null,'the target'));
  const tgtChips=chipRow(TARGETS,'target',stopHio); gTgt.appendChild(tgtChips); trackChips(gTgt,TARGETS,'target');
  const chanChips=chipRow(CHANS,'chan',stopHio); gTgt.appendChild(chanChips); trackChips(gTgt,CHANS,'chan');
  gTgt.appendChild(slider('rot','rotation',0,180,5,v=>fmt(v,0)+'°',stopHio));
  gTgt.appendChild(slider('tdx','offset x',-3,3,0.1,v=>fmt(v,1)+' mm'));
  gTgt.appendChild(slider('tdy','offset y',-3,3,0.1,v=>fmt(v,1)+' mm'));
  gTgt.appendChild(h('div',{class:'checks'},checkbox('fly','the target flies (translation)')));
  gTgt.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ HIO_STATE=null; HIO_KEY=''; st.hio=true; dirty=true; refresh(); }},'reconstruct (HIO)'),
    h('button',{onclick:()=>{ st.hio=false; refresh(); }},'stop')));
  const tgtTag=h('div',{class:'tag'}); gTgt.appendChild(tgtTag);

  const gSig=h('div',{class:'grp'},h('h3',null,'the signal'));
  gSig.appendChild(slider('Nfr','frames N',50,5000,10,v=>fmt(v,0)));
  const fpsChips=chipRow(KFPS,'kfps',null); gSig.appendChild(fpsChips); trackChips(gSig,KFPS,'kfps');
  gSig.appendChild(slider('V2pick','|V|² of interest',0.05,1,0.05,v=>fmt(v,2)));
  gSig.appendChild(slider('Pt','power on target',0.05,5,0.05,v=>fmt(v,2)+' W'));
  gSig.appendChild(slider('wbeam','beam radius',0.05,0.3,0.01,v=>fmt(v,2)+' m'));
  gSig.appendChild(slider('Am','reflective area',1,20,0.5,v=>fmt(v,1)+' mm²'));
  gSig.appendChild(slider('rho','albedo',0.05,1,0.05,v=>fmt(v,2)));
  gSig.appendChild(slider('eta','QE × optics',0.05,0.8,0.05,v=>fmt(v,2)));
  gSig.appendChild(slider('sigr','read noise',0,5,0.5,v=>fmt(v,1)+' e⁻'));
  const sigTag=h('div',{class:'tag'}); gSig.appendChild(sigTag);

  const resetRep=()=>{ REP_STATE=null; REP_KEY=''; };
  const gRep=h('div',{class:'grp'},h('h3',null,'the replication'));
  const repModeChips=chipRow(REPMODES,'repMode',resetRep); gRep.appendChild(repModeChips); trackChips(gRep,REPMODES,'repMode');
  const repPhChips=chipRow(REPPH,'repPh',resetRep); gRep.appendChild(repPhChips); trackChips(gRep,REPPH,'repPh');
  gRep.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ resetRep(); st.anim=true; dirty=true; syncPanel(); refresh(); }},'run the simulation'),
    h('button',{onclick:()=>{ resetRep(); dirty=true; refresh(); }},'reset')));
  const repTag=h('div',{class:'tag'}); gRep.appendChild(repTag);

  const gHer=h('div',{class:'grp'},h('h3',null,'the telescope'));
  const starChips=chipRow(STARSEL,'star',null); gHer.appendChild(starChips); trackChips(gHer,STARSEL,'star');
  gHer.appendChild(slider('thmas','disc diameter θ',1,10,0.1,v=>fmt(v,1)+' mas'));
  gHer.appendChild(slider('hrange','hour-angle range ±',1,4,0.5,v=>fmt(v,1)+' h'));
  gHer.appendChild(h('div',{class:'checks'},checkbox('showPaper','show the paper\'s Fig. 7 curve')));
  const herTag=h('div',{class:'tag'}); gHer.appendChild(herTag);

  const gRun=h('div',{class:'grp'},h('h3',null,'the run'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('anim','time runs')));
  gRun.appendChild(slider('speed','speed',0.1,4,0.1,v=>fmt(v,1)+'×'));
  gRun.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ st.t=0; dirty=true; refresh(); }},'restart clock'),
    h('button',{onclick:()=>{ const v=st.view;
      Object.assign(st,DEFAULTS); st.view=v; st.t=0; HIO_STATE=null; HIO_KEY=''; REP_STATE=null; REP_KEY='';
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Concept: projects/pupil_plane/ technical concept summary '
      +'(Aug 2026). Papers: Matthews, Gori &amp; Vakili MNRAS 538, 867 (2025); Liu et al. '
      +'PRL 134, 180201 (2025); Dravins et al. New Astron. Rev. 56, 143 (2012); Malvimat, '
      +'Wucknitz &amp; Saha MNRAS 437, 798 (2014). Every closed form is mirrored in '
      +'build_pupil/derive.py and pinned in selfTest; illustrative inputs are labelled.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics & math'),h('div',{id:'phys'}));
  [gGeo,gSrc,gRec,gTgt,gSig,gHer,gRep,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++)
          if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>
            b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  function syncPanel(){
    const v=st.view;
    gGeo.hidden=!(v==='bench'||v==='pupils'||v==='target'||v==='signal');
    gSrc.hidden=!(v==='source'||v==='bench'||v==='signal');
    gRec.hidden=!(v==='bench'||v==='pupils'||v==='target'||v==='signal');
    gTgt.hidden=(v!=='target');
    gSig.hidden=(v!=='signal'&&v!=='bench');
    gHer.hidden=(v!=='telescope');
    gRep.hidden=(v!=='rep');
    pickBtn.hidden=(v!=='pupils');
    rows.thmas.row.hidden=(st.star!=='disc');
    rows.V2pick.row.hidden=(v!=='signal');
    for(const k of ['Pt','wbeam','Am','rho','eta','sigr']) rows[k].row.hidden=(v!=='signal');
    for(const k in rows) rows[k].sync();
    geoTag.innerHTML='δx ≈ 1.22λL/B: the range scales every length in the uv plane';
    srcTag.innerHTML=st.sync?'one clock: g²(τ)−1 is a TRIANGLE, 1/e at 0.632 T_u'
                            :'independent clocks: squared triangle, 1/e at 0.393 T_u';
    recTag.innerHTML=v==='pupils'?'click two segments on the frame to see their baseline'
                                 :'segments per pupil: 19 / 61 / 127 / 217 hexagons';
    tgtTag.innerHTML='amplitudes are illustrative; translation leaves |Õ|² unchanged, rotation does not';
    sigTag.innerHTML='radiometric inputs are ASSUMED — the document says to measure them';
    herTag.innerHTML='the 2P2I paper\'s numbers; the dish is VERITAS-like, f = D = 12 m';
    repTag.innerHTML=st.repMode==='jitter'?'a renewing target: the estimate should converge to |V|²'
                                          :'a frozen target: watch the speckle noise that frames cannot remove';
    runTag.innerHTML='space runs/pauses &nbsp; <b>r</b> restarts the clock &nbsp; 1–7 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='pupils'
        ?'click two segments to pick a baseline · space pauses · 1–7 switch views'
        :(st.view==='target'?'the target flies while time runs · reconstruct in the panel · 1–7 switch views'
        :(st.view==='rep'?'press run · watch ĉ converge to the true |V|² · 1–7 switch views'
        :'space runs · r restarts the clock · 1–7 switch views'));
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.anim=!st.anim; syncPanel(); refresh(); }
    else if(e.key==='r'){ st.t=0; dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });
  canvas.addEventListener('pointerdown',e=>{
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        /* the readout follows the clock every tenth frame, and every frame
           while a reconstruction is iterating (its numbers change per frame) */
        if(advanced&&(frameN%10===0||(st.view==='target'&&HIO_STATE)||st.view==='rep')) roEl.innerHTML=readoutHTML(S.model());
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* the physics-and-math column: numbered equations per view, CSS-set */
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function SQ(x){ return '<span class="rad">√</span><span class="sqrt">'+x+'</span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const DERIV={
  bench:'<h4>the design relation</h4>'
    +'<p>A baseline <i>B</i> at range <i>L</i> samples the object-plane spatial frequency '
    +'<i>u</i> = <i>B</i>/(λ<i>L</i>); the Rayleigh-style scale that the longest baseline sets is</p>'
    +EQ(1,'δ<i>x</i> ≈ 1.22 λ<i>L</i>/<i>B</i> &nbsp;⇔&nbsp; <i>B</i> ≈ 1.22 λ<i>L</i>/δ<i>x</i>')
    +'<p>With λ = 785 nm and δ<i>x</i> = 0.1 mm: <b>0.1915 m</b> at 20 m, <b>0.2394 m</b> at 25 m, '
    +'<b>0.2873 m</b> at 30 m — the document\'s table, reproduced to four digits. A 0.30–0.35 m '
    +'frame holds the longest baseline plus margin. One telescope alone resolves 1.22 λ<i>L</i>/<i>D</i> '
    +'(0.48 mm for 50 mm at 25 m), so the synthetic aperture gains the ratio <i>B</i><sub>max</sub>/<i>D</i>.</p>'
    +'<div class="cite">concept document §2; Liu et al. use the same 1.22 λL/B: 2.03 mm at 1.36 km with B = 0.87 m against 41.5 mm for one 42.5 mm telescope</div>'
    +'<h4>the three lengths every sampled plane has</h4>'
    +EQ(2,'<i>u</i><sub>max</sub> = <i>B</i><sub>max</sub>/(λ<i>L</i>), &nbsp; '
      +'<i>u</i><sub>min</sub> = <i>d</i><sub>sub</sub>/(λ<i>L</i>), &nbsp; '
      +'grain = λ<i>L</i>/<i>a</i><sub>fs</sub>')
    +'<p>Finest nominal scale 1.22 λ<i>L</i>/<i>B</i><sub>max</sub>; the shortest baseline is the segment pitch, so '
    +'structure larger than λ<i>L</i>/<i>d</i><sub>sub</sub> is only seen through the zero-baseline total; and the '
    +'return speckle from the field-stop patch of size <i>a</i><sub>fs</sub> has grains λ<i>L</i>/<i>a</i><sub>fs</sub> '
    +'at the receiver — a segment wider than a grain averages several and loses contrast (the pupils view computes how much).</p>'
    +'<h4>why intensities, and why phase does not matter</h4>'
    +EQ(3,'<i>g</i><sup>(2)</sup><sub>pq</sub>(τ) = '+FR('⟨<i>I</i><sub>p</sub>(<i>t</i>) <i>I</i><sub>q</sub>(<i>t</i>+τ)⟩','⟨<i>I</i><sub>p</sub>⟩⟨<i>I</i><sub>q</sub>⟩')
      +' = 1 + |<i>g</i><sup>(1)</sup><sub>pq</sub>(τ)|² &nbsp;<span class="rm">(Siegert, chaotic light)</span>')
    +EQ(4,'<i>g</i><sup>(1)</sup><sub>pq</sub> = <i>V</i>(<i>u</i>,<i>v</i>) = '+FR('∫ρ(<b>x</b>) <i>e</i><sup>−2π<i>i</i> <b>u</b>·<b>x</b></sup> d²<i>x</i>','∫ρ(<b>x</b>) d²<i>x</i>')
      +', &nbsp; <b>u</b> = <b>B</b><sub>pq</sub>/(λ<i>L</i>) &nbsp;<span class="rm">(van Cittert–Zernike)</span>')
    +EQ(5,'<i>g</i><sup>(1)</sup><sub>pq</sub> = |<i>g</i><sup>(1)</sup><sub>pq</sub>| <i>e</i><sup><i>i</i>φ<sub>pq</sub></sup> &nbsp;⇒&nbsp; |<i>g</i><sup>(1)</sup><sub>pq</sub>|² does not depend on φ<sub>pq</sub>')
    +'<p>A telescope-to-telescope piston multiplies the first-order coherence by a phase the squared magnitude '
    +'removes, so no sub-wavelength path matching is needed: Δ<i>t</i> = Δ<i>L</i>/<i>c</i> puts a 1 m relay '
    +'mismatch at 3.3 ns, far inside a 1–10 µs engineered correlation time. In the Fresnel regime the '
    +'van Cittert–Zernike integral carries a phase π(|<b>r</b>₁|² − |<b>r</b>₂|²)/(λ<i>L</i>) that also cancels '
    +'in |<i>V</i>|²; the whole target\'s far-field distance <i>a</i>²/λ = 127 m (10 mm at 785 nm) is '
    +'therefore not required, and the dropped quartic term varies by only '
    +'<i>k r</i>³<i>a</i>/(2<i>L</i>³) = 8.6 mrad across the target at <i>r</i> = 0.15 m.</p>'
    +'<div class="cite">document §1, §10; Dravins eqs 3–9; Matthews eqs 1–2; Malvimat eq 4 (G₂ = G₁₁G₂₂ + |G₁₂|²)</div>',
  source:'<h4>the phasor sum</h4>'
    +EQ(1,'<i>E</i>(<i>t</i>) = Σ<sub>k=1..N</sub> <i>A</i> <i>e</i><sup><i>i</i>[ω<i>t</i> + φ<sub>k</sub>(<i>t</i>)]</sup>, &nbsp; φ<sub>k</sub> ~ U(0, 2π), a new word every <i>T</i><sub>u</sub>')
    +EQ(2,'<i>I</i> = |<i>E</i>|² = <i>N A</i>² + <i>A</i>² Σ<sub>j≠k</sub> <i>e</i><sup><i>i</i>(φ<sub>j</sub>−φ<sub>k</sub>)</sup>, &nbsp; ⟨<i>I</i>⟩ = <i>N A</i>²')
    +'<p>The fourth moment keeps only the pairings (j=k, l=m) and (j=m, k=l):</p>'
    +EQ(3,'⟨<i>I</i>²⟩ = <i>A</i>⁴ [<i>N</i>² + <i>N</i>(<i>N</i>−1)] &nbsp;⇒&nbsp; <i>g</i><sup>(2)</sup>(0) = 2 − 1/<i>N</i>, &nbsp; '
      +'contrast '+SQ('1 − 1/<i>N</i>'))
    +'<p>N = 2 gives 1.5 (a two-beam fringe swept at random), N = 8 gives 1.875, N → ∞ the thermal 2 '
    +'with an exponential intensity histogram. Monte-Carlo checked to 10⁻⁴ in derive.py.</p>'
    +'<h4>the time correlation — two cases</h4>'
    +EQ(4,'<i>g</i><sup>(1)</sup>(τ) = '+FR('1','<i>N</i>')+' Σ<sub>k</sub> ⟨<i>e</i><sup><i>i</i>[φ<sub>k</sub>(<i>t</i>)−φ<sub>k</sub>(<i>t</i>+τ)]</sup>⟩ = 1 − |τ|/<i>T</i><sub>u</sub> &nbsp;<span class="rm">(|τ| &lt; <i>T</i><sub>u</sub>)</span>')
    +'<p>— the probability that a word is unchanged across the lag. For the <b>intensity</b> correlation the '
    +'pair term needs branches j AND k unchanged:</p>'
    +EQ(5,'<span class="rm">one master clock:</span> &nbsp; <i>I</i>(<i>t</i>) piecewise constant ⇒ ⟨<i>I</i>(<i>t</i>)<i>I</i>(<i>t</i>+τ)⟩ = <i>p</i>⟨<i>I</i>²⟩ + (1−<i>p</i>)⟨<i>I</i>⟩², '
      +'<i>p</i> = 1 − |τ|/<i>T</i><sub>u</sub>')
    +EQ(6,'<i>g</i><sup>(2)</sup>(τ) − 1 = (1 − 1/<i>N</i>)(1 − |τ|/<i>T</i><sub>u</sub>) &nbsp;<span class="rm">triangle, 1/e at (1 − e<sup>−1</sup>)<i>T</i><sub>u</sub> = <b>0.632 <i>T</i><sub>u</sub></b></span>')
    +EQ(7,'<span class="rm">independent clocks:</span> &nbsp; <i>g</i><sup>(2)</sup>(τ) − 1 = (1 − 1/<i>N</i>)(1 − |τ|/<i>T</i><sub>u</sub>)² &nbsp;<span class="rm">squared triangle, 1/e at (1 − e<sup>−1/2</sup>)<i>T</i><sub>u</sub> = <b>0.393 <i>T</i><sub>u</sub></b></span>')
    +'<p>The document quotes [7] ("approximately triangular in first-order coherence and squared-triangular in '
    +'intensity correlation"); that is Siegert\'s |<i>g</i><sup>(1)</sup>|², exact for a Gaussian field, and it is '
    +'also what independent per-branch clocks give. Its own architecture — one FPGA clock driving every '
    +'modulator — gives [6] instead, because all branches jump together. Both are Monte-Carlo checked here '
    +'(the magenta dots on the plot are the estimate from the drawn series). Operationally the document is '
    +'right that the label does not matter: one frame per <i>T</i><sub>u</sub> is one independent realisation, '
    +'<i>T</i><sub>acq</sub>/<i>T</i><sub>u</sub> of them per acquisition.</p>'
    +'<h4>finite-n illumination (Liu et al.)</h4>'
    +EQ(8,'⟨<i>c</i><sup>(2)</sup><sub>ab</sub>⟩<sub>e</sub> = <i>c</i>₀ + <i>c</i>₁ |<i>f</i>(<b>k</b><sub>a</sub> − <b>k</b><sub>b</sub>)|², &nbsp; <i>c</i>₀ = <i>c</i>/<i>n</i>, &nbsp; <i>c</i>₁ = (<i>n</i> − 1 + <i>c</i>)/<i>n</i>')
    +'<p>— their ensemble-averaged correlation for n phase-independent emitters with autocorrelation coefficient c '
    +'(memory effect ignored); the speckle-like noise falls as 1/√n, and n → ∞ recovers classical HBT. Cited, not '
    +'re-derived here; their double-slit fit gave c₀ = 0.160, c₁ = 0.625 for n = 8.</p>'
    +'<div class="cite">document §3.1–3.2; Liu et al. eqs 1–3 and Fig. 3; Dravins §2 (chaotic = Gaussian field; a laser alone shows no bunching)</div>',
  pupils:'<h4>coordinates and baselines</h4>'
    +EQ(1,'<b>r</b><sub>p</sub> = <b>c</b><sub>tel(p)</sub> + <b>s</b><sub>p</sub>, &nbsp; <b>B</b><sub>pq</sub> = <b>r</b><sub>q</sub> − <b>r</b><sub>p</sub>, &nbsp; (<i>u</i>,<i>v</i>)<sub>pq</sub> = <b>B</b><sub>pq</sub>/λ')
    +EQ(2,'<i>D</i><sub>pupil,image</sub> = <i>M</i><sub>p</sub> <i>D</i><sub>tel</sub>, &nbsp; <i>M</i><sub>p</sub> = <i>f</i><sub>p,2</sub>/<i>f</i><sub>p,1</sub> &nbsp;<span class="rm">(4f relay: pupil → L1 → Fourier plane → L2 → sensor)</span>')
    +'<p>The camera images pupils, not the mosquito: each segment is a time series with a known receiver location. '
    +'A hexagonal binning with <i>r</i> rings holds 3<i>r</i>² + 3<i>r</i> + 1 segments (19, 61, 127, 217), so '
    +'<i>S</i> = <i>n</i><sub>tel</sub>(3<i>r</i>² + 3<i>r</i> + 1) segments give <i>S</i>(<i>S</i>−1)/2 pairs — '
    +'128 778 for four pupils of 127 — of which the hexagonal lattice repeats many vectors: redundant baselines '
    +'average the noise down by √multiplicity but add no coverage.</p>'
    +'<h4>what a finite segment measures</h4>'
    +'<p>Integrating the speckle intensity over two segments of area <i>A</i><sub>p</sub>, <i>A</i><sub>q</sub>:</p>'
    +EQ(3,FR('⟨Δ<i>I</i><sub>p</sub> Δ<i>I</i><sub>q</sub>⟩','⟨<i>I</i><sub>p</sub>⟩⟨<i>I</i><sub>q</sub>⟩')+' = '+FR('1','<i>A</i><sub>p</sub><i>A</i><sub>q</sub>')
      +'∫<sub>A<sub>p</sub></sub>∫<sub>A<sub>q</sub></sub> |γ(<b>r</b>₁ − <b>r</b>₂)|² d²<i>r</i>₁ d²<i>r</i>₂ = ∫ |<i>V</i>(<b>B</b> + <b>s</b>)|² <i>K</i>(<b>s</b>) d²<i>s</i>')
    +EQ(4,'<i>K</i>(<i>s</i>) = '+FR('2<i>R</i>² acos(<i>s</i>/2<i>R</i>) − (<i>s</i>/2)'+SQ('4<i>R</i>² − <i>s</i>²'),'(π<i>R</i>²)²')+' &nbsp;<span class="rm">(two discs of radius R; ∫K = 1)</span>')
    +'<p>— the measured |<i>V</i>|² is the true one averaged over the segment\'s autocorrelation kernel; with '
    +'|<i>V</i>|² varying on the grain scale λ<i>L</i>/<i>a</i><sub>fs</sub>, a 4 mm segment against a 4 mm '
    +'Gaussian |<i>V</i>|² keeps 0.794 at zero baseline, 2 mm keeps 0.941, 8 mm keeps 0.476 (derive.py, '
    +'16×24 Gauss–Legendre against scipy dblquad to 3×10⁻⁷). The criterion is <i>d</i><sub>sub</sub> ≲ λ<i>L</i>/<i>a</i><sub>fs</sub>; '
    +'the document lists "individual sub-aperture diameter" and "u–v coverage, orientation, and gaps" among '
    +'the resolution-limiting effects and asks for segmentation to balance spatial-frequency resolution '
    +'against photons per segment.</p>'
    +'<p>The uv plane is point-symmetric: <b>B</b> and −<b>B</b> give the same |<i>V</i>|², so every pair is drawn twice.</p>'
    +'<div class="cite">document §4, §4.1 items 1–9, §5 table; Matthews §3 (N(N−1)/2 simultaneous baselines, aperture masking without the mask); Dravins §9.2.4 (redundancy); Goodman, Statistical Optics (aperture-averaged speckle)</div>',
  target:'<h4>the measured quantity</h4>'
    +EQ(1,'Õ(<i>u</i>,<i>v</i>) = ∫ρ(<b>x</b>) <i>e</i><sup>−2π<i>i</i>(<i>ux</i>+<i>vy</i>)</sup> d²<i>x</i>, &nbsp; |<i>V</i>|² = |Õ(<i>u</i>,<i>v</i>)|²/|Õ(0)|², &nbsp; <b>u</b> = <b>B</b>/(λ<i>L</i>)')
    +'<p>The model is a sum of uniform primitives, each with a closed-form transform (rotated coordinates <i>u</i>′, <i>v</i>′):</p>'
    +EQ(2,'<span class="rm">ellipse (axes a, b):</span> &nbsp; '+FR('Õ','area')+' = '+FR('2 <i>J</i>₁(πρ)','πρ')+', &nbsp; ρ = '+SQ('(<i>a u</i>′)² + (<i>b v</i>′)²')
      +' &nbsp;&nbsp; <span class="rm">rectangle (ℓ × w):</span> &nbsp; sinc(πℓ<i>u</i>′) sinc(π<i>w v</i>′)')
    +'<p><i>J</i>₁ is evaluated by the spectrally exact trapezoid rule on (1/2π)∫₀<sup>2π</sup>cos(<i>t</i> − <i>x</i> sin <i>t</i>) d<i>t</i> '
    +'(1.5×10⁻¹⁵ against scipy) for the pins and by the Numerical-Recipes rational form (verified 4.9×10⁻⁹) on the 512² grids; '
    +'the analytic sum agrees with a 5 µm raster to 10⁻³ and with quadrature to 10⁻¹⁰.</p>'
    +'<h4>what survives, what does not</h4>'
    +EQ(3,'Õ<sub>t</sub>(<b>u</b>) = Õ(<b>u</b>) <i>e</i><sup>−2π<i>i</i> <b>u</b>·<b>x</b>₀(<i>t</i>)</sup> &nbsp;⇒&nbsp; |Õ<sub>t</sub>(<b>u</b>)|² = |Õ(<b>u</b>)|²')
    +'<p>Pure translation is invisible — the flying target leaves the map still (exact to 10⁻¹⁵ in the tests). '
    +'Rotation by α maps Õ(<b>u</b>) → Õ(<i>R</i><sub>α</sub><b>u</b>), wing deformation and articulation change '
    +'the magnitude itself; the document therefore positions a 50–100 ms exposure as wingbeat-averaged rigid '
    +'morphology. Legs of ~40 µm are thinner than δ<i>x</i> ≈ 100 µm: detectable as elongated, '
    +'PSF-broadened features (their sinc tails are the high-frequency power on the map), not resolved in width.</p>'
    +'<h4>what the magnitudes determine</h4>'
    +EQ(4,'ℱ<sup>−1</sup>{|Õ|²} = ρ ⋆ ρ &nbsp;<span class="rm">(Wiener–Khinchin: the autocorrelation)</span>, &nbsp; '
      +'ℱ<sup>−1</sup>{<i>S</i>·|Õ|²} = (ρ ⋆ ρ) ∗ ℱ<sup>−1</sup>{<i>S</i>} &nbsp;<span class="rm">(sampled: convolved with the coverage\'s transform)</span>')
    +'<p>An image needs the phases: the two-detector correlation has none (Dravins §7; Malvimat: three detectors '
    +'would give the bispectrum). Liu et al. rebin 1260 points onto a 512×512 "frequel" grid and run a '
    +'modified phase-retrieval algorithm; here the grid is 512² pixels of 28 µm, so a uv cell is '
    +'1/(512 × 28 µm) = 0.0698 cycles/mm and the half-span ±17.9 cycles/mm reaches ±0.35 m of baseline at 25 m. '
    +'The HIO demonstration is Fienup\'s hybrid input–output:</p>'
    +EQ(5,'<i>g</i><sub>k+1</sub>(<b>x</b>) = <i>g</i>′<sub>k</sub>(<b>x</b>) <span class="rm">where the support holds and <i>g</i>′ ≥ 0, else</span> <i>g</i><sub>k</sub>(<b>x</b>) − β <i>g</i>′<sub>k</sub>(<b>x</b>), &nbsp; β = 0.9')
    +'<p>with <i>g</i>′<sub>k</sub> the inverse transform after imposing the measured magnitudes; a box support '
    +'(±7 × ±6 mm) and positivity, 300 iterations ending in error reduction. The result is ambiguous up to '
    +'translation and the twin image ρ(−<b>x</b>), and with the sparse four-pupil coverage it is a '
    +'demonstration of the problem, not a prediction of the instrument\'s image.</p>'
    +'<div class="cite">document §2, §5, §9.1–9.2, §11 item 8; Liu et al. eqs 1–2 and Fig. 4; Dravins §7.1–7.2; Fienup, Opt. Lett. 3, 27 (1978)</div>',
  signal:'<h4>the document\'s ceiling</h4>'
    +EQ(1,'SNR ≈ |<i>V</i>|² '+SQ('<i>N</i>')+', &nbsp; <i>N</i> ≳ (<i>S</i>/|<i>V</i>|²)² &nbsp;<span class="rm">(one independent realisation per frame, high flux)</span>')
    +'<p>5 ms at 18/100/200 kfps = 90/500/1000 frames → 1.9/4.5/6.3 at |<i>V</i>|² = 0.2; 50 and 100 ms at 18 kfps → 6.0 and 8.5 '
    +'— "ceilings, not predictions". Here is what sits under them.</p>'
    +'<h4>Gaussian (thermal) intensity statistics</h4>'
    +'<p>Estimate the normalised covariance from N frames, ĉ = ⟨(<i>I</i>₁−⟨<i>I</i>₁⟩)(<i>I</i>₂−⟨<i>I</i>₂⟩)⟩/(⟨<i>I</i>₁⟩⟨<i>I</i>₂⟩). '
    +'For circular-Gaussian fields with |γ|² = <i>V</i>² the Gaussian moment theorem gives (means normalised to 1)</p>'
    +EQ(2,'⟨<i>I</i>₁<i>I</i>₂⟩ = 1 + <i>V</i>², &nbsp; ⟨<i>I</i>₁²<i>I</i>₂⟩ = 2(1 + 2<i>V</i>²), &nbsp; ⟨<i>I</i>₁²<i>I</i>₂²⟩ = 4(1 + 4<i>V</i>² + <i>V</i>⁴)')
    +EQ(3,'⟨Δ<i>I</i>₁² Δ<i>I</i>₂²⟩ = (1 + 2<i>V</i>²)², &nbsp; Var(Δ<i>I</i>₁Δ<i>I</i>₂) = (1 + <i>V</i>²)(1 + 3<i>V</i>²) &nbsp;⇒&nbsp; SNR = '
      +FR('<i>V</i>² '+SQ('<i>N</i>'),SQ('(1 + <i>V</i>²)(1 + 3<i>V</i>²)')))
    +'<p>— the ceiling [1] as <i>V</i>² → 0, a factor 0.72 below it at <i>V</i>² = 0.2 (Monte-Carlo checked to ~1 %).</p>'
    +'<h4>photons and read noise</h4>'
    +'<p>Counts <i>n</i><sub>i</sub> ~ Poisson(n̄ <i>I</i><sub>i</sub>) plus read noise σ<sub>r</sub> per segment per frame:</p>'
    +EQ(4,'Var[(<i>n</i>₁−n̄)(<i>n</i>₂−n̄)] = n̄²(1+<i>V</i>²) + 2σ<sub>r</sub>²n̄ + 2n̄³(1+2<i>V</i>²) + σ<sub>r</sub>⁴ + 2σ<sub>r</sub>²n̄² + n̄⁴[(1+2<i>V</i>²)² − <i>V</i>⁴]')
    +EQ(5,'SNR = '+FR(SQ('<i>N</i>')+' n̄² <i>V</i>²',SQ('Var'))+' &nbsp;→&nbsp; [3] <span class="rm">as n̄ → ∞</span>, &nbsp; '
      +FR('<i>V</i>² n̄ '+SQ('<i>N</i>'),SQ('1 + <i>V</i>²'))+' <span class="rm">as n̄ → 0</span>')
    +'<p>— shot-limited, the SNR scales with n̄ itself. The photon budget per segment per frame (all inputs are sliders and all are assumed):</p>'
    +EQ(6,'<i>E</i><sub>t</sub> = '+FR('<i>P</i><sub>t</sub>','π<i>w</i>²')+', &nbsp; <i>P</i><sub>s</sub> = <i>E</i><sub>t</sub> <i>A</i><sub>m</sub> ρ, &nbsp; <i>P</i><sub>seg</sub> = <i>P</i><sub>s</sub> '
      +FR('<i>A</i><sub>seg</sub>','π<i>L</i>²')+', &nbsp; n̄ = η <i>P</i><sub>seg</sub> <i>T</i><sub>exp</sub>/(<i>h</i>ν)')
    +'<p>Lambertian return into the segment; the default inputs give n̄ ≈ 1.4 e⁻ for a 3.8 mm segment at 100 kfps — '
    +'the document\'s first listed risk ("insufficient photons per pupil segment … read-noise or shot-noise limited") '
    +'in numbers. Segmentation divides the telescope\'s photons by the segment count.</p>'
    +'<h4>the starlight forms, for comparison</h4>'
    +EQ(7,'S/N = <i>A</i>αη|<i>V</i>|² '+SQ('<i>T</i>Δ<i>f</i>/2')+' &nbsp;<span class="rm">(Hanbury Brown; Matthews eq. 3)</span>, &nbsp; '
      +'S/N = '+SQ('<i>N</i>₁<i>N</i>₂')+' τ<sub>o</sub> |<i>V</i>|² '+SQ('<i>T</i>/Δ<i>t</i>')+' &nbsp;<span class="rm">(coincidence form, eq. 4)</span>')
    +'<p>with Δ<i>t</i> = (Δ<i>f</i>/2)⁻¹ as the paper identifies them; τ<sub>o</sub> = ∫|<i>g</i><sup>(1)</sup>(τ)|²dτ = ∫|<i>s</i>(ν)|²dν. '
    +'86.9 Mcps, 445 fs, 1800 s and 2 ns give <b>36.69</b>. Malvimat\'s SNR ~ <i>r</i>Δτ√(<i>T</i>/δ<i>t</i>) is the same expression '
    +'(<i>r</i>Δτ = <i>N</i>τ<sub>o</sub> photons per coherence time). The dilution τ<sub>o</sub>/Δ<i>t</i> = 2.2×10⁻⁴ is what the '
    +'engineered source removes — one full-contrast realisation per frame — at the price of a photon budget per segment.</p>'
    +'<div class="cite">document §7, §13; Matthews eqs 3–5 and §5.1; Malvimat eqs 5–7, 17, 22–23; Dravins eq. 12 and §5 (S/N independent of the optical passband)</div>',
  telescope:'<h4>the Davies–Cotton dish</h4>'
    +EQ(1,'Δ<i>t</i>(ρ) = '+FR('<i>f</i> − '+SQ('<i>f</i>² − ρ²'),'<i>c</i>')+' &nbsp;<span class="rm">facets on a sphere of radius f centred on the focus</span>')
    +'<p>Every facet is <i>f</i> from the focus, but the rim sits <i>f</i> − √(<i>f</i>² − ρ²) = 1.61 m closer to the sky, so its light '
    +'arrives <b>5.36 ns</b> early at ρ = 6 m (the paper\'s ~5.4 ns window); one rim hex cell spans 2.4 ns and the inner ones far less. '
    +'S/N grows as √(1/Δ<i>t</i>) in eq. 4, which is why subdividing the pupil — rather than one pixel on the whole dish — pays '
    +'in time resolution as well as in baselines.</p>'
    +'<h4>the pupil as an interferometer</h4>'
    +EQ(2,'61 = 3·4² + 3·4 + 1 &nbsp;hexagons, &nbsp; <i>N</i>(<i>N</i>−1)/2 = 1830 &nbsp;baselines, &nbsp; 16 × 1830 = 29 280 &nbsp;points')
    +'<p>The pitch on the dish is 11.7 m/8 = 1.46 m (the paper: shortest ~1.5 m, longest ~11.7 m, 1.92 m² per '
    +'characteristic segment from ray tracing; a regular cell here is 1.85 m²). Field stop 25.4 mm at f = 12 m → 0.12°; '
    +'two Ø200 f 300 lenses collimate; 21 mm hexagons tile the re-imaged pupil.</p>'
    +'<h4>alt-az rotation</h4>'
    +EQ(3,'tan <i>q</i> = '+FR('sin <i>h</i>','tan φ cos δ − sin δ cos <i>h</i>')+', &nbsp; (<i>u</i>,<i>v</i>) = (<b>B</b>·<b>ê</b>, <b>B</b>·<b>n̂</b>)/λ')
    +'<p>The baselines live in the dish plane; on the sky the dish\'s "up" points at the zenith, i.e. at the parallactic angle <i>q</i> '
    +'from north, so the whole lattice turns by <i>q</i>(<i>h</i>). For γ Cas (δ = +60.7°) from the VERITAS site (φ = 31.7°) the '
    +'transit is north of the zenith, <i>q</i> = 180°, and ±4 h give 98.8° and 261.2° — 162° of rotation, the rosette. The '
    +'vector construction is checked against the standard (u,v,w) matrix to 10⁻⁸ (Dravins eq. 11; TMS).</p>'
    +'<h4>the disc and the star</h4>'
    +EQ(4,'<i>V</i>(<i>u</i><sub>a</sub>,<i>u</i><sub>b</sub>) = exp[−π²(θ<sub>maj</sub>²<i>u</i><sub>a</sub>² + θ<sub>min</sub>²<i>u</i><sub>b</sub>²)/4 ln 2], &nbsp; |<i>V</i>|² = <i>V</i>² &nbsp;<span class="rm">(FWHM convention; θ<sub>min</sub> = 0.74 θ<sub>maj</sub>, PA 17°)</span>')
    +'<p>Matthews, Gori & Vakili use θ<sub>GD</sub> = 4.4 mas from Stee et al. (2012). Their Fig. 7 traces exp(−(πθ<i>B</i>/λ)²/4 ln 2) '
    +'— 0.63 at 11 m on the major axis — which is |<i>V</i>| of a 4.4 mas FWHM disc or |<i>V</i>|² of a 3.11 mas one; the paper does '
    +'not state the convention, so both are drawn and labelled. σ per 30-min point is 1/36.7 = 0.027, co-added over the '
    +'lattice redundancy and the snapshots; the paper\'s fit claims 0.2 % on the extent, 0.5 % on the ratio, 2 % on the angle.</p>'
    +EQ(5,'|<i>V</i>|² = [2<i>J</i>₁(<i>x</i>)/<i>x</i>]², &nbsp; <i>x</i> = πθ<i>B</i>/λ, &nbsp; <i>B</i>₀ = 3.8317 λ/(πθ)')
    +'<p>Hanbury Brown\'s uniform disc: Sirius at 5.6 mas and 450 nm is resolved out at 20.2 m; a 2 mas star at 550 nm at 69 m '
    +'(the paper\'s "fully resolved at baselines greater than 60 m"); Narrabri\'s 6.5 m mirrors on a 188 m track measured 32 stars.</p>'
    +'<h4>photons per coherence time</h4>'
    +EQ(6,'<i>r</i>Δτ = '+FR('<i>A</i>','<i>A</i><sub>airy</sub>')+FR('1','<i>e</i><sup>z</sup> − 1')+' ≈ 0.05 '+FR('<i>F</i><sub>ν</sub>','Jy')+FR('λ','m')+FR('<i>A</i>','m²')

    const runStat=(N,nf,seed)=>{ const T=repTilts(repEmitters(N,REP.ring),nn,pt,lamR,LR), a=repBranchFields(repRough(O,nn,lcg32(777)),T,nn,idx), A=repAccInit(idx.length), r=lcg32(seed);
      for(let f=0;f<nf;f++) repAccAdd(A,repFrameStatic(a,N,idx.length,r)); return repSlope(repAccEstimate(A),pairs,0.02); };
    /* the verdict, as assertions: a JITTERING target recovers |V|^2 (slope -> 1, residual shrinks with frames) */
    const j150=runJit(8,150,0,12353), j600=runJit(8,600,0,12353), j600b=runJit(8,600,0,24001);
    ok(j600.alpha>0.9&&j600.alpha<1.1,'rep: JITTER, 600 frames -> the estimate recovers |V|^2 (slope '+fmt(j600.alpha,3)+' ~ 1)');
    ok(j600b.alpha>0.9&&j600b.alpha<1.1,'rep: … and again for a second seed (slope '+fmt(j600b.alpha,3)+')');
    ok(j600.rms<j150.rms&&j600.rms<0.08,'rep: JITTER, the residual shrinks with frames ('+fmt(j150.rms,3)+' -> '+fmt(j600.rms,3)+', ~1/sqrt(N_f))');
    /* a FROZEN (static, rigid) target does NOT: slope sits below 1 and the speckle residual does not average away */
    const s500=runStat(8,500,7), s1200=runStat(8,1200,7);
    ok(s1200.alpha>0.55&&s1200.alpha<0.9,'rep: STATIC, slope saturates near (1-1/N), below 1 ('+fmt(s1200.alpha,3)+')');
    ok(s1200.rms>0.15&&s500.rms>0.15,'rep: STATIC, the speckle residual stays ~|V|/sqrt(N) at 500 AND 1200 frames ('+fmt(s500.rms,3)+', '+fmt(s1200.rms,3)+')');
    ok(s1200.rms>3*j600.rms,'rep: STATIC residual >> JITTER residual at the same frames — frames cannot remove the speckle');
    ok(Math.abs(s1200.rms-s500.rms)<0.07,'rep: … and it does not shrink from 500 to 1200 frames');
    /* more branches push the static estimate back toward 1 (many N, not many frames) */
    ok(runStat(16,1200,7).alpha>s1200.alpha&&runStat(2,1200,7).alpha<s1200.alpha,'rep: static slope rises with N (N=2 < N=8 < N=16), the honest lever for a static target');
    /* the photon-starved run centres on |V|^2 but is noisier than ideal */
    const jp=runJit(8,500,1.4,99), ji=runJit(8,500,0,99);
    ok(jp.rms>1.5*ji.rms,'rep: at n_bar = 1.4 e- the residual grows vs ideal photons ('+fmt(ji.rms,3)+' -> '+fmt(jp.rms,3)+')');
    /* two stated symmetries the sweep flagged as equivalent mutants (removed from
       mutants.json, pinned here as properties instead): */
    { const nn2=REP.n, E=repEmitters(8,REP.ring), Tp=repTilts(E,nn2,pt,lamR,LR);
      /* (a) overall illumination power: the SAME intensity frames scaled by any
         constant give the IDENTICAL normalised estimate (~scale^2 top and bottom) —
         exact, so the 1/sqrt(N) tweak cannot change the recovered |V|^2 */
      const rA=lcg32(654), A1=repAccInit(idx.length), A2=repAccInit(idx.length);
      for(let f=0;f<120;f++){ const I=repFrameJitter(O,Tp,nn2,idx,rA); const I5=new Float64Array(I.length); for(let q=0;q<I.length;q++) I5[q]=5.3*I[q]; repAccAdd(A1,I); repAccAdd(A2,I5); }
      const e1=repAccEstimate(A1), e2=repAccEstimate(A2); let ds=0; for(let k=0;k<e1.length;k++) ds=Math.max(ds,Math.abs(e1[k]-e2[k]));
      ok(ds<1e-9,'rep: the estimate is invariant to overall illumination power ('+ds.toExponential(1)+' — the 1/sqrt(N) equivalent mutant)');
      /* (b) emitter-tilt sign: negating every tilt maps the ring onto itself, so the
         RECOVERED |V|^2 is unchanged in the ensemble (not frame-locked) — assert the
         sign-flipped illumination still recovers |V|^2 (slope ~ 1) */
      const Tm={re:new Float64Array(Tp.re.length),im:new Float64Array(Tp.im.length),N:8};
      for(let i=0;i<Tp.re.length;i++){ Tm.re[i]=Tp.re[i]; Tm.im[i]=-Tp.im[i]; }
      const Am=repAccInit(idx.length), rm=lcg32(741); for(let f=0;f<500;f++) repAccAdd(Am,repFrameJitter(O,Tm,nn2,idx,rm));
      const sm=repSlope(repAccEstimate(Am),pairs,0.02);
      ok(sm.alpha>0.85&&sm.alpha<1.15,'rep: sign-flipped emitter tilts still recover |V|^2 (slope '+fmt(sm.alpha,3)+' — a symmetry, not a bug)'); } }

  /* ---- 12. the built model, every view, clean ---- */
  { let bad=0,note='';
    const cases=[];
    for(const [vk] of TABS) cases.push({view:vk});
    cases.push({view:'bench',L:20,F:0.19},{view:'bench',lamnm:1064,Nbr:16},
               {view:'source',Nbr:2},{view:'source',Nbr:16,sync:false,Tu:2},
               {view:'pupils',layout:'pair',rings:2,F:0.10,Dmm:25},{view:'pupils',layout:'line',rings:8,F:0.35,Dmm:100,pick:3,pick2:500},
               {view:'pupils',layout:'Y',rings:4,afs:4},
               {view:'target',target:'two'},{view:'target',target:'disc',rot:45,chan:'cross'},{view:'target',fly:false,tdx:3,tdy:-3},
               {view:'target',target:'usaf'},{view:'rep',repMode:'jitter',target:'usaf'},
               {view:'signal',Nfr:50,eta:0.05,sigr:0},{view:'signal',Nfr:5000,kfps:18,V2pick:1,Pt:5},
               {view:'telescope',star:'disc',thmas:1,hrange:1},{view:'telescope',hrange:4,showPaper:false});
    for(const so of cases){
      for(const t of [0,7.3]){
        Object.assign(ST,DEFAULTS,so,{t});
        let html='';
        try{
          const M=buildModel();
          html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
          if(!isFinite(M.dxnom)||!isFinite(M.nbar)||!isFinite(M.tauc)) bad++;
          if(M.view==='telescope'&&!(M.her.sn>36&&M.her.sn<37)) bad++;
        }catch(e){ bad++; note=String(e&&e.stack||e).slice(0,200); }
        if(html.indexOf('NaN')>=0||html.indexOf('Infinity')>=0||html.indexOf('undefined')>=0){ bad++;
          note='NaN/Infinity/undefined at '+JSON.stringify(so); }
      }
    }
    ok(bad===0,'model+readout clean over '+cases.length*2+' state combinations '+note);
    Object.assign(ST,DEFAULTS);
    const M=buildModel();
    rel(M.dxnom,7.151404649031e-05,1e-9,'default frame: dx_nom 71.5 um at 25 m off the built model (scipy)');
    ok(M.nIndep===500,'default 500 frames at 100 kfps with T_u = 10 us are 500 independent realisations');
    Object.assign(ST,DEFAULTS,{Tu:50}); ok(buildModel().nIndep===100,'T_u = 50 us at 100 kfps: only 100 of 500 frames are independent (T_acq/T_u)');
    Object.assign(ST,DEFAULTS,{Tu:100,Nfr:50}); ok(buildModel().nIndep===5,'T_u = 100 us, 50 frames: 5 independent realisations');
    Object.assign(ST,DEFAULTS);
    close(M.ratio,3.846153846e-3/1.9625e-3,1e-6,'default d_sub/grain = 1.96 off the model');
    rel(M.her.sn,36.6860574773,1e-9,'heritage S/N off the built model');
    ok(M.her.nB===1830&&M.her.nTot===29280&&M.her.nsnap===16,'heritage: 1830 baselines x 16 snapshots = 29280 off the model');
    rel(M.her.pitch,1.4625,1e-12,'heritage pitch off the model');
    ok(M.snrRows.length===5&&Math.abs(M.snrRows[0][3]-1.8973665961)<1e-8,'the table rows come off the model');
    rel(M.nbar,1.3954776168*(3.8461538462e-3/3.846e-3)*(3.8461538462e-3/3.846e-3),1e-6,'nbar off the model uses the live pitch');
    Object.assign(ST,DEFAULTS,{view:'target'}); const Mt=buildModel();
    ok(Mt.cov.outside===0&&Mt.cov.filled>4000,'default coverage: every baseline on the 512 grid, '+Mt.cov.filled+' cells filled');
    ok(Mt.grid[0]===1&&Mt.acTrue.length===GRID_N*GRID_N,'the 512 grid and its autocorrelation exist');
    ok(Mt.acCorr>0.2&&Mt.acCorr<1,'sampled autocorrelation correlation in (0.2,1): '+Mt.acCorr.toFixed(3));
    Object.assign(ST,DEFAULTS,{view:'target',fly:true,t:1.3}); const Mf=buildModel();
    ok(Mf.tdx!==0&&Mf.grid===Mt.grid,'the flying target moves but shares the SAME |O|^2 grid (translation invariance, cached)'); }

  /* ---- 13. defaults reach the regime each view exists to show ---- */
  ok(DEFAULTS.F>=0.24&&rayleighRes(lam,DEFAULTS.L,DEFAULTS.F)<1e-4,'the default frame reaches the 0.1 mm design scale at 25 m');
  ok(DEFAULTS.Nbr===8&&DEFAULTS.sync===true,'defaults: eight branches, one master clock (the document\'s architecture)');
  ok(DEFAULTS.Nfr===500&&DEFAULTS.kfps===100,'defaults: the 5 ms / 100 kfps table row');
  ok(RINGSEL.map(r=>hexCount(r.id)).join()==='19,61,127,217','segment chips: 19/61/127/217');
  ok(KFPS.map(k=>k.id).join()==='18,100,200','camera chips: the document\'s three rates');

  /* ---- 14. layout: every view x size, off-canvas / collisions / entities ---- */
  { const sizes=[[1400,820],[1100,712],[820,560],[560,380]];
    const states=[
      {view:'bench'},{view:'bench',L:20,F:0.19,Nbr:16},
      {view:'source'},{view:'source',Nbr:2,sync:false,t:9.1},
      {view:'pupils',pick:3,pick2:400},{view:'pupils',layout:'pair',rings:2,F:0.12},{view:'pupils',layout:'line',rings:8,F:0.35},
      {view:'target'},{view:'target',target:'two',fly:false},{view:'target',target:'usaf'},{view:'target',target:'disc',rot:45,chan:'cross',t:2.2},
      {view:'signal'},{view:'signal',Nfr:50,eta:0.05,sigr:0,kfps:18},
      {view:'telescope'},{view:'telescope',star:'disc',thmas:2,hrange:1,showPaper:false},
      {view:'rep'},{view:'rep',repMode:'static',repPh:1.4},
    ];
    let badText=0,badOverlap=0,badEnt=0,note='';
    /* floors follow what THIS file emits (measured): the full layout, and the
       narrow stage (column < NARROW_W) where each view draws its primary panel
       alone — the one-pair / 19-segment pupils configuration legitimately
       draws ~47 ops there */
    const FLOORS={bench:120,source:120,pupils:60,target:6000,signal:120,telescope:3000,rep:60};
    const FLOORS_NARROW={bench:30,source:40,pupils:40,target:6000,signal:30,telescope:3000,rep:30};
    for(const [W,H] of sizes){
      const narrow=(W-RO_W-84)<NARROW_W;
      for(const so of states){
        Object.assign(ST,DEFAULTS,so);
        const M=buildModel();
        const R=recCtxTest(W,H);
        let threw=null;
        try{ drawView(R.c,W,H,M); }catch(e){ threw=e; }
        ok(!threw,'drawView('+so.view+') at '+W+'x'+H+' draws without throwing'+(threw?': '+(threw.stack||threw):''));
        if(threw) continue;
        ok(R.ops.n>=(narrow?FLOORS_NARROW:FLOORS)[so.view],'view '+so.view+' emits a real picture ('+R.ops.n+' ops at '+W+'x'+H+(narrow?', narrow':'')+')');
        for(const tx of R.texts){
          if(/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/.test(tx.t)){ badEnt++; note='entity: "'+tx.t.slice(0,40)+'"'; }
          if(tx.rot) continue;
          const b2=textBoxTest(tx);
          if(b2.x0<-2||b2.x1>W+2||b2.y0<-2||b2.y1>H+2){ badText++;
            if(badText<=10) console.log('  off-canvas: "'+tx.t.slice(0,36)+'" at '+fmt(b2.x0,0)+','+fmt(b2.y0,0)+' in '+so.view+'@'+W+'x'+H); }
        }
        const unrot=R.texts.filter(t2=>!t2.rot);
        for(let i=0;i<unrot.length;i++) for(let j=i+1;j<unrot.length;j++){
          const A2=textBoxTest(unrot[i]), B2=textBoxTest(unrot[j]);
          const wo=Math.min(A2.x1,B2.x1)-Math.max(A2.x0,B2.x0);
          const ho=Math.min(A2.y1,B2.y1)-Math.max(A2.y0,B2.y0);
          if(wo>3&&ho>3){ badOverlap++;
            if(badOverlap<=14) console.log('  overlap: "'+unrot[i].t.slice(0,30)+'" vs "'+unrot[j].t.slice(0,30)+'" in '+so.view+'@'+W+'x'+H); }
        }
        for(const L2 of LEGEND_RECTS){
          for(let s2=0;s2<POLY_SEGS.length;s2+=4){
            const x0=POLY_SEGS[s2],y0=POLY_SEGS[s2+1],x1=POLY_SEGS[s2+2],y1=POLY_SEGS[s2+3];
            if(Math.max(x0,x1)<L2.x||Math.min(x0,x1)>L2.x+L2.w||Math.max(y0,y1)<L2.y||Math.min(y0,y1)>L2.y+L2.h) continue;
            badOverlap++; if(note==='') note='curve through legend in '+so.view+'@'+W+'x'+H; break;
          }
        }
      }
    }
    ok(badEnt===0,'no entity/tag reaches a canvas text op ('+badEnt+') '+note);
    ok(badText===0,'no text leaves the canvas at any size ('+badText+')');
    ok(badOverlap===0,'no text collisions, no curve through a legend ('+badOverlap+') '+note); }

  /* ---- leave the page exactly as a fresh boot expects it ---- */
  Object.assign(ST,DEFAULTS); HIO_STATE=null; HIO_KEY=''; REP_STATE=null; REP_KEY='';

  console.log(pass+' passed, '+fail+' failed  ('+((Date.now()-T0)/1000).toFixed(1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}
/* the recording context + text-box helpers the layout sweep uses */
function recCtxTest(W,H){
  const st2={font:'10px x',stack:[],tx:0,ty:0,rot:0};
  const texts=[],ops={n:0};
  const c={
    canvas:{width:W,height:H},
    save(){ st2.stack.push([st2.tx,st2.ty,st2.rot]); },
    restore(){ const s=st2.stack.pop(); if(s){ st2.tx=s[0]; st2.ty=s[1]; st2.rot=s[2]; } },
    translate(x,y){ st2.tx+=x; st2.ty+=y; },
    rotate(a){ st2.rot+=a; },
    setTransform(){}, scale(){}, setLineDash(){},
    beginPath(){}, moveTo(){}, lineTo(){}, closePath(){}, arc(){}, rect(){}, ellipse(){},
    fill(){ ops.n++; }, stroke(){ ops.n++; },
    clip(){}, fillRect(){ ops.n++; }, strokeRect(){ ops.n++; }, clearRect(){},
    fillText(t,x,y){ ops.n++;
      const m=/(\d+(?:\.\d+)?)px/.exec(c.font||'10px x');
      const px=m?parseFloat(m[1]):10;
      texts.push({t:String(t),x:st2.tx+x,y:st2.ty+y,px,
                  w:String(t).length*px*0.52,
                  align:c.textAlign||'left',base:c.textBaseline||'alphabetic',
                  rot:Math.abs(st2.rot)>1e-9}); },
    strokeText(){}, measureText(t){
      const m=/(\d+(?:\.\d+)?)px/.exec(c.font||'10px x');
      return {width:String(t).length*(m?parseFloat(m[1]):10)*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  c.font='10px x'; c.textAlign='left'; c.textBaseline='alphabetic';
  c.fillStyle='#000'; c.strokeStyle='#000'; c.lineWidth=1; c.globalAlpha=1;
  c.lineJoin='miter'; c.lineCap='butt';
  return {c,texts,ops};
}
function textBoxTest(tx){
  let x0=tx.x;
  if(tx.align==='center') x0-=tx.w/2;
  else if(tx.align==='right'||tx.align==='end') x0-=tx.w;
  let y0=tx.y;
  if(tx.base==='middle') y0-=tx.px/2;
  else if(tx.base==='alphabetic'||tx.base==='bottom') y0-=tx.px;
  return {x0,y0,x1:x0+tx.w,y1:y0+tx.px};
}
