/* ---------------- Landau's criterion ---------------- */
function landauCaption(L){
  /* nothing here may change with v, which is dragged on two plots (the readout gives what it can make) */
  const main='The spectrum of helium II’s excitations as Donnelly and Barenghi recommend it (their Table 13.3): phonons, the maxon, the roton. An object moving at v through the still liquid can make an excitation only where E(p) lies below the line pv (magenta): there (shaded) the flow has drag, and where nothing is shaded it has none.'
    +' Landau’s velocity is where the line from the origin touches the roton (orange): '+fmt(L.vL,1)+' m/s.';
  return {full:main+' Below, E/p against p, whose least value is Landau’s velocity, and the angle to the motion at which each excitation it can make leaves.',
    short:'The spectrum and the line pv; below, E/p and the directions of emission.',main,mainShort:'The spectrum and the line pv.'};
}
function drawLandau(ctx,W,H,M){
  const L=M.L, cap=capFor(W,landauCaption(L)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.38,nbNarrow(H));
  plotDispersion(ctx,Lay.main,L);
  if(Lay.bottom[0]) plotPhaseVel(ctx,Lay.bottom[0],L);
  if(Lay.bottom[1]) plotCone(ctx,Lay.bottom[1],L);
  drawCaption(ctx,Lay);
}
const kPerV=()=>PH.hbar*1e10/PH.kB;                  /* E/k per (Q in 1/A x v in m/s) */
function plotDispersion(ctx,mb,L){
  const b=box(mb.x+42,mb.y+22,mb.w-50,mb.h-60), x1=3.6, y1=20, items=[[COL.pos,'measured E(p)'],[COL.live,'p v'],[COL.ref,'Landau’s line',[5,3]],[COL.struct,'sound',[4,3]]],
    ttl=titleKey(b,'the excitations of helium II','the spectrum',items);
  axesT(ctx,b,0,x1,0,y1,{title:ttl,xlab:'Q = p/ℏ (Å⁻¹)',ylab:'E/k (K)',nx:6,ny:4,xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,0)});
  for(const bd of L.band) xband(ctx,b,0,x1,bd[0],bd[1],'rgba(205,53,196,0.16)');
  const qs=[], es=[]; for(let i=0;i<=720;i++){ const q=x1*i/720; qs.push(q); es.push(EK(q)); }
  polyline(ctx,b,[0,1.05],[0,1.05*L.cK],0,x1,0,y1,COL.struct,1.1,[4,3]);
  polyline(ctx,b,[0,x1],[0,x1*kPerV()*L.vL],0,x1,0,y1,COL.ref,1.2,[5,3]);
  polyline(ctx,b,qs,es,0,x1,0,y1,COL.pos,2);
  for(const r of HE.disp){ if(r[0]<0.15) continue; dot(ctx,xOf(b,0,x1,r[0]),yOf(b,0,y1,r[1]),1.6,'#e9e9f0'); }
  polyline(ctx,b,[0,x1],[0,x1*kPerV()*L.v],0,x1,0,y1,COL.live,1.6);
  lab(ctx,W_STAGE,H_STAGE,xOf(b,0,x1,0.55),yOf(b,0,y1,EK(0.55))-12,'phonons',COL.dim,SM_FONT,'center','middle',PLATE);
  lab(ctx,W_STAGE,H_STAGE,xOf(b,0,x1,1.1),yOf(b,0,y1,EK(1.1))-12,'maxon',COL.dim,SM_FONT,'center','middle',PLATE);
  lab(ctx,W_STAGE,H_STAGE,xOf(b,0,x1,L.Q0),yOf(b,0,y1,L.Delta)+14,'roton',COL.dim,SM_FONT,'center','middle',PLATE);
  keyRow(ctx,b,items,ttl);
  HIT.push({kind:'lVslope',b,x1,y1});
}
function plotPhaseVel(ctx,b,L){
  const x0=0.1, x1=3.6, top=300, items=[[COL.pos,'E/p'],[COL.live,'v'],[COL.ref,'Landau’s',[5,3]]], ttl=titleKey(b,'E/p against p: its least is Landau’s velocity','E/p',items);
  axesT(ctx,b,x0,x1,0,top,{title:ttl,xlab:'Q (Å⁻¹)',ylab:'E/p (m/s)',nx:5,ny:3,xfmt:v=>fmt(v,1),yfmt:v=>fmt(v,0)});
  for(const bd of L.band) xband(ctx,b,x0,x1,bd[0],bd[1],'rgba(205,53,196,0.16)');
  const qs=[], vs=[]; for(let i=0;i<=500;i++){ const q=x0+(x1-x0)*i/500; qs.push(q); vs.push(L.L.vp(q)); }
  hmark(ctx,b,0,top,L.vL,COL.ref,[5,3]);
  polyline(ctx,b,qs,vs,x0,x1,0,top,COL.pos,1.8);
  hmark(ctx,b,0,top,L.v,COL.live,null,1.4);
  HIT.push({kind:'lV',b,vy:true,lo:0,hi:top});
  keyRow(ctx,b,items,ttl);
}
/* a heavy object at v makes an excitation p only on the cone E(p) = p v cos(theta): cos(theta) = (E/p)/v */
function coneAngle(L,Q){ const c=L.L.vp(Q)/L.v; return c<=1?Math.acos(c)*180/PI:NaN; }
function plotCone(ctx,b,L){
  const x0=0.1, x1=3.6, ttl=titleFor(b,'the angle to the motion each one leaves at','its angle');
  axesT(ctx,b,x0,x1,0,90,{title:ttl,xlab:'Q (Å⁻¹)',ylab:'θ (°)',nx:5,ny:3,xfmt:v=>fmt(v,1),yticks:[0,30,60,90],yfmt:v=>fmt(v,0)});
  if(!L.above){ lab(ctx,W_STAGE,H_STAGE,b.x+b.w/2,b.y+b.h/2,'none: v is below Landau’s velocity',COL.dim,SM_FONT,'center','middle',PLATE); return; }
  for(const bd of L.band) xband(ctx,b,x0,x1,bd[0],bd[1],'rgba(205,53,196,0.16)');
  const qs=[], th=[]; for(let i=0;i<=700;i++){ const q=x0+(x1-x0)*i/700; qs.push(q); th.push(coneAngle(L,q)); }
  polyline(ctx,b,qs,th,x0,x1,0,90,COL.live,1.7);
}

/* ---------------- the rotating bucket ---------------- */
function bucketCaption(B){
  /* nothing here may change with the rotation, which is dragged on the staircase and the share plot */
  if(B.mode==='annulus'){ const main='A thin annulus of helium II turning at Ω (Ω₀ = κ/2πR², '+sciT(B.Om0,3)+' rad/s here): the superfluid can only circulate in whole quanta h/m₄, so it takes the whole number nearest Ω/Ω₀, and below half a quantum it does not turn at all (Hess and Fairbank).';
    return {full:main+' Below, the superfluid’s share of the container’s angular momentum, a staircase, and the flux a superconducting ring holds, the same staircase.',
      short:'A turning annulus of superfluid; below, its angular momentum and a ring’s flux.',main,mainShort:'A turning annulus of superfluid.'}; }
  const main='A bucket of helium II of radius '+fmt(ST.bR,2)+' mm, seen from the frame turning with it: the superfluid turns only on quantized vortex lines (magenta), each with one quantum h/m₄ of circulation; the lines are the Magnus-and-mutual-friction dynamics, running '+BUCKET_SPEED+' times fast. The faint lines are the superfluid’s streamlines.';
  return {full:main+' Below, how many lines the bucket holds as it turns faster (none below Ωc1), against Feynman’s count, and the free energy of each count at this speed.',
    short:'Vortex lines in a turning bucket; below, the staircase and the free energy.',main,mainShort:'Vortex lines in a turning bucket.'};
}
function drawBucket(ctx,W,H,M){
  const B=M.B, cap=capFor(W,bucketCaption(B)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.38,nbNarrow(H));
  if(B.mode==='bucket'){ drawBucketTop(ctx,Lay.main,B); if(Lay.bottom[0]) plotStairs(ctx,Lay.bottom[0],B); if(Lay.bottom[1]) plotBucketF(ctx,Lay.bottom[1],B); }
  else { drawAnnulus(ctx,Lay.main,B); if(Lay.bottom[0]) plotAnnulusL(ctx,Lay.bottom[0],B); if(Lay.bottom[1]) plotRingStairs(ctx,Lay.bottom[1],B); }
  drawCaption(ctx,Lay);
}
function drawBucketTop(ctx,mb,B){
  lab(ctx,W_STAGE,H_STAGE,mb.x,mb.y,'the bucket, from the turning frame','#aeb6c6',TITLE_FONT,'left','top');
  const b0=box(mb.x,mb.y+20,mb.w,mb.h-20), b=fitAspect(b0,2.3,2.3), m={x0:-1.15,x1:1.15,y0:-1.15,y1:1.15};
  const cx=mapX(b,m,0), cy=mapY(b,m,0), Rp=b.w/2.3;
  ctx.beginPath(); ctx.arc(cx,cy,Rp,0,TAU); ctx.fillStyle='rgba(90,200,224,0.07)'; ctx.fill();
  /* the streamlines: the stream function of the lines and their images */
  if(B.xs.length){ const n=81, G=new Float64Array(n*n);
    for(let j=0;j<n;j++) for(let i=0;i<n;i++){ const x=-1+2*i/(n-1), y=-1+2*j/(n-1); let s=0;
      if(x*x+y*y>=1){ G[j*n+i]=NaN; continue; }
      for(let k=0;k<B.xs.length;k++){ const xk=B.xs[k], yk=B.ys[k], r2=xk*xk+yk*yk;
        s+=Math.log(Math.hypot(x-xk,y-yk)); if(r2>1e-12) s-=Math.log(Math.hypot(x-xk/r2,y-yk/r2))+0.5*Math.log(r2); }
      G[j*n+i]=s; }
    const lvl=[]; for(let k=1;k<=10;k++) lvl.push(-0.1*B.xs.length*Math.pow(k,1.5));
    for(const L of lvl) drawSegs(ctx,b,m,contour(G,n,n,-1,1,-1,1,L),'rgba(90,200,224,0.35)',1); }
  ctx.beginPath(); ctx.arc(cx,cy,Rp,0,TAU); ctx.strokeStyle=COL.metal; ctx.lineWidth=2; ctx.stroke();
  for(let k=0;k<B.xs.length;k++){ const X=mapX(b,m,B.xs[k]), Y=mapY(b,m,B.ys[k]); dot(ctx,X,Y,4.2,COL.live,'#ffffff');
    ctx.beginPath(); ctx.arc(X,Y,9,-0.4,PI*1.3); ctx.strokeStyle='rgba(205,53,196,0.7)'; ctx.lineWidth=1; ctx.stroke(); }
  /* the rotation */
  const a1=-PI*0.35; ctx.beginPath(); ctx.arc(cx,cy,Rp+10,-PI*0.1,a1,true); ctx.strokeStyle=COL.dim; ctx.lineWidth=1.3; ctx.stroke();
  const ax=cx+(Rp+10)*Math.cos(a1), ay=cy+(Rp+10)*Math.sin(a1); arrowPx(ctx,ax-8*Math.sin(a1),ay+8*Math.cos(a1),ax,ay,COL.dim,1.3);
  lab(ctx,W_STAGE,H_STAGE,cx+(Rp+18)*Math.cos(-PI*0.25),cy+(Rp+18)*Math.sin(-PI*0.25),'Ω',COL.dim,LAB_FONT,'left','bottom');
  lab(ctx,W_STAGE,H_STAGE,mb.x1,mb.y,B.N+' line'+(B.N===1?'':'s')+' now',COL.live,LAB_FONT,'right','top',PLATE);
  if(B.om<B.ell) lab(ctx,W_STAGE,H_STAGE,cx,cy,'still: below Ωc1',COL.dim,LAB_FONT,'center','middle',PLATE);
}
function plotStairs(ctx,b,B){
  const x1=34, top=9, items=[[COL.pos,'this bucket'],[COL.struct,'Feynman',[4,3]]], ttl=titleKey(b,'lines at equilibrium against Ω/Ω₀','lines',items);
  axesT(ctx,b,0,x1,0,top,{title:ttl,xlab:'Ω/Ω₀',ylab:'N',nx:4,ny:3,xfmt:v=>fmt(v,0),yticks:[0,4,8],yfmt:v=>fmt(v,0)});
  polyline(ctx,b,[0,x1],[0,x1],0,x1,0,top,COL.struct,1.1,[4,3]);
  const xs=[0], ys=[0]; B.steps.forEach((w,i)=>{ xs.push(w,w); ys.push(i,i+1); }); xs.push(x1); ys.push(8);
  polyline(ctx,b,xs,ys,0,x1,0,top,COL.pos,1.8);
  marker(ctx,b,0,x1,0,top,B.om,Math.min(B.Neq,8),COL.live);
  HIT.push({kind:'bOm',b,lo:0,hi:x1});
  keyRow(ctx,b,items,ttl);
}
function plotBucketF(ctx,b,B){
  const F=B.Fmins.slice(0,9), lo=Math.min(0,...F.filter(isFinite))-2, hi=Math.max(0,...F.filter(isFinite))+2, ttl=titleFor(b,'the free energy of N lines at this speed','free energy');
  axesT(ctx,b,-0.5,8.5,lo,hi,{title:ttl,xlab:'N',ylab:'F (ρκ²/4π)',nx:4,ny:3,xticks:[0,2,4,6,8],xfmt:v=>fmt(v,0),yfmt:adFmt(lo,hi,3,true)});
  hmark(ctx,b,lo,hi,0,'#3a4256');
  const best=F.indexOf(Math.min(...F.filter(isFinite)));
  F.forEach((f,n)=>{ if(!isFinite(f)) return; const X=xOf(b,-0.5,8.5,n), Y=yOf(b,lo,hi,f); dot(ctx,X,Y,n===best?5:3,n===best?COL.pos:'#8b93a6'); });
}
function drawAnnulus(ctx,mb,B){
  lab(ctx,W_STAGE,H_STAGE,mb.x,mb.y,'a thin annulus, from above','#aeb6c6',TITLE_FONT,'left','top');
  const b=fitAspect(box(mb.x,mb.y+20,mb.w,mb.h-20),2.4,2.4), cx=b.x+b.w/2, cy=b.y+b.h/2, R=b.w*0.38;
  ctx.beginPath(); ctx.arc(cx,cy,R+10,0,TAU); ctx.arc(cx,cy,R-10,0,TAU,true); ctx.fillStyle='rgba(90,200,224,0.18)'; ctx.fill();
  for(const r of [R+10,R-10]){ ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.strokeStyle=COL.metal; ctx.lineWidth=1.5; ctx.stroke(); }
  /* the container's speed (outside) and the superfluid's (on the ring), both counterclockwise, to scale */
  const vC=B.om, vS=B.n, sc=0.55/Math.max(1,vC,vS);
  for(let k=0;k<12;k++){ const a=k*TAU/12;
    if(sc*vC>0.01) arcArrow(ctx,cx,cy,R+22,a,a+sc*vC,COL.dim,1.2);
    if(sc*vS>0.01) arcArrow(ctx,cx,cy,R,a,a+sc*vS,COL.pos,1.8); }
  lab(ctx,W_STAGE,H_STAGE,cx,cy-8,'the superfluid: '+B.n+' quant'+(B.n===1?'um':'a'),COL.pos,LAB_FONT,'center','middle',PLATE);
  lab(ctx,W_STAGE,H_STAGE,cx,cy+10,'the container: '+fmt(B.om,2)+' Ω₀',COL.dim,LAB_FONT,'center','middle',PLATE);
}
/* an arc from angle a0 to a1 (counterclockwise on the screen) with a head at a1 */
function arcArrow(ctx,cx,cy,r,a0,a1,col,lw){ const n=Math.max(4,Math.ceil(Math.abs(a1-a0)*r/4)), P=[];
  for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; P.push([cx+r*Math.cos(a),cy-r*Math.sin(a)]); }
  ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke();
  const q=P[n-1], p=P[n], L=Math.hypot(p[0]-q[0],p[1]-q[1])||1, ux=(p[0]-q[0])/L, uy=(p[1]-q[1])/L, hh=Math.min(8,0.4*r*Math.abs(a1-a0));
  ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0]-hh*ux+0.5*hh*uy,p[1]-hh*uy-0.5*hh*ux); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0]-hh*ux-0.5*hh*uy,p[1]-hh*uy+0.5*hh*ux); ctx.stroke();
  for(let i=0;i<n;i++) POLY_SEGS.push(P[i][0],P[i][1],P[i+1][0],P[i+1][1]); }
function plotAnnulusL(ctx,b,B){
  const x1=4.4, items=[[COL.pos,'superfluid'],[COL.struct,'a normal fluid',[4,3]]], ttl=titleKey(b,'the superfluid’s share of the angular momentum','its share',items);
  axesT(ctx,b,0,x1,0,2.1,{title:ttl,xlab:'Ω/Ω₀',ylab:'L/IΩ',nx:4,ny:3,xfmt:v=>fmt(v,0),yticks:[0,1,2],yfmt:v=>fmt(v,0)});
  hmark(ctx,b,0,2.1,1,COL.struct,[4,3]);
  const xs=[], ys=[]; for(let i=1;i<=880;i++){ const w=x1*i/880; xs.push(w); ys.push(Math.floor(w+0.5)/w); }
  polyline(ctx,b,xs,ys,0,x1,0,2.1,COL.pos,1.7);
  marker(ctx,b,0,x1,0,2.1,B.om,B.frac,COL.live);
  HIT.push({kind:'aOm',b,lo:0,hi:x1});
  keyRow(ctx,b,items,ttl);
}
function plotRingStairs(ctx,b,B){
  const x1=4.4, ttl=titleFor(b,'a superconducting ring: the flux it holds','the ring’s flux');
  axesT(ctx,b,0,x1,0,4.6,{title:ttl,xlab:'Φ/Φ₀ applied',ylab:'fluxoid n',nx:4,ny:4,xfmt:v=>fmt(v,0),yticks:[0,1,2,3,4],yfmt:v=>fmt(v,0)});
  polyline(ctx,b,[0,x1],[0,x1],0,x1,0,4.6,COL.struct,1.1,[4,3]);
  const xs=[], ys=[]; for(let i=0;i<=880;i++){ const w=x1*i/880; xs.push(w); ys.push(Math.floor(w+0.5)); }
  polyline(ctx,b,xs,ys,0,x1,0,4.6,COL.pos,1.7);
  marker(ctx,b,0,x1,0,4.6,B.om,B.n,COL.live);
}

/* ================================================================== *
 *  the dispatch and the scene                                         *
 * ================================================================== */
function drawView(ctx,W,H,M){
  POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; AXES_BAD=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  if(typeof LEGEND_RECTS!=='undefined') LEGEND_RECTS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='expel') drawExpel(ctx,W,H,M);
  else if(M.view==='wall') drawWall(ctx,W,H,M);
  else if(M.view==='vortex') drawVortex(ctx,W,H,M);
  else if(M.view==='twofluid') drawTwofluid(ctx,W,H,M);
  else if(M.view==='landau') drawLandau(ctx,W,H,M);
  else drawBucket(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  function setFrom(hit,x,y){
    const u=clamp((x-hit.b.x)/hit.b.w,0,1), w=clamp((hit.b.y1-y)/hit.b.h,0,1);
    if(hit.kind==='eLam'){ ST.eLam=clamp(Math.pow(10,hit.lo+(hit.hi-hit.lo)*u),LIM.eLam[0],LIM.eLam[1]); return true; }
    if(hit.kind==='kap'){ ST.kap=clamp(Math.pow(10,hit.lo+(hit.hi-hit.lo)*u),LIM.kap[0],LIM.kap[1]); ST.mat='own'; return true; }
    if(hit.kind==='vPhi'){ ST.vPhi=clamp(-2.5+5*u,LIM.vPhi[0],LIM.vPhi[1]); return true; }
    if(hit.kind==='tT'){ ST.tT=clamp(hit.lo+(hit.hi-hit.lo)*u,LIM.tT[0],LIM.tT[1]); return true; }
    if(hit.kind==='lV'){ ST.lV=clamp(hit.lo+(hit.hi-hit.lo)*w,LIM.lV[0],LIM.lV[1]); return true; }
    if(hit.kind==='lVslope'){ const q=Math.max(0.05,hit.x1*u), e=hit.y1*w; ST.lV=clamp(e/(q*kPerV()),LIM.lV[0],LIM.lV[1]); return true; }
    if(hit.kind==='bOm'){ ST.bOm=clamp(hit.lo+(hit.hi-hit.lo)*u,LIM.bOm[0],LIM.bOm[1]); return true; }
    if(hit.kind==='aOm'){ ST.aOm=clamp(hit.lo+(hit.hi-hit.lo)*u,LIM.aOm[0],LIM.aOm[1]); return true; }
    return false;
  }
  S.pointer=function(type,x,y){
    if(type==='down'){ const hit=hitAt(x,y); if(!hit){ DRAG.what=null; return false; } DRAG.what=hit; return setFrom(hit,x,y); }
    if(type==='move'){ if(!DRAG.what) return false; return setFrom(DRAG.what,x,y); }
    DRAG.what=null; return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k),html:lab})); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg,map){
    if(rows[key]) throw new Error('two sliders for '+key);
    const m=map||{to:v=>v,from:v=>v};
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:m.from(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=m.from(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=m.to(parseFloat(inp.value));
      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; return rowEl;
  }
  const logMap=(lo,hi)=>({to:u=>ofLog(u,lo,hi),from:v=>logOf(v,lo,hi)});
  const logSlider=(key,lab,lo,hi,fmtf,onchg)=>slider(key,lab,0,LOGN,1,fmtf,onchg,logMap(lo,hi));
  function checkbox(key,lab,onchg){
    if(rows['cb_'+key]) throw new Error('two checkboxes for '+key);
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);

    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

    IS:sInt(T_LAMBDA), pf:fountain(T_LAMBDA,0).pf/1e5, rhoL:rhoOf(T_LAMBDA), hL:sInt(T_LAMBDA)*1000/PH.g,
    /* the article's arithmetic, its g = 9.8 included: its 0.692 bar gives its 56 m, and 0.751 bar would give 61.3 */

    /* its own form, int S_m dT/V_m0, with V_m0 the molar volume at T = 0 (Table 2.3's density) */

    mk12:fountain(1.2,1).perMK*100, mk15:fountain(1.5,1).perMK*100, mk20:fountain(2.0,1).perMK*100,
    u2hi:Math.max(...u2d.filter(d=>d[0]>=1.05&&d[0]<=1.3).map(d=>d[1])), u2top:Math.max(...u2d.filter(d=>d[0]>=1.55).map(d=>Math.abs(d[1]))),
    vRot:LANDAU.Delta*PH.kB/(PH.hbar*LANDAU.Q0*1e10),
    a0:a13, ell:Math.log(R1/a13), Oc1:Math.log(R1/a13)*PH.kap4/(2*PI*R1*R1), alpha13:alphaOf(1.3),

const pxVx=()=>memo('vx',String(matOf('nb').kap),()=>glVortex(matOf('nb').kap)).hc1;
const SRC_LINE='Via Wikipedia (wikitext fetched 2026-09-27): &ldquo;2019 revision of the SI&rdquo;, &ldquo;Boltzmann constant&rdquo;, &ldquo;Helium-4&rdquo;, &ldquo;Standard gravity&rdquo; (the constants), &ldquo;Meissner effect&rdquo;, &ldquo;London equations&rdquo;, &ldquo;Heike Kamerlingh Onnes&rdquo;, &ldquo;Ginzburg&ndash;Landau theory&rdquo;, &ldquo;Type-II superconductor&rdquo;, &ldquo;Abrikosov vortex&rdquo;, &ldquo;Magnetic flux quantum&rdquo;, &ldquo;Macroscopic quantum phenomena&rdquo;, &ldquo;Little&ndash;Parks effect&rdquo;, &ldquo;Critical field&rdquo;, &ldquo;List of superconductors&rdquo;, &ldquo;Neodymium magnet&rdquo;, &ldquo;Earnshaw&rsquo;s theorem&rdquo;, &ldquo;Superfluid helium-4&rdquo;, &ldquo;Lambda point&rdquo;, &ldquo;Second sound&rdquo;, &ldquo;Quantum vortex&rdquo;, &ldquo;John F. Allen&rdquo;, &ldquo;Pyotr Kapitsa&rdquo;, &ldquo;Laszlo Tisza&rdquo;, &ldquo;Joe Vinen&rdquo;. CODATA&rsquo;s atomic mass unit and &mu;<sub>0</sub> from NIST. The materials: Delin and Orlando&rsquo;s tables after Donnelly&rsquo;s Physics Vade Mecum. Helium II: R. J. Donnelly and C. F. Barenghi, J. Phys. Chem. Ref. Data 27, 1217 (1998), Tables 2.3, 3.3, 4.3, 7.4, 8.5, 11.3, 13.3, 20.1 and 20.2. Hess and Fairbank (1967) and Yarmchuk, Gordon and Packard (1979), their abstracts. build_msf/derive.py recomputes every number here by independent routes, and selfTest pins the page to it.';
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }

const INFO={
  expel:()=>'In '+DATA.onnes_1911+' Kamerlingh Onnes found that the resistance of mercury vanishes at 4.2 K. A metal with no resistance at all, a <b>perfect conductor</b>, would keep whatever field it held when its resistance went: any change would drive currents that flow for ever and cancel it, so its magnetic state would depend on its history. In '+DATA.meissner_1933+' Meissner and Ochsenfeld found that a superconductor does more. Cooled in a field, tin and lead pushed it out. The superconductor&rsquo;s state does not depend on its history, and inside it B = 0 (&chi; = &minus;1, perfect diamagnetism): the <b>Meissner effect</b>. Fritz and Heinz London ('+DATA.london_1935+') wrote it as an equation, &nabla;&sup2;B = B/&lambda;&sup2;: the field dies within the <b>penetration depth</b> &lambda; of the surface, typically 50 to 500 nm. A sphere is screened by currents in a shell about &lambda; deep, and the field squeezed round it reaches 3/2 of the applied field at the equator, so a type I sphere starts to let the field in, in layers, once the applied field reaches 2/3 of B<sub>c</sub> (at &lambda;/a = '+sigf(DEFAULTS.eLam,2)+', '+fmt(PX.onset08,3)+'). <b>A magnet over a plate</b>: lowering a magnet onto a plate already superconducting does not show the Meissner effect, since a perfect conductor would push back just the same; a magnet at rest that rises as the plate is cooled does. A diamagnet can hold a magnet in stable balance, which Earnshaw&rsquo;s theorem forbids for magnets alone. An NdFeB ball 5 mm in radius (B<sub>r</sub> = '+fmt(DATA.ndfeb_br,1)+' T) floats flat at '+fmt(PX.zF,2)+' mm, where the field on the plate is at most '+fmt(PX.bMax,2)+' mT: below lead&rsquo;s '+fmt(DATA.vm_pb[4],0)+' mT, so a lead plate would hold it.',
  wall:()=>{ const X=pxWall(); return 'Ginzburg and Landau ('+DATA.gl_1950+') described a superconductor by an order parameter &psi;, whose square counts the superconducting electrons, coupled to the field. It brings a second length: &psi; recovers from a disturbance over the <b>coherence length</b> &xi;, while the field dies over &lambda;. Their ratio &kappa; = &lambda;/&xi; sorts superconductors into two kinds. Picture the wall between normal metal and superconductor at the critical field H<sub>c</sub>, where the two states have equal energy. Where the field has been pushed out but &psi; has not yet grown, the metal pays to hold the field off without the condensation energy that should pay for it; where &psi; has grown but the field still enters, it gains both. If &xi; is the longer the cost wins, the wall&rsquo;s energy is positive, and the metal expels the field whole up to H<sub>c</sub>: <b>type I</b>. If &lambda; is the longer the energy is negative, and once the field is strong enough the metal fills with walls, which is to say with flux lines: <b>type II</b>. The dividing line is exactly &kappa; = 1/&radic;2, where the wall costs nothing. Lead (&kappa; = '+sigf(matOf('pb').kap,2)+' in the table, &delta; = '+sgn(X.pb,2)+' &lambda;) is of type I; niobium ('+sigf(matOf('nb').kap,3)+', &delta; = '+sgn(X.nb,2)+' &lambda;) and every alloy and compound in the table are of type II. A type II superconductor keeps the field out entirely only below H<sub>c1</sub>, lets it in as vortices up to H<sub>c2</sub> = &radic;2&kappa;H<sub>c</sub>, and goes normal above. Ginzburg and Abrikosov each received a third of the '+DATA.gl_nobel+' Nobel Prize for this.'; },
  vortex:()=>'Abrikosov ('+DATA.abrik_1957+') solved Ginzburg and Landau&rsquo;s equations for a type II superconductor and found the field entering as lines, each a whirl of current round a normal core about &xi; across, carrying exactly one <b>flux quantum</b> &Phi;<sub>0</sub> = h/2e = '+fmt(PH.Phi0*1e15,4)+' &times; 10<sup>&minus;15</sup> Wb, arranged in a regular lattice. The flux comes in quanta because the pairs share one wave with one phase: round any loop the phase must come back to itself, so the fluxoid, the flux plus a term from the current, is a whole number of h/2e. The 2e is the charge of a pair. Deaver and Fairbank, and Doll and N&auml;bauer, measured the quantum in '+DATA.fq_1961+'; the Earth&rsquo;s 50 &mu;T puts one quantum through a square '+fmt(PX.earth,2)+' &mu;m on a side (the Macroscopic quantum phenomena article: '+DATA.mqp_earth+' &mu;m by '+DATA.mqp_earth+' &mu;m). Near H<sub>c2</sub> the lattice&rsquo;s |&psi;|&sup2; is Abrikosov&rsquo;s sum of Gaussians. The triangle&rsquo;s &beta; = &lang;|&psi;|<sup>4</sup>&rang;/&lang;|&psi;|&sup2;&rang;&sup2; is '+fmt(abrBeta('tri',96),4)+', below the square&rsquo;s '+fmt(abrBeta('sq',96),4)+', and the lower &beta; has the lower free energy, so the lattice is triangular. At low field each line is London&rsquo;s K<sub>0</sub> tube, about &lambda; across. A ring shows the same quantum: its T<sub>c</sub> dips as the flux through it moves away from a whole number of h/2e and recovers at the next (Little and Parks, '+DATA.lp_1962+').',
  twofluid:()=>'Helium-4 does not freeze at ordinary pressure. Below the lambda point, T<sub>&lambda;</sub> = '+fmt(T_LAMBDA,4)+' K, it becomes <b>helium II</b>, which flows through the finest channels with no viscosity (Kapitsa, and Allen and Misener, in '+DATA.he_1937+', side by side in Nature in January '+DATA.he_1938+'). Tisza and Landau described it as two fluids moving through each other: a <b>superfluid</b> with no viscosity and no entropy, and a <b>normal fluid</b> that carries all the heat. Landau (Nobel Prize '+DATA.landau_nobel+') identified the normal fluid as the gas of the liquid&rsquo;s excitations, phonons and rotons, whose momentum a moving wall drags along. From the measured spectrum (the next view) his formula gives the normal fraction within '+fmt(100*Math.abs(PX.lanWorst[1]),1)+' % of the measured one up to 1.6 K. Nearer T<sub>&lambda;</sub> it falls short ('+fmt(PX.rn20L,2)+' against '+fmt(PX.rn20,2)+' at 2.0 K): the excitations crowd and interact, and the spectrum itself softens as the liquid warms, which a fixed low-temperature spectrum leaves out. The superfluid carries no entropy, so it flows toward heat. In the <b>fountain effect</b> a heater raises the level behind a superleak by &Delta;p = &rho;S&Delta;T: '+fmt(PX.mk12,2)+' cm per millikelvin at 1.2 K, '+fmt(PX.mk15,2)+' at 1.5 K, '+fmt(PX.mk20,2)+' at 2.0 K. From 0 all the way to T<sub>&lambda;</sub> it holds '+fmt(PX.pf,3)+' bar, a column '+fmt(PX.hL,1)+' m high. The Superfluid helium-4 article gives '+fmt(DATA.fountain_bar,3)+' bar and '+DATA.fountain_56+' m: its '+DATA.fountain_56+' m is its '+fmt(DATA.fountain_bar,3)+' bar over a density of '+DATA.fountain_rho+' kg/m&sup3; (helium II at T<sub>&lambda;</sub> is '+fmt(PX.rhoL,0)+' kg/m&sup3;), and its own formula with Donnelly and Barenghi&rsquo;s entropies gives '+fmt(PX.pfMol,3)+' bar. The two fluids also carry a wave of temperature without one of pressure, <b>second sound</b> (Peshkov, '+DATA.peshkov_1944+'), about '+DATA.second_20+' m/s near 1.8 K. The two-fluid formula from the measured tables matches it within '+fmt(100*PX.u2top,1)+' % above 1.55 K and runs up to '+fmt(100*PX.u2hi,1)+' % high between 1.05 and 1.3 K.',
  landau:()=>'Why does the superfluid flow without friction? Landau&rsquo;s answer uses only the spectrum of the excitations. A heavy body moving through the still liquid at v can slow down only by making excitations, and one of momentum p and energy E(p) can be made only if E(p) = pv cos&theta; for some angle &theta;: only if v &ge; E/p. If v lies below every E/p, nothing can be made and the flow has no drag. That is <b>Landau&rsquo;s criterion</b>, v<sub>L</sub> = min E(p)/p. A gas of free particles has E = p&sup2;/2m, whose E/p falls to 0: any flow can be slowed, and nothing about it is super. Helium&rsquo;s measured spectrum (Donnelly and Barenghi&rsquo;s recommended values) rises as sound, E = &hbar;u<sub>1</sub>Q with u<sub>1</sub> = '+fmt(LANDAU.u1,1)+' m/s, bends over at the maxon, and dips to the <b>roton</b> minimum, &Delta;/k = '+fmt(LANDAU.Delta,3)+' K at Q<sub>0</sub> = '+fmt(LANDAU.Q0,3)+' &Aring;<sup>&minus;1</sup>. The line from the origin that touches it gives v<sub>L</sub> = '+fmt(LANDAU.vL,2)+' m/s at Q* = '+fmt(LANDAU.Qs,3)+' &Aring;<sup>&minus;1</sup>, just past the minimum (the minimum alone, &Delta;/&hbar;Q<sub>0</sub>, gives '+fmt(PX.vRot,2)+' m/s). Real flows lose their superflow far below this, at a critical velocity usually set by the width of the channel (the Superfluid helium-4 article): quantized vortices, the last view&rsquo;s subject, are cheaper to make than rotons.',
  bucket:()=>'A superfluid is one wave, and its velocity is the gradient of the wave&rsquo;s phase, v<sub>s</sub> = (&hbar;/m<sub>4</sub>)&nabla;&phi;. So it cannot turn like a solid body, whose curl is 2&Omega; everywhere: round any loop its circulation is a whole number of <b>&kappa; = h/m<sub>4</sub></b> = '+fmt(PH.kap4*1e8,4)+' &times; 10<sup>&minus;8</sup> m&sup2;/s. It turns only on <b>quantized vortex lines</b> (Onsager, '+DATA.onsager_1949+'; Feynman, '+DATA.feynman_1955+'), round each of which the liquid swirls at &kappa;/2&pi;r: '+fmt(PX.v1A,1)+' m/s 1 &Aring; from the axis (the Macroscopic quantum phenomena article: '+DATA.mqp_160+' m/s), with a core about '+DATA.mqp_core+' &Aring; across. In a turning bucket a line costs its own energy, (&rho;&kappa;&sup2;/4&pi;) ln(R/a<sub>0</sub>) per length, and pays with the angular momentum it carries: the first pays for itself at &Omega;<sub>c1</sub> = (&kappa;/2&pi;R&sup2;) ln(R/a<sub>0</sub>), '+fmt(PX.Oc1,4)+' rad/s for a bucket 1 mm in radius at 1.3 K, and below that the liquid stays perfectly still. Faster, the lines come in one at a time and settle into rings and then a lattice that mimics solid rotation on average, 2&Omega;/&kappa; lines per area (Feynman). Hall and Vinen established the lines in the 1950s; Yarmchuk, Gordon and Packard ('+DATA.ygp_year+') photographed stationary arrays of them. Near H<sub>c2</sub> a type II superconductor poses the same problem (the Type-II superconductor article). <b>A thin annulus</b> shows the neutral superfluid&rsquo;s Meissner effect: its circulation must be a whole number of quanta, so it takes the whole number nearest &Omega;/&Omega;<sub>0</sub>, and below half a quantum it does not turn at all. Hess and Fairbank ('+DATA.hf_year+') saw the superfluid form at zero angular momentum in a slowly turning container. For an annulus 1 cm in radius &Omega;<sub>0</sub> is '+sigf(PX.Om0a*1e4,4)+' &times; 10<sup>&minus;4</sup> rad/s, one turn in '+fmt(PX.turnA,2)+' hours.'
};
const DERIV={
  expel:()=>'<h4>London&rsquo;s equation</h4>'
    +EQ(1,'&nabla;&sup2;B = '+FR('B','&lambda;&sup2;')+', &nbsp; &lambda; = &radic;(m/&mu;<sub>0</sub>n<sub>s</sub>e&sup2;)')
    +'<p>The London equations article. In a slab the field falls as B<sub>0</sub>e<sup>&minus;x/&lambda;</sup>.</p>'
    +'<h4>a sphere</h4>'
    +EQ(2,'A<sub>&phi;</sub> = C i<sub>1</sub>(r/&lambda;) sin&theta; &nbsp;(r &lt; a), &nbsp; B('+FR('r','2')+' + '+FR('Da&sup3;','r&sup2;')+') sin&theta; &nbsp;(r &gt; a)')
    +'<p>i<sub>1</sub>(x) = (x cosh x &minus; sinh x)/x&sup2;, the modified spherical Bessel function that solves [1] for a vector potential along &phi;. Matching A<sub>&phi;</sub> and its slope at r = a fixes C and D; the moment is m = 4&pi;Da&sup3;B/&mu;<sub>0</sub>, and the field lines are the level lines of the flux function r sin&theta; A<sub>&phi;</sub>.</p>'
    +EQ(3,'m/m<sub>&infin;</sub> = 1 &minus; 3'+FR('&lambda;','a')+'coth'+FR('a','&lambda;')+' + 3'+FR('&lambda;&sup2;','a&sup2;')+', &nbsp; m<sub>&infin;</sub> = &minus;2&pi;a&sup3;B/&mu;<sub>0</sub>')
    +'<p>For &lambda; &#8810; a it is 1 &minus; 3&lambda;/a, all but a shell &lambda; deep; for &lambda; &#8811; a it is a&sup2;/15&lambda;&sup2; (the dashed curve). At &lambda;/a = '+sigf(DEFAULTS.eLam,2)+' it is '+fmt(PX.s08,4)+'. Just outside the equator B = (1 + m/2m<sub>&infin;</sub>)B, 3B/2 as &lambda; &rarr; 0, so the equator reaches B<sub>c</sub> when B = B<sub>c</sub>/(1 + m/2m<sub>&infin;</sub>).</p>'
    +EQ(4,'B = B<sub>cool</sub> + (B<sub>now</sub> &minus; B<sub>cool</sub>) B<sub>London</sub>')
    +'<p>A perfect conductor: a change of field drives currents that screen the change, over the same depth, while the field it cooled in stays frozen (the Meissner effect article: it &ldquo;has no mechanism for flux expulsion&rdquo;).</p>'
    +'<h4>a magnet over a plate</h4>'
    +EQ(5,'m<sub>image</sub> = (m<sub>x</sub>, m<sub>y</sub>, &minus;m<sub>z</sub>) at &minus;z: &nbsp; U = '+FR('&mu;<sub>0</sub>m&sup2;(1 + cos&sup2;&alpha;)','64&pi;z&sup3;'))
    +'<p>An image dipole at the mirror point keeps the field normal to the plate zero at its surface; an induced image&rsquo;s energy is half the dipole&rsquo;s energy in its field. &alpha; is the tilt from upright. The push is 3U/z and the twist &mu;<sub>0</sub>m&sup2; sin 2&alpha;/64&pi;z&sup3;, which lays the ball flat.</p>'
    +EQ(6,'m = '+FR('4&pi;R&sup3;B<sub>r</sub>','3&mu;<sub>0</sub>')+', &nbsp; z<sub>flat</sub> = '+FR('3&mu;<sub>0</sub>m&sup2;','64&pi;Mg')+'<sup>1/4</sup>, &nbsp; f = '+FR('&radic;(4g/z)','2&pi;'))
    +'<p>For R = 5 mm: '+fmt(PX.zF,2)+' mm flat, '+fmt(PX.zU,2)+' mm upright, bobbing at '+fmt(PX.fB,2)+' Hz. The largest field on the plate, '+fmt(PX.bMax,2)+' mT, is right under the ball. The motion is damped to settle in about a second, and a plate cooled with the ball on it expels over one second: both are modelling choices (a Meissner plate barely damps a ball, and an instant expulsion would throw it at hundreds of g).</p>',
  wall:()=>{ const X=pxWall(); return '<h4>Ginzburg and Landau&rsquo;s equations</h4>'
    +EQ(1,'('+FR('&minus;i&nabla;','&kappa;')+' &minus; A)&sup2;&psi; &minus; &psi; + |&psi;|&sup2;&psi; = 0, &nbsp; &nabla;&times;&nabla;&times;A = &minus;'+FR('i','2&kappa;')+'(&psi;*&nabla;&psi; &minus; &psi;&nabla;&psi;*) &minus; |&psi;|&sup2;A')
    +'<p>The Ginzburg&ndash;Landau article&rsquo;s dimensionless form: lengths in &lambda;, fields in &radic;2H<sub>c</sub>, &psi; in its value deep inside.</p>'
    +EQ(2,"f&Prime; = &kappa;&sup2;(a&sup2;f &minus; f + f&sup3;), &nbsp; a&Prime; = f&sup2;a, &nbsp; b = a&prime;")
    +'<p>A flat wall: &psi; = f(x), A = a(x) along the wall. On the normal side f = 0 and b = h = 1/&radic;2, the critical field; on the superconducting side f = 1 and b = 0.</p>'
    +EQ(3,'&sigma; = &int;[(b &minus; h)&sup2; &minus; f<sup>4</sup>/2] dx, &nbsp; &delta; = 2&sigma;')
    +'<p>The wall&rsquo;s energy per area, in &mu;<sub>0</sub>H<sub>c</sub>&sup2;&lambda; (once [2] holds the free energy reduces to this); &delta; is the same as a length, in units of &mu;<sub>0</sub>H<sub>c</sub>&sup2;/2. At &kappa; = 1/&radic;2 the equations fall to first order and &sigma; = 0 exactly. The limits: &delta; &rarr; (4&radic;2/3)&xi; = '+fmt(PX.dLo,4)+'&xi; as &kappa; &rarr; 0, and &minus;(8/3)(&radic;2 &minus; 1)&lambda; = &minus;'+fmt(PX.dHi,4)+'&lambda; as &kappa; &rarr; &infin;. Lead: '+sgn(X.pb,4)+' &lambda;; niobium: '+sgn(X.nb,4)+' &lambda;.</p>'
    +'<p>The page solves [2] by Newton&rsquo;s method on finite differences (a 2&times;2 block-tridiagonal solve), stepping &kappa; out from 1/&radic;2 by factors of 2<sup>1/4</sup> so that each solve starts near its answer, on two grids combined by Richardson&rsquo;s extrapolation.</p>'
    +EQ(4,'H<sub>c2</sub> = &radic;2&kappa;H<sub>c</sub>, &nbsp; H<sub>c1</sub> = &epsilon;<sub>1</sub>/&Phi;<sub>0</sub>, &nbsp; H<sub>c</sub>(T) = H<sub>c</sub>(0)(1 &minus; T&sup2;/T<sub>c</sub>&sup2;)')
    +'<p>H<sub>c1</sub> is where the field pays for one vortex&rsquo;s line energy &epsilon;<sub>1</sub> (the next view solves the vortex). The Critical field article&rsquo;s parabola scales all three; &kappa; is held at its tabulated value.</p>'; },
  vortex:()=>'<h4>the fluxoid</h4>'
    +EQ(1,'v<sub>s</sub> = '+FR('1','m')+'('+FR('h','2&pi;')+'&nabla;&phi; &minus; qA), &nbsp; m = 2m<sub>e</sub>, q = &minus;2e')
    +EQ(2,'m&oint;v<sub>s</sub>&middot;dl + q&Phi; = nh &nbsp;&rArr;&nbsp; &Phi; + '+FR('m','q')+'&oint;v<sub>s</sub>&middot;dl = n'+FR('h','q'))
    +'<p>The Macroscopic quantum phenomena article: the pairs&rsquo; wave is single-valued, so its phase advances by a whole number of 2&pi; round any loop. Deep inside the metal v<sub>s</sub> = 0, and the flux alone is a whole number of h/2e.</p>'
    +'<h4>one vortex</h4>'
    +EQ(3,'f&Prime; + f&prime;/r = &kappa;&sup2;(Q&sup2;f &minus; f + f&sup3;), &nbsp; a&Prime; + a&prime;/r &minus; a/r&sup2; = f&sup2;Q, &nbsp; Q = a &minus; 1/&kappa;r')
    +'<p>&psi; = f(r)e<sup>i&phi;</sup> and A = a(r) round the axis, in the article&rsquo;s units; the flux is 2&pi;/&kappa;, one h/2e. Solved as the wall is. Far out B = (&Phi;<sub>0</sub>/2&pi;&lambda;&sup2;)K<sub>0</sub>(r/&lambda;) (the Abrikosov vortex article; the dashed curve). For niobium H<sub>c1</sub> = '+fmt(pxVx(),4)+' H<sub>c</sub>.</p>'
    +'<h4>the lattice</h4>'
    +EQ(4,'&psi; = &Sigma;<sub>n</sub> C<sub>n</sub>e<sup>inqy</sup>e<sup>&minus;(x &minus; nq)&sup2;/2</sup>, &nbsp; &beta; = &lang;|&psi;|<sup>4</sup>&rang;/&lang;|&psi;|&sup2;&rang;&sup2;')
    +'<p>Abrikosov&rsquo;s solution just below H<sub>c2</sub>, lengths in the magnetic length (&xi; at H<sub>c2</sub>). C<sub>n</sub> = e<sup>i&pi;n&sup2;/2</sup> with q&sup2; = &radic;3&pi; makes the triangle (&beta; = '+fmt(abrBeta('tri',96),7)+'); C<sub>n</sub> = 1 with q&sup2; = 2&pi; the square ('+fmt(abrBeta('sq',96),7)+'). The free energy below the normal state&rsquo;s goes as (H<sub>c2</sub> &minus; H)&sup2;/(2&kappa;&sup2; &minus; 1)&beta;: the lower &beta; wins. One quantum per cell: a = (2&Phi;<sub>0</sub>/&radic;3B)<sup>1/2</sup>.</p>'
    +EQ(5,'B(r) = '+FR('&Phi;<sub>0</sub>','2&pi;&lambda;&sup2;')+'&Sigma;<sub>i</sub> K<sub>0</sub>(|r &minus; R<sub>i</sub>|/&lambda;)')
    +'<p>London&rsquo;s lattice at low field: the tubes add. The page sums them out to 14&lambda;, cut at the core.</p>'
    +'<h4>a ring</h4>'
    +EQ(6,'&Delta;T<sub>c</sub>/T<sub>c</sub> = &minus;(&xi;(0)/R)&sup2;(n* &minus; &Phi;/&Phi;<sub>0</sub>)&sup2;')
    +'<p>A thin ring holds the fluxoid n* nearest &Phi;/&Phi;<sub>0</sub>; the current that makes up the difference costs condensation energy, and T<sub>c</sub> falls in parabolas with the period h/2e &asymp; '+fmt(DATA.lp_period,2)+' &times; 10<sup>&minus;15</sup> T m&sup2; (the Little&ndash;Parks article).</p>',
  twofluid:()=>'<h4>Landau&rsquo;s normal fluid</h4>'
    +EQ(1,'&rho;<sub>n</sub> = '+FR('1','3kT')+'&int;p&sup2;n(1 + n)'+FR('d&sup3;p','(2&pi;&hbar;)&sup3;')+' = '+FR('&hbar;&sup2;','6&pi;&sup2;kT')+'&int;Q<sup>4</sup>n(1 + n) dQ, &nbsp; n = '+FR('1','e<sup>E/kT</sup> &minus; 1'))
    +'<p>A wall moving at v drags the gas of excitations along, and their momentum per volume is &rho;<sub>n</sub>v. The page integrates over the measured spectrum by Simpson&rsquo;s rule. The dashed curves are the two closed forms:</p>'
    +EQ(2,'&rho;<sub>n</sub> = '+FR('2&pi;&sup2;(kT)<sup>4</sup>','45&hbar;&sup3;u<sub>1</sub><sup>5</sup>')+' (phonons), &nbsp; '+FR('2&radic;&mu; p<sub>0</sub><sup>4</sup>','3(2&pi;)<sup>3/2</sup>&hbar;&sup3;&radic;(kT)')+'e<sup>&minus;&Delta;/kT</sup> (rotons)')
    +'<p>The measured normal fraction is from Donnelly and Barenghi&rsquo;s Table 2.3 densities.</p>'
    +'<h4>the fountain</h4>'
    +EQ(3,'dp/dT = &rho;S, &nbsp; h = S&Delta;T/g, &nbsp; p(T<sub>&lambda;</sub>) = &rho;&int;<sub>0</sub><sup>T<sub>&lambda;</sub></sup>S dT')
    +'<p>In balance the superfluid&rsquo;s chemical potential is the same on both sides of the superleak, so a step in temperature holds a step in pressure. The trapezoid on Donnelly and Barenghi&rsquo;s entropy table gives &int;S dT = '+fmt(PX.IS,4)+' J/g, so '+fmt(PX.pf,4)+' bar with &rho; = '+fmt(PX.rhoL,1)+' kg/m&sup3;, and a column &int;S dT/g = '+fmt(PX.hL,2)+' m of helium II. The article&rsquo;s '+fmt(DATA.fountain_bar,3)+' bar over its '+DATA.fountain_rho+' kg/m&sup3; gives its '+DATA.fountain_56+' m ('+fmt(PX.hArt,1)+'); '+fmt(PX.pf,4)+' bar over the same density would give '+fmt(PX.h125,1)+' m.</p>'
    +'<h4>second sound</h4>'
    +EQ(4,'u<sub>2</sub>&sup2; = '+FR('&rho;<sub>s</sub>','&rho;<sub>n</sub>')+FR('TS&sup2;','C'))
    +'<p>From the tables of &rho;<sub>s</sub>, &rho;<sub>n</sub>, S and C at saturated vapour pressure, against the measured second sound (Table 4.3, the dots).</p>',
  landau:()=>'<h4>the criterion</h4>'
    +EQ(1,'&frac12;MV&sup2; = &frac12;MV&prime;&sup2; + E(p), &nbsp; MV = MV&prime; + p &nbsp;&rArr;&nbsp; E(p) = pV cos&theta; &minus; '+FR('p&sup2;','2M'))
    +'<p>A body of mass M at V making one excitation: for a heavy body the last term goes, and it can be made only if V cos&theta; = E/p, so only if V &ge; E/p. It leaves at cos&theta; = E/pV (the lower right plot).</p>'
    +EQ(2,'v<sub>L</sub> = min<sub>p</sub> '+FR('E(p)','p'))
    +EQ(3,'E &asymp; &Delta; + '+FR('(p &minus; p<sub>0</sub>)&sup2;','2&mu;')+' &nbsp;&rArr;&nbsp; v<sub>L</sub> &asymp; '+FR('&Delta;','p<sub>0</sub>'))
    +'<h4>the measured spectrum</h4>'
    +'<p>Below 0.15 &Aring;<sup>&minus;1</sup> the phonon line &hbar;u<sub>1</sub>Q(1 + &gamma;Q&sup2;), with u<sub>1</sub> = '+fmt(LANDAU.u1,1)+' m/s (first sound as T &rarr; 0, Table 3.3) and &gamma; = '+fmt(LANDAU.gam,4)+' &Aring;&sup2; set so that it meets the table; above, a natural cubic spline through Table 13.3. Its minimum: &Delta;/k = '+fmt(LANDAU.Delta,4)+' K at Q<sub>0</sub> = '+fmt(LANDAU.Q0,4)+' &Aring;<sup>&minus;1</sup>, and &mu; = '+fmt(LANDAU.mu,4)+' m<sub>4</sub> from the spline&rsquo;s curvature there. Landau&rsquo;s velocity, the tangent from the origin: '+fmt(LANDAU.vL,3)+' m/s at Q* = '+fmt(LANDAU.Qs,4)+' &Aring;<sup>&minus;1</sup>; &Delta;/&hbar;Q<sub>0</sub> alone gives '+fmt(PX.vRot,2)+' m/s.</p>',
  bucket:()=>'<h4>the quantum of circulation</h4>'
    +EQ(1,'&oint;v<sub>s</sub>&middot;dl = n&kappa;, &nbsp; &kappa; = h/m<sub>4</sub>, &nbsp; v = '+FR('&kappa;','2&pi;r'))
    +'<h4>lines in a turning bucket</h4>'
    +EQ(2,'F = N(&ell; &minus; &omega;) + &Sigma;<sub>j</sub>[ln(1 &minus; r<sub>j</sub>&sup2;) + &omega;r<sub>j</sub>&sup2;] + &Sigma;<sub>j&ne;k</sub>ln'+FR('|1 &minus; z<sub>j</sub>z<sub>k</sub>*|','|z<sub>j</sub> &minus; z<sub>k</sub>|'))
    +'<p>E &minus; &Omega;L per length for N straight lines at z<sub>j</sub> in a bucket of radius 1, in units &rho;&kappa;&sup2;/4&pi;, with &omega; = &Omega;/&Omega;<sub>0</sub>, &Omega;<sub>0</sub> = &kappa;/2&pi;R&sup2; and &ell; = ln(R/a<sub>0</sub>); each line&rsquo;s image at 1/z<sub>j</sub>* keeps the wall a streamline. The core a<sub>0</sub> is 0.45 of Donnelly and Barenghi&rsquo;s displacement length (Tables 20.1 and 20.2): '+fmt(PX.a0*1e10,3)+' &Aring; at 1.3 K, so &ell; = '+fmt(PX.ell,3)+' for R = 1 mm.</p>'
    +EQ(3,'&Omega;<sub>c1</sub> = '+FR('&kappa;','2&pi;R&sup2;')+' ln'+FR('R','a<sub>0</sub>'))
    +'<p>One line on the axis: F = &ell; &minus; &omega;. The N-th line comes in where the least F of N lines falls below that of N &minus; 1. Those are rings of N, or rings round one on the axis, each at its best radius by a golden-section search; the twin&rsquo;s search over free arrangements finds nothing lower up to eight.</p>'
    +EQ(4,'dz<sub>j</sub>/dt = (1 &minus; i&alpha;)v<sub>j</sub>, &nbsp; v<sub>j</sub> = the flow of the other lines and all the images, less i&Omega;z<sub>j</sub>')
    +'<p>In the turning frame each line drifts with the superfluid, and mutual friction with the normal fluid, which turns with the bucket, adds &alpha; times that across it, down the free energy (&alpha; = '+fmt(PX.alpha13,3)+' at 1.3 K, Table 11.3). A line is let in near the wall while the bucket holds fewer than it should, and one that reaches the wall is gone.</p>'
    +EQ(5,'n<sub>v</sub> = '+FR('2&Omega;','&kappa;')+' &nbsp;&rArr;&nbsp; N = &Omega;/&Omega;<sub>0</sub> &nbsp;(Feynman)')
    +'<h4>the annulus</h4>'
    +EQ(6,'E &minus; &Omega;L = '+FR('M','2')+'('+FR('&kappa;','2&pi;R')+')&sup2;(n &minus; &Omega;/&Omega;<sub>0</sub>)&sup2; + const')
    +'<p>A thin annulus: v<sub>s</sub> = n&kappa;/2&pi;R, so the superfluid takes the whole number n* nearest &Omega;/&Omega;<sub>0</sub>, as a superconducting ring takes the fluxoid nearest &Phi;/&Phi;<sub>0</sub>.</p>'
};


/* ================================================================== *
 *  selfTest — headless verification.  REF is build_cg/refvals.json,   *
 *  the printed output of derive.py (sympy, numpy, mpmath), read in    *
 *  full.  makeShot: the recording context (build_aa lineage).          *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };

     for word, and every box stay put between two far-apart states of each dragged quantity ---------- */
  { const S=makeScene({getContext:()=>makeShot(1100,712)});
    const CAPS={expel:M=>expelCaption(M.E),wall:M=>wallCaption(M.Wl),vortex:M=>vortexCaption(M.X),twofluid:M=>tfCaption(M.T),landau:M=>landauCaption(M.L),bucket:M=>bucketCaption(M.B)};
    const DRAGS=[[{view:'expel',eNow:0.7},'eLam',[[0.02,0.5],[0.98,0.5]]],[{view:'wall'},'kap',[[0.03,0.5],[0.97,0.5]]],[{view:'vortex',mat:'nb',kap:matOf('nb').kap},'vPhi',[[0.1,0.5],[0.9,0.5]]],
      [{view:'twofluid'},'tT',[[0.02,0.5],[0.98,0.5]]],[{view:'landau'},'lV',[[0.5,0.97],[0.5,0.03]]],[{view:'landau'},'lVslope',[[0.9,0.9],[0.1,0.1]]],
      [{view:'bucket',bPlay:false},'bOm',[[0.05,0.5],[0.95,0.5]]],[{view:'bucket',bMode:'annulus'},'aOm',[[0.05,0.5],[0.95,0.5]]]];
    for(const [over,kind,pts] of DRAGS) withState(over,()=>{ S.draw(); const h=HIT.find(q=>q.kind===kind); if(!h){ ok(false,kind+': a plot to drag'); return; }
      const caps=[], boxes=[], vals=[];
      for(const [u,v] of pts){ S.pointer('down',h.b.x+h.b.w*u,h.b.y+h.b.h*v); S.pointer('up',0,0); S.draw(); const M=buildModel();
        caps.push(JSON.stringify(CAPS[ST.view](M))); boxes.push(JSON.stringify(HIT.map(q=>[q.kind,q.b.x,q.b.y,q.b.w,q.b.h]))); vals.push(JSON.stringify(ST)); }
      ok(vals[0]!==vals[1],kind+': the two presses set different states');
      ok(caps[0]===caps[1],kind+': the caption does not change with the drag, word for word'); ok(boxes[0]===boxes[1],kind+': nor does any box'); }); }

  /* ---------- 10c. the colours the captions name are the colours drawn (the Known-bad entry of 2026-09-27 h) ---------- */
  { const hue=css=>{ const [r,g,b]=toRgb(css); if(g>r&&r>b) return 'green'; if(b>r&&g>r) return 'cyan'; if(r>g&&g>b) return 'orange'; if(r>g&&b>g) return 'magenta'; return 'other'; };
    const lum=css=>{ const c=toRgb(css); return 0.3*c[0]+0.59*c[1]+0.11*c[2]; };
    has(wallCaption(withState({view:'wall'},()=>buildModel().Wl)).main,'the order ψ (green)','the wall\'s caption names the order green');
    for(const [m,type] of [['pb',1],['nb',2]]) withState({view:'wall',mat:m,kap:matOf(m).kap},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
      const long=c.ops.filter(o=>o.op==='stroke'&&o.paths&&o.paths.reduce((n,p)=>n+p.length,0)>200), pts=o=>[].concat(...o.paths), rising=o=>{ const p=pts(o); return p[p.length-1][1]<p[0][1]; };
      ok(long.some(o=>hue(o.style)==='green'&&rising(o)),m+': the order, named green, is drawn green, rising into the superconductor');
      ok(long.some(o=>hue(o.style)==='cyan'&&!rising(o)),m+': the field, named cyan, is drawn cyan, falling');
      const fills=c.ops.filter(o=>o.op==='fill'&&o.paths&&o.paths.length&&/^rgba/.test(o.style)), cost=fills.find(o=>hue(o.style)==='orange'), gain=fills.find(o=>hue(o.style)==='green');
      ok(!!cost&&!!gain,m+': both shadings are drawn');
      if(cost&&gain){ const pc=pts(cost), pg=pts(gain), Y0=pc[0][1];
        ok(pc.every(p=>p[1]<=Y0+1e-9)&&pg.every(p=>p[1]>=Y0-1e-9),m+': the cost, named orange, lies above zero, and the gain, named green, below');
        ok(type===1?pc.some(p=>p[1]<Y0-1):pg.some(p=>p[1]>Y0+1),m+': '+(type===1?'type I pays':'type II gains')); } });
    withState({view:'landau',lV:70},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
      const two=c.ops.filter(o=>o.op==='stroke'&&o.paths&&o.paths.length===1&&o.paths[0].length===2), pv=two.find(o=>hue(o.style)==='magenta'), lan=two.find(o=>hue(o.style)==='orange');
      ok(!!pv&&!!lan&&Math.hypot(pv.paths[0][0][0]-lan.paths[0][0][0],pv.paths[0][0][1]-lan.paths[0][0][1])<1e-6,'the line pv (named magenta) and Landau\'s line (named orange) both leave the origin');
      if(pv&&lan){ const sl=o=>(o.paths[0][1][1]-o.paths[0][0][1])/(o.paths[0][1][0]-o.paths[0][0][0]); close(sl(lan)/sl(pv),LANDAU.vL/70,1e-9,'  their slopes in the ratio v_L : v'); } });
    withState({view:'bucket'},()=>{ for(let i=0;i<900;i++) runStep(ST); const B=buildModel().B, c=makeShot(1100,712); drawView(c,1100,712,buildModel());
      const dots=c.ops.filter(o=>o.op==='fill'&&hue(o.style)==='magenta'); ok(B.N>0&&dots.length>=B.N,'the lines, named magenta, are drawn magenta ('+dots.length+' for '+B.N+')'); });
    withState({view:'vortex',mat:'nb',kap:matOf('nb').kap},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel());
      ok(c.ops.some(o=>o.op==='stroke'&&o.style==='#ffffff'&&o.paths&&o.paths.length===1&&o.paths[0].length===4),'one quantum\'s cell is outlined, as the caption says');
      const cells=c.ops.filter(o=>o.op==='fill'&&o.bb&&/^rgb\(/.test(o.style)); const x0=Math.min(...cells.map(o=>o.bb[0])), x1=Math.max(...cells.map(o=>o.bb[2])), y0=Math.min(...cells.map(o=>o.bb[1])), y1=Math.max(...cells.map(o=>o.bb[3]));
      const cx=(x0+x1)/2, cy=(y0+y1)/2, mid=cells.find(o=>o.bb[0]<=cx&&o.bb[2]>=cx&&o.bb[1]<=cy&&o.bb[3]>=cy), top=Math.max(...cells.map(o=>lum(o.style)));
      ok(!!mid&&lum(mid.style)<0.3*top,'|psi|^2 is dark at the vortex in the middle and bright where the pairs are ('+(mid?fmt(lum(mid.style),0):'?')+' against '+fmt(top,0)+')');
      ok(hue(rampPairs(1))==='green'&&lum(rampPairs(0))<20&&hue(rampField(1))==='cyan','  the ramps: dark to the pairs\' green, and to the field\'s cyan'); }); }

  /* ---------- 11. the drawing: every view and preset at four sizes ---------- */
  { const cap=withState({view:'twofluid'},()=>tfCaption(buildModel().T));
    for(const [W,H] of [[1400,820],[1100,700],[820,520],[560,380]]){ const L=stageLayout(makeShot(W,H),W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
      ok(L.main.h>=120&&L.bottom.every(q=>q.h>=90),W+'x'+H+': the picture keeps '+L.main.h.toFixed(0)+' px and every plot 90 or more'); } }
  { const T=withState({view:'vortex',mat:'nb',kap:matOf('nb').kap},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); return c.ops.filter(o=>o.op==='text').map(o=>o.t); });
    ok(T.includes('one h/2e'),'the lattice marks one quantum\'s cell'); }
  { const T=withState({view:'vortex'},()=>{ const c=makeShot(1100,712); drawView(c,1100,712,buildModel()); return c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' | '); });
    has(T,'Hc1 = ','type I shows why no lattice forms'); }
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[['sphere',{view:'expel'}],['sphere zfc',{view:'expel',ePre:'zfc',eCool:0,eNow:0.6}],['sphere pc',{view:'expel',eMat:'pc'}],['sphere pc off',{view:'expel',eMat:'pc',ePre:'off',eCool:0.6,eNow:0}],
    ['sphere thick',{view:'expel',eLam:2}],['sphere thin, at Bc',{view:'expel',eLam:0.01,eNow:1}],['sphere empty',{view:'expel',eNow:0,eCool:0}],
    ['magnet',{view:'expel',eMode:'magnet'},40],['magnet settled',{view:'expel',eMode:'magnet'},600],['magnet pc',{view:'expel',eMode:'magnet',eMat:'pc'},100],['magnet lowered',{view:'expel',eMode:'magnet',eStory:'lowered',eR:2},50],['magnet big',{view:'expel',eMode:'magnet',eR:10,eBr:1.4},600],
    ['wall pb',{view:'wall'}],['wall nb',{view:'wall',mat:'nb',kap:matOf('nb').kap}],['wall al',{view:'wall',mat:'al',kap:matOf('al').kap}],['wall 1/sqrt2',{view:'wall',mat:'own',kap:Math.SQRT1_2}],['wall 80',{view:'wall',mat:'own',kap:80}],
    ['vortex nb',{view:'vortex',mat:'nb',kap:matOf('nb').kap}],['vortex pb',{view:'vortex'}],['vortex al',{view:'vortex',mat:'al',kap:matOf('al').kap}],['vortex london',{view:'vortex',mat:'nb',kap:matOf('nb').kap,vMode:'london'}],
    ['vortex dense',{view:'vortex',mat:'nbti',kap:75,vMode:'london',vB:0.05}],['vortex sparse',{view:'vortex',mat:'nbti',kap:75,vMode:'london',vB:1e-4}],['vortex near hc2',{view:'vortex',mat:'nb3sn',kap:matOf('nb3sn').kap,vB:0.98,vPhi:2.5,vRing:20}],
    ['twofluid',{view:'twofluid'}],['twofluid over',{view:'twofluid',tT:2.1,tDT:5}],['twofluid cold',{view:'twofluid',tT:0.3,tDT:0}],['twofluid lambda',{view:'twofluid',tT:2.17,tDT:0.1}],
    ['landau',{view:'landau'}],['landau still',{view:'landau',lV:0}],['landau slow',{view:'landau',lV:40}],['landau fast',{view:'landau',lV:300}],
    ['bucket',{view:'bucket'},900],['bucket still',{view:'bucket',bOm:10},300],['bucket full',{view:'bucket',bOm:34,bR:0.5,bT:2.1},1500],['bucket empty',{view:'bucket'}],
    ['annulus',{view:'bucket',bMode:'annulus'}],['annulus still',{view:'bucket',bMode:'annulus',aOm:0.3}],['annulus fast',{view:'bucket',bMode:'annulus',aOm:4.4,aR:2}]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over,run] of CONFIGS){
    let ran=null;
    for(const [W,H] of SIZES) withState(over,()=>{
      for(let i=0;i<(run||0);i++) runStep(ST);
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,strictModel(buildModel())); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.message||err):''));
      if(err) return;
      ok(AXES_BAD===0,nm+' '+W+'x'+H+' every axis has a finite range ('+AXES_BAD+' bad)');
      const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke');
      ok(strokes.length>=2&&texts.length>=3,nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+texts.length+' texts)');
      { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/\^/.test(t.t)){ bad='a caret power: "'+t.t.slice(0,40)+'"'; break; }
        if(/\d[eE][-+]?\d/.test(t.t)){ bad='a raw exponent: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      if(isNarrow(W)){ const bel=texts.find(t=>/Below, |the (lower|bottom) (left|right)/.test(t.t)); ok(!bel,nm+' '+W+'x'+H+' a narrow stage names no plot below ('+(bel?'"'+bel.t.slice(0,40)+'"':'ok')+')'); }
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let across=null;
      for(const L of LABELS){ if(L.seq===undefined) continue;
        for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
        if(across) break; }
      ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
      if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key fits ('+KEY_DROPS+' dropped)');
      if(ran===null) ran=texts.length;
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}
