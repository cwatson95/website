<!--
  ===================================================================
  meissner_superfluids.html — the Meissner effect and the two
  lengths of a superconductor, flux quanta, then helium II: two
  fluids, Landau's criterion and the rotating bucket
  ===================================================================

  Six views.  THE MEISSNER EFFECT: a sphere in a field, superconducting
  (London's equation, the screened share 1 - 3(l/a)coth(a/l) + 3l^2/a^2)
  or perfectly conducting (the field it cooled in stays frozen), cooled
  before or in the field; or an NdFeB ball over a flat plate, cooled
  with the ball on it or lowered onto it cold (the image dipole, the
  height it floats at, the twist that lays it flat).  TWO LENGTHS: the
  Ginzburg-Landau wall at Hc solved for any kappa = lambda/xi, its
  energy changing sign at 1/sqrt2 (type I and II), and the fields a
  material of that kappa stands.  FLUX QUANTA: Abrikosov's lattice near
  Hc2 (|psi|^2, beta), London's at low field, one vortex solved in GL
  theory, and a ring's Little-Parks staircase.  TWO FLUIDS: the
  fountain effect, the normal fluid as Landau's gas of excitations from
  the measured spectrum, second sound.  LANDAU'S CRITERION: the measured
  dispersion curve, min E/p, the angles of emission.  THE ROTATING
  BUCKET: point vortices entering a turning bucket (Magnus and mutual
  friction dynamics), the staircase against Feynman's count, and the
  Hess-Fairbank annulus beside a superconducting ring's fluxoid.

  WHAT IS QUOTED (build_msf/data/constants.txt, checked verbatim by
  build_msf/check_sources.py against the sources fetched 2026-09-27)
  -----------------------------------------------------------------------
  Wikipedia wikitext: "Meissner effect" (1933, tin and lead, chi = -1,
  the perfect conductor's frozen field and history, the levitation
  sentence, London 1935, BCS 1957); "London equations" (the equation,
  lambda, the slab, 50 to 500 nm); "Heike Kamerlingh Onnes" (1911,
  4.2 K); "Ginzburg-Landau theory" (1950, kappa, the two types, the
  dimensionless equations and units, the 2003 Nobel Prize);
  "Type-II superconductor" (the vortex lattice, the rotating-superfluid
  bridge); "Abrikosov vortex" (1957, K0); "Magnetic flux quantum"
  (1961, Deaver and Fairbank, Doll and Naebauer); "Macroscopic quantum
  phenomena" (v_s, the pairs, the fluxoid, 6 um by 6 um, kappa, the
  1 A core, 160 m/s); "Little-Parks effect" (1962, 2.07e-15 T m^2);
  "Critical field" (Hc(T)); "List of superconductors"; "Neodymium
  magnet" (1.3 T, 7.3-7.7 g/cm3); "Earnshaw's theorem"; "Superfluid
  helium-4" (the two-fluid model, the superleak, 0.692 bar, 125 kg/m3
  and 56 m, the channel, the first critical angular velocity, the
  vortex patterns, Landau 1962, Hall and Vinen); "Lambda point"
  (2.1768 K); "Second sound" (1944, 20 m/s); "Quantum vortex" (Onsager
  1949, Feynman 1955); "John F. Allen", "Pyotr Kapitsa", "Laszlo
  Tisza", "Joe Vinen".  Delin and Orlando's material tables after
  Donnelly's Physics Vade Mecum (MIT 6.763 chapter 117).  R. J. Donnelly
  and C. F. Barenghi, J. Phys. Chem. Ref. Data 27, 1217 (1998), the
  online edition: Tables 2.3, 2.4, 3.3, 4.3, 7.4, 8.3, 8.5, 11.3, 13.3,
  20.1 and 20.2 (build_msf/data/donnelly_*.txt).  The APS abstracts of
  Hess and Fairbank (1967) and Yarmchuk, Gordon and Packard (1979).
  CODATA 2022 u and mu0 from NIST.

  WHAT IS COMPUTED HERE AND CHECKED BY build_msf/derive.py
  --------------------------------------------------------
  Everything else, by routes that share no code with this page: the
  London sphere by sympy's matching (the page: exponent-scaled closed
  forms); the ball's heights, field and bob; the GL wall and vortex by
  scipy's solve_bvp with continuation (the page: Newton on finite
  differences, kappa rungs, Richardson); Abrikosov's beta by a
  periodic trapezoid over the cell; London's lattice with scipy's K0; Landau's normal fluid
  and entropy by scipy's quad over a scipy spline; the fountain and
  second sound; the bucket's free energy minimised over free
  arrangements by BFGS from many starts (the page: rings) and its
  steps by root-finding.

  WHAT IS MODELLED
  ----------------
  London's local electrodynamics with one lambda for the sphere and the
  perfect conductor; a point dipole for the ball, over an infinite flat
  plate in the Meissner state, damped (a modelling choice) and expelling
  over one second when cooled with the ball on it.  Ginzburg-Landau
  theory as written, kappa independent of temperature, Hc(T) the
  parabola.  Helium II at saturated vapour pressure from the tables;
  Landau's gas uses the low-temperature spectrum at every T.  The bucket
  holds straight lines (2-D point vortices), the core 0.45 of the
  displacement length, the normal fluid turning with the bucket.

  KNOWN-BAD: DO NOT REINTRODUCE (details in the Agent repo,
  projects/simulations/CHANGELOG.md)
  ---------------------------------------------------------
  - Table 2.4's ratios carry one figure at 0.85-1.0 K and skip 1.4 K:
    take the measured normal fraction from Table 2.3's densities.
  - Below 0.15/A Table 13.3's own spline runs under its data (a phase
    velocity of 210 m/s against first sound's 238): join the phonon
    line there.
  - The fountain's 0.692 bar and 56 m (the Superfluid helium-4 article)
    disagree with Donnelly and Barenghi's entropy (0.751 bar, 52.4 m):
    the 56 m is 0.692 bar over helium I's 125 kg/m3.
  - Rings of lines are the least free energy only up to eight here;
    beyond, say "8 or more", never a count.
  - Canvas text has no subscript: write Hc1, Omega0 with a Unicode
    subscript digit, never an underscore or a caret.
-->

  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');

  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];

/* ---- a few numerical tools ---- */
function golden(f,a,b,tol){ const g=(Math.sqrt(5)-1)/2; let x1=b-g*(b-a), x2=a+g*(b-a), f1=f(x1), f2=f(x2);
  for(let i=0;i<200&&b-a>(tol||1e-12);i++){ if(f1<f2){ b=x2; x2=x1; f2=f1; x1=b-g*(b-a); f1=f(x1); } else { a=x1; x1=x2; f1=f2; x2=a+g*(b-a); f2=f(x2); } }
  const x=(a+b)/2; return {x,f:f(x)}; }
function bisect(f,a,b,n){ let fa=f(a); for(let i=0;i<(n||90);i++){ const m=(a+b)/2, fm=f(m); if((fm>0)===(fa>0)){ a=m; fa=fm; } else b=m; } return (a+b)/2; }
function interp(tab,x,col){ const c=col||1, n=tab.length;
  if(x<=tab[0][0]) return tab[0][c]; if(x>=tab[n-1][0]) return tab[n-1][c];
  let lo=0, hi=n-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(tab[m][0]<=x) lo=m; else hi=m; }
  const t=(x-tab[lo][0])/(tab[hi][0]-tab[lo][0]); return tab[lo][c]+t*(tab[hi][c]-tab[lo][c]); }
function simpson(f,a,b,n){ n=n+(n%2); const hh=(b-a)/n; let s=f(a)+f(b); for(let i=1;i<n;i++) s+=(i%2?4:2)*f(a+i*hh); return s*hh/3; }
/* a natural cubic spline through (xs, ys): second derivatives zero at both ends */
function spline(xs,ys){ const n=xs.length, M=new Float64Array(n), c=new Float64Array(n), d=new Float64Array(n);
  for(let i=1;i<n-1;i++){ const h0=xs[i]-xs[i-1], h1=xs[i+1]-xs[i], r=6*((ys[i+1]-ys[i])/h1-(ys[i]-ys[i-1])/h0);
    const piv=2*(h0+h1)-(i>1?h0*c[i-1]:0); c[i]=h1/piv; d[i]=(r-(i>1?h0*d[i-1]:0))/piv; }
  for(let i=n-2;i>=1;i--) M[i]=d[i]-c[i]*M[i+1];
  function seg(x){ let lo=0, hi=n-1; if(x<=xs[0]) hi=1; else if(x>=xs[n-1]) lo=n-2; else { while(hi-lo>1){ const m=(lo+hi)>>1; if(xs[m]<=x) lo=m; else hi=m; } } return lo; }
  return {val(x){ const i=seg(x), h0=xs[i+1]-xs[i], A=(xs[i+1]-x)/h0, B=(x-xs[i])/h0;
      return A*ys[i]+B*ys[i+1]+((A*A*A-A)*M[i]+(B*B*B-B)*M[i+1])*h0*h0/6; },
    d1(x){ const i=seg(x), h0=xs[i+1]-xs[i], A=(xs[i+1]-x)/h0, B=(x-xs[i])/h0;
      return (ys[i+1]-ys[i])/h0+((1-3*A*A)*M[i]+(3*B*B-1)*M[i+1])*h0/6; },
    d2(x){ const i=seg(x), h0=xs[i+1]-xs[i], A=(xs[i+1]-x)/h0, B=(x-xs[i])/h0; return A*M[i]+B*M[i+1]; }};
}
/* 2x2 block tridiagonal solve: A[i] X[i-1] + B[i] X[i] + C[i] X[i+1] = R[i], blocks as [a,b,c,d] row-major */
function solveBT(A,B,C,R){ const n=B.length, Cp=new Array(n), Rp=new Array(n);
  const inv=m=>{ const det=m[0]*m[3]-m[1]*m[2]; return [m[3]/det,-m[1]/det,-m[2]/det,m[0]/det]; };
  const mm=(p,q)=>[p[0]*q[0]+p[1]*q[2],p[0]*q[1]+p[1]*q[3],p[2]*q[0]+p[3]*q[2],p[2]*q[1]+p[3]*q[3]];
  const mv=(p,v)=>[p[0]*v[0]+p[1]*v[1],p[2]*v[0]+p[3]*v[1]];
  let Bi=B[0]; let iv=inv(Bi); Cp[0]=mm(iv,C[0]); Rp[0]=mv(iv,R[0]);
  for(let i=1;i<n;i++){ const ac=mm(A[i],Cp[i-1]); Bi=[B[i][0]-ac[0],B[i][1]-ac[1],B[i][2]-ac[2],B[i][3]-ac[3]]; iv=inv(Bi);
    Cp[i]=mm(iv,C[i]); const ar=mv(A[i],Rp[i-1]); Rp[i]=mv(iv,[R[i][0]-ar[0],R[i][1]-ar[1]]); }
  const X=new Array(n); X[n-1]=Rp[n-1];
  for(let i=n-2;i>=0;i--){ const cx=mv(Cp[i],X[i+1]); X[i]=[Rp[i][0]-cx[0],Rp[i][1]-cx[1]]; }
  return X;
}
/* K0 and K1 by K_nu(x) = int_0^inf exp(-x cosh t) cosh(nu t) dt, a trapezoid in t (it converges faster than any power) */
function besselK(nu,x){ if(!(x>0)) return Infinity; const T=Math.acosh(Math.max(1,745/x)), hh=0.02; let s=0.5*Math.exp(-x);
  for(let t=hh;t<=T;t+=hh) s+=Math.exp(-x*Math.cosh(t))*Math.cosh(nu*t); return s*hh; }
/* K0 for the maps: a table on log x from 1e-4 to 60, with K0's own log at the small end */
const K0TAB=(()=>{ const n=1200, lo=Math.log(1e-4), hi=Math.log(60), xs=new Float64Array(n+1), ys=new Float64Array(n+1);
  for(let i=0;i<=n;i++){ const x=Math.exp(lo+(hi-lo)*i/n); xs[i]=lo+(hi-lo)*i/n; ys[i]=Math.log(besselK(0,x)); } return {n,lo,hi,ys}; })();
function K0f(x){ if(x>=60) return 0; if(x<1e-4) return -Math.log(x/2)-0.5772156649015329;
  const u=(Math.log(x)-K0TAB.lo)/(K0TAB.hi-K0TAB.lo)*K0TAB.n, i=Math.min(K0TAB.n-2,Math.max(1,Math.floor(u))), t=u-i, y=K0TAB.ys;
  /* four-point Lagrange in log-log */
  const p=(-t*(t-1)*(t-2)/6)*y[i-1]+((t+1)*(t-1)*(t-2)/2)*y[i]+(-(t+1)*t*(t-2)/2)*y[i+1]+((t+1)*t*(t-1)/6)*y[i+2];
  return Math.exp(p); }

/* ================================================================== *
 *  1. London's sphere (a = 1, the applied field 1)                    *
 * ================================================================== */
/* e^-x i1(x) and e^-x i1'(x), i1(x) = (x cosh x - sinh x)/x^2 the modified spherical Bessel function; the series near
   0, where the closed forms cancel */
function i1s(x){ if(x<1e-3) return Math.exp(-x)*(x/3+x*x*x/30); const e2=Math.exp(-2*x); return (x*(1+e2)/2-(1-e2)/2)/(x*x); }
function i1ps(x){ if(x<1e-3) return Math.exp(-x)*(1/3+x*x/10); const e2=Math.exp(-2*x); return (1-e2)/(2*x)-(1+e2)/(x*x)+(1-e2)/(x*x*x); }
/* inside A_phi = C i1(r/l) sin(th), outside (r/2 + D/r^2) sin(th); A_phi and dA_phi/dr continuous at r = 1.  C is
   kept as Cs = C e^(1/l) so nothing overflows as l -> 0 */
function sphereLondon(lam){
  const al=1/lam, Cs=1.5/(2*i1s(al)+i1ps(al)/lam), D=Cs*i1s(al)-0.5;
  return {lam,Cs,D,ratio:-2*D,Beq:1-D,Bc:2*Cs*Math.exp(-al)/(3*lam),
    closed:1-3*lam/Math.tanh(al)+3*lam*lam};
}
/* F(r) = A_phi/sin(th); the flux function Psi = r sin^2(th) F(r) (its level lines are the field lines) */
function sphereF(S,r){ return r<=1?S.Cs*i1s(r/S.lam)*Math.exp((r-1)/S.lam):r/2+S.D/(r*r); }
function spherePsi(S,r,th){ const s=Math.sin(th); return r*s*s*sphereF(S,r); }
/* B_z on the equator: (1/r) d(r F)/dr */
function sphereBeq(S,r){ if(r>1) return 1-S.D/(r*r*r);
  if(r<1e-9) return 2*S.Cs*Math.exp(-1/S.lam)/(3*S.lam);
  const x=r/S.lam; return S.Cs*Math.exp((r-1)/S.lam)*(i1s(x)/r+i1ps(x)/S.lam); }
/* a superconductor answers the field now; a perfect conductor keeps the field it had when it went perfect (b0) and
   answers only the change: B = b0 + (b - b0) B_London (the difference obeys London's equation, Becker, Heller and
   Sauter's argument) */
function sphereState(mat,bCool,bNow,lam){ const S=sphereLondon(lam);
  const frozen=mat==='pc'?bCool:0, resp=bNow-frozen;
  return {S,mat,bCool,bNow,frozen,resp,
    psi:(r,th)=>{ const s=Math.sin(th); return frozen*r*r*s*s/2+resp*spherePsi(S,r,th); },
    Beq:r=>frozen+resp*sphereBeq(S,r), moment:resp*S.ratio};
}

/* ================================================================== *
 *  1b. a magnetized ball over a flat superconductor                   *
 * ================================================================== */
/* a uniformly magnetized ball is a point dipole outside itself, m = (4/3) pi R^3 Br/mu0; the flat superconductor's
   image of it is (m_x, m_y, -m_z) at the mirror point, and the energy of the pair is U = k (1 + cos^2 al)/z^3,
   k = mu0 m^2/(64 pi), al the tilt from upright */
function ballParams(Rmm,Br,rho){ const R=Rmm*1e-3, V=4/3*PI*R*R*R, m=V*Br/PH.mu0, M=rho*V, k=PH.mu0*m*m/(64*PI);
  const zUp=Math.pow(6*k/(M*PH.g),0.25), zFlat=Math.pow(3*k/(M*PH.g),0.25);
  return {Rmm,R,Br,rho,V,m,M,k,I:0.4*M*R*R,zUp,zFlat,fBob:Math.sqrt(4*PH.g/zFlat)/(2*PI),fBobUp:Math.sqrt(4*PH.g/zUp)/(2*PI)}; }
function ballU(P,z,al){ const c=Math.cos(al); return P.k*(1+c*c)/(z*z*z); }
function ballForce(P,z,al){ const c=Math.cos(al); return 3*P.k*(1+c*c)/(z*z*z*z); }
function ballTorque(P,z,al){ return P.k*Math.sin(2*al)/(z*z*z); }
/* the field in the vertical plane through the dipole (x along its horizontal part), SI; img: with the image */
function ballField(P,x,z,z0,al,img){ const mx=P.m*Math.sin(al), mz=P.m*Math.cos(al), c=PH.mu0/(4*PI);
  const one=(mx_,mz_,dx,dz)=>{ const r2=dx*dx+dz*dz, r=Math.sqrt(r2), dot=(mx_*dx+mz_*dz)/r;
    return [c*(3*dot*dx/r-mx_)/(r2*r), c*(3*dot*dz/r-mz_)/(r2*r)]; };
  const a=one(mx,mz,x,z-z0); if(!img) return a; const b=one(mx,-mz,x,z+z0); return [a[0]+b[0],a[1]+b[1]]; }
/* the largest field along the plate (it must stay below the plate's critical field for the Meissner state) */
function ballPlateMax(P,z0,al){ let best=0, xb=0; for(let i=0;i<=800;i++){ const x=(-2+4*i/800)*z0, B=ballField(P,x,1e-12,z0,al,true); const t=Math.abs(B[0]); if(t>best){ best=t; xb=x; } }
  const g=golden(x=>-Math.abs(ballField(P,x,1e-12,z0,al,true)[0]),xb-0.01*z0,xb+0.01*z0,1e-12*z0); return {B:-g.f,x:g.x}; }
/* the ball's motion: gravity, the image's push and twist, and a damping set so it settles in about a second (a
   modelling choice: a real ball over a Meissner plate barely loses energy; over YBCO, pinning damps it).  Cooled with
   the ball on it, the plate pushes its field out over COOL_S seconds as it goes superconducting (the image grows
   from nothing: another modelling choice, where an instant expulsion would throw the ball at hundreds of g); a
   perfect conductor keeps the field it had and never pushes.  Lowered onto a plate already cold, either one screens
   the change and the image is whole from the start. */
const BALL_DAMP=0.35, COOL_S=1.0;
function ballInit(P,story,mat){ const act=!(story==='cooled'&&mat==='pc');
  return story==='cooled'?{z:P.R,vz:0,al:0.04,w:0,t:0,act,ramp:true}:{z:2.4*P.zUp,vz:0,al:0.04,w:0,t:0,act,ramp:false}; }
const ballShare=s=>!s.act?0:!s.ramp?1:smoothstep(clamp(s.t/COOL_S,0,1));
function ballStep(P,s,dt){ const n=Math.max(1,Math.ceil(dt/2e-4)), h2=dt/n;
  for(let k=0;k<n;k++){
    let Fz=-P.M*PH.g-2*P.M/BALL_DAMP*s.vz, tq=-2*P.I/BALL_DAMP*s.w;
    const fr=ballShare(s); if(fr>0){ Fz+=fr*ballForce(P,s.z,s.al); tq+=fr*ballTorque(P,s.z,s.al); }
    s.vz+=h2*Fz/P.M; s.z+=h2*s.vz; s.w+=h2*tq/P.I; s.al+=h2*s.w;
    if(s.z<P.R){ s.z=P.R; if(s.vz<0) s.vz=0; }
    if(s.al>PI/2){ s.al=PI-s.al; s.w=-s.w; }
    s.t+=h2; }
  return s; }

/* ================================================================== *
 *  2. the Ginzburg-Landau wall at H = Hc                              *
 * ================================================================== */
/* lengths in lambda, fields in sqrt2 Hc, psi in psi_0 (the GL article's units): f'' = k^2 (a^2 f - f + f^3),
   a'' = f^2 a; the normal side (f = 0, a' = h = 1/sqrt2) at -L1, the superconducting side (f' = 0, a = 0) at L2.
   The wall is pinned where f = 1/2 (x = 0): at h exactly the wall is free to sit anywhere, and the pin costs nothing.
   Newton's method on the finite differences, a 2x2 block-tridiagonal solve; each kappa starts from a nearby solution. */
const HC=1/Math.SQRT2;
function wallGrid(kap,fine){ const xi=1/kap, dx=Math.min(1,xi)/(fine?32:16);
  const n1=Math.ceil((12+3*xi)/dx), n2=Math.ceil((12+22*xi)/dx); return {dx,n1,n2,n:n1+n2+1}; }
function wallSolve(kap,fine,guess){
  const G=wallGrid(kap,fine), dx=G.dx, n=G.n, ip=G.n1, k2=kap*kap, i2=1/(dx*dx);
  const f=new Float64Array(n), a=new Float64Array(n);
  for(let i=0;i<n;i++){ const x=(i-ip)*dx, g=guess(x); f[i]=g[0]; a[i]=g[1]; }
  f[0]=0; f[ip]=0.5; a[n-1]=0;
  let it=0, res=1;
  for(;it<40;it++){
    const A=new Array(n), B=new Array(n), C=new Array(n), R=new Array(n);
    for(let i=0;i<n;i++){
      A[i]=[0,0,0,0]; C[i]=[0,0,0,0];
      /* row 1 (f) */
      let r1, b11, b12, a11=0, c11=0;
      if(i===0){ r1=f[0]; b11=1; b12=0; }
      else if(i===ip){ r1=f[i]-0.5; b11=1; b12=0; }
      else if(i===n-1){ r1=2*(f[i-1]-f[i])*i2-k2*(a[i]*a[i]*f[i]-f[i]+f[i]*f[i]*f[i]); a11=2*i2; b11=-2*i2-k2*(a[i]*a[i]-1+3*f[i]*f[i]); b12=-k2*2*a[i]*f[i]; }
      else { r1=(f[i+1]-2*f[i]+f[i-1])*i2-k2*(a[i]*a[i]*f[i]-f[i]+f[i]*f[i]*f[i]); a11=i2; c11=i2; b11=-2*i2-k2*(a[i]*a[i]-1+3*f[i]*f[i]); b12=-k2*2*a[i]*f[i]; }
      /* row 2 (a) */
      let r2, b21, b22, a22=0, c22=0;
      if(i===n-1){ r2=a[i]; b21=0; b22=1; }
      else if(i===0){ r2=(2*a[1]-2*a[0]-2*dx*HC)*i2-f[0]*f[0]*a[0]; c22=2*i2; b22=-2*i2-f[0]*f[0]; b21=-2*f[0]*a[0]; }
      else { r2=(a[i+1]-2*a[i]+a[i-1])*i2-f[i]*f[i]*a[i]; a22=i2; c22=i2; b22=-2*i2-f[i]*f[i]; b21=-2*f[i]*a[i]; }
      A[i]=[a11,0,0,a22]; B[i]=[b11,b12,b21,b22]; C[i]=[c11,0,0,c22]; R[i]=[-r1,-r2];
    }
    const X=solveBT(A,B,C,R); res=0;
    for(let i=0;i<n;i++){ f[i]+=X[i][0]; a[i]+=X[i][1]; res=Math.max(res,Math.abs(X[i][0]),Math.abs(X[i][1])); }
    if(res<1e-12) break;
  }
  /* the surface energy by the virial form sigma = int [(b - h)^2 - f^4/2] dx (units mu0 Hc^2 lambda) */
  const b=new Float64Array(n); for(let i=0;i<n;i++) b[i]=i===0?HC:i===n-1?(a[i]-a[i-1])/dx:(a[i+1]-a[i-1])/(2*dx);
  let sig=0; for(let i=0;i<n;i++){ const g=(b[i]-HC)*(b[i]-HC)-f[i]*f[i]*f[i]*f[i]/2; sig+=(i===0||i===n-1?0.5:1)*g; } sig*=dx;
  return {kap,dx,n,ip,f,a,b,sigma:sig,iters:it,res,x0:-G.n1*dx};
}
function wallGuessFrom(W){ return x=>{ const u=(x-W.x0)/W.dx, i=Math.floor(u);
  if(i<0) return [0,W.a[0]+(x-W.x0)*HC]; if(i>=W.n-1) return [W.f[W.n-1],0];
  const t=u-i; return [W.f[i]+t*(W.f[i+1]-W.f[i]),W.a[i]+t*(W.a[i+1]-W.a[i])]; }; }
function wallGuess0(kap){ const s=Math.SQRT2/kap; return x=>[0.5*(1+Math.tanh(x/s)),-HC*(x<0?-x+Math.log1p(Math.exp(x)):Math.log1p(Math.exp(-x)))]; }
/* the rungs: kappa = 2^(j/4)/sqrt2, each solved from its neighbour toward 1/sqrt2 */
const WALL_RUNGS={}, WALL_LO=0.03, WALL_HI=80;
function wallRung(j){ if(WALL_RUNGS[j]) return WALL_RUNGS[j];
  const kap=Math.pow(2,j/4)/Math.SQRT2, prev=j===0?null:wallRung(j>0?j-1:j+1);
  const W=wallSolve(kap,false,prev?wallGuessFrom(prev):wallGuess0(kap)); WALL_RUNGS[j]=W; return W; }
/* the wall at kappa: coarse and fine grids from the nearest rung, and Richardson's extrapolation of sigma */
function glWall(kap){ kap=clamp(kap,WALL_LO,WALL_HI);
  const j=Math.round(4*Math.log2(kap*Math.SQRT2)), R0=wallRung(j);
  const Wc=wallSolve(kap,false,wallGuessFrom(R0)), Wf=wallSolve(kap,true,wallGuessFrom(Wc));
  return {kap,W:Wf,sigma:(4*Wf.sigma-Wc.sigma)/3,sc:Wc.sigma,sf:Wf.sigma,conv:Math.max(Wc.res,Wf.res)}; }

/* ================================================================== *
 *  3. one vortex, and Hc1                                             *
 * ================================================================== */
/* psi = f(r) e^(i phi), A = a(r) phi-hat; f ~ r and a ~ r at the axis; far out f' = 0 and a = 1/(k R): Q = a - 1/(k r)
   = 0, no current.  Newton on a uniform r grid, Richardson on Hc1 = sqrt2 k eps1/(4 pi) */
function vortexSolve(kap,fine,guess){
  const xi=1/kap, dr=Math.min(1,xi)/(fine?40:20), Rm=14+26*xi, n=Math.ceil(Rm/dr), R=n*dr, k2=kap*kap, i2=1/(dr*dr);
  const f=new Float64Array(n+1), a=new Float64Array(n+1);
  for(let i=1;i<=n;i++){ const g=guess(i*dr); f[i]=g[0]; a[i]=g[1]; }
  a[n]=1/(kap*R);
  let it=0, res=1;
  for(;it<40;it++){
    const A=new Array(n), B=new Array(n), C=new Array(n), Rr=new Array(n);   /* unknowns at nodes 1..n (index i-1) */
    for(let i=1;i<=n;i++){ const r=i*dr, Q=a[i]-1/(kap*r), j=i-1;
      let r1, a11=0, c11=0, b11, b12;
      if(i===n){ r1=2*(f[i-1]-f[i])*i2-k2*(Q*Q*f[i]-f[i]+f[i]*f[i]*f[i]); a11=2*i2; }
      else { r1=(f[i+1]-2*f[i]+f[i-1])*i2+(f[i+1]-f[i-1])/(2*dr*r)-k2*(Q*Q*f[i]-f[i]+f[i]*f[i]*f[i]); a11=i2-1/(2*dr*r); c11=i2+1/(2*dr*r); }
      b11=-2*i2-k2*(Q*Q-1+3*f[i]*f[i]); b12=-k2*2*Q*f[i];
      let r2, a22=0, c22=0, b21, b22;
      if(i===n){ r2=a[i]-1/(kap*R); b21=0; b22=1; }
      else { r2=(a[i+1]-2*a[i]+a[i-1])*i2+(a[i+1]-a[i-1])/(2*dr*r)-a[i]/(r*r)-f[i]*f[i]*Q; a22=i2-1/(2*dr*r); c22=i2+1/(2*dr*r); b22=-2*i2-1/(r*r)-f[i]*f[i]; b21=-2*f[i]*Q; }
      if(i===1){ a11=0; a22=0; }                               /* f_0 = a_0 = 0 on the axis */
      A[j]=[a11,0,0,a22]; B[j]=[b11,b12,b21,b22]; C[j]=[c11,0,0,c22]; Rr[j]=[-r1,-r2];
    }
    const X=solveBT(A,B,C,Rr); res=0;
    for(let i=1;i<=n;i++){ f[i]+=X[i-1][0]; a[i]+=X[i-1][1]; res=Math.max(res,Math.abs(X[i-1][0]),Math.abs(X[i-1][1])); }
    if(res<1e-12) break;
  }
  const b=new Float64Array(n+1);
  for(let i=1;i<=n;i++){ const r=i*dr; b[i]=i===n?(a[i]-a[i-1])/dr+a[i]/r:(a[i+1]-a[i-1])/(2*dr)+a[i]/r; }
  b[0]=(4*a[1]-a[2])/dr;                                            /* a ~ c1 r + c3 r^3 on the axis: b(0) = 2 c1 = (4 a1 - a2)/dr */
  let eps=0, flux=0;
  for(let i=1;i<=n;i++){ const r=i*dr, Q=a[i]-1/(kap*r), fp=i===n?0:(f[i+1]-f[i-1])/(2*dr);
    const dens=fp*fp/k2+Q*Q*f[i]*f[i]+0.5*(1-f[i]*f[i])*(1-f[i]*f[i])+b[i]*b[i];
    const w=(i===n?0.5:1)*2*PI*r; eps+=w*dens; flux+=w*b[i]; }
  eps*=dr; flux*=dr;                                                /* the axis itself carries weight 0 in 2 pi r dr */
  return {kap,dr,n,R,f,a,b,eps1:eps,flux,hc1:Math.SQRT2*kap*eps/(4*PI),iters:it,res};
}
function vortexGuessFrom(V){ return r=>{ const u=r/V.dr, i=Math.floor(u); if(i>=V.n) return [1,1/(V.kap*r)];
  const t=u-i; return [V.f[i]+t*(V.f[i+1]-V.f[i]),V.a[i]+t*(V.a[i+1]-V.a[i])]; }; }
function vortexGuess0(kap){ return r=>[Math.tanh(r*kap/Math.SQRT2),(1/(kap*r))*(1-Math.exp(-r*r/(1+r)))]; }
const VX_RUNGS={}, VX_LO=0.2, VX_HI=80;
function vortexRung(j){ if(VX_RUNGS[j]) return VX_RUNGS[j];
  const kap=Math.pow(2,j/4)/Math.SQRT2, prev=j===0?null:vortexRung(j>0?j-1:j+1);
  const V=vortexSolve(kap,false,prev?vortexGuessFrom(prev):vortexGuess0(kap)); VX_RUNGS[j]=V; return V; }
function glVortex(kap){ kap=clamp(kap,VX_LO,VX_HI);
  const j=Math.round(4*Math.log2(kap*Math.SQRT2)), R0=vortexRung(j);
  const Vc=vortexSolve(kap,false,vortexGuessFrom(R0)), Vf=vortexSolve(kap,true,vortexGuessFrom(Vc));
  return {kap,V:Vf,hc1:(4*Vf.hc1-Vc.hc1)/3,eps1:(4*Vf.eps1-Vc.eps1)/3,flux:Vf.flux,conv:Math.max(Vc.res,Vf.res)}; }

/* ================================================================== *
 *  3b. Abrikosov's lattice near Hc2, London's at low field, a ring    *
 * ================================================================== */
/* the lowest Landau level (magnetic length 1): psi = sum_n C_n e^(i n q y) e^(-(x - n q)^2/2); the triangle takes
   C_n = e^(i pi n^2/2), q^2 = sqrt3 pi; the square C_n = 1, q^2 = 2 pi.  Its zeros are the vortices, one per 2 pi. */
const ABR={tri:{q:Math.sqrt(Math.sqrt(3)*PI),C:n=>[Math.cos(PI*n*n/2),Math.sin(PI*n*n/2)]},sq:{q:Math.sqrt(2*PI),C:()=>[1,0]}};
function abrPsi2(kind,x,y){ const L=ABR[kind], q=L.q; let re=0, im=0;
  const n0=Math.round(x/q);
  for(let n=n0-7;n<=n0+7;n++){ const c=L.C(n), g=Math.exp(-(x-n*q)*(x-n*q)/2), ph=n*q*y;
    const cr=Math.cos(ph), si=Math.sin(ph); re+=g*(c[0]*cr-c[1]*si); im+=g*(c[0]*si+c[1]*cr); }
  return re*re+im*im; }
/* beta = <|psi|^4>/<|psi|^2>^2 over the cell [0, 2q) x [0, 2 pi/q), a periodic trapezoid */
function abrBeta(kind,M){ const q=ABR[kind].q; M=M||96; let s1=0, s2=0;
  for(let i=0;i<M;i++) for(let j=0;j<M;j++){ const p=abrPsi2(kind,2*q*i/M,2*PI/q*j/M); s1+=p; s2+=p*p; }
  return (s2/(M*M))/((s1/(M*M))*(s1/(M*M))); }
/* London's field of a triangular lattice of spacing av (lambda = 1, Phi0 = 1): b = (1/2 pi) sum K0(|r - R_i|).  The
   lines within R1 of the point count whole, those out to R2 = R1 + D fade by a cos^2 taper, and the rest are the
   continuum n int K0 (1 - w) r dr = n [R1 K1(R1) - int_R1^R2 w K0 r dr] (n = 1/cell): a smooth window's sum and its
   integral differ by the window's Fourier transform at the reciprocal lattice, negligible here, so R1 can be a few
   spacings (8 of them, 2.5 to 12 lambda) rather than the 14 lambda a sharp cut needs.  reach: how far from the origin
   the field will be asked for (the lines are listed out to R2 + reach); core: London's cut, K0 held at r = core */
function londonLattice(av,rcut,reach,core){
  const R1=rcut||clamp(8*av,2.5,12), D=Math.max(3*av,0.8), R2=R1+D, n=2/(Math.sqrt(3)*av*av), L=R2+(reach||0);
  const pts=[], nmax=Math.ceil(L/av)+2;
  for(let i=-nmax;i<=nmax;i++) for(let j=-nmax;j<=nmax;j++){ const X=av*(i+0.5*j), Y=av*Math.sqrt(3)/2*j; if(X*X+Y*Y<L*L) pts.push(X,Y); }
  const w=d=>d<=R1?1:d>=R2?0:0.5*(1+Math.cos(PI*(d-R1)/D));
  const tail=n*(R1*besselK(1,R1)-simpson(r=>w(r)*besselK(0,r)*r,R1,R2,200));
  const rc=core||0;
  return {av,pts,mean:n,R1,R2,tail,core:rc,
    b:(x,y,exact)=>{ let s=0; for(let k=0;k<pts.length;k+=2){ const d=Math.hypot(x-pts[k],y-pts[k+1]); if(d>=R2) continue; const e=Math.max(d,rc); s+=(exact?besselK(0,e):K0f(e))*w(d); } return s/(2*PI)+tail; }};
}
/* a ring threaded by Phi: the fluxoid n* nearest Phi/Phi0; Little and Parks's Tc dips by (xi(0)/R)^2 (n* - Phi/Phi0)^2 */
function ringState(phi){ const n=Math.round(phi); return {n,dev:n-phi,depth:(n-phi)*(n-phi)}; }

/* ================================================================== *
 *  4. Landau's spectrum, measured (Donnelly & Barenghi, Table 13.3)   *
 * ================================================================== */
/* below 0.15/A the table's own spline runs under its data (0.804 K at 0.05/A, a phase velocity of 210 m/s against
   first sound's 238.2): there E = hbar u1 Q (1 + gam Q^2), u1 first sound at T -> 0 (Table 3.3) and gam set so the
   two meet at 0.15/A; above, a natural cubic spline through the table's points */
const LANDAU=(()=>{
  const u1=HE.u1[0][1], cK=PH.hbar*u1*1e10/PH.kB, Qj=0.15, rows=HE.disp.filter(r=>r[0]>=Qj-1e-12);
  const sp=spline(rows.map(r=>r[0]),rows.map(r=>r[1])), Ej=rows[0][1], gam=(Ej/(cK*Qj)-1)/(Qj*Qj);
  const E=Q=>Q<Qj?cK*Q*(1+gam*Q*Q):sp.val(Q);
  const ro=golden(E,1.7,2.2,1e-13), vp=Q=>E(Q)*PH.kB/(PH.hbar*Q*1e10);
  const vl=golden(vp,1.5,3.0,1e-13);
  const curv=sp.d2(ro.x), mu=PH.hbar*PH.hbar*1e20/(PH.kB*curv)/PH.m4;
  return {u1,cK,Qj,gam,sp,E,vp,Q0:ro.x,Delta:ro.f,mu,curv,vL:vl.f,Qs:vl.x,Qmax:rows[rows.length-1][0]};
})();
const EK=Q=>LANDAU.E(Q);
/* the normal fluid of the excitation gas: rho_n = (hbar^2/(6 pi^2 k T)) int Q^4 n(1 + n) dQ, Q in 1/m (here 1/A, x 1e50) */
function rhoNLandau(T){
  const g=Q=>{ if(Q<=0) return 0; const x=EK(Q)/T; if(x>700) return 0; const n=1/Math.expm1(x); return Q*Q*Q*Q*n*(1+n); };   /* -> Q^2 T^2/cK^2 at 0 */
  const I=simpson(g,0,LANDAU.Qj,400)+simpson(g,LANDAU.Qj,LANDAU.Qmax,4000);
  return PH.hbar*PH.hbar*1e50/(6*PI*PI*PH.kB*T)*I; }
/* the entropy per gram of the same gas */
function entLandau(T,rho){
  const g=Q=>{ if(Q<=0) return 0; const x=EK(Q)/T; if(x>700) return 0; const n=1/Math.expm1(x); return Q*Q*((1+n)*Math.log1p(n)-(n>0?n*Math.log(n):0)); };
  const I=simpson(g,0,LANDAU.Qj,400)+simpson(g,LANDAU.Qj,LANDAU.Qmax,4000);
  return PH.kB*1e30/(2*PI*PI*rho)*I/1000; }
/* the two closed forms: linear phonons exactly, and a parabolic roton gas's leading Boltzmann term */
function rhoNPhonon(T){ return 2*PI*PI*Math.pow(PH.kB*T,4)/(45*Math.pow(PH.hbar,3)*Math.pow(LANDAU.u1,5)); }
function rhoNRoton(T){ const mu=LANDAU.mu*PH.m4, p0=PH.hbar*LANDAU.Q0*1e10;
  return 2*Math.sqrt(mu)*Math.pow(p0,4)/(3*Math.pow(2*PI,1.5)*Math.pow(PH.hbar,3)*Math.sqrt(PH.kB*T))*Math.exp(-LANDAU.Delta/T); }

/* ================================================================== *
 *  5. two fluids: the measured tables                                 *
 * ================================================================== */
const T_LAMBDA=DATA.lambda_T, M4MOL=DATA.he4_mass*1e-3;
const rhoOf=T=>1000*(interp(HE.rho,T,1)+interp(HE.rho,T,2));          /* kg/m3 */
const rsOf=T=>interp(HE.rho,T,1)/(interp(HE.rho,T,1)+interp(HE.rho,T,2));
/* the measured normal fraction from Table 2.3's densities (four figures; Table 2.4's ratios carry one at 0.85-1.0 K
   and skip 1.4 K) */
const rnMeas=T=>interp(HE.rho,T,2)/(interp(HE.rho,T,1)+interp(HE.rho,T,2));
const sOf=T=>interp(HE.s,T);                                          /* J/(g K), Table 8.5 (the page asks from 0.3 K) */
const cOf=T=>interp(HE.cs,T)/M4MOL/1000;                              /* J/(g K) */
/* second sound from rho_s/rho_n, S and C: u2^2 = (rho_s/rho_n) T S^2/C (S, C per kilogram) */
function u2TwoFluid(T){ const rs=interp(HE.rho,T,1), rn=interp(HE.rho,T,2), S=sOf(T)*1000, C=interp(HE.cs,T)/M4MOL;
  return Math.sqrt(rs/rn*T*S*S/C); }
/* the fountain: London's dp/dT = rho S, so the pressure from 0 to T is rho times the trapezoid of the table */
function sInt(T){ const t=[[0,0]].concat(HE.s); let s=0;
  for(let i=1;i<t.length&&t[i-1][0]<T;i++){ const x1=Math.min(t[i][0],T), y1=x1===t[i][0]?t[i][1]:interp(t,x1); s+=0.5*(x1-t[i-1][0])*(t[i-1][1]+y1); }
  return s; }                                                          /* J/g */
function fountain(T,dT){ const h=(sInt(T+dT/1000)-sInt(T))*1000/PH.g;   /* metres of head for dT millikelvin */
  return {h,pf:rhoOf(T)*sInt(T)*1000,perMK:sOf(T)*1000/PH.g*1e-3}; }

/* ================================================================== *
 *  6. point vortices in a rotating bucket (R = 1, kappa = 1)          *
 * ================================================================== */
/* the free energy E - Omega L in units of rho kappa^2/(4 pi) per unit length, om = Omega/Omega0 (Omega0 = kappa/2 pi R^2),
   ell = ln(R/a0): N (ell - om) + sum_j [ln(1 - r_j^2) + om r_j^2] + sum_{j != k} ln(|1 - z_j z_k*|/|z_j - z_k|) */
function bucketF(xs,ys,om,ell){ const N=xs.length; let F=N*(ell-om);
  for(let j=0;j<N;j++){ const r2=xs[j]*xs[j]+ys[j]*ys[j]; F+=Math.log(1-r2)+om*r2;
    for(let k=0;k<N;k++){ if(k===j) continue;
      const pr=1-(xs[j]*xs[k]+ys[j]*ys[k]), pi=-(ys[j]*xs[k]-xs[j]*ys[k]);
      F+=Math.log(Math.hypot(pr,pi)/Math.hypot(xs[j]-xs[k],ys[j]-ys[k])); } }
  return F; }
/* each line's velocity in the frame turning at Omega = om/(2 pi): the other lines and every image (circulation -1 at
   1/conj z) minus the solid-body i Omega z; returned as [u, v] pairs */
function bucketVel(xs,ys,om){ const N=xs.length, out=new Array(N);
  for(let j=0;j<N;j++){ let wr=0, wi=0;                                   /* w = sum 1/(z_j - z_k) - sum 1/(z_j - 1/conj z_k) */
    for(let k=0;k<N;k++){
      if(k!==j){ const dx=xs[j]-xs[k], dy=ys[j]-ys[k], d2=dx*dx+dy*dy; wr+=dx/d2; wi-=dy/d2; }
      const r2=xs[k]*xs[k]+ys[k]*ys[k]; if(r2>0){ const ix=xs[k]/r2, iy=ys[k]/r2, dx=xs[j]-ix, dy=ys[j]-iy, d2=dx*dx+dy*dy; wr-=dx/d2; wi+=dy/d2; } }
    /* (u - i v) = w/(2 pi i) = -i w/(2 pi): u = wi/(2 pi), v = wr/(2 pi) */
    const Om=om/(2*PI); out[j]=[wi/(2*PI)+Om*ys[j],wr/(2*PI)-Om*xs[j]]; }
  return out; }
/* the lines settle by mutual friction: v_L = (1 - i alpha) v in the turning frame (the normal fluid turns with the
   bucket), which runs down F */
function bucketStep(S,om,alpha,dt){ const V=bucketVel(S.x,S.y,om);
  for(let j=0;j<S.x.length;j++){ const u=V[j][0], v=V[j][1]; S.x[j]+=dt*(u+alpha*v); S.y[j]+=dt*(v-alpha*u); } }
/* one midpoint step of dz/dt = (1 - i alpha) v for every line, second order (V: the velocities at the start, if the
   caller has them) */
function bucketMid(xs,ys,om,al,h,V){ V=V||bucketVel(xs,ys,om);
  const xm=xs.map((x,j)=>x+0.5*h*(V[j][0]+al*V[j][1])), ym=ys.map((y,j)=>y+0.5*h*(V[j][1]-al*V[j][0])), Vm=bucketVel(xm,ym,om);
  for(let j=0;j<xs.length;j++){ xs[j]+=h*(Vm[j][0]+al*Vm[j][1]); ys[j]+=h*(Vm[j][1]-al*Vm[j][0]); } }
/* a ring of N at radius r, or a ring of N round a line on the axis: its free energy (less N ell), and its best radius */
function ringF(N,r,om,center){ const xs=[], ys=[]; for(let m=0;m<N;m++){ xs.push(r*Math.cos(2*PI*m/N)); ys.push(r*Math.sin(2*PI*m/N)); }
  if(center){ xs.push(0); ys.push(0); } return bucketF(xs,ys,om,0); }
function ringBest(N,om,center){ if(N===0) return center?{r:0,F:-om}:{r:0,F:0};
  if(N===1&&!center) return {r:0,F:ringF(1,0,om,false)};
  const g=golden(r=>ringF(N,r,om,center),1e-4,0.999,1e-13); return {r:g.x,F:g.f}; }
/* the least free energy of N lines (a ring, or a ring round one on the axis: the twin finds nothing lower to eight) */
function bucketFmin(N,om,ell){ if(N===0) return {F:0,shape:'none'};
  const a=ringBest(N,om,false), b=N>=2?ringBest(N-1,om,true):{F:Infinity};
  return a.F<=b.F?{F:a.F+N*ell,shape:'ring',r:a.r,n:N}:{F:b.F+N*ell,shape:'ring+1',r:b.r,n:N-1}; }
/* the rotation at which the N-th line first pays */
function bucketStep1(N,ell){ return bisect(om=>bucketFmin(N,om,ell).F-bucketFmin(N-1,om,ell).F,1,200,60); }
/* the core parameter: 0.45 of the displacement length (Donnelly & Barenghi, Chapter 20); alpha from Table 11.3 */
const a0Of=T=>0.45*interp(HE.dl,T,1)*1e-2;
const alphaOf=T=>interp(HE.mf,T,3);

function logOf(v,lo,hi){ return clamp(Math.round(LOGN*Math.log(v/lo)/Math.log(hi/lo)),0,LOGN); }

/* the ball runs in real time and stops once it has settled (BALL_T s); the bucket's lines run BUCKET_SPEED times fast */
const FRAME=1/60, BALL_T=8, BUCKET_SPEED=60;
const SIM={t:0, ball:null, ballKey:'', trace:[], vort:null, vortKey:'', vortT:0, entered:0};
function simReset(){ SIM.t=0; SIM.ball=null; SIM.ballKey=''; SIM.trace=[]; SIM.vort=null; SIM.vortKey=''; SIM.vortT=0; SIM.entered=0; }
function ballKeyOf(st){ return [st.eR,st.eBr,st.eStory,st.eMat].join('|'); }
function ballSim(st){ const P=ballParams(st.eR,st.eBr,7500), key=ballKeyOf(st);
  if(!SIM.ball||SIM.ballKey!==key){ SIM.ball=ballInit(P,st.eStory,st.eMat); SIM.ballKey=key; SIM.trace=[[0,SIM.ball.z]]; }
  return {P,s:SIM.ball}; }

function vortSim(st){ const key=vortKeyOf(st);
  if(!SIM.vort||SIM.vortKey!==key){ SIM.vort={x:[],y:[]}; SIM.vortKey=key; SIM.vortT=0; SIM.entered=0; }

  if(st.view==='expel'&&st.eMode==='magnet'&&st.ePlay){ const B=ballSim(st); return B.s.t<BALL_T; }
  return st.view==='bucket'&&st.bMode==='bucket'&&st.bPlay; }

  if(!viewAnimates(st)) return false;

/* the lines: mutual friction runs them down the free energy; a line is let in (inside the wall's barrier, at 0.85 of
   its radius sqrt(1 - 1/om)) when the bucket holds fewer than it should and none is still on its way in; a line that
   reaches the wall is gone */
function bucketAdvance(st,dt){
  const B=bucketParams(st), S=vortSim(st), om=B.om, al=B.alpha;
  let T=BUCKET_SPEED*dt/B.tau;
  const Neq=B.Neq, inbound=S.x.some((x,j)=>Math.hypot(x,S.y[j])>0.72);
  if(S.x.length<Neq&&!inbound&&om>1.05){ const th=2.39996*SIM.entered+0.3, r=0.85*Math.sqrt(1-1/om);
    S.x.push(r*Math.cos(th)); S.y.push(r*Math.sin(th)); SIM.entered++; }
  while(T>0){ const V=bucketVel(S.x,S.y,om); let vm=1e-9; for(const v of V) vm=Math.max(vm,Math.hypot(v[0],v[1]));
    const h2=Math.min(T,0.01,0.01/vm);
    bucketMid(S.x,S.y,om,al,h2,V);
    for(let j=S.x.length-1;j>=0;j--) if(Math.hypot(S.x[j],S.y[j])>0.985){ S.x.splice(j,1); S.y.splice(j,1); }
    T-=h2; }
  SIM.vortT+=BUCKET_SPEED*dt;
}

const SPH_BOX={x0:-3,x1:3,y0:-2.25,y1:2.25}, SPH_NX=241, SPH_NY=181;

    const rs=[], bz=[]; for(let i=0;i<=300;i++){ const r=3*i/300; rs.push(r); bz.push(E.Beq(r)); }
    const lams=[], mr=[]; for(let i=0;i<=200;i++){ const l=0.01*Math.pow(300,i/200); lams.push(l); mr.push(sphereLondon(l).ratio); }
    return {mode:'sphere',E,S:E.S,lines,rs,bz,lams,mr,mat:st.eMat,cool:st.eCool,now:st.eNow,lam:st.eLam,frozen:E.frozen,bzMax:Math.max(...bz),bzMin:Math.min(...bz),
      Bcenter:E.Beq(0),Bsurf:E.Beq(1+1e-9),moment:E.moment,onset:1/(1+E.S.ratio/2)};
  });

/* ---- two lengths: the wall at kappa, the surface energy against kappa, the phase diagram ---- */
/* the curve through the rungs (their coarse grid: its error, second order, does not show at the plot's scale; the
   marker is the extrapolated value) */
function wallCurve(){ return memo('wallCurve','all',()=>{ const ks=[], sg=[];
  for(let j=-18;j<=27;j++){ const k=Math.pow(2,j/4)/Math.SQRT2; if(k<WALL_LO*0.999||k>WALL_HI*1.001) continue; ks.push(k); sg.push(2*wallRung(j).sigma); }
  return {ks,sg}; }); }
function hc1Curve(){ return memo('hc1Curve','all',()=>{ const ks=[], h=[];
  for(let j=0;j<=27;j++){ const k=Math.pow(2,j/4)/Math.SQRT2; if(k>VX_HI*1.001) continue; ks.push(k); h.push(vortexRung(j).hc1); }
  return {ks,h}; }); }
function wallView(st){
  const kap=st.kap, W=memo('wall',String(kap),()=>glWall(kap)), m=matOf(st.mat);
  /* the window holds the energy's tails: the field's e^(-x/lambda) on the superconducting side (type II) and the order's
     recovery over xi (type I), so the shading adds up to sigma to about a per cent */
  const xi=1/kap, xlo=-Math.max(3,2.4*xi), xhi=Math.max(6,4.5*xi);
  const w=W.W, xs=[], f=[], b=[], g=[];
  for(const i of thin(w.n,1400)){ const x=w.x0+i*w.dx; if(x<xlo||x>xhi) continue; xs.push(x); f.push(w.f[i]); b.push(w.b[i]/HC); g.push((w.b[i]-HC)*(w.b[i]-HC)-w.f[i]*w.f[i]*w.f[i]*w.f[i]/2); }
  const V=kap>1/Math.SQRT2?memo('vx',String(kap),()=>glVortex(kap)):null;
  return {kap,xi,W,sigma:W.sigma,delta:2*W.sigma,xlo,xhi,xs,f,b,g,type:kap<1/Math.SQRT2?1:2,mat:m,
    hc1:V?V.hc1:null,hc2:Math.SQRT2*kap};
}

/* ---- flux quanta ---- */
function vortexView(st){
  const kap=Math.max(st.kap,VX_LO), V=memo('vx',String(kap),()=>glVortex(kap)), m=matOf(st.mat);
  /* the lattice at B = vB Hc2: spacing a = sqrt(4 pi/(sqrt3 vB)) xi, one flux quantum per cell */
  const a_xi=Math.sqrt(4*PI/(Math.sqrt(3)*st.vB)), a_lam=a_xi/kap;
  const beta={tri:memo('betaT','t',()=>abrBeta('tri',96)),sq:memo('betaS','s',()=>abrBeta('sq',96))};
  const rs=[], f=[], bb=[], bl=[]; const Vv=V.V;
  for(const i of thin(Vv.n+1,700)){ const r=i*Vv.dr; if(r>6) break; rs.push(r); f.push(Vv.f[i]); bb.push(Vv.b[i]); bl.push(r>0?K0f(r)/kap:NaN); }
  const ring=ringState(st.vPhi);
  /* London's lattice: the field at a triangle's centre, its least, as a share of the mean */
  const dip=st.vMode==='london'?memo('dip',[a_lam,kap].join('|'),()=>{ const L=londonLattice(a_lam,null,0,1/kap); return L.b(a_lam/2,a_lam/(2*Math.sqrt(3)))/L.mean; }):null;
  return {kap,V,hc1:V.hc1,hc2:Math.SQRT2*kap,vB:st.vB,a_xi,a_lam,mode:st.vMode,beta,rs,f,bb,bl,ring,phi:st.vPhi,Rxi:st.vRing,
    dTc:-ring.depth/(st.vRing*st.vRing),mat:m,type:kap<1/Math.SQRT2?1:2,dip,
    Bmean:st.vB*Math.SQRT2*kap};
}
/* the lattice map (memoized by its parameters and the pixel grid) */
function latticeMap(X,nx,ny,wlam,hlam){ return memo('latmap',[X.mode,X.vB,X.kap,nx,ny,wlam.toFixed(4),hlam.toFixed(4)].join('|'),()=>{
  const out=new Float64Array(nx*ny); let mx=0;
  if(X.mode==='abr'){ /* |psi|^2 in the magnetic length, which is xi at Hc2: l = xi/sqrt(vB) */
    const sc=Math.sqrt(X.vB)*X.kap;               /* lambda units -> magnetic lengths */
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const x=((i+0.5)/nx-0.5)*wlam*sc, y=((j+0.5)/ny-0.5)*hlam*sc; const p=abrPsi2('tri',x+ABR.tri.q/2,y+PI/ABR.tri.q/2); out[j*nx+i]=p; mx=Math.max(mx,p); }
  } else { const L=londonLattice(X.a_lam,null,0.5*Math.hypot(wlam,hlam),1/X.kap); let mn=Infinity;
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const x=((i+0.5)/nx-0.5)*wlam, y=((j+0.5)/ny-0.5)*hlam; const v=L.b(x,y); out[j*nx+i]=v; mx=Math.max(mx,v); mn=Math.min(mn,v); }
    return {v:out,max:mx,min:0,least:mn,mean:L.mean}; }
  let s=0; for(const v of out) s+=v; return {v:out,max:mx,min:0,mean:s/out.length}; }); }

/* ---- two fluids ---- */
function tfCurves(){ return memo('tfCurves','all',()=>{ const Ts=[], lan=[], ph=[], ro=[];
  for(let i=0;i<=90;i++){ const T=0.3+(2.17-0.3)*i/90; Ts.push(T); const r=rhoOf(T); lan.push(rhoNLandau(T)/r); ph.push(rhoNPhonon(T)/r); ro.push(rhoNRoton(T)/r); }
  const u2T=[], u2p=[]; for(let i=0;i<=120;i++){ const T=0.8+(2.1767-0.8)*i/120; u2T.push(T); u2p.push(u2TwoFluid(T)); }
  return {Ts,lan,ph,ro,u2T,u2p}; }); }
function twofluidView(st){ const T=st.tT, r=rhoOf(T);
  const F=fountain(T,st.tDT);
  return {T,rho:r,rs:rsOf(T),rn:rnMeas(T),rnL:rhoNLandau(T)/r,S:sOf(T),u2m:interp(HE.u2,T),u2p:u2TwoFluid(T),inU2:T>=HE.u2[0][0],
    h:F.h,perMK:F.perMK,pf:F.pf,dT:st.tDT,pfL:fountain(T_LAMBDA,0).pf,hL:sInt(T_LAMBDA)*1000/PH.g,curves:tfCurves()};
}

/* ---- Landau's criterion ---- */
function landauView(st){ const v=st.lV, L=LANDAU;
  /* the wavenumbers whose excitations have E < hbar Q v: an object at v can make them */
  const band=[]; let inB=false, q0=0;
  for(let i=1;i<=3600;i++){ const Q=i*0.001, ok=L.vp(Q)<v; if(ok&&!inB){ inB=true; q0=Q; } if(!ok&&inB){ inB=false; band.push([q0,Q]); } }
  if(inB) band.push([q0,3.6]);
  return {v,L,band,vL:L.vL,Qs:L.Qs,Delta:L.Delta,Q0:L.Q0,mu:L.mu,u1:L.u1,cK:L.cK,above:v>L.vL};
}

/* ---- the rotating bucket ---- */
function bucketParams(st){ return memo('bucketP',[st.bR,st.bT,st.bOm].join('|'),()=>{
  const R=st.bR*1e-3, a0=a0Of(st.bT), ell=Math.log(R/a0), Om0=PH.kap4/(2*PI*R*R), om=st.bOm;
  const steps=memo('bucketSteps',[st.bR,st.bT].join('|'),()=>{ const out=[]; for(let N=1;N<=8;N++) out.push(bucketStep1(N,ell)); return out; });
  let Neq=0; for(let N=1;N<=8;N++) if(om>=steps[N-1]) Neq=N;
  return {R,a0,ell,Om0,om,Om:om*Om0,alpha:alphaOf(st.bT),tau:R*R/PH.kap4,steps,Neq,feyn:om,
    Fmins:Array.from({length:10},(_,N)=>N===0?0:(N<=8?bucketFmin(N,om,ell).F:NaN))};
}); }
function bucketView(st){
  if(st.bMode==='annulus'){ const R=st.aR*1e-2, Om0=PH.kap4/(2*PI*R*R), n=Math.floor(st.aOm+0.5);
    return {mode:'annulus',R,Om0,om:st.aOm,Om:st.aOm*Om0,n,frac:st.aOm>0?n/st.aOm:0,turnH:2*PI/Om0/3600}; }
  const B=bucketParams(st), S=vortSim(st);
  const Fnow=S.x.length?bucketF(S.x,S.y,B.om,B.ell):0;
  return Object.assign({mode:'bucket',N:S.x.length,xs:S.x.slice(),ys:S.y.slice(),Fnow,simT:SIM.vortT},B);
}

function buildModel(){
  const v=ST.view, M={view:v};
  if(v==='expel') M.E=expelView(ST);
  else if(v==='wall') M.Wl=wallView(ST);
  else if(v==='vortex') M.X=vortexView(ST);
  else if(v==='twofluid') M.T=twofluidView(ST);
  else if(v==='landau') M.L=landauView(ST);
  else M.B=bucketView(ST);
  return M;
}

function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }

function presetName(list,id){ const p=(list||[]).find(q=>q.id===id); return p?p.name:'your own'; }

function sgn(x,n){ return isFinite(x)?(x<0?'−':'')+fmt(Math.abs(x),n):'—'; }
/* a number with a power of ten in superscript, never a raw exponent */
function sci(x,n){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const e=Math.floor(Math.log10(Math.abs(x))); if(e>=-2&&e<=3) return sigf(x,n);

function noteFor(v){
  if(v==='expel') return ST.eMode==='sphere'?'A perfect conductor keeps the field it had when it went perfect; a superconductor pushes it out whatever its history (the Meissner effect article).'
    :'Placing a magnet over a plate already superconducting does not show the Meissner effect; a magnet at rest that rises as the plate is cooled does (the Meissner effect article).';
  if(v==='wall') return 'Superconductors with &kappa; &lt; 1/&radic;2 are of type I and those with &kappa; &gt; 1/&radic;2 of type II (the Ginzburg&ndash;Landau article): the wall between normal and superconducting metal costs energy in the first and pays in the second.';
  if(v==='vortex') return 'Abrikosov found that the vortices arrange themselves into a regular array, each carrying one flux quantum (the Type-II superconductor and Abrikosov vortex articles).';
  if(v==='twofluid') return 'Below the lambda line the liquid can be described by a two-fluid model (the Superfluid helium-4 article); the numbers here are Donnelly and Barenghi&rsquo;s.';
  if(v==='landau') return 'Superfluid flow holds only below a critical velocity, usually set by the flow channel (the Superfluid helium-4 article); Landau&rsquo;s bound is the most a perfect channel could allow.';
  return ST.bMode==='bucket'?'Below the first critical angular velocity the liquid remains perfectly stationary; faster, quantized vortices form in patterns like the Abrikosov lattice (the Superfluid helium-4 article).'
    :'Hess and Fairbank (1967): a rotational Meissner effect, the superfluid forming at zero angular momentum in a slowly turning container.';
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *

 *  pulsar.html (v3, makeCamera, camBasis, project)                    *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);

}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';

function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);

  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }

function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();

/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }

     name the colours); clebsch_gordan: forcing it in a big box put it on the mean's label */
  if(!pick){ KEY_DROPS+=items.length; return; }
  legendBox(ctx,pick[0],pick[1],items);
  const lb=[pick[0],pick[1],pick[0]+bw,pick[1]+bh]; lb.t='the legend'; lb.plate=true; lb.seq=++DRAW_SEQ; LABELS.push(lb);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);

function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){

/* ---- 3-vector helpers, orbit camera, perspective projection (z-up) — pulsar.html, unchanged ---- */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
let AXES_BAD=0;
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  if(![xlo,xhi,ylo,yhi].every(isFinite)||!(xhi!==xlo&&yhi!==ylo)) AXES_BAD++;

  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);

    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }

}

/* the width a key row takes, and the long title only when the title and the key both fit above the plot (keyRow

function keyW(items){ let w=0; for(const it of items) w+=plain(it[1]).length*10.5*0.52+30; return w; }
function titleKey(b,longT,shortT,items){ const tw=t=>plain(t).length*13*0.52+14; return b.w>=330&&tw(longT)+keyW(items)<=b.w?longT:shortT; }
function xOf(b,lo,hi,v){ return b.x+b.w*(v-lo)/(hi-lo||1); }
function yOf(b,lo,hi,v){ return b.y1-b.h*(v-lo)/(hi-lo||1); }
/* a vertical marker line inside a plot (recorded, so a test can find a label it crosses) */
function vmark(ctx,b,xlo,xhi,x,col,dash,lw){
  const X=xOf(b,xlo,xhi,x); if(!(X>=b.x-0.5&&X<=b.x1+0.5)) return null;
  ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.strokeStyle=col; ctx.lineWidth=lw||1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  MARKS.push({X,y0:b.y,y1:b.y1,seq:++DRAW_SEQ}); return X;
}
function hmark(ctx,b,ylo,yhi,y,col,dash,lw){
  const Y=yOf(b,ylo,yhi,y); if(!(Y>=b.y-0.5&&Y<=b.y1+0.5)) return null;
  ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.strokeStyle=col; ctx.lineWidth=lw||1; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(b.x,Y,b.x1,Y); return Y;
}
/* a shaded vertical band from x0 to x1, clipped to the box */
function xband(ctx,b,xlo,xhi,x0,x1,fill){
  const X0=clamp(xOf(b,xlo,xhi,Math.min(x0,x1)),b.x,b.x1), X1=clamp(xOf(b,xlo,xhi,Math.max(x0,x1)),b.x,b.x1);
  if(X1-X0<0.5) return; ctx.fillStyle=fill; ctx.fillRect(X0,b.y,X1-X0,b.h);
}
/* every k-th sample, so a curve of any length is drawn with at most n points */
function thin(n,max){ const k=Math.max(1,Math.ceil(n/max)), out=[]; for(let i=0;i<n;i+=k) out.push(i); if(out[out.length-1]!==n-1) out.push(n-1); return out; }
/* tick labels with the fewest decimals that print every tick exactly (a step of 0.25 must not print 0.3; the
   Known-bad entry on ceil(-log10 step) decimals) */
function adFmt(lo,hi,n,signed){ const t=ticksFor(Math.min(lo,hi),Math.max(lo,hi),n); let d=0;
  for(;d<4;d++){ const p=Math.pow(10,d); if(t.every(v=>Math.abs(Math.round(v*p)-v*p)<1e-6)) break; }
  return v=>signed?sgnT(v,d):fmt(v,d); }
/* a number with a power of ten in superscript digits for the canvas (sci is the panels' HTML form) */
function sciT(x,n){ if(!isFinite(x)||x===0) return sigf(x,n); const e=Math.floor(Math.log10(Math.abs(x))); if(e>=-2&&e<=3) return sigf(x,n);
  const m=x/Math.pow(10,e); return (m<0?'−':'')+fmt(Math.abs(m),n-1)+' × 10'+supN(e); }
/* ten to an integer power, with superscript digits, never a caret */
function p10(t){ return Math.abs(t-Math.round(t))<1e-9?'10'+supN(Math.round(t)):sigf(Math.pow(10,t),2); }
/* integer ticks for a log10 axis, thinned to at most n */
function logTicksI(lo,hi,n){ const a=Math.ceil(lo-1e-9), b=Math.floor(hi+1e-9), step=Math.max(1,Math.ceil((b-a+1)/(n||6))), out=[];
  for(let t=a;t<=b;t+=step) out.push(t); return out.length?out:[Math.round(lo)]; }
/* a data-space polyline drawn in any box (the main picture too), clipped to it and recorded */
function dline(ctx,b,map,pts,col,lw,dash){ polyline(ctx,b,pts.map(p=>p[0]),pts.map(p=>p[1]),map.x0,map.x1,map.y0,map.y1,col,lw,dash); }
/* marching squares: the level set of a grid G (nx x ny values, row j at y = y0 + j dy) as segments in data space.
   A saddle cell is split by its centre's value. */
function contour(G,nx,ny,x0,x1,y0,y1,level){
  const out=[], dx=(x1-x0)/(nx-1), dy=(y1-y0)/(ny-1);
  const v=(i,j)=>G[j*nx+i]-level;
  const lerp2=(a,b)=>a/(a-b);
  for(let j=0;j<ny-1;j++) for(let i=0;i<nx-1;i++){
    const a=v(i,j), b2=v(i+1,j), c=v(i+1,j+1), d=v(i,j+1);
    if(!(isFinite(a)&&isFinite(b2)&&isFinite(c)&&isFinite(d))) continue;
    const idx=(a>0?1:0)|(b2>0?2:0)|(c>0?4:0)|(d>0?8:0); if(idx===0||idx===15) continue;
    const X=x0+i*dx, Y=y0+j*dy;
    const eB=[X+dx*lerp2(a,b2),Y], eR=[X+dx,Y+dy*lerp2(b2,c)], eT=[X+dx*lerp2(d,c),Y+dy], eL=[X,Y+dy*lerp2(a,d)];
    const add=(p,q)=>out.push(p[0],p[1],q[0],q[1]);
    switch(idx){
      case 1: case 14: add(eL,eB); break;  case 2: case 13: add(eB,eR); break;  case 3: case 12: add(eL,eR); break;
      case 4: case 11: add(eR,eT); break;  case 6: case 9: add(eB,eT); break;   case 7: case 8: add(eL,eT); break;
      case 5: case 10: { const m=(a+b2+c+d)/4; if((m>0)===(idx===5)){ add(eL,eT); add(eB,eR); } else { add(eL,eB); add(eR,eT); } break; }
    }
  }
  return out;
}
/* draw segments (data space) in box b, with the map {x0,x1,y0,y1}; recorded for the tests */
function drawSegs(ctx,b,map,segs,col,lw){
  const X=x=>b.x+b.w*(x-map.x0)/(map.x1-map.x0), Y=y=>b.y1-b.h*(y-map.y0)/(map.y1-map.y0);
  ctx.beginPath();
  for(let k=0;k<segs.length;k+=4){ const x0=X(segs[k]), y0=Y(segs[k+1]), x1=X(segs[k+2]), y1=Y(segs[k+3]);
    ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); POLY_SEGS.push(x0,y0,x1,y1); }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1; ctx.stroke();
}
/* heat-map colours, dark to bright in one hue: the pairs in the computed quantity's green, the field in its cyan */
const rampPairs=t=>mix('#070b18','#b8ec4c',Math.pow(clamp(t,0,1),0.85)), rampField=t=>mix('#070b18','#5ac8e0',Math.pow(clamp(t,0,1),0.85));
/* a heat map as filled cells (a canvas fillRect each: the recorder sees every one) */
function heatCells(ctx,b,nx,ny,val,colOf){
  const cw=b.w/nx, ch=b.h/ny;
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ ctx.fillStyle=colOf(val(i,j)); ctx.fillRect(b.x+i*cw,b.y+j*ch,cw+0.6,ch+0.6); }
}

/* ================================================================== *
 *  views 1-3: the Meissner effect, two lengths, flux quanta           *

/* a box inside b with the aspect of the data map (w/h in data units), centred */
function fitAspect(b,dw,dh){ const s=Math.min(b.w/dw,b.h/dh), w=dw*s, hh=dh*s; return box(b.x+(b.w-w)/2,b.y+(b.h-hh)/2,w,hh); }
const mapX=(b,m,x)=>b.x+b.w*(x-m.x0)/(m.x1-m.x0), mapY=(b,m,y)=>b.y1-b.h*(y-m.y0)/(m.y1-m.y0);

/* ---------------- the Meissner effect ---------------- */
function expelCaption(E){
  if(E.mode==='sphere'){
    /* nothing here may change with lambda/a, which is dragged on the screened-share plot */
    const main=(E.mat==='sc'?'A superconducting sphere in the field B, cut through its axis: the field lines bend round it, because currents in a shell about λ thick screen its inside. Cooled in the field or cooled first, it ends the same. Where its equator passes Bc (the readout flags it), a real type I sphere lets the field in, in layers (the intermediate state), which London’s equation alone leaves out.'
      :'A perfectly conducting sphere, cut through its axis: it keeps the field it had when it cooled (here '+fmt(E.cool,2)+' Bc) and screens only the change since.')
      +(E.mat==='pc'&&E.now<E.cool-1e-9?' The field switched off, it is left holding the rest: a magnet.':'');
    return {full:main+' Below, the field along the equator from the centre out, and the share of the field the sphere screens as λ/a grows.',
      short:'The sphere in the field B, cut through its axis; below, the field along the equator and the screened share.',main,mainShort:'The sphere in the field B, cut through its axis.'};
  }
  const main=(E.story==='cooled'?(E.mat==='sc'?'A magnetized ball resting on a plate as the plate is cooled: the plate pushes the ball’s field out, its currents act as a mirror-image magnet below, and the ball rises. It turns to lie flat and floats.'
      :'A magnetized ball resting on a plate cooled into a perfect conductor: the field the plate had stays frozen in it, nothing pushes, and the ball stays where it lies.')
    :'A magnetized ball lowered onto a plate already cold: superconducting or perfectly conducting, the plate screens the change, the ball bounces on the field and settles.');
  return {full:main+' Below, the push against the height (upright and flat, in units of the ball’s weight, on a log scale), and the height over time.',
    short:'A magnet over a plate; below, the push against the height and the height over time.',main,mainShort:'A magnet over a plate.'};
}
function drawExpel(ctx,W,H,M){
  const E=M.E, cap=capFor(W,expelCaption(E)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.38,nbNarrow(H));
  if(E.mode==='sphere'){ drawSphereSection(ctx,Lay.main,E); if(Lay.bottom[0]) plotSphereBz(ctx,Lay.bottom[0],E); if(Lay.bottom[1]) plotSphereM(ctx,Lay.bottom[1],E); }
  else { drawBallScene(ctx,Lay.main,E); if(Lay.bottom[0]) plotBallForce(ctx,Lay.bottom[0],E); if(Lay.bottom[1]) plotBallTrace(ctx,Lay.bottom[1],E); }

function drawSphereSection(ctx,mb,E){
  const m=SPH_BOX, b=fitAspect(box(mb.x,mb.y+18,mb.w,mb.h-18),m.x1-m.x0,m.y1-m.y0);
  lab(ctx,W_STAGE,H_STAGE,mb.x,mb.y,E.mat==='sc'?'a superconducting sphere, cut through its axis':'a perfectly conducting sphere, cut through its axis','#aeb6c6',TITLE_FONT,'left','top');

  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.fillStyle=E.mat==='sc'?'#13283d':'#2a2533'; ctx.fill();
  const inner=Math.max(0,R*(1-E.lam));
  if(E.mat==='sc'&&inner<R-0.5){ ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.arc(cx,cy,inner,0,TAU,true); ctx.fillStyle='rgba(90,200,224,0.20)'; ctx.fill(); }
  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.strokeStyle=COL.metal; ctx.lineWidth=1.4; ctx.stroke();
  for(const L of E.lines) drawSegs(ctx,b,m,L,COL.field,1.25);

}

function drawBallScene(ctx,mb,E){
  const P=E.P, s=E.s, Z=2.6*P.zUp, ttl=E.mat==='sc'?'a magnetized ball over a superconducting plate':'a magnetized ball over a perfectly conducting plate';
  lab(ctx,W_STAGE,H_STAGE,mb.x,mb.y,ttl,'#aeb6c6',TITLE_FONT,'left','top');
  const inner=box(mb.x,mb.y+18,mb.w,mb.h-18), zlo=-0.16*Z, asp=inner.w/inner.h, X=(Z-zlo)*asp/2;
  const m={x0:-X,x1:X,y0:zlo,y1:Z}, b=inner;
  /* the plate */
  const Y0=mapY(b,m,0); ctx.fillStyle=E.mat==='sc'?'#13283d':'#2a2533'; ctx.fillRect(b.x,Y0,b.w,b.y1-Y0);
  ctx.beginPath(); ctx.moveTo(b.x,Y0); ctx.lineTo(b.x1,Y0); ctx.strokeStyle=COL.metal; ctx.lineWidth=1.3; ctx.stroke();
  lab(ctx,W_STAGE,H_STAGE,b.x+8,(Y0+b.y1)/2,E.mat==='sc'?'superconductor':'perfect conductor',COL.dim,SM_FONT,'left','middle');
  /* the field lines: traced from a ring round the ball, with the image as far as the plate has pushed its field out */
  const img=E.fr, Bf=(x,z)=>{ const a=ballField(P,x,z,s.z,s.al,false); if(img<=0) return a; const c=ballField(P,x,z,s.z,s.al,true); return [a[0]+img*(c[0]-a[0]),a[1]+img*(c[1]-a[1])]; };
  const hstep=P.R*0.12;
  for(let k=0;k<16;k++){ const th=(k+0.5)*TAU/16, x0=1.15*P.R*Math.sin(th), z0=s.z+1.15*P.R*Math.cos(th);
    for(const dir of [1,-1]){ const pts=[[x0,z0]]; let x=x0, z=z0;
      for(let i=0;i<600;i++){ const f=(xx,zz)=>{ const B=Bf(xx,zz), n=Math.hypot(B[0],B[1])||1; return [dir*B[0]/n,dir*B[1]/n]; };
        const k1=f(x,z), k2=f(x+hstep/2*k1[0],z+hstep/2*k1[1]), k3=f(x+hstep/2*k2[0],z+hstep/2*k2[1]), k4=f(x+hstep*k3[0],z+hstep*k3[1]);
        x+=hstep*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6; z+=hstep*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6; pts.push([x,z]);
        if(Math.hypot(x,z-s.z)<P.R*0.98||x<m.x0||x>m.x1||z>m.y1||z<m.y0) break;
        if(img>=1&&z<0) break; }
      dline(ctx,b,m,pts,img>0?COL.field:'rgba(90,200,224,0.55)',1.1); } }
  /* the ball and its moment */
  const cx=mapX(b,m,0), cy=mapY(b,m,s.z), Rp=b.w/(m.x1-m.x0)*P.R;
  ctx.beginPath(); ctx.arc(cx,cy,Rp,0,TAU); ctx.fillStyle='#6b6f7c'; ctx.fill(); ctx.strokeStyle='#c9ced9'; ctx.lineWidth=1; ctx.stroke();
  arrowPx(ctx,cx-0.8*Rp*Math.sin(s.al),cy+0.8*Rp*Math.cos(s.al),cx+0.8*Rp*Math.sin(s.al),cy-0.8*Rp*Math.cos(s.al),'#ffffff',1.6);
  if(E.story==='cooled'&&E.mat==='sc'||E.story==='lowered'){ const Yf=mapY(b,m,P.zFlat); ctx.setLineDash([3,4]); ctx.beginPath(); ctx.moveTo(b.x1-0.22*b.w,Yf); ctx.lineTo(b.x1,Yf); ctx.strokeStyle=COL.ref; ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,W_STAGE,H_STAGE,b.x1-4,Yf-9,'it floats here, flat',COL.ref,SM_FONT,'right','middle',PLATE); }
  /* the scale */
  const cm=b.w/(m.x1-m.x0)*0.01; if(cm>18){ const X0=b.x1-cm-12, Yb=b.y1-10; ctx.beginPath(); ctx.moveTo(X0,Yb); ctx.lineTo(X0+cm,Yb); ctx.strokeStyle=COL.dim; ctx.lineWidth=1.5; ctx.stroke();
    lab(ctx,W_STAGE,H_STAGE,X0+cm/2,Yb-8,'1 cm',COL.dim,SM_FONT,'center','middle'); }
}

/* ---------------- two lengths ---------------- */
function wallCaption(Wl){
  /* nothing here may change with kappa, which is dragged on the kappa plot (the plot's title and the readout give it) */
  const main='The wall between normal metal (left, where the field H = Hc stands) and superconductor (right): the order ψ (green) grows over ξ, the field (cyan) dies over λ, lengths in λ. The shading is the wall’s energy per length: orange where the field has been pushed out before the order has grown (a cost), green where the order has grown before the field has gone (a gain). Its sum decides the type: positive for type I, negative for type II, zero at κ = 1/√2.';
  return {full:main+' Below, that sum against κ, zero at 1/√2, and the fields a sample of this κ can stand as it is cooled.',
    short:'The wall between normal metal and superconductor; below, its energy against κ and the fields it stands.',main,mainShort:'The wall between normal metal and superconductor.'};
}
function drawWall(ctx,W,H,M){
  const Wl=M.Wl, cap=capFor(W,wallCaption(Wl)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  plotWallProfile(ctx,Lay.main,Wl);
  if(Lay.bottom[0]) plotSigmaKappa(ctx,Lay.bottom[0],Wl);
  if(Lay.bottom[1]) plotPhase(ctx,Lay.bottom[1],Wl);
  drawCaption(ctx,Lay);
}
function plotWallProfile(ctx,mb,Wl){

/* ---------------- flux quanta ---------------- */
function vortexCaption(X){
  const main=X.type===2?(X.mode==='abr'?'Abrikosov’s lattice near Hc2 at B = '+sigf(X.vB,2)+' Hc2 and κ = '+sigf(X.kap,3)+': |ψ|², bright where the pairs are, zero at each vortex; one flux quantum h/2e threads every cell (outlined), '+sigf(X.a_xi,3)+' ξ across.'+(X.vB<0.3?' Abrikosov’s form holds near Hc2; this far below it, London’s picture is the better one.':'')
      :'The field of a vortex lattice at low field, London’s way: each line carries h/2e in a tube about λ across (cut at the core, ξ), '+sigf(X.a_lam,3)+' λ apart; the colour is B, κ = '+sigf(X.kap,3)+'. Between the lines it falls to '+pct(X.dip,1)+' of the mean'+(X.dip>0.9?': lines closer than λ overlap into a nearly even field.':'.'))
    :'κ = '+sigf(X.kap,3)+' is below 1/√2: one vortex, solved in Ginzburg–Landau theory all the same (|ψ|²), costs more than the field it lets in pays (Hc1 = '+fmt(X.hc1,3)+' Hc, above Hc itself), so a type I superconductor lets in no lattice; a field enters it as normal layers (the intermediate state).';
  return {full:main+' Below, one vortex solved in Ginzburg–Landau theory (the order and the field against the distance from its axis), and a ring’s Tc as the flux through it grows (Little and Parks).',
    short:'The vortex lattice; below, one vortex and a ring’s Tc.',main,mainShort:'The vortex lattice.'};
}
function drawVortex(ctx,W,H,M){
  const X=M.X, cap=capFor(W,vortexCaption(X)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  drawLattice(ctx,Lay.main,X);
  if(Lay.bottom[0]) plotVortexProfile(ctx,Lay.bottom[0],X);
  if(Lay.bottom[1]) plotRing(ctx,Lay.bottom[1],X);
  drawCaption(ctx,Lay);
}
function drawLattice(ctx,mb,X){
  const ttl=X.type===2?(X.mode==='abr'?'|ψ|² of the vortex lattice (Abrikosov)':'B of the vortex lattice (London)'):'type I: one vortex, and why none enter';
  lab(ctx,W_STAGE,H_STAGE,mb.x,mb.y,ttl,'#aeb6c6',TITLE_FONT,'left','top');
  if(X.type===1){ drawSingleVortex(ctx,box(mb.x,mb.y+20,mb.w,mb.h-20),X); return; }
  const b=box(mb.x,mb.y+20,mb.w,mb.h-20);
  /* the view spans 3.4 cells across */
  const wl=3.4*X.a_lam*b.w/Math.min(b.w,b.h*1.25), hl=wl*b.h/b.w;
  const nx=Math.max(24,Math.min(110,Math.round(b.w/(X.mode==='abr'?7:9)))), ny=Math.max(16,Math.round(nx*b.h/b.w));
  const Lm=latticeMap(X,nx,ny,wl,hl), span=Lm.max-Lm.min||1;   /* both maps start at 0 (latticeMap's min) */
  heatCells(ctx,b,nx,ny,(i,j)=>(Lm.v[(ny-1-j)*nx+i]-Lm.min)/span,X.mode==='abr'?rampPairs:rampField);
  frame(ctx,b,'#242a3a');
  /* the cell round the vortex at the centre (both maps put one there): the rhombus spanned by the lattice's own
     vectors, area sqrt3 a^2/2, one quantum.  London's lattice has a neighbour along x; Abrikosov's (C_n = e^(i pi n^2/2)
     in x) has its neighbours along y and at 30 degrees, so its cell stands upright */
  const s=b.w/wl, a=X.a_lam*s, cx=b.x+b.w/2, cy=b.y+b.h/2, vx=[cx,cy], [v1,v2]=cellVectors(X.mode);
  const P=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([p,q])=>[vx[0]+a*(p*v1[0]+q*v2[0])/2,vx[1]-a*(p*v1[1]+q*v2[1])/2]);
  ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.stroke();
  lab(ctx,W_STAGE,H_STAGE,vx[0],Math.min(...P.map(p=>p[1]))-10,'one h/2e',COL.text,SM_FONT,'center','middle',PLATE);
  /* the scale: one lambda */
  scaleBar(ctx,b,s,'λ');
}
/* the lattice's two shortest vectors, in units of the spacing (data axes, y up) */
function cellVectors(mode){ const r3=Math.sqrt(3)/2; return mode==='abr'?[[0,1],[r3,0.5]]:[[1,0],[0.5,r3]]; }
/* a scale bar of a round length (1, 2 or 5 times a power of ten of the unit) between 36 and 110 px */
function scaleBar(ctx,b,pxPerUnit,unit){
  let L=null; for(let e=-3;e<=3&&!L;e++) for(const m of [1,2,5]){ const v=m*Math.pow(10,e); if(v*pxPerUnit>=36&&v*pxPerUnit<=110){ L=v; break; } }
  if(!L||L*pxPerUnit>b.w/2) return;
  const X0=b.x+14, Yb=b.y1-12, w=L*pxPerUnit; ctx.beginPath(); ctx.moveTo(X0,Yb); ctx.lineTo(X0+w,Yb); ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.stroke();
  lab(ctx,W_STAGE,H_STAGE,X0+w/2,Yb-10,(L===1?'':sigf(L,1)+' ')+unit,COL.text,SM_FONT,'center','middle',PLATE);
}
/* type I: the one vortex Ginzburg-Landau theory still has, |psi|^2 = f(r)^2 over +-4 xi, beside what it costs */
function drawSingleVortex(ctx,b0,X){
  const V=X.V.V, ext=4/X.kap, bb=fitAspect(box(b0.x,b0.y,Math.min(b0.w*0.62,b0.h),b0.h),1,1);
  const n=Math.max(24,Math.min(90,Math.round(bb.w/6))), fr=r=>{ const u=r/V.dr, i=Math.floor(u); if(i>=V.n) return 1; const t=u-i; return V.f[i]+t*(V.f[i+1]-V.f[i]); };
  heatCells(ctx,bb,n,n,(i,j)=>{ const x=((i+0.5)/n-0.5)*2*ext, y=((j+0.5)/n-0.5)*2*ext, f=fr(Math.hypot(x,y)); return f*f; },rampPairs);
  frame(ctx,bb,'#242a3a');
  scaleBar(ctx,bb,bb.w/(2*ext*X.kap),'ξ');
  const tx=bb.x1+18, ty=bb.y+bb.h*0.3;
  lab(ctx,W_STAGE,H_STAGE,tx,ty,'Hc1 = '+fmt(X.hc1,3)+' Hc',COL.ref,LAB_FONT,'left','middle',PLATE);
  lab(ctx,W_STAGE,H_STAGE,tx,ty+18,'above Hc: a vortex costs more',COL.dim,SM_FONT,'left','middle',PLATE);
  lab(ctx,W_STAGE,H_STAGE,tx,ty+34,'than the field it lets in pays',COL.dim,SM_FONT,'left','middle',PLATE);
}
function plotVortexProfile(ctx,b,X){
  const items=[[COL.pos,'|ψ|'],[COL.field,'B/B(0)'],[COL.ref,'London',[4,3]]], ttl=titleKey(b,'one vortex, Ginzburg–Landau','one vortex',items), top=1.08, b0=X.V.V.b[0];
  axesT(ctx,b,0,6,0,top,{title:ttl,xlab:'r/λ',nx:6,ny:3,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1),yticks:[0,0.5,1]});
  polyline(ctx,b,X.rs,X.bl.map(v=>v/b0),0,6,0,top,COL.ref,1.2,[4,3]);
  polyline(ctx,b,X.rs,X.bb.map(v=>v/b0),0,6,0,top,COL.field,1.7);

function plotRing(ctx,b,X){
  const ttl=titleFor(b,'a ring’s Tc as the flux grows (Little–Parks)','the ring’s Tc'), d=1/(X.Rxi*X.Rxi), ylo=-0.3*d, yhi=0.04*d;
  axesT(ctx,b,-2.5,2.5,ylo,yhi,{title:ttl,xlab:'Φ/Φ₀',ylab:'ΔTc/Tc',nx:5,ny:3,xfmt:v=>sgnT(v,0),yticks:[-0.25*d,0],yfmt:v=>v===0?'0':'−(ξ/R)²/4'});
  const ps=[], ys=[]; for(let i=0;i<=1000;i++){ const p=-2.5+5*i/1000; ps.push(p); const n=Math.round(p); ys.push(-d*(n-p)*(n-p)); }
  for(let n=-3;n<=3;n++){ const xs=[], y2=[]; for(let i=0;i<=200;i++){ const p=-2.5+5*i/200; xs.push(p); y2.push(-d*(n-p)*(n-p)); } polyline(ctx,b,xs,y2,-2.5,2.5,ylo,yhi,'#39425a',1,[2,3]); }
  polyline(ctx,b,ps,ys,-2.5,2.5,ylo,yhi,COL.pos,1.8);
  marker(ctx,b,-2.5,2.5,ylo,yhi,X.phi,X.dTc,COL.live);
  HIT.push({kind:'vPhi',b});
}

 *  views 4-6: two fluids, Landau's criterion, the rotating bucket     *

/* ---------------- two fluids ---------------- */
function tfCaption(T){
  /* nothing here may change with T, which is dragged on both plots (the readout and the tag give it) */
  const main='Helium II in two vessels joined by a superleak, a plug so fine that only the superfluid gets through; '+(T.dT>0?'the right one is '+fmt(T.dT,1)+' mK warmer.':'both are at the same temperature, so the levels agree.')+' The superfluid carries no entropy, so it flows toward heat and lifts the level there by the fountain head, S ΔT/g.'
    +' The bar is the two fluids’ shares.';
  return {full:main+' Below, the normal fluid measured (Donnelly and Barenghi) against Landau’s gas of excitations from the measured spectrum, and second sound measured against the two-fluid formula from the measured tables.',
    short:'The fountain; below, the normal fluid and second sound, measured and computed.',main,mainShort:'The fountain effect in helium II.'};
}
function drawTwofluid(ctx,W,H,M){
  const T=M.T, cap=capFor(W,tfCaption(T)), Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.4,nbNarrow(H));
  drawFountain(ctx,Lay.main,T);
  if(Lay.bottom[0]) plotRhoN(ctx,Lay.bottom[0],T);
  if(Lay.bottom[1]) plotU2(ctx,Lay.bottom[1],T);
  drawCaption(ctx,Lay);
}
function drawFountain(ctx,mb,T){
  lab(ctx,W_STAGE,H_STAGE,mb.x,mb.y,'the fountain effect','#aeb6c6',TITLE_FONT,'left','top');
  const b=box(mb.x,mb.y+20,mb.w,mb.h-20), bw=Math.min(0.2*b.w,130), bh=b.h*0.7, gap=Math.max(70,0.14*b.w);
  const xL=b.x+0.18*b.w, xR=xL+bw+gap, yB=b.y1-8, yT=yB-bh;
  /* the scale: the vessels are 10 cm deep; the level on the left sits at 4 cm */
  const pxcm=bh/10, hcm=T.h*100, lvL=4, lvR=lvL+hcm, over=lvR>10;
  const fillTo=(x,lv)=>{ const Y=yB-Math.min(lv,10)*pxcm; ctx.fillStyle='rgba(90,200,224,0.28)'; ctx.fillRect(x+2,Y,bw-4,yB-Y); return Y; };
  const YL=fillTo(xL,lvL), YR=fillTo(xR,lvR);
  for(const x of [xL,xR]){ ctx.beginPath(); ctx.moveTo(x,yT); ctx.lineTo(x,yB); ctx.lineTo(x+bw,yB); ctx.lineTo(x+bw,yT); ctx.strokeStyle=COL.metal; ctx.lineWidth=1.6; ctx.stroke(); }
  /* the tube and its superleak */
  const ty=yB-0.06*bh; ctx.fillStyle='rgba(90,200,224,0.28)'; ctx.fillRect(xL+bw,ty-6,gap,12);
  ctx.beginPath(); ctx.moveTo(xL+bw,ty-6); ctx.lineTo(xR,ty-6); ctx.moveTo(xL+bw,ty+6); ctx.lineTo(xR,ty+6); ctx.strokeStyle=COL.metal; ctx.lineWidth=1.3; ctx.stroke();
  const px=xL+bw+gap/2-12; ctx.fillStyle='#5b5f6b'; ctx.fillRect(px,ty-6,24,12);
  ctx.strokeStyle='#8d95a8'; ctx.lineWidth=0.8; for(let k=0;k<6;k++){ ctx.beginPath(); ctx.moveTo(px+4*k,ty-6); ctx.lineTo(px+4*k+6,ty+6); ctx.stroke(); }
  lab(ctx,W_STAGE,H_STAGE,px+12,ty+18,'superleak',COL.dim,SM_FONT,'center','middle',PLATE);
  if(T.dT>0){ arrowPx(ctx,xL+bw+6,ty-16,xR-6,ty-16,COL.struct,1.5); lab(ctx,W_STAGE,H_STAGE,(xL+bw+xR)/2,ty-28,'superfluid',COL.struct,SM_FONT,'center','middle',PLATE);
    /* the heater */
    ctx.beginPath(); for(let k=0;k<=8;k++){ const X=xR+bw*0.2+k*bw*0.075, Y=yB-10+(k%2?-6:6); k?ctx.lineTo(X,Y):ctx.moveTo(X,Y); } ctx.strokeStyle=COL.ref; ctx.lineWidth=1.8; ctx.stroke();
    lab(ctx,W_STAGE,H_STAGE,xR+bw/2,yB+4,'+'+fmt(T.dT,1)+' mK',COL.ref,SM_FONT,'center','top'); }
  /* the head */
  if(T.dT>0&&!over&&YL-YR>6){ const X=xR+bw+14; ctx.beginPath(); ctx.moveTo(X,YL); ctx.lineTo(X,YR); ctx.strokeStyle=COL.pos; ctx.lineWidth=1.4; ctx.stroke();
    ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(xL,YL); ctx.lineTo(X,YL); ctx.strokeStyle='#4a5470'; ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,W_STAGE,H_STAGE,X+6,(YL+YR)/2,'h = '+sigf(hcm,3)+' cm',COL.pos,LAB_FONT,'left','middle',PLATE); }
  if(over){ /* it overflows: a fountain */
    for(let k=0;k<9;k++){ const a=-PI/2+(k-4)*0.12, L=Math.min(0.5*bh,30+8*Math.min(hcm-6,20)); arrowPx(ctx,xR+bw/2,yT,xR+bw/2+L*Math.cos(a)*0.6,yT+L*Math.sin(a),'rgba(90,200,224,0.8)',1.1); }
    lab(ctx,W_STAGE,H_STAGE,xR+bw+10,yT+12,'a fountain: h = '+sigf(hcm,3)+' cm, over the top',COL.pos,LAB_FONT,'left','middle',PLATE); }
  /* the two fluids' shares */
  const bx=b.x1-40, bbh=bh*0.9, by=yB-bbh; ctx.fillStyle='rgba(90,200,224,0.55)'; ctx.fillRect(bx,by+bbh*(1-T.rs),22,bbh*T.rs);
  ctx.fillStyle='rgba(232,132,58,0.6)'; ctx.fillRect(bx,by,22,bbh*(1-T.rs)); ctx.strokeStyle=COL.metal; ctx.lineWidth=1; ctx.strokeRect(bx,by,22,bbh);
  lab(ctx,W_STAGE,H_STAGE,bx-6,by+bbh*(1-T.rs/2),'ρs',COL.struct,SM_FONT,'right','middle',PLATE);
  if(1-T.rs>0.06) lab(ctx,W_STAGE,H_STAGE,bx-6,by+bbh*(1-T.rs)/2,'ρn',COL.ref,SM_FONT,'right','middle',PLATE);
}

  axesT(ctx,b,0.3,2.17,lo,hi,{title:ttl,xlab:'T (K)',ylab:'ρn/ρ',nx:5,ny:4,xfmt:v=>fmt(v,1),yticks:[-6,-4,-2,0],yfmt:p10});

function plotU2(ctx,b,T){
