function tubeCaption(M){
  const U=M.U, an=ANODES[ST.tAnode];
  return {full:'Electrons of '+fmt(ST.tV,0)+' keV stop in a '+an.name+' anode: each emits the thin-target spectrum of the previous view at every energy it passes on the way down (CSDA, ESTAR’s stopping power), so the thick target adds them up. Kramers’ straight line Z(E₀ − E) is the classical version. Nothing passes the Duane–Hunt wall at eV, where the electron gives its whole energy to one photon. The anode absorbs its own soft photons along the take-off path, with jumps at its absorption edges, and the filter takes more. Only '+pct(U.Y,2)+' of the beam’s energy comes out as x-rays; the rest heats the anode. The characteristic lines (marked) come from the anode’s inner shells emptied by the beam, a different process, not modelled here.',
    short:'The thick-target spectrum: Kramers’ line, bent by self-absorption and the filter; nothing past eV.'};
}
function drawTube(ctx,W,H,M){
  const U=M.U, st=ST, cap=tubeCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.40,nbNarrow(H));
  drawTubeSpec(ctx,W,H,Lay.main,U,st);
  const B=Lay.bottom;
  if(B.length===1) drawTubeEff(ctx,W,H,B[0],U,st);          /* one slot: the efficiency */
  else if(B.length===2){ drawTubeSchem(ctx,W,H,B[0],U,st); drawTubeEff(ctx,W,H,B[1],U,st); }
  drawCaption(ctx,Lay);
}
/* the spectrum as energy per unit photon energy (k dN/dk, per electron), or per unit wavelength */
function drawTubeSpec(ctx,W,H,b,U,st){
  const sp=U.sp, T0=sp.T0, wav=st.tAxis==='L';
  const conv=(k,y)=>wav?y*k*k/HC_EVNM:y;                 /* per eV → per nm: |dk/dλ| = k²/(hc) */
  const xs=sp.ks.map(k=>wav?HC_EVNM/k:k/1e3);
  const yf=sp.ks.map((k,j)=>conv(k,k*sp.dN[j])), y0=sp.ks.map((k,j)=>conv(k,k*sp.dN0[j])), ys=sp.ks.map((k,j)=>conv(k,k*sp.dNs[j]));
  /* Kramers' line at the same unabsorbed energy: I(k) = C (T0 − k), C from ∫ I = the table's radiated energy */
  const Ck=2*U.E0*T0/(T0*T0);
  const yk=sp.ks.map(k=>conv(k,Ck*(T0-k)));
  let ymax=0; for(const v of (st.tSelf?ys:y0).concat(yf)) if(isFinite(v)) ymax=Math.max(ymax,v);
  if(st.tKr) for(const v of yk) ymax=Math.max(ymax,v);
  ymax*=1.12;
  const sc=axScale(ymax); for(const arr of [yf,y0,ys,yk]) for(let j=0;j<arr.length;j++) arr[j]/=sc.f; ymax/=sc.f;
  const lamMin=HC_EVNM/T0;
  const x0=wav?lamMin*0.8:0, x1=wav?Math.min(lamMin*8,HC_EVNM/1e3):T0/1e3*1.04;
  const P=linPlot(ctx,b,x0,x1,0,ymax,{title:wav?'the spectrum against wavelength (Ulrey’s way)':'the spectrum, energy per unit photon energy, per electron',
    xlab:wav?'wavelength λ (nm)':'photon energy (keV)',ylab:(wav?'per nm':'per eV')+sc.s,nx:8,xfmt:x=>fmt(x,wav?3:0),yfmt:y=>sigf(y,2)});
  /* the lines: markers at the Deslattes energies, where the beam can make them (T0 above the edge) */
  const L=XL[st.tAnode]||[];
  const named={};
  for(const ln of L){ if(ln.edge>T0) continue; const x=wav?HC_EVNM/ln.E:ln.E/1e3; if(x<x0||x>x1) continue;
    const X=P.X(x); vMark(ctx,b,X,'#4a4f63',[2,3],1); }
  /* one name per family (Kα, Kβ, Lα, …) at its strongest line, placed only where it fits */
  let lastEnd=-Infinity;                                            /* names keep 8 px apart: "Lα" and "Lγ" touched */
  for(const ln of L){ if(ln.edge>T0) continue; const fam=ln.n.slice(0,2); if(named[fam]) continue;
    const x=wav?HC_EVNM/ln.E:ln.E/1e3; if(x<x0||x>x1) continue; named[fam]=true;
    const X=P.X(x)+3, w=fam.length*10.5*0.52; if(X<lastEnd+8&&X+w>lastEnd-8-w) continue;
    if(lab(ctx,W,H,X,b.y+26,fam,'#8b93a6',SM_FONT,'left','middle',PLATE_FIX)) lastEnd=X+w; }
  if(st.tKr) P.line(xs,yk,COL.kram,1.3,[6,4]);
  P.line(xs,y0,'#3f4a63',1.1,[2,3]);
  if(st.tSelf) P.line(xs,ys,COL.bh,1.3);
  P.line(xs,yf,COL.pos,2.1);
  if(st.tSpek&&U.spk){ const f=SPEK_TO_E, sx=[], sy=[];
    U.spk.k.forEach((k,i)=>{ const kev=k*1e3; const fl=muRho(st.tFilt==='none'?'Al':st.tFilt,kev);
      const att=st.tFilt==='none'?1:Math.exp(-fl*FILTER_RHO[st.tFilt]*st.tMM/10);
      sx.push(wav?HC_EVNM/kev:k); sy.push(conv(kev,kev*U.spk.brem[i]*f*att)/sc.f); });
    P.line(sx,sy,COL.spek,1.4,[4,3]); }
  const X=P.X(wav?lamMin:T0/1e3);
  if(vMark(ctx,b,X,COL.live,[],1.4)) lab(ctx,W,H,X+(wav?5:-5),b.y+12,wav?'λ_min = hc/eV'.replace('_min','ₘᵢₙ'):'eV',
    '#cd35c4',SM_FONT,wav?'left':'right','middle',PLATE_FIX);
  const items=[[COL.pos,'at the detector']];
  if(st.tSelf) items.push([COL.bh,'leaving the anode']);
  items.push(['#3f4a63','as made',[2,3]]);
  if(st.tKr) items.push([COL.kram,'Kramers',[6,4]]);
  if(st.tSpek&&U.spk) items.push([COL.spek,'SpekPy',[4,3]]);
  keyRow(ctx,b.x,b.y-30,items,b.w);
}
function drawTubeSchem(ctx,W,H,b,U,st){
  frame(ctx,b,'#1c2130');
  /* the envelope: a capsule across the box; the beam runs left to right along its axis, the x-rays leave downward */
  const cy=b.y+b.h*0.40, x0=b.x+b.w*0.10, x1=b.x1-b.w*0.08, R=Math.min(b.h*0.22,34);
  const env=[]; for(let i=0;i<=24;i++){ const a2=PI/2+PI*i/24; env.push([x0+R+R*Math.cos(a2),cy-R*Math.sin(a2)]); }
  for(let i=0;i<=24;i++){ const a2=-PI/2+PI*i/24; env.push([x1-R+R*Math.cos(a2),cy-R*Math.sin(a2)]); }
  env.push(env[0]); sLine(ctx,env,'#2a3550',1.2);
  /* the cathode: a cup with the filament */
  const xc=x0+R*0.9;
  sLine(ctx,[[xc-8,cy-R*0.55],[xc,cy-R*0.55],[xc,cy+R*0.55],[xc-8,cy+R*0.55]],'#8b93a6',1.4);
  sLine(ctx,[[xc+3,cy-7],[xc+8,cy-3.5],[xc+3,cy],[xc+8,cy+3.5],[xc+3,cy+7]],'#f0d264',1.5);
  /* the anode: a copper stem ending in the target face, tilted so the central ray (straight down) leaves it at θ */
  const th=st.tTh*PI/180, fx=x1-R*2.4, fy=cy, L=R*0.95, ux=Math.sin(th), uy=Math.cos(th);
  const f0=[fx-L*ux,fy-L*uy], f1=[fx+L*ux,fy+L*uy];
  ctx.beginPath(); ctx.moveTo(f0[0],f0[1]); ctx.lineTo(f1[0],f1[1]); ctx.lineTo(x1-R*0.3,f1[1]); ctx.lineTo(x1-R*0.3,f0[1]); ctx.closePath();
  ctx.fillStyle='#6b4a2e'; ctx.fill();
  sLine(ctx,[f0,f1],'#c9ced8',3);
  /* the beam: from the filament to the focal spot on the face */
  arrowPx(ctx,xc+10,cy,fx-3,cy,'#8fd8ff',1.4);
  /* the central ray: down through the window and the filter */
  const yw=cy+R, yf=b.y1-b.h*0.16;
  sLine(ctx,[[fx,fy],[fx,yf+14]],COL.pos,1.4,[3,3]);
  sLine(ctx,[[fx-9,yw],[fx+9,yw]],'#070b18',3);
  ctx.fillStyle=st.tFilt==='none'?'#1c2130':'#6a7288'; ctx.fillRect(fx-16,yf-3,32,6);
  /* the take-off angle between the face and the central ray */
  const ar=[]; for(let i=0;i<=16;i++){ const a2=PI/2-th*i/16; ar.push([fx+22*Math.cos(a2),fy+22*Math.sin(a2)]); }
  sLine(ctx,ar,'#8b93a6',1);
  lab(ctx,W,H,fx+12,fy+30,'θ','#aeb6c6',LAB_FONT,'left','middle',PLATE);
  lab(ctx,W,H,fx+22,yf,st.tFilt==='none'?'no filter':fmt(st.tMM,st.tMM<0.1?3:2)+' mm '+st.tFilt,'#8b93a6',SM_FONT,'left','middle',PLATE);
  lab(ctx,W,H,xc-4,cy-R-10,'cathode','#8b93a6',SM_FONT,'center','middle',PLATE);
  lab(ctx,W,H,fx,cy-R-10,ANODES[st.tAnode].name+' anode','#8b93a6',SM_FONT,'center','middle',PLATE);
  lab(ctx,W,H,b.x+8,b.y+12,'the tube (not to scale)','#6f7789',SM_FONT,'left','middle',PLATE);
}
function drawTubeEff(ctx,W,H,b,U,st){
  const V=U.eff.map(r=>r.V), pg=U.eff.map(r=>r.page), es=U.eff.map(r=>r.estar), kr=U.eff.map(r=>r.kr);

 *  view 5: the absorption                                             *
 * ================================================================== */
function absCaption(M){

  const mk=A.mk, km=A.km;
  const s1='Run the collision backwards and the electron takes a photon instead of giving one: inverse bremsstrahlung. Kirchhoff fixes its rate from the emission alone, κ = j/B, and with stimulated emission counted it falls as ν⁻³(1 − exp(−hν/kT)): as ν⁻² for light below kT (the lasers), as ν⁻³ for x-rays above it. Below the plasma frequency no wave propagates at all. ';
  const s2=(km?'At '+mk.name+' ('+eV(mk.hv,3)+') the absorption length here is '+metre(1/km,3)+'. ':'At '+mk.name+' the plasma is opaque (below its plasma frequency). ');

}
function drawAbs(ctx,W,H,M){

  const Q=logPlot(ctx,m,hv[0],hv[hv.length-1],ymin,ymax,{ylog:true,title:'the absorption coefficient κ, from the plasma frequency to hard x-rays',xlab:'photon energy hν (eV)',ylab:'κ (m⁻¹)'});

  const Xt=Q.X(A.T); if(vMark(ctx,m,Xt,COL.struct,[3,3],1)) lab(ctx,W,H,Xt+4,m.y1-28,'kT','#5ac8e0',SM_FONT,'left','middle',PLATE_FIX);
  /* the photon-energy marks: every one faint, the chosen one live */
  for(const mk of HV_MARKS){ const X=Q.X(mk.hv); if(X<m.x||X>m.x1) continue;
    if(mk.id===st.aMark){ vMark(ctx,m,X,COL.live,[],1.2); lab(ctx,W,H,X+4,m.y+12,mk.name,'#cd35c4',SM_FONT,'left','middle',PLATE_FIX); }
    else { ctx.beginPath(); ctx.moveTo(X,m.y1-6); ctx.lineTo(X,m.y1); ctx.strokeStyle='#5a6378'; ctx.lineWidth=1; ctx.stroke(); } }
  HIT.push({kind:'hv',b:m,Q});
  keyRow(ctx,m.x,m.y-30,[[COL.pos,'Kirchhoff, exact ḡ'],[COL.ref,'NRL formulary eq. 32',[5,4]]],m.w);
  const B=Lay.bottom;
  if(B[0]) drawIBPicture(ctx,W,H,B[0],I,st);
  if(B[1]) drawIBGain(ctx,W,H,B[1],I,st);
  drawCaption(ctx,Lay);
}
/* the mechanism, in the ion's rest frame: the drift runs left to right, the wave shakes every electron along it; the
   twelve arrive one after another, a twelfth of the wave's period apart, so each meets it at its own phase */
function drawIBPicture(ctx,W,H,b,I,st){
  frame(ctx,b,'#1c2130');
  const half=Math.max(2.5,2*st.aB), hw=half*b.w/b.h;
  const map=worldFitUp(b,{xmin:-hw,xmax:hw,ymin:-half,ymax:half},0);
  const win={x0:-hw,x1:hw,y0:-half,y1:half};
  const N=I.tr.length, per=TAU/st.aOm, tEnd=Math.max.apply(null,I.tr.map(r=>r.t));
  const loop=tEnd+per, tNow=((SIM.t/8)%1)*loop;                          /* one pass every 8 s */
  I.tr.forEach(r=>{ const col=r.dE>=0?COL.gain:COL.loss;
    worldPath(ctx,map,r.path.map(q=>[q[3],q[2]]),rgba(col,0.28),1,null,win); });
  dot(ctx,map.X(0),map.Y(0),5,COL.nuc,null);
  I.tr.forEach((r,i)=>{ const col=r.dE>=0?COL.gain:COL.loss, ti=tNow-per*i/N;   /* electron i starts i/N of a period later */
    if(ti<0||ti>r.t) return;
    let q=null; for(const s2 of r.path){ if(s2[0]>=ti){ q=s2; break; } }
    if(q&&q[3]>=win.x0&&q[3]<=win.x1&&q[2]>=win.y0&&q[2]<=win.y1) dot(ctx,map.X(q[3]),map.Y(q[2]),3.2,col,null); });
  lab(ctx,W,H,b.x+8,b.y+12,'v₀ = '+fmt(st.aVo,3)+' u, Ω = '+fmt(st.aOm,3)+' u/a','#6f7789',SM_FONT,'left','middle',PLATE);
  lab(ctx,W,H,b.x+8,b.y+28,'green gained, red lost','#6f7789',SM_FONT,'left','middle',PLATE);
}
/* the phase-averaged energy change against the impact parameter: the slow, weak-wave limit as a curve, the twelve
   electrons' exact average for this wave as a dot */
function drawIBGain(ctx,W,H,b,I,st){
  const mean=I.mean/(st.aVo*st.aVo);
  const lo=Math.min(-1.2,mean*1.2), hi=Math.max(2.2,mean*1.2);
  const P=logPlot(ctx,b,LIM.aB[0],LIM.aB[1],lo,hi,{title:titleFor(b,'the energy kept, averaged over the phase','⟨ΔE⟩ by impact parameter'),xlab:'impact parameter b/a',ylab:'⟨ΔE⟩ / m v₀²',ny:4,yfmt:y=>tickFmt(y,1)});
  ctx.beginPath(); ctx.moveTo(b.x,P.Y(0)); ctx.lineTo(b.x1,P.Y(0)); ctx.strokeStyle='#2a3044'; ctx.lineWidth=1; ctx.stroke();
  P.line(I.bs,I.fs,COL.ref,1.6,[5,4]);
  dot(ctx,P.X(st.aB),P.Y(clamp(mean,lo,hi)),4.2,mean>=0?COL.gain:COL.loss,'#fff');
  const Xc=P.X(1); if(vMark(ctx,b,Xc,COL.struct,[2,3],1)) lab(ctx,W,H,Xc+4,b.y1-12,'χ = 90°','#5ac8e0',SM_FONT,'left','middle',PLATE_FIX);
  keyRow(ctx,b.x,b.y-30,[[COL.ref,'slow, weak-wave limit',[5,4]],[COL.text,'this wave, exactly']],b.w);
}

/* ================================================================== *
 *  view 6: the balance                                                *
 * ================================================================== */
function balCaption(M){
  const B=M.B;
  return {full:'Emission and absorption are one process, so a thick enough plasma must glow as a blackbody. A slab of thickness L emits I = B(1 − exp(−τ)), τ = κL: bremsstrahlung, thin and flat, wherever τ < 1, and Planck’s curve wherever τ > 1, the change at '+(B.turn?eV(B.turn,3):'no energy here')+'.'+(B.planckOff?' Here the slab is thin at every energy and Planck’s curve runs far above the plot.':'')+' Right: a box of this plasma starting with no light fills with photons by free–free emission until absorption balances it; the low energies fill first (κ is largest there), and the end is Planck’s spectrum whatever the Gaunt factor: g sets only the time. The electrons pay for the light, and cool to '+eV(B.box.Tf,3)+'.'+(B.recomb?' That end lies far below the ions’ binding energy, where the plasma would recombine: the box, which keeps it ionized, is only a thought experiment there.':''),
    short:'I = B(1 − exp(−τ)): thin bremsstrahlung above the turnover, a blackbody below; a box fills up to Planck.'};
}
function drawBal(ctx,W,H,M){
  const B=M.B, st=ST, cap=balCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.42,nbNarrow(H));
  const m=Lay.main;
  const fin=B.I.filter(v=>v>0&&isFinite(v)), ymax=Math.max.apply(null,fin)*3, ymin=ymax*1e-12;
  const Q=logPlot(ctx,m,B.hv[0],B.hv[B.hv.length-1],ymin,ymax,{ylog:true,title:'a slab of '+metre(st.bL,3)+': its radiance, per unit photon energy',xlab:'photon energy hν (eV)',ylab:'W m⁻² sr⁻¹ eV⁻¹'});
  Q.line(B.hv,B.thin,COL.thin,1.2,[5,4]);
  Q.line(B.hv,B.B,COL.planck,1.3,[2,3]);
  Q.line(B.hv,B.I,COL.pos,2);
  if(B.turn){ const X=Q.X(B.turn); if(vMark(ctx,m,X,COL.live,[],1)) lab(ctx,W,H,X+4,m.y+12,'τ = 1','#cd35c4',SM_FONT,'left','middle',PLATE_FIX); }
  keyRow(ctx,m.x,m.y-30,[[COL.pos,'the slab'],[COL.planck,'Planck',[2,3]],[COL.thin,'thin: j L',[5,4]]],m.w);
  const Bt=Lay.bottom;
  if(Bt[0]) drawBoxOcc(ctx,W,H,Bt[0],B,st);
  if(Bt[1]) drawBoxT(ctx,W,H,Bt[1],B,st);
  drawCaption(ctx,Lay);
}
function drawBoxOcc(ctx,W,H,b,B,st){
  const bx=B.box, u=bx.u, nP0=u.map(x=>1/Math.expm1(x)), nPf=bx.hv.map(e=>1/Math.expm1(e/bx.Tf));
  const P=logPlot(ctx,b,u[0],u[u.length-1],1e-12,3e3,{ylog:true,title:titleFor(b,'the box: photons per mode as time passes','photons per mode'),
    xlab:'hν / kT₀',ylab:'n',yticksV:[1e-12,1e-9,1e-6,1e-3,1,1e3]});
  P.line(u,nP0,COL.dim,1.1,[2,3]);
  bx.snaps.forEach((s2,i)=>P.line(u,s2.n.map(x=>x>0?x:NaN),mix('#39506e',COL.pos,i/(bx.snaps.length-1)),1.4));
  P.line(u,nPf,COL.planck,1.5,[5,4]);
  keyRow(ctx,b.x,b.y-30,[[COL.pos,'n(t), dark to light'],[COL.planck,'Planck at the end',[5,4]],[COL.dim,'at T₀',[2,3]]],b.w);
}
function drawBoxT(ctx,W,H,b,B,st){
  const bx=B.box, tr=bx.trace.filter(p=>p[0]>=bx.snaps[0].t*(1-1e-9)), ts=tr.map(p=>p[0]), Ts=tr.map(p=>p[1]/bx.T0);
  const lo=Math.min(0.9,Math.min.apply(null,Ts)*0.9);
  const P=logPlot(ctx,b,ts[0],ts[ts.length-1],lo,1.05,{ylog:lo<0.2,title:titleFor(b,'the electrons’ temperature as the light fills in','T(t)'),
    xlab:'time (s)',ylab:'T / T₀',ny:4,yfmt:lo<0.2?undefined:(y=>fmt(y,2))});
  P.line([ts[0],ts[ts.length-1]],[bx.Tf/bx.T0,bx.Tf/bx.T0],COL.ref,1.2,[5,4]);
  P.line(ts,Ts,COL.pos,1.9);
  keyRow(ctx,b.x,b.y-30,[[COL.pos,'T(t)'],[COL.ref,'the end: energy conserved',[5,4]]],b.w);
}

/* ================================================================== *
 *  dispatch and the pointer                                           *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; MARKS=[]; KEY_DROPS=0; W_STAGE=W; H_STAGE=H; DRAW_SEQ=0;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='enc') drawEnc(ctx,W,H,M);
  else if(M.view==='sec') drawSec(ctx,W,H,M);
  else if(M.view==='tube') drawTube(ctx,W,H,M);
  else if(M.view==='plasma') drawPlasma(ctx,W,H,M);
  else if(M.view==='abs') drawAbs(ctx,W,H,M);
  else drawBal(ctx,W,H,M);
}
function hitAt(x,y){ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.b.x&&x<=h.b.x+h.b.w&&y>=h.b.y&&y<=h.b.y+h.b.h) return h; } return null; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  S.pointer=function(type,x,y){
    if(type!=='down') return false;
    const h=hitAt(x,y); if(!h) return false;
    if(h.kind==='hv'){ /* the nearest marked photon energy to the press */
      let best=null, bd=Infinity; for(const mk of HV_MARKS){ const d=Math.abs(h.Q.X(mk.hv)-x); if(d<bd){ bd=d; best=mk; } }
      if(best&&bd<24){ ST.aMark=best.id; return true; } }
    return false;
  };
  return S;
}

    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); refresh(); });

  /* every change repaints at once (refresh); the frame loop repaints only a view that moves */
  function frameLoop(){
    if(S.step()){ try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  enc:'<b>Bremsstrahlung</b>, “braking radiation”: an electron passing a nucleus is pulled round it, and a charge that changes velocity radiates (Larmor). Classically the electron follows a hyperbola with the nucleus at its focus, and the radiation comes out in one short flash as it swings round. The flash lasts about the time the electron spends near closest approach, so the spectrum of one pass is flat up to photons of about ħ v<sub>max</sub>/r<sub>min</sub> and falls exponentially beyond: a harder, closer collision makes harder x-rays. Quantum mechanics adds one sharp rule: a photon cannot carry more than the electron’s kinetic energy T, so the spectrum stops at ħω = T. How far the classical picture can be trusted is measured by <b>η = Zα/β</b>: when η ≫ 1 the classical spectrum below the wall is right; when η ≪ 1 the wall falls in its flat part and only the quantum theory (next view) describes it. One pass gives up very little energy: a 10 keV electron swinging past tungsten at b = 2a radiates about '+sigf(PX.exDE,2)+' eV.',
  sec:'The photon spectrum of electrons of one energy on one kind of atom, as Seltzer and Berger tabulate it: χ = (β²/Z²) k dσ/dk, the photons per unit logarithmic interval of photon energy, with the charge and the speed divided out. In these units <b>Kramers’</b> semi-classical estimate (1923) is a constant, '+fmt(CHI_K,3)+' mb, and every exact theory is Kramers times a <b>Gaunt factor</b> g. <b>Born’s</b> approximation (fast electrons) gives a logarithm that vanishes at the tip, where the electron leaves with nothing; <b>Elwert’s</b> factor, the ratio of the Coulomb-distorted electron waves at the nucleus before and after, repairs the tip; <b>Sommerfeld’s</b> exact non-relativistic solution (1931) holds for every η and turns into the classical Gaunt factor of the previous view as η grows; <b>Bethe and Heitler’s 3BN</b> is Born’s approximation made relativistic. The <b>table</b> adds the atom’s electrons: they screen the nucleus (which cuts the soft-photon end) and radiate themselves. Integrated over κ it gives NIST’s radiative stopping power (lower right) to within about 1 %.',
  tube:'An x-ray tube is a thick target: electrons accelerated through a voltage V stop in a metal anode, and every one of them emits the thin-target spectrum of the previous view at each energy it passes on the way down. <b>Kramers</b> (1923) added this up with his flat cross-section and a stopping power falling as 1/E, and got a straight line, intensity ∝ Z(E₀ − E) per unit photon energy, ending at the electron’s full energy. That end is the <b>Duane–Hunt law</b> (1915), λ<sub>min</sub> = hc/eV: Duane and Hunt used it to measure Planck’s constant. The real spectrum bends away from the line at low energies because the anode absorbs its own soft photons on the way out (with jumps at its absorption edges) and the window and filter absorb more. The <b>efficiency</b> is small and grows with Z and V: '+pct(PX.w100.page,2)+' for tungsten at 100 kV (ESTAR’s radiation yield '+pct(PX.w100.estar,2)+'), the rest of the beam power heating the anode. The sharp <b>characteristic lines</b> of a real tube come from the anode’s inner shells emptied by the beam, a different process: they are marked where they sit, not modelled.',
  plasma:'In a hot plasma every electron passes ions all the time, so the whole plasma glows with bremsstrahlung. Averaging Kramers’ cross-section over the Maxwellian gives an emissivity flat in photon energy up to about kT and falling as e<sup>−hν/kT</sup> beyond; the exact result multiplies it by the thermally averaged Gaunt factor ḡ(γ², u), computed here from Sommerfeld’s exact g and checked against van Hoof et al.’s tables. The exponential fall is a thermometer: x-ray astronomers and fusion diagnosticians read the temperature from its slope. The total power grows only as √T, the fusion power much faster, which is why a D–T plasma must be hotter than the <b>ideal ignition temperature</b>, where α heating equals the bremsstrahlung loss ('+fmt(PX.ign,3)+' keV here; the literature’s 4.3 keV), and why impurities that raise Z<sub>eff</sub> push it up. For ITER’s core, its volume-averaged density and temperature give '+watt(PX.iterP,3)+' over the plasma volume, against the 21 MW its design basis lists from the real, peaked profiles.',
  abs:'<b>Inverse bremsstrahlung</b> is the same collision run the other way: an electron passing an ion absorbs a photon and leaves faster. It is how laser light heats the corona of an inertial-fusion capsule, and how x-rays are absorbed in a fully ionized plasma. Kirchhoff’s law gives its rate from the emission alone, κ = j/B, whatever the details of the collision: with stimulated emission counted, κ falls as ν⁻² for photons below kT (the lasers) and as ν⁻³ above it (the x-rays), and nothing propagates below the plasma frequency. Classically (left) an electron shaken by a slow wave along its path is knocked out of step by the ion: averaged over the wave’s phase, a close pass that turns the electron back takes energy from the wave and a grazing one gives it back. Which wins depends on how the electrons’ speeds are spread; for a thermal plasma absorption always wins, which is what κ describes.',
  bal:'Because emission and absorption are one process run both ways, a plasma thick enough to absorb its own light must glow as a <b>blackbody</b>. A slab emits I = B(1 − e<sup>−τ</sup>): where it is thin (τ ≪ 1, high photon energies) its spectrum is the flat bremsstrahlung of the plasma view; where it is thick (τ ≫ 1, low photon energies, where κ is largest) it is Planck’s curve, and the change comes where τ = 1. The right-hand plots put the plasma in a closed box that starts with no light: free–free emission fills the photon modes and absorption empties them until each reaches Planck’s occupation, the low energies first. The end point does not depend on the Gaunt factor at all, only the time it takes; the electrons pay for the light: a dark box of NIF’s hot-spot plasma at '+eV(PX.nifT0,3)+' ends at '+eV(PX.nifTf,3)+', because at that temperature a blackbody holds more energy per volume than the plasma itself.'
};

 *  selfTest — headless verification.  REF is build_cg/refvals.json,   *
 *  the printed output of derive.py (sympy, numpy, mpmath), read in    *

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nf=0, nfEx=null, path=[], cur=null;       /* a stroke keeps its path, in canvas pixels */
  /* a canvas ignores a non-finite coordinate without a word, so the recorder counts them */
  const chk=(nm,a)=>{ for(const v of a) if(typeof v==='number'&&!isFinite(v)){ nf++; if(!nfEx) nfEx=nm+'('+Array.prototype.join.call(a,', ')+')'; return; } };
  const ctx={ops, nonFinite:()=>({n:nf,ex:nfEx}),
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; path=[]; cur=null; }, moveTo(...a){ chk('moveTo',a); cur=[app(a[0],a[1])]; path.push(cur); },
    lineTo(...a){ chk('lineTo',a); if(!pend) pend={n:0}; if(!cur){ cur=[]; path.push(cur); } cur.push(app(a[0],a[1])); }, closePath(){},
    rect(...a){ chk('rect',a); if(!pend) pend={n:0}; pend.n++; }, arc(...a){ chk('arc',a); if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:''+ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke',style:''+ctx.strokeStyle,paths:path.map(p=>p.slice())}); }, clip(){},
    fillRect(x,y,w,hh){ chk('fillRect',[x,y,w,hh]); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      chk('fillText',[x,y]);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest — headless verification.  REF is build_brems/refvals.json,*
 *  the printed output of derive.py (mpmath, numpy, scipy; every value *
 *  checked there by a second route), read in full.                    *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol*Math.max(Math.abs(b),1e-300),name+' ['+a+' vs '+b+', rel '+(Math.abs(a/b-1)).toExponential(2)+']');
  const has=(s,sub2,name)=>ok(String(s).indexOf(sub2)>=0,name+' [missing "'+sub2+'"]');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){ Object.assign(ST,DEFAULTS,over); simReset(); if(over.t!==undefined) SIM.t=over.t;
    for(const k in MEMO) delete MEMO[k];
    try{ return fn(); } finally{ Object.assign(ST,stSave); simReset(); for(const k in MEMO) delete MEMO[k]; } }

  /* ---------- 0. the shared helpers ---------- */
  ok(plain('&Delta;V &omega; &#955; R&#8321; &frac58;')==='ΔV ω λ R₁ &frac58;','plain() decodes named and numeric entities and passes unknown ones through for the audit');
  ok(ticksFor(0.8,0.2,5).length===1&&ticksFor(0.2,0.8,5).length>=3,'axes() range-sort is what rescues an inverted axis');
  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }
  eq(sigf(1.768e8,4),'1.768 × 10⁸','sigf writes a power of ten in superscripts'); eq(pow10(-3),'10⁻³','pow10'); eq(tickFmt(-2),'−2','a tick label: a true minus, no trailing zeros'); eq(tickFmt(0.30000000000000004),'0.3','and no float noise');
  eq(logLab(1e-4),'10⁻⁴','a far decade is labelled 10ⁿ'); eq(logLab(100),'100','a near one plainly');
  eq(logTicks125(0,10).length,0,'a non-positive bound gives no ticks'); eq(logTicks125(1,100).join(),'1,2,5,10,20,50,100','1-2-5 ticks over two decades');
  eq(eng(28774,'W/m³',3),'28.8 kW/m³','eng: 28.8 kW/m³'); eq(eng(5.33e-12,'m',3),'5.33 pm','eng: 5.33 pm'); eq(eng(0,'eV'),'0 eV','eng: zero');

  for(const [T,ne,Z,hv,k] of RA.nrlK) rel(nrlKappa(T,ne,Z,hv),k,1e-12,'NRL eq. 32 at T = '+T+' eV, hν = '+sigf(hv,3)+' eV (the twin)');

  for(const [T,ne,Z,R,P] of REF.therm.means){ const m=ffMeans(T,ne,ne/Z,Z); rel(m.R,R,3e-4,'the Rosseland mean at T = '+T+' eV (scipy over the table)'); rel(m.P,P,3e-4,'and the Planck mean'); }
  withState({view:'abs'},()=>{ const M=buildModel(); close(M.I.mean,RA.ibDisp[0][3],3e-7,'the page’s twelve electrons at its defaults: their mean against DOP853 (absolute, as above)');
    eq(M.I.tr.length,12,'twelve electrons, one per twelfth of the wave’s period'); { let w=0; M.I.tr.forEach((r,i)=>{ w=Math.max(w,Math.abs(r.dE-RA.ibDisp[0][4][i])); }); ok(w<3e-7,'each at its own phase, against DOP853 [worst '+w.toExponential(2)+']'); }
    ok(M.A.lang&&M.A.lang.f>0.5&&M.A.lang.f<1,'Langdon’s factor is shown for a laser'); rel(M.A.lang.a,RA.langA[0][4],1e-12,'the view’s α is the one at 10¹⁵ W/cm² for the corona at 3ω (the twin)'); rel(M.A.lang.A,-Math.expm1(-M.A.lang.f*M.A.ramp.tau),1e-15,'and the ramp absorbs 1 − exp(−fτ) with it'); });
  withState({view:'abs',aMark:'mok'},()=>{ ok(buildModel().A.lang===null,'no ramp and no Langdon factor for an x-ray line'); });
  ok(ffKappa(1000,1e27,1e27,1,HBAR*omegaP(1e27)/E_CH*1.01)>ffKappaK(1000,1e27,1e27,1,HBAR*omegaP(1e27)/E_CH*1.01)*5,'just above it the slow group velocity multiplies κ');
  eq(nrlKappa(1000,1e26,1,900),null,'NRL’s form stops where ln Λ < 1');
  for(const [b,m,pred] of RA.ibLimit) rel(ibFormula(2*Math.atan(1/b)),pred,1e-14,'the slow-wave limit −cos χ(1 − cos χ) at b = '+b+' (DOP853 gave '+fmt(m,4)+')');
  for(const [b,vo,Om,mean,gs] of RA.ibDisp){ const r=[]; for(let i=0;i<12;i++) r.push(ibTrajectory(b,vo,Om,TAU*i/12,{X0:40,tol:1e-8}).dE);
    let w=0; r.forEach((x,i)=>{ w=Math.max(w,Math.abs(x-gs[i])); }); ok(w<3e-7,'the page’s Dormand-Prince against DOP853: b = '+b+', v₀ = '+vo+', Ω = '+Om+' [worst '+w.toExponential(2)+']');
    close(r.reduce((s,x)=>s+x,0)/12,mean,3e-7,'and their phase average'); }

  /* ---------- 7. the balance ---------- */
  const RB=REF.bal;
  for(const [hv,T,B] of RB.planck) rel(planckE(hv,T),B,1e-13,'Planck at hν = '+hv+' eV, T = '+T+' eV');
  rel(A_RAD,RB.aRad,1e-13,'the radiation constant a = 4σ/c');
  for(const [T,ne,Z,Tf] of RB.boxEnd){ const bx=photonBox(T,ne,Z); rel(bx.Tf,Tf,1e-10,'the box’s end point at T₀ = '+T+' eV (brentq)');
    const last=bx.snaps[bx.snaps.length-1]; rel(last.T,Tf,2e-4,'and the bins arrive there (T₀ = '+T+' eV)'); }
  { const p=PLASMAS[0], bx=photonBox(p.T,p.ne,p.Z), P=ffPower(p.T,p.ne,p.ne/p.Z,p.Z), t1=bx.trace[0][0], T1=bx.trace[0][1];
    rel(bx.heat*(p.T-T1)*E_CH/K_B,P*t1,1e-2,'a dark box first fills at the plasma’s bremsstrahlung power (ITER: emission alone; the bins’ quadrature)'); }
  withState({view:'bal'},()=>{ const B=buildModel().B; rel(slabI(B.T,B.ne,B.ni,B.Z,B.turn,B.L).tau,1,1e-9,'the turnover is where τ = 1'); });
  { const T=1000, ne=1e27; const thin=slabI(T,ne,ne,1,5e4,1e-9), thick=slabI(T,ne,ne,1,10,1e3);
    rel(thin.I,thin.thin,1e-6,'a thin slab: I = j L'); rel(thick.I,thick.B,1e-12,'a thick one: I = B'); }

  /* ---------- 8. the prose's numbers ---------- */
  rel(PX.exDE,encScales(1e4,74,2).dEoverT*1e4,1e-15,'the prose’s 10 keV electron radiates '+sigf(PX.exDE,2)+' eV');
  rel(PX.w100.page,tubeYield('W',1e5),1e-15,'the prose’s tungsten efficiency'); rel(PX.w100.estar,0.01032,1e-12,'ESTAR’s 1.032 % as printed');
  rel(PX.nifTf,photonBox(13100,1.45e31,1).Tf,1e-12,'the prose’s NIF box end point'); rel(PX.nifTf,RB.boxEnd[0][3],1e-10,'= the twin’s');

  /* ---------- 9. the pictures: every view, its presets and corners, at four sizes ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const pre=(id,pfx)=>{ const p=PLASMAS.find(q=>q.id===id), o={}; o[pfx+'Pre']=id; o[pfx+'Ne']=p.ne; o[pfx+'T']=p.T; o[pfx+'Z']=p.Z; if(pfx!=='p') o[pfx+'L']=p.L; return o; };
  const CONFIGS=[['enc',{view:'enc',t:3}],['enc early',{view:'enc',t:0.4}],['enc close',{view:'enc',eB:0.05,t:3}],['enc far',{view:'enc',eB:50,t:3}],
    ['enc rel',{view:'enc',eRel:true,eT:5e4,t:3}],['enc H 10 eV',{view:'enc',eZ:1,eT:10,eB:1,t:3}],['enc U',{view:'enc',eZ:92,eT:5e4,eB:0.3,t:2.9}],
    ['sec',{view:'sec'}],['sec 1 keV H',{view:'sec',sZ:1,sT:1e3}],['sec 10 MeV U',{view:'sec',sZ:92,sT:1e7}],['sec only SB',{view:'sec',sK:false,sB:false,sBE:false,sS:false,s3:false}],
    ['sec none',{view:'sec',sK:false,sB:false,sBE:false,sS:false,s3:false,sSB:false}],['sec C 3 keV',{view:'sec',sZ:6,sT:3e3}],
    ['tube',{view:'tube'}],['tube wav',{view:'tube',tAxis:'L'}],['tube Mo',{view:'tube',tAnode:'Mo',tV:30,tFilt:'Mo',tMM:0.03}],['tube Rh',{view:'tube',tAnode:'Rh',tV:45,tFilt:'Rh',tMM:0.025}],
    ['tube Cu 10',{view:'tube',tAnode:'Cu',tV:10,tFilt:'none'}],['tube 150 Cu',{view:'tube',tV:150,tFilt:'Cu',tMM:10,tTh:45}],['tube wav Mo',{view:'tube',tAxis:'L',tAnode:'Mo',tV:25}],
    ['plasma',{view:'plasma'}],...PLASMAS.map(p=>['plasma '+p.id,Object.assign({view:'plasma'},pre(p.id,'p'))]),['plasma cold',{view:'plasma',pT:1,pNe:1e20,pZ:1}],
    ['plasma zeff 4',{view:'plasma',pZeff:4}],['plasma Z 8 hot',{view:'plasma',pZ:8,pT:1e5,pNe:1e32}],
    ['abs',{view:'abs',t:3}],...PLASMAS.map(p=>['abs '+p.id,Object.assign({view:'abs',t:2},pre(p.id,'a'))]),['abs co2',{view:'abs',aMark:'co2'}],['abs mo',{view:'abs',aMark:'mok',aB:5,aVo:0.3,aOm:1}],
    ['abs slow',{view:'abs',aB:0.1,aVo:0.005,aOm:0.01,t:6}],
    ['bal',{view:'bal'}],...PLASMAS.map(p=>['bal '+p.id,Object.assign({view:'bal'},pre(p.id,'b'))]),['bal thin',{view:'bal',bL:1e-7}],['bal thick',{view:'bal',bL:1e8}]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  /* the panels (readout, equation bar, tag, prose): no raw subscript, caret or brace once the markup is stripped */
  for(const [nm,over] of CONFIGS) withState(over,()=>{ const M=buildModel(), v=M.view;
    const txt=[readoutHTML(M),eqbarHTML(M),tagHTML(M),INFO[v],DERIV[v]].join(' ').replace(/<[^>]*>/g,' ').replace(/&[a-zA-Z]+;|&#[0-9]+;/g,' ');
    const bad=(txt.match(/[A-Za-zα-ωμ]_[A-Za-z0-9{(]|[\^{}]|NaN|undefined/)||[])[0];
    ok(!bad,nm+': the panels’ text is clean'+(bad?' ("'+bad+'")':'')); });
  const tDraw={};
  for(const [nm,over] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null; const t1=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t1);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), strokes=c.ops.filter(o=>o.op==='stroke');
      ok(strokes.length>=(H<520?4:12)&&texts.length>=(H<520?4:10),nm+' '+W+'x'+H+' draws substance ('+strokes.length+' strokes, '+texts.length+' texts)');
      { const nf=c.nonFinite(); ok(nf.n===0,nm+' '+W+'x'+H+' every coordinate is finite ('+(nf.ex||'ok')+')'); }
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/[\^{}]/.test(t.t)){ bad='a caret or brace: "'+t.t.slice(0,40)+'"'; break; }
        if(/\d[eE][-+]?\d/.test(t.t)){ bad='a raw exponent: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let across=null;
      for(const L of LABELS){ if(L.seq===undefined) continue;
        for(const mk of MARKS) if(mk.X>L[0]+1&&mk.X<L[2]-1&&Math.min(L[3],mk.y1)-Math.max(L[1],mk.y0)>1&&(mk.seq>L.seq||!L.plate)){ across='a marker line '+(mk.seq>L.seq?'drawn over':'under the unplated')+' "'+String(L.t).slice(0,22)+'"'; break; }
        if(across) break; }
      ok(!across,nm+' '+W+'x'+H+' no marker line across a label ('+(across||'ok')+')');
      if(W>=1100) ok(KEY_DROPS===0,nm+' '+W+'x'+H+' every key fits ('+KEY_DROPS+' dropped)');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  /* the mutation runner's UI suite sets SKIP_SELFTEST: it has already run this selfTest under jsc, the same engine */
  if(typeof SKIP_SELFTEST==='undefined') selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
