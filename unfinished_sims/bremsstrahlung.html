<title>Bremsstrahlung &amp; inverse bremsstrahlung &mdash; x-rays from braking electrons, and the same collision run backwards</title>
<!--
  ===================================================================
  bremsstrahlung.html — bremsstrahlung and inverse bremsstrahlung of
  x-rays: an electron braked by a nucleus radiates, and the same
  collision run backwards absorbs; one encounter, its cross-section,
  an x-ray tube, a hot plasma, the absorption, and the two in balance
  ===================================================================

  Six views.  THE ENCOUNTER: one electron past one nucleus, classically:
  the attractive Coulomb hyperbola drawn to scale and animated, the
  acceleration, the Larmor lobe (dipole, or Lienard's at the electron's
  speed), wavefront rings leaving at c; the pulse; and the spectrum of
  the pass, exact in modified Bessel functions of imaginary order, its
  |dv|^2 plateau, and the quantum wall at hbar omega = T.  THE CROSS
  SECTION: Seltzer and Berger's chi(kappa) = (beta^2/Z^2) k dsigma/dk
  for one element and electron energy: Kramers, Born, Born x Elwert,
  Sommerfeld's exact non-relativistic result, Bethe-Heitler 3BN, and the
  Seltzer-Berger table; the Gaunt factor across the regimes; the
  radiative stopping power against NIST ESTAR.  THE X-RAY TUBE: the
  thick target by CSDA with the table and ESTAR, self-absorption along
  the take-off angle and a filter (NIST attenuation), Kramers' line, the
  Duane-Hunt wall (energy or wavelength), the characteristic lines
  marked, the efficiency against ESTAR's radiation yield and Kramers'
  1923 estimate, the half-value layer, SpekPy's spectra for comparison.
  THE HOT PLASMA: thermal bremsstrahlung with the exact thermally
  averaged Gaunt factor, the temperature read from the slope, the total
  power, and the D-T ignition balance with Bosch-Hale reactivities.  THE
  ABSORPTION: Kirchhoff's free-free absorption coefficient from below the
  plasma frequency to hard x-rays with the laser lines and x-ray lines
  marked, the NRL formulary's form, the laser ramp's 32/15 absorption,
  Langdon's factor, the Rosseland and Planck means; and electrons
  crossing an ion in a slow wave along their drift, integrated exactly,
  their phase-resolved energy change and its slow-wave limit
  -m v0^2 cos chi (1 - cos chi).  THE BALANCE: a slab's emergent
  spectrum I = B(1 - e^-tau), the tau = 1 turnover, and a closed box
  of plasma filling with light up to Planck, the electrons cooling.

  WHAT IS EXACT (computed from the equations; build_brems/derive.py
  recomputes each with mpmath/numpy/scipy and selfTest pins the page to
  it): the Coulomb orbit and Kepler's hyperbolic equation; the Larmor
  energy J3(eps) in closed form; the classical spectrum (K_{i nu} on a
  saddle-point contour, to 6e-14) and its impact-parameter integral, the
  classical Gaunt factor; Sommerfeld's exact Gaunt factor (tabulated by
  mpmath at 20 digits, the page interpolating within 2.2e-4; it
  reproduces van Hoof et al. 2014's non-averaged table to 1e-10) and its
  thermal average (it reproduces their averaged table to 2.0e-5 and
  their frequency-integrated one to 2.2e-5); Born, Elwert and 3BN;
  Kirchhoff, Planck, the slab, the photon box's ODE and end point; the
  electrons in the wave (Dormand-Prince against SciPy's DOP853).

  WHAT IS MEASURED OR EVALUATED (as printed, retrieved 2026-09-27):
  CODATA 2022; Seltzer & Berger's BREME.DAT (NBS 1984, as EGSnrc ships
  it); NIST ESTAR; NIST x-ray mass attenuation (Hubbell & Seltzer); NIST
  x-ray transition energies (Deslattes et al. 2003); Bosch & Hale 1992,
  Table VII; the NRL Plasma Formulary 2023; the presets' papers (ITER
  Technical Basis 2002, Abu-Shawareb et al. 2024, Bahcall-Serenelli-
  Basu 2005, Bonafede et al. 2010, Sato et al. 2011, Fletcher et al.
  2011, Craxton et al. 2015); SpekPy 2.5.4's spectra (a validated
  model, drawn for comparison only).

  WHAT IS MODELLED (and said so on the canvas or in the readout): the
  encounter is classical and non-relativistic; the tube follows the
  electron straight in (CSDA: no backscatter, no diffusion, isotropic
  emission), so its anode over-filters and its half-value layer runs
  high against SpekPy; the characteristic lines are marked, not modelled;
  a plasma mixture is one ion of charge Z_eff; the thermal Gaunt factor
  is non-relativistic and electron-electron bremsstrahlung is left out;
  the photon box has no lines, recombination or Compton scattering; the
  electrons in the wave are classical, in one polarization (along the
  drift).

  Built in Agent projects/simulations/build_brems (part files p0-p7,
  assemble.py); see its DESIGN.md.
-->

/* ================================================================== *
 *  1. the encounter — one electron past one nucleus, classically      *
 *  Lengths in a = Ze²/(4πε₀ m v²), times in a/v.  The attractive      *
 *  Coulomb hyperbola (Landau & Lifshitz, Mechanics, §15):             *
 *    r = a(ε cosh ξ − 1),  t = (a/v)(ε sinh ξ − ξ),                   *
 *    x = a(ε − cosh ξ),  y = a √(ε² − 1) sinh ξ,  ε = √(1 + b²/a²)    *
 * ================================================================== */
function encOrbit(eps,xi){
  const ch=Math.cosh(xi), sh=Math.sinh(xi);
  return {x:eps-ch, y:Math.sqrt(eps*eps-1)*sh, r:eps*ch-1, t:eps*sh-xi};
}
/* Kepler's hyperbolic equation ε sinh ξ − ξ = t, inverted by Newton from a start that is right at both ends */
function encXiOfT(eps,t){
  let xi=Math.abs(t)<1?Math.asinh(t/eps):Math.sign(t)*Math.log(2*Math.abs(t)/eps+1);
  for(let k=0;k<80;k++){ const f=eps*Math.sinh(xi)-xi-t, d=eps*Math.cosh(xi)-1, st=f/d; xi-=st; if(Math.abs(st)<1e-15*(1+Math.abs(xi))) break; }
  return xi;
}
/* the velocity (in units of v) and the acceleration (in units of v²/a, pointing at the nucleus) at ξ */
function encKin(eps,xi){
  const o=encOrbit(eps,xi), s=Math.sqrt(eps*eps-1);
  const vx=-Math.sinh(xi)/o.r, vy=s*Math.cosh(xi)/o.r;
  const ax=-o.x/(o.r*o.r*o.r), ay=-o.y/(o.r*o.r*o.r);
  return {x:o.x,y:o.y,r:o.r,t:o.t,vx,vy,ax,ay,a:1/(o.r*o.r)};
}
/* J₃(ε) = ∫ dξ/(ε cosh ξ − 1)³ = [ψ(ε² + 2) + 3s]/s⁵, s = √(ε² − 1), ψ = π − arccos(1/ε)
   (J₁ = 2(π − arccos(c/ε))/√(ε² − c²) differentiated twice in c at c = 1; derive.py checks it by quadrature).
   The Larmor energy of one pass is (e²/(6πε₀c³))(v³/a) J₃, so ΔE/T = (4β³/3Z) J₃. */
function encJ3(eps){ const s=Math.sqrt(eps*eps-1), psi=PI-Math.acos(1/eps); return (psi*(eps*eps+2)+3*s)/Math.pow(s,5); }

   on the contour Im t = θ, θ = min(arcsin(ν/x), π/2 − δ), δ = min(π/2, (2/ν)^⅓): the saddle of the integrand
   where it has one, backed off near the turning point x = ν where the saddle is a monkey saddle.  The trapezoid
   rule on an even analytic integrand converges geometrically; the node count follows the phase excursion.
   Agrees with mpmath's besselk of imaginary order to 6e-14 over ν = 1e-4..300, ε = x/ν = 1..100 (derive.py). */
function kinu(nu,x){
  const th0=Math.asin(Math.min(1,nu/x)), delta=Math.min(PI/2,Math.pow(2/nu,1/3)), th=Math.min(th0,PI/2-delta);
  const ct=Math.cos(th), st=Math.sin(th), A=x*ct, pre=nu*(PI/2-th);
  const U=A>0?Math.min(60,Math.acosh(1+46/A)):60;
  const exc=Math.abs(nu*U-x*st*Math.sinh(U));
  const n=Math.min(200000,Math.floor(Math.max(64,12*exc+8*U*Math.sqrt(1+A))));
  const hs=U/n; let sK=0, sKp=0;
  for(let i=0;i<=n;i++){
    const u=i*hs, w=(i===0||i===n)?0.5:1, ch=Math.cosh(u), sh=Math.sinh(u), ex=pre-A*ch;
    if(ex<-745) continue;
    const mag=Math.exp(ex), ph=nu*u-x*st*sh, cp=Math.cos(ph), sp=Math.sin(ph);
    sK+=w*mag*cp; sKp+=w*mag*(ct*ch*cp-st*sh*sp);
  }
  return {K:sK*hs, Kp:-sKp*hs};
}
/* the spectrum of one pass: dW/dω = (2e²v²/(3π²ε₀c³)) F(ν, ε), ν = ωa/v,
   F = ν² e^{πν}[K′_{iν}(νε)² + (1 − 1/ε²)K_{iν}(νε)²]  →  1/ε² as ν → 0 (the |Δv|² plateau, Δv = 2v/ε) */
function encF(nu,eps){ const k=kinu(nu,nu*eps); return nu*nu*(k.Kp*k.Kp+(1-1/(eps*eps))*k.K*k.K); }
/* the classical Gaunt factor: the impact-parameter integral of F telescopes (Bessel's equation) to
   g_cl(ν) = −(√3/π) ν e^{πν} K_{iν}(ν) K′_{iν}(ν):  → (√3/π) ln(2/(e^γ ν)) at low ν, → 1 (Kramers) at high ν */
function gClassical(nu){ const k=kinu(nu,nu); return -Math.sqrt(3)/PI*nu*k.K*k.Kp; }

/* the physical scales of one pass: T in eV, the impact parameter as b/a.  Non-relativistic mechanics
   (v = √(2T/m)): the view says so, and says when β is no longer small. */
function encScales(T,Z,bOverA){
  const beta=Math.sqrt(2*T/MEC2), v=beta*C_LIGHT;
  const a=Z*R_E/(beta*beta);                       /* Ze²/(4πε₀ m v²) = Z r_e (c/v)² */
  const eps=Math.sqrt(1+bOverA*bOverA);
  const hw1=HBAR*v/a/E_CH;                         /* ħv/a in eV: the photon energy at ν = 1 */
  const eta=Z*ALPHA/beta;                          /* Sommerfeld's parameter */
  return {T,Z,beta,v,a,b:bOverA*a,bOverA,eps,chi:2*Math.atan(1/bOverA),rmin:a*(eps-1),tau:a/v,hw1,eta,
    nuWall:T/hw1,                                  /* = η/2: where ħω reaches T */
    dEoverT:4*beta*beta*beta/(3*Z)*encJ3(eps),
    plateau:8*ALPHA*beta*beta/(3*PI)/(eps*eps)};   /* dW/d(ħω) as ω → 0 */
}
/* dW/d(ħω), the energy radiated per unit photon energy (dimensionless), at photon energy hw (eV) */
function encSpec(S,hw){ return 8*ALPHA*S.beta*S.beta/(3*PI)*encF(hw/S.hw1,S.eps); }
/* the instantaneous angular pattern (Liénard): dP/dΩ ∝ |n × ((n − β) × β̇)|²/(1 − n·β)⁵ for n = (cos φ, sin φ)
   in the orbit plane; with rel false the non-relativistic dipole |n × β̇|² = |β̇|² sin²Θ */
function encPattern(bx,by,ax,ay,phi,rel){
  const nx=Math.cos(phi), ny=Math.sin(phi);
  if(!rel){ const c2=nx*ay-ny*ax; return c2*c2; }
  /* (n − β) × β̇ is along z (both in the plane): w = (nx − bx)ay − (ny − by)ax; n × (w ẑ) = (ny w, −nx w), |·|² = w² */
  const w=(nx-bx)*ay-(ny-by)*ax, d=1-(nx*bx+ny*by);
  return w*w/Math.pow(d,5);
}

/* ================================================================== *
 *  2. the cross section — the photon spectrum of one electron energy  *
 *  on one atom, in Seltzer & Berger's scaled form                      *
 *      χ(κ) = (β²/Z²) k dσ/dk  [mb],  κ = k/T                          *
 *  Every theory is Kramers' flat χ_K = (16π/3√3) α r_e² ≈ 5.6 mb       *
 *  times a Gaunt factor.                                               *
 * ================================================================== */
function relBeta(T){ const g=1+T/MEC2; return Math.sqrt(1-1/(g*g)); }       /* T in eV */
/* Sommerfeld's parameter η = Zα/β for the electron's true velocity (the non-relativistic theories below are drawn
   with it: Elwert's convention, exact where they hold) */
function etaOf(T,Z){ return Z*ALPHA/relBeta(T); }

/* Catmull-Rom weights for the nodes -1, 0, 1, 2 at fraction t */
function crW(t){ const t2=t*t, t3=t2*t; return [-0.5*t3+t2-0.5*t, 1.5*t3-2.5*t2+1, -1.5*t3+2*t2+0.5*t, 0.5*t3-0.5*t2]; }
/* bicubic Catmull-Rom on a regular grid G = {x0,dx,nx,s0,ds,ns,g[]} (row-major in x); outside, the last cell's
   cubic is used, and the callers keep x and s inside or extrapolate themselves */
function grid2(G,arr,x,s){
  const fx=(x-G.x0)/G.dx, fs=(s-G.s0)/G.ds;
  let i=Math.floor(fx), j=Math.floor(fs);
  i=clamp(i,1,G.nx-3); j=clamp(j,1,G.ns-3);
  const wx=crW(fx-i), ws=crW(fs-j);
  let v=0;
  for(let a=0;a<4;a++){ const row=(i-1+a)*G.ns; let r=0; for(let b=0;b<4;b++) r+=ws[b]*arr[row+j-1+b]; v+=wx[a]*r; }
  return v;
}
/* the exact non-relativistic Gaunt factor g(η_i, η_f), η_i < η_f, from the table (derive.py: within 2.2e-4 between the
   nodes).  Softer than the table (s < −7): the exact soft-photon law, g rising by (√3/π) ln 10 per decade of κ;
   past the tip end (s > 6, κ within 1e-6 of 1): held, as g has converged there to 1e-6. */
const GSOFT=Math.sqrt(3)/PI*Math.LN10;
function gSomm(ei,ef){
  const r=ei/ef; let x=Math.log10(ei), s=Math.log10((1-r*r)/(r*r));
  if(!(r<1)) return Infinity;                  /* κ = 0 exactly: the soft-photon log diverges */
  x=clamp(x,GTAB.x0,GTAB.x0+(GTAB.nx-1)*GTAB.dx);
  if(s<GTAB.s0) return grid2(GTAB,GTAB.g,x,GTAB.s0)+GSOFT*(GTAB.s0-s);
  s=Math.min(s,GTAB.s0+(GTAB.ns-1)*GTAB.ds);
  return grid2(GTAB,GTAB.g,x,s);
}
/* Born (Bethe & Heitler's non-relativistic limit): g = (√3/π) ln((η_f + η_i)/(η_f − η_i)) = (2√3/π) artanh(η_i/η_f),
   with k ∝ 1/η; the artanh form keeps its digits near the tip, where it vanishes like 2η_i/η_f */
function gBorn(ei,ef){ return 2*Math.sqrt(3)/PI*Math.atanh(ei/ef); }
/* Elwert's factor (η_f/η_i)(1 − e^{−2πη_i})/(1 − e^{−2πη_f}): the ratio of the Coulomb waves' densities at the nucleus */
function elwert(ei,ef){ return ef/ei*(-Math.expm1(-2*PI*ei))/(-Math.expm1(-2*PI*ef)); }

/* χ for the electron energy T (eV), photon κ, element Z, in each approximation.  kind: 'K' Kramers, 'B' Born,
   'BE' Born x Elwert, 'S' Sommerfeld (exact, non-relativistic), '3BN' Bethe-Heitler (relativistic Born), 'SB' the table */
function chiOf(kind,T,Z,kap){
  if(kind==='SB') return sbChi(Z,T,kap);
  if(kind==='3BN') return chi3BN(T,Z,kap);
  if(kind==='K') return CHI_K;
  const ei=etaOf(T,Z), Tf=T*(1-kap), ef=Tf>0?etaOf(Tf,Z):Infinity;
  if(kind==='S') return CHI_K*gSomm(ei,ef);
  /* at the tip (the electron left with nothing) Born vanishes, but Born x Elwert does not:
     g_B F_E -> (2√3/π)(1 − e^{−2πη_i}), finite, which is what Elwert's factor was for */
  if(!isFinite(ef)) return kind==='BE'?CHI_K*2*Math.sqrt(3)/PI*(-Math.expm1(-2*PI*ei)):0;
  const gb=gBorn(ei,ef);
  return CHI_K*(kind==='BE'?gb*elwert(ei,ef):gb);
}

/* Koch & Motz 1959 formula 3BN (Bethe-Heitler: relativistic, Born, no screening), in m c² and m c units, as
   Strong, Moskalenko & Reimer 2000 Eq. (A4) reproduce it; χ = (β₀²/Z²) k dσ/dk in mb.  Written without its
   cancellations: ε = ln((γ + p)/(γ − p)) = 2 asinh p, and γ₀γ − 1 from the kinetic energies.  Its 1/p² terms
   cancel as the final electron stops, so within p < 1e-3 of the tip it is continued linearly in p (Born vanishes
   there like p). */
const P3BN_MIN=1e-3, T3BN_MIN=Math.sqrt(1+P3BN_MIN*P3BN_MIN)-1;        /* the final electron's p and t there */
function chi3BN(T,Z,kap){
  const t0=T/MEC2, k=kap*t0, t=t0-k;
  if(!(k>0)) return Infinity;
  const p=Math.sqrt(Math.max(t,0)*(Math.max(t,0)+2));
  if(p>=P3BN_MIN) return chi3BNcore(t0,t);
  return t0>T3BN_MIN?chi3BNcore(t0,T3BN_MIN)*p/P3BN_MIN:0;
}
function chi3BNcore(t0,t){
  const k=t0-t, g0=1+t0, g=1+t, p0=Math.sqrt(t0*(t0+2)), p=Math.sqrt(t*(t+2));
  const e0=2*Math.asinh(p0), e=2*Math.asinh(p);
  const L=2*Math.log((t0*t+t0+t+p0*p)/k);                         /* γ₀γ + p₀p − 1 = t₀t + t₀ + t + p₀p */
  const br=4/3-2*g0*g*(p*p+p0*p0)/(p0*p0*p*p)+e0*g/(p0*p0*p0)+e*g0/(p*p*p)-e*e0/(p*p0)
    +L*(8/3*g0*g/(p0*p)+k*k*(g0*g0*g*g+p0*p0*p*p)/(p0*p0*p0*p*p*p)
        +k/(2*p0*p)*(e0*(g0*g+p0*p0)/(p0*p0*p0)-e*(g0*g+p*p)/(p*p*p)+2*k*g0*g/(p*p*p0*p0)));
  const b0=p0/g0;
  return b0*b0*ALPHA*p/p0*br*R_E*R_E/MB;                             /* k dσ/dk/(Z² r_e²) = α (p/p₀) {…} */
}

/* ---- the Seltzer-Berger table: χ(Z, T, κ).  Between the table's energies, a natural cubic spline in ln T through the
   33 energies at each κ; between the κ nodes, straight lines (the table's own points, joined).  Outside 1 keV to
   10 MeV: null (refused, not extrapolated). ---- */
const SB_LNT=SB.T.map(t=>Math.log(t*1e6));
const SB_SPL={};
function splineCoef(xs,ys){
  /* natural cubic spline second derivatives (tridiagonal solve) */
  const n=xs.length, y2=new Array(n).fill(0), u=new Array(n).fill(0);
  for(let i=1;i<n-1;i++){
    const sig=(xs[i]-xs[i-1])/(xs[i+1]-xs[i-1]), p=sig*y2[i-1]+2;
    y2[i]=(sig-1)/p;
    u[i]=(ys[i+1]-ys[i])/(xs[i+1]-xs[i])-(ys[i]-ys[i-1])/(xs[i]-xs[i-1]);
    u[i]=(6*u[i]/(xs[i+1]-xs[i-1])-sig*u[i-1])/p;
  }
  y2[n-1]=0;
  for(let k=n-2;k>=0;k--) y2[k]=y2[k]*y2[k+1]+u[k];
  return y2;
}
function splineAt(xs,ys,y2,x){
  let lo=0, hi=xs.length-1;
  while(hi-lo>1){ const m=(hi+lo)>>1; if(xs[m]>x) hi=m; else lo=m; }
  const hh=xs[hi]-xs[lo], a=(xs[hi]-x)/hh, b=(x-xs[lo])/hh;
  return a*ys[lo]+b*ys[hi]+((a*a*a-a)*y2[lo]+(b*b*b-b)*y2[hi])*hh*hh/6;
}
function sbColumn(Z,ik){
  const key=Z+':'+ik; let s=SB_SPL[key];
  if(!s){ const ys=SB.chi[Z].map(r=>r[ik]); s=SB_SPL[key]={ys,y2:splineCoef(SB_LNT,ys)}; }
  return s;
}
/* χ at the table's κ nodes for the energy T (eV) */
function sbRow(Z,T){
  if(!SB.chi[Z]) return null;
  const lt=Math.log(T);
  if(lt<SB_LNT[0]-1e-12||lt>SB_LNT[SB_LNT.length-1]+1e-12) return null;
  const out=[];
  for(let ik=0;ik<SB.k.length;ik++){ const c=sbColumn(Z,ik); out.push(splineAt(SB_LNT,c.ys,c.y2,lt)); }
  return out;
}
function sbChi(Z,T,kap){
  const row=sbRow(Z,T); if(!row) return null;
  const K=SB.k; if(kap<=0) return row[0]; if(kap>=1) return row[K.length-1];
  let j=0; while(j<K.length-2&&K[j+1]<kap) j++;
  return row[j]+(row[j+1]-row[j])*(kap-K[j])/(K[j+1]-K[j]);
}
/* the radiative stopping power from the table: S_rad/ρ = (N_A/A)(Z²/β²) T ∫₀¹ χ dκ (trapezoid over the table's κ),
   in MeV cm²/g; A from ESTAR's Z/A */
function sbSrad(Z,T,ZA){
  const row=sbRow(Z,T); if(!row) return null;
  const K=SB.k; let I=0; for(let j=0;j<K.length-1;j++) I+=0.5*(row[j]+row[j+1])*(K[j+1]-K[j]);
  const b=relBeta(T), A=Z/ZA;
  return N_A/A*Z*Z/(b*b)*(T/1e6)*I*1e-27;
}

/* ================================================================== *
 *  3. the x-ray tube — the thick target                               *
 *  An electron of T₀ = eV slows in the anode (CSDA: straight ahead,   *
 *  losing energy at ESTAR's total stopping power S(T)), and at each   *
 *  energy it passes emits the thin-target spectrum of §2 (the Seltzer-*
 *  Berger table).  A photon made at mass depth z leaves through       *
 *  z/sin θ of anode (θ, the take-off angle) and then the filter.      *
 *  Not modelled: electron backscatter and diffusion, the angular      *
 *  distribution (taken isotropic), the characteristic lines.          *
 * ================================================================== */
/* log-log interpolation in a table that is increasing in x; outside: null */
function llInterp(xs,ys,x){
  const n=xs.length; if(!(x>=xs[0]*(1-1e-12))||!(x<=xs[n-1]*(1+1e-12))) return null;
  let lo=0, hi=n-1; while(hi-lo>1){ const m=(hi+lo)>>1; if(xs[m]>x) hi=m; else lo=m; }
  if(xs[hi]===xs[lo]) return ys[hi];
  const f=Math.log(x/xs[lo])/Math.log(xs[hi]/xs[lo]);
  return Math.exp(Math.log(ys[lo])+f*Math.log(ys[hi]/ys[lo]));
}
/* ESTAR total (and radiative) mass stopping power at T (eV), in MeV cm²/g, log-log between ESTAR's energies */
function estarS(sym,T,which){ const E=ESTAR[sym]; return llInterp(E.T,E[which||'Stot'],T/1e6); }
/* NIST mass attenuation μ/ρ (cm²/g) at k (eV): log-log between the printed energies, never across an edge (an
   edge row repeats the energy; the search picks the side the energy lies on) */
function muRho(sym,k,which){
  const M=MU[sym], E=M.E, v=M[which||'mu'], x=k/1e6, n=E.length;
  if(!(x>=E[0])||!(x<=E[n-1])) return null;
  let i=0; while(i<n-2&&!(E[i+1]>x)) i++;                           /* the last row with E ≤ x; at an edge's energy, the upper side */
  const lo=i, hi=i+1;
  const f=Math.log(x/E[lo])/Math.log(E[hi]/E[lo]);
  return Math.exp(Math.log(v[lo])+f*Math.log(v[hi]/v[lo]));
}
const ANODES={W:{Z:74,sym:'W',name:'tungsten'},Mo:{Z:42,sym:'Mo',name:'molybdenum'},Rh:{Z:45,sym:'Rh',name:'rhodium'},Cu:{Z:29,sym:'Cu',name:'copper'}};
/* filters: material, thickness in mm, density from NIST's tables (g/cm³) */
const FILTER_RHO={Be:1.848,Al:2.699,Cu:8.96,Mo:10.22,Rh:12.41};

/* the thick-target spectrum on a grid of photon energies: per incident electron, into 4π (isotropic),
   dN/dk in photons per eV.  opt: {T0 (eV), anode, theta (rad; 0 = no self-absorption), filt, tmm, nk, nT} */
function tubeSpectrum(opt){
  const A=ANODES[opt.anode], E=ESTAR[A.sym], Zz=A.Z, mA=Zz/E.ZA, T0=opt.T0;
  const nk=opt.nk||160, nT=opt.nT||64, kmin=Math.max(1e3,opt.kmin||1e3);
  /* the CSDA depth z(T) = ∫_T^{T0} dT/S (g/cm²) on a log grid in T from kmin to T0, by Simpson in ln T */
  const lnT=[], Tg=[], S=[], z=[];
  for(let i=0;i<=nT;i++){ const t=Math.exp(Math.log(kmin)+(Math.log(T0)-Math.log(kmin))*i/nT); Tg.push(t); lnT.push(Math.log(t)); S.push(estarS(A.sym,t)); }
  z[nT]=0;
  for(let i=nT-1;i>=0;i--){ const f=t=>t/estarS(A.sym,t)/1e6, a=Tg[i], b=Tg[i+1], m=Math.sqrt(a*b);
    z[i]=z[i+1]+(Math.log(b)-Math.log(a))/6*(f(a)+4*f(m)+f(b)); }            /* dT/S = T d(ln T)/S; S in MeV cm²/g, T in eV */
  const rows=Tg.map(t=>sbRow(A.Z,Math.max(t,1e3)));                          /* χ at the table's κ, once per T */
  const K=SB.k, pref=N_A/mA*Zz*Zz*1e-27;
  const ks=[], dN=[], dN0=[], dNs=[];
  const st=opt.theta>0?Math.sin(opt.theta):0;
  const fr=opt.filt&&opt.filt!=='none'?FILTER_RHO[opt.filt]*opt.tmm/10:0;     /* g/cm² of filter */
  for(let j=0;j<nk;j++){
    const k=kmin+(T0-kmin)*(j+0.5)/nk;                                        /* mid-points: never k = T0 */
    const muA=st>0?muRho(A.sym,k):0, muF=fr>0?muRho(opt.filt,k):0;
    /* ∫_k^{T0}: over the part of the T grid above k, with the partial first cell; trapezoid in ln T */
    let I=0, I0=0;
    /* the integrand per d(ln T) at energy t without absorption (b), and the attenuation exponent there (a = μz/sin θ) */
    const g=(t,row,s,zz)=>{ const kap=k/t, bt=relBeta(t);                   /* t ≥ k always: κ ≤ 1 */
      let jj=0; while(jj<K.length-2&&K[jj+1]<kap) jj++;
      const chi=row[jj]+(row[jj+1]-row[jj])*(kap-K[jj])/(K[jj+1]-K[jj]);
      return {b:chi/(bt*bt)/k*t/(s*1e6), a:st>0?muA*zz/st:0}; };
    /* one cell of width w in ln T, the integrand b linear and the exponent a linear across it: exact,
       w e^{−a₀}[b₀E₁(Δa) + (b₁ − b₀)E₂(Δa)], E₁ = (1 − e^{−d})/d, E₂ = (1 − e^{−d}(1 + d))/d².  A plain trapezoid
       fails where the anode absorbs within one cell (soft photons: 17 % at 5 keV, 100 kV, before this) */
    const cell=(p,q,w)=>{ const d=q.a-p.a; let E1,E2;
      if(Math.abs(d)<1e-6){ E1=1-d/2; E2=0.5-d/3; } else { const em=-Math.expm1(-d); E1=em/d; E2=(em-d*Math.exp(-d))/(d*d); }
      I+=w*Math.exp(-p.a)*(p.b*E1+(q.b-p.b)*E2); I0+=0.5*(p.b+q.b)*w; };
    let prev=null;
    for(let i=0;i<=nT;i++){
      if(Tg[i]<k) continue;
      const cur=g(Tg[i],rows[i],S[i],z[i]);
      if(prev===null){
        /* the first node above k: the cell from T = k (the tip, κ = 1, where χ is finite) up to it */
        const w=Tg[i]>k?Math.log(Tg[i]/k):0, Sk=estarS(A.sym,k), zk=z[i]+w*(k/Sk+Tg[i]/S[i])/2/1e6;
        cell(g(k,sbRow(A.Z,Math.max(k,1e3)),Sk,zk),cur,w);
      } else cell(prev,cur,lnT[i]-lnT[i-1]);
      prev=cur;
    }
    const filt=fr>0?Math.exp(-muF*fr):1;
    ks.push(k); dN0.push(pref*I0); dNs.push(pref*I); dN.push(pref*I*filt);
  }
  return {ks,dN,dN0,dNs,T0,anode:opt.anode,Tg,z};
}
/* the efficiency: the radiated fraction of T₀ with no absorption, (1/T₀)∫₀^{T₀} S_rad/S_tot dT, from the table's
   own S_rad (sbSrad) and ESTAR's S_tot; ESTAR prints the same quantity as its radiation yield */
function tubeYield(anode,T0){
  const A=ANODES[anode], E=ESTAR[A.sym], n=200, lo=1e3;
  let I=0;
  const f=t=>t*sbSrad(A.Z,t,E.ZA)/estarS(A.sym,t);
  for(let i=0;i<n;i++){ const a=Math.exp(Math.log(lo)+(Math.log(T0)-Math.log(lo))*i/n), b=Math.exp(Math.log(lo)+(Math.log(T0)-Math.log(lo))*(i+1)/n), m=Math.sqrt(a*b);
    I+=(Math.log(b)-Math.log(a))/6*(f(a)+4*f(m)+f(b)); }
  return I/T0;
}
/* Kramers 1923, Eq. (78): efficiency 2.34e-4 Z (v/c)², with (v/c)² = 2T/mc² (his non-relativistic electrons) */
function kramersEff(Z,T0){ return 2.34e-4*Z*2*T0/MEC2; }
/* the half-value layer in aluminium (mm) of a spectrum, by air kerma: K(t) ∝ ∫ Φ k (μ_en/ρ)_air e^{−(μ/ρ)_Al ρ t} dk */
function tubeHVL(sp){
  const w=sp.ks.map((k,j)=>sp.dN[j]*k*muRho('air',k,'men')), m=sp.ks.map(k=>muRho('Al',k)*FILTER_RHO.Al/10);
  const K=t=>w.reduce((s,x,j)=>s+x*Math.exp(-m[j]*t),0), K0=K(0);
  if(!(K0>0)) return null;
  let a=0, b=40; for(let it=0;it<80;it++){ const c=(a+b)/2; if(K(c)>K0/2) a=c; else b=c; }
  return (a+b)/2;
}

/* ================================================================== *
 *  4. the hot plasma — thermal bremsstrahlung                         *
 *  Kramers' cross-section averaged over a Maxwellian:                  *
 *   dP/(dV dν) = C_ff Z² n_e n_i (kT)^−½ e^{−hν/kT} ḡ(γ², u)            *
 *   C_ff = (32π²/3√3) √(2/π) (e²/4πε₀)³/(m^{3/2} c³),  γ² = Z²Ry/kT,    *
 *   u = hν/kT;  the total over ν: C_ff Z² n_e n_i (kT)^½ ⟨g⟩(γ²)/h       *
 * ================================================================== */
const E2=E_CH*E_CH/(4*PI*EPS0);                                        /* e²/(4πε₀), J m */
const C_FF=32*PI*PI/(3*Math.sqrt(3))*Math.sqrt(2/PI)*E2*E2*E2/(Math.pow(M_E,1.5)*Math.pow(C_LIGHT,3));
/* the thermally averaged Gaunt factor ḡ(γ², u): the table (derive.py: from the exact g by the Maxwell integral,
   reproducing van Hoof et al. 2014 to 2e-5); outside its u range the exact limits carry it: below, the soft-photon
   law (ḡ rises by (√3/π) ln 10 per decade of u); above, held (u > 10³: e^{−u} has taken it all) */
function gbarTherm(g2,u){
  const x=clamp(Math.log10(g2),GBAR.x0,GBAR.x0+(GBAR.nx-1)*GBAR.dx), s=Math.log10(u);
  if(s<GBAR.s0) return grid2(GBAR,GBAR.g,x,GBAR.s0)+GSOFT*(GBAR.s0-s);
  return grid2(GBAR,GBAR.g,x,Math.min(s,GBAR.s0+(GBAR.ns-1)*GBAR.ds));
}
/* is γ² inside the thermal table (log γ² = −5..3)?  Outside, ḡ is held at the table's edge and the readouts say so */
function gbarInRange(g2){ const x=Math.log10(g2); return x>=GBAR.x0-1e-9&&x<=GBAR.x0+(GBAR.nx-1)*GBAR.dx+1e-9; }
/* the frequency-integrated Gaunt factor ⟨g⟩(γ²) = ∫ e^{−u} ḡ du (the table GFI: gen_tables.py integrates the ḡ table;
   van Hoof et al.'s own agrees to 2.2e-5) */
function gfiTherm(g2){
  const x=clamp(Math.log10(g2),GFI.x0,GFI.x0+(GFI.n-1)*GFI.dx), f=(x-GFI.x0)/GFI.dx;
  let i=clamp(Math.floor(f),1,GFI.n-3); const w=crW(f-i);
  return w[0]*GFI.g[i-1]+w[1]*GFI.g[i]+w[2]*GFI.g[i+1]+w[3]*GFI.g[i+2];
}
/* spectral emissivity per unit photon energy: W m⁻³ eV⁻¹, for T in eV, n in m⁻³, hv in eV; ions of one charge Z */
function ffEmis(T,ne,ni,Z,hv){
  const kT=T*E_CH, g2=Z*Z*RY/T, u=hv/T;
  return C_FF*Z*Z*ne*ni/Math.sqrt(kT)*Math.exp(-u)*gbarTherm(g2,u)*E_CH/H_PL;      /* per Hz → per eV */
}
/* the total power density, W m⁻³ */
function ffPower(T,ne,ni,Z){ const kT=T*E_CH; return C_FF*Z*Z*ne*ni*Math.sqrt(kT)/H_PL*gfiTherm(Z*Z*RY/T); }
/* the NRL formulary's form, eq. (30): P = 1.69e−32 N_e T_e^½ Σ Z²N(Z) W/cm³ (T in eV, N in cm⁻³), for comparison */
function nrlPower(T,ne,ni,Z){ return 1.69e-32*(ne*1e-6)*Math.sqrt(T)*Z*Z*(ni*1e-6)*1e6; }

/* ---- fusion: Bosch & Hale 1992, eqs. (12)-(14) and Table VII's D-T row (T in keV, ⟨σv⟩ in cm³/s; fitted for 0.2-100 keV) ---- */
const BH={DT:{BG:34.3827,mrc2:1124656,C:[1.17302e-9,1.51361e-2,7.51886e-2,4.60643e-3,1.35000e-2,-1.06750e-4,1.36600e-5],T:[0.2,100]}};
function bhSigv(r,T){
  const P=BH[r], C=P.C;
  const th=T/(1-T*(C[1]+T*(C[3]+T*C[5]))/(1+T*(C[2]+T*(C[4]+T*C[6]))));
  const xi=Math.cbrt(P.BG*P.BG/(4*th));
  return C[0]*th*Math.sqrt(xi/(P.mrc2*T*T*T))*Math.exp(-3*xi);
}
const E_ALPHA=3.5e6;                                                   /* eV: the α particle's share of D-T's 17.6 MeV */
/* the ignition balance at the ion temperature T (keV = the electron temperature here), electron density ne (m⁻³),
   Z_eff from one impurity of charge Zi (carbon by default) that also dilutes the fuel:
     n_e = n_f + Zi n_imp,  Z_eff n_e = n_f + Zi² n_imp  →  n_f = n_e (Zi − Z_eff)/(Zi − 1) */
function ignition(TkeV,ne,Zeff,Zi){
  Zi=Zi||6;
  const nf=ne*(Zi-Zeff)/(Zi-1), nimp=(ne-nf)/Zi;
  const Pa=nf*nf/4*bhSigv('DT',TkeV)*1e-6*E_ALPHA*E_CH;              /* n_D n_T <σv> E_α, n_D = n_T = n_f/2 */
  const T=TkeV*1e3;
  const Pb=ffPower(T,ne,nf,1)+(nimp>0?ffPower(T,ne,nimp,Zi):0);
  return {Pa,Pb,nf,nimp,ratio:Pa/Pb};
}
/* the ideal ignition temperature: the lowest T in 1–100 keV where P_α = P_brems (null if α heating never catches the
   loss).  P_α/P_brems rises to one maximum (near 40 keV) and falls: find the maximum first (golden section in ln T),
   then bisect below it; a doubling scan would step over the narrow window near the critical Z_eff */
function ignitionT(Zeff,Zi){
  const f=lt=>{ const r=ignition(Math.exp(lt),1e20,Zeff,Zi); return Math.log(r.Pa/r.Pb); };
  let a=0, b=Math.log(100); const gr=(Math.sqrt(5)-1)/2;
  let c=b-gr*(b-a), d=a+gr*(b-a), fc=f(c), fd=f(d);
  for(let it=0;it<80;it++){ if(fc>fd){ b=d; d=c; fd=fc; c=b-gr*(b-a); fc=f(c); } else { a=c; c=d; fc=fd; d=a+gr*(b-a); fd=f(d); } }
  const lm=(a+b)/2; if(!(f(lm)>0)) return null;
  let lo=0, hi=lm;                                          /* (were P_α above P_brems at 1 keV already, this returns 1 keV) */
  for(let it=0;it<100;it++){ const m=(lo+hi)/2; if(f(m)>0) hi=m; else lo=m; }
  return Math.exp((lo+hi)/2);
}

/* ================================================================== *
 *  5. the absorption — inverse bremsstrahlung                         *
 *  Kirchhoff: the free-free absorption coefficient is the emission     *
 *  over the Planck function, κ_ν = j_ν/B_ν, whatever the Gaunt factor: *
 *   κ = C_ff Z² n_e n_i ḡ c² (1 − e^{−u})/(8π h ν³ (kT)^½)             *
 *  (stimulated emission included), divided in a plasma by the index   *
 *  √(1 − ω_p²/ω²): below the plasma frequency nothing propagates.      *
 * ================================================================== */
function omegaP(ne){ return Math.sqrt(ne*E_CH*E_CH/(EPS0*M_E)); }                 /* rad/s, ne in m⁻³ */
function nCrit(hv){ const w=hv*E_CH/HBAR; return w*w*EPS0*M_E/(E_CH*E_CH); }       /* m⁻³ at photon energy hv (eV) */
/* κ in m⁻¹ at photon energy hv (eV); T in eV, n in m⁻³.  null below the plasma frequency (no propagating wave) */
function ffKappaK(T,ne,ni,Z,hv){
  const nu=hv*E_CH/H_PL, u=hv/T, kT=T*E_CH;
  return C_FF*Z*Z*ne*ni*gbarTherm(Z*Z*RY/T,u)*C_LIGHT*C_LIGHT*(-Math.expm1(-u))/(8*PI*H_PL*nu*nu*nu*Math.sqrt(kT));
}
function ffKappa(T,ne,ni,Z,hv){
  const r=omegaP(ne)/(hv*E_CH/HBAR); if(!(r<1)) return null;
  return ffKappaK(T,ne,ni,Z,hv)/Math.sqrt(1-r*r);
}
/* the NRL formulary's form, eq. (32), with its own Λ (v_te over max(ω, ω_p) times max(Ze²/kT, ħ/√(mkT)); above the plasma
   frequency, where it is used, max(ω, ω_p) = ω): cm⁻¹ → m⁻¹ */
function nrlKappa(T,ne,Z,hv){
  const w=hv*E_CH/HBAR, wp=omegaP(ne); if(!(wp<w)) return null;
  const kT=T*E_CH, vte=Math.sqrt(kT/M_E), lmin=Math.max(Z*E2/kT,HBAR/Math.sqrt(M_E*kT)), L=vte/(w*lmin);
  if(!(Math.log(L)>1)) return null;                  /* ln Λ ≲ 1: the formula has run out (photons near kT) */
  return 3.1e-7*Z*Math.pow(ne*1e-6,2)*Math.log(L)*Math.pow(T,-1.5)/(w*w)/Math.sqrt(1-wp*wp/(w*w))*100;
}
/* a laser into a linear density ramp n = n_c z/L at normal incidence, in and out: A = 1 − exp(−(32/15) κ_K(n_c) L).
   κ_K ∝ n² (ḡ does not depend on n), so κ(n) = κ_K(n_c)(n/n_c)²/√(1 − n/n_c) and 2∫₀^L κ dz = (32/15) κ_K(n_c) L */
function rampAbsorption(T,Z,hv,L){
  const nc=nCrit(hv), kc=ffKappaK(T,nc,nc/Z,Z,hv);
  return {nc,kc,nuc:kc*C_LIGHT,A:-Math.expm1(-32/15*kc*L),tau:32/15*kc*L};
}
/* Langdon's reduction of the absorption when the laser flattens the electrons' distribution (the fit Le, Sherlock &
   Scott 2019 and Turnbull et al. 2023 print and attribute to Langdon 1980): f = 1 − 0.553/[1 + (0.27/α)^0.75], α = Z v_osc²/v_t²,
   v_t = √(kT/m), v_osc = eE₀/(mω), E₀ = √(2I/(cε₀)) (I in W/m²) */
function langdon(alpha){ return 1-0.553/(1+Math.pow(0.27/alpha,0.75)); }
function langdonAlpha(I,hv,T,Z){ const w=hv*E_CH/HBAR, E0=Math.sqrt(2*I/(C_LIGHT*EPS0)), vo=E_CH*E0/(M_E*w); return Z*vo*vo/(T*E_CH/M_E); }

/* the Rosseland and Planck means of κ (with ḡ): 1/κ_R = ∫(1/κ)∂B/∂T / ∫∂B/∂T, κ_P = ∫κB/∫B, trapezoid in ln u over the
   thermal table's u = 10⁻⁷..60 (κB is flat in u below it: the rest of the Planck integral is under 10⁻⁶) */
function ffMeans(T,ne,ni,Z){
  const n=480, u0=1e-7, u1=60; let sR=0, wR=0, sP=0, wP=0;
  for(let i=0;i<=n;i++){
    const u=u0*Math.pow(u1/u0,i/n), w=(i===0||i===n?0.5:1)*u*Math.log(u1/u0)/n;   /* du = u d(ln u) */
    const k=ffKappaK(T,ne,ni,Z,u*T), dB=Math.pow(u,4)*Math.exp(-u)/Math.pow(-Math.expm1(-u),2), B=u*u*u/Math.expm1(u);
    sR+=w*dB/k; wR+=w*dB; sP+=w*k*B; wP+=w*B;
  }
  return {R:wR/sR, P:sP/wP};
}

/* ---- the mechanism: one electron, one ion, a slow wave along the drift (the Kramers-Henneberger frame).
   Units: a = Ze²/(4πε₀ m u²), time a/u, speed u, energy m u².  The free quiver ξ(t) = −(v_o/Ω) cos(Ωt + φ) x̂ is taken
   out exactly: R = r − ξ obeys R″ = −(R + ξ)/|R + ξ|³ (the ion seems to oscillate), and the drift's energy
   |R′|²/2 − 1/|R| is read off far from the ion before and after.  Dormand-Prince 5(4) with error control.
   The slow, weak-wave limit of the phase average (derive.py: against DOP853 trajectories):
     ⟨ΔE⟩ = −m v_o² cos χ (1 − cos χ): a pass that turns the electron back takes energy from the wave, a grazing one
   gives energy to it (the timing of the pass, shifted by the ion's apparent excursion, carries half of the effect). */
function ibFormula(chi){ return -Math.cos(chi)*(1-Math.cos(chi)); }
const DP={c:[0,1/5,3/10,4/5,8/9,1,1],
  a:[[],[1/5],[3/40,9/40],[44/45,-56/15,32/9],[19372/6561,-25360/2187,64448/6561,-212/729],
     [9017/3168,-355/33,46732/5247,49/176,-5103/18656],[35/384,0,500/1113,125/192,-2187/6784,11/84]],
  b5:[35/384,0,500/1113,125/192,-2187/6784,11/84,0],
  b4:[5179/57600,0,7571/16695,393/640,-92097/339200,187/2100,1/40]};
function ibTrajectory(b,vo,Om,phi,opt){
  const o=opt||{}, X0=o.X0||500, tol=o.tol||1e-11, keep=o.keep||0;
  const f=(t,s)=>{ const c=-(vo/Om)*Math.cos(Om*t+phi), x=s[0]+c, y=s[1], r=Math.sqrt(x*x+y*y), r3=r*r*r;
    return [s[2],s[3],-x/r3,-y/r3]; };
  let t=0, s=[-X0,b,1,0], h=0.5, n=0;                            /* n: accepted steps, capped */
  const E0=0.5-1/Math.hypot(X0,b), path=[];
  let lastKeep=-Infinity;
  /* the electron starts at |R| = √(X₀² + b²) moving in, and is followed until it leaves the sphere |R| = X₀ on the way
     out, forward or (χ > 90°) backward: a back-scattered electron never reaches the plane x = X₀ (it ran into the step
     cap).  A step that would cross the sphere is shortened by a secant to land on it: the drift energy is read at
     exactly |R| = X₀, as the twin's event does */
  const rad=q=>Math.hypot(q[0],q[1]);
  while(n<200000){
    const k=[];
    for(let i=0;i<7;i++){ const si=s.slice(); for(let j=0;j<i;j++) for(let q=0;q<4;q++) si[q]+=h*DP.a[i][j]*k[j][q]; k.push(f(t+DP.c[i]*h,si)); }
    const s5=s.slice(), s4=s.slice();
    for(let q=0;q<4;q++) for(let i=0;i<7;i++){ s5[q]+=h*DP.b5[i]*k[i][q]; s4[q]+=h*DP.b4[i]*k[i][q]; }
    let err=0; for(let q=0;q<4;q++) err=Math.max(err,Math.abs(s5[q]-s4[q])/(tol*(1+Math.abs(s5[q]))));
    const r0=rad(s), r1=rad(s5);
    if(err<=1&&r0<X0&&r1>X0&&r1-X0>1e-7*X0){ h*=Math.max(0.05,(X0-r0)/(r1-r0)); continue; }
    if(err<=1){ t+=h; s=s5; n++;
      if(keep&&(t-lastKeep>=keep)){ const c=-(vo/Om)*Math.cos(Om*t+phi); path.push([t,s[0],s[1],s[0]+c]); lastKeep=t; }
      if(r0<X0&&r1>=X0*(1-1e-7)) break; }
    h*=Math.min(4,Math.max(0.1,0.9*Math.pow(err||1e-10,-0.2)));
    h=Math.min(h,20,0.5/Om);                                        /* the wave's phase stays resolved far from the ion */
  }
  const E1=0.5*(s[2]*s[2]+s[3]*s[3])-1/rad(s);
  return {dE:E1-E0, t, path};
}

/* ================================================================== *
 *  6. the balance — bremsstrahlung and its inverse in equilibrium     *
 *  A slab of thickness L:  I_ν = B_ν (1 − e^{−τ_ν}), τ_ν = κ_ν L.      *
 *  A closed box: the photons' occupation n(ν) relaxes to Planck's     *
 *    dn/dt = c κ_ν (n_P − n),  n_P = 1/(e^{hν/kT} − 1)                 *
 *  (emission, stimulated emission and absorption of one free-free     *
 *  collision; κ includes the stimulated term), while the electrons    *
 *  and ions pay for the radiation: (3/2)(n_e + n_i) k dT/dt =          *
 *  −d/dt ∫ (8π h ν³/c³) n dν.  No Compton scattering (no Kompaneets).  *
 * ================================================================== */
/* Planck's spectral radiance per unit photon energy, W m⁻² sr⁻¹ eV⁻¹ (hv, T in eV) */
function planckE(hv,T){ const nu=hv*E_CH/H_PL; return 2*H_PL*nu*nu*nu/(C_LIGHT*C_LIGHT)/Math.expm1(hv/T)*E_CH/H_PL; }
/* the slab: emergent radiance, optically thin limit (j L = κ B L) and the blackbody limit */
function slabI(T,ne,ni,Z,hv,L){
  const k=ffKappa(T,ne,ni,Z,hv); if(k===null) return null;
  const B=planckE(hv,T), tau=k*L;
  return {I:B*(-Math.expm1(-tau)), B, thin:B*tau, tau, k};
}
/* the photon energy where the slab turns from thick to thin (τ = 1), by bisection in ln(hν) (null if τ never crosses 1
   in 1e-6..1e3 kT) */
function slabTurnover(T,ne,ni,Z,L){
  const f=hv=>{ const s=slabI(T,ne,ni,Z,hv,L); return s?Math.log(s.tau):Infinity; };
  let a=1e-6*T, b=1e3*T; if(!(f(a)>0&&f(b)<0)) return null;
  for(let i=0;i<80;i++){ const m=Math.sqrt(a*b); if(f(m)>0) a=m; else b=m; }
  return Math.sqrt(a*b);
}
/* the closed box: nb log-spaced photon energies from min(10⁻³, T_f/100T₀) kT₀ to 40 kT₀; returns snapshots at the times asked (s)
   and T(t).  Each step relaxes n exactly toward the Planck occupation over dt, n′ = n_P(T′) + (n − n_P(T′)) e^{−cκ dt},
   with κ taken at the step's start and the new temperature T′ solved (bisection) so that the electrons and the
   photons together keep their energy: explicit in T it overshoots once dt is long (the photons take more than the
   electrons hold and T goes negative); dt grows geometrically (the low-frequency photons equilibrate first). */
const A_RAD=4*SIGMA_SB/C_LIGHT;                                        /* radiation constant a, J m⁻³ K⁻⁴ */
function photonBox(T0,ne,Z,opt){
  const o=opt||{}, ni=ne/Z, heat=1.5*(ne+ni)*K_B;                      /* J m⁻³ K⁻¹ */
  /* the end point first: (3/2)(n_e + n_i) k T₀ = (3/2)(n_e + n_i) k T_f + a T_f⁴ (photons starting empty) */
  const TK0=T0*E_CH/K_B; let a=0, b=TK0;
  for(let i=0;i<100;i++){ const m=(a+b)/2; if(heat*m+A_RAD*m*m*m*m>heat*TK0) b=m; else a=m; }
  const Tf=(a+b)/2*K_B/E_CH;
  /* the photon energies: from a hundredth of the end temperature (or 1e-3 kT₀) to 40 kT₀, 18 bins a decade: the grid
     must hold the end state's Planck spectrum as well as the start's (a dilute plasma cools a thousandfold) */
  const uLo=Math.min(1e-3,0.01*Tf/T0), uHi=40, nb=o.nb||Math.ceil(18*Math.log10(uHi/uLo));
  const u=[], hv=[];
  for(let i=0;i<nb;i++){ const x=Math.log(uLo)+(Math.log(uHi)-Math.log(uLo))*(i+0.5)/nb; u.push(Math.exp(x)); hv.push(Math.exp(x)*T0); }
  const dlnu=(Math.log(uHi)-Math.log(uLo))/nb;
  /* the energy per unit volume a bin holds per unit occupation: 8πh ν⁴ d(ln ν)/c³ (J m⁻³) */
  const eBin=hv.map(e=>{ const nu=e*E_CH/H_PL; return 8*PI*H_PL*nu*nu*nu*nu/(C_LIGHT*C_LIGHT*C_LIGHT)*dlnu; });
  let T=T0, n=new Array(nb).fill(0), t=0;
  const tau1=1/(C_LIGHT*ffKappaK(T0,ne,ni,Z,T0));                     /* the absorption time at hν = kT₀ */
  /* the clocks: cooling by emission (the plasma's heat over its bremsstrahlung power) and absorption, at the start and
     at the end; the snapshots run from a thousandth of the fastest to thirty times the slowest */
  const tcool=heat*TK0/ffPower(T0,ne,ni,Z), tauf=1/(C_LIGHT*ffKappaK(Tf,ne,ni,Z,Tf));
  /* the energy sits near hν = 4kT (Planck's per ln ν peak is 3.92 kT), where κ is some forty times smaller than at kT:
     that is the slowest clock that matters */
  const slow=Math.max(1/(C_LIGHT*ffKappaK(T0,ne,ni,Z,4*T0)),1/(C_LIGHT*ffKappaK(Tf,ne,ni,Z,4*Tf)));
  const tA=1e-3*Math.min(tcool,tau1), tB=30*Math.max(tcool,slow);
  const times=o.times||Array.from({length:8},(_,i)=>tA*Math.pow(tB/tA,i/7)), snaps=[], trace=[];
  let dt=0.1*times[0], ti=0;
  const Etot0=heat*T0*E_CH/K_B;
  while(ti<times.length){
    const tn=Math.min(t+dt,times[ti]), h=tn-t;
    const dec=hv.map(e=>Math.exp(-C_LIGHT*ffKappaK(T,ne,ni,Z,e)*h));
    const relax=Tp=>n.map((x,i)=>{ const nP=1/Math.expm1(hv[i]/Tp); return nP+(x-nP)*dec[i]; });
    const excess=Tp=>{ const m=relax(Tp); let E=0; for(let i=0;i<nb;i++) E+=m[i]*eBin[i]; return heat*Tp*E_CH/K_B+E-Etot0; };
    /* T′ solves the energy balance; it lies between 0.3 of the end temperature and the present T */
    let lo=0.3*Tf, hi=T; if(excess(hi)<0) hi=T0;
    for(let it=0;it<60;it++){ const m=(lo+hi)/2; if(excess(m)>0) hi=m; else lo=m; }
    T=(lo+hi)/2; n=relax(T); trace.push([tn,T]);
    t=tn; if(t>=times[ti]-1e-12*times[ti]){ snaps.push({t,T,n:n.slice()}); ti++; }
    dt=Math.min(dt*1.12,Math.max(times[ti]-t,0)||dt);
  }
  return {u,hv,snaps,trace,tau1,tcool,tauf,Tf,T0,heat};
}

/* ================================================================== *
 *  state, presets and the view models                                 *
 * ================================================================== */
const TABS=[['enc','the encounter'],['sec','the cross section'],['tube','the x-ray tube'],['plasma','the hot plasma'],
            ['abs','the absorption'],['bal','the balance']];
/* role colours: green = the computed quantity, orange = a measured value, a reference or a warning, magenta = the live
   marker, cyan = structure; the theories of §2 get their own slots */
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6', text:'#cfd4de', faint:'#3a4256',
           grid:'#181d29', box:'#232838', nuc:'#f0d264', elec:'#8fd8ff', ring:'#7deeff',

function encView(st){
  return memo('enc',JSON.stringify([st.eT,st.eZ,st.eB]),()=>{
    const S=encScales(st.eT,st.eZ,st.eB);
    /* the spectrum on a log grid of photon energies around the classical knee and the quantum wall */
    /* the flash lasts about r_min/v_max: ν_knee ≈ 1/ε for a distant pass, √2(ε − 1)^−3/2 for a close one */
    const nuKnee=Math.max(1/S.eps,Math.SQRT2*Math.pow(S.eps-1,-1.5));
    const kLo=Math.min(S.hw1*1e-3,S.T*1e-3), kHi=Math.min(Math.max(S.T*3,S.hw1*8*nuKnee),S.T*1e5);
    const ks=[], dW=[];
    for(let i=0;i<=160;i++){ const k=kLo*Math.pow(kHi/kLo,i/160); ks.push(k); dW.push(encSpec(S,k)); }
    /* the animation runs over ±t_max (a/v); the pulse plot over ±8 half-widths: |a| ∝ 1/r² is half its peak where
       r = √2 r_min, i.e. cosh ξ = (√2(ε − 1) + 1)/ε */
    const tMax=Math.max(8,6*st.eB)*(S.eps), ts=[], acc=[];
    const xh=Math.acosh((Math.SQRT2*(S.eps-1)+1)/S.eps), th=S.eps*Math.sinh(xh)-xh, tP=Math.min(tMax,8*th);
    for(let i=0;i<=240;i++){ const t=-tP+2*tP*i/240, xi=encXiOfT(S.eps,t), o=encOrbit(S.eps,xi); ts.push(t); acc.push(1/(o.r*o.r)); }
    const aMax=1/((S.eps-1)*(S.eps-1));
    /* the radiated energy two ways: the closed form, and the spectrum's integral over photon energy (Parseval) on a grid
       of its own: Simpson in ln ν from 10⁻³ of the plateau's end (1/ε for a distant pass) to twelve knees, plus the flat
       plateau below its first point: within 4e-7 of the closed form for every b/a the slider reaches (F depends on ε
       alone).  The plot stops at 10⁵ T, but a close, fast pass's classical spectrum runs far beyond it (and beyond the
       quantum wall, where it is not physical: the regime row says so) */
    const nA=1e-3*Math.min(1,1/S.eps), xa=Math.log(nA), NP=160, hx=(Math.log(12*nuKnee)-xa)/NP;
    let sp=0; for(let i=0;i<=NP;i++){ const nu=Math.exp(xa+i*hx); sp+=(i===0||i===NP?1:(i%2?4:2))*encF(nu,S.eps)*nu; }
    sp=sp*hx/3+encF(nA,S.eps)*nA;
    return {S,ks,dW,ts,acc,aMax,tMax,th,tP,dE:S.dEoverT*S.T,dEspec:8*ALPHA*S.beta*S.beta/(3*PI)*S.hw1*sp};
  });
}
function secView(st){

    for(let i=0;i<=200;i++){ const k=i/200; kap.push(k);

function eng(x,unit,n){
  if(!isFinite(x)) return '—';

  for(const [f,p] of PREFIX){ if(a>=f*0.9995){ const v=x/f; const d=Math.max(0,n-1-Math.floor(Math.log10(Math.abs(v)+1e-300))); return v.toFixed(Math.min(d,6))+' '+p+unit; } }
  return sigf(x,n)+' '+unit;

 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — extracted from build_lagr/p4_views.js (lineage build_buoy); the camera block from     *
 *  pulsar.html (v3, makeCamera, camBasis, project)                    *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0,snap:null};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }
function segClip(ctx,map,a,b,win,col,lw,dash){ const c=clipToWin(a,b,win); if(c) seg(ctx,map,c[0],c[1],col,lw,dash); return !!c; }
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y1);
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop.  Each entry also carries its text,
   whether it has a plate and its place in the drawing order (DRAW_SEQ, shared with the marker lines) */
let LABELS=[], DRAW_SEQ=0;
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
/* o.plate: a backing of that colour, so a line crossing the label cannot eat its decimal point (a dashed
   orbit through '2.945' read as '2,945'); o.fixed: a label that names a line stays on it or is dropped,
   never shifted 16 or 32 px off it */
const PLATE={plate:'rgba(7,11,24,0.86)'}, PLATE_FIX={plate:'rgba(7,11,24,0.86)',fixed:true};
function lab(ctx,W,H,x,y,txt,col,font,align,base,o){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of (o&&o.fixed)?[0]:[0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ bx.t=t; bx.plate=!!(o&&o.plate); bx.seq=++DRAW_SEQ; LABELS.push(bx);
      if(o&&o.plate){ const mw=Math.max(w,ctx.measureText(t).width), px0=al==='center'?X-mw/2:(al==='right'?X-mw:X);
        ctx.fillStyle=o.plate; ctx.fillRect(px0-2,ly,mw+4,hh); ctx.fillStyle=col||'#aeb6c6'; }
      ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }
  }
  /* nothing clear: the legend is dropped rather than laid over a curve or a label (the captions
     name the colours); clebsch_gordan: forcing it in a big box put it on the mean's label */
  if(!pick){ KEY_DROPS+=items.length; return; }
  legendBox(ctx,pick[0],pick[1],items);
  const lb=[pick[0],pick[1],pick[0]+bw,pick[1]+bh]; lb.t='the legend'; lb.plate=true; lb.seq=++DRAW_SEQ; LABELS.push(lb);
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=nB>0?avail:avail-40;     /* with no row below, the main plot still needs its tick labels and x title */
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-70;             /* 80 px to the bottom row: the main x title, then a key row and a title */
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){

const v3={

  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,

}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}
/* a 3-D polyline: projected, segments recorded, the parts behind the eye skipped */
function poly3(ctx,C,pts,col,lw,dash,norec){
  ctx.beginPath(); let prev=null, n=0;
  for(const p of pts){ const q=C.P(p); if(!q){ prev=null; continue; }
    if(prev){ ctx.lineTo(q.x,q.y); if(!norec) POLY_SEGS.push(prev.x,prev.y,q.x,q.y); n++; } else ctx.moveTo(q.x,q.y);
    prev=q; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  return n;
}
function seg3(ctx,C,a,b,col,lw,dash,norec){ return poly3(ctx,C,[a,b],col,lw,dash,norec); }
/* a floor grid on z = 0 for depth: lines x = const and y = const */
function floorGrid(ctx,C,ext,step,col){
  for(let v=-ext;v<=ext+1e-9;v+=step){ seg3(ctx,C,[v,-ext,0],[v,ext,0],col,0.8,null,true); seg3(ctx,C,[-ext,v,0],[ext,v,0],col,0.8,null,true); }
}

/* axesR plus every visible tick label and both axis titles registered in LABELS, so lab() steps
   round them (build_sm; the Known-bad entry on axesR not knowing where its ticks are) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  const fs=10.5, hh=fs*1.15;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  let yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  /* the corner: an x tick at the left edge and a y tick at the bottom edge put their labels on each other
     (loop_quantum_gravity's Known-bad); the y tick gives way */
  const Xof=t=>b.x+b.w*(t-xlo)/(xhi-xlo||1), Yof=t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1);
  if(xt.some(t=>Math.abs(Xof(t)-b.x)<16)) yt=yt.filter(t=>Math.abs(Yof(t)-b.y1)>=7);
  o.xticks=xt; o.yticks=yt;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1); if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=plain(o.xfmt?o.xfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+hh]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=plain(o.yfmt?o.yfmt(t):fmt(t,2)).length*fs*0.52; LABELS.push([b.x-6-w,Y-hh/2,b.x-6,Y+hh/2]); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+11*1.15]); }
  if(o.ylab){ const w=plain(o.ylab).length*11*0.52; LABELS.push([b.x-40-11*1.15,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
}

/* ================================================================== *
 *  plot helpers: log axes, keys, marker lines (build_div lineage)     *
 * ================================================================== */
let HIT=[], W_STAGE=1100, H_STAGE=712;
let MARKS=[], KEY_DROPS=0;
const nbNarrow=H=>H<520?0:1;
function sLine(ctx,pts,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round'; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
}
/* decade ticks, or 1-2-5 ticks inside a span of less than three decades */
function logTicks125(lo,hi){
  if(!(lo>0)||!(hi>lo)) return [];
  if(hi/lo>=1000) return logTicks(lo,hi);
  const out=[];
  for(let e=Math.floor(Math.log10(lo));e<=Math.ceil(Math.log10(hi));e++) for(const m of [1,2,5]){ const v=m*Math.pow(10,e); if(v>=lo*(1-1e-9)&&v<=hi*(1+1e-9)) out.push(v); }
  return out;
}
/* a power of ten written with superscripts: 10⁻³ */
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹';
function pow10(e){ return '10'+String(e).split('').map(c=>c==='-'?'⁻':SUPD[+c]).join(''); }
/* a tick label on a log axis: decades as 10ⁿ outside 0.01..1000, plain numbers inside */
function logLab(v){ const e=Math.round(Math.log10(v)); if(Math.abs(v-Math.pow(10,e))<1e-9*v&&(e<-2||e>3)) return pow10(e); return sigf(v,1); }
/* a plot with a log x axis and a linear (or log, opt.ylog) y axis; returns the maps and a line drawer that clips */
function logPlot(ctx,b,x0,x1,ylo,yhi,opt){
  const o=opt||{}, lx0=Math.log10(x0), lx1=Math.log10(x1);
  /* 1-2-5 ticks only where they fit: at least 60 px a tick across, 16 px up; else decades */
  const fitTicks=(lo,hi,px,need)=>{ const t=logTicks125(lo,hi); if(t.length*need<=px) return t;
    /* decades, every k-th so that they fit: a κ spanning 50 decades in a 200 px plot */
    const e0=Math.ceil(Math.log10(lo)-1e-9), e1=Math.floor(Math.log10(hi)+1e-9), nd=e1-e0+1, k=Math.max(1,Math.ceil(nd*need/px)), out=[];
    for(let e=e0;e<=e1;e++) if((e-e0)%k===0) out.push(Math.pow(10,e));
    return out; };
  const xt=(o.xticksV||fitTicks(x0,x1,b.w,45)).map(Math.log10);
  const ylog=!!o.ylog, Ly=v=>ylog?Math.log10(v):v, y0=Ly(ylo), y1=Ly(yhi);
  const ax=Object.assign({},o,{xticks:xt,xfmt:o.xfmt||(l=>logLab(Math.pow(10,l)))});
  if(ylog){ ax.yticks=(o.yticksV||fitTicks(ylo,yhi,b.h,16)).map(Math.log10); ax.yfmt=o.yfmt||(l=>logLab(Math.pow(10,l))); }
  axesT(ctx,b,lx0,lx1,y0,y1,ax);
  const X=x=>b.x+b.w*(Math.log10(x)-lx0)/(lx1-lx0), Y=v=>b.y1-b.h*(Ly(v)-y0)/(y1-y0);
  return {b,lx0,lx1,y0,y1,X,Y,ylog,
    line:(xs,vs,col,lw,dash)=>polyline(ctx,b,xs.map(Math.log10),vs.map(v=>ylog?(v>0?Math.log10(v):NaN):v),lx0,lx1,y0,y1,col,lw,dash)};
}
function linPlot(ctx,b,x0,x1,ylo,yhi,opt){
  axesT(ctx,b,x0,x1,ylo,yhi,opt||{});
  return {b,X:x=>b.x+b.w*(x-x0)/(x1-x0),Y:v=>b.y1-b.h*(v-ylo)/(yhi-ylo),
    line:(xs,vs,col,lw,dash)=>polyline(ctx,b,xs,vs,x0,x1,ylo,yhi,col,lw,dash)};
}
/* a linear axis's scale: the power of ten that puts its largest value between 1 and 1000, and the title's suffix
   (tick labels stay short: 0.00040 ran into the axis title) */
/* a tick label with the fewest decimals (to n) and a true minus sign */
function tickFmt(x,n){ return x===0?'0':String(+x.toFixed(n===undefined?2:n)).replace('-','−'); }
function axScale(max){ if(!(max>0)) return {f:1,s:''}; const e=3*Math.floor(Math.log10(max)/3); return e===0?{f:1,s:''}:{f:Math.pow(10,e),s:' × '+pow10(e)}; }
/* a legend as one line of swatches above a plot's title, registered; what does not fit is counted in KEY_DROPS */
function keyRow(ctx,x,y,items,maxW){
  ctx.font=SM_FONT; let X=x;
  for(let i=0;i<items.length;i++){ const [col,txt,dash]=items[i], t=plain(txt), w=ctx.measureText(t).width+24;
    if(X+w>x+maxW){ KEY_DROPS+=items.length-i; break; }
    ctx.beginPath(); ctx.moveTo(X,y); ctx.lineTo(X+14,y); ctx.strokeStyle=col; ctx.lineWidth=2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#9aa2b4'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(t,X+18,y);
    const bx=[X,y-7,X+w-6,y+7]; bx.t=t; bx.plate=true; bx.seq=++DRAW_SEQ; LABELS.push(bx);
    X+=w; }
}
/* a vertical marker line across a plot, registered (a label drawn across one is a test failure) */
function vMark(ctx,b,X,col,dash,lw){
  if(!(X>=b.x-0.5&&X<=b.x1+0.5)) return false;
  ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.strokeStyle=col; ctx.lineWidth=lw||1; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]);
  MARKS.push({X,y0:b.y,y1:b.y1,seq:++DRAW_SEQ});
  return true;
}
/* shade the part of a plot box right of X (a forbidden region), under everything else */
function shadeRight(ctx,b,X,col){ const x0=clamp(X,b.x,b.x1); if(x0<b.x1){ ctx.fillStyle=col; ctx.fillRect(x0,b.y+0.5,b.x1-x0,b.h-1); } }
/* an arc of the unit circle as an explicit polyline (the recorder keeps polylines, not arcs under a transform) */
function arcPts(cx,cy,r,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; p.push([cx+r*Math.cos(a),cy-r*Math.sin(a)]); } return p; }

/* ================================================================== *
 *  view 1: the encounter                                              *
 * ================================================================== */
/* the animation: the electron runs from −t_max to t_max (units a/v) in 6 s of wall time at speed 1 */
function encTime(E,st){ const D=6/(st.eSpeed||1), f=((SIM.t/D)%1+1)%1; return -E.tMax+2*E.tMax*f; }
/* the orbit in the picture's frame: rotated so that the electron arrives travelling along +x */
function encFrame(eps){ const al=Math.acos(1/eps), c=Math.cos(-al), s=Math.sin(-al); return (x,y)=>[c*x-s*y, s*x+c*y]; }
function encCaption(M){
  const E=M.E, S=E.S;
  const cls=S.eta>3?'Here η = '+fmt(S.eta,2)+': many photons’ worth of the classical spectrum lies below T, and the picture is a fair one.'
    :S.eta<0.3?'Here η = '+fmt(S.eta,2)+': the wall cuts the classical spectrum in its flat part, and the classical picture fails (the quantum Born result takes over: the next view).'
    :'Here η = '+fmt(S.eta,2)+', between the classical and the quantum regimes: only the exact quantum theory holds (the next view).';
  return {full:'An electron passing a nucleus is pulled round it on a hyperbola, and while it turns it accelerates and radiates (Larmor): almost all of it in one flash at closest approach, the rings leaving at the speed of light. The flash lasts about rₘᵢₙ/vₘₐₓ, so its spectrum (lower right) is flat up to photons of about ħvₘₐₓ/rₘᵢₙ and falls exponentially beyond. A quantum electron cannot give more than its kinetic energy T to one photon, so the spectrum stops at ħω = T (the Duane–Hunt wall). '+cls,
    short:'The electron radiates a flash at closest approach; its spectrum is flat, then falls; no photon exceeds T.'};
}
function drawEnc(ctx,W,H,M){
  const E=M.E, S=E.S, st=ST, cap=encCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.42,nbNarrow(H));
  drawEncOrbit(ctx,W,H,Lay.main,E,st);
  const B=Lay.bottom;
  if(B.length===1) drawEncSpec(ctx,W,H,B[0],E,st);          /* one slot: the spectrum */
  else if(B.length===2){ drawEncPulse(ctx,W,H,B[0],E,st); drawEncSpec(ctx,W,H,B[1],E,st); }
  drawCaption(ctx,Lay);
}
function drawEncOrbit(ctx,W,H,b,E,st){
  const S=E.S, eps=S.eps, rot=encFrame(eps);
  /* the window: ±1.6 max(b, 1.2 a) tall, as wide as the box allows (one scale on both axes: the orbit is a shape) */
  const half=1.6*Math.max(S.bOverA,1.2), hw=half*b.w/b.h;
  const map=worldFitUp(b,{xmin:-hw,xmax:hw,ymin:-half,ymax:half},0);
  const win={x0:-hw,x1:hw,y0:-half,y1:half};
  frame(ctx,b,'#1c2130');
  /* the whole path, faint, from where it enters the window to where it leaves */
  const pts=[]; const xiMax=Math.acosh((hw*1.5+1)/eps+1e-9);
  for(let i=0;i<=600;i++){ const xi=-xiMax+2*xiMax*i/600, o=encOrbit(eps,xi); pts.push(rot(o.x,o.y)); }
  worldPath(ctx,map,pts,'#39506e',1.2,[4,4],win);
  /* the incoming asymptote and the impact parameter */
  const yIn=pts[0][1];
  segClip(ctx,map,[-hw,yIn],[0,yIn],win,'#2c3a52',1,[2,5]);
  const bx=-0.45*hw;
  if(Math.abs(yIn)*map.s>10){ seg(ctx,map,[bx,0],[bx,yIn],'#6f7789',1);
    lab(ctx,W,H,map.X(bx)-6,map.Y(yIn/2),'b = '+fmt(S.bOverA,2)+' a','#8b93a6',SM_FONT,'right','middle',PLATE); }
  /* the deflection: the outgoing direction, rotated by χ from +x */
  const chi=S.chi, L0=0.35*half;
  if(chi>0.02){ const out=[Math.cos(chi),Math.sin(chi)*Math.sign(-yIn||1)];
    const arc=[]; for(let i=0;i<=40;i++){ const a=chi*i/40*Math.sign(-yIn||1); arc.push([map.X(0)+L0*map.s*Math.cos(a),map.Y(0)-L0*map.s*Math.sin(a)]); }
    sLine(ctx,arc,'#6f7789',1); seg(ctx,map,[0,0],[L0*1.25,0],'#2c3a52',1,[2,4]);
    lab(ctx,W,H,map.X(L0*1.15*Math.cos(chi/2)),map.Y(L0*1.15*Math.sin(chi/2)*Math.sign(-yIn||1)),'χ = '+fmt(chi*180/PI,1)+'°','#8b93a6',SM_FONT,'left','middle',PLATE); }
  /* the electron now, and the rings it has emitted */
  const t=encTime(E,st), beta=S.beta;
  if(st.eRings){
    const nR=48, span=2*E.tMax;
    for(let k=1;k<=nR;k++){ const te=t-span*k/nR/2; if(te<-E.tMax) break;
      const xe=encXiOfT(eps,te), oe=encOrbit(eps,xe), P=1/(oe.r*oe.r*oe.r*oe.r)/(E.aMax*E.aMax);
      const R=(t-te)/beta; if(R*map.s>Math.hypot(b.w,b.h)) continue;
      const al=clamp(Math.pow(P,0.35),0,1)*0.9; if(al<0.03) continue;
      const p=rot(oe.x,oe.y), ring=[];
      for(let i=0;i<=72;i++){ const a=TAU*i/72; ring.push([map.X(p[0]+R*Math.cos(a)),map.Y(p[1]+R*Math.sin(a))]); }
      const inside=ring.filter(q=>q[0]>=b.x&&q[0]<=b.x1&&q[1]>=b.y&&q[1]<=b.y1);
      if(inside.length<3) continue;
      ctx.save(); ctx.globalAlpha=al; clipPath(ctx,ring,b,COL.ring,1); ctx.restore(); }
  }
  const xi=encXiOfT(eps,t), k=encKin(eps,xi), p=rot(k.x,k.y);
  /* the nucleus */
  dot(ctx,map.X(0),map.Y(0),6,COL.nuc,null);
  lab(ctx,W,H,map.X(0)+9,map.Y(0)+12,'+'+S.Z+'e','#e0c860',SM_FONT,'left','middle',PLATE);
  /* the Larmor lobe at the electron: its size follows the power, its shape the direction of the acceleration */
  const rotV=(x,y)=>{ const q=rot(x,y); return q; };
  const a=rotV(k.ax,k.ay), v=rotV(k.vx,k.vy), P=k.a*k.a/(E.aMax*E.aMax);
  const lobe=[]; let pm=0; const n=90, vals=[];
  for(let i=0;i<=n;i++){ const ph=TAU*i/n, val=encPattern(v[0]*beta,v[1]*beta,a[0],a[1],ph,st.eRel); vals.push(val); pm=Math.max(pm,val); }
  const Rl=0.32*half*Math.sqrt(clamp(P,0,1));
  if(pm>0&&Rl*map.s>1.5){ for(let i=0;i<=n;i++){ const ph=TAU*i/n, r=Rl*vals[i]/pm; lobe.push([map.X(p[0]+r*Math.cos(ph)),map.Y(p[1]+r*Math.sin(ph))]); }
    ctx.beginPath(); ctx.moveTo(lobe[0][0],lobe[0][1]); for(const q of lobe) ctx.lineTo(q[0],q[1]); ctx.closePath();
    ctx.fillStyle=rgba(COL.pos,0.18); ctx.fill(); ctx.strokeStyle=rgba(COL.pos,0.8); ctx.lineWidth=1; ctx.stroke(); }
  /* the acceleration arrow (towards the nucleus), length on the same power scale */
  const aL=Math.hypot(a[0],a[1])||1, La=0.28*half*Math.sqrt(clamp(P,0,1));
  if(La*map.s>4) arrowPx(ctx,map.X(p[0]),map.Y(p[1]),map.X(p[0]+La*a[0]/aL),map.Y(p[1]+La*a[1]/aL),COL.live,1.6);
  dot(ctx,map.X(p[0]),map.Y(p[1]),4.5,COL.elec,'#fff');
  lab(ctx,W,H,b.x+8,b.y+12,'one pass, drawn to scale: lengths in a = Ze²/(4πε₀mv²) = '+metre(S.a,3),'#8b93a6',SM_FONT,'left','middle',PLATE);
  lab(ctx,W,H,b.x+8,b.y+28,st.eRel?'the lobe: Liénard’s pattern at β = '+fmt(beta,3)+' (tilted forward)':'the lobe: the dipole pattern sin²Θ about the acceleration','#6f7789',SM_FONT,'left','middle',PLATE);
  HIT.push({kind:'orbit',b});
}
/* a closed polyline clipped to a box, point by point (rings that leave the picture) */
function clipPath(ctx,pts,b,col,lw){
  ctx.beginPath(); let on=false;
  for(const q of pts){ const ins=q[0]>=b.x&&q[0]<=b.x1&&q[1]>=b.y&&q[1]<=b.y1;
    if(ins){ if(!on){ ctx.moveTo(q[0],q[1]); on=true; } else ctx.lineTo(q[0],q[1]); } else on=false; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1; ctx.stroke();
}
function drawEncPulse(ctx,W,H,b,E,st){
  const t=encTime(E,st);
  /* short passes are timed in a power of ten of a/v, so the tick labels stay short */
  const sc=axScale(E.tP), ts=E.ts.map(x=>x/sc.f), tp=E.tP/sc.f;
  const tl=sc.f===1?'time, in units of a/v = '+sec(E.S.tau,2):'time, in units of '+pow10(Math.round(Math.log10(sc.f)))+' a/v (a/v = '+sec(E.S.tau,2)+')';
  const P=linPlot(ctx,b,-tp,tp,0,1.08,{title:titleFor(b,'the pulse: |a| and the Larmor power over the pass','the pulse'),xlab:tl,ylab:'of the peak',
    ny:4,xfmt:x=>tickFmt(x,2),yfmt:y=>fmt(y,1)});
  const acc=E.acc.map(x=>x/E.aMax), pw=acc.map(x=>x*x);
  P.line(ts,pw,COL.ref,1.3,[5,3]);
  P.line(ts,acc,COL.pos,1.8);
  vMark(ctx,b,P.X(t/sc.f),COL.live,[],1);
  keyRow(ctx,b.x,b.y-30,[[COL.pos,'|a|'],[COL.ref,'P ∝ a²',[5,3]]],b.w);
}
function drawEncSpec(ctx,W,H,b,E,st){
  const S=E.S, ks=E.ks, dW=E.dW;
  const ymax=Math.max.apply(null,dW.filter(isFinite))*3, ymin=ymax*1e-6;
  const P=logPlot(ctx,b,ks[0],ks[ks.length-1],ymin,ymax,{ylog:true,title:titleFor(b,'the spectrum of one pass: energy per unit photon energy','the spectrum of one pass'),
    xlab:'photon energy ħω (eV)',ylab:'dW/d(ħω)'});
  shadeRight(ctx,b,P.X(S.T),'rgba(205,53,196,0.07)');
  const plat=ks.map(()=>S.plateau);
  P.line(ks,plat,COL.ref,1.2,[5,4]);
  P.line(ks,dW,COL.pos,1.9);
  if(vMark(ctx,b,P.X(S.T),COL.live,[],1.4))
    lab(ctx,W,H,P.X(S.T)+5,b.y+12,'ħω = T','#cd35c4',SM_FONT,'left','middle',PLATE_FIX);

/* ================================================================== *
 *  view 2: the cross section                                          *
 * ================================================================== */
const SEC_CURVES=[['SB','Seltzer–Berger','sb','sSB'],['S','Sommerfeld, exact','somm','sS'],['3BN','Bethe–Heitler 3BN','bh','s3'],
                  ['BE','Born × Elwert','elw','sBE'],['B','Born','born','sB'],['K','Kramers','kram','sK']];
function secCaption(M){
  const C=M.C, el=ESYM[C.Z];
  return {full:'Seltzer and Berger’s scaled cross-section χ = (β²/Z²)k dσ/dk: the number of photons per unit ln k, with the charge and the electron’s speed divided out, so that Kramers’ classical estimate (1923) is one flat line at 5.6 mb. Every other theory multiplies it by a Gaunt factor. Born’s approximation (fast electrons, η ≪ 1) falls to nothing at the tip; Elwert’s factor, the ratio of the Coulomb waves’ densities at the nucleus, restores it; Sommerfeld’s exact non-relativistic result (1931) holds at any η; Bethe and Heitler’s 3BN is Born made relativistic. The table (orange) is the evaluated standard: screened, relativistic, electron–electron bremsstrahlung included. '+el+' at '+eV(C.T,3)+': η = '+fmt(C.ei,3)+'.',
    short:'χ = (β²/Z²) k dσ/dk: Kramers is flat, every theory is Kramers times a Gaunt factor; the table is the standard.'};
}
function drawSec(ctx,W,H,M){
  const C=M.C, st=ST, cap=secCaption(M);
  const Lay=stageLayout(ctx,W,H,cap.full,cap.short,2,0.40,nbNarrow(H));
  const m=Lay.main;
  const on=SEC_CURVES.filter(c=>st[c[3]]);
  let ymax=0; for(const c of on) for(const v of C.curves[c[0]]) if(isFinite(v)&&v<60) ymax=Math.max(ymax,v);
  ymax=ymax>0?ymax*1.12:10;
  const P=linPlot(ctx,m,0,1,0,ymax,{title:'χ(κ) for '+ESYM[C.Z]+' at T = '+eV(C.T,3),xlab:'κ = k/T, the photon’s share of the electron’s energy',ylab:'χ (mb)',nx:10,
    xfmt:x=>fmt(x,1),yfmt:y=>fmt(y,y<10?1:0)});
  const items=[];
  for(const c of on.slice().reverse()){ const ys=C.curves[c[0]];
    P.line(C.kap,ys,COL[c[2]],c[0]==='SB'?2.2:1.6,c[0]==='K'?[6,4]:c[0]==='B'?[3,3]:null); }
  for(const c of on) items.push([COL[c[2]],c[1],c[0]==='K'?[6,4]:c[0]==='B'?[3,3]:null]);
  /* the table's own points at its κ, when T is one of its energies */
  if(st.sSB&&C.sbAt){ const onGrid=SB.T.some(t=>Math.abs(t*1e6/C.T-1)<1e-9);
    if(onGrid) SB.k.forEach((k,i)=>{ const y=C.sbAt[i]; if(y<=ymax) dot(ctx,P.X(k),P.Y(y),2.6,COL.sb,null); }); }
  if(!C.sbAt&&st.sSB) lab(ctx,W,H,m.x+10,m.y+14,'the table runs from 1 keV to 10 MeV','#e8843a',SM_FONT,'left','middle',PLATE);
  keyRow(ctx,m.x,m.y-30,items,m.w);
  const B=Lay.bottom;
  if(B[0]) drawSecGaunt(ctx,W,H,B[0],C);
  if(B[1]) drawSecSrad(ctx,W,H,B[1],C);                    /* one slot: the Gaunt factor */
  drawCaption(ctx,Lay);
}
function drawSecGaunt(ctx,W,H,b,C){
  const P=logPlot(ctx,b,C.gx[0],C.gx[C.gx.length-1],0,2.2,{title:titleFor(b,'the Gaunt factor at κ = ½ across the regimes','g at κ = ½'),xlab:'η = Zα/β',ylab:'g',ny:4,yfmt:y=>fmt(y,1)});
  P.line(C.gx,C.gB,COL.born,1.4,[3,3]);
  P.line(C.gx,C.gC,COL.kram,1.4,[6,4]);

  const X=P.X(C.ei); if(vMark(ctx,b,X,COL.live,[],1)) lab(ctx,W,H,X+4,b.y+12,'here','#cd35c4',SM_FONT,'left','middle',PLATE_FIX);

function drawSecSrad(ctx,W,H,b,C){
  if(!C.srad.length){ lab(ctx,W,H,b.x+10,b.y+14,'no ESTAR table for this element','#8b93a6',SM_FONT,'left','middle'); return; }

/* ================================================================== *
 *  view 3: the x-ray tube                                             *
