<title>Clebsch&ndash;Gordan coefficients &mdash; two angular momenta, two bases, and the brackets between them</title>
<!--
  ===================================================================
  clebsch_gordan.html — adding two angular momenta: the uncoupled kets
  |j1 m1>|j2 m2>, the coupled kets |J M>, and the Clebsch-Gordan
  coefficients <j1 m1; j2 m2|J M> that are the brackets between them
  ===================================================================

  Six views.  THE KET: |J M> written out on the canvas as a sum over
  product kets with the exact coefficient (a signed square root of a
  rational) and its bracket under every term; the same ket as a column
  of numbers in the product basis; amplitudes and Born-rule
  probabilities, and a seeded run of measurements of J1z and J2z.  Or
  the other way round: a product ket expanded over J.  THE TABLE: the
  whole change-of-basis matrix <j1 m1; j2 m2|J M>, rows bras and columns
  kets, block diagonal because M = m1 + m2; entries written the PDG way
  (square root understood), as surds or as decimals; the swap and flip
  symmetries, the 3j symbol, and the orthonormality of rows and columns.
  THE LADDER: the (m1, m2) lattice and the lines of constant M; every
  |J M> built from |j1 j1>|j2 j2> by J- = J1- + J2-, each new multiplet
  started by orthogonality and the Condon-Shortley phase, with the
  algebra of each step; why J runs from |j1 - j2| to j1 + j2.  THE
  VECTOR MODEL: J1 and J2 precessing about J, J about z; P(m1) = |CG|^2
  against the classical density of the precessing vector; the projection
  theorem; all four quantum numbers scaled by n toward the classical
  limit.  ATOMS IN A FIELD: the ground-state hyperfine levels of
  hydrogen (the 21-cm line), rubidium-87 and caesium-133 (the second)
  and the 3p fine structure of sodium in a magnetic field: the
  Breit-Rabi diagram, the eigenvector of any level in the uncoupled
  basis running from the Clebsch-Gordan column at weak field to a single
  product ket at strong field, Lande factors from |CG|^2, the clock
  shift.  ROTATIONS: d(j1) x d(j2) in the product basis, the matrix of
  coefficients, and the same rotation in the coupled basis, block
  diagonal: a rotation never changes J.

  WHAT IS MEASURED OR TABULATED (build_cg/data/, fetched 2026-09-18)
  ------------------------------------------------------------------
  CODATA 2022 (NIST): mu_B/h, the electron g factor, mu_p/mu_B.  The
  hydrogen hyperfine frequency 1420.405751768(2) MHz (Hellwig et al.
  1970, via Wikipedia "Hydrogen line").  D. A. Steck, "Cesium D Line
  Data", "Rubidium 87 D Line Data" and "Sodium D Line Data" (rev. 2.3.4,
  2025): the ground-state A constants, g_J, g_I, g_L, g_S, the D1 and D2
  frequencies of sodium, the measured Lande factors of Na 3p and the
  printed clock shifts.  The PDG 2026 table of Clebsch-Gordan
  coefficients (141 entries read from it agree with the coefficients
  here) and its d functions.

  WHAT IS COMPUTED HERE AND CHECKED BY build_cg/derive.py
  -------------------------------------------------------
  Every coefficient, exactly (the Racah formula in BigInt rationals;
  sympy's clebsch_gordan in the twin, itself checked against J^2
  eigenvectors, a 50-digit ladder construction and the PDG table); the
  ladder construction; 3j symbols and symmetries; Wigner d functions and
  the block diagonalisation; the vector-model densities; the level
  energies (Jacobi here, numpy eigh and the Breit-Rabi formula in the
  twin), eigenvectors, g factors and clock shifts; the seeded Born-rule
  draws (mulberry32, the same bits in both).

  WHAT IS MODELLED
  ----------------
  hbar = 1 and the Condon-Shortley phase convention (the PDG's).  The
  vector model is a picture: its vectors have the quantum lengths
  sqrt(j(j+1)) and precess uniformly.  In a field each atom is two
  angular momenta and nothing else: no B or C hyperfine constants (zero
  for J = 1/2), no hyperfine structure inside sodium 3p, no diamagnetic
  term; hydrogen's g_J is the free-electron value (the bound-state
  correction is 1.8e-5 of it).  Precession and rotation are drawing
  clocks.
-->

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }

  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;

  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);

}

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and

/* ================================================================== *
 *  physics.  Quantum numbers are DOUBLED integers throughout the core *
 *  (tj = 2j, tm = 2m) so half-integers are exact; hbar = 1; the       *
 *  Condon-Shortley phase convention (the PDG's).                      *
 * ================================================================== */
const DEG=PI/180, RAD=180/PI;
const par=k=>((k%2)+2)%2?-1:1;                 /* (-1)^k for an integer k of either sign */
/* half-integer text: 3 -> "3/2", -1 -> "−1/2", 4 -> "2"; hfs adds an explicit + */
function hf(t){ const a=Math.abs(t); return (t<0?'−':'')+(a%2?a+'/2':String(a/2)); }
function hfs(t){ return (t>0?'+':'')+hf(t); }
function sub(n){ return String(n).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'[+c]).join(''); }
function signed(x,n){ const s=fmt(Math.abs(x),n); return (x<0&&+s!==0?'−':x>0&&+s!==0?'+':'')+s; }

/* ---- exact arithmetic: BigInt factorials and rationals ---- */
const FACT=[1n];
function fct(n){ while(FACT.length<=n) FACT.push(FACT[FACT.length-1]*BigInt(FACT.length)); return FACT[n]; }
function bgcd(a,b){ if(a<0n) a=-a; if(b<0n) b=-b; while(b){ const t=a%b; a=b; b=t; } return a; }
function ratNorm(n,d){ if(d<0n){ n=-n; d=-d; } const g=bgcd(n,d)||1n; return [n/g,d/g]; }
function ratAdd(a,b){ return ratNorm(a[0]*b[1]+b[0]*a[1],a[1]*b[1]); }
function ratMul(a,b){ return ratNorm(a[0]*b[0],a[1]*b[1]); }
function bitLen(n){ return n===0n?0:n.toString(2).length; }
/* a big rational to the nearest double: both ends cut to 60 bits first */
function ratToNum(n,d){
  const neg=n<0n; if(neg) n=-n;
  const sn=Math.max(0,bitLen(n)-60), sd=Math.max(0,bitLen(d)-60);
  const v=Number(n>>BigInt(sn))/Number(d>>BigInt(sd))*Math.pow(2,sn-sd);
  return neg?-v:v;
}
function isqrtB(n){
  if(n<2n) return n;
  let x=1n<<BigInt(Math.ceil(bitLen(n)/2)), y=(x+n/x)>>1n;
  while(y<x){ x=y; y=(x+n/x)>>1n; }
  return x;
}
function ratText(n,d){ return d===1n?String(n):n+'/'+d; }

/* ---- the selection rules.  j1 − m1 whole is not checked: with m1 + m2 = M it
   follows from j2 − m2, J − M and j1 + j2 + J whole (a second guard would make
   either one's mutant invisible; selfTest asserts the implication) ---- */
function cgValid(tj1,tm1,tj2,tm2,tJ,tM){
  return tm1+tm2===tM&&Math.abs(tm1)<=tj1&&Math.abs(tm2)<=tj2&&Math.abs(tM)<=tJ
    &&((tj2+tm2)&1)===0&&((tJ+tM)&1)===0

/* ---- <j1 m1; j2 m2 | J M> exactly: the Racah formula.  Returns the sign s and
   C^2 = n/d reduced.  C = s sqrt(n/d). ---- */
const CGMEMO=new Map();
const CG0={s:0,n:0n,d:1n};
function cgExact(tj1,tm1,tj2,tm2,tJ,tM){
  if(!cgValid(tj1,tm1,tj2,tm2,tJ,tM)) return CG0;
  const key=tj1+','+tm1+','+tj2+','+tm2+','+tJ;
  const hit=CGMEMO.get(key); if(hit) return hit;
  const a=(tj1+tj2-tJ)/2, b=(tj1-tj2+tJ)/2, c=(-tj1+tj2+tJ)/2, d=(tj1+tj2+tJ)/2+1;
  const Pn=BigInt(tJ+1)*fct(a)*fct(b)*fct(c)*fct((tJ+tM)/2)*fct((tJ-tM)/2)
          *fct((tj1-tm1)/2)*fct((tj1+tm1)/2)*fct((tj2-tm2)/2)*fct((tj2+tm2)/2), Pd=fct(d);
  const e1=(tj1-tm1)/2, e2=(tj2+tm2)/2, e3=(tJ-tj2+tm1)/2, e4=(tJ-tj1-tm2)/2;
  const k0=Math.max(0,-e3,-e4), k1=Math.min(a,e1,e2);
  let S=[0n,1n];
  for(let k=k0;k<=k1;k++)
    S=ratAdd(S,[k%2?-1n:1n,fct(k)*fct(a-k)*fct(e1-k)*fct(e2-k)*fct(e3+k)*fct(e4+k)]);
  let out=CG0;
  if(S[0]!==0n){ const q=ratNorm(S[0]*S[0]*Pn,S[1]*S[1]*Pd); out={s:S[0]>0n?1:-1,n:q[0],d:q[1]}; }
  CGMEMO.set(key,out); return out;
}
function cgv(c){ return c.s?c.s*Math.sqrt(ratToNum(c.n,c.d)):0; }
/* a probability |C|^2 straight from the exact n/d (C*C is an ulp off: 1/15 came back 0.06666666666666665) */
function cgP(c){ return c.s?ratToNum(c.n,c.d):0; }
function cg(tj1,tm1,tj2,tm2,tJ,tM){ return cgv(cgExact(tj1,tm1,tj2,tm2,tJ,tM)); }
/* the three ways of writing a coefficient: 'root' −√(8/15), 'pdg' −8/15 (the PDG
   table's convention, a square root understood over every entry), 'dec' −0.7303 */
function cgText(c,style){
  if(!c.s) return '0';
  const sg=c.s<0?'−':'';
  if(style==='pdg') return sg+ratText(c.n,c.d);
  if(style==='dec') return sg+fmt(Math.sqrt(ratToNum(c.n,c.d)),4);
  const rn=isqrtB(c.n), rd=isqrtB(c.d);
  if(rn*rn===c.n&&rd*rd===c.d) return sg+ratText(rn,rd);
  return sg+'√('+ratText(c.n,c.d)+')';
}
/* the parts drawCoef() typesets: sign, radicand (null for a rational), the text */
function cgParts(c){
  if(!c.s) return {sign:0,root:false,txt:'0'};
  const rn=isqrtB(c.n), rd=isqrtB(c.d);
  if(rn*rn===c.n&&rd*rd===c.d) return {sign:c.s,root:false,txt:ratText(rn,rd)};
  return {sign:c.s,root:true,txt:ratText(c.n,c.d)};
}

/* ---- the 3j symbol: (j1 j2 j3; m1 m2 m3) = (−1)^(j1−j2−m3) <j1 m1; j2 m2|j3 −m3> / sqrt(2 j3 + 1) ---- */
function threej(tj1,tj2,tj3,tm1,tm2,tm3){
  const c=cgExact(tj1,tm1,tj2,tm2,tj3,-tm3);
  if(!c.s) return CG0;
  const q=ratNorm(c.n,c.d*BigInt(tj3+1));
  return {s:c.s*par((tj1-tj2-tm3)/2),n:q[0],d:q[1]};
}
/* the symmetry partners of one coefficient: each equals (phase) x the original */
function symPartners(tj1,tm1,tj2,tm2,tJ,tM){
  const ph=par((tj1+tj2-tJ)/2);
  return {
    swap:{ph, c:cgExact(tj2,tm2,tj1,tm1,tJ,tM), txt:'⟨j₂ m₂; j₁ m₁|J M⟩'},
    flip:{ph, c:cgExact(tj1,-tm1,tj2,-tm2,tJ,-tM), txt:'⟨j₁ −m₁; j₂ −m₂|J −M⟩'},
    third:{ph:par((tj1-tm1)/2), fac:[BigInt(tJ+1),BigInt(tj2+1)], c:cgExact(tj1,tm1,tJ,-tM,tj2,-tm2), txt:'⟨j₁ m₁; J −M|j₂ −m₂⟩'},
  };
}

/* ---- bases.  PDG order: product rows by M descending then m1 descending; coupled
   columns by M descending then J descending.  Kronecker order (m1 outer, both
   descending) and J order (J descending then M) for the rotation view. ---- */
function prodPDG(tj1,tj2){ const o=[];
  for(let tM=tj1+tj2;tM>=-(tj1+tj2);tM-=2) for(let tm1=tj1;tm1>=-tj1;tm1-=2){ const tm2=tM-tm1; if(Math.abs(tm2)<=tj2) o.push([tm1,tm2]); }
  return o; }
function coupPDG(tj1,tj2){ const o=[];
  for(let tM=tj1+tj2;tM>=-(tj1+tj2);tM-=2) for(let tJ=tj1+tj2;tJ>=Math.abs(tj1-tj2);tJ-=2) if(Math.abs(tM)<=tJ) o.push([tJ,tM]);
  return o; }
function prodKron(tj1,tj2){ const o=[]; for(let tm1=tj1;tm1>=-tj1;tm1-=2) for(let tm2=tj2;tm2>=-tj2;tm2-=2) o.push([tm1,tm2]); return o; }
function coupJ(tj1,tj2){ const o=[]; for(let tJ=tj1+tj2;tJ>=Math.abs(tj1-tj2);tJ-=2) for(let tM=tJ;tM>=-tJ;tM-=2) o.push([tJ,tM]); return o; }
function Jvalues(tj1,tj2){ const o=[]; for(let tJ=tj1+tj2;tJ>=Math.abs(tj1-tj2);tJ-=2) o.push(tJ); return o; }
/* the terms of |J M>: product kets with m1 + m2 = M, m1 descending */
function termsOf(tj1,tj2,tM){ const o=[]; for(let tm1=tj1;tm1>=-tj1;tm1-=2){ const tm2=tM-tm1; if(Math.abs(tm2)<=tj2) o.push(tm1); } return o; }
/* the change-of-basis matrix, rows x columns, as doubles */
function Umatrix(rows,cols,tj1,tj2){ return rows.map(([tm1,tm2])=>cols.map(([tJ,tM])=>cg(tj1,tm1,tj2,tm2,tJ,tM))); }
function matMulT(A,B){ /* A^T B */ const n=A[0].length, m=B[0].length, k=A.length, C=[];
  for(let i=0;i<n;i++){ const r=new Float64Array(m); for(let j=0;j<m;j++){ let s=0; for(let t=0;t<k;t++) s+=A[t][i]*B[t][j]; r[j]=s; } C.push(r); } return C; }
function orthoResidual(U){ const G=matMulT(U,U); let w=0; for(let i=0;i<G.length;i++) for(let j=0;j<G.length;j++) w=Math.max(w,Math.abs(G[i][j]-(i===j?1:0))); return w; }
/* a column of |J M> sums exactly: sum over its terms of n/d, in BigInt */
function columnNormExact(tj1,tj2,tJ,tM){ let s=[0n,1n]; for(const tm1 of termsOf(tj1,tj2,tM)){ const c=cgExact(tj1,tm1,tj2,tM-tm1,tJ,tM); if(c.s) s=ratAdd(s,[c.n,c.d]); } return s; }
function rowNormExact(tj1,tj2,tm1,tm2){ let s=[0n,1n]; for(const tJ of Jvalues(tj1,tj2)){ const c=cgExact(tj1,tm1,tj2,tm2,tJ,tm1+tm2); if(c.s) s=ratAdd(s,[c.n,c.d]); } return s; }
/* expectation values in |J M>, exactly: <J1z> and <J1z^2> as rationals of m1 weighted by C^2 */
function jzMoments(tj1,tj2,tJ,tM){
  let m1=[0n,1n], m2=[0n,1n];
  for(const tm1 of termsOf(tj1,tj2,tM)){ const c=cgExact(tj1,tm1,tj2,tM-tm1,tJ,tM); if(!c.s) continue;
    m1=ratAdd(m1,[BigInt(tm1)*c.n,2n*c.d]); m2=ratAdd(m2,[BigInt(tm1*tm1)*c.n,4n*c.d]); }
  const v=ratAdd(m2,[-m1[0]*m1[0],m1[1]*m1[1]]);
  return {mean:m1,mean2:m2,var:v};
}
/* the projection theorem: <J1z> = M [J(J+1) + j1(j1+1) − j2(j2+1)] / (2 J(J+1)), exactly */
function projMean(tj1,tj2,tJ,tM){
  if(tJ===0) return [0n,1n];
  const J2=BigInt(tJ*(tJ+2)), a2=BigInt(tj1*(tj1+2)), b2=BigInt(tj2*(tj2+2));   /* 4 j(j+1) */
  return ratNorm(BigInt(tM)*(J2+a2-b2),4n*J2);

/* ---- the ladder: every |J M> built with J− = J1− + J2−, each new multiplet's top

function lowerFactor(tj,tm){ /* J−|j m> = sqrt((j+m)(j−m+1)) |j m−1> */ return Math.sqrt((tj+tm)*(tj-tm+2)/4); }

/* ---- Wigner d^j_{m'm}(beta) = <j m'| exp(−i beta J_y) |j m>: Wigner's sum ---- */
const FACTN=[1]; for(let i=1;i<=40;i++) FACTN.push(FACTN[i-1]*i);

  const pre=Math.sqrt(FACTN[jpm]*FACTN[jmm]*FACTN[jp]*FACTN[jm]);

    const e=k-(tm-tmp)/2;
    sum+=par(e)*pre/(FACTN[jp-k]*FACTN[k]*FACTN[jmm-k]*FACTN[e])

function rotModelCore(tj1,tj2,beta){

  const d1=dMatrix(tj1,beta), d2=dMatrix(tj2,beta);
  const K=[]; for(let a=0;a<n1;a++) for(let b=0;b<n2;b++){ const r=new Float64Array(N); for(let c2=0;c2<n1;c2++) for(let e=0;e<n2;e++) r[c2*n2+e]=d1[a][c2]*d2[b][e]; K.push(r); }

function pJofProduct(tj1,tj2,tm1,tm2,beta){
  const out=[];

    const c=cg(tj1,tm1,tj2,tm2,tJ,tm1+tm2), before=c*c, amps=[];
    let after=0; if(Math.abs(tm1+tm2)<=tJ) for(let tMp=tJ;tMp>=-tJ;tMp-=2){ const a=wignerd(tJ,tMp,tm1+tm2,beta)*c; amps.push({tMp,a}); after+=a*a; }

/* ---- the vector model: quantum lengths sqrt(j(j+1)), uniform precession.  With J

  const L1=Math.sqrt(j1*(j1+1)), L2=Math.sqrt(j2*(j2+1)), LJ=Math.sqrt(J*(J+1));
  const c1=(L1>0&&LJ>0)?(LJ*LJ+L1*L1-L2*L2)/(2*LJ*L1):1, cJ=LJ>0?M/LJ:1;
  const a=L1*c1*cJ, b=L1*Math.sqrt(Math.max(0,1-c1*c1))*Math.sqrt(Math.max(0,1-cJ*cJ));

function brRoles(sy){ return sy.tj1===1?{tI:sy.tj2,gJ:sy.g1,gI:sy.g2}:{tI:sy.tj1,gJ:sy.g2,gI:sy.g1}; }

function fieldBlock(sy,tM,B){

  for(let i=0;i<n;i++){ const r=new Float64Array(n), tm1=ms[i], tm2=tM-tm1;
    r[i]=sy.A*tm1*tm2/4+MU_B*B*(sy.g1*tm1/2+sy.g2*tm2/2); Hm.push(r); }

/* symmetric eigenproblem by cyclic Jacobi rotations; eigenvalues descending */
function symEig(A0){
  const n=A0.length, A=A0.map(r=>Float64Array.from(r)), V=[];
  for(let i=0;i<n;i++){ const r=new Float64Array(n); r[i]=1; V.push(r); }
  let scale=0; for(let p=0;p<n;p++) for(let q=0;q<n;q++) scale+=A[p][q]*A[p][q];
  for(let sweep=0;sweep<60;sweep++){
    let off=0; for(let p=0;p<n;p++) for(let q=p+1;q<n;q++) off+=A[p][q]*A[p][q];
    if(off<=1e-32*scale) break;          /* relative: the entries run to hundreds of GHz */
    for(let p=0;p<n;p++) for(let q=p+1;q<n;q++){
      if(Math.abs(A[p][q])<1e-300) continue;
      const th=(A[q][q]-A[p][p])/(2*A[p][q]), t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1)), c=1/Math.sqrt(t*t+1), s=t*c;

      for(let k=0;k<n;k++){ const apk=A[p][k], aqk=A[q][k]; A[p][k]=c*apk-s*aqk; A[q][k]=s*apk+c*aqk; }

function fieldLevels(sy,B){

  return {dir:'coupled',q,terms,sel:terms.findIndex(t=>t.tm1===q.tm1),born:bornKey(st,q),colNorm:columnNormExact(q.tj1,q.tj2,q.tJ,q.tM),
          mo,proj:projMean(q.tj1,q.tj2,q.tJ,q.tM),
          j1j2:ratNorm(BigInt(q.tJ*(q.tJ+2)-q.tj1*(q.tj1+2)-q.tj2*(q.tj2+2)),8n)};   /* <J1.J2> = [J(J+1) − j1(j1+1) − j2(j2+1)]/2 */
}
function bornKey(st,q){ return st.dir+'|'+q.tj1+','+q.tj2+','+q.tM+','+(st.dir==='product'?q.tm1:q.tJ); }
function bornCounts(K){ return BORN.key===K.born?BORN.counts:K.terms.map(()=>0); }
function bornN(K){ return BORN.key===K.born?BORN.n:0; }
function measure(k){ const q=normQ(ST), K=ketModel(ST,q); bornSync(K.born,K.terms.length); bornDraw(K.terms.map(t=>t.P),k); }
function measureClear(){ BORN.key=null; BORN.counts=[]; BORN.n=0; }

/* ---- the table ---- */
function tableModel(st,q){
  const base=memo('tbl',q.tj1+','+q.tj2,()=>{ const rows=prodPDG(q.tj1,q.tj2), cols=coupPDG(q.tj1,q.tj2), U=Umatrix(rows,cols,q.tj1,q.tj2);
    return {rows,cols,U,orth:orthoResidual(U),rowOrth:orthoResidual(U.map((r,i)=>U.map(rr=>rr[i])))}; });   /* U U^T too */
  const c=cgExact(q.tj1,q.tm1,q.tj2,q.tm2,q.tJ,q.tM);
  const r=base.rows.findIndex(x=>x[0]===q.tm1&&x[1]===q.tm2), k=base.cols.findIndex(x=>x[0]===q.tJ&&x[1]===q.tM);
  const fr=base.rows.findIndex(x=>x[0]===-q.tm1&&x[1]===-q.tm2), fk=base.cols.findIndex(x=>x[0]===q.tJ&&x[1]===-q.tM);
  const nz=base.U.reduce((s,row)=>s+row.filter(x=>x!==0).length,0);
  return Object.assign({q,c,sel:[r,k],flip:[fr,fk],nz,sym:symPartners(q.tj1,q.tm1,q.tj2,q.tm2,q.tJ,q.tM),
    tj:threej(q.tj1,q.tj2,q.tJ,q.tm1,q.tm2,-q.tM),colNorm:columnNormExact(q.tj1,q.tj2,q.tJ,q.tM),rowNorm:rowNormExact(q.tj1,q.tj2,q.tm1,q.tm2)},base);
}

/* ---- the ladder ---- */
function ladderFor(q){ return memo('lad',q.tj1+','+q.tj2,()=>ladderSteps(q.tj1,q.tj2)); }
function ladderModel(st,q){
  const steps=ladderFor(q), n=steps.length, k=clamp(Math.round(st.step),0,n-1), s=steps[k];
  const done={}; for(let i=0;i<=k;i++) done[steps[i].tJ+','+steps[i].tM]=i;
  /* n(M): how many product kets have m1 + m2 = M, and how many multiplets reach M */
  const nM=[]; for(let tM=q.tj1+q.tj2;tM>=-(q.tj1+q.tj2);tM-=2) nM.push({tM,n:termsOf(q.tj1,q.tj2,tM).length,Js:Jvalues(q.tj1,q.tj2).filter(tJ=>tJ>=Math.abs(tM))});
  const exact=s.ms.map(tm1=>cgExact(q.tj1,tm1,q.tj2,s.tM-tm1,s.tJ,s.tM));
  const prev=k>0?steps[k-1]:null;
  return {q,steps,n,k,s,prev,done,nM,exact,maxErr:Math.max(0,...s.ms.map((tm1,i)=>Math.abs(s.v[i]-cgv(exact[i]))))};
}

/* ---- the vector model ---- */
function vectorModel(st,q){
  const n=clamp(Math.round(st.scale),1,VM_NMAX);
  const s={tj1:n*q.tj1,tj2:n*q.tj2,tJ:n*q.tJ,tM:n*q.tM};
  const V=memo('vm',[s.tj1,s.tj2,s.tJ,s.tM].join(),()=>{ const v=vmCore(s.tj1,s.tj2,s.tJ,s.tM); v.D=kolmogorov(v); v.mo=jzMoments(s.tj1,s.tj2,s.tJ,s.tM); v.proj=projMean(s.tj1,s.tj2,s.tJ,s.tM); return v; });
  const stretched=q.tJ===q.tj1+q.tj2, bottom=q.tJ===Math.abs(q.tj1-q.tj2);
  return {q,n,s,V,D:dSeries(q.tj1,q.tj2,q.tJ,q.tM),mean:ratToNum(V.mo.mean[0],V.mo.mean[1]),varQ:ratToNum(V.mo.var[0],V.mo.var[1]),varCl:V.b*V.b/2,
          degenerate:(q.tj1===0||q.tj2===0),edge:stretched||bottom,stretched,bottom,t:SIM.t};
}

/* ---- atoms in a field ---- */
const FIELD_NS=121;
function fieldCurves(sys){
  return memo('fc'+sys,'1',()=>{ const sy=SYSTEMS[sys], B0=sysB0(sy), xs=[], lv=[];
    for(let i=0;i<FIELD_NS;i++){ const x=LIM.xBMax*i/(FIELD_NS-1); xs.push(x); lv.push(fieldLevels(sy,x*B0)); }
    return {xs,lv}; });
}
function fieldModel(st){
  const f=normField(st), sy=f.sy, B0=sysB0(sy), B=clamp(st.xB,0,LIM.xBMax)*B0;
  const L=fieldLevels(sy,B), sel=L.find(l=>l.tF===f.fF&&l.tM===f.fM);
  const r=brRoles(sy), K=sy.tj1===1||sy.tj2===1?clockK(sy):null;
  return {f,sy,sys:f.sys,B0,B,x:clamp(st.xB,0,LIM.xBMax),L,sel,curves:fieldCurves(f.sys),split:sysSplit(sy),
          gCG:f.fM!==0?gFromCG(sy,f.fF,f.fM):null,gP:f.fF!==0?gProj(sy,f.fF):null,K,
          naG:f.sys==='Na'?{g12:gProj(sy,1),g32:gProj(sy,3)}:null,roles:r};
}

/* ---- rotations ---- */
function rotModel(st,q){
  const beta=st.beta*DEG, R=rotModelCore(q.tj1,q.tj2,beta);
  const pJ=pJofProduct(q.tj1,q.tj2,q.tm1,q.tm2,beta);
  const col=[]; for(let tMp=q.tJ;tMp>=-q.tJ;tMp-=2) col.push({tMp,v:wignerd(q.tJ,tMp,q.tM,beta)});
  return {q,beta,R,pJ,col,chiL:0};
}

function buildModel(){
  const st=ST, view=st.view, q=normQ(st);
  const M={view,st,q,t:SIM.t};
  if(view==='ket') M.K=ketModel(st,q);
  if(view==='table') M.T=tableModel(st,q);
  if(view==='ladder') M.L=ladderModel(st,q);
  if(view==='vector') M.V=vectorModel(st,q);
  if(view==='field') M.F=fieldModel(st);
  if(view==='rot') M.R=rotModel(st,q);
  return M;
}

function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }

    s+=hd('the selected entry')+rrow('bracket',brFull(q,q.tm1,q.tm2,q.tJ,q.tM))+rrow('√ written, PDG, decimal',cgHTML(T.c,'root')+' &middot; '+cgHTML(T.c,'pdg')+' &middot; '+signed(cgv(T.c),4))
      +rrow('its column |J M&rang;: &sum; C&sup2;',ratHTML(T.colNorm),'good')+rrow('its row &lang;m&#8321; m&#8322;|: &sum; C&sup2;',ratHTML(T.rowNorm),'good');
    const Y=T.sym, ph=Y.swap.ph<0?'&minus;':'+';

      +rrow('3j (j&#8321; j&#8322; J; m&#8321; m&#8322; &minus;M)',cgHTML(T.tj,'root'));
  }
  else if(M.view==='ladder'){

      +rrow('state built',ketC(s0.tJ,s0.tM))+rrow('miss against the exact value',L.maxErr.toExponential(1),L.maxErr<1e-12?'good':'bad');

function fieldBtext(B,sy){ return sy.unit==='G'?sigf(B*1e4,4)+' G':sigf(B,4)+' T'; }

function eqbarHTML(M){

  if(M.view==='ket') return M.K.dir==='coupled'

        'put the identity 1 = &sum; |m&#8321; m&#8322;&rang;&lang;m&#8321; m&#8322;| in front of the coupled ket: each coefficient is the overlap of |J M&rang; with one product ket, and its square is the chance of finding that pair of values')
    : E('<span class="hl">|j&#8321; m&#8321;&rang;|j&#8322; m&#8322;&rang; = &sum;<sub>J</sub> |J M&rang;</span> &lang;J M|j&#8321; m&#8321;; j&#8322; m&#8322;&rang; &nbsp;&middot;&nbsp; <span class="hl2">&lang;J M|j&#8321; m&#8321;; j&#8322; m&#8322;&rang; = &lang;j&#8321; m&#8321;; j&#8322; m&#8322;|J M&rang;</span> (real)',
        'the same numbers read along a row: a product ket is a superposition of the J values allowed by the triangle rule, and a measurement of J&sup2; finds each with probability |C|&sup2;');
  if(M.view==='table') return E('<span class="hl">U<sub>(m&#8321;m&#8322;),(JM)</sub> = &lang;j&#8321; m&#8321;; j&#8322; m&#8322;|J M&rang;</span> &nbsp;&middot;&nbsp; <span class="hl2">U&#7488;U = UU&#7488; = 1</span> &nbsp;&middot;&nbsp; &lang;j&#8321; m&#8321;; j&#8322; m&#8322;|J M&rang; = 0 unless m&#8321; + m&#8322; = M',
    'the coefficients are the entries of one real orthogonal matrix: its rows are the bras of the product basis, its columns the kets of the coupled basis, and every entry is the bracket of its row with its column');
  if(M.view==='ladder') return E('<span class="hl">J&#8331; = J&#8321;&#8331; + J&#8322;&#8331;</span>, &nbsp; J&#8331;|j m&rang; = &radic;((j+m)(j&minus;m+1)) |j, m&minus;1&rang; &nbsp;&middot;&nbsp; <span class="hl2">&lang;j&#8321; j&#8321;; j&#8322; J&minus;j&#8321;|J J&rang; &gt; 0</span>',
    'start from the only state with M = j&#8321; + j&#8322;, lower it one step at a time, and begin each smaller J at the top of its M line by orthogonality; the Condon&ndash;Shortley rule fixes the one free sign');
  if(M.view==='vector') return E('<span class="hl">&lang;J&#8321;<sub>z</sub>&rang; = &sum; m&#8321; |&lang;m&#8321; m&#8322;|J M&rang;|&sup2; = M '+FRT('J(J+1) + j&#8321;(j&#8321;+1) &minus; j&#8322;(j&#8322;+1)','2J(J+1)')+'</span> &nbsp;&middot;&nbsp; <span class="hl2">p(m&#8321;) = 1/&pi;&radic;(b&sup2; &minus; (m&#8321; &minus; a)&sup2;)</span>',
    'the projection theorem: while J&#8321; precesses about J only its component along J survives, so the quantum average and the average of the classical precessing vector agree exactly');

  const bw=b.w/vals.length, Y=v=>b.y1-b.h*(v-lo)/(hi-lo), out=[];
  vals.forEach((v,i)=>{
    const x=b.x+bw*i+bw*0.2, w=bw*0.6, y0=Y(Math.max(lo,Math.min(0,hi))), y1=Y(clamp(v,lo,hi));
    ctx.fillStyle=cols?cols[i]:sgnCol(v); ctx.fillRect(x,Math.min(y0,y1),w,Math.max(1,Math.abs(y1-y0)));
    POLY_SEGS.push(x,y0,x+w,y1,x,y1,x+w,y0);          /* the bar's diagonals: a legend placed later steps around it */
    out.push({i,b:box(b.x+bw*i,b.y,bw,b.h),x:x+w/2,y:y1});
  });
  if(lo<0){ ctx.strokeStyle='#39425a'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(b.x,Y(0)); ctx.lineTo(b.x1,Y(0)); ctx.stroke(); }
  /* term labels under the frame: dropped (and counted) when the bars get too narrow */
  if(labels){ const lw=Math.max(...labels.map(t=>tw(ctx,t,SMALL)));

}

/* ================================ the ket ================================ */
function ketTokens(q,tm1,tm2){ return [{t:'|'+hfs(tm1)+'⟩',col:COL.j1},{t:'|'+hfs(tm2)+'⟩',col:COL.j2}]; }
function drawKet(ctx,W,H,M){
  const K=M.K, q=M.q, narrow=isNarrow(W);

    :'A product ket written in the coupled basis: the same coefficients, read along a row of the table. It holds every J from |j₁ − j₂| to j₁ + j₂ that can reach M = m₁ + m₂, and a measurement of J² finds each with probability |C|².';
  const L=fitCaption(ctx,W,H,capFull,K.dir==='coupled'?'The coupled ket in the product basis: each coefficient is the bracket ⟨m₁ m₂|J M⟩ under it.':'A product ket in the coupled basis: a row of the table.',right-left,top+200);

  const terms=K.terms.map((t,i)=>K.dir==='coupled'
    ?{parts:cgParts(t.c),kets:ketTokens(q,t.tm1,t.tm2),label:'⟨'+hfs(t.tm1)+' '+hfs(t.tm2)+'|'+hf(q.tJ)+' '+hfs(q.tM)+'⟩',sel:i===K.sel,dim:!t.c.s}
    :{parts:cgParts(t.c),kets:[{t:'|'+hf(t.tJ)+', '+hfs(q.tM)+'⟩',col:COL.jt}],label:'⟨'+hf(t.tJ)+' '+hfs(q.tM)+'|'+hfs(q.tm1)+' '+hfs(q.tm2)+'⟩',sel:i===K.sel,dim:!t.c.s});
  const head=K.dir==='coupled'?'j₁ = '+hf(q.tj1)+', j₂ = '+hf(q.tj2)+':  |m₁⟩|m₂⟩ stands for |j₁ m₁⟩ ⊗ |j₂ m₂⟩':'j₁ = '+hf(q.tj1)+', j₂ = '+hf(q.tj2)+':  |J M⟩ stands for the coupled ket |(j₁ j₂) J M⟩';
  tok(ctx,left,top-6,head,'#8b93a6',SMALL);

  TS.hits.forEach(h=>HIT.push({kind:'term',i:h.i,b:h.b}));

  if(availH<90) { drawCaptionK(ctx,L,left); return; }
  /* three panels: the column, the amplitudes, the probabilities and the measurements */
  const nP=narrow?1:3, gut=58, pw=(right-left-gut*(nP-1)-30)/nP;
  const bx=i=>box(left+30+i*(pw+gut),y1+22,pw,availH-44);
  const labs=K.dir==='coupled'?K.terms.map(t=>hfs(t.tm1)+','+hfs(t.tm2)):K.terms.map(t=>'J='+hf(t.tJ));
  if(!narrow){
    drawColumn(ctx,box(left,y1,pw+30,availH),M);
    const b1=bx(1), bars=barPanel(ctx,b1,K.terms.map(t=>t.v),labs,-1,1,titleFor(b1,K.dir==='coupled'?'amplitudes ⟨m₁ m₂|J M⟩':'amplitudes ⟨J M|m₁ m₂⟩','amplitudes'));
    if(K.sel>=0){ const bb=bars[K.sel]; ctx.strokeStyle=COL.live; ctx.lineWidth=1.4; ctx.strokeRect(bb.b.x+1.5,b1.y+1.5,bb.b.w-3,b1.h-3); }
    bars.forEach(b2=>HIT.push({kind:'term',i:b2.i,b:b2.b}));
  }
  const b2=bx(narrow?0:2), bars2=barPanel(ctx,b2,K.terms.map(t=>t.P),labs,0,1,titleFor(b2,'probabilities |C|² and '+bornN(K)+' measurements','|C|², '+bornN(K)+' measured'),K.terms.map(()=>mix(COL.off,COL.pos,0.75)));
  bars2.forEach(b3=>HIT.push({kind:'term',i:b3.i,b:b3.b}));
  /* the measured frequencies with their binomial one-sigma bars */
  const n=bornN(K), cnt=bornCounts(K), Y=v=>b2.y1-b2.h*v;
  if(n>0) bars2.forEach((b3,i)=>{ const f=cnt[i]/n, p=K.terms[i].P, sd=Math.sqrt(Math.max(0,p*(1-p)/n));
    ctx.strokeStyle=COL.live; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(b3.x,Y(clamp(p-sd,0,1))); ctx.lineTo(b3.x,Y(clamp(p+sd,0,1))); ctx.stroke();

function drawCaptionK(ctx,L,left){ caption(ctx,left,L.capY,L.txt,L.capW,'#767e92',CAP_FONT); }
/* the ket as a column of numbers in the other basis: rows are the basis bras, the
   entries their brackets with the ket; rows off the M block are 0 */
function drawColumn(ctx,b,M){
  const K=M.K, q=M.q, coupled=K.dir==='coupled';
  const rows=coupled?prodPDG(q.tj1,q.tj2):coupPDG(q.tj1,q.tj2);
  const title=coupled?'|'+hf(q.tJ)+', '+hfs(q.tM)+'⟩ as a column':'|'+hfs(q.tm1)+'⟩|'+hfs(q.tm2)+'⟩ as a column';

  for(const i of show){
    const r=rows[i], blk=inBlock(r);
    const lab=coupled?'⟨'+hfs(r[0])+' '+hfs(r[1])+'|':'⟨'+hf(r[0])+' '+hfs(r[1])+'|';
    const c=coupled?cgExact(q.tj1,r[0],q.tj2,r[1],q.tJ,q.tM):cgExact(q.tj1,q.tm1,q.tj2,q.tm2,r[0],r[1]);
    const selRow=coupled?(blk&&r[0]===q.tm1):(blk&&r[0]===q.tJ);
    tok(ctx,b.x+6,y,lab,selRow?COL.live:(blk?'#9aa2b4':COL.faint),labF);
    tok(ctx,vx,y,blk?cgText(c,ST.style):'0',selRow?COL.live:(blk?(c.s>0?COL.plus:c.s<0?COL.minus:COL.faint):COL.faint),labF,'right');
    y+=rh;

  ctx.beginPath(); ctx.moveTo(b.x+b.w-1,yt); ctx.lineTo(b.x+b.w+3,yt); ctx.lineTo(b.x+b.w+3,yb); ctx.lineTo(b.x+b.w-1,yb); ctx.stroke();

/* ================================ the table ================================ */
function drawTable(ctx,W,H,M){
  const T=M.T, q=M.q, narrow=isNarrow(W);
  const left=narrow?20:56, right=narrow?W-20:W-RO_W-44, top=stageTop()+30;
  const L=fitCaption(ctx,W,H,ST.layout==='pdg'
    ?'The same numbers the way the Review of Particle Physics prints them: one small table for each M, J and M across the top, m₁ m₂ down the side, and a square root understood over every entry, so −8/15 means −√(8/15). Each block is one diagonal block of the whole matrix. Blue positive, coral negative. Click an entry.'
    :'Every coefficient at once: row ⟨m₁ m₂| (a bra of the product basis) times column |J M⟩ (a ket of the coupled basis) is the entry where they cross. Only M = m₁ + m₂ survives, so the matrix is block diagonal (cyan). Rows and columns are orthonormal: the matrix is orthogonal, UᵀU = UUᵀ = 1. Blue positive, coral negative; the dashed box is the flip partner ⟨j₁ −m₁; j₂ −m₂|J −M⟩ = (−1)^(j₁+j₂−J) × the selected entry. Click an entry.',
    ST.layout==='pdg'?'The PDG’s layout: one table per M, a square root understood over every entry. Click an entry.':'The whole matrix ⟨m₁ m₂|J M⟩: rows bras, columns kets, block diagonal in M. Click an entry.',right-left,top+200);
  const b=box(left,top,right-left,L.capY-16-top);
  let pdgMiss='';
  if(ST.layout==='pdg'){ const r=drawPDG(ctx,b,M); if(r===true){ caption(ctx,left,L.capY,L.txt,L.capW,'#767e92',CAP_FONT); return; } pdgMiss=r; }
  const N=T.rows.length;
  /* label room decides the cell size, and the cell size decides which labels fit */
  let lw=0, th=0, cell=Math.min((b.w-10)/N,(b.h-10)/N);
  const rowLab=r=>'⟨'+hfs(r[0])+' '+hfs(r[1])+'|', colLab1=c=>hf(c[0]), colLab2=c=>hfs(c[1]);
  for(let pass=0;pass<3;pass++){
    lw=cell>=13?Math.max(...T.rows.map(r=>tw(ctx,rowLab(r),SMALL)))+8:44;
    th=cell>=24?34:18;
    const below=(cell<24?16:0)+(pdgMiss&&b.w-lw-N*cell<150?44:0);      /* the descriptor line and the PDG note go under the matrix */
    cell=Math.floor(Math.min((b.w-lw-4)/N,(b.h-th-4-below)/N,64));
  }
  const x0=b.x+lw, y0=b.y+th, S=cell*N;
  ctx.fillStyle='#0c1020'; ctx.fillRect(x0,y0,S,S);
  /* one font for every entry, the largest that fits the widest one, or none at all (a table with
     some entries printed and some not reads as a table with gaps) */
  const ents=[]; for(let i=0;i<N;i++) for(let k=0;k<N;k++){ const r=T.rows[i], c=T.cols[k]; if(r[0]+r[1]===c[1]){ const e=cgExact(q.tj1,r[0],q.tj2,r[1],c[0],c[1]); ents.push({i,k,e,t:cgText(e,ST.style)}); } }
  let fsz=0; for(let f=12;f>=8&&!fsz;f--){ const F=f+'px "SF Mono", Menlo, monospace'; if(f*1.15+2<=cell&&Math.max(...ents.map(x=>tw(ctx,x.t,F)))+4<=cell) fsz=f; }
  const EF=(fsz||8)+'px "SF Mono", Menlo, monospace';
  for(let i=0;i<N;i++) for(let k=0;k<N;k++){
    const v=T.U[i][k]; if(v===0) continue;
    ctx.fillStyle=sgnCol(v); ctx.fillRect(x0+k*cell+0.5,y0+i*cell+0.5,cell-1,cell-1);
  }
  /* entry text where it fits */
  const hidden=fsz?0:ents.length;
  if(fsz) for(const x of ents) tok(ctx,x0+x.k*cell+cell/2,y0+x.i*cell+cell/2,x.t,x.e.s?'#eef2f8':COL.faint,EF,'center');
  /* the M blocks */
  let r0=0;
  for(let tM=q.tj1+q.tj2;tM>=-(q.tj1+q.tj2);tM-=2){ const n=termsOf(q.tj1,q.tj2,tM).length;
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1.2; ctx.strokeRect(Math.round(x0+r0*cell)+0.5,Math.round(y0+r0*cell)+0.5,Math.round(n*cell),Math.round(n*cell)); r0+=n; }
  /* labels */
  if(cell>=13) T.rows.forEach((r,i)=>tok(ctx,x0-6,y0+i*cell+cell/2,rowLab(r),i===T.sel[0]?COL.live:'#8b93a6',SMALL,'right'));
  if(cell>=24) T.cols.forEach((c,k)=>{ tok(ctx,x0+k*cell+cell/2,y0-24,colLab1(c),k===T.sel[1]?COL.live:COL.jt,SMALL,'center'); tok(ctx,x0+k*cell+cell/2,y0-11,colLab2(c),k===T.sel[1]?COL.live:'#8b93a6',SMALL,'center'); });
  let ny=y0+S+11;
  if(cell<24){ for(const t of wrapText(ctx,(cell<13?'rows ⟨m₁ m₂|, ':'')+'columns |J M⟩: M descending, J descending within each M',b.x1-x0,SMALL)){ tok(ctx,x0,ny,t,COL.dim,SMALL); ny+=14; } }
  if(cell>=24){ tok(ctx,x0-6,y0-24,'J',COL.jt,SMALL,'right'); tok(ctx,x0-6,y0-11,'M',COL.dim,SMALL,'right'); }
  /* the selection, its flip partner */
  const sr=T.sel[0], sk=T.sel[1];
  /* drawn just outside the cell, so the entry's text is never under the stroke */
  ctx.strokeStyle=COL.live; ctx.lineWidth=2; ctx.strokeRect(x0+sk*cell-1,y0+sr*cell-1,cell+2,cell+2);
  if(T.flip[0]>=0&&(T.flip[0]!==sr||T.flip[1]!==sk)){ ctx.setLineDash([4,3]); ctx.lineWidth=1.4; ctx.strokeRect(x0+T.flip[1]*cell-1,y0+T.flip[0]*cell-1,cell+2,cell+2); ctx.setLineDash([]); }
  for(let i=0;i<N;i++) for(let k=0;k<N;k++) HIT.push({kind:'cell',r:T.rows[i],c:T.cols[k],b:box(x0+k*cell,y0+i*cell,cell,cell)});
  /* the note beside the matrix (below the readout's height, never under it) */
  const nx=x0+S+24, nw=b.x1-nx;
  const note=(pdgMiss?pdgMiss+' ':'')+(hidden?hidden+' entries are too small to print (click one to read it). ':'Every entry is printed. ')+'The PDG table is this matrix cut into its M blocks and printed with the square roots left out.';
  if(nw>=150){ const ls=wrapText(ctx,note,nw,SMALL); ls.forEach((t,i)=>tok(ctx,nx,y0+S-ls.length*14+7+i*14,t,pdgMiss&&i===0?COL.ref:'#6f7789',SMALL)); }
  else if(pdgMiss){ const ls=wrapText(ctx,pdgMiss,b.w,SMALL); ls.forEach((t,i)=>tok(ctx,b.x,ny+i*14,t,COL.ref,SMALL)); }
  caption(ctx,left,L.capY,L.txt,L.capW,'#767e92',CAP_FONT);
}
/* the PDG layout: each M block its own small table, J and M on top, m1 m2 on the left, stepping down to the right */
function drawPDG(ctx,b,M){
  const T=M.T, q=M.q, blocks=[];
  for(let tM=q.tj1+q.tj2;tM>=-(q.tj1+q.tj2);tM-=2) blocks.push({tM,ms:termsOf(q.tj1,q.tj2,tM),Js:Jvalues(q.tj1,q.tj2).filter(tJ=>tJ>=Math.abs(tM))});
  /* the PDG's own convention (a square root understood) unless decimals are asked for: √ written out never fits the staircase */
  const sty=ST.style==='dec'?'dec':'pdg', nRows=blocks.reduce((s,bl)=>s+bl.ms.length,0), nCols=blocks.reduce((s,bl)=>s+bl.Js.length,0);
  /* the largest font whose staircase fits the box: 14 px down to 10 */
  let EF, cw, lab, hh, ch, totW, totH, fit=false;
  for(let f=14;f>=10&&!fit;f--){
    EF=f+'px "SF Mono", Menlo, monospace'; cw=0;
    for(const bl of blocks) for(const tm1 of bl.ms) for(const tJ of bl.Js) cw=Math.max(cw,tw(ctx,cgText(cgExact(q.tj1,tm1,q.tj2,bl.tM-tm1,tJ,bl.tM),sty),EF)+8);
    cw=Math.max(cw,f*3); lab=tw(ctx,'+3/2 +3/2',EF)+10; hh=Math.round(f*2.8); ch=Math.round(f*1.6);
    totW=lab+cw*nCols; totH=26+blocks.length*hh+ch*nRows; fit=totW<=b.w&&totH<=b.h;
  }
  if(!fit) return 'PDG blocks need '+Math.round(totW)+' × '+Math.round(totH)+' px here, so the whole matrix is shown.';
  let x=b.x+Math.max(0,(b.w-totW)/2), y=b.y+26;
  tok(ctx,b.x,b.y+6,hf(q.tj1)+' × '+hf(q.tj2),'#aeb6c6','italic 16px Georgia, serif');
  for(const bl of blocks){
    const bw=lab+cw*bl.Js.length, bh=hh+ch*bl.ms.length;
    ctx.fillStyle='#0c1020'; ctx.fillRect(x,y,bw,bh);
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1; ctx.strokeRect(Math.round(x)+0.5,Math.round(y)+0.5,Math.round(bw),Math.round(bh));
    const fz=parseFloat(EF); bl.Js.forEach((tJ,k)=>{ tok(ctx,x+lab+cw*(k+0.5),y+fz*0.85,hf(tJ),COL.jt,EF,'center'); tok(ctx,x+lab+cw*(k+0.5),y+fz*2.05,hfs(bl.tM),'#8b93a6',EF,'center'); });
    bl.ms.forEach((tm1,i)=>{
      const yy=y+hh+ch*(i+0.5), selR=bl.tM===q.tM&&tm1===q.tm1;
      tok(ctx,x+6,yy,hfs(tm1)+' '+hfs(bl.tM-tm1),selR?COL.live:'#9aa2b4',EF);
      bl.Js.forEach((tJ,k)=>{ const e=cgExact(q.tj1,tm1,q.tj2,bl.tM-tm1,tJ,bl.tM), sel=selR&&tJ===q.tJ;
        const cx=x+lab+cw*k;
        ctx.fillStyle=sgnCol(cgv(e)); ctx.fillRect(cx+1,y+hh+ch*i+1,cw-2,ch-2);
        tok(ctx,cx+cw/2,yy,cgText(e,sty),e.s?'#eef2f8':COL.faint,EF,'center');
        if(sel){ ctx.strokeStyle=COL.live; ctx.lineWidth=1.8; ctx.strokeRect(cx+1,y+hh+ch*i+1,cw-2,ch-2); }
        HIT.push({kind:'cell',r:[tm1,bl.tM-tm1],c:[tJ,bl.tM],b:box(cx,y+hh+ch*i,cw,ch)}); });
    });
    x+=lab+cw*bl.Js.length-lab; y+=bh;
  }
  return true;
}


/* ================================ the ladder ================================ */
/* sqrt(k) for a whole k, simplified: 4 -> "2", 12 -> "2√3" */
function surdInt(k){ let a=1, r=k; for(let f=2;f*f<=r;f++) while(r%(f*f)===0){ r/=f*f; a*=f; } return r===1?String(a):(a===1?'':String(a))+'√'+r; }
function exactRaw(step,i,q){
  /* the unnormalised J−|J, M+1> component = sqrt((J+M+1)(J−M)) x the new coefficient, exactly */
  const c=cgExact(q.tj1,step.ms[i],q.tj2,step.tM-step.ms[i],step.tJ,step.tM);
  if(!c.s) return CG0;
  const k=BigInt((step.tJ+step.tM+2)*(step.tJ-step.tM)/4);
  const r=ratNorm(c.n*k,c.d); return {s:c.s,n:r[0],d:r[1]};
}
/* the algebra of one step, as lines of prose and typeset sums; measured (dry) or drawn */
function ladderAlgebra(ctx,x,y,w,M,narrow,dry){
  const Ld=M.L, q=M.q, s=Ld.s, fs=narrow?13:15;
  const kets=(tM,tm1)=>ketTokens(q,tm1,tM-tm1);
  let yy=y;
  const prose=t=>{ const ls=wrapText(ctx,t,w,SMALL); if(!dry) ls.forEach((l,i)=>tok(ctx,x,yy+7+i*14,l,COL.dim,SMALL)); yy+=ls.length*14+4; };
  const sum=(lhs,terms,f,tail)=>{ const r=typesetSum(ctx,x,yy,w,lhs,terms,{fs:f||fs,labels:false,dry,tail}); yy+=r.h+4; };
  const stepNo='Step '+(Ld.k+1)+' of '+Ld.n+'. ';

function vmGeometry(V,t){

/* ============================ atoms in a field ============================ */

function fieldLimit(F){ return memo('flim',F.sys+','+F.f.fF+','+F.f.fM,()=>fieldLevels(F.sy,1e6*F.B0).find(l=>l.tF===F.f.fF&&l.tM===F.f.fM)); }

/* ================================ rotations ================================ */
function heat(ctx,x,y,cell,Mx){
  const N=Mx.length;
  ctx.fillStyle='#0c1020'; ctx.fillRect(x,y,cell*N,cell*N);
  for(let i=0;i<N;i++) for(let k=0;k<N;k++){ const v=Mx[i][k]; if(Math.abs(v)<1e-12) continue; ctx.fillStyle=sgnCol(v); ctx.fillRect(x+k*cell,y+i*cell,Math.max(1,cell-(cell>6?1:0)),Math.max(1,cell-(cell>6?1:0))); }
}
function drawRot(ctx,W,H,M){
  const R=M.R, q=M.q, C=R.R, N=C.N, narrow=isNarrow(W);

  const L=fitCaption(ctx,W,H,
    'A rotation by β about y, three ways. Left: in the product basis, where every product ket turns into a mixture of all the others: d(j₁) ⊗ d(j₂) is full. Middle: the Clebsch–Gordan matrix, columns grouped by J. Right: the same rotation in the coupled basis, Uᵀ(d ⊗ d)U, which is zero outside the J blocks (cyan), and each block is dᴶ(β) itself. So a rotation never changes J; below, the J content of a product ket is the same after the rotation as before, and a coupled ket stays inside its own multiplet.',
    'd(j₁) ⊗ d(j₂) in the product basis, the Clebsch–Gordan matrix, and the block-diagonal rotation in the coupled basis.',right-left,top+200);
  const availH=L.capY-16-top, topH=Math.floor(availH*(narrow?1:0.6));

  const xs=[0,1,2].map(i=>left+i*(S+gap)), y0=top+30;
  const titles=['⟨m₁′ m₂′|R|m₁ m₂⟩ = d(j₁) ⊗ d(j₂)','⟨m₁ m₂|J M⟩','⟨J′ M′|R|J M⟩ = UᵀRU'], shortT=['product basis','U','coupled basis'];
  const mats=[C.K,C.U,C.B];
  for(let i=0;i<nH;i++){ const idx=narrow?2:i;
    tok(ctx,xs[i],y0-12,tw(ctx,titles[idx],'italic 13px Georgia, serif')<=S+gap-8?titles[idx]:shortT[idx],'#aeb6c6','italic 13px Georgia, serif');
    heat(ctx,xs[i],y0,cell,mats[idx]);
    ctx.strokeStyle='#242a3a'; ctx.lineWidth=1; ctx.strokeRect(xs[i]+0.5,y0+0.5,S,S);
    if(idx>=1){ /* the J groups */ ctx.strokeStyle=COL.struct; ctx.lineWidth=1.1;
      for(const bl of C.blocks){ const a=bl.off*cell, w2=(bl.tJ+1)*cell;

        else { ctx.beginPath(); ctx.moveTo(xs[i]+a+0.5,y0); ctx.lineTo(xs[i]+a+0.5,y0+S); ctx.stroke(); } }
      if(idx===2&&cell*(C.blocks[C.blocks.length-1].tJ+1)>=16) for(const bl of C.blocks) if((bl.tJ+1)*cell>=18) tok(ctx,xs[i]+(bl.off+bl.tJ+1)*cell+3,y0+bl.off*cell+8,'J='+hf(bl.tJ),COL.struct,SMALL); }
  }
  if(!narrow){ const yb=y0+S+44, hb=L.capY-16-yb-26, bw=(right-left-gap)/2;
    if(hb>=70){
      const bb1=box(left+30,yb,bw-30,hb), bb2=box(left+bw+gap+30,yb,bw-30,hb);
      const labs=R.pJ.map(p=>'J='+hf(p.tJ));
      barPanel(ctx,bb1,R.pJ.map(p=>p.after),labs,0,1,titleFor(bb1,'|'+hfs(q.tm1)+'⟩|'+hfs(q.tm2)+'⟩ rotated: its weight on each |J M′⟩, by J (ticks: before)','rotated, by J (ticks: before)'),R.pJ.map(()=>mix(COL.off,COL.pos,0.75)));
      /* inside each bar, the rotated ket's share of every M' (alternating shades): the

      R.pJ.forEach((p,i)=>{ let acc=0; p.amps.forEach((am,k)=>{ const w=am.a*am.a; if(w<1e-9){ acc+=w; return; }
          const y0=bb1.y1-bb1.h*acc, y1=bb1.y1-bb1.h*(acc+w); ctx.fillStyle=k%2?mix(COL.off,COL.pos,0.55):mix(COL.off,COL.pos,0.9);
          ctx.fillRect(bb1.x+bwJ*i+bwJ*0.2,y1,bwJ*0.6,Math.max(1,y0-y1-0.5)); acc+=w; });
        const yy=bb1.y1-bb1.h*p.before; ctx.strokeStyle=COL.ref; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(bb1.x+bwJ*(i+0.12),yy); ctx.lineTo(bb1.x+bwJ*(i+0.88),yy); ctx.stroke(); });
      barPanel(ctx,bb2,R.col.map(c=>c.v),R.col.map(c=>hfs(c.tMp)),-1,1,titleFor(bb2,'R|'+hf(q.tJ)+', '+hfs(q.tM)+'⟩ = Σ dᴶ(M′, M) |'+hf(q.tJ)+', M′⟩','R|J M⟩ over M′'));
    } }
  caption(ctx,left,L.capY,L.txt,L.capW,'#767e92',CAP_FONT);
}

/* ================================ dispatch ================================ */
/* axes with every tick label and both titles in the label registry (standard_model's axesT) */
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  const o=opt||{}, reg=(x0,y0,x1,y1)=>LABELS.push([x0,y0,x1,y1]);
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6), yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);

  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1); if(Y<b.y-0.5||Y>b.y1+0.5) continue; const s=o.yfmt?o.yfmt(t):fmt(t,2), w=s.length*10.5*0.52; reg(b.x-6-w,Y-6,b.x-6,Y+6); }
  if(o.xlab){ const w=plain(o.xlab).length*11*0.52; reg(b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+34); }
  if(o.title){ const w=plain(o.title).length*13*0.52; reg(b.x,b.y-9-15,b.x+w,b.y-9); }
}
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; HIT=[]; W_STAGE=W; H_STAGE=H;
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='ket') drawKet(ctx,W,H,M);
  else if(M.view==='table') drawTable(ctx,W,H,M);
  else if(M.view==='ladder') drawLadder(ctx,W,H,M);
  else if(M.view==='vector') drawVector(ctx,W,H,M);
  else if(M.view==='field') drawField(ctx,W,H,M);

function camKeys(view){ return view==='vector'?['camTheta','camPhi']:null; }
/* the field plot: x sets B, and a press picks the level nearest the pointer at that B */
function fieldFromX(h,x){ return clamp(LIM.xBMax*(x-h.b.x)/h.b.w,0,LIM.xBMax); }
function pickLevel(h,x,y){
  const F=fieldModel(ST), [ylo,yhi]=fieldRange(F.sys), xB=fieldFromX(h,x), L=fieldLevels(F.sy,xB*F.B0);
  let best=null, bd=Infinity;
  for(const l of L){ const Y=h.b.y1-h.b.h*(l.E-ylo)/(yhi-ylo), d=Math.abs(Y-y); if(d<bd){ bd=d; best=l; } }
  return best;
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return runStep(ST); };
  S.pointer=function(type,x,y){
    if(type==='up'){ const was=DRAG.what; DRAG.what=null; return was==='field'; }   /* the field drag ends with a full refresh */
    if(type==='down'){
      const hit=hitAt(x,y);
      if(hit&&hit.kind==='term'){ const K=buildModel().K; if(!K) return false; const t=K.terms[hit.i]; if(!t) return false;
        if(K.dir==='coupled') ST.tm1=t.tm1; else ST.tJ=t.tJ; return true; }
      if(hit&&hit.kind==='cell'){ ST.tm1=hit.r[0]; ST.tM=hit.r[0]+hit.r[1]; ST.tJ=hit.c[0]; return true; }
      if(hit&&hit.kind==='field'){ const l=pickLevel(hit,x,y); ST.xB=fieldFromX(hit,x); if(l){ ST.fF=l.tF; ST.fM=l.tM; } DRAG.what='field'; DRAG.hit=hit; return true; }
      const keys=camKeys(ST.view); if(!keys) return false;
      DRAG.what='cam'; DRAG.x=x; DRAG.y=y; DRAG.th=ST[keys[0]]; DRAG.ph=ST[keys[1]];
      return true;
    }
    if(type==='move'){
      if(DRAG.what==='field'){ const nx=fieldFromX(DRAG.hit,x); if(nx===ST.xB) return false; ST.xB=nx; return true; }
      if(DRAG.what==='cam'){ const keys=camKeys(ST.view); ST[keys[0]]=DRAG.th-(x-DRAG.x)*0.008; ST[keys[1]]=clamp(DRAG.ph+(y-DRAG.y)*0.008,-1.45,1.45); return true; }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){

  const hintEl=document.getElementById('hint');

  function setView(k){

    syncChips(); syncPanel(); dirty=true; refresh();
  }

  const rows={};

      if(onchg) onchg(); syncChips(); syncPanel(); dirty=true; refresh(); });

  }
  function checkbox(key,lab,onchg){

    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });

  }
  const CHIPROWS=[];

      st[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }})); });

  }

  }

    h('button',{onclick:()=>{ st.play=false; st.step=Math.min(ladderFor(normQ(st)).length-1,st.step+1); syncPanel(); dirty=true; refresh(); }},'next'),

      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),

  const gPhys=h('div',{class:'grp'},h('h3',null,'the calculation'),h('div',{id:'phys'}));
  [gQ,gStyle,gKet,gTable,gLad,gVec,gAtom,gRot,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncPanel(){
    const v=st.view, q=normQ(st);
    Object.assign(st,{tj1:q.tj1,tj2:q.tj2,tJ:q.tJ,tM:q.tM,tm1:q.tm1});
    const f=normField(st); st.sys=f.sys; st.fF=f.fF; st.fM=f.fM;
    const n=ladderFor(q).length; st.step=clamp(Math.round(st.step),0,n-1);

    rm1.set(termsOf(q.tj1,q.tj2,q.tM),hfs);

    ketTag.innerHTML=(bornN(ketModel(st,q))?bornN(ketModel(st,q))+' outcomes so far':'no outcomes yet')+' &middot; seed '+BORN_SEED;
    atomTag.innerHTML=f.sy.name+': '+f.sy.lab1+' = '+hf(f.sy.tj1)+', '+f.sy.lab2+' = '+hf(f.sy.tj2)+' &middot; B&#8320; = '+fieldBtext(sysB0(f.sy),f.sy);
    keysTag.innerHTML='1&ndash;6 switch views &nbsp; space starts and stops the motion &nbsp; <b>r</b> restarts the clock';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      const v=st.view;
      hintEl.textContent=v==='ket'?'click a term to select it · 1–6 switch views'
        :v==='table'?'click an entry · 1–6 switch views'
        :v==='field'?'drag on the diagram to set B · press on a level to pick it · 1–6 switch views'
        :v==='vector'?'drag to turn the view · space stops the precession · 1–6 switch views'
        :v==='ladder'?'next / back step the construction · space plays it · 1–6 switch views':'space turns the rotation · 1–6 switch views';
      infoEl.innerHTML=INFO[v]||'';
      physEl.innerHTML=DERIV[v]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); syncChips(); syncPanel(); dirty=true; refresh(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); tagEl.innerHTML=tagHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault();
      if(st.view==='vector') st.prec=!st.prec; else if(st.view==='rot') st.turn=!st.turn; else if(st.view==='ladder') st.play=!st.play;
      syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ simReset(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw();
        /* the ladder's play and the turning rotation move a slider: keep it, the readout and the tag in step */
        if(advanced&&(st.view==='ladder'||st.view==='rot')){ rows.step.sync(); rows.beta.sync(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

  const na=SYSTEMS.Na, cs=SYSTEMS.Cs, rb=SYSTEMS.Rb, hy=SYSTEMS.H;
  let ladWorst=0; for(let a=0;a<=8;a++) for(let b=0;b<=8;b++) for(const s of ladderSteps(a,b)) s.ms.forEach((tm1,i)=>{ ladWorst=Math.max(ladWorst,Math.abs(s.v[i]-cg(a,tm1,b,s.tM-tm1,s.tJ,s.tM))); });
  const rot=rotModelCore(q.tj1,q.tj2,DEFAULTS.beta*DEG);
  return {q,terms,mo,dim:(q.tj1+1)*(q.tj2+1),Js:Jvalues(q.tj1,q.tj2),D1:Ds[0],D16:Ds[VM_NMAX-1],Dst1:Dst[0],DstMin:Math.min(...Dst),
    naG12:gProj(na,1),naG32:gProj(na,3),csK:clockK(cs),rbK:clockK(rb),hK:clockK(hy),csB0:sysB0(cs),hB0:sysB0(hy),naB0:sysB0(na),ladWorst,rotOff:rot.offMax};
})();

function nSig(k){ return k===1?'once':k===2?'twice':k+' times'; }
const INFO={
  ket:'Two angular momenta can be described in two complete bases. The product basis |j₁ m₁⟩|j₂ m₂⟩ gives each partner a definite z component; the coupled basis |J M⟩ gives the pair a definite total J² and Jz instead. '

    +'Their squares are probabilities. Measure J₁z and J₂z on |3/2, +1/2⟩ and you find (+3/2, −1) with probability '+fracTxt(PX.terms[0])+', (+1/2, 0) with '+fracTxt(PX.terms[1])+' and (−1/2, +1) with '+fracTxt(PX.terms[2])+'. '

  table:'All the coefficients of one pair form a square matrix: rows labelled by the bras ⟨m₁ m₂| of the product basis, columns by the kets |J M⟩ of the coupled basis, each entry the bracket of its row with its column. '
    +'Because both bases are orthonormal the matrix is orthogonal: its columns are the coupled kets written in the product basis, its rows the product kets written in the coupled basis. M = m₁ + m₂ makes it block diagonal, one block for each M. '
    +'The table printed in every Review of Particle Physics is exactly these blocks with the square roots left off: −8/15 there means −√(8/15). '+REF.cg.pdg_entries_checked+' entries read from the PDG 2026 page agree with the values here. '
    +'Three symmetries relate the entries. Swapping the partners multiplies by (−1)^(j₁+j₂−J), and so does reversing every m (the dashed box); and ⟨j₁ m₁; j₂ m₂|J M⟩ = (−1)^(j₁−m₁) √((2J+1)/(2j₂+1)) ⟨j₁ m₁; J −M|j₂ −m₂⟩. '

  ladder:'How are the numbers found? M = j₁ + j₂ is reached by one product ket only, |j₁ j₁⟩|j₂ j₂⟩, and no coupled ket can have a larger M, so that ket is the top of the multiplet J = j₁ + j₂. '
    +'Lowering it with J₋ = J₁₋ + J₂₋ moves every product ket one step left or down on the lattice, while on the coupled side J₋|J M⟩ = √((J+M)(J−M+1)) |J, M−1⟩: dividing by that factor gives the next state, all the way to M = −J. '
    +'The next line of constant M holds one product ket more than the multiplets built so far can use. The leftover direction, orthogonal to all of them, is the top of the next J down; it is fixed up to a sign, and the Condon–Shortley rule takes ⟨j₁ j₁; j₂ J−j₁|J J⟩ positive. '
    +'Counting kets along the lines gives 1, 2, 3, … up to 2·min(j₁, j₂) + 1 and back down, which is why J runs from j₁ + j₂ to |j₁ − j₂| in steps of one: for 3/2 ⊗ 1 that is '+PX.Js.map(hf).join(', ')+', and '+PX.Js.map(t=>t+1).join(' + ')+' = '+PX.dim+'. '
    +'The construction here is done in ordinary floating point and never looks at the Racah formula; for every pair up to 4 ⊗ 4 it lands within '+fmt(PX.ladWorst*1e14,0)+' × 10⁻¹⁴ of the exact values.',
  vector:'The vector model is the classical picture behind the bra–kets. In |J M⟩ the total angular momentum has length √(J(J+1)) and projection M, so it lies on a cone about z. J₁ and J₂ have fixed lengths and a fixed angle to J, set by the triangle J = J₁ + J₂, so they precess on cones about J. '

    +'For sodium’s 3p level, where the partners are the orbit L = 1 and the spin S = 1/2, that average with Steck’s g<sub>L</sub> and g<sub>S</sub> gives '+fmt(PX.naG12,5)+' for J = 1/2 and '+fmt(PX.naG32,5)+' for J = 3/2, against the measured '+DATA.Na_gJ_P12.text+'('+Math.round(DATA.Na_gJ_P12_u.value*1e5)+') and '+DATA.Na_gJ_P32.text+'('+Math.round(DATA.Na_gJ_P32_u.value*1e5)+'). '
    +'The M = 0 pair of caesium-133 is the transition that defines the second. It has no linear shift, only a quadratic one, '+fmt(PX.csK,2)+' Hz per gauss², which is what Steck prints ('+DATA.Cs_clock.text+'); for hydrogen’s 21-cm line it is '+fmt(PX.hK,0)+' Hz/G². B₀ marks where the Zeeman energy equals the zero-field splitting: '+fmt(PX.hB0*1e4,0)+' G for hydrogen, '+fmt(PX.csB0*1e4,0)+' G for caesium, and '+fmt(PX.naB0,1)+' T for sodium’s 3p, where the coupling is the far larger fine structure.',
  rot:'Why do the coefficients exist at all? A rotation acts on each partner with its own Wigner matrix d^j(β), so on the pair it acts with the Kronecker product d(j₁) ⊗ d(j₂), a full square matrix that mixes every product ket with every other. '
    +'In the coupled basis the same rotation falls apart into blocks, one d^J(β) for each J: Uᵀ[d(j₁) ⊗ d(j₂)]U = d(j₁ + j₂) ⊕ … ⊕ d(|j₁ − j₂|). That is the Clebsch–Gordan series, and the matrix U that does it is the table of coefficients. '

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

    for(const s of ['(12 for 3/2 ⊗ 1)','with probability 2/5','(+1/2, 0) with 1/15','(−1/2, +1) with 8/15']) has(I.ket,s,'ket prose');
    for(const s of ['141 entries read from the PDG 2026 page','−8/15 there means −√(8/15)']) has(I.table,s,'table prose');
    for(const s of ['that is 5/2, 3/2, 1/2, and 6 + 4 + 2 = 12','within 3 × 10⁻¹⁴']) has(I.ladder,s,'ladder prose');
    close(PX.ladWorst,3.0e-14,0.6e-14,'the quoted ladder accuracy (3 × 10⁻¹⁴)');
    for(const s of ['that is 11/30','exactly 11/30 too','falls from 0.126 at n = 1 to 0.031 at n = 16','never gets below 0.067']) has(I.vector,s,'vector prose');
    close(PX.D1,REF.vm.cases['3,2,3,1 x1'].D,1e-12,'quoted D at 1'); close(PX.D16,REF.vm.cases['3,2,3,1 x16'].D,1e-12,'quoted D at 16');
    close(PX.DstMin,Math.min(...[1,2,3,4,6,8,12,16].map(n=>REF.vm.cases['2,1,3,1 x'+n].D)),0.0005,'quoted floor of the stretched state');
    for(const s of ['gives 0.66586 for J = 1/2 and 1.33409 for J = 3/2','measured 0.66581(12) and 1.33420(20)','427.45 Hz per gauss²','Steck prints (427.45)','it is 2773 Hz/G²','506 G for hydrogen','3279 G for caesium','36.7 T for sodium']) has(I.field,s,'field prose');
    for(const s of ['At β = 50° for 3/2 ⊗ 1','is rounding']) has(I.rot,s,'rotation prose');
    has(D.ket,'all 504 nonzero entries','ket derivation'); has(D.ket,'all 7649 up to 4','ket derivation fingerprint'); has(D.table,'141 read from the PDG 2026 table','table derivation');
    for(const v in INFO) ok(!/NaN|undefined|Infinity/.test(INFO[v]+DERIV[v]),v+' prose has no NaN'); }

  /* ---------- K. the models and the readouts ---------- */
  withState({view:'ket'},()=>{ const s=readoutHTML(buildModel()); has(s,'>11/30<','⟨J1z⟩ in the readout'); has(s,'3/2 &otimes; 1','the pair');
    has(s,'v good">1<','the column sums to 1 exactly'); has(s,'1/2, 3/2, 5/2','the J values'); has(s,'&minus;√(8/15) = −0.7303','the selected term, the PDG example');
    has(s,'>&minus;1<','⟨J1·J2⟩ = −1'); has(s,'8/15 = 0.5333','its probability'); });
  withState({view:'ket'},()=>{ const K=buildModel().K; eq(K.terms.length,3,'three terms'); eq(K.sel,2,'the selected term is m1 = −1/2'); ok(K.j1j2[0]===-1n&&K.j1j2[1]===1n,'⟨J1·J2⟩ = [15/4 − 15/4 − 2]/2 = −1 in |3/2 1/2⟩ of 3/2 x 1'); });
  withState({view:'ket',dir:'product',tm1:3},()=>{ const K=buildModel().K; eq(K.terms.map(t=>t.tJ).join(),'5,3,1','a product ket holds J = 5/2, 3/2, 1/2'); eq(K.sel,1,'J = 3/2 selected');
    has(readoutHTML(buildModel()),'the product ket |+3/2&rang;|−1&rang;','the readout names it'); });
  withState({view:'table'},()=>{ const s=readoutHTML(buildModel()); has(s,'the 12 &times; 12 matrix','the size'); has(s,'nonzero entries','the count'); has(s,'&minus;8/15','the PDG form of the selection');
    const T=buildModel().T; eq(T.nz,1+4+9+9+4+1,'3/2 x 1: all 28 entries inside the blocks are nonzero'); eq(T.sel.join(),'5,4','the selected cell: row 5, column 4');
    eq(T.flip.join(),'6,7','its flip partner: row 6, column 7'); });
  withState({view:'ladder',step:6},()=>{ const L=buildModel().L; eq(L.s.kind,'ortho','step 7 of 3/2 x 1 starts J = 3/2'); eq(L.s.tJ,3,'J = 3/2'); ok(L.maxErr<1e-14,'and it matches Racah'); has(readoutHTML(buildModel()),'a new top, by orthogonality','the readout says so'); });
  withState({view:'vector',scale:16},()=>{ const V=buildModel().V; eq(V.s.tj1,48,'×16 scales j1'); close(V.D[15],V.D[V.n-1],0,'the series holds the current n'); has(readoutHTML(buildModel()),'&times; 16','the readout shows the scale'); });
  withState({view:'field',sys:'Cs',fF:8,fM:0,xB:0},()=>{ const F=buildModel().F; close(F.sel.E,sysSplit(SYSTEMS.Cs)*7/16,1e-9,'Cs F = 4 at zero field sits 7/16 of the splitting up'); eq(F.gCG,null,'no g for M = 0'); has(readoutHTML(buildModel()),'427.45','the clock shift in the readout'); });
  withState({view:'field',sys:'Na',fF:3,fM:1,xB:1},()=>{ const s=readoutHTML(buildModel()); has(s,'0.66581(12)','the measured g of 3p1/2'); has(s,'1.33420(20)','and 3p3/2'); has(s,'T','tesla for sodium'); });
  withState({view:'rot'},()=>{ const s=readoutHTML(buildModel()); has(s,'12 &times; 12','the size'); has(s,'P(J) of |−1/2&rang;|+1&rang;','the product ket'); });
  withState({},()=>{ for(const v of TABS){ ST.view=v[0]; const M=buildModel(); ok(eqbarHTML(M).length>100&&!/NaN|undefined/.test(readoutHTML(M)+eqbarHTML(M)+tagHTML(M)),v[0]+' readout, bar and tag are clean'); } });
  { let longest=''; for(const v of TABS) for(const over of [{},{tj1:8,tj2:8,tJ:8,tM:0},{sys:'Cs',fF:8,fM:0},{dir:'product'}]) withState(Object.assign({view:v[0]},over),()=>{
      const s=readoutHTML(buildModel()); const re=/<tr><td>(.*?)<\/td>/g; let m; while((m=re.exec(s))) if(plain(m[1]).length>longest.length) longest=plain(m[1]); });
    ok(longest.length<=34,'every readout label fits ("'+longest+'", '+longest.length+')'); }

  /* ---------- L. the pointer ---------- */
  withState({view:'ket'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='term'&&x.i===0); ok(!!h,'terms are clickable'); if(h){ ok(S.pointer('down',h.b.x+4,h.b.y+6),'a click on the first term'); eq(ST.tm1,3,'selects m1 = +3/2'); S.pointer('up',0,0); } });
  withState({view:'ket',dir:'product',tm1:3},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='term'&&x.i===2); ok(!!h,'product terms are clickable'); if(h){ S.pointer('down',h.b.x+4,h.b.y+6); eq(ST.tJ,1,'in a product expansion a click picks J'); S.pointer('up',0,0); } });
  withState({view:'table'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='cell'&&x.r[0]===1&&x.r[1]===0&&x.c[0]===3&&x.c[1]===1); ok(!!h,'the cell ⟨+1/2 0|3/2 +1/2⟩ exists');
    if(h){ ok(S.pointer('down',h.b.x+h.b.w/2,h.b.y+h.b.h/2),'a click on it'); ok(ST.tm1===1&&ST.tM===1&&ST.tJ===3,'selects (J, M, m1) = (3/2, 1/2, 1/2)'); } });
  withState({view:'table',layout:'pdg'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='cell'&&x.r[0]===-3&&x.c[0]===5&&x.c[1]===-3); ok(!!h,'the PDG layout is clickable too'); if(h){ S.pointer('down',h.b.x+2,h.b.y+2); ok(ST.tJ===5&&ST.tM===-3&&ST.tm1===-3,'and selects'); } });
  withState({view:'field',sys:'H'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    const h=HIT.find(x=>x.kind==='field'), F=fieldModel(ST), [ylo,yhi]=fieldRange('H');
    const lv=fieldLevels(SYSTEMS.H,2*F.B0).find(l=>l.tF===2&&l.tM===-2), Y=h.b.y1-h.b.h*(lv.E-ylo)/(yhi-ylo);
    ok(S.pointer('down',h.b.x+h.b.w*2/3,Y),'a press on the diagram'); close(ST.xB,2,1e-9,'sets B = 2 B0'); ok(ST.fF===2&&ST.fM===-2,'and picks the level under the pointer (F = 1, M = −1)');
    ok(S.pointer('move',h.b.x+h.b.w/3,Y),'dragging'); close(ST.xB,1,1e-9,'moves B'); ok(ST.fF===2&&ST.fM===-2,'but keeps the level'); ok(S.pointer('up',0,0),'release refreshes'); });
  withState({view:'vector'},()=>{ const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; S.draw();
    ok(S.pointer('down',300,300),'the vector view grabs the camera'); ok(S.pointer('move',360,300),'a drag'); ok(ST.camTheta<DEFAULTS.camTheta&&ST.camPhi===DEFAULTS.camPhi,'turns only the azimuth');
    S.pointer('move',360,400); ok(ST.camPhi>DEFAULTS.camPhi,'a vertical drag raises it'); S.pointer('move',360,4000); ok(ST.camPhi===1.45,'clamped at 1.45'); ok(!S.pointer('up',0,0),'release'); });
  withState({view:'rot'},()=>{ const S=makeScene({getContext:()=>makeShot(1100,700)}); S.W=1100; S.H=700; S.draw(); ok(!S.pointer('down',500,300),'the rotation view has nothing to drag'); });
  /* the clock */
  withState({view:'rot',turn:true,frames:10},()=>{ close(ST.beta,DEFAULTS.beta+10*60*frameDt(ST),1e-9,'turning advances β at 60°/unit'); });
  withState({view:'rot',turn:true,beta:179.9,frames:3},()=>{ ok(ST.beta<-170,'β wraps past 180°'); });
  withState({view:'ladder',play:true,frames:18},()=>{ eq(ST.step,1,'play: one step per 0.2 units of clock (18 frames at speed 3)'); });
  withState({view:'ladder',play:true,step:11,frames:18},()=>{ eq(ST.step,0,'and wraps to the start'); });
  withState({view:'vector',prec:false,frames:5},()=>{ eq(SIM.t,0,'no precession, no clock'); });
  withState({view:'ket',frames:5},()=>{ eq(SIM.t,0,'the ket view is still'); });

  /* ---------- M. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['ket',{view:'ket'},6],['ket product',{view:'ket',dir:'product',tm1:3},6],['ket spins',{view:'ket',tj1:1,tj2:1,tJ:0,tM:0,tm1:1},4],['ket pp zero',{view:'ket',tj1:2,tj2:2,tJ:2,tM:0,tm1:0,style:'pdg'},4],
    ['ket 4x4 nine',{view:'ket',tj1:8,tj2:8,tJ:8,tM:0,tm1:0,style:'dec'},8],['ket 4x4 top',{view:'ket',tj1:8,tj2:8,tJ:16,tM:16,tm1:8},3],['ket 0x0',{view:'ket',tj1:0,tj2:0,tJ:0,tM:0,tm1:0},2],
    ['ket measured',{view:'ket',measure:1000},6],['ket product measured',{view:'ket',dir:'product',tj1:8,tj2:7,tM:1,tJ:15,tm1:0,measure:100},6],
    ['table',{view:'table'},30],['table 4x4',{view:'table',tj1:8,tj2:8,tJ:8,tM:0,tm1:0},200],['table spins pdg',{view:'table',tj1:1,tj2:1,tJ:0,tM:0,tm1:1,layout:'pdg'},4],
    ['table 2x2 pdg',{view:'table',tj1:4,tj2:4,tJ:4,tM:0,tm1:0,layout:'pdg',style:'root'},30],['table 4x4 pdg',{view:'table',tj1:8,tj2:8,tJ:4,tM:2,tm1:2,layout:'pdg'},200],
    ['table 0x3 dec',{view:'table',tj1:0,tj2:6,tJ:6,tM:-2,tm1:0,style:'dec'},6],['table 5/2x2',{view:'table',tj1:5,tj2:4,tJ:5,tM:1,tm1:1},30],
    ['ladder 0',{view:'ladder',step:0},10],['ladder 1',{view:'ladder',step:1},10],['ladder ortho',{view:'ladder',step:6},10],['ladder last',{view:'ladder',step:11},10],
    ['ladder 4x4',{view:'ladder',tj1:8,tj2:8,tJ:8,tM:0,tm1:0,step:40},30],['ladder 4x4 ortho',{view:'ladder',tj1:8,tj2:7,tJ:3,tM:3,tm1:0,step:66},30],['ladder spins',{view:'ladder',tj1:1,tj2:1,step:3},4],['ladder 0x0',{view:'ladder',tj1:0,tj2:0,tJ:0,tM:0,tm1:0},2],
    ['vector',{view:'vector'},5],['vector x16',{view:'vector',scale:16,frames:40},5],['vector stretched',{view:'vector',tj1:2,tj2:1,tJ:3,tM:1,scale:8},5],['vector j1=0',{view:'vector',tj1:0,tj2:4,tJ:4,tM:2,tm1:0},3],
    ['vector 4x4 turned',{view:'vector',tj1:8,tj2:8,tJ:8,tM:0,scale:3,camTheta:0.5,camPhi:-1.2,frames:90},5],['vector M=J',{view:'vector',tj1:4,tj2:2,tJ:4,tM:4,scale:5},5],
    ['field H',{view:'field'},3],['field Cs zero',{view:'field',sys:'Cs',xB:0,fF:6,fM:-4},3],['field Cs max',{view:'field',sys:'Cs',xB:3,fF:8,fM:8},3],['field Na',{view:'field',sys:'Na',xB:1.5,fF:3,fM:3},3],['field Rb',{view:'field',sys:'Rb',xB:0.3,fF:4,fM:-2},3],
    ['rot',{view:'rot'},30],['rot 4x4',{view:'rot',tj1:8,tj2:8,tJ:8,tM:0,tm1:0,beta:-120},300],['rot 0x1',{view:'rot',tj1:0,tj2:2,tJ:2,tM:0,tm1:0,beta:180},4],['rot spins turning',{view:'rot',tj1:1,tj2:1,tJ:0,tM:0,tm1:1,turn:true,frames:30},6],['rot 0',{view:'rot',beta:0},10],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const tDraw={};
  for(const [nm,over,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      if(over.measure) measure(over.measure);
      const c=makeShot(W,H); let err=null; const t0=Date.now();
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      tDraw[over.view]=Math.max(tDraw[over.view]||0,Date.now()-t0);
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      const floor=isNarrow(W)?1:minFills;   /* a narrow stage draws one panel of a view (Known-bad: two-column layouts collapse) */
      ok(fills.length>=floor&&texts.length>=3,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+floor+'; '+texts.length+' texts)');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|null|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(/[A-Za-zα-ωμ]_[A-Za-z0-9]/.test(t.t)){ bad='underscore subscript: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }
  console.log('slowest draw per view (ms): '+JSON.stringify(tDraw));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
