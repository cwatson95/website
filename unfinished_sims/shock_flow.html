const VIEWS=[{id:'jump',    label:'the jump'},
             {id:'nozzle',  label:'the nozzle'},
             {id:'blast',   label:'the blast'},
             {id:'mushroom',label:'the mushroom'}];
const DEFAULTS={
  view:'jump', gas:'air', k:1.4,
  /* jump */
  Mx:2.0, showFanno:true, showRayleigh:true, showHeads:true,
  /* nozzle */
  Ae:2.4, Ai:3.2, xt:0.34, pbr:0.60, showFamily:true,
  p0MPa:1.0, T0:500, AtCm2:10,
  /* blast */
  ndim:3, kappa:0, gamB:1.4, rho0:1.25, winLo:0.24, winHi:1.93,
  showSedov:true, showMatrix:true,
  /* mushroom */
  rhoRatio:0.12, aRT:20, lam:120, z0:2, tRT:8, surf:0, alphaMix:0.055,
  showRoll:true, showMix:true,
};
function syncGas(st){ st.k=gasById(st.gas).k; return st; }
const SUBTITLE={
  jump:    'the conservation laws have two roots — entropy picks one',
  nozzle:  'where the second root gets used: no smooth solution exists',
  blast:   'the same jump, strong — and dimensional analysis alone gives the yield',
  mushroom:'Rayleigh–Taylor has no length scale, which is why there is one cap',
};

/* ================================================================== *
 *  TEXT — readout, equation bar, corner tag                           *
 * ================================================================== */
const f=(v,n)=>(isFinite(v)?v.toFixed(n==null?3:n):'—');
function fmtE(J){
  const kt=J/KT_J;
  return kt>=1?kt.toFixed(2)+' kt':(kt*1000).toFixed(1)+' t';
}
function fmtSI(v,u,n){
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(n==null?2:n)+' M'+u;
  if(a>=1e3) return (v/1e3).toFixed(n==null?2:n)+' k'+u;
  return v.toFixed(n==null?2:n)+' '+u;
}
function row(k,v){ return '<tr><td>'+k+'</td><td class="v">'+v+'</td></tr>'; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }

function readoutHTML(st){
  const g=gasById(st.gas);
  if(st.view==='jump'){
    const y=shock(st.Mx,st.k);
    const raw=shockByInvariants(st.Mx,st.k);
    const resid=Math.abs(raw-y.My)/y.My;
    return '<div class="rname">normal shock<small>'+g.name+', γ = '+f(st.k,3)+'</small></div>'
      +'<table>'
      +hd('across the jump')
      +row('M<sub>x</sub>',f(st.Mx,4))+row('M<sub>y</sub>',f(y.My,5))
      +row('p<sub>y</sub>/p<sub>x</sub>',f(y.p,4))+row('T<sub>y</sub>/T<sub>x</sub>',f(y.T,4))
      +row('ρ<sub>y</sub>/ρ<sub>x</sub>',f(y.rho,4))+row('V<sub>y</sub>/V<sub>x</sub>',f(y.V,4))
      +hd('what is lost')
      +row('p<sub>0y</sub>/p<sub>0x</sub>',f(y.p0,5))
      +row('(s<sub>y</sub> − s<sub>x</sub>)/R',f(y.dsR,5))
      +row('A*<sub>y</sub>/A*<sub>x</sub>',f(y.Astar,4))
      +'</table>'
      +'<div class="bar"><div class="fill" style="width:'+(y.p0*100).toFixed(1)
      +'%;background:linear-gradient(90deg,#7c2338,#ff5a4a)"></div></div>'
      +'<div class="note">stagnation pressure surviving the shock. T<sub>0</sub> does not '
      +'change (eq. 9.47b), so the entire entropy rise is −R ln(p<sub>0y</sub>/p<sub>0x</sub>).</div>'
      +'<div class="note"><b>live check:</b> solving eqs. 9.46–9.48 for the second root '
      +'gives M<sub>y</sub> = '+raw.toPrecision(9)+', against eq. 9.55 — relative difference '
      +resid.toExponential(1)+'.</div>'
      +'<div class="legend"><span><i style="background:#b8ec4c"></i>Fanno (mass + energy)</span>'
      +'<span><i style="background:#cd35c4"></i>Rayleigh (mass + momentum)</span></div>';
  }
  if(st.view==='nozzle'){
    const sol=nozzleSolve(st), Rg=REGIMES[sol.regime];
    const At=st.AtCm2*1e-4, p0=st.p0MPa*1e6;
    const md=mdotChoked(p0,st.T0,At,g)*sol.mdotFrac;   /* mdot ∝ A* */
    const dsR=sol.Mx?shock(sol.Mx,st.k).dsR:0;
    return '<div class="rname">'+Rg.name+'<small>'+g.name+', γ = '+f(st.k,3)
      +' &nbsp;·&nbsp; A<sub>e</sub>/A<sub>t</sub> = '+f(st.Ae,2)+'</small></div>'
      +'<table>'
      +hd('critical back pressures')
      +row('p₁/p₀ &nbsp;choked',f(sol.p1,4))
      +row('p₂/p₀ &nbsp;shock at exit',f(sol.p2,4))
      +row('p₃/p₀ &nbsp;design',f(sol.p3,4))
      +row('p<sub>b</sub>/p₀ &nbsp;<b>now</b>',f(st.pbr,4))
      +hd('the flow')
      +row('M at the throat',f(sol.Mt,4))
      +row('M at the exit',f(sol.Me,4))
      +row('p<sub>e</sub>/p₀',f(sol.pe,4))
      +row('mass flow',fmtSI(md,'kg/s',3))
      +(sol.Mx?hd('the discontinuity')
        +row('M<sub>x</sub> → M<sub>y</sub>',f(sol.Mx,4)+' → '+f(sol.My,4))
        +row('A<sub>s</sub>/A<sub>t</sub>',f(sol.shockA,4))
        +row('position',sol.shockU!=null?(100*sol.shockU).toFixed(1)+'% along':'exit plane')
        +row('(s<sub>y</sub>−s<sub>x</sub>)/R',f(dsR,4)):'')
      +'</table>'
      +'<div class="note">'+Rg.note+'</div>'
      +(sol.choked?'<div class="note"><b>choked.</b> The mass flow rate is stuck at its '
        +'maximum for this stagnation state — lowering p<sub>b</sub> further cannot increase '
        +'it, which is exactly why a shock has to appear.</div>':'');
  }
  if(st.view==='blast'){
    const S=sedov(st.gamB,st.ndim), fit=taylorFit([st.winLo,st.winHi],S,st.rho0);
    const tRef=1e-3, E=fit?fit.E:0;
    const D=E>0?blastD(tRef,E,st.rho0,S):0;
    return '<div class="rname">Sedov–Taylor<small>γ = '+f(st.gamB,3)+', n = '+st.ndim
      +(st.kappa?', κ = '+f(st.kappa,2):'')+'</small></div>'
      +'<table>'
      +hd('from dimensions alone')
      +row('α = 2/(n+2)',f(S.alpha,5))
      +row('ξ₀(γ, n)',f(S.xi0,6))
      +hd('the test: is it self-similar?')
      +(fit?row('fitted slope',f(fit.slope,4))
           +row('predicted α',f(fit.theory,4))
           +row('points in window',fit.N+' of '+TAYLOR.length)
           +row('rms in log R',(fit.rms*100).toFixed(2)+'%')
           +hd('the answer: the yield')
           +row('E',fmtE(fit.E))
           +row('E',fit.E.toExponential(3)+' J')
           +row('spread over the window',fmtE(fit.Elo)+' – '+fmtE(fit.Ehi))
           +hd('at t = 1 ms')
           +row('R',f(blastR(tRef,fit.E,st.rho0,S),1)+' m')
           +row('shock speed',fmtSI(D,'m/s',0))
           +row('M of the shock',f(D/Math.sqrt(1.4*287.05*300),0))
        :row('window','too narrow'))
      +'</table>'
      +'<div class="note">Taylor published <b>about 20 kt</b> from this data; the '
      +'declassified Trinity yield is <b>21 kt</b>. No hydrodynamics was solved to get '
      +'it — only the Π-theorem and the slope of a straight line.</div>'
      +'<div class="note"><b>the intercept is read at the data, not at t = 1 s.</b> '
      +'E goes like R⁵, so extrapolating three decades multiplies any slope error by '
      +'10¹⁵ᵈ: the same fitted line read at t = 1 s would say '
      +(fit?fmtE(fit.Eext):'—')+'.</div>'
      +(st.kappa?'<div class="note"><b>κ ≠ 0</b> enters the dimensional matrix only. '
        +'ξ₀ and the fit are the uniform-ambient solution.</div>':'');
  }
  const R=rtState(st);
  const nE=R.sig>0?R.sig*st.tRT/Math.LN2:0;
  return '<div class="rname">Rayleigh–Taylor<small>A<sub>t</sub> = '+f(R.At,4)
    +' &nbsp;·&nbsp; λ = '+f(st.lam,1)+' m</small></div>'
    +'<table>'
    +hd('linear stage')
    +row('σ = √(A<sub>t</sub> a k)',f(R.sig,4)+' s⁻¹')
    +row('e-folding time',f(R.sig>0?1/R.sig:Infinity,3)+' s')
    +row('doublings so far',f(nE,2))
    +row('ζ<sub>sat</sub> (eq. 8.164)',f(R.zsat,2)+' m')
    +row('t at saturation',isFinite(R.tsat)?f(R.tsat,3)+' s':'never')
    +hd('non-linear stage')
    +row('bubble height',f(R.hb,2)+' m')
    +row('spike depth',f(R.hs,2)+' m')
    +row('bubble speed',f(R.ub,3)+' m/s')
    +row('terminal (Table 8.2)',f(R.ubInf,3)+' m/s')
    +row('spike terminal',isFinite(R.usInf)?f(R.usInf,3)+' m/s':'accelerates at a')
    +hd('turbulent stage')
    +row('h = α A<sub>t</sub> a t²',f(R.hMix,1)+' m')
    +'</table>'
    +'<div class="note">σ ∝ λ<sup>−1/2</sup> so short modes grow fastest; but the terminal '
    +'bubble speed ∝ √λ, so once saturated the <b>long</b> modes win and the pattern '
    +'coarsens. The only length available at time t is a t² — hence one cap.</div>';
}

function eqbarHTML(st){
  if(st.view==='jump'){
    const y=shock(st.Mx,st.k);
    return '<span class="lhs">M<sub>y</sub><sup>2</sup></span> = '
      +'( M<sub>x</sub><sup>2</sup> + 2/(k−1) ) / ( [2k/(k−1)] M<sub>x</sub><sup>2</sup> − 1 )'
      +' &nbsp;&nbsp;→&nbsp;&nbsp; <span class="hl">M<sub>y</sub> = '+f(y.My,5)+'</span>'
      +' &nbsp;&nbsp; s<sub>y</sub> − s<sub>x</sub> = <span class="hl2">+'+f(y.dsR,4)+' R</span> &gt; 0'
      +'<span class="sm">eq. 9.55 — but the sim finds it by intersecting the Fanno and '
      +'Rayleigh lines, and only then checks the formula</span>';
  }
  if(st.view==='nozzle'){
    const sol=nozzleSolve(st);
    return '<span class="lhs">A/A*</span> = (1/M) [ (2/(k+1))(1 + ½(k−1)M<sup>2</sup>) ]'
      +'<sup>(k+1)/2(k−1)</sup> &nbsp;&nbsp;·&nbsp;&nbsp; '
      +'<span class="lhs">A*<sub>x</sub>/A*<sub>y</sub></span> = p<sub>0y</sub>/p<sub>0x</sub>'
      +' &nbsp;&nbsp;→&nbsp;&nbsp; <span class="hl">'+REGIMES[sol.regime].name+'</span>'
      +'<span class="sm">eqs. 9.52 and 9.57 — the second fixes where the shock has to stand '
      +'so that p<sub>e</sub> comes out equal to p<sub>b</sub></span>';
  }
  if(st.view==='blast'){
    const S=sedov(st.gamB,st.ndim), fit=taylorFit([st.winLo,st.winHi],S,st.rho0);
    return '<span class="lhs">R<sub>s</sub>(t)</span> = ξ₀(γ) ( E t<sup>2</sup> / ρ₀ )'
      +'<sup>1/(n+2)</sup> &nbsp;&nbsp;→&nbsp;&nbsp; <span class="hl">slope '
      +(fit?f(fit.slope,4):'—')+'</span> vs <span class="hl2">2/(n+2) = '+f(S.alpha,4)+'</span>'
      +' &nbsp;&nbsp; E = <span class="hl">'+(fit?fmtE(fit.E):'—')+'</span>'
      +'<span class="sm">the exponents come out of the dimensional matrix; ξ₀ = '
      +f(S.xi0,6)+' comes out of the energy integral of the self-similar solution</span>';
  }
  const R=rtState(st);
  return '<span class="lhs">σ<sub>RT</sub></span> = √( A<sub>t</sub> a k ) '
    +'&nbsp;&nbsp;·&nbsp;&nbsp; <span class="lhs">u<sub>b</sub><sup>∞</sup></span> = '
    +'√( [2A<sub>t</sub>/(1+A<sub>t</sub>)] aλ/6π ) &nbsp;&nbsp;·&nbsp;&nbsp; '
    +'<span class="lhs">h</span> = α A<sub>t</sub> a t<sup>2</sup>'
    +' &nbsp;&nbsp;→&nbsp;&nbsp; <span class="hl">σ = '+f(R.sig,3)+' s⁻¹</span>, '
    +'<span class="hl2">u<sub>b</sub><sup>∞</sup> = '+f(R.ubInf,2)+' m/s</span>'
    +'<span class="sm">three laws, one dimensional argument: from a and k the only rate is '
    +'√(ak), from a and λ the only speed is √(aλ), from a and t the only length is a t²</span>';
}
function tagHTML(st){
  const T={
    jump:'<b>The second root.</b> Mass, energy and momentum give two states, not one. '
         +'Both curves pass through x; y is where they cross again.',

          +'flow cannot reach p<sub>b</sub>, so a discontinuity appears.',
    blast:'<b>No equation solved.</b> The exponent comes from the units; only the front '
         +'factor needs the Euler equations.',

function buildPanel(st,onChange){
  const P=document.getElementById('panel'); P.innerHTML='';
  const grp=(title,...kids)=>{ const g=h('div',{class:'grp'});
    if(title) g.appendChild(h('h3',{text:title}));
    for(const kk of kids) if(kk) g.appendChild(kk); P.appendChild(g); return g; };
  const chips=(opts,get,set)=>{
    const box=h('div',{class:'chips'});
    for(const o of opts){
      const b=h('button',{class:'chip'+(get()===o.v?' on':''),text:o.t,
        onclick:()=>{ set(o.v); onChange(); }});
      box.appendChild(b);
    }
    return box;
  };
  const slider=(lab,min,max,step,get,set,fmt)=>{
    const val=h('span',{class:'val',text:fmt(get())});
    const inp=h('input',{type:'range',min,max,step,value:get(),
      oninput:e=>{ set(+e.target.value); val.textContent=fmt(get()); onChange(); }});
    return h('div',{class:'sliderrow'},h('label',{text:lab}),inp,val);
  };
  const check=(lab,get,set)=>{
    const inp=h('input',{type:'checkbox',
      onchange:e=>{ set(e.target.checked); onChange(); }});
    if(get()) inp.checked=true;
    return h('label',{},inp,document.createTextNode(lab));
  };
  const checkbox=(items)=>{ const b=h('div',{class:'checks'});
    for(const it of items) b.appendChild(check(it[0],it[1],it[2])); return b; };

  if(st.view==='jump'||st.view==='nozzle'){
    grp('gas',chips(GASES.map(g=>({v:g.id,t:g.name})),()=>st.gas,
      v=>{ st.gas=v; syncGas(st); }));

let ST=null, CV=null, CTX=null, dirty=true, DPR=1;

function draw(){
  if(!CTX) return;
  const W=CV.width/DPR, H=CV.height/DPR;
  CTX.setTransform(DPR,0,0,DPR,0,0);
  CTX.clearRect(0,0,W,H);
  drawView(CTX,W,H,ST);
}
function drawView(ctx,W,H,st){
  if(st.view==='jump')          drawJump(ctx,W,H,st);
  else if(st.view==='nozzle')   drawNozzle(ctx,W,H,st);
  else if(st.view==='blast')    drawBlast(ctx,W,H,st);
  else                          drawMushroom(ctx,W,H,st);
}
function refresh(rebuild){
  if(rebuild) buildPanel(ST,()=>refresh(false));
  document.getElementById('readout').innerHTML=readoutHTML(ST);
  document.getElementById('eqbar').innerHTML=eqbarHTML(ST);
  document.getElementById('tag').innerHTML=tagHTML(ST);
  document.getElementById('hint').textContent=HINT[ST.view]||'';
  document.getElementById('sub').textContent=SUBTITLE[ST.view]||'';
  for(const b of document.querySelectorAll('#tabs button'))
    b.className=(b.dataset.v===ST.view)?'active':'';
  dirty=true;                       /* EVERY interaction marks the frame dirty */
}
function resize(){
  if(!CV) return;
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=CV.getBoundingClientRect();
  CV.width=Math.max(320,Math.round(r.width*DPR));
  CV.height=Math.max(240,Math.round(r.height*DPR));
  dirty=true;
}
function frame(){
  if(dirty){
    dirty=false;
    try{ draw(); document.getElementById('errbox').style.display='none'; }
    catch(e){ const b=document.getElementById('errbox');
      b.textContent=e&&e.stack?e.stack:String(e); b.style.display='block'; }
  }
  requestAnimationFrame(frame);
}
/* Dragging: each view has one quantity worth reaching for.  Every handler sets
   `dirty` — a handler that mutates state and returns leaves the loop's
   `if(dirty)` false and the canvas silently stops tracking the mouse.  That is
   on the Known-bad list and it is why this comment exists. */
function attach(){
  let drag=null;
  const pos=e=>{ const r=CV.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top,W:r.width,H:r.height}; };
  CV.addEventListener('pointerdown',e=>{
    CV.setPointerCapture(e.pointerId); CV.classList.add('grabbing');
    drag=pos(e); apply(drag); });
  CV.addEventListener('pointermove',e=>{ if(!drag) return; apply(pos(e)); });
  const end=()=>{ drag=null; CV.classList.remove('grabbing'); dirty=true; };
  CV.addEventListener('pointerup',end);
  CV.addEventListener('pointercancel',end);
  function apply(p){
    const st=ST;
    if(st.view==='jump'){
      const G=jumpGeometry(st,p.W,p.H);
      st.Mx=clamp(1.001+(p.x-G.plot.x)/G.plot.w*7,1.001,8);
    } else if(st.view==='nozzle'){
      const G=nozzleGeometry(st,p.W,p.H);
      st.pbr=clamp(1-(p.y-G.plot.y)/G.plot.h,0.02,1.0);
    } else if(st.view==='blast'){
      const G=blastGeometry(st,p.W,p.H);
      const ax=makeAxes(G.main,{x0:0.05,x1:120,y0:7,y1:300},{logx:true,logy:true});
      const t=clamp(ax.invX(p.x),0.10,62);
      if(Math.abs(t-st.winLo)<Math.abs(t-st.winHi)) st.winLo=Math.min(t,st.winHi-0.01);
      else st.winHi=Math.max(t,st.winLo+0.01);
    } else {
      const G=mushGeometry(st,p.W,p.H);
      st.tRT=clamp((p.x-G.box.x)/G.box.w*60,0,60);
    }
    refresh(true);
  }
  window.addEventListener('resize',()=>{ resize(); refresh(false); });
  window.addEventListener('keydown',e=>{
    const i=VIEWS.findIndex(v=>v.id===ST.view);
    if(e.key==='ArrowRight'&&e.metaKey===false&&e.target===document.body){
      ST.view=VIEWS[(i+1)%VIEWS.length].id; refresh(true); }
  });
}
function buildTabs(){
  const nav=document.getElementById('tabs'); nav.innerHTML='';
  for(const v of VIEWS){
    const b=h('button',{text:v.label,class:v.id===ST.view?'active':''});
    b.dataset.v=v.id;
    b.addEventListener('click',()=>{ ST.view=v.id; refresh(true); });
    nav.appendChild(b);
  }
}
function boot(){
  ST=Object.assign({},DEFAULTS); syncGas(ST);
  CV=document.getElementById('scene'); CTX=CV.getContext('2d');
  buildTabs(); attach(); resize(); refresh(true);
  requestAnimationFrame(frame);
}

/* ================================================================== *
 *  A RECORDING CANVAS STUB — lets the assertion suite drive every view *
 *  with no DOM at all, and check what was actually emitted.            *
 * ================================================================== */
function stubCtx(){
  const rec={ops:[],nums:[],clips:0,paths:[],cur:null};
  const num=(...a)=>{ for(const v of a) rec.nums.push(v); };
  const c={
    canvas:{width:1200,height:800},
    save(){rec.ops.push('save');}, restore(){rec.ops.push('restore');},
    beginPath(){rec.ops.push('beginPath'); rec.cur=[]; rec.paths.push(rec.cur);},
    moveTo(x,y){num(x,y); if(rec.cur)rec.cur.push([x,y,'m']);},
    lineTo(x,y){num(x,y); if(rec.cur)rec.cur.push([x,y,'l']);},
    arc(x,y,r,a,b){num(x,y,r);}, closePath(){},
    rect(x,y,w,hh){num(x,y,w,hh);}, roundRect(x,y,w,hh,r){num(x,y,w,hh);},
    fill(){rec.ops.push('fill');}, stroke(){rec.ops.push('stroke');},
    fillRect(x,y,w,hh){num(x,y,w,hh);}, strokeRect(x,y,w,hh){num(x,y,w,hh);},
    clearRect(){}, clip(){rec.clips++;},
    setLineDash(){}, translate(x,y){num(x,y);}, rotate(a){num(a);},
    setTransform(){}, measureText(t){return {width:(''+t).length*6};},
    fillText(t,x,y){num(x,y); rec.ops.push('text:'+t);},
    createLinearGradient(){return {addColorStop(){}};},
  };
  Object.defineProperty(c,'rec',{value:rec});
  return c;
}

function selfTest(){
  let pass=0, fail=0;
  const ok=(cond,name)=>{ if(cond) pass++; else { fail++; console.log('FAIL — '+name); } };
  const chk=(name,got,want,tol,rel)=>{
    const e=rel?Math.abs(got-want)/Math.abs(want):Math.abs(got-want);
    if(e<=tol) pass++; else { fail++;
      console.log('FAIL — '+name+': got '+got+' want '+want+' err '+e.toExponential(3)); } };
  /* the only honest tolerance against a table is half of its last printed
     digit — anything tighter is testing the typesetter, not the physics */
  const dp=v=>{ const s=''+v, i=s.indexOf('.'); return i<0?0:s.length-i-1; };
  const chkT=(name,got,want,slack)=>chk(name,got,want,(slack||0.6)*Math.pow(10,-dp(want)),false);
  /* The slacks below are in units of the LAST PRINTED DIGIT, and each one was
     set from the measured worst residual over the whole column, not guessed.
     In half-last-digits the worst residuals are: 9.2 T/To 1.29, p/po 1.57,
     A/A* 1.14; 9.3 My 1.23, py/px 2.00, Ty/Tx 1.01, poy/pox 4.73.  Those are
     the source tables' own chain rounding, not ours: the closed forms are
     cross-checked against independent derivations to 1e-12 immediately below,
     and a genuine formula error would be percent-level, not 1e-5. */

  /* ---------- Table 9.2, every row and column ---------- */
  for(const [M,Tr,pr,Ar] of TBL92){
    chkT('9.2 T/To M='+M,TT0(M,1.4),Tr,0.8);
    chkT('9.2 p/po M='+M,pp0(M,1.4),pr,1.0);
    chkT('9.2 A/A* M='+M,AAs(M,1.4),Ar,0.8);
  }
  /* ---------- Table 9.3, every row and column ---------- */
  for(const [Mx,Myr,prr,Trr,p0r] of TBL93){
    const My=MyOfMx(Mx,1.4);
    chkT('9.3 My Mx='+Mx,My,Myr,0.8);
    chkT('9.3 py/px Mx='+Mx,pRatio(Mx,My,1.4),prr,1.2);
    chkT('9.3 Ty/Tx Mx='+Mx,TRatio(Mx,My,1.4),Trr,0.7);
    chkT('9.3 poy/pox Mx='+Mx,p0Ratio(Mx,My,1.4),p0r,2.6);
  }
  chkT('9.3 My as Mx→∞',MyOfMx(1e7,1.4),0.37796,0.8);

  /* ---------- eq. 9.56 against an independent route ----------
     poy/pox = (poy/py)(py/px)(px/pox).  If this agrees to machine precision
     then the residual against the printed table above is the TABLE's. */
  { let worst=0;
    for(const k of [1.1,1.2,1.289,1.33,1.4,5/3])
      for(let i=0;i<=200;i++){ const Mx=1.001+i*(12-1.001)/200, My=MyOfMx(Mx,k);
        const a=p0Ratio(Mx,My,k), b=(1/pp0(My,k))*pRatio(Mx,My,k)*pp0(Mx,k);
        worst=Math.max(worst,Math.abs(a-b)/a); }
    ok(worst<1e-12,'eq. 9.56 = (poy/py)(py/px)(px/pox) to 1e-12 (worst '
      +worst.toExponential(2)+')'); }

  /* ---------- eq. 9.55 against the RAW conservation laws ---------- */
  { let worst=0;
    for(const k of [1.2,1.33,1.4,5/3])
      for(const Mx of [1.02,1.1,1.3,1.5,2,2.5,3,4,6,9]){
        const got=shockByInvariants(Mx,k), want=MyOfMx(Mx,k);
        worst=Math.max(worst,Math.abs(got-want)/want); }
    ok(worst<1e-9,'the second root of (mass, energy, momentum) IS eq. 9.55 (worst '
      +worst.toExponential(2)+')'); }

  /* ---------- the two lines: sonic point is the entropy maximum ---------- */
  for(const k of [1.2,1.4,5/3]) for(const Mx of [1.5,2.5,4]){
    let bF=0,sF=-1e9,bR=0,sR=-1e9;
    for(let i=1;i<=4000;i++){ const M=i*4/4000;
      const F=fannoAt(M,Mx,k), R=rayleighAt(M,Mx,k);
      if(F.dsR>sF){sF=F.dsR;bF=M;} if(R.dsR>sR){sR=R.dsR;bR=M;} }
    chk('Fanno max s at M=1 (k='+k.toFixed(2)+', Mx='+Mx+')',bF,1,2e-3,false);
    chk('Rayleigh max s at M=1 (k='+k.toFixed(2)+', Mx='+Mx+')',bR,1,2e-3,false); }
  /* ---------- both lines pass through BOTH x and y ---------- */
  for(const k of [1.2,1.4,5/3]) for(const Mx of [1.2,2,3.5]){
    const My=MyOfMx(Mx,k);
    for(const [nm,g] of [['Fanno',fannoAt],['Rayleigh',rayleighAt]]){
      const X=g(Mx,Mx,k), Y=g(My,Mx,k);
      chk(nm+' through x (p)',X.p,1,1e-12,false); chk(nm+' through x (T)',X.T,1,1e-12,false);
      chk(nm+' through y (p)',Y.p,pRatio(Mx,My,k),1e-12,true);
      chk(nm+' through y (T)',Y.T,TRatio(Mx,My,k),1e-12,true); } }
  /* ---------- entropy: forward allowed, reverse forbidden ---------- */
  for(const k of [1.2,1.4,5/3]){
    for(const Mx of [1.05,1.5,2,4,8]) ok(shock(Mx,k).dsR>0,
      'entropy rises for Mx='+Mx+' (k='+k.toFixed(2)+')');
    /* Below Mx = sqrt((k-1)/2k) eq. 9.55 has no real root at all: the radicand

    for(const t of [0,0.5,2,5,8,14,22,40,60]) for(const lam of [12,120,380])
      for(const rr of [0.002,0.12,0.6,0.95]){
        const st=Object.assign({},DEFAULTS,{view:'mushroom',tRT:t,lam,rhoRatio:rr});
        syncGas(st);
        const R=rtState(st), P=rtInterfacePoints(r,st,R);
        let wx0=Infinity,wx1=-Infinity,wy0=Infinity,wy1=-Infinity;
        let sx0=Infinity,sx1=-Infinity,sy0=Infinity,sy1=-Infinity;
        for(let i=0;i<P.world.length;i++){
          wx0=Math.min(wx0,P.world[i][0]); wx1=Math.max(wx1,P.world[i][0]);
          wy0=Math.min(wy0,P.world[i][1]); wy1=Math.max(wy1,P.world[i][1]);
          sx0=Math.min(sx0,P.pts[i][0]);   sx1=Math.max(sx1,P.pts[i][0]);
          sy0=Math.min(sy0,P.pts[i][1]);   sy1=Math.max(sy1,P.pts[i][1]); }
        const tag=' (t='+t+', λ='+lam+', ρ₁/ρ₂='+rr+')';
        if(wy1-wy0>1e-9){
          const ar=((sx1-sx0)/(wx1-wx0))/((sy1-sy0)/(wy1-wy0));
          ok(Math.abs(ar-1)<1e-9,'RT interface drawn at equal aspect'+tag
             +' (ratio '+ar.toFixed(6)+')'); }
        ok(P.B.clipped||sy1-sy0<=r.h+0.5,'the excursion fits, or is flagged clipped'+tag);
        ok(sx1-sx0>=r.w-0.5,'the tiling covers the box width'+tag);
        ok(P.pts.every(p=>isFinite(p[0])&&isFinite(p[1])),'interface points finite'+tag);
        /* bubbles blunt, spikes sharp: the crest must be nearer the mean than
           the trough is, at every stage after the shape becomes asymmetric */
        if(R.nonlinear) ok(R.hs>=R.hb,'the spike outruns the bubble'+tag); } }

  /* ---------- plotting primitives ---------- */
  { const ax=makeAxes({x:10,y:20,w:300,h:200},{x0:0,x1:10,y0:1,y1:5});
    chk('axes map x0',ax.X(0),10,1e-12,false); chk('axes map x1',ax.X(10),310,1e-12,false);
    chk('axes map y0 at bottom',ax.Y(1),220,1e-12,false);
    chk('axes map y1 at top',ax.Y(5),20,1e-12,false);
    chk('axes invert x',ax.invX(ax.X(3.7)),3.7,1e-10,true);
    chk('axes invert y',ax.invY(ax.Y(2.2)),2.2,1e-10,true);
    const lg=makeAxes({x:0,y:0,w:100,h:100},{x0:1e-3,x1:10,y0:1,y1:1000},{logx:true,logy:true});
    chk('log axes invert',lg.invX(lg.X(0.037)),0.037,1e-10,true);
    ok(niceTicks(0,10,5).length>=3,'linear ticks produced');
    ok(logTicks(1e-3,10).filter(t=>t.major).length===5,'log decade ticks');
    let threw=false; try{ makeAxes({x:0,y:0,w:10,h:10},{x0:1,x1:1,y0:0,y1:1}); }
    catch(e){ threw=true; }
    ok(threw,'makeAxes rejects a degenerate domain instead of dividing by zero');
    /* adaptiveCurve must actually bound the SCREEN step — sampling uniformly in
       a parameter that is not uniform on screen is on the Known-bad list */
    const pts=adaptiveCurve(0,1,t=>[t*t*t*1000,0],6,2000,8);
    let worst=0;
    for(let i=1;i<pts.length;i++) worst=Math.max(worst,Math.abs(pts[i].p[0]-pts[i-1].p[0]));
    ok(worst<=6.001,'adaptiveCurve bounds the screen step (worst '+worst.toFixed(2)+' px)');
    const naive=[]; for(let i=0;i<=pts.length;i++){ const t=i/pts.length; naive.push(t*t*t*1000); }
    let nworst=0; for(let i=1;i<naive.length;i++) nworst=Math.max(nworst,naive[i]-naive[i-1]);
    ok(nworst>6,'and uniform sampling would NOT have (worst '+nworst.toFixed(1)+' px)'); }

  /* ---------- colour ---------- */
  { ok(toRgb('#5ac8e0').join()==='90,200,224','toRgb parses 6-digit hex');
    ok(toRgb('#abc').join()==='170,187,204','toRgb parses 3-digit hex');
    ok(toRgb('rgb(58,111,142)').join()==='58,111,142','toRgb parses rgb()');
    ok(toRgb('rgba(58,111,142,0.5)').join()==='58,111,142','toRgb parses rgba()');
    ok(toRgb(mix('#5ac8e0','#e8a33a',0.5)).every(c=>c>0),'mix output re-parses non-black');
    const two=mix('#070b18',mix('#5ac8e0','#e8a33a',0.4),0.8);
    ok(toRgb(two).reduce((a,b)=>a+b)>150,'two-stage blend stays bright ('+two+')');
    let threw=false; try{ toRgb('chartreuse'); }catch(e){ threw=true; }
    ok(threw,'toRgb throws on an unparseable colour instead of silently going black');
    /* Assert BRIGHTNESS per band, not colour syntax — rgb(0,0,0) is perfectly
       well formed, and the two-stage blend here is exactly the shape that
       painted 420 dome quads black in steam_carnot_cycle.html. */
    { let dark=null, worst=1e9;
      for(const post of [false,true]) for(let i=0;i<=40;i++){
        const q={M:i*0.1,post}, c=toRgb(nozzleBandColour(q));
        const sum=c[0]+c[1]+c[2];
        if(sum<worst){ worst=sum; dark=q; }
        ok(sum>60,'nozzle band is visible at M='+q.M.toFixed(1)+', post='+post
          +' (rgb sum '+sum+')'); }
      ok(worst>60,'darkest nozzle band has rgb sum '+worst+' at M='
        +dark.M.toFixed(1)+', post='+dark.post);
      /* and the supersonic core must be brighter than the subsonic inlet, so
         the shading actually reads as a Mach number */
      const inlet=toRgb(nozzleBandColour({M:0.2,post:false})).reduce((a,b)=>a+b);
      const core =toRgb(nozzleBandColour({M:1.0,post:false})).reduce((a,b)=>a+b);
      ok(core>inlet*1.3,'the sonic band is visibly brighter than the inlet band'); } }

  /* ---------- every view draws, clips, and emits only finite numbers ------- */
  { for(const v of VIEWS.map(v=>v.id)){
      for(const [W,H] of [[1440,900],[1100,700],[820,560],[640,460]]){
        const st=Object.assign({},DEFAULTS,{view:v}); syncGas(st);
        const c=stubCtx();
        let err=null; try{ drawView(c,W,H,st); }catch(e){ err=e; }
        ok(!err,'draw '+v+' at '+W+'x'+H+(err?': '+err.message:''));
        if(err) continue;
        ok(c.rec.clips>0,'view '+v+' clips its data to the frame');
        ok(c.rec.nums.every(isFinite),'view '+v+' emits only finite coordinates');
        ok(c.rec.ops.length>40,'view '+v+' actually drew something');
      } } }
  /* the same, across the parameter space rather than only the defaults */
  { const c=stubCtx();
    for(const Mx of [1.02,1.5,3,6,8]) for(const gid of ['air','mono','co2']){
      const st=Object.assign({},DEFAULTS,{view:'jump',Mx,gas:gid}); syncGas(st);
      let e=null; try{ drawJump(c,1200,760,st); }catch(x){ e=x; }
      ok(!e,'jump draws at Mx='+Mx+', '+gid+(e?': '+e.message:'')); }
    for(let i=0;i<=20;i++){
      const st=Object.assign({},DEFAULTS,{view:'nozzle',pbr:0.02+i*0.049}); syncGas(st);
      let e=null; try{ drawNozzle(c,1200,760,st); }catch(x){ e=x; }
      ok(!e,'nozzle draws at pb/p0='+(0.02+i*0.049).toFixed(3)+(e?': '+e.message:'')); }
    for(const g of [1.15,1.4,1.67,1.85]) for(const n of [1,2,3]){
      const st=Object.assign({},DEFAULTS,{view:'blast',gamB:g,ndim:n}); syncGas(st);
      let e=null; try{ drawBlast(c,1200,760,st); }catch(x){ e=x; }
      ok(!e,'blast draws at gamma='+g+', n='+n+(e?': '+e.message:'')); }
    for(const t of [0,0.5,2,8,25,60]) for(const r of [0.002,0.3,0.9]){
      const st=Object.assign({},DEFAULTS,{view:'mushroom',tRT:t,rhoRatio:r}); syncGas(st);
      let e=null; try{ drawMushroom(c,1200,760,st); }catch(x){ e=x; }
      ok(!e,'mushroom draws at t='+t+', r='+r+(e?': '+e.message:'')); } }
  /* layout rectangles stay positive on small canvases */
  { for(const [W,H] of [[600,420],[900,600],[1600,1000]]){
      const st=Object.assign({},DEFAULTS); syncGas(st);
      for(const G of [jumpGeometry(st,W,H),nozzleGeometry(st,W,H),
                      blastGeometry(st,W,H),mushGeometry(st,W,H)])
        for(const kk in G) if(G[kk]&&G[kk].w!=null)
          ok(G[kk].w>0&&G[kk].h>0,'layout rect positive at '+W+'x'+H); } }

  /* ---------- strings ---------- */
  { for(const v of VIEWS.map(v=>v.id)){
      const st=Object.assign({},DEFAULTS,{view:v}); syncGas(st);
      for(const s of [readoutHTML(st),eqbarHTML(st),tagHTML(st),INFO[v],SUBTITLE[v],HINT[v]]){
        ok(typeof s==='string'&&s.length>0,v+' string present');
        ok(s.indexOf('undefined')<0,v+' string has no undefined');
        ok(s.indexOf('NaN')<0,v+' string has no NaN'); } }
    for(const r in REGIMES){ ok(REGIMES[r].name&&REGIMES[r].note,'regime text for '+r); }
    /* the readout must not go to pieces at the ends of the sliders either */
    for(const Mx of [1.001,8]) { const st=Object.assign({},DEFAULTS,{Mx}); syncGas(st);
      ok(readoutHTML(st).indexOf('NaN')<0,'jump readout clean at Mx='+Mx); }
    for(const pbr of [0.02,0.999,1.0]) { const st=Object.assign({},DEFAULTS,{view:'nozzle',pbr});
      syncGas(st); ok(readoutHTML(st).indexOf('NaN')<0,'nozzle readout clean at pb='+pbr); }
    for(const t of [0,60]) { const st=Object.assign({},DEFAULTS,{view:'mushroom',tRT:t});
      syncGas(st); ok(readoutHTML(st).indexOf('NaN')<0,'mushroom readout clean at t='+t); } }

  console.log(pass+' passed, '+fail+' failed');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return true;
}

/* ============================== entry ============================= */
if(typeof document!=='undefined'){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
} else {
  selfTest();
}
</script>
</body>
