<title>Shock flow — the second root of the conservation laws</title>
<!--
  A SHOCK IS THE SECOND ROOT.

  Write mass, energy and momentum across a thin discontinuity in a duct of
  fixed area (Moran/Shapiro/Boettner/Bailey, Fundamentals of Engineering
  Thermodynamics, Sec. 9.13.3, eqs. 9.46-9.49):

      rho_x V_x = rho_y V_y                          (9.46)  mass
      h_x + V_x^2/2 = h_y + V_y^2/2                  (9.47)  energy
      p_x + rho_x V_x^2 = p_y + rho_y V_y^2          (9.48)  momentum
      s_y - s_x = sigma_cv / mdot >= 0               (9.49)  entropy

  Three conservation equations in the two unknowns of a simple compressible
  substance, plus one inequality. They do NOT have a unique solution. They have
  exactly TWO, and one of them is the state you started from. The shock is the
  other one — and eq. 9.49 is the only thing that says which way you may go.

  That is the whole file. Four views, one statement, four scales.

  1. THE JUMP. Mass+energy at fixed mass flux is a curve in the h-s plane (the
     FANNO line); mass+momentum is another (the RAYLEIGH line). Both pass
     through x. Both have their maximum entropy exactly at M = 1, so each has a
     subsonic upper branch and a supersonic lower branch. State y must satisfy
     all three equations at once, so y is where the two curves cross AGAIN —
     Fig. 9.34 of the source, drawn here rather than sketched. The sim does not
     plot eq. 9.55; it root-solves the raw invariants (G, h0, I) and then checks
     that what it found IS eq. 9.55, to 1e-12. Entropy then picks the direction:
     the crossing with the larger s is subsonic, so a shock can only turn
     supersonic into subsonic, never the reverse. Nothing else in gas dynamics
     needs to be assumed for that; it falls out of which of two roots has more
     entropy.

  2. THE NOZZLE. Where the second root gets used. In a converging-diverging
     nozzle at fixed stagnation state there is a whole band of back pressures
     for which NO smooth solution exists: the flow is choked at the throat, so
     the mass flow rate cannot adjust, and isentropic flow reaches the exit at
     the wrong pressure. The gas resolves it by inserting a discontinuity —
     it takes the second root somewhere in the diverging section, at exactly
     the place that makes the exit pressure come out right. Slide the back
     pressure and watch the shock position solve p_e(M_x) = p_b. All ten cases
     a-j of Fig. 9.32 are the one-parameter family this produces.

  3. THE BLAST. The same jump, in the strong limit. As M_x -> infinity the
     density ratio does not: it saturates at (gamma+1)/(gamma-1) = 6 for air,
     because the gas heats instead of compressing. A point release of energy E
     into ambient rho_0 therefore has no length or time scale of its own, and
     the Pi-theorem alone (Buckingham 1914; Atzeni & Meyer-ter-Vehn, The Physics
     of Inertial Fusion, Sec. 6.5) fixes the answer without solving anything:

         R_s(t) = xi_0(gamma) (E t^2 / rho_0)^(1/5)          spherical
         R_s(t) = xi_0(gamma) (E t^2 / rho_0)^(1/(n+2))      n = 1, 2, 3

     The sim builds the dimensional matrix live and solves it for the exponents,
     then gets the front factor xi_0 the only way it can be got — by integrating
     the self-similar Euler equations in from the shock and normalising on the
     energy integral. That returns xi_0(1.4) = 1.032777, against the literature
     1.033. Then it does what G. I. Taylor did in 1950 with a set of declassified
     photographs: fit log R against log t, read the slope (2/5 if the flow is
     self-similar) and the intercept (the yield), and get about 20 kt.

  4. THE MUSHROOM. What is left afterwards is hot light gas underneath cold
     dense air, which is the Rayleigh-Taylor configuration. Dimensional analysis
     again, and it is the reason the cloud has one head and not a thousand
     fingers: RT HAS NO LENGTH SCALE. From an acceleration a and a wavenumber k
     the only rate is sqrt(ak), so (Atzeni eqs. 8.1, 8.36)

         sigma_RT = sqrt(A_t a k),     A_t = (rho_2-rho_1)/(rho_2+rho_1)

     which diverges as lambda -> 0: every mode grows, small ones fastest. If
     that were the end of it the interface would be fine-grained froth. But
     growth saturates at zeta_sat = (lambda/2 pi sqrt3) sqrt(2/(1+A_t)) (eq.
     8.164), after which a bubble rises at a TERMINAL velocity that scales as
     sqrt(a lambda) (eq. 8.161, Table 8.2) — so from then on the long modes are
     the fast ones and the pattern coarsens. The only length available at time t
     is a t^2, and the observed law h_b = alpha A_t a t^2 with alpha = 0.04-0.07
     is that statement. One cap, growing quadratically. The sim integrates the
     buoyancy-drag equation 8.160 rather than asserting its asymptote, and draws
     the interface from the third-order result of Jacobs & Catton (eq. 8.165),
     which is what makes bubbles blunt and spikes sharp.

  WHAT IS COMPUTED AND WHAT IS DRAWN. Everything with a number attached is
  computed: Mach numbers, pressure and temperature ratios, entropy production,
  shock position, mass flow rate, the Sedov profiles and front factor, the fit
  and its yield, RT growth rates, saturation amplitudes and bubble/spike
  trajectories. The Kelvin-Helmholtz roll-up at a spike tip is DRAWN — a spiral
  of the size the model gives, not a vortex-sheet calculation — and is labelled
  as such on the canvas. The sim does not pretend to simulate what it did not.

  VERIFICATION. selfTest() checks the closed forms against the source's own
  printed tables (Table 9.2 isentropic, Table 9.3 normal-shock, all rows and
  columns) and against Examples 9.14 and 9.15 case by case, at the tolerance the
  tables are PRINTED to and no tighter. Two of Example 9.15's quoted Mach
  numbers are reproduced only to ~0.01 because the book reads its own coarse
  table by eye — the exact inversion of A/A* is asserted separately to 1e-12 and
  the discrepancy is asserted to be the interpolation error, not ours. The
  Sedov front factor is checked against literature, against step-count and
  cutoff refinement, and against the analytic core limits U -> lambda/gamma and
  G ~ lambda^(n/(gamma-1)) that the ODEs themselves predict.

  Single file, no dependencies, works over file://. All drawing is hand-rolled
  canvas 2D. Same palette and NeonColors table as the rest of this collection.

  Headless self-test: extract the script body (between the LAST script
  open/close tags, cf. rindex) and run it with
      osascript -l JavaScript shock_test.js
  — with `document` undefined it runs the assertion suite instead of the UI.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k==='text') e.textContent=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){ const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c); }
  return e;
}

/* robust bracketed root find — bisection, no derivatives, never diverges */
function bisect(f,a,b,tol,maxit){
  tol=tol||1e-13; maxit=maxit||200;
  let fa=f(a), fb=f(b);
  if(!(isFinite(fa)&&isFinite(fb))) throw new Error('bisect: non-finite endpoint');
  if(fa===0) return a; if(fb===0) return b;
  if(fa*fb>0) throw new Error('bisect: root not bracketed on ['+a+','+b+']');
  for(let i=0;i<maxit;i++){
    const m=0.5*(a+b), fm=f(m);
    if(fm===0||(b-a)<tol*Math.max(1,Math.abs(m))) return m;
    if(fa*fm<0){ b=m; fb=fm; } else { a=m; fa=fm; }
  }
  return 0.5*(a+b);
}

/* ================================================================== *
 *  GAS DYNAMICS                                                       *
 *  Moran, Shapiro, Boettner & Bailey, Fundamentals of Engineering      *
 *  Thermodynamics — Secs. 9.13.3 and 9.14, eqs. 9.46-9.57.             *
 * ================================================================== */
const RU=8.31446261815324;                       /* J/(mol K) */
const GASES=[
  {id:'air',  name:'air',              k:1.400, Mw:28.97},
  {id:'mono', name:'argon / helium',   k:1.667, Mw:39.948},
  {id:'co2',  name:'carbon dioxide',   k:1.289, Mw:44.01},
  {id:'steam',name:'steam',            k:1.330, Mw:18.015},
  {id:'ch4',  name:'methane',          k:1.320, Mw:16.04},
];
const gasById=id=>GASES.find(g=>g.id===id)||GASES[0];
const Rspec=g=>RU/(g.Mw*1e-3);                   /* J/(kg K) */
const cpOf =g=>g.k*Rspec(g)/(g.k-1);

/* ---- isentropic flow functions, eqs. 9.50 / 9.51 / 9.52 ---- */
const TT0=(M,k)=>1/(1+0.5*(k-1)*M*M);                       /* T / T0      */
const pp0=(M,k)=>Math.pow(1+0.5*(k-1)*M*M,-k/(k-1));        /* p / p0      */
const rr0=(M,k)=>Math.pow(1+0.5*(k-1)*M*M,-1/(k-1));        /* rho / rho0  */
function AAs(M,k){                                          /* A / A*      */
  return (1/M)*Math.pow((2/(k+1))*(1+0.5*(k-1)*M*M),(k+1)/(2*(k-1)));
}
/* invert p/p0 -> M (closed form) */
const MfromP=(pr,k)=>Math.sqrt(Math.max(0,(2/(k-1))*(Math.pow(pr,-(k-1)/k)-1)));
/* invert A/A* -> M.  Two roots for every A/A* > 1; `sup` selects which.
   Nothing here is ever read off a printed table: the inversion is exact to
   1e-13, which is why this sim disagrees with two of the Mach numbers quoted
   in Example 9.15 (the book interpolates its own 0.1-spaced table by eye). */
function MfromA(Ar,k,sup){
  if(!(Ar>=1)) throw new Error('MfromA: A/A* = '+Ar+' < 1 has no solution');
  if(Ar===1) return 1;
  return sup ? bisect(M=>AAs(M,k)-Ar,1,200)
             : bisect(M=>AAs(M,k)-Ar,1e-9,1);
}

/* ---- normal-shock functions, eqs. 9.53-9.56 ---- */
const MyOfMx=(Mx,k)=>Math.sqrt((Mx*Mx+2/(k-1))/((2*k/(k-1))*Mx*Mx-1));
const pRatio =(Mx,My,k)=>(1+k*Mx*Mx)/(1+k*My*My);                    /* py/px   */
const TRatio =(Mx,My,k)=>(1+0.5*(k-1)*Mx*Mx)/(1+0.5*(k-1)*My*My);    /* Ty/Tx   */
const p0Ratio=(Mx,My,k)=>(Mx/My)*Math.pow((1+0.5*(k-1)*My*My)/(1+0.5*(k-1)*Mx*Mx),
                                          (k+1)/(2*(k-1)));          /* poy/pox */
/* the whole jump in one call */
function shock(Mx,k){
  const My=MyOfMx(Mx,k);
  const p=pRatio(Mx,My,k), T=TRatio(Mx,My,k), p0=p0Ratio(Mx,My,k);
  return {Mx,My,k,p,T,rho:p/T,V:1/(p/T),p0,
          /* T0 is unchanged across the shock, so s_y - s_x = -R ln(poy/pox)
             exactly — eq. 9.49 with no integration needed. */
          dsR:-Math.log(p0),
          Astar:1/p0};                            /* eq. 9.57: A*x/A*y = poy/pox */
}

/* ================================================================== *
 *  THE FANNO AND RAYLEIGH LINES  (Fig. 9.34)                          *
 *                                                                     *
 *  Fanno    = mass + energy at fixed area  (eqs. 9.46 + 9.47)         *
 *  Rayleigh = mass + momentum at fixed area (eqs. 9.46 + 9.48)        *
 *                                                                     *
 *  Everything is referred to the upstream state x and normalised:      *
 *     y-axis   h/h0  (= T/T0, ideal gas with constant cp)             *
 *     x-axis   (s - s_x)/R                                            *
 *  so the picture is the same for every gas and every stagnation state *
 *  and depends on M_x and gamma alone.                                 *
 * ================================================================== */
/* Fanno: G and h0 fixed.  p ~ sqrt(T)/M follows from rho V = G. */
function fannoAt(M,Mx,k){
  const T=TT0(M,k)/TT0(Mx,k);              /* T / Tx  */
  const p=(Mx/M)*Math.sqrt(T);             /* p / px  */
  return {M,T,p,hh0:TT0(M,k),dsR:(k/(k-1))*Math.log(T)-Math.log(p)};
}
/* Rayleigh: G and I = p + rho V^2 fixed.  p/px = (1+k Mx^2)/(1+k M^2). */
function rayleighAt(M,Mx,k){
  const p=(1+k*Mx*Mx)/(1+k*M*M);           /* p / px  */
  const T=Math.pow(M*p/Mx,2);              /* T / Tx  (from rho V = G)  */
  return {M,T,p,hh0:T*TT0(Mx,k),dsR:(k/(k-1))*Math.log(T)-Math.log(p)};
}
/* Both lines take their maximum entropy at M = 1 — that is what makes the
   upper branch subsonic and the lower branch supersonic, and it is asserted
   in selfTest rather than assumed. */
const fannoSonic   =(Mx,k)=>fannoAt(1,Mx,k);
const rayleighSonic=(Mx,k)=>rayleighAt(1,Mx,k);

/* ---- the shock found WITHOUT eq. 9.55 ------------------------------
   Solve the raw invariants (G, h0, I) for the OTHER root.  Only mass,
   energy and momentum go in; eq. 9.55 is then a prediction to be checked,
   not an input.  Returns M of the second intersection.                */
function shockByInvariants(Mx,k){
  /* work in units where Tx = 1, px = 1, so G, h0, I are pure numbers */
  const Vx=Mx*Math.sqrt(k);                       /* V / sqrt(R Tx)     */
  const rhox=1;                                   /* p/(R T) = 1        */
  const G=rhox*Vx, h0=k/(k-1)+0.5*Vx*Vx, I=1+rhox*Vx*Vx;
  const res=T=>{                                   /* p + G V - I        */
    const V=Math.sqrt(Math.max(2*(h0-k/(k-1)*T),0));
    if(!(V>0)) return -I;
    return G*T/V+G*V-I;
  };
  const Tsonic=(h0*(k-1)/k)*(2/(k+1)), Tmax=h0*(k-1)/k;
  const T=bisect(res,Tsonic*(1+1e-12),Tmax*(1-1e-12),1e-15);
  const V=Math.sqrt(2*(h0-k/(k-1)*T));
  return V/Math.sqrt(k*T);
}

/* ================================================================== *
 *  CONVERGING-DIVERGING NOZZLE  (Fig. 9.32, Example 9.15)             *
 * ================================================================== */
/* Area distribution, in units of the throat area.  Both halves are
   quadratic with zero slope at the throat, so A(x) is C1 there. */
function nozzleArea(u,cfg){
  const xt=cfg.xt;
  if(u<=xt){ const q=1-u/xt;      return 1+(cfg.Ai-1)*q*q; }
  const q=(u-xt)/(1-xt);          return 1+(cfg.Ae-1)*q*q;
}
const REGIMES={
  none      :{name:'no flow',            note:'back pressure at or above the stagnation pressure'},
  venturi   :{name:'venturi',            note:'subsonic throughout, not choked — mass flow still responds to p<sub>b</sub>'},
  chokedSub :{name:'choked, subsonic',   note:'M = 1 at the throat, diverging section acts as a diffuser (case d)'},
  shockIn   :{name:'shock in the nozzle',note:'no smooth solution exists — the gas takes the second root (cases e, f)'},
  shockExit :{name:'shock at the exit',  note:'the shock has been pushed to the exit plane (case g)'},
  over      :{name:'overexpanded',       note:'p<sub>e</sub> &lt; p<sub>b</sub>: oblique shocks outside, not describable in 1-D (case h)'},
  design    :{name:'design',             note:'p<sub>e</sub> = p<sub>b</sub>, isentropic throughout, no waves anywhere (case i)'},
  under     :{name:'underexpanded',      note:'p<sub>e</sub> &gt; p<sub>b</sub>: expansion fans outside (case j)'},
};
function nozzleSolve(st){
  const k=st.k, Ae=st.Ae, pb=st.pbr;
  const MsubE=MfromA(Ae,k,false), MsupE=MfromA(Ae,k,true);
  const p1=pp0(MsubE,k);                              /* choked, subsonic exit */
  const p3=pp0(MsupE,k);                              /* design                */
  const sE=shock(MsupE,k);
  const p2=p3*sE.p;                                   /* shock at the exit plane */
  const out={k,Ae,pb,MsubE,MsupE,p1,p2,p3,choked:false,Mx:null,My:null,
             Astar:1,AstarY:1,p0y:1,Me:null,pe:null,shockU:null,shockA:null,
             regime:'none',mdotFrac:0};
  if(pb>=1){ out.regime='none'; out.Me=0; out.pe=1; return out; }
  if(pb>p1){                                          /* not choked */
    out.regime='venturi';
    out.Me=MfromP(pb,k); out.pe=pb;
    out.Astar=Ae/AAs(out.Me,k);
    out.Mt=MfromA(1/out.Astar,k,false);
    out.mdotFrac=out.Astar;
    return out;
  }
  out.choked=true; out.mdotFrac=1; out.Mt=1;
  if(Math.abs(pb-p1)<=1e-12){ out.regime='chokedSub'; out.Me=MsubE; out.pe=p1; return out; }
  if(pb>p2){                                          /* shock inside */
    out.regime='shockIn';
    const peOf=Mx=>{ const s=shock(Mx,k);
                     const Me=MfromA(Ae*s.p0,k,false);
                     return s.p0*pp0(Me,k); };
    const Mx=bisect(mx=>peOf(mx)-pb,1+1e-12,MsupE,1e-14);
    const s=shock(Mx,k);
    out.Mx=Mx; out.My=s.My; out.p0y=s.p0; out.AstarY=1/s.p0;
    out.shockA=AAs(Mx,k);
    out.Me=MfromA(Ae*s.p0,k,false); out.pe=pb;
    out.shockU=uOfAreaDiverging(out.shockA,st);
    return out;
  }
  /* choked and supersonic all the way to the exit — the exit state is the
     same for every one of these; only what happens OUTSIDE differs. */
  out.Me=MsupE; out.pe=p3;
  if(Math.abs(pb-p2)<=1e-12){ out.regime='shockExit'; out.Mx=MsupE; out.My=sE.My; }
  else if(pb>p3)             out.regime='over';
  else if(Math.abs(pb-p3)<=1e-12) out.regime='design';
  else                       out.regime='under';
  return out;
}
/* where in the diverging section does A(u)/At equal a given ratio? */
function uOfAreaDiverging(Ar,st){
  const cfg=st, xt=cfg.xt;
  if(Ar<=1) return xt;
  if(Ar>=cfg.Ae) return 1;
  return xt+(1-xt)*Math.sqrt((Ar-1)/(cfg.Ae-1));
}
/* Sampled profile down the nozzle: Mach number and p/p0x at every station. */
function nozzleProfile(st,sol,N){
  N=N||220; const k=st.k, out=[];
  for(let i=0;i<=N;i++){
    const u=i/N, Ar=nozzleArea(u,st);
    let M,pr,post=false;
    if(sol.regime==='none'){ M=0; pr=1; }
    else if(!sol.choked){
      M=MfromA(Ar/sol.Astar,k,false); pr=pp0(M,k);
    } else if(sol.regime==='shockIn' && u>sol.shockU){
      post=true; M=MfromA(Ar/sol.AstarY,k,false); pr=sol.p0y*pp0(M,k);
    } else {
      const sup=(u>st.xt) && sol.regime!=='chokedSub';
      M=MfromA(Ar,k,sup); pr=pp0(M,k);
    }
    out.push({u,Ar,M,pr,Tr:TT0(M,k),post});
  }
  return out;
}
/* choked mass flow rate.  mdot = p0 A* sqrt(k/(R T0)) ((k+1)/2)^(-(k+1)/2(k-1)) */
function mdotChoked(p0,T0,Astar,g){
  const k=g.k, R=Rspec(g);
  return p0*Astar*Math.sqrt(k/(R*T0))*Math.pow((k+1)/2,-(k+1)/(2*(k-1)));
}

/* ================================================================== *
 *  DIMENSIONAL ANALYSIS — the Pi-theorem, turned by hand              *
 *  Atzeni & Meyer-ter-Vehn, The Physics of Inertial Fusion, Sec. 6.5. *
 *                                                                     *
 *  R_s = f(t, E, A)  with A = rho_0 / r^kappa the ambient density      *
 *  coefficient.  Units L, M, T only, so k = n = 3 and the Pi-theorem   *
 *  leaves NO free function — a pure power law, exponents and all,      *
 *  before a single differential equation is written down.              *
 * ================================================================== */
/* dimensional matrix, rows = (L, M, T), columns = (t, E, A) */
function dimMatrix(n,kap){
  return {rows:['L','M','T'], cols:['t','E','A'],
          M:[[0, 2, -(n+kap)],
             [0, 1,  1      ],
             [1,-2,  0      ]],
          rhs:[1,0,0]};                     /* dimensions of R_s = L */
}
/* Solve M x = rhs by Gauss-Jordan with partial pivoting.  This is the crank:
   the exponents 2/5, 1/5, -1/5 are computed, never typed in. */
function solveLinear(Min,bin){
  const n=bin.length, A=Min.map((r,i)=>r.concat([bin[i]]));
  for(let c=0;c<n;c++){
    let piv=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[piv][c])) piv=r;
    if(Math.abs(A[piv][c])<1e-14) throw new Error('solveLinear: singular at column '+c);
    const t=A[c]; A[c]=A[piv]; A[piv]=t;
    const d=A[c][c]; for(let j=c;j<=n;j++) A[c][j]/=d;
    for(let r=0;r<n;r++) if(r!==c){ const f=A[r][c];
      if(f!==0) for(let j=c;j<=n;j++) A[r][j]-=f*A[c][j]; }
  }
  return A.map(r=>r[n]);
}
function blastExponents(n,kap){
  const D=dimMatrix(n,kap||0);
  const x=solveLinear(D.M,D.rhs);
  return {t:x[0],E:x[1],A:x[2],D};          /* R_s ~ t^x0 E^x1 A^x2 */
}

/* ================================================================== *
 *  THE SEDOV-TAYLOR SOLUTION                                          *
 *                                                                     *
 *  Self-similar Euler equations behind a strong shock.  With           *
 *     lambda = r/R,   u = D U(l),  rho = rho0 G(l),  p = rho0 D^2 P(l) *
 *     D = alpha R/t,  alpha = 2/(n+2)                                  *
 *  the three conservation laws collapse to                             *
 *     (C)  (U-l) G' + G U' + (n-1) G U / l = 0                         *
 *     (M)  (U-l) U' + ((alpha-1)/alpha) U + P'/G = 0                   *
 *     (E)  (U-l) (P'/P - gamma G'/G) = 2(1-alpha)/alpha                *
 *  with strong-shock Rankine-Hugoniot conditions at l = 1:             *
 *     U(1) = 2/(g+1),  G(1) = (g+1)/(g-1),  P(1) = 2/(g+1).            *
 *                                                                     *
 *  G falls like l^(n/(g-1)) — sixty decades by l = 1e-3 for air — so   *
 *  the integration is done on ln G and ln P against ln lambda, where    *
 *  every derivative is O(1).  Integrating the linear variables to the   *
 *  same depth returns G < 0.  The core below the cutoff is added        *
 *  analytically from the asymptotics the ODEs themselves imply          *
 *  (U -> l/gamma, P -> const), and contributes 6e-10 of the energy.     *
 * ================================================================== */
const _sedovCache=new Map();
function sedov(gam,n,opts){
  n=n||3; opts=opts||{};
  const nsteps=opts.nsteps||20000, lmin=opts.lmin||1e-3;
  const key=gam.toFixed(6)+'|'+n+'|'+nsteps+'|'+lmin;
  if(_sedovCache.has(key)) return _sedovCache.get(key);
  const a=2/(n+2), K=2*(1-a)/a;
  let U=2/(gam+1), lg=Math.log((gam+1)/(gam-1)), lp=Math.log(2/(gam+1));
  let s=0; const ds=Math.log(lmin)/nsteps;
  const prof=[];
  const deriv=(s,y)=>{
    const U=y[0], G=Math.exp(y[1]), P=Math.exp(y[2]), l=Math.exp(s), w=U-l;
    const dU=(((1-a)/a)*U-(P/(G*w))*(K-gam*(n-1)*U/l))/(w-gam*P/(G*w));
    const dg=(-(n-1)*U/l-dU)/w;
    const dq=K/w+gam*dg;
    return [dU*l,dg*l,dq*l];                /* d/d(ln lambda) */
  };
  const add=(y,d,f)=>[y[0]+f*d[0],y[1]+f*d[1],y[2]+f*d[2]];
  const integrand=(s,y)=>Math.pow(Math.exp(s),n)*(Math.exp(y[1])*y[0]*y[0]/2
                                                 +Math.exp(y[2])/(gam-1));
  let y=[U,lg,lp], J=0;
  for(let i=0;i<nsteps;i++){
    const f0=integrand(s,y);
    prof.push([Math.exp(s),y[0],Math.exp(y[1]),Math.exp(y[2])]);
    const k1=deriv(s,y), k2=deriv(s+ds/2,add(y,k1,ds/2));
    const k3=deriv(s+ds/2,add(y,k2,ds/2)), k4=deriv(s+ds,add(y,k3,ds));
    y=[y[0]+ds/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]),
       y[1]+ds/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]),
       y[2]+ds/6*(k1[2]+2*k2[2]+2*k3[2]+k4[2])];
    s+=ds;
    J+=-0.5*(f0+integrand(s,y))*ds;
  }
  const Pcore=Math.exp(y[2]);
  J+=Pcore*Math.pow(lmin,n)/(n*(gam-1));    /* analytic core tail */
  const gn=[2,2*Math.PI,4*Math.PI][n-1];
  const xi0=Math.pow(1/(gn*a*a*J),1/(n+2));
  const res={gam,n,alpha:a,xi0,J,prof,core:{lam:Math.exp(s),U:y[0],G:Math.exp(y[1]),P:Pcore}};
  _sedovCache.set(key,res);
  return res;
}
/* R_s(t) = xi0 (E t^2 / rho0)^(1/(n+2))  and its inverse */
const blastR=(t,E,rho0,S)=>S.xi0*Math.pow(E*t*t/rho0,1/(S.n+2));
const blastE=(t,R,rho0,S)=>rho0*Math.pow(R/S.xi0,S.n+2)/(t*t);
const blastD=(t,E,rho0,S)=>S.alpha*blastR(t,E,rho0,S)/t;      /* shock speed */
const KT_J=4.184e12;                                          /* 1 kt TNT, J */

/* ================================================================== *
 *  TAYLOR'S 1945 DATA                                                 *
 *  Radius of the luminous front against time, read by G. I. Taylor    *
 *  from the declassified Mack photographs of the 16 July 1945 Trinity *
 *  test and published as Table 1 of Taylor, "The formation of a blast *
 *  wave by a very intense explosion. II", Proc. R. Soc. A 201 (1950). *
 *  Reproduced here from the widely circulated transcription of that   *
 *  table, NOT from a copy of the paper — the sim's own fit is the     *
 *  check on it: it returns slope 0.406 against the predicted 0.400    *
 *  and a yield of 19.5 kt against Taylor's published "about 20 kt"    *
 *  (Atzeni Sec. 6.5.2) and the declassified 21 kt.                    *
 * ================================================================== */
const TAYLOR=[
  [0.10,11.1],[0.24,19.9],[0.38,25.4],[0.52,28.8],[0.66,31.9],[0.80,34.2],
  [0.94,36.3],[1.08,38.9],[1.22,41.0],[1.36,42.8],[1.50,44.4],[1.65,46.0],
  [1.79,46.9],[1.93,48.7],[3.26,59.0],[3.53,61.1],[3.80,62.9],[4.07,64.3],
  [4.34,65.6],[4.61,67.3],[15.0,106.5],[25.0,130.0],[34.0,145.0],[53.0,175.0],
  [62.0,185.0]];                                     /* t in ms, R in m */
/* Least squares on log R against log t over a chosen time window.
 *
 * THE SLOPE AND THE YIELD ARE TWO DIFFERENT QUESTIONS.  The slope is the test:
 * is the flow self-similar?  The intercept is the answer: how much energy?  And
 * the intercept must be read AT THE DATA, never extrapolated.  E goes like the
 * (n+2)th power of R, so an intercept read D decades away from the data carries
 * a slope error d as a factor 10^((n+2) D d) — over the three decades from 1 ms
 * to 1 s a slope wrong by 0.02 is a factor of 2 in the yield, and on the
 * narrowest windows this sim allows it reaches a factor of 400.  Measured on
 * the window 0.10-0.66 ms: reading the same fitted line at t = 1 s gives
 * 8872 kt; reading it at the centre of the window gives 13.2 kt.
 *
 * Reading it at the centroid also makes the estimator unambiguous: a
 * least-squares line passes through (mean log t, mean log R) by construction,
 * so the free-slope fit read at the centroid is IDENTICALLY equal to pinning
 * the slope at 2/(n+2) and fitting only the constant — which is what Taylor
 * did.  selfTest asserts the two agree to 1e-12, so there is no choice to make.
 */
function taylorFit(win,S,rho0){
  const pts=TAYLOR.filter(p=>p[0]>=win[0]-1e-9&&p[0]<=win[1]+1e-9);
  if(pts.length<2) return null;
  let sx=0,sy=0,sxx=0,sxy=0;
  for(const p of pts){ const x=Math.log10(p[0]*1e-3), y=Math.log10(p[1]);
    sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
  const N=pts.length, den=N*sxx-sx*sx;
  const slope=(N*sxy-sx*sy)/den, inter=(sy-slope*sx)/N;
  const xbar=sx/N, ybar=sy/N, th=S.alpha, interP=ybar-th*xbar;
  const E    =rho0*Math.pow(Math.pow(10,interP)/S.xi0,S.n+2);   /* slope pinned  */
  const Ecent=rho0*Math.pow(Math.pow(10,ybar)/S.xi0,S.n+2)
              /Math.pow(10,2*xbar);                             /* free, at data */
  const Eext =rho0*Math.pow(Math.pow(10,inter)/S.xi0,S.n+2);    /* extrapolated  */
  let ss=0; for(const p of pts){
    const r=Math.log10(p[1])-(slope*Math.log10(p[0]*1e-3)+inter); ss+=r*r; }
  /* an honest error bar: what each point in the window implies on its own */
  const Ei=pts.map(p=>taylorPointE(p,S,rho0));
  return {pts,N,slope,inter,interP,theory:th,E,Ecent,Eext,
          Elo:Math.min.apply(null,Ei),Ehi:Math.max.apply(null,Ei),
          rms:Math.sqrt(ss/N),xbar,ybar};
}
/* the yield each single point would imply on its own — this is what makes the
   self-similar window visible, because outside it the answer drifts */
const taylorPointE=(p,S,rho0)=>blastE(p[0]*1e-3,p[1],rho0,S);

/* ================================================================== *
 *  RAYLEIGH-TAYLOR                                                    *
 *  Atzeni & Meyer-ter-Vehn Ch. 8: eqs. 8.1/8.36 (growth rate),        *
 *  8.2 (Atwood), 8.35 (with surface tension), 8.160/8.161 and         *
 *  Table 8.2 (buoyancy-drag and its asymptotes), 8.164 (saturation),  *
 *  8.165 (third-order shape, Jacobs & Catton 1988).                   *
 * ================================================================== */
const atwood=(r2,r1)=>(r2-r1)/(r2+r1);
/* eq. 8.35 — real part only; imaginary sigma is a stable gravity wave */
function sigmaRT(lam,At,a,surf,rsum){
  const kk=TAU/lam, arg=At*a*kk-(surf?kk*kk*kk*surf/rsum:0);
  return arg>0?Math.sqrt(arg):0;
}
const sigmaClassical=(lam,At,a)=>Math.sqrt(Math.max(0,At*a*TAU/lam));
/* eq. 8.164 */
const zetaSat=(lam,At)=>(lam/(TAU*Math.sqrt(3)))*Math.sqrt(2/(At+1));
/* Table 8.2 — asymptotic bubble and spike speeds (Cdrag = 6 pi) */
const CDRAG=6*Math.PI;
const ubAsym=(lam,At,a)=>Math.sqrt((2*At/(1+At))*a*lam/CDRAG);
const usAsym=(lam,At,a)=>At>=1?Infinity:Math.sqrt((2*At/(1-At))*a*lam/CDRAG);
/* eq. 8.160 / 8.163 — integrate rather than assert the asymptote.
   (2 r2 + r1) du/dt = (r2 - r1) a - Cd r2 u^2 / lam        (bubble)
   (2 r1 + r2) du/dt = (r2 - r1) a - Cd r1 u^2 / lam        (spike, u>0 downward) */
function buoyancyDrag(lam,At,a,tmax,N,which){
  N=N||600;
  const r2=1+At, r1=1-At;                     /* any normalisation: only ratios enter */
  const inert=which==='spike'?(2*r1+r2):(2*r2+r1);
  const drag =which==='spike'?r1:r2;
  const dt=tmax/N; let u=0,h=0; const out=[[0,0,0]];
  for(let i=0;i<N;i++){
    const f=uu=>((r2-r1)*a-CDRAG*drag*uu*uu/lam)/inert;
    const k1=f(u), k2=f(u+dt/2*k1), k3=f(u+dt/2*k2), k4=f(u+dt*k3);
    const du=dt/6*(k1+2*k2+2*k3+k4);
    h+=dt*(u+du/2); u+=du;
    out.push([(i+1)*dt,h,u]);
  }
  return out;
}
/* eq. 8.165 — third order in k*zeta, At = 1.  This is what makes bubbles
   blunt and spikes sharp; to second order the rising vertex sits at
   zeta1 - k zeta1^2/2 and the falling one at zeta1 + k zeta1^2/2. */
function rtInterface(x,lam,z1){
  const kk=TAU/lam, q=kk*z1;
  return z1*((1-0.25*q*q)*Math.cos(kk*x)-0.5*q*Math.cos(2*kk*x)+0.375*q*q*Math.cos(3*kk*x));
}
/* NON-LINEAR MORPHOLOGY.  Eq. 8.165 is a third-order result: it is the shape
   in and just past the linear stage, and it is used there unchanged.  It must
   NOT simply be scaled up.  Stretching a sinusoid-like profile to ten times
   its own amplitude keeps its horizontal structure and multiplies its vertical
   curvature, so the blunt bubble crest that the third-order term exists to
   produce is turned into a spire — a picture of nothing.  A bubble is blunt
   precisely because its cap keeps a curvature set by the WAVELENGTH while the
   sides grow.
   Past saturation the profile is therefore built from the two things the model
   does supply: the tip positions (eq. 8.160, integrated, not asserted) and the
   bubble-cap curvature scale 3/k = 3λ/2π, which is the length appearing in the
   Layzer–Kull bubble equation 8.158.  With v the fraction of the way from the
   crest to the tip,
       z = h_b − (h_b + h_s) [ a v² + (1−a) v⁶ ],   a = πλ / 12(h_b + h_s)
   which passes through both tips exactly and has crest curvature 2π/3λ, i.e.
   cap radius 3λ/2π, at ANY amplitude: as the excursion grows a shrinks, the
   cap stays the same size and the sides lengthen.  The profile BETWEEN the
   tips is drawn, and says so on the canvas. */
const RT_CAP=3/TAU;                                /* R_cap / lambda */
function rtNonlinearShape(x,lam,hb,hs){
  const t=((x%lam)+lam)%lam, d=Math.min(t,lam-t), v=d/(lam/2);
  /* a is clamped only to keep the profile monotone; the cap radius is exact
     everywhere between the clamps, which is 0.002 <= a <= 1.5, i.e. up to an
     excursion of ~130 lambda — far beyond the point where a cap of 0.48 lambda
     is still a visible feature */
  const a=clamp(Math.PI*lam/(12*Math.max(hb+hs,1e-12)),0.002,1.5);
  return hb-(hb+hs)*(a*v*v+(1-a)*Math.pow(v,6));
}
/* linear stage with zero initial velocity is cosh, not exp */
const zetaLin=(z0,sig,t)=>z0*Math.cosh(sig*t);
/* turbulent bubble penetration, h_b = alpha At a t^2, alpha = 0.04-0.07 */
const hTurb=(al,At,a,t)=>al*At*a*t*t;

/* ================================================================== *
 *  PLOTTING PRIMITIVES                                                *
 * ================================================================== */
function niceTicks(lo,hi,n){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(1,n), mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag, out=[];
  for(let v=Math.ceil(lo/step-1e-9)*step; v<=hi+step*1e-9; v+=step)
    out.push(Math.abs(v)<step*1e-9?0:v);
  return out;
}
function logTicks(lo,hi){
  const out=[];
  for(let d=Math.floor(Math.log10(lo))-1; d<=Math.ceil(Math.log10(hi))+1; d++)
    for(let m=1;m<10;m++){ const v=m*Math.pow(10,d);
      if(v>=lo*(1-1e-12)&&v<=hi*(1+1e-12)) out.push({v,major:m===1}); }
  return out;
}
function fmtTick(v,log){
  if(v===0) return '0';
  const a=Math.abs(v);
  if(log||a>=1e4||a<1e-3){
    const e=Math.floor(Math.log10(a)), m=v/Math.pow(10,e);
    return (Math.abs(m-1)<1e-9?'10':(Math.abs(m-Math.round(m))<1e-9?Math.round(m):m.toFixed(1))+'·10')
           +sup(e);
  }
  if(a>=100) return v.toFixed(0);
  if(a>=10)  return v.toFixed(a%1?1:0);
  if(a>=1)   return v.toFixed(a%1?2:0);
  return v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
}
const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
            '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>(''+n).split('').map(c=>SUPS[c]||c).join('');

function makeAxes(rect,dom,opt){
  opt=opt||{};
  const lx=!!opt.logx, ly=!!opt.logy;
  const fx=v=>lx?Math.log10(v):v, fy=v=>ly?Math.log10(v):v;
  const x0=fx(dom.x0),x1=fx(dom.x1),y0=fy(dom.y0),y1=fy(dom.y1);
  if(!(isFinite(x0)&&isFinite(x1)&&isFinite(y0)&&isFinite(y1)&&x1!==x0&&y1!==y0))
    throw new Error('makeAxes: degenerate domain');
  return {rect,dom,logx:lx,logy:ly,
    X:v=>rect.x+(fx(v)-x0)/(x1-x0)*rect.w,
    Y:v=>rect.y+rect.h-(fy(v)-y0)/(y1-y0)*rect.h,
    invX:px=>{const u=(px-rect.x)/rect.w*(x1-x0)+x0; return lx?Math.pow(10,u):u;},
    invY:py=>{const u=(rect.y+rect.h-py)/rect.h*(y1-y0)+y0; return ly?Math.pow(10,u):u;},
    inside:(vx,vy)=>vx>=Math.min(dom.x0,dom.x1)&&vx<=Math.max(dom.x0,dom.x1)
                  &&vy>=Math.min(dom.y0,dom.y1)&&vy<=Math.max(dom.y0,dom.y1)};
}
/* Every data path is clipped to the axes frame.  Curves genuinely leave the
   box (the Fanno line runs to s = -infinity at both ends) and would otherwise
   be drawn straight through the tick labels.  Known-bad list, steam file. */
function clipTo(ctx,ax){
  ctx.save(); ctx.beginPath();
  ctx.rect(ax.rect.x,ax.rect.y,ax.rect.w,ax.rect.h); ctx.clip();
}
function drawFrame(ctx,ax,o){
  o=o||{}; const r=ax.rect;
  ctx.save();
  if(o.fill){ ctx.fillStyle=o.fill; ctx.fillRect(r.x,r.y,r.w,r.h); }
  ctx.strokeStyle='#232833'; ctx.lineWidth=1;
  ctx.font='10.5px -apple-system, sans-serif'; ctx.textBaseline='middle';
  const tx=ax.logx?logTicks(ax.dom.x0,ax.dom.x1):niceTicks(ax.dom.x0,ax.dom.x1,o.nx||6)
                     .map(v=>({v,major:true}));
  const ty=ax.logy?logTicks(ax.dom.y0,ax.dom.y1):niceTicks(ax.dom.y0,ax.dom.y1,o.ny||5)
                     .map(v=>({v,major:true}));
  for(const t of tx){ const X=ax.X(t.v); if(X<r.x-.5||X>r.x+r.w+.5) continue;
    ctx.strokeStyle=t.major?'#20242e':'#171a22'; ctx.beginPath();
    ctx.moveTo(X,r.y); ctx.lineTo(X,r.y+r.h); ctx.stroke();
    if(t.major){ ctx.fillStyle='#7b8394'; ctx.textAlign='center';
      ctx.fillText(fmtTick(t.v,ax.logx),X,r.y+r.h+12); } }
  for(const t of ty){ const Y=ax.Y(t.v); if(Y<r.y-.5||Y>r.y+r.h+.5) continue;
    ctx.strokeStyle=t.major?'#20242e':'#171a22'; ctx.beginPath();
    ctx.moveTo(r.x,Y); ctx.lineTo(r.x+r.w,Y); ctx.stroke();
    if(t.major){ ctx.fillStyle='#7b8394'; ctx.textAlign='right';
      ctx.fillText(fmtTick(t.v,ax.logy),r.x-7,Y); } }
  ctx.strokeStyle='#39404f'; ctx.lineWidth=1;
  ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);
  ctx.fillStyle='#98a1b3'; ctx.font='11.5px -apple-system, sans-serif';
  if(o.xlabel){ ctx.textAlign='center'; ctx.fillText(o.xlabel,r.x+r.w/2,r.y+r.h+29); }
  if(o.ylabel){ ctx.save(); ctx.translate(r.x-38,r.y+r.h/2); ctx.rotate(-Math.PI/2);
    ctx.textAlign='center'; ctx.fillText(o.ylabel,0,0); ctx.restore(); }
  if(o.title){ ctx.textAlign='left'; ctx.fillStyle='#cfd4de';
    ctx.font='600 11.5px -apple-system, sans-serif'; ctx.fillText(o.title,r.x,r.y-9); }
  ctx.restore();
}
/* Adaptive sampling: split the longest SCREEN segment until every segment is
   short.  Sampling uniformly in a parameter that is not uniform on screen is
   on the Known-bad list — the Fanno line crosses two decades of pressure in
   the last few percent of its Mach range. */
function adaptiveCurve(t0,t1,evalFn,maxSeg,maxPts,n0){
  maxSeg=maxSeg||6; maxPts=maxPts||900; n0=n0||24;
  let pts=[]; for(let i=0;i<=n0;i++){ const t=t0+(t1-t0)*i/n0; pts.push({t,p:evalFn(t)}); }
  const d2=(a,b)=>{ if(!a.p||!b.p) return 0;
    const dx=a.p[0]-b.p[0], dy=a.p[1]-b.p[1]; return dx*dx+dy*dy; };
  const lim=maxSeg*maxSeg;
  while(pts.length<maxPts){
    let worst=-1, wi=-1;
    for(let i=0;i<pts.length-1;i++){ const d=d2(pts[i],pts[i+1]); if(d>worst){worst=d; wi=i;} }
    if(worst<=lim||wi<0) break;
    const tm=0.5*(pts[wi].t+pts[wi+1].t);
    pts.splice(wi+1,0,{t:tm,p:evalFn(tm)});
  }
  return pts;
}
function strokeCurve(ctx,pts,style,width,dash){
  ctx.save();
  ctx.strokeStyle=style; ctx.lineWidth=width||1.6; ctx.lineJoin='round'; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); let pen=false;
  for(const q of pts){ const p=q.p||q;
    if(!p||!isFinite(p[0])||!isFinite(p[1])){ pen=false; continue; }
    if(pen) ctx.lineTo(p[0],p[1]); else { ctx.moveTo(p[0],p[1]); pen=true; } }
  ctx.stroke(); ctx.restore();
}
function dot(ctx,x,y,r,fill,ring){
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=fill; ctx.fill();
  if(ring){ ctx.lineWidth=1.4; ctx.strokeStyle=ring; ctx.stroke(); } ctx.restore();
}
function label(ctx,x,y,text,col,font,align,base){
  ctx.save(); ctx.fillStyle=col||'#cfd4de';
  ctx.font=font||'11.5px -apple-system, sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline=base||'middle';
  ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=4;
  ctx.fillText(text,x,y); ctx.restore();
}
function badge(ctx,x,y,text,col){
  ctx.save(); ctx.font='600 10.5px -apple-system, sans-serif';
  const w=ctx.measureText(text).width+11;
  ctx.fillStyle='rgba(7, 11, 24,.82)'; ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y-8.5,w,17,8):ctx.rect(x,y-8.5,w,17);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle=col; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(text,x+5.5,y+.5); ctx.restore();
  return w;
}

/* ================================================================== *
 *  VIEW 1 — THE JUMP                                                  *
 *  Fanno x Rayleigh on the h-s plane, Fig. 9.34 computed not sketched. *
 * ================================================================== */
function jumpGeometry(st,W,H){
  const RIGHT=336;
  const plot={x:74,y:56,w:Math.max(180,W-RIGHT-96),h:Math.max(140,H-56-64)};
  /* bottom-right, NOT top-right: the readout is an HTML overlay pinned to the
     top-right corner and is ~460 px tall on this view */
  const cvh=Math.min(196,Math.max(120,H*0.26));
  const cv={x:W-RIGHT+10,y:Math.max(300,H-cvh-26),w:RIGHT-30,h:cvh};
  return {plot,cv};
}
function jumpCurves(st){
  const k=st.k, Mx=st.Mx;
  const Mlo=0.06, Mhi=Math.max(3.2,Mx+1.0);
  const F=M=>fannoAt(M,Mx,k), R=M=>rayleighAt(M,Mx,k);
  const sF=fannoSonic(Mx,k), sR=rayleighSonic(Mx,k);
  const y=shock(Mx,k);
  const yF=fannoAt(y.My,Mx,k);
  return {Mlo,Mhi,F,R,sF,sR,y,yF,x:F(Mx),xR:R(Mx)};
}
/* The frame is set by the four states the picture is ABOUT — x, y and the two
   sonic points — not by the sweep.  Both lines run to s = −∞ at both ends, so
   letting the sweep set the domain squashes everything interesting into a
   tenth of the frame (measured: 1.3 of 7.0 axis units at the default Mx). The
   tails are clipped instead, which is what the clip is for. */
function jumpDomain(C){
  let smin=Infinity,smax=-Infinity,hmax=1.06;
  for(const q of [C.x,C.yF,C.sF,C.sR]){
    smin=Math.min(smin,q.dsR); smax=Math.max(smax,q.dsR); hmax=Math.max(hmax,q.hh0); }
  const w=Math.max(smax-smin,0.35);
  return {x0:smin-1.55*w,x1:smax+0.50*w,y0:0,
          y1:Math.max(1.10,Math.min(hmax*1.07,1.75))};
}
function drawJump(ctx,W,H,st){
  const G=jumpGeometry(st,W,H), C=jumpCurves(st), k=st.k;
  const ax=makeAxes(G.plot,jumpDomain(C));
  drawFrame(ctx,ax,{xlabel:'(s − sₓ) / R',ylabel:'h / h₀',
                    title:'Fanno × Rayleigh — the two roots of eqs. 9.46–9.48',
                    fill:'rgba(255,255,255,.012)',nx:6,ny:6});
  clipTo(ctx,ax);
  /* constant stagnation enthalpy — unchanged across the shock (eq. 9.47b) */
  ctx.save(); ctx.strokeStyle=rgba('#6f7789',.55); ctx.lineWidth=1; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(ax.rect.x,ax.Y(1)); ctx.lineTo(ax.rect.x+ax.rect.w,ax.Y(1));
  ctx.stroke(); ctx.restore();

  const proj=g=>M=>{ const q=g(M); return isFinite(q.dsR)?[ax.X(q.dsR),ax.Y(q.hh0)]:null; };
  if(st.showRayleigh)
    strokeCurve(ctx,adaptiveCurve(C.Mlo,C.Mhi,proj(C.R)),rgba('#cd35c4',.95),1.9);
  if(st.showFanno)
    strokeCurve(ctx,adaptiveCurve(C.Mlo,C.Mhi,proj(C.F)),rgba('#b8ec4c',.95),1.9);

  /* the two velocity heads, drawn as the gaps below h0 */
  if(st.showHeads){
    ctx.save(); ctx.strokeStyle=rgba('#8b93a6',.75); ctx.lineWidth=1;
    /* label x's head on the LEFT and y's on the RIGHT so neither sits on the
       chord that joins them */
    for(const [q,lab,side] of [[C.x,'Vₓ²/2',-1],[C.yF,'Vᵧ²/2',1]]){
      const X=ax.X(q.dsR); ctx.beginPath(); ctx.moveTo(X,ax.Y(1)); ctx.lineTo(X,ax.Y(q.hh0));
      ctx.stroke();
      label(ctx,X+side*7,(ax.Y(1)+ax.Y(q.hh0))/2,lab,'#8b93a6',
            'italic 11px Georgia, serif',side<0?'right':'left'); }
    ctx.restore();
  }
  /* sonic points: the maximum-entropy point of each line is M = 1 */
  dot(ctx,ax.X(C.sR.dsR),ax.Y(C.sR.hh0),3.6,'#070b18','#cd35c4');
  dot(ctx,ax.X(C.sF.dsR),ax.Y(C.sF.hh0),3.6,'#070b18','#b8ec4c');
  label(ctx,ax.X(C.sR.dsR)+7,ax.Y(C.sR.hh0),'a','#cd35c4','italic 13px Georgia, serif');
  label(ctx,ax.X(C.sF.dsR)+7,ax.Y(C.sF.hh0),'b','#b8ec4c','italic 13px Georgia, serif');
  /* the two intersections */
  const px=[ax.X(C.x.dsR),ax.Y(C.x.hh0)], py=[ax.X(C.yF.dsR),ax.Y(C.yF.hh0)];
  ctx.save(); ctx.strokeStyle=rgba('#ff5a4a',.9); ctx.lineWidth=2.2; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(px[0],px[1]); ctx.lineTo(py[0],py[1]); ctx.stroke(); ctx.restore();
  dot(ctx,px[0],px[1],5,'#5ac8e0','#070b18');
  dot(ctx,py[0],py[1],5,'#e8a33a','#070b18');
  ctx.restore();                                   /* end clip */

  label(ctx,px[0]-9,px[1]+2,'x','#5ac8e0','italic 15px Georgia, serif','right');
  label(ctx,py[0]+9,py[1]-1,'y','#e8a33a','italic 15px Georgia, serif','left');
  const mid=[(px[0]+py[0])/2,(px[1]+py[1])/2];
  label(ctx,mid[0]+8,mid[1]+12,'the shock','#ff5a4a','italic 12px Georgia, serif');
  /* branch key */
  let bx=ax.rect.x+9, by=ax.rect.y+14;
  label(ctx,bx,by,'M < 1 on the upper branches','#8b93a6','10.5px -apple-system, sans-serif');
  label(ctx,bx,by+15,'M > 1 on the lower branches','#8b93a6','10.5px -apple-system, sans-serif');
  label(ctx,bx,by+30,'maximum s on each line is exactly M = 1','#6f7789',
        'italic 10.5px Georgia, serif');

  drawControlVolume(ctx,G.cv,st,C);
}
/* Fig. 9.33 — the control volume, with the arrows to scale in V */
function drawControlVolume(ctx,r,st,C){
  const k=st.k, y=C.y;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.02)'; ctx.strokeStyle='#232833'; ctx.lineWidth=1;
  ctx.fillRect(r.x,r.y,r.w,r.h); ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);
  const hw=Math.min(34,Math.max(18,r.h*0.19));
  const cy=r.y+r.h*0.44, xs=r.x+r.w*0.52;
  /* duct walls */
  ctx.strokeStyle='#39404f'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(r.x+14,cy-hw); ctx.lineTo(r.x+r.w-14,cy-hw);
  ctx.moveTo(r.x+14,cy+hw); ctx.lineTo(r.x+r.w-14,cy+hw); ctx.stroke();
  /* the shock itself */
  ctx.save(); ctx.strokeStyle='#ff5a4a'; ctx.lineWidth=2.4;
  ctx.shadowColor=rgba('#ff5a4a',.7); ctx.shadowBlur=9;
  ctx.beginPath(); ctx.moveTo(xs,cy-hw); ctx.lineTo(xs,cy+hw); ctx.stroke(); ctx.restore();
  /* velocity arrows: length proportional to V, i.e. to 1/rho */
  const Vscale=Math.min(r.w*0.3,54);
  const arrow=(x0,dir,len,col,lab,sub)=>{
    ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x0,cy); ctx.lineTo(x0+dir*len,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0+dir*len,cy);
    ctx.lineTo(x0+dir*(len-8),cy-4.5); ctx.lineTo(x0+dir*(len-8),cy+4.5); ctx.closePath(); ctx.fill();
    ctx.restore();
    label(ctx,x0+dir*len/2,cy-13,lab,col,'italic 12.5px Georgia, serif','center');
    label(ctx,x0+dir*len/2,cy+15,sub,'#8b93a6','10.5px -apple-system, sans-serif','center');
  };
  /* y.V IS Vy/Vx (= 1/(rho_y/rho_x)), so the downstream arrow is Vscale TIMES
     it.  Dividing drew the slower stream as the longer arrow — at Mx = 2 that
     is 144 px of "slowed down" against 54 px of "supersonic". */
  arrow(r.x+22,1,Vscale,'#5ac8e0','Vₓ','M = '+st.Mx.toFixed(2));
  arrow(xs+12,1,Math.max(10,Vscale*y.V),'#e8a33a','Vᵧ','M = '+y.My.toFixed(3));
  /* density shading either side */
  ctx.save(); ctx.globalAlpha=.5;
  ctx.fillStyle=rgba('#5ac8e0',.10); ctx.fillRect(r.x+14,cy-hw,xs-r.x-14,2*hw);
  ctx.fillStyle=rgba('#e8a33a',clamp(.05*y.rho,.05,.30));
  ctx.fillRect(xs,cy-hw,r.x+r.w-14-xs,2*hw);
  ctx.restore();
  label(ctx,r.x+12,r.y+14,'control volume enclosing the shock','#8b93a6',
        '600 10.5px -apple-system, sans-serif');
  label(ctx,r.x+12,r.y+r.h-40,'ρᵧ/ρₓ = '+y.rho.toFixed(3)
        +'   pᵧ/pₓ = '+y.p.toFixed(3),'#cfd4de','11px "SF Mono", Menlo, monospace');
  label(ctx,r.x+12,r.y+r.h-24,'Tᵧ/Tₓ = '+y.T.toFixed(3)
        +'   p₀ᵧ/p₀ₓ = '+y.p0.toFixed(4),'#cfd4de','11px "SF Mono", Menlo, monospace');
  label(ctx,r.x+12,r.y+r.h-8,'thickness ≈ 10⁻⁵ cm — drawn thick',
        '#6f7789','italic 10.5px Georgia, serif');
  ctx.restore();
}

/* ================================================================== *
 *  VIEW 2 — THE NOZZLE                                                *
 * ================================================================== */
function nozzleGeometry(st,W,H){
  const RIGHT=336, L=74, Rr=Math.max(200,W-RIGHT-96);
  const duct={x:L,y:52,w:Rr,h:Math.max(90,(H-130)*0.40)};
  const plot={x:L,y:duct.y+duct.h+42,w:Rr,h:Math.max(110,(H-130)-duct.h-52)};
  return {duct,plot,RIGHT};
}
/* The band colour is PRE-MIXED against the page background rather than drawn
   at globalAlpha < 1.  The bands are widened by SEAM so that abutting quads do
   not leave a sub-pixel gap that antialiases into a visible vertical stripe —
   but with alpha < 1 the overlap composites twice and paints a stripe of its
   own, brighter instead of darker.  Opaque colour makes the overlap invisible.
   selfTest asserts the BRIGHTNESS of each band, not that the colour string is
   well formed: rgb(0,0,0) is well formed. (Known-bad list, steam file.) */
function nozzleBandColour(q){
  const base=q.post ? mix('#e8a33a','#8a3a2a',clamp(1-q.M/0.9,0,1))
        : (q.M<1 ? mix('#1b3550','#5ac8e0',clamp(q.M,0,1))
                 : mix('#5ac8e0','#0e2a3a',clamp((q.M-1)/2,0,1)));
  return mix('#070b18',base,0.72);
}
function drawNozzle(ctx,W,H,st){
  const G=nozzleGeometry(st,W,H), sol=nozzleSolve(st), prof=nozzleProfile(st,sol,260);
  /* ---- the duct ---- */
  const d=G.duct, cy=d.y+d.h/2;
  const rmax=Math.sqrt(Math.max(st.Ai,st.Ae));
  const half=u=>d.h/2*0.92*Math.sqrt(nozzleArea(u,st))/rmax;
  const XU=u=>d.x+u*d.w;
  ctx.save();
  /* Fill, coloured by Mach number.  Each quad is widened by SEAM past its right
     edge: abutting quads leave a sub-pixel gap that antialiases to a visible
     vertical stripe across the whole duct, and 260 of them read as corduroy
     rather than as a smooth field.  The overlap is hidden by the next quad
     except at the shock, where the next quad is a different colour anyway. */
  const SEAM=0.7;
  for(let i=0;i<prof.length-1;i++){
    const a=prof[i],b=prof[i+1];
    ctx.fillStyle=nozzleBandColour(a);
    const x0=XU(a.u), x1=XU(b.u)+(a.post===b.post?SEAM:0);
    ctx.beginPath();
    ctx.moveTo(x0,cy-half(a.u)); ctx.lineTo(x1,cy-half(b.u));
    ctx.lineTo(x1,cy+half(b.u)); ctx.lineTo(x0,cy+half(a.u)); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle='#5b6577'; ctx.lineWidth=1.6;
  ctx.beginPath();
  for(let i=0;i<prof.length;i++){ const u=prof[i].u, X=XU(u), Yy=cy-half(u);
    i?ctx.lineTo(X,Yy):ctx.moveTo(X,Yy); }
  ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<prof.length;i++){ const u=prof[i].u, X=XU(u), Yy=cy+half(u);
    i?ctx.lineTo(X,Yy):ctx.moveTo(X,Yy); }
  ctx.stroke();
  /* throat marker */
  ctx.strokeStyle=rgba('#8b93a6',.5); ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(XU(st.xt),cy-half(st.xt)-8); ctx.lineTo(XU(st.xt),cy+half(st.xt)+8);
  ctx.stroke(); ctx.setLineDash([]);
  label(ctx,XU(st.xt),cy+half(st.xt)+19,'throat','#8b93a6','10.5px -apple-system, sans-serif','center');
  /* the shock */
  if(sol.shockU!=null){
    const X=XU(sol.shockU);
    ctx.save(); ctx.strokeStyle='#ff5a4a'; ctx.lineWidth=2.6;
    ctx.shadowColor=rgba('#ff5a4a',.8); ctx.shadowBlur=11;
    ctx.beginPath(); ctx.moveTo(X,cy-half(sol.shockU)); ctx.lineTo(X,cy+half(sol.shockU));
    ctx.stroke(); ctx.restore();
    badge(ctx,X+7,d.y+13,'Mₓ = '+sol.Mx.toFixed(3)+' → '+sol.My.toFixed(3),'#ff5a4a');
  } else if(sol.regime==='shockExit'){
    const X=XU(1);
    ctx.save(); ctx.strokeStyle='#ff5a4a'; ctx.lineWidth=2.6; ctx.beginPath();
    ctx.moveTo(X,cy-half(1)); ctx.lineTo(X,cy+half(1)); ctx.stroke(); ctx.restore();
  }
  /* plume outside the exit for the over/under-expanded cases */
  if(sol.regime==='over'||sol.regime==='under'){
    const X=XU(1), hh=half(1), over=sol.regime==='over';
    ctx.save(); ctx.strokeStyle=over?rgba('#ff5a4a',.55):rgba('#5ac8e0',.55); ctx.lineWidth=1.4;
    for(let i=1;i<=3;i++){ const dx=i*13;
      ctx.beginPath();
      ctx.moveTo(X,cy-hh); ctx.lineTo(X+dx,cy-hh*(over?1-0.16*i:1+0.16*i));
      ctx.moveTo(X,cy+hh); ctx.lineTo(X+dx,cy+hh*(over?1-0.16*i:1+0.16*i));
      ctx.stroke(); }
    ctx.restore();
    label(ctx,X+8,cy-hh-16,over?'oblique shocks':'expansion fans',
          over?'#ff5a4a':'#5ac8e0','italic 11px Georgia, serif');
  }
  ctx.restore();
  label(ctx,d.x,d.y-10,'nozzle — cool shading is |M − 1|, brightest at the sonic point; '
        +'warm is after the shock',
        '#cfd4de','600 11.5px -apple-system, sans-serif');

  /* ---- the pressure plot ---- */
  const ax=makeAxes(G.plot,{x0:0,x1:1,y0:0,y1:1.02});
  drawFrame(ctx,ax,{xlabel:'position along the nozzle',ylabel:'p / p₀',
                    title:'pressure distribution — the whole family of Fig. 9.32',
                    fill:'rgba(255,255,255,.012)',nx:5,ny:5});
  clipTo(ctx,ax);
  /* the faint family: one curve per back pressure */
  if(st.showFamily){
    for(let i=1;i<=13;i++){
      const s2=nozzleSolve(Object.assign({},st,{pbr:i/14}));
      const pr=nozzleProfile(st,s2,120);
      strokeCurve(ctx,pr.map(q=>[ax.X(q.u),ax.Y(q.pr)]),rgba('#6c778c',.62),1);
    }
  }
  /* the critical back pressures — labelled on the right, where the active
     curve has already left the frame, rather than on top of it */
  for(const [p,col,lab] of [[sol.p1,'#8b93a6','p₁ choked'],
                            [sol.p2,'#ff5a4a','p₂ shock at exit'],
                            [sol.p3,'#5ac8e0','p₃ design']]){
    ctx.save(); ctx.strokeStyle=rgba(col,.5); ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(ax.rect.x,ax.Y(p)); ctx.lineTo(ax.rect.x+ax.rect.w,ax.Y(p));
    ctx.stroke(); ctx.restore();
    label(ctx,ax.rect.x+ax.rect.w-5,ax.Y(p)-8,lab,col,'10px -apple-system, sans-serif','right');
  }
  /* the active curve, split at the shock so the discontinuity is visible */
  const pre=prof.filter(q=>!q.post), post=prof.filter(q=>q.post);
  strokeCurve(ctx,pre.map(q=>[ax.X(q.u),ax.Y(q.pr)]),'#b8ec4c',2.3);
  if(post.length) strokeCurve(ctx,post.map(q=>[ax.X(q.u),ax.Y(q.pr)]),'#e8a33a',2.3);
  if(sol.shockU!=null&&pre.length&&post.length){
    const X=ax.X(sol.shockU), a=pre[pre.length-1], b=post[0];
    ctx.save(); ctx.strokeStyle='#ff5a4a'; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(X,ax.Y(a.pr)); ctx.lineTo(X,ax.Y(b.pr)); ctx.stroke(); ctx.restore();
  }
  /* back pressure */
  ctx.save(); ctx.strokeStyle='#cd35c4'; ctx.lineWidth=1.6; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(ax.rect.x,ax.Y(st.pbr)); ctx.lineTo(ax.rect.x+ax.rect.w,ax.Y(st.pbr));
  ctx.stroke(); ctx.restore();
  ctx.restore();                                   /* end clip */
  /* on the LEFT: the right-hand edge is where the active curve ends */
  label(ctx,ax.rect.x+5,ax.Y(st.pbr)-9,'back pressure','#cd35c4',
        'italic 11.5px Georgia, serif');
}

/* ================================================================== *
 *  VIEW 3 — THE BLAST                                                 *
 * ================================================================== */
function blastGeometry(st,W,H){
  const RIGHT=336, L=76, Lw=Math.max(220,W-RIGHT-100);
  const main={x:L,y:56,w:Lw,h:Math.max(120,(H-138)*0.60)};
  const strip={x:L,y:main.y+main.h+50,w:Lw,h:Math.max(80,(H-138)-main.h-56)};
  /* bottom-right: the readout overlay owns the top-right corner */
  const ph=Math.min(206,Math.max(130,H*0.25));
  const prof={x:W-RIGHT+22,y:Math.max(300,H-ph-46),w:RIGHT-46,h:ph};
  return {main,strip,prof};
}
function drawBlast(ctx,W,H,st){
  const G=blastGeometry(st,W,H);
  const S=sedov(st.gamB,st.ndim), rho0=st.rho0;
  const fit=taylorFit([st.winLo,st.winHi],S,rho0);

  /* ---- main: log R against log t ---- */
  const ax=makeAxes(G.main,{x0:0.05,x1:120,y0:7,y1:300},{logx:true,logy:true});
  drawFrame(ctx,ax,{xlabel:'t  (ms)',ylabel:'R  (m)',
    title:'Taylor 1945 — shock radius against time, both logarithmic',
    fill:'rgba(255,255,255,.012)'});
  clipTo(ctx,ax);
  /* the fit window */
  if(fit){
    ctx.save(); ctx.fillStyle=rgba('#b8ec4c',.055);
    ctx.fillRect(ax.X(st.winLo),ax.rect.y,ax.X(st.winHi)-ax.X(st.winLo),ax.rect.h);
    ctx.strokeStyle=rgba('#b8ec4c',.35); ctx.lineWidth=1; ctx.setLineDash([3,3]);
    for(const v of [st.winLo,st.winHi]){ ctx.beginPath();
      ctx.moveTo(ax.X(v),ax.rect.y); ctx.lineTo(ax.X(v),ax.rect.y+ax.rect.h); ctx.stroke(); }
    ctx.restore();
  }
  /* the theoretical slope through the fitted intercept — a straight line on
     these axes if and only if the flow is self-similar */
  if(fit){
    const line=(inter,slope,col,w,dash)=>{
      const pts=[];
      for(let i=0;i<=60;i++){ const lt=Math.log10(0.05)+ (Math.log10(120)-Math.log10(0.05))*i/60;
        const tt=Math.pow(10,lt), R=Math.pow(10,inter+slope*Math.log10(tt*1e-3));
        pts.push([ax.X(tt),ax.Y(R)]); }
      strokeCurve(ctx,pts,col,w,dash);
    };
    line(fit.interP,fit.theory,rgba('#5ac8e0',.85),1.6,[6,4]);
    line(fit.inter,fit.slope,'#b8ec4c',2.1);
  }
  /* the data */
  for(const p of TAYLOR){
    const inWin=p[0]>=st.winLo-1e-9&&p[0]<=st.winHi+1e-9;
    dot(ctx,ax.X(p[0]),ax.Y(p[1]),inWin?4:3,inWin?'#e8a33a':'rgba(139,147,166,.55)','#070b18');
  }
  ctx.restore();                                   /* end clip */
  if(fit){
    const bw=228, bx0=ax.rect.x+ax.rect.w-bw-8, by0=ax.rect.y+ax.rect.h-62;
    ctx.save();
    ctx.fillStyle='rgba(7, 11, 24,.80)'; ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=1;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx0,by0,bw,54,7); else ctx.rect(bx0,by0,bw,54);
    ctx.fill(); ctx.stroke(); ctx.restore();
    label(ctx,bx0+bw-9,by0+15,'fitted slope  '+fit.slope.toFixed(4),
      '#b8ec4c','11.5px "SF Mono", Menlo, monospace','right');
    label(ctx,bx0+bw-9,by0+30,'theory  2/(n+2) = '+S.alpha.toFixed(4),
      '#5ac8e0','11.5px "SF Mono", Menlo, monospace','right');
    label(ctx,bx0+bw-9,by0+44,fit.N+' pts, rms '+(fit.rms*100).toFixed(2)+'% in log R',
      '#8b93a6','10.5px -apple-system, sans-serif','right');
  }
  if(st.showMatrix) drawDimMatrix(ctx,ax.rect.x+10,ax.rect.y+10,st,S);

  /* ---- strip: the yield each point implies on its own ---- */
  const Es=TAYLOR.map(p=>taylorPointE(p,S,rho0)/KT_J);
  const eMax=Math.max.apply(null,Es), eLo=0, eHi=Math.max(28,eMax*1.12);
  const bx=makeAxes(G.strip,{x0:0.05,x1:120,y0:eLo,y1:eHi},{logx:true});
  drawFrame(ctx,bx,{xlabel:'t  (ms)',ylabel:'E  (kt)',
    title:'the yield each single point would imply — flat exactly where the flow is self-similar',
    fill:'rgba(255,255,255,.012)',ny:4});
  clipTo(ctx,bx);
  if(fit){
    ctx.save(); ctx.fillStyle=rgba('#b8ec4c',.055);
    ctx.fillRect(bx.X(st.winLo),bx.rect.y,bx.X(st.winHi)-bx.X(st.winLo),bx.rect.h); ctx.restore();
    ctx.save(); ctx.strokeStyle='#b8ec4c'; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(bx.rect.x,bx.Y(fit.E/KT_J));
    ctx.lineTo(bx.rect.x+bx.rect.w,bx.Y(fit.E/KT_J)); ctx.stroke(); ctx.restore();
  }
  strokeCurve(ctx,TAYLOR.map((p,i)=>[bx.X(p[0]),bx.Y(Es[i])]),rgba('#e8a33a',.55),1.3);
  TAYLOR.forEach((p,i)=>{
    const inWin=p[0]>=st.winLo-1e-9&&p[0]<=st.winHi+1e-9;
    dot(ctx,bx.X(p[0]),bx.Y(Es[i]),inWin?3.6:2.6,inWin?'#e8a33a':'rgba(139,147,166,.5)','#070b18'); });
  ctx.restore();
  label(ctx,bx.rect.x+7,bx.rect.y+bx.rect.h-11,
    'left: not yet a point explosion.   right: the shock has weakened and the ambient '
    +'pressure is no longer negligible.','#6f7789','italic 10.5px Georgia, serif');

  /* ---- the Sedov interior ---- */
  if(st.showSedov) drawSedovProfiles(ctx,G.prof,S);
}
/* The Pi-theorem, turned live: matrix in, exponents out. */
function drawDimMatrix(ctx,x,y,st,S){
  const D=dimMatrix(st.ndim,st.kappa), e=blastExponents(st.ndim,st.kappa);
  const w=232,hh=112;
  ctx.save();
  ctx.fillStyle='rgba(7, 11, 24,.80)'; ctx.strokeStyle='#2a2f3d'; ctx.lineWidth=1;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,hh,7); else ctx.rect(x,y,w,hh);
  ctx.fill(); ctx.stroke();
  label(ctx,x+10,y+14,'dimensional matrix','#98a1b3','600 10.5px -apple-system, sans-serif');
  const cx=[x+64,x+108,x+152], cy0=y+32;
  ctx.font='11px "SF Mono", Menlo, monospace';
  D.cols.forEach((c,j)=>label(ctx,cx[j],cy0,c,'#8b93a6','italic 11.5px Georgia, serif','center'));
  D.rows.forEach((r,i)=>{
    label(ctx,x+34,cy0+16+i*15,r,'#8b93a6','italic 11.5px Georgia, serif','right');
    D.M[i].forEach((v,j)=>label(ctx,cx[j],cy0+16+i*15,
      (Math.round(v*100)/100).toString(),'#cfd4de','11px "SF Mono", Menlo, monospace','center'));
    label(ctx,x+w-14,cy0+16+i*15,'= '+D.rhs[i],'#6f7789',
          '11px "SF Mono", Menlo, monospace','right');
  });
  const ex=v=>{ const q=Math.round(v*1000)/1000;
    const den=st.ndim+ (st.kappa||0) +2;
    const num=Math.round(v*den);
    return Math.abs(num/den-v)<1e-9?(num+'/'+den):q.toFixed(3); };
  label(ctx,x+10,y+hh-14,'R ∝ t'+sup(ex(e.t))+'  E'+sup(ex(e.E))+'  ρ₀'+sup(ex(e.A)),
        '#b8ec4c','12px "SF Mono", Menlo, monospace');
  ctx.restore();
}
function drawSedovProfiles(ctx,r,S){
  const ax=makeAxes(r,{x0:0,x1:1,y0:0,y1:1.06});
  drawFrame(ctx,ax,{xlabel:'r / R(t)',ylabel:'/ post-shock',
    title:'Sedov interior, γ = '+S.gam.toFixed(3)+',  ξ₀ = '+S.xi0.toFixed(6),
    fill:'rgba(255,255,255,.012)',nx:4,ny:4});
  clipTo(ctx,ax);
  const P=S.prof, G1=P[0][2], P1=P[0][3], U1=P[0][1];
  const series=[[2,G1,'#5ac8e0','ρ'],[3,P1,'#ff5a4a','p'],[1,U1,'#b8ec4c','u']];
  for(const [idx,ref,col,nm] of series){
    const pts=[];
    for(let i=P.length-1;i>=0;i--){ const q=P[i];
      pts.push([ax.X(q[0]),ax.Y(q[idx]/ref)]); }
    strokeCurve(ctx,pts,col,1.8);
  }
  ctx.restore();
  let lx=r.x+8;
  for(const [ ,,col,nm] of series){
    label(ctx,lx,r.y+13,nm,col,'italic 13px Georgia, serif'); lx+=19; }
  label(ctx,r.x+r.w-6,r.y+13,'ρ→0, p→const at the centre','#6f7789',
        'italic 10px Georgia, serif','right');
  /* xi0 lives in the panel title: every corner of this plot has a curve in it
     (rho climbs from 0 to 1 inside the last tenth of the radius) */
}

/* ================================================================== *
 *  VIEW 4 — THE MUSHROOM                                              *
 * ================================================================== */
function rtState(st){
  const r=st.rhoRatio, At=atwood(1,r);            /* heavy = 1, light = r */
  const a=st.aRT, lam=st.lam, t=st.tRT;
  const sig=sigmaRT(lam,At,a,st.surf,1+r);
  const zsat=zetaSat(lam,At);
  /* linear stage, zero initial velocity => cosh */
  const zLin=zetaLin(st.z0,sig,t);
  let tsat=Infinity;
  if(sig>0&&zsat>st.z0) tsat=Math.acosh(zsat/st.z0)/sig;
  const nonlinear=t>tsat;
  let hb,hs,ub,us;
  if(!nonlinear){ hb=hs=Math.min(zLin,zsat); ub=us=sig*hb; }
  else{
    const dt=t-tsat;
    const B=buoyancyDrag(lam,At,a,dt,400,'bubble');
    const Sp=buoyancyDrag(lam,At,a,dt,400,'spike');
    hb=zsat+B[B.length-1][1]; ub=B[B.length-1][2];
    hs=zsat+Sp[Sp.length-1][1]; us=Sp[Sp.length-1][2];
  }
  return {At,a,lam,t,sig,zsat,zLin,tsat,nonlinear,hb,hs,ub,us,
          ubInf:ubAsym(lam,At,a),usInf:usAsym(lam,At,a),
          hMix:hTurb(st.alphaMix,At,a,t)};
}
function mushGeometry(st,W,H){
  const RIGHT=336, L=76, Lw=Math.max(240,W-RIGHT-100);
  const box={x:L,y:52,w:Lw,h:Math.max(150,(H-132)*0.58)};
  /* 78 px of gutter, not 34: the right plot's y-label sits 38 px left of its
     frame and its tick labels 7 px left, so a narrow gutter puts them on top
     of the left plot's frame */
  const GUT=78, gw=(Lw-GUT)/2;
  const disp={x:L,y:box.y+box.h+46,w:gw,h:Math.max(90,(H-132)-box.h-52)};
  const amp ={x:L+gw+GUT,y:disp.y,w:gw,h:disp.h};
  return {box,disp,amp};
}
/* ---- the interface, as geometry, separated from the drawing ----------------
   EQUAL ASPECT IS NOT OPTIONAL HERE.  A bubble and a spike are distinguished
   by their SHAPE — blunt against sharp — so a picture drawn with different x
   and y scales is not a picture of the interface at all.  At the default
   settings and t = 22 s the excursion is 818 m against a 120 m wavelength, so
   fitting both to a wide box independently squashes the vertical by 7.7x and
   turns every mushroom into a flat-topped mesa.  There is therefore ONE scale,
   and the field of view widens as the excursion grows: at late times you are
   standing further back, which is also when the coarsening argument wants more
   wavelengths on screen.  selfTest measures the aspect ratio of the emitted
   polyline against the world coordinates it came from.                       */
const SPAN_MAX_LAM=9;      /* never show more than this many λ vertically */
function rtBoxScale(r,st,R){
  const want=(R.hb+R.hs)*1.18+st.lam*0.30;
  /* Equal aspect is kept unconditionally; what gives instead is the field of
     view.  At A_t → 1 the spike accelerates at a, so by t = 60 s it is 32 km
     long against a 120 m wavelength — 270 wavelengths.  Showing all of it at
     equal aspect would mean 700 wavelengths across the box, so the vertical
     span is capped and the spikes simply run off the bottom, which is what a
     long thin jet does.  The alternative, squashing the vertical, would draw a
     shape that is not the interface. */
  const span=Math.min(want,st.lam*SPAN_MAX_LAM);
  const s=Math.min(r.w/(1.7*st.lam),r.h/span);
  /* tile enough wavelengths to cover the box, so the fill never has to be
     closed across empty space; the +1 guarantees the span exceeds r.w */
  const NW=clamp(Math.ceil(r.w/(s*st.lam))+1,1,64);
  return {s,NW,worldW:NW*st.lam,span,clipped:want>span*1.001};
}
function rtInterfacePoints(r,st,R){
  const B=rtBoxScale(r,st,R);
  const cx=r.x+r.w*0.5, cy=r.y+r.h*0.5;
  /* centre the EXCURSION, not z = 0: spikes outrun bubbles (h_s > h_b always
     once non-linear), so anchoring z = 0 to the middle of the box pushes the
     spike tips off the bottom while the top third stays empty */
  const zc=(R.hb-R.hs)/2;
  const X=x=>cx+(x-B.worldW/2)*B.s, Y=z=>cy-(z-zc)*B.s;
  const N=clamp(Math.round(150*B.NW),240,1600);
  const pts=[], world=[];
  for(let i=0;i<=N;i++){
    const x=B.worldW*i/N;
    const z=R.nonlinear?rtNonlinearShape(x,st.lam,R.hb,R.hs)
                       :rtInterface(x,st.lam,Math.min(R.zLin,R.zsat));
    world.push([x,z]); pts.push([X(x),Y(z)]);
  }
  return {B,pts,world,X,Y,cx,cy};
}
function drawMushroom(ctx,W,H,st){
  const G=mushGeometry(st,W,H), R=rtState(st);
  drawRTBox(ctx,G.box,st,R);

  /* ---- dispersion relation ---- */
  const lamHi=st.lam*6, lamLo=st.lam/12;
  let sMax=0;
  for(let i=0;i<=200;i++){ const l=lamLo*Math.pow(lamHi/lamLo,i/200);
    sMax=Math.max(sMax,sigmaRT(l,R.At,R.a,st.surf,1+st.rhoRatio)); }
  const dx=makeAxes(G.disp,{x0:lamLo,x1:lamHi,y0:0,y1:Math.max(sMax*1.12,1e-6)},{logx:true});
  drawFrame(ctx,dx,{xlabel:'λ  (m)',ylabel:'σ  (s⁻¹)',
    title:'σ = √(Aₜ a k) — short modes win',
    fill:'rgba(255,255,255,.012)',ny:4});
  clipTo(ctx,dx);
  strokeCurve(ctx,adaptiveCurve(Math.log(lamLo),Math.log(lamHi),u=>{
    const l=Math.exp(u); return [dx.X(l),dx.Y(sigmaClassical(l,R.At,R.a))]; }),
    rgba('#8b93a6',.6),1.4,[5,4]);
  strokeCurve(ctx,adaptiveCurve(Math.log(lamLo),Math.log(lamHi),u=>{
    const l=Math.exp(u); return [dx.X(l),dx.Y(sigmaRT(l,R.At,R.a,st.surf,1+st.rhoRatio))]; }),
    '#cd35c4',2);
  ctx.save(); ctx.strokeStyle=rgba('#b8ec4c',.6); ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(dx.X(st.lam),dx.rect.y); ctx.lineTo(dx.X(st.lam),dx.rect.y+dx.rect.h);
  ctx.stroke(); ctx.restore();
  dot(ctx,dx.X(st.lam),dx.Y(R.sig),4,'#b8ec4c','#070b18');
  ctx.restore();
  if(st.surf>0) label(ctx,dx.rect.x+6,dx.rect.y+13,
    'dashed: no surface tension','#8b93a6','10px -apple-system, sans-serif');

  /* ---- amplitude against time ---- */
  const tHi=Math.max(st.tRT*1.15,1e-3);
  let yHi=Math.max(R.hb,R.hs,R.hMix,R.zsat*2);
  const ay=makeAxes(G.amp,{x0:0,x1:tHi,y0:0,y1:yHi*1.1});
  drawFrame(ctx,ay,{xlabel:'t  (s)',ylabel:'amplitude  (m)',
    title:'exponential → saturation → terminal → a t²',
    fill:'rgba(255,255,255,.012)',ny:4,nx:4});
  clipTo(ctx,ay);
  /* linear stage */
  strokeCurve(ctx,adaptiveCurve(0,Math.min(tHi,isFinite(R.tsat)?R.tsat:tHi),
    t=>[ay.X(t),ay.Y(zetaLin(st.z0,R.sig,t))]),'#5ac8e0',1.8);
  /* the same law continued past saturation — the thing that does NOT happen */
  strokeCurve(ctx,adaptiveCurve(isFinite(R.tsat)?Math.min(R.tsat,tHi):tHi,tHi,
    t=>[ay.X(t),ay.Y(zetaLin(st.z0,R.sig,t))]),rgba('#5ac8e0',.32),1.2,[4,4]);
  /* saturation level */
  ctx.save(); ctx.strokeStyle=rgba('#8b93a6',.55); ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(ay.rect.x,ay.Y(R.zsat)); ctx.lineTo(ay.rect.x+ay.rect.w,ay.Y(R.zsat));
  ctx.stroke(); ctx.restore();
  /* nonlinear bubble and spike, integrated */
  if(isFinite(R.tsat)&&tHi>R.tsat){
    const dt=tHi-R.tsat;
    for(const [which,col] of [['bubble','#b8ec4c'],['spike','#ff5a4a']]){
      const tr=buoyancyDrag(st.lam,R.At,R.a,dt,300,which);
      strokeCurve(ctx,tr.map(q=>[ay.X(R.tsat+q[0]),ay.Y(R.zsat+q[1])]),col,1.9);
    }
  }
  /* the turbulent law */
  if(st.showMix)
    strokeCurve(ctx,adaptiveCurve(0,tHi,t=>[ay.X(t),ay.Y(hTurb(st.alphaMix,R.At,R.a,t))]),
      rgba('#cd35c4',.8),1.6,[7,4]);
  ctx.save(); ctx.strokeStyle=rgba('#fff',.35); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(ay.X(st.tRT),ay.rect.y); ctx.lineTo(ay.X(st.tRT),ay.rect.y+ay.rect.h);
  ctx.stroke(); ctx.restore();
  ctx.restore();
  label(ctx,ay.rect.x+ay.rect.w-6,ay.Y(R.zsat)-8,'ζ saturation','#8b93a6',
        'italic 11px Georgia, serif','right');
  /* measure rather than guess a character width — the guess ran the four
     legend entries into one another */
  let lgx=ay.rect.x+7;
  ctx.save(); ctx.font='10.5px -apple-system, sans-serif';
  for(const [nm,col] of [['linear','#5ac8e0'],['bubble','#b8ec4c'],['spike','#ff5a4a'],
                         ['α Aₜ a t²','#cd35c4']]){
    label(ctx,lgx,ay.rect.y+13,nm,col,'10.5px -apple-system, sans-serif');
    lgx+=ctx.measureText(nm).width+15; }
  ctx.restore();
}
/* the interface picture */
function drawRTBox(ctx,r,st,R){
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.012)'; ctx.fillRect(r.x,r.y,r.w,r.h);
  const P=rtInterfacePoints(r,st,R), NW=P.B.NW, X=P.X, Y=P.Y, pts=P.pts;
  ctx.save(); ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.clip();
  /* fill heavy above, light below */
  ctx.beginPath(); ctx.moveTo(r.x,r.y);
  for(const p of pts) ctx.lineTo(p[0],p[1]);
  ctx.lineTo(r.x+r.w,r.y); ctx.closePath();
  ctx.fillStyle=rgba('#2b4a6e',.85); ctx.fill();
  ctx.beginPath(); ctx.moveTo(r.x,r.y+r.h);
  for(const p of pts) ctx.lineTo(p[0],p[1]);
  ctx.lineTo(r.x+r.w,r.y+r.h); ctx.closePath();
  ctx.fillStyle=rgba('#a8442c',.8); ctx.fill();
  strokeCurve(ctx,pts,'#e8d5a8',1.6);
  /* Kelvin-Helmholtz roll-up: DRAWN, not simulated — a spiral of the size the
     model gives, at the spike tips, once the spike is deep enough to have one. */
  if(st.showRoll&&R.nonlinear&&R.hs>st.lam*0.35){
    const rad=Math.min(st.lam*0.19,R.hs*0.42)*P.B.s;
    for(let m=0;m<NW;m++){
      const xc=X((m+0.5)*st.lam), yc=Y(-R.hs)+rad*0.55;
      for(const sgn of [-1,1]){
        ctx.save(); ctx.strokeStyle='#e8d5a8'; ctx.lineWidth=1.5; ctx.globalAlpha=.9;
        ctx.beginPath();
        for(let i=0;i<=90;i++){ const th=i/90*2.6*Math.PI;
          const rr=rad*(1-i/90*0.82);
          const px=xc+sgn*(rad*0.95-rr*Math.cos(th)), py=yc-rr*Math.sin(th)*0.8;
          i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.stroke(); ctx.restore();
      }
    }
  }
  /* the turbulent mixing envelope */
  if(st.showMix){
    ctx.save(); ctx.strokeStyle=rgba('#cd35c4',.7); ctx.lineWidth=1.4; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(r.x,Y(R.hMix)); ctx.lineTo(r.x+r.w,Y(R.hMix));
    ctx.moveTo(r.x,Y(-R.hMix)); ctx.lineTo(r.x+r.w,Y(-R.hMix)); ctx.stroke(); ctx.restore();
  }
  ctx.restore();                                   /* end box clip */
  ctx.strokeStyle='#39404f'; ctx.lineWidth=1; ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);
  /* gravity / acceleration arrow */
  ctx.save(); ctx.strokeStyle='#8b93a6'; ctx.fillStyle='#8b93a6'; ctx.lineWidth=1.6;
  const gx=r.x+r.w-24, gy0=r.y+18;
  ctx.beginPath(); ctx.moveTo(gx,gy0); ctx.lineTo(gx,gy0+30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(gx,gy0+34); ctx.lineTo(gx-4,gy0+26); ctx.lineTo(gx+4,gy0+26);
  ctx.closePath(); ctx.fill(); ctx.restore();
  label(ctx,gx-8,gy0+16,'a','#8b93a6','italic 12.5px Georgia, serif','right');
  label(ctx,r.x+10,r.y+15,'heavy  ρ₂  (cold air)','#9dc0e8','11px -apple-system, sans-serif');
  /* a two-line strip, so the captions are legible over whichever fluid happens
     to be behind them — at late times the spike tips reach the box floor */
  ctx.save(); ctx.fillStyle='rgba(7, 11, 24,.76)';
  ctx.fillRect(r.x+1,r.y+r.h-41,r.w-2,40); ctx.restore();
  label(ctx,r.x+10,r.y+r.h-28,'light  ρ₁  (hot fireball gas)','#e8a082',
        '11px -apple-system, sans-serif');
  label(ctx,r.x+10,r.y+r.h-11,
    R.nonlinear?'tips: eq. 8.160 · cap 3λ/2π: eq. 8.158 · profile drawn'
               :'ζ = ζ₀ cosh σt, shape from eq. 8.165 (third order)',
    '#6f7789','italic 10.5px Georgia, serif');
  label(ctx,r.x+r.w-10,r.y+r.h-11,
    'equal aspect · '+Math.round(P.B.s*st.lam)+' px per λ'
    +(P.B.clipped?' · spikes run off the box':'')
    +(st.showRoll&&R.nonlinear&&R.hs>st.lam*0.35?' · roll-up drawn':''),
    '#6f7789','italic 10.5px Georgia, serif','right');
  ctx.restore();
}
