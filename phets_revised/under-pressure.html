<title>Under Pressure &mdash; PhET&rsquo;s four pools, with the hydrostatic law taken exactly</title>
<!--
  ===================================================================
  under-pressure.html — four pools, two gauges and one law: a
  rectangular pool with a faucet and a drain, a trapezoid pool whose
  two chambers taper opposite ways, a chamber pool with a mass
  platform, and a mystery pool that asks you to name the fluid or the
  planet — with p = p_atm + rho g h solved exactly everywhere
  ===================================================================

  Remake of PhET Interactive Simulations' Under Pressure (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets. The model, its constants, its pool geometry and its controls follow
  PhET's build 1.1.36 (docs/phets/under-pressure_en.html, the
  FLUID_PRESSURE_AND_FLOW repo); every number taken from that build is marked
  "PhET's value" in the code and in the panel.

  Six views.  PhET has one screen with four scenes, and the first four views
  are those scenes.  THE POOL is the square pool: a faucet, a drain, two
  draggable gauges, and the fluid-density, gravity, atmosphere, grid and ruler
  controls.  THE SHAPES is the trapezoid pool, two chambers that taper in
  opposite directions joined at the floor — put one gauge in each at the same
  depth and they read the same number.  THE PRESS is the chamber pool: a mass
  platform over a narrow shaft, a wide shaft beside it, and Pascal's principle
  in metres and newtons.  THE MYSTERY is the mystery pool, where the fluid or
  the gravity is hidden and the gauge is all you have.  The last two views are
  analysis.  THE PARADOX puts four vessels of the same base and the same depth
  side by side, holding 3.1 to 8.4 cubic metres of the same fluid, and shows
  that the force on every base is identical — with the difference tracked down
  to the vertical pressure on the slanted walls, integrated. THE COLUMN draws
  the law as what it is, a straight line of slope rho g and intercept p_atm,
  on all three of PhET's pressure scales at once.

  WHAT IS EXACT HERE
  ------------------
  The hydrostatic law, p = p_air(y_surface) + rho g h, with no approximation
  anywhere: it is asserted in selfTest against build/under-pressure/derive.py
  for every fluid tick x every gravity tick x depth 0, 1.5 and 3 m, with the
  atmosphere on and off, at the surface and at the floor, and swept over 11466
  points of the two continuous sliders.

  The unit conversions are the exact definitions, not rounded factors: 1 atm =
  101325 Pa by definition, 1 psi = (0.45359237 kg x 9.80665 m/s^2) / (0.0254
  m)^2 = 6894.757293168361 Pa, 1 ft = 0.3048 m.  So 1 atm = 14.69594877551345
  psi, and every round trip is exact to 1.4e-16 over the whole reachable
  range.  PhET 1.1.36 stores the rounded 9.8692e-6 atm/Pa and 1.4504e-4
  psi/Pa; this file does not, and the panel says by how much they differ.

  The trapezoid pool's volume-to-level map is exact rather than PhET's linear
  stand-in: the two chambers' widths are equal-and-opposite linear functions of
  height, so they SUM to a constant 3.85 m (asserted), and the cross-section is
  5.145 m wide through the floor channel and 3.85 m above it.  The level is
  therefore piecewise linear in the volume with one kink, inverted exactly and
  round-tripped to 1e-12, and cross-checked against scipy.integrate.quad.

  The chamber pool is solved, not scripted.  Pascal's principle says the
  piston's dp = F/A_left is the same everywhere in the connected fluid;
  matching the pressure at a point by the two routes (down from the loaded left
  surface, down from the free right surface) gives dp = (rho g + lambda) dh,
  where lambda is the air pressure's own lapse with height.  With the
  atmosphere OFF that is exactly the classical dh = M/(rho A_left); with it ON
  the air column between the two surfaces has weight and the answer is
  dh = M/(A_left (rho + lambda/g_earth)) — the air simply subtracts its own
  1.2483 kg/m^3 from the fluid's density, and g cancels either way.  selfTest
  asserts both closed forms and asserts that a gauge in the fluid reads the
  same pressure whichever surface you come down from, to 1e-9 Pa, at every
  mass, fluid and atmosphere setting.  Force multiplication is A_right/A_left
  = 4.6 exactly: 500 kg on the small piston holds 2300 kg on the big one.

  The hydrostatic paradox is computed twice.  The weight of fluid in each
  vessel is the exact integral of its piecewise-linear width profile; the
  vertical component of the pressure on the slanted walls is the separate
  integral int p(y) w'(y) D dy, done term by term; and the two are asserted to
  satisfy F_wall,z = W - F_base without that balance ever being used to get
  either.  The ratio F_base/W is 1, 0.5714, 1.5484 and 0.6738 for the four
  vessels and is independent of the fluid and of the gravity (asserted).

  WHAT IS MEASURED, AND WHOSE NUMBER IT IS
  ----------------------------------------
  Everything physical here is PhET's, read out of its minified build: the
  fluids gasoline 700, water 1000 and honey 1420 kg/m^3 (the slider runs
  between the first and the last); the gravities Mars 3.71, Earth 9.8 and
  Jupiter 24.9 m/s^2 (the slider runs between the first and the last); the air
  pressure 101325 Pa at the ground falling linearly to 99490 Pa at 150 m, and
  scaled by g/g_earth; the pool depth 3 m; the square pool x in [2.3, 6.0]; the
  trapezoid's widths 0.7 and 3.15 m about x = 3.2 with the chambers 3.22 m
  apart; the chamber pool's 0.5 m and 2.3 m shafts, its 1.3 m opening depth and
  its 500, 250 and 250 kg masses; the mystery fluids 1700, 840 and 1100 kg/m^3
  and the mystery planets 20, 14 and 6.5 m/s^2.  The unit definitions are the
  SI and international-yard-and-pound definitions, not PhET's.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  PhET's world is two-dimensional and its pools have no out-of-page depth at
  all, which makes its chamber pool's force balance dimensionally a length
  rather than a pressure.  This file gives every pool an out-of-page depth of
  2 m, printed on the canvas.  That is the one choice that makes A_left exactly
  1 m^2 and so reproduces PhET's own displacement numbers (500 kg moves the
  water 0.5 m) with an honest area, and it turns the faucet into litres per
  second.

  PhET's air pressure is a straight line from 101325 Pa to 99490 Pa over 150 m.
  A real isothermal column falls exponentially with a scale height of 8434.5 m;
  the two differ by at most 49 Pa, 0.048 % of an atmosphere, over that range
  (asserted).  PhET also multiplies the air pressure by g/g_earth, which is a
  statement about a hypothetical atmosphere of the same mass per unit area, not
  about Mars or Jupiter; that is kept, because the mystery-planet scene depends
  on it, and the panel says so.

  The fluid is incompressible, at rest and always flat, and responds instantly.
  The masses go onto and off the platform by a control rather than by being
  dragged, and they settle instantly: this file solves the static problem where
  PhET integrates a damped equation of motion.  When a load would push the
  narrow column below the foot of its shaft the displacement is capped and the
  canvas says the two-column model has stopped applying.

  WHAT IS NOT MODELLED
  --------------------
  Surface tension, viscosity, waves, the meniscus, compressibility and
  temperature.  PhET's animated water jets and its fluid-colour-by-density are
  not reproduced (the fluid is drawn in the house palette and named).  PhET's
  four barometers are two here, which is what the comparisons need.  PhET's
  mass-drop animation, its sound, and its English-units readouts for gravity
  and density (the ruler and grid do switch to feet) are absent.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and

   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).

   captured geometry would still lie.  Crossings are interpolated so a clipped

  ctx.save();

  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);

      const t=q/p;

      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }

    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));

function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';

  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;

               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];

    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];

         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;

/* ================================================================== *
 *  the physics: units, the hydrostatic law, the four pools, the       *
 *  chamber's Pascal solve and the paradox vessels.                    *
 *  Every closed form here is re-derived in build/under-pressure/      *
 *  derive.py and pinned to its printed output in selfTest.            *
 * ================================================================== */

/* ---- units: the DEFINITIONS, not rounded conversion factors -------------
   1 atm = 101325 Pa exactly (CGPM 1954).  1 lb = 0.45359237 kg and
   g_n = 9.80665 m/s^2 exactly (1959 international yard and pound), so
   1 lbf = 4.4482216152605 N exactly and 1 in = 0.0254 m exactly, giving
   1 psi = 6894.757293168361 Pa.  PhET 1.1.36 stores 9.8692e-6 atm/Pa and
   1.4504e-4 psi/Pa, which are these rounded; this file does not use them. */
const PA_PER_ATM=101325;

const LBF_N=LB_KG*G_STD;
const PA_PER_PSI=LBF_N/(INCH_M*INCH_M);
const PA_PER_KPA=1000;
const PHET_ATM_PER_PA=9.8692e-6, PHET_PSI_PER_PA=1.4504e-4, PHET_FT_PER_M=3.2808399;

const UNITS={
  metric:     {id:'metric',     name:'kPa', per:PA_PER_KPA, dp:1, len:'m',  lenPer:1,    lenName:'metres'},
  atmosphere: {id:'atmosphere', name:'atm', per:PA_PER_ATM, dp:3, len:'m',  lenPer:1,    lenName:'metres'},
  english:    {id:'english',    name:'psi', per:PA_PER_PSI, dp:2, len:'ft', lenPer:FT_M, lenName:'feet'},

function toUnit(pa,u){ return pa/UNITS[u].per; }
function fromUnit(v,u){ return v*UNITS[u].per; }

/* ---- PhET's values, read out of its minified build 1.1.36 -------------- */
const RHO_GASOLINE=700, RHO_WATER=1000, RHO_HONEY=1420;
const G_MARS=3.71, G_EARTH=9.8, G_JUPITER=24.9;
const P_AIR_0=101325;              /* Constants.EARTH_AIR_PRESSURE */
const P_AIR_HI=99490;              /* Constants.EARTH_AIR_PRESSURE_AT_500_FT */
const Y_LAPSE=150;                 /* getStandardAirPressure: linear(0,150,...) */
const LAPSE=(P_AIR_HI-P_AIR_0)/Y_LAPSE;         /* -12.2333... Pa/m */
const POOL_H=3;                    /* Constants.MAX_POOL_HEIGHT */
const DEPTH_OUT=2;                 /* THIS file's out-of-page depth (see header) */

const MYSTERY_G=[20,14,6.5];                    /* Planet A, B, C */
const RHO_RANGE=[RHO_GASOLINE,RHO_HONEY], G_RANGE=[G_MARS,G_JUPITER];

const RHO_AIR_ISA=1.225, H_SCALE=P_AIR_0/(RHO_AIR_ISA*G_STD);

/* the air pressure at height y.  PhET's model: a straight line over the first
   150 m, multiplied by g/g_earth (an atmosphere of the same mass per unit
   area under a different gravity).  Exponential truth is in airExact(). */
function airP(y,g,atmosphere){ return atmosphere?(P_AIR_0+LAPSE*y)*(g/G_EARTH):0; }

/* p = p_air(at the free surface) + rho g h.  h is measured DOWN from the
   surface; nothing else enters, which is the whole of this sim. */
function pressureAt(depth,rho,g,ySurf,atmosphere){
  return airP(ySurf===undefined?0:ySurf,g,atmosphere)+rho*g*depth;
}
/* the inverses the mystery scene needs */
function rhoFromReading(p,g,depth,ySurf,atmosphere){
  return (p-airP(ySurf===undefined?0:ySurf,g,atmosphere))/(g*depth);
}
function gFromReading(p,rho,depth,ySurf,atmosphere){
  const yS=(ySurf===undefined?0:ySurf);

/* ================================================================== *
 *  the pools.  PhET's world: metres, y up, y = 0 the ground, the pool *
 *  floor at y = -3.  Widths are cross-sections; areas carry DEPTH_OUT.*
 * ================================================================== */

/* ---- the square pool (PhET's SquarePoolModel) -------------------------- */
const SQ_X0=2.3, SQ_X1=6.0;

/* ---- the trapezoid pool (PhET's TrapezoidPoolModel) --------------------
   widthTop 0.7, widthBottom 3.15, centres 3.2 and 3.2 + 3.22.  The two
   chambers taper equally and oppositely, so their widths SUM to a constant
   3.85 m at every height -- which is why the level is linear in the volume
   above the floor channel.  PhET's own bottom chamber stops at x = 6.0 while
   its right chamber's foot is at 6.07, leaving a 7 cm wedge that its
   isPointInsidePool reports as OUTSIDE the pool; this file runs the channel to
   6.2 so the fluid is one connected body at every height. */
const TZ_WTOP=0.7, TZ_WBOT=3.15, TZ_CTOP=3.2, TZ_SEP=3.22;

const TZ_CHAN_PHET_X1=6.0;
const TZ_WSUM=TZ_WTOP+TZ_WBOT;
function tzLeft(t){
  const a=TZ_CTOP-TZ_WBOT/2, b=TZ_CTOP-TZ_WTOP/2;
  const c=TZ_CTOP+TZ_WBOT/2, d=TZ_CTOP+TZ_WTOP/2;
  return [a+(b-a)*t/POOL_H, c+(d-c)*t/POOL_H];
}
function tzRight(t){
  const m=TZ_CTOP+TZ_SEP;
  const a=m-TZ_WTOP/2, b=m-TZ_WBOT/2;
  const c=m+TZ_WTOP/2, d=m+TZ_WBOT/2;

const TZ_WCHAN=tzRight(0)[1]-tzLeft(0)[0];      /* 5.145 m, constant over the band */
const TZ_VCHAN=TZ_WCHAN*TZ_CHAN.t1*DEPTH_OUT;

  if(t<0||t>POOL_H) return 0;
  return t<TZ_CHAN.t1?TZ_WCHAN:TZ_WSUM;
}
function tzVolume(t){
  t=clamp(t,0,POOL_H);

  V=clamp(V,0,TZ_VMAX);

  if(t<=TZ_CHAN.t1&&x>=TZ_CHAN.x0&&x<=TZ_CHAN.x1) return true;
  const L=tzLeft(t), R=tzRight(t);
  return (x>=L[0]&&x<=L[1])||(x>=R[0]&&x<=R[1]);

/* ---- the chamber pool (PhET's ChamberPoolModel) ------------------------ */
const CH_L_W=0.5, CH_R_W=2.3;                   /* PhET's u and h */
const CH_A_L=CH_L_W*DEPTH_OUT, CH_A_R=CH_R_W*DEPTH_OUT;

const CH_RIGHT={x0:6.27, x1:7.37};              /* PhET's rightChamber */

/* Pascal.  dp = F/A_left is the SAME everywhere in the connected fluid.

   dp = (rho g + lambda) dh with lambda = d(p_air)/dy, and because
   dp = Mg/A_left and lambda = LAPSE g/g_earth both carry g, g cancels:

        dh = M / (A_left rho)                          atmosphere off

function pascal(M,rho,g,atmosphere){
  const dp=M*g/CH_A_L;
  const dhRaw=M/(CH_A_L*rhoEff(rho,atmosphere));
  /* the left column cannot fall below the foot of its shaft */
  const dLraw=dhRaw*CH_A_R/(CH_A_L+CH_A_R);
  const capped=dLraw>CH_WATER;
  const dL=capped?CH_WATER:dLraw;
  const dR=dL*CH_A_L/CH_A_R;
  return {dp:dp, dh:dL+dR, dhRaw:dhRaw, dL:dL, dR:dR, capped:capped,
          yL:CH_REST-dL, yR:CH_REST+dR,
          Fin:M*g, Fout:dp*CH_A_R, mult:CH_RATIO,
          Mmax:CH_WATER*(CH_A_L+CH_A_R)/CH_A_R*CH_A_L*rhoEff(rho,atmosphere)};
}
/* the pressure anywhere in or above the chamber pool */
function chamberPressure(x,y,P,rho,g,atmosphere){
  const inL=(x>=CH_L_SHAFT.x0&&x<=CH_L_SHAFT.x1);
  const inR=(x>=CH_R_SHAFT.x0&&x<=CH_R_SHAFT.x1);
  const inBody=(y<=CH_OPEN_BOT&&y>=-POOL_H&&
                ((x>=CH_LEFT.x0&&x<=CH_LEFT.x1)||(x>=CH_RIGHT.x0&&x<=CH_RIGHT.x1)||
                 (x>=CH_LEFT.x1&&x<=CH_RIGHT.x0&&y<=-2.25&&y>=-2.75)));
  /* above the ground it is air everywhere, as in PhET */
  if(y>0) return {p:airP(y,g,atmosphere),wet:false,out:false,surf:null,side:'air'};
  if(y>CH_OPEN_BOT){
    if(inL&&y<=P.yL) return {p:airP(P.yL,g,atmosphere)+P.dp+rho*g*(P.yL-y),wet:true,out:false,surf:P.yL,side:'left'};
    if(inR&&y<=P.yR) return {p:airP(P.yR,g,atmosphere)+rho*g*(P.yR-y),wet:true,out:false,surf:P.yR,side:'right'};
    if(inL||inR) return {p:airP(y,g,atmosphere),wet:false,out:false,surf:null,side:'air'};
    return {p:0,wet:false,out:true,surf:null,side:'ground'};   /* solid, between the shafts */
  }
  if(!inBody) return {p:0,wet:false,out:true,surf:null,side:'ground'};
  return {p:airP(P.yR,g,atmosphere)+rho*g*(P.yR-y),wet:true,out:false,surf:P.yR,side:'body'};
}

/* ================================================================== *
 *  the hydrostatic paradox: four vessels, one base, one depth         *
 * ================================================================== */
const PAR_H=2.0, PAR_WB=1.2;
const VESSELS=[
  {id:'straight',name:'straight',prof:[[0,PAR_WB],[PAR_H,PAR_WB]]},
  {id:'flared',  name:'flared',  prof:[[0,PAR_WB],[PAR_H,3.0]]},
  {id:'tapered', name:'tapered', prof:[[0,PAR_WB],[PAR_H,0.35]]},
  /* named for the shape it IS: a narrow cylinder that steps out to a wide one.
     It was called "flask" until the PNG pass, where a flask's narrow NECK is
     at the top and this one's is at the bottom -- a caption contradicting its
     own picture (Known-bad). */
  {id:'stepped', name:'stepped', prof:[[0,PAR_WB],[0.55*PAR_H,PAR_WB],[0.62*PAR_H,2.6],[PAR_H,2.6]]},
];
function profW(prof,y){
  if(y<=prof[0][0]) return prof[0][1];
  for(let i=0;i<prof.length-1;i++){
    const [y0,w0]=prof[i], [y1,w1]=prof[i+1];
    if(y<=y1) return y1===y0?w0:w0+(w1-w0)*(y-y0)/(y1-y0);
  }
  return prof[prof.length-1][1];
}
/* the trapezium rule is EXACT on a piecewise-linear profile */
function profVolume(prof,H,depth){
  depth=depth===undefined?DEPTH_OUT:depth;
  let V=0;
  for(let i=0;i<prof.length-1;i++){
    const [y0]=prof[i], [y1]=prof[i+1];
    if(y1<=0||y0>=H) continue;
    const a=Math.max(y0,0), b=Math.min(y1,H);
    V+=0.5*(profW(prof,a)+profW(prof,b))*(b-a)*depth;
  }
  return V;
}
/* the VERTICAL component of the pressure the side walls exert on the fluid,
   integrated directly: int p(y) w'(y) D dy with gauge p = rho g (H - y).
   Each wall contributes p w'/2 and there are two of them.  This is computed
   WITHOUT the force balance, so comparing it against W - F_base is a check. */
function profWallVertical(prof,H,rho,g,depth){
  depth=depth===undefined?DEPTH_OUT:depth;
  let F=0;
  for(let i=0;i<prof.length-1;i++){
    const [y0,w0]=prof[i], [y1,w1]=prof[i+1];
    if(y1<=y0||y1<=0||y0>=H) continue;
    const a=Math.max(y0,0), b=Math.min(y1,H), k=(w1-w0)/(y1-y0);
    F+=rho*g*k*depth*((H*b-b*b/2)-(H*a-a*a/2));
  }
  return F;
}
/* a brute-force check of the same integral, for selfTest */
function profWallVerticalSum(prof,H,rho,g,n,depth){
  depth=depth===undefined?DEPTH_OUT:depth;
  let F=0; const dy=H/n;
  for(let i=0;i<n;i++){
    const ya=i*dy, yb=(i+1)*dy, ym=(ya+yb)/2;
    F+=rho*g*(H-ym)*(profW(prof,yb)-profW(prof,ya))*depth;
  }
  return F;
}
function vesselStats(v,rho,g,H){
  H=H===undefined?PAR_H:H;
  const V=profVolume(v.prof,H), W=rho*g*V;
  const pBase=rho*g*H, Abase=profW(v.prof,0)*DEPTH_OUT, Fbase=pBase*Abase;
  const Fwall=profWallVertical(v.prof,H,rho,g);
  return {id:v.id,name:v.name,V:V,W:W,pBase:pBase,Abase:Abase,Fbase:Fbase,
          Fwall:Fwall,ratio:Fbase/W,resid:Math.abs(Fwall-(W-Fbase))};
}

/* ================================================================== *
 *  state, the per-view model, the readout, the equation bar, the tag  *
 * ================================================================== */
const TABS=[['pool','the pool'],['shapes','the shapes'],['press','the press'],
            ['mystery','the mystery'],['paradox','the paradox'],['column','the column']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', off:'#161c2c', edge:'#242a3a', gold:'#d9b44a',
           fluid:'#163a55', fluid2:'#1e4f73', wall:'#39405a', wall2:'#4b5472',
           air:'#0b1020', mass:'#6b7285'};
const RO_W=300;
const HINT_H=18;   /* the house #hint (HTML, bottom:11px) owns the bottom-left corner */

const UNIT_LIST=[{id:'metric',name:'kPa'},{id:'atmosphere',name:'atm'},{id:'english',name:'psi'}];
const FLUID_TICKS=[{id:'gasoline',name:'gasoline',rho:RHO_GASOLINE},
                   {id:'water',name:'water',rho:RHO_WATER},
                   {id:'honey',name:'honey',rho:RHO_HONEY}];
const G_TICKS=[{id:'mars',name:'Mars',g:G_MARS},
               {id:'earth',name:'Earth',g:G_EARTH},
               {id:'jupiter',name:'Jupiter',g:G_JUPITER}];
const MY_MODE_LIST=[{id:'fluid',name:'mystery fluid'},{id:'planet',name:'mystery planet'}];
const MY_PICK_LIST=[{id:'0',name:'A'},{id:'1',name:'B'},{id:'2',name:'C'}];
const VESSEL_LIST=VESSELS.map(v=>({id:v.id,name:v.name}));

const DEFAULTS={
  view:'pool',
  /* the fluid and the world (PhET's defaults: water, Earth, atmosphere on) */
  rho:RHO_WATER, grav:G_EARTH, atmosphere:true, units:'metric',
  gridOn:false, rulerOn:false,
  /* the faucet and the drain: the fraction of the pool's volume that is full.
     PhET's PoolWithFaucetsModel starts at volume 1.5 of 3, i.e. half. */
  volFrac:0.5,
  /* the two gauges, in world metres */
  gAx:3.1, gAy:-2.4, gBx:5.2, gBy:-2.4,
  /* the mass platform (PhET's one 500 kg and two 250 kg) */
  m500:true, m250a:false, m250b:false,
  /* the mystery scene */
  myMode:'fluid', myWhich:0, myGuess:'0', myReveal:false, myDepth:1.5,
  /* the paradox */
  parDepth:2.0, parPick:'flared',
  /* the column */
  colDepth:1.5, colAll:true,
};
const ST=Object.assign({},DEFAULTS);

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function clearAll(){ MEMO.pool=MEMO.shapes=MEMO.press=MEMO.mystery=MEMO.paradox=MEMO.column=null; }

/* the fluid the current scene actually has: the mystery scene hides it */
function sceneRho(st){ return (st.view==='mystery'&&st.myMode==='fluid')?MYSTERY_RHO[st.myWhich]:st.rho; }
function sceneG(st){ return (st.view==='mystery'&&st.myMode==='planet')?MYSTERY_G[st.myWhich]:st.grav; }
function fluidName(rho){
  for(const f of FLUID_TICKS) if(Math.abs(f.rho-rho)<1e-9) return f.name;
  return 'a fluid at '+sigf(rho,4)+' kg/m3';
}
function gName(g){
  for(const t of G_TICKS) if(Math.abs(t.g-g)<1e-9) return t.name;
  return sigf(g,3)+' m/s2';
}
function pStr(pa,st,dp){
  const u=UNITS[st.units];
  return fmt(toUnit(pa,st.units),dp===undefined?u.dp:dp)+' '+u.name;
}

/* ---------------------------------------------------- the simple pools ---
   A probe anywhere: inside the fluid it reads p_air(surface) + rho g h,
   above it reads the air, outside the vessel it reads nothing at all. */
function probeFlat(x,y,ySurf,inside,rho,g,atmosphere){
  /* ABOVE the ground the gauge reads the air, wherever it is -- PhET's
     getPressureAtCoords does exactly that (`if (y > 0) return air(y)`).  Only
     a point buried in the solid ground has no reading at all. */
  if(y>0) return {p:airP(y,g,atmosphere),wet:false,out:false,air:true,depth:0,surf:null};
  if(!inside(x,y)) return {p:0,wet:false,out:true,air:false,depth:0,surf:null};
  if(y>ySurf) return {p:airP(y,g,atmosphere),wet:false,out:false,air:true,depth:0,surf:ySurf};
  return {p:pressureAt(ySurf-y,rho,g,ySurf,atmosphere),wet:true,out:false,air:false,depth:ySurf-y,surf:ySurf};
}
function sqInside(x,y){ return x>=SQ_X0&&x<=SQ_X1&&y>=-POOL_H&&y<=0; }
function sqLevel(volFrac){ return clamp(volFrac,0,1)*POOL_H; }

function poolCommon(st,rho,g){
  const level=sqLevel(st.volFrac), ySurf=-POOL_H+level;
  const V=SQ_A*level;
  const ins=(x,y)=>sqInside(x,y);
  const A=probeFlat(st.gAx,st.gAy,ySurf,ins,rho,g,st.atmosphere);
  const B=probeFlat(st.gBx,st.gBy,ySurf,ins,rho,g,st.atmosphere);
  return {level:level,ySurf:ySurf,V:V,Vmax:SQ_VMAX,A:A,B:B,rho:rho,g:g,
          pBot:pressureAt(level,rho,g,ySurf,st.atmosphere),
          pSurf:pressureAt(0,rho,g,ySurf,st.atmosphere),
          pAir:airP(ySurf,g,st.atmosphere),
          mass:rho*V, weight:rho*g*V, Fbot:pressureAt(level,rho,g,ySurf,st.atmosphere)*SQ_A};
}
function poolModel(st){
  const key=[st.rho,st.grav,st.atmosphere,st.volFrac,st.gAx,st.gAy,st.gBx,st.gBy,st.units].join('|');
  return memo('pool',key,()=>{
    const M=poolCommon(st,st.rho,st.grav);
    M.scene='square';
    /* the same depth in the other two pools, for the cross-scene claim */
    M.depthMatch=(M.A.wet&&M.B.wet)?Math.abs(M.A.p-M.B.p):null;
    M.sameDepth=(M.A.wet&&M.B.wet&&Math.abs(M.A.depth-M.B.depth)<1e-12);
    return M;
  });
}

/* ------------------------------------------------------- the trapezoid --- */
function tzChamberVolumeAbove(which,yFrom,ySurf){
  /* the fluid in one chamber between yFrom and the surface, exactly:
     the width is linear in height, so the trapezium rule is exact. */
  if(ySurf<=yFrom) return 0;
  const f=(y)=>{ const t=y+POOL_H, e=which==='left'?tzLeft(t):tzRight(t); return e[1]-e[0]; };
  return 0.5*(f(yFrom)+f(ySurf))*(ySurf-yFrom)*DEPTH_OUT;
}
function shapesModel(st){
  const key=[st.rho,st.grav,st.atmosphere,st.volFrac,st.gAx,st.gAy,st.gBx,st.gBy,st.units].join('|');
  return memo('shapes',key,()=>{
    const rho=st.rho, g=st.grav;
    const V=clamp(st.volFrac,0,1)*TZ_VMAX, level=tzLevel(V), ySurf=-POOL_H+level;
    const A=probeFlat(st.gAx,st.gAy,ySurf,tzInside,rho,g,st.atmosphere);
    const B=probeFlat(st.gBx,st.gBy,ySurf,tzInside,rho,g,st.atmosphere);
    const t=level;
    const wl=tzLeft(t), wr=tzRight(t);
    const colA=A.wet?tzChamberVolumeAbove(st.gAx<(TZ_CTOP+TZ_SEP/2)?'left':'right',st.gAy,ySurf):0;
    const colB=B.wet?tzChamberVolumeAbove(st.gBx<(TZ_CTOP+TZ_SEP/2)?'left':'right',st.gBy,ySurf):0;
    return {scene:'trapezoid',rho:rho,g:g,V:V,Vmax:TZ_VMAX,level:level,ySurf:ySurf,
            A:A,B:B,wLeft:wl[1]-wl[0],wRight:wr[1]-wr[0],wSum:(wl[1]-wl[0])+(wr[1]-wr[0]),
            width:tzWidth(level),inChannel:level<TZ_CHAN.t1,
            colA:colA,colB:colB,
            sameDepth:(A.wet&&B.wet&&Math.abs(A.depth-B.depth)<1e-9),
            dP:(A.wet&&B.wet)?Math.abs(A.p-B.p):null,
            mass:rho*V,pBot:pressureAt(level,rho,g,ySurf,st.atmosphere),
            pAir:airP(ySurf,g,st.atmosphere)};
  });
}

/* ---------------------------------------------------------- the press --- */
function stackMass(st){
  let m=0;
  for(const o of CH_MASSES) if(st[o.id]) m+=o.m;
  return m;
}
function pressModel(st){
  const key=[st.rho,st.grav,st.atmosphere,st.m500,st.m250a,st.m250b,st.gAx,st.gAy,st.gBx,st.gBy,st.units].join('|');
  return memo('press',key,()=>{
    const rho=st.rho, g=st.grav, M=stackMass(st);
    const P=pascal(M,rho,g,st.atmosphere);
    const A=chamberPressure(st.gAx,st.gAy,P,rho,g,st.atmosphere);
    const B=chamberPressure(st.gBx,st.gBy,P,rho,g,st.atmosphere);
    /* the two routes to the same deep point, which must agree */
    const yc=-2.5;
    const viaL=airP(P.yL,g,st.atmosphere)+P.dp+rho*g*(P.yL-yc);
    const viaR=airP(P.yR,g,st.atmosphere)+rho*g*(P.yR-yc);
    return {scene:'chamber',rho:rho,g:g,M:M,P:P,A:A,B:B,
            viaL:viaL,viaR:viaR,routeResid:Math.abs(viaL-viaR),
            pFloorL:airP(P.yR,g,st.atmosphere)+rho*g*(P.yR+POOL_H),
            onMasses:CH_MASSES.filter(o=>st[o.id]),
            liftable:M*CH_RATIO, rhoEff:rhoEff(rho,st.atmosphere)};
  });
}

/* -------------------------------------------------------- the mystery --- */
function mysteryModel(st){
  const key=[st.myMode,st.myWhich,st.myGuess,st.myReveal,st.myDepth,st.rho,st.grav,st.atmosphere,st.volFrac,st.units].join('|');
  return memo('mystery',key,()=>{
    const rho=sceneRho(st), g=sceneG(st);
    const level=sqLevel(st.volFrac), ySurf=-POOL_H+level;
    const d=clamp(st.myDepth,0,level);
    const p=pressureAt(d,rho,g,ySurf,st.atmosphere);
    /* what each of PhET's three candidates would read at the same depth */
    const cands=[0,1,2].map(i=>{
      const r=st.myMode==='fluid'?MYSTERY_RHO[i]:st.rho;
      const gg=st.myMode==='fluid'?st.grav:MYSTERY_G[i];
      return {i:i,label:'ABC'[i],rho:r,g:gg,p:pressureAt(d,r,gg,ySurf,st.atmosphere)};
    });
    let sep=Infinity;
    for(let i=0;i<3;i++) for(let j=i+1;j<3;j++) sep=Math.min(sep,Math.abs(cands[i].p-cands[j].p));
    /* the readout's own resolution, in pascals */
    const u=UNITS[st.units], res=Math.pow(10,-u.dp)*u.per;
    const inv=st.myMode==='fluid'
      ? (d>0?rhoFromReading(p,g,d,ySurf,st.atmosphere):NaN)
      : gFromReading(p,rho,d,ySurf,st.atmosphere);
    const truth=st.myMode==='fluid'?MYSTERY_RHO[st.myWhich]:MYSTERY_G[st.myWhich];
    return {scene:'mystery',rho:rho,g:g,level:level,ySurf:ySurf,d:d,p:p,cands:cands,
            sep:sep,res:res,unique:sep>res,inv:inv,truth:truth,
            invResid:isFinite(inv)?Math.abs(inv-truth):NaN,
            correct:(+st.myGuess===st.myWhich),
            degenerate:(st.myMode==='fluid'&&d<=0),
            pAir:airP(ySurf,g,st.atmosphere),
            mass:rho*SQ_A*level};
  });
}

/* -------------------------------------------------------- the paradox --- */
function paradoxModel(st){
  const key=[st.rho,st.grav,st.parDepth,st.parPick,st.units,st.atmosphere].join('|');
  return memo('paradox',key,()=>{
    const rho=st.rho, g=st.grav, H=clamp(st.parDepth,0.2,PAR_H);
    const rows=VESSELS.map(v=>vesselStats(v,rho,g,H));
    const pick=rows.find(r=>r.id===st.parPick)||rows[0];
    const Vs=rows.map(r=>r.V);
    /* the same integral by brute force, so the closed form is checked here too */
    const brute=VESSELS.map(v=>profWallVerticalSum(v.prof,H,rho,g,20000));
    return {scene:'paradox',rho:rho,g:g,H:H,rows:rows,pick:pick,
            pBase:rho*g*H,Fbase:rows[0].Fbase,
            spread:Math.max.apply(null,Vs)/Math.min.apply(null,Vs),
            brute:brute,
            worstResid:Math.max.apply(null,rows.map((r,i)=>Math.abs(r.Fwall-brute[i])/Math.max(1,Math.abs(r.Fwall)))),
            pAirTop:airP(0,g,st.atmosphere)};
  });
}

/* --------------------------------------------------------- the column --- */
function columnModel(st){
  const key=[st.rho,st.grav,st.atmosphere,st.colDepth,st.colAll,st.units].join('|');
  return memo('column',key,()=>{
    const g=st.grav, d=clamp(st.colDepth,0,POOL_H);
    const lines=FLUID_TICKS.map(f=>({name:f.name,rho:f.rho,
      slope:f.rho*g,
      p0:airP(0,g,st.atmosphere),
      p:pressureAt(d,f.rho,g,0,st.atmosphere)}));
    const here={name:fluidName(st.rho),rho:st.rho,slope:st.rho*g,
                p:pressureAt(d,st.rho,g,0,st.atmosphere)};
    /* the depth at which the reading is exactly twice the surface value */
    const p0=airP(0,g,st.atmosphere);
    const dDouble=p0>0?p0/(st.rho*g):NaN;
    /* one atmosphere of this fluid under this gravity */
    const dAtm=PA_PER_ATM/(st.rho*g);
    return {scene:'column',g:g,d:d,lines:lines,here:here,p0:p0,
            dDouble:dDouble,dAtm:dAtm,
            dAtmWaterStd:PA_PER_ATM/(RHO_WATER*G_STD),
            psiPerAtm:PA_PER_ATM/PA_PER_PSI,
            kpaPerAtm:PA_PER_ATM/PA_PER_KPA,
            airErr:Math.abs(airP(150,G_EARTH,true)-airExact(150)),
            phetAtm:Math.abs(PA_PER_ATM*PHET_ATM_PER_PA-1),
            phetPsi:Math.abs(PA_PER_ATM*PHET_PSI_PER_PA-PA_PER_ATM/PA_PER_PSI)};
  });
}

function buildModel(st){
  st=st||ST;
  if(st.view==='pool') return poolModel(st);
  if(st.view==='shapes') return shapesModel(st);
  if(st.view==='press') return pressModel(st);
  if(st.view==='mystery') return mysteryModel(st);
  if(st.view==='paradox') return paradoxModel(st);
  return columnModel(st);
}

/* ================================================================== *
 *  readout / equation bar / stage tag                                 *
 * ================================================================== */
function row(l,v,cls){ return '<tr><td>'+l+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>'; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function kgm3(x){ return sigf(x,x>=1000?5:4)+' kg/m<sup>3</sup>'; }
function litres(V){ return fmt(1000*V,0)+' L'; }
function gaugeRow(tag,G,st){
  if(G.out) return row(tag,'buried in the ground','');
  if(!G.wet) return row(tag,pStr(G.p,st)+' (air)','ref');
  return row(tag,pStr(G.p,st),'good');
}

function readoutHTML(M,st){
  st=st||ST;
  const v=st.view, u=UNITS[st.units];
  let name='', sub='', body='', note='';
  if(v==='pool'||v==='mystery'){
    if(v==='pool'){
      name='the pool'; sub=fluidName(M.rho)+' on '+gName(M.g);
      body=hd('the gauges')
        +gaugeRow('gauge A',M.A,st)
        +row('&nbsp; depth',M.A.wet?fmt(M.A.depth,2)+' m':'&mdash;')
        +gaugeRow('gauge B',M.B,st)
        +row('&nbsp; depth',M.B.wet?fmt(M.B.depth,2)+' m':'&mdash;')
        +row('they differ by',M.depthMatch===null?'&mdash;':(M.depthMatch<1e-9?'nothing at all':pStr(M.depthMatch,st,4)),
             M.sameDepth?'good':'live')
        +hd('the fluid')
        +row('density &rho;',kgm3(M.rho),'good')
        +row('gravity g',fmt(M.g,2)+' m/s<sup>2</sup>','good')
        +row('&rho;g',fmt(M.rho*M.g/1000,3)+' kPa/m','live')
        +hd('the pool')
        +row('level',fmt(M.level,2)+' m of '+fmt(POOL_H,0))
        +row('fluid in it',litres(M.V)+' of '+litres(M.Vmax))
        +row('its mass',fmt(M.mass,0)+' kg')
        +hd('top and bottom')
        +row('at the surface',pStr(M.pSurf,st),'ref')
        +row('at the floor',pStr(M.pBot,st),'good')
        +row('&rho;gh alone',pStr(M.pBot-M.pAir,st),'live')
        +row('force on the floor',fmt(M.Fbot/1000,1)+' kN')
        +row('weight of fluid',fmt(M.weight/1000,1)+' kN','ref');
      note='<b>The gauge does not care how much fluid there is.</b> Fill the pool to the top and the reading at a fixed '
        +'depth does not move; it moves only when the surface above the gauge does. The force on the floor here is '
        +fmt(M.Fbot/1000,1)+' kN and the fluid weighs '+fmt(M.weight/1000,1)+' kN, and they differ because the floor also '
        +'carries the atmosphere pressing on the surface'+(st.atmosphere?'':' &mdash; which is switched off, so here they agree')+'.';
    } else {
      name='the mystery'; sub=(st.myMode==='fluid'?'which fluid?':'which planet?');
      body=hd('what you are given')
        +row('the gauge reads',pStr(M.p,st),'good')
        +row('at depth',fmt(M.d,2)+' m')
        +row(st.myMode==='fluid'?'gravity':'the fluid',
             st.myMode==='fluid'?fmt(st.grav,2)+' m/s<sup>2</sup>':kgm3(st.rho),'ref')
        +row('atmosphere',st.atmosphere?'on, '+pStr(M.pAir,st):'off')
        +hd('what each choice would read');
      M.cands.forEach(c=>{
        body+=row((st.myMode==='fluid'?'Fluid ':'Planet ')+c.label
                  +(st.myReveal?' &nbsp; '+(st.myMode==='fluid'?sigf(c.rho,4):sigf(c.g,3)):''),
                  pStr(c.p,st),c.i===st.myWhich&&st.myReveal?'live':'');
      });
      body+=row('closest pair',M.sep<1e-12?'identical':pStr(M.sep,st,4),M.unique?'good':'bad')
        +row('the readout resolves',pStr(M.res,st,4),'ref')
        +row('so the reading is',M.unique?'enough':'not enough',M.unique?'good':'bad')
        +hd('solving for it')
        +row(st.myMode==='fluid'?'&rho; = (p &minus; p<sub>atm</sub>)/gh':'g from p = P<sub>0</sub>g/g<sub>0</sub> + &rho;gh',
             isFinite(M.inv)?(st.myMode==='fluid'?sigf(M.inv,5)+' kg/m<sup>3</sup>':sigf(M.inv,4)+' m/s<sup>2</sup>'):'no answer at the surface',
             isFinite(M.inv)?'good':'bad')
        +row('your answer',(st.myMode==='fluid'?'Fluid ':'Planet ')+'ABC'[+st.myGuess],
             st.myReveal?(M.correct?'good':'bad'):'')
        +row('the answer',st.myReveal?(st.myMode==='fluid'?'Fluid ':'Planet ')+'ABC'[M.correct?+st.myGuess:st.myWhich]:'hidden',
             st.myReveal?'live':'');
      note=M.degenerate
        ? '<b>At the surface every fluid reads the same.</b> The gauge is at zero depth, so &rho;gh = 0 and all three '
          +'candidates read the air pressure exactly. A surface reading cannot identify a fluid, and this file says so '
          +'rather than pretending. Lower the gauge.'
        : '<b>One reading is enough &mdash; but only because everything else is known.</b> The law has three unknowns on '
          +'its right-hand side and you are given two of them, so the third comes out by division. The three candidates '
          +'are '+pStr(M.sep,st,4)+' apart at their closest, against a readout that resolves '+pStr(M.res,st,4)+'.';
    }
  } else if(v==='shapes'){
    name='the shapes'; sub=fluidName(M.rho)+', two chambers, one level';
    body=hd('the two gauges')
      +gaugeRow('gauge A (left)',M.A,st)
      +row('&nbsp; depth',M.A.wet?fmt(M.A.depth,3)+' m':'&mdash;')
      +row('&nbsp; fluid above it',M.A.wet?litres(M.colA):'&mdash;','ref')
      +gaugeRow('gauge B (right)',M.B,st)
      +row('&nbsp; depth',M.B.wet?fmt(M.B.depth,3)+' m':'&mdash;')
      +row('&nbsp; fluid above it',M.B.wet?litres(M.colB):'&mdash;','ref')
      +row('same depth?',M.sameDepth?'yes':'no',M.sameDepth?'good':'live')
      +row('readings differ by',M.dP===null?'&mdash;':(M.dP<1e-9?'nothing at all':pStr(M.dP,st,4)),
           (M.sameDepth&&M.dP!==null&&M.dP<1e-9)?'good':'live')
      +hd('the two chambers at the surface')
      +row('left is',fmt(M.wLeft,3)+' m wide','live')
      +row('right is',fmt(M.wRight,3)+' m wide','live')
      +row('they sum to',fmt(M.wSum,6)+' m','good')
      +hd('the pool')
      +row('level',fmt(M.level,3)+' m')
      +row('fluid in it',litres(M.V)+' of '+litres(M.Vmax))
      +row('cross-section',fmt(M.width,3)+' m'+(M.inChannel?' (in the floor channel)':''))
      +row('at the floor',pStr(M.pBot,st),'good');
    note='<b>The two chambers taper opposite ways and their widths add to a constant '+fmt(M.wSum,3)+' m.</b> That is why '
      +'the level rises uniformly with the volume above the floor channel, and it is why the two gauges cannot disagree: '
      +'the pressure is set by the depth below the free surface and by nothing else &mdash; not by the shape of the '
      +'chamber, not by how much fluid is standing above the gauge'
      +((M.A.wet&&M.B.wet&&M.colA>0&&M.colB>0)?' (here, '+fmt(Math.max(M.colA,M.colB)/Math.max(1e-9,Math.min(M.colA,M.colB)),2)
        +' times as much on one side as the other)':'')+'.';
  } else if(v==='press'){
    name='the press'; sub=M.M>0?fmt(M.M,0)+' kg on the small piston':'nothing on the platform';
    body=hd('the two pistons')
      +row('small, area A<sub>1</sub>',fmt(CH_A_L,2)+' m<sup>2</sup>','ref')
      +row('large, area A<sub>2</sub>',fmt(CH_A_R,2)+' m<sup>2</sup>','ref')
      +row('A<sub>2</sub>/A<sub>1</sub>',fmt(CH_RATIO,3),'good')
      +hd('the load')
      +row('mass on it',fmt(M.M,0)+' kg')
      +row('its weight F<sub>1</sub>',fmt(M.P.Fin/1000,3)+' kN','bad')
      +row('&Delta;p = F<sub>1</sub>/A<sub>1</sub>',pStr(M.P.dp,st,4),'good')
      +row('F<sub>2</sub> = &Delta;p A<sub>2</sub>',fmt(M.P.Fout/1000,3)+' kN','good')
      +row('it would hold',fmt(M.liftable,0)+' kg','live')
      +hd('the two surfaces')
      +row('small side falls',fmt(M.P.dL,4)+' m','bad')
      +row('large side rises',fmt(M.P.dR,4)+' m','good')
      +row('they separate by',fmt(M.P.dh,4)+' m','live')
      +row('M/(&rho;<sub>eff</sub>A<sub>1</sub>)',fmt(M.M/(M.rhoEff*CH_A_L),4)+' m','ref')
      +row('&rho;<sub>eff</sub>',kgm3(M.rhoEff),st.atmosphere?'ref':'good')
      +hd('the gauges')
      +gaugeRow('gauge A',M.A,st)
      +gaugeRow('gauge B',M.B,st)
      +row('p at y = &minus;2.5, two ways',M.routeResid<1e-6?'agree':'differ',M.routeResid<1e-6?'good':'bad')
      +row('&nbsp; residual',M.routeResid.toExponential(1)+' Pa');
    note=M.P.capped
      ? '<b>The small column has reached the foot of its shaft.</b> Beyond this the two-column picture stops applying and '
        +'the numbers are capped, not solved. Take a mass off, or choose a denser fluid.'
      : '<b>Pascal&rsquo;s principle is one sentence.</b> A pressure applied anywhere in an enclosed fluid appears '
        +'everywhere in it. Put '+fmt(M.M,0)+' kg on '+fmt(CH_A_L,2)+' m<sup>2</sup> and you add '+pStr(M.P.dp,st,4)
        +' to every point of the fluid; the same pressure on the large piston is '+fmt(CH_RATIO,2)+' times the force. '
        +'What you do not get for free is distance: the small side falls '+fmt(CH_RATIO,2)+' times as far as the large '
        +'side rises, so the work is the same both ways.';
  } else if(v==='paradox'){
    name='the paradox'; sub=fluidName(M.rho)+', depth '+fmt(M.H,2)+' m';
    body=hd('every base, the same force')
      +row('depth h',fmt(M.H,2)+' m')
      +row('p at the base',pStr(M.pBase,st),'good')
      +row('base area',fmt(VESSELS[0].prof[0][1]*DEPTH_OUT,2)+' m<sup>2</sup>')
      +row('force on every base',fmt(M.Fbase/1000,2)+' kN','good')
      +hd('what each one holds');
    M.rows.forEach(r=>{
      body+=row(r.name,fmt(1000*r.V,0)+' L &nbsp; '+fmt(r.ratio,3),r.id===st.parPick?'live':'');
    });
    body+=row('heaviest / lightest',fmt(M.spread,3),'ref')
      +hd(M.pick.name+', in full')
      +row('volume',litres(M.pick.V))
      +row('weight W',fmt(M.pick.W/1000,2)+' kN','ref')
      +row('force on the base',fmt(M.pick.Fbase/1000,2)+' kN','good')
      +row('F/W',fmt(M.pick.ratio,4),'live')
      +row('walls push up by',fmt(M.pick.Fwall/1000,2)+' kN','good')
      +row('W &minus; F<sub>base</sub>',fmt((M.pick.W-M.pick.Fbase)/1000,2)+' kN','ref')
      +row('they differ by',M.pick.resid<1e-6?'nothing':M.pick.resid.toExponential(1)+' N',
           M.pick.resid<1e-6?'good':'bad')
      +row('vs a 20000-strip sum',M.worstResid.toExponential(1));
    note='<b>The force on the base is not the weight of the fluid.</b> It is p times the area, and p is &rho;gh whatever '
      +'the vessel looks like. The difference is carried by the slanted walls: they push '
      +(M.pick.Fwall>=0?'UP on the fluid where the vessel widens with height':'DOWN on the fluid where it narrows')
      +', by exactly W &minus; F<sub>base</sub>. This view computes that wall force by integrating the pressure over the '
      +'walls, without using the force balance, so the agreement is a check and not a definition.';
  } else {
    name='the column'; sub=fluidName(M.here.rho)+' on '+gName(M.g);
    body=hd('the line')
      +row('intercept p<sub>atm</sub>',pStr(M.p0,st),'ref')
      +row('slope &rho;g',fmt(M.here.slope/1000,4)+' kPa/m','good')
      +row('&nbsp; in atm',sigf(M.here.slope/PA_PER_ATM,4)+' atm/m')
      +row('&nbsp; in psi',sigf(M.here.slope/PA_PER_PSI,4)+' psi/m')
      +row('at h = '+fmt(M.d,2)+' m',pStr(M.here.p,st),'live')
      +hd('the same number, three ways')
      +row('kPa',fmt(toUnit(M.here.p,'metric'),3),'good')
      +row('atm',fmt(toUnit(M.here.p,'atmosphere'),5),'good')
      +row('psi',fmt(toUnit(M.here.p,'english'),4),'good')
      +hd('the exact definitions')
      +row('1 atm',fmt(PA_PER_ATM,0)+' Pa','ref')
      +row('1 psi',fmt(PA_PER_PSI,6)+' Pa','ref')
      +row('1 atm in psi',fmt(M.psiPerAtm,8),'ref')
      +row('PhET&rsquo;s atm is off by',M.phetAtm.toExponential(2)+' atm')
      +row('PhET&rsquo;s psi is off by',M.phetPsi.toExponential(2)+' psi')
      +hd('depths worth knowing')
      +row('one atmosphere of this',fmt(M.dAtm,3)+' m','good')
      +row('&nbsp; water at g<sub>n</sub>',fmt(M.dAtmWaterStd,4)+' m','ref')
      +row('the reading doubles at',isFinite(M.dDouble)?fmt(M.dDouble,3)+' m':'never (no atmosphere)','live');
    note='<b>The whole sim is one straight line.</b> Pressure against depth has intercept p<sub>atm</sub> and slope '
      +'&rho;g, and every control in this file moves exactly one of those two. Changing the units does not move the line '
      +'at all &mdash; it relabels the axis, which is why the three scales are drawn on the same picture.';
  }
  return '<div class="rname">'+name+'<small>'+sub+'</small></div><table>'+body+'</table><div class="note">'+note+'</div>';
}

    +' &nbsp;&rarr;&nbsp; F<sub>2</sub> = <span class="hl2">'+fmt(CH_RATIO,2)+' F<sub>1</sub></span> = '+fmt(M.P.Fout/1000,2)+' kN'
    +'<span class="sm">Pascal: the added pressure reaches every point, so the force scales with the area it acts on</span>';

  if(v==='paradox') return '<span class="lhs">F<sub>base</sub></span> = <span class="hl">&rho; g h A</span>'
    +' &ne; W &nbsp;&nbsp; F<sub>wall,z</sub> = <span class="hl2">W &minus; F<sub>base</sub></span> = '

    +'<span class="sm">a straight line, and three names for the same number</span>';
}

function tagHTML(M,st){
  st=st||ST;
  const v=st.view;
  if(v==='pool') return '<b>the pool</b> &mdash; PhET&rsquo;s square pool';
  if(v==='shapes') return '<b>the shapes</b> &mdash; PhET&rsquo;s trapezoid pool';

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy and buoyancy-basics, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}
/* the fluid: a translucent slab from ybot up to the surface yw across [x0, x1] */
function fluidRect(ctx,map,x0,x1,ybot,yw,col){
  const X0=map.X(x0), X1=map.X(x1), Y0=map.Y(yw), Y1=map.Y(ybot);
  ctx.fillStyle=col||rgba(COL.struct,0.16); ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle=rgba(COL.struct,0.8); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y0); ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y0);
}
/* a force arrow whose world length is len x (F / Fref), with its label */
function forceArrow(ctx,W,H,map,at,F,Fref,dir,len,col,txt,labDx){
  const v=[0,dir*len*Math.min(Math.abs(F)/Math.max(Fref,1e-12),1.6)];
  arrowW(ctx,map,at,v,col,2);
  const tip=[at[0]+v[0],at[1]+v[1]];
  if(txt) lab(ctx,W,H,map.X(tip[0])+(labDx===undefined?8:labDx),map.Y(tip[1]),txt,col,LAB_FONT,labDx!==undefined&&labDx<0?'right':'left');
}

/* ================================================================== *
 *  the pool stage, shared by the four scene views, then view A and B  *
 * ================================================================== */
/* every layout reserves HINT_H at the bottom: the house #hint is HTML at
   bottom:11px and the canvas capture cannot see it, so a caption anchored at
   H - 12 would sit underneath it (Known-bad, wave-on-a-string).  The caption's
   own band is registered too, so a stage label near the bottom dodges it. */
function layout(ctx,W,H,full,short,nB,frac,nBn){
  const L=stageLayout(ctx,W,H-HINT_H,full,short,nB,frac,nBn);
  LABELS.push([L.left-2,L.capY-5,L.left+L.capW+2,H-HINT_H-6]);
  return L;
}
/* a label that must be drawn where it is: painted unconditionally AND
   registered, so every dodging lab() after it moves aside */
function labFixed(ctx,x,y,txt,col,font,align,base){
  ctx.fillStyle=col; ctx.font=font;
  ctx.textAlign=align||'center'; ctx.textBaseline=base||'middle';
  const t=plain(txt), fs=parseFloat(font.match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  const lx=align==='right'?x-w:(align==='left'?x:x-w/2);
  const ly=base==='top'?y:(base==='bottom'?y-hh:y-hh/2);
  LABELS.push([lx,ly,lx+w,ly+hh]);
  ctx.fillText(t,x,y);
}
/* axes(), with the TICK LABELS, the axis names and the title registered */
function axesReg(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  axes(ctx,b,xlo,xhi,ylo,yhi,o);
  const fw=(s,px)=>plain(''+s).length*px*0.52;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=fw(o.xfmt?o.xfmt(t):fmt(t,2),10.5);
    LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+10.5*1.15]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=fw(o.yfmt?o.yfmt(t):fmt(t,2),10.5);
    LABELS.push([b.x-6-w,Y-6.04,b.x-6,Y+6.04]); }
  if(o.xlab){ const w=fw(o.xlab,11); LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+33.65]); }
  if(o.ylab){ const w=fw(o.ylab,11); LABELS.push([b.x-52.65,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
  if(o.title){ const w=fw(o.title,13); LABELS.push([b.x,b.y-23.95,b.x+w,b.y-9]); }
}
/* legendAuto() records its box in LEGEND_RECTS, which lab() does not consult,
   so a note placed in "the empty corner" landed on the legend.  Register it. */
function legendReg(ctx,b,items){
  const r=legendAuto(ctx,b,items);
  if(r) LABELS.push([r.x,r.y,r.x1,r.y1]);
  return r;
}
/* a wide stage drawing a nearly square picture at equal aspect wastes most of
   its width, so the pool takes the left and one analysis panel the right */
function splitMain(L,W,fracLeft,nRight){
  const b=L.main;
  if(isNarrow(W)||nRight<1) return {pool:b,rows:[]};
  const gut=66, wl=Math.round(b.w*fracLeft);
  const pool=box(b.x,b.y,Math.max(120,wl-gut/2),b.h);
  const rx=b.x+wl+gut/2, rw=Math.max(150,b.x1-rx);
  const rows=[], slot=b.h/nRight;
  for(let i=0;i<nRight;i++) rows.push(box(rx,b.y+i*slot+26,rw,Math.max(60,slot-64)));
  return {pool:pool,rows:rows};
}

const GROUND='#20242e', GROUND2='#171b23';
/* each fluid gets its own tint, so the density slider visibly changes the pool */
function fluidColour(rho){
  const t=clamp((rho-RHO_GASOLINE)/(RHO_HONEY-RHO_GASOLINE),0,1);
  return mix('#c9c04a',mix(COL.struct,'#c9962a',t>0.5?(t-0.5)*2:0),t<0.5?t*2:1);
}
function extentFor(scene){
  if(scene==='trapezoid') return {xmin:1.30,xmax:8.30,ymin:-POOL_H-0.12,ymax:0.62};
  /* the chamber's ymax only has to clear the tallest stack: the platform rests
     at y = -0.70 with nothing on it and the three masses are 1.00 m together,
     so 0.62 is ample and 1.35 was giving away a third of the picture */
  if(scene==='chamber')  return {xmin:1.25,xmax:8.35,ymin:-POOL_H-0.12,ymax:0.62};
  return {xmin:1.55,xmax:6.75,ymin:-POOL_H-0.12,ymax:0.62};
}
/* the cavity each scene cuts out of the ground, as world polygons */
function cavityPolys(scene){
  if(scene==='trapezoid'){
    /* ONE outline, not three overlapping ones: the channel bridges the two
       chambers along the floor, so the cavity is a single U with two prongs.
       Stroking three overlapping rectangles would draw the channel's top edge
       straight through both chambers. */
    const l0=tzLeft(0), l3=tzLeft(POOL_H), lb=tzLeft(TZ_CHAN.t1);
    const r0=tzRight(0), r3=tzRight(POOL_H), rb=tzRight(TZ_CHAN.t1);
    const yb=-POOL_H+TZ_CHAN.t1;
    return [[[l3[0],0],[l0[0],-POOL_H],[r0[1],-POOL_H],[r3[1],0],
             [r3[0],0],[rb[0],yb],[lb[1],yb],[l3[1],0]]];
  }
  if(scene==='chamber'){
    const R=(a,b,y0,y1)=>[[a,y1],[b,y1],[b,y0],[a,y0]];
    return [R(CH_LEFT.x0,CH_LEFT.x1,-POOL_H,CH_OPEN_BOT),
            R(CH_RIGHT.x0,CH_RIGHT.x1,-POOL_H,CH_OPEN_BOT),
            R(CH_LEFT.x1,CH_RIGHT.x0,-2.75,-2.25),
            R(CH_L_SHAFT.x0,CH_L_SHAFT.x1,CH_OPEN_BOT,0),
            R(CH_R_SHAFT.x0,CH_R_SHAFT.x1,CH_OPEN_BOT,0)];
  }
  return [[[SQ_X0,0],[SQ_X1,0],[SQ_X1,-POOL_H],[SQ_X0,-POOL_H]]];
}
/* the fluid, as world polygons, for a flat surface at ySurf */
function fluidPolys(scene,ySurf,P){
  if(scene==='trapezoid'){
    /* NON-OVERLAPPING pieces, so the drawn area times the out-of-page depth is
       exactly the model volume (selfTest asserts it).  Inside the floor
       channel the cross-section is one band running from the left chamber's
       left wall to the right chamber's right wall; above it the two chambers
       are separate. */
    const out=[];
    const tS=clamp(ySurf+POOL_H,0,POOL_H);
    if(tS<=0) return out;
    const tb=Math.min(tS,TZ_CHAN.t1), yb=-POOL_H+tb;
    out.push([[tzLeft(0)[0],-POOL_H],[tzRight(0)[1],-POOL_H],
              [tzRight(tb)[1],yb],[tzLeft(tb)[0],yb]]);
    if(tS>TZ_CHAN.t1){
      const l1=tzLeft(TZ_CHAN.t1), l2=tzLeft(tS), r1=tzRight(TZ_CHAN.t1), r2=tzRight(tS);
      const y1=-POOL_H+TZ_CHAN.t1;
      out.push([[l1[0],y1],[l1[1],y1],[l2[1],ySurf],[l2[0],ySurf]]);
      out.push([[r1[0],y1],[r1[1],y1],[r2[1],ySurf],[r2[0],ySurf]]);
    }
    return out;
  }
  if(scene==='chamber'){
    const R=(a,b,y0,y1)=>[[a,y1],[b,y1],[b,y0],[a,y0]];
    return [R(CH_LEFT.x0,CH_LEFT.x1,-POOL_H,CH_OPEN_BOT),
            R(CH_RIGHT.x0,CH_RIGHT.x1,-POOL_H,CH_OPEN_BOT),
            R(CH_LEFT.x1,CH_RIGHT.x0,-2.75,-2.25),
            R(CH_L_SHAFT.x0,CH_L_SHAFT.x1,CH_OPEN_BOT,P.yL),
            R(CH_R_SHAFT.x0,CH_R_SHAFT.x1,CH_OPEN_BOT,P.yR)];
  }
  if(ySurf<=-POOL_H) return [];
  return [[[SQ_X0,ySurf],[SQ_X1,ySurf],[SQ_X1,-POOL_H],[SQ_X0,-POOL_H]]];
}
/* the free-surface segments, drawn last so the waterline reads as a line */
function surfaceSegs(scene,ySurf,P){
  if(scene==='trapezoid'){
    const tS=clamp(ySurf+POOL_H,0,POOL_H);
    if(tS<=0) return [];
    if(tS<=TZ_CHAN.t1) return [[tzLeft(tS)[0],tzRight(tS)[1],ySurf]];
    const l=tzLeft(tS), r=tzRight(tS);
    return [[l[0],l[1],ySurf],[r[0],r[1],ySurf]];
  }
  if(scene==='chamber') return [[CH_L_SHAFT.x0,CH_L_SHAFT.x1,P.yL],[CH_R_SHAFT.x0,CH_R_SHAFT.x1,P.yR]];
  if(ySurf<=-POOL_H) return [];
  return [[SQ_X0,SQ_X1,ySurf]];
}

/* the whole pool picture: ground, cavity, fluid, grid, ruler */
function drawPool(ctx,W,H,b,scene,ySurf,rho,st,P){
  const E=extentFor(scene), map=worldFitUp(b,E,0.05);
  /* the ground: one slab, with the cavities cut out by painting them air */
  worldPoly(ctx,map,[[E.xmin,E.ymin],[E.xmax,E.ymin],[E.xmax,0],[E.xmin,0]],GROUND,GROUND2,1.2);
  const cav=cavityPolys(scene);
  for(const p of cav) worldPoly(ctx,map,p,COL.air,null);
  const col=fluidColour(rho);
  for(const p of fluidPolys(scene,ySurf,P)) worldPoly(ctx,map,p,rgba(col,0.30),null);
  for(const p of cav) worldPoly(ctx,map,p,null,rgba(COL.struct,0.55),1.3);
  for(const s of surfaceSegs(scene,ySurf,P)){
    ctx.beginPath(); ctx.moveTo(map.X(s[0]),map.Y(s[2])); ctx.lineTo(map.X(s[1]),map.Y(s[2]));
    ctx.strokeStyle=rgba(col,0.95); ctx.lineWidth=2; ctx.stroke();
    POLY_SEGS.push(map.X(s[0]),map.Y(s[2]),map.X(s[1]),map.Y(s[2]));
  }
  /* the ground line */
  seg(ctx,map,[E.xmin,0],[E.xmax,0],rgba('#5b6480',0.8),1.2);
  if(st.gridOn) drawGrid(ctx,W,H,map,E,st);
  if(st.rulerOn) drawRuler(ctx,W,H,map,E,st,scene);
  return map;
}
/* PhET's grid: horizontal lines through the pool, labelled in the chosen
   length unit, with the ground as the zero */
function drawGrid(ctx,W,H,map,E,st){
  const u=UNITS[st.units], step=u.lenPer===1?0.5:FT_M;
  ctx.save();
  for(let k=0;k*step<=POOL_H+1e-9;k++){
    const y=-k*step;
    ctx.beginPath(); ctx.moveTo(map.X(E.xmin),map.Y(y)); ctx.lineTo(map.X(E.xmax),map.Y(y));
    ctx.strokeStyle=rgba('#5ac8e0',k%2===0?0.20:0.10); ctx.lineWidth=1; ctx.stroke();
    /* on the RIGHT: the ruler stands on the left and its own numbers were
       landing on the grid's */
    if(k%2===0&&k>0) lab(ctx,W,H,map.X(E.xmax)-4,map.Y(y)-7,fmt(toLen(k*step,st.units),u.lenPer===1?1:0)+' '+u.len,
                         rgba('#5ac8e0',0.75),SM_FONT,'right');
  }
  ctx.restore();
}
/* PhET's ruler: a stick standing beside the pool, in metres or feet */
function drawRuler(ctx,W,H,map,E,st,scene){
  const u=UNITS[st.units], step=u.lenPer===1?0.5:FT_M;
  const x0=E.xmin+0.10, w=0.34;
  worldPoly(ctx,map,[[x0,0.35],[x0+w,0.35],[x0+w,-POOL_H],[x0,-POOL_H]],'#2b3242','#586378',1.2);
  for(let k=0;k*step<=POOL_H+1e-9;k++){
    const y=-k*step, big=(k%2===0);
    seg(ctx,map,[x0,y],[x0+(big?w:w*0.5),y],rgba('#cfd4de',big?0.85:0.45),1);
    if(big) labFixed(ctx,map.X(x0+w)+3,map.Y(y),fmt(toLen(k*step,st.units),u.lenPer===1?1:0),
                     '#aeb6c6',SM_FONT,'left','middle');
  }
  labFixed(ctx,map.X(x0+w/2),map.Y(0.20),u.len,'#aeb6c6',SM_FONT,'center','middle');
}
/* a gauge: the probe dot at its world point and a readout box above it */
function drawGauge(ctx,W,H,map,x,y,G,tag,col,st){
  const X=map.X(x), Y=map.Y(y);
  const txt=G.out?'in the ground':(G.wet?pStr(G.p,st):pStr(G.p,st)+' air');
  ctx.save();
  ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X,Y-19);
  ctx.strokeStyle=rgba(col,0.85); ctx.lineWidth=1.4; ctx.stroke();
  dot(ctx,X,Y,5,G.wet?col:COL.off,col,1.6);
  ctx.restore();
  /* the probe dot and its stem go into the label registry too: only the box
     was registered, so a stage label could land straight on the marker */
  LABELS.push([X-7,Y-21,X+7,Y+7]);
  const t=plain(tag+'  '+txt);
  ctx.font='bold 11.5px -apple-system, sans-serif';
  const bw=t.length*11.5*0.52+14, bh=19;
  /* the box dodges everything already registered -- two gauges at the same
     height used to stack their boxes on top of each other */
  const cands=[[X-bw/2,Y-19-bh],[X-bw/2,Y+19],[X+14,Y-bh/2],[X-bw-14,Y-bh/2],
               [X-bw/2,Y-19-bh-24],[X-bw/2,Y+19+24],[X+14,Y-bh-20],[X-bw-14,Y+20]];
  let bx=clamp(X-bw/2,2,W-bw-2), by=clamp(Y-19-bh,2,H-bh-2);
  for(const [px,py] of cands){
    const cx2=clamp(px,2,W-bw-2), cy2=clamp(py,2,H-bh-2);
    if(labFits([cx2,cy2,cx2+bw,cy2+bh])){ bx=cx2; by=cy2; break; }
  }
  ctx.fillStyle=rgba('#0a0c12',0.92); ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=rgba(col,0.8); ctx.lineWidth=1.2; ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
  LABELS.push([bx,by,bx+bw,by+bh]);
  ctx.fillStyle=G.wet?col:COL.dim; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(t,bx+bw/2,by+bh/2);
  return {x:bx,y:by,w:bw,h:bh};
}
/* the faucet and the drain, drawn as the fixtures they are (this file's
   control is a LEVEL, not a flow rate, so nothing is animated) */
function drawPlumbing(ctx,W,H,map,scene,st){
  const fx=(scene==='trapezoid')?3.19:2.70, dy=-POOL_H;
  worldPoly(ctx,map,[[fx-0.36,0.56],[fx-0.10,0.56],[fx-0.10,0.30],[fx-0.36,0.30]],'#2b3242','#586378',1.1);
  worldPoly(ctx,map,[[fx-0.13,0.44],[fx+0.16,0.44],[fx+0.16,0.30],[fx-0.13,0.30]],'#2b3242','#586378',1.1);
  const dx=(scene==='trapezoid')?7.10:5.60;
  worldPoly(ctx,map,[[dx-0.16,dy],[dx+0.16,dy],[dx+0.16,dy-0.16],[dx-0.16,dy-0.16]],'#2b3242','#586378',1.1);
  lab(ctx,W,H,map.X(fx)+18,map.Y(0.43),'faucet',COL.dim,SM_FONT,'left');
  lab(ctx,W,H,map.X(dx)+16,map.Y(dy-0.08),'drain',COL.dim,SM_FONT,'left');
}

/* ================================================================== *
 *  view A: the pool  (PhET's square pool scene)                       *
 * ================================================================== */
const POOL_CAP_FULL='PhET&rsquo;s square pool scene, drawn at true proportion: '+fmt(SQ_W,1)+' m across, '+fmt(POOL_H,0)
  +' m deep and '+fmt(DEPTH_OUT,0)+' m out of the page, so it holds '+fmt(SQ_VMAX*1000,0)+' L when full. The faucet and '
  +'the drain set the level; the two gauges read p = p_atm + ρgh at whatever point you drag them to, and read the air '
  +'above the surface and nothing at all outside the pool. Put both at the same depth and the two numbers are identical '
  +'to the last digit, however much fluid is standing over each of them. The strip on the right is the same law as a '
  +'line: intercept p_atm, slope ρg, and the two gauges on it.';
const POOL_CAP_SHORT='PhET&rsquo;s square pool at true proportion. Two gauges reading p = p_atm + ρgh, and the same law '
  +'drawn as a line of slope ρg.';

function pDepthPanel(ctx,W,H,b,M,st,marks,title){
  const u=UNITS[st.units];
  const pTop=toUnit(pressureAt(0,M.rho,M.g,M.ySurf===undefined?0:M.ySurf,st.atmosphere),st.units);
  const pBot=toUnit(pressureAt(POOL_H,M.rho,M.g,M.ySurf===undefined?0:M.ySurf,st.atmosphere),st.units);
  const xlo=0, xhi=Math.max(pBot*1.06,pTop+1e-6);
  axesReg(ctx,b,xlo,xhi,POOL_H,0,{nx:5,ny:4,xlab:'pressure, '+u.name,ylab:'depth, m',
    title:titleFor(b,title||'the law as a line: p = p_atm + ρgh','p against depth'),
    xfmt:t=>fmt(t,u.dp===3?2:(u.dp===1?0:1)),yfmt:t=>fmt(t,1)});
  /* the air-pressure intercept */
  polyline(ctx,b,[pTop,pTop],[0,POOL_H],xlo,xhi,POOL_H,0,rgba(COL.ref,0.85),1.4,[5,4]);
  lab(ctx,W,H,b.x+b.w*(pTop-xlo)/(xhi-xlo)+6,b.y+13,'p_atm',COL.ref,SM_FONT,'left');
  /* the law */
  const xs=[],ys=[];
  for(let i=0;i<=60;i++){ const d=POOL_H*i/60;
    xs.push(toUnit(pressureAt(d,M.rho,M.g,M.ySurf===undefined?0:M.ySurf,st.atmosphere),st.units)); ys.push(d); }
  polyline(ctx,b,xs,ys,xlo,xhi,POOL_H,0,COL.pos,1.8);
  /* the part of the axis the fluid actually occupies */
  const dMax=(M.level===undefined)?POOL_H:M.level;
  polyline(ctx,b,[xlo,xhi],[dMax,dMax],xlo,xhi,POOL_H,0,rgba(COL.struct,0.55),1.2,[3,3]);
  lab(ctx,W,H,b.x1-5,b.y1-b.h*(POOL_H-dMax)/POOL_H-11,'the floor',COL.struct,SM_FONT,'right');
  for(const m of marks){
    if(!m.G.wet) continue;
    marker(ctx,b,xlo,xhi,POOL_H,0,toUnit(m.G.p,st.units),m.G.depth,m.col);
    lab(ctx,W,H,b.x+b.w*(toUnit(m.G.p,st.units)-xlo)/(xhi-xlo)+9,b.y1-b.h*(POOL_H-m.G.depth)/POOL_H,
        m.tag,m.col,SM_FONT,'left');
  }
  /* the slope is quoted in the unit the axis is drawn in, not always in kPa */
  lab(ctx,W,H,b.x+4,b.y1-8,'slope ρg = '+sigf(toUnit(M.rho*M.g,st.units),4)+' '+u.name+'/m',
      COL.pos,SM_FONT,'left');
}

function drawPoolView(ctx,W,H,M,st){
  const L=layout(ctx,W,H,POOL_CAP_FULL,POOL_CAP_SHORT,0,0);
  const S=splitMain(L,W,0.56,1);
  const map=drawPool(ctx,W,H,S.pool,'square',M.ySurf,M.rho,st,null);
  drawPlumbing(ctx,W,H,map,'square',st);
  /* the gauges go down FIRST so every prose label below dodges their boxes */
  drawGauge(ctx,W,H,map,st.gAx,st.gAy,M.A,'A',COL.live,st);
  drawGauge(ctx,W,H,map,st.gBx,st.gBy,M.B,'B',COL.pos,st);
  lab(ctx,W,H,map.X((SQ_X0+SQ_X1)/2),map.Y(M.ySurf)-13,
      fluidName(M.rho)+' · '+fmt(1000*M.V,0)+' L · '+fmt(M.level,2)+' m deep',
      fluidColour(M.rho),SM_FONT,'center');
  lab(ctx,W,H,map.X(SQ_X0),map.Y(-POOL_H)+15,
      'true proportion · '+fmt(DEPTH_OUT,0)+' m out of the page',COL.dim,SM_FONT,'left');
  if(!st.atmosphere) lab(ctx,W,H,map.X((SQ_X0+SQ_X1)/2),map.Y(0.42),'atmosphere OFF — gauge pressure only',
                         COL.ref,SM_FONT,'center');
  if(S.rows.length) pDepthPanel(ctx,W,H,S.rows[0],M,st,
    [{G:M.A,tag:'A',col:COL.live},{G:M.B,tag:'B',col:COL.pos}]);
  drawCaption(ctx,L);
}

const SHAPE_CAP_FULL='PhET&rsquo;s trapezoid pool: two chambers that taper in opposite directions, joined by a channel '
  +'along the floor. The left one is '+fmt(TZ_WTOP,2)+' m across at the top and '+fmt(TZ_WBOT,2)+' m at the bottom; the '
  +'right one is the same shape upside down. Put one gauge in each at the same depth and they read the same number, even '
  +'though the fluid standing above them differs by a factor of several — this is the hydrostatic paradox, and the panel '
  +'on the right shows why the level behaves so simply: the two widths are equal and opposite linear functions of height, '
  +'so they SUM to a constant '+fmt(TZ_WSUM,2)+' m. PhET&rsquo;s own floor channel stops 7 cm short of the right '
  +'chamber; this file closes that gap so the fluid is one connected body.';
const SHAPE_CAP_SHORT='PhET&rsquo;s trapezoid pool. Two opposite tapers, one level, one pressure at one depth — and two '
  +'widths that sum to a constant.';

function widthPanel(ctx,W,H,b,M,st){
  const xs=[],wl=[],wr=[],ws=[];
  for(let i=0;i<=60;i++){ const t=POOL_H*i/60, l=tzLeft(t), r=tzRight(t);
    xs.push(t); wl.push(l[1]-l[0]); wr.push(r[1]-r[0]); ws.push((l[1]-l[0])+(r[1]-r[0])); }
  const hi=TZ_WSUM*1.12;
  axesReg(ctx,b,0,POOL_H,0,hi,{nx:4,ny:4,xlab:'height above the floor, m',ylab:'width, m',
    title:titleFor(b,'the two chambers, and their constant sum','widths')});
  polyline(ctx,b,xs,wl,0,POOL_H,0,hi,COL.live,1.7);
  polyline(ctx,b,xs,wr,0,POOL_H,0,hi,COL.struct,1.7);
  polyline(ctx,b,xs,ws,0,POOL_H,0,hi,COL.pos,2.0);
  polyline(ctx,b,[M.level,M.level],[0,hi],0,POOL_H,0,hi,rgba(COL.ref,0.7),1.2,[4,3]);
  legendReg(ctx,b,[[COL.live,'left chamber'],[COL.struct,'right chamber'],
                    [COL.pos,'sum = '+fmt(TZ_WSUM,2)+' m']]);
  lab(ctx,W,H,b.x+b.w*M.level/POOL_H+6,b.y1-10,'the level',COL.ref,SM_FONT,'left');
}

function drawShapesView(ctx,W,H,M,st){
  const L=layout(ctx,W,H,SHAPE_CAP_FULL,SHAPE_CAP_SHORT,0,0);
  const S=splitMain(L,W,0.58,1);
  const map=drawPool(ctx,W,H,S.pool,'trapezoid',M.ySurf,M.rho,st,null);
  drawPlumbing(ctx,W,H,map,'trapezoid',st);
  drawGauge(ctx,W,H,map,st.gAx,st.gAy,M.A,'A',COL.live,st);
  drawGauge(ctx,W,H,map,st.gBx,st.gBy,M.B,'B',COL.pos,st);
  /* PhET's own gap, marked where it is */
  seg(ctx,map,[TZ_CHAN_PHET_X1,-POOL_H],[TZ_CHAN_PHET_X1,-POOL_H+0.17],rgba(COL.ref,0.8),1.4,[3,2]);
  lab(ctx,W,H,map.X(TZ_CHAN_PHET_X1)+5,map.Y(-POOL_H+0.34),'PhET stops here',COL.ref,SM_FONT,'left');
  lab(ctx,W,H,map.X((tzLeft(M.level)[0]+tzLeft(M.level)[1])/2),map.Y(M.ySurf)-12,
      fmt(M.wLeft,2)+' m',COL.live,SM_FONT,'center');
  lab(ctx,W,H,map.X((tzRight(M.level)[0]+tzRight(M.level)[1])/2),map.Y(M.ySurf)-12,
      fmt(M.wRight,2)+' m',COL.struct,SM_FONT,'center');
  if(M.A.wet&&M.B.wet){
    seg(ctx,map,[tzLeft(0)[0],st.gAy],[tzRight(0)[1],st.gAy],rgba(COL.pos,0.30),1,[4,4]);
    lab(ctx,W,H,map.X(tzLeft(0)[0])+4,map.Y(st.gAy)+12,
        M.sameDepth?('same depth — the readings differ by '+(M.dP<1e-9?'nothing':fmt(M.dP,3)+' Pa'))
                   :('depths differ by '+fmt(Math.abs(M.A.depth-M.B.depth),3)+' m'),
        M.sameDepth?COL.pos:COL.ref,SM_FONT,'left');
  }
  lab(ctx,W,H,map.X(tzLeft(0)[0]),map.Y(-POOL_H)+15,
      'true proportion · '+fmt(DEPTH_OUT,0)+' m out of the page · holds '+fmt(1000*M.V,0)+' L',
      COL.dim,SM_FONT,'left');
  if(S.rows.length) widthPanel(ctx,W,H,S.rows[0],M,st);
  drawCaption(ctx,L);
}

const PRESS_CAP_FULL='PhET&rsquo;s chamber pool. Two shafts of very different width, '+fmt(CH_L_W,2)+' m and '
  +fmt(CH_R_W,2)+' m across — '+fmt(CH_A_L,2)+' and '+fmt(CH_A_R,2)+' m² with the '+fmt(DEPTH_OUT,0)+' m out-of-page '

  +'the work is the same either way. The panel on the right is the whole of it: displacement against load, straight '
  +'lines whose slopes are in the ratio of the areas.';
const PRESS_CAP_SHORT='PhET&rsquo;s chamber pool: Pascal&rsquo;s principle, with the force multiplied by the area ratio '
  +fmt(CH_RATIO,1)+' and the distance divided by it.';

function drawMasses(ctx,W,H,map,M,st){
  const cx=(CH_L_SHAFT.x0+CH_L_SHAFT.x1)/2;
  /* the platform sits on the small column */
  worldPoly(ctx,map,[[CH_L_SHAFT.x0-0.06,M.P.yL],[CH_L_SHAFT.x1+0.06,M.P.yL],
                     [CH_L_SHAFT.x1+0.06,M.P.yL+0.05],[CH_L_SHAFT.x0-0.06,M.P.yL+0.05]],
            '#39405a','#6b7285',1.2);
  let y=M.P.yL+0.05;
  for(const o of M.onMasses){
    worldPoly(ctx,map,[[cx-o.w/2,y],[cx+o.w/2,y],[cx+o.w/2,y+o.h],[cx-o.w/2,y+o.h]],COL.mass,'#0b0f18',1.4);
    /* a label only where the box is tall enough to hold one: at 560 px the
       two 0.25 m masses are 9 px high and their labels sat on each other */
    if(map.Y(y)-map.Y(y+o.h)>=15)
      labFixed(ctx,map.X(cx),map.Y(y+o.h/2),fmt(o.m,0)+' kg','#0b0f18','bold 11px -apple-system, sans-serif','center','middle');
    LABELS.push([map.X(cx-o.w/2),map.Y(y+o.h),map.X(cx+o.w/2),map.Y(y)]);
    y+=o.h;
  }
  if(M.M>0) lab(ctx,W,H,map.X(cx)-map.s*0.30,map.Y(M.P.yL+0.05),fmt(M.M,0)+' kg',COL.mass,SM_FONT,'right');
  else lab(ctx,W,H,map.X(cx),map.Y(M.P.yL+0.30),'nothing on the platform',COL.dim,SM_FONT,'center');
}

function pressPanel(ctx,W,H,b,M,st){
  const xs=[],dl=[],dr=[],dh=[];
  for(let i=0;i<=60;i++){ const m=CH_MASS_MAX*i/60, P=pascal(m,M.rho,M.g,st.atmosphere);
    xs.push(m); dl.push(P.dL); dr.push(P.dR); dh.push(P.dh); }
  const hi=Math.max(CH_WATER*1.15,Math.max.apply(null,dh)*1.08);
  axesReg(ctx,b,0,CH_MASS_MAX,0,hi,{nx:5,ny:4,xlab:'load on the small piston, kg',ylab:'displacement, m',
    title:titleFor(b,'displacement against load: two straight lines','displacement vs load')});
  polyline(ctx,b,[0,CH_MASS_MAX],[CH_WATER,CH_WATER],0,CH_MASS_MAX,0,hi,rgba(COL.ref,0.8),1.3,[5,4]);
  lab(ctx,W,H,b.x+5,b.y1-b.h*CH_WATER/hi-11,'the shaft bottoms out',COL.ref,SM_FONT,'left');
  polyline(ctx,b,xs,dl,0,CH_MASS_MAX,0,hi,COL.live,1.8);
  polyline(ctx,b,xs,dr,0,CH_MASS_MAX,0,hi,COL.struct,1.8);
  polyline(ctx,b,xs,dh,0,CH_MASS_MAX,0,hi,COL.pos,1.6,[6,3]);
  marker(ctx,b,0,CH_MASS_MAX,0,hi,M.M,M.P.dL,COL.live);
  marker(ctx,b,0,CH_MASS_MAX,0,hi,M.M,M.P.dR,COL.struct);
  legendReg(ctx,b,[[COL.live,'small side falls'],[COL.struct,'large side rises'],
                    [COL.pos,'they separate by Δh']]);
  lab(ctx,W,H,b.x+4,b.y1-8,'slopes in the ratio '+fmt(CH_RATIO,2)+' = A2/A1',COL.pos,SM_FONT,'left');
}

function drawPressView(ctx,W,H,M,st){
  const L=layout(ctx,W,H,PRESS_CAP_FULL,PRESS_CAP_SHORT,0,0);

      'A1 = '+fmt(CH_A_L,2)+' m²',COL.live,SM_FONT,'center');

    /* inside the stage, not past its right edge: at +8 past the wide shaft it

    lab(ctx,W,H,map.X(CH_R_SHAFT.x0)-8,map.Y((CH_REST+M.P.yR)/2),'↑ '+fmt(M.P.dR,3)+' m',COL.struct,SM_FONT,'right');
