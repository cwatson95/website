<title>Masses and springs &mdash; Hooke&rsquo;s law you can hang a mass on, and the damped oscillator in closed form</title>
<!--
  ===================================================================
  masses-and-springs-basics.html — hang a mass on a spring and it
  stretches by mg/k; let it go and it bounces at 2π√(m/k), whatever
  the gravity; damp it and the amplitude falls by a fixed factor each
  period. PhET's three screens, with the closed-form solution, its
  three regimes and its energy ledger beside them
  ===================================================================

  Remake of PhET Interactive Simulations' Masses and Springs: Basics
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no
  PhET code or assets.  The model, its constants and its controls follow PhET's
  build 1.0.28 (docs/phets/masses-and-springs-basics_en.html) and the
  masses-and-springs doc/model.md; every number taken from that build is marked
  "PhET's value" in the code and in the panel.

  Six views.  THE STRETCH is PhET's first screen: two springs under a ceiling,
  a rack of masses to hang on them, a spring-strength slider each (PhET's
  3-12 N/m), the unstretched-length and resting-position lines, a movable
  reference line and a ruler.  Hooke's law is all it is: the extension is
  mg/k, so at the same mass a stiff spring stretches less, in exact
  proportion.  THE BOUNCE is PhET's second screen with the damping turned
  off: the same two springs, released and oscillating, each drawing its own
  height against time.  THE LAB is PhET's third: one spring, a mass slider
  (50-300 g), gravity by planet or by slider, a period trace and a stopwatch.
  THE PERIOD LAW puts the measured period of the
  drawn motion on top of T = 2π√(m/k) across every mass and spring the sim
  allows, and shows that changing gravity moves the hanging point and not the
  period.  THE DAMPING draws the three regimes of m u" + b u' + k u = 0 and
  where PhET's own ranges sit in them.  THE ENERGY follows the kinetic,
  elastic, gravitational and thermal shares through a damped swing.

  THE MODEL (PhET's values)
  -------------------------
  y is the downward extension of the spring below its unstretched length:
      m y" = m g - k y - b y',    y_eq = m g / k,   u = y - y_eq
      m u" + b u' + k u = 0                (PhET's doc/model.md: ms² + bs + k = 0)
  Spring constant 3-12 N/m (integers), default 6; natural length 0.5 m;
  ceiling 1.47 m, floor 0, shelf 0.02 m, hook 0.037 m tall with its centre
  0.0185 m down.  Masses: a rack of 250, 250, 100, 100, 50, 50 g plus three
  unlabelled mystery masses of 200, 100 and 75 g; the lab's own mass slider
  runs 50-300 g (default 100) beside mystery masses of 180 and 120 g.
  Gravity: Moon 1.6, Earth 9.8, Planet X 14.2, Jupiter 24.8 m/s², or a slider
  0-30.  Planet X is PhET's invented value — 14.2 m/s² matches no body in the
  solar system (Neptune 11.15 and Saturn 10.44 are the nearest); the sim hides
  it behind "What is the value of gravity?", and you recover it from the
  stretch as g = k y/m.  Damping is PhET's dampingCoefficient b in N s/m,
  range 0-0.7: Basics itself has no damping slider and fixes b at 0.7 on
  Stretch, 0 on Bounce and 0 on Lab, so the slider here is the parent sim's.
  Slow motion ×1/8 (PhET's SLOW_SIM_DT_RATIO).  The drawn mass blocks use
  PhET's own size rule, radius = 4√(m/(80·2.5·π)) m and height 2.5 radius.

  WHAT IS EXACT HERE
  ------------------
  The sim advances the state with the exact propagator of the linear equation
  above — u = e^(-γt)[u₀(C + γS) + v₀S], v = e^(-γt)[-ω₀²u₀S + v₀(C - γS)] with
  C = cos(√s t), S = sin(√s t)/√s and s = ω₀² - γ², continued to cosh/sinh
  below s = 0 and to their series at s = 0 — so the trajectory is the closed
  form to machine precision at any frame rate, in all three regimes, exactly
  as PhET does it.  An RK4 of the same equation runs beside it in selfTest and
  is measured to be fourth order (error ratios 16.03-16.44 per halving), and
  scipy's solve_ivp agrees with the propagator to 2.4e-12 over 80 (m, k, b)
  states.  Undamped, the propagator conserves energy to 5.8e-16 relative over
  2000 steps; damped, E(0) - E(t) equals b∫v²dt to the last bit (scipy quad).
  mg/k is asserted over all 10040 (mass, spring constant, planet) states the
  sim can reach, the period against 2π√(m/k) and against the zero crossings of
  the drawn motion, the damped period against 2π/√(ω₀² - γ²), and the
  logarithmic decrement against the ratio of successive peaks.  Every number
  is pinned in selfTest to build/masses-and-springs-basics/refvals.txt, the
  printed output of derive.py.

  WHICH REGIMES ARE REACHABLE
  ---------------------------
  Critical damping needs b = 2√(km), which over PhET's own box (k 3-12 N/m,
  m 50-300 g) never falls below 0.7745966692 N s/m — above the top of its
  damping range, 0.7.  So EVERY state PhET can reach is underdamped, with
  ζ ≤ 0.9036961141 at the softest spring and lightest mass.  The damping view
  therefore extends b past PhET's range to show the critical and overdamped
  cases, and says so on the canvas.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  --------------------------------------------------------
  PhET's gravities are used as PhET's (Earth 9.8, Moon 1.6, Jupiter 24.8), so
  the extensions match its own; the real surface values (9.81, 1.62, 24.79)
  are printed beside them in the readout.  PhET's Basics offers gravity only on
  its Lab screen and no damping control at all; here both are live on all three
  screens, the damping slider being the parent sim's 0-0.7 N s/m, and switching
  views restores PhET's own per-screen damping the way switching its screens
  does.  The rack is one chip row per spring rather than draggable blocks on a
  shelf, and a mass is released from its unstretched position rather than
  dropped by hand (you can still drag it, and letting go leaves it at rest as
  PhET does).  The bounce and lab views draw a height-against-time strip PhET
  does not have, and the stage sits in a column of its own beside it.  The
  gravitational share of the energy is measured from the BOTTOM of the swing,
  2mg/k down, so that none of the three shares is ever negative and their sum
  is 2(mg)^2/k rather than a line lying on the axis.  Frames advance by real
  elapsed time, capped at 50 ms.  PhET's spring coil is drawn as a helix whose
  pitch follows the length and whose thickness follows the spring constant, as
  PhET's does, but the coil count and line widths are this file's.  At large g
  on a soft spring the mass hangs below the floor; PhET allows that too, and the
  canvas says when it happens.

  WHAT IS NOT MODELLED
  --------------------
  One dimension: the mass moves only up and down, and the spring is massless
  and perfectly linear at every extension (no coil-bind, no yield).  Damping
  is linear in velocity and acts on the mass alone.  No collisions with the
  floor or the shelf, no air, no sound.  PhET's vector arrows for the four
  forces, its energy bar graph on the mass, its adjustable natural length and
  its two-spring "same length / same constant" mode are not here.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');

   load-bearing at the top of the branch and the truncation is still far below
   a rounding error.  Measured (build/masses-and-springs-basics/_out/diag.py):

}
function extremumBetween(m,k,b,u0,v0,tlo,thi){
  let a=tlo, c=thi, fa=prop(m,k,b,u0,v0,a)[1];
  if(fa*prop(m,k,b,u0,v0,c)[1]>0) return NaN;
  for(let i=0;i<200;i++){
    const mid=0.5*(a+c); if(mid<=a||mid>=c) break;
    const fm=prop(m,k,b,u0,v0,mid)[1];
    if(fm===0){ a=c=mid; break; }
    if(fa*fm<0){ c=mid; } else { a=mid; fa=fm; }
  }
  return 0.5*(a+c);
}
/* the period measured from the drawn motion: two crossings apart, released
   from rest at u0 so the first zero is a quarter period in */
function measurePeriod(m,k,b,u0){
  const Td=periodD(m,k,b); if(!isFinite(Td)) return NaN;
  const z1=zeroBetween(m,k,b,u0,0,1e-12,Td*0.6);
  const z3=zeroBetween(m,k,b,u0,0,Td*1.1,Td*1.6);
  return z3-z1;
}

/* ---- the spring coil ---------------------------------------------- */
const COILS=10, COIL_R=0.045, LEG=0.06;
/* the drawn helix, top at the ceiling, running down to the bottom.  PhET's
   thickness rule: thickness proportional to k and to the natural length. */
function coilPoints(xc,ytop,len,n){
  const pts=[], body=Math.max(0.02,len-2*LEG);
  pts.push([xc,ytop]); pts.push([xc,ytop-LEG]);
  for(let i=0;i<=n;i++){
    const f=i/n, ph=TAU*COILS*f;
    pts.push([xc+COIL_R*Math.sin(ph),ytop-LEG-body*f]);
  }
  pts.push([xc,ytop-LEG-body]); pts.push([xc,ytop-len]);
  return pts;
}
function coilWidth(k){ return 1.6+2.6*(k-KMIN)/(KMAX-KMIN); }

/* ================================================================== *
 *  state, the live springs, the per-view model, readout, eqbar, tag   *
 * ================================================================== */
const TABS=[['str','the stretch'],['bnc','the bounce'],['lab','the lab'],
            ['per','the period law'],['dmp','the damping'],['eng','the energy']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', text:'#aeb6c6', ke:'#b8ec4c', pel:'#5ac8e0', pgr:'#cd35c4',
           th:'#e8843a', tot:'#e4e8f0', coil:'#9aa4bb', mass1:'#b8ec4c', mass2:'#5ac8e0'};
const RO_W=300;
const SPEED_LIST=[{id:'normal',name:'normal'},{id:'slow',name:'slow motion'}];
const BODY_LIST=BODIES.map(b=>({id:b.id,name:b.name}));
const HMAX=1400;                 /* history points kept per spring */
const HWIN=6.0;                  /* the longest window the strips show */
const CROSS_V=1e-3;              /* m/s: below this the spring has stopped moving */

/* PhET's own defaults: spring constant 6 N/m on both springs, 100 g on the lab's
   adjustable mass, Earth, playing, normal speed, the lines and tools as PhET
   leaves them.  The damping is PhET's per-SCREEN value (the Stretch screen sets
   0.7, Bounce and Lab 0): switching views restores it, as switching PhET's
   screens does, and the slider then moves it inside the parent sim's 0-0.7. */
const DEFAULTS={view:'str', k1:KDEF, k2:KDEF, kl:KDEF,
                mass1:'m250', mass2:'m50', labMass:'adj', massG:MASS_G_DEF,
                body:'earth', gCustom:GDEF, damping:B_STRETCH,
                running:true, speed:'normal', reveal:false,
                natLine:true, restLine:true, movLine:false, movY:0.62,
                ruler:false, rulerX:0.40, rulerY:1.44, stopwatch:false, trace:true,
                zeta:0.25, bExt:1.0, kA:KDEF, mAg:MASS_G_DEF};
const ST=Object.assign({},DEFAULTS);
const VIEW_DAMPING={str:B_STRETCH, bnc:B_BOUNCE, lab:B_LAB};

/* ---- the live springs ---------------------------------------------
   slot 0 and 1 are the two-spring screens, slot 2 is the lab.  y is the
   spring's extension below its unstretched length (m), v its rate; the
   equilibrium mg/k is recomputed from the current settings every step, so
   moving gravity or the spring constant moves the hanging point under the
   mass exactly as PhET's re-linked equilibrium does. */
function newSlot(){ return {y:0,v:0,hist:[],ht:[],cross:[],tAttach:0,last:null}; }
const LIVE={t:0, sw:0, swOn:false, slot:[newSlot(),newSlot(),newSlot()]};
function slotReset(i,t){ const s=LIVE.slot[i]; s.y=0; s.v=0; s.hist=[]; s.ht=[]; s.cross=[]; s.tAttach=t===undefined?LIVE.t:t; s.last=null; }
function liveReset(){ LIVE.t=0; LIVE.sw=0; LIVE.swOn=false; for(let i=0;i<3;i++) slotReset(i,0); }

function gOf(st){ const b=bodyById(st.body); return b.g===null?st.gCustom:b.g; }
function labMassKg(st){ const r=rackById(LAB_RACK,st.labMass); return r.m===null?st.massG/1000:r.m; }
/* the springs the current view runs: index into LIVE.slot, world x, k, mass */
function springsOf(st){
  if(st.view==='lab'||st.view==='eng'){
    const r=rackById(LAB_RACK,st.labMass);
    return [{i:2,x:SPRING_X,k:st.kl,m:labMassKg(st),myst:!!r.myst,name:r.name,label:'spring'}];
  }
  const a=rackById(RACK,st.mass1), b=rackById(RACK,st.mass2);
  return [{i:0,x:LEFT_SPRING_X,k:st.k1,m:a.m,myst:!!a.myst,name:a.name,label:'spring 1'},
          {i:1,x:RIGHT_SPRING_X,k:st.k2,m:b.m,myst:!!b.myst,name:b.name,label:'spring 2'}];
}
function liveViews(v){ return v==='str'||v==='bnc'||v==='lab'||v==='eng'; }

/* one step of one spring, by the exact propagator, with the equilibrium
   crossings recorded through the same bisection selfTest measures with */
function stepSlot(sp,g,b,dt){
  const S=LIVE.slot[sp.i];
  if(!(sp.m>0)||!(dt>0)) return;
  const ye=yEq(sp.m,sp.k,g), u0=S.y-ye, v0=S.v;
  const r=prop(sp.m,sp.k,b,u0,v0,dt);
  const u1=r[0];
  /* a crossing counts only while the spring is still visibly moving: at 1 mm/s
     the swing is sub-pixel, and the sign changes of a dying exponential would
     otherwise go on filling the trace for ever (PhET has the same threshold) */
  if(u0!==0&&u1!==0&&(u0<0)!==(u1<0)&&Math.abs(v0)>CROSS_V){
    const tc=zeroBetween(sp.m,sp.k,b,u0,v0,0,dt);
    if(isFinite(tc)){ S.cross.push(LIVE.t+tc); if(S.cross.length>8) S.cross.shift(); }
  }
  S.y=u1+ye; S.v=r[1];
}
function pushHist(sp){
  const S=LIVE.slot[sp.i];
  S.hist.push(S.y); S.ht.push(LIVE.t);
  if(S.hist.length>HMAX){ S.hist.shift(); S.ht.shift(); }
}
function advance(st,dts){
  const g=gOf(st), b=st.damping, sps=springsOf(st);
  for(const sp of sps){ if(DRAG.what===null||DRAG.sp!==sp.i) stepSlot(sp,g,b,dts); }
  LIVE.t+=dts;
  if(LIVE.swOn) LIVE.sw+=dts;
  for(const sp of sps) pushHist(sp);
}
/* the period the trace has measured: two crossings apart */
function tracedPeriod(i){
  const c=LIVE.slot[i].cross;
  return c.length>=3?c[c.length-1]-c[c.length-3]:NaN;
}

/* ---- the per-view model ------------------------------------------- */
function springModel(st,sp,g,b){
  const S=LIVE.slot[sp.i], m=sp.m, k=sp.k;
  const o={i:sp.i,x:sp.x,k:k,m:m,myst:sp.myst,name:sp.name,label:sp.label,on:m>0};
  o.ye=m>0?yEq(m,k,g):0;
  o.y=S.y; o.v=S.v; o.u=S.y-o.ye;
  o.bottom=CEILING_Y-L0-S.y;                 /* the free end of the spring, world y */
  /* the flag is about the BLOCK: that is what a reader sees crossing the floor */
  o.floorBust=m>0?(o.bottom-HOOK_C-massHeight(m)<FLOOR_Y):(o.bottom<FLOOR_Y);
  if(m>0){
    o.w0=omega0(m,k); o.T0=period0(m,k); o.gam=gammaOf(m,b); o.zeta=zetaOf(m,k,b);
    o.bc=bCrit(m,k); o.wd=omegaD(m,k,b); o.Td=periodD(m,k,b); o.ld=logDec(m,k,b); o.Q=qFactor(m,k,b);
    o.ybot=swingBottom(m,k,g);
    o.KE=keOf(m,S.v); o.PEe=peElastic(k,S.y); o.PEg=peGrav(m,g,S.y,o.ybot);
    o.E=energyU(m,k,o.u,S.v); o.off=gravOffset(m,k,g);
    o.E0=energyU(m,k,-o.ye,0);               /* released from the unstretched end */
    o.Eth=Math.max(0,o.E0-o.E);
    o.Tmeas=tracedPeriod(sp.i);
    o.hist=S.hist; o.ht=S.ht; o.cross=S.cross;
    o.mInfer=g>0?mFromStretch(k,o.ye,g):NaN;
  }
  return o;
}
function buildModel(){
  const st=ST, g=gOf(st), body=bodyById(st.body), b=st.damping;
  const M={st,view:st.view,g,body,b,t:LIVE.t,sw:LIVE.sw,swOn:LIVE.swOn,
           gReal:body.real,springs:springsOf(st).map(sp=>springModel(st,sp,g,b))};
  M.mysteryG=(st.body==='planetX'&&!st.reveal);
  M.anyMyst=M.springs.some(s=>s.myst&&!st.reveal);
  /* the analysis views, built lazily: the sweeps are the expensive part and
     three of six views never look at them */
  let _per=null,_dmp=null,_eng=null;
  Object.defineProperty(M,'per',{get(){ return _per||(_per=perModel(st,b)); }});
  Object.defineProperty(M,'dmp',{get(){ return _dmp||(_dmp=dmpModel(st)); }});
  Object.defineProperty(M,'eng',{get(){ return _eng||(_eng=engModel(st,g,b)); }});
  return M;
}
/* the period law: T(m) at four spring constants, with the period measured from
   the drawn motion at a handful of masses */
function perModel(st,b){
  const ks=[3,6,9,12], ms=[], curves=[];
  for(let i=0;i<=60;i++) ms.push((MASS_G_MIN+(MASS_G_MAX-MASS_G_MIN)*i/60)/1000);
  for(const k of ks) curves.push({k,T:ms.map(m=>period0(m,k))});
  const mk=st.mAg/1000, k=st.kA;
  const pts=[];
  for(const gm of [60,110,170,230,290]){
    const m=gm/1000;
    pts.push({m,T:measurePeriod(m,k,0,0.05),T0:period0(m,k)});
  }
  const zs=[]; for(let i=0;i<=80;i++) zs.push(i/80*0.999);
  return {ks,ms,curves,pts,m:mk,k,T0:period0(mk,k),Td:periodD(mk,k,b),zeta:zetaOf(mk,k,b),
          zs,stretch:zs.map(z=>1/Math.sqrt(1-z*z)),
          planets:BODIES.filter(x=>x.g!==null).map(x=>({name:x.name,g:x.g,ye:yEq(mk,k,x.g),T:period0(mk,k)})),
          zMaxPhet:BMAX/bCrit(MASS_G_MIN/1000,KMIN)};
}
/* the three regimes, at the current k and m, with b run past PhET's range */
function dmpModel(st){
  const m=st.mAg/1000, k=st.kA, bc=bCrit(m,k), u0=0.05;
  const T0=period0(m,k), tmax=3.2*T0, n=260, ts=[];
  for(let i=0;i<=n;i++) ts.push(tmax*i/n);
  const zlist=[{z:st.zeta,lab:'ζ = '+fmt(st.zeta,2),col:COL.pos},
               {z:1,lab:'ζ = 1 critical',col:COL.ref},
               {z:1.8,lab:'ζ = 1.8 over',col:COL.struct}];
  const curves=zlist.map(o=>({z:o.z,lab:o.lab,col:o.col,b:o.z*bc,
                              u:ts.map(t=>prop(m,k,o.z*bc,u0,0,t)[0])}));
  const gamZ=st.zeta*bc/(2*m);
  const env=ts.map(t=>u0*Math.exp(-gamZ*t));
  /* successive peaks of the underdamped curve, for the logarithmic decrement */
  const Td=periodD(m,k,st.zeta*bc), peaks=[];
  if(isFinite(Td)) for(let n2=0;n2<6;n2++){
    const t=n2*Td; peaks.push({n:n2,t,u:prop(m,k,st.zeta*bc,u0,0,t)[0]});
  }
  return {m,k,bc,u0,ts,curves,env,Td,T0,peaks,ld:logDec(m,k,st.zeta*bc),
          bPhet:BMAX,bcMin:bCrit(MASS_G_MIN/1000,KMIN),bcMax:bCrit(MASS_G_MAX/1000,KMAX),
          zMax:BMAX/bCrit(MASS_G_MIN/1000,KMIN),reach:st.zeta*bc<=BMAX+1e-12};
}
/* the energy ledger of the lab spring over three periods from its release */
function engModel(st,g,b){
  const m=labMassKg(st), k=st.kl, ye=yEq(m,k,g), T0=period0(m,k);
  const n=240, tmax=3*T0, ts=[], KE=[], PEe=[], PEg=[], TH=[], TOT=[];
  const E0=energyU(m,k,-ye,0), off=gravOffset(m,k,g), ybot=swingBottom(m,k,g);
  for(let i=0;i<=n;i++){
    const t=tmax*i/n, r=prop(m,k,b,-ye,0,t), y=r[0]+ye;
    ts.push(t); KE.push(keOf(m,r[1])); PEe.push(peElastic(k,y)); PEg.push(peGrav(m,g,y,ybot));
    const th=E0-energyU(m,k,r[0],r[1]); TH.push(th);
    TOT.push(keOf(m,r[1])+peElastic(k,y)+peGrav(m,g,y,ybot)+th);
  }
  return {m,k,g,b,ye,ybot,T0,ts,KE,PEe,PEg,TH,TOT,E0,off,base:E0+off,
          Etot:E0+off,drift:Math.max.apply(null,TOT.map(x=>Math.abs(x-(E0+off))))};
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function cmv(x,n){ return sigf(100*x,n||4)+' cm'; }
function gName(st){ const b=bodyById(st.body); return b.id==='custom'?'custom':b.name; }
function gShown(M){ return M.mysteryG?'?':fmt(M.g,1)+' m/s<sup>2</sup>'; }
function massShown(M,s){ return !s.on?'&mdash;':(s.myst&&!M.st.reveal?'?':fmt(1000*s.m,0)+' g'); }

function springRows(M,s){
  const st=M.st;
  let out=hd(s.label+' &mdash; k = '+fmt(s.k,0)+' N/m');
  out+=rrow('mass',massShown(M,s));
  if(!s.on) return out+rrow('nothing hangs on it','spring at its natural length');
  out+=rrow('resting extension m g / k',cmv(s.ye),'good');
  out+=rrow('extension now',cmv(s.y)+(s.floorBust?' (past the floor)':''),s.floorBust?'bad':'');
  out+=rrow('speed',sigf(Math.abs(s.v),3)+' m/s');
  out+=rrow('period 2&pi;&radic;(m/k)',sigf(s.T0,4)+' s','good');
  if(M.b>0) out+=rrow('damped period, &zeta; = '+fmt(s.zeta,3),isFinite(s.Td)?sigf(s.Td,4)+' s':'no oscillation');
  if(isFinite(s.Tmeas)) out+=rrow('period measured from the trace',sigf(s.Tmeas,4)+' s',Math.abs(s.Tmeas-(M.b>0?s.Td:s.T0))<1e-6?'good':'');
  if(s.myst&&!st.reveal) out+=rrow('unlabelled mass','solve m = k y / g');
  if(st.body==='planetX'&&!st.reveal) out+=rrow('unknown gravity','solve g = k y / m');
  return out;
}
function readoutHTML(M){
  const st=M.st;
  let s='<div class="rname">masses and springs<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  if(liveViews(M.view)&&M.view!=='eng'){
    s+=hd('gravity &mdash; '+gName(st))+rrow('g',gShown(M),'good');
    if(M.gReal!==null&&!M.mysteryG) s+=rrow('the real surface value',fmt(M.gReal,2)+' m/s<sup>2</sup> ('+(M.g>M.gReal?'&minus;':'+')+fmt(Math.abs(M.gReal-M.g),2)+')');
    if(st.body==='planetX'&&st.reveal) s+=rrow('Planet X','PhET&rsquo;s invented 14.2 m/s<sup>2</sup>');
    for(const sp of M.springs) s+=springRows(M,sp);
    s+=hd('the clock')+rrow('t',fmt(M.t,2)+' s'+(st.running?'':' (paused)'))
      +(st.speed==='slow'?rrow('slow motion','&times;1/8 (PhET)'):'');
    if(st.stopwatch) s+=rrow('stopwatch',fmt(M.sw,2)+' s'+(M.swOn?' (running)':''));
    if(st.movLine) s+=rrow('movable line',fmt(100*st.movY,1)+' cm above the floor');
  }
  else if(M.view==='per'){
    const P=M.per;
    s+=hd('the spring')+rrow('k',fmt(P.k,0)+' N/m')+rrow('m',fmt(1000*P.m,0)+' g')
      +rrow('T = 2&pi;&radic;(m/k)',sigf(P.T0,5)+' s','good')
      +rrow('damped T<sub>d</sub>, &zeta; = '+fmt(P.zeta,3),isFinite(P.Td)?sigf(P.Td,5)+' s':'no oscillation')
      +rrow('T<sub>d</sub>/T',isFinite(P.Td)?sigf(P.Td/P.T0,5):'&mdash;');
    s+=hd('measured from the motion');
    for(const p of P.pts) s+=rrow(fmt(1000*p.m,0)+' g: zeros two apart',sigf(p.T,6)+' s',Math.abs(p.T-p.T0)<1e-9?'good':'bad');
    s+=hd('gravity moves the hanging point, not the period');
    for(const pl of P.planets) s+=rrow(pl.name+', g = '+fmt(pl.g,1),cmv(pl.ye,4)+', T = '+sigf(pl.T,4)+' s');
  }
  else if(M.view==='dmp'){
    const D=M.dmp;
    s+=hd('the spring')+rrow('k, m',fmt(D.k,0)+' N/m, '+fmt(1000*D.m,0)+' g')
      +rrow('undamped period',sigf(D.T0,5)+' s')
      +rrow('critical damping 2&radic;(km)',sigf(D.bc,5)+' N s/m','good');
    s+=hd('the damping drawn')+rrow('&zeta;',fmt(st.zeta,3))
      +rrow('b = &zeta; &times; 2&radic;(km)',sigf(st.zeta*D.bc,4)+' N s/m',D.reach?'good':'bad')
      +rrow('within PhET&rsquo;s 0&ndash;0.7?',D.reach?'yes':'no &mdash; beyond its slider','')
      +rrow('damped period',isFinite(D.Td)?sigf(D.Td,5)+' s':'none')
      +rrow('log decrement &gamma;T<sub>d</sub>',isFinite(D.ld)?sigf(D.ld,5):'&mdash;')
      +rrow('amplitude kept per period',isFinite(D.ld)?sigf(Math.exp(-D.ld),4):'&mdash;');
    s+=hd('what the sim can reach')
      +rrow('2&radic;(km) over its box',sigf(D.bcMin,6)+' &ndash; '+sigf(D.bcMax,5)+' N s/m')
      +rrow('its damping tops out at',fmt(BMAX,1)+' N s/m')
      +rrow('so &zeta; never exceeds',sigf(D.zMax,6),'good')
      +rrow('every reachable state is','underdamped');
  }
  else{
    const E=M.eng, sp=M.springs[0];
    s+=hd('the run drawn')+rrow('m, k, g',fmt(1000*E.m,0)+' g, '+fmt(E.k,0)+' N/m, '+fmt(E.g,1)+' m/s<sup>2</sup>')
      +rrow('released from the unstretched end','y = 0, v = 0')
      +rrow('resting extension m g / k',cmv(E.ye),'good')
      +rrow('so it swings between','0 and '+cmv(2*E.ye))
      +rrow('starting energy &frac12;k(mg/k)<sup>2</sup>',sigf(E.E0,5)+' J','good')
      +rrow('the gravitational zero','the bottom of the swing, '+cmv(E.ybot)+' down');
    s+=hd('the ledger')+rrow('damping b',fmt(E.b,2)+' N s/m')
      +rrow('KE + PE<sub>elastic</sub> + PE<sub>gravity</sub> + E<sub>thermal</sub>',sigf(E.Etot,6)+' J','good')
      +rrow('&hellip; drift over three periods',sigf(E.drift,2)+' J',E.drift<1e-12?'good':'bad')
      +rrow('the constant 3(mg)<sup>2</sup>/2k',sigf(E.off,5)+' J');
    if(sp&&sp.on) s+=hd('the live spring')+rrow('KE',sigf(sp.KE,4)+' J')+rrow('PE elastic',sigf(sp.PEe,4)+' J')
      +rrow('PE gravity',sigf(sp.PEg,4)+' J')+rrow('thermal so far',sigf(sp.Eth,4)+' J');
  }
  s+='</table><div class="note">PhET&rsquo;s values (spring 3&ndash;12 N/m, masses 50&ndash;300 g, Moon 1.6, Earth 9.8, Planet X 14.2, '
    +'Jupiter 24.8 m/s<sup>2</sup>, damping 0&ndash;0.7 N s/m) are read from its build 1.0.28; the real surface gravities are 1.62, 9.81 and '
    +'24.79. Everything else is exact and pinned in selfTest to derive.py.</div>';
  return s;
}
function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='str') return E('<span class="hl">F = &minus;k y</span> &nbsp;&rArr;&nbsp; <span class="hl">y<sub>eq</sub> = m g / k</span>',
    'the spring pulls back in proportion to its stretch, so it stops where the pull equals the weight: twice the mass is twice the stretch, twice the stiffness is half');
  if(M.view==='bnc') return E('<span class="hl">m &#375; + b &#7823; + k y = m g</span> &nbsp;&middot;&nbsp; y = y<sub>eq</sub> + u, &nbsp; <span class="hl">m &uuml; + b &#361; + k u = 0</span>',
    'gravity only moves the resting point; about it the motion is the plain harmonic oscillator, so letting go from the unstretched end swings exactly 2mg/k');
  if(M.view==='lab') return E('<span class="hl">T = 2&pi;&radic;(m/k)</span> &nbsp;&middot;&nbsp; y<sub>eq</sub> = m g / k',
    'the period holds the mass and the spring and nothing else: the same spring beats the same time on the Moon, on Jupiter and on Planet X');
  if(M.view==='per') return E('<span class="hl">T<sub>d</sub> = 2&pi;/&radic;(k/m &minus; (b/2m)<sup>2</sup>) = T/&radic;(1 &minus; &zeta;<sup>2</sup>)</span>',
    'damping lengthens the period, and only at second order: at PhET&rsquo;s stiffest and heaviest it is 1.7 % longer, at its softest and lightest 2.34 times');
  if(M.view==='dmp') return E('<span class="hl">&zeta; = b/(2&radic;(km))</span> &nbsp;&middot;&nbsp; <span class="rm">&zeta; &lt; 1 oscillates, &zeta; = 1 critical, &zeta; &gt; 1 crawls back</span>',
    'the whole behaviour of a damped spring is one number; PhET&rsquo;s own ranges keep it below 0.904, so nothing it can draw is critically damped');
  return E('<span class="hl">E = &frac12;mv<sup>2</sup> + &frac12;ku<sup>2</sup></span> &nbsp;&middot;&nbsp; <span class="hl">dE/dt = &minus;b v<sup>2</sup></span> &nbsp;&middot;&nbsp; KE + PE<sub>el</sub> + PE<sub>gr</sub> = E &minus; (mg)<sup>2</sup>/2k',
    'the damper is the only leak, and it takes energy at bv&sup2;: with none, the three stores add to a constant for ever');
}
function tagHTML(M){
  const st=M.st;
  const mm=M.springs.map(s=>s.on?(s.myst&&!st.reveal?'?':fmt(1000*s.m,0)+' g'):'empty').join(' / ');
  if(M.view==='str') return '<b>the stretch</b> &mdash; '+mm+' on k = '+fmt(st.k1,0)+' / '+fmt(st.k2,0)+' N/m, '+gName(st)+', damping '+fmt(M.b,2);
  if(M.view==='bnc') return '<b>the bounce</b> &mdash; '+mm+', damping '+fmt(M.b,2)+' N s/m'+(st.running?'':', paused')+(st.speed==='slow'?', slow motion':'');
  if(M.view==='lab') return '<b>the lab</b> &mdash; '+mm+' on k = '+fmt(st.kl,0)+' N/m, '+gName(st)+(M.mysteryG?' (g hidden)':'');
  if(M.view==='per') return '<b>the period law</b> &mdash; T = 2&pi;&radic;(m/k), measured against the closed form';
  if(M.view==='dmp') return '<b>the damping</b> &mdash; &zeta; = '+fmt(st.zeta,2)+(M.dmp.reach?' (inside PhET&rsquo;s range)':' (beyond PhET&rsquo;s range)');
  return '<b>the energy</b> &mdash; three periods from the unstretched end, damping '+fmt(M.b,2);
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the stage: the ceiling, the springs, the masses, the lines, the    *
 *  ruler — and PhET's three screens drawn on it                       *
 * ================================================================== */
/* the house #hint sits at bottom:11px, on top of the last line of a caption
   anchored at H - 12: every caption here ends HINT_H higher, clear of it */
const HINT_H=18;
const RULER_L=0.80, RULER_W=0.12;       /* the drawn ruler, metres */

/* An axis whose tick COUNT follows the panel size and whose decimals follow the
   tick SPACING.  Both are Known-bad traps: six ticks in a 60 px box collide,
   and fmt(t,2) prints "0.00" five times over a 0.01 range. */
function decOf(ts){
  if(ts.length<2) return 2;
  const st=Math.abs(ts[1]-ts[0]);
  return clamp(Math.ceil(-Math.log10(st))+1,0,6);
}
function ax2(b,xlo,xhi,ylo,yhi,opt){
  const yt=sparseTicks(Math.min(ylo,yhi),Math.max(ylo,yhi),b.h);
  const xt=sparseTicks(Math.min(xlo,xhi),Math.max(xlo,xhi),b.w/2.4);
  const yd=decOf(yt), xd=decOf(xt);
  return Object.assign({yticks:yt,xticks:xt,yfmt:t=>fmt(t,yd),xfmt:t=>fmt(t,xd)},opt||{});
}
/* reserve a rectangle in the label registry so later lab() calls dodge it */
function regBox(x0,y0,x1,y1){ LABELS.push([x0,y0,x1,y1]); }


function xExtent(M){
  const xs=M.springs.map(s=>s.x);
  let lo=Math.min.apply(null,xs)-0.30, hi=Math.max.apply(null,xs)+0.30;
  if(M.st.ruler){ lo=Math.min(lo,M.st.rulerX-0.03); hi=Math.max(hi,M.st.rulerX+RULER_W+0.03); }
  return [lo,hi];
}
function lowestPoint(M){
  let lo=-0.06;
  for(const s of M.springs){ if(!s.on) continue;
    lo=Math.min(lo,s.bottom-HOOK_C-massHeight(s.m)-0.03); }
  if(M.st.ruler) lo=Math.min(lo,M.st.rulerY-RULER_L-0.02);
  if(M.st.movLine) lo=Math.min(lo,M.st.movY-0.02);
  return lo;
}
/* the stage is intrinsically tall and thin (PhET's own geometry: 1.47 m of
   ceiling over 0.3 m between the springs), so on a wide canvas it gets a
   narrow column of its own and the analysis panel sits BESIDE it rather than
   under it — stacked, the stage used a quarter of the width and the picture
   was mostly background. */
function splitLayout(ctx,W,H,v){
  const a=viewCaps(v);
  if(isNarrow(W)) return stageLayout(ctx,W,H-HINT_H,a[0],a[1],1,0.42,1);
  const left=56, right=W-RO_W-44, top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,a[0],a[1],capW,top+220);
  const bot=fit.capY-16;
  const stageW=clamp(Math.round(0.34*(right-left)),240,430);
  const px=left+stageW+72;
  return {narrow:false,left,right,capY:fit.capY,capTxt:fit.txt,capW,
          main:box(left,top,stageW,Math.max(120,bot-top)),
          bottom:[box(px,top+16,Math.max(170,right-px),Math.max(110,bot-top-54))]};
}
function stageMap(M,b){
  const xe=xExtent(M), ylo=lowestPoint(M);
  return worldFitUp(b,{xmin:xe[0],xmax:xe[1],ymin:ylo,ymax:CEILING_Y+0.09},0.01);
}
/* the hatched ceiling PhET hangs its springs from */
function drawCeiling(ctx,map,x0,x1){
  const Y=map.Y(CEILING_Y);
  ctx.strokeStyle=COL.struct; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(map.X(x0),Y); ctx.lineTo(map.X(x1),Y); ctx.stroke();
  POLY_SEGS.push(map.X(x0),Y,map.X(x1),Y);
  ctx.strokeStyle=rgba(COL.struct,0.4); ctx.lineWidth=1;
  for(let X=map.X(x0);X<map.X(x1);X+=9){
    ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+7,Y-7); ctx.stroke();
  }
}
function drawFloor(ctx,map,x0,x1){
  const Y=map.Y(FLOOR_Y);
  ctx.strokeStyle=rgba(COL.dim,0.55); ctx.lineWidth=1.4; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(map.X(x0),Y); ctx.lineTo(map.X(x1),Y); ctx.stroke();
}
/* the coil: a helix whose pitch follows the length and whose line weight
   follows the spring constant, as PhET's OscillatingSpringNode does */
/* COILS*20 points: 20 samples a turn puts one exactly on each quarter, so the
   drawn coil's widest point IS COIL_R and the display list can be measured
   against it (at 18 a turn the peak is never sampled and the extent is 0.985 of
   the radius, which is a fact about the sampling, not about the spring) */
function drawSpring(ctx,map,x,len,k,col){
  const pts=coilPoints(x,CEILING_Y,len,COILS*20);
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){ const X=map.X(pts[i][0]), Y=map.Y(pts[i][1]);
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }
  ctx.strokeStyle=col; ctx.lineWidth=coilWidth(k); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke(); ctx.lineWidth=1;
  for(let i=1;i<pts.length;i++) POLY_SEGS.push(map.X(pts[i-1][0]),map.Y(pts[i-1][1]),map.X(pts[i][0]),map.Y(pts[i][1]));
}
/* PhET's mass block: a cylinder of its own size rule, hung from a hook */
function drawMass(ctx,map,x,topY,m,col,label,dragging){
  const r=massRadius(m), hh=massHeight(m);
  const X0=map.X(x-r), X1=map.X(x+r), Yt=map.Y(topY), Yb=map.Y(topY-hh);
  ctx.beginPath(); ctx.moveTo(map.X(x),map.Y(topY+HOOK_H)); ctx.lineTo(map.X(x),Yt);
  ctx.strokeStyle=COL.coil; ctx.lineWidth=1.6; ctx.stroke();
  ctx.fillStyle=shade(col,dragging?0.95:0.62); ctx.fillRect(X0,Yt,X1-X0,Yb-Yt);
  ctx.strokeStyle=dragging?'#fff':shade(col,1); ctx.lineWidth=dragging?2:1.3;
  ctx.strokeRect(X0,Yt,X1-X0,Yb-Yt);
  POLY_SEGS.push(X0,Yt,X1,Yt,X1,Yt,X1,Yb,X1,Yb,X0,Yb,X0,Yb,X0,Yt);
  if(label&&Yb-Yt>13&&X1-X0>plain(label).length*6.2){
    ctx.fillStyle='#0a0c12'; ctx.font='bold 11px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(plain(label),(X0+X1)/2,(Yt+Yb)/2);
    const lw=plain(label).length*11*0.52;
    regBox((X0+X1)/2-lw/2,(Yt+Yb)/2-6.3,(X0+X1)/2+lw/2,(Yt+Yb)/2+6.3); }
}
function massTopY(s){ return s.bottom-HOOK_C; }
function massRectPx(map,s){
  const r=massRadius(s.m), top=massTopY(s);
  return {x:map.X(s.x-r),y:map.Y(top),x1:map.X(s.x+r),y1:map.Y(top-massHeight(s.m))};
}
/* a dashed rule across the stage with a right-hand label */
function ruleLine(ctx,map,W,H,x0,x1,y,col,txt){
  const Y=map.Y(y);
  ctx.strokeStyle=col; ctx.lineWidth=1.3; ctx.setLineDash([7,5]);
  ctx.beginPath(); ctx.moveTo(map.X(x0),Y); ctx.lineTo(map.X(x1),Y); ctx.stroke(); ctx.setLineDash([]);
  if(txt) lab(ctx,W,H,map.X(x0),Y-4,txt,col,SM_FONT,'left','bottom');
}
function drawRuler(ctx,map,W,H,st){
  const x=st.rulerX, yTop=st.rulerY;
  const X0=map.X(x), X1=map.X(x+RULER_W), Yt=map.Y(yTop), Yb=map.Y(yTop-RULER_L);
  ctx.fillStyle='rgba(16,19,27,.92)'; ctx.fillRect(X0,Yt,X1-X0,Yb-Yt);
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.2; ctx.strokeRect(X0,Yt,X1-X0,Yb-Yt);
  ctx.font='9px -apple-system, sans-serif'; ctx.textBaseline='middle';
  const numbered=(map.s*0.10>=18);          /* 10 cm must be 18 px before it is numbered */
  for(let c=0;c<=80;c++){
    const Y=map.Y(yTop-c/100);
    const major=(c%10===0), mid=(c%5===0);
    ctx.strokeStyle=rgba(COL.struct,major?0.9:0.45); ctx.lineWidth=major?1.2:0.8;
    ctx.beginPath(); ctx.moveTo(X0,Y); ctx.lineTo(X0+(major?(X1-X0)*0.55:(mid?(X1-X0)*0.35:(X1-X0)*0.2)),Y); ctx.stroke();
    /* the numbers sit OUTSIDE the ruler body: inside a 29 px scale they land
       on their own tick marks */
    if(major&&c>0&&numbered){ ctx.fillStyle=COL.struct; ctx.textAlign='left'; ctx.fillText(String(c),X1+3,Y);
      regBox(X1+3,Y-5.2,X1+3+String(c).length*4.7,Y+5.2); }
  }
  if(numbered){ ctx.fillStyle=COL.dim; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.font='9.5px -apple-system, sans-serif'; ctx.fillText('cm',X0,Yt-3);
    regBox(X0,Yt-14,X0+12,Yt-3); }
}
/* the whole stage, shared by the stretch, bounce and lab views */
function drawStageBox(ctx,W,H,M,b){
  const st=M.st, map=stageMap(M,b), xe=xExtent(M);
  /* the full-width rules start clear of the ruler, so their labels do not land
     on its scale */
  const rx=st.ruler?Math.max(xe[0]+0.05,st.rulerX+RULER_W+0.10):xe[0]+0.05;
  drawCeiling(ctx,map,xe[0]+0.02,xe[1]-0.02);
  drawFloor(ctx,map,xe[0]+0.02,xe[1]-0.02);
  lab(ctx,W,H,map.X(xe[0]+0.03),map.Y(FLOOR_Y)+11,'floor',COL.dim,SM_FONT,'left','top');
  for(const s of M.springs) drawSpring(ctx,map,s.x,CEILING_Y-(s.on?s.bottom:CEILING_Y-L0),s.k,COL.coil);
  for(let i=0;i<M.springs.length;i++){
    const s=M.springs[i], col=i===0?COL.mass1:COL.mass2;
    if(!s.on) continue;
    drawMass(ctx,map,s.x,massTopY(s),s.m,col,(s.myst&&!st.reveal)?'?':fmt(1000*s.m,0)+' g',
             DRAG.what==='mass'&&DRAG.sp===s.i);
  }
  if(st.ruler) drawRuler(ctx,map,W,H,st);
  /* the spring labels go ABOVE the ceiling: under it they lay on the coils */
  for(let i=0;i<M.springs.length;i++){
    const s=M.springs[i];
    lab(ctx,W,H,map.X(s.x),map.Y(CEILING_Y)-7,'k = '+fmt(s.k,0)+' N/m',COL.dim,LAB_FONT,'center','bottom');
  }
  if(st.natLine) ruleLine(ctx,map,W,H,rx,xe[1]-0.12,CEILING_Y-L0,COL.struct,'unstretched length');
  /* the resting-position lines are drawn per spring, short, so two springs of
     different stiffness do not paint one line over the other */
  /* the movable line is labelled BEFORE the resting lines so its label wins the
     space: its height is the thing the reader has set by hand, and the resting
     value is in the readout as well */
  if(st.movLine) ruleLine(ctx,map,W,H,rx,xe[1]-0.12,st.movY,COL.live,'movable line '+fmt(100*st.movY,1)+' cm');
  if(st.restLine) for(let i=0;i<M.springs.length;i++){
    const s=M.springs[i]; if(!s.on) continue;
    const y=CEILING_Y-L0-s.ye;
    ruleLine(ctx,map,W,H,s.x-0.15,s.x+0.15,y,COL.ref,null);
    /* the label hangs off the LEFT end of its line: on the line it lands on a
       block, and off the right it runs into the analysis panel beside the stage */
    lab(ctx,W,H,map.X(s.x-0.16)-4,map.Y(y),'resting '+sigf(100*s.ye,3)+' cm',
        COL.ref,SM_FONT,'right','middle');
  }
  const anyBust=M.springs.some(s=>s.on&&s.floorBust);   /* the block, not the spring end */
  if(anyBust) lab(ctx,W,H,map.X(xe[0]+0.03),map.Y(FLOOR_Y)+26,'below the floor — PhET too',COL.ref,SM_FONT,'left','top');
  lab(ctx,W,H,b.x+3,b.y+2,'true shape, '+sigf(map.s/100,3)+' px per cm',COL.dim,SM_FONT,'left','top');
  return map;
}
/* the height-against-time strip the bounce and lab views draw underneath */
function drawStrip(ctx,W,H,M,b,withTrace){
  /* the window is about four periods of the slowest spring, and it GROWS from
     the release rather than opening on six empty seconds */
  let Tm=1;
  for(const s of M.springs) if(s.on) Tm=Math.max(Tm,isFinite(s.Td)?s.Td:s.T0);
  const span=clamp(4*Tm,1.5,HWIN);
  const t1=Math.max(M.t,Math.min(span,1.4*Tm)), t0=Math.max(0,t1-span);
  let ymax=0.02;
  for(const s of M.springs) if(s.on) ymax=Math.max(ymax,2.05*s.ye,1.05*Math.abs(s.y));
  axesR(ctx,b,t0,t1,ymax,0,ax2(b,t0,t1,0,ymax,{xlab:'time, s',ylab:'extension, cm',
    yfmt:t=>fmt(100*t,0),title:titleFor(b,'the spring below its unstretched end','extension')}));
  for(let i=0;i<M.springs.length;i++){
    const s=M.springs[i], col=i===0?COL.mass1:COL.mass2;
    if(!s.on) continue;
    polyline(ctx,b,[t0,t1],[s.ye,s.ye],t0,t1,ymax,0,COL.ref,1.1,[6,4]);
    if(s.hist&&s.hist.length>1) polyline(ctx,b,s.ht,s.hist,t0,t1,ymax,0,col,1.7);
    marker(ctx,b,t0,t1,ymax,0,Math.min(M.t,t1),s.y,col);
  }
  polyline(ctx,b,[t0,t1],[0,0],t0,t1,ymax,0,rgba(COL.struct,0.5),1.1,[3,4]);
  { const items=[];
    for(let i=0;i<M.springs.length;i++){ const s=M.springs[i];
      if(s.on) items.push([i===0?COL.mass1:COL.mass2,s.label+', '+fmt(1000*s.m,0)+' g on '+fmt(s.k,0)+' N/m']); }
    items.push([COL.ref,'resting point, mg/k']);
    if(withTrace) items.push([COL.live,'the period trace']);
    legendAuto(ctx,b,items); }
  /* PhET's period trace: the crossings two apart are one whole period */
  if(withTrace&&M.springs[0].on){
    const c=M.springs[0].cross.filter(x=>x>=t0);
    for(const tc of c){
      const X=b.x+b.w*(tc-t0)/(t1-t0);
      ctx.strokeStyle=rgba(COL.live,0.85); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(X,b.y1-10); ctx.lineTo(X,b.y1); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y+10); ctx.stroke();
    }
    const T=M.springs[0].Tmeas;
    if(isFinite(T)&&c.length>=3){
      const a=c[c.length-3], z=c[c.length-1];
      const Xa=b.x+b.w*(a-t0)/(t1-t0), Xz=b.x+b.w*(z-t0)/(t1-t0), Y=b.y+26;
      ctx.strokeStyle=COL.live; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(Xa,Y); ctx.lineTo(Xz,Y); ctx.stroke();
      lab(ctx,W,H,(Xa+Xz)/2,Y-9,'period trace: T = '+sigf(T,4)+' s',COL.live,SM_FONT,'center','bottom');
    }
  }
}

const STR_CAP_FULL='PhET&rsquo;s Stretch screen. Hang a mass on either spring and it settles where the spring&rsquo;s pull equals the weight, '

      title:titleFor(bb,'Hooke&rsquo;s law: the extension is a straight line through the origin','Hooke&rsquo;s law')}));

/* ---- view 6: the energy ------------------------------------------- */
const ENG_CAP_FULL='The lab spring let go from its unstretched end, followed for three periods. Kinetic energy, the energy stored in the spring '
  +'and the height gravity has yet to take &mdash; measured from the bottom of the swing, so none of the three is ever negative &mdash; trade back '
  +'and forth; the damper takes the rest, at b v&sup2; a second. The white line is their sum, flat to the last digit because the propagator is the '
  +'closed form, and equal to 2(mg)&sup2;/k. At the resting point the spring has stored exactly half of what gravity has given up.';
const ENG_CAP_SHORT='Three periods of the lab spring: the four shares, and their sum flat to the last digit at 2(mg)&sup2;/k.';
function drawEnergy(ctx,W,H,M){
  const E=M.eng;
  const L=layoutFor(ctx,W,H,'eng');
  const b=L.main, tmax=E.ts[E.ts.length-1];
  const mJ=a=>a.map(v=>1000*v);
  let lo=0, hi=0;
  for(const a of [E.KE,E.PEe,E.PEg,E.TH,E.TOT]) for(const v of a){ if(1000*v<lo) lo=1000*v; if(1000*v>hi) hi=1000*v; }
  /* a wide band above the curves, so the legend has a corner to sit in
     (Known-bad: legendAuto draws nothing rather than lying, and then the key
     for five curves is simply missing) */
  const pad=0.09*(hi-lo), padT=0.55*(hi-lo);
  lo=lo-pad; hi=hi+padT;
  const pad0=0;
  axesR(ctx,b,0,tmax,lo-pad0,hi+pad0,ax2(b,0,tmax,lo-pad0,hi+pad0,{xlab:'time, s',ylab:'energy, mJ',
    title:titleFor(b,'the four shares and their sum, three periods from the unstretched end','the four shares and their sum')}));
  polyline(ctx,b,[0,tmax],[0,0],0,tmax,lo-pad0,hi+pad0,rgba(COL.dim,0.45),1,[3,4]);
  polyline(ctx,b,E.ts,mJ(E.PEe),0,tmax,lo-pad0,hi+pad0,COL.pel,1.7);
  polyline(ctx,b,E.ts,mJ(E.PEg),0,tmax,lo-pad0,hi+pad0,COL.pgr,1.7);
  polyline(ctx,b,E.ts,mJ(E.KE),0,tmax,lo-pad0,hi+pad0,COL.ke,1.7);
  polyline(ctx,b,E.ts,mJ(E.TH),0,tmax,lo-pad0,hi+pad0,COL.th,1.7);
  polyline(ctx,b,E.ts,mJ(E.TOT),0,tmax,lo-pad0,hi+pad0,COL.tot,2.1,[9,4]);
  legendAuto(ctx,b,[[COL.ke,'kinetic'],[COL.pel,'elastic'],[COL.pgr,'gravitational'],
                    [COL.th,'thermal (the damper)'],[COL.tot,'their sum, '+sigf(E.Etot,5)+' J']]);
  const b0=L.bottom[0], sp=M.springs[0];
  if(b0){
    const bars=[{n:'kinetic',v:sp.on?1000*sp.KE:0,c:COL.ke},{n:'elastic',v:sp.on?1000*sp.PEe:0,c:COL.pel},
                {n:'gravity',v:sp.on?1000*sp.PEg:0,c:COL.pgr},{n:'thermal',v:sp.on?1000*sp.Eth:0,c:COL.th},
                {n:'sum',v:sp.on?1000*(sp.KE+sp.PEe+sp.PEg+sp.Eth):0,c:COL.tot}];
    let blo=0,bhi=0; for(const x of bars){ if(x.v<blo) blo=x.v; if(x.v>bhi) bhi=x.v; }
    const span=Math.max(1e-6,bhi-blo)*1.25, base=blo-0.1*span;
    axesR(ctx,b0,0,bars.length,base,base+span,ax2(b0,0,bars.length,base,base+span,{xticks:[],ylab:'energy, mJ',
      title:titleFor(b0,'the shares at this instant','now')}));
    const wpx=b0.w/bars.length, Y0=b0.y1-b0.h*(0-base)/span;
    for(let i=0;i<bars.length;i++){
      const X=b0.x+wpx*(i+0.5), Y=b0.y1-b0.h*(bars[i].v-base)/span;
      ctx.fillStyle=rgba(bars[i].c,0.42); ctx.fillRect(X-wpx*0.24,Math.min(Y,Y0),wpx*0.48,Math.abs(Y-Y0));
      ctx.strokeStyle=bars[i].c; ctx.lineWidth=1.2; ctx.strokeRect(X-wpx*0.24,Math.min(Y,Y0),wpx*0.48,Math.abs(Y-Y0));
      lab(ctx,W,H,X,b0.y1+7,bars[i].n,COL.dim,SM_FONT,'center','top');
    }
    ctx.strokeStyle=rgba(COL.dim,0.5); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(b0.x,Y0); ctx.lineTo(b0.x1,Y0); ctx.stroke();
  }
  const b1=L.bottom[1];
  if(b1){
    const m=E.m, k=E.k, bb=E.b, u0=-E.ye, Td=periodD(m,k,bb), ld=logDec(m,k,bb);
    const nmax=6, ns=[], Es=[], an=[], ae=[];
    const E0=energyU(m,k,u0,0);
    for(let n=0;n<=nmax;n++){ const t=n*Td/2, r=prop(m,k,bb,u0,0,t);
      ns.push(n/2); Es.push(1000*energyU(m,k,r[0],r[1])); }
    for(let i=0;i<=60;i++){ const n=nmax*i/60; an.push(n/2); ae.push(1000*E0*Math.exp(-ld*n)); }
    const Emax=1000*E0*1.08;
    axesR(ctx,b1,0,nmax/2,0,Emax,ax2(b1,0,nmax/2,0,Emax,{xlab:'whole periods elapsed',ylab:'E at the turn, mJ',
      title:titleFor(b1,'the energy at each turning point, exactly E0 e^(-n delta)','energy per turn')}));
    polyline(ctx,b1,an,ae,0,nmax/2,0,Emax,COL.ref,1.6);
    for(let i=0;i<ns.length;i++) marker(ctx,b1,0,nmax/2,0,Emax,ns[i],Es[i],COL.pos);
    lab(ctx,W,H,b1.x1-6,b1.y+12,bb>0?'delta = '+sigf(ld,4)+', kept per period e^(-2 delta) = '+sigf(Math.exp(-2*ld),3)
      :'no damping: every turn is the same height',COL.pos,SM_FONT,'right','top');
  }
  drawCaption(ctx,L);
}

/* ---- dispatch ------------------------------------------------------ *
 * one layout per view, used by the drawing AND by the pointer hit-test,
 * so the two cannot drift apart (waveguides.html, Known-bad)            */
function viewCaps(v){
  if(v==='bnc') return [BNC_CAP_FULL,BNC_CAP_SHORT,1,0.38];
  if(v==='lab') return [LAB_CAP_FULL,LAB_CAP_SHORT,1,0.38];
  if(v==='per') return [PER_CAP_FULL,PER_CAP_SHORT,2,0.40];
  if(v==='dmp') return [DMP_CAP_FULL,DMP_CAP_SHORT,2,0.40];
  if(v==='eng') return [ENG_CAP_FULL,ENG_CAP_SHORT,2,0.40];
  return [STR_CAP_FULL,STR_CAP_SHORT,1,0.34];
}
function layoutFor(ctx,W,H,v){
  if(v==='str'||v==='bnc'||v==='lab') return splitLayout(ctx,W,H,v);
  const a=viewCaps(v);
  return stageLayout(ctx,W,H-HINT_H,a[0],a[1],a[2],a[3],1);
}
function drawView(ctx,W,H,M){
  LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[];
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const v=M.view;
  if(v==='str') drawStretch(ctx,W,H,M);
  else if(v==='bnc') drawBounce(ctx,W,H,M);
  else if(v==='lab') drawLab(ctx,W,H,M);
  else if(v==='per') drawPeriod(ctx,W,H,M);
  else if(v==='dmp') drawDamping(ctx,W,H,M);
  else drawEnergy(ctx,W,H,M);
}

function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame: only the three PhET screens and the energy view carry a clock */
  S.step=function(dtWall){
    if(!ST.running) return false;
    if(!liveViews(ST.view)) return false;
    const dts=(dtWall||0)*(ST.speed==='slow'?SLOW:1);
    if(!(dts>0)) return false;
    advance(ST,dts);
    return true;
  };
  /* the pointer: PhET's own three draggables — the hanging mass, the movable
     reference line and the ruler */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null;
      if(DRAG.what==='mass'){ LIVE.slot[DRAG.sp].v=0; }
      DRAG.what=null; return had; }
    if(ST.view!=='str'&&ST.view!=='bnc'&&ST.view!=='lab') return false;
    const ctx=canvas.getContext('2d'), M=buildModel();
    const L=layoutFor(ctx,S.W,S.H,ST.view);
    const map=stageMap(M,L.main), wy=map.wy(y), wx=map.wx(x);
    if(type==='down'){
      if(ST.ruler&&wx>=ST.rulerX&&wx<=ST.rulerX+RULER_W&&wy<=ST.rulerY&&wy>=ST.rulerY-RULER_L){
        DRAG.what='ruler'; DRAG.ox=ST.rulerX-wx; DRAG.oy=ST.rulerY-wy; return true; }
      if(ST.movLine&&Math.abs(y-map.Y(ST.movY))<=7){ DRAG.what='movline'; DRAG.oy=ST.movY-wy; return true; }
      for(const s of M.springs){
        if(!s.on) continue;
        const r=massRectPx(map,s);
        if(x>=r.x-3&&x<=r.x1+3&&y>=r.y-3&&y<=r.y1+3){
          DRAG.what='mass'; DRAG.sp=s.i; DRAG.oy=s.bottom-wy; return true; }
      }
      return false;
    }
    if(type==='move'){
      if(DRAG.what==='ruler'){ ST.rulerX=clamp(wx+DRAG.ox,0.15,2.0); ST.rulerY=clamp(wy+DRAG.oy,0.2,CEILING_Y+0.05); return true; }
      if(DRAG.what==='movline'){ ST.movY=clamp(wy+DRAG.oy,FLOOR_Y,CEILING_Y); return true; }
      if(DRAG.what==='mass'){
        const bot=wy+DRAG.oy;
        LIVE.slot[DRAG.sp].y=clamp(CEILING_Y-L0-bot,-0.12,1.55);
        LIVE.slot[DRAG.sp].v=0;
        return true;
      }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  /* PhET gives each screen its own model, and the Stretch screen sets the
     damping to 0.7 while Bounce and Lab set 0 — switching views does the same,
     and re-hangs that screen's masses at the unstretched end */
  function releaseView(){
    const seen={};
    for(const sp of springsOf(st)){ if(!seen[sp.i]){ slotReset(sp.i); seen[sp.i]=1; } }
  }
  function setView(k){
    st.view=k;
    if(VIEW_DAMPING[k]!==undefined) st.damping=VIEW_DAMPING[k];
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    releaseView();
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2));
  });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        const was=st[key]; st[key]=o.id; if(onPick) onPick(o,was);
        [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }
  function btn(label,fn){ return h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},label); }

  /* the two-spring screens */
  const gTwo=h('div',{class:'grp'},h('h3',null,'the two springs'));
  gTwo.appendChild(slider('k1','spring 1 strength, N/m',KMIN,KMAX,1,v=>fmt(v,0)+' N/m'));
  const m1Chips=chipRow(RACK,'mass1',()=>slotReset(0)); gTwo.appendChild(m1Chips); trackChips(gTwo,RACK,'mass1');
  gTwo.appendChild(slider('k2','spring 2 strength, N/m',KMIN,KMAX,1,v=>fmt(v,0)+' N/m'));
  const m2Chips=chipRow(RACK,'mass2',()=>slotReset(1)); gTwo.appendChild(m2Chips); trackChips(gTwo,RACK,'mass2');
  const twoTag=h('div',{class:'tag'}); gTwo.appendChild(twoTag);

  /* the lab's single spring */
  const gOne=h('div',{class:'grp'},h('h3',null,'the spring'));
  gOne.appendChild(slider('kl','spring strength, N/m',KMIN,KMAX,1,v=>fmt(v,0)+' N/m'));
  const mlChips=chipRow(LAB_RACK,'labMass',()=>slotReset(2)); gOne.appendChild(mlChips); trackChips(gOne,LAB_RACK,'labMass');
  gOne.appendChild(slider('massG','mass, g',MASS_G_MIN,MASS_G_MAX,1,v=>fmt(v,0)+' g',()=>slotReset(2)));
  const oneTag=h('div',{class:'tag'}); gOne.appendChild(oneTag);

  const gGrav=h('div',{class:'grp'},h('h3',null,'gravity'));
  const bodyChips=chipRow(BODY_LIST,'body'); gGrav.appendChild(bodyChips); trackChips(gGrav,BODY_LIST,'body');
  gGrav.appendChild(slider('gCustom','g, m/s²',GMIN,GMAX,0.1,v=>fmt(v,1)+' m/s²'));
  gGrav.appendChild(h('div',{class:'checks'},checkbox('reveal','reveal the hidden values')));
  const gravTag=h('div',{class:'tag'}); gGrav.appendChild(gravTag);

  const gDamp=h('div',{class:'grp'},h('h3',null,'damping'));
  gDamp.appendChild(slider('damping','b, N s/m',BMIN,BMAX,0.01,v=>fmt(v,2)+' N s/m'));
  const dampTag=h('div',{class:'tag'}); gDamp.appendChild(dampTag);

  const gTime=h('div',{class:'grp'},h('h3',null,'time'));
  gTime.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  const speedChips=chipRow(SPEED_LIST,'speed'); gTime.appendChild(speedChips); trackChips(gTime,SPEED_LIST,'speed');
  gTime.appendChild(h('div',{class:'btnrow'},btn('step',()=>{ if(liveViews(st.view)) advance(st,0.02*(st.speed==='slow'?SLOW:1)); }),
    btn('let go again',releaseView),
    btn('reset all',()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v;
      if(VIEW_DAMPING[v]!==undefined) st.damping=VIEW_DAMPING[v]; liveReset(); syncChips(); })));
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  const gTools=h('div',{class:'grp'},h('h3',null,'lines and tools'));
  gTools.appendChild(h('div',{class:'checks'},checkbox('natLine','unstretched length'),checkbox('restLine','resting position'),
    checkbox('movLine','movable line'),checkbox('ruler','ruler'),checkbox('stopwatch','stopwatch'),checkbox('trace','period trace')));
  const swBtns=h('div',{class:'btnrow'},btn('start / stop',()=>{ LIVE.swOn=!LIVE.swOn; }),btn('clear',()=>{ LIVE.sw=0; }));
  gTools.appendChild(swBtns);
  const toolTag=h('div',{class:'tag'}); gTools.appendChild(toolTag);

  const gAna=h('div',{class:'grp'},h('h3',null,'the spring analysed'));
  gAna.appendChild(slider('kA','spring constant k, N/m',KMIN,KMAX,1,v=>fmt(v,0)+' N/m'));
  gAna.appendChild(slider('mAg','mass m, g',MASS_G_MIN,MASS_G_MAX,1,v=>fmt(v,0)+' g'));
  gAna.appendChild(slider('zeta','damping ratio ζ',0,2,0.01,v=>fmt(v,2)));
  const anaTag=h('div',{class:'tag'}); gAna.appendChild(anaTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Masses and Springs: Basics (University of Colorado Boulder, '
      +'phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. PhET&rsquo;s values (spring 3&ndash;12 N/m, masses 50&ndash;300 g and the '
      +'rack of 50/100/250 g, Moon 1.6, Earth 9.8, Planet X 14.2, Jupiter 24.8 m/s<sup>2</sup>, damping 0&ndash;0.7 N s/m, ceiling 1.47 m, natural '
      +'length 0.5 m, slow motion &times;1/8) are read from its build 1.0.28 and its doc/model.md; the real surface gravities are Moon 1.62, Earth '
      +'9.81, Jupiter 24.79 m/s<sup>2</sup>. Everything else is exact and pinned in selfTest to build/masses-and-springs-basics/derive.py '
      +'(scipy solve_ivp and quad, an RK4 whose order is measured, and the closed form).'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gTwo,gOne,gGrav,gDamp,gTime,gTools,gAna,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  /* a row the view ignores is hidden, never left live and inert */
  function syncPanel(){
    const v=st.view, two=(v==='str'||v==='bnc'), one=(v==='lab'||v==='eng'), live=two||one;
    gTwo.hidden=!two; gOne.hidden=!one;
    rows.massG.row.hidden=(rackById(LAB_RACK,st.labMass).m!==null);
    gGrav.hidden=!live;
    rows.gCustom.row.hidden=(st.body!=='custom');
    rows.cb_reveal.row.hidden=!(M_anyHidden());
    gDamp.hidden=!live;
    gTime.hidden=!live;
    gTools.hidden=!(v==='str'||v==='bnc'||v==='lab');
    rows.cb_trace.row.hidden=(v!=='lab');
    swBtns.hidden=!st.stopwatch;
    gAna.hidden=!(v==='per'||v==='dmp');
    rows.zeta.row.hidden=(v!=='dmp');
    for(const k in rows) rows[k].sync();
    const bc=bCrit(st.mAg/1000,st.kA);
    twoTag.innerHTML='PhET&rsquo;s rack: 250, 100 and 50 g, and three unlabelled ones. Drag a mass on the canvas to move it; let go and it swings from there.';
    oneTag.innerHTML='PhET&rsquo;s lab mass runs 50&ndash;300 g; its two unlabelled masses are 180 and 120 g. Drag it on the canvas.';
    gravTag.innerHTML='PhET&rsquo;s own values, not the real ones (Earth 9.81, Moon 1.62, Jupiter 24.79). Planet X is its invented '
      +(st.reveal?'14.2 m/s<sup>2</sup>':'mystery &mdash; read the stretch and solve g = k y/m');
    dampTag.innerHTML='PhET&rsquo;s Basics has no damping slider: it fixes b at 0.7 on Stretch and 0 on Bounce and Lab, which is what switching '
      +'views here restores. This slider is the parent sim&rsquo;s, 0&ndash;0.7 N s/m.';
    timeTag.innerHTML='space runs/pauses &nbsp; <b>.</b> steps &nbsp; <b>r</b> lets go again &nbsp; 1&ndash;6 switch views'
      +(st.speed==='slow'?' &nbsp; slow motion &times;1/8 (PhET)':'');
    toolTag.innerHTML='drag the ruler and the movable line on the canvas'+(st.stopwatch?'; the stopwatch runs on the readout':'');
    anaTag.innerHTML='2&radic;(km) = '+sigf(bc,4)+' N s/m here, so &zeta; = 1 needs b = '+sigf(bc,4)
      +' &mdash; '+(bc>BMAX?'past':'inside')+' PhET&rsquo;s 0.7. The slider runs to &zeta; = 2 so the other two regimes can be drawn.';
  }
  function M_anyHidden(){
    if(st.body==='planetX') return true;
    for(const sp of springsOf(st)) if(sp.myst) return true;
    return false;
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='str'||st.view==='bnc'||st.view==='lab')
        ?'drag a mass, the ruler or the movable line · space pauses · 1–6 switch views'
        :'space pauses · 1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; syncPanel(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ releaseView(); dirty=true; refresh(); }
    else if(e.key==='.'){ if(liveViews(st.view)) advance(st,0.02*(st.speed==='slow'?SLOW:1)); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0, last=0;
  function frameLoop(tm){
    frameN++;
    const dtw=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    const advanced=S.step(dtw);
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%8===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

 *  selfTest — headless verification.  Every value labelled (derive)   *
 *  is a line of build/masses-and-springs-basics/refvals.txt, the      *
 *  printed output of derive.py (scipy solve_ivp, scipy quad, an RK4   *

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}
