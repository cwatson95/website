<title>My solar system &mdash; two to four bodies under gravity, and the orbits they make</title>
<!--
  ===================================================================
  my-solar-system.html — gravity with two, three and four bodies:
  drag them, weigh them, throw them, and watch what Newton's law
  does with what you built
  ===================================================================

  Remake of PhET Interactive Simulations' My Solar System (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0).  New code; no
  PhET code or assets.  PhET's two screens are the first two views.

  TWO BODIES: PhET's Intro screen — a star and a planet whose masses
  you set and whose positions and velocities you drag, with the paths,
  the centre of mass, the velocity and gravity arrows, a grid and a
  measuring tape.  THE LAB: PhET's Lab screen — one to four bodies and
  its eleven orbital systems (Sun and planet, a moon, a comet, trojan
  asteroids, ellipses, "hyperbolic", the slingshots, a binary, the four
  star ballet, the double double), the values table, and the same
  controls.  THE EXACT ORBIT (an analysis view, not a PhET screen): two
  bodies are the one case that has a closed-form answer, so the
  integrated path is drawn against Kepler's — the relative orbit about
  μ = G(m₁+m₂), the two similar ellipses about the centre of mass, and
  the error between numerical and exact as it grows.  CONSERVATION
  (also not a PhET screen): energy, momentum and angular momentum along
  the run, the same system integrated by PhET's own shipped step beside
  it, and the order of both methods measured by halving the step.

  WHAT IS EXACT
  -------------
  Two-body runs, against Kepler's equation: the sim's own integration
  tracks the closed-form solution to 1e-9 AU over 120 frames, and
  build/my-solar-system/derive.py checks both against scipy's solve_ivp
  (DOP853, rtol 1e-12).  Momentum and angular momentum are conserved to
  rounding by construction (every kick is an equal and opposite pair,
  every drift leaves r × v alone): measured |Δp|/p ≤ 7e-15 and |ΔL/L| ≤
  1.3e-14 over 2,000 frames.  Energy is not a conserved quantity of the
  scheme, only a nearly conserved one: measured |ΔE/E| ≤ 6.1e-10 over
  the same run.  The four-star ballet is an exact homographic solution
  and is asserted as one: the square stays square to 2e-14 of a side
  and the whole configuration returns to its start after 0.2870 model
  units to 1e-11 AU.

  WHAT IS MODELLED
  ----------------
  Newton's law of gravitation, point masses, in the plane, with no
  softening.  The integrator is PEFRL (Omelyan, Mryglod & Folk 2002),
  fourth order, four force evaluations a step, substepped so that no
  step exceeds 0.02 of the shortest pairwise crossing or free-fall
  time.  A collision merges the pair: mass, momentum and the centre of
  mass are all conserved (PhET instead keeps the heavier body's mass
  and hands it the lighter one's momentum, which conserves momentum but
  loses the mass — the difference is stated in the readout).

  WHAT IS NOT MODELLED
  --------------------
  No relativity, no tides, no radiation pressure, no third dimension.
  Bodies are points for the force and discs only for drawing and for
  deciding when they touch.  Three bodies and more are chaotic, so a
  long run is one possible history, not the history: the sim says so on
  the canvas, and the conservation view is there to show how much of
  the drift is the method and how much is the physics.

  MEASURED NUMBERS, AND WHERE THEY COME FROM
  ------------------------------------------
  Everything dimensional is PhET's own, read out of
  docs/phets/my-solar-system_en.html (1.3.16) and named as PhET's:
  G = 4.4567 AU (km/s)² per 10²⁸ kg, the mass unit 10²⁸ kg, the mass
  slider 0.1–300, the body radius max(0.03, 0.023 m^(1/3)) AU, the
  engine time scale 0.05 per second with 4,000/N substeps, the zoom
  levels 25–125 view units per AU, the 20-AU path cap, and the eleven
  orbital systems' masses, positions and velocities.  The conversions
  to years and true km/s use AU = 149,597,870.7 km (IAU 2012), the
  Julian year and G = 6.6743e-11 (CODATA, PhET's own figure).

  WHAT THIS FILE MEASURED ABOUT PhET (derive.py; stated on the page)
  -----------------------------------------------------------------
  * PhET's integrator is named PEFRL and carries its three
    coefficients, but as shipped it evaluates the acceleration ONCE per
    step and reuses it for all four kicks.  That composition is exactly
    x + v h + ½a h², v + a h: first order, not fourth.  Measured by
    halving the step: error ratios 1.9, 2.0, 2.0 (order 0.97) against
    16.0, 16.0, 16.6 (order 4.02) for the real thing.  Its own substep
    is small enough to hide it — 3.7e-6 of the energy in the first
    second of running.
  * PhET's G = 4.4567 is 0.107 % below the 4.4615 that CODATA's G gives
    in these units, and PhET solves its time unit from its own G, so
    its "km/s" is 1.000538 true km/s.  Kept, so the presets move as
    PhET's do; the readout gives both.
  * PhET's "Hyperbolic" orbital system is not hyperbolic.  Its three
    test bodies fly past the star at 0.878, 0.929 and 0.995 of the
    escape speed, on ellipses of e = 0.954, 0.926 and 0.990 that come
    back after 12.6, 32.5 and 1,791 years.
-->

   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','

function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop
   in a naive generator (sbs_sims Known-bad) — return [] instead */
function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;
  for(let e=e0;e<=e1;e+=step){ const v=Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.

   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }

/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }

     caption names the colours */
  return null;

function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};

function sparseTicks(lo,hi,hpx){

/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).

   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));

function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];

/* ================================================================== *
 *  SOLAR_SYSTEM_COMMON, rebuilt: the two-body (Kepler) engine and the  *
 *  N-body integrator.  Shared by keplers-laws.html and                 *
 *  my-solar-system.html (my-solar-system's assemble.py reads this very  *
 *  file, so the two cannot drift).  Units-agnostic: every function      *
 *  takes mu = G M (or G and masses) in whatever units the caller uses.  *
 *                                                                      *
 *  Python twin: build/keplers-laws/derive.py (Kepler) and              *
 *  build/my-solar-system/derive.py (N-body), both checked against      *
 *  scipy (brentq, quad, solve_ivp at rtol 1e-13).                      *
 * ================================================================== */

/* ---- Kepler's equation ------------------------------------------------------------------
   E - e sin E = M, solved by Newton safeguarded with the bracket [M - e, M + e]
   (Numerical Recipes' rtsafe: bisect only when a Newton step leaves the bracket or is not
   halving the interval).  The naive safeguard -- "reject a step that is not strictly inside
   (lo, hi)" -- STALLS: the converged step lands exactly on the bracket end it has just set,
   is rejected, and bisection then takes 46 more iterations (e = 0.99, M = 0.3, measured in
   derive.py).  The tolerance is on the STEP, which is the error of the previous iterate. */
const KEP_TOL = 1e-15, KEP_MAXIT = 100;
function keplerSolve(M, e){
  const turns = Math.round(M / TAU), Mr = M - TAU * turns;
  if(e === 0) return {E: Mr + TAU * turns, it: 0};
  let lo = Mr - e, hi = Mr + e;                    /* f(lo) <= 0 <= f(hi) for 0 < e <= 1 */
  let E = e < 0.8 ? Mr + e * Math.sin(Mr) : Mr + (Mr >= 0 ? 0.85 * e : -0.85 * e);
  E = clamp(E, lo, hi);
  let dxold = hi - lo, dx = dxold;
  let f = E - e * Math.sin(E) - Mr, fp = 1 - e * Math.cos(E), k = 0;
  while(k < KEP_MAXIT){
    k++;
    if(((E - hi) * fp - f) * ((E - lo) * fp - f) > 0 || Math.abs(2 * f) > Math.abs(dxold * fp)){
      dxold = dx; dx = 0.5 * (hi - lo); E = lo + dx;
    } else {
      dxold = dx; dx = f / fp; E = E - dx;
    }
    if(Math.abs(dx) <= KEP_TOL) break;
    f = E - e * Math.sin(E) - Mr; fp = 1 - e * Math.cos(E);
    if(f < 0) lo = E; else hi = E;
  }
  return {E: E + TAU * turns, it: k};
}
function keplerE(M, e){ return keplerSolve(M, e).E; }
/* the hyperbolic twin: e sinh H - H = M (e > 1).  Newton from a start that is right in both
   limits: H ~ M/(e-1) for small M, H ~ ln(2M/e) for large. */
function keplerH(M, e){
  const s = M < 0 ? -1 : 1, Ma = Math.abs(M);
  let H = Ma < 1 ? Ma / (e - 1) : Math.log(2 * Ma / e + 1.8);
  for(let k = 0; k < KEP_MAXIT; k++){
    const f = e * Math.sinh(H) - H - Ma, fp = e * Math.cosh(H) - 1;
    const d = f / fp; H -= d;
    if(Math.abs(d) <= KEP_TOL * (1 + Math.abs(H))) break;
  }

}
/* the anomalies.  Both keep the turn count, so nu(t) is continuous and increasing. */
function trueFromE(E, e){
  const turns = Math.round(E / TAU), Er = E - TAU * turns;

function trueFromH(H, e){ return 2 * Math.atan2(Math.sqrt(e + 1) * Math.tanh(H / 2), Math.sqrt(e - 1)); }

/* ---- the conic through a state ----------------------------------------------------------
   Vis-viva for a, the eccentricity vector for e and the periapsis direction, the sign of the
   angular momentum for the sense of travel.  An orbit rounder than E_CIRC is treated as a
   circle and its "periapsis" put at the body's own position, so the sectors of the second
   law start somewhere definite rather than at a direction made of rounding noise. */
const E_CIRC = 1e-9;
function conicFromState(x, y, vx, vy, mu){
  const r = Math.hypot(x, y), v2 = vx * vx + vy * vy, rv = x * vx + y * vy;
  const h = x * vy - y * vx, energy = 0.5 * v2 - mu / r;
  const ex = ((v2 - mu / r) * x - rv * vx) / mu, ey = ((v2 - mu / r) * y - rv * vy) / mu;
  let e = Math.hypot(ex, ey), w;
  const dir = h >= 0 ? 1 : -1;
  if(e < E_CIRC){ e = 0; w = Math.atan2(y, x); } else w = Math.atan2(ey, ex);
  const cw = Math.cos(w), sw = Math.sin(w);
  const nu0 = Math.atan2(dir * (y * cw - x * sw), x * cw + y * sw);
  const el = {mu, r, v: Math.sqrt(v2), h, dir, energy, e, w, nu0, p: h * h / mu, ex, ey,

/* ---- the N-body system ------------------------------------------------------------------

function nbodyMake(m, x, y, vx, vy){

          vx: Float64Array.from(vx), vy: Float64Array.from(vy),
          ax: new Float64Array(n), ay: new Float64Array(n)};

function nbodyCopy(S){ const T = nbodyMake(S.m.slice(0, S.n), S.x.slice(0, S.n), S.y.slice(0, S.n),

   bodies: [[60, -1.15, -0.03, 0, -32.5283], [70, 1.02, 0, 0.2112, 31.6834], [55, -0.77, -0.02, -0.2112, 8.8713],
            [62, 1.35, 0, -0.2112, -10.9836]]},
  {id: 'custom', name: 'custom', bodies: null}
];
function presetById(id){ const p = PRESETS.find(p => p.id === id); if(!p) throw new Error('no orbital system ' + id); return p; }
/* PhET's own colours for the four bodies (yellow, magenta, cyan, green) */
const BODY_COL = ['#f2c14e', '#cd35c4', '#5ac8e0', '#b8ec4c'];
/* the four bodies a Lab system falls back on when one is added (PhET's defaultBodyInfo) */
const SPARE = [[0.1, 3, 0, 0, 10], [0.1, -3, 0, 0, -10], [0.1, 0, 3, -10, 0], [0.1, 0, -3, 10, 0]];

function yrOf(t){ return t * T_U_YR; }                      /* model time -> Julian years */
function kmsTrue(v){ return v * KMS_TRUE; }                 /* PhET's "km/s" -> true km/s */

/* ---- a running system ------------------------------------------------------------------- */
function sysFromBodies(list, followCom){
  const m = list.map(b => b[0]), x = list.map(b => b[1]), y = list.map(b => b[2]),
        vx = list.map(b => b[3]), vy = list.map(b => b[4]);
  const S = nbodyMake(m, x, y, vx, vy);
  if(followCom){                       /* PhET's followCenterOfMass on every preset it loads */
    const c = nbodyCom(S);
    for(let i = 0; i < S.n; i++){ S.vx[i] -= c.vx; S.vy[i] -= c.vy; }
  }
  const sys = {S, col: list.map((b, i) => i), t: 0, paths: list.map(() => []), plen: list.map(() => 0),
               merged: [], start: [], startCom: followCom};
  /* AFTER the subtraction, not before: the start is what restart returns to, and PhET's own
     load leaves the centre of mass at rest */
  sysSaveStart(sys);
  return sys;
}
function sysLoad(id, nb){
  const p = presetById(id);
  /* a named system brings its own bodies and its own count; nb only sizes a custom one */
  const list = p.bodies ? p.bodies.map(b => b.slice()) : SPARE.slice(0, nb || 2).map(b => b.slice());
  return sysFromBodies(list, !!p.bodies);
}
/* the state the restart button returns to: PhET saves it whenever the user lets go */
function sysSaveStart(sys){
  sys.start = [];
  for(let i = 0; i < sys.S.n; i++) sys.start.push([sys.S.m[i], sys.S.x[i], sys.S.y[i], sys.S.vx[i], sys.S.vy[i]]);
  sys.startCol = sys.col.slice();
  /* the clock reading this start was taken at.  The centre-of-mass button saves a start
     WITHOUT stopping the clock, so a saved start is not always at t = 0, and the exact
     two-body orbit anchored on it has to be read from here, not from zero. */
  sys.t0 = sys.t;
}
function sysRestart(sys){
  const list = sys.start.map(b => b.slice());
  const S = nbodyMake(list.map(b => b[0]), list.map(b => b[1]), list.map(b => b[2]),
                      list.map(b => b[3]), list.map(b => b[4]));
  sys.S = S; sys.t = 0; sys.t0 = 0; sys.merged = [];
  sys.col = sys.startCol ? sys.startCol.slice() : list.map((b, i) => i);
  sys.paths = list.map(() => []); sys.plen = list.map(() => 0);
}
function sysSetN(sys, n){
  const list = [];
  for(let i = 0; i < n; i++){
    if(i < sys.S.n) list.push([sys.S.m[i], sys.S.x[i], sys.S.y[i], sys.S.vx[i], sys.S.vy[i]]);
    else list.push(SPARE[i].slice());
  }
  const keep = sys.col.slice(0, n);
  while(keep.length < n) keep.push(keep.length);
  sys.S = nbodyMake(list.map(b => b[0]), list.map(b => b[1]), list.map(b => b[2]), list.map(b => b[3]), list.map(b => b[4]));
  sys.col = keep; sys.paths = list.map(() => []); sys.plen = list.map(() => 0); sys.merged = [];
  sysSaveStart(sys);
}
/* the centre-of-mass frame: PhET's "Follow Center of Mass" subtracts both */
function sysComFrame(sys){
  const c = nbodyCom(sys.S);
  for(let i = 0; i < sys.S.n; i++){
    sys.S.x[i] -= c.x; sys.S.y[i] -= c.y; sys.S.vx[i] -= c.vx; sys.S.vy[i] -= c.vy;
  }
  sysClearPaths(sys); sysSaveStart(sys);
}
function sysClearPaths(sys){ sys.paths = []; sys.plen = []; for(let i = 0; i < sys.S.n; i++){ sys.paths.push([]); sys.plen.push(0); } }
/* PhET keeps at most 20 AU of path (MAX_PATH_DISTANCE) and 5800 points */
function sysAddPath(sys){
  for(let i = 0; i < sys.S.n; i++){
    const p = sys.paths[i], x = sys.S.x[i], y = sys.S.y[i];
    if(p.length){
      const last = p[p.length - 1], d = Math.hypot(x - last[0], y - last[1]);
      if(d === 0) continue;
      p.push([x, y]); sys.plen[i] += d;
      while(sys.plen[i] > PHET.PATH_AU || p.length > PHET.PATH_PTS){
        sys.plen[i] -= Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]); p.shift();
      }
    } else p.push([x, y]);
  }
}
/* one frame: advance, merge anything touching, extend the paths */
function sysStep(sys, dt, keepPaths){
  const nsub = nbodyAdvance(sys.S, G_MSS, dt, NBODY_ETA_MSS);
  const merges = nbodyCollide(sys.S);
  for(const mg of merges){
    sys.merged.push({x: mg.x, y: mg.y, t: sys.t, m: mg.m});
    sys.col.splice(mg.gone, 1);
    sys.paths.splice(mg.gone, 1); sys.plen.splice(mg.gone, 1);
  }
  sys.t += dt;
  if(keepPaths) sysAddPath(sys);
  return {nsub, merges};
}
/* PhET's own engine, as shipped, run beside ours for the comparison: 4000/N substeps a frame,
   one force evaluation each, the PEFRL coefficients applied to that single acceleration */
function phetShadowStep(S, dt){
  const n = Math.max(1, Math.round(PHET.SUBSTEPS / S.n));
  const h = dt / n;
  for(let k = 0; k < n; k++) phetStep(S, G_MSS, h);
  return n;
}
/* the two-body reduction, for the exact view and the suites */
function sysTwoBody(sys){ return sys.S.n === 2 ? twoBodyReduce(sys.S, G_MSS) : null; }
/* how far a body is from the centre of mass, in units of its own radius: used to decide
   whether the "return bodies" button is offered (PhET offers it when one goes off screen) */
function sysOffscreen(sys, R){
  for(let i = 0; i < sys.S.n; i++) if(Math.abs(sys.S.x[i]) > R * 1.6 || Math.abs(sys.S.y[i]) > R * 1.6) return true;
  return false;
}

/* ================================================================== *
 *  state, the two running systems, the per-view model and the readout *
 * ================================================================== */
const TABS = [['intro', 'two bodies'], ['lab', 'the lab'], ['exact', 'the exact orbit'],
              ['conserve', 'conservation']];
const COL = {pos: '#b8ec4c', ref: '#e8843a', live: '#cd35c4', struct: '#5ac8e0', dim: '#8b93a6',
             edge: '#242a3a', com: '#e8556d', path: '#7f88a0', warn: '#e8843a', phet: '#c9a7ff'};
const RO_W = 300;
const SPEEDS = [{id: 'slow', name: 'slow', f: 0.25}, {id: 'normal', name: 'normal', f: 1},
                {id: 'fast', name: 'fast', f: 1.75}];       /* PhET's timeSpeedMap: 1/4, 1, 7/4 */
const NBODIES = [{id: 1, name: '1'}, {id: 2, name: '2'}, {id: 3, name: '3'}, {id: 4, name: '4'}];
const VSCALE = 4.2;             /* px per km/s for the velocity arrow (printed on the canvas) */
const FSCALE = 60;              /* px for the gravity arrow at the reference pull, times 10^n */
/* the reference pull the 60 px stands for: PhET's own star and planet at their starting
   separation, G x 250 x 25 / 2^2 in these units */
const F_REF = G_MSS * 250 * 25 / 4;

const DEFAULTS = {
  view: 'intro', preset: 'sunPlanet', nb: 2,
  mass1: 250, mass2: 25, mass3: 0.1, mass4: 0.1,
  /* PhET's defaults: the path and the velocity arrows on, everything else off */
  com: false, speedLab: false, velocity: true, gravity: false, fpow: 0, path: true,
  grid: false, tape: false, values: false, shadow: true,
  running: false, speed: 'normal', zoom: PHET.ZOOM_DEF
};
const ST = Object.assign({}, DEFAULTS);
const SIM = {intro: null, lab: null, tape: {ax: 0, ay: 1, bx: 1, by: 1}, hist: [], shadow: null,
             shadowT: 0, base: null, order: null, ehist: [], exact: null, exactT0: 0};
const DRAGM = {what: null, i: -1};
const HIST_MAX = 1200;

/* the intro system is PhET's Intro screen (its two bodies); the lab system is whichever
   orbital system is chosen.  The analysis views ride along: "the exact orbit" reads the
   intro system, "conservation" reads the lab one. */
function sysKey(view){ return (view === 'lab' || view === 'conserve') ? 'lab' : 'intro'; }
function curSys(){ return SIM[sysKey(ST.view)]; }
function simReset(){
  SIM.intro = sysLoad('sunPlanet');
  SIM.lab = sysLoad(ST.preset, ST.nb);
  ST.nb = SIM.lab.S.n;                     /* a named system sets the count, not the other way */
  SIM.tape = {ax: 0, ay: 1, bx: 1, by: 1};
  histReset(); ehistReset();
  syncMasses();
}
function histReset(){
  const sys = SIM.lab;
  SIM.hist = [];
  SIM.base = sys ? {E: nbodyEnergy(sys.S, G_MSS), L: nbodyAngular(sys.S), p: nbodyMomentum(sys.S),
                    pscale: pScale(sys.S)} : null;
  SIM.shadow = sys ? nbodyCopy(sys.S) : null;
  SIM.shadowT = 0;
  SIM.order = null;
}
/* the exact-orbit view's record: the two-body solution is anchored at the state the intro
   system started from, so it is rebuilt whenever that start changes.  It is anchored at the
   START's own clock reading too (sys.t0): the centre-of-mass button saves a start mid-run. */
function ehistReset(){
  SIM.ehist = [];
  const sys = SIM.intro;
  SIM.exactT0 = sys ? sys.t0 : 0;
  SIM.exact = (sys && sys.S.n === 2)
    ? twoBodyReduce({n: 2, m: sys.start.map(b => b[0]), x: sys.start.map(b => b[1]), y: sys.start.map(b => b[2]),
                     vx: sys.start.map(b => b[3]), vy: sys.start.map(b => b[4])}, G_MSS)
    : null;
}
function exactAge(sys){ return sys.t - SIM.exactT0; }
function ehistSample(){
  const sys = SIM.intro, red = SIM.exact;
  if(!red || sys.S.n !== 2 || sys.merged.length) return;
  const e = twoBodyAt(red, exactAge(sys));
  const err = Math.max(Math.hypot(sys.S.x[0] - e.x1, sys.S.y[0] - e.y1),
                       Math.hypot(sys.S.x[1] - e.x2, sys.S.y[1] - e.y2));
  SIM.ehist.push({t: sys.t, err, rn: Math.hypot(sys.S.x[1] - sys.S.x[0], sys.S.y[1] - sys.S.y[0]),
                  re: Math.hypot(e.rel.x, e.rel.y)});
  if(SIM.ehist.length > HIST_MAX) SIM.ehist.shift();
}
function pScale(S){ let s = 0; for(let i = 0; i < S.n; i++) s += S.m[i] * Math.hypot(S.vx[i], S.vy[i]); return s || 1; }
/* the mass sliders mirror whichever system is on screen */
function syncMasses(){
  const sys = curSys(); if(!sys) return;
  for(let i = 0; i < 4; i++) ST['mass' + (i + 1)] = i < sys.S.n ? sys.S.m[i] : DEFAULTS['mass' + (i + 1)];
}
function setMass(i, m){
  const sys = curSys();
  if(!sys || i >= sys.S.n) return;
  sys.S.m[i] = m;
  ST.running = false;
  sys.t = 0; sysClearPaths(sys);
  sysSaveStart(sys);
  if(sysKey(ST.view) === 'lab'){ ST.preset = 'custom'; histReset(); } else ehistReset();
}
function speedFactor(){ const s = SPEEDS.find(s => s.id === ST.speed); return s ? s.f : 1; }
function frameDt(){ return PHET.FRAME * speedFactor(); }
/* PhET's zoom: levels 1..6 map to 25..125 view units per AU; here that sets the half-height
   of the world window, and the canvas prints the scale it ends up with */
function viewRadius(){
  const s = PHET.ZOOM_LO + (PHET.ZOOM_HI - PHET.ZOOM_LO) * (ST.zoom - PHET.ZOOM_MIN) / (PHET.ZOOM_MAX - PHET.ZOOM_MIN);
  return 309 / s;
}
function viewAnimates(v){ return true; }
/* one frame of the clock: the system, and (on the conservation view) PhET's own integrator
   running the same system beside it */
function runStep(){
  if(!ST.running) return false;
  const sys = curSys(), dt = frameDt();
  const r = sysStep(sys, dt, ST.path);
  if(sysKey(ST.view) === 'intro') ehistSample();
  if(sysKey(ST.view) === 'lab'){
    if(SIM.shadow && SIM.shadow.n === sys.S.n){ phetShadowStep(SIM.shadow, dt); SIM.shadowT += dt; }
    histSample();
  }
  return true;
}
function histSample(){
  const sys = SIM.lab, B = SIM.base;
  if(!B || sys.merged.length) return;                 /* a merge is not a drift: stop sampling */
  const E = nbodyEnergy(sys.S, G_MSS), L = nbodyAngular(sys.S), p = nbodyMomentum(sys.S);
  let K = 0;
  for(let i = 0; i < sys.S.n; i++) K += 0.5 * sys.S.m[i] * (sys.S.vx[i] * sys.S.vx[i] + sys.S.vy[i] * sys.S.vy[i]);
  const s = {t: sys.t, K, U: E - K, dE: Math.abs(E - B.E) / Math.abs(B.E),
             dL: Math.abs(L - B.L) / Math.max(1e-30, Math.abs(B.L)),
             dP: Math.hypot(p[0] - B.p[0], p[1] - B.p[1]) / B.pscale, dPhet: null};
  if(SIM.shadow && SIM.shadow.n === sys.S.n)
    s.dPhet = Math.abs(nbodyEnergy(SIM.shadow, G_MSS) - B.E) / Math.abs(B.E);
  SIM.hist.push(s);
  if(SIM.hist.length > HIST_MAX) SIM.hist.shift();
}
/* the order of the two integrators, measured on the system now on the bench: the error after
   a fixed time against a reference run, at four step counts.  Memoised per system. */
function orderSweep(sys){
  const key = [sys.S.n, sys.start.map(b => b.join(',')).join(';')].join('|');
  if(SIM.order && SIM.order.key === key) return SIM.order;
  const T = 0.4;
  const make = () => nbodyMake(sys.start.map(b => b[0]), sys.start.map(b => b[1]), sys.start.map(b => b[2]),
                               sys.start.map(b => b[3]), sys.start.map(b => b[4]));
  const run = (N, step) => { const S = make(), h = T / N; for(let k = 0; k < N; k++) step(S, G_MSS, h); return S; };
  const REFS = run(12800, pefrlStep);
  const Ns = [200, 400, 800, 1600], out = {key, N: Ns, pefrl: [], phet: []};
  for(const N of Ns){
    for(const [nm, step] of [['pefrl', pefrlStep], ['phet', phetStep]]){
      const S = run(N, step);
      let d = 0;
      for(let i = 0; i < S.n; i++) d = Math.max(d, Math.abs(S.x[i] - REFS.x[i]), Math.abs(S.y[i] - REFS.y[i]));
      out[nm].push(d);
    }
  }
  out.slope = nm => {
    const e = out[nm];
    let s = 0;
    for(let i = 0; i + 1 < e.length; i++) s += Math.log2(e[i] / e[i + 1]);
    return s / (e.length - 1);
  };
  SIM.order = out;
  return out;
}

/* ---- the model each view draws from ------------------------------------------------------ */
function bodyList(sys){
  const out = [];
  for(let i = 0; i < sys.S.n; i++) out.push({i, m: sys.S.m[i], x: sys.S.x[i], y: sys.S.y[i],
    vx: sys.S.vx[i], vy: sys.S.vy[i], r: massToRadius(sys.S.m[i]), col: BODY_COL[sys.col[i] % 4]});
  return out;
}
function forcesOn(sys){
  const S = sys.S, out = [];
  for(let i = 0; i < S.n; i++){
    let fx = 0, fy = 0;
    for(let j = 0; j < S.n; j++){
      if(j === i) continue;
      const dx = S.x[j] - S.x[i], dy = S.y[j] - S.y[i], r = Math.hypot(dx, dy);
      const f = G_MSS * S.m[i] * S.m[j] / (r * r * r);
      fx += f * dx; fy += f * dy;
    }
    out.push([fx, fy]);
  }
  return out;
}
function exactModel(sys){
  if(sys.S.n !== 2) return null;
  if(!SIM.exact) ehistReset();
  const red = SIM.exact;
  if(!red) return null;
  const now = twoBodyAt(red, exactAge(sys));
  const err = Math.max(Math.hypot(sys.S.x[0] - now.x1, sys.S.y[0] - now.y1),
                       Math.hypot(sys.S.x[1] - now.x2, sys.S.y[1] - now.y2));
  const el = red.el, pts1 = [], pts2 = [], rel = [];
  if(el.kind === 'ellipse'){
    for(let k = 0; k <= 240; k++){
      const s = twoBodyAt(red, el.T * k / 240);
      pts1.push([s.x1, s.y1]); pts2.push([s.x2, s.y2]); rel.push([s.rel.x, s.rel.y]);
    }
  } else {
    for(let k = -120; k <= 120; k++){
      const s = twoBodyAt(red, exactAge(sys) + k * 0.004);
      pts1.push([s.x1, s.y1]); pts2.push([s.x2, s.y2]); rel.push([s.rel.x, s.rel.y]);
    }
  }
  return {red, el, now, err, pts1, pts2, rel, com: red.com, mu: red.mu};
}
function conserveModel(sys){
  const B = SIM.base;
  if(!B) return null;
  const E = nbodyEnergy(sys.S, G_MSS), L = nbodyAngular(sys.S), p = nbodyMomentum(sys.S);
  let K = 0;
  for(let i = 0; i < sys.S.n; i++) K += 0.5 * sys.S.m[i] * (sys.S.vx[i] * sys.S.vx[i] + sys.S.vy[i] * sys.S.vy[i]);
  const sw = SIM.shadow && SIM.shadow.n === sys.S.n
    ? {E: nbodyEnergy(SIM.shadow, G_MSS), t: SIM.shadowT,
       dev: (() => { let d = 0; for(let i = 0; i < sys.S.n; i++)
         d = Math.max(d, Math.hypot(SIM.shadow.x[i] - sys.S.x[i], SIM.shadow.y[i] - sys.S.y[i])); return d; })()}
    : null;
  return {E, L, p, K, U: E - K, base: B, hist: SIM.hist, shadow: sw, order: orderSweep(sys),
          dE: Math.abs(E - B.E) / Math.abs(B.E), dL: Math.abs(L - B.L) / Math.max(1e-30, Math.abs(B.L)),
          dP: Math.hypot(p[0] - B.p[0], p[1] - B.p[1]) / B.pscale, merged: sys.merged.length};
}
function buildModel(){
  const st = ST, sys = curSys();
  const M = {view: st.view, st, sys, key: sysKey(st.view), bodies: bodyList(sys), t: sys.t,
             com: nbodyCom(sys.S), R: viewRadius(), E: nbodyEnergy(sys.S, G_MSS), L: nbodyAngular(sys.S),
             P: nbodyMomentum(sys.S), forces: forcesOn(sys), merged: sys.merged,
             preset: presetById(st.preset)};
  M.chaotic = sys.S.n > 2;
  if(st.view === 'exact') M.ex = exactModel(sys);
  if(st.view === 'conserve') M.cn = conserveModel(sys);
  if(sys.S.n === 2) M.two = twoBodyReduce(sys.S, G_MSS);
  return M;
}

/* ================================================================== *
 *  readout / equation bar / tag                                       *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">' + t + '</td></tr>'; }
function rrow(a, b, cls){ return '<tr><td>' + a + '</td><td class="v' + (cls ? ' ' + cls : '') + '">' + b + '</td></tr>'; }
function yrStr(t){ const y = yrOf(t); return Math.abs(y) < 1 ? fmt(y * 365.25, 1) + ' d' : fmt(y, 3) + ' yr'; }
function massStr(m){ return m < PHET.MASS_MIN ? '&le; ' + fmt(PHET.MASS_MIN, 1) : fmt(m, m < 10 ? 2 : 1); }
function readoutHTML(M){
  const st = ST, sys = M.sys;
  let s = '<div class="rname">My solar system<small>' + plain(TABS.find(t => t[0] === M.view)[1]) + '</small></div><table>';
  s += hd(M.key === 'lab' ? plain(M.preset.name) + ' — ' + sys.S.n + (sys.S.n === 1 ? ' body' : ' bodies') : 'PhET&rsquo;s two bodies')
     + rrow('t', yrStr(sys.t) + ' <span class="dim">(' + fmt(sys.t, 3) + ' model)</span>')
     + rrow('total mass', fmt(M.com.M, 1) + ' &times; 10&sup2;&#8312; kg')
     + rrow('centre of mass', '(' + fmt(M.com.x, 3) + ', ' + fmt(M.com.y, 3) + ') AU', Math.hypot(M.com.x, M.com.y) < 1 ? 'good' : '')
     + rrow('its velocity', fmt(Math.hypot(M.com.vx, M.com.vy), 4) + ' km/s', Math.hypot(M.com.vx, M.com.vy) < 0.01 ? 'good' : 'bad')
     + rrow('energy E = K + U', sigf(M.E, 6))
     + rrow('angular momentum L', sigf(M.L, 6));
  if(M.merged.length) s += rrow('collisions', M.merged.length + ' merge' + (M.merged.length > 1 ? 's' : ''), 'bad');
  if(st.values || M.view === 'lab'){
    s += hd('the bodies (mass 10&sup2;&#8312; kg, AU, km/s)');
    for(const b of M.bodies)
      s += rrow('<span style="color:' + b.col + '">body ' + (b.i + 1) + '</span>',
                massStr(b.m) + ' &nbsp; (' + fmt(b.x, 2) + ', ' + fmt(b.y, 2) + ') &nbsp; ('
                + fmt(b.vx, 1) + ', ' + fmt(b.vy, 1) + ')');
  }
  if(M.two){
    const el = M.two.el;
    s += hd('two bodies: the exact orbit')
       + rrow('&mu; = G(m&#8321;+m&#8322;)', sigf(M.two.mu, 6))
       + rrow('relative orbit', el.kind === 'ellipse' ? 'an ellipse' : 'a ' + el.kind, 'good')
       + rrow('a, e', el.kind === 'ellipse' ? sigf(el.a, 5) + ' AU, ' + fmt(el.e, 4) : '&mdash;, ' + fmt(el.e, 4))
       + (el.kind === 'ellipse' ? rrow('period T', fmt(el.T, 5) + ' model = ' + fmt(yrOf(el.T), 4) + ' yr', 'good') : '')
       + (el.kind === 'ellipse' ? rrow('periapsis, apoapsis', sigf(el.q, 4) + ', ' + sigf(el.Q, 4) + ' AU') : '');
  }
  if(M.view === 'exact' && M.ex){
    s += hd('numerical against exact')

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — build_lagr/p4_views.js (lineage build_buoy, build_cycloid), its   *
 *  generic block only; worldFill/worldPoly/arrowW from build_buoy      *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';

}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }

function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke(); }
}
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();

/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }

/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }
    if(!hit){ pick=[cx,cy]; break; }
  }
  /* nothing clear: in a small box the legend is dropped rather than laid over a curve or a label */
  if(!pick){ if(b.h<300||b.w<420) return; pick=cands[0]; }
  legendBox(ctx,pick[0],pick[1],items);

}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));

}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }

function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);

/* ================================================================== *
 *  the shared view kit for this family: the hint-safe layout, axes    *
 *  that register what they draw, and the pieces both sims paint (the  *
 *  grid, the bodies, the velocity and gravity arrows, the measuring   *
 *  tape, the trail, the stopwatch).  my-solar-system reads this file  *
 *  from ../keplers-laws/, so the two sims draw the same furniture.    *
 * ================================================================== */
/* The house #hint sits at bottom:11px in 11px type, ON TOP of the last line of a caption
   anchored at H - 12, and the canvas capture cannot see it because the hint is HTML
   (wave-on-a-string's finding).  Every layout here is built for H - HINT_H, and the layout
   sweep asserts no canvas text reaches the hint's corner. */
const HINT_H = 18;
function stageLayoutH(ctx, W, H, capFull, capShort, nBottom, bottomFrac, nBottomNarrow){
  return stageLayout(ctx, W, H - HINT_H, capFull, capShort, nBottom, bottomFrac, nBottomNarrow);
}
/* tick labels follow the tick SPACING, not a fixed decimal count (Known-bad: fmt(t,2) prints
   "318.00" whatever the range and six of those do not fit a narrow panel) */
function tickFmt(ticks){
  let g = Infinity;
  for(let i = 1; i < ticks.length; i++) g = Math.min(g, Math.abs(ticks[i] - ticks[i - 1]));
  if(!isFinite(g) || g <= 0) return v => sigf(v, 3);
  let d = 0;
  while(d < 6 && Math.abs(Math.round(g * Math.pow(10, d)) - g * Math.pow(10, d)) > 1e-6 * Math.max(1, g * Math.pow(10, d))) d++;
  return v => fmt(Math.abs(v) < 1e-12 ? 0 : v, d);
}
/* axes() registers nothing, so a label placed later can land on a tick number (the
   standard_model trap).  axesT registers every tick label and both axis titles. */
function axesT(ctx, b, xlo, xhi, ylo, yhi, opt){
  const o = Object.assign({}, opt || {});
  if(o.xticks === undefined) o.xticks = ticksFor(Math.min(xlo, xhi), Math.max(xlo, xhi), o.nx || 6);
  if(o.yticks === undefined) o.yticks = ticksFor(Math.min(ylo, yhi), Math.max(ylo, yhi), o.ny || 5);
  if(!o.xfmt) o.xfmt = tickFmt(o.xticks);
  if(!o.yfmt) o.yfmt = tickFmt(o.yticks);
  axesR(ctx, b, xlo, xhi, ylo, yhi, o);
  const fs = 10.5;
  for(const t of o.xticks){
    const X = b.x + b.w * (t - xlo) / (xhi - xlo || 1);
    if(X < b.x - 0.5 || X > b.x1 + 0.5) continue;
    const w = plain(o.xfmt(t)).length * fs * 0.52;
    LABELS.push([X - w / 2, b.y1 + 5, X + w / 2, b.y1 + 5 + fs * 1.15]);
  }
  for(const t of o.yticks){
    const Y = b.y1 - b.h * (t - ylo) / (yhi - ylo || 1);
    if(Y < b.y - 0.5 || Y > b.y1 + 0.5) continue;
    const w = plain(o.yfmt(t)).length * fs * 0.52;
    LABELS.push([b.x - 6 - w, Y - fs * 0.6, b.x - 6, Y + fs * 0.6]);
  }
  if(o.xlab){ const w = plain(o.xlab).length * 11 * 0.52;
    LABELS.push([b.x + b.w / 2 - w / 2, b.y1 + 21, b.x + b.w / 2 + w / 2, b.y1 + 21 + 13]); }
  if(o.ylab) LABELS.push([b.x - 47, b.y, b.x - 33, b.y1]);
}
/* a label that is kept inside a box as well as on the canvas */
function labIn(ctx, W, H, b, x, y, txt, col, font, align, base){
  const fs = parseFloat((font || LAB_FONT).match(/([\d.]+)px/)[1]);
  const w = plain(txt).length * fs * 0.52;
  let X = clamp(x, b.x + (align === 'right' ? w + 3 : align === 'center' ? w / 2 + 3 : 3),
                b.x1 - (align === 'right' ? 3 : align === 'center' ? w / 2 + 3 : w + 3));
  const Y = clamp(y, b.y + fs, b.y1 - fs * 0.6);
  return lab(ctx, W, H, X, Y, txt, col, font, align, base);
