/* PhET's Intro screen has no Hold Constant panel, so its wall and lid are
   always free; on the Laws screen (and the P-V view, which is the same gas)
   PhET disables the wall when V or P↕V is held and the lid when T is held.
   The sweep drives the wall itself, so nothing there is draggable. */
function wallDraggable(M){ const g=M.g;
  return (M.view==='intro')||((M.view==='laws'||M.view==='pv')&&g.hold!=='volume'&&g.hold!=='pressureV'); }
function lidDraggable(M){ const g=M.g;
  return !!(g.lid&&g.lid.on)&&M.view!=='sweep'&&!((M.view==='laws'||M.view==='pv')&&g.hold==='temperature'); }
/* PhET pauses the Ideal screen while the wall is dragged and spreads the
   particles over the new width on release: no work is done */
function dragPauses(M){ return M.view!=='sweep'; }
function heaterLocked(M){ const g=M.g;
  return (M.view==='laws'||M.view==='pv')&&(g.hold==='temperature'||g.hold==='pressureT'); }
function scaleBar(){ return false; }          /* PhET's tick scale belongs to Diffusion */
function dividerShown(){ return false; }      /* … and so does the divider */
function rulerOn(M){ return M.st.showWidth; }
function wallVelocity(){ return false; }      /* no working wall on these screens */
function counterOn(){ return true; }

/* An in-plot key or annotation, painted on a patch of the canvas ground first
   so a curve or a reference line running through it does not strike it through
   (the same trick plotNote uses).  Every in-plot label in this file goes
   through it: the display-list audit cannot see a line crossing text, and the
   rasterised PNGs showed three of them doing exactly that. */
function keyAt(ctx,W,H,x,y,txt,col,align){
  const t=plain(txt), w=t.length*10.5*0.52+8, right=align==='right';
  ctx.fillStyle='#070b18';
  ctx.fillRect(right?x-w-2:x-4,y-8,w+6,16);
  return lab(ctx,W,H,x,y,txt,col,SM_FONT,right?'right':'left','middle');
}
/* `where` picks the corner (or the middle of a side) the key sits in.  It has
   to be chosen per plot: the audit compares text with text, so a key sitting
   on the first 200 px of a curve is invisible to it, and the rasterised PNGs
   showed four of them doing exactly that.  Put the key where the data is not. */
function keyText(ctx,W,H,b,txt,col,where){
  const w=where||'tl', right=w[1]==='r';
  const y=w[0]==='b'?b.y1-10:(w[0]==='m'?b.y+b.h*0.45:b.y+10);
  return keyAt(ctx,W,H,right?b.x1-4:b.x+6,y,txt,col,right?'right':'left');
}

/* An empty panel still gets its frame: emptyNote alone leaves a sentence
   floating in blank canvas, which reads as a missing view rather than as a
   chart with nothing in it yet. */
function emptyPanel(ctx,W,H,b,txt){ frame(ctx,b,'#242a3a'); emptyNote(ctx,W,H,b,txt); }

function captionFor(M){
  const v=M.view;
  if(v==='intro') return ['Drawn to scale: the box is '+fmt(GAS.WMIN/1000,0)+'–'+fmt(GAS.WMAX/1000,0)+' nm wide, 8.75 nm tall and 4 nm deep; every disk is drawn at its true radius (heavy 125 pm, light 87.5 pm). Drag the grip on the left wall (the sim pauses, as PhET’s does), the knob on the lid, or the pump handle. The thermometer spans PhET’s 0–1000 K, the dial its 0–20,000 kPa. Left: the gauge against time. Right: the wall-hit rate the counter measures, against kinetic theory (orange, dashed without Z).',
                         'To scale; drag the wall grip, the lid knob or the pump handle.',
                         'To scale; drag the wall grip, the lid knob or the pump handle. A taller window adds the gauge and hit-rate traces.'];
  if(v==='laws') return ['The same box with PhET’s Hold Constant panel. Left: the two quantities that are free to move. Right: the one the hold is keeping still, as a departure from its value when the hold was engaged (parts per million) — flat means the controller did its job. A hold PhET cannot honour (T in an empty box, P past the container’s 5–15 nm range) drops back to Nothing and raises its Oops.',
                         'PhET’s Laws screen: hold one of P, V, T and watch the other two.',
                         'PhET’s Laws screen: hold one of P, V, T. A taller window adds the traces.'];
  if(v==='pv') return ['The same gas as the Laws screen, drawn as one point on the pressure–volume plane. The orange hyperbolas are isotherms at '+ISO_T.join(', ')+' K for the '+M.N+' disks now in the box (they move when you pump); the green line is the path this gas has actually taken, and the magenta dot is where it is. Volume is the full 3-D V = width × 8.75 nm × 4 nm, so the axis is linear in the width.',
                       'The Laws gas as a point on the P–V plane, over its isotherms.',
                       'The Laws gas on the P–V plane. A taller window draws the isotherms and the path.'];
  return ['The four named laws, measured by running this simulation. Each sweep engages PhET’s hold, steps the controlled variable to five targets, waits 2 ps, then counts wall hits for '+fmt(M.st.sWin,0)+' ps. Left: the law, measured points (green) on the exact line (orange) — exact because PhET DEFINES P = NkT/V, so what is being tested is the controller, not the law. Right: the wall-hit rate, which is not defined into existence: error bars are √n/t.',
          'The four laws, swept by the simulation: the law, and the hit rate.',
          'The four laws, swept by the simulation. A taller window adds the plots.'];
}

/* ================================================================== *
 *  the box (PhET's Intro screen) and the laws (PhET's Laws screen)    *
 * ================================================================== */
/* The seed point describes the state at t = 0, and an edit made while paused
   (a resize, the pump, erase) moves that state: re-seed it, or the lone marker
   on the plot contradicts the readout beside it.  (The same fix the
   gas-properties remake needed on its Ideal screen.) */
function reseedTrace(M){
  if(M.w.trace.length===1&&M.g.t===0){ M.w.trace.length=0; traceRecord(M.w); }
}
/* the traces, in the units the chips ask for */
function traceSeries(M){
  const st=M.st, atm=st.unitP!=='kPa', cel=st.unitT==='C';
  const t=[], P=[], T=[], V=[];
  for(const r of M.w.trace){ t.push(r[0]); T.push(cel?r[1]-273.15:r[1]); P.push(atm?r[2]*GAS.ATM_PER_KPA:r[2]); V.push(r[3]*M.g.H*M.g.D/1e9); }
  return {t,P,T,V,atm,cel};
}
function drawIntro(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M);
  reseedTrace(M);
  drawScene(ctx,W,H,M,G);
  const S=traceSeries(M), note=S.t.length<2?'run the clock to trace it':null;
  if(G.plots.length) plotSeries(ctx,W,H,G.plots[0],'the gauge, '+(S.atm?'atm':'kPa')+' (PhET’s noise and 0.75-ps refresh)','P, '+(S.atm?'atm':'kPa'),
    S.t,[{ys:S.P,col:COL.live,lw:1.3}],{xlab:'t, ps',note});
  if(G.plots.length>1) drawHitPlot(ctx,W,H,G.plots[1],M);
  drawOops(ctx,G,M,W,H);
  sceneCaption(ctx,G);
}
/* the measured wall-hit rate against kinetic theory, the one number on this
   screen that PhET's definitions do not force */
function drawHitPlot(ctx,W,H,b,M){
  const th=M.hitTh, id=M.hitId, r=M.hit;
  if(!r||r.n<1||th===null){ emptyPanel(ctx,W,H,b,'run the clock: the walls start counting'); return; }
  const hi=Math.max(th,id,r.rate+3*M.hitSd)*1.25, lo=0;
  axesR(ctx,b,0,1,lo,hi,{title:titleFor(b,'wall hits per ps: measured over the last '+fmt(r.t,1)+' ps, against kinetic theory','wall hits/ps'),
    ylab:'hits/ps',xticks:[],yticks:sparseTicks(lo,hi,b.h),xfmt:()=>'',yfmt:tickFmt(lo,hi,b.h)});
  const bar=(frac,v,col,lw,dash)=>polyline(ctx,b,[frac-0.13,frac+0.13],[v,v],0,1,lo,hi,col,lw||1.6,dash);
  bar(0.5,id,COL.ref,1.3,[5,4]);
  bar(0.5,th,COL.ref,1.8);
  /* the measurement and its Poisson error bar */
  const X=b.x+b.w*0.5, Yv=v=>b.y1-b.h*(clamp(v,lo,hi)-lo)/(hi-lo);
  ctx.strokeStyle=COL.pos; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(X,Yv(r.rate-M.hitSd)); ctx.lineTo(X,Yv(r.rate+M.hitSd));
  ctx.moveTo(X-7,Yv(r.rate-M.hitSd)); ctx.lineTo(X+7,Yv(r.rate-M.hitSd));
  ctx.moveTo(X-7,Yv(r.rate+M.hitSd)); ctx.lineTo(X+7,Yv(r.rate+M.hitSd)); ctx.stroke();
  dot(ctx,X,Yv(r.rate),5,COL.pos,'#070b18',1);
  /* clear of the bars, which span 0.37-0.63 of the box, and on a background
     patch so the bar itself does not strike the text through */
  keyAt(ctx,W,H,b.x+b.w*0.69,Yv(th),'theory, with Z',COL.ref,'left');
  keyAt(ctx,W,H,b.x+b.w*0.69,Yv(id),'Z = 1',COL.ref,'left');
  keyAt(ctx,W,H,b.x+b.w*0.31,Yv(r.rate),fmt(r.rate,2)+' ± '+fmt(M.hitSd,2),COL.pos,'right');
  keyText(ctx,W,H,b,r.n+' hits counted',COL.dim,'tl');
  /* Kinetic theory assumes the gas fills the box uniformly.  PhET's pump does
     not: it puts every new particle at one point, and until that batch has
     spread the measured rate is the rate of a clump.  Say so rather than let
     the reader think the theory is wrong. */
  if(M.hitSd&&Math.abs(r.rate-th)>3*M.hitSd)
    keyAt(ctx,W,H,b.x+6,b.y+24,titleFor(b,'measured and theory are '+fmt(Math.abs(r.rate-th)/M.hitSd,1)
      +' σ apart — the gas may not be uniform yet','not uniform yet: '+fmt(Math.abs(r.rate-th)/M.hitSd,1)+' σ'),COL.ref,'left');
}
function drawLaws(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M);
  reseedTrace(M);
  drawScene(ctx,W,H,M,G);
  const S=traceSeries(M), g=M.g, note=S.t.length<2?'run the clock to trace it':null;
  if(G.plots.length){
    /* the two free quantities, each scaled to its own value at t = 0 so both
       fit one axis: the point of the screen is which one stays flat */
    const h=g.hold, series=[];
    const norm=arr=>{ const a=arr.find(v=>isFinite(v)&&v!==0); return a?arr.map(v=>v/a):arr; };
    const PkPa=M.w.trace.map(r=>r[4]), TT=M.w.trace.map(r=>r[1]), VV=M.w.trace.map(r=>r[3]*g.H*g.D/1e9);
    /* Each series gets its own DASH as well as its own colour, because two of
       them coincide exactly whenever a hold makes them proportional: P and T
       at held V (Gay-Lussac), T and V at held P (Charles).  Drawn solid they
       hide one another and the law becomes invisible. */
    if(h!=='pressureV'&&h!=='pressureT') series.push({ys:norm(PkPa),col:COL.live,lw:2,name:'P'});
    if(h!=='temperature') series.push({ys:norm(TT),col:COL.pos,lw:1.7,dash:[7,3],name:'T'});
    if(h!=='volume') series.push({ys:norm(VV),col:COL.struct,lw:1.5,dash:[2,4],name:'V'});
    plotSeries(ctx,W,H,G.plots[0],'the quantities that are free, each over its value at t = 0','the free quantities',
      S.t,series,{refs:[{y:1,col:COL.ref,dash:[5,4],lw:1.1}],xlab:'t, ps',note});
    const b=G.plots[0];
    let y=b.y+10;
    for(const s of series){ keyAt(ctx,W,H,b.x1-4,y,s.name,s.col,'right'); y+=13; }
    /* With P held, V/T is constant, so the two normalised curves are the SAME
       line — which is Charles's law, and worth saying rather than hiding one
       curve under the other (V is drawn dashed so both are visible). */
    const COINCIDE={pressureV:'T and V move together: that IS Charles’s law',
                    pressureT:'P and V move together at fixed T and N',
                    volume:'P and T move together: that IS Gay-Lussac’s law',
                    temperature:'P and V move oppositely: that IS Boyle’s law'};
    if(COINCIDE[h]&&series.length===2) keyText(ctx,W,H,b,COINCIDE[h],COL.dim,'tl');
    if(!series.length) emptyNote(ctx,W,H,b,'everything is held');
  }
  if(G.plots.length>1){
    const b=G.plots[1], h=g.hold;
    if(h==='nothing') emptyPanel(ctx,W,H,b,'hold one of P, V or T to watch it stay still');
    else {
      const inv=M.w.trace.map(r=>{ const V=r[3]*g.H*g.D/1e9, T=r[1], P=r[4];
        return h==='volume'?P/T:h==='temperature'?P*V:h==='pressureV'?V/T:M.N*T; });
      const base=inv.find(v=>isFinite(v)&&v!==0);
      const ppm=inv.map(v=>base?1e6*(v/base-1):NaN);
      let worst=0; for(const v of ppm) if(isFinite(v)) worst=Math.max(worst,Math.abs(v));
      /* Auto-ranging on a residual that is pure rounding gives an axis a
         thousandth of a ppm wide, whose four-decimal ticks all print as
         "-0.0000".  Below a thousandth of a ppm, fix the axis there instead:
         the trace is a flat line on zero and the ticks are readable. */
      const flat=worst<1e-4;
      plotSeries(ctx,W,H,b,'the held invariant, '+(M.inv?M.inv[0]:'')+', in parts per million of its first value','the invariant, ppm',
        S.t,[{ys:ppm,col:COL.pos}],{refs:[{y:0,col:COL.ref,dash:[5,4]}],xlab:'t, ps',note,
          y0:flat?-1e-3:undefined, y1:flat?1e-3:undefined});
      keyText(ctx,W,H,b,flat?'flat to '+worst.toExponential(1)+' ppm — the controller is exact to rounding'
        :'worst departure '+worst.toExponential(1)+' ppm (PhET rounds the held-P width to 5 decimals)',COL.dim,'tl');
    }
  }
  drawOops(ctx,G,M,W,H);
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  P against V — the Laws screen's gas as a point on the P-V plane    *
 * ================================================================== */
function pvRange(M){
  const g=M.g, V0=GAS.WMIN*g.H*g.D/1e9, V1=GAS.WMAX*g.H*g.D/1e9;
  let hi=Math.max(M.P,M.N&&M.T?gasPressureOf(M.N,M.T,GAS.WMIN*g.H*g.D):0);
  for(const r of M.w.trace) if(isFinite(r[4])&&r[4]>hi) hi=r[4];
  /* an empty box has no pressure at all, and auto-ranging on nothing gives a
     0.01 atm axis that means nothing: fall back to the scale the default gas
     would set, so the plane still reads as the plane */
  if(!(hi>0)) hi=gasPressureOf(100,GAS.T0,GAS.WMIN*g.H*g.D);
  return {V0,V1,P1:hi*1.15};
}
function drawPV(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M);
  reseedTrace(M);
  drawScene(ctx,W,H,M,G);
  if(G.plots.length){
    const b=G.plots[0], g=M.g, R=pvRange(M), atm=M.st.unitP!=='kPa', cv=v=>atm?v*GAS.ATM_PER_KPA:v;
    const y1=cv(R.P1);
    axesR(ctx,b,R.V0,R.V1,0,y1,{title:titleFor(b,M.N?'the state on the pressure–volume plane, over the isotherms of these '+M.N+' disks'
        :'the pressure–volume plane — there is no gas in the box yet','P against V'),
      xlab:'V, nm³',ylab:'P, '+(atm?'atm':'kPa'),
      xticks:sparseTicks(R.V0,R.V1,b.w),yticks:sparseTicks(0,y1,b.h),
      xfmt:tickFmt(R.V0,R.V1,b.w),yfmt:tickFmt(0,y1,b.h)});
    /* the isotherms: P = NkT/V for the disks now in the box */
    if(M.N){
      for(const T of ISO_T){
        const iso=pvIsotherm(M.N,T,R.V0,R.V1,80), xs=iso.xs, ys=iso.ys.map(cv);
        polyline(ctx,b,xs,ys,R.V0,R.V1,0,y1,COL.ref,1.3);
        /* Label the isotherm where it first comes inside the box.  A hot
           isotherm may only clip the top right corner, and the label then has
           to hang to the LEFT of its entry point or it falls off the canvas —
           without that the hottest curve was drawn with no label at all. */
        let li=-1;
        for(let i=0;i<xs.length;i++) if(ys[i]<=y1*0.94){ li=i; break; }
        if(li<0) for(let i=0;i<xs.length;i++) if(ys[i]<=y1){ li=i; break; }
        if(li>=0){
          const right=li>xs.length*0.85;
          lab(ctx,W,H,b.x+b.w*(xs[li]-R.V0)/(R.V1-R.V0)+(right?-5:5),b.y1-b.h*ys[li]/y1-8,
              T+' K',COL.ref,SM_FONT,right?'right':'left','middle');
        }
      }
    }
    /* the path this gas has taken, and where it is now */
    const tr=M.w.trace.filter(r=>isFinite(r[4])&&r[4]>0);
    if(tr.length>1) polyline(ctx,b,tr.map(r=>r[3]*g.H*g.D/1e9),tr.map(r=>cv(r[4])),R.V0,R.V1,0,y1,COL.pos,1.8);
    else emptyNote(ctx,W,H,b,M.N?'run the clock, then hold something and heat or squeeze'
      :'pump some gas in, then hold something and heat or squeeze');
    if(M.N&&isFinite(M.P)) marker(ctx,b,R.V0,R.V1,0,y1,M.V,cv(M.P),COL.live);
    /* every isotherm falls from the top left to the bottom right and the 1000 K
       one clips the top right corner, so the bottom left — under the coldest
       isotherm — is the only corner that is always clear */
    keyText(ctx,W,H,b,'isotherms orange · the path green · now magenta',COL.dim,'bl');
  }
  drawOops(ctx,G,M,W,H);
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  the four laws — swept by running the simulation                    *
 * ================================================================== */
/* the exact response the law demands at the swept value x, built from the
   base state the sweep started in (N0, T0, W0 and the pressure then) */
function sweepExactY(S,x,g){
  const V0=S.W0pm*g.H*g.D;
  if(S.law==='boyle')   return gasPressureOf(S.N0,S.T0,x*1e9);
  if(S.law==='charles') return S.N0*GAS.K*x/(S.P0/GAS.P_SCALE)/1e9;
  if(S.law==='gay')     return gasPressureOf(S.N0,x,V0);
  return (S.P0/GAS.P_SCALE)*V0/(x*GAS.K);
}
/* the state the gas is in at the swept value x: [N, T, W] */
function sweepStateAt(S,x,g){
  const V0=S.W0pm*g.H*g.D;
  if(S.law==='boyle')   return [S.N0,S.T0,x*1e9/(g.H*g.D)];
  if(S.law==='charles') return [S.N0,x,S.N0*GAS.K*x/(S.P0/GAS.P_SCALE)/(g.H*g.D)];
  if(S.law==='gay')     return [S.N0,x,S.W0pm];
  return [x,(S.P0/GAS.P_SCALE)*V0/(x*GAS.K),S.W0pm];
}
/* which corner each law's plots leave free (Boyle and Avogadro decay away from
   the top right; Charles and Gay-Lussac rise away from the top left) */
const SWEEP_KEY={boyle:'tr', avo:'tr', charles:'tl', gay:'tl'};
function sweepXRange(S,g){
  if(S.law==='boyle')   return [GAS.WMIN*g.H*g.D/1e9,GAS.WMAX*g.H*g.D/1e9];
  if(S.law==='avo')     return [S.targets[0]*0.85,S.targets[S.targets.length-1]*1.08];
  const lo=Math.min.apply(null,S.targets), hi=Math.max.apply(null,S.targets);
  return [lo-(hi-lo)*0.12,hi+(hi-lo)*0.12];
}
function drawSweep(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M), g=M.g, S=M.S, L=lawOf(M.st.law);
  drawScene(ctx,W,H,M,G);
  if(!G.plots.length){ sceneCaption(ctx,G); return; }
  if(!S){
    emptyPanel(ctx,W,H,G.plots[0],'press “run the sweep” to measure '+L.name+'’s law');
    if(G.plots.length>1) emptyPanel(ctx,W,H,G.plots[1],'the wall-hit rate is measured at each step');
    sceneCaption(ctx,G); return;
  }
  const atm=M.st.unitP!=='kPa', cvP=v=>atm?v*GAS.ATM_PER_KPA:v;
  const yIsP=(S.law==='boyle'||S.law==='gay');
  const cv=v=>yIsP?cvP(v):v;
  const xr=sweepXRange(S,g);
  /* ---- the law ---- */
  {
    const b=G.plots[0];
    const xs=[], ys=[];
    for(let i=0;i<=120;i++){ const x=xr[0]+(xr[1]-xr[0])*i/120; if(x<=0) continue; xs.push(x); ys.push(cv(sweepExactY(S,x,g))); }
    let lo=Infinity, hi=-Infinity;
    for(const v of ys) if(isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; }
    for(const p of S.pts){ const v=cv(p.y); if(v<lo) lo=v; if(v>hi) hi=v; }
    if(!(hi>lo)){ lo=0; hi=1; }
    const pad=0.10*(hi-lo), y0=Math.max(0,lo-pad), y1=hi+pad;
    const XL={boyle:'V, nm³',charles:'T, K',gay:'T, K',avo:'N, particles'}[S.law];
    const YL={boyle:'P, '+(atm?'atm':'kPa'),charles:'V, nm³',gay:'P, '+(atm?'atm':'kPa'),avo:'T, K'}[S.law];
    axesR(ctx,b,xr[0],xr[1],y0,y1,{title:titleFor(b,L.name+'’s law: the measured points on the exact line '+L.inv+' = constant',L.name+'’s law'),
      xlab:XL,ylab:YL,xticks:sparseTicks(xr[0],xr[1],b.w),yticks:sparseTicks(y0,y1,b.h),
      xfmt:tickFmt(xr[0],xr[1],b.w),yfmt:tickFmt(y0,y1,b.h)});
    polyline(ctx,b,xs,ys,xr[0],xr[1],y0,y1,COL.ref,1.8);
    for(const p of S.pts) marker(ctx,b,xr[0],xr[1],y0,y1,p.x,cv(p.y),COL.pos);
    if(!S.done&&S.targets[S.i]!==undefined){
      const xn=S.law==='boyle'?S.targets[S.i]*g.H*g.D/1e9:S.targets[S.i];
      polyline(ctx,b,[xn,xn],[y0,y1],xr[0],xr[1],y0,y1,COL.live,1,[3,4]);
    }
    /* Boyle and Avogadro fall left-to-right, Charles and Gay-Lussac rise, so
       there is no one corner that is clear for all four: put the key in the
       corner the curve is running away from. */
    keyText(ctx,W,H,b,'exact orange · measured green',COL.dim,SWEEP_KEY[S.law]);
  }
  /* ---- the wall-hit rate, which nothing defines into existence ---- */
  if(G.plots.length>1){
    const b=G.plots[1];
    const xs=[], th=[], id=[];
    for(let i=0;i<=120;i++){ const x=xr[0]+(xr[1]-xr[0])*i/120; if(x<=0) continue;
      const st2=sweepStateAt(S,x,g), c=[Math.round(st2[0]),0], rad=[g.species[0].r,g.species[1].r], ms=[g.species[0].m,g.species[1].m];
      const a=hitRateOf(c,rad,ms,st2[2],g.H,st2[1],true), bqq=hitRateOf(c,rad,ms,st2[2],g.H,st2[1],false);
      xs.push(x); th.push(a===null?NaN:a); id.push(bqq===null?NaN:bqq); }
    let lo=Infinity, hi=-Infinity;
    for(const arr of [th,id]) for(const v of arr) if(isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; }
    for(const p of S.pts) if(p.rate!==null){ const e=Math.sqrt(p.n)/p.t;
      if(p.rate-e<lo) lo=p.rate-e; if(p.rate+e>hi) hi=p.rate+e; }
    if(!(hi>lo)){ lo=0; hi=1; }
    const y0=Math.max(0,lo-0.12*(hi-lo)), y1=hi+0.12*(hi-lo);
    const XL={boyle:'V, nm³',charles:'T, K',gay:'T, K',avo:'N, particles'}[S.law];
    axesR(ctx,b,xr[0],xr[1],y0,y1,{title:titleFor(b,'wall hits per ps: measured (√n/t bars) against 2 n Z ⟨v⟩/π (a + b)','wall hits/ps'),
      xlab:XL,ylab:'hits/ps',xticks:sparseTicks(xr[0],xr[1],b.w),yticks:sparseTicks(y0,y1,b.h),
      xfmt:tickFmt(xr[0],xr[1],b.w),yfmt:tickFmt(y0,y1,b.h)});
    polyline(ctx,b,xs,id,xr[0],xr[1],y0,y1,COL.ref,1.2,[5,4]);
    polyline(ctx,b,xs,th,xr[0],xr[1],y0,y1,COL.ref,1.8);
    for(const p of S.pts){
      if(p.rate===null) continue;
      const e=Math.sqrt(p.n)/p.t, X=b.x+b.w*(p.x-xr[0])/(xr[1]-xr[0]);
      const Yv=v=>b.y1-b.h*(clamp(v,y0,y1)-y0)/(y1-y0);
      ctx.strokeStyle=COL.pos; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(X,Yv(p.rate-e)); ctx.lineTo(X,Yv(p.rate+e));
      ctx.moveTo(X-4,Yv(p.rate-e)); ctx.lineTo(X+4,Yv(p.rate-e));
      ctx.moveTo(X-4,Yv(p.rate+e)); ctx.lineTo(X+4,Yv(p.rate+e)); ctx.stroke();
      marker(ctx,b,xr[0],xr[1],y0,y1,p.x,p.rate,COL.pos);
    }
    if(!S.pts.length) emptyNote(ctx,W,H,b,'counting…');
    keyText(ctx,W,H,b,'with Z solid · Z = 1 dashed',COL.ref,SWEEP_KEY[S.law]);
  }
  drawOops(ctx,G,M,W,H);
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='intro') drawIntro(ctx,W,H,M);
  else if(M.view==='laws') drawLaws(ctx,W,H,M);
  else if(M.view==='pv') drawPV(ctx,W,H,M);
  else drawSweep(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame of model time; false when nothing moves (paused, or the wall
     being dragged, which PhET pauses) */
  S.step=function(){
    if(!ST.running) return false;
    const w=worldOf(ST.view);
    if(ST.view!=='sweep'&&w.dragW!==null) return false;
    const changed=worldStep(w,ST,viewDt());
    if(changed&&S.onCounts) S.onCounts();
    return true;
  };
  /* PhET's step button: one model step of MODEL_TIME_STEP = 0.2 ps */
  S.stepOnce=function(){ const w=worldOf(ST.view); worldStep(w,ST,GAS.STEP); if(S.onCounts) S.onCounts(); };
  S.pointer=function(type,x,y){
    const M=buildModel(), w=M.w, g=M.g;
    if(type==='up'){
      const had=DRAG.what!==null;
      if(DRAG.what==='wall'&&w.dragW!==null){
        gasResize(g,w.dragW,true); w.dragW=null; g.counter.on=false; gasRefresh(g);
      }
      DRAG.what=null; return had;
    }
    const ctx=canvas.getContext('2d'), G=viewGeo(ctx,S.W,S.H,M);
    const inR=r=>r&&x>=r.x-5&&x<=r.x+r.w+5&&y>=r.y-5&&y<=r.y+r.h+5;
    if(type==='down'){
      g.oops=null;
      if(wallDraggable(M)&&inR(G.handle)){ DRAG.what='wall'; DRAG.off=x-G.xL; w.dragW=g.W; return true; }
      if(lidDraggable(M)&&inR(G.lidKnob)){ DRAG.what='lid'; DRAG.off=x-G.lidX; return true; }
      if(G.pumpHandle&&inR(G.pumpHandle)){ DRAG.what='pump'; DRAG.y0=y; DRAG.h0=w.pump.h; return true; }
      return false;
    }
    if(type==='move'){
      if(DRAG.what==='wall'){ w.dragW=clamp(Math.round(-G.wx(x-DRAG.off)/10)*10,g.wRange[0],g.wRange[1]); return true; }
      if(DRAG.what==='lid'){ gasSetLid(g,G.wx(x-DRAG.off)-(g.left-GAS.WALL)); return true; }
      if(DRAG.what==='pump'){
        /* a full stroke down pumps 50 (PhET's numberOfParticlesPerPumpAction) */
        const hNew=clamp(DRAG.h0+(y-DRAG.y0)/G.pump.travel,0,1), dh=hNew-w.pump.h;
        if(dh>0){ w.pump.acc+=dh*50; const k=Math.floor(w.pump.acc+1e-9);
          if(k>0){ w.pump.acc-=k; gasInject(g,ST.pump==='light'?1:0,k); if(!ST.running) gasRefresh(g); if(S.onCounts) S.onCounts(); } }
        w.pump.h=hNew; return true;
      }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));
  const W_=()=>worldOf(st.view), G_=()=>W_().g;

  function setView(k){
    st.view=k; DRAG.what=null;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncCounts(); syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab)); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg,onrelease){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ clearOops(); st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    if(onrelease) inp.addEventListener('change',()=>{ onrelease(); sync(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ clearOops(); st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        if(c.disabled) return;
        clearOops(); st[key]=o.id; if(onPick) onPick(o);
        syncChips(); syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(el,list,key){ CHIPROWS.push([el,list,key]); }
  function button(lab,fn){ return h('button',{onclick:()=>{ clearOops(); fn(); syncCounts(); syncChips(); syncPanel(); dirty=true; refresh(); }},lab); }
  /* an action dismisses the Oops on screen BEFORE it acts, so one it raises
     itself (erasing while T is held) is the one the user sees */
  function clearOops(){ const w=WORLD[worldKey(st.view)]; if(w) w.g.oops=null; }
  /* the model changed without time passing: PhET's updateWhenPaused */
  const touched=()=>{ const g=G_(); if(!st.running) gasRefresh(g); };

  /* ---- the particles ---- */
  const gPart=h('div',{class:'grp'},h('h3',null,'the particles'));
  gPart.appendChild(slider('nH','heavy (28 AMU)',0,GAS.NMAX,1,v=>fmt(v,0),()=>{ gasSetCount(G_(),0,st.nH); touched(); syncCounts(); }));
  gPart.appendChild(slider('nL','light (4 AMU)',0,GAS.NMAX,1,v=>fmt(v,0),()=>{ gasSetCount(G_(),1,st.nL); touched(); syncCounts(); }));
  const pumpChips=chipRow(PUMPS,'pump'); gPart.appendChild(h('div',{class:'tag'},'the pump (drag its handle) pumps:')); gPart.appendChild(pumpChips); trackChips(pumpChips,PUMPS,'pump');
  gPart.appendChild(h('div',{class:'btnrow'},button('erase particles',()=>{ gasRemoveAll(G_()); touched(); })));
  const partTag=h('div',{class:'tag'}); gPart.appendChild(partTag);

  /* ---- hold constant (the Laws screen only: PhET's hasHoldConstantFeature) ---- */
  const gHold=h('div',{class:'grp'},h('h3',null,'hold constant'));
  const holdChips=chipRow(HOLDS,'hold',o=>{ const g=G_(); if(!gasSetHold(g,o.id)) st.hold=g.hold; });
  gHold.appendChild(holdChips); trackChips(holdChips,HOLDS,'hold');
  const holdTag=h('div',{class:'tag'}); gHold.appendChild(holdTag);

  /* ---- heat / cool: PhET's slider snaps back to zero when released ---- */
  const gHeat=h('div',{class:'grp'},h('h3',null,'heat / cool'));
  gHeat.appendChild(slider('heat','cool ← → heat',-1,1,0.01,v=>(v>0?'+':'')+fmt(v,2),null,()=>{ st.heat=0; }));
  const heatTag=h('div',{class:'tag'}); gHeat.appendChild(heatTag);

  /* ---- the container ---- */
  const gBox=h('div',{class:'grp'},h('h3',null,'the container'));
  const lidBtn=h('div',{class:'btnrow'},button('return lid',()=>{ gasReturnLid(G_()); touched(); }));
  gBox.appendChild(lidBtn);
  const boxTag=h('div',{class:'tag'}); gBox.appendChild(boxTag);

  /* ---- the sweep ---- */
  const gSweep=h('div',{class:'grp'},h('h3',null,'sweep a law'));
  const lawChips=chipRow(LAWS,'law',()=>{ W_().sweep=null; });
  gSweep.appendChild(lawChips); trackChips(lawChips,LAWS,'law');
  const restartS=()=>{ const w=W_(); w.sweep=null; resetWorld('sweep'); };
  gSweep.appendChild(slider('sN','disks at the start',20,400,10,v=>fmt(v,0),restartS));
  gSweep.appendChild(slider('sT','temperature at the start, K',100,600,50,v=>fmt(v,0)+' K',restartS));
  gSweep.appendChild(slider('sWin','counting window, ps',5,60,5,v=>fmt(v,0)+' ps'));
  const runBtn=h('button',{onclick:()=>{ clearOops(); const w=W_();
    if(w.sweep&&!w.sweep.done) w.sweep=null; else { sweepStart(w,st); st.running=true; }
    syncCounts(); syncChips(); syncPanel(); dirty=true; refresh(); }},'run the sweep');
  gSweep.appendChild(h('div',{class:'btnrow'},runBtn));
  const sweepTag=h('div',{class:'tag'}); gSweep.appendChild(sweepTag);

  /* ---- tools ---- */
  const gTools=h('div',{class:'grp'},h('h3',null,'tools'));
  const cbCounter=checkbox('showCounter','collision counter');
  gTools.appendChild(h('div',{class:'checks'},checkbox('showWidth','width'),checkbox('showWatch','stopwatch'),cbCounter));
  const watchBtns=h('div',{class:'btnrow'},button('stopwatch start / stop',()=>{ const g=G_(); g.watch.on=!g.watch.on; }),
                                           button('reset',()=>{ const g=G_(); g.watch.on=false; g.watch.t=0; }));
  gTools.appendChild(watchBtns);
  const counterBtns=h('div',{class:'btnrow'},button('count wall hits',()=>{ const g=G_(); g.counter.on=true; g.counter.count=0; g.counter.t=0; g.counter.period=st.period; }));
  gTools.appendChild(counterBtns);
  const periodChips=chipRow(PERIODS,'period',()=>{ const g=G_(); g.counter.on=false; g.counter.count=0; g.counter.t=0; g.counter.period=st.period; });
  gTools.appendChild(periodChips); trackChips(periodChips,PERIODS,'period');
  const unitTChips=chipRow(UNITS_T,'unitT'), unitPChips=chipRow(UNITS_P,'unitP');
  gTools.appendChild(unitTChips); trackChips(unitTChips,UNITS_T,'unitT');
  gTools.appendChild(unitPChips); trackChips(unitPChips,UNITS_P,'unitP');
  gTools.appendChild(h('div',{class:'checks'},checkbox('noise','pressure noise (PhET’s gauge jitter)',()=>{ G_().noiseOn=st.noise; })));

  /* ---- time ---- */
  const gRun=h('div',{class:'grp'},h('h3',null,'time'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  gRun.appendChild(h('div',{class:'btnrow'},button('step 0.2 ps',()=>{ S.stepOnce(); }),
    button('reset this view',()=>{ resetView(); })));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Gases Intro (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. '
      +'PhET&rsquo;s constants are read from its published build; the hard-disk engine is the one documented in build/gas-properties/ENGINE.md, and everything this sim adds &mdash; the one-sided flux, the wall-hit rate, the hard-disk contact measure and the four laws&rsquo; invariants &mdash; is derived in build/gases-intro/derive.py with scipy and pinned in selfTest.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gPart,gHold,gHeat,gBox,gSweep,gTools,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function resetView(){
    const v=st.view;
    if(v==='sweep'){ st.law=st.law; resetWorld('sweep'); WORLD.sweep.sweep=null; }
    else { st.heat=0; st.hold='nothing'; resetWorld(v); }
  }
  function syncCounts(){
    const g=G_(); st.nH=gasCount(g,0); st.nL=gasCount(g,1); st.hold=g.hold;
    if(rows.nH){ rows.nH.sync(); rows.nL.sync(); }
  }
  S.onCounts=()=>{ syncCounts(); };
  function syncChips(){
    for(const [cw,list,key] of CHIPROWS)
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')+(b.disabled?' off':''));
  }
  function syncPanel(){
    const v=st.view, g=G_(), sweepV=(v==='sweep');
    gPart.hidden=sweepV; gHold.hidden=!(v==='laws'||v==='pv'); gHeat.hidden=sweepV;
    gBox.hidden=sweepV; gSweep.hidden=!sweepV;
    st.hold=g.hold;
    /* PhET's enabling: T needs particles and a closed lid; P needs a pressure */
    [].forEach.call(holdChips.children,(b,i)=>{ const ok=gasHoldAllowed(g,HOLDS[i].id); b.disabled=!ok; b.style.opacity=ok?'1':'0.4'; });
    const locked=heaterLocked({view:v,g});
    rows.heat.inp.disabled=locked; rows.heat.row.style.opacity=locked?'0.45':'1';
    lidBtn.hidden=!(g.lid&&!g.lid.on);
    watchBtns.hidden=!st.showWatch;
    counterBtns.hidden=!st.showCounter; periodChips.hidden=!st.showCounter;
    const S2=WORLD.sweep?WORLD.sweep.sweep:null;
    runBtn.textContent=(S2&&!S2.done)?'stop the sweep':'run the sweep';
    for(const k in rows) rows[k].sync();
    partTag.innerHTML='a full stroke of the pump adds 50; at most '+GAS.NMAX+' of each';
    holdTag.innerHTML=g.hold==='pressureV'?'the wall moves to keep P: V = NkT/P':g.hold==='pressureT'?'the temperature follows to keep P: T = PV/Nk':g.hold==='temperature'?'the heater is locked and the lid is shut':g.hold==='volume'?'the wall is locked':'change N, T or V and P answers';
    heatTag.innerHTML='PhET&rsquo;s heater scales every speed by 1 + a/800 per 60-fps frame; the slider springs back to zero when you let go';
    boxTag.innerHTML=g.lid&&g.lid.on?(gasLidOpen(g)?'the lid is open '+fmt(gasOpening(g)/1000,2)+' nm: particles that reach the gap leave':'drag the knob on the lid to open it'):'the lid blew off (P &gt; 20,000 kPa): return it';
    sweepTag.innerHTML='each step settles 2 ps, then counts wall hits for '+fmt(st.sWin,0)+' ps; the sweep runs '+SWEEP_BATCH+' model frames a frame so it takes seconds, not a minute';
    runTag.innerHTML='space runs/pauses &nbsp; <b>s</b> steps 0.2 ps &nbsp; <b>r</b> resets this view &nbsp; 1&ndash;4 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='sweep'?'press run the sweep · space pauses · 1–4 switch views'
        :'drag the wall grip, the lid knob or the pump · space pauses · 1–4 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncCounts(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncCounts(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='s'){ S.stepOnce(); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ resetView(); syncCounts(); syncChips(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0, lastHold=null, lastPhase=null;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        const g=G_();
        if(advanced&&frameN%10===0){ roEl.innerHTML=readoutHTML(S.model()); eqEl.innerHTML=eqbarHTML(S.model()); tagEl.innerHTML=tagHTML(S.model()); }
        /* a model-side change of the hold (an Oops) re-enables the panel; so
           does the sweep finishing */
        const S2=WORLD.sweep?WORLD.sweep.sweep:null, ph=S2?(S2.done?'done':S2.phase+S2.i):null;
        if(g.hold!==lastHold||ph!==lastPhase){ lastHold=g.hold; lastPhase=ph; st.hold=g.hold; syncChips(); syncPanel(); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncCounts(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  intro:'PhET&rsquo;s Intro screen. A box of hard disks &mdash; heavy ones like nitrogen (28 AMU) and light ones like helium (4 AMU) &mdash; bouncing off each '
    +'other and the walls without losing any energy. Pump some in, heat or cool them from below, slide the left wall, or open the lid and watch the fast ones escape first. '
    +'The thermometer reads PhET&rsquo;s temperature, T = (2/3)&lang;KE&rang;/k, and the gauge PhET&rsquo;s pressure, P = NkT/V: both are <i>definitions</i>, so PV = NkT here is arithmetic, not a discovery. '
    +'The collision counter is different. Nothing defines how often the disks hit the walls; that follows from how fast they move and how much room they have, and kinetic theory says the rate is '
    +'2 n Z &lang;v&rang;/&pi; (a + b). The plot on the right compares the two, with the counting error shown, and the dashed line is what the rate would be if the disks never met each other.',
  laws:'PhET&rsquo;s Laws screen: the same box, plus the Hold Constant panel. The whole point of the screen is that PV = NkT has three free quantities and you may only fix one at a time. '
    +'Hold V and heat: P climbs with T (Gay-Lussac). Hold T and squeeze: P climbs as 1/V (Boyle). Hold P and heat: the wall walks out, V in step with T (Charles). Hold P and pump: '
    +'the temperature falls to make room (Avogadro, at fixed P and V). The left plot shows the quantities that are still free, each divided by its value when you started, so the one that '
    +'stays flat is the one being held. The right plot is the held invariant itself, in parts per million &mdash; that is the controller&rsquo;s own arithmetic error, and it should be a flat line at zero. '

       a π/2 fan CENTRED ON π (pointing left into the box).  2000 draws put the
       extremes within FAN/2000 of the ends, which pins the fan's width and its
       centre absolutely rather than merely bounding them. */
    const g=gasMake({seed:77,collisions:false});
    eq(gasInject(g,0,2000,300),GAS.NMAX,'the pump stops at 1000 per species');
    let lo=Infinity, hi=-Infinity, wrongPlace=0;
    for(let i=0;i<g.n;i++){ const a=Math.atan2(g.vy[i],g.vx[i]), th=a<0?a+TAU:a;
      if(th<lo) lo=th; if(th>hi) hi=th;
      if(g.x[i]!==-125||g.y[i]!==REF.entryY) wrongPlace++; }
    eq(wrongPlace,0,'every one of the 1000 entered at (−r, H/5) = (−125, '+REF.entryY+')');
    close(hi-lo,GAS.FAN,4*GAS.FAN/GAS.NMAX,'1000 injections span the whole π/2 fan ('+fmt(hi-lo,4)+' rad)');
    close((hi+lo)/2,PI,4*GAS.FAN/GAS.NMAX,'… centred on π, pointing left into the box');
    close(GAS.FAN,PI/2,1e-15,'the fan is π/2 wide (PhET’s DISPERSION_ANGLE)');
    ok(lo>=PI-GAS.FAN/2-1e-12&&hi<=PI+GAS.FAN/2+1e-12,'… and nothing was aimed outside it');
    /* collisions off: PhET gives every injected particle exactly √(3kT/m) */
    let same=true;
    for(let i=0;i<g.n;i++) if(Math.abs(gasSpeed(g,i)-mbRmsSpeed(28,gasKT2(300)))>1e-9) same=false;
    ok(same,'collisions off: every injected particle is at exactly √(3kT/m) = '+fmt(REF.vRms_heavy,3)+' m/s (derive)');
    rel(gasSpeed(g,0),REF.vRms_heavy,1e-12,'… pinned absolutely, not just to itself'); }
  { /* collisions ON: PhET spreads the injection temperatures (σ = 0.2 T) but
       restores the mean exactly, so a pump stroke does not shift T */
    const g=gasMake({seed:88});
    gasInject(g,0,200,437);
    rel(gasTemp(g),437,1e-13,'collisions on: 200 injected at 437 K leave T at exactly 437 (the Gaussian mean is restored)');
    let spread=0; const v0=mbRmsSpeed(28,gasKT2(437));
    for(let i=0;i<g.n;i++) spread=Math.max(spread,Math.abs(gasSpeed(g,i)/v0-1));
    ok(spread>0.05,'… but the individual speeds ARE spread (worst '+fmt(100*spread,1)+' % from √(3kT/m))');
    const g2=gasMake({seed:88}); gasInject(g2,0,200,437);
    gasInject(g2,0,200,437);
    rel(gasTemp(g2),437,1e-13,'… and a second stroke leaves it there too'); }
  rel(mbMeanSpeed(28,gasKT2(300)),REF.vMean_heavy,1e-14,'heavy ⟨v⟩ = 458.19 m/s (derive, scipy quad)');
  rel(mbMeanSpeed(4,gasKT2(300)),REF.vMean_light,1e-14,'light ⟨v⟩ = 1212.25 m/s (derive)');
  rel(mbRmsSpeed(28,gasKT2(300)),REF.vRms_heavy,1e-14,'the rms speed IS PhET’s injection speed √(3kT/m) (derive)');
  rel(Math.sqrt(gasKT2(300)/(2*PI*28)),REF.vxPlus_heavy,1e-14,'⟨v_x⁺⟩ = √(kT₂/2πm) = 145.846 m/s (derive, scipy quad)');
  rel(mbMeanSpeed(28,gasKT2(300))/PI,REF.vxPlus_heavy,1e-14,'… and it is exactly ⟨v⟩/π (derive)');
  rel(mbMeanSpeed(4,gasKT2(300))/PI,REF.vxPlus_light,1e-14,'… for the light disks too (derive)');
  rel(Math.sqrt(28/4),REF.graham,1e-15,'Graham’s √(m_heavy/m_light) (derive)');
  rel(hdB2(250),REF.b2,1e-14,'B₂ = πσ²/2 (derive)');
  rel(HD_B3_RATIO,REF.b3ratio,1e-15,'B₃/B₂² = 4/3 − √3/π = 0.78200 (derive)');
  rel(hdContact(GAS.WDEF-250,GAS.H-250,250),REF.contactM,1e-12,'the contact measure M, term by term against quadrature (derive)');
  rel(hdZ([100,0],[125,87.5],GAS.WDEF,GAS.H),REF.z100,1e-12,'Z of 100 heavy disks in the 10 nm box (derive)');
  rel(hdZ([50,0],[125,87.5],GAS.WDEF,GAS.H),REF.z50,1e-12,'… of 50 (derive)');
  rel(hdZ([200,0],[125,87.5],GAS.WDEF,GAS.H),REF.z200,1e-12,'… of 200 (derive)');
  ok(hdZ([1,0],[125,87.5],GAS.WDEF,GAS.H)===1,'one disk cannot crowd itself: Z = 1 exactly');
  { /* the engine writes the single-species Z twice — hdZ sums over pairs, hdZ1
       is the closed form for one species — so assert they agree, or a change to
       either is invisible (the identity, not a retyped formula) */
    for(const N of [2,50,100,400]){
      const a=GAS.WDEF-250, b=GAS.H-250;
      rel(hdZ([N,0],[125,87.5],GAS.WDEF,GAS.H),
          1+hdZ1(N,250,a,b)*(1+HD_B3_RATIO*hdB2(250)*N/(a*b)),1e-14,
          'hdZ and hdZ1 agree for '+N+' heavy disks'); } }

  /* ---------- C. the engine invariants this sim relies on ---------- */
  { /* the contact quadratic, at and around its branches.  The overlap test is
       the one with no margin: two disks that already overlap get NO event (they
       pass through, which is what lets the pump inject at one point), and a
       test written with any slack lets a hair-overlapping pair collide. */
    close(pairTime(0,500,0,-100,250),2.5,1e-15,'head-on: (500−250)/100 = 2.5 exactly');
    eq(pairTime(0,300,0,10,250),Infinity,'separating: no event');
    eq(pairTime(0,300,10,0,250),Infinity,'b = 0 (sliding past): no event');
    eq(pairTime(1000,300,-10,0,250),Infinity,'a miss: the discriminant is negative');
    eq(pairTime(0,200,0,-10,250),Infinity,'overlapping and approaching: no event (they pass through, as in PhET)');
    eq(pairTime(0,249.999,0,-10,250),Infinity,'overlapping by a HAIR (c = −0.5 pm²): still no event');
    eq(pairTime(0,250.0001,0,-10,250)<1e-4,true,'… and a hair apart it collides almost at once');
    ok(pairTime(0,250,0,-10,250)===Infinity||pairTime(0,250,0,-10,250)===0,'exactly touching is the boundary'); }
  { /* elastic pair collisions: momentum and energy to rounding, 5000 draws */
    const R=gasRng(4242); let wp=0, we=0;
    for(let q=0;q<5000;q++){
      const mi=1+39*R.next(), mj=1+39*R.next(), ri=60+200*R.next(), rj=60+200*R.next();
      const g=gasMake({seed:1,species:[{m:mi,r:ri},{m:mj,r:rj}]});
      const th=TAU*R.next(), s=ri+rj;
      gasPush(g,0,-5000,4000,300*(R.next()-0.5),300*(R.next()-0.5));
      gasPush(g,1,-5000+s*Math.cos(th),4000+s*Math.sin(th),300*(R.next()-0.5),300*(R.next()-0.5));
      const px0=mi*g.vx[0]+mj*g.vx[1], py0=mi*g.vy[0]+mj*g.vy[1], e0=gasKE(g,0)+gasKE(g,1);
      pairResolve(g,0,1);
      const px1=mi*g.vx[0]+mj*g.vx[1], py1=mi*g.vy[0]+mj*g.vy[1], e1=gasKE(g,0)+gasKE(g,1);
      const sc=Math.abs(px0)+Math.abs(py0)+1e-9;
      wp=Math.max(wp,(Math.abs(px1-px0)+Math.abs(py1-py0))/sc); we=Math.max(we,Math.abs(e1/e0-1));
    }
    ok(wp<1e-14,'5000 random pair collisions conserve momentum ('+wp.toExponential(1)+')');
    ok(we<1e-13,'… and energy ('+we.toExponential(1)+')'); }
  { /* the stationary wall flips one component exactly, and does no work */
    const g=gasMake({seed:5,noLid:true}); gasPush(g,0,-GAS.WDEF+130,4000,-400,250);
    const e0=gasEnergy(g); runFrames(g,24);
    rel(gasEnergy(g),e0,1e-15,'a stationary wall does no work: the energy is unchanged after 1 ps');
    ok(g.stats.wallHits>0,'… and it was struck ('+g.stats.wallHits+' times)'); }
  { /* no overlaps from the dynamics: 300 heavy disks, 3 ps, every pair each frame */
    const g=gasMake({seed:6,noLid:true}); gasFill(g,0,300,300);
    const eta=300*PI*125*125/(GAS.WDEF*GAS.H);
    let worst=Infinity;
    for(let f=0;f<72;f++){ gasStep(g,GAS.DT_FRAME);
      for(let i=0;i<g.n;i++) for(let j=i+1;j<g.n;j++){
        const d=Math.hypot(g.x[i]-g.x[j],g.y[i]-g.y[j])-(gasRad(g,i)+gasRad(g,j));
        if(d<worst) worst=d; } }
    ok(worst>-1e-6,'300 disks at area fraction '+fmt(eta,3)+' never overlap over 3 ps (closest approach '+worst.toExponential(1)+' pm)');
    const led=gasLedger(g); ok(Math.abs(led.resid)<=1e-12*Math.abs(led.E),'… and the energy ledger closes to '+(led.resid/led.E).toExponential(1)+' of the energy'); }

  /* ---------- D. the four laws, as the sweep measures them ---------- */
  for(let i=0;i<REF.boyleW.length;i++)
    rel(gasPressureOf(100,300,REF.boyleW[i]*GAS.H*GAS.D),REF.boyleP[i],1e-14,'Boyle: P at w = '+REF.boyleW[i]+' pm (derive)');
  rel(REF.boyleP[0]*REF.boyleW[0]*GAS.H*GAS.D/1e9,REF.boylePV,1e-14,'Boyle’s invariant P V (derive)');
  for(let i=0;i<REF.charlesT.length;i++)
    rel(100*GAS.K*REF.charlesT[i]/(REF.P100kPa/GAS.P_SCALE)/(GAS.H*GAS.D),REF.charlesW[i],1e-12,'Charles: the width at T = '+REF.charlesT[i]+' K (derive)');
  rel(REF.charlesTmin,150,1e-12,'the container’s 5 nm floor is T = 150 K at this P and N (derive)');
  rel(REF.charlesTmax,450,1e-12,'… and its 15 nm ceiling is 450 K (derive)');
  for(let i=0;i<REF.glT.length;i++)
    rel(gasPressureOf(100,REF.glT[i],REF.V10),REF.glP[i],1e-14,'Gay-Lussac: P at T = '+REF.glT[i]+' K (derive)');
  for(let i=0;i<REF.avN.length;i++)
    rel((REF.P100kPa/GAS.P_SCALE)*REF.V10/(REF.avN[i]*GAS.K),REF.avT[i],1e-12,'Avogadro: T at N = '+REF.avN[i]+' (derive)');
  rel(REF.avN[0]*REF.avT[0],REF.avNT,1e-13,'Avogadro’s invariant N T (derive)');
  /* the isotherms the P-V view draws, asserted off the model function that
     builds them, not off a formula retyped in the test */
  { const V0=GAS.WMIN*GAS.H*GAS.D/1e9, V1=GAS.WMAX*GAS.H*GAS.D/1e9;
    eq(ISO_T.join(','),'150,300,600,1000','the four isotherms the P-V view draws');
    for(let i=0;i<ISO_T.length;i++){
      const iso=pvIsotherm(100,ISO_T[i],V0,V1,2);
      eq(iso.xs.length,3,'three sample points at 5, 10 and 15 nm');
      close(iso.xs[1],GAS.WDEF*GAS.H*GAS.D/1e9,1e-9,'… the middle one is the 10 nm volume');
      for(const j of [0,1,2])
        rel(iso.ys[j],REF.isoP[i][j],1e-14,'the '+ISO_T[i]+' K isotherm at '+(5+5*j)+' nm (derive)');
    }
    const a=pvIsotherm(100,300,V0,V1,2), b2=pvIsotherm(200,300,V0,V1,2);
    for(const j of [0,1,2]) rel(b2.ys[j],2*a.ys[j],1e-14,'doubling N doubles the isotherm everywhere');
    const c2=pvIsotherm(100,600,V0,V1,2);
    for(const j of [0,1,2]) rel(c2.ys[j],2*a.ys[j],1e-14,'… and so does doubling T'); }

  /* ---------- E. the heater, exactly PhET's per-frame factor ---------- */
  { const g=gasMake({seed:8,noLid:true}); gasFill(g,0,80,300); g.heat=1;
    const want=REF.heatStep;
    gasStep(g,GAS.DT_FRAME);
    rel(gasTemp(g),300*want*want,1e-12,'one frame at full heat multiplies T by (1 + 1/800)² (derive)');
    let t=GAS.DT_FRAME; while(gasTemp(g)<1000&&t<200){ gasStep(g,GAS.DT_FRAME); t+=GAS.DT_FRAME; }
    close(t,REF.heatTime300to1000,GAS.DT_FRAME*1.01,'300 K → 1000 K at full heat takes 20.08 ps (derive)');
    g.heat=-1; const T1=gasTemp(g); gasStep(g,GAS.DT_FRAME);
    rel(gasTemp(g),T1*(1-1/800)*(1-1/800),1e-12,'and cooling is the same factor the other way'); }

  /* ---------- F. the wall-hit rate: the one measurement PhET's definitions do not force ---------- */
  { /* collisions OFF: the measured count is the closed-form count of a free
       flight, particle by particle, and the rate is the realised Σ|vx|/a + Σ|vy|/b */
    const g=gasMake({seed:9,noLid:true,collisions:false}); gasFill(g,0,200,300);
    const r=g.species[0].r, a=g.W-2*r, b=g.H-2*r, ps=60, T=ps;
    let want=0;
    for(let i=0;i<g.n;i++){
      for(const [v,p,lo,hi] of [[g.vx[i],g.x[i],g.left+r,-r],[g.vy[i],g.y[i],r,g.H-r]]){

        if(T>=t1) want+=1+Math.floor((T-t1)*s/L);

    for(let f=0;f<frames;f++){ gasStep(g,GAS.DT_FRAME); got+=g.stats.frameWallHits; }

    const realised=(()=>{ let s=0; for(let i=0;i<g.n;i++) s+=Math.abs(g.vx[i])/a+Math.abs(g.vy[i])/b; return s; })();
    const theory=hitRateTheory(g,false);
    /* Σ|vx| over 2N draws has a relative sd of √(1−2/π)/√((2/π)·2N) = 0.0378 here */
    const sd=Math.sqrt(1-2/PI)/Math.sqrt(2/PI)/Math.sqrt(2*g.n);
    ok(Math.abs(realised/theory-1)<4*sd,'… and 2 n ⟨v⟩/π (a+b) is that realisation’s mean (measured '+fmt(realised,3)+' vs '+fmt(theory,3)+', 4 sd = '+fmt(4*sd,3)+')');
    rel(hitRateTheory(g,true),theory,1e-15,'with collisions off the theory drops its Z: the gas is ideal however big the disks are');
    const gc=gasMake({seed:9,noLid:true}); gasFill(gc,0,200,300); gasRefresh(gc);
    ok(hitRateTheory(gc,true)>hitRateTheory(gc,false)*1.05,'… while the same gas WITH collisions carries a Z of '+fmt(hitRateTheory(gc,true)/hitRateTheory(gc,false),3)); }
  { /* collisions ON: the rate rises by the hard-disk Z, and the measurement
       can tell the two apart.  120 disks for 120 ps counts ~1000 hits, so the

    const R=measureHits(120,300,GAS.WDEF,120,true,11);
    rel(R.th/R.id,hdZ([120,0],[125,87.5],GAS.WDEF,GAS.H),1e-15,'theory with Z over theory without IS the hard-disk Z');

  /* ---------- G. the sweep: the controller, and the hit rate along it ---------- */
  for(const law of ['boyle','charles','gay','avo']){
    const w=setupConfig({view:'sweep',law,sWin:6},null);
    const S=sweepStart(w,ST); sweepRunAll(w,ST);
    ok(S.done&&S.pts.length===SWEEP_N,law+': the sweep ran to '+SWEEP_N+' points ('+S.pts.length+')');
    if(S.pts.length!==SWEEP_N) continue;
    let worst=0, worstY=0, worstR=0, chi=0;
    for(const p of S.pts){
      worst=Math.max(worst,Math.abs(p.inv/S.pts[0].inv-1));
      worstY=Math.max(worstY,Math.abs(p.y/sweepExactY(S,p.x,w.g)-1));
      const e=Math.sqrt(p.n)/p.t; chi+=(p.rate-p.rateTh)/e; worstR=Math.max(worstR,Math.abs(p.rate/p.rateTh-1));

    /* Charles is the one law whose controller has to SOLVE for the width, and
       PhET rounds that width to five decimals (|Δw| ≤ 5e-6 pm, 1e-9 of a 5 nm
       box, accumulating over the ~200 updates a step takes).  The other three
       only rescale kinetic energies, which is exact. */
    const tolY=law==='charles'?1e-7:1e-9;
    ok(worstY<tolY,law+': every measured point is on the exact line to '+worstY.toExponential(1)
       +(law==='charles'?' (PhET rounds the held-P width to 5 decimals)':''));
    /* the five hit-rate residuals are independent, so their sum is ±√5 sd */
    ok(Math.abs(chi)<3*Math.sqrt(SWEEP_N),law+': the measured hit rates track kinetic theory (Σ residual/σ = '+fmt(chi,2)+', |Σ| < '+fmt(3*Math.sqrt(SWEEP_N),2)+'; worst point '+fmt(100*worstR,1)+' %)');
    ok(S.pts.every(p=>isFinite(p.rate)&&p.rate>0),law+': every swept point measured a rate');
    /* the counting window is what the slider says, not some fraction of it */
    let worstT=0; for(const p of S.pts) worstT=Math.max(worstT,Math.abs(p.t/ST.sWin-1));
    ok(worstT<0.02,law+': every point counted for the '+ST.sWin+' ps the slider asks for (worst '+fmt(100*worstT,1)+' % off)');
  }
  { /* THE SWEEP DOES NOT USE THE PUMP.  PhET's pump puts every new particle at
       one point, (−r, H/5); a wall-hit rate measured before that clump has
       spread is the rate of the clump (it read 38 % low).  Assert directly
       that the sweep's own count-setter leaves the gas spread out: a 600 ×
       600 pm patch around the entry point holds 0.41 % of a uniform gas. */
    const nearEntry=gg=>{ let c=0; for(let i=0;i<gg.n;i++)
      if(Math.abs(gg.x[i]+gg.species[0].r)<300&&Math.abs(gg.y[i]-GAS.ENTRY_Y)<300) c++; return c; };
    /* drive the REAL sweep, not the helper: the difference lives in the call
       site inside sweepApply */
    const w=setupConfig({view:'sweep',law:'avo',sN:100,sWin:2},null);
    const S=sweepStart(w,ST);
    S.i=S.targets.length-1;                      /* the biggest target: 2 × sN */
    sweepApply(w,S);
    eq(gasCount(w.g,0),S.targets[S.i],'the Avogadro sweep took the count to '+S.targets[S.i]);
    const N2=gasCount(w.g,0), want=N2*(600*600)/(GAS.WDEF*GAS.H);
    ok(nearEntry(w.g)<=want+4*Math.sqrt(want)+2,'… spread out, not piled at the entry point ('+nearEntry(w.g)+' within 300 pm of it, uniform would be '+fmt(want,2)+')');
    const g2=gasMake({seed:59,noLid:true}); gasFill(g2,0,100,300);
    gasSetCount(g2,0,200);
    ok(nearEntry(g2)>50,'… whereas PhET’s pump puts all '+nearEntry(g2)+' of them there at once'); }
  { /* THE SETTLE IS LOAD-BEARING.  Boyle's first target halves the width, and
       the Ideal wall's redistribution scales the x positions, which pushes
       disks into each other — tens of overlapping pairs at once.  They pass
       through and separate (the engine's rule), but until they have, the wall
       statistics are of a gas that is not there.  The settle is exactly long
       enough for that transient. */
    const g=gasMake({seed:53,noLid:true}); gasFill(g,0,100,300);
    const over=gg=>{ let c=0; for(let i=0;i<gg.n;i++) for(let j=i+1;j<gg.n;j++)
      if(Math.hypot(gg.x[i]-gg.x[j],gg.y[i]-gg.y[j])<gasRad(gg,i)+gasRad(gg,j)) c++; return c; };
    eq(over(g),0,'the fill starts with no overlapping pairs');
    gasResize(g,GAS.WMIN,true);
    ok(over(g)>0,'halving the width puts '+over(g)+' pairs on top of each other');
    for(let f=0;f<SWEEP_SETTLE;f++) gasStep(g,GAS.DT_FRAME);
    eq(over(g),0,'… and the sweep’s '+SWEEP_SETTLE+'-frame settle ('+fmt(SWEEP_SETTLE*GAS.DT_FRAME,1)+' ps) is enough for every one of them to separate'); }
  { /* Boyle really does squeeze: the narrowest box has the highest pressure */
    const w=setupConfig({view:'sweep',law:'boyle',sWin:5},null);
    const S=sweepStart(w,ST); sweepRunAll(w,ST);
    ok(S.pts[0].P>S.pts[SWEEP_N-1].P*2.9,'Boyle: 5 nm gives ~3× the pressure of 15 nm ('+fmt(S.pts[0].P/S.pts[SWEEP_N-1].P,3)+')');
    ok(S.pts[0].rate>S.pts[SWEEP_N-1].rate,'… and the walls are struck more often in the narrow box');
    let mono=true; for(let i=1;i<SWEEP_N;i++) if(!(S.pts[i].T>0&&Math.abs(S.pts[i].T/S.pts[0].T-1)<1e-9)) mono=false;
    ok(mono,'… while the temperature never moves (the Ideal wall does no work)'); }
  { /* the Ideal wall: no work, and the disks are SPREAD over the new width.
       gasWidthTo only moves the wall; nothing puts a disk back inside, so
       without the redistribution a narrowing leaves particles outside the box
       (drawn outside it, and struck by nothing). */
    const g=gasMake({seed:31,noLid:true}); gasFill(g,0,150,300); gasRefresh(g);
    const T0=gasTemp(g), xs=[]; for(let i=0;i<g.n;i++) xs.push(g.x[i]);
    gasResize(g,GAS.WMIN,true);
    rel(gasTemp(g),T0,1e-15,'the Ideal wall does no work: T unchanged by a 10 → 5 nm resize');
    let outside=0, worstShift=0, rMax=0;
    for(let i=0;i<g.n;i++){ const r=gasRad(g,i); rMax=Math.max(rMax,r);
      if(g.x[i]-r<g.left-1e-9||g.x[i]+r>1e-9) outside++;
      worstShift=Math.max(worstShift,Math.abs(g.x[i]-xs[i]*0.5)); }
    eq(outside,0,'every disk is inside the narrowed box');
    /* x -> x·(w/W) about the RIGHT wall (x = 0), then a clamp that can move a
       disk by at most its own radius off either end */
    ok(worstShift<=rMax+1e-9,'… because every x was scaled by w/W = 0.5 about the right wall, then clamped by at most one radius (worst shift '+fmt(worstShift,1)+' pm, r = '+fmt(rMax,1)+')');
    const g2=gasMake({seed:31,noLid:true}); gasFill(g2,0,150,300);
    gasResize(g2,GAS.WMIN,false);
    let outside2=0; for(let i=0;i<g2.n;i++) if(g2.x[i]-gasRad(g2,i)<g2.left-1e-9) outside2++;
    ok(outside2>0,'… and WITHOUT the redistribution '+outside2+' of them would be left outside it'); }
  { /* PhET's lid: above 20,000 kPa it blows off, unless the gap is already
       1500 pm or wider — then the gas just vents.  The two gaps below are
       ABSOLUTE (1700 and 1200 pm), not written in terms of LID_WIDE: a test
       whose own setup is measured in the constant it is meant to pin moves
       with that constant and sees nothing. */
    close(GAS.LID_WIDE,1500,1e-12,'PhET’s blow-off gap is 1500 pm');
    const g=gasMake({seed:37}); gasFill(g,0,600,900); g.pOn=true; gasRefresh(g);
    ok(g.P>GAS.P_MAX,'600 disks at 900 K in the 10 nm box are past 20,000 kPa ('+fmt(g.P,0)+')');
    ok(g.lid.on===false,'… so the closed lid blew off');
    const g2=gasMake({seed:37}); gasFill(g2,0,600,900);
    gasSetLid(g2,gasMaxLid(g2)-1700); g2.pOn=true;
    close(gasOpening(g2),1700,1e-9,'a gap of exactly 1700 pm, wider than the 1500 blow-off gap');
    gasRefresh(g2);
    ok(g2.lid.on===true,'… and at that gap the lid stays on: the gas vents instead');
    const g3=gasMake({seed:37}); gasFill(g3,0,600,900);
    gasSetLid(g3,gasMaxLid(g3)-1200); g3.pOn=true;
    close(gasOpening(g3),1200,1e-9,'a gap of exactly 1200 pm, narrower than it');
    gasRefresh(g3);
    ok(g3.lid.on===false,'… and at that gap the lid goes'); }
  { /* PhET's gauge refreshes every 0.75 ps, not every frame */
    const g=gasMake({seed:41,noLid:true,noise:false}); gasFill(g,0,100,300); g.pOn=true; gasRefresh(g);
    const p0=g.gaugeP;
    gasSetTemp(g,600);                         /* the true P doubles at once */
    gasStep(g,0.5); ok(g.P>1.9*p0,'the noise-free P follows the temperature at once');
    eq(g.gaugeP,p0,'… but after 0.5 ps the GAUGE has not moved yet');
    gasStep(g,0.3); ok(g.gaugeP>1.9*p0,'… and at 0.8 ps, past PhET’s 0.75 ps refresh, it has');
    let refreshes=0, last=g.gaugeP;
    for(let f=0;f<240;f++){ gasStep(g,GAS.DT_FRAME); if(g.gaugeP!==last){ refreshes++; last=g.gaugeP; } }
    ok(refreshes<=Math.ceil(10/GAS.P_REFRESH)+1,'over 10 ps the gauge refreshed at most '+Math.ceil(10/GAS.P_REFRESH)+' times ('+refreshes+')'); }
  { /* PhET rounds the held-pressure width to FIVE decimals, and the size of
       that rounding is what the sweep's residual measures.  Ask for a width
       that is nowhere near a round number (137 disks going 317 K -> 200 K) and
       the invariant V/T can only stay put to 8e-10 if the rounding really is
       at the fifth decimal; at the first it would move by 8e-6. */
    const g=gasMake({seed:19,noLid:true}); gasFill(g,0,137,317); g.pOn=true; gasRefresh(g);
    const inv0=gasVolume(g)/1e9/gasTemp(g), W0=g.W;
    ok(gasSetHold(g,'pressureV'),'hold P↕V engaged');
    gasSetTemp(g,200); gasRefresh(g);
    const inv1=gasVolume(g)/1e9/gasTemp(g);
    ok(g.W!==W0&&g.W>6000&&g.W<6700,'the controller moved the wall to '+fmt(g.W,5)+' pm');
    ok(Math.abs(g.W*1e5-Math.round(g.W*1e5))<1e-6,'… landing on PhET’s five-decimal grid');
    ok(Math.abs(inv1/inv0-1)<1e-8,'… and V/T is unchanged to '+(Math.abs(inv1/inv0-1)).toExponential(1)+' (five decimals of 6309 pm is 8e-10; one decimal would be 8e-6)'); }
  { /* holding T while particles are REMOVED: PhET rescales what is left back
       to the temperature it had (gasAfterRemove), which is a different branch
       from the empty-box Oops below */
    const g=gasMake({seed:23,noLid:true}); gasFill(g,0,200,437); gasRefresh(g);
    ok(gasSetHold(g,'temperature'),'hold T engaged with 200 disks');
    const T0=gasTemp(g);
    gasRemove(g,0,120);
    eq(gasCount(g,0),80,'120 removed, 80 left');
    rel(gasTemp(g),T0,1e-12,'… and holding T restored the temperature of what is left ('+fmt(gasTemp(g),2)+' K)');
    eq(g.hold,'temperature','… without dropping the hold');
    const g2=gasMake({seed:23,noLid:true}); gasFill(g2,0,200,437); gasRefresh(g2);
    const E0=gasEnergy(g2); gasRemove(g2,0,120);
    ok(Math.abs(gasTemp(g2)-T0)<1e-12||gasCount(g2,0)===80,'… with no hold, removing is just removing');
    ok(gasEnergy(g2)<E0,'… and the energy simply leaves with the particles'); }
  { /* The lone trace marker must not contradict the readout beside it.  A
       fresh view has exactly one trace point, taken at t = 0; erase the gas
       while paused and that point still describes the gas that was there. */
    const w=setupConfig({view:'intro'},null);
    eq(w.trace.length,1,'a fresh view has one trace point');
    ok(w.trace[0][2]>0,'… showing the gauge of the gas it was seeded with');
    gasRemoveAll(w.g); gasRefresh(w.g);
    const c=makeShot(1400,820); drawView(c,1400,820,buildModel());
    eq(w.trace.length,1,'… still one after erasing');
    eq(w.trace[0][2],0,'… but the draw re-seeded it: the gauge point is 0, as the readout says');
    ok(!isFinite(w.trace[0][1]),'… and its temperature is not a number, as the readout’s “—” says'); }
  { /* The hottest isotherm only clips the TOP-RIGHT corner of the P-V box, so
       its label has to hang leftwards from the entry point; hanging rightwards
       it is clamped to the canvas edge and ends up outside its own frame.
       (The label registry clamps to the CANVAS, not to the plot.) */
    setupConfig({view:'pv'},null);
    const c=makeShot(1400,820), M0=buildModel();
    drawView(c,1400,820,M0);
    const G=viewGeo(c,1400,820,M0), b=G.plots[0];
    const want=ISO_T[ISO_T.length-1]+' K';
    const hits=c.ops.filter(o=>o.op==='text'&&o.t===want);
    eq(hits.length,1,'the hottest isotherm ('+want+') is labelled exactly once');
    if(hits.length===1) ok(hits[0].bb[0]>=b.x-1&&hits[0].bb[2]<=b.x1+1,
      '… and its label sits inside the plot frame (['+fmt(hits[0].bb[0],0)+', '+fmt(hits[0].bb[2],0)
      +'] inside ['+fmt(b.x,0)+', '+fmt(b.x1,0)+'])');
    for(const T of ISO_T) ok(c.ops.some(o=>o.op==='text'&&o.t===T+' K'),'the '+T+' K isotherm is labelled');
    /* The entry point moves with the axis: cooling the gas to 290 K raises the
       hottest isotherm's entry to V = 524.9 nm³, a tenth of a nm³ from the
       right edge, and a label hung rightwards from there runs off the plot.
       This is the state the leftward fallback exists for, so pin it here —
       at the default 300 K the label fits either way and pins nothing. */
    const w2=setupConfig({view:'pv'},null);
    gasSetTemp(w2.g,290); gasRefresh(w2.g);
    const c2=makeShot(1400,820), M2=buildModel();
    drawView(c2,1400,820,M2);
    const G2=viewGeo(c2,1400,820,M2), b2=G2.plots[0];
    const h2=c2.ops.filter(o=>o.op==='text'&&o.t===want);
    eq(h2.length,1,'cooled to 290 K, the hottest isotherm is still labelled once');
    if(h2.length===1){
      ok(h2[0].bb[2]<=b2.x1+1,'… and its label is still inside the plot frame (right edge '
        +fmt(h2[0].bb[2],0)+' vs '+fmt(b2.x1,0)+')');
      ok(h2[0].bb[2]>b2.x1-90,'… hard against it, which is what makes this the case that pins the fallback'); } }
  { /* the Oops cases PhET raises */
    const w=setupConfig({view:'laws'},null), g=w.g;
    ok(gasSetHold(g,'temperature'),'hold T is allowed with particles and a closed lid');
    gasRemoveAll(g);
    eq(g.hold,'nothing','erasing while holding T drops the hold'); eq(g.oops,'temperatureEmpty','… and raises PhET’s Oops');
    ok(/Temperature cannot be held constant/.test(GAS_OOPS[g.oops]),'… with PhET’s own wording');
    const w2=setupConfig({view:'laws'},null), g2=w2.g;
    gasSetLid(g2,3000); ok(!gasHoldAllowed(g2,'temperature'),'with the lid open, hold T is refused');
    const w3=setupConfig({view:'laws'},null), g3=w3.g;
    gasSetHold(g3,'pressureV'); g3.heat=1;
    for(let f=0;f<900&&g3.hold==='pressureV';f++) gasStep(g3,GAS.DT_FRAME);
    eq(g3.oops,'pressureLarge','holding P while heating runs the container past 15 nm: Oops');
    eq(g3.hold,'nothing','… and the hold drops to Nothing'); }
  TIMES.G=Date.now();

  /* ---------- H. every configuration: the readout, then the layout at four sizes ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,fn] of CONFIGS){
    setupConfig(over,fn); const M0=buildModel();
    const txt=readoutHTML(M0)+eqbarHTML(M0)+tagHTML(M0)+(INFO[ST.view]||'')+(DERIV[ST.view]||'');
    ok(!/NaN|undefined|Infinity/.test(txt),nm+': readout, eqbar, tag and prose clean');
    ok(txt.indexOf(' K')>=0||txt.indexOf('°C')>=0||M0.N===0,nm+': the readout shows a temperature');
    for(const [W,H] of SIZES){
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) continue;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=3&&texts.length>=2,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, '+texts.length+' texts)');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>3&&oy>3){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      /* the house #hint (HTML, bottom: 11px, 11px type) owns the bottom-left
         corner and the canvas capture cannot see it: no canvas text may reach it */
      const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
      ok(!inHint.length,nm+' '+W+'x'+H+' no canvas text under the #hint line'+(inHint.length?' ("'+inHint[0].t.slice(0,30)+'" to y '+fmt(inHint[0].bb[3],0)+')':''));
    }
  }
  if(fail>0) throw new Error(fail+' self-test failure(s), stopped after section H');
  TIMES.H=Date.now();

  /* ---------- I. no slider combination produces a non-finite value ---------- */
  { let bad=null;
    for(const view of TABS.map(t=>t[0]))
      for(const nH of [0,1,100,400])
        for(const T of [50,300,1000])
          for(const w2 of [GAS.WMIN,GAS.WDEF,GAS.WMAX]){
            const g=gasMake({seed:13,width:w2}); if(nH) gasFill(g,0,nH,T);
            g.pOn=nH>0; gasRefresh(g);
            const vals=[hitRateTheory(g,true),hitRateTheory(g,false),gasPressureOf(nH,g.T,gasVolume(g)),g.T];
            for(const v of vals) if(v!==null&&!isFinite(v)) bad=view+' N='+nH+' T='+T+' w='+w2+' → '+v;
          }
    ok(!bad,'no view × count × temperature × width gives a non-finite value ('+(bad||'ok')+')'); }
  { /* the sweep survives its extremes (a 2-ps window: this is a crash test,
       not a measurement) */
    let err=null, done=0, oops=null;
    try{ for(const law of ['boyle','charles','gay','avo'])
      for(const sN of [20,400]) for(const sT of [100,600]){
        const w=setupConfig({view:'sweep',law,sN,sT,sWin:2},null);
        sweepStart(w,ST); sweepRunAll(w,ST,2000);
        if(w.sweep.done) done++;
        if(w.g.oops) oops=law+' at N='+sN+' T='+sT+': '+w.g.oops;
        const M=buildModel(); const c=makeShot(1400,820); drawView(c,1400,820,M);
      } }catch(e){ err=e; }
    ok(!err,'every law × 20/400 disks × 100/600 K sweeps and draws'+(err?': '+(err.stack||err):''));
    ok(done===16,'… and all 16 of them ran to the end ('+done+')');
    /* the Charles targets are clamped a hair inside the container's range
       precisely so the controller's toFixed(5) cannot round past the end */
    ok(!oops,'… and not one of them raised an Oops'+(oops?' ('+oops+')':''));
    /* the clamp itself: the extreme Charles targets must ask for a width
       STRICTLY inside the container, so the controller's toFixed(5) has
       somewhere to round to */
    const w2=setupConfig({view:'sweep',law:'charles',sWin:2},null);
    const S2=sweepStart(w2,ST), N2=S2.N0, Pm=S2.P0/GAS.P_SCALE;
    const wOf=T=>N2*GAS.K*T/Pm/(w2.g.H*w2.g.D);
    const wHi=wOf(Math.max.apply(null,S2.targets)), wLo=wOf(Math.min.apply(null,S2.targets));
    ok(wHi<GAS.WMAX&&wLo>GAS.WMIN,'the Charles targets stop a hair inside the container ('
      +fmt(wLo,5)+' … '+fmt(wHi,5)+' pm, inside '+GAS.WMIN+' … '+GAS.WMAX+')');
    ok(GAS.WMAX-wHi<1e-3&&wLo-GAS.WMIN<1e-3,'… but only a hair: the sweep still spans the whole range'); }

  TIMES.E=Date.now();
  console.log('section times, s: '+['F','G','H','E'].map((k,i,a)=>k+' '+((TIMES[k]-(i?TIMES[a[i-1]]:T0))/1000).toFixed(1)).join(', '));

  Object.assign(ST,stSave); resetAllWorlds();
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
