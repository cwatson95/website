<title>Gases Intro &mdash; a box of hard disks: pump, heat, squeeze, and hold one of P, V, T still while the other two answer</title>
<!--
  ===================================================================
  gases-intro.html — Remake of PhET Interactive Simulations' Gases
  Intro (University of Colorado Boulder, phet.colorado.edu,
  CC-BY 4.0). New code; no PhET code or assets.
  ===================================================================

  PhET's Gases Intro is its Ideal screen twice over.  Read out of the
  minified original (docs/phets/gases-intro_en.html, 1.1.7):
  `class wb extends vb{ ... hasHoldConstantFeature:!1 }` registered as
  IntroScreen, and `class Sb extends vb{ ... hasHoldConstantFeature:!0 }`
  registered as LawsScreen, both extending IdealScreen.  So the two
  screens differ in exactly one thing: the Hold Constant panel.

  FOUR VIEWS.  THE BOX is the Intro screen: pump heavy (28 AMU) or
  light (4 AMU) disks into a container, heat or cool them from below,
  slide the left wall, open the lid and watch them leave, with the
  thermometer, the pressure gauge, the width ruler, the stopwatch and
  the collision counter.  THE LAWS is the Laws screen: the same box
  with PhET's five hold-constant choices (nothing, V, T, P by moving
  the wall, P by changing T) and its Oops cases.  P AGAINST V is a
  house view on the same gas as the Laws screen: the state point and
  the path it has traced on the P-V plane, over the isotherms.  THE
  FOUR LAWS is a house view that MEASURES Boyle, Charles, Gay-Lussac
  and Avogadro by running the simulation: it steps the controlled
  variable across its range with the hold engaged, waits for the gas
  to settle, and plots what came out against the exact line.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * PV = NkT holds here BY CONSTRUCTION, because PhET defines
    T = (2/3)<KE>/k and P = NkT/V.  What the four-laws view tests is
    therefore not the law but the machinery: that the hold-constant
    controller reaches the state it claims, and that the simulated
    gas's own measured T and N are the ones the law needs.  The sim
    says so on the canvas rather than dressing a tautology up as a
    measurement.
  * The one falsifiable number on this screen is the COLLISION
    COUNTER.  Kinetic theory says the walls are struck at
    2 n Z <v>/pi (a + b) times per ps, with a = W - 2r, b = H - 2r,
    n = N/(ab) the density of centres and Z the hard-disk
    compressibility.  For 100 heavy disks at 300 K in the 10 nm box
    that is 6.423/ps for point particles and 7.218/ps with Z; the
    simulation measures it, and selfTest asserts the measured rate
    against the derived one and against a free-flight simulation of
    4000 disks in derive.py.
  * Squeezing at fixed T, heating at fixed V, heating at fixed P and
    pumping at fixed P and V each hold their invariant to 1e-5 or
    better through the controller's own rounding (PhET rounds the
    held-pressure width to five decimals).

  WHAT IS EXACT
  -------------
  * The dynamics, unchanged from the gas-properties remake this is
    built on: inside each substep every collision happens at its true
    contact time, in time order, and elastic impulses conserve
    momentum and energy to rounding.  selfTest re-asserts those
    invariants here (5000 random collisions, and 300 disks at an area
    fraction of 0.17 that never overlap), because this file relies on
    them.  The engine, its brute-force parity runs and its two
    ledgers are documented in build/gas-properties/ENGINE.md.
  * PhET's model, by its minified source: the injection (Gaussian
    temperatures with the mean restored, a pi/2 fan pointing left),
    the heater (speeds x (1 + a/800) per 60-fps frame), the gauge
    (P = NkT/V, refreshed every 0.75 ps, PhET's noise law), the lid
    (it blows off above 20,000 kPa), the hold-constant algorithms and
    their Oops cases, the collision counter's 5/10/20-ps periods.
  * The 2-D Maxwell-Boltzmann one-sided flux <vx+> = sqrt(kT2/2 pi m)
    and the identity <vx+> = <v>/pi, by quadrature; the hard-disk
    contact measure M = 2 pi s a b - 4 s^2 (a+b) + 2 s^3 term by
    term, the +2s^3 being the four corners where two edge arcs
    overlap (an integral that comes to s^2/2 each).

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * T = (2/3)<KE>/k: the 3-D equipartition, applied to particles that
    move in two dimensions.  V = width x 8750 pm x 4000 pm.
  * The heater rescales every speed at once; the Ideal wall does no
    work (the sim pauses while it is dragged, as PhET's does).
  * Overlapping disks pass through each other until they separate,
    which is what lets the pump inject them all at one point.

  WHAT IS NOT MODELLED
  --------------------
  * Attraction, rotation, internal states, gravity, inelastic or
    quantum effects.  The third dimension is only the nominal depth
    in V.  The hard-disk Z used for the hit-rate prediction stops at
    B3, so past an area fraction of about 0.1 it is a lower bound.

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * PhET's screens open empty; these open with a gas in the box,
    because a view that draws nothing is a defect here.
  * An Oops is a banner on the canvas rather than a modal dialog, the
    tools are drawn where they belong rather than dragged, and there
    is no sound, no keyboard help and no PhET-iO.
  * The four-laws sweep is not in PhET at all.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from docs/phets/gases-intro_en.html
  (BOLTZMANN 8316 AMU pm^2 ps^-2 K^-1, +1.85e-4 against CODATA's
  8314.46; KG_PER_AMU 1.66e-27; ATM_PER_KPA 0.00986923; masses 28
  and 4 AMU; radii 125 and 87.5 pm; the box, the lid, the limits).
  Everything else is derived in build/gases-intro/derive.py with
  scipy and pinned in selfTest; the numbers are in refvals.txt.
-->

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }

function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */

  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],

  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){

  if(x===0) return '0';

  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));

   captured geometry would still lie.  Crossings are interpolated so a clipped

    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }

    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];

/* ---- the random stream: mulberry32 (bit-exact twin in derive.py) ---------- */
function gasRng(seed){
  let a=seed>>>0;

    next(){
      a=(a+0x6D2B79F5)>>>0;

/* ---- the collision-time algebra (derivation: derive.py section 2) --------------

   |dp + t dv|^2 = s^2 is a quadratic a t^2 + 2 b t + c = 0 with a = dv.dv,
   b = dp.dv, c = dp.dp - s^2.  They collide only if apart (c > 0) and
   approaching (b < 0), at the EARLIER root, which in the cancellation-free form
   is t = c / (-b + sqrt(b^2 - a c)).  Overlapping pairs (c < 0) get no event:
   they pass through each other, as in PhET, until they separate. */
function pairTime(dpx,dpy,dvx,dvy,s){
  const c=dpx*dpx+dpy*dpy-s*s;

/* push i's next wall event and its pair events with every neighbour, from

  }
  if(g.vir.on){ let e2=0; for(let i=0;i<N;i++) if(!g.out[i]) e2+=2*gasKE(g,i); g.vir.kin+=e2*h; }
  /* 4. predict every particle's first events; pairs once each (j > i) */
  EVH.n=0;
  for(let i=0;i<N;i++){ g.lt[i]=0; }
  for(let i=0;i<N;i++){ if(g.out[i]) continue; gasPredict(g,i,0,h,L0,u,G,true); }
  /* 5. events in time order */
  const cap=64*nin+1000; let nev=0;
  while(EVH.n>0){
    const e=evPop(), t=EVH.t[e];
    if(t>h) break;
    const i=EVH.i[e], j=EVH.j[e], kind=EVH.k[e];
    /* stale: a disk has had an event since this one was predicted (its stamp
       moved on), or has left through the lid */
    if(g.st[i]!==EVH.si[e]||g.out[i]){ g.stats.stale++; continue; }
    if(kind===EV_PAIR&&(g.st[j]!==EVH.sj[e]||g.out[j])){ g.stats.stale++; continue; }
    if(++nev>cap){ g.stats.eventCap++; break; }
    /* advance the particle(s) to the event time */
    g.x[i]+=g.vx[i]*(t-g.lt[i]); g.y[i]+=g.vy[i]*(t-g.lt[i]); g.lt[i]=t;
    const m=gasMass(g,i);
    if(kind===EV_PAIR){
      g.x[j]+=g.vx[j]*(t-g.lt[j]); g.y[j]+=g.vy[j]*(t-g.lt[j]); g.lt[j]=t;
      const vir=pairResolve(g,i,j);
      if(g.vir.on) g.vir.pair+=vir;
      g.stats.pairHits++; g.st[i]++; g.st[j]++;
      if(G&&(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]>G.vb*G.vb||g.vx[j]*g.vx[j]+g.vy[j]*g.vy[j]>G.vb*G.vb)) g.stats.fastMiss++;
      gasPredict(g,i,t,h,L0,u,G); gasPredict(g,j,t,h,L0,u,G);
      continue;
    }
    if(kind===EV_ESC){
      /* leaves through the opening: out of the container, no more collisions */
      const e0=0.5*m*(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]);
      if(g.vir.on){ g.vir.esc-=m*(g.x[i]*g.vx[i]+g.y[i]*g.vy[i]); g.vir.kin-=2*e0*(h-t); }
      g.led.esc+=e0; g.out[i]=1; g.st[i]++;
      continue;
    }
    let Jx=0,Jy=0;
    const eHit=0.5*m*(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]);
    if(kind===EV_LEFT){
      const moving=gasXlo(g,g.sp[i])===null, uu=moving?u:0;
      const vx0=g.vx[i], vx1=2*uu-vx0;               /* elastic: the wall is infinitely heavy */
      g.vx[i]=vx1; Jx=m*(vx1-vx0);
      if(uu!==0){ const dE=0.5*m*(vx1*vx1-vx0*vx0); g.led.work+=dE; if(g.vir.on) g.vir.kin+=2*dE*(h-t); }
      if(moving){ g.imp.L+=Jx; g.imp.hitsL++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++; }
    } else if(kind===EV_RIGHT){
      Jx=-2*m*g.vx[i]; g.vx[i]=-g.vx[i];
      if(gasXhi(g,g.sp[i])===0){ g.imp.R-=Jx; g.imp.hitsR++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++; }
    } else if(kind===EV_BOT){
      Jy=-2*m*g.vy[i]; g.vy[i]=-g.vy[i]; g.imp.B+=Jy; g.imp.hitsB++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++;
    } else {
      Jy=-2*m*g.vy[i]; g.vy[i]=-g.vy[i]; g.imp.T-=Jy; g.imp.hitsT++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++;
    }
    if(g.vir.on) g.vir.wall+=g.x[i]*Jx+g.y[i]*Jy;
    g.st[i]++;
    gasPredict(g,i,t,h,L0,u,G);
  }
  g.stats.events+=nev;
  /* 6. everyone to the end of the substep; the kinetic virial of the substep */
  for(let i=0;i<N;i++){
    const dt=h-g.lt[i];
    g.x[i]+=g.vx[i]*dt; g.y[i]+=g.vy[i]*dt; g.lt[i]=0;
  }
  if(wantLeft!==undefined) gasWidthTo(g,-wantLeft);
  g.u=u;
  g.imp.t+=h;
  EVH.n=0;
}
/* ---- one frame: substeps, then PhET's per-step bookkeeping ------------------- */
/* the number of substeps keeps the grid's cells at most ~2 diameters: a cell
   is s_max + 2 v_b h wide, and the event order inside a substep is exact
   whatever h is, so this is a speed knob, not an accuracy one */
function gasSubsteps(g,dt){
  let keMax=0, smax=0, mmin=Infinity;
  for(let i=0;i<g.n;i++) if(!g.out[i]){ const e=gasKE(g,i); if(e>keMax) keMax=e; }
  for(const S of g.species){ if(2*S.r>smax) smax=2*S.r; if(S.m<mmin) mmin=S.m; }
  if(!(keMax>0)||!(smax>0)) return 1;
  const vb=Math.sqrt(4*keMax/mmin)+(g.doesWork?g.wallSpeed:0);
  return Math.max(1,Math.min(64,Math.ceil(2*vb*dt/smax)));
}
function gasStep(g,dt){
  if(!(dt>0)) return;
  for(let i=0;i<g.n;i++) g.px[i]=g.x[i];
  const n=gasSubsteps(g,dt), h=dt/n;
  g.stats.frameWallHits=0;
  let moved=false;
  for(let s=0;s<n;s++){
    let wantLeft;
    if(g.doesWork&&g.wantW!==g.W){
      /* Explore: the wall heads for the width the user asked for at no more
         than PhET's wallSpeedLimit, in either direction */
      const d=g.wantW-g.W, lim=g.wallSpeed*h;
      wantLeft=-(Math.abs(d)<=lim?g.wantW:g.W+(d>0?lim:-lim));
      moved=true;
    }
    gasSubstep(g,h,wantLeft);
  }
  if(!moved) g.u=0;
  g.t+=dt;
  /* escaped particles float off; they are dropped far outside the box */
  for(let i=g.n-1;i>=0;i--) if(g.out[i]&&(g.y[i]>g.H+30000||g.y[i]<-30000||g.x[i]>30000||g.x[i]<g.left-30000)) gasKill(g,i);
  if(g.counter.on){ g.counter.count+=g.stats.frameWallHits; g.counter.t+=dt;
    if(g.counter.t>=g.counter.period){ g.counter.on=false; g.counter.t=g.counter.period; } }
  if(g.watch.on){ g.watch.t=Math.min(GAS.MAXTIME,g.watch.t+dt); if(g.watch.t>=GAS.MAXTIME) g.watch.on=false; }
  gasUpdate(g,dt,g.stats.frameWallHits);
  if(g.sampler) gasSample(g,dt,true);
  if(g.flow&&!g.divided) gasFlowStep(g,dt);
}
/* PhET's updateModel: compensateForHoldConstant, the temperature, the pressure
   (enabled after the first wall hit; the gauge refreshes every 0.75 ps with
   noise), the lid blowing off, the maximum temperature */
function gasUpdate(g,dt,hits){
  const N=gasCount(g);
  if(g.hold==='pressureV'&&N>0&&g.P>0){
    const T=gasTemp(g), Pm=g.P/GAS.P_SCALE;
    let w=+(N*GAS.K*T/Pm/(g.H*g.D)).toFixed(5);
    if(w<g.wRange[0]||w>g.wRange[1]){
      g.oops=w>g.wRange[1]?'pressureLarge':'pressureSmall'; g.hold='nothing';
      w=Math.min(g.wRange[1],Math.max(g.wRange[0],w));
    }
    gasResize(g,w,true);
  } else if(g.hold==='pressureT'&&N>0&&g.P>0){
    gasSetTemp(g,(g.P/GAS.P_SCALE)*gasVolume(g)/(N*GAS.K));
  }
  g.T=gasTemp(g);
  if(N===0){ g.pOn=false; g.P=0; g.gaugeP=0; }
  else if(!g.pOn&&hits>0) g.pOn=true;
  if(g.pOn){
    g.P=gasPressureOf(N,g.T,gasVolume(g));
    g.pAcc+=dt;
    if(g.pAcc>=GAS.P_REFRESH){
      let e=0;
      if(g.noiseOn&&g.hold!=='pressureV'&&g.hold!=='pressureT'){
        const pn=Math.min(50,Math.max(0,50*(1-g.P/GAS.P_MAX))), sn=Math.min(1,Math.max(0,((g.T||0)-5)/45));
        e=pn*sn*g.noise.next();
        if(e<g.P) e*=g.noise.next()<0.5?-1:1;
      }
      g.gaugeP=g.P+e; g.pAcc=0;
    }
    if(g.P>GAS.P_MAX) gasBlowLid(g);
  }
  if(g.T!==null&&g.T>=GAS.T_MAX){
    if(g.hold!=='nothing'&&g.hold!=='volume') g.hold='nothing';
    gasRemoveAll(g); gasReturnLid(g); g.oops='maxTemperature'; g.T=null;
  }
  if(g.hold==='temperature'&&gasLidOpen(g)){ g.hold='nothing'; g.oops='temperatureOpen'; }
}
/* the model refreshed without time passing (a paused resize, a count change):
   PhET's updateWhenPaused, which also refreshes the gauge */
function gasRefresh(g){ g.pAcc=GAS.P_REFRESH; gasUpdate(g,0,0); }
/* the hold-constant modes a user may choose right now (PhET HoldConstantPanel):
   T needs particles and a closed lid; P needs a non-zero pressure */
function gasHoldAllowed(g,mode){
  if(mode==='temperature') return gasCount(g)>0&&!gasLidOpen(g);
  if(mode==='pressureV'||mode==='pressureT') return g.P>0;
  return true;
}
function gasSetHold(g,mode){ if(!gasHoldAllowed(g,mode)) return false; g.hold=mode; return true; }
/* the Oops texts (PhET's strings, <br> dropped) */
const GAS_OOPS={
  maxTemperature:'Oops! Maximum temperature reached.',
  pressureEmpty:'Oops! Pressure cannot be held constant when the container is empty.',
  pressureLarge:'Oops! Pressure cannot be held constant. Volume would be too large.',
  pressureSmall:'Oops! Pressure cannot be held constant. Volume would be too small.',
  temperatureEmpty:'Oops! Temperature cannot be held constant when the container is empty.',
  temperatureOpen:'Oops! Temperature cannot be held constant when the container is open.'
};

/* ---- statistics --------------------------------------------------------------- */
function gasSpeed(g,i){ return Math.sqrt(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]); }
/* counts in nb bins of width w (PhET HistogramsModel: floor(v/w); values past
   the last bin are not counted) */
function gasBinCounts(g,k,w,nb,energy){
  const out=new Array(nb).fill(0);
  for(let i=0;i<g.n;i++){ if(g.out[i]||g.sp[i]!==k) continue;
    const v=energy?gasKE(g,i):gasSpeed(g,i), b=Math.floor(v/w);
    if(b>=0&&b<nb) out[b]++; }
  return out;
}
function gasMeanSpeedOf(g,k){ let s=0,c=0; for(let i=0;i<g.n;i++) if(!g.out[i]&&g.sp[i]===k){ s+=gasSpeed(g,i); c++; } return c?s/c:null; }
/* PhET's Energy-screen sampler: every frame adds the bin counts and the mean
   speeds; every 1 ps (or at once when paused) the averages are published */
function gasSamplerOn(g){
  const z=()=>new Array(GAS.NBIN).fill(0);
  g.sampler={dt:0, n:0, acc:{s0:z(),s1:z(),e0:z(),e1:z()}, spd:[0,0],
             out:{s0:z(),s1:z(),e0:z(),e1:z()}, mean:[null,null], published:0};
  return g.sampler;
}
function gasSample(g,dt,playing){
  const S=g.sampler; if(!S) return;
  S.dt+=dt; S.n++;
  for(const k of [0,1]){
    const sc=gasBinCounts(g,k,GAS.SBIN,GAS.NBIN,false), ec=gasBinCounts(g,k,GAS.EBIN,GAS.NBIN,true);
    const A=S.acc['s'+k], B=S.acc['e'+k];
    for(let b=0;b<GAS.NBIN;b++){ A[b]+=sc[b]; B[b]+=ec[b]; }
    const ms=gasMeanSpeedOf(g,k); S.spd[k]+=ms===null?0:ms;
  }
  if(S.dt>=GAS.SAMPLE-1e-9||!playing){
    for(const key of ['s0','s1','e0','e1']) S.out[key]=S.acc[key].map(v=>v/S.n);
    for(const k of [0,1]) S.mean[k]=gasCount(g,k)?S.spd[k]/S.n:null;
    for(const key of ['s0','s1','e0','e1']) S.acc[key].fill(0);
    S.spd=[0,0]; S.n=0; S.dt=0; S.published++;
  }
}
/* the centre of mass of species k: x offset from the container's centre, pm */
function gasCOM(g,k){
  let sm=0,sx=0;
  for(let i=0;i<g.n;i++) if(!g.out[i]&&g.sp[i]===k){ const m=gasMass(g,i); sm+=m; sx+=m*g.x[i]; }
  return sm>0?sx/sm-(g.left+g.W/2):null;
}
/* Diffusion's Data: per side of the divider line, the counts of each species
   and the average temperature (2/3)<KE>/k */
function gasSideData(g){
  const res=[{n0:0,n1:0,e:0,T:null},{n0:0,n1:0,e:0,T:null}];
  for(let i=0;i<g.n;i++){ if(g.out[i]) continue;
    const s=g.x[i]<g.dividerX?0:1; if(g.sp[i]===0) res[s].n0++; else res[s].n1++; res[s].e+=gasKE(g,i); }
  for(const r of res){ const n=r.n0+r.n1; r.T=n?(2/3)*r.e/n/GAS.K:null; }
  return res;
}
/* Diffusion's particle flow: crossings of the divider line this frame (from x
   at the frame's start to x at its end), a running window of 300 frames */
function gasFlowOn(g){ g.flow={L:[[],[]], R:[[],[]], dts:[], rateL:[0,0], rateR:[0,0]}; return g.flow; }
function gasFlowStep(g,dt){
  const F=g.flow, cL=[0,0], cR=[0,0];
  for(let i=0;i<g.n;i++){ if(g.out[i]) continue; const k=g.sp[i];
    if(g.px[i]>=g.dividerX&&g.x[i]<g.dividerX) cL[k]++; else if(g.px[i]<=g.dividerX&&g.x[i]>g.dividerX) cR[k]++; }
  F.dts.push(dt); for(const k of [0,1]){ F.L[k].push(cL[k]); F.R[k].push(cR[k]); }
  if(F.dts.length>GAS.FLOW_WINDOW){ F.dts.shift(); for(const k of [0,1]){ F.L[k].shift(); F.R[k].shift(); } }
  const T=F.dts.reduce((a,b)=>a+b,0);
  for(const k of [0,1]){ F.rateL[k]=F.L[k].reduce((a,b)=>a+b,0)/T; F.rateR[k]=F.R[k].reduce((a,b)=>a+b,0)/T; }
}
/* the pressure the walls feel: momentum delivered per unit time to each wall
   (a 2-D force per unit length is this over the wall's length) */
function gasWallForce(g){
  const I=g.imp, t=I.t||1;
  return {L:I.L/t, R:I.R/t, B:I.B/t, T:I.T/t, t:I.t, hits:I.hitsL+I.hitsR+I.hitsB+I.hitsT};
}

/* ---- Diffusion's settings (PhET DiffusionParticleSystem) --------------------- */
/* the half a species is born in: particle 1 left of the divider, particle 2 right */
function gasDiffRegion(g,k){ const mid=g.left+g.W/2; return k===0?[g.left,mid-g.dividerHalf]:[mid+g.dividerHalf,0]; }
/* a new mass or starting temperature sets EVERY particle of the species to
   sqrt(3kT/m), keeping its direction (PhET setMassAndTemperature) */
function gasDiffMassTemp(g,k,m,T){
  g.species[k].m=m;
  const v=Math.sqrt(3*GAS.K*T/m);
  for(let i=0;i<g.n;i++) if(g.sp[i]===k&&!g.out[i]){
    const s=gasSpeed(g,i); if(s>0){ g.vx[i]*=v/s; g.vy[i]*=v/s; } else { g.vx[i]=v; g.vy[i]=0; } }
}
/* a new radius; paused, every particle of the species is set back inside the
   x-range it may occupy (PhET clamps into the left half for particle 1 even
   with the divider out; here the range is the one the divider allows) */
function gasDiffRadius(g,k,r,playing){
  g.species[k].r=r;
  if(playing) return;
  const lo=gasXlo(g,k), xlo=lo===null?g.left:lo, xhi=gasXhi(g,k);
  for(let i=0;i<g.n;i++) if(g.sp[i]===k&&!g.out[i]){
    if(g.x[i]-r<xlo) g.x[i]=xlo+r; else if(g.x[i]+r>xhi) g.x[i]=xhi-r;
    if(g.y[i]-r<0) g.y[i]=r; else if(g.y[i]+r>g.H) g.y[i]=g.H-r; }
}
/* a new count: added in the species' own half; removing resets the rest to
   sqrt(3kT/m), as PhET does */
function gasDiffCount(g,k,n,T){
  const c=gasCount(g,k);
  if(n>c){ const R=gasDiffRegion(g,k); gasScatter(g,k,n-c,T,R[0],R[1]); }
  else if(n<c){ gasRemove(g,k,c-n); gasDiffMassTemp(g,k,g.species[k].m,T); }
}
/* the divider back in: PhET restarts, every particle regenerated on its side */
function gasDiffRestart(g,n0,T0,n1,T1){
  gasRemoveAll(g); gasSetDivided(g,true);
  const R0=gasDiffRegion(g,0), R1=gasDiffRegion(g,1);
  gasScatter(g,0,n0,T0,R0[0],R0[1]); gasScatter(g,1,n1,T1,R1[0],R1[1]);
  if(g.flow) gasFlowOn(g);
}

/* ================================================================== *
 *  state: the four views, their worlds, the per-view model, readout,   *
 *  equation bar and tag.  PhET's Gases Intro is the Ideal screen with  *
 *  hasHoldConstantFeature false (Intro) and true (Laws), so `intro`    *
 *  and `laws` are the two screens and `pv` is the Laws screen's own    *
 *  gas seen on the P-V plane — one model, two instruments.             *
 * ================================================================== */
const TABS=[['intro','the box'],['laws','the laws'],['pv','P against V'],['sweep','the four laws']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6', edge:'#242a3a',
           heavy:'#6c9cff', light:'#ff6f6f',
           box:'#0d1422', wall:'#5ac8e0', lid:'#7f93b3', heat:'#ff7a3d', cool:'#5fb4ff', text:'#aeb6c6'};
const RO_W=300;
const SEEDS={intro:21, laws:22, sweep:23};
const HOLDS=[{id:'nothing',name:'Nothing'},{id:'volume',name:'Volume (V)'},{id:'temperature',name:'Temperature (T)'},
             {id:'pressureV',name:'Pressure ↕V'},{id:'pressureT',name:'Pressure ↕T'}];
const PUMPS=[{id:'heavy',name:'heavy'},{id:'light',name:'light'}];
const UNITS_T=[{id:'K',name:'K'},{id:'C',name:'°C'}];
const UNITS_P=[{id:'atm',name:'atm'},{id:'kPa',name:'kPa'}];
const PERIODS=GAS.PERIODS.map(p=>({id:p,name:p+' ps'}));
/* the four named laws, each a (hold, swept variable, invariant) triple */
const LAWS=[{id:'boyle',   name:'Boyle',      hold:'temperature', x:'V', y:'P', inv:'P V',   iu:'kPa nm³'},
            {id:'charles', name:'Charles',    hold:'pressureV',   x:'T', y:'V', inv:'V / T', iu:'nm³/K'},
            {id:'gay',     name:'Gay-Lussac', hold:'volume',      x:'T', y:'P', inv:'P / T', iu:'kPa/K'},
            {id:'avo',     name:'Avogadro',   hold:'pressureT',   x:'N', y:'T', inv:'N T',   iu:'K'}];
const FRAME_DT=GAS.DT_FRAME;
/* the isotherms the P-against-V view draws */
const ISO_T=[150,300,600,1000];
/* the wall-hit rate is measured over a rolling window of this many frames */
const HIT_WINDOW=240;
/* the sweep: settle, then count wall hits, at each of five targets */
const SWEEP_SETTLE=48, SWEEP_N=5, SWEEP_BATCH=8;

const DEFAULTS={view:'intro', running:true,
  pump:'heavy', heat:0, unitT:'K', unitP:'atm', noise:true,
  showWidth:true, showWatch:false, showCounter:true, period:10,
  hold:'nothing', nH:100, nL:0,
  law:'boyle', sN:100, sT:300, sWin:20};
const ST=Object.assign({},DEFAULTS);
/* every view here draws the container: the Intro and Laws screens, the P-V
   plane (the Laws gas) and the sweep (the gas being swept) */
const BOXVIEWS={intro:1, laws:1, pv:1, sweep:1};
/* `pv` has no gas of its own: it is the Laws screen's gas on another plot */
function worldKey(view){ return view==='pv'?'laws':view; }

/* ---- the worlds ------------------------------------------------------------ */
const WORLD={};
function pressureOnAfterFill(g){ g.pOn=gasCount(g)>0; gasRefresh(g); }
function makeWorld(view,st){
  const key=worldKey(view);
  const w={view:key, trace:[], hits:[], hitAcc:0, htAcc:0, pump:{h:0, acc:0}, dragW:null, sweep:null};
  const g=w.g=gasMake({seed:SEEDS[key]});
  g.noiseOn=st.noise;
  if(key==='sweep'){ gasFill(g,0,st.sN,st.sT); }
  else { gasFill(g,0,100,GAS.T0); }
  gasLedgerReset(g); pressureOnAfterFill(g);
  traceRecord(w);
  return w;
}
function worldOf(view){ const k=worldKey(view); if(!WORLD[k]) WORLD[k]=makeWorld(k,ST); return WORLD[k]; }
function resetWorld(view){ const k=worldKey(view); WORLD[k]=makeWorld(k,ST); return WORLD[k]; }
function resetAllWorlds(){ for(const k in WORLD) delete WORLD[k]; }

/* the trace every box view shares: t, T, the gauge, the width, the noise-free P */
function traceRecord(w){
  const g=w.g;
  w.trace.push([g.t,g.T===null?NaN:g.T,g.pOn?g.gaugeP:0,g.W,g.pOn?g.P:0]);
  if(w.trace.length>900) w.trace.splice(0,w.trace.length-900);
}
/* the measured wall-hit rate: a rolling window of HIT_WINDOW frames.  This is
   the one falsifiable number on PhET's Intro screen — the Collision Counter —
   so it is measured continuously and compared with kinetic theory. */
function hitRecord(w,dt){
  w.hits.push([dt,w.g.stats.frameWallHits]);
  if(w.hits.length>HIT_WINDOW) w.hits.shift();
}
function hitRateMeasured(w){
  let t=0,c=0; for(const r of w.hits){ t+=r[0]; c+=r[1]; }
  return t>0?{rate:c/t, n:c, t}:null;
}
/* kinetic theory: each species contributes n_k <vx+>_k over the whole
   perimeter its centres can reach, and collisions raise the contact density
   by the hard-disk Z (derive.py section 4b: 6.4234/ps for 100 heavy at 300 K
   in the 10 nm box with Z = 1, 7.2178/ps with Z). */
function hitRateOf(counts,radii,masses,W,Hh,T,useZ){
  if(T===null||!(T>0)||counts[0]+counts[1]===0) return null;
  let s=0;
  for(const k of [0,1]){
    const nk=counts[k]; if(!nk) continue;
    const r=radii[k], a=W-2*r, b=Hh-2*r;
    if(!(a>0&&b>0)) return null;
    s+=nk/(a*b)*Math.sqrt(gasKT2(T)/(2*Math.PI*masses[k]))*2*(a+b);
  }
  return s*(useZ?hdZ(counts,radii,W,Hh):1);
}
/* Z is the crowding the PAIR collisions cause, so a gas with collisions
   switched off is ideal however big its disks are: the flag has to reach the
   theory, or the "with Z" curve would keep claiming a correction that is not
   there (selfTest asserts both branches). */
function hitRateTheory(g,useZ){
  return hitRateOf([gasCount(g,0),gasCount(g,1)],[g.species[0].r,g.species[1].r],
                   [g.species[0].m,g.species[1].m],g.W,g.H,g.T,useZ&&g.collisions!==false);
}

/* the isotherms the P-against-V view draws, as DATA rather than as pixels: a
   number computed inside a draw call cannot be asserted, and a mutation sweep
   says so (projects/simulations/CHANGELOG.md, Known-bad).  V is in nm³. */
function pvIsotherm(N,T,V0,V1,n){
  const xs=[], ys=[];
  for(let i=0;i<=n;i++){ const V=V0+(V1-V0)*i/n; xs.push(V); ys.push(gasPressureOf(N,T,V*1e9)); }
  return {xs,ys};
}

/* ---- the sweep: the four laws, measured off the simulation ------------------ */
function sweepTargets(w,st,P0){
  const g=w.g, N=gasCount(g);
  if(st.law==='boyle')  return [GAS.WMIN,7500,GAS.WDEF,12500,GAS.WMAX];
  if(st.law==='gay')    return [200,300,400,500,600];
  /* Avogadro stops at twice the starting count: past an area fraction of
     about 0.12 the B₃ truncation in Z starts to under-predict the crowding */
  if(st.law==='avo')    return [0.5,0.75,1,1.5,2].map(f=>Math.max(10,Math.round(f*st.sN)));
  /* Charles: T runs over exactly the range whose width fits PhET's container,
     T = P V/(N k), kept a hair inside so the controller's toFixed(5) cannot
     round past the end and raise an Oops */
  const Tlo=P0/GAS.P_SCALE*(GAS.WMIN*g.H*g.D)/(N*GAS.K), Thi=P0/GAS.P_SCALE*(GAS.WMAX*g.H*g.D)/(N*GAS.K);
  return [0,1,2,3,4].map(i=>clamp(Tlo+(Thi-Tlo)*i/4,Tlo*(1+1e-9),Thi*(1-1e-9)));
}
function sweepStart(w,st){
  const g=w.g;
  gasRemoveAll(g); gasSetHold(g,'nothing'); gasResize(g,GAS.WDEF,true);
  gasFill(g,0,st.sN,st.sT); g.pOn=gasCount(g)>0; gasRefresh(g);
  const S={law:st.law, i:0, phase:'apply', frames:0, pts:[], hits:0, ht:0,
           P0:g.P, N0:gasCount(g,0), T0:g.T, W0pm:g.W,
           measure:Math.round(st.sWin/FRAME_DT), done:false};
  S.targets=sweepTargets(w,st,g.P);
  w.sweep=S;
  return S;
}
/* The sweep changes the count with gasFill, not with PhET's pump.  The pump
   puts every new disk at one point (-r, H/5) and it takes tens of ps for a
   batch of fifty to spread out; measuring a wall-hit rate before it has is
   measuring a clump, and it read 38 % low.  gasFill places them uniformly and
   without overlaps, which is the state the kinetic-theory rate assumes.  This
   is a house measurement tool, not one of PhET's screens. */
function sweepSetCount(g,n,T){
  const c=gasCount(g,0);
  if(n>c) gasFill(g,0,n-c,T===null?GAS.T0:T);
  else if(n<c) gasRemove(g,0,c-n);
}
function sweepApply(w,S){
  const g=w.g, v=S.targets[S.i];
  if(S.law==='boyle'){ gasSetHold(g,'temperature'); gasResize(g,v,true); }
  else if(S.law==='gay'){ gasSetHold(g,'volume'); gasSetTemp(g,v); }
  else if(S.law==='charles'){ gasSetHold(g,'pressureV'); gasSetTemp(g,v); }
  else { gasSetHold(g,'pressureT'); sweepSetCount(g,v,g.T); }
  gasRefresh(g);
}
function sweepRecord(w,S){
  const g=w.g, N=gasCount(g), T=g.T, V=gasVolume(g)/1e9, P=g.P;
  const rate=S.ht>0?S.hits/S.ht:null;
  const pt={N,T,V,P,rate,n:S.hits,t:S.ht,
            rateTh:hitRateTheory(g,true), rateId:hitRateTheory(g,false), W:g.W};
  pt.x=S.law==='boyle'?V:(S.law==='avo'?N:T);
  pt.y=S.law==='boyle'?P:(S.law==='charles'?V:(S.law==='gay'?P:T));
  pt.inv=S.law==='boyle'?P*V:(S.law==='charles'?V/T:(S.law==='gay'?P/T:N*T));
  S.pts.push(pt);
}
/* one model frame of the sweep; returns true while it is still running */
function sweepStep(w,st,dt){
  const S=w.sweep; if(!S||S.done) return false;
  if(S.phase==='apply'){ sweepApply(w,S); S.phase='settle'; S.frames=0; S.hits=0; S.ht=0; return true; }
  gasStep(w.g,dt);
  hitRecord(w,dt);
  S.frames++;
  if(S.phase==='settle'){
    if(S.frames>=SWEEP_SETTLE){ S.phase='measure'; S.frames=0; S.hits=0; S.ht=0; }
    return true;
  }
  S.hits+=w.g.stats.frameWallHits; S.ht+=dt;
  if(S.frames>=S.measure){
    sweepRecord(w,S);
    S.i++;
    if(S.i>=S.targets.length){ S.done=true; return false; }
    S.phase='apply';
  }
  return true;
}
/* run a sweep to the end without a frame loop (the tests and the captures) */
function sweepRunAll(w,st,cap){
  let n=0; const lim=cap||60000;
  while(w.sweep&&!w.sweep.done&&n<lim){ sweepStep(w,st,FRAME_DT); n++; }
  return n;
}

/* ---- per-view bookkeeping each frame ---------------------------------------- */
function viewDt(){ return GAS.DT_FRAME; }
function worldStep(w,st,dt){
  const g=w.g;
  if(w.view!=='sweep'&&w.dragW!==null) return false;   /* PhET pauses while the wall is dragged */
  const n0=gasCount(g,0), n1=gasCount(g,1);
  if(w.view==='sweep'&&w.sweep&&!w.sweep.done){
    /* the sweep runs SWEEP_BATCH model frames per animation frame, so 100 ps
       of measurement is a few seconds to watch rather than a minute */
    for(let b=0;b<SWEEP_BATCH;b++) if(!sweepStep(w,st,dt)) break;
  } else {
    g.heat=w.view==='sweep'?0:st.heat;
    gasStep(g,dt);
    hitRecord(w,dt);
  }
  traceRecord(w);
  return gasCount(g,0)!==n0||gasCount(g,1)!==n1;
}

/* ---- the models the readout and the views read ------------------------------- */
function fmtT(T,st){ if(T===null||T===undefined||!isFinite(T)) return '—'; return st.unitT==='C'?sigf(T-273.15,4)+' °C':sigf(T,4)+' K'; }
function fmtP(Pk,st){ if(!isFinite(Pk)) return '—'; return st.unitP==='kPa'?Math.round(Pk)+' kPa':fmt(Pk*GAS.ATM_PER_KPA,1)+' atm'; }
function zJ(e){ return e*GAS.KG_PER_AMU*1e21; }        /* AMU pm²/ps² -> zJ, PhET's AMU */
function holdName(id){ const o=HOLDS.find(h=>h.id===id); return o?o.name:id; }
function lawOf(id){ return LAWS.find(l=>l.id===id)||LAWS[0]; }
function buildModel(){
  const st=ST, view=st.view, w=worldOf(view), g=w.g;
  const N=gasCount(g), nH=gasCount(g,0), nL=gasCount(g,1);
  const M={view,st,w,g,N,nH,nL,T:g.T,P:g.P,gauge:g.gaugeP,Wnm:g.W/1000,t:g.t,oops:g.oops};
  M.kT2=g.T===null?null:gasKT2(g.T);
  M.lidOpen=gasLidOpen(g); M.opening=gasOpening(g);
  M.V=gasVolume(g)/1e9;
  /* the invariant the chosen hold keeps, in the noise-free P */
  const T=g.T;
  M.inv=(!T||!N)?null:g.hold==='volume'?['P / T (Gay-Lussac)',sigf(g.P/T,6)+' kPa/K']
    :g.hold==='temperature'?['P V (Boyle)',sigf(g.P*M.V,6)+' kPa nm³']
    :g.hold==='pressureV'?['V / T (Charles)',sigf(M.V/T,6)+' nm³/K']
    :g.hold==='pressureT'?['N T (Avogadro, at fixed P and V)',sigf(N*T,6)+' K']:null;
  /* the collision counter against kinetic theory */
  M.hit=hitRateMeasured(w);
  M.hitTh=hitRateTheory(g,true); M.hitId=hitRateTheory(g,false);
  M.hitSd=(M.hit&&M.hit.n>0)?Math.sqrt(M.hit.n)/M.hit.t:null;   /* Poisson */
  if(view==='sweep') M.S=w.sweep;
  return M;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function readoutHTML(M){
  const st=M.st, g=M.g;
  let s='<div class="rname">gases intro<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  s+=hd('the gas')+rrow('heavy, light',M.nH+', '+M.nL+(gasOutside(g)?' (+'+gasOutside(g)+' escaping)':''))
    +rrow('temperature T',fmtT(M.T,st),'good')
    +rrow('pressure, the gauge',g.pOn?fmtP(M.gauge,st):'0 (no wall hit yet)')
    +rrow('P = NkT/V, no noise',fmtP(M.P,st))
    +rrow('width, volume',fmt(M.Wnm,2)+' nm, '+sigf(M.V,4)+' nm³')
    +rrow('mean KE',M.N?sigf(zJ(gasEnergy(g)/M.N),4)+' zJ':'—');
  if(M.view==='laws'||M.view==='pv'){
    s+=hd('hold constant')+rrow('held',holdName(g.hold),'good')
      +(M.inv?rrow(M.inv[0],M.inv[1],'good'):rrow('nothing held','P, V and T all free'));
  }
  if(M.view==='sweep'){
    const S=M.S, L=lawOf(st.law);
    s+=hd(L.name+'’s law — '+(S?(S.done?'done':'step '+(S.i+1)+' of '+S.targets.length+', '+S.phase):'not started'))
      +rrow('holding',holdName(L.hold))
      +rrow('points measured',S?S.pts.length:0,'good');
    if(S&&S.pts.length){
      const v0=S.pts[0].inv; let worst=0;
      for(const p of S.pts) worst=Math.max(worst,Math.abs(p.inv/v0-1));
      s+=rrow(L.inv+', first point',sigf(v0,7)+' '+L.iu,'good')
        +rrow('worst departure over the sweep',worst.toExponential(1),worst<1e-6?'good':'bad');
    }
  }
  s+=hd('the collision counter (wall hits/ps)');
  if(M.hit&&M.hit.n>0){
    s+=rrow('measured, last '+fmt(M.hit.t,1)+' ps',fmt(M.hit.rate,2)+' ± '+fmt(M.hitSd,2),'good')
      +rrow('kinetic theory, with Z',M.hitTh===null?'—':fmt(M.hitTh,2))
      +rrow('… with Z = 1 (no collisions)',M.hitId===null?'—':fmt(M.hitId,2))
      +rrow('measured / theory',M.hitTh?fmt(M.hit.rate/M.hitTh,3):'—',
            (M.hitTh&&Math.abs(M.hit.rate-M.hitTh)<3*M.hitSd)?'good':'');
  } else s+=rrow('measured','run the clock');
  if(st.showWatch||st.showCounter) s+=hd('tools');
  if(st.showWatch) s+=rrow('stopwatch',fmt(g.watch.t,2)+' ps'+(g.watch.on?' (running)':''));
  if(st.showCounter) s+=rrow('PhET’s counter',g.counter.count+' in '+fmt(g.counter.t,2)+' of '+g.counter.period+' ps');
  s+='</table><div class="note">PhET&rsquo;s definitions: T = (2/3)&lang;KE&rang;/k and P = NkT/V with V = width &times; 8.75 nm &times; 4 nm, so PV = NkT holds <i>by construction</i>. The hit rate is the number on this screen that could come out wrong.</div>';
  return s;
}
function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  const h=M.g.hold, hl=(x,on)=>on?'<span class="hl">'+x+'</span>':x;
  if(M.view==='intro')
    return E('P V = N k T &nbsp;&middot;&nbsp; T = (2/3)&lang;KE&rang;/k &nbsp;&middot;&nbsp; <span class="hl">wall hits/ps = 2 n Z &lang;v&rang;/&pi; (a + b)</span>',
      'pump, heat and squeeze: the thermometer and the gauge are averages over the disks, and the counter is the one number kinetic theory has to get right');
  if(M.view==='laws')
    return E(hl('P',h==='pressureV'||h==='pressureT')+' '+hl('V',h==='volume')+' = N k '+hl('T',h==='temperature')+' &nbsp;&middot;&nbsp; k = 8316 AMU pm&sup2;/(ps&sup2; K)',
      'hold one of P, V and T and the other two answer — '+(h==='nothing'?'nothing is held yet':holdName(h)+' is held'));
  if(M.view==='pv')
    return E('<span class="hl">P = N k T / V</span> &nbsp;&middot;&nbsp; an isotherm is a hyperbola P &prop; 1/V &nbsp;&middot;&nbsp; V = w &times; 8750 pm &times; 4000 pm',
      'the state is one point on this plane; hold T and it slides along a hyperbola, hold V and it climbs one, hold P and it runs across them');
  const L=lawOf(M.st.law);
  const eqs={boyle:'P V = <span class="rm">const</span> &nbsp;<span class="rm">(T, N fixed)</span>',
             charles:'V / T = <span class="rm">const</span> &nbsp;<span class="rm">(P, N fixed)</span>',
             gay:'P / T = <span class="rm">const</span> &nbsp;<span class="rm">(V, N fixed)</span>',
             avo:'N T = <span class="rm">const</span> &nbsp;<span class="rm">(P, V fixed)</span>'};
  return E('<span class="hl">'+eqs[L.id]+'</span> &nbsp;&middot;&nbsp; measured by holding '+holdName(L.hold)+' and stepping '+L.x,
    'the line is exact because PhET defines P = NkT/V; what the sweep tests is that the controller reaches the state it claims — and the hit rate beside it is not exact at all');
}
function tagHTML(M){
  if(M.view==='intro') return '<b>the box</b> — PhET&rsquo;s Intro screen: no hold-constant panel';
  if(M.view==='laws') return '<b>the laws</b> — PhET&rsquo;s Laws screen'+(M.g.hold!=='nothing'?', holding '+holdName(M.g.hold):'');
  if(M.view==='pv') return '<b>P against V</b> — the Laws screen&rsquo;s gas on the P&ndash;V plane';
  const S=M.S;
  return '<b>the four laws</b> — '+lawOf(M.st.law).name+(S?(S.done?': '+S.pts.length+' points measured':(S.pts.length?': measuring':': running')):': press run');
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}

/* the house #hint is HTML (bottom: 11px, 11px type) over the canvas's bottom

const HINT_H=18;
function viewGeo(ctx,W,H,M){
  const o=SCENE[M.view], g=M.g, narrow=isNarrow(W);
  const Lx=24, Rres=narrow?16:RO_W+34;
  const cap=captionFor(M);
  /* a scene with its gauges needs ~300 px above the caption, or it takes the
     short caption (the narrow-stage rule: the long caption must not squeeze the
     box until its instruments hang off the canvas) */
  let fit=fitCaption(ctx,W,H-HINT_H,cap[0],cap[1],W-Lx-Rres,stageTop()+(o.gauges?330:230));
  const top=stageTop()+(o.gauges?102:30);
  const nP=narrow?Math.min(1,o.nPlots):o.nPlots;
  /* the caption must describe what is drawn: when the plots do not fit, the
     no-plots caption says what a taller window adds */
  if(nP>0&&!(fit.capY-top>300)){ const c=capFit(ctx,W,H-HINT_H,cap[2],fit.capW); fit={capY:c.capY,txt:cap[2],capW:fit.capW}; }
  let sceneBottom=fit.capY-14, plots=[];
  if(nP>0&&fit.capY-top>300){
    const rowH=Math.max(130,Math.floor((fit.capY-top)*o.plotFrac));
    const rowTop=fit.capY-16-rowH;
    const right=(rowTop<480&&!narrow)?W-Rres:W-26, span=right-Lx, gut=58, pw=(span-gut*nP)/nP;
    for(let i=0;i<nP;i++) plots.push(box(Lx+gut+i*(pw+gut),rowTop+28,pw,rowH-28-40));
    sceneBottom=rowTop-6;
  }
  const below=(o.ruler?26:6)+(o.heater?44:0)+(o.below||0);
  const pumpW=o.pump?84:10;
  const availW=Math.max(60,W-Lx-Rres-pumpW), availH=Math.max(40,sceneBottom-below-top);
  const s=Math.max(0.002,Math.min(availW/o.maxW,availH/g.H));
  /* the instruments hang left of the right wall: keep 170 px for them */
  const xR=Lx+Math.max(o.maxW*s,o.gauges?170:0), yB=top+g.H*s;
  const G={s, xR, yT:top, yB, X:x=>xR+x*s, Y:y=>yB-y*s, wx:X=>(X-xR)/s, wy:Y=>(yB-Y)/s, narrow};
  const wDraw=(dragPauses(M)&&M.w.dragW!==null)?M.w.dragW:g.W;
  G.xL=xR-wDraw*s; G.wDraw=wDraw;
  G.handle={x:G.xL-16,y:(top+yB)/2-22,w:11,h:44};
  if(g.lid&&g.lid.on){ const oL=g.left-GAS.WALL+g.lid.width; G.lidX=G.X(oL); G.lidKnob={x:G.X(oL)-30,y:top-15,w:26,h:11}; }
  if(o.pump){
    const bh=Math.min(150,Math.max(60,0.55*(yB-top))), bx=xR+34;
    G.pump={x:bx,y:yB-bh,w:24,h:bh,travel:0.55*bh};
    const hy=G.pump.y-10-G.pump.travel*(1-M.w.pump.h);
    G.pumpHandle={x:bx-16,y:hy-8,w:56,h:10};
  }
  if(o.gauges){
    G.gauge={cx:xR-40,cy:top-52,R:Math.min(34,0.45*(top-stageTop()-20))};
    G.thermo={x:xR-128,yb:top-8,h:Math.min(74,top-stageTop()-26)};
  }
  if(o.heater) G.heater={x:G.X(-GAS.WMIN)+8,y:yB+(o.ruler?26:8),w:GAS.WMIN*s-16,h:30};
  G.plots=plots; G.capY=fit.capY; G.capTxt=fit.txt; G.capW=fit.capW; G.Lx=Lx;
  return G;
}

function drawContainer(ctx,G,M){

function drawParticles(ctx,G,g,dim){

      const X=G.X(g.x[i]), Y=G.Y(g.y[i]); ctx.moveTo(X+R,Y); ctx.arc(X,Y,R,0,TAU); any=true; }
    if(any){ ctx.globalAlpha=dim?0.5:1; ctx.fillStyle=k?COL.light:COL.heavy; ctx.fill(); ctx.globalAlpha=1; }
  }

/* ---- a small time-series plot ------------------------------------------------- */
/* An auto-ranged axis must never be narrower than its endpoints' rounding:
   the shared ticksFor() steps t += step, and when the span is ~1e-16 of the
   values (two species' energy ratios that are 1 to rounding) t never advances
   and the loop spins for ever.  Widen any such range before asking for ticks. */
function niceRange(lo,hi){
  const sc=Math.max(Math.abs(lo),Math.abs(hi),1e-300);
  if(!(hi-lo>1e-9*sc)){ const m=(lo+hi)/2, d=Math.max(0.05*Math.abs(m),1e-6); return [m-d,m+d]; }
  return [lo,hi];
}
function plotSeries(ctx,W,H,b,title,short,xs,series,opt){
  opt=opt||{};
  let x0=Infinity, x1=-Infinity, y0=opt.y0, y1=opt.y1;
  for(const x of xs) if(isFinite(x)){ if(x<x0) x0=x; if(x>x1) x1=x; }
  if(!isFinite(x0)){ x0=0; x1=1; }
  if(opt.x0!==undefined) x0=opt.x0; if(opt.x1!==undefined) x1=opt.x1;
  if(!(x1>x0)) x1=x0+1;
  if(y0===undefined||y1===undefined){
    let lo=Infinity, hi=-Infinity;
    for(const S of series) for(const v of S.ys) if(isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; }
    for(const r of (opt.refs||[])) if(isFinite(r.y)){ if(r.y<lo) lo=r.y; if(r.y>hi) hi=r.y; }
    if(!(hi>lo)){ lo=isFinite(lo)?lo-1:0; hi=isFinite(hi)?hi+1:1; }
    const pad=0.08*(hi-lo); if(y0===undefined) y0=lo-pad; if(y1===undefined) y1=hi+pad;
  }
  [x0,x1]=niceRange(x0,x1); [y0,y1]=niceRange(y0,y1);
  axesR(ctx,b,x0,x1,y0,y1,{title:titleFor(b,title,short||title),xlab:opt.xlab,ylab:opt.ylab,
    xticks:sparseTicks(x0,x1,b.w),yticks:sparseTicks(y0,y1,b.h),xfmt:tickFmt(x0,x1,b.w),yfmt:tickFmt(y0,y1,b.h)});
  for(const r of (opt.refs||[])) if(isFinite(r.y)) polyline(ctx,b,[x0,x1],[r.y,r.y],x0,x1,y0,y1,r.col||COL.ref,r.lw||1.4,r.dash);
  for(const S of series){
    if(xs.length>1) polyline(ctx,b,xs,S.ys,x0,x1,y0,y1,S.col,S.lw||1.7,S.dash);
    else if(xs.length===1&&isFinite(S.ys[0])) marker(ctx,b,x0,x1,y0,y1,xs[0],S.ys[0],S.col);
  }
  if(opt.note) plotNote(ctx,W,H,b,opt.note);
  return {x0,x1,y0,y1};
}
/* a note in the middle of a plot, on a patch of the canvas ground so a
   reference line through the middle (the diffusion plot's dashed zero) does
   not strike it through */
function plotNote(ctx,W,H,b,txt){
  const w=plain(txt).length*11*0.52+10, x=b.x+b.w/2, y=b.y+b.h/2;
  ctx.fillStyle='#070b18'; ctx.fillRect(x-w/2,y-9,w,18);
  lab(ctx,W,H,x,y,txt,COL.dim,'11px -apple-system, sans-serif','center','middle');
}
function tickFmt(lo,hi,px){
  const t=sparseTicks(lo,hi,px); let d=Infinity; for(let i=1;i<t.length;i++) d=Math.min(d,t[i]-t[i-1]);
  const dec=!isFinite(d)||d>=1?0:Math.min(4,Math.ceil(-Math.log10(d)+1e-9));
  return v=>Math.abs(v)<1e-12?'0':v.toFixed(dec);
}
function emptyNote(ctx,W,H,b,txt){ plotNote(ctx,W,H,b,txt); }
