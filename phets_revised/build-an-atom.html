<title>Build an atom &mdash; three integers and one table</title>
<!--
  ===================================================================
  build-an-atom.html — a remake of PhET's Build an Atom: drop protons,
  neutrons and electrons into a nucleus and watch the element, the
  mass number, the charge and the stability follow
  ===================================================================

  Remake of PhET Interactive Simulations' Build an Atom (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0).  New code; no PhET
  code or assets.  Built against PhET's build-an-atom 1.9.3: all three
  of its screens (Atom, Symbol, Game), its three buckets of 10 protons,
  13 neutrons and 10 electrons, its orbits/cloud model switch, its
  Element Name / Neutral Atom or Ion / Nuclear Stability displays, its
  periodic table, its two charge-sign conventions, and its four game
  levels of five challenges scored 2 and 1 — with its data tables and
  its view constants read out of the minified original.

  SIX VIEWS.  THE ATOM is PhET's first screen: the buckets, the
  nucleus, the shells or the cloud, and the four things the counts
  determine.  THE SYMBOL is its second: the same atom written as a
  nuclear symbol, mass number over atomic number with the charge on
  the shoulder.  THE GAME is its third: four levels, five challenges,
  seeded so a level can be replayed exactly.  THE COUNTING is the
  whole space the buckets can reach — 1694 configurations — with the
  census that makes the three rules checkable rather than merely
  stated.  THE CHART OF NUCLIDES puts PhET's whole stability table on
  the (N, Z) plane beside an independent one.  MASS AND BINDING is the
  measured data: isotope masses, natural abundances, the standard
  atomic weight as their mean, and the binding energy those masses
  imply.

  WHAT IS EXACT HERE
  ------------------
  The three rules are arithmetic on three integers and are exact by
  construction: the element IS the proton count, A = Z + N, q = Z - e.
  selfTest walks all 11 x 14 x 11 = 1694 configurations the buckets
  allow and checks every one of them against an independently written
  expression, so "exact across the whole range the sim allows" is a
  measurement and not a claim.  The charge strings, the ion wording,
  the shell filling (2 then 8), PhET's cloud radius
  r(e) = 42.5 + 8.75 e and its ten electron slots are pinned against
  the values read out of the original.  The game's generator is a
  seeded mulberry32 reproduced bit for bit in Python, and 16 000
  generated levels are checked for solvability, for the no-repeat rule
  and for PhET's Z ranges; the scoring is integer arithmetic and is
  asserted on every path through a level.

  WHAT IS MEASURED, AND BY WHOM
  -----------------------------
  Stability is NOT a formula.  Which (Z, N) combinations are stable is
  a table, and the one this file uses is PhET's own
  stableElementTable — 244 nuclides, Z = 1 to 82 — read out of
  SHRED's AtomIdentifier.  It is cross-checked here against an
  independent table (NUBASE half-lives and NIST isotopic compositions,
  by way of this repo's own periodic_table.html), whose criterion is
  "occurs in nature and has never been observed to decay": 253
  nuclides.  The two agree on 243.  PhET alone calls germanium-76
  stable, which has a measured double-beta half-life of 1.9e21 yr; the
  independent table alone calls ten more stable (Cr-50, Zn-70, Te-123,
  Xe-124, Xe-134, Ba-132, Ce-138, Ce-142, W-183, Pb-204), every one of
  them a nuclide whose predicted decay has never been seen.  Below
  Z = 24 the two are IDENTICAL, so over everything this sim can build
  the stability data is not in dispute.  Both stop at lead: neither
  calls bismuth-209 stable, and its 2.0e19 yr alpha decay is why.
  Both give technetium and promethium no stable isotope at all.

  Isotope atomic masses and natural abundances are PhET's own tables
  (Z = 1 to 18), which come from AME/NIST; they agree with the
  independent mass excesses to 1.6e-6 u and with the NIST abundances
  to 3.2e-3 percentage points, and the resulting binding energies per
  nucleon agree to 1.6e-4 MeV, which is why B/A is quoted to three
  decimals.  Standard atomic weights are PhET's standardMassTable;
  Sigma(abundance x mass) reproduces them to 1.4e-4 relative, worst at
  lithium, whose isotopic composition genuinely varies between natural
  sources.  The neutron mass and the u-to-MeV conversion are CODATA
  2022 through scipy.constants.  The atomic radii used for the scale
  note are PhET's own (the Clementi calculated radii: hydrogen's is
  the Bohr radius), and the nuclear radius is the textbook
  1.2 A^(1/3) fm; every exaggeration factor is printed on the canvas
  for the nuclide on screen.

  The game's fallback is PhET's: when the filtered pool of atoms is
  empty it reuses one already posed.  That path is reachable exactly
  once in 16 000 generated levels — level 2 at seed 2691, whose five
  all-schematic challenges exhaust the four charged atoms with Z < 3 —
  and the suite asserts that RATE rather than forbidding the
  behaviour.

  NOT MODELLED
  ------------
  No nuclear physics: nothing here computes why a nuclide is stable,
  and the file says so on the canvas — the binding-energy curve is
  drawn FROM the measured masses, not from a mass formula.  No
  chemistry: the electron shells are PhET's two-then-eight cartoon,
  not orbitals, and nothing decides whether an ion is one a chemist
  would meet.  No decay: an unstable nucleus here sits there being
  unstable.  No electron binding energy in the mass arithmetic (it is
  eV-scale against MeV-scale nuclear binding, which is why B/A is
  quoted to three decimals).  PhET's particle animation, its sound and
  its accessibility layer are not reproduced.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's tables and constants: build/build-an-atom/extract_phet.py
  reads them out of docs/phets/build-an-atom_en.html (1.9.3) —
  stableElementTable, numNeutronsInMostCommonIsotope,
  standardMassTable, the isotope table, the symbol and element-name
  strings, the atomic radii, the bucket sizes, the shell radii and the
  ten slots, the cloud law, the two capture radii, the four
  AtomValuePool challenge pools and the scoring constants.  The
  independent nuclide table and the periodic-table layout come from
  projects/simulations/periodic_table.html (NUBASE via mendeleev/IAEA;
  NIST Atomic Weights and Isotopic Compositions).  Every reference
  number selfTest asserts against is a line of
  build/build-an-atom/_out/refvals.txt, emitted into p7_refs.js by
  make_refs.py from derive.py — nothing is transcribed by hand.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* canvas has no markup: an exponent written 'x10^-14' draws the caret.
     Digit superscripts are safe in the rasteriser's font (letter ones are
     not -- Known-bad, greenhouse-effect), so build one. */
  if(a>=1e5||a<1e-4){
    const m=x.toExponential(n-1).split('e');
    const d='\u2070\u00b9\u00b2\u00b3\u2074\u2075\u2076\u2077\u2078\u2079';
    let e=parseInt(m[1],10), s=(e<0?'\u207b':'');
    for(const ch of String(Math.abs(e))) s+=d[+ch];
    return m[0]+'\u00d710'+s;
  }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop
   in a naive generator (sbs_sims Known-bad) — return [] instead */
function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;
  for(let e=e0;e<=e1;e+=step){ const v=Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out;

function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};

  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  /* a legend wider or taller than its own panel has no corner that is inside
     it: legendAuto would then place it OUTSIDE, on top of the neighbouring
     axis tick labels (found on a 110 px rates panel at 560x380).  A legend
     that does not fit is not drawn; the caption names the colours.
     (Known-bad: a legend that finds no clear corner is dropped, not forced.) */
  if(bw > b.w - 16 || bh > b.h - 16) return null;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    /* and LABELS, not only curves: the shipped helper dodged POLY_SEGS alone,
       so a legend could sit on the very marker its own entry was naming
       (Known-bad, models-of-the-hydrogen-atom).  LABEL_RECTS is this file's
       registry of every label already drawn. */
    if(!hit && typeof LABEL_RECTS !== 'undefined')
      for(const r of LABEL_RECTS){
        if(r.x+r.w<cx||r.x>cx+bw||r.y+r.h<cy||r.y>cy+bh) continue;
        hit=true; break;
      }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped

function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};

/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));

/* axes() puts the lowest y-tick label centred on b.y1 and the leftmost x-tick

   smear.  Dropping the edge tick is cheaper than moving either label. */

 *  the model                                                          *
 *                                                                     *
 *  Everything in this block is EXACT arithmetic on three integers.    *
 *  The element is the proton count, the mass number is protons plus   *
 *  neutrons, the net charge is protons minus electrons, and whether   *
 *  the nucleus is stable is a LOOKUP, not a formula -- which is the    *
 *  one thing about this sim that cannot be derived and has to be       *
 *  measured.  PhET's own numbers are marked PHET.                      *
 * ================================================================== */

  version: '1.9.3',
  numProtons: 10,          /* the three buckets, read out of BAAModel      */
  numNeutrons: 13,
  numElectrons: 10,
  maxElectrons: 10,        /* ShredConstants.MAX_ELECTRONS                 */
  innerShell: 85,          /* ParticleAtom innerElectronShellRadius        */
  outerShell: 130,         /* ...outerElectronShellRadius                  */
  nucleonRadius: 10,       /* ShredConstants.NUCLEON_RADIUS                */
  electronRadius: 8,       /* ShredConstants.ELECTRON_RADIUS               */

/* ---- the three rules, and the table ---- */
function elementSymbol(z){ return (z >= 1 && z < SYMBOL.length) ? SYMBOL[z] : '-'; }
function elementName(z){ return (z >= 1 && z < ENAME.length) ? ENAME[z] : ''; }
function massNumber(p, n){ return p + n; }
function netCharge(p, e){ return p - e; }
/* PhET's AtomIdentifier.isStable: the table is indexed by Z and lists the
   NEUTRON numbers, so it is a membership test and nothing more. */
function isStable(p, n){
  const row = (p >= 0 && p < STABLE.length) ? STABLE[p] : undefined;
  return row !== undefined && row.indexOf(n) >= 0;
}
/* PhET's nucleusStableProperty: an atom with no nucleons at all is not called
   unstable.  Keep the two apart -- the label and the jiggle both read this. */
function nucleusStable(p, n){ return (p + n === 0) ? true : isStable(p, n); }
function hasNucleus(p, n){ return p + n > 0; }

/* PhET ships both sign conventions as a preference: signLast is the default
   and is the one chemistry writes (2+, 3-), signFirst is +2, -2. */
function chargeString(q, signFirst){
  if(q === 0) return '0';
  const a = Math.abs(q), s = q < 0 ? '−' : '+';
  return signFirst ? s + a : a + s;
}
function ionWord(q){ return q === 0 ? 'neutral atom' : (q > 0 ? 'positive ion' : 'negative ion'); }

/* ---- the drawn atom: PhET's shell geometry ---- */
/* 10 slots: two on the inner shell at +-r, eight on the outer shell starting
   at pi/8 x 1.2 and stepping 2pi/8.  Read out of ParticleAtom. */
function electronSlots(){
  const out = [{x: PHET.innerShell, y: 0, shell: 0}, {x: -PHET.innerShell, y: 0, shell: 0}];
  let a = PI / 8 * 1.2;
  for(let k = 0; k < 8; k++){
    out.push({x: Math.cos(a) * PHET.outerShell, y: Math.sin(a) * PHET.outerShell, shell: 1});
    a += TAU / 8;
  }
  return out;
}
/* PhET's ElectronCloudView: radius grows linearly from half the inner shell to
   the outer shell over MAX_ELECTRONS, and is exactly zero with no electrons. */
function cloudRadius(e){
  if(e <= 0) return 0;
  const i = 0.5 * PHET.innerShell;
  return i + (PHET.outerShell - i) / PHET.maxElectrons * e;
}
function shellCounts(e){ return [Math.min(e, 2), Math.max(0, Math.min(e, 10) - 2)]; }

/* A deterministic nucleon packing: concentric rings of touching discs, the
   innermost first.  This is NOT PhET's spiral -- it is drawn here, and the
   only thing asserted about it is that no two nucleons overlap and every one
   is inside the drawn nucleus. */
function nucleonLayout(count, r){
  const out = [];
  if(count <= 0) return out;
  if(count === 1){ out.push([0, 0]); return out; }
  if(count === 2){ out.push([-r * 0.86, 0], [r * 0.86, 0]); return out; }
  if(count === 3){
    for(let k = 0; k < 3; k++){
      const a = -PI / 2 + k * TAU / 3;
      out.push([r * 1.02 * Math.cos(a), r * 1.02 * Math.sin(a)]);
    }
    return out;
  }
  if(count === 4){
    for(let k = 0; k < 4; k++){
      const a = PI / 4 + k * TAU / 4;
      out.push([r * 1.12 * Math.cos(a), r * 1.12 * Math.sin(a)]);
    }
    return out;
  }
  out.push([0, 0]);
  let placed = 1, ring = 1;
  while(placed < count){
    const rad = ring * r * 1.78;
    const cap = Math.max(1, Math.floor(TAU * rad / (2 * r * 0.98)));
    const take = Math.min(cap, count - placed);
    const a0 = ring * 1.3;
    for(let k = 0; k < take; k++){
      const a = a0 + k * TAU / take;
      out.push([rad * Math.cos(a), rad * Math.sin(a)]);
    }
    placed += take; ring++;
    if(ring > 40) break;
  }
  return out;
}
/* the radius of the drawn nucleus: PhET grows it with the nucleon count, and
   so does this -- the packing above fills rings of spacing 1.78 r */
function nucleusRadius(count, r){
  if(count <= 1) return r;
  const L = nucleonLayout(count, r);
  let m = 0;
  for(const p of L) m = Math.max(m, Math.sqrt(p[0] * p[0] + p[1] * p[1]));
  return m + r;
}

/* ---- how far from scale the picture is ---- */
/* the ONE length in the file.  PhET's atomic radii are the Clementi
   calculated radii (hydrogen's is the Bohr radius, 53 pm), and a nuclear
   radius is the textbook 1.2 A^(1/3) fm.  The drawing's nucleus-to-atom ratio
   is nucleonRadius / outerShell = 1/13, so the exaggeration is the ratio of
   the two, and it is printed on the canvas for the nuclide on screen. */
const R0_FM = 1.2;
function nuclearRadiusFm(a){ return a > 0 ? R0_FM * Math.pow(a, 1 / 3) : 0; }
function atomRadiusPm(z){ return (z >= 1 && z < ARAD.length) ? ARAD[z] : null; }
function trueNucleusFraction(z, a){
  const R = atomRadiusPm(z);
  return (R == null || !(a > 0)) ? null : nuclearRadiusFm(a) * 1e-15 / (R * 1e-12);
}
function drawnNucleusFraction(){ return PHET.nucleonRadius / PHET.outerShell; }
function nucleusExaggeration(z, a){
  const f = trueNucleusFraction(z, a);
  return f == null ? null : drawnNucleusFraction() / f;
}

/* ---- measured data ---- */
function isotopesOf(z){
  const d = ISOT[String(z)];
  if(!d) return [];
  const out = [];
  for(const a in d) out.push({A: +a, mass: d[a][0], ab: d[a][1]});
  out.sort((x, y) => x.A - y.A);
  return out;
}
/* PhET flags an isotope that exists only in trace amounts with the sentinel
   abundance 1e-12 (AtomIdentifier.existsInTraceAmounts tests for exactly
   that).  It is a marker, not a measurement, so it never enters a sum. */
const TRACE = 1e-12;
function isTrace(ab){ return ab === TRACE; }
function naturalAbundance(z, a){
  const d = ISOT[String(z)];
  if(!d || !d[String(a)]) return 0;
  const ab = d[String(a)][1];
  return isTrace(ab) ? 0 : ab;
}
function isotopeMass(z, a){
  const d = ISOT[String(z)];
  return (d && d[String(a)]) ? d[String(a)][0] : null;
}
/* sum(abundance x atomic mass) -- the definition of the standard atomic
   weight, evaluated on PhET's own isotope table */
function weightedMass(z){
  let s = 0, w = 0;
  for(const it of isotopesOf(z)){
    if(isTrace(it.ab)) continue;
    s += it.ab * it.mass; w += it.ab;
  }
  return w > 0 ? s : null;
}
function abundanceSum(z){
  let w = 0;
  for(const it of isotopesOf(z)) if(!isTrace(it.ab)) w += it.ab;
  return w;
}
function standardWeight(z){ return (z >= 1 && z < SMASS.length) ? SMASS[z] : null; }

/* CODATA 2022 through scipy.constants, pinned in selfTest against derive.py */
const M_NEUTRON_U = 1.00866491606;
const U_MEV = 931.49410372;
function mH1(){ return isotopeMass(1, 1); }
/* B = [Z m(1H) + N m_n - m(A,Z)] c^2.  The atomic masses carry Z electrons
   each and m(1H) carries one, so the electron masses cancel; what does not
   cancel is the electron BINDING energy, which is eV-scale here and is the
   reason this is quoted to three decimals and not six. */
function bindingMeV(z, a, mass){
  if(mass == null) return null;
  return (z * mH1() + (a - z) * M_NEUTRON_U - mass) * U_MEV;
}
function bindingPerNucleon(z, a){
  const m = isotopeMass(z, a);
  if(m == null || a <= 0) return null;
  return bindingMeV(z, a, m) / a;
}
/* the same quantity from the INDEPENDENT mass excesses, which is how the
   chart view reaches nuclides PhET's own table (Z <= 18) does not carry */
const EXC_BY = (function(){
  const m = {};
  for(const r of DEXC) m[r[0] + ':' + r[1]] = r[2];
  return m;
})();
function massFromExcess(z, a){
  const d = EXC_BY[z + ':' + a];
  return d === undefined ? null : a + d / (U_MEV * 1000);
}
function bindingPerNucleonExc(z, a){
  const m = massFromExcess(z, a);
  if(m == null || a <= 0) return null;
  return bindingMeV(z, a, m) / a;
}

/* ---- the chart of nuclides ---- */
function stableList(){
  const out = [];
  for(let z = 0; z < STABLE.length; z++) for(const n of STABLE[z]) out.push([z, n]);
  return out;
}
function stableCount(){ let c = 0; for(const r of STABLE) c += r.length; return c; }
function elementsWithNoStable(){
  const out = [];
  for(let z = 1; z < STABLE.length; z++) if(STABLE[z].length === 0) out.push(z);
  return out;
}
function heaviestStable(){
  let best = null;
  for(let z = 0; z < STABLE.length; z++) for(const n of STABLE[z])
    if(!best || z + n > best[0] + best[1]) best = [z, n];
  return best;
}
/* the even/odd census -- 140 even-even against 4 odd-odd is the pairing term
   of the semi-empirical mass formula, visible as a bare count */
function parityCensus(){
  const c = {ee: 0, eo: 0, oe: 0, oo: 0, oddOdd: []};
  for(const [z, n] of stableList()){
    const k = (z % 2 === 0 ? 'e' : 'o') + (n % 2 === 0 ? 'e' : 'o');
    c[k]++;
    if(k === 'oo') c.oddOdd.push([z, n]);
  }
  return c;
}

/* ---- the exhaustive census over the buckets ---- */
function bucketCensus(){
  return memo('census', 'fixed', () => {
    let tot = 0, neutral = 0, ions = 0, stable = 0;
    const pn = [];
    for(let p = 0; p <= PHET.numProtons; p++){
      for(let n = 0; n <= PHET.numNeutrons; n++){
        if(p > 0 && isStable(p, n)) pn.push([p, n]);
        for(let e = 0; e <= PHET.numElectrons; e++){
          tot++;
          if(p === e){ if(p + n + e > 0) neutral++; } else ions++;
          if(hasNucleus(p, n) && isStable(p, n)) stable++;
        }
      }
    }
    return {total: tot, neutral: neutral, ions: ions, stableConfigs: stable, stablePN: pn};
  });
}

/* mulberry32 -- reproduced bit for bit in build/build-an-atom/derive.py, so
   the challenge sets the JS builds are the ones Python asserts. */
function mulberry32(seed){
  let a = seed | 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), a | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* PhET's four level type lists (ChallengeDescriptorSetFactory) */
const GAME_TYPES = [
  ['schematic-to-element', 'counts-to-element'],
  ['schematic-to-charge', 'schematic-to-mass-number',
   'counts-to-charge', 'counts-to-mass-number'],
  ['schematic-to-symbol-charge', 'schematic-to-symbol-mass-number',
   'schematic-to-symbol-proton-count', 'counts-to-symbol-charge',
   'counts-to-symbol-mass-number'],
  ['schematic-to-symbol-all', 'symbol-to-schematic', 'symbol-to-counts',
   'counts-to-symbol-all'],
];
const SCHEMATIC_TYPES = ['schematic-to-element', 'schematic-to-charge',
  'schematic-to-mass-number', 'schematic-to-symbol-all',
  'schematic-to-symbol-proton-count', 'schematic-to-symbol-charge',
  'schematic-to-symbol-mass-number', 'symbol-to-schematic'];
const CHARGE_TYPES = ['schematic-to-charge', 'counts-to-charge',
  'counts-to-symbol-charge', 'schematic-to-symbol-charge'];
function isSchematicType(t){ return SCHEMATIC_TYPES.indexOf(t) >= 0; }
function isChargeType(t){ return CHARGE_TYPES.indexOf(t) >= 0; }

/* what the question SHOWS and what it ASKS for */
function questionMode(t){
  if(t.indexOf('schematic-to') === 0) return 'schematic';
  if(t.indexOf('counts-to') === 0) return 'counts';
  return 'symbol';
}
function answerFields(t){
  if(t === 'schematic-to-element' || t === 'counts-to-element') return ['element'];
  if(t === 'schematic-to-charge' || t === 'counts-to-charge') return ['charge'];
  if(t === 'schematic-to-mass-number' || t === 'counts-to-mass-number') return ['mass'];
  if(t === 'schematic-to-symbol-charge' || t === 'counts-to-symbol-charge') return ['charge'];
  if(t === 'schematic-to-symbol-mass-number' || t === 'counts-to-symbol-mass-number') return ['mass'];
  if(t === 'schematic-to-symbol-proton-count') return ['protons'];
  if(t === 'schematic-to-symbol-all' || t === 'counts-to-symbol-all') return ['protons', 'mass', 'charge'];
  if(t === 'symbol-to-schematic' || t === 'symbol-to-counts') return ['protons', 'neutrons', 'electrons'];
  throw new Error('unknown challenge type ' + t);
}
function fieldValue(field, atom){
  const p = atom[0], n = atom[1], e = atom[2];
  if(field === 'element' || field === 'protons') return p;
  if(field === 'neutrons') return n;
  if(field === 'electrons') return e;
  if(field === 'mass') return massNumber(p, n);
  if(field === 'charge') return netCharge(p, e);
  throw new Error('unknown answer field ' + field);
}
const FIELD_RANGE = {element: [1, 18], protons: [0, 18], neutrons: [0, 22],
                     electrons: [0, 18], mass: [0, 40], charge: [-10, 10]};
/* A challenge is SOLVABLE when every field it asks for is determined by the
   question and reachable with the answer controls.  Asserted over every seed
   in a sweep, because a generator that can emit an unanswerable puzzle is the
   one bug a game cannot survive. */
function challengeSolvable(t, atom){
  for(const f of answerFields(t)){
    const v = fieldValue(f, atom), r = FIELD_RANGE[f];
    if(!(v >= r[0] && v <= r[1])) return false;
    if(!isFinite(v)) return false;
  }
  return true;
}
function correctAnswer(t, atom){
  const out = {};
  for(const f of answerFields(t)) out[f] = fieldValue(f, atom);
  return out;
}
function answerMatches(t, atom, given){
  for(const f of answerFields(t)) if(given[f] !== fieldValue(f, atom)) return false;
  return true;
}

/* PhET's selection rules: a type is never repeated back to back; a schematic
   challenge draws an atom with Z < 3 so the picture stays readable, every
   other type takes Z >= 4; a charge question asks for a charged atom half the
   time; and an atom is not reused until the pool runs out. */
function makeChallengeSet(level, seed){
  const types = GAME_TYPES[level];
  const remaining = GAME_POOLS[level].map(a => a.slice());
  const used = [];
  const rnd = mulberry32(seed);
  const out = [];
  let prev = null;
  for(let k = 0; k < PHET.challengesPerLevel; k++){
    let i = Math.floor(rnd() * types.length);
    let t = types[i];
    if(prev !== null && t === prev){ i = (i + 1) % types.length; t = types[i]; }
    const lo = isSchematicType(t) ? 0 : 4;
    const hi = isSchematicType(t) ? 3 : 1e9;
    const need = isChargeType(t) ? (rnd() >= 0.5) : false;
    const fits = a => a[0] >= lo && a[0] < hi && (!need || a[0] - a[2] !== 0);
    let ok = remaining.filter(fits);
    if(!ok.length) ok = used.filter(fits);
    if(!ok.length) throw new Error('no atom matches ' + t);
    const a = ok[Math.floor(rnd() * ok.length)];
    const j = remaining.indexOf(a);
    if(j >= 0){ remaining.splice(j, 1); used.push(a); }
    out.push({type: t, atom: a.slice()});
    prev = t;
  }
  return out;
}
function pointsFor(attempt){
  return attempt === 1 ? PHET.pointsFirst : (attempt === 2 ? PHET.pointsSecond : 0);
}
function perfectScore(){ return PHET.challengesPerLevel * PHET.pointsFirst; }

const MEMO = {};
function memo(name, key, fn){
  const e = MEMO[name];
  if(e && e.key === key) return e.val;
  const val = fn();
  MEMO[name] = {key: key, val: val};
  return val;
}

/* ---- the game's run state, which is not a control ---- */
const GAME = {phase: 'idle', level: 1, seed: 0, set: [], idx: 0, attempt: 1,
              score: 0, given: {}, history: [], best: [0, 0, 0, 0]};
function gameReset(st){
  GAME.phase = 'idle'; GAME.level = st.level; GAME.seed = st.gseed;
  GAME.set = []; GAME.idx = 0; GAME.attempt = 1; GAME.score = 0;
  GAME.given = {}; GAME.history = [];
}
/* the seed a level actually runs on: the control's seed mixed with the level
   number, so the four levels of one seed are four independent runs rather
   than four readings of the same random stream.  Kept as a function, and
   stored in GAME.seed, so the mixing is observable state and not something
   buried in an argument (the mutation sweep found the argument version
   untestable). */
function levelSeed(gseed, level){ return (gseed + level * 7919) | 0; }
function gameStart(st){
  GAME.level = st.level;
  GAME.seed = levelSeed(st.gseed, st.level);
  GAME.set = makeChallengeSet(st.level - 1, GAME.seed);
  GAME.idx = 0; GAME.attempt = 1; GAME.score = 0; GAME.history = [];
  GAME.phase = 'ask';
  gameClearAnswer();
}
function gameCurrent(){
  return (GAME.phase === 'idle' || GAME.idx >= GAME.set.length) ? null : GAME.set[GAME.idx];
}
function gameClearAnswer(){
  const c = gameCurrent();
  GAME.given = {};
  if(!c) return;
  /* a blank answer starts at the bottom of each field's range, except the
     charge, whose natural blank is zero and not -10 */
  for(const f of answerFields(c.type))
    GAME.given[f] = (f === 'charge') ? 0 : FIELD_RANGE[f][0];
}
function gameCheck(){
  const c = gameCurrent();
  if(!c || GAME.phase !== 'ask') return null;
  if(answerMatches(c.type, c.atom, GAME.given)){
    GAME.score += pointsFor(GAME.attempt);
    GAME.history.push(GAME.attempt);
    GAME.phase = 'right';
    return true;
  }
  if(GAME.attempt === 1){ GAME.attempt = 2; GAME.phase = 'wrong'; return false; }
  GAME.history.push(0);
  GAME.phase = 'shown';
  return false;
}
function gameRetry(){ if(GAME.phase === 'wrong') GAME.phase = 'ask'; }
function gameNext(){
  if(GAME.phase !== 'right' && GAME.phase !== 'shown') return;
  GAME.idx++;
  GAME.attempt = 1;
  if(GAME.idx >= GAME.set.length){
    GAME.phase = 'done';
    const li = GAME.level - 1;
    if(GAME.score > GAME.best[li]) GAME.best[li] = GAME.score;
  } else { GAME.phase = 'ask'; gameClearAnswer(); }
}

const FRAME = {jig: 0};

/* ================================================================== *
 *  the model                                                          *
 * ================================================================== */
function buildModel(st){
  st = st || ST;
  const p = st.p | 0, n = st.n | 0, e = st.e | 0;
  const A = massNumber(p, n), q = netCharge(p, e);
  const stable = isStable(p, n), nuc = hasNucleus(p, n);
  const sym = elementSymbol(p), name = elementName(p);
  const M = {
    view: st.view,
    p: p, n: n, e: e, A: A, q: q,
    sym: sym, name: name,
    hasNuc: nuc,
    stable: stable,
    nucleusStable: nucleusStable(p, n),
    ion: ionWord(q),
    chargeStr: chargeString(q, st.notation === 'first'),
    shells: shellCounts(e),
    cloudR: cloudRadius(e),
    leftP: PHET.numProtons - p, leftN: PHET.numNeutrons - n, leftE: PHET.numElectrons - e,
    mass: isotopeMass(p, A),
    abundance: naturalAbundance(p, A),
    trace: (function(){ const d = ISOT[String(p)]; return !!(d && d[String(A)] && isTrace(d[String(A)][1])); })(),
    weighted: weightedMass(p),
    standard: standardWeight(p),
    BperA: bindingPerNucleon(p, A),
    B: (isotopeMass(p, A) == null) ? null : bindingMeV(p, A, isotopeMass(p, A)),
    census: bucketCensus(),
    parity: memo('parity', 'fixed', parityCensus),
    heaviest: memo('heaviest', 'fixed', heaviestStable),
    nStable: memo('nstable', 'fixed', stableCount),
    noStable: memo('nostable', 'fixed', elementsWithNoStable),
    st: st,
  };
  return M;
}

/* ---- the floating readout ---- */
function hd(t){ return '<tr><td class="hd" colspan="2">' + t + '</td></tr>'; }
function row(k, v, cls){
  return '<tr><td>' + k + '</td><td class="v' + (cls ? ' ' + cls : '') + '">' + v + '</td></tr>';
}
function nuclideName(M){
  if(!M.hasNuc) return 'no nucleus yet';
  if(M.p === 0) return M.n + ' neutron' + (M.n === 1 ? '' : 's') + ', no protons';
  return M.name + '&ndash;' + M.A;
}
function readoutHTML(M){
  const st = M.st;
  let s = '<div class="rname">' + nuclideName(M)
        + '<small>' + (M.hasNuc ? (M.p === 0 ? 'not an element &mdash; an element needs a proton'
                                             : M.sym + ', ' + M.ion) : 'drag particles in')
        + '</small></div><table>';
  s += hd('the counts');
  s += row('protons', M.p + ' <span style="color:' + COL.proton + '">&#9679;</span>');
  s += row('neutrons', M.n + ' <span style="color:' + COL.neutron + '">&#9679;</span>');
  s += row('electrons', M.e + ' <span style="color:' + COL.electron + '">&#9679;</span>');
  s += hd('what follows from them');
  s += row('element', M.p ? M.name + ' (' + M.sym + ')' : '&mdash;');
  s += row('mass number A', M.hasNuc ? String(M.A) : '&mdash;');
  s += row('net charge', M.chargeStr, M.q === 0 ? 'good' : '');
  s += row('neutral or ion', M.hasNuc || M.e ? M.ion : '&mdash;');
  s += row('nucleus', M.hasNuc ? (M.stable ? 'stable' : 'unstable') : '&mdash;',
           M.hasNuc ? (M.stable ? 'good' : 'bad') : '');
  if(M.p >= 1 && M.p <= 18){
    s += hd('measured, for this nuclide');
    s += row('atomic mass', M.mass == null ? 'not in the table'
             : sigf(M.mass, 10) + ' u');
    s += row('natural abundance', M.mass == null ? '&mdash;'
             : (M.trace ? 'traces only' : (M.abundance > 0 ? fmt(100 * M.abundance, 4) + ' %'
                                                           : 'none')));
    s += row('binding energy / A', M.BperA == null ? '&mdash;' : fmt(M.BperA, 3) + ' MeV');
    s += row('standard weight', M.standard == null ? '&mdash;' : fmt(M.standard, 6) + ' u');
  }
  if(st.view === 'game'){
    s += hd('the game');
    s += row('level', String(GAME.level) + ' of ' + PHET.numLevels);
    s += row('challenge', GAME.phase === 'idle' ? 'not started'
             : Math.min(GAME.idx + 1, PHET.challengesPerLevel) + ' of ' + PHET.challengesPerLevel);
    s += row('score', GAME.score + ' / ' + perfectScore(),
             GAME.score === perfectScore() ? 'good' : '');
    s += row('attempt', GAME.phase === 'idle' ? '&mdash;' : String(GAME.attempt));
    s += row('best on this level', String(GAME.best[GAME.level - 1]));
  }
  s += '</table>';
  if(st.view === 'chart' || st.view === 'counting'){
    s += '<div class="note"><b>' + M.nStable + '</b> nuclides are in PhET&rsquo;s stability '
      + 'table, the heaviest ' + elementSymbol(M.heaviest[0]) + '&ndash;'
      + (M.heaviest[0] + M.heaviest[1]) + '. Technetium and promethium have none at all.</div>';
  } else if(st.view === 'mass'){
    s += '<div class="note">Atomic masses and abundances are <b>measured</b>. '
      + 'The standard atomic weight is their mean, &Sigma;&thinsp;(abundance &times; mass).</div>';
  } else {
    s += '<div class="note">The element is the <b>proton count</b> and nothing else. '
      + 'Neutrons change the isotope, electrons the charge.</div>';
  }
  s += '<div class="legend">'
    + '<span><i style="background:' + COL.proton + '"></i>proton</span>'
    + '<span><i style="background:' + COL.neutron + '"></i>neutron</span>'
    + '<span><i style="background:' + COL.electron + '"></i>electron</span></div>';
  return s;
}

/* ---- the top-left stage tag ---- */
function tagHTML(M){
  const st = M.st;
  if(st.view === 'atom')
    return '<b>' + (M.hasNuc ? M.sym + '-' + M.A : 'empty') + '</b> &nbsp; '
      + (M.p ? M.name : 'no element') + ' &nbsp; ' + M.ion + ' &nbsp; '

  if(st.view === 'symbol')
    return '<b>' + (M.p ? M.sym : '?') + '</b> &nbsp; A = ' + M.A + ' &nbsp; Z = ' + M.p
      + ' &nbsp; charge ' + M.chargeStr;
  if(st.view === 'game')
    return '<b>level ' + GAME.level + '</b> &nbsp; ' + (GAME.phase === 'idle'
      ? 'press start' : 'challenge ' + Math.min(GAME.idx + 1, PHET.challengesPerLevel)
        + ' &nbsp; score ' + GAME.score);
  if(st.view === 'counting')
    return '<b>' + M.census.total + '</b> configurations &nbsp; '
      + M.census.stablePN.length + ' stable nuclides inside the buckets';
  if(st.view === 'chart')
    return '<b>' + M.nStable + '</b> stable nuclides &nbsp; Z = 1 to '
      + M.heaviest[0] + ' &nbsp; heaviest ' + elementSymbol(M.heaviest[0]) + '-'
      + (M.heaviest[0] + M.heaviest[1]);
  return '<b>' + (M.p >= 1 && M.p <= 18 ? M.name : 'no isotope data') + '</b> &nbsp; '
    + (M.weighted == null ? '' : 'mean mass ' + fmt(M.weighted, 5) + ' u');
}
/* ================================================================== *
 *  drawing helpers, extracted verbatim from the landed                *
 *  models-of-the-hydrogen-atom build by extract_helpers.py: this is    *
 *  where this collection keeps its accumulated layout fixes (the       *
 *  bottom-up stage layout, the label registry and its half-pixel       *
 *  overlap rule, the #hint reservation, the axis clearances).          *
 * ================================================================== */
/* the floating readout covers the top right of the stage (about 300 x 550),
   and the HTML #hint owns the bottom-left corner (bottom:11px, 11px type), so
   every view keeps canvas text out of both (Known-bad, twice). */
const HINT_W = 340, HINT_H = 27;
function usableW(W){ return Math.max(320, W - RO_W - 34); }

/* lay the stage out from the BOTTOM up: measure the caption first, give the
   picture whatever is left (Known-bad: wrapped text has no fixed height).
   The HTML #hint is drawn at bottom:11px in 11 px type and the canvas capture
   cannot see it, so the caption's LAST line has to clear it: HINT_H of extra
   bottom margin, asserted in selfTest (Known-bad, wave-on-a-string). */
function layout(ctx, W, H, full, short){
  /* a narrow stage has to keep 300 px for the picture, or the long caption
     eats the stack and the bottom panel's axis title lands on it */
  /* the caption is capped at the USABLE width, which is the part of the stage
     the floating readout does not cover; at the full stage width it ran under
     the readout at every size below 1400 px */
  const f = fitCaption(ctx, W, H - HINT_H, full, short, usableW(W),
                       stageTop() + (narrowStage(W) ? 300 : 120));
  return {top: stageTop(), capY: f.capY, capW: f.capW, txt: f.txt,
          bot: f.capY - 12, W, H};
}
/* a stage narrower than this cannot carry two panels side by side (the
   floating readout already owns 300 px of it) — every two-panel view stacks
   instead (Known-bad: two-column layouts collapse below ~430 px of column) */
function narrowStage(W){ return usableW(W) < 430; }
/* axes() puts tick labels at +5 and the x-axis title at +21 below the
   frame, in 11 px type: 38 px of clearance under every plot box. */
const AXIS_BOT = 38;
/* how many y ticks a panel of this height can label without the labels
   touching: a 10.5 px label is ~12 px tall, so five ticks need 60 px of frame
   (Known-bad: tick label size follows the tick SPACING) */
function nyFor(h){ return h < 90 ? 2 : (h < 140 ? 3 : 5); }
function drawCaption(ctx, L){
  const lines = wrapText(ctx, L.txt, L.capW, '11.5px -apple-system, sans-serif');
  LABEL_RECTS.push({x: 18, y: L.capY, w: L.capW, h: lines.length * 14});
  caption(ctx, 18, L.capY, L.txt, L.capW, '#767e92');
}
/* two stacked panels that ALWAYS leave AXIS_BOT under the lower one: the
   square shrinks until the plot below it fits, rather than the plot's height
   being clamped and its x-axis title pushed onto the caption */
function stackFit(top, bot, gap, share){
  let side = Math.max(90, Math.min((bot - top) * (share || 0.46), bot - top));
  let bh = bot - AXIS_BOT - (top + side + gap);
  if(bh < 72){ side = Math.max(70, side - (72 - bh)); bh = bot - AXIS_BOT - (top + side + gap); }
  return {side, bh: Math.max(46, bh)};
}
function panelTitle(ctx, b, t){
  LABEL_RECTS.push(labelRect(ctx, b.x, b.y - 9, t, 'italic 13px Georgia, serif', 'left', 'bottom'));
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#aeb6c6';
  ctx.font = 'italic 13px Georgia, serif';
  ctx.fillText(plain(t), b.x, b.y - 9);
}
/* every label this file draws records its rectangle; labelIfClear() then
   refuses to draw one that would land on an existing rectangle, so a crowded
   picture DROPS labels instead of stacking them.  Cleared per draw. */
let LABEL_RECTS = [];
function labelRect(ctx, x, y, t, font, align, base){
  ctx.font = font || '11px -apple-system, sans-serif';
  const w = ctx.measureText(plain(t)).width;
  const mm = /([\d.]+)px/.exec(ctx.font), fs = mm ? parseFloat(mm[1]) : 10, fh = fs * 1.15;
  const lx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
  const ly = base === 'top' ? y : (base === 'middle' ? y - fh / 2
    : (base === 'bottom' ? y - fh : y - fh * 0.8));
  return {x: lx, y: ly, w, h: fh};
}
/* half a pixel, which is tools/audit.py's threshold.  A 2 px tolerance passed
   the inline sweep and failed the audit on the same picture (Known-bad), and a
   2 px graze is visible antialiased smear on canvas. */
function rectsHit(a, b){
  return Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > 0.5
      && Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > 0.5;
}
function label(ctx, x, y, t, col, font, align, base){
  LABEL_RECTS.push(labelRect(ctx, x, y, t, font, align, base));
  ctx.fillStyle = col || '#8b93a6';
  ctx.font = font || '11px -apple-system, sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'top';
  ctx.fillText(plain(t), x, y);
}
function labelIfClear(ctx, x, y, t, col, font, align, base){
  const r = labelRect(ctx, x, y, t, font, align, base);
  for(const q of LABEL_RECTS) if(rectsHit(r, q)) return false;
  /* the shared legendBox() draws its own text and records it in LEGEND_RECTS,
     not in the label registry — check both, or a dodging label lands on a
     legend (a z score did exactly that at 820x520) */
  for(const q of LEGEND_RECTS) if(rectsHit(r, q)) return false;
  label(ctx, x, y, t, col, font, align, base);
  return true;
}
/* a label beside a vertical rule on a ruler-style strip: it picks the side
   with room INSIDE the panel first (a label that only dodges what it collides
   with still runs off the canvas -- "PhET's atomic-scale caption" ended at
   x = 597 on a 560 px stage), then falls back to the other side, then is
   dropped. */
function sideLabel(ctx, b, x, y, t, col){
  const w = labelRect(ctx, x, y, t, '10px -apple-system, sans-serif', 'left', 'top').w;
  const leftFirst = (x + 4 + w > b.x + b.w);
  const a = leftFirst ? ['right', 'left'] : ['left', 'right'];
  for(const al of a){
    const xx = al === 'left' ? x + 4 : x - 4;
    if(al === 'left' && xx + w > b.x + b.w) continue;
    if(al === 'right' && xx - w < b.x) continue;
    if(labelIfClear(ctx, xx, y, t, col, '10px -apple-system, sans-serif', al, 'top')) return true;
  }
  return false;
}
function disc(ctx, x, y, r, col){
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function ring(ctx, x, y, r, col, lw, dash){
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.restore();
}

/* ================================================================== *
 *  the drawn atom, the buckets, the periodic table, the symbol box    *
 * ================================================================== */
/* PhET's two capture radii, read out of BAAModel: a nucleon dropped within
   100 model units of the centre joins the nucleus, an electron within
   1.1 x the outer shell joins the shells. */
const CAPTURE_NUCLEON = 100;
const CAPTURE_ELECTRON = 1.1 * PHET.outerShell;
/* the model half-width the atom picture is fitted to: the outer shell plus an
   electron, so a full shell is not clipped */
const ATOM_HALF = PHET.outerShell + PHET.electronRadius + 6;

/* layout() reserves 120 px of stage before it gives up on the long caption,
   which is not enough for a view whose panels have MINIMUM heights: the
   clamps then push the lower panel's axis title past the caption.  This is
   layout() with the view's own floor, so a long caption is traded for the
   short one rather than for a collision (Known-bad: wrapped text has no
   fixed height; measure the caption BEFORE laying out the panels). */
function layoutMin(ctx, W, H, full, short, minStage){
  const f = fitCaption(ctx, W, H - HINT_H, full, short, usableW(W), stageTop() + minStage);
  return {top: stageTop(), capY: f.capY, capW: f.capW, txt: f.txt,
          bot: f.capY - 12, W: W, H: H};
}

/* a panel title must fit INSIDE its own panel: the long one is used only when
   it measures narrower than the box, else the short one (Known-bad,
   brachistochrone).  Without it a right-hand panel's title runs out from under
   its own panel and under the floating readout (found by tools/audit.py). */
function panelTitleFit(ctx, b, long, short){
  ctx.font = 'italic 13px Georgia, serif';
  panelTitle(ctx, b, ctx.measureText(plain(long)).width <= b.w ? long : short);
}

/* axes() draws its tick labels, its axis names and its title with raw
   fillText, outside the label registry, so a label placed by labelIfClear
   cannot see them and lands on a tick (Known-bad, brachistochrone: axesR).
   This wrapper draws the same axes and then REGISTERS every piece of text it
   drew, so everything placed afterwards dodges them. */
function axesR(ctx, b, xlo, xhi, ylo, yhi, opt){
  const o = {};
  for(const k in (opt || {})) o[k] = opt[k];
  o.xticks = o.xticks || ticksFor(Math.min(xlo, xhi), Math.max(xlo, xhi), o.nx || 6);
  o.yticks = o.yticks || ticksFor(Math.min(ylo, yhi), Math.max(ylo, yhi), o.ny || 5);
  axes(ctx, b, xlo, xhi, ylo, yhi, o);
  const TF = '10.5px -apple-system, sans-serif';
  for(const t of o.xticks){
    const X = b.x + b.w * (t - xlo) / (xhi - xlo || 1);
    if(X < b.x - 0.5 || X > b.x1 + 0.5) continue;
    LABEL_RECTS.push(labelRect(ctx, X, b.y1 + 5, o.xfmt ? o.xfmt(t) : fmt(t, 2), TF,
                               'center', 'top'));
  }
  for(const t of o.yticks){
    const Y = b.y1 - b.h * (t - ylo) / (yhi - ylo || 1);
    if(Y < b.y - 0.5 || Y > b.y1 + 0.5) continue;
    LABEL_RECTS.push(labelRect(ctx, b.x - 6, Y, o.yfmt ? o.yfmt(t) : fmt(t, 2), TF,
                               'right', 'middle'));
  }
  if(o.xlab) LABEL_RECTS.push(labelRect(ctx, b.x + b.w / 2, b.y1 + 21, o.xlab,
                                        '11px -apple-system, sans-serif', 'center', 'top'));
  if(o.title) LABEL_RECTS.push(labelRect(ctx, b.x, b.y - 9, o.title,
                                         'italic 13px Georgia, serif', 'left', 'bottom'));
  /* the y-axis name is drawn in a ROTATED frame: its screen box is the
     transpose of its text box, centred on the panel's mid-height */
  if(o.ylab){
    const r = labelRect(ctx, 0, 0, o.ylab, '11px -apple-system, sans-serif', 'center', 'bottom');
    LABEL_RECTS.push({x: b.x - 40 - r.h, y: b.y + b.h / 2 - r.w / 2, w: r.h, h: r.w});
  }
}

/* a label/value row that WRAPS instead of overlapping: the value goes on the
   same line when it fits and on its own line when it does not.  A long label
   beside a right-aligned value is the commonest text collision there is. */
function kvRow(ctx, x, y, w, k, v, col){
  const KF = '10.5px -apple-system, sans-serif', VF = '11px -apple-system, sans-serif';
  const vw = labelRect(ctx, x, y, v, VF, 'left', 'top').w;
  const kw = labelRect(ctx, x, y, k, KF, 'left', 'top').w;
  if(kw + vw + 12 <= w){
    label(ctx, x, y, k, COL.faint, KF, 'left', 'top');
    label(ctx, x + w, y, v, col, VF, 'right', 'top');
    return 17;
  }
  /* it does not fit on one line: the KEY wraps to the whole column and the
     value goes underneath it.  Squeezing the key into whatever the value
     leaves is what put "odd-odd" through its own value at 820 px (found by
     tools/audit.py, then by the inline sweep). */
  const lines = wrapText(ctx, k, w, KF);
  for(let i = 0; i < lines.length; i++)
    label(ctx, x, y + i * 13, lines[i], COL.faint, KF, 'left', 'top');
  label(ctx, x + w, y + lines.length * 13, v, col, VF, 'right', 'top');
  return lines.length * 13 + 17;
}

/* a block of annotation lines placed in whichever corner of panel b is clear
   of BOTH the label registry and the given list of solid marks.  Marks drawn
   with fillRect are invisible to labelIfClear, so they have to be handed over
   explicitly (Known-bad: deciding which corner is empty by looking at one
   configuration keeps getting it wrong). */
function annotate(ctx, b, marks, lines){
  const F = '11px -apple-system, sans-serif';
  let w = 0;
  for(const l of lines) w = Math.max(w, labelRect(ctx, 0, 0, l[0], F, 'left', 'top').w);
  const h = lines.length * 14;
  const cands = [[b.x + 6, b.y + 4], [b.x1 - w - 6, b.y + 4],
                 [b.x + 6, b.y1 - h - 4], [b.x1 - w - 6, b.y1 - h - 4]];
  for(const [cx, cy] of cands){
    let hit = false;
    const r = {x: cx, y: cy, w: w, h: h};
    for(const q of marks) if(rectsHit(r, q)){ hit = true; break; }
    if(!hit) for(const q of LABEL_RECTS) if(rectsHit(r, q)){ hit = true; break; }
    if(hit) continue;
    for(let i = 0; i < lines.length; i++)
      label(ctx, cx, cy + i * 14, lines[i][0], lines[i][1], F, 'left', 'top');
    return r;
  }
  return null;               /* every corner is busy: draw nothing rather than lie */
}

/* interleave protons and neutrons evenly over the layout slots, so a nucleus
   looks mixed rather than striped.  Deterministic: slot k is a proton when
   floor((k+1) p / (p+n)) > floor(k p / (p+n)). */
function nucleonTypes(p, n){
  const t = [], tot = p + n;
  if(tot === 0) return t;
  for(let k = 0; k < tot; k++)
    t.push(Math.floor((k + 1) * p / tot) > Math.floor(k * p / tot) ? 'p' : 'n');
  return t;
}
/* jiggle offset for an unstable nucleus: PhET moves it every 0.1 s round a
   five-step cycle of directions and a four-step cycle of amplitudes */
const JIGGLE_ANG = [0.1 * PI, 1.6 * PI, 0.7 * PI, 1.1 * PI, 0.3 * PI];
const JIGGLE_AMP = [0.4, 0.8, 0.2, 0.9];
function jiggleOffset(k){
  const r = JIGGLE_AMP[k % JIGGLE_AMP.length] * 0.5 * PHET.nucleonRadius;
  const a = JIGGLE_ANG[k % JIGGLE_ANG.length];
  return [r * Math.cos(a), r * Math.sin(a)];
}

/* draw the atom centred at (cx, cy) with s px per model unit */
function drawAtomPicture(ctx, cx, cy, s, M, opt){
  const o = opt || {};
  const st = M.st;
  const rNuc = PHET.nucleonRadius * s, rEl = PHET.electronRadius * s;
  if(st.model === 'cloud'){
    const R = M.cloudR * s;
    if(R > 0){
      /* concentric OPAQUE rings premixed against the background: a stack of
         translucent discs composites twice where they overlap and reads as
         banding (Known-bad, the corduroy entry) */
      const NR = 30;
      for(let i = NR; i >= 1; i--){
        const f = i / NR;
        const a = 0.42 * (1 - f) * (1 - f) + 0.03;
        disc(ctx, cx, cy, R * f, mix(COL.bg, COL.electron, a));
      }
      ring(ctx, cx, cy, R, rgba(COL.electron, 0.5), 1);
    }
  } else {
    ring(ctx, cx, cy, PHET.innerShell * s, rgba(COL.str, 0.42), 1, [5, 5]);
    ring(ctx, cx, cy, PHET.outerShell * s, rgba(COL.str, 0.42), 1, [5, 5]);
    const slots = electronSlots();
    for(let k = 0; k < Math.min(M.e, slots.length); k++){
      const sl = slots[k];
      disc(ctx, cx + sl.x * s, cy + sl.y * s, rEl, COL.electron);
      ring(ctx, cx + sl.x * s, cy + sl.y * s, rEl, rgba('#ffffff', 0.35), 1);
    }
  }
  /* the nucleus */
  const tot = M.p + M.n;
  let ox = 0, oy = 0;
  if(o.jiggle && tot > 0 && !M.nucleusStable){
    const j = jiggleOffset(o.jiggle);
    ox = j[0] * s; oy = j[1] * s;
  }
  if(tot > 0){
    const L = nucleonLayout(tot, PHET.nucleonRadius), ty = nucleonTypes(M.p, M.n);
    /* far nucleons first so the near ones overlap them */
    const order = L.map((pt, i) => i).sort((a, b) =>
      (L[b][0] * L[b][0] + L[b][1] * L[b][1]) - (L[a][0] * L[a][0] + L[a][1] * L[a][1]));
    for(const i of order){
      const x = cx + ox + L[i][0] * s, y = cy + oy + L[i][1] * s;
      const c = ty[i] === 'p' ? COL.proton : COL.neutron;
      disc(ctx, x, y, rNuc, c);
      ring(ctx, x, y, rNuc, rgba('#000000', 0.55), 1);
      disc(ctx, x - rNuc * 0.32, y - rNuc * 0.32, rNuc * 0.3, rgba('#ffffff', 0.35));
    }
  }
  return {rNuc: rNuc, rEl: rEl};
}

/* ---- the buckets ---- */
const BUCKET_KINDS = [{k: 'p', name: 'Protons', col: COL.proton, max: PHET.numProtons},
                      {k: 'n', name: 'Neutrons', col: COL.neutron, max: PHET.numNeutrons},
                      {k: 'e', name: 'Electrons', col: COL.electron, max: PHET.numElectrons}];
function bucketBoxes(x0, y, w, h){
  const gap = 10, bw = (w - 2 * gap) / 3;
  return BUCKET_KINDS.map((b, i) => Object.assign({}, b,
    {box: box(x0 + i * (bw + gap), y, bw, h)}));
}
function drawBuckets(ctx, bs, M){
  for(const b of bs){
    const left = b.k === 'p' ? M.leftP : (b.k === 'n' ? M.leftN : M.leftE);
    const r = Math.min(9, Math.max(5, b.box.w / 14));
    ctx.fillStyle = COL.panel; ctx.fillRect(b.box.x, b.box.y, b.box.w, b.box.h);
    frame(ctx, b.box, COL.edge);
    /* the pile: one row of discs, wrapped */
    const perRow = Math.max(1, Math.floor((b.box.w - 12) / (2 * r + 2)));
    for(let i = 0; i < left; i++){
      const rowi = Math.floor(i / perRow), ci = i % perRow;
      const x = b.box.x + 8 + r + ci * (2 * r + 2) + (rowi % 2 ? r : 0);
      const y = b.box.y + b.box.h - 9 - r - rowi * (2 * r - 1);
      if(y < b.box.y + 14) continue;
      disc(ctx, x, y, r, b.col);
      ring(ctx, x, y, r, rgba('#000000', 0.5), 1);
    }
    label(ctx, b.box.x + b.box.w / 2, b.box.y + 4, b.name + ' (' + left + ')',
          left ? COL.text : COL.faint, '11px -apple-system, sans-serif', 'center', 'top');
  }
}
function bucketHit(bs, x, y){
  for(const b of bs){
    const q = b.box;
    if(x >= q.x && x <= q.x1 && y >= q.y && y <= q.y1) return b.k;
  }
  return null;
}

/* ---- the periodic table ---- */
function ptGeo(x0, y0, w, rows){
  const cw = Math.max(6, Math.min(26, (w - 17 * 1) / 18));
  return {x0: x0, y0: y0, cw: cw, ch: cw, gap: 1, rows: rows || 10,
          w: 18 * cw + 17, h: (rows || 10) * cw + ((rows || 10) - 1)};
}
function ptCell(g, z){
  const xy = PTXY[z];
  if(!xy) return null;
  return {x: g.x0 + (xy[0] - 1) * (g.cw + g.gap), y: g.y0 + (xy[1] - 1) * (g.ch + g.gap),
          w: g.cw, h: g.ch};
}
function drawPeriodicTable(ctx, g, M, opt){
  const o = opt || {};
  const hiZ = o.highlight === undefined ? M.p : o.highlight;
  const maxZ = o.maxZ || 118;
  for(let z = 1; z <= maxZ; z++){
    const c = ptCell(g, z);
    if(!c || c.y + c.h > g.y0 + g.h + 1) continue;
    const reach = z <= (o.reach || PHET.numProtons);
    const on = z === hiZ;
    ctx.fillStyle = on ? COL.live : (reach ? mix(COL.bg, COL.str, 0.26) : COL.panel);
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = on ? '#ffffff' : '#1b2030'; ctx.lineWidth = on ? 1.6 : 1;
    ctx.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);
    if(g.cw >= 13){
      ctx.fillStyle = on ? '#ffffff' : (reach ? COL.text : '#5b6274');
      ctx.font = Math.max(7, Math.round(g.cw * 0.52)) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(SYMBOL[z], c.x + c.w / 2, c.y + c.h / 2 + 0.5);
    }
  }
  return g;
}
function ptHit(g, x, y, maxZ){
  for(let z = 1; z <= (maxZ || 118); z++){
    const c = ptCell(g, z);
    if(!c) continue;
    if(x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) return z;
  }
  return null;
}

/* ---- PhET's three display panels ---- */
function factBox(ctx, b, title, value, col){
  ctx.fillStyle = COL.panel; ctx.fillRect(b.x, b.y, b.w, b.h);
  frame(ctx, b, COL.edge);
  label(ctx, b.x + 8, b.y + 5, title, COL.faint, '10px -apple-system, sans-serif', 'left', 'top');
  label(ctx, b.x + b.w / 2, b.y + b.h - 6, value, col || COL.text,
        'italic ' + Math.max(12, Math.min(19, Math.round(b.h * 0.42))) + 'px Georgia, serif',
        'center', 'bottom');
}

/* ================================================================== *
 *  view 1 — the atom (PhET's first screen)                            *
 * ================================================================== */
/* Every rectangle the atom view draws AND the pointer tests is computed here,
   once, by a pure function.  A number computed inside a draw call cannot be
   tested, and a click that recomputes its own geometry drifts away from the
   picture (Known-bad, twice). */
function atomGeo(ctx, W, H, M){
  const L = layout(ctx, W, H, atomCaption(M), atomCaptionShort(M));
  const x0 = 12, w = usableW(W);
  const narrow = narrowStage(W);
  const colW = narrow ? w : Math.max(260, w * 0.56);
  const rightX = x0 + colW + 16, rightW = narrow ? 0 : w - colW - 16;
  const bucketH = 62;
  /* the three labels PhET puts under the atom need a band of their own, or
     the element name lands on a bucket caption at every canvas size */
  const st = M.st;
  const labH = (st.showName ? 21 : 0) + (st.showIon ? 18 : 0) + (st.showStab ? 18 : 0)
             + ((st.showName || st.showIon || st.showStab) ? 10 : 0);
  const picBot = L.bot - bucketH - 14 - labH;
  const picH = Math.max(90, picBot - L.top);
  const s = Math.min(colW / (2 * ATOM_HALF), picH / (2 * ATOM_HALF));
  const G = {L: L, x0: x0, w: w, colW: colW, rightX: rightX, rightW: rightW,
             cx: x0 + colW / 2, cy: L.top + picH / 2, s: s, narrow: narrow,
             bh: 46, gap: 8, labY: L.top + picH + 6,
             buckets: bucketBoxes(x0, L.bot - bucketH, colW, bucketH), pt: null};
  if(!narrow && M.st.showTable){
    const y = L.top + 3 * (G.bh + G.gap) + 6;
    const g = ptGeo(rightX, y + 14, rightW, 10);
    if(g.y0 + g.h < L.bot - 6){ G.pt = g; G.ptLabelY = y; }
  }
  return G;
}
function drawAtomView(ctx, W, H, M){
  const G = atomGeo(ctx, W, H, M);
  const st = M.st;
  drawAtomPicture(ctx, G.cx, G.cy, G.s, M, {jiggle: st.jiggle ? FRAME.jig : 0});
  /* the labels PhET puts under the atom, each behind its own checkbox */
  let ly = G.labY;
  if(st.showName)
    label(ctx, G.cx, ly, M.p ? M.name : 'no element yet', M.p ? COL.pos : COL.faint,
          'italic 16px Georgia, serif', 'center', 'top'), ly += 21;
  if(st.showIon)
    label(ctx, G.cx, ly, (M.hasNuc || M.e) ? M.ion : 'nothing here',
          (!M.hasNuc && !M.e) ? COL.faint : (M.q === 0 ? COL.pos : COL.live),
          '12.5px -apple-system, sans-serif', 'center', 'top'),
    ly += 18;
  if(st.showStab)
    label(ctx, G.cx, ly, M.hasNuc ? (M.stable ? 'stable' : 'unstable') : '',
          M.stable ? COL.pos : COL.ref, '12.5px -apple-system, sans-serif', 'center', 'top');
  /* the held particle rides with the cursor */
  if(DRAG.active && DRAG.type){
    const c = DRAG.type === 'p' ? COL.proton : (DRAG.type === 'n' ? COL.neutron : COL.electron);
    const r = (DRAG.type === 'e' ? PHET.electronRadius : PHET.nucleonRadius) * G.s;
    disc(ctx, DRAG.x, DRAG.y, r, c);
    ring(ctx, DRAG.x, DRAG.y, r, '#ffffff', 1.4);
    ring(ctx, G.cx, G.cy, (DRAG.type === 'e' ? CAPTURE_ELECTRON : CAPTURE_NUCLEON) * G.s,
         rgba(COL.pos, 0.55), 1, [4, 4]);
  }
  drawBuckets(ctx, G.buckets, M);
  if(!G.narrow){
    /* PhET's three display panels, then its periodic table */
    const bh = G.bh, gap = G.gap;
    let y = G.L.top;
    factBox(ctx, box(G.rightX, y, G.rightW, bh), 'ELEMENT NAME',
            M.p ? M.name : '—', M.p ? COL.pos : COL.faint); y += bh + gap;
    const half = (G.rightW - gap) / 2;
    factBox(ctx, box(G.rightX, y, half, bh), 'MASS NUMBER',
            M.hasNuc ? String(M.A) : '—', COL.pos);
    factBox(ctx, box(G.rightX + half + gap, y, half, bh), 'NET CHARGE',
            M.chargeStr, M.q === 0 ? COL.pos : COL.live); y += bh + gap;
    factBox(ctx, box(G.rightX, y, G.rightW, bh), 'NUCLEAR STABILITY',
            M.hasNuc ? (M.stable ? 'Stable' : 'Unstable') : '—',
            M.hasNuc ? (M.stable ? COL.pos : COL.ref) : COL.faint);
    if(G.pt){
      label(ctx, G.rightX, G.ptLabelY, 'periodic table — the ten the buckets reach are lit',
            COL.faint, '10px -apple-system, sans-serif', 'left', 'top');
      drawPeriodicTable(ctx, G.pt, M, {reach: PHET.numProtons});
    }
  }
  drawCaption(ctx, G.L);
}

function atomCaption(M){
  const st = M.st;
  return 'PhET’s first screen. Drag a particle out of a bucket and drop it on the atom, or use the '
    + 'panel’s three counts. The buckets hold ' + PHET.numProtons + ' protons, ' + PHET.numNeutrons
    + ' neutrons and ' + PHET.numElectrons + ' electrons, which are PhET’s own numbers, so the '
    + 'reachable elements stop at neon. Everything under the atom is worked out from the three counts and '
    + 'nothing else: the element is Z = ' + M.p + ', the mass number is ' + M.p + ' + ' + M.n + ' = '
    + M.A + ', the charge is ' + M.p + ' − ' + M.e + ' = ' + signed(M.q) + '. '
    + (M.hasNuc ? ('Whether the nucleus is stable is the one thing that is not arithmetic: ' + M.sym + '-'
      + M.A + ' is ' + (M.stable ? 'in' : 'not in') + ' PhET’s table of ' + M.nStable
      + ' stable nuclides.') : '')
    + (st.model === 'cloud' ? ' The cloud’s radius is PhET’s own linear law, r = 42.5 + 8.75 e '
      + 'model units, so ten electrons put it exactly on the outer shell.'
