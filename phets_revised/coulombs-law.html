/* ================================================================== *
 *  view: the charge product                                           *
 * ================================================================== */
function drawProd(ctx,W,H,M){
  const L=M.L, P=M.P, T=L.T, qm=Q_MAX, un=L.w==='macro'?'µC':'e';
  const Lo=stageLayoutH(ctx,W,H,PROD_CAP_FULL,PROD_CAP_SHORT,2,0.36,1);
  const b=Lo.main, px=q=>b.x+b.w*(q+qm)/(2*qm), py=q=>b.y1-b.h*(q+qm)/(2*qm);
  /* the quadrants: like signs repel, unlike attract */
  ctx.fillStyle='rgba(232,132,58,0.07)'; ctx.fillRect(px(0),b.y,b.x1-px(0),py(0)-b.y); ctx.fillRect(b.x,py(0),px(0)-b.x,b.y1-py(0));
  ctx.fillStyle='rgba(90,200,224,0.06)'; ctx.fillRect(b.x,b.y,px(0)-b.x,py(0)-b.y); ctx.fillRect(px(0),py(0),b.x1-px(0),b.y1-py(0));
  /* the y axis starts its numbers one tick up: at -10 both axes would label
     the same corner and the two "-10"s collide */
  axesT(ctx,b,-qm,qm,-qm,qm,{title:titleFor(b,'the force over every pair of charges at r = '+fmt(L.r*T.uPerM,L.w==='macro'?1:0)+' '+T.unit+' ('+L.w+' scale)','F over (q₁, q₂)'),
    xlab:'q₁, '+un,ylab:'q₂, '+un,xticks:[-10,-5,0,5,10],yticks:[-5,0,5,10],xfmt:tickNum,yfmt:tickNum});
  polyline(ctx,b,[-qm,qm],[0,0],-qm,qm,-qm,qm,rgba(COL.struct,0.7),1.2);
  polyline(ctx,b,[0,0],[-qm,qm],-qm,qm,-qm,qm,rgba(COL.struct,0.7),1.2);
  for(const C of P.contours) for(const [sx,sy] of [[1,1],[-1,-1],[1,-1],[-1,1]])
    polyline(ctx,b,C.xs.map(x=>sx*x),C.ys.map(y=>sy*y),-qm,qm,-qm,qm,C.decade?rgba(COL.pos,0.85):rgba(COL.pos,0.35),C.decade?1.4:1);
  for(const C of P.contours){ if(!C.decade) continue; const d=Math.sqrt(C.c); if(d<qm*0.9) lab(ctx,W,H,px(d)+5,py(d)-5,sciPlain(C.F,1)+' N',COL.pos,SM_FONT,'left','bottom'); }
  if(P.live.c>0){ const sx=Math.sign(L.Q1), sy=Math.sign(L.Q2);
    polyline(ctx,b,P.live.xs.map(x=>sx*x),P.live.ys.map(y=>sy*y),-qm,qm,-qm,qm,COL.live,1.4,[5,4]); }
  lab(ctx,W,H,px(qm*0.55),py(qm*0.93),'repel',COL.ref,SM_FONT,'center');
  lab(ctx,W,H,px(-qm*0.55),py(-qm*0.93),'repel',COL.ref,SM_FONT,'center');
  lab(ctx,W,H,px(-qm*0.55),py(qm*0.93),'attract',COL.struct,SM_FONT,'center');
  lab(ctx,W,H,px(qm*0.55),py(-qm*0.93),'attract',COL.struct,SM_FONT,'center');
  marker(ctx,b,-qm,qm,-qm,qm,L.Q1,L.Q2,COL.live);
  labBeside(ctx,W,H,b,px(L.Q1),py(L.Q2)-8,'|F| = '+sciPlain(L.Fmag,3)+' N',COL.live,'bottom');
  const [bl,br]=lowerPanels(Lo);
  /* symmetric force axes: y numbers kept 14 px clear of the bottom corner,
     where the x axis prints its -10 */
  const symTicks=(yh,bx)=>ticksFor(-yh,yh,nyFor(bx.h)).filter(t=>(t+yh)/(2*yh)*bx.h>14);
  if(bl&&L.Q1===0){
    axesT(ctx,bl,-qm,qm,-1,1,{title:titleFor(bl,'the force on q₂ as q₂ changes sign (q₁ held)','F on q₂ against q₂'),xlab:'q₂, '+un,xticks:[-10,-5,0,5,10],yticks:[],xfmt:tickNum});
    labIn(ctx,W,H,bl,bl.x+bl.w/2,bl.y+bl.h/2,'q₁ is zero: no force on q₂, whatever its charge',COL.ref,'center','middle');
  } else if(bl){
    const yh=Math.max(...P.F2s.map(Math.abs))*1.1, ax=powAxis(yh,'F','N');
    axesT(ctx,bl,-qm,qm,-yh,yh,{title:titleFor(bl,'the force on q₂ as q₂ changes sign (q₁ held)','F on q₂ against q₂'),xlab:'q₂, '+un,ylab:ax.lab,
      yticks:symTicks(yh,bl),xfmt:tickNum,yfmt:ax.fmt});
    polyline(ctx,bl,[-qm,qm],[0,0],-qm,qm,-yh,yh,rgba(COL.struct,0.6),1);
    polyline(ctx,bl,P.q2s,P.F1s,-qm,qm,-yh,yh,COL.ref,1.3,[5,4]);
    polyline(ctx,bl,P.q2s,P.F2s,-qm,qm,-yh,yh,COL.pos,2);
    marker(ctx,bl,-qm,qm,-yh,yh,L.Q2,L.F2,COL.live);
    legendAuto(ctx,bl,[[COL.pos,'on q₂ (+x: pushed away)'],[COL.ref,'on q₁, its mirror']]);
  }
  if(br){
    const pm=qm*qm, yh=Math.max(...P.Fps.map(Math.abs))*1.1, ax=powAxis(yh,'F on q₂','N');
    axesT(ctx,br,-pm,pm,-yh,yh,{title:titleFor(br,'the force against the product q₁q₂: the whole plane on one line','F against q₁q₂'),xlab:'q₁q₂, '+un+'²',ylab:ax.lab,nx:5,
      yticks:symTicks(yh,br),xfmt:tickNum,yfmt:ax.fmt});
    polyline(ctx,br,[-pm,pm],[0,0],-pm,pm,-yh,yh,rgba(COL.struct,0.6),1);
    polyline(ctx,br,P.ps,P.Fps,-pm,pm,-yh,yh,COL.pos,2);
    marker(ctx,br,-pm,pm,-yh,yh,P.prod,L.F2,COL.live);
    labIn(ctx,W,H,br,br.x+br.w*0.25,br.y+12,'attract',COL.struct,'center','top');
    labIn(ctx,W,H,br,br.x+br.w*0.75,br.y1-14,'repel',COL.ref,'center','bottom');
  }
  drawCaption(ctx,Lo);
}

/* ================================================================== *
 *  view: electricity and gravity                                      *
 * ================================================================== */
function drawGrav(ctx,W,H,M){
  const E=M.E, La=M.La;
  const Lo=stageLayoutH(ctx,W,H,GRAV_CAP_FULL,GRAV_CAP_SHORT,2,0.36,1);
  const b=Lo.main, X0=-15, X1=0, Y0=-70, Y1=5;
  const px=lr=>b.x+b.w*(lr-X0)/(X1-X0), py=lf=>b.y1-b.h*(lf-Y0)/(Y1-Y0);
  /* y numbers from 10^-60 up: at 10^-70 they would share the corner with 10^-15;
     every 20 decades when 10 would put them under 14 px apart (a short panel) */
  const ystep=b.h*10/(Y1-Y0)<14?20:10;
  const xt=[], yt=[]; for(let e=X0;e<=X1;e+=3) xt.push(e); for(let e=-60;e<=0;e+=ystep) yt.push(e);
  axesT(ctx,b,X0,X1,Y0,Y1,{title:titleFor(b,'an electron and a proton: electric and gravitational force against distance, log–log','F against r, log–log'),
    xlab:'distance r, m',ylab:'F, N',xticks:xt,yticks:yt,xfmt:powLabel,yfmt:powLabel});
  const lr=E.rs.map(Math.log10);
  polyline(ctx,b,[Math.log10(A0),Math.log10(A0)],[Y0,Y1],X0,X1,Y0,Y1,rgba(COL.struct,0.7),1.2,[3,4]);
  polyline(ctx,b,lr,E.Fg.map(Math.log10),X0,X1,Y0,Y1,COL.ref,2);
  polyline(ctx,b,lr,E.Fe.map(Math.log10),X0,X1,Y0,Y1,COL.pos,2);
  if(La.Fmag>0) polyline(ctx,b,lr,E.Fa.map(Math.log10),X0,X1,Y0,Y1,COL.live,1.2,[5,4]);
  marker(ctx,b,X0,X1,Y0,Y1,Math.log10(A0),Math.log10(E.FeA0),COL.pos);
  marker(ctx,b,X0,X1,Y0,Y1,Math.log10(A0),Math.log10(E.FgA0),COL.ref);
  if(La.Fmag>0) marker(ctx,b,X0,X1,Y0,Y1,Math.log10(La.r),Math.log10(La.Fmag),COL.live);
  /* the gap between the parallel lines, at 1 um: the ratio, the same everywhere */
  const xr=-6, ye=Math.log10(forceMag(K_E,E_CH,E_CH,1e-6)), yg=Math.log10(forceMag(G_N,M_E,M_P,1e-6));
  ctx.strokeStyle=COL.text; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(px(xr),py(ye)+4); ctx.lineTo(px(xr),py(yg)-4);
  ctx.moveTo(px(xr)-4,py(ye)+10); ctx.lineTo(px(xr),py(ye)+4); ctx.lineTo(px(xr)+4,py(ye)+10);
  ctx.moveTo(px(xr)-4,py(yg)-10); ctx.lineTo(px(xr),py(yg)-4); ctx.lineTo(px(xr)+4,py(yg)-10); ctx.stroke();
  POLY_SEGS.push(px(xr),py(ye),px(xr),py(yg));
  lab(ctx,W,H,px(xr)+8,(py(ye)+py(yg))/2,'× '+sciPlain(E.ratioEP,3)+' at every distance',COL.text,LAB_FONT,'left');
  labIn(ctx,W,H,b,px(Math.log10(A0))+6,py(Math.log10(E.FeA0))-8,'Bohr radius: '+sciPlain(E.FeA0,3)+' N',COL.pos,'left','bottom');
  labIn(ctx,W,H,b,px(Math.log10(A0))+6,py(Math.log10(E.FgA0))+8,sciPlain(E.FgA0,3)+' N',COL.ref,'left','top');
  legendAuto(ctx,b,[[COL.pos,'electric, k e²/r²'],[COL.ref,'gravitational, G mₑmₚ/r²'],[COL.live,'the atomic screen’s pair']]);
  const [bl,br]=lowerPanels(Lo);
  if(bl){
    const yh=E.ms[E.ms.length-1]/1000*1.1;
    axesT(ctx,bl,0,Q_MAX*Q_MAX,0,yh,{title:titleFor(bl,'equal masses that pull as hard as the macro charges','masses for the macro charges'),xlab:'|q₁q₂|, µC²',ylab:'m, tonnes',nx:5,ny:nyFor(bl.h),
      xfmt:tickNum,yfmt:tickNum});
    polyline(ctx,bl,E.ps,E.ms.map(m=>m/1000),0,Q_MAX*Q_MAX,0,yh,COL.pos,2);
    marker(ctx,bl,0,Q_MAX*Q_MAX,0,yh,E.prodM,E.mEq/1000,COL.live);
    labBeside(ctx,W,H,bl,bl.x+bl.w*E.prodM/(Q_MAX*Q_MAX),bl.y1-bl.h*(E.mEq/1000)/yh+14,E.prodM>0?sigf(E.mEq/1000,3)+' t each, at any r':'no force, no mass',COL.live,'top');
  }
  if(br){
    const rows=[['two electrons',E.ratioEE],['electron–proton',E.ratioEP],['two protons',E.ratioPP]];
    const lo=30, hi=45, bx=v=>br.x+br.w*(Math.log10(v)-lo)/(hi-lo);
    axesT(ctx,br,lo,hi,0,3,{title:titleFor(br,'the ratio k e²/(G m m′) for three pairs','the ratio, three pairs'),xlab:'F electric / F gravitational',
      xticks:[30,33,36,39,42,45],yticks:[],xfmt:powLabel});
    rows.forEach(([nm,v],i)=>{ const yc=br.y+br.h*(i+0.5)/3, hgt=Math.min(18,br.h/5);
      ctx.fillStyle=rgba(COL.pos,0.75); ctx.fillRect(br.x,yc-hgt/2,bx(v)-br.x,hgt);
      labIn(ctx,W,H,br,br.x+6,yc-hgt/2-3,nm+': '+sciPlain(v,3),COL.text,'left','bottom'); });
  }
  drawCaption(ctx,Lo);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='macro'||M.view==='atomic') drawLab(ctx,W,H,labSpec(M));
  else if(M.view==='inv') drawInverse(ctx,W,H,invSpec(M));
  else if(M.view==='prod') drawProd(ctx,W,H,M);
  else drawGrav(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return false; };             /* nothing here moves on its own */
  S.ended=function(){ return false; };
  /* the pointer: the charges and the ruler, on the two scale screens */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const w=ST.view;
    if(w!=='macro'&&w!=='atomic') return false;
    const ctx=canvas.getContext('2d'), M=buildModel(), LS=labSpec(M), G=labGeo(ctx,S.W,S.H,LS), u=TRACKS[w].uPerM;
    if(type==='down'){
      const hit=labHit(G,LS,x,y);
      if(hit==='ruler'){ DRAG.what='ruler'; DRAG.off=G.wx(x)-LS.ruler.x0; DRAG.offY=y-G.ruler.y0; return true; }
      if(hit===1||hit===2){ DRAG.what=hit; DRAG.off=G.wx(x)-LS.bodies[hit-1].x; return true; }
      return false;
    }
    if(type==='move'){
      if(DRAG.what===1||DRAG.what===2){ setPosCL(ST,w,DRAG.what,(G.wx(x)-DRAG.off)/u); return true; }
      if(DRAG.what==='ruler'){ const y0=clamp(y-DRAG.offY,G.ruler.ryLo,G.ruler.ryHi); setRulerCL(ST,w,(G.wx(x)-DRAG.off)/u,G.wy(y0)); return true; }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2)); });
  /* the scale screen the display controls act on (the lab views only show them) */
  const scrW=()=>st.view==='atomic'?'atomic':'macro';

  const rows={};
  function slider(id,lab2,lo,hi,step2,fmtf,get,set){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:get()});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=get(); val.textContent=fmtf(get()); };
    inp.addEventListener('input',()=>{ set(parseFloat(inp.value)); syncPanel(); dirty=true; refresh(); });
    rows[id]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(id,lab2,get,set){
    const inp=h('input',{type:'checkbox'}); inp.checked=!!get();
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ if(inp.disabled) return; set(inp.checked); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+id]={row:el,inp,sync:()=>{ inp.checked=!!get(); }};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        st[key]=o.id; syncChips(); syncPanel(); dirty=true; refresh(); }},o.name));
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }

  const gScale=h('div',{class:'grp'},h('h3',null,'which scale'));
  gScale.appendChild(chipRow([{id:'macro',name:'macro scale'},{id:'atomic',name:'atomic scale'}],'scale'));

  const gMac=h('div',{class:'grp'},h('h3',null,'macro charges'));
  gMac.appendChild(slider('mq1','q₁, µC',-Q_MAX,Q_MAX,1,v=>(v>0?'+':'')+fmt(v,0),()=>st.mq1,v=>setCharge(st,'macro',1,v)));
  gMac.appendChild(slider('mq2','q₂, µC',-Q_MAX,Q_MAX,1,v=>(v>0?'+':'')+fmt(v,0),()=>st.mq2,v=>setCharge(st,'macro',2,v)));
  gMac.appendChild(slider('mx1','x₁, cm',-5,5,0.1,v=>fmt(v,1),()=>st.mi1/10,v=>setPosCL(st,'macro',1,v/100)));
  gMac.appendChild(slider('mx2','x₂, cm',-5,5,0.1,v=>fmt(v,1),()=>st.mi2/10,v=>setPosCL(st,'macro',2,v/100)));

  const gAt=h('div',{class:'grp'},h('h3',null,'atomic charges'));
  gAt.appendChild(slider('aq1','q₁, e',-Q_MAX,Q_MAX,1,v=>(v>0?'+':'')+fmt(v,0),()=>st.aq1,v=>setCharge(st,'atomic',1,v)));
  gAt.appendChild(slider('aq2','q₂, e',-Q_MAX,Q_MAX,1,v=>(v>0?'+':'')+fmt(v,0),()=>st.aq2,v=>setCharge(st,'atomic',2,v)));
  gAt.appendChild(slider('ax1','x₁, pm',-50,50,1,v=>fmt(v,0),()=>st.ai1,v=>setPosCL(st,'atomic',1,v*1e-12)));
  gAt.appendChild(slider('ax2','x₂, pm',-50,50,1,v=>fmt(v,0),()=>st.ai2,v=>setPosCL(st,'atomic',2,v*1e-12)));

  const gDisp=h('div',{class:'grp'},h('h3',null,'force values'));
  gDisp.appendChild(h('div',{class:'checks'},
    checkbox('force','force values',()=>st[PRE[scrW()]+'Force'],v=>{ st[PRE[scrW()]+'Force']=v; }),
    checkbox('sci','scientific notation',()=>st[PRE[scrW()]+'Sci'],v=>{ st[PRE[scrW()]+'Sci']=v; })));
  gDisp.appendChild(slider('arrowK','arrow scale',0,ARROW_KMAX,1,k=>sciPlain(arrowStep(k,ARROW_E0[scrW()]),1)+' N/'+TRACKS[scrW()].unit,
    ()=>st[PRE[scrW()]+'ArrowK'],v=>{ st[PRE[scrW()]+'ArrowK']=Math.round(v); }));
  gDisp.appendChild(h('div',{class:'checks'},checkbox('dist','the distance between centres',()=>st.showDist,v=>{ st.showDist=v; })));
  gDisp.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ rulerToQ1(st,scrW()); dirty=true; refresh(); }},'ruler to q₁'),
    h('button',{onclick:()=>{ rulerHomeCL(st,scrW()); dirty=true; refresh(); }},'ruler home')));
  const dispTag=h('div',{class:'tag'}); gDisp.appendChild(dispTag);

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Coulomb&rsquo;s Law (University of Colorado Boulder, '
      +'phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.'}),
    h('div',{class:'src',html:'k = 1/4&pi;&epsilon;<sub>0</sub>, e, G, m<sub>e</sub>, m<sub>p</sub> and the Bohr radius: CODATA 2022 through scipy.constants. '
      +'PhET&rsquo;s values: radii 6.75 mm and 0.95 pm, the &plusmn;5 cm and &plusmn;50 pm tracks on 1-mm and 1-pm grids, gaps of 1 mm and 0.1 pm, '
      +'charges &plusmn;10 &micro;C and &plusmn;10 e (read from PhET&rsquo;s build 1.0.32). Every number is pinned in selfTest to build/coulombs-law/derive.py.'}));
  [gScale,gMac,gAt,gDisp,gReset,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    for(const [cw,list,key] of CHIPROWS) [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
  }
  function syncPanel(){
    const v=st.view, sc=(v==='inv'||v==='prod')?st.scale:v;
    gScale.hidden=!(v==='inv'||v==='prod');
    gMac.hidden=!(sc==='macro'||v==='grav');
    gAt.hidden=!(sc==='atomic'||v==='grav');
    gDisp.hidden=!(v==='macro'||v==='atomic');
    for(const k in rows) rows[k].sync();
    /* PhET greys out scientific notation while the force values are hidden: a
       live control that does nothing is worse than none */
    const on=!!st[PRE[scrW()]+'Force'];
    rows.cb_sci.inp.disabled=!on; rows.cb_sci.row.style.opacity=on?'1':'0.45';
    const T=TRACKS[scrW()];
    dispTag.innerHTML='drag a charge or the ruler on the canvas; the charges snap to '+(T.unit==='cm'?'1 mm':'1 pm')+', the closest centres are '
      +sigf(chargeSteps(T)/T.perM*T.uPerM,3)+' '+T.unit+' apart';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='macro'||st.view==='atomic')?'drag a charge or the ruler · 1–5 switch views':'1–5 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  macro:'Charles-Augustin de Coulomb measured it in 1785 with a torsion balance of his own design: two charged spheres push or pull along '
    +'the line between them with a force proportional to each charge and to the inverse square of the distance between their centres. Like '
    +'charges repel and unlike charges attract &mdash; change a sign with its slider and both arrows turn round together, still equal and '
    +'opposite, because Newton&rsquo;s third law holds for charges at rest. These are PhET&rsquo;s macro-scale charges, spheres 1.35 cm across '
    +'carrying a few microcoulombs. That is a great deal of charge for a ball this size: a microcoulomb alone would hold it at over a million '
    +'volts, far beyond what air can insulate, which is why real demonstrations use nanocoulombs. The model puts each charge at its sphere&rsquo;s '
    +'centre, which is exact for a rigid, uniformly charged sphere; two conducting spheres this close would shift their charge toward or away '
    +'from each other and depart from the formula.',
  atomic:'At the atomic scale the law is the same, with charge counted in units of the elementary charge, e = 1.602176634 &times; 10<sup>&minus;19</sup> C '
    +'(exact since the 2019 redefinition of the SI), and distance in picometres, 10<sup>&minus;12</sup> m. Charge comes only in whole multiples of '
    +'e, so the sliders step by one. The forces look tiny in newtons &mdash; about a micronewton at the defaults &mdash; but they act on particles of '
    +'almost no mass: the default pull on a proton would accelerate it at nearly 10<sup>21</sup> m/s&sup2; (the readout prints it). PhET draws each charge as a 1.9-pm ball, a '
    +'marker for a point charge rather than a picture of an ion (a real ion is about a hundred times larger, a nucleus a thousand times '
    +'smaller). The law between two point charges holds exactly at these distances; what quantum mechanics changes is where the charge in an '
    +'atom sits, not the force between two charges.',
  inv:'Double the distance and the force falls to a quarter, on either scale and for any pair of charges: an inverse-square law is a straight '
    +'line of slope &minus;2 on logarithmic axes, and the readout measures that slope off the model at the live distance. Multiply the force by '
    +'r&sup2; and what remains, |k q&#8321;q&#8322;|, does not depend on distance at all &mdash; the lower-right panel shows it flat against the falling '
    +'curve of an inverse-cube law. Coulomb&rsquo;s torsion balance supported the exponent 2 only roughly; the tight tests are null experiments '
    +'with charged concentric spheres, first Cavendish&rsquo;s and then Maxwell&rsquo;s, because only an exact inverse square leaves the inside of '
    +'a charged shell free of field.',
  prod:'The force depends on the charges only through their product. When q&#8321;q&#8322; is positive &mdash; both charges the same sign &mdash; they '
    +'repel; when it is negative they attract; on either axis one charge is zero and there is no force at all. Its size is proportional to '
    +'|q&#8321;q&#8322;|, so the contours of equal force are hyperbolas, the same in all four quadrants. The lower-left panel holds q&#8321; fixed and '
    +'sweeps q&#8322; through zero: the force on q&#8322; is a straight line through the origin that changes direction as the sign does, and the force '
    +'on q&#8321; is its mirror image. The lower-right panel collapses the whole plane onto one line: every pair of charges with the same product '
    +'feels the same force.',
  grav:'Electricity and gravity are both inverse-square laws, so for any pair of particles their ratio does not depend on the distance. For '
    +'the electron and proton of a hydrogen atom it is k e&sup2;/(G m<sub>e</sub>m<sub>p</sub>) = 2.27 &times; 10<sup>39</sup>: at the Bohr radius the '
    +'electric pull is 8.2 &times; 10<sup>&minus;8</sup> N and the gravitational one 3.6 &times; 10<sup>&minus;47</sup> N. That is why atoms, molecules and '
    +'everything built from them are held together by electric forces, and why gravity only wins for bodies so large that their positive and '
    +'negative charges cancel almost exactly. The lower-left panel turns the comparison round for the macro screen: two masses that pulled as '
    +'hard as its charges would need tens of tonnes each, and squeezed into PhET&rsquo;s 1.35-cm spheres they would have a density of about '
    +'5 &times; 10<sup>10</sup> kg/m&sup3;.',
};

/* ================================================================== *
 *  selfTest kit: the text-box recorder  (projects/simulations/        *
 *  build_buoy/p7_test.js makeShot; unchanged)                        *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  the inline layout sweep (lineage: build_buoy/p7_test.js section I, *
 *  shared by both sims).  Every configuration at every stage size     *
 *  must draw without throwing, draw substance, keep every text op on  *
 *  the canvas and free of entities, tags, NaN and undefined, keep     *
 *  text boxes apart at tools/audit.py's own half-pixel rule, keep     *
 *  data curves out of the legends it placed, and — on a wide stage —  *
 *  keep text out from under the floating readout.                     *
 * ================================================================== */
function layoutSweep(ok,withState,configs,sizes){
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,minFills] of configs) for(const [W,H] of sizes){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; }
        if(W>=900&&t.bb[2]>W-13-280-24&&t.bb[1]<470){ bad='under the readout: "'+t.t.slice(0,30)+'"'; break; }
        /* the HTML #hint's corner (left 14, bottom 11, 11-px text up to ~330 px long) */
        if(t.bb[0]<14+330&&t.bb[3]>H-26){ bad='in the hint\'s corner: "'+t.t.slice(0,30)+'"'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i=0;i<texts.length&&!hit;i++) for(let j=i+1;j<texts.length;j++){
        const a=texts[i].bb, b=texts[j].bb;
        if(Math.min(a[2],b[2])-Math.max(a[0],b[0])>0.5&&Math.min(a[3],b[3])-Math.max(a[1],b[1])>0.5){
          hit='"'+texts[i].t.slice(0,24)+'" vs "'+texts[j].t.slice(0,24)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i=0;i<POLY_SEGS.length;i+=4){
        const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses a legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legends clear');
    });
  }
}

/* ================================================================== *
 *  selfTest — headless verification.  Values labelled (derive) are    *
 *  lines of build/coulombs-law/refvals.txt, the printed output of     *
 *  derive.py (scipy.constants CODATA 2022), read in full.             *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();
  const stSave=Object.assign({},ST);
  function withState(over,fn){
    Object.assign(ST,DEFAULTS,over);
    try{ return fn(); } finally{ Object.assign(ST,stSave); }
  }

  /* ---------- 0. the shared-helper fixes cannot rot ---------- */
  ok(plain('&Delta;x &theta; &#955;')==='Δx θ λ','plain() decodes named, capital and numeric entities');
  ok(plain('a<sub>B</sub>b')==='aBb','plain() strips tags');
  ok(ticksFor(0.8,0.2,5).length===1&&ticksFor(0.2,0.8,5).length>=3,'axes() range-sort is what rescues an inverted axis');
  { let threw=false; try{ toRgb('nope'); }catch(e){ threw=true; } ok(threw,'toRgb throws on garbage'); }
  { const stub={beginPath(){},moveTo(){},lineTo(){},stroke(){},save(){},restore(){},setLineDash(){}};
    const bb=box(100,100,200,100); POLY_SEGS=[];
    polyline(stub,bb,[-1,2],[0.5,0.5],0,1,0,1,'#fff',1);
    ok(POLY_SEGS.length===4&&Math.abs(POLY_SEGS[0]-bb.x)<1e-9&&Math.abs(POLY_SEGS[2]-bb.x1)<1e-9,'polyline clips a both-ends-outside segment to the frame edges');
    POLY_SEGS=[]; }
  eq(symRound(-2.5),-3,'symRound(-2.5) = -3, halves away from zero'); eq(symRound(14.499999999999998),14,'a hair under a half rounds down');
  eq(tickNum(-2),'−2','tick numbers carry a true minus'); eq(tickNum(0.5000000000000001),'0.5','and no floating-point tail');

  /* ---------- A. the constants, against absolute numbers ---------- */
  eq(EPS0,8.8541878188e-12,'eps0 (scipy CODATA 2022)'); rel(K_E,8987551786.170797,1e-15,'k = 1/(4 pi eps0) (derive)');
  eq(E_CH,1.602176634e-19,'e, exact since 2019'); eq(G_N,6.6743e-11,'G (CODATA 2022)');
  eq(M_E,9.1093837139e-31,'m_e (CODATA 2022)'); eq(M_P,1.67262192595e-27,'m_p (CODATA 2022)'); eq(A0,5.29177210544e-11,'the Bohr radius (CODATA 2022)');
  eq(K_PHET,8987551e3,'PhET\'s k, 8.987551e9'); eq(E_PHET,1.6021766208e-19,'PhET\'s e, CODATA 2014');
  rel(K_E/K_PHET-1,8.747330593195e-08,1e-6,'k / k_PhET - 1 (derive)'); rel(E_CH/E_PHET-1,8.238791870951e-09,1e-6,'e / e_PhET - 1 (derive)');
  eq(Q_MAX,10,'charges within +-10 units');
  const TM=TRACKS.macro, TA=TRACKS.atomic;
  eq(TM.R,0.00675,'macro radius 6.75 mm (PhET)'); eq(TM.q,0.001,'macro grid 1 mm'); eq(TM.perM,1000,'1000 counts per metre'); eq(TM.sep,0.001,'macro gap 1 mm asked for');
  eq(TM.iL,-50,'macro track from -5 cm'); eq(TM.iR,50,'to +5 cm'); eq(TM.qSI,1e-6,'microcoulombs'); eq(TM.uPerM,100,'centimetres'); eq(TM.places,3,'3 decimals (PhET)');
  eq(TA.R,9.5e-13,'atomic radius 0.95 pm (PhET)'); eq(TA.q,1e-12,'atomic grid 1 pm'); eq(TA.perM,1e12,'1e12 counts per metre'); eq(TA.sep,1e-13,'atomic gap 0.1 pm');
  eq(TA.iL,-50,'atomic track from -50 pm'); eq(TA.iR,50,'to +50 pm'); eq(TA.qSI,E_CH,'charge in e'); eq(TA.uPerM,1e12,'picometres'); eq(TA.places,9,'9 decimals (PhET)');
  eq(TM.C,K_E,'like charges repel: C = +k'); eq(TA.C,K_E,'on both scales');

  /* ---------- B. PhET's closest distances, floating point and all ---------- */
  eq(chargeSteps(TM),14,'macro: 6.75 + 6.75 + 1 mm = 14.4999... snaps DOWN to 14 mm (derive)');
  eq(chargeSteps(TA),2,'atomic: 0.95 + 0.95 + 0.1 pm = 2 pm (derive)');
  rel(14/TM.perM-2*TM.R,0.0005,1e-9,'so the macro gap is 0.5 mm, half what PhET asks for (derive)');
  rel(2/TA.perM-2*TA.R,1e-13,1e-9,'and the atomic gap 0.1 pm (derive)');
  /* a stated property, not a blind spot: with PhET's numbers the gap it asks for
     changes nothing on either screen — 13.5 mm without it also rounds (half away
     from zero) to 14, and 1.9 pm to 2 — so dropping it is an equivalent mutant
     here (it is caught in gravity-force-lab, where the gap matters) */
  eq(symRound((2*TM.R)/TM.q),chargeSteps(TM),'macro: the closest distance is 14 mm with or without the gap');
  eq(symRound((2*TA.R)/TA.q),chargeSteps(TA),'atomic: 2 pm with or without the gap');
  rel(arrowStep(13,ARROW_E0.macro),200,1e-12,'the macro arrow scale starts at 200 N per cm (ladder step 13)');
  rel(arrowStep(15,ARROW_E0.atomic),1e-7,1e-12,'the atomic one at 1e-7 N per pm (step 15)');
  withState({},()=>{ rel(screenModel(ST,'macro').per,200,1e-12,'the macro model carries it'); rel(screenModel(ST,'atomic').per,1e-7,1e-12,'and the atomic model'); });

  /* ---------- C. the forces ---------- */
  const MAC=[[-4,8,-10,20,319.5573968416,'319.557','3.20 × 10²'],[10,10,-7,7,-4585.485605189,'4585.486','4.59 × 10³'],
             [1,-1,-50,50,0.8987551786171,'0.899','8.99 × 10⁻¹'],[5,5,-10,20,-249.6542162825,'249.654','2.50 × 10²'],[-10,10,-7,7,4585.485605189,'4585.486','4.59 × 10³']];
  for(const [q1,q2,i1,i2,F1,dec,sci] of MAC) withState({mq1:q1,mq2:q2,mi1:i1,mi2:i2},()=>{
    const L=screenModel(ST,'macro'), tag='macro '+q1+'/'+q2+' uC at '+i1+'/'+i2+' mm: ';
    rel(L.F1,F1,1e-12,tag+'force on q1 (derive)'); rel(L.F2,-F1,1e-12,tag+'force on q2 (derive)'); close(L.F1+L.F2,0,1e-9,tag+'equal and opposite, from two evaluations');
    rel(L.Fmag,Math.abs(F1),1e-12,tag+'|F| (derive)'); eq(decGrouped(L.Fmag,3),dec,tag+'PhET decimal (derive)'); eq(sciText(L.Fmag,2),sci,tag+'PhET scientific (derive)');
    eq(L.kind,q1*q2<0?'attract':'repel',tag+(q1*q2<0?'unlike signs attract':'like signs repel'));
    ok(q1*q2<0?L.F1>0:L.F1<0,tag+(q1*q2<0?'q1 is pulled toward q2 (+x)':'q1 is pushed away from q2 (-x)')); });
  withState({},()=>{ const L=screenModel(ST,'macro');
    rel(L.kq,-0.2876016571575,1e-12,'macro k q1 q2 at the defaults (derive)'); rel(L.Fphet,319.5573688889,1e-12,'PhET\'s readout with its k (derive)');
    eq(L.lab1,'Force on q₁ by q₂ = 319.557 N','the macro label, decimal (derive)'); eq(L.lab2,'Force on q₂ by q₁ = 319.557 N','both labels the same magnitude');
    rel(L.r,0.03,1e-15,'3 cm apart'); rel(L.gap,0.0165,1e-12,'1.65 cm between surfaces'); rel(L.dmin,0.014,1e-15,'closest 1.4 cm'); });
  const ATO=[[-2,4,-20,20,1.153538775389e-06,'0.000 001 154','1.15 × 10⁻⁶'],[10,10,-1,1,-0.005767693876946,'0.005 767 694','5.77 × 10⁻³'],
             [1,-1,-50,50,2.307077550778e-08,'0.000 000 023','2.31 × 10⁻⁸'],[3,3,-20,20,-1.297731122313e-06,'0.000 001 298','1.30 × 10⁻⁶']];
  for(const [q1,q2,i1,i2,F1,dec,sci] of ATO) withState({aq1:q1,aq2:q2,ai1:i1,ai2:i2},()=>{
    const L=screenModel(ST,'atomic'), tag='atomic '+q1+'/'+q2+' e at '+i1+'/'+i2+' pm: ';
    rel(L.F1,F1,1e-12,tag+'force on q1 (derive)'); rel(L.F2,-F1,1e-12,tag+'force on q2 (derive)'); close(L.F1+L.F2,0,1e-20,tag+'equal and opposite');
    eq(decGrouped(L.Fmag,9),dec,tag+'PhET decimal (derive)'); eq(sciText(L.Fmag,2),sci,tag+'PhET scientific (derive)'); });
  withState({},()=>{ const L=screenModel(ST,'atomic');
    rel(L.kq,-1.845662040623e-27,1e-12,'atomic k q1 q2 (derive)'); rel(L.Fphet,1.153538655478e-06,1e-12,'PhET\'s readout with its k and e (derive)');
    eq(L.lab1,'Force on q₁ by q₂ = 1.15 × 10⁻⁶ N','the atomic label, scientific by default (derive)'); eq(L.mode,'sci','the atomic screen starts scientific (PhET)');
    rel(L.acc,1.153538775389e-06/1.67262192595e-27,1e-12,'the pull on a proton as an acceleration'); });
  withState({mForce:false},()=>eq(screenModel(ST,'macro').lab1,'Force on q₁ by q₂','force values off: the label keeps no value'));
  withState({mSci:true},()=>eq(screenModel(ST,'macro').lab1,'Force on q₁ by q₂ = 3.20 × 10² N','macro in scientific notation (derive)'));
  withState({mq1:0},()=>{ const L=screenModel(ST,'macro'); eq(L.Fmag,0,'a zero charge: no force'); eq(L.kind,'none','and no direction'); eq(L.lab1,'Force on q₁ by q₂ = 0.000 N','labelled 0.000 N'); });
  withState({aq2:0},()=>eq(screenModel(ST,'atomic').lab1,'Force on q₁ by q₂ = 0.000 000 000 N','a zero force stays decimal in scientific mode (PhET)'));

  /* ---------- D. the actions ---------- */
  withState({},()=>{
    setCharge(ST,'macro',1,14); eq(ST.mq1,10,'a charge is clamped to +10'); setCharge(ST,'macro',2,-12); eq(ST.mq2,-10,'and to -10');
    setCharge(ST,'atomic',1,2.6); eq(ST.aq1,3,'charge is ROUNDED to whole units (2.6 -> 3)');
    eq(ST.mi1,-10,'a new charge moves nothing (fixed radius)'); eq(ST.mi2,20,'on either side');
    setPosCL(ST,'macro',1,0.02); eq(ST.mi1,6,'dragging q1 onto q2 stops it 14 mm short'); setPosCL(ST,'macro',2,-0.05); eq(ST.mi2,20,'q2 held: the closest is now 14 mm from q1 at 6 mm');
    setPosCL(ST,'macro',2,0.0104); eq(ST.mi2,20,'10.4 mm is inside q1\'s exclusion: held at 6 + 14 = 20 mm');
    setPosCL(ST,'macro',2,0.0414); eq(ST.mi2,41,'41.4 mm snaps to 41 mm'); setPosCL(ST,'macro',2,0.0416); eq(ST.mi2,42,'41.6 mm snaps to 42 mm');
    setPosCL(ST,'macro',1,-0.09); eq(ST.mi1,-50,'held at the left end, -5 cm');
    setPosCL(ST,'atomic',1,2e-11); eq(ST.ai1,18,'atomic q1 dragged onto q2 stops 2 pm short');
    setPosCL(ST,'atomic',2,9e-11); eq(ST.ai2,50,'atomic q2 held at +50 pm');
    rulerToQ1(ST,'macro'); eq(ST.mRulerI,ST.mi1,'ruler to q1'); eq(ST.mRulerY,0,'tick edge on the centre line');
    rulerHomeCL(ST,'macro'); eq(ST.mRulerI,-50,'ruler home'); eq(ST.mRulerY,null,'at its home height');
    setRulerCL(ST,'atomic',-1e-9,0); eq(ST.aRulerI,-100,'the atomic ruler stops half a ruler left of the track');
    setRulerCL(ST,'atomic',1e-9); eq(ST.aRulerI,50,'and at the right end'); eq(ST.aRulerY,0,'a y left undefined keeps the height'); });

  /* ---------- E. the inverse square ---------- */
  for(const [w,over,F0,Ft,F2,kq,lo,hi,F3] of [['macro',{scale:'macro'},1467.355393661,28.76016571575,79.88934921041,0.2876016571575,0.00675,0.2,0.6162892653374],
      ['atomic',{scale:'atomic'},0.0004614155101557,1.845662040623e-07,2.883846938473e-07,1.845662040623e-27,9.5e-13,2e-10,3.691324081245e-26]])
    withState(Object.assign({view:'inv'},over),()=>{ const I=buildModel().I, tag='inverse square, '+w+': ';
      rel(I.Fnear,F0,1e-12,tag+'F at the closest distance (derive)'); rel(I.Ffar,Ft,1e-12,tag+'F across the track (derive)'); rel(I.F2r,F2,1e-12,tag+'F at 2r (derive)');
      rel(I.prod,kq,1e-12,tag+'|k q1 q2| (derive)'); rel(I.lo,lo,1e-12,tag+'window from half the touching distance (derive)'); rel(I.hi,hi,1e-12,tag+'to twice the track (derive)');
      rel(I.lin.F3r2[0],F3,1e-12,tag+'the inverse-cube comparison through the live point (derive)');
      close(I.slope,-2,1e-9,tag+'log-log slope -2');
      let flat=0; for(const v of I.lin.Fr2) flat=Math.max(flat,Math.abs(v/kq-1)); ok(flat<1e-12,tag+'|F| r^2 flat to '+flat.toExponential(1)); });
  withState({view:'inv',mq1:0},()=>{ const I=buildModel().I; eq(I.prod,0,'a zero charge: the law\'s constant is zero'); });

  /* ---------- F. the charge product ---------- */
  for(const [w,ku,f0,f1] of [['macro',9.986168651301,10,500],['atomic',1.441923469236e-07,2e-07,1e-05]])
    withState({view:'prod',scale:w},()=>{ const P=buildModel().P, L=buildModel().L, tag='charge product, '+w+': ';
      rel(P.ku,ku,1e-12,tag+'|F| per unit^2 of product (derive)'); eq(P.levels.length,6,tag+'six contour levels (derive)');
      rel(P.levels[0],f0,1e-12,tag+'first level (derive)'); rel(P.levels[5],f1,1e-12,tag+'last level (derive)');
      for(const C of P.contours){ const i=30; rel(ku*C.xs[i]*C.ys[i],C.F,1e-12,tag+'a point on the '+sciPlain(C.F,1)+' N contour feels it'); }
      rel(P.F2s[40],forceOn(K_E,L.q1,10*L.T.qSI,L.x1,L.x2,2),1e-12,tag+'the q2 line ends at q2 = +10');
      close(P.F2s[20],0,1e-30,tag+'and crosses zero at q2 = 0'); rel(P.F1s[40],-P.F2s[40],1e-12,tag+'the force on q1 mirrors it');
      rel(P.Fps[40],ku*100,1e-12,tag+'the product line: +100 units^2 pushes q2 by ku x 100');
      ok(P.Fps[0]<0&&P.Fps[40]>0,tag+'negative products attract, positive repel');
      rel(P.dFdq2,ku*L.Q1,1e-12,tag+'dF2/dq2 = ku q1'); });
  withState({view:'prod',mq1:0},()=>eq(buildModel().P.live.c,0,'a zero charge has no live contour'));

  /* ---------- G. electricity and gravity ---------- */
  withState({view:'grav'},()=>{ const E=buildModel().E;
    rel(E.ratioEP,2.268661431486e+39,1e-11,'k e^2 / (G m_e m_p) (derive)'); rel(E.ratioPP,1.235551631585e+36,1e-11,'two protons (derive)'); rel(E.ratioEE,4.165608752511e+42,1e-11,'two electrons (derive)');
    rel(E.FeA0,8.238723503832e-08,1e-11,'Coulomb at the Bohr radius (derive)'); rel(E.FgA0,3.631535049475e-47,1e-11,'gravity there (derive)');
    rel(E.FeA0/E.FgA0,E.ratioEP,1e-12,'the ratio at the Bohr radius is the ratio');
    rel(E.Fe[0]/E.Fg[0],E.ratioEP,1e-12,'and at a femtometre'); rel(E.Fe[90]/E.Fg[90],E.ratioEP,1e-12,'and at a metre: distance cancels');
    rel(E.mEq,65643.66647458,1e-11,'equal masses for the macro defaults (derive)'); rel(E.rhoEq,50955715297.57,1e-11,'their density in 6.75-mm spheres (derive)');
    rel(E.ms[50]/1000,11604.27042653*10/1000,1e-11,'per microcoulomb sqrt(k/G) x 1e-6 C, times 10 at 100 uC^2 (derive)');
    rel(forceMag(G_N,E.mEq,E.mEq,0.03),319.5573968416,1e-12,'and those masses really pull 319.557 N at 3 cm (derive)');
    rel(E.Fa0,1.153538775389e-06,1e-12,'the atomic pair at 40 pm (derive)'); eq(E.prodM,32,'|q1 q2| = 32 uC^2'); });
  rel(ratioEG(M_E,M_P),2.268661431486e+39,1e-11,'ratioEG (derive)'); rel(equalMass(1e-6,1e-6),11604.27042653,1e-11,'equalMass per microcoulomb (derive)');

  /* ---------- H. the models, the readouts, the scene ---------- */
  for(const [v] of TABS) for(const over of [{},{scale:'atomic'},{mq1:0,aq1:0},{mForce:false,aForce:false},{mq1:10,mq2:10,mi1:-7,mi2:7}]){
    const M=withState(Object.assign({view:v},over),()=>buildModel());
    const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
    ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0&&html.indexOf('Infinity')<0,'panels clean for '+v+' '+JSON.stringify(over)); }
  { const rm=withState({view:'macro'},()=>readoutHTML(buildModel()));
    ok(rm.indexOf('319.6 N')>=0,'the macro readout prints |F| = 319.6 N off the model'); ok(rm.indexOf('attract (unlike signs)')>=0,'and says attract');
    ok(rm.indexOf('1.40 cm (a 0.50 mm gap)')>=0,'and the 1.40-cm closest distance with its 0.50-mm gap');
    ok(rm.indexOf('319.5574 N')>=0,'and PhET\'s 319.5574 N');
    const ra=withState({view:'atomic'},()=>readoutHTML(buildModel())); ok(ra.indexOf('1.154 &times; 10<sup>-6</sup> N')>=0,'the atomic readout prints 1.154e-6 N');
    ok(ra.indexOf('6.90 &times; 10<sup>20</sup> m/s&sup2;')>=0,'and the 6.90e20 m/s^2 on a proton');
    const rg=withState({view:'grav'},()=>readoutHTML(buildModel())); ok(rg.indexOf('2.269 &times; 10<sup>39</sup>')>=0,'the gravity readout prints the 2.269e39 ratio');
    ok(rg.indexOf('65.6 tonnes each')>=0,'and the 65.6-tonne equal masses');
    const rr=withState({view:'macro',mq1:5,mq2:5},()=>readoutHTML(buildModel())); ok(rr.indexOf('repel (like signs)')>=0,'like charges read repel'); }
  { const shot=makeShot(1100,712); const S=makeScene({getContext:()=>shot});
    Object.assign(ST,DEFAULTS);
    ok(!S.step(),'nothing here runs on a clock');
    for(const w of ['macro','atomic']){
      ST.view=w; Object.assign(ST,DEFAULTS); ST.view=w;
      const p=PRE[w], u=TRACKS[w].uPerM;
      let LS=labSpec(buildModel()), Gm=labGeo(shot,S.W,S.H,LS);
      const X1=Gm.X(LS.bodies[0].x);
      ok(S.pointer('down',X1,Gm.yT),w+': pointer-down on q1 grabs it'); eq(DRAG.what,1,w+': it is q1');
      const step=w==='macro'?0.5:5;                              /* 0.5 cm, 5 pm */
      S.pointer('move',X1+step*Gm.s,Gm.yT); eq(ST[p+'i1'],w==='macro'?-5:-15,w+': the drag moves q1 by half a unit of the ruler');
      S.pointer('move',X1+60*step*Gm.s,Gm.yT); eq(ST[p+'i1'],ST[p+'i2']-chargeSteps(TRACKS[w]),w+': and stops at PhET\'s closest distance');
      ok(S.pointer('up',0,0),w+': released');
      LS=labSpec(buildModel()); Gm=labGeo(shot,S.W,S.H,LS);
      /* the hit radius, pinned from both sides: grabbed 0.6 of a radius off
         centre (a dead-centre press cannot see the radius at all), and missed
         just outside it */
      { const X2=Gm.X(LS.bodies[1].x), Rp=Math.max(8,LS.bodies[1].r*Gm.s)+4;
        ok(S.pointer('down',X2+0.6*LS.bodies[1].r*Gm.s,Gm.yT),w+': q2 grabbed 0.6 of a radius off centre'); eq(DRAG.what,2,w+': it is q2'); S.pointer('up',0,0);
        ok(!S.pointer('down',X2+Rp+2,Gm.yT)&&DRAG.what===null,w+': a press 2 px outside the hit radius misses'); }
      const g=Gm.ruler; ok(S.pointer('down',(g.x0+g.x1)/2,g.y0+10),w+': the ruler grabs'); eq(DRAG.what,'ruler',w+': it is the ruler');
      S.pointer('move',(g.x0+g.x1)/2+2*(w==='macro'?1:10)*Gm.s,g.y0+10); eq(ST[p+'RulerI'],w==='macro'?-30:-30,w+': the ruler slides two major ticks');
      S.pointer('up',0,0);
      ok(!S.pointer('down',Gm.b.x+2,Gm.b.y+2),w+': empty stage grabs nothing'); }
    ST.view='inv'; ok(!S.pointer('down',300,300),'the analysis views ignore the pointer'); ST.view='grav'; ok(!S.pointer('down',300,300),'all of them');
    Object.assign(ST,stSave); }

  /* ---------- I. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['macro default',{view:'macro'},6],['macro scientific',{view:'macro',mSci:true},6],['macro hidden',{view:'macro',mForce:false},6],
    ['macro repel',{view:'macro',mq1:5,mq2:5},6],['macro zero',{view:'macro',mq1:0},6],['macro close',{view:'macro',mq1:10,mq2:-10,mi1:-7,mi2:7},6],
    ['macro far',{view:'macro',mq1:1,mq2:-1,mi1:-50,mi2:50},6],['macro ruler on q1',{view:'macro',mRulerI:-10,mRulerY:0},6],['macro arrows huge',{view:'macro',mArrowK:6},6],
    ['atomic default',{view:'atomic'},6],['atomic decimal',{view:'atomic',aSci:false},6],['atomic close',{view:'atomic',aq1:10,aq2:10,ai1:-1,ai2:1},6],
    /* floors from what each draws: at 560 px an atomic charge is a 4-px ball with
       no highlight and a tick for an arrow (4 fills); a zero charge in the
       inverse-square view is the background and a sentence saying why (1) */
    ['atomic far',{view:'atomic',aq1:1,aq2:-1,ai1:-50,ai2:50},4],['atomic zero',{view:'atomic',aq2:0},4],['atomic ruler on q1',{view:'atomic',aRulerI:-20,aRulerY:0},4],
    ['inv macro',{view:'inv'},5],['inv atomic',{view:'inv',scale:'atomic'},5],['inv repel close',{view:'inv',mq1:10,mq2:10,mi1:-7,mi2:7},5],['inv zero',{view:'inv',mq1:0},1],
    ['prod macro',{view:'prod'},5],['prod atomic',{view:'prod',scale:'atomic'},5],['prod repel',{view:'prod',mq1:7,mq2:3},5],['prod zero',{view:'prod',mq1:0},5],
    ['grav default',{view:'grav'},5],['grav zero',{view:'grav',aq1:0,mq1:0},5],['grav big',{view:'grav',mq1:10,mq2:10,aq1:10,aq2:-10,ai1:-1,ai2:1},5],
  ];
  layoutSweep(ok,withState,CONFIGS,SIZES);

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
