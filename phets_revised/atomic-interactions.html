    +'the energy the atom was released with, so both turning points sit at exactly 1';
  const N=noteFit(ctx,noteLimit(Lo),Lo.main,note,
    'ω = '+sigf(P.omega,4)+' rad/ps, T = '+sigf(P.period,4)+' ps, μ = '
    +sigf(P.mu,4)+' u'), b=N.b;
  /* the height above the floor of the well, in units of the release energy:
     a zoomed absolute V/eps axis needs six decimals and its tick labels then
     run into the rotated axis title (found by the layout sweep). */
  const scale=Math.max(S.E/P.eps+1,1e-12);
  const yv=v=>(v+1)/scale;
  const ys=S.ys.map(yv), hs=S.hs.map(yv);
  let ylo=0, yhi=1;
  for(let i=0;i<ys.length;i++){ ylo=Math.min(ylo,ys[i],hs[i]); yhi=Math.max(yhi,ys[i],hs[i]); }
  yhi=Math.min(yhi,8);
  const pad=0.09*(yhi-ylo); ylo-=pad; yhi+=pad;
  axesR(ctx,b,S.lo,S.hi,ylo,yhi,{xlab:'separation r, pm',ylab:'(V + ε) / (E + ε)',
    nx:nxFor(b),ny:nyFor(b),
    xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,2),
    title:titleFor(b,'the bottom of the well and the parabola through it','the well bottom')});
  polyline(ctx,b,S.xs,hs,S.lo,S.hi,ylo,yhi,COL.ref,1.8,[5,4]);
  polyline(ctx,b,S.xs,ys,S.lo,S.hi,ylo,yhi,COL.pos,2);
  polyline(ctx,b,[P.rmin,P.rmin],[ylo,yhi],S.lo,S.hi,ylo,yhi,rgba(COL.struct,0.45),1,[2,3]);
  if(S.tp&&isFinite(S.tp.rOut)){
    polyline(ctx,b,[S.lo,S.hi],[1,1],S.lo,S.hi,ylo,yhi,rgba(COL.live,0.6),1.2,[4,4]);
    [S.tp.rIn,S.tp.rOut].forEach(r=>{
      if(r>=S.lo&&r<=S.hi) marker(ctx,b,S.lo,S.hi,ylo,yhi,r,1,COL.live); });
  }
  regLegend(legendAuto(ctx,b,[[COL.pos,'V(r)'],[COL.ref,'the parabola ½V″(r_min)(r−r_min)²'],
                    [COL.live,'E and its turning points']]));
  drawNoteIf(ctx,N);

  const pb=Lo.bottom[0];
  if(pb&&S.as.length>2){
    const xl=Math.log10(S.as[0]), xh=Math.log10(S.as[S.as.length-1]);
    const yl=-9, yh=0.6;
    axesR(ctx,pb,xl,xh,yl,yh,{xlab:'log₁₀ amplitude a, pm',ylab:'log₁₀ (T/T₀ − 1)',
      nx:nxFor(pb),ny:nyFor(pb),
      xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,0),
      title:titleFor(pb,'how fast the period leaves 2π/ω — and Landau’s law for it','T(a)/T₀ − 1')});
    const lx=S.as.map(a=>Math.log10(a));
    /* the two agree, so the measured curve covers the prediction: draw the
       prediction WIDE and sparsely dashed so it reads as beads either side of
       the green (the four-colour-fan lesson: when N things coincide, say so) */
    polyline(ctx,pb,lx,S.pred.map(v=>Math.log10(Math.max(v,1e-30))),xl,xh,yl,yh,COL.ref,5,[3,9]);
    polyline(ctx,pb,lx,S.ex.map(v=>Math.log10(Math.max(v,1e-30))),xl,xh,yl,yh,COL.pos,1.8);
    if(S.aNow>0&&isFinite(S.Tnow))
      marker(ctx,pb,xl,xh,yl,yh,clamp(Math.log10(S.aNow),xl,xh),
             clamp(Math.log10(Math.max(S.Tnow/P.period-1,1e-30)),yl,yh),COL.live);
    regLegend(legendAuto(ctx,pb,[[COL.pos,'the quadrature'],[COL.ref,'(91/4) a²/r_min² — under it'],
                                 [COL.live,'the slider']]));
  }
}

/* ---------------- E. the atom pairs ---------------- */
function drawPairs(ctx,W,H,M){
  const R=M.PR, st=M.st;
  reserveReadout(W,H);
  const Lo=stageLayoutH(ctx,W,H,PAIRS_CAP_FULL,PAIRS_CAP_SHORT,2,0.42,1);
  drawCaption(ctx,Lo);
  const note='every well is drawn at depth 1 so the SHAPES can be compared; the depths are the '
    +'bars below   ·   solid: PhET’s σ   ·   dashed: the literature’s σ, by '
    +'Lorentz–Berthelot for the mixed pairs   ·   the adjustable pair has no literature value';
  const N=noteFit(ctx,noteLimit(Lo),Lo.main,note,
    'the wells are drawn at depth 1: the depths are the bars below'), b=N.b;
  const xhi=520, ylo=-1.32, yhi=0.42;
  axesR(ctx,b,120,xhi,ylo,yhi,{xlab:'separation r, pm',ylab:'V(r) / ε',nx:nxFor(b),ny:nyFor(b),
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1),
    title:titleFor(b,'every pair PhET offers — solid PhET, dashed the literature','the wells')});
  polyline(ctx,b,[120,xhi],[0,0],120,xhi,ylo,yhi,'#3a4152',1,[3,4]);
  polyline(ctx,b,[120,xhi],[-1,-1],120,xhi,ylo,yhi,rgba(COL.struct,0.30),1,[3,4]);
  const items=[];
  R.rows.forEach((row,i)=>{
    const c=neonCss(i/(R.rows.length-1));
    const xs=[],ys=[],ls=[],lys=[];
    for(let k=0;k<=200;k++){
      const r=120+(xhi-120)*k/200;
      xs.push(r); ys.push(ljV(r,row.sig,1));
      if(row.lsig!==undefined){ ls.push(r); lys.push(ljV(r,row.lsig,1)); }
    }
    polyline(ctx,b,xs,ys,120,xhi,ylo,yhi,c,1.7);
    if(st.showLit&&row.lsig!==undefined) polyline(ctx,b,ls,lys,120,xhi,ylo,yhi,c,1.2,[4,4]);
    items.push([c,row.label]);
  });
  const legR=legendAuto(ctx,b,items);
  regLegend(legR);
  /* with seven curves across one panel legendAuto correctly finds no clear
     corner and draws nothing; then nothing says which colour is which, so each
     well is named at its own minimum instead */
  if(!legR) R.rows.forEach((row,i)=>{
    const c=neonCss(i/(R.rows.length-1)), rm=rMin(row.sig);
    if(rm<120||rm>xhi) return;
    lab(ctx,W,H,b.x+b.w*(rm-120)/(xhi-120),
        b.y1-b.h*(-1-ylo)/(yhi-ylo)-12,row.key,c,SM_FONT,'center');
  });
  drawNoteIf(ctx,N);

  /* sigma bars */
  const sb=Lo.bottom[0];
  if(sb){
    const rows=R.rows.filter(r=>r.lsig!==undefined);
    const hi=Math.max.apply(null,rows.map(r=>Math.max(r.sig,r.lsig,r.rmin,r.lrmin)))*1.12;
    axesR(ctx,sb,-0.5,rows.length-0.5,0,hi,{ylab:'pm',nx:1,ny:nyFor(sb),
      xticks:[],yfmt:t=>fmt(t,0),
      title:titleFor(sb,'σ: PhET’s against the literature’s σ and r_min','σ')});
    rows.forEach((row,i)=>{
      const w=sb.w/rows.length*0.20;
      const X=x=>sb.x+sb.w*(x+0.5)/rows.length;
      const Y=v=>sb.y1-sb.h*v/hi;
      const bar=(dx,v,col)=>{ ctx.fillStyle=col; ctx.fillRect(X(i)+dx-w/2,Y(v),w,sb.y1-Y(v)); };
      bar(-w*1.1,row.sig,rgba(COL.pos,0.85));
      bar(0,row.lsig,rgba(COL.ref,0.85));
      bar(w*1.1,row.lrmin,rgba(COL.struct,0.85));
      lab(ctx,W,H,X(i),sb.y1+12,row.key,COL.dim,SM_FONT,'center','top');
    });
    regLegend(legendAuto(ctx,sb,[[COL.pos,'PhET σ'],[COL.ref,'literature σ'],[COL.struct,'literature r_min']]));
  }
  /* epsilon bars, on a log axis (oxygen is 1000 K) */
  const eb=Lo.bottom[1];
  if(eb){
    const rows=R.rows.filter(r=>r.leps!==undefined);
    const yl=Math.log10(20), yh=Math.log10(1400);
    axesR(ctx,eb,-0.5,rows.length-0.5,yl,yh,{ylab:'ε/k_B, K (log₁₀)',nx:1,ny:nyFor(eb),
      xticks:[],yfmt:t=>fmt(Math.pow(10,t),0),
      title:titleFor(eb,'ε: PhET’s against the literature’s','ε')});
    rows.forEach((row,i)=>{
      const w=eb.w/rows.length*0.26;
      const X=x=>eb.x+eb.w*(x+0.5)/rows.length;
      const Y=v=>eb.y1-eb.h*(Math.log10(v)-yl)/(yh-yl);
      const bar=(dx,v,col)=>{ ctx.fillStyle=col; ctx.fillRect(X(i)+dx-w/2,Math.min(Y(v),eb.y1),w,Math.max(0,eb.y1-Y(v))); };
      bar(-w*0.6,row.eps,rgba(COL.pos,0.85));
      bar(w*0.6,row.leps,rgba(COL.ref,0.85));
      lab(ctx,W,H,X(i),eb.y1+12,row.key,COL.dim,SM_FONT,'center','top');
    });
    regLegend(legendAuto(ctx,eb,[[COL.pos,'PhET ε'],[COL.ref,'literature ε']]));
  }
}

/* ---------------- F. the integrator ---------------- */
function drawSteppers(ctx,W,H,M){
  const I=M.IT, P=M.P;
  reserveReadout(W,H);
  const Lo=stageLayoutH(ctx,W,H,STEP_CAP_FULL,STEP_CAP_SHORT,0,0,0);
  drawCaption(ctx,Lo);
  const note=P.label+' released at rest '+fmt(I.r0-P.rmin,0)+' pm outside the minimum; one '
    +'period is '+sigf(I.T,4)+' ps   ·   both axes of both panels are log₁₀   ·   '
    +'values below 10⁻¹³ ε are clipped to the axis floor';
  const N=noteFit(ctx,noteLimit(Lo),Lo.main,note,
    P.label+', released 10 pm out; both axes log₁₀');
  /* Two stacked panels under ~110 px each put their rotated y-axis titles on
     top of one another, whatever the gap: a rotated title is as long as its
     text and it is centred on the panel.  On a narrow stage draw ONE panel —
     the boundedness one, which carries the point — and say why the other is
     missing (waveguides/pupil_plane Known-bad: give a view a narrow mode). */
  const split=splitRow(N.b,2,62);
  const tooShort=split[0].w===N.b.w&&split[0].h<110;
  const ob=tooShort?null:split[0], db=tooShort?N.b:split[1];
  const KIND=[['verlet',COL.pos,'velocity Verlet'],['symplectic',COL.struct,'semi-implicit Euler (PhET’s)'],
              ['forward',COL.ref,'forward Euler']];
  /* order */
  if(ob){
  const xl=Math.log10(I.dts[I.dts.length-1])-0.15, xh=Math.log10(I.dts[0])+0.15;
  let yl=0, yh=-20;
  KIND.forEach(([k])=>{ I.curves[k].es.forEach(v=>{ const l=Math.log10(Math.max(v,1e-30));
    yl=Math.min(yl,l); yh=Math.max(yh,l); }); });
  yl-=0.4; yh+=0.4;
  axesR(ctx,ob,xl,xh,yl,yh,{xlab:'log₁₀ Δt, ps',ylab:'log₁₀ max|ΔE| / ε',
    nx:nxFor(ob),ny:nyFor(ob),
    xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,0),
    title:titleFor(ob,'the order: energy error over one period against Δt','the order')});
  KIND.forEach(([k,c])=>{
    polyline(ctx,ob,I.dts.map(Math.log10),I.curves[k].es.map(v=>Math.log10(Math.max(v,1e-30))),
             xl,xh,yl,yh,c,1.8);
    I.dts.forEach((dt,i)=>{
      const X=ob.x+ob.w*(Math.log10(dt)-xl)/(xh-xl);
      const Y=ob.y1-ob.h*(Math.log10(Math.max(I.curves[k].es[i],1e-30))-yl)/(yh-yl);
      if(Y>=ob.y&&Y<=ob.y1) dot(ctx,X,Y,3,c,'#0a0c12',1);
    });
  });
  regLegend(legendAuto(ctx,ob,KIND.map(([k,c,n])=>[c,n+'  p = '+fmt(I.curves[k].order,2)])));
  }

  /* boundedness */
  let dyl=0,dyh=-20;
  KIND.forEach(([k])=>{ I.drift[k].ds.forEach(v=>{ const l=Math.log10(Math.max(v,1e-30));
    dyl=Math.min(dyl,l); dyh=Math.max(dyh,l); }); });
  dyl=Math.max(dyl,-13)-0.3; dyh+=0.5;
  axesR(ctx,db,0,I.nPer,dyl,dyh,{xlab:'time, in periods',ylab:'log₁₀ |E(t) − E(0)| / ε',
    nx:nxFor(db),ny:nyFor(db),
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0),
    title:titleFor(db,'the boundedness: the same run at Δt = 1 fs','boundedness')});
  const ENDS=[];
  KIND.forEach(([k,c,nm])=>{
    const ys=I.drift[k].ds.map(v=>Math.log10(Math.max(v,1e-30)));
    polyline(ctx,db,I.drift[k].ts,ys,0,I.nPer,dyl,dyh,c,1.4);
    /* Each curve is tagged at its own end rather than relying on the legend:
       with three curves across a narrow panel legendAuto finds no clear corner
       and correctly draws nothing, and then nothing on the canvas says which
       line is which (the legend-entry-for-a-curve-not-drawn lesson, inverted). */
    const n=ys.length;
    if(n){
      const X=db.x+db.w*I.drift[k].ts[n-1]/I.nPer;
      const Y=db.y1-db.h*(ys[n-1]-dyl)/(dyh-dyl);
      if(Y>=db.y&&Y<=db.y1) dot(ctx,clamp(X,db.x,db.x1),Y,3.2,c,'#0a0c12',1);
      ENDS.push([k,c,nm,clamp(X,db.x,db.x1),Y]);
    }
  });
  const legD=legendAuto(ctx,db,KIND.map(([k,c,n])=>[c,n]));
  regLegend(legD);
  /* the end tags exist so a panel that could not place a legend still says
     which curve is which — with a legend they are redundant clutter */
  if(!legD) for(const [k,c,nm,X,Y] of ENDS)
    if(Y>=db.y&&Y<=db.y1) lab(ctx,W,H,X-8,Y,nm.split(' ')[0],c,SM_FONT,'right');
  const nb=ob?box(ob.x,ob.y,db.x1-ob.x,db.y1-ob.y):db;
  if(N.fits) drawNote(ctx,nb,N.txt);
  else if(!ob) lab(ctx,W,H,db.x,db.y-24,
    'the Δt panel needs a wider stage; its slopes are ' +
    KIND.map(([k,c,n])=>n.split(' ')[0]+' '+fmt(I.curves[k].order,2)).join(', '),
    COL.dim,SM_FONT,'left');
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='atoms') drawAtoms(ctx,W,H,M);
  else if(M.view==='well') drawWell(ctx,W,H,M);
  else if(M.view==='motion') drawMotion(ctx,W,H,M);
  else if(M.view==='small') drawSmall(ctx,W,H,M);
  else if(M.view==='pairs') drawPairs(ctx,W,H,M);
  else drawSteppers(ctx,W,H,M);
}

function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame of the clock.  dtFrame is model time; the integrator substeps at
     DT_INT so the step size never depends on the frame rate. */
  S.advance=function(dtFrame){
    const P=pairInfo(ST);
    let left=dtFrame;
    const s={r:ST.r,v:ST.v,a:ljF(ST.r,P.sig,P.eps)/P.mu,t:ST.t};
    while(left>1e-12){
      const dt=Math.min(DT_INT,left);
      stepVerlet(s,P.sig,P.eps,P.mu,dt);
      left-=dt;
      if(s.r<0.55*P.sig){ s.r=0.55*P.sig; s.v=Math.abs(s.v); }   /* the wall, stated on the canvas */
      if(s.r>6*P.sig){ ST.running=false; break; }
    }
    ST.r=s.r; ST.v=s.v; ST.t=s.t;
    const K=0.5*P.mu*s.v*s.v, V=ljV(s.r,P.sig,P.eps);
    TRAIL.push([s.t,s.r,K,V]);
    if(TRAIL.length>TRAIL_MAX) TRAIL.splice(0,TRAIL.length-TRAIL_MAX);
  };
  S.step=function(){
    if(!ST.running) return false;
    S.advance(PS_PER_SEC*(ST.slow?SLOW_FACTOR:1)/60);
    return true;
  };
  S.ended=function(){ return !ST.running; };
  /* the pointer: drag the movable atom, on the two-atoms view */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    if(ST.view!=='atoms') return false;
    const ctx=canvas.getContext('2d'), M=buildModel(), G=atomsGeom(ctx,S.W,S.H,M);
    if(type==='down'){
      const dx=x-G.X(ST.r), dy=y-G.band.cy;
      const hit=Math.hypot(dx,dy)<=Math.max(12,G.rB)+4
        || (x>=G.gb.x&&x<=G.gb.x1&&y>=G.gb.y&&y<=G.gb.y1&&Math.abs(x-G.X(ST.r))<14);
      if(hit){ DRAG.what='atom'; DRAG.off=G.wx(x)-ST.r; ST.running=false; return true; }
      return false;
    }
    if(type==='move'&&DRAG.what==='atom'){ setSep(ST,G.wx(x)-DRAG.off); return true; }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2)); });

  const rows={};
  function slider(id,lab2,lo,hi,step2,fmtf,get,set){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:get()});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=get(); val.textContent=fmtf(get()); };
    inp.addEventListener('input',()=>{ set(parseFloat(inp.value)); syncPanel(); dirty=true; refresh(); });
    rows[id]={row:rowEl,inp,sync}; sync(); return rowEl;
  }
  function checkbox(id,lab2,get,set){
    const inp=h('input',{type:'checkbox'}); inp.checked=!!get();
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ if(inp.disabled) return; set(inp.checked); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+id]={row:el,inp,sync:()=>{ inp.checked=!!get(); }};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onpick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        if(onpick) onpick(o.id); else st[key]=o.id;
        syncChips(); syncPanel(); dirty=true; refresh(); }},o.name));
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }

  /* PhET's Atoms panel: the seven pairs */
  const gPair=h('div',{class:'grp'},h('h3',null,'atoms'));
  gPair.appendChild(chipRow(PAIRS.map(p=>({id:p.key,name:p.label})),'pair',k=>setPair(st,k)));
  const gAdj=h('div',{class:'grp'},h('h3',null,'adjustable attraction'));
  gAdj.appendChild(slider('adjSig','atom diameter σ',PHET_MIN_SIGMA,PHET_MAX_SIGMA,5,
    v=>fmt(v,0)+' pm',()=>st.adjSig,v=>setAdjSig(st,v)));
  gAdj.appendChild(slider('adjEps','interaction ε',PHET_MIN_EPSILON,PHET_MAX_EPSILON,5,
    v=>fmt(v,0)+' K',()=>st.adjEps,v=>setAdjEps(st,v)));
  gAdj.appendChild(h('div',{class:'tag',html:'PhET&rsquo;s own ranges: &sigma; 75&ndash;500 pm and &epsilon;/k<sub>B</sub> 20&ndash;450 K, '
    +'both snapped to multiples of 5. <i>small&ndash;large</i> and <i>weak&ndash;strong</i> are PhET&rsquo;s tick labels.'}));

  /* PhET's Forces control, plus the two model choices this remake adds */
  const gForce=h('div',{class:'grp'},h('h3',null,'forces'));
  gForce.appendChild(chipRow(FORCE_MODES.map(m=>({id:m[0],name:m[1]})),'forces'));
  const gModel=h('div',{class:'grp'},h('h3',null,'the model'));
  gModel.appendChild(h('div',{class:'checks'},
    checkbox('pinned','left atom pinned (PhET’s)',()=>st.pinned,v=>setPinned(st,v)),
    checkbox('lit','literature ε, σ instead of PhET’s',()=>st.lit,v=>setLit(st,v))));
  const modelTag=h('div',{class:'tag'}); gModel.appendChild(modelTag);

  /* the motion */
  const gMotion=h('div',{class:'grp'},h('h3',null,'the motion'));
  gMotion.appendChild(slider('rel','release at r_min +',-20,120,0.5,v=>fmt(v,1)+' pm',
    ()=>st.rel,v=>{ st.rel=v; }));
  gMotion.appendChild(slider('v0f','launch speed',0,1.4,0.02,
    v=>fmt(v,2)+' × escape',()=>st.v0f,v=>{ st.v0f=v; }));
  gMotion.appendChild(h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ releaseAtom(st); syncPanel(); dirty=true; refresh(); }},'release'),
    h('button',{onclick:()=>{ st.running=!st.running; dirty=true; refresh(); }},'play / pause'),
    h('button',{onclick:()=>{ returnAtom(st); syncPanel(); dirty=true; refresh(); }},'return atom')));
  gMotion.appendChild(h('div',{class:'checks'},
    checkbox('slow','slow (PhET’s speed switch)',()=>st.slow,v=>{ st.slow=v; })));
  const motionTag=h('div',{class:'tag'}); gMotion.appendChild(motionTag);

  const gSmall=h('div',{class:'grp'},h('h3',null,'amplitude'));
  gSmall.appendChild(slider('amp','release offset A',0.05,60,0.05,v=>fmt(v,2)+' pm',
    ()=>st.amp,v=>{ st.amp=v; }));

  const gPairs=h('div',{class:'grp'},h('h3',null,'what to overlay'));
  gPairs.appendChild(h('div',{class:'checks'},
    checkbox('showLit','the literature wells, dashed',()=>st.showLit,v=>{ st.showLit=v; })));

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},
    h('button',{onclick:()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; simReset();
      syncChips(); syncPanel(); dirty=true; refresh(); }},'reset all')));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Atomic Interactions (University of Colorado Boulder, '
      +'phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.'}),
    h('div',{class:'src',html:'PhET&rsquo;s values (build 1.2.21): &epsilon;/k<sub>B</sub> 35.8, 111.84, 1000, 59.5, 51, 85 K and '
      +'&sigma; 308, 376, 200, 343, 306, 340 pm; van der Waals radii 154, 188, 152 pm; masses 20.1797, 39.948, 15.9994 u. '
      +'Literature: Ne and Ar from Attard arXiv:1702.00096 Table I (after van Sciver, <i>Helium Cryogenics</i> 2nd ed., 2012); '
      +'Ar and O<sub>2</sub> from Bird, Stewart &amp; Lightfoot, <i>Transport Phenomena</i> 2nd ed. (2007) pp. 864&ndash;865. '
      +'k<sub>B</sub>, m<sub>u</sub>: CODATA 2022 via scipy.constants. Every closed form is pinned in selfTest to '
      +'build/atomic-interactions/derive.py.'}));
  [gPair,gAdj,gForce,gModel,gMotion,gSmall,gPairs,gReset,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    for(const [cw,list,key] of CHIPROWS) [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
  }
  function syncPanel(){
    const v=st.view;
    gAdj.hidden=!(st.pair==='Adj');
    gForce.hidden=!(v==='atoms'||v==='well');
    gMotion.hidden=!(v==='motion');
    gSmall.hidden=!(v==='small');
    gPairs.hidden=!(v==='pairs');
    gModel.hidden=(v==='pairs'||v==='steppers');
    for(const k in rows) rows[k].sync();
    /* the literature switch cannot act on the adjustable pair — its epsilon and
       sigma ARE the two sliders — so disable it there rather than leave a live
       control that does nothing (Known-bad). */
    const litOn=st.pair!=='Adj';
    rows.cb_lit.inp.disabled=!litOn;
    rows.cb_lit.row.style.opacity=litOn?'1':'0.45';
    const P=pairInfo(st);
    modelTag.innerHTML='&mu; = '+sigf(P.mu,5)+' u &mdash; '+(st.pinned
      ? 'only the right atom moves, so &mu; is its own mass'
      : 'both move, so &mu; = m<sub>1</sub>m<sub>2</sub>/(m<sub>1</sub>+m<sub>2</sub>) and every period is shorter')
      +'. T = 2&pi;/&omega; = '+sigf(P.period,4)+' ps.';
    const L=liveModel(st);
    motionTag.innerHTML='escape speed where the atom is now: '+sigf(L.vEsc,4)+' m/s. '
      +'The clock runs at '+fmt(PS_PER_SEC*(st.slow?SLOW_FACTOR:1),2)+' ps per second; the integrator substeps at '
      +fmt(DT_INT*1000,1)+' fs whatever the frame rate.';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='atoms')?'drag the right-hand atom · 1–6 switch views · space plays'
        :'1–6 switch views'+(st.view==='motion'?' · space plays · r releases':'');
      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){
      dirty=true; const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key>='1'&&e.key<=String(TABS.length)){ setView(TABS[+e.key-1][0]); return; }
    if(e.key===' '){ st.running=!st.running; dirty=true; refresh(); }
    if(e.key==='r'||e.key==='R'){ releaseAtom(st); syncPanel(); dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let ticks=0;
  function frameLoop(){
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&(++ticks%6===0)){ const M=S.model();
        roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); } }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  atoms:'This is PhET&rsquo;s screen. Two atoms sit on a line; the left one is pinned and the right one you drag. What holds them, '
    +'pushes them apart and lets them go is one curve &mdash; the Lennard-Jones potential, V(r) = 4&epsilon;[(&sigma;/r)<sup>12</sup> &minus; (&sigma;/r)<sup>6</sup>]. '
    +'The r<sup>&minus;6</sup> term is the London dispersion attraction, which every pair of neutral atoms has because their electron clouds '
    +'fluctuate in step; the r<sup>&minus;12</sup> term is a convenient stand-in for the Pauli repulsion that stops two closed shells occupying the '
    +'same space (it is chosen because it is the square of the r<sup>&minus;6</sup>, not because anything says twelve). Two parameters set the whole '
    +'curve: &sigma;, where it crosses zero, and &epsilon;, how deep it goes. The force is minus its slope, so the atoms attract on the outer '
    +'slope, repel on the inner wall, and feel nothing at all at the bottom &mdash; which is exactly 2<sup>1/6</sup>&sigma;, about 12% outside &sigma;.',
  well:'The force is not an extra assumption: it is the slope of the curve, F(r) = &minus;dV/dr, and everything the atoms do follows from that one '
    +'line. PhET writes the two halves separately &mdash; 48&epsilon;&sigma;<sup>12</sup>/r<sup>13</sup> pushing out and 24&epsilon;&sigma;<sup>6</sup>/r<sup>7</sup> '
    +'pulling in &mdash; and their difference is exactly the derivative, which the readout checks every time you move the atom. The force crosses '
    +'zero at the bottom of the well and is most attractive not there but at the inflection of V, at (26/7)<sup>1/6</sup>&sigma;; past that point pulling '
    +'the atoms further apart gets easier, which is why a solid has a finite tensile strength. The residual panel is the honest version of &ldquo;F is '
    +'the derivative&rdquo;: the closed form minus a numerical derivative of V, in units of the force scale, sitting at the level of one rounding error.',
  motion:'Let go and the atom falls into the well, overshoots, climbs the wall and comes back. Because the total energy is conserved it turns round '
    +'wherever V(r) rises to meet E, and those two points have a closed form: with u = (&sigma;/r)<sup>6</sup> the condition V = E is a quadratic, so '
    +'u<sub>in</sub> + u<sub>out</sub> = 1 exactly. Give it enough speed and E reaches zero, the outer turning point runs off to infinity and the pair '
    +'dissociates &mdash; the dashed curve in the phase portrait is that separatrix. Real neon is not like this: at these depths (&epsilon;/k<sub>B</sub> is '
    +'36 K) the vibration is quantum, the levels are discrete and the zero-point energy is a serious fraction of the well, so a classical trajectory is '
    +'a picture of the potential rather than of the dimer.',
  small:'Close enough to the bottom, every smooth minimum is a parabola, and a parabola gives simple harmonic motion whose period does not depend '
    +'on how far you pull it. Here the spring constant is V&Prime;(r<sub>min</sub>) = 72&epsilon;/(2<sup>1/3</sup>&sigma;&sup2;) and the frequency is '
    +'&radic;(V&Prime;/&mu;), with &mu; the mass of whatever is actually free to move: the movable atom&rsquo;s own mass while the other one is pinned, '
    +'and the reduced mass m<sub>1</sub>m<sub>2</sub>/(m<sub>1</sub>+m<sub>2</sub>) when both are free &mdash; which for a like pair makes every period '
    +'shorter by &radic;2. The lower panel is the departure from that limit. It is quadratic in the amplitude, and its coefficient is not a fit: Landau '
    +'and Lifshitz&rsquo;s anharmonic formula, fed the Taylor coefficients of this well (72, &minus;1512, 26712 in units of &epsilon;/r<sub>min</sub><sup>n</sup>), '
    +'gives T = T<sub>0</sub>[1 + (91/4) a&sup2;/r<sub>min</sub>&sup2;], and the quadrature follows it to a part in 10<sup>5</sup>.',
  pairs:'Two numbers describe a pair, and where they come from matters. PhET&rsquo;s &sigma; is twice the van der Waals radius &mdash; 308 pm for neon, '
    +'376 for argon. The literature&rsquo;s &sigma; for the same atoms is 278.9 and 341.8 pm, about 10% smaller; but the literature&rsquo;s r<sub>min</sub> is '
    +'313.1 and 383.7 pm, within 2% of PhET&rsquo;s numbers. A van der Waals radius is measured where atoms actually sit in a crystal, which is the bottom of '
    +'the well, and the bottom of an LJ well is 2<sup>1/6</sup> = 1.1225 times &sigma;. So PhET&rsquo;s &sigma; is really an r<sub>min</sub>, and its wells are '
    +'12% too wide. Oxygen is a different matter: 1000 K and 200 pm match neither the literature (113 K, 343 pm) nor PhET&rsquo;s own States-of-Matter '
    +'constants (113 K, 365 pm), and at 200 pm the minimum lies well inside the two drawn spheres. The mixed pairs are usually guessed by the '
    +'Lorentz&ndash;Berthelot rules; PhET&rsquo;s neon&ndash;argon row follows them, and its oxygen rows cannot.',
  steppers:'A molecular-dynamics code lives or dies on its integrator, and the reason is visible here. The left panel measures the ORDER: halve the step '
    +'and velocity Verlet&rsquo;s energy error falls by four, semi-implicit Euler&rsquo;s by two. The right panel measures something else, and it is the more '
    +'important half. Verlet and semi-implicit Euler are symplectic &mdash; each exactly conserves an energy a little different from the true one &mdash; so '
    +'their error oscillates for ever and never grows, at any step size they are stable at. Forward Euler conserves nothing, and its error climbs steadily '
    +'whatever step you give it; a gas integrated that way heats itself up. PhET&rsquo;s own model uses semi-implicit Euler (a = F/m, then v += a&Delta;t, '
    +'then x += v&Delta;t), which is why its atoms stay in the well; this sim uses velocity Verlet for the extra order.',
};

/* ================================================================== *
 *  selfTest kit: the text-box recorder  (projects/simulations/        *
 *  build_buoy/p7_test.js makeShot; unchanged)                        *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  the inline layout sweep (lineage: build_buoy/p7_test.js section I, *
 *  shared by both sims).  Every configuration at every stage size     *
 *  must draw without throwing, draw substance, keep every text op on  *
 *  the canvas and free of entities, tags, NaN and undefined, keep     *
 *  text boxes apart at tools/audit.py's own half-pixel rule, keep     *
 *  data curves out of the legends it placed, and — on a wide stage —  *
 *  keep text out from under the floating readout.                     *
 * ================================================================== */
function layoutSweep(ok,withState,configs,sizes){
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,minFills] of configs) for(const [W,H] of sizes){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; }
        if(W>=900&&t.bb[2]>W-13-280-24&&t.bb[1]<470){ bad='under the readout: "'+t.t.slice(0,30)+'"'; break; }
        /* the HTML #hint's corner (left 14, bottom 11, 11-px text up to ~330 px long) */
        if(t.bb[0]<14+330&&t.bb[3]>H-26){ bad='in the hint\'s corner: "'+t.t.slice(0,30)+'"'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i=0;i<texts.length&&!hit;i++) for(let j=i+1;j<texts.length;j++){
        const a=texts[i].bb, b=texts[j].bb;
        if(Math.min(a[2],b[2])-Math.max(a[0],b[0])>0.5&&Math.min(a[3],b[3])-Math.max(a[1],b[1])>0.5){
          hit='"'+texts[i].t.slice(0,24)+'" vs "'+texts[j].t.slice(0,24)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i=0;i<POLY_SEGS.length;i+=4){
        const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses a legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legends clear');
    });
  }
}

 *  lines of build/atomic-interactions/refvals.txt, the printed output *

  { const stub={beginPath(){},moveTo(){},lineTo(){},stroke(){},save(){},restore(){},setLineDash(){}};
    const bb=box(100,100,200,100); POLY_SEGS=[];

    ok(POLY_SEGS.length===4&&Math.abs(POLY_SEGS[0]-bb.x)<1e-9&&Math.abs(POLY_SEGS[2]-bb.x1)<1e-9,
       'polyline clips a both-ends-outside segment to the frame edges');

  eq(PAIR_BY_KEY.ArAr.sig,376,"PhET's argon-argon sigma");

  /* ---------- C. the potential ---------- */

  rel(rMin(SIG),345.71831087929,1e-13,'r_min = 2^(1/6) sigma (derive)');
  rel(ljV(rMin(SIG),SIG,EPS)/EPS,-1,1e-15,'V(r_min) = -eps exactly');
  /* the pinned values, off the model function, at fixed multiples of sigma */
  const VPINS=[[0.9,1975292.3121214,134003.61453585],[0.95,583699.32656441,57151.790983946],
               [1.0,0,23194.111279238],[1.2,-265202.73300213,-2137.4275622946],
               [1.5,-95350.673552868,-1119.1437321604],[2.0,-18312.928680921,-175.54136954501],
               [3.0,-1630.9983634043,-10.576350526214]];
  VPINS.forEach(([f,v,fF])=>{
    rel(ljV(f*SIG,SIG,EPS),v,1e-12,'V at r/sigma = '+f+' (derive)');
    rel(ljF(f*SIG,SIG,EPS),fF,1e-12,'F at r/sigma = '+f+' (derive)');
  });
  /* argon, so no pin depends on one pair */
  rel(ljV(0.95*376,376,111.84*K_TO_E),1823489.7397476,1e-12,'argon V at 0.95 sigma (derive)');
  rel(ljF(1.5*376,376,111.84*K_TO_E),-2863.9331080979,1e-12,'argon F at 1.5 sigma (derive)');
  rel(ljV(rMin(376),376,111.84*K_TO_E),-929889.49823643,1e-13,'argon V(r_min) = -eps (derive)');
  /* a pure scaling identity: V/eps depends on r/sigma alone */
  rel(ljV(1.37*777,777,5)/5,ljV(1.37*SIG,SIG,EPS)/EPS,1e-13,
      'V/eps is a function of r/sigma only');

  /* ---------- D. the force is exactly minus the derivative ---------- */

  close(ljF(rMin(SIG),SIG,EPS)/(24*EPS/rMin(SIG)),0,1e-15,'F(r_min) = 0 (derive: -1.11e-16 of the scale)');
  [0.85,0.95,1.0,1.12,1.4,2.0,3.5].forEach(f=>{

  });
  /* PhET's own two halves, which must difference to the same thing */
  [0.95,1.122462048309373,1.5].forEach(f=>{

          1e-9*Math.abs(24*EPS/r),"PhET's 48 e sig^12/r^13 minus 24 e sig^6/r^7 IS -dV/dr at r/sigma = "+f);
  });
  rel(ljRepulsive(SIG,SIG,EPS),48*EPS/SIG,1e-14,'the repulsive half at r = sigma is 48 eps/sigma');
  rel(ljAttractive(SIG,SIG,EPS),24*EPS/SIG,1e-14,'the attractive half at r = sigma is 24 eps/sigma');
  /* the sign convention: positive pushes the movable atom out */
  ok(ljF(0.98*SIG,SIG,EPS)>0&&ljF(1.4*SIG,SIG,EPS)<0,
     'F > 0 inside sigma (repulsive), F < 0 outside r_min (attractive)');
  rel(ljF(1.2*SIG,SIG,EPS)*F_TO_PN,-3.5492819741767,1e-12,'F at 1.2 sigma in pN (derive)');
  rel(4*EPS/SIG*F_TO_PN,6.4191213246753,1e-12,'the force scale 4 eps/sigma in pN (derive)');

  /* ---------- E. the curvature and the small-oscillation spring ---------- */
  [0.85,0.95,1.0,1.12,1.4,2.0,3.5].forEach(f=>{

    rel(ljVpp(r,SIG,EPS),numVpp(r,SIG,EPS),2e-7,"V'' by Richardson difference at r/sigma = "+f);
  });
  rel(ljVpp(rMin(SIG),SIG,EPS),179.31017846167,1e-12,"V''(r_min) (derive)");
  rel(ljK(SIG,EPS),179.31017846167,1e-12,"ljK = 72 eps/(2^(1/3) sigma^2) (derive)");
  rel(ljK(SIG,EPS),ljVpp(rMin(SIG),SIG,EPS),1e-14,'the closed form and the general one agree');
  /* the inflection of V: where the pull is strongest */

  rel(RF,383.29215856002,1e-12,'r_F for neon (derive)');
  close(ljVpp(RF,SIG,EPS),0,1e-11,"V''(r_F) = 0 (derive: 5.4e-14)");
  rel(ljF(RF,SIG,EPS),-2315.9602899217,1e-12,'F(r_F), the deepest pull (derive)');
  rel(ljF(RF,SIG,EPS)*F_TO_PN,-3.8457425434822,1e-12,'F(r_F) in pN (derive)');
  { /* and it really is the minimum: no sample beats it */
    let worst=0, rW=0;
    for(let i=0;i<=4000;i++){ const r=SIG*(1.0+2.4*i/4000), f=ljF(r,SIG,EPS);
      if(f<worst){ worst=f; rW=r; } }
    close(rW,RF,0.3,'a 4001-point scan puts the deepest pull at r_F');
  }
  /* omega, and the reduced mass that sets it */
  rel(ljOmega(SIG,EPS,ATOM.Ne.m),2.9808842928973,1e-12,'omega, left atom pinned (derive)');
  rel(ljPeriod(SIG,EPS,ATOM.Ne.m),2.1078259636413,1e-12,'T = 2 pi/omega, pinned (derive)');
  rel(ljOmega(SIG,EPS,ATOM.Ne.m)*1e12,2980884292897.3,1e-12,'omega in rad/s (derive)');
  rel(ljPeriod(SIG,EPS,ATOM.Ne.m/2),1.4904580324518,1e-12,'T with both atoms free (derive)');
  rel(ljPeriod(SIG,EPS,ATOM.Ne.m)/ljPeriod(SIG,EPS,ATOM.Ne.m/2),Math.SQRT2,1e-14,
      'freeing a LIKE partner shortens the period by exactly sqrt(2)');
  eq(effMass(ATOM.Ne.m,ATOM.Ar.m,true),ATOM.Ar.m,'pinned: mu is the movable atom');
  rel(effMass(ATOM.Ne.m,ATOM.Ar.m,false),13.407109462028314,1e-14,'free: mu = m1 m2/(m1+m2) (derive)');
  rel(ljPeriod(376,111.84*K_TO_E,ATOM.Ar.m),2.0483538387693,1e-12,'argon T pinned (derive)');
  rel(ljPeriod(350,100*K_TO_E,25),1.595167315406,1e-12,'the adjustable pair T pinned (derive)');
  rel(ljK(350,100*K_TO_E),387.87095586792,1e-12,'the adjustable pair spring (derive)');

  /* ---------- F. the turning points are exact ---------- */
  [-0.999,-0.99,-0.9,-0.5,-0.2,-0.05,-0.01].forEach(f=>{

    rel(ljV(tp.rIn,SIG,EPS),E,1e-11,'V(r_in) = E at E/eps = '+f);
    rel(ljV(tp.rOut,SIG,EPS),E,1e-11,'V(r_out) = E at E/eps = '+f);
    ok(tp.rIn<rMin(SIG)&&tp.rOut>rMin(SIG),'the minimum lies between them at E/eps = '+f);
  });
  { const tp=turningPoints(-0.5*EPS,SIG,EPS);
    rel(tp.rIn,316.236698879,1e-10,'r_in at E = -eps/2 (derive)');
    rel(tp.rOut,424.232721428,1e-10,'r_out at E = -eps/2 (derive)'); }

  ok(!isFinite(turningPoints(0.3*EPS,SIG,EPS).rOut),'E > 0 is unbound');

  const MU=ATOM.Ne.m;
  /* NOTE: these are the REGULARISED quadrature's values.  The first version of

  const TPINS=[[-0.999,2.10915909198],[-0.99,2.12125708],[-0.9,2.25308369421],
               [-0.5,3.27484251461],[-0.2,5.90660985954],[-0.05,14.5995112689],
               [-0.01,42.2479150864]];

  });
  /* the quadrature has converged at the panel count the sim uses */
  [-0.9,-0.5,-0.05].forEach(f=>{
    rel(periodQuad(f*EPS,SIG,EPS,MU,96),periodQuad(f*EPS,SIG,EPS,MU,400),1e-12,
        'periodQuad has converged by n = 96 at E/eps = '+f);
  });
  /* the regularisation is load-bearing: the naive integrand is WORSE, and by how much */
  { const E=ljV(rMin(SIG)+0.002,SIG,EPS);
    const a=periodQuad(E,SIG,EPS,MU), b=periodQuadNaive(E,SIG,EPS,MU);
    ok(Math.abs(b-a)/a>1e-5,'the naive E - V(r) integrand is visibly wrong at a = 0.002 pm ['

  /* the integrated motion reproduces the quadrature */
  [1,10,40].forEach(A=>{
    const r0=rMin(SIG)+A, E=ljV(r0,SIG,EPS);
    const Tq=periodQuad(E,SIG,EPS,MU);
    rel(periodFromMotion(r0,SIG,EPS,MU,Tq/8000,60000),Tq,5e-7,
        'velocity Verlet reproduces the quadrature period at A = '+A+' pm');
  });
  /* the small-amplitude limit, and Landau's RATE of approach to it */
  eq(ANHARM_C,91/4,"Landau's coefficient for the LJ well is 91/4");
  const TH=ljPeriod(SIG,EPS,MU);

  });
  { /* halving the amplitude quarters the excess: the rate, not the destination */
    const ex=A=>periodQuad(ljV(rMin(SIG)+A,SIG,EPS),SIG,EPS,MU)/TH-1;
    rel(ex(0.25)/ex(0.125),4,3e-3,'halving the amplitude quarters the period excess');
    rel(ex(0.125)/ex(0.0625),4,2e-3,'...and closer in, closer to four');
    ok(ex(0.0625)>0&&ex(2)>ex(0.0625),'the anharmonic shift is positive and grows'); }
  rel(periodQuad(ljV(rMin(SIG)+1,SIG,EPS),SIG,EPS,MU),2.10821924822,1e-11,
      'the period at A = 1 pm (derive)');
  withState({view:'small',amp:1},()=>{
    /* off the BUILT model, which is what the readout and the panel print —
       a test that re-types the formula tests nothing (drum_head Known-bad) */
    const S=buildModel().SM;
    rel(S.aNow,0.9900768681,1e-9,'smallModel amplitude a at A = 1 pm (derive)');
    rel(S.Tnow,2.10821924822,1e-10,'smallModel period at A = 1 pm (derive)');
    rel(S.predNow,ANHARM_C*S.aNow*S.aNow/(rMin(SIG)*rMin(SIG)),1e-14,
        'and the prediction it draws is (91/4) a^2/r_min^2');
    rel(S.Tnow/ljPeriod(SIG,EPS,MU)-1,S.predNow,1e-5,'which the measurement follows');
    ok(S.as.length>20&&S.ex.length===S.as.length&&S.pred.length===S.as.length,
       'and the swept curve has a prediction for every measured point');
    ok(S.as.every(isFinite)&&S.ex.every(isFinite)&&S.pred.every(isFinite),
       'all of them finite');
  });
  rel(periodQuad(ljV(rMin(SIG)+10,SIG,EPS),SIG,EPS,MU),2.1414520080684,2e-10,
      'the period at A = 10 pm (derive)');

  /* ---------- H. the integrators ---------- */
  const R0=rMin(SIG)+10, TP=periodQuad(ljV(R0,SIG,EPS),SIG,EPS,MU);
  const EXPECT={verlet:[8.11049e-7,2.02765e-7,5.06914e-8,1.26728e-8,3.16821e-9],
                symplectic:[1.67796e-4,8.36969e-5,4.17993e-5,2.08872e-5,1.04405e-5],
                forward:[1.92566e-3,9.456e-4,4.68262e-4,2.33081e-4,1.1627e-4]};
  const ORD={verlet:1.99999,symplectic:1.00161,forward:1.01245};
  ['verlet','symplectic','forward'].forEach(k=>{

      const X=G.X(ST.r);
      ok(S.pointer('down',X,G.band.cy),'the movable atom grabs at its centre');
      eq(DRAG.what,'atom','and it is the atom');
      S.pointer('move',X+40,G.band.cy);
      rel(ST.r,G.wx(X+40),1e-9,'and follows the pointer exactly');
      S.pointer('up',0,0); eq(DRAG.what,null,'and lets go');
      ok(!S.pointer('down',G.X(0),G.band.cy)||DRAG.what===null,
         'the PINNED atom does not grab');
      S.pointer('up',0,0);
      ok(!S.pointer('down',G.band.x+4,G.band.y+3),'empty stage grabs nothing');
      S.pointer('up',0,0);
      /* dragging past the ends clamps rather than escaping */
      S.pointer('down',G.X(ST.r),G.band.cy); S.pointer('move',G.b.x1+900,G.band.cy);
      rel(ST.r,985.60000000000002,1e-12,'dragged far right it stops at 985.6 pm (derive)');
      S.pointer('up',0,0);
      /* the drag stops the clock, as PhET's setMotionPaused does */
      ST.running=true; S.pointer('down',G.X(ST.r),G.band.cy);
      ok(!ST.running,'grabbing the atom pauses the motion, as PhET does');
      S.pointer('up',0,0);
    });
    ['well','motion','small','pairs','steppers'].forEach(v=>{
      withState({view:v},()=>{ ok(!S.pointer('down',400,300),'the '+v+' view ignores the pointer');
        S.pointer('up',0,0); });
    });
  }

  { /* a sparse view must SAY why it is sparse, not merely be sparse */
    withState({view:'motion'},()=>{
      const c=makeShot(1100,700); drawView(c,1100,700,buildModel());
      const t=c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' | ');
      ok(t.indexOf('press release')>=0,'a fresh motion view says how to start it');
      ok(t.indexOf('nothing released yet')>=0,'and its ledger says why it is empty');
    });
    withState({view:'motion',r:400,v:400},()=>{
      const c=makeShot(1100,700); drawView(c,1100,700,buildModel());
      const t=c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' | ');
      /* the LEGEND entry, not the word: the caption legitimately explains what
         turning points are even when this orbit has none */
      ok(t.indexOf('turning points (exact)')<0,'an unbound release names no turning points in its legend');
      ok(t.indexOf('this orbit (closed)')<0,'...and no closed orbit in the phase portrait');
      ok(t.indexOf('unbound')>=0,'and says the pair is unbound');
    }); }

  /* ---------- O. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const CONFIGS=[
    ['atoms default',{view:'atoms'},8],
    ['atoms total',{view:'atoms',forces:'total'},8],
    ['atoms components',{view:'atoms',forces:'components'},8],
    ['atoms close',{view:'atoms',forces:'components',r:270},8],
    ['atoms far',{view:'atoms',forces:'total',r:900},8],
    ['atoms argon',{view:'atoms',pair:'ArAr',forces:'total'},8],
    ['atoms oxygen',{view:'atoms',pair:'OO',r:224.5},8],
    ['atoms adjustable',{view:'atoms',pair:'Adj',forces:'components',r:392.9},8],
    ['atoms free',{view:'atoms',pinned:false},8],
    ['atoms literature',{view:'atoms',lit:true,forces:'total'},8],
    ['well default',{view:'well'},5],
    ['well components',{view:'well',forces:'components'},5],
    ['well oxygen',{view:'well',pair:'OO'},5],
    ['well adjustable small',{view:'well',pair:'Adj',adjSig:75,adjEps:20,r:100},5],
    ['well adjustable big',{view:'well',pair:'Adj',adjSig:500,adjEps:450,r:560},5],
    /* an untouched motion view legitimately draws the background, one marker
       and two sentences saying nothing has been released: floor what it emits,
       and assert the sentences separately below (pulsar Known-bad) */
    ['motion fresh',{view:'motion'},2],
    ['motion argon',{view:'motion',pair:'ArAr'},2],
    ['motion unbound',{view:'motion',r:400,v:400},4],
    ['motion free',{view:'motion',pinned:false},2],
    /* the small-oscillation view is nearly all strokes: two curves, a rule and
       four markers, so its fill floor is what it emits, not what a filled view
       emits (pascals_triangle Known-bad) */
    ['small default',{view:'small'},3],
    ['small tiny',{view:'small',amp:0.05},3],
    ['small wide',{view:'small',amp:60},3],
    ['small oxygen',{view:'small',pair:'OO',amp:5},3],
    ['small free lit',{view:'small',pinned:false,lit:true,pair:'ArAr'},3],
    ['pairs default',{view:'pairs'},8],
    ['pairs no overlay',{view:'pairs',showLit:false},8],
    /* on a narrow stage this view drops its dt panel and draws one: the floor
       is the background plus the three curve-end dots */
    ['steppers default',{view:'steppers'},4],
    ['steppers argon',{view:'steppers',pair:'ArAr'},4],
    ['steppers adjustable',{view:'steppers',pair:'Adj',adjSig:200,adjEps:300},4],
  ];
  layoutSweep(ok,withState,CONFIGS,SIZES);

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
