<title>Atomic Interactions &mdash; two atoms in a Lennard-Jones well</title>
<!--
  ===================================================================
  atomic-interactions.html — two atoms, the Lennard-Jones potential
  between them, and the motion that potential produces
  ===================================================================

  Remake of PhET Interactive Simulations' Atomic Interactions (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0).  New code; no PhET
  code or assets.  PhET's build 1.2.21 (docs/phets/atomic-interactions_en
  .html) was read only for its model constants and its labels, each cited
  below and on the canvas as "PhET's value".

  Six views.  THE TWO ATOMS is PhET's single screen: a pinned atom on the
  left, a movable one on the right, the pair chosen from PhET's seven
  (neon-neon, argon-argon, oxygen-oxygen, the three mixed pairs and the
  adjustable one), the potential curve with the current separation
  marked, PhET's force arrows (attractive and repulsive separately,
  or their total, or hidden), drag, release and Return Atom.  THE WELL
  draws V(r) and F(r) = -dV/dr on one r axis with the three exact
  landmarks.  THE MOTION releases the atom and shows r(t), the energy
  ledger and the turning points.  SMALL OSCILLATIONS is the harmonic
  limit: omega = sqrt(V''(r_min)/mu), the parabola through the bottom of
  the well, and how fast the real period leaves it.  THE ATOM PAIRS puts
  PhET's seven wells on one axis beside the literature ones and checks
  the combining rules.  THE INTEGRATOR measures the order and the
  boundedness of the three time-steppers.

  WHAT IS EXACT
  -------------
  Everything about the potential is closed form and is asserted to
  machine precision against build/atomic-interactions/derive.py:
    V(r) = 4 eps [ (sigma/r)^12 - (sigma/r)^6 ], zero at r = sigma,
    minimum -eps at r_min = 2^(1/6) sigma;
    F(r) = -dV/dr = (24 eps/r)[ 2(sigma/r)^12 - (sigma/r)^6 ], checked
    against a 60-digit Decimal central difference AND against
    scipy.differentiate.derivative (worst 4.3e-15 of the force scale);
    V''(r) likewise, and V''(r_min) = 72 eps / (2^(1/3) sigma^2) exactly;
    omega = sqrt(V''(r_min)/mu) with mu the reduced mass (the movable
    atom's mass while the other is pinned, m1 m2/(m1+m2) when both move);
    the turning points of a bound orbit in closed form from
    u = (sigma/r)^6, u_in + u_out = 1;
    the period by a regularised Gauss-Legendre quadrature (the sin(th)
    of the substitution cancels exactly against the one inside v), which
    agrees with the integrated motion to 5e-9 and with 2 pi/omega in the
    small-amplitude limit at the rate Landau's anharmonic formula
    predicts, T = T0 (1 + (91/4) a^2/r_min^2).
  Motion is velocity Verlet; its measured order is 2.00 and its energy
  error is bounded (100 periods cost no more than one).  PhET's own
  stepper, semi-implicit Euler, is order 1.00 and also bounded; forward
  Euler is shown beside them and is not.

  WHAT IS MODELLED (PhET's choices, reproduced)
  ---------------------------------------------
  PhET's epsilon/sigma tables, read out of the minified original:
    eps/k_B (K):  Ne-Ne 35.8, Ar-Ar 111.84, O-O 1000, Ne-Ar 59.5,
                  Ne-O 51, Ar-O 85, adjustable 100 (slider 20..450);
    sigma (pm):   308, 376, 200, 343, 306, 340, 350 (slider 75..500);
    van der Waals radii 154 (Ne), 188 (Ar), 152 (O) pm and masses
    20.1797, 39.948, 15.9994 u, from PhET's nitroglycerin element table.
  The atoms are drawn at those radii, as PhET draws them.  PhET's own
  force expressions (48 e' sigma^12/r^13 and 24 e' sigma^6/r^7) are
  reproduced and asserted to be exactly -dV/dr.
  The literature values beside them, and their sources:
    Ne  sigma 278.9 pm, r_min 313.1 pm, eps/k_B 35.7 K
    Ar  sigma 341.8 pm, r_min 383.7 pm, eps/k_B 124.0 K
      — Attard, arXiv:1702.00096 Table I, after van Sciver, Helium
        Cryogenics 2nd ed. (Springer 2012).
    Ar  sigma 343.2 pm, eps/k_B 122.4 K;  O2 sigma 343.3 pm, 113 K
      — Bird, Stewart & Lightfoot, Transport Phenomena 2nd ed. (2007)
        pp. 864-865.
  Argon therefore has two retrieved sets 1.3% apart in eps; that spread
  is the honest uncertainty on an LJ fit, and it is printed.  THE SIM
  USES PhET'S VALUES BY DEFAULT, so that it reproduces PhET; the
  "literature eps, sigma" checkbox swaps in the sourced ones and the
  difference is drawn.  Which set is live is printed on every canvas.
  Finding, stated on the canvas: PhET's sigma is the literature r_min,
  not the literature sigma — 308 against 313.1 for neon and 376 against
  383.7 for argon (2% and 2%), where the literature sigma is 10% away,
  because PhET sets sigma = twice the van der Waals radius and that is a
  radius at the bottom of the well, a factor 2^(1/6) = 1.1225 out.  The
  oxygen pair matches nothing: PhET's own States-of-Matter constants
  carry EPSILON_FOR_DIATOMIC_OXYGEN 113 K (the literature value) and
  SIGMA_FOR_DIATOMIC_OXYGEN 365 pm, while Atomic Interactions uses
  1000 K and 200 pm, which puts r_min inside both drawn atoms.

  NOT MODELLED
  ------------
  Quantum mechanics.  Neon at 25 K has a de Broglie wavelength comparable
  with the well width, so the real dimer's levels are discrete and its
  zero-point energy is a large fraction of eps; nothing here is a bound
  state.  Real pair potentials are not 12-6 (the repulsion is closer to
  exponential and the dispersion series continues past r^-6).  The atoms
  move on a line only, there is no third body, no rotation and no
  temperature.  Oxygen is a diatomic molecule, drawn here as PhET draws
  it, as one sphere.  PhET's sounds, its screen-reader descriptions and
  its zoom buttons on the potential graph are not reproduced.
-->

<script>
/* ================================================================== *
 *  small utilities, colour helpers and h()  (projects/simulations/   *
 *  diffraction.html, the PLAYBOOK scaffold cut; camera dropped)      *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  the 2-D plotting layer  (projects/simulations/build_buoy/          *
 *  p1_utils.js: the copy carrying every Known-bad fix)               *
 * ================================================================== */
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));

   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.

   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));

/* ================================================================== *
 *  the Lennard-Jones pair: potential, force, well geometry, exact     *
 *  turning points, the regularised period quadrature and the three    *
 *  time-steppers.  No DOM, no view state — the Python twin is         *
 *  build/atomic-interactions/derive.py and refvals.txt is the pin.    *
 *                                                                     *
 *  UNITS  lengths pm, times ps, masses u.  Then pm/ps is m/s exactly  *
 *  and the energy unit is u (pm/ps)^2 = u m^2 s^-2.  An epsilon        *

/* CODATA 2022 via scipy.constants 1.18 (derive.py prints them). */
const KBOLTZ = 1.380649e-23;            /* J/K, exact since the 2019 SI       */

const SIXRT2 = Math.pow(2, 1 / 6);      /* 1.12246204830937                    */

/* PhET's tables, read out of docs/phets/atomic-interactions_en.html (1.2.21).

   InteractionStrengthTable.getInteractionPotential gives eps/k_B in K and
   SigmaTable.getSigma gives sigma in pm.  Each is PhET's value. */
const ATOM = {

  Ar: {sym: 'Ar', name: 'argon', r: 188, m: 39.948, col: '#cd35c4'},
  O: {sym: 'O', name: 'oxygen', r: 152, m: 15.9994, col: '#e8843a'},

  {key: 'ArAr', label: 'argon-argon', a: 'Ar', b: 'Ar', sig: 376, eps: 111.84},
  {key: 'OO', label: 'oxygen-oxygen', a: 'O', b: 'O', sig: 200, eps: 1000},

  {key: 'NeO', label: 'neon-oxygen', a: 'Ne', b: 'O', sig: 154 + 152, eps: 51},

  Ne: {sig: 278.9, eps: 35.7, rmin: 313.1, src: 'van Sciver 2012'},
  Ar: {sig: 341.8, eps: 124.0, rmin: 383.7, src: 'van Sciver 2012'},
  O: {sig: 343.3, eps: 113.0, rmin: null, src: 'Bird Stewart Lightfoot 2007'}

/* ------------------------------------------------------------ the potential */
/* V(r) = 4 eps [ (sigma/r)^12 - (sigma/r)^6 ].  eps here is an ENERGY in

function ljV(r, sig, eps){
  const x6 = Math.pow(sig / r, 6);

/* F(r) = -dV/dr = (24 eps/r)[ 2(sigma/r)^12 - (sigma/r)^6 ].  Positive is

   central difference inside selfTest, so the closed form is never the only

function ljF(r, sig, eps){
  const x6 = Math.pow(sig / r, 6);

/* V''(r) = (24 eps/r^2)[ 26 (sigma/r)^12 - 7 (sigma/r)^6 ]. */
function ljVpp(r, sig, eps){

}

function ljRepulsive(r, sig, eps){
  const x6 = Math.pow(sig / r, 6);
  return 48 * eps / r * x6 * x6;
}
function ljAttractive(r, sig, eps){
  const x6 = Math.pow(sig / r, 6);
  return 24 * eps / r * x6;

/* V''(r_min) = 72 eps / (2^(1/3) sigma^2), the small-oscillation spring. */
function ljK(sig, eps){ return 72 * eps / (CBRT2 * sig * sig); }

function ljOmega(sig, eps, mu){ return Math.sqrt(ljK(sig, eps) / mu); }
function ljPeriod(sig, eps, mu){ return 2 * Math.PI / ljOmega(sig, eps, mu); }

/* The effective mass of the separation coordinate.  With the left atom pinned

   separation obeys mu r-double-dot = F with mu = m1 m2/(m1+m2), and the centre
   of mass stays put.  This is the only place the reduced mass enters, and it
   is why "Moving" shortens every period by sqrt(2) for a like pair. */
function effMass(ma, mb, pinned){
  return pinned ? mb : ma * mb / (ma + mb);

/* ----------------------------------------------------- exact turning points */
/* With u = (sigma/r)^6 the potential is 4 eps (u^2 - u), so V(r) = E is the
   quadratic u^2 - u - E/(4 eps) = 0 and the two roots satisfy u_in + u_out = 1.
   E >= 0 is unbound (no outer turning point); E < -eps is impossible. */
function turningPoints(E, sig, eps){
  const d = 1 + E / eps;
  if(d < 0) return null;
  const s = Math.sqrt(d);
  const uIn = 0.5 * (1 + s), uOut = 0.5 * (1 - s);
  return {rIn: sig * Math.pow(uIn, -1 / 6),

/* sum_{k=0..5} x^k y^(5-k) = (x^6 - y^6)/(x - y), formed without the division
   so the factorisation below never divides by a vanishing difference. */
function powSum6(x, y){
  const x2 = x * x, y2 = y * y;
  return y2 * y2 * y + x * y2 * y2 + x2 * y2 * y + x2 * x * y2 + x2 * x2 * y
       + x2 * x2 * x;

/* The period of a bound orbit, by quadrature, with BOTH singularities removed
   in closed form rather than merely softened.
     E - V(r) = 4 eps (u_in - u)(u - u_out)          [u_in + u_out = 1]
   and with r = a - b cos(th) that becomes
     E - V = 4 eps sigma^12 b^2 sin^2(th) S_in S_out / (r^12 r_in^6 r_out^6),
   so v carries an exact sin(th) which cancels the dr = b sin(th) dth of the
   numerator.  The integrand is then analytic AND free of the catastrophic
   cancellation that ruins `E - V(r)` at small amplitude, where E and V agree
   to fifteen digits over most of the orbit (derive.py measures the naive form
   failing: 1.6e-4 relative at a = 0.002 pm).  Gauss-Legendre, n panels. */
const GL_CACHE = {};
function gaussLegendre(n){
  if(GL_CACHE[n]) return GL_CACHE[n];
  const x = new Float64Array(n), w = new Float64Array(n);
  for(let i = 0; i < n; i++){
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), pp = 0;
    for(let it = 0; it < 100; it++){
      let p0 = 1, p1 = 0;
      for(let j = 0; j < n; j++){
        const p2 = p1; p1 = p0;
        p0 = ((2 * j + 1) * z * p1 - j * p2) / (j + 1);
      }
      pp = n * (z * p0 - p1) / (z * z - 1);
      const dz = p0 / pp; z -= dz;
      if(Math.abs(dz) < 1e-15) break;
    }
    x[i] = z; w[i] = 2 / ((1 - z * z) * pp * pp);
  }
  GL_CACHE[n] = {x, w};
  return GL_CACHE[n];

  const a = 0.5 * (r1 + r2), b = 0.5 * (r2 - r1);
  const gl = gaussLegendre(n);
  const sig6 = Math.pow(sig, 6);
  const pre = Math.pow(r1, 3) * Math.pow(r2, 3) / sig6;
  let s = 0;
  for(let i = 0; i < n; i++){
    const th = 0.5 * Math.PI * (gl.x[i] + 1), ww = 0.5 * Math.PI * gl.w[i];
    const r = a - b * Math.cos(th);
    const Sin = powSum6(r, r1), Sout = powSum6(r2, r);
    const r6 = Math.pow(r, 6);
    s += ww * pre * r6 * Math.sqrt(mu / (8 * eps * Sin * Sout));
  }
  return 2 * s;
}

/* The same integral with E - V(r) formed as a difference.  Kept ONLY so the
   suite can assert that it is worse, and where, so the regular form above
   cannot be quietly replaced by the obvious one. */
function periodQuadNaive(E, sig, eps, mu, n){
  n = n || 96;
  const tp = turningPoints(E, sig, eps);
  if(!tp || !isFinite(tp.rOut)) return Infinity;
  const a = 0.5 * (tp.rIn + tp.rOut), b = 0.5 * (tp.rOut - tp.rIn);
  const gl = gaussLegendre(n);
  let s = 0;
  for(let i = 0; i < n; i++){
    const th = 0.5 * Math.PI * (gl.x[i] + 1), ww = 0.5 * Math.PI * gl.w[i];
    const r = a - b * Math.cos(th);
    const ke = Math.max(E - ljV(r, sig, eps), 0);
    const v = Math.sqrt(2 * ke / mu);
    if(v > 0) s += ww * b * Math.sin(th) / v;
  }
  return 2 * s;
}

/* ------------------------------------------------------- the time-steppers */
/* Velocity Verlet: the sim's integrator.  Symplectic, time-reversible,
   globally second order, and its energy error is BOUNDED rather than
   secular — derive.py measures order 2.00 and no growth from 1 to 100
   periods.  The state is {r, v, a, t}; `a` is carried so each step costs
   one force evaluation. */
function ljState(r, v, sig, eps, mu){
  return {r: r, v: v, a: ljF(r, sig, eps) / mu, t: 0};
}
function stepVerlet(s, sig, eps, mu, dt){
  s.v += 0.5 * s.a * dt;
  s.r += s.v * dt;
  s.a = ljF(s.r, sig, eps) / mu;
  s.v += 0.5 * s.a * dt;
  s.t += dt;
  return s;
}
/* PhET's own stepper (DualAtomModel.updateAtomMotion): a = F/m, then v += a dt,
   then x += v dt.  That is semi-implicit (symplectic) Euler — first order, but
   still bounded, which is why PhET's atoms do not spiral away. */
function stepSymplecticEuler(s, sig, eps, mu, dt){
  s.a = ljF(s.r, sig, eps) / mu;
  s.v += s.a * dt;
  s.r += s.v * dt;
  s.t += dt;
  return s;
}
/* Forward Euler: both updates from the OLD state.  Not symplectic; its energy
   grows without bound.  Drawn only in the integrator view, as the control. */
function stepForwardEuler(s, sig, eps, mu, dt){
  s.a = ljF(s.r, sig, eps) / mu;
  const r0 = s.r;
  s.r = r0 + s.v * dt;
  s.v = s.v + s.a * dt;
  s.t += dt;
  return s;
}
const STEPPERS = {verlet: stepVerlet, symplectic: stepSymplecticEuler,
                  forward: stepForwardEuler};

function ljEnergy(s, sig, eps, mu){
  return 0.5 * mu * s.v * s.v + ljV(s.r, sig, eps);
}

/* Run `n` steps and report the worst excursion of the energy, as a fraction of
   the well depth.  This is what the integrator view plots and what selfTest
   pins the measured order against. */
const MAX_STEPS=6e5;      /* the integrator's own ceiling, enforced below.
   Six times the longest run any view asks for: 20 periods at 1 fs of the
   slowest pair the sliders reach (sigma 500 pm, eps 20 K) is 102,000 steps.
   Keep it small — the mutant that DELETES the clamp has to stay fast enough
   for a sweep, or it is the hang BRIEF.md warns about. */
function energyExcursion(r0, v0, sig, eps, mu, dt, n, kind){
  const step = STEPPERS[kind || 'verlet'];
  /* A step count derived from a period is only as finite as that period.  A
     bound that is computed and then not applied is not a bound (wind_tunnel
     Known-bad), and here an unbounded one is a hang rather than a bad plot. */
  n = isFinite(n) && n > 0 ? Math.min(n, MAX_STEPS) : 0;
  const s = ljState(r0, v0, sig, eps, mu);
  const E0 = ljEnergy(s, sig, eps, mu);
  let lo = E0, hi = E0;
  for(let i = 0; i < n; i++){
    step(s, sig, eps, mu, dt);
    const e = ljEnergy(s, sig, eps, mu);
    if(e < lo) lo = e;
    if(e > hi) hi = e;
  }
  return {E0: E0, lo: lo, hi: hi, s: s,
          worst: Math.max(Math.abs(hi - E0), Math.abs(lo - E0)) / eps};
}

/* The period measured from the motion itself: the time between two successive
   maxima of r(t), each refined by the parabola through its three samples.  A
   grid argmax staircases at first order in dt, so the refinement is not an
   optimisation — without it this tracks the quadrature only to O(dt). */
function periodFromMotion(r0, sig, eps, mu, dt, nmax){
  const s = ljState(r0, 0, sig, eps, mu);
  let p2 = null, p1 = null;
  const hits = [];
  const lim = nmax || 400000;
  for(let i = 0; i < lim; i++){
    stepVerlet(s, sig, eps, mu, dt);
    if(p2 !== null && p1 > p2 && p1 >= s.r){
      const den = p2 - 2 * p1 + s.r;
      const d = den !== 0 ? 0.5 * (p2 - s.r) / den : 0;
      hits.push((i - 1 + d) * dt);
      if(hits.length >= 2) return hits[1] - hits[0];
    }
    p2 = p1; p1 = s.r;
  }
  return NaN;
}

/* The speed the movable atom needs at r to escape: E = 0. */
function escapeSpeed(r, sig, eps, mu){
  const v = ljV(r, sig, eps);
  return v >= 0 ? 0 : Math.sqrt(-2 * v / mu);
}

/* ================================================================== *
 *  state, actions, the per-view models, readout / eqbar / tag         *
 * ================================================================== */
const TABS=[['atoms','the two atoms'],['well','the well'],['motion','the motion'],
            ['small','small oscillations'],['pairs','the atom pairs'],['steppers','the integrator']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', text:'#cfd4de', bg:'#070b18', rep:'#e8705f', att:'#5f8fe8',
           kin:'#b8ec4c', pot:'#5ac8e0', tot:'#e8e8f0'};
const RO_W=300;                     /* the floating readout's footprint */
/* the drawn r window, in units of sigma.  0.72 sigma is V = 227 eps, steep
   enough to look like a wall and finite enough to plot. */
const R_LO_FAC=0.72, R_HI_FAC=3.2;
/* PhET's ForceDisplayMode: HIDDEN (its default), TOTAL, COMPONENTS */
const FORCE_MODES=[['hidden','hidden'],['total','total force'],['components','components']];
/* the frame clock: 2 ps of model time per second of wall clock, so a neon
   pair oscillates about once a second.  PhET's own Slow is half speed. */
const PS_PER_SEC=2.0, SLOW_FACTOR=0.35, DT_INT=1.5e-3;   /* ps */
const TRAIL_MAX=900;

const DEFAULTS={view:'atoms', pair:'NeNe', lit:false, pinned:true, forces:'hidden',
  adjSig:PHET_ADJ_SIGMA, adjEps:PHET_ADJ_EPSILON,
  r:345.71831087929,                       /* r_min of PhET's neon pair (derive) */
  v:0, running:false, slow:false, t:0,
  rel:10, v0f:0,                           /* release offset (pm) and speed (fraction of escape) */
  dtIdx:2, stepper:'verlet', showLit:true, showHarm:true, amp:10};
const ST=Object.assign({},DEFAULTS);
let TRAIL=[];                              /* [t, r, K, V] of the live motion */
function simReset(){ TRAIL=[]; }

/* ---- actions ------------------------------------------------------------- */
function pairOf(st){ return pairParams(st.pair, st.lit, {sig:st.adjSig, eps:st.adjEps}); }
function rBounds(st){ const p=pairOf(st); return [R_LO_FAC*p.sig, R_HI_FAC*p.sig]; }
function setSep(st,r){ const b=rBounds(st); st.r=clamp(r,b[0],b[1]); st.v=0; TRAIL=[]; }
/* PhET's Return Atom button and its resetMovableAtomPos: back to the minimum,
   at rest. */
function returnAtom(st){ st.r=rMin(pairOf(st).sig); st.v=0; st.t=0; st.running=false; TRAIL=[]; }
function setPair(st,key){ st.pair=key; returnAtom(st); }
function setLit(st,on){ st.lit=!!on; returnAtom(st); }
function setPinned(st,on){ st.pinned=!!on; st.v=0; st.t=0; TRAIL=[]; }
/* PhET snaps both adjustable sliders to multiples of 5 and clamps to its own
   MIN/MAX; and it moves the atom back to the new minimum when sigma changes. */
function setAdjSig(st,s){
  st.adjSig=clamp(Math.round(s/5)*5,PHET_MIN_SIGMA,PHET_MAX_SIGMA);
  if(st.pair==='Adj') returnAtom(st);
}
function setAdjEps(st,e){
  st.adjEps=clamp(Math.round(e/5)*5,PHET_MIN_EPSILON,PHET_MAX_EPSILON);
  if(st.pair==='Adj'){ const b=rBounds(st); st.r=clamp(st.r,b[0],b[1]); }
}
/* the motion view's release: r_min + rel, with v0f of the escape speed */
function releaseAtom(st){
  const P=pairInfo(st);
  st.r=clamp(rMin(P.sig)+st.rel,P.rLo,P.rHi);
  st.v=st.v0f*escapeSpeed(st.r,P.sig,P.eps,P.mu);
  st.t=0; TRAIL=[]; st.running=true;
}

/* ---- the pair, fully resolved ------------------------------------------- */
function pairInfo(st){
  const spec=PAIR_BY_KEY[st.pair], pp=pairOf(st);
  const A=ATOM[spec.a], B=ATOM[spec.b];
  const epsE=pp.eps*K_TO_E;
  const mu=effMass(A.m,B.m,st.pinned);
  const sig=pp.sig;
  /* PhET draws each atom at its van der Waals radius; the adjustable pair is
     drawn at sigma/2, which is what PhET does when its diameter slider moves. */
  const rA=spec.key==='Adj'?sig/2:A.r, rB=spec.key==='Adj'?sig/2:B.r;
  return {key:spec.key, label:spec.label, A, B, rA, rB, sig, epsK:pp.eps, eps:epsE,
          lit:pp.lit, src:pp.src, mu, muPin:B.m, muMov:A.m*B.m/(A.m+B.m),
          pinned:st.pinned, rmin:rMin(sig), k:ljK(sig,epsE),
          omega:ljOmega(sig,epsE,mu), period:ljPeriod(sig,epsE,mu),
          rLo:R_LO_FAC*sig, rHi:R_HI_FAC*sig,
          /* the separation at which the attraction is strongest: V''(r) = 0,
             i.e. (sigma/r)^6 = 7/26, r = (26/7)^(1/6) sigma */
          rF:sig*Math.pow(26/7,1/6)};
}

/* ---- the live state of the pair ----------------------------------------- */
function liveModel(st){
  const P=pairInfo(st), r=st.r;
  const V=ljV(r,P.sig,P.eps), F=ljF(r,P.sig,P.eps);
  const K=0.5*P.mu*st.v*st.v, E=K+V;
  const tp=turningPoints(E,P.sig,P.eps);
  return {P, r, V, F, K, E,
          Frep:ljRepulsive(r,P.sig,P.eps), Fatt:ljAttractive(r,P.sig,P.eps),
          bound:E<0, tp, vEsc:escapeSpeed(r,P.sig,P.eps,P.mu),
          period:(E<0&&tp&&isFinite(tp.rOut))?periodQuad(E,P.sig,P.eps,P.mu):Infinity,
          /* PhET draws the atoms at their van der Waals radii; when sigma is
             far below the sum of those radii the spheres overlap at the bottom
             of the well, which the oxygen pair does badly. */
          overlap:(P.rA+P.rB)-P.rmin};
}

/* ---- the curves each view needs ----------------------------------------- */
function wellCurve(P,n,lo,hi){
  const xs=[],ys=[],fs=[],reps=[],atts=[];
  const a=lo===undefined?P.rLo:lo, b=hi===undefined?P.rHi:hi;
  for(let i=0;i<=n;i++){
    const r=a+(b-a)*i/n;
    xs.push(r); ys.push(ljV(r,P.sig,P.eps)/P.eps);
    fs.push(ljF(r,P.sig,P.eps)); reps.push(ljRepulsive(r,P.sig,P.eps));
    atts.push(-ljAttractive(r,P.sig,P.eps));
  }
  return {xs,ys,fs,reps,atts};
}

/* the motion view: the trace so far, the turning points, the phase curve */
function motionModel(st){
  const L=liveModel(st), P=L.P;
  const ph={rs:[],vs:[]};
  if(L.bound&&L.tp&&isFinite(L.tp.rOut)){
    const n=120;
    for(let i=0;i<=n;i++){
      const r=L.tp.rIn+(L.tp.rOut-L.tp.rIn)*i/n;
      const ke=Math.max(L.E-ljV(r,P.sig,P.eps),0);
      ph.rs.push(r); ph.vs.push(Math.sqrt(2*ke/P.mu));
    }
  }
  /* the separatrix E = 0: the orbit that just escapes */
  const sep={rs:[],vs:[]};
  for(let i=0;i<=120;i++){
    const r=P.sig+(P.rHi-P.sig)*i/120;
    const ke=Math.max(-ljV(r,P.sig,P.eps),0);
    sep.rs.push(r); sep.vs.push(Math.sqrt(2*ke/P.mu));
  }
  return {L,ph,sep,trail:TRAIL};
}

/* small oscillations: the harmonic fit, and how fast the true period leaves it.
   Landau's coefficient for the LJ well is exactly 91/4 (derive.py derives V2,
   V3, V4 and checks them by 90-digit finite differences). */
const ANHARM_C=91/4;
function smallModel(st){
  const P=pairInfo(st);
  const A=clamp(st.amp,0.05,60);
  const half=Math.max(A*1.6,P.rmin*0.03);
  const lo=P.rmin-half, hi=P.rmin+half;
  const xs=[],ys=[],hs=[];
  for(let i=0;i<=160;i++){
    const r=lo+(hi-lo)*i/160, x=r-P.rmin;
    xs.push(r); ys.push(ljV(r,P.sig,P.eps)/P.eps);
    hs.push((-P.eps+0.5*P.k*x*x)/P.eps);
  }
  /* the sweep: amplitude a = (r_out - r_in)/2 against the fractional period
     excess, measured by the regularised quadrature */
  const as=[],ex=[],pred=[];
  for(let i=0;i<=26;i++){
    const Ai=0.02*Math.pow(60/0.02,i/26);
    const E=ljV(P.rmin+Ai,P.sig,P.eps);
    const tp=turningPoints(E,P.sig,P.eps);
    if(!tp||!isFinite(tp.rOut)) continue;
    const a=0.5*(tp.rOut-tp.rIn);
    const T=periodQuad(E,P.sig,P.eps,P.mu);
    if(!isFinite(T)) continue;
    as.push(a); ex.push(T/P.period-1); pred.push(ANHARM_C*a*a/(P.rmin*P.rmin));
  }
  const E=ljV(P.rmin+A,P.sig,P.eps), tp=turningPoints(E,P.sig,P.eps);
  const aNow=tp?0.5*(tp.rOut-tp.rIn):0;
  const Tnow=tp&&isFinite(tp.rOut)?periodQuad(E,P.sig,P.eps,P.mu):Infinity;
  return {P,A,lo,hi,xs,ys,hs,as,ex,pred,aNow,Tnow,tp,E,
          predNow:ANHARM_C*aNow*aNow/(P.rmin*P.rmin)};
}

/* the pairs view: every PhET pair's well, and the literature beside it */
function pairsModel(st){
  const rows=PAIRS.map(p=>{
    const phet=pairParams(p.key,false,{sig:st.adjSig,eps:st.adjEps});
    const row={key:p.key,label:p.label,a:p.a,b:p.b,
               sig:phet.sig,eps:phet.eps,rmin:rMin(phet.sig)};
    if(p.key!=='Adj'){
      const l=pairParams(p.key,true,{sig:st.adjSig,eps:st.adjEps});
      row.lsig=l.sig; row.leps=l.eps; row.lrmin=rMin(l.sig); row.lsrc=l.src;
      /* the literature TABLE's own r_min where it prints one */
      row.lrminTab=(p.a===p.b&&LIT[p.a].rmin)?LIT[p.a].rmin:null;
    }
    return row;
  });
  /* Lorentz-Berthelot applied to PhET's OWN like-pair values, against PhET's
     own mixed-pair rows */
  const lb=[['NeAr','Ne','Ar'],['NeO','Ne','O'],['ArO','Ar','O']].map(([k,a,b])=>{
    const pa=PAIR_BY_KEY[a+a], pb=PAIR_BY_KEY[b+b], p=PAIR_BY_KEY[k];
    return {key:k,sig:p.sig,eps:p.eps,lbSig:0.5*(pa.sig+pb.sig),
            lbEps:Math.sqrt(pa.eps*pb.eps),radSum:ATOM[a].r+ATOM[b].r};
  });
  /* the source table's own consistency: r_min/sigma must be 2^(1/6) */
  const tab=LIT_RMIN_TABLE.map(([nm,s,rm])=>({nm,s,rm,ratio:rm/s,err:Math.abs(rm/s-SIXRT2)}));
  /* corresponding states, from PhET's own critical points and the literature
     eps — both retrieved, neither remembered */
  const cs=['Ne','Ar','O'].map(a=>({a,Tc:PHET_CRIT[a],eps:LIT[a].eps,
                                    ratio:PHET_CRIT[a]/LIT[a].eps}));
  const csMean=cs.reduce((s,c)=>s+c.ratio,0)/cs.length;
  return {rows,lb,tab,cs,csMean,
          csSpread:(Math.max.apply(null,cs.map(c=>c.ratio))-
                    Math.min.apply(null,cs.map(c=>c.ratio)))/csMean};
}

/* the integrator view: order and boundedness.  Cached on the pair, because the
   long runs are the only expensive thing in the file. */
const DT_LIST=[4e-3,2e-3,1e-3,5e-4,2.5e-4];
let STEP_CACHE={key:null,val:null};
function stepperModel(st){
  const P=pairInfo(st);
  const key=[P.sig,P.eps,P.mu].join('|');
  if(STEP_CACHE.key===key) return Object.assign({P},STEP_CACHE.val);
  const r0=P.rmin+10, E0=ljV(r0,P.sig,P.eps);
  /* the quadrature period, or the harmonic one if that orbit is not bound:
     every step count below is derived from it, so it has to be finite */
  let T=periodQuad(E0,P.sig,P.eps,P.mu);
  if(!(T>0)||!isFinite(T)) T=P.period;
  const kinds=['verlet','symplectic','forward'];
  const curves={};
  kinds.forEach(k=>{
    const es=DT_LIST.map(dt=>energyExcursion(r0,0,P.sig,P.eps,P.mu,dt,
                                             Math.round(T/dt),k).worst);
    const lo=Math.log(es[0]/es[es.length-1])/Math.log(DT_LIST[0]/DT_LIST[DT_LIST.length-1]);
    curves[k]={es,order:lo};
  });
  /* the drift trace: |E(t)-E(0)|/eps sampled through 20 periods at 1e-3 ps */
  const dtD=1e-3, nPer=20;
  const nStep=Math.min(MAX_STEPS,Math.max(0,Math.round(nPer*T/dtD)||0));
  const every=Math.max(1,Math.round(nStep/240));
  const drift={};
  kinds.forEach(k=>{
    const step=STEPPERS[k], s=ljState(r0,0,P.sig,P.eps,P.mu);
    const e0=ljEnergy(s,P.sig,P.eps,P.mu), ts=[],ds=[];
    for(let i=0;i<nStep;i++){
      step(s,P.sig,P.eps,P.mu,dtD);
      if(i%every===0){ ts.push(s.t/T); ds.push(Math.abs(ljEnergy(s,P.sig,P.eps,P.mu)-e0)/P.eps); }
    }
    drift[k]={ts,ds,last:ds.length?ds[ds.length-1]:0};
  });
  const val={T,r0,E0,curves,drift,dts:DT_LIST,dtD,nPer};
  STEP_CACHE={key,val};
  return Object.assign({P},val);
}

function buildModel(){
  const st=ST, view=st.view, M={view,st};
  M.L=liveModel(st);
  M.P=M.L.P;
  if(view==='atoms'||view==='well') M.C=wellCurve(M.P,260);
  else if(view==='motion') M.MO=motionModel(st);
  else if(view==='small') M.SM=smallModel(st);
  else if(view==='pairs') M.PR=pairsModel(st);
  else if(view==='steppers') M.IT=stepperModel(st);
  return M;
}

/* ================================================================== *
 *  formatting                                                         *
 * ================================================================== */
function meV(e){ return e*E_TO_MEV; }
function pN(f){ return f*F_TO_PN; }
function eK(e){ return e/K_TO_E; }                 /* energy -> eps/k_B in K   */
function sciPlain(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
  return fmt(m,n===undefined?2:n)+'×10'+supDigits(e);
}
const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function supDigits(e){ return String(e).split('').map(c=>SUPS[c]||c).join(''); }
function sciHTML(x,n){
  if(!isFinite(x)) return '&mdash;';
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
  return fmt(m,n===undefined?3:n)+' &times; 10<sup>'+String(e).replace('-','&minus;')+'</sup>';
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function pairRows(M){
  const P=M.P, L=M.L;
  let s=hd('the pair &mdash; '+(P.lit?'literature':'PhET&rsquo;s')+' parameters')
    +rrow('&epsilon;/k<sub>B</sub>',sigf(P.epsK,5)+' K')
    +rrow('&epsilon;',sigf(meV(P.eps),4)+' meV')
    +rrow('&sigma;',sigf(P.sig,5)+' pm')
    +rrow('r<sub>min</sub> = 2<sup>1/6</sup>&sigma;',sigf(P.rmin,6)+' pm','good')
    +rrow('reduced mass &mu;',sigf(P.mu,5)+' u');
  s+=hd('where the atom is')
    +rrow('separation r',sigf(L.r,5)+' pm','good')
    +rrow('r / &sigma;',fmt(L.r/P.sig,4))
    +rrow('V(r)',sigf(meV(L.V),4)+' meV')
    +rrow('V(r) / &epsilon;',fmt(L.V/P.eps,4))
    +rrow('F(r) = &minus;dV/dr',sigf(pN(L.F),4)+' pN',L.F>0?'bad':'good')
    +rrow('',L.F>0?'repulsive':(L.F<0?'attractive':'zero &mdash; at the minimum'));
  return s;
}
function readoutHTML(M){
  const P=M.P, L=M.L, st=M.st;
  let s='<div class="rname">atomic interactions<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  if(M.view==='atoms'){
    s+=pairRows(M);
    s+=hd('PhET&rsquo;s two halves')
      +rrow('repulsive, 48&epsilon;&sigma;<sup>12</sup>/r<sup>13</sup>',sigf(pN(L.Frep),4)+' pN')
      +rrow('attractive, 24&epsilon;&sigma;<sup>6</sup>/r<sup>7</sup>','&minus;'+sigf(pN(L.Fatt),4)+' pN')
      +rrow('their difference',sigf(pN(L.Frep-L.Fatt),4)+' pN','good');
    s+=hd('the drawn atoms')
      +rrow('radii (van der Waals)',fmt(P.rA,0)+', '+fmt(P.rB,0)+' pm')
      +rrow('they touch at',fmt(P.rA+P.rB,0)+' pm')
      +rrow('overlap at r<sub>min</sub>',L.overlap>0?fmt(L.overlap,0)+' pm':'none',L.overlap>0?'bad':'good');
  }
  else if(M.view==='well'){
    s+=pairRows(M);
    s+=hd('the three landmarks')
      +rrow('V(&sigma;)','0 exactly','good')
      +rrow('V(r<sub>min</sub>)','&minus;'+sigf(meV(P.eps),4)+' meV = &minus;&epsilon;','good')
      +rrow('F(r<sub>min</sub>)','0 exactly','good')
      +rrow('strongest pull at (26/7)<sup>1/6</sup>&sigma;',sigf(P.rF,5)+' pm')
      +rrow('and it is',sigf(pN(-ljF(P.rF,P.sig,P.eps)),4)+' pN');
  }
  else if(M.view==='motion'){
    const tp=L.tp;
    s+=pairRows(M);
    s+=hd('the motion')
      +rrow('speed |dr/dt|',sigf(Math.abs(st.v),4)+' m/s')
      +rrow('kinetic energy',sigf(meV(L.K),4)+' meV')
      +rrow('total E',sigf(meV(L.E),4)+' meV',L.bound?'good':'bad')
      +rrow('E / &epsilon;',fmt(L.E/P.eps,4))
      +rrow('bound?',L.bound?'yes &mdash; it oscillates':'no &mdash; it escapes',L.bound?'good':'bad');
    if(L.bound&&tp&&isFinite(tp.rOut)) s+=rrow('turning points',fmt(tp.rIn,1)+' &ndash; '+fmt(tp.rOut,1)+' pm')
      +rrow('period (quadrature)',sigf(L.period,5)+' ps','good')
      +rrow('2&pi;/&omega; (harmonic)',sigf(P.period,5)+' ps');
    else s+=rrow('escape speed at this r',sigf(L.vEsc,4)+' m/s');
    s+=rrow('clock t',fmt(st.t,3)+' ps');
  }
  else if(M.view==='small'){
    const S=M.SM;
    s+=hd('the harmonic limit')
      +rrow('V&Prime;(r<sub>min</sub>) = 72&epsilon;/(2<sup>1/3</sup>&sigma;&sup2;)',sigf(P.k,6)+' u/ps&sup2;','good')
      +rrow('&omega; = &radic;(V&Prime;/&mu;)',sigf(P.omega,6)+' rad/ps','good')
      +rrow('in SI',sciHTML(P.omega*1e12,4)+' rad/s')
      +rrow('T = 2&pi;/&omega;',sigf(P.period,6)+' ps','good')
      +rrow('&mu; (left atom '+(P.pinned?'pinned':'free')+')',sigf(P.mu,6)+' u')
      +rrow('the other choice would give',sigf(ljPeriod(P.sig,P.eps,P.pinned?P.muMov:P.muPin),6)+' ps');
    s+=hd('how far from harmonic')
      +rrow('release offset A',fmt(S.A,3)+' pm')
      +rrow('amplitude a = (r<sub>out</sub>&minus;r<sub>in</sub>)/2',sigf(S.aNow,5)+' pm')
      +rrow('true period',sigf(S.Tnow,6)+' ps')
      +rrow('T/T<sub>0</sub> &minus; 1',sciHTML(S.Tnow/P.period-1,3),'good')
      +rrow('(91/4) a&sup2;/r<sub>min</sub>&sup2;',sciHTML(S.predNow,3),'good');
  }
  else if(M.view==='pairs'){
    const R=M.PR;
    s+=hd('PhET&rsquo;s &sigma; is the literature r<sub>min</sub>');
    ['Ne','Ar'].forEach(a=>{
      const row=R.rows.find(r2=>r2.key===a+a);
      s+=rrow(ATOM[a].name+': PhET &sigma;',fmt(row.sig,1)+' pm')
        +rrow('&nbsp;&nbsp;literature &sigma;',fmt(row.lsig,1)+' pm ('+fmt(100*(row.sig/row.lsig-1),1)+'%)','bad')
        +rrow('&nbsp;&nbsp;literature r<sub>min</sub>',fmt(row.lrminTab,1)+' pm ('+fmt(100*(row.sig/row.lrminTab-1),1)+'%)','good');
    });
    s+=hd('the source table checks itself')
      +rrow('worst |r<sub>min</sub>/&sigma; &minus; 2<sup>1/6</sup>|',
            sciHTML(Math.max.apply(null,R.tab.map(t=>t.err)),2),'good');
    s+=hd('corresponding states')
      +rrow('mean kT<sub>c</sub>/&epsilon;',fmt(R.csMean,4),'good')
      +rrow('spread',fmt(100*R.csSpread,1)+'%');
  }
  else{
    const I=M.IT;
    s+=hd('one period at five step sizes')
      +rrow('velocity Verlet order',fmt(I.curves.verlet.order,4),'good')
      +rrow('symplectic Euler order',fmt(I.curves.symplectic.order,4))
      +rrow('forward Euler order',fmt(I.curves.forward.order,4));
    s+=hd('after '+I.nPer+' periods at &Delta;t = 1 fs')
      +rrow('Verlet |&Delta;E|/&epsilon;',sciHTML(I.drift.verlet.last,3),'good')
      +rrow('symplectic Euler',sciHTML(I.drift.symplectic.last,3),'good')
      +rrow('forward Euler',sciHTML(I.drift.forward.last,3),'bad');
    s+=hd('the run')
      +rrow('released at rest at',fmt(I.r0,2)+' pm')
      +rrow('its period',sigf(I.T,6)+' ps');
  }
  s+='</table><div class="note">'+(P.lit
    ? '<b>Literature</b> &epsilon;, &sigma; are live: '+P.src+'. '
    : '<b>PhET&rsquo;s</b> &epsilon;, &sigma; are live ('+P.src+', build 1.2.21). ')
    +'&epsilon; is quoted the way the literature quotes it, as &epsilon;/k<sub>B</sub> in kelvin. '
    +'k<sub>B</sub> and m<sub>u</sub>: CODATA 2022 through scipy.constants. Every closed form is '
    +'pinned in selfTest to build/atomic-interactions/derive.py.</div>';
  return s;
}
function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='atoms') return E('<span class="hl">V(r) = 4&epsilon;[ (&sigma;/r)<sup>12</sup> &minus; (&sigma;/r)<sup>6</sup> ]</span>'
    +' &nbsp;&middot;&nbsp; V(&sigma;) = 0 &nbsp;&middot;&nbsp; <span class="hl2">V(2<sup>1/6</sup>&sigma;) = &minus;&epsilon;</span>',
    'the Lennard-Jones pair potential: an r⁻¹² wall from the electrons refusing to overlap, an r⁻⁶ pull from their correlated fluctuations');
  if(M.view==='well') return E('<span class="hl">F(r) = &minus;dV/dr = (24&epsilon;/r)[ 2(&sigma;/r)<sup>12</sup> &minus; (&sigma;/r)<sup>6</sup> ]</span>'
    +' &nbsp;&middot;&nbsp; F = 0 at r<sub>min</sub> &nbsp;&middot;&nbsp; F most negative at (26/7)<sup>1/6</sup>&sigma;',
    'the force is minus the slope of the curve: uphill to the left, downhill to the right, and flat exactly at the bottom');
  if(M.view==='motion') return E('<span class="hl">E = &frac12;&mu;(dr/dt)&sup2; + V(r)</span>'
    +' &nbsp;&middot;&nbsp; V(r) = E at the turning points &nbsp;&middot;&nbsp; u = (&sigma;/r)<sup>6</sup>: <span class="hl2">u<sub>in</sub> + u<sub>out</sub> = 1</span>',
    'the total energy is fixed, so the atom turns round wherever the curve rises to meet it — and with E ≥ 0 it never turns round at all');
  if(M.view==='small') return E('<span class="hl">&omega; = &radic;(V&Prime;(r<sub>min</sub>)/&mu;)</span>'
    +' &nbsp;&middot;&nbsp; V&Prime;(r<sub>min</sub>) = 72&epsilon;/(2<sup>1/3</sup>&sigma;&sup2;) &nbsp;&middot;&nbsp; '
    +'<span class="hl2">T(a) = T<sub>0</sub>[1 + (91/4) a&sup2;/r<sub>min</sub>&sup2;]</span>',
    'near the bottom every well is a parabola, so the period does not depend on amplitude — until it does, quadratically');
  if(M.view==='pairs') return E('<span class="hl">&sigma;<sub>AB</sub> = (&sigma;<sub>A</sub>+&sigma;<sub>B</sub>)/2</span>'
    +' &nbsp;&middot;&nbsp; <span class="hl2">&epsilon;<sub>AB</sub> = &radic;(&epsilon;<sub>A</sub>&epsilon;<sub>B</sub>)</span>'
    +' &nbsp;&middot;&nbsp; r<sub>min</sub>/&sigma; = 2<sup>1/6</sup> = 1.1225',
    'the Lorentz–Berthelot combining rules, which is how a mixed pair is usually guessed from two like pairs');
  return E('<span class="hl">max|E(t) &minus; E(0)| &prop; &Delta;t<sup>p</sup></span>'
    +' &nbsp;&middot;&nbsp; velocity Verlet p = 2 &nbsp;&middot;&nbsp; semi-implicit Euler p = 1 &nbsp;&middot;&nbsp; '
    +'<span class="hl2">symplectic &rArr; bounded</span>',
    'a symplectic stepper conserves a nearby energy exactly, so its error oscillates for ever instead of growing');
}
function tagHTML(M){
  const P=M.P, L=M.L;
  const who=P.label+' &mdash; &epsilon;/k'+'<sub>B</sub> '+sigf(P.epsK,4)+' K, &sigma; '+sigf(P.sig,4)+' pm'
    +' ('+(P.lit?'literature':'PhET')+')';
  if(M.view==='pairs') return '<b>the atom pairs</b> — PhET’s seven wells, and the literature beside them';
  if(M.view==='steppers') return '<b>the integrator</b> — '+P.label+', released 10 pm outside the minimum';
  return '<b>'+TABS.find(t=>t[0]===M.view)[1]+'</b> — '+plain(who)
    +(M.view==='atoms'||M.view==='motion'?', r = '+fmt(L.r,1)+' pm':'');
}

/* ================================================================== *
 *  drawing helpers shared by the views  (projects/simulations/       *
 *  build_buoy/p4_views.js, lineage build_cycloid; unchanged)         *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  sim-specific drawing: the atom band, the force arrows, the well    *
 *  panel.  Geometry is built by one function that both the drawing    *
 *  and the hit-testing read, so a dragged atom and a drawn atom can   *
 *  never be in different places (waveguides Known-bad).               *
 * ================================================================== */

/* The house #hint (HTML: left 14 px, bottom 11 px) sits exactly on the last
   line of a caption that stageLayout anchors to the canvas bottom, and the
   display-list capture cannot see it because the hint is not canvas.  Every
   view here lays out to H - HINT_H and the layout sweep asserts no canvas text
   enters that corner (wave-on-a-string Known-bad; the fix is
   build/gravity-force-lab/p4_lab.js's). */
const HINT_H=18;
function stageLayoutH(ctx,W,H,capFull,capShort,nB,frac,nBN){
  return stageLayout(ctx,W,H-HINT_H,capFull,capShort,nB,frac,nBN);
}
/* The floating readout covers the top right of the stage (about 317 x 470 px),
   so every view reserves it in the label registry rather than hoping — a
   callout placed there is invisible (standard_candle Known-bad). */
function reserveReadout(W,H){ if(W>=900) LABELS.push([W-13-280-24,0,W,470]); }
/* a legend's own box, registered so lab() dodges it */
function regLegend(r){ if(r) LABELS.push([r.x,r.y,r.x1,r.y1]); }
/* the room a wrapped note needs under a panel whose x-axis label already
   reaches b.y1 + 34 (measure it, never guess: wrapped text has no fixed
   height — adiabatic_expansion Known-bad) */
function noteRoom(ctx,txt,w){ return wrapText(ctx,txt,w,SM_FONT).length*13+46; }
function drawNote(ctx,b,txt){ caption(ctx,b.x,b.y1+38,txt,b.w,'#767e92',SM_FONT); }
/* Reserve room for a wrapped note under a panel and return the shrunken box.
   The shrink has a floor, so on a narrow stage the room asked for may not be
   available; `fits` says whether it was, and drawNoteIf then draws nothing
   rather than printing the note over the stage caption.  A sparse view is not
   a broken view (pulsar Known-bad) — the picture is what matters. */
function noteFit(ctx,limitY,b,txt,shortTxt){
  for(const t of (shortTxt?[txt,shortTxt]:[txt])){
    const lines=wrapText(ctx,t,b.w,SM_FONT).length;
    const nb=box(b.x,b.y,b.w,Math.max(80,b.h-(lines*13+46)));
    if((nb.y1+38+lines*13)<=(limitY-8)) return {b:nb,txt:t,fits:true};
  }
  const lines=wrapText(ctx,shortTxt||txt,b.w,SM_FONT).length;
  return {b:box(b.x,b.y,b.w,Math.max(80,b.h-(lines*13+46))),txt:txt,fits:false};
}
/* the y a note under `main` must stay above: the stage caption when there is
   no bottom row, the bottom row's own title when there is */
function noteLimit(L){
  return L.bottom&&L.bottom.length?L.bottom[0].y-26:L.capY;
}
function drawNoteIf(ctx,N){ if(N.fits) drawNote(ctx,N.b,N.txt); }
/* tick counts derived from the box, not guessed: six y-ticks in a 150-px panel
   put '-1.0' on top of '-0.5' (adiabatic_expansion Known-bad) */
function nyFor(b){ return Math.max(2,Math.min(6,Math.floor(b.h/52))); }
/* A y tick landing exactly on the bottom of the frame puts its label in the
   corner, where the leftmost x-tick label already is — axes() draws both and
   neither knows about the other.  Drop the floor a little when that happens. */
function noCornerTick(lo,hi,ny){
  const t=ticksFor(Math.min(lo,hi),Math.max(lo,hi),ny);
  return (t.length&&Math.abs(t[0]-lo)<0.02*(hi-lo))?lo-0.09*(hi-lo):lo;
}
function nxFor(b){ return Math.max(2,Math.min(6,Math.floor(b.w/115))); }

/* n boxes side by side inside b (stacked when b is too narrow to split) */
function splitRow(b,n,gut){
  const g=gut===undefined?54:gut;
  if(n<=1) return [b];
  if(b.w<300*n){
    /* stacked: the gap must clear the upper panel's x-tick labels AND axis
       title (34 px) plus the lower panel's own title (14 px) */
    const hh=(b.h-64*(n-1))/n, out=[];
    for(let i=0;i<n;i++) out.push(box(b.x,b.y+i*(hh+64),b.w,hh));
    return out;
  }
  const w=(b.w-g*(n-1))/n, out=[];
  for(let i=0;i<n;i++) out.push(box(b.x+i*(w+g),b.y,w,b.h));
  return out;
}

/* a shaded sphere, drawn as concentric arcs so the display-list recorder sees
   real geometry (it has no ellipse() and does not carry a scaled arc through
   restore()) */
function drawAtom(ctx,cx,cy,R,col,sym,dim){
  const n=7;
  for(let i=n;i>=1;i--){
    const t=i/n, rr=R*t;
    ctx.beginPath();
    ctx.arc(cx-R*0.22*(1-t),cy-R*0.24*(1-t),rr,0,TAU);
    ctx.fillStyle=shade(col,dim?0.20+0.30*(1-t):0.30+0.55*(1-t));
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU);
  ctx.strokeStyle=dim?rgba(col,0.35):rgba(col,0.85); ctx.lineWidth=1.2; ctx.stroke();
  if(sym&&R>11){
    ctx.fillStyle='#0a0c12'; ctx.font='bold '+Math.min(17,Math.max(9,R*0.5))+'px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(sym,cx,cy);
  }
}

/* One force arrow, horizontal, with its own head.  `px` is pixels per pN and
   `cap` the longest arrow the stage can hold; a capped arrow gets a chevron at
   its tip, because a clipped bar that looks like a short one is a lie about
   the number (the waterfall lesson, on an arrow). */
function forceArrow(ctx,x,y,F,px,col,cap){
  const L=F*px, C=cap||300;
  if(Math.abs(L)<1.5) return 0;
  const s=L>0?1:-1, cut=Math.abs(L)>C, Lc=Math.min(Math.abs(L),C)*s;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Lc,y);
  const hh=Math.min(10,Math.abs(Lc)*0.45);
  ctx.moveTo(x+Lc,y); ctx.lineTo(x+Lc-hh*s,y-hh*0.55);
  ctx.moveTo(x+Lc,y); ctx.lineTo(x+Lc-hh*s,y+hh*0.55);
  if(cut) for(const d of [5,10]){
    ctx.moveTo(x+Lc+d*s,y-6); ctx.lineTo(x+Lc+(d+4)*s,y); ctx.lineTo(x+Lc+d*s,y+6); }
  ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.stroke();
  ctx.lineCap='butt';
  return cut?NaN:Lc;
}

/* The geometry of the two-atoms view.  Returns the boxes, the shared r->x
   mapping, the drawn atom radii and the factor by which they had to be
   reduced (printed on the canvas whenever it is not 1). */
function atomsGeom(ctx,W,H,M){
  const P=M.P, st=M.st;
  const L=stageLayoutH(ctx,W,H,ATOMS_CAP_FULL,ATOMS_CAP_SHORT,0,0,0);
  const b=L.main;
  const xHi=P.rHi;
  const gx=b.x+58, gw=Math.max(120,b.x1-gx-14);
  const X=r=>gx+gw*(r-xLoRef.v)/(xHi-xLoRef.v),
        wx=px=>xLoRef.v+(px-gx)*(xHi-xLoRef.v)/gw;
  const xLoRef={v:0};
  /* The axis starts a little LEFT of zero so the pinned atom, whose centre is
     r = 0, is drawn whole instead of half off the stage.  Its left edge is the
     drawn radius, which depends on the scale, which depends on the span — two
     passes are enough, since each only shrinks the atom. */
  const rBig=Math.max(P.rA,P.rB);
  let xLo=0, sx=gw/(xHi-xLo), bandH=0, fac=1;
  for(let pass=0;pass<3;pass++){
    sx=gw/(xHi-xLo);
    bandH=clamp(2*rBig*sx+78,92,Math.max(92,0.44*b.h));
    /* the two force labels sit 13 and 27 px above the atom, so the half-band
       has to hold the radius AND 36 px of label */
    fac=Math.min(1,(bandH/2-36)/Math.max(1e-9,rBig*sx));
    xLo=-1.06*P.rA*fac;
  }
  const band={x:gx,y:b.y,w:gw,h:bandH,y1:b.y+bandH,cy:b.y+bandH*0.5};
  /* the note is built here, not in the drawing, because its wrapped height
     decides how much room the graph gets */
  const apx=arrowScale(P,gw), acap=Math.min(300,0.36*gw);
  let note='the atoms are drawn to the r axis of the graph'
    +(fac<0.995?', reduced x'+fmt(fac,2)+' to fit the band':'')
    +' · V leaves the top of the box below r/σ ≈ 0.90';
  let short='atoms to the r axis'+(fac<0.995?' x'+fmt(fac,2):'');
  if(st.forces==='hidden'){ note+=' · forces hidden, as PhET starts them'; }
  else { note+=' · force arrows: 1 pN = '+fmt(apx,1)+' px, cut off at '
           +fmt(acap,0)+' px with a chevron';
         short+=' · 1 pN = '+fmt(apx,1)+' px'; }
  const top=b.y+bandH+16;
  const N=noteFit(ctx,noteLimit(L),box(gx,top,gw,Math.max(90,b.y1-top)),note,short);
  xLoRef.v=xLo;
  return {L,b,band,gb:N.b,note:N,X,wx,sx,fac,xHi,xLo,apx,
          arrowCap:acap,
          rA:P.rA*sx*fac,rB:P.rB*sx*fac};
}

/* the caption text lives here so the geometry function can measure it */
const ATOMS_CAP_FULL='The two atoms sit on the same horizontal scale as the curve below them, so the movable atom’s centre is directly above its own point on the potential. Drag it. The curve is the Lennard-Jones potential for the pair; the magenta rule marks the current separation and the dot marks V(r) there. Where the curve slopes down to the right the atoms attract, where it slopes up they repel, and at the bottom — the dashed line at r_min = 2^(1/6) sigma — the force is exactly zero. Forces are drawn as arrows on the movable atom to the printed scale; PhET draws them the same way and lets you show the two halves separately.';
const ATOMS_CAP_SHORT='Two atoms and their Lennard-Jones potential on one r axis. Drag the right-hand atom; the arrows are the force to the printed scale.';
const WELL_CAP_FULL='The same well, and beneath it the force it produces. F(r) = -dV/dr is the slope of the curve above, turned upside down: it crosses zero exactly at the bottom of the well, it is most negative (most attractive) at the inflection of V, and it rises without bound as the atoms are pushed together. The residual panel is the closed-form force minus a Richardson-extrapolated central difference of V, divided by the force scale 24 eps/r — it is machine noise, which is what “the force is exactly minus the derivative” looks like when you check it numerically.';
const WELL_CAP_SHORT='V(r) above, F(r) = -dV/dr below, and the residual between the closed-form force and a numerical derivative of V.';
const MOTION_CAP_FULL='Release the movable atom and the well does the rest. The trace is r(t); the dashed rules are the two turning points, where the potential curve rises to meet the total energy, and they are exact — with u = (sigma/r)^6 the condition V(r) = E is a quadratic whose roots satisfy u_in + u_out = 1. The ledger underneath is the energy: kinetic and potential trade back and forth while their sum stays flat, to the integrator’s accuracy. The phase portrait closes on itself for a bound orbit and runs away past the separatrix E = 0.';
const MOTION_CAP_SHORT='r(t) with its exact turning points, the energy ledger, and the phase portrait with the E = 0 separatrix.';
const SMALL_CAP_FULL='Every smooth minimum is a parabola close enough in, and this is how close. The orange curve is the harmonic approximation -eps + V″(r_min)(r - r_min)²/2 through the bottom of the well; the period of a small oscillation is 2 pi / sqrt(V″(r_min)/mu), with mu the mass of whatever is actually free to move. The panel underneath measures how fast the true period leaves that value as the amplitude grows: the points are the regularised quadrature, the orange line is Landau’s anharmonic prediction T = T0 [1 + (91/4) a²/r_min²] for this well, and the two agree to a part in 10^5 until the orbit is a tenth of r_min wide.';
const SMALL_CAP_SHORT='The harmonic fit at the bottom of the well, and how fast the real period leaves 2 pi / omega as the amplitude grows.';
const PAIRS_CAP_FULL='Every pair PhET offers, on one axis, in PhET’s own parameters (solid) and in the literature’s (dashed). PhET’s sigma is systematically the literature r_min rather than the literature sigma, because PhET sets sigma to twice the van der Waals radius and that radius is measured at the bottom of the well, a factor 2^(1/6) = 1.1225 further out. Neon and argon land within 2% of the literature r_min and 10% away from the literature sigma. The oxygen pair matches neither: PhET’s own States-of-Matter constants carry 113 K and 365 pm for O2, while this screen uses 1000 K and 200 pm.';
const PAIRS_CAP_SHORT='PhET’s seven wells against the literature, the combining rules, and what PhET’s sigma really is.';
const STEP_CAP_FULL='The same release, integrated three ways. The left panel is the worst excursion of the total energy over exactly one period, against the step size, on log-log axes: the slope is the order of the method, and the fitted slopes are printed. The right panel runs at a fixed 1 fs step and watches the error for twenty periods. Velocity Verlet and semi-implicit Euler are symplectic, so their energy error oscillates and never grows; forward Euler is not, and its error grows without bound whatever the step size. PhET uses semi-implicit Euler; this sim uses velocity Verlet.';
const STEP_CAP_SHORT='Energy error against step size (the order) and against time (the boundedness), for three integrators.';

/* the well panel: V/eps against r, with the three landmarks */
function drawWellPanel(ctx,bx,M,opt){
  const P=M.P, C=M.C||wellCurve(P,240), o=opt||{};
  const ylo=o.ylo===undefined?-1.32:o.ylo, yhi=o.yhi===undefined?2.4:o.yhi;
  const xlo=o.xlo===undefined?0:o.xlo, xhi=o.xhi===undefined?P.rHi:o.xhi;
  axesR(ctx,bx,xlo,xhi,ylo,yhi,{xlab:'separation r, pm',ylab:'V(r) / ε',
    title:o.title,nx:nxFor(bx),ny:nyFor(bx),xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  /* zero line and the well floor */
  polyline(ctx,bx,[xlo,xhi],[0,0],xlo,xhi,ylo,yhi,'#3a4152',1,[3,4]);
  polyline(ctx,bx,[xlo,xhi],[-1,-1],xlo,xhi,ylo,yhi,rgba(COL.struct,0.35),1,[3,4]);
  polyline(ctx,bx,C.xs,C.ys,xlo,xhi,ylo,yhi,COL.pos,2);
  const Xof=r=>bx.x+bx.w*(r-xlo)/(xhi-xlo), Yof=v=>bx.y1-bx.h*(v-ylo)/(yhi-ylo);
  /* sigma: the zero crossing */
  if(P.sig>=xlo&&P.sig<=xhi){
    polyline(ctx,bx,[P.sig,P.sig],[ylo,0],xlo,xhi,ylo,yhi,rgba(COL.struct,0.5),1,[2,3]);
    dot(ctx,Xof(P.sig),Yof(0),3.4,COL.struct,'#0a0c12',1);
  }
  /* r_min: the bottom */
  if(P.rmin>=xlo&&P.rmin<=xhi){
    polyline(ctx,bx,[P.rmin,P.rmin],[ylo,-1],xlo,xhi,ylo,yhi,rgba(COL.struct,0.5),1,[2,3]);
    dot(ctx,Xof(P.rmin),Yof(-1),3.4,COL.struct,'#0a0c12',1);
  }
  return {Xof,Yof,xlo,xhi,ylo,yhi};
}

/* ================================================================== *
 *  the six views                                                      *
 * ================================================================== */

/* the arrow scale: pixels per pN, chosen from 4 eps/sigma so an arrow at the
   bottom of the well is legible and the wall's arrows clip rather than fill
   the stage.  Printed on the canvas, always. */
function arrowScale(P,bw){
  const ref=pN(4*P.eps/P.sig);
  return Math.max(0.2,0.20*bw/Math.max(ref,1e-9));
}

/* ---------------- A. the two atoms (PhET's screen) ---------------- */
function drawAtoms(ctx,W,H,M){
  const P=M.P, L=M.L, st=M.st;
  reserveReadout(W,H);
  const G=atomsGeom(ctx,W,H,M);
  drawCaption(ctx,G.L);
  const band=G.band, gb=G.gb;

  /* the line the atoms sit on */
  ctx.beginPath();
  ctx.moveTo(band.x,band.cy+G.rA+3); ctx.lineTo(band.x+band.w,band.cy+G.rA+3);
  ctx.strokeStyle='#1b2030'; ctx.lineWidth=1; ctx.stroke();

  const x0=G.X(0), x1=G.X(L.r);
  /* the tie line from the movable atom down to its point on the curve */
  ctx.beginPath(); ctx.moveTo(x1,band.cy); ctx.lineTo(x1,gb.y1);
  ctx.strokeStyle=rgba(COL.live,0.30); ctx.lineWidth=1; ctx.setLineDash([3,4]);
  ctx.stroke(); ctx.setLineDash([]);

  drawAtom(ctx,x0,band.cy,G.rA,P.A.col,P.A.sym,false);
  drawAtom(ctx,x1,band.cy,G.rB,P.B.col,P.B.sym,false);
  /* PhET's push-pin on the fixed atom */
  if(P.pinned&&G.rA>8){
    const px=x0-G.rA*0.62, py=band.cy-G.rA*0.62;
    ctx.beginPath(); ctx.arc(px,py,4,0,TAU); ctx.fillStyle='#d8dbe4'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+7,py+9);
    ctx.strokeStyle='#d8dbe4'; ctx.lineWidth=2; ctx.stroke();
  }

  /* The potential is drawn BEFORE the band's labels, not after, so that its
     title is already in the label registry when the force labels look for a
     slot — otherwise a label placed under the movable atom lands on it. */
  const A=drawWellPanel(ctx,gb,M,{xlo:G.xLo,xhi:G.xHi,
    title:titleFor(gb,'the Lennard-Jones potential of the pair','V(r)')});

  /* the names next, so the force labels dodge them rather than the other way */
  lab(ctx,W,H,band.x,band.y+9,P.A.name+(P.pinned?' (pinned)':' (free)'),
      rgba(P.A.col,0.9),LAB_FONT,'left');
  lab(ctx,W,H,band.x+band.w,band.y+9,P.B.name+' — drag it',
      rgba(P.B.col,0.9),LAB_FONT,'right');

  /* the force arrows, PhET's three modes.  A force of 1e-12 pN is zero: say
     so rather than printing a number that is pure cancellation.  Both labels
     go ABOVE the atom, where the graph title below cannot reach them. */
  const px=G.apx;
  const fTxt=f=>Math.abs(f)<1e-6?'≈ 0':sigf(Math.abs(f),3);
  if(st.forces!=='hidden'){
    const ay=band.cy;
    if(st.forces==='total'){
      forceArrow(ctx,x1,ay,pN(L.F),px,COL.pos,G.arrowCap);
      lab(ctx,W,H,x1,ay-G.rB-13,'total force '+fTxt(pN(L.F))+' pN',COL.pos,LAB_FONT,'center');
    } else {
      forceArrow(ctx,x1,ay-11,pN(L.Frep),px,COL.rep,G.arrowCap);
      forceArrow(ctx,x1,ay+11,-pN(L.Fatt),px,COL.att,G.arrowCap);
      lab(ctx,W,H,x1,ay-G.rB-27,'repulsive '+fTxt(pN(L.Frep))+' pN',COL.rep,LAB_FONT,'center');
      lab(ctx,W,H,x1,ay-G.rB-13,'attractive '+fTxt(pN(L.Fatt))+' pN',COL.att,LAB_FONT,'center');
    }
  }
  polyline(ctx,gb,[L.r,L.r],[A.ylo,A.yhi],A.xlo,A.xhi,A.ylo,A.yhi,rgba(COL.live,0.55),1.2,[4,4]);
  if(L.V/P.eps>=A.ylo&&L.V/P.eps<=A.yhi) dot(ctx,A.Xof(L.r),A.Yof(L.V/P.eps),5,COL.live,'#fff',1.2);
  /* at the TOP of the box: down by the axis they are pushed into the x-tick
     labels whenever sigma and r_min are close on screen (found at 560 px by
     the layout sweep, on the oxygen pair) */
  lab(ctx,W,H,A.Xof(P.sig),gb.y+13,'σ',COL.struct,LAB_FONT,'center');
  lab(ctx,W,H,A.Xof(P.rmin),gb.y+13,'r_min',COL.struct,LAB_FONT,'center');
  lab(ctx,W,H,gb.x+5,A.Yof(-1)-10,'−ε',COL.struct,LAB_FONT,'left');

  /* the honest note: the drawn-atom factor and the arrow scale */
  drawNoteIf(ctx,G.note);
  return G;
}

/* ---------------- B. the well ---------------- */
function drawWell(ctx,W,H,M){
  const P=M.P, L=M.L, st=M.st;
  reserveReadout(W,H);
  const Lo=stageLayoutH(ctx,W,H,WELL_CAP_FULL,WELL_CAP_SHORT,2,0.44,1);
  drawCaption(ctx,Lo);
  /* fit each axis to the structure it contains: past 2.45 sigma the well is
     flat and the panel is all tail (diffraction Known-bad) */
  const lo=0.80*P.sig, hi=2.45*P.sig;
  const C=wellCurve(P,280,lo,hi);
  const note='σ = '+fmt(P.sig,1)+' pm, where V crosses zero   ·   r_min = 2^(1/6) σ = '
    +fmt(P.rmin,1)+' pm, where V = −ε and the force vanishes   ·   the strongest pull is at '
    +'(26/7)^(1/6) σ = '+fmt(P.rF,1)+' pm, the inflection of V, and is '
    +sigf(-pN(ljF(P.rF,P.sig,P.eps)),3)+' pN   ·   the force panel is scaled to the '
    +'ATTRACTION, so its repulsive wall runs off the top of the box';
  const N=noteFit(ctx,noteLimit(Lo),Lo.main,note,
    'σ = '+fmt(P.sig,1)+' pm, r_min = '+fmt(P.rmin,1)+' pm, strongest pull at '
    +fmt(P.rF,1)+' pm'), mb=N.b;
  const A=drawWellPanel(ctx,mb,{P,C},{xlo:lo,xhi:hi,ylo:-1.32,yhi:2.4,
    title:titleFor(mb,'V(r) — the well, with its three exact landmarks','V(r)')});
  polyline(ctx,mb,[L.r,L.r],[A.ylo,A.yhi],A.xlo,A.xhi,A.ylo,A.yhi,rgba(COL.live,0.5),1.2,[4,4]);
  if(L.V/P.eps>=A.ylo&&L.V/P.eps<=A.yhi) dot(ctx,A.Xof(L.r),A.Yof(L.V/P.eps),5,COL.live,'#fff',1.2);
  if(P.rF<hi) polyline(ctx,mb,[P.rF,P.rF],[A.ylo,A.yhi],A.xlo,A.xhi,A.ylo,A.yhi,
                       rgba(COL.ref,0.35),1,[2,3]);
  /* the three landmarks are named at the TOP of the panel, on their own
     dashed rules: down at the axis they sit among the tick labels */
  lab(ctx,W,H,A.Xof(P.sig),mb.y+13,'σ',COL.struct,LAB_FONT,'center');
  lab(ctx,W,H,A.Xof(P.rmin),mb.y+13,'r_min',COL.struct,LAB_FONT,'center');
  lab(ctx,W,H,A.Xof(P.rF),mb.y+13,'r_F',COL.ref,LAB_FONT,'center');
  lab(ctx,W,H,mb.x+5,A.Yof(-1)-11,'−ε',COL.struct,LAB_FONT,'left');
  drawNoteIf(ctx,N);

  /* the force */
  const fb=Lo.bottom[0];
  if(fb){
    const fs=C.fs.map(pN), reps=C.reps.map(pN), atts=C.atts.map(pN);
    /* the repulsive wall is thirty times the deepest pull, so an axis fitted to
       it hides the attraction entirely: fit the ATTRACTIVE extreme and let the
       wall run off the top, which the note says it does */
    let fmin=0;
    for(let i=0;i<fs.length;i++) fmin=Math.min(fmin,fs[i]);
    const fhi=-3.2*1.45*fmin, flo=noCornerTick(1.45*fmin,fhi,nyFor(fb));
    /* a hair of x margin, so the leftmost x-tick label is not in the same
       corner as the lowest y-tick label — axes() draws both and neither knows
       about the other (found by the layout sweep on sigma = 500 pm) */
    const xlo=lo-0.06*(hi-lo);
    axesR(ctx,fb,xlo,hi,flo,fhi,{xlab:'r, pm',ylab:'F(r), pN',nx:nxFor(fb),ny:nyFor(fb),
      xfmt:t=>fmt(t,0),yfmt:t=>sigf(t,2),
      title:titleFor(fb,'F(r) = −dV/dr','F(r)')});
    polyline(ctx,fb,[xlo,hi],[0,0],xlo,hi,flo,fhi,'#3a4152',1,[3,4]);
    if(st.forces==='components'){
      polyline(ctx,fb,C.xs,reps,xlo,hi,flo,fhi,COL.rep,1.4);
      polyline(ctx,fb,C.xs,atts,xlo,hi,flo,fhi,COL.att,1.4);
    }
    polyline(ctx,fb,C.xs,fs,xlo,hi,flo,fhi,COL.pos,2);
    polyline(ctx,fb,[P.rmin,P.rmin],[flo,fhi],xlo,hi,flo,fhi,rgba(COL.struct,0.5),1,[2,3]);
    polyline(ctx,fb,[P.rF,P.rF],[flo,fhi],xlo,hi,flo,fhi,rgba(COL.ref,0.5),1,[2,3]);
    marker(ctx,fb,xlo,hi,flo,fhi,L.r,clamp(pN(L.F),flo,fhi),COL.live);
    const items=[[COL.pos,'F = −dV/dr']];
    if(st.forces==='components'){ items.push([COL.rep,'48εσ¹²/r¹³']); items.push([COL.att,'−24εσ⁶/r⁷']); }
    items.push([COL.ref,'strongest pull, (26/7)^(1/6) σ']);
    regLegend(legendAuto(ctx,fb,items));
  }

  /* the residual: closed form against a numerical derivative of V */
  const rb=Lo.bottom[1];
  if(rb){
    const xs=[],ys=[];
    for(let i=0;i<=100;i++){
      const r=lo+(hi-lo)*i/100;
      const scale=24*P.eps/r;
      xs.push(r);
      ys.push(Math.max(1e-18,Math.abs(ljF(r,P.sig,P.eps)-numForce(r,P.sig,P.eps))/scale));
    }
    /* the floor is -18.4, not -18: a tick exactly on the frame puts its label
       in the same corner as the leftmost x-tick label (the sweep found this at
       sigma = 500 pm, where the x axis also starts on a round number) */
    const yl=-18.4, yh=-11.8, rxlo=lo-0.06*(hi-lo);
    axesR(ctx,rb,rxlo,hi,yl,yh,{xlab:'r, pm',ylab:'log₁₀ |ΔF| / (24ε/r)',nx:nxFor(rb),ny:nyFor(rb),
      xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0),
      title:titleFor(rb,'the force really is minus the derivative','residual')});
    polyline(ctx,rb,xs,ys.map(v=>Math.log10(v)),rxlo,hi,yl,yh,COL.ref,1.6);
    polyline(ctx,rb,[rxlo,hi],[Math.log10(2.220446049250313e-16),Math.log10(2.220446049250313e-16)],
             rxlo,hi,yl,yh,rgba(COL.dim,0.6),1,[3,4]);
    lab(ctx,W,H,rb.x+7,rb.y+12,'dashed: one double-precision epsilon',COL.dim,SM_FONT,'left');
  }
}

/* a Richardson-extrapolated central difference of V, used ONLY as the
   independent route to the force (never to draw the physics) */
function numForce(r,sig,eps){
  const h=r*1e-4;
  const d=hh=>(ljV(r+hh,sig,eps)-ljV(r-hh,sig,eps))/(2*hh);
  return -(4*d(h/2)-d(h))/3;
}
function numVpp(r,sig,eps){
  const h=r*1e-3;
  const d=hh=>(ljV(r+hh,sig,eps)-2*ljV(r,sig,eps)+ljV(r-hh,sig,eps))/(hh*hh);
  return (4*d(h/2)-d(h))/3;
}

/* ---------------- C. the motion ---------------- */
function drawMotion(ctx,W,H,M){
  const P=M.P, L=M.L, st=M.st, MO=M.MO;
  reserveReadout(W,H);
  const Lo=stageLayoutH(ctx,W,H,MOTION_CAP_FULL,MOTION_CAP_SHORT,2,0.42,1);
  drawCaption(ctx,Lo);
  const b=Lo.main;
  const Twin=isFinite(L.period)?clamp(4*L.period,2,40):12;
  const t1=Math.max(Twin,st.t), t0=t1-Twin;
  let rlo=P.rmin-1,rhi=P.rmin+1;
  if(L.tp){ rlo=Math.min(rlo,L.tp.rIn); rhi=Math.max(rhi,isFinite(L.tp.rOut)?L.tp.rOut:P.rHi); }
  for(const p of MO.trail){ if(p[0]<t0) continue; rlo=Math.min(rlo,p[1]); rhi=Math.max(rhi,p[1]); }
  const pad=0.08*(rhi-rlo)+2; rlo-=pad; rhi+=pad;
  rhi=Math.min(rhi,P.rHi*1.15);
  axesR(ctx,b,t0,t1,rlo,rhi,{xlab:'time t, ps',ylab:'separation r, pm',nx:nxFor(b),ny:nyFor(b),
    xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,0),
    title:titleFor(b,'r(t) — the movable atom in the well','r(t)')});
  polyline(ctx,b,[t0,t1],[P.rmin,P.rmin],t0,t1,rlo,rhi,rgba(COL.struct,0.45),1,[3,4]);
  if(L.bound&&L.tp){
    polyline(ctx,b,[t0,t1],[L.tp.rIn,L.tp.rIn],t0,t1,rlo,rhi,rgba(COL.ref,0.75),1.2,[5,4]);
    if(isFinite(L.tp.rOut))
      polyline(ctx,b,[t0,t1],[L.tp.rOut,L.tp.rOut],t0,t1,rlo,rhi,rgba(COL.ref,0.75),1.2,[5,4]);
  }
  if(MO.trail.length>1){
    const ts=MO.trail.map(p=>p[0]), rs=MO.trail.map(p=>p[1]);
    polyline(ctx,b,ts,rs,t0,t1,rlo,rhi,COL.pos,1.8);
  }
  if(st.t>=t0) marker(ctx,b,t0,t1,rlo,rhi,st.t,clamp(L.r,rlo,rhi),COL.live);
  /* build the legend from what was emitted: an unbound orbit has no turning
     points and an untouched view has no trace, and naming either would be a
     false statement about the picture (adiabatic_expansion Known-bad) */
  { const it=[];
    if(MO.trail.length>1) it.push([COL.pos,'r(t), velocity Verlet']);
    if(L.bound&&L.tp) it.push([COL.ref,'turning points (exact)']);
    it.push([COL.struct,'r_min']);
    regLegend(legendAuto(ctx,b,it)); }
  if(!MO.trail.length)
    lab(ctx,W,H,b.x+b.w/2,b.y+b.h*0.72,'press release, or play, to set it going',COL.dim,CAP_FONT,'center');

  /* the ledger */
  const eb=Lo.bottom[0];
  if(eb){
    const es=MO.trail.filter(p=>p[0]>=t0);
    /* fitted to the three curves, not to the whole well: K only ever reaches
       E + eps, which at a 10-pm release is 0.025 eps */
    let elo=Math.min(L.V/P.eps,L.E/P.eps), ehi=Math.max(L.K/P.eps,L.E/P.eps,0);
    for(const p of es){ elo=Math.min(elo,p[3]/P.eps,(p[2]+p[3])/P.eps);
      ehi=Math.max(ehi,(p[2]+p[3])/P.eps,p[2]/P.eps); }
    const epad=0.10*(ehi-elo)+0.01; elo-=epad; ehi+=epad;
    axesR(ctx,eb,t0,t1,elo,Math.min(ehi,4),{xlab:'t, ps',ylab:'energy / ε',nx:nxFor(eb),ny:nyFor(eb),
      xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,1),
      title:titleFor(eb,'the energy ledger — K, V and their sum','energy')});
    if(es.length>1){
      const ts=es.map(p=>p[0]);
      polyline(ctx,eb,ts,es.map(p=>p[2]/P.eps),t0,t1,elo,ehi,COL.kin,1.5);
      polyline(ctx,eb,ts,es.map(p=>p[3]/P.eps),t0,t1,elo,ehi,COL.pot,1.5);
      polyline(ctx,eb,ts,es.map(p=>(p[2]+p[3])/P.eps),t0,t1,elo,ehi,COL.tot,2);
    }
    polyline(ctx,eb,[t0,t1],[L.E/P.eps,L.E/P.eps],t0,t1,elo,ehi,rgba(COL.tot,0.35),1,[3,4]);
    /* nothing has been released yet: there are no curves to name */
    if(es.length>1)
      regLegend(legendAuto(ctx,eb,[[COL.kin,'K = ½μṙ²'],[COL.pot,'V(r)'],[COL.tot,'E = K + V']]));
    else lab(ctx,W,H,eb.x+eb.w/2,eb.y+eb.h*0.5,'nothing released yet',COL.dim,SM_FONT,'center');
  }

  /* the phase portrait */
  const pb=Lo.bottom[1];
  if(pb){
    /* the orbit, not the separatrix, sets the frame: the separatrix reaches
       hundreds of m/s at the wall and would squash every bound orbit to a line.
       It is clipped by polyline, which is what the dashed curve leaving the top
       of the box means. */
    let vmax=Math.abs(st.v);
    for(const v of MO.ph.vs) vmax=Math.max(vmax,v);
    if(!(vmax>0)) vmax=Math.max.apply(null,MO.sep.vs)*0.25;
    vmax*=1.45;
    const rOut=(L.tp&&isFinite(L.tp.rOut))?L.tp.rOut:P.rHi;
    const plo=P.sig*0.88, phi=clamp(1.25*rOut,1.4*P.sig,P.rHi);
    axesR(ctx,pb,plo,phi,-vmax,vmax,{xlab:'r, pm',ylab:'dr/dt, m/s',nx:nxFor(pb),ny:nyFor(pb),
      xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0),
      title:titleFor(pb,'the phase portrait and the E = 0 separatrix','phase')});
    polyline(ctx,pb,MO.sep.rs,MO.sep.vs,plo,phi,-vmax,vmax,rgba(COL.ref,0.8),1.3,[4,4]);
    polyline(ctx,pb,MO.sep.rs,MO.sep.vs.map(v=>-v),plo,phi,-vmax,vmax,rgba(COL.ref,0.8),1.3,[4,4]);
    if(MO.ph.rs.length){
      polyline(ctx,pb,MO.ph.rs,MO.ph.vs,plo,phi,-vmax,vmax,COL.pos,1.6);
      polyline(ctx,pb,MO.ph.rs,MO.ph.vs.map(v=>-v),plo,phi,-vmax,vmax,COL.pos,1.6);
    }
    marker(ctx,pb,plo,phi,-vmax,vmax,clamp(L.r,plo,phi),clamp(st.v,-vmax,vmax),COL.live);
    { const it=[];
      /* at E = -eps exactly the "orbit" is the fixed point at the bottom of
         the well: the polyline is zero length and nothing green is drawn, so
         the legend must not name it */
      if(MO.ph.rs.length&&L.tp&&(L.tp.rOut-L.tp.rIn)>0.02) it.push([COL.pos,'this orbit (closed)']);
      it.push([COL.ref,'E = 0, the separatrix']);
      it.push([COL.live,L.bound?'the atom now':'the atom now — unbound, no closed orbit']);
      regLegend(legendAuto(ctx,pb,it)); }
  }
}

/* ---------------- D. small oscillations ---------------- */
function drawSmall(ctx,W,H,M){
  const P=M.P, S=M.SM;
  reserveReadout(W,H);
  const Lo=stageLayoutH(ctx,W,H,SMALL_CAP_FULL,SMALL_CAP_SHORT,1,0.44,1);
  drawCaption(ctx,Lo);
  const note='ω = √(V″(r_min)/μ) = '+sigf(P.omega,4)+' rad/ps, so T = '+sigf(P.period,4)+' ps'
    +'   ·   μ = '+sigf(P.mu,4)+' u ('
    +(P.pinned?'the left atom is pinned, so μ is the movable atom’s own mass'
              :'both atoms move, so μ = m₁m₂/(m₁+m₂)')
    +')   ·   the vertical axis is the height above the bottom of the well, in units of '
