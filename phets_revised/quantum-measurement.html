<title>Quantum measurement &mdash; coins, photons, spins and the Bloch sphere: a state has amplitudes, a measurement has outcomes</title>
<!--
  ===================================================================
  quantum-measurement.html — what it means to measure a two-level
  system: classical coins against quantum "coins", single photons at a
  polarizing beam splitter, spin-1/2 atoms through Stern-Gerlach
  magnets one after another, and a spin on the Bloch sphere that
  precesses in a field and collapses when it is observed
  ===================================================================

  Remake of PhET Interactive Simulations' Quantum Measurement (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code
  or assets.  The screens, controls and constants follow PhET's build 1.0.5
  (docs/phets/quantum-measurement_en.html) and its doc/model.md; every number
  taken from that build is marked "PhET's value" in the code.

  Six views.  THE COINS is PhET's Coins screen: a classical coin and a
  quantum "coin", each prepared (heads or tails; up, down or a superposition
  with P(up) = |alpha|^2 set in steps of 0.05), sent to be measured, and then
  flipped, hidden and revealed (classical) or reprepared and observed
  (quantum), one at a time or 10, 100 or 10 000 identical coins at once, with
  the counts against the binomial's N p +- sqrt(N p (1-p)).  THE PHOTONS is
  PhET's Photons screen: a laser, a polarizing beam splitter that sends
  vertical light up and horizontal light on, a mirror, two detectors at
  equal path length; one photon at a time or a beam of up to 200 a second;
  vertical, horizontal, 45 degrees, unpolarized or a custom angle; which-path
  (classical) or split-and-collapse-at-the-detector (quantum) behaviour; the
  counts, the rates and the average polarization (N_V - N_H)/N.  THE SPINS
  is PhET's Spin screen: a spin-1/2 source (+Z, +X, -Z, or any state in the
  x-z plane), one Stern-Gerlach magnet or two stages, PhET's six experiments
  and a custom one, single particles or a continuous beam, blockers on the
  first magnet's exits and the percentages at every stage.  THE BLOCH SPHERE
  is PhET's Bloch Sphere screen: prepare theta and phi (steps of 15 degrees),
  turn on a field along z, wait a measurement delay while the state precesses,
  and observe one atom or ten along x, y or z; the state written in any of
  the three bases.  THE BORN RULE sets the half-angle of a spin, cos^2(Theta/2),
  against the photon's cos^2(theta), each with seeded counts from the same
  code the other views run, and shows sequential measurement as a product of
  projections: a middle magnet that lets particles through, and a chain of N
  magnets that drags a spin from up to down with probability
  cos^(2N)(pi/2N) -> 1.  THE BINOMIAL repeats the N-coin experiment and sets
  the histogram of heads against the exact binomial, and the spread of the
  fraction against sqrt(p(1-p)/N): why 10 000 coins look deterministic.

  WHAT IS EXACT HERE
  ------------------
  The Born rule, P(up along n) = (1 + r.n)/2 = cos^2(Theta/2) for a spin and
  cos^2(theta) (Malus) for a photon at the beam splitter.  Sequential
  Stern-Gerlach probabilities as products of projections, checked against
  2x2 complex projectors in numpy for all seven experiments and four source
  states.  Larmor precession as an exact rotation about the field, checked
  against scipy's matrix exponential of the Hamiltonian acting on the ket.
  The Bloch vector <-> ket map, round-tripped, and the state written in the
  X, Y and Z bases and rebuilt from what is written.  The binomial pmf
  (Stirling lnFact against math.lgamma to 1e-16, the pmf against scipy to
  1e-10).  Every random draw comes from one seeded PRNG (mulberry32), mirrored
  bit for bit in build/quantum-measurement/derive.py, so every seeded count
  in selfTest is an integer pinned exactly to Python AND tested against the
  law it samples with a tolerance taken from its own variance (4 sigma, a
  chi-square below scipy's 99.9 % quantile), not guessed.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  PhET's values: a flip takes 1 s; 10, 100 or 10 000 coins; the bias steps
  of 0.05; the photon apparatus (laser at x = -0.15, beam 0.04 wide, the
  splitter a 0.07 cube at the origin, mirror at 0.11, detectors 0.2 of path
  beyond the splitter), photons at 0.3 units a second, up to 200 a second,
  the rate averaged over 1 s in 0.5-s samples, counts capped at 999, slow
  motion x0.4; the six Stern-Gerlach experiments and PhET's custom layout,
  the particle amount 0.1 (PhET emits 5 x amount per 60-Hz frame, so 300 x
  amount a second here), the magnets' rates averaged over 3 s; the Bloch
  sphere's 15-degree steps, one or ten atoms, a delay of 0-1 ns (default
  0.75) in which a unit field turns the state once (PhET's pi/2 per second
  at 0.25 ns per second).  The remake gives that field real units: the spin
  is an electron's, B0 = 35.68 mT turns it once a nanosecond (CODATA 2022
  gamma_e/2pi = 28 024.951 3861 MHz/T, as stored in bloch_sphere.html, and
  equal to |g_e| mu_B/h to 1e-12), and the sense of the turn is the
  electron's: counterclockwise about +z, as PhET draws it.  Deliberate
  differences: PhET's custom spin state maps |alpha|^2 linearly onto the
  polar angle, theta = pi(1 - |alpha|^2), so its own equation disagrees with
  its slider except at 0, 1/2 and 1 (P(up) = 0.854 at |alpha|^2 = 0.75); here
  theta = 2 arccos|alpha| and the slider IS P(up).  PhET's Y-basis equation
  prints a relative phase of 1.5 pi for the +X state, which rebuilds -X with
  PhET's own +Y (azimuth pi/2); here it is 0.5 pi and every printed equation
  is rebuilt into the state in selfTest.  PhET turns its spheres a whole
  frame at a time and measures after the frame that reaches the delay, so
  its state can overshoot by up to one frame's turn (1.5 degrees at 60 Hz
  and full field, read from its step order); here the state is rotated to
  exactly the delay.  PhET starts the photon beam at 0 a second; here at 60,
  so the view is not empty.  An unpolarized beam's expectation value is
  shown as 0 (the mixture's), where PhET hides it.  The two photon scenes
  share one set of polarization and behaviour controls (PhET gives each
  scene its own laser); the Stern-Gerlach blocker is one setting (PhET
  remembers one per experiment); the coins are not animated flying from the
  preparation area into the test boxes; PhET's display toggles for the
  average polarization (vector, expectation value, decimal values) and the
  spin disc's projections are always on here; PhET's easter-egg display for
  10 000 quantum coins reprepared eight times in 20 s is not reproduced.
  Added beside PhET's screens: the fringe panel on the Bloch view (P(up)
  against the delay), the products-of-projections table on the spins view,
  the single coin's last outcomes, and the two analysis views.

  WHAT IS NOT MODELLED
  --------------------
  One two-level system at a time: no entanglement, no decoherence, no
  detector inefficiency or dark counts; measurement is projective and
  instantaneous; the Stern-Gerlach magnets are ideal filters (no field
  gradient, no beam spread); photons are point particles on straight rays
  (no interference between the arms, which PhET's geometry does not
  recombine); the field on the Bloch screen is along z only; no sounds and
  no screen-reader descriptions.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                 *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);

/* ================================================================== *
 *  the engine: one PRNG, the binomial, the qubit algebra, and PhET's  *

const DEG=Math.PI/180;          /* multiply degrees by DEG to get radians (90*DEG = pi/2, asserted) */

const BASIS={Z:{up:[1,0,0,0],dn:[0,0,1,0],n:[0,0,1]},
             X:{up:[Math.SQRT1_2,0,Math.SQRT1_2,0],dn:[Math.SQRT1_2,0,-Math.SQRT1_2,0],n:[1,0,0]},
             Y:{up:[Math.SQRT1_2,0,0,Math.SQRT1_2],dn:[Math.SQRT1_2,0,0,-Math.SQRT1_2],n:[0,1,0]}};
function wrap2(x){ x=x%2; return x<0?x+2:x; }
/* the state written in basis b: |psi> = e^{i g pi}(a|up> + c e^{i chi pi}|down>),
   a, c >= 0; chi and g in units of pi, in [0, 2) */
function ketInBasis(k,b){
  const B=BASIS[b], au=braket(B.up,k), ad=braket(B.dn,k);
  const a=Math.hypot(au[0],au[1]), c=Math.hypot(ad[0],ad[1]);
  const gu=Math.atan2(au[1],au[0])/Math.PI, gd=Math.atan2(ad[1],ad[0])/Math.PI;
  const g=a>1e-12?gu:gd;
  const chi=(a>1e-12&&c>1e-12)?wrap2(gd-gu):0;
  return {a,c,chi,g:wrap2(g)};
}
/* ... and the equation rebuilt into a ket, for the round trip */
function ketFromBasis(E,b){
  const B=BASIS[b], cg=Math.cos(Math.PI*E.g), sg=Math.sin(Math.PI*E.g);
  const cx=Math.cos(Math.PI*(E.g+E.chi)), sx=Math.sin(Math.PI*(E.g+E.chi));
  const o=[0,0,0,0];
  for(let i=0;i<2;i++){
    const ur=B.up[2*i], ui=B.up[2*i+1], dr=B.dn[2*i], di=B.dn[2*i+1];
    o[2*i]=E.a*(ur*cg-ui*sg)+E.c*(dr*cx-di*sx);
    o[2*i+1]=E.a*(ur*sg+ui*cg)+E.c*(dr*sx+di*cx);
  }
  return o;
}

/* ================================================================== *
 *  THE COINS (PhET's Coins screen)                                    *
 * ================================================================== */
const FLIP_T=1.0;               /* s: a flip or a repreparation takes 1 s (PhET's value) */
const COIN_NS=[10,100,10000];   /* identical coins (PhET's value) */
const BIAS_STEP=0.05;           /* the bias sliders snap to 0.05 (PhET's value) */
const HIST_KEEP=48;             /* the single coin's strip of recent outcomes (house) */
/* k/20 is correctly rounded where k x 0.05 is not (7 x 0.05 = 0.35000000000000003) */
function snapBias(p){ const n=Math.round(1/BIAS_STEP); return clamp(Math.round(p*n)/n,0,1); }
/* states: 'preparing' (flipping / being reprepared), 'ready' (a quantum coin
   nobody has looked at: no face exists yet), 'hidden' (a face exists, under the
   cup), 'revealed' */
function makeCoin(n){ return {n, state:'revealed', t:0, then:null, vals:new Uint8Array(10000), kUp:0, hist:[], nObs:0, nUp:0}; }
function makeCoinScene(type,seed){
  const q=type==='quantum';
  const sc={type, quantum:q, p:0.5, init:q?'up':'heads', preparing:true, startsHidden:false,
            single:makeCoin(1), set:makeCoin(100), R:rngMake(seed), seed};
  return sc;
}
/* the quantum coin's state follows its bias (PhET): 1 is up, 0 down, else a superposition */
function quantumInit(p){ return p>=1?'up':(p<=0?'down':'superposition'); }
function coinFace1(sc){ return (sc.init==='heads'||sc.init==='up'||sc.init==='superposition')?1:0; }
/* the draw: u < p is heads / up, exactly as PhET's seeded sets decide */
function coinDraw(sc,c){
  let k=0; for(let i=0;i<c.n;i++){ const v=rngNext(sc.R)<sc.p?1:0; c.vals[i]=v; k+=v; }
  c.kUp=k;
}
function coinPrepare(sc,c,reveal){ c.state='preparing'; c.t=0; c.then=reveal?'reveal':null; }
/* the end of a flip: a classical coin now HAS a face (under the cup); a quantum
   coin is ready, with no face until it is observed */
function coinPrepareNow(sc,c){ if(sc.quantum) c.state='ready'; else { coinDraw(sc,c); c.state='hidden'; } }
function coinReveal(sc,c){
  if(c.state==='preparing') return false;
  if(c.state==='ready') coinDraw(sc,c);         /* the collapse: the face is drawn now */
  const was=c.state; c.state='revealed';
  if(was!=='revealed'){ c.nObs+=c.n; c.nUp+=c.kUp;
    if(c.n===1){ c.hist.push(c.vals[0]); if(c.hist.length>HIST_KEEP) c.hist.shift(); } }
  return true;
}
function coinHide(sc,c){ if(c.state==='revealed'){ c.state='hidden'; return true; } return false; }
/* PhET's reveal/hide (observe/hide) button */
function coinToggle(sc,c){ if(c.state==='revealed') return coinHide(sc,c); return coinReveal(sc,c); }
function coinStep(sc,c,dt){
  if(c.state!=='preparing') return false;
  c.t+=dt;
  if(c.t>=FLIP_T){ c.t=FLIP_T; coinPrepareNow(sc,c); if(c.then==='reveal') coinReveal(sc,c); c.then=null; }
  return true;
}
/* the arrow: the prepared coins go to be measured.  Classical coins arrive
   showing the prepared face (hidden if the preference says so); quantum coins
   arrive ready, faceless (PhET's setMeasurementValuesImmediate) */
function sceneStart(sc){
  sc.preparing=false;
  for(const c of [sc.single,sc.set]){
    const v=coinFace1(sc);
    for(let i=0;i<c.n;i++) c.vals[i]=v;
    c.kUp=v*c.n; c.t=0; c.then=null; c.hist=[]; c.nObs=0; c.nUp=0;
    c.state=sc.quantum?'ready':(sc.startsHidden?'hidden':'revealed');
  }
}
function sceneNewCoin(sc){ sc.preparing=true; for(const c of [sc.single,sc.set]){ c.state='revealed'; c.t=0; c.then=null; } }
function setCoinCount(sc,N){ if(sc.preparing&&COIN_NS.indexOf(N)>=0) sc.set.n=N; }
function sceneAnimating(sc){ return !sc.preparing&&(sc.single.state==='preparing'||sc.set.state==='preparing'); }

/* ================================================================== *
 *  THE PHOTONS (PhET's Photons screen)                                *
 * ================================================================== */
/* PhET's values: model units (PhET's metres), seconds */
const PH={X0:-0.15, V:0.3, BEAM_W:0.04, PBS:0.035, MX:0.11, DV:0.2, DH:-0.09, AP:0.07, ABS:0.05,
          RATE_MAX:200, SLOW:0.4, CAP:999, AVG_T:1, AVG_S:0.5, STEP_DT:2/60, CUSTOM_STEP:5};
const PRESET_ANG={vertical:90, horizontal:0, fortyFive:45};
/* the beam splitter reflects (to the V detector) with probability sin^2(theta),
   theta measured from horizontal: Malus's law with the analyser at 0 and 90 deg */
function pV(angDeg){ const s=Math.sin(angDeg*DEG); return s*s; }
function expectP(angDeg){ return pV(angDeg)-(1-pV(angDeg)); }   /* V = +1, H = -1: -cos 2 theta */
/* the one decision every photon makes, classical (at the splitter) or quantum
   (at the detectors): one draw, u < sin^2 theta is V */
function photonDecide(R,angDeg){ return rngNext(R)<pV(angDeg)?'V':'H'; }
/* the path: along the beam at height y0 to the splitter's diagonal (x = y0),
   then up to y = 0.2 (V), or on to the mirror x + y = 0.11 and down to
   y = -0.09 (H).  Both arms are 0.2 - y0 long, so every photon arrives
   (0.2 - X0)/v = 1.1667 s after it left x = X0, whatever its height. */
function photonLegs(y0){ return {d1:y0-PH.X0, arm:PH.DV-y0, dArr:PH.DV-PH.X0}; }
function photonPos(ph,d,route){
  const y0=ph.y0, L=photonLegs(y0);
  if(d<=L.d1) return [PH.X0+d,y0];
  const e=d-L.d1;
  if(route==='V') return [y0,y0+e];
  const toMirror=PH.MX-2*y0;
  if(e<=toMirror) return [y0+e,y0];
  return [PH.MX-y0,y0-(e-toMirror)];
}
/* PhET's averaging counter: count events, sample every 0.5 s, and report the
   count over the most recent samples covering at least the averaging period */
function makeAvg(total,sample){ return {total,sample,cur:0,tsl:0,hist:[],value:0}; }
function avgCount(A){ A.cur++; }
function avgStep(A,dt){
  A.tsl+=dt;
  if(A.tsl>=A.sample){
    A.hist.push([A.tsl,A.cur]);
    let e=0,t=0,i=0;
    for(let n=A.hist.length-1;n>=0;n--){ e+=A.hist[n][0]; t+=A.hist[n][1]; i++; if(e>=A.total) break; }
    A.value=e>0?Math.round(t/e*1e12)/1e12:0;
    A.hist.splice(0,A.hist.length-i);
    A.cur=0; A.tsl=0;
  }
}
function avgReset(A){ A.cur=0; A.tsl=0; A.hist=[]; A.value=0; }
function makePhotonScene(mode,seed){
  return {mode, R:rngMake(seed), seed, t:0, photons:[], nV:0, nH:0, acc:0,
          avgV:makeAvg(PH.AVG_T,PH.AVG_S), avgH:makeAvg(PH.AVG_T,PH.AVG_S), lastFrame:null};
}
function photonAngle(st){ return st.phPreset==='custom'?st.phCustom:(st.phPreset==='unpolarized'?null:PRESET_ANG[st.phPreset]); }
/* one photon from the laser (PhET's emitAPhoton): a height across the 0.04
   beam, a start up to one frame's travel ahead, an angle (random for the
   unpolarized source) */
function photonEmit(sc,st,dtFrame){
  const y0=PH.BEAM_W/2*(1-2*rngNext(sc.R));
  const ahead=(dtFrame||0)*rngNext(sc.R)*PH.V;
  const a0=photonAngle(st);
  const ang=a0===null?360*rngNext(sc.R):a0;
  sc.photons.push({t0:sc.t-ahead/PH.V, y0, ang, route:null});
}
function photonClear(sc){ sc.photons=[]; }
function photonCounts(sc){ sc.nV=0; sc.nH=0; avgReset(sc.avgV); avgReset(sc.avgH); }
/* advance the scene by dt: emit (many-photon mode, PhET's fractional
   accumulator), decide at the splitter (classical) or at the detectors
   (quantum), count, and retire photons 0.05 past the detector line */
function photonAdvance(sc,st,dt){
  if(!(dt>0)) return;
  if(sc.mode==='many'){
    const n=st.phRate*dt, nf=Math.floor(n);
    for(let i=0;i<nf;i++) photonEmit(sc,st,dt);
    sc.acc+=n-nf;
    while(sc.acc>=1){ photonEmit(sc,st,dt); sc.acc-=1; }
  }
  sc.t+=dt;
  const keep=[];
  for(const ph of sc.photons){
    const d=PH.V*(sc.t-ph.t0), L=photonLegs(ph.y0);
    if(st.phBehavior==='classical'&&ph.route===null&&d>=L.d1) ph.route=photonDecide(sc.R,ph.ang);
    if(d>=L.dArr&&!ph.counted){
      if(ph.route===null) ph.route=photonDecide(sc.R,ph.ang);      /* quantum: the collapse, at the detector */
      ph.counted=true;
      if(ph.route==='V'){ sc.nV=Math.min(sc.nV+1,PH.CAP); avgCount(sc.avgV); } else { sc.nH=Math.min(sc.nH+1,PH.CAP); avgCount(sc.avgH); }
    }
    if(d<L.dArr+PH.ABS) keep.push(ph);
  }
  sc.photons=keep;
  avgStep(sc.avgV,dt); avgStep(sc.avgH,dt);
}
/* a seeded batch through photonDecide: the V count of n photons */
function photonBatch(seed,angDeg,n){ const R=rngMake(seed); let v=0; for(let i=0;i<n;i++) if(photonDecide(R,angDeg)==='V') v++; return v; }
function photonBatchUnpol(seed,n){ const R=rngMake(seed); let v=0; for(let i=0;i<n;i++){ const a=360*rngNext(R); if(photonDecide(R,a)==='V') v++; } return v; }

/* ================================================================== *
 *  THE SPINS (PhET's Spin screen: Stern-Gerlach)                      *
 * ================================================================== */
const AXV={z:[0,0,1], x:[1,0,0]};
/* PhET's six experiments and its custom layout: magnet 1, then the magnet on
   magnet 1's UP beam, then the one on its DOWN beam (PhET's value) */
const SG_EXPS=[{id:'e1',name:'1 [SGz]',axes:['z']},{id:'e2',name:'2 [SGx]',axes:['x']},
               {id:'e3',name:'3 [SGz, SGx]',axes:['z','x','x']},{id:'e4',name:'4 [SGz, SGz]',axes:['z','z','z']},
               {id:'e5',name:'5 [SGx, SGz]',axes:['x','z','z']},{id:'e6',name:'6 [SGx, SGx]',axes:['x','x','x']},
               {id:'custom',name:'custom',axes:['x','z','z']}];
const SG_RATE=300;              /* particles a second per unit amount: PhET's 5 x amount per 60-Hz frame */
const SG_MAXP=1250, SG_MAXP1=50;/* PhET's caps on particles in flight (continuous, single) */
const SG_AVG_T=3;               /* the magnets' counters average over 3 s in 0.5-s samples (PhET's value) */
const SG_SPEED=1.5;             /* apparatus units per second (the remake's layout) */
/* the custom source state, EXACTLY: theta = 2 arccos|alpha| so that
   P(up_z) = cos^2(theta/2) = |alpha|^2.  (PhET uses theta = pi(1 - |alpha|^2).) */
function customTheta(a2){ return 2*Math.acos(Math.sqrt(clamp(a2,0,1))); }
function phetCustomTheta(a2){ return Math.PI*(1-a2); }
const SG_SOURCES={'+Z':[0,0,1],'+X':[1,0,0],'-Z':[0,0,-1]};
function sgSource(st){ if(st.sgExp==='custom'){ const t=customTheta(st.sgA2); return [Math.sin(t),0,Math.cos(t)]; } return SG_SOURCES[st.sgSrc].slice(); }
function sgAxes(st){
  const e=SG_EXPS.find(x=>x.id===st.sgExp);
  if(e.id==='custom') return [st.sgC1,st.sgC2,st.sgC2];
  return e.axes.slice();
}
/* one particle through the apparatus: PhET's measureParticle at each magnet */
function sgRun(R,r0,axes){
  const m1=measureAlong(R,r0,AXV[axes[0]]);
  if(axes.length===1) return {up1:m1.up, r1:m1.r, up2:null, r2:null};
  const n2=m1.up?AXV[axes[1]]:AXV[axes[2]];
  const m2=measureAlong(R,m1.r,n2);
  return {up1:m1.up, r1:m1.r, up2:m2.up, r2:m2.r};
}
/* products of projections: [P(up,up), P(up,down), P(down,up), P(down,down)] */
function sgProbs(r0,axes){
  const n1=AXV[axes[0]], p1=bornP(r0,n1);
  if(axes.length===1) return [p1,1-p1];
  const pu=bornP(n1,AXV[axes[1]]), pd=bornP([-n1[0],-n1[1],-n1[2]],AXV[axes[2]]);
  return [p1*pu,p1*(1-pu),(1-p1)*pd,(1-p1)*(1-pd)];
}
function sgBatch(seed,r0,axes,n){
  const R=rngMake(seed), c=[0,0,0,0];
  for(let i=0;i<n;i++){ const o=sgRun(R,r0,axes); if(axes.length===1) c[o.up1?0:1]++; else c[(o.up1?0:2)+(o.up2?0:1)]++; }
  return c;
}
/* the apparatus layout (the remake's): source exit at x = 0, magnet 1 from 1
   to 2 (the particle is measured at its middle and bends to an exit), the
   second stage from 3 to 4 at y = +-0.62, the counters at x = 5 */
const SGL={S1:[1,2], S2:[3,4], Y2:0.62, EXIT:0.16, END:5.05};
function sgWaypoints(p){
  const pts=[[0,p.jy]], y=p.jy;
  pts.push([1.5,y]);
  if(p.up1===null) return pts;
  const s1=p.up1?1:-1;
  pts.push([2,s1*SGL.EXIT+y*0.5]);
  if(!p.two){ pts.push([SGL.END,s1*SGL.Y2]); return pts; }
  pts.push([3,s1*SGL.Y2+y*0.5]); pts.push([3.5,s1*SGL.Y2+y*0.5]);
  if(p.up2===null) return pts;
  const s2=p.up2?1:-1;
  pts.push([4,s1*SGL.Y2+s2*SGL.EXIT]); pts.push([SGL.END,s1*SGL.Y2+s2*SGL.EXIT*2.2]);
  return pts;
}
function polyAt(pts,d){
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(d<=L||i===pts.length-1){ const f=L>0?Math.min(1,Math.max(0,d/L)):0; return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]; }
    d-=L;
  }
  return pts[pts.length-1].slice();
}
function polyLen(pts){ let s=0; for(let i=1;i<pts.length;i++) s+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); return s; }
function makeSgScene(seed){
  return {R:rngMake(seed), seed, t:0, parts:[], acc:0, last:null,
          c:[{up:makeAvg(SG_AVG_T,0.5),dn:makeAvg(SG_AVG_T,0.5),nU:0,nD:0},
             {up:makeAvg(SG_AVG_T,0.5),dn:makeAvg(SG_AVG_T,0.5),nU:0,nD:0},
             {up:makeAvg(SG_AVG_T,0.5),dn:makeAvg(SG_AVG_T,0.5),nU:0,nD:0}]};
}
function sgResetCounts(sc){ for(const c of sc.c){ avgReset(c.up); avgReset(c.dn); c.nU=0; c.nD=0; } }
function sgClear(sc){ sc.parts=[]; sc.last=null; }
function sgBlock(st){ return (st.sgMode==='continuous'&&sgAxes(st).length>1)?st.sgBlock:'none'; }
function sgShoot(sc,st){
  const two=sgAxes(st).length>1, cap=st.sgMode==='single'?SG_MAXP1:SG_MAXP;
  if(sc.parts.length>=cap) return false;
  const p={t0:sc.t, r0:sgSource(st), jy:0.05*(2*rngNext(sc.R)-1), up1:null, up2:null, r1:null, r2:null, two, dead:false};
  sc.parts.push(p); if(st.sgMode==='single') sc.last=p;
  return true;
}
/* advance: measure at each magnet's middle, stop blocked particles at the
   blocker on magnet 1's exit, count, and retire particles at the end of their
   path (a single particle rests there 1.5 s so it can be read) */
const SG_BLOCK_D=2.35;          /* path length at which the blocker catches a particle (x = 2.30) */
function sgCount(sc,k,up){ if(up){ sc.c[k].nU++; avgCount(sc.c[k].up); } else { sc.c[k].nD++; avgCount(sc.c[k].dn); } }
function sgAdvance(sc,st,dt){
  if(!(dt>0)) return;
  const axes=sgAxes(st), block=sgBlock(st), hold=st.sgMode==='single'?1.5:0.05;
  if(st.sgMode==='continuous'){
    const n=SG_RATE*st.sgAmount*dt, nf=Math.floor(n);
    for(let i=0;i<nf;i++) sgShoot(sc,st);
    sc.acc+=n-nf; while(sc.acc>=1){ sgShoot(sc,st); sc.acc-=1; }
  }
  sc.t+=dt;
  const keep=[];
  for(const p of sc.parts){
    const d=SG_SPEED*(sc.t-p.t0);
    if(p.up1===null&&d>=1.5){ const m=measureAlong(sc.R,p.r0,AXV[axes[0]]); p.up1=m.up; p.r1=m.r; sgCount(sc,0,m.up); }
    if(p.up1!==null&&block!=='none'&&(block==='up')===p.up1&&d>=SG_BLOCK_D) p.dead=true;
    if(p.two&&!p.dead&&p.up1!==null&&p.up2===null&&d>=polyLen(sgWaypoints(p))){
      const k=p.up1?1:2, m=measureAlong(sc.R,p.r1,AXV[axes[k]]); p.up2=m.up; p.r2=m.r; sgCount(sc,k,m.up); }
    const done=p.up1!==null&&(!p.two||p.up2!==null)&&d>=polyLen(sgWaypoints(p))+hold;
    if(!p.dead&&!done) keep.push(p);
  }
  sc.parts=keep;
  for(const c of sc.c){ avgStep(c.up,dt); avgStep(c.dn,dt); }
}

/* ================================================================== *
 *  THE BLOCH SPHERE (PhET's Bloch Sphere screen)                      *
 * ================================================================== */
const BL={STEP:Math.PI/12, DELAY:0.75, DELAY_MAX:1, NS_PER_S:0.25, ATOMS:10};   /* PhET's values */
/* The field: PhET's strength s in [-1, 1] turns the state once per ns at
   |s| = 1.  The remake makes it an electron in B = s B0 along +z:
   f = (gamma_e/2pi) B, and B0 is the field that gives 1 GHz.  CODATA 2022
   gamma_e/2pi = 28 024.951 3861 MHz/T (bloch_sphere.html; = |g_e| mu_B/h). */
const GAMMA_E_MHZ_T=28024.9513861, G_E=-2.00231930436092, MUB_HZ_T=13996244917.1;
const B0_T=1e3/GAMMA_E_MHZ_T;   /* tesla: 1000 MHz / (MHz/T) */
/* the azimuth advances by w t with w = 2 pi s per ns: counterclockwise about
   +z for s > 0, the electron's sense (and PhET's).  EXACT: a rotation of the
   prepared vector, never an integrated one */
function larmorAngle(s,tauNs){ return 2*Math.PI*s*tauNs; }
function precess(r0,s,tauNs){ return rotate3(r0,[0,0,1],larmorAngle(s,tauNs)); }
/* the same thing on the ket: U = exp(-i w t sigma_z / 2) */
function precessU(s,tauNs){ return unitary([0,0,1],larmorAngle(s,tauNs)); }
const BL_PRESETS={'+X':[Math.PI/2,0],'-X':[Math.PI/2,Math.PI],'+Y':[Math.PI/2,Math.PI/2],'-Y':[Math.PI/2,3*Math.PI/2],
                  '+Z':[0,0],'-Z':[Math.PI,0]};
function makeBlochScene(seed){ return {R:rngMake(seed), seed, phase:'prepared', tau:0, r:[], up:0, dn:0, lastUp:null}; }
function blochPrep(st){ return blochOfAngles(st.bTheta,st.bPhi); }
function blochNAtoms(st){ return st.bAtoms===10?10:1; }
function blochReprepare(sc,st){ const r0=blochPrep(st); sc.r=[]; for(let i=0;i<BL.ATOMS;i++) sc.r.push(r0.slice()); sc.tau=0; sc.phase='prepared'; sc.lastUp=null; }
function blochResetCounts(sc){ sc.up=0; sc.dn=0; }
function blochObserve(sc,st){
  const n=BASIS[st.bAxis].n, na=blochNAtoms(st);
  let u=0;
  for(let i=0;i<na;i++){ const m=measureAlong(sc.R,sc.r[i],n); sc.r[i]=m.r; if(m.up) u++; }
  sc.up+=u; sc.dn+=na-u; sc.lastUp=u; sc.phase='observed';
}
/* PhET's single button: Observe (no field) or Start (field on), then Reprepare */
function blochButton(sc,st){
  if(sc.phase==='observed'){ blochReprepare(sc,st); return 'reprepared'; }
  if(sc.phase==='timing') return 'busy';
  if(st.bField){ sc.phase='timing'; sc.tau=0; return 'timing'; }
  blochObserve(sc,st); return 'observed';
}

/* ================================================================== *
 *  the Bloch sphere in 3-D: z-up orbit camera and a wireframe sphere, *
 *  adapted from bloch_sphere.html (its camera, drawSphere, drawVec,   *
 *  drawPath3, dot3); the grid is batched into two strokes, near/far   *
 * ================================================================== */
const CAM_HOME={theta:0.6, phi:0.35};      /* x toward the viewer, y right, z up: all three axes >= 0.6 of full length (asserted) */
const CAM_DIST=5.2;
function camBasis3(theta,phi){
  const ct=Math.cos(theta), stt=Math.sin(theta), cp=Math.cos(phi), sp=Math.sin(phi);
  const dir=[ct*cp,stt*cp,sp], fwd=[-dir[0],-dir[1],-dir[2]];
  let right=[fwd[1]*1-fwd[2]*0, fwd[2]*0-fwd[0]*1, 0];            /* fwd x z */
  const rl=Math.hypot(right[0],right[1],right[2])||1; right=[right[0]/rl,right[1]/rl,right[2]/rl];
  const up=[right[1]*fwd[2]-right[2]*fwd[1], right[2]*fwd[0]-right[0]*fwd[2], right[0]*fwd[1]-right[1]*fwd[0]];
  return {dir,fwd,right,up};
}
/* perspective from CAM_DIST: the sphere's centre plane maps to radius pixR */
function sphereProj(cam,cx,cy,pixR){
  const B=camBasis3(cam.theta,cam.phi), k=pixR*CAM_DIST;
  const P=p=>{ const z=dot3v(p,B.fwd)+CAM_DIST; if(z<=0.05) return null;
    return [cx+k*dot3v(p,B.right)/z, cy-k*dot3v(p,B.up)/z, z]; };
  return {P, B, cx, cy, pixR, depth:p=>dot3v(p,B.fwd)};
}
/* the projected length of a unit vector: how much of it the camera sees */
function projLen(cam,v){ const B=camBasis3(cam.theta,cam.phi); const d=dot3v(v,B.dir); return Math.sqrt(Math.max(0,1-d*d)); }
function drawSphere(ctx,S3,o){
  o=o||{};

  ctx.beginPath(); ctx.arc(cx,cy,R*CAM_DIST/Math.sqrt(CAM_DIST*CAM_DIST-1),0,TAU);
  ctx.fillStyle='rgba(20,26,40,0.55)'; ctx.fill(); ctx.strokeStyle='#2b3346'; ctx.lineWidth=1.2; ctx.stroke();
  /* latitude and longitude circles, split into the half behind the centre
     plane (dim) and the half in front (brighter): two strokes in all */
  const NL=o.grid===false?0:40, far=[], near=[];
  const addCircle=(fn)=>{
    let prev=null, pf=null;
    for(let i=0;i<=NL;i++){ const p=fn(i/NL), q=S3.P(p); if(!q){ prev=null; continue; }
      const isFar=S3.depth(p)>0;
      if(prev&&pf===isFar) (isFar?far:near).push(prev[0],prev[1],q[0],q[1]);
      prev=q; pf=isFar; }
  };

    for(let k=1;k<=5;k++){ const th=Math.PI*k/6, s=Math.sin(th), c=Math.cos(th); addCircle(u=>[s*Math.cos(TAU*u),s*Math.sin(TAU*u),c]); }

  } else {
    /* no grid: the equator only, so a small sphere still reads as 3-D */
    const ne=40; let prev=null, pf=null;
    for(let i=0;i<=ne;i++){ const p=[Math.cos(TAU*i/ne),Math.sin(TAU*i/ne),0], q=S3.P(p); const isFar=S3.depth(p)>0;
      if(prev&&pf===isFar) (isFar?far:near).push(prev[0],prev[1],q[0],q[1]); prev=q; pf=isFar; }
  }
  for(const [arr,col] of [[far,'#1d2330'],[near,'#39435b']]){
    if(!arr.length) continue;
    ctx.beginPath(); for(let i=0;i<arr.length;i+=4){ ctx.moveTo(arr[i],arr[i+1]); ctx.lineTo(arr[i+2],arr[i+3]); }

  ctx.strokeStyle='#3d465e'; ctx.lineWidth=1.1; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
  if(R>44&&o.labels!==false){
    ctx.font='italic 12px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=COL.dim;
    for(const [a,n] of [[[1,0,0],'x'],[[0,1,0],'y'],[[0,0,1],'z']]){ const t=S3.P([1.42*a[0],1.42*a[1],1.42*a[2]]); if(t){ ctx.fillText(n,t[0],t[1]); LABELS.push([t[0]-5,t[1]-8,t[0]+5,t[1]+8]); } }
  }
}

function coinsModel(sc){

  const wB=narrow?Math.max(150,span*0.30):Math.max(220,Math.min(300,span*0.30));

  const lowTop=top+upH+44, lowH=fit.capY-16-lowTop-20;

function photonsModel(st){
  const ps=PHOT[st.phMode], ang=photonAngle(st);
  const m={ps, mode:st.phMode, ang, unpol:ang===null};
  m.pv=ang===null?0.5:pV(ang); m.ph=1-m.pv;
  m.expect=ang===null?0:expectP(ang);            /* the unpolarized mixture's is 0 */

  else { m.NV=ps.avgV.value; m.NH=ps.avgH.value; }
  m.N=m.NV+m.NH;
  m.fracV=m.N>0?m.NV/m.N:NaN;
  m.avgPol=m.N>0?(m.NV-m.NH)/m.N:NaN;
  /* the spread of the mean of N +-1 outcomes: sqrt((1 - <P>^2)/N) (counts only) */
  m.avgSd=st.phMode==='single'&&m.N>0?Math.sqrt(Math.max(0,1-m.expect*m.expect)/m.N):NaN;

const SG_EXT={xmin:-1.05,xmax:5.55,ymin:-1.12,ymax:1.12};
function axisName(a){ return a==='z'?'z':'x'; }
function spinsModel(st){
  const sc=SGS, axes=sgAxes(st), r0=sgSource(st), two=axes.length>1, block=sgBlock(st);
  const m={sc, axes, r0, two, block, probs:sgProbs(r0,axes)};
  m.p1=bornP(r0,AXV[axes[0]]);
  m.p2=two?bornP(AXV[axes[0]],AXV[axes[1]]):NaN;
  m.p3=two?bornP(AXV[axes[0]].map(v=>-v),AXV[axes[2]]):NaN;
  m.theta=Math.atan2(r0[0],r0[2]);             /* polar angle in the x-z plane */
  m.alpha=Math.sqrt(bornP(r0,[0,0,1])); m.beta=Math.sqrt(1-m.alpha*m.alpha);
  m.phetP=st.sgExp==='custom'?(1+Math.cos(phetCustomTheta(st.sgA2)))/2:NaN;
  /* the per-magnet tallies: counts (single) or averaged rates (continuous) */
  const cont=st.sgMode==='continuous';
  m.tal=sc.c.map(c=>{ const u=cont?c.up.value:c.nU, d=cont?c.dn.value:c.nD, n=u+d; return {u,d,n,f:n>0?u/n:NaN}; });
  m.last=sc.last; m.inFlight=sc.parts.length;
  return m;
}
function spinsGeo(ctx,W,H,Cap){
  const narrow=isNarrow(W), top=stageTop()+30, left=narrow?18:56;
  const rightTop=narrow?W-18:W-RO_W-44;
  const fit=capLayout(ctx,W,H,Cap.full,Cap.short,left,narrow?W-18:W-26,top+300);
  const avail=fit.capY-16-top;
  const upH=Math.max(140,Math.min(narrow?230:345,avail*0.58));
  const app=box(left,top,rightTop-left,upH);
  const map=worldFitUp(app,SG_EXT,0);
  const lowTop=top+upH+40, lowH=fit.capY-16-lowTop-20;           /* no floor: the row is skipped when it does not fit */
  const discR=Math.max(20,Math.min(64,(lowH-34)*0.42));
  const disc={cx:left+discR+22, cy:lowTop+20+discR, r:discR, show:lowH>=70};
  const hx0=disc.cx+discR+(narrow?64:84), hw=narrow?Math.max(90,(W-18-hx0)/2-24):150;
  const h1=box(hx0,lowTop+14,hw,lowH-44), h2=box(h1.x1+(narrow?30:56),lowTop+14,hw,lowH-44);
  const tbl=narrow?null:box(h2.x1+56,lowTop,Math.max(0,(W-26)-(h2.x1+56)),lowH);
  return {narrow,top,left,fit,app,map,disc,h1,h2,tbl:tbl&&tbl.w>=200?tbl:null};
}

}

function degs(x){ return fmt(x/DEG,0)+'°'; }
function blochModel(st,cam){
  const sc=BLO, r0=blochPrep(st), k0=ketOf(st.bTheta,st.bPhi), n=BASIS[st.bAxis].n;
  const s=st.bField?st.bStrength:0;
  const m={sc, r0, k0, n, s, field:st.bField, phase:sc.phase, tau:sc.tau, na:blochNAtoms(st)};
  m.fGHz=Math.abs(s);                                   /* f = |s| x 1 GHz: B0 turns the electron once a ns */
  m.BmT=s*B0_T*1e3;
  m.period=m.fGHz>0?1/m.fGHz:Infinity;                  /* ns */
  m.turnAtMeasure=st.bField?larmorAngle(s,st.bDelay):0; /* rad */
  m.rMeasure=st.bField?precess(r0,s,st.bDelay):r0;
  m.pUp=bornP(m.rMeasure,n);
  m.nObs=sc.up+sc.dn; m.frac=m.nObs>0?sc.up/m.nObs:NaN; m.fracSd=m.nObs>0?Math.sqrt(m.pUp*(1-m.pUp)/m.nObs):NaN;
  /* the single atom's ket now: prepared, turning, or collapsed */
  if(sc.phase==='observed'){ const up=dot3v(sc.r[0],n)>0; m.kNow=up?BASIS[st.bAxis].up.slice():BASIS[st.bAxis].dn.slice(); }
  else m.kNow=mApply(precessU(s,sc.phase==='timing'?sc.tau:0),k0);
  m.eqPrep=ketInBasis(k0,st.bBasis); m.eqNow=ketInBasis(m.kNow,st.bBasis);
  m.rNow=sc.r.map(v=>v.slice());
  /* the fringe: P(up along n) against the delay, for the strength on the slider
     (the field's own curve when it is on; what it WOULD do when it is off) */
  m.fringe=[]; for(let i=0;i<=200;i++){ const t=BL.DELAY_MAX*i/200; m.fringe.push([t,bornP(precess(r0,st.bStrength,t),n)]); }
  m.pFlat=bornP(r0,n);
  m.cam=cam||CAM_HOME;
  return m;
}
function blochGeo(ctx,W,H,Cap,na){
  const narrow=isNarrow(W), top=stageTop()+30, left=narrow?18:56;
  const rightTop=narrow?W-18:W-RO_W-44;
  const fit=capLayout(ctx,W,H,Cap.full,Cap.short,left,narrow?W-18:W-26,top+300);
  const avail=fit.capY-16-top;
  const upH=Math.max(150,Math.min(narrow?250:430,avail*0.62));
  /* the sphere and everything round it: the titles sit above the axis names
     (1.42 R), the stage line below the sphere, so R follows the height */
  const R=Math.max(36,Math.min(narrow?78:118,(upH-62)/2.6,(rightTop-left)*0.14));
  const prep={cx:left+R*1.45+6,cy:top+24+1.5*R,R};
  const meas={cx:prep.cx+R*2.9+(narrow?10:40),cy:prep.cy,R};
  const colX=meas.cx+R*1.55+(narrow?14:34);
  const hist=box(colX+22,top+22,Math.max(90,rightTop-colX-22),Math.max(70,upH*0.46));
  const timer=box(colX+22,hist.y1+52,Math.max(90,rightTop-colX-22),14);
  const lowTop=top+upH+34, eqs={x:left,y:lowTop,w:(narrow?W-18:W-26)-left,h:fit.capY-12-lowTop};
  /* the fringe panel, right of the equations (wide canvases only) */
  const fx=left+560, fringe=narrow?null:box(fx,lowTop+14,Math.min(560,(W-26)-fx),fit.capY-16-(lowTop+14)-34);
  /* ten atoms: PhET's rows of 3, 2, 3, 2 */

  const rows=[3,2,3,2], dy=smallR*2.55, dx=smallR*2.55;
  rows.forEach((n,ri)=>{ for(let i=0;i<n;i++) ten.push({cx:meas.cx+(i-(n-1)/2)*dx*1.05,cy:meas.cy+(ri-1.5)*dy,R:smallR}); });

  if(E.a>1e-9) r.push([fmt(E.a,2)+'|↑',null],[bx,'sub'],['⟩',null]);
  if(E.a>1e-9&&E.c>1e-9) r.push([' + ',null]);

function bornChi2(pts,shots){

const SPREAD_NS=[10,100,1000,10000], SPREAD_M=200;

/* the histogram window: +-5 sd around Np, binned to at most ~40 bars */
function binWindow(N,p){
  const sd=binomSD(N,p), mu=N*p;

  if(sd===0){ lo=Math.max(0,mu-2); hi=Math.min(N,mu+2); }
  const w=Math.max(1,Math.ceil((hi-lo+1)/40));
  return {lo,hi,w,nb:Math.ceil((hi-lo+1)/w)};

function binSpread(p,seed){
  return memo('binSpread',p+':'+seed,()=>SPREAD_NS.map((N,i)=>{ const r=repeatsRun(seed+1000+i,N,p,Math.min(SPREAD_M,Math.floor(1e6/N)));

function binRun(p,seed){

  m.outside=0; for(let k=0;k<=N;k++) if(k<W.lo||k>W.hi) m.outside+=r.obs[k];

function binomGeo(ctx,W,H,Cap){
  const narrow=isNarrow(W), top=stageTop()+30, left=narrow?48:66;
  const rightTop=narrow?W-18:W-RO_W-44;
  const fit=capLayout(ctx,W,H,Cap.full,Cap.short,left,narrow?W-18:W-26,top+300);
  const avail=fit.capY-16-top;
  const upH=Math.max(140,Math.min(narrow?220:330,avail*0.56));
  const wA=narrow?(rightTop-left)*0.56:Math.min(520,(rightTop-left)*0.55);
  const A=box(left,top+12,wA,upH-40);
  const B=box(A.x1+(narrow?50:76),top+12,Math.max(100,rightTop-(A.x1+(narrow?50:76))),upH-40);
  /* no floor: the long-run panel is skipped when it does not fit */
  const lowTop=top+upH+30, C=box(left,lowTop,Math.min(narrow?W-18-left:760,(narrow?W-18:W-26)-left),fit.capY-16-lowTop-26);
  return {narrow,top,left,fit,A,B,C};

function drawBinom(ctx,W,H,M){
  const m=M.N, LY=binomLayout(ctx,W,H,M), Cap=LY.Cap, G=LY.G, A=G.A, B=G.B, C=G.C, Wn=m.win;
  /* the histogram against the pmf */
  let ymax=0; for(let i=0;i<Wn.nb;i++) ymax=Math.max(ymax,m.hObs[i],m.hPmf[i]); ymax=ymax>0?ymax*1.18:1;
  const xlo=Wn.lo-0.5, xhi=Wn.lo+Wn.nb*Wn.w-0.5;
  /* k is a count: integer ticks only, never a label on the corner at a half */
  const kt=ticksFor(Wn.lo,Wn.lo+Wn.nb*Wn.w-1,A.w<300?4:6).filter(v=>Math.abs(v-Math.round(v))<1e-9);
  axesT(ctx,A,xlo,xhi,0,ymax,{xticks:kt,xfmt:v=>String(Math.round(v)),yticks:ticksFor(0,ymax,A.h<120?2:4),xlab:'k, the number of '+(M.coinWordUp||'heads')+' in a set of '+fmtN(m.N),
    title:fitTitle(A,m.M+' sets of '+fmtN(m.N)+': counted, against the binomial','sets against the binomial')});
  const bw=A.w/Wn.nb;
  ctx.beginPath(); for(let i=0;i<Wn.nb;i++){ const h=m.hObs[i]; if(h>0){ const X=A.x+i*bw, Y=py(A,h,0,ymax); ctx.rect(X+bw*0.12,Y,bw*0.76,A.y1-Y); } }
  ctx.fillStyle=shade(COL.pos,0.8); ctx.fill();
  const cx=[], cy=[]; for(let i=0;i<Wn.nb;i++){ cx.push(Wn.lo+(i+0.5)*Wn.w-0.5); cy.push(m.hPmf[i]); }
  polyline(ctx,A,cx,cy,xlo,xhi,0,ymax,COL.ref,2);
  for(let i=0;i<Wn.nb;i++) mark(ctx,px(A,cx[i],xlo,xhi),py(A,cy[i],0,ymax),'o',COL.ref,2.4);
  vCursor(ctx,A,m.mu,xlo,xhi,COL.ref);
  legendAuto(ctx,A,[[COL.pos,'the sets, counted'],[COL.ref,'the exact binomial']]);
  if(m.outside>0) lab(ctx,W,H,A.x+4,A.y+10,m.outside+' sets fell outside ±5σ',COL.ref,SM_FONT,'left','middle');
  /* the spread law, log-log */
  const sp=m.spread, deg=m.p<=0||m.p>=1;
  if(deg){ frame(ctx,B,COL.edge); lab(ctx,W,H,B.x+B.w/2,B.y+B.h/2,'p = '+fmt(m.p,2)+': every set is the same, the spread is exactly 0',COL.dim,SM_FONT,'center','middle'); }
  else {
    const lo=Math.log10(Math.sqrt(m.p*(1-m.p)/10000))-0.4, hi=Math.log10(Math.sqrt(m.p*(1-m.p)/10))+0.35;
    axesT(ctx,B,1,4,lo,hi,{xticks:[1,2,3,4],xfmt:v=>'10'+['','¹','²','³','⁴'][v],yticks:ticksFor(Math.ceil(lo),Math.floor(hi),3).filter(v=>Math.abs(v-Math.round(v))<1e-9),yfmt:v=>'10'+(v<0?'⁻':'')+['⁰','¹','²','³','⁴','⁵'][Math.abs(Math.round(v))],
      xlab:'N (log)',title:fitTitle(B,'the spread of k/N: √(p(1−p)/N), slope −½','the spread, log–log')});
    polyline(ctx,B,[1,4],[Math.log10(Math.sqrt(m.p*(1-m.p)/10)),Math.log10(Math.sqrt(m.p*(1-m.p)/10000))],1,4,lo,hi,COL.ref,2);
    for(const s of sp) if(s.sd>0) mark(ctx,px(B,Math.log10(s.N),1,4),clamp(py(B,Math.log10(s.sd),lo,hi),B.y,B.y1),'o',COL.pos,4);
    lab(ctx,W,H,B.x+6,B.y1-12,'log–log',COL.faint,SM_FONT,'left','middle');
  }
  /* one long run */
  if(!G.panelOff&&C.h>=55){
    const n0=Math.log10(1), n1=Math.log10(RUN_LEN);
    axesT(ctx,C,n0,n1,0,1,{xticks:[0,1,2,3,4],xfmt:v=>['1','10','100','1000','10⁴'][v],yticks:C.h<100?[0,0.5,1]:[0,0.25,0.5,0.75,1],xlab:C.h>=95?'flips so far, n (log)':'',
      title:fitTitle(C,'one coin flipped '+fmtN(RUN_LEN)+' times: the running fraction, inside p ± 2√(p(1−p)/n)','one long run')});
    const xs=[], ys=[], fu=[], fd=[], fp=[];
    for(let i=0;i<RUN_LEN;i=i<100?i+1:Math.ceil(i*1.02)){ const n=i+1, sd=Math.sqrt(m.p*(1-m.p)/n); xs.push(Math.log10(n)); ys.push(m.run[i]); fu.push(m.p+2*sd); fd.push(m.p-2*sd); fp.push(m.p); }
    xs.push(n1); ys.push(m.run[RUN_LEN-1]); const sdE=Math.sqrt(m.p*(1-m.p)/RUN_LEN); fu.push(m.p+2*sdE); fd.push(m.p-2*sdE); fp.push(m.p);
    polyline(ctx,C,xs,fu,n0,n1,0,1,COL.ref,1.2,[5,4]); polyline(ctx,C,xs,fd,n0,n1,0,1,COL.ref,1.2,[5,4]); polyline(ctx,C,xs,fp,n0,n1,0,1,COL.ref,1.4);
    polyline(ctx,C,xs,ys,n0,n1,0,1,COL.pos,1.8);
    legendAuto(ctx,C,[[COL.pos,'the running fraction k/n'],[COL.ref,'p, and p ± 2σ (dashed)']]);
  }
  drawCap(ctx,G.left,G.fit);

}

function drawView(ctx,W,H,M){
  LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  const f={coins:drawCoins,photons:drawPhotons,spins:drawSpins,bloch:drawBloch,born:drawBorn,binom:drawBinom}[M.view];
  return f(ctx,W,H,M);
}
/* the geometry of the current view, for hit tests (the SAME functions the
   drawing uses, so a click lands where the picture is) */
function viewGeo(ctx,W,H,M){
  if(M.view==='coins') return coinsLayout(ctx,W,H,M).G;
  if(M.view==='photons') return photonsGeo(ctx,W,H,photonsCaption(M));
  if(M.view==='spins') return spinsGeo(ctx,W,H,spinsCaption(M));
  if(M.view==='bloch') return blochLayout(ctx,W,H,M).G;
  if(M.view==='born') return bornLayout(ctx,W,H,M).G;
  return binomLayout(ctx,W,H,M).G;
}
function inBox(x,y,b,pad){ pad=pad||0; return x>=b.x-pad&&x<=b.x1+pad&&y>=b.y-pad&&y<=b.y1+pad; }
function dialAngle(D,x,y){ const a=Math.atan2(D.cy-y,Math.abs(x-D.cx))/DEG; return clamp(Math.round(Math.abs(a)/PH.CUSTOM_STEP)*PH.CUSTOM_STEP,0,90); }
function discA2(D,x,y){ const th=Math.atan2(Math.abs(x-D.cx),D.cy-y); return snapBias(Math.pow(Math.cos(th/2),2)); }
function orbit(dx,dy){ CAM.theta-=dx*0.008; CAM.phi=clamp(CAM.phi+dy*0.008,-1.45,1.45); }
function resetCam(){ CAM.theta=CAM_HOME.theta; CAM.phi=CAM_HOME.phi; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); return drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame of dtWall seconds; true when something on the current view moved */
  S.step=function(dtWall){
    const dt=Math.max(0,dtWall||0); if(!(dt>0)) return false;
    T_NOW+=dt;
    const v=ST.view;
    if(v==='coins'){ const sc=COINS[ST.coinScene]; const a=coinStep(sc,sc.single,dt), b=coinStep(sc,sc.set,dt); return a||b; }
    if(!ST.running) return false;
    if(v==='photons'){ const ps=PHOT[ST.phMode], had=ps.photons.length>0; photonAdvance(ps,ST,dt*simFactor(ST)); return had||ps.photons.length>0||ST.phMode==='many'; }
    if(v==='spins'){ const had=SGS.parts.length>0; sgAdvance(SGS,ST,dt); return had||SGS.parts.length>0||ST.sgMode==='continuous'; }
    if(v==='bloch') return blochAdvance(BLO,ST,dt);
    return false;
  };
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const ctx=canvas.getContext('2d'), M=buildModel(), G=viewGeo(ctx,S.W,S.H,M), v=ST.view;
    if(v==='coins'){
      if(type!=='down') return false;
      const sc=COINS[ST.coinScene]; if(sc.preparing) return false;
      if(inBox(x,y,G.B)) return coinToggle(sc,sc.single);
      if(inBox(x,y,G.C)) return coinToggle(sc,sc.set);
      return false;
    }
    if(v==='photons'){
      const D=G.dial, map=G.map;
      if(type==='down'){
        if(Math.hypot(x-D.cx,y-D.cy)<=D.r+10){ DRAG.what='dial'; ST.phPreset='custom'; ST.phCustom=dialAngle(D,x,y); photonAfterAngle(); return true; }
        if(ST.phMode==='single'&&x>=map.X(-0.21)&&x<=map.X(-0.145)&&y>=map.Y(0.03)&&y<=map.Y(-0.03)){ photonEmit(PHOT.single,ST,0); ST.running=true; return true; }
        return false;
      }
      if(type==='move'&&DRAG.what==='dial'){ const a=dialAngle(D,x,y); if(a!==ST.phCustom){ ST.phCustom=a; photonAfterAngle(); } return true; }
      return false;
    }
    if(v==='spins'){
      const map=G.map, D=G.disc, m=M.S;
      if(type==='down'){
        if(ST.sgExp==='custom'&&D.show&&Math.hypot(x-D.cx,y-D.cy)<=D.r+8){ DRAG.what='disc'; ST.sgA2=discA2(D,x,y); sgAfterChange(); return true; }
        if(ST.sgMode==='single'&&x>=map.X(-0.95)&&x<=map.X(0)&&y>=map.Y(0.36)&&y<=map.Y(-0.36)){ sgShoot(SGS,ST); ST.running=true; return true; }
        if(ST.sgExp==='custom') for(const mg of sgMagnetBoxes(map,m,ST)) if(mg.show&&inBox(x,y,mg.b)){
          if(mg.k===0) ST.sgC1=ST.sgC1==='z'?'x':'z'; else ST.sgC2=ST.sgC2==='z'?'x':'z';
          sgAfterChange(); return true; }
        return false;
      }
      if(type==='move'&&DRAG.what==='disc'){ const a=discA2(D,x,y); if(a!==ST.sgA2){ ST.sgA2=a; sgAfterChange(); } return true; }
      return false;
    }
    if(v==='bloch'){
      if(type==='down'){ DRAG.what='cam'; DRAG.x=x; DRAG.y=y; return true; }
      if(type==='move'&&DRAG.what==='cam'){ orbit(x-DRAG.x,y-DRAG.y); DRAG.x=x; DRAG.y=y; return true; }
      return false;
    }
    if(v==='born'){
      const set=(what,xx)=>{ if(what==='bornTh') ST.bornTh=clamp(Math.round((xx-G.A.x)/G.A.w*180),0,180);
        else if(what==='bornAlpha') ST.bornAlpha=clamp(Math.round((xx-G.B.x)/G.B.w*180),0,180);
        else ST.bornN=clamp(Math.round((xx-G.C.x)/G.C.w*64),1,64); };
      if(type==='down'){
        const what=inBox(x,y,G.A)?'bornTh':(inBox(x,y,G.B)?'bornAlpha':(inBox(x,y,G.C)?'bornN':null));
        if(!what) return false; DRAG.what=what; set(what,x); return true;
      }
      if(type==='move'&&DRAG.what&&DRAG.what.indexOf('born')===0){ set(DRAG.what,x); return true; }
      return false;
    }
    return false;
  };
  return S;
}

  });
  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;

  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });
  let frameN=0, last=0, wasBusy=false;
  function frameLoop(tm){
    frameN++;
    const dtw=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    const advanced=S.step(dtw);
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%8===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }

    if(wasBusy&&!busy){ syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
    wasBusy=busy;
    requestAnimationFrame(frameLoop);
  }
  resize(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

/* ================================================================== *
 *  test library (shared by the family): a text-and-fill recorder, the *
 *  layout checker, and the engine's pins.  Reference values labelled  *
 *  (derive) are lines of build/quantum-measurement/refvals.txt, the   *
 *  printed output of derive.py, read in full; (scipy) marks scipy.    *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nanPath=false, segs=[], cur=null;
  const fin=(...a)=>{ for(const v of a) if(!isFinite(v)) nanPath=true; };
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); }, rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    /* line segments are kept per path (in canvas pixels) so the layout check
       can see a stroke: the law's marks on the bars */
    beginPath(){ pend=null; segs=[]; cur=null; }, moveTo(x,y){ fin(x,y); cur=app(x,y); },
    lineTo(x,y){ fin(x,y); if(!pend) pend={n:0}; const p=app(x,y); if(cur) segs.push([cur[0],cur[1],p[0],p[1]]); cur=p; }, closePath(){},
    rect(x,y,w,hh){ fin(x,y,w,hh); if(!pend) pend={n:0}; pend.n++; }, arc(x,y,r){ fin(x,y,r); if(!pend) pend={n:0}; pend.n++; cur=null; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); }, stroke(){ ops.push({op:'stroke',style:ctx.strokeStyle,lw:ctx.lineWidth,segs:segs.slice()}); }, clip(){},
    fillRect(x,y,w,hh){ fin(x,y,w,hh); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){ fin(x,y);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
    nan(){ return nanPath; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>{ _fill=''+v; if(/NaN|undefined/.test(_fill)) nanPath=true; }});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}
/* a negative zero on screen: toFixed prints cos 90 deg = -6e-17 as "-0.000"
   (the photon view's "expected" at 45 deg, found in the capture).  A minus
   glued to a zero that no other digit follows, and not a subtraction (no digit,
   dot or letter before it). */
const NEGZERO_RE=/(^|[^\d.\w])[-−]0(\.0+)?(?![\d.])/;
function negZeroIn(s){ const p=plain(s), m=NEGZERO_RE.exec(p); return m?'"'+p.slice(Math.max(0,m.index-14),m.index+m[0].length+3)+'"':null; }
/* one drawing, every layout rule: no throw, substance, clean text (no entity,
   tag, NaN, negative zero), nothing off the canvas, nothing in the #hint's corner (the HTML
   hint is 11px at bottom:11px, so it owns y > H - 27 on the left), no two
   texts overlapping, no data curve through a legend, no non-finite geometry */
function layoutCheck(T,name,draw,W,H,minFills){
  const c=makeShot(W,H); let err=null;
  try{ draw(c,W,H); }catch(e){ err=e; }
  T.ok(!err,name+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
  if(err) return null;
  const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
  T.ok(fills.length>=minFills&&texts.length>=1,name+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
  T.ok(!c.nan(),name+' '+W+'x'+H+' no non-finite coordinate or colour');
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  let bad=null;
  for(const t of texts){
    if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
    if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
    if(NEGZERO_RE.test(t.t)){ bad='negative zero: "'+t.t.slice(0,48)+'"'; break; }
    if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
  T.ok(!bad,name+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
  const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
  T.ok(!inHint.length,name+' '+W+'x'+H+' no canvas text under the #hint line'+(inHint.length?' ("'+inHint[0].t.slice(0,30)+'" to y '+fmt(inHint[0].bb[3],0)+')':''));
  let hit=null;

  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
