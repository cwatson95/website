<title>Bending light &mdash; PhET&rsquo;s laser on a boundary, with Snell and Fresnel solved exactly</title>
<!--
  ===================================================================
  bending-light.html — a laser meets the boundary between two media:
  how far the transmitted ray bends, how much of the power comes
  back, where it stops coming through at all, what the same picture
  looks like as a wave, and what a prism does to white light
  ===================================================================

  Remake of PhET Interactive Simulations' Bending Light (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets. The model, its constants and its controls follow PhET's build 1.2.5
  (docs/phets/bending-light_en.html); every number taken from that build is
  marked "PhET's value" in the code, in the panel and on the canvas.

  SIX VIEWS.  THE BOUNDARY is PhET's Intro screen: a laser you swing about the
  origin onto the interface between two media (air, water, glass, diamond,
  Mystery A, Mystery B or a custom index), with the reflected and the
  transmitted rays drawn in their own spectral colour at their own share of the
  power, the normal, the angle arcs, PhET's protractor and PhET's intensity
  meter, and the critical angle marked where the transmitted ray disappears.
  THE WAVE is PhET's wave view and its More Tools meters: the same two media
  with the field itself painted, the wavelength and the speed inside each
  medium, and the evanescent tail past the critical angle that PhET does not
  draw.  It is also where Snell's law comes from — the crest spacing along the
  boundary has to match, and that single statement is the law.  THE PRISM is
  PhET's Prisms screen: PhET's own five prism prototypes traced by exact
  polygon and circle intersection with vector Snell at every face, total
  internal reflection where it happens, the partial reflections when you ask
  for them, and white light dispersed into a spectrum -- drawn white where the
  thirty wavelengths still share one path and one at a time where they have
  separated, because thirty translucent strokes on one line composite to the
  colour of whichever was painted last, not to white.  THE REFLECTED FRACTION
  is the Fresnel equations drawn: R and T for s and p polarisation against the
  angle of incidence, with Brewster's angle where R_p is exactly zero, the
  critical angle where R becomes exactly one, and R + T = 1 at every angle.
  THE SPECTRUM is the dispersion model made visible: n against wavelength for
  every substance, the true colour of each wavelength from the CIE 1931
  observer, and the angular spread a 60-degree prism gives white light.  THE
  RAINBOW is what all of it is for: Descartes' stationary deviation in a
  spherical drop, the caustic drawn from the rays themselves, the primary bow
  at 42.13 degrees and the secondary at 50.79, Alexander's dark band of 8.65
  degrees between them, and the Fresnel weights that say why a rainbow is faint
  and polarised -- including two identities derived here: the internal
  reflectance at the stationary ray is exactly (k/(k+2))^2 WHATEVER the index,
  so the k-th bow passes exactly (1-R)^2 R^k of s-polarised light, 64/729 for
  the primary and 9/256 for the secondary.

  WHAT IS EXACT HERE
  ------------------
  Snell's law, in both directions, at and past the critical angle: the suite
  asserts theta_2 against derive.py over eight medium pairs and eight angles,
  asserts that the refracted ray grazes at exactly 90 degrees at the critical
  angle, and round-trips every refraction back to 1e-14 rad.  The Fresnel
  equations for both polarisations: R + T = 1 holds to 6.7e-16 over eight pairs
  x 601 angles, R_p is 0 at Brewster's angle (and theta_B + theta_2 = 90
  degrees exactly), R = 1 at and past the critical angle in both
  polarisations, and R at normal incidence agrees with ((n1-n2)/(n1+n2))^2.
  The wave: lambda_medium = lambda_vacuum/n and v = c/n, the frequency is
  the same on both sides, the crest spacing along the boundary matches to
  1.8e-16, and the field is continuous — 1 + r_s = t_s and
  n_1 cos th_1 (1 - r_s) = n_2 cos th_2 t_s both to 4.4e-16.  The world's
  wavenumber is pinned at five wavelengths rather than only at the reference
  one, where it is 2 pi whichever way round the ratio is written; and the
  evanescent decay constant is pinned against derive.py and then RECOVERED by
  measurement from the drawn field, because past the critical angle the
  transmitted phase does not depend on depth, so the ratio of the field at two
  depths is exactly exp(kappa dy).  The prism:
  ray-polygon and ray-circle intersections in closed form, vector Snell at
  every face, and the traced deviation through an equilateral prism agrees
  with the two-surface closed form to 2.5e-14 degrees and with the
  minimum-deviation law n = sin((A+D)/2)/sin(A/2) to 6.4e-15 degrees.  The
  rainbow: the stationary condition cos^2 th = (n^2-1)/(k^2+2k) agrees with
  scipy's bounded minimiser to 1.4e-6 degrees for k = 1, 2 and 3, and the
  emergent ray the view DRAWS -- refracted at the exit face, not turned through
  D by hand -- leaves at exactly that deviation.  The colour path is checked the
  same way: derive.py parses the CIE 1931 table back out of this file and
  re-evaluates it in Python, so the sRGB bytes of eight wavelengths are pinned
  against an independent evaluation of the same published numbers rather than
  against themselves.  Every reference value in selfTest is a printed line of
  build/bending-light/refvals.txt, the output of derive.py, read in full.

  WHAT IS PhET'S, AND WHERE IT CAME FROM
  --------------------------------------
  Read out of the minified build: the substances and their indices at 650 nm
  (air 1.000293, water 1.333, glass 1.5, diamond 2.419, Mystery A 2.419,
  Mystery B 1.4) and the custom substance's default 2.6 (= Mystery B + 1.2);
  the reference wavelength WAVELENGTH_RED = 650 nm and the laser range
  380-700 nm; the index slider's range 1.000293-1.6 with its ticks at air,
  water and glass; the dispersion model — a Sellmeier curve for BK7 glass and
  an Edlen curve for air, blended linearly so that the result passes through
  the substance's stated index at 650 nm; the s-polarised Fresnel powers
  R = ((n1 c1 - n2 c2)/(n1 c1 + n2 c2))^2 and T = 4 n1 n2 c1 c2/(n1 c1 +
  n2 c2)^2, which is the pair PhET uses for its ray brightness and its
  intensity meter; the 0.005 floor below which PhET stops drawing a reflected
  ray and the 0.001 floor at which its prism tracer gives up; maxLightRaySteps
  = 50; the wave view's MAX_ANGLE_IN_WAVE_MODE = 3.0194 rad (7.00 degrees from
  the boundary); the default laser angle 3 pi/4, which is 45 degrees of
  incidence; the Intro screen's air-over-water and the Prisms screen's
  air-around-glass defaults; the model world 62 x 43.4 red wavelengths across;
  the five prism prototypes and their vertices (an equilateral triangle,
  trapezoid and square of side 10 red wavelengths, a circle and a semicircle
  of radius 5); the five-ray fan spaced half a red wavelength apart; and the
  white-light set _.range(400, 700, 10) = 400, 410, ... 690 nm.  One thing of
  PhET's is deliberately NOT reproduced: its prism beam, aimed as PhET aims it,
  takes a left-in, right-reflect, bottom-out path through the triangle, which is
  a CONSTANT-DEVIATION arrangement and disperses white light by 0.037 degrees
  instead of 1.6, so the beam here opens at the minimum-deviation angle instead
  and selfTest pins both spreads.  The Sellmeier coefficients PhET carries are the published SCHOTT N-BK7 set and the air
  coefficients are Edlen's; this file recomputes n_d = 1.51680 and V_d = 64.17
  from them and checks both against SCHOTT's published values, so the numbers
  are verified rather than copied.

  WHAT IS MODELLED, AND WHAT IS NOT MODELLED AT ALL
  -------------------------------------------------
  Nothing here is absorbing: every index is real, so R + T = 1 exactly and a
  medium never dims a beam that passes through it.  Nothing is dispersive in
  TIME — the wave view draws a single frequency, so there is no pulse and no
  group velocity.  PhET's intensity meter reads the s-polarised reflectance;
  this file draws s, p and the unpolarised average and says which one the
  reading is.  Diamond is offered as a medium chip because PhET ships the
  constant (2.419), but PhET's own medium chooser in this build does not list
  it and its custom-index slider stops at 1.6; both facts are printed.  PhET's
  sixth prism prototype, the diverging lens (a rectangle with two circular
  faces cut into it), is NOT implemented — its two arc radii could not be read
  unambiguously out of the minified build, and a guessed shape is not a
  remake.  The rainbow view models a sphere of water with geometric rays: no
  diffraction, so no supernumerary bows, and the drop is a perfect sphere, so
  there is no flattening and no rainbow of the shape a real large raindrop
  makes.  The prism tracer stops at PhET's own limits (50 steps, power 0.001)
  rather than tracing forever.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);

  let v=xyzToLin(c[0],c[1],c[2]);
  const lo=Math.min(v[0],v[1],v[2]);
  if(lo<0) v=v.map(u=>u-lo);
  const m=Math.max(v[0],v[1],v[2]);
  return m>0 ? v.map(u=>u/m) : [0,0,0];
}
/* the band fades where the eye does (display only): sqrt(min(1, 4 ȳ)) */
function monoLevel(nm){ const c=cmfAt(nm); return c ? Math.sqrt(Math.min(1,4*c[1])) : 0; }
function cssOfLinear(v,k){ const s=k===undefined?1:k;
  return 'rgb('+Math.round(255*srgbGamma(v[0]*s))+','+Math.round(255*srgbGamma(v[1]*s))+','+Math.round(255*srgbGamma(v[2]*s))+')'; }

/* ================================================================== *
 *  the physics — dispersion, Snell, Fresnel, the wave, the prism      *
 *  tracer, the rainbow.  Every closed form here is re-derived in      *
 *  build/bending-light/derive.py and pinned in selfTest against the   *
 *  printed lines of refvals.txt.                                      *
 * ================================================================== */

/* Angles.  A constant named after a unit does not say which way it converts
   (Known-bad, bloch_sphere): DEG multiplies degrees INTO radians, RAD
   multiplies radians INTO degrees, and selfTest pins both against pi/2. */
const DEG=PI/180, RAD=180/PI;

/* ---- PhET's constants, read out of build 1.2.5 (docs/phets/bending-light_en.html) ---- */
const PHET={
  lamRed:650,                 /* WAVELENGTH_RED = 65e-8 m, the reference wavelength */
  lamMin:380, lamMax:700,     /* LASER_MIN_WAVELENGTH (VisibleColor), LASER_MAX_WAVELENGTH */
  c:299792458,                /* SPEED_OF_LIGHT */
  maxWaveAngle:3.0194,        /* MAX_ANGLE_IN_WAVE_MODE, rad */
  maxSteps:50,                /* maxLightRaySteps query parameter, default 50 */
  powerMin:0.001,             /* the prism tracer gives up below this */
  drawMin:0.005,              /* the Intro screen stops drawing a reflected ray below this */
  laserAngle0:3*Math.PI/4,    /* the Intro laser's initial angle => 45 deg of incidence */
  modelW:62, modelH:43.4,     /* the model world, in red wavelengths (62 x 0.7*62) */
  prismT:10,                  /* the prism prototypes are 10 red wavelengths across */
  fanSpacing:0.5, fanLo:-1, fanHi:1.1,  /* the five-ray fan: i = -T .. 1.1T step T/2 */
  nSliderLo:1.000293, nSliderHi:1.6,    /* the index slider's range */
  nCustom0:2.6,               /* the custom substance starts at MYSTERY_B + 1.2 */
};
/* PhET's white light: _.range(400, 700, 10) — 400, 410, ... 690 nm, 30 of them */
const WHITE_WL=(()=>{ const a=[]; for(let l=400;l<700;l+=10) a.push(l); return a; })();
/* Thirty strokes on almost the same path cannot be composited into white on
   a canvas: source-over with alpha is not addition, so whichever end of the
   spectrum is painted last simply wins (the lenses.html Known-bad — a fan of
   four Fraunhofer lines read as one red beam there; here thirty of them read
   as one green one).  The rule this file uses instead is geometric and says
   something true: WHERE THE THIRTY WAVELENGTHS LIE WITHIN A LINE WIDTH OF ONE
   ANOTHER THE BEAM IS DRAWN WHITE, because thirty wavelengths together are
   white; where they have separated by more than that they are drawn
   one at a time in their own colours.  mergeMask decides that per segment,
   outside any draw call, so selfTest can assert it. */
const WHITE_MERGE_PX=2.5;
function mergeMask(traces,pxPerUnit,tol){
  const lim=(tol===undefined?WHITE_MERGE_PX:tol)/Math.max(pxPerUnit,1e-9);
  let n=Infinity;
  for(const t of traces) n=Math.min(n,t.segs.length);
  if(!isFinite(n)) return [];
  const ref=traces[Math.floor(traces.length/2)];
  const out=[];
  for(let k=0;k<n;k++){
    let spread=0;
    const r=ref.segs[k];
    for(const t of traces){
      const a=t.segs[k];
      spread=Math.max(spread,Math.hypot(a[0]-r[0],a[1]-r[1]),Math.hypot(a[2]-r[2],a[3]-r[3]));
    }
    out.push(spread<=lim);
  }
  return out;
}

/* ---- the substances, with PhET's index at 650 nm ---- */
const SUBS=[
  {id:'air',      name:'air',       n:1.000293, phet:true},
  {id:'water',    name:'water',     n:1.333,    phet:true},
  {id:'glass',    name:'glass',     n:1.5,      phet:true},
  {id:'diamond',  name:'diamond',   n:2.419,    phet:false},
  {id:'mysteryA', name:'Mystery A', n:2.419,    phet:true, mystery:true},
  {id:'mysteryB', name:'Mystery B', n:1.4,      phet:true, mystery:true},
  {id:'custom',   name:'custom',    n:null,     phet:true},
];
function subById(id){ for(const s of SUBS) if(s.id===id) return s; throw new Error('no substance '+id); }

/* ---- dispersion (PhET's model, written out from the formulas in its build) ----
   A Sellmeier curve for BK7 glass and an Edlen curve for air, blended linearly
   so that the result passes through the substance's stated index at 650 nm.
   The Sellmeier coefficients are the published SCHOTT N-BK7 set (lambda in
   metres, so the C are in m^2) and the air coefficients are Edlen's for
   standard air (15 C, 101.325 kPa, dry, 0.03% CO2).  Both are checked against
   published values in selfTest rather than trusted. */
const SELL_B=[1.03961212,0.231792344,1.01046945];
const SELL_C=[6.00069867e-15,2.00179144e-14,1.03560653e-10];
const AIR_A=[0.05792105,0.00167917], AIR_K=[238.0185,57.362];
const NM=1e-9;

function sellmeier(lamM){
  const l2=lamM*lamM;
  let s=1;
  for(let i=0;i<3;i++) s+=SELL_B[i]*l2/(l2-SELL_C[i]);
  return Math.sqrt(s);
}
function airIndex(lamM){
  const sig2=Math.pow(lamM*1e6,-2);          /* 1/lambda[um]^2 */
  return 1+AIR_A[0]/(AIR_K[0]-sig2)+AIR_A[1]/(AIR_K[1]-sig2);
}
/* how much of BK7's dispersion this substance carries; PhET clamps it at 0 */
function blendFraction(nRef){
  const a=airIndex(PHET.lamRed*NM);
  return Math.max(0,(nRef-a)/(sellmeier(PHET.lamRed*NM)-a));
}
/* the index of a substance named by nRef (its index at 650 nm) at lamNm */
function indexOf(nRef,lamNm){
  const s=blendFraction(nRef), lamM=lamNm*NM;
  return s*sellmeier(lamM)+(1-s)*airIndex(lamM);
}
/* the index a medium of the state has at a wavelength */
function mediumIndex(subId,customN,lamNm){
  const s=subById(subId);
  return indexOf(s.n===null?customN:s.n,lamNm);
}

/* ---- Snell's law ---- */
/* theta_2, or NaN when n1 sin(th1) > n2 (total internal reflection) */
function refractAngle(n1,n2,th1){
  const s=n1*Math.sin(th1)/n2;
  return Math.abs(s)>1?NaN:Math.asin(s);
}
/* the angle past which nothing is transmitted, or NaN when there is none */
function criticalAngle(n1,n2){ return n2>=n1?NaN:Math.asin(n2/n1); }
/* Brewster's angle: the angle at which R_p is exactly zero */
function brewster(n1,n2){ return Math.atan2(n2,n1); }

/* ---- the Fresnel equations ----
   s: the electric field perpendicular to the plane of incidence
   p: the electric field in the plane of incidence
   R + T = 1 exactly, in both, at every angle: the transmitted POWER carries
   the factor (n2 cos th2)/(n1 cos th1) because the beam changes width and
   speed when it crosses.  PhET uses the s pair for its ray brightness and its
   intensity meter; this file computes both and says which one is shown. */
function fresnel(n1,n2,th1){
  const c1=Math.cos(th1), s2=n1*Math.sin(th1)/n2;
  if(Math.abs(s2)<=1){
    const c2=Math.sqrt(Math.max(0,1-s2*s2));
    const rs=(n1*c1-n2*c2)/(n1*c1+n2*c2), rp=(n2*c1-n1*c2)/(n2*c1+n1*c2);
    const ts=2*n1*c1/(n1*c1+n2*c2), tp=2*n1*c1/(n2*c1+n1*c2);
    const k=c1>0?(n2*c2)/(n1*c1):0;
    return {rs:rs,rp:rp,ts:ts,tp:tp,Rs:rs*rs,Rp:rp*rp,Ts:k*ts*ts,Tp:k*tp*tp,
            th2:Math.asin(s2),tir:false,phs:0,php:0};
  }
  /* past the critical angle cos(th2) is imaginary: |r| = 1 and nothing is
     transmitted, and the reflected amplitude picks up the Goos-Hanchen phase.
     The evanescent DECAY CONSTANT is not returned here: fresnelSComplex owns
     it, and everything that draws or reads it takes it from there.  This
     function used to carry a second copy that nothing called, which a 109-
     mutant sweep duly reported as a survivor. */
  const g=Math.sqrt(s2*s2-1);
  return {rs:1,rp:1,ts:0,tp:0,Rs:1,Rp:1,Ts:0,Tp:0,th2:NaN,tir:true,
          phs:-2*Math.atan2(n2*g,n1*c1), php:-2*Math.atan2(n1*g,n2*c1)};
}
/* The complex s-polarised amplitudes, valid through total internal
   reflection: r = (a - b)/(a + b), t = 2a/(a + b) with a = n1 cos th1 and
   b = n2 cos th2 (real) or i n2 g (imaginary, past the critical angle).
   This is the ONLY place the evanescent decay constant is computed:
   kap = n2 sqrt(s2^2 - 1) = sqrt(n1^2 sin^2 th1 - n2^2), in units of k0, and
   it is zero wherever the transmitted wave propagates. */
function fresnelSComplex(n1,n2,th1){
  const a=n1*Math.cos(th1), s2=n1*Math.sin(th1)/n2;
  if(Math.abs(s2)<=1){
    const b=n2*Math.sqrt(Math.max(0,1-s2*s2));
    return {rRe:(a-b)/(a+b),rIm:0,tRe:2*a/(a+b),tIm:0,ky2:b,kap:0,tir:false};
  }
  const B=n2*Math.sqrt(s2*s2-1), den=a*a+B*B;
  return {rRe:(a*a-B*B)/den, rIm:-2*a*B/den,
          tRe:2*a*a/den, tIm:-2*a*B/den, ky2:0, kap:B, tir:true};
}
const cAbs=(re,im)=>Math.hypot(re,im);
const cArg=(re,im)=>Math.atan2(im,re);

/* ---- the wave: wavelength and speed inside a medium ---- */
function lambdaIn(lam0,n){ return lam0/n; }
function speedIn(n){ return PHET.c/n; }

/* The field of the two-medium problem, in world units (one unit = one red
   wavelength in vacuum), at phase `ph` = omega t.  y > 0 is medium 1.
   Returns the s-polarised scalar field; medium 1 carries incident + reflected
   and medium 2 the transmitted (or evanescent) wave. */
function waveAt(W,x,y,ph){
  const kx=W.k0*W.n1*Math.sin(W.th1);
  if(y>=0){
    const ky=W.k0*W.n1*Math.cos(W.th1);
    const rA=cAbs(W.f.rRe,W.f.rIm), rP=cArg(W.f.rRe,W.f.rIm);
    return Math.cos(kx*x-ky*y-ph)+rA*Math.cos(kx*x+ky*y-ph+rP);
  }
  const tA=cAbs(W.f.tRe,W.f.tIm), tP=cArg(W.f.tRe,W.f.tIm);
  const ky2=W.k0*W.f.ky2, kap=W.k0*W.f.kap;
  return tA*Math.exp(kap*y)*Math.cos(kx*x-ky2*y-ph+tP);
}
/* The TIME-AVERAGED intensity <E^2>, which depends on y alone.  Above the
   boundary the incident and reflected waves interfere into a standing
   pattern, <E^2> = (1 + |r|^2)/2 + |r| cos(2 k_y y + arg r); below it the
   transmitted wave carries |t|^2/2, times exp(2 kappa y) past the critical
   angle.  Continuous at y = 0, because |1 + r|^2 = |t|^2 exactly. */
function meanIntensity(W,y){
  if(y>=0){
    const rA=cAbs(W.f.rRe,W.f.rIm), rP=cArg(W.f.rRe,W.f.rIm);
    const ky=W.k0*W.n1*Math.cos(W.th1);
    return 0.5*(1+rA*rA)+rA*Math.cos(2*ky*y+rP);
  }
  const tA=cAbs(W.f.tRe,W.f.tIm);
  return 0.5*tA*tA*Math.exp(2*W.k0*W.f.kap*y);
}
/* everything the wave view needs, in one object */
function waveState(n1,n2,th1,lam0Nm){
  /* k0 in world units: one world unit is one RED wavelength in vacuum, so a
     wave of vacuum wavelength lam0 has k0 = 2 pi (lamRed/lam0) per unit */
  const k0=TAU*PHET.lamRed/lam0Nm;
  return {n1:n1,n2:n2,th1:th1,lam0:lam0Nm,k0:k0,f:fresnelSComplex(n1,n2,th1)};
}

/* ================================================================== *
 *  the prism tracer — exact intersection, vector Snell at every face  *
 * ================================================================== */
const TRACE_EPS=1e-9;

/* nearest forward hit of the ray p + t d with a CLOSED polygon whose points
   run counter-clockwise; the normal returned points OUT of the polygon */
function polyHit(p,d,pts){
  let bt=null, bn=null;
  const m=pts.length;
  for(let i=0;i<m;i++){
    const a=pts[i], b=pts[(i+1)%m];
    const ex=b[0]-a[0], ey=b[1]-a[1];
    const den=d[0]*ey-d[1]*ex;
    if(Math.abs(den)<1e-15) continue;
    const qx=a[0]-p[0], qy=a[1]-p[1];
    const t=(qx*ey-qy*ex)/den, u=(qx*d[1]-qy*d[0])/den;
    if(t>TRACE_EPS&&u>=-1e-12&&u<=1+1e-12&&(bt===null||t<bt)){
      const L=Math.hypot(ex,ey);
      bt=t; bn=[ey/L,-ex/L];
    }
  }
  return bt===null?null:{t:bt,n:bn};
}
/* nearest forward hit with a circle; with `half` given only the arc on that
   side of the centre counts (that is how the semicircle's curved face works) */
function circleHit(p,d,c,r,half){
  const ox=p[0]-c[0], oy=p[1]-c[1];
  const a=d[0]*d[0]+d[1]*d[1], b=2*(ox*d[0]+oy*d[1]), cc=ox*ox+oy*oy-r*r;
  const disc=b*b-4*a*cc;
  if(disc<0) return null;
  const sq=Math.sqrt(disc);
  /* the stable pair of roots: one from the well-conditioned branch, the other
     from the product of the roots */
  const q=-0.5*(b+(b<0?-sq:sq));
  const roots=(Math.abs(q)>1e-300?[q/a,cc/q]:[(-b-sq)/(2*a),(-b+sq)/(2*a)]).sort((u,v)=>u-v);
  for(const t of roots){
    if(t<=TRACE_EPS) continue;
    const hx=p[0]+t*d[0], hy=p[1]+t*d[1];
    if(half&&((hx-c[0])*half[0]+(hy-c[1])*half[1])<=0) continue;
    const L=Math.hypot(hx-c[0],hy-c[1]);
    return {t:t,n:[(hx-c[0])/L,(hy-c[1])/L]};
  }
  return null;
}
function segHit(p,d,a,b,outN){
  const ex=b[0]-a[0], ey=b[1]-a[1], den=d[0]*ey-d[1]*ex;
  if(Math.abs(den)<1e-15) return null;
  const qx=a[0]-p[0], qy=a[1]-p[1];
  const t=(qx*ey-qy*ex)/den, u=(qx*d[1]-qy*d[0])/den;
  if(t>TRACE_EPS&&u>=-1e-12&&u<=1+1e-12) return {t:t,n:outN};
  return null;
}
function shapeHit(sh,p,d){
  if(sh.kind==='poly') return polyHit(p,d,sh.pts);
  if(sh.kind==='circle') return circleHit(p,d,sh.c,sh.r,null);
  if(sh.kind==='semi'){
    const h1=segHit(p,d,sh.a,sh.b,[-sh.half[0],-sh.half[1]]);
    const h2=circleHit(p,d,sh.c,sh.r,sh.half);
    if(!h1) return h2;
    if(!h2) return h1;
    return h1.t<h2.t?h1:h2;
  }
  throw new Error('shape '+sh.kind);
}
function shapeInside(sh,p){
  if(sh.kind==='poly'){
    const pts=sh.pts; let c=0;
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      if((a[1]>p[1])!==(b[1]>p[1])){
        const x=a[0]+(p[1]-a[1])*(b[0]-a[0])/(b[1]-a[1]);
        if(x>p[0]) c++;
      }
    }
    return c%2===1;
  }
  if(sh.kind==='circle') return Math.hypot(p[0]-sh.c[0],p[1]-sh.c[1])<sh.r;
  if(sh.kind==='semi'){
    const dx=p[0]-sh.c[0], dy=p[1]-sh.c[1];
    return Math.hypot(dx,dy)<sh.r&&dx*sh.half[0]+dy*sh.half[1]>0;
  }
  throw new Error('shape '+sh.kind);
}
/* vector Snell: `nrm` points back against the incoming ray */
function vecRefract(d,nrm,n1,n2){
  const eta=n1/n2, ci=-(d[0]*nrm[0]+d[1]*nrm[1]);
  const k=1-eta*eta*(1-ci*ci);
  if(k<0) return null;
  const s=eta*ci-Math.sqrt(k);
  return [eta*d[0]+s*nrm[0],eta*d[1]+s*nrm[1]];
}
function vecReflect(d,nrm){
  const dn=d[0]*nrm[0]+d[1]*nrm[1];
  return [d[0]-2*dn*nrm[0],d[1]-2*dn*nrm[1]];
}
/* PhET's five prism prototypes, in units of the red wavelength (t = 10).
   The vertices are PhET's own; the polygons are wound counter-clockwise so
   that polyHit's outward normal is outward. */
function prismShape(id){
  const t=PHET.prismT, i=t/2, r3=Math.sqrt(3);
  if(id==='triangle') return {kind:'poly',pts:[[-t/2,-t/(2*r3)],[t/2,-t/(2*r3)],[0,t/r3]]};
  if(id==='trapezoid') return {kind:'poly',pts:[[-t/2,-t*r3/4],[t/2,-t*r3/4],[t/4,t*r3/4],[-t/4,t*r3/4]]};
  if(id==='square') return {kind:'poly',pts:[[-t/2,-t/2],[t/2,-t/2],[t/2,t/2],[-t/2,t/2]]};
  if(id==='circle') return {kind:'circle',c:[0,0],r:i};
  if(id==='semicircle') return {kind:'semi',c:[0,0],r:i,a:[0,-i],b:[0,i],half:[-1,0]};
  throw new Error('prism '+id);
}
/* rotate a shape about the origin */
function rotShape(sh,a){
  if(a===0) return sh;
  const ca=Math.cos(a), sa=Math.sin(a);
  const R=p=>[p[0]*ca-p[1]*sa,p[0]*sa+p[1]*ca];
  if(sh.kind==='poly') return {kind:'poly',pts:sh.pts.map(R)};
  if(sh.kind==='circle') return {kind:'circle',c:R(sh.c),r:sh.r};
  return {kind:'semi',c:R(sh.c),r:sh.r,a:R(sh.a),b:R(sh.b),half:R(sh.half)};
}
/* Trace one ray through one shape.  Returns the drawn segments
   [x0,y0,x1,y1,power,inside] and the exit direction of the primary branch.
   PhET's own limits: at most maxSteps segments, and a branch is dropped once
   its power falls below powerMin. */
function traceRay(sh,p,d,nOut,nIn,opt){
  opt=opt||{};
  const reach=opt.reach===undefined?40:opt.reach;
  const refl=opt.reflections!==false;
  const maxSteps=opt.maxSteps===undefined?PHET.maxSteps:opt.maxSteps;
  const pmin=opt.powerMin===undefined?PHET.powerMin:opt.powerMin;
  const segs=[];
  let exitDir=null, exitPt=null, path=0;
  const queue=[{p:p,d:d,pw:1,ins:shapeInside(sh,p),depth:0,primary:true}];
  let steps=0;
  while(queue.length&&steps<maxSteps){
    steps++;
    const it=queue.shift();
    if(it.pw<pmin||it.depth>12) continue;
    const hit=shapeHit(sh,it.p,it.d);
    if(!hit){
      segs.push([it.p[0],it.p[1],it.p[0]+reach*it.d[0],it.p[1]+reach*it.d[1],it.pw,it.ins]);
      if(it.primary&&!exitDir){ exitDir=it.d; exitPt=it.p; }
      continue;
    }
    const hx=it.p[0]+hit.t*it.d[0], hy=it.p[1]+hit.t*it.d[1];
    segs.push([it.p[0],it.p[1],hx,hy,it.pw,it.ins]);
    if(it.primary) path+=hit.t*(it.ins?nIn:nOut);
    const n1=it.ins?nIn:nOut, n2=it.ins?nOut:nIn;
    const dn=it.d[0]*hit.n[0]+it.d[1]*hit.n[1];
    const nn=dn<0?hit.n:[-hit.n[0],-hit.n[1]];
    const cos1=clamp(-(it.d[0]*nn[0]+it.d[1]*nn[1]),-1,1);
    const f=fresnel(n1,n2,Math.acos(cos1));
    const R=0.5*(f.Rs+f.Rp);
    const td=vecRefract(it.d,nn,n1,n2), rd=vecReflect(it.d,nn);
    const off=1e-9;
    if(!td){
      queue.push({p:[hx+off*rd[0],hy+off*rd[1]],d:rd,pw:it.pw,ins:it.ins,
                  depth:it.depth+1,primary:it.primary});
    } else {
      queue.push({p:[hx+off*td[0],hy+off*td[1]],d:td,pw:it.pw*(1-R),ins:!it.ins,
                  depth:it.depth+1,primary:it.primary});
      if(refl&&it.pw*R>=pmin)
        queue.push({p:[hx+off*rd[0],hy+off*rd[1]],d:rd,pw:it.pw*R,ins:it.ins,
                    depth:it.depth+1,primary:false});
    }
  }
  return {segs:segs,exitDir:exitDir,exitPt:exitPt,path:path,steps:steps};
}

/* ---- the prism, in closed form, for the tracer to be checked against ----
   a ray entering one face of a prism of apex angle A at th1 leaves deviated by
   D = th1 + th2 - A, with th2 got by Snell at each face in turn */
function prismDeviation(n1,n2,A,th1){
  const r1=refractAngle(n1,n2,th1);
  if(!isFinite(r1)) return NaN;
  const r2=A-r1, s=n2*Math.sin(r2)/n1;
  if(Math.abs(s)>1) return NaN;
  return th1+Math.asin(s)-A;
}
/* the minimum deviation, where the ray crosses the prism symmetrically:
   n2/n1 = sin((A + D_min)/2)/sin(A/2).  NaN when the apex angle exceeds
   2 theta_c and the prism simply traps the ray. */
function prismMinDeviation(n1,n2,A){
  const arg=n2/n1*Math.sin(A/2);
  return Math.abs(arg)>1?NaN:2*Math.asin(arg)-A;
}
/* Enter the left face of PhET's equilateral triangle at th1 and TRACE the ray
   out; returns the deviation of the emergent beam.  This is the check that
   matters: it shares no arithmetic with prismDeviation, so the two agreeing is
   evidence about the intersection code, not about one formula. */
function traceTriangleDeviation(nEnv,nPr,th1){
  const tri=prismShape('triangle'), pts=tri.pts;
  const apex=pts[2], bl=pts[0];
  const mid=[0.5*(apex[0]+bl[0]),0.5*(apex[1]+bl[1])];
  const ex=bl[0]-apex[0], ey=bl[1]-apex[1], L=Math.hypot(ex,ey);
  const out=[ey/L,-ex/L];                     /* the CCW polygon's outward normal */
  const inw=[-out[0],-out[1]];
  const ca=Math.cos(th1), sa=Math.sin(th1);
  const d=[inw[0]*ca-inw[1]*sa,inw[0]*sa+inw[1]*ca];
  const start=[mid[0]-6*d[0],mid[1]-6*d[1]];
  const tr=traceRay(tri,start,d,nEnv,nPr,{reflections:false});
  if(!tr.exitDir) return NaN;
  return Math.abs(Math.atan2(d[0]*tr.exitDir[1]-d[1]*tr.exitDir[0],
                             d[0]*tr.exitDir[0]+d[1]*tr.exitDir[1]));
}
/* the lateral displacement of a beam through a slab of thickness t */
function slabOffset(n1,n2,th1,t){
  const th2=refractAngle(n1,n2,th1);
  return isFinite(th2)?t*Math.sin(th1-th2)/Math.cos(th2):NaN;
}

/* ================================================================== *
 *  the rainbow — Descartes' stationary deviation in a sphere          *
 * ================================================================== */
/* k internal reflections: D(th) = 2 th - 2(k+1) asin(sin th/n) + k pi */
function rainDev(n,k,th){ return 2*th-2*(k+1)*Math.asin(Math.sin(th)/n)+k*PI; }
/* dD/dth = 0 exactly where cos^2 th = (n^2 - 1)/(k^2 + 2k) */
function rainTheta(n,k){
  const c2=(n*n-1)/(k*k+2*k);
  return (c2<0||c2>1)?NaN:Math.acos(Math.sqrt(c2));
}
/* the angular radius of the bow about the antisolar point */
function bowAngle(n,k){
  const th=rainTheta(n,k);
  return isFinite(th)?Math.abs(PI-rainDev(n,k,th)):NaN;
}
/* the RELATIVE index of the drop against what surrounds it: this is what
   Snell's law at the drop's surface carries, so it is what the rainbow
   geometry uses (n_water/n_air, not n_water) */
function dropIndex(lamNm){ return indexOf(1.333,lamNm)/indexOf(1.000293,lamNm); }
/* the Fresnel throughput of the primary path: transmit in, reflect k times,
   transmit out — unpolarised, or one polarisation */
function bowThroughput(nOut,nIn,k,th,pol){
  const thr=Math.asin(Math.sin(th)/nIn*nOut);
  const fin=fresnel(nOut,nIn,th), fint=fresnel(nIn,nOut,thr);
  const T1=pol==='s'?fin.Ts:pol==='p'?fin.Tp:0.5*(fin.Ts+fin.Tp);
  const Rr=pol==='s'?fint.Rs:pol==='p'?fint.Rp:0.5*(fint.Rs+fint.Rp);
  const T2=pol==='s'?fint.Ts:pol==='p'?fint.Tp:0.5*(fint.Ts+fint.Tp);
  return T1*Math.pow(Rr,k)*T2;
}
/* the path of one ray through a unit sphere at impact parameter b = sin(th),
   with k internal reflections: the chord points on the circle */
/* At the stationary ray the geometry forces n1 cos th1 = (k+1) n2 cos th2 at
   the internal bounce, so the reflectance there is exact and, for s
   polarisation, INDEPENDENT OF THE INDEX.  Both are asserted. */
function bowRsExact(k){ return Math.pow(k/(k+2),2); }
function bowRpExact(k,m){ return Math.pow(((k+1)-m*m)/((k+1)+m*m),2); }
/* and therefore the WHOLE s-polarised throughput of the k-th bow is exact and
   index-independent too: the entry interface is the same interface at the
   conjugate angle, so it reflects (k/(k+2))^2 as well. */
function bowThroughputSExact(k){
  const R=Math.pow(k/(k+2),2);
  return (1-R)*(1-R)*Math.pow(R,k);
}
/* The path of one ray through a unit sphere at impact parameter b = sin(th)
   with k internal reflections: the chord points on the circle, and the
   EMERGENT DIRECTION obtained by refracting at the exit face rather than by
   turning the incoming direction through D.  selfTest asserts the two agree,
   which is what ties the drawing to rainDev (Known-bad: assert on the objects
   the view draws, not on the formula beside them). */
function dropPath(n,k,th){
  const thr=Math.asin(Math.sin(th)/n);
  const pts=[];
  /* enter at angle `a0` on the circle, measured so that the ray comes in
     horizontally from the left at height b = sin(th) */
  let a=PI-th;                       /* the entry point's polar angle */
  pts.push([Math.cos(a),Math.sin(a)]);
  for(let i=0;i<=k;i++){
    a=a-(PI-2*thr);                  /* each chord subtends pi - 2 thr */
    pts.push([Math.cos(a),Math.sin(a)]);
  }
  const last=pts[pts.length-1], prev=pts[pts.length-2];
  const L=Math.hypot(last[0]-prev[0],last[1]-prev[1]);
  const din=[(last[0]-prev[0])/L,(last[1]-prev[1])/L];
  const nrm=[-last[0],-last[1]];     /* pointing back against the inside ray */
  const out=vecRefract(din,nrm,n,1);
  return {pts:pts,thr:thr,dev:rainDev(n,k,th),
          out:out||vecReflect(din,nrm),tir:!out};
}

/* ================================================================== *
 *  state, the per-view model, the readout, the equation bar, the tag  *
 * ================================================================== */
const TABS=[['bound','the boundary'],['wave','the wave'],['prism','the prism'],
            ['fres','the reflected fraction'],['spec','the spectrum'],['bow','the rainbow']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', off:'#161c2c', edge:'#242a3a',
           norm:'#5ac8e0', arc:'#e8843a', axis:'#39506b', edge2:'#2a2f3d',
           sPol:'#b8ec4c', pPol:'#cd35c4', unpol:'#e8843a'};
const RO_W=300;
const HINT_H=18;   /* the house #hint (HTML, bottom:11px) owns the bottom-left */

const PRISMS=[{id:'triangle',name:'triangle'},{id:'trapezoid',name:'trapezoid'},
              {id:'square',name:'square'},{id:'circle',name:'circle'},
              {id:'semicircle',name:'semicircle'}];
const POLS=[{id:'s',name:'s (PhET)'},{id:'p',name:'p'},{id:'unpol',name:'unpolarised'}];

const DEFAULTS={
  view:'bound',
  /* PhET's Intro screen: air above, water below, the laser at 3 pi/4 (45 deg) */
  topSub:'air', topN:1.000293, botSub:'water', botN:PHET.nCustom0,
  angDeg:45, lamNm:PHET.lamRed, white:false, laserOn:true, pol:'s',
  showNormal:true, showAngles:true, showProtractor:false, showMeter:true, paintField:true,
  /* the wave view */
  anim:true, phase:0, waveSpeed:1, showEvanescent:true,
  /* PhET's Prisms screen: air around a glass prism */
  envSub:'air', envN:1.000293, prismSub:'glass', prismN:PHET.nCustom0,
  /* the beam is aimed at the left face at close to the minimum-deviation
     angle, which is the geometry a prism is FOR; the default -7 deg tilt it
     had instead sent the ray into a left-in, right-TIR, bottom-out path that
     is a constant-deviation arrangement and disperses by 0.04 deg, not 1.6 */
  prismId:'triangle', prismRot:0, beamY:-1.6, beamTilt:18.5,
  manyRays:false, showReflections:false, showNormals:false,
  /* the spectrum and the rainbow */
  specSubs:'all', prismApex:60,
  bowK:1, bowKs:'1', bowPol:'unpol', bowRays:true,
};
const ST=Object.assign({},DEFAULTS);

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function clearMemo(){ for(const k in MEMO) delete MEMO[k]; }

/* ---------------------------------------------------- media and colour */
function topIndex(st,lamNm){ return mediumIndex(st.topSub,st.topN,lamNm===undefined?st.lamNm:lamNm); }
function botIndex(st,lamNm){ return mediumIndex(st.botSub,st.botN,lamNm===undefined?st.lamNm:lamNm); }
function envIndex(st,lamNm){ return mediumIndex(st.envSub,st.envN,lamNm===undefined?st.lamNm:lamNm); }
function prismIndex(st,lamNm){ return mediumIndex(st.prismSub,st.prismN,lamNm===undefined?st.lamNm:lamNm); }
/* the name a medium shows; a mystery substance refuses to print its index,
   which is the whole point of it in PhET */
function subLabel(id,n){
  const s=subById(id);
  if(s.mystery) return s.name+' (n = ?)';
  return s.name+' (n = '+fmt(n,4)+')';
}
function isMystery(id){ return !!subById(id).mystery; }
/* a medium's wash: the house cyan, deepening with the index.  Display only. */
function mediumFill(n){ return rgba(COL.struct,clamp(0.05+0.13*(n-1),0.03,0.30)); }
/* the colour of light of this wavelength, at a brightness level */
function wlCss(nm,k){ return cssOfLinear(monoLinear(nm),k===undefined?1:k); }
/* A beam of one wavelength at a power fraction, optionally translucent.
   White light is thirty wavelengths on almost the same path, and an OPAQUE
   stroke means only the last one drawn is ever seen (the lenses.html
   Known-bad): they are drawn at alpha 0.28 so the overlap blends toward white
   and the colours separate exactly where the physics separates them. */
function beamCss(st,nm,power,alpha){
  const lvl=clamp(Math.sqrt(Math.max(power,0)),0,1);
  const v=monoLinear(nm===undefined?st.lamNm:nm);
  const b=[0,1,2].map(i=>Math.round(255*srgbGamma(v[i]*lvl)));
  const a=alpha===undefined?1:alpha;
  return a>=1?'rgb('+b[0]+','+b[1]+','+b[2]+')'
             :'rgba('+b[0]+','+b[1]+','+b[2]+','+fmt(a,3)+')';
}
const WHITE_ALPHA=0.28;
/* PhET stops drawing a reflected ray below 0.005 of the power.  That is a
   decision about the PICTURE, so it lives here where selfTest can ask it,
   not inside the draw call (Known-bad: a number computed inside a draw call
   cannot be tested). */
function drawsReflected(R){ return R>=PHET.drawMin; }
/* the power split that the readout and the ray brightness use */
function powerSplit(f,pol){
  if(pol==='p') return {R:f.Rp,T:f.Tp};
  if(pol==='unpol') return {R:0.5*(f.Rs+f.Rp),T:0.5*(f.Ts+f.Tp)};
  return {R:f.Rs,T:f.Ts};
}

/* ------------------------------------------------ the boundary and wave */
function boundaryModel(st,lamNm){
  const lam=lamNm===undefined?st.lamNm:lamNm;
  const n1=topIndex(st,lam), n2=botIndex(st,lam);
  const th1=clamp(st.angDeg,0,89.999)*DEG;
  const th2=refractAngle(n1,n2,th1);
  const f=fresnel(n1,n2,th1);
  const sp=powerSplit(f,st.pol);
  return {lam:lam,n1:n1,n2:n2,th1:th1,th2:th2,f:f,R:sp.R,T:sp.T,
          tc:criticalAngle(n1,n2),tb:brewster(n1,n2),tir:f.tir,
          dIn:[Math.sin(th1),-Math.cos(th1)],
          dRefl:[Math.sin(th1),Math.cos(th1)],
          dTrans:isFinite(th2)?[Math.sin(th2),-Math.cos(th2)]:null,
          lam1:lambdaIn(lam,n1),lam2:lambdaIn(lam,n2),
          v1:speedIn(n1),v2:speedIn(n2),freq:PHET.c/(lam*NM)};
}

/* ------------------------------------------------------------ the prism */
/* the rays PhET fires: one down the middle, or a fan of five spaced half a
   red wavelength apart across the beam */
function beamOrigins(st){
  const th=st.beamTilt*DEG, d=[Math.cos(th),Math.sin(th)];
  const perp=[-d[1],d[0]];
  const base=[-11.5,st.beamY];
  if(!st.manyRays) return {d:d,origins:[base]};
  const out=[];
  for(let i=PHET.fanLo;i<=PHET.fanHi+1e-9;i+=PHET.fanSpacing)
    out.push([base[0]+perp[0]*i,base[1]+perp[1]*i]);
  return {d:d,origins:out};
}
function prismModel(st){
  const sh=rotShape(prismShape(st.prismId),st.prismRot*DEG);
  const beam=beamOrigins(st);
  const wls=st.white?WHITE_WL:[st.lamNm];
  const bundles=[];
  for(const lam of wls){
    const nOut=envIndex(st,lam), nIn=prismIndex(st,lam);
    for(const o of beam.origins)
      bundles.push({lam:lam,nOut:nOut,nIn:nIn,origin:o,
        tr:traceRay(sh,o,beam.d,nOut,nIn,{reflections:st.showReflections,reach:46})});
  }
  /* grouped by beam origin, so the white-light merge rule can look across
     the thirty wavelengths that share one path */
  const groups=[];
  for(let o=0;o<beam.origins.length;o++){
    const g=bundles.filter((b,i)=>i%beam.origins.length===o);
    groups.push(g);
  }
  return {shape:sh,beam:beam,bundles:bundles,groups:groups,wls:wls,
          nOut:envIndex(st),nIn:prismIndex(st),
          tc:criticalAngle(prismIndex(st),envIndex(st)),
          apex:st.prismId==='triangle'?60*DEG:NaN};
}

/* ---------------------------------------- the Fresnel curves and sweeps */
const FRES_N=181;
function fresnelCurves(n1,n2){
  const th=[],Rs=[],Rp=[],Ru=[],Ts=[],Tp=[];
  for(let i=0;i<FRES_N;i++){
    const t=i/(FRES_N-1)*(90-1e-4)*DEG;
    const f=fresnel(n1,n2,t);
    th.push(t*RAD); Rs.push(f.Rs); Rp.push(f.Rp); Ru.push(0.5*(f.Rs+f.Rp));
    Ts.push(f.Ts); Tp.push(f.Tp);
  }
  return {th:th,Rs:Rs,Rp:Rp,Ru:Ru,Ts:Ts,Tp:Tp};
}

/* -------------------------------------------------------- the spectrum */
const SPEC_N=121;
function spectrumCurves(st){
  const lam=[],rows={};
  for(let i=0;i<SPEC_N;i++) lam.push(PHET.lamMin+(PHET.lamMax-PHET.lamMin)*i/(SPEC_N-1));
  for(const s of SUBS){
    if(s.id==='custom') continue;
    rows[s.id]=lam.map(l=>indexOf(s.n,l));
  }
  rows.custom=lam.map(l=>indexOf(st.botN,l));
  /* the prism's angular spread: the deviation of each wavelength through an
     apex-angle prism at the angle that minimises the 650 nm deviation */
  const A=st.prismApex*DEG;
  const nRed=prismIndex(st,PHET.lamRed), nEnv=envIndex(st,PHET.lamRed);
  const Dm=prismMinDeviation(nEnv,nRed,A);
  const thIn=isFinite(Dm)?(A+Dm)/2:45*DEG;
  const dev=lam.map(l=>prismDeviation(envIndex(st,l),prismIndex(st,l),A,thIn));
  return {lam:lam,rows:rows,dev:dev,thIn:thIn,A:A,Dmin:Dm};
}

/* --------------------------------------------------------- the rainbow */
const BOW_N=241;
function bowModel(st){
  const nRed=dropIndex(st.lamNm);                 /* the RELATIVE index */
  const nW=indexOf(1.333,st.lamNm), nA=indexOf(1.000293,st.lamNm);
  const th=[],devs={};
  for(let i=0;i<BOW_N;i++) th.push(1e-4+(PI/2-2e-4)*i/(BOW_N-1));
  for(const k of [1,2]) devs[k]=th.map(t=>rainDev(nRed,k,t)*RAD);
  const bows={};
  for(const k of [1,2]){
    bows[k]={ths:{},ang:{}};
    for(const l of [400,450,500,550,600,650,700]){
      const n=dropIndex(l);
      bows[k].ths[l]=rainTheta(n,k);
      bows[k].ang[l]=bowAngle(n,k)*RAD;
    }
  }
  const thStar=rainTheta(nRed,st.bowK);
  return {n:nRed,nW:nW,nA:nA,th:th,devs:devs,bows:bows,thStar:thStar,
          devStar:rainDev(nRed,st.bowK,thStar)*RAD,
          angStar:bowAngle(nRed,st.bowK)*RAD,
          thr:Math.asin(nA*Math.sin(thStar)/nW),
          tc:criticalAngle(nW,nA),
          through:bowThroughput(nA,nW,st.bowK,thStar,st.bowPol),
          Rs:bowRsExact(st.bowK),Rp:bowRpExact(st.bowK,nRed),
          gap:bowAngle(nRed,2)*RAD-bowAngle(nRed,1)*RAD};
}

/* ----------------------------------------------------------- the model */
function buildModel(st){
  st=st||ST;
  const key=[st.view,st.topSub,st.topN,st.botSub,st.botN,st.angDeg,st.lamNm,st.white,st.bowRays,st.paintField,st.phase,
             st.laserOn,st.pol,st.envSub,st.envN,st.prismSub,st.prismN,st.prismId,
             st.prismRot,st.beamY,st.beamTilt,st.manyRays,st.showReflections,
             st.prismApex,st.bowK,st.bowPol].join('|');
  return memo('model',key,()=>{
    const M={view:st.view};
    M.b=boundaryModel(st);
    /* the expensive parts are lazy: a sweep that never opens the prism view
       must not pay for a trace (Known-bad: a slow suite is one that does not
       get mutation-tested) */
    let _p=null,_f=null,_s=null,_w=null;
    Object.defineProperty(M,'prism',{get(){ return _p||(_p=prismModel(st)); }});
    Object.defineProperty(M,'fres',{get(){ return _f||(_f=fresnelCurves(M.b.n1,M.b.n2)); }});
    Object.defineProperty(M,'spec',{get(){ return _s||(_s=spectrumCurves(st)); }});
    Object.defineProperty(M,'bow',{get(){ return _w||(_w=bowModel(st)); }});
    M.wave=waveState(M.b.n1,M.b.n2,M.b.th1,M.b.lam);
    return M;
  });
}

/* ================================================================== *
 *  the readout                                                        *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function row(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function pct(x){ return fmt(100*x,2)+'%'; }

function boundReadout(M,st){
  const B=M.b;
  let s='<div class="rname">the boundary<small>PhET&rsquo;s Intro screen</small></div><table>';
  s+=hd('the media');
  s+=row('above',isMystery(st.topSub)?'Mystery A or B':fmt(B.n1,5));
  s+=row('below',isMystery(st.botSub)?'Mystery A or B':fmt(B.n2,5));
  s+=hd('angles');
  s+=row('incidence &theta;<sub>1</sub>',fmt(st.angDeg,2)+'&deg;');
  s+=row('reflection',fmt(st.angDeg,2)+'&deg;');
  s+=row('refraction &theta;<sub>2</sub>',isFinite(B.th2)?fmt(B.th2*RAD,2)+'&deg;':'none',
         isFinite(B.th2)?'good':'bad');
  s+=row('critical angle',isFinite(B.tc)?fmt(B.tc*RAD,2)+'&deg;':'&mdash;');
  s+=row('Brewster angle',fmt(B.tb*RAD,2)+'&deg;');
  s+=hd('the power, '+(st.pol==='s'?'s-polarised':st.pol==='p'?'p-polarised':'unpolarised'));
  s+=row('reflected R',pct(B.R),B.R>0.5?'bad':'');
  s+=row('transmitted T',pct(B.T),'good');
  s+=row('R + T',fmt(B.R+B.T,10),'good');
  s+=hd('inside the media');
  s+=row('&lambda; above',fmt(B.lam1,1)+' nm');
  s+=row('&lambda; below',fmt(B.lam2,1)+' nm');
  s+=row('v above',fmt(1/B.n1,4)+' c');
  s+=row('v below',fmt(1/B.n2,4)+' c');
  s+='</table>';
  s+='<div class="note">'+(B.tir
      ? '<b>Total internal reflection.</b> Past '+fmt(B.tc*RAD,2)+'&deg; there is no angle whose sine is '
        +'n<sub>1</sub>sin&theta;<sub>1</sub>/n<sub>2</sub>, so the whole beam comes back.'
      : 'PhET&rsquo;s intensity meter reads the <b>s</b>-polarised reflectance; the chips switch it to p '
        +'or to the unpolarised average, which is what an ordinary lamp gives.')+'</div>';
  return s;
}
function waveReadout(M,st){
  const B=M.b, W=M.wave;
  const rA=cAbs(W.f.rRe,W.f.rIm), tA=cAbs(W.f.tRe,W.f.tIm);
  let s='<div class="rname">the wave<small>PhET&rsquo;s wave view and More Tools</small></div><table>';
  s+=hd('the meters');
  s+=row('speed above',fmt(1/B.n1,4)+' c');
  s+=row('speed below',fmt(1/B.n2,4)+' c');
  s+=row('&lambda; above',fmt(B.lam1,1)+' nm');
  s+=row('&lambda; below',fmt(B.lam2,1)+' nm');
  s+=row('frequency',sigf(B.freq,5)+' Hz','good');
  s+=hd('the field, s-polarised');
  s+=row('|r|',fmt(rA,5));
  s+=row('|t|',fmt(tA,5));
  s+=row('1 + r &minus; t',fmt(W.f.rRe+1-W.f.tRe,10),'good');
  s+=row('crest spacing along y = 0',fmt(B.lam1/Math.max(Math.sin(B.th1),1e-9),1)+' nm');
  s+=row('same, from below',isFinite(B.th2)?fmt(B.lam2/Math.max(Math.sin(B.th2),1e-9),1)+' nm':'&mdash;','good');
  if(B.tir){
    s+=hd('the evanescent tail');
    s+=row('decay length 1/&kappa;',fmt(B.lam/(TAU*W.f.kap),1)+' nm','bad');
    s+=row('phase of r',fmt(cArg(W.f.rRe,W.f.rIm),4)+' rad');
  }
  s+='</table>';
  s+='<div class="note">The frequency is the same on both sides &mdash; it is set by the source. '
    +'What changes is the speed, and therefore the wavelength. '
    +(B.tir?'<b>Past the critical angle</b> the field does not stop at the boundary: it leaks in and dies '
            +'exponentially, carrying no power away. PhET draws nothing there.'
           :'The crest spacing along the boundary is the same measured from either side. That single '
            +'sentence is Snell&rsquo;s law.')+'</div>';
  return s;
}
function prismReadout(M,st){
  const P=M.prism;
  const nSegs=P.bundles.reduce((a,b)=>a+b.tr.segs.length,0);
  let s='<div class="rname">the prism<small>PhET&rsquo;s Prisms screen</small></div><table>';
  s+=hd('the optics');
  s+=row('environment',isMystery(st.envSub)?'Mystery A or B':fmt(P.nOut,5));
  s+=row('prism',isMystery(st.prismSub)?'Mystery A or B':fmt(P.nIn,5));
  s+=row('critical angle',isFinite(P.tc)?fmt(P.tc*RAD,2)+'&deg;':'&mdash;');
  s+=row('rays traced',P.bundles.length);
  s+=row('segments drawn',nSegs,nSegs>0?'good':'bad');
  if(st.prismId==='triangle'){
    const Dm=prismMinDeviation(P.nOut,P.nIn,P.apex);
    s+=hd('the equilateral prism');
    s+=row('apex angle A','60.00&deg;');
    s+=row('minimum deviation',isFinite(Dm)?fmt(Dm*RAD,3)+'&deg;':'trapped',isFinite(Dm)?'good':'bad');
    s+=row('at &theta;<sub>1</sub>',isFinite(Dm)?fmt((P.apex+Dm)/2*RAD,3)+'&deg;':'&mdash;');
    s+=row('2&theta;<sub>c</sub> (the apex it can pass)',
           isFinite(P.tc)?fmt(2*P.tc*RAD,2)+'&deg;':'&mdash;',
           isFinite(P.tc)&&2*P.tc<P.apex?'bad':'good');
  }
  if(st.white){
    const d4=prismDeviation(envIndex(st,400),prismIndex(st,400),60*DEG,45*DEG);
    const d7=prismDeviation(envIndex(st,700),prismIndex(st,700),60*DEG,45*DEG);
    s+=hd('dispersion at 45&deg; through 60&deg;');
    s+=row('400 nm',isFinite(d4)?fmt(d4*RAD,3)+'&deg;':'trapped');
    s+=row('700 nm',isFinite(d7)?fmt(d7*RAD,3)+'&deg;':'trapped');
    s+=row('spread',isFinite(d4)&&isFinite(d7)?fmt((d4-d7)*RAD,3)+'&deg;':'&mdash;','good');
  }
  s+='</table>';
  s+='<div class="note">Every face is met with the exact intersection and vector Snell. '
    +'PhET&rsquo;s own limits are kept: at most '+PHET.maxSteps+' segments, and a branch is dropped once '
    +'its power falls below '+PHET.powerMin+'.</div>';
  return s;
}
function fresReadout(M,st){
  const B=M.b;
  let s='<div class="rname">the reflected fraction<small>the Fresnel equations, drawn</small></div><table>';
  s+=hd('at &theta;<sub>1</sub> = '+fmt(st.angDeg,2)+'&deg;');
  s+=row('R<sub>s</sub>',pct(B.f.Rs));
  s+=row('R<sub>p</sub>',pct(B.f.Rp));
  s+=row('R unpolarised',pct(0.5*(B.f.Rs+B.f.Rp)));
  s+=row('T<sub>s</sub>',pct(B.f.Ts));
  s+=row('T<sub>p</sub>',pct(B.f.Tp));
  s+=row('R<sub>s</sub> + T<sub>s</sub> &minus; 1',fmt(B.f.Rs+B.f.Ts-1,12),'good');
  s+=row('R<sub>p</sub> + T<sub>p</sub> &minus; 1',fmt(B.f.Rp+B.f.Tp-1,12),'good');
  s+=hd('the two special angles');
  s+=row('Brewster &theta;<sub>B</sub>',fmt(B.tb*RAD,3)+'&deg;');
  s+=row('R<sub>p</sub> there',sigf(fresnel(B.n1,B.n2,B.tb).Rp,3),'good');
  s+=row('&theta;<sub>B</sub> + &theta;<sub>2</sub>',
         fmt((B.tb+refractAngle(B.n1,B.n2,B.tb))*RAD,8)+'&deg;','good');
  s+=row('critical &theta;<sub>c</sub>',isFinite(B.tc)?fmt(B.tc*RAD,3)+'&deg;':'&mdash; (n<sub>2</sub> &gt; n<sub>1</sub>)');
  s+=row('R at &theta;<sub>c</sub>',isFinite(B.tc)?fmt(fresnel(B.n1,B.n2,B.tc).Rs,10):'&mdash;',
         isFinite(B.tc)?'good':'');
  s+=row('R at 0&deg;',pct(fresnel(B.n1,B.n2,0).Rs));
  s+=row('((n<sub>1</sub>&minus;n<sub>2</sub>)/(n<sub>1</sub>+n<sub>2</sub>))<sup>2</sup>',
         pct(Math.pow((B.n1-B.n2)/(B.n1+B.n2),2)),'good');
  s+='</table>';
  s+='<div class="note">R + T = 1 is not an approximation and not a normalisation: it is what the '
    +'boundary conditions give, once the transmitted power is counted with the factor '
    +'(n<sub>2</sub> cos&theta;<sub>2</sub>)/(n<sub>1</sub> cos&theta;<sub>1</sub>) that the change of '
    +'beam width and speed demands.</div>';
  return s;
}
function specReadout(M,st){
  const S=M.spec;
  let s='<div class="rname">the spectrum<small>PhET&rsquo;s dispersion model</small></div><table>';
  s+=hd('index at 400 / 650 / 700 nm');
  for(const id of ['water','glass','diamond']){
    const n=subById(id).n;
    s+=row(id,fmt(indexOf(n,400),4)+' / '+fmt(indexOf(n,650),4)+' / '+fmt(indexOf(n,700),4));
  }
  s+=hd('the blend');
  s+=row('BK7 at 650 nm',fmt(sellmeier(650*NM),6));
  s+=row('air at 650 nm',fmt(airIndex(650*NM),8));
  s+=row('BK7 n<sub>d</sub>',fmt(sellmeier(587.5618*NM),6),'good');
  s+=row('BK7 Abbe V<sub>d</sub>',fmt((sellmeier(587.5618*NM)-1)/(sellmeier(486.1327*NM)-sellmeier(656.2725*NM)),4),'good');
  s+=row('blend weight, glass',fmt(blendFraction(1.5),6));
  s+=row('blend weight, diamond',fmt(blendFraction(2.419),6),'bad');
  s+=hd('a '+fmt(st.prismApex,0)+'&deg; prism');
  s+=row('entry angle',fmt(S.thIn*RAD,3)+'&deg;');
  const d4=S.dev[fnIdx(S.lam,400)], d7=S.dev[fnIdx(S.lam,700)];
  s+=row('deviation at 400 nm',isFinite(d4)?fmt(d4*RAD,3)+'&deg;':'trapped',isFinite(d4)?'':'bad');
  s+=row('deviation at 700 nm',isFinite(d7)?fmt(d7*RAD,3)+'&deg;':'trapped',isFinite(d7)?'':'bad');
  s+=row('violet &minus; red',isFinite(d4)&&isFinite(d7)?fmt((d4-d7)*RAD,3)+'&deg;':'&mdash;','good');
  s+='</table>';
  s+='<div class="note">PhET&rsquo;s dispersion is <b>not</b> a fit to each material. It is one curve &mdash; '
    +'BK7 glass &mdash; blended with air so that the result passes through the index you asked for at '
    +'650 nm. Diamond needs a weight of '+fmt(blendFraction(2.419),3)+', i.e. nearly three times BK7&rsquo;s '
    +'own dispersion, so its spread is a model, not a measurement.</div>';

}
function fnIdx(arr,x){ let bi=0,bd=Infinity; for(let i=0;i<arr.length;i++){ const d=Math.abs(arr[i]-x); if(d<bd){bd=d;bi=i;} } return bi; }

function bowReadout(M,st){
  const W=M.bow;
