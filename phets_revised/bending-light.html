/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}
/* the fluid: a translucent slab from ybot up to the surface yw across [x0, x1] */
function fluidRect(ctx,map,x0,x1,ybot,yw,col){
  const X0=map.X(x0), X1=map.X(x1), Y0=map.Y(yw), Y1=map.Y(ybot);
  ctx.fillStyle=col||rgba(COL.struct,0.16); ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle=rgba(COL.struct,0.8); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y0); ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y0);
}
/* a force arrow whose world length is len x (F / Fref), with its label */
function forceArrow(ctx,W,H,map,at,F,Fref,dir,len,col,txt,labDx){
  const v=[0,dir*len*Math.min(Math.abs(F)/Math.max(Fref,1e-12),1.6)];
  arrowW(ctx,map,at,v,col,2);
  const tip=[at[0]+v[0],at[1]+v[1]];
  if(txt) lab(ctx,W,H,map.X(tip[0])+(labDx===undefined?8:labDx),map.Y(tip[1]),txt,col,LAB_FONT,labDx!==undefined&&labDx<0?'right':'left');
}

/* ================================================================== *
 *  drawing helpers particular to this sim, then THE BOUNDARY and      *
 *  THE WAVE                                                           *
 * ================================================================== */
const WORLD={xmin:-31,xmax:31,ymin:-21.7,ymax:21.7};     /* PhET's model bounds, in red wavelengths */
/* the wave world is wide and shallow so that it FILLS the stage: a box of
   the boundary view's aspect leaves two thirds of the width empty and makes
   every wavelength three times smaller than it needs to be */
const WAVE_WORLD={xmin:-14,xmax:14,ymin:-5,ymax:5};
let PICKS=[];                                             /* what the last draw made draggable */

/* The house #hint is HTML at bottom:11px and the canvas capture cannot see it,
   so a caption anchored at H-12 sits underneath it (wave-on-a-string
   Known-bad).  Every layout here reserves HINT_H at the bottom. */
function stageLayoutH(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  return stageLayout(ctx,W,H-HINT_H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow);
}
/* a short plot cannot carry five y labels without them colliding */
function nyFor(b){ return b.h<110?3:(b.h<170?4:5); }
/* a note under a panel lands on the axis label or on the caption; put it
   inside the box, where lab() can dodge whatever is already there */
function noteIn(ctx,W,H,b,txt,col){ lab(ctx,W,H,b.x+b.w/2,b.y1-11,txt,col||COL.dim,SM_FONT,'center'); }
/* axes() draws its tick labels with raw fillText, so the registry does not
   know about them and a note nudged downward by lab() lands on the x ticks
   (the neural_playground Known-bad, one panel in).  axesRB registers the two
   tick strips: the row under the box and the column to its left. */
function axesRB(ctx,b,xlo,xhi,ylo,yhi,opt){
  axesR(ctx,b,xlo,xhi,ylo,yhi,opt);
  LABELS.push([b.x,b.y1,b.x1,b.y1+34]);
  LABELS.push([b.x-46,b.y-8,b.x,b.y1+8]);
}
/* legendAuto records its box in LEGEND_RECTS, which lab() does not consult —
   so a note placed afterwards lands on top of it.  Register it in LABELS too. */
function legendA(ctx,b,items){
  const lb=legendAuto(ctx,b,items);
  if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]);
  return lb;
}

/* a ray from `p` along the unit vector `d`, of world length L, CLIPPED in
   data space to the world box (the house rule: never ctx.clip, because the
   display-list recorder treats it as a no-op and the audit would still lie) */
function rayW(ctx,map,p,d,L,col,lw,ext){
  segW(ctx,map,p,[p[0]+L*d[0],p[1]+L*d[1]],ext||WORLD,col,lw);
}
function segW(ctx,map,a,b,ext,col,lw,dash){
  const c=clipSegY(a[0],a[1],b[0],b[1],ext.ymin,ext.ymax,ext.xmin,ext.xmax);
  if(!c) return;
  seg(ctx,map,[c[0],c[1]],[c[2],c[3]],col,lw,dash);
}
/* a dashed arc from angle a0 to a1 (radians, measured from +x, world frame) */
function arcW(ctx,map,c,r,a0,a1,col,lw){
  const n=Math.max(6,Math.round(Math.abs(a1-a0)*26));
  const xs=[],ys=[];
  for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; xs.push(c[0]+r*Math.cos(a)); ys.push(c[1]+r*Math.sin(a)); }
  ctx.beginPath();
  for(let i=0;i<=n;i++){ const X=map.X(xs[i]),Y=map.Y(ys[i]); if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; ctx.stroke();
}
/* PhET's protractor: a half-circle of degree ticks centred on the origin,
   zero on the normal, drawn on whichever side the laser is */
function protractorW(ctx,W,H,map,r){
  ctx.strokeStyle=rgba(COL.dim,0.55); ctx.lineWidth=1;
  arcW(ctx,map,[0,0],r,0,TAU,rgba(COL.dim,0.45),1);
  for(let dgr=0;dgr<360;dgr+=5){
    const a=dgr*DEG, f=(dgr%15===0)?0.90:0.955;
    seg(ctx,map,[r*f*Math.cos(a),r*f*Math.sin(a)],[r*Math.cos(a),r*Math.sin(a)],
        rgba(COL.dim,dgr%15===0?0.8:0.4),1);
  }
  for(let dgr=0;dgr<360;dgr+=30){
    const a=dgr*DEG, lbl=((dgr+270)%360);
    const from90=Math.abs(((lbl+180)%360)-180);
    lab(ctx,W,H,map.X(r*0.80*Math.cos(a)),map.Y(r*0.80*Math.sin(a)),
        fmt(from90,0)+'°',rgba(COL.dim,0.9),SM_FONT,'center');
  }
}
/* the laser body: a barrel pointing along d, ending at the origin.  `kind`
   is what a drag on it does -- swing the beam ('laser') or slide it ('beam'). */
function laserW(ctx,map,d,on,kind,sc,at,gap){
  const k=sc===undefined?1:sc, A=at||[0,0], g=gap===undefined?5.2:gap;
  const back=[A[0]-14*k*d[0],A[1]-14*k*d[1]], front=[A[0]-g*k*d[0],A[1]-g*k*d[1]];
  const perp=[-d[1],d[0]], w=1.9*k;
  const quad=[[back[0]+perp[0]*w,back[1]+perp[1]*w],[front[0]+perp[0]*w,front[1]+perp[1]*w],
              [front[0]-perp[0]*w,front[1]-perp[1]*w],[back[0]-perp[0]*w,back[1]-perp[1]*w]];
  worldPoly(ctx,map,quad,on?'#2b3446':'#1b2130',COL.live,1.6);
  const knob=[[back[0]+perp[0]*w*1.5,back[1]+perp[1]*w*1.5],
              [back[0]-perp[0]*w*1.5,back[1]-perp[1]*w*1.5],
              [back[0]-d[0]*1.6*k-perp[0]*w*1.5,back[1]-d[1]*1.6*k-perp[1]*w*1.5],
              [back[0]-d[0]*1.6*k+perp[0]*w*1.5,back[1]-d[1]*1.6*k+perp[1]*w*1.5]];
  worldPoly(ctx,map,knob,COL.live,null,1);
  PICKS.push({kind:kind||'laser',x:map.X(back[0]),y:map.Y(back[1]),r:26});
}

/* ---------------------------------------------------------- the boundary */
function boundGeo(ctx,W,H,M,st){
  const capFull='The world is PhET’s own: '+PHET.modelW+' × '+fmt(PHET.modelH,1)
    +' red wavelengths across, i.e. '+fmt(PHET.modelW*PHET.lamRed/1000,1)+' × '
    +fmt(PHET.modelH*PHET.lamRed/1000,1)+' µm — the sim is a few tens of wavelengths wide, '
    +'which is why the wave view works at all. Ray thickness and opacity carry the power fraction; '
    +'the light is drawn in the true colour of its wavelength (CIE 1931). Angles are measured from '
    +'the normal, never from the surface.';
  const capShort='PhET’s world, '+PHET.modelW+' red wavelengths wide. Ray opacity carries power.';
  const L=stageLayoutH(ctx,W,H,capFull,capShort,0,0,0);
  const map=worldFitUp(L.main,WORLD,1.5);
  return {L:L,map:map};
}
function drawBound(ctx,W,H,M,st){
  const G=boundGeo(ctx,W,H,M,st), L=G.L, map=G.map, B=M.b;
  /* the two media */
  const X0=map.X(WORLD.xmin),X1=map.X(WORLD.xmax),Ytop=map.Y(WORLD.ymax),Ymid=map.Y(0),Ybot=map.Y(WORLD.ymin);
  ctx.fillStyle=mediumFill(B.n1); ctx.fillRect(X0,Ytop,X1-X0,Ymid-Ytop);
  ctx.fillStyle=mediumFill(B.n2); ctx.fillRect(X0,Ymid,X1-X0,Ybot-Ymid);
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(X0,Ymid); ctx.lineTo(X1,Ymid); ctx.stroke();
  POLY_SEGS.push(X0,Ymid,X1,Ymid);
  frame(ctx,box(X0,Ytop,X1-X0,Ybot-Ytop),COL.edge);
  if(st.showProtractor) protractorW(ctx,W,H,map,17);
  /* the normal */
  if(st.showNormal){
    seg(ctx,map,[0,WORLD.ymin*0.92],[0,WORLD.ymax*0.92],rgba(COL.norm,0.8),1.2,[5,4]);
    lab(ctx,W,H,map.X(0)+7,map.Y(WORLD.ymax*0.86),'normal',rgba(COL.norm,0.95),SM_FONT,'left');
  }
  /* the laser and its rays */
  laserW(ctx,map,B.dIn,st.laserOn);
  if(st.laserOn){
    const wls=st.white?WHITE_WL:[st.lamNm];
    if(st.white){
      /* the incident and reflected rays are the SAME line for every
         wavelength — reflection does not disperse — so they are drawn once,
         white.  Only the transmitted ray fans out, and that fan is drawn one
         wavelength at a time. */
      const b0=boundaryModel(st,550);
      rayW(ctx,map,[-5.2*b0.dIn[0],-5.2*b0.dIn[1]],b0.dIn,5.2,'rgba(255,255,255,0.92)',3.0);
      if(drawsReflected(b0.R))
        rayW(ctx,map,[0,0],b0.dRefl,60,'rgba(255,255,255,'+fmt(clamp(0.25+0.7*Math.sqrt(b0.R),0,1),3)+')',
             1.2+2.4*Math.sqrt(b0.R));
      for(const lam of wls){
        const b=boundaryModel(st,lam);
        if(b.dTrans) rayW(ctx,map,[0,0],b.dTrans,60,beamCss(st,lam,b.T),1.5);
      }
    } else for(const lam of wls){
      const b=boundaryModel(st,lam);
      rayW(ctx,map,[-5.2*b.dIn[0],-5.2*b.dIn[1]],b.dIn,5.2,beamCss(st,lam,1),3.0);
      if(drawsReflected(b.R))
        rayW(ctx,map,[0,0],b.dRefl,60,beamCss(st,lam,b.R),1.2+2.4*Math.sqrt(b.R));
      if(b.dTrans)
        rayW(ctx,map,[0,0],b.dTrans,60,beamCss(st,lam,b.T),1.2+2.4*Math.sqrt(b.T));
    }
  }
  /* the angle arcs */
  if(st.showAngles&&st.laserOn){
    const r=9.5;
    arcW(ctx,map,[0,0],r,PI/2,PI/2+B.th1,COL.arc,1.3);
    lab(ctx,W,H,map.X(r*1.16*Math.cos(PI/2+B.th1/2)),map.Y(r*1.16*Math.sin(PI/2+B.th1/2)),
        fmt(st.angDeg,1)+'°',COL.arc,LAB_FONT,'center');
    arcW(ctx,map,[0,0],r*0.78,PI/2-B.th1,PI/2,rgba(COL.arc,0.7),1.1);
    if(isFinite(B.th2)){
      arcW(ctx,map,[0,0],r,-PI/2,-PI/2+B.th2,COL.pos,1.3);
      lab(ctx,W,H,map.X(r*1.2*Math.cos(-PI/2+B.th2/2)),map.Y(r*1.2*Math.sin(-PI/2+B.th2/2)),
          fmt(B.th2*RAD,1)+'°',COL.pos,LAB_FONT,'center');
    }
  }
  /* the critical-angle marker, on the incoming side */
  if(isFinite(B.tc)){
    const d=[Math.sin(B.tc),Math.cos(B.tc)];
    segW(ctx,map,[0,0],[-24*d[0],24*d[1]],WORLD,rgba(COL.ref,0.55),1.1,[4,5]);
    lab(ctx,W,H,map.X(-22*d[0]),map.Y(22*d[1]),'θc = '+fmt(B.tc*RAD,1)+'°',
        rgba(COL.ref,0.95),SM_FONT,'left');
  }
  /* the media names */
  lab(ctx,W,H,X0+9,Ytop+13,subLabel(st.topSub,B.n1),rgba(COL.struct,0.95),LAB_FONT,'left');
  lab(ctx,W,H,X0+9,Ybot-13,subLabel(st.botSub,B.n2),rgba(COL.struct,0.95),LAB_FONT,'left');
  /* PhET's intensity meter */
  if(st.showMeter&&st.laserOn) meterBox(ctx,W,H,map,B,st);
  if(B.tir)
    lab(ctx,W,H,(X0+X1)/2,Ytop+15,'total internal reflection — nothing is transmitted',
        COL.ref,LAB_FONT,'center');
  if(st.white&&st.laserOn)
    lab(ctx,W,H,(X0+X1)/2,Ytop+31,(X1-X0)<620
        ? 'white: only the transmitted fan disperses'
        : 'white: the incident and reflected rays are one line for every wavelength '
          +'— only the transmitted fan disperses',COL.dim,SM_FONT,'center');
  drawCaption(ctx,L);
}
/* PhET's intensity meter: a probe on the reflected ray and a body reading a
   percentage.  PhET reads the s-polarised reflectance; the chips switch it. */
function meterBox(ctx,W,H,map,B,st){
  const d=B.dRefl, probe=[13*d[0],13*d[1]];
  dot(ctx,map.X(probe[0]),map.Y(probe[1]),5,rgba(COL.live,0.85),'#fff',1.2);
  const w=126,h=56, PX=map.X(probe[0]), PY=map.Y(probe[1]);
  /* four candidate corners; take the first that no label already occupies
     (at normal incidence the probe sits on the normal line and its label) */
  let x=clamp(PX+12,4,W-w-4), y=clamp(PY-56,stageTop()+2,H-h-HINT_H-4);
  for(const [dx,dy] of [[12,-56],[-w-12,-56],[12,10],[-w-12,10],[12,-116],[-w-12,-116]]){
    const cx=clamp(PX+dx,4,W-w-4), cy=clamp(PY+dy,stageTop()+2,H-h-HINT_H-4);
    if(labFits([cx,cy,cx+w,cy+h])){ x=cx; y=cy; break; }
  }
  LABELS.push([x,y,x+w,y+h]);
  ctx.fillStyle='rgba(10,12,18,.86)'; ctx.fillRect(x,y,w,h);
  frame(ctx,box(x,y,w,h),COL.edge2||'#2a2f3d');
  ctx.fillStyle=COL.dim; ctx.font=SM_FONT; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('intensity, reflected',x+7,y+5);
  ctx.fillStyle=COL.pos; ctx.font='italic 19px Georgia, serif';
  ctx.fillText(fmt(100*B.R,1)+'%',x+7,y+18);
  ctx.fillStyle=COL.dim; ctx.font=SM_FONT;
  ctx.fillText(st.pol==='s'?'s-polarised (PhET’s reading)':st.pol==='p'?'p-polarised':'unpolarised',
               x+7,y+42);
}

/* -------------------------------------------------------------- the wave */
function waveGeo(ctx,W,H,M,st){
  const capFull='Crest lines, drawn where the phase is a whole number of cycles. The construction is the '
    +'whole of Snell’s law: the crests must meet along the boundary, so the spacing they cut there — '
    +'λ/sinθ — has to be the same measured from either side. The field is painted from the exact '
    +'s-polarised amplitudes, so the standing pattern above the boundary and the travelling wave below '
    +'are the real ones, not a sketch. World: '+fmt(WAVE_WORLD.xmax*2,0)+' red wavelengths wide.';
  const capShort='Crest lines and the exact s-polarised field. The crest spacing along the boundary is Snell’s law.';
  const L=stageLayoutH(ctx,W,H,capFull,capShort,2,0.34,1);
  const map=worldFitUp(L.main,WAVE_WORLD,0.3);
  return {L:L,map:map};
}
function drawWave(ctx,W,H,M,st){
  const G=waveGeo(ctx,W,H,M,st), L=G.L, map=G.map, B=M.b, Wv=M.wave;
  const ph=st.phase;
  const X0=map.X(WAVE_WORLD.xmin),X1=map.X(WAVE_WORLD.xmax);
  const Ytop=map.Y(WAVE_WORLD.ymax),Ymid=map.Y(0),Ybot=map.Y(WAVE_WORLD.ymin);
  ctx.fillStyle=mediumFill(B.n1); ctx.fillRect(X0,Ytop,X1-X0,Ymid-Ytop);
  ctx.fillStyle=mediumFill(B.n2); ctx.fillRect(X0,Ymid,X1-X0,Ybot-Ytop>0?Ybot-Ymid:0);
  /* The background is the TIME-AVERAGED intensity, which depends on y alone:
     above the boundary it is the standing-wave pattern the incident and
     reflected waves make, below it the constant (or exponentially decaying)
     intensity of the transmitted wave.  Painting the instantaneous field on a
     cell grid instead aliased into a checkerboard and drowned the crest lines
     it was supposed to sit behind. */
  if(st.paintField){
    const rgb=monoLinear(st.lamNm);
    let mx=1e-9;
    const rows=Math.max(40,Math.min(220,Math.round(Ybot-Ytop)));
    const vals=[];
    for(let i=0;i<rows;i++){
      const y=map.wy(Ytop+(i+0.5)*(Ybot-Ytop)/rows);
      const v=meanIntensity(Wv,y); vals.push(v); mx=Math.max(mx,v);
    }
    for(let i=0;i<rows;i++){
      /* dim: the crest lines are drawn in the same hue on top of it, and a
         bright wash swallows them */
      ctx.fillStyle=cssOfLinear(rgb,0.05+0.23*clamp(vals[i]/mx,0,1));
      ctx.fillRect(X0,Ytop+i*(Ybot-Ytop)/rows,X1-X0,(Ybot-Ytop)/rows+1);
    }
  }
  /* the crest lines: exact loci of phase = 2 pi m */
  const kx=Wv.k0*Wv.n1*Math.sin(B.th1);
  crestFamily(ctx,map,B.dIn,Wv.k0*Wv.n1,ph,0,WAVE_WORLD.ymax,st,1.0,'in');
  const rA=cAbs(Wv.f.rRe,Wv.f.rIm), rP=cArg(Wv.f.rRe,Wv.f.rIm);
  if(rA>0.02) crestFamily(ctx,map,B.dRefl,Wv.k0*Wv.n1,ph-rP,0,WAVE_WORLD.ymax,st,rA,'refl');
  if(B.dTrans){
    const tA=cAbs(Wv.f.tRe,Wv.f.tIm), tP=cArg(Wv.f.tRe,Wv.f.tIm);
    crestFamily(ctx,map,B.dTrans,Wv.k0*Wv.n2,ph-tP,WAVE_WORLD.ymin,0,st,tA,'trans');
  } else if(st.showEvanescent){
    /* the evanescent tail: crests run PARALLEL to the boundary's normal
       direction of travel (straight down the x axis) and decay with depth */
    const dec=Wv.k0*Wv.f.kap;
    for(let m=-40;m<=40;m++){
      const x0=(TAU*m+ph-cArg(Wv.f.tRe,Wv.f.tIm))/kx;
      if(!isFinite(x0)||x0<WAVE_WORLD.xmin||x0>WAVE_WORLD.xmax) continue;
      const depth=Math.min(WAVE_WORLD.ymax,3/Math.max(dec,1e-6));
      seg(ctx,map,[x0,0],[x0,-depth],rgba('#e8843a',0.5),1.2,[3,3]);
    }
    lab(ctx,W,H,(X0+X1)/2,Ymid+38,'evanescent — decays in '+fmt(B.lam/(TAU*Wv.f.kap),0)
        +' nm, carries no power',COL.ref,SM_FONT,'center');
  }
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(X0,Ymid); ctx.lineTo(X1,Ymid); ctx.stroke();
  /* the laser, drawn at a quarter size because this world is a fifth as wide */
  laserW(ctx,map,B.dIn,true,'laser',0.28);
  rayW(ctx,map,[-1.5*B.dIn[0],-1.5*B.dIn[1]],B.dIn,1.5,beamCss(st,st.lamNm,1),2.4);
  /* the crest marks the two media cut on the boundary: they coincide */
  const dx1=B.lam1/PHET.lamRed/Math.max(Math.sin(B.th1),1e-9);
  {
    /* one tick per crest, but only while they are far enough apart to read as
       ticks rather than as a comb */
    const stepPx=Math.abs(TAU/kx)*map.s;
    const every=Math.max(1,Math.ceil(13/Math.max(stepPx,1e-6)));
    if(stepPx>2.5) for(let m=-200;m<=200;m++){
      if(m%every!==0) continue;
      const x=(TAU*m+ph)/kx;
      if(!isFinite(x)||x<WAVE_WORLD.xmin||x>WAVE_WORLD.xmax) continue;
      seg(ctx,map,[x,-0.30],[x,0.30],COL.pos,2.0);
    }
  }
  frame(ctx,box(X0,Ytop,X1-X0,Ybot-Ytop),COL.edge);
  lab(ctx,W,H,X0+9,Ytop+13,subLabel(st.topSub,B.n1)+'  λ = '+fmt(B.lam1,0)+' nm',
      rgba(COL.struct,0.95),LAB_FONT,'left');
  lab(ctx,W,H,X0+9,Ybot-13,subLabel(st.botSub,B.n2)+'  λ = '+fmt(B.lam2,0)+' nm',
      rgba(COL.struct,0.95),LAB_FONT,'left');
  lab(ctx,W,H,X1-9,Ymid-26,st.angDeg<1
      ? 'at normal incidence the crests run along the boundary'
      : 'crest spacing along the boundary '+fmt(B.lam1/Math.sin(B.th1),0)+' nm',
      COL.pos,SM_FONT,'right');
  /* the two lower panels */
  if(L.bottom.length>=1) waveProfile(ctx,W,H,L.bottom[0],M,st);
  if(L.bottom.length>=2) waveSensor(ctx,W,H,L.bottom[1],M,st);
  drawCaption(ctx,L);
}
/* one family of crest lines: the loci k.r = 2 pi m + ph, clipped to a y band */
function crestFamily(ctx,map,d,k,ph,ylo,yhi,st,amp,kind){
  const col=cssOfLinear(monoLinear(st.lamNm),clamp(0.35+0.6*amp,0,1));
  const perp=[-d[1],d[0]];
  for(let m=-60;m<=60;m++){
    /* the crest line passes through the point s*d with k*s = 2 pi m + ph */
    const s=(TAU*m+ph)/k;
    const p=[s*d[0],s*d[1]];
    const xs=[],ys=[];
    for(const t of [-40,40]){ xs.push(p[0]+t*perp[0]); ys.push(p[1]+t*perp[1]); }
    /* clip to the y band in data space */
    const seg2=clipSegY(xs[0],ys[0],xs[1],ys[1],ylo,yhi,WAVE_WORLD.xmin,WAVE_WORLD.xmax);
    if(!seg2) continue;
    seg(ctx,map,[seg2[0],seg2[1]],[seg2[2],seg2[3]],col,kind==='in'?1.7:1.3);
  }
}
/* Liang-Barsky in data space (the house rule: clip data, never ctx.clip) */
function clipSegY(x0,y0,x1,y1,ylo,yhi,xlo,xhi){
  let t0=0,t1=1; const dx=x1-x0, dy=y1-y0;
  const ps=[[-dx,x0-xlo],[dx,xhi-x0],[-dy,y0-ylo],[dy,yhi-y0]];
  for(const pq of ps){
    const p=pq[0], q=pq[1];
    if(p===0){ if(q<0) return null; continue; }
    const t=q/p;
    if(p<0){ if(t>t1) return null; if(t>t0) t0=t; }
    else { if(t<t0) return null; if(t<t1) t1=t; }
  }
  if(t0>t1) return null;
  return [x0+t0*dx,y0+t0*dy,x0+t1*dx,y0+t1*dy];
}
/* the field along a vertical cut at x = 0 */
function waveProfile(ctx,W,H,b,M,st){
  const Wv=M.wave, B=M.b;
  const ys=[],es=[],ep=[],em=[];
  for(let i=0;i<=200;i++){
    const y=WAVE_WORLD.ymin+(WAVE_WORLD.ymax-WAVE_WORLD.ymin)*i/200;
    /* the envelope of the standing pattern: sqrt(2 <E^2>), which is what the
       painted background carries, so the two panels cannot drift apart */
    const a=Math.sqrt(2*Math.max(meanIntensity(Wv,y),0));
    ys.push(y); es.push(waveAt(Wv,0,y,st.phase)); ep.push(a); em.push(-a);
  }
  axesRB(ctx,b,-2,2,WAVE_WORLD.ymin,WAVE_WORLD.ymax,
        {title:titleFor(b,'the field on the cut x = 0','field at x = 0'),
         xlab:'E (s-polarised)',ylab:'y (red wavelengths)',nx:4,ny:nyFor(b),
         xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  polyline(ctx,b,[0,0],[WAVE_WORLD.ymin,WAVE_WORLD.ymax],-2,2,WAVE_WORLD.ymin,WAVE_WORLD.ymax,
           rgba(COL.dim,0.5),1,[4,4]);
  polyline(ctx,b,[-2,2],[0,0],-2,2,WAVE_WORLD.ymin,WAVE_WORLD.ymax,COL.struct,1.4);
  polyline(ctx,b,ep,ys,-2,2,WAVE_WORLD.ymin,WAVE_WORLD.ymax,COL.ref,1.3,[4,3]);
  polyline(ctx,b,em,ys,-2,2,WAVE_WORLD.ymin,WAVE_WORLD.ymax,COL.ref,1.3,[4,3]);
  polyline(ctx,b,es,ys,-2,2,WAVE_WORLD.ymin,WAVE_WORLD.ymax,COL.pos,1.6);
  lab(ctx,W,H,b.x+b.w/2,b.y1-11,(B.tir?'evanescent below':'travelling below')
      +' · orange: the envelope',COL.dim,SM_FONT,'center');
}
/* PhET's More Tools wave sensor: two probes, one each side, against time */
function waveSensor(ctx,W,H,b,M,st){
  const Wv=M.wave;
  const ts=[],e1=[],e2=[];
  for(let i=0;i<=240;i++){
    const t=i/240*2*TAU;
    ts.push(t/TAU); e1.push(waveAt(Wv,0,2.0,st.phase+t)); e2.push(waveAt(Wv,0,-2.0,st.phase+t));
  }
  axesRB(ctx,b,0,2,-2.1,2.1,
        {title:titleFor(b,'the wave sensor: two probes against time','two probes vs time'),
         xlab:'time (periods)',ylab:'E',nx:3,ny:nyFor(b),xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  polyline(ctx,b,[0,2],[0,0],0,2,-2.1,2.1,rgba(COL.dim,0.5),1,[4,4]);
  polyline(ctx,b,ts,e1,0,2,-2.1,2.1,COL.pos,1.6);
  polyline(ctx,b,ts,e2,0,2,-2.1,2.1,COL.live,1.6);
  legendA(ctx,b,[[COL.pos,'probe above, y = +2'],[COL.live,'probe below, y = −2']]);
  noteIn(ctx,W,H,b,'the same period on both sides');
}

/* ================================================================== *
 *  THE PRISM, THE REFLECTED FRACTION, THE SPECTRUM, THE RAINBOW       *
 * ================================================================== */
const PRISM_WORLD={xmin:-19,xmax:19,ymin:-13.3,ymax:13.3};

function prismGeo(ctx,W,H,M,st){
  const capFull='PhET’s five prism prototypes, at PhET’s own size — an equilateral triangle, '
    +'trapezoid and square of side 10 red wavelengths, and a circle and semicircle of radius 5. Every face '
    +'is met by exact intersection (a linear solve for a polygon edge, the stable quadratic root for an arc) '
    +'and crossed by vector Snell; where Snell has no solution the ray reflects instead. Segment opacity is '
    +'the power fraction. PhET’s limits are kept: '+PHET.maxSteps+' segments and a floor of '
    +PHET.powerMin+' on the power.';
  const capShort='PhET’s prism prototypes, traced by exact intersection and vector Snell.';
  const L=stageLayoutH(ctx,W,H,capFull,capShort,0,0,0);
  const map=worldFitUp(L.main,PRISM_WORLD,0.5);
  return {L:L,map:map};
}
function shapeOutline(sh,n){
  if(sh.kind==='poly') return sh.pts;
  const out=[];
  if(sh.kind==='circle'){ for(let i=0;i<=n;i++){ const a=TAU*i/n; out.push([sh.c[0]+sh.r*Math.cos(a),sh.c[1]+sh.r*Math.sin(a)]); } return out; }
  /* the semicircle: the diameter, then the arc on the `half` side */
  const a0=Math.atan2(sh.a[1]-sh.c[1],sh.a[0]-sh.c[0]);
  const a1=Math.atan2(sh.b[1]-sh.c[1],sh.b[0]-sh.c[0]);
  const mid=Math.atan2(sh.half[1],sh.half[0]);
  let s=a1, e=a0;
  /* walk from b to a the way that passes through the `half` direction */
  let span=e-s; while(span<0) span+=TAU; while(span>TAU) span-=TAU;
  let probe=s+span/2; let dmid=Math.atan2(Math.sin(probe-mid),Math.cos(probe-mid));
  if(Math.abs(dmid)>PI/2){ s=a0; e=a1; span=e-s; while(span<0) span+=TAU; }
  out.push(sh.a.slice());
  for(let i=0;i<=n;i++){ const a=s+span*i/n; out.push([sh.c[0]+sh.r*Math.cos(a),sh.c[1]+sh.r*Math.sin(a)]); }
  return out;
}
function drawPrism(ctx,W,H,M,st){
  const G=prismGeo(ctx,W,H,M,st), L=G.L, map=G.map, P=M.prism;
  const X0=map.X(PRISM_WORLD.xmin),X1=map.X(PRISM_WORLD.xmax);
  const Ytop=map.Y(PRISM_WORLD.ymax),Ybot=map.Y(PRISM_WORLD.ymin);
  ctx.fillStyle=mediumFill(P.nOut); ctx.fillRect(X0,Ytop,X1-X0,Ybot-Ytop);
  frame(ctx,box(X0,Ytop,X1-X0,Ybot-Ytop),COL.edge);
  if(st.showProtractor) protractorW(ctx,W,H,map,11);
  const outline=shapeOutline(P.shape,72);
  worldPoly(ctx,map,outline,mediumFill(P.nIn+0.7),COL.struct,1.6);
  /* the rays */
  if(st.laserOn&&st.white) for(const g of P.groups){
    /* white light: merged segments are drawn once in white, separated ones
       one wavelength at a time (see mergeMask) */
    const mask=mergeMask(g.map(b=>b.tr),map.s);
    const ref=g[Math.floor(g.length/2)];
    for(let k=0;k<mask.length;k++){
      const r=ref.tr.segs[k];
      if(mask[k]){
        segW(ctx,map,[r[0],r[1]],[r[2],r[3]],PRISM_WORLD,
             'rgba(255,255,255,'+fmt(clamp(0.25+0.7*Math.sqrt(clamp(r[4],0,1)),0,1),3)+')',
             1.2+1.8*Math.sqrt(clamp(r[4],0,1)));
      } else for(const bnd of g){
        const sg=bnd.tr.segs[k];
        segW(ctx,map,[sg[0],sg[1]],[sg[2],sg[3]],PRISM_WORLD,beamCss(st,bnd.lam,sg[4]),1.5);
      }
    }
    /* branches that only some wavelengths have: drawn individually */
    for(const bnd of g) for(let k=mask.length;k<bnd.tr.segs.length;k++){
      const sg=bnd.tr.segs[k];
      segW(ctx,map,[sg[0],sg[1]],[sg[2],sg[3]],PRISM_WORLD,beamCss(st,bnd.lam,sg[4]),1.2);
    }
  }
  if(st.laserOn&&!st.white) for(const bnd of P.bundles){
    for(const s of bnd.tr.segs){
      segW(ctx,map,[s[0],s[1]],[s[2],s[3]],PRISM_WORLD,beamCss(st,bnd.lam,s[4]),
           1.1+2.0*Math.sqrt(clamp(s[4],0,1)));
    }
    if(st.showNormals) for(let i=0;i<bnd.tr.segs.length-1;i++){
      const s=bnd.tr.segs[i], hit=[s[2],s[3]];
      const h=shapeHit(P.shape,[hit[0]-1e-6*(s[2]-s[0]),hit[1]-1e-6*(s[3]-s[1])],
                       [s[2]-s[0],s[3]-s[1]]);
      if(!h) continue;
      seg(ctx,map,[hit[0]-2.4*h.n[0],hit[1]-2.4*h.n[1]],[hit[0]+2.4*h.n[0],hit[1]+2.4*h.n[1]],
          rgba(COL.norm,0.55),1,[3,3]);
    }
  }
  /* the laser: a drag on it SLIDES the beam here, it does not swing it.  It
     is drawn AT the beam's own origin, so the beam leaves its barrel. */
  laserW(ctx,map,P.beam.d,st.laserOn,'beam',0.5,P.beam.origins[0],0.6);
  lab(ctx,W,H,X0+9,Ytop+13,'environment: '+subLabel(st.envSub,P.nOut),rgba(COL.struct,0.95),LAB_FONT,'left');
  lab(ctx,W,H,X0+9,Ytop+29,'prism: '+subLabel(st.prismSub,P.nIn),rgba(COL.struct,0.95),LAB_FONT,'left');
  if(isFinite(P.tc))
    lab(ctx,W,H,X0+9,Ytop+45,'critical angle inside: '+fmt(P.tc*RAD,2)+'°',COL.ref,LAB_FONT,'left');
  if(st.prismId==='triangle'){
    const Dm=prismMinDeviation(P.nOut,P.nIn,P.apex);
    lab(ctx,W,H,X1-9,Ytop+13,isFinite(Dm)
        ?'minimum deviation '+fmt(Dm*RAD,2)+'° at θ₁ = '+fmt((P.apex+Dm)/2*RAD,2)+'°'
        :'a 60° apex cannot pass this index: 2θc = '+fmt(2*P.tc*RAD,2)+'°',
        isFinite(Dm)?COL.pos:COL.ref,LAB_FONT,'right');
  }
  if(st.white)
    lab(ctx,W,H,X1-9,Ytop+29,WHITE_WL.length+' wavelengths, 400–690 nm (PhET’s set); white where '
        +'they still lie within '+WHITE_MERGE_PX+' px of each other',COL.dim,SM_FONT,'right');
  drawCaption(ctx,L);
}

/* ------------------------------------------------ the reflected fraction */
function fresGeo(ctx,W,H,M,st){
  const capFull='The Fresnel equations, at the pair of indices the boundary view is set to. R and T are '
    +'POWER fractions, so R + T = 1 at every angle — the suite asserts it to 7×10⁻¹⁶ over '
    +'eight pairs and 601 angles. R_p touches zero at Brewster’s angle and nowhere else, which is why '
    +'reflected glare is polarised; past the critical angle both are exactly one. The orange rules are the '
    +'two special angles, the magenta marker is the angle the laser is set to.';
  const capShort='R and T against the angle of incidence, both polarisations. R + T = 1 everywhere.';
  return stageLayoutH(ctx,W,H,capFull,capShort,2,0.34,1);
}
function drawFres(ctx,W,H,M,st){
  const L=fresGeo(ctx,W,H,M,st), b=L.main, B=M.b, F=M.fres;
  const tcD=isFinite(B.tc)?B.tc*RAD:NaN, tbD=B.tb*RAD;
  axesRB(ctx,b,0,90,0,1,{title:titleFor(b,'reflected and transmitted power against the angle of incidence',
                                       'R and T against θ₁'),
    xlab:'angle of incidence θ₁ (degrees)',ylab:'fraction of the power',nx:7,ny:nyFor(b),
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  polyline(ctx,b,F.th,F.Ts,0,90,0,1,rgba(COL.pos,0.35),1.4,[5,4]);
  polyline(ctx,b,F.th,F.Tp,0,90,0,1,rgba(COL.live,0.35),1.4,[5,4]);
  polyline(ctx,b,F.th,F.Ru,0,90,0,1,COL.unpol,1.4);
  polyline(ctx,b,F.th,F.Rs,0,90,0,1,COL.sPol,2.0);
  polyline(ctx,b,F.th,F.Rp,0,90,0,1,COL.pPol,2.0);
  /* the two special angles, clipped to the box by construction */
  const rule=(x,col,txt)=>{
    if(!isFinite(x)||x<0||x>90) return;
    polyline(ctx,b,[x,x],[0,1],0,90,0,1,rgba(col,0.8),1.2,[4,4]);
    lab(ctx,W,H,b.x+b.w*x/90+5,b.y+14,txt,col,SM_FONT,'left');
  };
  rule(tbD,COL.ref,'Brewster '+fmt(tbD,2)+'°');
  rule(tcD,COL.ref,'critical '+fmt(tcD,2)+'°');
  marker(ctx,b,0,90,0,1,st.angDeg,powerSplit(B.f,st.pol).R,COL.live);
  legendA(ctx,b,[[COL.sPol,'R_s'],[COL.pPol,'R_p'],[COL.unpol,'R unpolarised'],
                    [rgba(COL.pos,0.35),'T_s (dashed)'],[rgba(COL.live,0.35),'T_p (dashed)']]);
  if(L.bottom.length>=1) fresPhase(ctx,W,H,L.bottom[0],M,st);
  if(L.bottom.length>=2) fresRatio(ctx,W,H,L.bottom[1],M,st);
  drawCaption(ctx,L);
}
/* the phase of the reflected amplitude: pi jumps, and the TIR phase */
function fresPhase(ctx,W,H,b,M,st){
  const B=M.b, th=[],ps=[],pp=[];
  for(let i=0;i<=180;i++){
    const t=i/180*(90-1e-4)*DEG;
    const f=fresnel(B.n1,B.n2,t);
    th.push(t*RAD);
    if(f.tir){ ps.push(f.phs*RAD); pp.push(f.php*RAD); }
    else { ps.push(f.rs>=0?0:180); pp.push(f.rp>=0?0:180); }
  }
  axesRB(ctx,b,0,90,-200,200,{title:titleFor(b,'the phase of the reflected amplitude','phase of r'),
    xlab:'θ₁ (degrees)',ylab:'arg r (degrees)',nx:4,ny:nyFor(b),xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  polyline(ctx,b,th,ps,0,90,-200,200,COL.sPol,1.8);
  polyline(ctx,b,th,pp,0,90,-200,200,COL.pPol,1.8);
  lab(ctx,W,H,b.x+6,b.y1-12,B.n2>B.n1?'r_s is negative throughout: a hard reflection'
                                     :'past θc the phase slides — Goos–Hänchen',
      COL.dim,SM_FONT,'left');
}
/* R at normal incidence against the index ratio */
function fresRatio(ctx,W,H,b,M,st){
  const B=M.b, ms=[],rs=[];
  for(let i=0;i<=200;i++){ const m=0.25+2.25*i/200; ms.push(m); rs.push(Math.pow((1-m)/(1+m),2)); }
  axesRB(ctx,b,0.25,2.5,0,0.25,{title:titleFor(b,'reflection at normal incidence','R at 0°'),
    xlab:'n₂/n₁',ylab:'R(0)',nx:4,ny:nyFor(b),xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,2)});
  polyline(ctx,b,ms,rs,0.25,2.5,0,0.25,COL.pos,1.8);
  const m=B.n2/B.n1;
  marker(ctx,b,0.25,2.5,0,0.25,clamp(m,0.25,2.5),Math.pow((1-m)/(1+m),2),COL.live);
  noteIn(ctx,W,H,b,'n₂/n₁ = '+fmt(m,4)+' → R(0) = '+fmt(100*Math.pow((1-m)/(1+m),2),2)+'%');
}

/* -------------------------------------------------------- the spectrum */
function specGeo(ctx,W,H,M,st){
  const capFull='PhET’s dispersion is one curve, not six: the Sellmeier index of BK7 glass blended '
    +'linearly with Edlen’s standard air so that the result passes through the substance’s stated '
    +'index at 650 nm. The blend weight is '+fmt(blendFraction(1.5),3)+' for glass and '
    +fmt(blendFraction(2.419),3)+' for diamond — nearly three times BK7’s own dispersion, so the '
    +'diamond curve is an extrapolation of the model rather than a measurement of the stone. The strip under '
    +'the axis is the true colour of each wavelength, from the CIE 1931 2° observer.';
  const capShort='Index against wavelength: PhET’s BK7-and-air blend, with the CIE colour of each wavelength.';
  return stageLayoutH(ctx,W,H,capFull,capShort,2,0.34,1);
}
function spectrumStrip(ctx,b,lamLo,lamHi,y,h){
  for(let X=b.x;X<b.x1;X+=2){
    const lam=lamLo+(lamHi-lamLo)*(X-b.x)/b.w;
    ctx.fillStyle=cssOfLinear(monoLinear(lam),monoLevel(lam));
    ctx.fillRect(X,y,2.6,h);
  }
}
function drawSpec(ctx,W,H,M,st){
  const L=specGeo(ctx,W,H,M,st), b=L.main, S=M.spec;
  const lo=PHET.lamMin, hi=PHET.lamMax;
  /* n itself spans 1.0 to 2.5 and every curve looks flat on that axis, which
     hides the one thing this view exists to say.  Plot the CHANGE from the
     reference wavelength, n(lambda) - n(650), and put the absolute index in
     the legend, where it belongs. */
  const rel={}; let nhi=0;
  const shown=[['diamond',COL.ref],['glass',COL.pos],['water',COL.struct],['mysteryB',COL.live],['air',COL.dim]];
  for(const [id] of shown){
    const n0=S.rows[id][fnIdx(S.lam,PHET.lamRed)];
    rel[id]=S.rows[id].map(v=>v-n0);
    for(const v of rel[id]) nhi=Math.max(nhi,Math.abs(v));
  }
  const nlo=-Math.ceil(nhi*100)/100*0.35, nhiR=Math.ceil(nhi*100)/100;
  axesRB(ctx,b,lo,hi,nlo,nhiR,{title:titleFor(b,'how far the index moves with wavelength, n(λ) − n(650 nm)',
                                            'n(λ) − n(650)'),
    xlab:'wavelength in vacuum (nm)',ylab:'change in index',nx:7,ny:nyFor(b),
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,3)});
  /* the colour strip goes INSIDE the box: at b.y1+2 it covered the tick row */
  spectrumStrip(ctx,b,lo,hi,b.y1-9,9);
  for(const [id,col] of shown) polyline(ctx,b,S.lam,rel[id],lo,hi,nlo,nhiR,col,1.8);
  marker(ctx,b,lo,hi,nlo,nhiR,st.lamNm,
         mediumIndex(st.botSub,st.botN,st.lamNm)-mediumIndex(st.botSub,st.botN,PHET.lamRed),COL.live);
  legendA(ctx,b,shown.map(([id,c])=>[c,subById(id).name+', n = '+fmt(indexOf(subById(id).n,PHET.lamRed),4)]));
  if(L.bottom.length>=1) specDeviation(ctx,W,H,L.bottom[0],M,st);
  if(L.bottom.length>=2) specFan(ctx,W,H,L.bottom[1],M,st);
  drawCaption(ctx,L);
}
function specDeviation(ctx,W,H,b,M,st){
  const S=M.spec;
  const ds=S.dev.map(d=>isFinite(d)?d*RAD:NaN);
  let lo=Infinity,hi=-Infinity;
  for(const d of ds) if(isFinite(d)){ lo=Math.min(lo,d); hi=Math.max(hi,d); }
  if(!isFinite(lo)){
    caption(ctx,b.x,b.y+b.h/2-14,'a '+fmt(st.prismApex,0)+'° prism of this index traps the ray at '
      +'every entry angle: 2θc = '+fmt(2*criticalAngle(prismIndex(st),envIndex(st))*RAD,2)
      +'° is less than the apex angle, so there is no deviation to plot.',b.w,COL.ref,CAP_FONT);
    frame(ctx,b,COL.edge);
    return;
  }
  const pad=Math.max(0.2,(hi-lo)*0.25);
  axesRB(ctx,b,PHET.lamMin,PHET.lamMax,lo-pad,hi+pad,
    {title:titleFor(b,'deviation through a '+fmt(st.prismApex,0)+'° prism','deviation vs λ'),
     xlab:'wavelength (nm)',ylab:'deviation (degrees)',nx:4,ny:nyFor(b),xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  polyline(ctx,b,S.lam,ds,PHET.lamMin,PHET.lamMax,lo-pad,hi+pad,COL.pos,1.8);
  spectrumStrip(ctx,b,PHET.lamMin,PHET.lamMax,b.y1-7,7);
  const i4=fnIdx(S.lam,400), i7=fnIdx(S.lam,700);
  lab(ctx,W,H,b.x+b.w/2,b.y1-22,'violet is bent '+fmt(ds[i4]-ds[i7],3)+'° more than red',
      COL.dim,SM_FONT,'center');
}
/* the spread as it would land on a screen: the exit fan, drawn */
function specFan(ctx,W,H,b,M,st){
  const S=M.spec;
  frame(ctx,b,COL.edge);
  ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(plain(titleFor(b,'the fan, and where it lands','the fan')),b.x,b.y-9);
  LABELS.push([b.x,b.y-9-15,b.x+130,b.y-9]);
  const ds=S.dev.map(d=>isFinite(d)?d:NaN);
  let lo=Infinity,hi=-Infinity;
  for(const d of ds) if(isFinite(d)){ lo=Math.min(lo,d); hi=Math.max(hi,d); }
  if(!isFinite(lo)){
    caption(ctx,b.x+8,b.y+b.h/2-7,'nothing emerges at this index.',b.w-16,COL.ref,CAP_FONT);
    return;
  }
  const ox=b.x+26, oy=b.y+b.h/2, len=b.w-64;
  const spread=Math.max(hi-lo,1e-6);
  const gain=clamp((b.h*0.42)/(len*Math.tan(spread/2)+1e-9),1,60);
  for(let i=0;i<S.lam.length;i++){
    if(!isFinite(ds[i])) continue;
    const a=(ds[i]-(lo+hi)/2)*gain;
    ctx.strokeStyle=cssOfLinear(monoLinear(S.lam[i]),monoLevel(S.lam[i]));
    ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+len*Math.cos(a),oy-len*Math.sin(a)); ctx.stroke();
  }
  dot(ctx,ox,oy,3.5,COL.struct,'#fff',1);
  lab(ctx,W,H,b.x+b.w/2,b.y1-10,'angles exaggerated ×'+fmt(gain,1)+' — the true spread is '
      +fmt((hi-lo)*RAD,3)+'°',COL.ref,SM_FONT,'center');
}

/* --------------------------------------------------------- the rainbow */
function bowGeo(ctx,W,H,M,st){
  const capFull='A sphere of water, lit by parallel light. Every ray is refracted in, reflected k times '
    +'inside, and refracted out; the deviation D depends on where it struck, and it is STATIONARY at '
    +'cos²θ = (n²−1)/(k²+2k). Rays pile up at that angle and nowhere else, which is the bow. '
    +'Because n depends on the wavelength the pile-up angle does too, and the bow is coloured: '
    +fmt(M.bow.bows[1].ang[700],2)+'° for red, '+fmt(M.bow.bows[1].ang[400],2)
    +'° for violet. The drop is drawn at true shape; the rays are geometric, so there are no '
    +'supernumerary bows here.';
  const capShort='Descartes’ stationary deviation in a water drop — the rays pile up at the bow angle.';
  return stageLayoutH(ctx,W,H,capFull,capShort,2,0.34,1);
}
function drawBow(ctx,W,H,M,st){
  const L=bowGeo(ctx,W,H,M,st), b=L.main, Wb=M.bow;
  const ext={xmin:-3.9,xmax:3.9,ymin:-1.39,ymax:1.39};
  const map=worldFitUp(b,ext,0.05);
  frame(ctx,b,COL.edge);
  /* the drop */
  circleW(ctx,map,[0,0],1,COL.struct,1.6,null,rgba(COL.struct,0.10));
  /* the rays */
  const lams=st.white?[420,470,520,570,620,670]:[st.lamNm];
  const nRays=st.bowRays?31:9;
  for(const lam of lams){
    const n=dropIndex(lam);
    const col=cssOfLinear(monoLinear(lam),st.white?0.45:0.8);
    for(let i=-(nRays-1);i<nRays;i++){
      if(i===0) continue;
      const bimp=i/nRays;                  /* both signs: a drop is lit all over */
      const th=Math.asin(bimp);
      const P=dropPath(n,st.bowK,th);
      segW(ctx,map,[-4,P.pts[0][1]],P.pts[0],ext,col,1.0);
      for(let j=0;j<P.pts.length-1;j++) segW(ctx,map,P.pts[j],P.pts[j+1],ext,col,1.0);
      const last=P.pts[P.pts.length-1];
      segW(ctx,map,last,[last[0]+8*P.out[0],last[1]+8*P.out[1]],ext,col,1.0);
    }
  }
  /* the stationary ray, in the live colour */
  {
    const P=dropPath(Wb.n,st.bowK,Wb.thStar);
    segW(ctx,map,[-4,P.pts[0][1]],P.pts[0],ext,COL.live,2.2);
    for(let j=0;j<P.pts.length-1;j++) segW(ctx,map,P.pts[j],P.pts[j+1],ext,COL.live,2.2);
    const last=P.pts[P.pts.length-1];
    segW(ctx,map,last,[last[0]+8*P.out[0],last[1]+8*P.out[1]],ext,COL.live,2.2);
    lab(ctx,W,H,b.x+10,b.y+46,'the stationary ray struck at θi = '+fmt(Wb.thStar*RAD,2)+'°',
        COL.live,SM_FONT,'left');
    /* the bow direction itself, named: the rays pile up along it */
    const a=-Wb.devStar*DEG;
    segW(ctx,map,[0,0],[8*Math.cos(a),8*Math.sin(a)],ext,rgba(COL.ref,0.8),1.3,[5,4]);
    segW(ctx,map,[0,0],[8*Math.cos(-a),8*Math.sin(-a)],ext,rgba(COL.ref,0.8),1.3,[5,4]);
    lab(ctx,W,H,b.x+10,b.y+60,'the dashed lines are '+fmt(Wb.angStar,2)
        +'° from the antisolar direction',COL.ref,SM_FONT,'left');
  }
  /* the ray fan runs right across the top-left, so the caption block needs a
     pad of its own or it is unreadable */
  /* the pad is the BACKING for the three labels that follow, so it must not
     go into the registry — registering it made lab() dodge it and put the
     first line outside the panel altogether */
  ctx.fillStyle='rgba(7,11,24,.86)'; ctx.fillRect(b.x+1,b.y+1,Math.min(370,b.w-2),68);
  lab(ctx,W,H,b.x+10,b.y+14,'k = '+st.bowK+' internal reflection'+(st.bowK>1?'s':'')
      +'  →  bow at '+fmt(Wb.angStar,3)+'°',COL.pos,LAB_FONT,'left');
  lab(ctx,W,H,b.x+10,b.y+30,'water n/n_air = '+fmt(Wb.n,5)+' at '+fmt(st.lamNm,0)+' nm',COL.dim,SM_FONT,'left');
  lab(ctx,W,H,b.x1-10,b.y+14,'throughput '+fmt(100*Wb.through,2)+'% ('+st.bowPol+')',COL.ref,LAB_FONT,'right');
  if(L.bottom.length>=1) bowDeviation(ctx,W,H,L.bottom[0],M,st);
  if(L.bottom.length>=2) bowProfile(ctx,W,H,L.bottom[1],M,st);
  drawCaption(ctx,L);
}
function bowDeviation(ctx,W,H,b,M,st){
  const Wb=M.bow;
  const xs=Wb.th.map(t=>t*RAD);
  axesRB(ctx,b,0,90,120,250,{title:titleFor(b,'deviation against where the ray struck','D against θi'),
    xlab:'impact angle θi (degrees)',ylab:'deviation D (degrees)',nx:4,ny:nyFor(b),
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  polyline(ctx,b,xs,Wb.devs[1],0,90,120,250,COL.pos,1.8);
  polyline(ctx,b,xs,Wb.devs[2],0,90,120,250,COL.ref,1.8);
  for(const k of [1,2]){
    const th=rainTheta(Wb.n,k)*RAD, D=rainDev(Wb.n,k,rainTheta(Wb.n,k))*RAD;
    if(D>=120&&D<=250) marker(ctx,b,0,90,120,250,th,D,COL.live);
  }
  legendA(ctx,b,[[COL.pos,'k = 1, primary'],[COL.ref,'k = 2, secondary']]);
  noteIn(ctx,W,H,b,'flat bottom = rays pile up = a bow');
}
function bowProfile(ctx,W,H,b,M,st){
  const Wb=M.bow;
  axesRB(ctx,b,36,56,0,1,{title:titleFor(b,'where each colour lands','colour against angle'),
    xlab:'angle from the antisolar point (degrees)',ylab:'relative brightness',nx:4,ny:nyFor(b),
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  /* the bow of each wavelength, as a band of the Airy-free geometric width */
  for(let lam=400;lam<=700;lam+=5){
    const n=dropIndex(lam);
    for(const k of [1,2]){
      const a=bowAngle(n,k)*RAD;
      if(a<36||a>56) continue;
      const th=rainTheta(n,k);
      const w=bowThroughput(indexOf(1.000293,lam),indexOf(1.333,lam),k,th,st.bowPol);
      const X=b.x+b.w*(a-36)/20;
      ctx.fillStyle=cssOfLinear(monoLinear(lam),clamp(monoLevel(lam)*clamp(w/0.06,0,1),0,1));
          ctx.fillRect(X-1.6,b.y1-b.h*clamp(w/0.06,0,1),3.2,b.h*clamp(w/0.06,0,1));
    }
  }
  const p1=Wb.bows[1], p2=Wb.bows[2];
  polyline(ctx,b,[p1.ang[700],p1.ang[700]],[0,1],36,56,0,1,rgba(COL.dim,0.6),1,[3,3]);
  polyline(ctx,b,[p2.ang[700],p2.ang[700]],[0,1],36,56,0,1,rgba(COL.dim,0.6),1,[3,3]);
  lab(ctx,W,H,b.x+b.w*(0.5*(p1.ang[400]+p2.ang[700])-36)/20,b.y+16,
      'Alexander’s dark band, '+fmt(Wb.gap,2)+'°',COL.ref,SM_FONT,'center');
  lab(ctx,W,H,b.x1-8,b.y1-12,'the secondary is reversed, and '
      +fmt(bowThroughput(Wb.nA,Wb.nW,1,rainTheta(Wb.n,1),st.bowPol)
          /Math.max(bowThroughput(Wb.nA,Wb.nW,2,rainTheta(Wb.n,2),st.bowPol),1e-12),1)
      +'× fainter',COL.dim,SM_FONT,'right');
}

/* ================================================================== *
 *  the dispatch and the scene                                         *
 * ================================================================== */
function drawView(ctx,W,H,M,st){
  st=st||ST;
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[]; PICKS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(st.view==='bound') drawBound(ctx,W,H,M,st);
  else if(st.view==='wave') drawWave(ctx,W,H,M,st);
  else if(st.view==='prism') drawPrism(ctx,W,H,M,st);
  else if(st.view==='fres') drawFres(ctx,W,H,M,st);
  else if(st.view==='spec') drawSpec(ctx,W,H,M,st);
  else drawBow(ctx,W,H,M,st);
}

/* the phase advance per frame: a fixed amount, so the headless suites and the
   capture are deterministic (no wall clock anywhere in the model) */
const PHASE_STEP=TAU/48;
function makeScene(canvas){
  const S={st:ST,W:1180,H:740};
  S.model=()=>buildModel(ST);
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel(ST),ST); };
  /* only the wave view animates */
  S.step=function(){
    if(ST.view!=='wave'||!ST.anim) return false;
    ST.phase=(ST.phase+PHASE_STEP*ST.waveSpeed)%TAU;
    return true;
  };
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const v=ST.view;
    if(v!=='bound'&&v!=='wave'&&v!=='prism') return false;
    const ctx=canvas.getContext('2d'), M=buildModel(ST);
    if(type==='down'){
      for(const p of PICKS) if(Math.hypot(x-p.x,y-p.y)<p.r){ DRAG.what=p.kind; return true; }
      return false;
    }
    if(type==='move'&&DRAG.what==='laser'&&(v==='bound'||v==='wave')){
      const G=(v==='bound')?boundGeo(ctx,S.W,S.H,M,ST):waveGeo(ctx,S.W,S.H,M,ST);
      const wx=G.map.wx(x), wy=G.map.wy(y);
      /* the laser sits up-LEFT of the origin: its angle from the normal */
      const a=Math.atan2(-wx,Math.max(wy,1e-6))*RAD;
      ST.angDeg=clamp(a,0,89.9);
      clearMemo();
      return true;
    }
    if(type==='move'&&DRAG.what==='beam'&&v==='prism'){
      const G=prismGeo(ctx,S.W,S.H,M,ST);
      ST.beamY=clamp(G.map.wy(y),PRISM_WORLD.ymin+1,PRISM_WORLD.ymax-1);
      clearMemo();
      return true;
    }
    return false;
  };
  return S;
}

      +'(docs/phets/bending-light_en.html). The Sellmeier coefficients are the published SCHOTT N-BK7 set '
      +'and the air coefficients are Edlen&rsquo;s; this file recomputes n<sub>d</sub> = 1.51680 and '

    rows.envN.row.hidden=(st.envSub!=='custom');
    rows.prismN.row.hidden=(st.prismSub!=='custom');
    gDraw.hidden=false;
    rows.cb_showNormal.row.hidden=(v!=='bound');
    rows.cb_showAngles.row.hidden=(v!=='bound');
    rows.cb_showMeter.row.hidden=(v!=='bound');
    rows.cb_showProtractor.row.hidden=!(v==='bound'||v==='prism');
    gBow.hidden=!(v==='spec'||v==='bow');
    rows.prismApex.row.hidden=(v!=='spec');
    rows.cb_bowRays.row.hidden=(v!=='bow');
    for(const k in rows) rows[k].sync();

    lightTag.innerHTML='PhET&rsquo;s laser runs '+PHET.lamMin+'&ndash;'+PHET.lamMax+' nm and its reference '

      +'PhET uses <b>s</b>.';
    medTag.innerHTML='PhET&rsquo;s own chooser offers air, water, glass, Mystery A, Mystery B and a custom '

      +'chooser does not list it. PhET&rsquo;s custom slider stops at <b>1.6</b> while its custom substance '
      +'starts at <b>'+PHET.nCustom0+'</b>; this one reaches PhET&rsquo;s own starting value so that both '
      +'ends are usable. A mystery substance hides its index &mdash; that is the point of it. '
      +'Now: n<sub>1</sub> = '+fmt(B.n1,5)+', n<sub>2</sub> = '+fmt(B.n2,5)+', '
      +(isFinite(B.tc)?'&theta;<sub>c</sub> = '+fmt(B.tc*RAD,2)+'&deg;'
                      :'no critical angle (the light is entering the denser medium)')+'.';
    waveTag.innerHTML='The clock advances a fixed '+fmt(PHASE_STEP,4)+' rad of phase per frame, so the '
      +'headless suites and the captures are deterministic. PhET refuses angles past '
      +'MAX_ANGLE_IN_WAVE_MODE = 3.0194 rad in its wave view, i.e. within '
      +fmt(180-PHET.maxWaveAngle*RAD,2)+'&deg; of the boundary; this file draws them.';
    priTag.innerHTML='PhET&rsquo;s sixth prototype, the <b>diverging lens</b>, is not here: its two arc '
      +'radii could not be read unambiguously out of the minified build, and a guessed shape is not a '
      +'remake. The five that are here carry PhET&rsquo;s own vertices. Drag the laser body to move the '
      +'beam.';
    drawTag.innerHTML='1&ndash;6 switch views &nbsp; r resets &nbsp; space runs the wave clock';
    bowTag.innerHTML='The drop is water at the wavelength the light slider is set to ('
      +fmt(dropIndex(st.lamNm),5)+' relative to the air). One internal reflection gives the primary bow, two the '
      +'secondary; three would put a bow around the sun, not opposite it, which is why nobody sees it.';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M,st);
      eqEl.innerHTML=eqbarHTML(M,st);
      tagEl.innerHTML=tagHTML(M,st);
      hintEl.textContent=((st.view==='bound'||st.view==='wave')?'drag the laser · ':
                          st.view==='prism'?'drag the laser · ':'')+'1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    /* the pointerDOWN does not change the drawing, so it does not mark the
       loop dirty: two flags on one path make each other's mutant equivalent
       (the buoyancy Known-bad), and the move handler is the one that owns
       the change */
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)) canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model(),st); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
    else if(e.key==='r'){ const v=st.view; Object.assign(st,DEFAULTS); st.view=v;
      clearMemo(); syncChips(); syncPanel(); dirty=true; refresh(); }
    else if(e.key===' '){ st.anim=!st.anim; clearMemo(); syncPanel(); dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(tm){
    if(S.step()) dirty=true;
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

 *  selfTest — headless verification.  Every reference value labelled  *
 *  (derive) is a printed line of build/bending-light/refvals.txt, the *
 *  output of derive.py — an independent Python solve of the same      *
 *  optics, with scipy.minimize_scalar on the prism's minimum          *
 *  deviation and on the rainbow's stationary ray — read in full.      *

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

                2.43003848655707,2.42389447407538,2.419,2.41498316451161];
    let w=0;
    for(let i=0;i<lams.length;i++){

                   Math.abs(indexOf(NG,lams[i])-refG[i]),
                   Math.abs(indexOf(ND,lams[i])-refD[i]));

  }
  /* PhET's substance table, pinned entry by entry: a test that only ever
     uses its own literals leaves the table itself unasserted */
  {
    const WANT={air:1.000293,water:1.333,glass:1.5,diamond:2.419,mysteryA:2.419,mysteryB:1.4};
    for(const id in WANT) close(subById(id).n,WANT[id],0,'PhET\u2019s index for '+id);
