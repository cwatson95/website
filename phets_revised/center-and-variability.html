/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the drawing layer: the field, the number line, the dot plot and    *
 *  the five measures drawn on it — then PhET's first two screens.     *
 * ================================================================== */
/* The house #hint is HTML at bottom:11px and the display-list capture cannot
   see it, so every bottom-anchored caption ends HINT_H higher than the canvas
   floor and selfTest asserts the corner stays clear (wave-on-a-string). */
const HINT_H=18;
/* the number line spans PhET's VARIABILITY_DRAG_RANGE (0..16) so the interval
   handles and the pointer never leave the picture; the ticks are the 1..15 m
   of PHYSICAL_RANGE */
const XLO=0, XHI=16;
/* the band reserved UNDER the number line, laid out once so that nothing has
   to guess: tick marks at +0..+5, tick labels at +7..+19, the measure's own
   bars at +23..+45, and its labels from +46 down.  The first draft reserved
   22 px and the IQR labels landed in the caption at every canvas size. */
const NL_BELOW=76, NL_TICKLAB=7, NL_BAR=26, NL_LAB=34, NL_LAB2=50;

/* axes() and the number line draw their tick labels and axis titles straight
   to the canvas, outside the label registry, so lab() and legendAuto() cannot
   see them and put things on top (found by the layout sweep: an axis title
   under a note, a legend over a tick, a median label over a tick).  regText
   records what was drawn; axesQ wraps axesR so every axis registers itself. */
function regText(x,y,txt,px,align,base){
  const t=plain(txt), w=t.length*px*0.52, fh=px*1.15;
  const lx=align==='center'?x-w/2:(align==='right'?x-w:x);
  const ly=base==='top'?y:(base==='middle'?y-fh/2:(base==='bottom'?y-fh:y-fh*0.8));
  LABELS.push([lx,ly,lx+w,ly+fh]);
}
function axesQ(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  /* a rotated y-axis title is drawn at b.x - 40 and is about 13 px wide, so
     on a narrow panel it reaches into the NEIGHBOUR's tick gutter (the known
     trap: y-tick labels hang ~28 px left of their own panel).  Below 215 px
     of panel the title is dropped and the panel's own name carries the units. */
  if(o.ylab&&b.w<215) o.ylab=null;
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    regText(X,b.y1+5,o.xfmt?o.xfmt(t):fmt(t,2),10.5,'center','top');
  }
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    regText(b.x-6,Y,o.yfmt?o.yfmt(t):fmt(t,2),10.5,'right','middle');
  }
  if(o.xlab) regText(b.x+b.w/2,b.y1+21,o.xlab,11,'center','top');
  if(o.ylab){ const hw=plain(o.ylab).length*11*0.26;
    LABELS.push([b.x-53,b.y+b.h/2-hw,b.x-40,b.y+b.h/2+hw]); }
}

/* The number line's y, and the dot stack's row height, are each computed in
   TWO places: the drawing and the pointer hit test.  They drifted once
   already — the hit test kept b.y1-22 after the drawing moved to
   b.y1-NL_BELOW, so the prediction thumbs were grabbable 54 px below where
   they were drawn — so both now come from here and nowhere else. */
function nlLineY(b){ return b.y1-NL_BELOW; }
/* how much room each view leaves above its tallest stack */
const DOT_HEADROOM={kicks:10,meanmed:30,spread:34,conv:60,balance:40,longrun:10};
function dotGeomOf(b,xs,view){
  const map=nlMap(b), ly=nlLineY(b);
  const stacks=cavStacks(xs), hMax=Math.max(1,cavStackHeight(xs));
  const avail=Math.max(14,ly-b.y-(DOT_HEADROOM[view]===undefined?10:DOT_HEADROOM[view]));
  const rowH=Math.min(12,avail/hMax);
  return {map,ly,stacks,hMax,rowH,r:Math.min(5.2,rowH*0.44),top:ly-rowH*hMax};
}
function nlMap(b){
  return {b,
    X:v=>b.x+b.w*(v-XLO)/(XHI-XLO),
    V:px=>XLO+(px-b.x)/b.w*(XHI-XLO),
    s:b.w/(XHI-XLO)};
}
/* the stage: a field on top (where the balls land) and the plot under it
   (the same data, with the measures drawn on it) */
function plotWantH(maxK){ return NL_BELOW+12*Math.max(5,maxK)+46; }
/* the field needs only the height its tallest stack occupies: a box three
   times taller than its content reads as a defect, not as headroom (found
   by looking at the PNGs).  The dot plot takes whatever is left, because
   THAT is where the stack grows as the kicks arrive. */
function fieldWantH(xs){ return 62+13*Math.max(1,cavStackHeight(xs))+18; }
function cavLayout(ctx,W,H,capFull,capShort,fieldFrac,gapIn,fieldWant,plotWant){
  const narrow=isNarrow(W);
  const left=58, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(280,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H-HINT_H,capFull,capShort,capW,top+200);
  const avail=Math.max(120,fit.capY-24-top);
  const gap=gapIn===undefined?30:gapIn;
  const fh=fieldWant?Math.round(clamp(fieldWant,110,avail*0.5))
                    :Math.round(avail*fieldFrac);
  /* the dot plot needs the band under the line plus room for the TALLEST
     stack the kick limit allows; more than that is dead space, and the two
     boxes are centred in whatever is left rather than pinned to the top */
  const phWant=plotWant?Math.round(clamp(plotWant,150,avail-fh-gap)):(avail-fh-gap);
  const topShift=Math.round(Math.max(0,avail-fh-gap-phWant)*0.45);
  /* the caption is drawn LAST but occupies its space from the start, so it
     goes into the label registry now — otherwise every panel note lands on
     top of it, which is what the layout sweep found at all four sizes */
  const capLines=wrapText(ctx,fit.txt,capW,CAP_FONT).length;
  LABELS.push([left,fit.capY,left+capW,fit.capY+capLines*14]);
  /* a two-column bottom row collapses below ~430 px of column and its axis
     titles then land in the caption and under the #hint (the known trap).
     `room` says whether the analysis views may draw their second row at all;
     when they may not, the main panel takes the whole stage and the canvas
     says what was dropped. */
  return {narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,gap,
          room:!narrow&&(avail-fh-gap)>=150,
          field:box(left,top+topShift,right-left,fh),
          plot:box(left,top+topShift+fh+gap,right-left,Math.max(110,phWant)),
          full:box(left,top,right-left,avail)};
}
function cavCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }

/* ---- the field ---------------------------------------------------------- */
/* The kicker stands at the left edge and the balls land at their distance and
   stack.  The arc is a DRAWING DEVICE: PhET draws the kick distance from the
   kicker's weights first and then animates a ball to it, so nothing about the
   flight enters any statistic — said on the canvas, not only here. */
/* the field's geometry, computed WITHOUT drawing, so that the hit test and
   the picture cannot drift apart (waveguides Known-bad: a quantity computed
   independently in the drawing and in the camera fit will drift) */
function fieldGeomOf(b,xs){
  const map=nlMap(b), gy=b.y1-16;
  const rowH=Math.min(13,Math.max(6,(gy-b.y-44)/Math.max(1,cavStackHeight(xs))));
  return {map,gy,rowH,br:Math.min(6.5,rowH*0.46),stacks:cavStacks(xs)};
}
function drawField(ctx,b,M,st,W,H){
  const G=fieldGeomOf(b,M.xs);
  const map=G.map, gy=G.gy;
  ctx.fillStyle=COL.sky; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle=COL.grass; ctx.fillRect(b.x,gy,b.w,b.y1-gy);
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(b.x,gy+0.5); ctx.lineTo(b.x1,gy+0.5); ctx.stroke();
  /* the yard lines: one per metre of PHYSICAL_RANGE */
  ctx.strokeStyle='rgba(90,200,224,.16)'; ctx.lineWidth=1;
  for(let v=CAV.VMIN;v<=CAV.VMAX;v++){
    const X=map.X(v);
    ctx.beginPath(); ctx.moveTo(X,gy); ctx.lineTo(X,gy-6); ctx.stroke();
  }
  /* the kicker */
  const kx=map.X(0)+10, r=9;
  ctx.fillStyle=M.kcol;
  ctx.fillRect(kx-6,gy-24,12,16);
  dot(ctx,kx,gy-30,6,M.kcol,'#0b0f1a',1);
  ctx.strokeStyle=M.kcol; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(kx-3,gy-8); ctx.lineTo(kx-7,gy); ctx.moveTo(kx+3,gy-8); ctx.lineTo(kx+9,gy-3); ctx.stroke();
  /* the balls that have landed, stacked where they landed */
  const stacks=G.stacks, rowH=G.rowH, br=G.br;
  for(let i=0;i<M.xs.length;i++){
    const X=map.X(M.xs[i]), Y=gy-rowH*(stacks[i]+0.5);
    const grabbed=(DRAG.what==='ball'&&DRAG.idx===i);
    dot(ctx,X,Y,br,grabbed?COL.live:COL.ball,'#0b0f1a',1);
  }
  /* the balls in flight */
  for(const ball of M.F.air){
    const p=cavBallPos(ball);
    dot(ctx,map.X(p[0]),gy-p[1]*map.s,br,COL.ball,'#0b0f1a',1);
  }
  frame(ctx,b,'#1b2130');
  lab(ctx,W,H,b.x+8,b.y+12,
      'the arc is a drawing device — the distance is drawn from the kicker’s weights first, as PhET does',
      '#5d6578',SM_FONT,'left','middle');
  return G;
}
/* which landed ball is under the pointer, if any */
function ballAt(xs,G,x,y){
  let best=-1, bestD=1e9;
  for(let i=0;i<xs.length;i++){
    const X=G.map.X(xs[i]), Y=G.gy-G.rowH*(G.stacks[i]+0.5);
    const d=Math.hypot(x-X,y-Y);
    if(d<Math.max(G.br+5,10)&&d<bestD){ best=i; bestD=d; }
  }
  return best;
}

/* ---- the number line and the dot plot ----------------------------------- */
function drawNumberLine(ctx,b,title){
  const map=nlMap(b);
  ctx.fillStyle='rgba(10,12,18,.5)'; ctx.fillRect(b.x,b.y,b.w,b.h);
  frame(ctx,b,'#1b2130');
  const ly=nlLineY(b);
  ctx.strokeStyle=COL.line; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(map.X(XLO),ly+0.5); ctx.lineTo(map.X(XHI),ly+0.5); ctx.stroke();
  ctx.font=SM_FONT; ctx.textAlign='center'; ctx.textBaseline='top';
  for(let v=CAV.VMIN;v<=CAV.VMAX;v++){
    const X=map.X(v);
    ctx.strokeStyle=COL.line; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X,ly); ctx.lineTo(X,ly+5); ctx.stroke();
    ctx.fillStyle='#6f7789'; ctx.fillText(''+v,X,ly+NL_TICKLAB);
    regText(X,ly+NL_TICKLAB,''+v,10.5,'center','top');
  }
  if(title){ ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
    ctx.fillText(plain(title),b.x+2,b.y-4);
    LABELS.push([b.x+2,b.y-4-15,b.x+2+plain(title).length*6.8,b.y-4]); }
  return {map,ly};
}
/* the dot plot itself: one mark per kick, stacked at its value.  PhET offers
   a line plot (crosses) as an alternative in its preferences; both are here. */
function drawDots(ctx,geom,b,xs,plot,opt){
  const o=opt||{};
  const D=dotGeomOf(b,xs,o.view);
  const map=D.map, ly=D.ly, stacks=D.stacks, rowH=D.rowH, r=D.r;
  for(let i=0;i<xs.length;i++){
    const X=map.X(xs[i]), Y=ly-rowH*(stacks[i]+0.5);
    const hi=o.mark&&o.mark(i,xs[i]);
    if(plot==='line'){
      ctx.strokeStyle=hi||COL.pos; ctx.lineWidth=1.7;
      ctx.beginPath();
      ctx.moveTo(X-r,Y-r); ctx.lineTo(X+r,Y+r);
      ctx.moveTo(X-r,Y+r); ctx.lineTo(X+r,Y-r);
      ctx.stroke();
    } else {
      dot(ctx,X,Y,r,hi||COL.pos,'#0b0f1a',1);
    }
  }
  return D;
}
/* the cards PhET's Median screen sorts: the values in kick order, or sorted */
function drawCards(ctx,b,xs,sorted){
  const vals=sorted?cavSorted(xs):xs.slice();
  const n=vals.length;
  if(!n) return 0;
  const w=Math.min(34,(b.w-20)/Math.max(n,1)), hh=Math.min(30,b.h-8);
  const x0=b.x+10;
  ctx.font=SM_FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
  /* the cards the median is resting on: the same indices
     getMedianObjectsFromSortedArray picks — one for odd n, two for even */
  const midSet={};
  if(sorted){
    const k=Math.floor((n-1)/2);
    midSet[k]=1; if(n%2===0) midSet[k+1]=1;
  }
  for(let i=0;i<n;i++){
    const X=x0+i*w, Y=b.y+4;
    const on=sorted&&midSet[i];
    ctx.fillStyle=on?'rgba(240,180,41,.22)':'rgba(16,19,27,.92)';
    ctx.fillRect(X,Y,w-3,hh);
    ctx.strokeStyle=on?COL.med:'#2a3040'; ctx.lineWidth=1;
    ctx.strokeRect(X+0.5,Y+0.5,w-4,hh-1);
    ctx.fillStyle=on?COL.med:'#cfd4de';
    ctx.fillText(''+vals[i],X+(w-3)/2,Y+hh/2);
    /* the card numerals go into the label registry too, or the row's own
       legend lands on them at the narrower canvas sizes */
    regText(X+(w-3)/2,Y+hh/2,''+vals[i],10.5,'center','middle');
  }
  return Object.keys(midSet).length;
}

/* ---- the measures, drawn on the line ------------------------------------ */
function downTriangle(ctx,x,y,s,col){
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-s,y-s*1.5); ctx.lineTo(x+s,y-s*1.5);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function upTriangle(ctx,x,y,s,col){
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-s,y+s*1.5); ctx.lineTo(x+s,y+s*1.5);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function medianMark(ctx,geom,v,col,label,W,H){
  if(v===null) return;
  const X=geom.map.X(v);
  ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(X,geom.ly); ctx.lineTo(X,geom.top0!==undefined?geom.top0:geom.ly-40); ctx.stroke();
  ctx.setLineDash([]);
  downTriangle(ctx,X,geom.ly-2,6,col);
  if(label) lab(ctx,W,H,X,geom.ly+NL_LAB,label,col,SM_FONT,'center','middle');
}
/* the mean drawn as what it is: a fulcrum under a beam, with the signed
   deviations as the loads.  The fulcrum sits at the computed mean — selfTest
   asserts the drawn x is the model's mean, not a separately computed one. */
function meanFulcrum(ctx,geom,mean,col,label,W,H){
  if(mean===null) return null;
  const X=geom.map.X(mean);
  upTriangle(ctx,X,geom.ly+2,7,col);
  ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(X,geom.ly); ctx.lineTo(X,geom.top0!==undefined?geom.top0:geom.ly-40); ctx.stroke();
  ctx.setLineDash([]);
  if(label) lab(ctx,W,H,X,geom.ly+NL_LAB2,label,col,SM_FONT,'center','middle');
  return X;
}
/* The two moments, drawn.  They are equal at the mean, so the two bars are
   the same length and the picture IS the identity.  Their scale is NOT the
   number line's — a moment is a sum of distances, not a distance — so the
   factor is returned and printed on the canvas, as the house requires of
   every scale distortion. */
function momentBars(ctx,geom,b,xs,mean){
  const Mm=cavMoments(xs,mean);
  const mx=geom.map.X(mean), y=geom.ly+NL_BAR;
  const room=Math.max(20,Math.min(mx-b.x-10,b.x1-mx-10));
  const sc=room/Math.max(Mm.neg,Mm.pos,1e-9);
  ctx.lineWidth=3.2;
  ctx.strokeStyle=COL.ref;
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(mx-Mm.neg*sc,y); ctx.stroke();
  ctx.strokeStyle=COL.mean;
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(mx+Mm.pos*sc,y); ctx.stroke();
  ctx.lineWidth=1.4; ctx.strokeStyle=COL.text;
  ctx.beginPath(); ctx.moveTo(mx,y-6); ctx.lineTo(mx,y+6); ctx.stroke();
  return {Mm,sc,y,mx};
}
/* PhET's prediction thumbs: the median one snaps to 0.5 m, the mean one is
   continuous.  Both are live markers, so both are magenta. */
function predictMark(ctx,geom,v,col,label,W,H,up){
  const X=geom.map.X(v);
  ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X,geom.ly+(up?-2:2)); ctx.lineTo(X,geom.ly+(up?-22:22)); ctx.stroke();
  (up?downTriangle:upTriangle)(ctx,X,geom.ly+(up?-2:2),6,col);
  if(label) lab(ctx,W,H,X,geom.ly+(up?-32:NL_LAB),label,col,SM_FONT,'center','middle');
}

/* ================================================================== *
 *  view A — the kicks (PhET's Median screen)                          *
 * ================================================================== */
const KICKS_CAP_FULL='PhET&rsquo;s Median screen. A kicker sends balls to distances drawn from its own weights &mdash; every landing is an integer metre between 1 and 15, and balls that land together stack, which is what makes the field a dot plot already. Drag any ball along the line to move it; it snaps to a whole metre, as PhET&rsquo;s does. The median is the middle value of the sorted data, and with an even number of kicks it is the mean of the TWO middle values, so it can sit between the marks. Sort the cards to see which balls it is resting on.';
const KICKS_CAP_SHORT='PhET&rsquo;s Median screen: kicks stack into a dot plot, and the median is the middle of the sorted data &mdash; the mean of the two middles when the count is even.';
function viewKicks(ctx,W,H,M,st){
  /* the sorted cards live in the gap between the field and the plot, so the
     gap has to grow with them or the plot's own title lands on a card */
  const L=cavLayout(ctx,W,H,KICKS_CAP_FULL,KICKS_CAP_SHORT,0.50,st.mSort?62:30,fieldWantH(M.xs),plotWantH(M.maxK));
  drawField(ctx,L.field,M,st,W,H);
  const geom=drawNumberLine(ctx,L.plot,'kick distance (metres) &mdash; '+(st.mPlot==='line'?'line plot':'dot plot'));
  const d=drawDots(ctx,geom,L.plot,M.xs,st.mPlot,{view:'kicks'});
  geom.top0=d.top-6;
  if(st.mMedian&&M.stat.median!==null)
    medianMark(ctx,geom,M.stat.median,COL.med,'median '+fmt(M.stat.median,1)+' m',W,H);
  /* a sparse view has to say why it is sparse, or it reads as broken */
  if(!M.stat.n)
    lab(ctx,W,H,(L.plot.x+L.plot.x1)/2,geom.ly-26,
        'no kicks yet — there is no median to mark.  Press kick 1 or kick 5.',
        COL.dim,CAP_FONT,'center','middle');
  if(st.mPredict) predictMark(ctx,geom,st.mPredVal,COL.live,'your guess '+fmt(st.mPredVal,1),W,H,false);
  if(st.mSort&&M.xs.length){
    const cb=box(L.field.x,L.field.y1+4,L.field.w,24);
    drawCards(ctx,cb,M.xs,true);
    lab(ctx,W,H,cb.x+2,cb.y1+10,'sorted — the middle card'+(M.xs.length%2?'':'s')+' in gold',
        COL.med,SM_FONT,'left','middle');
  }
  cavCaption(ctx,L);
  return L;
}

/* ================================================================== *
 *  view B — mean and median (PhET's Mean & Median screen)             *
 * ================================================================== */
const MM_CAP_FULL='PhET&rsquo;s Mean &amp; Median screen. The same dot plot, with the mean drawn as what it is: the fulcrum of a beam loaded with the kicks. The two bars under the line are the moments: the total pull of the kicks below the mean, and of those above. They are equal exactly &mdash; that is what a balance point IS, and it is an identity rather than an approximation. They are drawn at their own scale, which the canvas prints, because a moment is a sum of distances and not a distance. Move one ball far out and watch the two statistics part company: the mean follows it at 1/n metres per metre, the median does not move at all once the ball has left the middle.';
const MM_CAP_SHORT='PhET&rsquo;s Mean &amp; Median screen: the mean as a fulcrum, the signed deviations as loads, and a median that ignores how far the far balls are.';
function viewMeanMed(ctx,W,H,M,st){
  const L=cavLayout(ctx,W,H,MM_CAP_FULL,MM_CAP_SHORT,0.44,30,fieldWantH(M.xs),plotWantH(M.maxK));
  drawField(ctx,L.field,M,st,W,H);
  const geom=drawNumberLine(ctx,L.plot,'kick distance (metres) &mdash; '+(st.aPlot==='line'?'line plot':'dot plot'));
  const d=drawDots(ctx,geom,L.plot,M.xs,st.aPlot,{view:'meanmed'});
  geom.top0=d.top-6;
  let mom=null;
  if(st.aMean&&M.stat.mean!==null&&M.stat.n) mom=momentBars(ctx,geom,L.plot,M.xs,M.stat.mean);
  if(st.aMedian&&M.stat.median!==null)
    medianMark(ctx,geom,M.stat.median,COL.med,'median '+fmt(M.stat.median,1),W,H);
  if(st.aMean&&M.stat.mean!==null)
    meanFulcrum(ctx,geom,M.stat.mean,COL.mean,'mean '+fmt(M.stat.mean,2),W,H);
  if(st.aPredMean) predictMark(ctx,geom,st.aPredMeanVal,COL.live,'mean guess '+fmt(st.aPredMeanVal,1),W,H,true);
  if(st.aPredMed) predictMark(ctx,geom,st.aPredMedVal,COL.live,'median guess '+fmt(st.aPredMedVal,1),W,H,false);
  /* letter subscripts are not safe on this canvas (the rasteriser's font has
     no full set), so the deviation sum is written with an ASCII subscript */
  if(mom){
    lab(ctx,W,H,L.plot.x+4,L.plot.y+13,
        'sum of (x_i − mean) = '+fmt(cavTorque(M.xs,M.stat.mean),12)+' m',
        COL.mean,SM_FONT,'left','middle');
    lab(ctx,W,H,mom.mx,geom.ly+NL_LAB2+16,
        'each side pulls '+fmt(mom.Mm.neg,3)+' m — equal, exactly  ·  the two bars are at 1 m = '
        +fmt(mom.sc,1)+' px, NOT the number line’s scale',
        COL.ref,SM_FONT,'center','middle');
  }
  cavCaption(ctx,L);
  return L;
}

/* ================================================================== *
 *  view C — the spread (PhET's Variability screen)                    *
 * ================================================================== */
const SP_CAP_FULL='PhET&rsquo;s Variability screen. One measure at a time, drawn on the data that made it. The RANGE is a bar between the two most extreme kicks and knows nothing about the rest. The IQR is the box of a box-and-whisker: Q1 and Q3 by PhET&rsquo;s exclusive median-of-halves rule, whiskers out to the furthest kick inside 1.5 &times; IQR, and anything past that marked as an outlier. The MAD is every kick&rsquo;s own distance from the mean, averaged &mdash; the ticks under the line are those distances. The interval tool counts what falls between its two handles, both ends included, as PhET&rsquo;s does.';
const SP_CAP_SHORT='PhET&rsquo;s Variability screen: range, interquartile range and mean absolute deviation, each drawn on the kicks that made it.';
function viewSpread(ctx,W,H,M,st){
  const L=cavLayout(ctx,W,H,SP_CAP_FULL,SP_CAP_SHORT,0.42,30,fieldWantH(M.xs),plotWantH(M.maxK));
  drawField(ctx,L.field,M,st,W,H);
  const geom=drawNumberLine(ctx,L.plot,'kick distance (metres) — '+st.vMeasure.toUpperCase());
  const d=drawDots(ctx,geom,L.plot,M.xs,'dot',{view:'spread',
    mark:(i,v)=>{
      if(st.vMeasure==='iqr'&&M.box&&st.vOutliers&&(v<M.box.lowFence||v>M.box.highFence)) return COL.rng;
      if(st.vMeasure==='range'&&M.stat.n&&(v===M.stat.min||v===M.stat.max)) return COL.rng;
      return null;
    }});
  geom.top0=d.top-6;
  const S=M.stat, map=geom.map;
  if(st.vShow&&S.n){
    if(st.vMeasure==='range'&&S.range!==null){
      const y=geom.ly+NL_BAR;
      ctx.strokeStyle=COL.rng; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(map.X(S.min),y); ctx.lineTo(map.X(S.max),y); ctx.stroke();
      for(const v of [S.min,S.max]){
        ctx.beginPath(); ctx.moveTo(map.X(v),y-6); ctx.lineTo(map.X(v),y+6); ctx.stroke();
      }
      lab(ctx,W,H,(map.X(S.min)+map.X(S.max))/2,geom.ly+NL_LAB2,
          'range = '+fmt(S.max,0)+' − '+fmt(S.min,0)+' = '+fmt(S.range,0)+' m',COL.rng,SM_FONT,'center','middle');
    } else if(st.vMeasure==='iqr'&&M.box){
      const B=M.box, y=geom.ly+NL_BAR+8, hh=11;
      const wl=st.vOutliers?B.whiskLo:B.min, wh=st.vOutliers?B.whiskHi:B.max;
      ctx.strokeStyle=COL.iqr; ctx.lineWidth=1.6;
      ctx.beginPath();
      ctx.moveTo(map.X(wl),y); ctx.lineTo(map.X(B.q1),y);
      ctx.moveTo(map.X(B.q3),y); ctx.lineTo(map.X(wh),y);
      ctx.moveTo(map.X(wl),y-7); ctx.lineTo(map.X(wl),y+7);
      ctx.moveTo(map.X(wh),y-7); ctx.lineTo(map.X(wh),y+7);
      ctx.stroke();
      ctx.fillStyle=rgba(COL.iqr,0.18);
      ctx.fillRect(map.X(B.q1),y-hh,map.X(B.q3)-map.X(B.q1),2*hh);
      ctx.strokeStyle=COL.iqr; ctx.lineWidth=1.6;
      ctx.strokeRect(map.X(B.q1)+0.5,y-hh+0.5,map.X(B.q3)-map.X(B.q1),2*hh);
      ctx.strokeStyle=COL.med; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(map.X(B.median),y-hh); ctx.lineTo(map.X(B.median),y+hh); ctx.stroke();
      if(st.vOutliers) for(const o of B.outliers)
        dot(ctx,map.X(o),y,3.4,'#0b0f1a',COL.rng,1.5);
      lab(ctx,W,H,map.X(B.q1),geom.ly+NL_LAB2,'Q1 '+fmt(B.q1,1),COL.iqr,SM_FONT,'center','middle');
      lab(ctx,W,H,map.X(B.q3),geom.ly+NL_LAB2,'Q3 '+fmt(B.q3,1),COL.iqr,SM_FONT,'center','middle');
      lab(ctx,W,H,(map.X(B.q1)+map.X(B.q3))/2,geom.ly+NL_LAB2+16,
          'IQR = '+fmt(B.q3,1)+' − '+fmt(B.q1,1)+' = '+fmt(B.iqr,1)+' m'
          +(st.vOutliers&&B.outliers.length?'  · '+B.outliers.length+' outlier'+(B.outliers.length>1?'s':''):''),
          COL.iqr,SM_FONT,'center','middle');
    } else if(st.vMeasure==='mad'){
      const y=geom.ly+NL_BAR, mx=map.X(S.mean);
      ctx.strokeStyle=rgba(COL.mad,0.55); ctx.lineWidth=1.2;
      for(const v of M.xs){
        ctx.beginPath(); ctx.moveTo(map.X(v),y-5); ctx.lineTo(map.X(v),y+5); ctx.stroke();
      }
      ctx.strokeStyle=COL.mad; ctx.lineWidth=2.2;
      ctx.beginPath();
      ctx.moveTo(mx-S.madExact*map.s,y+11); ctx.lineTo(mx+S.madExact*map.s,y+11);
      ctx.moveTo(mx-S.madExact*map.s,y+6); ctx.lineTo(mx-S.madExact*map.s,y+16);
      ctx.moveTo(mx+S.madExact*map.s,y+6); ctx.lineTo(mx+S.madExact*map.s,y+16);
      ctx.stroke();
      meanFulcrum(ctx,geom,S.mean,COL.mean,null,W,H);
      lab(ctx,W,H,mx,geom.ly+NL_LAB2+16,'MAD = '+fmt(S.madExact,3)+' m each side of the mean  ·  PhET prints '+fmt(S.madPhet,1),
          COL.mad,SM_FONT,'center','middle');
    }
  }
  /* PhET refuses quartiles below five kicks and shows 'IQR = ?'; say so on
     the canvas too, or the view reads as broken rather than as honest */
  if(st.vShow&&st.vMeasure==='iqr'&&!M.box)
    lab(ctx,W,H,(L.plot.x+L.plot.x1)/2,geom.ly+NL_LAB2,
        S.n?('IQR = ?  —  PhET needs at least five kicks, and this field has '+S.n)
           :'IQR = ?  —  no kicks yet.  Press kick 1 or kick 5.',
        COL.iqr,CAP_FONT,'center','middle');
  if(st.vShow&&st.vMeasure!=='iqr'&&!S.n)
    lab(ctx,W,H,(L.plot.x+L.plot.x1)/2,geom.ly+NL_LAB2,
        st.vMeasure.toUpperCase()+' = ?  —  no kicks yet.  Press kick 1 or kick 5.',
        COL.dim,CAP_FONT,'center','middle');
  if(st.vMean&&S.mean!==null&&st.vMeasure!=='mad')
    meanFulcrum(ctx,geom,S.mean,COL.mean,'mean '+fmt(S.mean,2),W,H);
  /* the interval tool: a block between two handles, both ends counted */
  if(st.vInterval){
    const a=map.X(M.iv.lo), b2=map.X(M.iv.hi);
    ctx.fillStyle=rgba(COL.live,0.13); ctx.fillRect(a,geom.top0,b2-a,geom.ly-geom.top0);
    ctx.strokeStyle=COL.live; ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(a,geom.top0); ctx.lineTo(a,geom.ly);
    ctx.moveTo(b2,geom.top0); ctx.lineTo(b2,geom.ly);
    ctx.stroke();
    dot(ctx,a,geom.top0,4.5,COL.live,'#fff',1);
    dot(ctx,b2,geom.top0,4.5,COL.live,'#fff',1);
    lab(ctx,W,H,(a+b2)/2,geom.top0-11,
        M.iv.count+' of '+S.n+' = '+fmt(100*M.iv.frac,1)+'% in ['+fmt(M.iv.lo,1)+', '+fmt(M.iv.hi,1)+']',
        COL.live,SM_FONT,'center','middle');
  }
  /* the pointer hangs from the top of the plot and points DOWN at the line,
     as PhET's does.  Its first draft sat in the band below, where its
     triangle covered a tick label and its text landed inside the IQR box —
     a fill, which the label registry cannot see. */
  if(st.vPointer){
    const X=map.X(st.vPtr);
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(X,geom.top0); ctx.lineTo(X,geom.ly-2); ctx.stroke();
    downTriangle(ctx,X,geom.ly-1,5,COL.struct);
    lab(ctx,W,H,X,geom.top0-11,'pointer '+fmt(st.vPtr,1)+' m',COL.struct,SM_FONT,'center','middle');
  }
  cavCaption(ctx,L);
  return L;
}

/* ================================================================== *
 *  view D — which quartile                                            *
 * ================================================================== */
const CONV_CAP_FULL='Six conventions, one data set. Every statistics package computes quartiles, and they do not all compute the same ones: with an even count PhET&rsquo;s exclusive median-of-halves rule agrees with Tukey&rsquo;s hinges and with Hazen, and with an odd count it switches to Weibull and parts from Tukey. It never agrees with numpy&rsquo;s default (Excel&rsquo;s QUARTILE.INC) except by accident. The marks under the line are Q1 and Q3 under each rule; the panel counts how often the rules disagree as the number of kicks grows, computed on this page from the same generator and pinned to derive.py.';
const CONV_CAP_SHORT='Six quartile conventions on one data set: PhET&rsquo;s rule is Weibull at odd n and Hazen at even n, and never numpy&rsquo;s default.';
/* the disagreement sweep, computed here (400 data sets per n on a fixed seed)
   and asserted against derive.py's 3000-trial version to binomial tolerance */
const SWEEP_TRIALS=400, SWEEP_SEED=606121;
function convSweep(){
  if(WORLD.sweep) return WORLD.sweep;
  const rows=[];
  for(let n=CAV.MIN_KICKS_IQR;n<=30;n++){
    const r=cavRng(SWEEP_SEED+n);
    let dl=0,dt=0,dw=0;
    for(let k=0;k<SWEEP_TRIALS;k++){
      const xs=[];
      for(let i=0;i<n;i++) xs.push(CAV.VMIN+Math.floor(r.next()*(CAV.VMAX-CAV.VMIN+1)));
      const q=cavQuartiles(xs);
      const li=cavConvention(xs,'linear'), tu=cavConvention(xs,'tukey'), we=cavConvention(xs,'weibull');
      if(Math.abs(q.q1-li.q1)>1e-12||Math.abs(q.q3-li.q3)>1e-12) dl++;
      if(Math.abs(q.q1-tu.q1)>1e-12||Math.abs(q.q3-tu.q3)>1e-12) dt++;
      if(Math.abs(q.q1-we.q1)>1e-12||Math.abs(q.q3-we.q3)>1e-12) dw++;
    }
    rows.push({n,linear:dl/SWEEP_TRIALS,tukey:dt/SWEEP_TRIALS,weibull:dw/SWEEP_TRIALS});
  }
  WORLD.sweep=rows;
  return rows;
}
function viewConv(ctx,W,H,M,st){
  const L=cavLayout(ctx,W,H,CONV_CAP_FULL,CONV_CAP_SHORT,0.46);
  const mb=L.room?L.field:L.full;
  const geom=drawNumberLine(ctx,mb,'the data set — '+M.stat.n+' kicks ('+M.parity+')');
  const d=drawDots(ctx,geom,mb,M.xs,'dot',{view:'conv'});
  geom.top0=d.top-6;
  /* Q1 and Q3 under each convention, on their own rows so six marks at nearly
     the same place are all readable */
  const rowY=geom.ly+NL_BAR-2;
  M.conv.forEach((c,i)=>{
    const col=COL.conv[i];
    const a=geom.map.X(c.q1), b2=geom.map.X(c.q3);
    ctx.strokeStyle=col; ctx.lineWidth=1.6;
    const yy=rowY+i*4;
    ctx.beginPath(); ctx.moveTo(a,yy); ctx.lineTo(b2,yy); ctx.stroke();
    dot(ctx,a,yy,2.6,col,null,0); dot(ctx,b2,yy,2.6,col,null,0);
  });
  /* the legend has to name which colour is which rule, and the IQRs differ by
     less than a dot, so the panel below carries the numbers */
  legendAuto(ctx,mb,M.conv.map((c,i)=>[COL.conv[i],plain(c.name)+'  '+fmt(c.q1,2)+'–'+fmt(c.q3,2)]));
  if(!L.room){
    lab(ctx,W,H,mb.x+4,mb.y1-9,'narrow stage: the IQR bars and the disagreement sweep are not drawn',
        '#5d6578',SM_FONT,'left','middle');
    cavCaption(ctx,L);
    return L;
  }
  const half=Math.floor((L.plot.w-58)/2);
  const pb=box(L.plot.x,L.plot.y+10,half,Math.max(50,L.plot.h-26));
  const sb=box(L.plot.x+half+58,L.plot.y+10,half,Math.max(50,L.plot.h-26));
  /* left: the six IQRs as bars */
  const iqrs=M.conv.map(c=>c.iqr);
  const lo=0, hi=Math.max.apply(null,iqrs)*1.25+0.2;
  const SHORTC=['PhET','Tukey','Weibull','Hazen','linear','midpt'];
  axesQ(ctx,pb,lo,hi,0,M.conv.length,{nx:5,xfmt:t=>fmt(t,1),
    yticks:M.conv.map((c,i)=>i+0.5),yfmt:t=>SHORTC[Math.floor(t)]||'',
    xlab:'IQR (metres)',title:titleFor(pb,'the six IQRs of one data set','the six IQRs')});
  M.conv.forEach((c,i)=>{
    const y0=pb.y1-pb.h*(i+0.78)/M.conv.length, y1=pb.y1-pb.h*(i+0.22)/M.conv.length;
    const x1=pb.x+pb.w*(c.iqr-lo)/(hi-lo);
    ctx.fillStyle=rgba(COL.conv[i],c.id==='phet'?0.85:0.5);
    ctx.fillRect(pb.x,y1,Math.max(1,x1-pb.x),y0-y1);
    lab(ctx,W,H,x1+5,(y0+y1)/2,fmt(c.iqr,2),COL.conv[i],SM_FONT,'left','middle');
  });
  /* right: how often the rules disagree, against n */
  const sw=convSweep();
  axesQ(ctx,sb,CAV.MIN_KICKS_IQR,30,0,1,{nx:6,ny:5,
    xlab:'number of kicks n',ylab:'fraction that differ',
    yfmt:t=>fmt(t,1),xfmt:t=>fmt(t,0),
    title:titleFor(sb,'how often PhET’s rule differs','disagreement vs n')});
  const ns=sw.map(r=>r.n);
  polyline(ctx,sb,ns,sw.map(r=>r.linear),CAV.MIN_KICKS_IQR,30,0,1,COL.conv[4],1.8);
  polyline(ctx,sb,ns,sw.map(r=>r.tukey),CAV.MIN_KICKS_IQR,30,0,1,COL.conv[1],1.6);
  polyline(ctx,sb,ns,sw.map(r=>r.weibull),CAV.MIN_KICKS_IQR,30,0,1,COL.conv[2],1.6);
  legendAuto(ctx,sb,[[COL.conv[4],'vs numpy default (linear)'],
                     [COL.conv[1],'vs Tukey (zero at even n)'],
                     [COL.conv[2],'vs Weibull (zero at odd n)']]);
  lab(ctx,W,H,sb.x+4,sb.y1+34,SWEEP_TRIALS+' uniform data sets per n, this page’s own generator',
      '#5d6578',SM_FONT,'left','middle');
  cavCaption(ctx,L);
  return L;
}

/* ================================================================== *
 *  view E — the balance point                                         *
 * ================================================================== */
const BAL_CAP_FULL='Why the mean balances, and what it costs. Each estimator is the minimiser of its own loss: the mean of the squared distance and the median of the absolute distance, and neither is the minimiser of the other&rsquo;s. The left panel draws both losses against a trial centre c, each divided by its own minimum so the two fit one axis (the division is stated because it is a scale distortion). The right panel drags the last ball from 1 m to 15 m and records what each statistic does: the mean is a straight line of slope exactly 1/n, the median is a staircase that stops moving the moment the ball leaves the middle.';
const BAL_CAP_SHORT='The mean minimises the squared distance, the median the absolute distance &mdash; and only one of them follows a ball that runs away.';
function influenceRows(M,st){
  const base=drawsOf(SEEDS.balance,st.bKick,st.bN).slice();
  const out=[];
  for(let v=CAV.VMIN;v<=CAV.VMAX;v++){
    base[base.length-1]=v;
    out.push([v,cavMean(base),cavMedian(base)]);
  }
  return out;
}
function viewBalance(ctx,W,H,M,st){
  const L=cavLayout(ctx,W,H,BAL_CAP_FULL,BAL_CAP_SHORT,0.40);
  const mb=L.room?L.field:L.full;
  const geom=drawNumberLine(ctx,mb,'the data set — the last ball is yours to move');
  const d=drawDots(ctx,geom,mb,M.xs,'dot',{view:'balance',
    mark:(i)=>i===M.moved?COL.live:null});
  geom.top0=d.top-6;
  const S=M.stat, map=geom.map;
  /* the two moments, equal by the identity, at their own printed scale */
  const mom=momentBars(ctx,geom,mb,M.xs,S.mean);
  lab(ctx,W,H,mom.mx,geom.ly+NL_LAB2+16,
      'each side pulls '+fmt(mom.Mm.neg,3)+' m — equal, exactly  ·  bars at 1 m = '
      +fmt(mom.sc,1)+' px, not the number line’s scale',
      COL.ref,SM_FONT,'center','middle');
  meanFulcrum(ctx,geom,S.mean,COL.mean,'mean '+fmt(S.mean,3),W,H);
  medianMark(ctx,geom,S.median,COL.med,'median '+fmt(S.median,1),W,H);
  lab(ctx,W,H,mb.x+4,mb.y+13,
      'sum of (x_i − mean) = '+fmt(M.torque,12)+' m',COL.mean,SM_FONT,'left','middle');
  if(!L.room){
    lab(ctx,W,H,mb.x+4,mb.y1-9,'narrow stage: the loss curves and the influence panel are not drawn',
        '#5d6578',SM_FONT,'left','middle');
    cavCaption(ctx,L);
    return L;
  }
  const half=Math.floor((L.plot.w-58)/2);
  const pb=box(L.plot.x,L.plot.y+10,half,Math.max(50,L.plot.h-26));
  const ib=box(L.plot.x+half+58,L.plot.y+10,half,Math.max(50,L.plot.h-26));
  /* the two losses, each normalised by its own minimum */
  if(st.bLoss){
    const cs=[],sq=[],ab=[];
    const sqMin=cavSqLoss(M.xs,S.mean), abMin=cavAbsLoss(M.xs,S.median);
    for(let k=0;k<=160;k++){
      const c=XLO+(XHI-XLO)*k/160;
      cs.push(c); sq.push(cavSqLoss(M.xs,c)/sqMin); ab.push(cavAbsLoss(M.xs,c)/abMin);
    }
    const hi=Math.min(6,Math.max(2.2,Math.max.apply(null,ab)*1.08));
    axesQ(ctx,pb,XLO,XHI,1,hi,{nx:5,ny:4,xlab:'trial centre c (metres)',
      ylab:'loss / its own minimum',yfmt:t=>fmt(t,1),xfmt:t=>fmt(t,0),
      title:titleFor(pb,'each loss, divided by its own minimum','the two losses')});
    polyline(ctx,pb,cs,sq,XLO,XHI,1,hi,COL.mean,1.8);
    polyline(ctx,pb,cs,ab,XLO,XHI,1,hi,COL.med,1.8);
    marker(ctx,pb,XLO,XHI,1,hi,S.mean,1,COL.mean);
    marker(ctx,pb,XLO,XHI,1,hi,S.median,1,COL.med);
    legendAuto(ctx,pb,[[COL.mean,'sum of (x_i − c)², least at the mean'],
                       [COL.med,'sum of |x_i − c|, least at the median']]);
    lab(ctx,W,H,pb.x+4,pb.y1+34,'each curve is divided by its own minimum (×'
        +fmt(sqMin,1)+' and ×'+fmt(abMin,1)+') so one axis holds both',
        '#5d6578',SM_FONT,'left','middle');
  }
  /* the influence curve */
  const rows=influenceRows(M,st);
  const ylo=Math.min.apply(null,rows.map(r=>Math.min(r[1],r[2])))-0.6;
  const yhi=Math.max.apply(null,rows.map(r=>Math.max(r[1],r[2])))+0.6;
  axesQ(ctx,ib,CAV.VMIN,CAV.VMAX,ylo,yhi,{nx:5,ny:5,
    xlab:'where the last ball is (metres)',ylab:'statistic (metres)',
    yfmt:t=>fmt(t,1),xfmt:t=>fmt(t,0),
    title:titleFor(ib,'what one moved ball does','influence')});
  polyline(ctx,ib,rows.map(r=>r[0]),rows.map(r=>r[1]),CAV.VMIN,CAV.VMAX,ylo,yhi,COL.mean,1.8);
  polyline(ctx,ib,rows.map(r=>r[0]),rows.map(r=>r[2]),CAV.VMIN,CAV.VMAX,ylo,yhi,COL.med,1.8);
  marker(ctx,ib,CAV.VMIN,CAV.VMAX,ylo,yhi,st.bMove,S.mean,COL.live);
  legendAuto(ctx,ib,[[COL.mean,'mean, slope exactly 1/n = '+fmt(1/M.stat.n,4)],
                     [COL.med,'median, flat outside the middle']]);
  cavCaption(ctx,L);
  return L;
}

/* ================================================================== *
 *  view F — the long run                                              *
 * ================================================================== */
const LONG_CAP_FULL='The kicker&rsquo;s weights are published, so there is nothing to estimate here: the population mean, median, standard deviation and MAD are sums over fifteen numbers, and a sample can be judged against them rather than against another sample. The bars are the relative frequencies this page drew; the orange marks are the probabilities PhET&rsquo;s sampler implies, w(i)/&Sigma;w exactly. The running mean converges inside &plusmn;2&sigma;/&radic;n, which is a tolerance computed rather than chosen &mdash; and the sample MAD does not converge from below: whether it is biased up or down depends on whether &mu; lands on a whole metre.';
const LONG_CAP_SHORT='Frequencies against the kicker&rsquo;s own weights, and the running mean inside its &plusmn;2&sigma;/&radic;n band.';
function viewLong(ctx,W,H,M,st){
  const L=cavLayout(ctx,W,H,LONG_CAP_FULL,LONG_CAP_SHORT,0.46);
  const P=M.pop, N=M.stat.n;
  const mb=L.room?L.field:L.full;
  const fb=box(mb.x+10,mb.y+16,mb.w-20,Math.max(60,mb.h-42));
  const pmax=Math.max(Math.max.apply(null,P.p),Math.max.apply(null,M.counts)/N)*1.2;
  axesQ(ctx,fb,XLO,XHI,0,pmax,{nx:8,ny:5,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,2),
    xlab:'kick distance (metres)',ylab:'probability',
    title:titleFor(fb,N+' kicks against the kicker’s own weights','frequencies vs weights')});
  const map=nlMap(fb), bw=map.s*0.66;
  for(let i=0;i<M.counts.length;i++){
    const v=i+CAV.VMIN, f=M.counts[i]/N;
    const X=map.X(v), y0=fb.y1, y1=fb.y1-fb.h*f/pmax;
    ctx.fillStyle=rgba(COL.pos,0.55);
    ctx.fillRect(X-bw/2,y1,bw,y0-y1);
  }
  for(let i=0;i<P.p.length;i++){
    const X=map.X(i+CAV.VMIN), Y=fb.y1-fb.h*P.p[i]/pmax;
    ctx.strokeStyle=COL.ref; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(X-bw/2,Y); ctx.lineTo(X+bw/2,Y); ctx.stroke();
  }
  ctx.strokeStyle=COL.mean; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(map.X(P.mean),fb.y); ctx.lineTo(map.X(P.mean),fb.y1); ctx.stroke();
  ctx.setLineDash([]);
  legendAuto(ctx,fb,[[rgba(COL.pos,0.55),'measured frequency'],
                     [COL.ref,'wᵢ/Σw, exactly'],
                     [COL.mean,'μ = '+fmt(P.mean,3)+' m']]);
  if(!L.room){
    lab(ctx,W,H,fb.x,fb.y1+38,'narrow stage: the running mean and the sample-vs-population panel are not drawn',
        '#5d6578',SM_FONT,'left','middle');
    cavCaption(ctx,L);
    return L;
  }
  const half=Math.floor((L.plot.w-58)/2);
  const tb=box(L.plot.x,L.plot.y+10,half,Math.max(50,L.plot.h-26));
  const cb=box(L.plot.x+half+58,L.plot.y+10,half,Math.max(50,L.plot.h-26));
  /* the running mean inside its band */
  const band=st.lBands;
  const ylo=P.mean-3*P.sd/Math.sqrt(10), yhi=P.mean+3*P.sd/Math.sqrt(10);
  /* from the TENTH kick: below that the running mean is off this scale and
     the curve entered the box from the top, which reads as a broken plot */
  const LX0=1;
  axesQ(ctx,tb,LX0,Math.log10(N),ylo,yhi,{nx:4,ny:5,
    xlab:'kicks so far (log₁₀)',ylab:'running mean (metres)',
    xfmt:t=>fmt(Math.pow(10,t),0),yfmt:t=>fmt(t,1),
    title:titleFor(tb,'the running mean from the tenth kick, inside ±2σ/√n','the running mean')});
  if(band){
    const ks=[],up=[],dn=[];
    for(let k=0;k<=120;k++){
      const lg=Math.log10(10)+ (Math.log10(N)-1)*k/120;
      const n=Math.pow(10,lg);
      ks.push(lg); up.push(P.mean+2*P.sd/Math.sqrt(n)); dn.push(P.mean-2*P.sd/Math.sqrt(n));
    }
    polyline(ctx,tb,ks,up,LX0,Math.log10(N),ylo,yhi,COL.ref,1.3,[4,3]);
    polyline(ctx,tb,ks,dn,LX0,Math.log10(N),ylo,yhi,COL.ref,1.3,[4,3]);
  }
  polyline(ctx,tb,[LX0,Math.log10(N)],[P.mean,P.mean],LX0,Math.log10(N),ylo,yhi,COL.mean,1.3);
  polyline(ctx,tb,M.trace.map(r=>Math.log10(r[0])),M.trace.map(r=>r[1]),
           LX0,Math.log10(N),ylo,yhi,COL.pos,1.8);
  legendAuto(ctx,tb,[[COL.pos,'running mean'],[COL.mean,'μ'],[COL.ref,'±2σ/√n']]);
  /* sample against population, four statistics on one metre axis */
  const items=[['mean',M.stat.mean,P.mean,COL.mean],
               ['median',M.stat.median,P.median,COL.med],
               ['MAD',M.stat.madExact,P.mad,COL.mad],
               ['σ',M.stat.sd,P.sd,COL.rng]];
  const vlo=0, vhi=Math.max.apply(null,items.map(t=>Math.max(t[1],t[2])))*1.25+0.3;
  axesQ(ctx,cb,vlo,vhi,0,items.length,{nx:5,ny:1,yticks:[],xfmt:t=>fmt(t,0),
    xlab:'metres',title:titleFor(cb,'this sample against the population','sample vs population')});
  items.forEach((t,i)=>{
    const y=cb.y1-cb.h*(i+0.5)/items.length;
    const Xs=cb.x+cb.w*(t[1]-vlo)/(vhi-vlo), Xp=cb.x+cb.w*(t[2]-vlo)/(vhi-vlo);
    ctx.strokeStyle=rgba(t[3],0.45); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(Xs,y); ctx.lineTo(Xp,y); ctx.stroke();
    dot(ctx,Xs,y,4,t[3],'#0b0f1a',1);
    ctx.strokeStyle=COL.ref; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(Xp,y-6); ctx.lineTo(Xp,y+6); ctx.stroke();
    lab(ctx,W,H,cb.x+4,y-11,plain(t[0])+'  '+fmt(t[1],3)+' vs '+fmt(t[2],3),t[3],SM_FONT,'left','middle');
  });
  lab(ctx,W,H,cb.x+4,cb.y1+34,'dot = this sample, orange bar = the population value',
      '#5d6578',SM_FONT,'left','middle');
  cavCaption(ctx,L);
  return L;
}

/* ================================================================== *
 *  dispatch and the scene                                             *
 * ================================================================== */
function drawView(ctx,W,H,M,st){
  st=st||ST;
  POLY_SEGS=[]; LEGEND_RECTS=[]; LABELS=[];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='kicks') return viewKicks(ctx,W,H,M,st);
  if(M.view==='meanmed') return viewMeanMed(ctx,W,H,M,st);
  if(M.view==='spread') return viewSpread(ctx,W,H,M,st);
  if(M.view==='conv') return viewConv(ctx,W,H,M,st);
  if(M.view==='balance') return viewBalance(ctx,W,H,M,st);
  return viewLong(ctx,W,H,M,st);
}
/* the layout a hit test needs, recomputed the way the view computes it */
function layoutOf(S,M){
  const ctx=S.measure(), W=S.W, H=S.H, st=M.st;
  if(M.view==='kicks') return cavLayout(ctx,W,H,KICKS_CAP_FULL,KICKS_CAP_SHORT,0.50,st.mSort?62:30,fieldWantH(M.xs),plotWantH(M.maxK));
  if(M.view==='meanmed') return cavLayout(ctx,W,H,MM_CAP_FULL,MM_CAP_SHORT,0.44,30,fieldWantH(M.xs),plotWantH(M.maxK));
  if(M.view==='spread') return cavLayout(ctx,W,H,SP_CAP_FULL,SP_CAP_SHORT,0.42,30,fieldWantH(M.xs),plotWantH(M.maxK));
  if(M.view==='conv') return cavLayout(ctx,W,H,CONV_CAP_FULL,CONV_CAP_SHORT,0.46);
  if(M.view==='balance') return cavLayout(ctx,W,H,BAL_CAP_FULL,BAL_CAP_SHORT,0.40);
  return cavLayout(ctx,W,H,LONG_CAP_FULL,LONG_CAP_SHORT,0.46);
}
/* the number line of the view that has one, and its geometry */
function plotGeomOf(S,M){
  const L=layoutOf(S,M);
  const raw=(M.view==='conv'||M.view==='balance')?L.field:L.plot;
  const b=(M.view==='conv'||M.view==='balance')&&!L.room?L.full:raw;
  const D=dotGeomOf(b,M.xs,M.view);
  return {L,b,map:D.map,ly:D.ly,dots:D};
}
const PRED_GRAB=14;
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.measure=()=>canvas.getContext('2d');
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel(),ST); };
  S.step=function(){ return ST.running?worldStep(ST,FRAME_DT):false; };
  S.kick=function(n){ return kickNow(ST,n); };
  /* what the pointer can grab, in the order it is tried */
  S.hit=function(x,y){
    const M=buildModel(), st=ST;
    if(st.view==='kicks'||st.view==='meanmed'||st.view==='spread'){
      const L=layoutOf(S,M);
      const G=fieldGeomOf(L.field,M.xs);
      const i=ballAt(M.xs,G,x,y);
      if(i>=0) return {what:'ball',idx:i,map:G.map};
      const g=plotGeomOf(S,M);
      if(st.view==='spread'&&st.vInterval&&y>=g.dots.top-16&&y<=g.ly+6){
        const d1=Math.abs(x-g.map.X(st.vH1)), d2=Math.abs(x-g.map.X(st.vH2));
        if(Math.min(d1,d2)<PRED_GRAB) return {what:d1<=d2?'h1':'h2',map:g.map};
      }
      /* the pointer is now drawn hanging from the top of the plot box down to
         the line, so its grab region is that whole column and not a band
         under the line (where it used to be drawn) */
      if(st.view==='spread'&&st.vPointer&&Math.abs(x-g.map.X(st.vPtr))<PRED_GRAB&&
         y>=g.b.y&&y<=g.ly+10)
        return {what:'ptr',map:g.map};
      if(st.view==='kicks'&&st.mPredict&&Math.abs(x-g.map.X(st.mPredVal))<PRED_GRAB&&Math.abs(y-g.ly-13)<22)
        return {what:'predMed',map:g.map};
      if(st.view==='meanmed'&&st.aPredMean&&Math.abs(x-g.map.X(st.aPredMeanVal))<PRED_GRAB&&Math.abs(y-g.ly+14)<22)
        return {what:'predMean',map:g.map};
      if(st.view==='meanmed'&&st.aPredMed&&Math.abs(x-g.map.X(st.aPredMedVal))<PRED_GRAB&&Math.abs(y-g.ly-14)<22)
        return {what:'predMed2',map:g.map};
      return null;
    }
    if(st.view==='balance'){
      const g=plotGeomOf(S,M);
      const G={map:g.map,gy:g.ly,rowH:g.dots.rowH,br:g.dots.r,stacks:g.dots.stacks};
      const i=ballAt(M.xs,G,x,y);
      if(i===M.moved) return {what:'move',map:g.map};
      return null;
    }
    return null;
  };
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    if(type==='down'){
      const h2=S.hit(x,y);
      if(!h2) return false;
      DRAG.what=h2.what; DRAG.idx=h2.idx; DRAG.map=h2.map;
      return true;
    }
    if(type==='move'&&DRAG.what){
      const v=DRAG.map.V(x), st=ST;
      if(DRAG.what==='ball'){
        const F=curField(st); if(!F) return false;
        const nv=cavSnapValue(v);
        if(F.xs[DRAG.idx]===nv) return false;
        F.xs[DRAG.idx]=nv; return true;
      }
      if(DRAG.what==='move'){
        const nv=cavSnapValue(v);
        if(st.bMove===nv) return false;
        st.bMove=nv; return true;
      }
      const cl=clamp(v,CAV.DRAG_LO,CAV.DRAG_HI);
      if(DRAG.what==='h1'){ if(st.vH1===cl) return false; st.vH1=cl; return true; }
      if(DRAG.what==='h2'){ if(st.vH2===cl) return false; st.vH2=cl; return true; }
      if(DRAG.what==='ptr'){ if(st.vPtr===cl) return false; st.vPtr=cl; return true; }
      /* PhET's predict-median thumb snaps to 0.5 m; predict-mean is continuous */
      if(DRAG.what==='predMed'){
        const s2=cavRoundToInterval(clamp(v,CAV.VMIN,CAV.VMAX),CAV.MEDIAN_SNAP);
        if(st.mPredVal===s2) return false; st.mPredVal=s2; return true;
      }
      if(DRAG.what==='predMed2'){
        const s2=cavRoundToInterval(clamp(v,CAV.VMIN,CAV.VMAX),CAV.MEDIAN_SNAP);
        if(st.aPredMedVal===s2) return false; st.aPredMedVal=s2; return true;
      }
      if(DRAG.what==='predMean'){
        const c2=clamp(v,CAV.VMIN,CAV.VMAX);
        if(st.aPredMeanVal===c2) return false; st.aPredMeanVal=c2; return true;
      }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  /* `dirty` asks the frame loop to repaint.  It is set ONLY by the two
     pointer handlers, which are the only ones that change the picture
     without calling refresh(); every other handler calls refresh(), which
     draws unconditionally, so a `dirty=true` beside it would ask for one
     extra identical frame and nothing else.  Twelve handlers had exactly
     that, and the mutation sweep found it: deleting the flag from a slider
     changed nothing any test could see, because the slider had already
     drawn.  A flag that means nothing on a path is worse than no flag. */
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k; DRAG.what=null;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2)); });

  /* Labels passed as TEXT CHILDREN of h() become text nodes, so an HTML
     entity in one would be drawn literally ('&plusmn;2&sigma;'), unlike the
     .tag divs below, which are set through innerHTML.  Text-child labels
     therefore use literal glyphs; the UI drive found the three that did not. */
  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); refresh(); });
    rows[key]={row:rowEl,sync,inp}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  const CHIPROWS=[];
  /* every chip row carries a data-key: six of them are labelled 1..4 and a
     match-by-word finder would drive the wrong one (lenses Known-bad) */
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips','data-key':key});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        if(c.disabled) return;
        st[key]=o.id; if(onPick) onPick(o);
        syncChips(); syncPanel(); refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function button(lab2,fn){ return h('button',{onclick:()=>{ fn(); syncChips(); syncPanel(); refresh(); }},lab2); }

  /* ---- the kicks (PhET's Median screen) ---- */
  const gK=h('div',{class:'grp'},h('h3',null,'the kicks'));
  gK.appendChild(h('div',{class:'tag'},'kicker (PhET’s four jerseys):'));
  gK.appendChild(chipRow(KICK_LIST,'mKick'));
  gK.appendChild(h('div',{class:'tag'},'max kicks (PhET caps this screen at 15):'));
  gK.appendChild(chipRow(MAXK_MED_LIST,'mMax'));
  gK.appendChild(h('div',{class:'tag'},'plot type (PhET’s preference):'));
  gK.appendChild(chipRow(PLOT_LIST,'mPlot'));
  gK.appendChild(h('div',{class:'checks'},checkbox('mMedian','median'),
    checkbox('mSort','sort data'),checkbox('mPredict','predict median')));
  gK.appendChild(slider('mPredVal','your median guess',CAV.VMIN,CAV.VMAX,CAV.MEDIAN_SNAP,v=>fmt(v,1)+' m'));
  const kTag=h('div',{class:'tag'}); gK.appendChild(kTag);

  /* ---- mean and median ---- */
  const gA=h('div',{class:'grp'},h('h3',null,'mean and median'));
  gA.appendChild(h('div',{class:'tag'},'kicker:'));
  gA.appendChild(chipRow(KICK_LIST,'aKick'));
  gA.appendChild(h('div',{class:'tag'},'max kicks:'));
  gA.appendChild(chipRow(MAXK_LIST,'aMax'));
  gA.appendChild(h('div',{class:'tag'},'plot type:'));
  gA.appendChild(chipRow(PLOT_LIST,'aPlot'));
  gA.appendChild(h('div',{class:'checks'},checkbox('aMean','mean (the fulcrum)'),
    checkbox('aMedian','median'),checkbox('aPredMean','predict mean'),
    checkbox('aPredMed','predict median')));
  gA.appendChild(slider('aPredMeanVal','your mean guess',CAV.VMIN,CAV.VMAX,0.01,v=>fmt(v,2)+' m'));
  gA.appendChild(slider('aPredMedVal','your median guess',CAV.VMIN,CAV.VMAX,CAV.MEDIAN_SNAP,v=>fmt(v,1)+' m'));
  const aTag=h('div',{class:'tag'}); gA.appendChild(aTag);

  /* ---- the spread ---- */
  const gV=h('div',{class:'grp'},h('h3',null,'the spread'));
  gV.appendChild(h('div',{class:'tag'},'kicker (each keeps its own field, as PhET does):'));
  gV.appendChild(chipRow(KICK_LIST,'vKick'));
  gV.appendChild(h('div',{class:'tag'},'max kicks:'));
  gV.appendChild(chipRow(MAXK_LIST,'vMax'));
  gV.appendChild(h('div',{class:'tag'},'measure:'));
  gV.appendChild(chipRow(MEASURES,'vMeasure'));
  gV.appendChild(h('div',{class:'checks'},checkbox('vShow','show the measure'),
    checkbox('vMean','mean'),checkbox('vOutliers','outliers'),
    checkbox('vInterval','interval tool'),checkbox('vPointer','pointer')));
  gV.appendChild(slider('vH1','interval from',CAV.DRAG_LO,CAV.DRAG_HI,0.1,v=>fmt(v,1)+' m'));
  gV.appendChild(slider('vH2','interval to',CAV.DRAG_LO,CAV.DRAG_HI,0.1,v=>fmt(v,1)+' m'));
  gV.appendChild(slider('vPtr','pointer at',CAV.DRAG_LO,CAV.DRAG_HI,0.1,v=>fmt(v,1)+' m'));
  const vTag=h('div',{class:'tag'}); gV.appendChild(vTag);

  /* ---- which quartile ---- */
  const gC=h('div',{class:'grp'},h('h3',null,'which quartile'));
  gC.appendChild(h('div',{class:'tag'},'kicker:'));
  gC.appendChild(chipRow(KICK_LIST,'cKick'));
  gC.appendChild(slider('cN','kicks in the data set',CAV.MIN_KICKS_IQR,30,1,v=>fmt(v,0)));
  const cTag=h('div',{class:'tag'}); gC.appendChild(cTag);

  /* ---- the balance point ---- */
  const gB=h('div',{class:'grp'},h('h3',null,'the balance point'));
  gB.appendChild(h('div',{class:'tag'},'kicker:'));
  gB.appendChild(chipRow(KICK_LIST,'bKick'));
  gB.appendChild(slider('bN','kicks in the data set',CAV.MIN_KICKS_IQR,25,1,v=>fmt(v,0)));
  gB.appendChild(slider('bMove','the last ball',CAV.VMIN,CAV.VMAX,1,v=>fmt(v,0)+' m'));
  gB.appendChild(h('div',{class:'checks'},checkbox('bLoss','the two loss curves')));
  const bTag=h('div',{class:'tag'}); gB.appendChild(bTag);

  /* ---- the long run ---- */
  const gL=h('div',{class:'grp'},h('h3',null,'the long run'));
  gL.appendChild(h('div',{class:'tag'},'kicker:'));
  gL.appendChild(chipRow(KICK_LIST,'lKick'));
  gL.appendChild(h('div',{class:'tag'},'kicks drawn:'));
  gL.appendChild(chipRow(LONG_LIST,'lN'));
  gL.appendChild(h('div',{class:'checks'},checkbox('lBands','the ±2σ/√n band')));
  const lTag=h('div',{class:'tag'}); gL.appendChild(lTag);

  /* ---- kicking ---- */
  const gFire=h('div',{class:'grp'},h('h3',null,'kicking'));
  gFire.appendChild(h('div',{class:'btnrow'},
    button('kick 1',()=>{ S.kick(1); }),
    button('kick 5',()=>{ S.kick(5); }),
    button('fill',()=>{ const F=curField(st); if(F) cavFieldBatch(F,F.max); })));
  gFire.appendChild(h('div',{class:'btnrow'},
    button('clear',()=>{ const F=curField(st); if(F) cavFieldClear(F); }),
    button('reset this view',()=>{ resetView(); })));
  gFire.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  const fTag=h('div',{class:'tag'}); gFire.appendChild(fTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Center and Variability (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. '
      +'PhET&rsquo;s conventions and constants (PHYSICAL_RANGE 1&ndash;15 m, VARIABILITY_DRAG_RANGE 0&ndash;16, MAX_KICKS_VALUES 5&ndash;30 with the Median screen capped at 15, the even-count median, the exclusive median-of-halves quartiles with their five-kick floor, the MAD rounded to a tenth three times over, the 0.5 m predict-median snap and the four kickers&rsquo; weight arrays) are read from its published build and cited as PhET&rsquo;s values. '
      +'Everything else is derived and pinned in selfTest to build/center-and-variability/derive.py, whose printed output is refvals.txt: every statistic against numpy on twenty-seven data sets including the degenerate ones, the quartile-convention equivalence on four thousand more, a chi-square of the sampler against the weights on a million draws each, and Monte-Carlo sampling laws.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the mathematics'),h('div',{id:'phys'}));
  [gK,gA,gV,gC,gB,gL,gFire,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function resetView(){
    const v=st.view;
    for(const k in DEFAULTS) if(k!=='view') st[k]=DEFAULTS[k];
    st.view=v; resetWorlds();
  }
  function syncChips(){
    for(const [cw,list,key] of CHIPROWS)
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')+(b.disabled?' off':''));
  }
  function syncPanel(){
    const v=st.view;
    gK.hidden=(v!=='kicks');
    gA.hidden=(v!=='meanmed');
    gV.hidden=(v!=='spread');
    gC.hidden=(v!=='conv');
    gB.hidden=(v!=='balance');
    gL.hidden=(v!=='longrun');
    gFire.hidden=!(v==='kicks'||v==='meanmed'||v==='spread');
    /* a control that is live but ignored is worse than no control: the
       prediction sliders only exist while their checkbox is on, and the
       interval/pointer sliders only while their tool is out */
    if(rows.mPredVal) rows.mPredVal.row.hidden=!st.mPredict;
    if(rows.aPredMeanVal) rows.aPredMeanVal.row.hidden=!st.aPredMean;
    if(rows.aPredMedVal) rows.aPredMedVal.row.hidden=!st.aPredMed;
    if(rows.vH1) rows.vH1.row.hidden=!st.vInterval;
    if(rows.vH2) rows.vH2.row.hidden=!st.vInterval;
    if(rows.vPtr) rows.vPtr.row.hidden=!st.vPointer;
    for(const k in rows) rows[k].sync();
    const M0=buildModel();
    kTag.innerHTML='Balls land on whole metres and stack; drag one along the line to move it. PhET&rsquo;s Median screen offers 5, 10 or 15 kicks only.';
    aTag.innerHTML='The predict-median thumb snaps to half a metre and the predict-mean thumb does not &mdash; PhET&rsquo;s roundToInterval settings, 0.5 and null.';
    vTag.innerHTML='Quartiles need five kicks (&ldquo;Need at least five kicks&rdquo;); below that PhET reports IQR = ? and so does this.';
    cTag.innerHTML='At odd n PhET&rsquo;s rule IS Weibull; at even n it is Hazen, and Tukey&rsquo;s hinges join it there. It is never numpy&rsquo;s default on purpose.';
    bTag.innerHTML='Slope of the mean against the moved ball: exactly 1/n = '+fmt(1/Math.max(1,M0.stat.n),4)+' m per metre.';
    lTag.innerHTML='&sigma; = '+fmt(M0.pop.sd,4)+' m for this kicker, so &sigma;/&radic;n = '+fmt(M0.pop.sd/Math.sqrt(st.lN),4)+' m at '+st.lN+' kicks.';
    const F=curField(st);
    fTag.innerHTML=(F&&F.xs.length+F.air.length>=F.max)
      ?'the field is full ('+F.max+' kicks)'
      :'<b>space</b> kicks &middot; <b>k</b> kicks five &middot; <b>c</b> clears &middot; <b>p</b> pauses &middot; 1&ndash;6 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='kicks'||st.view==='meanmed'||st.view==='spread')
        ?'drag a ball along the line to move it · space kicks · 1–6 switch views'
        :(st.view==='balance'?'drag the magenta ball · 1–6 switch views'
                             :'1–6 switch views');
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); S.kick(1); syncPanel(); refresh(); }
    else if(e.key==='k'){ S.kick(5); syncPanel(); refresh(); }
    else if(e.key==='p'){ st.running=!st.running; syncPanel(); refresh(); }
    else if(e.key==='c'){ const F=curField(st); if(F) cavFieldClear(F); syncPanel(); refresh(); }
    else if(e.key==='r'){ resetView(); syncChips(); syncPanel(); refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%8===0){ const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  kicks:'PhET&rsquo;s Median screen. A kicker sends balls down a field and each landing is recorded as a mark on a number line &mdash; which is all a dot plot is. Every distance is a whole metre between 1 and 15, so ties are the rule rather than the exception, and that is exactly where the median has to make a decision: with an even count there is no single middle value, so PhET takes the mean of the two middle ones and the median can land on a half metre that nothing was kicked to. Turn on <b>sort data</b> to see the cards in order with the middle one (or two) picked out in gold, and drag any ball along the line &mdash; it snaps to a whole metre, as PhET&rsquo;s does, and you can watch the median refuse to move until a ball crosses the middle.',
  meanmed:'PhET&rsquo;s Mean &amp; Median screen, with the mean drawn as what the word &ldquo;average&rdquo; hides: a balance point. The bars under the line are the signed deviations x<sub>i</sub> &minus; x&#772;, one per kick, and they cancel exactly &mdash; not nearly, exactly, because &Sigma;(x<sub>i</sub> &minus; x&#772;) = &Sigma;x<sub>i</sub> &minus; n&#183;(&Sigma;x<sub>i</sub>/n) is zero as algebra. The readout prints the sum to twelve decimals so you can see it is machine zero and not rounding. Then move one ball out to 15 m: the mean slides after it, by exactly one fifteenth of a metre per metre with fifteen kicks, while the median stays where it is. That is the whole difference between the two, and it is why an average income and a typical income are different questions.',
  spread:'PhET&rsquo;s Variability screen. Three measures, and the point of the screen is that they disagree about which kicker is most spread out. The <b>range</b> is made of two kicks and forgets the other thirteen, so one wild ball doubles it. The <b>IQR</b> is the width of the middle half &mdash; Q1 and Q3 by PhET&rsquo;s exclusive median-of-halves rule, which needs at least five kicks before it will say anything &mdash; and it does not move at all when an extreme ball moves further out; the box-and-whisker makes that visible, with anything beyond 1.5 &times; IQR marked as an outlier rather than swallowed by a whisker. The <b>MAD</b> counts every kick at its own distance from the mean, so it is between the two in robustness. The interval tool counts what lies between its handles, both ends included.',
  conv:'Quartiles are not one thing. Ask six pieces of software for Q1 and you can get six answers, because a quartile of a finite sample has to interpolate between order statistics and there is no agreement about how. PhET uses the exclusive median-of-halves rule: split the sorted data in half, throw the overall median away if the count is odd, and take the median of each half. Written as an order statistic that is h = (n+1)/4 when n is odd and h = n/4 + &frac12; when n is even &mdash; Hyndman &amp; Fan types 6 and 5, the Weibull and Hazen rules. derive.py proves that identity and checks it on four thousand data sets, including heavy-tie ones where conventions are most likely to coincide by accident. The right panel counts how often the rules actually differ, and the answer is: most of the time.',
  balance:'Two sentences that sound like definitions are really optimisation problems. The mean is the number that minimises &Sigma;(x<sub>i</sub> &minus; c)&sup2;, and the parallel-axis identity &Sigma;(x<sub>i</sub> &minus; c)&sup2; = &Sigma;(x<sub>i</sub> &minus; x&#772;)&sup2; + n(x&#772; &minus; c)&sup2; makes that exact: the second term is a parabola with its vertex at the mean and nothing else depends on c. The median is a number that minimises &Sigma;|x<sub>i</sub> &minus; c|, and because the absolute value has a corner the minimum can be a whole interval, which is why an even count leaves the median a choice. The right panel drags the last ball from one end of the field to the other: the mean is a straight line of slope 1/n and the median is a staircase that goes flat as soon as the ball is out of the middle. Robustness is that flatness.',
  longrun:'PhET&rsquo;s kickers are not mysteries: each one is a list of fifteen weights, and the sampler picks distance i with probability w<sub>i</sub>/&Sigma;w exactly. So the population mean, median, standard deviation and mean absolute deviation are sums over fifteen numbers, computed here rather than estimated, and the sample can be judged against them. The bars are what this page actually drew; the orange marks are the weights. The running mean is held to &plusmn;2&sigma;/&radic;n, a tolerance that comes from the sampling law and not from taste. One warning the picture carries: the sample MAD does not simply creep up to the population MAD. Because E|X &minus; c| has a kink wherever the distribution has an atom, a kicker whose mean lands on a whole metre (kickers 1 and 2, both centred on 8 m) is biased the other way &mdash; measured in derive.py, not assumed.'
};
