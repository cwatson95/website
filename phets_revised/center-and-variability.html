<title>Center and variability &mdash; soccer balls on a number line: the median, the mean as a balance point, range, IQR and MAD, and which quartile convention is which</title>
<!--
  ===================================================================
  center-and-variability.html — Remake of PhET Interactive
  Simulations' Center and Variability (University of Colorado
  Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets.
  ===================================================================

  Six views.  THE KICKS is PhET's Median screen: a kicker sends balls
  to whole-metre distances drawn from its own weights, they stack into
  a dot plot, any ball can be dragged along the line, the cards can be
  sorted, and the median is marked.  MEAN AND MEDIAN is PhET's Mean &
  Median screen: the same plot with the mean drawn as a fulcrum under
  a beam loaded with the signed deviations, and PhET's two prediction
  thumbs.  THE SPREAD is PhET's Variability screen: range, IQR with a
  box-and-whisker and the 1.5 x IQR outlier rule, MAD, the interval
  tool and the pointer, with a separate field per kicker as PhET
  keeps them.  WHICH QUARTILE, THE BALANCE POINT and THE LONG RUN are
  house additions: the six quartile conventions side by side, the two
  loss functions each statistic minimises, and the kickers' own
  weights as the population the samples are judged against.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * PhET's quartile rule has a name, in fact two.  Its
    VariabilitySceneModel splits the sorted data at floor(n/2),
    discards the overall median when n is odd, and takes the median of
    each half.  Written as an order statistic that is
    h = (n+1)/4 for odd n and h = n/4 + 1/2 for even n — i.e. exactly
    Hyndman & Fan type 6 (Weibull, numpy method='weibull') at odd n
    and type 5 (Hazen) at even n.  At even n it also coincides with
    Tukey's hinges, because an even split has no middle value to
    include or exclude.  Proved by counting positions in each half and
    checked on 4000 data sets — uniform, heavy-tie and three-value —
    with zero disagreements.  It differs from numpy's DEFAULT ('linear',
    Excel QUARTILE.INC) on 1207 of 2000 random data sets, and the
    disagreement rate falls only from 98 % at n = 5 to 68 % at
    n = 30.
  * PhET's displayed MAD is not the MAD.  It rounds each deviation to
    0.1 m, rounds the sum to 0.1 m, then rounds the quotient to 0.1 m.
    The resulting ceiling is derivable — 0.05 (deviations) + 0.05/n
    (the sum) + 0.05 (the quotient) = 0.1 + 0.05/n — and it is reached:
    the worst gap over 8000 random data sets is exactly 0.100 m.  This
    sim draws and asserts the EXACT MAD and prints PhET's beside it.
  * The sample MAD is biased, and NOT always downward.  g(c) = E|X-c|
    is convex with g'(c) = 2F(c) - 1, so it has a KINK at every atom;
    kickers 1 and 2 have their population mean exactly on a support
    point (8 m) and their sample MAD comes out HIGH (+2.4 % and +0.6 %
    at n = 30), while kickers 3 and 4, whose means are 5.044 and
    10.956 m, come out low at every n (-1.3 % at n = 30).  The first
    draft of derive.py asserted "biased down at every n" and was
    falsified by its own Monte Carlo; the measured table is in
    refvals.txt.
  * The mean really is the balance point, as an identity and not an
    approximation: Sum(x_i - xbar) is machine zero (worst 7.1e-15 over
    the 27 pinned data sets, and exactly 0 in integer arithmetic).
    Moving one ball moves the mean by exactly 1/n metres per metre at
    every one of the fifteen positions, and moves the median at just
    ONE of the fourteen steps on the pinned n = 9 set — that is what
    robustness looks like as a number.
  * PhET's kickers are closed distributions, not mysteries.  Its
    sampleProbabilities returns the first index whose cumulative weight
    reaches S*u, so P(x = i+1) = w_i/S exactly; the population mean,
    median, standard deviation, MAD and skewness of all four are
    therefore sums over fifteen numbers.  Kickers 1 and 2 are both
    centred on 8.0000 m with sd 1.4610 and 2.6428 m; kickers 3 and 4
    are exact mirror images (means 5.0437 and 10.9563 m, skewness
    +1.3587 and -1.3587).

  WHAT IS EXACT
  -------------
  * Every statistic.  Mean, median (PhET's even-count convention),
    range, Q1/Q3 (PhET's exclusive median-of-halves rule, undefined
    below five kicks), IQR, MAD and the standard deviation are checked
    against numpy on 27 data sets that include n = 1, all-values-equal,
    two values, 15 identical values, heavy ties and the empty set, plus
    14 random ones — and the quartiles are computed twice, once by
    PhET's slicing and once from explicit indices, with the two routes
    asserted equal.
  * PhET's rounding.  roundSymmetric is half AWAY FROM ZERO and
    roundToInterval is toFixedNumber(roundSymmetric(v/i)*i, dp(i)).
    The "half" cases are decided by the binary value, so 0.35 -> 0.3
    and 0.15 -> 0.1 (both are below the tie) while 0.25 -> 0.3 and
    0.45 -> 0.5.  All eleven cases are pinned in both languages.
  * The random stream.  mulberry32 seeded per view, driven through
    PhET's own sampleProbabilities, bit-identical to derive.py: the
    page and the Python twin draw the SAME kicks, and every opening
    data set's mean, median, quartiles, IQR, range and both MADs are
    pinned against them.
  * The sampler.  A chi-square of 10^6 draws against each weight array
    gives p = 0.94, 0.47, 0.30 and 0.46; no zero-weight distance is
    ever drawn; and at 5000 draws every bin sits within 4 binomial
    standard deviations of n*w_i/S.
  * The sampling law.  sd(xbar) = sigma/sqrt(n) exactly, checked
    against 20000 Monte-Carlo samples at n = 5, 10, 15 and 30 for all
    four kickers (worst disagreement 1.5 %); the sampling spreads of
    the sample median, MAD, IQR and range are measured rather than
    assumed, because on a fifteen-point lattice their asymptotics are
    not worth trusting.
  * The box plot: fences at Q1 - 1.5*IQR and Q3 + 1.5*IQR, whiskers to
    the furthest kick inside them, everything beyond marked.  The
    interval tool counts x in [lo, hi] with both ends closed, as
    PhET's does.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * Distances are integers in [1, 15] m (PHYSICAL_RANGE), and a dragged
    ball takes roundSymmetric(constrain(x)).  The interval handles and
    the pointer are continuous on [0, 16] (VARIABILITY_DRAG_RANGE).
  * MAX_KICKS_VALUES = 5, 10, 15, 20, 25, 30, with the Median screen
    capped at 15.  Quartiles need five kicks ("Need at least five
    kicks").  The predict-median thumb snaps to 0.5 m; the predict-mean
    thumb is continuous.
  * The four kickers' weight arrays, verbatim: kicker 1
    [0,0,0,1,3,12,20,32,20,12,3,1,0,0,0], kicker 2
    [3,5,10,10,25,32,45,65,45,32,25,10,10,5,3], kicker 3
    [10,25,45,30,18,12,10,5,4,4,4,4,4,4,4] and kicker 4, which is
    kicker 3's array reversed (PhET builds it that way, and so does
    this file, so the mirror symmetry is code and not a coincidence).

  WHAT IS NOT MODELLED
  --------------------
  * The flight.  PhET draws the kick distance from the weights FIRST
    and then animates a ball to it, so the arc is a drawing device with
    no physics in it and nothing about it reaches any statistic.  The
    canvas says so.
  * PhET's sound, its keyboard-help dialogs, its PhET-iO
    instrumentation, its card-dragging game on the Median screen (the
    cards can be sorted here, not dragged one at a time) and its
    screen-reader descriptions.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's conventions and constants are read from
  docs/phets/center-and-variability_en.html (version 1.2.6, the
  official minified build): PHYSICAL_RANGE, VARIABILITY_DRAG_RANGE,
  MAX_KICKS_VALUES, getMedianObjectsFromSortedArray,
  CAVSoccerSceneModel.updateDataMeasures (the median),
  VariabilitySceneModel.updateDataMeasures (the quartiles and the MAD),
  Utils.roundSymmetric / roundToInterval, KickDistributionStrategy and
  Random.sampleProbabilities, and the four kickers' weight arrays.
  Each is cited in the comment above the code that implements it.
  Everything else is derived and pinned in selfTest to
  build/center-and-variability/derive.py, whose printed output is
  refvals.txt and whose machine-readable half is p7a_refs.js.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;

  const q=cavQuartiles(xs);
  if(q.q1===null) return null;
  const lo=q.q1-CAV.FENCE*q.iqr, hi=q.q3+CAV.FENCE*q.iqr;
  const inl=xs.filter(v=>v>=lo&&v<=hi);
  const outs=cavSorted(xs.filter(v=>v<lo||v>hi));
  return {q1:q.q1,q3:q.q3,iqr:q.iqr,lowFence:lo,highFence:hi,
          whiskLo:cavMin(inl),whiskHi:cavMax(inl),outliers:outs,
          min:cavMin(xs),max:cavMax(xs),median:cavMedian(xs)};
}
/* the interval tool: PhET counts x >= lo && x <= hi, both ends closed, and
   the handles may be dragged past each other */
function cavInterval(xs,lo,hi){
  const a=Math.min(lo,hi), b=Math.max(lo,hi);
  let k=0; for(const v of xs) if(v>=a&&v<=b) k++;
  return {count:k,frac:xs.length?k/xs.length:0,lo:a,hi:b,width:b-a};
}

/* --- the other quartile conventions, for the conventions view ------------
   Hyndman & Fan types 4..9 written from their own h(n,p), not taken from a
   library, so that the equivalence claim is checked against an independent
   statement of the rule rather than against the thing it is claiming about. */
function cavQuantHF(xs,p,type){
  const a=cavSorted(xs), n=a.length;
  if(!n) return null;
  let h;
  if(type===4) h=n*p;
  else if(type===5) h=n*p+0.5;
  else if(type===6) h=(n+1)*p;
  else if(type===7) h=(n-1)*p+1;
  else if(type===8) h=(n+1/3)*p+1/3;
  else h=(n+0.25)*p+0.375;
  h=clamp(h,1,n);
  const lo=Math.floor(h), fr=h-lo, hi=Math.min(lo+1,n);
  return a[lo-1]+fr*(a[hi-1]-a[lo-1]);
}
/* Tukey's hinges: the INCLUSIVE median-of-halves rule — the overall median
   stays in both halves when n is odd. */
function cavTukey(xs){
  const a=cavSorted(xs), n=a.length;
  if(n<2) return {q1:null,q3:null};
  const t=Math.ceil(n/2);
  const med=b=>{ const k=b.length; return k%2?b[(k-1)/2]:0.5*(b[k/2-1]+b[k/2]); };
  return {q1:med(a.slice(0,t)),q3:med(a.slice(n-t))};
}
/* the conventions the view lays side by side.  'phet' is the sim's own rule;
   the rest are named by the library name a reader would meet them under. */
const CONVENTIONS=[
  {id:'phet',  name:'PhET (exclusive halves)', note:'the rule this sim uses'},
  {id:'tukey', name:'Tukey&rsquo;s hinges',    note:'inclusive halves'},
  {id:'weibull',name:'Weibull (H&amp;F 6)',    note:'Minitab, Excel QUARTILE.EXC'},
  {id:'hazen', name:'Hazen (H&amp;F 5)',       note:'h = np + &frac12;'},
  {id:'linear',name:'linear (H&amp;F 7)',      note:'numpy default, Excel QUARTILE.INC'},
  {id:'midpoint',name:'midpoint',              note:'halfway between the bracketing order statistics'}
];
function cavConvention(xs,id){
  if(id==='phet'){ const q=cavQuartiles(xs); return {q1:q.q1,q3:q.q3}; }
  if(id==='tukey') return cavTukey(xs);
  if(id==='midpoint'){
    const a=cavSorted(xs), n=a.length;
    if(!n) return {q1:null,q3:null};
    const mid=p=>{ const h=clamp((n-1)*p+1,1,n), lo=Math.floor(h), hi=Math.min(lo+1,n);
                   return h===lo?a[lo-1]:0.5*(a[lo-1]+a[hi-1]); };
    return {q1:mid(0.25),q3:mid(0.75)};
  }
  const t=id==='weibull'?6:(id==='hazen'?5:7);
  return {q1:cavQuantHF(xs,0.25,t),q3:cavQuantHF(xs,0.75,t)};
}

/* --- the loss functions the balance view is about ------------------------
   sum (x-c)^2 is minimised at the MEAN and sum |x-c| at the MEDIAN; the
   first is the statement "the mean is the balance point" written as an
   extremum, and the parallel-axis identity
     sum (x-c)^2 = sum (x-xbar)^2 + n (xbar-c)^2
   makes it exact rather than numerical. */
function cavSqLoss(xs,c){ let s=0; for(const v of xs){ const d=v-c; s+=d*d; } return s; }
function cavAbsLoss(xs,c){ let s=0; for(const v of xs) s+=Math.abs(v-c); return s; }
/* the signed deviations from a point; they sum to zero exactly at the mean */
function cavDeviations(xs,c){ return xs.map(v=>v-c); }
function cavTorque(xs,c){ let s=0; for(const v of xs) s+=(v-c); return s; }
/* the two moments about a point: the total pull of the values below it and
   of those above.  At the MEAN they are equal, exactly — that is the whole
   content of "balance point", and it is a model quantity so that the
   drawing cannot compute a different one (drum_head Known-bad). */
function cavMoments(xs,c){
  let neg=0,pos=0;
  for(const v of xs){ if(v<c) neg+=c-v; else pos+=v-c; }
  return {neg,pos,gap:pos-neg};
}

/* --- the random stream ---------------------------------------------------
   mulberry32 (this collection's generator; PhET uses seedrandom) driven
   through PhET's OWN sampler.  Bit-identical to derive.py's twin: the page
   and the Python file generate the same kicks from the same seed. */
function cavRng(seed){
  let a=seed>>>0;
  return {
    next(){
      a=(a+0x6D2B79F5)>>>0;
      let t=Math.imul(a^(a>>>15),a|1);
      t=((t+Math.imul(t^(t>>>7),t|61))>>>0)^t;
      return ((t^(t>>>14))>>>0)/4294967296;
    }
  };
}
/* PhET Random.sampleProbabilities, plus valuesRange.min.  The returned index
   is the first i whose cumulative weight reaches S*u, so
   P(value = i + 1) = w[i]/S exactly — which is why every kicker's population
   mean, median, MAD and standard deviation below are closed numbers. */
function cavSampleProb(rng,w){
  let S=0; for(const v of w) S+=v;
  const t=S*rng.next();
  let s=0;
  for(let i=0;i<w.length;i++){ s+=w[i]; if(s>=t) return i+CAV.VMIN; }
  return w.length-1+CAV.VMIN;
}
function cavDrawSet(seed,w,n){
  const r=cavRng(seed), out=[];
  for(let i=0;i<n;i++) out.push(cavSampleProb(r,w));
  return out;
}

/* --- the exact population statistics of a kicker ------------------------- */
const POP_CACHE={};
function cavPop(key){
  if(POP_CACHE[key]) return POP_CACHE[key];
  const w=CAV.W[key];
  let S=0; for(const v of w) S+=v;
  const p=w.map(v=>v/S), xs=w.map((v,i)=>i+CAV.VMIN);
  let mean=0; for(let i=0;i<w.length;i++) mean+=p[i]*xs[i];
  let vr=0,mad=0,sk=0;
  for(let i=0;i<w.length;i++){
    const d=xs[i]-mean;
    vr+=p[i]*d*d; mad+=p[i]*Math.abs(d); sk+=p[i]*d*d*d;
  }
  /* the discrete quantile: the first value whose cumulative probability
     reaches the target.  When the CDF lands exactly on 1/2 the median is the
     midpoint of the two neighbouring support points, the usual convention. */
  const quant=target=>{
    let c=0;
    for(let i=0;i<w.length;i++){
      c+=p[i];
      if(c>=target-1e-15) return xs[i];
    }
    return xs[w.length-1];
  };
  let c=0, median=null;
  for(let i=0;i<w.length;i++){
    c+=p[i];
    if(c>=0.5-1e-15){
      median=xs[i];
      if(Math.abs(c-0.5)<1e-12){
        let nx=xs[i];
        for(let j=i+1;j<w.length;j++) if(p[j]>0){ nx=xs[j]; break; }
        median=0.5*(xs[i]+nx);
      }
      break;
    }
  }
  const out={key,w,S,p,xs,mean,var:vr,sd:Math.sqrt(vr),mad,median,
             q1:quant(0.25),q3:quant(0.75),skew:sk/Math.pow(vr,1.5)};
  POP_CACHE[key]=out;
  return out;
}
/* g(c) = E|X - c| for the population: convex, piecewise linear, with a kink
   at every atom.  The balance view draws it, and it is what makes the sample
   MAD's bias signed rather than always downward (derive.py C5). */
function cavGofC(key,c){
  const P=cavPop(key);
  let s=0; for(let i=0;i<P.xs.length;i++) s+=P.p[i]*Math.abs(P.xs[i]-c);
  return s;
}

/* --- a data set: the field, the kicks, the flight ------------------------ */
function cavField(seed,wkey,maxKicks){
  return {seed,wkey,max:maxKicks,rng:cavRng(seed),xs:[],air:[],kicked:0,
          queue:0,sinceKick:0,sorted:false};
}
function cavFieldClear(F){
  F.rng=cavRng(F.seed); F.xs=[]; F.air=[]; F.kicked=0; F.queue=0; F.sinceKick=0;
}
function cavFlightTime(d){
  const f=(d-CAV.VMIN)/(CAV.VMAX-CAV.VMIN);
  return CAV.T_FLY[0]+(CAV.T_FLY[1]-CAV.T_FLY[0])*clamp(f,0,1);
}
/* one kick: the distance comes from the kicker's weights, then a ball is
   animated to it.  Refuses once the field holds its maximum. */
function cavKick(F){
  if(F.xs.length+F.air.length>=F.max) return null;
  const d=cavSampleProb(F.rng,CAV.W[F.wkey]);
  F.air.push({d,t:0,T:cavFlightTime(d)});
  F.kicked++;
  return d;
}
function cavFieldBatch(F,n){
  let k=0;
  for(let i=0;i<n;i++){ if(F.xs.length+F.air.length>=F.max) break; F.xs.push(cavSampleProb(F.rng,CAV.W[F.wkey])); k++; }
  return k;
}
/* march the flights; a ball that lands joins the data set.  Returns true if
   anything moved, which is what the frame loop repaints on. */
function cavFieldStep(F,dt){
  let moved=false;
  if(F.queue>0){
    F.sinceKick+=dt;
    if(F.sinceKick>=CAV.STACK_T){
      F.sinceKick=0;
      if(cavKick(F)!==null){ F.queue--; moved=true; }
      else F.queue=0;
    }
  }
  if(F.air.length){
    const keep=[];
    for(const b of F.air){
      b.t+=dt;
      if(b.t>=b.T) F.xs.push(b.d); else keep.push(b);
    }
    if(keep.length!==F.air.length) moved=true;
    F.air=keep;
    moved=true;
  }
  return moved;
}
/* where a ball in flight is, in (metres, metres-above-the-line).  A parabola
   through (0,0) and (d,0) whose apex is APEX*d high — a drawing device, as
   PhET's is: the distance was drawn first. */
function cavBallPos(b){
  const u=clamp(b.t/b.T,0,1);
  return [b.d*u, 4*CAV.APEX*b.d*u*(1-u)];
}
/* the stack index of each landed ball, in landing order: this IS the dot
   plot, one dot per ball, stacked at its value. */
function cavStacks(xs){
  const seen={}, out=[];
  for(const v of xs){ const k=seen[v]||0; out.push(k); seen[v]=k+1; }
  return out;
}
function cavStackHeight(xs){
  const seen={}; let mx=0;
  for(const v of xs){ const k=(seen[v]||0)+1; seen[v]=k; if(k>mx) mx=k; }
  return mx;
}
/* a dragged ball takes roundSymmetric(constrain(x)) — integers only */
function cavSnapValue(x){ return clamp(cavRoundSym(x),CAV.VMIN,CAV.VMAX); }

/* ================================================================== *
 *  state: six views — PhET's three screens, then the three questions  *
 *  they raise and do not answer (which quartile rule, why the mean    *
 *  balances, and what the kicker's own weights say in the long run)   *
 * ================================================================== */
const TABS=[['kicks','the kicks'],['meanmed','mean and median'],['spread','the spread'],
            ['conv','which quartile'],['balance','the balance point'],['longrun','the long run']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', text:'#aeb6c6', sky:'#0a1020', grass:'#16241a', line:'#3b455c',
           /* one colour slot per measure — never a borrowed role colour */
           med:'#f0b429', mean:'#6c9cff', iqr:'#38c6b4', rng:'#d76a9b', mad:'#9b8ee0',
           ball:'#e6eaf2',
           /* PhET's four jerseys: Green 1, Blue 2, Red 3, Yellow 4 */
           kick:['#7fc97f','#5b9bd5','#d9534f','#e6c84a'],
           /* the six quartile conventions in the comparison view */
           conv:['#b8ec4c','#e8843a','#38c6b4','#cd35c4','#6c9cff','#d76a9b']};
const RO_W=300;

/* the seeds the page opens on.  derive.py draws the SAME kicks from the same
   seeds (REF.seeds / REF.open), and selfTest asserts every one of them —
   including the two that were SEARCHED for rather than picked: the
   conventions view must open on a data set where the conventions actually
   disagree, and the balance view on one where the mean is a clear metre from
   the median, or each view hides the thing it exists to show. */
const SEEDS={kicks:31771, meanmed:31772, spread:31773, conv:31933, balance:31866, longrun:31790};

const KICK_LIST=KICKERS.map(k=>({id:k.id,name:''+k.n}));
const MAXK_LIST=CAV.MAX_KICKS.map(v=>({id:v,name:''+v}));
const MAXK_MED_LIST=CAV.MAX_KICKS_MEDIAN.map(v=>({id:v,name:''+v}));
const PLOT_LIST=[{id:'dot',name:'dot plot'},{id:'line',name:'line plot'}];
const MEASURES=[{id:'range',name:'range'},{id:'iqr',name:'IQR'},{id:'mad',name:'MAD'}];
const LONG_N=[10,50,200,1000,5000];
const LONG_LIST=LONG_N.map(v=>({id:v,name:''+v}));

const DEFAULTS={view:'kicks', running:true,
  /* the kicks (PhET's Median screen) */
  mKick:'k3', mMax:15, mMedian:true, mSort:false, mPlot:'dot',
  mPredict:false, mPredVal:6,
  /* mean and median (PhET's Mean & Median screen) */
  aKick:'k4', aMax:15, aMean:true, aMedian:true, aPlot:'dot',
  aPredMean:false, aPredMeanVal:9, aPredMed:false, aPredMedVal:9,
  /* the spread (PhET's Variability screen) */
  vKick:'k3', vMax:15, vMeasure:'iqr', vShow:true, vMean:false, vOutliers:true,
  vInterval:false, vH1:4, vH2:9, vPointer:false, vPtr:7,
  /* which quartile */
  cKick:'k2', cN:12,
  /* the balance point */
  bKick:'k3', bN:11, bMove:15, bLoss:true,
  /* the long run */
  lKick:'k3', lN:1000, lBands:true};
const ST=Object.assign({},DEFAULTS);

/* ---- the worlds ---------------------------------------------------------
   PhET keeps one scene per kicker on the Variability screen and one on each
   of the other two, and the data stay put when you switch back.  Same here:
   a field is made when it is first asked for, keyed by view and kicker. */
const WORLD={fields:{},draws:{}};
function fieldSeed(view,kick){
  if(view==='spread') return SEEDS.spread+KICKERS.findIndex(k=>k.id===kick)+1;
  return SEEDS[view];
}
function fieldOf(view,kick,maxK,fill){
  const key=view+'/'+kick;
  let F=WORLD.fields[key];
  if(!F){
    F=cavField(fieldSeed(view,kick),kick,maxK);
    cavFieldBatch(F,fill===undefined?maxK:fill);
    WORLD.fields[key]=F;
  }
  if(F.max!==maxK){
    F.max=maxK;
    if(F.xs.length>maxK) F.xs=F.xs.slice(0,maxK);
  }
  return F;
}
function curField(st){
  if(st.view==='kicks') return fieldOf('kicks',st.mKick,st.mMax);
  if(st.view==='meanmed') return fieldOf('meanmed',st.aKick,st.aMax);
  if(st.view==='spread') return fieldOf('spread',st.vKick,st.vMax);
  return null;
}
function resetWorlds(){ WORLD.fields={}; WORLD.draws={}; }
/* the analysis views draw their own data sets, cached by (seed, kicker, n) */
function drawsOf(seed,kick,n){
  const key=seed+'/'+kick+'/'+n;
  if(!WORLD.draws[key]) WORLD.draws[key]=cavDrawSet(seed,CAV.W[kick],n);
  return WORLD.draws[key];
}

/* ---- the clock ---------------------------------------------------------- */
const FRAME_DT=1/60;
function worldStep(st,dt){
  const F=curField(st);
  if(!F) return false;
  return cavFieldStep(F,dt);
}
function kickNow(st,n){
  const F=curField(st);
  if(!F) return 0;
  F.queue+=n; F.sinceKick=CAV.STACK_T;
  return F.queue;
}

/* ---- the model each view and the readout read --------------------------- */
function statsOf(xs){
  const q=cavQuartiles(xs);
  return {n:xs.length, mean:cavMean(xs), median:cavMedian(xs),
          q1:q.q1, q3:q.q3, iqr:q.iqr,
          range:cavRange(xs), min:cavMin(xs), max:cavMax(xs),
          madExact:cavMadExact(xs), madPhet:cavMadPhet(xs),
          sd:cavSd(xs,0), sd1:cavSd(xs,1)};
}
function kickerOf(id){ return KICKERS.find(k=>k.id===id); }
function kickerIdx(id){ return KICKERS.findIndex(k=>k.id===id); }

function buildModel(){
  const st=ST, view=st.view;
  const M={view,st};
  if(view==='kicks'){
    M.kick=st.mKick; M.F=curField(st); M.xs=M.F.xs.slice();
    M.plot=st.mPlot; M.maxK=st.mMax;
  } else if(view==='meanmed'){
    M.kick=st.aKick; M.F=curField(st); M.xs=M.F.xs.slice();
    M.plot=st.aPlot; M.maxK=st.aMax;
  } else if(view==='spread'){
    M.kick=st.vKick; M.F=curField(st); M.xs=M.F.xs.slice();
    M.plot='dot'; M.maxK=st.vMax;
    M.box=cavBox(M.xs);
    M.iv=cavInterval(M.xs,st.vH1,st.vH2);
  } else if(view==='conv'){
    M.kick=st.cKick; M.xs=drawsOf(SEEDS.conv,st.cKick,st.cN).slice(); M.plot='dot';
    M.conv=CONVENTIONS.map(c=>{
      const q=cavConvention(M.xs,c.id);
      return {id:c.id,name:c.name,note:c.note,q1:q.q1,q3:q.q3,
              iqr:(q.q1===null||q.q3===null)?null:q.q3-q.q1};
    });
    /* the disagreement is what the view is about, so it is a model quantity
       and not something the drawing works out for itself */
    const ph=M.conv[0];
    M.spreadQ1=Math.max.apply(null,M.conv.map(c=>c.q1))-Math.min.apply(null,M.conv.map(c=>c.q1));
    M.spreadQ3=Math.max.apply(null,M.conv.map(c=>c.q3))-Math.min.apply(null,M.conv.map(c=>c.q3));
    M.agrees=M.conv.filter(c=>c.id!=='phet'&&Math.abs(c.q1-ph.q1)<1e-12&&Math.abs(c.q3-ph.q3)<1e-12)
                   .map(c=>c.id);
    M.parity=(M.xs.length%2)?'odd':'even';
    M.twin=(M.xs.length%2)?'weibull':'hazen';
  } else if(view==='balance'){
    M.kick=st.bKick;
    const base=drawsOf(SEEDS.balance,st.bKick,st.bN).slice();
    base[base.length-1]=clamp(Math.round(st.bMove),CAV.VMIN,CAV.VMAX);
    M.xs=base; M.plot='dot'; M.moved=base.length-1;
    M.torque=cavTorque(M.xs,cavMean(M.xs));
    M.lossMean=cavSqLoss(M.xs,cavMean(M.xs));
    M.lossMedian=cavAbsLoss(M.xs,cavMedian(M.xs));
  } else {
    M.kick=st.lKick;
    M.xs=drawsOf(SEEDS.longrun,st.lKick,st.lN);
    M.plot='dot';
    M.counts=(()=>{ const c=new Array(CAV.VMAX-CAV.VMIN+1).fill(0);
                    for(const v of M.xs) c[v-CAV.VMIN]++; return c; })();
    M.trace=(()=>{
      const out=[]; let s=0;
      const step=Math.max(1,Math.floor(M.xs.length/240));
      for(let i=0;i<M.xs.length;i++){ s+=M.xs[i];
        if((i+1)%step===0||i===M.xs.length-1) out.push([i+1,s/(i+1)]); }
      return out;
    })();
  }
  M.pop=cavPop(M.kick);
  M.stat=statsOf(M.xs);
  M.kicker=kickerOf(M.kick);
  M.kcol=COL.kick[kickerIdx(M.kick)];
  /* the sampling law: what a sample of this size is entitled to.  Exact for
     the mean (sigma/sqrt(n)); measured by Monte Carlo in derive.py for the
     median, the MAD and the IQR, because on a 15-point lattice their
     asymptotics are not worth trusting. */
  M.seMean=M.stat.n?M.pop.sd/Math.sqrt(M.stat.n):null;
  M.zMean=(M.stat.n&&M.seMean)?(M.stat.mean-M.pop.mean)/M.seMean:null;
  return M;
}
/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function mfmt(x,n){ return (x===null||x===undefined||!isFinite(x))?'&mdash;':fmt(x,n===undefined?2:n)+' m'; }
function nfmt(x,n){ return (x===null||x===undefined||!isFinite(x))?'&mdash;':fmt(x,n===undefined?2:n); }
function kickerTitle(M){
  return M.kicker.name+' (' +M.kicker.jersey+' jersey), '+M.stat.n+' kick'+(M.stat.n===1?'':'s');
}
function centreRows(M){
  const S=M.stat;
  return hd('centre')
    +rrow('mean x&#772;',mfmt(S.mean,3),'good')
    +rrow('median',mfmt(S.median,2),'good');
}
function spreadRows(M){
  const S=M.stat;
  return hd('spread')
    +rrow('range = max &minus; min',S.range===null?'&mdash;':mfmt(S.range,0),'good')
    +rrow('Q1, Q3',S.q1===null?'&mdash; (needs five kicks)':fmt(S.q1,1)+', '+fmt(S.q3,1))
    +rrow('IQR = Q3 &minus; Q1',S.iqr===null?'&mdash;':mfmt(S.iqr,1),'good')
    +rrow('MAD, exactly',mfmt(S.madExact,4),'good')
    +rrow('MAD, PhET&rsquo;s rounding',mfmt(S.madPhet,1))
    +rrow('standard deviation &sigma;',mfmt(S.sd,3));
}
function popRows(M){
  const P=M.pop;
  return hd('the kicker, exactly (from its weights)')
    +rrow('population mean &mu;',mfmt(P.mean,4))
    +rrow('population median',mfmt(P.median,1))
    +rrow('population &sigma;',mfmt(P.sd,4))

    +rrow('skewness',nfmt(P.skew,3));
}
function readoutHTML(M){

      +rrow('whiskers',fmt(M.box.whiskLo,0)+' to '+fmt(M.box.whiskHi,0)+' m')

      +rrow('outliers',M.box.outliers.length?M.box.outliers.join(', ')+' m':'none');

    s+=rrow('kicks in the data set',S.n+' ('+M.parity+')')
      +hd('Q1 and Q3 under six conventions');

      s+=rrow(plainish(c.name),fmt(c.q1,3)+', '+fmt(c.q3,3),c.id==='phet'?'good':'');
    });
    s+=hd('what that costs')
      +rrow('Q1 spread across conventions',mfmt(M.spreadQ1,3),M.spreadQ1>0?'bad':'good')
      +rrow('Q3 spread across conventions',mfmt(M.spreadQ3,3),M.spreadQ3>0?'bad':'good')
      +rrow('PhET&rsquo;s rule is identical to',M.agrees.length?M.agrees.join(', '):'none of the others');
    s+='</table><div class="note">PhET&rsquo;s exclusive median-of-halves rule is exactly Hyndman &amp; Fan type 6 (Weibull) when n is odd and type 5 (Hazen) when n is even &mdash; proved in derive.py and checked on four thousand data sets. At even n it also coincides with Tukey&rsquo;s hinges, because an even split has no middle value to argue about.</div>';
    return s;
  }

    s+=rrow('kicks in the data set',S.n)
      +centreRows(M)
      +rrow('the moved ball',mfmt(st.bMove,0),'')
      +hd('the balance')
      +rrow('&Sigma;(x<sub>i</sub> &minus; x&#772;)',nfmt(M.torque,12),'good')
      +rrow('&Sigma;(x<sub>i</sub> &minus; x&#772;)&sup2;',nfmt(M.lossMean,4))
      +rrow('&Sigma;|x<sub>i</sub> &minus; median|',nfmt(M.lossMedian,4))
      +rrow('&Sigma;(x<sub>i</sub> &minus; median)&sup2;',nfmt(cavSqLoss(M.xs,S.median),4),'bad')
      +rrow('&Sigma;|x<sub>i</sub> &minus; x&#772;|',nfmt(cavAbsLoss(M.xs,S.mean),4),'bad');
    s+='</table><div class="note">Each estimator wins on its own loss and loses on the other&rsquo;s: the mean minimises the squared distance, the median the absolute distance. Drag the last ball across the field &mdash; the mean tracks it at exactly 1/n metres per metre, and the median stops moving as soon as the ball leaves the middle.</div>';
    return s;
  }
  s+=rrow('kicks drawn',S.n)
    +centreRows(M)
    +rrow('MAD, exactly',mfmt(S.madExact,4),'good')
    +rrow('standard deviation, the n convention',mfmt(S.sd,4),'good')
    +rrow('&hellip;and the n&minus;1 one',mfmt(S.sd1,4))

    +rrow('(x&#772; &minus; &mu;)/(&sigma;/&radic;n)',nfmt(M.zMean,3),Math.abs(M.zMean)<3?'good':'bad')
    +rrow('worst bin, in binomial sd',nfmt(longWorstZ(M),2),longWorstZ(M)<4?'good':'bad');
  s+='</table><div class="note">The kicker&rsquo;s weights are known, so &mu;, &sigma;, the population median and the population MAD are not estimated here &mdash; they are computed from the weights and the sample is judged against them, with a tolerance that comes from the sampling law rather than from taste.</div>';
  return s;
}
function longWorstZ(M){
  if(M.view!=='longrun'||!M.counts) return 0;
  const P=M.pop, N=M.xs.length;
  let worst=0;
  for(let i=0;i<M.counts.length;i++){
    if(!(P.p[i]>0)) continue;
    const e=N*P.p[i], sd=Math.sqrt(e*(1-P.p[i]));
    const z=Math.abs(M.counts[i]-e)/Math.max(sd,1e-12);
    if(z>worst) worst=z;
  }
  return worst;
}
function plainish(s){ return plain(s); }
