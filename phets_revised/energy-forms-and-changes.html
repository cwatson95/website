/* ---------------- dispatch and the scene ---------------- */
function drawView(ctx,W,H,M){
  ctx.clearRect(0,0,W,H);
  if(M.view==='bench') return drawBench(ctx,W,H,M);
  if(M.view==='sys') return drawSystems(ctx,W,H,M);
  if(M.view==='ledger') return drawLedger(ctx,W,H,M);
  if(M.view==='flow') return drawFlow(ctx,W,H,M);
  return drawEq(ctx,W,H,M);
}
function viewModel(){ const M=buildModel(); M.dragLever=DRAG.what==='lever'?DRAG.k:null; M.dragThermo=DRAG.what==='therm'?DRAG.k:null; return M; }
function makeScene(canvas){
  const S={st:ST,W:1400,H:820,geo:null};
  S.model=()=>viewModel();
  S.draw=()=>{ const ctx=canvas.getContext('2d'); S.geo=drawView(ctx,S.W,S.H,S.model()); return S.geo; };
  S.step=dtw=>{
    if(!ST.running) return false;
    if(ST.view==='bench'||ST.view==='ledger') return benchAdvance(BENCH,ST,dtw)>0;
    if(ST.view==='sys'||ST.view==='flow') return sysAdvance(SYS,ST,dtw)>0;
    return false;
  };
  /* the bench's pointer: a burner's lever, a thermometer, a body (and whatever
     sits on it); every other view ignores the pointer */
  S.pointer=(kind,px,py)=>{
    if(ST.view!=='bench') return false;
    if(!S.geo||!S.geo.map) S.draw();
    const map=S.geo.map, wx=map.wx(px), wy=map.wy(py), B=BENCH;
    if(kind==='down'){
      for(let k=0;k<2;k++){ const l=burnerLevels(ST)[k], kn=leverPos(k,l);
        if(Math.abs(px-map.X(kn.x))<=12&&Math.abs(py-map.Y(kn.y))<=9){ DRAG.what='lever'; DRAG.k=k; return true; } }
      const tk=thermoPick(B,wx,wy);
      if(tk>=0){ const p=thermoTip(B,B.therm[tk]); DRAG.what='therm'; DRAG.k=tk; DRAG.off=[p.x-wx,p.y-wy];
        const th=B.therm[tk]; th.att=null; th.x=p.x; th.y=p.y; th.tray=false; return true; }
      const i=benchPick(B,wx,wy);
      if(i>=0&&benchGrab(B,i,wx,wy)){ DRAG.what='body'; DRAG.k=i; return true; }
      return false;
    }
    if(kind==='move'){
      if(DRAG.what==='lever'){ const l=leverLevel(wy);
        if(ST.link){ ST.lev0=l; ST.lev1=l; } else if(DRAG.k===0) ST.lev0=l; else ST.lev1=l; return true; }
      if(DRAG.what==='therm'){ const th=B.therm[DRAG.k]; th.x=clamp(wx+DRAG.off[0],BENCH_EXT.xmin,BENCH_EXT.xmax); th.y=clamp(wy+DRAG.off[1],BENCH_EXT.ymin,BENCH_EXT.ymax-THERMO_H); return true; }
      if(DRAG.what==='body'){ benchMoveHeld(B,wx,wy); return true; }
      return false;
    }
    if(kind==='up'){
      const was=DRAG.what;
      if(was==='therm') thermoDrop(B,DRAG.k);
      if(was==='body') benchDrop(B);
      DRAG.what=null; DRAG.k=null;
      return was!==null;
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function resetAllState(){
  const v=ST.view; Object.assign(ST,DEFAULTS); ST.view=v;
  benchReset(BENCH); sysReset(SYS,ST); DRAG.what=null; DRAG.k=null;
  for(const k in MEMO) delete MEMO[k];
}
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2)); });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        const was=st[key]; if(onPick) onPick(o,was); else st[key]=o.id;
        syncChips(); syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function btn(label,fn){ return h('button',{onclick:()=>{ fn(); syncChips(); syncPanel(); dirty=true; refresh(); }},label); }

  /* ---- the bench: presets, the burners (heat/cool, linkable), energy symbols ---- */
  const gBench=h('div',{class:'grp'},h('h3',null,'the bench'));
  const presetChips=chipRow(BENCH_PRESETS,'preset',o=>{ st.preset=o.id; benchPreset(BENCH,st,o.id); });
  gBench.appendChild(presetChips);
  const levFmt=v=>v>0?'heat '+fmt(v,2):(v<0?'cool '+fmt(-v,2):'off');
  gBench.appendChild(slider('lev0','left burner',-1,1,0.01,levFmt,()=>{ if(st.link) st.lev1=st.lev0; }));
  gBench.appendChild(slider('lev1','right burner',-1,1,0.01,levFmt,()=>{ if(st.link) st.lev0=st.lev1; }));
  gBench.appendChild(h('div',{class:'checks'},checkbox('link','link heaters',()=>{ if(st.link) st.lev1=st.lev0; }),checkbox('symBench','energy symbols')));
  const benchTag=h('div',{class:'tag'}); gBench.appendChild(benchTag);

  /* ---- the chain: a source, a converter, a user ---- */
  const gChain=h('div',{class:'grp'},h('h3',null,'the chain'));
  const srcChips=chipRow(SOURCES,'src',o=>sysSelect(SYS,st,'src',o.id)); gChain.appendChild(srcChips);
  gChain.appendChild(slider('pedal','pedalling',0,1,0.01,v=>fmt(v*OMEGA_MAX,2)+' rad/s'));
  gChain.appendChild(slider('flow','water flow',0,1,0.01,v=>fmt(v*MAXP/1000,1)+' kW'));
  gChain.appendChild(slider('clouds','clouds',0,1,0.01,v=>v===0?'none':(v===1?'lots':fmt(v,2))));
  gChain.appendChild(slider('heat','teapot burner',0,1,0.01,v=>fmt(v*MAXP/1000,1)+' kW'));
  const feedRow=h('div',{class:'btnrow'},btn('feed me',()=>{ sysFeed(SYS); }));
  gChain.appendChild(feedRow);
  const convChips=chipRow(CONVERTERS,'conv',o=>sysSelect(SYS,st,'conv',o.id)); gChain.appendChild(convChips);
  const userChips=chipRow(USERS,'user',o=>sysSelect(SYS,st,'user',o.id)); gChain.appendChild(userChips);
  gChain.appendChild(h('div',{class:'checks'},checkbox('symSys','energy symbols (systems)')));
  const chainTag=h('div',{class:'tag'}); gChain.appendChild(chainTag);

  /* ---- equilibrium: the pair, the materials, the two temperatures, the room ---- */
  const gPair=h('div',{class:'grp'},h('h3',null,'the pair'));
  gPair.appendChild(chipRow(EQ_PAIRS,'eqPair'));
  gPair.appendChild(chipRow(EQ_MATS,'eqMat'));
  const kFmt=v=>fmt(v,2)+' K';
  gPair.appendChild(slider('eqT1','hot block',T_FREEZE,T_BLOCK_MAX,0.05,kFmt));
  gPair.appendChild(slider('eqT2','its partner',T_FREEZE,T_BOIL.water,0.05,kFmt));
  gPair.appendChild(h('div',{class:'checks'},checkbox('eqAir','the room takes heat')));
  const pairTag=h('div',{class:'tag'}); gPair.appendChild(pairTag);

  /* ---- time ---- */
  const stepView=()=>{ if(st.view==='bench'||st.view==='ledger'){ BENCH.acc=0; benchStep(BENCH,burnerLevels(st)); } else if(st.view==='sys'||st.view==='flow'){ SYS.acc_t=0; sysStep(SYS,st); } };
  const gTime=h('div',{class:'grp'},h('h3',null,'time'));
  gTime.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  const speedChips=chipRow(SPEED_LIST,'speed'); gTime.appendChild(speedChips);
  gTime.appendChild(h('div',{class:'btnrow'},btn('step',stepView),btn('reset all',()=>{ resetAllState(); })));
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Energy Forms and Changes (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). '
      +'New code; no PhET code or assets. PhET&rsquo;s values (specific heats, densities, sizes, the heat-transfer constants 1000 and 30 W/(m&middot;K), the burners&rsquo; 5000 and 1500 W, '
      +'the 10-kW rates, ENERGY_PER_CHUNK) are read from its build 1.4.24 and its doc/model.md. Real materials: NIST Chemistry WebBook (water, IAPWS-95, 296 K), NIST-JANAF (iron), '
      +'Arblaster 2018 (iron&rsquo;s density), Engineering ToolBox and Wikipedia&rsquo;s tables (brick, olive oil), the USDA grading manual (olive oil&rsquo;s density). '
      +'Everything else is exact and pinned in selfTest to build/energy-forms-and-changes/derive.py.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gBench,gChain,gPair,gTime,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [w,list,key] of CHIPROWS) [].forEach.call(w.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
  }
  /* a row the view ignores is hidden, never left live and inert (Known-bad) */
  function syncPanel(){
    const v=st.view, bench=(v==='bench'||v==='ledger'), chain=(v==='sys'||v==='flow');
    gBench.hidden=!bench; gChain.hidden=!chain; gPair.hidden=(v!=='eq'); gTime.hidden=(v==='eq');
    speedChips.hidden=!bench;
    rows.pedal.row.hidden=st.src!=='biker'; rows.flow.row.hidden=st.src!=='faucet';
    rows.clouds.row.hidden=st.src!=='sun'; rows.heat.row.hidden=st.src!=='teapot';
    feedRow.hidden=!(st.src==='biker'&&SYS.food<=0);
    for(const k in rows) rows[k].sync();
    const lev=burnerLevels(st);
    benchTag.innerHTML='drag the bodies and thermometers on the bench; the levers on the burners drag too'+(st.link?' &nbsp; (linked: one lever drives both)':'')
      +'<br>left '+levFmt(lev[0])+', right '+levFmt(lev[1]);
    chainTag.innerHTML=srcName(st.src)+' &rarr; '+convName(st.conv)+' &rarr; '+userName(st.user)
      +(convTakes(st.conv,st.src)?'':' &nbsp; <span class="r">the '+convName(st.conv)+' cannot use '+srcForm(st.src)+' energy</span>');
    pairTag.innerHTML='the block starts hot, its partner at the second temperature; T<sub>eq</sub> assumes the room shut out';
    timeTag.innerHTML='space runs/pauses &nbsp; <b>.</b> steps 1/60 s &nbsp; <b>r</b> resets all &nbsp; 1&ndash;5 switch views';
  }
  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='bench'?'drag bodies, levers, thermometers · space pauses':(st.view==='eq'?'1–5 switch views':'space pauses · 1–5 switch views');
      infoEl.innerHTML=INFO[st.view]||''; physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; if(DRAG.what==='lever'){ for(const k of ['lev0','lev1']) rows[k].sync(); } }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; syncPanel(); refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='.'){ stepView(); dirty=true; refresh(); }
    else if(e.key==='r'){ resetAllState(); syncChips(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0, last=0, fed=SYS.food<=0;
  function frameLoop(tm){
    frameN++;
    const dtw=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    const advanced=S.step(dtw);
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%8===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    if((SYS.food<=0)!==fed){ fed=SYS.food<=0; syncPanel(); }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const R=k=>{ if(!(k in REF)) throw new Error('no reference value "'+k+'" in refvals.txt'); return REF[k]; };
  const T0=Date.now(), EPS=Math.pow(2,-52);
  const stSave=Object.assign({},ST);
  const NAMES=['iron','brick','water','oil'];
  function freshBench(){ const B={}; benchReset(B); return B; }
  function runBench(B,lev,n,chk){
    let worst=0, sum=0;
    for(let k=0;k<n;k++){

    if(over._preset) benchPreset(BENCH,ST,over._preset);
    if(over._bench) for(let k=0;k<over._bench;k++) benchStep(BENCH,burnerLevels(ST));
    if(over._therm){ const th=BENCH.therm[0]; th.tray=false; th.x=SPOTS[0]; th.y=0.02; thermoDrop(BENCH,0); const t2=BENCH.therm[1]; t2.tray=false; t2.x=0.0; t2.y=0.2; thermoDrop(BENCH,1); }
    if(over._sys){ sysReset(SYS,ST); for(let k=0;k<over._sys;k++) sysStep(SYS,ST); }
    try{ return fn(); } finally{ resetAllState(); }
  }
  const CONFIGS=[
    ['bench start',{view:'bench'}],['bench heat',{view:'bench',_preset:'heat',_bench:900,_therm:1}],['bench hot',{view:'bench',_preset:'hot',_bench:40}],
    ['bench stack cool',{view:'bench',_preset:'stack',_bench:1200}],['bench boil',{view:'bench',_preset:'boil',_bench:1500,_therm:1}],['bench no symbols',{view:'bench',symBench:false,_preset:'heat',_bench:300}],
    ['sys faucet',{view:'sys',_sys:600}],['sys biker',{view:'sys',src:'biker',pedal:1,_sys:400}],['sys biker empty',{view:'sys',src:'biker',pedal:1,_sys:1200}],
    ['sys sun panel',{view:'sys',src:'sun',conv:'panel',user:'incandescent',clouds:0.55,_sys:500}],['sys sun on generator',{view:'sys',src:'sun',user:'fan',_sys:300}],
    ['sys teapot fan',{view:'sys',src:'teapot',heat:1,user:'fan',_sys:1200}],['sys teapot panel',{view:'sys',src:'teapot',heat:0.6,conv:'panel',user:'fluorescent',_sys:600}],
    ['sys faucet fluor',{view:'sys',user:'fluorescent',_sys:900}],['sys no symbols',{view:'sys',symSys:false,_sys:200}],
    ['ledger idle',{view:'ledger'}],['ledger heat',{view:'ledger',_preset:'heat',_bench:1500}],['ledger hot',{view:'ledger',_preset:'hot',_bench:900}],['ledger stack',{view:'ledger',_preset:'stack',_bench:1800}],
    ['flow faucet',{view:'flow',_sys:900}],['flow idle',{view:'flow',flow:0,_sys:10}],['flow biker',{view:'flow',src:'biker',pedal:0.8,_sys:500}],['flow sun',{view:'flow',src:'sun',conv:'panel',user:'incandescent',clouds:0.3,_sys:400}],
    ['flow teapot',{view:'flow',src:'teapot',heat:1,user:'fan',_sys:900}],['flow miss',{view:'flow',src:'sun',_sys:200}],
    ['eq default',{view:'eq'}],['eq insulated real',{view:'eq',eqAir:false,eqMat:'real'}],['eq hot boil',{view:'eq',eqT1:620,eqT2:296}],['eq brick on iron',{view:'eq',eqPair:'brick-iron'}],
    ['eq water on iron',{view:'eq',eqPair:'water-iron',eqT1:500}],['eq oil cold',{view:'eq',eqPair:'iron-oil',eqT1:273.15,eqT2:373.15}],
  ];
  for(const [nm,over] of CONFIGS) withState(over,()=>{
    const M=buildModel(); let html='';
    try{ html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M); }catch(e){ ok(false,nm+': the panels build ('+e+')'); return; }
    ok(!badTxt.test(html),nm+': readout, equation bar and tag are clean'+(badTxt.test(html)?' ('+html.match(badTxt)[0]+')':''));
    ok(html.length>200,nm+': the readout has substance');
  });
  withState({view:'bench',_preset:'heat',_bench:600},()=>{ const h=readoutHTML(buildModel()); ok(h.indexOf('5.00 kW into the iron')>=0,'the bench readout prints the burner’s 5.00 kW into the iron'); });
  withState({view:'sys',_sys:600},()=>{ const h=readoutHTML(buildModel()); ok(h.indexOf('7.00 kW')>=0,'the systems readout prints the faucet’s 7.00 kW'); });
  withState({view:'eq'},()=>{ const h=readoutHTML(buildModel()); ok(h.indexOf(fmt(R('eq iron-water PhET T_eq from 380 K and 296 K'),2)+' K')>=0,'the equilibrium readout prints T_eq = 320.08 K (python)'); });

  /* ---------- J. no slider setting produces a non-finite model ---------- */
  { let bad=null;
    for(const l0 of [-1,-0.37,0,0.61,1]) for(const l1 of [-1,0,1]){ const X=freshBench(); benchPlace(X,2,2); benchPlace(X,0,3);
      for(let k=0;k<400;k++) benchStep(X,[l0,l1]); for(const b of X.bodies) if(!isFinite(b.E)||!isFinite(bodyT(b))) bad='bench '+l0+','+l1; }
    for(const src of ['biker','faucet','sun','teapot']) for(const conv of ['generator','panel']) for(const user of ['heater','incandescent','fluorescent','fan'])
      for(const v of [0,0.33,1]){ const S={}, st=Object.assign({},DEFAULTS,{src,conv,user,pedal:v,flow:v,clouds:v,heat:v}); sysReset(S,st);
        for(let k=0;k<240;k++) sysStep(S,st); const b=sysBalance(S);
        if(!isFinite(b.IN)||!isFinite(b.resid)||!isFinite(S.water)) bad=src+'/'+conv+'/'+user+' '+v;
        if(Math.abs(b.resid)>1e-11*Math.max(1,b.IN)) bad='ledger '+src+'/'+conv+'/'+user+' '+v; }
    for(const P of EQ_PAIRS) for(const T1 of [273.15,400,620]) for(const T2 of [273.15,373.15]) for(const mats of ['phet','real']) for(const air of [true,false]){
      const L=eqLinear(P.id,T1,T2,mats,air), x=eqExact(L,3); if(!isFinite(x[0])||!isFinite(x[1])||!isFinite(eqWindow(L))) bad='eq '+P.id; }
    ok(!bad,'every bench lever pair, all 32 chains at three settings, every pair: finite, and each chain’s ledger closes'+(bad?' ('+bad+')':'')); }

  /* ---------- K. the layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over] of CONFIGS) for(const [W,H] of SIZES) withState(over,()=>{
    const c=makeShot(W,H); let err=null;
    try{ drawView(c,W,H,viewModel()); }catch(e){ err=e; }
    ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
    if(err) return;
    const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
    const strokes=c.ops.filter(o=>o.op==='stroke').length;
    ok(fills.length+strokes>=6&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, '+strokes+' strokes)');
    let bad=null;
    for(const t of texts){
      if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
      if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
      if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
    ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
    /* the house #hint (HTML, bottom:11px, 11px type) owns the bottom-left corner */
    const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
    ok(!inHint.length,nm+' '+W+'x'+H+' no canvas text under the #hint line'+(inHint.length?' ("'+inHint[0].t.slice(0,30)+'" to y '+fmt(inHint[0].bb[3],0)+')':''));
    let hit=null;
    for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
      const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
      if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
    ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
    let leg=null;
    for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
      const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
      if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
      leg='a curve crosses the legend'; break; }
    ok(!leg,nm+' '+W+'x'+H+' legend clear');
  });

  Object.assign(ST,stSave); resetAllState(); ST.view=stSave.view;
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
