<title>Energy forms and changes &mdash; PhET&rsquo;s bench and energy systems, with a ledger that closes</title>
<!--
  ===================================================================
  energy-forms-and-changes.html — iron and brick blocks, beakers of
  water and olive oil, two burners and the room; then a source, a
  converter and a user joined in a chain.  PhET's model, with every
  joule on a ledger that closes to machine precision
  ===================================================================

  Remake of PhET Interactive Simulations' Energy Forms and Changes
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code;
  no PhET code or assets.  The model, its constants and its controls follow
  PhET's build 1.4.24 (docs/phets/energy-forms-and-changes_en.html) and its
  doc/model.md; every number taken from that build is marked "PhET's value"
  in the code.

  Five views.  THE BENCH is PhET's Intro screen: an iron block, a brick, a
  beaker of water and one of olive oil on six spots, two heat/cool burners
  (linkable), four thermometers, energy symbols, play, step and x4.  Drag a
  body to stack it, sit it on a burner or drop it into a beaker.  THE
  SYSTEMS is PhET's Systems screen: a source (the cyclist, who needs
  feeding; a faucet; the sun behind adjustable clouds; a teapot on a
  burner), a converter (a water-wheel generator, a solar panel) and a user
  (a beaker heater, an incandescent bulb, a fluorescent bulb, a fan), with
  energy chunks labelled by form: mechanical, electrical, thermal, light,
  chemical.  THE HEAT LEDGER records the bench: every body's temperature,
  and the first law as three accounts (the bodies, the burners' work, the
  room) whose sum is printed to the last digit.  THE ENERGY FLOW is the
  chain as a Sankey diagram with every store and loss.  EQUILIBRIUM sets
  one pair of bodies in contact and lays PhET's stepped model over the
  exact solution, with PhET's specific heats beside the real ones.

  WHICH SPECIFIC HEATS, AND WHY
  -----------------------------
  The bench runs on PhET's values (below), because the point of a remake is
  PhET's behaviour: its chunk counts, heating times and equilibria.  Two of
  them are far from the real material, and EQUILIBRIUM puts the real values
  one chip away so the difference can be seen rather than described:
                  PhET c, rho            real c, rho (source)
      iron        450, 7800         449.35 J/(kg K) (NIST-JANAF Cp 25.094
                                     J/(mol K) at 298.15 K / 55.845 g/mol),
                                     7874 kg/m^3 (20 C, Arblaster 2018)
      brick       840, 3300         840 (Wikipedia's building-materials
                                     table; Engineering ToolBox: 900 for
                                     common brick), 1400-2400 kg/m^3
                                     (ToolBox); 1900 taken as the middle
      water      3000, 1000         4182.32, 997.577 (NIST Chemistry
                                     WebBook, IAPWS-95, 296 K, 1 atm)
      olive oil  1411,  916         1970 (Engineering ToolBox), 911 (sg at
                                     20 C, USDA grading manual)
  PhET's water has 28 % too little specific heat (3000 against 4182), and
  its brick is 1.7x the middle of the handbook range of densities.  PhET's
  own model notes say that some values were chosen for clarity rather than
  realism (the rate of exchange with the air above all).

  THE MODEL (PhET's values)
  -------------------------
  E = m c T for every body, T = E/(m c); a beaker's T stops at its boiling
  point (373.15 K, 573.15 K) and a block's energy past 620 K goes to the
  room.  Blocks are 4.5 cm cubes; beakers are 8.5 cm across and 1.1x as
  tall, half full, and a block inside raises the level by 120 x its
  submerged area (m^2), capped at full.  Each step (1/60 s, PhET's) is
  PhET's EFACIntroModel.stepModel in PhET's order:
    1. every pair of bodies once, blocks first: dQ = k L (T_b - T_a) dt with
       k = 1000 W/(m K) and L PhET's contact length (the overlap of a
       stacked pair, the perimeter of the wetted part of an immersed block);
    2. each burner: 5000 x level W into whatever sits on it (never below
       273.15 K), or 1500 x level W into the room if nothing does;
    3. the room: every body not immersed trades k_air L (T - 296 K) dt with
       it, k_air = 30 W/(m K) round its whole perimeter, and hands it any
       energy past its cap.  The room is an infinite bath at 296 K, as in
       PhET (its energy never changes).
  The Systems screen runs PhET's rates: 10 kW at most anywhere (PhET's
  MAX_ENERGY_PRODUCTION_RATE); the cyclist's crank up to 3 pi rad/s,
  changing at pi/2 rad/s^2, 21 chunks of food; the faucet's water taking
  0.4 s to fall; the sun's 10 kW dimmed to 0.1 + 0.9(1 - clouds) (none at
  full cloud); the teapot's steam lagging its burner by 10 s; the generator
  lagging its water by 5/3 s; the solar panel at 68 %; the heater's coil
  ramping at 0.5/s and putting 5000 W x its heat into a 7.5 cm beaker; the
  bulbs splitting light and heat 65/35 (incandescent) and 80/20
  (fluorescent); the fan turning at 0.0051 rad/s per watt, not below 4 rad/s.

  WHAT IS EXACT HERE
  ------------------
  The bench's ledger: at every step the change in the bodies' energy plus
  what the room took equals what the burners did, to machine precision
  (asserted per step and over whole runs), and the chunks obey the exact
  identity EPC x (chunks - chunks at start) = (E - E at start) + the energy
  still in transit on each link, with EPC = 5019.022 J, PhET's
  ENERGY_PER_CHUNK.  Equilibria against the exact solution of the linear
  two-body-and-room system (a closed-form 2x2 matrix exponential, checked
  against scipy.linalg.expm); T_eq = (C1 T1 + C2 T2)/(C1 + C2) with the room
  shut out.  On the Systems screen every element's input equals its output
  plus its losses plus the change in its store, per step and over a run,
  and the chunks on every channel number floor(energy/EPC).  Every value is
  pinned in selfTest to build/energy-forms-and-changes/refvals.txt, the
  printed output of derive.py, an independent Python twin.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  PhET's Systems screen does not close its own ledger, and the remake does:
    - the teapot: PhET's steam power settles at 20 kW x heat (to its 10 kW
      cap), twice the burner's power below the cap.  Here the kettle is a
      store: 80 % of the burner's heat goes in (PhET's chunk split), steam
      leaves it with PhET's 10 s time constant, so steam = 0.8 x burner;
    - the cyclist: PhET's output is 10 kW x crank/max, while its chunks send
      one in six to heat.  Here food burns at 10 kW x crank/max with a load
      (2 kW without, PhET's rates), 5/6 of it reaching the pedals;
    - the generator: PhET's water-driven wheel turns at a speed set by the
      energy PER FRAME, so its efficiency depends on the frame rate: 69 %
      at 60 frames/s, while at 30 frames/s it puts out 1.38 times what it
      takes in (below its speed limit).  Here the wheel is a store with
      PhET's 5/3 s lag and its 60-frame efficiency, 13/(6 pi) = 68.97 %;
      belted to the cyclist it is lossless, as in PhET;
    - the heater: PhET heats the water at 5000 W x heat and says nothing of
      the rest; here the rest is the coil's loss to the room;
    - the fan: PhET sends 1 chunk in 14 to heat at full power (fewer when
      slower, by a temperature counter); here 1/14 at every power;
    - chunks are a quantisation of the ledger (each channel emits one per
      EPC of its flow) rather than PhET's random paths and preloading.
  Other choices: one fixed step of 1/60 s (PhET steps once per frame);
  dropped bodies snap to PhET's six spots and stacking rules at once
  (PhET lets them fall); the burners' levers stay where they are left
  (PhET's spring back to off, unless its stickyBurners query parameter is
  set); normal and x4 time on the bench (PhET hides x4 behind its
  showSpeedControls query parameter); one play/pause for both screens; the
  Systems screen opens on the faucet running (PhET opens on the cyclist,
  not pedalling); energy symbols start shown; thermometers print their
  value in degrees beside the column.

  WHAT IS NOT MODELLED
  --------------------
  Freezing and melting (nothing goes below 0 C), boiling as a process
  (energy past the boiling point leaves as steam at once), the heat
  capacities of the beakers' glass, radiation, the room warming up, and
  any kinetic energy in the bicycle or the fan.  No sounds, no keyboard
  dragging and no screen-reader descriptions.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                 *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];

function bodyArea(b){
  if(b.kind==='block') return bodyBounds(b);
  return {x0:b.x-b.w/2, y0:b.y, x1:b.x+b.w/2, y1:b.y+b.h*b.f, imm:true};
}
/* PhET's ThermalContactArea.getThermalContactLength (a's method, b's area) */
function contactLen(a,b){
  const ox=Math.max(Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0),0);
  const oy=Math.max(Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0),0);
  let n=0;
  if(ox>0&&oy>0){
    if(a.imm||b.imm){
      const rw=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0), rh=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
      n=2*rw+2*rh;
      if(rw!==(a.x1-a.x0)&&rw!==(b.x1-b.x0)) n-=rh;
      if(rh!==(a.y1-a.y0)&&rh!==(b.y1-b.y0)) n-=rw;
    }
  } else if(ox>0||oy>0){
    /* PhET's precedence, kept: && binds tighter than || */
    if((ox>0&&Math.abs(a.y1-b.y0)<0.001)||Math.abs(a.y0-b.y1)<0.001||(oy>0&&Math.abs(a.x1-b.x0)<0.001)||Math.abs(a.x0-b.x1)<0.001) n=ox;
  }
  return n;
}
/* a.exchangeEnergyWith(b): substeps of at most 1/60 s; returns the energy that went a -> b */
function exchange(a,b,dt){
  let tot=0;
  const L=contactLen(bodyArea(a),bodyArea(b));
  if(L>0&&Math.abs(bodyT(b)-bodyT(a))>EQ_THRESH){
    const nsub=Math.floor(dt/MAXSTEP), rem=dt-nsub*MAXSTEP;
    for(let o=0;o<nsub+1;o++){
      const h=o<nsub?MAXSTEP:rem;
      const q=(bodyT(b)-bodyT(a))*L*K_BODY*h;
      b.E-=q; a.E+=q; tot+=-q;
    }
  }
  return tot;
}
/* Air.exchangeEnergyWith(b): the body's temperature held over the substeps; any
   energy past the body's cap goes too.  Returns the energy b -> the room. */
function airExchange(b,dt){
  let i=0;
  const L=contactLen(AIR_AREA,bodyArea(b));
  if(L>0){
    const nsub=Math.floor(dt/MAXSTEP), rem=dt-nsub*MAXSTEP;
    for(let o=0;o<nsub+1;o++){ const h=o<nsub?MAXSTEP:rem; i+=(bodyT(b)-T_AIR)*L*K_AIR*h; }
    if(i>=0) i=Math.max(i,bodyBeyond(b));
    b.E-=i;
  }
  return i;
}
function containsB(o,i){ return o.x0<=i.x0&&o.x1>=i.x1&&o.y0<=i.y0&&o.y1>=i.y1; }
function isImmersed(bodies,b){
  if(b.kind!=='block') return false;
  const bb=bodyBounds(b);
  for(const k of bodies) if(k!==b&&k.kind==='beaker'&&containsB(bodyArea(k),bb)) return true;
  return false;
}
/* PhET's perspective: a block is a cube 4.5 cm deep whose depth shifts by
   MAP_Z_TO_XY_OFFSET = 0.25 per unit (PERSP for half the depth).  PhET centres
   the cube on the model's rectangle; the remake draws its front face ON the
   rectangle (its beakers are flat) with the depth running up-right, and picks
   and senses with the shape it draws */
const PERSP=0.25*BLOCK/2;
function blockHex(b){
  const x0=b.x-b.w/2, x1=b.x+b.w/2, y0=b.y, y1=b.y+b.h, d=2*PERSP;
  return [[x0,y0],[x1,y0],[x1+d,y0+d],[x1+d,y1+d],[x0+d,y1+d],[x0,y1]];
}
function inPoly(pts,x,y){
  let ins=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins;
  }
  return ins;
}

/* ---- the live bench ---------------------------------------------------- */
const BENCH={};
const HIST_MAX=1200;
const BENCH_XLIM=[-0.29,0.29], BENCH_YMAX=0.24;
/* the thermometer tray (world, top-left) and a thermometer's drawn height */
const TRAY={x0:-0.300,y0:0.205,x1:-0.215,y1:0.285};
const THERMO_H=0.062;
function trayHome(k){ return {x:TRAY.x0+0.012+k*0.02, y:TRAY.y0+0.008}; }

function benchReset(B){
  B.bodies=[0,1,2,3].map(i=>makeBody(i));
  B.chains=[[0],[1],[],[],[2],[3]];
  B.held=null;
  benchLayout(B);
  B.room=0; B.work=0; B.workK=[0,0]; B.workAir=0; B.roomBodies=0;
  B.t=0; B.steps=0; B.acc=0;
  B.own=B.bodies.map(b=>nChunks(b.E)); B.own0=B.own.slice(); B.E0=B.bodies.map(b=>b.E);
  B.link={}; B.moved={pair:0,burner:0,air:0}; B.corr={excess:0,deficit:0}; B.maxdev=0;
  B.flights=[]; B.lastResid=0; B.worstResid=0; B.sumResid=0;
  B.therm=[0,1,2,3].map(k=>{ const h=trayHome(k); return {x:h.x,y:h.y,tray:true,att:null}; });
  B.hist={t:[],T:[[],[],[],[]],E:[[],[],[],[]],work:[],room:[],stride:1,skip:0};
  benchRecord(B);
}
/* each spot's stack, bottom to top: a body sits on the burner or ground, on a
   block's top, or 1 mm inside a beaker's bottom (PhET's topSurface) */
function benchLayout(B){
  for(let k=0;k<6;k++){
    const y0=(k===2||k===3)?BURNER_TOP:0; let prev=null;
    for(const i of B.chains[k]){
      const b=B.bodies[i]; b.x=SPOTS[k];
      b.y=prev===null?y0:(prev.kind==='beaker'?prev.y+0.001:prev.y+prev.h);
      prev=b;
    }
  }
  if(B.held) benchLayoutHeld(B);
}
function benchLayoutHeld(B){
  const H=B.held; let prev=null;
  for(const i of H.group){
    const b=B.bodies[i];
    if(prev===null){ b.x=H.x; b.y=H.y; }
    else { b.x=prev.x; b.y=prev.kind==='beaker'?prev.y+0.001:prev.y+prev.h; }
    prev=b;
  }
}
function chainOf(B,i){ for(let k=0;k<6;k++){ const j=B.chains[k].indexOf(i); if(j>=0) return [k,j]; } return null; }
/* PhET's drop rule: try the spots nearest first; a spot whose stack holds a
   beaker refuses a group that holds one (no beaker on or in a beaker) */
function spotOrder(x){ return [0,1,2,3,4,5].sort((a,b)=>Math.abs(SPOTS[a]-x)-Math.abs(SPOTS[b]-x)); }
function canStack(B,group,k){
  const gb=group.some(i=>B.bodies[i].kind==='beaker'), cb=B.chains[k].some(i=>B.bodies[i].kind==='beaker');
  return !(gb&&cb);
}
function benchPlace(B,i,k){
  const at=chainOf(B,i); let group;
  if(at){ group=B.chains[at[0]].slice(at[1]); B.chains[at[0]].length=at[1]; }
  else if(B.held&&B.held.group[0]===i){ group=B.held.group.slice(); B.held=null; }
  else return false;
  if(!canStack(B,group,k)){ if(at) B.chains[at[0]].push(...group); benchLayout(B); return false; }
  B.chains[k].push(...group); benchLayout(B); return true;
}
function benchGrab(B,i,x,y){
  const at=chainOf(B,i); if(!at) return false;
  const group=B.chains[at[0]].slice(at[1]); B.chains[at[0]].length=at[1];
  const b=B.bodies[i];
  B.held={i,group,x:b.x,y:b.y,dx:b.x-x,dy:b.y-y};
  benchLayout(B); return true;
}
function benchMoveHeld(B,x,y){
  const H=B.held; if(!H) return;
  H.x=clamp(x+H.dx,BENCH_XLIM[0],BENCH_XLIM[1]); H.y=clamp(y+H.dy,0,BENCH_YMAX);
  benchLayout(B);
}
function benchDropSpot(B,x,group){ for(const k of spotOrder(x)) if(canStack(B,group,k)) return k; return -1; }
function benchDrop(B){
  const H=B.held; if(!H) return -1;
  const k=benchDropSpot(B,H.x,H.group);
  B.held=null; B.chains[k].push(...H.group); benchLayout(B);
  return k;
}
/* the topmost body under a world point: blocks (front) before beakers */
function benchPick(B,x,y){
  for(const i of [1,0]){ const b=B.bodies[i]; if(inPoly(blockHex(b),x,y)) return i; }
  for(const i of [3,2]){ const b=B.bodies[i]; if(x>=b.x-b.w/2&&x<=b.x+b.w/2&&y>=b.y&&y<=b.y+b.h) return i; }
  return -1;
}
function burnerX(k){ return SPOTS[2+k]; }
function burnerContact(k,b){
  const a=bodyArea(b), cx=(a.x0+a.x1)/2, bx=burnerX(k);
  return cx>bx-BURNER_HALF&&cx<bx+BURNER_HALF&&Math.abs(a.y0-BURNER_TOP)<0.001;
}
/* linking is one mechanism, not two: every writer (both sliders, the lever
   drag, the link box) keeps lev0 and lev1 equal while linked, so the levels
   are simply the two keys (a second link check here made each copy's mutant
   equivalent -- the Known-bad two-guards trap) */
function burnerLevels(st){ return [st.lev0,st.lev1]; }

function benchFlow(B,key,a,b,q){
  let L=B.link[key];
  if(!L) L=B.link[key]={B:0,a,b,upd:false,key};
  L.B+=q; L.upd=true;
}
/* one step of PhET's stepModel; returns the step's ledger residual (J) */
function benchStep(B,lev){
  const bodies=B.bodies, dt=DT;
  for(const k in B.link) B.link[k].upd=false;
  /* 1. fluid displacement: one update per step, from the blocks' bounds */
  for(const bk of bodies){
    if(bk.kind!=='beaker') continue;
    const fx0=bk.x-bk.w/2, fy0=bk.y, fx1=fx0+bk.w, fy1=fy0+bk.h*bk.f;
    let area=0;
    for(const bl of bodies){
      if(bl.kind!=='block') continue;
      const bb=bodyBounds(bl);
      const ix0=Math.max(bb.x0,fx0), ix1=Math.min(bb.x1,fx1), iy0=Math.max(bb.y0,fy0), iy1=Math.min(bb.y1,fy1);
      if(ix1-ix0>=0&&iy1-iy0>=0) area+=(ix1-ix0)*(iy1-iy0);
    }
    bk.f=Math.min(FLUID0+DISPLACE*area,1);
  }
  let E0=0; for(const b of bodies) E0+=b.E;
  let work=0, room=0;
  /* 2. every pair once, blocks first (PhET's thermalContainers order) */
  for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){
    const q=exchange(bodies[i],bodies[j],dt);
    if(contactLen(bodyArea(bodies[i]),bodyArea(bodies[j]))>0) benchFlow(B,'p'+i+j,i,j,q);
  }
  /* 3. the burners: into whatever sits on them, else into the room */
  for(let k=0;k<2;k++){
    const l=lev[k];
    if(bodies.some(b=>burnerContact(k,b))){
      bodies.forEach((b,i)=>{
        if(!burnerContact(k,b)) return;
        let q=0;
        if(bodyT(b)>T_FREEZE){ q=P_BURN*l*dt; if(l<0&&Math.abs(q)>b.E-bodyMinE(b)) q=-(b.E-bodyMinE(b)); }
        b.E+=q; work+=q; B.workK[k]+=q;
        benchFlow(B,'b'+k+i,'b'+k,i,q);
      });
    } else {
      const q=P_BURN_AIR*l*dt; work+=q; room+=q; B.workK[k]+=q; B.workAir+=q;
      benchFlow(B,'b'+k+'A','b'+k,'A',q);
    }
  }
  /* 4. the room: every body not immersed in a beaker */
  bodies.forEach((b,i)=>{
    if(isImmersed(bodies,b)) return;
    const q=airExchange(b,dt); room+=q; B.roomBodies+=q;
    benchFlow(B,'a'+i,i,'A',q);
  });
  B.work+=work; B.room+=room;
  let E1=0; for(const b of bodies) E1+=b.E;
  const resid=E1-E0+room-work;
  benchChunks(B,lev);
  B.t+=dt; B.steps++;
  for(const f of B.flights) f.t+=dt;
  B.flights=B.flights.filter(f=>f.t<f.dur);
  benchRecord(B);
  B.lastResid=resid;
  const scale=bodies.reduce((s,b)=>s+Math.abs(b.E),0)+Math.abs(B.room)+Math.abs(B.work);
  B.worstResid=Math.max(B.worstResid,Math.abs(resid)/scale); B.sumResid+=resid;
  return resid;
}

/* ---- the chunk rule ------------------------------------------------------
   (a) PhET's threshold pass: a link carries a chunk once more than a chunk's
       worth (EPC) has crossed it, never a body's last chunk;
   (b) the corrective pass: no body may sit a whole chunk or more from its
       energy, g(E) = PhET's map unrounded; it sends or takes one along the
       link carrying the most energy the right way (a partner that can take
       it first; the room always can).
   Every transfer moves the link's balance by EPC, so for each body
       E + (energy still in transit on its links) - EPC x chunks
   never changes: the exact identity selfTest pins. */
function isBodyRef(x){ return typeof x==='number'; }
function moveKind(a,b){ return isBodyRef(a)&&isBodyRef(b)?'pair':(a==='A'||b==='A'?'air':'burner'); }
function benchGive(B,src,dst,kind){
  if(isBodyRef(src)) B.own[src]--;
  if(isBodyRef(dst)) B.own[dst]++;
  B.moved[kind]++;
  const d=Math.max(0.35,Math.min(2.2,kind==='air'?1.6:(kind==='burner'?0.9:0.8)));
  B.flights.push({src,dst,t:0,dur:d,air:(src==='A'?dst:(dst==='A'?src:null))});
}
function benchChunks(B,lev){
  const bodies=B.bodies, keys=Object.keys(B.link).sort();
  for(const key of keys){
    const L=B.link[key]; if(!L.upd) continue;
    if(L.B>EPC){ if(!(isBodyRef(L.a)&&B.own[L.a]<=1)){ benchGive(B,L.a,L.b,moveKind(L.a,L.b)); L.B-=EPC; } }
    else if(L.B<-EPC){ if(!(isBodyRef(L.b)&&B.own[L.b]<=1)){ benchGive(B,L.b,L.a,moveKind(L.a,L.b)); L.B+=EPC; } }
  }
  for(let it=0;it<8;it++){
    let bad=false;
    for(let i=0;i<4;i++){
      const dev=B.own[i]-gChunks(bodies[i].E);
      if(dev>=1||dev<=-1){ bad=true; benchCorrect(B,i,dev>0,lev,keys); }
    }
    if(!bad) break;
  }
  for(let i=0;i<4;i++) B.maxdev=Math.max(B.maxdev,Math.abs(B.own[i]-gChunks(bodies[i].E)));
}
function okPartner(B,p,receiving,lev){
  if(p==='A') return true;
  if(!isBodyRef(p)){ const l=lev[+p[1]]; return receiving?l<0:l>0; }
  const dev=B.own[p]-gChunks(B.bodies[p].E);
  return receiving?dev<0:(dev>0&&B.own[p]>1);
}
function benchCorrect(B,i,excess,lev,keys){
  const cands=[];
  for(const key of keys){
    const L=B.link[key]; if(!L||!L.upd) continue;
    if(L.a===i) cands.push([L,L.b,L.B]); else if(L.b===i) cands.push([L,L.a,-L.B]);
  }
  let best=null;
  for(const [L,p,outb] of cands){ const sc=excess?outb:-outb; if(okPartner(B,p,excess,lev)&&(best===null||sc>best[0])) best=[sc,L,p]; }
  if(best===null) for(const [L,p,outb] of cands){ const sc=excess?outb:-outb; if(best===null||sc>best[0]) best=[sc,L,p]; }
  if(best===null) return;
  const L=best[1], p=best[2], kind=moveKind(i,p);
  B.corr[excess?'excess':'deficit']++;
  if(excess){ benchGive(B,i,p,kind); if(L.a===i) L.B-=EPC; else L.B+=EPC; }
  else { benchGive(B,p,i,kind); if(L.a===i) L.B+=EPC; else L.B-=EPC; }
}
/* E_i + S_i - EPC own_i, which the chunk rule keeps at its reset value */
function benchIdentity(B,i){
  let S=0;
  for(const k in B.link){ const L=B.link[k]; if(L.a===i) S+=L.B; else if(L.b===i) S-=L.B; }
  return B.bodies[i].E+S-EPC*B.own[i];
}
function benchIdentity0(B,i){ return B.E0[i]-EPC*B.own0[i]; }

/* ---- the clock: whole 1/60-s steps; x4 takes four a frame ---- */
const STEP_TOL=1e-9;
function benchAdvance(B,st,dtWall){
  B.acc+=dtWall*(st.speed==='fast'?SPEED_FAST:1);
  let n=0;
  while(B.acc>=DT*(1-STEP_TOL)&&n<40){ B.acc-=DT; benchStep(B,burnerLevels(st)); n++; }
  if(n>=40) B.acc=0;
  return n;
}

/* ---- the history the ledger view draws: every step to HIST_MAX points, then
   every other point kept and the stride doubled (deterministic) ---- */
function benchRecord(B){
  const H=B.hist;
  if(H.skip>0){ H.skip--; return; }
  H.skip=H.stride-1;
  H.t.push(B.t); H.work.push(B.work); H.room.push(B.room);
  for(let i=0;i<4;i++){ H.T[i].push(bodyT(B.bodies[i])); H.E[i].push(B.bodies[i].E); }
  if(H.t.length>HIST_MAX){
    const keep=(arr)=>arr.filter((v,k)=>k%2===0);
    H.t=keep(H.t); H.work=keep(H.work); H.room=keep(H.room);
    for(let i=0;i<4;i++){ H.T[i]=keep(H.T[i]); H.E[i]=keep(H.E[i]); }
    H.stride*=2; H.skip=H.stride-1;
  }
}

/* ---- thermometers: PhET's sensing order (blocks, then the beakers' liquid,
   then the steam over a boiling beaker, then a burner's flame or ice, else
   the room); a thermometer dropped on a body follows it ---- */
function steamProp(b){ const T=bodyT(b), tb=T_BOIL[b.mat]; return T>tb-10?clamp(1-(tb-T)/10,0,1):0; }
function thermoSense(B,x,y,lev){
  for(const i of [1,0]){ const b=B.bodies[i]; if(inPoly(blockHex(b),x,y)) return {T:bodyT(b),what:i}; }
  for(const i of [2,3]){ const a=bodyArea(B.bodies[i]); if(x>=a.x0&&x<=a.x1&&y>=a.y0&&y<=a.y1) return {T:bodyT(B.bodies[i]),what:i}; }
  for(const i of [2,3]){
    const b=B.bodies[i], a=bodyArea(b), sp=steamProp(b), top=a.y1, hS=2*b.h;
    if(sp>0&&x>=a.x0&&x<=a.x1&&y>=top&&y<=top+hS){
      const T=linearMap(0,hS*sp,bodyT(b),T_ROOM,y-top);
      return {T:Math.max(T,T_ROOM),what:'steam'+i};
    }
  }
  for(let k=0;k<2;k++){ const bx=burnerX(k);
    if(x>=bx-BURNER_HALF/2&&x<=bx+BURNER_HALF/2&&y>=BURNER_TOP/2&&y<=BURNER_TOP) return {T:Math.max(T_ROOM+100*lev[k],T_FREEZE),what:'burner'+k}; }
  return {T:T_AIR,what:'air'};
}
function thermoTip(B,th){
  if(th.att){ const b=B.bodies[th.att.i]; return {x:b.x+th.att.dx, y:b.y+th.att.dy}; }
  return {x:th.x, y:th.y};
}
function inTray(x,y){ return x>=TRAY.x0&&x<=TRAY.x1&&y>=TRAY.y0-0.01&&y<=TRAY.y1; }
function thermoDrop(B,k){
  const th=B.therm[k], p=thermoTip(B,th);
  th.att=null; th.x=p.x; th.y=p.y;
  if(inTray(p.x,p.y+THERMO_H/2)){ const h=trayHome(k); th.x=h.x; th.y=h.y; th.tray=true; return 'tray'; }
  th.tray=false;
  for(const i of [1,0]){ const b=B.bodies[i]; if(inPoly(blockHex(b),p.x,p.y)){ th.att={i,dx:p.x-b.x,dy:p.y-b.y}; return i; } }
  for(const i of [2,3]){ const a=bodyArea(B.bodies[i]); if(p.x>=a.x0&&p.x<=a.x1&&p.y>=a.y0&&p.y<=a.y1){ const b=B.bodies[i]; th.att={i,dx:p.x-b.x,dy:p.y-b.y}; return i; } }
  return 'free';
}
function thermoPick(B,x,y){
  for(let k=3;k>=0;k--){ const p=thermoTip(B,B.therm[k]);
    if(Math.abs(x-p.x)<=0.009&&y>=p.y-0.006&&y<=p.y+THERMO_H) return k; }
  return -1;
}

/* ---- presets: PhET's start and four set-ups that make the ledger move ---- */
const BENCH_PRESETS=[{id:'start',name:'PhET’s start'},{id:'heat',name:'heat the iron'},{id:'hot',name:'hot iron into water'},
                     {id:'stack',name:'brick on iron, cooling'},{id:'boil',name:'boil the water'}];
function benchPreset(B,st,id){
  benchReset(B);
  st.lev0=0; st.lev1=0; st.link=false;
  if(id==='heat'){ benchPlace(B,0,2); st.lev0=1; }
  else if(id==='hot'){ benchPlace(B,0,4); const b=B.bodies[0]; b.E=b.m*b.c*500; }
  else if(id==='stack'){ benchPlace(B,0,3); benchPlace(B,1,3); st.lev1=-1; }
  else if(id==='boil'){ benchPlace(B,2,2); st.lev0=1; }
  B.own=B.bodies.map(b=>nChunks(b.E)); B.own0=B.own.slice(); B.E0=B.bodies.map(b=>b.E);
  B.hist={t:[],T:[[],[],[],[]],E:[[],[],[],[]],work:[],room:[],stride:1,skip:0};
  benchRecord(B);
}
benchReset(BENCH);

/* ================================================================== *
 *  the systems (PhET's Systems screen): a source, a converter and a   *
 *  user, stepped at 1/60 s on a ledger that closes                    *
 * ================================================================== */
const SOURCES=[{id:'biker',name:'cyclist'},{id:'faucet',name:'faucet'},{id:'sun',name:'sun'},{id:'teapot',name:'teapot'}];
const CONVERTERS=[{id:'generator',name:'generator'},{id:'panel',name:'solar panel'}];
const USERS=[{id:'heater',name:'beaker heater'},{id:'incandescent',name:'incandescent bulb'},{id:'fluorescent',name:'fluorescent bulb'},{id:'fan',name:'fan'}];
/* the chunk channels: [id, form, what it carries] */
const CHANNELS=[['b.chem','chemical','food burned'],['b.mech','mechanical','the pedals, to the belt'],['b.heat','thermal','body heat'],
  ['f.water','mechanical','falling water'],['s.light','light','sunlight past the clouds'],['s.refl','light','sunlight the clouds send back'],
  ['t.flame','thermal','the burner, into the kettle'],['t.loss','thermal','heat round the kettle'],['t.steam','mechanical','steam'],
  ['g.elec','electrical','the generator, to the wire'],['g.heat','thermal','the wheel’s losses'],['p.elec','electrical','the panel, to the wire'],
  ['p.heat','thermal','the panel’s losses'],['h.coil','thermal','the coil, into the water'],['h.loss','thermal','the coil’s loss'],
  ['h.water','thermal','the water, to the room'],['l.light','light','the bulb’s light'],['l.heat','thermal','the bulb’s heat'],
  ['n.wind','mechanical','the fan’s wind'],['n.heat','thermal','the motor’s heat'],['x.miss','*','what the converter cannot use']];
const CH_FORM={}; CHANNELS.forEach(c=>CH_FORM[c[0]]=c[1]);
function srcForm(src){ return src==='sun'?'light':'mechanical'; }
function convTakes(conv,src){ return conv==='generator'?srcForm(src)==='mechanical':srcForm(src)==='light'; }

const SYS={};
function sysReset(S,st){
  S.src=st.src; S.conv=st.conv; S.user=st.user;
  S.omega=0; S.crank=0; S.rear=0; S.food=FOOD0;
  S.fall=new Array(FALL_STEPS).fill(0);
  S.kettle=0; S.wheel=0; S.wAngle=0; S.wOmega=0;
  S.hp=0; S.water=HB_C*T_ROOM; S.water0=S.water;
  S.fan=0; S.fanAngle=0; S.lit=0;
  S.acc={}; S.count={}; S.chsum={}; for(const c of CHANNELS){ S.acc[c[0]]=0; S.count[c[0]]=0; S.chsum[c[0]]=0; }
  S.inp={fed:0,main:0,sun:0,gas:0}; S.sink={light:0,wind:0,room:0,reflected:0,escaped:0}; S.swap=0;
  S.stores0=sysStores(S);
  S.t=0; S.steps=0; S.acc_t=0; S.worstEl=0; S.worstClosure=0; S.flights=[]; S.flows=sysZeroFlows();
  S.hist={t:[],sup:[],use:[],loss:[],store:[],stride:1,skip:0};
  S.feedBase=0; S.foodChem0=0;
}
function sysStores(S){ return S.food+S.fall.reduce((a,b)=>a+b,0)+S.kettle+S.wheel+(S.water-S.water0); }
function sysClosure(S){
  const inp=S.inp.fed+S.inp.main+S.inp.sun+S.inp.gas;
  const out=S.sink.light+S.sink.wind+S.sink.room+S.sink.reflected+S.sink.escaped;
  return inp-out-(sysStores(S)-S.stores0);
}
function sysInputTotal(S){ return S.inp.fed+S.inp.main+S.inp.sun+S.inp.gas+Math.abs(S.stores0); }
function sysZeroFlows(){ return {srcIn:0,srcOut:0,srcLoss:0,srcStore:0,cIn:0,cOut:0,cLoss:0,cStore:0,cMiss:0,uIn:0,uOut:0,uLoss:0,uStore:0,
  refl:0,light:0,wind:0,water:0,waterLoss:0,coilLoss:0}; }
/* one element's ledger: in = out + loss + change in its store */
function sysCheck(S,inE,out,loss,dstore,store){
  const r=inE-out-loss-dstore, sc=Math.abs(inE)+Math.abs(out)+Math.abs(loss)+Math.abs(dstore)+Math.abs(store||0);
  if(sc>0) S.worstEl=Math.max(S.worstEl,Math.abs(r)/sc);
  return r;
}
function sysChan(S,c,E){
  S.chsum[c]+=E; S.acc[c]+=E;
  while(S.acc[c]>=EPC){ S.acc[c]-=EPC; S.count[c]++; sysSpawn(S,c); }
}

function sysStep(S,st){
  const dt=DT, F=sysZeroFlows();
  let form=null, Eout=0;
  /* ---------------- the source */
  if(S.src==='biker'){
    const target=st.pedal*OMEGA_MAX, tgt=S.food>0?target:0, d=tgt-S.omega;
    if(d!==0){ const r=CRANK_ACC*dt; S.omega=d>0?Math.min(S.omega+r,target):Math.max(S.omega-r,0); }
    S.crank=(S.crank+S.omega*dt)%TAU; S.rear=(S.rear+S.omega*dt)%TAU;
    const load=S.conv==='generator';
    const pchem=(load?BIKE_LOAD:BIKE_FREE)*S.omega/OMEGA_MAX;
    const Ec=Math.min(pchem*dt,S.food);
    S.food-=Ec;
    const Em=load?BIKE_MECH*Ec:0, Eh=Ec-Em;
    S.sink.room+=Eh;
    sysCheck(S,0,Em,Eh,-Ec,S.food+Ec);
    sysChan(S,'b.chem',Ec); sysChan(S,'b.mech',Em); sysChan(S,'b.heat',Eh);
    F.srcIn=Ec; F.srcOut=Em; F.srcLoss=Eh;     /* the food burned is the supply band itself */
    form='mechanical'; Eout=Em;
  } else if(S.src==='faucet'){
    const Ein=MAXP*st.flow*dt;
    S.inp.main+=Ein;
    S.fall.push(Ein); Eout=S.fall.shift();
    sysCheck(S,Ein,Eout,0,Ein-Eout,S.fall.reduce((a,b)=>a+b,0)+Eout);
    sysChan(S,'f.water',Ein);
    F.srcIn=Ein; F.srcOut=Eout; F.srcStore=Ein-Eout;
    form='mechanical';
  } else if(S.src==='sun'){
    const Ein=MAXP*dt, Et=MAXP*sunFrac(st.clouds)*dt, Er=Ein-Et;
    S.inp.sun+=Ein; S.sink.reflected+=Er;
    sysCheck(S,Ein,Et,Er,0);
    sysChan(S,'s.light',Et); sysChan(S,'s.refl',Er);
    F.srcIn=Ein; F.srcOut=Et; F.srcLoss=Er; F.refl=Er;
    form='light'; Eout=Et;
  } else {
    const Ein=MAXP*st.heat*dt; S.inp.gas+=Ein;
    const Ek=STEAM*Ein; let El=Ein-Ek;
    const k0=S.kettle; S.kettle+=Ek;
    let Es=S.kettle*dt/TAU_K;
    if(st.heat===0&&Es/dt<KETTLE_CUT){ El+=S.kettle; S.kettle=0; Es=0; } else S.kettle-=Es;
    S.sink.room+=El;
    sysCheck(S,Ein,Es,El,S.kettle-k0,k0+Ek);
    sysChan(S,'t.flame',Ein); sysChan(S,'t.loss',El); sysChan(S,'t.steam',Es);
    F.srcIn=Ein; F.srcOut=Es; F.srcLoss=El; F.srcStore=S.kettle-k0;
    form='mechanical'; Eout=Es;
  }
  /* ---------------- the converter */
  let Ee=0;
  F.cIn=Eout;
  if(S.conv==='generator'&&form==='mechanical'){
    if(S.src==='biker'){ Ee=Eout; sysCheck(S,Eout,Ee,0,0); }
    else {
      const w0=S.wheel; S.wheel+=Eout;
      const Er=S.wheel*dt/TAU_W; S.wheel-=Er;
      Ee=ETA_W*Er; const Eh=Er-Ee;
      S.sink.room+=Eh; sysCheck(S,Eout,Ee,Eh,S.wheel-w0,w0+Eout);
      sysChan(S,'g.heat',Eh); F.cLoss=Eh; F.cStore=S.wheel-w0;
    }
    sysChan(S,'g.elec',Ee);
    /* PhET: the output is 10 kW x w/(pi/2), so the wheel turns at (pi/2) P/10 kW */
    S.wOmega=(Math.PI/2)*(Ee/dt)/MAXP; S.wAngle=(S.wAngle+S.wOmega*dt)%TAU;
  } else if(S.conv==='panel'&&form==='light'){
    Ee=ETA_PANEL*Eout; const Eh=Eout-Ee;
    S.sink.room+=Eh; sysCheck(S,Eout,Ee,Eh,0);
    sysChan(S,'p.elec',Ee); sysChan(S,'p.heat',Eh); F.cLoss=Eh;
    S.wOmega=0;
  } else {
    S.sink.escaped+=Eout; sysCheck(S,Eout,0,Eout,0); sysChan(S,'x.miss',Eout); F.cMiss=Eout;
    S.wOmega=0;
  }
  F.cOut=Ee;
  /* ---------------- the user */
  F.uIn=Ee;
  if(S.user==='heater'){
    const r=(Ee/dt)/MAXP;
    S.hp=Math.min(r,S.hp+HEAT_RAMP*dt);
    const Ew=HEAT_MAXP*S.hp*dt, El=Ee-Ew, w0=S.water;
    S.water+=Ew;
    const T=Math.min(S.water/HB_C,T_BOIL.water), s=T-T_ROOM;
    let Ea=0;
    if(Math.abs(s)>EQ_THRESH){ Ea=s*K_AIR*HB_L*dt; S.water-=Ea; }
    const Eb=Math.max(S.water-T_BOIL.water*HB_C,0); S.water-=Eb;
    S.sink.room+=El+Ea+Eb;
    sysCheck(S,Ee,0,El+Ea+Eb,S.water-w0,w0+Ew);
    sysChan(S,'h.coil',Ew); sysChan(S,'h.loss',El); sysChan(S,'h.water',Ea+Eb);
    F.uLoss=El+Ea+Eb; F.uStore=S.water-w0; F.water=Ew; F.waterLoss=Ea+Eb; F.coilLoss=El;
    S.lit=0;
  } else if(S.user==='incandescent'||S.user==='fluorescent'){
    const El=LIGHT_FRAC[S.user]*Ee, Eh=Ee-El;
    S.sink.light+=El; S.sink.room+=Eh; sysCheck(S,Ee,El,Eh,0);
    sysChan(S,'l.light',El); sysChan(S,'l.heat',Eh);
    F.uOut=El; F.uLoss=Eh; F.light=El;
    S.lit=clamp((Ee/dt)/MAXP,0,1);
  } else {
    const Eh=FAN_HEAT*Ee, Ew=Ee-Eh;
    S.sink.wind+=Ew; S.sink.room+=Eh; sysCheck(S,Ee,Ew,Eh,0);
    sysChan(S,'n.wind',Ew); sysChan(S,'n.heat',Eh);
    F.uOut=Ew; F.uLoss=Eh; F.wind=Ew;
    let tgt=FAN_W*Ee/dt; tgt=tgt<FAN_MIN?0:tgt;
    const d=tgt-S.fan;
    if(d!==0) S.fan=d>0?Math.min(S.fan+FAN_ACC*dt,tgt):Math.max(S.fan-FAN_ACC*dt,0);
    S.fanAngle=(S.fanAngle+S.fan*dt)%TAU; S.lit=0;
  }
  for(const k in F) F[k]/=dt;              /* the flows are kept as powers, W */
  S.flows=F;
  S.t+=dt; S.steps++;
  const c=sysClosure(S), sc=sysInputTotal(S);
  S.worstClosure=Math.max(S.worstClosure,Math.abs(c)/Math.max(sc,1));
  sysMoveFlights(S,dt);
  sysRecord(S);
}
function sysAdvance(S,st,dtWall){
  S.acc_t+=dtWall; let n=0;
  while(S.acc_t>=DT*(1-STEP_TOL)&&n<40){ S.acc_t-=DT; sysStep(S,st); n++; }
  if(n>=40) S.acc_t=0;
  return n;
}
/* the cumulative ledger for the flow view.  IN is what entered the chain
   (water, sunlight, gas, and the food the cyclist burned), OUT what it
   delivered (light, wind), LOST what went to the room or never arrived, and
   STORED what the falling water, the kettle, the wheel and the heater's water
   hold now.  IN = OUT + LOST + STORED is the global ledger with the food store
   taken as the cyclist's supply (fed - change in food = food burned). */
function sysBalance(S){
  const IN=S.inp.main+S.inp.sun+S.inp.gas+S.chsum['b.chem'];
  const OUT=S.sink.light+S.sink.wind;
  const LOST=S.sink.room+S.sink.reflected+S.sink.escaped;
  const STORED=S.fall.reduce((a,b)=>a+b,0)+S.kettle+S.wheel+(S.water-S.water0);
  return {IN,OUT,LOST,STORED,resid:IN-OUT-LOST-STORED};
}
function sysRecord(S){
  const H=S.hist;
  if(H.skip>0){ H.skip--; return; }
  H.skip=H.stride-1;
  const L=sysBalance(S);
  H.t.push(S.t); H.sup.push(L.IN); H.use.push(L.OUT); H.loss.push(L.LOST); H.store.push(L.STORED);
  if(H.t.length>HIST_MAX){
    const keep=a=>a.filter((v,k)=>k%2===0);
    H.t=keep(H.t); H.sup=keep(H.sup); H.use=keep(H.use); H.loss=keep(H.loss); H.store=keep(H.store);
    H.stride*=2; H.skip=H.stride-1;
  }
}
/* chain changes, PhET's way: the element swapped out is reset (its control to
   zero, the cyclist refed when he comes back); whatever its stores held goes to
   the room as heat, logged, so the ledger still closes */
function sysDump(S,E){ if(E!==0){ S.sink.room+=E; S.swap+=E; } }
function sysSelect(S,st,which,id){
  if(which==='src'){
    if(S.src===id) return false;
    if(S.src==='faucet'){ sysDump(S,S.fall.reduce((a,b)=>a+b,0)); S.fall.fill(0); st.flow=0; }
    if(S.src==='teapot'){ sysDump(S,S.kettle); S.kettle=0; st.heat=0; }
    if(S.src==='sun') st.clouds=0;
    if(S.src==='biker'){ st.pedal=0; S.omega=0; }
    if(S.conv==='generator'){ sysDump(S,S.wheel); S.wheel=0; }
    S.src=id; st.src=id;
    if(id==='biker'&&S.food<FOOD0){ S.inp.fed+=FOOD0-S.food; S.food=FOOD0; }
  } else if(which==='conv'){
    if(S.conv===id) return false;
    if(S.conv==='generator'){ sysDump(S,S.wheel); S.wheel=0; S.wOmega=0; }
    S.conv=id; st.conv=id;
  } else {
    if(S.user===id) return false;
    if(S.user==='heater'){ sysDump(S,S.water-S.water0); S.water=S.water0; S.hp=0; }
    if(S.user==='fan') S.fan=0;
    S.user=id; st.user=id; S.lit=0;
  }
  S.flights=S.flights.filter(f=>chainHas(S,f.ch));
  return true;
}
function sysFeed(S){ if(S.food>=FOOD0) return false; S.inp.fed+=FOOD0-S.food; S.food=FOOD0; return true; }
function foodChunks(S){ return Math.ceil(S.food/EPC-1e-9); }
function chainHas(S,ch){
  const p=ch[0];
  if(p==='b') return S.src==='biker'; if(p==='f') return S.src==='faucet'; if(p==='s') return S.src==='sun'; if(p==='t') return S.src==='teapot';
  if(p==='g') return S.conv==='generator'; if(p==='p') return S.conv==='panel'; if(p==='x') return true;
  if(p==='h') return S.user==='heater'; if(p==='l') return S.user==='incandescent'||S.user==='fluorescent'; if(p==='n') return S.user==='fan';
  return false;
}

/* ---- the layout (world metres, y up), after PhET's: the source at
   (-0.15, 0), the converter at (-0.025, 0), the user at (0.09, 0) ---- */
const SX=-0.15, CX=-0.025, UX=0.09, FLOOR=-0.045;
const GW={x:CX,y:0.03}, GW_R=GEN_R, GW_PAD=0.058;           /* the generator's wheel (PhET's 0.039 m) and its paddles */
const RW={x:SX+0.035,y:-0.01}, RW_R=0.021;                   /* the cyclist's rear wheel (PhET's offset) */
const SPOUT={x:SX+0.069,y:0.105};                            /* the faucet's water leaves here (PhET's) */
const SUN={x:SX-0.05,y:0.12}, SUN_R=0.02;
const CLOUDS=[[SX-0.01,0.08],[SX+0.017,0.0875],[SX+0.02,0.105]], CLOUD_RX=0.0175, CLOUD_RY=0.035*0.55/2;
const KETTLE={x:SX,y:0.02}, KSPOUT={x:SX+0.05,y:0.045};
const WIRE0={x:CX+0.057,y:-0.041}, WIRE1={x:UX-0.04,y:-0.041};
const PANEL=[[CX-0.075,0.0],[CX+0.075,0.07]];
function cloudStrength(c,i){ return clamp(c*3-i,0,1); }
function pathLen(p){ let L=0; for(let i=1;i<p.length;i++) L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]); return L; }
function pathAt(p,s){
  for(let i=1;i<p.length;i++){
    const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
    if(s<=d||i===p.length-1){ const u=d>0?clamp(s/d,0,1):1; return [p[i-1][0]+(p[i][0]-p[i-1][0])*u, p[i-1][1]+(p[i][1]-p[i-1][1])*u]; }
    s-=d;
  }
  return p[p.length-1].slice();
}
/* each channel's path; `k` spreads a channel's chunks (deterministic) */
function chunkPath(S,ch,k){
  const j=((k*0.6180339887)%1)-0.5;
  const userIn=[[WIRE0.x,WIRE0.y],[WIRE1.x,WIRE1.y],[UX-0.02,-0.041],[UX-0.001,-0.027],[UX,0.0]];
  switch(ch){
    case 'b.chem': return [[SX+0.012+0.008*j,0.058],[SX+0.006,0.035],[SX+0.0058,-0.006]];
    case 'b.mech': return [[SX+0.0058,-0.006],[RW.x,RW.y],[RW.x,RW.y+RW_R],[GW.x,GW.y+GW_R],[GW.x,GW.y]];
    case 'b.heat': return S.conv==='generator'?[[SX+0.014,0.06],[SX+0.03+0.03*j,0.2]]:[[RW.x,RW.y],[RW.x+0.03*j,0.2]];
    case 'f.water': return S.conv==='generator'?[[SPOUT.x+0.004*j,SPOUT.y],[SPOUT.x+0.004*j,GW.y+0.012],[GW.x,GW.y]]:[[SPOUT.x+0.004*j,SPOUT.y],[SPOUT.x+0.004*j,FLOOR]];
    case 's.light': { const z=convTakes(S.conv,'sun')?[CX-0.03+0.06*j,0.03+0.028*j]:[CX+0.04*j,FLOOR], a=Math.atan2(z[1]-SUN.y,z[0]-SUN.x);
      return [[SUN.x+SUN_R*Math.cos(a),SUN.y+SUN_R*Math.sin(a)],z]; }
    case 's.refl': { const c=CLOUDS[Math.abs(Math.round(j*4))%3], a=Math.atan2(c[1]-SUN.y,c[0]-SUN.x);
      return [[SUN.x+SUN_R*Math.cos(a),SUN.y+SUN_R*Math.sin(a)],[c[0],c[1]],[c[0]-0.06+0.02*j,0.21]]; }
    case 't.flame': return [[SX+0.02*j,-0.03],[SX+0.02*j,0.012]];
    case 't.loss': return [[SX-0.02,0.03],[SX-0.07+0.03*j,0.2]];
    case 't.steam': return S.conv==='generator'?[[KSPOUT.x,KSPOUT.y],[GW.x-0.035,GW.y+0.045],[GW.x,GW.y]]:[[KSPOUT.x,KSPOUT.y],[KSPOUT.x+0.08,KSPOUT.y+0.095]];
    case 'g.elec': return [[GW.x,GW.y],[CX+0.011,-0.02],[CX+0.03,-0.0405],[WIRE0.x,WIRE0.y]].concat(userIn.slice(1));
    case 'g.heat': return [[GW.x,GW.y],[GW.x+0.04*j,0.2]];
    case 'p.elec': return [[CX+0.03*j,0.035+0.02*j],[CX+0.015,0.0065],[CX+0.015,-0.025],[CX+0.03,-0.0385],[WIRE0.x,WIRE0.y]].concat(userIn.slice(1));
    case 'p.heat': return [[CX+0.03*j,0.035+0.02*j],[CX+0.05*j,0.2]];
    case 'x.miss': return [[CX-0.05+0.03*j,-0.02],[CX-0.05+0.03*j,FLOOR]];
    case 'h.coil': return [[UX+0.03*j,0.004],[UX+0.03*j,0.045]];
    case 'h.loss': return [[UX+0.03*j,0.0],[UX+0.05+0.01*j,0.02],[UX+0.065,0.19]];
    case 'h.water': return [[UX+0.03*j,0.057],[UX+0.03*j,0.2]];
    case 'l.light': case 'l.heat': { const a=Math.PI/3+(Math.PI/3)*(j+0.5); return [[UX,0.066],[UX+0.13*Math.cos(a),0.066+0.13*Math.sin(a)]]; }
    case 'n.wind': return [[UX-0.0265,0.045],[UX+0.02,0.045+0.01*j],[UX+0.07,0.045+0.02*j]];
    case 'n.heat': return [[UX-0.0265,0.019],[UX-0.05,0.19]];
  }
  return [[0,0],[0,0.2]];
}
/* 'x.miss' is counted but not drawn: the source's own chunks already carry
   that energy on past a converter that cannot use it */
function sysSpawn(S,ch){
  if(ch==='x.miss') return;
  const k=S.count[ch], form=CH_FORM[ch];
  const path=chunkPath(S,ch,k);
  S.flights.push({ch,form,path,s:0,len:pathLen(path)});
  if(S.flights.length>400) S.flights.shift();
}
function sysMoveFlights(S,dt){
  for(const f of S.flights) f.s+=CHUNK_V*dt;
  S.flights=S.flights.filter(f=>f.s<f.len);
}

/* ================================================================== *
 *  equilibrium: one pair of bodies in contact, PhET's stepped model   *
 *  against the exact solution of the linear pair-and-room system      *
 * ================================================================== */
/* body 1 is always a block, started hot; body 2 is its partner */
const EQ_PAIRS=[{id:'iron-water',name:'iron in water',b1:0,b2:2,how:'in'},{id:'brick-water',name:'brick in water',b1:1,b2:2,how:'in'},
                {id:'iron-oil',name:'iron in oil',b1:0,b2:3,how:'in'},{id:'brick-iron',name:'brick on iron',b1:0,b2:1,how:'on'},
                {id:'water-iron',name:'water on iron',b1:0,b2:2,how:'under'}];
const EQ_MATS=[{id:'phet',name:'PhET’s materials'},{id:'real',name:'real materials'}];
function eqPair(id){ return EQ_PAIRS.find(p=>p.id===id); }
/* the two bodies, placed as the bench would place them: a block 1 mm inside a
   beaker, a block on a block, a beaker on a block (all on the ground) */
function eqBodies(pairId,T1,T2,mats){
  const P=eqPair(pairId), M=mats==='real'?MAT_REAL:MAT_PHET;
  const a=makeBody(P.b1,M), b=makeBody(P.b2,M);
  a.x=SPOTS[4]; b.x=SPOTS[4];            /* the water beaker's home spot, as in derive.py */
  if(P.how==='in'){ b.y=0; a.y=0.001; }

/* PhET's step on just these two: displacement, the pair (block first), then
   the room for whichever is not immersed */
function eqStepOnce(bodies,air){
  const [a,b]=bodies;
  if(b.kind==='beaker'){
    const fx0=b.x-b.w/2, fx1=fx0+b.w, fy0=b.y, fy1=fy0+b.h*b.f, bb=bodyBounds(a);
    const ix0=Math.max(bb.x0,fx0), ix1=Math.min(bb.x1,fx1), iy0=Math.max(bb.y0,fy0), iy1=Math.min(bb.y1,fy1);
    const area=(ix1-ix0>=0&&iy1-iy0>=0)?(ix1-ix0)*(iy1-iy0):0;
    b.f=Math.min(FLUID0+DISPLACE*area,1);
  }
  exchange(a,b,DT);
  let room=0;
  if(air) for(const x of bodies) if(!isImmersed(bodies,x)) room+=airExchange(x,DT);
  return room;
}
/* the linear system C T' = -K T + a T_air, its conductances read off the geometry
   AFTER the displacement has settled (the stepped run settles it in one step) */
function eqLinear(pairId,T1,T2,mats,air){
  const bodies=eqBodies(pairId,T1,T2,mats);
  const [a,b]=bodies;
  /* a block 1 mm up in a half-full beaker is wholly under: one update gives 0.5 + 120 x 0.045^2 */
  if(b.kind==='beaker'&&eqPair(pairId).how==='in') b.f=Math.min(FLUID0+DISPLACE*BLOCK*BLOCK,1);
  const G=K_BODY*contactLen(bodyArea(a),bodyArea(b));
  const imm=isImmersed(bodies,a);
  const a1=air&&!imm?K_AIR*contactLen(AIR_AREA,bodyArea(a)):0, a2=air?K_AIR*contactLen(AIR_AREA,bodyArea(b)):0;
  const C1=a.m*a.c, C2=b.m*b.c;
  const M=[[-(G+a1)/C1,G/C1],[G/C2,-(G+a2)/C2]];
  const Teq=(C1*T1+C2*T2)/(C1+C2);
  const Tss=(a1+a2)>0?[T_AIR,T_AIR]:[Teq,Teq];
  /* the conserved mean with the room shut out: T_eq = (C1 T1 + C2 T2)/(C1 + C2) */
  return {G,a1,a2,C1,C2,M,Teq,Tss,T0:[T1,T2],tau:1/(G*(1/C1+1/C2)),cap1:bodyCap(a),cap2:bodyCap(b),imm};
}
/* exp(Mt) for a 2x2 matrix with real eigenvalues (M = C^-1 K, K symmetric):
   e^{st}[cosh(qt) I + sinh(qt)/q (M - sI)], s = tr/2, q = sqrt(s^2 - det) */
function expm2(M,t){
  const s=(M[0][0]+M[1][1])/2, det=M[0][0]*M[1][1]-M[0][1]*M[1][0], q2=s*s-det;
  const q=Math.sqrt(Math.max(q2,0)), e=Math.exp(s*t), ch=Math.cosh(q*t);
  const sh=q>1e-300?Math.sinh(q*t)/q:t;
  return [[e*(ch+sh*(M[0][0]-s)),e*sh*M[0][1]],[e*sh*M[1][0],e*(ch+sh*(M[1][1]-s))]];
}
function eqEigen(M){
  const s=(M[0][0]+M[1][1])/2, det=M[0][0]*M[1][1]-M[0][1]*M[1][0], q=Math.sqrt(Math.max(s*s-det,0));
  return [s+q,s-q];
}
function eqExact(L,t){
  const E=expm2(L.M,t), u0=[L.T0[0]-L.Tss[0],L.T0[1]-L.Tss[1]];
  return [L.Tss[0]+E[0][0]*u0[0]+E[0][1]*u0[1], L.Tss[1]+E[1][0]*u0[0]+E[1][1]*u0[1]];
}
/* the whole run the view draws: n steps of PhET's model, and the exact
   solution at the same instants, up to the first cap (past it the linear
   solution no longer applies: a beaker boils, a block reaches 620 K) */
function eqRun(pairId,T1,T2,mats,air,tWin){
  const L=eqLinear(pairId,T1,T2,mats,air), bodies=eqBodies(pairId,T1,T2,mats);
  const n=Math.max(2,Math.round(tWin/DT));
  const t=[0], s1=[bodyT(bodies[0])], s2=[bodyT(bodies[1])], x1=[T1], x2=[T2];
  let tCap=null, room=0, E0=bodies[0].E+bodies[1].E;
  for(let k=1;k<=n;k++){
    room+=eqStepOnce(bodies,air);
    t.push(k*DT); s1.push(bodyT(bodies[0])); s2.push(bodyT(bodies[1]));
    const ex=eqExact(L,k*DT); x1.push(ex[0]); x2.push(ex[1]);
    if(tCap===null&&(bodyTraw(bodies[0])>=L.cap1-1e-9||bodyTraw(bodies[1])>=L.cap2-1e-9||bodyBeyond(bodies[0])>0||bodyBeyond(bodies[1])>0)) tCap=k*DT;
  }
  const E1=bodies[0].E+bodies[1].E;
  return {L,t,s1,s2,x1,x2,tCap,resid:E1-E0+room,room,bodies};
}
function eqWindow(L){ const ev=eqEigen(L.M), fast=-1/ev[1]; return Math.min(Math.max(8*fast,4),60); }

function buildModel(){
  const st=Object.assign({},ST), view=st.view, M={view,st};
  if(view==='bench'||view==='ledger'){
    const B=BENCH, lev=burnerLevels(st);
    M.B=B; M.lev=lev; M.t=B.t;
    M.T=B.bodies.map(bodyT); M.E=B.bodies.map(b=>b.E); M.own=B.own.slice(); M.g=B.bodies.map(b=>gChunks(b.E));
    M.dE=B.bodies.reduce((s,b,i)=>s+b.E-B.E0[i],0);
    M.resid=M.dE+B.room-B.work;
    M.onBurner=[0,1].map(k=>B.bodies.findIndex(b=>burnerContact(k,b)));
    /* nominal: 5000 x level W into a body on the burner (PhET stops cooling at 0 C), 1500 x level W into the room */
    M.power=[0,1].map(k=>M.onBurner[k]>=0?P_BURN*lev[k]:P_BURN_AIR*lev[k]);
    M.imm=B.bodies.map(b=>isImmersed(B.bodies,b));
    M.idDrift=[0,1,2,3].map(i=>benchIdentity(B,i)-benchIdentity0(B,i));
    M.therm=B.therm.map(th=>{ const p=thermoTip(B,th); return th.tray?null:Object.assign({x:p.x,y:p.y},thermoSense(B,p.x,p.y,lev)); });
  }
  if(view==='sys'||view==='flow'){
    const S=SYS;
    M.S=S; M.F=S.flows; M.bal=sysBalance(S); M.closure=sysClosure(S); M.t=S.t;
    M.waterT=Math.min(S.water/HB_C,T_BOIL.water); M.food=foodChunks(S);
    M.takes=convTakes(S.conv,S.src);
  }
  if(view==='eq'){
    const L=eqLinear(st.eqPair,st.eqT1,st.eqT2,st.eqMat,st.eqAir);
    M.win=eqWindow(L);
    M.R=memo('eqrun',[st.eqPair,st.eqT1,st.eqT2,st.eqMat,st.eqAir].join('|'),()=>eqRun(st.eqPair,st.eqT1,st.eqT2,st.eqMat,st.eqAir,M.win));
    M.L=M.R.L; M.ev=eqEigen(M.L.M);

    for(let k=0;k<n;k++){ if(M.R.tCap!==null&&M.R.t[k]>=M.R.tCap) break; dmax=Math.max(dmax,Math.abs(M.R.s1[k]-M.R.x1[k]),Math.abs(M.R.s2[k]-M.R.x2[k])); }

}

function worldFitUp(b,ext,pad){

function seg(ctx,map,a,b,col,lw,dash){

  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }

}
function dot(ctx,x,y,r,fill,stroke,lw){

}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));

}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);

/* ================================================================== *
 *  drawing: shared pieces, and the bench view                         *
 * ================================================================== */
/* the house #hint (HTML, bottom:11px, 11px type) sits on the last line of a
   bottom-anchored caption unless the caption ends HINT_H higher (the
   wave-on-a-string trap): every caption here does, and selfTest asserts it */
const HINT_H=18;
/* an energy chunk: a small square in its form's colour with an E drawn in
   strokes (text ops would flood the overlap audit) */
function drawChunk(ctx,x,y,s,form,alpha){
  const a=alpha===undefined?1:clamp(alpha,0,1); if(a<=0.02) return;
  const c=COL.form[form]||COL.form.thermal, h=s/2, k=s*0.22;
  ctx.beginPath();
  ctx.moveTo(x-h+k,y-h); ctx.lineTo(x+h-k,y-h); ctx.lineTo(x+h,y-h+k); ctx.lineTo(x+h,y+h-k);
  ctx.lineTo(x+h-k,y+h); ctx.lineTo(x-h+k,y+h); ctx.lineTo(x-h,y+h-k); ctx.lineTo(x-h,y-h+k); ctx.closePath();
  ctx.fillStyle=a<1?rgba(c,a):c; ctx.fill();
  ctx.beginPath();
  const ex=x-s*0.17, ew=s*0.36, ey=s*0.27;
  ctx.moveTo(ex+ew,y-ey); ctx.lineTo(ex,y-ey); ctx.lineTo(ex,y+ey); ctx.lineTo(ex+ew,y+ey);
  ctx.moveTo(ex,y); ctx.lineTo(ex+ew*0.8,y);
  ctx.strokeStyle=rgba('#0a0c12',0.8*a); ctx.lineWidth=Math.max(1,s*0.13); ctx.stroke();
}
/* time-axis tick labels with as many decimals as the spacing needs
   (Known-bad: a fixed fmt(t,2) prints "5.00" and crowds the axis) */
function tickFmt(lo,hi,want){
  const t=ticksFor(Math.min(lo,hi),Math.max(lo,hi),want||6), step=t.length>1?t[1]-t[0]:Math.abs(hi-lo)||1;
  const d=Math.max(0,Math.min(3,-Math.floor(Math.log10(step)+1e-9)));
  return v=>fmt(v,d);
}

/* ---- the bench's geometry: the world fitted left of the readout ---- */
const BENCH_CAP_FULL='Drawn to scale: the blocks are 4.5-cm cubes (their depth drawn obliquely, as PhET draws it), the beakers 8.5 cm across, the burners 7.5 cm. '
  +'Each red square is one energy chunk, 5019 J of thermal energy, drawn 1 cm across (not to scale); a body holds the count PhET’s map gives its energy, give or take one in transit. '
  +'Drag a body to stack it, set it on a burner or drop it in a beaker; drag a lever, or a thermometer out of the tray.';
const BENCH_CAP_SHORT='To scale except the energy chunks (5019 J each, drawn 1 cm across). Drag the bodies, the levers and the thermometers.';
const BENCH_EXT={xmin:-0.305,xmax:0.31,ymin:-0.02,ymax:0.29};
function benchGeo(ctx,W,H){
  const narrow=isNarrow(W), left=16, right=narrow?W-14:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left-20));
  const fit=fitCaption(ctx,W,H-HINT_H,BENCH_CAP_FULL,BENCH_CAP_SHORT,capW,stageTop()+30+240);
  const top=stageTop()+14, bottom=fit.capY-10;
  const bx=box(left,top,right-left,Math.max(120,bottom-top));
  const map=worldFitUp(bx,BENCH_EXT,0.004);

}
/* every box is drawn with its front face on the model's rectangle and its
   depth running up and to the right (PhET centres its cubes on the
   rectangle; the beakers here are drawn flat, so the front must sit on it) */
const DEPTH=2*PERSP;
function drawBox3(ctx,map,x0,y0,x1,y1,front,edge,lw){
  const d=DEPTH;
  worldPoly(ctx,map,[[x0,y1],[x1,y1],[x1+d,y1+d],[x0+d,y1+d]],mix(front,'#ffffff',0.2),null);
  worldPoly(ctx,map,[[x1,y0],[x1+d,y0+d],[x1+d,y1+d],[x1,y1]],mix(front,'#05070c',0.35),null);
  worldPoly(ctx,map,[[x0,y0],[x1,y0],[x1,y1],[x0,y1]],front,null);
  worldPoly(ctx,map,[[x0,y0],[x1,y0],[x1+d,y0+d],[x1+d,y1+d],[x0+d,y1+d],[x0,y1]],null,edge,lw);
}
/* the burner lever: a track on the burner's front, below the flames, the
   knob at the level (the pointer inverts leverPos through the same pair) */
const LEVER_Y0=0.03, LEVER_DY=0.02;
function leverPos(k,l){ return {x:burnerX(k), y:LEVER_Y0+LEVER_DY*l}; }
function leverLevel(y){ return clamp((y-LEVER_Y0)/LEVER_DY,-1,1); }
function drawBurner(ctx,map,k,l,M){
  const x=burnerX(k), x0=x-BURNER_HALF, x1=x+BURNER_HALF;
  drawBox3(ctx,map,x0,0,x1,BURNER_TOP,'#121824',rgba(COL.struct,0.55),1.2);
  /* flame (heat) or ice (cool), sized by the level, inside the burner's mouth */
  if(l>0){
    for(let q=-1;q<=1;q++){ const cx=x+q*0.017, hh=0.006+0.012*l*(q===0?1:0.75), b0=BURNER_TOP-0.02;
      worldPoly(ctx,map,[[cx-0.008,b0],[cx+0.008,b0],[cx+0.003,b0+hh*0.6],[cx,b0+hh],[cx-0.003,b0+hh*0.6]],rgba('#ff8a2a',0.35+0.6*l),rgba('#ffd27a',0.9),1); }
  } else if(l<0){
    for(let q=-1;q<=1;q++){ const cx=x+q*0.018, s=0.004+0.004*(-l), b0=BURNER_TOP-0.021;
      worldPoly(ctx,map,[[cx-s,b0],[cx+s,b0],[cx+s,b0+2*s],[cx-s,b0+2*s]],rgba('#9fd8ff',0.35+0.5*(-l)),rgba('#dff3ff',0.9),1); }
  }
  const t0=leverPos(k,-1), t1=leverPos(k,1), kn=leverPos(k,l);
  seg(ctx,map,[t0.x,t0.y],[t1.x,t1.y],rgba(COL.struct,0.6),2);
  const X=map.X(kn.x), Y=map.Y(kn.y);
  ctx.beginPath(); ctx.rect(X-9,Y-4,18,8);
  ctx.fillStyle=l>0?'#ff8a2a':(l<0?'#7cc8ff':'#6f7789'); ctx.fill();
  ctx.strokeStyle=M&&M.dragLever===k?COL.live:'#e9edf5'; ctx.lineWidth=M&&M.dragLever===k?2:1; ctx.stroke();
}
function drawBlock(ctx,map,b,held){
  drawBox3(ctx,map,b.x-b.w/2,b.y,b.x+b.w/2,b.y+b.h,COL.body[b.mat],held?COL.live:rgba('#e9edf5',0.55),held?2:1);
}
function beakerTicks(ctx,map,b){
  const x=b.x-b.w/2+0.004;
  for(let q=1;q<=3;q++){ const y=b.y+q*b.h*0.95/3; seg(ctx,map,[x,y],[x+0.009,y],rgba('#cfd4de',0.45),1); }
}
function drawBeakerBack(ctx,map,b){
  const x0=b.x-b.w/2, x1=b.x+b.w/2, y0=b.y, y1=b.y+b.h, yf=b.y+b.h*b.f;
  worldPoly(ctx,map,[[x0,y0],[x1,y0],[x1,y1],[x0,y1]],rgba('#1a2130',0.55),null);
  worldPoly(ctx,map,[[x0,y0],[x1,y0],[x1,yf],[x0,yf]],mix('#0a0c12',COL.body[b.mat],0.55),null);
}
function drawBeakerFront(ctx,map,b,held){
  const x0=b.x-b.w/2, x1=b.x+b.w/2, y0=b.y, y1=b.y+b.h, yf=b.y+b.h*b.f, c=COL.body[b.mat];
  worldPoly(ctx,map,[[x0,y0],[x1,y0],[x1,yf],[x0,yf]],rgba(c,0.16),null);
  seg(ctx,map,[x0,yf],[x1,yf],rgba(c,0.95),1.4);
  ctx.beginPath(); ctx.moveTo(map.X(x0),map.Y(y1)); ctx.lineTo(map.X(x0),map.Y(y0)); ctx.lineTo(map.X(x1),map.Y(y0)); ctx.lineTo(map.X(x1),map.Y(y1));
  ctx.strokeStyle=held?COL.live:rgba('#e9edf5',0.8); ctx.lineWidth=held?2.2:1.5; ctx.stroke();
  POLY_SEGS.push(map.X(x0),map.Y(y1),map.X(x0),map.Y(y0),map.X(x1),map.Y(y0),map.X(x1),map.Y(y1));
  beakerTicks(ctx,map,b);
  /* steam over a beaker within 10 K of boiling (PhET's steamingProportion) */
  const sp=steamProp(b);
  if(sp>0) for(let q=0;q<7;q++){ const f=(q+0.5)/7, cx=x0+b.w*(0.25+0.5*((q*0.618)%1)), cy=yf+(y1+0.035-yf)*f, r=0.005+0.004*f;
    worldPoly(ctx,map,ellipsePts(cx,cy,r,r*0.6,12),rgba('#e9edf5',(0.5-0.3*f)*sp+0.06),null); }
}
/* where a body's k-th owned chunk sits: a jittered grid on a block's front
   face, or in a beaker's liquid */
function chunkSlot(b,k){
  const beaker=b.kind==='beaker', m=beaker?0.008:0.006;
  const x0=b.x-b.w/2+m, x1=b.x+b.w/2-m, y0=b.y+0.006, y1=(beaker?b.y+b.h*b.f:b.y+b.h)-0.006;
  const cols=beaker?8:4, col=k%cols, row=Math.floor(k/cols), rows=Math.max(1,Math.ceil((beaker?48:28)/cols));
  const jx=((k*0.61803)%1-0.5)*0.35, jy=((k*0.41421)%1-0.5)*0.35;
  return [x0+(x1-x0)*(col+0.5+jx)/cols, y0+(y1-y0)*((row%rows)+0.5+jy)/rows];
}
function inboundOf(B){ const n=[0,0,0,0]; for(const f of B.flights) if(isBodyRef(f.dst)) n[f.dst]++; return n; }
function drawOwnChunks(ctx,map,B,i,sz,inbound){
  const b=B.bodies[i], settled=Math.max(0,B.own[i]-inbound[i]);
  for(let k=0;k<settled;k++){ const p=chunkSlot(b,k); drawChunk(ctx,map.X(p[0]),map.Y(p[1]),sz,'thermal',1); }
}
function drawFlights(ctx,map,B,sz,inbound){
  const seen=[0,0,0,0];
  for(const f of B.flights){
    const u=smoothstep(clamp(f.t/f.dur,0,1)), anchor=f.air;
    let a, z, alpha=1;
    if(isBodyRef(f.src)) a=chunkSlot(B.bodies[f.src],Math.max(0,B.own[f.src]));
    else if(f.src==='A'){ const b=B.bodies[anchor]; a=[b.x,b.y+b.h+0.09]; }
    else a=[burnerX(+f.src[1]),BURNER_TOP-0.012];
    if(isBodyRef(f.dst)){ const own=B.own[f.dst]-inbound[f.dst]+seen[f.dst]; seen[f.dst]++; z=chunkSlot(B.bodies[f.dst],Math.max(0,own)); }
    else if(f.dst==='A'){ const b=B.bodies[anchor]; z=[b.x+0.01,b.y+b.h+0.1]; alpha=1-u*0.9; }
    else z=[burnerX(+f.dst[1]),BURNER_TOP-0.012];
    if(f.src==='A') alpha=0.1+0.9*u;
    drawChunk(ctx,map.X(a[0]+(z[0]-a[0])*u),map.Y(a[1]+(z[1]-a[1])*u),sz,'thermal',alpha);
  }
}
function drawThermo(ctx,W,H,map,B,k,M,live){
  const th=B.therm[k], p=thermoTip(B,th);
  const X=map.X(p.x), Y=map.Y(p.y), hpx=THERMO_H*map.s, w=Math.max(5,0.0055*map.s);
  const r=M&&!th.tray?M.therm[k]:null, T=r?r.T:T_ROOM;
  ctx.beginPath(); ctx.rect(X-w/2,Y-hpx,w,hpx-w*0.6); ctx.fillStyle='#e9edf5'; ctx.fill();
  ctx.strokeStyle=live?COL.live:'#aeb6c6'; ctx.lineWidth=live?2:1; ctx.stroke();
  const frac=r?clamp((T-T_FREEZE)/(700-T_FREEZE),0,1):0.05, hcol=(hpx-w*1.4)*frac;
  ctx.beginPath(); ctx.rect(X-w/4,Y-w*0.8-hcol,w/2,hcol); ctx.fillStyle='#e0453a'; ctx.fill();
  dot(ctx,X,Y-w*0.3,w*0.75,'#e0453a',live?COL.live:'#aeb6c6',1);
  if(r){
    const what=typeof r.what==='number'?COL.body[B.bodies[r.what].mat]:(r.what==='air'?'#5a6275':'#e9edf5');
    ctx.beginPath(); ctx.moveTo(X+w*0.6,Y-w*0.3); ctx.lineTo(X+w*0.6+7,Y-w*0.3-5); ctx.lineTo(X+w*0.6+7,Y-w*0.3+5); ctx.closePath(); ctx.fillStyle=what; ctx.fill();
    lab(ctx,W,H,X+w+10,Y-hpx+6,'#'+(k+1)+' '+fmt(kelvinC(T),1)+' °C','#e9edf5',SM_FONT,'left','middle');
  }
}
function drawBench(ctx,W,H,M){
  LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[];
  const G=benchGeo(ctx,W,H), map=G.map, B=M.B;
  reserveCaption(G.left+4,G.capY,G.capTxt,G.capW,ctx);
  /* the bench top and PhET's six spots */
  const gx0=BENCH_EXT.xmin+0.004, gx1=BENCH_EXT.xmax-0.004;
  worldPoly(ctx,map,[[gx0,-0.012],[gx1,-0.012],[gx1,0],[gx0,0]],'#10151f',null);
  seg(ctx,map,[gx0,0],[gx1,0],rgba(COL.struct,0.55),1.2);
  SPOTS.forEach((x,k)=>{ if(k===2||k===3) return; seg(ctx,map,[x-0.02,-0.004],[x+0.02,-0.004],rgba(COL.struct,0.35),1); });
  worldPoly(ctx,map,[[TRAY.x0,TRAY.y0],[TRAY.x1,TRAY.y0],[TRAY.x1,TRAY.y1],[TRAY.x0,TRAY.y1]],'#0d121c',rgba(COL.struct,0.5),1);
  lab(ctx,W,H,map.X(TRAY.x1)+8,map.Y(TRAY.y1)+8,'thermometers','#8b93a6',SM_FONT,'left','middle');
  for(let k=0;k<2;k++) drawBurner(ctx,map,k,M.lev[k],M);
  /* painter's order, back to front: each beaker's liquid and its chunks, the
     blocks and theirs (in front of a liquid they sit in), then the beakers'
     translucent fronts and glass */
  const held=B.held?B.held.group[0]:-1, sz=clamp(0.0095*map.s,7,13), sym=M.st.symBench, inb=inboundOf(B);
  for(const i of [2,3]){ drawBeakerBack(ctx,map,B.bodies[i]); if(sym) drawOwnChunks(ctx,map,B,i,sz*0.9,inb); }
  const blocks=[0,1].sort((a,b)=>B.bodies[a].y-B.bodies[b].y);
  for(const i of blocks){ drawBlock(ctx,map,B.bodies[i],held===i); if(sym) drawOwnChunks(ctx,map,B,i,sz,inb); }
  for(const i of [2,3]) drawBeakerFront(ctx,map,B.bodies[i],held===i);
  if(sym) drawFlights(ctx,map,B,sz,inb);
  /* labels: each block on its top face, each beaker over its glass */
  for(const i of [0,1]){ const b=B.bodies[i]; lab(ctx,W,H,map.X(b.x+PERSP),map.Y(b.y+b.h+PERSP),MAT_NAME[b.mat],'#e9edf5',SM_FONT,'center','middle'); }
  for(const i of [2,3]){ const b=B.bodies[i]; lab(ctx,W,H,map.X(b.x),map.Y(b.y+b.h)-9,MAT_NAME[b.mat],rgba(COL.body[b.mat],1),SM_FONT,'center','middle'); }
  for(let k=0;k<2;k++){ const l=M.lev[k]; lab(ctx,W,H,map.X(burnerX(k)),map.Y(-0.012)+10,(k?'right':'left')+': '+levText(l),l>0?'#ffb070':(l<0?'#9fd8ff':'#8b93a6'),SM_FONT,'center','middle'); }
  for(let k=0;k<4;k++) drawThermo(ctx,W,H,map,B,k,M,M.dragThermo===k);
  caption(ctx,G.left+4,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT);
  return G;
}

/* ================================================================== *
 *  drawing: the systems view                                          *
 * ================================================================== */
const SYS_CAP_FULL='PhET’s layout, in metres; the drawings are the remake’s. Energy chunks are the ledger quantised: each channel emits one chunk for every 5019 J that flows along it '
  +'(PhET’s ENERGY_PER_CHUNK), and each moves at PhET’s 4 cm/s, so a chunk you see left its element some seconds ago. Colours give the form.';
const SYS_CAP_SHORT='One chunk per 5019 J on each channel, moving at PhET’s 4 cm/s; colours give the form.';
const SYS_EXT={xmin:-0.275,xmax:0.175,ymin:-0.07,ymax:0.215};
function sysGeo(ctx,W,H){
  const narrow=isNarrow(W), left=16, right=narrow?W-14:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left-20));
  const fit=fitCaption(ctx,W,H-HINT_H,SYS_CAP_FULL,SYS_CAP_SHORT,capW,stageTop()+30+240);
  const legH=24, top=stageTop()+14, bottom=fit.capY-legH-12;
  const bx=box(left,top,right-left,Math.max(120,bottom-top));
  const map=worldFitUp(bx,SYS_EXT,0.004);
  return {narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,bx,map,legY:fit.capY-legH+2};
}
function wline(ctx,map,pts,col,lw){ ctx.beginPath(); pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); }); ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; ctx.stroke(); }
function ellipsePts(cx,cy,rx,ry,n){ const o=[]; for(let k=0;k<n;k++){ const a=TAU*k/n; o.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]); } return o; }
function wheel(ctx,map,c,r,ang,spokes,col){
  worldPoly(ctx,map,ellipsePts(c.x,c.y,r,r,28),null,col,1.6);
  for(let k=0;k<spokes;k++){ const a=ang+TAU*k/spokes; wline(ctx,map,[[c.x,c.y],[c.x+r*Math.cos(a),c.y+r*Math.sin(a)]],rgba(col,0.7),1); }
}
/* the two outer tangents of two circles (the belt) */
function beltLines(c1,r1,c2,r2){
  const dx=c2.x-c1.x, dy=c2.y-c1.y, d=Math.hypot(dx,dy), a=Math.atan2(dy,dx), b=Math.acos((r1-r2)/d);
  const out=[];
  for(const s of [1,-1]){ const t=a+s*b; out.push([[c1.x+r1*Math.cos(t),c1.y+r1*Math.sin(t)],[c2.x+r2*Math.cos(t),c2.y+r2*Math.sin(t)]]); }
  return out;
}
/* a two-link leg: the knee bends forward (-x), toward the front wheel */
function kneeOf(hip,foot,L1,L2){
  const dx=foot[0]-hip[0], dy=foot[1]-hip[1], d=Math.min(Math.hypot(dx,dy),L1+L2-1e-6);
  const a=(L1*L1-L2*L2+d*d)/(2*d), h=Math.sqrt(Math.max(L1*L1-a*a,0)), ux=dx/(Math.hypot(dx,dy)||1), uy=dy/(Math.hypot(dx,dy)||1);
  const mx=hip[0]+a*ux, my=hip[1]+a*uy, k1=[mx-h*uy,my+h*ux], k2=[mx+h*uy,my-h*ux];
  return k1[0]<k2[0]?k1:k2;
}

function drawSysChunks(ctx,map,S){
  const sz=clamp(0.0085*map.s,7,12);
  for(const f of S.flights){
    const p=pathAt(f.path,f.s), u=f.s/f.len;
    const radiate=/heat|refl|light|water|wind|loss|miss/.test(f.ch)&&f.ch!=='f.water';
    const a=radiate?clamp((1-u)*2.2,0,1):1;
    drawChunk(ctx,map.X(p[0]),map.Y(p[1]),sz,f.form,a);
  }
}

function drawSystems(ctx,W,H,M){
  LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[];

  reserveCaption(G.left+4,G.capY,G.capTxt,G.capW,ctx);
  worldPoly(ctx,map,[[SYS_EXT.xmin+0.004,FLOOR-0.012],[SYS_EXT.xmax-0.004,FLOOR-0.012],[SYS_EXT.xmax-0.004,FLOOR],[SYS_EXT.xmin+0.004,FLOOR]],'#10151f',null);
  seg(ctx,map,[SYS_EXT.xmin+0.004,FLOOR],[SYS_EXT.xmax-0.004,FLOOR],rgba(COL.struct,0.55),1.2);
  wline(ctx,map,[[WIRE0.x,WIRE0.y],[WIRE1.x,WIRE1.y],[UX-0.02,-0.041],[UX-0.001,-0.036]],'#cfd4de',1.6);
  if(S.src==='biker') drawBiker(ctx,W,H,map,S,st); else if(S.src==='faucet') drawFaucet(ctx,map,S,st);
  else if(S.src==='sun') drawSun(ctx,map,S,st); else drawTeapot(ctx,map,S,st);
  if(S.conv==='generator'){
    drawGenerator(ctx,map,S);
    if(S.src==='biker') for(const L of beltLines(RW,RW_R,GW,GW_R)) wline(ctx,map,L,'#cfd4de',1.6);
  } else drawPanel(ctx,map,S);
  if(S.user==='heater') drawHeater(ctx,W,H,map,S,st); else if(S.user==='fan') drawFan(ctx,map,S);
  else drawBulb(ctx,map,S,S.user==='fluorescent');
  if(st.symSys) drawSysChunks(ctx,map,S);
  const F=M.F, ly=map.Y(FLOOR-0.012)+11;
  lab(ctx,W,H,map.X(SX),ly,srcName(S.src)+' · '+fmtW(F.srcIn),'#aeb6c6',SM_FONT,'center','middle');
  lab(ctx,W,H,map.X(CX),ly+15,convName(S.conv)+(M.takes?' · '+fmtW(F.cOut)+' out':' · cannot use it'),M.takes?'#aeb6c6':COL.ref,SM_FONT,'center','middle');
  lab(ctx,W,H,map.X(UX),ly,userName(S.user)+' · '+fmtW(F.uIn)+' in','#aeb6c6',SM_FONT,'center','middle');
  if(st.symSys) drawFormLegend(ctx,W,H,G);
  caption(ctx,G.left+4,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT);
  return G;
}

/* stageLayout, falling back to no bottom row when the main panel would be
   squeezed below its 80-px floor (the helper clamps it there and the rows
   then overlap: the 560 x 380 sweep found it) */
/* the caption must describe the panels actually drawn (Known-bad: a narrow
   caption described a panel the narrow layout did not draw): caps carries one
   caption per layout -- full (every panel), two (main + one), solo (main only)
   -- and a short one that names no panel */
function layoutFit(ctx,W,H,caps,nB,frac,nBN){
  const pick=n=>n>=nB?caps.full:(n>0?caps.two:caps.solo);
  let n=isNarrow(W)?nBN:nB;
  let L=stageLayout(ctx,W,H,pick(n),caps.short,n,frac,n);
  const want=L.bottom.length?L.capY-16-(stageTop()+30)-Math.max(90,Math.floor((L.capY-16-(stageTop()+30))*frac))-56:L.main.h;
  if(L.bottom.length&&want<100){
    L=stageLayout(ctx,W,H,pick(0),caps.short,0,frac,0);
    /* with no bottom row the helper runs the panel to 16 px above the caption:
       leave the 34 px its tick labels and axis title hang below it */
    L.main=box(L.main.x,L.main.y,L.main.w,Math.max(60,L.main.h-34));
    L.solo=true;
  }
  reserveCaption(L.left,L.capY,L.capTxt,L.capW,ctx);

function reserveCaption(x,y,txt,w,ctx){ const n=wrapText(ctx,txt,w,CAP_FONT).length; LABELS.push([x,y,x+w,y+n*14]); }
/* a legend only where it fits, and its box registered so later labels avoid it */

  if(r) LABELS.push([r.x,r.y,r.x1,r.y1]);

function rangeOf(arrs,pad){
  let lo=Infinity, hi=-Infinity;
  for(const a of arrs) for(const v of a) if(isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; }
  if(!isFinite(lo)){ lo=0; hi=1; }
  if(hi-lo<1e-9){ const m=Math.max(Math.abs(hi),1)*0.05; lo-=m; hi+=m; }
  const p=(hi-lo)*(pad===undefined?0.08:pad); return [lo-p,hi+p];
}

function flowGeo(ctx,W,H){ return layoutFit(ctx,W,H-HINT_H,FLOW_CAPS,1,0.36,1); }
function band(ctx,x0,y0a,y0b,x1,y1a,y1b,col){
  const N=18; ctx.beginPath();
  for(let k=0;k<=N;k++){ const u=k/N, s=smoothstep(u), x=x0+(x1-x0)*u, y=y0a+(y1a-y0a)*s; if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  for(let k=N;k>=0;k--){ const u=k/N, s=smoothstep(u), x=x0+(x1-x0)*u, y=y0b+(y1b-y0b)*s; ctx.lineTo(x,y); }
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function flowModel(M){

  const uOutForm=S.user==='fan'?'mechanical':(S.user==='heater'?'thermal':'light');
