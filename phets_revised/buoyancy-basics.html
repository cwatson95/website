<title>Buoyancy: Basics &mdash; PhET&rsquo;s two screens, with the upthrust taken from the pressure on the faces</title>
<!--
  ===================================================================
  buoyancy-basics.html — blocks of every material in six fluids, on
  two scales and on the pool floor: PhET's Explore and Compare
  screens, with the buoyant force, the apparent weight and the
  contact force solved from Archimedes' principle and checked
  against the hydrostatic pressure integrated over the faces
  ===================================================================

  Remake of PhET Interactive Simulations' Buoyancy: Basics (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets. The model, its constants and its controls follow PhET's build 1.2.11
  (docs/phets/buoyancy-basics_en.html) and the shared doc/model.md of
  density-buoyancy-common; every number taken from that build is marked
  "PhET's value" in the code and in the panel.

  This is the companion of density.html and runs the SAME engine: the same
  pool, the same free-surface solve, the same Archimedes, the same material
  table. What it adds is what PhET's Buoyancy adds — six fluids instead of
  water alone, a scale on the ground and a scale in the pool, and the three
  forces drawn as arrows.

  Five views.  EXPLORE is PhET's Explore screen: one or two cubes of a chosen
  material in a pool of a chosen fluid, with gravity, buoyancy and contact
  drawn to scale and the block movable onto either scale.  THE SETS is the
  Compare screen: two blocks, a brick and a piece of wood, matched in mass, in
  volume or in density, with the matched quantity on a slider.  THE FACES
  takes the upthrust apart: the hydrostatic pressure on each of the cube's six
  faces, the exact cancellation of the four sides, and the bottom-minus-top
  difference that IS rho_f g V_sub.  THE SCALE lowers a block through the
  surface and draws what a spring scale reads all the way down — the straight
  fall while it is entering, the plateau once it is under, and the contact
  force the moment it lands.  FLOAT OR SINK is every material against every
  fluid at once: the submerged fraction as a grid, with the neutral line
  rho_b = rho_f running through it.

  WHAT IS EXACT HERE
  ------------------
  The same solve as density.html, and the same pins.  The free surface solves
  G(y) = A_pool (y + H) - (every solid below y) = V_fluid by bisection on a
  function proved non-decreasing, with the SMALLEST root taken so that a body
  spanning the pool puts the surplus fluid above itself.  A floating cube's
  submerged fraction is rho_b/rho_f exactly (checked against scipy.brentq on
  the force balance, 1.4e-17); a floating body raises the level by its own
  MASS/(rho_f A_pool) and a sunk one by its own VOLUME/A_pool; the apparent
  weight is W - rho_f g V_sub and the contact force W - rho_f g V_sub, never
  negative (a property of the solve, asserted over 84 configurations, not a
  clamp).  The upthrust is computed twice — Archimedes, and the hydrostatic
  pressure integrated over the six faces and round the polygon cross-section
  edge by edge — and the two agree to 3e-16 relative with the side faces
  cancelling to zero.  The three awkward cases are asserted: denser than the
  fluid, exactly neutral (submerged fraction exactly 1, N = 0, and the net
  force unchanged at every depth), and wider than the pool's free surface.
  Every number is pinned in selfTest to build/buoyancy-basics/refvals.txt, the
  printed output of build/density/derive.py.

  WHAT IS MEASURED, AND WHOSE NUMBER IT IS
  ----------------------------------------
  PhET's six fluids are gasoline 680, oil 920, water 1000, seawater 1029,
  honey 1440 and mercury 13593 kg/m^3, read out of its build; the solid
  densities are PhET's too (styrofoam 150, wood 400, ice 919, PVC 1440, brick
  2000, aluminium 2700, and the rest of the table).  Beside every one is the
  handbook value from Wikipedia's "Densities of various materials" table
  (fetched 2026-09-21), with "no row" said plainly where that table has none.
  Gravity is PhET's 9.8 m/s^2, not the standard 9.80665.  The pool is PhET's
  0.9 x 0.4 x 0.4167 m holding 100 L; its scales are PhET's 0.15 x 0.06 x 0.2 m,
  which displace 1.8 L.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  The fluid is incompressible, at rest and always flat, and responds to a moved
  block instantly (PhET's own statement).  Air buoyancy is ignored — PhET's
  "vacuum assumption" — so a block weighed on the ground scale reads its full
  weight; in real air a 5 L block reads 0.06 N light.  Blocks are cubes, never
  tilt and never rotate ("no rotation or torque is considered in these
  simulations" — PhET's model.md).  A released block goes straight to its
  equilibrium: this file solves the static problem, where PhET integrates
  p2.js with damping.  A block is put on a scale by a control rather than by
  being dragged onto it, and only one block at a time can stand on each scale.
  The pool never overflows, which is true of every configuration its controls
  can reach (two 10 L blocks and the 1.8 L scale in a 150 L pool).

  WHAT IS NOT MODELLED
  --------------------
  Surface tension, viscosity, waves, the meniscus, temperature, the fluids'
  own compressibility, and the boat, bottle, duck, cone and ellipsoid shapes
  and the adjustable gravity of PhET's full Buoyancy sim (Buoyancy: Basics has
  neither; its gravity is Earth's and its shapes are cubes).
-->

'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                 *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);

  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));

            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow

function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });

function wrapText(ctx,txt,maxW,font){

    else line=t;

}

  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);

}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }

function ticksFor(lo,hi,want){

  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);

function logTicks(lo,hi){

  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;

function axes(ctx,b,xlo,xhi,ylo,yhi,opt){

  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);

    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';

    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);

    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);

     onto the canvas before (drum_head.html, Known-bad) */

    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data

let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });

/* pick the first corner of panel b that no already-recorded curve segment

function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

const DEG=PI/180;                 /* multiply DEGREES by this to get radians (asserted: 90 DEG = pi/2) */

/* PhET's Intro/Explore material list (SIMPLE_MASS_MATERIALS + custom) */

/* PhET's Density Mystery density table (DENSITY_MYSTERY_SCREEN_MATERIALS) */

/* ------------------------------------------------------------------ the cube */
function cubeSide(V){ return Math.pow(V,1/3); }        /* PhET's Cube.boundsFromVolume */
/* the volume of a cube of volume V, bottom at yb, lying below yw.  Saturates at
   V EXACTLY, not at s^3: s = V^(1/3) is inexact in binary, and s*s*s misses V
   by an ulp, which shows up as a submerged fraction of 1.0000000000000004. */
function cubeBelow(V,yb,yw){
  const s=cubeSide(V);
  if(yw>=yb+s) return V;
  if(yw<=yb) return 0;
  return s*s*(yw-yb);
}

/* ------------------------------------------------------------- the free surface
   A block is in one of four states at a trial surface yw:
     held   the user holds it, its bottom pinned (never below its support)
     float  rho_b < rho_f AND the floating draft clears its support
     rest   sitting on its support (the pool floor, or the pool scale)
     out    not in the pool at all
   The switch between float and rest is continuous: at the moment the floating
   draft just reaches the support, s^2 d = V rho_b/rho_f, the two agree. */
function blockState(b,yw,rhoF){
  const s=cubeSide(b.V);
  if(b.inPool===false) return {Vsub:0,yb:(b.yb===undefined?0:b.yb),mode:'out',s:s};
  const sup=(b.support===undefined?-POOL_H:b.support);
  if(b.held!==undefined&&b.held!==null){
    const yb=Math.max(b.held,sup);
    return {Vsub:cubeBelow(b.V,yb,yw),yb:yb,mode:'held',s:s};
  }
  if(b.rho<rhoF){
    const d=s*b.rho/rhoF, yb=yw-d;
    if(yb>=sup) return {Vsub:b.V*b.rho/rhoF,yb:yb,mode:'float',s:s};
  }
  return {Vsub:cubeBelow(b.V,sup,yw),yb:sup,mode:'rest',s:s};
}
function obstacleVolume(obs,yw){
  let t=0;
  for(const o of obs) t+=o.a*clamp(yw-o.y0,0,o.h);
  return t;
}
/* G(yw) = (pool volume below yw) - (every solid below yw).  Non-decreasing
   wherever the blocked plan area stays below A_POOL; selfTest sweeps it. */
function netFluid(yw,blocks,obs,rhoF){
  let t=A_POOL*Math.max(0,yw+POOL_H);
  for(const b of blocks) t-=blockState(b,yw,rhoF).Vsub;
  return t-obstacleVolume(obs,yw);
}
/* the SMALLEST yw with G(yw) >= Vf.  The infimum is the physics: a body that
   spans the pool's cross-section makes G flat, and the surface then sits at the
   bottom of the flat stretch with the surplus fluid above the body, not inside
   it.  Bisection keeps the invariant G(lo) < Vf <= G(hi). */
function poolLevel(blocks,obs,rhoF,Vf,nit){
  let sumV=0; for(const b of blocks) sumV+=b.V;
  let lo=-POOL_H, hi=-POOL_H+(Vf+sumV+obstacleVolume(obs,1e9))/A_POOL+1;
  const n=nit||80;
  for(let i=0;i<n;i++){
    const mid=0.5*(lo+hi);
    if(netFluid(mid,blocks,obs,rhoF)<Vf) lo=mid; else hi=mid;
  }
  return 0.5*(lo+hi);

/* the whole configuration: the level, then every block's state and forces */
function solvePool(blocks,rhoF,obs,Vf){
  obs=obs||[]; Vf=(Vf===undefined?VF0:Vf);
  const yw=poolLevel(blocks,obs,rhoF,Vf);
  const out={yw:yw,rhoF:rhoF,blocks:[]};
  for(const b of blocks){
    const st=blockState(b,yw,rhoF), m=b.rho*b.V, W=m*G, Fb=rhoF*G*st.Vsub;
    /* no clamp: a block only ever rests when the upthrust cannot lift it, so
       W - Fb >= 0 is a property of the solve rather than something to enforce.
       A Math.max(0, .) here was provably unreachable — dead code that mutation
       testing correctly reported as an equivalent mutant — and selfTest now
       sweeps the property instead. */
    const N=(st.mode==='rest')?(W-Fb):0;
    const hand=(st.mode==='held')?(W-Fb):0;
    out.blocks.push({V:b.V,rho:b.rho,s:st.s,m:m,Vsub:st.Vsub,yb:st.yb,mode:st.mode,
                     W:W,Fb:Fb,N:N,hand:hand,frac:st.Vsub/b.V,
                     x:(b.x===undefined?0:b.x),tag:b.tag,mat:b.mat,col:b.col});
  }
  return out;
}

/* --------------------------------------------------- Archimedes, closed form */
function floatDraft(V,rho,rhoF){ return cubeSide(V)*rho/rhoF; }    /* d = s rho_b/rho_f */
function submergedFraction(rho,rhoF){ return Math.min(1,rho/rhoF); }
function apparentWeight(V,rho,rhoF,Vsub){ return rho*V*G-rhoF*G*(Vsub===undefined?V:Vsub); }
function riseFloating(m,rhoF){ return m/(rhoF*A_POOL); }           /* its own MASS / (rho_f A) */
function riseSunk(V){ return V/A_POOL; }                           /* its own VOLUME / A */

/* ------------------------------------- the force, from the pressure on the faces
   p = rho g (yw - y), gauge (PhET ignores air buoyancy: the "vacuum
   assumption" of its model.md).  The bottom face pushes up, the top face down,
   and the four side faces cancel in pairs.  Returned per face so a view can
   draw them. */
function cubeFaceForces(V,yb,yw,rhoF){
  const s=cubeSide(V), yt=yb+s, A=s*s;
  const pBot=yb<yw?rhoF*G*(yw-yb):0, pTop=yt<yw?rhoF*G*(yw-yt):0;
  /* one side face: p integrated over the submerged strip, exact (p is linear) */
  const yl=Math.min(yw,yt), dsub=Math.max(0,yl-yb);
  const side=rhoF*G*(yw-0.5*(yb+yl))*s*dsub;
  return {pBot:pBot,pTop:pTop,A:A,Fbot:pBot*A,Ftop:pTop*A,net:(pBot-pTop)*A,
          side:side,sideSum:side-side,dBot:Math.max(0,yw-yb),dTop:Math.max(0,yw-yt)};
}
/* --- the 2-D route: the same force taken edge by edge round the polygon ------
   (the closed forms are build_buoy/p2_physics.js's, reused here) */
function clipBelow(poly,w){
  const out=[], n=poly.length;
  for(let i=0;i<n;i++){
    const a=poly[i], b=poly[(i+1)%n], ain=a[1]<=w, bin=b[1]<=w;
    if(ain) out.push([a[0],a[1]]);
    if(ain!==bin){ const t=(w-a[1])/(b[1]-a[1]); out.push([a[0]+(b[0]-a[0])*t,w]); }
  }
  return out;
}
function polyArea(poly){ let s=0; const n=poly.length;
  for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n]; s+=a[0]*b[1]-b[0]*a[1]; } return 0.5*s; }
function polyCentroid(poly){
  const A=polyArea(poly); if(Math.abs(A)<1e-300) return [0,0];
  let cx=0, cy=0; const n=poly.length;
  for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n], cr=a[0]*b[1]-b[0]*a[1]; cx+=(a[0]+b[0])*cr; cy+=(a[1]+b[1])*cr; }
  return [cx/(6*A),cy/(6*A)];
}
/* p is linear along a straight edge, so the edge force is p(mid) L exactly; the
   outward normal of a CCW edge (dx, dy) is (dy, -dx)/L and the fluid pushes
   inward, F = -p n L.  Per unit depth. */
function edgeForces(sub,w,rhoF){
  const n=sub.length, F=[], tot=[0,0];
  for(let i=0;i<n;i++){
    const a=sub[i], b=sub[(i+1)%n], dx=b[0]-a[0], dy=b[1]-a[1];
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2], p=rhoF*G*(w-mid[1]);
    const fx=-p*dy, fy=p*dx;
    F.push({fx:fx,fy:fy,a:a,b:b,p:p}); tot[0]+=fx; tot[1]+=fy;
  }
  return {F:F,tot:tot};
}
/* the independent route the tests use: subdivide every edge and sum p n ds */
function finePerimeter(poly,w,rhoF,nsub){
  nsub=nsub||2000; const tot=[0,0], n=poly.length;
  for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n], dx=b[0]-a[0], dy=b[1]-a[1];
    for(let k=0;k<nsub;k++){ const t=(k+0.5)/nsub, y=a[1]+dy*t, p=rhoF*G*Math.max(0,w-y);
      tot[0]+=-p*dy/nsub; tot[1]+=p*dx/nsub; } }
  return tot;
}
function cubePoly(V,yb,xc){
  const s=cubeSide(V), x=(xc===undefined?0:xc);
  return [[x-s/2,yb],[x+s/2,yb],[x+s/2,yb+s],[x-s/2,yb+s]];
}

/* ------------------------------------------------------------ PhET's screens */
/* Density, Compare screen (DensityCompareModel): four cubes, and the matched
   quantity on a slider.  Volumes and masses are PhET's own cubesData. */
const DENS_CUBES=[
  {tag:'B',tagV:'A',tagD:'B',mv:0.01,   vm:8,dv:0.006,col:'#d8c14a'},
  {tag:'A',tagV:'C',tagD:'A',mv:0.005,  vm:6,dv:0.004,col:'#4f8fd0'},
  {tag:'C',tagV:'D',tagD:'C',mv:0.0025, vm:4,dv:0.002,col:'#6fbf5a'},
  {tag:'D',tagV:'B',tagD:'D',mv:0.00125,vm:2,dv:0.001,col:'#d05a4f'},
];
const DENS_SAME_MASS=5, DENS_SAME_VOL=0.005, DENS_SAME_RHO=500;
const DENS_MASS_RANGE=[1,10], DENS_VOL_RANGE=[0.001,0.01], DENS_RHO_RANGE=[100,2000];
/* Buoyancy: Basics, Compare screen (BuoyancyCompareModel): two cubes, brick and
   wood, same mass 4 kg, same density 400 = PhET's WOOD */
const BB_CUBES=[
  {tag:'A',tagV:'A',tagD:'A',mv:0.002,vm:10,dv:0.005,col:'#c08a3c'},
  {tag:'B',tagV:'B',tagD:'B',mv:0.01, vm:2, dv:0.01, col:'#4f8fd0'},
];
const BB_SAME_MASS=4, BB_SAME_VOL=0.005, BB_SAME_RHO=400;
const BB_RHO_RANGE=[100,3000];

/* one set of compare blocks at the current slider values */
function compareBlocks(cubes,mode,mass,volM3,rho){
  return cubes.map((c,i)=>{
    if(mode==='mass')   return {tag:c.tag, V:c.mv,  rho:mass/c.mv,        col:c.col,idx:i};
    if(mode==='volume') return {tag:c.tagV,V:volM3, rho:c.vm/volM3,       col:c.col,idx:i};
    return                     {tag:c.tagD,V:c.dv,  rho:rho,              col:c.col,idx:i};
  });
}

/* Density, Mystery screen: PhET's three fixed sets.  'V' rows are built from a
   volume, 'M' rows from a mass; the density is the other factor. */
const MYSTERY_SETS={
  'set 1':[['D','V',0.005, 1000],['B','V',0.001,400],['E','V',0.007,400],
           ['C','V',0.001,19320],['A','V',0.0055,3510]],
  'set 2':[['D','M',18,4500],['A','M',18,11340],['E','V',0.005,8960],
           ['C','M',2.7,2700],['B','M',10.8,2700]],
  'set 3':[['E','M',6,950],['B','M',6,1000],['D','M',2,400],
           ['C','M',23.4,7800],['A','M',2.85,950]],
};
const MYSTERY_COLS={'set 1':['#d05a4f','#4f8fd0','#6fbf5a','#d8c14a','#9b6bd0'],
                    'set 2':['#d489a8','#d88b3c','#a58ed0','#8fc97a','#9a7550'],
                    'set 3':['#e2e6ec','#9aa2b1','#d0b44a','#e0b394','#8d4a4a']};
const MYSTERY_LIST=['set 1','set 2','set 3','shuffled'];
function mysterySet(name,seed){
  if(name==='shuffled') return shuffledMystery(seed);
  const cols=MYSTERY_COLS[name];
  return MYSTERY_SETS[name].map((r,i)=>{
    const V=(r[1]==='V')?r[2]:r[2]/r[3];
    return {tag:r[0],V:V,rho:r[3],m:r[3]*V,col:cols[i],idx:i};
  });
}
/* PhET's RANDOM set draws five of the thirteen table materials and five
   volumes (three from 1-6 L, two from 7-10 L, sorted).  Here the draw comes
   from a seeded generator so that a capture, a test and the browser all see the
   same set for a given seed, and the refresh button simply advances it. */
function lcg(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffleWith(rnd,arr){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffledMystery(seed){
  const rnd=lcg(seed), mats=shuffleWith(rnd,DENSITY_TABLE).slice(0,5);
  const lo=shuffleWith(rnd,[1,2,3,4,5,6]).slice(0,3), hi=shuffleWith(rnd,[7,8,9,10]).slice(0,2);
  const vols=lo.concat(hi).sort((a,b)=>a-b);
  const tags=['A','B','C','D','E'], cols=MYSTERY_COLS['set 1'].concat(MYSTERY_COLS['set 2']);
  return mats.map((mid,i)=>({tag:tags[i],V:vols[i]/LITERS,rho:MAT[mid].phet,
                             m:MAT[mid].phet*vols[i]/LITERS,col:cols[i],idx:i,truth:mid}));
}
/* two decimals, rounded half away from zero, which is what the sim prints */
function disp2(x){ return Math.floor(Math.abs(x)*100+0.5)/100*(x<0?-1:1); }
/* the identification a student can make from the printed numbers alone */
function identify(mDisp,VdispL){
  const rho=mDisp/VdispL*LITERS;
  const d=DENSITY_TABLE.map(k=>({id:k,e:Math.abs(MAT[k].phet-rho)/MAT[k].phet}))
                       .sort((a,b)=>a.e-b.e);
  return {rho:rho,id:d[0].id,err:d[0].e,gap:d[1].e};
}

/* -------------------------------------------- PhET's mass / volume coupling
   Non-custom: the density is fixed, so V = m/rho and the mass slider's enabled
   range is the volume range mapped through rho and clipped to 0.1-27 kg.
   Custom: the two are free and moving either one sets rho = m/V. */
function massRangeFor(rho,custom){
  if(custom) return [MMIN_CUSTOM,MMAX];
  return [clamp(rho*VMIN_L/LITERS,MMIN,MMAX),clamp(rho*VMAX_L/LITERS,MMIN,MMAX)];
}
/* ================================================================== *
 *  state, the per-view model, the readout, the equation bar, the tag  *
 * ================================================================== */
const TABS=[['explore','the pool'],['sets','the sets'],['faces','the faces'],
            ['scale','the scale'],['fluids','float or sink']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', off:'#161c2c', edge:'#242a3a', gold:'#d9b44a',
           fluid:'#163a55', fluid2:'#1e4f73', body:'#4a5060', body2:'#6b7285', air:'#0d1626'};
const RO_W=300;
const HINT_H=18;   /* the house #hint (HTML, bottom:11px) owns the bottom-left corner */

const MAT_LIST=SIMPLE_MATS.map(id=>({id:id,name:MAT[id].name})).concat([{id:'custom',name:'custom'}]);
const FLUID_LIST=BUOY_FLUIDS.map(id=>({id:id,name:MAT[id].name}));
const SET_LIST=[{id:'mass',name:'same mass'},{id:'volume',name:'same volume'},{id:'density',name:'same density'}];
const WHERE_LIST=[{id:'floor',name:'the pool floor'},{id:'poolscale',name:'the pool scale'},
                  {id:'ground',name:'the ground scale'}];
const GRID_LIST=MATERIALS.filter(m=>m.id!=='air').map(m=>({id:m.id,name:m.name}));

/* where things stand.  The pool scale is PhET's: 0.15 x 0.06 x 0.2 m, its
   height a fraction of the way up the pool (PhET's heightProperty, 0.5). */
const SCALE_X=0.27, GROUND_SCALE_X=-POOL_W/2-0.13;
const BLOCK_A_X=-0.22, BLOCK_B_X=0.02;

const DEFAULTS={
  view:'explore',
  /* the blocks (PhET's Explore controls) */
  two:false, matA:'wood', massA:2, volAL:5, matB:'aluminum', massB:13.5, volBL:5,
  holdA:null, holdB:null,
  /* the fluid and the furniture */
  fluid:'water', where:'floor', scaleH:0.5,
  /* the sets (Compare) */
  setMode:'mass', sameMass:BB_SAME_MASS, sameVolL:BB_SAME_VOL*LITERS, sameRho:BB_SAME_RHO,
  /* the faces */
  facesDepth:0.45,
  /* the scale view */
  lowered:0.55,
  /* float or sink */
  gridMat:'wood',
  /* overlays */
  forces:true, labels:true,
};
const ST=Object.assign({},DEFAULTS);

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function clearAll(){ MEMO.explore=MEMO.sets=MEMO.faces=MEMO.scale=MEMO.fluids=null; }

/* -------------------------------------------------- the two adjustable blocks
   PhET's coupling exactly: a real material fixes the density, so mass and
   volume move together; custom leaves them free and the density follows. */
function rhoOf(st,w){
  const mat=w==='A'?st.matA:st.matB;
  if(mat!=='custom') return MAT[mat].phet;
  const m=w==='A'?st.massA:st.massB, V=(w==='A'?st.volAL:st.volBL)/LITERS;
  return m/V;
}
function setMass(st,w,m){
  const mat=w==='A'?st.matA:st.matB, custom=(mat==='custom');
  const rng=massRangeFor(custom?0:MAT[mat].phet,custom);
  m=clamp(m,rng[0],rng[1]);
  if(w==='A') st.massA=m; else st.massB=m;
  if(!custom){
    const V=clamp(m/MAT[mat].phet*LITERS,VMIN_L,VMAX_L);
    if(w==='A') st.volAL=V; else st.volBL=V;
    const mm=MAT[mat].phet*V/LITERS;
    if(Math.abs(mm-m)>1e-12){ if(w==='A') st.massA=mm; else st.massB=mm; }
  }
}
function setVol(st,w,V){
  const mat=w==='A'?st.matA:st.matB, custom=(mat==='custom');
  V=clamp(V,VMIN_L,VMAX_L);
  if(w==='A') st.volAL=V; else st.volBL=V;
  if(!custom) setMass(st,w,MAT[mat].phet*V/LITERS);
  else { const m=w==='A'?st.massA:st.massB, mm=clamp(m,MMIN_CUSTOM,MMAX);
    if(w==='A') st.massA=mm; else st.massB=mm; }
}
function setMat(st,w,id){
  if(w==='A') st.matA=id; else st.matB=id;
  const V=w==='A'?st.volAL:st.volBL;
  if(id==='custom'){ const m=clamp((w==='A'?st.massA:st.massB),MMIN_CUSTOM,MMAX);
    if(w==='A') st.massA=m; else st.massB=m; return; }
  setMass(st,w,MAT[id].phet*V/LITERS);
}
/* the pool scale's top, from PhET's height fraction */
function poolScaleY0(st){ return -POOL_H+st.scaleH*(POOL_H-SCALE_H); }
function poolScaleTop(st){ return poolScaleY0(st)+SCALE_H; }
function poolObstacles(st){ return [{a:SCALE_W*SCALE_D,y0:poolScaleY0(st),h:SCALE_H}]; }

function blockOf(st,w){
  const rho=rhoOf(st,w), V=(w==='A'?st.volAL:st.volBL)/LITERS, held=w==='A'?st.holdA:st.holdB;
  const onScale=(w==='A'&&st.where==='poolscale'), onGround=(w==='A'&&st.where==='ground');
  return {tag:w,V:V,rho:rho,
          x:onScale?SCALE_X:(onGround?GROUND_SCALE_X:(w==='A'?BLOCK_A_X:BLOCK_B_X)),
          mat:w==='A'?st.matA:st.matB,col:matColor(w==='A'?st.matA:st.matB,rho),
          support:onScale?poolScaleTop(st):(onGround?SCALE_H:-POOL_H),
          inPool:!onGround, yb:onGround?SCALE_H:undefined,
          held:(held===null||held===undefined)?undefined:held};
}

/* ------------------------------------------------------------ the pool view */
function exploreModel(st){
  const key=[st.two,st.matA,st.massA,st.volAL,st.matB,st.massB,st.volBL,st.holdA,st.holdB,
             st.fluid,st.where,st.scaleH].join('|');
  return memo('explore',key,()=>{
    const rhoF=MAT[st.fluid].phet, obs=poolObstacles(st);
    const blocks=[blockOf(st,'A')];
    if(st.two) blocks.push(blockOf(st,'B'));
    const sol=solvePool(blocks,rhoF,obs);
    const bare=poolLevel([],obs,rhoF,VF0);
    for(const b of sol.blocks){
      b.faces=cubeFaceForces(b.V,b.yb,sol.yw,rhoF);
      b.floats=b.rho<rhoF;
      b.pct=100*b.frac;
    }
    const A=sol.blocks[0];
    /* the two scales, in newtons, as PhET shows them */
    const poolReads=(st.where==='poolscale')?A.N:0;
    const groundReads=(st.where==='ground')?A.W:0;
    return {rhoF:rhoF,fluid:st.fluid,yw:sol.yw,bare:bare,blocks:sol.blocks,obs:obs,
            scaleTop:poolScaleTop(st),scaleY0:poolScaleY0(st),
            poolReads:poolReads,groundReads:groundReads,
            rise:sol.yw-bare,VfDisp:(sol.yw-bare)*A_POOL};
  });
}

/* ------------------------------------------------------------- the sets view */
function setsModel(st){
  const key=[st.setMode,st.sameMass,st.sameVolL,st.sameRho,st.fluid,st.scaleH].join('|');
  return memo('sets',key,()=>{
    const rhoF=MAT[st.fluid].phet, obs=poolObstacles(st);
    const raw=compareBlocks(BB_CUBES,st.setMode,st.sameMass,st.sameVolL/LITERS,st.sameRho);
    const xs=[-0.26,0.02];
    raw.forEach((b,i)=>{ b.x=xs[i]; });
    const sol=solvePool(raw,rhoF,obs);
    sol.blocks.forEach((b,i)=>{ b.tag=raw[i].tag; b.col=raw[i].col; b.floats=b.rho<rhoF; b.pct=100*b.frac; });
    const matched=st.setMode==='mass'?'mass':(st.setMode==='volume'?'volume':'density');
    /* PhET builds this screen out of a brick and a piece of wood */
    const names=sol.blocks.map(b=>{
      const hit=MATERIALS.find(m=>Math.abs(m.phet-b.rho)<1e-9);
      return hit?hit.name:'custom';
    });
    return {rhoF:rhoF,yw:sol.yw,blocks:sol.blocks,matched:matched,names:names,
            scaleTop:poolScaleTop(st),scaleY0:poolScaleY0(st),obs:obs,
            nFloat:sol.blocks.filter(b=>b.mode==='float').length};
  });
}

/* ------------------------------------------------------------ the faces view */
function facesModel(st){
  const key=[st.matA,st.massA,st.volAL,st.fluid,st.facesDepth].join('|');
  return memo('faces',key,()=>{
    const rhoF=MAT[st.fluid].phet, rho=rhoOf(st,'A'), V=st.volAL/LITERS, s=cubeSide(V);
    /* the cube's bottom, as a depth below a flat free surface at y = 0 */
    const yb=-st.facesDepth, yw=0;
    const F=cubeFaceForces(V,yb,yw,rhoF);
    const poly=cubePoly(V,yb,0), sub=clipBelow(poly,yw);
    const E=edgeForces(sub,yw,rhoF), fine=finePerimeter(sub,yw,rhoF,2000);
    const Asub=polyArea(sub), C=Asub>1e-12?polyCentroid(sub):[0,0];
    const Vsub=cubeBelow(V,yb,yw);
    return {rhoF:rhoF,rho:rho,V:V,s:s,yb:yb,yw:yw,F:F,E:E,fine:fine,Asub:Asub,C:C,
            Vsub:Vsub,arch:rhoF*G*Vsub,W:rho*V*G,
            resid:Math.abs(F.net-rhoF*G*Vsub)/Math.max(1e-12,rhoF*G*Vsub),
            resid2d:Math.abs(E.tot[1]-rhoF*G*Asub)/Math.max(1e-12,rhoF*G*Asub),
            fineResid:Math.abs(fine[1]-E.tot[1])/Math.max(1e-12,Math.abs(E.tot[1])),
            fullyUnder:yb+s<=yw};
  });
}

/* ------------------------------------------------------------ the scale view */
/* lowering a block on a spring scale: `lowered` runs 0 (clear of the surface)
   to 1 (resting on the floor).  The free surface is solved at every step, so
   the curve carries the rise of the fluid as the block goes in. */
function loweredY(st,s){
  const top=poolLevel([],[],MAT[st.fluid].phet,VF0)+0.02;
  const bot=-POOL_H;
  return top+(bot-top)*clamp(st.lowered,0,1);
}
function scaleModel(st){
  const key=[st.matA,st.massA,st.volAL,st.fluid,st.lowered].join('|');
  return memo('scale',key,()=>{
    const rhoF=MAT[st.fluid].phet, rho=rhoOf(st,'A'), V=st.volAL/LITERS, s=cubeSide(V);
    const curve=[], N=241;
    for(let i=0;i<N;i++){
      const t=i/(N-1), st2={fluid:st.fluid,lowered:t};
      const yb=loweredY(st2,s);
      const r=solvePool([{V:V,rho:rho,held:yb}],rhoF)['blocks'][0];
      const rest=(yb<=-POOL_H+1e-12);
      const hang=rest?Math.max(0,r.W-r.Fb-0):r.hand;      /* the string can only pull */
      curve.push([t,r.W-r.Fb,r.Vsub,yb]);
    }
    const yb=loweredY(st,s);
    const sol=solvePool([{V:V,rho:rho,held:yb}],rhoF);
    const b=sol.blocks[0];
    const resting=(yb<=-POOL_H+1e-12);
    /* once the block reaches the floor the string goes slack if it floats or
       the floor takes the rest; the spring reads what it still carries */
    const read=Math.max(0,b.W-b.Fb);
    return {rhoF:rhoF,rho:rho,V:V,s:s,yb:yb,yw:sol.yw,blk:b,curve:curve,
            read:read,slack:(b.W-b.Fb)<=0,resting:resting,
            W:b.W,Fb:b.Fb,Vsub:b.Vsub,frac:b.frac,
            tEnter:1-(loweredY({fluid:st.fluid,lowered:0},s)-sol.yw)/(loweredY({fluid:st.fluid,lowered:0},s)+POOL_H),
            full:apparentWeight(V,rho,rhoF)};
  });
}

/* ----------------------------------------------------- the float-or-sink view */
function fluidsModel(st){
  const key=[st.gridMat,st.matA,st.massA,st.volAL].join('|');
  return memo('fluids',key,()=>{
    const rows=MATERIALS.filter(m=>m.id!=='air').slice().sort((a,b)=>a.phet-b.phet);
    const cols=BUOY_FLUIDS.map(id=>({id:id,name:MAT[id].name,rho:MAT[id].phet}));
    const grid=rows.map(m=>cols.map(f=>({frac:submergedFraction(m.phet,f.rho),
                                         floats:m.phet<f.rho,
                                         neutral:Math.abs(m.phet-f.rho)<1e-9})));
    const pick=MAT[st.gridMat], pi=rows.findIndex(m=>m.id===st.gridMat);
    return {rows:rows,cols:cols,grid:grid,pick:pick,pi:pi,
            nFloat:grid.reduce((t,r)=>t+r.filter(c=>c.floats).length,0),
            nCells:rows.length*cols.length,
            mercuryFloats:rows.filter(m=>m.phet<MAT.mercury.phet).length,
            gasolineFloats:rows.filter(m=>m.phet<MAT.gasoline.phet).length};
  });
}

function buildModel(st){
  st=st||ST;
  if(st.view==='explore') return exploreModel(st);
  if(st.view==='sets') return setsModel(st);
  if(st.view==='faces') return facesModel(st);
  if(st.view==='scale') return scaleModel(st);
  return fluidsModel(st);
}

/* ================================================================== *
 *  readout / equation bar / stage tag                                 *

function row(l,v,cls){ return '<tr><td>'+l+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>'; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function kgm3(x){ return sigf(x,x>=1000?5:4)+' kg/m<sup>3</sup>'; }
function pct(x){ return x<1e-9?'exact':(sigf(100*x,2)+' %'); }

function readoutHTML(M,st){

      +row('% submerged',fmt(A.pct,1)+' %','good')

      +row('ground scale',st.where==='ground'?fmt(M.groundReads,2)+' N':'nothing on it',st.where==='ground'?'good':'')
      +hd('the pool')
      +row('fluid',fmt(VF0*LITERS,0)+' L of '+MAT[st.fluid].name)
      +row('level',fmt(100*(M.yw+POOL_H),2)+' cm')
      +row('risen by',fmt(1000*M.rise,2)+' mm','good');
    note='<b>The two scales say the same thing twice.</b> In air the block weighs &rho;<sub>b</sub>gV; under the fluid it '
      +'presses down by &rho;<sub>b</sub>gV &minus; &rho;<sub>f</sub>gV<sub>sub</sub>, and the difference is the weight of '
      +'the fluid it pushed aside. PhET ignores air buoyancy (a &ldquo;vacuum assumption&rdquo;); in real air this block '

        +row('&nbsp; mass / volume',fmt(b.m,2)+' kg, '+fmt(b.V*LITERS,2)+' L')
        +row('&nbsp; % submerged',fmt(b.pct,1)+' %');
    });
    body+=hd('the matched quantity')
      +row(M.matched,st.setMode==='mass'?fmt(st.sameMass,2)+' kg':(st.setMode==='volume'?fmt(st.sameVolL,2)+' L':kgm3(st.sameRho)),'good')
      +row('floating',M.nFloat+' of 2')
      +row('level',fmt(100*(M.yw+POOL_H),2)+' cm');
    note=st.setMode==='mass'?'PhET&rsquo;s Compare screen starts with a brick and a piece of wood of the same mass, 4 kg: '
        +'2 L of brick and 10 L of wood. Same weight, and one floats.'
      :st.setMode==='volume'?'Same size, 5 L each: 10 kg of brick and 2 kg of wood. The heavy one is the dense one, and it sinks.'
      :'Same density, so the same stuff in two sizes &mdash; and they float to exactly the same fraction of themselves, '
        +fmt(100*Math.min(1,st.sameRho/M.rhoF),1)+' %, whatever the size.';
  } else if(v==='faces'){
    name='the faces'; sub=M.fullyUnder?'fully submerged':'partly submerged';
    body=hd('the pressure on the block')
      +row('depth of the bottom',fmt(100*M.F.dBot,2)+' cm')
      +row('depth of the top',fmt(100*M.F.dTop,2)+' cm')
      +row('p at the bottom',sigf(M.F.pBot,5)+' Pa','good')
      +row('p at the top',sigf(M.F.pTop,5)+' Pa','ref')
      +row('face area',fmt(M.F.A*1e4,2)+' cm<sup>2</sup>')
      +hd('the forces on the faces')
      +row('bottom pushes up',fmt(M.F.Fbot,2)+' N','good')
      +row('top pushes down',fmt(M.F.Ftop,2)+' N','bad')
      +row('net, up',fmt(M.F.net,2)+' N','good')
      +row('one side face',fmt(M.F.side,2)+' N','live')
      +row('the four sides',fmt(M.F.sideSum,2)+' N')
      +hd('Archimedes says')
      +row('&rho;<sub>f</sub> g V<sub>sub</sub>',fmt(M.arch,2)+' N','good')
      +row('they differ by',pct(M.resid))
      +hd('the same, round the polygon')
      +row('per-edge closed form',fmt(M.E.tot[1],2)+' N/m','good')
      +row('vs &rho;g&times;area',pct(M.resid2d))
      +row('vs a 2000-point sum',pct(M.fineResid))
      +row('horizontal',fmt(M.E.tot[0],2)+' N/m');
    note='<b>This is where the upthrust comes from.</b> Nothing pushes up on a submerged body except the fluid, and all the '
      +'fluid does is press on every face at &rho;<sub>f</sub>g times the depth. The four sides cancel in pairs exactly. The '
      +'bottom is deeper than the top by the block&rsquo;s own height, so it is pressed harder by &rho;<sub>f</sub>g&times;height, '

      +'volume and the reading is stuck at (&rho;<sub>b</sub> &minus; &rho;<sub>f</sub>)gV, whatever the depth &mdash; '
      +'pressure grows with depth on the bottom face and on the top face by exactly the same amount. The kink in the curve '
      +'is the moment the top face goes under.';
  } else {
    name='float or sink'; sub=M.pick.name;

    });
    body+=hd('the whole grid')
      +row('cells',M.nCells+' = '+M.rows.length+' &times; '+M.cols.length)
      +row('floating',M.nFloat,'good')
      +row('float in mercury',M.mercuryFloats+' of '+M.rows.length,'good')
      +row('float in gasoline',M.gasolineFloats+' of '+M.rows.length,'bad');
    note='<b>Floating is a comparison, not a property.</b> Lead floats in mercury and aluminium floats in mercury; nothing '
      +'PhET carries floats in gasoline except styrofoam and wood. The only thing that decides is '
      +'&rho;<sub>b</sub> &lt; &rho;<sub>f</sub>, and how far under is exactly the ratio.';
  }
  return '<div class="rname">'+name+'<small>'+sub+'</small></div><table>'+body+'</table><div class="note">'+note+'</div>';
}

function tagHTML(M,st){

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}
/* the fluid: a translucent slab from ybot up to the surface yw across [x0, x1] */
function fluidRect(ctx,map,x0,x1,ybot,yw,col){
  const X0=map.X(x0), X1=map.X(x1), Y0=map.Y(yw), Y1=map.Y(ybot);
  ctx.fillStyle=col||rgba(COL.struct,0.16); ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle=rgba(COL.struct,0.8); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y0); ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y0);
}
/* a force arrow whose world length is len x (F / Fref), with its label */
function forceArrow(ctx,W,H,map,at,F,Fref,dir,len,col,txt,labDx){
  const v=[0,dir*len*Math.min(Math.abs(F)/Math.max(Fref,1e-12),1.6)];
  arrowW(ctx,map,at,v,col,2);
  const tip=[at[0]+v[0],at[1]+v[1]];
  if(txt) lab(ctx,W,H,map.X(tip[0])+(labDx===undefined?8:labDx),map.Y(tip[1]),txt,col,LAB_FONT,labDx!==undefined&&labDx<0?'right':'left');
}
/* ================================================================== *
 *  the pool stage (shared with density.html), then view A and view B  *
 * ================================================================== */
/* every layout reserves HINT_H at the bottom: the house #hint is HTML at
   bottom:11px and the canvas capture cannot see it, so a caption anchored at
   H - 12 would sit underneath it (Known-bad, wave-on-a-string).  The caption's
   own band is registered here too, so a stage label near the bottom dodges it
   instead of landing on the prose. */
function layout(ctx,W,H,full,short,nB,frac,nBn){
  const L=stageLayout(ctx,W,H-HINT_H,full,short,nB,frac,nBn);
  LABELS.push([L.left-2,L.capY-5,L.left+L.capW+2,H-HINT_H-6]);
  return L;
}
/* a label that must be drawn where it is (a tag inside its own block): painted
   unconditionally AND registered, so every dodging lab() after it moves aside */
function labFixed(ctx,x,y,txt,col,font,align,base){
  ctx.fillStyle=col; ctx.font=font;
  ctx.textAlign=align||'center'; ctx.textBaseline=base||'middle';
  const t=plain(txt), fs=parseFloat(font.match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  const lx=align==='right'?x-w:(align==='left'?x:x-w/2);
  const ly=base==='top'?y:(base==='bottom'?y-hh:y-hh/2);
  LABELS.push([lx,ly,lx+w,ly+hh]);
  ctx.fillText(t,x,y);
}
/* axes(), with the TICK LABELS, the axis names and the title registered */
function axesReg(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  axes(ctx,b,xlo,xhi,ylo,yhi,o);
  const fw=(s,px)=>plain(''+s).length*px*0.52;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=fw(o.xfmt?o.xfmt(t):fmt(t,2),10.5);
    LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+10.5*1.15]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=fw(o.yfmt?o.yfmt(t):fmt(t,2),10.5);
    LABELS.push([b.x-6-w,Y-6.04,b.x-6,Y+6.04]); }
  if(o.xlab){ const w=fw(o.xlab,11); LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+33.65]); }
  if(o.ylab){ const w=fw(o.ylab,11); LABELS.push([b.x-52.65,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
  if(o.title){ const w=fw(o.title,13); LABELS.push([b.x,b.y-23.95,b.x+w,b.y-9]); }
}
/* the world the pool stage draws — wide enough for a scale standing on the
   ground to the left of the pool, and no higher than a lifted block reaches */
const POOL_YTOP=0.30;
function poolExtent(){ return {xmin:-0.76,xmax:0.60,ymin:-(POOL_H+0.05),ymax:POOL_YTOP}; }
function holdCeiling(s){ return POOL_YTOP-s-0.012; }
const GROUND='#20242e', GROUND2='#171b23';
/* a wide stage drawing a nearly square picture at equal aspect wastes two
   thirds of its width, so the pool takes the left and the panels stack right */
function splitMain(L,W,fracLeft,nRight){
  const b=L.main;
  if(isNarrow(W)||nRight<1) return {pool:b,rows:[]};
  const gut=70, wl=Math.round(b.w*fracLeft);
  const pool=box(b.x,b.y,Math.max(120,wl-gut/2),b.h);
  const rx=b.x+wl+gut/2, rw=Math.max(150,b.x1-rx);
  const rows=[], slot=b.h/nRight;
  for(let i=0;i<nRight;i++) rows.push(box(rx,b.y+i*slot+26,rw,Math.max(60,slot-70)));
  return {pool:pool,rows:rows};
}
/* a scale standing on a surface: PhET's 0.15 x 0.06 m box with its reading */
function drawScale(ctx,W,H,map,x,ybase,text,col,onPost){
  const w=SCALE_W, hgt=SCALE_H;
  if(onPost){
    worldPoly(ctx,map,[[x-0.012,-POOL_H],[x+0.012,-POOL_H],[x+0.012,ybase],[x-0.012,ybase]],'#1b2028','#2e3644',1);
  }
  worldPoly(ctx,map,[[x-w/2,ybase],[x+w/2,ybase],[x+w/2,ybase+hgt],[x-w/2,ybase+hgt]],'#232936','#3d4658',1.4);
  labFixed(ctx,map.X(x),map.Y(ybase+hgt/2),text,col||COL.pos,'bold 12px -apple-system, sans-serif','center','middle');
  return ybase+hgt;
}
/* the pool seen from the front, in true proportion (a pool is a SHAPE) */
function drawPoolStage(ctx,W,H,b,yw,blocks,opt){
  opt=opt||{};
  const E=poolExtent(), map=worldFitUp(b,E,0.01), gy=E.ymin;
  worldPoly(ctx,map,[[E.xmin,gy],[-POOL_W/2,gy],[-POOL_W/2,0],[E.xmin,0]],GROUND,GROUND2,1);
  worldPoly(ctx,map,[[POOL_W/2,gy],[E.xmax,gy],[E.xmax,0],[POOL_W/2,0]],GROUND,GROUND2,1);
  worldPoly(ctx,map,[[-POOL_W/2,gy],[POOL_W/2,gy],[POOL_W/2,-POOL_H],[-POOL_W/2,-POOL_H]],GROUND,GROUND2,1);
  fluidRect(ctx,map,-POOL_W/2,POOL_W/2,-POOL_H,yw,rgba(fluidColor(opt.fluid),0.22));
  if(opt.bare!==undefined&&Math.abs(opt.bare-yw)>1e-6)
    seg(ctx,map,[-POOL_W/2,opt.bare],[POOL_W/2,opt.bare],rgba(COL.ref,0.75),1.2,[4,3]);
  for(const bk of blocks){
    const s=bk.s, x=bk.x, y0=bk.yb;
    worldPoly(ctx,map,[[x-s/2,y0],[x+s/2,y0],[x+s/2,y0+s],[x-s/2,y0+s]],bk.col,'#0b0f18',1.4);
    if(bk.Vsub>0){
      const ytop=Math.min(y0+s,yw);
      worldPoly(ctx,map,[[x-s/2,y0],[x+s/2,y0],[x+s/2,ytop],[x-s/2,ytop]],rgba(COL.pos,0.16),null);
    }
    if(bk.tag) labFixed(ctx,map.X(x),map.Y(y0+s/2),bk.tag,'#0b0f18','bold 13px -apple-system, sans-serif','center','middle');
    /* the block's own rectangle goes into the label registry: a force label
       painted over the block it belongs to is unreadable, and with two blocks
       26 px apart there is no room for one between them */
    LABELS.push([map.X(x-s/2),map.Y(y0+s),map.X(x+s/2),map.Y(y0)]);
  }
  return map;
}
/* each fluid gets its own tint, so a fluid chip visibly changes the pool */
function fluidColor(id){
  if(id==='mercury') return '#9aa3b4';
  if(id==='honey') return '#c9962a';
  if(id==='gasoline') return '#c9c04a';
  if(id==='oil') return '#9c8a34';
  if(id==='seawater') return '#3aa0b0';
  return COL.struct;
}
/* ONE arrow-length scale for the whole picture, with the reference force
   computed here so a draw call cannot make the arrows incomparable */
function forceScale(blocks){
  const ceil=POOL_YTOP-0.012, floor=-POOL_H-0.018;
  let room=1, Fref=1;
  for(const b of blocks){
    const cy=b.yb+b.s/2; room=Math.min(room,cy-floor,ceil-cy);
    Fref=Math.max(Fref,b.W,b.Fb,Math.abs(b.mode==='held'?b.hand:b.N));
  }
  return {len:Math.max(0.035,Math.min(0.13,room)),Fref:Fref};
}
/* the drawn length of each arrow, lifted OUT of the draw call so the one scale
   can be asserted (a quantity only the picture can check is in the wrong layer) */
function forceLengths(bk,FS){
  const Fref=FS.Fref, len=FS.len;
  const fr=f=>Math.min(Math.abs(f)/Math.max(Fref,1e-12),1);
  const extra=bk.mode==='held'?bk.hand:bk.N;
  return {W:len*fr(bk.W),Fb:len*fr(bk.Fb),extra:len*fr(extra),sign:extra>0?1:-1,raw:extra};
}
/* PhET's three arrows: gravity down, buoyancy up, contact up */
function drawForces(ctx,W,H,map,bk,FS,opt){
  opt=opt||{};
  const cx=bk.x, s=bk.s, cy=bk.yb+s/2, A=forceLengths(bk,FS);
  arrowW(ctx,map,[cx-0.22*s,cy],[0,-A.W],COL.ref,2);
  arrowW(ctx,map,[cx+0.22*s,cy],[0,A.Fb],COL.pos,2);
  if(Math.abs(A.raw)>1e-9)
    arrowW(ctx,map,[cx+0.55*s+0.012,cy],[0,A.sign*A.extra],COL.live,2);
  if(!opt.labels) return;
  lab(ctx,W,H,map.X(cx-s/2)-8,map.Y(cy)-11,'gravity '+fmt(bk.W,1)+' N',COL.ref,SM_FONT,'right');
  lab(ctx,W,H,map.X(cx+s/2)+10,map.Y(cy)-11,'buoyancy '+fmt(bk.Fb,1)+' N',COL.pos,SM_FONT,'left');
  if(Math.abs(A.raw)>1e-9)
    lab(ctx,W,H,map.X(cx+s/2)+10,map.Y(cy)+11,(bk.mode==='held'?'hand ':'contact ')+fmt(Math.abs(A.raw),1)+' N',
        COL.live,SM_FONT,'left');
}

/* ================================================================== *
 *  view: the pool  (PhET's Explore screen)                            *
 * ================================================================== */
const EXP_CAP_FULL='PhET&rsquo;s Explore screen. One or two cubes in a '+fmt(POOL_W*100,0)+' × '+fmt(POOL_D*100,0)
  +' × '+fmt(POOL_H*100,1)+' cm pool holding '+fmt(VF0*LITERS,0)+' L of a fluid you choose, with the three forces '
  +'PhET draws: gravity down in orange, buoyancy up in green, and whatever the floor or the scale still has to take in '
  +'magenta. All three arrows are on ONE length scale, printed on the stage. Block A can stand on the pool floor, on the '
  +'scale in the pool, or on the scale on the ground &mdash; in air it weighs &rho;<sub>b</sub>gV, under the fluid it '
  +'presses down by exactly that less the weight of the fluid it pushed aside. Drag a block to hold it under or lift it clear.';
const EXP_CAP_SHORT='PhET&rsquo;s Explore screen: cubes in a chosen fluid, the three forces to one scale, and two '
  +'scales in newtons. Drag a block.';

function exploreGeo(ctx,W,H,M){
  const L=layout(ctx,W,H,EXP_CAP_FULL,EXP_CAP_SHORT,0,0,0);
  const SP=splitMain(L,W,0.62,2);
  return {L:L,SP:SP,map:worldFitUp(SP.pool,poolExtent(),0.01)};
}
function drawForceBars(ctx,W,H,b,blocks,Fref){
  const n=blocks.length, gh=Fref*1.15;
  axesReg(ctx,b,0,n*3+1,0,gh,{title:titleFor(b,'gravity, buoyancy and contact','the forces'),
    ylab:'newtons',nx:1,ny:5,xticks:[],yfmt:t=>fmt(t,0)});
  blocks.forEach((bk,i)=>{
    const base=i*3+1;
    const bars=[[base,bk.W,COL.ref,'g'],[base+0.75,bk.Fb,COL.pos,'b'],
                [base+1.5,bk.mode==='held'?Math.abs(bk.hand):bk.N,COL.live,bk.mode==='held'?'hand':'c']];
    for(const bar of bars){
      const X=b.x+b.w*bar[0]/(n*3+1), Wd=b.w*0.6/(n*3+1);
      const Yv=b.y1-b.h*clamp(bar[1],0,gh)/gh;
      ctx.fillStyle=rgba(bar[2],0.55); ctx.fillRect(X,Yv,Wd,b.y1-Yv);
      ctx.strokeStyle=bar[2]; ctx.lineWidth=1.2; ctx.strokeRect(X,Yv,Wd,b.y1-Yv);
      lab(ctx,W,H,X+Wd/2,Yv-8,bar[3],bar[2],SM_FONT,'center');
    }
    lab(ctx,W,H,b.x+b.w*(base+0.75)/(n*3+1),b.y1+13,bk.tag,'#aeb6c6',LAB_FONT,'center');
  });
}
/* the submerged fraction of block A against the fluid density, across PhET's
   six fluids — the same law the float-or-sink view draws, for one block */
function drawFluidStrip(ctx,W,H,b,M,st){
  const rho=M.blocks[0].rho, lo=300, hi=14500, lx=v=>Math.log10(v);
  axesReg(ctx,b,lx(lo),lx(hi),0,1.08,{title:titleFor(b,'how much of block A is under, in each fluid','in each fluid'),
    xlab:'fluid density, kg/m3 (log)',ylab:'fraction under',nx:1,ny:5,
    xticks:b.w<300?[lx(680),lx(13593)]:[lx(680),lx(1000),lx(1440),lx(13593)],
    xfmt:t=>fmt(Math.pow(10,t),0),yfmt:t=>fmt(t,2)});
  const xs=[], ys=[];
  for(let i=0;i<=200;i++){ const v=Math.pow(10,lx(lo)+(lx(hi)-lx(lo))*i/200); xs.push(lx(v)); ys.push(submergedFraction(rho,v)); }
  polyline(ctx,b,xs,ys,lx(lo),lx(hi),0,1.08,COL.pos,1.8);
  for(const f of BUOY_FLUIDS){
    const rf=MAT[f].phet, X=b.x+b.w*(lx(rf)-lx(lo))/(lx(hi)-lx(lo)), Y=b.y1-b.h*submergedFraction(rho,rf)/1.08;
    const here=(f===st.fluid);
    dot(ctx,X,Y,here?5:3,here?COL.live:COL.pos,'#0b0f18',1);
    if(here) lab(ctx,W,H,X,Y-10,MAT[f].name,COL.live,SM_FONT,'center','bottom');
  }
  /* the block's own density, where the curve reaches 1 */
  const Xr=b.x+b.w*(lx(clamp(rho,lo,hi))-lx(lo))/(lx(hi)-lx(lo));
  ctx.strokeStyle=rgba(COL.ref,0.7); ctx.lineWidth=1.1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(Xr,b.y); ctx.lineTo(Xr,b.y1); ctx.stroke(); ctx.setLineDash([]);
  /* a block lighter than the axis floor is drawn ON the floor, and the label
     says so rather than letting the dashed line be read as the axis */
  lab(ctx,W,H,Xr+6,b.y+12,'rho_b = '+sigf(rho,4)+(rho<lo?' (off the axis)':''),COL.ref,SM_FONT,'left');
}
function drawExploreView(ctx,W,H,M,st){
  st=st||ST;
  const G2=exploreGeo(ctx,W,H,M), L=G2.L, SP=G2.SP;
  if(SP.rows.length>1){
    drawFluidStrip(ctx,W,H,SP.rows[0],M,st);
    drawForceBars(ctx,W,H,SP.rows[1],M.blocks,forceScale(M.blocks).Fref);
  }
  const inPool=M.blocks.filter(b=>b.mode!=='out');
  const map=drawPoolStage(ctx,W,H,SP.pool,M.yw,inPool,{bare:M.bare,fluid:st.fluid});
  /* PhET's two scales */
  drawScale(ctx,W,H,map,SCALE_X,M.scaleY0,st.where==='poolscale'?fmt(M.poolReads,1)+' N':'0.0 N',
            st.where==='poolscale'?COL.pos:COL.dim,true);
  drawScale(ctx,W,H,map,GROUND_SCALE_X,0,st.where==='ground'?fmt(M.groundReads,1)+' N':'0.0 N',
            st.where==='ground'?COL.pos:COL.dim,false);
  lab(ctx,W,H,map.X(SCALE_X),map.Y(M.scaleY0)+13,'pool scale',COL.dim,SM_FONT,'center');
  /* a block standing on the ground scale is drawn on it */
  const out=M.blocks.find(b=>b.mode==='out');
  /* with a block on it the name goes UNDER the scale, where the block is not */
  lab(ctx,W,H,map.X(GROUND_SCALE_X),out?map.Y(0)+13:map.Y(SCALE_H)-12,'ground scale',COL.dim,SM_FONT,'center');
  if(out){
    worldPoly(ctx,map,[[out.x-out.s/2,SCALE_H],[out.x+out.s/2,SCALE_H],
                       [out.x+out.s/2,SCALE_H+out.s],[out.x-out.s/2,SCALE_H+out.s]],out.col,'#0b0f18',1.4);
    labFixed(ctx,map.X(out.x),map.Y(SCALE_H+out.s/2),out.tag,'#0b0f18','bold 13px -apple-system, sans-serif','center','middle');
  }
  if(st.forces){
    const FS=forceScale(inPool.length?inPool:M.blocks);
    for(const b of inPool) drawForces(ctx,W,H,map,b,FS,{labels:st.labels});
    lab(ctx,W,H,map.X(POOL_W/2)-6,map.Y(0.045),'arrows to one scale: the longest is '+fmt(FS.Fref,1)+' N',
        COL.dim,SM_FONT,'right');
  }
  lab(ctx,W,H,map.X(-POOL_W/2)+7,map.Y(-POOL_H+0.022),
      fmt((M.yw+POOL_H)*A_POOL*LITERS-SCALE_V*LITERS*(M.yw>M.scaleTop?1:0),1)+' L of '+MAT[st.fluid].name,
      fluidColor(st.fluid),LAB_FONT,'left');
  const x0=POOL_W/2-0.1;
  seg(ctx,map,[x0,-POOL_H-0.028],[x0+0.1,-POOL_H-0.028],COL.dim,1.4);
  lab(ctx,W,H,map.X(x0+0.05),map.Y(-POOL_H-0.028)+11,'10 cm',COL.dim,SM_FONT,'center');
  if(M.blocks.some(b=>b.mode==='held'))
    lab(ctx,W,H,map.X(0),map.Y(POOL_YTOP-0.015),'held — let go and it returns to equilibrium',COL.live,LAB_FONT,'center');
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  view: the sets  (PhET's Compare screen)                            *
 * ================================================================== */
const SETS_CAP_FULL='PhET&rsquo;s Compare screen: a brick and a piece of wood, held equal in one quantity at a time. '
  +'Equal MASS (PhET&rsquo;s 4 kg) means 2 L of brick against 10 L of wood &mdash; the same weight, and one of them floats. '
  +'Equal VOLUME (5 L) means 10 kg against 2 kg. Equal DENSITY means the same stuff in two sizes, and then they float to '
  +'exactly the same fraction of themselves, because the size cancels out of the floating law completely. The panel beside '
  +'the pool is the mass-volume plane, where a matched pair is a straight line: horizontal, vertical, or through the origin.';
const SETS_CAP_SHORT='PhET&rsquo;s Compare screen: a brick and a piece of wood matched in mass, volume or density.';

function setsGeo(ctx,W,H,M){
  const L=layout(ctx,W,H,SETS_CAP_FULL,SETS_CAP_SHORT,0,0,0);
  const SP=splitMain(L,W,0.62,1);

}
function drawSetsView(ctx,W,H,M,st){
  st=st||ST;
  const G2=setsGeo(ctx,W,H,M), L=G2.L, SP=G2.SP;
  if(SP.rows[0]){
    const b1=SP.rows[0], xmax=VMAX_L*1.1, ymax=Math.max(12,Math.max.apply(null,M.blocks.map(b=>b.m))*1.3);
    axesReg(ctx,b1,0,xmax,0,ymax,{title:titleFor(b1,'the two blocks in the mass-volume plane','mass and volume'),
      xlab:'volume, litres',ylab:'mass, kg',nx:6,ny:5,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    polyline(ctx,b1,[0,xmax],[0,xmax*M.rhoF/LITERS],0,xmax,0,ymax,COL.ref,1.4,[5,4]);
    lab(ctx,W,H,b1.x1-8,b1.y1-b1.h*Math.min(ymax,xmax*M.rhoF/LITERS)/ymax-10,MAT[st.fluid].name,COL.ref,SM_FONT,'right');
    if(st.setMode==='mass') polyline(ctx,b1,[0,xmax],[st.sameMass,st.sameMass],0,xmax,0,ymax,COL.pos,1.6);
    else if(st.setMode==='volume') polyline(ctx,b1,[st.sameVolL,st.sameVolL],[0,ymax],0,xmax,0,ymax,COL.pos,1.6);
    else polyline(ctx,b1,[0,xmax],[0,xmax*st.sameRho/LITERS],0,xmax,0,ymax,COL.pos,1.6);
    M.blocks.forEach((bk,i)=>{
      marker(ctx,b1,0,xmax,0,ymax,bk.V*LITERS,bk.m,bk.col);
      lab(ctx,W,H,b1.x+b1.w*(bk.V*LITERS)/xmax+8,b1.y1-b1.h*bk.m/ymax-2,bk.tag+' '+M.names[i],bk.col,SM_FONT,'left');
    });
