<title>Gas properties &mdash; hard disks in a box: the ideal gas law, a working wall, Maxwell&ndash;Boltzmann, diffusion, and where pressure comes from</title>
<!--
  ===================================================================
  gas-properties.html — Remake of PhET Interactive Simulations' Gas
  Properties (University of Colorado Boulder, phet.colorado.edu,
  CC-BY 4.0). New code; no PhET code or assets.
  ===================================================================

  Six views.  THE GAS LAW is PhET's Ideal screen: pump heavy or light
  particles into a box, heat or cool them from below, slide the left
  wall (it does no work: the sim pauses and the particles are spread
  over the new width), open the lid and watch them leave, and hold
  nothing, the volume, the temperature, or the pressure (by moving the
  wall, or by changing the temperature), with the thermometer, the
  pressure gauge, the stopwatch, the collision counter and the width
  ruler.  THE MOVING WALL is PhET's Explore screen: the left wall does
  work, at no more than a speed limit (PhET's is 800 m/s), and the gas
  heats as it is squeezed.  THE ENERGY is PhET's Energy screen: the
  speed and kinetic-energy histograms of the heavy, light and all
  particles, the average speeds, the injection temperature and the
  collisions switch.  DIFFUSION is PhET's Diffusion screen: a divided
  box, two species of adjustable number, mass, radius and starting
  temperature, the centres of mass and the particle flow.  THE PRESSURE
  and EQUILIBRIUM are house additions: the momentum the walls actually
  receive against PhET's gauge, and the approach of any start to the
  Maxwell-Boltzmann law, with equipartition between the two species.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * PhET's thermometer and gauge obey PV = NkT by construction.  The
    walls actually feel (3/2) x W/(W - 2r) x Z of the gauge: 3/2 because
    PhET gives (3/2)kT to disks that move in two dimensions, W/(W - 2r)
    because a centre cannot reach the last radius, Z because collisions
    carry momentum across the gas.
  * The simulated disks resolve the third virial coefficient: 90 heavy
    disks in the 10 nm box (area fraction 0.050) give Z - 1 = 0.1102,
    against 0.11024 with B2 and B3 and 0.10176 with B2 alone.
  * A slow push (20 m/s) of 100 heavy disks from 10 to 7 nm ends at
    T w/T0 w0 = 1.0694, on the hard-disk adiabat (1.0691), not on the
    point law T w = const (1.0111).  PhET's 800 m/s limit is Mach 1.55
    in the heavy gas at 300 K (sound: 517 m/s); pushed at it, the gas is
    shocked to about three times the adiabat.
  * Effusion: wall hits arrive with (3/2)kT2 (measured 1.481, 2-D
    theory 3/2).  Through the lid's widest gap, about twenty mean free
    paths, the gas leaves as a jet carrying close to its enthalpy
    2kT2 per particle (measured 1.95), and what stays behind cools.
  * Equipartition: from a 6:1 energy split between heavy and light
    disks, the two species' mean energies meet (D = 0.008 +- 0.040).

  WHAT IS EXACT
  -------------
  * The dynamics.  Inside each substep every collision happens at its
    exact contact time, in time order: the earlier root of the contact
    quadratic for two disks, a linear equation for a (moving) wall.
    Elastic impulses conserve momentum and energy to rounding, and
    selfTest asserts both over 5000 random collisions.  The engine
    reproduces an independent brute-force event-driven run (derive.py:
    no grid, no substeps, every pair scanned) to better than 1e-6 pm
    (7e-8 to 7e-7) after 25-30 ps, with identical collision counts,
    and the moving wall's work to the last digit.  A fifth run puts
    three stale predictions in one substep (events whose disk was
    struck by something else first); all three are skipped.
  * Two ledgers close to rounding: kinetic energy = start + the wall's
    work + the heater + particles added - removed - escaped; and the
    virial, d(sum m r.v)/dt = 2 KE + sum r.F, integrated event by event.
  * The statistics.  A closed box of hard disks has no potential energy,
    so its momenta are uniform on the energy shell: each disk's share of
    the energy is Dirichlet(1,...,1), whatever the masses.  The selfTest
    tolerances are that law's exact sampling moments (and a Monte-Carlo
    chi-square quantile over the same law), not guesses.
  * PhET's model, by its model notes and its minified source: the
    injection (Gaussian temperatures with the mean restored, a pi/2 fan),
    the heater (speeds x (1 + a/800) per 60-fps frame, here as a rate),
    the gauge (P = NkT/V, refreshed every 0.75 ps, with PhET's noise
    law), the lid (it blows off above 20,000 kPa), the hold-constant
    algorithms and their Oops cases, the 1-ps histogram averaging, the
    300-frame flow average.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * Temperature is T = (2/3)<KE>/k: the 3-D equipartition, applied to
    particles that move in two dimensions.  The gauge is P = NkT/V with
    V = width x 8750 pm x 4000 pm.
  * The heater rescales every speed at once; the Ideal wall does no work.
  * Overlapping disks (the pump injects them all at one point) pass
    through each other until they separate, as in PhET.

  WHAT IS NOT MODELLED
  --------------------
  * Attraction (the disks are hard, so there is no van der Waals a, no
    condensation), rotation, internal states, gravity, inelastic or
    quantum effects.  The third dimension is only the nominal depth in V.
  * The virial series drawn in the pressure view stops at B3; past an
    area fraction of about 0.1 the higher terms matter and the curve
    falls below the measurement (B4 is not re-derived here).

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * PhET's moving wall returns v' = u - v (its model notes say so); the
    elastic answer, used here, is v' = 2u - v.  PhET's wall does half the
    work (for points its slow law would be T V^(1/2) = const).
  * PhET's collisions are found after the fact by overlap and fixed up by
    reflecting positions; here they are events at the true contact time.
  * PhET's screens open empty; these open with a gas already in the box,
    because a view that draws nothing is a defect here.  The Explore wall
    has a speed-limit slider (PhET's 800 m/s is the default).
  * Gaps: no stopwatch on the Diffusion view, the heater does not animate
    in Pressure-T mode, an Oops is a banner rather than a dialog, and
    there is no dragging of the tools, no sound and no keyboard help.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from docs/phets/gas-properties_en.html
  (k = 8316 AMU pm^2 ps^-2 K^-1, +1.85e-4 against CODATA's 8314.46;
  1 AMU = 1.66e-27 kg; PhET's 0.00986923 atm per kPa, which is 1 atm =
  101.32503 kPa, -2.7e-7 from the exact 101.325; masses 28 and 4 AMU;
  radii 125 and 87.5 pm; the box, the lid, the limits) and from PhET's
  doc/model.md.  Everything else is derived and pinned in selfTest to
  build/gas-properties/derive.py (exact rational collision algebra, a
  brute-force event-driven MD, bit-exact mulberry32, the Dirichlet
  moments, B2 and B3 of hard disks and the hard-disk adiabat by
  quadrature).  The results above are measured by this file's selfTest.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                 *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));

      const t=q/p;

/* ---- the random stream: mulberry32 (bit-exact twin in derive.py) ---------- */
function gasRng(seed){
  let a=seed>>>0;

    next(){
      a=(a+0x6D2B79F5)>>>0;

       does not depend on history keeps the stream reproducible) */

  };

  if(g.collisions&&nin>1){
    const C=Math.max(smax+2*vb*h,1), x0=Math.min(L0,wantLeft===undefined?L0:wantLeft)-smax, y0=-smax;
    const nx=Math.max(1,Math.ceil((smax-x0)/C)+1), ny=Math.max(1,Math.ceil((g.H+2*smax)/C)+1);
    const nc=nx*ny;
    if(!g._cellHead||g._cellHead.length<nc) g._cellHead=new Int32Array(Math.max(nc,64));
    g._cellHead.fill(-1,0,nc);
    for(let i=0;i<N;i++){ if(g.out[i]) continue;
      const cx=Math.min(nx-1,Math.max(0,Math.floor((g.x[i]-x0)/C))), cy=Math.min(ny-1,Math.max(0,Math.floor((g.y[i]-y0)/C)));
      const c=cy*nx+cx; g._cellNext[i]=g._cellHead[c]; g._cellHead[c]=i; g._cellOf[i]=c; }
    G={C,x0,y0,nx,ny,vb};
  }
  if(g.vir.on){ let e2=0; for(let i=0;i<N;i++) if(!g.out[i]) e2+=2*gasKE(g,i); g.vir.kin+=e2*h; }
  /* 4. predict every particle's first events; pairs once each (j > i) */
  EVH.n=0;
  for(let i=0;i<N;i++){ g.lt[i]=0; }
  for(let i=0;i<N;i++){ if(g.out[i]) continue; gasPredict(g,i,0,h,L0,u,G,true); }
  /* 5. events in time order */
  const cap=64*nin+1000; let nev=0;
  while(EVH.n>0){
    const e=evPop(), t=EVH.t[e];
    if(t>h) break;
    const i=EVH.i[e], j=EVH.j[e], kind=EVH.k[e];
    /* stale: a disk has had an event since this one was predicted (its stamp
       moved on), or has left through the lid */
    if(g.st[i]!==EVH.si[e]||g.out[i]){ g.stats.stale++; continue; }
    if(kind===EV_PAIR&&(g.st[j]!==EVH.sj[e]||g.out[j])){ g.stats.stale++; continue; }
    if(++nev>cap){ g.stats.eventCap++; break; }
    /* advance the particle(s) to the event time */
    g.x[i]+=g.vx[i]*(t-g.lt[i]); g.y[i]+=g.vy[i]*(t-g.lt[i]); g.lt[i]=t;
    const m=gasMass(g,i);
    if(kind===EV_PAIR){
      g.x[j]+=g.vx[j]*(t-g.lt[j]); g.y[j]+=g.vy[j]*(t-g.lt[j]); g.lt[j]=t;
      const vir=pairResolve(g,i,j);
      if(g.vir.on) g.vir.pair+=vir;
      g.stats.pairHits++; g.st[i]++; g.st[j]++;
      if(G&&(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]>G.vb*G.vb||g.vx[j]*g.vx[j]+g.vy[j]*g.vy[j]>G.vb*G.vb)) g.stats.fastMiss++;
      gasPredict(g,i,t,h,L0,u,G); gasPredict(g,j,t,h,L0,u,G);
      continue;
    }
    if(kind===EV_ESC){
      /* leaves through the opening: out of the container, no more collisions */
      const e0=0.5*m*(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]);
      if(g.vir.on){ g.vir.esc-=m*(g.x[i]*g.vx[i]+g.y[i]*g.vy[i]); g.vir.kin-=2*e0*(h-t); }
      g.led.esc+=e0; g.out[i]=1; g.st[i]++;
      continue;
    }
    let Jx=0,Jy=0;
    const eHit=0.5*m*(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]);
    if(kind===EV_LEFT){
      const moving=gasXlo(g,g.sp[i])===null, uu=moving?u:0;
      const vx0=g.vx[i], vx1=2*uu-vx0;               /* elastic: the wall is infinitely heavy */
      g.vx[i]=vx1; Jx=m*(vx1-vx0);
      if(uu!==0){ const dE=0.5*m*(vx1*vx1-vx0*vx0); g.led.work+=dE; if(g.vir.on) g.vir.kin+=2*dE*(h-t); }
      if(moving){ g.imp.L+=Jx; g.imp.hitsL++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++; }
    } else if(kind===EV_RIGHT){
      Jx=-2*m*g.vx[i]; g.vx[i]=-g.vx[i];
      if(gasXhi(g,g.sp[i])===0){ g.imp.R-=Jx; g.imp.hitsR++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++; }
    } else if(kind===EV_BOT){
      Jy=-2*m*g.vy[i]; g.vy[i]=-g.vy[i]; g.imp.B+=Jy; g.imp.hitsB++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++;
    } else {
      Jy=-2*m*g.vy[i]; g.vy[i]=-g.vy[i]; g.imp.T-=Jy; g.imp.hitsT++; g.imp.E+=eHit; g.stats.wallHits++; g.stats.frameWallHits++;
    }
    if(g.vir.on) g.vir.wall+=g.x[i]*Jx+g.y[i]*Jy;
    g.st[i]++;
    gasPredict(g,i,t,h,L0,u,G);
  }
  g.stats.events+=nev;
  /* 6. everyone to the end of the substep; the kinetic virial of the substep */
  for(let i=0;i<N;i++){
    const dt=h-g.lt[i];
    g.x[i]+=g.vx[i]*dt; g.y[i]+=g.vy[i]*dt; g.lt[i]=0;
  }
  if(wantLeft!==undefined) gasWidthTo(g,-wantLeft);
  g.u=u;
  g.imp.t+=h;
  EVH.n=0;
}
/* ---- one frame: substeps, then PhET's per-step bookkeeping ------------------- */
/* the number of substeps keeps the grid's cells at most ~2 diameters: a cell
   is s_max + 2 v_b h wide, and the event order inside a substep is exact
   whatever h is, so this is a speed knob, not an accuracy one */
function gasSubsteps(g,dt){
  let keMax=0, smax=0, mmin=Infinity;
  for(let i=0;i<g.n;i++) if(!g.out[i]){ const e=gasKE(g,i); if(e>keMax) keMax=e; }
  for(const S of g.species){ if(2*S.r>smax) smax=2*S.r; if(S.m<mmin) mmin=S.m; }
  if(!(keMax>0)||!(smax>0)) return 1;
  const vb=Math.sqrt(4*keMax/mmin)+(g.doesWork?g.wallSpeed:0);
  return Math.max(1,Math.min(64,Math.ceil(2*vb*dt/smax)));
}
function gasStep(g,dt){
  if(!(dt>0)) return;
  for(let i=0;i<g.n;i++) g.px[i]=g.x[i];
  const n=gasSubsteps(g,dt), h=dt/n;
  g.stats.frameWallHits=0;
  let moved=false;
  for(let s=0;s<n;s++){
    let wantLeft;
    if(g.doesWork&&g.wantW!==g.W){
      /* Explore: the wall heads for the width the user asked for at no more
         than PhET's wallSpeedLimit, in either direction */
      const d=g.wantW-g.W, lim=g.wallSpeed*h;
      wantLeft=-(Math.abs(d)<=lim?g.wantW:g.W+(d>0?lim:-lim));
      moved=true;
    }
    gasSubstep(g,h,wantLeft);
  }
  if(!moved) g.u=0;
  g.t+=dt;
  /* escaped particles float off; they are dropped far outside the box */
  for(let i=g.n-1;i>=0;i--) if(g.out[i]&&(g.y[i]>g.H+30000||g.y[i]<-30000||g.x[i]>30000||g.x[i]<g.left-30000)) gasKill(g,i);
  if(g.counter.on){ g.counter.count+=g.stats.frameWallHits; g.counter.t+=dt;
    if(g.counter.t>=g.counter.period){ g.counter.on=false; g.counter.t=g.counter.period; } }
  if(g.watch.on){ g.watch.t=Math.min(GAS.MAXTIME,g.watch.t+dt); if(g.watch.t>=GAS.MAXTIME) g.watch.on=false; }
  gasUpdate(g,dt,g.stats.frameWallHits);
  if(g.sampler) gasSample(g,dt,true);
  if(g.flow&&!g.divided) gasFlowStep(g,dt);
}
/* PhET's updateModel: compensateForHoldConstant, the temperature, the pressure
   (enabled after the first wall hit; the gauge refreshes every 0.75 ps with
   noise), the lid blowing off, the maximum temperature */
function gasUpdate(g,dt,hits){
  const N=gasCount(g);
  if(g.hold==='pressureV'&&N>0&&g.P>0){
    const T=gasTemp(g), Pm=g.P/GAS.P_SCALE;
    let w=+(N*GAS.K*T/Pm/(g.H*g.D)).toFixed(5);
    if(w<g.wRange[0]||w>g.wRange[1]){
      g.oops=w>g.wRange[1]?'pressureLarge':'pressureSmall'; g.hold='nothing';
      w=Math.min(g.wRange[1],Math.max(g.wRange[0],w));
    }
    gasResize(g,w,true);
  } else if(g.hold==='pressureT'&&N>0&&g.P>0){
    gasSetTemp(g,(g.P/GAS.P_SCALE)*gasVolume(g)/(N*GAS.K));
  }
  g.T=gasTemp(g);
  if(N===0){ g.pOn=false; g.P=0; g.gaugeP=0; }
  else if(!g.pOn&&hits>0) g.pOn=true;
  if(g.pOn){
    g.P=gasPressureOf(N,g.T,gasVolume(g));
    g.pAcc+=dt;
    if(g.pAcc>=GAS.P_REFRESH){
      let e=0;
      if(g.noiseOn&&g.hold!=='pressureV'&&g.hold!=='pressureT'){
        const pn=Math.min(50,Math.max(0,50*(1-g.P/GAS.P_MAX))), sn=Math.min(1,Math.max(0,((g.T||0)-5)/45));
        e=pn*sn*g.noise.next();
        if(e<g.P) e*=g.noise.next()<0.5?-1:1;
      }
      g.gaugeP=g.P+e; g.pAcc=0;
    }
    if(g.P>GAS.P_MAX) gasBlowLid(g);
  }
  if(g.T!==null&&g.T>=GAS.T_MAX){
    if(g.hold!=='nothing'&&g.hold!=='volume') g.hold='nothing';
    gasRemoveAll(g); gasReturnLid(g); g.oops='maxTemperature'; g.T=null;
  }
  if(g.hold==='temperature'&&gasLidOpen(g)){ g.hold='nothing'; g.oops='temperatureOpen'; }
}
/* the model refreshed without time passing (a paused resize, a count change):
   PhET's updateWhenPaused, which also refreshes the gauge */
function gasRefresh(g){ g.pAcc=GAS.P_REFRESH; gasUpdate(g,0,0); }
/* the hold-constant modes a user may choose right now (PhET HoldConstantPanel):
   T needs particles and a closed lid; P needs a non-zero pressure */
function gasHoldAllowed(g,mode){
  if(mode==='temperature') return gasCount(g)>0&&!gasLidOpen(g);
  if(mode==='pressureV'||mode==='pressureT') return g.P>0;
  return true;
}
function gasSetHold(g,mode){ if(!gasHoldAllowed(g,mode)) return false; g.hold=mode; return true; }
/* the Oops texts (PhET's strings, <br> dropped) */
const GAS_OOPS={
  maxTemperature:'Oops! Maximum temperature reached.',
  pressureEmpty:'Oops! Pressure cannot be held constant when the container is empty.',
  pressureLarge:'Oops! Pressure cannot be held constant. Volume would be too large.',
  pressureSmall:'Oops! Pressure cannot be held constant. Volume would be too small.',
  temperatureEmpty:'Oops! Temperature cannot be held constant when the container is empty.',
  temperatureOpen:'Oops! Temperature cannot be held constant when the container is open.'
};

/* ---- statistics --------------------------------------------------------------- */
function gasSpeed(g,i){ return Math.sqrt(g.vx[i]*g.vx[i]+g.vy[i]*g.vy[i]); }
/* counts in nb bins of width w (PhET HistogramsModel: floor(v/w); values past
   the last bin are not counted) */
function gasBinCounts(g,k,w,nb,energy){
  const out=new Array(nb).fill(0);
  for(let i=0;i<g.n;i++){ if(g.out[i]||g.sp[i]!==k) continue;
    const v=energy?gasKE(g,i):gasSpeed(g,i), b=Math.floor(v/w);
    if(b>=0&&b<nb) out[b]++; }
  return out;
}
function gasMeanSpeedOf(g,k){ let s=0,c=0; for(let i=0;i<g.n;i++) if(!g.out[i]&&g.sp[i]===k){ s+=gasSpeed(g,i); c++; } return c?s/c:null; }
/* PhET's Energy-screen sampler: every frame adds the bin counts and the mean
   speeds; every 1 ps (or at once when paused) the averages are published */
function gasSamplerOn(g){
  const z=()=>new Array(GAS.NBIN).fill(0);
  g.sampler={dt:0, n:0, acc:{s0:z(),s1:z(),e0:z(),e1:z()}, spd:[0,0],
             out:{s0:z(),s1:z(),e0:z(),e1:z()}, mean:[null,null], published:0};
  return g.sampler;
}
function gasSample(g,dt,playing){
  const S=g.sampler; if(!S) return;
  S.dt+=dt; S.n++;
  for(const k of [0,1]){
    const sc=gasBinCounts(g,k,GAS.SBIN,GAS.NBIN,false), ec=gasBinCounts(g,k,GAS.EBIN,GAS.NBIN,true);
    const A=S.acc['s'+k], B=S.acc['e'+k];
    for(let b=0;b<GAS.NBIN;b++){ A[b]+=sc[b]; B[b]+=ec[b]; }
    const ms=gasMeanSpeedOf(g,k); S.spd[k]+=ms===null?0:ms;
  }
  if(S.dt>=GAS.SAMPLE-1e-9||!playing){
    for(const key of ['s0','s1','e0','e1']) S.out[key]=S.acc[key].map(v=>v/S.n);
    for(const k of [0,1]) S.mean[k]=gasCount(g,k)?S.spd[k]/S.n:null;
    for(const key of ['s0','s1','e0','e1']) S.acc[key].fill(0);
    S.spd=[0,0]; S.n=0; S.dt=0; S.published++;
  }
}
/* the centre of mass of species k: x offset from the container's centre, pm */
function gasCOM(g,k){
  let sm=0,sx=0;
  for(let i=0;i<g.n;i++) if(!g.out[i]&&g.sp[i]===k){ const m=gasMass(g,i); sm+=m; sx+=m*g.x[i]; }
  return sm>0?sx/sm-(g.left+g.W/2):null;
}
/* Diffusion's Data: per side of the divider line, the counts of each species
   and the average temperature (2/3)<KE>/k */
function gasSideData(g){
  const res=[{n0:0,n1:0,e:0,T:null},{n0:0,n1:0,e:0,T:null}];
  for(let i=0;i<g.n;i++){ if(g.out[i]) continue;
    const s=g.x[i]<g.dividerX?0:1; if(g.sp[i]===0) res[s].n0++; else res[s].n1++; res[s].e+=gasKE(g,i); }
  for(const r of res){ const n=r.n0+r.n1; r.T=n?(2/3)*r.e/n/GAS.K:null; }
  return res;
}
/* Diffusion's particle flow: crossings of the divider line this frame (from x
   at the frame's start to x at its end), a running window of 300 frames */
function gasFlowOn(g){ g.flow={L:[[],[]], R:[[],[]], dts:[], rateL:[0,0], rateR:[0,0]}; return g.flow; }
function gasFlowStep(g,dt){
  const F=g.flow, cL=[0,0], cR=[0,0];
  for(let i=0;i<g.n;i++){ if(g.out[i]) continue; const k=g.sp[i];
    if(g.px[i]>=g.dividerX&&g.x[i]<g.dividerX) cL[k]++; else if(g.px[i]<=g.dividerX&&g.x[i]>g.dividerX) cR[k]++; }
  F.dts.push(dt); for(const k of [0,1]){ F.L[k].push(cL[k]); F.R[k].push(cR[k]); }
  if(F.dts.length>GAS.FLOW_WINDOW){ F.dts.shift(); for(const k of [0,1]){ F.L[k].shift(); F.R[k].shift(); } }
  const T=F.dts.reduce((a,b)=>a+b,0);
  for(const k of [0,1]){ F.rateL[k]=F.L[k].reduce((a,b)=>a+b,0)/T; F.rateR[k]=F.R[k].reduce((a,b)=>a+b,0)/T; }
}
/* the pressure the walls feel: momentum delivered per unit time to each wall
   (a 2-D force per unit length is this over the wall's length) */
function gasWallForce(g){
  const I=g.imp, t=I.t||1;
  return {L:I.L/t, R:I.R/t, B:I.B/t, T:I.T/t, t:I.t, hits:I.hitsL+I.hitsR+I.hitsB+I.hitsT};
}

/* ---- Diffusion's settings (PhET DiffusionParticleSystem) --------------------- */
/* the half a species is born in: particle 1 left of the divider, particle 2 right */
function gasDiffRegion(g,k){ const mid=g.left+g.W/2; return k===0?[g.left,mid-g.dividerHalf]:[mid+g.dividerHalf,0]; }
/* a new mass or starting temperature sets EVERY particle of the species to
   sqrt(3kT/m), keeping its direction (PhET setMassAndTemperature) */
function gasDiffMassTemp(g,k,m,T){
  g.species[k].m=m;
  const v=Math.sqrt(3*GAS.K*T/m);
  for(let i=0;i<g.n;i++) if(g.sp[i]===k&&!g.out[i]){
    const s=gasSpeed(g,i); if(s>0){ g.vx[i]*=v/s; g.vy[i]*=v/s; } else { g.vx[i]=v; g.vy[i]=0; } }
}
/* a new radius; paused, every particle of the species is set back inside the
   x-range it may occupy (PhET clamps into the left half for particle 1 even
   with the divider out; here the range is the one the divider allows) */
function gasDiffRadius(g,k,r,playing){
  g.species[k].r=r;
  if(playing) return;
  const lo=gasXlo(g,k), xlo=lo===null?g.left:lo, xhi=gasXhi(g,k);
  for(let i=0;i<g.n;i++) if(g.sp[i]===k&&!g.out[i]){
    if(g.x[i]-r<xlo) g.x[i]=xlo+r; else if(g.x[i]+r>xhi) g.x[i]=xhi-r;
    if(g.y[i]-r<0) g.y[i]=r; else if(g.y[i]+r>g.H) g.y[i]=g.H-r; }
}
/* a new count: added in the species' own half; removing resets the rest to
   sqrt(3kT/m), as PhET does */
function gasDiffCount(g,k,n,T){
  const c=gasCount(g,k);
  if(n>c){ const R=gasDiffRegion(g,k); gasScatter(g,k,n-c,T,R[0],R[1]); }
  else if(n<c){ gasRemove(g,k,c-n); gasDiffMassTemp(g,k,g.species[k].m,T); }
}
/* the divider back in: PhET restarts, every particle regenerated on its side */
function gasDiffRestart(g,n0,T0,n1,T1){
  gasRemoveAll(g); gasSetDivided(g,true);
  const R0=gasDiffRegion(g,0), R1=gasDiffRegion(g,1);
  gasScatter(g,0,n0,T0,R0[0],R0[1]); gasScatter(g,1,n1,T1,R1[0],R1[1]);
  if(g.flow) gasFlowOn(g);
}

/* ---- the worlds ------------------------------------------------------------ */
const WORLD={};
function pressureOnAfterFill(g){ g.pOn=gasCount(g)>0; gasRefresh(g); }
function makeWorld(view,st){
  const w={view, trace:[], hist:[], pump:{h:0, acc:0}, dragW:null};
  if(view==='ideal'||view==='explore'||view==='energy'){
    const g=w.g=gasMake({seed:SEEDS[view], doesWork:view==='explore', wRange:view==='energy'?[GAS.WDEF,GAS.WDEF]:undefined});
    if(view==='energy'){ g.hold='volume'; gasSamplerOn(g); g.collisions=st.coll; g.injectT=st.injMode==='set'?st.injT:null; }
    g.noiseOn=st.noise;
    gasFill(g,0,view==='energy'?150:100,GAS.T0);
    if(view==='energy') gasFill(g,1,150,GAS.T0);
    gasLedgerReset(g); pressureOnAfterFill(g);
    if(view==='energy') for(let k=0;k<24;k++) gasSample(g,FRAME_DT,true);
    w.T0=g.T; w.W0=g.W; w.moving=false; if(view==='explore') g.wallSpeed=st.wallU;
    if(view==='ideal') idealRecord(w);
  } else if(view==='diffusion'){
    const g=w.g=gasMake({width:GAS.DIFF_W, wRange:[GAS.DIFF_W,GAS.DIFF_W], noLid:true, seed:SEEDS.diffusion,
                         species:[{m:st.d1m,r:st.d1r},{m:st.d2m,r:st.d2r}]});
    gasSetDivided(g,st.divided);

    gasFlowOn(g); gasLedgerReset(g);
  } else if(view==='pressure'){
    const g=w.g=gasMake({width:GAS.WDEF, wRange:[GAS.WDEF,GAS.WDEF], noLid:true, virial:true, seed:SEEDS.pressure, collisions:st.pColl});
    gasFill(g,0,st.pN,st.pT);
    pressureOnAfterFill(g); gasLedgerReset(g); gasVirialReset(g); gasImpulseReset(g);
  } else {
    const g=w.g=gasMake({width:GAS.WDEF, wRange:[GAS.WDEF,GAS.WDEF], noLid:true, seed:SEEDS.equil, collisions:st.eColl});
    const n=Math.round(st.eN/2);
    if(st.eStart==='delta'){ gasFill(g,0,n,GAS.T0,true); gasFill(g,1,st.eN-n,GAS.T0,true); }
    else if(st.eStart==='split'){ gasFill(g,0,n,3*GAS.T0,true); gasFill(g,1,st.eN-n,GAS.T0/3,true); }
    else { gasInject(g,0,n,GAS.T0); gasInject(g,1,st.eN-n,GAS.T0); }
    gasLedgerReset(g); pressureOnAfterFill(g);
    equilRecord(w);

  return w;
}
function diffScatter(g,st){
  const half=g.dividerHalf, dx=g.left+g.W/2;
  gasScatter(g,0,st.d1n,st.d1T,g.left,dx-half);
  gasScatter(g,1,st.d2n,st.d2T,dx+half,0);
}
function worldOf(view){ if(!WORLD[view]) WORLD[view]=makeWorld(view,ST); return WORLD[view]; }
function resetWorld(view){ WORLD[view]=makeWorld(view,ST); return WORLD[view]; }
function resetAllWorlds(){ for(const k in WORLD) delete WORLD[k]; }

/* ---- per-view bookkeeping each frame ------------------------------------- */
function viewDt(st){ return st.view==='diffusion'&&st.slow?GAS.DT_SLOW:GAS.DT_FRAME; }
/* the equilibrium view's record: Boltzmann's H over K equal-probability energy
   bins (the relative entropy of the histogram against exp(-e/kT2)), and the two
   species' mean energies in units of the mean */
const EQ_K=12;
function equilH(g){
  const N=gasCount(g); if(N<2) return {H:null,floor:null};
  const kT2=gasEnergy(g)/N, cnt=new Array(EQ_K).fill(0);
  for(let i=0;i<g.n;i++){ if(g.out[i]) continue; const q=1-Math.exp(-gasKE(g,i)/kT2); cnt[Math.min(EQ_K-1,Math.floor(q*EQ_K))]++; }
  let H=0; for(const c of cnt) if(c>0){ const p=c/N; H+=p*Math.log(p*EQ_K); }
  return {H, floor:(EQ_K-1)/(2*N), cnt};
}
function equilRecord(w){
  const g=w.g, N=gasCount(g); if(!N) return;
  const E=gasEnergy(g)/N, h0=gasCount(g,0)?gasEnergy(g,0)/gasCount(g,0)/E:null, h1=gasCount(g,1)?gasEnergy(g,1)/gasCount(g,1)/E:null;
  const Hh=equilH(g);
  w.hist.push([g.t,Hh.H,h0,h1,g.stats.pairHits]);
  if(w.hist.length>2000) w.hist.splice(0,w.hist.length-2000);
}
function worldStep(w,st,dt){
  const g=w.g;
  if(w.view==='ideal'&&w.dragW!==null) return false;          /* PhET pauses the Ideal screen while the wall is dragged */
  g.heat=(w.view==='diffusion'||w.view==='pressure'||w.view==='equil')?0:st.heat;
  const n0=gasCount(g,0), n1=gasCount(g,1), Tb=g.T, Wb=g.W;
  if(w.view==='explore') g.wallSpeed=st.wallU;
  gasStep(g,dt);
  /* the moving wall: each push is measured against the adiabat through the
     state it started from */
  if(w.view==='explore'){
    if(g.u!==0&&!w.moving){ w.moving=true; w.T0=Tb; w.W0=Wb; w.trace=[[Wb,Tb===null?NaN:Tb,g.t-dt]]; }
    else if(g.u===0) w.moving=false;
  }
  if(w.view==='ideal') idealRecord(w);
  if(w.view==='explore'){ w.trace.push([g.W,g.T===null?NaN:g.T,g.t]); if(w.trace.length>4000) w.trace.splice(0,w.trace.length-4000); }
  if(w.view==='diffusion'){ w.hist.push([g.t,gasCOM(g,0),gasCOM(g,1)]); if(w.hist.length>3000) w.hist.splice(0,w.hist.length-3000); }
  if(w.view==='pressure') pressureRecord(w);
  if(w.view==='equil') equilRecord(w);
  return gasCount(g,0)!==n0||gasCount(g,1)!==n1;
}
/* the pressure view's running averages, sampled each frame */
function pressureRecord(w){
  const g=w.g, m=pressureModel(w);
  w.hist.push([g.imp.t,m.Pwall,m.Pgauge,m.Zwall]);
  if(w.hist.length>3000) w.hist.splice(0,w.hist.length-3000);
}

/* ---- the models the readout and the views read ------------------------------ */
function fmtT(T,st){ if(T===null||T===undefined||!isFinite(T)) return '—'; return st.unitT==='C'?sigf(T-273.15,4)+' °C':sigf(T,4)+' K'; }
function fmtP(Pk,st){ if(!isFinite(Pk)) return '—'; return st.unitP==='kPa'?Math.round(Pk)+' kPa':fmt(Pk*GAS.ATM_PER_KPA,1)+' atm'; }
function zJ(e){ return e*GAS.KG_PER_AMU*1e21; }       /* AMU pm^2/ps^2 -> zJ, PhET's AMU */
/* the pressure the walls feel against PhET's gauge (the pressure view) */
function pressureModel(w){
  const g=w.g, N=gasCount(g), E=gasEnergy(g), I=g.imp, t=I.t;
  const S=g.species[0], r=S.r, a=g.W-2*r, b=g.H-2*r;
  const Fx=t>0?(I.L+I.R)/(2*t):0, Fy=t>0?(I.B+I.T)/(2*t):0;          /* mean force on an x-wall, a y-wall */
  const Pwall=Fx/(g.H*g.D)*GAS.P_SCALE;                               /* kPa, per wall area H x D */
  const Pgauge=gasPressureOf(N,gasTemp(g),gasVolume(g));
  let sx=0; for(let i=0;i<g.n;i++) if(!g.out[i]) sx+=gasMass(g,i)*g.vx[i]*g.vx[i];
  const xshare=E>0?sx/E:null;                                         /* Σ m vx² / E: 1 if isotropic */
  const V=gasVirial(g), Zwall=t>0&&E>0?(a*Fx+b*Fy)/(2*E):null;        /* the wall-measured compressibility */
  const Zpair=t>0&&E>0?1+g.vir.pair/t/(2*E):null;
  const eta=N*Math.PI*r*r/(g.W*g.H);
  const z1=g.collisions&&N>1?hdZ1(N,2*r,a,b):0;
  const zTh=1+z1*(1+HD_B3_RATIO*hdB2(2*r)*N/(a*b));
  const kin=1.5*g.W/a;                                                 /* the 3/2 and the excluded strip */
  return {N,E,t,Fx,Fy,Pwall,Pgauge,ratio:Pgauge>0?Pwall/Pgauge:null,Zwall,Zpair,eta,z1,zTh,kin,xshare,
          pred:Pgauge*kin*(Zpair===null?zTh:Zpair),predTh:Pgauge*kin*zTh,vir:V,hits:I.hitsL+I.hitsR+I.hitsB+I.hitsT,
          pairs:g.stats.pairHits};
}
function buildModel(){
  const st=ST, view=st.view, w=worldOf(view), g=w.g;
  const N=gasCount(g), nH=gasCount(g,0), nL=gasCount(g,1);
  const M={view,st,w,g,N,nH,nL,T:g.T,P:g.P,gauge:g.gaugeP,Wnm:g.W/1000,t:g.t,oops:g.oops};
  if(BOXVIEWS[view]){
    M.kT2=g.T===null?null:gasKT2(g.T);
    M.lidOpen=gasLidOpen(g); M.opening=gasOpening(g);
    /* the invariant the chosen hold keeps (noise-free P): Gay-Lussac P/T, Boyle
       PV, Charles V/T, and N T at fixed P and V */
    const Vn=gasVolume(g)/1e9, T=g.T;
    M.inv=(!T||!N)?null:g.hold==='volume'?['P / T (Gay-Lussac)',sigf(g.P/T,5)+' kPa/K']
      :g.hold==='temperature'?['P V (Boyle)',sigf(g.P*Vn,5)+' kPa nm³']
      :g.hold==='pressureV'?['V / T (Charles)',sigf(Vn/T,5)+' nm³/K']
      :g.hold==='pressureT'?['N T (P and V fixed)',sigf(N*T,5)+' K']:null;
  }
  if(view==='explore'){
    M.u=g.u; M.work=g.led.work;
    M.TV=(g.T&&w.T0)?(g.T*g.W)/(w.T0*w.W0):null;
    const cnt=[nH,nL], rad=[g.species[0].r,g.species[1].r];
    M.Tad=(g.T&&w.T0)?w.T0*hdAdiabatRatio(cnt,rad,w.W0,g.W,g.H,64):null;
    const mBar=N?(nH*g.species[0].m+nL*g.species[1].m)/N:null;
    M.c=(M.kT2&&mBar)?gasSound(M.kT2,mBar):null; M.mach=M.c?Math.abs(g.u)/M.c:null;
    M.machLimit=M.c?g.wallSpeed/M.c:null;
  }
  if(view==='energy'){
    const S=g.sampler; M.mean=S?S.mean:[null,null];
    M.mb=[M.kT2?mbMeanSpeed(g.species[0].m,M.kT2):null, M.kT2?mbMeanSpeed(g.species[1].m,M.kT2):null];
  }
  if(view==='diffusion'){
    M.side=gasSideData(g); M.com=[gasCOM(g,0),gasCOM(g,1)]; M.flow=g.flow;
  }
  if(view==='pressure') M.pr=pressureModel(w);
  if(view==='equil'){ M.eh=equilH(g); const last=w.hist[w.hist.length-1]; M.last=last; }
  return M;
}

 *  readout / eqbar / tag                                              *

function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function readoutHTML(M){

    s+='</table><div class="note">PhET&rsquo;s definitions: T = (2/3)&lang;KE&rang;/k and P = NkT/V with V = width &times; 8.75 nm &times; 4 nm. The particles move in two dimensions, so the walls actually receive 3/2 of this pressure &mdash; see <b>the pressure</b>.</div>';
    return s;
  }
  if(M.view==='diffusion'){
    const D=M.side, sp=g.species;
    s+=hd('left of the divider')+rrow('particle 1, particle 2',D[0].n0+', '+D[0].n1)+rrow('average T',fmtT(D[0].T,st));
    s+=hd('right of the divider')+rrow('particle 1, particle 2',D[1].n0+', '+D[1].n1)+rrow('average T',fmtT(D[1].T,st));
    s+=hd('centre of mass (from the middle)')+rrow('particle 1',M.com[0]===null?'—':sigf(M.com[0]/1000,3)+' nm','good')
      +rrow('particle 2',M.com[1]===null?'—':sigf(M.com[1]/1000,3)+' nm','good');
    if(M.flow) s+=hd('particle flow (particles/ps)')+rrow('particle 1 → left, → right',fmt(M.flow.rateL[0],2)+', '+fmt(M.flow.rateR[0],2))
      +rrow('particle 2 → left, → right',fmt(M.flow.rateL[1],2)+', '+fmt(M.flow.rateR[1],2));
    s+=hd('Graham')+rrow('&radic;(m₁/m₂)',fmt(Math.sqrt(sp[0].m/sp[1].m),3));
    s+='</table><div class="note">'+(g.divided?'The divider is in: each species is confined to its own side.':'The divider is out: the flow rates count crossings of the middle line, averaged over 300 frames as PhET does.')+'</div>';
    return s;
  }
  if(M.view==='pressure'){
    const P=M.pr;
    s+=hd(P.N+' heavy disks, '+(g.collisions?'colliding':'collisions off'))

      +rrow('ratio, measured',P.ratio===null?'—':fmt(P.ratio,4),'good')
      +rrow('3/2 &times; W/(W&minus;2r)',fmt(P.kin,4))

function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='ideal'){
    const h=M.g.hold, hl=(x,on)=>on?'<span class="hl">'+x+'</span>':x;
    return E(hl('P',h==='pressureV'||h==='pressureT')+' '+hl('V',h==='volume')+' = N k '+hl('T',h==='temperature')+' &nbsp;&middot;&nbsp; T = (2/3)&lang;KE&rang;/k &nbsp;&middot;&nbsp; k = 8316 AMU pm&sup2;/(ps&sup2; K)',
      'the ideal gas law, with '+(h==='nothing'?'nothing held':HOLDS.find(x=>x.id===h).name+' held')+' — hold one of P, V, T and the other two answer');
  }
  if(M.view==='explore') return E('v&prime;<sub>x</sub> = 2u &minus; v<sub>x</sub> &nbsp;&middot;&nbsp; dE = &minus;F<sub>x</sub> dW, F<sub>x</sub>(W&minus;2r) = E Z &nbsp;&rArr;&nbsp; <span class="hl">ln '+'T<sub>1</sub>/T<sub>0</sub> = &int; Z dW/(W&minus;2r)</span> &nbsp;(points: T V = const, &gamma; = 2)',
    'each bounce off the moving wall adds 2mu(u − v); pushed slowly the disks warm along their adiabat, pushed faster than sound they are shocked above it');
  if(M.view==='energy') return E('<span class="hl">f(v) = (m v / kT<sub>2</sub>) e<sup>&minus;mv&sup2;/2kT<sub>2</sub></sup></span>, &nbsp; kT<sub>2</sub> = &frac32; kT &nbsp;&middot;&nbsp; &lang;v&rang; = &radic;(&pi;kT<sub>2</sub>/2m) &nbsp;&middot;&nbsp; f(E) = e<sup>&minus;E/kT<sub>2</sub></sup>/kT<sub>2</sub>',
    'the 2-D Maxwell–Boltzmann laws: the same energy law for both species, speeds scaled by 1/√m');
  if(M.view==='diffusion') return E('flux = n &lang;v<sub>x</sub><sup>+</sup>&rang; = n &radic;(kT<sub>2</sub>/2&pi;m) &nbsp;&rArr;&nbsp; <span class="hl">rate &prop; 1/&radic;m</span> &nbsp;(Graham)',
    'take the divider out and each species crosses the middle at a rate set by its density and its mean speed');
  if(M.view==='pressure') return E('F<sub>x</sub> (W&minus;2r) + F<sub>y</sub> (H&minus;2r) = 2E + &Sigma;<sub>collisions</sub> &sigma;|J| &nbsp;&rArr;&nbsp; <span class="hl">P<sub>wall</sub> = &frac32; &middot; W/(W&minus;2r) &middot; Z &middot; NkT/V</span>',
    'the virial theorem: the walls feel the kinetic 2E plus what the collisions carry across the box');
  return E('<span class="hl">H(t) = &Sigma; p<sub>k</sub> ln(p<sub>k</sub>/q<sub>k</sub>) &rarr; 0</span> &nbsp;&middot;&nbsp; q = e<sup>&minus;E/kT<sub>2</sub></sup> &nbsp;&middot;&nbsp; &lang;KE<sub>heavy</sub>&rang; = &lang;KE<sub>light</sub>&rang;',
    'Boltzmann’s H falls as collisions shuffle energy; at equilibrium every disk shares it alike, whatever its mass');
}
function tagHTML(M){
  if(M.view==='ideal') return '<b>the gas law</b> — PhET&rsquo;s Ideal screen'+(M.g.hold!=='nothing'?', holding '+HOLDS.find(h=>h.id===M.g.hold).name:'');
  if(M.view==='explore') return '<b>the moving wall</b> — PhET&rsquo;s Explore screen: the left wall does work';
  if(M.view==='energy') return '<b>the energy</b> — PhET&rsquo;s Energy screen'+(M.g.collisions?'':', collisions off');

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the container scene: one layout shared by the drawing and the      *
 *  pointer (the handles), the box to scale, the instruments           *
 * ================================================================== */
const SCENE={
  ideal:   {maxW:GAS.WMAX, gauges:true, pump:true, heater:true, ruler:true, nPlots:2, plotFrac:0.28},
  explore: {maxW:GAS.WMAX, gauges:true, pump:true, heater:true, ruler:true, nPlots:2, plotFrac:0.32},
  energy:  {maxW:GAS.WDEF, gauges:true, pump:true, heater:true, ruler:true, nPlots:2, plotFrac:0.44},
  diffusion:{maxW:GAS.DIFF_W, gauges:false, pump:false, heater:false, ruler:true, nPlots:1, plotFrac:0.28, below:22},
  pressure:{maxW:GAS.WDEF, gauges:false, pump:false, heater:false, ruler:false, nPlots:2, plotFrac:0.46},
  equil:   {maxW:GAS.WDEF, gauges:false, pump:false, heater:false, ruler:false, nPlots:3, plotFrac:0.50}
};
const CAPS={};
/* the house #hint is HTML (bottom: 11px, 11px type) over the canvas's bottom
   left corner, and the capture cannot see it: every caption here ends HINT_H
   higher, clear of it (the trap the wave-on-a-string build found) */
const HINT_H=18;
function viewGeo(ctx,W,H,M){
  const o=SCENE[M.view], g=M.g, narrow=isNarrow(W);
  const Lx=24, Rres=narrow?16:RO_W+34;
  const cap=captionFor(M);
  /* a scene with its gauges needs ~300 px above the caption, or it takes the
     short caption (the narrow-stage rule: the long caption must not squeeze the
     box until its instruments hang off the canvas) */
  let fit=fitCaption(ctx,W,H-HINT_H,cap[0],cap[1],W-Lx-Rres,stageTop()+(o.gauges?330:230));
  const top=stageTop()+(o.gauges?102:30);
  const nP=narrow?Math.min(1,o.nPlots):o.nPlots;
  /* the caption must describe what is drawn: when the plots do not fit, the
     no-plots caption says what a taller window adds */
  if(nP>0&&!(fit.capY-top>300)){ const c=capFit(ctx,W,H-HINT_H,cap[2],fit.capW); fit={capY:c.capY,txt:cap[2],capW:fit.capW}; }
  let sceneBottom=fit.capY-14, plots=[];
  if(nP>0&&fit.capY-top>300){
    const rowH=Math.max(130,Math.floor((fit.capY-top)*o.plotFrac));
    const rowTop=fit.capY-16-rowH;
    const right=(rowTop<480&&!narrow)?W-Rres:W-26, span=right-Lx, gut=58, pw=(span-gut*nP)/nP;
    for(let i=0;i<nP;i++) plots.push(box(Lx+gut+i*(pw+gut),rowTop+28,pw,rowH-28-40));
    sceneBottom=rowTop-6;
  }
  const below=(o.ruler?26:6)+(o.heater?44:0)+(o.below||0);
  const pumpW=o.pump?84:10;
  const availW=Math.max(60,W-Lx-Rres-pumpW), availH=Math.max(40,sceneBottom-below-top);
  const s=Math.max(0.002,Math.min(availW/o.maxW,availH/g.H));
  /* the instruments hang left of the right wall: keep 170 px for them */
  const xR=Lx+Math.max(o.maxW*s,o.gauges?170:0), yB=top+g.H*s;
  const G={s, xR, yT:top, yB, X:x=>xR+x*s, Y:y=>yB-y*s, wx:X=>(X-xR)/s, wy:Y=>(yB-Y)/s, narrow};
  const wDraw=(M.view==='ideal'&&M.w.dragW!==null)?M.w.dragW:g.W;
  G.xL=xR-wDraw*s; G.wDraw=wDraw;
  G.handle={x:G.xL-16,y:(top+yB)/2-22,w:11,h:44};
  if(g.lid&&g.lid.on){ const oL=g.left-GAS.WALL+g.lid.width; G.lidX=G.X(oL); G.lidKnob={x:G.X(oL)-30,y:top-15,w:26,h:11}; }
  if(o.pump){
    const bh=Math.min(150,Math.max(60,0.55*(yB-top))), bx=xR+34;
    G.pump={x:bx,y:yB-bh,w:24,h:bh,travel:0.55*bh};
    const hy=G.pump.y-10-G.pump.travel*(1-M.w.pump.h);
    G.pumpHandle={x:bx-16,y:hy-8,w:56,h:10};
  }
  if(o.gauges){
    G.gauge={cx:xR-40,cy:top-52,R:Math.min(34,0.45*(top-stageTop()-20))};
    G.thermo={x:xR-128,yb:top-8,h:Math.min(74,top-stageTop()-26)};
  }
  if(o.heater) G.heater={x:G.X(-GAS.WMIN)+8,y:yB+(o.ruler?26:8),w:GAS.WMIN*s-16,h:30};
  G.plots=plots; G.capY=fit.capY; G.capTxt=fit.txt; G.capW=fit.capW; G.Lx=Lx;
  return G;
}
function captionFor(M){
  const v=M.view;
  if(v==='ideal') return ['Drawn to scale: the box is '+fmt(GAS.WMIN/1000,0)+'–'+fmt(GAS.WMAX/1000,0)+' nm wide, 8.75 nm tall and 4 nm deep; every disk is drawn at its true radius (heavy 125 pm, light 87.5 pm). Drag the grip on the left wall (the sim pauses, as PhET’s does), the knob on the lid, or the pump handle. The thermometer spans PhET’s 0–1000 K; the dial its 0–20,000 kPa, past which the lid blows off.',
                         'To scale; drag the wall grip, the lid knob or the pump handle.',
                         'To scale; drag the wall grip, the lid knob or the pump handle. A taller window adds the P and T traces.'];
  if(v==='explore') return ['Drawn to scale. Here the left wall does work: drag its grip and it follows at no more than the speed limit (PhET’s is 800 m/s, faster than sound in the heavy gas), bouncing each disk it meets elastically (v′ = 2u − v); the magenta arrow is its velocity, 0.12 px per m/s. Left: T against the width since the push began, with the adiabat of these hard disks (orange) and of points, T·w = const (dashed). Right: T over the hard-disk adiabat — 1 when the push is slow enough to be reversible.',
                            'To scale; the wall does work (v′ = 2u − v). Left: T against w with the adiabats; right: T over the hard-disk adiabat.',
                            'To scale; the wall does work (v′ = 2u − v). A taller window adds the adiabat plots.'];
  if(v==='energy') return ['PhET’s histograms: 19 bins (170 m/s, 1.33 zJ wide), each count averaged over 1 ps of frames. Bars are all the particles; the outlines are the heavy and light alone; the orange curves are the 2-D Maxwell–Boltzmann counts N·P(bin) at the thermometer’s temperature, kT₂ = (3/2)kT.',
                           'PhET’s 1-ps histograms against 2-D Maxwell–Boltzmann (orange).',
                           'To scale. A taller window adds PhET’s speed and energy histograms.'];
  if(v==='diffusion') return ['Drawn to scale: 16 nm by 8.75 nm; the scale bar is 1 nm a tick. Remove the divider and the species mix; the triangles under the box are each species’ centre of mass, the arrows over the divider its flow rate (particles/ps, 300-frame average). The plot tracks both centres of mass.',
                              'To scale; remove the divider and watch the centres of mass.',
                              'To scale; remove the divider. A taller window adds the centres-of-mass trace.'];
  if(v==='pressure') return ['Each wall hit delivers 2m v⊥; summed over time and divided by the wall’s area (its height × PhET’s 4-nm depth) it is the pressure the wall feels. Left: that running average against PhET’s gauge NkT/V (orange, dashed) and the kinetic-theory value (orange). Right: Z = the measured push over the ideal 2-D gas’s, against the exact hard-disk virial series.',
                             'Wall pressure: measured (green) vs PhET’s gauge and kinetic theory (orange).',
                             'The walls count momentum. A taller window adds the wall-pressure and Z plots; the readout has the numbers.'];
  return ['Left: the energy histogram (all disks, fraction per zJ, log scale) against the Boltzmann law e^(−E/kT₂) (orange). Middle: Boltzmann’s H, the relative entropy of that histogram, with its sampling floor (K−1)/2N. Right: each species’ mean energy over the mean — equipartition when both reach 1.',
          'Relaxation to Maxwell–Boltzmann and equipartition.',
          'A taller window adds the energy law, Boltzmann’s H and equipartition; the readout has the numbers.'];
}

/* ---- the container ------------------------------------------------------------ */
function drawContainer(ctx,G,M){
  const g=M.g, s=G.s, wt=Math.max(2,GAS.WALL*s);
  /* the interior */
  ctx.fillStyle=COL.box; ctx.fillRect(G.xL,G.yT,G.xR-G.xL,G.yB-G.yT);
  ctx.strokeStyle=COL.wall; ctx.lineWidth=wt; ctx.lineCap='square';
  /* left wall, floor, right wall */
  ctx.beginPath(); ctx.moveTo(G.xL-wt/2,G.yT); ctx.lineTo(G.xL-wt/2,G.yB+wt/2); ctx.lineTo(G.xR+wt/2,G.yB+wt/2); ctx.lineTo(G.xR+wt/2,G.yT); ctx.stroke();
  /* the top: the lid over [left, openingLeft], the rest open to the right inset */
  if(g.lid){
    if(g.lid.on){
      const lt=Math.max(3,GAS.LID_THICK*s);
      ctx.fillStyle=COL.lid; ctx.fillRect(G.xL-wt,G.yT-lt,G.lidX-G.xL+wt,lt);
    }
    /* the fixed part of the top between the opening and the right wall */
    ctx.beginPath(); ctx.moveTo(G.X(gasOpenRight()),G.yT-wt/2); ctx.lineTo(G.xR+wt/2,G.yT-wt/2); ctx.stroke();
  } else { ctx.beginPath(); ctx.moveTo(G.xL-wt/2,G.yT-wt/2); ctx.lineTo(G.xR+wt/2,G.yT-wt/2); ctx.stroke(); }
  if(g.divided||M.view==='diffusion'){
    const dx=G.X(g.dividerX), dw=Math.max(2,GAS.DIVIDER*s);
    if(g.divided){ ctx.fillStyle=COL.wall; ctx.fillRect(dx-dw/2,G.yT,dw,G.yB-G.yT); }
    else { ctx.strokeStyle='rgba(90,200,224,0.35)'; ctx.lineWidth=1; ctx.setLineDash([4,5]); ctx.beginPath(); ctx.moveTo(dx,G.yT); ctx.lineTo(dx,G.yB); ctx.stroke(); ctx.setLineDash([]); }
  }
  ctx.lineCap='butt';
}
function drawParticles(ctx,G,g,dim){
  for(const k of [0,1]){
    const R=Math.max(1.3,g.species[k].r*G.s);
    ctx.beginPath(); let any=false;
    for(let i=0;i<g.n;i++){ if(g.sp[i]!==k) continue;
      const X=G.X(g.x[i]), Y=G.Y(g.y[i]); ctx.moveTo(X+R,Y); ctx.arc(X,Y,R,0,TAU); any=true; }
    if(any){ ctx.globalAlpha=dim?0.5:1; ctx.fillStyle=k?COL.light:COL.heavy; ctx.fill(); ctx.globalAlpha=1; }
  }
}
function drawHandles(ctx,G,M){
  const g=M.g, v=M.view;
  const wallOK=(v==='ideal'&&g.hold!=='volume'&&g.hold!=='pressureV')||v==='explore';
  if(wallOK){ const h=G.handle; ctx.fillStyle=DRAG.what==='wall'?COL.live:'#8a97ad'; ctx.fillRect(h.x,h.y,h.w,h.h);
    ctx.strokeStyle='#070b18'; ctx.lineWidth=1; for(let q=1;q<4;q++){ ctx.beginPath(); ctx.moveTo(h.x+2,h.y+q*h.h/4); ctx.lineTo(h.x+h.w-2,h.y+q*h.h/4); ctx.stroke(); } }
  const lidOK=g.lid&&g.lid.on&&!(v==='ideal'&&g.hold==='temperature');
  if(lidOK){ const k=G.lidKnob; ctx.fillStyle=DRAG.what==='lid'?COL.live:'#b8c4d8'; ctx.fillRect(k.x,k.y,k.w,k.h); }
}
function drawPump(ctx,G,M){
  const P=G.pump, H=G.pumpHandle, k=M.st.pump==='light'?1:0;
  /* the hose, from the pump's foot into the right wall at the entry height */
  const ey=G.Y(GAS.ENTRY_Y);
  ctx.strokeStyle='#6b7690'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(P.x+P.w/2,P.y+P.h); ctx.lineTo(P.x+P.w/2,P.y+P.h+8);
  ctx.lineTo(G.xR+18,P.y+P.h+8); ctx.lineTo(G.xR+18,ey); ctx.lineTo(G.xR+3,ey); ctx.stroke();
  ctx.fillStyle='#2a3346'; ctx.fillRect(P.x,P.y,P.w,P.h);
  ctx.strokeStyle='#5a6782'; ctx.lineWidth=1; ctx.strokeRect(P.x+0.5,P.y+0.5,P.w-1,P.h-1);
  /* the shaft and the handle */
  ctx.fillStyle='#8a97ad'; ctx.fillRect(P.x+P.w/2-2,H.y+H.h,4,Math.max(0,P.y-H.y-H.h));
  ctx.fillStyle=DRAG.what==='pump'?COL.live:'#b8c4d8'; ctx.fillRect(H.x,H.y,H.w,H.h);
  /* the species it pumps */
  dot(ctx,P.x+P.w/2,P.y+P.h-14,6,k?COL.light:COL.heavy,'#070b18',1);
}
function drawThermometer(ctx,G,M,W,H){
  const t=G.thermo, g=M.g, T=g.T;
  const f=T===null?0:Math.min(1,Math.max(0,T/1000));
  ctx.fillStyle='#1b2130'; ctx.fillRect(t.x-5,t.yb-t.h,10,t.h);
  ctx.fillStyle=COL.heat; ctx.fillRect(t.x-3,t.yb-f*(t.h-4),6,f*(t.h-4));
  dot(ctx,t.x,t.yb,7,COL.heat,'#5a6782',1);
  ctx.strokeStyle='#5a6782'; ctx.lineWidth=1; ctx.strokeRect(t.x-5.5,t.yb-t.h-0.5,11,t.h);
  lab(ctx,W,H,t.x-12,t.yb-t.h/2,fmtT(T,M.st),COL.pos,'11px -apple-system, sans-serif','right','middle');
}
function drawGauge(ctx,G,M,W,H){
  const d=G.gauge, g=M.g, a0=0.75*PI, a1=2.25*PI;
  ctx.beginPath(); ctx.arc(d.cx,d.cy,d.R,0,TAU); ctx.fillStyle='#10141f'; ctx.fill(); ctx.strokeStyle='#5a6782'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(d.cx,d.cy,d.R-4,a0,a1); ctx.strokeStyle='#2a3346'; ctx.lineWidth=3; ctx.stroke();
  for(let q=0;q<=4;q++){ const a=a0+(a1-a0)*q/4; ctx.beginPath(); ctx.moveTo(d.cx+(d.R-9)*Math.cos(a),d.cy+(d.R-9)*Math.sin(a));
    ctx.lineTo(d.cx+(d.R-3)*Math.cos(a),d.cy+(d.R-3)*Math.sin(a)); ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1; ctx.stroke(); }
  const f=Math.min(1,Math.max(0,(g.pOn?g.gaugeP:0)/GAS.P_MAX)), a=a0+(a1-a0)*f;
  ctx.beginPath(); ctx.moveTo(d.cx,d.cy); ctx.lineTo(d.cx+(d.R-7)*Math.cos(a),d.cy+(d.R-7)*Math.sin(a)); ctx.strokeStyle=COL.live; ctx.lineWidth=2; ctx.stroke();
  /* the pipe down to the box */
  ctx.fillStyle='#3a4458'; ctx.fillRect(d.cx-3,d.cy+d.R,6,Math.max(0,G.yT-d.cy-d.R-4));
  lab(ctx,W,H,d.cx+d.R+6,d.cy,g.pOn?fmtP(g.gaugeP,M.st):'—',COL.pos,'11px -apple-system, sans-serif','left','middle');
}
function drawHeater(ctx,G,M,W,H){
  const h=G.heater, a=M.st.heat, g=M.g;
  const locked=M.view==='ideal'&&(g.hold==='temperature'||g.hold==='pressureT');
  ctx.fillStyle='#161c2a'; ctx.fillRect(h.x,h.y,h.w,h.h);
  if(a!==0&&!locked){ ctx.globalAlpha=Math.min(1,0.25+0.75*Math.abs(a)); ctx.fillStyle=a>0?COL.heat:COL.cool; ctx.fillRect(h.x+3,h.y+3,h.w-6,h.h-6); ctx.globalAlpha=1; }
  ctx.strokeStyle='#5a6782'; ctx.lineWidth=1; ctx.strokeRect(h.x+0.5,h.y+0.5,h.w-1,h.h-1);
  const txt=locked?(h.w>130?'held by the model':'held'):(a>0?'heating':(a<0?'cooling':(h.w>150?'heat / cool (the panel)':'heat / cool')));
  lab(ctx,W,H,h.x+h.w/2,h.y+h.h/2,txt,a!==0&&!locked?'#070b18':COL.dim,'10.5px -apple-system, sans-serif','center','middle');
}
function drawRuler(ctx,G,M,W,H){
  const y=G.yB+(M.view==='diffusion'?22:14), g=M.g;
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1;
  if(M.view==='diffusion'){
    /* PhET's Scale: a bar with a tick every nanometre */
    ctx.beginPath(); ctx.moveTo(G.xL,y); ctx.lineTo(G.xR,y);
    for(let x=0;x>=-g.W-1e-6;x-=1000){ ctx.moveTo(G.X(x),y-4); ctx.lineTo(G.X(x),y+(x%5000===0?5:2)); }
    ctx.stroke(); lab(ctx,W,H,G.xL,y+11,'1 nm per tick',COL.dim,'10.5px -apple-system, sans-serif','left','middle');
    return;
  }
  ctx.beginPath(); ctx.moveTo(G.xL,y); ctx.lineTo(G.xR,y);
  ctx.moveTo(G.xL,y-5); ctx.lineTo(G.xL,y+5); ctx.moveTo(G.xR,y-5); ctx.lineTo(G.xR,y+5); ctx.stroke();
  lab(ctx,W,H,(G.xL+G.xR)/2,y+10,fmt(G.wDraw/1000,2)+' nm',COL.struct,'11px -apple-system, sans-serif','center','middle');
}
function drawTools(ctx,G,M,W,H){
  const st=M.st, g=M.g; let x=G.Lx, y=stageTop()+6;
  if(st.showWatch){
    ctx.fillStyle='#10141f'; ctx.fillRect(x,y,118,30); ctx.strokeStyle='#3a4458'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,117,29);
    lab(ctx,W,H,x+8,y+15,fmt(g.watch.t,2)+' ps',g.watch.on?COL.live:'#cfd4de','12px "SF Mono", Menlo, monospace','left','middle');
    x+=128;
  }
  if(st.showCounter&&M.view!=='energy'){
    ctx.fillStyle='#10141f'; ctx.fillRect(x,y,150,30); ctx.strokeStyle='#3a4458'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,149,29);
    const f=g.counter.t/g.counter.period;
    ctx.fillStyle=COL.pos; ctx.fillRect(x+3,y+25,Math.max(0,144*f),3);
    lab(ctx,W,H,x+8,y+12,g.counter.count+' wall hits',g.counter.on?COL.live:'#cfd4de','12px "SF Mono", Menlo, monospace','left','middle');
  }
}
function oopsGeo(ctx,G,M){
  if(!M.g.oops) return null;
  const txt=GAS_OOPS[M.g.oops]||M.g.oops, w=Math.max(160,Math.min(360,G.xR-G.xL-20)), ls=wrapText(ctx,txt,w-24,'12px -apple-system, sans-serif');
  const bh=ls.length*16+18, bx=(G.xL+G.xR)/2-w/2, by=Math.max(stageTop(),(G.yT+G.yB)/2-bh/2);
  return {w,ls,bh,bx,by};
}
function drawOops(ctx,G,M,W,H){
  const O=oopsGeo(ctx,G,M); if(!O) return;
  const {w,ls,bh,bx,by}=O;
  ctx.fillStyle='rgba(10,12,18,.92)'; ctx.fillRect(bx,by,w,bh); ctx.strokeStyle=COL.ref; ctx.lineWidth=1.5; ctx.strokeRect(bx,by,w,bh);
  ctx.fillStyle=COL.ref; ctx.font='12px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  ls.forEach((l,i)=>ctx.fillText(l,bx+w/2,by+9+i*16));
}
function drawWallVelocity(ctx,G,M){
  const u=M.g.u; if(!M.st.showWallVel||u===0) return;
  const y=(G.yT+G.yB)/2, L=Math.max(-120,Math.min(120,u*0.12));
  const X0=G.xL, X1=G.xL+L;
  ctx.strokeStyle=COL.live; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(X0,y); ctx.lineTo(X1,y);
  const d=L>0?1:-1; ctx.moveTo(X1,y); ctx.lineTo(X1-8*d,y-5); ctx.moveTo(X1,y); ctx.lineTo(X1-8*d,y+5); ctx.stroke();
}
function drawScene(ctx,W,H,M,G){
  const o=SCENE[M.view];
  const O=oopsGeo(ctx,G,M); if(O) LABELS.push([O.bx,O.by,O.bx+O.w,O.by+O.bh]);
  drawContainer(ctx,G,M);
  drawParticles(ctx,G,M.g,M.view==='ideal'&&M.w.dragW!==null);
  if(BOXVIEWS[M.view]) drawHandles(ctx,G,M);
  if(o.pump) drawPump(ctx,G,M);
  if(o.gauges){ drawThermometer(ctx,G,M,W,H); drawGauge(ctx,G,M,W,H); }
  if(o.heater) drawHeater(ctx,G,M,W,H);
  if(o.ruler&&(M.view!=='diffusion'?M.st.showWidth:M.st.dScale)) drawRuler(ctx,G,M,W,H);
  if(BOXVIEWS[M.view]) drawTools(ctx,G,M,W,H);
  if(M.view==='explore') drawWallVelocity(ctx,G,M);
  if(!M.g.lid||M.g.lid.on||!BOXVIEWS[M.view]) {}
  else lab(ctx,W,H,G.X(M.g.left)+6,G.yT-12,'the lid is off',COL.ref,'11px -apple-system, sans-serif','left','middle');
}
function sceneCaption(ctx,G){ caption(ctx,G.Lx,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT); }

/* ---- a small time-series plot ------------------------------------------------- */
/* An auto-ranged axis must never be narrower than its endpoints' rounding:
   the shared ticksFor() steps t += step, and when the span is ~1e-16 of the
   values (two species' energy ratios that are 1 to rounding) t never advances
   and the loop spins for ever.  Widen any such range before asking for ticks. */
function niceRange(lo,hi){
  const sc=Math.max(Math.abs(lo),Math.abs(hi),1e-300);
  if(!(hi-lo>1e-9*sc)){ const m=(lo+hi)/2, d=Math.max(0.05*Math.abs(m),1e-6); return [m-d,m+d]; }
  return [lo,hi];
}
function plotSeries(ctx,W,H,b,title,short,xs,series,opt){
  opt=opt||{};
  let x0=Infinity, x1=-Infinity, y0=opt.y0, y1=opt.y1;
  for(const x of xs) if(isFinite(x)){ if(x<x0) x0=x; if(x>x1) x1=x; }
  if(!isFinite(x0)){ x0=0; x1=1; }
  if(opt.x0!==undefined) x0=opt.x0; if(opt.x1!==undefined) x1=opt.x1;
  if(!(x1>x0)) x1=x0+1;
  if(y0===undefined||y1===undefined){
    let lo=Infinity, hi=-Infinity;
    for(const S of series) for(const v of S.ys) if(isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; }
    for(const r of (opt.refs||[])) if(isFinite(r.y)){ if(r.y<lo) lo=r.y; if(r.y>hi) hi=r.y; }
    if(!(hi>lo)){ lo=isFinite(lo)?lo-1:0; hi=isFinite(hi)?hi+1:1; }
    const pad=0.08*(hi-lo); if(y0===undefined) y0=lo-pad; if(y1===undefined) y1=hi+pad;
  }
  [x0,x1]=niceRange(x0,x1); [y0,y1]=niceRange(y0,y1);
  axesR(ctx,b,x0,x1,y0,y1,{title:titleFor(b,title,short||title),xlab:opt.xlab,ylab:opt.ylab,
    xticks:sparseTicks(x0,x1,b.w),yticks:sparseTicks(y0,y1,b.h),xfmt:tickFmt(x0,x1,b.w),yfmt:tickFmt(y0,y1,b.h)});
  for(const r of (opt.refs||[])) if(isFinite(r.y)) polyline(ctx,b,[x0,x1],[r.y,r.y],x0,x1,y0,y1,r.col||COL.ref,r.lw||1.4,r.dash);
  for(const S of series){
    if(xs.length>1) polyline(ctx,b,xs,S.ys,x0,x1,y0,y1,S.col,S.lw||1.7,S.dash);
    else if(xs.length===1&&isFinite(S.ys[0])) marker(ctx,b,x0,x1,y0,y1,xs[0],S.ys[0],S.col);
  }
  if(opt.note) plotNote(ctx,W,H,b,opt.note);
  return {x0,x1,y0,y1};
}
/* a note in the middle of a plot, on a patch of the canvas ground so a
   reference line through the middle (the diffusion plot's dashed zero) does
   not strike it through */
function plotNote(ctx,W,H,b,txt){
  const w=plain(txt).length*11*0.52+10, x=b.x+b.w/2, y=b.y+b.h/2;
  ctx.fillStyle='#070b18'; ctx.fillRect(x-w/2,y-9,w,18);
  lab(ctx,W,H,x,y,txt,COL.dim,'11px -apple-system, sans-serif','center','middle');
}
function tickFmt(lo,hi,px){
  const t=sparseTicks(lo,hi,px); let d=Infinity; for(let i=1;i<t.length;i++) d=Math.min(d,t[i]-t[i-1]);
  const dec=!isFinite(d)||d>=1?0:Math.min(4,Math.ceil(-Math.log10(d)+1e-9));
  return v=>Math.abs(v)<1e-12?'0':v.toFixed(dec);
}
function emptyNote(ctx,W,H,b,txt){ plotNote(ctx,W,H,b,txt); }

/* ================================================================== *
 *  the gas law (PhET's Ideal screen)                                  *
 * ================================================================== */
function drawIdeal(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M);
  drawScene(ctx,W,H,M,G);
  /* the seed point describes the state at t = 0, and edits made while paused
     (a resize, the pump, erase) move that state: re-seed it, so the lone
     marker never contradicts the readout beside it */
  if(M.w.trace.length===1&&M.g.t===0){ M.w.trace.length=0; idealRecord(M.w); }
  /* P and T against time, each in its own units: what the hold choice keeps flat */
  const tr=M.w.trace, t=[], P=[], T=[], st=M.st, atm=st.unitP!=='kPa', cel=st.unitT==='C';
  for(const r of tr){ t.push(r[0]); T.push(cel?r[1]-273.15:r[1]); P.push(atm?r[2]*GAS.ATM_PER_KPA:r[2]); }
  const note=t.length<2?'run the clock to trace it':null;
  if(G.plots.length) plotSeries(ctx,W,H,G.plots[0],'the gauge, '+(atm?'atm':'kPa')+' (PhET’s noise and 0.75-ps refresh)','P, '+(atm?'atm':'kPa'),t,
    [{ys:P,col:COL.live,lw:1.3}],{xlab:'t, ps',note});
  if(G.plots.length>1) plotSeries(ctx,W,H,G.plots[1],'the temperature, '+(cel?'°C':'K'),'T, '+(cel?'°C':'K'),t,
    [{ys:T,col:COL.pos}],{xlab:'t, ps',note});
  drawOops(ctx,G,M,W,H);
  sceneCaption(ctx,G);
}
/* the gas-law trace: t, T, gauge P, width */
function idealRecord(w){ const g=w.g; w.trace.push([g.t,g.T===null?NaN:g.T,g.pOn?g.gaugeP:0,g.W]); if(w.trace.length>720) w.trace.splice(0,w.trace.length-720); }

/* ================================================================== *
 *  the moving wall (PhET's Explore screen)                            *
 * ================================================================== */
function drawExplore(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M);
  drawScene(ctx,W,H,M,G);
  const w=M.w, tr=w.trace;
  if(G.plots.length){
    const b=G.plots[0];
    const pts=tr.filter(r=>isFinite(r[1]));
    const T0=w.T0||300, W0=w.W0||GAS.WDEF, g=M.g;
    let T1=T0*2.2, Tlo=T0*0.35;
    for(const r of pts){ if(r[1]>T1) T1=r[1]*1.05; if(r[1]<Tlo) Tlo=r[1]*0.95; }
    [Tlo,T1]=niceRange(Tlo,T1);
    const xs=[], ad=[], hdc=[], cnt=[M.nH,M.nL], rad=[g.species[0].r,g.species[1].r];
    for(let x=GAS.WMIN;x<=GAS.WMAX;x+=200){ xs.push(x/1000); ad.push(T0*W0/x); hdc.push(T0*hdAdiabatRatio(cnt,rad,W0,x,g.H,32)); }
    axesR(ctx,b,GAS.WMIN/1000,GAS.WMAX/1000,Tlo,T1,{title:titleFor(b,'T against width: the hard-disk adiabat (orange), points T·w = const (dashed)','T against w'),
      xlab:'w, nm',ylab:'T, K',xticks:sparseTicks(5,15,b.w),yticks:sparseTicks(Tlo,T1,b.h),xfmt:v=>fmt(v,0),yfmt:tickFmt(Tlo,T1,b.h)});
    polyline(ctx,b,xs,ad,GAS.WMIN/1000,GAS.WMAX/1000,Tlo,T1,COL.ref,1.2,[5,4]);
    polyline(ctx,b,xs,hdc,GAS.WMIN/1000,GAS.WMAX/1000,Tlo,T1,COL.ref,1.6);
    if(pts.length>1) polyline(ctx,b,pts.map(r=>r[0]/1000),pts.map(r=>r[1]),GAS.WMIN/1000,GAS.WMAX/1000,Tlo,T1,COL.pos,1.6);
    if(isFinite(M.T)) marker(ctx,b,GAS.WMIN/1000,GAS.WMAX/1000,Tlo,T1,M.g.W/1000,Math.min(T1,Math.max(Tlo,M.T)),COL.live);
  }
  if(G.plots.length>1){
    const b=G.plots[1];
    const pts=tr.filter(r=>isFinite(r[1]));
    if(pts.length<2) emptyNote(ctx,W,H,b,'push the wall to trace T against its adiabat');
    else {
      const g=M.g, cnt=[M.nH,M.nL], rad=[g.species[0].r,g.species[1].r];
      plotSeries(ctx,W,H,b,'T over the hard-disk adiabat since the push began (1 = reversible)','T / T adiabat',pts.map(r=>r[2]),
        [{ys:pts.map(r=>r[1]/(w.T0*hdAdiabatRatio(cnt,rad,w.W0,r[0],g.H,16))),col:COL.pos}],{refs:[{y:1,col:COL.ref,dash:[5,4]}],xlab:'t, ps'});
    }
  }
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  the energy (PhET's Energy screen): the 1-ps histograms            *
 * ================================================================== */
/* the expected counts per PhET bin at the thermometer's temperature */
function mbBinCounts(Nk,m,kT2,energy){
  const out=[];
  for(let b=0;b<GAS.NBIN;b++){
    const lo=b*(energy?GAS.EBIN:GAS.SBIN), hi=lo+(energy?GAS.EBIN:GAS.SBIN);
    out.push(Nk*(energy?mbEnergyCdf(hi,kT2)-mbEnergyCdf(lo,kT2):mbSpeedCdf(hi,m,kT2)-mbSpeedCdf(lo,m,kT2)));
  }
  return out;
}
function drawHistogram(ctx,W,H,b,M,energy){
  const g=M.g, S=g.sampler, st=M.st, ymax=ZOOMS[st.zoom];
  const key=energy?'e':'s', c0=S.out[key+'0'], c1=S.out[key+'1'];
  const wBin=energy?GAS.EBIN*GAS.KG_PER_AMU*1e21:GAS.SBIN, xmax=GAS.NBIN*wBin;
  const title=energy?'kinetic energy, zJ (bins of 1.33 zJ)':'speed, m/s (bins of 170 m/s)';
  axesR(ctx,b,0,xmax,0,ymax,{title:titleFor(b,title+' — particles per bin, 1-ps average',energy?'kinetic energy':'speed'),
    xlab:energy?'KE, zJ':'speed, m/s',ylab:'particles',xticks:sparseTicks(0,xmax,b.w),yticks:sparseTicks(0,ymax,b.h),xfmt:tickFmt(0,xmax,b.w),yfmt:v=>fmt(v,0)});
  /* bars: all particles */
  ctx.fillStyle='rgba(184,236,76,0.55)';
  const bw=b.w/GAS.NBIN;
  let clipped=0;
  for(let q=0;q<GAS.NBIN;q++){
    const v=c0[q]+c1[q], hgt=Math.min(1,v/ymax)*b.h; if(v>ymax) clipped++;
    if(v>0) ctx.fillRect(b.x+q*bw+1,b.y1-hgt,bw-2,hgt);
  }
  const step=(arr,col,dash)=>{ const xs=[], ys=[];
    for(let q=0;q<GAS.NBIN;q++){ xs.push(q*wBin,(q+1)*wBin); ys.push(arr[q],arr[q]); }
    polyline(ctx,b,xs,ys,0,xmax,0,ymax,col,1.3,dash); };
  if(st.histH) step(c0,COL.heavy); if(st.histL) step(c1,COL.light);
  /* the 2-D Maxwell-Boltzmann counts (orange) */
  if(M.kT2){
    const e0=mbBinCounts(gasCount(g,0),g.species[0].m,M.kT2,energy), e1=mbBinCounts(gasCount(g,1),g.species[1].m,M.kT2,energy);
    const xs=[], ys=[];
    for(let q=0;q<GAS.NBIN;q++){ xs.push((q+0.5)*wBin); ys.push(e0[q]+e1[q]); }
    polyline(ctx,b,xs,ys,0,xmax,0,ymax,COL.ref,1.6);
  }
  if(clipped) lab(ctx,W,H,b.x1-4,b.y+10,clipped+' bar'+(clipped>1?'s':'')+' past the '+ymax+' zoom',COL.ref,'10.5px -apple-system, sans-serif','right','middle');
}
function drawEnergy(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M);
  drawScene(ctx,W,H,M,G);
  if(G.plots.length) drawHistogram(ctx,W,H,G.plots[0],M,false);
  if(G.plots.length>1) drawHistogram(ctx,W,H,G.plots[1],M,true);
  drawOops(ctx,G,M,W,H);
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  diffusion (PhET's Diffusion screen)                                *
 * ================================================================== */
function drawDiffusion(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M), g=M.g, st=M.st;
  drawScene(ctx,W,H,M,G);
  const mid=g.left+g.W/2;
  /* the centres of mass: a triangle under the box for each species */
  if(st.dCOM) for(const k of [0,1]){
    const c=M.com[k]; if(c===null) continue;
    const X=G.X(mid+c), y=G.yB+4;
    ctx.beginPath(); ctx.moveTo(X,y); ctx.lineTo(X-6,y+10); ctx.lineTo(X+6,y+10); ctx.closePath();
    ctx.fillStyle=k?COL.light:COL.heavy; ctx.fill();
  }
  /* the flow: arrows over the divider, length ~ rate (particles/ps) */
  if(st.dFlow&&!g.divided&&g.flow){
    const dx=G.X(g.dividerX);
    for(const k of [0,1]){
      const y=G.yT-12-k*12, col=k?COL.light:COL.heavy;
      for(const [rate,dir] of [[g.flow.rateL[k],-1],[g.flow.rateR[k],1]]){
        const L=Math.min(150,rate*10); if(L<1) continue;
        ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(dx,y); ctx.lineTo(dx+dir*L,y);
        ctx.moveTo(dx+dir*L,y); ctx.lineTo(dx+dir*(L-6),y-4); ctx.moveTo(dx+dir*L,y); ctx.lineTo(dx+dir*(L-6),y+4); ctx.stroke();
      }
    }
    lab(ctx,W,H,G.X(g.dividerX)+4,G.yT-38,'flow, 10 px per particle/ps',COL.dim,'10.5px -apple-system, sans-serif','left','middle');
  }
  if(G.plots.length){
    const b=G.plots[0], h=M.w.hist, half=g.W/2000;
    const hs=h.length?h:[[g.t,M.com[0],M.com[1]]];
    plotSeries(ctx,W,H,b,'centres of mass, nm from the middle (0 = mixed; ±'+fmt(half/2,0)+' nm = each half full)','centres of mass, nm',
      hs.map(r=>r[0]),[{ys:hs.map(r=>r[1]===null?NaN:r[1]/1000),col:COL.heavy},{ys:hs.map(r=>r[2]===null?NaN:r[2]/1000),col:COL.light}],
      {y0:-half/2-0.4,y1:half/2+0.4,refs:[{y:0,col:COL.ref,dash:[5,4],lw:1.2}],xlab:'t, ps',note:hs.length<2?'run the clock to trace the centres of mass':null});
  }
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  the pressure: the momentum the walls receive                      *
 * ================================================================== */
function drawPressure(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M), g=M.g, P=M.pr;
  drawScene(ctx,W,H,M,G);
  const h=M.w.hist;
  if(G.plots.length){
    const b=G.plots[0], unitAtm=M.st.unitP!=='kPa', cv=v=>unitAtm?v*GAS.ATM_PER_KPA:v;
    const hs=h.length>1?h:[[0,NaN]];
    plotSeries(ctx,W,H,b,'pressure on the walls ('+(unitAtm?'atm':'kPa')+'), running average since the start','wall pressure, running',
      hs.map(r=>r[0]),[{ys:hs.map(r=>cv(r[1])),col:COL.pos}],
      {refs:[{y:cv(P.Pgauge),col:COL.ref,dash:[6,4],lw:1.3},{y:cv(P.predTh),col:COL.ref,lw:1.5}],xlab:'t, ps',x0:0,
       note:h.length<2?'run the clock: the walls start counting':null});
    lab(ctx,W,H,b.x+6,b.y+10,'gauge NkT/V dashed; ×(3/2)(W/(W−2r)) Z solid',COL.ref,'10.5px -apple-system, sans-serif','left','middle');
  }
  if(G.plots.length>1){
    const b=G.plots[1], r=g.species[0].r, a=g.W-2*r, bb=g.H-2*r;
    const xs=[], th=[], th1=[];
    for(let N=2;N<=600;N+=4){ const eta=N*Math.PI*r*r/(g.W*g.H), z1=hdZ1(N,2*r,a,bb);
      xs.push(eta); th1.push(1+z1); th.push(1+z1*(1+HD_B3_RATIO*hdB2(2*r)*N/(a*bb))); }
    const x1=0.36, y1=Math.max(2.0,(P.Zpair||1)*1.1);
    axesR(ctx,b,0,x1,0.9,y1,{title:titleFor(b,'Z = the walls’ push over the ideal 2-D gas’s, against the area fraction','Z against η'),
      xlab:'area fraction η',ylab:'Z',xticks:sparseTicks(0,x1,b.w),yticks:sparseTicks(0.9,y1,b.h),xfmt:tickFmt(0,x1,b.w),yfmt:tickFmt(0.9,y1,b.h)});
    polyline(ctx,b,[0,x1],[1,1],0,x1,0.9,y1,COL.struct,1,[4,4]);
    polyline(ctx,b,xs,th1,0,x1,0.9,y1,COL.ref,1.2,[5,4]);
    polyline(ctx,b,xs,th,0,x1,0.9,y1,COL.ref,1.6);
    if(P.Zpair!==null) marker(ctx,b,0,x1,0.9,y1,Math.min(x1,P.eta),Math.min(y1,Math.max(0.9,P.Zpair)),COL.live);
    lab(ctx,W,H,b.x+6,b.y+10,'B₂ only dashed, B₂ + B₃ solid; the ideal gas is Z = 1; the dot: this run',COL.ref,'10.5px -apple-system, sans-serif','left','middle');
  }
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  equilibrium: from any start to Maxwell-Boltzmann                   *
 * ================================================================== */
function drawEquil(ctx,W,H,M){
  const G=viewGeo(ctx,W,H,M), g=M.g, h=M.w.hist;
  drawScene(ctx,W,H,M,G);
  const N=M.N;
  if(G.plots.length){
    const b=G.plots[0];
    /* the energy histogram in units of the mean: log10 of the fraction per unit */
    const kT2=N?gasEnergy(g)/N:1, xmax=6, nb=24, dw=xmax/nb, cnt=new Array(nb).fill(0);
    for(let i=0;i<g.n;i++){ if(g.out[i]) continue; const q=Math.floor(gasKE(g,i)/kT2/dw); if(q>=0&&q<nb) cnt[q]++; }
    const ylo=-3, yhi=0.5;
    axesR(ctx,b,0,xmax,ylo,yhi,{title:titleFor(b,'energy / mean energy: the fraction per unit, log scale','energy distribution (log)'),
      xlab:'E / ⟨E⟩',ylab:'density (log scale)',xticks:sparseTicks(0,xmax,b.w),yticks:[-3,-2,-1,0],xfmt:v=>fmt(v,0),yfmt:v=>v===0?'1':'10'+({'-1':'⁻¹','-2':'⁻²','-3':'⁻³'})[String(v)]});
    ctx.fillStyle='rgba(184,236,76,0.6)';
    for(let q=0;q<nb;q++){ if(!cnt[q]) continue; const d=cnt[q]/N/dw, ly=Math.log10(d);
      const Y=b.y1-b.h*(Math.min(yhi,ly)-ylo)/(yhi-ylo), X=b.x+b.w*q/nb; if(ly>ylo) ctx.fillRect(X+1,Y,b.w/nb-2,b.y1-Y); }
    const xs=[], ys=[]; for(let x=0;x<=xmax;x+=0.05){ xs.push(x); ys.push(Math.log10(Math.exp(-x))); }
    polyline(ctx,b,xs,ys,0,xmax,ylo,yhi,COL.ref,1.6);
  }
  const note=h.length<2?'run the clock':null;
  if(G.plots.length>1){
    const floor=M.eh.floor||0;
    plotSeries(ctx,W,H,G.plots[1],'Boltzmann’s H (relative entropy to e^(−E/kT₂)), with the sampling floor','Boltzmann’s H',h.map(r=>r[0]),
      [{ys:h.map(r=>r[1]===null?NaN:r[1]),col:COL.pos}],{refs:[{y:floor,col:COL.ref,dash:[5,4]}],y0:0,xlab:'t, ps',note});
  }
  if(G.plots.length>2) plotSeries(ctx,W,H,G.plots[2],'each species’ mean energy over the mean (equipartition = 1)','equipartition',h.map(r=>r[0]),
      [{ys:h.map(r=>r[2]===null?NaN:r[2]),col:COL.heavy},{ys:h.map(r=>r[3]===null?NaN:r[3]),col:COL.light}],{refs:[{y:1,col:COL.ref,dash:[5,4]}],xlab:'t, ps',note});
  sceneCaption(ctx,G);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='ideal') drawIdeal(ctx,W,H,M);
  else if(M.view==='explore') drawExplore(ctx,W,H,M);
  else if(M.view==='energy') drawEnergy(ctx,W,H,M);
  else if(M.view==='diffusion') drawDiffusion(ctx,W,H,M);
  else if(M.view==='pressure') drawPressure(ctx,W,H,M);
  else drawEquil(ctx,W,H,M);
}
function wallDraggable(M){ const g=M.g; return (M.view==='ideal'&&g.hold!=='volume'&&g.hold!=='pressureV')||M.view==='explore'; }
function lidDraggable(M){ const g=M.g; return BOXVIEWS[M.view]&&g.lid&&g.lid.on&&!(M.view==='ideal'&&g.hold==='temperature'); }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame of model time; false when nothing moves (paused, or the Ideal
     wall being dragged, which PhET pauses) */
  S.step=function(){
    if(!ST.running) return false;
    const w=worldOf(ST.view);
    if(ST.view==='ideal'&&w.dragW!==null) return false;
    const changed=worldStep(w,ST,viewDt(ST));
    if(changed&&S.onCounts) S.onCounts();
    return true;
  };
  /* PhET's step button: one model step of MODEL_TIME_STEP = 0.2 ps */
  S.stepOnce=function(){ const w=worldOf(ST.view); worldStep(w,ST,GAS.STEP); if(S.onCounts) S.onCounts(); };
  S.pointer=function(type,x,y){
    const M=buildModel(), w=M.w, g=M.g;
    if(type==='up'){
      const had=DRAG.what!==null;
      if(DRAG.what==='wall'&&M.view==='ideal'&&w.dragW!==null){
        gasResize(g,w.dragW,true); w.dragW=null; g.counter.on=false; gasRefresh(g);
      }
      DRAG.what=null; return had;
    }
    if(!BOXVIEWS[M.view]) return false;
    const ctx=canvas.getContext('2d'), G=viewGeo(ctx,S.W,S.H,M);
    const inR=r=>r&&x>=r.x-5&&x<=r.x+r.w+5&&y>=r.y-5&&y<=r.y+r.h+5;
    if(type==='down'){
      g.oops=null;
      if(wallDraggable(M)&&inR(G.handle)){ DRAG.what='wall'; DRAG.off=x-G.xL;
        if(M.view==='ideal') w.dragW=g.W; else ST.running=true; return true; }
      if(lidDraggable(M)&&inR(G.lidKnob)){ DRAG.what='lid'; DRAG.off=x-G.lidX; return true; }
      if(G.pumpHandle&&inR(G.pumpHandle)){ DRAG.what='pump'; DRAG.y0=y; DRAG.h0=w.pump.h; return true; }
      return false;
    }
    if(type==='move'){
      if(DRAG.what==='wall'){
        const wv=clamp(Math.round(-G.wx(x-DRAG.off)/10)*10,g.wRange[0],g.wRange[1]);
        if(M.view==='ideal') w.dragW=wv; else g.wantW=wv;
        return true;
      }
      if(DRAG.what==='lid'){ gasSetLid(g,G.wx(x-DRAG.off)-(g.left-GAS.WALL)); return true; }
      if(DRAG.what==='pump'){
        /* a full stroke down pumps 50 (PhET's numberOfParticlesPerPumpAction) */
        const hNew=clamp(DRAG.h0+(y-DRAG.y0)/G.pump.travel,0,1), dh=hNew-w.pump.h;
        if(dh>0){ w.pump.acc+=dh*50; const k=Math.floor(w.pump.acc+1e-9);
          if(k>0){ w.pump.acc-=k; gasInject(g,ST.pump==='light'?1:0,k); if(!ST.running) gasRefresh(g); if(S.onCounts) S.onCounts(); } }
        w.pump.h=hNew; return true;
      }
    }
    return false;
  };
  return S;
}

  function setView(k){
    st.view=k; DRAG.what=null;

  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab)); });

  const rows={};
