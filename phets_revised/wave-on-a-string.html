<title>Wave on a string &mdash; PhET&rsquo;s bead lattice, exactly: reflections, standing waves, and a dispersion relation that is a straight line</title>
<!--
  ===================================================================
  wave-on-a-string.html — a string of 61 beads driven at one end by a
  hand, an oscillator or a pulse generator, and clamped, looped or
  running on at the other: PhET's model exactly, with d'Alembert's
  solution, the standing waves and the lattice's dispersion beside it
  ===================================================================

  Remake of PhET Interactive Simulations' Wave on a String (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets.  The model, its constants and its controls follow PhET's build
  1.2.4 (docs/phets/wave-on-a-string_en.html) and its doc/model.md; every
  number taken from that build is marked "PhET's value" in the code.

  Five views.  THE STRING is PhET's screen: the wrench (manual), the
  oscillator or the pulse generator at bead 0; a fixed end, a loose end or
  no end at bead 60; amplitude, frequency, pulse width, damping and tension;
  the rulers, the stopwatch and the reference line; normal or slow motion,
  play, pause, step and restart.  THE SPACE-TIME is the same string's last
  240 lattice steps as a picture in x and t, where d'Alembert's two sliding
  shapes are stripes whose tilt is set by v.  THE REFLECTIONS sends one pulse at all
  three ends at once, undamped, and lays the image construction over the
  lattice: inverted from the clamp, upright from the ring, nothing from the
  open end.  THE STANDING WAVES drives the string from rest, draws the exact
  steady state it settles into, and sweeps the driving frequency across
  PhET's 0-3 Hz to show the resonances.  THE DISPERSION sets the lattice's
  dispersion relation beside the continuum and a real bead chain: at PhET's
  Courant number it is exactly omega = vk, which is why PhET's pulses never
  spread.

  THE MODEL (PhET's values)
  -------------------------
  61 beads 0.125 cm apart (10 model units at 80 per cm): 7.5 cm of string.
  The update is the leapfrog
      (1+b) y_i^{n+1} = (b-1) y_i^{n-1} + 2(1-a^2) y_i^n + a^2 (y_{i+1}^n + y_{i-1}^n)
  with the Courant number a = v dt/dx held at exactly 1 (the tension sets
  the time step dt = dx/v, never the stencil) and b = 0.1 x damping per step
  (damping slider 0-1, default 0.2).  Ends: fixed y_60 = 0; loose
  y_60 = y_59; no end y_60^{n+1} = y_59^n.  Driver at bead 0: the oscillator
  A sin(2 pi f t), rising first; the pulse, a triangle of height A lasting
  w; the wrench, within +-1.3 cm.  Ranges and defaults: amplitude 0-1.3 cm
  (0.75), frequency 0-3 Hz (1.5), pulse width 0.2-1 s (0.5), slow motion
  x0.25, 50 lattice steps a second at full tension (v = 6.25 cm/s).  Rulers
  of 10 cm and 5 cm, a reference line starting 1.45 cm up, every tenth bead
  marked.

  WHAT IS EXACT HERE
  ------------------
  At a = 1 and no damping the lattice IS d'Alembert's solution sampled at the
  beads: a pulse fed in at bead 0 appears at bead i exactly i steps later,
  unchanged.  Asserted below 1e-13 (the Python twin measures 1e-14) against
  the image series for all three ends over two parameter sets (one
  deliberately incommensurate): fixed returns
  it inverted, loose upright about bead 59.5 (the ring copies its neighbour,
  so the mirror sits half a bead in; putting it at bead 60 is off by 0.06 cm),
  and the open end absorbs it completely.  A damped mode loses exactly
  sqrt((1-b)/(1+b)) = exp(-atanh b) per step; the dispersion relation
  (1+b) z^2 - 2(1 - 2a^2 sin^2(k dx/2)) z + (1-b) = 0 is checked against
  numpy.roots and against lattice runs; the driven steady state is solved in
  closed form, by a tridiagonal solve and by a brute-force run of thousands
  of steps, all three agreeing to within 3e-11; the resonances
  f_n = n v/2L (fixed) and (2n-1) v/4L' (loose, L' = 7.4375 cm) and the
  1/(N b) peak height as b -> 0.  Every number is pinned in selfTest to
  build/wave-on-a-string/refvals.txt, the printed output of derive.py.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  Tension.  PhET's slider (relative, 0.2-0.8) maps sqrt(T) AFFINELY onto
  10-50 steps a second: 1.25-6.25 cm/s over a 4:1 tension range, where
  v proportional to sqrt(T) gives 2:1.  The remake keeps PhET's speed range
  and makes it the law, v = 6.25 cm/s x sqrt(T/0.8), so its slider runs
  0.032-0.8.  The driver is evaluated at each lattice time (PhET samples it
  on a 0.02-s tick), so a pulse is the triangle sampled exactly.  The
  standing-wave and reflection views run their own lattices from rest.
  Frames advance by the real elapsed time, capped at 50 ms.  Changing the
  tension mid-run changes the lattice's clock, as PhET does: every wave on
  the string simply speeds up or slows down.  The dispersion view's lattice
  at a < 1 keeps the same PHYSICAL damping (b scales with a); its bead chain
  is the same lattice at a = 0.05, within 0.04 % (a^2/6) of the continuous-
  time chain's omega(k).

  WHAT IS NOT MODELLED
  --------------------
  Transverse motion only: no longitudinal motion, no gravity and no sag (as
  PhET's own notes say); small slopes (the wave equation is linear); a
  uniform tension that is set, not computed from the stretch; a massless,
  frictionless ring on the loose end; no air, no sound, no energy readout.
-->

   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }

/* tiny DOM helper (only touched when a document exists) */

}

   captured geometry would still lie.  Crossings are interpolated so a clipped

      const t=q/p;

/* ================================================================== *
 *  the model: PhET's bead lattice, exactly.  Every constant marked    *
 *  "PhET's value" was read out of wave-on-a-string_en.html 1.2.4      *
 *  (docs/phets/) and agrees with its doc/model.md.                    *
 * ================================================================== */
const NSEG=60;                 /* PhET's value: 61 beads, indices 0..60 */
const DX=10/80;                /* PhET's value: 10 model units apart at 80 per cm = 0.125 cm */

const BPD=0.1;                 /* PhET's value: beta = (0.2 x damping)/2 per step */
const SLOW=0.25;               /* PhET's value: slow motion */
const AMAX=1.3;                /* PhET's value: amplitude slider and the wrench's travel, cm */
const FMAX=3;                  /* PhET's value: frequency slider, Hz */
const WMIN=0.2, WMAX=1;        /* PhET's value: pulse width slider, s */
const REF_Y0=1.45;             /* PhET's value: the reference line starts 1.45 cm above the string */
const RULER_H=10, RULER_V=5;   /* PhET's value: the rulers are 10 cm and 5 cm long */

function speedOf(T){ return VMAX*Math.sqrt(T/TMAX); }

function dtOf(T){ return DX/speedOf(T); }
function betaOf(d){ return BPD*d; }
/* PhET's own map, kept for the record (header, readout): steps per second linear

/* ---- d'Alembert with images: the lattice at a = 1, b = 0 IS this, sampled ----

    else { ai=[-1,0]; bi=z; }
    const m=csub(bi,cmul(ai,cp[i-1]));
    cp[i]=cdiv(ci,m); dp[i]=cdiv(csub([0,0],cmul(ai,dp[i-1])),m);
  }
  const Y=new Array(n+1); Y[n]=dp[n];
  for(let i=n-1;i>=0;i--) Y[i]=csub(dp[i],cmul(cp[i],Y[i+1]));
  return Y;
}
function steadyMax(S){ let m=0; for(const y of S.Y) m=Math.max(m,cabs(y)); return m; }
/* the undamped resonances: fixed f_n = n v/(2L), loose f_n = (2n-1) v/(4L'), none: none */
function resonances(end,T,fmax){
  const v=speedOf(T), out=[];
  if(end==='fixed') for(let n=1;n*v/(2*LSTR)<=fmax;n++) out.push(n*v/(2*LSTR));
  else if(end==='loose') for(let n=1;(2*n-1)*v/(4*LLOOSE)<=fmax;n++) out.push((2*n-1)*v/(4*LLOOSE));
  return out;
}
/* what the no-end absorber sends back at bead N: q/(p lam^N) = (z lam - 1)/(lam (lam - z)),
   zero at b = 0 (lam = e^{-i theta}); about b/(2 sin theta) for small b */
function noEndReflection(f,b,T){
  const th=steadyTheta(f,T); if(!(th>1e-12)) return 1;
  const C=[Math.cos(th),b*Math.sin(th)], z=[Math.cos(th),Math.sin(th)];
  let lam=csub(C,csqrt(csub(cmul(C,C),[1,0])));
  if(cabs(lam)>1) lam=cdiv([1,0],lam);
  return cabs(cdiv(csub(cmul(z,lam),[1,0]),cmul(lam,csub(lam,z))));
}

/* ---- a triangle pulse on a LONG lattice at Courant number a (the dispersion view) ----
   driven at bead 0 from t = 0, run until the exact pulse centre reaches xcen;
   160 beads: at a <= 1 nothing on the lattice outruns the front (v_g <= v). */
const LONG_N=160;
function longPulse(a,b,A,w,T,xcen){
  const v=speedOf(T), dt=a*DX/v, tstop=xcen/v+w/2;
  const ns=Math.floor(tstop/dt+1e-9), L=makeLat(LONG_N);
  for(let k=1;k<=ns;k++) latStep(L,a,b,'none',A*tri(k*dt/w));
  return {y:Array.from(L.cur),t:ns*dt,steps:ns,dt};
}

/* ================================================================== *
 *  state, the three clocks (the live string, the reflection demo, the *
 *  standing-wave run), the per-view model, readout, eqbar, tag        *
 * ================================================================== */
const TABS=[['str','the string'],['xt','the space-time'],['refl','the reflections'],
            ['stand','the standing waves'],['disp','the dispersion']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', chain:'#9a7fd1', dn:'#5ac8e0', text:'#aeb6c6', bead2:'#5c7a22'};
const RO_W=300;
const MODE_LIST=[{id:'manual',name:'manual'},{id:'osc',name:'oscillate'},{id:'pulse',name:'pulse'}];
const END_LIST=[{id:'fixed',name:'fixed end'},{id:'loose',name:'loose end'},{id:'none',name:'no end'}];
const SPEED_LIST=[{id:'normal',name:'normal'},{id:'slow',name:'slow motion'}];
const ENDS=['fixed','loose','none'];

/* PhET's defaults (manual, fixed end, amplitude 0.75 cm, 1.5 Hz, 0.5 s, damping
   0.2, full tension, playing, normal speed, every tool hidden).  Tool positions
   are world cm: the rulers' zero marks, the reference line's height (PhET's
   1.45 cm), the stopwatch's top-left corner. */
const DEFAULTS={view:'str', mode:'manual', end:'fixed', amp:0.75, freq:1.5, pw:0.5, damping:0.2, tension:TMAX,
                running:true, speed:'normal', rulers:false, stopwatch:false, refline:false, alpha:1,
                rhX:0, rhY:-1.95, rvX:-2.55, rvY:-2.5, refY:REF_Y0, swX:0.3, swY:2.62};
const ST=Object.assign({},DEFAULTS);
const HMAX=240;                 /* the space-time view keeps this many lattice levels: two round trips, so a stripe tilts ~7 degrees */

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function simFactor(st){ return st.speed==='slow'?SLOW:1; }

/* ---- the live string (views 1 and 2) -----------------------------------------
   acc = sim time since the current level; t = the sim time of the current level;
   phase = the oscillator's phase at the current level; wr/wrPrev = the wrench now
   and at the start of this frame (the lattice steps inside a frame see it
   interpolated, as PhET's ticks do); sw = the stopwatch. */
const LIVE={lat:makeLat(NSEG), acc:0, t:0, phase:0, pulseOn:false, pulseT0:0, wr:0, wrPrev:0,
            sw:0, swOn:false, arrows:true, hist:[], histT:[]};
function liveRestart(){
  latClear(LIVE.lat); LIVE.acc=0; LIVE.t=0; LIVE.phase=0; LIVE.pulseOn=false; LIVE.pulseT0=0;
  LIVE.wr=0; LIVE.wrPrev=0; LIVE.hist=[]; LIVE.histT=[];
}
/* the left end at the next lattice time tn; frac = how far through this frame tn falls */
function liveDriver(st,dt,tn,frac){
  if(st.mode==='osc'){ LIVE.phase=(LIVE.phase+TAU*st.freq*dt)%TAU; return st.amp*Math.sin(LIVE.phase); }
  if(st.mode==='pulse'){
    if(!LIVE.pulseOn) return 0;
    const u=(tn-LIVE.pulseT0)/st.pw;
    if(u>=1) LIVE.pulseOn=false;
    return st.amp*tri(u);
  }
  return LIVE.wrPrev+(LIVE.wr-LIVE.wrPrev)*frac;
}
function liveStepOnce(st,frac){
  const dt=dtOf(st.tension), tn=LIVE.t+dt;
  const yl=liveDriver(st,dt,tn,frac===undefined?1:frac);
  latStep(LIVE.lat,1,betaOf(st.damping),st.end,yl);
  LIVE.t=tn;
  LIVE.hist.push(Float64Array.from(LIVE.lat.cur)); LIVE.histT.push(tn);
  if(LIVE.hist.length>HMAX){ LIVE.hist.shift(); LIVE.histT.shift(); }
}
/* a whole number of steps with a guard: 60 frames of 1/60 s leave acc at
   0.019999... < 0.02 and the clock would fall a step behind (Known-bad) */
const STEP_TOL=1e-9;
/* advance the live string by dtSim seconds of simulated time */
function liveAdvance(st,dtSim){
  const dt=dtOf(st.tension), t0=LIVE.t+LIVE.acc;
  LIVE.acc+=dtSim;
  let n=0;
  while(LIVE.acc>=dt*(1-STEP_TOL)){
    LIVE.acc-=dt;
    liveStepOnce(st,dtSim>0?clamp((LIVE.t+dt-t0)/dtSim,0,1):1);
    n++;
  }
  LIVE.wrPrev=LIVE.wr;
  if(LIVE.swOn) LIVE.sw+=dtSim;
  return n;
}
/* the step button: exactly one lattice step, whatever the frame clock says */
function liveStepButton(st){ LIVE.acc=0; liveStepOnce(st,1); LIVE.wrPrev=LIVE.wr; if(LIVE.swOn) LIVE.sw+=dtOf(st.tension); }
function sendPulse(st){
  if(st.mode!=='pulse'||LIVE.pulseOn) return false;
  LIVE.pulseOn=true; LIVE.pulseT0=LIVE.t+LIVE.acc; return true;
}
/* the drawn string: interior beads between the last two levels (PhET's yDraw),
   bead 0 where the driver is NOW */
function liveLeftNow(st){
  if(st.mode==='osc') return st.amp*Math.sin(LIVE.phase+TAU*st.freq*LIVE.acc);
  if(st.mode==='pulse') return LIVE.pulseOn?st.amp*tri((LIVE.t+LIVE.acc-LIVE.pulseT0)/st.pw):0;
  return LIVE.wr;
}
function liveDraw(st){
  const L=LIVE.lat, dt=dtOf(st.tension), s=clamp(LIVE.acc/dt,0,1), y=new Float64Array(NSEG+1);
  for(let i=1;i<=NSEG;i++) y[i]=L.prev[i]+(L.cur[i]-L.prev[i])*s;
  y[0]=liveLeftNow(st);
  if(st.end==='fixed') y[NSEG]=0;
  return y;
}

/* ---- the reflection demo (view 3): one pulse, three ends, undamped, whole steps ---- */
const REFL={key:'', lats:null, n:0, acc:0};
function reflKey(st){ return [st.amp,st.pw,st.tension].join('|'); }
function reflLoop(st){ return 2*NSEG+Math.ceil(st.pw/dtOf(st.tension))+14; }
function reflReset(st){ REFL.lats={fixed:makeLat(NSEG),loose:makeLat(NSEG),none:makeLat(NSEG)}; REFL.n=0; REFL.acc=0; REFL.key=reflKey(st); }
function reflStep(st){
  if(REFL.key!==reflKey(st)) reflReset(st);
  if(REFL.n>=reflLoop(st)) reflReset(st);
  REFL.n++;
  const yl=st.amp*tri(REFL.n*dtOf(st.tension)/st.pw);
  for(const e of ENDS) latStep(REFL.lats[e],1,0,e,yl);
}
function reflAdvance(st,dtSim){
  if(REFL.key!==reflKey(st)) reflReset(st);
  const dt=dtOf(st.tension); REFL.acc+=dtSim; let n=0;
  while(REFL.acc>=dt*(1-STEP_TOL)){ REFL.acc-=dt; reflStep(st); n++; }
  return n;
}
/* the whole demo run once, for the numbers: the reflection each end returns
   (the extreme of y_30 on the way back over the extreme on the way in) and the
   largest departure from d'Alembert anywhere, any step */
function reflSummary(st){
  return memo('reflsum',reflKey(st),()=>{
    const v=speedOf(st.tension), dt=dtOf(st.tension), nL=reflLoop(st), out={};
    const tIn=(30*DX)/v+st.pw, tBack=(2*LSTR-30*DX)/v;
    for(const e of ENDS){
      const L=makeLat(NSEG); let dev=0, inc=0, back=0;
      for(let n=1;n<=nL;n++){
        latStep(L,1,0,e,st.amp*tri(n*dt/st.pw));
        for(let i=0;i<=NSEG;i++) dev=Math.max(dev,Math.abs(L.cur[i]-imageSeries(e,st.amp,st.pw,v,n*dt,i*DX)));
        const y=L.cur[30], t=n*dt;
        if(t<=tIn&&Math.abs(y)>Math.abs(inc)) inc=y;
        if(t>tBack&&t<=tBack+st.pw+dt&&Math.abs(y)>Math.abs(back)) back=y;
      }
      out[e]={dev,inc,back,r:Math.abs(inc)>0?back/inc:NaN};
    }
    return out;
  });
}

/* ---- the standing-wave run (view 4): the oscillator from rest ---- */
const STAND={key:'', lat:null, n:0, acc:0, phase:0};
function standKey(st){ return [st.freq,st.amp,st.damping,st.tension,st.end].join('|'); }
function standReset(st){ STAND.lat=makeLat(NSEG); STAND.n=0; STAND.acc=0; STAND.phase=0; STAND.key=standKey(st); }
function standStep(st){
  if(STAND.key!==standKey(st)) standReset(st);
  const dt=dtOf(st.tension);
  STAND.phase=(STAND.phase+TAU*st.freq*dt)%TAU;
  latStep(STAND.lat,1,betaOf(st.damping),st.end,st.amp*Math.sin(STAND.phase));
  STAND.n++;
}
function standAdvance(st,dtSim){
  if(STAND.key!==standKey(st)) standReset(st);
  const dt=dtOf(st.tension); STAND.acc+=dtSim; let n=0;
  while(STAND.acc>=dt*(1-STEP_TOL)){ STAND.acc-=dt; standStep(st); n++; }
  return n;
}
function standDraw(st){
  const L=STAND.lat, s=clamp(STAND.acc/dtOf(st.tension),0,1), y=new Float64Array(NSEG+1);
  for(let i=0;i<=NSEG;i++) y[i]=L.prev[i]+(L.cur[i]-L.prev[i])*s;
  return y;
}
/* the response curve: the largest steady amplitude anywhere on the string, over A */
const FGRID_N=420, FLO=0.01;
function responseCurve(st){
  return memo('resp',[st.damping,st.tension,st.end].join('|'),()=>{
    const b=betaOf(st.damping), fn=resonances(st.end,st.tension,FMAX);
    const fs=[]; for(let k=0;k<=FGRID_N;k++) fs.push(FLO+(FMAX-FLO)*k/FGRID_N);
    for(const f of fn) fs.push(f);
    fs.sort((a,c)=>a-c);
    const gb=[], g0=[];
    for(const f of fs){
      gb.push(steadyMax(steadyClosed(f,1,b,st.tension,st.end)));
      const onRes=fn.some(x=>Math.abs(x-f)<1e-12);
      g0.push(onRes?NaN:steadyMax(steadyClosed(f,1,0,st.tension,st.end)));
    }
    return {fs,gb,g0,fn,b};
  });
}

/* ---- the dispersion view ---- */
function dispModel(st){
  return memo('disp',[st.alpha,st.damping,st.tension,st.amp,st.pw,st.freq].join('|'),()=>{
    const a=st.alpha, b0=betaOf(st.damping), ba=a*b0;   /* the same PHYSICAL damping at any a */
    const K=[], om=[], omPhet=[], chain=[], cont=[], vp=[], vg=[], vgChain=[];
    for(let k=0;k<=240;k++){
      const kap=Math.PI*k/240; K.push(kap);
      om.push(omegaNorm(kap,a,ba)); omPhet.push(omegaNorm(kap,1,b0)); chain.push(chainOmegaNorm(kap)); cont.push(kap);
      vp.push(kap>0?vpOverV(kap,a,ba):NaN); vg.push(vgOverV(kap,a,ba)); vgChain.push(chainVgOverV(kap));
    }
    const v=speedOf(st.tension), xcen=0.72*LSTR;
    /* the pulses run UNDAMPED, so that only the dispersion changes their shape */
    const P=longPulse(a,0,st.amp,st.pw,st.tension,xcen);
    const Pc=longPulse(0.05,0,st.amp,st.pw,st.tension,xcen);   /* the bead chain (a -> 0, converged to O(a^2)) */
    const ex=t=>{ const y=[]; for(let i=0;i<=NSEG;i++) y.push(st.amp*tri((t-i*DX/v)/st.pw)); return y; };
    const exP=ex(P.t), exC=ex(Pc.t);
    let dev=0, devC=0; for(let i=0;i<=NSEG;i++){ dev=Math.max(dev,Math.abs(P.y[i]-exP[i])); devC=Math.max(devC,Math.abs(Pc.y[i]-exC[i])); }
    /* the oscillator's wave on each dispersion relation: k from omega */
    const thOsc=TAU*st.freq*a*DX/v;                          /* omega dt at this a */
    const sArg=Math.sin(thOsc/2)/a;
    const kOsc=(b0===0&&sArg<=1)?2*Math.asin(sArg):NaN;      /* undamped inverse; with damping solved below */
    return {a,b0,ba,K,om,omPhet,chain,cont,vp,vg,vgChain,P,Pc,exP,exC,dev,devC,v,xcen,
            kOsc:isFinite(kOsc)?kOsc:kapFromOmega(TAU*st.freq*DX/v,a,ba),
            wOsc:TAU*st.freq*DX/v, zone:Math.PI/DX, fChain:v/(Math.PI*DX), fLat:v/(2*a*DX),
            cut:cutoffKap(ba)};
  });
}
/* invert omega dx/v = theta(kap)/a for kap (bisection on the monotone branch) */
function kapFromOmega(wn,a,b){
  let lo=cutoffKap(b), hi=Math.PI;
  if(!(omegaNorm(hi,a,b)>=wn)) return NaN;
  for(let k=0;k<80;k++){ const m=(lo+hi)/2; if(omegaNorm(m,a,b)<wn) lo=m; else hi=m; }
  return (lo+hi)/2;
}

/* ---- the model ---- */
/* the model carries a SNAPSHOT of the state, so a readout rendered later
   cannot read whatever state ran last */
function buildModel(){
  const st=Object.assign({},ST), view=st.view, v=speedOf(st.tension), dt=dtOf(st.tension), b=betaOf(st.damping);
  const M={view,st,v,dt,b,T:st.tension,running:st.running};
  if(view==='str'||view==='xt'){
    M.y=liveDraw(st); M.t=LIVE.t+LIVE.acc; M.steps=LIVE.lat.steps; M.sw=LIVE.sw; M.swOn=LIVE.swOn;
    let mx=0, at=0; for(let i=0;i<=NSEG;i++) if(Math.abs(M.y[i])>mx){ mx=Math.abs(M.y[i]); at=i; }
    M.maxAbs=mx; M.maxAt=at; M.offScale=mx>YHALF;
    M.left=M.y[0]; M.right=M.y[NSEG]; M.pulseOn=LIVE.pulseOn;
    M.lambda=st.freq>0?v/st.freq:Infinity; M.rNone=noEndReflection(st.freq>0?st.freq:1.5,b,st.tension);
    M.phaseNow=LIVE.phase+TAU*st.freq*LIVE.acc;
    if(view==='xt'){ M.hist=LIVE.hist; M.histT=LIVE.histT;
      let hm=mx; for(const r of LIVE.hist) for(let i=0;i<r.length;i++) hm=Math.max(hm,Math.abs(r[i])); M.hmax=hm; }
  }
  if(view==='refl'){
    if(REFL.key!==reflKey(st)) reflReset(st);
    M.n=REFL.n; M.tR=REFL.n*dt; M.loop=reflLoop(st); M.lats=REFL.lats; M.sum=reflSummary(st);
  }
  if(view==='stand'){
    if(STAND.key!==standKey(st)) standReset(st);
    M.S=steadyClosed(st.freq,st.amp,b,st.tension,st.end); M.Smax=steadyMax(M.S);
    M.env=M.S.Y.map(cabs); M.y=standDraw(st); M.n=STAND.n;
    let mx=0; for(let i=0;i<=NSEG;i++) mx=Math.max(mx,Math.abs(M.y[i])); M.latMax=mx;
    M.resp=responseCurve(st); M.fn=M.resp.fn; M.lambda=st.freq>0?v/st.freq:Infinity;
    M.transient=Math.pow(keepPerStep(b),STAND.n);
    let near=null; for(let k=0;k<M.fn.length;k++) if(near===null||Math.abs(M.fn[k]-st.freq)<Math.abs(M.fn[near]-st.freq)) near=k;
    M.near=near; M.rNone=noEndReflection(st.freq,b,st.tension);
    M.nodes=nodesOf(M.env,M.Smax);
  }
  if(view==='disp') M.D=dispModel(st);
  return M;
}
/* nodes: interior local minima of the envelope below 15 % of its maximum, and the fixed end */
function nodesOf(env,mx){
  const out=[];
  for(let i=1;i<NSEG;i++) if(env[i]<=env[i-1]&&env[i]<=env[i+1]&&env[i]<0.15*mx) out.push(i);
  if(env[NSEG]<1e-12*Math.max(mx,1e-300)) out.push(NSEG);
  return out;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
const YHALF=2.7;                /* the string view shows y in [-2.7, 2.7] cm */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function cm(x,n){ return sigf(x,n||3)+' cm'; }
function modeName(m){ return MODE_LIST.find(o=>o.id===m).name; }
function endName(e){ return END_LIST.find(o=>o.id===e).name; }
function endRows(M){
  const st=M.st;
  if(st.end==='fixed') return rrow('fixed end','reflects inverted, r = &minus;1');
  if(st.end==='loose') return rrow('loose end','reflects upright, r = +1')+rrow('&hellip; about','x = '+fmt(LLOOSE,4)+' cm (bead 59&frac12;)');
  return rrow('no end','absorbs: exact at zero damping')+rrow('&hellip; leaks at '+(st.freq>0?fmt(st.freq,2):'1.50')+' Hz','|r| = '+sigf(M.rNone,2),M.rNone>0.02?'bad':'good');
}
function stringRows(M){
  const st=M.st;
  return hd('the string')+rrow('tension T (relative)',fmt(st.tension,3))
    +rrow('wave speed v',fmt(M.v,3)+' cm/s','good')+rrow('lattice step &Delta;t = &Delta;x/v',sigf(M.dt*1000,3)+' ms ('+sigf(1/M.dt,3)+' per s)')
    +rrow('61 beads, 1.25 mm apart',fmt(LSTR,1)+' cm, crossed in '+sigf(LSTR/M.v,3)+' s');
}
function dampRows(M){
  return hd('damping '+fmt(M.st.damping,2))+rrow('&beta; per step',sigf(M.b,3))
    +rrow('kept per bead, e<sup>&minus;atanh &beta;</sup>',sigf(keepPerStep(M.b),4))
    +rrow('decay length &Delta;x/atanh &beta;',isFinite(decayLength(M.b))?cm(decayLength(M.b)):'none');
}
function readoutHTML(M){
  const st=M.st;
  let s='<div class="rname">wave on a string<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  if(M.view==='str'||M.view==='xt'){
    s+=stringRows(M);
    s+=hd('the wave: '+modeName(st.mode));
    if(st.mode==='manual') s+=rrow('wrench height',cm(M.left,3));
    else if(st.mode==='osc') s+=rrow('frequency, period',fmt(st.freq,2)+' Hz, '+(st.freq>0?sigf(1/st.freq,3)+' s':'&infin;'))+rrow('wavelength &lambda; = v/f',isFinite(M.lambda)?cm(M.lambda):'&infin;','good')+rrow('amplitude',cm(st.amp,3));
    else s+=rrow('pulse width w, length v&middot;w',fmt(st.pw,2)+' s, '+cm(M.v*st.pw))+rrow('height',cm(st.amp,3))+rrow('generator',M.pulseOn?'sending':'ready');
    s+=dampRows(M);
    s+=hd('the far end')+endRows(M);
    if(M.view==='str') s+=hd('now')+rrow('t, lattice steps',fmt(M.t,2)+' s, '+M.steps)+rrow('largest |y|',cm(M.maxAbs,3)+' (bead '+M.maxAt+')',M.offScale?'bad':'')
      +(st.stopwatch?rrow('stopwatch',fmt(M.sw,2)+' s'+(M.swOn?' (running)':'')):'');
    else s+=hd('the record')+rrow('levels kept',(M.hist?M.hist.length:0)+' of '+HMAX)+rrow('spanning',M.hist&&M.hist.length>1?fmt(M.histT[M.histT.length-1]-M.histT[0],2)+' s':'&mdash;');
  }
  else if(M.view==='refl'){
    const R=M.sum;
    s+=stringRows(M)+hd('the pulse')+rrow('height A, width w',cm(st.amp,3)+', '+fmt(st.pw,2)+' s')+rrow('step n of the loop',M.n+' / '+M.loop);
    for(const e of ENDS){
      const r=R[e];
      s+=hd(endName(e))+rrow('reflected / incident (bead 30)',isFinite(r.r)?fmt(r.r,3):'&mdash;',e==='none'?'':'good')
        +rrow('max |lattice &minus; d&rsquo;Alembert|',sigf(r.dev,2)+' cm',r.dev<1e-12?'good':'bad');
    }
  }
  else if(M.view==='stand'){
    s+=stringRows(M)+hd('the oscillator')+rrow('frequency f',fmt(st.freq,3)+' Hz')+rrow('wavelength v/f',isFinite(M.lambda)?cm(M.lambda):'&infin;');
    if(M.near!==null){ const n=M.near+1, fn=M.fn[M.near];
      s+=rrow(st.end==='fixed'?'nearest f<sub>'+n+'</sub> = '+n+'v/2L':'nearest f<sub>'+n+'</sub> = '+(2*n-1)+'v/4L&prime;',fmt(fn,4)+' Hz'); }
    else s+=rrow('resonances','none: nothing comes back');
    s+=hd('the steady state (exact)')+rrow('largest amplitude / A',sigf(M.Smax/Math.max(st.amp,1e-300),4),'good')
      +rrow('largest amplitude',cm(M.Smax,4))+rrow('nodes on the string',String(M.nodes.length));
    s+=hd('the lattice run')+rrow('steps from rest',String(M.n))+rrow('its largest |y| now',cm(M.latMax,4))
      +rrow('transient left, (e<sup>&minus;atanh &beta;</sup>)<sup>n</sup>',M.b>0?sigf(M.transient,2):'never decays',M.b>0&&M.transient<1e-3?'good':'bad');
    if(st.end==='none') s+=rrow('the absorber leaks |r|',sigf(M.rNone,2));
  }
  else {
    const D=M.D;
    s+=hd('the lattice')+rrow('Courant number &alpha; = v&Delta;t/&Delta;x',fmt(D.a,2)+(D.a===1?' (PhET)':''))+rrow('wave speed v',fmt(D.v,3)+' cm/s')
      +rrow('zone edge k = &pi;/&Delta;x',sigf(D.zone,3)+' rad/cm')+rrow('lattice Nyquist f = v/2&alpha;&Delta;x',sigf(D.fLat,3)+' Hz')
      +rrow('bead chain tops out at v/&pi;&Delta;x',sigf(D.fChain,3)+' Hz');
    s+=hd('the oscillator, '+fmt(st.freq,2)+' Hz')+rrow('k&Delta;x on the lattice',isFinite(D.kOsc)?sigf(D.kOsc,4)+' rad':'overdamped')
      +rrow('phase speed / v',isFinite(D.kOsc)?sigf(vpOverV(D.kOsc,D.a,D.ba),5):'&mdash;')+rrow('group speed / v',isFinite(D.kOsc)?sigf(vgOverV(D.kOsc,D.a,D.ba),5):'&mdash;');
    s+=hd('the pulse after 5.4 cm, undamped')+rrow('max |lattice &minus; exact| (&alpha; = '+fmt(D.a,2)+')',sigf(D.dev,2)+' cm',D.dev<1e-12?'good':'bad')
      +rrow('bead chain (&alpha; &rarr; 0)',sigf(D.devC,2)+' cm','bad')+rrow('damping &beta; per step at this &alpha;',sigf(D.ba,3));
  }
  s+='</table><div class="note">PhET&rsquo;s lattice steps at &alpha; = v&Delta;t/&Delta;x = 1 exactly: the tension sets the clock, never the stencil. '
    +'PhET&rsquo;s values (61 beads, 0.125 cm, 50 steps/s, &beta; = 0.1 &times; damping) are from its build 1.2.4; everything else is exact and pinned in selfTest to derive.py.</div>';
  return s;
}

function eqbarHTML(M){

    'each bead goes to the sum of its neighbours&rsquo; positions less its own previous one: at &alpha; = 1 that moves every wave exactly one bead per step');
  if(M.view==='xt') return E('<span class="hl">y(x, t) = f(x &minus; vt) + g(x + vt)</span> &nbsp;&middot;&nbsp; y<sub>i</sub><sup>n</sup> = F(n &minus; i) + G(n + i) <span class="rm">on the lattice, exactly</span>',
    'd&rsquo;Alembert: any motion of the string is two shapes sliding in opposite directions at v — the stripes of the space-time picture');

    'the end is a mirror: a fixed end holds y = 0, so the image pulse must arrive upside down; a loose end holds the slope at zero, so it arrives upright');

    'the driven end reflects too, so waves that fit a whole number of round trips pile up: the peak grows as 1/(N&beta;) when the damping goes');
  return E('<span class="hl">(1+&beta;) z&sup2; &minus; 2(1 &minus; 2&alpha;&sup2; sin&sup2;(k&Delta;x/2)) z + (1&minus;&beta;) = 0</span> &nbsp;&middot;&nbsp; &alpha; = 1, &beta; = 0 <span class="rm">&rArr;</span> &omega; = vk &nbsp;&middot;&nbsp; <span class="rm">bead chain:</span> &omega; = (2v/&Delta;x) sin(k&Delta;x/2)',
    'at &alpha; = 1 the time step exactly cancels the chain&rsquo;s dispersion: PhET&rsquo;s beads carry a continuous string, not a chain of beads');

function tagHTML(M){

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  view 1: the string — PhET's screen, drawn at true aspect           *
 * ================================================================== */
const STR_EXT={xmin:-2.62,xmax:8.35,ymin:-YHALF,ymax:YHALF};   /* the left margin holds the vertical ruler clear of the driver */
const SW_W=128, SW_H=48;                 /* the stopwatch, px */
/* the house #hint sits at bottom:11px, on top of the last line of a caption
   anchored at H - 12: every caption here ends HINT_H higher, clear of it */
const HINT_H=18;
/* tick labels follow the tick SPACING, not a fixed decimal count (Known-bad: fmt(t,2)
   prints 318.00 whatever the range, and six of those do not fit a narrow panel) */
function tickFmt(ticks){
  let g=Infinity; for(let i=1;i<ticks.length;i++) g=Math.min(g,Math.abs(ticks[i]-ticks[i-1]));
  if(!isFinite(g)||g<=0) return v=>sigf(v,3);
  let d=0; while(d<6&&Math.abs(Math.round(g*Math.pow(10,d))-g*Math.pow(10,d))>1e-6*Math.max(1,g*Math.pow(10,d))) d++;
  return v=>fmt(Math.abs(v)<1e-12?0:v,d);
}
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  if(o.xticks===undefined) o.xticks=ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  if(o.yticks===undefined) o.yticks=ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  if(!o.xfmt) o.xfmt=tickFmt(o.xticks);
  if(!o.yfmt) o.yfmt=tickFmt(o.yticks);
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
}
function mapLim(map,b){ return [map.wx(b.x),map.wx(b.x1),map.wy(b.y1),map.wy(b.y)]; }
function inLim(x,y,l){ return x>=l[0]&&x<=l[1]&&y>=l[2]&&y<=l[3]; }
function beadR(s){ return Math.max(2.2,0.0625*s*0.92); }   /* PhET's bead radius is 5 model units = 0.0625 cm */

function strCaption(M,sTxt){
  const st=M.st;
  const mode={manual:'Drag the wrench up and down (or use the arrow keys) and a kink runs down the string.',
              osc:'The oscillator’s pin goes round at f; the yoke turns its circle into A sin 2πft at bead 0.',
              pulse:'Click the generator (or press p) for one triangular pulse, A high and w long.'}[st.mode];
  const end={fixed:'The clamp holds bead 60 at zero, so every reflection comes back inverted.',
             loose:'The ring slides on its pole, so reflections come back upright (about bead 59½).',
             none:'Past bead 60 the string runs on out of the window and nothing comes back.'}[st.end];
  return {full:'True aspect: 1 cm = '+sTxt+' px on both axes. 61 beads 1.25 mm apart make 7.5 cm of string; every tenth bead is magenta. '+mode+' '+end,
          short:'True aspect, 1 cm = '+sTxt+' px. '+mode};
}
function strGeo(ctx,W,H,M){
  const narrow=isNarrow(W), left=18, right=narrow?W-18:W-RO_W-40;
  const ph=strCaption(M,'000');
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,ph.full,ph.short,capW,stageTop()+30+180);
  const top=stageTop()+30, b=box(left,top,right-left,Math.max(120,fit.capY-12-top));
  const map=worldFitUp(b,STR_EXT,0);
  return {b,map,fit,full:fit.txt===ph.full,narrow,lim:mapLim(map,b)};
}
/* hit rectangles, world cm (the stopwatch is a pixel box anchored in the world) */
function wrenchRect(y0){ return [-1.5,0.28,y0-0.34,y0+0.34]; }
const GEN_RECT=[-1.5,-0.3,-0.5,0.5];
function rulerHRect(st){ return [st.rhX-0.12,st.rhX+RULER_H+0.12,st.rhY-0.5,st.rhY]; }
function rulerVRect(st){ return [st.rvX,st.rvX+0.5,st.rvY-0.12,st.rvY+RULER_V+0.12]; }
function swRect(map,st,W,H){ return {x:clamp(map.X(st.swX),0,W-SW_W),y:clamp(map.Y(st.swY),0,H-SW_H),w:SW_W,h:SW_H}; }
function inRect(x,y,r){ return x>=r[0]&&x<=r[1]&&y>=r[2]&&y<=r[3]; }

function drawStr(ctx,W,H,M){
  const st=M.st, G=strGeo(ctx,W,H,M), map=G.map, s=map.s, lim=G.lim, X=map.X, Y=map.Y;
  /* the equilibrium line */
  ctx.save(); ctx.setLineDash([4,5]); ctx.strokeStyle='#2a3142'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(st.end==='none'?LSTR+0.66:LSTR),Y(0)); ctx.stroke(); ctx.restore();
  if(st.stopwatch){ const r=swRect(map,st,W,H); LABELS.push([r.x,r.y,r.x+r.w,r.y+r.h]); }   /* labels dodge the stopwatch */
  if(st.refline) drawRefLine(ctx,W,H,map,st);
  drawFarEnd(ctx,W,H,map,M,G);
  const xs=[], ys=[]; for(let i=0;i<=NSEG;i++){ xs.push(i*DX); ys.push(M.y[i]); }
  polyline(ctx,G.b,xs,ys,lim[0],lim[1],lim[2],lim[3],COL.pos,1.5);
  drawBeads(ctx,map,xs,ys,beadR(s),lim);
  drawDriver(ctx,W,H,map,M,lim);
  if(st.rulers){ drawRulerV(ctx,map,st.rvX,st.rvY,H); drawRulerH(ctx,map,st.rhX,st.rhY,W); }
  if(st.stopwatch) drawStopwatch(ctx,W,H,map,M);
  if(M.offScale) lab(ctx,W,H,G.b.x+6,G.b.y+6,'The string leaves the view: |y| = '+fmt(M.maxAbs,2)+' cm at bead '+M.maxAt+'; the view shows ±'+fmt(YHALF,1)+' cm.',COL.ref,LAB_FONT,'left','top');
  const cap=strCaption(M,fmt(s,0));
  caption(ctx,G.b.x,G.fit.capY,G.full?cap.full:cap.short,G.fit.capW,'#767e92',CAP_FONT);
}
function drawBeads(ctx,map,xs,ys,r,lim){
  for(const pass of [0,1]){
    ctx.beginPath(); let any=false;
    for(let i=0;i<xs.length;i++){
      if((i%10===0)!==(pass===1)||!inLim(xs[i],ys[i],lim)) continue;
      const X=map.X(xs[i]), Y=map.Y(ys[i]); ctx.moveTo(X+r,Y); ctx.arc(X,Y,r,0,TAU); any=true;
    }
    if(!any) continue;
    ctx.fillStyle=pass?COL.live:COL.pos; ctx.fill();
    ctx.strokeStyle=pass?'#5e1a5a':COL.bead2; ctx.lineWidth=0.8; ctx.stroke();
  }
}
function drawFarEnd(ctx,W,H,map,M,G){
  const st=M.st, X=map.X, Y=map.Y, s=map.s, xe=LSTR, yN=M.y[NSEG];
  if(st.end==='fixed'){
    const x0=X(xe)+beadR(s)*0.6, x1=X(xe+0.38), y0=Y(0.34), y1=Y(-0.34);
    ctx.fillStyle='#232a38'; ctx.fillRect(x0,y0,x1-x0,y1-y0);
    ctx.strokeStyle=COL.struct; ctx.lineWidth=1.2; ctx.strokeRect(x0,y0,x1-x0,y1-y0);
    ctx.beginPath(); for(let k=1;k<5;k++){ const yy=y0+(y1-y0)*k/5; ctx.moveTo(x0+2,yy); ctx.lineTo(x1-2,yy+(y1-y0)/10); }
    ctx.strokeStyle='#3d6f7e'; ctx.lineWidth=1; ctx.stroke();
  } else if(st.end==='loose'){
    const Xp=X(xe);
    ctx.beginPath(); ctx.moveTo(Xp,Y(-YHALF+0.3)); ctx.lineTo(Xp,Y(YHALF-0.3));
    ctx.strokeStyle=COL.struct; ctx.lineWidth=Math.max(2,0.05*s); ctx.stroke();
    ctx.fillStyle='#232a38'; ctx.fillRect(Xp-0.22*s,Y(-YHALF+0.3),0.44*s,0.12*s);
    if(Math.abs(yN)<=YHALF-0.2){
      ctx.beginPath(); ctx.arc(Xp,Y(yN),0.15*s,0,TAU);
      ctx.strokeStyle='#e9e9f0'; ctx.lineWidth=Math.max(1.6,0.035*s); ctx.stroke();
    }
  } else {
    /* the window: the string runs on and out; a fading, dotted continuation */
    const x0=X(xe+0.08), x1=X(xe+0.7), y0=Y(1.7), y1=Y(-1.7);
    ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle=COL.struct; ctx.lineWidth=1; ctx.strokeRect(x0,y0,x1-x0,y1-y0); ctx.restore();
    const slope=(M.y[NSEG]-M.y[NSEG-1])/DX;
    for(let k=1;k<=5;k++){
      const xx=xe+k*0.11, yy=yN+slope*k*0.11;

/* ================================================================== *
 *  view 2: the space-time — the string's recent past, t running up    *
 * ================================================================== */
const XT_CAP_FULL='Each row is one lattice step of the string you are driving (up to the last '+HMAX+'), newest at the top: green is up, cyan is down, '
  +'brighter is further from rest. A wave is a stripe whose tilt is set by v; the dashed orange lines are x ± vt = constant at the current speed, and every '
  +'stripe follows one. At the clamp a green stripe comes back cyan (inverted); at the ring it keeps its colour; with no end it simply leaves.';
const XT_CAP_SHORT='The string’s last '+HMAX+' steps, newest at the top: green up, cyan down. Stripes run along x ± vt (dashed).';
function xtGeo(ctx,W,H){
  const narrow=isNarrow(W), left=62, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,XT_CAP_FULL,XT_CAP_SHORT,capW,stageTop()+30+240);
  const top=stageTop()+34, avail=fit.capY-44-top;
  const sh=clamp(Math.round(avail*0.2),56,120);
  return {fit,sb:box(left,top+8,right-left,sh),mb:box(left,top+8+sh+34,right-left,Math.max(60,avail-sh-42)),narrow};
}
function drawXT(ctx,W,H,M){
  const G=xtGeo(ctx,W,H), sb=G.sb, mb=G.mb, v=M.v;
  const ym=Math.max(0.5,1.15*M.hmax);
  axesT(ctx,sb,0,LSTR,-ym,ym,{title:titleFor(sb,'the string now, y against x','the string now'),ylab:'y, cm',xticks:[],yticks:sparseTicks(-ym,ym,sb.h)});
  const xs=[], ys=[]; for(let i=0;i<=NSEG;i++){ xs.push(i*DX); ys.push(M.y[i]); }
  polyline(ctx,sb,xs,ys,0,LSTR,-ym,ym,COL.pos,1.5);
  const H0=M.hist, T0=M.histT, n=H0.length;
  const span=n>1?Math.max(T0[n-1]-T0[0]+M.dt,1e-6):HMAX*M.dt;
  axesT(ctx,mb,0,LSTR,-span,0,{title:n?titleFor(mb,'the last '+n+' lattice steps, time running up','the last '+n+' steps'):'the record, empty',xlab:'x, cm (bead 0 at the left)',ylab:'t − now, s'});
  if(n===0){ lab(ctx,W,H,mb.x+mb.w/2,mb.y+mb.h/2,'nothing recorded yet: the picture fills as the string runs',COL.dim,LAB_FONT,'center','middle'); }
  else {
    const NL=12, bins=[];
    for(let j=0;j<2*NL;j++) bins.push([]);
    const tNow=T0[n-1], cw=mb.w/NSEG;
    for(let k=0;k<n;k++){
      const tHi=T0[k]-tNow, tLo=tHi-(k>0?T0[k]-T0[k-1]:M.dt);
      const yTop=mb.y+mb.h*(-tHi)/span, yBot=Math.min(mb.y1,mb.y+mb.h*(-tLo)/span);
      if(yTop>=mb.y1) continue;
      const row=H0[k];
      for(let i=0;i<=NSEG;i++){
        const u=Math.min(1,Math.abs(row[i])/(M.hmax||1)), j=Math.floor(u*NL);
        if(j<1) continue;
        const xL=Math.max(mb.x,mb.x+(i-0.5)*cw), xR=Math.min(mb.x1,mb.x+(i+0.5)*cw);
        bins[(row[i]>0?0:NL)+Math.min(j,NL)-1].push(xL,yTop,xR-xL+0.6,yBot-yTop+0.6);
      }
    }
    for(let j=0;j<2*NL;j++){
      const r=bins[j]; if(!r.length) continue;
      ctx.beginPath(); for(let q=0;q<r.length;q+=4) ctx.rect(r[q],r[q+1],r[q+2],r[q+3]);
      const lev=((j%NL)+1.5)/NL;

    }
  }
  /* the characteristics at the current speed */
  const tc=LSTR/v;
  for(let c=-span-2*tc;c<=tc;c+=tc){
    polyline(ctx,mb,[0,LSTR],[c,c+tc],0,LSTR,-span,0,rgba(COL.ref,0.8),1,[5,5]);
    polyline(ctx,mb,[LSTR,0],[c,c+tc],0,LSTR,-span,0,rgba(COL.ref,0.8),1,[5,5]);
  }
  if(n&&M.hmax>0) lab(ctx,W,H,mb.x1-4,mb.y-9,'full colour = ±'+fmt(M.hmax,2)+' cm',COL.dim,SM_FONT,'right','bottom');
  caption(ctx,mb.x,G.fit.capY,G.fit.txt,G.fit.capW,'#767e92',CAP_FONT);
}

/* ================================================================== *
 *  view 3: the reflections — one pulse, three ends, the images        *
 * ================================================================== */
const REFL_CAP_FULL='One pulse, A high and w long, goes into three strings at once, with no damping. Green is the lattice; this view moves in whole '
  +'steps, so every frame is a lattice level. Orange is d’Alembert with an image: the incident pulse (dashed) runs on past the end into the mirror '
  +'world (shaded), its image (dotted) runs back out, and their sum (the orange halo) goes through every bead. The clamp needs y = 0, so its image is inverted; '
  +'the ring needs zero slope, so its image is upright, mirrored about bead 59½; the open end has no image at all.';
const REFL_CAP_SHORT='One pulse, three ends, no damping: green lattice on orange d’Alembert-with-images. Fixed inverts, loose does not, open absorbs.';
const REFL_XHI=LSTR+2.2;
function reflGeo(ctx,W,H){
  const narrow=isNarrow(W), left=62, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,REFL_CAP_FULL,REFL_CAP_SHORT,capW,stageTop()+30+300);
  const top=stageTop()+30, avail=fit.capY-40-top, gap=30, h=Math.max(40,(avail-2*gap-18)/3);
  const strips=[0,1,2].map(k=>box(left,top+18+k*(h+gap),right-left,h));
  return {fit,strips,narrow};
}
/* the incident and reflected parts along the whole drawn range, mirror world included */
function reflCurves(end,A,w,v,t,n){
  const Lr=end==='fixed'?LSTR:LLOOSE, sr=end==='fixed'?-1:1, f=tau=>A*tri(tau/w);
  const xs=[], inc=[], ref=[], sum=[];
  for(let k=0;k<=n;k++){
    const x=REFL_XHI*k/n; xs.push(x);
    let a=0, b=0, rt=1;
    if(end==='none') a=f(t-x/v);
    else for(let m=0;m<1000;m++){
      const t1=t-(2*m*Lr+x)/v, t2=t-(2*(m+1)*Lr-x)/v;
      if(t1<=0&&t2<=0) break;
      a+=rt*f(t1); b+=rt*sr*f(t2); rt*=-sr;
    }
    inc.push(a); ref.push(b); sum.push(x<=(end==='none'?LSTR:Lr)?a+b:NaN);
  }
  return {xs,inc,ref,sum,Lr};
}
function drawRefl(ctx,W,H,M){
  const st=M.st, G=reflGeo(ctx,W,H), A=Math.max(st.amp,0.05), ylo=-2.3*A, yhi=2.3*A, t=M.tR;
  const TITLES={fixed:['fixed end: y₆₀ = 0, so the image comes back inverted','fixed end'],
                loose:['loose end: y₆₀ = y₅₉, so the image comes back upright','loose end'],
                none:['no end: y₆₀ follows y₅₉ one step late, and nothing comes back','no end']};
  ENDS.forEach((e,k)=>{
    const b=G.strips[k], last=k===2, C=reflCurves(e,st.amp,st.pw,M.v,t,360), R=M.sum[e];
    const XL=b.x+b.w*(e==='none'?LSTR:C.Lr)/REFL_XHI;
    ctx.fillStyle='#0d1322'; ctx.fillRect(XL,b.y,b.x1-XL,b.h);
    axesT(ctx,b,0,REFL_XHI,ylo,yhi,{title:titleFor(b,TITLES[e][0]+(isFinite(R.r)?'  (r = '+fmt(R.r,3)+')':''),TITLES[e][1]),
      xticks:last?undefined:[],yticks:[-2*A,-A,0,A,2*A].filter(v=>Math.abs(v)<=2.3*A),yfmt:v=>fmt(v,2),xlab:last?'x, cm (the string ends at 7.5 cm; shaded: the mirror world)':undefined,ylab:k===1?'y, cm':undefined});
    ctx.save(); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(XL,b.y); ctx.lineTo(XL,b.y1); ctx.strokeStyle=COL.live; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
    polyline(ctx,b,C.xs,C.inc,0,REFL_XHI,ylo,yhi,COL.ref,1.1,[6,4]);
    if(e!=='none') polyline(ctx,b,C.xs,C.ref,0,REFL_XHI,ylo,yhi,COL.ref,1.1,[2,3]);
    /* the exact sum lies exactly under the lattice, so it is drawn as an opaque orange halo round it */
    polyline(ctx,b,C.xs,C.sum,0,REFL_XHI,ylo,yhi,shade(COL.ref,0.55),6);
    const L=M.lats[e], xs=[], ys=[]; for(let i=0;i<=NSEG;i++){ xs.push(i*DX); ys.push(L.cur[i]); }
    polyline(ctx,b,xs,ys,0,REFL_XHI,ylo,yhi,COL.pos,1.6);
    const r=Math.max(1.6,Math.min(3.2,b.w/REFL_XHI*DX*0.36));
    ctx.beginPath(); for(let i=0;i<=NSEG;i++){ const X=b.x+b.w*xs[i]/REFL_XHI, Y=b.y1-b.h*(ys[i]-ylo)/(yhi-ylo); if(Y>=b.y&&Y<=b.y1){ ctx.moveTo(X+r,Y); ctx.arc(X,Y,r,0,TAU); } }
    ctx.fillStyle=COL.pos; ctx.fill();
  });
  const b0=G.strips[0], sx=b0.w/REFL_XHI, sy=b0.h/(yhi-ylo);
  lab(ctx,W,H,b0.x1-4,b0.y-9,'step '+M.n+' of '+M.loop+'   vertical ×'+sigf(sy/sx,2),COL.dim,SM_FONT,'right','bottom');
  caption(ctx,b0.x,G.fit.capY,G.fit.txt,G.fit.capW,'#767e92',CAP_FONT);

/* ================================================================== *
 *  view 4: the standing waves — the response sweep and the build-up   *
 * ================================================================== */
const STAND_CAP_FULL='Top: how hard the string answers the oscillator — the largest steady amplitude anywhere on it, over the driving amplitude A, against '
  +'the frequency (log scale). Green is this damping, exactly; dashed orange is no damping, which diverges at every resonance fₙ (cyan ticks). '
  +'Drag across the top panel to set f. Bottom: the lattice driven from rest at f (green) growing into the exact steady state, whose envelope '
  +'±|Yᵢ| is orange; the vertical scale is stretched by the printed factor.';
const STAND_CAP_SHORT='Top: the steady response against f (drag to set f). Bottom: the string from rest (green) inside the exact envelope (orange).';
function standGeo(ctx,W,H){
  const narrow=isNarrow(W), left=64, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,STAND_CAP_FULL,STAND_CAP_SHORT,capW,stageTop()+30+260);
  const top=stageTop()+34, avail=fit.capY-top-44, gap=58;
  const th=Math.max(60,Math.floor((avail-gap)*0.46));
  return {fit,tb:box(left,top+14,right-left,th),bb:box(left,top+14+th+gap,right-left,Math.max(50,avail-th-gap-14)),narrow};
}
function freqAt(tb,x){ return Math.round(clamp((x-tb.x)/tb.w,0,1)*FMAX*100)/100; }
function drawStand(ctx,W,H,M){
  const st=M.st, G=standGeo(ctx,W,H), tb=G.tb, bb=G.bb, R=M.resp;
  let pk=1; for(const g of R.gb) if(isFinite(g)) pk=Math.max(pk,g);
  const ly1=Math.log10(Math.min(1000,Math.max(3,1.6*pk))), ly0=Math.log10(0.5);
  const yt=[0,1,2,3].filter(v=>v<=ly1+1e-9);
  axesT(ctx,tb,0,FMAX,ly0,ly1,{title:titleFor(tb,'the steady response: largest |Y| on the string over A, against the driving frequency','largest |Y|/A against f'),
    xlab:'driving frequency f, Hz',ylab:'|Y|max / A',yticks:yt,yfmt:v=>String(Math.round(Math.pow(10,v)))});
  const lg=a=>a.map(g=>isFinite(g)&&g>0?Math.log10(g):NaN);
  polyline(ctx,tb,R.fs,lg(R.gb),0,FMAX,ly0,ly1,COL.pos,1.7);
  polyline(ctx,tb,R.fs,lg(R.g0),0,FMAX,ly0,ly1,COL.ref,1.1,[5,4]);
  if(!R.fn.length) lab(ctx,W,H,tb.x+tb.w/2,tb.y+tb.h*0.35,'no end: nothing comes back to pile up, so there are no resonances — the response is flat at A',COL.dim,LAB_FONT,'center','middle');
  ctx.beginPath();
  for(const f of R.fn){ const X=tb.x+tb.w*f/FMAX; ctx.moveTo(X,tb.y); ctx.lineTo(X,tb.y+8); }
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.4; ctx.stroke();
  R.fn.forEach((f,k)=>{ if(R.fn.length<=12||k%2===0) lab(ctx,W,H,tb.x+tb.w*f/FMAX,tb.y+10,String(k+1),COL.struct,SM_FONT,'center','top'); });
  const Xf=tb.x+tb.w*st.freq/FMAX, gA=M.Smax/Math.max(st.amp,1e-300);
  ctx.save(); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(Xf,tb.y); ctx.lineTo(Xf,tb.y1); ctx.strokeStyle=rgba(COL.live,0.7); ctx.lineWidth=1; ctx.stroke(); ctx.restore();
  if(st.amp>0&&isFinite(gA)) marker(ctx,tb,0,FMAX,ly0,ly1,st.freq,Math.log10(Math.max(gA,1)),COL.live);
  /* the string */
  const ym=Math.max(0.05,1.15*Math.max(M.Smax,M.latMax));
  axesT(ctx,bb,0,LSTR,-ym,ym,{title:titleFor(bb,'the string at '+fmt(st.freq,2)+' Hz: the lattice from rest inside the exact envelope','the string at '+fmt(st.freq,2)+' Hz'),
    xlab:'x, cm',ylab:'y, cm',yticks:sparseTicks(-ym,ym,bb.h)});
  const xs=[], up=[], dn=[], ys=[]; for(let i=0;i<=NSEG;i++){ xs.push(i*DX); up.push(M.env[i]); dn.push(-M.env[i]); ys.push(M.y[i]); }
  ctx.beginPath();
  for(let i=0;i<=NSEG;i++){ const X=bb.x+bb.w*xs[i]/LSTR, Y=bb.y1-bb.h*(clamp(up[i],-ym,ym)+ym)/(2*ym); if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }
  for(let i=NSEG;i>=0;i--){ const X=bb.x+bb.w*xs[i]/LSTR, Y=bb.y1-bb.h*(clamp(dn[i],-ym,ym)+ym)/(2*ym); ctx.lineTo(X,Y); }
  ctx.closePath(); ctx.fillStyle=rgba(COL.ref,0.1); ctx.fill();
  polyline(ctx,bb,xs,up,0,LSTR,-ym,ym,COL.ref,1.2); polyline(ctx,bb,xs,dn,0,LSTR,-ym,ym,COL.ref,1.2);
  polyline(ctx,bb,xs,ys,0,LSTR,-ym,ym,COL.pos,1.6);
  { const r=Math.max(1.6,Math.min(3.2,bb.w/LSTR*DX*0.36)); ctx.beginPath();
    for(let i=0;i<=NSEG;i++){ const X=bb.x+bb.w*xs[i]/LSTR, Y=bb.y1-bb.h*(ys[i]+ym)/(2*ym); if(Y>=bb.y&&Y<=bb.y1){ ctx.moveTo(X+r,Y); ctx.arc(X,Y,r,0,TAU); } }
    ctx.fillStyle=COL.pos; ctx.fill(); }
  ctx.beginPath();
  for(const i of M.nodes){ const X=bb.x+bb.w*i*DX/LSTR, Y=bb.y1-bb.h*0.5; ctx.moveTo(X,Y-6); ctx.lineTo(X,Y+6); }
  ctx.strokeStyle=COL.struct; ctx.lineWidth=1.6; ctx.stroke();
  const sx=bb.w/LSTR, sy=bb.h/(2*ym);
  lab(ctx,W,H,bb.x1-4,bb.y-9,'vertical ×'+sigf(sy/sx,2)+'   step '+M.n+' from rest',COL.dim,SM_FONT,'right','bottom');
  if(!(M.b>0)) lab(ctx,W,H,bb.x+6,bb.y+6,'no damping: nothing takes energy out, so at a resonance the amplitude grows without end',COL.ref,SM_FONT,'left','top');
  caption(ctx,tb.x,G.fit.capY,G.fit.txt,G.fit.capW,'#767e92',CAP_FONT);
}

/* ================================================================== *
 *  view 5: the dispersion — the lattice, the continuum, a bead chain  *
 * ================================================================== */
const DISP_CAP_FULL='Left: frequency against wavenumber across the whole zone (kΔx from 0 to π: two beads a wavelength at the edge). Orange dashed is the '
  +'continuous string, ω = vk. Green is the lattice at Courant number α = vΔt/Δx (PhET runs at α = 1, on the orange line). Violet is a '
  +'real chain of beads on springs, ω = (2v/Δx) sin(kΔx/2), the α → 0 limit. Right: phase (dashed) and group (solid) speed over v. '
  +'Bottom: one triangular pulse after 5.4 cm on each; only the α = 1 lattice keeps its shape.';
const DISP_CAP_NARROW='Top: frequency against wavenumber across the zone. Orange dashed is the continuous string, ω = vk; green is the lattice at Courant '
  +'number α (PhET’s α = 1 lies on the orange line); violet is a real bead chain, the α → 0 limit. Bottom: one triangular pulse after '
  +'5.4 cm on each; only the α = 1 lattice keeps its shape. (The speeds panel needs a wider window.)';
const DISP_CAP_SHORT='ω(k): continuum (orange), the lattice at α (green; PhET’s α = 1 is exact), a bead chain (violet); below, the pulse after 5.4 cm.';
function dispGeo(ctx,W,H){
  const narrow=isNarrow(W), left=64, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,narrow?DISP_CAP_NARROW:DISP_CAP_FULL,DISP_CAP_SHORT,capW,stageTop()+30+280);
  const top=stageTop()+34, avail=fit.capY-top-44, gapV=58, gapH=74;
  const th=Math.max(70,Math.floor((avail-gapV)*0.55)), span=right-left;
  if(narrow) return {fit,narrow,wb:box(left,top+14,span,th),sb:null,pb:box(left,top+14+th+gapV,span,Math.max(50,avail-th-gapV-14))};
  const w1=Math.floor((span-gapH)*0.55);
  return {fit,narrow,wb:box(left,top+14,w1,th),sb:box(left+w1+gapH,top+14,span-w1-gapH,th),pb:box(left,top+14+th+gapV,span,Math.max(50,avail-th-gapV-14))};
}
function drawDisp(ctx,W,H,M){
  const D=M.D, st=M.st, G=dispGeo(ctx,W,H), wb=G.wb, sb=G.sb, pb=G.pb, PI1=Math.PI;
  axesT(ctx,wb,0,PI1,0,PI1*1.04,{title:titleFor(wb,'ωΔx/v against kΔx, the whole zone','ω(k)'),xlab:'kΔx, rad per bead',ylab:'ωΔx / v',
    xticks:[0,0.5,1,1.5,2,2.5,3],yticks:[0,1,2,3]});
  polyline(ctx,wb,D.K,D.chain,0,PI1,0,PI1*1.04,COL.chain,1.6);
  polyline(ctx,wb,D.K,D.om,0,PI1,0,PI1*1.04,COL.pos,1.8);
  polyline(ctx,wb,D.K,D.cont,0,PI1,0,PI1*1.04,COL.ref,1.3,[6,4]);      /* on top: at a = 1 it lies ON the green */
  if(isFinite(D.kOsc)) marker(ctx,wb,0,PI1,0,PI1*1.04,D.kOsc,omegaNorm(D.kOsc,D.a,D.ba),COL.live);
  legendAuto(ctx,wb,[[COL.pos,'lattice, α = '+fmt(D.a,2)],[COL.ref,'continuum, ω = vk'],[COL.chain,'bead chain (α → 0)'],[COL.live,'the oscillator, '+fmt(st.freq,2)+' Hz']]);
  if(sb){
    axesT(ctx,sb,0,PI1,0,1.15,{title:titleFor(sb,'phase and group speed over v','speeds / v'),xlab:'kΔx',ylab:'speed / v',xticks:[0,1,2,3],yticks:[0,0.25,0.5,0.75,1],yfmt:v=>fmt(v,2)});
    const vpc=D.K.map(k=>k>0?2*Math.sin(k/2)/k:1);
    polyline(ctx,sb,D.K,vpc,0,PI1,0,1.15,COL.chain,1.2,[4,3]);
    polyline(ctx,sb,D.K,D.vgChain,0,PI1,0,1.15,COL.chain,1.6);
    polyline(ctx,sb,D.K,D.vp,0,PI1,0,1.15,COL.pos,1.2,[4,3]);
    polyline(ctx,sb,D.K,D.vg,0,PI1,0,1.15,COL.pos,1.8);
    polyline(ctx,sb,[0,PI1],[1,1],0,PI1,0,1.15,COL.ref,1.2,[6,4]);
  }
  const Ap=Math.max(st.amp,0.05), plo=-0.4*Ap, phi=1.18*Ap, xs=[];
  for(let i=0;i<=NSEG;i++) xs.push(i*DX);
  axesT(ctx,pb,0,LSTR,plo,phi,{title:titleFor(pb,'one pulse, undamped, after its centre has run '+fmt(D.xcen,2)+' cm, on each','the pulse after '+fmt(D.xcen,2)+' cm'),
    xlab:'x, cm',ylab:'y, cm',yticks:sparseTicks(plo,phi,pb.h)});
  const xf=[], yf=[]; for(let k=0;k<=600;k++){ const x=LSTR*k/600; xf.push(x); yf.push(st.amp*tri((D.P.t-x/D.v)/st.pw)); }
  polyline(ctx,pb,xs,D.Pc.y.slice(0,NSEG+1),0,LSTR,plo,phi,COL.chain,1.6);
  polyline(ctx,pb,xs,D.P.y.slice(0,NSEG+1),0,LSTR,plo,phi,COL.pos,1.7);
  polyline(ctx,pb,xf,yf,0,LSTR,plo,phi,COL.ref,1.2,[5,4]);             /* on top, dashed: at a = 1 the lattice is under it */
  const r=2.2;
  ctx.beginPath(); for(let i=0;i<=NSEG;i++){ const X=pb.x+pb.w*xs[i]/LSTR, Y=pb.y1-pb.h*(D.P.y[i]-plo)/(phi-plo); if(Y>=pb.y&&Y<=pb.y1){ ctx.moveTo(X+r,Y); ctx.arc(X,Y,r,0,TAU); } }
  ctx.fillStyle=COL.pos; ctx.fill();
  legendAuto(ctx,pb,[[COL.ref,'exact: the triangle moved at v (dashed)'],[COL.pos,'the lattice at α = '+fmt(D.a,2)],[COL.chain,'the bead chain']]);
  caption(ctx,wb.x,G.fit.capY,G.fit.txt,G.fit.capW,'#767e92',CAP_FONT);
}

/* ================================================================== *
 *  dispatch and the scene                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='str') drawStr(ctx,W,H,M);
  else if(M.view==='xt') drawXT(ctx,W,H,M);
  else if(M.view==='refl') drawRefl(ctx,W,H,M);
  else if(M.view==='stand') drawStand(ctx,W,H,M);
  else drawDisp(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame of dtWall seconds: the live string in views 1-2, each demo in its own view */
  S.step=function(dtWall){
    if(!ST.running) return false;
    const dts=(dtWall||0)*simFactor(ST);
    if(!(dts>0)) return false;
    const v=ST.view;
    if(v==='str'||v==='xt'){ liveAdvance(ST,dts); return true; }
    if(v==='refl') return reflAdvance(ST,dts)>0;
    if(v==='stand'){ standAdvance(ST,dts); return true; }
    return false;
  };
  /* the pointer: the wrench, the pulse generator and PhET's three tools on the string;
     the frequency on the standing waves' response panel */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const ctx=canvas.getContext('2d');
    if(ST.view==='str'){
      const G=strGeo(ctx,S.W,S.H,buildModel()), map=G.map, wx=map.wx(x), wy=map.wy(y), l=G.lim;
      if(type==='down'){
        if(ST.stopwatch){ const r=swRect(map,ST,S.W,S.H); if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ DRAG.what='sw'; DRAG.ox=x-r.x; DRAG.oy=y-r.y; return true; } }
        if(ST.rulers){
          if(inRect(wx,wy,rulerVRect(ST))){ DRAG.what='rv'; DRAG.ox=ST.rvX-wx; DRAG.oy=ST.rvY-wy; return true; }
          if(inRect(wx,wy,rulerHRect(ST))){ DRAG.what='rh'; DRAG.ox=ST.rhX-wx; DRAG.oy=ST.rhY-wy; return true; }
        }
        if(ST.refline&&Math.abs(y-map.Y(ST.refY))<=7&&wx>=-0.6&&wx<=LSTR+0.4){ DRAG.what='ref'; DRAG.oy=ST.refY-wy; return true; }
        if(ST.mode==='manual'&&inRect(wx,wy,wrenchRect(LIVE.wr))){ DRAG.what='wrench'; DRAG.oy=LIVE.wr-wy; LIVE.arrows=false; return true; }
        if(ST.mode==='pulse'&&inRect(wx,wy,GEN_RECT)){ const sent=sendPulse(ST); if(sent) ST.running=true; return sent; }
        return false;
      }
      if(type==='move'){
        if(DRAG.what==='wrench'){ LIVE.wr=clamp(wy+DRAG.oy,-AMAX,AMAX); ST.running=true; return true; }   /* PhET: the wrench also presses play */
        if(DRAG.what==='rh'){ ST.rhX=clamp(wx+DRAG.ox,l[0]-RULER_H+0.6,l[1]-0.6); ST.rhY=clamp(wy+DRAG.oy,l[2]+0.5,l[3]); return true; }
        if(DRAG.what==='rv'){ ST.rvX=clamp(wx+DRAG.ox,l[0],l[1]-0.5); ST.rvY=clamp(wy+DRAG.oy,l[2]-RULER_V+0.6,l[3]-0.6); return true; }
        if(DRAG.what==='ref'){ ST.refY=clamp(wy+DRAG.oy,l[2]+0.05,l[3]-0.05); return true; }
        if(DRAG.what==='sw'){ ST.swX=map.wx(clamp(x-DRAG.ox,0,S.W-SW_W)); ST.swY=map.wy(clamp(y-DRAG.oy,0,S.H-SW_H)); return true; }
      }
      return false;
    }
    if(ST.view==='stand'){
      const tb=standGeo(ctx,S.W,S.H).tb;
      if(type==='down'){ if(x>=tb.x&&x<=tb.x1&&y>=tb.y&&y<=tb.y1){ DRAG.what='freq'; ST.freq=freqAt(tb,x); return true; } return false; }
      if(type==='move'&&DRAG.what==='freq'){ ST.freq=freqAt(tb,x); return true; }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2));
  });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        const was=st[key]; st[key]=o.id; if(onPick) onPick(o,was);
        [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS=[];
  function trackChips(g,list,key){ CHIPROWS.push([g,list,key]); }
  function btn(label,fn){ return h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},label); }

  /* PhET: switching the wave mode restarts the string; switching to the fixed end zeroes bead 60 */
  const gWave=h('div',{class:'grp'},h('h3',null,'the wave'));
  const modeChips=chipRow(MODE_LIST,'mode',(o,was)=>{ if(o.id!==was) liveRestart(); }); gWave.appendChild(modeChips); trackChips(gWave,MODE_LIST,'mode');
  const pulseBtn=h('div',{class:'btnrow'},btn('send a pulse',()=>{ if(sendPulse(st)) st.running=true; }));
  gWave.appendChild(pulseBtn);
  gWave.appendChild(slider('amp','amplitude, cm',0,AMAX,0.01,v=>fmt(v,2)+' cm'));
  gWave.appendChild(slider('freq','frequency, Hz',0,FMAX,0.01,v=>fmt(v,2)+' Hz'));
  gWave.appendChild(slider('pw','pulse width, s',WMIN,WMAX,0.01,v=>fmt(v,2)+' s'));
  const waveTag=h('div',{class:'tag'}); gWave.appendChild(waveTag);

  const gString=h('div',{class:'grp'},h('h3',null,'the string'));
  gString.appendChild(slider('damping','damping',0,1,0.01,v=>fmt(v,2)));
  gString.appendChild(slider('tension','tension (relative)',TMIN,TMAX,0.001,v=>fmt(v,3)));
  const endChips=chipRow(END_LIST,'end',o=>{ if(o.id==='fixed'){ LIVE.lat.cur[NSEG]=0; LIVE.lat.prev[NSEG]=0; } });
  gString.appendChild(endChips); trackChips(gString,END_LIST,'end');
  const stringTag=h('div',{class:'tag'}); gString.appendChild(stringTag);

  const restartView=()=>{ if(st.view==='refl') reflReset(st); else if(st.view==='stand') standReset(st); else liveRestart(); };
  const stepView=()=>{ if(st.view==='refl') reflStep(st); else if(st.view==='stand') standStep(st); else liveStepButton(st); };
  const gTime=h('div',{class:'grp'},h('h3',null,'time'));
  gTime.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  const speedChips=chipRow(SPEED_LIST,'speed'); gTime.appendChild(speedChips); trackChips(gTime,SPEED_LIST,'speed');
  gTime.appendChild(h('div',{class:'btnrow'},btn('step',stepView),btn('restart string',restartView),
    btn('reset all',()=>{ const v=st.view; Object.assign(st,DEFAULTS); st.view=v; liveRestart(); LIVE.sw=0; LIVE.swOn=false; LIVE.arrows=true;
      reflReset(st); standReset(st); syncChips(); })));
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  const gTools=h('div',{class:'grp'},h('h3',null,'tools'));
  gTools.appendChild(h('div',{class:'checks'},checkbox('rulers','rulers'),checkbox('stopwatch','stopwatch'),checkbox('refline','reference line')));
  const swBtns=h('div',{class:'btnrow'},btn('start / stop',()=>{ LIVE.swOn=!LIVE.swOn; }),btn('clear',()=>{ LIVE.sw=0; }));
  gTools.appendChild(swBtns);
  const toolTag=h('div',{class:'tag'}); gTools.appendChild(toolTag);

  const gLat=h('div',{class:'grp'},h('h3',null,'the lattice'));
  gLat.appendChild(slider('alpha','Courant number α',0.05,1,0.01,v=>fmt(v,2)));
  const latTag=h('div',{class:'tag'}); gLat.appendChild(latTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Wave on a String (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). '
      +'New code; no PhET code or assets. PhET&rsquo;s values (61 beads 0.125 cm apart, 50 steps a second at full tension, &beta; = 0.1 &times; damping, '
      +'the slider ranges, the end rules, the triangular pulse) are read from its build 1.2.4 and its doc/model.md; everything else is exact and pinned '
      +'in selfTest to build/wave-on-a-string/derive.py (d&rsquo;Alembert image series, numpy.roots, a dense and a tridiagonal solve, brute-force runs, scipy).'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gWave,gString,gTime,gTools,gLat,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g,list,key] of CHIPROWS){
      const cws=g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length!==list.length) continue;
        let match=0;
        for(let i=0;i<list.length;i++) if(cw.children[i].textContent===list[i].name) match++;
        if(match===list.length)
          [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
      }
    }
  }
  /* a row the view ignores is hidden, never left live and inert */
  function syncPanel(){
    const v=st.view, live=(v==='str'||v==='xt');
    gWave.hidden=false; gString.hidden=false;
    modeChips.hidden=!live; pulseBtn.hidden=!(live&&st.mode==='pulse');
    rows.amp.row.hidden=live&&st.mode==='manual';
    rows.freq.row.hidden=!((live&&st.mode==='osc')||v==='stand'||v==='disp');
    rows.pw.row.hidden=!((live&&st.mode==='pulse')||v==='refl'||v==='disp');
    rows.damping.row.hidden=(v==='refl');
    endChips.hidden=!(live||v==='stand');
    gTime.hidden=(v==='disp');
    gTools.hidden=(v!=='str');
    swBtns.hidden=!st.stopwatch;
    gLat.hidden=(v!=='disp');
    for(const k in rows) rows[k].sync();
    waveTag.innerHTML=live?(st.mode==='manual'?'drag the wrench on the canvas (or &uarr; &darr;); PhET&rsquo;s wrench stops at &plusmn;1.3 cm'
      :st.mode==='osc'?'A sin 2&pi;ft at bead 0, rising first; the phase runs on when f changes'
      :'a triangle, A high and w long; click the generator, press p, or the button')
      :v==='refl'?'the pulse fed to all three strings':v==='stand'?'the oscillator driving the run; drag the top panel to set f':'the pulse in the bottom panel; f marks the oscillator on &omega;(k)';
    stringTag.innerHTML='v = '+fmt(speedOf(st.tension),3)+' cm/s, &Delta;t = '+sigf(1000*dtOf(st.tension),3)+' ms'+(v==='refl'?'; this view is undamped':'')
      +' &nbsp; (PhET&rsquo;s own slider, 0.2&ndash;0.8, would give '+(st.tension>=0.2?fmt(phetRate(st.tension)*DX,3)+' cm/s':'&mdash; below its range')+')';
    timeTag.innerHTML='space runs/pauses &nbsp; <b>.</b> steps &nbsp; <b>r</b> restarts &nbsp; 1&ndash;5 switch views'+(st.speed==='slow'?' &nbsp; slow motion: &times;0.25':'');
    toolTag.innerHTML='drag the rulers, the stopwatch and the reference line on the canvas';
    latTag.innerHTML='PhET runs at &alpha; = 1; below it the leapfrog is dispersive, and &alpha; &rarr; 0 is a bead chain';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='str'?(st.mode==='manual'?'drag the wrench':st.mode==='pulse'?'click the generator or press p':'the oscillator runs')+' · space pauses · 1–5 switch views'
        :st.view==='stand'?'drag the top panel to set f · space pauses · 1–5 switch views':'space pauses · 1–5 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; syncPanel(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ restartView(); dirty=true; refresh(); }
    else if(e.key==='.'){ stepView(); dirty=true; refresh(); }
    else if(e.key==='p'){ if(sendPulse(st)){ st.running=true; syncPanel(); dirty=true; refresh(); } }
    else if((e.key==='ArrowUp'||e.key==='ArrowDown')&&st.view==='str'&&st.mode==='manual'){
      e.preventDefault(); LIVE.wr=clamp(LIVE.wr+(e.key==='ArrowUp'?0.1:-0.1),-AMAX,AMAX); LIVE.arrows=false; st.running=true; syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0, last=0;
  function frameLoop(tm){
    frameN++;
    const dtw=last?Math.min((tm-last)/1000,0.05):0; last=tm;
    const advanced=S.step(dtw);
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%8===0) roEl.innerHTML=readoutHTML(S.model()); }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

function selfTest(){
  let pass=0,fail=0;

  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();

  function withState(over,fn){
    const clean={}; for(const k in over) if(k[0]!=='_') clean[k]=over[k];
    Object.assign(ST,DEFAULTS,clean); resetAll();
    if(over._wr!==undefined){ LIVE.wr=over._wr; LIVE.wrPrev=over._wr; }
    if(over._pulse) sendPulse(ST);
    if(over._live) for(let k=0;k<over._live;k++) liveStepOnce(ST,1);
    if(over._acc) LIVE.acc=over._acc*dtOf(ST.tension);
    if(over._refl) for(let k=0;k<over._refl;k++) reflStep(ST);
    if(over._stand) for(let k=0;k<over._stand;k++) standStep(ST);
    if(over._sw!==undefined){ LIVE.sw=over._sw; LIVE.swOn=true; }
    try{ return fn(); } finally{ Object.assign(ST,stSave); resetAll(); }
  }
  /* the JS lattice fed one pulse from rest (the same run derive.py makes) */
  function runPulse(end,A,w,T,nst,a,b,nseg){
    a=a===undefined?1:a; b=b||0; nseg=nseg||NSEG;
    const dt=a*DX/speedOf(T), L=makeLat(nseg), lev=[Array.from(L.cur)];
    for(let k=1;k<=nst;k++){ latStep(L,a,b,end,A*tri(k*dt/w)); lev.push(Array.from(L.cur)); }
    return {lev,dt};
  }
