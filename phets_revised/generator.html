<title>Generator &mdash; a turning magnet, a pickup coil, and Faraday&rsquo;s law</title>
<!--
  ===================================================================
  generator.html — Generator: water turns a bar magnet beside a pickup
  coil, and the changing flux through the coil drives a current —
  Faraday's law, with the flux integrated over the coil's face
  ===================================================================

  Remake of PhET Interactive Simulations' Generator (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets. The original is docs/phets/generator_en.html
  (version 1.0.7); its single screen is the first view here. Built on
  the same engine as magnets-and-electromagnets.html and
  magnet-and-compass.html: the shared parts and the Python twin live
  in build/magnets-and-electromagnets/ (e1_core.js, e3_lines.js,
  e5_gen.js, v_common.js, v_screens.js, v_analysis.js, derive.py), and
  this page carries only what it uses — the electromagnet, the bar
  magnet screen and the far-field view are stripped at build time and
  the build asserts that no trace of them is left.

  Six views. THE GENERATOR — PhET's screen: a faucet, a water wheel
  carrying the bar magnet and showing its speed in its hub, a pickup
  coil of 1-4 loops whose area is adjustable, a light bulb or a
  voltmeter, electrons, the field of needles, a compass and a field
  meter. FLUX AND EMF — the flux through the coil over one turn of the
  wheel and the EMF that follows it, against the single cosine a
  distant magnet would give. THE COIL FACE — the two ways of adding
  the field over the coil's disc, strip by strip up its diameter,
  whose areas are the two estimates of the flux: B integrated along
  each chord, against the in-page value PhET carries across it. FIELD LINES
  — the exact field lines of the magnet the wheel carries. ON THE AXIS
  — B and mu0 H along that magnet's axis in closed form. THE NEEDLE —
  the compass as a damped rotor (Gauss's method).

  WHAT IS EXACT
  -------------
  The magnet is a uniformly magnetised cylinder, 250 mm long and 50 mm
  across (PhET's 250 x 50 x 50 bar; PhET's own notes: "modeled in
  MathCAD as a horizontal cylinder"). Its B field is exactly that of
  an ideal finite solenoid carrying the bound current K = M x n round
  its side wall, in closed form everywhere through Bulirsch's
  generalized complete elliptic integral (Derby & Olbert, Am. J. Phys.
  78, 229 (2010)), in 3-D. THIS DIFFERS FROM PhET, which interpolates
  three grids precomputed once in MathCAD; those grids are a sampling
  of this same field (median 2.2e-7 G per G of strength over their
  15,971 points).

  The flux through one loop is the AREA integral of B_x over its disc,
  which stands perpendicular to the page: 16-point Gauss-Legendre in
  radius by 32-point trapezoid in angle, asserted against scipy's
  dblquad to 1e-10 G mm^2 at every angle, and unchanged by doubling
  either rule. One turn is sampled at 128 angles and kept as a Fourier
  series, so Phi(theta) and dPhi/dtheta are exact between the samples;
  only odd cosines survive (Phi is even in theta and reverses every
  half turn), which is asserted, not assumed. The EMF is Faraday's
  law, -N dPhi/dt = -N omega dPhi/dtheta: linear in N and in omega,
  reversed by reversing either, zero where the flux is stationary, and
  checked against a finite difference of Phi itself and against
  -dPhi/dt taken by stepping the page's own clock. Because the flux is
  not a cosine, the EMF does NOT peak with the magnet across the coil:
  it peaks at 24.79 degrees for the smallest coil and 37.95 for the
  largest (python, bounded maximiser), with the value at 90 degrees
  down to 0.29-0.60 of the peak.

  PhET's own flux is a line sample: B_x every 5 mm along the coil's
  vertical diameter in the page, each weighted by its chord, with the
  field off the page taken to be the field in it. That overestimates
  the flux by 13 % for the smallest coil and 57 % for the largest,
  which the coil-face view draws. It is not an error in PhET: its EMF
  is deliberately a relative number against its own full scale, and
  this page's volts are only volts because the integral is done.

  Field lines are exact lines of B in the page (RK4 along B/|B|, the
  side wall crossed exactly), seeded at equal flux. Everything is
  pinned in selfTest to build/magnets-and-electromagnets/derive.py
  (scipy dblquad, quad, brentq, solve_ivp, numpy FFT).

  WHAT IS MODELLED
  ----------------
  The compass is a damped rotor, phi'' = kappa |B| sin(theta_B - phi)
  - gamma phi', with PhET's kinematic-compass constants converted to
  seconds (kappa = 6.25 /(G s^2), gamma = 2 /s); on this screen it
  rides a turning field and lags it. The drag of the coil on the wheel
  is PhET's own phenomenological rule (its documentation: "Drag on the
  turbine caused by the pickup coil"): rpm = flow/100 x (1 - drag) x
  60, with drag a linear ramp in N x area from 0.01 to 0.2 scaled by
  the magnet's strength. A real back-torque would need the circuit's
  resistance, which neither PhET nor this page models. The electrons'
  speed is a picture of the current, not a drift speed. The bulb's
  brightness and the voltmeter's needle are the EMF against PhET's
  full scale, 1.2e5 G mm^2 per frame at 25 frames/s = 0.30 mV here.

  WHAT IS NOT MODELLED
  --------------------
  No circuit: no resistance, no current, no power — the pickup coil is
  an open circuit whose EMF is read, as in PhET. The magnet is bolted
  to the wheel and cannot be dragged. Nothing loads the wheel but the
  drag rule above. PhET's keyboard and sound layers, its projector
  colours and its developer controls are not reproduced. The water
  falls on the LEFT of the wheel here, so the magnet's angle
  increases; PhET steps its own angle the other way, which only
  reverses the sign of the EMF.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  One measured constant: mu0 = 1.25663706127e-6 N/A^2 (CODATA 2022,
  NIST). PhET's values, read from the 1.0.7 build: the 250 x 50 bar,
  0-300 G at 75%; the pickup coil's 1-4 loops and 20-100% of
  70685 mm^2 at 50%; 60 RPM at full flow, the drag range 0-0.2 and its
  ramp; maxEMF 1.2e5; the 5 mm sample spacing; the 40-px needle grid
  and brightness rule; the compass constants; the 1024 x 618 layout
  and the objects' places. 1 PhET model px = 1 mm on this page (a
  stated scale, not PhET's).
-->

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],

function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}

            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',

            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',

            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });

function wrapText(ctx,txt,maxW,font){

}

function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }

function ticksFor(lo,hi,want){

  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);

function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;

function axes(ctx,b,xlo,xhi,ylo,yhi,opt){

  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){

    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);

  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);

    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();

    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data

let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });

/* pick the first corner of panel b that no already-recorded curve segment

   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped

function capFit(ctx,W,H,txt,capW){

function sparseTicks(lo,hi,hpx){

/* choose the full caption if the panel above it keeps at least minTop of

function intTicks(lo,hi){
  const out=[];

/* ================================================================== *
 *  the magnetism engine: Bulirsch's cel, the finite solenoid (the bar *
 *  magnet), the current loop (the coil), sources in the world frame,  *
 *  the field meter's readings, the needle grid, the compass rotor     *
 *  (shared by the magnets-and-electromagnets family; the twin is      *
 *  build/magnets-and-electromagnets/derive.py)                        *
 * ================================================================== */
const D2R=Math.PI/180, R2D=180/Math.PI;     /* D2R turns degrees INTO radians (Known-bad: DEG/RAD read backwards) */
const MU0=1.25663706127e-6;                 /* N/A^2, CODATA 2022 (NIST); measured since the 2019 SI */
const G_PER_T=1e4;
const MAG_L=250, MAG_R=25, MAG_B=125;       /* mm. PhET's bar is 250 x 50 x 50: a horizontal cylinder, radius 25 */
/* mu0 m / 4 pi per unit source: the magnet's moment is M V = M pi R^2 L, so mu0 m/4pi =
   S R^2 L/4 (G mm^3 per G); N loops carry m = N I pi a^2, so mu0 m/4pi = mu0 I N a^2/4. */
const MAG_DIP=MAG_R*MAG_R*MAG_L/4;
const S_MAX=300;                            /* G: PhET's MAGNET_STRENGTH_RANGE is (0, 300) */
const KAPPA=6.25, GAMMA_C=2;                /* compass rotor: PhET's 0.01/G per frame^2 and 0.08 per frame at 25 frames/s */
const FLIP_KICK=0.75;                       /* rad/s: PhET's startMovingNow, 0.03 rad per frame at 25 frames/s */
const NEEDLE_SPACING=40, NEEDLE_LEN=25, FIELD_SCALE=2.7;   /* PhET's FieldNode: 40-px grid, 25-px needles, alpha exponent 1/2.7 */
const LAYOUT_W=1024, LAYOUT_H=618;          /* PhET's layout bounds, mm here (1 PhET px = 1 mm) */

/* Bulirsch's generalized complete elliptic integral
     cel(kc,p,c,s) = int_0^{pi/2} (c cos^2 + s sin^2) / ((cos^2 + p sin^2) sqrt(cos^2 + kc^2 sin^2)) dphi
   (the algorithm as listed by Derby & Olbert, Am. J. Phys. 78, 229 (2010)).  K(k) = cel(kc,1,1,1),
   E(k) = cel(kc,1,1,kc^2).  Converges quadratically; kc = 0 is the logarithmic singularity. */
function cel(kc,p,c,s){
  if(kc===0) return NaN;
  let k=Math.abs(kc), pp=p, cc=c, ss=s, em=1, f, g, q;
  if(p>0){ pp=Math.sqrt(p); ss=s/pp; }
  else { f=kc*kc; q=1-f; g=1-pp; f=f-pp; q=q*(ss-c*pp); pp=Math.sqrt(f/g); cc=(c-ss)/g; ss=-q/(g*g*pp)+cc*pp; }
  f=cc; cc=cc+ss/pp; g=k/pp; ss=2*(ss+f*g); pp=g+pp; g=em; em=k+em;
  let kk=k, it=0;
  while(Math.abs(g-k)>g*1e-15){
    k=2*Math.sqrt(kk); kk=k*em; f=cc; cc=cc+ss/pp; g=kk/pp; ss=2*(ss+f*g); pp=g+pp; g=em; em=k+em;
    if(++it>60) return NaN;
  }
  return (Math.PI/2)*(ss+cc*em)/(em*(em+pp));
}
function ellK(kc){ return cel(kc,1,1,1); }
function ellE(kc){ return cel(kc,1,1,kc*kc); }
/* n-point Gauss-Legendre on [-1, 1], nodes by Newton on P_n (asserted: exact for x^(2n-2)) */
const GL_CACHE={};
function gaussLegendre(n){
  if(GL_CACHE[n]) return GL_CACHE[n];
  const x=[], w=[];
  for(let i=0;i<n;i++){
    let z=Math.cos(Math.PI*(i+0.75)/(n+0.5)), pp=0;
    for(let it=0;it<100;it++){
      let p1=1, p2=0;
      for(let j=0;j<n;j++){ const p3=p2; p2=p1; p1=((2*j+1)*z*p2-j*p3)/(j+1); }
      pp=n*(z*p1-p2)/(z*z-1);
      const dz=p1/pp; z-=dz; if(Math.abs(dz)<1e-16) break;
    }
    x.push(z); w.push(2/((1-z*z)*pp*pp));
  }
  return (GL_CACHE[n]={x,w});
}

/* The ideal finite solenoid, radius a, half-length b, axis u, centred at 0, in units of mu0 n I
   (Derby & Olbert 2010).  A uniformly magnetised cylinder IS this solenoid for B, everywhere:
   its bound current K = M x n flows round the side wall (Ampere's equivalence).  Returns
   [B_rho, B_u].  On the side wall itself (rho = a, |u| < b) it returns the mean of the two
   sides (B_u jumps by exactly mu0 n I there); at the rims (rho = a, |u| = b) the field is
   logarithmically singular and the point is nudged 1e-9 a outward. */
function solB(rho,u,a,b){
  if(Math.abs(rho-a)<1e-9*a && Math.abs(Math.abs(u)-b)<1e-9*a) rho=a*(1+1e-9);
  const zp=u+b, zm=u-b, ra=rho+a;
  const sp=Math.sqrt(zp*zp+ra*ra), sm=Math.sqrt(zm*zm+ra*ra);
  const g=(a-rho)/ra, g2=g*g;
  const kp=Math.sqrt(zp*zp+(a-rho)*(a-rho))/sp, km=Math.sqrt(zm*zm+(a-rho)*(a-rho))/sm;
  const Br=(a/sp*cel(kp,1,1,-1)-a/sm*cel(km,1,1,-1))/Math.PI;
  const Bu=a/ra*(zp/sp*cel(kp,g2,1,g)-zm/sm*cel(km,g2,1,g))/Math.PI;
  return [Br,Bu];
}
/* the same on the axis, in closed form (asserted equal to solB(0,u) in selfTest) */
function solAxis(u,a,b){ return 0.5*((u+b)/Math.hypot(u+b,a)-(u-b)/Math.hypot(u-b,a)); }



/* ---------------- sources in the world frame (mm, gauss) ---------------- *
 * magnet: {kind:'magnet', x, y, ang, S}  centre, axis angle (N end along ang), strength S = mu0 M in G.
 * coil:   {kind:'coil', x, y, N, I}      centre, loops along +x at the winding's pitch, current I in A
 *         (positive I makes +x the north end).  Fields are 3-D; the page is the plane z = 0. */
function magnetLocal(m,px,py,pz){
  const c=Math.cos(m.ang), s=Math.sin(m.ang), dx=px-m.x, dy=py-m.y, dz=pz||0;
  const u=dx*c+dy*s, vx=dx-u*c, vy=dy-u*s, vz=dz;
  return {u,vx,vy,vz,rho:Math.sqrt(vx*vx+vy*vy+vz*vz),c,s};
}
function magnetField(m,px,py,pz){
  const L=magnetLocal(m,px,py,pz), b=solB(L.rho,L.u,MAG_R,MAG_B);
  const Br=m.S*b[0], Bu=m.S*b[1];
  if(L.rho>0) return [Bu*L.c+Br*L.vx/L.rho, Bu*L.s+Br*L.vy/L.rho, Br*L.vz/L.rho];
  return [Bu*L.c, Bu*L.s, 0];

function insideMagnet(m,px,py){ const L=magnetLocal(m,px,py,0); return Math.abs(L.u)<=MAG_B && L.rho<=MAG_R; }
function sourceField(src,px,py,pz){
  if(src.kind==='magnet') return magnetField(src,px,py,pz);

}
/* the angle of the field in the page, degrees in (-180, 180] (PhET's field meter theta) */
function fieldAngleDeg(B){ return Math.atan2(B[1],B[0])*R2D; }

/* ---------------- the field meter ---------------- *
 * The meter reads the model at its crosshair: no smoothing, no grid.  Units as PhET's
 * preference: G with two decimals ('~ 0 G' below 0.01 G), or T in scientific notation. */
function meterReading(src,x,y){
  const B=sourceField(src,x,y,0);
  return {Bx:B[0],By:B[1],B:Math.hypot(B[0],B[1]),ang:(B[0]===0&&B[1]===0)?NaN:fieldAngleDeg(B)};

function fmtField(v,units){
  if(!isFinite(v)) return '—';

    if(v===0) return '0 T';
    const t=(v/G_PER_T).toExponential(2).split('e');
    return t[0]+' × 10^'+(+t[1])+' T';

  const a=Math.abs(v);

function fmtAngle(deg){ return isFinite(deg)?deg.toFixed(2)+'°':'—'; }

/* ---------------- the needle grid (PhET's FieldNode) ---------------- *
 * one needle every 40 mm, pointing along B, brightness min(1, 2 (|B|/300 G)^(1/2.7)) --
 * PhET's own mapping, a display choice, not physics (said on the canvas) */
function needleAlpha(Bmag){ return Math.min(1,2*Math.pow(Bmag/S_MAX,1/FIELD_SCALE)); }

  const out=[];

  const j0=Math.ceil((y0-20)/NEEDLE_SPACING), j1=Math.floor((y1-20)/NEEDLE_SPACING);
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){
    const x=20+i*NEEDLE_SPACING, y=20+j*NEEDLE_SPACING, B=sourceField(src,x,y,0), mg=Math.hypot(B[0],B[1]);
    if(!(mg>0)||!isFinite(mg)) continue;

/* ---------------- the compass: a damped rotor (MODELLED) ---------------- *
 *   phi'' = kappa |B| sin(theta_B - phi) - gamma phi'
 * with PhET's kinematic-compass constants in SI: kappa = 6.25 per G per s^2, gamma = 2 per s.
 * Small swings ring at omega0 = sqrt(kappa |B|) (period 2.5 s at 1 G, 0.26 s at 100 G); PhET
 * snaps the needle to the field above 10 G, this page integrates the rotor at every field.
 * RK4 with steps <= 0.1/omega0; the field may depend on time (AC coil, turning magnet), so it
 * is sampled at each RK4 stage.  The energy per moment of inertia,
 *   E = phi'^2/2 + kappa |B| (1 - cos(phi - theta_B)),
 * and the work done by the damping, W = int gamma phi'^2 dt, are integrated as extra states
 * INSIDE the same RK4 stages, so E + W is conserved to the integrator's own accuracy in a
 * steady field (Known-bad: a ledger kept beside the integrator drifts). */
function rotorDeriv(y,Bv,kap,gam){
  const Bm=Math.hypot(Bv[0],Bv[1]), th=Math.atan2(Bv[1],Bv[0]);
  return [y[1], kap*Bm*Math.sin(th-y[0])-gam*y[1], gam*y[1]*y[1]];
}
function rotorAdvance(r,Bfun,t,dt,kap,gam){
  kap=(kap===undefined)?KAPPA:kap; gam=(gam===undefined)?GAMMA_C:gam;
  let Bmax=0; for(const tt of [t,t+dt/2,t+dt]){ const B=Bfun(tt); Bmax=Math.max(Bmax,Math.hypot(B[0],B[1])); }
  const w0=Math.sqrt(kap*Bmax);
  const n=Math.max(1,Math.ceil(dt*w0/0.1), Math.ceil(dt*gam/0.1));
  const h=dt/n;
  let y=[r.phi,r.om,r.W||0];
  for(let i=0;i<n;i++){
    const t0=t+i*h, Ba=Bfun(t0), Bb=Bfun(t0+h/2), Bc=Bfun(t0+h);
    const k1=rotorDeriv(y,Ba,kap,gam);
    const y2=[y[0]+h/2*k1[0],y[1]+h/2*k1[1],y[2]+h/2*k1[2]], k2=rotorDeriv(y2,Bb,kap,gam);
    const y3=[y[0]+h/2*k2[0],y[1]+h/2*k2[1],y[2]+h/2*k2[2]], k3=rotorDeriv(y3,Bb,kap,gam);
    const y4=[y[0]+h*k3[0],y[1]+h*k3[1],y[2]+h*k3[2]], k4=rotorDeriv(y4,Bc,kap,gam);
    for(let j=0;j<3;j++) y[j]+=h/6*(k1[j]+2*k2[j]+2*k3[j]+k4[j]);

/* wrap an angle to (-pi, pi] (the needle is drawn with it; the rotor state keeps the winding) */
function wrapPi(a){ a=(a+Math.PI)%(2*Math.PI); if(a<0) a+=2*Math.PI; return a-Math.PI; }

/* ================================================================== *
 *  field lines: the source is axisymmetric, so its lines lie in       *
 *  meridional planes, and the page (z = 0) is one.  Seeds at the      *
 *  mid-plane are spaced in EQUAL FLUX, so between neighbouring lines  *
 *  (as rings round the axis) runs the same flux 2 pi dPsi.  RK4 on    *
 *  B/|B|; the magnet's side wall (the bound current sheet, where B_u  *
 *  jumps by mu0 M) is crossed exactly: each step continues the field  *
 *  of the side it started on, and a step that would cross is cut to   *
 *  land on the wall by secant iteration (derive.py/explore: without   *
 *  this the lines leaving through the wall missed closure by 2%).     *
 * ================================================================== */
const MAG_LINES=10;

function lineSource(kind,N){
  if(kind==='magnet') return {kind, n:MAG_LINES, ru:(r,u)=>solB(r,u,MAG_R,MAG_B), wall:{a:MAG_R,b:MAG_B}, sing:[[MAG_R,MAG_B],[MAG_R,-MAG_B]], aIn:MAG_R, aOut:MAG_R};

}

const GL24=gaussLegendre(24);
/* the flux function on the mid-plane, Psi(r, 0) = int_0^r B_u(rho, 0) rho drho (unit source) */
function psiMid(ls,r){

  let s=0; for(let i=0;i<24;i++){ const rr=0.5*r*(GL24.x[i]+1); s+=GL24.w[i]*ls.ru(rr,0)[1]*rr; }
  return 0.5*r*s;
}
function bisect(f,lo,hi,n){ let flo=f(lo); for(let i=0;i<(n||200);i++){ const m=0.5*(lo+hi), fm=f(m); if(m<=lo||m>=hi) break; if((fm>0)===(flo>0)){ lo=m; flo=fm; } else hi=m; } return 0.5*(lo+hi); }
function lineSeeds(ls,n){
  const pm=psiMid(ls,ls.aIn), out=[];
  for(let i=1;i<=n;i++){ const t=i*pm/(n+1); out.push({psi:t, r:bisect(r=>psiMid(ls,r)-t,0,ls.aIn)}); }
  return {psiMax:pm, seeds:out};
}
function fieldCont(ls,r,u,r0,u0){
  const B=ls.ru(r,u);
  if(ls.wall){ const a=ls.wall.a, b=ls.wall.b;
    if(Math.abs(u)<b&&Math.abs(u0)<b){ if(r0<a&&r>a) B[1]+=1; else if(r<a&&r0>a) B[1]-=1; } }
  return B;
}
function lineStep(ls,r,u){
  let d=1e9; for(const s of ls.sing) d=Math.min(d,Math.hypot(r-s[0],u-s[1]));
  return Math.max(0.005,Math.min(0.12*d,0.03*Math.hypot(r,u)+1,6));
}
function rk4Line(ls,r,u,h){
  const r0=r, u0=u;
  const f=(rr,uu)=>{ const B=fieldCont(ls,rr,uu,r0,u0), m=Math.hypot(B[0],B[1]); return [B[0]/m,B[1]/m]; };
  const k1=f(r,u), k2=f(r+h/2*k1[0],u+h/2*k1[1]), k3=f(r+h/2*k2[0],u+h/2*k2[1]), k4=f(r+h*k3[0],u+h*k3[1]);
  return [r+h/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]), u+h/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1])];
}
/* one closed line from (r0, 0) inside, forward along B: out, round, back.  Returns the
   polyline (rho, u), where it crossed the mid-plane outside (rOut), the closure error. */
function traceLine(ls,r0,maxN){
  maxN=maxN||20000;
  const pts=[[r0,0]]; let r=r0, u=0, rOut=null, walls=0;
  
  for(let n=0;n<maxN;n++){
    const h=lineStep(ls,r,u);
    let nx=rk4Line(ls,r,u,h);
    if(ls.wall){ const a=ls.wall.a, b=ls.wall.b;
      if((Math.abs(u)<b||Math.abs(nx[1])<b)&&(r-a)*(nx[0]-a)<0){
        let h0=0, f0=r-a, h1=h, f1=nx[0]-a, m=nx;
        for(let it=0;it<60;it++){
          const hm=h1-f1*(h1-h0)/(f1-f0); m=rk4Line(ls,r,u,hm); const fm=m[0]-a;
          h0=h1; f0=f1; h1=hm; f1=fm; if(Math.abs(fm)<1e-12) break;
        }
        nx=m;
        if(Math.abs(nx[1])<b){ walls++; nx=[a+(r<a?1e-9:-1e-9),nx[1]]; }
      }
    }
    
    /* the line crosses the mid-plane at right angles (B_rho vanishes there by symmetry), so r
       is quadratic in u about the crossing: a parabola through the two vertices either side and
       the one before them beats linear interpolation by ~3 decades */
    if(u>0&&nx[1]<=0&&rOut===null&&r>ls.aOut){ rOut=crossR(pts,r,u,nx); }
    if(rOut!==null&&u<0&&nx[1]>=0&&r<ls.aIn){ const re=crossR(pts,r,u,nx); pts.push([re,0]);
      return {pts, rOut, close:Math.abs(re-r0), steps:n+1, walls, ok:true}; }
    r=nx[0]; u=nx[1]; pts.push([r,u]);
    if(Math.hypot(r,u)>2e5) return {pts, rOut, close:NaN, steps:n+1, walls, ok:false};
  }

}
/* r at u = 0 from the parabola through (u_prev, r_prev), (u, r) and (u_next, r_next) */
function crossR(pts,r,u,nx){
  const p=pts.length>1?pts[pts.length-2]:null;
  if(!p||p[1]===u||p[1]===nx[1]) return r+(u/(u-nx[1]))*(nx[0]-r);
  const x0=p[1], y0=p[0], x1=u, y1=r, x2=nx[1], y2=nx[0];
  return y0*(0-x1)*(0-x2)/((x0-x1)*(x0-x2))+y1*(0-x0)*(0-x2)/((x1-x0)*(x1-x2))+y2*(0-x0)*(0-x1)/((x2-x0)*(x2-x1));

const LINE_CACHE={};
function fieldLinesFor(kind,N){
  const key=kind==='magnet'?'magnet':'coil'+N;

  const ls=lineSource(kind,N), sd=lineSeeds(ls,ls.n);
  const lines=sd.seeds.map(s=>{ const L=traceLine(ls,s.r); L.psi=s.psi; L.r0=s.r; return L; });
  return (LINE_CACHE[key]={kind,N,psiMax:sd.psiMax,lines});
}

/* ================================================================== *
 *  the generator: the turbine's bar magnet turns in the page; the     *
 *  pickup coil's loops are discs perpendicular to the page (axis +x). *
 *  The flux is the AREA integral of B_x over the disc, the 3-D field  *
 *  included (16-point Gauss-Legendre in radius x 32-point trapezoid   *
 *  in angle, 1e-16 against scipy dblquad); one turn is sampled at 128 *
 *  angles and kept as a Fourier series, so Phi(theta) and the exact   *
 *  derivative dPhi/dtheta are available at any angle, and             *
 *      EMF = -N dPhi/dt = -N omega dPhi/dtheta.                       *
 *  theta is the magnet's angle in the page and omega = dtheta/dt, so  *
 *  a wheel turning the other way simply reverses the EMF.             *
 * ================================================================== */
const TURB_X=285, TURB_Y=LAYOUT_H-375, PICK_X=520, PICK_Y=LAYOUT_H-375;   /* PhET's GeneratorScreenModel positions, y flipped */
const PICK_AMAX=70685, PICK_NMAX=4, PICK_AMIN_PCT=20;   /* PhET's pickup coil: maxLoopArea 70685 (radius 150), 1-4 loops, area 20-100 % */
const PICK_PITCH=44, PICK_WIRE=6;                       /* drawing only: the turns' spacing and wire radius */
const RPM_MAX=60;                             /* PhET: 60 rpm at full flow (2 pi/25 rad per frame at 25 frames/s) */
const E_FULL=12e4*1e-4*1e-6*25;               /* PhET's maxEMF, 12e4 G px^2/frame, in volts at 1 px = 1 mm: 0.30 mV */
const FLUX_NS=16, FLUX_NPSI=32, FLUX_M=128;
function pickArea(areaPct){ return areaPct/100*PICK_AMAX; }
function pickRadius(areaPct){ return Math.sqrt(pickArea(areaPct)/Math.PI); }
function pickLoopsX(N){ const out=[]; for(let k=0;k<N;k++) out.push((k-(N-1)/2)*PICK_PITCH); return out; }
/* PhET's drag of the pickup coil on the turbine (its own phetioDocumentation: "Drag on the
   turbine caused by the pickup coil"): a linear ramp in N x area, scaled by the magnet's
   strength.  It is phenomenological -- a real back-torque needs the circuit's resistance,
   which neither PhET nor this page models -- and it is carried only so the wheel slows as
   the coil is made to work harder, as PhET's does. */
const DRAG_MAX=0.2, NA_LO=PICK_AMIN_PCT/100*PICK_AMAX, NA_HI=PICK_NMAX*PICK_AMAX, DRAG_LO=NA_LO/NA_HI*DRAG_MAX;

const GL16=gaussLegendre(FLUX_NS);
/* the flux of a unit-strength magnet (turbine centre, axis at angle th) through one loop of
   radius rc centred at the pickup coil, in G mm^2 per G of strength */
function flux1(th,rc,ns,npsi){
  ns=ns||FLUX_NS; npsi=npsi||FLUX_NPSI;
  const m={kind:'magnet',x:TURB_X,y:TURB_Y,ang:th,S:1};
  const G=ns===FLUX_NS?GL16:gaussLegendre(ns);
  let tot=0;
  for(let i=0;i<ns;i++){
    const s=0.5*rc*(G.x[i]+1);
    let acc=0;
    for(let j=0;j<npsi;j++){ const ps=2*Math.PI*j/npsi; acc+=magnetField(m,PICK_X,PICK_Y+s*Math.cos(ps),s*Math.sin(ps))[0]; }
    tot+=0.5*rc*G.w[i]*s*acc*2*Math.PI/npsi;
  }
  return tot;
}
/* the ring average of B_x round the circle of radius s in the coil's plane, and the value
   PhET would use there: the field IN the page, taken to hold off it as well */
function ringBx(th,s,npsi){
  const m={kind:'magnet',x:TURB_X,y:TURB_Y,ang:th,S:1}, n=npsi||FLUX_NPSI;
  let acc=0;
  for(let j=0;j<n;j++){ const ps=2*Math.PI*j/n; acc+=magnetField(m,PICK_X,PICK_Y+s*Math.cos(ps),s*Math.sin(ps))[0]; }
  return acc/n;
}
function pageBx(th,y){ return magnetField({kind:'magnet',x:TURB_X,y:TURB_Y,ang:th,S:1},PICK_X,PICK_Y+y,0)[0]; }
/* the true contribution of the strip at height y: B_x integrated ALONG the chord, off the
   page as well as in it.  PhET's rule is the same strip with B_x(y, 0) carried across all of
   it, so these two are the whole of the difference between the estimates. */
function chordBx(th,y,rc,ns){
  const c=Math.sqrt(Math.max(0,rc*rc-y*y));
  if(!(c>0)) return 0;
  const m={kind:'magnet',x:TURB_X,y:TURB_Y,ang:th,S:1}, G=(ns&&ns!==FLUX_NS)?gaussLegendre(ns):GL16;
  let s=0;
  for(let i=0;i<G.x.length;i++) s+=G.w[i]*magnetField(m,PICK_X,PICK_Y+y,c*G.x[i])[0];
  return c*s;
}
function chordPhet(th,y,rc){ return pageBx(th,y)*2*Math.sqrt(Math.max(0,rc*rc-y*y)); }
/* PhET's own estimate: B_x sampled on the vertical diameter IN THE PAGE every 5 mm (its
   sample spacing is the magnet's height/10), each sample weighted by its chord
   2 sqrt(r^2 - y^2) times the spacing -- the field off the page is taken to be the field in
   it.  Kept for the coil-face view's comparison; never used for the EMF. */
const PHET_SP=MAG_R*2/10;
function fluxPhet1(th,rc){
  const sp=PHET_SP, n=Math.floor(rc/sp);
  let tot=0;
  for(let k=-n;k<=n;k++){ const y=k*sp; tot+=pageBx(th,y)*2*Math.sqrt(Math.abs(rc*rc-y*y))*sp; }
  return tot;
}
const FLUX_CACHE={};
/* Fourier series of flux1 over one turn: Phi(th) = sum_k a_k cos k th + b_k sin k th */
function fluxSeries(rc){
  const key=rc.toFixed(9);
  if(FLUX_CACHE[key]) return FLUX_CACHE[key];
  const M=FLUX_M, F=[];
  for(let j=0;j<M;j++) F.push(flux1(2*Math.PI*j/M,rc));
  const a=[], b=[];
  for(let k=0;k<=M/2;k++){
    let sa=0, sb=0;
    for(let j=0;j<M;j++){ const ph=2*Math.PI*k*j/M; sa+=F[j]*Math.cos(ph); sb+=F[j]*Math.sin(ph); }
    const nrm=(k===0||k===M/2)?1/M:2/M;
    a.push(sa*nrm); b.push(sb*nrm);

}
function seriesPhi(ser,th){ let s=0; for(let k=0;k<ser.a.length;k++) s+=ser.a[k]*Math.cos(k*th)+ser.b[k]*Math.sin(k*th); return s; }
function seriesDPhi(ser,th){ let s=0; for(let k=1;k<ser.a.length;k++) s+=k*(-ser.a[k]*Math.sin(k*th)+ser.b[k]*Math.cos(k*th)); return s; }
/* SI: 1 G mm^2 = 1e-10 Wb, so N turns of a magnet of strength S give these webers and volts */
const WB_PER_G_MM2=1e-10;
function fluxOf(ser,th,N,S){ return N*S*seriesPhi(ser,th)*WB_PER_G_MM2; }
function emfOf(ser,th,N,S,omega){ return -N*S*seriesDPhi(ser,th)*omega*WB_PER_G_MM2; }
/* PhET's normalised current: the EMF against its full scale, clamped to +-1.  Nothing on
   this page's sliders reaches the clamp (the largest is about 0.7 of full scale, asserted in
   selfTest); PhET's own flux is half again as large, which is what its clamp is for. */
function normOf(emf){ return Math.max(-1,Math.min(1,emf/E_FULL)); }
/* the generator's state -> its electrical readings */
function genReadings(g){
  const rc=pickRadius(g.area), ser=fluxSeries(rc), S=S_MAX*g.strength/100;
  const rpm=genRPM(g), omega=2*Math.PI*rpm/60;
  const Phi=fluxOf(ser,g.th,g.N,S), emf=emfOf(ser,g.th,g.N,S,omega);
  const norm=normOf(emf);
  return {rc,ser,S,rpm,omega,drag:genDrag(g.N,g.area,g.strength),phi1:seriesPhi(ser,g.th),dphi1:seriesDPhi(ser,g.th),

}
/* The peak of |EMF| over a turn, and where it stands: NOT at 90 degrees, because Phi(th) is
   not a cosine -- the magnet is close enough for its higher harmonics to matter.  Only odd
   harmonics survive, so |dPhi/dtheta| is symmetric about 90 degrees and there are always TWO
   peaks: the search is over the first quarter turn, which is the one the view marks. */
function emfPeak(ser){
  const f=th=>Math.abs(seriesDPhi(ser,th));
  let th0=0, best=-1;
  for(let i=0;i<=180;i++){ const th=0.5*Math.PI*i/180, v=f(th); if(v>best){ best=v; th0=th; } }
  let lo=Math.max(0,th0-Math.PI/360), hi=Math.min(Math.PI/2,th0+Math.PI/360);
  for(let i=0;i<80;i++){ const m1=lo+(hi-lo)/3, m2=hi-(hi-lo)/3; if(f(m1)<f(m2)) lo=m1; else hi=m2; }
  const th=0.5*(lo+hi);
  return {th, val:f(th), at90:f(Math.PI/2)};
}

/* ================================================================== *
 *  state, the per-view model, readout, equation bar, tag              *
 *  (PhET's Generator screen, on the family's engine)                  *
 * ================================================================== */
const TABS=[['gen','the generator'],['flux','flux and EMF'],['face','the coil face'],
            ['lines','field lines'],['axis','on the axis'],['needle','the needle']];
const COL={north:'#b8ec4c', south:'#cd35c4', needleS:'#7d8596', ref:'#e8843a', struct:'#5ac8e0', live:'#f2f4f8', dim:'#8b93a6',
           copper:'#c9905c', bound:'#5ac8e0', edge:'#242a3a', grid:'#141b2a', water:'#3d7fa8', glass:'#ffe38a'};
const RO_W=300;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const DEFAULTS={view:'gen', units:'G', flowConv:'electron', run:true,
  /* PhET's defaults: the faucet closed, the magnet at 75 %, 2 loops, half area, the bulb */
  flow:0, pct:75, N:2, area:50, indicator:'bulb', th:0,
  genField:true, seeInside:false, electrons:true, genCompass:true, genMeter:false,
  genC:{x:300,y:520}, genM:{x:800,y:470},
  /* the analysis views */
  phetCmp:true, bound:true, axisH:true, ndB:5, ndRel:60, ndDamp:2};
const ST=clone(DEFAULTS);
const LIVE={t:0, ndT:0, genRot:null, ePhase:0};
function resetLive(){ LIVE.t=0; LIVE.ndT=0; LIVE.genRot=null; LIVE.ePhase=0; }
function resetState(over){ Object.assign(ST,clone(DEFAULTS),over?clone(over):{}); resetLive(); }

/* the turbine's magnet at its present angle, and the generator's settings in one object */
function turbMagnet(st,th){ return {kind:'magnet',x:TURB_X,y:TURB_Y,ang:(th===undefined?st.th:th),S:S_MAX*st.pct/100}; }
function genState(st){ return {N:st.N, area:st.area, flow:st.flow, strength:st.pct, th:st.th}; }
function wrap2pi(a){ a%=2*Math.PI; return a<0?a+2*Math.PI:a; }
/* the compass needle starts along the field, as PhET's does */
function rotorFor(key,src,p){
  if(!LIVE[key]){ const B=sourceField(src,p.x,p.y,0); LIVE[key]={phi:Math.atan2(B[1],B[0]),om:0,W:0,rest:true}; }
  return LIVE[key];
}
/* The water falls on the left of the wheel, so the magnet's angle INCREASES: omega =
   dtheta/dt > 0.  (PhET steps its own angle the other way, by -2 pi (flow/100)/25 per frame;
   the sign of omega only reverses the EMF.)  The clock is the page's, not PhET's 25 fps. */
function stepLive(dt){
  const st=ST; let moved=false;
  dt=Math.min(dt,0.05);
  if(st.view==='gen'){
    const g=genState(st), rpm=genRPM(g), om=2*Math.PI*rpm/60;
    const th0=st.th;
    if(om>0){ st.th=wrap2pi(st.th+om*dt); moved=true; }
    if(st.electrons){
      const R=genReadings(genState(st));
      if(Math.abs(R.norm)>1e-12){ LIVE.ePhase=(LIVE.ePhase+R.norm*dt*(st.flowConv==='electron'?1:-1)+1)%1; moved=true; }
    }
    if(st.genCompass){
      const r=rotorFor('genRot',turbMagnet(st),st.genC);
      /* the field at the compass while the magnet turns: the rotor integrates through it */
      const Bfun=t=>sourceField(turbMagnet(st,th0+om*(dt+t)),st.genC.x,st.genC.y,0);
      moved=rotorTick(r,Bfun,dt)||moved;
    }
  }
  if(st.view==='needle'){ LIVE.ndT+=dt; if(LIVE.ndT>needleWindow(st)) LIVE.ndT=0; moved=true; }
  return moved;

/* one frame of the rotor; at rest in a steady field it stops, so a settled page draws nothing */
function rotorTick(r,Bfun,dt){
  const B=Bfun(0), th=Math.atan2(B[1],B[0]), mg=Math.hypot(B[0],B[1]);
  if(!(mg>0)) return false;
  const off=wrapPi(r.phi-th);
  const steady=(()=>{ const B2=Bfun(dt); return B2[0]===B[0]&&B2[1]===B[1]; })();
  if(r.rest&&Math.abs(off)<1e-4&&steady) return false;
  r.rest=false;
  rotorAdvance(r,Bfun,0,dt);
  if(steady&&Math.abs(wrapPi(r.phi-th))<1e-4&&Math.abs(r.om)<1e-3){ r.phi=th; r.om=0; r.rest=true; }
  return true;
}
function needleWindow(st){ const w0=Math.sqrt(KAPPA*st.ndB); return Math.max(4,Math.min(24,7*2*Math.PI/w0)); }
const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
/* the analysis views see the same bar magnet, upright in its own frame */
function analysisSource(st){ return {kind:'magnet',N:0,unit:S_MAX*st.pct/100,label:'the turbine’s bar magnet'}; }

/* one turn of the wheel, sampled for the flux view: Phi(th) and the EMF that follows it */
function fluxCurve(st){
  const g=genState(st), rd=genReadings(g), ser=rd.ser, n=361, th=[], phi=[], emf=[], one=[], oneE=[];
  const a1=ser.a[1];
  for(let i=0;i<n;i++){
    const t=2*Math.PI*i/(n-1); th.push(t);
    phi.push(fluxOf(ser,t,g.N,rd.S));
    emf.push(emfOf(ser,t,g.N,rd.S,rd.omega));
    /* the first harmonic alone: the sinusoid a far-off magnet (a point dipole) would give */
    one.push(g.N*rd.S*a1*Math.cos(t)*WB_PER_G_MM2);
    oneE.push(g.N*rd.S*a1*rd.omega*Math.sin(t)*WB_PER_G_MM2);
  }
  const pk=emfPeak(ser);
  return {th,phi,emf,one,oneE,pk,rd,g,a1,
          emfPk:g.N*rd.S*pk.val*rd.omega*WB_PER_G_MM2, emf90:g.N*rd.S*pk.at90*rd.omega*WB_PER_G_MM2};
}
/* The coil face.  Both flux estimates are integrals over the radius once PhET's is folded
   about the centre (its samples come in pairs at +-y), so the two INTEGRANDS can be drawn on
   one axis and their areas are the two numbers:
     exact  e(s) = <B_x>(s) 2 pi s        PhET  p(s) = q(s) + q(-s),  q(y) = B_x(y,0) chord(y)
   Their difference is the whole of PhET's error, at any angle of the magnet. */
function faceIntegrands(th,rc,n){
  const s=[], ex=[], ph=[];
  for(let i=0;i<n;i++){ const y=rc*(2*i/(n-1)-1); s.push(y); ex.push(chordBx(th,y,rc)); ph.push(chordPhet(th,y,rc)); }
  return {s,ex,ph};
}
function faceCurve(st){
  const rd=genReadings(genState(st)), rc=rd.rc, C=faceIntegrands(st.th,rc,121);
  const exact=flux1(st.th,rc), phet=fluxPhet1(st.th,rc);
  const sp=[]; const m=Math.floor(rc/PHET_SP);
  for(let k=-m;k<=m;k++){ const y=k*PHET_SP; sp.push({s:y,p:chordPhet(st.th,y,rc)}); }
  /* the same comparison across the area slider, which is where the error really shows */
  const pcts=[], ratio=[];
  for(let p=PICK_AMIN_PCT;p<=100;p+=5){ const r=pickRadius(p); pcts.push(p); ratio.push(fluxPhet1(st.th,r)/flux1(st.th,r)); }
  return {rc,s:C.s,ex:C.ex,ph:C.ph,sp,exact,phet,ratio:phet/exact,pcts,ratios:ratio,rd};
}

function buildModel(){
  const st=ST, v=st.view, M={view:v,st};
  if(v==='gen'){
    M.src=turbMagnet(st);
    M.g=genState(st);
    M.R=genReadings(M.g);
    M.rot=st.genCompass?rotorFor('genRot',M.src,st.genC):null;
    M.meter=st.genMeter?meterReading(M.src,st.genM.x,st.genM.y):null;
    M.atCompass=meterReading(M.src,st.genC.x,st.genC.y);
  } else if(v==='flux'){
    M.fx=memo('flux',[st.N,st.area,st.pct,st.flow,st.th].join('|'),()=>fluxCurve(st));
  } else if(v==='face'){
    M.fc=memo('face',[st.area,st.pct,st.th,st.N].join('|'),()=>faceCurve(st));
  } else if(v==='lines'||v==='axis'){
    M.as=analysisSource(st);
    if(v==='lines') M.fl=fieldLinesFor('magnet',0);
  } else if(v==='needle'){
    M.nd=memo('needle',[st.ndB,st.ndRel,st.ndDamp].join('|'),()=>needleRun(st.ndB,st.ndRel*D2R,st.ndDamp,needleWindow(st)));
  }
  return M;
}
/* the needle view's run: the rotor released at rel from a steady field along +x */
function needleRun(Bmag,rel,gam,Tw){
  const r={phi:rel,om:0,W:0}, Bv=[Bmag,0], n=600, dt=Tw/n, ts=[0], ph=[rel], E0=rotorEnergy(r,Bv);
  let maxLedger=0;
  for(let i=1;i<=n;i++){ rotorAdvance(r,()=>Bv,0,dt,KAPPA,gam); ts.push(i*dt); ph.push(r.phi);
    maxLedger=Math.max(maxLedger,Math.abs(rotorEnergy(r,Bv)+r.W-E0)); }
  const w0=Math.sqrt(KAPPA*Bmag), disc=w0*w0-gam*gam/4;
  const lin=ts.map(t=>linearNeedle(rel,w0,gam,t));
  const zc=[]; for(let i=1;i<ph.length;i++) if(ph[i-1]>0&&ph[i]<=0) zc.push(ts[i-1]+(ts[i]-ts[i-1])*ph[i-1]/(ph[i-1]-ph[i]));
  return {Bmag,rel,gam,Tw,ts,ph,lin,w0,T0:2*Math.PI/w0,zeta:gam/(2*w0),under:disc>0,wd:disc>0?Math.sqrt(disc):NaN,
          Tbig:4*ellK(Math.cos(rel/2))/w0, Tmeas:zc.length>=2?zc[1]-zc[0]:NaN, ledger:maxLedger/E0, E0};
}
function linearNeedle(th0,w0,gam,t){
  const d=w0*w0-gam*gam/4, e=Math.exp(-gam*t/2);
  if(d>0){ const wd=Math.sqrt(d); return th0*e*(Math.cos(wd*t)+gam/(2*wd)*Math.sin(wd*t)); }
  if(d<0){ const q=Math.sqrt(-d); return th0*e*(Math.cosh(q*t)+gam/(2*q)*Math.sinh(q*t)); }
  return th0*e*(1+gam*t/2);
}

function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function fB(v){ return fmtField(v,ST.units); }
function fPos(x,y){ return '('+fmt(x,0)+', '+fmt(y,0)+') mm'; }
function fV(v){ return sigf(v*1e3,3)+' mV'; }
function fWb(v){ return sigf(v,3)+' Wb'; }
function magMoment(S){ return S/G_PER_T/MU0*Math.PI*Math.pow(MAG_R*1e-3,2)*MAG_L*1e-3; }
function meterRows(rd,title){
  if(!rd) return '';
  return hd(title)+rrow('B',fB(rd.B),'good')+rrow('B<sub>x</sub>',fB(rd.Bx))+rrow('B<sub>y</sub>',fB(rd.By))+rrow('&theta;',fmtAngle(rd.ang));

function compassRows(r,atC){
  if(!r) return '';

  return hd('the compass')+rrow('|B| there',fB(atC.B))+rrow('needle off the field',fmt(lag,1)+'&deg;',Math.abs(lag)<0.5?'good':'')
    +rrow('its small-swing period',isFinite(T)?sigf(T,3)+' s':'&mdash;');
}

  } else if(M.view==='lines'){
    const F=M.fl, u=M.as.unit, okN=F.lines.filter(l=>l.ok).length;

  } else {
    const N=M.nd;
    s+=hd('the rotor')+rrow('|B|',fB(N.Bmag))+rrow('&omega;<sub>0</sub> = &radic;(&kappa;|B|)',sigf(N.w0,4)+' rad/s')+rrow('small-swing period',sigf(N.T0,4)+' s','good')
      +rrow('damping ratio &zeta;',sigf(N.zeta,3),N.zeta<1?'':'bad')+rrow('released at',fmt(N.rel*R2D,0)+'&deg;');

  }
  s+='</table><div class="note">'+(M.view==='needle'
    ?'The compass is a damped rotor with PhET&rsquo;s constants: &kappa; = 6.25 G<sup>&minus;1</sup>s<sup>&minus;2</sup>, &gamma; = 2 s<sup>&minus;1</sup> (modelled, not measured).'
    :'The magnet is a uniformly magnetised cylinder, 250 mm &times; &oslash;50 mm, whose field is exactly that of a solenoid carrying its bound current. &Phi; is the area integral of B<sub>x</sub> over the coil&rsquo;s disc (16 &times; 32 Gauss&ndash;Legendre), and the EMF is &minus;N &omega; d&Phi;/d&theta; from its Fourier series. 1 PhET px = 1 mm here.')+'</div>';
  return s;
}
function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='gen') return E('<span class="hl">&#8496; = &minus;N d&Phi;/dt</span> &nbsp;=&nbsp; <span class="hl2">&minus;N &omega; d&Phi;/d&theta;</span>, &nbsp; &Phi;(&theta;) = &int;<sub>disc</sub> B&middot;dA',
    'Faraday&rsquo;s law: it is the CHANGE of flux that drives the current, so a magnet at rest does nothing however strong it is');
  if(M.view==='flux') return E('<span class="hl">&Phi;(&theta;) = &sum;<sub>k odd</sub> a<sub>k</sub> cos k&theta;</span> &nbsp;&rArr;&nbsp; <span class="hl2">&#8496;(&theta;) = N&omega; &sum;<sub>k</sub> k a<sub>k</sub> sin k&theta;</span>',
    'the flux is even in the angle and reverses every half turn, so only odd harmonics survive; the EMF is their derivative, and peaks well before 90&deg;');
  if(M.view==='face') return E('<span class="hl">&Phi; = &int;<sub>0</sub><sup>r</sup> &#10216;B<sub>x</sub>&#10217;(s) 2&pi;s ds</span> &nbsp;&nbsp;vs&nbsp;&nbsp; <span class="hl2">&sum;<sub>k</sub> B<sub>x</sub>(0, y<sub>k</sub>) &middot; 2&radic;(r&sup2;&minus;y<sub>k</sub>&sup2;) &Delta;y</span>',
    'the flux is an AREA integral; sampling the field only along the coil&rsquo;s vertical diameter assumes it holds off the page, where it is weaker');
  if(M.view==='lines') return E('<span class="hl">dr/ds = B/|B|</span> &nbsp;&middot;&nbsp; <span class="hl2">&Psi;(&rho;, u) = &rho;A<sub>&phi;</sub> = const</span> along a line &nbsp;&middot;&nbsp; flux between neighbours 2&pi;&Delta;&Psi;',
    'B lines never end: each one leaves the north face, returns to the south face and runs back through the magnet');
  if(M.view==='axis') return E('<span class="hl">B<sub>x</sub>(x) = &frac12;&mu;<sub>0</sub>M [ (x+b)/&radic;((x+b)&sup2;+R&sup2;) &minus; (x&minus;b)/&radic;((x&minus;b)&sup2;+R&sup2;) ]</span> &nbsp;&middot;&nbsp; <span class="hl2">&mu;<sub>0</sub>H = B &minus; &mu;<sub>0</sub>M</span> inside',
    'on the axis the field is elementary; B is continuous at the pole faces, H jumps by M there and points backwards inside');
  return E('<span class="hl">&phi;&Prime; = &kappa;|B| sin(&theta;<sub>B</sub> &minus; &phi;) &minus; &gamma;&phi;&prime;</span> &nbsp;&middot;&nbsp; <span class="hl2">T<sub>0</sub> = 2&pi;/&radic;(&kappa;|B|)</span> &nbsp;&middot;&nbsp; T(&phi;<sub>0</sub>) = 4K(sin &phi;<sub>0</sub>/2)/&omega;<sub>0</sub>',
    'a compass needle is a pendulum in the field: it swings faster in a stronger field, and its period measures |B|');
}
function tagHTML(M){
  const st=ST;
  if(M.view==='gen') return '<b>the generator</b> — '+fmt(st.flow,0)+' % flow, '+st.N+' loop'+(st.N>1?'s':'')+', '+st.area+' % area';
  if(M.view==='flux') return '<b>flux and EMF</b> — over one turn of the wheel';
  if(M.view==='face') return '<b>the coil face</b> — the area integral against PhET’s line sample';
  if(M.view==='lines') return '<b>field lines</b> — the turbine’s bar magnet';
  if(M.view==='axis') return '<b>on the axis</b> — the turbine’s bar magnet';
  return '<b>the needle</b> — |B| = '+fB(st.ndB)+', released at '+st.ndRel+'°';
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — verbatim from build_buoy/p4_views.js (build_cycloid lineage)     *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);

function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);

  let mainH=avail;

    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;

    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));

function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){

/* ================================================================== *
 *  drawing primitives shared by the family: the needle field, the     *
 *  bar magnet, the Earth, the compass, the field meter, the coil, the *
 *  supplies, electrons.  Everything is an explicit polygon in device  *
 *  coordinates (Known-bad: the recorder has no ellipse(), and a       *
 *  scaled arc does not survive restore()).                            *
 * ================================================================== */
const HINT_H=18;       /* the house #hint (HTML, bottom 11 px) owns the last line: every caption ends above it */
function ellipsePts(cx,cy,rx,ry,rot,a0,a1,n){
  const out=[], c=Math.cos(rot||0), s=Math.sin(rot||0);
  n=n||40; a0=a0||0; a1=(a1===undefined)?TAU:a1;
  for(let i=0;i<=n;i++){ const t=a0+(a1-a0)*i/n, x=rx*Math.cos(t), y=ry*Math.sin(t); out.push([cx+x*c-y*s, cy+x*s+y*c]); }
  return out;
}
/* a label at exactly this place or not at all (lab() shifts by 16 px, which would carry the
   N and S off the magnet); it honours the same registry, so a tool's panel reserved before the
   magnet is drawn makes the letters underneath it step aside */
function labStrict(ctx,x,y,txt,col,font,align,base){
  const t=plain(txt), fs=parseFloat(font.match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  const lx=align==='center'?x-w/2:(align==='right'?x-w:x);
  const ly=base==='top'?y:(base==='middle'?y-hh/2:(base==='bottom'?y-hh:y-hh*0.8));
  const bx=[lx,ly,lx+w,ly+hh];
  if(!labFits(bx)) return false;
  LABELS.push(bx); ctx.fillStyle=col; ctx.font=font; ctx.textAlign=align; ctx.textBaseline=base; ctx.fillText(t,x,y);
  return true;
}
function pathPts(ctx,pts,close){ ctx.beginPath(); pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); if(close) ctx.closePath(); }
/* the world rectangle of the magnet (centre, axis angle) in device coordinates */
function magnetCorners(map,m,halfL,halfW){
  const c=Math.cos(m.ang), s=Math.sin(m.ang);
  const P=(u,v)=>[map.X(m.x+u*c-v*s), map.Y(m.y+u*s+v*c)];
  return {P, pts:[P(-halfL,-halfW),P(halfL,-halfW),P(halfL,halfW),P(-halfL,halfW)]};
}
/* the needle field: each needle a diamond, north half green (the computed direction), south
   half grey; brightness is PhET's display mapping of |B| */
function drawNeedleField(ctx,map,grid,scale){
  const Lh=NEEDLE_LEN/2*map.s*(scale||1), Wh=Math.max(1.2,NEEDLE_LEN*0.14*map.s*(scale||1));
  for(const n of grid){
    if(n.alpha<0.02) continue;
    const X=map.X(n.x), Y=map.Y(n.y), c=Math.cos(n.ang), s=-Math.sin(n.ang);
    const tip=[X+Lh*c,Y+Lh*s], tail=[X-Lh*c,Y-Lh*s], l=[X-Wh*s,Y+Wh*c], r=[X+Wh*s,Y-Wh*c];
    ctx.globalAlpha=n.alpha;
    pathPts(ctx,[tip,l,r],true); ctx.fillStyle=COL.north; ctx.fill();
    pathPts(ctx,[tail,l,r],true); ctx.fillStyle=COL.needleS; ctx.fill();
  }
  ctx.globalAlpha=1;
}
/* the bar magnet: N half green, S half magenta (field lines leave N and enter S, as they
   leave + and enter - in the charges sims); see-inside draws it as an outline with the
   interior field as small needles along the model's own B inside */
function drawBarMagnet(ctx,map,m,opt){
  const o=opt||{}, K=magnetCorners(map,m,MAG_B,MAG_R), P=K.P;
  /* ghost: the body drawn see-through so the field lines running through it stay visible --
     an opaque magnet hides the very thing the field-lines view exists to show (Known-bad) */
  const inside=!!o.seeInside, ghost=!!o.ghost;
  const nFill=ghost?rgba(COL.north,0.16):(inside?rgba(COL.north,0.10):mix('#070b18',COL.north,0.78));
  const sFill=ghost?rgba(COL.south,0.16):(inside?rgba(COL.south,0.10):mix('#070b18',COL.south,0.72));
  pathPts(ctx,[P(0,-MAG_R),P(MAG_B,-MAG_R),P(MAG_B,MAG_R),P(0,MAG_R)],true); ctx.fillStyle=nFill; ctx.fill();
  pathPts(ctx,[P(-MAG_B,-MAG_R),P(0,-MAG_R),P(0,MAG_R),P(-MAG_B,MAG_R)],true); ctx.fillStyle=sFill; ctx.fill();
  pathPts(ctx,K.pts,true); ctx.strokeStyle=(inside||ghost)?'#cfd4de':'#0b0e16'; ctx.lineWidth=(inside||ghost)?1.2:1.4; ctx.stroke();

    const src={kind:'magnet',x:m.x,y:m.y,ang:m.ang,S:m.S}, c=Math.cos(m.ang), s=Math.sin(m.ang);
    const pts=[];
    for(let i=0;i<7;i++) for(const v of [-MAG_R*0.5,MAG_R*0.5]){ const u=-MAG_B+MAG_L*(i+0.5)/7; pts.push({x:m.x+u*c-v*s,y:m.y+u*s+v*c}); }
    const g=pts.map(p=>{ const B=magnetField(src,p.x,p.y,0), mg=Math.hypot(B[0],B[1]); return {x:p.x,y:p.y,ang:Math.atan2(B[1],B[0]),alpha:needleAlpha(mg)}; });
    drawNeedleField(ctx,map,g,0.9);
  }

    /* the bound current K = M x n on the side wall: out of the page along one long edge,
       into it along the other (dots and crosses), the same current an equal solenoid carries */
    const n=9, r=Math.max(2.4,4.2*map.s);

      const u=-MAG_B+MAG_L*(i+0.5)/n;
      const A=P(u,MAG_R), B=P(u,-MAG_R);
      dot(ctx,A[0],A[1],r,'#070b18',COL.bound,1.1); dot(ctx,A[0],A[1],r*0.28,COL.bound);
      dot(ctx,B[0],B[1],r,'#070b18',COL.bound,1.1);
      ctx.beginPath(); ctx.moveTo(B[0]-r*0.62,B[1]-r*0.62); ctx.lineTo(B[0]+r*0.62,B[1]+r*0.62);
      ctx.moveTo(B[0]-r*0.62,B[1]+r*0.62); ctx.lineTo(B[0]+r*0.62,B[1]-r*0.62); ctx.strokeStyle=COL.bound; ctx.lineWidth=1.1; ctx.stroke();
    }
  }
  if(o.labels!==false&&map.s*MAG_R>7){
    const fs=Math.max(10,Math.min(20,MAG_R*1.1*map.s)), fnt='600 '+fs.toFixed(1)+'px -apple-system, sans-serif';
    const nP=P(MAG_B*0.62,0), sP=P(-MAG_B*0.62,0);

/* the Earth (a qualitative picture, as PhET's): a globe round the magnet, geographic north at
   the magnet's SOUTH pole, because Earth's north magnetic pole is a south pole */
const EARTH_R=190;
function drawEarth(ctx,map,m){
  const X=map.X(m.x), Y=map.Y(m.y), R=EARTH_R*map.s;
  dot(ctx,X,Y,R,'#0f2438','#3d6d8f',1.2);

  ctx.strokeStyle='rgba(120,170,205,0.35)'; ctx.lineWidth=0.9;
  for(const lat of [-60,-30,0,30,60]){           /* parallels: chords perpendicular to the polar axis */
    const d=Math.sin(lat*D2R)*R, w=Math.cos(lat*D2R)*R;
    const cx=X-d*c, cy=Y-d*s;
    ctx.beginPath(); ctx.moveTo(cx-w*s,cy+w*c); ctx.lineTo(cx+w*s,cy-w*c); ctx.stroke();
  }
  for(const f of [0.35,0.75]){                    /* meridians: ellipses through the poles */
    pathPts(ctx,ellipsePts(X,Y,R,R*f,Math.atan2(s,c),0,TAU,48),false); ctx.stroke();
  }
  const gn=[X-R*1.08*c,Y-R*1.08*s];
  lab(ctx,99999,99999,gn[0],gn[1],'geographic N',COL.dim,SM_FONT,'center','middle');
}
/* the compass: PhET's ring (radius 35) and needle (length 55), at world scale */
function drawCompass(ctx,map,x,y,phi){
  const X=map.X(x), Y=map.Y(y), R=35*map.s, Lh=27.5*map.s, Wh=Math.max(2,7.7*map.s);
  dot(ctx,X,Y,R+4*map.s,'rgba(10,12,18,0.72)');
  ctx.beginPath(); ctx.arc(X,Y,R,0,TAU); ctx.strokeStyle='#aeb6c6'; ctx.lineWidth=Math.max(2,6*map.s); ctx.stroke();
  for(let k=0;k<8;k++){ const a=k*Math.PI/4; dot(ctx,X+R*Math.cos(a),Y-R*Math.sin(a),Math.max(1.4,2.6*map.s),'#070b18'); }
  const c=Math.cos(phi), s=-Math.sin(phi);
  const tip=[X+Lh*c,Y+Lh*s], tail=[X-Lh*c,Y-Lh*s], l=[X-Wh*s,Y+Wh*c], r=[X+Wh*s,Y-Wh*c];
  pathPts(ctx,[tip,l,r],true); ctx.fillStyle=COL.north; ctx.fill();
  pathPts(ctx,[tail,l,r],true); ctx.fillStyle='#d9dde6'; ctx.fill();
  dot(ctx,X,Y,Math.max(1.6,3*map.s),'#070b18','#aeb6c6',1);
}
/* the field meter: the probe (crosshair ring) and a body carrying B, Bx, By and theta */
function meterBodyBox(map,x,y){
  const X=map.X(x), Y=map.Y(y), r=Math.max(10,18*map.s);
  return {X,Y,r,bx:X-58,by:Y+r+Math.max(8,15*map.s),bw:116,bh:70};
}
function drawFieldMeter(ctx,map,x,y,rd,units){
  const G=meterBodyBox(map,x,y);
  ctx.beginPath(); ctx.moveTo(G.X,G.Y+G.r); ctx.lineTo(G.X,G.by); ctx.strokeStyle='#dfe3ea'; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.arc(G.X,G.Y,G.r,0,TAU); ctx.strokeStyle='#dfe3ea'; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(G.X-G.r*0.55,G.Y); ctx.lineTo(G.X+G.r*0.55,G.Y); ctx.moveTo(G.X,G.Y-G.r*0.55); ctx.lineTo(G.X,G.Y+G.r*0.55);
  ctx.strokeStyle=COL.live; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle='rgba(16,19,27,0.94)'; ctx.fillRect(G.bx,G.by,G.bw,G.bh);
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1; ctx.strokeRect(G.bx+0.5,G.by+0.5,G.bw-1,G.bh-1);
  LABELS.push([G.bx,G.by,G.bx+G.bw,G.by+G.bh]);
  const rows=[['B',fmtField(rd.B,units)],['Bx',fmtField(rd.Bx,units)],['By',fmtField(rd.By,units)],['θ',fmtAngle(rd.ang)]];
  ctx.font='10.5px -apple-system, sans-serif';
  rows.forEach((rw,i)=>{ const yy=G.by+11+i*16;
    ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#8b93a6'; ctx.fillText(rw[0],G.bx+7,yy);
    ctx.textAlign='right'; ctx.fillStyle='#e9ecf2'; ctx.fillText(rw[1],G.bx+G.bw-7,yy); });

}
/* ---------------- the coil (electromagnet and pickup) ---------------- *
 * each loop is drawn as an ellipse (width 0.36 of its height, a perspective hint only),
 * the back half first and dim, the front half after the field needles; the wire is drawn
 * at its world width */
/* #coil */
const COIL_TILT=0.28;
function loopPts(map,cx,cy,a,half){
  /* half: 'back' (the far side, z < 0, drawn left) or 'front' (z > 0, drawn right) */
  const X=map.X(cx), Y=map.Y(cy), ry=a*map.s, rx=a*COIL_TILT*map.s;
  return half==='back'?ellipsePts(X,Y,rx,ry,0,Math.PI/2,1.5*Math.PI,30):ellipsePts(X,Y,rx,ry,0,-Math.PI/2,Math.PI/2,30);
}
/* One half of every turn, in two passes: all the dark rims first, then all the copper, so one
   turn's rim cannot paint over its neighbour's face.  At PhET's wire width (16 mm) and loop
   spacing (0) the turns touch, and without the rims the coil reads as a solid tube. */
function drawCoilHalf(ctx,map,xs,cx,cy,a,wire,half){
  const lw=Math.max(2,wire*map.s), paths=xs.map(xk=>loopPts(map,cx+xk,cy,a,half));
  ctx.lineCap='round';
  for(const p of paths){ pathPts(ctx,p,false); ctx.strokeStyle='#0a0d15'; ctx.lineWidth=lw+2; ctx.stroke(); }
  for(const p of paths){ pathPts(ctx,p,false); ctx.strokeStyle=half==='back'?mix('#070b18',COL.copper,0.5):COL.copper; ctx.lineWidth=Math.max(1.2,lw-2.2); ctx.stroke(); }
  ctx.lineCap='butt';
}
/* electrons on the front halves, staggered turn by turn so they read as a flow along the
   winding rather than as a lattice */
function drawElectrons(ctx,map,xs,cx,cy,a,phase,per){
  const r=Math.max(1.8,3.2*map.s);
  xs.forEach((xk,k)=>{
    for(let i=0;i<per;i++){
      const t=(((i+(k%2?0.5:0))/per+phase)%1+1)%1, ang=-Math.PI/2+Math.PI*t;
      const X=map.X(cx+xk)+a*COIL_TILT*map.s*Math.cos(ang), Y=map.Y(cy)-a*map.s*Math.sin(ang);
      dot(ctx,X,Y,r,COL.electron,'#070b18',0.8);
    }
  });
}
/* #endcoil */

/* #gen */
/* The light bulb.  The MODEL brightness is PhET's own rule, |EMF| against full scale, and
   the readout prints it; but this generator's peak is only about a fifth of full scale, so
   the glass is painted through a display mapping, sqrt(b) -- the same kind of thing PhET does
   to the field needles' alpha.  BULB_GAMMA is that mapping and nothing else depends on it. */
const BULB_GAMMA=0.5, BULB_ON=0.02;
function bulbShade(b){ return Math.pow(Math.min(1,Math.max(0,b)),BULB_GAMMA); }
function drawBulb(ctx,map,x,y,b){
  const X=map.X(x), Y=map.Y(y), R=34*map.s, g=bulbShade(b);
  /* the glow in three nested discs rather than one: a single translucent circle reads as a
     disc with a hard edge, three of them fade */
  if(b>BULB_ON){ ctx.globalAlpha=Math.min(1,g);
    for(const k of [2.1,1.7,1.35]) dot(ctx,X,Y,R*(1+(k-1)*(0.4+0.6*g)),'rgba(255,224,130,0.11)');
    ctx.globalAlpha=1; }
  dot(ctx,X,Y,R,mix('#1b2130','#ffe38a',g),'#aeb6c6',1.2);
  ctx.fillStyle='#5c6478'; ctx.fillRect(X-R*0.45,Y+R*0.85,R*0.9,R*0.55);
  if(b>BULB_ON){ ctx.strokeStyle=rgba('#ffe38a',Math.min(1,g)); ctx.lineWidth=1.4;
    for(let k=0;k<8;k++){ const a=k*Math.PI/4+Math.PI/8; ctx.beginPath(); ctx.moveTo(X+R*1.15*Math.cos(a),Y-R*1.15*Math.sin(a)); ctx.lineTo(X+R*(1.35+0.5*g)*Math.cos(a),Y-R*(1.35+0.5*g)*Math.sin(a)); ctx.stroke(); } }
  return {bottom:[X,Y+R*1.4]};
}
/* the voltmeter: a dial from -90 to +90 degrees; the needle is (EMF / full scale) x 90 degrees */
function drawVoltmeter(ctx,map,x,y,deg,emf){
  const X=map.X(x), Y=map.Y(y), R=46*map.s;
  ctx.fillStyle='#161b27'; ctx.fillRect(X-R*1.15,Y-R*0.95,R*2.3,R*1.45);
  ctx.strokeStyle='#5c6478'; ctx.lineWidth=1; ctx.strokeRect(X-R*1.15+0.5,Y-R*0.95+0.5,R*2.3-1,R*1.45-1);
  ctx.beginPath(); ctx.arc(X,Y+R*0.3,R*0.95,Math.PI,2*Math.PI); ctx.strokeStyle='#5c6478'; ctx.lineWidth=1.2; ctx.stroke();
  for(const t of [-90,-45,0,45,90]){ const a=(90-t)*D2R, c=Math.cos(a), s=Math.sin(a);
    ctx.beginPath(); ctx.moveTo(X+R*0.82*c,Y+R*0.3-R*0.82*s); ctx.lineTo(X+R*0.95*c,Y+R*0.3-R*0.95*s); ctx.stroke(); }
  const a=(90-deg)*D2R;
  ctx.beginPath(); ctx.moveTo(X,Y+R*0.3); ctx.lineTo(X+R*0.88*Math.cos(a),Y+R*0.3-R*0.88*Math.sin(a)); ctx.strokeStyle=COL.live; ctx.lineWidth=2; ctx.stroke();
  dot(ctx,X,Y+R*0.3,Math.max(2,3*map.s),'#aeb6c6');
  ctx.font=Math.max(9.5,10.5*map.s).toFixed(1)+'px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillStyle='#e9ecf2'; ctx.fillText(sigf(emf*1e3,3)+' mV',X,Y+R*0.48);
  return {bottom:[X,Y+R*0.5]};
}
/* #endgen */
/* a world-space polyline of meridional (rho, u) points about a source frame, one half */
function linePts(map,cx,cy,ang,pts,sgn){
  const c=Math.cos(ang), s=Math.sin(ang), out=new Array(pts.length);
  for(let i=0;i<pts.length;i++){ const u=pts[i][1], v=sgn*pts[i][0]; out[i]=[map.X(cx+u*c-v*s), map.Y(cy+u*s+v*c)]; }
  return out;
}
/* clip a device polyline to a box (Liang-Barsky per segment), stroke it, and record it */
function strokeClipped(ctx,b,pts,col,lw,dash){
  ctx.beginPath(); let started=false;
  for(let i=0;i<pts.length-1;i++){
    const X0=pts[i][0],Y0=pts[i][1],X1=pts[i+1][0],Y1=pts[i+1][1];
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-b.x],[dx,b.x1-X0],[-dy,Y0-b.y],[dy,b.y1-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p; if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; } else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const xa=X0+t0*dx, ya=Y0+t0*dy, xb=X0+t1*dx, yb=Y0+t1*dy;
    if(t0>0) started=false;
    if(!started){ ctx.moveTo(xa,ya); started=true; }
    ctx.lineTo(xb,yb); POLY_SEGS.push(xa,ya,xb,yb);

/* an arrowhead at the midpoint of a device polyline, pointing along it (sgn -1 reverses) */
function lineArrow(ctx,b,pts,frac,col,sgn){

  for(let i=1;i<pts.length;i++){ L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); cum.push(L); }
  const target=L*frac; let i=1; while(i<pts.length-1&&cum[i]<target) i++;
  const p=pts[i], q=pts[i-1]; const X=p[0], Y=p[1];
  if(X<b.x+4||X>b.x1-4||Y<b.y+4||Y>b.y1-4) return;
  let ux=p[0]-q[0], uy=p[1]-q[1]; const m=Math.hypot(ux,uy)||1; ux=ux/m*(sgn||1); uy=uy/m*(sgn||1);

const SCREEN_CAP={};


function screenGeo(ctx,W,H,key){
  const narrow=isNarrow(W), top=stageTop()+22, left=10, right=narrow?W-10:W-RO_W-34;

}
function screenBack(ctx,W,H,G){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);

}
function screenCaption(ctx,G){ caption(ctx,G.left,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT); }



/* ---------------- pointer handling on the screens ---------------- */
function clampWorld(p,mx,my){ p.x=clamp(p.x,mx,LAYOUT_W-mx); p.y=clamp(p.y,my,LAYOUT_H-my); }
function hitMeter(map,p,X,Y){ const G=meterBodyBox(map,p.x,p.y); return Math.hypot(X-G.X,Y-G.Y)<=G.r+4||(X>=G.bx&&X<=G.bx+G.bw&&Y>=G.by-4&&Y<=G.by+G.bh); }
function hitCompass(map,p,X,Y){ return Math.hypot(X-map.X(p.x),Y-map.Y(p.y))<=42*map.s+4; }
/* what each screen offers the pointer, in the order it is tried: the tools first, the source
   last, each with the margin its own body needs when it is dragged to an edge.  A screen this
   page does not carry registers nothing (family.py strips the entries it has no screen for). */
const DRAG_CANDS={};


function screenPointer(type,X,Y,W,H,ctx0){
  const st=ST, make=DRAG_CANDS[st.view];
  if(type==='up'){ const was=!!DRAG.what; DRAG.what=null; return was; }
  if(!make) return false;
  const ctx=ctx0||makeMeasureCtx(), G=screenGeo(ctx,W,H,st.view), map=G.map;
  if(type==='down'){
    for(const c of make(st,map,X,Y)){
      if(!c.on) continue;
      const p=st[c.k];
      if(c.hit(p)){ DRAG.what=c.k; DRAG.dx=map.wx(X)-p.x; DRAG.dy=map.wy(Y)-p.y; DRAG.mx=c.mx; DRAG.my=c.my; return true; }
    }
    return false;
  }
  if(type==='move'&&DRAG.what){
    const p=st[DRAG.what]; if(!p) return false;
    p.x=map.wx(X)-DRAG.dx; p.y=map.wy(Y)-DRAG.dy;
    clampWorld(p,DRAG.mx,DRAG.my);
    /* the needle needs no waking here: rotorTick compares it with the field at the compass's
       present place every frame, so a drag that changes either wakes it by itself (the
       rest = false lines that stood here were provably redundant -- the mutation sweep found
       them equivalent, which is how dead code announces itself) */
    return true;
  }
  return false;
}
/* a measuring context for layout outside a draw (the caption's height sets the play area) */
function makeMeasureCtx(){
  const st={font:'10px sans-serif'};
  return {get font(){ return st.font; }, set font(v){ st.font=v; },
    measureText(t){ const m=/(\d+(?:\.\d+)?)px/.exec(st.font||''); return {width:(''+t).length*(m?parseFloat(m[1]):10)*0.52}; }};
}

/* ================================================================== *
 *  the analysis views: field lines, on the axis, the far field, the   *
 *  needle                                                             *
 * ================================================================== */
const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function pow10Label(e){ return '10'+String(e).split('').map(c=>SUPS[c]).join(''); }
function viewBack(ctx,W,H){ ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H); LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[]; }
/* the house stage layout, with the caption kept clear of the #hint line */
function stageLayoutH(ctx,W,H,full,short,nB,frac){
  const L=stageLayout(ctx,W,H-HINT_H,full,short,nB||0,frac||0.3);
  /* stageLayout leaves 16 px under a lone main panel, which is not enough for its x-tick
     labels (b.y1 + 5) and axis title (b.y1 + 21): give them 34 */
  if(!nB) L.main=box(L.main.x,L.main.y,L.main.w,Math.max(80,L.main.h-34));
  return L;
}
/* axesR with tick counts from the box, and the lowest y label dropped when it would share the
   bottom-left corner with the first x label (the y labels hang ~28 px left of the frame, so the
   corner belongs to both: Known-bad, a tick gutter is part of a panel's footprint) */
function tickFmt(ticks){
  let g=Infinity;
  for(let i=1;i<ticks.length;i++) g=Math.min(g,Math.abs(ticks[i]-ticks[i-1]));
  const d=Math.max(0,Math.min(4,Math.ceil(-Math.log10(g||1))));
  return t=>fmt(t,d);
}
function axesQ(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o={}; for(const k in (opt||{})) o[k]=opt[k];
  if(!o.xticks) o.xticks=ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),b.w<430?4:(o.nx||6));
  if(!o.yticks) o.yticks=ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),b.h<250?3:(o.ny||5));
  o.yticks=o.yticks.filter(t=>b.y1-b.h*(t-ylo)/(yhi-ylo||1)<b.y1-11);
  if(!o.xfmt) o.xfmt=tickFmt(o.xticks);
  if(!o.yfmt) o.yfmt=tickFmt(o.yticks);
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
}
/* log ticks with 2 and 5 between the decades when the span is short, so a two-decade axis
   is not labelled twice */
function logTicksFine(lo,hi,wpx){
  const dec=decadeTicks(lo,hi,wpx);
  if(Math.floor(hi)-Math.ceil(lo)>3||wpx<380) return dec;
  const out=[];
  for(let e=Math.floor(lo)-1;e<=Math.ceil(hi);e++) for(const m of [1,2,5]){
    const v=e+Math.log10(m); if(v>=lo-1e-9&&v<=hi+1e-9) out.push(v); }
  return out.length>=3?out:dec;
}
const logLabel=t=>t>=4?pow10Label(Math.round(t)):sigf(Math.pow(10,t),2);
/* decade ticks, thinned so their labels cannot touch on a short axis */
function decadeTicks(lo,hi,hpx){
  const n=Math.floor(hi)-Math.ceil(lo)+1, step=Math.max(1,Math.ceil(15*n/Math.max(1,hpx)));
  const out=[]; for(let e=Math.ceil(lo);e<=Math.floor(hi);e+=step) out.push(e);
  return out.length?out:[Math.round((lo+hi)/2)];
}
function scaleBar(ctx,map,b,mm,label){
  const X0=b.x+14, Y0=b.y1-14, len=mm*map.s;
  if(len>b.w*0.5) return;
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X0+len,Y0); ctx.moveTo(X0,Y0-4); ctx.lineTo(X0,Y0+4); ctx.moveTo(X0+len,Y0-4); ctx.lineTo(X0+len,Y0+4);
  ctx.strokeStyle='#8b93a6'; ctx.lineWidth=1; ctx.stroke();
  ctx.font=SM_FONT; ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6'; ctx.fillText(label,X0,Y0-6);
  LABELS.push([X0,Y0-6-12,X0+label.length*10.5*0.52,Y0-6]);
}

/* ---------------- field lines ---------------- */
/* what each source contributes to the analysis views: the frame it wants, what it says about

}
function LINES_CAP(M,full){

function drawLinesView(ctx,W,H,M){

/* ---------------- on the axis ---------------- */
/* A FUNCTION, not a const: half of the magnet's caption is about mu0 H, which has its own

function axisCap(k){

  const h=ST.axisH;

function axisGeo(ctx,W,H,M){ const c=axisCap(M.as.kind); return stageLayoutH(ctx,W,H,c[0],c[1],0); }
function axisCurves(M){
  const A=M.as, n=801, xs=[], B=[], Hh=[], dip=[], ref=[], xr=ANA_SRC[A.kind].axisRange;

function drawAxisView(ctx,W,H,M){

SCREEN_CAP.gen=['The water wheel turns the bar magnet; the pickup coil’s loops are circles perpendicular to the page, drawn in perspective. The flux through them is the area integral of B over the disc, and the EMF is −N dΦ/dt, so the bulb lights only while the magnet TURNS. Needles every 40 mm along B, brightness PhET’s display mapping. Electron speed shows the current, not a drift speed; the drag of the coil on the wheel is PhET’s phenomenological rule.',
