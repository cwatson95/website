function waterW(flow){ return 4+46*flow/100; }
/* rectangles as paths, not fillRect: a path is geometry the tests can measure */
function rectPath(ctx,x,y,w,hh){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+hh); ctx.lineTo(x,y+hh); ctx.closePath(); }
function waterHit(){ return TURB_Y+Math.sqrt(Math.max(0,WHEEL_R*WHEEL_R-Math.pow(TURB_X-FAUCET_X,2))); }
function drawFaucet(ctx,map,flow){
  const X=map.X(FAUCET_X), Ytop=map.Y(FAUCET_TOP), Ys=map.Y(SPOUT_Y), w=Math.max(3,26*map.s);
  rectPath(ctx,X-w/2,Ytop,w,Ys-Ytop); ctx.fillStyle='#3a4256'; ctx.fill();
  ctx.strokeStyle='#5c6478'; ctx.lineWidth=1; ctx.stroke();
  rectPath(ctx,X-w*0.85,Ys-w*0.45,w*1.7,w*0.55); ctx.fillStyle='#4a5468'; ctx.fill();
  if(flow>0){
    const ww=Math.max(2,waterW(flow)*map.s);
    rectPath(ctx,X-ww/2,Ys,ww,map.Y(waterHit())-Ys);
    ctx.fillStyle=rgba(COL.water,0.75); ctx.fill();
  }
}
/* the wheel: a rim, eight spokes from the hub and a paddle on each, turning with the magnet */
function drawWheel(ctx,map,th){
  const X=map.X(TURB_X), Y=map.Y(TURB_Y), R=WHEEL_R*map.s;
  ctx.beginPath(); ctx.arc(X,Y,R,0,TAU); ctx.strokeStyle='#4a5468'; ctx.lineWidth=Math.max(2,5*map.s); ctx.stroke();
  ctx.beginPath(); ctx.arc(X,Y,R*0.86,0,TAU); ctx.strokeStyle='#39415a'; ctx.lineWidth=Math.max(1,2*map.s); ctx.stroke();
  for(let k=0;k<8;k++){
    const a=th+k*TAU/8, c=Math.cos(a), s=Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(X+R*0.12*c,Y-R*0.12*s); ctx.lineTo(X+R*0.86*c,Y-R*0.86*s);
    ctx.strokeStyle='#5c6478'; ctx.lineWidth=Math.max(1.5,4*map.s); ctx.stroke();
    /* the paddle itself, across the spoke at the rim */
    const px=X+R*0.93*c, py=Y-R*0.93*s, t=R*0.17;
    ctx.beginPath(); ctx.moveTo(px-t*s,py-t*c); ctx.lineTo(px+t*s,py+t*c);
    ctx.strokeStyle='#6d768c'; ctx.lineWidth=Math.max(2,6*map.s); ctx.stroke();
  }
  dot(ctx,X,Y,Math.max(2,6*map.s),'#8b93a6');
}
/* PhET writes the wheel's speed in its hub (RPMDisplay, one decimal and the unit).  It goes
   on LAST, because the magnet is bolted across the hub and would otherwise cover it. */
function drawRPM(ctx,map,rpm){
  if(!(rpm>0)) return;
  const X=map.X(TURB_X), Y=map.Y(TURB_Y), r=Math.max(16,27*map.s), fs=Math.max(9,13*map.s);
  dot(ctx,X,Y,r,'rgba(9,12,22,0.9)','#5c6478',1.2);
  ctx.font='600 '+fs.toFixed(1)+'px -apple-system, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#e9ecf2'; ctx.fillText(fmt(rpm,1),X,Y-fs*0.42);
  ctx.font=(fs*0.72).toFixed(1)+'px -apple-system, sans-serif'; ctx.fillStyle='#aeb6c6'; ctx.fillText('RPM',X,Y+fs*0.62);
  LABELS.push([X-r,Y-r,X+r,Y+r]);
}
/* where each indicator takes its two wires, in world coordinates */
function indTerminals(st,rc){
  const P=indicatorPos(rc), d=st.indicator==='bulb'?16:30, y=P.y-(st.indicator==='bulb'?50:26);
  return {x:P.x, y, dx:d};
}
/* the pickup coil's leads run up to whichever indicator is chosen (drawn before the coil's
   front turns, so they come out from behind it) */
function drawLeads(ctx,map,rc){
  const T=indTerminals(ST,rc), xs=pickLoopsX(ST.N);
  const lx=PICK_X+xs[0]-8, rx=PICK_X+xs[xs.length-1]+8, top=PICK_Y+rc*0.72;
  ctx.beginPath();
  for(const [x,tx] of [[lx,T.x-T.dx],[rx,T.x+T.dx]]){
    ctx.moveTo(map.X(x),map.Y(top)); ctx.lineTo(map.X(x),map.Y(T.y)); ctx.lineTo(map.X(tx),map.Y(T.y));
  }
  ctx.strokeStyle=COL.copper; ctx.lineWidth=Math.max(1.5,4*map.s); ctx.lineJoin='round'; ctx.stroke();
}
function drawGenScreen(ctx,W,H,M){
  const st=ST, G=screenGeo(ctx,W,H,'gen'), map=G.map, R=M.R, rc=R.rc, xs=pickLoopsX(st.N);
  LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[];
  screenBack(ctx,W,H,G);
  if(st.genMeter){ const mb=meterBodyBox(map,st.genM.x,st.genM.y); LABELS.push([mb.bx,mb.by,mb.bx+mb.bw,mb.by+mb.bh]); }
  if(st.genField&&M.src.S>0) drawNeedleField(ctx,map,needleGrid(M.src,0,0,LAYOUT_W,LAYOUT_H));
  drawFaucet(ctx,map,st.flow);
  drawWheel(ctx,map,st.th);
  drawBarMagnet(ctx,map,M.src,{seeInside:st.seeInside});
  drawRPM(ctx,map,R.rpm);
  /* the coil: back halves, the leads, the front halves and the electrons on them, and the
     indicator last of all, so nothing is drawn across its face */
  drawCoilHalf(ctx,map,xs,PICK_X,PICK_Y,rc,PICK_WIRE*2,'back');
  drawLeads(ctx,map,rc);
  drawCoilHalf(ctx,map,xs,PICK_X,PICK_Y,rc,PICK_WIRE*2,'front');
  if(st.electrons&&Math.abs(R.norm)>1e-9) drawElectrons(ctx,map,xs,PICK_X,PICK_Y,rc,LIVE.ePhase,4);
  const P=indicatorPos(rc);
  if(st.indicator==='bulb') drawBulb(ctx,map,P.x,P.y,Math.min(1,R.bulb));
  else drawVoltmeter(ctx,map,P.x,P.y,R.needle,R.emf);
  if(st.genCompass) drawCompass(ctx,map,st.genC.x,st.genC.y,M.rot.phi);
  if(st.genMeter) drawFieldMeter(ctx,map,st.genM.x,st.genM.y,M.meter,st.units);
  if(st.flow===0) lab(ctx,W,H,map.X(TURB_X),map.Y(TURB_Y-WHEEL_R-26),'the faucet is closed: nothing turns, so no EMF',COL.dim,SM_FONT,'center','middle');
  else if(M.src.S===0) lab(ctx,W,H,map.X(TURB_X),map.Y(TURB_Y-WHEEL_R-26),'strength 0: no field, so no flux and no EMF',COL.dim,SM_FONT,'center','middle');
  screenCaption(ctx,G);
  return G;
}
/* what the pointer can take hold of here: the two tools.  The magnet is not draggable --
   it is bolted to the wheel, as PhET's is. */
DRAG_CANDS.gen=(st,map,X,Y)=>[{k:'genM',on:st.genMeter,hit:p=>hitMeter(map,p,X,Y),mx:10,my:10},
                              {k:'genC',on:st.genCompass,hit:p=>hitCompass(map,p,X,Y),mx:10,my:10}];

/* ---------------- flux and EMF over one turn ---------------- */
const FLUX_CAP=['Top: the flux through all N loops as the wheel turns one revolution, against the single cosine a₁cos θ that a far-off magnet would give (orange dashed) — the magnet is close, so the flux is flat-topped and its higher harmonics matter. Below: the EMF that follows, −N ω dΦ/dθ. It is zero where the flux is stationary, and its peak stands well before 90°, marked; a pure cosine flux would peak exactly at 90°. Only odd harmonics appear, because half a turn reverses the magnet.',
  'Φ(θ) over one turn against the first harmonic alone (orange), and the EMF −Nω dΦ/dθ below it, whose peak is not at 90°.'];
function fluxGeo(ctx,W,H){ return stageLayoutH(ctx,W,H,FLUX_CAP[0],FLUX_CAP[1],1,0.46,1); }
/* with the faucet closed there is no EMF at any angle; the shape is still worth drawing, so
   the lower panel then shows what full flow WOULD give, and says so */
function shownOmega(F){ return F.rd.omega>0?{om:F.rd.omega,live:true}:{om:2*Math.PI*RPM_MAX*(1-F.rd.drag)/60,live:false}; }
function drawFluxView(ctx,W,H,M){
  viewBack(ctx,W,H);
  const L=fluxGeo(ctx,W,H), b=L.main, b2=L.bottom[0], F=M.fx, S=shownOmega(F);
  const deg=F.th.map(t=>t*R2D);
  /* --- the flux --- */
  /* microwebers: at 1e-6 Wb every tick label rounds to 0.0000 (tickFmt stops at four places) */
  const phi=F.phi.map(v=>v*1e6), one=F.one.map(v=>v*1e6);
  let lo=0, hi=0; for(const v of phi.concat(one)){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
  if(!(hi>lo)){ hi=1e-3; lo=-1e-3; }
  const pd=0.12*(hi-lo);
  /* no x label on the upper panel: it shares the lower one's axis, and the house layout
     leaves the lower panel's title exactly where an upper x label would sit */
  axesQ(ctx,b,0,360,lo-pd,hi+pd,{ylab:'Φ through N loops, μWb',
    title:'the flux through the pickup coil, one turn of the wheel',nx:8,ny:6});
  polyline(ctx,b,deg,one,0,360,lo-pd,hi+pd,COL.ref,1.3,[6,4]);
  polyline(ctx,b,deg,phi,0,360,lo-pd,hi+pd,COL.north,2);
  const Xd=d=>b.x+b.w*d/360, Yv=(v,bb,l2,h2)=>bb.y1-bb.h*(v-l2)/(h2-l2);
  /* where the wheel stands now */
  const thd=wrap2pi(ST.th)*R2D;
  ctx.setLineDash([3,4]); ctx.strokeStyle=rgba(COL.live,0.5); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(Xd(thd),b.y); ctx.lineTo(Xd(thd),b.y1); ctx.stroke(); ctx.setLineDash([]);
  dot(ctx,Xd(thd),Yv(F.rd.Phi*1e6,b,lo-pd,hi+pd),Math.max(2.5,3.5),COL.live);
  legendAuto(ctx,b,[[COL.north,'Φ(θ), the area integral'],[COL.ref,'a₁cos θ, the first harmonic alone'],[COL.live,'where the wheel stands']]);
  /* --- the EMF --- */
  /* the same law at whichever omega is being shown: EMF = -N omega dPhi/dtheta */
  const mv=F.th.map(t=>emfOf(F.rd.ser,t,F.g.N,F.rd.S,S.om)*1e3);
  const oneMv=F.th.map(t=>F.g.N*F.rd.S*F.a1*S.om*Math.sin(t)*WB_PER_G_MM2*1e3);
  let l2=0, h2=0; for(const v of mv.concat(oneMv)){ l2=Math.min(l2,v); h2=Math.max(h2,v); }
  if(!(h2>l2)){ h2=1e-3; l2=-1e-3; }
  const pd2=0.12*(h2-l2);
  axesQ(ctx,b2,0,360,l2-pd2,h2+pd2,{xlab:'magnet angle θ, degrees',ylab:'EMF, mV',
    title:S.live?'the EMF, −N ω dΦ/dθ, at '+fmt(F.rd.rpm,1)+' RPM':'the EMF at full flow: '+fmt(RPM_MAX*(1-F.rd.drag),1)+' RPM',nx:8,ny:6});
  polyline(ctx,b2,deg,oneMv,0,360,l2-pd2,h2+pd2,COL.ref,1.3,[6,4]);
  polyline(ctx,b2,deg,mv,0,360,l2-pd2,h2+pd2,S.live?COL.north:COL.dim,2,S.live?null:[7,5]);
  /* the peak, and 90 degrees, which is NOT where it is */
  const pkd=F.pk.th*R2D;
  for(const [d,col,txt] of [[pkd,COL.struct,'peak at '+fmt(pkd,1)+'°'],[90,'#5c6478','90°']]){
    ctx.setLineDash([3,4]); ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(Xd(d)-b.x+b2.x,b2.y); ctx.lineTo(Xd(d)-b.x+b2.x,b2.y1); ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,W,H,Xd(d)-b.x+b2.x+4,b2.y+11,txt,col,SM_FONT,'left','middle');
  }
  legendAuto(ctx,b2,[[S.live?COL.north:COL.dim,S.live?'EMF = −N ω dΦ/dθ':'EMF at full flow (the wheel is still)'],[COL.ref,'the first harmonic alone']]);
  if(F.rd.S===0){
    lab(ctx,W,H,b.x+b.w/2,b.y+b.h/2-20,'strength 0: no field, so no flux through the coil',COL.dim,LAB_FONT,'center','middle');
    lab(ctx,W,H,b2.x+b2.w/2,b2.y+b2.h/2-14,'and nothing for its change to induce',COL.dim,LAB_FONT,'center','middle');
  }
  drawCaption(ctx,L);
}

/* ---------------- the coil's face ---------------- */
const FACE_CAP=['Top: the two ways of adding the field over the coil’s face, strip by strip up its vertical diameter — the AREA under each curve is that estimate of the flux through one loop. Green is the true strip, B_x integrated along the chord, off the page as well as in it. Cyan is PhET’s: the in-page value B_x(y, 0) carried across the whole chord (the dots are its own samples, every 5 mm). Cyan runs above green because the field is weaker off the page than in it, so the flux comes out high. Below: the ratio of the two estimates across the area slider — worse for a bigger coil, which reaches further from the magnet.',
  'The two flux integrands strip by strip up the coil’s diameter — the area under each is that estimate of the flux. PhET’s (cyan) runs high; below, the ratio across the area slider.'];
function faceGeo(ctx,W,H){ return stageLayoutH(ctx,W,H,FACE_CAP[0],FACE_CAP[1],1,0.46,1); }
function drawFaceView(ctx,W,H,M){
  viewBack(ctx,W,H);
  const L=faceGeo(ctx,W,H), b=L.main, b2=L.bottom[0], C=M.fc, S=C.rd.S;
  const ex=C.ex.map(v=>v*S), ph=C.ph.map(v=>v*S);
  let lo=0, hi=0; for(const v of ex.concat(ph)){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
  if(!(hi>lo)){ hi=1; lo=-1; }
  const pd=0.12*(hi-lo);
  axesQ(ctx,b,-C.rc,C.rc,lo-pd,hi+pd,{ylab:'flux per mm of height, G·mm',
    title:'adding the field over the coil’s face (mm up its diameter), magnet at '+fmt(wrap2pi(ST.th)*R2D,0)+'°',nx:8,ny:6});
  polyline(ctx,b,C.s,ph,-C.rc,C.rc,lo-pd,hi+pd,COL.struct,1.5);
  polyline(ctx,b,C.s,ex,-C.rc,C.rc,lo-pd,hi+pd,COL.north,2);
  const X=x=>b.x+b.w*(x+C.rc)/(2*C.rc), Y=v=>b.y1-b.h*(v-(lo-pd))/((hi+pd)-(lo-pd));
  if(ST.phetCmp) for(const p of C.sp) dot(ctx,X(p.s),Y(p.p*S),Math.max(1.8,2.6),COL.struct,'#070b18',0.8);
  legendAuto(ctx,b,[[COL.north,'exact: B'+String.fromCharCode(8339)+' integrated along the chord'],[COL.struct,'PhET: the in-page value across the chord']]);
  /* the ratio across the slider */
  const pct=C.ratios.map(r=>100*(r-1));
  let l2=0, h2=0; for(const v of pct){ l2=Math.min(l2,v); h2=Math.max(h2,v); }
  const pd2=Math.max(1,0.15*(h2-l2));
  axesQ(ctx,b2,PICK_AMIN_PCT,100,l2-pd2,h2+pd2,{xlab:'loop area, % of PhET’s maximum',ylab:'line sample − 1, %',
    title:'PhET’s line sample, against the area integral',nx:6,ny:5});
  const X2=p=>b2.x+b2.w*(p-PICK_AMIN_PCT)/(100-PICK_AMIN_PCT), Y2=v=>b2.y1-b2.h*(v-(l2-pd2))/((h2+pd2)-(l2-pd2));
  ctx.beginPath(); ctx.moveTo(b2.x,Y2(0)); ctx.lineTo(b2.x1,Y2(0)); ctx.strokeStyle=COL.ref; ctx.lineWidth=1.2; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);
  polyline(ctx,b2,C.pcts,pct,PICK_AMIN_PCT,100,l2-pd2,h2+pd2,COL.north,2);
  /* the marker carries no text: chasing it with a label walks it into the y-tick gutter
     (Known-bad -- a label that moves with the data must be placed, not attached).  The
     readout prints the number. */
  dot(ctx,X2(ST.area),Y2(100*(C.ratio-1)),Math.max(2.5,3.5),COL.live);
  legendAuto(ctx,b2,[[COL.north,'PhET’s estimate / the area integral − 1'],[COL.ref,'no error']]);
  if(S===0) lab(ctx,W,H,b.x+b.w/2,b.y+b.h/2-20,'strength 0: no field over the coil’s face',COL.dim,LAB_FONT,'center','middle');
  drawCaption(ctx,L);
}

/* ================================================================== *
 *  the scene, the dispatch, boot                                      *
 * ================================================================== */
function drawView(ctx,W,H,M){
  if(M.view==='gen') return drawGenScreen(ctx,W,H,M);
  if(M.view==='flux') return drawFluxView(ctx,W,H,M);
  if(M.view==='face') return drawFaceView(ctx,W,H,M);
  if(M.view==='lines') return drawLinesView(ctx,W,H,M);
  if(M.view==='axis') return drawAxisView(ctx,W,H,M);
  return drawNeedleView(ctx,W,H,M);
}
function makeScene(canvas){
  const S={canvas,W:1400,H:820,st:ST};
  S.ctx=()=>canvas&&canvas.getContext?canvas.getContext('2d'):null;
  S.model=()=>buildModel();
  S.draw=()=>{ drawView(canvas.getContext('2d'),S.W,S.H,buildModel()); };
  S.step=dt=>stepLive(dt);
  S.pointer=(type,x,y)=>screenPointer(type,x,y,S.W,S.H,S.ctx());
  return S;
}
/* the magnet is bolted to the wheel, so flipping its polarity is half a turn of the wheel */
function flipMagnet(st){
  st.th=wrap2pi(st.th+Math.PI);
  if(LIVE.genRot){ LIVE.genRot.om+=FLIP_KICK; LIVE.genRot.rest=false; }
}

function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;
  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k; DRAG.what=null;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2)); });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg,tr,itr){
    const toS=tr||(v=>v), toP=itr||(v=>v);
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:toP(st[key])});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=toP(st[key]); val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=toS(parseFloat(inp.value)); val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; },inp};
    return el;
  }
  const chipRows=[];
  function chipRow(list,key){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
      st[key]=o.id; syncPanel(); dirty=true; refresh(); }},o.name)); });
    chipRows.push({el:wrapEl,list,key}); return wrapEl;
  }
  const btn=(txt,fn)=>h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},txt);

  const gWater=h('div',{class:'grp'},h('h3',null,'the water'));
  gWater.appendChild(slider('flow','faucet',0,100,5,v=>fmt(v,0)+' %'));
  const waterTag=h('div',{class:'tag'}); gWater.appendChild(waterTag);

  const gBar=h('div',{class:'grp'},h('h3',null,'the bar magnet'));
  gBar.appendChild(slider('pct','strength',0,100,5,v=>fmt(v,0)+' %'));
  gBar.appendChild(h('div',{class:'btnrow'},btn('flip polarity',()=>flipMagnet(st))));
  gBar.appendChild(h('div',{class:'checks'},checkbox('genField','magnetic field (B)'),checkbox('seeInside','see inside')));

  const gCoil=h('div',{class:'grp'},h('h3',null,'the pickup coil'));
  gCoil.appendChild(slider('N','loops',1,PICK_NMAX,1,v=>fmt(v,0)));
  gCoil.appendChild(slider('area','loop area',PICK_AMIN_PCT,100,5,v=>fmt(v,0)+' %'));
  gCoil.appendChild(chipRow([{id:'bulb',name:'light bulb'},{id:'volt',name:'voltmeter'}],'indicator'));
  gCoil.appendChild(h('div',{class:'checks'},checkbox('electrons','electrons')));
  const coilTag=h('div',{class:'tag'}); gCoil.appendChild(coilTag);

  const gTools=h('div',{class:'grp'},h('h3',null,'tools'));
  gTools.appendChild(h('div',{class:'checks'},checkbox('genCompass','compass',()=>{ LIVE.genRot=null; }),checkbox('genMeter','field meter')));
  const toolTag=h('div',{class:'tag'}); gTools.appendChild(toolTag);

  const gShow=h('div',{class:'grp'},h('h3',null,'what to show'));
  gShow.appendChild(h('div',{class:'checks'},checkbox('bound','bound current on the magnet'),checkbox('axisH','μ₀H inside the magnet'),
    checkbox('phetCmp','PhET’s sample points')));
  const showTag=h('div',{class:'tag'}); gShow.appendChild(showTag);

  const gNd=h('div',{class:'grp'},h('h3',null,'the needle'));
  gNd.appendChild(slider('ndB','|B|',Math.log10(0.05),Math.log10(S_MAX),0.01,v=>sigf(v,3)+' G',null,p=>+Math.pow(10,p).toPrecision(3),v=>Math.log10(v)));
  gNd.appendChild(slider('ndRel','released at',1,179,1,v=>fmt(v,0)+'°'));
  gNd.appendChild(slider('ndDamp','damping γ',0,10,0.1,v=>fmt(v,1)+' /s'));
  const ndTag=h('div',{class:'tag'}); gNd.appendChild(ndTag);

  const gPref=h('div',{class:'grp'},h('h3',null,'units'));
  gPref.appendChild(chipRow([{id:'G',name:'G (gauss)'},{id:'T',name:'T (tesla)'}],'units'));
  gPref.appendChild(h('h3',null,'current flow'));

    try{
      const M=S.model();

      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });

    if(!DRAG.what) return;

  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;

    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let last=null;
  function frameLoop(ts){
    const dt=(last===null)?0:Math.min(0.05,Math.max(0,(ts-last)/1000)); last=ts;
    if(st.run&&dt>0&&S.step(dt)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  gen:'This is PhET&rsquo;s Generator screen. Water from the faucet turns a wheel, the wheel carries a bar magnet round with it, and a coil of wire sits beside it. Nothing about the magnet itself makes a current: it is the CHANGE in the flux through the coil that drives one, which is Faraday&rsquo;s law, &#8496; = &minus;N d&Phi;/dt. Close the faucet and the bulb goes out at once, however strong the magnet is and however close it stands. The flux here is the real area integral of the field over the coil&rsquo;s disc, worked out for every angle of the magnet, and the EMF is its derivative times the wheel&rsquo;s angular speed: twice the loops or twice the speed gives twice the EMF. More loops and a bigger coil also drag on the wheel and slow it, as they do in PhET (and, for a different reason, in a real generator: the current you draw is paid for by the thing turning the shaft). The bulb&rsquo;s brightness and the voltmeter&rsquo;s needle are both the EMF against PhET&rsquo;s full scale.',
  flux:'The flux through the coil as the magnet turns is not a sine wave. A point dipole far away would give one &mdash; the single cosine drawn in orange &mdash; but this magnet is close enough that the coil sees its ends, so the flux is flatter on top and steeper in between, and the odd harmonics of the series carry the difference. (Only odd ones appear: half a turn reverses the magnet, so &Phi;(&theta; + &pi;) = &minus;&Phi;(&theta;), and the flux is even in &theta; because the magnet is symmetric about its axis, which kills every sine term too.) The EMF below is exactly &minus;N&omega; d&Phi;/d&theta;, so it vanishes where the flux is flat &mdash; with the magnet in line with the coil&rsquo;s axis, and again across it &mdash; and peaks where the flux falls fastest. For a cosine that would be at 90&deg;; here it is well before that, and the marked peak angle moves as the coil is made bigger.',
  face:'The flux through one loop is an integral over its whole disc, and the disc stands perpendicular to the page: most of it is off the page, where the field is weaker than it is in the plane. Green shows the average of B<sub>x</sub> round the ring at each radius, which is what the area integral weights; cyan shows B<sub>x</sub> along the coil&rsquo;s vertical diameter in the page, which is the line PhET samples (its dots, every 5 mm, each weighted by the chord it stands on). The two agree at the centre and part company towards the rim, so PhET&rsquo;s estimate of the flux comes out high &mdash; by about a tenth for the smallest coil and half again for the largest, plotted below. Nothing here is a criticism of the sim: PhET&rsquo;s EMF is deliberately a relative number against its own full scale, and a fast line sample is the sensible choice for it. This page does the integral instead, so the volts it prints are volts.',
  lines:'Field lines follow the field. Because the magnet is symmetric about its axis and the page contains that axis, every line drawn here is an exact field line, traced by small steps along B. They are spaced so that the same flux runs between each neighbouring pair when the lines are spun round the axis into tubes, which is why they crowd where the field is strong. Every B line is a closed loop: it leaves the north face, curls round, returns into the south face and runs back through the magnet to where it started, because magnetic field lines never begin or end. The dots and crosses on the magnet&rsquo;s long sides mark the bound current that circulates round its surface: a solenoid carrying the same current per unit length makes exactly the same field, inside and out. This is the magnet the wheel carries, drawn upright in its own frame.',
  axis:'Along the axis the field is elementary: it is half of &mu;<sub>0</sub>M times the difference between two cosines, one for each pole face. It is strongest at the centre, 0.981 of &mu;<sub>0</sub>M for this long thin bar, and exactly half as strong at each face, and it passes through the faces without a break. The other field, H, does not: inside the magnet &mu;<sub>0</sub>H is B minus &mu;<sub>0</sub>M, so it jumps by &mu;<sub>0</sub>M at each face and points backwards inside, from the north pole to the south pole. Far from the magnet both fall away as the point dipole, drawn in orange &mdash; and it is that same falling-off, sampled over the coil&rsquo;s face, that decides how much flux the coil catches.',
  needle:'A compass needle is a small magnet on a pivot, and in a field it behaves like a pendulum: the torque pulling it back is proportional to the sine of its angle from the field, so it swings, and friction makes the swings die away. This view releases the needle at an angle and integrates its motion, using PhET&rsquo;s constants for the needle&rsquo;s response to the field and its damping. For small swings the solution is the damped oscillator, drawn in orange; at large angles the needle lingers near the top of its swing and the period grows, exactly as for a pendulum, by the factor given by the complete elliptic integral. The period of small swings is 2&pi;/&radic;(&kappa;|B|), so it halves when the field is four times stronger: timing a swinging magnet is how Gauss first measured the strength of the Earth&rsquo;s field in 1832. On the generator screen the same rotor rides the turning field, and lags it.'
};

    rel(k[0]==='K'?ellK(r[0]):ellE(r[0]),r[1],5e-15,k[0]+' at kc = '+r[0]+' (scipy '+(k[0]==='K'?'ellipkm1':'ellipe')+')'); }
  ok(isNaN(cel(0,1,1,1)),'cel refuses kc = 0 (the logarithmic singularity) rather than inventing a value');
  /* Gauss-Legendre: exact to degree 2n-1, and not beyond (so the rule is really the n-point one) */
  for(const n of [16,24]){ const G=gaussLegendre(n), r=REF['gl.err.'+n]; let s=0, s2=0;
    for(let i=0;i<n;i++){ s+=G.w[i]*Math.pow(G.x[i],2*n-2); s2+=G.w[i]*Math.pow(G.x[i],2*n); }
    rel(s,2/(2*n-1),1e-13,n+'-point Gauss-Legendre integrates x^'+(2*n-2)+' exactly');
    if(n===16) rel(s2-2/(2*n+1),r[2],1e-6,'and misses x^'+(2*n)+' by exactly minus the Gauss remainder, '+r[1].toExponential(3)+' (python)');
    else ok(Math.abs(s2-2/(2*n+1))<1e-12,'at n = 24 that remainder ('+r[1].toExponential(2)+') is already down at the rounding level, so nothing is pinned by it'); }

  /* the magnet: the Derby-Olbert closed form against Biot-Savart over the sheet */
  for(let i=0;;i++){ const r=REF['mag.pt.'+i]; if(!r) break; const b=solB(r[0],r[1],MAG_R,MAG_B), n=Math.hypot(r[2],r[3]);
    ok(Math.hypot(b[0]-r[2],b[1]-r[3])<=1e-12*n,'magnet field at (rho, u) = ('+r[0]+', '+r[1]+') equals dblquad over the current sheet (scipy) ['+(Math.hypot(b[0]-r[2],b[1]-r[3])/n).toExponential(1)+']'); }
  for(const k in REF) if(k.indexOf('mag.axis.')===0){ const r=REF[k];
    close(solAxis(r[0],MAG_R,MAG_B),r[1],2e-16,'the on-axis closed form at u = '+r[0]+' (python)');
    close(solB(0,r[0],MAG_R,MAG_B)[1],solAxis(r[0],MAG_R,MAG_B),3e-16,'the general form reduces to it on the axis at u = '+r[0]);
    close(solB(0,r[0],MAG_R,MAG_B)[0],0,0,'and B_rho vanishes on the axis at u = '+r[0]); }
  { const m=REF['mag.geom'];
    close(MAG_L,m[0],0,'the bar is PhET\'s 250 mm long (python)'); close(MAG_R,m[1],0,'and 50 mm across, radius 25');
    close(S_MAX,m[2],0,'with PhET\'s 0-300 G range'); close(MAG_B,MAG_L/2,0,'the half-length is half of it'); }
  close(MU0,REF['MU0'],0,'mu0 = 1.25663706127e-6 N/A^2 (CODATA 2022, NIST)');
  rel(MU0/(4*Math.PI*1e-7),1,1e-9,'which is 4 pi x 1e-7 to nine digits, no longer exactly');
  rel(solB(0,0,MAG_R,MAG_B)[1],REF['mag.centre'],1e-15,'the centre field is cos(alpha) = b/sqrt(b^2 + R^2) of mu0 M (python)');
  rel(solB(0,0,MAG_R,MAG_B)[1],MAG_B/Math.hypot(MAG_B,MAG_R),1e-15,'which is 125/sqrt(125^2 + 25^2) = 0.98058');
  close(solB(0,MAG_B,MAG_R,MAG_B)[1],0.5*(2*MAG_B/Math.hypot(2*MAG_B,MAG_R)),1e-15,'at a pole face the field is half the face-to-face cosine');
  for(const u of [0,80,-110]){ const i=solB(MAG_R*(1-1e-9),u,MAG_R,MAG_B), o=solB(MAG_R*(1+1e-9),u,MAG_R,MAG_B);
    close(i[1]-o[1],1,2e-6,'across the side wall at u = '+u+' B_u jumps by exactly mu0 M (the bound current)');
    close(i[0]-o[0],0,2e-6,'and B_rho is continuous there'); }
  { const on=solB(MAG_R,MAG_B,MAG_R,MAG_B); ok(isFinite(on[0])&&isFinite(on[1])&&Math.hypot(on[0],on[1])>1,'at the rim itself the field is large but finite (nudged off the log singularity)'); }
  for(const [r0,u0] of [[10,40],[60,-90],[30,200]]){ const a=solB(r0,u0,MAG_R,MAG_B), b=solB(r0,-u0,MAG_R,MAG_B);
    close(a[1],b[1],1e-15,'B_u is even in u at ('+r0+', '+u0+')'); close(a[0],-b[0],1e-15,'B_rho is odd in u there'); }
  /* the world frame: rotating the magnet rotates its field; flipping it reverses the field everywhere */
  { const m0={kind:'magnet',x:430,y:333,ang:0,S:225}, th=0.7, m1={kind:'magnet',x:430,y:333,ang:th,S:225};
    for(const [dx,dy] of [[150,40],[-60,90],[20,-200]]){
      const b0=magnetField(m0,430+dx,333+dy,0), px=430+dx*Math.cos(th)-dy*Math.sin(th), py=333+dx*Math.sin(th)+dy*Math.cos(th), b1=magnetField(m1,px,py,0);
      const rx=b0[0]*Math.cos(th)-b0[1]*Math.sin(th), ry=b0[0]*Math.sin(th)+b0[1]*Math.cos(th);
