    const bz=magnetField(m0,500,333,40); ok(Math.abs(bz[2])>0&&Math.abs(magnetField(m0,500,333,0)[2])===0,'off the page the field has a z part; in the page it has none (the page contains the axis)'); }
  for(const tag of ['a','b','flip','inside','nearrim']){ const r=REF['meter.bar.'+tag], src={kind:'magnet',x:430,y:333,ang:r[2],S:225};
    const rd=meterReading(src,r[0],r[1]), B=magnetField(src,r[0],r[1],0), n=Math.hypot(r[3],r[4]);
    ok(rd.Bx===B[0]&&rd.By===B[1]&&rd.B===Math.hypot(B[0],B[1]),'the field meter reads the model itself at its crosshair, bit for bit ('+tag+')');
    ok(Math.hypot(rd.Bx-r[3],rd.By-r[4])<=1e-12*n,'and its B_x, B_y equal derive.py\'s world-frame field at ('+r[0]+', '+r[1]+') (python) ['+(Math.hypot(rd.Bx-r[3],rd.By-r[4])/n).toExponential(1)+']');
    close(rd.ang,Math.atan2(r[4],r[3])*180/Math.PI,1e-12,'and its angle, '+fmt(rd.ang,4)+' degrees'); }
  { const a=REF['meter.bar.a'], f=REF['meter.bar.flip']; close(a[3]+f[3],0,1e-12,'flipped, the reading at (560, 380) is reversed in x (python)'); close(a[4]+f[4],0,1e-12,'and in y'); }
  /* PhET's grid: a sampling of this same field (read from the 1.0.7 build by derive.py) */
  for(const k in REF) if(k.indexOf('phet.sample.')===0){ const r=REF[k], b=solB(r[1],r[0],MAG_R,MAG_B), mine=r[3]===0?b[1]:b[0];
    const tol=k.indexOf('EXTERNAL_NEAR')>0?2.5e-4:(k.indexOf('INTERNAL.10')>0?5e-5:5e-7);
    close(mine,r[2],tol,'PhET\'s grid value '+r[2]+' at ('+r[0]+', '+r[1]+') is this field to '+tol.toExponential(0)+' of mu0 M'); }
  /* the meter's display: PhET's rules (G to 2 decimals, '~ 0 G' below 0.01 G, T in scientific notation) */
  ok(fmtField(17.3975,'G')==='17.40 G','17.3975 G reads "17.40 G"');
  ok(fmtField(0.004,'G')==='~ 0 G'&&fmtField(-0.004,'G')==='~ 0 G','below 0.01 G the meter reads "~ 0 G" (PhET)');
  ok(fmtField(0.05,'G')==='0.05 G'&&fmtField(0.011,'G')==='0.01 G','and just above that threshold it prints the number: 0.05 G, 0.01 G');
  ok(fmtField(0,'G')==='0 G'&&fmtField(0,'T')==='0 T','exactly zero reads 0');
  ok(fmtField(225,'T')==='2.25 × 10^-2 T','225 G reads 2.25 × 10^-2 T');
  ok(fmtField(-0.5,'T')==='-5.00 × 10^-5 T','and signs survive the conversion');
  ok(fmtAngle(83.87771)==='83.88°'&&fmtAngle(NaN)==='—','the angle to two decimals, and a dash where there is no field');
  /* the needle grid: PhET's spacing and brightness rule */
  close(needleAlpha(S_MAX/64),Math.min(1,2*Math.exp(Math.log(1/64)/2.7)),1e-15,'needle brightness 2(|B|/300 G)^(1/2.7) at 300/64 G');
  ok(needleAlpha(300)===1&&needleAlpha(0)===0,'saturating at 1 (it reaches 1 at 300/2^2.7 = '+sigf(300/Math.pow(2,2.7),3)+' G) and 0 without field');
  { const src={kind:'magnet',x:430,y:333,ang:0,S:225}, g=needleGrid(src,0,0,LAYOUT_W,LAYOUT_H);
    ok(g.length===26*15,'one needle every 40 mm over the 1024 x 618 box: 26 x 15 = 390 ('+g.length+')');
    let worst=0; for(const n of g){ const B=magnetField(src,n.x,n.y,0); worst=Math.max(worst,Math.abs(wrapPi(n.ang-Math.atan2(B[1],B[0])))); }
    ok(worst<1e-12,'every needle points along B at its own point'); }
}

/* ---- the DRAWN needles, not just the model ----
   A sign slip in the drawing code would leave every number right and every needle backwards,
   and no assertion on the model could see it (Known-bad: assert on the objects the view
   draws).  These capture the emitted geometry and measure where the north half points. */
function makeGeomME(){
  const ops=[]; let path=[], cur=null; const st={fill:'#000'};
  const c={ops, save(){},restore(){},setTransform(){},translate(){},rotate(){},scale(){},setLineDash(){},
    beginPath(){ path=[]; cur=null; }, moveTo(x,y){ cur=[[x,y]]; path.push(cur); },
    lineTo(x,y){ if(!cur){ cur=[[x,y]]; path.push(cur); } else cur.push([x,y]); },
    closePath(){}, rect(){},
    arc(x,y,r,a0,a1){ const pts=[]; for(let i=0;i<=24;i++){ const t=a0+(a1-a0)*i/24; pts.push([x+r*Math.cos(t),y+r*Math.sin(t)]); } cur=pts; path.push(pts); },
    fill(){ if(path.length) ops.push({fill:st.fill,path:JSON.parse(JSON.stringify(path))}); },
    stroke(){ if(path.length) ops.push({stroke:st.strokeStyle,path:JSON.parse(JSON.stringify(path))}); },
    clip(){}, fillRect(){}, strokeRect(){}, clearRect(){}, fillText(){}, strokeText(){},
    measureText(t){ return {width:(''+t).length*5}; }, createLinearGradient(){ return {addColorStop(){}}; }};
  Object.defineProperty(c,'fillStyle',{get:()=>st.fill,set:v=>st.fill=''+v});
  Object.defineProperty(c,'strokeStyle',{get:()=>st.strokeStyle,set:v=>st.strokeStyle=''+v});
  for(const k of ['lineWidth','globalAlpha','font','textAlign','textBaseline','lineJoin','lineCap']){
    let v; Object.defineProperty(c,k,{get:()=>v,set:x=>v=x}); }
  return c;
}
function testDrawnNeedles(T){
  const {ok,close}=T;
  const src={kind:'magnet',x:430,y:333,ang:0,S:225}, map={s:1,X:x=>x,Y:y=>-y};
  const tipAngle=(c,cx,cy)=>{
    const tri=c.ops.filter(o=>o.fill===COL.north)[0];
    let far=null, d=-1;
    for(const p of tri.path[0]){ const dd=Math.hypot(p[0]-cx,p[1]+cy); if(dd>d){ d=dd; far=p; } }
    return Math.atan2(-(far[1]+cy),far[0]-cx);
  };
  for(const [px,py] of [[625,218],[300,420],[700,333],[430,150]]){
    const B=magnetField(src,px,py,0), th=Math.atan2(B[1],B[0]);
    const c=makeGeomME(); drawCompass(c,map,px,py,th);
    close(wrapPi(tipAngle(c,px,py)-th),0,1e-9,'the drawn compass needle at ('+px+', '+py+') has its north half along B');
  }
  const g=needleGrid(src,0,0,LAYOUT_W,LAYOUT_H);
  let worst=0;
  for(const n of g){ if(n.alpha<0.02) continue; const c=makeGeomME(); drawNeedleField(c,map,[n]);
    worst=Math.max(worst,Math.abs(wrapPi(tipAngle(c,n.x,n.y)-n.ang))); }
  ok(worst<1e-9,'and all '+g.length+' drawn field needles point along B where they stand ['+worst.toExponential(1)+']');
  /* the field itself, once, against the compass rose: N of the magnet the field runs back
     from north to south, so a needle above the bar points the OTHER way to the bar's own north */
  const above=magnetField(src,430,420,0);
  ok(above[0]<0&&Math.abs(above[1])<1e-9,'above the middle of the bar the field points from its north end back to its south');
  const beyond=magnetField(src,700,333,0);
  ok(beyond[0]>0&&Math.abs(beyond[1])<1e-9,'and beyond the north end it points away from the magnet');
}

/* The axis view draws two dashed verticals and calls them the pole faces.  Nothing pinned
   them until a mutant moved them to half their distance and survived, so the check is on the
   DRAWN lines: the vertical strokes that span the plot box must stand exactly where x = +-b
   maps to (Known-bad: if a mutant can only be caught by looking at the picture, the quantity
   is in the wrong layer -- so this measures the picture). */
const MARK_COL='#39415a';
function testAxisMarks(T){
  const {ok,close}=T;
  const W=1400, H=820, c=makeGeomME();
  const M=buildModel();
  drawAxisView(c,W,H,M);
  const L=axisGeo(c,W,H,M), b=L.main, xr=ANA_SRC[M.as.kind].axisRange;
  const X=x=>b.x+b.w*(x+xr)/(2*xr);
  const verts=[];
  for(const o of c.ops){
    if(o.stroke!==MARK_COL) continue;                                      /* the marks' own colour, not the grid's */
    for(const sp of o.path){
      if(sp.length!==2) continue;
      if(Math.abs(sp[0][0]-sp[1][0])>0.01) continue;                       /* vertical */
      if(Math.abs(Math.abs(sp[0][1]-sp[1][1])-b.h)>1.5) continue;          /* full height */
      verts.push(sp[0][0]);
    }
  }
  const want=ANA_SRC[M.as.kind].axisMarks(M.as).map(X);
  ok(verts.length===want.length,'the axis view draws one full-height mark per feature it names ('+verts.length+' of '+want.length+')');
  let worst=0;
  for(const w of want){ let d=1e9; for(const v of verts) d=Math.min(d,Math.abs(v-w)); worst=Math.max(worst,d); }
  ok(worst<0.5,'and each stands where its own x maps to, to half a pixel ['+fmt(worst,3)+']');
  if(M.as.kind==='magnet'){
    /* mu0 H equals B outside and B - mu0 M inside, so it jumps at each face.  It is drawn in
       three pieces for exactly that reason: no segment of it may straddle a face, or the
       picture would draw a line down the discontinuity and call it a field. */
    const xd=px=>(px-b.x)/b.w*2*xr-xr;
    let straddle=0, hseg=0;
    for(const o of c.ops){ if(o.stroke!==COL.struct) continue;
      for(const sp of o.path) for(let i2=1;i2<sp.length;i2++){ hseg++;
        const a2=xd(sp[i2-1][0]), b2=xd(sp[i2][0]);
        for(const face of [-MAG_B,MAG_B]) if((a2-face)*(b2-face)<0) straddle++; } }
    ok(hseg>50&&straddle===0,'no piece of the mu0 H curve crosses a pole face ('+hseg+' segments, '+straddle+' straddling)');
    close(want.length,2,0,'for the magnet that is two marks: the pole faces');
    close(Math.abs(ANA_SRC.magnet.axisMarks(M.as)[0]),MAG_B,0,'at x = -125 mm');
    close(ANA_SRC.magnet.axisMarks(M.as)[1],MAG_B,0,'and +125 mm, the faces themselves');
  }
}

/* ---- the captions say what is drawn, and only that ----
   Known-bad (the far view, and again the lines view): a caption that describes what a
   checkbox has switched off.  These draw the view through the page's own shot context and
   read the text that reaches the canvas. */
function testCaptions(T,withState){
  const {ok}=T;
  /* each page names its own shot context (makeShotME / makeShotMC); take whichever is here */
  const shot=(typeof makeShotMC!=='undefined')?makeShotMC:makeShotME;
  const drawn=()=>{ const c=shot(1400,820); drawView(c,1400,820,buildModel());
    return c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' '); };
  withState({view:'lines',bound:true},()=>ok(/bound current/.test(drawn()),'with the bound current drawn, the lines caption names it'));
  withState({view:'lines',bound:false},()=>ok(!/bound current/.test(drawn()),'and with it switched off, the caption does not'));
  withState({view:'axis',axisH:true},()=>ok(/\u03bc\u2080H/.test(drawn()),'with mu0 H drawn, the axis caption explains it'));
  withState({view:'axis',axisH:false},()=>{ const t=drawn();
    ok(!/\u03bc\u2080H/.test(t),'and with it switched off, the caption is about B alone');
    ok(/dipole/.test(t),'while still saying what the orange curve is'); });
}

/* field lines: the seeds carry equal flux, the lines close, and each comes back to the
   mid-plane where the flux says it must (brentq on Psi, derive.py) */
function testLines(T,kinds){
  const {ok,close,rel}=T;
  if(kinds.indexOf('magnet')>=0){
    const F=fieldLinesFor('magnet',0), ls=lineSource('magnet',0);
    rel(F.psiMax,REF['lines.mag.psimax'],1e-12,'the flux through the magnet\'s middle, 2 pi x 306.5965 G mm^2 per G (scipy quad)');
    rel(psiMid(ls,MAG_R),F.psiMax,0,'which is Psi at the wall');
    ok(F.lines.length===MAG_LINES,MAG_LINES+' lines a side');
    let wr=0, wc=0, nOk=0, wseed=0, wflux=0;
    F.lines.forEach((l,i)=>{ const r=REF['lines.mag.'+(i+1)];
      wseed=Math.max(wseed,Math.abs(l.r0/r[1]-1)); wr=Math.max(wr,Math.abs(l.rOut/r[2]-1));
      wflux=Math.max(wflux,Math.abs(psiMid(ls,l.r0)/((i+1)*F.psiMax/(MAG_LINES+1))-1));
      if(l.ok){ nOk++; wc=Math.max(wc,l.close); } });
    ok(nOk===MAG_LINES,'every one of them closes on itself ('+nOk+'/'+MAG_LINES+')');
    ok(wc<2e-5,'the worst closure is '+wc.toExponential(2)+' mm, after a loop metres long');
    ok(wseed<1e-10,'the seeds sit where the flux says (scipy brentq) ['+wseed.toExponential(1)+']');
    ok(wflux<1e-12,'and they carry equal flux, Psi_i = i Psi_max/(n+1) ['+wflux.toExponential(1)+']');
    ok(wr<2e-4,'each line crosses the mid-plane outside within '+wr.toExponential(1)+' of brentq on Psi (scipy)');
    const walls=F.lines.map(l=>l.walls);
    ok(walls.slice(0,5).every(w=>w===0)&&walls.slice(5).every(w=>w===2),
       'the inner five leave through the pole faces, the outer five through the side wall, twice each ('+walls.join(',')+')');
    /* the wall crossing is load-bearing: without it the outer lines miss by a hundredfold */
    { const naive={kind:'magnet',ru:ls.ru,wall:null,sing:ls.sing,aIn:ls.aIn,aOut:ls.aOut};
      const l9=traceLine(naive,F.lines[8].r0);
      ok(!l9.ok||l9.close>50*Math.max(wc,1e-9),'and treating the wall as smooth spoils that line ('+(l9.ok?l9.close.toExponential(2)+' mm':'it never closes')+')'); }
  }

}

/* the compass: the damped rotor, its closed forms and its energy ledger */
function testRotor(T){
  const {ok,close,rel}=T;
  close(KAPPA,REF['KAPPA'],0,'kappa = 6.25 /(G s^2): PhET\'s 0.01 /G per frame^2 at 25 frames a second');
  close(GAMMA_C,REF['GAMMA'],0,'gamma = 2 /s: PhET\'s 0.08 per frame');
  close(GAMMA_C*GAMMA_C/(4*KAPPA),REF['rotor.Bcrit'],1e-15,'so the needle is critically damped at 0.16 G and rings above it (python)');
  /* against solve_ivp (DOP853, rtol 1e-12): first with the page's own step rule, then refined */
  for(const tag of ['big','strong','over']){
    for(const t of [0.25,0.5,1,2,4]){
      const r=REF['rotor.'+tag+'.'+t], B=[r[0],0];
      const a={phi:r[1],om:0,W:0}; rotorAdvance(a,()=>B,0,t,KAPPA,r[2]);
      ok(Math.abs(a.phi-r[4])<2e-4,'the rotor at |B| = '+r[0]+' G, released at '+r[1]+' rad, at t = '+t+' s (scipy solve_ivp) ['+Math.abs(a.phi-r[4]).toExponential(1)+' rad]');
      const b={phi:r[1],om:0,W:0}, n=Math.ceil(t*400); for(let i=0;i<n;i++) rotorAdvance(b,()=>B,0,t/n,KAPPA,r[2]);
      ok(Math.abs(b.phi-r[4])<3e-7&&Math.abs(b.om-r[5])<3e-6,'and with finer steps it converges onto it ['+Math.abs(b.phi-r[4]).toExponential(1)+' rad]');
    }
  }
  /* the small-angle closed form, and the integrator agreeing with it where it holds */
  for(const k in REF) if(k.indexOf('rotor.lin.')===0){ const r=REF[k];
    rel(linearNeedle(r[1],Math.sqrt(KAPPA*r[0]),GAMMA_C,r[2]),r[3],1e-13,'the damped-oscillator solution at t = '+r[2]+' s (python)'); }
  { const B=[5,0], th0=1e-3, a={phi:th0,om:0,W:0}, n=1200, t=2;
    for(let i=0;i<n;i++) rotorAdvance(a,()=>B,0,t/n,KAPPA,GAMMA_C);
    const lin=linearNeedle(th0,Math.sqrt(KAPPA*5),GAMMA_C,t);
    ok(Math.abs(a.phi-lin)<1e-7*th0,'released at a milliradian the rotor IS the damped oscillator (off by '+(Math.abs(a.phi-lin)/th0).toExponential(1)+' of the release angle)'); }
  /* the large-amplitude undamped period: 4 K(sin(phi0/2))/omega0 */
  for(const k in REF) if(k.indexOf('rotor.period.')===0){
    const r=REF[k], B=[r[0],0], w0=Math.sqrt(KAPPA*r[0]);
    rel(4*ellK(Math.cos(r[1]/2))/w0,r[2],1e-13,'the pendulum period at '+r[1]+' rad is 4K(sin phi0/2)/omega0 = '+fmt(r[2],6)+' s (scipy ellipk)');
    rel(needleRun(r[0],r[1],0,1).Tbig,r[2],1e-13,'and the view reports that same period off its own model (scipy ellipk)');
    const a={phi:r[1],om:0,W:0}, h=r[2]/4000, zc=[];
    let prev=a.phi;
    for(let i=1;i<=8000&&zc.length<2;i++){ rotorAdvance(a,()=>B,0,h,KAPPA,0); if(prev>0&&a.phi<=0) zc.push((i-prev/(prev-a.phi))*h); prev=a.phi; }
    ok(zc.length===2&&Math.abs((zc[1]-zc[0])/r[2]-1)<1e-6,'and the undamped integration measures it back ['+(zc.length===2?fmt(zc[1]-zc[0],6)+' s':'no crossings')+']');
    rel(r[2]/(2*Math.PI/w0),4*ellK(Math.cos(r[1]/2))/(2*Math.PI),1e-13,'a swing of '+fmt(r[1]*180/Math.PI,0)+' degrees is '+fmt(r[2]/(2*Math.PI/w0),4)+' times slower than a small one');
  }
  /* the ledger: the needle's energy plus the work done against the damping is conserved,
     because both are integrated through the same RK4 stages */
  { const B=[5,0], a={phi:2.5,om:0,W:0}, E0=rotorEnergy(a,B); let worst=0, naive=0, naiveW=0;
    for(let i=0;i<600;i++){ const om0=a.om; rotorAdvance(a,()=>B,0,0.01,KAPPA,GAMMA_C);
      naiveW+=GAMMA_C*(om0*om0+a.om*a.om)/2*0.01;                    /* the ledger kept BESIDE the integrator */
      worst=Math.max(worst,Math.abs(rotorEnergy(a,B)+a.W-E0)/E0); naive=Math.max(naive,Math.abs(rotorEnergy(a,B)+naiveW-E0)/E0); }
    ok(worst<3e-7,'energy + work against the damping is conserved to '+worst.toExponential(1)+' over six seconds');
    ok(naive>100*worst,'a trapezoid ledger kept outside the integrator is '+fmt(naive/worst,0)+'x worse ('+naive.toExponential(1)+'): the work is integrated through the same RK4 stages');
    ok(a.W>0.9*E0,'and by the end the damping has taken essentially all of it ('+fmt(100*a.W/E0,1)+' %)');
    const b={phi:2.5,om:0,W:0}, E1=rotorEnergy(b,B); for(let i=0;i<600;i++) rotorAdvance(b,()=>B,0,0.01,KAPPA,0);
    ok(Math.abs(rotorEnergy(b,B)-E1)/E1<3e-7,'undamped, the energy alone is conserved'); }
  /* the period measured in the needle view, against the damped closed form */
  { const N=needleRun(5,5*Math.PI/180,GAMMA_C,8), w0=Math.sqrt(KAPPA*5), wd=Math.sqrt(w0*w0-GAMMA_C*GAMMA_C/4);
    rel(N.Tmeas,2*Math.PI/wd,2e-3,'the view\'s own measured period at 5 degrees is 2 pi/omega_d');
    rel(N.T0,2*Math.PI/w0,1e-15,'and it reports the small-swing period 2 pi/sqrt(kappa |B|)');
    ok(N.ledger<1e-6,'with its energy ledger clean ('+N.ledger.toExponential(1)+')'); }
  { const a=needleRun(80,Math.PI/3,GAMMA_C,4), b=needleRun(20,Math.PI/3,GAMMA_C,4);
    rel(a.T0/b.T0,0.5,1e-12,'four times the field halves the period: T0 goes as |B|^(-1/2) (Gauss\'s method)'); }
  { const N=needleRun(0.05,Math.PI/3,GAMMA_C,20); ok(!N.under&&!isFinite(N.wd),'below 0.16 G the needle is overdamped and does not ring');
    ok(N.ph.every(v=>v>=-1e-9),'it creeps back without crossing'); }
}

/* ================================================================== *
 *  the generator suite: the flux through the pickup coil, its Fourier *
 *  series, and the EMF that follows from it.  Reference values from   *
 *  REF (derive.py): scipy dblquad over the disc, numpy's FFT over 256 *
 *  angles, and a bounded maximiser for the peak.                      *
 * ================================================================== */
function testGen(T){
  const {ok,close,rel}=T;
  /* --- the geometry PhET fixes --- */
  { const g=REF['gen.geom'];
    close(TURB_X,g[0],0,'the turbine stands at PhET\'s x = 285 mm (python)'); close(TURB_Y,g[1],0,'y = 243 mm');
    close(PICK_X,g[2],0,'the pickup coil at x = 520 mm'); close(PICK_Y,g[3],0,'y = 243 mm');
    close(PICK_AMAX,g[4],0,'its largest loop is PhET\'s 70685 mm^2'); }
  close(E_FULL,REF['gen.efull'],0,'full scale is PhET\'s 1.2e5 G mm^2 per frame at 25 frames/s = 0.3 mV (python)');
  close(pickRadius(100),Math.sqrt(PICK_AMAX/Math.PI),1e-12,'the largest coil\'s radius is 150 mm ['+fmt(pickRadius(100),4)+']');
  close(PHET_SP,5,0,'PhET samples every magnet-height/10 = 5 mm');

  /* --- the flux: the 16 x 32 disc rule against scipy's dblquad --- */
  for(const pct of [20,50,100]){
    const rc=pickRadius(pct);
    let worst=0, n=0;
    for(let j=0;;j++){ const r=REF['gen.flux.'+pct+'.'+j]; if(!r) break; n++;
      close(rc,r[1],1e-12,pct+' % of the area is a radius of '+fmt(r[1],4)+' mm (python)');
      worst=Math.max(worst,Math.abs(flux1(r[2],rc)-r[3])); }
    ok(n>=6&&worst<1e-10,'the flux through a '+pct+' % coil equals scipy\'s dblquad at all '+n+' angles ['+worst.toExponential(1)+' G mm^2]');
    /* the rule is converged: doubling either direction does not move it */
    const a=flux1(0.9,rc), b=flux1(0.9,rc,32,64);
    rel(a,b,1e-12,'and doubling the 16 x 32 rule to 32 x 64 leaves it alone at '+pct+' %');
  }
  /* --- the Fourier series: only odd cosines survive --- */
  for(const pct of [20,50,100]){
    const ser=fluxSeries(pickRadius(pct)), h=REF['gen.harm.'+pct];
    [1,3,5,7,9,11].forEach((k,i)=>rel(ser.a[k],h[i],2e-9,'a_'+k+' of the '+pct+' % coil is '+sigf(h[i],6)+' G mm^2 (numpy FFT, 256 angles)'));
    let even=0, sin=0;
    for(let k=0;k<=40;k+=2) even=Math.max(even,Math.abs(ser.a[k]));
    for(let k=1;k<=40;k++) sin=Math.max(sin,Math.abs(ser.b[k]));
    ok(even<1e-11&&sin<1e-11,pct+' %: no even harmonics ('+even.toExponential(1)+') and no sine terms ('+sin.toExponential(1)+'): half a turn reverses the magnet, and Phi is even in theta');
    /* the series really is the flux, at angles it was not sampled at */
    let wr=0; for(const t of [0.17,1.04,2.71,4.9]) wr=Math.max(wr,Math.abs(seriesPhi(ser,t)-flux1(t,ser.rc)));
    ok(wr<1e-9,'and it reproduces the flux between its own samples ['+wr.toExponential(1)+' G mm^2]');
    /* its derivative is the derivative (a central difference, independently) */
    let wd=0; for(const t of [0.3,1.2,2.0,5.5]){ const hh=1e-5;
      wd=Math.max(wd,Math.abs(seriesDPhi(ser,t)-(seriesPhi(ser,t+hh)-seriesPhi(ser,t-hh))/(2*hh))); }
    ok(wd<1e-6,'and dPhi/dtheta term by term matches a central difference of it ['+wd.toExponential(1)+']');
  }
  /* --- the peak: NOT at 90 degrees --- */
  for(const pct of [20,50,100]){
    const ser=fluxSeries(pickRadius(pct)), p=REF['gen.peak.'+pct], pk=emfPeak(ser);
    close(pk.th,p[0],1e-6,'the EMF of a '+pct+' % coil peaks at '+fmt(p[0]*R2D,4)+' degrees, not 90 (python, bounded maximiser)');
    rel(pk.val,p[1],1e-9,'with dPhi/dtheta = '+sigf(p[1],6)+' G mm^2/rad there');
    rel(pk.at90,p[2],1e-9,'and '+sigf(p[2],6)+' at 90 degrees, '+fmt(p[2]/p[1],4)+' of the peak');
    ok(pk.th<Math.PI/2-0.1,'the peak stands well before 90 degrees ('+fmt(pk.th*R2D,1)+'), because the flux is not a cosine');
    rel(Math.max.apply(null,ser.F.map(Math.abs)),p[3],1e-9,'the largest flux over the turn is '+sigf(p[3],6)+' G mm^2');
  }
  /* --- PhET's line sample overestimates the flux --- */
  for(const pct of [20,50,100]){
    const rc=pickRadius(pct), r=REF['gen.phet.'+pct];
    rel(fluxPhet1(0,rc),r[0],1e-9,'PhET\'s line sample of the '+pct+' % coil is '+sigf(r[0],6)+' G mm^2 (python)');
    rel(fluxPhet1(0,rc)/flux1(0,rc),r[2],1e-9,'which is '+fmt(r[2],4)+' of the area integral: high by '+fmt(100*(r[2]-1),1)+' %');
    ok(r[2]>1,'the line sample is always the larger: it takes the field off the page to be the field in it');
  }
  /* the ring average is what the area integral weights */
  { const rc=pickRadius(50);
    close(ringBx(0.6,0),pageBx(0.6,0),1e-12,'at the centre the ring average IS the in-page value');
    ok(Math.abs(ringBx(0.6,rc*0.9))<Math.abs(pageBx(0.6,rc*0.9)),'with the magnet turned, the ring average is the smaller towards the rim');
    close(ringBx(0,rc*0.9),pageBx(0,rc*0.9),1e-12,'but with the magnet in line with the coil they are equal at every radius: the field is then a function of the distance from that axis alone');
    /* and the area integral of the ring average IS the flux (the same number by a second route) */
    const G=gaussLegendre(24); let s=0;
    for(let i=0;i<24;i++){ const q=0.5*rc*(G.x[i]+1); s+=0.5*rc*G.w[i]*ringBx(0.6,q,256)*2*Math.PI*q; }
    rel(s,flux1(0.6,rc),1e-9,'and integrating 2 pi s <B_x>(s) ds gives the same flux ['+sigf(s,8)+']'); }
  /* the face view's two curves are the two estimates: their areas are the numbers themselves */
  for(const th of [0,0.9]){
    const rc=pickRadius(50), C=faceIntegrands(th,rc,4001);
    let se=0; for(let i=1;i<C.s.length;i++) se+=0.5*(C.ex[i]+C.ex[i-1])*(C.s[i]-C.s[i-1]);
    rel(se,flux1(th,rc),1e-5,'the exact strip integrand of the coil-face view integrates to the flux at theta = '+th);
    const m=Math.floor(rc/PHET_SP); let sp=0;
    for(let k=-m;k<=m;k++) sp+=chordPhet(th,k*PHET_SP,rc)*PHET_SP;
    rel(sp,fluxPhet1(th,rc),1e-12,'and PhET\'s, summed at its own 5 mm spacing, is PhET\'s own estimate at theta = '+th);
    let above=0, seen=0;
    for(let i=0;i<C.s.length;i++){ if(Math.abs(C.ex[i])<1e-9) continue; seen++; if(Math.abs(C.ph[i])>=Math.abs(C.ex[i])-1e-12) above++; }
    /* in line with the coil the field over the face depends only on the distance from the
       axis, so PhET's strip is the larger at EVERY height; with the magnet turned the field
       swings about near the rim and a few strips go the other way -- but the total still
       comes out high, which is the claim the view makes */
    if(th===0) ok(seen>100&&above===seen,'PhET\'s strip is the larger at every height when the magnet is in line ('+above+' of '+seen+')');
    else ok(seen>100&&above>0.9*seen,'and at nearly every height when it is turned ('+above+' of '+seen+' at theta = '+th+')');
    ok(Math.abs(fluxPhet1(th,rc))>Math.abs(flux1(th,rc)),'the total is the larger either way at theta = '+th
       +' ('+fmt(100*(fluxPhet1(th,rc)/flux1(th,rc)-1),1)+' % high)');
  }

  /* --- Faraday: EMF = -N omega dPhi/dtheta, in volts --- */
  { const rc=pickRadius(50), ser=fluxSeries(rc), pk=emfPeak(ser), v=REF['gen.volts.default'];
    const e=emfOf(ser,pk.th,2,225,2*Math.PI);
    rel(Math.abs(e),v[0],1e-9,'2 loops, 225 G, 60 RPM: the peak EMF is '+sigf(v[0]*1e3,4)+' mV (python)');
    rel(Math.abs(e)/E_FULL,v[1],1e-9,'which is '+fmt(v[1],4)+' of PhET\'s full scale');
    /* linear in N and in omega, and odd in each */
    for(const N of [1,2,3,4]) rel(emfOf(ser,0.8,N,225,3),N*emfOf(ser,0.8,1,225,3),1e-12,'the EMF is N times one loop\'s at N = '+N);
    for(const om of [0.5,2,7.3]) rel(emfOf(ser,0.8,2,225,om),om*emfOf(ser,0.8,2,225,1),1e-12,'and proportional to omega at omega = '+om);
    close(emfOf(ser,0.8,2,225,-3),-emfOf(ser,0.8,2,225,3),0,'turning the wheel the other way reverses it, exactly');
    for(const t of [0,Math.PI]) close(emfOf(ser,t,2,225,3),0,1e-15,'it vanishes at theta = '+fmt(t,3)+', where the flux is stationary');
    /* the phase: the EMF is the NEGATIVE derivative of the flux, by finite difference of Phi */
    let wp=0;
    for(const t of [0.4,1.1,2.6,4.2,5.9]){ const hh=1e-6, N=3, S=180, om=2.1;
      const dP=(fluxOf(ser,t+hh,N,S)-fluxOf(ser,t-hh,N,S))/(2*hh);
      wp=Math.max(wp,Math.abs(emfOf(ser,t,N,S,om)+om*dP)); }
    ok(wp<1e-12,'and it is -N omega dPhi/dtheta at every angle, against a finite difference of Phi itself ['+wp.toExponential(1)+' V]'); }

  /* --- the normalised current, and the clamp that never bites here --- */
  { close(normOf(0.4*E_FULL),0.4,1e-15,'the normalised current is the EMF against PhET\'s full scale');
    close(normOf(3*E_FULL),1,0,'clamped at 1 above it'); close(normOf(-3*E_FULL),-1,0,'and at -1 below');
    let mx=0, at='';
    for(const N of [1,2,3,4]) for(const a of [20,40,60,80,100]){
      const ser=fluxSeries(pickRadius(a)), pk=emfPeak(ser);
      const om=2*Math.PI*genRPM({N,area:a,strength:100,flow:100})/60;
      const v=Math.abs(emfOf(ser,pk.th,N,S_MAX,om));
      if(v>mx){ mx=v; at=N+' loops at '+a+' %'; }
    }
    ok(mx<E_FULL,'no setting of this page\'s sliders reaches full scale ('+fmt(mx/E_FULL,3)+' at most, '+at+'), so the clamp never bites here');
    ok(mx>0.4*E_FULL,'though it comes within reach of it ('+fmt(mx/E_FULL,3)+'), which is what PhET scaled its full scale to'); }

  /* --- PhET's drag on the wheel --- */
  { const d=REF['gen.drag'], dd=REF['gen.drag.default'];
    close(NA_LO,d[0],0,'the smallest coil is 1 x 20 % = 14137 mm^2 of loop (python)');
    close(NA_HI,d[1],0,'the largest 4 x 100 % = 282740');
    close(DRAG_LO,d[2],1e-15,'so the drag runs from 0.01'); close(DRAG_MAX,d[3],0,'to PhET\'s 0.2');
    close(genDrag(2,50,75),dd[0],1e-15,'at the defaults it is '+fmt(dd[0],4));
    close(genRPM({N:2,area:50,strength:75,flow:100}),dd[1],1e-12,'so full flow turns the wheel at '+fmt(dd[1],2)+' RPM');
    close(genRPM({N:2,area:50,strength:75,flow:0}),0,0,'and a closed faucet turns it not at all');
    ok(genDrag(4,100,100)>genDrag(1,20,100),'a bigger coil drags harder');
    close(genDrag(2,50,0),0,0,'and a magnet of no strength drags not at all'); }

  /* --- the whole chain, from the page's own state --- */
  { const st=clone(ST);
    resetState({view:'gen',flow:100,N:3,area:70,pct:60,th:0.7});
    const R=genReadings(genState(ST));
    close(R.rpm,genRPM(genState(ST)),0,'the readings carry the wheel\'s own speed');
    close(R.S,S_MAX*0.6,1e-13,'and the magnet\'s own strength');
    rel(R.Phi,fluxOf(R.ser,0.7,3,180),1e-15,'the flux is the series at the wheel\'s angle, through all 3 loops');
    rel(R.emf,emfOf(R.ser,0.7,3,180,R.omega),1e-15,'and the EMF is Faraday\'s law at that angle');
    close(R.norm,Math.max(-1,Math.min(1,R.emf/E_FULL)),0,'the normalised current is the EMF against full scale, clamped as PhET clamps it');
    /* stepping the page's clock really does integrate the same law */
    const P0=R.Phi, t0=ST.th, dt=1/600;
    stepLive(dt);
    const P1=genReadings(genState(ST)).Phi;
    ok(ST.th>t0,'stepping the clock turns the wheel forwards');
    const mid=emfOf(R.ser,0.5*(t0+ST.th),3,180,R.omega);
    const e1=Math.abs(-(P1-P0)/dt-mid)/Math.abs(mid);
    rel(-(P1-P0)/dt,mid,1e-4,'and -dPhi/dt over that step is the EMF at the midpoint ['+sigf(-(P1-P0)/dt*1e3,6)+' mV]');
    /* the difference is the midpoint rule's own error, second order in the step: halving the
       step must quarter it, which is the check that the EMF really is the derivative */
    resetState({view:'gen',flow:100,N:3,area:70,pct:60,th:0.7});
    const Q0=genReadings(genState(ST)).Phi, s0=ST.th;
    stepLive(dt/2);
    const Q1=genReadings(genState(ST)).Phi;
    const mid2=emfOf(R.ser,0.5*(s0+ST.th),3,180,R.omega);
    const e2=Math.abs(-(Q1-Q0)/(dt/2)-mid2)/Math.abs(mid2);
    ok(Math.abs(e1/e2-4)<0.2,'and halving the step quarters that error, as a midpoint rule must ['+fmt(e1/e2,3)+']');
    resetState(st);
  }
}

/* ---- the DRAWN generator: the wheel, the water and the voltmeter ----
   The readings could all be right with the picture wrong, so these measure the emitted
   geometry (Known-bad: assert on what is drawn, not only on the model). */
function testGenDrawn(T){
  const {ok,close}=T;
  const map={s:1,X:x=>x,Y:y=>-y};
  /* the wheel's paddles stand at theta + k pi/4 */
  for(const th of [0,0.8,2.5]){
    const c=makeGeomME(); drawWheel(c,map,th);
    const spokes=c.ops.filter(o=>o.stroke==='#5c6478');
    ok(spokes.length===8,'the wheel has eight spokes ('+spokes.length+')');
    const angs=spokes.map(o=>{ const p=o.path[0]; return Math.atan2(-(p[1][1]-p[0][1]),p[1][0]-p[0][0]); });
    let worst=0;
    for(const a of angs){ let d=1e9; for(let k=0;k<8;k++) d=Math.min(d,Math.abs(wrapPi(a-(th+k*Math.PI/4)))); worst=Math.max(worst,d); }
    ok(worst<1e-9,'and they stand at theta + k pi/4 with theta = '+fmt(th,2)+' ['+worst.toExponential(1)+']');
  }
  /* the wheel writes its own speed in the hub, as PhET's does, and only while it turns */
  { const txt=rpm=>{ const c=makeShotMC(1400,820); drawRPM(c,map,rpm);
      return c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' '); };
    ok(txt(0)==='','a wheel at rest writes nothing in its hub');
    ok(txt(57.75).indexOf(fmt(57.75,1))>=0&&txt(57.75).indexOf('RPM')>=0,'a turning one writes its speed to one decimal, with the unit ('+txt(57.75)+')');
    ok(txt(12.3).indexOf('12.3')>=0,'whatever the speed');
    /* and it is painted over the magnet, not under it: the last fill at the hub is its own */
    { const c=makeGeomME(), W=1400, H=820, keep=clone(ST);
      resetState({view:'gen',flow:100,th:0});
      drawGenScreen(c,W,H,buildModel());
      resetState(keep);
      const map2=screenGeo(c,W,H,'gen').map, X=map2.X(TURB_X), Y=map2.Y(TURB_Y);
      let last=null;
      for(const o of c.ops) if(o.fill) for(const sp of o.path){
        const xs=sp.map(q=>q[0]), ys=sp.map(q=>q[1]);
        if(Math.min.apply(null,xs)<=X&&Math.max.apply(null,xs)>=X&&Math.min.apply(null,ys)<=Y&&Math.max.apply(null,ys)>=Y) last=o.fill; }
      ok(last==='rgba(9,12,22,0.9)','the speed disc is the last thing painted at the hub, so the magnet cannot hide it ['+last+']'); } }

  /* the water column: drawn only when the faucet is open, and wider as it opens.  Measured on
     the drawn path, which is the only place the width actually reaches the picture. */
  { const wid=flow=>{ const c=makeGeomME(); drawFaucet(c,map,flow);
      const col=c.ops.filter(o=>o.fill===rgba(COL.water,0.75));
      if(!col.length) return 0;
      const xs=col[0].path[0].map(p=>p[0]);
      return Math.max.apply(null,xs)-Math.min.apply(null,xs); };
    const w=[0,25,50,100].map(wid);
    close(w[0],0,0,'a closed faucet draws no water at all');
    ok(w[3]>w[2]&&w[2]>w[1]&&w[1]>0,'and the column widens with the flow ('+w.map(v=>fmt(v,1)).join(', ')+' mm)');
    close(w[3]-w[1],waterW(100)-waterW(25),1e-9,'in proportion to it: the drawn width is the flow rule itself');
    const c=makeGeomME(); drawFaucet(c,map,60);
    const ys=c.ops.filter(o=>o.fill===rgba(COL.water,0.75))[0].path[0].map(p=>-p[1]);
    const yb=Math.min.apply(null,ys);
    /* where it lands is a property, not a formula: the bottom of the column sits ON the rim */
    close(Math.hypot(FAUCET_X-TURB_X,yb-TURB_Y),WHEEL_R,1e-9,'and it lands on the wheel\'s rim, '+fmt(WHEEL_R,0)+' mm from the hub');
    ok(yb>TURB_Y,'on the upper half of the wheel, where it pushes the paddles down');
    ok(FAUCET_X<TURB_X,'and on the left of it, so the wheel turns the way the angle increases'); }
  /* the drawn coil: its turns are centred on the point the flux is computed for, and the
     electrons ride on those same turns (a coil drawn off its own centre would make every
     number right and the picture a lie) */
  for(const N of [1,2,4]){
    const rc=pickRadius(50), c=makeGeomME();
    drawCoilHalf(c,map,pickLoopsX(N),PICK_X,PICK_Y,rc,PICK_WIRE*2,'front');
    /* a FRONT half runs from its own centre outwards (x from X to X + rx), so the centre is
       its left edge -- the bounding box's middle would be half a turn's width to the right */
    const cen=[];
    for(const o of c.ops) if(o.stroke===COL.copper) for(const sp of o.path){
      const xs=sp.map(q=>q[0]); cen.push(Math.min.apply(null,xs));
    }
    ok(cen.length===N,'the coil draws its '+N+' turn'+(N>1?'s':'')+' ('+cen.length+')');
    if(!cen.length) continue;
    let mean=0; for(const v of cen) mean+=v/cen.length;
    close(mean,PICK_X,1e-9,'centred on the coil at x = '+PICK_X+' mm, where the flux is worked out');
    const e=makeGeomME(); drawElectrons(e,map,pickLoopsX(N),PICK_X,PICK_Y,rc,0.25,4);
    let far=0;
    for(const o of e.ops) if(o.fill===COL.electron) for(const sp of o.path) for(const q of sp){
      let d=1e9; for(const cx of cen) d=Math.min(d,Math.abs(q[0]-cx)); far=Math.max(far,d); }
    /* an electron sits on the front half of its own turn, so at most one turn's drawn
       half-width (COIL_TILT x rc) from that turn's centre, plus its own radius */
    ok(far<=rc*COIL_TILT+4,'and its electrons ride on those turns ['+fmt(far,2)+' mm off at worst, the half-width being '+fmt(rc*COIL_TILT,2)+']');
  }
  /* the indicator stands clear of the coil at every area, whatever its radius */
  for(const a of [20,50,100]){
    const rc=pickRadius(a), P=indicatorPos(rc);
    ok(P.y>PICK_Y+rc,'the indicator rides above the coil at '+a+' % of the area ('+fmt(P.y,0)+' vs its top at '+fmt(PICK_Y+rc,0)+' mm)');
    ok(P.y<LAYOUT_H-40,'and stays on the stage there');
    close(P.x,PICK_X,0,'over the coil\'s own centre');
  }
  /* the voltmeter's needle is the EMF against full scale, x 90 degrees */
  for(const norm of [0,0.4,-0.75,1]){
    const c=makeGeomME(); drawVoltmeter(c,map,500,300,norm*90,norm*E_FULL);
    const nd=c.ops.filter(o=>o.stroke===COL.live)[0];
    ok(!!nd,'the voltmeter draws its needle');
    if(!nd) continue;
    const p=nd.path[0], a=Math.atan2(-(p[1][1]-p[0][1]),p[1][0]-p[0][0]);
    close(a*R2D,90-norm*90,1e-9,'and it stands at '+fmt(90-norm*90,1)+' degrees from +x for EMF/full = '+norm);
  }
  /* the bulb's glass brightens with |EMF| through the named display mapping, and at rest it
     is the unlit colour.  The MODEL brightness is |EMF|/full scale and is asserted above. */
  { const glass=c=>c.ops.filter(o=>o.fill&&o.fill!=='#5c6478'&&o.fill.indexOf('rgba')!==0);
    const shade=b=>{ const c=makeGeomME(); drawBulb(c,map,500,300,b); return glass(c)[0].fill; };
    ok(shade(0)===mix('#1b2130','#ffe38a',0),'the unlit bulb is the dark glass');
    ok(shade(0.81)===mix('#1b2130','#ffe38a',bulbShade(0.81)),'and it mixes towards the lit colour through bulbShade');
    close(bulbShade(0.81),0.9,1e-12,'which is sqrt at 0.81, a display mapping and not the model');
    close(bulbShade(0),0,0,'zero at zero'); close(bulbShade(1),1,0,'and one at full scale');
    ok(bulbShade(0.2)>0.2,'so a fifth of full scale is visible rather than nearly black ('+fmt(bulbShade(0.2),3)+')');
    let mono=true; for(let i=1;i<=20;i++) if(bulbShade(i/20)<=bulbShade((i-1)/20)) mono=false;
    ok(mono,'and it rises all the way'); }
}
/* ================================================================== *
 *  selfTest -- headless verification.  The shared suites (t_core,     *
 *  t_lines, t_rotor) assert the engine against derive.py, the         *
 *  family's Python twin; t_gen is this sim's own physics, and below   *
 *  them are this page's model, panels and layout.                     *
 * ================================================================== */
function makeShotMC(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st.font,a:st.align,b:st.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st.font=s.f; st.align=s.a; st.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s=Math.sin(r); Mx=mul(Mx,[c,s,-s,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; pend.n++; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1,style:ctx.fillStyle}); },
    stroke(){ ops.push({op:'stroke',n:pend?pend.n:0}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke',n:1}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st.align==='center'?x-w/2:(st.align==='right'?x-w:x);
      const ly=st.base==='top'?y:(st.base==='middle'?y-fh/2:(st.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c=>app(c[0],c[1]));
      const xs=cs.map(c=>c[0]), ys=cs.map(c=>c[1]);
      ops.push({op:'text',t:''+t,rot:Math.abs(Mx[1])>1e-9,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st.font,set:v=>st.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st.align,set:v=>st.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st.base,set:v=>st.base=''+v});
  return ctx;
}

function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T={ok,close,rel};
  const T0=Date.now();
  const stSave=clone(ST);
  function withState(over,fn){ resetState(over); for(const k in MEMO) delete MEMO[k]; try{ return fn(); } finally{ resetState(stSave); for(const k in MEMO) delete MEMO[k]; } }

  testCore(T);
  testDrawnNeedles(T);
  withState({view:'axis'},()=>testAxisMarks(T));
  testLines(T,['magnet']);
  testRotor(T);
  testCaptions(T,withState);
  testGen(T);
  testGenDrawn(T);

  /* ---------- this page ---------- */
  ok(TABS.length===6&&TABS[0][0]==='gen','six views: PhET’s one screen and five that open it up');
  ok(ST.view==='gen'&&ST.flow===0&&ST.pct===75&&ST.N===2&&ST.area===50&&ST.indicator==='bulb'&&ST.genField&&ST.electrons,
     'it opens as PhET does: the faucet closed, 75 %, 2 loops, half the area, the bulb');
  close(turbMagnet(ST).S,225,0,'75 % of PhET\'s 300 G is 225 G');
  close(turbMagnet(ST).x,TURB_X,0,'and the magnet rides the wheel, not the pointer');
  withState({},()=>{ const M=buildModel();
    ok(M.R.emf===0&&M.R.rpm===0,'with the faucet closed there is no EMF, however strong the magnet');
    ok(M.R.Phi!==0,'though the flux through the coil is not zero: it is its CHANGE that matters'); });
  withState({flow:100},()=>{ const M=buildModel();
    ok(M.R.rpm>0,'open the faucet and the wheel turns ('+fmt(M.R.rpm,1)+' RPM)');
    ok(Math.abs(M.R.emf)>=0,'and the EMF follows the angle it is at'); });
  withState({pct:0,flow:100},()=>{ const M=buildModel();
    ok(M.R.Phi===0&&M.R.emf===0&&M.atCompass.B===0,'at zero strength there is no field, no flux and no EMF'); });
  /* twice the loops is twice the EMF -- but the second loop also drags the wheel, so the
     chain has to carry BOTH: the ratio is 2 (1 - d2)/(1 - d1), not 2 */
  { const A=withState({flow:100,N:1,th:0.5},()=>buildModel().R.emf);
    const B=withState({flow:100,N:2,th:0.5},()=>buildModel().R.emf);
    const want=2*(1-genDrag(2,50,75))/(1-genDrag(1,50,75));
    rel(B/A,want,1e-12,'two loops give 2 (1 - d2)/(1 - d1) = '+fmt(want,5)+' times one loop\'s EMF: the extra loop drags the wheel too');
    ok(want<2,'which is less than 2, because the wheel is slowed by the coil it drives'); }
  { const A=withState({flow:50,N:2,th:0.5},()=>buildModel().R.emf);
    const B=withState({flow:100,N:2,th:0.5},()=>buildModel().R.emf);
    ok(Math.abs(B/A-2)<1e-12,'and twice the flow turns the wheel twice as fast, for twice the EMF'); }
  /* the flip is half a turn of the wheel */
  withState({flow:100,th:0.4},()=>{
    const e0=buildModel().R.emf;
    flipMagnet(ST);
    close(ST.th,0.4+Math.PI,1e-15,'flip polarity turns the magnet through pi');
    rel(buildModel().R.emf,-e0,1e-9,'which reverses the EMF: half a turn reverses the magnet');
  });
  /* the clock: the wheel turns, the compass lags it, and a closed faucet moves nothing */
  withState({view:'gen',flow:0},()=>{
    ok(stepLive(1/60)===false,'with the faucet closed and the needle settled the page paints nothing');
  });
  withState({view:'gen',flow:60},()=>{
    const th0=ST.th;
    ok(stepLive(1/60)===true,'open it and the page moves again');
    close(ST.th-th0,2*Math.PI*genRPM(genState(ST))/60/60,1e-12,'the wheel turns omega dt in a frame');
    const phi0=LIVE.genRot.phi;
    for(let i=0;i<20;i++) stepLive(1/60);
    ok(LIVE.genRot.phi!==phi0&&LIVE.genRot.om!==0,'and the compass needle is dragged round by the turning field');
  });
  withState({view:'gen',flow:100,electrons:true},()=>{
    const p0=LIVE.ePhase; stepLive(1/60);
    ok(LIVE.ePhase!==p0,'the electrons move while there is a current');
  });
  withState({view:'lines'},()=>{ ok(stepLive(1/60)===false,'the analysis views are still'); });
  withState({view:'needle'},()=>{ ok(stepLive(1/60)===true,'except the needle view, which runs its own clock'); });

  /* the magnet's moment: with no far-field view here, the axis view's dipole curve is what
     carries it.  Pinned against the exact field far away rather than against itself. */
  { const S=225, C={B:[],Hh:[],dip:[],ref:[]};
    ANA_SRC.magnet.axisPoint({kind:'magnet',N:0,unit:S},4000,C);
    rel(C.dip[0],S*solAxis(4000,MAG_R,MAG_B),2e-3,'the dipole drawn on the axis is the exact field at 4 m, so its moment mu0 m/4pi is right');
    rel(magMoment(S),S/G_PER_T/MU0*Math.PI*Math.pow(MAG_R*1e-3,2)*MAG_L*1e-3,1e-15,'m = M V in A m^2');
    rel(magMoment(S),8.790,3e-4,'which is 8.79 A m^2 for this bar'); }
  /* the flux view's live marker: drawn where the wheel actually stands */
  withState({view:'flux',pct:0},()=>{
    const c=makeShotMC(1400,820); drawFluxView(c,1400,820,buildModel());
    const t=c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' ');
    ok(/strength 0/.test(t)&&/nothing for its change/.test(t),'with no field the flux view says so in both of its panels');
  });
  withState({view:'face',pct:0},()=>{
    const c=makeShotMC(1400,820); drawFaceView(c,1400,820,buildModel());
    const t=c.ops.filter(o=>o.op==='text').map(o=>o.t).join(' ');
    ok(/no field over the coil/.test(t),'and so does the coil-face view');
  });
  withState({view:'flux',flow:100,th:1.3},()=>{
    const c=makeGeomME(), W=1400, H=820;
    drawFluxView(c,W,H,buildModel());
    const b=fluxGeo(c,W,H).main;
    const dots=c.ops.filter(o=>o.fill===COL.live&&o.path.length&&o.path[0].length>8);
    ok(dots.length>=1,'the flux view draws a marker where the wheel stands ('+dots.length+')');
    if(dots.length){
      const xs=dots[0].path[0].map(q=>q[0]), ys=dots[0].path[0].map(q=>q[1]);
      const cx=0.5*(Math.min.apply(null,xs)+Math.max.apply(null,xs));
      const r=0.5*(Math.max.apply(null,xs)-Math.min.apply(null,xs));
      close(cx,b.x+b.w*(1.3*R2D)/360,0.6,'at the angle the wheel is at, to within a pixel');
      ok(r>=1.5,'and big enough to see ('+fmt(r,2)+' px)');
      const cy=0.5*(Math.min.apply(null,ys)+Math.max.apply(null,ys));
      ok(cy>b.y&&cy<b.y1,'inside the plot box, on its curve');
    }
  });

  /* ---------- panels ---------- */
  const panels=over=>withState(over,()=>{ const M=buildModel(); return readoutHTML(M)+eqbarHTML(M)+tagHTML(M); });
  const CASES=[{},{flow:100},{flow:100,indicator:'volt',genMeter:true},{pct:0},{pct:100,seeInside:true,flow:45},
    {N:4,area:100,flow:100},{N:1,area:20,flow:5},{genCompass:false},{units:'T',genMeter:true,flow:80},
    {view:'flux'},{view:'flux',flow:100,N:4,area:100},{view:'flux',pct:0},
    {view:'face'},{view:'face',area:20},{view:'face',area:100,th:1.2},{view:'face',pct:0},
    {view:'lines'},{view:'lines',pct:0},{view:'axis'},{view:'axis',axisH:false},
    {view:'needle'},{view:'needle',ndB:0.05,ndRel:179},{view:'needle',ndB:300,ndRel:1,ndDamp:0},{view:'needle',ndDamp:10}];
  for(const over of CASES){ const html=panels(over);
    ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0&&html.indexOf('Infinity')<0,'panels clean for '+JSON.stringify(over).slice(0,48)); }
  { const rd=meterReading({kind:'magnet',x:TURB_X,y:TURB_Y,ang:0,S:225},800,470);
    ok(panels({genMeter:true}).indexOf(fmtField(rd.B,'G'))>=0,'the readout prints the meter\'s own |B| off the model'); }
  ok(panels({view:'flux',flow:100}).indexOf(fmt(emfPeak(fluxSeries(pickRadius(50))).th*R2D,2))>=0,
     'the flux readout prints the peak angle the engine finds');
  ok(panels({view:'face'}).indexOf(fmt(pickRadius(50),2))>=0,'the face readout prints the coil\'s own radius');
  ok(panels({view:'axis'}).indexOf(sigf(magMoment(225),3))>=0,'the axis readout prints the magnet\'s moment m = M V');
  ok(panels({flow:100}).indexOf(fmt(genRPM({N:2,area:50,strength:75,flow:100}),2))>=0,'and the screen readout the wheel\'s own speed');
  /* every FIELD reading must convert: a number followed by G.  (Plain ' G' will not do as
     a test -- the note names Gauss-Legendre, and a word is not a unit.) */
  ok(panels({units:'T'}).indexOf('× 10^')>=0&&!/[\d.]\s*G(?![a-z])/.test(plain(panels({units:'T'}))),'in tesla no reading is left in gauss');
  { let bad=null;
    for(const flow of [0,35,100]) for(const view of TABS.map(t=>t[0])){ const html=panels({view,flow});
      if(/NaN|undefined|Infinity/.test(html)) bad=view+' '+flow; }
    for(const N of [1,4]) for(const area of [20,100]) for(const pct of [0,100]){
      const html=panels({view:'gen',N,area,pct,flow:100}); if(/NaN|undefined|Infinity/.test(html)) bad='gen '+N+' '+area+' '+pct; }
    ok(!bad,'no combination of the sliders makes a non-finite panel ('+(bad||'none')+')'); }

  /* ---------- layout ---------- */
  const SIZES=[[1400,820],[1240,760],[1100,700],[820,560],[560,380]];
  const CONFIGS=[['gen',{}],['gen running',{flow:100,th:0.9}],['gen volt',{flow:70,indicator:'volt',th:0.4,genMeter:true}],
    ['gen big coil',{flow:100,N:4,area:100,th:2.1}],['gen small coil',{flow:20,N:1,area:20,seeInside:true}],
    ['gen zero',{pct:0,flow:100}],['gen no tools',{genCompass:false,genMeter:false,flow:55,th:5.5}],
    ['flux',{view:'flux'}],['flux running',{view:'flux',flow:100,th:1.1}],['flux big',{view:'flux',N:4,area:100,flow:60}],
    ['flux zero',{view:'flux',pct:0}],
    ['face',{view:'face'}],['face small',{view:'face',area:20,th:0.7}],['face big',{view:'face',area:100}],
    ['face no dots',{view:'face',phetCmp:false}],['face zero',{view:'face',pct:0}],
    ['lines',{view:'lines'}],['lines no bound',{view:'lines',bound:false}],['lines zero',{view:'lines',pct:0}],
    ['axis',{view:'axis'}],['axis no H',{view:'axis',axisH:false}],
    ['needle',{view:'needle'}],['needle slow',{view:'needle',ndB:0.05,ndRel:179}],
    ['needle undamped',{view:'needle',ndB:300,ndRel:20,ndDamp:0}]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShotMC(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill'), strokes=c.ops.filter(o=>o.op==='stroke');
      const says=texts.some(t=>/no field|strength 0|faucet is closed|nothing for its change/.test(t.t));
      ok((fills.length>=1&&fills.length+strokes.length>=8&&texts.length>=3)||says,
         nm+' '+W+'x'+H+' draws substance or says why ('+fills.length+' fills, '+strokes.length+' strokes, '+texts.length+' texts)');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'"'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null; const flat=texts.filter(t=>!t.rot);
      for(let i=0;i<flat.length&&!hit;i++) for(let j=i+1;j<flat.length;j++){
        const a=flat[i].bb,b=flat[j].bb, ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+flat[i].t.slice(0,22)+'" vs "'+flat[j].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
      ok(!inHint.length,nm+' '+W+'x'+H+' leaves the #hint corner clear');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i=0;i<POLY_SEGS.length;i+=4){
        const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    });
  }
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
