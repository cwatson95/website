<title>Charges and Fields &mdash; point charges, their field and potential</title>
<!--
  ===================================================================
  charges-and-fields.html — Charges and Fields: point charges on a
  plane, their exact electric field and potential, the equipotentials
  and field lines they make, the potential as a landscape, the field
  as a vector sum, and the multipole far field
  ===================================================================

  Remake of PhET Interactive Simulations' Charges and Fields (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets. The original is docs/phets/charges-and-fields_en.html
  (version 1.0.67); its single screen is the first view here.

  Five views.  THE PLANE — PhET's screen: drag +1 nC and -1 nC charges
  and E-field sensors out of the bin onto an 8 m x 5 m plane, drop them
  back in the bin to remove them.  The field is drawn on a 0.5 m grid of
  fixed-length arrows whose brightness follows |E| up to 5 V/m ("direction
  only" makes them all bright), the voltage on 0.1 m cells that saturate
  at +-40 V.  The voltage sensor reads V at its crosshair and its "plot"
  button traces the equipotential through it; the E-field sensors read
  |E| and its direction; there is a tape measure, a grid and value
  labels.  FIELD LINES — the same charges, lines traced along E from the
  charges of the majority sign, an evenly spaced family of equipotentials
  crossing them at right angles, and the null points where E = 0 found and
  classified.  THE LANDSCAPE — V(x, y) as a height surface (clipped, and
  the clip printed): peaks at the positive charges, wells at the negative
  ones, the field everywhere pointing straight downhill, and the plotted
  equipotentials drawn as the level cuts they are.  SUPERPOSITION — at a
  probe, each charge's field drawn head to tail and the chain closing on
  the total; the potential as a signed sum of the charges' terms.  THE FAR
  FIELD — the potential along a ray against distance on log axes, the
  exact sum against its leading multipole term, and r^(l+1) V(r) taken to
  its limit numerically.

  WHAT IS EXACT
  -------------
  V(r) = k sum q_i / |r - r_i| and E = k sum q_i (r - r_i) / |r - r_i|^3:
  the 3-D Coulomb field of point charges held in the plane z = 0 (PhET's
  model: "the three dimensional Maxwell's equations are used, the charges
  are confined to move along a two dimensional surface"), in closed form
  at every point drawn.  The equipotentials are traced along z x E by RK4
  and projected back onto V = V0 by Newton after every step, so every
  vertex sits on the level set to 1e-12; they close on themselves or end
  at the edge of the traced region.  Field lines are RK4 on E/|E| with the
  step set by the local length scale min(distance to a charge, |E|/|grad E|).
  Null points are Newton roots of E = 0 with the analytic Jacobian.  The
  multipole coefficients along a ray come from the Legendre expansion of
  1/|r - d|, exact to all orders beyond the farthest charge and checked
  against the tensor contraction for the monopole, dipole and quadrupole.
  The tape reads V(A) - V(B), which the suite checks against the line
  integral of E along it.  Everything is pinned in selfTest to
  build/charges-and-fields/derive.py (scipy brentq on rays for the
  equipotential loops, solve_ivp for the field lines, fsolve for the
  nulls, quad for the tape).

  WHAT IS MEASURED
  ----------------
  One constant: eps0 = 8.8541878188e-12 F/m (CODATA 2022, from the NIST
  constants page, stored verbatim), so k = 1/(4 pi eps0) = 8.98755 V m/nC.
  The charges are +-1 nC exactly, as in PhET.

  WHAT IS CHOSEN (PhET's values, read from the 1.0.67 build)
  ----------------------------------------------------------
  The 8 m x 5 m plane and the bin at x in [-1.25, 1.25] m, y in [-2.3,
  -1.7] m; the arrow grid at 0.5 m cell centres, 40 px arrows at 128 px/m
  (0.3125 m); the voltage cells of 0.1 m; the colour saturations at +-40 V
  and 5 V/m; the sensor arrow at 15 px per V/m at 128 px/m (0.1172 m per
  V/m); the charge radius of 12 px (0.094 m); no equipotential seeded
  within 3 cm of a charge; plotted equipotentials cleared whenever a charge
  moves.  PhET's own Coulomb constant is K_CONSTANT = 9 V m/nC, a rounding
  of k, so PhET reads 0.14 % higher than this page (9.00 V at 1 m from
  +1 nC against 8.99 V here).

  WHAT IS NOT MODELLED
  --------------------
  The charges feel no forces and do not move by themselves (this is
  electrostatics, not dynamics); there are no conductors or dielectrics;
  the charges are points (nothing is drawn inside a charge's disc, where
  the field grows without bound).  PhET's projector colour profile and its
  touch and keyboard accessibility layer are not reproduced.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);

function wrapText(ctx,txt,maxW,font){

    const t=line?line+' '+w:w;

}
function caption(ctx,x,y,txt,maxW,col,font){

function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){

function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];

  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;

function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;

function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};

     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);

    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);

     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */

    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};
}
function sparseTicks(lo,hi,hpx){
  return ticksFor(lo,hi,hpx<90?2:(hpx<140?3:5));
}
/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));
  let fit=capFit(ctx,W,H,fullTxt,capW);
  if(fit.capY>=minTop) return {capY:fit.capY,txt:fullTxt,capW};

}
function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — verbatim from build_lagr/p4_views.js (the lattice / steam_carnot *
 *  camera), with boxCamera sizing it to a panel                       *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));
  const up=v3.cross(right,fwd);
  return {eye,fwd,right,up,f:(cam.H/2)/Math.tan(cam.fov/2)};
}
function project(cam,B,p){
  const dx=p[0]-B.eye[0], dy=p[1]-B.eye[1], dz=p[2]-B.eye[2];
  const z=dx*B.fwd[0]+dy*B.fwd[1]+dz*B.fwd[2];
  if(z<=0.05) return null;
  return { x: cam.W/2 + B.f*(dx*B.right[0]+dy*B.right[1]+dz*B.right[2])/z,
           y: cam.H/2 - B.f*(dx*B.up[0]   +dy*B.up[1]   +dz*B.up[2])/z, z };
}
/* a camera sized to a box: projected points land in the box's pixel frame */
function boxCamera(b,theta,phi,dist,target){
  const cam=makeCamera(theta,phi,dist,target); cam.W=b.w; cam.H=b.h;
  const B=camBasis(cam);
  const P=p=>{ const q=project(cam,B,p); return q?{x:b.x+q.x,y:b.y+q.y,z:q.z}:null; };
  return {cam,B,P};
}

/* ================================================================== *
 *  physics — point charges held in the plane z = 0, the 3-D Coulomb   *
 *  field and potential by exact superposition                         *
 * ================================================================== */
const DEG=PI/180;                       /* degrees INTO radians: 90*DEG = pi/2 */
/* the one measured constant: eps0, CODATA 2022, from the NIST constants
   page (physics.nist.gov/cgi-bin/cuu/Value?ep0), stored verbatim */
const EPS0=8.8541878188e-12;            /* F/m */
const K_SI=1/(4*PI*EPS0);               /* N m^2/C^2 = 8.98755e9 */
const KNC=K_SI*1e-9;                    /* V m/nC:  V[volt] = KNC q[nC] / r[m] */
const K_PHET=9;                         /* PhET's K_CONSTANT, a rounding of KNC */
/* PhET's layout and display values (ChargesAndFieldsConstants and the view
   classes of the 1.0.67 build), converted to metres at its 128 px/m: the
   play area, the charge bin, the arrow and voltage grids, the two colour
   saturations, the sensor-arrow scale (15 px per V/m), the field-arrow
   length (40 px), the charge radius (12 px), the 3-cm radius inside which
   no equipotential is seeded, and the reading above which a sensor shows a
   dash (MAX_EFIELD_MAGNITUDE) */
const PLANE={x0:-4,x1:4,y0:-2.5,y1:2.5};
const BIN={x0:-1.25,x1:1.25,y0:-2.3,y1:-1.7};
const ARROW_DX=0.5, MAP_DX=0.1;
const V_SAT=40, E_SAT=5;
const SENSOR_M_PER_VM=15/128, ARROW_LEN=40/128, CHARGE_R=12/128;
const EQ_REFUSE=0.03, E_MAX_READ=1e6;
const MAX_CHARGES=40, MAX_SENSORS=12, MAX_EQ=24;
/* the region an equipotential is followed over before it is called open —
   the plane with a 2-m margin (PhET's enlarged bounds are [-6,6]x[-2.5,7.5],
   lopsided for its screen layout) */
const EQ_BOX={x0:-6,x1:6,y0:-4.5,y1:4.5};

function potentialAt(ch,x,y){
  let s=0;
  for(let i=0;i<ch.length;i++){ const c=ch[i]; s+=c.q/Math.hypot(x-c.x,y-c.y); }
  return KNC*s;
}
/* V and E in one pass: E = k sum q (r - r_i)/|r - r_i|^3 */
function fieldAt(ch,x,y){
  let s=0, ex=0, ey=0;
  for(let i=0;i<ch.length;i++){
    const c=ch[i], dx=x-c.x, dy=y-c.y, r2=dx*dx+dy*dy, r=Math.sqrt(r2), r3=r2*r;
    s+=c.q/r; ex+=c.q*dx/r3; ey+=c.q*dy/r3;
  }
  return {V:KNC*s, ex:KNC*ex, ey:KNC*ey};
}
/* the Jacobian dE_a/dx_b = [dEx/dx, dEx/dy (= dEy/dx), dEy/dy]; symmetric
   because E = -grad V, and minus the in-plane Hessian of V */
function jacAt(ch,x,y){
  let a=0, b=0, d=0;
  for(let i=0;i<ch.length;i++){
    const c=ch[i], dx=x-c.x, dy=y-c.y, r2=dx*dx+dy*dy, r=Math.sqrt(r2), r3=r2*r, r5=r3*r2;
    a+=c.q*(1/r3-3*dx*dx/r5); b+=c.q*(-3*dx*dy/r5); d+=c.q*(1/r3-3*dy*dy/r5);
  }
  return [KNC*a,KNC*b,KNC*d];
}
function nearestCharge(ch,x,y){
  let r=Infinity, k=-1;
  for(let i=0;i<ch.length;i++){ const d=Math.hypot(x-ch[i].x,y-ch[i].y); if(d<r){ r=d; k=i; } }
  return {r,k};
}
function netCharge(ch){ let Q=0; for(const c of ch) Q+=c.q; return Q; }
/* the size of the terms being cancelled at a point, k sum |q|/r^2: the
   scale against which "E = 0" is judged */
function fieldScale(ch,x,y){
  let s=0; for(const c of ch){ const r2=(x-c.x)*(x-c.x)+(y-c.y)*(y-c.y); s+=Math.abs(c.q)/r2; }
  return KNC*s;
}
/* V with a rounding floor: a sum whose terms cancel to below 1e-12 of their
   total size is zero.  Off the exact bisector of a dipole by the 6e-17 of
   cos(90°), the plain sum read 1e-15 V and was drawn and printed as a value */
const ROUND_FLOOR=1e-12;
function potentialClean(ch,x,y){
  let s=0, sa=0;
  for(let i=0;i<ch.length;i++){ const c=ch[i], r=Math.hypot(x-c.x,y-c.y); s+=c.q/r; sa+=Math.abs(c.q)/r; }
  if(!isFinite(sa)) return KNC*s;
  return Math.abs(s)<=ROUND_FLOOR*sa?0:KNC*s;
}
function chargeKey(ch){ let s=''; for(const c of ch) s+=c.x+','+c.y+','+c.q+';'; return s; }
/* an E-field sensor's reading, PhET's way: magnitude and direction, a dash
   above 1e6 V/m (on top of a charge) */
function sensorReading(ch,x,y){
  const f=fieldAt(ch,x,y), V=potentialClean(ch,x,y);
  let m=Math.hypot(f.ex,f.ey), ex=f.ex, ey=f.ey;
  if(ch.length&&isFinite(m)&&m<=ROUND_FLOOR*fieldScale(ch,x,y)){ m=0; ex=0; ey=0; }   /* at a null: zero, not rounding */
  return {V, ex, ey, mag:m, ang:m>0?Math.atan2(ey,ex)/DEG:0, over:!(m<E_MAX_READ)};
}

/* ---- the two display grids (PhET's cell centres) ---- */
function vmapGrid(ch){
  const nx=Math.round((PLANE.x1-PLANE.x0)/MAP_DX), ny=Math.round((PLANE.y1-PLANE.y0)/MAP_DX), v=new Float64Array(nx*ny);
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++) v[j*nx+i]=potentialAt(ch,PLANE.x0+(i+0.5)*MAP_DX,PLANE.y0+(j+0.5)*MAP_DX);
  return {nx,ny,v};
}
function arrowGrid(ch){
  const nx=Math.round((PLANE.x1-PLANE.x0)/ARROW_DX), ny=Math.round((PLANE.y1-PLANE.y0)/ARROW_DX), out=[];
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const x=PLANE.x0+(i+0.5)*ARROW_DX, y=PLANE.y0+(j+0.5)*ARROW_DX, f=fieldAt(ch,x,y);
    out.push({x,y,ex:f.ex,ey:f.ey,mag:Math.hypot(f.ex,f.ey)});
  }

/* PhET's arrow opacity: |E|/5 V/m, clamped; "direction only" makes every
   arrow with a defined direction fully opaque */
function arrowAlpha(mag,dirOnly){ if(!(mag>1e-9)) return 0; return dirOnly?1:clamp(mag/E_SAT,0,1); }
/* PhET's voltage colour: linear in V to saturation at +-40 V */
function vLevel(V){ if(V!==V) return 0; return clamp(Math.abs(V)/V_SAT,0,1); }   /* NaN (coincident +q and -q) reads as zero */
/* a value safe to contour: +-infinity (a sample exactly on a charge) becomes
   a large finite number of the same sign, NaN (coincident +q and -q) zero */
function vSafe(V){ return V===V?clamp(V,-1e6,1e6):0; }

/* ================================================================== *
 *  equipotentials — RK4 along the tangent z x E/|E|, then Newton back  *
 *  onto V = V0 along E after every step                               *
 * ================================================================== */
/* the local length scale: the distance to the nearest charge, or |E|/|grad E|
   (the distance over which E changes by itself), whichever is smaller */
function lengthScale(ch,x,y){
  const nc=nearestCharge(ch,x,y), f=fieldAt(ch,x,y), j=jacAt(ch,x,y);
  const e=Math.hypot(f.ex,f.ey), jn=Math.sqrt(j[0]*j[0]+2*j[1]*j[1]+j[2]*j[2]);
  return Math.min(nc.r,jn>0?e/jn:Infinity);
}
function tangentAt(ch,x,y){ const f=fieldAt(ch,x,y), m=Math.hypot(f.ex,f.ey); return m>0?[-f.ey/m,f.ex/m]:null; }
function rk4Dir(dirFn,ch,x,y,h){
  const k1=dirFn(ch,x,y); if(!k1) return null;
  const k2=dirFn(ch,x+0.5*h*k1[0],y+0.5*h*k1[1]); if(!k2) return null;
  const k3=dirFn(ch,x+0.5*h*k2[0],y+0.5*h*k2[1]); if(!k3) return null;
  const k4=dirFn(ch,x+h*k3[0],y+h*k3[1]); if(!k4) return null;
  return [x+h*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6, y+h*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6];

/* Trace the equipotential through (x0, y0).  Refuses on an empty plane,

  opt=opt||{};

  const bw=run(-1);

/* ================================================================== *
 *  field lines — RK4 on E/|E|, from the charges of the majority sign  *
 * ================================================================== */
/* R_ESC is far: the lines of a NEUTRAL configuration all come back, some only after

/* the seeding: N lines per charge of the majority sign (the positive ones

  const Q=netCharge(ch), sgn=Q<0?-1:1, cen=moments(ch).c, lines=[];

      const a=(k+0.5)*TAU/nPer, L=traceFieldLine(ch,cc.x+R_SEED*Math.cos(a),cc.y+R_SEED*Math.sin(a),sgn,Object.assign({cen},opt));

/* ================================================================== *
 *  null points — Newton on E = 0 with the analytic Jacobian           *
 * ================================================================== */
function newtonNull(ch,x,y,bx){

    if(!(Math.abs(det)>0)) return null;
    let dx=-( j[2]*f.ex-j[1]*f.ey)/det, dy=-(-j[1]*f.ex+j[0]*f.ey)/det;
    const st=Math.hypot(dx,dy); if(st>0.25){ dx*=0.25/st; dy*=0.25/st; }

/* ================================================================== *

 * ================================================================== */

  const Q=netCharge(ch); let cx=0, cy=0, sa=0;

  else { for(const c of ch){ cx+=c.x; cy+=c.y; } cx/=n; cy/=n; }

    dmax=Math.max(dmax,Math.sqrt(d2)); sa+=Math.abs(c.q); }

/* ================================================================== *
 *  the tape: V(A) - V(B), and the line integral of E that equals it    *
 * ================================================================== */
/* Gauss-Legendre nodes and weights by Newton on P_n (never typed) */
function gaussLegendre(n){
  const x=[], w=[];

    let z=Math.cos(PI*(i-0.25)/(n+0.5)), dp=0;
    for(let it=0;it<100;it++){

/* ================================================================== *
 *  superposition — each charge's term at a point                      *
 * ================================================================== */

/* ================================================================== *

const LAND_NX=64, LAND_NY=40, LAND_HZ=1.25;      /* 65 x 41 vertices; LAND_HZ metres of height at the clip */

/* ================================================================== *
 *  marching squares — contours of a sampled scalar                     *
 *  (the house implementation from dipole_radiation.html, unchanged)   *
 * ================================================================== */
function marchingSquares(grid, nx, ny, x0, z0, cs, level){
  const segs=[];

    return [pa[0]+(pb[0]-pa[0])*f, pa[1]+(pb[1]-pa[1])*f]; };
  for (let j=0;j<ny-1;j++){
    for (let i=0;i<nx-1;i++){
      const v00=grid[j*nx+i],   v10=grid[j*nx+i+1],
            v01=grid[(j+1)*nx+i], v11=grid[(j+1)*nx+i+1];
      let code=0;
      if (v00>level) code|=1;
      if (v10>level) code|=2;
      if (v11>level) code|=4;
      if (v01>level) code|=8;
      if (code===0||code===15) continue;

        case 8:  put(eT(),eL()); break;
        case 9:  put(eT(),eB()); break;
        case 10:{ const mid=(v00+v10+v01+v11)/4;

                 else { put(eT(),eL()); put(eB(),eR()); } break; }
        case 11: put(eT(),eR()); break;

  const levels=[0]; for(let k=1;k*dV<=V_SAT+1e-9;k++){ levels.push(k*dV,-k*dV); }
  const out=[];
  for(const L of levels){ const s=marchingSquares(g2,nx,ny,PLANE.x0,PLANE.y0,FAM_DX,L); if(s.length) out.push({V:L,segs:s}); }
  return out;
}

/* ================================================================== *
 *  state, presets, the per-view model, readout, eqbar, tag            *
 * ================================================================== */
const TABS=[['plane','the plane'],['lines','field lines'],['land','the landscape'],['super','superposition'],['far','the far field']];
const COL={pos:'#b8ec4c', neg:'#cd35c4', ref:'#e8843a', struct:'#5ac8e0', live:'#f2f4f8', dim:'#8b93a6',
           edge:'#242a3a', plane:'#0b1020', bin:'#10131b', binEdge:'#3a4152', arrow:'#e9ecf2',
           grid:'#141b2a', gridMaj:'#1f2940', zero:'#1a2233'};
const RO_W=300;
const S3=Math.sqrt(3);
function qCol(q){ return q>0?COL.pos:COL.neg; }
/* the presets (PhET opens on an empty plane; the default here is the dipole
   so the first view has something to show — "empty" gives PhET's start) */
const PRESETS=[
  {id:'empty',name:'empty',ch:[]},
  {id:'single',name:'one charge',ch:[{x:0,y:0,q:1}]},
  {id:'dipole',name:'dipole',ch:[{x:-0.5,y:0,q:-1},{x:0.5,y:0,q:1}]},
  {id:'like',name:'like pair',ch:[{x:-0.5,y:0,q:1},{x:0.5,y:0,q:1}]},
  {id:'quad',name:'quadrupole',ch:[{x:0.5,y:0.5,q:1},{x:-0.5,y:0.5,q:-1},{x:-0.5,y:-0.5,q:1},{x:0.5,y:-0.5,q:-1}]},
  {id:'triangle',name:'triangle',ch:[{x:0,y:0.75,q:1},{x:-0.75*S3/2,y:-0.375,q:1},{x:0.75*S3/2,y:-0.375,q:1}]},
  {id:'rows',name:'two rows',ch:[-1.5,-1,-0.5,0,0.5,1,1.5].map(x=>({x,y:1,q:1})).concat([-1.5,-1,-0.5,0,0.5,1,1.5].map(x=>({x,y:-1,q:-1})))},
];
function presetCharges(id){ const p=PRESETS.find(o=>o.id===id); return p?p.ch.map(c=>({x:c.x,y:c.y,q:c.q})):[]; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const DEFAULTS={view:'plane', preset:'dipole', charges:presetCharges('dipole'),
  /* PhET's check boxes and their defaults: field on, the rest off */
  showE:true, dirOnly:false, showV:false, showVals:false, showGrid:false,
  /* the tools: the voltage sensor out with one equipotential plotted, one
     E-field sensor on the plane, the tape in its box */
  showVS:true, showTape:false, vs:{x:1.5,y:0.9}, esens:[{x:-1.8,y:1.2}], tape:{ax:-2.8,ay:1.9,bx:-0.8,by:1.9},
  eqSeeds:[{x:1.5,y:0.9}],
  nLines:16, famDV:4, showFam:true, showNulls:true,
  /* the landscape's clip: 20 V, half of PhET's colour saturation, so a dipole's
     relief shows at the first look (at 40 V it was two thin spikes) */
  vcap:20, camTheta:-1.05, camPhi:0.62, camZoom:1, landEq:true,
  probe:{x:0.6,y:0.9}, farTheta:30};
const ST=clone(DEFAULTS);
function resetState(over){ Object.assign(ST,clone(DEFAULTS),over?clone(over):{}); for(const k in MEMO) delete MEMO[k]; }
const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- edits to the charges (every one clears the plotted equipotentials,
   as PhET's do: a line belongs to the charges it was traced in) ---- */
function applyPreset(st,id){ st.preset=id; st.charges=presetCharges(id); st.eqSeeds=[]; }
function addCharge(st,x,y,q){ if(st.charges.length>=MAX_CHARGES) return -1; st.charges.push({x,y,q}); st.preset='custom'; st.eqSeeds=[]; return st.charges.length-1; }
function moveCharge(st,k,x,y){ const c=st.charges[k]; if(!c) return false; c.x=clamp(x,PLANE.x0,PLANE.x1); c.y=clamp(y,PLANE.y0,PLANE.y1); st.preset='custom'; st.eqSeeds=[]; return true; }
function removeCharge(st,k){ if(k<0||k>=st.charges.length) return false; st.charges.splice(k,1); st.preset='custom'; st.eqSeeds=[]; return true; }
function inBin(x,y){ return x>=BIN.x0&&x<=BIN.x1&&y>=BIN.y0&&y<=BIN.y1; }
/* the voltage sensor's "plot" button: refused on an empty plane, within 3 cm
   of a charge and at a null (the tracer says why) */
function plotEquipotential(st){
  if(!st.showVS) return {ok:false,why:'the voltage sensor is in its box'};
  const t=traceEquipotential(st.charges,st.vs.x,st.vs.y);
  if(!t.ok) return t;
  if(st.eqSeeds.length>=MAX_EQ) st.eqSeeds.shift();
  st.eqSeeds.push({x:st.vs.x,y:st.vs.y});
  return t;
}

function buildModel(){
  const st=ST, ch=st.charges, key=chargeKey(ch), view=st.view;
  let npos=0, nneg=0; for(const c of ch){ if(c.q>0) npos++; else nneg++; }
  const M={view,st,ch,key,Q:netCharge(ch),n:ch.length,npos,nneg};
  M.vsR=st.showVS?sensorReading(ch,st.vs.x,st.vs.y):null;
  M.esR=st.esens.map(s=>sensorReading(ch,s.x,s.y));
  M.tape=st.showTape?tapeModel(ch,st.tape):null;
  M.eq=memo('eq',key+'|'+JSON.stringify(st.eqSeeds),()=>st.eqSeeds.map(s=>traceEquipotential(ch,s.x,s.y)));
  if(view==='plane'){
    M.vmap=st.showV?memo('vmap',key,()=>vmapGrid(ch)):null;
    M.arrows=st.showE?memo('arrows',key,()=>arrowGrid(ch)):null;
  }
  if(view==='lines'){
    M.FL=memo('fl',key+'|'+st.nLines,()=>fieldLines(ch,st.nLines));
    M.fam=st.showFam?memo('fam',key+'|'+st.famDV,()=>equipotentialFamily(ch,st.famDV)):null;
    M.nulls=memo('nulls',key,()=>findNulls(ch));
  }
  if(view==='land') M.land=memo('land',key+'|'+st.vcap,()=>landGrid(ch,st.vcap));
  if(view==='super'){ M.contrib=contributions(ch,st.probe.x,st.probe.y); M.probe=sensorReading(ch,st.probe.x,st.probe.y); }
  if(view==='far') M.far=memo('far',key+'|'+st.farTheta,()=>farField(ch,st.farTheta));
  return M;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function fV(v){ return isFinite(v)?sigf(v,3)+' V':'&mdash; (on a charge)'; }
function fE(m){ return isFinite(m)?sigf(m,3)+' V/m':'&mdash;'; }
function fQ(q){ return (q>0?'+':q<0?'&minus;':'')+fmt(Math.abs(q),0)+' nC'; }
function fXY(x,y){ return '('+fmt(x,2)+', '+fmt(y,2)+') m'; }
function sensorText(R){ return R.over?'&mdash; (on a charge)':R.mag>0?fE(R.mag)+' at '+fmt(R.ang,1)+'&deg;':'0 V/m, no direction'; }
function chargesRows(M){
  return hd('the charges')+rrow('on the plane',M.n+(M.n?' ('+M.npos+' positive, '+M.nneg+' negative)':''))
    +rrow('net charge Q',fQ(M.Q),M.Q===0&&M.n?'good':'');
}
function readoutHTML(M){
  const st=ST;
  let s='<div class="rname">charges and fields<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  s+=chargesRows(M);
  if(M.view==='plane'){
    s+=hd('the voltage sensor');
    s+=M.vsR?rrow('at '+fXY(st.vs.x,st.vs.y),fV(M.vsR.V),'good'):rrow('in its box','&mdash;');
    s+=hd('E-field sensors');
    if(!M.esR.length) s+=rrow('none on the plane','drag one from the bin');
    M.esR.slice(0,4).forEach((R,i)=>{ s+=rrow('#'+(i+1)+' '+fXY(st.esens[i].x,st.esens[i].y),sensorText(R)); });
    if(M.esR.length>4) s+=rrow('and '+(M.esR.length-4)+' more','');
    if(M.tape) s+=hd('the tape')+rrow('length',fmt(M.tape.cm,1)+' cm')+rrow('V(A) &minus; V(B)',fV(M.tape.dV));
    s+=hd('equipotentials');
    s+=M.eq.length?rrow(M.eq.length+' plotted',M.eq.slice(-4).map(e=>e.ok?sigf(e.V0c,3)+' V':'&mdash;').join(', ')):rrow('none plotted','press plot on the sensor');
  }
  else if(M.view==='lines'){
    const F=M.FL;
    s+=hd('field lines');
    if(!M.n) s+=rrow('no charges','nothing to trace');
    else { s+=rrow('traced from the',F.sgn>0?'positive charges':'negative charges')+rrow('lines',F.lines.length)
        +rrow('end on a charge',F.ends,'good')+rrow('run off past 10 km',F.escapes)+rrow('end at a null',F.nulls,F.nulls?'bad':''); }
    s+=hd('null points, E = 0');
    if(!M.nulls.length) s+=rrow('none on the plane','&mdash;');
    M.nulls.slice(0,5).forEach(N=>{ s+=rrow(fXY(N.x,N.y),(N.kind==='saddle'?'saddle':N.kind==='min'?'in-plane minimum':'in-plane maximum')+', '+fV(N.V)); });
    if(M.nulls.length>5) s+=rrow('and '+(M.nulls.length-5)+' more','');
    if(st.showFam) s+=hd('equipotentials')+rrow('every',fmt(st.famDV,0)+' V to &plusmn;'+V_SAT+' V');
  }
  else if(M.view==='land'){
    const Ld=M.land;
    s+=hd('the surface')+rrow('height',fmt(LAND_HZ,2)+' m = '+fmt(st.vcap,0)+' V')+rrow('clipped at','&plusmn;'+fmt(st.vcap,0)+' V')
      +rrow('vertices clipped',Ld.clipped+' of '+((Ld.nx+1)*(Ld.ny+1)),Ld.clipped?'bad':'');
    s+=hd('camera')+rrow('azimuth, elevation',fmt(st.camTheta/DEG,0)+'&deg;, '+fmt(st.camPhi/DEG,0)+'&deg;')+rrow('zoom',fmt(st.camZoom,2)+'&times;');
    if(M.eq.length) s+=hd('level cuts')+rrow(M.eq.length+' plotted equipotentials',M.eq.slice(-4).map(e=>e.ok?sigf(e.V0c,3)+' V':'&mdash;').join(', '));
  }
  else if(M.view==='super'){
    const P=M.probe, C=M.contrib;
    let sv=0, sx=0, sy=0; for(const c of C){ sv+=c.V; sx+=c.ex; sy+=c.ey; }
    s+=hd('the probe at '+fXY(st.probe.x,st.probe.y))+rrow('V = &Sigma; V<sub>i</sub>',fV(P.V),'good')+rrow('|E|, direction',sensorText(P),'good');
    if(C.length){ s+=rrow('|&Sigma;E<sub>i</sub> &minus; E|',sigf(Math.hypot(sx-P.ex,sy-P.ey),2)+' V/m');
      s+=hd('each charge (first '+Math.min(C.length,6)+')');
      C.slice(0,6).forEach(c=>{ s+=rrow('#'+(c.i+1)+' '+fQ(c.q)+', r = '+fmt(c.r,2)+' m',(isFinite(c.V)?sigf(c.V,3):'&mdash;')+' V, '+fE(Math.hypot(c.ex,c.ey))); }); }
  }
  else {
    const F=M.far, Mo=F.M;
    s+=hd('the moments about '+fXY(Mo.c[0],Mo.c[1]))+rrow('Q',fQ(Mo.Q))+rrow('p = &Sigma; q d',sigf(Math.hypot(Mo.p[0],Mo.p[1]),3)+' nC&middot;m')
      +rrow('Q<sub>xx</sub>, Q<sub>xy</sub>, Q<sub>yy</sub>',sigf(Mo.Qxx,3)+', '+sigf(Mo.Qxy,3)+', '+sigf(Mo.Qyy,3)+' nC&middot;m&sup2;')
      +rrow('farthest charge, d<sub>max</sub>',fmt(Mo.dmax,3)+' m');
    s+=hd('along the ray at '+fmt(F.th,0)+'&deg;');
    for(let l=0;l<4;l++) s+=rrow('c<sub>'+l+'</sub> ('+ORDER_NAME[l]+')',M.n?sigf(F.cs[l],4)+' V&middot;m'+(l?'<sup>'+(l+1)+'</sup>':''):'&mdash;',F.l0===l?'good':'');
    if(F.l0!==null) s+=rrow('leading order',ORDER_NAME[F.l0]+', V &prop; 1/r'+(F.l0?'<sup>'+(F.l0+1)+'</sup>':''))
      +rrow('lim r<sup>'+(F.l0+1)+'</sup>V, numerically',sigf(F.lim,6),'good')+rrow('c<sub>'+F.l0+'</sub>, exact',sigf(F.cs[F.l0],6));
    else s+=rrow('leading order',M.n?'none: V = 0 along this ray':'no charges','bad');
  }
  s+='</table><div class="note">k = 1/4&pi;&epsilon;<sub>0</sub> = '+sigf(KNC,6)+' V&middot;m/nC from the CODATA 2022 &epsilon;<sub>0</sub>; PhET uses 9, so its readings run 0.14 % higher. Everything else is exact superposition, pinned in selfTest to build/charges-and-fields/derive.py.</div>';
  return s;
}

function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='plane') return E('<span class="hl">V(r) = k &Sigma; q<sub>i</sub> / |r &minus; r<sub>i</sub>|</span> &nbsp;&middot;&nbsp; <span class="hl">E = &minus;&nabla;V = k &Sigma; q<sub>i</sub> (r &minus; r<sub>i</sub>) / |r &minus; r<sub>i</sub>|&sup3;</span> &nbsp;&middot;&nbsp; k = 1/4&pi;&epsilon;<sub>0</sub> = 8.988 V&middot;m/nC',
    'each charge adds a 1/r potential and a 1/r&sup2; field; the voltage map, the arrows and every sensor are these two sums, evaluated exactly');
  if(M.view==='lines') return E('<span class="hl">dr/ds = E/|E|</span> <span class="rm">(a field line)</span> &nbsp;&middot;&nbsp; V(r) = V<sub>0</sub> <span class="rm">(an equipotential)</span> &nbsp;&rArr;&nbsp; <span class="hl2">t&#770;<sub>V</sub> &middot; E = 0</span>',
    'lines follow E and cross every equipotential at a right angle; equally spaced equipotentials crowd where the field is strong');
  if(M.view==='land') return E('<span class="hl">E = &minus;&nabla;V</span> &nbsp;&middot;&nbsp; |E| = <span class="rm">the steepest slope of</span> V(x, y) &nbsp;&middot;&nbsp; V = V<sub>0</sub> <span class="rm">is a level cut</span>',
    'the field points straight downhill on the potential landscape, and is as strong as the slope is steep');
  if(M.view==='super') return E('<span class="hl">E(P) = &Sigma;<sub>i</sub> E<sub>i</sub>(P)</span> &nbsp;&middot;&nbsp; <span class="hl2">V(P) = &Sigma;<sub>i</sub> V<sub>i</sub>(P)</span> &nbsp;&middot;&nbsp; E<sub>i</sub> = k q<sub>i</sub> (P &minus; r<sub>i</sub>)/|P &minus; r<sub>i</sub>|&sup3;',
    'fields add as vectors, head to tail; potentials add as signed numbers');
  return E('<span class="hl">V(c + r n&#770;) = &Sigma;<sub>&ell;</sub> c<sub>&ell;</sub> / r<sup>&ell;+1</sup></span>, &nbsp; c<sub>&ell;</sub> = k &Sigma; q<sub>i</sub> d<sub>i</sub><sup>&ell;</sup> P<sub>&ell;</sub>(cos &gamma;<sub>i</sub>) &nbsp;&middot;&nbsp; c<sub>0</sub> = kQ, &nbsp;c<sub>1</sub> = k p&middot;n&#770;, &nbsp;c<sub>2</sub> = &frac12;k n&#770;&middot;Q&middot;n&#770;',
    'far away only the lowest non-vanishing moment survives: a net charge falls as 1/r, a neutral pair as 1/r&sup2;, a square of four as 1/r&sup3;');
}
function tagHTML(M){
  const st=ST, pn=(PRESETS.find(p=>p.id===st.preset)||{name:'your charges'}).name;
  if(M.view==='plane') return '<b>the plane</b> — '+pn+(M.n?', '+M.n+' charge'+(M.n>1?'s':''):'');
  if(M.view==='lines') return '<b>field lines</b> — '+pn+', '+st.nLines+' per charge';
  if(M.view==='land') return '<b>the landscape</b> — '+pn+', clipped at &plusmn;'+fmt(st.vcap,0)+' V';
  if(M.view==='super') return '<b>superposition</b> — '+pn+', the probe at '+fXY(st.probe.x,st.probe.y);
  return '<b>the far field</b> — '+pn+', the ray at '+fmt(st.farTheta,0)+'&deg;';
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — verbatim from build_buoy/p4_views.js (build_cycloid lineage)     *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the plane's geometry, shared by the plane, field-lines and          *
 *  superposition views: 8 m x 5 m at EQUAL aspect (a configuration of  *
 *  charges is a shape), left of the readout, under a measured caption  *
 * ================================================================== */
function planeGeo(ctx,W,H,capFull,capShort){
  const narrow=isNarrow(W), left=16, right=narrow?W-16:W-RO_W-40, top=stageTop();
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const aw=right-left, ah=Math.max(60,fit.capY-14-top);
  const s=Math.min(aw/(PLANE.x1-PLANE.x0),ah/(PLANE.y1-PLANE.y0));
  const w=s*(PLANE.x1-PLANE.x0), hh=s*(PLANE.y1-PLANE.y0);
  const b=box(left+(aw-w)/2,top+(ah-hh)/2,w,hh);
  const map=worldFitUp(b,{xmin:PLANE.x0,xmax:PLANE.x1,ymin:PLANE.y0,ymax:PLANE.y1},0);
  return {b,map,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,left};
}
function chargePx(map){ return Math.max(6,CHARGE_R*map.s); }
/* lab() on a translucent pad: a value printed over arrows, lines or the voltage
   map stays legible (white on white was unreadable over "direction only") */
function labPad(ctx,W,H,x,y,txt,col,font,align,base){
  const f=font||LAB_FONT; ctx.font=f;
  const al=align||'left', bl=base||'middle', t=plain(txt), fs=parseFloat(f.match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  const wp=Math.max(w,ctx.measureText(t).width);
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X), ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(!labFits(bx)) continue;
    LABELS.push(bx);
    const px=al==='center'?X-wp/2:(al==='right'?X-wp:X);
    ctx.fillStyle='rgba(7,11,24,0.8)'; ctx.fillRect(px-3,ly-1,wp+6,hh+2);
    ctx.fillStyle=col||'#aeb6c6'; ctx.textAlign=al; ctx.textBaseline=bl; ctx.fillText(t,X,Y);
    return true;
  }
  return false;
}
function inBox(bx,x,y){ return x>=bx.x&&x<=bx.x1&&y>=bx.y&&y<=bx.y1; }
/* a charge: the disc in its sign's colour with the sign drawn as strokes */
function chargeGlyph(ctx,X,Y,r,q){
  ctx.beginPath(); ctx.arc(X,Y,r,0,TAU); ctx.fillStyle=qCol(q); ctx.fill();
  ctx.strokeStyle=shade(qCol(q),0.5); ctx.lineWidth=1; ctx.stroke();
  const a=r*0.55; ctx.strokeStyle='#0b1020'; ctx.lineWidth=Math.max(1.4,r*0.2);
  ctx.beginPath(); ctx.moveTo(X-a,Y); ctx.lineTo(X+a,Y); if(q>0){ ctx.moveTo(X,Y-a); ctx.lineTo(X,Y+a); } ctx.stroke();
}
function drawCharges(ctx,map,ch){ const r=chargePx(map); for(const c of ch) chargeGlyph(ctx,map.X(c.x),map.Y(c.y),r,c.q); }
/* an E-field sensor: PhET's 7-px ring */
function eSensorGlyph(ctx,X,Y){
  ctx.beginPath(); ctx.arc(X,Y,7,0,TAU); ctx.fillStyle='#0b1020'; ctx.fill(); ctx.strokeStyle=COL.live; ctx.lineWidth=1.6; ctx.stroke();
  ctx.beginPath(); ctx.arc(X,Y,2,0,TAU); ctx.fillStyle=COL.live; ctx.fill();
}
/* PhET's field-arrow proportions (ElectricFieldArrowShape): the whole arrow is
   L long and turns about a point 40 % from the tail; head L/4 long and L/2.5
   wide, tail L/5 wide */
function blockArrow(ctx,X,Y,ux,uy,L,col){
  const t0=-0.4*L, t1=0.6*L, hh=0.25*L, hw=0.2*L, tw=0.1*L, vx=-uy, vy=ux;
  const P=(s,w)=>[X+ux*s+vx*w,Y+uy*s+vy*w];
  const pts=[P(t0,tw),P(t1-hh,tw),P(t1-hh,hw),P(t1,0),P(t1-hh,-hw),P(t1-hh,-tw),P(t0,-tw)];
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let k=1;k<pts.length;k++) ctx.lineTo(pts[k][0],pts[k][1]); ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
}
/* a line arrow in pixels; a double head marks one capped at its drawn maximum */
function arrowPx(ctx,X0,Y0,X1,Y1,col,lw,capped){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  for(const back of (capped?[0,6]:[0])){ const Xh=X1-back*ux, Yh=Y1-back*uy;
    ctx.moveTo(Xh,Yh); ctx.lineTo(Xh-hh*ux+0.5*hh*uy,Yh-hh*uy-0.5*hh*ux);
    ctx.moveTo(Xh,Yh); ctx.lineTo(Xh-hh*ux-0.5*hh*uy,Yh-hh*uy+0.5*hh*ux); }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* a world-space arrow clipped to the plane: the shaft by Liang-Barsky in data
   space (the recorder cannot see a canvas clip), the head only if the tip is on
   the plane */
function clipSeg(x0,y0,x1,y1,bx){
  let t0=0,t1=1; const dx=x1-x0, dy=y1-y0;
  for(const [p,q] of [[-dx,x0-bx.x0],[dx,bx.x1-x0],[-dy,y0-bx.y0],[dy,bx.y1-y0]]){
    if(p===0){ if(q<0) return null; continue; }
    const t=q/p; if(p<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; }
  }
  return [x0+t0*dx,y0+t0*dy,x0+t1*dx,y0+t1*dy,t1];
}
function arrowWorldClip(ctx,map,a,v,col,lw,bx){
  const c=clipSeg(a[0],a[1],a[0]+v[0],a[1]+v[1],bx||PLANE); if(!c) return false;
  if(c[4]>=1) arrowPx(ctx,map.X(c[0]),map.Y(c[1]),map.X(c[2]),map.Y(c[3]),col,lw);
  else { ctx.beginPath(); ctx.moveTo(map.X(c[0]),map.Y(c[1])); ctx.lineTo(map.X(c[2]),map.Y(c[3])); ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke(); }
  return true;
}

/* ---- the plane's layers ---- */
const VQ=32;      /* colour levels per sign for the voltage cells (PhET's colour is continuous) */
function vCellColour(V){ const lv=Math.round(vLevel(V)*VQ); return lv===0?null:shade(V>0?COL.pos:COL.neg,lv/VQ); }
function drawVmap(ctx,map,G){
  const cw=MAP_DX*map.s, buckets={};
  for(let j=0;j<G.ny;j++) for(let i=0;i<G.nx;i++){
    const V=G.v[j*G.nx+i], lv=Math.round(vLevel(V)*VQ); if(lv===0) continue;
    const k=(V>0?1:-1)*lv; (buckets[k]=buckets[k]||[]).push(i,j);
  }
  /* opaque, pre-mixed against the background, each cell widened by half a pixel:
     abutting cells then leave no antialiased seam (Known-bad: seams / corduroy) */
  for(const k in buckets){
    const kk=+k, a=buckets[k];
    ctx.beginPath();
    for(let n=0;n<a.length;n+=2){ const x=PLANE.x0+a[n]*MAP_DX, y=PLANE.y0+(a[n+1]+1)*MAP_DX; ctx.rect(map.X(x)-0.25,map.Y(y)-0.25,cw+0.5,cw+0.5); }
    ctx.fillStyle=shade(kk>0?COL.pos:COL.neg,Math.abs(kk)/VQ); ctx.fill();
  }
}
/* PhET's grid: minor lines every 0.1 m, major every 0.5 m, translucent so that
   over the voltage map they read as lines and not as a mosaic of dark tiles */
function drawGrid(ctx,map,b){
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.055)'; ctx.beginPath();
  for(let i=1;i<80;i++){ if(i%5===0) continue; const X=Math.round(map.X(PLANE.x0+i*0.1))+0.5; ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); }
  for(let j=1;j<50;j++){ if(j%5===0) continue; const Y=Math.round(map.Y(PLANE.y0+j*0.1))+0.5; ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.13)'; ctx.lineWidth=1.6; ctx.beginPath();
  for(let i=1;i<16;i++){ const X=map.X(PLANE.x0+i*0.5); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); }
  for(let j=1;j<10;j++){ const Y=map.Y(PLANE.y0+j*0.5); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); }
  ctx.stroke();
}
function drawArrows(ctx,map,G,dirOnly){
  const L=ARROW_LEN*map.s;
  for(const a of G.a){
    const al=arrowAlpha(a.mag,dirOnly);
    if(!(al>0.004)||!isFinite(a.mag)) continue;
    ctx.globalAlpha=al; blockArrow(ctx,map.X(a.x),map.Y(a.y),a.ex/a.mag,-a.ey/a.mag,L,COL.arrow);
  }
  ctx.globalAlpha=1;
}
/* the plotted equipotentials, clipped to the plane in data space */
function drawEqLines(ctx,W,H,G,M,vals){
  M.eq.forEach(E=>{ if(!E.ok) return;
    const xs=E.pts.map(p=>p[0]), ys=E.pts.map(p=>p[1]); if(E.closed){ xs.push(E.pts[0][0]); ys.push(E.pts[0][1]); }
    polyline(ctx,G.b,xs,ys,PLANE.x0,PLANE.x1,PLANE.y0,PLANE.y1,COL.struct,1.6);
    if(vals) labPad(ctx,W,H,G.map.X(E.x0)+7,G.map.Y(E.y0)-10,sigf(E.V0c,3)+' V',COL.struct,SM_FONT,'left'); });
}
/* the bin: PhET's enclosure, with its three sources */
const BIN_SRC=[{kind:'pos',x:-0.75,label:'+1 nC'},{kind:'neg',x:0,label:'−1 nC'},{kind:'es',x:0.75,label:'sensors'}];
const BIN_GLYPH_Y=-1.93, BIN_LABEL_Y=-2.2;
function drawBin(ctx,W,H,map,M){
  const X0=map.X(BIN.x0), X1=map.X(BIN.x1), Y0=map.Y(BIN.y1), Y1=map.Y(BIN.y0);
  ctx.fillStyle=COL.bin; ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle=COL.binEdge; ctx.lineWidth=1; ctx.strokeRect(X0+0.5,Y0+0.5,X1-X0-1,Y1-Y0-1);
  for(const s of BIN_SRC){
    const X=map.X(s.x), Y=map.Y(BIN_GLYPH_Y), full=s.kind==='es'?M.st.esens.length>=MAX_SENSORS:M.n>=MAX_CHARGES;
    ctx.globalAlpha=full?0.35:1;
    if(s.kind==='es') eSensorGlyph(ctx,X,Y); else chargeGlyph(ctx,X,Y,chargePx(map),s.kind==='pos'?1:-1);
    ctx.globalAlpha=1;
    lab(ctx,W,H,X,map.Y(BIN_LABEL_Y),s.label,COL.dim,SM_FONT,'center');
  }
}
/* an E-field sensor: the ring, its reading as an arrow at 15 px per V/m at
   128 px/m (PhET's scale, i.e. 0.117 m per V/m), capped at 2 m with a double
   head, and with "values" on, |E| and its direction above it */
const ES_CAP_M=2;
function drawESensor(ctx,W,H,map,s,R,vals){
  const X=map.X(s.x), Y=map.Y(s.y);
  if(!R.over&&R.mag>0){
    const Lm=R.mag*SENSOR_M_PER_VM, capped=Lm>ES_CAP_M, L=Math.min(Lm,ES_CAP_M)*map.s;
    arrowPx(ctx,X,Y,X+L*R.ex/R.mag,Y-L*R.ey/R.mag,COL.live,2.2,capped);
  }
  eSensorGlyph(ctx,X,Y);
  if(vals){
    labPad(ctx,W,H,X,Y-25,R.over?'—':sigf(R.mag,3)+' V/m',COL.live,SM_FONT,'center');
    labPad(ctx,W,H,X,Y-12,R.over?'—':(R.mag>0?fmt(R.ang,1)+'°':'no direction'),COL.live,SM_FONT,'center');
  }
}
/* the voltage sensor: crosshair ring, and below it a panel with the reading
   and PhET's two buttons (plot an equipotential, clear them) */
function vsGeo(map,st,W,H){
  /* the panel hangs below the crosshair, and flips above it rather than leave
     the plane (it ran over the caption at the plane's bottom edge) */
  const X=map.X(st.vs.x), Y=map.Y(st.vs.y), r=Math.max(9,0.09*map.s), pw=132, ph=50;
  let py=Y+r+8; if(py+ph>Math.min(H-4,map.Y(PLANE.y0))) py=Y-r-8-ph;
  const px=clamp(X-pw/2,4,W-pw-4), bw=56, bh=18, by=py+ph-bh-6;
  return {X,Y,r,panel:box(px,py,pw,ph),plot:box(px+6,by,bw,bh),clear:box(px+pw-6-bw,by,bw,bh)};
}
function canvasButton(ctx,W,H,b,txt){
  ctx.fillStyle='#10131b'; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=1; ctx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
  lab(ctx,W,H,b.x+b.w/2,b.y+b.h/2,txt,'#cfd4de',SM_FONT,'center');
}
function drawVSensor(ctx,W,H,map,st,R){
  const g=vsGeo(map,st,W,H);
  ctx.beginPath(); ctx.arc(g.X,g.Y,g.r,0,TAU); ctx.strokeStyle=COL.live; ctx.lineWidth=1.8; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.X-g.r-5,g.Y); ctx.lineTo(g.X+g.r+5,g.Y); ctx.moveTo(g.X,g.Y-g.r-5); ctx.lineTo(g.X,g.Y+g.r+5);
  ctx.lineWidth=1; ctx.stroke();
  const P=g.panel;
  ctx.beginPath(); ctx.moveTo(g.X,P.y>g.Y?g.Y+g.r:g.Y-g.r); ctx.lineTo(clamp(g.X,P.x+6,P.x1-6),P.y>g.Y?P.y:P.y1); ctx.strokeStyle=rgba(COL.live,0.5); ctx.stroke();
  ctx.fillStyle='rgba(10,12,18,0.94)'; ctx.fillRect(P.x,P.y,P.w,P.h);
  ctx.strokeStyle='#3a4152'; ctx.strokeRect(P.x+0.5,P.y+0.5,P.w-1,P.h-1);
  lab(ctx,W,H,P.x+P.w/2,P.y+12,R?(isFinite(R.V)?sigf(R.V,3)+' V':'— (on a charge)'):'—','#ffffff','12px -apple-system, sans-serif','center');
  canvasButton(ctx,W,H,g.plot,'plot'); canvasButton(ctx,W,H,g.clear,'clear');
}
/* the tape: two ends, the length in centimetres (PhET's unit) */
function drawTape(ctx,W,H,map,t,T){
  const A=[map.X(t.ax),map.Y(t.ay)], B=[map.X(t.bx),map.Y(t.by)], L=Math.hypot(B[0]-A[0],B[1]-A[1]);
  ctx.strokeStyle=COL.struct; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  if(L>1){ const ux=(B[0]-A[0])/L, uy=(B[1]-A[1])/L, n=Math.floor(T.L/0.1);
    ctx.lineWidth=1; ctx.beginPath();
    for(let k=1;k<=n;k++){ const d=k*0.1*map.s, big=k%5===0?6:3.5; ctx.moveTo(A[0]+ux*d-uy*big,A[1]+uy*d+ux*big); ctx.lineTo(A[0]+ux*d,A[1]+uy*d); }
    ctx.stroke();
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, off=uy>0?1:-1;
    lab(ctx,W,H,mx+uy*14*off,my-ux*14*off,fmt(T.cm,1)+' cm',COL.struct,LAB_FONT,'center'); }
  for(const [P,nm] of [[A,'A'],[B,'B']]){ dot(ctx,P[0],P[1],5,'#0b1020',COL.struct,1.6); lab(ctx,W,H,P[0]+8,P[1]-9,nm,COL.struct,SM_FONT); }
}
/* PhET's "1 meter" scale, at (2, -2.2) m, shown with the grid and values */
function drawMeter(ctx,W,H,map){
  const Y=map.Y(-2.2), X0=map.X(2), X1=map.X(3);
  arrowPx(ctx,X0,Y,X1,Y,COL.live,1.4); arrowPx(ctx,X1,Y,X0,Y,COL.live,1.4);
  lab(ctx,W,H,(X0+X1)/2,Y+10,'1 meter',COL.live,SM_FONT,'center');
}

/* ================================================================== *
 *  view: the plane (PhET's screen)                                    *
 * ================================================================== */
const PLANE_CAP_FULL='Drag +1 nC and −1 nC charges and E-field sensors out of the bin; drop them back in it to take them away. '
  +'Arrows: the field at 0.5-m cell centres, all one length (0.31 m); their brightness follows |E| up to 5 V/m, or all are bright with “direction only”. '
  +'Voltage: 0.1-m cells, green for V > 0 and magenta for V < 0, saturating at ±40 V. The sensor arrow is 0.117 m per V/m (PhET’s scale), capped at 2 m (double head). '
  +'The voltage sensor’s plot traces the equipotential through its crosshair; moving a charge clears them.';
const PLANE_CAP_SHORT='Drag charges and sensors from the bin. Arrows: one length, brightness ∝ |E| to 5 V/m. Voltage saturates at ±40 V.';
function drawPlane(ctx,W,H,M){
  const G=planeGeo(ctx,W,H,PLANE_CAP_FULL,PLANE_CAP_SHORT), b=G.b, map=G.map, st=M.st;
  ctx.fillStyle=COL.plane; ctx.fillRect(b.x,b.y,b.w,b.h);
  if(M.vmap) drawVmap(ctx,map,M.vmap);
  if(st.showGrid) drawGrid(ctx,map,b);
  drawEqLines(ctx,W,H,G,M,st.showVals);
  if(M.arrows) drawArrows(ctx,map,M.arrows,st.dirOnly);
  frame(ctx,b,'#2a3346');
  drawBin(ctx,W,H,map,M);
  if(st.showTape) drawTape(ctx,W,H,map,st.tape,M.tape);
  drawCharges(ctx,map,M.ch);
  M.esR.forEach((R,i)=>drawESensor(ctx,W,H,map,st.esens[i],R,st.showVals));
  if(st.showVS) drawVSensor(ctx,W,H,map,st,M.vsR);
  if(st.showGrid&&st.showVals) drawMeter(ctx,W,H,map);
  if(!M.n) lab(ctx,W,H,b.x+b.w/2,b.y+b.h*0.28,'no charges on the plane: drag one out of the bin, or pick a preset',COL.dim,LAB_FONT,'center');
  caption(ctx,G.left,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT);
}

/* ================================================================== *
 *  view: field lines                                                  *
 * ================================================================== */
const LINES_CAP_FULL='Field lines leave the charges of the majority sign (the positive ones when the plane is neutral) at equal angles and follow E; '
  +'each ends on a charge of the other sign, runs off past 10 km, or ends at a null. The plane is a slice through a 3-D field, so the number of lines '
  +'reaching a charge is not proportional to its charge, and a line can end where the field turns out of the plane. Cyan: equipotentials every ΔV '
  +'(dashed, V = 0), contoured on a 4-cm grid. Orange: the null points, where E = 0. Drag the charges.';
const LINES_CAP_SHORT='Lines follow E from the majority charges; cyan equipotentials every ΔV; orange, E = 0. A 3-D field, sliced.';
function drawFamily(ctx,map,fam){
  for(const f of fam){
    ctx.beginPath(); const s=f.segs;
    for(let k=0;k<s.length;k+=4){ ctx.moveTo(map.X(s[k]),map.Y(s[k+1])); ctx.lineTo(map.X(s[k+2]),map.Y(s[k+3])); }
    ctx.strokeStyle=rgba(COL.struct,f.V===0?0.75:0.42); ctx.lineWidth=1; if(f.V===0) ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
  }
}
/* the drawn polyline of a traced line: from the seed charge's centre to the
   capturing charge's centre, so a line visibly starts and ends on charges */
function linePolyline(M,L){
  const pts=[[M.ch[L.from].x,M.ch[L.from].y]].concat(L.pts);
  if(L.end==='charge') pts.push([M.ch[L.hit].x,M.ch[L.hit].y]);
  return pts;
}
function drawFieldLines(ctx,G,M){
  const b=G.b, map=G.map, spacing=1.1;
  for(const L of M.FL.lines){
    const pts=linePolyline(M,L), xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    polyline(ctx,b,xs,ys,PLANE.x0,PLANE.x1,PLANE.y0,PLANE.y1,rgba(COL.pos,0.85),1.3);
    /* arrowheads every ~1.1 m of line on the plane, clear of the charges */
    let acc=0.55;
    for(let k=1;k<pts.length;k++){
      const a=pts[k-1], c=pts[k], d=Math.hypot(c[0]-a[0],c[1]-a[1]); acc+=d;
      if(acc<spacing) continue;
      if(c[0]<PLANE.x0||c[0]>PLANE.x1||c[1]<PLANE.y0||c[1]>PLANE.y1||nearestCharge(M.ch,c[0],c[1]).r<0.3||!(d>0)) continue;
      acc=0;
      const ux=(c[0]-a[0])/d*M.FL.sgn, uy=-(c[1]-a[1])/d*M.FL.sgn, X=map.X(c[0]), Y=map.Y(c[1]);

}
function drawNulls(ctx,W,H,map,nulls){

    ctx.strokeStyle=COL.ref; ctx.lineWidth=1.8; ctx.beginPath();
    if(N.kind==='saddle'){ ctx.moveTo(X-5,Y-5); ctx.lineTo(X+5,Y+5); ctx.moveTo(X-5,Y+5); ctx.lineTo(X+5,Y-5); }
    else { ctx.moveTo(X,Y-6); ctx.lineTo(X+6,Y); ctx.lineTo(X,Y+6); ctx.lineTo(X-6,Y); ctx.closePath(); }
    ctx.stroke();

    if(nulls.length<=4) labPad(ctx,W,H,X+9,Y-9,N.kind==='saddle'?'saddle':'in-plane '+(N.kind==='min'?'minimum':'maximum'),COL.ref,SM_FONT,'left');

function drawLines(ctx,W,H,M){
  const G=planeGeo(ctx,W,H,LINES_CAP_FULL,LINES_CAP_SHORT), b=G.b, map=G.map, st=M.st;

  frame(ctx,b,'#2a3346');
  drawCharges(ctx,map,M.ch);
  if(st.showNulls) drawNulls(ctx,W,H,map,M.nulls);
  if(!M.n) lab(ctx,W,H,b.x+b.w/2,b.y+b.h*0.4,'no charges: pick a preset, or add charges on the plane',COL.dim,LAB_FONT,'center');
  else labPad(ctx,W,H,b.x+8,b.y+10,M.FL.lines.length+' lines from the '+(M.FL.sgn>0?'positive':'negative')+' charges: '+M.FL.ends+' end on charges, '
    +M.FL.escapes+' run off past 10 km'+(M.FL.nulls?', '+M.FL.nulls+' end at a null':'')+(M.nulls.length>4&&st.showNulls?'; orange: '+M.nulls.length+' nulls':''),'#aeb6c6',SM_FONT,'left','top');
  caption(ctx,G.left,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT);
