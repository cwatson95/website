<title>Density &mdash; PhET&rsquo;s three screens, with Archimedes&rsquo; principle solved exactly</title>
<!--
  ===================================================================
  density.html — density is mass over volume, and a block floats when
  its density is below the fluid's: PhET's Intro, Compare and Mystery
  screens, with the pool level, the floating draft and every scale
  reading solved from Archimedes' principle rather than approximated
  ===================================================================

  Remake of PhET Interactive Simulations' Density (University of Colorado
  Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.
  The model, its constants and its controls follow PhET's build 1.2.10
  (docs/phets/density_en.html) and the shared doc/model.md of
  density-buoyancy-common; every number taken from that build is marked
  "PhET's value" in the code and in the panel.

  Five views.  THE POOL is PhET's Intro screen: one or two cubes of a chosen
  material in a 900 x 400 x 417 mm pool of water, with the mass and the volume
  adjustable and locked to each other by the material's density (free of each
  other only for the custom material, which is how PhET does it).  Drag a block
  and hold it under, or lift it out, and watch the water level and the forces
  answer.  THE SETS is the Compare screen: four blocks matched in mass, in
  volume or in density, with the matched quantity on a slider.  THE MYSTERY is
  the Mystery screen: five unlabelled blocks, a scale in kilograms, the pool as
  a measuring jar and the density table — and the claim that the numbers on
  screen really do name the material is asserted, not asserted-to-be-obvious.
  MASS AND VOLUME is the m-V plane: rho = m/V is a family of rays, every PhET
  material is a point on one, and the handbook value sits beside it so the two
  can be told apart.  THE WATERLINE is the floating law itself, V_sub/V =
  rho_b/rho_f, drawn across the whole density range with the three awkward
  cases marked.

  WHAT IS EXACT HERE
  ------------------
  Archimedes' principle, not an approximation to it.  The free surface solves
  G(y) = A_pool (y + H) - (every solid below y) = V_fluid by bisection on a
  function proved non-decreasing, and the level taken is the SMALLEST root, so
  that a body spanning the pool's cross-section puts the surplus fluid above
  itself instead of inside itself.  A floating cube's draft is d = s rho_b/rho_f
  and its submerged fraction rho_b/rho_f exactly (checked against scipy.brentq
  on the force balance, 1.4e-17); a floating body raises the level by its own
  MASS/(rho_f A_pool) and a sunk one by its own VOLUME/A_pool, both exactly; the
  apparent weight is W - rho_f g V_sub; the contact force on the floor is
  W - rho_f g V_sub and is never negative.  The upthrust is ALSO computed the
  long way — the hydrostatic pressure integrated over the cube's six faces, and
  over the polygon cross-section edge by edge with the linear-load closed form
  from the house buoyancy.html — and the two agree to 3e-16 relative, with the
  side faces cancelling to zero.  The three awkward cases are asserted, not
  assumed: a block denser than the fluid (rests, N = (rho_b - rho_f) g V), one
  exactly at neutral buoyancy (submerged fraction exactly 1, N = 0, and the net
  force unchanged at every depth), and one wider than the pool's free surface.
  Every number is pinned in selfTest to build/density/refvals.txt, the printed
  output of derive.py.

  WHAT IS MEASURED, AND WHOSE NUMBER IT IS
  ----------------------------------------
  Material densities are measured data, so the file carries two columns.  PhET's
  value is read out of its own build and is what the simulation runs on (wood
  400, ice 919, PVC 1440, styrofoam 150, brick 2000, aluminium 2700, glass 2700,
  diamond 3510, titanium 4500, pyrite 5010, steel 7800, copper 8960, silver
  10490, lead 11342, mercury 13593, tantalum 16650, gold 19320, platinum 21450,
  apple 832, human 950, water 1000, seawater 1029, gasoline 680, oil 920, honey
  1440, sand 1442, concrete 3150, air 1.2 kg/m^3).  Beside it is the handbook
  value from Wikipedia's "Densities of various materials" table (fetched
  2026-09-21), and where that table has no row for a material — brick, pyrite,
  apple, human, gasoline, honey — the column says so rather than inventing one.
  Four of PhET's numbers are teaching choices rather than measurements and the
  panel says which: styrofoam 150 against real expanded polystyrene near 75,
  concrete 3150 against 2400, PVC 1440 against a generic plastic 1175, and wood
  400 (pine, 373) against seasoned wood 700.  Gravity is PhET's 9.8 m/s^2, not
  the standard 9.80665.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  The fluid is incompressible, at rest and always flat, and it responds to a
  moved block instantly — PhET's own statement.  Air buoyancy is ignored (PhET's
  "vacuum assumption"): a 5 L block weighed in air reads 0.06 % high.  Blocks
  are cubes, are never tilted and never rotate (PhET: "no rotation or torque is
  considered"), and two blocks never occupy the same place.  A released block
  goes straight to its equilibrium rather than bobbing: this sim solves the
  static problem, where PhET integrates p2.js with a damping term.  The pool
  never overflows, which is true of every configuration its controls can reach
  (the fullest is four 10 L blocks: 140 L in a 150 L pool).

  WHAT IS NOT MODELLED
  --------------------
  Surface tension, viscosity, waves, the meniscus, the block's own
  compressibility, temperature, and the boat, bottle, duck, cone and ellipsoid
  shapes of PhET's full Buoyancy sim (this is the Density sim; the companion
  file buoyancy-basics.html carries the fluids, the scales and the forces).
-->

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }

function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* tiny DOM helper (only touched when a document exists) */

  const e=document.createElement(tag);

  }

}

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop
   in a naive generator (sbs_sims Known-bad) — return [] instead */
function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;
  for(let e=e0;e<=e1;e+=step){ const v=Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};
}
function sparseTicks(lo,hi,hpx){
  return ticksFor(lo,hi,hpx<90?2:(hpx<140?3:5));
}
/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));
  let fit=capFit(ctx,W,H,fullTxt,capW);
  if(fit.capY>=minTop) return {capY:fit.capY,txt:fullTxt,capW};
  fit=capFit(ctx,W,H,shortTxt,capW);
  return {capY:fit.capY,txt:shortTxt,capW};
}
function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];
}

/* ================================================================== *
 *  the physics — the pool, Archimedes on a cube, the pressure on the  *
 *  faces, and PhET's measured data.  Nothing here touches a canvas.   *
 *  y is UP in every world coordinate; the views flip.                 *
 *  build/density/derive.py is the Python twin of every function here. *
 * ================================================================== */
const DEG=PI/180;                 /* multiply DEGREES by this to get radians (asserted: 90 DEG = pi/2) */
const G=9.8;                      /* PhET's gEarth, m/s^2 (standard gravity is 9.80665) */
const G_STD=9.80665;
const LITERS=1000;                /* litres in a cubic metre — PhET's LITERS_IN_CUBIC_METER */

/* PhET's pool: Bounds3(-0.45, -0.15/0.9/0.4, -0.2, 0.45, 0, 0.2), read out of
   density_en.html.  y = 0 is ground level and the floor is at -POOL_H; the
   expressions are PhET's own, so the arithmetic rounds identically. */
const POOL_W=0.9, POOL_D=0.4, POOL_H=0.15/0.9/0.4;
const A_POOL=POOL_W*POOL_D;                 /* 0.36 m^2 of free surface */
const V_POOL=A_POOL*POOL_H;                 /* 0.15 m^3 = 150 L */
const VF0=0.1;                              /* PhET's DESIRED_STARTING_POOL_VOLUME, m^3 */
/* PhET's scale: SCALE_WIDTH 0.15, SCALE_HEIGHT 0.06, 0.2 deep -> 1.8 L displaced */
const SCALE_W=0.15, SCALE_H=0.06, SCALE_D=0.2, SCALE_V=SCALE_W*SCALE_H*SCALE_D;
/* PhET's cube limits: MIN_VOLUME 0.001, MAX_VOLUME 0.01 m^3; mass 0.1-27 kg */
const VMIN_L=1, VMAX_L=10, MMIN=0.1, MMAX=27, MMIN_CUSTOM=0.5;

/* --------------------------------------------------------------------------

   materials" table, fetched 2026-09-21 — "ref".  ref:null means that table

const MATERIALS=[

  {id:'pvc',      name:'PVC',       phet:1440,  ref:1175,   col:'#d3d6dc', note:'1175 is Wikipedia’s generic plastic'},

const MAT={}; MATERIALS.forEach(m=>{ MAT[m.id]=m; });
function matRho(id,custom){ if(id==='custom') return custom; const m=MAT[id]; if(!m) throw new Error('unknown material '+id); return m.phet; }
function matName(id){ return id==='custom'?'custom':MAT[id].name; }
function matColor(id,custom){
  if(id!=='custom') return MAT[id].col;
  /* PhET shades its custom material from black to white by density; keep the
     same idea on a cyan-to-white ramp so it never collides with a real one */
  const t=clamp((Math.log(custom/100)/Math.log(200)),0,1);
  return mix('#3d5d75','#e8eef5',t);
}
/* PhET's Intro/Explore material list (SIMPLE_MASS_MATERIALS + custom) */
const SIMPLE_MATS=['styrofoam','wood','ice','pvc','brick','aluminum'];
/* PhET's Density Mystery density table (DENSITY_MYSTERY_SCREEN_MATERIALS) */
const DENSITY_TABLE=['wood','gasoline','apple','ice','human','water','glass',
                     'diamond','titanium','steel','copper','lead','gold'];
/* PhET's Buoyancy fluid list (BUOYANCY_FLUID_MATERIALS) */
const BUOY_FLUIDS=['gasoline','oil','water','seawater','honey','mercury'];

/* ------------------------------------------------------------------ the cube */
function cubeSide(V){ return Math.pow(V,1/3); }        /* PhET's Cube.boundsFromVolume */
/* the volume of a cube of volume V, bottom at yb, lying below yw.  Saturates at
   V EXACTLY, not at s^3: s = V^(1/3) is inexact in binary, and s*s*s misses V
   by an ulp, which shows up as a submerged fraction of 1.0000000000000004. */
function cubeBelow(V,yb,yw){
  const s=cubeSide(V);
  if(yw>=yb+s) return V;
  if(yw<=yb) return 0;
  return s*s*(yw-yb);
}

/* ------------------------------------------------------------- the free surface
   A block is in one of four states at a trial surface yw:
     held   the user holds it, its bottom pinned (never below its support)
     float  rho_b < rho_f AND the floating draft clears its support
     rest   sitting on its support (the pool floor, or the pool scale)
     out    not in the pool at all
   The switch between float and rest is continuous: at the moment the floating
   draft just reaches the support, s^2 d = V rho_b/rho_f, the two agree. */
function blockState(b,yw,rhoF){
  const s=cubeSide(b.V);
  if(b.inPool===false) return {Vsub:0,yb:(b.yb===undefined?0:b.yb),mode:'out',s:s};
  const sup=(b.support===undefined?-POOL_H:b.support);
  if(b.held!==undefined&&b.held!==null){
    const yb=Math.max(b.held,sup);
    return {Vsub:cubeBelow(b.V,yb,yw),yb:yb,mode:'held',s:s};
  }
  if(b.rho<rhoF){
    const d=s*b.rho/rhoF, yb=yw-d;
    if(yb>=sup) return {Vsub:b.V*b.rho/rhoF,yb:yb,mode:'float',s:s};
  }
  return {Vsub:cubeBelow(b.V,sup,yw),yb:sup,mode:'rest',s:s};
}
function obstacleVolume(obs,yw){
  let t=0;
  for(const o of obs) t+=o.a*clamp(yw-o.y0,0,o.h);
  return t;
}
/* G(yw) = (pool volume below yw) - (every solid below yw).  Non-decreasing
   wherever the blocked plan area stays below A_POOL; selfTest sweeps it. */
function netFluid(yw,blocks,obs,rhoF){
  let t=A_POOL*Math.max(0,yw+POOL_H);
  for(const b of blocks) t-=blockState(b,yw,rhoF).Vsub;
  return t-obstacleVolume(obs,yw);
}
/* the SMALLEST yw with G(yw) >= Vf.  The infimum is the physics: a body that
   spans the pool's cross-section makes G flat, and the surface then sits at the
   bottom of the flat stretch with the surplus fluid above the body, not inside
   it.  Bisection keeps the invariant G(lo) < Vf <= G(hi). */
function poolLevel(blocks,obs,rhoF,Vf,nit){
  let sumV=0; for(const b of blocks) sumV+=b.V;
  let lo=-POOL_H, hi=-POOL_H+(Vf+sumV+obstacleVolume(obs,1e9))/A_POOL+1;
  const n=nit||80;
  for(let i=0;i<n;i++){
    const mid=0.5*(lo+hi);
    if(netFluid(mid,blocks,obs,rhoF)<Vf) lo=mid; else hi=mid;
  }
  return 0.5*(lo+hi);
}
/* the whole configuration: the level, then every block's state and forces */
function solvePool(blocks,rhoF,obs,Vf){
  obs=obs||[]; Vf=(Vf===undefined?VF0:Vf);
  const yw=poolLevel(blocks,obs,rhoF,Vf);
  const out={yw:yw,rhoF:rhoF,blocks:[]};
  for(const b of blocks){
    const st=blockState(b,yw,rhoF), m=b.rho*b.V, W=m*G, Fb=rhoF*G*st.Vsub;
    /* no clamp: a block only ever rests when the upthrust cannot lift it, so
       W - Fb >= 0 is a property of the solve rather than something to enforce.
       A Math.max(0, .) here was provably unreachable — dead code that mutation
       testing correctly reported as an equivalent mutant — and selfTest now
       sweeps the property instead. */
    const N=(st.mode==='rest')?(W-Fb):0;
    const hand=(st.mode==='held')?(W-Fb):0;
    out.blocks.push({V:b.V,rho:b.rho,s:st.s,m:m,Vsub:st.Vsub,yb:st.yb,mode:st.mode,
                     W:W,Fb:Fb,N:N,hand:hand,frac:st.Vsub/b.V,
                     x:(b.x===undefined?0:b.x),tag:b.tag,mat:b.mat,col:b.col});
  }
  return out;
}

/* --------------------------------------------------- Archimedes, closed form */
function floatDraft(V,rho,rhoF){ return cubeSide(V)*rho/rhoF; }    /* d = s rho_b/rho_f */
function submergedFraction(rho,rhoF){ return Math.min(1,rho/rhoF); }
function apparentWeight(V,rho,rhoF,Vsub){ return rho*V*G-rhoF*G*(Vsub===undefined?V:Vsub); }
function riseFloating(m,rhoF){ return m/(rhoF*A_POOL); }           /* its own MASS / (rho_f A) */
function riseSunk(V){ return V/A_POOL; }                           /* its own VOLUME / A */

/* ------------------------------------- the force, from the pressure on the faces
   p = rho g (yw - y), gauge (PhET ignores air buoyancy: the "vacuum
   assumption" of its model.md).  The bottom face pushes up, the top face down,
   and the four side faces cancel in pairs.  Returned per face so a view can
   draw them. */
function cubeFaceForces(V,yb,yw,rhoF){
  const s=cubeSide(V), yt=yb+s, A=s*s;
  const pBot=yb<yw?rhoF*G*(yw-yb):0, pTop=yt<yw?rhoF*G*(yw-yt):0;
  /* one side face: p integrated over the submerged strip, exact (p is linear) */
  const yl=Math.min(yw,yt), dsub=Math.max(0,yl-yb);
  const side=rhoF*G*(yw-0.5*(yb+yl))*s*dsub;
  return {pBot:pBot,pTop:pTop,A:A,Fbot:pBot*A,Ftop:pTop*A,net:(pBot-pTop)*A,
          side:side,sideSum:side-side,dBot:Math.max(0,yw-yb),dTop:Math.max(0,yw-yt)};
}
/* --- the 2-D route: the same force taken edge by edge round the polygon ------
   (the closed forms are build_buoy/p2_physics.js's, reused here) */
function clipBelow(poly,w){
  const out=[], n=poly.length;
  for(let i=0;i<n;i++){
    const a=poly[i], b=poly[(i+1)%n], ain=a[1]<=w, bin=b[1]<=w;
    if(ain) out.push([a[0],a[1]]);
    if(ain!==bin){ const t=(w-a[1])/(b[1]-a[1]); out.push([a[0]+(b[0]-a[0])*t,w]); }
  }
  return out;
}
function polyArea(poly){ let s=0; const n=poly.length;
  for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n]; s+=a[0]*b[1]-b[0]*a[1]; } return 0.5*s; }
function polyCentroid(poly){
  const A=polyArea(poly); if(Math.abs(A)<1e-300) return [0,0];
  let cx=0, cy=0; const n=poly.length;
  for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n], cr=a[0]*b[1]-b[0]*a[1]; cx+=(a[0]+b[0])*cr; cy+=(a[1]+b[1])*cr; }
  return [cx/(6*A),cy/(6*A)];
}
/* p is linear along a straight edge, so the edge force is p(mid) L exactly; the
   outward normal of a CCW edge (dx, dy) is (dy, -dx)/L and the fluid pushes
   inward, F = -p n L.  Per unit depth. */
function edgeForces(sub,w,rhoF){
  const n=sub.length, F=[], tot=[0,0];
  for(let i=0;i<n;i++){
    const a=sub[i], b=sub[(i+1)%n], dx=b[0]-a[0], dy=b[1]-a[1];
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2], p=rhoF*G*(w-mid[1]);
    const fx=-p*dy, fy=p*dx;
    F.push({fx:fx,fy:fy,a:a,b:b,p:p}); tot[0]+=fx; tot[1]+=fy;
  }
  return {F:F,tot:tot};
}
/* the independent route the tests use: subdivide every edge and sum p n ds */
function finePerimeter(poly,w,rhoF,nsub){
  nsub=nsub||2000; const tot=[0,0], n=poly.length;
  for(let i=0;i<n;i++){ const a=poly[i], b=poly[(i+1)%n], dx=b[0]-a[0], dy=b[1]-a[1];
    for(let k=0;k<nsub;k++){ const t=(k+0.5)/nsub, y=a[1]+dy*t, p=rhoF*G*Math.max(0,w-y);
      tot[0]+=-p*dy/nsub; tot[1]+=p*dx/nsub; } }
  return tot;
}
function cubePoly(V,yb,xc){
  const s=cubeSide(V), x=(xc===undefined?0:xc);
  return [[x-s/2,yb],[x+s/2,yb],[x+s/2,yb+s],[x-s/2,yb+s]];
}

/* ------------------------------------------------------------ PhET's screens */
/* Density, Compare screen (DensityCompareModel): four cubes, and the matched
   quantity on a slider.  Volumes and masses are PhET's own cubesData. */
const DENS_CUBES=[
  {tag:'B',tagV:'A',tagD:'B',mv:0.01,   vm:8,dv:0.006,col:'#d8c14a'},
  {tag:'A',tagV:'C',tagD:'A',mv:0.005,  vm:6,dv:0.004,col:'#4f8fd0'},
  {tag:'C',tagV:'D',tagD:'C',mv:0.0025, vm:4,dv:0.002,col:'#6fbf5a'},
  {tag:'D',tagV:'B',tagD:'D',mv:0.00125,vm:2,dv:0.001,col:'#d05a4f'},
];
const DENS_SAME_MASS=5, DENS_SAME_VOL=0.005, DENS_SAME_RHO=500;
const DENS_MASS_RANGE=[1,10], DENS_VOL_RANGE=[0.001,0.01], DENS_RHO_RANGE=[100,2000];
/* Buoyancy: Basics, Compare screen (BuoyancyCompareModel): two cubes, brick and
   wood, same mass 4 kg, same density 400 = PhET's WOOD */
const BB_CUBES=[
  {tag:'A',tagV:'A',tagD:'A',mv:0.002,vm:10,dv:0.005,col:'#c08a3c'},
  {tag:'B',tagV:'B',tagD:'B',mv:0.01, vm:2, dv:0.01, col:'#4f8fd0'},
];
const BB_SAME_MASS=4, BB_SAME_VOL=0.005, BB_SAME_RHO=400;
const BB_RHO_RANGE=[100,3000];

/* one set of compare blocks at the current slider values */
function compareBlocks(cubes,mode,mass,volM3,rho){
  return cubes.map((c,i)=>{
    if(mode==='mass')   return {tag:c.tag, V:c.mv,  rho:mass/c.mv,        col:c.col,idx:i};
    if(mode==='volume') return {tag:c.tagV,V:volM3, rho:c.vm/volM3,       col:c.col,idx:i};
    return                     {tag:c.tagD,V:c.dv,  rho:rho,              col:c.col,idx:i};
  });
}

/* Density, Mystery screen: PhET's three fixed sets.  'V' rows are built from a
   volume, 'M' rows from a mass; the density is the other factor. */
const MYSTERY_SETS={
  'set 1':[['D','V',0.005, 1000],['B','V',0.001,400],['E','V',0.007,400],
           ['C','V',0.001,19320],['A','V',0.0055,3510]],
  'set 2':[['D','M',18,4500],['A','M',18,11340],['E','V',0.005,8960],
           ['C','M',2.7,2700],['B','M',10.8,2700]],
  'set 3':[['E','M',6,950],['B','M',6,1000],['D','M',2,400],
           ['C','M',23.4,7800],['A','M',2.85,950]],
};
const MYSTERY_COLS={'set 1':['#d05a4f','#4f8fd0','#6fbf5a','#d8c14a','#9b6bd0'],
                    'set 2':['#d489a8','#d88b3c','#a58ed0','#8fc97a','#9a7550'],
                    'set 3':['#e2e6ec','#9aa2b1','#d0b44a','#e0b394','#8d4a4a']};
const MYSTERY_LIST=['set 1','set 2','set 3','shuffled'];
function mysterySet(name,seed){
  if(name==='shuffled') return shuffledMystery(seed);
  const cols=MYSTERY_COLS[name];
  return MYSTERY_SETS[name].map((r,i)=>{
    const V=(r[1]==='V')?r[2]:r[2]/r[3];
    return {tag:r[0],V:V,rho:r[3],m:r[3]*V,col:cols[i],idx:i};
  });
}
/* PhET's RANDOM set draws five of the thirteen table materials and five
   volumes (three from 1-6 L, two from 7-10 L, sorted).  Here the draw comes
   from a seeded generator so that a capture, a test and the browser all see the
   same set for a given seed, and the refresh button simply advances it. */
function lcg(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffleWith(rnd,arr){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffledMystery(seed){
  const rnd=lcg(seed), mats=shuffleWith(rnd,DENSITY_TABLE).slice(0,5);
  const lo=shuffleWith(rnd,[1,2,3,4,5,6]).slice(0,3), hi=shuffleWith(rnd,[7,8,9,10]).slice(0,2);
  const vols=lo.concat(hi).sort((a,b)=>a-b);
  const tags=['A','B','C','D','E'], cols=MYSTERY_COLS['set 1'].concat(MYSTERY_COLS['set 2']);
  return mats.map((mid,i)=>({tag:tags[i],V:vols[i]/LITERS,rho:MAT[mid].phet,
                             m:MAT[mid].phet*vols[i]/LITERS,col:cols[i],idx:i,truth:mid}));
}
/* two decimals, rounded half away from zero, which is what the sim prints */
function disp2(x){ return Math.floor(Math.abs(x)*100+0.5)/100*(x<0?-1:1); }
/* the identification a student can make from the printed numbers alone */
function identify(mDisp,VdispL){
  const rho=mDisp/VdispL*LITERS;
  const d=DENSITY_TABLE.map(k=>({id:k,e:Math.abs(MAT[k].phet-rho)/MAT[k].phet}))
                       .sort((a,b)=>a.e-b.e);
  return {rho:rho,id:d[0].id,err:d[0].e,gap:d[1].e};
}

/* -------------------------------------------- PhET's mass / volume coupling
   Non-custom: the density is fixed, so V = m/rho and the mass slider's enabled
   range is the volume range mapped through rho and clipped to 0.1-27 kg.
   Custom: the two are free and moving either one sets rho = m/V. */
function massRangeFor(rho,custom){
  if(custom) return [MMIN_CUSTOM,MMAX];
  return [clamp(rho*VMIN_L/LITERS,MMIN,MMAX),clamp(rho*VMAX_L/LITERS,MMIN,MMAX)];
}
/* ================================================================== *
 *  state, the per-view model, the readout, the equation bar, the tag  *
 * ================================================================== */
const TABS=[['pool','the pool'],['sets','the sets'],['mystery','the mystery'],
            ['mv','mass and volume'],['line','the waterline']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', off:'#161c2c', edge:'#242a3a', gold:'#d9b44a',
           fluid:'#163a55', fluid2:'#1e4f73', body:'#4a5060', body2:'#6b7285', air:'#0d1626'};
const RO_W=300;
const HINT_H=18;   /* the house #hint (HTML, bottom:11px) owns the bottom-left corner */

const MAT_LIST=SIMPLE_MATS.map(id=>({id:id,name:MAT[id].name})).concat([{id:'custom',name:'custom'}]);
const SET_LIST=[{id:'mass',name:'same mass'},{id:'volume',name:'same volume'},{id:'density',name:'same density'}];
const MSET_LIST=MYSTERY_LIST.map(n=>({id:n,name:n}));
const PICK_LIST=['A','B','C','D','E'].map(t=>({id:t,name:t}));
const MVMAT_LIST=MATERIALS.filter(m=>m.id!=='air').map(m=>({id:m.id,name:m.name}));
const FLUID_LIST=BUOY_FLUIDS.map(id=>({id:id,name:MAT[id].name}));

const DEFAULTS={
  view:'pool',
  /* the pool (PhET's Intro screen) */
  two:false, matA:'wood', massA:2, volAL:5, matB:'aluminum', massB:13.5, volBL:5,
  holdA:null, holdB:null,
  /* the sets (Compare) — PhET's own defaults, taken from the constants rather
     than retyped, so a mutation of either moves both (Known-bad: a number
     written in two places is two numbers and only one gets mutated) */
  setMode:'mass', sameMass:DENS_SAME_MASS, sameVolL:DENS_SAME_VOL*LITERS, sameRho:DENS_SAME_RHO,
  /* the mystery */
  mset:'set 1', seed:1, reveal:false, mpick:'A', submerge:true,
  /* mass and volume */
  mvMat:'wood', showRef:true,
  /* the waterline */
  lineFluid:'water',
  /* shared overlays */
  forces:true, levels:true,
};
const ST=Object.assign({},DEFAULTS);

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* -------------------------------------------------- the two adjustable blocks
   PhET's coupling exactly: with a real material the density is fixed, so mass
   and volume move together; the custom material leaves them free and the
   density follows, rho = m/V. */
function rhoOf(st,w){
  const mat=w==='A'?st.matA:st.matB;
  if(mat!=='custom') return MAT[mat].phet;
  const m=w==='A'?st.massA:st.massB, V=(w==='A'?st.volAL:st.volBL)/LITERS;
  return m/V;
}
function setMass(st,w,m){
  const mat=w==='A'?st.matA:st.matB, custom=(mat==='custom');
  const rng=massRangeFor(custom?0:MAT[mat].phet,custom);
  m=clamp(m,rng[0],rng[1]);
  if(w==='A') st.massA=m; else st.massB=m;
  if(!custom){
    const V=clamp(m/MAT[mat].phet*LITERS,VMIN_L,VMAX_L);
    if(w==='A') st.volAL=V; else st.volBL=V;
    /* if the volume clipped, the mass has to follow it back */
    const mm=MAT[mat].phet*V/LITERS;
    if(Math.abs(mm-m)>1e-12){ if(w==='A') st.massA=mm; else st.massB=mm; }
  }
}
function setVol(st,w,V){
  const mat=w==='A'?st.matA:st.matB, custom=(mat==='custom');
  V=clamp(V,VMIN_L,VMAX_L);
  if(w==='A') st.volAL=V; else st.volBL=V;
  if(!custom) setMass(st,w,MAT[mat].phet*V/LITERS);
  else { /* rho follows; keep the mass inside its own range */
    const m=w==='A'?st.massA:st.massB;
    const mm=clamp(m,MMIN_CUSTOM,MMAX);
    if(w==='A') st.massA=mm; else st.massB=mm;
  }
}
/* switching material keeps the VOLUME and rebuilds the mass (PhET keeps the
   cube's size and re-densities it); if that mass leaves 0.1-27 kg the volume
   gives way instead */
function setMat(st,w,id){
  if(w==='A') st.matA=id; else st.matB=id;
  const V=w==='A'?st.volAL:st.volBL;
  if(id==='custom'){ const m=clamp((w==='A'?st.massA:st.massB),MMIN_CUSTOM,MMAX);
    if(w==='A') st.massA=m; else st.massB=m; return; }
  setMass(st,w,MAT[id].phet*V/LITERS);
}
function blockOf(st,w,x){
  const rho=rhoOf(st,w), V=(w==='A'?st.volAL:st.volBL)/LITERS, held=w==='A'?st.holdA:st.holdB;
  return {tag:w,V:V,rho:rho,x:x,mat:w==='A'?st.matA:st.matB,
          col:matColor(w==='A'?st.matA:st.matB,rho),held:(held===null?undefined:held)};
}

/* ------------------------------------------------------------- the pool view */
const RHO_WATER=1000;      /* Density runs on water only — PhET's 'justWater' */
function poolModel(st){
  const key=[st.two,st.matA,st.massA,st.volAL,st.matB,st.massB,st.volBL,st.holdA,st.holdB].join('|');
  return memo('pool',key,()=>{
    const blocks=[blockOf(st,'A',-0.22)];
    if(st.two) blocks.push(blockOf(st,'B',0.22));
    const sol=solvePool(blocks,RHO_WATER);
    const bare=poolLevel([],[],RHO_WATER,VF0);
    for(const b of sol.blocks){
      b.faces=cubeFaceForces(b.V,b.yb,sol.yw,RHO_WATER);
      b.floats=b.rho<RHO_WATER;
      b.draft=b.floats?floatDraft(b.V,b.rho,RHO_WATER):b.s;
      b.rise=b.mode==='float'?riseFloating(b.m,RHO_WATER):riseSunk(b.Vsub);
    }
    return {rhoF:RHO_WATER,yw:sol.yw,bare:bare,blocks:sol.blocks,
            rise:sol.yw-bare, VfDisp:(sol.yw-bare)*A_POOL};
  });
}

/* ------------------------------------------------------------- the sets view */
function setsModel(st){
  const key=[st.setMode,st.sameMass,st.sameVolL,st.sameRho].join('|');
  return memo('sets',key,()=>{
    const raw=compareBlocks(DENS_CUBES,st.setMode,st.sameMass,st.sameVolL/LITERS,st.sameRho);
    const xs=[-0.315,-0.105,0.105,0.315];
    raw.forEach((b,i)=>{ b.x=xs[i]; });
    const sol=solvePool(raw,RHO_WATER);
    sol.blocks.forEach((b,i)=>{ b.tag=raw[i].tag; b.col=raw[i].col; b.floats=b.rho<RHO_WATER; });
    /* the matched quantity, and the one the set makes vary */
    const matched=st.setMode==='mass'?'mass':(st.setMode==='volume'?'volume':'density');
    return {yw:sol.yw,blocks:sol.blocks,matched:matched,
            nFloat:sol.blocks.filter(b=>b.mode==='float').length,
            nNeutral:sol.blocks.filter(b=>Math.abs(b.rho-RHO_WATER)<1e-9).length};
  });
}

/* ---------------------------------------------------------- the mystery view */
function mysteryModel(st){
  const key=[st.mset,st.seed,st.mpick,st.reveal,st.submerge].join('|');
  return memo('mystery',key,()=>{
    const set=mysterySet(st.mset,st.seed);
    const xs=[-0.33,-0.165,0,0.165,0.33];
    set.forEach((b,i)=>{ b.x=xs[i]; });
    /* holding a block under is what makes the displaced volume the block's
       volume: left alone a floating block displaces its own WEIGHT of water,
       so the measurement returns rho_f and every floater reads as water */
    const sol=solvePool(set.map(b=>({tag:b.tag,V:b.V,rho:b.rho,x:b.x,col:b.col,
                                     held:st.submerge?-POOL_H:undefined})),RHO_WATER);
    const bare=poolLevel([],[],RHO_WATER,VF0);
    const rows=set.map((b,i)=>{
      const Vdisp=sol.blocks[i].Vsub;                       /* what the pool measures */
      const mD=disp2(b.m), VD=disp2(Vdisp*LITERS), id=identify(mD,VD);
      /* the material the block REALLY is: the table entry nearest its true
         density (PhET's set 2 A is 11340 against the table's lead 11342) */
      const truth=identify(b.rho/LITERS,1).id;
      return {tag:b.tag,V:b.V,rho:b.rho,m:b.m,col:b.col,mDisp:mD,VDisp:VD,VmeasL:VD,
              rhoRead:id.rho,guess:id.id,err:id.err,gap:id.gap,
              readErr:Math.abs(id.rho-b.rho)/b.rho, ok:(id.id===truth),
              truth:truth,mode:sol.blocks[i].mode,frac:sol.blocks[i].frac,x:b.x};
    });
    const pick=rows.find(r=>r.tag===st.mpick)||rows[0];
    return {rows:rows,pick:pick,yw:sol.yw,bare:bare,blocks:sol.blocks,
            nWrong:rows.filter(r=>!r.ok).length,
            worstErr:Math.max.apply(null,rows.map(r=>r.readErr)),
            worstGap:Math.min.apply(null,rows.map(r=>r.gap)),
            table:DENSITY_TABLE.map(k=>({id:k,name:MAT[k].name,rho:MAT[k].phet,ref:MAT[k].ref}))
                               .sort((a,b)=>a.rho-b.rho)};
  });
}

/* ------------------------------------------------- the mass-volume plane view */
function mvModel(st){
  const key=[st.mvMat,st.showRef,st.matA,st.massA,st.volAL].join('|');
  return memo('mv',key,()=>{
    const pick=MAT[st.mvMat];
    const live={m:st.massA,V:st.volAL,rho:rhoOf(st,'A')};
    /* every material that can be drawn inside the 1-10 L x 0.1-27 kg box */
    const pts=MATERIALS.filter(m=>m.id!=='air').map(m=>{
      const rng=massRangeFor(m.phet,false);
      return {id:m.id,name:m.name,rho:m.phet,ref:m.ref,note:m.note,col:m.col,
              mLo:rng[0],mHi:rng[1],inBox:m.phet*VMIN_L/LITERS<=MMAX,
              dRel:m.ref===null?null:(m.phet-m.ref)/m.ref};
    });
    const worst=pts.filter(p=>p.dRel!==null).sort((a,b)=>Math.abs(b.dRel)-Math.abs(a.dRel))[0];
    return {pick:pick,live:live,pts:pts,worst:worst,
            nRef:pts.filter(p=>p.ref!==null).length,nNo:pts.filter(p=>p.ref===null).length};
  });
}

/* --------------------------------------------------------- the waterline view */
function lineModel(st){
  const key=[st.lineFluid,st.matA,st.massA,st.volAL].join('|');
  return memo('line',key,()=>{
    const rhoF=MAT[st.lineFluid].phet, rhoB=rhoOf(st,'A'), V=st.volAL/LITERS;
    const r=rhoB/rhoF;
    const curve=[];
    for(let i=0;i<=400;i++){ const rr=3*i/400; curve.push([rr,Math.min(1,rr)]); }
    /* what every material does in this fluid */
    const rows=MATERIALS.filter(m=>m.id!=='air').map(m=>({id:m.id,name:m.name,rho:m.phet,
      r:m.phet/rhoF, frac:submergedFraction(m.phet,rhoF), floats:m.phet<rhoF, col:m.col}));
    const one=solvePool([{V:V,rho:rhoB}],rhoF);
    const b=one.blocks[0];
    return {rhoF:rhoF,rhoB:rhoB,V:V,r:r,frac:submergedFraction(rhoB,rhoF),
            draft:floatDraft(V,rhoB,rhoF),side:cubeSide(V),curve:curve,rows:rows,
            yw:one.yw,blk:b,N:b.N,app:apparentWeight(V,rhoB,rhoF,b.Vsub),
            rise:b.mode==='float'?riseFloating(b.m,rhoF):riseSunk(b.Vsub),
            neutral:Math.abs(rhoB-rhoF)<1e-9};
  });
}

function buildModel(st){
  st=st||ST;
  if(st.view==='pool') return poolModel(st);
  if(st.view==='sets') return setsModel(st);
  if(st.view==='mystery') return mysteryModel(st);
  if(st.view==='mv') return mvModel(st);
  return lineModel(st);
}

/* ================================================================== *
 *  readout / equation bar / stage tag                                 *
 * ================================================================== */
function row(l,v,cls){ return '<tr><td>'+l+'</td><td class="v'+(cls?' '+cls:'')+'">'+v+'</td></tr>'; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function kgm3(x){ return sigf(x,x>=1000?5:4)+' kg/m<sup>3</sup>'; }
/* a relative error, said in words when it is below what any display could show */
function pct(x){ return x<1e-9?'exact':(sigf(100*x,2)+' %'); }

function readoutHTML(M,st){
  st=st||ST;
  const v=st.view;
  let name='', sub='', body='', note='';
  if(v==='pool'){
    const A=M.blocks[0], B=M.blocks[1];
    name='the pool'; sub='one block' + (st.two?'s — A and B':'');
    if(st.two) sub='two blocks, A and B';
    body=hd('block A — '+matName(st.matA))
      +row('mass',fmt(A.m,2)+' kg')
      +row('volume',fmt(A.V*LITERS,2)+' L')
      +row('density',kgm3(A.rho),'good')
      +row('cube side',fmt(A.s*100,2)+' cm')
      +row('state',A.mode==='float'?'floats':(A.mode==='held'?'held':(Math.abs(A.rho-M.rhoF)<1e-9?'neutral — rests, no push':'sinks')),A.mode==='float'?'good':'bad')
      +row('submerged',fmt(100*A.frac,1)+' %')
      +row('weight W',fmt(A.W,2)+' N')
      +row('upthrust F<sub>b</sub>',fmt(A.Fb,2)+' N','good')
      +row(A.mode==='held'?'your hand':'floor pushes',fmt(A.mode==='held'?A.hand:A.N,2)+' N',A.mode==='held'?'':'bad');
    if(B) body+=hd('block B — '+matName(st.matB))
      +row('mass',fmt(B.m,2)+' kg')
      +row('volume',fmt(B.V*LITERS,2)+' L')
      +row('density',kgm3(B.rho),'good')
      +row('state',B.mode==='float'?'floats':'sinks',B.mode==='float'?'good':'bad')
      +row('submerged',fmt(100*B.frac,1)+' %');
    body+=hd('the pool')
      +row('water',fmt(VF0*LITERS,0)+' L in '+fmt(V_POOL*LITERS,0)+' L')
      +row('level',fmt(100*(M.yw+POOL_H),2)+' cm above the floor')
      +row('risen by',fmt(1000*M.rise,2)+' mm','good')
      +row('= displaced',fmt(M.VfDisp*LITERS,2)+' L');
    note='<b>A floating block raises the level by its own mass over &rho;<sub>f</sub>A</b>, and a sunk one by its own volume over A — both exactly. '
      +'A = '+fmt(A_POOL,2)+' m<sup>2</sup>, so one litre is '+fmt(1000/A_POOL*0.001,2)+' mm.';
  } else if(v==='sets'){
    name='the sets'; sub='matched in '+M.matched;
    body=hd('the four blocks');
    for(const b of M.blocks)
      body+=row(b.tag+' &nbsp; '+fmt(b.m,2)+' kg, '+fmt(b.V*LITERS,2)+' L',
                sigf(b.rho,4)+(b.mode==='float'?' &uarr;':' &darr;'),b.mode==='float'?'good':'bad');
    body+=hd('the matched quantity')
      +row(M.matched,st.setMode==='mass'?fmt(st.sameMass,2)+' kg':(st.setMode==='volume'?fmt(st.sameVolL,2)+' L':kgm3(st.sameRho)),'good')
      +row('floating',M.nFloat+' of '+M.blocks.length)
      +row('level',fmt(100*(M.yw+POOL_H),2)+' cm');
    note=st.setMode==='mass'?'Same mass, different volume: the small ones are the dense ones. PhET&rsquo;s four volumes are 10, 5, 2.5 and 1.25 L, so at 5 kg the densities are 500, 1000, 2000 and 4000 &mdash; and the second is <b>exactly water</b>, neither floating nor pressing on the floor.'
      :st.setMode==='volume'?'Same volume, different mass: the heavy ones are the dense ones. PhET&rsquo;s four masses are 8, 6, 4 and 2 kg, so at 5 L the densities are 1600, 1200, 800 and 400.'
      :'Same density, different size: every one of them floats to the same depth, '+fmt(100*st.sameRho/RHO_WATER,1)+' % of its side, whatever its size. That is the whole content of the floating law.';
  } else if(v==='mystery'){
    const p=M.pick;
    name='the mystery'; sub=st.mset;
    body=hd('block '+p.tag+' — what the sim shows you')
      +row('scale reads',fmt(p.mDisp,2)+' kg')
      +row('water rose by',fmt(p.VmeasL,2)+' L')
      +row('&rho; = m/V',kgm3(p.rhoRead),'good')
      +hd('reading it off the table')
      +row('nearest',MAT[p.guess].name,p.ok?'good':'bad')
      +row('off by',pct(p.err),'good')
      +row('runner-up is',pct(p.gap)+' away','good');
    if(st.reveal) body+=row('really',MAT[p.truth].name+(p.ok?'':' — MISSED'),p.ok?'good':'bad');
    body+=hd('the whole set')
      +row('identified',(5-M.nWrong)+' of 5',M.nWrong?'bad':'good')
      +row('worst reading error',pct(M.worstErr))
      +row('smallest gap to 2nd',pct(M.worstGap),'good');
    note=st.submerge
      ? 'The claim that these numbers <b>identify</b> the material is asserted, not assumed: every block&rsquo;s printed mass and '
        +'displaced volume put it within '+pct(M.worstErr)+' of its own density and no closer than '+pct(M.worstGap)+' to any other '
        +'table entry. PhET&rsquo;s 2700 blocks are aluminium, but aluminium is not on the Density table &mdash; glass, also 2700, is the answer it wants.'
      : '<b>The floating blocks are lying to you.</b> A floating body pushes aside its own <i>weight</i> of water, not its own volume, '
        +'so m/V comes out at the water&rsquo;s own density however light it is. Switch &ldquo;hold them under&rdquo; back on.';
  } else if(v==='mv'){
    const p=M.pick, L=M.live;
    name='mass and volume'; sub='&rho; = m/V, one ray per material';
    body=hd(p.name)
      +row('PhET&rsquo;s value',kgm3(p.phet),'good')
      +row('handbook',p.ref===null?'no row':kgm3(p.ref),'ref')
      +row('difference',p.ref===null?'&mdash;':(p.phet>p.ref?'+':'')+sigf(100*(p.phet-p.ref)/p.ref,3)+' %',p.ref===null?'':'bad')
      +row('1 L weighs',fmt(p.phet/LITERS,3)+' kg')
      +row('10 L weighs',fmt(10*p.phet/LITERS,2)+' kg');
    body+=hd('block A, live')
      +row('mass',fmt(L.m,2)+' kg')
      +row('volume',fmt(L.V,2)+' L')
      +row('density',kgm3(L.rho),'good');
    body+=hd('the two columns')
      +row('with a handbook row',M.nRef+' of '+M.pts.length)
      +row('without one',M.nNo)
      +row('furthest apart',MAT[M.worst.id].name+', '+(M.worst.dRel>0?'+':'')+sigf(100*M.worst.dRel,3)+' %','bad');
    note='<b>Green is PhET&rsquo;s number, orange the handbook&rsquo;s.</b> Six materials &mdash; brick, pyrite, apple, human, gasoline, honey &mdash; '
      +'have no row in Wikipedia&rsquo;s table at all, and this file says so rather than inventing one. Source: Wikipedia, &ldquo;Densities of various materials&rdquo;, fetched 2026-09-21.';
  } else {
    name='the waterline'; sub=MAT[st.lineFluid].name;
    body=hd('the block, in '+MAT[st.lineFluid].name)
      +row('&rho;<sub>b</sub>',kgm3(M.rhoB),'good')
      +row('&rho;<sub>f</sub>',kgm3(M.rhoF),'ref')
      +row('ratio &rho;<sub>b</sub>/&rho;<sub>f</sub>',fmt(M.r,4),'live')
      +row('submerged',fmt(100*M.frac,2)+' %','good')
      +row(M.blk.mode==='float'?'draft':'side',fmt(100*(M.blk.mode==='float'?M.draft:M.side),2)+' cm')
      +hd('the forces')
      +row('weight',fmt(M.blk.W,2)+' N')
      +row('upthrust',fmt(M.blk.Fb,2)+' N','good')
      +row('floor pushes',fmt(M.N,2)+' N','bad')
      +row('a spring scale would read',fmt(M.app,2)+' N')
      +hd('the pool')
      +row('level rose',fmt(1000*M.rise,2)+' mm','good');
    note=M.neutral?'<b>Exactly neutral.</b> &rho;<sub>b</sub> = &rho;<sub>f</sub>, so the upthrust equals the weight at every depth: the block neither floats nor presses on the floor, and a spring scale reads zero. Nothing chooses a depth for it.'
      :(M.blk.mode==='float'?'It floats. The submerged fraction is <b>exactly</b> &rho;<sub>b</sub>/&rho;<sub>f</sub> &mdash; it does not depend on the size, the shape&rsquo;s cross-section, or gravity.'
        :'It sinks and the floor takes the rest: N = (&rho;<sub>b</sub> &minus; &rho;<sub>f</sub>)gV = '+fmt(M.N,2)+' N.');
  }
  return '<div class="rname">'+name+'<small>'+sub+'</small></div><table>'+body+'</table><div class="note">'+note+'</div>';
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}
/* the fluid: a translucent slab from ybot up to the surface yw across [x0, x1] */
function fluidRect(ctx,map,x0,x1,ybot,yw,col){
  const X0=map.X(x0), X1=map.X(x1), Y0=map.Y(yw), Y1=map.Y(ybot);
  ctx.fillStyle=col||rgba(COL.struct,0.16); ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle=rgba(COL.struct,0.8); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y0); ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y0);
}
/* a force arrow whose world length is len x (F / Fref), with its label */
function forceArrow(ctx,W,H,map,at,F,Fref,dir,len,col,txt,labDx){
  const v=[0,dir*len*Math.min(Math.abs(F)/Math.max(Fref,1e-12),1.6)];
  arrowW(ctx,map,at,v,col,2);
  const tip=[at[0]+v[0],at[1]+v[1]];
  if(txt) lab(ctx,W,H,map.X(tip[0])+(labDx===undefined?8:labDx),map.Y(tip[1]),txt,col,LAB_FONT,labDx!==undefined&&labDx<0?'right':'left');
}
/* ================================================================== *
 *  the pool stage, shared by three views, then view A and view B      *
 * ================================================================== */
/* every layout reserves HINT_H at the bottom: the house #hint is HTML at
   bottom:11px and the canvas capture cannot see it, so a caption anchored at
   H - 12 would sit underneath it (Known-bad, wave-on-a-string) */
function layout(ctx,W,H,full,short,nB,frac,nBn){
  const L=stageLayout(ctx,W,H-HINT_H,full,short,nB,frac,nBn);
  /* the caption is painted LAST but occupies the bottom band from the moment
     the layout is known, so its rectangle goes into the registry FIRST — a
     stage label placed near the bottom otherwise dodges nothing and lands on
     the prose (found at 620 x 420) */
  LABELS.push([L.left-2,L.capY-5,L.left+L.capW+2,H-HINT_H-6]);
  return L;
}
/* a label that must be drawn where it is (a tag inside its own block): it is
   painted unconditionally AND registered, so every dodging lab() after it
   moves out of its way instead of landing on top of it */
function labFixed(ctx,x,y,txt,col,font,align,base){
  ctx.fillStyle=col; ctx.font=font;
  ctx.textAlign=align||'center'; ctx.textBaseline=base||'middle';
  const t=plain(txt), fs=parseFloat(font.match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  const lx=align==='right'?x-w:(align==='left'?x:x-w/2);
  const ly=base==='top'?y:(base==='bottom'?y-hh:y-hh/2);
  LABELS.push([lx,ly,lx+w,ly+hh]);
  ctx.fillText(t,x,y);
}
/* axes(), with the TICK LABELS, the axis names and the title registered.
   axesR registers only the title, which left every dodging label free to land
   on a tick (Known-bad: axes() draws its title outside any registry — the same
   argument applies to everything else it draws). */
function axesReg(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  axes(ctx,b,xlo,xhi,ylo,yhi,o);
  const fw=(s,px)=>plain(''+s).length*px*0.52;
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  for(const t of xt){ const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=fw(o.xfmt?o.xfmt(t):fmt(t,2),10.5);
    LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+10.5*1.15]); }
  for(const t of yt){ const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=fw(o.yfmt?o.yfmt(t):fmt(t,2),10.5);
    LABELS.push([b.x-6-w,Y-6.04,b.x-6,Y+6.04]); }
  if(o.xlab){ const w=fw(o.xlab,11); LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+33.65]); }
  if(o.ylab){ const w=fw(o.ylab,11); LABELS.push([b.x-52.65,b.y+b.h/2-w/2,b.x-40,b.y+b.h/2+w/2]); }
  if(o.title){ const w=fw(o.title,13); LABELS.push([b.x,b.y-23.95,b.x+w,b.y-9]); }
}
/* the world the pool stage draws.  'wide' leaves room on the ground to the
   left for a scale with a block standing on it. */
/* The top of the world is only as high as a lifted block can reach (the drag
   is clamped to keep its top inside), because empty sky is height the picture
   could have spent on the pool: at ymax = 0.30 the drawn content filled 62 %
   of the box. */
const POOL_YTOP=0.22, POOL_YTOP_WIDE=0.30;
function poolExtent(kind){
  return kind==='wide'?{xmin:-0.72,xmax:0.60,ymin:-(POOL_H+0.05),ymax:POOL_YTOP_WIDE}
                      :{xmin:-0.58,xmax:0.58,ymin:-(POOL_H+0.05),ymax:POOL_YTOP};
}
/* the highest a block of side s may be held: its top stays inside the world */
function holdCeiling(s){ return POOL_YTOP-s-0.012; }
const GROUND='#20242e', GROUND2='#171b23';
/* A wide stage drawing a nearly square picture at equal aspect (which a pool
   must be — it is a SHAPE) wastes two thirds of its width, so the pool takes
   the left of the stage and the analysis panels stack down the right.  Below
   the narrow threshold the split collapses and only the pool is drawn. */
function splitMain(L,W,fracLeft,nRight){
  const b=L.main;
  if(isNarrow(W)||nRight<1) return {pool:b,rows:[]};
  const gut=70, wl=Math.round(b.w*fracLeft);
  const pool=box(b.x,b.y,Math.max(120,wl-gut/2),b.h);
  const rx=b.x+wl+gut/2, rw=Math.max(150,b.x1-rx);
  const rows=[], slot=b.h/nRight;
  for(let i=0;i<nRight;i++) rows.push(box(rx,b.y+i*slot+26,rw,Math.max(60,slot-70)));
  return {pool:pool,rows:rows};
}

/* the pool seen from the front, in true proportion (a pool is a SHAPE, so the
   two axes share one scale; the scale bar says what it is) */
function drawPoolStage(ctx,W,H,b,yw,blocks,opt){
  opt=opt||{};
  const E=poolExtent(opt.kind), map=worldFitUp(b,E,0.01);
  const gy=E.ymin;
  worldPoly(ctx,map,[[E.xmin,gy],[-POOL_W/2,gy],[-POOL_W/2,0],[E.xmin,0]],GROUND,GROUND2,1);
  worldPoly(ctx,map,[[POOL_W/2,gy],[E.xmax,gy],[E.xmax,0],[POOL_W/2,0]],GROUND,GROUND2,1);
  worldPoly(ctx,map,[[-POOL_W/2,gy],[POOL_W/2,gy],[POOL_W/2,-POOL_H],[-POOL_W/2,-POOL_H]],GROUND,GROUND2,1);
  /* the water */
  fluidRect(ctx,map,-POOL_W/2,POOL_W/2,-POOL_H,yw,rgba(COL.struct,0.17));
  if(opt.bare!==undefined&&Math.abs(opt.bare-yw)>1e-6)
    seg(ctx,map,[-POOL_W/2,opt.bare],[POOL_W/2,opt.bare],rgba(COL.ref,0.75),1.2,[4,3]);
  /* the blocks */
  for(const bk of blocks){
    const s=bk.s, x=bk.x, y0=bk.yb;
    if(bk.mode==='out') continue;
    worldPoly(ctx,map,[[x-s/2,y0],[x+s/2,y0],[x+s/2,y0+s],[x-s/2,y0+s]],bk.col,'#0b0f18',1.4);
    /* the part under water, restated in green — the quantity the sim computes */
    if(bk.Vsub>0){
      const ytop=Math.min(y0+s,yw);
      worldPoly(ctx,map,[[x-s/2,y0],[x+s/2,y0],[x+s/2,ytop],[x-s/2,ytop]],rgba(COL.pos,0.16),null);
    }
    if(bk.tag) labFixed(ctx,map.X(x),map.Y(y0+s/2),bk.tag,'#0b0f18','bold 13px -apple-system, sans-serif','center','middle');
    /* the block's own rectangle goes into the label registry: a force label
       painted over the block it belongs to is unreadable, and with two blocks
       26 px apart there is no room for one between them */
    LABELS.push([map.X(x-s/2),map.Y(y0+s),map.X(x+s/2),map.Y(y0)]);
  }
  return map;
}
/* ONE arrow-length scale for the whole picture (so two blocks' arrows really
   can be compared), chosen so that the longest arrow still fits between the
   pool floor and the top of the drawn world; the labels sit beside the block
   rather than at the arrow tips, which put them inside it. */
function forceScale(blocks,kind){
  const ceil=poolExtent(kind).ymax-0.012, floor=-POOL_H-0.018;
  let room=1, Fref=1;
  for(const b of blocks){
    const cy=b.yb+b.s/2; room=Math.min(room,cy-floor,ceil-cy);
    Fref=Math.max(Fref,b.W,b.Fb,Math.abs(b.mode==='held'?b.hand:b.N));
  }
  /* the reference force is computed HERE, with the length, so that a draw call
     cannot hand one block its own weight as the scale and quietly make the
     arrows incomparable */
  return {len:Math.max(0.035,Math.min(0.13,room)),Fref:Fref};
}
/* the drawn length of each arrow, lifted OUT of the draw call so the one
   scale can be asserted: a quantity only the picture can check is in the
   wrong layer (Known-bad, sbs_sims) */
function forceLengths(bk,FS){
  const Fref=FS.Fref, len=FS.len;
  const fr=f=>Math.min(Math.abs(f)/Math.max(Fref,1e-12),1);
  const extra=bk.mode==='held'?bk.hand:bk.N;
  return {W:len*fr(bk.W),Fb:len*fr(bk.Fb),extra:len*fr(extra),sign:extra>0?1:-1,raw:extra};
}
function drawForces(ctx,W,H,map,bk,FS,opt){
  opt=opt||{};
  const cx=bk.x, s=bk.s, cy=bk.yb+s/2, A=forceLengths(bk,FS);
  arrowW(ctx,map,[cx-0.22*s,cy],[0,-A.W],COL.ref,2);
  arrowW(ctx,map,[cx+0.22*s,cy],[0,A.Fb],COL.pos,2);
  const extra=A.raw;
  if(Math.abs(extra)>1e-9)
    arrowW(ctx,map,[cx+0.55*s+0.012,cy],[0,A.sign*A.extra],COL.live,2);
  if(!opt.labels) return;
  lab(ctx,W,H,map.X(cx-s/2)-8,map.Y(cy)-11,'W '+fmt(bk.W,1)+' N',COL.ref,SM_FONT,'right');
  lab(ctx,W,H,map.X(cx+s/2)+10,map.Y(cy)-11,'Fb '+fmt(bk.Fb,1)+' N',COL.pos,SM_FONT,'left');
  if(Math.abs(extra)>1e-9)
    lab(ctx,W,H,map.X(cx+s/2)+10,map.Y(cy)+11,(bk.mode==='held'?'hand ':'N ')+fmt(Math.abs(extra),1)+' N',
        COL.live,SM_FONT,'left');
}

/* ================================================================== *
 *  view: the pool  (PhET's Intro screen)                              *
 * ================================================================== */
const POOL_CAP_FULL='PhET&rsquo;s Intro screen. One or two cubes in a '+fmt(POOL_W*100,0)+' × '+fmt(POOL_D*100,0)
  +' × '+fmt(POOL_H*100,1)+' cm pool holding '+fmt(VF0*LITERS,0)+' L of water. Pick the material and the '
  +'density is fixed, so mass and volume move together (m = ρV); pick <i>custom</i> and they come apart and the '
  +'density follows. The pool is drawn in true proportion &mdash; both axes at the same scale &mdash; and the green wash '
  +'is the submerged part, whose volume is what the upthrust weighs. The dashed orange line is where the water stood '

const POOL_CAP_SHORT='PhET&rsquo;s Intro screen: cubes in a 100 L pool, true proportion, green = the submerged part, '
  +'dashed orange = the level before. Drag a block.';

function poolGeo(ctx,W,H,M){
  const L=layout(ctx,W,H,POOL_CAP_FULL,POOL_CAP_SHORT,0,0,0);
  const SP=splitMain(L,W,0.60,2);
  return {L:L,SP:SP,map:worldFitUp(SP.pool,poolExtent(),0.01)};
}
/* the three forces as bars, one group per block */
function drawForceBars(ctx,W,H,b,blocks,Fref){
  const n=blocks.length, gh=Fref*1.15;
  axesReg(ctx,b,0,n*3+1,0,gh,{title:titleFor(b,'weight, upthrust, and what the floor takes','the forces'),
    ylab:'newtons',nx:1,ny:5,xticks:[],yfmt:t=>fmt(t,0)});
  blocks.forEach((bk,i)=>{
    const base=i*3+1;
    const bars=[[base,bk.W,COL.ref,'W'],[base+0.75,bk.Fb,COL.pos,'Fb'],
                [base+1.5,bk.mode==='held'?Math.abs(bk.hand):bk.N,COL.live,bk.mode==='held'?'hand':'N']];
    for(const bar of bars){
      const X=b.x+b.w*bar[0]/(n*3+1), Wd=b.w*0.6/(n*3+1);
      const Yv=b.y1-b.h*clamp(bar[1],0,gh)/gh;
      ctx.fillStyle=rgba(bar[2],0.55); ctx.fillRect(X,Yv,Wd,b.y1-Yv);
      ctx.strokeStyle=bar[2]; ctx.lineWidth=1.2; ctx.strokeRect(X,Yv,Wd,b.y1-Yv);
      lab(ctx,W,H,X+Wd/2,Yv-8,bar[3],bar[2],SM_FONT,'center');
    }
    lab(ctx,W,H,b.x+b.w*(base+0.75)/(n*3+1),b.y1+13,bk.tag,'#aeb6c6',LAB_FONT,'center');
  });
}
function drawPoolView(ctx,W,H,M,st){
  st=st||ST;
  const G2=poolGeo(ctx,W,H,M), L=G2.L, SP=G2.SP;
  /* the right column goes FIRST so that its axis names and tick labels are in
     the registry before any stage label is placed; otherwise a stage label
     dodges nothing and lands on a neighbouring panel's ticks (Known-bad: a
     panel's tick gutter is part of its footprint) */
  if(SP.rows.length>1){
    const b1=SP.rows[0], maxL=24;
    const xs=[], ys=[];
    for(let i=0;i<=40;i++){ const q=maxL*i/40; xs.push(q); ys.push(100*(M.bare+POOL_H+q/LITERS/A_POOL)); }
    const ylo=100*(M.bare+POOL_H), yhi=ys[ys.length-1];
    axesReg(ctx,b1,0,maxL,ylo-0.4,yhi+0.4,{title:titleFor(b1,'the level rises by V/A','the level'),
      xlab:'litres pushed aside',ylab:'level above the floor, cm',nx:5,ny:5,
      xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    polyline(ctx,b1,xs,ys,0,maxL,ylo-0.4,yhi+0.4,COL.pos,1.8);
    marker(ctx,b1,0,maxL,ylo-0.4,yhi+0.4,M.VfDisp*LITERS,100*(M.yw+POOL_H),COL.live);
    lab(ctx,W,H,b1.x1-6,b1.y+12,'slope 1/A = '+fmt(100/A_POOL/LITERS,3)+' cm per litre',COL.pos,SM_FONT,'right');
    drawForceBars(ctx,W,H,SP.rows[1],M.blocks,forceScale(M.blocks).Fref);
  }
  const map=drawPoolStage(ctx,W,H,SP.pool,M.yw,M.blocks,{bare:M.bare});
  if(st.forces){
    const FS=forceScale(M.blocks);
    for(const b of M.blocks) drawForces(ctx,W,H,map,b,FS,{labels:st.levels});
    lab(ctx,W,H,map.X(POOL_W/2)-6,map.Y(0.035),'arrows to one scale: the longest is '+fmt(FS.Fref,1)+' N',
        COL.dim,SM_FONT,'right');
  }
  /* the waterline, named INSIDE the water so a block above it cannot clash */
  lab(ctx,W,H,map.X(-POOL_W/2)+7,map.Y(-POOL_H+0.022),'water '+fmt((M.yw+POOL_H)*A_POOL*LITERS,1)+' L',COL.struct,LAB_FONT,'left');
  const x0=POOL_W/2-0.1;
  seg(ctx,map,[x0,-POOL_H-0.028],[x0+0.1,-POOL_H-0.028],COL.dim,1.4);
  lab(ctx,W,H,map.X(x0+0.05),map.Y(-POOL_H-0.028)+11,'10 cm',COL.dim,SM_FONT,'center');
  if(M.blocks.some(b=>b.mode==='held'))
    lab(ctx,W,H,map.X(0),map.Y(POOL_YTOP-0.015),'held — let go and it returns to equilibrium',COL.live,LAB_FONT,'center');

  drawCaption(ctx,L);
}

 *  view: the sets  (PhET's Compare screen)                            *

const SETS_CAP_FULL='PhET&rsquo;s Compare screen. Four blocks matched in one of the three quantities, with that '
  +'quantity on the slider and the other two forced by ρ = m/V. Matched in MASS the big ones are the light ones; '
  +'matched in VOLUME the big reading on the scale is the dense one; matched in DENSITY every one of them floats to '
  +'exactly the same fraction of its own side, whatever its size &mdash; which is the floating law with the size '
  +'divided out. The panel beside it is the mass-volume plane: a matched set is a straight line through it, horizontal, '
  +'vertical, or through the origin.';
const SETS_CAP_SHORT='PhET&rsquo;s Compare screen: four blocks matched in mass, volume or density, and the same four '
  +'as points in the mass-volume plane.';

function setsGeo(ctx,W,H,M){
  const L=layout(ctx,W,H,SETS_CAP_FULL,SETS_CAP_SHORT,0,0,0);
  const SP=splitMain(L,W,0.60,1);
  return {L:L,SP:SP,map:worldFitUp(SP.pool,poolExtent(),0.01)};
}
function drawSetsView(ctx,W,H,M,st){
  st=st||ST;

  const b1=SP.rows[0];
  if(b1){
    const xmax=VMAX_L*1.05, ymax=Math.max(12,Math.max.apply(null,M.blocks.map(b=>b.m))*1.25);
    axesReg(ctx,b1,0,xmax,0,ymax,{title:titleFor(b1,'the same four blocks in the mass-volume plane','mass and volume'),
      xlab:'volume, litres',ylab:'mass, kg',nx:6,ny:5,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    /* water's ray, the reference that decides everything */
    polyline(ctx,b1,[0,xmax],[0,xmax*RHO_WATER/LITERS],0,xmax,0,ymax,COL.ref,1.4,[5,4]);
    lab(ctx,W,H,b1.x+b1.w*0.72,b1.y1-b1.h*(0.72*xmax*RHO_WATER/LITERS)/ymax-10,'water, 1 kg per litre',COL.ref,SM_FONT,'left');
    /* the line the matched set lies on */

    if(st.setMode==='mass') polyline(ctx,b1,[0,xmax],[st.sameMass,st.sameMass],0,xmax,0,ymax,COL.pos,1.6);
    else if(st.setMode==='volume') polyline(ctx,b1,[st.sameVolL,st.sameVolL],[0,ymax],0,xmax,0,ymax,COL.pos,1.6);
    else polyline(ctx,b1,[0,xmax],[0,xmax*st.sameRho/LITERS],0,xmax,0,ymax,COL.pos,1.6);

      lab(ctx,W,H,b1.x+b1.w*(bk.V*LITERS)/xmax+8,b1.y1-b1.h*bk.m/ymax-2,bk.tag,bk.col,SM_FONT,'left');
    }
  }
  const map=drawPoolStage(ctx,W,H,SP.pool,M.yw,M.blocks,{});
  M.blocks.forEach(bk=>{
    lab(ctx,W,H,map.X(bk.x),map.Y(bk.yb+bk.s)-11,sigf(bk.rho,4),bk.mode==='float'?COL.pos:COL.ref,SM_FONT,'center');
  });
  lab(ctx,W,H,map.X(-POOL_W/2)+7,map.Y(-POOL_H+0.022),'water',COL.struct,LAB_FONT,'left');
  if(M.nNeutral>0)
    lab(ctx,W,H,map.X(0),map.Y(0.045),'one block is exactly water: it neither floats nor presses on the floor',COL.live,LAB_FONT,'center');

  drawCaption(ctx,L);
}
/* ================================================================== *

const MYS_CAP_FULL='PhET&rsquo;s Mystery screen. Five unlabelled blocks, a scale in kilograms and a pool with litre '
  +'marks: weigh one, measure the water it pushes aside, divide, and read the name off the table. The catch is real '
  +'physics and the switch below makes it &mdash; a FLOATING block pushes aside its own WEIGHT of water, not its own '
  +'volume, so left alone every floating block measures as water and the answer is wrong. Push it under and the '
  +'displaced volume is the block&rsquo;s volume. The axis below is density on a log scale: orange are the table’s '
  +'thirteen materials, magenta the five readings.';
const MYS_CAP_SHORT='PhET&rsquo;s Mystery screen: weigh, displace, divide, read the table. A floating block must be '
  +'pushed under first, or it measures as water.';

function mysGeo(ctx,W,H,M){
  const L=layout(ctx,W,H,MYS_CAP_FULL,MYS_CAP_SHORT,0,0,0);
  const SP=splitMain(L,W,0.62,1);
