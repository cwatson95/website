/* scientific notation the canvas can draw and the readout can set */
const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
            '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function supTxt(n){ return String(n).split('').map(c=>SUPS[c]||'').join(''); }
function sciParts(x,n){
  const e=Math.floor(Math.log10(Math.abs(x)));
  return [sigf(x/Math.pow(10,e),n||4),e];
}
function sciTxt(x,n){
  if(x===0) return '0';
  if(!isFinite(x)) return '∞';
  if(Math.abs(x)>=1e-3&&Math.abs(x)<1e5) return sigf(x,n||4);
  const p=sciParts(x,n); return p[0]+'×10'+supTxt(p[1]);
}
function sciHTML(x,n){
  if(x===0) return '0';
  if(!isFinite(x)) return '&infin;';
  if(Math.abs(x)>=1e-3&&Math.abs(x)<1e5) return sigf(x,n||4);
  const p=sciParts(x,n); return p[0]+'&times;10<sup>'+p[1]+'</sup>';
}
function pow10(e){ return '10'+supTxt(Math.round(e)); }

/* ================================================================== *
 *  drawing helpers (y UP in world maps; layouts built bottom-up from *
 *  a measured caption) — from projects/simulations/build_buoy/       *
 *  p4_views.js by name, unchanged (make_helpers.py)                  *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the pieces every view draws: the pressure field, the air parcels,  *
 *  the speakers, the wall and its image source, the listener, PhET's  *
 *  ruler and stopwatch, and the two graphs                            *
 * ================================================================== */
const NLEV=49, HALF=24;                  /* 49 contrast classes, ambient on the middle one */
function levelOf(v){ const t=v/U_FULL; return Math.round(((t<-1?-1:(t>1?1:t))+1)*HALF); }
let LEVEL_COLS=null;
function levelCols(){
  if(LEVEL_COLS) return LEVEL_COLS;
  const out=[];
  for(let q=0;q<NLEV;q++) out.push(mix(COL.air0,COL.air1,q/(NLEV-1)));
  return LEVEL_COLS=out;
}
/* one fill per contrast class, runs merged along each row, pixel-snapped.  Cells
   the wall hides are not drawn at all — PhET leaves them blank too. */
function drawField(ctx,sq,M){
  const V=LAT.VIS, g=M.g, v=g.v, mk=g.mask, cols=levelCols(), cs=sq.w/V;
  const full=(g.nfront===V*V);
  ctx.fillStyle=full?cols[HALF]:COL.off; ctx.fillRect(sq.x,sq.y,sq.w,sq.h);
  const rects=[]; for(let q=0;q<NLEV;q++) rects.push([]);
  let nCells=0;
  const cls=q=>mk[q]?levelOf(v[q]):-1;
  for(let j=0;j<V;j++){
    const row=j*V, y0=Math.round(sq.y+j*cs), y1=Math.round(sq.y+(j+1)*cs);
    let i=0;
    while(i<V){
      const q=cls(row+i);
      let e=i+1;
      while(e<V&&cls(row+e)===q) e++;
      if(q>=0&&!(full&&q===HALF)){ rects[q].push(Math.round(sq.x+i*cs),y0,Math.round(sq.x+e*cs),y1); nCells+=e-i; }
      i=e;
    }
  }
  for(let q=0;q<NLEV;q++){ const r=rects[q]; if(!r.length) continue;
    ctx.beginPath(); for(let k=0;k<r.length;k+=4) ctx.rect(r[k],r[k+1],r[k+2]-r[k],r[k+3]-r[k+1]);
    ctx.fillStyle=cols[q]; ctx.fill(); }
  return nCells;
}
/* a label over the pressure field needs its own dark backing: the field's ambient is a
   mid grey, and orange or green on it is unreadable */
function labOver(ctx,W,H,x,y,txt,col,align){
  const t=plain(txt), w=t.length*10.5*0.56+10;
  const lx=(align==='right')?x-w+5:((align==='center')?x-w/2:x-5);
  ctx.fillStyle='rgba(7,11,24,.74)'; ctx.fillRect(lx,y-8,w,16);
  return lab(ctx,W,H,x,y,txt,col,SM_FONT,align||'left');
}
function cellPx(sq,i){ return sq.x+(i+0.5)*sq.w/LAT.VIS; }
function mx(sq,x){ return sq.x+sq.w*x/AIR.W; }             /* model metres -> screen */
function my(sq,y){ return sq.y+sq.h*y/AIR.W; }
/* the marked parcel is deliberately NOT the middle one: the listener stands there */
const PARC_MARK=12*(PARC_N+1)+6;
function drawParcels(ctx,sq,M){
  const P=M.parcels, cs=sq.w/LAT.VIS, MARK=PARC_MARK, onField=(ST.look!=='particles');
  ctx.beginPath();
  for(let q=0;q<P.length;q++){
    if(q===MARK||!P[q][2]) continue;
    const x=sq.x+(P[q][0]+0.5)*cs, y=sq.y+(P[q][1]+0.5)*cs;
    if(x<sq.x||x>sq.x1||y<sq.y||y>sq.y1) continue;
    ctx.moveTo(x+2.1,y); ctx.arc(x,y,2.1,0,TAU);
  }
  ctx.fillStyle=onField?'#101520':'#d6dae4'; ctx.fill();
  const c=P[MARK];
  if(c&&c[2]) dot(ctx,sq.x+(c[0]+0.5)*cs,sq.y+(c[1]+0.5)*cs,3.4,COL.struct,onField?'#0b0e16':'#ffffff',1.4);
}
/* PhET's loudspeaker, drawn outside the box on its own row, its cone magenta
   while the source is running */
const SPK_W=46, SPK_H=34, BTN_R=9;
function speakerGeo(sq,M,k){
  const y=my(sq,M.speakers[k][1]), x1=sq.x-10, x0=x1-SPK_W;
  return {x0,x1,y,sx:mx(sq,M.speakers[k][0]),btn:{x:(x0+x1)/2,y:y+SPK_H/2+14,r:BTN_R}};
}
function drawSpeaker(ctx,W,H,sq,M,k){
  const g=speakerGeo(sq,M,k), on=M.active, x0=g.x0, x1=g.x1, y=g.y;
  const poly=pts=>{ ctx.beginPath(); pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
    ctx.closePath(); ctx.fill(); ctx.stroke(); };
  ctx.fillStyle='#161c2c'; ctx.strokeStyle=COL.struct; ctx.lineWidth=1.3;
  poly([[x0,y-9],[x0+16,y-9],[x0+16,y+9],[x0,y+9]]);                    /* the box */
  poly([[x0+16,y-7],[x1,y-15],[x1,y+15],[x0+16,y+7]]);                  /* the cone */
  /* the cone pushes forward with the drive, so the picture and the field agree */
  const push=clamp(M.R.val/(AIR.ampMax*LAT.AMP_CAL),-1,1)*5;
  ctx.beginPath(); ctx.moveTo(x1+push,y-15); ctx.lineTo(x1+push,y+15);
  ctx.strokeStyle=on?COL.live:'#3a4254'; ctx.lineWidth=2.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(g.sx,y);
  ctx.strokeStyle=on?rgba(COL.live,0.7):'#3a4254'; ctx.lineWidth=1.4; ctx.stroke();
  dot(ctx,g.sx,y,4.5,on?COL.live:'#3a4254','#ffffff',1.2);
  if(k===0){
    dot(ctx,g.btn.x,g.btn.y,g.btn.r,on?COL.live:'#141a28',on?'#ffffff':COL.live,1.6);
    lab(ctx,W,H,g.btn.x,g.btn.y+g.btn.r+9,ST.wave==='pulse'?'fire':(on?'on':'off'),
        on?COL.live:'#8b93a6',SM_FONT,'center');
  }
}
/* the wall: the line itself, the solid it stands for, the image speaker, and the
   ray that goes speaker -> wall -> listener with its two equal angles */
function wallEnds(G){
  /* where the wall line meets the box, in model coordinates */
  const pts=[];
  const add=(x,y)=>{ if(x>=-1e-9&&x<=AIR.W+1e-9&&y>=-1e-9&&y<=AIR.W+1e-9) pts.push([x,y]); };
  if(Math.abs(G.dyh)>1e-12){ add(G.ax+(0-G.ay)*G.dxh/G.dyh,0); add(G.ax+(AIR.W-G.ay)*G.dxh/G.dyh,AIR.W); }
  if(Math.abs(G.dxh)>1e-12){ add(0,G.ay+(0-G.ax)*G.dyh/G.dxh); add(AIR.W,G.ay+(AIR.W-G.ax)*G.dyh/G.dxh); }
  if(pts.length<2) return null;
  let best=[pts[0],pts[1]], bd=-1;
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);
    if(d>bd){ bd=d; best=[pts[i],pts[j]]; }
  }
  return best;
}
function drawWall(ctx,W,H,sq,M){
  const G=M.G, e=wallEnds(G);
  if(!e) return;
  const A=[mx(sq,e[0][0]),my(sq,e[0][1])], B=[mx(sq,e[1][0]),my(sq,e[1][1])];
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]);
  ctx.strokeStyle=COL.wall; ctx.lineWidth=4; ctx.lineCap='butt'; ctx.stroke();
  ctx.lineWidth=1;
  /* hatching on the dead side, one short stroke per metre of wall */
  const n=Math.max(2,Math.round(Math.hypot(B[0]-A[0],B[1]-A[1])/13));
  const hx=G.nxh*9, hy=G.nyh*9;
  ctx.beginPath();
  for(let q=0;q<=n;q++){
    const t=q/n, X=A[0]+(B[0]-A[0])*t, Y=A[1]+(B[1]-A[1])*t;
    ctx.moveTo(X,Y); ctx.lineTo(X+hx,Y+hy);
  }
  ctx.strokeStyle=rgba(COL.wall,0.55); ctx.stroke();
}
function drawImageRay(ctx,W,H,sq,M){
  const Wl=M.wall, s=M.speakers[0], L=M.listener;
  if(!Wl) return;
  const im=Wl.image, IX=mx(sq,im[0]), IY=my(sq,im[1]);
  /* the image speaker, outside the box if the wall is far: clamped and labelled */
  const cx=clamp(IX,sq.x+4,sq.x1-4), cy=clamp(IY,sq.y+4,sq.y1-4), out=(cx!==IX||cy!==IY);
  ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(mx(sq,s[0]),my(sq,s[1])); ctx.lineTo(cx,cy);
  ctx.strokeStyle=rgba(COL.ref,0.5); ctx.lineWidth=1.2; ctx.stroke();
  ctx.setLineDash([]);
  dot(ctx,cx,cy,5.5,'#141a28',COL.ref,1.8);
  /* hang the label on whichever side has room INSIDE the box: pushed against the
     right edge it would otherwise run out over the listener's chart */
  const txt=out?'image speaker (off the box)':'image speaker';
  if(cx>sq.x1-150) labOver(ctx,W,H,cx-9,cy-10,txt,COL.ref,'right');
  else labOver(ctx,W,H,cx+9,cy-10,txt,COL.ref,'left');
  if(!Wl.bounce||!ST.listener) return;
  const Q=Wl.bounce, QX=mx(sq,Q[0]), QY=my(sq,Q[1]);
  const SX=mx(sq,s[0]), SY=my(sq,s[1]), LX=mx(sq,L.x), LY=my(sq,L.y);
  ctx.beginPath(); ctx.moveTo(SX,SY); ctx.lineTo(QX,QY); ctx.lineTo(LX,LY);
  ctx.strokeStyle=COL.pos; ctx.lineWidth=1.6; ctx.stroke();
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(SX,SY); ctx.lineTo(LX,LY);
  ctx.strokeStyle=rgba(COL.struct,0.7); ctx.lineWidth=1.2; ctx.stroke();
  ctx.setLineDash([]);
  /* the normal at the bounce, and the two angles it makes */
  const nx0=M.G.nxh*26, ny0=M.G.nyh*26;
  ctx.beginPath(); ctx.moveTo(QX-nx0,QY-ny0); ctx.lineTo(QX+nx0*0.35,QY+ny0*0.35);
  ctx.strokeStyle=rgba('#ffffff',0.55); ctx.lineWidth=1; ctx.stroke();
  dot(ctx,QX,QY,3.2,COL.pos);
  /* keep the two angles INSIDE the box: with the wall laid flat the bounce sits on the
     floor of it, and a label hung below would land on the graph panel's title */
  const ay=(QY>sq.y1-30)?QY-13:QY+13;
  labOver(ctx,W,H,QX+7,ay,sigf(Wl.aIn/DEG,3)+'° = '+sigf(Wl.aOut/DEG,3)+'°',COL.pos,'left');
}
/* the listener: a head with one ear turned toward the sound */
function drawListener(ctx,W,H,sq,M){
  const L=M.listener, X=mx(sq,L.x), Y=my(sq,L.y);
  const loud=clamp(L.amp/U_FULL,0,1);
  ctx.beginPath(); ctx.arc(X,Y,9,0,TAU);
  ctx.fillStyle=rgba(COL.live,0.16+0.5*loud); ctx.fill();
  ctx.strokeStyle=COL.live; ctx.lineWidth=1.8; ctx.stroke();
  ctx.beginPath(); ctx.arc(X-3,Y,4.5,-1.1,1.1);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.3; ctx.stroke();
  if(!L.inFront) lab(ctx,W,H,X+13,Y,'in the shadow',COL.ref,SM_FONT,'left');
}
/* PhET's ruler: rigid, 5 m long, dragged by its body */
function rulerGeo(sq){
  const x0=mx(sq,TOOLS.ruler[0]), x1=mx(sq,TOOLS.ruler[0]+RULER_LEN), y=my(sq,TOOLS.ruler[1]);
  return {x0,x1,y,h:26};
}
/* the ruler's own rectangle, RESERVED before any overlay label is placed: its tick
   numbers are painted straight (they must stay on their ticks), so a label that lands
   on the ruler has nothing to dodge unless the rectangle is registered first */
function rulerRect(sq){ const g=rulerGeo(sq); return [g.x0,g.y-g.h/2,g.x1,g.y+g.h/2]; }
function drawRuler(ctx,W,H,sq,M){
  const g=rulerGeo(sq);
  ctx.fillStyle='rgba(241,231,176,.93)'; ctx.fillRect(g.x0,g.y-g.h/2,g.x1-g.x0,g.h);
  ctx.strokeStyle='#8b7f4a'; ctx.lineWidth=1; ctx.strokeRect(g.x0,g.y-g.h/2,g.x1-g.x0,g.h);
  ctx.beginPath();
  for(let q=0;q<=RULER_LEN*4;q++){
    const X=g.x0+(g.x1-g.x0)*q/(RULER_LEN*4), big=(q%4===0);
    ctx.moveTo(X,g.y-g.h/2); ctx.lineTo(X,g.y-g.h/2+(big?11:6));
  }
  ctx.strokeStyle='#4a4430'; ctx.lineWidth=1; ctx.stroke();
  ctx.font='9.5px -apple-system, sans-serif'; ctx.fillStyle='#4a4430';
  ctx.textAlign='center'; ctx.textBaseline='top';
  /* PhET puts the unit where the last major tick label would go (unitsMajorTickIndex),
     which keeps the whole instrument inside its own rectangle.  How many wavelengths
     fit on it is in the readout, not painted beside the ruler: a caption hung under
     a draggable object has nowhere safe to go (it collided with the tick numbers). */
  for(let q=0;q<=RULER_LEN;q++)
    ctx.fillText(q<RULER_LEN?String(q):'m',g.x0+(g.x1-g.x0)*q/RULER_LEN,g.y-g.h/2+12);
}
/* the pressure along the speaker's row, in metres */
function drawAxisGraph(ctx,W,H,b,M){
  const V=LAT.VIS, g=M.g, xs=[], ys=[], j=clamp(M.rows[0]-M.R.lat.pad,0,V-1);
  for(let i=0;i<V;i++){ xs.push((i+0.5)*sceneDx()); ys.push(g.mask[j*V+i]?g.v[j*V+i]:NaN); }
  const Y=1.6*U_FULL;
  axesR(ctx,b,0,AIR.W,-Y,Y,{nx:6,ny:3,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1),
    title:titleFor(b,'pressure along the speaker’s row — one wavelength is '+lenM(M.lam),'pressure along the row'),
    xlab:'distance across the box, m'});
  polyline(ctx,b,xs,ys,0,AIR.W,-Y,Y,COL.pos,1.5);
  /* one wavelength, marked from the first crest past the source */
  const i0=Math.round(cellOfX(M.R,M.speakers[0][0]))-M.R.lat.pad;
  let cr=-1;
  for(let i=i0+3;i<V-2;i++) if(ys[i]>ys[i-1]&&ys[i]>=ys[i+1]&&ys[i]>0.15*U_FULL){ cr=i; break; }
  const px=x=>b.x+b.w*x/AIR.W;
  if(cr>0&&(cr+0.5)*sceneDx()+M.lam<AIR.W){
    const xa=px((cr+0.5)*sceneDx()), xb=px((cr+0.5)*sceneDx()+M.lam), ya=b.y+b.h*0.17;
    ctx.beginPath(); ctx.moveTo(xa,ya); ctx.lineTo(xb,ya);
    ctx.moveTo(xa,ya); ctx.lineTo(xa+6,ya-4); ctx.moveTo(xa,ya); ctx.lineTo(xa+6,ya+4);
    ctx.moveTo(xb,ya); ctx.lineTo(xb-6,ya-4); ctx.moveTo(xb,ya); ctx.lineTo(xb-6,ya+4);
    ctx.strokeStyle=COL.live; ctx.lineWidth=1.5; ctx.stroke();
    lab(ctx,W,H,(xa+xb)/2,ya-11,'λ = '+lenM(M.lam),COL.live,SM_FONT,'center');
  }
}
/* the listener's pressure against time, over the last few periods */
function drawTrace(ctx,W,H,b,M){
  const P=PROBE, n=P.count, Y=1.6*U_FULL, xs=[], ys=[];
  const win=P.n*M.dt;
  for(let q=0;q<n;q++){
    const idx=(P.head-n+q+2*P.n)%P.n;
    xs.push((q-n+1)*M.dt*1000); ys.push(P.buf[idx]);
  }
  axesR(ctx,b,-win*1000,0,-Y,Y,{nx:4,ny:3,xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,1),
    title:titleFor(b,'pressure at the listener over the last period','at the listener'),
    xlab:'time before now, ms'});
  polyline(ctx,b,xs,ys,-win*1000,0,-Y,Y,COL.live,1.6);
  const a=M.listener.amp;
  polyline(ctx,b,[-win*1000,0],[a,a],-win*1000,0,-Y,Y,COL.ref,1.2,[4,3]);
  polyline(ctx,b,[-win*1000,0],[-a,-a],-win*1000,0,-Y,Y,COL.ref,1.2,[4,3]);
  lab(ctx,W,H,b.x+5,b.y+11,'amplitude '+sigf(a,3),COL.ref,SM_FONT,'left');
}
/* the honest half of the Air Pressure screen: what removing the air does to the SPEED
   (nothing) and to the loudness (everything).  c = sqrt(gamma p / rho) and p and rho fall
   together at fixed temperature, so the orange line is flat across the whole slider. */
function drawAirPanel(ctx,W,H,b,M){
  const xs=[], vs=[], as=[];
  for(let q=0;q<=60;q++){
    const fr=q/60;
    xs.push(fr);
    vs.push(soundSpeedIdeal(GAS.T0)/soundSpeedIdeal(GAS.T0));    /* = 1 at every density */
    as.push(fr);                                                  /* p_amp / p_amp(1 atm) */
  }
  /* no y tick at 0: its label sits exactly where the x axis's own 0 goes, and the two
     collide in the corner at every panel size */
  axesR(ctx,b,0,1,0,1.12,{nx:5,yticks:[0.25,0.5,0.75,1],xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,2),
    title:titleFor(b,'take the air away: the speed does not move, the loudness does','speed and loudness'),
    xlab:'air density in the box, atm'});
  polyline(ctx,b,xs,as,0,1,0,1.12,COL.pos,1.8);
  polyline(ctx,b,xs,vs,0,1,0,1.12,COL.ref,1.8);
  const fr=M.air?M.air.frac:1;
  polyline(ctx,b,[fr,fr],[0,1.12],0,1,0,1.12,rgba(COL.live,0.7),1.2,[4,3]);
  marker(ctx,b,0,1,0,1.12,fr,fr,COL.live);
  const lb=legendAuto(ctx,b,[[COL.ref,'speed / its 1 atm value'],[COL.pos,'pressure amplitude / its 1 atm value']]);
  if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]);
  lab(ctx,W,H,b.x+b.w*fr+7,b.y+13,fr>0?sigf(dbOf(fr),3)+' dB':'silent',COL.live,SM_FONT,'left');
}


/* ================================================================== *
 *  the views: PhET's five screens (the speaker, the bench, two        *
 *  speakers, the wall, thin air) and one analysis view of its own     *
 * ================================================================== */
function boxGeo(ctx,W,H,M){
  const narrow=isNarrow(W), top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-RO_W-44)-56));
  const fit=fitCaption(ctx,W,H-HINT_H,boxCaption(M,true),boxCaption(M,false),capW,top+220);
  const avail=fit.capY-18-top;
  /* the air view always gets a panel under the box: with the row graph off it carries the
     point of that screen — the speed against the density — which is the one thing the
     picture itself cannot show */
  const wantG=ST.graph||M.view==='air', wantT=ST.listener&&!narrow;
  let gH=wantG?Math.max(70,Math.min(140,Math.round(avail*0.22))):0;
  const gGap=44;
  const below=()=>Math.max(gH?gH+gGap+38:0, SPK_H/2+14+BTN_R+16);
  if(gH&&avail-below()<170) gH=0;
  const left=SPK_W+22;
  const rightNeed=(wantT?(narrow?0:210):0);
  const side=Math.max(110,Math.floor(Math.min(avail-below(), W-left-30-rightNeed, narrow?W:W*0.62)));
  const sq=box(left,top,side,side);
  const G={sq,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,narrow};
  if(wantG&&gH) G.gb=box(sq.x,sq.y1+gGap,sq.w,gH);
  G.graphDropped=wantG&&!gH;
  /* the listener's trace goes below the floating readout, which the audit takes to
     reach y = 470: its TITLE sits 24 px above the panel, so the panel starts at 502 */
  if(wantT){
    const x0=Math.max(sq.x1+60,sq.x1+40), y0=502, y1=fit.capY-44;
    if(W-24-x0>=160&&y1-y0>=70) G.tb=box(x0,y0,W-24-x0,y1-y0);
  }
  return G;
}
function boxCaption(M,full){
  const base='PhET’s wave area: '+fmt(AIR.W,0)+' m across, '+LAT.VIS+' lattice cells of '
    +sigf(M.dx*100,3)+' cm; white is a compression, black a rarefaction, and ±'+fmt(U_FULL,1)
    +' in lattice units is full contrast.';
  if(!full) return base;
  let s=base+' One hard source drives the cell in front of the speaker at 1.2 × the amplitude (PhET’s value); the waves leave through the absorbing edge 20 cells beyond the frame.';
  if(!M.active) s+=(ST.wave==='pulse'?' No pulse is running — press the button to fire one.':' The speaker is off — press its button. The sound already made carries on without it.');
  if(M.R.A===0) s+=' The amplitude is zero: the speaker is running and moving nothing.';
  if(ST.look!=='waves') s+=' The air parcels are pushed along ∇p (ξ = ∇p/ρω², exaggerated so that a full-contrast wave moves one '+fmt(PARC_PUSH,2)+' of the parcel spacing): they crowd where the pressure is high and never travel with the wave, and the cyan one is there to be watched jiggling in place.';
  if(M.view==='two') s+=' The two speakers are the same lattice field read at two rows, which is exact because the equation is linear. Orange: the quiet hyperbolae |r₁ − r₂| = (m + ½)λ, and dotted, the far-field asymptote of the outermost one, at d sinθ = (m + ½)λ.';
  if(M.view==='wall') s+=' Nothing is drawn behind the wall. Orange marks the speaker’s mirror image, whose sound IS the reflected sound; green is the ray that reaches the listener off the wall, with the two angles printed at the bounce.';
  if(M.view==='air') s+=' The air density scales the drive, as PhET’s pressure does; the sound already in the box keeps going, and only new sound is quieter. The panel below is the point of this screen: the wavefronts keep their spacing however thin the air gets, because c = √(γp/ρ) and p and ρ fall together.';
  if(M.view==='measure') s+=' The ruler is PhET’s, 5 m long and rigid; drag it across the crests. The stopwatch runs in the sim’s own slowed time, which is '+fmt(1/AIR.phetTimeScale,0)+' × slower than real.';
  return s;
}
/* the quiet hyperbolae of two sources, clipped to the box by polyline() */
function drawNodes(ctx,W,H,sq,M){
  const T=M.two, lam=M.lam;
  if(!T||!T.orders.length) return;
  for(const m of T.orders){
    for(const sgn of [1,-1]){
      const xs=[], ys=[];
      for(let q=0;q<=90;q++){
        const x=AIR.W*q/90-T.xs;
        if(x<0) continue;
        const y=nodeY(m,lam,T.d,x);
        if(!isFinite(y)) continue;
        xs.push(T.xs+x); ys.push(T.ym+sgn*y);
      }
      polyline(ctx,box(sq.x,sq.y,sq.w,sq.h),xs,ys,0,AIR.W,AIR.W,0,rgba(COL.ref,0.85),1.3);
    }
  }
  /* ONE asymptote pair, for the widest branch: drawn for every order they are
     indistinguishable from the hyperbolae they belong to and the picture is a fan */
  const mL=T.orders[T.orders.length-1], thL=nodeFarAngle(mL,lam,T.d);
  if(isFinite(thL)){
    const a=(mL+0.5)*lam/2, c=T.d/2, sl=a/Math.sqrt(c*c-a*a);
    for(const sgn of [1,-1])
      polyline(ctx,box(sq.x,sq.y,sq.w,sq.h),[T.xs,AIR.W],[T.ym,T.ym+sgn*sl*(AIR.W-T.xs)],
               0,AIR.W,AIR.W,0,rgba(COL.ref,0.45),1.1,[4,4]);
    /* label it three quarters of the way along the part that is IN the box: the widest
       asymptote leaves through the floor long before it reaches the right-hand edge */
    const xEnd=Math.min(AIR.W,T.xs+(AIR.W*0.96-T.ym)/sl);
    const xL=T.xs+0.75*(xEnd-T.xs), yL=T.ym+sl*(xL-T.xs);
    if(xL>T.xs+0.6&&yL<AIR.W*0.96)
      labOver(ctx,W,H,mx(sq,xL),my(sq,yL)+11,'d sinθ = '+sigf(mL+0.5,2)+'λ, θ = '+sigf(thL/DEG,3)+'°',
              COL.ref,'center');
  }
  const m0=T.orders[0];
  if(m0!==undefined){
    const y=nodeY(m0,lam,T.d,AIR.W*0.62-T.xs);
    if(isFinite(y)&&T.ym+y<AIR.W*0.95)
      labOver(ctx,W,H,mx(sq,AIR.W*0.62),my(sq,T.ym+y)-9,'|r₁ − r₂| = ½λ',COL.ref,'center');
  }
}
function drawBoxView(ctx,W,H,M){
  const G=boxGeo(ctx,W,H,M), sq=G.sq;
  if(ST.ruler) LABELS.push(rulerRect(sq));          /* reserved before any overlay label */
  if(ST.look!=='particles') drawField(ctx,sq,M);
  else { ctx.fillStyle=COL.air0; ctx.fillRect(sq.x,sq.y,sq.w,sq.h);
         if(M.g.nfront!==LAT.VIS*LAT.VIS){ /* the wall's shadow still reads as dead air */ } }
  if(M.parcels) drawParcels(ctx,sq,M);
  if(M.mode==='wall'){ drawWall(ctx,W,H,sq,M); if(ST.image) drawImageRay(ctx,W,H,sq,M); }
  if(M.mode==='two'&&ST.nodes) drawNodes(ctx,W,H,sq,M);
  frame(ctx,sq,'#2a3040');
  for(let k=0;k<M.speakers.length;k++) drawSpeaker(ctx,W,H,sq,M,k);
  if(ST.ruler) drawRuler(ctx,W,H,sq,M);
  if(ST.listener) drawListener(ctx,W,H,sq,M);
  /* PhET's scale bar and the clock */
  const sb=AIR.scaleLen/AIR.W*sq.w, yb=sq.y-10;
  ctx.fillStyle='#cfd4de'; ctx.fillRect(sq.x,yb-2,sb,3);
  lab(ctx,W,H,sq.x+sb+6,yb,fmt(AIR.scaleLen,0)+' m','#cfd4de',SM_FONT,'left');
  /* the slow-motion factor only when the box is wide enough to hold it: on a narrow stage
     the whole line is longer than the box and lab() shunts it down onto the picture */
  const conv=sq.w<420?'':'  (×'+fmt(1/AIR.phetTimeScale,0)+' slower than real)';
  lab(ctx,W,H,sq.x1,yb,(ST.running?'':'paused · ')+'t = '+sigf(M.t*1000,3)+' ms'+conv,
      '#8b93a6',SM_FONT,'right');
  if(ST.watch){
    const t='stopwatch '+sigf(M.watch*1000,4)+' ms', tw=t.length*11*0.58+18;
    ctx.fillStyle='rgba(10,12,18,.8)'; ctx.fillRect(sq.x1-tw-6,sq.y+6,tw,20);
    lab(ctx,W,H,sq.x1-tw+1,sq.y+16,t,M.watchOn?COL.pos:'#cfd4de',LAB_FONT,'left');
  }
  if(M.view==='air'){
    const t=sigf(ST.pressure,3)+' atm  ·  '+(ST.pressure>0?sigf(dbOf(ST.pressure),3)+' dB':'silent');
    const tw=t.length*11*0.58+18;
    ctx.fillStyle='rgba(10,12,18,.8)'; ctx.fillRect(sq.x+6,sq.y+6,tw,20);
    lab(ctx,W,H,sq.x+13,sq.y+16,t,ST.pressure>0.02?COL.pos:COL.ref,LAB_FONT,'left');
  }
  if(G.gb){ if(M.view==='air'&&!ST.graph) drawAirPanel(ctx,W,H,G.gb,M); else drawAxisGraph(ctx,W,H,G.gb,M); }
  if(G.tb) drawTrace(ctx,W,H,G.tb,M);
  const note=(y,t)=>{ ctx.fillStyle='rgba(7,11,24,.78)'; ctx.fillRect(sq.x+4,y-8,t.length*10.5*0.52+10,16);
    lab(ctx,W,H,sq.x+8,y,t,'#aeb6c6',SM_FONT,'left'); };
  if(G.graphDropped) note(sq.y1-12,'the graph needs a taller window');
  else if(ST.listener&&!G.tb&&!G.narrow) note(sq.y1-12,'the listener’s trace: widen the window to see it');
  drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW});
  return G;
}

/* ================================================================== *
 *  the analysis view: lambda = v/f measured on the lattice            *
 * ================================================================== */
const LAWPL={x0:1.93, x1:3.12, y0:-0.585, y1:0.625};
function lawGeo(ctx,W,H,M){
  const narrow=isNarrow(W), top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-RO_W-44)-56));
  const fit=fitCaption(ctx,W,H-HINT_H,lawCaption(M,true),lawCaption(M,false),capW,top+200);
  const right=narrow?W-26:W-RO_W-44;
  const planeH=Math.max(120,Math.min(Math.round(0.42*(fit.capY-top)),486-44-top));
  const y2=Math.max(top+10+planeH+66,500);
  const h2=fit.capY-46-y2;
  const G={capY:fit.capY,capTxt:fit.txt,capW:fit.capW,narrow,strips:[]};
  G.plane=box(64,top+10,Math.max(160,right-74),planeH);
  if(!narrow&&h2>=80){
    const gut=62, span=(W-24)-64, w=(span-gut)/2;
    G.strips.push(box(64,y2,w,h2));
    G.strips.push(box(64+w+gut,y2,w,h2));
  }
  return G;
}
function lawCaption(M,full){
  const base='λ = v/f across PhET’s whole slider, on log scales: a fixed speed is a straight line of slope −1.';
  if(!full) return base;
  return base+' Orange is the law, the thick cyan stretch is the range PhET’s slider covers, the magenta ring is where it is set now,'
    +' and the green dots are the wavelength MEASURED on the lattice — a least-squares fit against the drive’s own phase at every cell'
    +' of a '+MEAS.N+'-cell tank, then the slope of the phase over cells '+MEAS.R0+' to '+MEAS.R1+'.'
    +' Below left: that measurement’s error, against what PhET’s single fixed time step does to the same wavelengths.'
    +' Below right: why this lattice is '+LAT.N+' cells and not PhET’s 151 — the phase and group speeds it carries, and how much longer a'
    +' wave is along the diagonal than along an axis. At 1000 Hz it holds '+sigf(cellsPerWave(AIR.fmax),3)
    +' cells per wavelength where PhET’s holds '+sigf(AIR.v/AIR.fmax/(AIR.W/AIR.phetVis),3)+'.';
}
function drawLaw(ctx,W,H,M){
  const G=lawGeo(ctx,W,H,M), b=G.plane, X=M.X;
  const xt=[100,200,500,1000].map(Math.log10), yt=[0.3,0.5,1,2,3].map(Math.log10);
  const dec=t=>sigf(Math.pow(10,t),2);
  axesR(ctx,b,LAWPL.x0,LAWPL.x1,LAWPL.y0,LAWPL.y1,{xticks:xt,yticks:yt,xfmt:dec,yfmt:dec,
    title:titleFor(b,'wavelength against frequency: λ = v/f, measured on the lattice','λ = v/f'),
    xlab:'frequency f, Hz',ylab:'wavelength λ, m'});
  const lv=Math.log10(AIR.v);
  /* the slider's range first, the law ON TOP of it: drawn the other way round the
     thick cyan band hides the one line the panel is about */
  const fa=Math.log10(AIR.fmin), fb=Math.log10(AIR.fmax);
  polyline(ctx,b,[fa,fb],[lv-fa,lv-fb],LAWPL.x0,LAWPL.x1,LAWPL.y0,LAWPL.y1,COL.struct,5);
  polyline(ctx,b,[LAWPL.x0,LAWPL.x1],[lv-LAWPL.x0,lv-LAWPL.x1],LAWPL.x0,LAWPL.x1,LAWPL.y0,LAWPL.y1,COL.ref,1.5,[7,4]);
  for(const r of X.rows) if(r.m){
    const px=b.x+b.w*(Math.log10(r.f)-LAWPL.x0)/(LAWPL.x1-LAWPL.x0);
    const py=b.y1-b.h*(Math.log10(r.m.lam)-LAWPL.y0)/(LAWPL.y1-LAWPL.y0);
    if(px>=b.x&&px<=b.x1&&py>=b.y&&py<=b.y1) dot(ctx,px,py,3.6,COL.pos);
  }
  marker(ctx,b,LAWPL.x0,LAWPL.x1,LAWPL.y0,LAWPL.y1,Math.log10(M.R.f),Math.log10(M.lam),COL.live);
  /* the legend goes in the clear band between the plane and the two panels: the law runs
     corner to corner, so legendAuto would rightly refuse every corner of the plane itself */
  if(G.strips.length&&b.w>=340){
    const lb=legendBox(ctx,b.x,b.y1+46,[[COL.ref,'λ = v/f, v = 343 m/s'],[COL.struct,'PhET’s slider'],
                                        [COL.live,'set now'],[COL.pos,'measured on the lattice']]);
    if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]);
  }
  if(X.pending) lab(ctx,W,H,b.x+8,b.y1-12,'measuring '+X.pending+' more frequency'+(X.pending>1?'ies':'')+'…',
                    COL.dim,SM_FONT,'left');
  if(G.strips.length){
    drawErrPanel(ctx,W,H,G.strips[0],M);
    drawDispPanel(ctx,W,H,G.strips[1],M);
  } else if(!G.narrow) lab(ctx,W,H,b.x,b.y1+30,'the two panels below: a taller window shows them','#8b93a6',SM_FONT,'left');
  drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW});
  return G;
}
function drawErrPanel(ctx,W,H,b,M){
  const D=M.disp, xs=D.map(r=>r.f), ph=D.map(r=>100*r.phet);
  const lo=Math.min(-14,Math.min.apply(null,ph)*1.1);
  axesR(ctx,b,AIR.fmin,AIR.fmax,lo,2,{nx:4,ny:4,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0),
    title:titleFor(b,'how far the wavelength is from v/f, per cent','error in λ, %'),xlab:'frequency, Hz'});
  polyline(ctx,b,[AIR.fmin,AIR.fmax],[0,0],AIR.fmin,AIR.fmax,lo,2,'#3a4152',1);
  polyline(ctx,b,xs,ph,AIR.fmin,AIR.fmax,lo,2,COL.ref,1.6);
  const mf=[], me=[];
  for(const r of M.X.rows) if(r.m){ mf.push(r.f); me.push(100*r.m.err); }
  const ord=mf.map((v,i)=>i).sort((a,c)=>mf[a]-mf[c]);
  polyline(ctx,b,ord.map(i=>mf[i]),ord.map(i=>me[i]),AIR.fmin,AIR.fmax,lo,2,COL.pos,1.6);
  for(let i=0;i<mf.length;i++){
    const px=b.x+b.w*(mf[i]-AIR.fmin)/(AIR.fmax-AIR.fmin), py=b.y1-b.h*(me[i]-lo)/(2-lo);
    if(px>=b.x&&px<=b.x1&&py>=b.y&&py<=b.y1) dot(ctx,px,py,3,COL.pos);
  }
  const lb=legendAuto(ctx,b,[[COL.pos,'this lattice, measured'],[COL.ref,'PhET’s one fixed step']]);
  if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]);
}
function drawDispPanel(ctx,W,H,b,M){
  const D=M.disp, xs=D.map(r=>r.f);
  axesR(ctx,b,AIR.fmin,AIR.fmax,0.84,1.06,{nx:4,ny:4,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,2),
    title:titleFor(b,'what the square lattice does to a wave: speeds and shape','the lattice’s dispersion'),
    xlab:'frequency, Hz'});
  polyline(ctx,b,[AIR.fmin,AIR.fmax],[1,1],AIR.fmin,AIR.fmax,0.84,1.06,'#3a4152',1);
  polyline(ctx,b,xs,D.map(r=>r.vp),AIR.fmin,AIR.fmax,0.84,1.06,COL.struct,1.6);
  polyline(ctx,b,xs,D.map(r=>r.vg),AIR.fmin,AIR.fmax,0.84,1.06,COL.pos,1.6);
  polyline(ctx,b,xs,D.map(r=>1+r.aniso),AIR.fmin,AIR.fmax,0.84,1.06,COL.live,1.6);
  const lb=legendAuto(ctx,b,[[COL.struct,'phase speed / v'],[COL.pos,'group speed / v'],
                             [COL.live,'diagonal λ / axis λ']]);
  if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]);
}

/* ================================================================== *
 *  dispatch and the scene object                                      *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='law') return drawLaw(ctx,W,H,M);
  return drawBoxView(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return ST.view==='law'?false:clockFrame()>0; };
  /* the pointer: the speaker button, the listener, the ruler and (two speakers)
     the second speaker */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    if(ST.view==='law') return false;
    const ctx=canvas.getContext('2d'), M=buildModel(), G=boxGeo(ctx,S.W,S.H,M), sq=G.sq;
    if(type==='down'){
      const g=speakerGeo(sq,M,0);
      if(Math.hypot(x-g.btn.x,y-g.btn.y)<g.btn.r+3){ DRAG.what='button'; return pressSource(M.R); }
      if(ST.listener){
        const LX=mx(sq,M.listener.x), LY=my(sq,M.listener.y);
        if(Math.hypot(x-LX,y-LY)<13){ DRAG.what='listener'; return true; }
      }
      if(M.mode==='two'){
        const s2=speakerGeo(sq,M,1);
        if(x>=s2.x0-6&&x<=s2.x1+6&&Math.abs(y-s2.y)<20){ DRAG.what='spk2'; return true; }
      }
      if(ST.ruler){
        const r=rulerGeo(sq,M);
        if(x>=r.x0&&x<=r.x1&&Math.abs(y-r.y)<r.h/2+3){ DRAG.what='ruler'; return true; }
      }
      return false;
    }
    if(type==='move'){
      if(!DRAG.what||DRAG.what==='button') return false;
      const X=clamp((x-sq.x)/sq.w*AIR.W,0,AIR.W), Y=clamp((y-sq.y)/sq.h*AIR.W,0,AIR.W);
      if(DRAG.what==='listener'){ TOOLS.listener=[X,Y]; return true; }
      if(DRAG.what==='spk2'){ ST.spk2y=clamp(Y,0.35,AIR.W-0.35); return true; }
      if(DRAG.what==='ruler'){ TOOLS.ruler=[clamp(X-RULER_LEN/2,-1,AIR.W-1),Y]; return true; }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — the control panel, the tabs, the keys, the frame loop and   *
 *  the tone's audio layer                                             *
 * ================================================================== */
const CREDIT='Remake of PhET Interactive Simulations&rsquo; Sound Waves (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.';
/* the tone: the samples are computed in toneBuffer and played from a looped
   buffer, so what is heard is what the suite checks.  Everything here is
   guarded: there is no AudioContext under the headless harnesses. */
const AUDIO={ctx:null, src:null, gain:null, key:'', state:'off', buf:null};
function audioCtor(){
  if(typeof AudioContext!=='undefined') return AudioContext;
  if(typeof webkitAudioContext!=='undefined') return webkitAudioContext;
  return null;
}
function toneWanted(){ return ST.tone&&ST.running&&ST.view!=='law'&&sourceActive(RUN); }
function toneSync(M){
  if(!toneWanted()){
    if(AUDIO.src){ try{ AUDIO.src.stop(); }catch(e){} AUDIO.src=null; }
    AUDIO.key=''; AUDIO.state='off';
    return AUDIO.state;
  }
  const AC=audioCtor();
  if(!AC){ AUDIO.state='unavailable'; return AUDIO.state; }
  const hz=RUN.f, level=toneLevel(ST.toneMode,RUN.A,M?M.listener.amp:0);
  const key=hz.toFixed(4)+'|'+level.toFixed(4);
  if(key===AUDIO.key&&AUDIO.src) return AUDIO.state;
  try{
    if(!AUDIO.ctx){ AUDIO.ctx=new AC(); AUDIO.gain=AUDIO.ctx.createGain(); AUDIO.gain.connect(AUDIO.ctx.destination); }
    const c=AUDIO.ctx;
    if(c.state==='suspended'&&c.resume) c.resume();
    const tb=toneBuffer(hz,1,c.sampleRate||TONE_SR);      /* the level rides on the gain */
    const buf=c.createBuffer(1,tb.L,c.sampleRate||TONE_SR);
    buf.getChannelData(0).set(tb.data);
    if(AUDIO.src){ try{ AUDIO.src.stop(); }catch(e){} }
    const s=c.createBufferSource();
    s.buffer=buf; s.loop=true; s.connect(AUDIO.gain); s.start();
    AUDIO.src=s; AUDIO.buf=tb; AUDIO.gain.gain.value=level; AUDIO.key=key; AUDIO.state='playing';
  }catch(e){ AUDIO.state='unavailable'; }
  return AUDIO.state;
}

function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas);
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    ST.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===ST.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:ST.view===k?'active':'',onclick:()=>setView(k)},lab2)); });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:ST[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=ST[key]; val.textContent=plain(fmtf(ST[key])); };
    inp.addEventListener('input',()=>{ ST[key]=parseFloat(inp.value);
      val.textContent=plain(fmtf(ST[key])); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=ST[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ ST[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=ST[key]; }};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      wrapEl.appendChild(h('button',{class:'chip'+(ST[key]===o.id?' on':''),onclick:()=>{
        ST[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }},o.name));
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function button(lab2,fn){ return h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},lab2); }

  /* the speaker */
  const gSrc=h('div',{class:'grp'},h('h3',null,'the speaker'));
  gSrc.appendChild(slider('f','frequency',AIR.fmin,AIR.fmax,1,v=>fmt(v,0)+' Hz &middot; '+sigf(waveLen(v),3)+' m'));
  gSrc.appendChild(slider('amp','amplitude',0,AIR.ampMax,0.1,v=>fmt(v,1)));
  const modeChips=chipRow(MODE_LIST,'wave',()=>{ setWaveMode(RUN,ST.wave==='cont'); });
  gSrc.appendChild(modeChips);
  const srcBtn=h('div',{class:'btnrow'},button('press the speaker button',()=>{ pressSource(syncRun()); }));
  gSrc.appendChild(srcBtn);
  const srcTag=h('div',{class:'tag'}); gSrc.appendChild(srcTag);

  /* what to show */
  const gShow=h('div',{class:'grp'},h('h3',null,'what to show'));
  gShow.appendChild(chipRow(LOOK_LIST,'look'));
  gShow.appendChild(h('div',{class:'checks'},
    checkbox('graph','graph along the speaker’s row'),
    checkbox('listener','the listener'),
    checkbox('ruler','PhET’s 5 m ruler'),
    checkbox('watch','stopwatch')));
  const extraChecks=h('div',{class:'checks'},
    checkbox('nodes','the quiet hyperbolae'),
    checkbox('image','the image speaker and the ray'));
  gShow.appendChild(extraChecks);
  gShow.appendChild(h('div',{class:'btnrow'},
    button('start / stop the stopwatch',()=>{ CLOCK.watchOn=!CLOCK.watchOn; }),
    button('zero it',()=>{ CLOCK.watch=0; })));
  const showTag=h('div',{class:'tag'}); gShow.appendChild(showTag);

  /* the second speaker */
  const gSecond=h('div',{class:'grp'},h('h3',null,'the second speaker'));
  gSecond.appendChild(slider('spk2y','its height',0.35,AIR.W-0.35,0.01,v=>sigf(v,3)+' m'));
  const secondTag=h('div',{class:'tag'}); gSecond.appendChild(secondTag);

  /* the wall */
  const gWall=h('div',{class:'grp'},h('h3',null,'the wall'));
  gWall.appendChild(slider('wallX','wall position',WALLR.xmin,WALLR.xmax,0.01,v=>sigf(v,3)+' m'));
  gWall.appendChild(slider('wallAng','wall angle',WALLR.amin,WALLR.amax,0.005,v=>fmt(v/DEG,1)+'&deg;'));
  const wallTag=h('div',{class:'tag'}); gWall.appendChild(wallTag);

  /* the air */
  const gAir=h('div',{class:'grp'},h('h3',null,'air density in the box'));
  gAir.appendChild(slider('pressure','air density',0,1,0.01,v=>fmt(v,2)+' atm'));
  gAir.appendChild(h('div',{class:'btnrow'},button('back to 1 atm',()=>{ ST.pressure=1; })));
  const airTag=h('div',{class:'tag'}); gAir.appendChild(airTag);

  /* audio */
  const gAudio=h('div',{class:'grp'},h('h3',null,'audio'),
    h('div',{class:'checks'},checkbox('tone','play the tone',()=>toneSync(null))));
  gAudio.appendChild(chipRow(TONE_LIST,'toneMode',()=>toneSync(null)));
  const audioTag=h('div',{class:'tag'}); gAudio.appendChild(audioTag);

  /* time */
  const gTime=h('div',{class:'grp'},h('h3',null,'time'));
  gTime.appendChild(chipRow(SPEED_LIST,'speed'));
  gTime.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  gTime.appendChild(h('div',{class:'btnrow'},
    button('one step',()=>{ syncRun(); stepOnce(); }),
    button('clear the sound',()=>{ runClear(syncRun()); PROBE.head=0; PROBE.count=0; })));
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  const gRun=h('div',{class:'grp'},h('div',{class:'btnrow'},
    button('reset all',()=>{ resetAll(); toneSync(null); syncChips(); })));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:CREDIT+' Measured: nothing by hand &mdash; every number is PhET&rsquo;s (read from the minified original and cited as PhET&rsquo;s values in the header) or computed and pinned to build/sound-waves/derive.py. The gas constants are the exact SI values and the molar mass of standard dry air.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gSrc,gShow,gSecond,gWall,gAir,gAudio,gTime,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [w,list,key] of CHIPROWS) [].forEach.call(w.children,(b,i)=>b.className='chip'+(list[i].id===ST[key]?' on':''));
  }
  function syncPanel(){
    const v=ST.view, box=(v!=='law');
    /* the frequency slider stays on show in the analysis view: that view measures the
       lattice at whatever it is set to, and marks the setting on its plane */
    rows.amp.row.hidden=!box; modeChips.hidden=!box; srcBtn.hidden=!box;
    gShow.hidden=!box; gTime.hidden=!box; gAudio.hidden=!box;
    gSecond.hidden=(v!=='two'); gWall.hidden=(v!=='wall'); gAir.hidden=(v!=='air');
    rows.cb_nodes.row.hidden=(v!=='two');
    rows.cb_image.row.hidden=(v!=='wall');
    extraChecks.hidden=(v!=='two'&&v!=='wall');
    rows.cb_ruler.row.hidden=!box;
    rows.cb_watch.row.hidden=!box;
    for(const k in rows) rows[k].sync();
    srcTag.innerHTML=!box
      ? 'the plane below marks this setting, and measures the lattice at it &mdash; the five fixed frequencies are measured whatever the slider says'
      : (ST.wave==='pulse'
        ? 'in pulse mode the button fires one period and pops back up'+(RUN.pulse.on?' &mdash; <b>firing</b>':'')
        : 'the button switches the speaker on and off, and starts it from zero; the cell in front of the cone is driven at 1.2 &times; the amplitude (PhET&rsquo;s value). Changing the sound mode stops it, as PhET&rsquo;s does.');
    showTag.innerHTML=v==='two'
      ? 'the hyperbolae are drawn from |r&#8321; &minus; r&#8322;| = (m + &frac12;)&lambda;, not found on the picture &mdash; drag the listener onto one and watch the trace go flat'
      : (v==='wall' ? 'the image speaker is the reflection of the real one in the wall; the sound behind the wall is not drawn at all'
                    : 'drag the listener and the ruler on the picture');
    secondTag.innerHTML='PhET fixes both speakers to the same column and lets you slide the second one up and down; the lattice puts it on the nearest row, so the separation moves in steps of one cell ('+sigf(sceneDx()*100,3)+' cm)';
    wallTag.innerHTML='PhET&rsquo;s wall crosses the bottom edge at the position you set and leans back by the angle; at '+fmt(WALLR.amin/DEG,0)+'&deg; it lies almost flat along the floor and hides almost nothing';
    airTag.innerHTML='PhET scales its source by this number, and so does this sim &mdash; which is right for a cone of fixed velocity, p = &rho;cu. The speed of sound does not move at all.';
    audioTag.innerHTML='a sine at the frequency on the slider, from a buffer of whole cycles so it loops without a click'
      +(ST.toneMode==='listener'?'; its level follows the pressure amplitude the lattice holds at the listener':'; its level follows the amplitude slider, as PhET&rsquo;s does');
    timeTag.innerHTML='space runs/pauses &nbsp; <b>p</b> presses the speaker button &nbsp; <b>r</b> clears the sound &nbsp; 1&ndash;6 switch views';
  }
  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=ST.view==='law'?'1–6 switch views'
        :'press the speaker button · drag the listener, the ruler and the second speaker · space pauses · 1–6 switch views';
      infoEl.innerHTML=INFO[ST.view]||''; physEl.innerHTML=DERIV[ST.view]||'';
      M.tone.on=(toneSync(M)==='playing');
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; syncPanel(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); ST.running=!ST.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ runClear(syncRun()); PROBE.head=0; PROBE.count=0; dirty=true; refresh(); }
    else if(e.key==='p'){ if(pressSource(syncRun())){ dirty=true; refresh(); } }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    let advanced=false;
    try{ advanced=S.step(); }catch(e){ fail(e); }
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%10===0){ const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); toneSync(M); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  intro:'A loudspeaker at the left of a room ten metres across, seen from above. The cell in front of its cone is pushed in and out, and every other cell of a 231 × 231 lattice obeys the wave equation in its simplest discrete form: each step it accelerates toward the average of its four neighbours. That one rule makes circular wavefronts that spread at a fixed speed — 343 metres a second, the speed the air sets — and fade as they go, because the energy that left the cone is spread round a growing circle. Press the green button to switch the speaker off: the sound already in the room carries on without it, which is what it means for a wave to leave its source. Raise the frequency and the crests crowd together; that is the whole of λ = v/f, because the speed belongs to the air and not to the speaker. Switch the picture to air parcels and you see what is really moving: each parcel jiggles back and forth about its own place, crowding where the pressure is high. Nothing travels from the cone to your ear except the squeeze.',
  measure:'The same room with PhET’s two instruments in it. The ruler is five metres long and rigid — lay it across the wavefronts and count how many fit, and you have measured the wavelength without being told it. The stopwatch runs in the sim’s own time, which is 207 times slower than real, so one period of a 550 Hz note lasts 1.82 ms of model time; start it, watch the listener’s trace go through one full swing, and stop it. Multiply the two and you get the speed of sound. The point of doing it at more than one frequency is that the answer does not change: the wavelength halves when the frequency doubles, and 343 m/s comes back every time.',
  two:'A second loudspeaker, in step with the first, and the room fills with a pattern of loud and quiet lines that neither speaker makes on its own. A place is quiet when the two paths to it differ by half a wavelength, or one and a half, or two and a half: |r₁ − r₂| = (m + ½)λ. That equation is the definition of a hyperbola with the two speakers as its foci, which is exactly what the orange curves are — and far from the speakers each one straightens into a ray at sin θ = (m + ½)λ/d, the two-slit condition. Drag the listener onto a quiet line and its trace flattens; drag it between them and the trace doubles in height. Move the second speaker and watch the whole pattern re-aim. Raise the frequency and more quiet lines appear, one for every extra half-wavelength that fits into the separation.',
  wall:'A hard wall, and the question of where the reflection comes from. The answer is the simplest in acoustics: reflect the speaker in the wall and the sound that comes back is the sound of that image speaker. It has to be — the wall is rigid, so no air crosses it, so ∂p/∂n = 0 there, and a field made of a source plus its mirror image satisfies that identically. Everything else follows. The ray that reaches the listener is the straight line from the image, bent at the wall, and the two angles it makes with the normal are therefore equal; its length is the shortest path from the speaker to the listener by way of the wall. And because the direct and reflected sound are two sources a fixed distance apart, the loud and quiet bands in front of the wall are the same hyperbolae as the two-speaker screen. Nothing is drawn behind the wall: this model has no diffraction round its edge.',
  air:'Take the air out of the box and the sound goes away — but it is worth being precise about what changes. The cone still moves; what falls is the pressure it can make, because a cone of fixed velocity radiates p = ρcu and ρ is what is being removed. Halve the density and you halve the pressure amplitude and the intensity, which is 6 dB; take it to a tenth and you lose 20 dB. What does not change at all is the SPEED. Sound in an ideal gas runs at √(γp/ρ), and pumping gas out lowers p and ρ together, so the ratio — and the speed — sits exactly where it was: 343 m/s at 1 atm, at 0.1 atm and at 0.001 atm, as long as the temperature is the same. The panel on the right says so with numbers. The honest limit of the model is at the bottom of the slider: a real gas stops carrying sound once its molecules travel a wavelength between collisions, which for a 1000 Hz note happens near 2×10⁻⁷ atm; this lattice keeps solving the wave equation all the way down to nothing.',
  law:'The claim λ = v/f, put to the test on the lattice that is drawing every other view. Each green dot is not the formula: it is a wavelength MEASURED on a fresh run — the lattice is driven at that frequency until it settles, two whole periods are recorded at every cell along the axis, and at each cell a least-squares fit against the drive’s own phase gives an amplitude and a phase. The slope of that phase is the wavenumber. It lands on the orange line to five figures over most of the slider, and drifts to about a third of a per cent at 100 Hz, where the fit window holds barely one and a half wavelengths. The left-hand panel puts that error beside PhET’s: PhET fixes one time step for the whole sim, which leaves its wavelengths 1.3 % short at the bottom of the slider and 12.8 % short at the top. The right-hand panel is why this lattice is bigger than PhET’s. A square lattice is not isotropic: a wave travelling along the diagonal is longer than one travelling along an axis, and a pulse travels slower than its own crests. Both grow as the wave gets coarser, so the size of the lattice is the price paid to keep them small.'
};
function FR2(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const DERIV={
  intro:'<h4>the lattice and its clock</h4>'
    +EQ(1,'p<sub>ij</sub><sup>n+1</sup> = 2p<sub>ij</sub><sup>n</sup> &minus; p<sub>ij</sub><sup>n&minus;1</sup> + C&sup2;(p<sub>i+1,j</sub> + p<sub>i&minus;1,j</sub> + p<sub>i,j+1</sub> + p<sub>i,j&minus;1</sub> &minus; 4p<sub>ij</sub>)<sup>n</sup>, &nbsp; C = '+FR2('v&Delta;t','&Delta;x')+' = &frac12;')

  two:'<h4>where two speakers are quiet</h4>'

    +EQ(3,'A = &radic;(A&#8321;&sup2; + A&#8322;&sup2; + 2A&#8321;A&#8322;cos&Delta;&phi;), &nbsp; &Delta;&phi; = 2&pi;(r&#8321; &minus; r&#8322;)/&lambda;')

/* ================================================================== *
 *  makeShot — the selfTest recording context (text boxes through     *
 *  the transform, fill counts), from build_buoy/p7_test.js by name,  *
 *  unchanged (make_helpers.py)                                       *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest — headless verification.  Every reference is a line of    *
 *  build/sound-waves/refvals.txt (derive.py's output, read in full),  *
 *  carried in REF under its printed label: (twin) = the numpy repeat  *
 *  of this engine, (python)/(scipy) = computed outside, (WI) = a line *
 *  derive.py checked against build/wave-interference/refvals.txt      *
 *  before printing it.                                                *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();
  function ref(label,i){ const v=REF[label]; if(!v) throw new Error('no reference line "'+label+'"'); return v[i||0]; }
  const stSave=Object.assign({},ST), toolSave=JSON.parse(JSON.stringify(TOOLS));

  /* ---------- A. PhET's constants and geometry (sound-waves_en.html 1.1.11) ---------- */

  eq(AIR.v,343,'34.3 cm/ms = 343 m/s'); eq(AIR.fmin,100,'the slider starts at 100 Hz');
  eq(AIR.fmax,1000,'and ends at 1000 Hz'); eq(AIR.f0,550,'PhET’s initial 0.55 per ms');
  eq(AIR.ampMax,10,'PhET’s amplitude range 0 to 10'); eq(AIR.amp0,5,'and its initial 5');
  eq(LAT.AMP_CAL,1.2,'the source cell is driven at 1.2 x the amplitude (PhET’s value)');
  eq(LAT.C,0.5,'Courant number C = 1/2 (PhET’s WAVE_SPEED)');
  eq(LAT.PAD,20,'PhET’s 20-cell pad'); eq(LAT.VIS,LAT.N-2*LAT.PAD,'so 191 of 231 cells are visible');
  eq(U_FULL,2,'full contrast at 2 lattice units (PhET’s positive end)');
  close(ref("PhET's contrast: full white at u =, full black at u =, this sim's symmetric scale",1),-1.5,0,
        'PhET’s negative end is -1.5, which this sim does not copy');
  eq(AIR.phetMaxSoundDist,85,'PhET’s MAX_SOUND_DISTANCE is 85 cells, a taper this sim does not copy');
  rel(AIR.phetEventRate,ref('EVENT_RATE'),1e-15,'PhET’s event rate 20 x 111/61 (WI)');
  rel(AIR.phetTimeScale,ref('PhET time scale, s of model time per s of wall time, and the slow-motion factor'),1e-15,
      'PhET’s time scale, 4.8376 ms of model time per wall second (python)');
  rel(1/AIR.phetTimeScale,ref('PhET time scale, s of model time per s of wall time, and the slow-motion factor',1),1e-12,
      'so the clock runs 206.7 times slower than real (python)');
  rel(MUR1,ref('MUR1 MUR2A MUR2B',0),1e-15,'Mur -1/3 (WI)');
  rel(MUR2A,ref('MUR1 MUR2A MUR2B',1),1e-15,'Mur 4/3 (WI)');
  rel(MUR2B,ref('MUR1 MUR2A MUR2B',2),1e-15,'Mur 1/12 (WI)');
  { const R=makeRun(AIR.f0);
    rel(sceneDx(),ref('geometry: W, dx, source x, mid y',1),1e-15,'dx = 10 m / 191 (python)');

  Object.assign(ST,stSave); Object.assign(TOOLS,JSON.parse(JSON.stringify(toolSave))); resetAll();

  /* ---------- M. the formatters ---------- */
  eq(supTxt(8),'⁸','supTxt turns 8 into a superscript eight');
  eq(supTxt(-7),'⁻⁷','and -7 into a superscript minus seven');
  eq(pow10(3),'10³','pow10(3) is the axis label 10^3');
  eq(pow10(-1),'10⁻¹','and pow10(-1) is 10^-1');
  eq(sciTxt(343,3),'343','an ordinary magnitude is left to sigf');
  eq(sciTxt(343,4),'343.0','which keeps the figures it was asked for');
  eq(sciTxt(1.9e-7,3),'1.90×10⁻⁷','a small one goes to the exponent form');
  eq(sciHTML(1.9e-7,3),'1.90&times;10<sup>-7</sup>','and sciHTML writes it as markup');
  eq(sciTxt(0,3),'0','zero is zero'); eq(sciHTML(1/0,3),'&infin;','and infinity says so');
  eq(plain('&lambda; = v/f'),'λ = v/f','plain() decodes the entities the canvas cannot');
  eq(plain('<b>p</b>&sub2;'.replace('&sub2;','&sup2;')),'p²','and strips the tags it cannot draw');

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
