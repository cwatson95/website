<title>Circuit construction kit &mdash; PhET&rsquo;s DC lab, solved by modified nodal analysis, with Kirchhoff, the power budget, Th&eacute;venin and superposition</title>
<!--
  ===================================================================
  circuit-construction-kit-dc-virtual-lab.html — a DC circuit bench:
  drag batteries, bulbs, resistors, switches, fuses, wires and a few
  household objects out of the toolbox, join them end to end, and read
  them with a voltmeter and two kinds of ammeter; the circuit is solved
  by modified nodal analysis, and four more views open the solution up
  ===================================================================

  Remake of PhET Interactive Simulations' Circuit Construction Kit: DC -
  Virtual Lab (University of Colorado Boulder, phet.colorado.edu, CC-BY
  4.0). New code; no PhET code or assets.  The parts, their values and the
  solver's rules follow PhET's build 1.5.2
  (docs/phets/circuit-construction-kit-dc-virtual-lab_en.html) and PhET's
  circuit-construction-kit-common doc/model.md; every number taken from
  that build is marked "PhET's value" in the code.

  Five views.  THE LAB is PhET's one screen: a toolbox of wires,
  batteries, light bulbs, resistors, switches, fuses, PhET's "extreme"
  battery, bulb and resistor, a dollar bill, a paper clip, a coin, an
  eraser, a pencil and a thin pencil (and PhET's real bulb, behind "add
  real bulbs"), a series ammeter, a two-probe voltmeter and a non-contact
  ammeter.  Drag a part out, drop one of its ends within 30 units of
  another end to join them, drag a joint to move it (a wire stretches, a
  part swings about its other end), tap a part to select and edit it (a
  switch toggles), split a junction, delete a part, reverse a battery,
  repair a fuse.  Show the current as electrons or as conventional
  current, the values, lifelike or schematic parts, the wire resistivity
  and the batteries' internal resistance; a battery or a resistor carrying
  15 A or more catches fire.  NODES AND BRANCHES draws the same circuit as
  a graph -- its spanning tree, the chords that close its fundamental
  loops -- beside the MNA matrix itself, with Kirchhoff's current law at
  every node and his voltage law round every loop checked on the answer.
  THE POWER BUDGET: what each EMF delivers, what each resistance turns to
  heat, and Tellegen's theorem that they balance; the bulbs on PhET's
  brightness curve.  THE REST OF THE CIRCUIT: any one part's view of
  everything else -- Thevenin's single source and resistor, the load line
  and the part's own characteristic crossing at the operating point, and
  the power the part would take as its resistance is swept (largest at
  R = R_th).  ONE BATTERY AT A TIME: superposition, every branch current
  as the sum of what each battery drives alone.

  THE MODEL (PhET's values)
  -------------------------
  Batteries 9 V (0-120 V, 0.1-V steps) and extreme batteries 1000 V
  (100-100 000 V), all with one internal resistance 1e-4 ohm by default
  (1e-4 - 10 ohm, the "battery resistance" slider); resistors and bulbs
  10 ohm (0-120 ohm), their extreme versions 1000 ohm (100-10 000 ohm);
  household objects: coin and paper clip 0 ohm, pencil 25, thin pencil 50,
  eraser and dollar bill 1e6 ohm (PhET's 1.5.2 values -- its model.md
  says 1e9 for the last two); a fuse is 0.06/rating ohm (0.5-20 A,
  4 A by default) and blows when |I| exceeds its rating by 1e-6 A; a
  closed switch or a series ammeter is 0 ohm, and every 0 ohm becomes
  1.1e-10 ohm in the solver (PhET's MINIMUM_RESISTANCE); an open switch
  or a blown fuse is not in the circuit at all.  Wire: R = rho L / A with
  L = 5e-4 m per view unit and A = 5e-4 m², never below 1e-14 ohm;
  resistivity 1e-10 - 0.0168 ohm m (so 100 units of wire is 1e-8 ohm at
  the bottom of the slider and 1.68 ohm at the top).  The real bulb is
  non-linear: R = 10 + 3|V|/log2(|V| + 2) ohm.  Bulb brightness (PhET's
  rule): b = ln(1 + 0.35 P)/ln(1 + 0.35 x 2000), P = I²R, clamped to
  [0, 1].  Fire: |I| >= 15 A through a battery or a resistor-like part
  of R >= 1e-8 ohm.  Charges sit 28 units apart and move 25 units per
  second per ampere; when the largest current would carry one further
  than 0.43 of a spacing in a 1/30-s frame (above 14.448 A) the whole
  animation slows by that factor, and says so.  Parts are PhET's lengths
  (battery 102, resistor and fuse 110, switch 112, series ammeter 121,
  coin 85, paper clip 75, pencils 130, eraser 90, dollar bill 140); the
  bulbs are 100 between terminals here.  Joints snap within 30 units
  (PhET's drop radius, with PhET's rules for what may join what); a
  voltmeter probe reads a vertex within 11.2 units, or a metal part
  (wire, coin, paper clip) by linear interpolation along it; the
  ammeters read to 0.01 A, magnitude, as PhET's do.

  WHAT IS EXACT HERE
  ------------------
  The solver.  Every connected piece of the circuit gets one reference
  node (its first battery's - terminal); the unknowns are every other
  node's voltage and EVERY branch's current, the rows are Kirchhoff's
  current law at each node and each part's own law v_a - v_b = R i - E
  (divided through by max(1, R)), solved by Gaussian elimination with
  partial pivoting and two passes of iterative refinement.  Asserted
  against build/circuit-construction-kit-dc-virtual-lab/derive.py, which
  solves every circuit by a different formulation (classic nodal
  analysis, each battery a Norton source) in EXACT rational arithmetic:
  the six presets and their variants (battery r = 2, 5, 10 ohm, the most
  resistive wire, the bridge balanced), eleven abstract netlists --
  series, parallel, the Wheatstone bridge balanced (exactly zero) and
  unbalanced (and the textbook ideal-source formula), two batteries
  (superposition, exactly), Thevenin (V_oc, R_th and I = (V_oc + E)/
  (R + R_th), exactly; the load sweep peaking at R = R_th), internal
  resistance (terminal voltage E - I r, 16 cases), floating pieces, a
  dead short, PhET's extreme parts, a zero-ohm loop, eight decades of
  resistance -- and 30 random circuits spanning 16 decades of resistance.
  Every current is within 16 eps of the largest current in its piece and
  every voltage within 64 eps of its piece's voltage scale; Kirchhoff's
  current law closes at every node, and his voltage law round every
  fundamental loop, to 8 eps on the answer (measured below 5e-16 there
  and on 300 more random circuits from 1e-14 to 1e6 ohm).  The float
  conductance form loses digits on the same circuits (a wire's current
  is 1e8 S times a voltage difference of 1e-8 V): numpy's solve of it,
  printed by derive.py, is off by up to 2e-5 of the largest current on
  the presets and 2e-4 on the random circuits, and PhET's own
  formulation (resistors as conductances, batteries as ideal sources in
  series with their resistance), run here as a twin, by 1e-5 and 9e-5.
  Keeping every current as an unknown is why this solver does not.
  The real bulb converges to its fixed point to 1e-14 (derive.py: 50-
  digit Decimal); the fuse blows above rating + 1e-6 A in either
  direction; the meters follow PhET's connection rules.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  The real bulb is iterated to its fixed point (PhET stops after ten
  passes: 1.7e-11 short of it in the series preset).  Charges ride each
  part at an even spacing and wrap round at its ends rather than hopping
  from part to part at the junctions; their speed rule is PhET's.  The
  analysis views freeze real bulbs at their present resistance (a
  non-linear part has no Thevenin equivalent; that is its tangent).
  Meters are drawn in the circuit's own coordinates and zoom with it.
  One voltmeter and one non-contact ammeter (PhET's lab has two of
  each).  A drag that moves at all joins the nearest legal pair of ends
  on release, and one that travels under 15 px also selects (and toggles
  a switch), as PhET's drag listeners do; a split moves each part 24
  units back from the joint (the remake's distance).  The battery-
  resistance and wire-resistivity sliders are logarithmic here (PhET's
  are linear) so their low ends can be reached.  The time step is fixed
  per frame so the headless suites are deterministic.

  WHAT IS NOT MODELLED
  --------------------
  No heating of a wire or a part with time, no battery that runs down,
  no capacitors, inductors or AC (those are PhET's AC kit), no stopwatch,
  no keyboard dragging of parts, no sounds, no screen-reader descriptions.
  Voltmeters and ammeters are ideal, as in PhET (infinite and zero
  resistance).
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                 *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop
   in a naive generator (sbs_sims Known-bad) — return [] instead */
function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;
  for(let e=e0;e<=e1;e+=step){ const v=Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};
}
function sparseTicks(lo,hi,hpx){
  return ticksFor(lo,hi,hpx<90?2:(hpx<140?3:5));

/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));
  let fit=capFit(ctx,W,H,fullTxt,capW);
  if(fit.capY>=minTop) return {capY:fit.capY,txt:fullTxt,capW};
  fit=capFit(ctx,W,H,shortTxt,capW);
  return {capY:fit.capY,txt:shortTxt,capW};
}
function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];
}

function fuseR(rating){ return FUSE_K/rating; }

/* ---------------- the circuit as data ---------------- */
function newCircuit(){ return {verts:[],els:[],nv:0,ne:0}; }
function makeEl(id,type,a,b,par){
  const T=TYPES[type], el={id,type,a,b};
  if(T.E!==undefined) el.E=T.E;
  if(T.R!==undefined) el.R=T.R;
  if(type==='fuse'){ el.rating=T.rating; el.tripped=false; }
  if(type==='switch') el.closed=false;           /* PhET: a new switch is open */
  if(par) for(const k in par) el[k]=par[k];
  return el;
}
function presetCircuit(key){
  const C=newCircuit(), g=PRESET_GEOM[key];
  if(!g) return C;
  g.verts.forEach((p,k)=>C.verts.push({id:k,x:p[0],y:p[1]}));
  g.els.forEach((e,k)=>C.els.push(makeEl(k,e[0],e[1],e[2],e[3])));
  C.nv=g.verts.length; C.ne=g.els.length;
  return C;
}
function vById(C,id){ for(const v of C.verts) if(v.id===id) return v; return null; }
function elById(C,id){ for(const e of C.els) if(e.id===id) return e; return null; }
function elsAt(C,vid){ return C.els.filter(e=>e.a===vid||e.b===vid); }
function otherEnd(e,vid){ return e.a===vid?e.b:e.a; }
function elLength(C,e){ const A=vById(C,e.a), B=vById(C,e.b); return Math.hypot(B.x-A.x,B.y-A.y); }
function countType(C,t){ let n=0; for(const e of C.els) if(e.type===t) n++; return n; }
function remaining(C,t){ return TYPES[t].max-countType(C,t); }

/* a new part centred at (cx,cy), lying along +x (PhET's "right" orientation):
   start vertex on the left, end on the right -- for a battery the end is +. */
function addElement(C,type,cx,cy){
  if(remaining(C,type)<=0) return null;
  const L=TYPES[type].L||100;                    /* a new wire is 100 long (WIRE_LENGTH) */
  const a={id:C.nv++,x:cx-L/2,y:cy}, b={id:C.nv++,x:cx+L/2,y:cy};
  C.verts.push(a,b);
  const el=makeEl(C.ne++,type,a.id,b.id);
  C.els.push(el);
  return el;
}
/* every vertex joined to vid through FIXED-length parts (not wires): they
   move as one rigid body (PhET's findAllFixedVertices) */
function fixedGroup(C,vid){
  const seen=new Set([vid]), q=[vid];
  while(q.length){ const v=q.pop();
    for(const e of C.els) if(e.type!=='wire'&&(e.a===v||e.b===v)){ const o=otherEnd(e,v); if(!seen.has(o)){ seen.add(o); q.push(o); } } }
  return seen;
}
function neighbours(C,vid){ const s=new Set(); for(const e of C.els){ if(e.a===vid) s.add(e.b); else if(e.b===vid) s.add(e.a); } return s; }
function adjacent(C,v,t){ return C.els.some(e=>(e.a===v&&e.b===t)||(e.a===t&&e.b===v)); }
/* PhET's getDropTarget rules: not itself, not adjacent, not in the dragged
   rigid group, and the two may share no neighbour (that would lay two parts
   on top of each other between the same two points) */
function canConnect(C,v,t,group){
  if(v===t||adjacent(C,v,t)) return false;
  if(group&&group.has(t)) return false;
  if(fixedGroup(C,v).has(t)) return false;
  const nv=neighbours(C,v), nt=neighbours(C,t);
  for(const x of nv) if(nt.has(x)) return false;
  return true;
}
/* the nearest legal (moving vertex, target) pair within the 30-unit drop radius */
function dropTarget(C,moving){
  let best=null;
  const group=new Set(moving);
  for(const vid of moving){ const v=vById(C,vid); if(!v) continue;
    for(const t of C.verts){ if(group.has(t.id)) continue;
      const d=Math.hypot(t.x-v.x,t.y-v.y);
      if(d<SNAP_R&&(!best||d<best.d)&&canConnect(C,vid,t.id,group)) best={src:vid,dst:t.id,d}; } }
  return best;
}
function translateVerts(C,ids,dx,dy){ for(const v of C.verts) if(ids.has(v.id)){ v.x+=dx; v.y+=dy; } }
/* join src onto dst: src's rigid group is carried so that src lands exactly on
   dst, then every part that used src uses dst and src is gone */
function connect(C,src,dst){
  const s=vById(C,src), t=vById(C,dst);
  if(!s||!t) return false;
  translateVerts(C,fixedGroup(C,src),t.x-s.x,t.y-s.y);
  s.x=t.x; s.y=t.y;
  for(const e of C.els){ if(e.a===src) e.a=dst; if(e.b===src) e.b=dst; }
  C.verts=C.verts.filter(v=>v.id!==src);
  return true;
}
/* cut a junction: every part but the first gets its own new vertex, moved a
   little along the part, away from the junction (PhET's scissors button) */
const SPLIT_GAP=24;
function splitVertex(C,vid){
  const v=vById(C,vid), at=elsAt(C,vid);
  if(!v||at.length<2) return false;
  for(let k=1;k<at.length;k++){
    const e=at[k], o=vById(C,otherEnd(e,vid));
    const nv={id:C.nv++,x:v.x,y:v.y};
    C.verts.push(nv);
    if(e.a===vid) e.a=nv.id; else e.b=nv.id;
    const L=Math.hypot(o.x-v.x,o.y-v.y)||1, ux=(o.x-v.x)/L, uy=(o.y-v.y)/L;
    if(e.type==='wire'){ const g=Math.min(SPLIT_GAP,0.4*L); nv.x+=ux*g; nv.y+=uy*g; }
    else translateVerts(C,fixedGroup(C,nv.id),ux*SPLIT_GAP,uy*SPLIT_GAP);
  }
  return true;
}
/* remove a part; any vertex left attached to nothing goes with it */
function deleteElement(C,eid){
  const e=elById(C,eid); if(!e) return false;
  C.els=C.els.filter(x=>x.id!==eid);
  C.verts=C.verts.filter(v=>C.els.some(x=>x.a===v.id||x.b===v.id));
  return true;
}
function reverseBattery(C,eid){ const e=elById(C,eid); if(!e||!isBattery(e.type)) return false; const t=e.a; e.a=e.b; e.b=t; return true; }

/* ---------------- the netlist ---------------- */
/* one branch per traversable part: an open switch or a tripped fuse is not in
   the circuit at all (PhET's isTraversable).  realR freezes real bulbs. */
function netlistOf(C,glob,realR){
  const idx=new Map(); C.verts.forEach((v,k)=>idx.set(v.id,k));
  const br=[], off=[];
  for(const el of C.els){
    if((el.type==='switch'&&!el.closed)||(el.type==='fuse'&&el.tripped)){ off.push(el); continue; }
    let R=0, E=0, kind='R';
    if(isBattery(el.type)){ kind='B'; R=glob.rbat; E=el.E; }
    else if(el.type==='wire') R=wireR(elLength(C,el),glob.rho);
    else if(el.type==='fuse') R=fuseR(el.rating);
    else if(el.type==='switch') R=0;
    else if(el.type==='rbulb') R=realR&&realR.has(el.id)?realR.get(el.id):REAL_COLD;
    else R=el.R;
    if(!(R>0)) R=MIN_R;                          /* PhET: resistance || MINIMUM_RESISTANCE */
    br.push({a:idx.get(el.a),b:idx.get(el.b),R,E,kind,el});
  }
  return {N:C.verts.length,br,off,idx};
}

/* ---------------- dense linear algebra ---------------- */
/* Gaussian elimination with partial pivoting, then `refine` passes of
   iterative refinement against the untouched matrix */
function gaussSolve(A,z,refine){
  const n=z.length, M=A.map(r=>Float64Array.from(r)), b=Float64Array.from(z), perm=new Int32Array(n);
  for(let i=0;i<n;i++) perm[i]=i;
  for(let c=0;c<n;c++){
    let p=c, best=Math.abs(M[c][c]);
    for(let r=c+1;r<n;r++){ const a=Math.abs(M[r][c]); if(a>best){ best=a; p=r; } }
    if(best===0) throw new Error('singular circuit matrix at column '+c);
    if(p!==c){ const t=M[c]; M[c]=M[p]; M[p]=t; const u=perm[c]; perm[c]=perm[p]; perm[p]=u; }
    const piv=M[c][c], Rc=M[c];
    for(let r=c+1;r<n;r++){ const Rr=M[r], f=Rr[c]/piv; if(f===0) continue;
      Rr[c]=f; for(let k=c+1;k<n;k++) Rr[k]-=f*Rc[k]; }
  }
  const luSolve=rhs=>{ const y=new Float64Array(n);
    for(let i=0;i<n;i++){ let s=rhs[perm[i]]; const Ri=M[i]; for(let k=0;k<i;k++) s-=Ri[k]*y[k]; y[i]=s; }
    for(let i=n-1;i>=0;i--){ let s=y[i]; const Ri=M[i]; for(let k=i+1;k<n;k++) s-=Ri[k]*y[k]; y[i]=s/Ri[i]; }
    return y; };
  const x=luSolve(b);
  for(let it=0;it<(refine||0);it++){
    const r=new Float64Array(n);
    for(let i=0;i<n;i++){ let s=z[i]; const Ai=A[i]; for(let k=0;k<n;k++) s-=Ai[k]*x[k]; r[i]=s; }
    const d=luSolve(r); for(let i=0;i<n;i++) x[i]+=d[i];
  }
  return x;
}

/* ---------------- modified nodal analysis ---------------- */
/* Unknowns: the voltage of every node except one reference per connected
   piece, and the current of EVERY branch.  Rows: Kirchhoff's current law at
   each non-reference node, and each branch's own law
        v_a - v_b - R i = -E        (i flows a -> b through the part)
   divided by max(1,R) so no row carries a coefficient above 1.  A battery's
   EMF raises the potential from a (its - terminal) to b (+).  PhET keeps only
   the batteries' and the zero-resistance parts' currents as unknowns and
   gets every other current as (v_a - v_b)/R; keeping them all makes the
   current law a row of the system, so it closes to rounding error. */
function componentsOf(N,br){
  const par=new Int32Array(N); for(let q=0;q<N;q++) par[q]=q;
  const find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  for(const e of br){ const ra=find(e.a), rb=find(e.b); if(ra!==rb){ if(ra<rb) par[rb]=ra; else par[ra]=rb; } }
  const comp=new Int32Array(N); for(let q=0;q<N;q++) comp[q]=find(q);
  return comp;
}
/* each piece's 0 V: the - terminal of its first battery, else its first node */
function referencesOf(N,br,comp){
  const ref=new Map();
  for(const e of br) if(e.kind==='B'&&!ref.has(comp[e.a])) ref.set(comp[e.a],e.a);
  for(let q=0;q<N;q++) if(!ref.has(comp[q])) ref.set(comp[q],q);
  return ref;
}
function mnaSystem(N,br,opt){
  opt=opt||{};
  const B=br.length, comp=componentsOf(N,br), ref=referencesOf(N,br,comp);
  const isRef=new Uint8Array(N); for(const r of ref.values()) isRef[r]=1;
  const vi=new Int32Array(N).fill(-1); let nv=0;
  for(let q=0;q<N;q++) if(!isRef[q]) vi[q]=nv++;
  const n=nv+B, A=[], z=new Float64Array(n);
  for(let r=0;r<n;r++) A.push(new Float64Array(n));
  br.forEach((e,k)=>{ if(vi[e.a]>=0) A[vi[e.a]][nv+k]+=1; if(vi[e.b]>=0) A[vi[e.b]][nv+k]-=1; });
  if(opt.inj) for(const [node,J] of opt.inj) if(vi[node]>=0) z[vi[node]]+=J;
  br.forEach((e,k)=>{
    const r=nv+k, s=Math.max(1,e.R);
    const E=(opt.zeroE||(opt.only!==undefined&&e.kind==='B'&&k!==opt.only))?0:e.E;
    if(vi[e.a]>=0) A[r][vi[e.a]]+=1/s;
    if(vi[e.b]>=0) A[r][vi[e.b]]-=1/s;
    A[r][nv+k]-=e.R/s;
    z[r]=-E/s;
  });
  return {A,z,n,nv,vi,comp,ref,B};
}
function mnaSolve(N,br,opt){
  const S=mnaSystem(N,br,opt);
  const x=S.n?gaussSolve(S.A,S.z,2):new Float64Array(0);
  const v=new Float64Array(N), i=new Float64Array(S.B);
  for(let q=0;q<N;q++) v[q]=S.vi[q]>=0?x[S.vi[q]]:0;
  for(let k=0;k<S.B;k++) i[k]=x[S.nv+k];
  return {v,i,comp:S.comp,ref:S.ref,nv:S.nv,n:S.n};
}

/* PhET's own formulation, kept as an independent twin for the tests: every
   resistor stamped as a conductance, each battery an ideal source (current
   unknown) in series with its internal resistance through a synthetic node.
   Returns node voltages and currents (v_a - v_b + E)/R. */
function phetSolve(N,br){
  const comp=componentsOf(N,br), ref=referencesOf(N,br,comp);
  const bats=[]; br.forEach((e,k)=>{ if(e.kind==='B') bats.push(k); });
  const NN=N+bats.length;                              /* + one synthetic node per battery */
  const isRef=new Uint8Array(NN); for(const r of ref.values()) isRef[r]=1;
  const vi=new Int32Array(NN).fill(-1); let nv=0;
  for(let q=0;q<NN;q++) if(!isRef[q]) vi[q]=nv++;
  const n=nv+bats.length, A=[], z=new Float64Array(n);
  for(let r=0;r<n;r++) A.push(new Float64Array(n));
  const stampG=(p,q,G)=>{ if(vi[p]>=0){ A[vi[p]][vi[p]]+=G; if(vi[q]>=0) A[vi[p]][vi[q]]-=G; }
                          if(vi[q]>=0){ A[vi[q]][vi[q]]+=G; if(vi[p]>=0) A[vi[q]][vi[p]]-=G; } };
  br.forEach((e,k)=>{ if(e.kind!=='B') stampG(e.a,e.b,1/e.R); });
  bats.forEach((k,j)=>{ const e=br[k], s=N+j, col=nv+j;
    /* ideal source from a to s: v_s - v_a = E, its current j flows a -> s */
    if(vi[e.a]>=0) A[vi[e.a]][col]+=1;
    if(vi[s]>=0) A[vi[s]][col]-=1;
    if(vi[s]>=0) A[col][vi[s]]+=1;
    if(vi[e.a]>=0) A[col][vi[e.a]]-=1;
    z[col]=e.E;
    stampG(s,e.b,1/e.R); });
  const x=n?gaussSolve(A,z,2):new Float64Array(0);
  const v=new Float64Array(N); for(let q=0;q<N;q++) v[q]=vi[q]>=0?x[vi[q]]:0;
  const i=br.map(e=>(v[e.a]-v[e.b]+e.E)/e.R);
  return {v,i,comp,ref};
}

/* ---------------- Kirchhoff, checked on the answer ---------------- */
/* a spanning forest by breadth-first search; every other branch (a chord)
   closes exactly one loop: the fundamental loops, B - N + C of them */
function cycleBasis(N,br){
  const adj=[]; for(let q=0;q<N;q++) adj.push([]);
  br.forEach((e,k)=>{ adj[e.a].push([e.b,k]); adj[e.b].push([e.a,k]); });
  const par=new Int32Array(N).fill(-2), pk=new Int32Array(N).fill(-1), depth=new Int32Array(N), tree=new Uint8Array(br.length);
  for(let r=0;r<N;r++){ if(par[r]!==-2) continue; par[r]=-1; const q=[r];
    for(let h=0;h<q.length;h++){ const u=q[h];
      for(const [w,k] of adj[u]) if(par[w]===-2){ par[w]=u; pk[w]=k; depth[w]=depth[u]+1; tree[k]=1; q.push(w); } } }
  const loops=[];
  br.forEach((e,k)=>{ if(tree[k]) return;
    /* chord a -> b, then the tree path back from b to a; s = +1 when the loop
       runs through a branch from its a to its b */
    const up=[], down=[]; let x=e.b, y=e.a;
    while(depth[x]>depth[y]){ up.push(x); x=par[x]; }
    while(depth[y]>depth[x]){ down.push(y); y=par[y]; }
    while(x!==y){ up.push(x); x=par[x]; down.push(y); y=par[y]; }
    const L=[{k,s:1}];
    for(const u of up){ const kk=pk[u]; L.push({k:kk,s:br[kk].a===u?1:-1}); }
    for(let j=down.length-1;j>=0;j--){ const u=down[j], kk=pk[u]; L.push({k:kk,s:br[kk].b===u?1:-1}); }
    loops.push(L); });
  return {tree,loops,par,pk};
}
/* the law residuals of a solution, on the ANSWER (not assumed): the current
   law at every node and the voltage law round every fundamental loop, each
   part's drop taken from its own law R i - E.  Both are measured against the
   scale of the connected piece they sit in -- its largest current, its
   largest voltage, EMF or drop -- because that is the ruler rounding error
   is made on: a dangling part carrying 1e-30 A is not "100 % off", and a
   loop of 1e-10-ohm parts at 9 V cannot close better than 9 V's last bit. */
function kirchhoff(N,br,sol,basis){
  const comp=sol.comp, Isc=new Map(), Vsc=new Map();
  const up=(m,c,x)=>{ if(!(m.get(c)>=x)) m.set(c,x); };
  br.forEach((e,k)=>{ const c=comp[e.a]; up(Isc,c,Math.abs(sol.i[k])); up(Vsc,c,Math.max(Math.abs(e.E),Math.abs(e.R*sol.i[k]))); });
  for(let q=0;q<N;q++) up(Vsc,comp[q],Math.abs(sol.v[q]));
  const sum=new Float64Array(N);
  br.forEach((e,k)=>{ const c=sol.i[k]; sum[e.a]+=c; sum[e.b]-=c; });
  let kcl=0, kclAbs=0;
  for(let q=0;q<N;q++){ const s=Math.abs(sum[q]), m=Isc.get(comp[q])||0;
    kclAbs=Math.max(kclAbs,s); if(m>0) kcl=Math.max(kcl,s/m); else if(s>0) kcl=Infinity; }
  let kvl=0, kvlAbs=0; const per=[];
  for(const L of basis.loops){ let s=0;
    for(const {k,s:sg} of L){ const e=br[k]; s+=sg*(e.R*sol.i[k]-e.E); }
    const m=Vsc.get(comp[br[L[0].k].a])||0;
    per.push({sum:s,scale:m}); kvlAbs=Math.max(kvlAbs,Math.abs(s)); if(m>0) kvl=Math.max(kvl,Math.abs(s)/m); else if(s!==0) kvl=Infinity; }
  return {kcl,kclAbs,kvl,kvlAbs,node:sum,per,Isc,Vsc};
}

/* ---------------- the whole circuit, solved ---------------- */
/* Real bulbs are iterated to their fixed point (PhET stops after ten
   passes); a fuse carrying more than its rating trips and the circuit is
   solved again without it, until nothing more trips.  Tripping is a state
   change of the part, as in PhET: it stays blown until repaired. */
function solveCircuit(C,glob){
  const trips=[];
  for(let round=0;round<60;round++){
    const realR=new Map();
    let net=netlistOf(C,glob,realR), sol=mnaSolve(net.N,net.br), passes=0;
    const reals=[]; net.br.forEach((e,k)=>{ if(e.el.type==='rbulb') reals.push(k); });
    if(reals.length){
      for(passes=1;passes<=200;passes++){
        let dmax=0;
        for(const k of reals){ const e=net.br[k], Rn=realBulbR(sol.v[e.a]-sol.v[e.b]);
          dmax=Math.max(dmax,Math.abs(Rn-e.R)/Rn); realR.set(e.el.id,Rn); }
        net=netlistOf(C,glob,realR); sol=mnaSolve(net.N,net.br);
        if(dmax<=1e-14) break;
      }
    }
    let blew=false;
    net.br.forEach((e,k)=>{ if(e.el.type==='fuse'&&Math.abs(sol.i[k])>e.el.rating+FUSE_EPS){ e.el.tripped=true; blew=true; trips.push(e.el.id); } });
    if(!blew) return packSolution(C,glob,net,sol,passes,trips,realR);
  }
  throw new Error('fuses kept tripping');
}
function packSolution(C,glob,net,sol,passes,trips,realR){
  const V=new Map(), comp=new Map(), I=new Map(), R=new Map(), P=new Map(), bright=new Map(), fire=new Set(), onK=new Map();
  C.verts.forEach((v,k)=>{ V.set(v.id,sol.v[k]); comp.set(v.id,sol.comp[k]); });
  net.br.forEach((e,k)=>{ const c=sol.i[k]; I.set(e.el.id,c); R.set(e.el.id,e.R); onK.set(e.el.id,k);
    if(e.kind==='B'){ P.set(e.el.id,{emf:e.E*c,loss:c*c*e.R}); }
    else P.set(e.el.id,c*c*e.R);
    if(isBulb(e.el.type)) bright.set(e.el.id,brightnessOf(c*c*e.R));
    if(isFlammable(e.el.type)&&Math.abs(c)>=FIRE_I&&e.R>=FIRE_R) fire.add(e.el.id); });
  for(const el of net.off){ I.set(el.id,0); R.set(el.id,Infinity); P.set(el.id,0); if(isBulb(el.type)) bright.set(el.id,0); }
  const basis=cycleBasis(net.N,net.br), law=kirchhoff(net.N,net.br,sol,basis);
  const ncomp=new Set(sol.comp).size;
  let Imax=0; for(const c of sol.i) Imax=Math.max(Imax,Math.abs(c));
  return {V,comp,I,R,P,bright,fire,onK,net,sol,basis,law,passes,trips,realR,
    nodes:net.N,branches:net.br.length,comps:ncomp,loops:net.br.length-net.N+ncomp,Imax};
}

/* ---------------- what the meters read ---------------- */
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t=L2>0?((px-ax)*dx+(py-ay)*dy)/L2:0; t=clamp(t,0,1);
  return {d:Math.hypot(px-ax-t*dx,py-ay-t*dy),t};
}
const METAL_HALF=9, SWITCH_HALF=13;
/* PhET's getVoltageConnection: a probe within the solder radius of a vertex
   reads that vertex; on a metal part (wire, coin, paper clip) it reads the
   voltage interpolated along the part; on a switch, the side it touches;
   anywhere else (a battery's or a resistor's body) nothing */
function probeConnection(C,SOL,x,y){
  let best=null;
  for(const v of C.verts){ const d=Math.hypot(v.x-x,v.y-y); if(d<=SOLDER_R&&(!best||d<best.d)) best={d,vid:v.id,V:SOL.V.get(v.id)}; }
  if(best) return best;
  for(const e of C.els){ if(!isMetal(e.type)) continue;
    const A=vById(C,e.a), B=vById(C,e.b), s=segDist(x,y,A.x,A.y,B.x,B.y);
    if(s.d<=METAL_HALF) return {d:s.d,vid:e.a,el:e.id,t:s.t,V:lerp(SOL.V.get(e.a),SOL.V.get(e.b),s.t)}; }
  for(const e of C.els){ if(e.type!=='switch') continue;
    const A=vById(C,e.a), B=vById(C,e.b), s=segDist(x,y,A.x,A.y,B.x,B.y);
    if(s.d<=SWITCH_HALF){ const vid=s.t<0.5?e.a:e.b; return {d:s.d,vid,el:e.id,V:SOL.V.get(vid)}; } }
  return null;
}
/* the voltmeter: red minus black, and only when the two probes touch parts of
   one connected circuit (PhET's areVerticesElectricallyConnected) */
function voltmeterReading(C,SOL,red,black){
  const r=probeConnection(C,SOL,red[0],red[1]), b=probeConnection(C,SOL,black[0],black[1]);
  if(!r||!b) return {V:null,r,b};
  if(SOL.comp.get(r.vid)!==SOL.comp.get(b.vid)) return {V:null,r,b,apart:true};
  return {V:r.V-b.V,r,b};
}
/* the non-contact ammeter reads the current of the part under its ring:
   fixed parts first, then wires (PhET's getCurrent) */
const RING_HALF=14;
function ammeterReading(C,SOL,x,y){
  for(const wantWire of [false,true]){
    let hit=null;
    for(const e of C.els){ if((e.type==='wire')!==wantWire) continue;
      const A=vById(C,e.a), B=vById(C,e.b), s=segDist(x,y,A.x,A.y,B.x,B.y);
      if(s.d<=RING_HALF&&(!hit||s.d<hit.d)) hit={d:s.d,el:e.id}; }
    if(hit) return {el:hit.el,I:SOL.I.get(hit.el)};
  }
  return null;
}
/* a series ammeter reads only when both of its ends are joined to something */
function seriesReading(C,SOL,e){
  if(elsAt(C,e.a).length<2||elsAt(C,e.b).length<2) return null;
  return SOL.I.get(e.id);
}
function currentText(I,series){
  if(I===null||I===undefined||!isFinite(I)) return '—';
  const cap=series?I_READ_SERIES:I_READ_MAX;
  if(Math.abs(I)>cap) return '> 10^'+(series?3:10);
  return Math.abs(I).toFixed(2)+' A';       /* PhET: magnitude, METER_PRECISION = 2 */
}
function voltageText(V){ return V===null||V===undefined||!isFinite(V)?'—':V.toFixed(2)+' V'; }

/* ---------------- the rest of the circuit, seen from one part ---------------- */
/* V_oc: the voltage (v_a - v_b) the rest makes across the part's terminals
   with the part taken out; R_th: the voltage per ampere pushed in at a and
   drawn out at b with every EMF zeroed.  Real bulbs elsewhere are frozen at
   their present resistance (a non-linear part has no Thevenin equivalent;
   this is its tangent at the operating point). */
function theveninOf(SOL,eid){
  const k=SOL.onK.get(eid); if(k===undefined) return null;
  const br=SOL.net.br, e=br[k], rest=br.slice(0,k).concat(br.slice(k+1)), N=SOL.net.N;
  const comp=componentsOf(N,rest);
  if(comp[e.a]!==comp[e.b]) return {open:true,e,k};
  const s1=mnaSolve(N,rest), Voc=s1.v[e.a]-s1.v[e.b];
  const s2=mnaSolve(N,rest,{inj:[[e.a,1],[e.b,-1]],zeroE:true}), Rth=s2.v[e.a]-s2.v[e.b];
  return {open:false,e,k,Voc,Rth,E:e.E,R:e.R,i:SOL.sol.i[k]};
}
/* superposition: each battery alone, the others' EMFs zeroed and their
   internal resistances kept */
function superpose(SOL){
  const br=SOL.net.br, N=SOL.net.N, bats=[];
  br.forEach((e,k)=>{ if(e.kind==='B') bats.push(k); });
  const parts=bats.map(kb=>mnaSolve(N,br,{only:kb}).i);
  return {bats,parts};
}

/* ---------------- the charges ---------------- */
/* PhET's layoutCharges: ceil((L-28)/28) charges evenly from 14 to L-14
   (one in the middle when that is one or none) */
function chargeLayout(L){
  const s=L-CHARGE_SEP, o=Math.ceil(s/CHARGE_SEP);
  if(o<=1) return [L/2];
  const a=s/(o-1), out=[];
  for(let l=0;l<o;l++) out.push(14+l*a);
  return out;
}
/* where a part's charges sit, along it from its start: the layout slid by
   the part's phase -- forwards for conventional (positive) charge, backwards
   for electrons, which drift against the current -- and wrapped round */
function chargePositions(L,phase,carrier){
  const ph=carrier==='electrons'?-phase:phase;
  return chargeLayout(L).map(p0=>((p0+ph)%L+L)%L);
}
/* the animation slows when the largest current would move a charge more than
   0.43 of the charge spacing in a 1/30-s frame (PhET's speed limit) */
function chargeScale(Imax){ const n=CHARGE_SPEED*Imax/30, cap=CHARGE_FRAC*CHARGE_SEP; return n>=cap?cap/n:1; }
/* ================================================================== *
 *  state, the model of each view, readout, equation bar, tag           *
 * ================================================================== */
const TABS=[['lab','the lab'],['graph','nodes and branches'],['power','the power budget'],
            ['thev','the rest of the circuit'],['super','one battery at a time']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', text:'#cfd4de', dim:'#8b93a6',
           faint:'#6f7789', edge:'#242a3a', panel:'#10131b', panelEdge:'#2a2f3d', ink:'#e9ecf2', bg:'#070b18',
           fire:'#e8843a', fire2:'#f2c14e', probeRed:'#d9534f', probeBlack:'#232838'};
const RO_W=306;
const PRESET_NAMES={empty:'empty',bulb:'one bulb',series:'series',parallel:'parallel',bridge:'Wheatstone bridge',
                    twobat:'two batteries',short:'short circuit'};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
/* PhET's defaults: lifelike, current shown as electrons, labels on, values
   off, zoom 1, real bulbs off, the thinnest wire and the stiffest battery.
   PhET opens on an empty bench; this opens on one bulb so every view has a
   circuit to show ("empty" gives PhET's start). */
const DEFAULTS={view:'lab', preset:'bulb', circ:presetCircuit('bulb'),
  rho:RHO_MIN, rbat:BATT_R_MIN, realBulbs:false,
  look:'lifelike', showCurrent:true, carrier:'electrons', showLabels:true, showValues:false,
  zoom:1, sel:null, selV:null, thevEl:null,
  vm:{on:false, bx:0, by:215, rx:51, ry:100, kx:-51, ky:100},
  am:{on:false, bx:250, by:175, px:150, py:20},
  phase:{}, clock:0};
const ST=clone(DEFAULTS);
const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function resetState(over){ Object.assign(ST,clone(DEFAULTS),over?clone(over):{}); for(const k in MEMO) delete MEMO[k]; }
function applyPreset(st,key){ st.preset=key; st.circ=presetCircuit(key); st.sel=null; st.selV=null; st.thevEl=null; st.phase={}; }
function globOf(st){ return {rho:st.rho,rbat:st.rbat}; }
function circKey(st){ return JSON.stringify([st.circ.verts,st.circ.els,st.rho,st.rbat]); }
/* every edit to the circuit passes through here: the preset chip lets go */
function circuitEdited(st){ st.preset='custom'; }
function solutionOf(st){
  let sol=memo('sol',circKey(st),()=>solveCircuit(st.circ,globOf(st)));
  /* a fuse that blew during that solve changed the circuit: key it again */
  if(sol.trips.length) sol=memo('sol',circKey(st),()=>solveCircuit(st.circ,globOf(st)));
  return sol;
}
/* the part the analysis views look from: the selection if it is in the
   circuit, else the first bulb, resistor or household object, else the
   first part that is not a wire */
function focusElement(st,SOL){
  const want=st.thevEl!==null?st.thevEl:st.sel;
  if(want!==null&&SOL.onK.has(want)) return want;
  for(const e of st.circ.els) if(SOL.onK.has(e.id)&&(isBulb(e.type)||['resistor','xresistor','pencil','tpencil','eraser','bill'].indexOf(e.type)>=0)) return e.id;
  for(const e of st.circ.els) if(SOL.onK.has(e.id)&&e.type!=='wire') return e.id;
  return null;
}
function elName(e){ return e?TYPES[e.type].name:''; }
/* a short unique tag for a part: its name and its number of that kind */
function elTag(C,e){ let n=0; for(const x of C.els){ if(x.type===e.type) n++; if(x===e) break; }
  return TYPES[e.type].name+(countType(C,e.type)>1?' '+n:''); }

function buildModel(){
  const st=ST, M={view:st.view, st};
  M.sol=solutionOf(st);
  M.scale=chargeScale(M.sol.Imax);
  M.vm=st.vm.on?voltmeterReading(st.circ,M.sol,[st.vm.rx,st.vm.ry],[st.vm.kx,st.vm.ky]):null;
  M.am=st.am.on?ammeterReading(st.circ,M.sol,st.am.px,st.am.py):null;
  M.sel=st.sel!==null?elById(st.circ,st.sel):null;
  M.focus=focusElement(st,M.sol);
  if(st.view==='thev'&&M.focus!==null) M.thev=memo('thev',circKey(st)+'|'+M.focus,()=>theveninOf(M.sol,M.focus));
  if(st.view==='super') M.sup=memo('sup',circKey(st),()=>superpose(M.sol));
  if(st.view==='power') M.bud=powerBudget(M.sol,st.circ);
  return M;
}
/* the power ledger: each EMF's E i, each resistance's i^2 R (a battery's own
   r included), and Tellegen's sum of (v_a - v_b) i over every branch */
function powerBudget(SOL,C){
  const src=[], sink=[];
  let gen=0, dis=0, tel=0, scale=0;
  SOL.net.br.forEach((e,k)=>{ const i=SOL.sol.i[k], u=SOL.sol.v[e.a]-SOL.sol.v[e.b];
    tel+=u*i; scale=Math.max(scale,Math.abs(u*i),Math.abs(e.E*i));
    if(e.kind==='B'){ src.push({el:e.el,P:e.E*i}); gen+=e.E*i; sink.push({el:e.el,P:i*i*e.R,internal:true}); dis+=i*i*e.R; }
    else { sink.push({el:e.el,P:i*i*e.R}); dis+=i*i*e.R; } });
  return {src,sink,gen,dis,tel,scale};
}

/* ================================================================== *
 *  number formats                                                     *
 * ================================================================== */
/* SI prefixes, written as literal glyphs (µ and the minus sign) so the same
   string serves the HTML readout and the canvas (Known-bad: &micro; is not in
   plain()'s table) */
const SI_PRE=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
function siFmt(x,unit,sig){
  if(!isFinite(x)) return '—';
  if(x===0) return '0 '+unit;
  const a=Math.abs(x), n=sig||3;
  let p=SI_PRE[SI_PRE.length-1];
  for(const q of SI_PRE){ if(a>=q[0]){ p=q; break; } }
  let s=sigf(x/p[0],n);
  if(Math.abs(parseFloat(s))>=1000&&p[0]<1e9){ const q=SI_PRE[SI_PRE.indexOf(p)-1]; p=q; s=sigf(x/p[0],n); }
  return s.replace('-','−')+' '+p[1]+unit;
}
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function pow10(e){ return '10'+String(e).split('').map(c=>SUP[c]).join(''); }
function fmtR(R){ return isFinite(R)?siFmt(R,'Ω'):'∞'; }
function fmtI(I){ return siFmt(I,'A'); }
function fmtV(V){ return siFmt(V,'V'); }
function fmtP(P){ return siFmt(P,'W'); }
/* a residual: its power of ten (a mantissa is noise at this level) */
function fmtRes(x){ if(!isFinite(x)) return '—'; if(x===0) return '0 (exact)';
  const e=Math.floor(Math.log10(x)); return (x/Math.pow(10,e)).toFixed(1)+'×'+pow10(e); }
/* PhET's value label for each part (Values checkbox) */
function valueText(e,SOL){
  const T=TYPES[e.type];
  if(isBattery(e.type)) return fmt(e.E,T.dp)+' V';
  if(e.type==='fuse') return fmt(fuseR(e.rating)*1000,1)+' mΩ ≤ '+fmt(e.rating,1)+' A';
  if(e.type==='rbulb') return fmt(SOL.R.get(e.id)||REAL_COLD,1)+' Ω';
  if(e.type==='wire'||e.type==='switch'||e.type==='ammeter') return '';
  if(T.dp!==undefined) return fmt(e.R,T.dp)+' Ω';
  return fmtR(e.R);
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function lawRows(SOL){
  const L=SOL.law, eps=Number.EPSILON;
  return rrow('current law, worst node',fmtRes(L.kcl),L.kcl<=8*eps?'good':'bad')
        +rrow('voltage law, worst loop',fmtRes(L.kvl),L.kvl<=8*eps?'good':'bad');
}
function census(SOL,C){
  const n=C.els.length;
  return rrow('parts',n?(n+' ('+countType(C,'wire')+' wire'+(countType(C,'wire')===1?'':'s')+')'):'none on the bench')
    +rrow('nodes, branches, pieces',SOL.nodes+', '+SOL.branches+', '+SOL.comps)
    +rrow('independent loops',SOL.loops);
}
function selRows(M){
  const e=M.sel, SOL=M.sol, C=M.st.circ;
  if(!e) return hd('selected part')+rrow('none','tap a part');
  const I=SOL.I.get(e.id), R=SOL.R.get(e.id), A=vById(C,e.a), B=vById(C,e.b);
  const same=SOL.comp.get(e.a)===SOL.comp.get(e.b);
  const u=same?SOL.V.get(e.a)-SOL.V.get(e.b):NaN;
  let s=hd('selected: '+elTag(C,e));
  if(isBattery(e.type)){ s+=rrow('EMF E, internal r',fmt(e.E,TYPES[e.type].dp)+' V, '+fmtR(M.st.rbat))
      +rrow('terminal voltage, + minus &minus;',same?fmtV(-u):'&mdash;')+rrow('current',fmtI(Math.abs(I)))
      +rrow('delivers E&middot;i',fmtP(e.E*I)); }
  else { const open=(e.type==='switch'&&!e.closed)||(e.type==='fuse'&&e.tripped);
    s+=rrow('resistance',open?(e.type==='switch'?'open':'blown'):fmtR(R))
      +rrow('voltage across',same?fmtV(Math.abs(u)):'&mdash;')+rrow('current',fmtI(Math.abs(I)))
      +rrow('power i&sup2;R',fmtP(I*I*(isFinite(R)?R:0)));
    if(isBulb(e.type)) s+=rrow('brightness (PhET&rsquo;s rule)',fmt(SOL.bright.get(e.id)||0,3),'good');
    if(e.type==='fuse') s+=rrow('rating',fmt(e.rating,1)+' A'+(e.tripped?' &mdash; blown':''),e.tripped?'bad':''); }
  if(SOL.fire.has(e.id)) s+=rrow('on fire','|I| &ge; 15 A','bad');
  return s;
}
function meterRows(M){
  const st=M.st; let s='';
  if(st.vm.on||st.am.on) s+=hd('meters');
  if(st.vm.on) s+=rrow('voltmeter, red &minus; black',voltageText(M.vm&&M.vm.V),M.vm&&M.vm.V!==null?'good':'');
  if(st.am.on) s+=rrow('non-contact ammeter',currentText(M.am?Math.abs(M.am.I):null,false),M.am?'good':'');
  const ams=st.circ.els.filter(e=>e.type==='ammeter');
  if(ams.length){ if(!(st.vm.on||st.am.on)) s+=hd('meters');
    ams.slice(0,3).forEach(e=>{ const r=seriesReading(st.circ,M.sol,e); s+=rrow(elTag(st.circ,e),currentText(r===null?null:Math.abs(r),true),r!==null?'good':''); }); }
  return s;
}
function readoutHTML(M){
  const st=M.st, SOL=M.sol, C=st.circ;
  let s='<div class="rname">circuit construction kit<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  if(M.view==='lab'){
    s+=hd('the circuit')+census(SOL,C)+lawRows(SOL);
    s+=selRows(M)+meterRows(M);
    const notes=[];
    if(SOL.fire.size) notes.push('<b>Fire:</b> '+SOL.fire.size+' part'+(SOL.fire.size===1?'':'s')+' carrying 15 A or more.');
    const blown=C.els.filter(e=>e.type==='fuse'&&e.tripped).length;
    if(blown) notes.push('<b>'+blown+' blown fuse'+(blown===1?'':'s')+'</b>: select it and repair it.');
    if(st.showCurrent&&M.scale<1) notes.push(speedNote(M.scale));
    s+='</table>'+(notes.length?'<div class="note">'+notes.join(' ')+'</div>':'');
    s+='<div class="note">Solved by modified nodal analysis with every branch current an unknown; the laws are checked on the answer.</div>';
    return s;
  }
  if(M.view==='graph'){
    const n=SOL.nodes-SOL.comps;
    s+=hd('the graph')+rrow('nodes N',SOL.nodes)+rrow('branches B',SOL.branches)+rrow('connected pieces C',SOL.comps)
      +rrow('loops B &minus; N + C',SOL.loops,'good');
    s+=hd('the system')+rrow('node voltages (N &minus; C)',n)+rrow('branch currents (B)',SOL.branches)+rrow('unknowns',n+SOL.branches);
    s+=hd('on the answer')+lawRows(SOL)
      +rrow('largest node residual',fmtI(SOL.law.kclAbs))+rrow('largest loop residual',fmtV(SOL.law.kvlAbs));
    s+='</table><div class="note">Residuals are relative to the largest current and voltage in the piece they sit in; 8 &times; 2.2&times;10<sup>&minus;16</sup> is the pass mark.</div>';
    return s;
  }
  if(M.view==='power'){
    const B=M.bud;
    s+=hd('the ledger')+rrow('EMFs deliver &Sigma; E i',fmtP(B.gen),'good')+rrow('resistances take &Sigma; i&sup2;R',fmtP(B.dis),'good')
      +rrow('of which inside batteries',fmtP(B.sink.filter(x=>x.internal).reduce((a,x)=>a+x.P,0)))
      +rrow('Tellegen &Sigma; (v<sub>a</sub>&minus;v<sub>b</sub>) i',fmtRes(B.scale>0?Math.abs(B.tel)/B.scale:0)+' of the largest term',Math.abs(B.tel)<=64*Number.EPSILON*Math.max(B.scale,1e-300)*Math.max(1,SOL.branches)?'good':'bad');
    const bulbs=C.els.filter(e=>isBulb(e.type)&&SOL.onK.has(e.id));
    if(bulbs.length){ s+=hd('bulbs, PhET&rsquo;s brightness');
      bulbs.slice(0,4).forEach(e=>{ s+=rrow(elTag(C,e)+', '+fmtP(SOL.P.get(e.id)),fmt(SOL.bright.get(e.id),3)); }); }
    s+='</table><div class="note">Brightness b = ln(1 + 0.35 P)/ln(1 + 0.35&middot;2000), PhET&rsquo;s rule: full at 2 kW, 0.21 for 8.1 W.</div>';
    return s;
  }
  if(M.view==='thev'){
    const T=M.thev, e=M.focus!==null?elById(C,M.focus):null;
    if(!T){ s+=hd('the part')+rrow('none','the circuit has no part to look from')+'</table>'; return s; }
    s+=hd('seen from: '+elTag(C,e));
    if(T.open){ s+=rrow('the rest of the circuit','no path back')+rrow('current','0 A')+'</table><div class="note">This part is not in any loop: take it out and nothing else joins its two ends, so no current can flow through it.</div>'; return s; }
    s+=rrow('V<sub>th</sub>, part removed',fmtV(T.Voc))+rrow('R<sub>th</sub>, EMFs zeroed',fmtR(T.Rth))
      +rrow('short-circuit current V<sub>th</sub>/R<sub>th</sub>',fmtI(T.Voc/T.Rth));
    s+=hd('the operating point')+rrow('i = (V<sub>th</sub>+E)/(R<sub>th</sub>+R)',fmtI((T.Voc+T.E)/(T.Rth+T.R)),'good')+rrow('full solve',fmtI(T.i),'good');
    if(T.E===0) s+=rrow('P at R = R<sub>th</sub>',fmtP(T.Voc*T.Voc/(4*T.Rth)))+rrow('P now',fmtP(T.i*T.i*T.R));
    s+='</table><div class="note">'+(M.sol.realR.size?'Real bulbs are frozen at their present resistance: this is the tangent at the operating point. ':'')
      +'Choose the part in the lab (tap it), or step through the parts with the buttons.</div>';
    return s;
  }
  /* superposition */
  const Sp=M.sup;
  s+=hd('batteries')+rrow('in the circuit',Sp.bats.length);
  let worst=0; SOL.net.br.forEach((e,k)=>{ let t=0; for(const p of Sp.parts) t+=p[k]; worst=Math.max(worst,Math.abs(t-SOL.sol.i[k])); });
  const Isc=Math.max(SOL.Imax,1e-300);
  s+=rrow('&Sigma; of the parts &minus; full solve',fmtRes(Sp.bats.length?worst/Isc:0)+' of the largest current',worst<=64*Number.EPSILON*Isc?'good':'bad');
  Sp.bats.slice(0,4).forEach((kb,j)=>{ const e=SOL.net.br[kb].el; s+=rrow(elTag(C,e)+' alone drives',fmtI(Math.abs(Sp.parts[j][kb]))+' through itself'); });
  s+='</table><div class="note">Each battery alone: every other EMF set to zero, every internal resistance kept. Linear parts only'+(SOL.realR.size?' (real bulbs frozen at their present resistance)':'')+'.</div>';
  return s;
}
function eqbarHTML(M){
  if(M.view==='lab') return '<span class="lhs">&Sigma;&thinsp;i = 0</span> at every node &nbsp;&middot;&nbsp; <span class="lhs">&Sigma;&thinsp;&Delta;v = 0</span> round every loop &nbsp;&middot;&nbsp; <span class="hl">v<sub>a</sub> &minus; v<sub>b</sub> = R i &minus; E</span>'
    +'<span class="sm">Kirchhoff&rsquo;s two laws and each part&rsquo;s own law, solved together for the whole circuit; a battery is an EMF E behind an internal resistance r</span>';
  if(M.view==='graph') return '<span class="lhs">A i = 0</span>, &nbsp; <span class="lhs">A<sup>T</sup>v &minus; R i = &minus;E</span> &nbsp;&middot;&nbsp; <span class="hl">(N &minus; C) + B unknowns</span>'
    +'<span class="sm">A is the incidence matrix (a node&rsquo;s row: +1 where a branch leaves it, &minus;1 where one arrives); the first block is the current law, the second every branch&rsquo;s own law</span>';
  if(M.view==='power') return '<span class="lhs">&Sigma; E i</span> = <span class="hl">&Sigma; i&sup2; R</span> &nbsp;&middot;&nbsp; <span class="lhs">&Sigma; (v<sub>a</sub> &minus; v<sub>b</sub>) i = 0</span>'
    +'<span class="sm">Tellegen&rsquo;s theorem: any currents that obey the current law, times any voltages that come from potentials, sum to zero &mdash; so what the EMFs deliver is exactly what the resistances dissipate</span>';

function worldFitUp(b,ext,pad){

function lab(ctx,W,H,x,y,txt,col,font,align,base){

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);

/* the frame of a part: t runs along it from A (its start) to B, s across it,

  return {A,B,L,ux,uy,nx:uy,ny:-ux,P:(t,s)=>[A[0]+ux*t+uy*s,A[1]+uy*t-ux*s]}; }

    if(e.tripped){ strokePts(ctx,[F.P(0.22*L,0),F.P(0.44*L,1.5*w)],'#d9dce3',lw(1.8)); strokePts(ctx,[F.P(0.56*L,-1.5*w),F.P(0.78*L,0)],'#d9dce3',lw(1.8));
      fillPts(ctx,circlePts(F.P(0.5*L,0),4.5*w),COL.ref); }

    fillPts(ctx,rectF(F,0.16*L,0.84*L,-h,h),'#d9b44a','#7a6320',lw(1));

function drawPartSchem(ctx,e,A,B,w,o){
  const F=frameOf(A,B), L=F.L, col=COL.struct, lw=Math.max(1.5,3*w), t=e.type;
  const line=(t0,t1)=>strokePts(ctx,[F.P(t0,0),F.P(t1,0)],col,lw);
  if(t==='wire'){ strokePts(ctx,[A,B],col,lw); return; }
  if(t==='battery'){ line(0,0.44*L); line(0.56*L,L);
    strokePts(ctx,[F.P(0.44*L,-10*w),F.P(0.44*L,10*w)],col,Math.max(2.5,6*w)); strokePts(ctx,[F.P(0.56*L,-20*w),F.P(0.56*L,20*w)],col,lw);
    if(w>=0.45&&!o.icon){ const p=F.P(0.66*L,16*w); tagText(ctx,p[0],p[1],'+',col,Math.round(Math.max(9,13*w))+'px -apple-system, sans-serif'); }
    return; }
  if(t==='xbattery'){ line(0,0.34*L); line(0.66*L,L); strokePts(ctx,[F.P(0.44*L,0),F.P(0.56*L,0)],col,lw,[3,3]);
    for(const [a,b] of [[0.34,0.42],[0.58,0.66]]){ strokePts(ctx,[F.P(a*L,-8*w),F.P(a*L,8*w)],col,Math.max(2.5,6*w)); strokePts(ctx,[F.P(b*L,-18*w),F.P(b*L,18*w)],col,lw); }
    return; }
  if(isBulb(t)){ const c=F.P(0.5*L,0), R=18*w, b=o.bright||0; line(0,0.5*L-R); line(0.5*L+R,L);
    fillPts(ctx,circlePts(c,R),b>1e-6?'rgba(255,236,160,'+fmt(0.12+0.6*b,3)+')':null,col,lw);
    const d=R*0.7; strokePts(ctx,[[c[0]-d,c[1]-d],[c[0]+d,c[1]+d]],col,lw); strokePts(ctx,[[c[0]-d,c[1]+d],[c[0]+d,c[1]-d]],col,lw);
    if(t!=='bulb'&&w>=0.45&&!o.icon){ const p=F.P(0.5*L,-R-9*w); tagText(ctx,p[0],p[1],t==='rbulb'?'real':'×1000',COL.dim,Math.round(Math.max(8,10*w))+'px -apple-system, sans-serif'); }
    return; }
  if(t==='switch'){ const s1=L/3, s2=2*L/3; line(0,s1); line(s2,L);
    const p1=F.P(s1,0), p2=F.P(s2,0), a=e.closed?0:PI/6;
    const end=[p1[0]+(s2-s1)*(Math.cos(a)*F.ux+Math.sin(a)*F.nx),p1[1]+(s2-s1)*(Math.cos(a)*F.uy+Math.sin(a)*F.ny)];
    strokePts(ctx,[p1,end],col,lw); fillPts(ctx,circlePts(p1,3.5*w+1),col); fillPts(ctx,circlePts(p2,3.5*w+1),col); return; }
  if(t==='fuse'){ line(0,0.25*L); line(0.75*L,L); fillPts(ctx,rectF(F,0.25*L,0.75*L,-8*w,8*w),null,col,lw);
    if(e.tripped){ line(0.25*L,0.42*L); line(0.58*L,0.75*L); fillPts(ctx,circlePts(F.P(0.5*L,0),3.5*w+1),COL.ref); } else line(0.25*L,0.75*L); return; }
  if(t==='ammeter'){ const c=F.P(0.5*L,0), R=20*w; line(0,0.5*L-R); line(0.5*L+R,L); fillPts(ctx,circlePts(c,R),null,col,lw);
    if(!o.icon) textAt(ctx,c[0],c[1],'A',col,'italic '+Math.round(Math.max(9,15*w))+'px Georgia, serif');
    if(!o.icon){ const p=F.P(0.5*L,-R-12*w); tagText(ctx,p[0],p[1],o.reading,COL.ink,'600 '+Math.round(Math.max(9,12*w))+'px -apple-system, sans-serif'); } return; }
  if(t==='coin'||t==='clip'){ line(0,L); fillPts(ctx,circlePts(F.P(0.5*L,0),4*w+1.5),col); return; }
  /* resistors and the household resistances: the IEEE zigzag */
  line(0,0.2*L); line(0.8*L,L);
  const z=[F.P(0.2*L,0)]; for(let k=1;k<12;k+=2) z.push(F.P((0.2+0.6*k/12)*L,(k%4===1?9:-9)*w)); z.push(F.P(0.8*L,0));

  if(t==='xresistor'&&w>=0.45&&!o.icon){ const p=F.P(0.5*L,-17*w); tagText(ctx,p[0],p[1],'×1000',COL.dim,Math.round(Math.max(8,10*w))+'px -apple-system, sans-serif'); }
}
function drawPart(ctx,e,A,B,w,look,o){ if(look==='schematic') drawPartSchem(ctx,e,A,B,w,o); else drawPartLife(ctx,e,A,B,w,o); }
/* the bulb's glass pokes out on its + s side: the hit region includes it */

/* ---------------- fire ---------------- */
function drawFire(ctx,c,w){
  const h=Math.max(16,46*w), b=Math.max(8,20*w), pts=[], pts2=[];
  for(let k=0;k<=16;k++){ const u=k/16, x=c[0]+(u-0.5)*2*b, wig=Math.sin(u*PI*3)*0.18*h;
    pts.push([x,c[1]-h*Math.sin(u*PI)*(0.7+0.3*Math.cos(u*TAU*2))-Math.abs(wig)]); }
  pts.push([c[0]+b,c[1]]); pts.push([c[0]-b,c[1]]);
  for(let k=0;k<=12;k++){ const u=k/12; pts2.push([c[0]+(u-0.5)*b,c[1]-0.55*h*Math.sin(u*PI)]); }
  fillPts(ctx,pts,'rgba(232,132,58,0.92)'); fillPts(ctx,pts2,'rgba(242,193,78,0.95)');
}

/* ---------------- the meters ---------------- */
function vmGeo(G,st){ const m=G.map, w=G.sc, v=st.vm;
  const bw=Math.max(92,118*w), bh=Math.max(52,62*w), bx=m.X(v.bx), by=m.Y(v.by);
  const probe=(x,y)=>{ const T=[m.X(x),m.Y(y)], hh=Math.max(34,46*w); return {T,H:[T[0],T[1]-hh],box:{x:T[0]-Math.max(8,9*w),y:T[1]-hh,w:2*Math.max(8,9*w),h:hh}}; };
  return {body:{x:bx-bw/2,y:by-bh/2,w:bw,h:bh},c:[bx,by],red:probe(v.rx,v.ry),black:probe(v.kx,v.ky)}; }
function amGeo(G,st){ const m=G.map, w=G.sc, a=st.am;
  const bw=Math.max(92,112*w), bh=Math.max(48,56*w), bx=m.X(a.bx), by=m.Y(a.by), r=RING_HALF*w, P=[m.X(a.px),m.Y(a.py)];
  const hh=Math.max(26,40*w);
  return {body:{x:bx-bw/2,y:by-bh/2,w:bw,h:bh},c:[bx,by],ring:{c:P,r:Math.max(6,r)},handle:[P[0],P[1]-Math.max(6,r)-hh],
          box:{x:P[0]-Math.max(10,r+4),y:P[1]-Math.max(6,r)-hh,w:2*Math.max(10,r+4),h:hh+2*Math.max(6,r)}}; }
function cable(ctx,p,q,col){ const pts=[]; for(let k=0;k<=14;k++){ const u=k/14, sag=Math.sin(u*PI)*Math.min(60,0.25*Math.hypot(q[0]-p[0],q[1]-p[1]));
  pts.push([lerp(p[0],q[0],u),lerp(p[1],q[1],u)+sag]); } strokePts(ctx,pts,col,1.6); }
function drawVoltmeter(ctx,G,st,M){
  const g=vmGeo(G,st), b=g.body;
  cable(ctx,[b.x+b.w*0.3,b.y+b.h],g.red.H,'#9b3a37'); cable(ctx,[b.x+b.w*0.7,b.y+b.h],g.black.H,'#4a4f5c');
  fillPts(ctx,[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]],'#10131b','#aeb6c6',1.4);
  textAt(ctx,b.x+b.w/2,b.y+11,'voltmeter',COL.dim,'italic 10.5px Georgia, serif');
  textAt(ctx,b.x+b.w/2,b.y+b.h*0.62,voltageText(M.vm&&M.vm.V),M.vm&&M.vm.V!==null?COL.pos:COL.dim,'600 '+Math.round(Math.max(12,Math.min(17,15*G.sc)))+'px -apple-system, sans-serif');

    const T=p.T, hw=p.box.w/2;
    fillPts(ctx,[T,[T[0]-hw*0.55,T[1]-hw*1.3],[T[0]-hw,T[1]-hw*1.6],[T[0]-hw,p.H[1]],[T[0]+hw,p.H[1]],[T[0]+hw,T[1]-hw*1.6],[T[0]+hw*0.55,T[1]-hw*1.3]],fill,'#e9ecf2',1.1);

function drawAmmeterProbe(ctx,G,st,M){

/* ---------------- the toolbox ---------------- */
function drawToolbox(ctx,G,st){
  const tb=G.tb, C=st.circ;
  fillPts(ctx,[[tb.x,tb.y],[tb.x+tb.w,tb.y],[tb.x+tb.w,tb.y+tb.h],[tb.x,tb.y+tb.h]],'rgba(16,19,27,0.94)','#2a2f3d',1);
  textAt(ctx,tb.x+10,tb.y+12,'toolbox',COL.dim,'italic 12px Georgia, serif','left');
  for(const it of tb.items){
    const k=it.key, meter=k==='voltmeter'||k==='probe';
    const left=meter?((k==='voltmeter'?st.vm.on:st.am.on)?0:1):remaining(C,k);
    const labels=st.showLabels&&it.h>=40, iconY=it.y+(labels?(TOOL_LABEL[k].length>1?it.h*0.3:it.h*0.38):it.h*0.5);
    if(left<=0) fillPts(ctx,[[it.x+1,it.y+1],[it.x+it.w-1,it.y+1],[it.x+it.w-1,it.y+it.h-1],[it.x+1,it.y+it.h-1]],'rgba(7,11,24,0.55)');
    if(meter) drawMeterIcon(ctx,k,[it.x+it.w/2,iconY],it.w,left>0);
    else { const L=TYPES[k].L||100, look=st.look, glassy=isBulb(k)&&look!=='schematic';
      /* a bulb stands 85 units tall with its glass: shrink it to its cell */
      const w=glassy?Math.min((it.w-16)/L,(labels?(TOOL_LABEL[k].length>1?it.h-24:it.h-14):it.h-6)/88):(it.w-16)/L, span=w*L;
      const A=[it.x+(it.w-span)/2,iconY], B=[it.x+(it.w+span)/2,iconY];
      const yo=glassy?-(labels?20:32)*w:0;          /* keep the glass inside the cell */
      drawPart(ctx,{type:k,R:TYPES[k].R,E:TYPES[k].E,rating:TYPES[k].rating,closed:false,tripped:false,a:0,b:1,id:-1},[A[0],A[1]-yo],[B[0],B[1]-yo],w,look,{bright:0,reading:'—',icon:true}); }
    if(labels){ const ls=TOOL_LABEL[k]; ls.forEach((s,j)=>textAt(ctx,it.x+it.w/2,it.y+it.h-6-(ls.length-1-j)*10.5,s,left>0?'#9aa2b4':'#5a6172','9.5px -apple-system, sans-serif','center','bottom')); }
    if(!meter&&TYPES[k].max>1&&it.h>=34) textAt(ctx,it.x+it.w-3,it.y+8,'×'+left,left>0?'#6f7789':'#4a5162','8.5px -apple-system, sans-serif','right');
  }
}
function drawMeterIcon(ctx,k,c,w,on){
  const col=on?'#aeb6c6':'#4a5162';
  fillPts(ctx,[[c[0]-w*0.3,c[1]-9],[c[0]+w*0.3,c[1]-9],[c[0]+w*0.3,c[1]+5],[c[0]-w*0.3,c[1]+5]],'#10131b',col,1);
  if(k==='voltmeter'){ fillPts(ctx,circlePts([c[0]-w*0.18,c[1]+11],2.5),COL.probeRed); fillPts(ctx,circlePts([c[0]+w*0.18,c[1]+11],2.5),'#e9ecf2'); }
  else { const r=circlePts([c[0]+w*0.2,c[1]+11],4); strokePts(ctx,r.concat([r[0]]),COL.live,1.4); }

/* ---------------- the whole lab ---------------- */
function drawLab(ctx,W,H,M){
  const st=M.st, C=st.circ, SOL=M.sol, G=labGeo(W,H,st), m=G.map, w=G.sc, look=st.look;
  const P=v=>[m.X(v.x),m.Y(v.y)];
  const vmap=new Map(); for(const v of C.verts) vmap.set(v.id,P(v));
  /* the selection glows under its part */
  const selOutline=()=>{ if(!(M.sel&&vmap.has(M.sel.a))) return;
    const A=vmap.get(M.sel.a), B=vmap.get(M.sel.b), F=frameOf(A,B), hw=(HALF[M.sel.type]||12)*w+Math.max(4,6*w), pad=Math.max(4,6*w);
    const cap=capsule(F,-pad,F.L+pad,hw); strokePts(ctx,cap.concat([cap[0]]),COL.live,2);
    const gl=glassCentre(M.sel,A,B,w,look); if(gl){ const ring=circlePts(gl.c,gl.r+Math.max(4,6*w)); strokePts(ctx,ring.concat([ring[0]]),COL.live,2); } };
  /* wires under the parts, as PhET layers them */
  for(const pass of [0,1]) for(const e of C.els){
    if((pass===0)!==(e.type==='wire')) continue;
    drawPart(ctx,e,vmap.get(e.a),vmap.get(e.b),w,look,{bright:SOL.bright.get(e.id)||0,reading:e.type==='ammeter'?currentText((r=>r===null?null:Math.abs(r))(seriesReading(C,SOL,e)),true):''});
  }
  /* the joints: solder where parts meet, an open ring at a loose end */
  for(const v of C.verts){ const p=vmap.get(v.id), n=elsAt(C,v.id).length, r=Math.max(3,7*w);
    if(n>=2) fillPts(ctx,circlePts(p,r),'#9aa0aa','#3a3f4b',1);
    else { const ring=circlePts(p,r+1); strokePts(ctx,ring.concat([ring[0]]),'#8b93a6',1.4); } }
  /* the current: electrons or conventional charges riding each part */
  if(st.showCurrent){
    const rad=Math.max(2.2,4.6*w);
    for(const e of C.els){ const I=SOL.I.get(e.id); if(!(Math.abs(I)>1e-10)||e.type==='ammeter') continue;   /* a meter's box hides them */
      const A=vmap.get(e.a), B=vmap.get(e.b), F=frameOf(A,B), Lw=elLength(C,e);
      for(const s of chargePositions(Lw,st.phase[e.id]||0,st.carrier)){ const q=F.P(s*w,0);
        if(st.carrier==='electrons') fillPts(ctx,circlePts(q,rad,10),COL.pos,'#1f2a10',1);
        else { const d=I>0?1:-1, a=[q[0]+d*F.ux*rad*1.6,q[1]+d*F.uy*rad*1.6], bl=[q[0]-d*F.ux*rad+F.nx*rad,q[1]-d*F.uy*rad+F.ny*rad], br=[q[0]-d*F.ux*rad-F.nx*rad,q[1]-d*F.uy*rad-F.ny*rad];
          fillPts(ctx,[a,bl,br],COL.pos,'#1f2a10',1); } } }
  }
  selOutline();
  /* fire, over everything it belongs to */
  for(const eid of SOL.fire){ const e=elById(C,eid); if(!e) continue; const A=vmap.get(e.a), B=vmap.get(e.b);
    drawFire(ctx,[(A[0]+B[0])/2,(A[1]+B[1])/2-Math.max(6,12*w)],w); }
  /* values, beside each part, on the side away from a bulb's glass */
  if(st.showValues) for(const e of C.els){ const txt=valueText(e,SOL); if(!txt) continue;
    const A=vmap.get(e.a), B=vmap.get(e.b), F=frameOf(A,B), off=((HALF[e.type]||10)+12)*w+7;
    /* above a part that lies across the screen, right of one that stands up,
       and always away from a bulb's glass */
    const qa=F.P(F.L/2,off), qb=F.P(F.L/2,-off), vert=Math.abs(F.nx)>Math.abs(F.ny);
    let q=vert?(qa[0]>qb[0]?qa:qb):(qa[1]<qb[1]?qa:qb);
    if(isBulb(e.type)&&look!=='schematic') q=qb;
    lab(ctx,W,H,q[0],q[1],txt,'#cfd4de','11px -apple-system, sans-serif',vert?(q[0]>(A[0]+B[0])/2?'left':'right'):'center','middle'); }
  /* the selected joint: a ring, and PhET's scissors as a "split" button */
  if(st.selV!==null&&vmap.has(st.selV)){ const p=vmap.get(st.selV), ring=circlePts(p,Math.max(9,13*w)); strokePts(ctx,ring.concat([ring[0]]),COL.live,2);
    const sb=splitButton(G,st); if(sb){ fillPts(ctx,[[sb.x,sb.y],[sb.x+sb.w,sb.y],[sb.x+sb.w,sb.y+sb.h],[sb.x,sb.y+sb.h]],'#2a1830',COL.live,1.2);

/* PhET's words, with a percentage that says something below 1 % */
function speedNote(scale){ const p=100*scale; return 'Animation speed limit reached! Current animation speed reduced to '+(p>=1?fmt(p,0):sigf(p,2))+'% normal.'; }
function splitButton(G,st){
  if(st.selV===null) return null;
  const v=vById(st.circ,st.selV); if(!v||elsAt(st.circ,v.id).length<2) return null;
  const x=G.map.X(v.x), y=G.map.Y(v.y);
  return {x:x-21,y:y-Math.max(22,20*G.sc)-22,w:42,h:20};
}

/* ---------------- hit tests (screen pixels) ---------------- */
function hitToolbox(G,x,y){ for(const it of G.tb.items) if(inRect(x,y,it)) return it; return null; }
function overToolbox(G,x,y){ return inRect(x,y,G.tb); }
function hitVertex(G,st,x,y){ let best=null; const r=Math.max(10,12*G.sc);
  for(const v of st.circ.verts){ const d=Math.hypot(G.map.X(v.x)-x,G.map.Y(v.y)-y); if(d<=r&&(!best||d<best.d)) best={d,id:v.id}; }
  return best?best.id:null; }
function hitElement(G,st,x,y){
  const C=st.circ, m=G.map, w=G.sc; let best=null;
  /* fixed parts sit on top of wires, so they win a tie */
  for(const e of C.els){ const A=vById(C,e.a), B=vById(C,e.b), Ap=[m.X(A.x),m.Y(A.y)], Bp=[m.X(B.x),m.Y(B.y)];
    const s=segDist(x,y,Ap[0],Ap[1],Bp[0],Bp[1]), hw=Math.max(6,(HALF[e.type]||10)*w);
    let d=s.d<=hw?s.d:Infinity;
    const gl=glassCentre(e,Ap,Bp,w,st.look); if(gl){ const dg=Math.hypot(x-gl.c[0],y-gl.c[1]); if(dg<=gl.r) d=Math.min(d,0.5); }
    if(d<Infinity){ const score=d+(e.type==='wire'?1000:0); if(!best||score<best.score) best={score,id:e.id}; } }
  return best?best.id:null;
}
function hitMeter(G,st,x,y){
  if(st.vm.on){ const g=vmGeo(G,st);
    if(inRect(x,y,g.red.box)||Math.hypot(x-g.red.T[0],y-g.red.T[1])<=8) return 'vm-red';
    if(inRect(x,y,g.black.box)||Math.hypot(x-g.black.T[0],y-g.black.T[1])<=8) return 'vm-black';
    if(inRect(x,y,g.body)) return 'vm-body'; }
  if(st.am.on){ const g=amGeo(G,st);
    if(inRect(x,y,g.box)) return 'am-probe';
    if(inRect(x,y,g.body)) return 'am-body'; }
  return null;
}

/* ---------------- dragging a joint ---------------- */
/* a joint of wires alone follows the pointer; one rigid part swings about
   its other end (its length is fixed); two or more rigid parts meeting here
   move together as one body */
function dragVertex(C,vid,x,y){
  const v=vById(C,vid); if(!v) return;
  const fixed=elsAt(C,vid).filter(e=>e.type!=='wire');
  if(!fixed.length){ v.x=x; v.y=y; return; }
  if(fixed.length===1){ const e=fixed[0], o=vById(C,otherEnd(e,vid)), L=TYPES[e.type].L, d=Math.hypot(x-o.x,y-o.y);
    if(d<1e-9) return; v.x=o.x+(x-o.x)*L/d; v.y=o.y+(y-o.y)*L/d; return; }
  translateVerts(C,fixedGroup(C,vid),x-v.x,y-v.y);
}
function moveSetOf(C,e){ const s=fixedGroup(C,e.a); if(e.type==='wire') for(const x of fixedGroup(C,e.b)) s.add(x); return s; }

/* the lab's pointer: returns true when something changed.  Pointer-down on
   the toolbox makes the part and starts dragging it; a release over the
   toolbox puts it back; a release anywhere else, after ANY movement, joins
   the nearest legal pair of ends within the drop radius (PhET's
   endDrag(vertex, dragged)); and a release within PhET's 15-px tap
   threshold of the press ALSO selects (and toggles a switch) -- PhET does
   both, so a short nudge onto a neighbouring end joins it. */
function labPointer(S,kind,x,y){
  const st=S.st, C=st.circ, G=labGeo(S.W,S.H,st), m=G.map;
  if(kind==='down'){
    DRAG.what=null; DRAG.sx=x; DRAG.sy=y; DRAG.moved=false; DRAG.dragged=false; DRAG.fromBox=false;
    const sb=splitButton(G,st);
    if(sb&&inRect(x,y,sb)){ splitVertex(C,st.selV); st.selV=null; circuitEdited(st); return true; }
    const mh=hitMeter(G,st,x,y);
    if(mh){ DRAG.what=mh; DRAG.last=[m.wx(x),m.wy(y)]; return true; }
    const it=hitToolbox(G,x,y);
    if(it){ const wx=m.wx(x), wy=m.wy(y);
      if(it.key==='voltmeter'){ if(st.vm.on) return false; st.vm={on:true,bx:wx,by:wy,rx:wx-35,ry:wy+85,kx:wx+35,ky:wy+85}; DRAG.what='vm-body'; DRAG.fromBox=true; DRAG.last=[wx,wy]; return true; }
      if(it.key==='probe'){ if(st.am.on) return false; st.am={on:true,bx:wx,by:wy,px:wx,py:wy+95}; DRAG.what='am-body'; DRAG.fromBox=true; DRAG.last=[wx,wy]; return true; }
      const el=addElement(C,it.key,wx,wy); if(!el) return false;
      DRAG.what='el'; DRAG.eid=el.id; DRAG.group=moveSetOf(C,el); DRAG.last=[wx,wy]; DRAG.fromBox=true;
      st.sel=el.id; st.selV=null; circuitEdited(st); return true; }
    const vid=hitVertex(G,st,x,y);
    if(vid!==null){ DRAG.what='vert'; DRAG.vid=vid; DRAG.last=[m.wx(x),m.wy(y)]; return true; }
    const eid=hitElement(G,st,x,y);
    if(eid!==null){ const e=elById(C,eid); DRAG.what='el'; DRAG.eid=eid; DRAG.group=moveSetOf(C,e); DRAG.last=[m.wx(x),m.wy(y)]; return true; }
    DRAG.what='none'; return false;
  }
  if(kind==='move'){
    if(!DRAG.what||DRAG.what==='none') return false;
    if(Math.hypot(x-DRAG.sx,y-DRAG.sy)>=TAP_PX) DRAG.moved=true;
    if(x!==DRAG.sx||y!==DRAG.sy) DRAG.dragged=true;
    const wx=m.wx(x), wy=m.wy(y), dx=wx-DRAG.last[0], dy=wy-DRAG.last[1];
    const d=DRAG.what;
    if(d==='el'){ translateVerts(C,DRAG.group,dx,dy); circuitEdited(st); }
    else if(d==='vert'){ dragVertex(C,DRAG.vid,wx,wy); circuitEdited(st); }
    else if(d==='vm-body'){ st.vm.bx+=dx; st.vm.by+=dy; if(DRAG.fromBox){ st.vm.rx+=dx; st.vm.ry+=dy; st.vm.kx+=dx; st.vm.ky+=dy; } }
    else if(d==='vm-red'){ st.vm.rx+=dx; st.vm.ry+=dy; }
    else if(d==='vm-black'){ st.vm.kx+=dx; st.vm.ky+=dy; }
    else if(d==='am-body'){ st.am.bx+=dx; st.am.by+=dy; if(DRAG.fromBox){ st.am.px+=dx; st.am.py+=dy; } }
    else if(d==='am-probe'){ st.am.px+=dx; st.am.py+=dy; }
    DRAG.last=[wx,wy];
    return true;
  }
  /* up */
  const d=DRAG.what; DRAG.what=null;
  if(!d) return false;
  if(d==='none'){ if(!DRAG.moved&&(st.sel!==null||st.selV!==null)){ st.sel=null; st.selV=null; return true; } return false; }
  if(d==='el'){ const e=elById(C,DRAG.eid); if(!e) return true;
    const A=vById(C,e.a), B=vById(C,e.b), mx=m.X((A.x+B.x)/2), my=m.Y((A.y+B.y)/2);
    if(overToolbox(G,mx,my)){ deleteElement(C,e.id); if(st.sel===e.id) st.sel=null; circuitEdited(st); return true; }
    if(DRAG.dragged){ const t=dropTarget(C,[...DRAG.group]); if(t){ connect(C,t.src,t.dst); circuitEdited(st); } }
    if(!DRAG.moved&&!DRAG.fromBox){ st.sel=e.id; st.selV=null; st.thevEl=null; if(e.type==='switch'){ e.closed=!e.closed; circuitEdited(st); } }
    return true; }
  if(d==='vert'){ let vid=DRAG.vid;
    if(DRAG.dragged){ const t=dropTarget(C,[vid]); if(t){ connect(C,t.src,t.dst); circuitEdited(st); vid=t.dst; } }
    if(!DRAG.moved){ st.selV=vid; st.sel=null; }
    return true; }
  if(d==='vm-body'||d==='am-body'){ const g=d==='vm-body'?vmGeo(G,st):amGeo(G,st), cx=g.c[0], cy=g.c[1];
    if(overToolbox(G,cx,cy)){ if(d==='vm-body') st.vm.on=false; else st.am.on=false; } return true; }
  return true;
}

 *  the analysis views: nodes and branches, the power budget, the      *

/* the stage left of the floating readout on a wide canvas, full width on a

   ending HINT_H above the canvas edge (the #hint owns the last line) */
function viewFrame(ctx,W,H,capFull,capShort){
  const narrow=W<900, left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-40)-left));
  const top=stageTop()+30;

}
function sayWhy(ctx,W,H,txt){ caption(ctx,70,stageTop()+60,txt,Math.min(520,W-140),'#8b93a6','12.5px -apple-system, sans-serif'); }
/* the parts worth a row in a chart: everything but the wires */
function chartParts(SOL,C){ return C.els.filter(e=>e.type!=='wire'&&SOL.onK.has(e.id)); }
const LETTER={battery:'B',xbattery:'B',resistor:'R',xresistor:'R',bulb:'L',xbulb:'L',rbulb:'L',switch:'S',fuse:'F',ammeter:'A',
