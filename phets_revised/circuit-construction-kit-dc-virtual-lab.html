/* ---------------- nodes and branches ---------------- */
const GRAPH_CAP_FULL='Every joint is a node and every part a branch, wires included, as in PhET’s solver. Cyan: a spanning tree; dashed: the chords, each of which closes one fundamental loop (B − N + C of them). Green arrows: the conventional current. The matrix is the system solved: the current law at every node but one per piece (top block) and each branch’s own law v(a) − v(b) − R i = −E (bottom block); cyan +1, orange −1, green −R. Below, both of Kirchhoff’s laws measured on the answer against the piece’s own scale, with the double-precision epsilon for comparison.';
const GRAPH_CAP_SHORT='The circuit as a graph (tree cyan, chords dashed), and Kirchhoff’s laws measured on the answer.';
/* the narrow stage has no room for the matrix, so its caption must not describe one */
const GRAPH_CAP_NARROW='Every joint is a node and every part a branch, wires included, as in PhET’s solver. Cyan: a spanning tree; dashed: the chords, each of which closes one fundamental loop (B − N + C of them). Green arrows: the conventional current. Below, both of Kirchhoff’s laws measured on the answer against the piece’s own scale, with the double-precision epsilon for comparison; a wider window shows the matrix itself.';
function drawGraph(ctx,W,H,M){
  const SOL=M.sol, C=M.st.circ;
  if(!C.els.length){ sayWhy(ctx,W,H,'There is nothing on the bench, so there is no graph to draw and no matrix to solve. Build a circuit in the lab, or pick one of the circuits in the panel.'); return; }
  const V=viewFrame(ctx,W,H,W<900?GRAPH_CAP_NARROW:GRAPH_CAP_FULL,GRAPH_CAP_SHORT);
  const stripH=Math.max(70,Math.min(120,(V.capY-V.top)*0.28));
  const topH=V.capY-24-stripH-46-V.top;
  const gW=V.narrow?V.right-V.left:Math.round((V.right-V.left)*0.56);
  const GB=box(V.left,V.top,gW,Math.max(90,topH));
  const MB=V.narrow?null:box(GB.x1+44,V.top,V.right-GB.x1-44,Math.max(90,topH));
  const RB=box(V.left,GB.y1+46,V.full-V.left,stripH);
  /* the graph: equal aspect, fitted to its box */
  let xmin=1e9,xmax=-1e9,ymin=1e9,ymax=-1e9;
  for(const v of C.verts){ xmin=Math.min(xmin,v.x); xmax=Math.max(xmax,v.x); ymin=Math.min(ymin,v.y); ymax=Math.max(ymax,v.y); }
  const pad=30, s=Math.min(GB.w/Math.max(1,xmax-xmin+2*pad),GB.h/Math.max(1,ymax-ymin+2*pad));
  const ox=GB.x+(GB.w-s*(xmax-xmin))/2-xmin*s, oy=GB.y+(GB.h-s*(ymax-ymin))/2-ymin*s;
  const P=v=>[ox+s*v.x,oy+s*v.y];
  frame(ctx,GB,'#242a3a');
  textAt(ctx,GB.x,GB.y-9,titleFor(GB,'the circuit as a graph: '+SOL.nodes+' nodes, '+SOL.branches+' branches, '+SOL.loops+' loops','the graph'),'#aeb6c6','italic 13px Georgia, serif','left','bottom');
  LABELS.push([GB.x,GB.y-24,GB.x+Math.min(GB.w,420),GB.y-9]);
  const br=SOL.net.br, tree=SOL.basis.tree, idx=SOL.net.idx;
  const vAt=new Map(); C.verts.forEach(v=>vAt.set(v.id,P(v)));
  br.forEach((e,k)=>{ const A=vAt.get(e.el.a), B=vAt.get(e.el.b);
    strokePts(ctx,[A,B],tree[k]?COL.struct:mix(COL.struct,'#070b18',0.25),tree[k]?2:1.6,tree[k]?null:[6,4]);
    POLY_SEGS.push(A[0],A[1],B[0],B[1]); });
  for(const el of SOL.net.off){ const A=vAt.get(el.a), B=vAt.get(el.b); strokePts(ctx,[A,B],'#3a4152',1.2,[2,4]); }
  /* current arrows and part letters at each branch's middle */
  const Imax=Math.max(SOL.Imax,1e-300);
  br.forEach((e,k)=>{ const A=vAt.get(e.el.a), B=vAt.get(e.el.b), I=SOL.sol.i[k];
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, L=Math.hypot(B[0]-A[0],B[1]-A[1])||1, ux=(B[0]-A[0])/L, uy=(B[1]-A[1])/L;
    if(Math.abs(I)>1e-9*Imax&&L>14){ const d=I>0?1:-1, h=Math.min(9,L*0.3);
      fillPts(ctx,[[mx+d*ux*h,my+d*uy*h],[mx-d*ux*h*0.6+uy*h*0.6,my-d*uy*h*0.6-ux*h*0.6],[mx-d*ux*h*0.6-uy*h*0.6,my-d*uy*h*0.6+ux*h*0.6]],COL.pos); }
    const lt=LETTER[e.el.type]; if(lt) lab(ctx,W,H,mx+uy*14,my-ux*14,lt,'#aeb6c6','italic 11px Georgia, serif','center','middle'); });
  /* nodes, shaded by potential within their piece */
  const vmin=Math.min(...C.verts.map(v=>SOL.V.get(v.id))), vmax=Math.max(...C.verts.map(v=>SOL.V.get(v.id)));
  C.verts.forEach((v,q)=>{ const p=vAt.get(v.id), t=vmax>vmin?(SOL.V.get(v.id)-vmin)/(vmax-vmin):0;
    const isRef=[...SOL.sol.ref.values()].indexOf(idx.get(v.id))>=0;
    fillPts(ctx,circlePts(p,isRef?6:4.5),mix('#2a3346','#e9ecf2',t),isRef?COL.ref:'#070b18',1.2); });
  /* a few node voltages, where they fit */
  const shown=[...C.verts].sort((a,b)=>Math.abs(SOL.V.get(b.id))-Math.abs(SOL.V.get(a.id)));
  let nl=0; for(const v of shown){ if(nl>=10) break; const p=vAt.get(v.id);
    if(lab(ctx,W,H,p[0]+8,p[1]-11,'n'+idx.get(v.id)+' '+fmtV(SOL.V.get(v.id)),'#8b93a6','10px -apple-system, sans-serif','left','middle')) nl++; }
  /* the matrix */
  if(MB) drawMatrix(ctx,W,H,MB,SOL);
  /* Kirchhoff on the answer */
  drawResiduals(ctx,W,H,RB,SOL);
  caption(ctx,V.left,V.capY,V.capTxt,V.capW,'#767e92',CAP_FONT);
}
function drawMatrix(ctx,W,H,MB,SOL){
  const br=SOL.net.br, S=mnaSystem(SOL.net.N,br), n=S.n, nv=S.nv;
  textAt(ctx,MB.x,MB.y-9,titleFor(MB,'the matrix, '+n+' × '+n+' = (N − C) + B','the matrix'),'#aeb6c6','italic 13px Georgia, serif','left','bottom');
  LABELS.push([MB.x,MB.y-24,MB.x+Math.min(MB.w,300),MB.y-9]);
  if(!n){ caption(ctx,MB.x,MB.y+8,'No unknowns: nothing is connected.',MB.w,'#8b93a6'); return; }
  const side=Math.min(MB.w-30,MB.h-18), cs=side/(n+1.6), x0=MB.x+14, y0=MB.y+4;
  /* the unscaled matrix: current law rows, then v_a - v_b - R i = -E rows */
  const cell=(r,c,col)=>fillPts(ctx,[[x0+c*cs,y0+r*cs],[x0+(c+1)*cs-0.6,y0+r*cs],[x0+(c+1)*cs-0.6,y0+(r+1)*cs-0.6],[x0+c*cs,y0+(r+1)*cs-0.6]],col);
  fillPts(ctx,[[x0,y0],[x0+n*cs,y0],[x0+n*cs,y0+n*cs],[x0,y0+n*cs]],'#0b0f1c','#242a3a',1);
  br.forEach((e,k)=>{ const c=nv+k;
    if(S.vi[e.a]>=0) cell(S.vi[e.a],c,COL.struct);
    if(S.vi[e.b]>=0) cell(S.vi[e.b],c,COL.ref);
    const r=nv+k;
    if(S.vi[e.a]>=0) cell(r,S.vi[e.a],COL.struct);
    if(S.vi[e.b]>=0) cell(r,S.vi[e.b],COL.ref);
    const g=clamp((Math.log10(e.R)+12)/18,0.15,1); cell(r,c,mix('#1c2410',COL.pos,g)); });
  /* the right-hand side: -E on the battery rows */
  const xr=x0+(n+0.6)*cs;
  fillPts(ctx,[[xr,y0],[xr+cs,y0],[xr+cs,y0+n*cs],[xr,y0+n*cs]],'#0b0f1c','#242a3a',1);
  br.forEach((e,k)=>{ if(e.E!==0){ const r=nv+k; fillPts(ctx,[[xr,y0+r*cs],[xr+cs-0.6,y0+r*cs],[xr+cs-0.6,y0+(r+1)*cs-0.6],[xr,y0+(r+1)*cs-0.6]],e.E>0?COL.ref:COL.struct); } });
  /* the block borders */
  strokePts(ctx,[[x0+nv*cs,y0],[x0+nv*cs,y0+n*cs]],'#8b93a6',1); strokePts(ctx,[[x0,y0+nv*cs],[x0+n*cs,y0+nv*cs]],'#8b93a6',1);
  if(cs*nv>=18&&cs*(n-nv)>=18){
    const fs='italic '+Math.round(clamp(cs*1.2,10,14))+'px Georgia, serif';
    textAt(ctx,x0+nv*cs/2,y0+nv*cs/2,'0','#6f7789',fs);
    lab(ctx,W,H,x0+(nv+(n-nv)/2)*cs,y0-2,'A (current law)','#8b93a6','10px -apple-system, sans-serif','center','bottom');
    lab(ctx,W,H,x0-3,y0+(nv+(n-nv)/2)*cs,'Aᵀ','#8b93a6','italic 11px Georgia, serif','right','middle'); }
  lab(ctx,W,H,xr+cs/2,y0+n*cs+10,'rhs','#8b93a6','10px -apple-system, sans-serif','center','middle');
}
function drawResiduals(ctx,W,H,RB,SOL){
  const L=SOL.law, pts=[];
  const idx=SOL.net.idx, comp=SOL.sol.comp;
  for(let q=0;q<SOL.net.N;q++){ const m=L.Isc.get(comp[q])||0; pts.push({kind:'node',r:m>0?Math.abs(L.node[q])/m:0}); }
  for(const p of L.per) pts.push({kind:'loop',r:p.scale>0?Math.abs(p.sum)/p.scale:0});
  const lo=-19, hi=-12, eps=Math.log10(Number.EPSILON);
  axesR(ctx,RB,0,Math.max(1,pts.length),lo,hi,{title:titleFor(RB,'Kirchhoff on the answer: '+SOL.nodes+' nodes (current law) and '+SOL.loops+' loops (voltage law), residual ÷ the piece’s scale','Kirchhoff on the answer'),
    xticks:[],yticks:[-18,-16,-14,-12],yfmt:v=>pow10(v)});
  polyline(ctx,RB,[0,Math.max(1,pts.length)],[eps,eps],0,Math.max(1,pts.length),lo,hi,COL.ref,1.1,[5,4]);
  lab(ctx,W,H,RB.x1-4,RB.y1-RB.h*(eps-lo)/(hi-lo)-8,'ε = 2.2×10⁻¹⁶','#e8a25a','10px -apple-system, sans-serif','right','bottom');
  const n=pts.length, bw=Math.max(2,Math.min(14,RB.w/Math.max(1,n)*0.6));
  pts.forEach((p,j)=>{ const x=RB.x+RB.w*(j+0.5)/Math.max(1,n), lg=p.r>0?clamp(Math.log10(p.r),lo,hi):lo;
    const y=RB.y1-RB.h*(lg-lo)/(hi-lo), col=p.kind==='node'?COL.pos:COL.struct;
    if(p.r>0) fillPts(ctx,[[x-bw/2,y],[x+bw/2,y],[x+bw/2,RB.y1],[x-bw/2,RB.y1]],col);
    else fillPts(ctx,circlePts([x,RB.y1-3],2.2,8),col); });
  if(SOL.nodes>0) lab(ctx,W,H,RB.x+6,RB.y+9,'green: nodes · cyan: loops · a dot on the floor: exactly zero','#8b93a6','10px -apple-system, sans-serif','left','middle');
}

/* ---------------- the power budget ---------------- */
const POWER_CAP_FULL='A waterfall: each battery’s EMF raises the running total by E i (green; a battery being charged would lower it), each resistance lowers it by i²R (orange) — the batteries’ own internal resistance included. It ends exactly where it began because of Tellegen’s theorem. Parts below 0.5 % of the total are pooled. Beneath: PhET’s brightness rule, with each bulb at its power; the power axis is logarithmic.';
const POWER_CAP_SHORT='Where each watt comes from (green) and goes (orange); PhET’s brightness curve below (log axis).';
function drawPower(ctx,W,H,M){
  const SOL=M.sol, C=M.st.circ, B=M.bud;
  if(!(B.gen>0)){ sayWhy(ctx,W,H,C.els.length?'No battery is delivering power: nothing flows in this circuit, so there is no power to budget. Close a loop through a battery.':'There is nothing on the bench. Build a circuit in the lab, or pick one in the panel.'); return; }
  const V=viewFrame(ctx,W,H,POWER_CAP_FULL,POWER_CAP_SHORT);
  const avail=V.capY-24-V.top, h1=Math.round(avail*0.58);
  const WB=box(V.left,V.top,V.right-V.left,Math.max(80,h1-40));
  const BB=box(V.left,WB.y1+56,(V.narrow?V.right:V.full)-V.left,Math.max(60,V.capY-24-(WB.y1+56)));
  /* the ledger: sources then sinks, small ones pooled */
  const tot=B.gen, items=[];
  /* sources that deliver come first, so the running total never dips below zero */
  B.src.slice().sort((a,b)=>b.P-a.P).forEach(x=>items.push({lab:elTag(C,x.el)+' EMF',P:x.P,src:true}));
  let pool=0, npool=0;
  B.sink.slice().sort((a,b)=>b.P-a.P).forEach(x=>{ if(x.P>=0.005*tot) items.push({lab:elTag(C,x.el)+(x.internal?' (its r)':''),P:-x.P}); else { pool+=x.P; npool++; } });
  if(npool) items.push({lab:npool+' more',P:-pool});
  let run=0, peak=0; for(const it of items){ run+=it.P; peak=Math.max(peak,run); }
  const n=items.length, ymax=Math.max(peak,tot)*1.1;
  axesR(ctx,WB,0,n,0,ymax,{title:titleFor(WB,'the running total: '+fmtP(B.gen)+' delivered, '+fmtP(B.dis)+' dissipated','the running total'),xticks:[],yfmt:v=>siFmt(v,'W',2)});
  let cum=0; const bw=Math.min(46,WB.w/n*0.62);
  items.forEach((it,j)=>{ const x=WB.x+WB.w*(j+0.5)/n, y0=cum, y1=cum+it.P; cum=y1;
    const Y=v=>WB.y1-WB.h*v/ymax, ya=Y(Math.max(y0,y1)), yb=Y(Math.min(y0,y1));
    fillPts(ctx,[[x-bw/2,ya],[x+bw/2,ya],[x+bw/2,Math.max(yb,ya+1)],[x-bw/2,Math.max(yb,ya+1)]],it.src?COL.pos:COL.ref);
    if(j<n-1){ const xn=WB.x+WB.w*(j+1.5)/n; strokePts(ctx,[[x+bw/2,Y(y1)],[xn-bw/2,Y(y1)]],'#4a5162',1,[2,3]); }
    lab(ctx,W,H,x,WB.y1+8,it.lab,'#8b93a6','10px -apple-system, sans-serif','center','top'); });
  /* the brightness curve */
  const bulbs=C.els.filter(e=>isBulb(e.type)&&SOL.onK.has(e.id));
  const lx0=-3, lx1=4;
  axesR(ctx,BB,lx0,lx1,0,1,{title:titleFor(BB,'PhET’s brightness b = ln(1 + 0.35 P) / ln(1 + 0.35·2000) against the bulb’s power (log axis)','brightness against power (log)'),
    xticks:[-3,-2,-1,0,1,2,3,4],xfmt:v=>siFmt(Math.pow(10,v),'W',1),yticks:[0.5,1],yfmt:v=>fmt(v,1)});
  const xs=[], ys=[]; for(let k=0;k<=140;k++){ const lp=lx0+(lx1-lx0)*k/140; xs.push(lp); ys.push(brightnessOf(Math.pow(10,lp))); }
  polyline(ctx,BB,xs,ys,lx0,lx1,0,1,COL.ref,1.6);
  if(!bulbs.length) lab(ctx,W,H,BB.x+10,BB.y+14,'no bulb in this circuit','#8b93a6','10.5px -apple-system, sans-serif','left','middle');
  bulbs.slice(0,8).forEach(e=>{ const Pw=SOL.P.get(e.id), bb=SOL.bright.get(e.id); if(!(Pw>0)) return;
    const lp=clamp(Math.log10(Pw),lx0,lx1), x=BB.x+BB.w*(lp-lx0)/(lx1-lx0), y=BB.y1-BB.h*bb;
    dot(ctx,x,y,4.5,COL.live,'#fff',1.2); lab(ctx,W,H,x+7,y-10,elTag(C,e),'#cfd4de','10.5px -apple-system, sans-serif','left','middle'); });
  caption(ctx,V.left,V.capY,V.capTxt,V.capW,'#767e92',CAP_FONT);
}

/* ---------------- the rest of the circuit ---------------- */
const THEV_CAP_FULL='Take the part out and look back into the two holes: whatever is there — batteries, resistors, the other bulbs — behaves exactly like one EMF Vth behind one resistance Rth. Orange: that line, v = Vth − Rth i. Green: the part’s own law (a resistor’s straight line through the origin, a battery’s line, a real bulb’s curve). Where they cross is the operating point (magenta), which is exactly what the full solve gives. On the right, the power this part would take as its resistance is swept: largest when it matches Rth.';
const THEV_CAP_SHORT='Orange: the rest of the circuit, v = Vth − Rth i; green: the part’s own law; magenta: where they cross.';
/* without the power sweep (a narrow stage, or a battery, which has no load resistance to sweep) */
const THEV_CAP_ONE='Take the part out and look back into the two holes: whatever is there — batteries, resistors, the other bulbs — behaves exactly like one EMF Vth behind one resistance Rth. Orange: that line, v = Vth − Rth i. Green: the part’s own law (a resistor’s straight line through the origin, a battery’s line, a real bulb’s curve). Where they cross is the operating point (magenta), which is exactly what the full solve gives.';
function drawThev(ctx,W,H,M){
  const T=M.thev, C=M.st.circ;
  if(!T){ sayWhy(ctx,W,H,'There is no part to look from: the bench is empty. Build a circuit, or pick one in the panel.'); return; }
  const e=elById(C,M.focus);
  if(T.open){ sayWhy(ctx,W,H,'Seen from the '+elTag(C,e)+', the rest of the circuit never comes back: take the part out and nothing joins its two ends. It is not in any loop, so no current can flow through it, whatever the batteries do.'); return; }
  const res=T.E===0, split=W>=900&&res;
  const V=viewFrame(ctx,W,H,split?THEV_CAP_FULL:THEV_CAP_ONE,THEV_CAP_SHORT);
  const IB=box(V.left,V.top,split?Math.round((V.right-V.left)*0.55):V.right-V.left,Math.max(90,V.capY-24-40-V.top));
  const PB=split?box(IB.x1+60,V.top,V.right-IB.x1-60,IB.h):null;
  const Voc=T.Voc, Rth=T.Rth, i0=T.i, u0=T.R*i0-T.E;
  /* the i range: the operating point with room, the short-circuit current if it is near */
  const Isc=(Voc+T.E)/Math.max(Rth,1e-300);
  let imax=Math.max(1.4*Math.abs(i0),Math.abs(Isc)<4*Math.abs(i0)?1.1*Math.abs(Isc):0,1e-6);
  const imin=Math.min(0,1.4*i0);
  const real=e.type==='rbulb';
  const lawU=i=>real?NaN:T.R*i-T.E;
  const us=[Voc-Rth*imin,Voc-Rth*imax,lawU(imin),lawU(imax),0,u0].filter(isFinite);
  let ulo=Math.min(...us), uhi=Math.max(...us); const du=(uhi-ulo)||1; ulo-=0.08*du; uhi+=0.12*du;
  axesR(ctx,IB,imin,imax,ulo,uhi,{title:titleFor(IB,'seen from the '+elTag(C,e)+': the voltage across it, v(a) − v(b), against its current','the '+elTag(C,e)),xlab:'current i, from a to b',ylab:'v(a) − v(b)',xfmt:v=>siFmt(v,'A',2),yfmt:v=>siFmt(v,'V',3)});
  polyline(ctx,IB,[imin,imax],[Voc-Rth*imin,Voc-Rth*imax],imin,imax,ulo,uhi,COL.ref,1.8);
  if(real){ const xs=[], ys=[]; for(let k=0;k<=160;k++){ const u=ulo+(uhi-ulo)*k/160; xs.push(u/realBulbR(u)); ys.push(u); } polyline(ctx,IB,xs,ys,imin,imax,ulo,uhi,COL.pos,1.8); }
  else polyline(ctx,IB,[imin,imax],[lawU(imin),lawU(imax)],imin,imax,ulo,uhi,COL.pos,1.8);
  marker(ctx,IB,imin,imax,ulo,uhi,i0,u0,COL.live);
  lab(ctx,W,H,IB.x+IB.w*(i0-imin)/(imax-imin)+9,IB.y1-IB.h*(u0-ulo)/(uhi-ulo)-12,'i = '+fmtI(i0)+', v = '+fmtV(u0),'#cfd4de','10.5px -apple-system, sans-serif','left','middle');
  legendAuto(ctx,IB,[[COL.ref,'the rest: Vth = '+fmtV(Voc)+', Rth = '+fmtR(Rth)],[COL.pos,real?'the real bulb’s curve':'the part: v = R i'+(T.E!==0?' − E':'')]]);
  if(PB){
    /* the sweep: two decades either side of Rth, stretched to take in this
       part's own resistance (at most eight decades) */
    const lth0=Math.log10(Math.max(Rth,1e-12)), lR0=Math.log10(Math.max(T.R,1e-12));
    let lr0=Math.min(lth0-2,lR0-1), lr1=Math.max(lth0+2,lR0+1);
    if(lr1-lr0>8){ lr0=Math.max(lr0,lth0-2); lr1=lr0+8; }
    const xs=[], ys=[];
    let pmax=0; for(let k=0;k<=200;k++){ const lr=lr0+(lr1-lr0)*k/200, R=Math.pow(10,lr), Pw=Voc*Voc*R/Math.pow(Rth+R,2); xs.push(lr); ys.push(Pw); pmax=Math.max(pmax,Pw); }
    const ymax=pmax*1.18||1;
    const dec=[]; const stp=lr1-lr0>6?2:1; for(let v=Math.ceil(lr0);v<=lr1;v+=stp) dec.push(v);
    axesR(ctx,PB,lr0,lr1,0,ymax,{title:titleFor(PB,'the power it would take, P = Vth²R/(Rth + R)²','P against R'),xlab:'its resistance R (log axis)',ylab:'P',
      xticks:dec,xfmt:v=>siFmt(Math.pow(10,v),'Ω',1),yfmt:v=>siFmt(v,'W',2)});
    polyline(ctx,PB,xs,ys,lr0,lr1,0,ymax,COL.pos,1.8);
    const lth=Math.log10(Rth);
    polyline(ctx,PB,[lth,lth],[0,ymax],lr0,lr1,0,ymax,COL.ref,1.1,[5,4]);
    lab(ctx,W,H,PB.x+PB.w*(lth-lr0)/(lr1-lr0)+5,PB.y+10,'R = Rth','#e8a25a','10.5px -apple-system, sans-serif','left','middle');
    const lR=Math.log10(T.R), Pnow=i0*i0*T.R;
    if(lR>=lr0&&lR<=lr1) marker(ctx,PB,lr0,lr1,0,ymax,lR,Pnow,COL.live);
    else lab(ctx,W,H,PB.x+8,PB.y+26,'this part’s '+fmtR(T.R)+' is off this axis','#8b93a6','10.5px -apple-system, sans-serif','left','middle');
  }
  caption(ctx,V.left,V.capY,V.capTxt,V.capW,'#767e92',CAP_FONT);
}

/* ---------------- one battery at a time ---------------- */
const SUPER_CAP_FULL='Each row is one part (wires left out). Starting from zero, each coloured step is the current that one battery would drive through that part with every other battery’s EMF set to zero and its internal resistance kept; the steps add, with their signs, to exactly the current the whole circuit carries (the white tick). A battery can push a part’s current backwards; that is how two sources fight.';
const SUPER_CAP_SHORT='Each battery’s own contribution to each part’s current, and their sum (white).';
const BAT_COL=[COL.struct,COL.ref,COL.live,'#8b93a6'];
function drawSuper(ctx,W,H,M){
  const SOL=M.sol, C=M.st.circ, Sp=M.sup;
  if(!Sp.bats.length){ sayWhy(ctx,W,H,C.els.length?'There is no battery in the circuit, so nothing drives any current: superposition has nothing to add up.':'There is nothing on the bench. Build a circuit in the lab, or pick one in the panel.'); return; }
  const V=viewFrame(ctx,W,H,SUPER_CAP_FULL,SUPER_CAP_SHORT);
  const nb=Sp.parts.length, parts=chartParts(SOL,C);
  const avail=V.capY-24-V.top-64, minRow=nb*6+10, maxRows=Math.max(2,Math.floor(avail/minRow)), rows=parts.slice(0,maxRows);
  const rowH=Math.min(Math.max(minRow,avail/rows.length),nb*22+34);
  const lw=Math.min(150,Math.max(96,Math.max(...rows.map(e=>plain(elTag(C,e)).length))*5.6+10));
  const B=box(V.left+lw,V.top,V.right-V.left-lw,rowH*rows.length);
  let lo=0, hi=0;
  for(const e of rows){ const k=SOL.onK.get(e.id); let c=0; for(const p of Sp.parts){ c+=p[k]; lo=Math.min(lo,c); hi=Math.max(hi,c); } }
  const span=(hi-lo)||1; lo-=0.06*span; hi+=0.06*span;
  axesR(ctx,B,lo,hi,0,rows.length,{title:titleFor(B,'each part’s current, battery by battery: '+nb+' batter'+(nb===1?'y':'ies'),'current, battery by battery'),xlab:'current i, from a to b through the part',yticks:[],xfmt:v=>siFmt(v,'A',2)});
  const X=v=>B.x+B.w*(v-lo)/(hi-lo);
  if(lo<0&&hi>0) strokePts(ctx,[[X(0),B.y],[X(0),B.y1]],'#8b93a6',1);
  /* a waterfall per row: battery j's step on its own sub-row, starting where
     the previous one ended; the full solution as a white tick across the row */
  const sb=Math.min(16,(rowH-14)/nb);
  rows.forEach((e,r)=>{ const k=SOL.onK.get(e.id), y0=B.y+rowH*r+(rowH-nb*sb)/2;
    lab(ctx,W,H,B.x-8,B.y+rowH*(r+0.5),elTag(C,e),'#aeb6c6','10.5px -apple-system, sans-serif','right','middle');
    let c=0;
    Sp.parts.forEach((p,j)=>{ const c1=c+p[k], xa=X(Math.min(c,c1)), xb=Math.max(X(Math.max(c,c1)),xa+1), ya=y0+j*sb;
      fillPts(ctx,[[xa,ya+0.5],[xb,ya+0.5],[xb,ya+sb-0.5],[xa,ya+sb-0.5]],BAT_COL[Math.min(j,3)]);
      if(j<nb-1) strokePts(ctx,[[X(c1),ya+sb-0.5],[X(c1),ya+sb+0.5]],'#6f7789',1);
      c=c1; });
    const xt=X(SOL.sol.i[k]); strokePts(ctx,[[xt,y0-3],[xt,y0+nb*sb+3]],'#f2f4f8',2.2); });
  /* the key, below the axis where no bar can reach it */
  const items=Sp.bats.slice(0,3).map((kb,j)=>[BAT_COL[j],elTag(C,SOL.net.br[kb].el)+' alone']);
  if(nb>3) items.push([BAT_COL[3],(nb-3)+' more batteries']);
  items.push(['#f2f4f8','the full solution']);
  let lx=B.x; const ly=B.y1+46;
  for(const [col,txt] of items){ fillPts(ctx,[[lx,ly-4],[lx+11,ly-4],[lx+11,ly+4],[lx,ly+4]],col);
    lab(ctx,W,H,lx+16,ly,txt,'#9aa2b4','10.5px -apple-system, sans-serif','left','middle'); lx+=16+plain(txt).length*10.5*0.52+20; }
  if(parts.length>rows.length) lab(ctx,W,H,B.x,ly+18,(parts.length-rows.length)+' more parts not shown','#8b93a6','10.5px -apple-system, sans-serif','left','middle');
  caption(ctx,V.left,V.capY,V.capTxt,V.capW,'#767e92',CAP_FONT);
}

/* ---------------- dispatch and the scene ---------------- */
function drawView(ctx,W,H,M){
  POLY_SEGS=[]; LEGEND_RECTS=[]; LABELS=[];
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
  if(M.view==='lab') drawLab(ctx,W,H,M);
  else if(M.view==='graph') drawGraph(ctx,W,H,M);
  else if(M.view==='power') drawPower(ctx,W,H,M);
  else if(M.view==='thev') drawThev(ctx,W,H,M);
  else drawSuper(ctx,W,H,M);
}
/* the charge animation: every part's charges slide by 25 units per second per
   ampere, times the speed-limit factor; a fixed step per frame keeps the
   headless suites deterministic */
const FRAME_DT=1/60;
function advanceCharges(st,SOL,dt){
  const sc=chargeScale(SOL.Imax);
  for(const e of st.circ.els){ const I=SOL.I.get(e.id); if(!(Math.abs(I)>1e-10)) continue;
    const L=elLength(st.circ,e)||1, p=(st.phase[e.id]||0)+dt*CHARGE_SPEED*I*sc;
    st.phase[e.id]=((p%L)+L)%L; }
  st.clock+=dt;
}
function makeScene(canvas){
  const S={st:ST,W:1400,H:820};
  S.model=()=>buildModel();
  S.draw=()=>{ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.pointer=(kind,x,y)=>ST.view==='lab'?labPointer(S,kind,x,y):false;
  S.wheel=dy=>{ if(ST.view!=='lab') return false;
    const i=Math.max(0,ZOOMS.indexOf(ST.zoom)), j=clamp(i+(dy<0?1:-1),0,ZOOMS.length-1);
    if(ZOOMS[j]===ST.zoom) return false; ST.zoom=ZOOMS[j]; return true; };
  /* the loop paints on its own only while charges are moving in the lab */
  S.animating=()=>{ if(ST.view!=='lab'||!ST.showCurrent) return false; return buildModel().sol.Imax>1e-10; };
  S.step=()=>{ if(!S.animating()) return false; advanceCharges(ST,buildModel().sol,FRAME_DT); return true; };
  return S;
}
/* ================================================================== *
 *  boot -- panel, tabs, handlers, frame loop                          *
 * ================================================================== */
const LOG_RHO=[Math.log10(RHO_MIN),Math.log10(RHO_MAX)];
const LOG_RBAT=[Math.log10(BATT_R_MIN),Math.log10(BATT_R_MAX)];
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k; DRAG.what=null;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2)); });

  const rows={};
  /* a slider on a value held in the state; get/set map it both ways */
  function slider(key,lab2,lo,hi,step2,get,set,fmtf){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:get()});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=get(); val.innerHTML=fmtf(get()); };
    inp.addEventListener('input',()=>{ set(parseFloat(inp.value)); val.innerHTML=fmtf(get()); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; sync(); return rowEl;
  }
  function checkbox(key,lab2,get,set){
    const inp=h('input',{type:'checkbox'}); inp.checked=get();
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ set(inp.checked); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=get(); },inp};
    return el;
  }
  const chipRows=[];
  function chipRow(list,isOn,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{ wrapEl.appendChild(h('button',{class:'chip'+(isOn(o)?' on':''),onclick:()=>{ onPick(o); syncPanel(); dirty=true; refresh(); }},o.name)); });
    chipRows.push({el:wrapEl,list,isOn});
    return wrapEl;
  }
  const btn=(txt,fn)=>h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},txt);
  const selEl=()=>st.sel!==null?elById(st.circ,st.sel):null;

  /* the circuit: presets */
  const gCirc=h('div',{class:'grp'},h('h3',null,'the circuit'));
  gCirc.appendChild(chipRow(PRESET_ORDER.map(k=>({id:k,name:PRESET_NAMES[k]})),o=>st.preset===o.id,o=>{ applyPreset(st,o.id); DRAG.what=null; }));
  const circTag=h('div',{class:'tag'}); gCirc.appendChild(circTag);

  /* the selected part */
  const gSel=h('div',{class:'grp'},h('h3',null,'the selected part'));
  const selTag=h('div',{class:'tag'}); gSel.appendChild(selTag);
  gSel.appendChild(slider('volt','voltage, V',0,120,0.1,()=>{ const e=selEl(); return e&&isBattery(e.type)?e.E:9; },
    v=>{ const e=selEl(); if(e&&isBattery(e.type)){ e.E=v; circuitEdited(st); } },v=>fmt(v,selEl()&&selEl().type==='xbattery'?0:1)+' V'));
  gSel.appendChild(slider('res','resistance, &Omega;',0,120,0.1,()=>{ const e=selEl(); return e&&e.R!==undefined?e.R:10; },
    v=>{ const e=selEl(); if(e&&isEditable(e.type)&&e.R!==undefined){ e.R=v; circuitEdited(st); } },v=>fmt(v,selEl()&&TYPES[selEl().type].dp===0?0:1)+' &Omega;'));
  gSel.appendChild(slider('rating','current rating, A',0.5,20,0.1,()=>{ const e=selEl(); return e&&e.type==='fuse'?e.rating:4; },
    v=>{ const e=selEl(); if(e&&e.type==='fuse'){ e.rating=v; circuitEdited(st); } },v=>fmt(v,1)+' A'));
  const bDel=btn('delete',()=>{ const e=selEl(); if(e){ deleteElement(st.circ,e.id); st.sel=null; circuitEdited(st); } });
  const bRev=btn('reverse',()=>{ const e=selEl(); if(e&&isBattery(e.type)){ reverseBattery(st.circ,e.id); circuitEdited(st); } });
  const bSw=btn('toggle the switch',()=>{ const e=selEl(); if(e&&e.type==='switch'){ e.closed=!e.closed; circuitEdited(st); } });
  const bFuse=btn('repair the fuse',()=>{ const e=selEl(); if(e&&e.type==='fuse'){ e.tripped=false; circuitEdited(st); } });
  const bSplit=btn('split the junction',()=>{ if(st.selV!==null){ splitVertex(st.circ,st.selV); st.selV=null; circuitEdited(st); } });
  gSel.appendChild(h('div',{class:'btnrow'},bDel,bRev,bSw)); gSel.appendChild(h('div',{class:'btnrow'},bFuse,bSplit));

  /* how the lab looks */
  const gShow=h('div',{class:'grp'},h('h3',null,'what to show'));
  gShow.appendChild(chipRow([{id:'lifelike',name:'lifelike'},{id:'schematic',name:'schematic'}],o=>st.look===o.id,o=>{ st.look=o.id; }));
  gShow.appendChild(h('div',{class:'checks'},checkbox('cur','show current',()=>st.showCurrent,v=>{ st.showCurrent=v; })));
  gShow.appendChild(chipRow([{id:'electrons',name:'electrons'},{id:'conventional',name:'conventional'}],o=>st.carrier===o.id,o=>{ st.carrier=o.id; }));
  gShow.appendChild(h('div',{class:'checks'},checkbox('labels','labels',()=>st.showLabels,v=>{ st.showLabels=v; }),
    checkbox('values','values',()=>st.showValues,v=>{ st.showValues=v; })));
  gShow.appendChild(chipRow(ZOOMS.map(z=>({id:z,name:'zoom '+z+'×'})),o=>st.zoom===o.id,o=>{ st.zoom=o.id; }));

  /* PhET's advanced panel */
  const gAdv=h('div',{class:'grp'},h('h3',null,'advanced'));
  gAdv.appendChild(slider('rho','wire resistivity',LOG_RHO[0],LOG_RHO[1],0.01,()=>Math.log10(st.rho),
    v=>{ st.rho=Math.pow(10,v); if(Math.abs(v-LOG_RHO[0])<1e-9) st.rho=RHO_MIN; if(Math.abs(v-LOG_RHO[1])<1e-9) st.rho=RHO_MAX; },v=>sigf(Math.pow(10,v),2)+' &Omega;m'));
  gAdv.appendChild(slider('rbat','battery resistance',LOG_RBAT[0],LOG_RBAT[1],0.01,()=>Math.log10(st.rbat),
    v=>{ st.rbat=Math.pow(10,v); if(Math.abs(v-LOG_RBAT[0])<1e-9) st.rbat=BATT_R_MIN; if(Math.abs(v-LOG_RBAT[1])<1e-9) st.rbat=BATT_R_MAX; },v=>sigf(Math.pow(10,v),2)+' &Omega;'));
  gAdv.appendChild(h('div',{class:'checks'},checkbox('real','add real bulbs',()=>st.realBulbs,v=>{ st.realBulbs=v; })));
  const advTag=h('div',{class:'tag'}); gAdv.appendChild(advTag);

  /* the meters */
  const gMet=h('div',{class:'grp'},h('h3',null,'meters'));
  gMet.appendChild(h('div',{class:'checks'},checkbox('vm','voltmeter',()=>st.vm.on,v=>{ st.vm.on=v; }),
    checkbox('am','non-contact ammeter',()=>st.am.on,v=>{ st.am.on=v; })));
  const metTag=h('div',{class:'tag'}); gMet.appendChild(metTag);

  /* the part the rest of the circuit is seen from */
  const gFoc=h('div',{class:'grp'},h('h3',null,'the part to look from'));
  const stepFocus=d=>{ const SOL=S.model().sol, list=st.circ.els.filter(e=>SOL.onK.has(e.id)&&e.type!=='wire');
    if(!list.length) return; const cur=focusElement(st,SOL), j=list.findIndex(e=>e.id===cur);
    st.thevEl=list[((j<0?0:j+d)%list.length+list.length)%list.length].id; };
  gFoc.appendChild(h('div',{class:'btnrow'},btn('previous part',()=>stepFocus(-1)),btn('next part',()=>stepFocus(1))));
  const focTag=h('div',{class:'tag'}); gFoc.appendChild(focTag);

  const gReset=h('div',{class:'grp'},h('h3',null,'start again'));
  gReset.appendChild(h('div',{class:'btnrow'},btn('reset all',()=>{ const v=st.view; resetState({view:v}); DRAG.what=null; })));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Circuit Construction Kit: DC - Virtual Lab (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). '
      +'New code; no PhET code or assets.'}),
    h('div',{class:'src',html:'PhET&rsquo;s values, read from its 1.5.2 build: every part&rsquo;s length, value and range; wire resistivity 10<sup>&minus;10</sup>&ndash;0.0168 &Omega;m through a 5&times;10<sup>&minus;4</sup> m&sup2; section at 0.5 mm per unit; '
      +'battery resistance 10<sup>&minus;4</sup>&ndash;10 &Omega;; 1.1&times;10<sup>&minus;10</sup> &Omega; for a zero; the fuse&rsquo;s 0.06/rating; the brightness rule; the real bulb&rsquo;s law; fire at 15 A; the 30-unit snap and 11.2-unit probe radius; '
      +'charges 25 units/s per ampere under a speed limit. Household objects as in 1.5.2 (eraser and dollar bill 10<sup>6</sup> &Omega;; PhET&rsquo;s model notes say 10<sup>9</sup>). '
      +'No measured constants are needed. Every solution is pinned in selfTest to build/circuit-construction-kit-dc-virtual-lab/derive.py, which solves the same circuits exactly, in rational arithmetic.'}));
  [gCirc,gSel,gShow,gAdv,gMet,gFoc,gReset,gInfo].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){ for(const r of chipRows) [].forEach.call(r.el.children,(b,i)=>b.className='chip'+(r.isOn(r.list[i])?' on':'')); }
  function syncPanel(){
    const v=st.view, e=selEl();
    if(st.sel!==null&&!e) st.sel=null;
    if(st.selV!==null&&!vById(st.circ,st.selV)) st.selV=null;
    gSel.hidden=(v!=='lab'); gShow.hidden=(v!=='lab'); gAdv.hidden=(v!=='lab'); gMet.hidden=(v!=='lab'); gFoc.hidden=(v!=='thev');
    /* only the controls that act on the selection are shown, with its ranges */
    const T=e?TYPES[e.type]:null;
    rows.volt.row.hidden=!(e&&isBattery(e.type)); rows.res.row.hidden=!(e&&isEditable(e.type)&&e.R!==undefined); rows.rating.row.hidden=!(e&&e.type==='fuse');
    if(e&&isBattery(e.type)){ rows.volt.inp.min=T.lo; rows.volt.inp.max=T.hi; rows.volt.inp.step=T.step; }
    if(e&&e.R!==undefined&&isEditable(e.type)){ rows.res.inp.min=T.lo; rows.res.inp.max=T.hi; rows.res.inp.step=T.step; }
    bDel.hidden=!e; bRev.hidden=!(e&&isBattery(e.type)); bSw.hidden=!(e&&e.type==='switch'); bFuse.hidden=!(e&&e.type==='fuse');
    bFuse.disabled=!(e&&e.type==='fuse'&&e.tripped);
    const vv=st.selV!==null?vById(st.circ,st.selV):null;
    bSplit.hidden=!(vv&&elsAt(st.circ,vv.id).length>=2);
    for(const k in rows) rows[k].sync();
    syncChips();
    circTag.innerHTML=st.preset==='custom'?'your own circuit: '+st.circ.els.length+' part'+(st.circ.els.length===1?'':'s'):'drag any part in the lab to make it your own';
    selTag.innerHTML=e?'<b>'+elTag(st.circ,e)+'</b>'+(e.type==='switch'?(e.closed?' &mdash; closed':' &mdash; open'):'')+(e.type==='fuse'&&e.tripped?' &mdash; <span class="r">blown</span>':'')
      :(vv?'a joint of '+elsAt(st.circ,vv.id).length+' part'+(elsAt(st.circ,vv.id).length===1?'':'s'):'tap a part in the lab to edit it; tap a joint to split it');
    advTag.innerHTML='100 units of wire: <b>'+plain(fmtR(wireR(100,st.rho)))+'</b>; every battery: r = <b>'+plain(fmtR(st.rbat))+'</b>';
    metTag.innerHTML='drag a meter out of the toolbox, or tick it here; drag its probes onto the circuit, drop it back on the toolbox to put it away';
    const SOL=S.model().sol, f=focusElement(st,SOL), fe=f!==null?elById(st.circ,f):null;
    focTag.innerHTML=fe?'looking from the <b>'+elTag(st.circ,fe)+'</b>':'no part in the circuit';
    keysTag.innerHTML='<b>1</b>&ndash;<b>5</b> switch views &middot; <b>delete</b> removes the selected part &middot; <b>x</b> splits the selected joint';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='lab'?'drag parts from the toolbox · drop an end on an end · tap to select · 1–5 switch views'
        :st.view==='thev'?'choose the part in the lab, or step through with the buttons · 1–5 switch views':'1–5 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); syncPanel(); refresh(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!DRAG.what||DRAG.what==='none') return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncPanel(); refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); if(S.wheel(e.deltaY)){ syncPanel(); dirty=true; refresh(); } },{passive:false});

  window.addEventListener('keydown',e=>{
    if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
    else if((e.key==='Delete'||e.key==='Backspace')&&st.sel!==null){ deleteElement(st.circ,st.sel); st.sel=null; circuitEdited(st); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='x'&&st.selV!==null){ if(splitVertex(st.circ,st.selV)){ st.selV=null; circuitEdited(st); } syncPanel(); dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  /* the loop paints when a handler marked it dirty, and every frame while
     charges are moving in the lab */
  function frameLoop(){
    try{ if(S.step()) dirty=true; }catch(e){ fail(e); }
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

  graph:'A circuit is a graph. Every joint is a node and every part is a branch between two nodes, wires included, since a wire has resistance and PhET&rsquo;s '
    +'solver keeps it. A spanning tree (cyan) reaches every node without closing a loop; each remaining branch (dashed) closes exactly one loop through the '
    +'tree, which is why a circuit of B branches, N nodes and C separate pieces has exactly B &minus; N + C independent loops. Kirchhoff saw this in 1847. '
    +'Modified nodal analysis writes one equation for each node (the current law: what flows in flows out) and one for each branch (its own law), and '
    +'solves for a voltage at every node but one reference in each piece and a current in every branch. The matrix is that system cell by cell: the '
    +'incidence matrix A in the top right, its transpose on the left, the resistances down the diagonal. Keeping every current as an unknown (PhET keeps '
    +'only the batteries&rsquo; and the zero-ohm parts&rsquo;) makes the current law a row of the system, so it holds to rounding error; the strip below measures '
    +'both laws on the solution itself.',
  power:'Energy balances exactly in a circuit, and here it balances to the last bit. Each battery&rsquo;s EMF does work E i on the charge it drives; each '

    +'branch currents that obey the current law and any branch voltages that come from node potentials, the sum of v i over all the branches is zero, '
    +'whatever the parts are. The waterfall climbs by each EMF&rsquo;s share and steps down by each loss, and lands back on zero. Below is PhET&rsquo;s rule for '

    +'characteristic, v = V<sub>th</sub> &minus; R<sub>th</sub> i (orange); the part has its own (green); and the circuit sits where they cross, which '

  super:'A circuit of batteries and resistors is linear: double every EMF and every current doubles. So the currents several batteries drive together are '

    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },

  /* the scale of each connected piece of a solution: its largest current and
     its largest voltage (node, EMF or drop) -- the ruler rounding is made on */
  function scales(N,br,v,i){
    const comp=componentsOf(N,br), Isc=new Map(), Vsc=new Map();
    const up=(m,c,x)=>{ if(!(m.get(c)>=x)) m.set(c,x); };
    br.forEach((e,k)=>{ up(Isc,comp[e.a],Math.abs(i[k])); up(Vsc,comp[e.a],Math.max(Math.abs(e.E),Math.abs(e.R*i[k]))); });
    for(let q=0;q<N;q++){ up(Vsc,comp[q],Math.abs(v[q])); if(!Isc.has(comp[q])) Isc.set(comp[q],0); }
    return {comp,Isc,Vsc};
  }
  /* a solution against the exact one, each number measured against its
     piece's scale; returns the worst current and voltage errors */
  function vsExact(N,br,s,Rv,Ri){

    for(let q=0;q<N;q++){ const m=sc.Vsc.get(sc.comp[q]); wv=Math.max(wv,m>0?Math.abs(s.v[q]-Rv[q])/m:Math.abs(s.v[q])); }
    return {wi,wv};

  function presetCheck(key,Rp,tag,setup){

    ok(e.wv<=TOL_V,tag+': every node voltage matches (python) ['+e.wv.toExponential(2)+']');
    ok(SOL.law.kcl<=TOL_LAW&&SOL.law.kvl<=TOL_LAW,tag+': Kirchhoff closes on the answer ['+SOL.law.kcl.toExponential(1)+', '+SOL.law.kvl.toExponential(1)+']');

      let hit=null; const flat=texts.filter(t=>!t.rot);
      for(let i2=0;i2<flat.length&&!hit;i2++) for(let j2=i2+1;j2<flat.length;j2++){
        const a=flat[i2].bb,b=flat[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+flat[i2].t.slice(0,22)+'" vs "'+flat[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      /* the house #hint (HTML, bottom:11px, 11px type) owns the bottom-left corner */
      const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
      ok(!inHint.length,nm+' '+W+'x'+H+' no canvas text under the #hint line'+(inHint.length?' ("'+inHint[0].t.slice(0,30)+'" to y '+fmt(inHint[0].bb[3],0)+')':''));
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    } finally{ resetState(save); }
  }
  /* a caption describes only what its view drew (Known-bad: a clause true of
     one case printed in another) */
  for(const [W,H] of SIZES) for(const [v,pre,sel] of [['thev','twobat',15],['thev','twobat',0],['graph','bridge',null]]){
    const save=clone(ST); resetState({view:v}); applyPreset(ST,pre); ST.sel=sel;
    const c=makeShot(W,H); drawView(c,W,H,buildModel()); const ts=c.ops.filter(o=>o.op==='text').map(o=>o.t), txt=ts.join(' '); resetState(save);
    const sweep=ts.some(t=>t==='its resistance R (log axis)'), mat=ts.some(t=>/^the matrix/.test(t));
    if(v==='thev') ok(sweep===/On the right, the power/.test(txt),'thev '+pre+'/'+sel+' '+W+'x'+H+': the caption names the power sweep exactly when it is drawn ('+sweep+')');
    else ok(mat===/The matrix is the system/.test(txt),'graph '+W+'x'+H+': the caption describes the matrix exactly when it is drawn ('+mat+')'); }
  /* PhET's three zooms scale the bench, about its centre */
  { const z1=labGeo(1400,820,Object.assign(clone(ST),{zoom:1})), z16=labGeo(1400,820,Object.assign(clone(ST),{zoom:1.6})), z05=labGeo(1400,820,Object.assign(clone(ST),{zoom:0.5}));
    rel(z16.sc,1.6*z1.sc,1e-15,'zoom 1.6 draws the bench 1.6 times larger'); rel(z05.sc,0.5*z1.sc,1e-15,'and zoom 0.5 half size');
    close(z16.map.X(0),z1.map.X(0),0,'about the same centre'); rel(z16.map.X(100)-z16.map.X(0),1.6*(z1.map.X(100)-z1.map.X(0)),1e-15,'so 100 units of wire span 1.6 times the pixels'); }
  /* the toolbox never reaches the #hint line, at any size, with the real bulbs in */
  for(const [W,H] of SIZES){ const save=clone(ST); ST.realBulbs=true; const G=labGeo(W,H,ST); resetState(save);
    ok(G.tb.y+G.tb.h<=H-27,'the toolbox ends above the #hint line at '+W+'x'+H+' ('+fmt(G.tb.y+G.tb.h,0)+')');
    ok(G.tb.items.length===19&&G.tb.items.every(it=>it.x+it.w<=G.tb.x+G.tb.w+0.5),'and holds all 19 tools inside it'); }
  /* the bulb's glow is PhET's opacity map, and it reaches the drawn colour */
  close(glowOf(0.2),0.4,1e-15,'lit glass at brightness 0.2 is 40 % on (PhET: linear to full at 0.5)'); eq(glowOf(0.7),1,'and full above 0.5');
  { const save=clone(ST); resetState({}); const c=makeShot(1400,820); drawView(c,1400,820,buildModel()); const lit=c.ops.filter(o=>o.op==='fill'&&/^rgb\(/.test(o.style)).map(o=>brightnessCss(o.style));
    ST.circ.els[0].E=0; for(const k in MEMO) delete MEMO[k]; const c2=makeShot(1400,820); drawView(c2,1400,820,buildModel()); const dark=c2.ops.filter(o=>o.op==='fill'&&/^rgb\(/.test(o.style)).map(o=>brightnessCss(o.style));
    resetState(save);
    ok(Math.max(...lit)>Math.max(...dark)+20,'a lit bulb draws brighter glass than a dark one ('+Math.max(...lit)+' vs '+Math.max(...dark)+')'); }

  /* ---------- 12. building a circuit with the pointer, headless ---------- */
  withState({},()=>{
    applyPreset(ST,'empty'); ST.showCurrent=false;
    const shot=makeShot(1400,820), S=makeScene({getContext:()=>shot}); S.W=1400; S.H=820;
    const G=labGeo(1400,820,ST), m=G.map, tool=k=>G.tb.items.find(it=>it.key===k), mid=it=>[it.x+it.w/2,it.y+it.h/2];
    const drag=(p,q)=>{ const r=S.pointer('down',p[0],p[1]); S.pointer('move',(p[0]+q[0])/2,(p[1]+q[1])/2); S.pointer('move',q[0],q[1]); S.pointer('up',0,0); return r; };
    const W2S=(x,y)=>[m.X(x),m.Y(y)];
    ok(drag(mid(tool('battery')),W2S(0,100)),'pressing the toolbox\'s battery picks one up'); eq(ST.circ.els.length,1,'and dropped on the bench it stays');
    const bat=ST.circ.els[0]; close(vById(ST.circ,bat.a).x,-51,1e-9,'where it was dropped (centred under the pointer)'); close(vById(ST.circ,bat.b).y,100,1e-9,'level');
    eq(ST.preset,'custom','a hand-built bench lets go of the preset chip');
    drag(mid(tool('bulb')),W2S(0,-60)); const bulb=ST.circ.els[1]; eq(bulb.type,'bulb','a bulb next');
    drag(mid(tool('wire')),W2S(100,20)); drag(mid(tool('wire')),W2S(-100,20)); eq(ST.circ.els.length,4,'and two wires');
    const w1=ST.circ.els[2], w2=ST.circ.els[3];
    /* join the ends: each dropped a few units off a terminal, inside PhET's 30-unit radius */
    drag(W2S(50,20),W2S(55,96)); eq(w1.a,bat.b,'wire 1\'s end, dropped 6 units from the battery\'s + terminal, joins it');
    drag(W2S(150,20),W2S(46,-52)); eq(w1.b,bulb.b,'its other end joins the bulb');
    drag(W2S(-50,20),W2S(-55,-66)); eq(w2.b,bulb.a,'wire 2 joins the bulb\'s other end');
    drag(W2S(-150,20),W2S(-47,93)); eq(w2.a,bat.a,'and closes the loop at the - terminal');
    let SOL=solutionOf(ST); eq(SOL.loops,1,'one loop'); const Rw=wireR(elLength(ST.circ,w1),RHO_MIN)+wireR(elLength(ST.circ,w2),RHO_MIN);
    rel(Math.abs(SOL.I.get(bulb.id)),9/(BATT_R_MIN+10+Rw),4*EPS,'and the bulb carries E/(r + R + wires), whatever length the wires were dragged to');
    ok(SOL.I.get(bulb.id)<0,'from its b end to its a end, the way it was wired (the battery\'s + joins the bulb\'s b)');
    close(SOL.bright.get(bulb.id),brightnessOf(SOL.I.get(bulb.id)**2*10),1e-15,'and glows by PhET\'s rule');
    /* a tap selects; a tap on a switch toggles it */
    ST.thevEl=bat.id; const bc=W2S(0,-60); S.pointer('down',bc[0],bc[1]); S.pointer('up',0,0); eq(ST.sel,bulb.id,'a tap on the bulb selects it');
    eq(focusElement(ST,solutionOf(ST)),bulb.id,'and hands the rest-of-the-circuit view to it, over a part stepped to earlier');
    drag(mid(tool('switch')),W2S(0,230)); const sw=ST.circ.els[4]; eq(sw.closed,false,'a new switch is open (PhET)');
    const sc2=W2S(0,230); S.pointer('down',sc2[0],sc2[1]); S.pointer('move',sc2[0]+3,sc2[1]+2); S.pointer('up',0,0); eq(sw.closed,true,'a tap (moving less than 15 px) closes it'); eq(ST.sel,sw.id,'and selects it');
    S.pointer('down',sc2[0]+3,sc2[1]+2); S.pointer('up',0,0); eq(sw.closed,false,'another tap opens it');
    /* back into the toolbox: gone */
    const n0=ST.circ.els.length; drag(W2S(0,230),mid(tool('fuse'))); eq(ST.circ.els.length,n0-1,'a part dropped on the toolbox goes back into it');
    eq(ST.sel,null,'and is no longer selected');
    /* a part dragged whole, and a joint dragged: rigid parts swing */
    const b0=vById(ST.circ,bat.a).x; drag(W2S(-20,100),W2S(-20,140)); close(vById(ST.circ,bat.a).y,140,1e-9,'dragging the battery\'s body moves it'); close(vById(ST.circ,bat.a).x,b0,1e-9,'straight down');
    rel(Math.abs(solutionOf(ST).I.get(bulb.id)),9/(BATT_R_MIN+10+wireR(elLength(ST.circ,w1),RHO_MIN)+wireR(elLength(ST.circ,w2),RHO_MIN)),4*EPS,'the wires stretched with it and the circuit re-solved');
    /* the split button */
    const jb=W2S(vById(ST.circ,bat.b).x,vById(ST.circ,bat.b).y); S.pointer('down',jb[0],jb[1]); S.pointer('up',0,0); eq(ST.selV,bat.b,'a tap on a joint selects it');
    const sb=splitButton(G,ST); ok(!!sb,'and offers PhET\'s split button'); S.pointer('down',sb.x+5,sb.y+5); S.pointer('up',0,0);
    eq(solutionOf(ST).loops,0,'splitting the joint opens the loop'); eq(ST.selV,null,'and clears the joint selection');
    /* the meters */
    ok(S.pointer('down',...mid(tool('voltmeter'))),'the voltmeter comes out of the toolbox'); S.pointer('move',...W2S(300,150)); S.pointer('up',0,0); ok(ST.vm.on,'and stays out');
    const Vg=vmGeo(G,ST); ok(S.pointer('down',Vg.red.T[0],Vg.red.T[1])&&DRAG.what==='vm-red','its red probe grabs by the tip');
    S.pointer('move',...W2S(vById(ST.circ,bat.a).x,vById(ST.circ,bat.a).y)); S.pointer('up',0,0);
    const Vg2=vmGeo(G,ST); S.pointer('down',Vg2.black.T[0],Vg2.black.T[1]); S.pointer('move',...W2S(vById(ST.circ,bat.b).x,vById(ST.circ,bat.b).y)); S.pointer('up',0,0);
    rel(buildModel().vm.V,-9,1e-12,'red on -, black on +: the voltmeter reads -9.00 V across the open battery'); eq(voltageText(buildModel().vm.V),'-9.00 V','shown as PhET does, -9.00 V');
    const Vg3=vmGeo(G,ST); drag(Vg3.c,mid(tool('bulb'))); ok(!ST.vm.on,'dropped on the toolbox, it is put away');
    ok(S.pointer('down',...mid(tool('probe'))),'the non-contact ammeter comes out'); S.pointer('move',...W2S(300,100)); S.pointer('up',0,0); ok(ST.am.on,'and stays');
    /* the wheel steps PhET's three zooms */
    eq(ST.zoom,1,'zoom 1'); ok(S.wheel(-100)&&ST.zoom===1.6,'the wheel zooms in to 1.6'); ok(!S.wheel(-100),'and no further');
    ok(S.wheel(100)&&S.wheel(100)&&ST.zoom===0.5,'and out to 0.5'); ok(!S.wheel(100),'and no further');
    ST.view='graph'; ok(!S.wheel(-100),'only the lab zooms'); ok(!S.pointer('down',500,300),'and only the lab takes the pointer'); ST.view='lab';
    ok(!S.pointer('down',1300,760),'empty bench grabs nothing'); S.pointer('up',0,0);
  });
  withState({},()=>{
    const C=newCircuit(); ST.circ=C; const wz=addElement(C,'wire',0,0), rz=addElement(C,'resistor',0,-9);
    vById(C,wz.a).x=-200; vById(C,wz.b).x=200; const G=labGeo(1400,820,ST), m=G.map;
    eq(hitElement(G,ST,m.X(0),m.Y(-3)),rz.id,'where a wire runs under a resistor, the pointer takes the resistor (PhET: parts sit over wires)');
    eq(hitElement(G,ST,m.X(150),m.Y(-3)),wz.id,'and away from it, the wire');
    const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; const sw=addElement(C,'switch',0,200), p=[m.X(0),m.Y(200)];
    S.pointer('down',p[0],p[1]); S.pointer('move',p[0]+10,p[1]); S.pointer('up',0,0); eq(sw.closed,true,'a press that travels 10 px is still a tap (PhET\'s threshold is 15 px) and toggles the switch');
    S.pointer('down',p[0]+10,p[1]); S.pointer('move',p[0]+30,p[1]); S.pointer('up',0,0); eq(sw.closed,true,'one that travels 20 px is a drag and leaves it alone');
  });
  /* the drop target a drag would join, and a tap on empty space that deselects */
  withState({},()=>{
    const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820; const G=labGeo(1400,820,ST), m=G.map;
    ST.sel=4; S.pointer('down',m.X(0),m.Y(60)); ok(S.pointer('up',0,0)&&ST.sel===null,'a tap on empty bench clears the selection');
    const p=[m.X(150),m.Y(20)]; S.pointer('down',p[0],p[1]); eq(DRAG.what,'el','a press on a wire grabs the wire'); S.pointer('up',0,0); eq(ST.sel,2,'and a tap selects it');
    const r=[m.X(-150),m.Y(-60)]; S.pointer('down',r[0],r[1]); eq(DRAG.what,'vert','a press on a joint grabs the joint'); S.pointer('up',0,0);
  });

  /* ---------- 13. the frame loop's contract ---------- */
  withState({},()=>{
    const S=makeScene({getContext:()=>makeShot(1400,820)}); S.W=1400; S.H=820;
    ok(S.animating(),'the lab with current flowing animates'); const p0=ST.phase[4]||0; ok(S.step()&&ST.phase[4]!==p0,'and each frame moves the charges');
    ST.showCurrent=false; ok(!S.animating()&&!S.step(),'with the current hidden it is still');
    ST.showCurrent=true; ST.view='graph'; ok(!S.animating(),'the analysis views never animate');
    ST.view='lab'; applyPreset(ST,'empty'); ok(!S.animating(),'nor does an empty bench');
  });

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
