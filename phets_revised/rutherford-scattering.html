<title>Rutherford scattering &mdash; the hyperbola that found the nucleus</title>
<!--
  ===================================================================
  rutherford-scattering.html — a remake of PhET's Rutherford
  Scattering: fire alpha particles at an atom, watch where they go,
  and check every path against the closed form
  ===================================================================

  Remake of PhET Interactive Simulations' Rutherford Scattering
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0).  New
  code; no PhET code or assets.  Built against PhET's
  rutherford-scattering 1.1.29: both of its screens (Rutherford Atom,
  Plum Pudding Atom), both of the Rutherford screen's scenes (the
  zoomed-out atomic view and the zoomed-in nuclear view), its gun, its
  Energy / Protons / Neutrons sliders, its Traces checkbox and its
  legend — and its model constants, read out of the minified original.

  Six views.  THE NUCLEUS is PhET's nuclear-scale scene: one nucleus,
  the gun below it, the alpha particles curving away on exact
  hyperbolas.  THE FOIL is PhET's atomic-scale scene: five atoms in
  the field of view, most particles straight through, the occasional
  one thrown back.  PLUM PUDDING is PhET's second screen — the
  particles go straight through, because in Thomson's atom they must —
  with the number that killed the model printed beside them.  THE
  HYPERBOLA is the closed form on its own: b, the asymptotes, the
  distance of closest approach, and an RK4 integration of Newton's
  equations laid over it.  THE CROSS SECTION builds 1/sin^4(theta/2)
  three ways: the closed form, the Jacobian |db/dtheta|, and a seeded
  beam of 20 000 particles binned in solid angle.  GOLD, FOR REAL puts
  PhET's scaled numbers beside the real ones.

  WHAT IS EXACT HERE
  ------------------
  The whole Coulomb problem.  The trajectory is the exact hyperbola
  r(phi) = b^2 / (b sin phi + (D/2)(cos phi - 1)), where D = k Z1 Z2
  e^2 / E is the head-on distance of closest approach.  Every particle
  drawn is on that conic, at every step, by construction — only its
  TIMING along the conic is integrated (RK4 on dphi/dt = v_inf b / r^2,
  fourth order, measured).  From it: tan(theta/2) = D/(2b), r_min =
  D/2 + sqrt(D^2/4 + b^2), the asymptote offsets, the eccentricity
  1/sin(theta/2), and dsigma/dOmega = (D/4)^2 / sin^4(theta/2) — which
  is obtained as the Jacobian (b/sin theta)|db/dtheta| and not quoted.
  Energy is conserved to 8e-13 and angular momentum to 2e-13 along an
  independent solve_ivp integration of the equations of motion, which
  also reproduces the deflection (residual 1.5/r_final^2, a truncation
  whose RATE is measured, not waved at) and the closed-form turning
  point to 1.3e-14.  The head-on case b = 0 is exact too: r_min = D,
  theta = pi, and the radial motion has the closed parametric solution
  r = (D/2)(cosh n + 1), t = (D/2)(sinh n + n).  The sampled beam is a
  seeded mulberry32 reproduced bit-for-bit in Python, and every bin is
  asserted against the exact solid-angle average with a tolerance taken
  from the sampling law, never guessed.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  Everything about the PICTURE is PhET's and is scaled, not physical.
  PhET's Energy slider (50-100, default 80) enters its model as the
  particle SPEED, and its head-on distance is D = (L/8)(protons/79)
  (80/speed)^2 in model units, so D/L = 1/8 exactly at the defaults in
  BOTH scenes.  PhET's two captions read 6.0e-10 m and 1.5e-13 m, a
  factor 4000 apart, while the two scenes are only 8.5x apart
  geometrically; the real gold atom is 20 600 nuclear diameters across.
  Those distortions are printed on the canvas.  The neutron count
  changes the drawn nucleus and nothing else — PhET's own model notes
  say so, and this file says so on the canvas.  PhET nudges a particle
  fired within 10.2 units of an atom's centre away from it (by 2.34 in
  the atomic scene, 10 in the nuclear one) because the algorithm is
  singular at b = 0; this file keeps the nudge and shows b = 0 properly
  in THE HYPERBOLA instead.  A particle is tracked only inside a box of
  the atom's own width, rotated to the particle's direction, which is
  PhET's own arrangement and is what keeps its entry quadratic
  well-posed over the whole slider space.  Outside that box the
  potential is taken to be zero, so a particle arrives at its asymptotic
  speed rather than the lower speed the Coulomb field would have given
  it, and is put on the hyperbola whose ASYMPTOTE is parallel to its
  direction rather than the one tangent to it: it therefore loses some
  speed and kinks by chi(phi_in) as it is picked up.  Both numbers are
  printed -- 13.4 % and up to 2.45 degrees at the defaults.

  NOT MODELLED
  ------------
  No quantum mechanics.  (The Coulomb cross section is the same
  classically, in Born approximation and exactly — a famous accident —
  but nothing here is a quantum calculation: no partial waves, no
  Mott identical-particle interference, no spin.)  No nuclear force:
  above about 25.6 MeV a head-on alpha reaches the gold nuclear
  surface and the 1/sin^4 law fails; the sim computes that energy and
  says so but does not model what replaces it.  No target recoil — the
  nucleus is infinitely heavy and everything is in the laboratory
  frame.  No energy loss in the foil, no multiple scattering in the
  drawn trajectories, no screening by the atomic electrons, no finite
  beam geometry.  Thomson's electrons are not deflectors here: a free
  electron can turn an alpha by at most asin(m_e/m_alpha) = 1.37e-4
  rad, which is the bound the historical argument uses.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  Constants: scipy.constants (CODATA 2022) — e, eps0, m_e, the alpha
  particle mass, N_A.  k e^2 = 1.43996 MeV fm is derived, never typed.
  Gold: Z = 79, A = 197 (gold is monoisotopic), molar mass 196.96657
  g/mol, density 19 300 kg/m^3, nuclear radius 1.2 A^(1/3) fm, metallic
  radius 1.44e-10 m.  PhET's values are read from the minified build
  1.1.29 in docs/phets/ (RSConstants, RSBaseModel, RutherfordAtom.
  moveParticle, RutherfordAtomSpace, Gun, and the two scale captions)
  and are labelled PhET's throughout.  The element names on the proton
  slider are PhET's own SHRED strings.  The Python twin is
  build/rutherford-scattering/derive.py and every reference number the
  suite asserts against is a line of its refvals.txt, emitted into
  p7_refs.js by make_refs.py — nothing is transcribed by hand.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  /* canvas has no markup: an exponent written 'x10^-14' draws the caret.
     Digit superscripts are safe in the rasteriser's font (letter ones are
     not -- Known-bad, greenhouse-effect), so build one. */
  if(a>=1e5||a<1e-4){
    const m=x.toExponential(n-1).split('e');
    const d='\u2070\u00b9\u00b2\u00b3\u2074\u2075\u2076\u2077\u2078\u2079';
    let e=parseInt(m[1],10), s=(e<0?'\u207b':'');
    for(const ch of String(Math.abs(e))) s+=d[+ch];
    return m[0]+'\u00d710'+s;
  }
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));

/* dsigma/dOmega straight from its definition, by differencing theta(b) */
function dsdoNumeric(th, D){
  const b = bOfTheta(th, D);
  if(!(b > 0)) return NaN;
  const hh = b * 1e-5;
  const dthdb = (thetaOfB(b + hh, D) - thetaOfB(b - hh, D)) / (2 * hh);
  if(!isFinite(dthdb) || dthdb === 0) return NaN;
  return Math.abs(b / Math.sin(th) / dthdb);
}

/* ================================================================== *
 *  Newton's equations, integrated -- the independent route            *
 *                                                                     *
 *  Unit mass, U(r)/m = alpha/r, so the acceleration is +alpha r/r^3    *
 *  and D = 2 alpha / v_inf^2.  Adaptive RK4: the substep count follows *
 *  the distance to the centre, and it is CAPPED, because a mutation    *
 *  sweep with no per-mutant timeout cannot survive an unbounded loop.  *
 * ================================================================== */
function coulombRHS(y, alpha){
  const r2 = y[0] * y[0] + y[1] * y[1];
  const r3 = r2 * Math.sqrt(r2);
  const f = alpha / r3;
  return [y[2], y[3], f * y[0], f * y[1]];
}
function rk4Step(y, hh, alpha){
  const k1 = coulombRHS(y, alpha);
  const y2 = [y[0] + 0.5 * hh * k1[0], y[1] + 0.5 * hh * k1[1],
              y[2] + 0.5 * hh * k1[2], y[3] + 0.5 * hh * k1[3]];
  const k2 = coulombRHS(y2, alpha);
  const y3 = [y[0] + 0.5 * hh * k2[0], y[1] + 0.5 * hh * k2[1],
              y[2] + 0.5 * hh * k2[2], y[3] + 0.5 * hh * k2[3]];
  const k3 = coulombRHS(y3, alpha);
  const y4 = [y[0] + hh * k3[0], y[1] + hh * k3[1], y[2] + hh * k3[2], y[3] + hh * k3[3]];
  const k4 = coulombRHS(y4, alpha);
  return [y[0] + hh * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) / 6,
          y[1] + hh * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) / 6,
          y[2] + hh * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]) / 6,
          y[3] + hh * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]) / 6];
}
/* integrate a trajectory from (b, -y0) with asymptotic speed 1, returning the
   path, the deflection, and the worst energy and angular-momentum drift */
function integrateOrbit(b, D, y0, nsteps){
  const alpha = D / 2;                       /* v_inf = 1, so D = 2 alpha */
  const N = Math.max(8, Math.min(200000, nsteps || 4000));
  /* start ON the conic at the radius whose y is -y0, so the integration and
     the closed form describe ONE orbit and not two nearby ones */
  const phi0 = phiAtRadius(Math.hypot(b, y0), b, D, false);
  const r0 = rOfPhi(phi0, b, D);
  const x = r0 * Math.sin(phi0), y = -r0 * Math.cos(phi0);
  const dr = drdPhi(phi0, b, D);
  let vx = dr * Math.sin(phi0) + r0 * Math.cos(phi0);
  let vy = -dr * Math.cos(phi0) + r0 * Math.sin(phi0);
  const nrm = Math.hypot(vx, vy), sp = Math.sqrt(Math.max(0, 1 - D / r0));
  vx = sp * vx / nrm; vy = sp * vy / nrm;
  let st = [x, y, vx, vy];
  const E0 = 0.5 * (vx * vx + vy * vy) + alpha / r0;
  const L0 = x * vy - y * vx;
  const T = 3.2 * y0;                        /* v_inf = 1, so t ~ distance */
  const pts = [x, y];
  const minSeg = y0 / 150;                   /* thin the drawn polyline    */
  let lx = x, ly = y, dE = 0, dL = 0;
  for(let i = 0; i < N; i++){
    const r = Math.hypot(st[0], st[1]);
    /* the step follows the distance to the centre: close in, the direction
       turns fast.  Capped both ways so the loop always terminates. */
    const hh = clamp(T / N, 1e-12, Math.max(1e-12, 0.02 * r));
    st = rk4Step(st, hh, alpha);
    const rr = Math.hypot(st[0], st[1]);
    const E = 0.5 * (st[2] * st[2] + st[3] * st[3]) + alpha / rr;
    const L = st[0] * st[3] - st[1] * st[2];
    dE = Math.max(dE, Math.abs(E - E0) / E0);
    dL = Math.max(dL, Math.abs(L - L0) / Math.abs(L0));
    if(Math.hypot(st[0] - lx, st[1] - ly) > minSeg){ pts.push(st[0], st[1]); lx = st[0]; ly = st[1]; }
    if(st[1] > y0 && rr > y0) break;
  }
  pts.push(st[0], st[1]);
  return {pts: pts, theta: Math.atan2(st[2], st[3]), rEnd: Math.hypot(st[0], st[1]),
          dE: dE, dL: dL, E0: E0, L0: L0, x: st[0], y: st[1]};
}
/* the exact hyperbola as a polyline in the same frame, for comparison */
function conicPath(b, D, rmax, n){
  const N = n || 240;
  const p0 = phiAtRadius(rmax, b, D, false), p1 = phiAtRadius(rmax, b, D, true);
  const out = [];
  for(let i = 0; i <= N; i++){
    const ph = p0 + (p1 - p0) * i / N;
    const r = rOfPhi(ph, b, D);
    if(!(r > 0) || !isFinite(r)) continue;
    out.push(r * Math.sin(ph), -r * Math.cos(ph));
  }
  return out;
}

/* ================================================================== *
 *  Thomson's atom: a uniform ball of charge +Ze of radius R with the   *
 *  electron charge on its surface, so the atom is NEUTRAL outside and  *
 *  the field inside is the ball's alone.  Then                         *
 *      U(r)/E = D (R^2 - r^2) / (2 R^3)   for r <= R,  0 outside,      *
 *  which is continuous at R, and the straight-line impulse gives       *
 *      theta(b) = D b sqrt(R^2 - b^2) / R^3,                           *
 *      theta_max = D/(2R) at b = R/sqrt2,   <theta^2> = D^2/(6 R^2).   *
 *  The electrons are not deflectors here: a FREE electron can turn an  *
 *  alpha by at most asin(m_e/m_alpha) = 1.37e-4 rad, which is the      *
 *  bound the historical argument uses.                                 *
 * ================================================================== */
function thomsonU(r, D, R){ return r >= R ? 0 : D * (R * R - r * r) / (2 * R * R * R); }
function thomsonTheta(b, D, R){
  if(b >= R || b < 0) return 0;
  return D * b * Math.sqrt(R * R - b * b) / (R * R * R);
}
function thomsonThetaMax(D, R){ return D / (2 * R); }
function thomsonTheta2Mean(D, R){ return D * D / (6 * R * R); }
/* the exact deflection integral in the same potential -- the independent
   route that says how good the impulse form is (its relative error is
   O(theta), measured, not assumed) */
function thomsonThetaExact(b, D, R, nseg){
  if(b >= R || b <= 0) return 0;
  return thetaQuad(b, r => thomsonU(r, D, R), nseg || 14);
}
/* a foil n t atoms per unit area deep: <theta^2> adds, so
   <theta^2>_total = n t int theta(b)^2 2 pi b db = n t pi D^2 / 6 */
function thomsonFoilTheta2(D, nt){ return nt * PI * D * D / 6; }
/* the projected multiple-scattering distribution is Gaussian in the plane, so
   P(theta > Th) = exp(-Th^2 / <theta^2>).  Return log10 of it: the number is
   far below the smallest double. */
function thomsonLog10P(Th, theta2){ return -Th * Th / theta2 / Math.LN10; }
/* the largest angle a free electron can give an alpha */
function electronMaxDeflection(){ return Math.asin(M_E / M_ALPHA); }

/* ================================================================== *
 *  PhET's scaled model, read out of rutherford-scattering 1.1.29      *
 *                                                                     *
 *  RSConstants        MIN/MAX/DEFAULT_ALPHA_ENERGY  50 / 100 / 80     *
 *                     MIN/MAX/DEFAULT_PROTON_COUNT  20 / 100 / 79     *
 *                     MIN/MAX/DEFAULT_NEUTRON_COUNT 20 / 150 / 118    *
 *                     SPACE_NODE_WIDTH 510, DEFAULT_SHOW_TRACES false *
 *  RSBaseModel        bounds = +- SPACE_NODE_WIDTH/4 = +- 127.5       *
 *  RutherfordAtomSpace   five atoms, atomWidth 30                     *
 *  RutherfordNucleusSpace one atom, width = the whole bounds          *
 *  RutherfordAtom.moveParticle  D = (L/8)(p/79)(80^2/s0^2)            *
 *  Gun.step           one particle every bounds.width/energy/20 s     *
 *                                                                     *
 *  Note what that D means.  PhET's slider is LABELLED Energy and used  *
 *  as the particle's SPEED, and D goes as 1/speed^2 -- which is the    *
 *  right 1/E scaling.  Writing D = 2 alpha / s0^2 makes the Coulomb    *
 *  strength alpha = 400 L (p/79) independent of the speed, as it must  *
 *  be: the field does not know how fast the projectile is going.       *
 * ================================================================== */
const PHET = {
  version: '1.1.29',
  minEnergy: 50, maxEnergy: 100, defEnergy: 80,
  minProtons: 20, maxProtons: 100, defProtons: 79,
  minNeutrons: 20, maxNeutrons: 150, defNeutrons: 118,
  boxW: 255,                       /* SPACE_NODE_WIDTH/2                 */
  atomW: 30,                       /* RutherfordAtomSpace                */
  gunRateDiv: 20,                  /* Gun.step: width/energy/20          */
  nudgeWindow: 0.04,               /* of the bounds width                */
  nudgeLo: 2, nudgeHi: 10,         /* LinearFunction(20, 255, 2, 10):    */
  nudgeW0: 20, nudgeW1: 255,       /* 2 units at width 20, 10 at 255     */
  showTraces: false,
  atomicScaleM: 6.0e-10,           /* its "{0} m (atomic scale)" caption */
  nuclearScaleM: 1.5e-13,          /* its "{0} m (nuclear scale)"        */
  nucleonR: 3,                     /* RutherfordNucleus nucleonRadius    */
};
/* the Coulomb strength of one PhET atom, in model units^3/s^2 */
function phetAlpha(L, protons){ return 400 * L * (protons / PHET.defProtons); }
/* and its head-on distance at gun speed s0 -- algebraically PhET's own
   (L/8)(p/79)(80/s0)^2, which selfTest asserts both ways */
function phetD(L, protons, s0){ return 2 * phetAlpha(L, protons) / (s0 * s0); }
function phetDDirect(L, protons, s0){
  return (L / 8) * (protons / PHET.defProtons) * (PHET.defEnergy * PHET.defEnergy / (s0 * s0));
}
function phetGunPeriod(s0){ return PHET.boxW / s0 / PHET.gunRateDiv; }
/* PhET pushes a particle fired within 4% of the bounds width of an atom's
   centre further away from it, because its algorithm is singular at b = 0 */
function phetNudge(atomW){
  return PHET.nudgeLo + (atomW - PHET.nudgeW0)
       / (PHET.nudgeW1 - PHET.nudgeW0) * (PHET.nudgeHi - PHET.nudgeLo);
}

/* ================================================================== *
 *  mulberry32 -- the seeded stream, reproduced bit for bit in Python   *
 *  (derive.py prints its first draws and selfTest asserts them)        *
 * ================================================================== */
function mulberry32(seed){
  let a = seed | 0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ================================================================== *
 *  a seeded beam: b uniform on a DISC of radius bmax (a real beam),    *
 *  binned in solid angle, which must reproduce dsigma/dOmega.          *
 *  The gun in the live views fires along a LINE instead, whose         *
 *  fraction beyond theta is b(theta)/X rather than (b(theta)/bmax)^2.  *
 * ================================================================== */
function sampleBeam(n, bmax, D, seed){
  const rng = mulberry32(seed), th = new Float64Array(n);
  for(let i = 0; i < n; i++) th[i] = thetaOfB(bmax * Math.sqrt(rng()), D);
  return th;
}
function fractionBeyond(th, t0){
  let c = 0;
  for(let i = 0; i < th.length; i++) if(th[i] > t0) c++;
  return c / th.length;
}
/* bin edges in theta -> the sampled dsigma/dOmega, with the exact bin average
   beside it and the Poisson sigma the comparison is allowed */
function binBeam(th, edges, bmax, D){
  const out = [];
  for(let i = 0; i < edges.length - 1; i++){
    const lo = edges[i], hi = edges[i + 1];
    let c = 0;
    for(let k = 0; k < th.length; k++) if(th[k] > lo && th[k] <= hi) c++;
    const dom = TAU * (Math.cos(lo) - Math.cos(hi));
    const dens = c / (th.length * dom) * (PI * bmax * bmax);
    const exact = (sigmaBeyond(lo, D) - sigmaBeyond(hi, D)) / dom;
    out.push({lo: lo, hi: hi, n: c, dens: dens, exact: exact,
              sigma: c > 0 ? 1 / Math.sqrt(c) : Infinity});
  }
  return out;
}

/* ------------------------------------------------------------------ *

 *    RutherfordNucleusSpace  one atom at the origin, box = the bounds  *
 *    RutherfordAtomSpace     five atoms of width 30 at (-n/2, +n/2),   *
 *                            (+n/2, +n/2), (0, -n/2), (-n, -n/2),      *
 *                            (+n, -n/2) with n = bounds.width/2        *
 * ------------------------------------------------------------------ */
const HALF_BOX = PHET.boxW / 2;

    return [{x: -s, y: s, L: PHET.atomW}, {x: s, y: s, L: PHET.atomW},

  return [];                    /* PhET's plum-pudding space has NO atoms */

const RUN = {t: 0, ticks: 0, fired: 0, left: 0, sinceFire: 0, acc: 0, rng: null,

function engineReset(st){

  RUN.rng = mulberry32(st.seed | 0);

function newParticle(x, y, vx, vy){
  return {x: x, y: y, vx: vx, vy: vy, ai: -1, lastA: -1, b: 0, D: 0, phi: 0,
          ix: 1, iy: 0, jx: 0, jy: 1, vinf: 0, trail: [x, y], b0: 0, th0: 0,
          chi0: 0, hit: 0, rIn: 0, rOut: 0};
}
/* PhET's Gun fires one particle every bounds.width/energy/20 seconds at a
   uniformly random x, then pushes it AWAY from any atom whose centre it came
   within 4% of the bounds width of -- because the trajectory algorithm is
   singular at b = 0.  (PhET spends two random draws on the sign and the
   magnitude; one draw has the same distribution and is what this uses.) */
function gunFire(st, atoms){
  let x = (2 * RUN.rng() - 1) * HALF_BOX;
  const win = PHET.nudgeWindow * PHET.boxW;
  for(let i = 0; i < atoms.length; i++){
    const a = atoms[i];
    if(Math.abs(x - a.x) < win){
      const c = phetNudge(a.L);
      x = x > a.x ? x + c : x - c;
    }
  }
  const p = newParticle(x, -HALF_BOX, 0, st.energy);
  RUN.ps.push(p); RUN.fired++;
  return p;
}

/* the (i, j) frame of an atom for a particle moving along j: j is the
   direction of travel, i points at the side the particle is offset to */
function frameOf(p, a){
  const v = Math.hypot(p.vx, p.vy) || 1;
  const jx = p.vx / v, jy = p.vy / v;
  const nx = jy, ny = -jx;                    /* v rotated by -90 degrees */
  const rx = p.x - a.x, ry = p.y - a.y;
  return {jx: jx, jy: jy, nx: nx, ny: ny,
          X: rx * nx + ry * ny, Y: rx * jx + ry * jy, r: Math.hypot(rx, ry)};
}
function insideBox(f, L){ return Math.abs(f.X) <= L / 2 && Math.abs(f.Y) <= L / 2; }
/* once a particle is ON an orbit its velocity has turned, so the release test
   must use the frame the orbit was SET UP in, not a fresh one built from the
   current velocity: reading the box in the rotated frame let particles leave
   and re-enter the same atom on alternate ticks. */
function frameXY(p, a){
  const rx = p.x - a.x, ry = p.y - a.y;
  return {X: rx * p.ix + ry * p.iy, Y: rx * p.jx + ry * p.jy, r: Math.hypot(rx, ry)};
}

/* PhET's entry quadratic: the hyperbola with asymptotic speed s0 whose
   asymptote is parallel to the entry direction and which passes through the
   entry point has  b^2 - X0 b + (D/2)(Y0 + r0) = 0.  On the rotated SQUARE
   PhET uses, the discriminant is positive over the whole slider space; the
   clamp below is a guard, and the model counts how often it fires. */
function captureOrbit(p, a, ai, st){
  const f = frameOf(p, a);
  const X0 = Math.abs(f.X), sgn = f.X >= 0 ? 1 : -1;
  const D = phetD(a.L, st.protons, st.energy);
  let disc = X0 * X0 - 2 * D * (f.Y + f.r);
  if(!(disc > 0)){ disc = 0; RUN.clamps++; }
  const b = Math.max(1e-6, 0.5 * (X0 + Math.sqrt(disc)));
  p.ai = ai; p.b = b; p.D = D; p.vinf = st.energy;
  p.phi = Math.atan2(X0, -f.Y);
  p.ix = sgn * f.nx; p.iy = sgn * f.ny; p.jx = f.jx; p.jy = f.jy;
  if(p.b0 === 0){ p.b0 = b; p.th0 = thetaOfB(b, D); p.chi0 = velAngle(p.phi, b, D); p.rIn = f.r; }
  placeOnOrbit(p, a);
}
/* The velocity's angle from the incoming asymptote, at polar angle phi.
   Differentiating the conic, the b^2/den^2 factor cancels out of the ratio
   and everything collapses to
       dX/dphi : dY/dphi  =  (D/2)(1 - cos phi) : b - (D/2) sin phi,
   which has no singularity at phi = 0 (where the radius is infinite and the
   first version returned NaN) and no cancellation anywhere.  The versine is
   written as 2 sin^2(phi/2), which is the only form with any correct digits
   near phi = 0 (Known-bad, brachistochrone).  selfTest checks it against the
   brute-force derivative and against chi(phi_inf) = theta. */
function velAngle(phi, b, D){
  const s = Math.sin(phi / 2);
  return Math.atan2(D * s * s, b - 0.5 * D * Math.sin(phi));
}
function placeOnOrbit(p, a){
  const r = rOfPhi(p.phi, p.b, p.D);
  const X = r * Math.sin(p.phi), Y = -r * Math.cos(p.phi);
  p.x = a.x + p.ix * X + p.jx * Y;
  p.y = a.y + p.iy * X + p.jy * Y;
  const chi = velAngle(p.phi, p.b, p.D);
  const sp = p.vinf * Math.sqrt(Math.max(0, 1 - p.D / r));
  const cx = Math.sin(chi), cy = Math.cos(chi);
  p.vx = sp * (p.ix * cx + p.jx * cy);
  p.vy = sp * (p.iy * cx + p.jy * cy);
}
/* advance phi by RK4 on dphi/dt = v_inf b / r^2 -- angular momentum, which is
   the same number as PhET's arc-length form (asserted).  The substep count
   follows the angle swept and is CAPPED: a mutation sweep has no per-mutant
   timeout, so every loop here must terminate. */
function advanceOrbit(p, a, dt){
  const phiMax = phiInfOf(p.b, p.D) * (1 - 1e-9);
  const f = ph => {
    const r = rOfPhi(ph, p.b, p.D);
    return (r > 0 && isFinite(r)) ? p.vinf * p.b / (r * r) : 0;
  };
  const est = f(p.phi) * dt;
  const n = clamp(Math.ceil(Math.abs(est) / 0.02), 1, 64);
  const hh = dt / n;
  for(let i = 0; i < n; i++){
    const k1 = f(p.phi);
    const k2 = f(Math.min(phiMax, p.phi + 0.5 * hh * k1));
    const k3 = f(Math.min(phiMax, p.phi + 0.5 * hh * k2));
    const k4 = f(Math.min(phiMax, p.phi + hh * k3));
    p.phi += hh * (k1 + 2 * k2 + 2 * k3 + k4) / 6;
    if(p.phi >= phiMax){ p.phi = phiMax; break; }
  }
  placeOnOrbit(p, a);
}
/* Thomson's ball: the whole deflection happens as the particle crosses, and
   at the real D/R it is 1e-4 rad.  exagg multiplies it so the wiggle can be
   seen, and the factor is printed on the canvas. */
function puddingKick(p, st){
  const R = HALF_BOX;
  const b = Math.abs(p.x);
  if(b >= R) return;
  /* call the pinned closed form rather than writing theta(b) out a second
     time: the duplicate let a mutant drop the square root and survive a
     102-mutant sweep (Known-bad, the drum's group velocity three times).
     With D_model = (D/R) R the two are the same number by construction. */
  const Dm = realDoverR(st) * R;
  const th = thomsonTheta(b, Dm, R) * st.exagg;
  /* AWAY from the ball: a positive ball repels a positive alpha, so a
     particle crossing at +b leaves with a +x component.  The first version
     used the counter-clockwise rotation matrix and pushed both sides INWARD
     -- an attractive Thomson atom -- and no bound on the deflection SIZE
     could see it, because the size is the same either way. */
  const s = p.x >= 0 ? 1 : -1;
  const c = Math.cos(s * th), sn = Math.sin(s * th);
  const vx = p.vx * c + p.vy * sn, vy = -p.vx * sn + p.vy * c;
  p.vx = vx; p.vy = vy; p.hit = 1;
}
/* the real, dimensionless strength of a Thomson atom: D/R with D from the
   proton count and the alpha energy in MeV, R the gold metallic radius */
function realD(st){ return coulombD(2, st.protons, st.EMeV * MEV); }
function realDoverR(st){ return realD(st) / GOLD.rAtom; }

function stepOne(st, dt){
  const atoms = atomsFor(st.view);
  /* the gun */
  if(st.gunOn){
    RUN.sinceFire += dt;
    const per = phetGunPeriod(st.energy);
    let guard = 0;
    while(RUN.sinceFire >= per && RUN.ps.length < 160 && guard++ < 8){
      gunFire(st, atoms);
      RUN.sinceFire -= per;
    }
    if(RUN.sinceFire > per) RUN.sinceFire = per;
  }
  const keep = [];
  for(let k = 0; k < RUN.ps.length; k++){
    const p = RUN.ps[k];
    if(p.ai >= 0){
      const a = atoms[p.ai];
      advanceOrbit(p, a, dt);
      if(!insideBox(frameXY(p, a), a.L) || p.phi >= phiInfOf(p.b, p.D) * (1 - 1e-8)){
        p.lastA = p.ai; p.ai = -1;
        p.rOut = Math.hypot(p.x - a.x, p.y - a.y);
      }
    } else {
      const wasY = p.y;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if(st.view === 'pudding' && wasY < 0 && p.y >= 0) puddingKick(p, st);
      for(let i = 0; i < atoms.length; i++){
        if(i === p.lastA) continue;
        if(insideBox(frameOf(p, atoms[i]), atoms[i].L)){ captureOrbit(p, atoms[i], i, st); break; }
      }
    }
    if(st.traces){
      const n = p.trail.length;
      if(n < 2 || Math.hypot(p.x - p.trail[n - 2], p.y - p.trail[n - 1]) > 1.2){
        p.trail.push(p.x, p.y);
        if(p.trail.length > 2 * TRAIL_MAX) p.trail.splice(0, 2);
      }
    }
    const M = HALF_BOX * 1.02;
    if(p.x < -M || p.x > M || p.y > M || p.y < -M * 1.2){
      const th = Math.abs(Math.atan2(p.vx, p.vy));
      RUN.maxTheta = Math.max(RUN.maxTheta, th);
      RUN.hist[clamp(Math.floor(th / PI * NHIST), 0, NHIST - 1)]++;
      RUN.left++;
    } else keep.push(p);
  }
  RUN.ps = keep;
  RUN.t += dt; RUN.ticks++;
}
/* The leftover has to ACCUMULATE.  Flooring dtWall/DT_TICK each frame throws
   it away, and a browser frame is 16.6 ms against a 16.67 ms tick, so the
   floor is zero on most frames and the sim crawls or stops outright. */
function engineAdvance(st, dtWall){
  if(RUN.key !== engineKey(st)) engineReset(st);
  RUN.acc = Math.min(0.2, RUN.acc + Math.max(0, dtWall) * st.rate);
  let n = 0;
  while(RUN.acc >= DT_TICK && n < 6){ stepOne(st, DT_TICK); RUN.acc -= DT_TICK; n++; }
  return n;
}
function engineStepOnce(st){
  if(RUN.key !== engineKey(st)) engineReset(st);
  stepOne(st, DT_TICK);
}

 *  the analysis the views read                                        *

/* the drawn turn of one hyperbola tracked only between radii r_in and r_out:
   the asymptote is reached only at infinity, so a tracked arc delivers
   theta - chi(in) - (theta - chi(out)) of it */
function drawnTurn(b, D, rIn, rOut){
  const p0 = phiAtRadius(rIn, b, D, false), p1 = phiAtRadius(rOut, b, D, true);
  return velAngle(p1, b, D) - velAngle(p0, b, D);
}
function beamSample(st){
  const D = phetD(PHET.boxW, st.protons, st.energy);
  const key = [st.nSample, st.bMax, D, st.seed].join('|');
  return memo('beam', key, () => {
    const th = sampleBeam(st.nSample | 0, st.bMax, D, st.seed | 0);
    const edges = [];
    const lo = Math.log(thetaOfB(st.bMax, D)), hi = Math.log(PI);
    for(let i = 0; i <= 14; i++) edges.push(Math.exp(lo + (hi - lo) * i / 14));

function goldNumbers(st){
  const key = [st.protons, st.EMeV, st.foilNm].join('|');

    const E = st.EMeV * MEV;
    const D = coulombD(2, st.protons, E);
    const A = st.protons === GOLD.Z ? GOLD.A : Math.round(2.5 * st.protons);
    const Rn = nuclearRadius(A), Ra = nuclearRadius(4);
    const n = numberDensity(GOLD.rho, GOLD.molar);

    const th2 = thomsonFoilTheta2(D, nt);

      E: E, D: D, a: D / 2, A: A, Rnuc: Rn, Ralpha: Ra, n: n, t: t, nt: nt,
      bt90: bOfTheta(PI / 2, D), rmin0: D, rminA: rminOfB(D / 2, D),
      Etouch: KE * 2 * st.protons * E_Q * E_Q / (Rn + Ra),

/* A particle is picked up on the hyperbola whose ASYMPTOTE is parallel to
   its direction, not on the one tangent to it, so its own direction steps by
   chi(phi_in) at that moment -- PhET's algorithm does the same thing.  The
   step is largest for the particle fired at the edge of the beam, where b is
   largest; this returns that worst case so the canvas can print it instead of
   guessing at it. */
function pickupKink(L, D){
  const x0 = L / 2, y0 = -L / 2, r0 = Math.hypot(x0, y0);
  const disc = Math.max(0, x0 * x0 - 2 * D * (y0 + r0));
  const b = Math.max(1e-9, 0.5 * (x0 + Math.sqrt(disc)));

function buildModel(){
  const st = ST;
  const atoms = atomsFor(st.view);
  const L = st.view === 'foil' ? PHET.atomW : PHET.boxW;
  const D = phetD(L, st.protons, st.energy);
  const alpha = phetAlpha(L, st.protons);
  const bmin = Math.max(1e-9, phetNudge(L));
  const M = {
    view: st.view, st: st, atoms: atoms, L: L, D: D, alpha: alpha,
    Ddirect: phetDDirect(L, st.protons, st.energy),
    thMaxPhet: thetaOfB(bmin, D),
    bAt90: bOfTheta(PI / 2, D),
    speedStep: 1 - Math.sqrt(Math.max(0, 1 - D / (L / 2))),
    kinkMax: pickupKink(L, D),
    element: elementName(st.protons),
    nucleons: st.protons + st.neutrons,
    gunPeriod: phetGunPeriod(st.energy),

    /* the hyperbola view */

    /* real units */
    gold: goldNumbers(st),

    pudding: ['<span class="lhs">&theta;<sub>max</sub></span> = <span class="hl">D</span> / 2R'
      + ' &nbsp;&nbsp; &#8249;&theta;&sup2;&#8250; = D&sup2;/6R&sup2;',
      'a uniform ball of charge cannot turn an alpha by more than this, however you aim it.'],
    hyperbola: ['<span class="lhs">b</span> = (D/2) cot(&theta;/2) &nbsp;&nbsp; '
      + '<span class="lhs">r<sub>min</sub></span> = (D/2)[1 + <span class="hl">cosec</span>(&theta;/2)]',
      'the impact parameter, the scattering angle and the closest approach are one relation seen three ways.'],
    sigma: ['<span class="lhs">d&sigma;/d&Omega;</span> = (b/sin&theta;)|db/d&theta;| = '
      + '<span class="hl">(D/4)&sup2;</span> / sin<sup>4</sup>(&theta;/2)',
      'the cross section is a Jacobian: how much beam area lands in how much solid angle.'],
    gold: ['<span class="lhs">N(&gt;&theta;)/N</span> = n t &pi; b(&theta;)&sup2; = '
      + 'n t &pi; <span class="hl">(D/2)&sup2;</span> cot&sup2;(&theta;/2)',
      'the fraction of a beam turned past &theta; by a foil n t atoms per unit area thick.'],
  }[M.view];
  return E[0] + '<span class="sm">' + E[1] + '</span>';
}
function tagHTML(M){
  const st = M.st;
  if(M.view === 'nucleus')
    return '<b>' + fmt(st.protons, 0) + ' protons</b> &middot; gun energy ' + fmt(st.energy, 0)
      + ' &middot; D = ' + fmt(M.D, 2) + ' model units';
  if(M.view === 'foil')
    return '<b>five atoms</b> &middot; D = ' + fmt(M.D, 3) + ' in a box of ' + fmt(PHET.boxW, 0);
  if(M.view === 'pudding')
    return '<b>Thomson&rsquo;s atom</b> &middot; deflection drawn &times;' + fmt(st.exagg, 0)
      + ' &middot; true &theta;max = ' + sigf(M.gold.thMax, 2) + ' rad';
  if(M.view === 'hyperbola')
    return '<b>b = ' + fmt(M.bSel, 2) + '</b> &middot; &theta; = ' + deg(M.thSel)
      + ' &middot; e = ' + fmt(M.eccSel, 3);
  if(M.view === 'sigma')
    return '<b>' + fmt(st.nSample, 0) + ' particles</b> &middot; b &le; ' + fmt(st.bMax, 0)
      + ' &middot; seed ' + fmt(st.seed, 0);
  return '<b>alpha on ' + (M.element || ('Z = ' + st.protons)) + '</b> &middot; '
    + fmt(st.EMeV, 2) + ' MeV &middot; ' + fmt(st.foilNm, 0) + ' nm foil';
}
/* ================================================================== *
 *  drawing helpers, extracted verbatim from the landed                *
 *  models-of-the-hydrogen-atom build by extract_helpers.py: this is    *
 *  where this collection keeps its accumulated layout fixes (the       *
 *  bottom-up stage layout, the label registry and its half-pixel       *
 *  overlap rule, the #hint reservation, the axis clearances).          *
 * ================================================================== */
/* the floating readout covers the top right of the stage (about 300 x 550),
   and the HTML #hint owns the bottom-left corner (bottom:11px, 11px type), so
   every view keeps canvas text out of both (Known-bad, twice). */
const HINT_W = 340, HINT_H = 27;
function usableW(W){ return Math.max(320, W - RO_W - 34); }

/* lay the stage out from the BOTTOM up: measure the caption first, give the
   picture whatever is left (Known-bad: wrapped text has no fixed height).
   The HTML #hint is drawn at bottom:11px in 11 px type and the canvas capture
   cannot see it, so the caption's LAST line has to clear it: HINT_H of extra
   bottom margin, asserted in selfTest (Known-bad, wave-on-a-string). */
function layout(ctx, W, H, full, short){
  /* a narrow stage has to keep 300 px for the picture, or the long caption
     eats the stack and the bottom panel's axis title lands on it */
  /* the caption is capped at the USABLE width, which is the part of the stage
     the floating readout does not cover; at the full stage width it ran under
     the readout at every size below 1400 px */
  const f = fitCaption(ctx, W, H - HINT_H, full, short, usableW(W),
                       stageTop() + (narrowStage(W) ? 300 : 120));
  return {top: stageTop(), capY: f.capY, capW: f.capW, txt: f.txt,
          bot: f.capY - 12, W, H};
}
/* a stage narrower than this cannot carry two panels side by side (the
   floating readout already owns 300 px of it) — every two-panel view stacks
   instead (Known-bad: two-column layouts collapse below ~430 px of column) */
function narrowStage(W){ return usableW(W) < 430; }
/* axes() puts tick labels at +5 and the x-axis title at +21 below the
   frame, in 11 px type: 38 px of clearance under every plot box. */
const AXIS_BOT = 38;
/* how many y ticks a panel of this height can label without the labels
   touching: a 10.5 px label is ~12 px tall, so five ticks need 60 px of frame
   (Known-bad: tick label size follows the tick SPACING) */
function nyFor(h){ return h < 90 ? 2 : (h < 140 ? 3 : 5); }
function drawCaption(ctx, L){
  const lines = wrapText(ctx, L.txt, L.capW, '11.5px -apple-system, sans-serif');
  LABEL_RECTS.push({x: 18, y: L.capY, w: L.capW, h: lines.length * 14});
  caption(ctx, 18, L.capY, L.txt, L.capW, '#767e92');
}
/* two stacked panels that ALWAYS leave AXIS_BOT under the lower one: the
   square shrinks until the plot below it fits, rather than the plot's height
   being clamped and its x-axis title pushed onto the caption */
function stackFit(top, bot, gap, share){
  let side = Math.max(90, Math.min((bot - top) * (share || 0.46), bot - top));
  let bh = bot - AXIS_BOT - (top + side + gap);
  if(bh < 72){ side = Math.max(70, side - (72 - bh)); bh = bot - AXIS_BOT - (top + side + gap); }
  return {side, bh: Math.max(46, bh)};
}
function panelTitle(ctx, b, t){
  LABEL_RECTS.push(labelRect(ctx, b.x, b.y - 9, t, 'italic 13px Georgia, serif', 'left', 'bottom'));
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#aeb6c6';
  ctx.font = 'italic 13px Georgia, serif';
  ctx.fillText(plain(t), b.x, b.y - 9);
}
/* every label this file draws records its rectangle; labelIfClear() then
   refuses to draw one that would land on an existing rectangle, so a crowded
   picture DROPS labels instead of stacking them.  Cleared per draw. */
let LABEL_RECTS = [];
function labelRect(ctx, x, y, t, font, align, base){
  ctx.font = font || '11px -apple-system, sans-serif';
  const w = ctx.measureText(plain(t)).width;
  const mm = /([\d.]+)px/.exec(ctx.font), fs = mm ? parseFloat(mm[1]) : 10, fh = fs * 1.15;
  const lx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
  const ly = base === 'top' ? y : (base === 'middle' ? y - fh / 2
    : (base === 'bottom' ? y - fh : y - fh * 0.8));
  return {x: lx, y: ly, w, h: fh};
}
/* half a pixel, which is tools/audit.py's threshold.  A 2 px tolerance passed
   the inline sweep and failed the audit on the same picture (Known-bad), and a
   2 px graze is visible antialiased smear on canvas. */
function rectsHit(a, b){
  return Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > 0.5
      && Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > 0.5;
}
function label(ctx, x, y, t, col, font, align, base){
  LABEL_RECTS.push(labelRect(ctx, x, y, t, font, align, base));
  ctx.fillStyle = col || '#8b93a6';
  ctx.font = font || '11px -apple-system, sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'top';
  ctx.fillText(plain(t), x, y);
}
function labelIfClear(ctx, x, y, t, col, font, align, base){
  const r = labelRect(ctx, x, y, t, font, align, base);
  for(const q of LABEL_RECTS) if(rectsHit(r, q)) return false;
  /* the shared legendBox() draws its own text and records it in LEGEND_RECTS,
     not in the label registry — check both, or a dodging label lands on a
     legend (a z score did exactly that at 820x520) */
  for(const q of LEGEND_RECTS) if(rectsHit(r, q)) return false;
  label(ctx, x, y, t, col, font, align, base);
  return true;
}
/* a label beside a vertical rule on a ruler-style strip: it picks the side
   with room INSIDE the panel first (a label that only dodges what it collides
   with still runs off the canvas -- "PhET's atomic-scale caption" ended at
   x = 597 on a 560 px stage), then falls back to the other side, then is
   dropped. */
function sideLabel(ctx, b, x, y, t, col){
  const w = labelRect(ctx, x, y, t, '10px -apple-system, sans-serif', 'left', 'top').w;
  const leftFirst = (x + 4 + w > b.x + b.w);
  const a = leftFirst ? ['right', 'left'] : ['left', 'right'];
  for(const al of a){
    const xx = al === 'left' ? x + 4 : x - 4;
    if(al === 'left' && xx + w > b.x + b.w) continue;
    if(al === 'right' && xx - w < b.x) continue;
    if(labelIfClear(ctx, xx, y, t, col, '10px -apple-system, sans-serif', al, 'top')) return true;
  }
  return false;
}
function disc(ctx, x, y, r, col){
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function ring(ctx, x, y, r, col, lw, dash){
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.restore();
}

/* ================================================================== *
 *  the live stage: PhET's two Rutherford scenes and its plum pudding  *
 * ================================================================== */
/* the model box is 255 x 255 in PhET's units with y UP (its gun sits at the
   minimum y and fires along +y).  mapBox returns the screen transform. */
function mapBox(x0, y0, side){
  const s = side / PHET.boxW;
  return {
    s: s, x0: x0, y0: y0, side: side,
    X: mx => x0 + side / 2 + mx * s,
    Y: my => y0 + side / 2 - my * s,
  };
}
/* the square stage: a box, a census strip under it, the caption under that */
function liveGeo(ctx, W, H, M){
  const L = layout(ctx, W, H, liveCaption(M), liveCaptionShort(M));
  const avoid = W > 880 ? RO_W + 26 : 10;
  const areaX = 12, areaW = Math.max(180, W - 24 - avoid);
  /* the gun sits BELOW the box, because PhET's gun fires from the minimum y
     of the model bounds, so the square has to give up a band for it -- the
     first version drew the gun label into the census strip and the caption at
     every size under 900 px */
  const gunH = 22;
  const stripH = (L.bot - L.top) > 360 ? 70 : 0;
  const side = Math.max(120, Math.min(areaW, L.bot - L.top - gunH - (stripH ? stripH + 30 : 0)));
  const bx = areaX + (areaW - side) / 2;
  const g = mapBox(bx, L.top, side);
  const strip = stripH ? box(bx, L.top + side + gunH + 26, side, stripH - 26) : null;
  return {L: L, g: g, strip: strip, side: side, gunH: gunH};
}

/* --- the drawn atom --------------------------------------------------- *
 *  Nucleons on a sunflower (Vogel) spiral: r = c sqrt(k), theta = k x the
 *  golden angle.  Deterministic, needs no table, and packs at constant
 *  density -- PhET builds its nucleus in rings instead, which is the same
 *  idea with a hand-written ring rule.                                     */
const GOLDEN_ANGLE = PI * (3 - Math.sqrt(5));
function nucleonLayout(nP, nN){
  const n = nP + nN, out = [];
  for(let k = 0; k < n; k++){
    const r = Math.sqrt(k + 0.5), a = k * GOLDEN_ANGLE;
    /* alternate the species along the spiral so neither ends up in a shell */
    out.push({x: r * Math.cos(a), y: r * Math.sin(a), p: (k % 2 === 0) === (nP >= nN)});
  }
  /* exactly nP protons: walk the list and fix the count */
  let want = nP, have = 0;
  for(const q of out) if(q.p) have++;
  for(let i = 0; i < out.length && have !== want; i++){
    if(have > want && out[i].p){ out[i].p = false; have--; }
    else if(have < want && !out[i].p){ out[i].p = true; have++; }
  }
  return out;
}
/* clip a world-space polyline to the model box, in DATA space: a canvas
   ctx.clip() would fix the browser and NOT the display-list audit, which
   records clip() as a no-op (Known-bad).  Liang-Barsky, crossings kept. */
function strokeBoxed(ctx, g, pts){
  const B = PHET.boxW / 2;
  ctx.beginPath();
  let started = false;
  for(let i = 0; i + 3 < pts.length; i += 2){
    const X0 = pts[i], Y0 = pts[i + 1], X1 = pts[i + 2], Y1 = pts[i + 3];
    if(!isFinite(X0) || !isFinite(Y0) || !isFinite(X1) || !isFinite(Y1)){ started = false; continue; }
    let t0 = 0, t1 = 1, out = false;
    const dx = X1 - X0, dy = Y1 - Y0;
    const P = [-dx, dx, -dy, dy], Q = [X0 + B, B - X0, Y0 + B, B - Y0];
    for(let k = 0; k < 4 && !out; k++){
      if(P[k] === 0){ if(Q[k] < 0) out = true; continue; }
      const t = Q[k] / P[k];
      if(P[k] < 0){ if(t > t1) out = true; else if(t > t0) t0 = t; }
      else { if(t < t0) out = true; else if(t < t1) t1 = t; }
    }
    if(out || t0 > t1){ started = false; continue; }
    if(t0 > 0) started = false;
    if(!started){ ctx.moveTo(g.X(X0 + t0 * dx), g.Y(Y0 + t0 * dy)); started = true; }
    ctx.lineTo(g.X(X0 + t1 * dx), g.Y(Y0 + t1 * dy));
    if(t1 < 1) started = false;
  }
  ctx.stroke();
}
function drawNucleus(ctx, g, ax, ay, nP, nN, rPix){
  /* below about 8 px the nucleons are sub-pixel and average to mud: draw the
     nucleus as what it is at that scale, a point with a ring round it */
  if(rPix < 8){
    disc(ctx, g.X(ax), g.Y(ay), Math.max(1.6, rPix * 0.55), COL.proton);
    ring(ctx, g.X(ax), g.Y(ay), Math.max(2.6, rPix), rgba(COL.proton, 0.5), 1);
    return;
  }
  const lay = nucleonLayout(nP, nN);
  const span = Math.sqrt(lay.length) + 1;
  const sc = rPix / span;
  const cx = g.X(ax), cy = g.Y(ay);
  for(const q of lay) disc(ctx, cx + q.x * sc, cy + q.y * sc,
                           Math.max(1, sc * 0.95), q.p ? COL.proton : COL.neutron);
}
/* the gun lives in the band under the box; its label goes beside it and is
   DROPPED if there is no room, rather than stacking on the strip below */
/* one place, because the labels of the analytic overlay have to keep clear
   of the nucleus and a second copy of this expression would drift from it
   (Known-bad: the drum's group velocity, written out three times) */
function nucleusPix(view, halfPix){
  return view === 'foil' ? Math.max(3, halfPix * 0.16) : Math.max(8, halfPix * 0.085);
}
function drawGun(ctx, g, on){
  const x = g.X(0), y = g.Y(-PHET.boxW / 2);
  ctx.fillStyle = on ? shade(COL.live, 0.8) : '#2a2f3d';
  ctx.fillRect(x - 12, y + 3, 24, 15);
  ctx.fillStyle = '#1e222c'; ctx.fillRect(x - 4, y - 2, 8, 6);
  labelIfClear(ctx, x + 17, y + 4, on ? 'the gun, firing' : 'the gun, off',
    COL.dim, '10px -apple-system, sans-serif', 'left', 'top');
}
function drawParticles(ctx, g, M){
  const st = M.st;
  if(st.traces){
    ctx.save(); ctx.strokeStyle = rgba(COL.live, 0.34); ctx.lineWidth = 1;
    for(const p of RUN.ps){
      if(p.trail.length < 4) continue;
      strokeBoxed(ctx, g, p.trail);
    }
    ctx.restore();
  }
  /* everything is clipped to the box: a particle thrown back down the beam
     line leaves through the bottom and was being drawn over the gun and the
     census strip (Known-bad: everything inside a plot box gets clipped) */
  const B = PHET.boxW / 2;
  for(const p of RUN.ps){
    if(Math.abs(p.x) > B || Math.abs(p.y) > B) continue;
    alphaGlyph(ctx, g.X(p.x), g.Y(p.y), clamp(g.s * 1.5, 1.8, 3.4));
  }
}
/* an alpha particle: two protons and two neutrons, PhET's own composition,
   drawn as a four-lobed cluster in the live-marker colour */
function alphaGlyph(ctx, x, y, r){
  disc(ctx, x, y, r * 1.55, rgba(COL.live, 0.9));
  disc(ctx, x - r * 0.45, y - r * 0.45, r * 0.62, '#f2a8ea');
  disc(ctx, x + r * 0.5, y + r * 0.4, r * 0.62, rgba('#ffffff', 0.55));
}

/* --- views 1 and 2: the nuclear and atomic scenes --------------------- */
function drawLive(ctx, W, H, M){
  const G = liveGeo(ctx, W, H, M), g = G.g, st = M.st;
  const bb = box(g.x0, g.y0, G.side, G.side);
  ctx.fillStyle = '#080c16'; ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
  frame(ctx, bb, '#242a3a');
  /* the atoms */
  for(const a of M.atoms){
    const half = a.L / 2 * g.s;
    /* PhET tracks a particle only inside a box of the atom's own width, and
       it rotates that box to the particle's direction.  Drawn unrotated. */
    ctx.save(); ctx.strokeStyle = rgba(COL.str, 0.22); ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.strokeRect(g.X(a.x) - half, g.Y(a.y) - half, 2 * half, 2 * half);
    ctx.restore();
    if(M.view === 'foil'){
      ctx.fillStyle = rgba(COL.str, 0.07);
      ctx.beginPath(); ctx.arc(g.X(a.x), g.Y(a.y), half * 0.92, 0, TAU); ctx.fill();
      ring(ctx, g.X(a.x), g.Y(a.y), half * 0.92, rgba(COL.str, 0.3), 1, [2, 3]);
    }
    drawNucleus(ctx, g, a.x, a.y, st.protons, st.neutrons, nucleusPix(M.view, half));
  }
  drawGun(ctx, g, st.gunOn);
  /* the closed form over the most deflected particle in flight */
  if(st.showClosed) drawClosedOver(ctx, g, M);
  drawParticles(ctx, g, M);
  /* scale bar */
  const mPerU = (M.view === 'foil' ? PHET.atomicScaleM : PHET.nuclearScaleM) / PHET.boxW;
  scaleBar(ctx, bb, g, mPerU, M.view === 'foil' ? 'atomic scale' : 'nuclear scale',
           'PhET’s caption');
  if(G.strip) censusStrip(ctx, G.strip, M);
  drawCaption(ctx, G.L);
  return G;
}
function scaleBar(ctx, bb, g, mPerU, name, src){
  const u = PHET.boxW / 4, px = u * g.s;
  const x = bb.x + 12, y = bb.y1 - 16;
  ctx.save(); ctx.strokeStyle = COL.str; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + px, y);
  ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4);
  ctx.moveTo(x + px, y - 4); ctx.lineTo(x + px, y + 4);
  ctx.stroke(); ctx.restore();
  label(ctx, x, y - 6, sigf(u * mPerU, 2) + ' m · ' + name + (src ? ' (' + src + ')' : ''),
        COL.dim, '10px -apple-system, sans-serif', 'left', 'bottom');
}
/* the analytic hyperbola of whichever particle is turning the most: drawn
   from the conic, not from the integrated path, so the two can be compared */
function drawClosedOver(ctx, g, M){
  let best = null;
  for(const p of RUN.ps) if(p.ai >= 0 && (!best || p.b0 < best.b0)) best = p;
  if(!best) return;
  const a = M.atoms[best.ai];
  const pts = conicPath(best.b, best.D, PHET.boxW * 0.95, 200);
  const world = [];
  for(let i = 0; i < pts.length; i += 2){
    world.push(a.x + best.ix * pts[i] + best.jx * pts[i + 1],
               a.y + best.iy * pts[i] + best.jy * pts[i + 1]);
  }
  ctx.save(); ctx.strokeStyle = rgba(COL.ref, 0.75); ctx.lineWidth = 1.3;
  ctx.setLineDash([5, 4]);
  strokeBoxed(ctx, g, world);
  ctx.restore();
  /* and its impact parameter, as the perpendicular from the nucleus to the
     incoming asymptote */
  const bx = a.x + best.ix * best.b, by = a.y + best.iy * best.b;
  ctx.save(); ctx.strokeStyle = COL.live; ctx.lineWidth = 1.6; ctx.beginPath();
  ctx.moveTo(g.X(a.x), g.Y(a.y)); ctx.lineTo(g.X(bx), g.Y(by)); ctx.stroke(); ctx.restore();
  /* both labels keep clear of the drawn nucleus: put b beyond the far end of
     its own segment and theta above the nucleus, not on top of it */
  const rN = nucleusPix(M.view, a.L / 2 * g.s);
  const lx = g.X(bx) + best.ix * 7, ly = g.Y(by) - best.iy * 7;
  if(Math.hypot(lx - g.X(a.x), ly - g.Y(a.y)) > rN + 4)
    labelIfClear(ctx, lx, ly, 'b = ' + fmt(best.b, 1), COL.live,
      '10.5px -apple-system, sans-serif', best.ix >= 0 ? 'left' : 'right', 'middle');
  labelIfClear(ctx, g.X(a.x), g.Y(a.y) - rN - 5,
    'θ = ' + fmt(thetaOfB(best.b, best.D) * 180 / PI, 1) + '°',
    COL.ref, '10.5px -apple-system, sans-serif', 'center', 'bottom');
}
/* how the particles that have left the frame were deflected */
function censusStrip(ctx, b, M){
  const h = RUN.hist;
  let tot = 0, mx = 0;
  for(let i = 0; i < NHIST; i++){ tot += h[i]; mx = Math.max(mx, h[i]); }
  panelTitle(ctx, b, 'where they went — ' + fmt(tot, 0) + ' particles off the frame');
  frame(ctx, b, '#242a3a');
  if(tot < 1){
    label(ctx, b.x + b.w / 2, b.y + b.h / 2, 'nothing has left the frame yet',
      COL.dim, '11px -apple-system, sans-serif', 'center', 'middle');
    return;
  }
  for(let i = 0; i < NHIST; i++){
    if(!h[i]) continue;
    const x0 = b.x + b.w * i / NHIST, w = b.w / NHIST - 1;
    const hh = b.h * Math.sqrt(h[i] / mx);
    ctx.fillStyle = i * 180 / NHIST >= 90 ? COL.pos : rgba(COL.str, 0.75);
    ctx.fillRect(x0, b.y1 - hh, Math.max(1, w), hh);
  }
  for(const d of [0, 45, 90, 135, 180]){
    const x = b.x + b.w * d / 180;
    label(ctx, x, b.y1 + 3, fmt(d, 0) + '°', COL.faint,
      '10px -apple-system, sans-serif', d === 0 ? 'left' : (d === 180 ? 'right' : 'center'), 'top');
  }
  label(ctx, b.x + b.w - 4, b.y + 4, 'bar height ∝N · green is past 90°',
    COL.faint, '10px -apple-system, sans-serif', 'right', 'top');
}

/* --- view 3: the plum pudding ---------------------------------------- */
function puddingGeo(ctx, W, H, M){
  const L = layout(ctx, W, H, puddCaption(M), puddCaptionShort(M));
  const avoid = W > 880 ? RO_W + 26 : 10;
  const areaX = 12, areaW = Math.max(180, W - 24 - avoid);
  const gunH = 22;
  const stripH = (L.bot - L.top) > 380 ? 92 : 0;
  const side = Math.max(120, Math.min(areaW, L.bot - L.top - gunH - (stripH ? stripH + 30 : 0)));
  const bx = areaX + (areaW - side) / 2;
  return {L: L, g: mapBox(bx, L.top, side), side: side, gunH: gunH,
          strip: stripH ? box(bx, L.top + side + gunH + 28, side, stripH - 28) : null};
}
function drawPudding(ctx, W, H, M){
  const G = puddingGeo(ctx, W, H, M), g = G.g, st = M.st;
  const bb = box(g.x0, g.y0, G.side, G.side);
  ctx.fillStyle = '#080c16'; ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
  frame(ctx, bb, '#242a3a');
  /* the pudding: a ball of positive charge with the electrons in it */
  const R = (PHET.boxW / 2) * g.s, cx = g.X(0), cy = g.Y(0);
  /* a canvas gradient records as an object, not a colour string, so the
     display-list audit cannot read it and the rasteriser paints it its
     unparseable-colour magenta -- the whole atom came out solid magenta in
     the first capture.  A flat premixed fill is what the capture can see. */
  ctx.fillStyle = mix(COL.bg, COL.proton, 0.16);
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ring(ctx, cx, cy, R, rgba(COL.proton, 0.55), 1.2);
  const rng = mulberry32(31337);
  const ne = Math.min(st.protons, 96);
  for(let i = 0; i < ne; i++){
    const rr = R * Math.sqrt(rng()) * 0.94, aa = rng() * TAU;
    disc(ctx, cx + rr * Math.cos(aa), cy + rr * Math.sin(aa), Math.max(1.6, R * 0.017), COL.electron);
  }
  labelIfClear(ctx, cx, cy - R - 6, 'Thomson’s atom: ' + fmt(st.protons, 0)
    + ' electrons in a ball of +' + fmt(st.protons, 0) + 'e', COL.dim,
    '11px -apple-system, sans-serif', 'center', 'bottom');
  drawGun(ctx, g, st.gunOn);
  drawParticles(ctx, g, M);
  /* PhET draws no scale on its plum-pudding screen, so this bar must NOT
     claim its caption: the ball here is one real gold atom across. */
  scaleBar(ctx, bb, g, GOLD.rAtom * 2 / PHET.boxW, 'the ball is one gold atom, 2 R');
  if(G.strip) decadeStrip(ctx, G.strip, M);
  drawCaption(ctx, G.L);
  return G;
}
/* the whole argument on one logarithmic angle axis: what Thomson's atom can
   do, what a foil of them can do, and where Rutherford's angles live */
function decadeStrip(ctx, b, M){
  const G = M.gold, st = M.st;
  const lo = Math.log10(Math.max(1e-9, G.thMax / 30)), hi = Math.log10(PI);
  const X = t => b.x + b.w * (Math.log10(Math.max(1e-12, t)) - lo) / (hi - lo);
  panelTitle(ctx, b, 'every deflection on one logarithmic axis, radians');
  frame(ctx, b, '#242a3a');
  ctx.save(); ctx.strokeStyle = '#181d29'; ctx.lineWidth = 1;
  for(let e = Math.ceil(lo); e <= Math.floor(hi); e++){
    const x = X(Math.pow(10, e));
    ctx.beginPath(); ctx.moveTo(x, b.y); ctx.lineTo(x, b.y1); ctx.stroke();
  }
  ctx.restore();
  for(let e = Math.ceil(lo); e <= Math.floor(hi); e++)
    label(ctx, X(Math.pow(10, e)), b.y1 + 3, '10' + supStr(e), COL.faint,
      '10px -apple-system, sans-serif', 'center', 'top');
  const marks = [
    [G.thMax, COL.ref, 'Thomson, one atom (D/2R)', 1],
    [G.thRms, COL.ref, fmt(st.foilNm, 0) + ' nm of Thomson atoms, θrms', 2],
    [electronMaxDeflection(), COL.dim, 'one free electron', 3],
    [thetaOfB(GOLD.rAtom, G.D), COL.pos, 'Rutherford at b = R(atom)', 1],
    [PI / 2, COL.live, '90°', 2],
    [PI * 0.995, COL.live, 'straight back', 3],
  ];
  for(const [t, c, nm, lane] of marks){
    const x = clamp(X(t), b.x, b.x1);
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x, b.y + 3); ctx.lineTo(x, b.y1 - 3); ctx.stroke(); ctx.restore();
    const ly = b.y + 5 + (lane - 1) * 13;
    sideLabel(ctx, b, x, ly, nm, c);
  }
}

/* ================================================================== *
 *  views 4-6: the closed form, the cross section, and real gold       *
 * ================================================================== */

/* --- view 4: the hyperbola -------------------------------------------- */
function hyperGeo(ctx, W, H, M){
  const L = layout(ctx, W, H, hyperCaption(M), hyperCaptionShort(M));
  const avoid = W > 880 ? RO_W + 26 : 10;
  const areaX = 12, areaW = Math.max(180, W - 24 - avoid);
  const stripH = (L.bot - L.top) > 360 ? 142 : 0;
  const side = Math.max(120, Math.min(areaW, L.bot - L.top - (stripH ? stripH + 8 : 0)));
  const bx = areaX + (areaW - side) / 2;
  const fam = bFamily(M);
  /* frame the DEFLECTION, not the widest orbit: scaling from b_max put the
     nucleus and every large-angle orbit inside a tenth of the picture */
  const Rw = Math.max(3 * M.D, 1.3 * M.bSel, 1.15 * fam[fam.length - 1], 40);
  return {L: L, side: side, bx: bx, Rw: Rw,
          g: {s: side / (2 * Rw), Rw: Rw,
              X: mx => bx + side / 2 + mx * side / (2 * Rw),
              Y: my => L.top + side / 2 - my * side / (2 * Rw)},
          strip: stripH ? box(bx + 46, L.top + side + 26, side - 58, stripH - AXIS_BOT - 18) : null};
}
function bFamily(M){
  const n = Math.max(1, Math.round(M.st.nPaths)), out = [];
  const lo = Math.log(M.D * 0.15), hi = Math.log(M.D * 3);
  for(let i = 0; i < n; i++) out.push(Math.exp(lo + (hi - lo) * (n === 1 ? 0.5 : i / (n - 1))));
  return out;
}
function drawHyper(ctx, W, H, M){
  const G = hyperGeo(ctx, W, H, M), g = G.g, st = M.st, D = M.D;
  const bb = box(G.bx, G.L.top, G.side, G.side);
  ctx.fillStyle = '#080c16'; ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
  frame(ctx, bb, '#242a3a');
  const cx = g.X(0), cy = g.Y(0);
  /* the family */
  /* both sides.  A beam is not one-sided, and drawing only +b left three
     quarters of the frame empty and the picture reading as a spray out of the
     nucleus rather than a beam passing it (the same failure as drawing each
     conic in its own frame -- Known-bad, differential_scattering). */
  for(const b of bFamily(M)){
    const pts = conicPath(b, D, g.Rw * 2.4, 260);
    strokeModel(ctx, g, bb, pts, rgba(COL.ref, 0.30), 1);
    const mir = [];
    for(let i = 0; i < pts.length; i += 2) mir.push(-pts[i], pts[i + 1]);
    strokeModel(ctx, g, bb, mir, rgba(COL.ref, 0.30), 1);
  }
  /* r_min of the selected orbit */
  const bSel = Math.max(1e-6, M.bSel);
  ring(ctx, cx, cy, rminOfB(bSel, D) * g.s, rgba(COL.str, 0.5), 1, [2, 3]);
  /* the asymptotes */
  if(st.showAsym){
    const thS = thetaOfB(bSel, D), phiI = PI - thS, far = g.Rw * 3;
    aline(ctx, g, bb, bSel, -far, bSel, 0.02 * far, rgba(COL.str, 0.55), [6, 4]);
    /* the outgoing asymptote: take a far point of the conic and drop the
       component along the outgoing direction.  Deriving the foot from a sign
       convention instead put it on the wrong side of the nucleus. */
    const dx = Math.sin(phiI), dy = -Math.cos(phiI);
    const rf = rOfPhi(phiI * (1 - 1e-7), bSel, D);
    const fx = rf * Math.sin(phiI * (1 - 1e-7)), fy = -rf * Math.cos(phiI * (1 - 1e-7));
    const dot = fx * dx + fy * dy;
    const ox = fx - dot * dx, oy = fy - dot * dy;
    aline(ctx, g, bb, ox - dx * far * 0.02, oy - dy * far * 0.02, ox + dx * far, oy + dy * far,
          rgba(COL.str, 0.55), [6, 4]);
    /* the impact parameter itself, offset below the nucleus so its label does
       not land on the nucleus glyph */
    const bY = -Math.min(g.Rw * 0.22, rminOfB(bSel, D) * 0.55);
    aline(ctx, g, bb, 0, bY, bSel, bY, COL.live, null, 1.8);
    aline(ctx, g, bb, 0, 0, 0, bY, rgba(COL.live, 0.4), [2, 3], 1);
    labelIfClear(ctx, (cx + g.X(bSel)) / 2, g.Y(bY) - 4, 'b = ' + fmt(bSel, 1), COL.live,
      'italic 12px Georgia, serif', 'center', 'bottom');
  }
  /* the selected closed form, then the integrated path over it */
  const sel = conicPath(bSel, D, g.Rw * 2.4, 520);
  strokeModel(ctx, g, bb, sel, COL.ref, 2.2);
  if(st.showInt){
    const io = hyperCheck(M);
    const pts = [];
    for(let i = 0; i < io.pts.length; i += 2) pts.push(io.pts[i] * D, io.pts[i + 1] * D);
    strokeModel(ctx, g, bb, pts, COL.pos, 1.6, [5, 4]);
  }
  /* the closest approach */
  const phiMin = phiInfOf(bSel, D) / 2, rm = rminOfB(bSel, D);
  const mx = g.X(rm * Math.sin(phiMin)), my = g.Y(-rm * Math.cos(phiMin));
  if(mx > bb.x && mx < bb.x1 && my > bb.y && my < bb.y1){
    disc(ctx, mx, my, 3.4, COL.live);
    if(!labelIfClear(ctx, mx + 7, my - 4, 'r min = ' + fmt(rm, 1), COL.live,
        '10.5px -apple-system, sans-serif', 'left', 'bottom'))
      labelIfClear(ctx, mx - 7, my - 4, 'r min = ' + fmt(rm, 1), COL.live,
        '10.5px -apple-system, sans-serif', 'right', 'bottom');
  }
  drawNucleus(ctx, g, 0, 0, st.protons, st.neutrons, Math.max(5, D * g.s * 0.22));
  labelIfClear(ctx, cx + 9, cy + 11, 'D = ' + fmt(D, 2), COL.str,
    '10.5px -apple-system, sans-serif', 'left', 'top');
  legendAuto(ctx, bb, [[COL.ref, 'the closed form'], [COL.pos, 'RK4 on Newton’s equations'],
                       [COL.str, 'asymptotes, r min'], [COL.live, 'b, closest approach']]);
  if(G.strip) deflectionPanel(ctx, G.strip, M);
  drawCaption(ctx, G.L);
  return G;
}
/* Everything in this view is drawn through polyline(), whose clipping is in
   DATA space -- a ctx.clip() fixes the browser and not the display-list audit,
   which records clip() as a no-op (Known-bad).  polyline's own mapping of
   [-Rw, Rw] onto a square box is the same map as g.X / g.Y, exactly.  The
   first version drew the whole family unclipped and the orbits ran across the
   caption and off the stage. */
function strokeModel(ctx, g, bb, pts, col, lw, dash){
  if(pts.length < 4) return;
  const xs = [], ys = [];
  for(let i = 0; i < pts.length; i += 2){ xs.push(pts[i]); ys.push(pts[i + 1]); }
  polyline(ctx, bb, xs, ys, -g.Rw, g.Rw, -g.Rw, g.Rw, col, lw || 1, dash);
}
function aline(ctx, g, bb, x0, y0, x1, y1, col, dash, lw){
  polyline(ctx, bb, [x0, x1], [y0, y1], -g.Rw, g.Rw, -g.Rw, g.Rw, col, lw || 1.2, dash);
}
/* theta(b): the closed form and the quadrature that has never been told it */
function deflectionPanel(ctx, b, M){
  const D = M.D;
  const lo = Math.log10(D * 0.04), hi = Math.log10(D * 20);
  const xs = [], ys = [];
  for(let i = 0; i <= 160; i++){
    const bb = Math.pow(10, lo + (hi - lo) * i / 160);
    xs.push(Math.log10(bb)); ys.push(thetaOfB(bb, D) * 180 / PI);
  }
  panelTitle(ctx, b, 'θ(b) = 2 atan(D/2b), and the deflection integral that never heard of it');
  axes(ctx, b, lo, hi, 0, 180, {yticks: b.h < 70 ? [90, 180] : [45, 90, 135, 180], nx: 5,
    xfmt: t => sigf(Math.pow(10, t), 2), yfmt: t => fmt(t, 0) + '°',
    xlab: 'impact parameter b, model units (log)', ylab: 'deflection θ'});
  polyline(ctx, b, xs, ys, lo, hi, 0, 180, COL.ref, 2);
  /* the independent route: the deflection integral for U/E = D/r */
  for(let i = 0; i <= 11; i++){
    const bb = Math.pow(10, lo + (hi - lo) * i / 11);
    const th = thetaQuad(bb, r => D / r, 12) * 180 / PI;
    const x = b.x + b.w * (Math.log10(bb) - lo) / (hi - lo);
    const y = b.y1 - b.h * clamp(th, 0, 180) / 180;
    ring(ctx, x, y, 3.2, COL.pos, 1.4);
  }
  const xs2 = Math.log10(Math.max(1e-9, M.bSel));
  if(xs2 > lo && xs2 < hi){
    const x = b.x + b.w * (xs2 - lo) / (hi - lo);
    ctx.save(); ctx.strokeStyle = COL.live; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x, b.y); ctx.lineTo(x, b.y1); ctx.stroke(); ctx.restore();
  }
  legendAuto(ctx, b, [[COL.ref, 'closed form'], [COL.pos, 'quadrature'], [COL.live, 'b on the left']]);
}

/* --- view 5: the cross section ---------------------------------------- */
function sigmaGeo(ctx, W, H, M){
  const L = layout(ctx, W, H, sigCaption(M), sigCaptionShort(M));
  const avoid = W > 880 ? RO_W + 26 : 10;
  const x0 = 54, wAll = Math.max(160, W - x0 - 18 - avoid);
  if(narrowStage(W)){
    /* the upper panel's x-axis title ends 33 px below its frame and the lower
       panel's title starts 24 px above its own, so 64 px of gap is the
       minimum -- at 30 they overlapped by 3 px at 560x380 */
    const f = stackFit(L.top, L.bot, 44, 0.44);
    return {L: L, a: box(x0, L.top + 14, wAll, f.side - AXIS_BOT),
            c: box(x0, L.top + 14 + f.side + 26, wAll, f.bh), stacked: true};
  }
  const gap = 66, pw = (wAll - gap) / 2;
  const hh = L.bot - L.top - AXIS_BOT - 14;
  return {L: L, a: box(x0, L.top + 14, pw, hh), c: box(x0 + pw + gap, L.top + 14, pw, hh),
          stacked: false};
}
function drawSigma(ctx, W, H, M){
  const G = sigmaGeo(ctx, W, H, M), st = M.st;
  const B = beamSample(st), D = B.D;
  const thMin = thetaOfB(st.bMax, D);
  const xlo = Math.log10(thMin * 180 / PI * 0.8), xhi = Math.log10(180);
  /* ---- panel A: dsigma/dOmega ---- */
  const dsLo = Math.log10(dsdoOf(PI, D) * 0.5), dsHi = Math.log10(dsdoOf(thMin * 0.9, D) * 2);
  const a = G.a;
  panelTitle(ctx, a, 'dσ/dΩ, three ways');
  axes(ctx, a, xlo, xhi, dsLo, dsHi, {yticks: ticksNoFloor(dsLo, dsHi, nyFor(a.h)), nx: 4,
    xfmt: t => sigf(Math.pow(10, t), 2) + '°', yfmt: t => '10' + supStr(Math.round(t)),
    xlab: 'scattering angle (log)',
    ylab: G.stacked ? 'dσ/dΩ (log)' : 'dσ/dΩ, model units²/sr (log)'});
  const xs = [], ys = [];
  for(let i = 0; i <= 220; i++){
    const th = Math.pow(10, xlo + (xhi - xlo) * i / 220) * PI / 180;
    xs.push(Math.log10(th * 180 / PI)); ys.push(Math.log10(dsdoOf(th, D)));
  }
  polyline(ctx, a, xs, ys, xlo, xhi, dsLo, dsHi, COL.ref, 2.2);
  if(st.showJac){
    for(let i = 0; i <= 10; i++){
      const th = Math.pow(10, xlo + (xhi - xlo) * (i + 0.5) / 11) * PI / 180;
      const v = dsdoNumeric(th, D);
      if(!isFinite(v) || v <= 0) continue;
      const x = a.x + a.w * (Math.log10(th * 180 / PI) - xlo) / (xhi - xlo);
      const y = a.y1 - a.h * (Math.log10(v) - dsLo) / (dsHi - dsLo);
      if(y < a.y || y > a.y1) continue;
      ring(ctx, x, y, 3.4, COL.pos, 1.5);
    }
  }
  if(st.showSample){
    for(const bn of B.bins){
      if(!bn.n) continue;
      const mid = Math.sqrt(bn.lo * bn.hi) * 180 / PI;
      const x = a.x + a.w * (Math.log10(mid) - xlo) / (xhi - xlo);
      const y = a.y1 - a.h * (Math.log10(bn.dens) - dsLo) / (dsHi - dsLo);
      if(x < a.x || x > a.x1 || y < a.y || y > a.y1) continue;
      const yUp = a.y1 - a.h * (Math.log10(bn.dens * (1 + bn.sigma)) - dsLo) / (dsHi - dsLo);
      const yDn = a.y1 - a.h * (Math.log10(bn.dens * Math.max(1e-6, 1 - bn.sigma)) - dsLo) / (dsHi - dsLo);
      ctx.save(); ctx.strokeStyle = COL.live; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x, Math.max(a.y, yUp)); ctx.lineTo(x, Math.min(a.y1, yDn));
      ctx.stroke(); ctx.restore();
      disc(ctx, x, y, 2.6, COL.live);
    }
  }
  legendAuto(ctx, a, [[COL.ref, '(D/4)²/sin⁴(θ/2)'],
                      [COL.pos, '(b/sinθ)|db/dθ|'],
                      [COL.live, fmt(st.nSample, 0) + ' sampled, ±1/√N']]);
  /* ---- panel C: the cumulative ---- */
  const c = G.c;
  const cLo = Math.log10(Math.max(1e-6, sigmaBeyond(PI * 0.999, D) / (PI * st.bMax * st.bMax) * 0.5));
  panelTitle(ctx, c, 'the fraction of the beam turned past θ');
  axes(ctx, c, xlo, xhi, cLo, 0.15, {yticks: ticksNoFloor(cLo, 0.15, nyFor(c.h)), nx: 4,
    xfmt: t => sigf(Math.pow(10, t), 2) + '°', yfmt: t => '10' + supStr(Math.round(t)),
    xlab: 'scattering angle (log)',
    ylab: G.stacked ? 'fraction (log)' : 'fraction beyond θ (log)'});
  const xs2 = [], ys2 = [], xs3 = [], ys3 = [];
  for(let i = 0; i <= 200; i++){
    const th = Math.pow(10, xlo + (xhi - xlo) * i / 200) * PI / 180;
    const ex = sigmaBeyond(Math.min(th, PI * 0.9999), D) / (PI * st.bMax * st.bMax);
    xs2.push(Math.log10(th * 180 / PI)); ys2.push(Math.log10(Math.max(1e-30, Math.min(1, ex))));
  }
  polyline(ctx, c, xs2, ys2, xlo, xhi, cLo, 0.15, COL.ref, 2.2);
  if(st.showSample){
    for(let i = 0; i <= 18; i++){
      const th = Math.pow(10, xlo + (xhi - xlo) * i / 18) * PI / 180;
      const f = fractionBeyond(B.th, th);
      if(f <= 0) continue;
      xs3.push(Math.log10(th * 180 / PI)); ys3.push(Math.log10(f));
    }
    for(let i = 0; i < xs3.length; i++){
      const x = c.x + c.w * (xs3[i] - xlo) / (xhi - xlo);
      const y = c.y1 - c.h * (ys3[i] - cLo) / (0.15 - cLo);
      if(x < c.x || x > c.x1 || y < c.y || y > c.y1) continue;
      disc(ctx, x, y, 2.6, COL.live);
    }
  }
  legendAuto(ctx, c, [[COL.ref, 'π b(θ)² / π bmax²'],
                      [COL.live, 'the seeded beam']]);
  drawCaption(ctx, G.L);
  return G;
}

/* --- view 6: gold, for real ------------------------------------------- */
function goldGeo(ctx, W, H, M){
  const L = layout(ctx, W, H, goldCaption(M), goldCaptionShort(M));
  const avoid = W > 880 ? RO_W + 26 : 10;
  const x0 = 58, wAll = Math.max(160, W - x0 - 18 - avoid);
  /* the ruler needs seven 15 px label rows and the bar under them, and not a
     pixel more: give the rest to the plot */
  const f = stackFit(L.top + 4, L.bot, 44, 0.30);
  const rh = clamp(f.side - 30, 80, 150);
  return {L: L, ruler: box(x0, L.top + 20, wAll, rh),
          plot: box(x0, L.top + 24 + rh + 40, wAll,
                    Math.max(60, L.bot - AXIS_BOT - (L.top + 24 + rh + 40)))};
}
function drawGold(ctx, W, H, M){
  const G = goldGeo(ctx, W, H, M), st = M.st, g = M.gold;
  /* ---- the ruler: every length in the problem on one log axis ---- */
  const b = G.ruler;
  const lo = Math.log10(0.5 * FM), hi = Math.log10(1e-8);
  const X = r => b.x + b.w * (Math.log10(r) - lo) / (hi - lo);
  panelTitle(ctx, b, 'the lengths, on one logarithmic ruler');
  frame(ctx, b, '#242a3a');
  ctx.save(); ctx.strokeStyle = '#181d29'; ctx.lineWidth = 1;
  for(let e = Math.ceil(lo); e <= Math.floor(hi); e++){
    const x = X(Math.pow(10, e));
    ctx.beginPath(); ctx.moveTo(x, b.y); ctx.lineTo(x, b.y1); ctx.stroke();
  }
  ctx.restore();
  for(let e = Math.ceil(lo); e <= Math.floor(hi); e++)
    label(ctx, X(Math.pow(10, e)), b.y1 + 3, '10' + supStr(e) + ' m', COL.faint,
      '10px -apple-system, sans-serif', 'center', 'top');
  const items = [
    [g.Ralpha, COL.neutron, 'alpha radius', 0],
    [g.Rnuc, COL.str, 'gold nucleus, 1.2 A⅓ fm', 1],
    [g.Rnuc + g.Ralpha, COL.str, 'touching', 2],
    [g.a, COL.ref, 'a = D/2 = b at 90°', 3],
    [g.D, COL.ref, 'D, head-on closest approach', 4],
    [g.rminA, COL.pos, 'r min at b = a', 5],
    [PHET.nuclearScaleM, COL.dim, 'PhET’s nuclear-scale caption', 6],
    [GOLD.rAtom, COL.live, 'gold atom, 1.44 Å', 0],
    [g.spacing, COL.live, 'atom spacing n⁻⅓', 1],
    [PHET.atomicScaleM, COL.dim, 'PhET’s atomic-scale caption', 2],
  ];
  /* ten labels need ten rows, not four: with four they landed on each other
     and sideLabel dropped half of them.  A leader joins each label to its own
     rule, because at this density the nearest rule is not the right one. */
  const lanes = Math.max(2, Math.min(7, Math.floor((b.h - 26) / 15)));
  for(const [r, c, nm, lane] of items){
    if(!(r > 0)) continue;
    const x = clamp(X(r), b.x, b.x1);
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x, b.y + 2); ctx.lineTo(x, b.y1 - 2); ctx.stroke(); ctx.restore();
    const ly = b.y + 5 + (lane % lanes) * 15;
    sideLabel(ctx, b, x, ly, nm, c);
  }
  /* the gap that makes Rutherford's law exact here */
  ctx.save(); ctx.strokeStyle = rgba(COL.pos, 0.6); ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(X(g.Rnuc + g.Ralpha), b.y1 - 9); ctx.lineTo(X(g.D), b.y1 - 9);
  ctx.stroke(); ctx.restore();
  labelIfClear(ctx, (X(g.Rnuc + g.Ralpha) + X(g.D)) / 2, b.y1 - 12,
    'never touches: pure Coulomb up to ' + fmt(g.Etouch / MEV, 1) + ' MeV',
    COL.pos, '10px -apple-system, sans-serif', 'center', 'bottom');

  /* ---- the plot: what each model says a foil does ---- */
  const c = G.plot;
  const xlo = Math.log10(0.3), xhi = Math.log10(180);
  const ylo = -40, yhi = 0.4;
  panelTitle(ctx, c, 'fraction of the beam turned past θ by ' + fmt(st.foilNm, 0)
    + ' nm of gold — the two models');
  axes(ctx, c, xlo, xhi, ylo, yhi, {yticks: ticksNoFloor(ylo, yhi, nyFor(c.h)), nx: 4,
    xfmt: t => sigf(Math.pow(10, t), 2) + '°', yfmt: t => '10' + supStr(Math.round(t)),
    xlab: 'scattering angle (log)', ylab: 'fraction beyond θ (log)'});
  const xr = [], yr = [], xt = [], yt = [];
  for(let i = 0; i <= 220; i++){
    const th = Math.pow(10, xlo + (xhi - xlo) * i / 220) * PI / 180;
    xr.push(Math.log10(th * 180 / PI));
    yr.push(Math.log10(Math.max(1e-99, Math.min(1, g.nt * sigmaBeyond(Math.min(th, PI * 0.9999), g.D)))));
    xt.push(Math.log10(th * 180 / PI));
    yt.push(thomsonLog10P(th, g.th2));
  }
  polyline(ctx, c, xr, yr, xlo, xhi, ylo, yhi, COL.ref, 2.2);
  polyline(ctx, c, xt, yt, xlo, xhi, ylo, yhi, COL.pos, 2.2);
  const x90 = c.x + c.w * (Math.log10(90) - xlo) / (xhi - xlo);
  ctx.save(); ctx.strokeStyle = rgba(COL.live, 0.7); ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(x90, c.y); ctx.lineTo(x90, c.y1); ctx.stroke(); ctx.restore();
  legendAuto(ctx, c, [[COL.ref, 'Rutherford: 1 in ' + sigf(1 / g.f90, 3) + ' past 90°'],
                      [COL.pos, 'Thomson: 10' + supStr(Math.round(g.log10P)) + ' past 90°']]);
  /* where the Thomson curve crosses the bottom of the box: -theta^2/<th2>/ln10
     = ylo, so theta = sqrt(-ylo ln10 <theta^2>) */
  const thCut = Math.sqrt(-ylo * Math.LN10 * g.th2) * 180 / PI;
  const xcut = c.x + c.w * (Math.log10(thCut) - xlo) / (xhi - xlo);
  if(xcut > c.x && xcut < c.x1)
    labelIfClear(ctx, xcut + 5, c.y1 - 5, 'Thomson falls off the bottom at '
      + fmt(thCut, 2) + '°', COL.pos, '10px -apple-system, sans-serif', 'left', 'bottom');
  drawCaption(ctx, G.L);
  return G;
}

/* ------------------------------------------------------------------ *
 *  dispatch and the scene                                             *
 * ------------------------------------------------------------------ */
function drawView(ctx, W, H, M){
  POLY_SEGS = []; LEGEND_RECTS = []; LABEL_RECTS = [];
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  if(M.view === 'nucleus' || M.view === 'foil') drawLive(ctx, W, H, M);
  else if(M.view === 'pudding') drawPudding(ctx, W, H, M);
  else if(M.view === 'hyperbola') drawHyper(ctx, W, H, M);
  else if(M.view === 'sigma') drawSigma(ctx, W, H, M);
  else drawGold(ctx, W, H, M);
}
const DRAG = {what: null};
function makeScene(canvas){
  const S = {st: ST, W: 1400, H: 820};
  S.model = buildModel;
  S.draw = function(){ const ctx = canvas.getContext('2d'); drawView(ctx, S.W, S.H, buildModel()); };
  S.step = function(dtWall){
    if(!ST.running || !liveView(ST.view)) return false;
    return engineAdvance(ST, dtWall || 0) > 0;
  };
  /* the pointer: clicking a live stage works the gun, dragging the hyperbola
     view sets the impact parameter.  No wheel handler exists, because no view
     reads a zoom -- a no-op handler nothing calls is dead code (Known-bad). */
  S.pointer = function(type, x, y){
    if(type === 'up'){ const had = DRAG.what !== null; DRAG.what = null; return had; }
    const ctx = canvas.getContext('2d'), M = buildModel();
    if(liveView(ST.view)){
      const G = ST.view === 'pudding' ? puddingGeo(ctx, S.W, S.H, M) : liveGeo(ctx, S.W, S.H, M);
      const g = G.g;
      if(type === 'down' && x >= g.x0 && x <= g.x0 + G.side && y >= g.y0 && y <= g.y0 + G.side){
        DRAG.what = 'gun'; ST.gunOn = !ST.gunOn; return true;
      }
      return false;
    }
    if(ST.view === 'hyperbola'){
      const G = hyperGeo(ctx, S.W, S.H, M), g = G.g;
      if(type === 'down' && x >= G.bx && x <= G.bx + G.side && y >= G.L.top && y <= G.L.top + G.side)
        DRAG.what = 'b';
      if(DRAG.what === 'b'){
        const mx = (x - (G.bx + G.side / 2)) / g.s;
        ST.bModel = clamp(Math.abs(mx), 0, 200);
        return true;
      }
      return false;
    }
    return false;
  };
  return S;
}

  window.addEventListener('error', ev => fail(ev.error || ev.message));

  function setView(k){
    st.view = k;
    [].forEach.call(tabsEl.children, (b, i) => b.className = TABS[i][0] === st.view ? 'active' : '');
    syncPanel(); dirty = true; refresh();
  }
  TABS.forEach(([k, lab2]) => {

  });

  const rows = {};
  function slider(key, lab2, lo, hi, step2, fmtf, onchg){

      val.textContent = fmtf(st[key]);

  function checkbox(key, lab2, onchg){
    const inp = h('input', {type: 'checkbox'}); inp.checked = st[key];
    const el = h('label', null, inp, lab2);

      st[key] = inp.checked;

        syncPanel(); dirty = true; refresh();

      wrapEl.appendChild(c);

  function btn(label2, fn){

    btn('RaC′ 7.7 MeV', () => { st.EMeV = 7.7; }),

  [gScene, gAlpha, gAtom, gTime, gHyp, gBeam, gReal, gInfo].forEach(g => panel.appendChild(g));
  const infoEl = gInfo.querySelector('#info');

  /* a control a view ignores is HIDDEN, never left live and inert */
  function syncPanel(){

    st.sceneSel = v === 'foil' ? 'atom' : 'nucleus';
    [].forEach.call(sceneChips.children, (b, i) =>
