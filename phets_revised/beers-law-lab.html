<title>Beer&rsquo;s Law Lab &mdash; the beaker, the cuvette and A = &epsilon;lc</title>
<!--
  ===================================================================
  beers-law-lab.html -- a remake of PhET's Beer's Law Lab: make a
  solution in a beaker, then shine a light through it and measure what
  comes out
  ===================================================================

  Remake of PhET Interactive Simulations' Beer's Law Lab (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.  Built against PhET's beers-law-lab 1.8.7, whose two
  screens are Concentration (a shaker and a dropper of one of nine
  solutes into a 1 L beaker, with a faucet, a drain, an evaporator, a
  concentration meter, and a saturation point where solid appears) and
  Beer's Law (a monochromatic source through a cuvette of adjustable
  width into a detector reading absorbance or transmittance, with the
  wavelength either at the solution's lambda_max or set by hand).

  Six views.  THE BEAKER is PhET's Concentration screen and THE CUVETTE
  is its Beer's Law screen.  THE SPECTRUM, THE LAW, THE LEDGER and TRUE
  COLOUR are this file's own analysis: PhET's eight absorption spectra
  with the beam on them, the straight line A = eps l c against the
  exponential T = 10^-A it implies, the beaker's mole ledger drawn as a
  ledger, and the colour the solution really transmits worked out over
  the CIE 1931 observer and laid beside PhET's interpolated ramp.

  WHAT IS EXACT HERE
  ------------------
  The chemistry is arithmetic, and it is done as arithmetic.

      A = eps l c,   T = 10^-A,   C = n/V,   n = cV

  Beer-Lambert is PhET's own model (doc/model.md: "A = abC", "T = 10^-A") and it
  is implemented with no approximation at all: derive.py asserts A against
  50-digit `decimal` evaluation over every solution x four path lengths x four
  concentrations (worst 2.7e-16 relative), T against the same (4.7e-16), and the
  round trip -log10(T) = A (1.4e-16).  The end-to-end error in T is LARGER, at
  1.2e-15, and that is not a defect: a relative error d in A becomes ln10 * A * d
  in T, so the suite asserts the amplification is the expected one rather than
  pretending it is not there.  Both extremes are pinned too: A = 0 gives T = 1
  exactly, A = 1 and A = 2 give exactly 10 % and 1 %, and 10^-A underflows a
  double to exactly zero at A = 324 -- past which the detector's reading cannot
  be inverted at all, since -log10(0) is infinite.

  The beaker is a MOLE LEDGER, and it closes.  Volume and moles are moved by
  PhET's five mechanisms in PhET's own order (faucet, drain, dropper,
  evaporation, shaker), each returning the amount that actually moved, so

      n_final  = shaker + dropper - drained          (exactly)
      V_final  = V_0 + faucet + dropper - drain - evaporation

  derive.py runs a 900-frame script through every one of them TWICE, once in
  doubles and once in exact `fractions.Fraction`, and both ledgers close --
  the rational one identically, the double one to 0.0 mol and 0.0 L, with the
  two runs agreeing to 4.4e-15 over the whole script.  The drain is the
  interesting one: it removes SOLUTION, so it carries solute away at the
  DISSOLVED concentration min(Csat, n/V) and leaves the precipitate behind.

  Saturation is exact: C = min(Csat, n/V), precipitate = max(0, n - V Csat),
  and evaporating a fixed n raises C along the exact hyperbola n/V until
  V = n/Csat, after which C is pinned at Csat and the rest falls out as solid.
  That saturation volume, and the time to reach it at PhET's 0.25 L/s, are
  closed forms the suite asserts against derive.py.

  Each shaker particle carries exactly 1/200 mol (PhET's particlesPerMole), so
  the shaker's contribution to the ledger is an exact multiple of 0.005 mol,
  and the particles you watch fall are the moles: they are added when they land,
  as PhET's are, not when they are released.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's, read out of the minified original by build/beers-law-lab/
  extract_phet.py and written into the file by make_data.py -- not one of them
  typed by hand: the nine solutes (molar mass, stock concentration, saturation
  point, and all three colour stops), the eight Beer's Law solutions (range,
  default, display transform and two-stop ramp), the eight molar-absorptivity
  spectra at one value per nanometre from 380 to 780 nm, the beaker's 1 L, the
  0-7 mol and 0-1 L ranges, the 0.5-2 cm cuvette and its 0.1 cm snap, the flow
  rates (dropper 0.05 L/s, faucets 0.25 L/s, evaporator 0.25 L/s, shaker
  0.2 mol/s), 200 particles per mole, water at 1000 g/L and rgb(224,255,255),
  and every decimal-place count the readouts use.

  Literature, fetched 2026-09-22 from the Wikipedia chemical infoboxes and
  quoted to their own printed precision, converted to molarity on the stated
  assumption that a litre of water makes a litre of solution: sucrose 342.297
  g/mol and 2.01 g/mL (20 C); Co(NO3)2 182.943 and 84.03 g/100 mL (0 C);
  CoCl2 129.839 and 52.9 g/100 mL (20 C); K2Cr2O7 294.182 and 15.1 g/100 g (no
  temperature given); K2CrO4 194.189 and 65.0 g/100 mL (no temperature given);
  NiCl2 129.5994 and 67.5 g/100 mL (25 C); CuSO4 159.60 and 201 g/L (20 C);
  KMnO4 158.032 and 76 g/L (25 C); NaCl 58.44 and 360 g/L (25 C).  PhET's molar
  masses match to 5.6e-5 relative and its saturation points to 0.0-0.6 % for
  the four quoted near room temperature (K2CrO4, KMnO4, NiCl2, K2Cr2O7); the
  worst gap is cobalt(II) nitrate at 23 %, whose only usable infobox figure is
  at 0 C.  PhET's "drink mix" has sucrose's molar mass to a milligram per mole.

  NO molar-absorptivity literature value could be sourced offline here.  Three
  sources were tried and all three carry only qualitative colour: Wikipedia's
  "Molar attenuation coefficient" (no numerical example for any substance),
  "Metal aquo complex" (a colour column, no wavelengths and no coefficients) and
  "Permanganate" (a spectrum figure, no printed lambda_max and no epsilon).  The
  spectra therefore stand as PhET's own digitised data, are labelled as such on
  the canvas and in the panel, and no literature comparison is invented for
  them.  "Still unverified" is the honest answer for those eight curves.

  The CIE 1931 2-degree colour-matching functions are the CIE's own table
  (DOI 10.25039/CIE.DS.xvudnb9b, ISO/CIE 11664-1:2019), at one row per
  nanometre -- the same grid the spectra are on, so the colour integral
  interpolates and resamples nothing.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  Displaced volume is ignored, as PhET ignores it: dissolving solute does not
  change the solution's volume here, which is why a mass percent can be taken
  with the solvent mass as V x 1000 g/L.  The solute is a single species with
  one saturation point and no temperature, no ionic strength, no activity and
  no common-ion effect: PhET's model, and the sim says so.  The clock runs at a
  fixed 1/60 s per frame so the headless suites are deterministic, and the
  shaker's particle scatter comes from a seeded generator for the same reason.
  PhET's own model.md disagrees with PhET's own code in two places, and the
  CODE is what is implemented here: the doc writes the concentration clamp
  against stockSolutionConcentration where ConcentrationSolution clamps against
  the SATURATED concentration, and it writes the precipitate as a difference of
  concentrations where the code takes a difference of moles.

  NOT MODELLED
  ------------
  Temperature, activity coefficients, ionic strength, common-ion and
  complex-formation effects, dissolution kinetics (solid appears and vanishes
  instantly at the saturation point), scattering and reflection at the cuvette
  faces, stray light, the detector's own noise and dynamic range, and
  chemical deviations from Beer-Lambert at high concentration -- a real
  solution stops being linear above roughly 0.01 M, which every one of PhET's
  Beer's Law ranges except the three micromolar ones runs past.  The sim draws
  that boundary and names it rather than pretending it is not there.  Also
  absent, being PhET's interface rather than its chemistry: the sounds, the
  voicing and alt-text layers, the artwork, the combo boxes, the draggable
  ruler, and the drag-the-shaker-to-shake gesture (a checkbox does it here).
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);

/* PhET's own constant names, in file order -- the bridge between refvals.txt's
   labels and the ids above, generated rather than typed */
const SOLUTE_CONST=["DRINK_MIX", "COBALT_II_NITRATE", "COBALT_CHLORIDE", "POTASSIUM_DICHROMATE", "POTASSIUM_CHROMATE", "NICKEL_II_CHLORIDE", "COPPER_SULFATE", "POTASSIUM_PERMANGANATE", "SODIUM_CHLORIDE"];
const BLS_CONST=["DRINK_MIX", "COBALT_II_NITRATE", "COBALT_CHLORIDE", "POTASSIUM_DICHROMATE", "POTASSIUM_CHROMATE", "NICKEL_II_CHLORIDE", "COPPER_SULFATE", "POTASSIUM_PERMANGANATE"];

/* ================================================================== *
 *  the chemistry.  Every function here has a twin in                  *
 *  build/beers-law-lab/derive.py, and every constant it leans on is   *
 *  a line of p2_data.js, which was written from the minified          *
 *  original.  No DOM.                                                 *
 * ================================================================== */

/* ---- lookups ---------------------------------------------------------------------- */
function soluteById(id){
  for(const s of SOLUTES) if(s.id===id) return s;
  return SOLUTES[0];                       /* an unknown id falls back rather than throwing */
}
function blsById(id){
  for(const s of BLSOLS) if(s.id===id) return s;
  return BLSOLS[0];
}
function hasSpectrum(id){ return Object.prototype.hasOwnProperty.call(EPS,id); }

/* ---- Beer-Lambert ------------------------------------------------------------------ *
 * PhET's model.md: "A = abC" and "T = 10^-A".  a is the molar absorptivity in 1/(cm M),
 * b the path length in cm, C the concentration in mol/L.  Nothing is approximated.      */
function absorbance(eps,l,c){ return eps*l*c; }
function transmittance(A){ return Math.pow(10,-A); }
/* the inverse.  Math.log10(0) is -Infinity in JavaScript, which is the honest answer for a
   detector reading exactly zero: no finite absorbance produces it. */
function absorbanceOfT(T){ return -Math.log10(T); }

/* PhET's molar absorptivity is a LOOKUP, not an interpolation: the table is indexed by
   floor(lambda - 380), so 500.0 nm and 500.9 nm read the same cell.  Outside the table
   there is no data and this returns null rather than a number nobody measured. */
function epsAt(id,lam){
  const t=EPS[id];
  if(!t) return null;
  const i=Math.floor(lam-LAM0);
  if(i<0||i>=NLAM) return null;
  return t[i];
}
function lambdaMaxOf(id){
  const t=EPS[id]; if(!t) return null;
  let best=t[0], k=0;
  for(let i=0;i<t.length;i++) if(t[i]>best){ best=t[i]; k=i; }   /* strict >, as PhET's is */
  return LAM0+k;
}
function epsMaxOf(id){ const lm=lambdaMaxOf(id); return lm===null?null:epsAt(id,lm); }

/* ---- the beaker: PhET's ConcentrationModel at the level of moles and litres --------- */
/* Each mechanism returns the amount that ACTUALLY moved, which is what lets the ledger
   close when a clamp bites.  The order of the five is PhET's own step(). */
function makeBeaker(soluteId,n,V){
  return {solute:soluteId, n:n, V:V, n0:n, V0:V, parts:[],
          led:{shaker:0, dropper:0, drained:0, faucet:0, evaporated:0,
               drainedV:0, dropperV:0, flying:0}};
}
function csatOf(id){ return soluteById(id).cSat; }
function bkPrecip(B){
  const z=B.n-B.V*csatOf(B.solute);
  return z>0?z:0;
}
/* PhET carries an updatePrecipitateAmount flag that it clears across the dropper's volume
   add, because its precipitate is a derived Property and would otherwise recompute on the
   half-finished state (volume raised, solute not yet added).  There is no counterpart here:
   bkPrecip is computed on demand and nothing reads it between the two writes, so the flag
   could not change an answer and would be a no-op nobody calls.  selfTest asserts the end
   state instead -- the dropper's effect on the solid is the same either way. */
function bkConc(B){
  if(!(B.V>0)) return 0;
  const q=B.n/B.V, cs=csatOf(B.solute);
  return q>cs?cs:q;
}
function bkSaturated(B){ return B.V>0 && B.n/B.V>csatOf(B.solute); }
function bkAddSolvent(B,d){
  if(!(d>0)) return 0;
  const v0=B.V; B.V=Math.min(PHET.VOL_MAX,B.V+d); return B.V-v0;
}
function bkRemoveSolvent(B,d){
  if(!(d>0)) return 0;
  const v0=B.V; B.V=Math.max(PHET.VOL_MIN,B.V-d); return v0-B.V;
}
function bkAddSolute(B,d){
  if(!(d>0)) return 0;
  const n0=B.n; B.n=Math.min(PHET.SOLUTE_MOL_MAX,B.n+d); return B.n-n0;
}
function bkRemoveSolute(B,d){
  if(!(d>0)) return 0;
  const n0=B.n; B.n=Math.max(PHET.SOLUTE_MOL_MIN,B.n-d); return n0-B.n;
}
/* the shaker's particles.  PhET's part is the arithmetic: round(max(1, rate * 200 * dt))
   of them a frame, each carrying exactly 1/200 mol, and the moles arrive when the particle
   LANDS, not when it is released.  Their flight is this file's own -- ballistic in the
   beaker's own coordinates (x across the inner width, y up from the floor in units of the
   beaker's height) -- and the canvas says so. */
const MOLE_PER_PARTICLE=1/PHET.PARTICLES_PER_MOLE;
const SHAKER_G=2.6;                       /* beaker heights per second squared, drawing-only */
function shakerPerFrame(dt){
  return Math.round(Math.max(1,PHET.SHAKER_RATE*PHET.PARTICLES_PER_MOLE*dt));
}
function makeRngB(seed){
  let s=seed>>>0;
  return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
}
function bkStep(B,dt,ctl,rng){
  /* 1  the solvent faucet */
  B.led.faucet+=bkAddSolvent(B,ctl.faucet*dt);
  /* 2  the drain: it removes SOLUTION, so the solute leaves at the DISSOLVED
        concentration and the precipitate stays on the bottom */
  const dOut=ctl.drain*dt;
  if(dOut>0){
    const c=bkConc(B);
    const got=bkRemoveSolvent(B,dOut);
    B.led.drainedV+=got;
    B.led.drained+=bkRemoveSolute(B,c*got);
  }
  /* 3  the dropper: stock solution.  PhET freezes the precipitate across the volume add,
        so a stock drop cannot momentarily re-dissolve what is already on the bottom */
  const dIn=ctl.dropper*dt;
  if(dIn>0){
    const got=bkAddSolvent(B,dIn);
    B.led.dropperV+=got;
    B.led.dropper+=bkAddSolute(B,soluteById(B.solute).stock*got);
  }
  /* 4  evaporation: solvent leaves, solute does not */
  B.led.evaporated+=bkRemoveSolvent(B,ctl.evap*dt);
  /* 5  the shaker's particles fall, and land */
  const surf=bkFill(B);
  const keep=[];
  for(const p of B.parts){
    p.vy-=SHAKER_G*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt;
    if(p.x<0.02){ p.x=0.02; p.vx=Math.abs(p.vx); }
    if(p.x>0.98){ p.x=0.98; p.vx=-Math.abs(p.vx); }
    if(p.y<=surf){ B.led.shaker+=bkAddSolute(B,MOLE_PER_PARTICLE); }
    else keep.push(p);
  }
  B.parts=keep;
  /* 6  and the shaker makes more */
  if(ctl.shaking){
    const k=shakerPerFrame(dt);
    for(let i=0;i<k;i++)
      B.parts.push({x:0.30+0.12*rng(), y:1.28+0.05*rng(),
                    vx:0.22+0.10*rng(), vy:-0.05*rng(),
                    rot:TAU*rng(), spin:(rng()-0.5)*7});
  }
  B.led.flying=MOLE_PER_PARTICLE*B.parts.length;
  return B;
}
function bkFill(B){ return clamp(B.V/PHET.BEAKER_VOLUME,0,1); }
/* the ledger's two closures, as residuals the readout prints */
function bkLedgerResidual(B){
  return {n:B.n-(B.n0+B.led.shaker+B.led.dropper-B.led.drained),
          V:B.V-(B.V0+B.led.faucet+B.led.dropperV-B.led.drainedV-B.led.evaporated)};
}

/* grams, and PhET's mass percent.  Only the DISSOLVED solute is weighed: PhET's
   soluteGramsProperty subtracts the precipitate first. */
function soluteGrams(n,V,cs,M){
  const p=Math.max(0,n-V*cs);
  return M*Math.max(0,n-p);
}
function percentConcentration(g,V){
  return V<=0?0:g/(g+V*PHET.WATER_DENSITY)*100;
}
/* PhET's stockSolutionPercentConcentration: M c 100 / (rho + M c) */
function stockPercent(sol){
  return sol.molarMass*sol.stock*100/(PHET.WATER_DENSITY+sol.molarMass*sol.stock);
}
/* the volume at which evaporating a fixed n first saturates, and how long PhET's
   evaporator takes to get there from V */
function saturationVolume(n,cs){ return cs>0?n/cs:Infinity; }
function timeToSaturate(n,V,cs,rate){
  const vs=saturationVolume(n,cs);
  return (rate>0&&V>vs)?(V-vs)/rate:null;
}
/* PhET's precipitate particle count: round(200 * moles), but never zero while any exists */
function particleCount(pm){
  let k=Math.round(PHET.PARTICLES_PER_MOLE*pm);
  if(k===0&&pm>0) k=1;
  return k;
}

/* ---- PhET's two colour laws -------------------------------------------------------- */
/* Color.interpolateRGBA FLOORS each channel -- it is not a rounding.  Halfway between
   (224,255,255) and (255,225,225) is (239,240,240), not (240,240,240). */
function lerpRGBfloor(a,b,t){
  return [Math.floor(a[0]+(b[0]-a[0])*t),
          Math.floor(a[1]+(b[1]-a[1])*t),
          Math.floor(a[2]+(b[2]-a[2])*t)];
}
function rgbCss(v){ return 'rgb('+v[0]+','+v[1]+','+v[2]+')'; }
/* the Concentration screen: SoluteColorScheme's three stops, with
   ConcentrationSolution.createColor's "c = 0 shows the solvent" in front of it */
/* Two of SoluteColorScheme's four branches cannot be reached with PhET's own data, and
   they are kept because they are PhET's rather than because they do anything: every one
   of the nine has cMin = 0 and a minColor equal to the water colour, so "c = 0 shows the
   solvent" and "c <= cMin shows minColor" agree and neither can fire for c > 0.  Both
   properties are asserted in selfTest, so the branches begin to matter the moment a
   solute with a non-zero low stop is added -- and the two mutants on them are left out
   of the sweep with this as the reason, rather than reported as survivors. */
function schemeColor(id,c){
  const d=soluteById(id);
  if(!(c>0)) return WATER_RGB.slice();
  if(c>=d.cSat) return d.maxRGB.slice();
  if(c<=d.cMin) return d.minRGB.slice();
  if(c<=d.cMid) return lerpRGBfloor(d.minRGB,d.midRGB,(c-d.cMin)/(d.cMid-d.cMin));
  return lerpRGBfloor(d.midRGB,d.maxRGB,(c-d.cMid)/(d.cSat-d.cMid));
}
/* the Beer's Law screen: a straight two-stop RGB line over the solution's own range, with
   water at exactly zero.  The step at c = 0+ is PhET's and is drawn rather than smoothed. */
function rampColor(id,c){
  const d=blsById(id);
  if(!(c>0)) return WATER_RGB.slice();
  const t=clamp(c/d.cMax,0,1);
  return lerpRGBfloor(d.loRGB,d.hiRGB,t);
}

/* ---- the colour the solution really transmits --------------------------------------- *
 * XYZ over the CIE 1931 2-degree observer on the same 1 nm grid the spectra live on, so
 * nothing is interpolated.  Two illuminants: E, the equal-energy white (flat by
 * definition), and CIE standard illuminant A, from the CIE's own defining formula.  No
 * D65 spectrum could be sourced offline, and none is invented.                            */
const C2_ILLUM_A=1.435e-2, T_ILLUM_A=2848;     /* the CIE's 1931 c2, in m K, and its 2848 K */
function illumAt(kind,lam){
  if(kind==='E') return 1;
  return 100*Math.pow(560/lam,5)*(Math.exp(C2_ILLUM_A*1e9/(T_ILLUM_A*560))-1)
            /(Math.exp(C2_ILLUM_A*1e9/(T_ILLUM_A*lam))-1);
}
const SRGB_M=[[ 3.2406,-1.5372,-0.4986],
              [-0.9689, 1.8758, 0.0415],
              [ 0.0557,-0.2040, 1.0570]];
/* the sRGB transfer curve (IEC 61966-2-1).  The clamp is HERE and nowhere else: a
   second clamp on the caller's side would make each mutant on the other equivalent
   (Known-bad, buoyancy.html -- two guards on one path). */
function srgbGamma(u){
  u=clamp(u,0,1);
  return u<=0.0031308?12.92*u:1.055*Math.pow(u,1/2.4)-0.055;
}
function xyzToLin(X,Y,Z){
  return [SRGB_M[0][0]*X+SRGB_M[0][1]*Y+SRGB_M[0][2]*Z,
          SRGB_M[1][0]*X+SRGB_M[1][1]*Y+SRGB_M[1][2]*Z,
          SRGB_M[2][0]*X+SRGB_M[2][1]*Y+SRGB_M[2][2]*Z];
}
/* returns {xyz, white, Y} -- the transmitted tristimulus, the illuminant's own, and the
   photopic transmittance Y/Yw, which is the fraction of the LIGHT (not of the beam at
   lambda_max) that gets through. */
function transmittedXYZ(id,l,c,kind){
  const t=EPS[id];
  if(!t) return null;
  let X=0,Y=0,Z=0,Xw=0,Yw=0,Zw=0;
  for(let i=0;i<NLAM;i++){
    const S=illumAt(kind||'E',LAM0+i);
    const T=Math.pow(10,-t[i]*l*c);
    const sx=S*CIE_X[i], sy=S*CIE_Y[i], sz=S*CIE_Z[i];
    X+=T*sx; Y+=T*sy; Z+=T*sz;
    Xw+=sx;  Yw+=sy;  Zw+=sz;
  }
  return {xyz:[X,Y,Z], white:[Xw,Yw,Zw], Y:Y/Yw};
}
/* Adapted so the illuminant itself renders EXACTLY white: each linear sRGB channel is
   divided by the same channel for the illuminant alone.  That is a von Kries adaptation
   carried out in the display's own primaries, it needs no white-point constant, and it
   makes an empty cuvette rgb(255,255,255) under either illuminant. */
function trueRGB(id,l,c,kind){
  const r=transmittedXYZ(id,l,c,kind);
  if(!r) return null;
  const lin=xyzToLin(r.xyz[0],r.xyz[1],r.xyz[2]);
  const w=xyzToLin(r.white[0],r.white[1],r.white[2]);
  /* out-of-gamut channels come out negative; srgbGamma clamps them, and clamping them
     again here would only make its mutant equivalent */
  const v=[lin[0]/w[0],lin[1]/w[1],lin[2]/w[2]];
  return {rgb:[Math.round(255*srgbGamma(v[0])),
               Math.round(255*srgbGamma(v[1])),
               Math.round(255*srgbGamma(v[2]))],
          Y:r.Y};
}
/* relative luminance of an sRGB triple, for comparing PhET's ramp against the true colour
   on the one axis they can both be put on */
function relLum(v){
  const inv=u=>{ u/=255; return u<=0.04045?u/12.92:Math.pow((u+0.055)/1.055,2.4); };
  return 0.2126*inv(v[0])+0.7152*inv(v[1])+0.0722*inv(v[2]);
}
/* a monochromatic wavelength's own colour, for the spectrum view's wavelength cursor and
   the beam.  Normalised to its brightest channel and faded by the eye's own response, as
   diffraction.html does -- display only, and the canvas says so. */
function waveRGB(lam){
  const i=Math.round(lam)-LAM0;
  if(i<0||i>=NLAM) return [0,0,0];
  let v=xyzToLin(CIE_X[i],CIE_Y[i],CIE_Z[i]);
  const lo=Math.min(v[0],v[1],v[2]);
  if(lo<0) v=v.map(u=>u-lo);
  const m=Math.max(v[0],v[1],v[2]);
  if(!(m>0)) return [0,0,0];
  const k=Math.sqrt(Math.min(1,4*CIE_Y[i]));
  return v.map(u=>Math.round(255*srgbGamma(u/m*k)));
}
function waveCss(lam){ return rgbCss(waveRGB(lam)); }

/* ---- where Beer-Lambert stops being true ------------------------------------------- *
 * Not modelled, but named: above roughly 10 mM a real solution's molar absorptivity drifts
 * (refractive index, ion pairing, solute-solute interaction), so the straight line the law
 * view draws is an extrapolation past that.  The number is a conventional teaching bound,
 * not a measurement, and it is labelled that way wherever it appears.                     */
const LINEAR_LIMIT=0.01;

/* ---- which of the two sims this file is -------------------------------------------- */
const SIM_ID='beers-law-lab';
const SHOW_BEERS=true;                    /* the Beer's Law screen and its analysis views */
const PHET_TITLE='Beer&rsquo;s Law Lab';
const PHET_SRC='docs/phets/beers-law-lab_en.html '+PHET_VERSION;
const TABS=[['beaker','the beaker'],['cuvette','the cuvette'],['spectrum','the spectrum'],
            ['law','the law'],['ledger','the ledger'],['colour','true colour']];

/* ================================================================== *
 *  state: the beaker (PhET's Concentration screen), the cuvette       *

 *  models, and the readout / equation bar / tag                       *
 * ================================================================== */
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', off:'#161c2c', glass:'#8fb8d4', solid:'#e8843a',
           beam:'#5ac8e0', eye:'#9aa2b4'};
const RO_W=300;
/* the house #hint sits at bottom:11px on top of the last line of a caption anchored at
   H - 12, so every caption here ends HINT_H higher (build/wave-on-a-string/, Known-bad) */
const HINT_H=18;
const FRAME_DT=1/60;             /* a fixed step, so the headless suites are deterministic */

const SOLUTE_LIST=SOLUTES.map(s=>({id:s.id,name:s.name}));
const BLS_LIST=BLSOLS.map(s=>({id:s.id,name:soluteById(s.solute).name}));
const FORM_LIST=[{id:'solid',name:'solid'},{id:'solution',name:'solution'}];
const METER_LIST=[{id:'molar',name:'mol/L'},{id:'percent',name:'%'}];
const BEAKER_UNIT_LIST=[{id:'liters',name:'L'},{id:'milliliters',name:'mL'}];
const MODE_LIST=[{id:'preset',name:'preset'},{id:'variable',name:'variable'}];
const DET_LIST=[{id:'transmittance',name:'transmittance'},{id:'absorbance',name:'absorbance'}];
const ILLUM_LIST=[{id:'E',name:'equal energy'},{id:'A',name:'illuminant A'}];
const LAWX_LIST=[{id:'conc',name:'against c'},{id:'path',name:'against l'}];

const DEFAULTS={view:TABS[0][0],
  /* the Concentration screen */
  solute:'drinkMix', form:'solid',
  shaking:false, dropper:false, faucet:false, drain:false, evap:0,
  running:true, meterUnits:'molar', beakerUnits:'liters',
  showAmount:false, showVolume:false,
  /* the Beer's Law screen */
  blSolution:'drinkMix', blConc:BLSOLS[0].cDefault, cuvette:PHET.CUVETTE_DEFAULT,
  lightOn:true, lightMode:'preset', wavelength:lambdaMaxOf('drinkMix'),
  detector:'transmittance', snap:true,
  /* the analysis views */
  allSpectra:false, lawX:'conc', illum:'E', colourPath:PHET.CUVETTE_DEFAULT};
const ST=Object.assign({},DEFAULTS);

/* the beaker itself is a stepped object, not a slider value: it carries the running mole
   ledger and the shaker's particles in flight.  V0 is remembered so the volume ledger has
   something to close against. */
let BK=makeBeaker(DEFAULTS.solute,0,PHET.VOL_DEFAULT);
const RNG={f:makeRngB(20260922)};
function resetBeaker(){
  BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT);
  RNG.f=makeRngB(20260922);
}
function setSoluteId(id){
  ST.solute=id;
  /* PhET empties the solute when the solute changes -- the beaker cannot hold two */
  BK.solute=id; BK.n=0; BK.parts=[];
  resetLedger();
}
function setMoles(n){ BK.n=clamp(n,PHET.SOLUTE_MOL_MIN,PHET.SOLUTE_MOL_MAX); resetLedger(); }
function setVolume(V){ BK.V=clamp(V,PHET.VOL_MIN,PHET.VOL_MAX); resetLedger(); }
/* setting a value by hand is not a transaction the ledger can account for, so the ledger
   is re-based on the state it finds: the residual stays meaningful afterwards */
function resetLedger(){
  BK.n0=BK.n; BK.V0=BK.V;
  BK.led={shaker:0,dropper:0,drained:0,faucet:0,evaporated:0,drainedV:0,dropperV:0,
          flying:MOLE_PER_PARTICLE*BK.parts.length};
}

/* the concentration meter's probe, in BEAKER-LOCAL coordinates: x across the inner width
   (0 at the left wall, 1 at the right), y up from the floor (0 at the floor, 1 at the brim).
   The meter reads only when the tip is in the solution, exactly as PhET's does. */
const PROBE={x:0.78, y:0.18};
const PROBE0={x:0.78, y:0.18};
/* the Beer's Law detector probe, in CUVETTE-LOCAL coordinates: x in cm from the cuvette's
   left face (so it can sit inside the cuvette or past it), y in cm above the beam axis. */
/* x is measured in cm from the cuvette's LEFT face, so the probe can sit inside the
   glass or past it; y in cm above the beam axis */
const DET={x:3.4, y:0};
const DET0={x:3.4, y:0};
const DRAG={what:null, grabW:0, grabX:0};
const PROBE_WALL=0.04;
function probeInSolution(){
  return PROBE.x>=PROBE_WALL && PROBE.x<=1-PROBE_WALL
      && PROBE.y>=0 && PROBE.y<=bkFill(BK) && BK.V>0;
}
/* PhET's ATDetector.isProbeInBeam: the light is on and the probe spans the beam.  The beam
   is 0.45 cm across (PhET's lensDiameter) and the probe's sensor 1 cm, so "spans" is the
   probe's own half-height reaching past both beam edges. */
const BEAM_HALF=0.225, SENSOR_HALF=0.5;
function detectorInBeam(){
  return ST.lightOn && Math.abs(DET.y)+BEAM_HALF<SENSOR_HALF && DET.x>0;
}

/* ---- the clock: PhET's five mechanisms, in PhET's order ----------------------------- */
function stepFrame(){
  if(!ST.running) return false;
  const solidForm=(ST.form==='solid');
  const ctl={faucet:ST.faucet?PHET.FAUCET_FLOW:0,
             drain:ST.drain?PHET.FAUCET_FLOW:0,
             dropper:(!solidForm&&ST.dropper&&BK.n<PHET.SOLUTE_MOL_MAX)?PHET.DROPPER_FLOW:0,
             evap:BK.V>0?ST.evap:0,
             shaking:solidForm&&ST.shaking&&BK.n<PHET.SOLUTE_MOL_MAX};
  const busy=ctl.faucet>0||ctl.drain>0||ctl.dropper>0||ctl.evap>0||ctl.shaking||
             BK.parts.length>0;
  if(!busy) return false;
  bkStep(BK,FRAME_DT,ctl,RNG.f);
  return true;
}
function emptyBeaker(){ BK.n=0; BK.V=0; BK.parts=[]; resetLedger(); }
function fillBeaker(){ BK.V=PHET.VOL_MAX; resetLedger(); }

/* ---- the Beer's Law screen ---------------------------------------------------------- */
function currentBls(){ return blsById(ST.blSolution); }
function presetWavelength(){ return lambdaMaxOf(ST.blSolution); }
function activeWavelength(){
  return ST.lightMode==='preset'?presetWavelength():ST.wavelength;
}
function setBlSolution(id){
  ST.blSolution=id;
  ST.blConc=blsById(id).cDefault;
  /* PhET re-points the light at the new solution's lambda_max whenever the solution
     changes, in BOTH modes for the preset and on switching back to it */
  if(ST.lightMode==='preset') ST.wavelength=lambdaMaxOf(id);
}
function cuvetteWidth(){ return clamp(ST.cuvette,PHET.CUVETTE_MIN,PHET.CUVETTE_MAX); }
/* PhET snaps the cuvette's width to a 0.1 cm interval when a drag ENDS (its
   snapIntervalProperty); zero means no snapping. */
function snapCuvette(w){
  const s=ST.snap?PHET.CUVETTE_SNAP:0;
  if(!(s>0)) return clamp(w,PHET.CUVETTE_MIN,PHET.CUVETTE_MAX);
  return clamp(Math.round(w/s)*s,PHET.CUVETTE_MIN,PHET.CUVETTE_MAX);
}

/* ---- the models --------------------------------------------------------------------- */
function beakerModel(){
  const sol=soluteById(BK.solute);
  const cs=sol.cSat;
  const C=bkConc(BK), P=bkPrecip(BK);
  const g=soluteGrams(BK.n,BK.V,cs,sol.molarMass);
  const M={sol, n:BK.n, V:BK.V, C, precip:P, sat:bkSaturated(BK),
           grams:g, percent:percentConcentration(g,BK.V),
           rgb:schemeColor(BK.solute,C), fill:bkFill(BK),
           parts:BK.parts, nParts:particleCount(P),
           led:BK.led, resid:bkLedgerResidual(BK), V0:BK.V0, n0:BK.n0,
           cs, Vsat:saturationVolume(BK.n,cs),
           tSat:timeToSaturate(BK.n,BK.V,cs,ST.evap>0?ST.evap:PHET.EVAPORATION_MAX),
           probeIn:probeInSolution(), empty:!(BK.V>0),
           full:BK.V>=PHET.VOL_MAX-1e-12, stockPct:stockPercent(sol)};
  M.reading=M.probeIn?(ST.meterUnits==='molar'?M.C:M.percent):null;
  M.flying=BK.led.flying;
  return M;
}
function cuvetteModel(){
  const d=currentBls(), sol=soluteById(d.solute);
  const lam=activeWavelength(), l=cuvetteWidth(), c=ST.blConc;
  const eps=epsAt(d.id,lam);
  const A=absorbance(eps,l,c), T=transmittance(A);
  const M={d, sol, lam, l, c, eps, A, T, lamMax:lambdaMaxOf(d.id), epsMax:epsMaxOf(d.id),
           rgb:rampColor(d.id,c), inBeam:detectorInBeam(), on:ST.lightOn,
           mode:ST.lightMode, det:ST.detector,
           wave:waveRGB(lam), atMax:Math.round(lam)===lambdaMaxOf(d.id)};
  M.reading=(M.on&&M.inBeam)?(ST.detector==='absorbance'?A:T):null;
  M.beyondLinear=c>LINEAR_LIMIT;
  M.Amax2=absorbance(M.epsMax,PHET.CUVETTE_MAX,d.cMax);
  return M;
}
function spectrumModel(){
  const d=currentBls(), l=cuvetteWidth(), c=ST.blConc, lam=activeWavelength();
  const t=EPS[d.id];
  const xs=[], eps=[], Aa=[], Tt=[];
  for(let i=0;i<NLAM;i++){
    xs.push(LAM0+i); eps.push(t[i]);
    const A=absorbance(t[i],l,c);
    Aa.push(A); Tt.push(transmittance(A));
  }
  let epsHi=0;
  for(const s of BLSOLS) epsHi=Math.max(epsHi,epsMaxOf(s.id));
  return {d, xs, eps, A:Aa, T:Tt, lam, l, c,
          lamMax:lambdaMaxOf(d.id), epsMax:epsMaxOf(d.id), epsHere:epsAt(d.id,lam),
          Ahere:absorbance(epsAt(d.id,lam),l,c), epsHi,
          all:BLSOLS.map(s=>({id:s.id, name:soluteById(s.solute).name,
                              eps:EPS[s.id], lamMax:lambdaMaxOf(s.id)}))};
}
function lawModel(){
  const d=currentBls(), l=cuvetteWidth(), c=ST.blConc, lam=activeWavelength();
  const eps=epsAt(d.id,lam);
  const N=101, cs=[], Ac=[], Tc=[], ls=[], Al=[], Tl=[];
  for(let i=0;i<=N;i++){
    const cc=d.cMax*i/N, ll=PHET.CUVETTE_MAX*i/N;
    cs.push(cc); Ac.push(absorbance(eps,l,cc)); Tc.push(transmittance(absorbance(eps,l,cc)));
    ls.push(ll); Al.push(absorbance(eps,ll,c)); Tl.push(transmittance(absorbance(eps,ll,c)));
  }
  /* T against A is the same curve for every solution: that is the point of the panel */
  const As=[], Ts=[];
  for(let i=0;i<=120;i++){ const A=4*i/120; As.push(A); Ts.push(transmittance(A)); }
  const A=absorbance(eps,l,c);
  return {d, l, c, lam, eps, A, T:transmittance(A),
          cs, Ac, Tc, ls, Al, Tl, As, Ts,
          Amax:absorbance(eps,PHET.CUVETTE_MAX,d.cMax),
          lines:[0.5,1,2].map(ll=>({l:ll, A:cs.map(cc=>absorbance(eps,ll,cc))})),
          linear:LINEAR_LIMIT, beyond:d.cMax>LINEAR_LIMIT};
}
function ledgerModel(){
  const B=beakerModel();
  /* the evaporation curve: with n held, C = n/V, clamped at Csat */
  const vs=[], cc=[], raw=[];
  for(let i=0;i<=160;i++){
    const V=PHET.VOL_MAX*(1-i/160);
    vs.push(V);
    cc.push(V>0?Math.min(B.cs,B.n/V):NaN);
    raw.push(V>0?B.n/V:NaN);
  }
  return {B, vs, C:cc, raw, Vsat:B.Vsat,
          /* the fifth field is the SHORT key the bar chart writes under its column:
             truncating the sentence gave "the dropper pu" */
          rows:[['the shaker put in', B.led.shaker,'mol', COL.pos, 'shaker'],
                ['the dropper put in', B.led.dropper,'mol', COL.pos, 'dropper'],
                ['the drain took out', -B.led.drained,'mol', COL.ref, 'drain'],
                ['still in the air', B.flying,'mol', COL.live, 'in air']],
          vrows:[['it started with', B.V0,'L', COL.struct, 'start'],
                 ['the faucet put in', B.led.faucet,'L', COL.pos, 'faucet'],
                 ['the dropper put in', B.led.dropperV,'L', COL.pos, 'dropper'],
                 ['the drain took out', -B.led.drainedV,'L', COL.ref, 'drain'],
                 ['evaporation took out', -B.led.evaporated,'L', COL.ref, 'evap']]};
}
function colourModel(){
  const id=SHOW_BEERS?ST.blSolution:ST.solute;
  const usable=hasSpectrum(id)?id:BLSOLS[0].id;
  const d=blsById(usable);
  const l=SHOW_BEERS?cuvetteWidth():ST.colourPath;
  const cHere=SHOW_BEERS?ST.blConc:Math.min(bkConc(BK),d.cMax);
  const N=24, sw=[];
  for(let i=0;i<=N;i++){
    const c=d.cMax*i/N;
    const t=trueRGB(usable,l,c,ST.illum);
    sw.push({c, true_:t.rgb, Ytrue:t.Y, phet:rampColor(usable,c),
             Yphet:relLum(rampColor(usable,c)),
             gap:Math.max(Math.abs(t.rgb[0]-rampColor(usable,c)[0]),
                          Math.abs(t.rgb[1]-rampColor(usable,c)[1]),
                          Math.abs(t.rgb[2]-rampColor(usable,c)[2]))});
  }
  let worst=0, worstC=0;
  for(const s of sw) if(s.gap>worst){ worst=s.gap; worstC=s.c; }
  const here=trueRGB(usable,l,cHere,ST.illum);
  const t=EPS[usable], Ts=[], xs=[], yb=[];
  for(let i=0;i<NLAM;i++){
    xs.push(LAM0+i);
    Ts.push(Math.pow(10,-t[i]*l*cHere));
    yb.push(CIE_Y[i]);
  }
  return {id:usable, name:soluteById(usable).name, d, l, c:cHere, sw, worst, worstC,
          here, phetHere:rampColor(usable,cHere), xs, T:Ts, ybar:yb,
          illum:ST.illum, illumName:ILLUM_LIST.filter(o=>o.id===ST.illum)[0].name,
          white:trueRGB(usable,l,0,ST.illum).rgb};
}
function solutesModel(){
  const rows=SOLUTES.map(s=>{
    const cLit=s.lit.gPerL/s.lit.M;
    return {s, cLit, dC:(s.cSat-cLit)/cLit, dM:(s.molarMass-s.lit.M)/s.lit.M,
            spectrum:hasSpectrum(s.id), lamMax:hasSpectrum(s.id)?lambdaMaxOf(s.id):null,
            epsMax:hasSpectrum(s.id)?epsMaxOf(s.id):null, pct:stockPercent(s)};
  });
  let worst=0;
  for(const r of rows) worst=Math.max(worst,Math.abs(r.dC));
  return {rows, worst, here:ST.solute};
}
function buildModel(){
  const v=ST.view, M={view:v};
  if(v==='beaker') M.B=beakerModel();
  else if(v==='cuvette') M.C=cuvetteModel();
  else if(v==='spectrum') M.S=spectrumModel();
  else if(v==='law') M.L=lawModel();
  else if(v==='ledger') M.G=ledgerModel();
  else if(v==='solutes') M.U=solutesModel();
  else M.K=colourModel();
  return M;
}

/* ================================================================== *
 *  readout / equation bar / tag                                       *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
/* scientific notation.  HTML gets real markup; the canvas gets `1.23e-7`, because a
   superscript minus is not in the rasteriser's font (BRIEF: letter subscripts and exotic
   superscripts are tofu, digits are fine). */
function sci(x,nd){
  if(x===null||x===undefined||!isFinite(x)) return '&mdash;';
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x)));
  const m=x/Math.pow(10,e);
  return fmt(m,nd===undefined?2:nd)+' &times; 10<sup>'+e+'</sup>';
}
function sciPlain(x,nd){
  if(x===null||x===undefined||!isFinite(x)) return '—';
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x)));
  const m=x/Math.pow(10,e);
  return fmt(m,nd===undefined?2:nd)+'e'+e;
}
function volStr(V){
  return ST.beakerUnits==='milliliters'
    ? fmt(V*1000,PHET.DEC_VOLUME===2?0:PHET.DEC_VOLUME)+' mL'

function roNote(M){
  const v=M.view;
  if(v==='beaker') return 'Everything here is a mole count. The meter reads nothing when its '
    +'probe is out of the solution, and it says so rather than inventing a number. Solid '
    +'appears the instant n/V passes C<sub>sat</sub>, with no kinetics &mdash; that is '
    +'PhET&rsquo;s model, and a real solid takes its time.';
  if(v==='cuvette') return 'A = &epsilon;lc and T = 10<sup>&minus;A</sup>, both exact. The '
    +'detector reads only while the light is on and the probe spans the beam, as PhET&rsquo;s '
    +'does. &epsilon; is looked up per nanometre, never interpolated.';
  if(v==='spectrum') return 'These are PhET&rsquo;s own digitised spectra: no literature '
    +'molar absorptivity could be sourced offline here, so nothing is claimed for them '
    +'beyond that they are what the original ships. The preset wavelength is the maximum of '
    +'the curve, found by scanning it.';
  if(v==='law') return 'A is linear in both c and l, so it is the quantity worth plotting; T '
    +'is not, which is why a spectrophotometer reports A. Above about 10 mM a real solution '
    +'stops obeying the law, and every one of PhET&rsquo;s millimolar ranges runs past that.';
  if(v==='ledger') return 'The ledger is the test: what went in minus what came out is what '
    +'is there, to the last bit. The drain is the subtle one &mdash; it takes solution, so '
    +'it carries solute at the DISSOLVED concentration and leaves the solid behind.';
  if(v==='solutes') return 'PhET&rsquo;s molar masses are the literature&rsquo;s to five '
    +'decimal places. Its saturation points are within a per cent for the four whose sources '
    +'quote a room-temperature figure; the rest differ because the source&rsquo;s temperature '
    +'is not 25 &deg;C, and the table says which is which.';
  return 'PhET&rsquo;s colour is an interpolation between fixed stops. The colour beside it '
    +'is worked out: 10<sup>&minus;&epsilon;(&lambda;)lc</sup> at every nanometre, integrated '
    +'against the CIE 1931 observer, adapted so the illuminant itself is white.';
}
function eqbarHTML(M){

/* ================================================================== *
 *  drawing helpers (y UP in world maps; layouts built bottom-up from *
 *  a measured caption) — from projects/simulations/build_buoy/       *
 *  p4_views.js by name, unchanged (make_helpers.py)                  *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the beaker (PhET's Concentration screen) and the cuvette (its      *
 *  Beer's Law screen)                                                 *
 * ================================================================== */

const CAP_BEAKER='PhET’s Concentration screen. The beaker holds 1 L and the solute amount '
  +'runs to 7 mol, both PhET’s. The liquid’s colour is PhET’s own three-stop '
  +'interpolation against concentration, not a transmission calculation — the true colour '
  +'view works that out. Each falling grain carries exactly 1/200 mol, PhET’s '
  +'particlesPerMole, and its moles arrive when it lands; the flight itself is drawn, not '
  +'modelled. PhET makes round(max(1, 0.2 x 200 x dt)) of them a frame, which at 60 fps is '
  +'one — so the shaker really delivers 0.30 mol/s against its own nominal 0.20. Solid '
  +'appears the instant n/V passes the saturation point, with no kinetics.';
const CAP_BEAKER_S='1 L beaker, 0–7 mol of solute (PhET). Colour is PhET’s '
  +'interpolation; each grain is 1/200 mol and counts when it lands.';

/* The caption is drawn last but owns the bottom of the stage from the moment it is
   measured.  Registering its rectangle is what lets lab() dodge it; without this the
   collision sweep found ninety overlaps, every one of them something-over-the-caption. */
function noteCaption(rc,left,capY,capTxt,capW){
  const n=wrapText(rc,capTxt,capW,CAP_FONT).length;
  LABELS.push([left,capY,left+capW,capY+n*14]);
}

/* ---- the beaker's own coordinates -------------------------------------------------- */
function bkX(b,u){ return b.x+u*b.w; }
function bkY(b,v){ return b.y1-v*b.h; }
function bkFromCanvas(b,X,Y){ return {x:(X-b.x)/b.w, y:(b.y1-Y)/b.h}; }

function beakerLayout(rc,W,H,capFull,capShort){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-52;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+26;
  const fit=fitCaption(rc,W,H-HINT_H,capFull,capShort,capW,top+210);
  const floor=fit.capY-26;
  /* the apparatus is a block: 118 px of headroom for the shaker and the faucet, then a
     beaker of its own proportions centred in whatever is left, rather than a short one
     pinned to the bottom of a tall stage */
  const band=floor-top-118;
  const bw=clamp((right-left)*0.42,190,430);
  const bh=clamp(Math.min(bw*0.92,band),120,430);
  const bx=left+86;
  const by=top+118+Math.max(0,(band-bh)/2);
  const bk=box(bx,by,bw,bh);
  noteCaption(rc,left,fit.capY,fit.txt,fit.capW);
  return {narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,top,floor,bk,
          headroom:by-top};
}

function drawGlass(rc,b,fill,fillFrac,W,H){
  /* the liquid first, then the glass over it, so the walls read as glass */
  const hgt=Math.max(0,fillFrac*b.h);
  if(hgt>0.5){
    rc.fillStyle=fill;
    rc.fillRect(b.x+1,b.y1-hgt,b.w-2,hgt);
    rc.fillStyle='rgba(255,255,255,.10)';
    rc.fillRect(b.x+1,b.y1-hgt,b.w-2,Math.min(4,hgt));
  }
  rc.strokeStyle=COL.glass; rc.lineWidth=2;
  rc.beginPath();
  rc.moveTo(b.x,b.y); rc.lineTo(b.x,b.y1); rc.lineTo(b.x1,b.y1); rc.lineTo(b.x1,b.y);
  rc.stroke();
  /* the graduations: PhET's beaker is 1 L, marked every fifth */
  rc.strokeStyle='rgba(143,184,212,.55)'; rc.lineWidth=1;
  rc.font=SM_FONT; rc.fillStyle='#7f8ca0'; rc.textAlign='left'; rc.textBaseline='middle';
  for(let k=1;k<=5;k++){
    const y=b.y1-b.h*k/5;
    const wLine=(k===5)?20:12;
    rc.beginPath(); rc.moveTo(b.x1-wLine,y); rc.lineTo(b.x1,y); rc.stroke();
    if(k%1===0&&k!==0){
      const v=PHET.BEAKER_VOLUME*k/5;
      lab(rc,W,H,b.x1+5,y,ST.beakerUnits==='milliliters'?fmt(v*1000,0):fmt(v,1),
          '#7f8ca0',SM_FONT,'left','middle');
    }
  }
}

function drawPrecipitate(rc,b,M){
  if(!(M.precip>0)) return;
  const n=Math.min(260,M.nParts);
  /* dark, not the solute's own colour: a saturated solution IS the solute's own colour,
     so grains painted in it disappear into the liquid they are sitting in */
  const col=mix('#05070c',rgbCss(M.sol.maxRGB),0.28);
  const col2=mix('#ffffff',rgbCss(M.sol.maxRGB),0.45);
  const r=makeRngB(9271);
  const bedH=Math.min(b.h*0.30,6+Math.sqrt(n)*2.4);
  for(let i=0;i<n;i++){
    const u=0.03+0.94*r(), v=r();
    const X=bkX(b,u), Y=b.y1-2-v*bedH;
    const s=3.2;
    rc.fillStyle=(i%3===0)?col2:col;
    rc.fillRect(X-s/2,Y-s/2,s,s);
  }
}

function drawShakerParticles(rc,b,M){
  const col=rgbCss(M.sol.maxRGB);
  rc.fillStyle=col;
  for(const p of M.parts){
    const X=bkX(b,p.x), Y=bkY(b,p.y), s=4;
    rc.fillRect(X-s/2,Y-s/2,s,s);
  }
}

/* the shaker, above the beaker, in the SOLID form */
function drawShaker(rc,b,M,active,W,H){
  const cx=bkX(b,0.34), cy=b.y-64;
  rc.save();
  rc.translate(cx,cy); rc.rotate(-0.42);
  rc.fillStyle=active?'#2b3346':'#1b2130';
  rc.fillRect(-34,-13,68,26);
  rc.strokeStyle=active?COL.pos:'#39415a'; rc.lineWidth=1.5;
  rc.strokeRect(-34,-13,68,26);
  rc.fillStyle=rgbCss(M.sol.maxRGB);
  rc.fillRect(26,-9,10,18);
  rc.restore();
  lab(rc,W,H,cx-40,cy-24,'shaker — '+M.sol.formula,COL.dim,SM_FONT,'left','middle');
}
/* the dropper, above the beaker, in the SOLUTION form */
function drawDropper(rc,b,M,active,W,H){
  const cx=bkX(b,0.52), cy=b.y-70;
  rc.fillStyle='#1b2130'; rc.fillRect(cx-15,cy-26,30,40);
  rc.strokeStyle=active?COL.pos:'#39415a'; rc.lineWidth=1.5;
  rc.strokeRect(cx-15,cy-26,30,40);
  rc.fillStyle=rgbCss(schemeColor(M.sol.id,M.sol.stock));
  rc.fillRect(cx-11,cy-22,22,32);
  rc.fillStyle='#1b2130'; rc.fillRect(cx-5,cy+14,10,12);
  if(active){
    rc.fillStyle=rgbCss(schemeColor(M.sol.id,M.sol.stock));
    rc.fillRect(cx-2.5,cy+26,5,b.y1-b.h*M.fill-cy-26);
  }
  lab(rc,W,H,cx+22,cy-16,'dropper — '+fmt(M.sol.stock,1)+' mol/L stock',
      COL.dim,SM_FONT,'left','middle');
}
function drawFaucet(rc,b,M,on,side,W,H){
  const x=side==='in'?b.x-58:b.x1+54;
  const y=side==='in'?b.y-52:b.y1-14;
  const surf=b.y1-b.h*M.fill;
  if(side==='in'){
    /* a pipe from off-stage, a body, and a spout pointing down into the beaker */
    rc.fillStyle='#161c28'; rc.fillRect(0,y-8,x-26,12);
    rc.fillStyle='#1b2130'; rc.fillRect(x-26,y-12,40,20);
    rc.strokeStyle=on?COL.struct:'#39415a'; rc.lineWidth=1.5;
    rc.strokeRect(x-26,y-12,40,20);
    rc.fillStyle='#1b2130'; rc.fillRect(x+6,y-12,10,24);
    rc.strokeRect(x+6,y-12,10,24);
    if(on){
      rc.fillStyle='rgba(120,190,230,.55)';
      rc.fillRect(x+8,y+12,6,Math.max(0,surf-y-12));
    }
    lab(rc,W,H,x-26,y-24,'water 0.25 L/s',COL.dim,SM_FONT,'left','middle');
  } else {
    /* the drain leaves the beaker's floor and goes off to the right */
    rc.fillStyle='#161c28'; rc.fillRect(b.x1,y-3,x-26-b.x1,8);
    rc.fillStyle='#1b2130'; rc.fillRect(x-26,y-12,40,20);
    rc.strokeStyle=on?COL.struct:'#39415a'; rc.lineWidth=1.5;
    rc.strokeRect(x-26,y-12,40,20);
    if(on){
      rc.fillStyle=rgbCss(M.rgb);
      rc.fillRect(b.x1,y-1,x-26-b.x1,4);
      rc.fillRect(x-10,y+8,6,26);
    }
    lab(rc,W,H,x-20,y+38,'drain 0.25 L/s',COL.dim,SM_FONT,'left','middle');
  }
}
/* PhET's concentration meter: a body with a reading, and a probe on a wire */
function drawMeter(rc,b,M,W,H){
  const px=bkX(b,PROBE.x), py=bkY(b,PROBE.y);
  const bodyX=Math.min(b.x1+64,b.x1+64), bodyY=b.y+6;
  /* the wire, as an explicit polyline: bezierCurveTo is not in the display-list
     recorder, so a curve drawn with it records as nothing at all */
  rc.strokeStyle='#4c5570'; rc.lineWidth=1.6;
  rc.beginPath();
  rc.moveTo(px,py-26);
  for(let i=1;i<=12;i++){
    const t=i/12, u=1-t;
    rc.lineTo(u*u*u*px+3*u*u*t*px+3*u*t*t*(bodyX+10)+t*t*t*(bodyX+18),
              u*u*u*(py-26)+3*u*u*t*(py-70)+3*u*t*t*(bodyY+64)+t*t*t*(bodyY+40));
  }
  rc.stroke();
  /* the probe */
  rc.fillStyle=M.probeIn?'#2b3346':'#1b2130';
  rc.fillRect(px-7,py-26,14,26);
  rc.strokeStyle=M.probeIn?COL.pos:'#6a7490'; rc.lineWidth=1.5;
  rc.strokeRect(px-7,py-26,14,26);
  rc.fillStyle=M.probeIn?COL.pos:'#6a7490';
  rc.fillRect(px-3,py-4,6,4);
  /* the body */
  const bw2=104, bh2=46;
  rc.fillStyle='#10141d'; rc.fillRect(bodyX,bodyY,bw2,bh2);
  frame(rc,box(bodyX,bodyY,bw2,bh2),'#39415a');
  rc.font=SM_FONT; rc.fillStyle=COL.dim; rc.textAlign='left'; rc.textBaseline='top';
  rc.fillText('concentration',bodyX+7,bodyY+6);
  rc.font='italic 15px Georgia, serif';
  rc.fillStyle=M.probeIn?COL.pos:'#6a7490'; rc.textBaseline='middle';
  rc.fillText(M.probeIn?(ST.meterUnits==='molar'?fmt(M.reading,PHET.DEC_CONC)
                                                :fmt(M.reading,PHET.DEC_PERCENT))
                       :'—',bodyX+7,bodyY+30);
  rc.font=SM_FONT; rc.fillStyle=COL.dim;
  rc.fillText(ST.meterUnits==='molar'?'mol/L':'%',bodyX+68,bodyY+30);
  if(!M.probeIn)
    lab(rc,W,H,bodyX+bw2/2,bodyY+bh2+13,'probe out of the solution',COL.dim,SM_FONT,'center','middle');
}

function viewBeaker(rc,W,H,M){
  const B=M.B, L=beakerLayout(rc,W,H,CAP_BEAKER,CAP_BEAKER_S), b=L.bk;
  if(ST.form==='solid') drawShaker(rc,b,B,ST.shaking,W,H);
  else drawDropper(rc,b,B,ST.dropper,W,H);
  drawFaucet(rc,b,B,ST.faucet,'in',W,H);
  drawFaucet(rc,b,B,ST.drain,'out',W,H);
  drawGlass(rc,b,rgbCss(B.rgb),B.fill,W,H);
  drawPrecipitate(rc,b,B);
  drawShakerParticles(rc,b,B);
  drawMeter(rc,b,B,W,H);
  /* the evaporation tray under the beaker */
  if(ST.evap>0){
    rc.strokeStyle=COL.ref; rc.lineWidth=1.4;
    const surf=b.y1-b.h*B.fill;
    for(let k=0;k<5;k++){
      const x=bkX(b,0.18+0.16*k);
      rc.beginPath();
      rc.moveTo(x,surf-6);
      for(let i=1;i<=9;i++){
        const t=i/9;
        rc.lineTo(x+6*Math.sin(t*PI*2),surf-6-36*t);
      }
      rc.stroke();
    }
    lab(rc,W,H,bkX(b,0.5),b.y1-b.h*B.fill-52,'evaporating '+fmt(ST.evap,3)+' L/s',
        COL.ref,SM_FONT,'center','middle');
  }
  /* PhET's "Saturated!" flag, on a pad ABOVE the liquid: dark orange on a bright
     solution is unreadable, and over the grains it is worse */
  if(B.sat){
    const x=bkX(b,0.5), y=Math.max(b.y+16,b.y1-b.h*B.fill-16);
    rc.fillStyle='rgba(10,12,18,.82)'; rc.fillRect(x-48,y-11,96,22);
    frame(rc,box(x-48,y-11,96,22),'#3a2a18');
    rc.font='italic 14px Georgia, serif'; rc.textAlign='center'; rc.textBaseline='middle';
    rc.fillStyle=COL.solid; rc.fillText('Saturated!',x,y);
  }
  /* the two optional readouts PhET puts on the beaker */
  if(ST.showAmount)
    lab(rc,W,H,bkX(b,0.5),b.y-16,'Solute Amount: '+fmt(B.grams,0)+' g',COL.pos,LAB_FONT,'center','middle');
  if(ST.showVolume)
    lab(rc,W,H,b.x-10,bkY(b,B.fill),volPlain(B.V),COL.struct,LAB_FONT,'right','middle');
  /* the numbers, as a strip to the right of the meter -- only where there is room for
     it, which at 560 px of stage there is not */
  const SW=156;
  const sx=b.x1+64, sy=b.y+78;
  if(sx+SW<=W-8&&sy+7*16<L.floor){
    const rows=[['n, solute',molStr(B.n),COL.pos],
                ['V, solution',volPlain(B.V),COL.struct],
                ['C = n/V',fmt(B.C,3)+' mol/L',COL.pos],
                ['C sat',fmt(B.cs,2)+' mol/L',COL.ref],
                ['solid',B.precip>0?fmt(B.precip,3)+' mol':'none',COL.solid],
                ['mass %',fmt(B.percent,1)+' %',COL.dim]];
    rows.forEach((r,i)=>{
      const y=sy+i*16;
      lab(rc,W,H,sx,y,r[0],COL.dim,SM_FONT,'left','middle');
      lab(rc,W,H,sx+SW,y,plain(r[1]),r[2],SM_FONT,'right','middle');
    });
    const gy=sy+rows.length*16+10;
    rc.fillStyle=COL.off; rc.fillRect(sx,gy,SW,7);
    rc.fillStyle=COL.pos; rc.fillRect(sx,gy,SW*clamp(B.n/PHET.SOLUTE_MOL_MAX,0,1),7);
    lab(rc,W,H,sx,gy+18,'solute, of PhET’s 7 mol ceiling',COL.dim,SM_FONT,'left','middle');
  }
  drawCaption(rc,{left:L.left,capY:L.capY,capTxt:L.capTxt,capW:L.capW});
}


/* ================================================================== *
 *  the cuvette (PhET's Beer's Law screen).  Built only into           *
 *  beers-law-lab.html: concentration.html has no light source.        *
 * ================================================================== */
/* ---- the cuvette ------------------------------------------------------------------- */
const CAP_CUVETTE='PhET’s Beer’s Law screen, drawn to scale: the bench is in '
  +'centimetres and the cuvette is as wide as the number beside it. The beam’s colour is '
  +'the wavelength’s own, and its brightness past the cuvette is the transmittance, so the '
  +'picture and the reading are the same number. A = εlc and T = 10^-A exactly; '
  +'ε is looked up at one value per nanometre and never interpolated.';
const CAP_CUVETTE_S='Beer’s Law screen to scale. Beam brightness past the cuvette IS the '
  +'transmittance. A = εlc, T = 10^-A, ε per nanometre.';

function cuvetteLayout(rc,W,H){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-52;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+26;
  const fit=fitCaption(rc,W,H-HINT_H,CAP_CUVETTE,CAP_CUVETTE_S,capW,top+200);
  const floor=fit.capY-40;
  const BENCH_CM=8.4;                     /* how much of the bench is drawn, in cm */
  const CUV0=2.2;                         /* where the cuvette's LEFT face sits on it */
  const px=clamp((right-left-40)/BENCH_CM,26,120);
  const x0=left+24;                       /* the bench's own zero, in canvas x */
  const axis=Math.round((top+floor)/2)-14;        /* the beam axis */
  noteCaption(rc,left,fit.capY,fit.txt,fit.capW);
  return {narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,top,floor,
          px,x0,axis,BENCH_CM,CUV0,
          X:cm=>x0+cm*px, cmOf:X=>(X-x0)/px};
}
function viewCuvette(rc,W,H,M){
  const C=M.C, L=cuvetteLayout(rc,W,H);
  const axis=L.axis, px=L.px;
  const hCuv=Math.min(190,Math.max(70,(L.floor-L.top)*0.50));
  const xL=L.X(L.CUV0), xR=L.X(L.CUV0+C.l);
  const xSrc0=L.X(0.15), xSrc1=L.X(1.05);
  const beamHalf=Math.max(3,BEAM_HALF*px);
  const wave=rgbCss(C.wave);
  /* the source */
  rc.fillStyle='#161c28'; rc.fillRect(xSrc0,axis-26,xSrc1-xSrc0,52);
  frame(rc,box(xSrc0,axis-26,xSrc1-xSrc0,52),C.on?COL.struct:'#39415a');
  rc.fillStyle=C.on?wave:'#2a3040';
  rc.fillRect(xSrc1-8,axis-beamHalf,8,2*beamHalf);
  lab(rc,W,H,xSrc0,axis+40,C.on?'source '+fmt(C.lam,0)+' nm':'source off',
      C.on?COL.struct:COL.dim,SM_FONT,'left','middle');
  /* the cuvette's own colour goes down FIRST: the beam has to be drawn ON it, or the
     one thing this view exists to show is painted over */
  rc.fillStyle=mix('#070b18',rgbCss(C.rgb),0.92);
  rc.fillRect(xL,axis-hCuv/2,xR-xL,hCuv);
  /* the beam in, through, and out.  The run before the glass is a real centimetre and a
     bit, so the brightness the cuvette takes out of it has something to be compared with */
  if(C.on){
    rc.fillStyle=wave;
    rc.globalAlpha=0.78;
    rc.fillRect(xSrc1,axis-beamHalf,xL-xSrc1,2*beamHalf);
    rc.globalAlpha=1;
    /* inside the cuvette the beam dies off exponentially -- drawn in 24 slabs, each with
       the transmittance of the depth it sits at, which is the same 10^-eps l c the
       detector reads */
    const NS=24;
    for(let i=0;i<NS;i++){
      const d0=C.l*i/NS, d1=C.l*(i+1)/NS;
      const t=transmittance(absorbance(C.eps,(d0+d1)/2,C.c));
      rc.globalAlpha=0.78*clamp(t,0.02,1);
      rc.fillStyle=wave;
      rc.fillRect(L.X(L.CUV0+d0),axis-beamHalf,L.X(d1)-L.X(d0)+0.6,2*beamHalf);
    }
    rc.globalAlpha=0.78*clamp(C.T,0.02,1);
    rc.fillStyle=wave;
    rc.fillRect(xR,axis-beamHalf,L.X(L.BENCH_CM)-xR,2*beamHalf);
    rc.globalAlpha=1;
  }
  /* the glass itself, over the fill and the beam */
  rc.strokeStyle=COL.glass; rc.lineWidth=2;
  rc.beginPath();
  rc.moveTo(xL,axis-hCuv/2); rc.lineTo(xL,axis+hCuv/2);
  rc.lineTo(xR,axis+hCuv/2); rc.lineTo(xR,axis-hCuv/2);
  rc.stroke();
  /* the draggable right wall */
  rc.fillStyle=DRAG.what==='cuvette'?COL.live:COL.glass;
  rc.fillRect(xR-3,axis-hCuv/2-10,6,20);
  rc.fillRect(xR-3,axis+hCuv/2-10,6,20);
  lab(rc,W,H,(xL+xR)/2,axis+hCuv/2+16,'l = '+fmt(C.l,2)+' cm — drag the right wall',
      COL.glass,LAB_FONT,'center','middle');
  /* the detector: a probe on a wire into a body */
  const dx=L.X(L.CUV0+DET.x), dy=axis-DET.y*px;
  const sensor=Math.max(8,SENSOR_HALF*px);
  /* an explicit polyline, for the same reason the meter's wire is one */
  rc.strokeStyle='#4c5570'; rc.lineWidth=1.6;
  rc.beginPath();
  rc.moveTo(dx,dy+sensor);
  { const x3=L.X(L.BENCH_CM)-40, y3=L.floor-26, x2=L.X(L.BENCH_CM)-50, y2=L.floor-40;
    for(let i=1;i<=12;i++){
      const t=i/12, u=1-t;
      rc.lineTo(u*u*u*dx+3*u*u*t*dx+3*u*t*t*x2+t*t*t*x3,
                u*u*u*(dy+sensor)+3*u*u*t*(dy+sensor+52)+3*u*t*t*y2+t*t*t*y3);
    } }
  rc.stroke();
  rc.fillStyle=C.inBeam&&C.on?'#2b3346':'#1b2130';
  rc.fillRect(dx-9,dy-sensor,18,2*sensor);
  rc.strokeStyle=(C.inBeam&&C.on)?COL.pos:'#6a7490'; rc.lineWidth=1.6;
  rc.strokeRect(dx-9,dy-sensor,18,2*sensor);
  const bodyX=Math.min(W-152,L.X(L.BENCH_CM)-44), bodyY=L.floor-58;
  rc.fillStyle='#10141d'; rc.fillRect(bodyX,bodyY,126,50);
  frame(rc,box(bodyX,bodyY,126,50),'#39415a');
  rc.font=SM_FONT; rc.fillStyle=COL.dim; rc.textAlign='left'; rc.textBaseline='top';
  rc.fillText(C.det==='absorbance'?'absorbance':'transmittance',bodyX+7,bodyY+6);
  rc.font='italic 17px Georgia, serif'; rc.textBaseline='middle';
  rc.fillStyle=C.reading===null?'#6a7490':COL.pos;
  rc.fillText(C.reading===null?'—'
              :(C.det==='absorbance'?fmt(C.A,PHET.DEC_A):fmt(100*C.T,PHET.DEC_T)),
              bodyX+7,bodyY+31);
  if(C.reading!==null&&C.det!=='absorbance'){
    rc.font=SM_FONT; rc.fillStyle=COL.dim; rc.fillText('%',bodyX+66,bodyY+33);
  }
  if(C.reading===null)
    /* above the body, not below it: below is the bench ruler */
    lab(rc,W,H,bodyX+63,bodyY-11,C.on?'probe is out of the beam':'the light is off',
        COL.dim,SM_FONT,'center','middle');
  /* the bench ruler, so the centimetres are visible rather than asserted */
  const ry=L.floor+6;
  rc.strokeStyle='#39415a'; rc.lineWidth=1;
  rc.beginPath(); rc.moveTo(L.X(0),ry); rc.lineTo(L.X(L.BENCH_CM),ry); rc.stroke();
  rc.font=SM_FONT; rc.fillStyle='#6f7789'; rc.textAlign='center'; rc.textBaseline='top';
  for(let k=0;k<=Math.floor(L.BENCH_CM);k++){
    const x=L.X(k);
    rc.beginPath(); rc.moveTo(x,ry); rc.lineTo(x,ry+5); rc.stroke();
    rc.fillText(''+k,x,ry+7);
  }
  lab(rc,W,H,L.X(0),ry+27,'centimetres, '+fmt(px,0)+' px each',COL.dim,SM_FONT,'left','middle');
  /* the arithmetic, written out where the beam is */
  const ax=L.left, ay=L.top+4;
  const lines=[['A = eps l c',COL.pos],
               ['  = '+fmt(C.eps,3)+' × '+fmt(C.l,2)+' × '+sciPlain(C.c,3)
                +' = '+fmt(C.A,4),COL.pos],
               ['T = 10^-A = '+fmt(100*C.T,3)+' %',COL.struct],
               ['eps at '+fmt(C.lam,0)+' nm'+(C.atMax?' (the peak)':''),COL.dim]];
  lines.forEach((r,i)=>{ lab(rc,W,H,ax,ay+i*15,r[0],r[1],LAB_FONT,'left','middle'); });
  if(C.beyondLinear)
    lab(rc,W,H,ax,ay+lines.length*15+6,
        'c is past 10 mM: a real solution stops being linear there',COL.ref,SM_FONT,'left','middle');
  drawCaption(rc,{left:L.left,capY:L.capY,capTxt:L.capTxt,capW:L.capW});
}

/* The shared axes() is given a tick COUNT, and one count cannot serve a 1400 px stage
   and a 560 px one: six y labels in a 90 px panel overlap each other.  axesFit() derives
   both counts from the panel's own size, and drops the x tick sitting exactly on the left
   edge -- the y label at that same corner is a pixel away from it, and a 1 px graze is a
   visible antialiased smear, not a rounding (Known-bad, wave_fronts). */
function axesFit(rc,b,xlo,xhi,ylo,yhi,opt){
  const o={};
  for(const k in (opt||{})) o[k]=opt[k];
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi);
  const ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  if(!o.xticks){
    const t=ticksFor(xa,xb,b.w<210?3:(b.w<360?4:6));
    const span=Math.abs(xhi-xlo)||1;
    const f=t.filter(v=>Math.abs(v-xlo)>1e-9*span);
    o.xticks=f.length?f:t;
  }
  if(!o.yticks) o.yticks=ticksFor(ya,yb,b.h<110?3:(b.h<180?4:5));
  axesR(rc,b,xlo,xhi,ylo,yhi,o);
}

/* legendAuto() dodges data curves and nothing else, so every legend in the collection
   is free to land on a label that lab() has already placed (Known-bad, pupil_plane).
   legendFit() tests the SAME corner list against both registries and then records its own
   text rectangle, so whatever is drawn afterwards dodges the legend in turn.  It is drawn
   after the curves, because the curve registry is what picks the corner. */
function legendFit(rc,b,items){
  rc.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,rc.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) for(const o of LABELS)
      if(cx+22<o[2]-0.5&&cx+bw>o[0]+0.5&&cy<o[3]-0.5&&cy+bh>o[1]+0.5){ hit=true; break; }
    if(!hit){ legendBox(rc,cx,cy,items); LABELS.push([cx+22,cy,cx+bw,cy+bh]); return true; }
  }
  return false;                       /* nowhere clear: draw none rather than a lying one */
}

/* the house stage layout, with the bottom line kept clear of the HTML hint
   (build/wave-on-a-string/, Known-bad) */
function layoutPanels(rc,W,H,capFull,capShort,nBottom,bottomFrac){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(rc,W,H-HINT_H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?Math.min(1,nBottom):nBottom;
  noteCaption(rc,left,fit.capY,fit.txt,fit.capW);
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,bottom:[]};
  /* with no bottom row the main panel runs to the caption, and its x tick labels and axis
     name hang 21 px BELOW its box -- so the box has to stop short of them */
  let mainH=avail-30;
  if(nB>0){
    const rowH=Math.max(86,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-58;
    const gut=54, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++)
      out.bottom.push(box(left+gut+i*(w+gut),fit.capY-18-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}

/* ---------------------------------------------------------------- the ledger --------- */
const CAP_LEDGER='The beaker as bookkeeping. Every mole that goes in or out is counted, and '
  +'the residual printed beside the bars is what does not balance — it is zero, to the '
  +'last bit of a double, and the Python twin closes the same ledger exactly in rationals. '
  +'The drain is the one worth watching: it removes SOLUTION, so it carries solute away at '
  +'the dissolved concentration min(C, C sat) and leaves the solid on the bottom. The curve '
  +'is C = n/V with the moles held fixed, which is exactly what evaporating does: a '
  +'hyperbola up to the saturation volume n/C sat, flat after it, and the difference falls '
  +'out as solid.';
const CAP_LEDGER_S='Moles in minus moles out is what is in the beaker, to the last bit. '
  +'Evaporating follows C = n/V up to V = n/C sat, then C is pinned and solid appears.';

function waterfall(rc,p,rows,unit,W,H){
  let hi=0;
  for(const r of rows) hi=Math.max(hi,Math.abs(r[1]));
  hi=Math.max(hi,1e-6)*1.25;
  const n=rows.length, bw=Math.min(46,(p.w-14)/n-8);
  rc.font=SM_FONT;
  const zero=p.y1-14;
  rc.strokeStyle='#2a3040'; rc.lineWidth=1;
  rc.beginPath(); rc.moveTo(p.x,zero); rc.lineTo(p.x1,zero); rc.stroke();
  const colW=(p.w-14)/n;
  rows.forEach((r,i)=>{
    const x=p.x+10+i*colW;
    /* 22 px of headroom: the value label sits above the bar and the panel's note above
       that, and a full-height bar used to push one into the other */
    const hgt=(Math.abs(r[1])/hi)*(zero-p.y-22);
    rc.fillStyle=r[3];
    if(r[1]>=0) rc.fillRect(x,zero-hgt,bw,hgt);
    else rc.fillRect(x,zero,bw,Math.min(hgt,p.y1-zero-1));
    /* through lab(), so a tall bar's value dodges the panel note above it rather than
       landing on it at 560 x 380 */
    lab(rc,W,H,x+bw/2,(r[1]>=0?zero-hgt-9:zero+hgt+7),fmt(Math.abs(r[1]),3),r[3],
        SM_FONT,'center','middle');
    rc.textAlign='center'; rc.textBaseline='bottom';
    /* the key, truncated to the column it belongs to -- measured, not guessed */
    rc.fillStyle=COL.dim; rc.textBaseline='top';
    let key=plain(r[4]||r[0]);
    while(key.length>3&&rc.measureText(key).width>colW-6) key=key.slice(0,-1);
    rc.fillText(key,x+bw/2,p.y1-11);
  });
  lab(rc,W,H,p.x1-2,p.y+10,unit,COL.dim,SM_FONT,'right','middle');
}

function viewLedger(rc,W,H,M){
  const G=M.G, B=G.B, L=layoutPanels(rc,W,H,CAP_LEDGER,CAP_LEDGER_S,2,0.40);
  const b=L.main;
  const chi=Math.max(B.cs*1.35,0.2);
  axesFit(rc,b,0,PHET.VOL_MAX,0,chi,{
    title:'C = n/V as the volume changes, with n held at '+fmt(B.n,3)+' mol',
    xlab:'solution volume, L',ylab:'concentration, mol/L',
    xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,1)});
  /* the uncapped hyperbola, then the capped one the beaker actually reads */
  polyline(rc,b,G.vs,G.raw,0,PHET.VOL_MAX,0,chi,shade(COL.ref,0.55),1.2,[5,4]);
  polyline(rc,b,G.vs,G.C,0,PHET.VOL_MAX,0,chi,COL.pos,2.2);
  polyline(rc,b,[0,PHET.VOL_MAX],[B.cs,B.cs],0,PHET.VOL_MAX,0,chi,COL.ref,1.3,[4,4]);
  lab(rc,W,H,b.x1-4,b.y1-b.h*B.cs/chi-10,'C sat = '+fmt(B.cs,2)+' mol/L',
      COL.ref,LAB_FONT,'right','middle');
  if(B.n>0&&B.Vsat<PHET.VOL_MAX){
    const xv=b.x+b.w*B.Vsat/PHET.VOL_MAX;
    rc.strokeStyle=COL.solid; rc.lineWidth=1.2; rc.setLineDash([3,3]);
    rc.beginPath(); rc.moveTo(xv,b.y); rc.lineTo(xv,b.y1); rc.stroke(); rc.setLineDash([]);
    lab(rc,W,H,xv+5,b.y+30,'saturates at V = n/C sat = '+fmt(B.Vsat,4)+' L',
        COL.solid,SM_FONT,'left','middle');
  }
  if(B.V>0) marker(rc,b,0,PHET.VOL_MAX,0,chi,B.V,B.C,COL.live);
  legendFit(rc,b,[[COL.pos,'what the meter reads'],[shade(COL.ref,0.55),'n/V, uncapped'],
                   [COL.ref,'saturation']]);
  if(B.tSat!==null)
    lab(rc,W,H,b.x+8,b.y+14,'evaporating at '+fmt(ST.evap>0?ST.evap:PHET.EVAPORATION_MAX,3)
        +' L/s reaches it in '+fmt(B.tSat,2)+' s',COL.dim,SM_FONT,'left','middle');
  if(L.bottom[0]){
    const p=L.bottom[0];
    frame(rc,p,'#242a3a');
    lab(rc,W,H,p.x,p.y-11,'the mole ledger',COL.dim,'italic 13px Georgia, serif','left','bottom');
    /* the note costs the bars twelve pixels of headroom, which a 560 px stage has not
       got: there it is dropped and the readout carries the same two numbers */
    if(!isNarrow(W))
      lab(rc,W,H,p.x+6,p.y+12,'in beaker '+fmt(B.n,4)+' mol, residual '+sciPlain(B.resid.n,1),
          Math.abs(B.resid.n)>1e-12?COL.ref:COL.pos,SM_FONT,'left','middle');
    waterfall(rc,p,G.rows,'mol',W,H);
  }
  if(L.bottom[1]){
    const p=L.bottom[1];
    frame(rc,p,'#242a3a');
    lab(rc,W,H,p.x,p.y-11,'the volume ledger',COL.dim,'italic 13px Georgia, serif','left','bottom');
    if(!isNarrow(W))
      lab(rc,W,H,p.x+6,p.y+12,'in beaker '+fmt(B.V,4)+' L, residual '+sciPlain(B.resid.V,1),
          Math.abs(B.resid.V)>1e-12?COL.ref:COL.pos,SM_FONT,'left','middle');
    waterfall(rc,p,G.vrows,'L',W,H);
  }
  drawCaption(rc,{left:L.left,capY:L.capY,capTxt:L.capTxt,capW:L.capW});
}

/* ---------------------------------------------------------------- true colour -------- */
const CAP_COLOUR='PhET’s colour is an interpolation between fixed stops; the row beside '
  +'it is what the solution actually transmits. T(λ) = 10^-(eps l c) '
  +'at every nanometre, integrated against the CIE 1931 2° observer on the same 1 nm '
  +'grid the spectra live on — nothing interpolated, nothing resampled — then '
  +'adapted so the illuminant itself renders exactly white, so an empty cuvette is '
  +'rgb(255,255,255). The gap is large, and it is not mainly brightness: PhET’s ramp '
  +'has no path length in it at all, so it cannot know the difference between a thin cuvette '
  +'and a thick one. Two illuminants are offered because no D65 spectrum could be sourced '
  +'offline; equal energy is flat by definition and illuminant A comes from the CIE’s '
  +'own formula.';
const CAP_COLOUR_S='PhET’s ramp against the transmitted colour: 10^-(eps l c)'
  +' per nanometre through the CIE observer, adapted so the illuminant is white.';

function viewColour(rc,W,H,M){
  const K=M.K, L=layoutPanels(rc,W,H,CAP_COLOUR,CAP_COLOUR_S,2,0.38);
  const b=L.main;
  frame(rc,b,'#242a3a');
  const n=K.sw.length, cw=b.w/n;
  /* laid out from what the panel HAS: two rows, their two headings, the tick numbers and
     the axis line under them all have to fit inside b, or the axis title is dropped */
  const rowH=clamp((b.h-106)/2,14,120);
  const yT=b.y+26, yP=yT+rowH+22;
  const yAxis=yP+rowH+5, roomForTitle=(yAxis+30<=b.y1);
  for(let i=0;i<n;i++){
    rc.fillStyle=rgbCss(K.sw[i].true_);
    rc.fillRect(b.x+i*cw,yT,cw+0.6,rowH);
    rc.fillStyle=rgbCss(K.sw[i].phet);
    rc.fillRect(b.x+i*cw,yP,cw+0.6,rowH);
  }
  frame(rc,box(b.x,yT,b.w,rowH),'#242a3a');
  frame(rc,box(b.x,yP,b.w,rowH),'#242a3a');
  lab(rc,W,H,b.x+4,yT-10,'what '+fmt(K.l,2)+' cm of it really transmits, under '
      +plain(K.illumName),COL.pos,LAB_FONT,'left','middle');
  lab(rc,W,H,b.x+4,yP-8,'PhET’s interpolation between its two stops',
      COL.ref,LAB_FONT,'left','middle');
  /* the concentration axis under the swatches */
  rc.font=SM_FONT; rc.fillStyle='#6f7789'; rc.textAlign='center'; rc.textBaseline='top';
  const nTick=b.w<320?3:5;
  for(let k=0;k<nTick;k++){
    const c=K.d.cMax*k/(nTick-1), x=b.x+b.w*k/(nTick-1);
    rc.fillText(fmt(c*K.d.scale,0),clamp(x,b.x+12,b.x1-12),yAxis);
  }
  if(roomForTitle)
    lab(rc,W,H,b.x+6,yAxis+21,'concentration, '+K.d.transform,COL.dim,LAB_FONT,'left','middle');
  /* the worst gap, marked */
  const xg=b.x+b.w*clamp(K.worstC/K.d.cMax,0,1);
  rc.strokeStyle=COL.live; rc.lineWidth=1.4;
  rc.beginPath(); rc.moveTo(xg,yT-4); rc.lineTo(xg,yP+rowH+4); rc.stroke();
  lab(rc,W,H,b.x1-4,roomForTitle?yAxis+21:b.y+12,
      'worst channel gap '+fmt(K.worst,0)+' of 255',COL.live,SM_FONT,'right','middle');
  /* where the beaker or the cuvette is now */
  const xh=b.x+b.w*clamp(K.c/K.d.cMax,0,1);
  rc.fillStyle=COL.live;
  rc.beginPath();
  rc.moveTo(xh,yT-16); rc.lineTo(xh-5,yT-24); rc.lineTo(xh+5,yT-24);
  rc.closePath(); rc.fill();
  if(L.bottom[0]){
    const p=L.bottom[0];
    axesFit(rc,p,LAM0,LAM1,0,1.05,{title:'T(λ) here, with the eye’s own weight',
      xlab:'nm',ylab:'T',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    polyline(rc,p,K.xs,K.ybar,LAM0,LAM1,0,1.05,shade(COL.eye,0.5),1.2,[4,3]);
    polyline(rc,p,K.xs,K.T,LAM0,LAM1,0,1.05,COL.pos,1.9);
    legendFit(rc,p,[[COL.pos,'T(λ)'],[shade(COL.eye,0.5),'y-bar(λ)']]);
  }
  if(L.bottom[1]){
    const p=L.bottom[1];
    const cs=K.sw.map(s=>s.c*K.d.scale), yt=K.sw.map(s=>s.Ytrue), yp=K.sw.map(s=>s.Yphet);
    axesFit(rc,p,0,K.d.cMax*K.d.scale,0,1.05,{title:'how much light is left',
      xlab:'concentration, '+K.d.transform,ylab:'relative',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    polyline(rc,p,cs,yt,0,K.d.cMax*K.d.scale,0,1.05,COL.pos,1.9);
    polyline(rc,p,cs,yp,0,K.d.cMax*K.d.scale,0,1.05,COL.ref,1.6,[5,4]);
    legendFit(rc,p,[[COL.pos,'transmitted, measured'],[COL.ref,'luminance of PhET’s swatch']]);
    marker(rc,p,0,K.d.cMax*K.d.scale,0,1.05,K.c*K.d.scale,K.here.Y,COL.live);
  }
  drawCaption(rc,{left:L.left,capY:L.capY,capTxt:L.capTxt,capW:L.capW});
}

 *  the spectrum and the law.  Built only into beers-law-lab.html.     *
