/* ---------------------------------------------------------------- the spectrum ------- */
/* a 1 nm strip of the visible spectrum, drawn under a plot box whose x axis is in nm */
function spectrumStrip(rc,b,xlo,xhi,y,h){
  const n=Math.max(2,Math.round(b.w));
  for(let i=0;i<n;i++){
    const lam=xlo+(xhi-xlo)*(i+0.5)/n;
    rc.fillStyle=waveCss(lam);
    rc.fillRect(b.x+b.w*i/n,y,b.w/n+0.8,h);
  }
  frame(rc,box(b.x,y,b.w,h),'#242a3a');
}

const CAP_SPEC='PhET’s eight absorption spectra, one molar absorptivity per nanometre '
  +'from 380 to 780 nm exactly as the original ships them. The preset wavelength is the '
  +'maximum of the curve, found by scanning it, and ε is looked up rather than '
  +'interpolated — 500.0 nm and 500.9 nm read the same cell. NO literature molar '
  +'absorptivity could be sourced offline for these, so they stand as PhET’s data and '
  +'nothing is claimed for them beyond that. The strip under the axis is the wavelength’s '
  +'own colour through the CIE observer, faded by the eye’s response: display only.';
const CAP_SPEC_S='PhET’s eight spectra, 1 nm samples, ε looked up not interpolated. '
  +'No literature ε could be sourced; these are PhET’s data.';

function viewSpectrum(rc,W,H,M){
  const S=M.S, L=layoutPanels(rc,W,H,CAP_SPEC,CAP_SPEC_S,2,0.34);
  const b=L.main;
  const stripH=9;
  const plot=box(b.x,b.y,b.w,Math.max(60,b.h-stripH-16));
  if(ST.allSpectra){
    const ylo=-1.7, yhi=4;      /* cobalt(II) nitrate falls to eps = 0.03 at 780 nm */
    axesFit(rc,plot,LAM0,LAM1,ylo,yhi,{title:'every solution, log10 ε',
      xlab:'wavelength, nm',ylab:'log10 ε',
      yfmt:t=>fmt(t,0),xfmt:t=>fmt(t,0),ny:6});
    const items=[];
    S.all.forEach((a,i)=>{
      const ys=a.eps.map(v=>v>0?Math.log10(v):ylo-1);
      const col=a.id===S.d.id?COL.pos:neonCss(0.12+0.72*i/7);
      polyline(rc,plot,S.xs,ys,LAM0,LAM1,ylo,yhi,col,a.id===S.d.id?2.2:1.2);
      items.push([col,a.name]);
    });
    legendFit(rc,plot,items);
  } else {
    const yhi=S.epsMax*1.14;
    axesFit(rc,plot,LAM0,LAM1,0,yhi,{title:soluteById(S.d.solute).name+' — ε(λ)',
      xlab:'wavelength, nm',ylab:'ε, L/(mol cm)',
      xfmt:t=>fmt(t,0),yfmt:t=>yhi>50?fmt(t,0):fmt(t,1)});
    polyline(rc,plot,S.xs,S.eps,LAM0,LAM1,0,yhi,COL.pos,2.2);
    /* lambda_max */
    const xm=plot.x+plot.w*(S.lamMax-LAM0)/(LAM1-LAM0);
    rc.strokeStyle=COL.ref; rc.lineWidth=1.3; rc.setLineDash([5,4]);
    rc.beginPath(); rc.moveTo(xm,plot.y); rc.lineTo(xm,plot.y1); rc.stroke();
    rc.setLineDash([]);
    lab(rc,W,H,xm+5,plot.y+14,'λ max = '+fmt(S.lamMax,0)+' nm, ε = '+fmt(S.epsMax,2),
        COL.ref,LAB_FONT,'left','middle');
  }
  /* the live wavelength cursor */
  const xc=plot.x+plot.w*(S.lam-LAM0)/(LAM1-LAM0);
  if(xc>=plot.x-0.5&&xc<=plot.x1+0.5){
    rc.strokeStyle=COL.live; rc.lineWidth=1.6;
    rc.beginPath(); rc.moveTo(xc,plot.y); rc.lineTo(xc,plot.y1); rc.stroke();
    /* on whichever side of the cursor has room: right-aligned at 392 nm the label runs
       off the plot and into the y-tick gutter (audit, 560 x 380) */
    const leftish=(xc-plot.x)<plot.w*0.34;
    lab(rc,W,H,xc+(leftish?6:-6),plot.y1-14,fmt(S.lam,0)+' nm',COL.live,LAB_FONT,
        leftish?'left':'right','middle');
  }
  spectrumStrip(rc,plot,LAM0,LAM1,plot.y1+5,stripH);
  /* A(lambda) and T(lambda) at the bench's present l and c */
  if(L.bottom[0]){
    const p=L.bottom[0];
    let ahi=0; for(const v of S.A) ahi=Math.max(ahi,v);
    ahi=Math.max(0.2,ahi*1.15);
    axesFit(rc,p,LAM0,LAM1,0,ahi,{title:'A(λ) = ε(λ) l c',
      xlab:'nm',ylab:'A',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
    polyline(rc,p,S.xs,S.A,LAM0,LAM1,0,ahi,COL.pos,1.8);
    for(const a of [1,2,3]){
      if(a>ahi) continue;
      polyline(rc,p,[LAM0,LAM1],[a,a],LAM0,LAM1,0,ahi,COL.ref,1,[4,4]);
      lab(rc,W,H,p.x1-4,p.y1-p.h*a/ahi-8,'A = '+a,COL.ref,SM_FONT,'right','middle');
    }
    marker(rc,p,LAM0,LAM1,0,ahi,S.lam,S.Ahere,COL.live);
  }
  if(L.bottom[1]){
    const p=L.bottom[1];
    axesFit(rc,p,LAM0,LAM1,0,100,{title:'T(λ) = 10^-A, per cent',
      xlab:'nm',ylab:'T, %',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    polyline(rc,p,S.xs,S.T.map(v=>100*v),LAM0,LAM1,0,100,COL.struct,1.8);
    marker(rc,p,LAM0,LAM1,0,100,S.lam,100*transmittance(S.Ahere),COL.live);
    lab(rc,W,H,p.x+12,p.y+14,'what a white beam would have left',COL.dim,SM_FONT,'left','middle');
  }
  drawCaption(rc,{left:L.left,capY:L.capY,capTxt:L.capTxt,capW:L.capW});
}

/* ---------------------------------------------------------------- the law ------------ */
const CAP_LAW='Why an instrument measures transmittance and reports absorbance. A is linear '
  +'in the concentration and in the path length, so its plot is a straight line through the '
  +'origin whose slope is εl or εc; T is an exponential in both, and reading a '
  +'concentration off it would mean reading a log by eye. The third panel is the same curve '
  +'for every solution there is: T = 10^-A has nothing in it but A. The shaded band '
  +'is where a real solution stops obeying the law — above about 10 mM, a conventional '
  +'teaching bound and not a measurement, which is why it is drawn as a band and named.';
const CAP_LAW_S='A is linear in c and l; T is not. T = 10^-A is the same curve for '
  +'every solution. Past ~10 mM the straight line is an extrapolation.';

function viewLaw(rc,W,H,M){
  const L=M.L, Ly=layoutPanels(rc,W,H,CAP_LAW,CAP_LAW_S,2,0.36);
  const b=Ly.main, byCon=(ST.lawX==='conc');
  const xhi=byCon?L.d.cMax:PHET.CUVETTE_MAX;
  const xs=byCon?L.cs:L.ls;
  const yhi=Math.max(0.4,L.Amax*1.12);
  const xf=byCon?(t=>fmt(t*L.d.scale,0)):(t=>fmt(t,1));
  axesFit(rc,b,0,xhi,0,yhi,{title:byCon?'A against concentration, at l = '+fmt(L.l,2)+' cm'
                                     :'A against path length, at c = '+plain(blConcStr(L.c)),
    xlab:byCon?('concentration, '+L.d.transform):'path length, cm',
    ylab:'absorbance A',xfmt:xf,yfmt:t=>fmt(t,1)});
  if(byCon){
    /* the band where Beer-Lambert stops being true */
    if(L.linear<xhi){
      const x0=b.x+b.w*L.linear/xhi;
      rc.fillStyle='rgba(232,132,58,.055)';
      rc.fillRect(x0,b.y,b.x1-x0,b.h);
      rc.strokeStyle=COL.ref; rc.lineWidth=1; rc.setLineDash([4,4]);
      rc.beginPath(); rc.moveTo(x0,b.y); rc.lineTo(x0,b.y1); rc.stroke(); rc.setLineDash([]);
      lab(rc,W,H,x0+5,b.y+14,'past 10 mM: extrapolated',COL.ref,SM_FONT,'left','middle');
    }
    const items=[];
    for(const ln of L.lines){
      const col=Math.abs(ln.l-L.l)<1e-9?COL.pos:shade(COL.struct,0.55);
      polyline(rc,b,L.cs,ln.A,0,xhi,0,yhi,col,Math.abs(ln.l-L.l)<1e-9?2.2:1.2,
               Math.abs(ln.l-L.l)<1e-9?null:[5,4]);
      items.push([col,'l = '+fmt(ln.l,1)+' cm']);
    }
    polyline(rc,b,L.cs,L.Ac,0,xhi,0,yhi,COL.pos,2.2);
    legendFit(rc,b,items);
    marker(rc,b,0,xhi,0,yhi,L.c,L.A,COL.live);
  } else {
    polyline(rc,b,L.ls,L.Al,0,xhi,0,yhi,COL.pos,2.2);
    marker(rc,b,0,xhi,0,yhi,L.l,L.A,COL.live);
    lab(rc,W,H,b.x+8,b.y+14,'slope = εc = '+sciPlain(L.eps*L.c,3)+' per cm',
        COL.pos,LAB_FONT,'left','middle');
  }
  lab(rc,W,H,b.x+8,b.y+(byCon?30:30),'ε = '+fmt(L.eps,3)+' at '+fmt(L.lam,0)+' nm',
      COL.dim,SM_FONT,'left','middle');
  if(Ly.bottom[0]){
    const p=Ly.bottom[0];
    axesFit(rc,p,0,xhi,0,100,{title:byCon?'T against concentration':'T against path length',
      xlab:byCon?L.d.transform:'cm',ylab:'T, %',xfmt:xf,yfmt:t=>fmt(t,0)});
    polyline(rc,p,xs,(byCon?L.Tc:L.Tl).map(v=>100*v),0,xhi,0,100,COL.struct,2);
    marker(rc,p,0,xhi,0,100,byCon?L.c:L.l,100*L.T,COL.live);
    lab(rc,W,H,p.x+12,p.y+14,'a curve, not a line',COL.dim,SM_FONT,'left','middle');
  }
  if(Ly.bottom[1]){
    const p=Ly.bottom[1];
    axesFit(rc,p,0,4,0,100,{title:'T = 10^-A — every solution at once',
      xlab:'absorbance A',ylab:'T, %',xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
    polyline(rc,p,L.As,L.Ts.map(v=>100*v),0,4,0,100,COL.pos,2);
    for(const a of [1,2,3]){
      polyline(rc,p,[a,a],[0,100*transmittance(a)],0,4,0,100,COL.ref,1,[4,4]);
      lab(rc,W,H,p.x+p.w*a/4+4,p.y1-p.h*transmittance(a)-10,
          fmt(100*transmittance(a),100*transmittance(a)<1?1:0)+' %',COL.ref,SM_FONT,'left','middle');
    }
    marker(rc,p,0,4,0,100,clamp(L.A,0,4),100*L.T,COL.live);
  }
  drawCaption(rc,{left:Ly.left,capY:Ly.capY,capTxt:Ly.capTxt,capW:Ly.capW});
}


/* ================================================================== *
 *  dispatch, the scene, boot -- the control panel, the tabs, the keys *
 *  and the frame loop                                                 *
 * ================================================================== */
const CREDIT='Remake of PhET Interactive Simulations&rsquo; '+PHET_TITLE+' (University of '
  +'Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.';
const BEAKER_VIEWS={beaker:1};
const CUVETTE_VIEWS={cuvette:1};

function layoutFor(rc,W,H){
  return beakerLayout(rc,W,H,CAP_BEAKER,CAP_BEAKER_S);
}
function drawView(rc,W,H,M){
  POLY_SEGS=[]; LEGEND_RECTS=[]; LABELS=[];
  /* The floating readout covers the top-right of the stage -- about 336 px wide and up to
     548 tall -- and it is HTML, so nothing on the canvas can see it.  Register it as an
     occupied label box so lab() dodges it (Known-bad: text placed at the top right of a
     plot box is text placed underneath the readout). */
  if(W>=900) LABELS.push([W-336,0,W,Math.min(548,H)]);
  rc.fillStyle='#070b18'; rc.fillRect(0,0,W,H);
  const m=M||buildModel();
  if(m.view==='beaker') viewBeaker(rc,W,H,m);
  else if(m.view==='cuvette') viewCuvette(rc,W,H,m);
  else if(m.view==='spectrum') viewSpectrum(rc,W,H,m);
  else if(m.view==='law') viewLaw(rc,W,H,m);
  else if(m.view==='ledger') viewLedger(rc,W,H,m);
  else if(m.view==='solutes') viewSolutes(rc,W,H,m);
  else viewColour(rc,W,H,m);
}
function makeScene(canvas){
  const S={W:0,H:0,
    model(){ return buildModel(); },
    draw(){
      /* fetch the context INSIDE the draw: one cached at boot writes into a recorder the
         DOM-stub harness has already thrown away (Known-bad, polyhedra.html) */
      const rc=canvas.getContext('2d');
      drawView(rc,S.W,S.H,S.model());
    },
    step(){ return stepFrame(); },
    pointer(kind,x,y){
      const rc=canvas.getContext('2d');
      if(BEAKER_VIEWS[ST.view]){
        const b=layoutFor(rc,S.W,S.H).bk;
        if(kind==='down'){
          const px=bkX(b,PROBE.x), py=bkY(b,PROBE.y);
          /* the probe body is 14 x 26 px; the grab box is a little larger than it */
          if(Math.abs(x-px)<=12&&y>=py-30&&y<=py+10){ DRAG.what='probe'; return true; }
          return false;
        }
        if(kind==='move'&&DRAG.what==='probe'){
          const p=bkFromCanvas(b,x,y);
          PROBE.x=clamp(p.x,-0.25,1.25);
          PROBE.y=clamp(p.y,-0.20,1.30);
          return true;
        }
      } else if(CUVETTE_VIEWS[ST.view]){
        const L=cuvetteLayout(rc,S.W,S.H);
        if(kind==='down'){
          const xR=L.X(L.CUV0+cuvetteWidth());
          if(Math.abs(x-xR)<=9){ DRAG.what='cuvette'; DRAG.grabX=x; DRAG.grabW=cuvetteWidth();
                                 return true; }
          const dx=L.X(L.CUV0+DET.x), dy=L.axis-DET.y*L.px;
          const sensor=Math.max(8,SENSOR_HALF*L.px);
          if(Math.abs(x-dx)<=12&&Math.abs(y-dy)<=sensor+6){ DRAG.what='detector'; return true; }
          return false;
        }
        if(kind==='move'&&DRAG.what==='cuvette'){
          ST.cuvette=clamp(DRAG.grabW+(x-DRAG.grabX)/L.px,PHET.CUVETTE_MIN,PHET.CUVETTE_MAX);
          return true;
        }
        if(kind==='move'&&DRAG.what==='detector'){
          DET.x=clamp(L.cmOf(x)-L.CUV0,-0.4,L.BENCH_CM-L.CUV0);
          DET.y=clamp((L.axis-y)/L.px,-2.4,2.4);
          return true;
        }
      }
      if(kind==='up'&&DRAG.what){
        /* PhET snaps the cuvette's width when the DRAG ENDS, not while it is moving */
        if(DRAG.what==='cuvette') ST.cuvette=snapCuvette(ST.cuvette);
        DRAG.what=null; return true;
      }
      return false;
    }};
  return S;
}

function boot(){

  /* the MESSAGE as well as the stack: JavaScriptCore's Error.stack carries only the
     frames, so a harness that reads the box alone was told where and not what */
  function fail(e){ errEl.style.display='block';
    errEl.textContent=String(e&&e.message||e)+'\n'+String(e&&e.stack||''); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    ST.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===ST.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:ST.view===k?'active':'',
    onclick:()=>setView(k)},lab2)); });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,setf,getf){

    inp.addEventListener('input',()=>{
      const v=parseFloat(inp.value);

      syncPanel(); dirty=true; refresh(); });

  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=ST[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ ST[key]=inp.checked; if(onchg) onchg();

  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){

  /* the solute */

  /* how it goes in, and what else moves */

  gBeaker.appendChild(slider('nSet','solute amount, mol',PHET.SOLUTE_MOL_MIN,
    PHET.SOLUTE_MOL_MAX,0.01,v=>fmt(v,2)+' mol',setMoles,()=>BK.n));
  gBeaker.appendChild(slider('vSet','solution volume, L',PHET.VOL_MIN,PHET.VOL_MAX,0.005,

  gBeaker.appendChild(h('div',{class:'btnrow'},
    button('empty',()=>emptyBeaker()),

    button('one step',()=>{ const w=ST.running; ST.running=true; stepFrame(); ST.running=w; })));
  const beakerTag=h('div',{class:'tag'}); gBeaker.appendChild(beakerTag);

  /* the meter and the beaker's own labels (PhET's checkboxes and unit preferences) */

  const SRC_LINE=CREDIT+' PhET&rsquo;s constants &mdash; the nine solutes (molar mass, stock '

    +'fetched 2026-09-22, quoted to their own precision): sucrose 342.297 g/mol, 2.01 g/mL '

    +'NiCl<sub>2</sub> 129.5994, 67.5 g/100 mL (25 &deg;C); CuSO<sub>4</sub> 159.60, 201 g/L '

  function syncChips(){

      const M=S.model();
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=BEAKER_VIEWS[ST.view]
        ? 'drag the meter probe in and out of the solution · space pauses · e empties · 1–'+TABS.length+' switch views'
        : (CUVETTE_VIEWS[ST.view]
           ? 'drag the cuvette’s right wall, or the detector probe · 1–'+TABS.length+' switch views'
           : '1–'+TABS.length+' switch views');
      infoEl.innerHTML=INFO[ST.view]||''; physEl.innerHTML=DERIV[ST.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); ST.running=!ST.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='e'){ emptyBeaker(); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='f'){ fillBeaker(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    let advanced=false;
    try{ advanced=S.step(); }catch(e){ fail(e); }
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%10===0){ const M=S.model();
          roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  beaker:'PhET\'s Concentration screen. Pick a solute, shake it in as a solid or squeeze it in as a ready-made stock solution, and the meter reads n/V. Then take the ratio apart. Open the water faucet and the concentration falls with nothing removed at all — the moles have not moved, the volume has. Open the drain and it does not fall at all, because draining takes solution, and solution carries solute away in exactly the proportion it is already in. Turn the evaporator up and the concentration rises, for the same reason in reverse, until the water runs out of room and solid appears on the bottom. That last point is the only place the model stops being a ratio: past n = V·Csat the solution holds Csat and no more, and the difference sits there as a precipitate. Sodium chloride is the one worth trying if you want to see how little colour tells you: it saturates at 6.15 mol/L and is almost invisible the whole way.',
  cuvette:'PhET\'s Beer\'s Law screen. The light source makes one wavelength, the cuvette holds the solution, the detector measures what comes out, and the whole screen is one equation: A = εlc. Everything it can do moves one of those three letters. The concentration slider moves c; the cuvette\'s right wall moves l (drag it — it snaps to a tenth of a centimetre when you let go, which is PhET\'s own snapInterval); switching the source from preset to variable moves ε, because ε is a property of the wavelength and not of the solution alone. The reading that matters is the absorbance, and the reason is on the picture: the beam past the cuvette dims by exactly the transmittance, and transmittance is what multiplies when you stack two cuvettes, while absorbance is what adds. Two 1 cm cuvettes of the same solution transmit T² and absorb 2A.',
  spectrum:'The ε in A = εlc is not a number, it is a curve, and these are PhET\'s eight of them at one value per nanometre. The preset wavelength every screen opens at is simply the highest point of the curve — that is what λmax means, and it is found here by scanning the four hundred and one samples rather than by being told. Two things are worth noticing. First, the absorbance curve underneath has the same shape as ε, because l and c only scale it: the law is exact at every wavelength separately, and a spectrum is the same arithmetic asked four hundred times. Second, copper sulfate\'s peak is at the very last sample, 780 nm, because its real absorption band is in the infrared and PhET\'s table stops where the eye does. No literature molar absorptivity could be sourced offline for any of these, so they are labelled as PhET\'s digitised data and nothing further is claimed for them.',
  law:'The reason a spectrophotometer reports absorbance and not the transmittance it actually measures. A is linear in c and linear in l, so it plots as a straight line through the origin whose slope carries ε — double the concentration and you double the number. T is 10^-A, which is a curve in both, and reading a concentration off it means reading a logarithm by eye. The third panel is the strongest statement in the view: T against A is the same curve for every solution that has ever existed, because there is nothing in it but A. An absorbance of 1 is ten per cent through, 2 is one per cent, 3 is a thousandth; past about 3 a real instrument is measuring its own stray light rather than the sample. The shaded band on the first panel is where the straight line stops being true — a real solution\'s ε drifts above roughly ten millimolar — and it is a teaching bound rather than a measurement, so it is drawn as a band and named.',
  ledger:'A beaker simulation is a bookkeeping problem before it is a chemistry problem, so this view does the books. Every mole that the shaker or the dropper puts in, and every mole the drain takes out, is counted; what is left must be what is in the beaker, and the residual under the bars is how much of that is not true. It is zero — not small, zero — and the Python twin closes the same ledger exactly in rationals over a nine-hundred-frame script. The drain is the one that catches people out: it removes solution, so it carries solute at the DISSOLVED concentration, which past saturation is Csat and not n/V, and the solid on the bottom does not go down it. The curve is the evaporator\'s path: hold the moles fixed and C = n/V is a hyperbola, rising as the water goes, until the volume reaches n/Csat exactly — and from there the concentration cannot rise at all, so everything further comes out as solid.',
  solutes:'PhET\'s nine solutes against what can be found out about them. The molar masses are the literature\'s to five decimal places, which is the check that PhET\'s data came from somewhere real: the worst disagreement over all nine is 5.6 parts in a hundred thousand, and the "drink mix" turns out to carry sucrose\'s molar mass to a milligram per mole, so it is sugar. The saturation points are the interesting column. Four of them — potassium chromate, potassium permanganate, nickel(II) chloride and potassium dichromate — land within a per cent of a solubility quoted at or near room temperature. The rest differ, and every one of those differences is explained by the temperature the source happens to quote: cobalt(II) nitrate\'s infobox gives 0 °C and 90 °C and nothing in between, so its bar is low by a quarter and should be. Where a source could not be made to say what PhET\'s number says, the table prints both rather than choosing.',
  colour:'PhET colours its solutions by interpolating between fixed stops — a sensible drawing decision, and not a calculation. This view does the calculation beside it. The solution transmits 10^(-ε(λ)lc) at every wavelength; integrate that against the CIE 1931 observer\'s three colour-matching functions on the very grid the spectra are tabulated on, and you have the tristimulus of the light that comes out. Adapt it so the illuminant alone renders white, and an empty cuvette is exactly rgb(255,255,255). The two rows are the same solutions at the same concentrations, and they are not the same colours: the worst single channel differs by a third to nine-tenths of the full range. The sharpest difference is not brightness, though. PhET\'s ramp has no path length in it at all, so it draws a thin cuvette and a thick one identically, while the real thing changes as the light has further to go. Cobalt(II) nitrate is the clearest case: PhET calls it red, and the calculation makes it magenta, because its absorption band sits in the green.'
};

/* ================================================================== *
 *  makeShot — the selfTest recording context (text boxes through     *
 *  the transform, fill counts), from build_buoy/p7_test.js by name,  *
 *  unchanged (make_helpers.py)                                       *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest -- headless verification.  Every reference is a line of   *
 *  build/beers-law-lab/refvals.txt (derive.py's output, read in       *
 *  full):  (python) = 50-digit decimal / exact-rational arithmetic in *
 *  the twin,  (PhET) = a constant read out of the minified original.  *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),
    name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();
  function R(label,i){
    const v=REF[label];
    if(!v) throw new Error('no reference line "'+label+'"');
    return v[i||0];
  }
  const stSave=Object.assign({},ST), bkSave=BK;
  const pxS=PROBE.x, pyS=PROBE.y, dxS=DET.x, dyS=DET.y;
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;

  /* ---------- A. PhET's constants, read out of the minified original ---------- */
  eq(PHET.BEAKER_VOLUME,R('PHET BEAKER_VOLUME'),'the beaker holds 1 L (PhET)');
  eq(PHET.VOL_MAX,R('PHET SOLUTION_VOLUME_RANGE min max default',1),'and the volume stops there (PhET)');
  eq(PHET.VOL_DEFAULT,R('PHET SOLUTION_VOLUME_RANGE min max default',2),'starting at 0.5 L (PhET)');
  eq(PHET.SOLUTE_MOL_MAX,R('PHET SOLUTE_AMOUNT_RANGE min max default',1),'7 mol of solute at most (PhET)');
  eq(PHET.CUVETTE_MIN,R('PHET CUVETTE_WIDTH_RANGE min max default',0),'the cuvette starts at 0.5 cm (PhET)');
  eq(PHET.CUVETTE_MAX,R('PHET CUVETTE_WIDTH_RANGE min max default',1),'and reaches 2 cm (PhET)');
  eq(PHET.CUVETTE_DEFAULT,R('PHET CUVETTE_WIDTH_RANGE min max default',2),'defaulting to 1 cm (PhET)');
  eq(PHET.CUVETTE_SNAP,R('PHET CUVETTE_SNAP_DEFAULT'),'snapping to 0.1 cm (PhET)');
  eq(PHET.DROPPER_FLOW,R('PHET DROPPER_FLOW'),'the dropper runs at 0.05 L/s (PhET)');
  eq(PHET.FAUCET_FLOW,R('PHET FAUCET_FLOW'),'the faucets at 0.25 L/s (PhET)');
  eq(PHET.EVAPORATION_MAX,R('PHET EVAPORATION_MAX'),'the evaporator to 0.25 L/s (PhET)');
  eq(PHET.SHAKER_RATE,R('PHET SHAKER_RATE'),'the shaker at 0.2 mol/s nominal (PhET)');
  eq(PHET.PARTICLES_PER_MOLE,R('PHET PARTICLES_PER_MOLE'),'200 particles per mole (PhET)');
  eq(PHET.WATER_DENSITY,R('PHET WATER_DENSITY'),'water is 1000 g/L (PhET)');
  eq(LAM0,R('PHET MIN_WAVELENGTH'),'the band starts at 380 nm (PhET)');
  eq(LAM1,R('PHET MAX_WAVELENGTH'),'and ends at 780 nm (PhET)');
  eq(NLAM,401,'so the spectra are 401 samples');
  eq(MOLE_PER_PARTICLE,R('PHET mole per shaker particle'),'each grain is 1/200 mol (PhET)');
  eq(WATER_RGB.join(),[R('PHET WATER_RGB',0),R('PHET WATER_RGB',1),R('PHET WATER_RGB',2)].join(),
     'water is rgb(224,255,255) (PhET)');
  { const d=['DEC_CONC','DEC_PERCENT','DEC_MOLAR','DEC_A','DEC_T','DEC_LAMBDA','DEC_AMOUNT',
             'DEC_CUVETTE','DEC_VOLUME'].map(k=>PHET[k]);
    const w=[]; for(let i=0;i<9;i++) w.push(R('PHET decimals conc percent molar A T lambda amount cuvette volume',i));
    eq(d.join(),w.join(),'every decimal-place count is PhET\'s (PhET)'); }
  eq(SOLUTES.length,9,'nine solutes (PhET)');
  eq(BLSOLS.length,8,'and eight Beer\'s Law solutions -- sodium chloride is colourless (PhET)');
  eq(soluteById('nonsense').id,SOLUTES[0].id,'an unknown solute id falls back rather than throwing');
  eq(blsById('sodiumChloride').id,BLSOLS[0].id,'and so does a solution that has no spectrum');
  ok(!hasSpectrum('sodiumChloride'),'sodium chloride has no spectrum at all');
  for(let i=0;i<SOLUTES.length;i++){
    const c=SOLUTE_CONST[i], s=SOLUTES[i];
    close(s.molarMass,R('MASS '+c+' molarMass stock Csat gramsAt1M percentAt1M stockPercent',0),
          1e-12,c+' molar mass (PhET)');
    close(s.stock,R('MASS '+c+' molarMass stock Csat gramsAt1M percentAt1M stockPercent',1),
          1e-12,c+' stock concentration (PhET)');
    close(s.cSat,R('MASS '+c+' molarMass stock Csat gramsAt1M percentAt1M stockPercent',2),
          1e-12,c+' saturation (PhET)');
    close(stockPercent(s),R('MASS '+c+' molarMass stock Csat gramsAt1M percentAt1M stockPercent',5),
          1e-12,c+' stock mass percent (python)');
  }

  /* ---------- B. Beer-Lambert ---------- */
  eq(absorbance(3,2,5),30,'A = eps l c is a plain product');
  eq(transmittance(0),1,'A = 0 gives T = 1 exactly (python)');
  eq(absorbanceOfT(1),0,'and T = 1 gives A = 0 exactly (python)');
  close(transmittance(1),R('BL T at A 0 1 2 3 10',1),1e-18,'A = 1 is exactly 10 % (python)');
  close(transmittance(2),R('BL T at A 0 1 2 3 10',2),1e-18,'A = 2 is exactly 1 % (python)');
  close(transmittance(3),R('BL T at A 0 1 2 3 10',3),1e-19,'A = 3 is a thousandth (python)');
  close(transmittance(10),R('BL T at A 0 1 2 3 10',4),1e-26,'and A = 10 is 1e-10 (python)');
  { const az=R('BL A at which T underflows to zero, and T just below',0);
    eq(transmittance(az),0,'T underflows to exactly 0 at A = '+az+' (python)');
    ok(transmittance(az-1)>0,'and not before');
    close(transmittance(az-1),R('BL A at which T underflows to zero, and T just below',1),
          1e-330,'the last positive value is a denormal (python)');
    ok(!isFinite(absorbanceOfT(0)),'a reading of exactly 0 % T inverts to an infinite absorbance');
    ok(absorbanceOfT(0)>0,'and it is +Infinity, not -Infinity'); }
  /* the round trip, over every solution the file carries */
  { let wa=0, wt=0, wr=0;
    for(let i=0;i<BLSOLS.length;i++){
      const d=BLSOLS[i], lm=lambdaMaxOf(d.id), e=epsAt(d.id,lm);
      for(const l of [0.5,1,1.37,2]) for(const f of [0,0.25,0.5,1]){
        const c=d.cMax*f, A=absorbance(e,l,c), Tv=transmittance(A);
        wa=Math.max(wa,Math.abs(A-e*l*c));
        wt=Math.max(wt,Math.abs(Tv-Math.pow(10,-A)));
        if(Tv>0&&A>0) wr=Math.max(wr,Math.abs(absorbanceOfT(Tv)-A)/A);
      }
    }
    eq(wa,0,'A is the product, evaluated once');
    eq(wt,0,'and T the power, evaluated once');
    ok(wr<=R('BL roundtrip worst rel A T backA propagated',2)*4,
       'the round trip -log10(10^-A) = A holds to '+wr.toExponential(2)
       +', against the twin\'s '+R('BL roundtrip worst rel A T backA propagated',2)+' (python)'); }
  /* the eight solutions, against the twin */
  for(let i=0;i<BLSOLS.length;i++){
    const c=BLS_CONST[i], d=BLSOLS[i], lbl='BL '+c+' lambdaMax eps cmax cdefault Amax2cm';
    eq(lambdaMaxOf(d.id),R(lbl,0),c+' lambda_max is '+R(lbl,0)+' nm (python)');
    close(epsMaxOf(d.id),R(lbl,1),1e-12,c+' eps at the peak (PhET)');
    close(d.cMax,R(lbl,2),1e-18,c+' concentration range (PhET)');
    close(d.cDefault,R(lbl,3),1e-18,c+' default concentration (PhET)');
    close(absorbance(epsMaxOf(d.id),PHET.CUVETTE_MAX,d.cMax),R(lbl,4),1e-12,
          c+' largest absorbance in a 2 cm cuvette (python)');
  }
  { const got=BLSOLS.map(d=>lambdaMaxOf(d.id)).join();
    const want=[]; for(let i=0;i<8;i++) want.push(R('EPS lambdaMax in file order',i));
    eq(got,want.join(),'every lambda_max matches the twin (python)'); }
  ok(lambdaMaxOf('copperSulfate')===LAM1,
     'copper sulfate peaks at the LAST sample: its band is in the infrared and PhET\'s table stops at the eye');
  /* eps is a lookup, not an interpolation */
  eq(epsAt('potassiumPermanganate',500),R('EPS quantisation KMnO4 at 500 500.999 501',0),
     'eps at 500 nm (PhET)');
  eq(epsAt('potassiumPermanganate',500.999),R('EPS quantisation KMnO4 at 500 500.999 501',1),
     'and at 500.999 nm -- the same cell (python)');
  eq(epsAt('potassiumPermanganate',501),R('EPS quantisation KMnO4 at 500 500.999 501',2),
     'while 501 nm reads the next one (python)');
  ok(epsAt('potassiumPermanganate',500)!==epsAt('potassiumPermanganate',501),
     'so the step is real and not a coincidence of equal values');
  eq(epsAt('potassiumPermanganate',379.9),null,'below 380 nm PhET has no data');
  eq(epsAt('potassiumPermanganate',781),null,'and above 780 nm neither');
  eq(epsAt('drinkMix',780.5),EPS.drinkMix[NLAM-1],'780.5 nm still reads the last cell (python)');
  eq(epsAt('sodiumChloride',500),null,'a solute with no spectrum returns null, not zero');
  /* two cuvettes: T multiplies, A adds -- the reason the instrument reports A */
  { const e=epsMaxOf('drinkMix'), c=0.1;
    const A1=absorbance(e,1,c), A2=absorbance(e,1,c);
    close(transmittance(A1)*transmittance(A2),transmittance(absorbance(e,2,c)),1e-15,
          'two 1 cm cuvettes transmit T squared, which is one 2 cm cuvette');
    close(A1+A2,absorbance(e,2,c),1e-15,'and their absorbances add'); }

  /* ---------- C. the beaker: the mole ledger ---------- */
  /* PhET's shaker arithmetic: round(max(1, rate * 200 * dt)) grains a frame */
  close(PHET.SHAKER_RATE*PHET.PARTICLES_PER_MOLE*FRAME_DT,
        R('SHAKER bracket perFrame deliveredMolPerS nominal',0),1e-15,
        'the shaker\'s per-frame bracket is 0.667 at 60 fps (python)');
  eq(shakerPerFrame(FRAME_DT),R('SHAKER bracket perFrame deliveredMolPerS nominal',1),
     'so one grain a frame comes out of it (python)');
  close(shakerPerFrame(FRAME_DT)*MOLE_PER_PARTICLE/FRAME_DT,

    ok(thin.rgb.join()!==thick.rgb.join(),'which are different colours, as they must be');
    rel(thin.Y,R(lbl,6),1e-11,'the thin one\'s luminance (python)');
    rel(thick.Y,R(lbl,7),1e-11,'and the thick one\'s (python)');
    /* the monochromatic beam falls far faster than the luminance: an integral over a band
       is not a single exponential, and that is the point the view makes */
    const mono=transmittance(absorbance(epsMaxOf(d.id),2,c))
              /transmittance(absorbance(epsMaxOf(d.id),0.5,c));
    rel(mono,R(lbl,8),1e-12,'the beam at lambda_max is cut to 6.3 % over that change (python)');
    ok(thick.Y/thin.Y>4*mono,'while the luminance keeps '+fmt(thick.Y/thin.Y,4)
       +' -- far more, because the shoulders carry the integral'); }
  /* and a saturated beaker is simply black */
  { const lbl='OPAQUE KMnO4 saturated 0.5 cm Y rgb';
    const t=trueRGB('potassiumPermanganate',0.5,soluteById('potassiumPermanganate').cSat,'E');
    rel(t.Y,R(lbl,0),1e-9,'saturated KMnO4 through 5 mm transmits 3.2e-10 of the light (python)');
    eq(t.rgb.join(),'0,0,0','and renders as exactly black'); }
  /* the darkening comparison the view prints */
  { const lbl='DARKEN KMnO4 trueY ratio, phet ramp lum ratio, Y at cmax/10 and cmax';
    const d=blsById('potassiumPermanganate');
    const lo=trueRGB(d.id,1,d.cMax*0.1,'E'), hi=trueRGB(d.id,1,d.cMax,'E');
    rel(lo.Y/hi.Y,R(lbl,0),1e-11,'the true colour darkens 3.20-fold over a decade of c (python)');
    rel(relLum(rampColor(d.id,d.cMax*0.1))/relLum(rampColor(d.id,d.cMax)),R(lbl,1),1e-11,
        'and PhET\'s ramp 2.64-fold (python)');
    ok(lo.Y/hi.Y>relLum(rampColor(d.id,d.cMax*0.1))/relLum(rampColor(d.id,d.cMax)),
       'so the true colour does darken more -- but only by 1.2, so luminance is not the story'); }
  /* the display-only wavelength colour, pinned per wavelength: a helper nothing asserts
     is a helper a unit mistake can paint the whole band red in (Known-bad) */
  { const WV=[420,480,555,620,700], got=[];
    for(const w of WV) got.push.apply(got,waveRGB(w));
    const want=[]; for(let i=0;i<15;i++) want.push(R('WAVE rgb at 420 480 555 620 700',i));
    eq(got.join(),want.join(),'the beam colour at 420, 480, 555, 620 and 700 nm (python)');
    eq(waveRGB(300).join(),'0,0,0','below the band there is no colour at all');
    eq(waveRGB(900).join(),'0,0,0','and above it neither');
    const g=waveRGB(555);
    ok(g[1]>=g[0]&&g[1]>=g[2],'555 nm is green');
    eq(Math.max(g[0],g[1],g[2]),255,'and at full brightness, being where the eye peaks');
    const v=waveRGB(420);
    ok(Math.max(v[0],v[1],v[2])<120,'420 nm is dim, because the eye barely sees it'); }
  /* the bound past which the straight line is an extrapolation */
  { close(LINEAR_LIMIT,R('LINEAR LIMIT mol per L'),1e-18,
          'Beer-Lambert is drawn as linear to 10 mM (a teaching bound, not a measurement)');
    let past=0;
    for(const d of BLSOLS) if(d.cMax>LINEAR_LIMIT) past++;
    eq(past,5,'five of the eight ranges run past it');
    Object.assign(ST,DEFAULTS); ST.blSolution='drinkMix'; ST.blConc=0.02;
    ok(cuvetteModel().beyondLinear,'20 mM is past it');
    ST.blConc=0.005;
    ok(!cuvetteModel().beyondLinear,'and 5 mM is not');
    Object.assign(ST,DEFAULTS); }

  /* ---------- F. PhET's data against the literature ---------- */
  { let worstM=0, worstC=0;
    for(let i=0;i<SOLUTES.length;i++){
      const s=SOLUTES[i], c=SOLUTE_CONST[i], lbl='LIT '+c+' molarMassLit gPerL cLit relC';
      close(s.lit.M,R(lbl,0),1e-12,c+' literature molar mass (source)');
      close(s.lit.gPerL,R(lbl,1),1e-9,c+' solubility in g/L (source)');
      const cLit=s.lit.gPerL/s.lit.M;
      rel(cLit,R(lbl,2),1e-12,c+' converted to mol/L (python)');
      rel(Math.abs(s.cSat-cLit)/cLit,Math.abs(R(lbl,3)),1e-9,c+' relative gap (python)');
      worstM=Math.max(worstM,Math.abs(s.molarMass-s.lit.M)/s.lit.M);
      worstC=Math.max(worstC,Math.abs(s.cSat-cLit)/cLit);
    }
    rel(worstM,R('LIT worst molar-mass and saturation relative gaps',0),1e-9,
        'the worst molar-mass gap over the nine is 5.6e-5 (python)');
    rel(worstC,R('LIT worst molar-mass and saturation relative gaps',1),1e-9,
        'and the worst saturation gap 22.8 %, which is the 0 C source (python)');
    ok(worstM<2e-4,'so every molar mass is the literature\'s');
    for(const id of ['potassiumChromate','potassiumPermanganate','nickelIIChloride',
                     'potassiumDichromate']){
      const s=soluteById(id), cLit=s.lit.gPerL/s.lit.M;
      ok(Math.abs(s.cSat-cLit)/cLit<0.01,
         id+'\'s saturation is within 1 % of a source quoted near room temperature');
    }
    ok(Math.abs(soluteById('drinkMix').molarMass-342.297)<=1.01e-3,
       'PhET\'s drink mix carries sucrose\'s molar mass: it is sugar'); }

  /* ---------- G. the panels build clean for every view and every preset ---------- */
  { Object.assign(ST,DEFAULTS);
    let bad='';
    for(const [v] of TABS){
      for(const s of SOLUTES){
        for(const blsId of (SHOW_BEERS?[BLSOLS[0].id,BLSOLS[7].id]:[BLSOLS[0].id])){
          for(const units of ['molar','percent']){
            ST.view=v; ST.solute=s.id; ST.blSolution=blsId; ST.meterUnits=units;
            BK=makeBeaker(s.id,1.2,0.4);
            ST.blConc=blsById(blsId).cDefault; ST.wavelength=lambdaMaxOf(blsId);
            const M=buildModel();
            const ro=readoutHTML(M), eb=eqbarHTML(M), tg=tagHTML(M);
            for(const [nm,txt] of [['readout',ro],['eqbar',eb],['tag',tg]]){
              if(/NaN|undefined|Infinity/.test(txt)&&!bad) bad=v+'/'+s.id+' '+nm;
            }
            if(ro.length<400&&!bad) bad=v+'/'+s.id+' readout too short';
          }
        }
      }
    }
    ok(!bad,'every view x solute x solution x unit builds clean panels'+(bad?' ('+bad+')':''));
    Object.assign(ST,DEFAULTS); BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT); }
  /* no slider combination makes a non-finite model */
  { let bad='';
    Object.assign(ST,DEFAULTS);
    for(const n of [0,0.001,3.5,7]) for(const V of [0,0.001,0.5,1])
      for(const l of [PHET.CUVETTE_MIN,1,PHET.CUVETTE_MAX])
        for(const lam of [LAM0,500,LAM1]){
          BK=makeBeaker('copperSulfate',n,V);
          ST.solute='copperSulfate'; ST.cuvette=l; ST.lightMode='variable'; ST.wavelength=lam;
          for(const [v] of TABS){
            ST.view=v;
            const M=buildModel();
            /* the model's SCALARS must all be finite.  Drawing arrays are exempt on
               purpose: the ledger view's uncapped n/V curve carries NaN where V = 0, which
               is how polyline() is told to leave a gap, and that gap has its own assertion
               below rather than a blanket exemption here. */
            const walk=(o,path)=>{
              if(o===null||o===undefined) return;
              if(typeof o==='number'){ if(!isFinite(o)&&!bad) bad=v+' '+path+' n='+n+' V='+V; return; }
              if(Array.isArray(o)) return;
              if(typeof o==='object') for(const k in o) walk(o[k],path+'.'+k);
            };
            walk(M,'');
          }
        }
    ok(!bad,'no combination of the sliders makes a non-finite model'+(bad?' ('+bad+')':''));
    Object.assign(ST,DEFAULTS); BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT); }
  /* the one deliberate gap: the uncapped n/V curve has no value at V = 0 */
  { ST.view='ledger'; BK=makeBeaker('drinkMix',0.5,0.6);
    const G=ledgerModel();
    let gaps=0, bad2='';
    const cs=soluteById('drinkMix').cSat;
    let capped=0;
    for(let i=0;i<G.vs.length;i++){
      if(G.vs[i]>0){
        if(!isFinite(G.C[i])||!isFinite(G.raw[i])) bad2='finite V with a gap at '+G.vs[i];
        /* the drawn curve IS the meter's reading: capped at Csat, with the uncapped n/V
           beside it.  Only the cap tells the two apart, so assert it. */
        if(Math.abs(G.C[i]-Math.min(cs,G.raw[i]))>1e-15) bad2='uncapped C at V = '+G.vs[i];
        if(G.C[i]>cs+1e-15) bad2='C past Csat at V = '+G.vs[i];
        if(G.raw[i]>cs+1e-9) capped++;
      }
      else { gaps++; if(isFinite(G.raw[i])) bad2='V = 0 with a value'; }
    }
    ok(capped>0,'the two branches part company somewhere on the drawn curve ('
       +capped+' samples past Csat)');
    eq(gaps,1,'the evaporation curve has exactly one sample at V = 0');
    ok(!bad2,'and that is the only place either branch is non-finite'+(bad2?' ('+bad2+')':''));
    Object.assign(ST,DEFAULTS); BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT); }

  /* ---------- H. the canvas: nothing off it, nothing on top of anything ---------- */
  { const SIZES=[[1400,820],[1100,700],[900,560],[700,470],[560,380]];
    let off=0, hit=0, ent='', firstOff='', firstHit='';
    for(const [W,H] of SIZES){
      for(const [v] of TABS){
        ST.view=v;
        BK=makeBeaker(ST.solute,1.4,0.6);
        const rc=makeShot(W,H);
        drawView(rc,W,H,buildModel());
        const texts=rc.ops.filter(o=>o.op==='text');
        for(const t of texts){
          if(entRe.test(t.t)){ if(!ent) ent=v+' "'+t.t+'"'; }
          if(/NaN|undefined|Infinity/.test(t.t)){ if(!ent) ent=v+' NaN "'+t.t+'"'; }
          if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){
            off++; if(!firstOff) firstOff=v+' '+W+'x'+H+' "'+t.t+'"'; }
        }
        for(let i=0;i<texts.length;i++) for(let j=i+1;j<texts.length;j++){
          const a=texts[i].bb, b=texts[j].bb;
          if(a[0]<b[2]-0.5&&a[2]>b[0]+0.5&&a[1]<b[3]-0.5&&a[3]>b[1]+0.5){
            hit++; if(!firstHit) firstHit=v+' '+W+'x'+H+' "'+texts[i].t+'" / "'+texts[j].t+'"'; }
        }
      }
    }
    ok(!ent,'no entity, tag, NaN or undefined reaches a canvas text op'+(ent?' ('+ent+')':''));
    ok(off===0,off+' text boxes off the canvas'+(firstOff?' (first: '+firstOff+')':''));
    ok(hit===0,hit+' text collisions'+(firstHit?' (first: '+firstHit+')':''));
    Object.assign(ST,DEFAULTS); BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT); }
  /* every view draws something, and the bottom-left corner stays clear of the HTML hint */
  { let thin='';
    for(const [v] of TABS){
      ST.view=v;
      BK=makeBeaker(ST.solute,1.4,0.6);
      const rc=makeShot(1400,820);
      drawView(rc,1400,820,buildModel());
      if(rc.ops.length<40&&!thin) thin=v+' ('+rc.ops.length+' ops)';
      for(const o of rc.ops) if(o.op==='text'&&o.bb[3]>820-HINT_H&&o.bb[0]<420&&!thin)
        thin=v+' writes into the hint\'s corner: "'+o.t+'"';
    }
    ok(!thin,'every view draws a picture and keeps the hint\'s corner clear'+(thin?' ('+thin+')':''));
    Object.assign(ST,DEFAULTS); BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT); }

  /* ---------- I. the readout prints the numbers it computed ---------- */
  { Object.assign(ST,DEFAULTS);
    ST.view='beaker'; ST.solute='copperSulfate';
    BK=makeBeaker('copperSulfate',2,1);
    const ro=readoutHTML(buildModel());
    ok(ro.indexOf('Saturated!')>=0,'a saturated beaker says so in the readout');
    ok(ro.indexOf(fmt(bkPrecip(BK),3))>=0,'and prints the moles of solid it computed');
    ok(ro.indexOf(fmt(bkConc(BK),PHET.DEC_CONC))>=0,'and the concentration');
    PROBE.y=1.2;
    ok(readoutHTML(buildModel()).indexOf('probe is out')>=0,
       'lifted out of the solution the meter says so rather than printing a number');
    PROBE.y=PROBE0.y;
    if(SHOW_BEERS){
      ST.view='cuvette'; ST.blSolution='potassiumPermanganate'; ST.blConc=4e-4;
      ST.cuvette=1.5; ST.lightMode='preset'; ST.lightOn=true; DET.x=DET0.x; DET.y=0;
      const M=cuvetteModel();
      const r2=readoutHTML(buildModel());
      ok(r2.indexOf(fmt(M.A,PHET.DEC_A))>=0,'the cuvette readout prints the absorbance it computed');
      ok(r2.indexOf(fmt(100*M.T,PHET.DEC_T))>=0,'and the transmittance');
      ST.lightOn=false;
      ok(readoutHTML(buildModel()).indexOf('the light is off')>=0,'with the light off it says so');
      ST.lightOn=true; DET.y=2;
      ok(readoutHTML(buildModel()).indexOf('out of the beam')>=0,
         'and with the probe out of the beam it says that instead');
      DET.y=0;
    }
    Object.assign(ST,DEFAULTS); PROBE.x=PROBE0.x; PROBE.y=PROBE0.y; DET.x=DET0.x; DET.y=DET0.y;
    BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT); }
  /* the detector's own gate */
  if(SHOW_BEERS){
    ST.lightOn=true; DET.x=3.4; DET.y=0;
    ok(detectorInBeam(),'the probe on the axis is in the beam');
    close(BEAM_HALF,R('DETECTOR beamHalf sensorHalf cutoff',0),1e-18,
          'PhET\'s beam is 0.45 cm across (PhET lensDiameter)');
    close(SENSOR_HALF,R('DETECTOR beamHalf sensorHalf cutoff',1),1e-18,
          'and its sensor 1 cm (PhET sensorDiameter)');
    /* 0.25 and 0.30 cm straddle the cutoff; 0.4 does not distinguish the two halves */
    DET.y=0.25; ok(detectorInBeam(),'a quarter of a millimetre off the axis is still in it');
    DET.y=0.30; ok(!detectorInBeam(),'three tenths is not');
    DET.y=0.4;
    ok(!detectorInBeam(),'lifted 4 mm it is not: the sensor no longer spans the beam');
    DET.y=0; ST.lightOn=false;
    ok(!detectorInBeam(),'and with the light off nothing is in any beam');
    ST.lightOn=true; DET.x=-0.2;
    ok(!detectorInBeam(),'nor behind the source');
    DET.x=DET0.x; DET.y=DET0.y;
    /* the cuvette's snap */
    ST.snap=true;
    close(snapCuvette(1.234),1.2,1e-12,'the cuvette snaps to 0.1 cm (PhET cuvetteSnapInterval)');
    close(snapCuvette(1.26),1.3,1e-12,'rounding to the nearest tenth');
    close(snapCuvette(9),PHET.CUVETTE_MAX,1e-12,'and clamps at 2 cm');
    close(snapCuvette(0.01),PHET.CUVETTE_MIN,1e-12,'and at 0.5 cm');
    ST.snap=false;
    close(snapCuvette(1.234),1.234,1e-12,'with snapping off the width is left alone');
    ST.snap=DEFAULTS.snap;
    /* the preset wavelength tracks the solution */
    setBlSolution('potassiumPermanganate');
    eq(activeWavelength(),lambdaMaxOf('potassiumPermanganate'),
       'the preset light sits at the solution\'s own lambda_max');
    eq(ST.blConc,blsById('potassiumPermanganate').cDefault,
       'and the concentration resets to that solution\'s default (PhET)');
    ST.lightMode='variable'; ST.wavelength=400;
    eq(activeWavelength(),400,'in variable mode the wavelength is whatever it is set to');
    setBlSolution('drinkMix');
    eq(activeWavelength(),400,'and changing the solution does not move it');
    ST.lightMode='preset';
    eq(activeWavelength(),lambdaMaxOf('drinkMix'),'switching back returns it to the peak');
    Object.assign(ST,DEFAULTS);
  }
  /* changing the solute empties the beaker, as PhET's does */
  { BK=makeBeaker('drinkMix',3,0.8);
    setSoluteId('copperSulfate');
    eq(BK.n,0,'changing the solute empties the solute (PhET)');
    close(BK.V,0.8,1e-15,'but leaves the water');
    eq(BK.solute,'copperSulfate','and the beaker knows which solute it now holds');
    Object.assign(ST,DEFAULTS); BK=makeBeaker(ST.solute,0,PHET.VOL_DEFAULT); }

  /* ---------- J. the canvas prose and the shared helpers ---------- */
  { const PROSE=[['CAP_BEAKER',CAP_BEAKER],['CAP_BEAKER_S',CAP_BEAKER_S],
                 ['CAP_LEDGER',CAP_LEDGER],['CAP_LEDGER_S',CAP_LEDGER_S],
                 ['CAP_COLOUR',CAP_COLOUR],['CAP_COLOUR_S',CAP_COLOUR_S]].concat(
      typeof CAP_CUVETTE==='undefined'?[]:[['CAP_CUVETTE',CAP_CUVETTE],['CAP_CUVETTE_S',CAP_CUVETTE_S],
        ['CAP_SPEC',CAP_SPEC],['CAP_SPEC_S',CAP_SPEC_S],['CAP_LAW',CAP_LAW],['CAP_LAW_S',CAP_LAW_S]]).concat(
      typeof CAP_SOLUTES==='undefined'?[]:[['CAP_SOLUTES',CAP_SOLUTES],['CAP_SOLUTES_S',CAP_SOLUTES_S]]);
    for(const [nm,t] of PROSE){
      ok(!/<su[bp]>/.test(t),nm+' carries no <sub>/<sup>: plain() strips them silently');
      ok(plain(t).indexOf('&')<0,nm+' decodes to literal glyphs');
      ok(plain(t).indexOf('<')<0,nm+' has no tags left after plain()');
      ok(t.length>80,nm+' says something'); } }
  { for(const [k] of TABS){
      ok((INFO[k]||'').length>300,'INFO['+k+'] is a paragraph');
      ok((DERIV[k]||'').length>200,'DERIV['+k+'] carries its derivation'); } }
  { eq(plain('&radic;K<sub>w</sub> &minus; x'),'√Kw − x','plain() decodes and strips');
    eq(plain('&#955;'),'λ','and numeric entities');
    eq(fmt(4.58236,2),'4.58','fmt to two places');
    eq(sciPlain(1.5848931924611141e-6,3),'1.585e-6','sciPlain for the canvas');
    eq(sciPlain(0),'0','and zero');
    eq(sciPlain(null),'—','and a missing value');
    eq(sci(null),'&mdash;','sci for the readout');
    ok(/^rgb\(\d+,\d+,\d+\)$/.test(mix(COL.pos,COL.ref,0.5)),'mix is well formed');
    eq(toRgb(shade(COL.pos,0)).join(),toRgb('#070b18').join(),'shade(col,0) is the page background');
    eq(rgbCss([1,2,3]),'rgb(1,2,3)','rgbCss');
    ok(ticksFor(0,780,6).length>=5,'ticksFor gives a full set on a sane range');
    eq(logTicks(0,10).length,0,'logTicks refuses a non-positive bound rather than looping'); }
  /* the house 2-D layer's own fixes, asserted so they cannot rot out from under this file */
  { const rc=makeShot(400,300), b=box(50,50,300,200);
    POLY_SEGS=[];
    polyline(rc,b,[-1,2],[0.5,0.5],0,1,0,1,'#fff',1);
    ok(POLY_SEGS.length===4,'polyline clips a segment whose BOTH ends are outside the box');
    close(POLY_SEGS[0],b.x,0.5,'and interpolates the crossing to the left edge');
    close(POLY_SEGS[2],b.x1,0.5,'and to the right edge'); }

  Object.assign(ST,stSave); BK=bkSave;
  PROBE.x=pxS; PROBE.y=pyS; DET.x=dxS; DET.y=dyS;
  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
