<title>Projectile Motion &mdash; the cannon, the drag, the envelope and the hodograph</title>
<!--
  ===================================================================
  projectile-motion.html — a cannon, a projectile and the air: the
  vacuum parabola in closed form, quadratic drag integrated and checked
  three independent ways, the envelope of every shot at one speed, and
  the hodograph that carries a falling body to its terminal velocity
  ===================================================================

  Remake of PhET Interactive Simulations' Projectile Motion (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0).  New code; no PhET
  code or assets.  The original (1.0.34) is docs/phets/projectile-motion_en.html.

  Six views.  THE LAUNCH (PhET's Intro screen): a cannon on a pedestal —
  drag the barrel to aim it, drag the pedestal to raise it — the initial
  speed, PhET's nine projectiles, air resistance on or off, a target with
  one to three stars, a tape measure and a data probe that reads time,
  range and height off the dots the flight leaves every 0.1 s.  THE
  VECTORS (PhET's Vectors screen): velocity, acceleration and force
  vectors, total or in components, on a 5-kg sphere you can resize and
  reweigh.  THE DRAG (PhET's Drag screen): air resistance always on, the
  drag coefficient (its shape drawn from teardrop to flat-faced cup), the
  diameter, the mass and the altitude, with the same shot in vacuum drawn
  beside it.  THE LAB (PhET's Lab screen): every projectile or a custom
  one, gravity from 5 to 20 m/s^2, altitude, air resistance.  THE
  ENVELOPE (analysis): every shot at one speed, the parabola of safety
  that bounds them in vacuum, and the range against the launch angle with
  both optimum angles.  THE HODOGRAPH (analysis): the flight in velocity
  space — a vertical line in vacuum, a curve that ends at the terminal
  velocity (0, -v_t) with drag — against its exact closed form, the speed
  against time and the energy ledger.

  WHAT IS EXACT
  -------------
  In vacuum everything is closed form: x = v0 cos(th) t, y = h + v0 sin(th) t
  - g t^2/2; the time of flight (v0 sin th + sqrt(v0^2 sin^2 th + 2gh))/g,
  the range, the apex, the landing speed sqrt(v0^2 + 2gh) (energy), the
  optimum angle tan th* = v0/sqrt(v0^2 + 2gh) with R* = (v0/g) sqrt(v0^2 +
  2gh), and the envelope y = h + v0^2/2g - g x^2/2v0^2.  The integrator
  reproduces them to rounding, because RK4 is exact on a quadratic in t.
  Quadratic drag has no closed form for a general angle.  It is integrated
  here by RK4 with the step h = min(2 ms, 0.005/(k|v|)), cut to land on
  every 0.1-s dot, the apex and the ground found by bisecting the partial
  step (60 halvings), and the energy lost to the air integrated as a fifth
  state inside the same RK4 stages.  Checked in selfTest against
    - scipy solve_ivp DOP853 at rtol = atol = 1e-13: worst 2.8e-11 relative
      over PhET's parameter box (the extreme corner m = 1 kg, d = 3 m,
      C_d = 1, g = 20), typically 1e-14..1e-13 (build/projectile-motion/
      derive.py, refvals.txt);
    - the EXACT hodograph of quadratic drag, 1/u^2 = 1/u0^2 + (k/g)[F(th) -
      F(phi)], F(psi) = sin psi / cos^2 psi + ln tan(pi/4 + psi/2), with t, x,
      y as quadratures over the velocity angle (Gauss-Legendre in the page,
      scipy quad in derive.py; the two routes agree with DOP853 to 6e-14);
    - the vertical closed forms: t_apex = (v_t/g) atan(v0/v_t), H = h +
      (v_t^2/2g) ln(1 + v0^2/v_t^2), and the fall v = v_t tanh(g t/v_t),
      y = H - (v_t^2/g) ln cosh(g t/v_t);
    - the limits: drag -> 0 recovers the vacuum range at the first-order
      rate dR/dk (a perturbation integral), and a long fall approaches the
      terminal speed v_t = sqrt(2mg/(rho C_d A)) = sqrt(g/k), k = rho C_d A/2m.
  The Python twin of the integrator (derive.py) pins every JS flight to
  1e-12.

  WHAT IS MODELLED
  ----------------
  Drag is quadratic, F = (1/2) rho C_d A v^2 against the velocity, with a
  constant drag coefficient: PhET's model, right for macroscopic bodies at
  high Reynolds number.  The air density is NASA Glenn's "Earth Atmosphere
  Model" curve fit, troposphere branch — PhET's choice:
      T = 15.04 - 0.00649 h  (deg C),   p = 101.29 [(T + 273.1)/288.08]^5.256  (kPa),
      rho = p / (0.2869 (T + 273.1))  (kg/m^3)
  (grc.nasa.gov/www/k-12/airplane/atmosmet.html).  It gives 1.2266 kg/m^3 at
  sea level, 0.13 % above the ISA's 1.2250 and 0.21 % above it at 5 km (both
  printed by derive.py); the altitude slider stops at 5 km, well inside the
  11-km troposphere.  Gravity is uniform, the ground flat at y = 0, and each
  projectile a point carrying its mass, its cross-section pi d^2/4 and C_d.
  The shot leaves from the cannon's pivot, as in PhET.  The clock advances
  a fixed 1/60 s per frame (x 0.33 in slow motion) so the headless suites
  are deterministic; the whole flight is integrated at launch and replayed
  by cubic Hermite interpolation between the integrator's nodes.  Changing
  the air, the altitude or gravity bends every projectile still in flight
  from its last node (as in PhET); mass, size, angle and speed apply to the
  next shot.

  WHAT IS NOT MODELLED
  --------------------
  Lift and spin (the Magnus force that carries a real golf ball and bends a
  baseball), the tumbling of the non-spherical objects, wind, the Reynolds-
  number dependence of C_d (the drag crisis), the buoyancy of the air, the
  Earth's curvature and rotation, the cannon's recoil and barrel length,
  bouncing.  PhET's own step is a 25-ms first-order scheme; on the Drag
  screen's default shot it lands 0.81 % short of the exact range (6.631 m
  against 6.686 m, derive.py section 11), so drag numbers here differ from
  the original's by that much; the vacuum numbers agree exactly.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's values, read out of projectile-motion_en.html 1.0.34
  (ProjectileObjectType, ProjectileMotionConstants, ProjectileMotionModel,
  Score, Tracer):  the projectiles (mass kg, diameter m, C_d) — cannonball
  17.6, 0.18, 0.47; tank shell 42, 0.15, 0.06; golf ball 0.05, 0.04, 0.25;
  baseball 0.15, 0.07, 0.35; football 0.41, 0.17, 0.05; pumpkin 5, 0.37,
  0.6; human 70, 0.5, 0.6; piano 400, 2.2, 1.2; car 2000, 2, 0.55; custom
  100, 1, 0.47; the Vectors/Drag sphere 5, 0.8, 0.47 — and each one's Lab
  slider range; g = 9.81 m/s^2; height 0..15 m, angle -90..90 deg, speed
  0..30 m/s, altitude 0..5000 m in 100-m steps, gravity 5..20 m/s^2, C_d
  0.04..1; the target at 15 m, 3 m wide, three stars within W/6, two
  within W/3, one within W/2; dots every 0.1 s and 1 s; three projectiles
  in flight and five paths kept; slow motion x 0.33; the air-density fit
  above.  The screens' defaults are PhET's (Intro: pumpkin, 10 m, 0 deg,
  15 m/s, no air; the others: 0 m, 80 deg, 18 m/s).  Everything else is
  computed, and every computed number is pinned in selfTest to derive.py.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities                                                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI, DEG=Math.PI/180, RAD=180/Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }

/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

/* ================================================================== *
 *  3-vector helpers, orbit camera, perspective projection (z-up)      *
 *  — same camera as lattice.html / steam_carnot_cycle.html            *
 * ================================================================== */
const v3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{ const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};
function makeCamera(theta,phi,dist,target){
  return {theta,phi,dist,fov:0.78,target:target||[0,0,0],W:800,H:600};
}
function camBasis(cam){
  const ct=Math.cos(cam.theta), stt=Math.sin(cam.theta);
  const cp=Math.cos(cam.phi),  sp=Math.sin(cam.phi);
  const dir=[ct*cp, stt*cp, sp];
  const eye=v3.add(cam.target, v3.mul(dir,cam.dist));
  const fwd=v3.mul(dir,-1);
  const right=v3.norm(v3.cross(fwd,[0,0,1]));

            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',

/* polyline — buoyancy.html (lineage pupil_plane_interferometry): CLIPPED IN

   and not the display-list audit, and the endpoint test the siblings used
   drops a segment whose both ends are outside.  Every emitted segment is
   recorded in POLY_SEGS so selfTest can keep legends off the curves. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));

    if(t1<1) started=false;

let LEGEND_RECTS=[];

function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';

  const bw=w+26, bh=items.length*15+8;

               [b.x+8,my],[b.x1-bw-8,my]];

    let hit=false;

  const t=plain(txt), fs=parseFloat((font||'11px').match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);

    const bx=[lx,ly,lx+w,ly+hh];

function envelopeY(x,h,v0,g){ return h+v0*v0/(2*g)-g*x*x/(2*v0*v0); }
function vacuumPath(h,thDeg,v0,g,n){
  const V=vacuum(h,thDeg,v0,g), th=thDeg*DEG, xs=[], ys=[];
  for(let i=0;i<=n;i++){ const t=V.T*i/n; xs.push(v0*Math.cos(th)*t); ys.push(h+v0*Math.sin(th)*t-0.5*g*t*t); }
  return {xs,ys};
}

/* ---- the drag integrator ---------------------------------------------------------
   State s = [x, y, vx, vy, w]: w is the energy per kilogram the air has taken,
   dw/dt = k|v|^3, carried as a fifth state INSIDE the RK4 stages so the ledger
   e_k + g y + w = e_0 holds to the integrator's truncation, not to a quadrature
   laid over it (Known-bad, cart_pendulum).  The step is h = min(H_MAX,
   C_STEP/(k|v|)), cut so a step ends exactly on every 0.1-s dot; the apex and
   the ground are found by bisecting the partial step.  build/projectile-motion/
   derive.py is this function's Python twin, line for line. */
const H_MAX=0.002, C_STEP=0.005, N_BIS=60, STEP_CAP=2000000;
function rk4s(s,h,g,k){
  const x=s[0], y=s[1], vx=s[2], vy=s[3], w=s[4];
  let sp=Math.sqrt(vx*vx+vy*vy), kd=k*sp;
  const a1=-kd*vx, b1=-g-kd*vy, p1=kd*sp*sp;
  const vx2=vx+0.5*h*a1, vy2=vy+0.5*h*b1;
  sp=Math.sqrt(vx2*vx2+vy2*vy2); kd=k*sp;
  const a2=-kd*vx2, b2=-g-kd*vy2, p2=kd*sp*sp;
  const vx3=vx+0.5*h*a2, vy3=vy+0.5*h*b2;
  sp=Math.sqrt(vx3*vx3+vy3*vy3); kd=k*sp;
  const a3=-kd*vx3, b3=-g-kd*vy3, p3=kd*sp*sp;
  const vx4=vx+h*a3, vy4=vy+h*b3;
  sp=Math.sqrt(vx4*vx4+vy4*vy4); kd=k*sp;
  const a4=-kd*vx4, b4=-g-kd*vy4, p4=kd*sp*sp;
  return [x+h/6*(vx+2*vx2+2*vx3+vx4), y+h/6*(vy+2*vy2+2*vy3+vy4),
          vx+h/6*(a1+2*a2+2*a3+a4), vy+h/6*(b1+2*b2+2*b3+b4), w+h/6*(p1+2*p2+2*p3+p4)];
}
function pushState(F,t,s){ F.t.push(t); F.x.push(s[0]); F.y.push(s[1]); F.vx.push(s[2]); F.vy.push(s[3]); F.w.push(s[4]); }
/* L = {h, th (deg), v0};  E = {g, k};  opt.from = [t, x, y, vx, vy, w] continues
   from a node; opt.cliff flies on past y = 0 (the ground is recorded, not
   obeyed) until opt.tEnd, a multiple of DOT. */
function flight(L,E,opt){
  opt=opt||{};
  const g=E.g, k=E.k, cliff=!!opt.cliff;
  let t, s;
  if(opt.from){ const f=opt.from; t=f[0]; s=[f[1],f[2],f[3],f[4],f[5]]; }
  else { const th=L.th*DEG; t=0; s=[0,L.h,L.v0*Math.cos(th),L.v0*Math.sin(th),0]; }
  const F={t:[t],x:[s[0]],y:[s[1]],vx:[s[2]],vy:[s[3]],w:[s[4]],dots:[],apexI:-1,landI:-1,steps:0,g,k};
  if(Math.abs(t/DOT-Math.round(t/DOT))<1e-9) F.dots.push(0);
  let nd=Math.floor(t/DOT+1e-9)+1;
  if(!cliff&&s[1]<=0&&s[3]<=0){ F.landI=0; return finishFlight(F); }   /* fired into the ground */
  for(;;){
    let hh=H_MAX;
    if(k>0){ const sp=Math.sqrt(s[2]*s[2]+s[3]*s[3]); if(k*sp*hh>C_STEP) hh=C_STEP/(k*sp); }
    const tD=nd*DOT; let hit=false;
    if(t+hh>tD-1e-9){ hh=tD-t; hit=true; }
    const ns=rk4s(s,hh,g,k); F.steps++;
    if(s[3]>0&&ns[3]<=0){                                   /* the apex is inside this step */
      let lo=0, hi=hh;
      for(let i=0;i<N_BIS;i++){ const m=0.5*(lo+hi); if(rk4s(s,m,g,k)[3]>0) lo=m; else hi=m; }
      pushState(F,t+hi,rk4s(s,hi,g,k)); F.apexI=F.t.length-1;
    }
    if(F.landI<0&&ns[1]<=0&&(s[1]>0||s[3]>0)){              /* and the ground */
      let lo=0, hi=hh;
      for(let i=0;i<N_BIS;i++){ const m=0.5*(lo+hi); if(rk4s(s,m,g,k)[1]>0) lo=m; else hi=m; }
      const Ls=rk4s(s,hi,g,k); Ls[1]=0;
      pushState(F,t+hi,Ls); F.landI=F.t.length-1;
      if(!cliff) return finishFlight(F);
    }
    s=ns;
    if(hit){ t=tD; nd++; } else t=t+hh;
    pushState(F,t,s);
    if(hit) F.dots.push(F.t.length-1);
    if(cliff&&hit&&t>=opt.tEnd-1e-9) return finishFlight(F);
    if(F.steps>STEP_CAP) throw new Error('flight: step cap exceeded');
  }
}
function finishFlight(F){
  const i=F.landI;
  if(i>=0){ const vx=F.vx[i], vy=F.vy[i];
    F.T=F.t[i]; F.R=F.x[i]; F.vL=Math.sqrt(vx*vx+vy*vy); F.angL=F.vL>0?Math.atan2(-vy,vx)*RAD:NaN; F.W=F.w[i]; }
  else { F.T=NaN; F.R=NaN; F.vL=NaN; F.angL=NaN; F.W=NaN; }
  F.H=F.apexI>=0?F.y[F.apexI]:F.y[0];
  F.apex=F.apexI>=0?{t:F.t[F.apexI],x:F.x[F.apexI],y:F.y[F.apexI]}:null;
  return F;
}
/* ---- playback: cubic Hermite between nodes (positions AND velocities) ---- */
function nodeBefore(F,tau){
  const t=F.t; let lo=0, hi=t.length-1;
  if(tau>=t[hi]) return hi;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(t[m]<=tau) lo=m; else hi=m; }
  return lo;
}
function stateAt(F,tau){
  const n=F.t.length;
  if(!(tau>F.t[0])) return {x:F.x[0],y:F.y[0],vx:F.vx[0],vy:F.vy[0],i:0};
  if(tau>=F.t[n-1]) return {x:F.x[n-1],y:F.y[n-1],vx:F.vx[n-1],vy:F.vy[n-1],i:n-1};
  const i=nodeBefore(F,tau), h=F.t[i+1]-F.t[i];
  if(!(h>0)) return {x:F.x[i+1],y:F.y[i+1],vx:F.vx[i+1],vy:F.vy[i+1],i:i+1};
  const s=(tau-F.t[i])/h, s2=s*s, s3=s2*s;
  const h00=2*s3-3*s2+1, h10=s3-2*s2+s, h01=-2*s3+3*s2, h11=s3-s2;
  return {x:h00*F.x[i]+h10*h*F.vx[i]+h01*F.x[i+1]+h11*h*F.vx[i+1],
          y:h00*F.y[i]+h10*h*F.vy[i]+h01*F.y[i+1]+h11*h*F.vy[i+1],
          vx:F.vx[i]+s*(F.vx[i+1]-F.vx[i]), vy:F.vy[i]+s*(F.vy[i+1]-F.vy[i]), i};
}
/* a change of air or gravity mid-flight: keep the path to the last node at
   or before tau and fly on from that node in the new conditions */
function continueFlight(F,tau,E){
  const i=Math.min(nodeBefore(F,tau),F.landI>0?F.landI-1:F.t.length-1);
  const C=flight(null,E,{from:[F.t[i],F.x[i],F.y[i],F.vx[i],F.vy[i],F.w[i]]});
  const cat=(a,b)=>a.slice(0,i+1).concat(b.slice(1));
  const G={t:cat(F.t,C.t),x:cat(F.x,C.x),y:cat(F.y,C.y),vx:cat(F.vx,C.vx),vy:cat(F.vy,C.vy),w:cat(F.w,C.w),
           dots:F.dots.filter(j=>j<=i).concat(C.dots.filter(j=>j>0).map(j=>j+i)),
           apexI:(F.apexI>=0&&F.apexI<=i)?F.apexI:(C.apexI>0?C.apexI+i:-1),
           landI:C.landI>=0?C.landI+i:-1, steps:F.steps+C.steps, g:E.g, k:E.k};
  return finishFlight(G);
}

/* ---- the exact hodograph of quadratic drag ------------------------------------------
   With phi the angle of the velocity, u = v cos(phi) obeys du/dphi = k u^3/(g cos^3 phi),
   so 1/u^2 = 1/u0^2 + (k/g)[F(th) - F(phi)], F(psi) = sin psi/cos^2 psi + ln tan(pi/4 + psi/2)
   (twice the integral of sec^3).  Then dt = -u sec^2(phi) dphi/g, dx = u dt, dy = u tan(phi) dt:
   t, x and y are quadratures over phi, done here by composite Gauss-Legendre.  None of
   this shares a line with the integrator above. */
function hodoF(psi){ const c=Math.cos(psi); return Math.sin(psi)/(c*c)+Math.log(Math.tan(PI/4+psi/2)); }
function hodoU(phi,th,u0,g,k){ return u0/Math.sqrt(1+k*u0*u0/g*(hodoF(th)-hodoF(phi))); }
/* Gauss-Legendre nodes and weights by Newton on P_n — computed, never typed
   (Known-bad: hand-transcribed coefficients fail silently in the tail) */
function gaussLegendre(n){
  const xs=[], ws=[];
  for(let i=1;i<=n;i++){
    let x=Math.cos(PI*(i-0.25)/(n+0.5)), p0=1, p1=x, dp=1;
    for(let it=0;it<100;it++){
      p0=1; p1=x;
      for(let j=2;j<=n;j++){ const p2=((2*j-1)*x*p1-(j-1)*p0)/j; p0=p1; p1=p2; }
      dp=n*(x*p1-p0)/(x*x-1);
      const dx=p1/dp; x-=dx;
      if(Math.abs(dx)<1e-16) break;
    }
    p0=1; p1=x;
    for(let j=2;j<=n;j++){ const p2=((2*j-1)*x*p1-(j-1)*p0)/j; p0=p1; p1=p2; }
    dp=n*(x*p1-p0)/(x*x-1);
    xs.push(x); ws.push(2/((1-x*x)*dp*dp));
  }
  return {xs,ws};
}
const GL10=gaussLegendre(10);
/* t, x, y at velocity angle phi (radians), for a launch at th from height h */
function hodoTXY(phi,th,v0,h,g,k,panels){
  const u0=v0*Math.cos(th), N=panels||48, a=phi, b=th, hw=(b-a)/(2*N);   /* 48: converged, see derive/refvals */
  let it=0, ix=0, iy=0;
  for(let p=0;p<N;p++){
    const c=a+(2*p+1)*hw;
    for(let q=0;q<10;q++){
      const psi=c+hw*GL10.xs[q], wq=hw*GL10.ws[q];
      const u=hodoU(psi,th,u0,g,k), cs=Math.cos(psi), sec2=1/(cs*cs);
      it+=wq*u*sec2; ix+=wq*u*u*sec2; iy+=wq*u*u*Math.tan(psi)*sec2;
    }
  }
  return {t:it/g, x:ix/g, y:h+iy/g};
}
/* the landing: the velocity angle at which y returns to 0 (bisection; y falls
   monotonically once phi < 0).  Valid for launch angles strictly inside
   (-90, 90) degrees and landing angles above 89.9 degrees below horizontal. */
function hodoLanding(L,E){
  const th=L.th*DEG;
  let lo=-89.9*DEG, hi=Math.min(th,0);
  if(!(hodoTXY(lo,th,L.v0,L.h,E.g,E.k).y<0)) return null;
  for(let i=0;i<70;i++){ const m=0.5*(lo+hi); if(hodoTXY(m,th,L.v0,L.h,E.g,E.k).y>0) hi=m; else lo=m; }
  const phi=0.5*(lo+hi), P=hodoTXY(phi,th,L.v0,L.h,E.g,E.k), u=hodoU(phi,th,L.v0*Math.cos(th),E.g,E.k);
  return {phi, angL:-phi*RAD, T:P.t, R:P.x, vL:u/Math.cos(phi)};
}

/* ---- range against angle, and the best angle -------------------------------------- */
function rangeAt(L,E,thDeg){
  if(!(E.k>0)) return vacuum(L.h,thDeg,L.v0,E.g).R;
  return flight({h:L.h,th:thDeg,v0:L.v0},E).R;
}
const GOLD_IT=40;
function optimumAngle(L,E){
  if(!(E.k>0)){ const V=vacuumOptimum(L.h,L.v0,E.g); return {th:V.th,R:V.R}; }
  const f=th=>rangeAt(L,E,th), r=(Math.sqrt(5)-1)/2;
  let a=0, b=90, c=b-r*(b-a), d=a+r*(b-a), fc=f(c), fd=f(d);
  for(let i=0;i<GOLD_IT;i++){
    if(fc>fd){ b=d; d=c; fd=fc; c=b-r*(b-a); fc=f(c); }
    else { a=c; c=d; fc=fd; d=a+r*(b-a); fd=f(d); }
  }
  const th=0.5*(a+b);
  return {th, R:f(th)};
}

/* ---- the target (PhET's Score: three stars inside W/6, two inside W/3, one inside W/2) ---- */
function starsFor(x,xt){
  const d=Math.abs(x-xt);
  return d<=TARGET_W/6?3:(d<=TARGET_W/3?2:(d<=TARGET_W/2?1:0));
}

/* ================================================================== *
 *  state: PhET's four screens as four scene views (each with its own   *
 *  cannon, projectiles, target, clock), two analysis views, the per-   *
 *  view model, the readout, the equation bar and the tag               *
 * ================================================================== */
const TABS=[['intro','the launch'],['vectors','the vectors'],['drag','the drag'],['lab','the lab'],
            ['env','the envelope'],['hodo','the hodograph']];
const SCENE_VIEWS=['intro','vectors','drag','lab'];
function isScene(v){ return SCENE_VIEWS.indexOf(v)>=0; }
const PFX={intro:'i_',vectors:'v_',drag:'d_',lab:'l_',env:'a_',hodo:'a_'};
/* role colours: green = the computed path and velocity, orange = the vacuum
   reference and the target, magenta = the live marker and the derived-
   secondary (acceleration, the energy the air takes), cyan = structure (the
   cannon, the ground, the probe), white = force, gold = the tape and stars */
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6', force:'#e9e9f0',
           tape:'#d9b44a', star:'#e8c24a', ground:'#0c1422', groundLine:'#35566b', edge:'#242a3a',
           cannon:'#39404f', cannon2:'#566077', sky:'#070b18'};
const RO_W=300, FRAME_DT=1/60;
const ANALYSIS_OBJS=OBJECTS.map(o=>({id:o.id,name:o.name})).concat([{id:'sphere',name:'the 5-kg sphere'}]);

/* PhET's per-screen defaults (Intro: pumpkin, 10 m, 0 deg, 15 m/s, no air;
   Vectors and Drag: the 5-kg, 0.8-m, C_d 0.47 sphere with air, 0 m, 80 deg,
   18 m/s; Lab: cannonball, no air, 0 m, 80 deg, 18 m/s).  Two departures,
   both so a view shows its subject at load: the Vectors view starts with
   velocity and acceleration on and strobes them along the shot, and the
   analysis views start on a baseball at 30 m/s with the air on. */
const DEFAULTS={
  view:'intro', zoom:1, speed:'normal', running:true, tape:false, probe:false, vacRef:true,
  i_obj:'pumpkin', i_air:false, i_h:10, i_th:0, i_v0:15, i_tgt:TARGET_X0,
  i_vt:false, i_vc:false, i_at:false, i_ac:false,
  v_m:5, v_d:0.8, v_air:true, v_h:0, v_th:80, v_v0:18, v_tgt:TARGET_X0,
  v_mode:'total', v_vel:true, v_acc:true, v_frc:false, v_strobe:true,
  d_cd:0.47, d_d:0.8, d_m:5, d_alt:0, d_h:0, d_th:80, d_v0:18, d_tgt:TARGET_X0,
  d_mode:'total', d_vel:false, d_frc:false,
  l_obj:'cannonball', l_m:17.6, l_d:0.18, l_cd:0.47, l_g:G_EARTH, l_alt:0, l_air:false,
  l_h:0, l_th:80, l_v0:18, l_tgt:TARGET_X0,
  a_obj:'baseball', a_air:true, a_alt:0, a_g:G_EARTH, a_h:0, a_th:45, a_v0:30, e_vac:true, o_cliff:true,
};
const ST=Object.assign({},DEFAULTS);
const ZOOM=[0.25,2];                               /* PhET's MIN_ZOOM, MAX_ZOOM */

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- what each view fires -------------------------------------------------------- */
function projOf(v,st){
  st=st||ST;
  if(v==='intro'){ const o=objById(st.i_obj); return {o,m:o.m,d:o.d,cd:o.cd}; }
  if(v==='vectors') return {o:SCREEN_OBJ,m:st.v_m,d:st.v_d,cd:SCREEN_OBJ.cd};
  if(v==='drag') return {o:SCREEN_OBJ,m:st.d_m,d:st.d_d,cd:st.d_cd};
  if(v==='lab'){ const o=objById(st.l_obj); return {o,m:st.l_m,d:st.l_d,cd:st.l_cd}; }
  const o=objById(st.a_obj); return {o,m:o.m,d:o.d,cd:o.cd};
}
function envOf(v,st){
  st=st||ST;
  const P=projOf(v,st), an=(v==='env'||v==='hodo');
  const air=v==='intro'?st.i_air:(v==='vectors'?st.v_air:(v==='drag'?true:(v==='lab'?st.l_air:st.a_air)));
  const alt=v==='drag'?st.d_alt:(v==='lab'?st.l_alt:(an?st.a_alt:0));
  const g=v==='lab'?st.l_g:(an?st.a_g:G_EARTH);
  const rho=airDensity(alt);
  return {g,rho,air:!!air,alt,k:air?dragK(P.m,P.d,P.cd,rho):0};
}
function launchOf(v,st){ st=st||ST; const p=PFX[v]; return {h:st[p+'h'],th:st[p+'th'],v0:st[p+'v0']}; }
function launchKey(v,st){
  const L=launchOf(v,st), P=projOf(v,st), E=envOf(v,st);
  return [P.o.id,P.m,P.d,P.cd,L.h,L.th,L.v0,E.g,E.k].join('|');
}
function predicted(v){ return memo('pred_'+v,launchKey(v,ST),()=>flight(launchOf(v,ST),envOf(v,ST))); }

/* ---- the scenes: each PhET screen keeps its own clock, paths, tape and probe ---- */
const SCN={};
function scnReset(v){ SCN[v]={t:0,trajs:[],score:null,tape:{x0:0,y0:0,x1:10,y1:0},probe:{x:8,y:4},nextId:1}; }
SCENE_VIEWS.forEach(scnReset);
function flyingCount(v){ let n=0; for(const tr of SCN[v].trajs) for(const p of tr.projs) if(!p.landed) n++; return n; }
/* fire: PhET's rules — at most three in the air; a shot identical to the last
   path (same object, mass, size, C_d, height, angle, speed, gravity and air)
   joins that path instead of making a new one; five paths are kept */
function fire(v){
  if(!isScene(v)) return false;
  const sc=SCN[v];
  if(flyingCount(v)>=MAX_FLYING) return false;
  const key=launchKey(v,ST), last=sc.trajs[sc.trajs.length-1];
  if(last&&!last.changed&&last.key===key){ last.projs.push({t0:sc.t,landed:false}); return true; }
  sc.trajs.push({id:sc.nextId++,key,F:predicted(v),L:launchOf(v,ST),E:envOf(v,ST),P:projOf(v,ST),
                 projs:[{t0:sc.t,landed:false}],changed:false});
  while(sc.trajs.length>MAX_TRAJ) sc.trajs.shift();
  return true;
}
function erase(v){ if(!isScene(v)) return; SCN[v].trajs=[]; SCN[v].score=null; }
/* advance the clock; a landing scores against the target and, as in PhET,
   only the most recent landed projectile of each path stays on the ground */
function advance(v,dt){
  const sc=SCN[v], was=flyingCount(v);
  sc.t+=dt;
  const tgt=ST[PFX[v]+'tgt'];
  for(const tr of sc.trajs){
    for(const p of tr.projs) if(!p.landed&&sc.t-p.t0>=tr.F.T){
      p.landed=true; p.tl=sc.t;
      sc.score={stars:starsFor(tr.F.R,tgt),x:tr.F.R,tgt,t:sc.t};
    }
    const landed=tr.projs.filter(p=>p.landed);
    if(landed.length>1){ let keep=landed[0]; for(const p of landed) if(p.tl>keep.tl||(p.tl===keep.tl&&p.t0>keep.t0)) keep=p;
      tr.projs=tr.projs.filter(p=>!p.landed||p===keep); }
  }
  return was>0;
}
/* air, altitude or gravity changed: every projectile still in the air flies on
   from its last node in the new conditions.  The furthest one keeps its path
   (the path bends where it is); the others behind it split off onto paths of
   their own, as in PhET's updateTrajectoriesWithMovingProjectiles. */
function retarget(v){
  if(!isScene(v)) return 0;
  const sc=SCN[v], E=envOf(v,ST), add=[]; let n=0;
  for(const tr of sc.trajs){
    const fly=tr.projs.filter(p=>!p.landed);
    if(!fly.length) continue;
    let lead=tr.projs[0]; for(const p of tr.projs) if(p.t0<lead.t0) lead=p;
    const conts=fly.map(p=>continueFlight(tr.F,sc.t-p.t0,E));
    fly.forEach((p,i)=>{
      n++;
      if(!lead.landed&&p===lead){ tr.F=conts[i]; tr.E=E; tr.changed=true; }
      else { add.push({id:sc.nextId++,key:tr.key,F:conts[i],L:tr.L,E,P:tr.P,projs:[p],changed:true});
             tr.projs.splice(tr.projs.indexOf(p),1); }
    });
  }
  for(const a of add) sc.trajs.push(a);
  while(sc.trajs.length>MAX_TRAJ) sc.trajs.shift();
  return n;
}
/* how far along its path a trajectory has been drawn: to its furthest projectile */
function shownUntil(tr,t){
  let a=0; for(const p of tr.projs) a=Math.max(a,t-p.t0);
  return Math.min(a,tr.F.T);
}
/* the data probe: the nearest READABLE point — a 0.1-s dot, the apex or the
   landing — already reached, within the sensing radius; the newest path wins
   (PhET's Tracer).  PhET senses within 0.2 m of model space whatever the zoom;
   here the radius is 0.45 m at zoom 1 and scales with it, so it stays about
   12 px on screen at every zoom (0.225 m at the closest, zoom 2). */
function probeRadius(){ return 0.45/ST.zoom; }
function probeRead(v){
  const sc=SCN[v], pr=sc.probe, r=probeRadius();
  for(let j=sc.trajs.length-1;j>=0;j--){
    const tr=sc.trajs[j], F=tr.F, lim=shownUntil(tr,sc.t)+1e-12;
    let best=null, bd=Infinity;
    const idx=F.dots.slice(); if(F.apexI>=0) idx.push(F.apexI); if(F.landI>=0) idx.push(F.landI);
    for(const i of idx){
      if(F.t[i]>lim) continue;
      const d=Math.hypot(F.x[i]-pr.x,F.y[i]-pr.y);
      if(d<=r&&(d<bd-1e-12||(Math.abs(d-bd)<=1e-12&&best&&F.t[i]>best.t))){ bd=d; best={t:F.t[i],x:F.x[i],y:F.y[i],apex:i===F.apexI,land:i===F.landI,j,d}; }
    }
    if(best) return best;
  }
  return null;
}
function tapeLength(v){ const T=SCN[v].tape; return Math.hypot(T.x1-T.x0,T.y1-T.y0); }
/* the energy ledger: max |v^2/2 + g y + w - e0| over the nodes (J/kg) */
function ledgerResidual(F){
  const e0=0.5*(F.vx[0]*F.vx[0]+F.vy[0]*F.vy[0])+F.g*F.y[0]+F.w[0];
  let worst=0;
  for(let i=0;i<F.t.length;i++){ const e=0.5*(F.vx[i]*F.vx[i]+F.vy[i]*F.vy[i])+F.g*F.y[i]+F.w[i]; worst=Math.max(worst,Math.abs(e-e0)); }
  return {e0,worst};
}

/* ---- the analysis views: the envelope and the hodograph ---------------------------- */
function analysisKey(st){ return [st.a_obj,st.a_air,st.a_alt,st.a_g,st.a_h,st.a_v0].join('|'); }
const FAN_STEP=7.5, R_STEP=2;
function envModel(st){
  const L=launchOf('env',st), E=envOf('env',st), P=projOf('env',st);
  const base=memo('env',analysisKey(st),()=>{
    const fan=[], ths=[], Rs=[], Rv=[];
    for(let a=0;a<=90+1e-9;a+=FAN_STEP) fan.push({th:a,F:E.k>0?flight({h:L.h,th:a,v0:L.v0},E):null});
    for(let a=0;a<=90+1e-9;a+=R_STEP){ ths.push(a); Rs.push(rangeAt(L,E,a)); Rv.push(vacuum(L.h,a,L.v0,E.g).R); }
    const opt=optimumAngle(L,E);
    return {fan,ths,Rs,Rv,opt,vopt:vacuumOptimum(L.h,L.v0,E.g),best:E.k>0?flight({h:L.h,th:opt.th,v0:L.v0},E):null};
  });
  const cur=memo('envcur',analysisKey(st)+'|'+st.a_th,()=>({F:E.k>0?flight(L,E):null,V:vacuum(L.h,L.th,L.v0,E.g)}));
  const Rcur=E.k>0?cur.F.R:cur.V.R;
  return Object.assign({L,E,P,cur,Rcur,Hmax:L.h+L.v0*L.v0/(2*E.g),vt:terminalSpeed(E.g,E.k)},base);
}
function hodoModel(st){
  const L=launchOf('hodo',st), E=envOf('hodo',st), P=projOf('hodo',st);
  return memo('hodo',analysisKey(st)+'|'+st.a_th+'|'+st.o_cliff,()=>{
    /* fly on past the ground only as far as it shows something: to 3 v_t/g past
       the landing when v_t is reachable (3 v_t/g <= 25 s), else a little way */
    const F=flight(L,E), vt=terminalSpeed(E.g,E.k), reach=isFinite(vt)&&3*vt/E.g<=25;
    const tEnd=Math.ceil(Math.min(40,reach?F.T+3*vt/E.g:1.5*F.T+0.5)/DOT-1e-9)*DOT;
    const C=st.o_cliff?flight(L,E,{cliff:true,tEnd}):null;
    const th=L.th*DEG, u0=L.v0*Math.cos(th), ex=[];
    if(Math.abs(L.th)<89.9&&L.v0>0){
      const n=240, lo=-89.6*DEG;
      for(let i=0;i<=n;i++){ const phi=th+(lo-th)*i/n, u=hodoU(phi,th,u0,E.g,E.k); ex.push([u,u*Math.tan(phi)]); }
    } else ex.push([0,L.v0*Math.sin(th)],[0,isFinite(vt)?-vt:-L.v0-E.g*1.5*F.T]);
    const HL=(E.k>0&&Math.abs(L.th)<89.9&&L.v0>0&&F.T>0&&F.angL<89.5)?hodoLanding(L,E):null;
    return {L,E,P,F,C,vt,reach,tEnd,ex,HL,led:ledgerResidual(C||F),ua:F.apex?F.vx[F.apexI]:null};
  });
}

function buildModel(){
  const st=ST, v=st.view, M={view:v,st};
  if(isScene(v)){
    const sc=SCN[v];
    M.L=launchOf(v,st); M.E=envOf(v,st); M.P=projOf(v,st);
    M.pred=predicted(v); M.vac=vacuum(M.L.h,M.L.th,M.L.v0,M.E.g); M.vt=terminalSpeed(M.E.g,M.E.k);
    M.sc=sc; M.t=sc.t; M.flying=flyingCount(v); M.tgt=st[PFX[v]+'tgt'];
    M.probe=st.probe?probeRead(v):null; M.tape=st.tape?tapeLength(v):null;
  }
  else if(v==='env') M.Env=envModel(st);
  else M.Hodo=hodoModel(st);
  return M;
}

/* ================================================================== *
 *  drawing: the scene (PhET's four screens), shared geometry          *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,dx:0,dy:0};
const SV=4, SA=5, SW=50, MIN_PX=6, STROBE=0.5;   /* px per m/s, px per m/s^2, weight in px, smallest body, strobe s */

function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function polyPx(ctx,pts,fill,stroke,lw){
  if(pts.length<2) return;
  ctx.beginPath(); pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}
/* an arrow in screen pixels; the head scales down on short arrows.  With a
   clip box it is cut where it leaves the box and the cut is marked with a
   bar instead of a head, so a clipped arrow cannot pass for a short one. */
function arrowPx(ctx,X,Y,dx,dy,col,lw,clip){
  const L=Math.hypot(dx,dy); if(!(L>=2.5)) return false;
  const ux=dx/L, uy=dy/L;
  if(clip){
    if(X<clip.x||X>clip.x1||Y<clip.y||Y>clip.y1) return false;
    let t=1;
    if(dx>0) t=Math.min(t,(clip.x1-X)/dx); else if(dx<0) t=Math.min(t,(clip.x-X)/dx);
    if(dy>0) t=Math.min(t,(clip.y1-Y)/dy); else if(dy<0) t=Math.min(t,(clip.y-Y)/dy);
    if(t<1){ const Xc=X+t*dx, Yc=Y+t*dy;
      ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(Xc,Yc); ctx.moveTo(Xc-4*uy,Yc+4*ux); ctx.lineTo(Xc+4*uy,Yc-4*ux);
      ctx.strokeStyle=col; ctx.lineWidth=lw||2; ctx.stroke(); return 'clipped'; }
  }
  const hh=Math.min(9,0.4*L), X1=X+dx, Y1=Y+dy;
  ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X1-0.6*hh*ux,Y1-0.6*hh*uy);
  ctx.strokeStyle=col; ctx.lineWidth=lw||2; ctx.lineCap='round'; ctx.stroke(); ctx.lineCap='butt';
  polyPx(ctx,[[X1,Y1],[X1-hh*ux+0.45*hh*uy,Y1-hh*uy-0.45*hh*ux],[X1-hh*ux-0.45*hh*uy,Y1-hh*uy+0.45*hh*ux]],col,null);
  return true;
}
function starPts(cx,cy,R){
  const out=[];
  for(let i=0;i<10;i++){ const a=-PI/2+i*PI/5, r=i%2?R*0.42:R; out.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); }
  return out;
}
/* the drag-coefficient body, in its own frame (+x along the motion), cross-
   section radius r: an ellipsoidal streamlined body below the sphere's 0.47
   (tail 3.2 r long at C_d = 0.04), the sphere at 0.47, and above it a sphere
   with its FRONT cut flat, which reaches the flat-faced hemisphere at 1.17 */
function cdBody(cd,r){
  const pts=[];
  if(cd<=0.47){
    const L=3.2*r*(0.47-cd)/(0.47-0.04);
    for(let i=0;i<=24;i++){ const a=-PI/2+PI*i/24; pts.push([r*Math.cos(a),r*Math.sin(a)]); }
    for(let i=1;i<24;i++){ const a=PI/2+PI*i/24; pts.push([(r+L)*Math.cos(a),r*Math.sin(a)]); }
  } else {
    const c=r*Math.max(0,1-(cd-0.47)/(1.17-0.47)), a0=Math.acos(c/r);
    for(let i=0;i<=40;i++){ const a=a0+(TAU-2*a0)*i/40; pts.push([r*Math.cos(a),r*Math.sin(a)]); }
  }
  return pts;
}
function cdWord(cd){ return cd<0.3?'streamlined':(cd<0.45?'a rounded body':(cd<=0.49?'a sphere':(cd<0.8?'a sphere cut flat in front':'a flat-faced cup'))); }
function bodyPoly(shape,cd,R,ang){         /* body outline in pixels about (0,0), rotated to the motion */
  let pts;
  if(shape==='spheroid'){ pts=[]; for(let i=0;i<32;i++){ const a=TAU*i/32; pts.push([1.6*R*Math.cos(a),R*Math.sin(a)]); } }
  else if(shape==='shell'){ pts=[[2.2*R,0],[1.2*R,-R],[-1.4*R,-R],[-1.4*R,R],[1.2*R,R]]; }
  else if(shape==='box'){ pts=[[-1.1*R,-0.7*R],[1.1*R,-0.7*R],[1.1*R,0.7*R],[-1.1*R,0.7*R]]; ang=0; }
  else if(shape==='cd') pts=cdBody(cd,R);
  else { pts=[]; for(let i=0;i<24;i++){ const a=TAU*i/24; pts.push([R*Math.cos(a),R*Math.sin(a)]); } }
  const c=Math.cos(ang), s=Math.sin(ang);
  return pts.map(p=>[p[0]*c-p[1]*s, -(p[0]*s+p[1]*c)]);   /* world y up -> screen y down */
}

/* ---- the scene geometry: ONE function serves the drawing and the pointer ---- */
function sceneCaption(M,s){
  const P=M.P, st=ST, v=M.view, bits=[];
  bits.push('Scale 1 m = '+fmt(s,1)+' px (zoom ×'+fmt(st.zoom,2)+'), both axes; dots every 0.1 s, the large ones every second.');
  const dpx=P.d*s;
  if(dpx<MIN_PX) bits.push('The '+(isScene(v)&&(v==='intro'||v==='lab')?P.o.name:'sphere')+' ('+sigf(P.d*100,3)+' cm) is drawn '+MIN_PX+' px across, ×'+fmt(MIN_PX/dpx,1)+' its size.');
  if(vecOn(v)) bits.push('Arrows: velocity '+SV+' px per m/s, acceleration '+SA+' px per m/s², forces with the weight mg drawn '+SW+' px.');
  if(M.E.air&&(st.vacRef||v==='drag')) bits.push('Orange dashed: the same shot without air'+(v==='drag'?'; green dashed: this shot with it, before you fire':'')+'.');
  if(v==='intro') bits.push('Target '+TARGET_W+' m wide: three stars within 0.5 m, two within 1 m, one within 1.5 m.');
  return bits.join(' ');
}
function sceneGeo(ctx,W,H,M){
  const narrow=isNarrow(W), top=stageTop()+4;
  const full=sceneCaption(M,sceneScale(W,ST.zoom));
  const fit=fitCaption(ctx,W,H,full,'Scale 1 m = '+fmt(sceneScale(W,ST.zoom),1)+' px; dots every 0.1 s.',W-40,top+260);
  const b=box(14,top,W-28,fit.capY-12-top);
  const s=sceneScale(W,ST.zoom), X0=b.x+92, Y0=b.y1-28;

function sceneScale(W,zoom){ return (W-28-92-10)/36*zoom; }
function vecOn(v){

/* which vectors a view shows: {vel, acc, frc, comp} */
function vecSet(v){

/* the vectors at one state: velocity v, acceleration a = (-k|v|vx, -g-k|v|vy),

function drawVectors(ctx,X,Y,S,g,k,m,VS,dim,labels,W,H,clip){
  const sp=Math.sqrt(S.vx*S.vx+S.vy*S.vy), ax=-k*sp*S.vx, ay=-g-k*sp*S.vy, sf=SW/(m*g);
  const fdx=-m*k*sp*S.vx, fdy=-m*k*sp*S.vy;
  const a=dim?0.55:1, cv=dim?mix(COL.sky,COL.pos,a):COL.pos, ca=dim?mix(COL.sky,COL.live,a):COL.live, cf=dim?mix(COL.sky,COL.force,a):COL.force;
  const lw=dim?1.4:2.2, XF=X+5;       /* forces start 5 px to the side: mg and a_y are colinear */
  const A=(x0,y0,ddx,ddy,col)=>arrowPx(ctx,x0,y0,ddx,ddy,col,lw,clip);
  if(VS.velT){ A(X,Y,SV*S.vx,-SV*S.vy,cv); if(labels) lab(ctx,W,H,X+SV*S.vx+5,Y-SV*S.vy,'v',cv,SM_FONT); }
  if(VS.velC){ A(X,Y,SV*S.vx,0,cv); A(X,Y,0,-SV*S.vy,cv);
    if(labels){ lab(ctx,W,H,X+SV*S.vx+5,Y,'vx',cv,SM_FONT); lab(ctx,W,H,X+5,Y-SV*S.vy,'vy',cv,SM_FONT); } }
  if(VS.accT){ A(X,Y,SA*ax,-SA*ay,ca); if(labels) lab(ctx,W,H,X+SA*ax-8,Y-SA*ay+6,'a',ca,SM_FONT,'right'); }
  if(VS.accC){ A(X,Y,SA*ax,0,ca); A(X,Y,0,-SA*ay,ca);
    if(labels){ lab(ctx,W,H,X+SA*ax-10,Y+10,'ax',ca,SM_FONT); lab(ctx,W,H,X-6,Y-SA*ay,'ay',ca,SM_FONT,'right'); } }
  if(VS.frcT){ A(XF,Y,0,SW,cf); A(XF,Y,sf*fdx,-sf*fdy,cf);
    if(labels){ lab(ctx,W,H,XF+6,Y+SW,'mg',cf,SM_FONT); if(k>0) lab(ctx,W,H,XF+sf*fdx-6,Y-sf*fdy-8,'Fd',cf,SM_FONT,'right'); } }
  if(VS.frcC){ A(XF,Y,0,SW,cf); A(XF,Y,sf*fdx,0,cf); A(XF,Y,0,-sf*fdy,cf);
    if(labels){ lab(ctx,W,H,XF+6,Y+SW,'mg',cf,SM_FONT); if(k>0) lab(ctx,W,H,XF+sf*fdx-6,Y-10,'Fdx',cf,SM_FONT,'right'); } }

/* a projectile body at a state (true size, never under MIN_PX across) */

/* a path drawn up to time tMax, clipped to the scene box in world coordinates */

function drawDots(ctx,G,F,tMax,col){
  const m=G.map, b=G.b;

    });

function drawScene(ctx,W,H,M){

  ctx.strokeStyle=COL.groundLine; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(b.x,map.Y0+0.5); ctx.lineTo(b.x1,map.Y0+0.5); ctx.stroke();

/* stageLayout — buoyancy.html p4 (lineage build_cycloid): the caption is
   measured first and the panels get what is left; the main panel stops
   short of the floating readout */
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
/* a sub-box of b with ONE scale on both axes (the thing drawn is a shape) */
function equalBox(b,xlo,xhi,ylo,yhi){
  const s=Math.min(b.w/(xhi-xlo),b.h/(yhi-ylo)), w=s*(xhi-xlo), hh=s*(yhi-ylo);
  return {bb:box(b.x+(b.w-w)/2,b.y+(b.h-hh)/2,w,hh),s};
}
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col,r){

  if(X<b.x-0.5||X>b.x1+0.5||Y<b.y-0.5||Y>b.y1+0.5) return null;

}
function flightXY(F,i1){ const xs=[], ys=[], n=Math.min(F.t.length-1,i1===undefined?F.t.length-1:i1), st=Math.max(1,Math.ceil(n/700));

    polyline(ctx,b,ths,rv,0,90,0,Rmax,COL.ref,1.6);
    if(air) polyline(ctx,b,Q.ths,Q.Rs,0,90,0,Rmax,COL.pos,1.8);
    const mv=marker(ctx,b,0,90,0,Rmax,Q.vopt.th,Q.vopt.R,COL.ref);
    if(mv) lab(ctx,W,H,mv[0]+8,mv[1]-10,'vacuum best '+fmt(Q.vopt.th,1)+'°',COL.ref,SM_FONT);
    if(air){ const mo=marker(ctx,b,0,90,0,Rmax,Q.opt.th,Q.opt.R,COL.pos); if(mo) lab(ctx,W,H,mo[0]-8,mo[1]+14,'with air '+fmt(Q.opt.th,1)+'°',COL.pos,SM_FONT,'right'); }
    marker(ctx,b,0,90,0,Rmax,clamp(L.th,0,90),Q.Rcur,COL.live,4);
  }
  caption(ctx,Ly.left,Ly.capY,Ly.capTxt,Ly.capW,'#767e92',CAP_FONT);
}

/* the hodograph's layout: the velocity plane is a SHAPE (one scale on both
   axes) and tall, so it takes the full height on the left and the two time
   plots stack on the right, clear of the readout; a narrow stage keeps the
   plane and the speed below it */
function hodoLayout(ctx,W,H,capFull,capShort){
  if(isNarrow(W)) return stageLayout(ctx,W,H,capFull,capShort,1,0.36,1);
  const left=56, right=W-RO_W-44, top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+300);
  const bot=fit.capY-44, span=right-left, wMain=Math.floor(0.46*span);
  const rx=left+wMain+76, rw=right-rx, gap=70, hh=(bot-top-gap)/2;
  return {narrow:false,left,right,capY:fit.capY,capTxt:fit.txt,capW,main:box(left,top,wMain,bot-top),
          bottom:[box(rx,top,rw,hh),box(rx,top+hh+gap,rw,hh)]};
}
function drawHodo(ctx,W,H,M){
  const Q=M.Hodo, L=Q.L, E=Q.E, F=Q.F, C=Q.C, vt=Q.vt, th=L.th*DEG, air=E.air;
  const G2=C||F, n=G2.t.length, iL=F.landI;
  let vxmax=0, vymin=0, vymax=0;
  for(let i=0;i<n;i++){ vxmax=Math.max(vxmax,G2.vx[i]); vymin=Math.min(vymin,G2.vy[i]); vymax=Math.max(vymax,G2.vy[i]); }
  if(Q.reach) vymin=Math.min(vymin,-vt);
  const pad=0.08*Math.max(vxmax,vymax-vymin,1);
  let xlo=-pad, xhi=vxmax+pad, ylo=vymin-pad; const yhi=Math.max(vymax,0)+pad;
  /* one scale on both axes, but never a sliver: a vertical launch has vx = 0
     throughout and would get a window a few pixels wide (the layout sweep) */
  if(xhi-xlo<0.45*(yhi-ylo)) xhi=xlo+0.45*(yhi-ylo);
  if(yhi-ylo<0.3*(xhi-xlo)) ylo=yhi-0.3*(xhi-xlo);
  const capFull='The hodograph: the tip of the velocity vector (vx, vy) through the flight, both axes to the same scale. '
    +(air?'Green: RK4, bright to the landing'+(C?', dim where the shot flies on past the ground as if off a cliff':'')+'; orange dashed: the exact curve u(φ) of quadratic drag, which it must follow; it ends at (0, −v_t) = (0, −'+sigf(vt,3)+' m/s)'
         +(Q.reach?'':', out of reach here: the approach would take about 3v_t/g = '+sigf(3*vt/E.g,3)+' s')+'. Faint orange: the same shot in vacuum, a vertical line, because gravity changes only vy.'
         :'In vacuum it is a vertical line: gravity changes only vy, at g = '+sigf(E.g,4)+' m/s² per second. Switch the air on to bend it.')
    +' Below: the speed against time, and the energy per kilogram — kinetic plus potential, what the air has taken, and their sum, which must stay flat.';
  const Ly=hodoLayout(ctx,W,H,capFull,'The velocity through the flight; the speed; the energy ledger.');
  const EB=equalBox(Ly.main,xlo,xhi,ylo,yhi), bb=EB.bb;
  axesR(ctx,bb,xlo,xhi,ylo,yhi,{title:titleFor(bb,'the velocity (vx, vy) through the flight','the hodograph'),xlab:'vx (m/s)',ylab:'vy (m/s)',nx:5,ny:5});
  polyline(ctx,bb,[xlo,xhi],[0,0],xlo,xhi,ylo,yhi,'#39404f',1,[2,3]);
  polyline(ctx,bb,[0,0],[ylo,yhi],xlo,xhi,ylo,yhi,'#39404f',1,[2,3]);
  if(air){ const u0=L.v0*Math.cos(th), V=vacuum(L.h,L.th,L.v0,E.g);
    polyline(ctx,bb,[u0,u0],[L.v0*Math.sin(th),C?Math.min(V.vy,ylo):V.vy],xlo,xhi,ylo,yhi,rgba(COL.ref,0.4),1.2); }
  polyline(ctx,bb,Q.ex.map(p=>p[0]),Q.ex.map(p=>p[1]),xlo,xhi,ylo,yhi,COL.ref,1.8,[6,5]);
  { const a=[], b=[]; for(let i=0;i<=iL;i+=Math.max(1,Math.ceil(iL/600))){ a.push(F.vx[i]); b.push(F.vy[i]); } a.push(F.vx[iL]); b.push(F.vy[iL]);
    polyline(ctx,bb,a,b,xlo,xhi,ylo,yhi,COL.pos,2.2); }
  if(C){ const j0=C.landI, a=[], b=[]; const stp=Math.max(1,Math.ceil((C.t.length-j0)/600));
    for(let i=j0;i<C.t.length;i+=stp){ a.push(C.vx[i]); b.push(C.vy[i]); }
    polyline(ctx,bb,a,b,xlo,xhi,ylo,yhi,rgba(COL.pos,0.45),1.6); }
  const pL=marker(ctx,bb,xlo,xhi,ylo,yhi,F.vx[iL],F.vy[iL],COL.live);
  if(pL){ const O=[bb.x+bb.w*(0-xlo)/(xhi-xlo),bb.y1-bb.h*(0-ylo)/(yhi-ylo)];
    ctx.strokeStyle=rgba(COL.live,0.7); ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(O[0],O[1]); ctx.lineTo(pL[0],pL[1]); ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,W,H,pL[0]+9,pL[1]+2,'lands: '+sigf(F.vL,3)+' m/s, '+fmt(F.angL,1)+'° down',COL.live,SM_FONT); }
  const p0=marker(ctx,bb,xlo,xhi,ylo,yhi,L.v0*Math.cos(th),L.v0*Math.sin(th),COL.struct,3.5);
  if(p0) lab(ctx,W,H,p0[0]+8,p0[1]-8,'launch',COL.struct,SM_FONT);
  if(Q.reach&&-vt>=ylo){ const pt=marker(ctx,bb,xlo,xhi,ylo,yhi,0,-vt,COL.ref,4); if(pt) lab(ctx,W,H,pt[0]+9,pt[1],'(0, −v_t)',COL.ref,SM_FONT); }
  else if(air) lab(ctx,W,H,bb.x+8,bb.y1-12,'v_t = '+sigf(vt,3)+' m/s: off this plot',COL.ref,SM_FONT);
  legendAuto(ctx,bb,air?[[COL.pos,'RK4'],[COL.ref,'exact hodograph'],[COL.live,'landing']]:[[COL.pos,'RK4'],[COL.ref,'exact: vx = const']]);
  const tEnd=G2.t[n-1];
  if(Ly.bottom.length>0){
    const b=Ly.bottom[0], sp=[], ts=[], stp=Math.max(1,Math.ceil(n/500));
    for(let i=0;i<n;i+=stp){ ts.push(G2.t[i]); sp.push(Math.sqrt(G2.vx[i]*G2.vx[i]+G2.vy[i]*G2.vy[i])); }
    const smax=Math.max(sp.reduce((a,c)=>Math.max(a,c),0),Q.reach?vt:0)*1.12||1;
    axesR(ctx,b,0,tEnd,0,smax,{title:titleFor(b,'the speed |v| against time','speed'),xlab:'t (s)',ylab:'m/s',nx:5,ny:4});
    if(isFinite(vt)&&vt<=smax) polyline(ctx,b,[0,tEnd],[vt,vt],0,tEnd,0,smax,COL.ref,1.2,[5,4]);
    const k1=ts.findIndex(t=>t>F.T);
    polyline(ctx,b,k1<0?ts:ts.slice(0,k1+1),k1<0?sp:sp.slice(0,k1+1),0,tEnd,0,smax,COL.pos,1.8);
    if(k1>0) polyline(ctx,b,ts.slice(k1),sp.slice(k1),0,tEnd,0,smax,rgba(COL.pos,0.45),1.4);
    marker(ctx,b,0,tEnd,0,smax,F.T,F.vL,COL.live,3.5);
  }
  if(Ly.bottom.length>1){
    const b=Ly.bottom[1], ts=[], ep=[], ww=[], sm=[], stp=Math.max(1,Math.ceil(n/500)), e0=Q.led.e0;
    for(let i=0;i<n;i+=stp){ const e=0.5*(G2.vx[i]*G2.vx[i]+G2.vy[i]*G2.vy[i])+E.g*G2.y[i]; ts.push(G2.t[i]); ep.push(e); ww.push(G2.w[i]); sm.push(e+G2.w[i]); }
    let lo=0, hi=e0; for(let i=0;i<ep.length;i++){ lo=Math.min(lo,ep[i]); hi=Math.max(hi,ep[i],ww[i]); }
    const pad2=0.08*(hi-lo||1);
    axesR(ctx,b,0,tEnd,lo-pad2,hi+pad2,{title:titleFor(b,'energy per kilogram: e_k + g y, the air’s share w, and their sum','energy per kg'),xlab:'t (s)',ylab:'J/kg',nx:5,ny:4});
    polyline(ctx,b,ts,sm,0,tEnd,lo-pad2,hi+pad2,COL.ref,1.6,[6,4]);
    polyline(ctx,b,ts,ep,0,tEnd,lo-pad2,hi+pad2,COL.pos,1.8);
    polyline(ctx,b,ts,ww,0,tEnd,lo-pad2,hi+pad2,COL.live,1.6);
    legendAuto(ctx,b,[[COL.pos,'e_k + g y'],[COL.live,'w, taken by the air'],[COL.ref,'the sum']]);
  }
  caption(ctx,Ly.left,Ly.capY,Ly.capTxt,Ly.capW,'#767e92',CAP_FONT);
}

 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle=COL.sky; ctx.fillRect(0,0,W,H);
  if(isScene(M.view)) drawScene(ctx,W,H,M);
  else if(M.view==='env') drawEnv(ctx,W,H,M);
  else drawHodo(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame of the current scene's clock (1/60 s, x 0.33 in slow motion);
     true when something was in the air, which is what makes the loop repaint */
  S.dt=function(){ return FRAME_DT*(ST.speed==='slow'?SLOW:1); };
  S.step=function(){
    if(!ST.running||!isScene(ST.view)) return false;
    return advance(ST.view,S.dt());
  };
  /* the pointer: in a scene, the probe, the tape's two ends, the target, the
     barrel (aim) and the pedestal (height), in that order; the analysis views
     take no pointer and no wheel */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const v=ST.view; if(!isScene(v)) return false;
    const ctx=canvas.getContext('2d'), M=buildModel(), G=sceneGeo(ctx,S.W,S.H,M), map=G.map, sc=SCN[v], p=PFX[v];
    const wx=map.wx(x), wy=map.wy(y), b=G.b;
    if(type==='down'){
      if(ST.probe&&Math.hypot(x-map.X(sc.probe.x),y-map.Y(sc.probe.y))<=14){ DRAG.what='probe'; DRAG.dx=wx-sc.probe.x; DRAG.dy=wy-sc.probe.y; return true; }
      if(ST.tape){ const T=sc.tape;
        if(Math.hypot(x-map.X(T.x1),y-map.Y(T.y1))<=11){ DRAG.what='tip'; DRAG.dx=wx-T.x1; DRAG.dy=wy-T.y1; return true; }
        if(Math.hypot(x-map.X(T.x0),y-map.Y(T.y0))<=11){ DRAG.what='base'; DRAG.dx=wx-T.x0; DRAG.dy=wy-T.y0; return true; } }
      const Xt=map.X(ST[p+'tgt']), hw=TARGET_W/2*map.s;
      if(x>=Xt-hw-4&&x<=Xt+hw+4&&y>=map.Y0-16&&y<=map.Y0+10){ DRAG.what='target'; DRAG.dx=wx-ST[p+'tgt']; return true; }
      const bx=G.muz[0]-G.piv[0], by=G.muz[1]-G.piv[1], u=((x-G.piv[0])*bx+(y-G.piv[1])*by)/(bx*bx+by*by);
      if(u>0.3&&u<=1.15&&Math.hypot(x-G.piv[0]-u*bx,y-G.piv[1]-u*by)<=G.wb/2+5){ DRAG.what='barrel'; return true; }
      const rp=Math.max(8,0.35*map.s)+6;
      if((Math.abs(x-G.piv[0])<=G.pedW/2+6&&y>=G.piv[1]-6&&y<=map.Y0+4)||Math.hypot(x-G.piv[0],y-G.piv[1])<=rp){
        DRAG.what='height'; DRAG.dy=wy-ST[p+'h']; return true; }
      return false;
    }
    if(type!=='move'||!DRAG.what) return false;
    const xa=map.wx(b.x), xb=map.wx(b.x1), yb=map.wy(b.y);
    if(DRAG.what==='barrel') ST[p+'th']=clamp(Math.round(Math.atan2(wy-ST[p+'h'],wx)*RAD),LIM.th[0],LIM.th[1]);
    else if(DRAG.what==='height') ST[p+'h']=clamp(Math.round((wy-DRAG.dy)*10)/10,LIM.h[0],LIM.h[1]);
    else if(DRAG.what==='target') ST[p+'tgt']=clamp(Math.round((wx-DRAG.dx)*10)/10,0,Math.max(1,Math.floor(xb-2)));
    else if(DRAG.what==='probe'){ sc.probe.x=clamp(wx-DRAG.dx,xa,xb); sc.probe.y=clamp(wy-DRAG.dy,0,yb); }
    else { const T=sc.tape, X=clamp(wx-DRAG.dx,xa,xb), Y=clamp(wy-DRAG.dy,0,yb);
      if(DRAG.what==='tip'){ T.x1=X; T.y1=Y; } else { T.x0=X; T.y0=Y; } }
    return true;
  };
  /* the wheel zooms a scene about the cannon, within PhET's 0.25..2 */
  S.wheel=function(dy){
    if(!isScene(ST.view)) return false;
    const z=clamp(ST.zoom*Math.exp(-dy*0.0015),ZOOM[0],ZOOM[1]);
    if(z===ST.zoom) return false;
    ST.zoom=z; return true;
  };
  return S;
}

function roundTo(x,step){ return Number((Math.round(x/step)*step).toFixed(8)); }

  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function slider(key,lab2,lo,hi,step2,fmtf,onchg){

    const val=h('span',{class:'val'});

    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });

  }

     or logarithmic for the mass, which spans up to three decades */

    const inp=h('input',{type:'range',min:0,max:1,step:0.001,value:0});

  const gVecD=h('div',{class:'grp'},h('h3',null,'vectors'),chipRow(MODES,'d_mode'),h('div',{class:'checks'},
    checkbox('d_vel','velocity'),checkbox('d_frc','force')));

  /* ---- tools and time (every scene) ---- */
  const gTools=h('div',{class:'grp'},h('h3',null,'tools'),h('div',{class:'checks'},
    checkbox('tape','tape measure'),checkbox('probe','data probe'),checkbox('vacRef','the same shot without air (when the air is on)')));
  gTools.appendChild(slider('zoom','zoom',ZOOM[0],ZOOM[1],0.01,v=>'×'+fmt(v,2)));
  const gTime=h('div',{class:'grp'},h('h3',null,'time'),h('div',{class:'checks'},checkbox('running','time runs')));
  gTime.appendChild(chipRow([{id:'normal',name:'normal'},{id:'slow',name:'slow (×0.33)'}],'speed'));
  gTime.appendChild(h('div',{class:'btnrow'},button('step',()=>{ if(isScene(st.view)) advance(st.view,S.dt()); })));
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  /* ---- the analysis views share one shot ---- */
  const gShot=h('div',{class:'grp'},h('h3',null,'the shot'));
  gShot.appendChild(chipRow(ANALYSIS_OBJS,'a_obj'));
  gShot.appendChild(h('div',{class:'checks'},checkbox('a_air','air resistance')));
  gShot.appendChild(slider('a_alt','altitude',LIM.alt[0],LIM.alt[1],100,v=>fmt(v,0)+' m'));
  gShot.appendChild(slider('a_g','gravity',LIM.g[0],LIM.g[1],0.01,v=>fmt(v,2)+' m/s²'));
  gShot.appendChild(slider('a_h','height',LIM.h[0],LIM.h[1],0.1,v=>fmt(v,1)+' m'));
  gShot.appendChild(slider('a_th','angle',LIM.th[0],LIM.th[1],1,v=>fmt(v,0)+'°'));
  gShot.appendChild(slider('a_v0','initial speed',LIM.v0[0],LIM.v0[1],0.1,v=>fmt(v,1)+' m/s'));
  const gEnvO=h('div',{class:'grp'},h('h3',null,'the fan'),h('div',{class:'checks'},checkbox('e_vac','the same fan in vacuum')));
  const gHodO=h('div',{class:'grp'},h('h3',null,'the flight'),h('div',{class:'checks'},checkbox('o_cliff','fly on past the ground, as if off a cliff')));

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},button('reset all',()=>{
    const v=st.view; Object.assign(st,DEFAULTS); st.view=v; SCENE_VIEWS.forEach(scnReset); DRAG.what=null; syncChips(); })));
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Projectile Motion (University of Colorado Boulder, '
      +'phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. PhET&rsquo;s values, read out of projectile-motion 1.0.34: '
      +'the nine projectiles&rsquo; mass, diameter and drag coefficient, g = 9.81 m/s&sup2;, the slider ranges, the target and its stars, '
      +'and NASA Glenn&rsquo;s air-density fit. Everything else is computed and pinned in selfTest to build/projectile-motion/derive.py '
      +'(scipy DOP853, the exact hodograph of quadratic drag, the vacuum and vertical closed forms).'}));
  const GROUPS=[gObjI,gObjV,gObjD,gObjL,gWorld,gCanI,gCanV,gCanD,gCanL,gVecI,gVecV,gVecD,gShot,gEnvO,gHodO,gTools,gTime,gReset,gInfo];
  GROUPS.forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info');

  function syncChips(){
    for(const [cw,list,key] of CHIPROWS)
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
  }
  function syncPanel(){
    const v=st.view, sc=isScene(v);
    gObjI.hidden=v!=='intro'; gCanI.hidden=v!=='intro'; gVecI.hidden=v!=='intro';
    gObjV.hidden=v!=='vectors'; gCanV.hidden=v!=='vectors'; gVecV.hidden=v!=='vectors';
    gObjD.hidden=v!=='drag'; gCanD.hidden=v!=='drag'; gVecD.hidden=v!=='drag';
    gObjL.hidden=v!=='lab'; gWorld.hidden=v!=='lab'; gCanL.hidden=v!=='lab';
    gShot.hidden=sc; gEnvO.hidden=v!=='env'; gHodO.hidden=v!=='hodo';
    gTools.hidden=!sc; gTime.hidden=!sc;
    /* a control that is live but ignored is worse than none: dim it (Known-bad) */
    rows.l_cd.inp.disabled=!(st.l_obj==='custom'&&st.l_air);
    rows.l_alt.inp.disabled=!st.l_air; rows.a_alt.inp.disabled=!st.a_air;
    const full=sc&&flyingCount(v)>=MAX_FLYING; fireBtns.forEach(b=>{ b.disabled=full; });
    for(const k in rows) rows[k].sync();
    const O=objById(st.i_obj);
    tagObjI.innerHTML=O.name+': '+sigf(O.m,3)+' kg, '+sigf(O.d,3)+' m across, C<sub>d</sub> '+fmt(O.cd,2)+(st.i_air?'':' <span class="r">(C<sub>d</sub> unused: no air)</span>');
    tagObjV.innerHTML='drag coefficient '+fmt(SCREEN_OBJ.cd,2)+' (a sphere)'+(st.v_air?'':' <span class="r">— unused: no air</span>');
    tagObjD.innerHTML='C<sub>d</sub> '+fmt(st.d_cd,2)+': '+cdWord(st.d_cd)+'; air '+sigf(airDensity(st.d_alt),4)+' kg/m&sup3; at '+fmt(st.d_alt,0)+' m (NASA Glenn fit)';
    tagObjL.innerHTML=st.l_obj==='custom'?'custom: every value yours; C<sub>d</sub> works with the air on':'C<sub>d</sub> '+fmt(st.l_cd,2)+' is '+objById(st.l_obj).name+'&rsquo;s own (PhET&rsquo;s value)';
    timeTag.innerHTML='<b>f</b> fires &nbsp; <b>e</b> erases &nbsp; space pauses &nbsp; 1&ndash;6 switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=isScene(st.view)?'fire · drag the barrel, the pedestal, the target, the tape, the probe · wheel zooms':'1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    const r=canvas.getBoundingClientRect();
    /* a grab changes nothing on screen, so it does not mark the frame dirty; the moves do */
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); tagEl.innerHTML=tagHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ if(S.wheel(e.deltaY)){ e.preventDefault(); rows.zoom.sync(); dirty=true; } },{passive:false});

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='f'){ if(fire(st.view)){ syncPanel(); dirty=true; refresh(); } }
    else if(e.key==='e'){ erase(st.view); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        const fly=isScene(st.view)?flyingCount(st.view):0;
        if(advanced&&(fly!==lastFly||frameN%8===0)){ roEl.innerHTML=readoutHTML(S.model()); syncPanel(); }
        lastFly=fly;
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  intro:'This is PhET&rsquo;s Intro screen. The cannon sits on a pedestal: drag its barrel to aim it and the pedestal to raise it, '
    +'pick one of PhET&rsquo;s nine projectiles, and fire. Without air every one of them leaves on the same parabola &mdash; a golf ball '
    +'and a piano fly identical paths, because when gravity is the only force the mass cancels out of Newton&rsquo;s second law. Every '
    +'number about that parabola is closed form, down to the landing speed &radic;(v<sub>0</sub>&sup2; + 2gh), which does not depend on the angle at all. '
    +'Switch the air on and the objects part company: the drag &frac12;&rho;C<sub>d</sub>Av&sup2; is divided by the mass, so a light, wide, blunt '
    +'pumpkin loses far more than a dense, narrow, pointed tank shell. Land on the target for stars; the data probe reads the time, range and '
    +'height off the dots the flight leaves every tenth of a second, and the tape measures anything.',
  vectors:'PhET&rsquo;s Vectors screen. The velocity (green) is tangent to the path. The acceleration (magenta) in vacuum is g, straight down, '
    +'at every instant &mdash; the single fact that makes the path a parabola: v<sub>x</sub> never changes and v<sub>y</sub> falls at a steady rate. '
    +'With the air on, the drag adds a part pointing back along the velocity, so the acceleration leans against the motion and weakens as the '
    +'shot slows. The force arrows show the weight and the drag separately, the weight drawn at a fixed length so the drag reads as a fraction '
    +'of it. The dashed path carries a strobe of the same vectors every half second, before you fire. Resize or reweigh the sphere: in vacuum '
    +'nothing moves; with air a wider or lighter sphere is dragged harder, because only &rho;C<sub>d</sub>A/2m enters the motion.',
  drag:'PhET&rsquo;s Drag screen, with the air always on. The drag coefficient says how bluff the body is: 0.47 is a sphere, smaller values a '
    +'streamlined body, larger ones a sphere with its front cut flat, toward a flat-faced cup (the shape is drawn at the top left). The green '
    +'dashed curve is this shot with the air and the orange one the same shot in vacuum. The difference is not a shrunken copy: with drag the '
    +'shot climbs less, lands short, and comes down steeper than it went up, because it is slower on the way down. Raise the altitude and '
    +'the air thins &mdash; NASA Glenn&rsquo;s atmosphere fit, PhET&rsquo;s model, gives 1.227 kg/m&sup3; at sea level and 0.738 at 5 km &mdash; '
    +'so the shot flies further. The terminal speed &radic;(2mg/&rho;C<sub>d</sub>A) in the readout is where the drag would hold the weight: '
    +'this default sphere reaches it at 18.4 m/s, about the speed it is fired at.',
  lab:'PhET&rsquo;s Lab screen: any projectile, or a custom one, and a world you can change. Gravity runs from 5 to 20 m/s&sup2;; in vacuum, fired '
    +'from the ground, the range scales as 1/g, so halving gravity doubles it. The mass matters only with the air on, and only through k = &rho;C<sub>d</sub>A/2m: '
    +'a projectile twice as heavy and &radic;2 times as wide flies exactly the same path, which the self-test asserts. Changing gravity, the air or '
    +'the altitude while projectiles are in flight bends their paths from where they are, as in PhET; the mass, the size and the launch '
    +'settings apply to the next shot. The drag coefficient is each object&rsquo;s own (the piano&rsquo;s 1.2 is PhET&rsquo;s value); only the '
    +'custom projectile lets you set it.',
  env:'Every shot at one speed. In vacuum the family of parabolas has an envelope, the parabola of safety y = h + v<sub>0</sub>&sup2;/2g &minus; '
    +'gx&sup2;/2v<sub>0</sub>&sup2;, whose focus is the cannon: the shot at angle &theta; touches it where tan &theta; = v<sub>0</sub>&sup2;/gx, which is above the '
    +'ground for every shot steeper than the best angle (the flatter ones land first), and nothing fired at that speed reaches beyond it. '
    +'Its foot on the ground is the longest range, at tan &theta;* = v<sub>0</sub>/&radic;(v<sub>0</sub>&sup2; + 2gh): '
    +'45&deg; from the ground and less from a height, because a flatter shot spends the extra fall moving forward. With the air on the whole fan '
    +'shrinks and the best angle drops below 45&deg;, since a flatter shot spends less time in the air losing speed. That angle is found here by '
    +'golden-section search over full integrations and checked against scipy&rsquo;s.',
  hodo:'The hodograph is the path traced by the tip of the velocity vector. In vacuum it is a vertical line crossed at a steady rate: gravity '
    +'changes v<sub>y</sub> by g every second and leaves v<sub>x</sub> alone. Quadratic drag has no closed-form trajectory, but its hodograph '
    +'is exact: with u = v cos &phi; the horizontal velocity and &phi; its angle, 1/u&sup2; &minus; 1/u<sub>0</sub>&sup2; = (k/g)[F(&theta;) &minus; F(&phi;)], '
    +'F(&psi;) = sin &psi;/cos&sup2;&psi; + ln tan(&pi;/4 + &psi;/2). The orange curve is that formula and the green one the integrator, which '
    +'must lie on it. Integrating dt = &minus;u sec&sup2;&phi; d&phi;/g along the formula gives the range by a route that shares no code with the '
    +'integrator, and the readout compares the two. Let the shot fly on past the ground and the curve heads for (0, &minus;v<sub>t</sub>), where '
    +'the drag holds the weight. The energy ledger below must stay flat: what the shot loses in kinetic plus potential energy is exactly what '
    +'the air has taken, integrated inside the same steps.',

  { const Q=withState({view:'env'},()=>buildModel().Env); rel(Q.opt.th,R('optimum baseball v0=30 angle (deg)'),2e-5,'the envelope view\'s best angle (scipy)');
    rel(Q.best.R,Q.opt.R,1e-12,'and it draws the shot at that angle'); eq(Q.fan.length,13,'thirteen shots in the fan');
    rel(Q.Rs[Q.ths.indexOf(44)],flight({h:0,th:44,v0:30},{g:9.81,k:kOf('baseball')}).R,1e-15,'the R(theta) curve is made of real flights'); }

  /* ---------- 15. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const flyAt=(v,t)=>{ fire(v); advance(v,t); };
  const CONFIGS=[
    ['intro default',{view:'intro'},null,6],
    ['intro air, all vectors, in flight',{view:'intro',i_air:true,i_vt:true,i_vc:true,i_at:true,i_ac:true},v=>flyAt(v,0.6),8],
    ['intro golf ball, probe and tape',{view:'intro',i_obj:'golfBall',probe:true,tape:true},v=>{ flyAt(v,2); SCN[v].probe={x:7.5,y:8.77}; },8],
    ['intro zoomed out, five paths',{view:'intro',zoom:0.25,i_h:0,i_v0:30,i_air:true},v=>{ for(const a of [15,30,45,60,75,85]){ ST.i_th=a; flyAt(v,5); } },8],
    ['intro zoom 2, cannon at 15 m, down',{view:'intro',zoom:2,i_h:15,i_th:-45},null,5],
    ['vectors default strobe',{view:'vectors'},null,8],
    ['vectors components and force, in flight',{view:'vectors',v_mode:'components',v_frc:true},v=>flyAt(v,1.0),8],
    ['drag default',{view:'drag'},null,7],
    ['drag streamlined at 5 km',{view:'drag',d_cd:0.04,d_alt:5000},null,7],
    ['drag blunt light, vectors in flight',{view:'drag',d_cd:1,d_d:1,d_m:1,d_th:45,d_vel:true,d_frc:true},v=>flyAt(v,0.5),8],
    ['lab default',{view:'lab'},null,6],
    ['lab custom extreme',{view:'lab',l_obj:'custom',l_m:1,l_d:3,l_cd:1,l_air:true,l_g:20,l_h:15,l_th:60,l_v0:30},v=>flyAt(v,3),6],
    ['lab piano g 20 landed',{view:'lab',l_obj:'piano',l_m:400,l_d:2.2,l_cd:1.2,l_air:true,l_g:20},v=>flyAt(v,5),7],
    ['env default',{view:'env'},null,4],
    ['env air off',{view:'env',a_air:false},null,3],
    ['env from 15 m at 5 m/s',{view:'env',a_h:15,a_v0:5},null,4],
    ['env no speed',{view:'env',a_v0:0},null,1],
    ['hodo default',{view:'hodo'},null,4],
    ['hodo air off',{view:'hodo',a_air:false},null,3],
    ['hodo sphere 80',{view:'hodo',a_obj:'sphere',a_th:80,a_v0:18},null,4],
    ['hodo no cliff',{view:'hodo',o_cliff:false},null,4],
    ['hodo vertical',{view:'hodo',a_th:90},null,3],
    ['hodo tank shell',{view:'hodo',a_obj:'tankShell'},null,3],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [nm,over,setup,minFills] of CONFIGS) withState(over,()=>{
    if(setup) setup(over.view);
    for(const [W,H] of SIZES){
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) continue;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      ok(fills.length>=minFills&&texts.length>=1,nm+' '+W+'x'+H+' draws substance ('+fills.length+' fills, floor '+minFills+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>3&&oy>3){ hit='"'+texts[i2].t.slice(0,24)+'" vs "'+texts[j2].t.slice(0,24)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    } });

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
