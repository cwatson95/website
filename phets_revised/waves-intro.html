}

/* ================================================================== *
 *  drawing helpers (y UP in world maps; layouts built bottom-up from *
 *  a measured caption) — from projects/simulations/build_buoy/       *
 *  p4_views.js by name, unchanged (make_helpers.py)                  *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the lattice drawing shared with wave-interference: extracted BY    *
 *  NAME and unchanged from build/wave-interference/p4_views.js —      *
 *  the 49 colour classes and the field (one fill per class, runs      *
 *  merged, pixel-snapped), the positions of PhET's 21 x 21 air        *
 *  parcels, the tape measure and the probes.  make_parts.py; nothing  *
 *  retyped.  Their dependencies (COL, U_FULL, TOOLS, lenU) are        *
 *  defined in p3_state.js, with the same names and meanings.          *
 * ================================================================== */
const NLEV=49, HALF=24;                                  /* 49 colour classes, zero on the middle one */
function levelOf(v){ const t=v/U_FULL; return Math.round(((t<-1?-1:(t>1?1:t))+1)*HALF); }
const LEVEL_CACHE={};
function levelCols(scene,lam){
  const key=scene+'|'+(scene==='light'?fmt(lam,2):'');
  if(LEVEL_CACHE[key]) return LEVEL_CACHE[key];
  const out=[], top=scene==='light'?specCss(lam,1):null;
  for(let q=0;q<NLEV;q++){ const f=q/(NLEV-1);
    out.push(scene==='water'?mix(COL.water0,COL.water1,f):(scene==='sound'?mix('#000000','#f2f2f2',f):mix('#000000',top,f))); }
  return LEVEL_CACHE[key]=out;
}
function drawField(ctx,sq,R){
  const L=R.lat, pad=L.pad, nx=L.nx, u=L.u, vis=L.vis, light=R.scene==='light';
  const lam=waveLen(SCENES[R.scene],R.f), cols=levelCols(R.scene,lam), cs=sq.w/LAT.VIS;
  ctx.fillStyle=light?'#000000':cols[HALF]; ctx.fillRect(sq.x,sq.y,sq.w,sq.h);
  const rects=[]; for(let q=0;q<NLEV;q++) rects.push([]);
  let nCells=0;
  for(let j=0;j<LAT.VIS;j++){
    const row=(pad+j)*nx+pad, y0=Math.round(sq.y+j*cs), y1=Math.round(sq.y+(j+1)*cs);
    let i=0;
    while(i<LAT.VIS){
      const q=(light&&!vis[row+i])?-1:levelOf(u[row+i]);
      let e=i+1;
      while(e<LAT.VIS&&((light&&!vis[row+e])?-1:levelOf(u[row+e]))===q) e++;
      if(q>=0&&(light||q!==HALF)){ rects[q].push(Math.round(sq.x+i*cs),y0,Math.round(sq.x+e*cs),y1); nCells+=e-i; }
      i=e;
    }
  }
  for(let q=0;q<NLEV;q++){ const r=rects[q]; if(!r.length) continue;
    ctx.beginPath(); for(let k=0;k<r.length;k+=4) ctx.rect(r[k],r[k+1],r[k+2]-r[k],r[k+3]-r[k+1]);
    ctx.fillStyle=cols[q]; ctx.fill(); }
  return nCells;
}
function parcelPositions(R){
  const S=SCENES[R.scene], L=R.lat, nx=L.nx, k=TAU/R.Nl, KD=0.3*(LAT.VIS/20)/(k*U_FULL), out=[];
  for(let a=0;a<=20;a++) for(let b=0;b<=20;b++){
    const x=a*S.W/20, y=b*S.W/20, X=cellOfX(R,x), Y=cellOfX(R,y);
    const i=clamp(Math.round(X),1,nx-2), j=clamp(Math.round(Y),1,L.ny-2), q=j*nx+i;
    const gx=(L.u[q+1]-L.u[q-1])/2, gy=(L.u[q+nx]-L.u[q-nx])/2;
    out.push([X+KD*gx,Y+KD*gy]);
  }
  return out;
}
function cellX(sq,R,i){ return sq.x+(i-R.lat.pad+0.5)*sq.w/LAT.VIS; }
function drawTape(ctx,W,H,sq,S,M){
  const a=TOOLS.tape[0], b=TOOLS.tape[1];
  const A=[sq.x+a[0]*sq.w,sq.y+a[1]*sq.h], B=[sq.x+b[0]*sq.w,sq.y+b[1]*sq.h];
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.strokeStyle='#f1e7b0'; ctx.lineWidth=2; ctx.stroke();
  dot(ctx,A[0],A[1],5,COL.live,'#ffffff',1); dot(ctx,B[0],B[1],5,COL.live,'#ffffff',1);
  lab(ctx,W,H,(A[0]+B[0])/2,Math.min(A[1],B[1])-12,lenU(M.tapeLen,S),'#f1e7b0',LAB_FONT,'center');
}
function drawProbes(ctx,sq){
  TOOLS.probes.forEach((p,q)=>{ const x=sq.x+p[0]*sq.w, y=sq.y+p[1]*sq.h, c=q===0?COL.pos:COL.live;
    ctx.beginPath(); ctx.arc(x,y,7,0,TAU); ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke(); dot(ctx,x,y,2,c); });
}

/* ================================================================== *
 *  the views: the wave generator and its button, the tank, the side   *
 *  view, PhET's light screen, the graphs, and the analysis of the     *
 *  three media.  (The field, the parcels, the tape, the probes and    *
 *  the wave meter are in p4_draw.js, extracted from wave-interference *
 *  unchanged.)                                                        *
 * ================================================================== */
const GEN_W=46, GEN_H=30, BTN_R=9;
/* the generator sits outside the tank, on the source's own row; its button is
   below it (PhET's green wave-generator button) */
function genGeo(sq,R){
  const cs=sq.w/LAT.VIS, L=R.lat, y=sq.y+((L.ny-1)/2-L.pad+0.5)*cs, x1=sq.x-10, x0=x1-GEN_W;
  return {x0,x1,y,cs, sx:cellX(sq,R,srcCol(L)), btn:{x:(x0+x1)/2, y:y+GEN_H/2+14, r:BTN_R}};
}
function drawGenerator(ctx,W,H,sq,M){
  const R=M.R, g=genGeo(sq,R), x0=g.x0, x1=g.x1, y=g.y, on=M.active;
  ctx.fillStyle='#161c2c'; ctx.strokeStyle=COL.struct; ctx.lineWidth=1.3;
  const poly=pts=>{ ctx.beginPath(); pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
    ctx.closePath(); ctx.fill(); ctx.stroke(); };
  if(R.scene==='water'){                                   /* a faucet seen from above */
    poly([[x0,y-8],[x1-12,y-8],[x1-12,y-4],[x1,y-4],[x1,y+4],[x1-12,y+4],[x1-12,y+8],[x0,y+8]]);
  } else if(R.scene==='sound'){                            /* a loudspeaker */
    poly([[x0,y-9],[x0+16,y-9],[x0+16,y+9],[x0,y+9]]);
    poly([[x0+16,y-7],[x1,y-13],[x1,y+13],[x0+16,y+7]]);
  } else {                                                 /* a laser */
    poly([[x0,y-9],[x1-13,y-9],[x1-13,y+9],[x0,y+9]]);
    poly([[x1-13,y-3.5],[x1,y-3.5],[x1,y+3.5],[x1-13,y+3.5]]);
  }
  /* the nozzle reaches the source cell, which is five cells inside the tank */
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(g.sx,y);
  ctx.strokeStyle=on?rgba(COL.live,0.75):'#3a4254'; ctx.lineWidth=1.6; ctx.stroke();
  dot(ctx,g.sx,y,4.5,on?COL.live:'#3a4254','#ffffff',1.2);
  /* PhET's button: filled while the source runs, hollow while it waits */
  dot(ctx,g.btn.x,g.btn.y,g.btn.r,on?COL.live:'#141a28',on?'#ffffff':COL.live,1.6);
  lab(ctx,W,H,g.btn.x,g.btn.y+g.btn.r+9,M.mode==='pulse'?'fire':(on?'on':'off'),
      on?COL.live:'#8b93a6',SM_FONT,'center');
}
/* PhET's side view of the water, along the centre row (adapted from
   wave-interference's drawSide: the drop falls only while the source runs) */
function drawSideIntro(ctx,sq,M){
  const R=M.R, L=R.lat, pad=L.pad, nx=L.nx, mid=(L.ny-1)/2, cs=sq.w/LAT.VIS;
  const yb=sq.y+0.52*sq.h, hs=0.16*sq.h/U_FULL;
  ctx.fillStyle='#03060d'; ctx.fillRect(sq.x,sq.y,sq.w,sq.h);
  /* the source cell swings 1.2 x the amplitude, four times past the colour scale: its own
     spike is clipped here rather than drawn through the floor of the view (the caption says so) */
  const pts=[[sq.x,sq.y1]];
  for(let i=0;i<LAT.VIS;i++){ const v=clamp(L.u[mid*nx+pad+i],-1.8*U_FULL,1.8*U_FULL); pts.push([sq.x+(i+0.5)*cs,yb-hs*v]); }
  pts.push([sq.x1,sq.y1]);
  ctx.beginPath(); pts.forEach((p,k)=>{ if(k===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); ctx.closePath();
  ctx.fillStyle=mix(COL.water0,'#1d5f96',0.55); ctx.fill();
  ctx.beginPath();
  for(let k=1;k<pts.length-1;k++){ if(k===1) ctx.moveTo(pts[k][0],pts[k][1]); else ctx.lineTo(pts[k][0],pts[k][1]); }
  ctx.strokeStyle=COL.water1; ctx.lineWidth=1.6; ctx.stroke();
  /* the dripper over the source, and a drop on its way down at each crest */
  const xs=sq.x+(srcCol(L)-pad+0.5)*cs;
  ctx.fillStyle=COL.body; ctx.fillRect(xs-9,sq.y+6,18,14); ctx.fillRect(xs-3,sq.y+20,6,8);
  if(M.active){ const ph=((R.phi/TAU)%1+1)%1, yd=sq.y+32+ph*(yb-sq.y-40);
    dot(ctx,xs,yd,3.2,COL.water1); }
}
/* the air parcels (positions from parcelPositions, extracted from wave-interference): one
   parcel is marked, so that a single one can be watched jiggling in place.  Its colour is CYAN
   here, not wave-interference's magenta: in this sim magenta is the source, its button, the
   tape's ends and the probes, and a fifth magenta dot in the middle of the field would be a
   fifth meaning for one colour (Known-bad: two conventions on one plot is one too many). */
function drawParcelsIntro(ctx,sq,R){
  const P=parcelPositions(R), cs=sq.w/LAT.VIS, pad=R.lat.pad, MARK=220;
  ctx.beginPath();
  for(let q=0;q<P.length;q++){
    if(q===MARK) continue;
    const x=sq.x+(P[q][0]-pad+0.5)*cs, y=sq.y+(P[q][1]-pad+0.5)*cs;
    if(x<sq.x||x>sq.x1||y<sq.y||y>sq.y1) continue;
    ctx.moveTo(x+2.1,y); ctx.arc(x,y,2.1,0,TAU);
  }
  ctx.fillStyle='#d6dae4'; ctx.fill();
  const c=P[MARK];
  dot(ctx,sq.x+(c[0]-pad+0.5)*cs,sq.y+(c[1]-pad+0.5)*cs,3.4,COL.struct,'#ffffff',1);
}
/* PhET's light screen: one fill per brightness class, the base colour being the
   CIE colour of the wavelength scaled by PhET's brightness (PhET scales its own
   sRGB triple the same way) */
function drawScreenStrip(ctx,b,M){
  const B=M.bright, rows=B.length, base=specCss(M.lam,1), cs=b.h/rows, K=24, groups={};
  ctx.fillStyle='#000000'; ctx.fillRect(b.x,b.y,b.w,b.h);
  for(let r=0;r<rows;r++){ const q=Math.round(K*clamp(B[r],0,1)); if(q===0) continue; (groups[q]=groups[q]||[]).push(r); }
  for(const q in groups){
    ctx.beginPath();
    for(const r of groups[q]) ctx.rect(b.x,Math.round(b.y+r*cs),b.w,Math.round(b.y+(r+1)*cs)-Math.round(b.y+r*cs));
    ctx.fillStyle=mix('#000000',base,q/K); ctx.fill();
  }
  frame(ctx,b,'#2a3040');
}
/* the intensity along the screen, against the 1/r a point source would give
   (not in PhET's Waves Intro: its intensity checkbox is switched off) */
function drawIntensity(ctx,W,H,b,M){
  const I=M.I, S=M.S, rows=I.length, mx=M.Imax>0?M.Imax:1, xs=[], ys=[];
  for(let r=0;r<rows;r++){ ys.push((r+0.5)*S.W/rows); xs.push(I[r]/mx); }
  axesR(ctx,b,0,1.05,S.W,0,{xticks:[0,0.5,1],yticks:[],xfmt:t=>fmt(t,1),title:'intensity',xlab:'I / its peak'});
  if(M.th) polyline(ctx,b,Array.from(M.th),ys,0,1.05,S.W,0,COL.ref,1.4);
  polyline(ctx,b,xs,ys,0,1.05,S.W,0,COL.pos,1.8);
}
/* the wave meter's chart (after wave-interference's drawMeter, with one change: the window is
   2.5 periods of the frequency ON SHOW, not 2.5 of the medium's slowest, so the chart is full
   of the wave the tank is making rather than mostly empty) */
function drawMeterIntro(ctx,W,H,b,M){
  const R=M.R, S=M.S, tr=R.trace, win=2.5/R.f, t1=Math.max(R.t,win), t0=t1-win, Y=1.5*U_FULL;
  axesR(ctx,b,t0,t1,-Y,Y,{nx:5,ny:3,xfmt:t=>sigf(t,3),yfmt:t=>fmt(t,1),
    title:titleFor(b,'wave meter: the two probes against time','wave meter'),xlab:'time, '+S.tunit});
  for(let p=0;p<2;p++){
    const xs=[], ys=[];
    for(const s of tr) if(s[0]>=t0&&s.length>p+1){ xs.push(s[0]); ys.push(s[p+1]); }
    polyline(ctx,b,xs,ys,t0,t1,-Y,Y,p===0?COL.pos:COL.live,1.5);
  }
}
/* PhET's "Graph": the centre row, in the scene's own units */
function drawCentre(ctx,W,H,b,M){
  const R=M.R, S=M.S, L=R.lat, mid=(L.ny-1)/2, xs=[], ys=[];
  for(let i=0;i<LAT.VIS;i++){ xs.push(xOfCell(R,L.pad+i)); ys.push(L.u[mid*L.nx+L.pad+i]); }
  const Y=1.5*U_FULL;
  axesR(ctx,b,0,S.W,-Y,Y,{nx:6,ny:3,xfmt:t=>sigf(t,3),yfmt:t=>fmt(t,1),
    title:titleFor(b,GRAPH_TITLE[R.scene]+' — '+S.what+' along the middle row',GRAPH_TITLE[R.scene]),
    xlab:'position, '+S.unit});
  polyline(ctx,b,xs,ys,0,S.W,-Y,Y,COL.pos,1.6);
}

/* ---- the layout of a medium view ---- */
function latGeo(ctx,W,H,M){
  const R=M.L.R, light=(M.view==='light'), narrow=isNarrow(W), top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-RO_W-44)-56));
  const fit=fitCaption(ctx,W,H-HINT_H,latCaption(M,true),latCaption(M,false),capW,top+220);
  const avail=fit.capY-18-top;
  const showScr=light&&ST.screen, showI=light&&ST.inten;
  let gH=ST.graph?Math.max(64,Math.min(130,Math.round(avail*0.2))):0;
  const gGap=44;
  /* what has to fit under the square: the graph and its axis labels, or the
     intensity graph's labels, or the generator's button — measured, never guessed */
  const below=()=>Math.max(gH?gH+gGap+36:0, showI?38:0, GEN_H/2+14+BTN_R+16);
  if(gH&&avail-below()<150) gH=0;
  const rightNeed=(showScr?40:0)+(showI?(narrow?120:190):0);
  const left=GEN_W+20;
  const side=Math.max(100,Math.floor(Math.min(avail-below(), W-left-30-rightNeed, narrow?W:W*0.6)));
  const sq=box(left,top,side,side);
  const G={sq,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,narrow};
  let xr=sq.x1+14;
  if(showScr){ G.scr=box(xr,sq.y,22,sq.h); xr+=34; }
  if(showI){ G.ib=box(xr,sq.y,(narrow?100:160),sq.h); xr=G.ib.x1+16; }
  if(ST.graph&&gH) G.gb=box(sq.x,sq.y1+gGap,sq.w,gH);
  G.graphDropped=ST.graph&&!gH;
  /* the wave meter's chart goes below the floating readout (which reaches ~480 px) */
  if(ST.meter&&!narrow){
    const x0=Math.max(xr+44,sq.x1+60), y0=510, y1=fit.capY-40;
    if(W-24-x0>=150&&y1-y0>=60) G.mb=box(x0,y0,W-24-x0,y1-y0);
  }
  return G;
}
function latCaption(M,full){
  const L=M.L, R=L.R, S=L.S, v=M.view;
  const base=S.name+': '+fmt(S.W,0)+' '+S.unit+' across, 111 lattice cells of '+sigf(L.dx,3)+' '+S.unit
    +'; colour is the '+S.what+' (±2.14 in lattice units is full colour, PhET’s scale).';
  if(!full) return base;
  let s=base+' One hard source five cells in from the left edge, driven at 1.2 × the amplitude; the waves leave through the absorbing edge 20 cells beyond the frame.';
  if(!L.active) s+=(L.mode==='pulse'?' No pulse is running — press the button to fire one.':' The source is off — press its button. The waves already made carry on without it.');
  if(L.R.A===0) s+=' The amplitude is zero: the source is running and moving nothing.';
  if(v==='water'&&ST.look==='side') s+=' Side view along the centre row: the height is the water level in lattice units, exaggerated, not to scale with the tank, and clipped where the source cell itself swings past ±1.8 of the colour scale.';
  if(v==='sound'&&ST.soundView!=='waves') s+=' Air parcels are pushed along ∇p, exaggerated: a wave at full colour moves one 0.3 of the parcel spacing, and beside the source, where the field is stronger than that, about 0.4. They crowd where the pressure is high and never travel with the wave; the cyan one is there to be watched jiggling in place.';
  if(v==='light'&&ST.screen) s+=' The screen at the right edge is PhET’s: the mean square of the last column, smoothed over three rows, averaged over ±39 rows, then PhET’s brightness table.';
  if(v==='light'&&ST.inten) s+=' The intensity graph (green) is not in PhET’s Waves Intro; orange is the 1/r a point source would give, and the ripple on it is the tank’s own edges.';
  return s;
}
function drawMediumView(ctx,W,H,M){
  const G=latGeo(ctx,W,H,M), sq=G.sq, L=M.L, R=L.R, S=L.S, v=M.view;
  if(v==='water'&&ST.look==='side') drawSideIntro(ctx,sq,L);
  else {
    if(!(v==='sound'&&ST.soundView==='particles')) drawField(ctx,sq,R);
    else { ctx.fillStyle='#05070c'; ctx.fillRect(sq.x,sq.y,sq.w,sq.h); }
    if(v==='sound'&&ST.soundView!=='waves') drawParcelsIntro(ctx,sq,R);
  }
  frame(ctx,sq,'#2a3040');
  drawGenerator(ctx,W,H,sq,L);
  /* PhET's scale bar and its clock */
  const sb=S.scaleLen/S.W*sq.w, yb=sq.y-10;
  ctx.fillStyle='#cfd4de'; ctx.fillRect(sq.x,yb-2,sb,3);
  lab(ctx,W,H,sq.x+sb+6,yb,S.scaleLen+' '+S.unit,'#cfd4de',SM_FONT,'left');
  const conv=sq.w<380?'':(S.tunit==='ms'?'  (1 ms = 10⁻³ s)':S.tunit==='fs'?'  (1 fs = 10⁻¹⁵ s)':'');
  lab(ctx,W,H,sq.x1,yb,(ST.running?'':'paused · ')+'t = '+sigf(R.t,3)+' '+S.tunit+conv,'#8b93a6',SM_FONT,'right');
  if(ST.tape) drawTape(ctx,W,H,sq,S,L);
  if(ST.meter) drawProbes(ctx,sq);
  if(ST.watch){
    const t='stopwatch '+sigf(R.watch.t,4)+' '+S.tunit, tw=t.length*11*0.52+14;
    ctx.fillStyle='rgba(10,12,18,.8)'; ctx.fillRect(sq.x1-tw-6,sq.y+6,tw,20);
    lab(ctx,W,H,sq.x1-tw+1,sq.y+16,t,R.watch.on?COL.pos:'#cfd4de',LAB_FONT,'left');
  }
  if(G.scr) drawScreenStrip(ctx,G.scr,L);
  if(G.ib) drawIntensity(ctx,W,H,G.ib,L);
  if(G.gb) drawCentre(ctx,W,H,G.gb,L);
  if(G.mb) drawMeterIntro(ctx,W,H,G.mb,L);
  const note=(y,t)=>{ ctx.fillStyle='rgba(7,11,24,.78)'; ctx.fillRect(sq.x+4,y-8,t.length*10.5*0.52+10,16);
    lab(ctx,W,H,sq.x+8,y,t,'#aeb6c6',SM_FONT,'left'); };
  if(!G.mb&&ST.meter) note(sq.y1-12,'wave meter: widen the window to see its chart');
  if(G.graphDropped) note(sq.y1-(ST.meter&&!G.mb?30:12),'graph: needs a taller window');
  drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW});
  return G;
}

/* ================================================================== *
 *  the three media: v = f lambda, and the wavelength measured on the  *
 *  lattice                                                            *
 * ================================================================== */
function pow10(e){ return '10'+supTxt(Math.round(e)); }
const PLANE={x0:-1, x1:16, y0:-7, y1:1};
const STRIP_MIN=76;
function mediaGeo(ctx,W,H,M){
  const narrow=isNarrow(W), top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-RO_W-44)-56));
  const full=mediaCaption(M,true), short=mediaCaption(M,false);
  const right=narrow?W-26:W-RO_W-44;
  const strips=(capY)=>{
    /* the strips sit below the floating readout; how much is left after the caption? */
    const planeH=Math.max(120,Math.min(Math.round(0.42*(capY-top)),486-44-top));
    const y2=Math.max(top+10+planeH+66,510);
    return {planeH,y2,h2:capY-46-y2};
  };
  let fit=fitCaption(ctx,W,H-HINT_H,full,short,capW,top+200), s=strips(fit.capY);
  /* a caption long enough to squeeze the strips out takes the short form instead — the
     strips are the measurement, and the caption's job is to explain them */
  if(!narrow&&s.h2<STRIP_MIN&&full!==short){
    const f2=fitCaption(ctx,W,H-HINT_H,short,short,capW,top+200), s2=strips(f2.capY);
    if(s2.h2>=STRIP_MIN){ fit=f2; s=s2; }
  }
  const G={capY:fit.capY,capTxt:fit.txt,capW:fit.capW,narrow,strips:[]};
  if(narrow){
    G.plane=box(64,top+10,Math.max(140,right-80),Math.max(90,fit.capY-62-top));
    return G;
  }
  G.plane=box(64,top+10,Math.max(160,right-74),s.planeH);
  if(s.h2>=STRIP_MIN){
    const gut=56, span=(W-24)-64, w=(span-2*gut)/3;
    for(let i=0;i<3;i++) G.strips.push(box(64+i*(w+gut),s.y2,w,s.h2));
  }
  return G;
}
function mediaCaption(M,full){
  /* the speeds are read off the model, never typed twice */
  const base='v = fλ for the three media, on log scales: a fixed speed is a straight line of slope −1, and the three media are three parallel lines ('
    +M.X.rows.map(q=>q.S.name+' '+sciTxt(q.vSI,3)+' m/s').join(', ')+').';
  if(!full) return base;
  return base+' The thick cyan stretch of each line is the range PhET’s slider covers, the magenta ring is where it is set now, and the green dot is the wavelength MEASURED on the lattice at that setting.'
    +' Below, for each medium, the tank at steady state along the axis, from 5 cells out: green is the lattice, orange the 1/√r a spreading 2-D wave must follow, the cyan band the cells the fit uses, and the magenta arrow the wavelength it returns.';
}
function drawMedia(ctx,W,H,M){
  const G=mediaGeo(ctx,W,H,M), b=G.plane, rows=M.X.rows;
  const xt=[], yt=[];
  for(let e=0;e<=16;e+=2) xt.push(e);
  for(let e=PLANE.y0;e<=PLANE.y1;e++) yt.push(e);
  axesR(ctx,b,PLANE.x0,PLANE.x1,PLANE.y0,PLANE.y1,{xticks:xt,yticks:yt,xfmt:pow10,yfmt:pow10,
    title:titleFor(b,'wavelength against frequency: λ = v/f, one line per medium','λ = v/f'),
    xlab:'frequency f, Hz',ylab:'wavelength λ, m'});
  for(const q of rows){
    const lv=Math.log10(q.vSI);
    /* the law, drawn right across the plane: log lambda = log v - log f */
    polyline(ctx,b,[PLANE.x0,PLANE.x1],[lv-PLANE.x0,lv-PLANE.x1],PLANE.x0,PLANE.x1,PLANE.y0,PLANE.y1,COL.ref,1.3,[5,4]);
    /* the stretch PhET's own slider covers */
    const fa=Math.log10(q.S.fmin/SI_TIME[q.id]), fb=Math.log10(q.S.fmax/SI_TIME[q.id]);
    polyline(ctx,b,[fa,fb],[lv-fa,lv-fb],PLANE.x0,PLANE.x1,PLANE.y0,PLANE.y1,COL.struct,4);
    marker(ctx,b,PLANE.x0,PLANE.x1,PLANE.y0,PLANE.y1,Math.log10(q.fSI),Math.log10(q.lamSI),COL.live);
    const mx=Math.log10(q.fSI), my=Math.log10(q.m.lam*SI_LEN[q.id]);
    dot(ctx,b.x+b.w*(mx-PLANE.x0)/(PLANE.x1-PLANE.x0),b.y1-b.h*(my-PLANE.y0)/(PLANE.y1-PLANE.y0),3.4,COL.pos);
  }
  /* the legend goes in the clear band between the plane and the strips: every corner of the
     plane itself is crossed by one of the three lines, so legendAuto would rightly refuse */
  if(b.w>=320&&G.strips.length){
    const lb=legendBox(ctx,b.x,b.y1+46,[[COL.ref,'λ = v/f'],[COL.struct,'PhET’s slider range'],
                                        [COL.live,'set now'],[COL.pos,'measured on the lattice']]);
    if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]);
  }
  /* the labels last, so they dodge each other rather than the curves; a label that would run
     off the panel's right edge (and so under the floating readout) is hung to the left instead */
  ctx.font=LAB_FONT;
  /* the lines fall one decade of lambda per decade of f, so a label set above-RIGHT of a marker
     is clear of its own line; light's marker sits near the right-hand edge and near the floor,
     where the label has to hang to the LEFT — and there it must also clear the rise of the line
     it is naming (slope px/px below), or it lies along it.  Where even the medium's name will
     not fit, no label is drawn: the caption and the readout still name all three speeds. */
  const slope=(b.h/(PLANE.y1-PLANE.y0))/(b.w/(PLANE.x1-PLANE.x0));
  for(const q of rows){
    const lv=Math.log10(q.vSI), fm=0.5*(Math.log10(q.S.fmin/SI_TIME[q.id])+Math.log10(q.S.fmax/SI_TIME[q.id]));
    const X=b.x+b.w*(fm-PLANE.x0)/(PLANE.x1-PLANE.x0), Y=b.y1-b.h*((lv-fm)-PLANE.y0)/(PLANE.y1-PLANE.y0);
    for(const txt of [q.S.name+' · '+sciTxt(q.vSI,3)+' m/s',q.S.name]){
      const w=ctx.measureText(plain(txt)).width;
      if(X+10+w<=b.x1-2){ lab(ctx,W,H,X+10,Y-12,txt,COL.struct,LAB_FONT,'left'); break; }
      const up=(10+w)*slope+12;
      if(X-10-w>=b.x+2&&Y-up>=b.y+8){ lab(ctx,W,H,X-10,Y-up,txt,COL.struct,LAB_FONT,'right'); break; }
    }
  }
  /* the strips: the tank at steady state along its axis */
  G.strips.forEach((sb,i)=>{
    const q=rows[i], m=q.m, R0=MEAS.R0, R1=MEAS.R1, dx=q.dx;
    const x0=5*dx, x1=(m.nc-1)*dx, Y=1.15*m.amp[5];
    axesR(ctx,sb,x0,x1,-Y,Y,{nx:4,ny:3,xfmt:t=>sigf(t,3),yfmt:t=>fmt(t,1),
      title:titleFor(sb,q.S.name+' at '+freqStr(q.S,q.f)+', along the axis',q.S.name),
      xlab:'distance from the source, '+q.S.unit});
    /* the cells the fit uses */
    const px=x=>sb.x+sb.w*(x-x0)/(x1-x0);
    ctx.fillStyle=rgba(COL.struct,0.1); ctx.fillRect(px(R0*dx),sb.y,px(R1*dx)-px(R0*dx),sb.h);
    const xs=[], us=[], ep=[], em=[];
    for(let c=5;c<m.nc;c++){ const x=c*dx; xs.push(x); us.push(m.snap[c]); ep.push(m.afit/Math.sqrt(c)); em.push(-m.afit/Math.sqrt(c)); }
    polyline(ctx,sb,xs,ep,x0,x1,-Y,Y,COL.ref,1.2,[4,3]);
    polyline(ctx,sb,xs,em,x0,x1,-Y,Y,COL.ref,1.2,[4,3]);
    polyline(ctx,sb,xs,us,x0,x1,-Y,Y,COL.pos,1.5);
    /* the measured wavelength, drawn from the crest nearest the middle of the fit; at the long
       end of water the tank does not hold a whole wavelength past that crest, and then the
       figure is given without the arrow rather than drawn off the end of the strip */
    let cr=-1;
    for(let c=Math.round((R0+R1)/2);c<R1-2;c++) if(m.snap[c]>m.snap[c-1]&&m.snap[c]>=m.snap[c+1]){ cr=c; break; }
    const ya=sb.y+sb.h*0.16;
    if(cr>0&&cr+m.lamCells<=m.nc-1){
      const xA=px(cr*dx), xB=px((cr+m.lamCells)*dx);
      ctx.beginPath(); ctx.moveTo(xA,ya); ctx.lineTo(xB,ya);
      ctx.moveTo(xA,ya); ctx.lineTo(xA+6,ya-4); ctx.moveTo(xA,ya); ctx.lineTo(xA+6,ya+4);
      ctx.moveTo(xB,ya); ctx.lineTo(xB-6,ya-4); ctx.moveTo(xB,ya); ctx.lineTo(xB-6,ya+4);
      ctx.strokeStyle=COL.live; ctx.lineWidth=1.6; ctx.stroke();
      lab(ctx,W,H,(xA+xB)/2,ya-11,'λ = '+lenU(m.lam,q.S),COL.live,SM_FONT,'center');
    } else {
      lab(ctx,W,H,sb.x+sb.w*0.55,ya,'λ = '+lenU(m.lam,q.S)+' — longer than the tank',COL.live,SM_FONT,'center');
    }
    /* the footer, in the longest form the strip can hold */
    ctx.font=SM_FONT;
    const pw=fmt(m.pexp,2).replace('-','−');          /* one minus sign in a line of prose */
    const long='v/f = '+lenU(m.lam0,q.S)+' · measured '+pct(m.err)+' · power '+pw+' (1/√r: −0.50)';
    const shortF='measured '+pct(m.err)+' · power '+pw;
    lab(ctx,W,H,sb.x+4,sb.y1-9,ctx.measureText(plain(long)).width<=sb.w-10?long:shortF,'#8b93a6',SM_FONT,'left');
  });
  if(!G.strips.length&&!G.narrow) lab(ctx,W,H,G.plane.x,G.plane.y1+30,'the three tanks: a taller window shows them','#8b93a6',SM_FONT,'left');
  drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW});
  return G;
}

/* ================================================================== *
 *  dispatch and the scene object                                      *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.L) return drawMediumView(ctx,W,H,M);
  return drawMedia(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* only a medium view has a clock; the three media are a still picture */
  S.step=function(){ return MEDIA[ST.view]?clockFrame()>0:false; };
  /* the pointer: PhET's generator button, the tape's ends and the probes */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    if(!MEDIA[ST.view]) return false;
    const ctx=canvas.getContext('2d'), M=buildModel(), G=latGeo(ctx,S.W,S.H,M), sq=G.sq, R=M.L.R;
    if(type==='down'){
      const g=genGeo(sq,R);
      if(Math.hypot(x-g.btn.x,y-g.btn.y)<g.btn.r+3){ DRAG.what='button'; return pressSource(R); }
      const hits=[];
      if(ST.tape) TOOLS.tape.forEach((p,q)=>hits.push(['tape'+q,sq.x+p[0]*sq.w,sq.y+p[1]*sq.h]));
      if(ST.meter) TOOLS.probes.forEach((p,q)=>hits.push(['probe'+q,sq.x+p[0]*sq.w,sq.y+p[1]*sq.h]));
      for(const h2 of hits) if(Math.hypot(x-h2[1],y-h2[2])<10){ DRAG.what=h2[0]; return true; }
      return false;
    }
    if(type==='move'){
      if(!DRAG.what||DRAG.what==='button') return false;
      const q=+DRAG.what.slice(-1), arr=DRAG.what.indexOf('tape')===0?TOOLS.tape:TOOLS.probes;
      arr[q]=[clamp((x-sq.x)/sq.w,0,1),clamp((y-sq.y)/sq.h,0,1)];
      return true;
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — the control panel, the tabs, the keys, the frame loop and   *
 *  the tone's audio layer                                             *
 * ================================================================== */
const CREDIT='Remake of PhET Interactive Simulations&rsquo; Waves Intro (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.';
/* the tone: the samples are computed in toneBuffer and played from a looped
   buffer, so what is heard is what the suite checks.  Everything here is
   guarded: there is no AudioContext under the headless harnesses. */
const AUDIO={ctx:null, src:null, gain:null, key:'', state:'off', buf:null};
function audioCtor(){
  if(typeof AudioContext!=='undefined') return AudioContext;
  if(typeof webkitAudioContext!=='undefined') return webkitAudioContext;
  return null;
}
function toneSync(){
  const want=toneOn();
  if(!want){
    if(AUDIO.src){ try{ AUDIO.src.stop(); }catch(e){} AUDIO.src=null; }
    AUDIO.key=''; AUDIO.state='off';
    return AUDIO.state;
  }
  const AC=audioCtor();
  if(!AC){ AUDIO.state='unavailable'; return AUDIO.state; }
  const p=toneParams(RUNS.sound), key=p.hz.toFixed(4)+'|'+p.level.toFixed(4);
  if(key===AUDIO.key&&AUDIO.src) return AUDIO.state;
  try{
    if(!AUDIO.ctx){ AUDIO.ctx=new AC(); AUDIO.gain=AUDIO.ctx.createGain(); AUDIO.gain.connect(AUDIO.ctx.destination); }
    const c=AUDIO.ctx;
    if(c.state==='suspended'&&c.resume) c.resume();
    const tb=toneBuffer(p.hz,1,c.sampleRate||TONE_SR);       /* the level rides on the gain, as PhET's does */
    const buf=c.createBuffer(1,tb.L,c.sampleRate||TONE_SR);
    buf.getChannelData(0).set(tb.data);
    if(AUDIO.src){ try{ AUDIO.src.stop(); }catch(e){} }
    const s=c.createBufferSource();
    s.buffer=buf; s.loop=true; s.connect(AUDIO.gain); s.start();
    AUDIO.src=s; AUDIO.buf=tb; AUDIO.gain.gain.value=p.level; AUDIO.key=key; AUDIO.state='playing';
  }catch(e){ AUDIO.state='unavailable'; }
  return AUDIO.state;
}

  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas);
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    ST.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===ST.view?'active':'');

  }

  const rows={};

      val.textContent=plain(fmtf(ST[key])); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });

  }
  function checkbox(key,lab2,onchg){

    inp.addEventListener('change',()=>{ ST[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });

  for(const id of SCENE_IDS) gSrc.appendChild(slider('amp_'+id,'amplitude',0,10,0.1,v=>fmt(v,1)));

    button('start / stop the stopwatch',()=>{ const R=cur(); if(R) R.watch.on=!R.watch.on; }),
    button('zero the stopwatch',()=>{ const R=cur(); if(R) R.watch.t=0; })));

      resetRuns(); toneSync(); syncChips(); })));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:CREDIT+' Measured: nothing by hand — every number is PhET&rsquo;s (read from the minified original and cited as PhET&rsquo;s values in the header) or computed and pinned to build/waves-intro/derive.py, whose twin reproduces the wave-interference engine&rsquo;s own pins. Colour: the CIE 1931 table.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gSrc,gShow,gTools,gTime,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [w,list,key] of CHIPROWS) [].forEach.call(w.children,(b,i)=>b.className='chip'+(list[i].id===ST[key]?' on':''));
  }
  function syncPanel(){
    const v=ST.view, med=!!MEDIA[v];
    for(const id of SCENE_IDS){
      rows['f_'+id].row.hidden=med&&(id!==v);
      rows['amp_'+id].row.hidden=(id!==v);
    }
    waveChips.hidden=!med; srcBtn.hidden=!med;
    gShow.hidden=!med; gTools.hidden=!med; gTime.hidden=!med;
    lookChips.hidden=(v!=='water'); soundChips.hidden=(v!=='sound');
    soundChecks.hidden=(v!=='sound'); lightChecks.hidden=(v!=='light');
    for(const k in rows) rows[k].sync();
    const R=cur();
    srcTag.innerHTML=med
      ? (ST.wave==='pulse'
          ? 'in pulse mode the button fires one period and pops back up' + (R&&R.pulse.on?' &mdash; <b>firing</b>':'')
          : 'the button switches the source on and off, and starts it from zero; the source cell is driven at 1.2 &times; the amplitude (PhET&rsquo;s value)')
      : 'each slider moves its own medium&rsquo;s marker on the plane below, and the lattice is measured again at that frequency';
    showTag.innerHTML=v==='light'
      ? 'PhET&rsquo;s Waves Intro shows the screen but never the intensity graph: it builds the panel with showIntensityCheckbox false'
      : (v==='sound' ? 'the tone is PhET&rsquo;s: 1000 f Hz at output level 0.3 A/10, playing only while the source runs'
                     : 'the graph is PhET&rsquo;s "Graph": the '+(SCENES[v]||SCENES.water).what+' along the middle row');
    toolTag.innerHTML='drag the tape&rsquo;s ends and the probes on the picture'+(R&&ST.watch?(R.watch.on?' &middot; the stopwatch is running':' &middot; the stopwatch is stopped'):'');
    timeTag.innerHTML='space runs/pauses &nbsp; <b>p</b> presses the source button &nbsp; <b>r</b> clears the waves &nbsp; 1&ndash;4 switch views';
  }
  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=MEDIA[ST.view]?'press the source button · drag the tools · space pauses · 1–4 switch views'
                                       :'1–4 switch views';
      infoEl.innerHTML=INFO[ST.view]||''; physEl.innerHTML=DERIV[ST.view]||'';
      toneSync();
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; syncPanel(); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); ST.running=!ST.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ const R=syncRun(ST.view); if(R){ runClear(R); dirty=true; refresh(); } }
    else if(e.key==='p'){ const R=syncRun(ST.view); if(R&&pressSource(R)){ dirty=true; refresh(); } }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    let advanced=false;
    try{ advanced=S.step(); }catch(e){ fail(e); }
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%10===0){ const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); toneSync(); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  water:'A ripple tank seen from above. One cell of a 151 × 151 lattice is driven up and down, and every other cell obeys the wave equation in its simplest discrete form: each step it accelerates toward the average of its four neighbours. That one rule makes circular ripples that spread at a fixed speed and fade as 1/√r, because the energy that left the source is spread round a growing circle. Press the green button to start the dripper and press it again to stop it: the ripples already made carry on without it, which is what it means for a wave to leave its source. Raise the drip rate and the crests crowd together — the speed belongs to the water, so a faster drip can only mean a shorter wavelength, λ = v/f. The tape measure, the stopwatch and the wave meter are there for you to check exactly that: measure a crest-to-crest distance, time one bob of a probe, multiply. The side view shows the same wave as the height of the water along the middle row.',
  sound:'The same lattice, the same rule, a different ruler and clock: five metres across and milliseconds instead of ten centimetres and seconds. What the colour shows now is pressure — where the air is squeezed and where it is rarefied — and the wave runs at 343 m/s, twenty thousand times faster than the ripples on water. Switch to particles and the air itself appears: each parcel is pushed along the pressure gradient and crowds where the pressure is high, then returns. Nothing travels from the speaker to you except the squeeze; the parcels only jiggle, by less than a third of their spacing even here, where the displacement is drawn exaggerated. Turn on the tone and you hear the frequency you are watching, 220 to 440 Hz — an octave, and one whole octave of wavelength with it.',
  light:'The same lattice again, now five micrometres across and ticking in femtoseconds. The colour of the picture is the colour of the light, because for light the frequency IS the colour: 384 THz at the red end of the slider, 789 THz at the violet end, and the wavelength that goes with them, 780 nm down to 380 nm. The field itself oscillates far too fast for any detector to follow, so what a screen records is its mean square, averaged over many periods — that is the strip at the right-hand edge, drawn through PhET’s own brightness table. A single source spreads its light evenly in every direction, so the screen should simply fade from the middle outwards as 1/r; it nearly does, and where it ripples, the ripple is the light the tank’s own edges send back.',
  media:'Three screens of PhET’s Waves Intro, three media, and one equation: v = fλ. Plot wavelength against frequency on log scales and a fixed speed becomes a straight line of slope −1, so the three media are three parallel lines, separated by the ten orders of magnitude between a ripple and a light wave. The cyan stretch on each line is the range PhET’s own slider covers; the magenta ring is where you have set it. The green dot is not the formula at all — it is the wavelength measured on the running lattice, by fitting the drive’s own sine to every cell along the axis of the tank and taking the slope of the phase, exactly as the tape measure would. The strips below show those fits: the wave at steady state, the 1/√r envelope it must follow in two dimensions, and the wavelength the fit returns. It lands within about a tenth of a per cent of v/f — except at the very lowest drip rate, where the tank is barely a wavelength and a half long and the near field and the edges of the tank have their say.'
};

function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }

/* ================================================================== *
 *  makeShot — the selfTest recording context (text boxes through     *
 *  the transform, fill counts), from build_buoy/p7_test.js by name,  *
 *  unchanged (make_helpers.py)                                       *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

  /* ---------- F. the measurement of lambda on the lattice ---------- */

    eq(zc.length,ref(k,0),'the buffer holds one upward crossing per cycle (python)');
    rel(TONE_SR*(zc.length-1)/(zc[zc.length-1]-zc[0]),ref(k,1),1e-6,'and its measured frequency (python)');
    close(tb.data[0],0,1e-8,'the buffer starts at zero'); close(tb.data[tb.L-1]+tb.data[1],0,1e-6,'and joins its own start smoothly, so the loop has no click');
    let mx=0; for(let i=0;i<tb.L;i++) mx=Math.max(mx,Math.abs(tb.data[i]));
    close(mx,p.level,1e-3,'its amplitude is PhET’s output level 0.3 A/10');
    rel(toneParams({f:0.44,A:10}).level,0.3,1e-15,'which is 0.3 at the top of PhET’s amplitude range');
    rel(toneParams({f:0.22,A:0}).level,0,1e-15,'and zero at the bottom');
    rel(toneParams({f:0.31,A:8}).hz,310,1e-13,'the pitch is 1000 x the scene’s frequency'); }
  { Object.assign(ST,DEFAULTS); resetRuns();
    ok(!toneOn(),'the tone is off by default'); ST.tone=true;
    ok(!toneOn(),'and stays off on the water view'); ST.view='sound'; ok(toneOn(),'it plays on the sound view');
    ST.running=false; ok(!toneOn(),'not while the clock is paused'); ST.running=true;
    pressSource(syncRun('sound')); ok(!toneOn(),'not while the source is off (PhET’s button1Pressed)');
    pressSource(syncRun('sound')); ok(toneOn(),'on again with the source');
    Object.assign(ST,stSave); resetRuns(); }

  /* ---------- H. the runs, the clock and the controls ---------- */
  { Object.assign(ST,DEFAULTS); resetRuns(); ST.view='water'; runFor('water',100);
    const R=RUNS.water, e1=R.lat.u.reduce((a,v)=>a+v*v,0); ok(e1>1,'the tank has waves after 100 steps');
    ST.f_water=0.8; syncRun('water');
    ok(R.lat.u.reduce((a,v)=>a+v*v,0)===e1,'a new water frequency keeps the waves (PhET)'); close(R.f,0.8,0,'and takes the frequency');
    ST.view='light'; runFor('light',60); const RL=RUNS.light; ok(RL.lat.u.some(v=>v!==0),'the light tank has waves');
    ST.f_light=0.5; syncRun('light'); ok(RL.lat.u.every(v=>v===0),'a new light frequency clears it (PhET’s LightScene.handlePhaseChanged)');
    /* each medium keeps its own lattice, as each PhET screen keeps its own model */
    ok(RUNS.water!==RUNS.sound&&RUNS.water.scene==='water'&&RUNS.sound.scene==='sound'&&RUNS.light.scene==='light',
       'the three media have three lattices of their own');
    Object.assign(ST,DEFAULTS); resetRuns(); ST.view='water'; CLOCK.acc=0;
    let n1=0; for(let f=0;f<600;f++) n1+=clockFrame();
    ok(Math.abs(n1-600*FRAME_DT*LAT.EVENT_RATE)<1,'ten seconds of frames advance the tank 364 steps, PhET’s 20x111/61 per second ('+n1+')');
    ST.speed='slow'; CLOCK.acc=0; let n2=0; for(let f=0;f<600;f++) n2+=clockFrame();
    ok(Math.abs(n2-300*FRAME_DT*LAT.EVENT_RATE)<1,'slow runs at half that ('+n2+')');
    ST.speed='normal'; ST.running=false; eq(clockFrame(),0,'paused: no steps');
    ST.running=true; ST.view='media'; eq(clockFrame(),0,'the three media are a still picture');
    ST.view='sound'; const ns=RUNS.sound.n; clockFrame(); ok(RUNS.sound.n>ns,'and the sound view runs its own lattice');
    ok(RUNS.water.n>0&&RUNS.light.n>=0,'while the others hold where they were');
    /* reset gives every run its clock back, not just its lattice */
    /* the clock tests above have already stepped these runs, so count the increments, not the
       totals (the same trap as any test that inherits the state its predecessor left) */
    ST.view='water'; const nw0=RUNS.water.n; runFor('water',40);
    ST.view='light'; const nl0=RUNS.light.n; runFor('light',25);
    ok(RUNS.water.t>0&&RUNS.water.n===nw0+40&&RUNS.light.n===nl0+25,'two of the three runs have been stepped');
    resetRuns();
    ok(RUNS.water.t===0&&RUNS.water.n===0&&RUNS.light.t===0&&RUNS.light.n===0&&RUNS.sound.t===0,
       'resetRuns puts every run back to t = 0 and step 0');
    ok(RUNS.water.lat.u.every(v=>v===0)&&RUNS.light.lat.u.every(v=>v===0),'with an empty lattice');
    ok(RUNS.water.A===8&&RUNS.water.cont&&RUNS.water.src[0]&&!RUNS.water.watch.on,
       'and the source back at amplitude 8, continuous and running');
    Object.assign(ST,stSave); resetRuns(); }
  { /* the stopwatch and the probes ride the run */
    Object.assign(ST,DEFAULTS); resetRuns(); ST.view='water'; ST.meter=true;
    const R=syncRun('water'); R.watch.on=true; runFor('water',50);
    rel(R.watch.t,50*R.dt,1e-12,'the stopwatch counts physical time: 50 steps x dt');
    eq(R.trace.length,50,'the wave meter recorded both probes at every step');
    const p=TOOLS.probes[0], S=SCENES.water;
    close(R.trace[49][1],probeValue(R,p[0]*S.W,p[1]*S.W),1e-15,'its last sample is the probe’s current value');
    { const R2=makeRun('water','point',1), L=R2.lat;
      for(let j=0;j<L.ny;j++) for(let i=0;i<L.nx;i++) L.u[j*L.nx+i]=0.3*i-0.7*j+2;
      const X=48.37, Y=91.81;
      close(probeValue(R2,xOfCell(R2,X),xOfCell(R2,Y)),0.3*X-0.7*Y+2,1e-10,'a probe between cells reads a linear field exactly (bilinear)'); }
    Object.assign(ST,stSave); resetRuns(); }
  { /* the air parcels, on the twin's own sound run (Tb: 0.2937 per ms, amplitude 6.5, 300 steps) */
    const P=parcelPositions(Tb);
    eq(P.length,441,'PhET’s 21 x 21 grid of parcels');
    for(const k of refs('TWIN sound parcel[')){ const q=num(k,/\[(\d+)\]/)[0];
      rel(P[q][0],ref(k,0),1e-11,k+' across (twin)'); rel(P[q][1],ref(k,1),1e-11,k+' up (twin)'); }
    const kk='TWIN sound parcels: largest push across, up, and as a fraction of the spacing';
    let mx=0, my=0;
    for(let q=0;q<P.length;q++){ const a=Math.floor(q/21), b=q%21;
      mx=Math.max(mx,Math.abs(P[q][0]-cellOfX(Tb,a*SCENES.sound.W/20)));
      my=Math.max(my,Math.abs(P[q][1]-cellOfX(Tb,b*SCENES.sound.W/20))); }
    rel(mx,ref(kk,0),1e-11,'the largest push across the wave (twin)');
    rel(my,ref(kk,1),1e-11,'and along it (twin)');
    /* the scaling is set so that a wave at PhET's full colour moves a parcel 0.3 of the
       spacing; beside the source the field is stronger than that, so the push is larger —
       but never near the spacing itself, which would make the rows cross (Known-bad) */
    close(mx/(LAT.VIS/20),ref(kk,2),1e-11,'as a fraction of the parcel spacing (twin)');
    ok(ref(kk,2)>0.3&&ref(kk,2)<0.5,'the largest push is 0.39 of the spacing: above the 0.3 the scaling sets for a full-colour wave, and well short of a crossing');
    { const R2=makeRun('sound','point',1); R2.A=6.5; runSetFrequency(R2,0.2937,true);
      for(let s=0;s<300;s++) runStep(R2);
      const L=R2.lat, k2=TAU/R2.Nl, KD=0.3*(LAT.VIS/20)/(k2*U_FULL);
      const q=10*21+10, X0=cellOfX(R2,10*SCENES.sound.W/20), i0=Math.round(X0), j0=Math.round(cellOfX(R2,10*SCENES.sound.W/20));
      const g=(L.u[j0*L.nx+i0+1]-L.u[j0*L.nx+i0-1])/2;
      close(parcelPositions(R2)[q][0]-X0,KD*g,1e-12,'a parcel’s displacement is exactly grad p times the scale factor');
      ok((parcelPositions(R2)[q][0]-X0)*g>0,'so it moves UP the pressure gradient, crowding where p is high'); } }

  /* ---------- I. the readouts ---------- */
  const panelCases=[];
  for(const v of SCENE_IDS) panelCases.push({view:v},{view:v,tape:true,watch:true,meter:true,graph:true},{view:v,wave:'pulse'});
  panelCases.push({view:'water',look:'side'},{view:'sound',soundView:'both',tone:true},{view:'light',inten:true},
                  {view:'light',screen:false},{view:'media'},{view:'media',f_water:SCENES.water.fmin,f_light:SCENES.light.fmax});
  for(const c of panelCases){ Object.assign(ST,DEFAULTS,c); resetRuns(); if(MEDIA[c.view]) runFor(c.view,40);
    const M=buildModel(), html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
    ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0&&html.indexOf('Infinity')<0,'panels clean for '+JSON.stringify(c)); }
  { Object.assign(ST,DEFAULTS); resetRuns(); const M=buildModel(), h2=readoutHTML(M);
    ok(h2.indexOf('2.64 cm')>=0,'the water readout prints the wavelength 2.64 cm off the model');
    ok(h2.indexOf('&minus;0.79 %')>=0,'and PhET’s −0.79 % wavelength error there (WI)');
    ok(h2.indexOf('29.30')>=0,'and 29.30 cells per wavelength'); }
  { Object.assign(ST,DEFAULTS,{view:'media'}); resetRuns(); const h2=readoutHTML(buildModel());
    ok(h2.indexOf('343.0 m/s')>=0,'the three-media readout prints sound’s 343.0 m/s');
    ok(h2.indexOf('103.9 cm')>=0&&h2.indexOf('103.8 cm')>=0,
       'and both wavelengths at four figures — v/f = 103.9 cm against the 103.8 cm measured, which three figures would have rounded together');
    ok(h2.indexOf('2.998&times;10<sup>8</sup> m/s')>=0,'and light’s speed as 2.998×10⁸ m/s, not as sigf’s "×10^+8"'); }
  { Object.assign(ST,DEFAULTS,{view:'light'}); resetRuns(); runFor('light',400); const h2=readoutHTML(buildModel());
    ok(h2.indexOf('0.753')>=0,'the light readout prints the screen’s brightness, 0.753 (twin)'); }
  /* every slider end, in every medium: finite and clean */
  { let nBad=0, nCase=0;
    for(const id of SCENE_IDS){ const S=SCENES[id];
      for(const f of [S.fmin,S.fmax]) for(const A of [0,10]) for(const w of ['cont','pulse']){
        const over={view:id,tape:true,watch:true,meter:true,graph:true,inten:true,tone:true,wave:w};
        over['f_'+id]=f; over['amp_'+id]=A;
        Object.assign(ST,DEFAULTS,over); resetRuns(); if(w==='pulse') firePulse(syncRun(id)); runFor(id,25);
        const M=buildModel(), h2=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
        nCase++;
        if(!(h2.indexOf('NaN')<0&&h2.indexOf('undefined')<0&&h2.indexOf('Infinity')<0&&RUNS[id].lat.u.every(isFinite)&&isFinite(M.L.dt))){
          nBad++; console.log('  unclean: '+id+' f='+f+' A='+A+' '+w); } } }
    Object.assign(ST,DEFAULTS,{view:'media'});
    for(const id of SCENE_IDS){ ST['f_'+id]=SCENES[id].fmin; }
    let M=buildModel(); nCase++;
    if(!M.X.rows.every(q=>isFinite(q.m.lamCells)&&isFinite(q.m.pexp)&&q.m.amp.every(isFinite))) nBad++;
    for(const id of SCENE_IDS){ ST['f_'+id]=SCENES[id].fmax; }
    M=buildModel(); nCase++;
    if(!M.X.rows.every(q=>isFinite(q.m.lamCells)&&isFinite(q.m.pexp)&&q.m.amp.every(isFinite))) nBad++;
    ok(nBad===0,'every medium at both frequency ends, both amplitude ends and both modes, and the analysis at both ends: finite and clean ('+nCase+' cases)'); }
  Object.assign(ST,stSave); resetRuns();

  /* ---------- J. the scene object ---------- */
  { const shot=makeShot(1400,820), S=makeScene({getContext:()=>shot});
    Object.assign(ST,DEFAULTS); resetRuns(); CLOCK.acc=0;
    let adv=0; for(let f=0;f<5;f++) if(S.step()) adv++; ok(adv>=2,'the water view advances in the frame loop');
    ST.view='media'; ok(!S.step(),'the three media do not');
    ST.view='water'; ST.tape=true; ST.meter=true;
    let G=latGeo(shot,S.W,S.H,buildModel());
    const g=genGeo(G.sq,RUNS.water);
    ok(sourceActive(RUNS.water),'the source is running'); ok(S.pointer('down',g.btn.x,g.btn.y),'a click on the generator’s button is taken');
    ok(!sourceActive(RUNS.water),'and switches the source off'); S.pointer('up',0,0);
    S.pointer('down',g.btn.x,g.btn.y); ok(sourceActive(RUNS.water),'clicking it again switches it back on'); S.pointer('up',0,0);
    const t0=TOOLS.tape[0];
    ok(S.pointer('down',G.sq.x+t0[0]*G.sq.w,G.sq.y+t0[1]*G.sq.h),'pointer-down on a tape end grabs it'); eq(DRAG.what,'tape0','the first end');
    S.pointer('move',G.sq.x+0.1*G.sq.w,G.sq.y+0.2*G.sq.h);
    close(TOOLS.tape[0][0],0.1,1e-12,'the end follows the pointer'); ok(S.pointer('up',0,0),'released');
    S.pointer('down',G.sq.x+TOOLS.probes[1][0]*G.sq.w,G.sq.y+TOOLS.probes[1][1]*G.sq.h); eq(DRAG.what,'probe1','a probe grabs');
    S.pointer('move',G.sq.x+2*G.sq.w,G.sq.y-50);
    close(TOOLS.probes[1][0],1,0,'clamped to the tank'); close(TOOLS.probes[1][1],0,0,'at the top'); S.pointer('up',0,0);
    ok(!S.pointer('down',G.sq.x+0.93*G.sq.w,G.sq.y+0.07*G.sq.h),'empty water grabs nothing');
    ST.view='media'; ok(!S.pointer('down',300,300),'the three media ignore the pointer');
    Object.assign(TOOLS,JSON.parse(JSON.stringify(TOOLS0))); Object.assign(ST,stSave); resetRuns(); }

  /* ---------- K. the layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  /* the floors are 70 % of what each configuration actually emits at its LEANEST size, measured
     and written down here: a field batches thousands of cells into a handful of fills, the side
     view draws ten, and the analysis view is curves — one floor for all of them would either
     punish an honest view or pass a blank one (Known-bad: op-count floors) */
  const CONFIGS=[
    [{view:'water'},120,2800,4],[{view:'water',look:'side',graph:true},120,7,4],
    [{view:'water',tape:true,watch:true,meter:true,graph:true},120,2800,7],
    [{view:'water',wave:'pulse'},60,800,4],[{view:'water',amp_water:0},60,4,3],
    [{view:'sound'},120,3000,4],[{view:'sound',soundView:'particles'},160,300,4],
    [{view:'sound',soundView:'both',graph:true,meter:true,tone:true},160,4800,5],
    [{view:'light'},260,7500,5],[{view:'light',inten:true,graph:true},260,7500,9],
    [{view:'light',screen:false,inten:false},200,6700,4],
    [{view:'light',tape:true,watch:true,meter:true,inten:true},260,7500,12],
    [{view:'light',f_light:SCENES.light.fmax},260,7600,5],
    [{view:'media'},0,5,20],[{view:'media',f_water:SCENES.water.fmin,f_sound:SCENES.sound.fmax,f_light:SCENES.light.fmax},0,5,20],
  ];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [base,steps,rFloor,sFloor] of CONFIGS){
    Object.assign(ST,DEFAULTS,base); resetRuns();
    if(MEDIA[base.view]){ const R=syncRun(base.view); if(base.wave==='pulse') firePulse(R); runFor(base.view,steps); }
    const nm=JSON.stringify(base);
    for(const [W,H] of SIZES){
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) continue;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      const rects=fills.reduce((a,o)=>a+(o.n||1),0), strokes=c.ops.filter(o=>o.op==='stroke').length;
      /* floors on what the ops CARRY (rectangle sub-paths), per configuration */
      ok(rects>=rFloor&&strokes>=sFloor&&texts.length>=3,
         nm+' '+W+'x'+H+' draws substance ('+rects+' rects, '+strokes+' strokes, '+texts.length+' texts; floors '+rFloor+'/'+sFloor+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb, ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      /* the house #hint (HTML, bottom:11px, 11px type) owns the bottom-left corner, and the
         display-list capture cannot see it because it is not canvas (wave-on-a-string) */
      const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
      ok(!inHint.length,nm+' '+W+'x'+H+' nothing under the #hint line'+(inHint.length?' ("'+inHint[0].t.slice(0,30)+'" to y '+fmt(inHint[0].bb[3],0)+')':''));
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    }
  }
  Object.assign(ST,stSave); resetRuns(); Object.assign(TOOLS,JSON.parse(JSON.stringify(TOOLS0)));

  /* ---------- L. the formatters that write powers of ten ---------- */
  { eq(supTxt(8),'⁸','supTxt turns 8 into a superscript eight');
    eq(supTxt(-15),'⁻¹⁵','and -15 into a superscript minus fifteen');
    eq(pow10(8),'10⁸','pow10(8) is the axis label 10^8'); eq(pow10(-7),'10⁻⁷','pow10(-7) is 10^-7');
    eq(sciTxt(2.99792458e8,4),'2.998×10⁸','sciTxt writes c as 2.998x10^8 for the canvas');
    eq(sciHTML(2.99792458e8,4),'2.998&times;10<sup>8</sup>','and sciHTML as markup for the readout');
    eq(sciTxt(0.0165,3),'0.0165','an ordinary magnitude is left to sigf');
    eq(sciTxt(343,3),'343','as is 343'); eq(sciTxt(0,3),'0','and zero');
    eq(sciTxt(5.11e-7,3),'5.11×10⁻⁷','a small one goes to the exponent form'); }

  /* ---------- M. colour ---------- */
  { ok(/^rgb\(\d+,\d+,\d+\)$/.test(specCss(550,0.5)),'specCss is well formed');
    const g=specCss(550,1).match(/\d+/g).map(Number); ok(g[1]>=250&&g[0]<100,'550 nm is green (brightness checked, not just syntax)');
    const r=specCss(650,1).match(/\d+/g).map(Number); ok(r[0]>=250&&r[1]<60,'650 nm is red');
    const z=specCss(650,0).match(/\d+/g).map(Number); ok(z[0]+z[1]+z[2]===0,'zero brightness is black');
    eq(CIE1931.length,81,'81 CIE rows, 380 to 780 nm every 5 (the CIE’s own file)');
    /* the light view's colour follows its frequency */
    const red=specCss(SCENES.light.v/SCENES.light.fmin,1).match(/\d+/g).map(Number);
    const vio=specCss(SCENES.light.v/SCENES.light.fmax,1).match(/\d+/g).map(Number);
    ok(red[0]>red[2]&&vio[2]>vio[0],'the slider’s ends are red (780 nm) and violet (380 nm)'); }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
