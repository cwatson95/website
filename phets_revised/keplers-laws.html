<title>Kepler&rsquo;s laws &mdash; the ellipse and its foci, equal areas in equal times, and T&sup2; against a&sup3;</title>
<!--
  ===================================================================
  keplers-laws.html — Kepler's three laws on one orbit: the ellipse
  with the star at a focus, equal areas in equal times, and the
  period against the semi-major axis
  ===================================================================

  Remake of PhET Interactive Simulations' Kepler's Laws (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0).  New code; no PhET
  code or assets.  PhET's four screens are the first four views here.

  THE FIRST LAW: drag the planet, or the tip of its velocity arrow,
  and the orbit follows — the ellipse with the star at one focus, the
  empty focus, the string d₁ + d₂ = 2a, the axes, the semiaxes a and
  b, the focal distance c and e = c/a.  Choose one of PhET's target
  orbits (Mercury to Jupiter) and match it, or put the planet on it.
  THE SECOND LAW: the orbit cut into 2–6 sectors that take equal
  times, which fill as the planet sweeps them, with PhET's swept-area
  bars under the orbit and the areas and times printed on it.  THE
  THIRD LAW: T^p against a^q with PhET's power chips — only a³ and T²
  give a straight line through the origin — and a log–log view on
  which every orbit about the same star lies on one line of slope 3/2,
  with the five planets on it.  ALL LAWS: the three together.
  KEPLER'S EQUATION (an analysis view, not a PhET screen): where the
  motion in time comes from — the auxiliary circle, the mean, eccentric
  and true anomalies, M = E − e sin E solved by Newton in front of you,
  and the three anomalies plotted over one period.

  WHAT IS EXACT
  -------------
  Everything about the orbit.  The elements come from the state vector
  in closed form (vis-viva for a, the eccentricity vector for e and the
  periapsis direction, the sign of x v_y − y v_x for the sense of
  travel); the position in time comes from Kepler's equation solved by
  Newton safeguarded with the bracket [M − e, M + e] to 1e-15 in the
  step, which build/keplers-laws/derive.py checks against scipy's
  brentq (worst 8.9e-16 over 120 cases) and against solve_ivp at rtol
  1e-13 integrating the equations of motion (the Kepler position stays
  within 8e-12 a over 2.3 periods).  The sector areas are πab/N
  exactly; derive.py re-derives each by Gauss–Legendre quadrature of
  ½r²dν (worst 1.3e-15) and the suite re-derives them again in the
  browser.  T = 2π√(a³/GM), asserted against both.  No numerical
  integration is used anywhere in the sim itself.

  WHAT IS MODELLED
  ----------------
  PhET's model: a test body about a FIXED star, so the planet's own
  mass does not enter (for a real planet μ = G(M+m), which moves the
  Earth's period by 1.5 parts in a million).  PhET's rules are kept:
  the speed is capped at 0.99 of the escape speed and the orbit is
  flagged as escaping from 0.9801 of it; an orbit whose periapsis is
  inside the star crashes; a flagged orbit is drawn dashed and the
  clock will not run on it (PhET disables play the same way).

  WHAT IS NOT MODELLED
  --------------------
  Nothing perturbs the orbit: no other planet, no oblateness, no
  relativity (Mercury's 43″/century is 5e-8 of a revolution and would
  be invisible), no radiation pressure.  PhET's sounds, its metronome,
  its screen-reader descriptions and its PhET-iO target orbits are not
  here.  Orbits are drawn in the plane, as PhET draws them.

  MEASURED NUMBERS, AND WHERE THEY COME FROM
  ------------------------------------------
  AU = 149,597,870.7 km (IAU 2012 Resolution B2, exact by definition);
  the Julian year = 365.25 d = 31,557,600 s (exact by definition);
  GM_sun = 1.32712440042e20 m³ s⁻² (Wikipedia, "Standard gravitational
  parameter" — the value projects/simulations/lagrange_points.html
  already carries).  Those three give K = GM_sun yr²/AU³ =
  39.4769264 AU³ yr⁻² per solar mass, and 1 AU/yr = 4.740470464 km/s.
  PhET's own values are read out of docs/phets/keplers-laws_en.html
  (1.2.12) and named as PhET's on the page: G = 4.4567 AU (km/s)² per
  10²⁸ kg, our Sun = 200 × 10²⁸ kg, star mass 0.5–2 suns snapping to 1
  within 5 %, the planet at (2, 0) AU moving 17.2358 km/s, 2–6 period
  divisions, e shown as 0 below 0.01, the star's radius
  max(0.03, 0.023 M^(1/3)) AU, and the target orbits' (e, a).

  WHERE PhET AND THIS FILE DIFFER, DELIBERATELY (all measured in
  derive.py, and stated in the physics column)
  -----------------------------------------------------------------
  * PhET's μ = 4.45669 M is 0.24 % away from its own year: a circular
    orbit at 1 AU reads 29.855 km/s where 2π AU in its 1.000-year
    period is 29.785 km/s.  Here GM_sun, the AU and the year are the
    measured ones, so the two agree: 29.7847 km/s.
  * PhET's clock advances the mean anomaly 6.3/T rad per year, not
    2π/T, so one revolution reads 0.99733 T on its stopwatch.  Here
    the clock is exact.
  * PhET stops Newton's iteration once a step falls below 0.01 rad,
    which leaves the planet up to 2.4e-5 AU (3,559 km) from where
    Kepler puts it on the default orbit — invisible, but not exact.
    Here the step is driven to 1e-15.
-->

'use strict';
/* ================================================================== *
 *  small utilities  (sbs_sims.html via build_lagr/p1_utils.js, verbatim) *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}

            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and

  PLANET: 50,                /* KeplersLawsConstants.PLANET_MASS, 1e28 kg (it does not enter the orbit) */
  MU_COEFF: 4.45669,         /* EllipticalOrbitEngine: mu = 4.45669 M */

/* ---- the second law: N sectors of equal area, cut at equal steps of mean anomaly ---------- */
function klSectors(el, N){
  const out = [];
  for(let k = 0; k <= N; k++){
    const E = keplerE(TAU * k / N, el.e);
    out.push(trueFromE(E, el.e));            /* true anomalies of the cuts, 0 .. 2 pi */
  }
  return out;

   paused) every sector shows its full area; once erased the sectors fill as the planet
   sweeps them, from each sector's own starting cut (PhET's rule), and stay full. */
function klSwept(el, N, tNow, sweep){
  const D = TAU / N, full = PI * el.a * el.b / N;
  const fr = new Array(N).fill(0);
  if(!sweep.erased){ for(let k = 0; k < N; k++) fr[k] = 1; return {frac: fr, full}; }

function klSectorPoly(el, nu0, nu1, nSeg){
  const pts = [[0, 0]];
  const n = nSeg || 48;

  const tgt = ST.target === 'none' || ST.mass !== 1 ? null : targetById(ST.target);
  const planets = TARGETS.filter(t => t.a).map(t => ({id: t.id, name: t.name, a: t.a,

  const aMax = Math.max(2, el.a * 1.15, tgt ? tgt.a * 1.1 : 0);

/* the anomaly view follows the same clock as every other view: M is the planet's own mean
   anomaly at SIM.t, and its slider scrubs SIM.t through one period rather than keeping a
   second clock of its own */
function anomModel(el){
  const Mabs = el.M0 + el.n * SIM.t;
  const M = ((Mabs % TAU) + TAU) % TAU;
  const sol = keplerSolve(M, el.e), E = sol.E, nu = trueFromE(E, el.e);
  const tr = [];              /* Newton from E0 = M, PhET's start, for the picture */
  let Ei = M, stop = -1;
  tr.push(Ei);
  for(let k = 0; k < 10; k++){
    const f = Ei - el.e * Math.sin(Ei) - M, fp = 1 - el.e * Math.cos(Ei), d = f / fp;
    Ei -= d; tr.push(Ei);
    if(stop < 0 && Math.abs(d) <= PHET.NEWTON_TOL) stop = k;      /* where PhET's loop stops */
    if(Math.abs(d) < 1e-16) break;
  }
  const curve = [];
  for(let i = 0; i <= 160; i++){
    const m = TAU * i / 160, e2 = keplerE(m, el.e);
    curve.push([m, e2, trueFromE(e2, el.e)]);
  }
  return {M, E, nu, it: sol.it, res: E - el.e * Math.sin(E) - M, trace: tr, stop, curve,
          t: SIM.t, tPeri: M / el.n, r: el.a * (1 - el.e * Math.cos(E))};
}
function buildModel(){
  const st = ST;
  const el = klOrbit(st.px, st.py, st.vx, st.vy, st.mass, st.circular);
  const now = planetNow(el);
  const M = {view: st.view, st, t: SIM.t, el, now, foci: klFoci(el), R: viewRadius(),
             warn: el.crash ? 'The body will crash into the star.' : el.escaping ? 'The body will escape the system.' : null,
             K: klConst(st.mass), tgt: st.target === 'none' ? null : targetById(st.target),
             tgtOn: st.target !== 'none' && st.mass === 1};
  if(el.allowed && (st.view === 'second' || st.view === 'all')) M.sec = secondModel(el);
  if(el.allowed && (st.view === 'third' || st.view === 'all')) M.thd = thirdModel(el);
  if(el.allowed && st.view === 'anom') M.an = anomModel(el);
  if(el.allowed) M.rv = {r: now.r, thr: Math.atan2(now.y, now.x), v: now.vKms,
                         thv: Math.atan2(now.vy, now.vx),
                         thrv: Math.atan2(now.vy, now.vx) - Math.atan2(now.y, now.x)};
  return M;
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — build_lagr/p4_views.js (lineage build_buoy, build_cycloid), its   *
 *  generic block only; worldFill/worldPoly/arrowW from build_buoy      *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,x:0,y:0,th:0,ph:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);

/* a world polyline from a list of points, clipped to the window in world space (segments that leave are cut) */
function worldPath(ctx,map,pts,col,lw,dash,win){
  ctx.beginPath(); let started=false, px=0,py=0, n=0;
  for(let i=0;i<pts.length;i++){ const p=pts[i];
    const inside=!win||(p[0]>=win.x0&&p[0]<=win.x1&&p[1]>=win.y0&&p[1]<=win.y1);
    const X=map.X(p[0]), Y=map.Y(p[1]);
    if(!inside){ started=false; continue; }
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); n++; }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';

function seg(ctx,map,a,b,col,lw,dash){

  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));

/* Liang-Barsky: the part of segment a-b inside the world window, or null */
function clipToWin(a,b,win){ let t0=0,t1=1; const dx=b[0]-a[0], dy=b[1]-a[1];
  const P=[-dx,dx,-dy,dy], Q=[a[0]-win.x0,win.x1-a[0],a[1]-win.y0,win.y1-a[1]];
  for(let i=0;i<4;i++){ if(P[i]===0){ if(Q[i]<0) return null; } else { const t=Q[i]/P[i]; if(P[i]<0){ if(t>t1) return null; if(t>t0) t0=t; } else { if(t<t0) return null; if(t<t1) t1=t; } } }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]]; }

  if(fill){ ctx.fillStyle=fill; ctx.fill(); }

}
function dot(ctx,x,y,r,fill,stroke,lw){

function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();

function arrowPx(ctx,X0,Y0,X1,Y1,col,lw){
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);

/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }

/* legendAuto's candidates, but a candidate is also rejected over a registered label, and the box is registered */
function legendR(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0; for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8, mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],[b.x+8,my],[b.x1-bw-8,my]];
  let pick=null;
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){ const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue; hit=true; }
    for(let i=0;i<LABELS.length&&!hit;i++){ const o=LABELS[i]; if(o[0]<cx+bw&&o[2]>cx&&o[1]<cy+bh&&o[3]>cy) hit=true; }

function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));

function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){

function worldFill(ctx,map,pts,col){

/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}

/* ================================================================== *
 *  the shared view kit for this family: the hint-safe layout, axes    *
 *  that register what they draw, and the pieces both sims paint (the  *
 *  grid, the bodies, the velocity and gravity arrows, the measuring   *
 *  tape, the trail, the stopwatch).  my-solar-system reads this file  *
 *  from ../keplers-laws/, so the two sims draw the same furniture.    *
 * ================================================================== */
/* The house #hint sits at bottom:11px in 11px type, ON TOP of the last line of a caption
   anchored at H - 12, and the canvas capture cannot see it because the hint is HTML
   (wave-on-a-string's finding).  Every layout here is built for H - HINT_H, and the layout
   sweep asserts no canvas text reaches the hint's corner. */
const HINT_H = 18;
function stageLayoutH(ctx, W, H, capFull, capShort, nBottom, bottomFrac, nBottomNarrow){
  return stageLayout(ctx, W, H - HINT_H, capFull, capShort, nBottom, bottomFrac, nBottomNarrow);
}
/* tick labels follow the tick SPACING, not a fixed decimal count (Known-bad: fmt(t,2) prints
   "318.00" whatever the range and six of those do not fit a narrow panel) */
function tickFmt(ticks){
  let g = Infinity;
  for(let i = 1; i < ticks.length; i++) g = Math.min(g, Math.abs(ticks[i] - ticks[i - 1]));
  if(!isFinite(g) || g <= 0) return v => sigf(v, 3);
  let d = 0;
  while(d < 6 && Math.abs(Math.round(g * Math.pow(10, d)) - g * Math.pow(10, d)) > 1e-6 * Math.max(1, g * Math.pow(10, d))) d++;
  return v => fmt(Math.abs(v) < 1e-12 ? 0 : v, d);
}
/* axes() registers nothing, so a label placed later can land on a tick number (the
   standard_model trap).  axesT registers every tick label and both axis titles. */
function axesT(ctx, b, xlo, xhi, ylo, yhi, opt){
  const o = Object.assign({}, opt || {});
  if(o.xticks === undefined) o.xticks = ticksFor(Math.min(xlo, xhi), Math.max(xlo, xhi), o.nx || 6);
  if(o.yticks === undefined) o.yticks = ticksFor(Math.min(ylo, yhi), Math.max(ylo, yhi), o.ny || 5);
  if(!o.xfmt) o.xfmt = tickFmt(o.xticks);
  if(!o.yfmt) o.yfmt = tickFmt(o.yticks);
  axesR(ctx, b, xlo, xhi, ylo, yhi, o);
  const fs = 10.5;
  for(const t of o.xticks){
    const X = b.x + b.w * (t - xlo) / (xhi - xlo || 1);
    if(X < b.x - 0.5 || X > b.x1 + 0.5) continue;
    const w = plain(o.xfmt(t)).length * fs * 0.52;
    LABELS.push([X - w / 2, b.y1 + 5, X + w / 2, b.y1 + 5 + fs * 1.15]);
  }
  for(const t of o.yticks){
    const Y = b.y1 - b.h * (t - ylo) / (yhi - ylo || 1);
    if(Y < b.y - 0.5 || Y > b.y1 + 0.5) continue;
    const w = plain(o.yfmt(t)).length * fs * 0.52;
    LABELS.push([b.x - 6 - w, Y - fs * 0.6, b.x - 6, Y + fs * 0.6]);
  }
  if(o.xlab){ const w = plain(o.xlab).length * 11 * 0.52;
    LABELS.push([b.x + b.w / 2 - w / 2, b.y1 + 21, b.x + b.w / 2 + w / 2, b.y1 + 21 + 13]); }
  if(o.ylab) LABELS.push([b.x - 47, b.y, b.x - 33, b.y1]);
}
/* a label that is kept inside a box as well as on the canvas */
function labIn(ctx, W, H, b, x, y, txt, col, font, align, base){
  const fs = parseFloat((font || LAB_FONT).match(/([\d.]+)px/)[1]);
  const w = plain(txt).length * fs * 0.52;
  let X = clamp(x, b.x + (align === 'right' ? w + 3 : align === 'center' ? w / 2 + 3 : 3),
                b.x1 - (align === 'right' ? 3 : align === 'center' ? w / 2 + 3 : w + 3));
  const Y = clamp(y, b.y + fs, b.y1 - fs * 0.6);
  return lab(ctx, W, H, X, Y, txt, col, font, align, base);
}

/* ---- the furniture ----------------------------------------------------------------------- */
/* a grid of `step` world units, clipped to the box, with the axes through the origin bolder */
function gridDraw(ctx, map, b, step, col){
  const x0 = map.wx(b.x), x1 = map.wx(b.x1), y0 = map.wy(b.y1), y1 = map.wy(b.y);
  const i0 = Math.ceil(x0 / step), i1 = Math.floor(x1 / step);
  const j0 = Math.ceil(y0 / step), j1 = Math.floor(y1 / step);
  if(i1 - i0 > 400 || j1 - j0 > 400) return 0;       /* far out, a grid is a grey wash */
  let n = 0;
  ctx.beginPath();
  for(let i = i0; i <= i1; i++){ const X = map.X(i * step); ctx.moveTo(X, b.y); ctx.lineTo(X, b.y1); n++; }
  for(let j = j0; j <= j1; j++){ const Y = map.Y(j * step); ctx.moveTo(b.x, Y); ctx.lineTo(b.x1, Y); n++; }
  ctx.strokeStyle = col || '#161b28'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath();
  if(0 >= x0 && 0 <= x1){ const X = map.X(0); ctx.moveTo(X, b.y); ctx.lineTo(X, b.y1); }
  if(0 >= y0 && 0 <= y1){ const Y = map.Y(0); ctx.moveTo(b.x, Y); ctx.lineTo(b.x1, Y); }
  ctx.strokeStyle = '#222a3c'; ctx.lineWidth = 1.2; ctx.stroke();
  return n;
}
/* a body: drawn to scale when that is more than minPx, else at minPx, with a halo */
function bodyDraw(ctx, map, x, y, rWorld, col, minPx){
  const X = map.X(x), Y = map.Y(y), rp = Math.max(minPx || 3.5, rWorld * map.s);
  dot(ctx, X, Y, rp + 2.5, rgba(col, 0.18), null);
  dot(ctx, X, Y, rp, col, '#0b0f1a', 1);
  return {X, Y, rp};
}
/* the velocity arrow: px per km/s is fixed and printed on the canvas, so the arrow is a
   measurement rather than a decoration */
function velArrow(ctx, map, x, y, vxk, vyk, scale, col){
  const X = map.X(x), Y = map.Y(y), TX = X + vxk * scale, TY = Y - vyk * scale;
  arrowPx(ctx, X, Y, TX, TY, col, 2);
  return {X, Y, TX, TY};
}
/* the gravity arrow: 60 px at the reference pull, times 10^pow, and CAPPED to the box.  An
   inverse-square force grows without bound as two bodies close, so an uncapped arrow leaves
   the stage entirely (seen in the first capture of my-solar-system, 418 px of arrow off both
   ends of the view).  A capped arrow is drawn hollow-tipped and reported, never silently. */
function forceArrow(ctx, map, x, y, fx, fy, fref, pow, col, maxPx){
  const X = map.X(x), Y = map.Y(y), f = Math.hypot(fx, fy);
  if(!(f > 0)) return null;
  const want = FSCALE * Math.pow(10, pow) * f / fref;
  if(want < 2) return {small: true, X, Y};
  const cap = maxPx || 1e9, L = Math.min(want, cap), capped = want > cap;
  const TX = X + L * fx / f, TY = Y - L * fy / f;
  arrowPx(ctx, X, Y, TX, TY, col, 2);
  if(capped) dot(ctx, TX, TY, 4, null, col, 1.4);
  return {X, Y, TX, TY, L, want, capped};
}
/* the measuring tape: two ends and the distance between them */
function tapeDraw(ctx, W, H, map, tape, col){
  const AX = map.X(tape.ax), AY = map.Y(tape.ay), BX = map.X(tape.bx), BY = map.Y(tape.by);
  ctx.beginPath(); ctx.moveTo(AX, AY); ctx.lineTo(BX, BY);
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(AX, AY, BX, BY);
  ctx.beginPath(); ctx.rect(AX - 5, AY - 5, 10, 10); ctx.fillStyle = col; ctx.fill();
  dot(ctx, BX, BY, 5, null, col, 2);
  const d = Math.hypot(tape.bx - tape.ax, tape.by - tape.ay);
  lab(ctx, W, H, (AX + BX) / 2, (AY + BY) / 2 - 10, sigf(d, 4) + ' AU', col, LAB_FONT, 'center', 'bottom');
  return d;
}
function tapeHit(map, tape, px, py, tol){
  const t = tol || 12;
  if(Math.hypot(map.X(tape.bx) - px, map.Y(tape.by) - py) <= t) return 'tapeB';
  if(Math.hypot(map.X(tape.ax) - px, map.Y(tape.ay) - py) <= t) return 'tapeA';
  return null;
}
/* a world polyline, every segment CLIPPED IN WORLD SPACE (Liang-Barsky) to the window: the
   siblings' worldPath drops a segment whose two ends are both outside even when it crosses
   the box, which cuts a big orbit short at the frame (Known-bad, pupil_plane). */
function worldPathClip(ctx, map, pts, col, lw, dash, win){
  ctx.beginPath();
  let n = 0, prevIn = false, px = 0, py = 0;
  for(let i = 0; i + 1 < pts.length; i++){
    const c = win ? clipToWin(pts[i], pts[i + 1], win) : [pts[i], pts[i + 1]];
    if(!c){ prevIn = false; continue; }
    const X0 = map.X(c[0][0]), Y0 = map.Y(c[0][1]), X1 = map.X(c[1][0]), Y1 = map.Y(c[1][1]);
    if(!prevIn || Math.abs(X0 - px) > 0.01 || Math.abs(Y0 - py) > 0.01) ctx.moveTo(X0, Y0);
    ctx.lineTo(X1, Y1);
    POLY_SEGS.push(X0, Y0, X1, Y1);
    px = X1; py = Y1; prevIn = true; n++;
  }
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1.5; ctx.lineJoin = 'round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
  return n;
}
/* a clip to a box for FILLS (a polyline is clipped in data space instead; the display-list
   recorder does record this rectangle, so the rasterised PNG shows what a browser shows) */
function withClip(ctx, b, fn){
  ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  try{ fn(); } finally{ ctx.restore(); }
}
/* a trail of world points, clipped to the window */
function trailDraw(ctx, map, pts, col, win, lw){
  return worldPath(ctx, map, pts, col, lw || 1.3, null, win);
}
/* the stopwatch, drawn as a chip inside a box and registered so nothing lands on it */
function swChip(ctx, W, H, b, txt, running){
  const w = 116, hh = 30, x = b.x + 10, y = b.y1 - hh - 10;
  ctx.fillStyle = 'rgba(10,12,18,.82)'; ctx.fillRect(x, y, w, hh);
  frame(ctx, box(x, y, w, hh), running ? COL.pos : COL.edge);
  LABELS.push([x, y, x + w, y + hh]);
  ctx.fillStyle = running ? COL.pos : '#9aa2b4';
  ctx.font = '12.5px "SF Mono", Menlo, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(plain(txt), x + 9, y + hh / 2);
  return box(x, y, w, hh);
}
/* "1 AU = 84 px": every scale distortion (and every scale) is printed on the canvas */
function scaleNote(map){ return '1 AU = ' + fmt(map.s, 1) + ' px'; }

/* ================================================================== *
 *  the orbit stage (shared by the first four views) and views 1-2     *
 * ================================================================== */
/* the ellipse sampled uniformly in the ECCENTRIC anomaly, which puts more points where the
   orbit turns fastest (near periapsis) instead of fewest */
function ellipsePts(el, n){
  const N = n || 256, cw = Math.cos(el.w), sw = Math.sin(el.w), d = el.dir, out = [];
  for(let i = 0; i <= N; i++){
    const E = TAU * i / N, X = el.a * (Math.cos(E) - el.e), Y = el.b * Math.sin(E);
    out.push([X * cw - d * Y * sw, X * sw + d * Y * cw]);
  }
  return out;
}
function orbitMap(b, R){ return worldFitUp(b, {xmin: -R, xmax: R, ymin: -R, ymax: R}, 0); }
function winOf(map, b){ return {x0: map.wx(b.x), x1: map.wx(b.x1), y0: map.wy(b.y1), y1: map.wy(b.y)}; }
function inWin(p, w){ return p[0] >= w.x0 && p[0] <= w.x1 && p[1] >= w.y0 && p[1] <= w.y1; }
/* the force on PhET's planet (its mass is 50e28 kg and does not enter the orbit), in units of
   the pull at 1 AU from our Sun -- so the arrow's scale can be stated exactly */
function gravRatio(el){ return (F_REF * F_REF) / (el.r * el.r) * el.M_sun; }

/* the whole orbit picture: grid, target, orbit, sectors, overlays, bodies, arrows.
   `show` selects the overlays; every view passes its own set. */
function drawOrbitStage(ctx, W, H, M, b, show){
  const el = M.el, st = M.st, map = orbitMap(b, M.R), win = winOf(map, b);
  const now = M.now;
  frame(ctx, b, COL.edge);
  /* what the picture is, and its scale, BEFORE anything else is registered: drawn last, the
     title loses the label registry's shove and ends up outside the box (seen at 1400x820 with
     an eccentric orbit, where the velocity label sits where the title wants to be) */
  lab(ctx, W, H, b.x + 6, b.y + 8, (st.mass === 1 ? 'our Sun' : fmt(st.mass, 2) + ' M☉')
      + ' — a = ' + sigf(el.a, 4) + ' AU, e = ' + fmt(el.e, 3) + (el.allowed ? ', T = ' + fmt(el.T, 4) + ' yr' : ''),
      '#aeb6c6', 'italic 13px Georgia, serif', 'left', 'top');
  lab(ctx, W, H, b.x1 - 6, b.y + 8, plain(scaleNote(map)) + ' — true shape, both axes alike',
      COL.dim, SM_FONT, 'right', 'top');
  if(M.warn) lab(ctx, W, H, (b.x + b.x1) / 2, b.y + 30, plain(M.warn) + ' The clock will not run.', COL.warn,
                 'italic 15px Georgia, serif', 'center', 'top');
  if(show.grid) gridDraw(ctx, map, b, 1, '#141a27');
  /* the target orbit: PhET draws it only for our Sun */
  if(M.tgtOn && show.target){
    const t = M.tgt, tel = {a: t.a, b: t.a * Math.sqrt(1 - t.e * t.e), e: t.e, w: 0, dir: 1};
    worldPathClip(ctx, map, ellipsePts(tel, 192), COL.target, 1.6, [7, 5], win);
    const tip = conicPoint({p: t.a * (1 - t.e * t.e), e: t.e, w: 0, dir: 1}, PI);
    if(inWin(tip, win)) lab(ctx, W, H, map.X(tip[0]) - 6, map.Y(tip[1]) - 8, t.name + '&rsquo;s orbit', COL.target, SM_FONT, 'right', 'bottom');
  }
  /* the swept sectors, filled by how much of each has been swept */
  if(show.sectors && M.sec){
    const c = M.sec;
    withClip(ctx, b, () => {
      for(let k = 0; k < c.N; k++){
        if(c.frac[k] <= 0) continue;
        const nu0 = c.cuts[k];
        const nu1 = c.frac[k] >= 1 ? c.cuts[k + 1] : klSweepNu(el, c.N, k, c.frac[k]);
        const poly = klSectorPoly(el, nu0, nu1, 40);
        const shade1 = 0.13 + 0.30 * (k + 1) / c.N;
        worldFill(ctx, map, poly, rgba(c.frac[k] >= 1 ? COL.sector : COL.sectorOn, shade1));
      }
      for(let k = 0; k <= c.N; k++){
        const p = conicPoint(el, c.cuts[k]);
        seg(ctx, map, [0, 0], p, rgba(COL.sector, 0.5), 1, [3, 3]);
      }
    });
  }
  /* the orbit itself: dashed and orange when PhET would not allow it */
  const pts = ellipsePts(el, 256);
  worldPathClip(ctx, map, pts, el.allowed ? COL.orbit : COL.warn, el.allowed ? 2 : 1.6,
                el.allowed ? null : [6, 5], win);
  /* first-law furniture */
  const F = M.foci;
  if(show.axes){
    const cw = Math.cos(el.w), sw = Math.sin(el.w), d = el.dir;
    const P = [F.centre[0] + el.a * cw, F.centre[1] + el.a * sw];
    const Ap = [F.centre[0] - el.a * cw, F.centre[1] - el.a * sw];
    const B1 = [F.centre[0] - d * el.b * sw, F.centre[1] + d * el.b * cw];
    const B2 = [F.centre[0] + d * el.b * sw, F.centre[1] - d * el.b * cw];
    segClip(ctx, map, Ap, P, win, rgba(COL.struct, 0.75), 1.2, [5, 4]);
    segClip(ctx, map, B1, B2, win, rgba(COL.struct, 0.75), 1.2, [5, 4]);
    if(show.semiaxes){
      segClip(ctx, map, F.centre, P, win, COL.amaj, 2.4);
      segClip(ctx, map, F.centre, B1, win, COL.bmin, 2.4);
      /* two thirds out, not at the midpoint: the midpoint of a is inside the star's disc */
      const mid = [F.centre[0] + 0.66 * (P[0] - F.centre[0]), F.centre[1] + 0.66 * (P[1] - F.centre[1])];
      const midb = [F.centre[0] + 0.66 * (B1[0] - F.centre[0]), F.centre[1] + 0.66 * (B1[1] - F.centre[1])];
      if(inWin(mid, win)) lab(ctx, W, H, map.X(mid[0]), map.Y(mid[1]) - 9, 'a = ' + sigf(el.a, 4) + ' AU', COL.amaj, LAB_FONT, 'center', 'bottom');
      if(inWin(midb, win)) lab(ctx, W, H, map.X(midb[0]) + 7, map.Y(midb[1]), 'b = ' + sigf(el.b, 4) + ' AU', COL.bmin, LAB_FONT);
    }
  }
  if(show.foci){
    for(const f of [F.f1, F.f2]){
      if(!inWin(f, win)) continue;
      const X = map.X(f[0]), Y = map.Y(f[1]);
      ctx.strokeStyle = COL.foci; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(X - 5, Y - 5); ctx.lineTo(X + 5, Y + 5);
      ctx.moveTo(X - 5, Y + 5); ctx.lineTo(X + 5, Y - 5); ctx.stroke();
    }
    if(inWin(F.f2, win)) lab(ctx, W, H, map.X(F.f2[0]), map.Y(F.f2[1]) + 9, 'empty focus', COL.foci, SM_FONT, 'center', 'top');
    if(show.string){
      const d1 = Math.hypot(now.x, now.y), d2 = Math.hypot(now.x - F.f2[0], now.y - F.f2[1]);
      segClip(ctx, map, [0, 0], [now.x, now.y], win, COL.foci, 1.6);
      segClip(ctx, map, F.f2, [now.x, now.y], win, COL.foci, 1.6);
      /* both strings can lie along the same line (a planet at an apsis), so each label is
         pushed off its OWN segment, one up and one down, rather than both "above" */
      const off = (a, b2, sgn) => { const dx = b2[0] - a[0], dy = b2[1] - a[1], L = Math.hypot(dx, dy) || 1;
        const k = 0.10 * Math.max(el.a, 0.2) * sgn;
        return [(a[0] + b2[0]) / 2 - k * dy / L, (a[1] + b2[1]) / 2 + k * dx / L]; };
      const m1 = off([0, 0], [now.x, now.y], 1), m2 = off(F.f2, [now.x, now.y], -1);
      if(inWin(m1, win)) lab(ctx, W, H, map.X(m1[0]), map.Y(m1[1]), 'd&#8321; = ' + sigf(d1, 4), COL.foci, SM_FONT, 'center', 'middle');
      if(inWin(m2, win)) lab(ctx, W, H, map.X(m2[0]), map.Y(m2[1]), 'd&#8322; = ' + sigf(d2, 4), COL.foci, SM_FONT, 'center', 'middle');
    }
  }
  if(show.ecc){
    segClip(ctx, map, F.centre, [0, 0], win, COL.cfoc, 2.4);
    const mid = [F.centre[0] / 2, F.centre[1] / 2];
    /* the star's disc covers the midpoint of c at every mass, so the label clears its radius */
    if(inWin(mid, win)) lab(ctx, W, H, map.X(mid[0]), map.Y(mid[1]) + el.star * map.s + 10,
                            'c = ae = ' + sigf(el.c, 4), COL.cfoc, SM_FONT, 'center', 'top');
  }
  if(show.apsides){
    const P = conicPoint(el, 0), A = conicPoint(el, PI);
    const outward = (p, txt, col) => {
      const X = map.X(p[0]), Y = map.Y(p[1]), L = Math.hypot(X - map.X(0), Y - map.Y(0)) || 1;
      const ux = (X - map.X(0)) / L, uy = (Y - map.Y(0)) / L;
      diamond(ctx, X, Y, 5, col, '#fff');
      lab(ctx, W, H, X + 10 * ux, Y + 10 * uy, txt, col, SM_FONT, ux < -0.3 ? 'right' : (ux > 0.3 ? 'left' : 'center'),
          uy > 0.3 ? 'top' : (uy < -0.3 ? 'bottom' : 'middle'));
    };
    if(st.peri && inWin(P, win)) outward(P, 'periapsis ' + sigf(el.q, 4) + ' AU', '#ffd24a');
    if(st.apo && inWin(A, win)) outward(A, 'apoapsis ' + sigf(el.Q, 4) + ' AU', COL.struct);
  }
  /* the period trace (PhET's "Period (T)" checkbox): the arc drawn since play began */
  if(show.showT && SIM.periodTrace && el.allowed){
    const pt = SIM.periodTrace, n = 90, arc = [];
    for(let i = 0; i <= n; i++){ const s2 = klStateAt(el, pt.t0 + pt.t * i / n); arc.push([s2.x, s2.y]); }
    worldPathClip(ctx, map, arc, COL.struct, 4, null, win);
  }
  /* the semiaxes overlay already draws (and labels) a, so the third law's own
     "semi-major axis" line is skipped rather than drawn on top of it */
  if(show.showA && !(show.axes && show.semiaxes)){
    const cw = Math.cos(el.w), sw = Math.sin(el.w);
    const P = [F.centre[0] + el.a * cw, F.centre[1] + el.a * sw];
    segClip(ctx, map, F.centre, P, win, COL.amaj, 2.4);
    const mid = [F.centre[0] + 0.66 * (P[0] - F.centre[0]), F.centre[1] + 0.66 * (P[1] - F.centre[1])];
    if(inWin(mid, win)) lab(ctx, W, H, map.X(mid[0]), map.Y(mid[1]) - 9, 'a = ' + sigf(el.a, 4) + ' AU', COL.amaj, LAB_FONT, 'center', 'bottom');
  }
  /* the star, to scale (PhET's radius rule), and the planet */
  const starPx = bodyDraw(ctx, map, 0, 0, el.star, COL.star, 4);
  lab(ctx, W, H, starPx.X, starPx.Y + starPx.rp + 8, (st.mass === 1 ? 'our Sun' : fmt(st.mass, 2) + ' M☉'), COL.star, SM_FONT, 'center', 'top');
  const pl = bodyDraw(ctx, map, now.x, now.y, massToRadius(PHET.PLANET), COL.planet, 4);
  /* the arrows */
  if(show.velocity){
    const t = velArrow(ctx, map, now.x, now.y, now.vx, now.vy, VSCALE, COL.pos);
    dot(ctx, t.TX, t.TY, 4.5, COL.pos, '#fff', 1.2);       /* the handle you drag */
    /* off the shaft, not along it: the label was struck through by its own arrow */
    const L2 = Math.hypot(t.TX - t.X, t.TY - t.Y) || 1;
    lab(ctx, W, H, t.TX + 9 * (t.TX - t.X) / L2, t.TY + 9 * (t.TY - t.Y) / L2 - 8,
        'v = ' + fmt(Math.hypot(now.vx, now.vy), 2) + ' km/s', COL.pos, SM_FONT,
        t.TX < t.X ? 'right' : 'left', 'bottom');
  } else if(show.speedLab){
    lab(ctx, W, H, pl.X + pl.rp + 7, pl.Y, fmt(Math.hypot(now.vx, now.vy), 2) + ' km/s', COL.pos, SM_FONT);
  }
  if(show.gravity){
    const g = gravRatio(el), ux = -now.x / now.r, uy = -now.y / now.r;
    const maxPx = 0.42 * Math.min(b.w, b.h);
    const a1 = forceArrow(ctx, map, now.x, now.y, g * ux, g * uy, 1, st.fpow, COL.ref, maxPx);
    forceArrow(ctx, map, 0, 0, -g * ux, -g * uy, 1, st.fpow, COL.ref, maxPx);
    if(a1 && a1.capped) lab(ctx, W, H, b.x + 8, b.y1 - 10, 'the gravity arrow is longer than the view and is drawn cut \u2014 lower the power',
                            COL.warn, SM_FONT, 'left', 'bottom');
  }
  if(show.tape) tapeDraw(ctx, W, H, map, SIM.tape, COL.struct);
  if(show.stopwatch) swChip(ctx, W, H, b, 'stopwatch  ' + plain(yrStr(SIM.sw)), SIM.swRun);
  return {map, win, pl, starPx};
}

/* ================================================================== *

 * ================================================================== */
const CAP1_FULL = 'PhET’s First Law screen. Drag the planet, or the tip of its green velocity arrow, and the orbit is '

  + 'planet is — that is what an ellipse is. Both axes share one scale, so the shape on screen is the shape of the orbit.';

/* ================================================================== *
 *  view 2: the second law                                             *
 * ================================================================== */
const CAP2_FULL = 'PhET’s Second Law screen. The orbit is cut into N pieces that take equal times — equal steps of the '
  + 'MEAN anomaly M, not of the angle you see — and each piece has exactly the same area, πab/N. Press play and the '
  + 'sectors are erased and fill again as the planet sweeps them: slowly near apoapsis, in a rush past the star. The bars '
  + 'below are PhET’s swept-area chart; the dashed line is πab/N, which every finished sector reaches.';
const CAP2_SHORT = 'N sectors of equal time have equal area πab/N; press play and watch them fill. The bars are the areas.';
function drawSecond(ctx, W, H, M){
  const L = stageLayoutH(ctx, W, H, CAP2_FULL, CAP2_SHORT, 1, 0.34, 1);
  const st = M.st;
  const S = drawOrbitStage(ctx, W, H, M, L.main, {grid: st.grid, target: false, foci: false, string: false,
    axes: false, semiaxes: false, ecc: false, apsides: true, velocity: st.velocity, speedLab: st.speedLab,
    gravity: st.gravity, tape: st.tape, stopwatch: st.stopwatch, sectors: true, showA: false, showT: false});
  const c = M.sec;
  if(c){
    /* the area and time written on each sector */
    if(st.areaVals || st.timeVals){
      for(let k = 0; k < c.N; k++){
        if(c.frac[k] <= 1e-9) continue;          /* an empty sector has nothing to say */
        const nu = klSweepNu(M.el, c.N, k, 0.5), p = conicPoint(M.el, nu);
        const q = [p[0] * 0.62, p[1] * 0.62];
        if(!inWin(q, S.win)) continue;
        const txt = (st.areaVals ? sigf(c.areas[k], 3) + ' AU&sup2;' : '') + (st.areaVals && st.timeVals ? '  ' : '')
                  + (st.timeVals ? plain(yrStr(c.frac[k] * c.dt)) : '');
        lab(ctx, W, H, S.map.X(q[0]), S.map.Y(q[1]), txt, '#e8dcff', SM_FONT, 'center', 'middle');
      }
    }
    legendR(ctx, L.main, [[COL.orbit, 'the orbit'], [rgba(COL.sector, 0.35), 'a finished sector, πab/N'],
                          [rgba(COL.sectorOn, 0.35), 'the one being swept'], [COL.planet, 'the planet']]);
    /* the bars */
    const bb = L.bottom[0];
    const ymax = 1.3 * c.full;
    axesT(ctx, bb, -0.5, c.N - 0.5, 0, ymax, {title: titleFor(bb, 'swept area of each sector (PhET’s chart)', 'swept area'),
      xlab: 'period division', ylab: 'area (AU²)', nx: Math.min(c.N, 6), ny: 4,
      xticks: Array.from({length: c.N}, (_, i) => i), xfmt: v => String(Math.round(v) + 1)});
    const wbar = Math.min(46, bb.w / (c.N + 1) * 0.72);
    for(let k = 0; k < c.N; k++){
      const X = bb.x + bb.w * (k + 0.5) / c.N, hgt = bb.h * c.areas[k] / ymax;
      ctx.fillStyle = rgba(c.frac[k] >= 1 ? COL.sector : COL.sectorOn, 0.55);
      ctx.fillRect(X - wbar / 2, bb.y1 - hgt, wbar, hgt);
      ctx.strokeStyle = rgba('#ffffff', 0.25); ctx.lineWidth = 1;
      ctx.strokeRect(X - wbar / 2, bb.y1 - hgt, wbar, hgt);
    }
    polyline(ctx, bb, [-0.5, c.N - 0.5], [c.full, c.full], -0.5, c.N - 0.5, 0, ymax, COL.ref, 1.4, [5, 4]);
    labIn(ctx, W, H, bb, bb.x1 - 6, bb.y1 - bb.h * c.full / ymax - 7, 'πab/N = ' + sigf(c.full, 4) + ' AU²',
          COL.ref, SM_FONT, 'right', 'bottom');
  }
  drawCaption(ctx, L);
}

/* ================================================================== *
 *  views 3-5, the dispatch and the scene (drags live here)            *
 * ================================================================== */
const CAP3_FULL = 'PhET’s Third Law screen. The chart plots T^p against a^q for every semi-major axis the planet has '
  + 'visited (drag it to visit more); only a³ with T² gives a straight line through the origin, and its slope is '
  + '4π²/GM — the same for every body about this star and for nothing else. The orange curve is the law itself. '
  + 'Switch to log–log and every power becomes a straight line: T against a has slope 3/2 exactly, with PhET’s five '
  + 'target planets sitting on it. The panel on the right is that constant against the star’s mass.';
const CAP3_SHORT = 'T^p against a^q: only a³ with T² is a straight line. On log–log, T against a has slope 3/2.';
function drawThird(ctx, W, H, M){
  const L = stageLayoutH(ctx, W, H, CAP3_FULL, CAP3_SHORT, 2, 0.40, 1);
  const st = M.st, d = M.thd;
  drawOrbitStage(ctx, W, H, M, L.main, {grid: st.grid, target: true, foci: false, string: false,
    axes: false, semiaxes: false, ecc: false, apsides: false, velocity: st.velocity, speedLab: st.speedLab,
    gravity: st.gravity, tape: st.tape, stopwatch: st.stopwatch, sectors: false,
    showA: st.showA, showT: st.showT});
  if(!d){ drawCaption(ctx, L); return; }
  /* panel 1: the chart, linear in the chosen powers or log-log */
  const bb = L.bottom[0];
  if(!st.loglog){
    const xhi = Math.pow(d.aMax, st.pa), yhi = Math.pow(d.Tmax, st.pt);
    axesT(ctx, bb, 0, xhi, 0, yhi, {title: titleFor(bb, 'T' + (st.pt > 1 ? '^' + st.pt : '') + ' against a'
        + (st.pa > 1 ? '^' + st.pa : '') + (d.th.correct ? ' — a straight line' : ' — not a straight line'),
        'T^' + st.pt + ' vs a^' + st.pa), xlab: 'a^' + st.pa + ' (AU^' + st.pa + ')',
      ylab: 'T^' + st.pt + ' (yr^' + st.pt + ')', nx: 5, ny: 4});
    /* the law over the whole range (orange), then the visited trace (green) */
    const lx = [], ly = [];
    for(let i = 0; i <= 80; i++){
      const a = d.aMax * i / 80;
      lx.push(Math.pow(a, st.pa)); ly.push(Math.pow(periodOf(a, starMu(st.mass)), st.pt));
    }
    polyline(ctx, bb, lx, ly, 0, xhi, 0, yhi, COL.ref, 1.4, [5, 4]);
    if(d.pts.length) polyline(ctx, bb, d.pts.map(p => p[0]), d.pts.map(p => p[1]), 0, xhi, 0, yhi, COL.pos, 2.4);
    if(d.tgt) marker(ctx, bb, 0, xhi, 0, yhi, Math.pow(d.tgt.a, st.pa),
                     Math.pow(periodOf(d.tgt.a, starMu(1)), st.pt), COL.target);
    marker(ctx, bb, 0, xhi, 0, yhi, d.th.ap, d.th.Tp, COL.live);
    labIn(ctx, W, H, bb, bb.x + 8, bb.y + 10, 'T^' + st.pt + '/a^' + st.pa + ' = ' + fmt(d.th.ratio, 4)
          + (d.th.correct ? ' — constant' : ' — it drifts'), d.th.correct ? COL.pos : COL.warn, LAB_FONT, 'left', 'top');
    legendR(ctx, bb, [[COL.ref, 'the law'], [COL.pos, 'a visited'], [COL.live, 'now']]);
  } else {
    const xlo = Math.log10(0.2), xhi = Math.log10(Math.max(6, d.aMax));
    const ylo = Math.log10(periodOf(0.2, starMu(st.mass))), yhi = Math.log10(periodOf(Math.max(6, d.aMax), starMu(st.mass)));
    axesT(ctx, bb, xlo, xhi, ylo, yhi, {title: titleFor(bb, 'log T against log a — slope 3/2, whatever the star',
      'log T vs log a'), xlab: 'log₁₀ a (AU)', ylab: 'log₁₀ T (yr)', nx: 5, ny: 4});
    const lx = [], ly = [];
    for(let i = 0; i <= 60; i++){
      const la = xlo + (xhi - xlo) * i / 60;
      lx.push(la); ly.push(Math.log10(periodOf(Math.pow(10, la), starMu(st.mass))));
    }
    polyline(ctx, bb, lx, ly, xlo, xhi, ylo, yhi, COL.ref, 1.6);
    for(const p of d.planets){
      marker(ctx, bb, xlo, xhi, ylo, yhi, Math.log10(p.a), Math.log10(p.T), COL.struct);
      labIn(ctx, W, H, bb, bb.x + bb.w * (Math.log10(p.a) - xlo) / (xhi - xlo) + 6,
            bb.y1 - bb.h * (Math.log10(p.T) - ylo) / (yhi - ylo) - 6, p.name, COL.struct, SM_FONT, 'left', 'bottom');
    }
    marker(ctx, bb, xlo, xhi, ylo, yhi, Math.log10(M.el.a), Math.log10(M.el.T), COL.live);
    const slope = (Math.log10(periodOf(4, starMu(st.mass))) - Math.log10(periodOf(1, starMu(st.mass))))
                / (Math.log10(4) - Math.log10(1));
    labIn(ctx, W, H, bb, bb.x + 8, bb.y + 10, 'measured slope ' + fmt(slope, 4) + ' (3/2 = 1.5)', COL.pos, LAB_FONT, 'left', 'top');
    legendR(ctx, bb, [[COL.ref, 'T = a^(3/2)/√M'], [COL.struct, 'PhET’s planets'], [COL.live, 'this orbit']]);
  }
  /* panel 2: the constant belongs to the star */
  if(L.bottom.length > 1){
    const cb = L.bottom[1], mlo = 0.5, mhi = 2;
    const ylo = klConst(mhi) * 0.85, yhi = klConst(mlo) * 1.05;
    axesT(ctx, cb, mlo, mhi, ylo, yhi, {title: titleFor(cb, 'T²/a³ = 4π²/GM against the star’s mass',
      'T²/a³ vs mass'), xlab: 'star mass (M☉)', ylab: 'yr²/AU³', nx: 4, ny: 4});
    const mx = [], my = [];
    for(let i = 0; i <= 60; i++){ const m = mlo + (mhi - mlo) * i / 60; mx.push(m); my.push(klConst(m)); }
    polyline(ctx, cb, mx, my, mlo, mhi, ylo, yhi, COL.ref, 1.6);
    marker(ctx, cb, mlo, mhi, ylo, yhi, st.mass, M.el.T * M.el.T / Math.pow(M.el.a, 3), COL.live);
    labIn(ctx, W, H, cb, cb.x + 8, cb.y + 10, 'this orbit: T²/a³ = ' + fmt(M.el.T * M.el.T / Math.pow(M.el.a, 3), 5),
          COL.live, SM_FONT, 'left', 'top');
  }
  drawCaption(ctx, L);
}

    marker(ctx, cb, 0, xhi, 0, yhi, d.th.ap, d.th.Tp, COL.live);
    labIn(ctx, W, H, cb, cb.x + 8, cb.y + 10, 'T^' + st.pt + '/a^' + st.pa + ' = ' + fmt(d.th.ratio, 4),
          d.th.correct ? COL.pos : COL.warn, SM_FONT, 'left', 'top');
  }

/* ================================================================== *
 *  view 5: Kepler's equation (analysis)                               *
 * ================================================================== */
const CAP5_FULL = 'Not a PhET screen: where the motion in time comes from. Draw the auxiliary circle of radius a about the '
  + 'centre of the ellipse and project the planet up onto it; the angle at the centre is the ECCENTRIC anomaly E, the angle '
  + 'at the star is the TRUE anomaly ν, and the MEAN anomaly M = nt is where a body going round at constant rate would '
  + 'be. Kepler’s equation M = E − e sin E ties them together and cannot be solved for E in elementary functions, so '
  + 'Newton does it: the panel on the right shows f(E) = E − e sin E − M with the tangent steps from PhET’s own '
  + 'starting guess E = M, and where PhET stops (a step under 0.01 rad) against where this file stops (1e-15).';
const CAP5_SHORT = 'The auxiliary circle, the three anomalies, and Newton solving M = E − e sin E in front of you.';
function drawAnom(ctx, W, H, M){
  const L = stageLayoutH(ctx, W, H, CAP5_FULL, CAP5_SHORT, 2, 0.42, 1);
  const el = M.el, A = M.an, b = L.main;
  const map = orbitMap(b, M.R * 0.78), win = winOf(map, b);
  frame(ctx, b, COL.edge);
  if(!A){ lab(ctx, W, H, (b.x + b.x1) / 2, (b.y + b.y1) / 2, plain(M.warn || 'no orbit'), COL.warn,
              'italic 15px Georgia, serif', 'center', 'middle'); drawCaption(ctx, L); return; }
  const cw = Math.cos(el.w), sw = Math.sin(el.w), d = el.dir;
  const toW = (X, Y) => [X * cw - d * Y * sw, X * sw + d * Y * cw];          /* perifocal -> world */
  const C = toW(-el.c, 0);                                                    /* the ellipse centre */
  /* the auxiliary circle and the ellipse */
  const circ = [], ell = [];
  for(let i = 0; i <= 180; i++){
    const th = TAU * i / 180;
    circ.push(toW(-el.c + el.a * Math.cos(th), el.a * Math.sin(th)));
    ell.push(toW(-el.c + el.a * Math.cos(th), el.b * Math.sin(th)));
  }
  worldPathClip(ctx, map, circ, rgba(COL.struct, 0.55), 1.4, [5, 4], win);
  worldPathClip(ctx, map, ell, COL.orbit, 2, null, win);
  /* the three points: P on the ellipse, Q above it on the circle, and the mean point */
  const P = toW(-el.c + el.a * Math.cos(A.E), el.b * Math.sin(A.E));
  const Q = toW(-el.c + el.a * Math.cos(A.E), el.a * Math.sin(A.E));
  const Mp = toW(-el.c + el.a * Math.cos(A.M), el.a * Math.sin(A.M));
  seg(ctx, map, C, Q, COL.struct, 1.4);
  seg(ctx, map, P, Q, rgba(COL.struct, 0.6), 1.2, [3, 3]);
  seg(ctx, map, C, Mp, COL.ref, 1.4, [6, 4]);
  seg(ctx, map, [0, 0], P, COL.live, 1.6);
  /* the periapsis direction, from which all three angles are measured */
  const Pp = toW(el.a * (1 - el.e), 0);
  seg(ctx, map, C, toW(-el.c + el.a * 1.06, 0), rgba(COL.dim, 0.7), 1, [2, 3]);
  bodyDraw(ctx, map, 0, 0, el.star, COL.star, 4);
  dot(ctx, map.X(C[0]), map.Y(C[1]), 3.5, null, COL.struct, 1.4);
  dot(ctx, map.X(Q[0]), map.Y(Q[1]), 5, COL.struct, '#fff', 1.2);
  dot(ctx, map.X(Mp[0]), map.Y(Mp[1]), 5, COL.ref, '#fff', 1.2);
  bodyDraw(ctx, map, P[0], P[1], massToRadius(PHET.PLANET), COL.planet, 4);
  lab(ctx, W, H, map.X(Q[0]) + 8, map.Y(Q[1]) - 6, 'E = ' + plain(degStr(A.E)), COL.struct, LAB_FONT);
  lab(ctx, W, H, map.X(Mp[0]) + 8, map.Y(Mp[1]) + 8, 'M = ' + plain(degStr(A.M)), COL.ref, LAB_FONT);
  lab(ctx, W, H, map.X(P[0]) + 8, map.Y(P[1]) + 10, 'ν = ' + plain(degStr(A.nu)), COL.live, LAB_FONT);
  lab(ctx, W, H, map.X(Pp[0]), map.Y(Pp[1]) - 8, 'periapsis', '#ffd24a', SM_FONT, 'center', 'bottom');
  lab(ctx, W, H, b.x + 6, b.y + 8, titleFor(b, 'the auxiliary circle: the planet on the ellipse, projected to the circle of radius a',
      'the auxiliary circle'), '#aeb6c6', 'italic 13px Georgia, serif', 'left', 'top');
  lab(ctx, W, H, b.x1 - 6, b.y + 8, plain(scaleNote(map)) + ' — e = ' + fmt(el.e, 3) + ', t = ' + plain(yrStr(A.t)),
      COL.dim, SM_FONT, 'right', 'top');
  legendR(ctx, b, [[COL.orbit, 'the orbit'], [COL.struct, 'auxiliary circle, E'], [COL.ref, 'the mean point, M'],
                   [COL.live, 'the planet, ν']]);
  /* panel 1: the three anomalies over one period */
  const bb = L.bottom[0];
  axesT(ctx, bb, 0, 1, 0, 360, {title: titleFor(bb, 'the three anomalies over one period', 'anomalies over a period'),
    xlab: 't / T', ylab: 'degrees', nx: 5, ny: 4});
  const fx = A.curve.map(c2 => c2[0] / TAU);
  polyline(ctx, bb, fx, A.curve.map(c2 => c2[0] / DEG), 0, 1, 0, 360, COL.ref, 1.6);
  polyline(ctx, bb, fx, A.curve.map(c2 => c2[1] / DEG), 0, 1, 0, 360, COL.struct, 1.6);
  /* nu runs 0 -> 360 over one period and needs no wrap; taking it mod 360 put a false
     vertical line down the right-hand edge of the panel */
  polyline(ctx, bb, fx, A.curve.map(c2 => c2[2] / DEG), 0, 1, 0, 360, COL.live, 1.6);
  marker(ctx, bb, 0, 1, 0, 360, A.M / TAU, A.M / DEG, COL.ref);
  marker(ctx, bb, 0, 1, 0, 360, A.M / TAU, A.E / DEG, COL.struct);
  marker(ctx, bb, 0, 1, 0, 360, A.M / TAU, A.nu / DEG, COL.live);
  legendR(ctx, bb, [[COL.ref, 'M (uniform)'], [COL.struct, 'E'], [COL.live, 'ν']]);
  /* panel 2: Newton on f(E) */
  if(L.bottom.length > 1){
    const cb = L.bottom[1];
    const Elo = Math.max(0, Math.min(A.E, A.M) - 0.9), Ehi = Math.max(A.E, A.M) + 0.9;
    const fs = [], xs = [];
    let fmin = 0, fmax = 0;
    for(let i = 0; i <= 80; i++){
      const E2 = Elo + (Ehi - Elo) * i / 80, f = E2 - el.e * Math.sin(E2) - A.M;
      xs.push(E2); fs.push(f); fmin = Math.min(fmin, f); fmax = Math.max(fmax, f);
    }
    const pad = 0.12 * (fmax - fmin || 1);
    axesT(ctx, cb, Elo, Ehi, fmin - pad, fmax + pad, {title: titleFor(cb, 'Newton on f(E) = E − e sin E − M',
      'Newton on f(E)'), xlab: 'E (rad)', ylab: 'f(E)', nx: 4, ny: 4});
    polyline(ctx, cb, [Elo, Ehi], [0, 0], Elo, Ehi, fmin - pad, fmax + pad, '#3a4152', 1, [3, 3]);
    polyline(ctx, cb, xs, fs, Elo, Ehi, fmin - pad, fmax + pad, COL.pos, 2);
    for(let k = 0; k < A.trace.length - 1; k++){
      const E0 = A.trace[k], f0 = E0 - el.e * Math.sin(E0) - A.M, E1 = A.trace[k + 1];
      /* the tangent to the axis, then the drop to the curve: the staircase Newton walks */
      polyline(ctx, cb, [E0, E1], [f0, 0], Elo, Ehi, fmin - pad, fmax + pad, rgba(COL.ref, 0.8), 1.1);
      polyline(ctx, cb, [E1, E1], [0, E1 - el.e * Math.sin(E1) - A.M], Elo, Ehi, fmin - pad, fmax + pad, rgba(COL.ref, 0.45), 1, [3, 3]);
      marker(ctx, cb, Elo, Ehi, fmin - pad, fmax + pad, E0, f0, k === A.stop + 1 ? COL.warn : COL.ref);
    }
    marker(ctx, cb, Elo, Ehi, fmin - pad, fmax + pad, A.E, 0, COL.live);
    labIn(ctx, W, H, cb, cb.x + 8, cb.y + 10, 'from E₀ = M: ' + (A.stop + 1) + ' steps to PhET’s 0.01 rad, '
          + A.it + ' to 1e-15', COL.dim, SM_FONT, 'left', 'top');
  }
  drawCaption(ctx, L);
}

/* ================================================================== *
 *  dispatch and the scene                                             *
 * ================================================================== */
function drawView(ctx, W, H, M){
  LEGEND_RECTS = []; POLY_SEGS = []; LABELS = [];
  ctx.fillStyle = '#070b18'; ctx.fillRect(0, 0, W, H);
  if(M.view === 'first') drawFirst(ctx, W, H, M);
  else if(M.view === 'second') drawSecond(ctx, W, H, M);
  else if(M.view === 'third') drawThird(ctx, W, H, M);
  else if(M.view === 'all') drawAll(ctx, W, H, M);
  else drawAnom(ctx, W, H, M);
}
/* the stage box each view drags in (the same layout the view used) */
function mainBox(ctx, W, H, view){
  if(view === 'first') return stageLayoutH(ctx, W, H, CAP1_FULL, CAP1_SHORT, 0, 0, 0).main;
  if(view === 'second') return stageLayoutH(ctx, W, H, CAP2_FULL, CAP2_SHORT, 1, 0.34, 1).main;
  if(view === 'third') return stageLayoutH(ctx, W, H, CAP3_FULL, CAP3_SHORT, 2, 0.40, 1).main;
  if(view === 'all') return stageLayoutH(ctx, W, H, CAP4_FULL, CAP4_SHORT, 2, 0.36, 1).main;
  return stageLayoutH(ctx, W, H, CAP5_FULL, CAP5_SHORT, 2, 0.42, 1).main;
}
function dragsHere(view){ return view !== 'anom'; }
function makeScene(canvas){
  const S = {st: ST, W: 1100, H: 712};
  S.model = buildModel;
  S.draw = function(){ const ctx = canvas.getContext('2d'); drawView(ctx, S.W, S.H, buildModel()); };
  S.step = function(){ const moved = runStep(); if(moved && ST.view === 'anom'){
      const el = klOrbit(ST.px, ST.py, ST.vx, ST.vy, ST.mass, ST.circular);
      if(el.allowed) ST.mfrac = ((SIM.t / el.T) % 1 + 1) % 1; }
    return moved; };
  /* the drags: the planet, the tip of its velocity arrow, and the two ends of the tape */
  S.pointer = function(type, x, y){
    if(type === 'up'){ const had = DRAGK.what !== null; DRAGK.what = null; return had; }
    if(!dragsHere(ST.view)) return false;
    const ctx = canvas.getContext('2d');
    const b = mainBox(ctx, S.W, S.H, ST.view), map = orbitMap(b, viewRadius());
    const M = buildModel(), now = M.now;
    if(type === 'down'){
      const PX = map.X(now.x), PY = map.Y(now.y);
      if(ST.velocity){
        const TX = PX + now.vx * VSCALE, TY = PY - now.vy * VSCALE;
        if(Math.hypot(TX - x, TY - y) <= 14){ DRAGK.what = 'vel'; ST.running = false; return true; }
      }
      if(Math.hypot(PX - x, PY - y) <= 16){ DRAGK.what = 'planet'; ST.running = false; return true; }
      if(ST.tape){ const t = tapeHit(map, SIM.tape, x, y); if(t){ DRAGK.what = t; return true; } }
      return false;
    }
    if(type === 'move' && DRAGK.what){
      const wx = map.wx(x), wy = map.wy(y);
      if(DRAGK.what === 'planet'){
        const R = viewRadius(), rmin = starRadius(ST.mass) * 1.4;
        let px = clamp(wx, -R, R), py = clamp(wy, -R, R);
        const r = Math.hypot(px, py);
        /* dropped exactly on the star there is no direction to push along: keep the one the
           planet already had (PhET nudges it to (0.01, 0) instead) */
        if(r < rmin){
          if(r > 1e-12){ const s = rmin / r; px *= s; py *= s; }
          else { const r0 = Math.hypot(ST.px, ST.py) || 1; px = rmin * ST.px / r0; py = rmin * ST.py / r0; }
        }
        ST.px = px; ST.py = py; SIM.t = 0; SIM.sweep = {erased: false, tErase: 0}; SIM.periodTrace = null;
        traceNote(klOrbit(ST.px, ST.py, ST.vx, ST.vy, ST.mass, ST.circular));
        return true;
      }
      if(DRAGK.what === 'vel'){
        if(ST.circular) return false;                 /* held circular: the arrow is not free */
        const PX = map.X(ST.px), PY = map.Y(ST.py);
        ST.vx = (x - PX) / VSCALE; ST.vy = -(y - PY) / VSCALE;
        SIM.t = 0; SIM.sweep = {erased: false, tErase: 0}; SIM.periodTrace = null;
        traceNote(klOrbit(ST.px, ST.py, ST.vx, ST.vy, ST.mass, ST.circular));
        return true;
      }
      if(DRAGK.what === 'tapeA'){ SIM.tape.ax = wx; SIM.tape.ay = wy; return true; }
      if(DRAGK.what === 'tapeB'){ SIM.tape.bx = wx; SIM.tape.by = wy; return true; }
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *

  const errEl = document.getElementById('errbox');
  const S = makeScene(canvas), st = S.st;
  let dirty = false;

  function fail(e){ errEl.style.display = 'block'; errEl.textContent = String(e && e.stack || e); }
  window.addEventListener('error', ev => fail(ev.error || ev.message));

  function setView(k){
    if(st.view !== k) st.view = k;
    [].forEach.call(tabsEl.children, (b, i) => b.className = TABS[i][0] === st.view ? 'active' : '');
    syncChips(); syncPanel(); dirty = true; refresh();
  }

  });

  const rows = {};

    const val = h('span', {class: 'val'});
    const rowEl = h('div', {class: 'sliderrow'}, h('label', null, lab2), inp, val);
    const sync = () => { inp.value = st[key]; val.textContent = fmtf(st[key]); };
    inp.addEventListener('input', () => {
      st[key] = parseFloat(inp.value);
      if(onchg) onchg();
      val.textContent = fmtf(st[key]); syncPanel(); dirty = true; refresh();
    });
    rows[key] = {row: rowEl, sync, inp}; sync(); return rowEl;
  }
  function checkbox(key, lab2, onchg){
    const inp = h('input', {type: 'checkbox'}); inp.checked = st[key];
    const el = h('label', null, inp, lab2);
    inp.addEventListener('change', () => {
      st[key] = inp.checked; if(onchg) onchg(); syncPanel(); dirty = true; refresh();
    });
    rows['cb_' + key] = {row: el, inp, sync: () => { inp.checked = st[key]; }};
    return el;
  }
  function chipRow(list, key, onPick){
    const wrapEl = h('div', {class: 'chips'});
    list.forEach(o => {
      const c = h('button', {class: 'chip' + (st[key] === o.id ? ' on' : ''), html: o.name, onclick: () => {
        st[key] = o.id; if(onPick) onPick(o);
        [].forEach.call(wrapEl.children, (b, i) => b.className = 'chip' + (list[i].id === st[key] ? ' on' : ''));
        syncPanel(); dirty = true; refresh(); }});
      wrapEl.appendChild(c);
    });
    return wrapEl;
  }
  const CHIPROWS = [];
  function trackChips(g, list, key){ CHIPROWS.push([g, list, key]); }
  function enable(key, on){
    const r = rows[key]; if(!r) return;
    if(r.inp) r.inp.disabled = !on;
    r.row.style.opacity = on ? '1' : '0.42';
  }
  /* any change to the orbit restarts its clock, as PhET's does when the user takes hold */
  const reOrbit = () => { SIM.t = 0; ST.running = false; SIM.sweep = {erased: false, tErase: 0};
                          SIM.periodTrace = null; traceNote(klOrbit(ST.px, ST.py, ST.vx, ST.vy, ST.mass, ST.circular)); };

  const gStar = h('div', {class: 'grp'}, h('h3', null, 'the star'));
  gStar.appendChild(slider('mass', 'mass, M☉', 0.5, 2, 0.01, v => fmt(v, 2) + (v === 1 ? ' (our Sun)' : ''), () => {
    /* PhET snaps the slider to our Sun within 5 % */
    if(Math.abs(st.mass - 1) < 0.05) st.mass = 1;
    traceReset(); reOrbit();
  }));
  gStar.appendChild(h('div', {class: 'checks'}, checkbox('circular', 'hold the orbit circular', reOrbit)));
  const starTag = h('div', {class: 'tag'}); gStar.appendChild(starTag);

  const gTarget = h('div', {class: 'grp'}, h('h3', null, 'target orbit'));
  const tgtChips = chipRow(TARGETS, 'target'); gTarget.appendChild(tgtChips); trackChips(gTarget, TARGETS, 'target');
  gTarget.appendChild(h('div', {class: 'btnrow'}, h('button', {onclick: () => {
    if(st.target === 'none' || st.mass !== 1) return;
    const t = targetById(st.target);
    st.px = t.a * (1 - t.e); st.py = 0; st.vx = 0;
    st.vy = auYrToKms(Math.sqrt(starMu(st.mass) * (1 + t.e) / (t.a * (1 - t.e))));
    st.circular = false; reOrbit(); traceReset(); syncPanel(); dirty = true; refresh();
  }}, 'put the planet on it')));
  const tgtTag = h('div', {class: 'tag'}); gTarget.appendChild(tgtTag);

  const gFirst = h('div', {class: 'grp'}, h('h3', null, 'the ellipse'));
  gFirst.appendChild(h('div', {class: 'checks'},
    checkbox('foci', 'foci'), checkbox('string', 'string: d₁ + d₂'), checkbox('axes', 'axes'),
    checkbox('semiaxes', 'semiaxes a, b'), checkbox('ecc', 'eccentricity c = ae')));
  const firstTag = h('div', {class: 'tag'}); gFirst.appendChild(firstTag);

  const gSecond = h('div', {class: 'grp'}, h('h3', null, 'equal areas'));
  gSecond.appendChild(slider('div', 'period divisions', PHET.DIV_MIN, PHET.DIV_MAX, 1, v => fmt(v, 0)));
  gSecond.appendChild(h('div', {class: 'checks'},
    checkbox('areaVals', 'area values'), checkbox('timeVals', 'time values'),
    checkbox('apo', 'apoapsis'), checkbox('peri', 'periapsis')));
  gSecond.appendChild(h('div', {class: 'btnrow'}, h('button', {onclick: () => { eraseSectors(); dirty = true; refresh(); }}, 'erase the sectors')));
  const secondTag = h('div', {class: 'tag'}); gSecond.appendChild(secondTag);

  const gSwept = h('div', {class: 'grp'}, h('h3', null, 'sectors'),
    h('div', {class: 'checks'}, checkbox('swept', 'swept sectors')));

  const gThird = h('div', {class: 'grp'}, h('h3', null, 'the chart'));
  gThird.appendChild(h('div', {class: 'tag'}, 'the power on a'));
  const paChips = chipRow(POWERS, 'pa'); gThird.appendChild(paChips); trackChips(gThird, POWERS, 'pa');
  gThird.appendChild(h('div', {class: 'tag'}, 'the power on T'));
  const ptChips = chipRow(POWERS, 'pt'); gThird.appendChild(ptChips); trackChips(gThird, POWERS, 'pt');
  gThird.appendChild(h('div', {class: 'checks'},
    checkbox('loglog', 'log–log axes'), checkbox('showA', 'semi-major axis on the orbit'),
    checkbox('showT', 'period trace')));
  gThird.appendChild(h('div', {class: 'btnrow'}, h('button', {onclick: () => { traceReset(); dirty = true; refresh(); }}, 'forget the trace')));
  const thirdTag = h('div', {class: 'tag'}); gThird.appendChild(thirdTag);

  const gAnom = h('div', {class: 'grp'}, h('h3', null, 'where in the orbit'));
  gAnom.appendChild(slider('mfrac', 't through one period', 0, 0.999, 0.001, v => fmt(v, 3) + ' T', () => {
    const el = klOrbit(st.px, st.py, st.vx, st.vy, st.mass, st.circular);
    if(el.allowed) SIM.t = st.mfrac * el.T;
  }));
  const anomTag = h('div', {class: 'tag'}); gAnom.appendChild(anomTag);

  const gShow = h('div', {class: 'grp'}, h('h3', null, 'show'));
  gShow.appendChild(h('div', {class: 'checks'},
    checkbox('velocity', 'velocity arrow (drag its tip)'), checkbox('speedLab', 'speed'),
    checkbox('gravity', 'gravity force'), checkbox('grid', 'grid, 1 AU'),
    checkbox('tape', 'measuring tape'), checkbox('stopwatch', 'stopwatch')));
  gShow.appendChild(slider('fpow', 'gravity arrows ×10^n', -2, 4, 1, v => '×10^' + fmt(v, 0)));
  gShow.appendChild(h('div', {class: 'btnrow'},
    h('button', {onclick: () => { SIM.swRun = !SIM.swRun; dirty = true; refresh(); }}, 'stopwatch start/stop'),
    h('button', {onclick: () => { SIM.sw = 0; SIM.swRun = false; dirty = true; refresh(); }}, 'zero it')));
  const showTag = h('div', {class: 'tag'}); gShow.appendChild(showTag);

  const gClock = h('div', {class: 'grp'}, h('h3', null, 'the clock'));
  gClock.appendChild(h('div', {class: 'checks'}, checkbox('running', 'time runs', () => { if(st.running) onPlay(); })));
  const speedChips = chipRow(SPEEDS, 'speed'); gClock.appendChild(speedChips); trackChips(gClock, SPEEDS, 'speed');
  const zoomChips = chipRow(ZOOMS, 'zoom'); gClock.appendChild(zoomChips); trackChips(gClock, ZOOMS, 'zoom');
  gClock.appendChild(h('div', {class: 'btnrow'},
    h('button', {onclick: () => { const was = st.running; st.running = true; runStep(); st.running = was; dirty = true; refresh(); }}, 'step'),
    h('button', {onclick: () => { SIM.t = 0; st.running = false; SIM.sweep = {erased: false, tErase: 0};
                                  SIM.periodTrace = null; dirty = true; refresh(); }}, 'restart'),
    h('button', {onclick: () => { const v = st.view; Object.assign(st, DEFAULTS); st.view = v; simReset();
                                  syncChips(); syncPanel(); dirty = true; refresh(); }}, 'reset all')));
  const clockTag = h('div', {class: 'tag'}); gClock.appendChild(clockTag);

  const gInfo = h('div', {class: 'grp'}, h('h3', null, 'what you are looking at'), h('div', {id: 'info'}),
    h('div', {class: 'src', html: 'Remake of PhET Interactive Simulations&rsquo; <b>Kepler&rsquo;s Laws</b> '
      + '(University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. '
      + 'Measured: AU = 149,597,870.7 km (IAU 2012), the Julian year, GM<sub>&#9737;</sub> = 1.32712440042e20 m&sup3;/s&sup2; '
      + '(Wikipedia, &ldquo;Standard gravitational parameter&rdquo;). PhET&rsquo;s own values (G = 4.4567, our Sun = 200&times;10&sup2;&#8312; kg, '
      + 'the star radius rule, the target orbits, the 0.01-rad Newton tolerance) are read out of its published build and named as PhET&rsquo;s. '
      + 'Everything else is computed here and pinned in selfTest to build/keplers-laws/derive.py.'}));
  const gPhys = h('div', {class: 'grp'}, h('h3', null, 'the physics'), h('div', {id: 'phys'}));
  [gStar, gTarget, gFirst, gSecond, gSwept, gThird, gAnom, gShow, gClock, gInfo, gPhys].forEach(g => panel.appendChild(g));
  const infoEl = gInfo.querySelector('#info'), physEl = gPhys.querySelector('#phys');

  function syncChips(){
    for(const [g, list, key] of CHIPROWS){
      const cws = g.querySelectorAll('.chips');
      for(const cw of cws){
        if(cw.children.length !== list.length) continue;
        let match = 0;
        for(let i = 0; i < list.length; i++) if(cw.children[i].textContent === plain(String(list[i].name))) match++;
        if(match === list.length)
          [].forEach.call(cw.children, (b, i) => b.className = 'chip' + (list[i].id === ST[key] ? ' on' : ''));
      }
    }
  }
  function syncPanel(){
    const v = st.view, el = klOrbit(st.px, st.py, st.vx, st.vy, st.mass, st.circular);
    gTarget.hidden = !(v === 'first' || v === 'third' || v === 'all');
    gFirst.hidden = !(v === 'first' || v === 'all');
    gSecond.hidden = !(v === 'second' || v === 'all');
    gSwept.hidden = (v !== 'all');
    gThird.hidden = !(v === 'third' || v === 'all');
    gAnom.hidden = (v !== 'anom');
    for(const k in rows) rows[k].sync();
    enable('cb_string', st.foci);
    enable('cb_semiaxes', st.axes);
    enable('cb_apo', el.allowed && el.e >= PHET.E_ROUND);
    enable('cb_peri', el.allowed && el.e >= PHET.E_ROUND);
    enable('fpow', st.gravity);
    enable('mfrac', el.allowed);
    [].forEach.call(tgtChips.children, c => { c.style.opacity = st.mass === 1 ? '1' : '0.42'; });
    starTag.innerHTML = 'GM = ' + sigf(starMu(st.mass), 6) + ' AU&sup3;/yr&sup2;; the star is drawn to PhET&rsquo;s radius rule, '
      + sigf(starRadius(st.mass), 3) + ' AU. The planet&rsquo;s own mass never enters the orbit.';
    tgtTag.innerHTML = st.mass === 1 ? 'PhET&rsquo;s target orbits: drag the planet until the green orbit lies on the grey one, or press the button.'
      : 'PhET allows a target orbit only for our Sun; set the mass back to 1.00 to use one.';
    firstTag.innerHTML = 'the string is the definition: the sum of the distances to the two foci is 2a everywhere on the ellipse.';
    secondTag.innerHTML = 'the cuts are equal steps of the MEAN anomaly, so every sector takes T/N = ' + plain(yrStr(el.allowed ? el.T / st.div : 0)) + '.';
    thirdTag.innerHTML = st.pa === 3 && st.pt === 2 ? 'a&sup3; with T&sup2;: a straight line, slope 4&pi;&sup2;/GM.'
      : 'try a&sup3; with T&sup2; — no other pair of powers is a straight line through the origin.';
    anomTag.innerHTML = 'the slider is the clock: it moves the planet through one period, and the construction follows.';
    showTag.innerHTML = 'the velocity arrow is ' + fmt(VSCALE, 1) + ' px per km/s; the gravity arrow is 60 px at 1 AU, times the power.';
    clockTag.innerHTML = 'space runs and pauses &nbsp; <b>r</b> restarts &nbsp; 1&ndash;5 switch views. One frame is '
      + PHET.FRAME_YR.toExponential(3) + ' yr at normal speed (PhET&rsquo;s rate).';
  }

  function refresh(){
    try{
      const M = S.model();
      roEl.innerHTML = readoutHTML(M);
      eqEl.innerHTML = eqbarHTML(M);
      tagEl.innerHTML = tagHTML(M);
      hintEl.textContent = dragsHere(st.view) ? 'drag the planet or the tip of its velocity arrow · space runs · 1–5 switch views'
                                              : 'the slider scrubs one period · space runs · 1–5 switch views';
      infoEl.innerHTML = INFO[st.view] || '';
      physEl.innerHTML = DERIV[st.view] || '';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    const r = canvas.getBoundingClientRect();
    if(S.pointer('down', e.clientX - r.left, e.clientY - r.top)){ canvas.classList.add('dragging'); dirty = true; syncPanel(); refresh(); }
  });
  canvas.addEventListener('pointermove', e => {
    if(!canvas.classList.contains('dragging') && e.buttons === 0) return;
    const r = canvas.getBoundingClientRect();
    if(S.pointer('move', e.clientX - r.left, e.clientY - r.top)){ dirty = true; syncPanel(); roEl.innerHTML = readoutHTML(S.model()); }
  });
  const up = () => { canvas.classList.remove('dragging'); if(S.pointer('up', 0, 0)){ dirty = true; refresh(); } };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);

  window.addEventListener('keydown', e => {
    if(e.key === ' '){ e.preventDefault(); setRunning(!st.running); syncPanel(); dirty = true; refresh(); }
    else if(e.key === 'r'){ SIM.t = 0; st.running = false; SIM.sweep = {erased: false, tErase: 0};
                            SIM.periodTrace = null; syncPanel(); dirty = true; refresh(); }
    else if(e.key >= '1' && e.key <= String(TABS.length)) setView(TABS[+e.key - 1][0]);
  });

  function resize(){
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    S.W = r.width; S.H = r.height;
  }
  window.addEventListener('resize', () => { resize(); dirty = true; refresh(); });

  let frameN = 0;
  function frameLoop(){
    frameN++;
    const advanced = S.step();
    if(advanced || dirty){
      dirty = false;
      try{
        S.draw();
        if(advanced && ST.view === 'anom' && rows.mfrac) rows.mfrac.sync();
        if(advanced && frameN % 10 === 0) roEl.innerHTML = readoutHTML(S.model());
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  simReset(); resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W, H){
  const ops = []; let Mx = [1, 0, 0, 1, 0, 0]; const stack = [];
  const st2 = {font: '10px x', align: 'left', base: 'alphabetic'};
  const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3],
                         A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];
  const app = (x, y) => [Mx[0] * x + Mx[2] * y + Mx[4], Mx[1] * x + Mx[3] * y + Mx[5]];
  const fsz = () => { const m = /([\d.]+)px/.exec(st2.font); return m ? parseFloat(m[1]) : 10; };
  let pend = null;
  const ctx = {ops,
    save(){ stack.push({M: Mx.slice(), f: st2.font, a: st2.align, b: st2.base}); },
    restore(){ const s = stack.pop(); if(s){ Mx = s.M; st2.font = s.f; st2.align = s.a; st2.base = s.b; } },
    translate(x, y){ Mx = mul(Mx, [1, 0, 0, 1, x, y]); },
    rotate(r){ const c = Math.cos(r), s3 = Math.sin(r); Mx = mul(Mx, [c, s3, -s3, c, 0, 0]); },
    scale(x, y){ Mx = mul(Mx, [x, 0, 0, y, 0, 0]); }, setTransform(){ Mx = [1, 0, 0, 1, 0, 0]; },
    beginPath(){ pend = null; }, moveTo(){}, lineTo(){ if(!pend) pend = {n: 0}; }, closePath(){},
    rect(){ if(!pend) pend = {n: 0}; pend.n++; }, arc(){ if(!pend) pend = {n: 0}; pend.n++; },
    fill(){ if(pend) ops.push({op: 'fill', n: pend.n || 1}); },
    stroke(){ ops.push({op: 'stroke'}); }, clip(){},
    fillRect(x, y, w, hh){ ops.push({op: 'fill', n: 1, bb: [x, y, x + w, y + hh], style: ctx.fillStyle}); },
    strokeRect(){ ops.push({op: 'stroke'}); }, clearRect(){},
    fillText(t, x, y){
      const w = ('' + t).length * fsz() * 0.52, fh = fsz() * 1.15;
      const lx = st2.align === 'center' ? x - w / 2 : (st2.align === 'right' ? x - w : x);
      const ly = st2.base === 'top' ? y : (st2.base === 'middle' ? y - fh / 2 : (st2.base === 'bottom' ? y - fh : y - fh * 0.8));
      const cs = [[lx, ly], [lx + w, ly], [lx, ly + fh], [lx + w, ly + fh]].map(c2 => app(c2[0], c2[1]));
      const xs = cs.map(c2 => c2[0]), ys = cs.map(c2 => c2[1]);
      ops.push({op: 'text', t: '' + t, bb: [Math.min.apply(0, xs), Math.min.apply(0, ys), Math.max.apply(0, xs), Math.max.apply(0, ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width: ('' + t).length * fsz() * 0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; }
  };
  let _fill = '#000';
  Object.defineProperty(ctx, 'fillStyle', {get: () => _fill, set: v => _fill = '' + v});
  for(const kk of ['strokeStyle', 'lineWidth', 'globalAlpha', 'lineJoin', 'lineCap']){ let v2; Object.defineProperty(ctx, kk, {get: () => v2, set: x => v2 = x}); }
  Object.defineProperty(ctx, 'font', {get: () => st2.font, set: v => st2.font = '' + v});
  Object.defineProperty(ctx, 'textAlign', {get: () => st2.align, set: v => st2.align = '' + v});
  Object.defineProperty(ctx, 'textBaseline', {get: () => st2.base, set: v => st2.base = '' + v});
  return ctx;
}

    name + ' [' + a + ' vs ' + b + ', rel ' + (Math.abs(a - b) / Math.abs(b || 1)).toExponential(2) + ']');
