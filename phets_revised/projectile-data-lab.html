/* ================================================================== *
 *  view 4: the sampling — PhET's Sampling screen                      *
 * ================================================================== */
function sampCaption(M,rTxt){
  const se=M.exact.sd/Math.sqrt(M.st.pN);
  return {full:'A sample is n launches, and it contributes ONE point to the histogram: its mean. With n = '+M.st.pN
            +' the exact standard error is σ/√n = '+fmt(M.exact.sd,3)+'/√'+M.st.pN+' = '+fmt(se,3)
            +' m, against σ = '+fmt(M.exact.sd,3)+' m for a single shot. The four thumbnails below are the same launcher at every sample size, drawn on one axis so the narrowing is a picture rather than a claim — and each carries the sample size it belongs to.'+aspectNote(rTxt),
          short:'One dot per sample, and the dot is its mean: σ/√n = '+fmt(se,3)+' m at n = '+M.st.pN+'.'+aspectNote(rTxt)};
}
function drawSampleHist(ctx,b,M,F,size,opt){
  const o=opt||{}, means=sampleMeans(F);
  const se=M.exact.sd/Math.sqrt(size);
  /* the thumbnails share ONE axis (that is the comparison); the main panel
     fits its own n, or an n = 40 distribution is a sliver three pixels wide */
  const half=o.own?4.6*se:4.2*M.exact.sd;
  const lo=M.exact.mean-half, hi=M.exact.mean+half;
  const w=o.w||0.5;
  const H=pdlHistogram(means,w);
  const ymax=Math.max(4,Math.ceil(Math.max(4,H.max)*1.2));
  const col=o.col||COL.sizes[PDL.SIZES.indexOf(size)];
  axesT(ctx,b,lo,hi,0,ymax,{title:o.title,xlab:o.xlab,ylab:o.ylab,nx:o.nx||5,ny:3});
  const px=x=>b.x+b.w*(x-lo)/(hi-lo), py=y=>b.y1-b.h*y/ymax;
  const bw=b.w*w/(hi-lo);
  for(let i=0;i<H.counts.length;i++){
    const c=H.counts[i]; if(!c) continue;
    const X0=Math.max(b.x,px((H.lo+i)*w)), X1=Math.min(b.x1,px((H.lo+i+1)*w));
    if(X1<=X0) continue;
    ctx.fillStyle=rgba(col,0.75); ctx.fillRect(X0,py(c),X1-X0,b.y1-py(c));
    POLY_SEGS.push(X0,py(c),X1,py(c));
  }
  /* the exact sampling law: a normal of sd σ/√n scaled to the counts */
  if(o.showNormal!==false&&means.length>2){
    const xs=[], ys=[];
    for(let i=0;i<=160;i++){ const x=lo+(hi-lo)*i/160; xs.push(x);
      ys.push(means.length*w*Math.exp(-0.5*Math.pow((x-M.exact.mean)/se,2))/(se*Math.sqrt(2*Math.PI))); }
    pl(ctx,b,xs,ys,lo,hi,0,ymax,COL.ref,1.6);
  }
  if(o.showSe!==false){
    const a=px(M.exact.mean-se), c=px(M.exact.mean+se), y=b.y+9;
    ctx.strokeStyle=COL.ref; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(a,y); ctx.lineTo(c,y); ctx.moveTo(a,y-4); ctx.lineTo(a,y+4);
    ctx.moveTo(c,y-4); ctx.lineTo(c,y+4); ctx.stroke();
  }
  const mx=px(M.exact.mean);
  ctx.strokeStyle=rgba(COL.ref,0.8); ctx.lineWidth=1.2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(mx,b.y); ctx.lineTo(mx,b.y1); ctx.stroke(); ctx.setLineDash([]);
  return {px,py,lo,hi,ymax,se};
}
function drawSamplingView(ctx,W,H,M){
  const ph=sampCaption(M,'1.00');
  const L=labStage(ctx,W,H,ph.full+' (the four-sample-size row needs a wider stage than this one.)',
    ph.short+' (the four-sample-size row needs a wider stage than this one.)',
    {histFrac:0.44,nBottom:4,fieldWant:fieldWantH(M)});
  ph.full=ph.full+' (the four-sample-size row needs a wider stage than this one.)';
  const map=drawField(ctx,L.field,M,{showExactMean:true});
  /* the current sample's own mean, on the field */
  const F=M.F;
  if(F.landed.length){
    const xs=F.landed.slice(-(F.size||1)).map(p=>p.x), m=pdlMean(xs);
    const X=map.X(m);
    ctx.strokeStyle=COL.live; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(X,map.y0+4); ctx.lineTo(X,map.y0-26); ctx.stroke();
    lab(ctx,W,H,X,map.y0-29,'x̄ = '+fmt(m,2),COL.live,LAB_FONT,'center','bottom');
  }
  drawSampleHist(ctx,L.hist,M,F,M.st.pN,{title:'the sample means, n = '+M.st.pN,
    xlab:'sample mean x̄, m',ylab:'samples',w:Math.max(0.1,Math.round(M.exact.sd/Math.sqrt(M.st.pN)/3*4)/4),
    own:true,showNormal:M.st.showSe,showSe:M.st.showSe,nx:6});
  const w=worldOf('sampling');
  PDL.SIZES.forEach((n,i)=>{
    if(!L.bottom[i]) return;
    const key=M.st.pLau+'/'+n;
    let G=w.fields[key];
    if(!G){ G=fieldMake(SEEDS.sampling+M.st.pLau*100+n,cfgMystery(M.st.pLau)); G.size=n; sampleBatch(G,n,30); w.fields[key]=G; }
    drawSampleHist(ctx,L.bottom[i],M,G,n,{title:'n = '+n,xlab:null,ylab:null,w:1,
      showNormal:M.st.showSe,showSe:M.st.showSe,nx:3,col:COL.sizes[i]});
    lab(ctx,W,H,L.bottom[i].x+3,L.bottom[i].y1-9,'σ/√n = '+fmt(M.exact.sd/Math.sqrt(n),2)+' m',
        COL.ref,SM_FONT,'left','bottom');
  });
  const cap=sampCaption(M,fmt(map.ratio,2));
  caption(ctx,L.left,L.capY,(L.capTxt===ph.full?cap.full:cap.short)
    +(L.bottom.length?'':' (the four-sample-size row needs a wider stage than this one.)'),
    L.capW,'#767e92',CAP_FONT);
  void 0;
  return {map,L};
}

/* ================================================================== *
 *  view 5: the exact law — the density PhET's mechanism implies       *
 * ================================================================== */
function exactCaption(M){
  const naive=M.naive===null?'':' A launcher with no jitter at all would average v²sin2θ/g = '+fmt(M.naive,2)
    +' m; with it the mean is '+fmt(M.exact.mean,2)+' m. Two factors, pulling opposite ways: the angle spread shortens it (E[sin2θ] = sin2μ·e^(−2σ²), and the exponential is always below one) while the speed spread lengthens it (E[v²] = μ² + σ²). Launchers 3 and 5, whose speed spread beats their angle spread, land LONG of the no-jitter value.';
  return {full:'The histogram is '+M.stat.n+' launches in bins of '+fmt(M.binW,2)+' m (a quarter of σ, rounded — this view is about the shape, so its bins follow the distribution rather than PhET’s list); '
            +(M.st.showDensity
              ?'the orange curve is not a fit to it. It is the density the mechanism implies, ∫f_θ(θ)f_v(v*(r,θ))/|∂x/∂v| dθ, computed on eight panels of the same 96-node rule the exact mean and standard deviation come from — at a fixed r that integrand is a spike, and one panel of it rings by up to 29 %.'
              :'the exact density is switched off, so the bars stand on their own — the mean and standard deviation quoted beside them are still the exact ones, not the sample’s.')+naive
            +(M.naive===null
              ?' The two panels below would compare the exact mean and standard deviation against the two ground-launch shortcuts; from 12 m neither shortcut exists, and they say so rather than drawing an empty axis.'
              :' The two panels below run that comparison across all six mystery launchers: the mean against the no-jitter value, and the exact standard deviation against PhET’s own delta-method estimate.'),
          short:(M.st.showDensity?'The orange curve is the exact density, not a fit. ':'The exact density is switched off. ')+'Mean '+fmt(M.exact.mean,2)+' m, σ '+fmt(M.exact.sd,3)+' m.'};
}
function drawExactView(ctx,W,H,M){
  const ph=exactCaption(M);
  const L=labStage(ctx,W,H,ph.full,ph.short,{nBottom:2});
  const b=L.main;
  const E=M.exact, w=M.binW;
  const lo=Math.max(0,E.mean-5*E.sd), hi=E.mean+5*E.sd;
  const xs=[], ys=[];
  { const C=pdlPdfCurve(M.cfg,lo,hi,200); xs.push.apply(xs,C.xs); ys.push.apply(ys,C.ys); }
  let ymax=0; for(const y of ys) ymax=Math.max(ymax,y);
  const dens=M.hist.counts.map(c=>c/Math.max(1,M.stat.n)/w);
  for(const d of dens) ymax=Math.max(ymax,d);
  ymax*=1.2;
  axesT(ctx,b,lo,hi,0,ymax,{title:'the landing distance: '+M.stat.n+(M.st.showDensity?' launches against the exact density':' launches'),
    xlab:'landing distance x, m',ylab:'density, 1/m',nx:6,ny:4});
  const px=x=>b.x+b.w*(x-lo)/(hi-lo), py=y=>b.y1-b.h*y/ymax;
  for(let i=0;i<M.hist.counts.length;i++){
    const c=M.hist.counts[i]; if(!c) continue;
    const X0=Math.max(b.x,px((M.hist.lo+i)*w)), X1=Math.min(b.x1,px((M.hist.lo+i+1)*w));
    if(X1<=X0) continue;
    ctx.fillStyle=rgba(COL.pos,0.55); ctx.fillRect(X0,py(dens[i]),X1-X0,b.y1-py(dens[i]));
    POLY_SEGS.push(X0,py(dens[i]),X1,py(dens[i]));
  }
  if(M.st.showDensity) pl(ctx,b,xs,ys,lo,hi,0,ymax,COL.ref,2);
  if(M.st.showDelta&&M.delta!==null){
    const gx=[], gy=[];
    for(let i=0;i<=200;i++){ const x=lo+(hi-lo)*i/200; gx.push(x);
      gy.push(Math.exp(-0.5*Math.pow((x-M.naive)/M.delta,2))/(M.delta*Math.sqrt(2*Math.PI))); }
    pl(ctx,b,gx,gy,lo,hi,0,ymax,COL.bar,1.4,[6,4]);
  }
  /* the exact mean and the sample mean */
  for(const [v,col,tx] of [[E.mean,COL.ref,'μ = '+fmt(E.mean,3)+' m'],
                           [M.stat.mean,COL.live,'x̄ = '+(M.stat.mean===null?'—':fmt(M.stat.mean,3)+' m')]]){
    if(v===null) continue;
    const X=px(v);
    ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.setLineDash(col===COL.ref?[5,4]:[]);
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,W,H,X,b.y+6,tx,col,SM_FONT,'center','top');
  }
  /* a legend row for a curve that is switched off is the caption fault in
     legend form: every row here names something actually drawn */
  legendReg(ctx,b,[[COL.pos,M.stat.n+' launches']]
    .concat(M.st.showDensity?[[COL.ref,'the exact density']]:[])
    .concat(M.st.showDelta&&M.delta!==null?[[COL.bar,'PhET’s delta-method normal']]:[]));
  /* below: the six launchers, mean and spread, exact against the shortcuts */
  const rows=LAUNCHERS.map(l=>{
    const cfg=cfgMystery(l.n,M.st.xOrient);
    const Ex=pdlExact(cfg), mu=cfg.meanSpeed*cfg.mult;
    return {n:l.n,Ex,naive:cfg.h>0?null:mu*mu*Math.sin(2*cfg.meanAng*Math.PI/180)/PDL.G,
            delta:cfg.h>0?null:pdlDeltaSd(mu,cfg.sdSpeed,cfg.meanAng,cfg.sdAng)};
  });
  if(L.bottom.length>=2){
    const noFlat='Both shortcuts are derived for a launch from the ground, where x = v²sin2θ/g. This orientation launches from '
      +fmt(PDL.RAISED_H,0)+' m, so neither applies and there is nothing to compare — pick a ground orientation to see them.';
    barDiff(ctx,L.bottom[0],rows,r=>r.Ex.mean,r=>r.naive,
      titleFor(L.bottom[0],'v²sin2θ/g against the exact mean, %','no-jitter mean, %'),
      '+ means the no-jitter value is too long',noFlat);
    barDiff(ctx,L.bottom[1],rows,r=>r.Ex.sd,r=>r.delta,
      titleFor(L.bottom[1],'PhET’s delta method against the exact σ, %','delta-method σ, %'),
      '+ means the delta method is too wide',noFlat);
  }
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
  return {b,px,py,L};
}
/* the shortcut against the exact value, launcher by launcher, as a SIGNED
   PERCENTAGE: drawn as two absolute bars the two differ by 0.05 % to 1.5 %
   and the panel says nothing at all.  Every bar top is pushed into POLY_SEGS
   so legendAuto dodges the bars, which are fills and are otherwise invisible
   to it. */
function barDiff(ctx,b,rows,fa,fb,title,note,why){
  let hi=0.2, any=false;
  for(const r of rows){ const v=fb(r); if(v!==null){ any=true; hi=Math.max(hi,Math.abs(100*(v/fa(r)-1))); } }
  hi*=1.3;
  /* a sparse panel is not a broken panel, but an empty axis with a legend
     over it IS: say why there is nothing to draw (pulsar Known-bad) */
  if(!any){
    ctx.fillStyle='#aeb6c6'; ctx.font='italic 13px Georgia, serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(plain(title),b.x,b.y);
    caption(ctx,b.x,b.y+22,why,b.w,'#767e92',CAP_FONT);
    return;
  }
  axesT(ctx,b,0.4,rows.length+0.6,-hi,hi,{title,ylab:null,xticks:rows.map(r=>r.n),ny:3});
  const px=x=>b.x+b.w*(x-0.4)/(rows.length+0.2), py=y=>b.y1-b.h*(y+hi)/(2*hi);
  const w=b.w/(rows.length+0.2)*0.42;
  ctx.strokeStyle='#3b4250'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(b.x,py(0)); ctx.lineTo(b.x1,py(0)); ctx.stroke();
  rows.forEach(r=>{
    const v=fb(r); if(v===null) return;
    const d=100*(v/fa(r)-1), X=px(r.n), Y=py(d), Y0=py(0);
    ctx.fillStyle=rgba(d>0?COL.ref:COL.struct,0.85);
    /* a bar 0.3 px tall is a bar nobody can see, and "no bar" reads as "no
       datum": every launcher keeps a visible stub and its number */
    const h1=Math.max(2,Math.abs(Y-Y0));
    ctx.fillRect(X-w/2,d>0?Y0-h1:Y0,w,h1);
    POLY_SEGS.push(X-w/2,Y0-h1,X+w/2,Y0-h1,X-w/2,Y0+h1,X+w/2,Y0+h1);
    lab(ctx,b.x1+2,b.y1+2,X,d>0?Y0-h1-3:Y0+h1+3,(d>0?'+':'')+fmt(d,2),
        d>0?COL.ref:COL.struct,'9.5px -apple-system, sans-serif','center',d>0?'bottom':'top');
  });
  legendReg(ctx,b,[[COL.ref,'the shortcut reads HIGH'],[COL.struct,'it reads LOW']]);
  lab(ctx,b.x1+2,b.y1+2,b.x+4,b.y+6,note,COL.dim,SM_FONT,'left','top');
}

/* ================================================================== *
 *  view 6: the limit theorem                                          *
 * ================================================================== */
function cltCaption(M){
  const E=M.exact;
  return {full:'Four sampling distributions from the same launcher: '+M.st.cM+' samples at each of n = 2, 5, 15 and 40, drawn as densities on one axis so their widths can be compared directly. '
            +(M.st.showNormal
              ?'The orange curves are normals of standard deviation σ/√n with σ = '+fmt(E.sd,3)+' m taken from the exact law, not fitted.'
              :'The σ/√n normals are switched off, so the histograms stand alone — σ = '+fmt(E.sd,3)+' m from the exact law is still what the panels below measure against.')
            +' The left panel below puts the measured standard errors against σ/√n on log axes, where the theorem is a straight line of slope −½. On that axis the error bars are half a pixel long, so the right panel gives the same four residuals in units of their own sampling spread, σ_n√((κ_n+2)/4M): agreement with an error bar attached rather than an impression.'
            +' One launch is skewed by '+fmt(E.skew,3)+'; at n = 40 that skewness is down to '+fmt(E.skew/Math.sqrt(40),4)+', which is the other half of the theorem.',
          short:M.st.cM+' samples at each n'+(M.st.showNormal?'; the orange curves are σ/√n, not fits.':'; the σ/√n normals are off.')};
}
function drawCltView(ctx,W,H,M){
  const ph=cltCaption(M);
  const L=labStage(ctx,W,H,ph.full,ph.short,{nBottom:2,nBottomNarrow:1});
  const b=L.main;
  const E=M.exact;
  const lo=E.mean-4.4*E.sd, hi=E.mean+4.4*E.sd;
  let ymax=0;
  const built=M.sets.map((S,i)=>{
    const w=Math.max(0.08,E.sd/Math.sqrt(S.n)/3);
    const Hh=pdlHistogram(S.means,w);
    const d=Hh.counts.map(c=>c/S.means.length/w);
    for(const v of d) ymax=Math.max(ymax,v);
    const se=E.sd/Math.sqrt(S.n);
    ymax=Math.max(ymax,1/(se*Math.sqrt(2*Math.PI)));
    return {S,w,Hh,d,se};
  });
  ymax*=1.14;
  axesT(ctx,b,lo,hi,0,ymax,{title:'the sample mean at four sample sizes, as densities',
    xlab:'sample mean x̄, m',ylab:'density, 1/m',nx:6,ny:4});
  built.forEach((B,i)=>{
    const col=COL.sizes[i];
    /* the measured distribution as a step outline */
    const xs=[], ys=[];
    for(let k=0;k<B.Hh.counts.length;k++){
      xs.push((B.Hh.lo+k)*B.w,(B.Hh.lo+k+1)*B.w); ys.push(B.d[k],B.d[k]);
    }
    pl(ctx,b,xs,ys,lo,hi,0,ymax,col,1.5);
    if(M.st.showNormal){
      const gx=[], gy=[];
      for(let k=0;k<=220;k++){ const x=lo+(hi-lo)*k/220; gx.push(x);
        gy.push(Math.exp(-0.5*Math.pow((x-E.mean)/B.se,2))/(B.se*Math.sqrt(2*Math.PI))); }
      pl(ctx,b,gx,gy,lo,hi,0,ymax,COL.ref,1.2,[5,4]);
    }
  });
  legendReg(ctx,b,PDL.SIZES.map((n,i)=>[COL.sizes[i],'n = '+n+'  (SE '+fmt(built[i].S.sd,3)+' m)'])
    .concat(M.st.showNormal?[[COL.ref,'σ/√n, the theorem']]:[]));
  /* the log-log panel */
  const p=L.bottom[0];
  if(!p){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); return {b,L}; }
  const nlo=1.4, nhi=60, slo=E.sd/Math.sqrt(nhi)*0.7, shi=E.sd/Math.sqrt(nlo)*1.35;
  axesT(ctx,p,Math.log10(nlo),Math.log10(nhi),Math.log10(slo),Math.log10(shi),
    {title:titleFor(p,'standard error, m, against sample size n (log–log: slope −½)','SE, m, against n (log–log)'),ylab:null,
     xticks:[2,5,15,40].map(Math.log10),xfmt:v=>fmt(Math.pow(10,v),0),
     yticks:logTicks125(slo,shi).map(Math.log10),yfmt:v=>sigf(Math.pow(10,v),2),ny:3});
  const lx=[], ly=[];
  for(let i=0;i<=60;i++){ const n=nlo*Math.pow(nhi/nlo,i/60); lx.push(Math.log10(n)); ly.push(Math.log10(E.sd/Math.sqrt(n))); }
  pl(ctx,p,lx,ly,Math.log10(nlo),Math.log10(nhi),Math.log10(slo),Math.log10(shi),COL.ref,1.8);
  built.forEach((B,i)=>{
    const X=p.x+p.w*(Math.log10(B.S.n)-Math.log10(nlo))/(Math.log10(nhi)-Math.log10(nlo));
    const Y=p.y1-p.h*(Math.log10(B.S.sd)-Math.log10(slo))/(Math.log10(shi)-Math.log10(slo));
    const tol=B.se*Math.sqrt((E.kurt/B.S.n+2)/(4*M.st.cM));
    const Y1=p.y1-p.h*(Math.log10(B.S.sd+tol)-Math.log10(slo))/(Math.log10(shi)-Math.log10(slo));
    const Y2=p.y1-p.h*(Math.log10(Math.max(1e-6,B.S.sd-tol))-Math.log10(slo))/(Math.log10(shi)-Math.log10(slo));
    ctx.strokeStyle=COL.sizes[i]; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(X,Y1); ctx.lineTo(X,Y2); ctx.stroke();
    dot(ctx,X,Y,4,COL.sizes[i],'#0a0c12',1);
  });
  /* the residual panel: the error bars on the log axis are half a pixel long,
     so the agreement is only visible in units of the tolerance itself */
  const q=L.bottom[1];
  if(q){
    let hiz=3;
    const zs=built.map(B=>(B.S.sd-B.se)/(B.se*Math.sqrt((E.kurt/B.S.n+2)/(4*M.st.cM))));
    for(const z of zs) hiz=Math.max(hiz,Math.abs(z)*1.25);
    axesT(ctx,q,0.4,4.6,-hiz,hiz,{title:titleFor(q,'(measured SE − σ/√n) in units of its own sampling sd','the residual, in units of its sd'),
      ylab:null,xticks:[1,2,3,4],xfmt:v=>''+PDL.SIZES[v-1],ny:3});
    const qx=i=>q.x+q.w*(i+1-0.4)/4.2, qy=z=>q.y1-q.h*(z+hiz)/(2*hiz);
    for(const k of [-1,1]){ ctx.strokeStyle='rgba(232,132,58,.35)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(q.x,qy(k)); ctx.lineTo(q.x1,qy(k)); ctx.stroke(); }
    ctx.strokeStyle='#3b4250'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(q.x,qy(0)); ctx.lineTo(q.x1,qy(0)); ctx.stroke();
    zs.forEach((z,i)=>{ const X=qx(i);
      ctx.strokeStyle=COL.sizes[i]; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(X,qy(0)); ctx.lineTo(X,qy(clamp(z,-hiz,hiz))); ctx.stroke();
      dot(ctx,X,qy(clamp(z,-hiz,hiz)),4,COL.sizes[i],'#0a0c12',1);
      POLY_SEGS.push(X,qy(0),X,qy(clamp(z,-hiz,hiz)));
    });
    lab(ctx,q.x1+2,q.y1+2,q.x+4,q.y+6,'the orange rules are ±1 sd',COL.dim,SM_FONT,'left','top');
  }
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
  return {b,L};
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
let LAST_GEO=null;
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='field') LAST_GEO=drawFieldView(ctx,W,H,M);
  else if(M.view==='sources') LAST_GEO=drawSourcesView(ctx,W,H,M);
  else if(M.view==='measures') LAST_GEO=drawMeasuresView(ctx,W,H,M);
  else if(M.view==='sampling') LAST_GEO=drawSamplingView(ctx,W,H,M);
  else if(M.view==='exact') LAST_GEO=drawExactView(ctx,W,H,M);
  else LAST_GEO=drawCltView(ctx,W,H,M);
  return LAST_GEO;
}
/* the interval tool is the one thing on the canvas you can drag; it lives on
   the measures view's histogram, and its geometry is recomputed from the same
   layout the drawing used (never cached, so a resize cannot desynchronise it) */
function intervalHit(S,x,y){
  const M=buildModel();
  if(M.view!=='measures'||!M.st.showInterval) return null;
  const ctx=S.measure();
  const ph=measCaption(M,'1.00'), L=labStage(ctx,S.W,S.H,ph.full,ph.short,{histFrac:0.46,fieldWant:fieldWantH(M)});
  const hm={px:v=>L.hist.x+L.hist.w*v/PDL.FIELD};
  const G=intervalGeo(L.hist,M,hm);
  if(y<L.hist.y-14||y>L.hist.y1+6) return null;
  const d1=Math.abs(x-G.a), d2=Math.abs(x-G.c), dm=Math.abs(x-G.mid);
  /* the pixel-to-metre map is (x - box.x) * per, NOT x * per: the histogram
     box starts 54 px in, and dropping that put every dragged edge 5.4 m out */
  const per=PDL.FIELD/L.hist.w, x0=L.hist.x, mx=(x-x0)*per;
  if(d1<=9&&d1<=d2) return {what:'e1',per,x0};
  if(d2<=9) return {what:'e2',per,x0};
  if(dm<=14&&Math.abs(M.st.e2-M.st.e1)>2) return {what:'mid',per,x0,off:mx-(M.st.e1+M.st.e2)/2};
  return null;
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.measure=()=>canvas.getContext('2d');
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){
    if(!ST.running) return false;
    return worldStep(ST,viewDt(ST));
  };
  S.fire=function(){ fireField(ST); };
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    if(type==='down'){
      const hit=intervalHit(S,x,y);
      if(!hit) return false;
      DRAG.what=hit.what; DRAG.per=hit.per; DRAG.x0=hit.x0; DRAG.off=hit.off||0;
      DRAG.w0=ST.e2-ST.e1;
      return true;
    }
    if(type==='move'&&DRAG.what){
      const v=clamp((x-DRAG.x0)*DRAG.per,0,PDL.FIELD);
      if(DRAG.what==='e1') ST.e1=Math.round(v*10)/10;
      else if(DRAG.what==='e2') ST.e2=Math.round(v*10)/10;
      else {
        const c=clamp((x-DRAG.x0)*DRAG.per-DRAG.off,Math.abs(DRAG.w0)/2,PDL.FIELD-Math.abs(DRAG.w0)/2);
        ST.e1=Math.round((c-DRAG.w0/2)*10)/10; ST.e2=Math.round((c+DRAG.w0/2)*10)/10;
      }
      return true;
    }
    return false;
  };
  return S;
}

      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};

  const CHIPROWS=[];

      wrapEl.appendChild(c);
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function button(lab2,fn){ return h('button',{onclick:()=>{ fn(); syncChips(); syncPanel(); dirty=true; refresh(); }},lab2); }

  const reFld=()=>{ const w=worldOf('field'), F=w.fields[st.fld-1];
    F.cfg=cfgMystery(st.lau); F.lau=st.lau; fieldClear(F); };
  const reSrc=()=>{ const w=worldOf('sources'); w.F.cfg=cfgCustom(st); fieldClear(w.F); };
  const reMeas=()=>{ const w=worldOf('measures');
    w.F.cfg=st.mSrc==='custom'?cfgCustom(st):cfgMystery(st.mLau); fieldClear(w.F); };
  const reExact=()=>{ const w=worldOf('exact'); w.F.cfg=cfgMystery(st.xLau,st.xOrient);
    fieldClear(w.F); fieldBatch(w.F,st.xN); };

  /* ---- the field (Variability) ---- */
  const gFld=h('div',{class:'grp'},h('h3',null,'the field'));
  gFld.appendChild(h('div',{class:'tag'},'field (each keeps its own shots):'));
  gFld.appendChild(chipRow(FIELD_LIST,'fld',()=>{ st.lau=worldOf('field').fields[st.fld-1].lau; }));
  gFld.appendChild(h('div',{class:'tag'},'mystery launcher on this field:'));
  gFld.appendChild(chipRow(LAU_LIST,'lau',reFld));
  const fldTag=h('div',{class:'tag'}); gFld.appendChild(fldTag);

  /* ---- the custom launcher (Sources, and Measures when custom) ---- */
  const gSrc=h('div',{class:'grp'},h('h3',null,'the custom launcher'));
  gSrc.appendChild(h('div',{class:'tag'},'mechanism (it sets the speed spread):'));
  gSrc.appendChild(chipRow(MECH_CHIPS,'mech',()=>{ reSrc(); reMeas(); }));
  gSrc.appendChild(slider('stab','angle stability',0,1,0.05,v=>fmt(pdlSdOfStab(v),2)+'° sd',()=>{ reSrc(); reMeas(); }));
  gSrc.appendChild(h('div',{class:'tag'},'projectile (it scales the mean speed):'));
  gSrc.appendChild(chipRow(TYPE_CHIPS,'ptype',()=>{ reSrc(); reMeas(); }));
  gSrc.appendChild(h('div',{class:'tag'},'launcher orientation:'));
  gSrc.appendChild(chipRow(ORIENT_CHIPS,'orient',()=>{ reSrc(); reMeas(); }));
  const srcTag=h('div',{class:'tag'}); gSrc.appendChild(srcTag);

  /* ---- the measures ---- */
  const gMeas=h('div',{class:'grp'},h('h3',null,'the launcher'));
  gMeas.appendChild(chipRow(SRC_CHIPS,'mSrc',reMeas));
  gMeas.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gMeas.appendChild(chipRow(LAU_LIST,'mLau',reMeas));
  const gShow=h('div',{class:'grp'},h('h3',null,'what to show'));
  gShow.appendChild(h('div',{class:'checks'},checkbox('showMean','mean'),checkbox('showSd','standard deviation'),
    checkbox('showValues','values'),checkbox('showInterval','interval tool')));
  gShow.appendChild(slider('e1','interval from',0,PDL.FIELD,0.1,v=>fmt(v,1)+' m'));
  gShow.appendChild(slider('e2','interval to',0,PDL.FIELD,0.1,v=>fmt(v,1)+' m'));
  const measTag=h('div',{class:'tag'}); gShow.appendChild(measTag);

  /* ---- the sampling ---- */
  const gSamp=h('div',{class:'grp'},h('h3',null,'the sampling'));
  gSamp.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gSamp.appendChild(chipRow(LAU_LIST,'pLau'));
  gSamp.appendChild(h('div',{class:'tag'},'sample size:'));
  gSamp.appendChild(chipRow(SIZE_LIST,'pN'));
  gSamp.appendChild(h('div',{class:'checks'},checkbox('showSe','show the standard error')));
  gSamp.appendChild(h('div',{class:'btnrow'},
    button('+20 samples',()=>{ const F=sampField(st); sampleBatch(F,st.pN,20); }),
    button('clear',()=>{ const F=sampField(st); fieldClear(F); })));
  const sampTag=h('div',{class:'tag'}); gSamp.appendChild(sampTag);

  /* ---- the exact law ---- */
  const gExact=h('div',{class:'grp'},h('h3',null,'the exact law'));
  gExact.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gExact.appendChild(chipRow(LAU_LIST,'xLau',reExact));
  gExact.appendChild(h('div',{class:'tag'},'launcher orientation:'));
  gExact.appendChild(chipRow(ORIENT_CHIPS,'xOrient',reExact));
  gExact.appendChild(slider('xN','launches drawn',50,PDL.MAX_PROJ,50,v=>fmt(v,0),reExact));
  gExact.appendChild(h('div',{class:'checks'},checkbox('showDensity','the exact density'),
    checkbox('showDelta','PhET’s delta-method normal')));
  const exactTag=h('div',{class:'tag'}); gExact.appendChild(exactTag);

  /* ---- the limit theorem ---- */
  const gClt=h('div',{class:'grp'},h('h3',null,'the limit theorem'));
  gClt.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gClt.appendChild(chipRow(LAU_LIST,'cLau'));
  gClt.appendChild(slider('cM','samples at each n',100,2000,100,v=>fmt(v,0)));
  gClt.appendChild(h('div',{class:'checks'},checkbox('showNormal','σ/√n, the theorem')));
  const cltTag=h('div',{class:'tag'}); gClt.appendChild(cltTag);

  /* ---- the histogram (shared by the four PhET screens) ---- */
  const gHist=h('div',{class:'grp'},h('h3',null,'the histogram'));
  gHist.appendChild(chipRow(BINSTRAT,'binStrat'));
  gHist.appendChild(h('div',{class:'tag'},'bin width:'));
  gHist.appendChild(chipRow(BINW_LIST,'binW'));
  gHist.appendChild(h('div',{class:'tag'},'total bins (width = 100/bins):'));
  gHist.appendChild(chipRow(NBINS_LIST,'nBins'));
  gHist.appendChild(h('div',{class:'checks'},checkbox('blocks','blocks, one per projectile'),
    checkbox('paths','paths'),checkbox('showAng','launch angle'),checkbox('showSpd','launch speed')));
  const histTag=h('div',{class:'tag'}); gHist.appendChild(histTag);

  /* ---- firing ---- */
  const gFire=h('div',{class:'grp'},h('h3',null,'firing'));
  gFire.appendChild(chipRow(MODES,'mode'));
  const fireBtn=h('button',{onclick:()=>{ S.fire(); syncPanel(); dirty=true; refresh(); }},'launch');
  gFire.appendChild(h('div',{class:'btnrow'},fireBtn,
    button('+50 at once',()=>{ const F=curField(st); if(F) fieldBatch(F,50); }),
    button('clear',()=>{ const F=curField(st); if(F) fieldClear(F); })));
  const fireTag=h('div',{class:'tag'}); gFire.appendChild(fireTag);

  /* ---- time ---- */
  const gRun=h('div',{class:'grp'},h('h3',null,'time'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('running','time runs'),
    checkbox('speedUp','×6 (PhET’s fast)')));
  gRun.appendChild(h('div',{class:'btnrow'},button('reset this view',()=>{ resetView(); })));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Projectile Data Lab (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. '
      +'PhET&rsquo;s constants (g = 9.81, the 100 m field, the 12 m raised launcher, the 0.2&ndash;5&deg; angle spreads, the three mechanisms, the six mystery launchers, the sample sizes and the bin widths) are read from its published build; '
      +'everything else is derived and pinned in selfTest to build/projectile-data-lab/derive.py (the exact moments by a 96-node Gauss&ndash;Legendre rule against scipy and a Monte Carlo, the density, bit-exact mulberry32, and every sample statistic against numpy).'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the mathematics'),h('div',{id:'phys'}));
  [gFld,gSrc,gMeas,gShow,gSamp,gExact,gClt,gHist,gFire,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function resetView(){
    const v=st.view;
    for(const k in DEFAULTS) if(k!=='view') st[k]=DEFAULTS[k];
    st.view=v;
    resetWorld(v);
    if(v==='sampling') resetWorld('sampling');
  }
  function syncChips(){
    for(const [cw,list,key] of CHIPROWS)
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')+(b.disabled?' off':''));
  }
  function syncPanel(){
    const v=st.view;
    gFld.hidden=(v!=='field');
    gSrc.hidden=!(v==='sources'||(v==='measures'&&st.mSrc==='custom'));
    gMeas.hidden=(v!=='measures');
    gShow.hidden=!(v==='measures');
    gSamp.hidden=(v!=='sampling');
    gExact.hidden=(v!=='exact');
    gClt.hidden=(v!=='clt');
    gHist.hidden=!(v==='field'||v==='sources'||v==='measures');
    gFire.hidden=!(v==='field'||v==='sources'||v==='measures'||v==='sampling');
    gRun.hidden=(v==='clt'||v==='exact');
    /* the bin-width and total-bins rows: only the one the strategy selects is
       live, and the other is dimmed — a control that is live but ignored is
       worse than no control (Known-bad) */
    const byW=st.binStrat==='binWidth';
    const bwRow=CHIPROWS.find(c=>c[2]==='binW')[0], nbRow=CHIPROWS.find(c=>c[2]==='nBins')[0];
    [].forEach.call(bwRow.children,b=>{ b.disabled=!byW; b.style.opacity=byW?'1':'0.4'; });
    [].forEach.call(nbRow.children,b=>{ b.disabled=byW; b.style.opacity=byW?'0.4':'1'; });
    const mysteryLive=(v!=='measures')||st.mSrc==='mystery';
    const mlRow=CHIPROWS.find(c=>c[2]==='mLau')[0];
    [].forEach.call(mlRow.children,b=>{ b.disabled=!mysteryLive; b.style.opacity=mysteryLive?'1':'0.4'; });
    const F=curField(st);
    fireBtn.textContent=F&&F.firing?'stop':(fieldMode(st)==='continuous'?'launch continuously':'launch');
    for(const k in rows) rows[k].sync();
    const M0=buildModel();
    fldTag.innerHTML='Changing a field&rsquo;s launcher clears it: a histogram of two launchers&rsquo; shots is not the distribution of anything. PhET keeps the mixed data; this does not.';
    srcTag.innerHTML='PhET&rsquo;s stabiliser runs backwards: stability 1 is the TIGHTEST launcher (0.2&deg;), stability 0 the loosest (5&deg;).';
    measTag.innerHTML='The interval tool can also be dragged on the canvas &mdash; either edge, or its middle to slide the whole window.';
    sampTag.innerHTML='At most '+PDL.MAX_SAMPLES+' samples a field, as PhET allows; each (launcher, n) pair keeps its own.';
    exactTag.innerHTML='The orange curve is computed from the two input Gaussians, not fitted to the bars.';
    cltTag.innerHTML='More samples narrow the error bars as 1/&radic;M; they do not narrow the distributions.';
    histTag.innerHTML='PhET bins by floor(x/w)&middot;w, so a bin is [k w, (k+1) w) &mdash; the left edge is included.';
    fireTag.innerHTML=(F&&F.landed.length>=PDL.MAX_PROJ)?'this field is full ('+PDL.MAX_PROJ+', PhET&rsquo;s limit)'
      :'space launches &middot; <b>c</b> clears &middot; <b>p</b> pauses &middot; 1&ndash;6 switch views';
    runTag.innerHTML='A shot takes '+fmt(pdlFlight(M0.cfg.meanSpeed*M0.cfg.mult,M0.cfg.meanAng,M0.cfg.h),2)
      +' s to land; continuous fire waits '+fmt(PDL.LAUNCH_GAP,1)+' s between shots (PhET&rsquo;s minimum).';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='measures'?'drag the interval tool’s edges or its middle · space launches · 1–6 switch views'
        :'space launches · c clears · 1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); S.fire(); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='p'){ st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='c'){ const F=curField(st); if(F) fieldClear(F); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ resetView(); syncChips(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%8===0){ const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
      }catch(e){ fail(e); }
    }

const INFO={
  field:'Six launchers, deliberately unequal. Each one throws a cannonball at a mean speed and a mean angle, and each one wobbles: the mechanism inside it scatters the speed, and how well it is braced scatters the angle. Fire one shot and you learn almost nothing; fire forty and the histogram under the field starts to have a shape. That shape is not an accident of the sampling &mdash; it is a fixed thing, the same for every run of this launcher, and <b>the exact law</b> computes it outright. Launcher 5 is the tightest (±0.2 m/s, ±0.2°) and launcher 6 the loosest (±1.2 m/s, ±5°); the field markers are every 10 m, as PhET&rsquo;s are.',
  sources:'Two dials, two sources of spread. The mechanism &mdash; spring, pressure or explosion &mdash; fixes the mean launch speed and how much it varies (23 ± 0.5, 24 ± 0.2, 25 ± 1.2 m/s, PhET&rsquo;s values). The angle stabiliser fixes how much the angle varies, from ±5° when it is off to ±0.2° when it is fully on. The panels below draw those two Gaussians; the histogram above is what the trajectory makes of them. Two things are worth trying. Set the orientation to 45° and the angle spread stops mattering almost entirely, because ∂x/∂θ = 2v²cos2θ/g vanishes there. Swap the cannonball for a pumpkin and everything scales by 1.1 in speed, 1.21 in distance &mdash; the spread grows with the mean, which is why a wider histogram is not automatically a worse launcher.',
  measures:'Now measure it. The mean x̄ is the balance point of the data; the standard deviation s is the root-mean-square distance from it, and PhET divides by n − 1 rather than n &mdash; the readout shows both so the difference is visible instead of assumed. The interval tool is the third measurement: drag its edges (on the canvas or with the sliders) and it counts what fraction of the shots lie between them, both ends included. Put it at x̄ ± s and you should capture around two thirds; at x̄ ± 2s, around ninety-five per cent &mdash; but only around, because the landing distance is not exactly normal. It is mildly skewed, and <b>the exact law</b> says by how much.',
  sampling:'A sample is n launches, and the only number kept from it is its mean. Those means go into their own histogram, and it is much narrower than the one below the field: averaging cancels. How much narrower is the whole content of the screen. The four thumbnails are the same launcher at n = 2, 5, 15 and 40, drawn on one axis, and the orange bar on each is σ/√n computed from the exact law rather than measured. The mean of the sample means stays put &mdash; averaging does not bias anything &mdash; and only the width moves.',
  exact:'The histogram is data; the orange curve is not. PhET&rsquo;s mechanism is two independent Gaussians pushed through one formula, so the distribution of the landing distance is a closed problem: for every distance r there is a speed v*(r, θ) that reaches it from each angle θ, and the density is the integral of f<sub>θ</sub>(θ) f<sub>v</sub>(v*) over the angles, divided by how fast the distance changes with speed. That integral is evaluated here on eight panels of the same 96-node rule that gives the exact mean and standard deviation &mdash; at a fixed r only the angles whose v* lands within a few standard deviations of the mean speed contribute, so the integrand is a spike and one panel of the rule rings around it by up to 29 % &mdash; and derive.py checks it against scipy and against eight million simulated launches. The two panels below make the point that shortcuts cost something: the no-jitter mean v²sin2θ/g is up to 1.5 % high, and PhET&rsquo;s own delta-method spread up to 0.7 % low.',
  clt:'The central limit theorem, measured rather than illustrated. Take '+DEFAULTS.cM+' samples at each of the four sample sizes and look at the four distributions of the sample mean: they sit on the same centre and narrow as 1/√n. The orange curves are normals of standard deviation σ/√n with σ from the exact law &mdash; nothing is fitted. The log–log panel below turns the claim into a straight line of slope −½, and each measured point carries the spread it is entitled to, σ<sub>n</sub>√((κ<sub>n</sub>+2)/4M), so "they agree" has an error bar attached. The second half of the theorem is the shape: one launch is skewed, and the skewness of the mean falls as 1/√n too.'
};

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}
/* Simpson on a function, for the density integrals */
/* the 0th, 1st and 2nd moments of f from ONE sampling of it */
function simp3(f,a,b,n){
  const h=(b-a)/n, out=[0,0,0];
  for(let i=0;i<=n;i++){
    const x=a+i*h, c=(i===0||i===n)?1:(i%2?4:2), y=f(x)*c;
    out[0]+=y; out[1]+=y*x; out[2]+=y*x*x;
  }
  return out.map(s=>s*h/3);
}
function simp(f,a,b,n){
  const N=2*Math.max(1,Math.round(n/2)), dx=(b-a)/N;
  let s=f(a)+f(b);
  for(let i=1;i<N;i++) s+=(i%2?4:2)*f(a+i*dx);
  return s*dx/3;
}

  let i=0;
  return {next(){ return 0.5; }, gauss(){ return i<list.length?list[i++]:0; }};
}

    const cfgT={meanSpeed:2,sdSpeed:1,meanAng:30,sdAng:0.2,h:0,raised:false,mult:1};
    const ET=pdlExact(cfgT);
    const I1=simp(r=>r*pdlPdf(r,cfgT),0,ET.mean+9*ET.sd,2000);
    rel(I1,ET.mean,3e-3,'and with it the density’s first moment is still the exact mean ('
      +fmt(I1,4)+' vs '+fmt(ET.mean,4)+'; r·f goes as √r at the origin, so Simpson stalls at 2.3e-5 however fine the grid)');
    ok(Math.abs(I1/vw2-ET.mean)/ET.mean>0.02,'… while dropping the divisor would put it 2 % out'); }
  { const cfg=cfgMystery(1);
    rel(pdlProbIn(cfg,40,60,100),REF.pIn4060,1e-7,'P(40 ≤ x ≤ 60) for launcher 1 (derive)');
    rel(pdlProbIn(cfg,0,200,200),1,1e-6,'and the whole line carries probability 1');
    /* the density is NOT the normal the delta method would draw: its skewness
       is real, and this is the assertion that says so */
    const E=pdlExact(cfg);
    const pl2=pdlProbIn(cfg,E.mean-3*E.sd,E.mean,100), pr=pdlProbIn(cfg,E.mean,E.mean+3*E.sd,100);
    ok(pl2<pr,'the density is left-skewed about its mean, as μ₃ = '+fmt(E.mu3,3)+' says');
    ok(Math.abs(pl2-pr)>1e-4,'… by more than rounding ('+(pr-pl2).toExponential(2)+')');
  }
  TIMES.D=Date.now();

  /* ============ F. the statistics, against numpy ============ */
  { const cfg=cfgMystery(1);
    const F=fieldMake(REF.sampleSeed,cfg);
    fieldBatch(F,REF.sampleN);
    const X=fieldXs(F);
    eq(X.length,REF.sampleN,'the reference field holds 500 landed projectiles');
    for(let i=0;i<5;i++) rel(X[i],REF.sampleFirst5[i],1e-15,'landing distance #'+i+' matches Python to 4 ulp (derive)');
    rel(X[X.length-1],REF.sampleLast,1e-15,'and so does #499 (derive)');
    rel(pdlMean(X),REF.sMean,1e-14,'the mean equals numpy’s (derive)');
    rel(pdlMedian(X),REF.sMedian,1e-15,'the median equals numpy’s (derive)');
    rel(pdlSd(X,1),REF.sSd1,1e-13,'the n−1 standard deviation equals numpy’s ddof=1 (derive)');
    rel(pdlSd(X,0),REF.sSd0,1e-13,'the n standard deviation equals numpy’s ddof=0 (derive)');
    rel(pdlSe(X),REF.sSe,1e-13,'the standard error equals numpy’s s/√n (derive)');
    rel(pdlSd(X,1)/pdlSd(X,0),Math.sqrt(500/499),1e-14,'the two conventions differ by exactly √(n/(n−1))');
    rel(Math.min.apply(null,X),REF.sMin,1e-14,'the smallest (derive)');
    rel(Math.max.apply(null,X),REF.sMax,1e-14,'the largest (derive)');
    /* the sample is a draw from the exact law, and its mean must sit within
       the standard error the law itself predicts */
    const E=pdlExact(cfg);
    ok(Math.abs(pdlMean(X)-E.mean)<4*E.sd/Math.sqrt(500),
       '500 launches average within 4 σ/√n of the exact mean ('+fmt(pdlMean(X),4)+' vs '+fmt(E.mean,4)+')');
    const sdTol=E.sd*Math.sqrt((E.mu4/Math.pow(E.sd,4)-1)/(4*500));
    ok(Math.abs(pdlSd(X,1)-E.sd)<4*sdTol,'and their standard deviation within 4 of its own sampling sd ('+fmt(sdTol,4)+' m)');
    /* every bin width, against numpy's histogram on the same data */
    for(const w of PDL.BINW){
      const Hh=pdlHistogram(X,w), R2=REF.binCounts[''+w];
      eq(Hh.lo,R2[0],'bin width '+w+': the first bin index equals numpy’s (derive)');
      eq(JSON.stringify(Hh.counts),JSON.stringify(R2[1]),'bin width '+w+': every count equals numpy’s (derive)');
      let s=0; for(const c of Hh.counts) s+=c;
      eq(s,X.length,'bin width '+w+': the counts add to 500');
    }
    eq(pdlFraction(X,40,60),REF.sFrac4060,'the interval tool’s fraction equals numpy’s, exactly (it is a count) (derive)');
    /* the binning RULE, at the edges where it is decided */
    eq(pdlBinIndex(46,2),23,'floor(x/w): 46 m at w = 2 is bin 23');
    eq(pdlBinIndex(46-1e-12,2),22,'and a hair below 46 is bin 22 — the left edge belongs to the upper bin');
    eq(pdlBinIndex(0,0.5),0,'0 is bin 0');
    eq(pdlHistogram([1,1.5,3.5],1).lo,1,'a histogram starts at the lowest occupied bin');
    eq(JSON.stringify(pdlHistogram([1,1.5,3.5],1).counts),'[2,0,1]','… and carries the empty bins between');
    eq(pdlHistogram([1,1.999999,2,3.5],1).counts[1],1,'a value on a bin edge goes to the bin above it');
  }
  /* the estimators' own contracts */
  ok(pdlSd([],1)===null&&pdlSd([5],1)===null,'the n−1 standard deviation is null below two values, as PhET returns null');
  ok(pdlSd([5,7],1)!==null,'… and defined at two');
  rel(pdlSd([5,7],1),Math.sqrt(2),1e-15,'s of {5, 7} is √2');
  rel(pdlSd([5,7],0),1,1e-15,'and the n convention gives 1');
  rel(pdlMedian([3,1,2]),2,0,'the median of an odd sample is the middle value');
  /* the median reads symmetric positions out of the sorted array, so it does
     not care which way the sort ran — the mutation sweep reports the reversed
     comparator as a survivor, and this is why (Known-bad: when a property is
     invariant, assert the invariance rather than leaving a blind spot) */
  { const a=[5,1,9,3,7,2], b=a.slice().reverse();
    rel(pdlMedian(a),pdlMedian(b),0,'the median is the same whichever order the input arrives in');
    rel(pdlMedian([1,2,3,4]),pdlMedian([4,3,2,1]),0,'… for an even sample as well as an odd one'); }
  rel(pdlMedian([4,1,3,2]),2.5,0,'and of an even one the mean of the middle two');
  ok(pdlMedian([])===null&&pdlMean([])===null,'both are null on no data');
  { const a=[1,2,3]; pdlMedian(a); eq(JSON.stringify(a),'[1,2,3]','the median does not sort the caller’s array in place'); }
  eq(pdlFraction([1,2,3,4],2,3),0.5,'the interval counts both ends closed');
  eq(pdlFraction([1,2,3,4],2.0001,2.9999),0,'… and moving the edges a hair inwards drops BOTH');
  eq(pdlFraction([2],2,2),1,'a zero-width interval still catches a value sitting on it');
  eq(pdlFraction([1,2,3,4],3,2),0.5,'… and the edges may be given either way round');
  eq(pdlFraction([],0,1),0,'no data is no fraction, not a division by zero');
  { /* the sampling run, against numpy */
    const F=fieldMake(REF.sampSeed,cfgMystery(1));
    sampleBatch(F,REF.sampSize,REF.sampN);
    const MS=sampleMeans(F);
    eq(MS.length,REF.sampN,'the reference sampling run holds 200 sample means');
    for(let i=0;i<3;i++) rel(MS[i],REF.sampFirst3[i],1e-15,'sample mean #'+i+' equals Python’s (derive)');
    rel(pdlMean(MS),REF.sampMean,1e-14,'the mean of the sample means equals numpy’s (derive)');
    rel(pdlSd(MS,1),REF.sampSd,1e-13,'their standard deviation equals numpy’s (derive)');
    rel(pdlMedian(MS),REF.sampMedian,1e-15,'their median equals numpy’s (derive)');
    const Hh=pdlHistogram(MS,0.5);
    eq(Hh.lo,REF.sampBins[0],'their histogram starts where numpy’s does (derive)');
    eq(JSON.stringify(Hh.counts),JSON.stringify(REF.sampBins[1]),'and every count matches (derive)');
    /* a sample mean really is the mean of its own sample */
    let worst=0;
    for(const s of F.samples) worst=Math.max(worst,Math.abs(s.mean-pdlMean(s.xs)));
    ok(worst===0,'every stored sample mean is the mean of the sample it came from');
    eq(F.samples[0].xs.length,REF.sampSize,'and each sample holds n launches');
  }
  TIMES.E=Date.now();

  /* ============ G. the central limit theorem ============ */
  { const cfg=cfgMystery(1), E=pdlExact(cfg);
    rel(E.mean,REF.clMean,1e-14,'the parent mean μ (derive)');
    rel(E.sd,REF.clSigma,1e-13,'the parent σ (derive)');
    rel(E.skew,REF.clSkew,1e-11,'its skewness (derive)');
    rel(E.kurt,REF.clKurt,1e-10,'its excess kurtosis (derive)');
    const M=REF.clM, rng=pdlRng(31337);
    PDL.SIZES.forEach((n,i)=>{
      const means=new Array(M);
      for(let k=0;k<M;k++){
        let s=0;
        for(let j=0;j<n;j++){ const d=pdlDraw(rng,cfg); s+=pdlRange(d.v,d.ang,cfg.h); }
        means[k]=s/n;
      }
      const se=pdlSd(means,1), want=E.sd/Math.sqrt(n);
      rel(want,REF.clSe[i],1e-13,'n = '+n+': σ/√n is derive.py’s '+fmt(REF.clSe[i],5)+' m');
      /* the tolerance is the sampling sd of a standard error measured over M
         samples, σ_n√((κ_n+2)/4M) — computed, not chosen */
      const tol=REF.clSeTol[i];
      rel(tol,want*Math.sqrt((E.kurt/n+2)/(4*M)),1e-9,'n = '+n+': the tolerance is that formula (derive)');
      ok(Math.abs(se-want)<4*tol,'n = '+n+': '+M+' samples measure SE = '+fmt(se,4)+' m against σ/√n = '
         +fmt(want,4)+' m, inside 4 × '+fmt(tol,4));
      ok(Math.abs(pdlMean(means)-E.mean)<4*want/Math.sqrt(M),
         'n = '+n+': and the sample means are still centred on μ (averaging biases nothing)');
      /* the OTHER half of the theorem: the skewness falls as 1/√n */
      let m3=0; const mm=pdlMean(means);
      for(const x of means){ const d=x-mm; m3+=d*d*d; }
      const sk=m3/M/Math.pow(se,3), wantSk=E.skew/Math.sqrt(n);
      ok(Math.abs(sk-wantSk)<5*Math.sqrt(6/M)+0.02,'n = '+n+': the sample mean’s skewness is '+fmt(sk,3)
         +' against skew/√n = '+fmt(wantSk,3));
    });
    /* the 1/√n law itself, as a ratio that cannot be faked by a scale factor */
    const r1=E.sd/Math.sqrt(2), r2=E.sd/Math.sqrt(40);
    rel(r1/r2,Math.sqrt(20),1e-14,'σ/√2 over σ/√40 is exactly √20');
  }
  TIMES.F=Date.now();

  /* ============ H. the panels and the drawing ============ */
  { let bad=null;
    for(const cfg of CONFIGS){
      applyConfig(cfg);
      const M=buildModel();
      const ro=readoutHTML(M), eb=eqbarHTML(M), tg=tagHTML(M);
      for(const [nm,s] of [['readout',ro],['eqbar',eb],['tag',tg],['info',INFO[ST.view]],['deriv',DERIV[ST.view]]]){
        if(!s||!s.length){ bad=cfg[0]+': '+nm+' is empty'; break; }
        if(/NaN|undefined|Infinity/.test(s)){ bad=cfg[0]+': '+nm+' contains NaN/undefined/Infinity'; break; }
      }
      if(bad) break;
      /* the formatter renders a non-finite as '—', so "no NaN" is vacuous on
         its own: assert a number only a live model can supply (Known-bad) */
      if(ro.indexOf(fmt(M.exact.mean,3)+' m')<0){ bad=cfg[0]+': the readout does not print the exact mean '+fmt(M.exact.mean,3); break; }
      if(M.view==='sampling'){
        if(M.mstat.sd1!==null&&ro.indexOf(fmt(M.mstat.sd1,4)+' m')<0){ bad=cfg[0]+': the readout does not print the sd of the sample means '+fmt(M.mstat.sd1,4); break; }
      } else if(M.stat&&M.stat.n>1&&ro.indexOf(fmt(M.stat.sd1,4)+' m')<0){ bad=cfg[0]+': the readout does not print s = '+fmt(M.stat.sd1,4); break; }
    }
    ok(!bad,'every view × configuration builds clean panels'+(bad?' ('+bad+')':''));
  }
  { /* every slider and chip setting, for a finite model */
    let bad=null;
    for(const v of TABS.map(t=>t[0])){
      for(const lau of [1,2,3,4,5,6]) for(const o of ORIENTS) for(const stab of [0,0.5,1]){
        Object.assign(ST,DEFAULTS);
        ST.view=v; ST.lau=lau; ST.mLau=lau; ST.pLau=lau; ST.xLau=lau; ST.cLau=lau;
        ST.orient=o.id; ST.xOrient=o.id; ST.stab=stab; ST.cM=100;
        resetAllWorlds();
        const M=buildModel();
        if(!(isFinite(M.exact.mean)&&isFinite(M.exact.sd)&&M.exact.sd>0)){ bad=v+'/'+lau+'/'+o.id+'/'+stab; break; }
        if(M.stat&&!(M.stat.n===0||isFinite(M.stat.mean))){ bad=v+'/'+lau+' stat'; break; }
      }
      if(bad) break;
    }
    ok(!bad,'every launcher × orientation × stability gives a finite model in every view'+(bad?' ('+bad+')':''));
  }
  TIMES.G=Date.now();
  { /* the layout sweep: text on the canvas, no collisions, nothing under the
       #hint, no legend crossed by a data curve */
    const SIZES2=[[1400,820],[1100,712],[820,560],[560,380]];
    let textBad=null, hintBad=null, collide=null, legBad=null, blank=null;
    const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
    for(const cfg of CONFIGS){
      applyConfig(cfg);
      for(const [W,H] of SIZES2){
        const ctx=makeShot(W,H);
        drawView(ctx,W,H,buildModel());
        const texts=ctx.ops.filter(o=>o.op==='text');
        if(ctx.ops.length<20&&!blank) blank=cfg[0]+' '+W+'x'+H+' drew only '+ctx.ops.length+' ops';
        for(const t of texts){
          if(entRe.test(t.t)&&!textBad) textBad=cfg[0]+' '+W+'x'+H+': entity/tag "'+t.t.slice(0,32)+'"';
          if(/NaN|undefined/.test(t.t)&&!textBad) textBad=cfg[0]+' '+W+'x'+H+': "'+t.t.slice(0,32)+'"';
          if((t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1)&&!textBad)
            textBad=cfg[0]+' '+W+'x'+H+': off canvas "'+t.t.slice(0,28)+'" ['+t.bb.map(v=>fmt(v,0))+']';
          /* the house #hint (HTML, bottom:11px, 11px type) owns the bottom-left */
          if(t.bb[0]<340&&t.bb[3]>H-27&&!hintBad) hintBad=cfg[0]+' '+W+'x'+H+': "'+t.t.slice(0,28)+'" under the #hint';
        }
        for(let i=0;i<texts.length&&!collide;i++) for(let j=i+1;j<texts.length;j++){
          const a=texts[i].bb,b=texts[j].bb;
          const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
          if(ox>0.5&&oy>0.5){ collide=cfg[0]+' '+W+'x'+H+': "'+texts[i].t.slice(0,20)+'" vs "'+texts[j].t.slice(0,20)+'"'; break; }
        }
        for(const r of LEGEND_RECTS){ for(let i=0;i<POLY_SEGS.length&&!legBad;i+=4){
          const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
          if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
          legBad=cfg[0]+' '+W+'x'+H+': a data curve runs through a legend';
        } }
      }
    }
    ok(!textBad,'the layout sweep finds clean, on-canvas text'+(textBad?' ('+textBad+')':''));
    ok(!hintBad,'nothing is drawn under the #hint line'+(hintBad?' ('+hintBad+')':''));
    ok(!collide,'no two text boxes overlap'+(collide?' ('+collide+')':''));
    ok(!legBad,'no legend has a data curve through it'+(legBad?' ('+legBad+')':''));
    ok(!blank,'every view draws something at every size'+(blank?' ('+blank+')':''));
  }
  { /* the exact-law view's bins follow sigma, because it does not show the
       bin chips and a control a view hides must not still decide its picture */
    for(const [x,want] of [[0.37,0.5],[0.4,0.5],[0.8,1],[1.2,1],[1.6,2],[3.9,5],[8,10],[0.09,0.1]])
      rel(niceStep(x),want,1e-12,'niceStep('+x+') is '+want);
    for(const lau of [1,3,5]) for(const o of ['angle30','angle0Raised']){
      Object.assign(ST,DEFAULTS); ST.view='exact'; ST.xLau=lau; ST.xOrient=o; ST.binW=10; resetAllWorlds();
      const M=buildModel();
      rel(M.binW,niceStep(M.exact.sd/4),0,'launcher '+lau+' '+o+': the exact view bins at σ/4 ('+fmt(M.binW,3)+' m), not at the chips’ 10 m');
      ok(M.hist.counts.length>=6,'… so its density has at least six bars to show a shape ('+M.hist.counts.length+')');
    }
    Object.assign(ST,DEFAULTS); resetAllWorlds(); }
  { /* the raised orientation has no v²sin2θ/g and no delta method, and the
       two comparison panels must SAY so rather than draw an empty axis */
    Object.assign(ST,DEFAULTS); ST.view='exact'; ST.xOrient='angle0Raised'; resetAllWorlds();
    const M=buildModel();
    ok(M.naive===null&&M.delta===null,'the raised launcher has neither shortcut');
    const ctx=makeShot(1400,820);
    drawView(ctx,1400,820,M);
    const txt=ctx.ops.filter(o=>o.op==='text').map(o=>o.t).join(' ');
    ok(/neither applies/.test(txt),'and the panels say why they are empty');
    ok(LEGEND_RECTS.length<=1,'with no legend left floating over an empty axis ('+LEGEND_RECTS.length+')');
    Object.assign(ST,DEFAULTS); ST.view='exact'; resetAllWorlds();
    const ctx2=makeShot(1400,820);
    drawView(ctx2,1400,820,buildModel());
    ok(!/neither applies/.test(ctx2.ops.filter(o=>o.op==='text').map(o=>o.t).join(' ')),
       '… and a ground orientation draws the bars instead');
    Object.assign(ST,DEFAULTS); resetAllWorlds(); }
  { /* the histogram really carries the data: the bars' total area is n */
    applyConfig(['field default',{view:'field'}]);
    const M=buildModel();
    let total=0; for(const c of M.hist.counts) total+=c;
    eq(total,M.stat.n,'the drawn histogram accounts for every landed projectile');
    /* and the field and the histogram share one x axis, which is the point */
    const ctx=makeShot(1200,760);
    const G=drawView(ctx,1200,760,M);
    ok(Math.abs(G.map.X(0)-G.hm.px(0))<1e-9&&Math.abs(G.map.X(100)-G.hm.px(100))<1e-9,
       'the field and the histogram share the same x mapping, so a bar sits under the shots that made it');
  }
  { /* the interval tool's geometry follows its own numbers */
    Object.assign(ST,DEFAULTS); ST.view='measures'; ST.e1=20; ST.e2=70; resetAllWorlds();
    const M=buildModel();
    const ctx=makeShot(1200,760);
    drawView(ctx,1200,760,M);
    const S2={W:1200,H:760,measure:()=>ctx,st:ST};
    const hit=intervalHit(S2,0,0);
    ok(hit===null,'a pointer at the top-left of the stage grabs no interval edge');
    const ph=measCaption(M,'1.00'), L=labStage(ctx,1200,760,ph.full,ph.short,{histFrac:0.46});
    const x1=L.hist.x+L.hist.w*ST.e1/PDL.FIELD;
    const g=intervalHit(S2,x1,L.hist.y+10);
    ok(g&&g.what==='e1','a pointer on the left edge grabs it');
    const g2=intervalHit(S2,L.hist.x+L.hist.w*ST.e2/PDL.FIELD,L.hist.y+10);
    ok(g2&&g2.what==='e2','a pointer on the right edge grabs that one');
    const g3=intervalHit(S2,L.hist.x+L.hist.w*45/PDL.FIELD,L.hist.y+10);
    ok(g3&&g3.what==='mid','and one in the middle grabs the whole window');
  }
  TIMES.H=Date.now();

  console.log('section times, s: '+['A','B','C','D','E','F','G','H'].map((k,i,a)=>
    k+' '+((TIMES[k]-(i?TIMES[a[i-1]]:T0))/1000).toFixed(1)).join(', '));
  Object.assign(ST,stSave); resetAllWorlds();
  console.log(pass+' passed, '+fail+' failed  ('+fmt((Date.now()-T0)/1000,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
</html>
