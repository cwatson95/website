<!--
  ===================================================================
  projectile-data-lab.html — Remake of PhET Interactive Simulations'
  Projectile Data Lab (University of Colorado Boulder,
  phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.
  ===================================================================

  Six views.  THE FIELD is PhET's Variability screen: six mystery
  launchers with deliberately unequal spreads, single or continuous
  fire onto a 100 m field, the paths, the landing histogram with its
  bin width, and the six fields you can fill independently.  THE
  SOURCES is PhET's Sources screen: a custom launcher whose mechanism
  (spring, pressure, explosion) sets the speed spread and whose angle
  stabiliser sets the angle spread, three projectiles that scale the
  speed, and four launcher orientations.  THE MEASURES is PhET's
  Measures screen: the mean, the standard deviation (n − 1, as PhET
  computes it), the individual values, and the interval tool, which
  reports the percentage of the data between two draggable edges.
  THE SAMPLING is PhET's Sampling screen: samples of n = 2, 5, 15 or
  40, one mean per sample, and the histogram of those means with its
  standard error.  THE EXACT LAW and THE LIMIT THEOREM are house
  additions: the probability density that PhET's mechanism implies,
  computed rather than drawn, and the central limit theorem measured
  against σ/√n.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * PhET's mechanism is two independent Gaussians — a launch speed and
    a launch angle — pushed through R = (v cos θ/g)(v sin θ +
    √(v² sin²θ + 2gh)).  That makes the landing distance's whole
    distribution a closed problem, not something to be sampled: for
    h = 0, R = v² sin 2θ/g, and since E[v^2k] and E[sin^k 2θ] both have
    exact Gaussian forms, so does every moment of R.
  * The exact mean is (1 + σ_v²/μ_v²)·e^(−2σ_θ²) times the no-jitter
    value v² sin 2θ/g — exactly, at all eighteen launcher × angle
    settings.  The two factors pull opposite ways: the SPEED spread
    lengthens the mean range (E[v²] = μ² + σ²) and the ANGLE spread
    shortens it (E[sin 2θ] = sin 2μ·e^(−2σ²)), and neither wins
    everywhere.  Twelve of the eighteen land short — mystery launcher 2
    averages 50.084 m where the naive value says 50.849, 1.53 % high —
    and six land LONG, launchers 3 and 5, whose speed spread beats
    their angle spread.
  * PhET's own spread estimate is the delta method (it sets the
    Sampling thumbnails' x-range from it).  Against the exact standard
    deviation it is LOW in four of the five flat cases — by 0.68 % for
    launcher 2 and 0.04–0.06 % for the rest — and HIGH by 5×10⁻⁶ at
    45°, where cos 2θ = 0 kills the angle term and only the speed term
    survives.  Small, signed, and derived here rather than guessed.
  * A launcher at 30° and the same launcher at 60° land with exactly
    the SAME distribution of distance (sin 2θ is symmetric about 45°,
    and so is the 0–90° truncation) — the flight times differ, the
    histograms do not.
  * The central limit theorem is asserted, not illustrated: over 4000
    samples the measured standard error of the mean matches σ/√n at
    n = 2, 5, 15 and 40, each within its own sampling spread
    σ_n√((κ_n+2)/4M), which is computed and not chosen.

  WHAT IS EXACT
  -------------
  * The trajectory.  PhET's closed forms for the range and the flight
    time are re-derived in derive.py and checked against the root of
    y(t) = 0 by brentq (1e-16) and against a marched trajectory
    (1e-11, the accumulated rounding of 4e5 steps).  The maximum-range
    angle from a height, cos 2θ* = gh/(v² + gh), is checked against a
    numerical argmax.
  * The random stream.  mulberry32 seeded per field, Box-Muller with
    one pair of uniforms per value, bit-identical to derive.py: the
    page and the Python twin generate the SAME 500 landing distances,
    and the page's mean, median, standard deviation (both conventions)
    and every histogram bin count are pinned against numpy's on that
    sample.
  * The distribution.  PhET re-draws the angle while it falls outside
    (0°, 90°) — unless the launcher is the raised one, where it does
    not — and re-draws the speed while it is ≤ 0, so both are
    truncated normals.  The moments come from a 96×96 Gauss-Legendre
    product rule over the truncated z-ranges, the same nodes and
    weights in the page and in derive.py, checked there against
    scipy's adaptive quadrature (1e-15), against a 8e6-draw Monte
    Carlo of the actual re-draw mechanism, and against the closed form
    of the untruncated model (whose difference, 5.5e-8 m at worst, is
    what "the truncation is negligible" means here).
  * The density.  f_R(r) = ∫ f_θ(θ) f_v(v*(r,θ))/|∂R/∂v| dθ, with
    v*(r,θ) in closed form when h = 0 and by Newton otherwise.  It
    integrates to 1 and to the exact mean to 1e-9, and matches an
    8e6-draw Monte-Carlo histogram at worst |z| = 2.25 over 24 bins —
    compared bin-average to bin-average, because f at the midpoint
    would be 2.6e-3 off and the noise is only 1.1e-3.
  * The statistics.  Binning is PhET's floor(x/w)·w; the standard
    deviation is the n − 1 one PhET uses and is null below two
    projectiles; the standard error is s/√n; the interval tool counts
    x in [lo, hi] inclusive.  All are pinned against numpy.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * No air resistance at all, g = 9.81 m/s², a 100 m field, a 12 m
    raised launcher, and PhET's launcher table: spring 23 ± 0.5 m/s,
    pressure 24 ± 0.2, explosion 25 ± 1.2; angle spreads 0.2°–5°;
    projectile speed multipliers 1, 1.1 and 0.9.
  * Continuous fire every 0.7 s (PhET's minimum), at most 500
    projectiles a field and 200 samples.  A SAMPLE is paced by PhET's
    own totalSampleTime — 0.75 s at n = 2, 2 s at 5, 5 s at 15 and 9 s
    at 40 — with the n launches spread evenly over it and their flights
    overlapping, so a bigger sample fires faster per shot, not slower.

  WHAT IS NOT MODELLED
  --------------------
  * Drag, spin, wind, the projectile's size, the ground's slope: a
    landing distance here depends on nothing but the launch speed and
    angle, which is what makes the exact law available.
  * The launcher's own geometry (PhET's barrel raises the launch point
    slightly); here the launch point is the origin except on the
    raised launcher, where it is 12 m up, as PhET's model says.

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * PhET's sound, its keyboard help, its PhET-iO instrumentation and
    its measuring tape and stopwatch are not here; the interval tool
    is, because it is the one tool that computes a statistic.
  * PhET's histogram can be set by total bins as well as by bin width;
    both are here, and the two analysis views are new.
  * The fields open with data already in them, because a view that
    draws nothing is a defect in this collection.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from docs/phets/projectile-data-lab_en.html
  (g = 9.81, MAX_FIELD_DISTANCE = 100, RAISED_LAUNCHER_HEIGHT = 12,
  ANGLE_STANDARD_DEVIATION_RANGE = 0.2–5°, the three mechanisms, the
  six mystery launchers, the three projectile types, the four
  orientations, the sample sizes 2/5/15/40, the bin widths, the
  interval tool's 40 and 60 m) and are cited as PhET's values.
  Everything else is derived and pinned in selfTest to
  build/projectile-data-lab/derive.py, whose printed output is
  refvals.txt.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }

   captured geometry would still lie.  Crossings are interpolated so a clipped

    for(let i=0;i<LABELS.length&&!hit;i++){

  LAUNCH_GAP:0.7,         /* MINIMUM_TIME_BETWEEN_LAUNCHES, seconds  */

  MAX_SAMPLES:200,        /* the maxSamples query parameter          */
  SAMPLE_TIME:{2:0.75,5:2,15:5,40:9}, /* SamplingField.totalSampleTime */

/* ---- the random stream: mulberry32 + Box-Muller (bit-exact twin in
   derive.py).  One pair of uniforms per normal, never cached: a draw count
   that does not depend on history is what keeps the stream reproducible. */
function pdlRng(seed){
  let a=seed>>>0;
  const R={
    next(){
      a=(a+0x6D2B79F5)>>>0;
      let t=Math.imul(a^(a>>>15),a|1);
      t=((t+Math.imul(t^(t>>>7),t|61))>>>0)^t;

    },
    gauss(){ const u1=1-R.next(), u2=R.next(); return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2); }
  };

/* ---- the trajectory --------------------------------------------------------
   y(t) = h + v sinθ t − g t²/2 = 0  ⇒  t = [v s + √(v²s² + 2gh)]/g,
   x(t) = v cosθ t  ⇒  R = (v cosθ/g)(v s + √(v²s² + 2gh)).  PhET's two
   closed forms; derive.py re-derives them and checks both against the root
   of y(t) = 0 and against a marched trajectory. */
function pdlRange(v,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th);
  return v*Math.cos(th)/PDL.G*(v*s+Math.sqrt(v*v*s*s+2*PDL.G*h));

/* the same range, multiplied through by the conjugate.  For a DOWNWARD launch
   (sin θ < 0) PhET's form adds two nearly equal numbers of opposite sign and
   loses digits — at v = 10⁶ m/s from 12 m it loses the answer entirely —
   whereas 2gh/(√(v²s²+2gh) − v s) is a quotient of positives and cannot.
   The two agree to 1e-15 over everything the sliders reach; PhET's form is the
   one the sim and derive.py evaluate, so that the bit-level pins hold. */
function pdlRangeStable(v,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th), Q=Math.sqrt(v*v*s*s+2*PDL.G*h);
  if(h===0) return s<=0?0:v*Math.cos(th)/PDL.G*2*v*s;
  return v*Math.cos(th)/PDL.G*(2*PDL.G*h)/(Q-v*s);

function pdlDRdv(v,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
  const Q=Math.sqrt(v*v*s*s+2*PDL.G*h);

function pdlMaxAngle(v,h){ return 0.5*Math.acos(PDL.G*h/(v*v+PDL.G*h))*180/Math.PI; }
/* the speed that lands at r from angle θ.  R(v) rises monotonically but from

   the range tends to h/tan|θ|, so beyond that no speed reaches r and the
   answer is null rather than a Newton step that divides by nothing. */
function pdlVStar(r,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
  if(!(c>1e-9)||!(r>0)) return null;
  if(h===0) return s<=0?null:Math.sqrt(r*PDL.G/Math.sin(2*th));
  if(s<0&&r>=h*c/(-s)) return null;
  let v=s>1e-4?Math.sqrt(r*PDL.G/Math.sin(2*th)):r*Math.sqrt(PDL.G/(2*h))/c;
  for(let i=0;i<120;i++){
    const d=pdlDRdv(v,thDeg,h);
    if(!(d>1e-12)) return null;
    const step=(pdlRange(v,thDeg,h)-r)/d;
    v=Math.max(1e-9,v-step);
    if(Math.abs(step)<1e-15*Math.max(1,v)) break;
  }
  return Math.abs(pdlRange(v,thDeg,h)-r)<1e-9*Math.max(1,r)?v:null;

/* ---- one launch, exactly PhET's createProjectile ---------------------------
   the angle first (re-drawn up to 100 times while it is outside (0°, 90°),
   and not re-drawn at all on the raised launcher, which PhET exempts), then
   the speed (re-drawn while it is ≤ 0).  Both are therefore truncated
   normals; section 4 of derive.py measures how much that truncation moves
   the answer (5.5e-8 m at worst). */
function pdlDraw(rng,cfg){
  let a=cfg.meanAng+rng.gauss()*cfg.sdAng;
  if(!cfg.raised){ let k=0; while(k<100&&(a<=0||a>=90)){ a=cfg.meanAng+rng.gauss()*cfg.sdAng; k++; } }
  const mu=cfg.meanSpeed*cfg.mult;
  let v=mu+rng.gauss()*cfg.sdSpeed;
  while(v<=0) v=mu+rng.gauss()*cfg.sdSpeed;
  return {v,ang:a};
}
function pdlConfig(mechId,sdAng,orientId,typeId,speedMean,speedSd){
  const M=MECH[mechId], O=ORIENTS.find(o=>o.id===orientId)||ORIENTS[0];
  const T=PTYPES.find(t=>t.id===typeId)||PTYPES[0];
  return {mech:mechId, sdAng, meanAng:O.ang, h:O.h, raised:O.h>0,
          mult:T.mult, meanSpeed:speedMean===undefined?M.mean:speedMean,
          sdSpeed:speedSd===undefined?M.sd:speedSd, orient:O.id, type:T.id};
}

/* ================================================================== *
 *  the exact distribution                                             *
 * ================================================================== */
/* Gauss-Legendre nodes and weights on [-1,1] by Newton on P_n (the standard
   three-term recurrence).  Computed here rather than pasted: selfTest asserts
   them against numpy's leggauss(96), which is a stronger check than a table
   of literals could be. */
function pdlGauleg(n,seed){
  const sd=seed===undefined?0.75:seed;
  const x=new Array(n), w=new Array(n), m=(n+1)>>1;
  for(let i=0;i<m;i++){
    let z=Math.cos(Math.PI*(i+sd)/(n+0.5)), pp=1, z1;
    for(let it=0;it<100;it++){
      let p1=1, p2=0;
      for(let j=0;j<n;j++){ const p3=p2; p2=p1; p1=((2*j+1)*z*p2-j*p3)/(j+1); }
      pp=n*(z*p1-p2)/(z*z-1);
      z1=z; z=z1-p1/pp;
      if(Math.abs(z-z1)<=1e-16) break;
    }
    x[i]=-z; x[n-1-i]=z;
    w[i]=2/((1-z*z)*pp*pp); w[n-1-i]=w[i];
  }
  return {x,w};
}
const GL=pdlGauleg(PDL.NGL);
const NORM=1/Math.sqrt(2*Math.PI);
function pdlPhi(z){ return NORM*Math.exp(-0.5*z*z); }
/* nodes z and weights carrying φ(z) dz over [a,b]; Σw = Φ(b) − Φ(a) */
function pdlZRule(a,b){
  const n=PDL.NGL, z=new Array(n), w=new Array(n);
  for(let i=0;i<n;i++){ z[i]=0.5*(b-a)*GL.x[i]+0.5*(a+b); w[i]=0.5*(b-a)*GL.w[i]*pdlPhi(z[i]); }
  return {z,w};
}
/* the z-interval of N(mu, sd) truncated to (lo, hi), capped at 12 sd */
function pdlZRange(mu,sd,lo,hi){
  return [lo===null?-PDL.ZCAP:Math.max(-PDL.ZCAP,(lo-mu)/sd),
          hi===null? PDL.ZCAP:Math.min( PDL.ZCAP,(hi-mu)/sd)];
}
/* the moments of the landing distance, over the SAME 96×96 product rule
   derive.py uses.  TWO passes: the mean first, then the central moments about
   it.  Assembling mu3 from the raw moments cancels five to seven digits
   (m3 ~ 2e5 against mu3 ~ 0.02) and the two languages round that cancellation
   differently — with the second pass they agree to 1e-15, and selfTest pins
   the difference between the two forms so the shortcut cannot come back. */
function pdlMomentGrid(cfg){
  const mu=cfg.meanSpeed*cfg.mult, sv=cfg.sdSpeed;
  const rv=pdlZRule.apply(null,pdlZRange(mu,sv,0,null));
  const rt=cfg.raised?pdlZRule(-PDL.ZCAP,PDL.ZCAP):pdlZRule.apply(null,pdlZRange(cfg.meanAng,cfg.sdAng,0,90));
  let wsum=0;
  for(let i=0;i<PDL.NGL;i++) for(let j=0;j<PDL.NGL;j++) wsum+=rv.w[i]*rt.w[j];
  const R=new Array(PDL.NGL*PDL.NGL), P=new Array(PDL.NGL*PDL.NGL);
  for(let j=0;j<PDL.NGL;j++){
    const th=(cfg.meanAng+cfg.sdAng*rt.z[j])*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
    for(let i=0;i<PDL.NGL;i++){
      const v=mu+sv*rv.z[i], k=j*PDL.NGL+i;
      R[k]=v*c/PDL.G*(v*s+Math.sqrt(v*v*s*s+2*PDL.G*cfg.h));
      P[k]=rv.w[i]*rt.w[j]/wsum;
    }
  }
  return {R,P};
}
function pdlMoments(cfg){
  const {R,P}=pdlMomentGrid(cfg), N=R.length;
  const m=[0,0,0,0];
  for(let k=0;k<N;k++){ let q=R[k]; m[0]+=P[k]*q; q*=R[k]; m[1]+=P[k]*q; q*=R[k]; m[2]+=P[k]*q; q*=R[k]; m[3]+=P[k]*q; }
  const mean=m[0];
  let c2=0,c3=0,c4=0;
  for(let k=0;k<N;k++){ const d=R[k]-mean, d2=d*d; c2+=P[k]*d2; c3+=P[k]*d2*d; c4+=P[k]*d2*d2; }
  return {m1:m[0],m2:m[1],m3:m[2],m4:m[3],mean,varr:c2,sd:Math.sqrt(c2),mu3:c3,mu4:c4};
}
/* the same central moments assembled from the RAW ones — kept only so
   selfTest can measure the cancellation it suffers (it is not used to draw
   or report anything) */
function pdlMomentsRaw(cfg){
  const M=pdlMoments(cfg), m1=M.m1;
  return {varr:M.m2-m1*m1, mu3:M.m3-3*m1*M.m2+2*m1*m1*m1,
          mu4:M.m4-4*m1*M.m3+6*m1*m1*M.m2-3*Math.pow(m1,4)};
}
/* memoised on the configuration: the readout, the captions and the drawing
   all ask for the same moments many times a frame, and the rule is 9216
   evaluations (about 7 ms for six configurations) */
const EXACT_CACHE={};
function pdlCfgKey(cfg){
  return [cfg.meanSpeed,cfg.sdSpeed,cfg.mult,cfg.meanAng,cfg.sdAng,cfg.h,cfg.raised?1:0].join('/');
}
function pdlExact(cfg){
  const k=pdlCfgKey(cfg);
  if(EXACT_CACHE[k]) return EXACT_CACHE[k];
  const M=pdlMoments(cfg);
  M.skew=M.mu3/Math.pow(M.sd,3); M.kurt=M.mu4/Math.pow(M.sd,4)-3;
  EXACT_CACHE[k]=M;
  return M;
}
/* the UNtruncated model in closed form, h = 0 only: R = v² sin2θ/g, and both
   E[v^2k] and E[sin^k 2θ] are exact for a normal —
   E[e^{iaθ}] = e^{iam − a²w²/2} gives every sine moment. */
function pdlClosed(mu,s,mDeg,wDeg){
  const m=mDeg*Math.PI/180, w=wDeg*Math.PI/180, g=PDL.G;
  const C=a=>Math.cos(a*m)*Math.exp(-0.5*a*a*w*w);
  const S=a=>Math.sin(a*m)*Math.exp(-0.5*a*a*w*w);
  const v2=mu*mu+s*s;
  const v4=Math.pow(mu,4)+6*mu*mu*s*s+3*Math.pow(s,4);
  const v6=Math.pow(mu,6)+15*Math.pow(mu,4)*s*s+45*mu*mu*Math.pow(s,4)+15*Math.pow(s,6);
  const v8=Math.pow(mu,8)+28*Math.pow(mu,6)*s*s+210*Math.pow(mu,4)*Math.pow(s,4)
          +420*mu*mu*Math.pow(s,6)+105*Math.pow(s,8);
  const s1=S(2), s2=0.5*(1-C(4)), s3=0.25*(3*S(2)-S(6)), s4=0.125*(3-4*C(4)+C(8));
  return [v2*s1/g, v4*s2/(g*g), v6*s3/(g*g*g), v8*s4/Math.pow(g,4)];
}
/* PhET's own spread estimate — SampleSizeThumbnailNode.calculateRangeStdDev,
   which is the first-order (delta-method) propagation through v² sin2θ/g and
   is what sets the Sampling thumbnails' x-range. */
function pdlDeltaSd(v,sdv,thDeg,sdthDeg){
  const s=thDeg*Math.PI/180, r=sdthDeg*Math.PI/180;
  const a=2*v/PDL.G*Math.sin(2*s), b=2*v*v/PDL.G*Math.cos(2*s);
  return Math.sqrt(a*a*sdv*sdv+b*b*r*r);
}
/* the exact density: f(r) = ∫ f_θ(θ) f_v(v*(r,θ))/|∂R/∂v| dθ over the
   accepted angles, on the same rule */
function pdlPdf(r,cfg,panels){
  const K=panels||PDL.NPANEL;
  const mu=cfg.meanSpeed*cfg.mult, sv=cfg.sdSpeed;
  const zr=cfg.raised?[-PDL.ZCAP,PDL.ZCAP]:pdlZRange(cfg.meanAng,cfg.sdAng,0,90);
  const rv=pdlZRule.apply(null,pdlZRange(mu,sv,0,null));
  let vw=0;
  for(let i=0;i<PDL.NGL;i++) vw+=rv.w[i];
  let tot=0, tw=0;
  for(let k=0;k<K;k++){
    const a=zr[0]+(zr[1]-zr[0])*k/K, b=zr[0]+(zr[1]-zr[0])*(k+1)/K;
    for(let j=0;j<PDL.NGL;j++){
      const z=0.5*(b-a)*GL.x[j]+0.5*(a+b), w=0.5*(b-a)*GL.w[j]*pdlPhi(z);
      tw+=w;
      const th=cfg.meanAng+cfg.sdAng*z, vs=pdlVStar(r,th,cfg.h);
      if(vs===null||!(vs>0)) continue;
      const zz=(vs-mu)/sv;
      tot+=w*(NORM*Math.exp(-0.5*zz*zz)/sv)/pdlDRdv(vs,th,cfg.h);
    }
  }
  return tot/(tw*vw);
}
/* the drawn curve is the same 201 points every frame while the launcher and
   the axis hold still, and it costs 8x96 integrand evaluations a point */
const PDF_CACHE={};
function pdlPdfCurve(cfg,lo,hi,n){
  const k=pdlCfgKey(cfg)+'/'+lo+'/'+hi+'/'+n;
  if(PDF_CACHE[k]) return PDF_CACHE[k];
  const xs=[], ys=[];
  for(let i=0;i<=n;i++){ const x=lo+(hi-lo)*i/n; xs.push(x); ys.push(pdlPdf(x,cfg)); }
  PDF_CACHE[k]={xs,ys};
  return PDF_CACHE[k];
}

/* ================================================================== *
 *  the statistics — PhET's conventions, pinned against numpy          *
 * ================================================================== */
/* PhET bins by Math.floor(x/w)*w, so a bin is [k w, (k+1) w) */
function pdlBinIndex(x,w){ return Math.floor(x/w); }
function pdlHistogram(xs,w){
  if(!xs.length) return {lo:0,counts:[],max:0,w};
  let lo=Infinity, hi=-Infinity;
  for(const x of xs){ const k=pdlBinIndex(x,w); if(k<lo) lo=k; if(k>hi) hi=k; }
  const counts=new Array(hi-lo+1).fill(0);
  for(const x of xs) counts[pdlBinIndex(x,w)-lo]++;
  let mx=0; for(const c of counts) if(c>mx) mx=c;
  return {lo,counts,max:mx,w};
}
function pdlMean(xs){ if(!xs.length) return null; let s=0; for(const x of xs) s+=x; return s/xs.length; }
/* PhET's getStandardDeviationDistance: Σ(x−x̄)²/(n−1), null below two
   projectiles.  ddof = 0 is offered beside it because the difference between
   the two conventions is exactly what a statistics sim is about. */
function pdlSd(xs,ddof){
  const d=ddof===undefined?1:ddof, n=xs.length;
  if(n<=d) return null;
  const m=pdlMean(xs);
  let s=0; for(const x of xs){ const e=x-m; s+=e*e; }
  return Math.sqrt(s/(n-d));
}
function pdlSe(xs){ const s=pdlSd(xs,1); return s===null?null:s/Math.sqrt(xs.length); }
function pdlMedian(xs){
  const n=xs.length; if(!n) return null;
  const a=xs.slice().sort((p,q)=>p-q);
  return n%2?a[(n-1)/2]:0.5*(a[n/2-1]+a[n/2]);
}
/* the interval tool: PhET counts x >= lo && x <= hi, both ends closed */
function pdlFraction(xs,lo,hi){
  if(!xs.length) return 0;
  const a=Math.min(lo,hi), b=Math.max(lo,hi);
  let k=0; for(const x of xs) if(x>=a&&x<=b) k++;
  return k/xs.length;
}
/* the probability the exact law puts in [a,b] — Simpson on the density */
function pdlProbIn(cfg,a,b,n){
  const N=(n||200)*2, dx=(b-a)/N;
  let s=0;
  for(let i=0;i<=N;i++){ const c=(i===0||i===N)?1:(i%2?4:2); s+=c*pdlPdf(a+i*dx,cfg); }
  return s*dx/3;
}

/* ================================================================== *
 *  a field: PhET's Field — one launcher, its projectiles, its stats   *
 * ================================================================== */
function fieldMake(seed,cfg){
  return {rng:pdlRng(seed),seed,cfg,landed:[],air:[],t:0,sinceLaunch:PDL.LAUNCH_GAP,
          n:0,samples:[],sampleN:0,firing:false,pending:0,size:0,lau:0,
          launched:0,tSample:0};
}
function fieldLaunch(F){
  if(F.landed.length+F.air.length>=PDL.MAX_PROJ) return null;
  const d=pdlDraw(F.rng,F.cfg);
  const p={v:d.v,ang:d.ang,x:pdlRange(d.v,d.ang,F.cfg.h),T:pdlFlight(d.v,d.ang,F.cfg.h),
           t:0,id:++F.n,type:F.cfg.type,sample:F.sampleN};
  F.air.push(p); F.sinceLaunch=0;
  return p;
}
function fieldStep(F,dt){
  F.t+=dt; F.sinceLaunch+=dt;
  let landedAny=false;
  for(let i=F.air.length-1;i>=0;i--){
    const p=F.air[i]; p.t+=dt;
    if(p.t>=p.T){ p.t=p.T; F.air.splice(i,1); F.landed.push(p); landedAny=true; }
  }
  return landedAny;
}
function fieldXs(F){ return F.landed.map(p=>p.x); }
function fieldClear(F){ F.landed.length=0; F.air.length=0; F.t=0; F.n=0;
  F.sinceLaunch=PDL.LAUNCH_GAP; F.rng=pdlRng(F.seed); F.samples.length=0; F.sampleN=0;
  F.firing=false; F.pending=0; F.launched=0; F.tSample=0; }
/* launch n at once and land them immediately (PhET's autoGenerateData) */
function fieldBatch(F,n){
  for(let k=0;k<n;k++){
    if(F.landed.length+F.air.length>=PDL.MAX_PROJ) break;
    const d=pdlDraw(F.rng,F.cfg);
    F.landed.push({v:d.v,ang:d.ang,x:pdlRange(d.v,d.ang,F.cfg.h),
                   T:pdlFlight(d.v,d.ang,F.cfg.h),t:pdlFlight(d.v,d.ang,F.cfg.h),
                   id:++F.n,type:F.cfg.type,sample:F.sampleN});
  }
}
/* starting a sample is ONE operation in ONE place: it was written twice — in
   fireField and again where continuous sampling rolls into the next one — and
   two guards on one path make each other's mutant invisible (Known-bad).  The
   field the sample will fill is emptied here and nowhere else. */
function sampleStart(F){ F.landed.length=0; F.air.length=0; F.launched=0; F.tSample=0; }
/* the interval between the launches of one sample: PhET spreads them evenly
   over totalSampleTime rather than waiting for each to land */
function sampleStep(size){ return (PDL.SAMPLE_TIME[size]||2)/size; }
/* the Sampling screen: one sample is `size` launches, and its MEAN is the
   datum that goes into the histogram (PhET's SamplingField.getHistogramData) */
function sampleBatch(F,size,count){
  const out=[];
  for(let k=0;k<count&&F.samples.length<PDL.MAX_SAMPLES;k++){
    const xs=[], ps=[];
    for(let i=0;i<size;i++){
      const d=pdlDraw(F.rng,F.cfg), T=pdlFlight(d.v,d.ang,F.cfg.h);
      const p={v:d.v,ang:d.ang,x:pdlRange(d.v,d.ang,F.cfg.h),T,t:T,id:++F.n,
               type:F.cfg.type,sample:F.sampleN+1};
      xs.push(p.x); ps.push(p);
    }
    F.sampleN++;
    F.samples.push({n:F.sampleN,xs,mean:pdlMean(xs)});
    /* the field shows the LAST sample, which is the one whose mean just
       joined the histogram — a field strip with nothing on it is a view that
       draws nothing */
    F.landed=ps; F.size=size;
    out.push(F.samples[F.samples.length-1]);
  }
  return out;
}
function sampleMeans(F){ return F.samples.map(s=>s.mean); }

/* ================================================================== *
 *  state: the six views, their worlds (one per PhET screen, plus the  *
 *  two analysis views), the per-view model, readout, eqbar, tag       *
 * ================================================================== */
const TABS=[['field','the field'],['sources','the sources'],['measures','the measures'],
            ['sampling','the sampling'],['exact','the exact law'],['clt','the limit theorem']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', text:'#aeb6c6', sky:'#0a1020', ground:'#141d16', bar:'#6c9cff',
           /* the six mystery launchers keep their own colour slots rather than
              borrowing a role colour (Known-bad: a new curve needs its own) */
           lau:['#e6c84a','#4fb0c6','#d76a9b','#7fc97f','#9b8ee0','#59a6d8'],
           /* the four sample sizes keep their own slots, none of them the
              reference orange the σ/√n curve owns */
           sizes:['#6c9cff','#38c6b4','#b8ec4c','#a98ae8']};
const RO_W=300;
const MODES=[{id:'single',name:'single'},{id:'continuous',name:'continuous'}];
const BINSTRAT=[{id:'binWidth',name:'bin width'},{id:'totalBins',name:'total bins'}];
const BINW_LIST=PDL.BINW.map(w=>({id:w,name:w+' m'}));
const NBINS_LIST=PDL.NBINS.map(n=>({id:n,name:''+n}));
const LAU_LIST=LAUNCHERS.map(l=>({id:l.n,name:''+l.n}));
const FIELD_LIST=[1,2,3,4,5,6].map(n=>({id:n,name:''+n}));
const SIZE_LIST=PDL.SIZES.map(n=>({id:n,name:'n = '+n}));
const MECH_CHIPS=MECH_LIST.map(m=>({id:m.id,name:m.name}));
const TYPE_CHIPS=PTYPES.map(t=>({id:t.id,name:t.name}));
const ORIENT_CHIPS=ORIENTS.map(o=>({id:o.id,name:o.name}));
const SRC_CHIPS=[{id:'mystery',name:'mystery'},{id:'custom',name:'custom'}];
const SEEDS={field:9101,sources:9201,measures:9301,sampling:9401,exact:9501,clt:9601};

const DEFAULTS={view:'field', running:true, speedUp:false,
  /* the field (Variability) */
  fld:1, lau:1, mode:'single', paths:true, showAng:false, showSpd:false,
  binStrat:'binWidth', binW:1, nBins:10, blocks:true,
  /* the sources */
  mech:'spring', stab:0.5, ptype:'cannonball', orient:'angle30', sMode:'single',
  /* the measures */
  mSrc:'mystery', mLau:2, showMean:true, showSd:true, showValues:false,

const ST=Object.assign({},DEFAULTS);

/* ---- the worlds ------------------------------------------------------------ */
const WORLD={};
function cfgMystery(n,orientId,typeId){
  const L=LAUNCHERS[n-1];
  return pdlConfig(L.mech,L.sdAng,orientId||'angle30',typeId||'cannonball');
}
function cfgCustom(st){
  return pdlConfig(st.mech,pdlSdOfStab(st.stab),st.orient,st.ptype);
}
function makeWorld(view,st){
  if(view==='field'){
    const w={fields:[]};
    for(let i=0;i<PDL.N_FIELDS;i++){
      const F=fieldMake(SEEDS.field+i,cfgMystery(i+1));
      F.lau=i+1;
      /* the fields open with data in them: a view that draws nothing is a
         defect in this collection, and the six unequal spreads are the
         point of the screen */
      fieldBatch(F,[40,40,40,40,40,40][i]);
      w.fields.push(F);
    }
    return w;
  }
  if(view==='sources'){
    const F=fieldMake(SEEDS.sources,cfgCustom(st)); fieldBatch(F,60);
    return {F};
  }
  if(view==='measures'){
    const F=fieldMake(SEEDS.measures,st.mSrc==='custom'?cfgCustom(st):cfgMystery(st.mLau));
    fieldBatch(F,80);
    return {F};
  }
  if(view==='sampling'){
    const w={fields:{}};
    return w;
  }
  if(view==='exact'){
    const F=fieldMake(SEEDS.exact,cfgMystery(st.xLau,st.xOrient)); fieldBatch(F,st.xN);
    return {F};
  }
  /* the limit theorem: M samples at each of the four sample sizes, drawn once
     from one stream so the four columns are comparable */
  const w={sets:null};
  return w;
}
function worldOf(view){ if(!WORLD[view]) WORLD[view]=makeWorld(view,ST); return WORLD[view]; }
function resetWorld(view){ WORLD[view]=makeWorld(view,ST); return WORLD[view]; }
function resetAllWorlds(){ for(const k in WORLD) delete WORLD[k]; }
/* the Sampling screen keeps one field per (launcher, sample size), as PhET
   does — 24 of them, made when first asked for */
function sampField(st){
  const w=worldOf('sampling'), key=st.pLau+'/'+st.pN;
  if(!w.fields[key]){
    const F=fieldMake(SEEDS.sampling+st.pLau*100+st.pN,cfgMystery(st.pLau));
    F.size=st.pN; sampleBatch(F,st.pN,30);
    w.fields[key]=F;
  }
  return w.fields[key];
}
function curField(st){
  if(st.view==='field') return worldOf('field').fields[st.fld-1];
  if(st.view==='sources') return worldOf('sources').F;
  if(st.view==='measures') return worldOf('measures').F;
  if(st.view==='sampling') return sampField(st);
  if(st.view==='exact') return worldOf('exact').F;
  return null;
}
/* the limit-theorem experiment: cM samples at each size, from one stream */
function cltSets(st){
  const w=worldOf('clt');
  if(w.sets&&w.lau===st.cLau&&w.M===st.cM) return w.sets;
  const cfg=cfgMystery(st.cLau), rng=pdlRng(SEEDS.clt+st.cLau);
  const sets=PDL.SIZES.map(n=>{
    const means=[];
    for(let k=0;k<st.cM;k++){
      let s=0;
      for(let i=0;i<n;i++){ const d=pdlDraw(rng,cfg); s+=pdlRange(d.v,d.ang,cfg.h); }
      means.push(s/n);
    }
    return {n,means,mean:pdlMean(means),sd:pdlSd(means,1)};
  });
  w.sets=sets; w.lau=st.cLau; w.M=st.cM; w.exact=pdlExact(cfg);
  return sets;
}

/* ---- the clock -------------------------------------------------------------
   one frame is 1/60 s of flight; PhET's "fast" is 6x (TIME_SPEED_FAST) */
const FRAME_DT=1/60;
function viewDt(st){ return FRAME_DT*(st.speedUp?PDL.TIME_SPEED_FAST||6:1); }
function fieldMode(st){ return st.view==='sources'?st.sMode:(st.view==='sampling'?st.pMode:st.mode); }
function worldStep(st,dt){
  const F=curField(st);
  if(!F) return false;
  let moved=fieldStep(F,dt);
  if(F.firing){
    if(st.view==='sampling'){
      /* PhET's pace: the n launches are spread evenly over totalSampleTime
         and their flights overlap; the sample completes when the last lands */
      F.tSample+=dt;
      const step=sampleStep(F.size);
      while(F.launched<F.size&&F.tSample>=F.launched*step){ fieldLaunch(F); F.launched++; moved=true; }
      if(F.launched>=F.size&&F.air.length===0){
        const xs=F.landed.slice(-F.size).map(p=>p.x);
        F.sampleN++; F.samples.push({n:F.sampleN,xs,mean:pdlMean(xs)});
        F.firing=fieldMode(st)==='continuous'&&F.samples.length<PDL.MAX_SAMPLES;
        if(F.firing) sampleStart(F); else { F.launched=0; F.tSample=0; }
        moved=true;
      }
    } else if(F.sinceLaunch>=PDL.LAUNCH_GAP){
      fieldLaunch(F); moved=true;
      if(fieldMode(st)==='single') F.firing=false;
      if(F.landed.length+F.air.length>=PDL.MAX_PROJ) F.firing=false;
    }
  }
  return moved||F.air.length>0;
}
function fireField(st){
  const F=curField(st); if(!F) return;
  if(st.view==='sampling'){
    if(F.firing){ F.firing=false; F.launched=0; F.tSample=0; return; }
    if(F.samples.length>=PDL.MAX_SAMPLES) return;
    F.firing=true; sampleStart(F);
    return;
  }
  if(F.firing&&fieldMode(st)==='continuous'){ F.firing=false; return; }
  F.firing=true; F.sinceLaunch=PDL.LAUNCH_GAP;
}

/* ---- the model each view and the readout read ------------------------------ */
function binWidthOf(st){ return st.binStrat==='binWidth'?st.binW:PDL.FIELD/st.nBins; }
/* a 1-2-5 step near x, for an axis whose bin width has to follow the data */
function niceStep(x){
  if(!(x>0)) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(x))), n=x/e;
  return (n<1.5?1:n<3.5?2:n<7.5?5:10)*e;
}
function statsOf(xs){
  return {n:xs.length, mean:pdlMean(xs), median:pdlMedian(xs),
          sd1:pdlSd(xs,1), sd0:pdlSd(xs,0), se:pdlSe(xs),
          min:xs.length?Math.min.apply(null,xs):null, max:xs.length?Math.max.apply(null,xs):null};
}
function buildModel(){
  const st=ST, view=st.view;
  const M={view,st};
  if(view==='field'){
    const w=worldOf('field'); M.fields=w.fields; M.F=w.fields[st.fld-1];
    M.cfg=M.F.cfg; M.lau=M.F.lau;
  } else if(view==='sources'){
    M.F=worldOf('sources').F; M.cfg=M.F.cfg; M.lau=null;
  } else if(view==='measures'){
    M.F=worldOf('measures').F; M.cfg=M.F.cfg; M.lau=st.mSrc==='mystery'?st.mLau:null;
  } else if(view==='sampling'){
    M.F=sampField(st); M.cfg=M.F.cfg; M.lau=st.pLau;
    M.means=sampleMeans(M.F); M.mstat=statsOf(M.means);
  } else if(view==='exact'){
    M.F=worldOf('exact').F; M.cfg=M.F.cfg; M.lau=st.xLau;
  } else {
    M.sets=cltSets(st); M.exact=worldOf('clt').exact; M.lau=st.cLau; M.cfg=cfgMystery(st.cLau);
  }
  if(M.F){
    M.xs=fieldXs(M.F);
    M.stat=statsOf(M.xs);
    /* the exact-law view is about the SHAPE, and it does not show the bin
       chips, so its bins follow the distribution rather than whatever the
       other screens were last set to: a control the view hides must not
       still be deciding its picture */
    M.binW=view==='exact'?niceStep(pdlExact(M.cfg||cfgMystery(st.xLau,st.xOrient)).sd/4):binWidthOf(st);
    M.hist=pdlHistogram(M.xs,M.binW);
    M.frac=pdlFraction(M.xs,st.e1,st.e2);
  }
  if(M.cfg){
    M.exact=M.exact||pdlExact(M.cfg);
    const mu=M.cfg.meanSpeed*M.cfg.mult;
    M.naive=M.cfg.h>0?null:mu*mu*Math.sin(2*M.cfg.meanAng*Math.PI/180)/PDL.G;
    M.delta=M.cfg.h>0?null:pdlDeltaSd(mu,M.cfg.sdSpeed,M.cfg.meanAng,M.cfg.sdAng);
  }
  if(view==='exact') M.probIn=pdlProbIn(M.cfg,st.e1,st.e2,60);
  return M;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function mfmt(x,n){ return x===null||x===undefined||!isFinite(x)?'—':fmt(x,n===undefined?2:n)+' m'; }
function launcherLabel(M){
  if(M.lau) return 'mystery launcher '+M.lau+' ('+MECH[LAUNCHERS[M.lau-1].mech].name+')';
  return 'custom launcher ('+MECH[M.cfg.mech].name+')';
}
function readoutHTML(M){
  const st=M.st;
  let s='<div class="rname">projectile data lab<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  if(M.view==='clt'){
    s+=hd('one launch, exactly')+rrow('launcher',M.lau)
      +rrow('mean &mu;',mfmt(M.exact.mean,3),'good')
      +rrow('standard deviation &sigma;',mfmt(M.exact.sd,4),'good')
      +rrow('skewness, excess kurtosis',fmt(M.exact.skew,4)+', '+fmt(M.exact.kurt,4));
    s+=hd(st.cM+' samples at each size');
    M.sets.forEach(S=>{
      const want=M.exact.sd/Math.sqrt(S.n);
      s+=rrow('n = '+S.n+': measured SE',mfmt(S.sd,4),'good')
        +rrow('&nbsp;&nbsp;&sigma;/&radic;n',mfmt(want,4))
        +rrow('&nbsp;&nbsp;difference, in its own sd',fmt((S.sd-want)/(want*Math.sqrt(((M.exact.kurt/S.n)+2)/(4*st.cM))),2));
    });
    s+='</table><div class="note">The sampling sd of a standard error measured over M samples is &sigma;<sub>n</sub>&radic;((&kappa;<sub>n</sub>+2)/4M), with &kappa;<sub>n</sub> = &kappa;/n the excess kurtosis of the mean &mdash; that is the tolerance, computed rather than chosen.</div>';
    return s;
  }
  const S=M.stat;
  s+=hd(launcherLabel(M))
    +rrow('mean launch speed',fmt(M.cfg.meanSpeed*M.cfg.mult,2)+' &plusmn; '+fmt(M.cfg.sdSpeed,2)+' m/s')
    +rrow('launch angle',fmt(M.cfg.meanAng,0)+'&deg; &plusmn; '+fmt(M.cfg.sdAng,2)+'&deg;')
    +rrow('launch height',fmt(M.cfg.h,0)+' m');
  s+=hd('the exact law behind it')
    +rrow('mean distance &mu;',mfmt(M.exact.mean,3),'good')
    +rrow('standard deviation &sigma;',mfmt(M.exact.sd,4),'good')
    +(M.naive===null?'':rrow('v&sup2; sin2&theta;/g (no jitter)',mfmt(M.naive,3)))
    +(M.delta===null?'':rrow('PhET&rsquo;s delta-method &sigma;',mfmt(M.delta,4)));
  if(M.view==='sampling'){
    const q=M.mstat;
    s+=hd('samples of n = '+st.pN)
      +rrow('samples completed',q.n+' of '+PDL.MAX_SAMPLES)
      +rrow('mean of the sample means',mfmt(q.mean,3),'good')
      +rrow('sd of the sample means',mfmt(q.sd1,4),'good')
      +rrow('&sigma;/&radic;n (the standard error)',mfmt(M.exact.sd/Math.sqrt(st.pN),4))
      +rrow('this sample&rsquo;s mean',M.F.samples.length?mfmt(M.F.samples[M.F.samples.length-1].mean,3):'—','good');
    s+='</table><div class="note">Each sample contributes ONE point to the histogram: its mean. The spread of those points is the standard error, and it shrinks as 1/&radic;n &mdash; see <b>the limit theorem</b>.</div>';
    return s;
  }
  s+=hd(S.n+' landed'+(M.F.air.length?' (+'+M.F.air.length+' in flight)':''))
    +rrow('mean x&#772;',mfmt(S.mean,3),'good')
    +rrow('median',mfmt(S.median,3),'good')
    +rrow('standard deviation s (n&minus;1)',mfmt(S.sd1,4),'good')
    +rrow('the n convention, for contrast',mfmt(S.sd0,4))
    +rrow('standard error s/&radic;n',mfmt(S.se,4))
    +rrow('smallest, largest',S.n?fmt(S.min,2)+', '+fmt(S.max,2)+' m':'—');
  if(M.view==='measures'||M.view==='exact'){
    s+=hd('the interval tool')
      +rrow('from, to',fmt(Math.min(st.e1,st.e2),1)+', '+fmt(Math.max(st.e1,st.e2),1)+' m')
      +rrow('width',mfmt(Math.abs(st.e2-st.e1),1))
      +rrow('of the data inside',fmt(100*M.frac,1)+'%','good')
      +(M.view==='exact'?rrow('the exact law says',fmt(100*M.probIn,1)+'%'):'');
  }
  s+=hd('the histogram')
    +rrow('bin width',fmt(M.binW,2)+' m'+(M.view==='exact'?' (&sigma;/4, rounded)'
      :(st.binStrat==='totalBins'?' (100/'+st.nBins+')':'')))
    +rrow('bins with data, tallest',M.hist.counts.length+', '+M.hist.max);
  s+='</table><div class="note">'+(S.n<2?'The standard deviation needs two projectiles: PhET returns nothing below that, and so does this.'
    :'PhET divides by n &minus; 1, not n; at n = '+S.n+' that is a factor '+fmt(Math.sqrt(S.n/(S.n-1)),5)+'. Both are shown so the difference is visible rather than assumed.')+'</div>';
  return s;
}
function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='field') return E('x = <span class="hl">(v cos&theta;/g)</span> (v sin&theta; + &radic;(v&sup2;sin&sup2;&theta; + 2gh)) &nbsp;&middot;&nbsp; h = 0: x = v&sup2; sin2&theta;/g',
    'one launch, one distance — the scatter in the histogram is the scatter in v and θ, nothing else');
  if(M.view==='sources') return E('&sigma;<sub>x</sub>&sup2; &asymp; <span class="hl">(&part;x/&part;v)&sup2; &sigma;<sub>v</sub>&sup2;</span> + <span class="hl2">(&part;x/&part;&theta;)&sup2; &sigma;<sub>&theta;</sub>&sup2;</span>, &nbsp; &part;x/&part;v = 2v sin2&theta;/g, &nbsp; &part;x/&part;&theta; = 2v&sup2; cos2&theta;/g',
    'two sources of variability: the mechanism sets σ_v, the angle stabiliser sets σ_θ — and at 45° the angle term switches off');
  if(M.view==='measures') return E('x&#772; = &Sigma;x<sub>i</sub>/n &nbsp;&middot;&nbsp; <span class="hl">s = &radic;(&Sigma;(x<sub>i</sub>&minus;x&#772;)&sup2;/(n&minus;1))</span> &nbsp;&middot;&nbsp; SE = s/&radic;n',
    'PhET’s conventions: the mean, the n − 1 standard deviation, and the interval tool’s count of x in [a, b]');
  if(M.view==='sampling') return E('x&#772; = <span class="hl">(1/n) &Sigma;<sub>i=1</sub><sup>n</sup> x<sub>i</sub></span> &nbsp;&rArr;&nbsp; E[x&#772;] = &mu;, &nbsp; <span class="hl2">sd(x&#772;) = &sigma;/&radic;n</span>',
    'one dot per sample, and the dot is its mean: the sampling distribution of the sample mean');
  if(M.view==='exact') return E('f<sub>X</sub>(r) = <span class="hl">&int; f<sub>&theta;</sub>(&theta;) f<sub>v</sub>(v*(r,&theta;)) / |&part;x/&part;v| d&theta;</span>, &nbsp; x(v*,&theta;) = r',
    'the density of the landing distance, computed from the two input Gaussians rather than sampled');
  return E('E[x&#772;] = &mu; &nbsp;&middot;&nbsp; <span class="hl">sd(x&#772;) = &sigma;/&radic;n</span> &nbsp;&middot;&nbsp; skew(x&#772;) = skew(x)/&radic;n',
    'the central limit theorem: the mean of n draws is centred on μ, narrower by √n, and closer to a normal');
}
function tagHTML(M){
  const p=t=>'<b>'+t+'</b> — ';
  if(M.view==='field') return p('the field')+'PhET&rsquo;s Variability screen: field '+M.st.fld+', '+launcherLabel(M);
  if(M.view==='sources') return p('the sources')+'PhET&rsquo;s Sources screen: '+MECH[M.cfg.mech].name+', angle &plusmn;'+fmt(M.cfg.sdAng,2)+'&deg;, '+M.cfg.type;
  if(M.view==='measures') return p('the measures')+'PhET&rsquo;s Measures screen: mean, standard deviation and the interval tool';
  if(M.view==='sampling') return p('the sampling')+'PhET&rsquo;s Sampling screen: samples of n = '+M.st.pN+' from launcher '+M.st.pLau;
  if(M.view==='exact') return p('the exact law')+'the density PhET&rsquo;s mechanism implies, against '+M.stat.n+' launches';
  return p('the limit theorem')+'the standard error against &sigma;/&radic;n at n = 2, 5, 15 and 40';
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the shared picture: a 100 m field with a launcher on it, and the   *
 *  histogram of landing distance under it on the SAME x axis — which  *
 *  is PhET's layout and the whole point of the screen                 *
 * ================================================================== */
/* the house #hint sits at bottom:11px, on top of the last line of a caption
   anchored at H - 12: every caption here ends HINT_H higher, clear of it */
const HINT_H=18;
/* the room a panel needs below itself: ticks only, and ticks plus an x title */
const AX_PAD=22, AX_PAD_LAB=38;
/* tick labels follow the tick SPACING, not a fixed decimal count (Known-bad:
   fmt(t,2) prints 318.00 whatever the range, and six of those do not fit) */
function tickFmt(ticks){
  let g=Infinity; for(let i=1;i<ticks.length;i++) g=Math.min(g,Math.abs(ticks[i]-ticks[i-1]));
  if(!isFinite(g)||g<=0) return v=>sigf(v,3);
  let d=0; while(d<6&&Math.abs(Math.round(g*Math.pow(10,d))-g*Math.pow(10,d))>1e-6*Math.max(1,g*Math.pow(10,d))) d++;
  return v=>fmt(Math.abs(v)<1e-12?0:v,d);
}
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  /* a 10.5 px label is 12 px tall and up to ~48 px wide, so the tick count is
     capped by the panel: a 52 px histogram asked for four y ticks and drew
     them 13 px apart, which the layout sweep caught as an overlap */
  const nyMax=Math.max(2,Math.floor(b.h/26)), nxMax=Math.max(2,Math.floor(b.w/56));
  if(o.xticks===undefined) o.xticks=ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),Math.min(o.nx||6,nxMax));
  if(o.yticks===undefined) o.yticks=ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),Math.min(o.ny||5,nyMax));
  if(!o.xfmt) o.xfmt=tickFmt(o.xticks);
  if(!o.yfmt) o.yfmt=tickFmt(o.yticks);
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  const tw=t=>plain(t).length*10.5*0.52, th=12;
  for(const t of o.xticks){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=tw(o.xfmt(t)); LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+th]);
  }
  for(const t of o.yticks){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=tw(o.yfmt(t)); LABELS.push([b.x-6-w,Y-th/2,b.x-6,Y+th/2]);
  }
  if(o.xlab){ const w=tw(o.xlab); LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+th]); }
}
function pl(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){ polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash); }
/* legendAuto records its text box in LEGEND_RECTS (for the curve check) but
   NOT in LABELS, so a note drawn afterwards has no idea it is there and lands
   on it.  Register it. */
function legendReg(ctx,b,items){
  const r=legendAuto(ctx,b,items);
  if(r) LABELS.push([r.x,r.y,r.x1,r.y1]);
  return r;
}
/* logTicks() gives whole decades only, and this axis spans 1.1 of them: it
   returned ONE tick and the panel had no scale.  1-2-5 per decade instead. */
function logTicks125(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  for(let e=Math.floor(Math.log10(lo))-1;e<=Math.ceil(Math.log10(hi))+1;e++)
    for(const m of [1,2,5]){ const v=m*Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out.sort((a,b)=>a-b);
}

/* ---- the stage split: a field strip on top, a histogram under it ---------- */
function labStage(ctx,W,H,capFull,capShort,opt){
  const o=opt||{};
  const narrow=isNarrow(W), left=54, right=narrow?W-22:W-RO_W-40;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+28;
  const fit=fitCaption(ctx,W,H-HINT_H,capFull,capShort,capW,top+200);
  const avail=Math.max(150,fit.capY-16-top);
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[],top,avail};
  /* axes() puts its x tick labels at b.y1 + 5 and its x axis title at
     b.y1 + 21, so a panel needs AX_PAD below it or the labels land in the
     caption — which is exactly how the first sweep failed */
  /* a narrow stage cannot carry a row of small panels: below 900 px the
     bottom row is dropped to one, or to none where it was a set of four
     (pupil_plane Known-bad — a 32 px panel with a 170 px legend is
     off-canvas by construction).  Every view checks L.bottom.length. */
  const nB=narrow?Math.min(o.nBottomNarrow===undefined?(o.nBottom>1?0:o.nBottom||0):o.nBottomNarrow,o.nBottom||0)
                 :(o.nBottom||0);
  let rowH=0;
  if(nB>0){
    rowH=Math.max(90,Math.floor(avail*0.30));
    const gut=Math.max(30,Math.min(50,(right-left)*0.055)), span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),top+avail-rowH+10,w,rowH-10-AX_PAD));
  }
  const bodyH=avail-(nB>0?rowH+14:0);
  if(o.histFrac===undefined){ out.main=box(left,top,right-left,Math.max(60,bodyH-AX_PAD_LAB)); return out; }
  /* from the bottom up: the x labels first, then the histogram, then whatever
     is left for the field — never the other way round */
  const inner=Math.max(100,bodyH-34-AX_PAD_LAB);
  let histH=Math.max(52,Math.round(inner*o.histFrac));
  let fh=inner-histH;
  /* a 30° trajectory tops out at 10 m over a 100 m field, so at true aspect it
     needs a tenth of the width and no more: giving it half the stage leaves
     two thirds of the picture as empty sky.  The view says how tall it wants
     to be; whatever it does not use goes to the histogram. */
  if(o.fieldWant){
    const want=o.fieldWant(right-left);
    if(want<fh){ histH=Math.min(inner-Math.max(90,want),Math.round(inner*0.62)); fh=inner-histH; }
  }
  if(fh<64){ fh=Math.max(40,Math.min(64,inner-40)); histH=inner-fh; }
  out.field=box(left,top,right-left,fh);
  out.hist=box(left,top+fh+34,right-left,histH);
  return out;
}
/* the field's own map: ONE scale for both axes wherever it fits (the picture
   is a trajectory, and a trajectory's shape is the thing being drawn), with
   the compression printed on the canvas when a narrow stage cannot afford it */
function fieldApex(cfg){
  return cfg.h+Math.pow(cfg.meanSpeed*cfg.mult*Math.sin((cfg.meanAng+2.5*cfg.sdAng)*Math.PI/180),2)/(2*PDL.G);
}
/* the field height that puts the trajectory at true aspect on a stage w wide */
function fieldWantH(M){ return w=>Math.max(4,fieldApex(M.cfg)*1.14)*(w/PDL.FIELD)+32; }
function fieldMap(b,M){
  const sx=b.w/PDL.FIELD;
  const apex=fieldApex(M.cfg);
  const ymax=Math.max(4,apex*1.14);
  const ground=Math.min(26,Math.max(12,b.h*0.14));
  const sy=Math.min(sx,(b.h-ground-6)/ymax);
  const y0=b.y1-ground;
  return {sx,sy,ratio:sy/sx,y0,ymax,ground,X:x=>b.x+sx*x,Y:y=>y0-sy*y,
          wx:X=>(X-b.x)/sx, wy:Y=>(y0-Y)/sy};
}
/* the six field markers PhET paints every 10 m (FIELD_LABEL_INCREMENT) */
function drawGround(ctx,b,map){
  ctx.fillStyle=COL.sky; ctx.fillRect(b.x,b.y,b.w,map.y0-b.y);
  ctx.fillStyle=COL.ground; ctx.fillRect(b.x,map.y0,b.w,b.y1-map.y0);
  ctx.strokeStyle='#2e3a46'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(b.x,map.y0+0.5); ctx.lineTo(b.x1,map.y0+0.5); ctx.stroke();
  ctx.font=SM_FONT; ctx.textAlign='center'; ctx.textBaseline='top';
  /* PhET numbers every 10 m; a narrow stage gets every 20 or 25 instead, so
     the labels never touch */
  const step=map.sx*10>=34?10:(map.sx*20>=34?20:25);
  for(let d=0;d<=PDL.FIELD;d+=10){
    const X=map.X(d);
    ctx.strokeStyle=d%50===0?'#4a5a66':'#2b343e'; ctx.lineWidth=d%50===0?1.4:1;
    ctx.beginPath(); ctx.moveTo(X,map.y0); ctx.lineTo(X,b.y1-11); ctx.stroke();
    if(d%step===0){ ctx.fillStyle='#78838f'; ctx.fillText(''+d,X,b.y1-10);
      /* registered, so a value label placed later dodges the marker rather
         than being shifted on top of it */
      const w=(''+d).length*10.5*0.52; LABELS.push([X-w/2,b.y1-10,X+w/2,b.y1+2]); }
  }
}
/* the launcher: a frame, a barrel at the mean angle, and (on the raised
   orientation) the 12 m tower PhET's model puts it on */
function drawLauncher(ctx,map,M){
  const cfg=M.cfg, X0=map.X(0), Y0=map.Y(cfg.h);
  const col=M.lau?COL.lau[M.lau-1]:COL.struct;
  if(cfg.h>0){
    ctx.fillStyle='#233041'; ctx.fillRect(X0-7,Y0,14,map.y0-Y0);
    ctx.strokeStyle='#3b4a5c'; ctx.lineWidth=1; ctx.strokeRect(X0-7.5,Y0+0.5,15,map.y0-Y0);
  }
  const th=cfg.meanAng*Math.PI/180, L=Math.max(16,Math.min(34,map.sx*3.2));
  ctx.strokeStyle=col; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X0+L*Math.cos(th),Y0-L*Math.sin(th)); ctx.stroke();
  ctx.lineCap='butt';
  /* the spread: the mean angle ± 2 sd, drawn as a fan so an unequal launcher
     announces itself before a single shot is fired */
  ctx.strokeStyle=rgba(col,0.35); ctx.lineWidth=1.2;
  for(const k of [-2,2]){
    const a=(cfg.meanAng+k*cfg.sdAng)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X0+L*1.25*Math.cos(a),Y0-L*1.25*Math.sin(a)); ctx.stroke();
  }
  dot(ctx,X0,Y0,4.5,col,'#0a0c12',1.2);
}
/* one projectile's path, from the launcher to where it is now */
function drawPath(ctx,map,cfg,p,col,alpha,lw){
  const n=26, T=Math.min(p.t,p.T);
  const xs=[], ys=[];
  for(let i=0;i<=n;i++){
    const t=T*i/n;
    xs.push(p.v*Math.cos(p.ang*Math.PI/180)*t);
    ys.push(pdlHeight(p.v,p.ang,cfg.h,t));
  }
  ctx.beginPath();
  for(let i=0;i<=n;i++){ const X=map.X(xs[i]), Y=map.Y(Math.max(0,ys[i])); if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }
  ctx.strokeStyle=rgba(col,alpha); ctx.lineWidth=lw||1.2; ctx.stroke();
}
/* the launch-angle and launch-speed flags: PhET marks each landed projectile
   with the value it flew at; here the marker carries a tick coloured on the
   house scalar ramp, with the range named in the caption */
function flagRange(xs,key){
  let lo=Infinity, hi=-Infinity;
  for(const p of xs){ const v=p[key]; if(v<lo) lo=v; if(v>hi) hi=v; }
  if(!isFinite(lo)) return null;
  if(hi-lo<1e-9){ lo-=0.5; hi+=0.5; }
  return [lo,hi];
}
function drawField(ctx,b,M,opt){
  const o=opt||{}, st=M.st, map=fieldMap(b,M), cfg=M.cfg;
  drawGround(ctx,b,map);
  const col=M.lau?COL.lau[M.lau-1]:COL.struct;
  /* the landed projectiles */
  const key=st.showAng?'ang':(st.showSpd?'v':null);
  const rng=key?flagRange(M.F.landed,key):null;
  const r=Math.max(2,Math.min(4.2,map.sx*0.38));
  for(const p of M.F.landed){
    const X=map.X(p.x), Y=map.y0;
    if(key&&rng){
      const t=clamp((p[key]-rng[0])/(rng[1]-rng[0]),0,1);
      ctx.strokeStyle=neonCss(t); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(X,Y-2); ctx.lineTo(X,Y-2-9*(0.35+0.65*t)); ctx.stroke();
    }
    dot(ctx,X,Y-r*0.6,r,rgba(col,0.5),null);
  }
  /* the paths, then the airborne projectiles */
  if(st.paths) for(const p of M.F.landed.slice(-14)) drawPath(ctx,map,cfg,p,col,0.16,1);
  for(const p of M.F.air){
    if(st.paths) drawPath(ctx,map,cfg,p,COL.live,0.85,1.5);
    const X=map.X(p.v*Math.cos(p.ang*Math.PI/180)*p.t), Y=map.Y(Math.max(0,pdlHeight(p.v,p.ang,cfg.h,p.t)));
    dot(ctx,X,Y,4,COL.live,'#fff',1);
  }
  drawLauncher(ctx,map,M);
  /* the exact mean, drawn on the field itself */
  if(o.showExactMean!==false){
    const X=map.X(M.exact.mean);
    ctx.strokeStyle=rgba(COL.ref,0.8); ctx.lineWidth=1.3; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(X,b.y+6); ctx.lineTo(X,map.y0); ctx.stroke(); ctx.setLineDash([]);
    /* an unlabelled dashed rule in the same family of colours as the shots is
       a question, not an answer */
    lab(ctx,b.x1+2,b.y1+2,X+5,b.y+8,'μ = '+fmt(M.exact.mean,2)+' m, exact',COL.ref,SM_FONT,'left','top');
  }
  return map;
}
/* the histogram: PhET's two representations, blocks (one square per
   projectile) and bars (one rectangle per bin), on the field's own x axis */
function drawHist(ctx,b,M,opt){
  const o=opt||{}, st=M.st, w=M.binW, H=o.hist||M.hist;
  const ymaxRaw=Math.max(4,H.max);
  const ymax=o.ymax||Math.ceil(ymaxRaw*1.18);
  const xlo=0, xhi=o.xhi===undefined?PDL.FIELD:o.xhi, xlo2=o.xlo===undefined?0:o.xlo;
  axesT(ctx,b,xlo2,xhi,0,ymax,{title:o.title||'landing distance, metres',
    xlab:o.xlab===undefined?'x, m':o.xlab, ylab:o.ylab===undefined?'count':o.ylab, nx:o.nx||6, ny:4});
  const px=x=>b.x+b.w*(x-xlo2)/(xhi-xlo2), py=y=>b.y1-b.h*y/ymax;
  const bw=Math.max(1.5,b.w*w/(xhi-xlo2));
  for(let i=0;i<H.counts.length;i++){
    const c=H.counts[i]; if(!c) continue;
    const x0=(H.lo+i)*w;
    const X=px(x0);
    if(X+bw<b.x-1||X>b.x1+1) continue;
    const col=o.col||COL.pos;
    if(st.blocks&&bw>=3.5&&c<=ymax&&b.h/ymax>=5){
      /* PhET's "blocks" representation: one cell per projectile.  The gap
         between cells is a FRACTION of the cell, not a fixed 1.2 px — at a
         40 px cell a hairline gap reads as one solid bar, which is the bar
         representation wearing the other one's name. */
      const cellH=b.h/ymax, gap=clamp(0.18*cellH,2.2,7), gx=Math.min(gap,bw*0.3);
      for(let k=0;k<c;k++){
        const Y=py(k+1);
        ctx.fillStyle=rgba(col,0.82);
        ctx.fillRect(Math.max(b.x,X)+gx/2,Y+gap/2,Math.min(bw-gx,b.x1-X-gx),Math.max(1.5,cellH-gap));
      }
      POLY_SEGS.push(Math.max(b.x,X),py(c),Math.min(b.x1,X+bw),py(c));
    } else {
      ctx.fillStyle=rgba(col,0.72);
      const X0=Math.max(b.x,X), X1=Math.min(b.x1,X+bw);
      if(X1>X0){ ctx.fillRect(X0,py(c),X1-X0,b.y1-py(c)); POLY_SEGS.push(X0,py(c),X1,py(c)); }
    }
  }
  return {px,py,ymax};
}
/* the mean marker, the ±1 sd bar and the values, as PhET's DataMeasuresOverlay
   draws them — on the histogram, above the bars */
function drawMeasures(ctx,W,H,b,M,hm){
  const st=M.st, S=M.stat;
  if(S.mean===null) return;
  const yTop=b.y+10;
  if(st.showMean){
    const X=hm.px(S.mean);
    ctx.strokeStyle=COL.live; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    lab(ctx,W,H,X,yTop,'x̄ = '+fmt(S.mean,2)+' m',COL.live,LAB_FONT,'center','bottom');
  }
  if(st.showSd&&S.sd1!==null){
    const a=hm.px(S.mean-S.sd1), c=hm.px(S.mean+S.sd1), y=yTop+16;
    ctx.strokeStyle=COL.pos; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(a,y); ctx.lineTo(c,y);
    ctx.moveTo(a,y-5); ctx.lineTo(a,y+5); ctx.moveTo(c,y-5); ctx.lineTo(c,y+5); ctx.stroke();
    lab(ctx,W,H,(a+c)/2,y+12,'s = '+fmt(S.sd1,2)+' m (n−1)',COL.pos,SM_FONT,'center','top');
  }
}
/* the interval tool: two draggable edges and the percentage between them */
function intervalGeo(b,M,hm){
  const a=hm.px(M.st.e1), c=hm.px(M.st.e2);
  return {a,c,mid:(a+c)/2,y:b.y+6,yb:b.y1};
}
function drawInterval(ctx,W,H,b,M,hm){
  const G=intervalGeo(b,M,hm), a=Math.min(G.a,G.c), c=Math.max(G.a,G.c);
  ctx.fillStyle='rgba(205,53,196,.10)'; ctx.fillRect(a,b.y,c-a,b.h);
  ctx.strokeStyle=COL.live; ctx.lineWidth=1.6;
  for(const X of [G.a,G.c]){ ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillStyle=COL.live; ctx.fillRect(X-4,b.y-7,8,8); }
  lab(ctx,W,H,(a+c)/2,b.y-11,fmt(Math.abs(M.st.e2-M.st.e1),1)+' m  ·  '+fmt(100*M.frac,1)+'%',
      COL.live,'italic 12px Georgia, serif','center','bottom');
}

/* ================================================================== *
 *  view 1: the field — PhET's Variability screen                      *
 * ================================================================== */
function aspectNote(rTxt){
  return ' The field’s vertical scale is ×'+rTxt+' of its horizontal (1.00 is true aspect, and anything less is the stage being too short for the trajectory).';
}
function fieldCaption(M,rTxt){
  const st=M.st, sc=aspectNote(rTxt);
  const flag=st.showAng?' Each landed shot carries a tick coloured by its launch angle.'
        :(st.showSpd?' Each landed shot carries a tick coloured by its launch speed.':'');
  return {full:'Six fields, six launchers, and the same 100 m of ground. Fire single shots or hold continuous fire; the histogram below shares the field’s x axis, so a bar sits under the shots that made it.'+sc+flag
            +' The dashed orange rule is the exact mean of this launcher’s law, not of the data.',
          short:'Field '+st.fld+', launcher '+M.lau+'.'+sc};
}
function drawFieldView(ctx,W,H,M){
  const ph=fieldCaption(M,'1.00');
  const L=labStage(ctx,W,H,ph.full,ph.short,{histFrac:0.42,fieldWant:fieldWantH(M)});
  /* the six fields as a strip of counts, so the screen's six-field structure
     is visible without switching between them.  Its box is RESERVED in the
     registry before the field draws, because the field's own labels are
     placed through lab() and would otherwise be shifted on top of it. */
  ctx.font=SM_FONT;
  const stripY=L.field.y+11;
  const strip=[]; let sx2=L.field.x+4;
  strip.push(['fields:','#78838f',sx2]); sx2+=42;
  M.fields.forEach((F,i)=>{
    const t=(i+1)+' ('+F.landed.length+')';
    strip.push([t,i+1===M.st.fld?COL.lau[F.lau-1]:'#4d5866',sx2]);
    sx2+=ctx.measureText(t).width+13;
  });
  LABELS.push([L.field.x+2,stripY-8,sx2,stripY+8]);
  const map=drawField(ctx,L.field,M);
  const hm=drawHist(ctx,L.hist,M);
  ctx.font=SM_FONT; ctx.textAlign='left'; ctx.textBaseline='middle';
  for(const [t,c,x2] of strip){ ctx.fillStyle=c; ctx.fillText(plain(t),x2,stripY); }
  const cap=fieldCaption(M,fmt(map.ratio,2));
  caption(ctx,L.left,L.capY,L.capTxt===ph.full?cap.full:cap.short,L.capW,'#767e92',CAP_FONT);
  lab(ctx,W,H,L.hist.x1-4,L.hist.y+9,'bin width '+fmt(M.binW,2)+' m',COL.dim,SM_FONT,'right','middle');
  return {map,hm,L};
}

/* ================================================================== *
 *  view 2: the sources — PhET's Sources screen                        *
 * ================================================================== */
function srcCaption(M,rTxt){
  const cfg=M.cfg;
  const at45=Math.abs(cfg.meanAng-45)<1e-9;
  return {full:'Where does the spread come from? The mechanism sets the speed’s spread (spring ±0.5, pressure ±0.2, explosion ±1.2 m/s — PhET’s values) and the angle stabiliser sets the angle’s (0.2° to 5°). The two panels below are those two Gaussians; the histogram above is what they make of each other.'
            +(at45?' At 45° the angle term switches off to first order — ∂x/∂θ = 2v²cos2θ/g is zero there — so only the speed spread survives.':'')
            +' The projectile only scales the mean speed (×1, ×1.1, ×0.9), so a pumpkin flies further with the same fractional spread.'+aspectNote(rTxt),
          short:'The mechanism sets σ_v, the stabiliser sets σ_θ; the two panels below are those Gaussians.'+aspectNote(rTxt)};
}
function gaussPanel(ctx,b,mu,sd,title,xlab,col,marks){
  const lo=mu-4*sd, hi=mu+4*sd;
  const n=120, xs=[], ys=[];
  for(let i=0;i<=n;i++){ const x=lo+(hi-lo)*i/n; xs.push(x); ys.push(Math.exp(-0.5*Math.pow((x-mu)/sd,2))/(sd*Math.sqrt(2*Math.PI))); }
  let ymax=0; for(const y of ys) ymax=Math.max(ymax,y);
  axesT(ctx,b,lo,hi,0,ymax*1.2,{title,xlab,ylab:'density',nx:4,ny:3});
  pl(ctx,b,xs,ys,lo,hi,0,ymax*1.2,col,1.8);
  const px=x=>b.x+b.w*(x-lo)/(hi-lo);
  ctx.strokeStyle=rgba(col,0.55); ctx.lineWidth=1; ctx.setLineDash([4,3]);
  for(const k of [-1,1]){ const X=px(mu+k*sd); ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke(); }
  ctx.setLineDash([]);
  lab(ctx,b.x1+200,b.y1+200,px(mu),b.y+4,marks,col,SM_FONT,'center','top');
}
function drawSourcesView(ctx,W,H,M){

/* ================================================================== *
 *  view 3: the measures — PhET's Measures screen                      *

function measCaption(M,rTxt){

                  :' PhET returns no standard deviation below two projectiles, and neither does this.';
  return {full:'The same field, now measured. The magenta rule is the sample mean x̄, the green bar spans x̄ ± s, and the interval tool (drag either edge, or its middle) reports the percentage of the landed shots between them — PhET counts both ends closed.'+conv
            +' The dashed orange rule is where the exact law puts the mean: the sample chases it and never quite sits on it.'+aspectNote(rTxt),
          short:'x̄ (magenta), x̄ ± s (green), and the interval tool’s percentage.'+conv+aspectNote(rTxt)};

function drawMeasuresView(ctx,W,H,M){
