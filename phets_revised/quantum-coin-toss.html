<!--
  ===================================================================
  quantum-coin-toss.html — a classical coin against a quantum "coin":
  prepared, flipped or reprepared, hidden, revealed or observed, one at
  a time or 10, 100 or 10 000 at once, against the binomial; and the one
  measurement that tells a hidden face from a superposition
  ===================================================================

  Remake of PhET Interactive Simulations' Quantum Coin Toss (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets.  PhET's Quantum Coin Toss is the Coins screen of its Quantum
  Measurement; this file runs on the same engine as the remake of that sim
  (build/quantum-measurement/: p2_engine.js, p4_coins.js, p5_binom.js, read
  by build/quantum-coin-toss/assemble.py, so the two cannot drift).  The
  screens, controls and constants follow PhET's build 1.0.4
  (docs/phets/quantum-coin-toss_en.html) and quantum-measurement's
  doc/model.md; every number taken from a PhET build is marked "PhET's value"
  in the code.

  Four views.  THE CLASSICAL COIN and THE QUANTUM COIN are PhET's two scenes,
  each with its own state: prepare the coin (heads or tails; up, down or a
  superposition with P(up) = |alpha|^2 in steps of 0.05), send it to be
  measured, then flip, hide and reveal it (classical) or reprepare and
  observe it (quantum), one coin at a time or 10, 100 or 10 000 identical
  coins at once, with the counts against the binomial's Np +- sqrt(Np(1-p)).
  THE BINOMIAL repeats the N-coin experiment and sets the histogram against
  the exact binomial, the spread of the fraction against sqrt(p(1-p)/N), and
  one long run's fraction inside its +-2 sigma funnel.  THE HIDDEN DIFFERENCE
  asks what makes the quantum coin quantum: face-on, a hidden classical face
  and a superposition give exactly the same odds, but turned sideways (a
  measurement along x) the hidden face gives 1/2 and the superposition
  (1 + 2 sqrt(p(1-p)))/2, because one is a mixture and the other is not.

  WHAT IS EXACT HERE
  ------------------
  The Born rule, P(up along n) = (1 + r.n)/2.  The binomial pmf (Stirling
  lnFact against math.lgamma, the pmf against scipy to 1e-10).  The mixture
  and the superposition as density matrices: the same diagonal, and an
  off-diagonal sqrt(p(1-p)) that only the superposition has; purity
  p^2 + (1-p)^2 against 1; P(+x) = 1/2 against (1 + 2 sqrt(p(1-p)))/2.
  Every random draw comes from one seeded PRNG (mulberry32), mirrored bit
  for bit in the Python twins (build/quantum-measurement/derive.py and
  build/quantum-coin-toss/derive.py), so every seeded count in selfTest is an
  integer pinned exactly AND tested against its law with a tolerance taken
  from its own variance (4 sigma, a chi-square below scipy's 99.9 % quantile).

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  PhET's values: a flip takes 1 s; 10, 100 or 10 000 identical coins; bias
  steps of 0.05; classical coins arrive showing the prepared face (or hidden,
  with PhET's "classical coins start hidden" preference); quantum coins
  arrive unobserved.  The coins do not fly across the screen when they are
  sent to be measured (PhET animates them); the test boxes simply fill.  The
  classical and quantum scenes are two tabs rather than a switch.  The
  sideways measurement of the fourth view is not in PhET's screen.

  WHAT IS NOT MODELLED
  --------------------
  Real coins: no physics of the toss (the classical coin is a biased random
  draw, exactly as in PhET), no entanglement between coins, no decoherence;
  measurement is projective and instantaneous; no sounds and no
  screen-reader descriptions.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                 *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }

function ticksFor(lo,hi,want){

  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);

  const step=(e1-e0)>7?2:1;

function axes(ctx,b,xlo,xhi,ylo,yhi,opt){

  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';

    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();

     onto the canvas before (drum_head.html, Known-bad) */

    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

function capFit(ctx,W,H,txt,capW){

/* choose the full caption if the panel above it keeps at least minTop of

/* ================================================================== *
 *  the engine: one PRNG, the binomial, the qubit algebra, and PhET's  *
 *  four experiments (coins, photons, Stern-Gerlach, Bloch sphere).    *
 *  Shared by quantum-measurement.html and quantum-coin-toss.html.     *
 * ================================================================== */
const DEG=Math.PI/180;          /* multiply degrees by DEG to get radians (90*DEG = pi/2, asserted) */

/* ---- the PRNG: mulberry32.  Every random draw in the file comes from one of
   these, and build/quantum-measurement/derive.py mirrors it with explicit
   32-bit arithmetic, so a seeded count is pinned exactly, not statistically.
   The state is plain data ({s}) so a scene can be saved, copied and reset. */
function rngMake(seed){ return {s:seed|0}; }
function rngNext(R){
  R.s=(R.s+0x6D2B79F5)|0;
  let t=Math.imul(R.s^(R.s>>>15),1|R.s);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}

/* ---- the binomial.  ln n! from a 0..30 table of summed logs, Stirling with
   four correction terms above (truncation < 1/(1188 n^9) < 1e-16 there);
   derive.py checks it against math.lgamma and the pmf against scipy. */
const LNF=(function(){ const t=[0]; let s=0; for(let i=1;i<=30;i++){ s+=Math.log(i); t.push(s); } return t; })();
function lnFactStirling(x){
  return x*Math.log(x)-x+0.5*Math.log(2*Math.PI*x)+1/(12*x)-1/(360*x*x*x)+1/(1260*Math.pow(x,5))-1/(1680*Math.pow(x,7));
}
function lnFact(n){ return n<=30?LNF[n]:lnFactStirling(n); }
function binomPmf(N,k,p){
  if(k<0||k>N) return 0;
  if(p<=0) return k===0?1:0;
  if(p>=1) return k===N?1:0;
  return Math.exp(lnFact(N)-lnFact(k)-lnFact(N-k)+k*Math.log(p)+(N-k)*Math.log1p(-p));
}
function binomSD(N,p){ return Math.sqrt(N*p*(1-p)); }
/* chi-square of observed counts against M x pmf: merge k = 0..N left to right
   until a bin expects at least 5; a short tail joins the last bin (derive.py
   does exactly this, in this order) */
function chi2Binned(obs,N,p,M){
  const bins=[]; let co=0, ce=0;
  for(let k=0;k<=N;k++){ co+=obs[k]||0; ce+=M*binomPmf(N,k,p); if(ce>=5){ bins.push([co,ce]); co=0; ce=0; } }
  if((ce>0||co>0)&&bins.length){ bins[bins.length-1][0]+=co; bins[bins.length-1][1]+=ce; }
  let chi=0; for(const [o,e] of bins) chi+=(o-e)*(o-e)/e;
  return {chi,dof:bins.length-1,bins};
}
/* one set of N coins: k = number of u < p (heads, up), exactly as a coin set draws */
function coinCount(R,N,p){ let k=0; for(let i=0;i<N;i++) if(rngNext(R)<p) k++; return k; }
/* M sets of N coins from one seed: the histogram, the sample mean and the
   unbiased sample variance, and the binned chi-square */
function repeatsRun(seed,N,p,M){
  const R=rngMake(seed), obs=new Float64Array(N+1), ks=new Int32Array(M);
  let sum=0;
  for(let j=0;j<M;j++){ const k=coinCount(R,N,p); ks[j]=k; obs[k]++; sum+=k; }
  const mean=sum/M; let ss=0; for(let j=0;j<M;j++) ss+=(ks[j]-mean)*(ks[j]-mean);
  const c=chi2Binned(obs,N,p,M);
  return {N,p,M,seed,obs,ks,mean,v:M>1?ss/(M-1):0,chi:c.chi,dof:c.dof};
}

/* ---- the qubit: 2x2 complex matrices and kets as flat real arrays
   (taken from bloch_sphere.html, which checks the arithmetic by hand first)
   A 2x2 is [a.re,a.im, b.re,b.im, c.re,c.im, d.re,d.im] for [[a,b],[c,d]];
   a ket is [a.re,a.im, b.re,b.im]. */
const M_I=[1,0, 0,0, 0,0, 1,0], M_SX=[0,0, 1,0, 1,0, 0,0], M_SY=[0,0, 0,-1, 0,1, 0,0], M_SZ=[1,0, 0,0, 0,0, -1,0];
const PAULI=[M_SX,M_SY,M_SZ];
function mAdd(A,B){ const o=new Array(8); for(let i=0;i<8;i++) o[i]=A[i]+B[i]; return o; }
function mScale(A,s){ const o=new Array(8); for(let i=0;i<8;i++) o[i]=A[i]*s; return o; }
function mScaleC(A,x,y){ const o=new Array(8); for(let i=0;i<8;i+=2){ o[i]=A[i]*x-A[i+1]*y; o[i+1]=A[i]*y+A[i+1]*x; } return o; }
function mMul(A,B){
  const o=new Array(8);
  for(let r=0;r<2;r++) for(let c=0;c<2;c++){
    let re=0,im=0;
    for(let k=0;k<2;k++){ const ar=A[4*r+2*k], ai=A[4*r+2*k+1], br=B[4*k+2*c], bi=B[4*k+2*c+1]; re+=ar*br-ai*bi; im+=ar*bi+ai*br; }

function mDag(A){ return [A[0],-A[1],A[4],-A[5],A[2],-A[3],A[6],-A[7]]; }
function mMaxAbsDiff(A,B){ let m=0; for(let i=0;i<A.length;i++) m=Math.max(m,Math.abs(A[i]-B[i])); return m; }
/* |psi> = cos(th/2)|0> + e^{i ph} sin(th/2)|1>: the HALF angle is why

function ketOf(th,ph){ const c=Math.cos(th/2), s=Math.sin(th/2); return [c,0,s*Math.cos(ph),s*Math.sin(ph)]; }

  const o=new Array(4);

    for(let c=0;c<2;c++){ const ar=A[4*r+2*c], ai=A[4*r+2*c+1], kr=k[2*c], ki=k[2*c+1]; re+=ar*kr-ai*ki; im+=ar*ki+ai*kr; }
    o[2*r]=re; o[2*r+1]=im; }

  const n=Math.hypot(r[0],r[1],r[2]);

  return {th:Math.acos(clamp(n>0?r[2]/n:1,-1,1)),ph,len:n};

function dot3v(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }

function bornP(r,n){ return 0.5*(1+dot3v(r,n)); }
/* the one measurement primitive every spin view calls: one draw, u < P(up)
   is up, and the state collapses onto +n or -n (PhET's rule, both screens) */
function measureAlong(R,r,n){
  const up=rngNext(R)<bornP(r,n);
  return {up, r:up?[n[0],n[1],n[2]]:[-n[0],-n[1],-n[2]]};

/* U(n,a) = exp(-i a n.sigma/2) turns the Bloch vector by a about n */
function unitary(n,a){
  let m=mScale(M_I,Math.cos(a/2)); const s=-Math.sin(a/2);
  for(let i=0;i<3;i++) m=mAdd(m,mScaleC(PAULI[i],0,s*n[i]));

function rotate3(r,n,a){

  return [r[0]*c+cr[0]*s+n[0]*d*(1-c), r[1]*c+cr[1]*s+n[1]*d*(1-c), r[2]*c+cr[2]*s+n[2]*d*(1-c)];

/* the three measurement bases: |up_n>, |down_n> (standard kets; |up_y> =
   (|0> + i|1>)/sqrt2 is the state at azimuth pi/2, the sphere's +Y) */
const BASIS={Z:{up:[1,0,0,0],dn:[0,0,1,0],n:[0,0,1]},
             X:{up:[Math.SQRT1_2,0,Math.SQRT1_2,0],dn:[Math.SQRT1_2,0,-Math.SQRT1_2,0],n:[1,0,0]},
             Y:{up:[Math.SQRT1_2,0,0,Math.SQRT1_2],dn:[Math.SQRT1_2,0,0,-Math.SQRT1_2],n:[0,1,0]}};

function ketInBasis(k,b){
  const B=BASIS[b], au=braket(B.up,k), ad=braket(B.dn,k);
  const a=Math.hypot(au[0],au[1]), c=Math.hypot(ad[0],ad[1]);
  const gu=Math.atan2(au[1],au[0])/Math.PI, gd=Math.atan2(ad[1],ad[0])/Math.PI;
  const g=a>1e-12?gu:gd;

function ketFromBasis(E,b){

    const ur=B.up[2*i], ui=B.up[2*i+1], dr=B.dn[2*i], di=B.dn[2*i+1];
    o[2*i]=E.a*(ur*cg-ui*sg)+E.c*(dr*cx-di*sx);
    o[2*i+1]=E.a*(ur*sg+ui*cg)+E.c*(dr*sx+di*cx);
  }
  return o;

/* ================================================================== *
 *  THE COINS (PhET's Coins screen)                                    *
 * ================================================================== */
const FLIP_T=1.0;               /* s: a flip or a repreparation takes 1 s (PhET's value) */
const COIN_NS=[10,100,10000];   /* identical coins (PhET's value) */
const BIAS_STEP=0.05;           /* the bias sliders snap to 0.05 (PhET's value) */
const HIST_KEEP=48;             /* the single coin's strip of recent outcomes (house) */

function snapBias(p){ const n=Math.round(1/BIAS_STEP); return clamp(Math.round(p*n)/n,0,1); }
/* states: 'preparing' (flipping / being reprepared), 'ready' (a quantum coin

function makeCoin(n){ return {n, state:'revealed', t:0, then:null, vals:new Uint8Array(10000), kUp:0, hist:[], nObs:0, nUp:0}; }
function makeCoinScene(type,seed){

/* the quantum coin's state follows its bias (PhET): 1 is up, 0 down, else a superposition */
function quantumInit(p){ return p>=1?'up':(p<=0?'down':'superposition'); }
function coinFace1(sc){ return (sc.init==='heads'||sc.init==='up'||sc.init==='superposition')?1:0; }
/* the draw: u < p is heads / up, exactly as PhET's seeded sets decide */
function coinDraw(sc,c){
  let k=0; for(let i=0;i<c.n;i++){ const v=rngNext(sc.R)<sc.p?1:0; c.vals[i]=v; k+=v; }
  c.kUp=k;
}
function coinPrepare(sc,c,reveal){ c.state='preparing'; c.t=0; c.then=reveal?'reveal':null; }
/* the end of a flip: a classical coin now HAS a face (under the cup); a quantum
   coin is ready, with no face until it is observed */
function coinPrepareNow(sc,c){ if(sc.quantum) c.state='ready'; else { coinDraw(sc,c); c.state='hidden'; } }
function coinReveal(sc,c){
  if(c.state==='preparing') return false;
  if(c.state==='ready') coinDraw(sc,c);         /* the collapse: the face is drawn now */
  const was=c.state; c.state='revealed';
  if(was!=='revealed'){ c.nObs+=c.n; c.nUp+=c.kUp;
    if(c.n===1){ c.hist.push(c.vals[0]); if(c.hist.length>HIST_KEEP) c.hist.shift(); } }
  return true;
}
function coinHide(sc,c){ if(c.state==='revealed'){ c.state='hidden'; return true; } return false; }
/* PhET's reveal/hide (observe/hide) button */
function coinToggle(sc,c){ if(c.state==='revealed') return coinHide(sc,c); return coinReveal(sc,c); }
function coinStep(sc,c,dt){
  if(c.state!=='preparing') return false;
  c.t+=dt;
  if(c.t>=FLIP_T){ c.t=FLIP_T; coinPrepareNow(sc,c); if(c.then==='reveal') coinReveal(sc,c); c.then=null; }
  return true;
}
/* the arrow: the prepared coins go to be measured.  Classical coins arrive
   showing the prepared face (hidden if the preference says so); quantum coins
   arrive ready, faceless (PhET's setMeasurementValuesImmediate) */
function sceneStart(sc){
  sc.preparing=false;
  for(const c of [sc.single,sc.set]){
    const v=coinFace1(sc);
    for(let i=0;i<c.n;i++) c.vals[i]=v;
    c.kUp=v*c.n; c.t=0; c.then=null; c.hist=[]; c.nObs=0; c.nUp=0;
    c.state=sc.quantum?'ready':(sc.startsHidden?'hidden':'revealed');
  }
}
function sceneNewCoin(sc){ sc.preparing=true; for(const c of [sc.single,sc.set]){ c.state='revealed'; c.t=0; c.then=null; } }
function setCoinCount(sc,N){ if(sc.preparing&&COIN_NS.indexOf(N)>=0) sc.set.n=N; }
function sceneAnimating(sc){ return !sc.preparing&&(sc.single.state==='preparing'||sc.set.state==='preparing'); }

/* ================================================================== *
 *  THE PHOTONS (PhET's Photons screen)                                *
 * ================================================================== */
/* PhET's values: model units (PhET's metres), seconds */
const PH={X0:-0.15, V:0.3, BEAM_W:0.04, PBS:0.035, MX:0.11, DV:0.2, DH:-0.09, AP:0.07, ABS:0.05,
          RATE_MAX:200, SLOW:0.4, CAP:999, AVG_T:1, AVG_S:0.5, STEP_DT:2/60, CUSTOM_STEP:5};
const PRESET_ANG={vertical:90, horizontal:0, fortyFive:45};
/* the beam splitter reflects (to the V detector) with probability sin^2(theta),
   theta measured from horizontal: Malus's law with the analyser at 0 and 90 deg */
function pV(angDeg){ const s=Math.sin(angDeg*DEG); return s*s; }
function expectP(angDeg){ return pV(angDeg)-(1-pV(angDeg)); }   /* V = +1, H = -1: -cos 2 theta */
/* the one decision every photon makes, classical (at the splitter) or quantum
   (at the detectors): one draw, u < sin^2 theta is V */
function photonDecide(R,angDeg){ return rngNext(R)<pV(angDeg)?'V':'H'; }
/* the path: along the beam at height y0 to the splitter's diagonal (x = y0),
   then up to y = 0.2 (V), or on to the mirror x + y = 0.11 and down to
   y = -0.09 (H).  Both arms are 0.2 - y0 long, so every photon arrives
   (0.2 - X0)/v = 1.1667 s after it left x = X0, whatever its height. */
function photonLegs(y0){ return {d1:y0-PH.X0, arm:PH.DV-y0, dArr:PH.DV-PH.X0}; }
function photonPos(ph,d,route){
  const y0=ph.y0, L=photonLegs(y0);
  if(d<=L.d1) return [PH.X0+d,y0];
  const e=d-L.d1;
  if(route==='V') return [y0,y0+e];
  const toMirror=PH.MX-2*y0;
  if(e<=toMirror) return [y0+e,y0];
  return [PH.MX-y0,y0-(e-toMirror)];
}
/* PhET's averaging counter: count events, sample every 0.5 s, and report the
   count over the most recent samples covering at least the averaging period */
function makeAvg(total,sample){ return {total,sample,cur:0,tsl:0,hist:[],value:0}; }
function avgCount(A){ A.cur++; }
function avgStep(A,dt){
  A.tsl+=dt;
  if(A.tsl>=A.sample){
    A.hist.push([A.tsl,A.cur]);
    let e=0,t=0,i=0;
    for(let n=A.hist.length-1;n>=0;n--){ e+=A.hist[n][0]; t+=A.hist[n][1]; i++; if(e>=A.total) break; }
    A.value=e>0?Math.round(t/e*1e12)/1e12:0;
    A.hist.splice(0,A.hist.length-i);
    A.cur=0; A.tsl=0;
  }
}
function avgReset(A){ A.cur=0; A.tsl=0; A.hist=[]; A.value=0; }
function makePhotonScene(mode,seed){
  return {mode, R:rngMake(seed), seed, t:0, photons:[], nV:0, nH:0, acc:0,
          avgV:makeAvg(PH.AVG_T,PH.AVG_S), avgH:makeAvg(PH.AVG_T,PH.AVG_S), lastFrame:null};
}
function photonAngle(st){ return st.phPreset==='custom'?st.phCustom:(st.phPreset==='unpolarized'?null:PRESET_ANG[st.phPreset]); }
/* one photon from the laser (PhET's emitAPhoton): a height across the 0.04
   beam, a start up to one frame's travel ahead, an angle (random for the
   unpolarized source) */
function photonEmit(sc,st,dtFrame){
  const y0=PH.BEAM_W/2*(1-2*rngNext(sc.R));
  const ahead=(dtFrame||0)*rngNext(sc.R)*PH.V;
  const a0=photonAngle(st);
  const ang=a0===null?360*rngNext(sc.R):a0;
  sc.photons.push({t0:sc.t-ahead/PH.V, y0, ang, route:null});
}
function photonClear(sc){ sc.photons=[]; }
function photonCounts(sc){ sc.nV=0; sc.nH=0; avgReset(sc.avgV); avgReset(sc.avgH); }
/* advance the scene by dt: emit (many-photon mode, PhET's fractional
   accumulator), decide at the splitter (classical) or at the detectors
   (quantum), count, and retire photons 0.05 past the detector line */
function photonAdvance(sc,st,dt){
  if(!(dt>0)) return;
  if(sc.mode==='many'){
    const n=st.phRate*dt, nf=Math.floor(n);
    for(let i=0;i<nf;i++) photonEmit(sc,st,dt);
    sc.acc+=n-nf;
    while(sc.acc>=1){ photonEmit(sc,st,dt); sc.acc-=1; }
  }
  sc.t+=dt;
  const keep=[];
  for(const ph of sc.photons){
    const d=PH.V*(sc.t-ph.t0), L=photonLegs(ph.y0);
    if(st.phBehavior==='classical'&&ph.route===null&&d>=L.d1) ph.route=photonDecide(sc.R,ph.ang);
    if(d>=L.dArr&&!ph.counted){
      if(ph.route===null) ph.route=photonDecide(sc.R,ph.ang);      /* quantum: the collapse, at the detector */
      ph.counted=true;
      if(ph.route==='V'){ sc.nV=Math.min(sc.nV+1,PH.CAP); avgCount(sc.avgV); } else { sc.nH=Math.min(sc.nH+1,PH.CAP); avgCount(sc.avgH); }
    }
    if(d<L.dArr+PH.ABS) keep.push(ph);
  }
  sc.photons=keep;
  avgStep(sc.avgV,dt); avgStep(sc.avgH,dt);
}
/* a seeded batch through photonDecide: the V count of n photons */
function photonBatch(seed,angDeg,n){ const R=rngMake(seed); let v=0; for(let i=0;i<n;i++) if(photonDecide(R,angDeg)==='V') v++; return v; }
function photonBatchUnpol(seed,n){ const R=rngMake(seed); let v=0; for(let i=0;i<n;i++){ const a=360*rngNext(R); if(photonDecide(R,a)==='V') v++; } return v; }

/* ================================================================== *
 *  THE SPINS (PhET's Spin screen: Stern-Gerlach)                      *
 * ================================================================== */
const AXV={z:[0,0,1], x:[1,0,0]};
/* PhET's six experiments and its custom layout: magnet 1, then the magnet on
   magnet 1's UP beam, then the one on its DOWN beam (PhET's value) */
const SG_EXPS=[{id:'e1',name:'1 [SGz]',axes:['z']},{id:'e2',name:'2 [SGx]',axes:['x']},
               {id:'e3',name:'3 [SGz, SGx]',axes:['z','x','x']},{id:'e4',name:'4 [SGz, SGz]',axes:['z','z','z']},
               {id:'e5',name:'5 [SGx, SGz]',axes:['x','z','z']},{id:'e6',name:'6 [SGx, SGx]',axes:['x','x','x']},
               {id:'custom',name:'custom',axes:['x','z','z']}];
const SG_RATE=300;              /* particles a second per unit amount: PhET's 5 x amount per 60-Hz frame */
const SG_MAXP=1250, SG_MAXP1=50;/* PhET's caps on particles in flight (continuous, single) */
const SG_AVG_T=3;               /* the magnets' counters average over 3 s in 0.5-s samples (PhET's value) */
const SG_SPEED=1.5;             /* apparatus units per second (the remake's layout) */
/* the custom source state, EXACTLY: theta = 2 arccos|alpha| so that
   P(up_z) = cos^2(theta/2) = |alpha|^2.  (PhET uses theta = pi(1 - |alpha|^2).) */
function customTheta(a2){ return 2*Math.acos(Math.sqrt(clamp(a2,0,1))); }
function phetCustomTheta(a2){ return Math.PI*(1-a2); }
const SG_SOURCES={'+Z':[0,0,1],'+X':[1,0,0],'-Z':[0,0,-1]};
function sgSource(st){ if(st.sgExp==='custom'){ const t=customTheta(st.sgA2); return [Math.sin(t),0,Math.cos(t)]; } return SG_SOURCES[st.sgSrc].slice(); }
function sgAxes(st){
  const e=SG_EXPS.find(x=>x.id===st.sgExp);
  if(e.id==='custom') return [st.sgC1,st.sgC2,st.sgC2];
  return e.axes.slice();
}
/* one particle through the apparatus: PhET's measureParticle at each magnet */
function sgRun(R,r0,axes){
  const m1=measureAlong(R,r0,AXV[axes[0]]);
  if(axes.length===1) return {up1:m1.up, r1:m1.r, up2:null, r2:null};
  const n2=m1.up?AXV[axes[1]]:AXV[axes[2]];
  const m2=measureAlong(R,m1.r,n2);
  return {up1:m1.up, r1:m1.r, up2:m2.up, r2:m2.r};
}
/* products of projections: [P(up,up), P(up,down), P(down,up), P(down,down)] */
function sgProbs(r0,axes){
  const n1=AXV[axes[0]], p1=bornP(r0,n1);
  if(axes.length===1) return [p1,1-p1];
  const pu=bornP(n1,AXV[axes[1]]), pd=bornP([-n1[0],-n1[1],-n1[2]],AXV[axes[2]]);
  return [p1*pu,p1*(1-pu),(1-p1)*pd,(1-p1)*(1-pd)];
}
function sgBatch(seed,r0,axes,n){
  const R=rngMake(seed), c=[0,0,0,0];
  for(let i=0;i<n;i++){ const o=sgRun(R,r0,axes); if(axes.length===1) c[o.up1?0:1]++; else c[(o.up1?0:2)+(o.up2?0:1)]++; }
  return c;
}
/* the apparatus layout (the remake's): source exit at x = 0, magnet 1 from 1
   to 2 (the particle is measured at its middle and bends to an exit), the
   second stage from 3 to 4 at y = +-0.62, the counters at x = 5 */
const SGL={S1:[1,2], S2:[3,4], Y2:0.62, EXIT:0.16, END:5.05};
function sgWaypoints(p){
  const pts=[[0,p.jy]], y=p.jy;
  pts.push([1.5,y]);
  if(p.up1===null) return pts;
  const s1=p.up1?1:-1;
  pts.push([2,s1*SGL.EXIT+y*0.5]);
  if(!p.two){ pts.push([SGL.END,s1*SGL.Y2]); return pts; }
  pts.push([3,s1*SGL.Y2+y*0.5]); pts.push([3.5,s1*SGL.Y2+y*0.5]);
  if(p.up2===null) return pts;
  const s2=p.up2?1:-1;
  pts.push([4,s1*SGL.Y2+s2*SGL.EXIT]); pts.push([SGL.END,s1*SGL.Y2+s2*SGL.EXIT*2.2]);
  return pts;
}
function polyAt(pts,d){
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(d<=L||i===pts.length-1){ const f=L>0?Math.min(1,Math.max(0,d/L)):0; return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]; }
    d-=L;
  }
  return pts[pts.length-1].slice();
}
function polyLen(pts){ let s=0; for(let i=1;i<pts.length;i++) s+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); return s; }
function makeSgScene(seed){
  return {R:rngMake(seed), seed, t:0, parts:[], acc:0, last:null,
          c:[{up:makeAvg(SG_AVG_T,0.5),dn:makeAvg(SG_AVG_T,0.5),nU:0,nD:0},
             {up:makeAvg(SG_AVG_T,0.5),dn:makeAvg(SG_AVG_T,0.5),nU:0,nD:0},
             {up:makeAvg(SG_AVG_T,0.5),dn:makeAvg(SG_AVG_T,0.5),nU:0,nD:0}]};
}
function sgResetCounts(sc){ for(const c of sc.c){ avgReset(c.up); avgReset(c.dn); c.nU=0; c.nD=0; } }
function sgClear(sc){ sc.parts=[]; sc.last=null; }
function sgBlock(st){ return (st.sgMode==='continuous'&&sgAxes(st).length>1)?st.sgBlock:'none'; }
function sgShoot(sc,st){
  const two=sgAxes(st).length>1, cap=st.sgMode==='single'?SG_MAXP1:SG_MAXP;
  if(sc.parts.length>=cap) return false;
  const p={t0:sc.t, r0:sgSource(st), jy:0.05*(2*rngNext(sc.R)-1), up1:null, up2:null, r1:null, r2:null, two, dead:false};
  sc.parts.push(p); if(st.sgMode==='single') sc.last=p;
  return true;
}
/* advance: measure at each magnet's middle, stop blocked particles at the
   blocker on magnet 1's exit, count, and retire particles at the end of their
   path (a single particle rests there 1.5 s so it can be read) */
const SG_BLOCK_D=2.35;          /* path length at which the blocker catches a particle (x = 2.30) */
function sgCount(sc,k,up){ if(up){ sc.c[k].nU++; avgCount(sc.c[k].up); } else { sc.c[k].nD++; avgCount(sc.c[k].dn); } }
function sgAdvance(sc,st,dt){
  if(!(dt>0)) return;
  const axes=sgAxes(st), block=sgBlock(st), hold=st.sgMode==='single'?1.5:0.05;
  if(st.sgMode==='continuous'){
    const n=SG_RATE*st.sgAmount*dt, nf=Math.floor(n);
    for(let i=0;i<nf;i++) sgShoot(sc,st);
    sc.acc+=n-nf; while(sc.acc>=1){ sgShoot(sc,st); sc.acc-=1; }
  }
  sc.t+=dt;
  const keep=[];
  for(const p of sc.parts){
    const d=SG_SPEED*(sc.t-p.t0);
    if(p.up1===null&&d>=1.5){ const m=measureAlong(sc.R,p.r0,AXV[axes[0]]); p.up1=m.up; p.r1=m.r; sgCount(sc,0,m.up); }
    if(p.up1!==null&&block!=='none'&&(block==='up')===p.up1&&d>=SG_BLOCK_D) p.dead=true;
    if(p.two&&!p.dead&&p.up1!==null&&p.up2===null&&d>=polyLen(sgWaypoints(p))){
      const k=p.up1?1:2, m=measureAlong(sc.R,p.r1,AXV[axes[k]]); p.up2=m.up; p.r2=m.r; sgCount(sc,k,m.up); }
    const done=p.up1!==null&&(!p.two||p.up2!==null)&&d>=polyLen(sgWaypoints(p))+hold;
    if(!p.dead&&!done) keep.push(p);
  }
  sc.parts=keep;
  for(const c of sc.c){ avgStep(c.up,dt); avgStep(c.dn,dt); }
}

/* ================================================================== *
 *  THE BLOCH SPHERE (PhET's Bloch Sphere screen)                      *
 * ================================================================== */
const BL={STEP:Math.PI/12, DELAY:0.75, DELAY_MAX:1, NS_PER_S:0.25, ATOMS:10};   /* PhET's values */
/* The field: PhET's strength s in [-1, 1] turns the state once per ns at
   |s| = 1.  The remake makes it an electron in B = s B0 along +z:
   f = (gamma_e/2pi) B, and B0 is the field that gives 1 GHz.  CODATA 2022
   gamma_e/2pi = 28 024.951 3861 MHz/T (bloch_sphere.html; = |g_e| mu_B/h). */
const GAMMA_E_MHZ_T=28024.9513861, G_E=-2.00231930436092, MUB_HZ_T=13996244917.1;
const B0_T=1e3/GAMMA_E_MHZ_T;   /* tesla: 1000 MHz / (MHz/T) */
/* the azimuth advances by w t with w = 2 pi s per ns: counterclockwise about
   +z for s > 0, the electron's sense (and PhET's).  EXACT: a rotation of the
   prepared vector, never an integrated one */
function larmorAngle(s,tauNs){ return 2*Math.PI*s*tauNs; }
function precess(r0,s,tauNs){ return rotate3(r0,[0,0,1],larmorAngle(s,tauNs)); }
/* the same thing on the ket: U = exp(-i w t sigma_z / 2) */
function precessU(s,tauNs){ return unitary([0,0,1],larmorAngle(s,tauNs)); }
const BL_PRESETS={'+X':[Math.PI/2,0],'-X':[Math.PI/2,Math.PI],'+Y':[Math.PI/2,Math.PI/2],'-Y':[Math.PI/2,3*Math.PI/2],
                  '+Z':[0,0],'-Z':[Math.PI,0]};
function makeBlochScene(seed){ return {R:rngMake(seed), seed, phase:'prepared', tau:0, r:[], up:0, dn:0, lastUp:null}; }
function blochPrep(st){ return blochOfAngles(st.bTheta,st.bPhi); }
function blochNAtoms(st){ return st.bAtoms===10?10:1; }
function blochReprepare(sc,st){ const r0=blochPrep(st); sc.r=[]; for(let i=0;i<BL.ATOMS;i++) sc.r.push(r0.slice()); sc.tau=0; sc.phase='prepared'; sc.lastUp=null; }
function blochResetCounts(sc){ sc.up=0; sc.dn=0; }
function blochObserve(sc,st){
  const n=BASIS[st.bAxis].n, na=blochNAtoms(st);
  let u=0;
  for(let i=0;i<na;i++){ const m=measureAlong(sc.R,sc.r[i],n); sc.r[i]=m.r; if(m.up) u++; }
  sc.up+=u; sc.dn+=na-u; sc.lastUp=u; sc.phase='observed';
}
/* PhET's single button: Observe (no field) or Start (field on), then Reprepare */
function blochButton(sc,st){
  if(sc.phase==='observed'){ blochReprepare(sc,st); return 'reprepared'; }
  if(sc.phase==='timing') return 'busy';
  if(st.bField){ sc.phase='timing'; sc.tau=0; return 'timing'; }
  blochObserve(sc,st); return 'observed';
}
function blochAdvance(sc,st,dtWall){
  if(sc.phase!=='timing'||!(dtWall>0)) return false;
  sc.tau=Math.min(sc.tau+dtWall*BL.NS_PER_S,st.bDelay);
  const r0=blochPrep(st), s=st.bField?st.bStrength:0;
  for(let i=0;i<BL.ATOMS;i++) sc.r[i]=precess(r0,s,sc.tau);
  if(sc.tau>=st.bDelay) blochObserve(sc,st);
  return true;
}
/* what the measurement will see: P(up along n) at the moment of observation */
function blochPUp(st){
  const r=st.bField?precess(blochPrep(st),st.bStrength,st.bDelay):blochPrep(st);
  return bornP(r,BASIS[st.bAxis].n);
}

/* ================================================================== *
 *  THE BORN RULE view: the half-angle, and measurement in sequence    *
 * ================================================================== */
function bornSpin(ThDeg){ const c=Math.cos(ThDeg*DEG/2); return c*c; }      /* cos^2(Theta/2) */
function bornPhoton(thDeg){ const c=Math.cos(thDeg*DEG); return c*c; }     /* cos^2(theta): Malus */
/* a chain of N magnets from +z to -z in equal steps: every stage passes its
   up beam with cos^2(pi/2N), so T(N) = cos^(2N)(pi/2N) -> 1 as N -> infinity */
function chainT(N){ return Math.pow(Math.cos(Math.PI/(2*N)),2*N); }
function middleSpin(alDeg){ const s=Math.sin(alDeg*DEG); return s*s/4; }       /* z -> alpha -> -z */
function middlePhoton(alDeg){ const s=Math.sin(2*alDeg*DEG); return s*s/4; }   /* H -> alpha -> V */
function chainMC(seed,N,n){
  const R=rngMake(seed); let ok=0;
  for(let i=0;i<n;i++){
    let r=[0,0,1], alive=true;
    for(let k=1;k<=N;k++){ const a=Math.PI*k/N, m=measureAlong(R,r,[Math.sin(a),0,Math.cos(a)]); if(m.up) r=m.r; else { alive=false; break; } }
    if(alive) ok++;
  }
  return ok;
}
function middleSpinMC(seed,alDeg,n){
  const R=rngMake(seed), a=alDeg*DEG, nn=[Math.sin(a),0,Math.cos(a)]; let ok=0;
  for(let i=0;i<n;i++){ const m=measureAlong(R,[0,0,1],nn); if(m.up){ const m2=measureAlong(R,m.r,[0,0,1]); if(!m2.up) ok++; } }
  return ok;
}
function middlePhotonMC(seed,alDeg,n){
  const R=rngMake(seed); let ok=0;
  /* through a polariser at alpha: pass with cos^2(alpha) (the H component of
     the analyser frame is the photon's own V at 90 - alpha); then V passes sin^2 */
  for(let i=0;i<n;i++) if(photonDecide(R,90-alDeg)==='V'&&photonDecide(R,alDeg)==='V') ok++;
  return ok;
}
function bornSpinMC(seed,ThDeg,n){ const R=rngMake(seed), t=ThDeg*DEG, r=[Math.sin(t),0,Math.cos(t)]; let up=0; for(let i=0;i<n;i++) if(measureAlong(R,r,[0,0,1]).up) up++; return up; }
function bornPhotonMC(seed,thDeg,n){ return n-photonBatch(seed,thDeg,n); }   /* the H (transmitted) count */

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';

function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;

function worldPoly(ctx,map,pts,fill,stroke,lw,dash){

    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){

  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);

  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }

function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;

  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);

/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;

function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){

    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);

    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));

function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){

function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));

function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){

/* ================================================================== *
 *  common drawing: role colours, the hint reservation, ticks, rich    *
 *  text (sup/sub on a canvas), coin faces, bars (shared by the family) *
 * ================================================================== */
/* green = the + outcome / the measured thing, violet = the - outcome, orange =
   the law (reference), magenta = the live marker, cyan = structure */
const COL={pos:'#b8ec4c', neg:'#9a7fd1', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',

const RO_W=300;
/* the house #hint (HTML, bottom:11px, 11px type) sits on the last line of a

const HINT_H=18;
/* fmt() without the negative zero: toFixed prints -6e-17 (-cos 90 deg in

   zero prints unsigned.  p1_utils.js is a verbatim house extract, so the fix
   lives here, and selfTest's layout and panel sweeps reject any "-0.000". */
function fmt0(x,n){ const s=fmt(x,n); return /^-0(\.0*)?$/.test(s)?s.slice(1):s; }
/* tick labels follow the tick SPACING (Known-bad: a fixed decimal count
   collides in a narrow panel) */
function tickFmt(ticks){
  let g=Infinity; for(let i=1;i<ticks.length;i++) g=Math.min(g,Math.abs(ticks[i]-ticks[i-1]));
  if(!isFinite(g)||g<=0) return v=>sigf(v,3);
  let d=0; while(d<6&&Math.abs(Math.round(g*Math.pow(10,d))-g*Math.pow(10,d))>1e-6*Math.max(1,g*Math.pow(10,d))) d++;
  return v=>fmt(Math.abs(v)<1e-12?0:v,d);
}
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  if(o.xticks===undefined) o.xticks=ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  if(o.yticks===undefined) o.yticks=ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  if(!o.xfmt) o.xfmt=tickFmt(o.xticks);
  if(!o.yfmt) o.yfmt=tickFmt(o.yticks);
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
}
function px(b,x,xlo,xhi){ return b.x+b.w*(x-xlo)/(xhi-xlo||1); }
function py(b,y,ylo,yhi){ return b.y1-b.h*(y-ylo)/(yhi-ylo||1); }
/* rich text on a canvas: runs of [text, 'sup'|'sub'|null]; returns the width.
   Registered with the label registry as one box. */
function richW(ctx,runs,fs){
  let w=0;
  for(const [t,k] of runs){ ctx.font=(k?(fs*0.72):fs)+'px Georgia, serif'; w+=ctx.measureText(plain(t)).width; }
  return w;
}
function rich(ctx,x,y,runs,fs,col,align,reg){
  const w=richW(ctx,runs,fs);
  let X=align==='center'?x-w/2:(align==='right'?x-w:x);
  if(reg) LABELS.push([X,y-fs*0.9,X+w,y+fs*0.35]);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  for(const [t,k] of runs){
    const f=k?fs*0.72:fs; ctx.font='italic '+f+'px Georgia, serif'; ctx.fillStyle=col||COL.text;
    const dy=k==='sup'?-fs*0.38:(k==='sub'?fs*0.22:0);

/* an ellipse as an explicit polygon in device coordinates (Known-bad: the
   recorder has no ellipse() and does not carry a scaled arc through restore) */
function ellipsePath(ctx,cx,cy,rx,ry,n){
  n=n||40; ctx.beginPath();
  for(let i=0;i<=n;i++){ const a=TAU*i/n, x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.closePath();

/* an arrow glyph (up or down) as a polygon, h tall, centred on (cx, cy) */
function arrowGlyph(ctx,cx,cy,h,up,col,sx){
  const s=sx===undefined?1:sx, d=up?-1:1, hw=h*0.30*s, tw=h*0.10*s, hh=h*0.42;
  const tip=cy+d*h/2, base=cy-d*h/2, neck=tip-d*hh;

  ctx.moveTo(cx,tip); ctx.lineTo(cx+hw,neck); ctx.lineTo(cx+tw,neck); ctx.lineTo(cx+tw,base);
  ctx.lineTo(cx-tw,base); ctx.lineTo(cx-tw,neck); ctx.lineTo(cx-hw,neck); ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
}
/* a coin face.  kind: 'H'/'T' (classical), 'U'/'D' (quantum), 'S' a quantum

   (the cup), 'flip' (mid-flip: squashed by sx and showing side f).  The
   heads and up faces are green, tails and down violet (premixed, opaque). */
function coinFace(ctx,cx,cy,r,kind,o){
  o=o||{};
  const sx=o.sx===undefined?1:Math.max(0.06,Math.abs(o.sx));
  if(kind==='hidden'){
    ellipsePath(ctx,cx,cy,r,r,36); ctx.fillStyle='#1a1f2c'; ctx.fill();
    ctx.strokeStyle='#5d6780'; ctx.lineWidth=Math.max(1.5,r*0.12); ctx.stroke();
    ctx.fillStyle='#8b93a6'; ctx.font='italic '+Math.round(r*1.05)+'px Georgia, serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; if(r>=7) ctx.fillText('?',cx,cy+r*0.04);
    return;
  }
  const up=(kind==='H'||kind==='U');
  const base=kind==='S'?mix(COL.neg,COL.pos,o.p):(up?COL.pos:COL.neg);
  ellipsePath(ctx,cx,cy,r*sx,r,36); ctx.fillStyle=shade(base,0.28); ctx.fill();
  ctx.strokeStyle=shade(base,0.85); ctx.lineWidth=Math.max(1,r*0.09); ctx.stroke();
  if(r<7) return;
  if(kind==='H'||kind==='T'){
    ctx.fillStyle=up?COL.pos:COL.neg; ctx.font='italic bold '+Math.round(r*1.1)+'px Georgia, serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';

  } else if(kind==='U'||kind==='D') arrowGlyph(ctx,cx,cy,r*1.25,up,up?COL.pos:COL.neg,sx);
  else {
    /* a superposition: the up arrow at weight p and the down arrow at 1 - p,
       side by side, each premixed toward the coin's own fill */
    const bg=shade(base,0.28);
    arrowGlyph(ctx,cx-r*0.28*sx,cy,r*1.1,true,mix(bg,COL.pos,0.15+0.85*o.p),sx);

/* a vertical error bar at data (x, y +- e), clipped to the box */
function errBar(ctx,b,x,y,e,xlo,xhi,ylo,yhi,col){

/* a bar's value, clear of the bar AND of the law's mark (yMark: the mark's
   pixel y; omit it when no mark is drawn).  Above the bar; else above the
   mark when the mark is the higher; else INSIDE the bar at its top, dark; else
   inside, under the mark.  A full bar hid its own green-on-green count, and a
   label set above its bar alone sat on the 0.5 mark when the bar stopped just
   short of it (28.1/s on a 0.47 bar): both looked at. */
const BAR_CLEAR=8;   /* > 7.14: half a 10.5px label box (6.04) plus half the 2.2px mark */
function barValY(yTop,yMark,b){
  const hasM=yMark!==null&&yMark!==undefined&&isFinite(yMark), gap=y=>hasM?Math.abs(y-yMark):Infinity;
  /* the places in order: above the bar, above a higher mark, inside the bar

  const C=[[yTop-9,false],[hasM&&yMark<yTop?yMark-9:NaN,false],[yTop+10,true],[hasM?yMark+10:NaN,true]]
    .filter(([y,ins])=>isFinite(y)&&y>=b.y+8&&y<=b.y1-6&&(!ins||y>=yTop+6));
  for(const [y,ins] of C) if(gap(y)>=BAR_CLEAR) return {y,inside:ins};
  if(!C.length) return {y:yTop+10,inside:true};
  let best=C[0]; for(const c of C) if(gap(c[0])>gap(best[0])) best=c;     /* none clears: the widest gap */

function barVal(ctx,W,H,x,yTop,b,txt,col,yMark){

}
/* a y for a one-line note ('nothing yet') in an empty bar box that clears

   spin state), caught by the layout check. */
function freeY(b,marks){
  const ok=y=>marks.every(m=>!isFinite(m)||Math.abs(y-m)>=BAR_CLEAR);
  if(ok(b.y+12)) return b.y+12;
  if(ok(b.y+b.h/2)) return b.y+b.h/2;
  for(let y=b.y+8;y<=b.y1-8;y++) if(ok(y)) return y;

/* counts as people write them: 10 000, not 10000 */
function fmtN(n){ return n>=10000?String(n).replace(/(\d)(?=(\d{3})+$)/g,'$1 '):String(n); }
/* a panel title that fits its own panel (Known-bad: long titles overran) */
function fitTitle(b,longT,shortT){ return plain(longT).length*13*0.52+10>b.w?shortT:longT; }
/* the bottom-anchored caption, measured first, clear of the #hint line */
function capLayout(ctx,W,H,full,short,left,right,minTop){
  const capW=Math.max(260,Math.min(W-148,right-left));

function drawCap(ctx,left,fit){ caption(ctx,left,fit.capY,fit.txt,fit.capW,'#767e92',CAP_FONT); }
/* a caption names only the panels that are drawn.  Lay out with the caption
   that names the optional panel (capOf(true)); when the panel then does not

/* a percentage bar pair: two vertical bars (+ outcome, - outcome) in box b,

function barPair(ctx,b,f1,f2,lab1,lab2,expect1,opts){

  const bw=Math.min(46,b.w*0.26), x1=b.x+b.w*0.30, x2=b.x+b.w*0.70;
  const H=b.h, y0=b.y1;
  const bar=(xc,f,col)=>{ if(!(f>0)) return; const hh=Math.min(1,f)*H; ctx.fillStyle=col; ctx.fillRect(xc-bw/2,y0-hh,bw,hh); };
  bar(x1,f1,COL.pos); bar(x2,f2,COL.neg);
  if(expect1!==null&&expect1!==undefined&&isFinite(expect1)){
    ctx.beginPath(); const e1=y0-expect1*H, e2=y0-(1-expect1)*H;
    ctx.moveTo(x1-bw/2-6,e1); ctx.lineTo(x1+bw/2+6,e1); ctx.moveTo(x2-bw/2-6,e2); ctx.lineTo(x2+bw/2+6,e2);
    ctx.strokeStyle=COL.ref; ctx.lineWidth=2.2; ctx.stroke();

  ctx.fillStyle=COL.pos; ctx.fillText(plain(lab1),x1,b.y1+4); ctx.fillStyle=COL.neg; ctx.fillText(plain(lab2),x2,b.y1+4);
  if(opts.values){ ctx.font='10.5px -apple-system, sans-serif'; ctx.fillStyle=COL.text; ctx.textBaseline='bottom';
    ctx.fillText(opts.values[0],x1,Math.max(b.y+12,y0-Math.min(1,f1||0)*H-3)); ctx.fillText(opts.values[1],x2,Math.max(b.y+12,y0-Math.min(1,f2||0)*H-3)); }
  return {x1,x2,bw};
}

function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
let T_NOW=0;
function sceneOf(v){ return v==='quantum'?COINS.quantum:COINS.classical; }
function isCoinView(v){ return v==='classical'||v==='quantum'; }
function buildModel(){

  if(isCoinView(v)) M.C=coinsModel(sceneOf(v));

}

/* ================================================================== *
 *  THE COINS view (PhET's Coins screen) — shared by the family        *
 * ================================================================== */
function coinWord(sc,v){ return sc.quantum?(v?'up':'down'):(v?'heads':'tails'); }
function coinGlyph(sc,v){ return sc.quantum?(v?'↑':'↓'):(v?'heads':'tails'); }
function stateWord(s){ return {preparing:'being flipped',ready:'ready, unobserved',hidden:'hidden',revealed:'revealed'}[s]||s; }
/* a snapshot of one scene for the drawing and the readout */
function coinsModel(sc){
  const p=sc.p, N=sc.set.n, sd=binomSD(N,p);
  const m={sc, quantum:sc.quantum, p, q:1-p, N, alpha:Math.sqrt(p), beta:Math.sqrt(1-p),
           init:sc.quantum?quantumInit(p):sc.init, preparing:sc.preparing,
           sState:sc.single.state, setState:sc.set.state, kUp:sc.set.kUp, sd, mean:N*p};
  m.setShown=!sc.preparing&&sc.set.state==='revealed';
  m.z=m.setShown&&sd>0?(sc.set.kUp-N*p)/sd:NaN;
  m.exact=m.setShown&&sd===0;                 /* p = 0 or 1: every coin must agree */
  const h=sc.single; m.nObs=h.nObs; m.nUp=h.nUp; m.frac=h.nObs>0?h.nUp/h.nObs:NaN;
  m.fracSd=h.nObs>0?Math.sqrt(p*(1-p)/h.nObs):NaN;
  return m;
}
/* the stage: the prepared coin, one coin under test, N identical coins, and
   below them the counts.  Returned so the pointer and the tests use the SAME
   boxes the drawing uses. */
function coinsGeo(ctx,W,H,C){
  const narrow=isNarrow(W), top=stageTop()+30, left=narrow?18:56;
  const rightTop=narrow?W-18:W-RO_W-44;
  const fit=capLayout(ctx,W,H,C.full,C.short,left,narrow?W-18:W-26,top+300);
  const avail=fit.capY-16-top;
  /* no floor on the lower row: when it does not fit it is not drawn, rather
     than drawn under the caption and the #hint (found at 560 x 380) */
  const upH=Math.max(150,Math.min(narrow?200:330,avail*0.56));
  const span=rightTop-left, gap=narrow?16:28;
  const wA=narrow?Math.max(150,span*0.26):Math.max(200,Math.min(250,span*0.24));
  const wB=narrow?Math.max(150,span*0.30):Math.max(220,Math.min(300,span*0.30));
  const A=box(left,top,wA,upH), B=box(A.x1+gap,top,wB,upH), Cb=box(B.x1+gap,top,Math.max(120,rightTop-(B.x1+gap)),upH);
  const lowTop=top+upH+44, lowH=fit.capY-16-lowTop-20;
  const hist=box(left+34,lowTop,Math.min(narrow?W-18-left-34:560,(narrow?W-18:W-26)-left-34),lowH);
  /* the strip starts below the floating readout's zone (y < 480 on the right) */
  const sTop=Math.max(lowTop,486);
  const strip=narrow?null:box(hist.x1+60,sTop,Math.min(520,Math.max(0,(W-26)-(hist.x1+60))),lowH-(sTop-lowTop));
  const rS=Math.min(B.w,B.h-40)*0.30;
  const single={cx:B.x+B.w/2, cy:B.y+22+(B.h-40)/2, r:rS};
  return {narrow,top,left,fit,A,B,C:Cb,hist,strip:strip&&strip.w>150?strip:null,single};
}
/* where each of the N coins sits inside the set's box */
function coinGrid(Cb,N){
  const cols=N===10?5:(N===100?10:100), rows=N/cols;
  const inner=box(Cb.x+10,Cb.y+26,Cb.w-20,Cb.h-36);
  const cell=Math.min(inner.w/cols,inner.h/rows);
  const x0=inner.x+(inner.w-cell*cols)/2, y0=inner.y+(inner.h-cell*rows)/2;
  return {cols,rows,cell,x0,y0,box:box(x0,y0,cell*cols,cell*rows)};
}
/* hist: whether the histogram is drawn (the caption names it only then) */
function coinsCaption(M,hist){
  const m=M.C, sc=m.sc, q=sc.quantum, h=hist!==false;
  const what=q?'A quantum “coin” is prepared as |ψ⟩ = α|↑⟩ + β|↓⟩ with |α|² = '+fmt(m.p,2)+'. Until it is observed it has no face at all — drawn here as both arrows, each as bright as its probability — and observing it gives ↑ with probability |α|²: that is the Born rule, and the face appears only then.'
                :'A classical coin always has a face: flipping it hides a definite heads or tails under the cup, with P(heads) = '+fmt(m.p,2)+' set by the bias, and revealing it only shows you what was already there.';
  const set=m.N===10000?' The 10 000 coins are drawn as a 100 × 100 grid of squares, one square per coin.':'';
  return {full:what+(h?' The histogram counts the '+fmtN(m.N)+' identical coins against the binomial’s Np ± √(Np(1−p)) in orange.':'')+set,
          short:(q?'Quantum coin: no face until observed; P(↑) = |α|² = ':'Classical coin: a hidden face; P(heads) = ')+fmt(m.p,2)+'.'+(h?' Orange: Np ± √(Np(1−p)).':'')};
}
/* the caption and the geometry together: the histogram is optional */
function coinsLayout(ctx,W,H,M){ return layoutNamed(h=>coinsCaption(M,h),Cap=>coinsGeo(ctx,W,H,Cap),G=>G.hist.h>=50); }
function drawCoinSet(ctx,Cb,sc,t){
  const c=sc.set, N=c.n, G=coinGrid(Cb,N);
  if(N<=100){
    const r=G.cell*0.40;
    for(let i=0;i<N;i++){
      const cx=G.x0+(i%G.cols+0.5)*G.cell, cy=G.y0+(Math.floor(i/G.cols)+0.5)*G.cell;
      coinFace(ctx,cx,cy,r,coinKind(sc,c,c.vals[i],t,i),coinOpts(sc,c,t,i));
    }
    return G;
  }
  /* 10 000: three batched fills (+, -, and the undecided/hidden colour) */
  const s=G.cell, pad=s>3?0.6:0.25, paths={pos:[],neg:[],other:[]};
  for(let i=0;i<N;i++){
    const x=G.x0+(i%G.cols)*s, y=G.y0+Math.floor(i/G.cols)*s;
    let k='other';
    if(c.state==='revealed') k=c.vals[i]?'pos':'neg';
    else if(c.state==='preparing'&&!sc.quantum) k=((i*7+Math.floor(t*14))%3===0)?'pos':(((i*5+Math.floor(t*11))%3===0)?'neg':'other');
    paths[k].push(x,y);
  }
  const other=c.state==='ready'?shade(mix(COL.neg,COL.pos,sc.p),0.55):(c.state==='hidden'?'#39404f':'#2b3140');
  for(const [k,col] of [['pos',COL.pos],['neg',COL.neg],['other',other]]){
    const a=paths[k]; if(!a.length) continue;
    ctx.beginPath(); for(let j=0;j<a.length;j+=2) ctx.rect(a[j],a[j+1],s-pad,s-pad);
    ctx.fillStyle=k==='other'?other:shade(col,0.85); ctx.fill();
  }
  return G;
}
function coinKind(sc,c,v,t,i){
  if(c.state==='hidden') return 'hidden';
  if(c.state==='ready') return 'S';
  if(c.state==='preparing'){ if(sc.quantum) return 'S'; const ph=Math.cos(TAU*3*t+(i||0)*0.37); return ph>=0?'H':'T'; }
  return sc.quantum?(v?'U':'D'):(v?'H':'T');
}
function coinOpts(sc,c,t,i){
  const o={p:sc.p};
  if(c.state==='preparing') o.sx=sc.quantum?0.25+0.75*Math.min(1,t/FLIP_T):Math.cos(TAU*3*t+(i||0)*0.37);
  return o;
}
function drawCoins(ctx,W,H,M){
  const m=M.C, sc=m.sc, q=sc.quantum, LY=coinsLayout(ctx,W,H,M), Cap=LY.Cap, G=LY.G;
  const A=G.A, B=G.B, Cb=G.C, t=M.tNow||0;
  /* titles sit above their boxes, like the plot titles (they sat on the frame) */
  const title=(b,txt)=>{ lab(ctx,W,H,b.x,b.y-10,txt,COL.text,'italic 13px Georgia, serif','left','middle'); };
  /* A: the prepared coin */
  frame(ctx,A,COL.edge);
  title(A,sc.preparing?(q?'the “coin” to prepare':'the coin to prepare'):(q?'the prepared state':'the coin'));
  const rA=Math.max(20,Math.min(A.w*0.24,58,A.h*0.17)), cxA=A.x+A.w/2, cyA=A.y+18+rA;
  coinFace(ctx,cxA,cyA,rA,q?(m.p>=1?'U':(m.p<=0?'D':'S')):(sc.init==='heads'?'H':'T'),{p:m.p});
  let yy=cyA+rA+22;
  if(q){ rich(ctx,cxA,yy,[['|ψ⟩ = '+fmt(m.alpha,3)+'|↑⟩ + '+fmt(m.beta,3)+'|↓⟩',null]],13.5,'#e9e9f0','center',true); yy+=22;
         lab(ctx,W,H,cxA,yy,'P(↑) = |α|² = '+fmt(m.p,2),COL.pos,SM_FONT,'center','middle'); yy+=16;
         lab(ctx,W,H,cxA,yy,'P(↓) = |β|² = '+fmt(m.q,2),COL.neg,SM_FONT,'center','middle'); yy+=16;
         lab(ctx,W,H,cxA,yy,m.init==='superposition'?'a superposition':('the basis state '+(m.init==='up'?'↑':'↓')),COL.dim,SM_FONT,'center','middle'); }
  else { lab(ctx,W,H,cxA,yy,'starts '+sc.init+' up',COL.text,LAB_FONT,'center','middle'); yy+=18;
         lab(ctx,W,H,cxA,yy,'P(heads) = '+fmt(m.p,2),COL.pos,SM_FONT,'center','middle'); yy+=16;
         lab(ctx,W,H,cxA,yy,'P(tails) = '+fmt(m.q,2),COL.neg,SM_FONT,'center','middle'); }
  if(!sc.preparing&&yy+22<A.y1-12) lab(ctx,W,H,cxA,A.y1-12,'sent to be measured',COL.faint,SM_FONT,'center','middle');
  /* B: one coin under test */
  const idle=sc.preparing;
  ctx.setLineDash(idle?[5,4]:[]); frame(ctx,B,idle?COL.faint:COL.struct); ctx.setLineDash([]);
  title(B,'one coin');
  if(idle) lab(ctx,W,H,B.x+B.w/2,B.y+B.h/2,'empty: send the coin to be measured',COL.dim,SM_FONT,'center','middle');
  else {
    const c=sc.single;
    coinFace(ctx,G.single.cx,G.single.cy,G.single.r,coinKind(sc,c,c.vals[0],c.t),coinOpts(sc,c,c.t));
    const st=c.state==='revealed'?coinWord(sc,c.vals[0]):stateWord(c.state);
    lab(ctx,W,H,B.x+B.w/2,B.y1-12,st,c.state==='revealed'?(c.vals[0]?COL.pos:COL.neg):COL.dim,LAB_FONT,'center','middle');
  }
  /* C: N identical coins */
  ctx.setLineDash(idle?[5,4]:[]); frame(ctx,Cb,idle?COL.faint:COL.struct); ctx.setLineDash([]);
  title(Cb,'N = '+fmtN(m.N)+' identical coins');
  if(idle) lab(ctx,W,H,Cb.x+Cb.w/2,Cb.y+Cb.h/2,'empty',COL.dim,SM_FONT,'center','middle');
  else drawCoinSet(ctx,Cb,sc,sc.set.t);
  /* the counts of the set against the binomial */
  const hb=G.hist, N=m.N;
  if(!G.panelOff&&hb.h>=50){
    axesT(ctx,hb,0,2,0,N,{xticks:[],yticks:ticksFor(0,N,hb.h<110?2:4),yfmt:v=>fmtN(Math.round(v)),title:fitTitle(hb,'the '+fmtN(m.N)+' coins: counted, against Np ± √(Np(1−p))','counts against the binomial')});
    if(m.setShown){
      const k1=sc.set.kUp, k2=N-k1, bw=Math.min(60,hb.w*0.18);
      const x1=px(hb,0.6,0,2), x2=px(hb,1.4,0,2);
      ctx.fillStyle=COL.pos; ctx.fillRect(x1-bw/2,py(hb,k1,0,N),bw,hb.y1-py(hb,k1,0,N));
      ctx.fillStyle=COL.neg; ctx.fillRect(x2-bw/2,py(hb,k2,0,N),bw,hb.y1-py(hb,k2,0,N));
      /* the law: Np and N(1-p), each with +-1 sd */
      for(const [xc,mu] of [[x1,m.mean],[x2,N-m.mean]]){
        const Y=py(hb,mu,0,N), Ya=py(hb,Math.min(N,mu+m.sd),0,N), Yb=py(hb,Math.max(0,mu-m.sd),0,N);
        ctx.beginPath(); ctx.moveTo(xc-bw/2-8,Y); ctx.lineTo(xc+bw/2+8,Y); ctx.strokeStyle=COL.ref; ctx.lineWidth=2.2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xc+bw/2+4,Ya); ctx.lineTo(xc+bw/2+4,Yb); ctx.moveTo(xc+bw/2+1,Ya); ctx.lineTo(xc+bw/2+7,Ya); ctx.moveTo(xc+bw/2+1,Yb); ctx.lineTo(xc+bw/2+7,Yb);
        ctx.strokeStyle=COL.ref; ctx.lineWidth=1.2; ctx.stroke();
      }
      barVal(ctx,W,H,x1,py(hb,k1,0,N),hb,fmtN(k1),COL.pos,py(hb,m.mean,0,N));
      barVal(ctx,W,H,x2,py(hb,k2,0,N),hb,fmtN(k2),COL.neg,py(hb,N-m.mean,0,N));
    } else lab(ctx,W,H,hb.x+hb.w/2,hb.y+hb.h/2,sc.preparing?'nothing measured yet':(sc.set.state==='preparing'?'being '+(q?'reprepared':'flipped'):(sc.set.state==='ready'?'not observed yet: no faces to count':'hidden: reveal to count')),COL.dim,SM_FONT,'center','middle');
    ctx.font='italic 12px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillStyle=COL.pos; ctx.fillText(q?'↑':'heads',px(hb,0.6,0,2),hb.y1+4); ctx.fillStyle=COL.neg; ctx.fillText(q?'↓':'tails',px(hb,1.4,0,2),hb.y1+4);
  }
  /* the single coin's record: its last outcomes and its running fraction */
  const sb=G.strip;
  if(sb&&sb.h>=50){
    const hs=sc.single.hist, n=hs.length;
    axesT(ctx,sb,0,HIST_KEEP,-1.3,1.3,{xticks:[],yticks:[],title:fitTitle(sb,'one coin, its last '+HIST_KEEP+' outcomes','its last outcomes')});
    const mid=py(sb,0,-1.3,1.3), cw=sb.w/HIST_KEEP;
    ctx.beginPath(); ctx.moveTo(sb.x,mid); ctx.lineTo(sb.x1,mid); ctx.strokeStyle=COL.faint; ctx.lineWidth=1; ctx.stroke();

      ctx.fillStyle=v?COL.pos:COL.neg; if(v) ctx.fillRect(x,mid-hh,Math.max(1,cw-2),hh); else ctx.fillRect(x,mid+1,Math.max(1,cw-2),hh); }

    else lab(ctx,W,H,sb.x+4,sb.y1+12,m.nUp+' '+(q?'up':'heads')+' of '+m.nObs+' = '+fmt(m.frac,3)+'  (p = '+fmt(m.p,2)+' ± '+fmt(m.fracSd,3)+')',COL.text,SM_FONT,'left','middle');
  }
  drawCap(ctx,G.left,G.fit);

/* ---- readout, equation bar, tag ---- */
function coinsReadout(M){
  const m=M.C, sc=m.sc, q=sc.quantum, c1=sc.single, cs=sc.set;
  let s=hd(q?'the prepared state':'the prepared coin');
  if(q) s+=rrow('|&psi;&rang; = &alpha;|&uarr;&rang; + &beta;|&darr;&rang;',fmt(m.alpha,3)+', '+fmt(m.beta,3))
          +rrow('P(&uarr;) = |&alpha;|&sup2;',fmt(m.p,2),'good')+rrow('P(&darr;) = |&beta;|&sup2;',fmt(m.q,2))
          +rrow('|&alpha;|&sup2; + |&beta;|&sup2;',fmt(m.alpha*m.alpha+m.beta*m.beta,12))+rrow('state',m.init);
  else s+=rrow('starts',sc.init+' up')+rrow('P(heads), the bias',fmt(m.p,2),'good')+rrow('P(tails)',fmt(m.q,2));
  s+=hd('one coin')+rrow('state',sc.preparing?'&mdash; (preparing)':stateWord(c1.state));
  if(!sc.preparing&&c1.state==='revealed') s+=rrow('face',coinWord(sc,c1.vals[0]),c1.vals[0]?'good':'');
  s+=rrow((q?'observed':'revealed')+', '+(q?'up':'heads'),m.nObs+', '+m.nUp)
    +rrow('fraction &plusmn; &radic;(p(1&minus;p)/n)',m.nObs?fmt(m.frac,3)+' &plusmn; '+fmt(m.fracSd,3):'&mdash;');
  s+=hd('N identical coins')+rrow('N',String(cs.n))+rrow('state',sc.preparing?'&mdash; (preparing)':stateWord(cs.state));
  s+=rrow('expected Np &plusmn; &radic;(Np(1&minus;p))',fmt(m.mean,m.N>=1000?0:1)+' &plusmn; '+sigf(m.sd,3));
  if(m.setShown) s+=rrow((q?'up':'heads')+', '+(q?'down':'tails'),cs.kUp+', '+(cs.n-cs.kUp),'good')
    +rrow('z = (k &minus; Np)/&sigma;',m.exact?'exact':fmt(m.z,2),Math.abs(m.z)>3?'bad':'');
  return s;
}
function coinsEq(M){
  const q=M.C.quantum;
  if(q) return ['<span class="hl">|&psi;&rang; = &alpha;|&uarr;&rang; + &beta;|&darr;&rang;</span>, &nbsp; P(&uarr;) = |&alpha;|&sup2;, &nbsp; P(&darr;) = |&beta;|&sup2;, &nbsp; |&alpha;|&sup2; + |&beta;|&sup2; = 1 &nbsp;&middot;&nbsp; P(k of N) = C(N,k) p<sup>k</sup>(1&minus;p)<sup>N&minus;k</sup>',
                'the Born rule: the amplitudes become odds only when the coin is observed, and N identical coins then count like a binomial'];
  return ['<span class="hl">P(heads) = p, &nbsp; P(tails) = 1 &minus; p</span> &nbsp;&middot;&nbsp; P(k of N) = C(N,k) p<sup>k</sup>(1&minus;p)<sup>N&minus;k</sup>, &nbsp; k = Np &plusmn; &radic;(Np(1&minus;p))',
          'a classical coin has a face before you look: flipping hides it, revealing shows it, and N coins count like a binomial'];
}
function coinsTag(M){ const m=M.C; return '<b>the coins</b> — '+(m.quantum?'a quantum “coin”':'a classical coin')+', P('+(m.quantum?'&uarr;':'heads')+') = '+fmt(m.p,2)+', N = '+m.N+(m.preparing?' · preparing':''); }
const INFO_COINS='PhET&rsquo;s Coins screen sets a classical coin beside a quantum &ldquo;coin&rdquo;. The classical coin always has a face. '

/* ================================================================== *
 *  THE BINOMIAL view: N identical coins, over and over — shared       *
 * ================================================================== */
const BIN_DRAWS=2e6;            /* cap on M x N so a slider move stays interactive */

const SPREAD_NS=[10,100,1000,10000], SPREAD_M=200;
/* Wilson-Hilferty: the chi-square quantile for display (pinned against scipy) */
function chi2Quantile(nu,z){ const a=2/(9*nu); return nu*Math.pow(1-a+z*Math.sqrt(a),3); }
const Z999=3.090232306167813;   /* the standard normal's 99.9 % point (scipy.stats.norm.ppf(0.999)) */
function binEffM(N,M){ return Math.max(1,Math.min(M,Math.floor(BIN_DRAWS/N))); }
/* the histogram window: +-5 sd around Np, binned to at most ~40 bars */
function binWindow(N,p){
  const sd=binomSD(N,p), mu=N*p;
  let lo=Math.max(0,Math.floor(mu-5*sd)-1), hi=Math.min(N,Math.ceil(mu+5*sd)+1);
  if(sd===0){ lo=Math.max(0,mu-2); hi=Math.min(N,mu+2); }
  const w=Math.max(1,Math.ceil((hi-lo+1)/40));
  return {lo,hi,w,nb:Math.ceil((hi-lo+1)/w)};
}
function binSpread(p,seed){
  return memo('binSpread',p+':'+seed,()=>SPREAD_NS.map((N,i)=>{ const r=repeatsRun(seed+1000+i,N,p,Math.min(SPREAD_M,Math.floor(1e6/N)));
    return {N, sd:Math.sqrt(r.v)/N, law:Math.sqrt(p*(1-p)/N), M:r.M}; }));
}
function binRun(p,seed){
  return memo('binRun',p+':'+seed,()=>{ const R=rngMake(seed+7777), f=new Float64Array(RUN_LEN); let k=0;
    for(let i=0;i<RUN_LEN;i++){ if(rngNext(R)<p) k++; f[i]=k/(i+1); } return f; });
}
function binomModel(st){
  const N=st.binN, p=st.binP, M=binEffM(N,st.binM), seed=st.binSeed;
  const r=memo('binRep',[N,p,M,seed].join(':'),()=>repeatsRun(seed,N,p,M));
  const m={N,p,M,Mask:st.binM,capped:M<st.binM,seed,r,mu:N*p,sd:binomSD(N,p)};
  m.sdMean=m.sd/Math.sqrt(M); m.zMean=m.sdMean>0?(r.mean-m.mu)/m.sdMean:NaN;
  m.q999=r.dof>0?chi2Quantile(r.dof,Z999):NaN;
  const W=binWindow(N,p); m.win=W;
  m.hObs=new Float64Array(W.nb); m.hPmf=new Float64Array(W.nb);
  for(let k=W.lo;k<=W.hi;k++){ const b=Math.floor((k-W.lo)/W.w); m.hObs[b]+=r.obs[k]/M; m.hPmf[b]+=binomPmf(N,k,p); }
  m.outside=0; for(let k=0;k<=N;k++) if(k<W.lo||k>W.hi) m.outside+=r.obs[k];
  m.spread=binSpread(p,seed); m.run=binRun(p,seed);
  return m;
}
function binomGeo(ctx,W,H,Cap){
  const narrow=isNarrow(W), top=stageTop()+30, left=narrow?48:66;
  const rightTop=narrow?W-18:W-RO_W-44;
  const fit=capLayout(ctx,W,H,Cap.full,Cap.short,left,narrow?W-18:W-26,top+300);
  const avail=fit.capY-16-top;
  const upH=Math.max(140,Math.min(narrow?220:330,avail*0.56));
  const wA=narrow?(rightTop-left)*0.56:Math.min(520,(rightTop-left)*0.55);
  const A=box(left,top+12,wA,upH-40);
  const B=box(A.x1+(narrow?50:76),top+12,Math.max(100,rightTop-(A.x1+(narrow?50:76))),upH-40);
  /* no floor: the long-run panel is skipped when it does not fit */
  const lowTop=top+upH+30, C=box(left,lowTop,Math.min(narrow?W-18-left:760,(narrow?W-18:W-26)-left),fit.capY-16-lowTop-26);
  return {narrow,top,left,fit,A,B,C};
}

/* ================================================================== *
 *  THE HIDDEN DIFFERENCE view: a hidden face against a superposition, *
 *  face-on and sideways                                               *
 * ================================================================== */
/* the two coins at bias p, as Bloch vectors: the hidden classical face is a
   MIXTURE (0, 0, 2p-1), inside the ball; the quantum coin is the pure state
   sqrt(p)|up> + sqrt(1-p)|down>, on the sphere at (2 sqrt(p(1-p)), 0, 2p-1) */
function mixBloch(p){ return [0,0,2*p-1]; }
function pureBloch(p){ return [2*Math.sqrt(p*(1-p)),0,2*p-1]; }
function mixPx(p){ return bornP(mixBloch(p),[1,0,0]); }        /* 1/2, whatever p */
function purePx(p){ return bornP(pureBloch(p),[1,0,0]); }      /* (1 + 2 sqrt(p(1-p)))/2 */
function mixPurity(p){ return p*p+(1-p)*(1-p); }
/* seeded runs through the engine's own draws: n classical faces (u < p, as a
   coin set draws), n hidden faces turned sideways (the face, then a Born draw
   along x), n quantum coins face-on and n sideways (measureAlong) */
function mixRun(seed,p,n){
  const R=rngMake(seed), rq=pureBloch(p); let cz=0,cx=0,qz=0,qx=0;
  for(let i=0;i<n;i++) if(rngNext(R)<p) cz++;
  for(let i=0;i<n;i++){ const face=rngNext(R)<p; if(measureAlong(R,face?[0,0,1]:[0,0,-1],[1,0,0]).up) cx++; }
  for(let i=0;i<n;i++) if(measureAlong(R,rq,[0,0,1]).up) qz++;
  for(let i=0;i<n;i++) if(measureAlong(R,rq,[1,0,0]).up) qx++;
  return {cz,cx,qz,qx,n};
}
function mixModel(st){
  const p=st.mixP, n=st.mixShots, seed=st.mixSeed;
  const run=memo('mixRun',[p,n,seed].join(':'),()=>mixRun(seed,p,n));
  const sd=q=>Math.sqrt(q*(1-q)/n);
  return {p,n,seed,run, pz:p, pxC:mixPx(p), pxQ:purePx(p), coh:Math.sqrt(p*(1-p)), purC:mixPurity(p),
          f:{cz:run.cz/n,cx:run.cx/n,qz:run.qz/n,qx:run.qx/n}, sd:{z:sd(p),xc:sd(mixPx(p)),xq:sd(purePx(p))}};
}

function drawView(ctx,W,H,M){
  LABELS=[]; POLY_SEGS=[]; LEGEND_RECTS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(isCoinView(M.view)) return drawCoins(ctx,W,H,M);
  if(M.view==='binom') return drawBinom(ctx,W,H,M);
  return drawMix(ctx,W,H,M);
}
function viewGeo(ctx,W,H,M){
  if(isCoinView(M.view)) return coinsLayout(ctx,W,H,M).G;
  if(M.view==='binom') return binomLayout(ctx,W,H,M).G;
  return mixLayout(ctx,W,H,M).G;
}
function inBox(x,y,b,pad){ pad=pad||0; return x>=b.x-pad&&x<=b.x1+pad&&y>=b.y-pad&&y<=b.y1+pad; }
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); return drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame: only a flip moves anything in this sim */
  S.step=function(dtWall){
    const dt=Math.max(0,dtWall||0); if(!(dt>0)) return false;
    T_NOW+=dt;
    if(!isCoinView(ST.view)) return false;
    const sc=sceneOf(ST.view); const a=coinStep(sc,sc.single,dt), b=coinStep(sc,sc.set,dt); return a||b;
  };
  /* the pointer: clicking a coin (or the set) reveals or hides it, as PhET's button does */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    if(type!=='down'||!isCoinView(ST.view)) return false;
    const sc=sceneOf(ST.view); if(sc.preparing) return false;
    const G=viewGeo(canvas.getContext('2d'),S.W,S.H,buildModel());
    if(inBox(x,y,G.B)) return coinToggle(sc,sc.single);
    if(inBox(x,y,G.C)) return coinToggle(sc,sc.set);
    return false;
  };
  return S;
}

/* ================================================================== *
 *  test library (shared by the family): a text-and-fill recorder, the *
 *  layout checker, and the engine's pins.  Reference values labelled  *
 *  (derive) are lines of build/quantum-measurement/refvals.txt, the   *
 *  printed output of derive.py, read in full; (scipy) marks scipy.    *

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null, nanPath=false, segs=[], cur=null;
  const fin=(...a)=>{ for(const v of a) if(!isFinite(v)) nanPath=true; };
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); }, rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    /* line segments are kept per path (in canvas pixels) so the layout check
       can see a stroke: the law's marks on the bars */
    beginPath(){ pend=null; segs=[]; cur=null; }, moveTo(x,y){ fin(x,y); cur=app(x,y); },
    lineTo(x,y){ fin(x,y); if(!pend) pend={n:0}; const p=app(x,y); if(cur) segs.push([cur[0],cur[1],p[0],p[1]]); cur=p; }, closePath(){},
    rect(x,y,w,hh){ fin(x,y,w,hh); if(!pend) pend={n:0}; pend.n++; }, arc(x,y,r){ fin(x,y,r); if(!pend) pend={n:0}; pend.n++; cur=null; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); }, stroke(){ ops.push({op:'stroke',style:ctx.strokeStyle,lw:ctx.lineWidth,segs:segs.slice()}); }, clip(){},
    fillRect(x,y,w,hh){ fin(x,y,w,hh); ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){ fin(x,y);
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
