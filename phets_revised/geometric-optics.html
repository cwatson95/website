<title>Geometric optics &mdash; PhET&rsquo;s lens and mirror benches, with the thin-optic equation solved exactly</title>
<!--
  ===================================================================
  geometric-optics.html — an object in front of a lens or a mirror:
  where the image goes, how big it is, which way up, and whether it
  is real or virtual — with every ray traced so that it AGREES with
  1/d_o + 1/d_i = 1/f rather than merely looking as though it does
  ===================================================================

  Remake of PhET Interactive Simulations' Geometric Optics (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets. The model, its constants and its controls follow PhET's build 1.3.16
  (docs/phets/geometric-optics_en.html) and that repository's doc/model.md;
  every number taken from the build is marked "PhET's value" in the code, in
  the panel and on the canvas.

  SIX VIEWS.  THE LENS BENCH is PhET's Lens screen: drag the object (a pencil,
  a penguin, a star, an arrow or a point light source) in front of a convex or
  concave lens and watch the image answer.  The rays come in PhET's four modes
  — marginal, principal, many and none — the focal points F and the 2F points
  are marked on both sides, a second point of interest rides on the object, a
  virtual image can be shown or hidden, PhET's "guides" can be switched on, and
  with the light source chosen the projection screen appears with the two light
  spots on it.  THE MIRROR BENCH is PhET's Mirror screen: concave, convex or
  flat, with F and 2F on the side the mirror actually has them.  THE CONJUGATE
  CURVE is the governing law drawn as a curve: d_i against d_o is a rectangular
  hyperbola with asymptotes d_o = f and d_i = f, the magnification is the other
  branch of the same statement, and the pole at d_o = f — the image at infinity
  — is the one place the equation has no answer.  THE LENS MAKER is where f
  comes from: the (n, R) plane with the contours of f = R/(2(n−1)) on it,
  PhET's two focal-length models (set f directly at fixed n = 1.5, or set R and
  n and let f follow), and the fact that the lens PhET DRAWS is not the lens it
  models.  THE GUIDES is PhET's own invention, reproduced exactly and then
  measured: a pair of hinged arms that bend the light by a fixed angle, which
  locate the image to 4.4 % at PhET's own defaults and become exact only when
  every angle in the picture is small.  THE REAL LENS is the same lens made of
  glass: the identical n, R and diameter, two spherical surfaces, exact vector
  Snell at each of them — and a focus that walks 43 cm as the ray height goes
  from the axis to the rim.

  WHAT IS EXACT HERE
  ------------------
  The thin-optic equation and everything that follows from it.  d_i =
  f d_o/(d_o − f) and m = −d_i/d_o are solved, not approximated, and the suite
  asserts the residual 1/d_o + 1/d_i − 1/f against zero and against a scipy
  brentq root of the same equation (3.4e-15 over 15 pairs); Newton's form
  (d_o − f)(d_i − f) = f² holds to 4.5e-16 over 35 pairs.  Ray tracing is not a
  separate drawing: every outgoing ray is built from the one-line paraxial law
  u' = u − h/f, and the suite asserts that a ray leaving the object at ANY
  height h on the optic passes through the image point the equation gives —
  1.8e-13 over 1200 configurations, the residual set by the lever arm, not by
  the algebra — and that the three principal rays meet there pairwise (1.0e-15
  over 360 configurations).  The lens maker's equation reduces to PhET's
  f = R/(2(n−1)) to 1.4e-16 over twenty (n, R) pairs.  The light spot on the
  projection screen is the exact cone from the lens rim through the image,
  D|x_s − d_i|/d_i, agreeing with the two-ray construction to 0.  The real
  lens's ray trace uses a closed-form sphere intersection checked against
  Newton on the sag (1.4e-14 cm over five heights), and its longitudinal
  spherical aberration is shown to be O(h²) by measured ratios (4.0001 per
  halving) rather than asserted to be.  Every reference value in selfTest is a
  line of build/geometric-optics/refvals.txt, the printed output of derive.py.

  WHAT IS PhET'S, AND WHERE IT CAME FROM
  --------------------------------------
  Read out of the minified build: the focal-length range 40–120 cm (default 80)
  and the radius range 40–120 cm for the lens, 75–150 cm (default 90) and
  150–300 cm (default 180) for the mirror, the index range 1.2–1.8 (default
  1.5), the diameter range 60–120 cm (default 80), the fixed n = 1.5 of the
  direct lens model and the n = 2 PhET gives a mirror so that f = R/2 falls out
  of the same formula, the flat mirror's stand-in f = 100 000 cm, the object
  positions (−170, 27) framed / (−160, 60) and (−125, 30) arrows / (−170, 20)
  and (−124, −20) lights on the Lens screen and (−150, 72.5), (−150, 60),
  (−165, 30) on the Mirror screen, the second point's −56.5 cm offset, the
  projection screen at x = 200 cm with its 123 cm height, the 40 cm minimum
  object distance, the 100 cm maximum off-axis distance, the 260 and 160 cm
  rulers, the 120° fan and 20·(⌊d_o/300⌋+1) count of the "many" rays, the
  guides' own arithmetic, and the "hollywooded" lens sag (D/2)²/(2(|R|+100))
  that its artwork uses instead of the true one.  PhET's doc/model.md prints
  the lens maker's equation as f = R/(2(1−n)); its code computes the magnitude
  as |R|/(2(n−1)) and puts the sign on from the surface type, which is what is
  implemented here.

  WHAT IS MODELLED, AND WHAT IS NOT MODELLED AT ALL
  -------------------------------------------------
  PhET's optic is ideal: no spherical aberration, no coma, no chromatic
  dispersion, no thickness.  The first five views keep that model, because it
  is the model the sim is about; THE REAL LENS is the honest counterweight and
  is labelled as a different object on its own canvas.  Nothing here models
  diffraction, so nothing here has a resolution limit; the "light spot" is a
  geometric shadow, and its brightness is PhET's own formula (a lens-diameter
  term times 14/spot-diameter, clamped to [0,1]), not a radiometric
  calculation — the page says so where it is drawn.  The flat mirror is PhET's
  f = 100 000 cm stand-in rather than a true plane, which puts its image
  0.23 cm behind where a plane mirror would and magnifies by 1.0015 instead of
  1; both numbers are printed rather than hidden.  The objects are drawn as
  simple outlines, not PhET's artwork.  The real lens's edge thickness is
  chosen (2 cm), not PhET's — PhET never gives its lens a thickness at all.
-->

'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html, via                *
 *  build_lagr/p1_utils.js, verbatim)                                  *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',

            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;
    });
}
function wrapText(ctx,txt,maxW,font){
  if(font) ctx.font=font;
  const words=plain(txt).split(/\s+/), out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){
  const f=font||'11.5px -apple-system, sans-serif';
  const ls=wrapText(ctx,txt,maxW,f);
  ctx.fillStyle=col||'#767e92'; ctx.textAlign='left'; ctx.textBaseline='top';
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);
  return ls.length*14;
}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }
function frame(ctx,b,col){
  ctx.strokeStyle=col||'#232838'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(b.x)+0.5,Math.round(b.y)+0.5,Math.round(b.w),Math.round(b.h));
}
function ticksFor(lo,hi,want){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/Math.max(2,want);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);
  return out;
}
/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop
   in a naive generator (sbs_sims Known-bad) — return [] instead */
function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;
  for(let e=e0;e<=e1;e+=step){ const v=Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out;
}
function axes(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=opt||{};
  ctx.save();
  frame(ctx,b,'#242a3a');
  ctx.font='10.5px -apple-system, sans-serif';
  /* ticksFor returns a SINGLE value when hi < lo, so an inverted axis silently
     gets one tick and no grid.  Sort the range before asking for ticks; the
     placement below already handles either direction. (standard_candle.html) */
  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);
  ctx.strokeStyle='#181d29'; ctx.lineWidth=1;
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#6f7789';
  for(const t of xt){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();
    ctx.fillText(o.xfmt?o.xfmt(t):fmt(t,2),X,b.y1+5);
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();
    ctx.fillText(o.yfmt?o.yfmt(t):fmt(t,2),b.x-6,Y);
  }
  /* labels go through plain() too — axis titles have carried '&ndash;' raw
     onto the canvas before (drum_head.html, Known-bad) */
  if(o.xlab){ ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.xlab),b.x+b.w/2,b.y1+21); }
  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);
    ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6';
    ctx.font='11px -apple-system, sans-serif'; ctx.fillText(plain(o.ylab),0,0); ctx.restore(); }
  /* title baseline at b.y-9, not b.y-6: the topmost y-tick label is centred on
     b.y and a 10.5px font spans +/-5.25 px, so a 6 px gap collides with it. */
  if(o.title){ ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='#aeb6c6';
    ctx.font='italic 13px Georgia, serif'; ctx.fillText(plain(o.title),b.x,b.y-9); }
  ctx.restore();
}
/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* legend that RECORDS its own text rectangle, so selfTest can assert no data
   polyline runs through one (adiabatic_expansion lesson).  Reset per draw. */
let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });
  LEGEND_RECTS.push({x:x+22,y,w:bw-22,h:bh});
  return box(x,y,bw,bh);
}
/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

function stageTop(){ return 46; }
/* measure a caption BEFORE laying out the panel above it (Known-bad: wrapped
   text has no fixed height) — returns {capY, lines} for a bottom-anchored cap */
function capFit(ctx,W,H,txt,capW){
  const lines=wrapText(ctx,txt,capW,'11.5px -apple-system, sans-serif').length;
  return {capY:H-12-lines*14,lines};
}
function sparseTicks(lo,hi,hpx){
  return ticksFor(lo,hi,hpx<90?2:(hpx<140?3:5));
}
/* choose the full caption if the panel above it keeps at least minTop of
   height, else a one-line fallback (sparse-view honesty at tiny sizes).
   capW is floored: at very narrow widths text may run under the floating
   readout, which the audit reports as advisory, like the siblings. */
function fitCaption(ctx,W,H,fullTxt,shortTxt,capWraw,minTop){
  const capW=Math.max(300,Math.min(capWraw,W-148));
  let fit=capFit(ctx,W,H,fullTxt,capW);
  if(fit.capY>=minTop) return {capY:fit.capY,txt:fullTxt,capW};
  fit=capFit(ctx,W,H,shortTxt,capW);
  return {capY:fit.capY,txt:shortTxt,capW};
}
function intTicks(lo,hi){
  const out=[];
  for(let t=Math.ceil(lo);t<=Math.floor(hi);t++) out.push(t);
  return out.length?out:[Math.round(lo)];
}

/* ================================================================== *
 *  the optics                                                         *
 *                                                                     *
 *  Conventions, stated once and used everywhere (they are also        *
 *  printed on the canvas and in the panel):                           *
 *                                                                     *
 *    x runs to the RIGHT, the optic sits at x = 0, the object is      *
 *    always at x < 0, y is measured from the optical axis, up is +.   *
 *    d_o = -x_object > 0                     object distance          *
 *    f   > 0 converging (convex lens, concave mirror)                 *
 *        < 0 diverging  (concave lens, convex mirror)                 *
 *    d_i > 0 real image, < 0 virtual.  A lens puts a real image at    *
 *        x = +d_i, a mirror at x = -d_i  (PhET's `sign` = +1 / -1).   *
 *    m   = -d_i/d_o  (negative = inverted)                            *
 *    R   > 0 convex optic, < 0 concave optic (PhET's own sign).       *
 *                                                                     *
 *  Every reference value asserted in selfTest is a printed line of    *
 *  build/geometric-optics/refvals.txt (derive.py).                    *
 * ================================================================== */

/* ---- PhET's values, read out of docs/phets/geometric-optics_en.html
        (build 1.3.16).  Ranges are [min, max, default], centimetres. ---- */
const PHET={
  fLens:[40,120,80], rocLens:[40,120,80], iorLens:[1.2,1.8,1.5], dLens:[60,120,80],
  fMirror:[75,150,90], rocMirror:[150,300,180], dMirror:[60,120,80],
  iorDirectLens:1.5,          /* the direct lens model holds n at 1.5 */
  iorMirror:2,                /* Vm = Range(2,2,2): makes f = R/2 fall out */
  flatF:1e5, flatR:2e5,       /* the flat mirror's stand-in */
  minObjectDist:40,           /* MIN_DISTANCE_FROM_OBJECT_TO_OPTIC */
  minScreenDist:60,           /* MIN_DISTANCE_FROM_OPTIC_TO_PROJECTION_SCREEN */
  maxOffAxis:100,             /* MAX_DISTANCE_FROM_OBJECT_TO_OPTICAL_AXIS */
  framedLens:[-170,27], framedMirror:[-150,72.5],
  arrow1Lens:[-160,60], arrow2Lens:[-125,30],
  arrow1Mirror:[-150,60], arrow2Mirror:[-165,30],
  light1:[-170,20], light2:[-124,-20],
  secondOffset:-56.5,         /* SecondPoint.VERTICAL_OFFSET_RANGE.min */
  screenX:200, screenH:123,
  manyFanDeg:120,             /* LightRays: toRadians(120) */
  arrowMax:80,                /* ArrowObject.MAX_MAGNITUDE */
  rulerH:260, rulerV:160,
  fStep:5, rocStep:5, iorStep:0.05, dStep:5,
  hollywoodPad:100            /* LensShapes: a = (D/2)^2 / (2(|R| + 100)) */
};

/* =============================== the thin optic ==================== */
/* d_i from 1/d_o + 1/d_i = 1/f.  PhET returns 1e7 at d_o = f; the honest
   answer is that the image is at infinity, so this returns Infinity and every
   consumer has to decide what to do about it. */
function imageDistance(f,dO){
  if(dO===f) return Infinity;
  return f*dO/(dO-f);
}
function magnif(f,dO){
  if(dO===0) return 1;
  const di=imageDistance(f,dO);
  return isFinite(di)?-di/dO:-Infinity;
}
/* the residual of the defining equation: the suite asserts this, not the
   formula, so a mutation of the formula cannot hide behind itself */
function lensEqResidual(f,dO,di){ return 1/dO+1/di-1/f; }
/* Newton's form.  x x' = f^2 with x = d_o - f, x' = d_i - f. */
function newtonProduct(f,dO){
  const di=imageDistance(f,dO);
  return (dO-f)*(di-f);
}
const opticSign=kind=>kind==='mirror'?-1:1;

function imagePoint(kind,f,dO,yO){
  const di=imageDistance(f,dO), m=isFinite(di)?-di/dO:-Infinity;
  return {x:opticSign(kind)*di, y:m*yO, di:di, m:m, virtual:di<0};
}

/* =============================== ray transfer ====================== */
/* The whole of paraxial ray optics.  u is the transverse slope of the
   incoming ray (dy/dx, x increasing); u' is the slope of the outgoing ray
   measured along ITS OWN direction of travel, which is +x for a lens and -x
   for a mirror.  It never blows up -- not even at d_o = f. */
function bend(u,h,f){ return u-h/f; }
/* Height of the outgoing ray at signed path length s from the optic.  s < 0
   is the backward extension, which is exactly where a virtual image lives. */
function rayHeightAt(u,h,f,s){ return h+bend(u,h,f)*s; }

/* Where a ray from P in direction d meets the optic plane x = 0.
   Returns null when it never gets there. */
function opticHit(P,d){
  if(!(d[0]>1e-12)) return null;
  const t=-P[0]/d[0];
  if(!(t>0)) return null;
  return {t:t,h:P[1]+t*d[1],u:d[1]/d[0]};
}

/* PhET's four ray modes, as directions leaving the source point.
   marginal : to the centre and to the two rim points
   principal: parallel to the axis, through the centre, through the near F
   many     : a 120-degree fan of 20*(floor(d_o/300)+1) rays
   none     : nothing */
function manyRayCount(dO){ return 20*(Math.floor(Math.abs(dO)/300)+1); }
function rayDirections(mode,P,f,D){
  const dO=-P[0];
  const out=[];
  const norm=v=>{ const L=Math.hypot(v[0],v[1]); return [v[0]/L,v[1]/L]; };
  if(mode==='marginal'){
    out.push(norm([dO,-P[1]]));
    out.push(norm([dO,D/2-P[1]]));
    out.push(norm([dO,-D/2-P[1]]));
  }else if(mode==='principal'){
    out.push([1,0]);
    out.push(norm([dO,-P[1]]));
    /* the ray that crosses the axis at the front focal point x = -f */
    const v=[dO-f,-P[1]];
    if(v[0]<0){ v[0]=-v[0]; v[1]=-v[1]; }
    out.push(norm(v));
  }else if(mode==='many'){
    const half=PHET.manyFanDeg*PI/360, n=manyRayCount(dO), step=2*half/(n-1);
    for(let i=0;i<n;i++){ const a=half-i*step; out.push([Math.cos(a),Math.sin(a)]); }
  }
  return out;
}

/* One ray, traced.  Returns the incoming segment, the outgoing segment and
   (when the image is virtual and the ray was deviated) the dashed backward
   extension that reaches the virtual image.  `reach` is how far past the optic
   the outgoing ray is drawn, in cm of path length. */
function traceRay(kind,f,D,P,d,reach,aperture){
  const hit=opticHit(P,d);
  if(hit===null) return null;
  const sgn=opticSign(kind);
  const inSeg=[[P[0],P[1]],[0,hit.h]];
  const inside=(aperture===false)||(Math.abs(hit.h)<=D/2+1e-9);
  if(!inside){
    /* misses the optic.  A lens lets it through undeviated; a mirror has
       nothing there to reflect it, so the ray simply ends. */
    if(kind==='mirror') return {inSeg:inSeg,outSeg:null,virtSeg:null,h:hit.h,missed:true};
    const s=reach;
    return {inSeg:inSeg,outSeg:[[0,hit.h],[s,hit.h+hit.u*s]],virtSeg:null,h:hit.h,missed:true};
  }
  const up=bend(hit.u,hit.h,f);
  const outSeg=[[0,hit.h],[sgn*reach,hit.h+up*reach]];
  let virtSeg=null;
  const di=imageDistance(f,-P[0]);
  if(isFinite(di)&&di<0) virtSeg=[[0,hit.h],[sgn*di,hit.h+up*di]];
  return {inSeg:inSeg,outSeg:outSeg,virtSeg:virtSeg,h:hit.h,u:hit.u,up:up,missed:false};
}

/* =============================== the lens maker ==================== */
const invR=R=>(isFinite(R)&&R!==0)?1/R:0;
function fThin(n,R1,R2){ return 1/((n-1)*(invR(R1)-invR(R2))); }
function fThick(n,R1,R2,t){
  return 1/((n-1)*(invR(R1)-invR(R2)+(n-1)*t*invR(R1)*invR(R2)/n));
}
/* back focal distance, measured from the REAR vertex */
function backFocal(n,R1,R2,t){
  return fThick(n,R1,R2,t)*(1-(n-1)*t*invR(R1)/n);
}
/* PhET's optic has the same radius on both surfaces, R1 = +R, R2 = -R, so the
   lens maker's equation collapses to |f| = |R| / (2(n-1)).  Its doc/model.md
   prints f = R/(2(1-n)); the code computes the MAGNITUDE this way and puts the
   sign on from the surface type, which is what is done here. */
function phetFocalFromR(R,n){ return Math.abs(R)/(2*(n-1)); }
function phetRFromFocal(f,n){ return 2*Math.abs(f)*(n-1); }

/* the sag of a spherical surface of radius R at height h (h <= |R|) */
function sphereSag(R,h){
  if(!isFinite(R)||R===0) return 0;
  const d=R*R-h*h;
  if(d<0) return NaN;
  return h*h/(R*(1+Math.sqrt(d)/Math.abs(R)));
}
/* PhET's DRAWN half-thickness: a softened sag that never refuses.  Its lens
   artwork uses this, not the true sag -- so at R = 40, D = 120 it happily
   draws a lens whose surfaces could not exist. */
function hollywoodSag(R,D){ return 0.5*(D/2)*(D/2)/(Math.abs(R)+PHET.hollywoodPad); }

/* =============================== PhET's guides ===================== */
/* A guide is hinged at the rim of the lens and turns the ray by a FIXED angle.
   s = +1 top, -1 bottom; f is SIGNED; r = D/(4f). */
function guideRatio(f,D){ return D/(4*f); }
function guideTurn(surface,f,D,s){
  const r=guideRatio(f,D);
  return surface==='convex' ? -s*(2*Math.atan(r))
                            : -s*(Math.atan(3*r)-Math.atan(r));
}
function guideAngles(surface,f,D,obj,s){
  const fy=s*D/2;
  const inc=Math.atan2(obj[1]-fy,obj[0]-0);
  return {fulcrum:[0,fy],incident:inc,transmitted:inc+PI+guideTurn(surface,f,D,s),
          r:guideRatio(f,D)};
}
/* where the two transmitted guides cross -- PhET's approximation to the image */
function guideCross(surface,f,D,obj){
  const A=guideAngles(surface,f,D,obj,1), B=guideAngles(surface,f,D,obj,-1);
  const m1=Math.tan(A.transmitted), m2=Math.tan(B.transmitted);
  if(m1===m2) return {x:Infinity,y:Infinity};
  const y1=D/2, y2=-D/2;
  const x=(y2-y1)/(m1-m2);
  return {x:x,y:y1+m1*x};
}
/* the same pair of rays bent by the SLOPE law instead of by a rotation.  This
   one is exact for every object, which is the whole point of the comparison. */
function slopeCross(f,D,dO,yO){
  const h1=D/2, h2=-D/2;
  const u1=bend((h1-yO)/dO,h1,f), u2=bend((h2-yO)/dO,h2,f);
  /* the heights come back with the crossing: ANY two distinct rays from one
     object point meet at the image, so the crossing alone cannot say which
     rays were used -- and the whole point of this pair is that they are the
     guides' own fulcrum heights. */
  if(u1===u2) return {x:Infinity,y:Infinity,h1:h1,h2:h2};
  const x=(h2-h1)/(u1-u2);
  return {x:x,y:h1+u1*x,h1:h1,h2:h2};
}
/* the turn an ideal thin optic gives the ray that strikes the fulcrum height */
function idealTurn(f,dO,yO,D,s){
  const h=s*D/2, u=(h-yO)/dO;
  return Math.atan(bend(u,h,f))-Math.atan(u);
}

/* =============================== the light spot ==================== */
/* Where the ray from a rim point through the image crosses the screen plane.
   The optic is at x = 0 -- PhET fixes it there and so does this file -- so the
   rim's x never appears; carrying it would be dead generality that no test can
   reach. */
function spotEdge(screenX,rimY,img){
  const n=(img.x===0)?1e7:screenX/img.x;
  return rimY+(img.y-rimY)*n;
}
function lightSpot(screenX,D,f,dO,yO){
  const img=imagePoint('lens',f,dO,yO);
  const yt=spotEdge(screenX,D/2,img), yb=spotEdge(screenX,-D/2,img);
  return {y:0.5*(yt+yb),diameter:Math.abs(yt-yb),top:yt,bottom:yb};
}
/* the same diameter in closed form: the cone from the rim to the image,
   continued to the screen.  Asserted against the two-ray construction. */
function spotDiameterClosed(screenX,D,f,dO){
  const di=imageDistance(f,dO);
  return D*Math.abs(screenX-di)/Math.abs(di);
}
/* PhET's own brightness formula -- a lens-diameter term times 14/diameter,
   clamped to [0,1].  It is not a radiometric calculation and the canvas says
   so where the spot is drawn. */
function spotIntensity(spotD,opticD){
  if(spotD===0) return 0;
  const lo=PHET.dLens[0], hi=PHET.dLens[1];
  const k=0.5+(1-0.5)*(opticD-lo)/(hi-lo);
  return clamp(k*14/spotD,0,1);
}

/* ==================== the real lens: exact ray tracing =============
   Two spherical surfaces, the front vertex at z = 0 and the rear at z = t.
   A ray is [y, z] with z along the axis.  Nothing below is paraxial: the
   paraxial formulas above are checked AGAINST this, in the limit, rather
   than used by it.  (The intersection is the closed-form sphere root; a
   Newton-on-the-sag route is implemented beside it and selfTest asserts the
   two agree, which is what stops a quadratic-root sign slip.) ============ */
function hitSphere(p,d,z0,R,semi){
  if(!isFinite(R)||R===0){
    if(Math.abs(d[1])<1e-15) return null;
    const t=(z0-p[1])/d[1];
    if(!(t>1e-12)) return null;
    const q=[p[0]+t*d[0],z0];
    return Math.abs(q[0])<=semi?q:null;
  }
  const cz=z0+R;
  const oy=p[0], oz=p[1]-cz;
  const b=2*(oy*d[0]+oz*d[1]);
  const c=oy*oy+oz*oz-R*R;
  const disc=b*b-4*c;
  if(disc<0) return null;
  const sq=Math.sqrt(disc);
  const ts=[(-b-sq)/2,(-b+sq)/2].sort((a,b2)=>a-b2);
  for(const t of ts){
    if(!(t>1e-12)) continue;
    const q=[p[0]+t*d[0],p[1]+t*d[1]];
    if(Math.abs(q[0])>semi) continue;
    if(Math.abs(q[1]-z0)>Math.abs(R)) continue;   /* the vertex-side branch */
    return q;
  }
  return null;
}
function hitSphereNewton(p,d,z0,R,semi){
  if(!isFinite(R)||R===0) return hitSphere(p,d,z0,R,semi);
  if(Math.abs(d[1])<1e-15) return null;
  let t=(z0-p[1])/d[1];
  for(let i=0;i<80;i++){
    const y=p[0]+t*d[0], z=p[1]+t*d[1];
    if(Math.abs(y)>=Math.abs(R)) return null;
    const s=sphereSag(R,y);
    if(!isFinite(s)) return null;
    const disc=1-y*y/(R*R);
    if(disc<=0) return null;
    const dsdy=y/(R*Math.sqrt(disc));
    const den=d[1]-dsdy*d[0];
    if(Math.abs(den)<1e-15) return null;
    const dt=-(z-(z0+s))/den;
    t+=dt;
    if(Math.abs(dt)<1e-14) break;
  }
  if(!(t>1e-12)) return null;
  const q=[p[0]+t*d[0],p[1]+t*d[1]];
  return Math.abs(q[0])<=semi?q:null;
}
function sphereNormal(y,R){
  if(!isFinite(R)||R===0) return [0,-1];
  const disc=1-y*y/(R*R);
  if(disc<=0) return [0,-1];
  const dsdy=y/(R*Math.sqrt(disc));
  const L=Math.hypot(dsdy,1);
  return [-dsdy/L,1/L];
}
/* vector Snell; null on total internal reflection */
function refractVec(d,nrm,n1,n2){
  const L=Math.hypot(d[0],d[1]);
  let dx=d[0]/L, dy=d[1]/L, nx=nrm[0], ny=nrm[1];
  let ci=-(nx*dx+ny*dy);
  if(ci<0){ nx=-nx; ny=-ny; ci=-ci; }
  const eta=n1/n2, k=1-eta*eta*(1-ci*ci);
  if(k<0) return null;
  const g=eta*ci-Math.sqrt(k);
  return [eta*dx+g*nx,eta*dy+g*ny];
}
function traceRealLens(p0,d0,n,R1,R2,t,semi,useNewton){
  const hit=useNewton?hitSphereNewton:hitSphere;
  const L=Math.hypot(d0[0],d0[1]);
  let d=[d0[0]/L,d0[1]/L], p=[p0[0],p0[1]];
  const pts=[[p[0],p[1]]];
  let q=hit(p,d,0,R1,semi);
  if(q===null) return null;
  let dd=refractVec(d,sphereNormal(q[0],R1),1,n);
  if(dd===null) return null;
  pts.push([q[0],q[1]]); p=q; d=dd;
  q=hit(p,d,t,R2,semi);
  if(q===null) return null;
  dd=refractVec(d,sphereNormal(q[0],R2),n,1);
  if(dd===null) return null;
  pts.push([q[0],q[1]]);
  return {pts:pts,p:q,d:dd};
}
function axisCrossing(p,d){
  if(Math.abs(d[0])<1e-15) return Infinity;
  return p[1]+(-p[0]/d[0])*d[1];
}
/* longitudinal spherical aberration at ray height h, measured from the
   paraxial back focus (both from the rear vertex).  Negative = the marginal
   ray crosses EARLIER, which is what a positive lens does. */
function lsaAt(h,n,R1,R2,t,semi){
  const r=traceRealLens([h,-1000],[0,1],n,R1,R2,t,semi,false);
  if(r===null) return NaN;
  return (axisCrossing(r.p,r.d)-t)-backFocal(n,R1,R2,t);
}
/* the marginal ray's height at the PARAXIAL focal plane: the transverse blur */
function blurAt(h,n,R1,R2,t,semi){
  const r=traceRealLens([h,-1000],[0,1],n,R1,R2,t,semi,false);
  if(r===null) return NaN;
  const zf=t+backFocal(n,R1,R2,t);
  return r.p[0]+((zf-r.p[1])/r.d[1])*r.d[0];
}
/* a real CONCAVE MIRROR's marginal focus, in closed form.  A ray parallel to
   the axis at height h reflects to cross the axis at R - R/(2 cos(asin(h/R)))
   in front of the vertex; the paraxial R/2 is the h -> 0 limit. */
function mirrorMarginalFocus(R,h){
  const a=Math.abs(h/R);
  if(a>=1) return NaN;
  return Math.abs(R)-Math.abs(R)/(2*Math.sqrt(1-a*a));
}
/* the same by exact vector reflection -- the independent route selfTest pins
   the closed form against.  Vertex at z = 0, light running +z, the centre of
   curvature at z = -R, so a concave mirror's rim is nearer the source. */
function mirrorFocusTrace(R,h){
  const Rm=Math.abs(R), th=Math.asin(h/Rm);
  const zhit=-Rm*(1-Math.cos(th));
  const nx=Math.sin(th), ny=Math.cos(th);
  const dot=0*nx+1*ny;
  const rx=0-2*dot*nx, ry=1-2*dot*ny;
  if(rx===0) return Infinity;
  return -(zhit+(-h/rx)*ry);
}

           obj:'#cd35c4', img:'#5ac8e0', guide:'#e8843a', axis:'#39506b'};

const HINT_H=18;   /* the house #hint (HTML, bottom:11px) owns the bottom-left */

const OBJ_LIST=[{id:'pencil',name:'pencil'},{id:'penguin',name:'penguin'},
                {id:'star',name:'star'},{id:'arrow',name:'arrow'},{id:'light',name:'light'}];

                {id:'many',name:'many'},{id:'none',name:'none'}];

const DEFAULTS={
  view:'bench',
  /* the optic -- PhET's own defaults and PhET's own two focal-length models */
  lensSurface:'convex', mirrorSurface:'concave', fControl:'indirect',
  lensF:PHET.fLens[2], lensR:PHET.rocLens[2], lensN:PHET.iorLens[2], lensD:PHET.dLens[2],
  mirrorF:PHET.fMirror[2], mirrorR:PHET.rocMirror[2], mirrorD:PHET.dMirror[2],
  /* the object -- PhET's framed-object position on the Lens screen */
  objKind:'pencil', objX:PHET.framedLens[0], objY:PHET.framedLens[1],
  secondOff:PHET.secondOffset,
  /* the drawing */
  rays:'marginal', showF:true, show2F:false, showVirtual:true, showLabels:true,

  /* the real lens */
  realEdge:2, realH:0.98, realStop:1.0,
};
const ST=Object.assign({},DEFAULTS);

const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }
function clearMemo(){ for(const k in MEMO) delete MEMO[k]; }

/* ---------------------------------------------- the optic, from the state
   PhET carries TWO focal-length models and keeps them in step: 'direct' sets
   |f| with the index pinned at 1.5, and derives R = 2f(n-1); 'indirect' sets
   |R| and n, and derives |f| = |R|/(2(n-1)).  The sign comes from the surface
   type, never from the slider. */
function lensIndex(st){ return st.fControl==='direct'?PHET.iorDirectLens:st.lensN; }
function lensFocal(st){
  const mag=st.fControl==='direct'?st.lensF:phetFocalFromR(st.lensR,lensIndex(st));
  return (st.lensSurface==='convex'?1:-1)*mag;
}
function lensRadius(st){
  const mag=st.fControl==='direct'?phetRFromFocal(st.lensF,lensIndex(st)):st.lensR;
  return (st.lensSurface==='convex'?1:-1)*mag;
}
function mirrorFocal(st){
  if(st.mirrorSurface==='flat') return PHET.flatF;
  const mag=st.fControl==='direct'?st.mirrorF:phetFocalFromR(st.mirrorR,PHET.iorMirror);
  return (st.mirrorSurface==='concave'?1:-1)*mag;
}
function mirrorRadius(st){
  if(st.mirrorSurface==='flat') return PHET.flatR;
  const mag=st.fControl==='direct'?phetRFromFocal(st.mirrorF,PHET.iorMirror):st.mirrorR;
  return (st.mirrorSurface==='convex'?1:-1)*mag;
}
/* the optic the bench views use */
function opticOf(st,kind){
  if(kind==='mirror') return {kind:'mirror',surface:st.mirrorSurface,f:mirrorFocal(st),
    R:mirrorRadius(st),n:PHET.iorMirror,D:st.mirrorD,flat:st.mirrorSurface==='flat'};
  return {kind:'lens',surface:st.lensSurface,f:lensFocal(st),R:lensRadius(st),
    n:lensIndex(st),D:st.lensD,flat:false};
}
/* the object point, with PhET's two constraints applied */
function objectPoint(st){
  return [clamp(st.objX,-460,-PHET.minObjectDist),clamp(st.objY,-PHET.maxOffAxis,PHET.maxOffAxis)];
}
/* PhET's second point of interest rides on the object.  For the light scene
   its two sources are independent and 46 cm apart in x; that offset is PhET's
   (its lights sit at (-170, 20) and (-124, -20)). */
const LIGHT_DX=PHET.light2[0]-PHET.light1[0];
function secondPoint(st){
  const P=objectPoint(st);
  return st.objKind==='light'?[clamp(P[0]+LIGHT_DX,-460,-PHET.minObjectDist),P[1]+st.secondOff]
                             :[P[0],P[1]+st.secondOff];
}

/* ----------------------------------------------------------- the bench */
function benchRays(op,P,mode,reach){
  const out=[];
  for(const d of rayDirections(mode,P,op.f,op.D)){
    const r=traceRay(op.kind,op.f,op.D,P,d,reach,mode!=='principal');
    if(r) out.push(r);
  }
  return out;
}
function benchModel(st,kind){
  const key=[kind,st.lensSurface,st.mirrorSurface,st.fControl,st.lensF,st.lensR,st.lensN,st.lensD,
             st.mirrorF,st.mirrorR,st.mirrorD,st.objKind,st.objX,st.objY,st.secondOff,
             st.rays,st.showSecond,st.showGuides,st.screenX].join('|');
  return memo('bench'+kind,key,()=>{
    const op=opticOf(st,kind), P=objectPoint(st), dO=-P[0];
    const img=imagePoint(kind,op.f,dO,P[1]);
    const light=(kind==='lens'&&st.objKind==='light');
    /* The drawn world: the object, the optic, the focal points THAT ARE DRAWN,
       and the image when it is anywhere near.  Equal aspect (it is a
       construction in which the ray SLOPES have to read correctly), so the
       frame is quoted on the canvas.  Only marks that are drawn go into the
       extent: a flat mirror's f = 100 000 cm once stretched the frame to 1640
       cm for a 170 cm scene and squeezed the whole picture into a corner, and
       a lens's 2F stretched it whenever the 2F points were switched off. */
    const drawF=!op.flat&&isFinite(op.f)&&Math.abs(op.f)<1e4;
    const fa=drawF?Math.abs(op.f):0;
    const fSides=(kind==='lens')?[-1,1]:((op.f>0)?[-1]:[1]);
    let xs=[P[0],0,-opticSign(kind)*90];
    if(drawF) for(const s of fSides){ xs.push(s*fa); if(st.show2F) xs.push(s*2*fa); }
    if(light) xs.push(st.screenX+30);
    if(isFinite(img.x)&&Math.abs(img.x)<700) xs.push(img.x);
    const xmin=Math.min.apply(null,xs)-20, xmax=Math.max.apply(null,xs)+20;
    let ys=[P[1],-P[1],op.D/2,-op.D/2,60,-60];
    if(isFinite(img.y)&&Math.abs(img.y)<260) ys.push(img.y,-img.y);
    if(light) ys.push(PHET.screenH/2,-PHET.screenH/2);
    if(st.showSecond){ const S=secondPoint(st); ys.push(S[1],-S[1]); }
    const ymin=Math.min.apply(null,ys)-10, ymax=Math.max.apply(null,ys)+10;
    const reach=(xmax-xmin)*1.6;
    const pts=[{P:P,tag:1}];
    if(st.showSecond) pts.push({P:secondPoint(st),tag:2});
    const bundles=pts.map(o=>{
      const dOi=-o.P[0];
      return {tag:o.tag,P:o.P,dO:dOi,img:imagePoint(kind,op.f,dOi,o.P[1]),
              rays:benchRays(op,o.P,st.rays,reach),
              spot:light?lightSpot(st.screenX,op.D,op.f,dOi,o.P[1]):null};
    });
    let guides=null;
    if(kind==='lens'&&st.showGuides){
      guides=pts.map(o=>({tag:o.tag,
        top:guideAngles(op.surface,op.f,op.D,o.P,1),
        bot:guideAngles(op.surface,op.f,op.D,o.P,-1),
        cross:guideCross(op.surface,op.f,op.D,o.P)}));
    }
    const offFrame=!isFinite(img.x)||img.x<xmin||img.x>xmax||Math.abs(img.y)>Math.max(-ymin,ymax);
    return {kind:kind,op:op,P:P,dO:dO,img:img,bundles:bundles,guides:guides,light:light,
            drawF:drawF,fSides:fSides,
            screenX:st.screenX,ext:{xmin:xmin,xmax:xmax,ymin:ymin,ymax:ymax},
            offFrame:offFrame,reach:reach,
            nRays:bundles.length?bundles[0].rays.length:0,
            nThrough:bundles.length?bundles[0].rays.filter(r=>!r.missed).length:0,
            resid:isFinite(img.di)?lensEqResidual(op.f,dO,img.di):0,
            newton:isFinite(img.di)?newtonProduct(op.f,dO):NaN};
  });
}

/* --------------------------------------------------- the conjugate curve */
function conjModel(st){
  const key=[st.lensSurface,st.fControl,st.lensF,st.lensR,st.lensN,st.objX,st.view].join('|');
  return memo('conj',key,()=>{
    const f=lensFocal(st), P=objectPoint(st), dO=-P[0];
    const xlo=PHET.minObjectDist, xhi=420;
    /* both branches of d_i(d_o), sampled away from the pole at d_o = f */
    const br=[];
    const pole=f>0?f:null;
    const push=(a,b)=>{
      const xs=[],ys=[],ms=[];
      const n=320;
      for(let i=0;i<=n;i++){
        const x=a+(b-a)*i/n;
        const di=imageDistance(f,x);
        xs.push(x); ys.push(di); ms.push(-di/x);
      }
      br.push({xs:xs,ys:ys,ms:ms});
    };
    if(pole!==null&&pole>xlo&&pole<xhi){ push(xlo,pole-1e-3); push(pole+1e-3,xhi); }
    else push(xlo,xhi);
    const di=imageDistance(f,dO);
    return {f:f,dO:dO,di:di,m:-di/dO,branches:br,pole:pole,xlo:xlo,xhi:xhi,
            resid:isFinite(di)?lensEqResidual(f,dO,di):0,
            newton:isFinite(di)?newtonProduct(f,dO):NaN,
            virtual:di<0,inside:pole!==null&&dO<pole};
  });
}

/* ------------------------------------------------------- the lens maker */
function makerModel(st){
  const key=[st.lensSurface,st.fControl,st.lensF,st.lensR,st.lensN,st.lensD].join('|');
  return memo('maker',key,()=>{
    const n=lensIndex(st), R=Math.abs(lensRadius(st)), D=st.lensD;
    const f=phetFocalFromR(R,n);
    /* the contour f = const in the (n, R) plane is the straight line
       R = 2 f (n - 1) -- which is why it is worth drawing */
    const levels=[40,60,80,100,120,160,220,300];
    const cons=levels.map(fv=>{
      const xs=[],ys=[];
      for(let i=0;i<=60;i++){
        const nn=PHET.iorLens[0]+(PHET.iorLens[1]-PHET.iorLens[0])*i/60;
        xs.push(nn); ys.push(phetRFromFocal(fv,nn));
      }
      return {f:fv,xs:xs,ys:ys};
    });
    const a=D/2;
    const sagTrue=(a<=R)?R-Math.sqrt(R*R-a*a):NaN;
    const sagDrawn=hollywoodSag(R,D);
    return {n:n,R:R,D:D,f:f,contours:cons,levels:levels,
            sagTrue:sagTrue,sagDrawn:sagDrawn,
            exists:isFinite(sagTrue),
            fThin:fThin(n,R,-R),
            fMax:phetFocalFromR(PHET.rocLens[1],PHET.iorLens[0]),
            fMin:phetFocalFromR(PHET.rocLens[0],PHET.iorLens[1])};
  });
}

/* ------------------------------------------------------------ the guides */
function guidesModel(st){
  const key=[st.lensSurface,st.fControl,st.lensF,st.lensR,st.lensN,st.lensD,st.objX,st.objY].join('|');
  return memo('guides',key,()=>{
    const f=lensFocal(st), D=st.lensD, P=objectPoint(st), surf=st.lensSurface;
    const dO=-P[0];
    const img=imagePoint('lens',f,dO,P[1]);
    const top=guideAngles(surf,f,D,P,1), bot=guideAngles(surf,f,D,P,-1);
    const cross=guideCross(surf,f,D,P);
    const slope=slopeCross(f,D,dO,P[1]);
    const miss=Math.hypot(cross.x-img.x,cross.y-img.y);
    /* the joint limit: shrink the lens AND the object's inclination together.
       The miss is O(e^2), which is measured here rather than asserted. */
    const es=[],ms=[];
    for(let i=0;i<=40;i++){
      const e=Math.pow(10,-2+2*i/40);
      const c=guideCross(surf,f,D*e,[P[0],P[1]*e]);
      const im=imagePoint('lens',f,dO,P[1]*e);
      es.push(e); ms.push(Math.abs(c.x-im.x));
    }
    return {f:f,D:D,P:P,dO:dO,img:img,top:top,bot:bot,cross:cross,slope:slope,
            miss:miss,missPct:100*miss/Math.hypot(img.x,img.y),
            r:guideRatio(f,D),turn:guideTurn(surf,f,D,1),
            ideal:idealTurn(f,dO,P[1],D,1),
            slopeMiss:Math.hypot(slope.x-img.x,slope.y-img.y),
            es:es,ms:ms,surface:surf};
  });
}

/* ----------------------------------------------------------- the real lens */
function realModel(st){
  const key=[st.fControl,st.lensF,st.lensR,st.lensN,st.lensD,st.realEdge,st.realH,st.realStop].join('|');
  return memo('real',key,()=>{
    const n=lensIndex(st), R=Math.abs(lensRadius(st)), D=st.lensD;
    const a=D/2;
    const exists=(a<R);
    const sag=exists?R-Math.sqrt(R*R-a*a):NaN;
    const t=exists?2*sag+st.realEdge:NaN;
    const semi=a;
    const stopA=a*st.realStop;
    const out={n:n,R:R,D:D,a:a,semi:semi,sag:sag,t:t,exists:exists,stop:stopA};
    if(!exists) return out;
    out.fThin=fThin(n,R,-R);
    out.fThick=fThick(n,R,-R,t);
    out.bfd=backFocal(n,R,-R,t);
    out.zPar=t+out.bfd;
    /* the traced fan: rays entering parallel to the axis */
    const hs=[],ls=[],bl=[];
    const NH=48;
    for(let i=1;i<=NH;i++){
      const hh=stopA*i/NH;
      const L=lsaAt(hh,n,R,-R,t,semi);
      if(!isFinite(L)) continue;
      hs.push(hh); ls.push(L); bl.push(blurAt(hh,n,R,-R,t,semi));
    }
    out.hs=hs; out.ls=ls; out.blur=bl;
    out.hMark=stopA*clamp(st.realH,0.02,1);
    out.lsaMark=lsaAt(out.hMark,n,R,-R,t,semi);
    out.blurMark=blurAt(out.hMark,n,R,-R,t,semi);
    out.lsaRim=ls.length?ls[ls.length-1]:NaN;
    out.pctF=100*Math.abs(out.lsaRim)/out.fThick;
    /* the coefficient of the h^2 law, measured at a small height */
    const hsm=stopA*0.02;
    out.c2=lsaAt(hsm,n,R,-R,t,semi)/(hsm*hsm);
    out.ratio=lsaAt(hsm*2,n,R,-R,t,semi)/lsaAt(hsm,n,R,-R,t,semi);
    /* the drawn ray bundle */
    const fan=[];
    const NF=11;
    for(let i=0;i<NF;i++){
      const hh=stopA*(-1+2*i/(NF-1));
      if(Math.abs(hh)<1e-9) continue;
      const r=traceRealLens([hh,-1.6*R],[0,1],n,R,-R,t,semi,false);
      if(r===null) continue;
      const zEnd=out.zPar+Math.max(30,Math.abs(out.lsaRim)*1.4);
      const s=(zEnd-r.p[1])/r.d[1];
      fan.push({pts:r.pts.concat([[r.p[0]+s*r.d[0],zEnd]]),h:hh,
                z:axisCrossing(r.p,r.d)});
    }
    out.fan=fan;
    out.zEnd=out.zPar+Math.max(30,Math.abs(out.lsaRim)*1.4);
    /* the same lens as a mirror of the same radius, for contrast */
    out.mirrorPar=Math.abs(R)/2;
    out.mirrorRim=mirrorMarginalFocus(R,Math.min(stopA,0.999*R));
    return out;
  });
}

function buildModel(st){
  st=st||ST;
  if(st.view==='bench') return benchModel(st,'lens');
  if(st.view==='mirror') return benchModel(st,'mirror');
  if(st.view==='conj') return conjModel(st);
  if(st.view==='maker') return makerModel(st);
  if(st.view==='guides') return guidesModel(st);
  return realModel(st);
}

function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function cm(x,n){ return isFinite(x)?(sigf(x,n===undefined?4:n)+' cm'):'&infin;'; }
function deg(x){ return isFinite(x)?(fmt(x*180/PI,2)+'&deg;'):'&mdash;'; }
function surfName(m){
  if(m.kind==='mirror') return m.op.surface==='flat'?'flat mirror'
    :(m.op.surface==='concave'?'concave mirror':'convex mirror');

}

function conjReadout(M){
  let s='<div class="rname">the conjugate curve<small>d<sub>i</sub> = f d<sub>o</sub> / (d<sub>o</sub> &minus; f)</small></div><table>';
  s+=hd('this optic');
