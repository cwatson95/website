/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}
/* the fluid: a translucent slab from ybot up to the surface yw across [x0, x1] */
function fluidRect(ctx,map,x0,x1,ybot,yw,col){
  const X0=map.X(x0), X1=map.X(x1), Y0=map.Y(yw), Y1=map.Y(ybot);
  ctx.fillStyle=col||rgba(COL.struct,0.16); ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
  ctx.strokeStyle=rgba(COL.struct,0.8); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y0); ctx.stroke();
  POLY_SEGS.push(X0,Y0,X1,Y0);
}
/* a force arrow whose world length is len x (F / Fref), with its label */
function forceArrow(ctx,W,H,map,at,F,Fref,dir,len,col,txt,labDx){
  const v=[0,dir*len*Math.min(Math.abs(F)/Math.max(Fref,1e-12),1.6)];
  arrowW(ctx,map,at,v,col,2);
  const tip=[at[0]+v[0],at[1]+v[1]];
  if(txt) lab(ctx,W,H,map.X(tip[0])+(labDx===undefined?8:labDx),map.Y(tip[1]),txt,col,LAB_FONT,labDx!==undefined&&labDx<0?'right':'left');
}
/* ================================================================== *
 *  view: the lens bench / the mirror bench  (PhET's two screens)      *
 *                                                                     *
 *  Everything here is drawn at EQUAL ASPECT and the scale is printed  *
 *  on the canvas: this is a construction in which the ray slopes have *
 *  to read correctly, so the two axes cannot be fitted independently  *
 *  (buoyancy/Rayleigh-Taylor Known-bad, the other way round).         *
 * ================================================================== */

/* Every layout reserves HINT_H at the bottom: the house #hint is HTML at
   bottom:11px and the canvas capture cannot see it, so a caption anchored at
   H - 12 would sit underneath it (Known-bad, wave-on-a-string).  The caption
   is painted LAST but occupies the bottom band from the moment the layout is
   known, so its rectangle goes into the label registry FIRST -- otherwise a
   stage label near the bottom dodges nothing and lands on the prose. */
function layout(ctx,W,H,full,short,nB,frac,nBn){
  const L=stageLayout(ctx,W,H-HINT_H,full,short,nB,frac,nBn);
  LABELS.push([L.left-2,L.capY-5,L.left+L.capW+2,H-HINT_H-6]);
  return L;
}
/* Anything non-obvious about the drawing itself -- above all a scale factor or
   a degenerate case -- belongs IN the caption, not floating above it: a second
   text block just above the caption band collides with the bottom panel's axis
   label at every canvas size that has one. */
function capWith(base,notes){ return notes.length?(base+' '+notes.join(' ')):base; }

/* The last layout, so selfTest can assert that nothing was drawn into the
   caption band.  Every geo function sets it. */
let LAST_L=null;

/* Liang-Barsky clip of a world-space segment to the world box.  A ray is DATA
   rather than an axis line, but the house rule covers both: everything drawn
   inside a frame is clipped to it.  Without this the outgoing rays ran across
   the caption and, in the analysis views, across the panel below -- found by
   looking at the PNGs, which is the only thing that can see it. */
function clipSeg(a,b,ext){
  let t0=0,t1=1;
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const p=[-dx,dx,-dy,dy], q=[a[0]-ext.xmin,ext.xmax-a[0],a[1]-ext.ymin,ext.ymax-a[1]];
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return null; continue; }
    const r=q[i]/p[i];
    if(p[i]<0){ if(r>t1) return null; if(r>t0) t0=r; }
    else { if(r<t0) return null; if(r<t1) t1=r; }
  }
  return [[a[0]+t0*dx,a[1]+t0*dy],[a[0]+t1*dx,a[1]+t1*dy]];
}
function segW(ctx,map,a,b,ext,col,lw,dash){
  const c=clipSeg(a,b,ext); if(!c) return false;
  seg(ctx,map,c[0],c[1],col,lw,dash); return true;
}
/* legendAuto() avoids CURVES and not LABELS, so it lands on a stage label that
   was drawn earlier (Known-bad, pupil_plane).  This checks both registries and
   then registers its own rectangle, so later labels dodge it as well.  If every
   corner is taken it draws nothing rather than a legend on top of the picture --
   the captions name the colours. */
function legendSafe(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],[b.x1-bw-8,b.y1-bh-8],
               [b.x+(b.w-bw)/2,b.y+8],[b.x+(b.w-bw)/2,b.y1-bh-8]];
  for(const c of cands){
    const cx=c[0], cy=c[1];
    if(cx<0||cy<0||cx+bw>b.x1+2||cy+bh>b.y1+2) continue;
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) for(const o of LABELS)
      if(cx<o[2]-0.5&&cx+bw>o[0]+0.5&&cy<o[3]-0.5&&cy+bh>o[1]+0.5){ hit=true; break; }
    if(!hit){ const r=legendBox(ctx,cx,cy,items); LABELS.push([cx,cy,cx+bw,cy+bh]); return r; }
  }
  return null;
}

/* a point source: PhET's Light scene has no arrow to image, it has a lamp */
function drawSource(ctx,map,P,alpha){
  const X=map.X(P[0]), Y=map.Y(P[1]);
  for(let i=0;i<8;i++){ const a=i*PI/4;
    ctx.beginPath();
    ctx.moveTo(X+7*Math.cos(a),Y+7*Math.sin(a));
    ctx.lineTo(X+12.5*Math.cos(a),Y+12.5*Math.sin(a));
    ctx.strokeStyle=rgba('#ffe9a8',0.8*alpha); ctx.lineWidth=1.3; ctx.stroke(); }
  dot(ctx,X,Y,4.5,rgba('#ffe9a8',0.95*alpha),'#fff',1.2);
}

/* the object silhouettes, in a unit frame: u across (-0.5..0.5), v along the
   object from the axis (0) to its tip (1).  They are flat cards standing on
   the optical axis; the image is the same card scaled by m, which is PhET's
   convention and is stated on the canvas. */
const OBJ_ASPECT={pencil:0.30,penguin:0.46,star:0.80,arrow:0.34,light:0.34};
const OBJ_SHAPE={
  pencil:[[-0.22,0],[0.22,0],[0.22,0.74],[0.16,0.84],[0,1],[-0.16,0.84],[-0.22,0.74]],
  penguin:[[-0.16,0],[-0.05,0.03],[0.05,0.03],[0.16,0],[0.13,0.07],
           [0.22,0.20],[0.30,0.42],[0.28,0.60],[0.20,0.72],
           [0.14,0.80],[0.13,0.88],[0.08,0.96],[0,0.99],[-0.08,0.96],[-0.13,0.88],
           [-0.14,0.80],[-0.20,0.72],[-0.28,0.60],[-0.30,0.42],[-0.22,0.20],[-0.13,0.07]],
  star:null,      /* built below */
  arrow:[[-0.06,0],[0.06,0],[0.06,0.68],[0.20,0.68],[0,1],[-0.20,0.68],[-0.06,0.68]],
  light:null
};
(function(){
  const pts=[];
  for(let i=0;i<10;i++){
    const a=PI/2+i*PI/5, r=(i%2===0)?0.5:0.20;
    pts.push([r*Math.cos(a),0.52+r*Math.sin(a)*1.0]);
  }
  /* a stem down to the axis so the star stands on it like the others */
  OBJ_SHAPE.star=pts.concat([[0.04,0.10],[0.04,0],[-0.04,0],[-0.04,0.10]]);
})();
function objPolyWorld(kind,x,tip,scale){
  const shp=OBJ_SHAPE[kind]||OBJ_SHAPE.arrow;
  const wid=OBJ_ASPECT[kind]*Math.abs(tip)*Math.abs(scale===undefined?1:scale);
  const hgt=tip*(scale===undefined?1:scale);
  return shp.map(p=>[x+p[0]*wid*2,p[1]*hgt]);
}

/* PhET's optic outline.  The lens uses the TRUE sag |R| - sqrt(R^2 - (D/2)^2)
   when the sphere can carry the aperture, and PhET's softened
   (D/2)^2/2(|R|+100) when it cannot -- which the canvas says. */
function opticOutline(op){
  const a=op.D/2, R=Math.abs(op.R);
  const trueSag=(a<R)?R-Math.sqrt(R*R-a*a):NaN;
  const sag=isFinite(trueSag)?trueSag:hollywoodSag(R,op.D);
  const NS=22, pts=[];
  if(op.kind==='mirror'){
    /* A CONCAVE mirror is the inside of a sphere whose centre of curvature sits
       in FRONT of it, so its rim reaches back toward the light (x < 0) and its
       vertex is the deepest point (x = 0).  A convex mirror is the other way
       round.  The first version had this backwards and drew a concave mirror
       with the shape of a convex one -- correct physics, wrong picture, and
       only a PNG can see it. */
    const s=(op.surface==='concave')?-1:1;
    if(op.surface==='flat') return {front:[[0,-a],[0,a]],body:null,sag:0,hollywood:false};
    for(let i=0;i<=NS;i++){
      const y=-a+2*a*i/NS;
      const sg=isFinite(trueSag)?(R-Math.sqrt(Math.max(R*R-y*y,0))):hollywoodSag(R,2*Math.abs(y));
      pts.push([s*sg,y]);
    }
    /* the silvered backing is BEHIND the mirror, which is +x for both kinds */
    const back=pts.slice().reverse().map(p=>[p[0]+5,p[1]]);
    return {front:pts,body:pts.concat(back),sag:sag,hollywood:!isFinite(trueSag)};
  }
  const conv=(op.surface==='convex');
  const front=[],back=[];
  for(let i=0;i<=NS;i++){
    const y=-a+2*a*i/NS;
    const sg=isFinite(trueSag)?(R-Math.sqrt(Math.max(R*R-y*y,0))):hollywoodSag(R,2*Math.abs(y));
    if(conv){ front.push([-(sag-sg),y]); back.push([sag-sg,y]); }
    else    { front.push([-sg,y]);       back.push([sg,y]); }
  }
  return {front:front,body:front.concat(back.slice().reverse()),sag:sag,
          hollywood:!isFinite(trueSag)};
}

function drawOptic(ctx,map,op){
  const o=opticOutline(op);
  if(op.surface==='flat'){
    ctx.strokeStyle=COL.glass2; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(map.X(0),map.Y(-op.D/2)); ctx.lineTo(map.X(0),map.Y(op.D/2)); ctx.stroke();
    POLY_SEGS.push(map.X(0),map.Y(-op.D/2),map.X(0),map.Y(op.D/2));
    /* the hatching that says "this side is the back" */
    for(let i=0;i<=10;i++){
      const y=-op.D/2+op.D*i/10;
      ctx.beginPath(); ctx.moveTo(map.X(0),map.Y(y)); ctx.lineTo(map.X(0)+7,map.Y(y)+7);
      ctx.strokeStyle=rgba(COL.glass2,0.6); ctx.lineWidth=1; ctx.stroke();
    }
    return o;
  }
  worldPoly(ctx,map,o.body,rgba(COL.glass,0.42),COL.glass2,1.6);
  return o;
}

/* a small cross marker with a label */
function markPoint(ctx,W,H,map,x,y,col,txt,dy){
  const X=map.X(x), Y=map.Y(y), r=4.5;
  ctx.strokeStyle=col; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(X-r,Y-r); ctx.lineTo(X+r,Y+r);
  ctx.moveTo(X-r,Y+r); ctx.lineTo(X+r,Y-r); ctx.stroke();
  if(txt) lab(ctx,W,H,X,Y+(dy===undefined?-12:dy),txt,col,SM_FONT,'center');
}

function drawRuler(ctx,W,H,map,y0){
  const L=PHET.rulerH, x0=-L/2;
  const Y=map.Y(y0), X0=map.X(x0), X1=map.X(x0+L);
  ctx.fillStyle='rgba(20,26,40,.86)'; ctx.fillRect(X0,Y,X1-X0,19);
  frame(ctx,box(X0,Y,X1-X0,19),'#39506b');
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font='9px -apple-system, sans-serif';
  for(let c=0;c<=L;c+=10){
    const X=map.X(x0+c), big=(c%50===0);
    ctx.strokeStyle='#8fb8d4'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X,Y+(big?9:5)); ctx.stroke();
    if(big){ ctx.fillStyle='#8fb8d4'; ctx.fillText(String(c),X,Y+9); }
  }
  /* the ruler's own name goes ABOVE the band: inside it, it lands on the
     zero tick label, which is exactly where the eye looks first */
  lab(ctx,W,H,X0+2,Y-8,'PhET&rsquo;s 260 cm ruler','#6f7789',SM_FONT,'left');
}

const BENCH_CAP_FULL=
 'PhET&rsquo;s bench. Drag the object (or use the sliders); the rays are bent by u&prime; = u &minus; h/f '
+'at the optic plane and nothing else &mdash; so where they meet IS the image the thin-optic equation '
+'gives, to machine precision, and the readout prints the residual. Solid green: light that really '
+'goes there. Dashed orange: the backward extension, which is all a virtual image ever is.';
const BENCH_CAP_SHORT='Rays bent by u&prime; = u &minus; h/f meet at the image the equation gives.';

/* the notes the bench must print, whatever the caption ends up saying */
function benchNotes(M,st,map){
  const op=M.op, notes=[];
  notes.push('Equal aspect, '+sigf(map?map.s:1,3)+' px per cm.');
  const a=op.D/2, R=Math.abs(op.R);
  if(!(a<R)) notes.push('The drawn lens uses PhET&rsquo;s softened sag: R = '+sigf(R,3)
    +' cm cannot carry a '+sigf(a,3)+' cm semi-aperture.');
  if(!isFinite(M.img.di)) notes.push('d_o = f exactly: there is no image and the outgoing rays are parallel.');
  else if(M.offFrame) notes.push('The image is off the frame, at x = '+sigf(M.img.x,5)+' cm.');
  if(M.nThrough===0&&st.rays!=='none') notes.push('No ray reaches the optic at this aperture.');
  if(op.flat) notes.push('PhET&rsquo;s flat mirror is f = 100 000 cm, not a plane: its image sits '
    +sigf(Math.abs(M.img.di)-M.dO,3)+' cm further back and m = '+fmt(M.img.m,5)+', not 1.');
  return notes;
}
function benchGeo(ctx,W,H,M,st){
  st=st||ST;
  /* the map is needed for the scale note and the note changes the caption
     height, so the layout is taken twice: once to size the world, once with
     the finished caption.  Both are cheap. */
  const L0=stageLayout(ctx,W,H-HINT_H,BENCH_CAP_FULL,BENCH_CAP_SHORT,0,0,0);
  const notes=benchNotes(M,st,worldFitUp(L0.main,M.ext,8));
  const L=layout(ctx,W,H,capWith(BENCH_CAP_FULL,notes),capWith(BENCH_CAP_SHORT,notes),0,0,0);
  LAST_L=L;
  return {L:L,map:worldFitUp(L.main,M.ext,8)};
}

function drawBench(ctx,W,H,M,st){
  const G=benchGeo(ctx,W,H,M,st), L=G.L, map=G.map;
  const op=M.op, ext=M.ext;
  /* the optical axis */
  seg(ctx,map,[ext.xmin,0],[ext.xmax,0],rgba(COL.axis,0.95),1.2,[6,5]);
  lab(ctx,W,H,map.X(ext.xmin)+4,map.Y(0)+(M.P[1]>=0?11:-10),'optical axis',COL.axis,SM_FONT,'left');

  /* F and 2F.  A lens has them on both sides; a concave mirror has both to the
     LEFT, a convex mirror both to the right, and a flat mirror has none
     (PhET's doc/model.md says exactly this). */
  const fa=Math.abs(op.f);
  if(M.drawF){
    for(const s of M.fSides){
      if(st.showF) markPoint(ctx,W,H,map,s*fa,0,COL.ref,st.showLabels?'F':'',-11);
      if(st.show2F) markPoint(ctx,W,H,map,s*2*fa,0,rgba(COL.ref,0.65),st.showLabels?'2F':'',-11);
    }
  }

  /* the rays, under the optic and the object so the shapes stay readable */
  M.bundles.forEach(b=>{
    const alpha=b.tag===1?1:0.55;
    b.rays.forEach(r=>{
      segW(ctx,map,r.inSeg[0],r.inSeg[1],ext,rgba(COL.ray,0.9*alpha),1.5);
      if(r.outSeg) segW(ctx,map,r.outSeg[0],r.outSeg[1],ext,rgba(r.missed?COL.dim:COL.ray,0.9*alpha),1.5);
      if(r.virtSeg&&st.showVirtual) segW(ctx,map,r.virtSeg[0],r.virtSeg[1],ext,rgba(COL.virt,0.85*alpha),1.6,[5,4]);
    });
  });

  /* PhET's guides */
  if(M.guides){
    M.guides.forEach(g=>{
      [g.top,g.bot].forEach(a=>{
        const arm=Math.min(Math.abs(M.P[0]),240)*0.55;
        const A=[a.fulcrum[0]+arm*Math.cos(a.incident),a.fulcrum[1]+arm*Math.sin(a.incident)];
        const B=[a.fulcrum[0]+arm*Math.cos(a.transmitted),a.fulcrum[1]+arm*Math.sin(a.transmitted)];
        segW(ctx,map,a.fulcrum,A,ext,rgba(COL.guide,0.75),2.4);
        segW(ctx,map,a.fulcrum,B,ext,rgba(COL.guide,0.75),2.4);
        dot(ctx,map.X(a.fulcrum[0]),map.Y(a.fulcrum[1]),3,COL.guide,'#fff',1);
      });
      if(isFinite(g.cross.x)) markPoint(ctx,W,H,map,g.cross.x,g.cross.y,COL.guide,
        st.showLabels&&g.tag===1?'guides cross':'',12);
    });
  }

  /* the projection screen and the light spots */
  if(M.light){
    const sx=M.screenX, hH=PHET.screenH/2;
    worldPoly(ctx,map,[[sx-8,-hH],[sx+8,-hH],[sx+8,hH],[sx-8,hH]],'rgba(200,206,220,.16)','#aeb6c6',1.4);
    M.bundles.forEach(b=>{
      if(!b.spot) return;
      const y0=Math.min(b.spot.top,b.spot.bottom), y1=Math.max(b.spot.top,b.spot.bottom);
      const I=spotIntensity(b.spot.diameter,op.D);
      const yy0=clamp(y0,-hH,hH), yy1=clamp(y1,-hH,hH);
      if(yy1>yy0) worldPoly(ctx,map,[[sx-8,yy0],[sx+8,yy0],[sx+8,yy1],[sx-8,yy1]],
        rgba('#ffe9a8',0.18+0.7*I),null,0);
    });
    lab(ctx,W,H,map.X(sx),map.Y(hH)-12,'screen (geometric shadow)','#aeb6c6',SM_FONT,'center');
  }

  /* the optic */
  const oo=drawOptic(ctx,map,op);
  seg(ctx,map,[0,-op.D/2],[0,op.D/2],rgba(COL.struct,0.35),1,[3,4]);

  /* the object and its image */
  M.bundles.forEach(b=>{
    const alpha=b.tag===1?1:0.55;
    if(M.light) drawSource(ctx,map,b.P,alpha);
    else {
      if(Math.abs(b.P[1])>1.5)
        worldPoly(ctx,map,objPolyWorld(st.objKind,b.P[0],b.P[1]),rgba(COL.obj,0.32*alpha),COL.obj,1.6);
      dot(ctx,map.X(b.P[0]),map.Y(b.P[1]),3.5,COL.obj,'#fff',1);
    }
    const im=b.img;
    if(isFinite(im.x)&&(!im.virtual||st.showVirtual)&&Math.abs(im.x)<4000&&Math.abs(im.y)<4000){
      const dash=im.virtual?[5,4]:null;
      /* a POINT source has a point image: drawing a silhouette there would be
         a picture of something that is not in the model */
      if(Math.abs(im.y)>1.5&&!M.light){
        const poly=objPolyWorld(st.objKind,im.x,b.P[1]*im.m,1);
        worldPoly(ctx,map,poly,rgba(COL.img,(im.virtual?0.12:0.28)*alpha),
                  im.virtual?COL.virt:COL.img,1.6,dash);
      }
      dot(ctx,map.X(im.x),map.Y(im.y),3.5,im.virtual?COL.virt:COL.img,'#fff',1);
    }
  });

  /* labels */
  if(st.showLabels){
    lab(ctx,W,H,map.X(M.P[0]),map.Y(M.P[1])-13,'Object',COL.obj,LAB_FONT,'center');
    const im=M.img;
    if(isFinite(im.x)&&(!im.virtual||st.showVirtual)&&Math.abs(im.x)<4000)
      lab(ctx,W,H,map.X(im.x),map.Y(im.y)+(im.y<0?15:-13),
          im.virtual?'Virtual Image':'Real Image',im.virtual?COL.virt:COL.img,LAB_FONT,'center');
    lab(ctx,W,H,map.X(0),map.Y(op.D/2)-13,surfName(M),COL.glass2,LAB_FONT,'center');
  }
  if(st.showRuler) drawRuler(ctx,W,H,map,ext.ymin+6);

  /* everything the reader must not have to assume is already in the caption */
  drawCaption(ctx,L);
  legendSafe(ctx,L.main,[[COL.ray,'real ray'],[COL.virt,'virtual extension'],
    [COL.obj,'object'],[COL.img,'image'],[COL.ref,'F, 2F']]);
}
/* ================================================================== *
 *  views: the conjugate curve, the lens maker, the guides,            *
 *         the real lens  --  then the dispatch and the scene          *
 * ================================================================== */

/* ------------------------------------------------------ the conjugate curve */
const CONJ_CAP_FULL=
 'The law itself. d_i against d_o is a rectangular hyperbola whose asymptotes are d_o = f and '
+'d_i = f: bring the object in toward the focal point and the image runs away to infinity, cross it '
+'and the image reappears on the other side as a virtual one. Newton&rsquo;s form says the same thing '
+'in one product &mdash; measure both distances from the focal points and they multiply to f&sup2;. '
+'The lower panel is the magnification, which changes sign at the same place.';
const CONJ_CAP_SHORT='d_i against d_o: a hyperbola with asymptotes d_o = f and d_i = f. m changes sign at the pole.';

function conjGeo(ctx,W,H,M){
  const fa=Math.abs(M.f);
  const ylo=-3.2*fa, yhi=5.2*fa;
  const note='The d_i axis is cut at '+fmt(ylo,0)+' and '+fmt(yhi,0)
    +' cm &mdash; the curve really does run to &plusmn;&infin; at the pole &mdash; and m is cut at &plusmn;4.2.';
  const L=layout(ctx,W,H,CONJ_CAP_FULL+' '+note,CONJ_CAP_SHORT+' '+note,1,0.40,1);
  LAST_L=L;
  return {L:L,ylo:ylo,yhi:yhi,mlo:-4.2,mhi:4.2};
}
function drawConj(ctx,W,H,M,st){
  const G=conjGeo(ctx,W,H,M), L=G.L, b=L.main, b2=L.bottom[0];
  axesR(ctx,b,M.xlo,M.xhi,G.ylo,G.yhi,{xlab:'object distance d_o, cm',
    ylab:'image distance d_i, cm',title:titleFor(b,'the image distance against the object distance','d_i against d_o'),
    nx:7,ny:7,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  /* the asymptotes, clipped by polyline to the frame */
  if(M.pole!==null){
    polyline(ctx,b,[M.pole,M.pole],[G.ylo,G.yhi],M.xlo,M.xhi,G.ylo,G.yhi,rgba(COL.ref,0.55),1.2,[5,4]);
    lab(ctx,W,H,b.x+b.w*(M.pole-M.xlo)/(M.xhi-M.xlo)+5,b.y+13,'d_o = f',COL.ref,SM_FONT,'left');
  }
  polyline(ctx,b,[M.xlo,M.xhi],[M.f,M.f],M.xlo,M.xhi,G.ylo,G.yhi,rgba(COL.ref,0.55),1.2,[5,4]);
  lab(ctx,W,H,b.x1-5,b.y1-b.h*(M.f-G.ylo)/(G.yhi-G.ylo)-9,'d_i = f',COL.ref,SM_FONT,'right');
  polyline(ctx,b,[M.xlo,M.xhi],[0,0],M.xlo,M.xhi,G.ylo,G.yhi,rgba(COL.axis,0.9),1);
  M.branches.forEach(br=>polyline(ctx,b,br.xs,br.ys,M.xlo,M.xhi,G.ylo,G.yhi,COL.pos,2));
  if(isFinite(M.di)&&M.di>G.ylo&&M.di<G.yhi) marker(ctx,b,M.xlo,M.xhi,G.ylo,G.yhi,M.dO,M.di,COL.live);
  else lab(ctx,W,H,b.x+b.w*(M.dO-M.xlo)/(M.xhi-M.xlo),b.y+30,
      isFinite(M.di)?'d_i = '+sigf(M.di,5)+' cm, off this axis':'d_i is infinite here',COL.live,SM_FONT,'center');
  lab(ctx,W,H,b.x1-8,b.y1-10,'d_i > 0: real, on the far side'+(M.f>0?'':' \u2014 a diverging optic never reaches it'),
      COL.pos,SM_FONT,'right');

  axesR(ctx,b2,M.xlo,M.xhi,G.mlo,G.mhi,{xlab:'object distance d_o, cm',ylab:'m',
    title:'the magnification m = &minus;d_i/d_o',nx:7,ny:5,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  polyline(ctx,b2,[M.xlo,M.xhi],[0,0],M.xlo,M.xhi,G.mlo,G.mhi,rgba(COL.axis,0.9),1);
  polyline(ctx,b2,[M.xlo,M.xhi],[-1,-1],M.xlo,M.xhi,G.mlo,G.mhi,rgba(COL.ref,0.5),1.1,[5,4]);
  M.branches.forEach(br=>polyline(ctx,b2,br.xs,br.ms,M.xlo,M.xhi,G.mlo,G.mhi,COL.pos,2));
  if(M.pole!==null)
    polyline(ctx,b2,[M.pole,M.pole],[G.mlo,G.mhi],M.xlo,M.xhi,G.mlo,G.mhi,rgba(COL.ref,0.55),1.2,[5,4]);
  if(isFinite(M.m)&&M.m>G.mlo&&M.m<G.mhi) marker(ctx,b2,M.xlo,M.xhi,G.mlo,G.mhi,M.dO,M.m,COL.live);
  if(M.f>0) lab(ctx,W,H,b2.x1-6,b2.y1-b2.h*(-1-G.mlo)/(G.mhi-G.mlo)-8,'m = &minus;1 at d_o = 2f',COL.ref,SM_FONT,'right');
  drawCaption(ctx,L);
  legendSafe(ctx,b,[[COL.pos,'the solved d_i'],[COL.ref,'asymptotes'],[COL.live,'this bench']]);
}

/* ---------------------------------------------------------- the lens maker */
const MAKER_CAP_FULL=
 'Where f comes from. PhET gives both surfaces the same radius, so the lens maker&rsquo;s equation '
+'collapses to f = R/2(n&minus;1) and its contours in the (n, R) plane are straight lines through '
+'n = 1 &mdash; a lens of index 1 is not a lens. PhET offers the same optic two ways: set f directly '
+'with n pinned at 1.5, or set R and n and let f follow. The panel on the right is the shape the '
+'artwork actually draws, against the shape those numbers describe.';
const MAKER_CAP_SHORT='f = R/2(n&minus;1): contours in the (n, R) plane, and the drawn shape against the real one.';

const MAKER_NOTE='The contours are exact lines: R = 2f(n&minus;1). Neither panel is a ray trace &mdash; the '
+'bench treats this lens as ideal, and only THE REAL LENS asks what its two spheres actually do.';
function makerGeo(ctx,W,H,M){
  const L=layout(ctx,W,H,MAKER_CAP_FULL+' '+MAKER_NOTE,MAKER_CAP_SHORT+' '+MAKER_NOTE,1,0.42,1);
  LAST_L=L;
  return {L:L};
}
function drawMaker(ctx,W,H,M,st){
  const G=makerGeo(ctx,W,H,M), L=G.L, b=L.main, b2=L.bottom[0];
  const nlo=PHET.iorLens[0], nhi=PHET.iorLens[1], rlo=PHET.rocLens[0], rhi=PHET.rocLens[1];
  axesR(ctx,b,nlo,nhi,rlo,rhi,{xlab:'index of refraction n',ylab:'radius of curvature |R|, cm',
    title:titleFor(b,'contours of the focal length in PhET&rsquo;s (n, R) box','f in the (n, R) box'),
    nx:7,ny:6,xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,0)});
  M.contours.forEach(c=>{
    const near=Math.abs(c.f-M.f)<1e-9;
    polyline(ctx,b,c.xs,c.ys,nlo,nhi,rlo,rhi,near?COL.pos:rgba(COL.struct,0.55),near?2.2:1.2);
    /* label each contour at the middle of the span it has INSIDE the box: a
       label at the box edge lands in the tick row and reads as a collision */
    const inb=[];
    for(let i=0;i<c.xs.length;i++) if(c.ys[i]>=rlo&&c.ys[i]<=rhi) inb.push(i);
    if(inb.length>3){
      const k=inb[Math.floor(inb.length/2)];
      lab(ctx,W,H,b.x+b.w*(c.xs[k]-nlo)/(nhi-nlo),
        b.y1-b.h*(c.ys[k]-rlo)/(rhi-rlo)-9,'f = '+c.f,near?COL.pos:rgba(COL.struct,0.8),
        SM_FONT,'center');
    }
  });
  marker(ctx,b,nlo,nhi,rlo,rhi,M.n,M.R,COL.live);
  {
    const mY=b.y1-b.h*(M.R-rlo)/(rhi-rlo);
    lab(ctx,W,H,b.x+b.w*(M.n-nlo)/(nhi-nlo)+8,clamp(mY+12,b.y+10,b.y1-10),
        'f = '+sigf(M.f,4)+' cm',COL.live,LAB_FONT,'left');
  }
  lab(ctx,W,H,b.x+8,b.y+14,'PhET&rsquo;s direct model sits on n = 1.50, where R = f exactly',
      rgba(COL.ref,0.95),SM_FONT,'left');
  polyline(ctx,b,[1.5,1.5],[rlo,rhi],nlo,nhi,rlo,rhi,rgba(COL.ref,0.6),1.2,[5,4]);

  /* the drawn shape against the real one, at equal aspect */
  const a=M.D/2;
  const ext={xmin:-Math.max(M.sagDrawn,isFinite(M.sagTrue)?M.sagTrue:0)*1.5-4,
             xmax:Math.max(M.sagDrawn,isFinite(M.sagTrue)?M.sagTrue:0)*1.5+4,
             ymin:-a-4,ymax:a+4};
  const map=worldFitUp(b2,ext,2);
  const trueProf=[],drawnProf=[];
  for(let i=0;i<=28;i++){
    const y=-a+2*a*i/28;
    if(isFinite(M.sagTrue)) trueProf.push([-(M.sagTrue-(M.R-Math.sqrt(Math.max(M.R*M.R-y*y,0)))),y]);
    drawnProf.push([-(M.sagDrawn-hollywoodSag(M.R,2*Math.abs(y))),y]);
  }
  const mirrorX=p=>p.map(q=>[-q[0],q[1]]);
  if(trueProf.length)
    worldPoly(ctx,map,trueProf.concat(mirrorX(trueProf).reverse()),rgba(COL.glass,0.40),COL.glass2,1.6);
  worldPoly(ctx,map,drawnProf.concat(mirrorX(drawnProf).reverse()),null,COL.ref,1.6,[5,4]);
  frame(ctx,b2,'#242a3a');
  lab(ctx,W,H,b2.x+8,b2.y+12,'the shape PhET draws (dashed) against the sphere it names',
      '#aeb6c6',LAB_FONT,'left');
  lab(ctx,W,H,b2.x+8,b2.y+28,'drawn half-thickness '+sigf(M.sagDrawn,4)+' cm',COL.ref,SM_FONT,'left');
  lab(ctx,W,H,b2.x+8,b2.y+42,M.exists?('true sag '+sigf(M.sagTrue,4)+' cm'):
      'no sphere of this radius carries this aperture',M.exists?COL.glass2:COL.live,SM_FONT,'left');
  lab(ctx,W,H,b2.x1-8,b2.y1-10,'equal aspect, '+sigf(map.s,3)+' px per cm','#6f7789',SM_FONT,'right');
  drawCaption(ctx,L);
}

/* ------------------------------------------------------------- the guides */
const GUIDE_CAP_FULL=
 'PhET invented the guides: two arms hinged at the rim of the lens, each turning the light through '
+'a fixed angle 2 arctan(D/4f). Where the two transmitted arms cross is meant to be the image. It very '
+'nearly is &mdash; and the gap is instructive, because a thin optic changes a ray&rsquo;s SLOPE by '
+'&minus;h/f while a guide rotates it by an ANGLE. The lower panel shrinks the lens and the object '
+'inclination together: the miss falls as the square, so the guides are the thin-optic construction '
+'to second order and no further. Orange: the guides. Green: the true rim rays, which the incident '
+'arms lie exactly on top of.';
const GUIDE_CAP_SHORT='PhET&rsquo;s hinged guides (orange) against the true rim rays (green): a fixed '
+'rotation where a thin optic changes a slope. The miss is O(e&sup2;).';

const GUIDE_NOTE='Both panels use the lens on the bench. Shrinking D alone does NOT fix it: the miss '
+'sticks near 4.5 %, because the surviving error is the u&sup2; of the ray&rsquo;s own inclination.';
function guidesGeo(ctx,W,H,M){
  const live='Here the guides cross '+sigf(M.miss,3)+' cm from the image ('+fmt(M.missPct,2)
    +' %), while the same pair bent by u&prime; = u &minus; h/f misses by '+M.slopeMiss.toExponential(1)+' cm.';
  const L=layout(ctx,W,H,GUIDE_CAP_FULL+' '+live+' '+GUIDE_NOTE,
                 GUIDE_CAP_SHORT+' '+live+' '+GUIDE_NOTE,1,0.40,1);
  LAST_L=L;
  const xs=[M.P[0],0,Math.abs(M.f),-Math.abs(M.f)];
  if(isFinite(M.img.x)&&Math.abs(M.img.x)<600) xs.push(M.img.x*1.08);
  if(isFinite(M.cross.x)&&Math.abs(M.cross.x)<600) xs.push(M.cross.x);
  const ys=[M.P[1],-M.P[1],M.D/2,-M.D/2,30,-30];
  if(isFinite(M.img.y)&&Math.abs(M.img.y)<300) ys.push(M.img.y,-M.img.y);
  const ext={xmin:Math.min.apply(null,xs)-20,xmax:Math.max.apply(null,xs)+20,
             ymin:Math.min.apply(null,ys)-10,ymax:Math.max.apply(null,ys)+10};
  return {L:L,map:worldFitUp(L.main,ext,6),ext:ext};
}
function drawGuides(ctx,W,H,M,st){
  const G=guidesGeo(ctx,W,H,M), L=G.L, map=G.map, b2=L.bottom[0], ext=G.ext;
  seg(ctx,map,[ext.xmin,0],[ext.xmax,0],rgba(COL.axis,0.95),1.2,[6,5]);
  const op=opticOf(st,'lens');
  drawOptic(ctx,map,op);
  const reach=2*(ext.xmax-ext.xmin);
  /* PhET's guides go down FIRST: their incident arms lie exactly on the true
     rays by construction, so whichever is painted last is the only one seen
     (Known-bad: the last fan drawn is the only one you see). */
  [M.top,M.bot].forEach(a=>{
    const arm=Math.min(Math.abs(M.P[0]),260)*0.5;
    segW(ctx,map,a.fulcrum,[a.fulcrum[0]+arm*Math.cos(a.incident),a.fulcrum[1]+arm*Math.sin(a.incident)],
        ext,rgba(COL.guide,0.85),3);
    segW(ctx,map,a.fulcrum,[a.fulcrum[0]+reach*Math.cos(a.transmitted),a.fulcrum[1]+reach*Math.sin(a.transmitted)],
        ext,rgba(COL.guide,0.85),3);
    dot(ctx,map.X(a.fulcrum[0]),map.Y(a.fulcrum[1]),4,COL.guide,'#fff',1.2);
  });
  /* then the true pair of rays through the rim, by the slope law, on top */
  [1,-1].forEach(s=>{
    const h=s*M.D/2;
    const u=(h-M.P[1])/M.dO, up=bend(u,h,M.f);
    segW(ctx,map,M.P,[0,h],ext,rgba(COL.pos,0.9),1.5);
    segW(ctx,map,[0,h],[reach,h+up*reach],ext,rgba(COL.pos,0.9),1.5);
  });
  if(Math.abs(M.P[1])>1.5)
    worldPoly(ctx,map,objPolyWorld(st.objKind,M.P[0],M.P[1]),rgba(COL.obj,0.3),COL.obj,1.5);
  dot(ctx,map.X(M.P[0]),map.Y(M.P[1]),3.5,COL.obj,'#fff',1);
  if(isFinite(M.img.x)){
    markPoint(ctx,W,H,map,M.img.x,M.img.y,COL.img,'the image',-12);
  }
  if(isFinite(M.cross.x)) markPoint(ctx,W,H,map,M.cross.x,M.cross.y,COL.guide,'guides cross',14);
  lab(ctx,W,H,map.X(0)+8,map.Y(M.D/2)-10,'r = D/4f = '+fmt(M.r,4),COL.guide,SM_FONT,'left');

  /* the shrink sweep, log-log */
  const xs=M.es.map(e=>Math.log10(e)), ys=M.ms.map(v=>Math.log10(Math.max(v,1e-9)));
  const ylo=Math.min.apply(null,ys)-0.3, yhi=Math.max.apply(null,ys)+0.3;
  axesR(ctx,b2,-2,0,ylo,yhi,{xlab:'shrink factor e  (lens D and object height both x e)',
    title:'the miss, cm, falls as e&sup2;',
    nx:5,ny:5,xfmt:t=>sigf(Math.pow(10,t),1),yfmt:t=>sigf(Math.pow(10,t),2)});
  polyline(ctx,b2,xs,ys,-2,0,ylo,yhi,COL.guide,2);
  /* the e^2 reference through the right-hand end */
  const k=ys[ys.length-1]-2*xs[xs.length-1];
  polyline(ctx,b2,[-2,0],[2*(-2)+k,k],-2,0,ylo,yhi,rgba(COL.ref,0.8),1.4,[5,4]);
  /* the curve runs bottom-left to top-right, so the top LEFT is the corner it
     never enters -- the first two placements both grazed it */
  lab(ctx,W,H,b2.x+10,b2.y+14,'dashed: a pure e&sup2; through the right-hand end',COL.ref,SM_FONT,'left');
  drawCaption(ctx,L);
  legendSafe(ctx,L.main,[[COL.pos,'the true rim rays'],[COL.guide,'PhET&rsquo;s guides'],
    [COL.img,'the image']]);
}

/* ----------------------------------------------------------- the real lens */
const REAL_CAP_FULL=
 'The same glass, taken at face value. Two spheres of the radius the lens maker&rsquo;s equation named, '
+'the index it named, the diameter PhET&rsquo;s slider sets &mdash; and exact vector Snell at each '
+'surface instead of u&prime; = u &minus; h/f. The focus then depends on where the ray struck the lens: '
+'it walks in as the square of the ray height, which is the third-order term the paraxial model drops. '
+'Stop the lens down and the two models converge; open it up and they do not.';
const REAL_CAP_SHORT='Exact Snell at two spheres: the focus walks in as h&sup2;. Stop it down and the paraxial model returns.';

function realGeo(ctx,W,H,M){
  /* the optic axis is z (horizontal on screen), the ray height is y (vertical);
     the world map wants x across, so z maps to world-x and y to world-y */
  if(!M.exists){
    const note='No lens: a sphere of radius '+sigf(M.R,4)+' cm cannot carry a semi-aperture of '
      +sigf(M.a,4)+' cm, so there is nothing to trace.';
    const L0=layout(ctx,W,H,REAL_CAP_FULL+' '+note,REAL_CAP_SHORT+' '+note,1,0.40,1);
    LAST_L=L0;
    return {L:L0,map:null};
  }
  const e2={xmin:-1.6*M.R,xmax:M.zEnd+6,ymin:-M.a-6,ymax:M.a+6};
  const L1=stageLayout(ctx,W,H-HINT_H,REAL_CAP_FULL,REAL_CAP_SHORT,1,0.40,1);
  const s=worldFitUp(L1.main,e2,4).s;
  const note='Here the rim ray crosses '+sigf(M.lsaRim,4)+' cm from the paraxial focus &mdash; '
    +fmt(M.pctF,2)+' % of the focal length &mdash; where the ideal optic of the other views has none. '
    +'Equal aspect, '+sigf(s,3)+' px per cm; the drawn fan is 11 rays and the curve is 48. '
    +'A concave mirror of the same radius misses by '+sigf(M.mirrorPar-M.mirrorRim,3)
    +' cm at the same rim height. The edge thickness is chosen here, not PhET&rsquo;s.';
  const L=layout(ctx,W,H,REAL_CAP_FULL+' '+note,REAL_CAP_SHORT+' '+note,1,0.40,1);
  LAST_L=L;
  return {L:L,map:worldFitUp(L.main,e2,4),ext:e2};
}
function drawReal(ctx,W,H,M,st){
  const G=realGeo(ctx,W,H,M), L=G.L;
  if(!M.exists){
    caption(ctx,L.left,L.main.y+40,
      'A sphere of radius '+sigf(M.R,4)+' cm cannot carry a semi-aperture of '+sigf(M.a,4)
      +' cm: the two surfaces would cross before they met the rim, so there is no lens to trace. '
      +'PhET&rsquo;s artwork draws one anyway, with its softened sag. Raise the radius or close the '
      +'diameter and the trace returns.',Math.min(460,L.right-L.left),COL.live,CAP_FONT);
    drawCaption(ctx,L);
    return;
  }
  const map=G.map, ext=G.ext, b2=L.bottom[0];
  seg(ctx,map,[ext.xmin,0],[ext.xmax,0],rgba(COL.axis,0.95),1.2,[6,5]);
  /* the lens body: front surface z = sag(R,y) - ... drawn in (z, y) */
  const NS=30, front=[],back=[];
  for(let i=0;i<=NS;i++){
    const y=-M.a+2*M.a*i/NS;
    const sg=M.R-Math.sqrt(Math.max(M.R*M.R-y*y,0));
    front.push([sg,y]); back.push([M.t-sg,y]);
  }
  worldPoly(ctx,map,front.concat(back.slice().reverse()),rgba(COL.glass,0.42),COL.glass2,1.6);
  /* the traced fan */
  M.fan.forEach(r=>{
    for(let i=0;i+1<r.pts.length;i++)
      segW(ctx,map,[r.pts[i][1],r.pts[i][0]],[r.pts[i+1][1],r.pts[i+1][0]],ext,
           rgba(COL.ray,0.55+0.4*Math.abs(r.h)/M.stop),1.3);
  });
  /* the paraxial focal plane, and the marginal crossing */
  seg(ctx,map,[M.zPar,-M.a],[M.zPar,M.a],rgba(COL.ref,0.9),1.6,[6,4]);
  lab(ctx,W,H,map.X(M.zPar),map.Y(M.a)-12,'paraxial focus',COL.ref,SM_FONT,'center');
  const zM=M.zPar+M.lsaMark;
  seg(ctx,map,[zM,-M.a*0.6],[zM,M.a*0.6],rgba(COL.live,0.9),1.6,[4,4]);
  lab(ctx,W,H,map.X(zM),map.Y(-M.a*0.6)+13,'h = '+sigf(M.hMark,3)+' cm crosses here',COL.live,SM_FONT,'center');
  lab(ctx,W,H,map.X(M.t/2),map.Y(-M.a)+14,'n = '+fmt(M.n,3)+', R = &plusmn;'+sigf(M.R,4)
      +' cm, t = '+sigf(M.t,4)+' cm',COL.glass2,SM_FONT,'center');

  /* LSA against ray height */
  const hs=M.hs, ls=M.ls;
  const ylo=Math.min(0,Math.min.apply(null,ls))*1.08, yhi=Math.max(0,Math.max.apply(null,ls))*1.08+1e-6;
  axesR(ctx,b2,0,M.stop,ylo,yhi,{xlab:'ray height h, cm',ylab:'LSA, cm',
    title:'longitudinal spherical aberration',nx:6,ny:5,xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,1)});
  polyline(ctx,b2,[0,M.stop],[0,0],0,M.stop,ylo,yhi,rgba(COL.axis,0.9),1);
  polyline(ctx,b2,hs,ls,0,M.stop,ylo,yhi,COL.pos,2);
  const q=[],qy=[];
  for(let i=0;i<=40;i++){ const hh=M.stop*i/40; q.push(hh); qy.push(M.c2*hh*hh); }
  polyline(ctx,b2,q,qy,0,M.stop,ylo,yhi,rgba(COL.ref,0.85),1.4,[5,4]);
  marker(ctx,b2,0,M.stop,ylo,yhi,M.hMark,M.lsaMark,COL.live);
  drawCaption(ctx,L);
  legendSafe(ctx,b2,[[COL.pos,'exact trace'],
    [COL.ref,'&minus;C h&sup2;, C at h = '+sigf(M.stop*0.02,3)+' cm'],[COL.live,'this height']]);
}

/* ================================================================== *
 *  dispatch, and the scene object                                     *
 * ================================================================== */
function drawView(ctx,W,H,M,st){
  st=st||ST;
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(st.view==='bench'||st.view==='mirror') drawBench(ctx,W,H,M,st);
  else if(st.view==='conj') drawConj(ctx,W,H,M,st);
  else if(st.view==='maker') drawMaker(ctx,W,H,M,st);
  else if(st.view==='guides') drawGuides(ctx,W,H,M,st);
  else drawReal(ctx,W,H,M,st);
}

function makeScene(canvas){
  const S={st:ST,W:1180,H:740};
  S.model=()=>buildModel(ST);
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel(ST),ST); };
  /* nothing animates: every view solves its problem outright */
  S.step=function(){ return false; };
  /* drag the object on the two benches and in the guides view */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const v=ST.view;
    if(v!=='bench'&&v!=='mirror'&&v!=='guides') return false;
    const ctx=canvas.getContext('2d'), M=buildModel(ST);
    const G=(v==='guides')?guidesGeo(ctx,S.W,S.H,M):benchGeo(ctx,S.W,S.H,M);
    const map=G.map;
    if(!map) return false;
    if(type==='down'){
      const P=objectPoint(ST);
      if(Math.hypot(x-map.X(P[0]),y-map.Y(P[1]))<22){
        DRAG.what='obj'; DRAG.off=[P[0]-map.wx(x),P[1]-map.wy(y)]; return true;
      }
      return false;
    }
    if(type==='move'&&DRAG.what==='obj'){
      ST.objX=clamp(map.wx(x)+DRAG.off[0],-460,-PHET.minObjectDist);
      ST.objY=clamp(map.wy(y)+DRAG.off[1],-PHET.maxOffAxis,PHET.maxOffAxis);
      clearMemo();
      return true;
    }
    return false;
  };
  return S;
}
/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lb])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lb)); });

  const rows={};
  function slider(key,lb,lo,hi,step,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lb),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ const v=parseFloat(inp.value);
      if(onchg) onchg(v); else st[key]=v;
      clearMemo(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,input:inp}; sync(); return rowEl;
  }
  function checkbox(key,lb){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lb);
    inp.addEventListener('change',()=>{ st[key]=inp.checked; clearMemo();
      syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      wrapEl.appendChild(h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        const was=st[key]; st[key]=o.id; if(onPick) onPick(o,was); clearMemo();
        [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
        syncPanel(); dirty=true; refresh(); }},o.name));
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function btn(label,fn){ return h('button',{onclick:()=>{ fn(); clearMemo(); syncPanel(); dirty=true; refresh(); }},label); }

  /* ---- group 1: the lens (PhET's Lens-screen optic controls) ---- */
  const gLens=h('div',{class:'grp'},h('h3',null,'the lens'));
  gLens.appendChild(chipRow(LENS_LIST,'lensSurface'));
  const fctlRow=chipRow(FCTL_LIST,'fControl',(o,was)=>{
    /* PhET keeps the two models in step: switching copies the other one's
       value across, constrained to this one's range */
    if(o.id==='direct') st.lensF=clamp(phetFocalFromR(st.lensR,st.lensN),PHET.fLens[0],PHET.fLens[1]);
    else st.lensR=clamp(phetRFromFocal(st.lensF,st.lensN),PHET.rocLens[0],PHET.rocLens[1]);
  });
  gLens.appendChild(fctlRow);
  gLens.appendChild(slider('lensF','focal length',PHET.fLens[0],PHET.fLens[1],PHET.fStep,v=>fmt(v,0)+' cm'));
  gLens.appendChild(slider('lensR','radius R',PHET.rocLens[0],PHET.rocLens[1],PHET.rocStep,v=>fmt(v,0)+' cm'));
  gLens.appendChild(slider('lensN','index n',PHET.iorLens[0],PHET.iorLens[1],PHET.iorStep,v=>fmt(v,2)));
  gLens.appendChild(slider('lensD','diameter D',PHET.dLens[0],PHET.dLens[1],PHET.dStep,v=>fmt(v,0)+' cm'));
  const lensTag=h('div',{class:'tag'}); gLens.appendChild(lensTag);

  /* ---- group 2: the mirror (PhET's Mirror screen) ---- */
  const gMir=h('div',{class:'grp'},h('h3',null,'the mirror'));
  gMir.appendChild(chipRow(MIRROR_LIST,'mirrorSurface'));
  gMir.appendChild(slider('mirrorF','focal length',PHET.fMirror[0],PHET.fMirror[1],PHET.fStep,v=>fmt(v,0)+' cm'));
  gMir.appendChild(slider('mirrorR','radius R',PHET.rocMirror[0],PHET.rocMirror[1],PHET.rocStep,v=>fmt(v,0)+' cm'));
  gMir.appendChild(slider('mirrorD','diameter D',PHET.dMirror[0],PHET.dMirror[1],PHET.dStep,v=>fmt(v,0)+' cm'));
  const mirTag=h('div',{class:'tag'}); gMir.appendChild(mirTag);

  /* ---- group 3: the object ---- */
  const gObj=h('div',{class:'grp'},h('h3',null,'the object'));
  gObj.appendChild(chipRow(OBJ_LIST,'objKind'));
  gObj.appendChild(slider('objX','position x',-460,-PHET.minObjectDist,1,v=>fmt(v,0)+' cm'));
  gObj.appendChild(slider('objY','height y',-PHET.maxOffAxis,PHET.maxOffAxis,0.5,v=>fmt(v,1)+' cm'));
  gObj.appendChild(slider('secondOff','second point',PHET.secondOffset,0,0.5,v=>fmt(v,1)+' cm'));
  const objTag=h('div',{class:'tag'}); gObj.appendChild(objTag);

  /* ---- group 4: the rays ---- */
  const gRays=h('div',{class:'grp'},h('h3',null,'the rays'));
  gRays.appendChild(chipRow(RAY_LIST,'rays'));
  const rayTag=h('div',{class:'tag'}); gRays.appendChild(rayTag);

  /* ---- group 5: the drawing ---- */
  const gDraw=h('div',{class:'grp'},h('h3',null,'the drawing'));
  gDraw.appendChild(h('div',{class:'checks'},
    checkbox('showF','Focal Points (F)'),checkbox('show2F','2F Points'),
    checkbox('showVirtual','Virtual Image'),checkbox('showLabels','Labels'),
    checkbox('showSecond','Second Point'),checkbox('showGuides','Guides'),
    checkbox('showRuler','ruler')));
  gDraw.appendChild(slider('screenX','screen at x',PHET.minScreenDist,420,5,v=>fmt(v,0)+' cm'));
  gDraw.appendChild(h('div',{class:'btnrow'},btn('reset all',()=>{
    const v=st.view; Object.assign(st,DEFAULTS); st.view=v; syncChips(); })));
  const drawTag=h('div',{class:'tag'}); gDraw.appendChild(drawTag);

  /* ---- group 6: the real lens ---- */
  const gReal=h('div',{class:'grp'},h('h3',null,'the real lens'));
  gReal.appendChild(slider('realEdge','edge thickness',0.5,12,0.5,v=>fmt(v,1)+' cm'));
  gReal.appendChild(slider('realStop','stopped to',0.2,1,0.02,v=>fmt(100*v,0)+' % of D'));
  gReal.appendChild(slider('realH','marked ray at',0.05,1,0.01,v=>fmt(100*v,0)+' % of the stop'));
  const realTag=h('div',{class:'tag'}); gReal.appendChild(realTag);

  /* ---- group 7: what you are looking at ---- */
  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Geometric Optics (University of '
      +'Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. '
      +'PhET&rsquo;s values &mdash; the 40&ndash;120 cm focal length and radius ranges, the 1.2&ndash;1.8 '
      +'index, the 60&ndash;120 cm diameter, the mirror&rsquo;s 75&ndash;150 and 150&ndash;300 cm ranges, '
      +'the fixed n = 1.5 and n = 2, the flat mirror&rsquo;s 100 000 cm, the object positions, the '
      +'&minus;56.5 cm second point, the screen at 200 cm, the 120&deg; fan and its ray count, the '
      +'guides&rsquo; own arithmetic and the softened lens sag &mdash; are read out of its build 1.3.16 '
      +'(docs/phets/geometric-optics_en.html) and its doc/model.md. Everything else is exact and pinned '
      +'in selfTest to build/geometric-optics/derive.py (scipy.brentq on the lens equation, '
      +'scipy.minimize_scalar on the spot size, a closed-form sphere intersection checked against '
      +'Newton on the sag).'}));
  /* ---- group 8: the physics ---- */
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gLens,gMir,gObj,gRays,gDraw,gReal,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [wrapEl,list,key] of CHIPROWS)
      [].forEach.call(wrapEl.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':''));
  }
  /* a row this view ignores is hidden, never left live and inert */
  function syncPanel(){
    const v=st.view;
    const lensish=(v==='bench'||v==='conj'||v==='maker'||v==='guides'||v==='real');
    gLens.hidden=!lensish;
    rows.lensF.row.hidden=(st.fControl!=='direct');
    rows.lensR.row.hidden=(st.fControl!=='indirect');
    rows.lensN.row.hidden=(st.fControl!=='indirect');
    rows.lensD.row.hidden=(v==='conj');
    fctlRow.hidden=false;
    gMir.hidden=(v!=='mirror');
    rows.mirrorF.row.hidden=(st.fControl!=='direct'||st.mirrorSurface==='flat');
    rows.mirrorR.row.hidden=(st.fControl!=='indirect'||st.mirrorSurface==='flat');
    gObj.hidden=!(v==='bench'||v==='mirror'||v==='conj'||v==='guides');
    rows.objY.row.hidden=(v==='conj');
    rows.secondOff.row.hidden=!((v==='bench'||v==='mirror')&&st.showSecond);
    gRays.hidden=!(v==='bench'||v==='mirror');
    gDraw.hidden=!(v==='bench'||v==='mirror');
    rows.screenX.row.hidden=!(v==='bench'&&st.objKind==='light');
    rows.cb_showGuides.row.hidden=(v!=='bench');
    gReal.hidden=(v!=='real');
    for(const k in rows) rows[k].sync();

    const n=lensIndex(st), R=Math.abs(lensRadius(st)), f=Math.abs(lensFocal(st));
    lensTag.innerHTML=(st.fControl==='direct'
      ? 'PhET&rsquo;s <b>direct</b> model: you set |f| and it holds n = 1.50, so R = 2f(n&minus;1) = <b>'
        +sigf(R,4)+'</b> cm follows'
      : 'PhET&rsquo;s <b>indirect</b> model: you set |R| and n, and |f| = |R|/2(n&minus;1) = <b>'
        +sigf(f,4)+'</b> cm follows')
      +' &nbsp; signed f = '+sigf(lensFocal(st),4)+' cm ('+(lensFocal(st)>0?'converging':'diverging')+')';
    mirTag.innerHTML=st.mirrorSurface==='flat'
      ? 'PhET&rsquo;s flat mirror is a converging optic of f = 100 000 cm, not a true plane &mdash; the '
        +'readout prints how far that is from m = 1'
      : 'PhET gives a mirror n = 2, so |f| = |R|/2(2&minus;1) = |R|/2 = <b>'
        +sigf(Math.abs(mirrorFocal(st)),4)+'</b> cm &mdash; the paraxial mirror formula, out of the '
        +'lens maker&rsquo;s equation';
    objTag.innerHTML='drag the object on the canvas. PhET keeps it at least '+PHET.minObjectDist
      +' cm from the optic and within '+PHET.maxOffAxis+' cm of the axis; its own defaults are '
      +'(&minus;170, 27) on the Lens screen and (&minus;150, 72.5) on the Mirror screen.'
      +(st.objKind==='light'?' The second source sits '+LIGHT_DX+' cm downstream, which is PhET&rsquo;s own offset.':'');
    rayTag.innerHTML=st.rays==='many'
      ? 'PhET&rsquo;s fan: 20&middot;(&lfloor;d_o/300&rfloor;+1) = <b>'+manyRayCount(Math.abs(objectPoint(st)[0]))
        +'</b> rays over 120&deg;'
      : st.rays==='principal'
      ? 'the three construction rays. They are not physical &mdash; PhET lets them through the optic '
        +'plane whatever their height, and so does this'
      : st.rays==='marginal'
      ? 'to the centre and to the two rim points: the rays the aperture actually admits'
      : 'no rays drawn; the image is still solved';
    drawTag.innerHTML='1&ndash;6 switch views &nbsp; r resets';
    realTag.innerHTML='edge thickness is chosen here, not PhET&rsquo;s &mdash; PhET never gives its lens '
      +'a thickness at all. Everything else is the lens the other views describe.';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M,st);
      eqEl.innerHTML=eqbarHTML(M,st);
      tagEl.innerHTML=tagHTML(M,st);
      hintEl.textContent=((st.view==='bench'||st.view==='mirror'||st.view==='guides')
        ?'drag the object · ':'')+'1–6 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model(),st); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
    else if(e.key==='r'){ const v=st.view; Object.assign(st,DEFAULTS); st.view=v;
      clearMemo(); syncChips(); syncPanel(); dirty=true; refresh(); }
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  function frameLoop(tm){
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  bench:'PhET&rsquo;s <b>Lens</b> screen. An object stands on the optical axis in front of a convex or '
   +'concave lens; drag it, or drive it with the sliders, and watch the image answer. What is worth '
   +'watching is not that the picture looks right but that it <b>has to be</b> right: every ray is bent '
   +'by one line, u&prime; = u &minus; h/f, and nothing in the drawing knows where the image is. Where the '
   +'rays meet is therefore a consequence, and the readout prints the residual of the equation it agrees '
   +'with. Cross the focal point with the object and the outgoing rays go parallel &mdash; there is no '
   +'image at all &mdash; and then reconverge on the near side as the dashed backward extensions of '
   +'diverging light, which is the whole content of the phrase &ldquo;virtual image&rdquo;.',
  mirror:'PhET&rsquo;s <b>Mirror</b> screen, and the same equation. The only thing that changes is which '
   +'way the light leaves: a real image forms to the <b>left</b> of a mirror, where the light actually '
   +'goes, so d_i &gt; 0 now points the other way. PhET builds its mirror out of the same code as its '
   +'lens by giving it an index of exactly 2, which turns f = R/2(n&minus;1) into the paraxial mirror '
   +'formula f = R/2; the concave mirror converges and the convex one diverges. Its flat mirror is not a '
   +'plane but a converging optic of focal length 100 000 cm, and the readout says what that costs.',
  conj:'The governing law, drawn. Everything on the two benches is one rectangular hyperbola: '
   +'d_i = f d_o/(d_o &minus; f), whose asymptotes are the lines d_o = f and d_i = f. Slide the object '
   +'and watch the live point run up the branch toward the pole &mdash; the image distance grows without '
   +'bound as the object reaches the focal point, and the instant it passes inside, the point reappears '
   +'on the negative branch, which is the virtual image. Newton wrote the same thing more symmetrically: '
   +'measure both distances <b>from the focal points</b> and their product is f&sup2;, with no special '
   +'cases and no pole. A diverging optic has no pole in range at all, which is why its image is always '
   +'virtual, always upright and always smaller.',
  maker:'Where the focal length comes from. PhET gives its optic the same radius on both faces, so the '
   +'lens maker&rsquo;s equation 1/f = (n&minus;1)(1/R&#8321; &minus; 1/R&#8322;) collapses to '
   +'f = R/2(n&minus;1), whose contours in the (n, R) plane are straight lines aimed at n = 1. The sim '
   +'offers you the same lens through two different doors &mdash; set f and let R follow at a fixed '
   +'n = 1.5, or set R and n and let f follow &mdash; and PhET keeps them in step, which is why switching '
   +'the control here copies one value into the other. The lower panel is a quieter point: the shape the '
   +'artwork draws uses a softened sag that belongs to no sphere, and at a large aperture it draws a lens '
   +'that could not be ground.',
  guides:'PhET invented this. Two arms hinge at the rim of the lens; each takes the ray that reaches it '
   +'and turns it through a fixed angle 2 arctan(D/4f), and where the two transmitted arms cross is '
   +'offered as the image without any ray tracing at all. It is a good construction and it is not exact, '
   +'and the difference is worth having: a thin optic changes a ray&rsquo;s <b>slope</b> by &minus;h/f, '
   +'while a guide rotates it by an <b>angle</b>. Those coincide only for small angles, so shrinking the '
   +'lens alone leaves the miss stuck near four and a half per cent; shrink the lens and the '
   +'object&rsquo;s inclination together and the miss falls as the square, which the lower panel measures '
   +'rather than asserts.',
  real:'The counterweight. Every other view here treats the optic as ideal, because that is the model '
   +'PhET is teaching and it is the right one to teach. This view takes the same numbers &mdash; the same '
   +'index, the same radius, the same diameter &mdash; builds two real spherical surfaces out of them and '
   +'refracts each ray with vector Snell instead. The focus then depends on where the ray struck the '
   +'lens, walking in as the square of the ray height: that h&sup2; is the leading term the paraxial '
   +'expansion throws away, and at PhET&rsquo;s default diameter this is an f/1 lens, so it is not small. '
   +'Stop the aperture down and the ideal model comes back; open it and no single plane is in focus at '

};

function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const CONV='<h4>sign convention</h4><p>x runs right, the optic is at x = 0, the object is always at '
  +'x &lt; 0. <i>d</i><sub>o</sub> = &minus;x<sub>obj</sub> &gt; 0. <i>f</i> &gt; 0 converging (convex '
  +'lens, concave mirror), &lt; 0 diverging. <i>d</i><sub>i</sub> &gt; 0 is a real image &mdash; to the '
  +'right of a lens, to the left of a mirror; &lt; 0 is virtual. <i>m</i> &lt; 0 is inverted. '
  +'<i>R</i> &gt; 0 convex, &lt; 0 concave, which is PhET&rsquo;s own convention.</p>';
const DERIV={
  bench:CONV
   +'<h4>the thin-optic equation</h4>'
   +EQ(1,FR('1','d<sub>o</sub>')+' + '+FR('1','d<sub>i</sub>')+' = '+FR('1','f'))
   +EQ(2,'d<sub>i</sub> = '+FR('f d<sub>o</sub>','d<sub>o</sub> &minus; f')+' , &nbsp; m = &minus;'
        +FR('d<sub>i</sub>','d<sub>o</sub>'))
   +'<h4>and the ray transfer that has to agree with it</h4>'
   +'<p>A ray leaving the object at height <i>y</i><sub>o</sub> and crossing the optic plane at height '

   +EQ(3,'u&prime; = u &minus; '+FR('h','f'))
   +'<p>Put [3] into the outgoing ray at path length <i>d</i><sub>i</sub> and the height is</p>'
   +EQ(4,'h + (u &minus; h/f) d<sub>i</sub> = h d<sub>i</sub>&#8203;('+FR('1','d<sub>i</sub>')+' + '
        +FR('1','d<sub>o</sub>')+' &minus; '+FR('1','f')+') &minus; y<sub>o</sub>'+FR('d<sub>i</sub>','d<sub>o</sub>'))
   +'<p>The bracket is [1], so it is zero, and the height is <i>m y</i><sub>o</sub> &mdash; for '

   +'= parallel, through the centre, through the near F; many = a 120&deg; fan of '
   +'20(&lfloor;d<sub>o</sub>/300&rfloor;+1) rays.</p>',
