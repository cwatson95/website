/* ================================================================== *
 *  view: the peak — Wien's law                                        *
 * ================================================================== */
const PEAK_X=[Math.log10(0.05),Math.log10(200)], PEAK_Y=[-8,4];
function peakCaption(M){
  const P=M.P;
  return ['Left, on log–log axes (every decade the same length): Planck’s curve at '+fmt(M.T,0)+' K (green) and at PhET’s four presets (grey); '
    +'the orange line is the locus of the peaks, M(λ_max) = K_peak (b/λ)⁵, a straight line of slope −5 because λ_max = b/T and the peak height grows as T⁵. '
    +'Right, every curve divided by its own peak and plotted against λ/λ_max: they are one curve. Its half-maximum runs from 0.613 to 1.817 λ_max '
    +'(λT from 1777 to 5265 µm·K); per unit frequency the same spectrum peaks at 1.760 λ_max, so where “the peak” is depends on the axis.',
    'Planck’s curve at '+fmt(M.T,0)+' K and the presets on log–log axes; orange: the locus of peaks, slope −5.'];
}
function drawPeak(ctx,W,H,M){
  const P=M.P, cap=peakCaption(M), L=twoPanels(ctx,W,H,cap[0],cap[1],0.6), b=L.b1;
  const lx=a=>a.xs.map(Math.log10), ly=a=>a.ys.map(v=>v>0?Math.log10(v):-Infinity);
  axesR(ctx,b,PEAK_X[0],PEAK_X[1],PEAK_Y[0],PEAK_Y[1],{xticks:decTicks(PEAK_X[0],PEAK_X[1],6),yticks:decTicks(PEAK_Y[0],PEAK_Y[1],7),
    xfmt:plainPow,yfmt:supPow,xlab:'wavelength λ, µm (log)',ylab:'M_λ, MW/m²/µm (log)'});
  panelTitle(ctx,W,H,b,'Planck’s family and the locus of its peaks (log–log)','the family, log–log');
  const X=v=>b.x+b.w*(v-PEAK_X[0])/(PEAK_X[1]-PEAK_X[0]), Y=v=>b.y1-b.h*(v-PEAK_Y[0])/(PEAK_Y[1]-PEAK_Y[0]);
  /* the locus: M = K_peak T⁵ with T = b/λ */
  const lxs=[], lys=[];
  for(let i=0;i<=40;i++){ const le=PEAK_X[0]+(PEAK_X[1]-PEAK_X[0])*i/40, lam=Math.pow(10,le)*1e-6; lxs.push(le); lys.push(Math.log10(K_PEAK*Math.pow(B_WIEN/lam,5)*TO_DISP)); }
  polyline(ctx,b,lxs,lys,PEAK_X[0],PEAK_X[1],PEAK_Y[0],PEAK_Y[1],COL.ref,1.4,[7,5]);
  for(const f of P.fam) polyline(ctx,b,lx(f.c),ly(f.c),PEAK_X[0],PEAK_X[1],PEAK_Y[0],PEAK_Y[1],'#56607a',1.3);
  polyline(ctx,b,lx(P.cur.c),ly(P.cur.c),PEAK_X[0],PEAK_X[1],PEAK_Y[0],PEAK_Y[1],COL.pos,2.4);
  for(const f of P.fam){ const px=X(Math.log10(f.lm/1000)), py=Y(Math.log10(f.Mp)); diamond(ctx,px,py,4.5,COL.ref,'#ffffff');
    labAvoid(ctx,W,H,[[px+8,py-8,'left','bottom'],[px+8,py+8,'left','top'],[px-8,py-8,'right','bottom'],[px-8,py+8,'right','top'],[px+10,py-24,'left','bottom']],
             f.name+', '+fmt(f.T,0)+' K',COL.dim,SM_FONT); }
  dot(ctx,X(Math.log10(P.lm/1000)),Y(Math.log10(P.Mp)),5,COL.live,'#ffffff',1.2);
  /* the locus crosses the panel from about 0.19 µm (top) to 48 µm (bottom): label it at 30 µm, below-left of the line */
  const yL=Math.log10(K_PEAK*Math.pow(B_WIEN/30e-6,5)*TO_DISP);
  const yL2=Math.log10(K_PEAK*Math.pow(B_WIEN/10e-6,5)*TO_DISP);
  labAvoid(ctx,W,H,[[X(Math.log10(30))-10,Y(yL)+8,'right','top'],[X(Math.log10(30))+10,Y(yL),'left','middle'],[X(1)+10,Y(yL2),'left','middle'],[X(1)-10,Y(yL2)+8,'right','top']],
           'the locus of the peaks ∝ λ⁻⁵',COL.ref,SM_FONT);
  if(L.b2){
    const c=L.b2;
    axesR(ctx,c,0,5,0,1.05,{nx:5,ny:5,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,1),xlab:'λ / λ_max',ylab:'M / M(λ_max)'});
    panelTitle(ctx,W,H,c,'every temperature, one curve','one curve');
    const Xc=v=>c.x+c.w*v/5, Yc=v=>c.y1-c.h*v/1.05;
    P.uni.forEach((u,i)=>polyline(ctx,c,u.xs,u.ys,0,5,0,1.05,i===0?COL.pos:'#56607a',i===0?2.4:1.2,i===0?null:[5,4]));
    line(ctx,Xc(0.61323368060735),Yc(0.5),Xc(1.8169998026431),Yc(0.5),COL.ref,1.4);
    diamond(ctx,Xc(1),Yc(1),4.5,COL.ref,'#ffffff');
    lab(ctx,W,H,Xc(1.83)+6,Yc(0.5),'half maximum: 0.613–1.817 λ_max',COL.ref,SM_FONT,'left','middle');
    line(ctx,Xc(X5/X3),Yc(0),Xc(X5/X3),Yc(0.2),COL.ref,1.2,[3,3]);
    labAvoid(ctx,W,H,[[Xc(X5/X3)+5,Yc(0.035),'left','middle'],[Xc(X5/X3)+5,Yc(0.3),'left','middle'],[Xc(X5/X3)-5,Yc(0.12),'right','middle']],
             'B_ν peaks here: 1.760 λ_max',COL.ref,SM_FONT);
  }
  drawCap(ctx,L);
}

/* ================================================================== *
 *  view: the total — Stefan–Boltzmann and the band budget             *
 * ================================================================== */
const TOT_X=[Math.log10(T_MIN),Math.log10(T_MAX)], TOT_Y=[1.5,9.5];
const BAND_FILL=['#3aa7b0','#7a62d8','#d9d08a','#b4513c','#2c3552'];
function totalCaption(M){
  const O=M.O;
  return ['Left, on log–log axes: the intensity σT⁴ against temperature, a straight line of slope 4 (green); PhET’s presets in orange, '
    +fmt(M.T,0)+' K in magenta, where the integral of Planck’s curve by a 1024-point Gauss–Legendre rule gives '+sci(O.quad,5)+' W/m² against σT⁴ = '+sci(O.I,5)+'. '
    +'Right, the same power split into PhET’s bands, stacked: X-ray below 10 nm (far too small to see below 11000 K), ultraviolet, visible (380–780 nm), '
    +'infrared to 100 µm, and beyond 100 µm (the thin band at the top left).',
    'σT⁴ against T on log–log axes (slope 4), and the share of it in each band.'];
}
function drawTotal(ctx,W,H,M){
  const O=M.O, cap=totalCaption(M), L=twoPanels(ctx,W,H,cap[0],cap[1],0.5), b=L.b1;
  const TT=[200,500,1000,2000,5000,10000];
  axesR(ctx,b,TOT_X[0],TOT_X[1],TOT_Y[0],TOT_Y[1],{xticks:TT.map(Math.log10),yticks:decTicks(TOT_Y[0],TOT_Y[1],8),
    xfmt:v=>String(Math.round(Math.pow(10,v))),yfmt:supPow,xlab:'temperature T, K (log)',ylab:'σT⁴, W/m² (log)'});
  panelTitle(ctx,W,H,b,'the Stefan–Boltzmann law (log–log)','σT⁴, log–log');
  const X=v=>b.x+b.w*(v-TOT_X[0])/(TOT_X[1]-TOT_X[0]), Y=v=>b.y1-b.h*(v-TOT_Y[0])/(TOT_Y[1]-TOT_Y[0]);
  polyline(ctx,b,O.curve.xs.map(v=>Math.log10(v*1000)),O.curve.ys.map(Math.log10),TOT_X[0],TOT_X[1],TOT_Y[0],TOT_Y[1],COL.pos,2.2);
  for(const p of PRESETS){ const px=X(Math.log10(p.T)), py=Y(Math.log10(intensity(p.T))); diamond(ctx,px,py,4.5,COL.ref,'#ffffff');
    lab(ctx,W,H,px+8,py+2,p.name,COL.dim,SM_FONT,'left','top'); }
  const cx=X(Math.log10(M.T)), cy=Y(Math.log10(O.I));
  dot(ctx,cx,cy,5,COL.live,'#ffffff',1.2);
  dot(ctx,cx,Y(Math.log10(O.quad)),8,null,COL.pos,1.2);
  const leftHalf=cx<b.x+b.w*0.45;
  lab(ctx,W,H,leftHalf?cx+10:cx-10,cy-12,sci(O.I,3)+' W/m²',COL.live,SM_FONT,leftHalf?'left':'right','bottom');
  labAvoid(ctx,W,H,[[b.x1-8,Y(TOT_Y[0]+0.28*(TOT_Y[1]-TOT_Y[0])),'right','middle'],[b.x1-8,Y(TOT_Y[0]+0.15*(TOT_Y[1]-TOT_Y[0])),'right','middle']],
           'slope 4: double T, sixteen times the power',COL.pos,SM_FONT);
  if(L.b2){
    const c=L.b2, Bg=O.budget, xs=Bg.Ts.map(v=>v/1000);
    axesR(ctx,c,T_MIN/1000,T_MAX/1000,0,1,{nx:6,ny:5,xfmt:v=>fmt(v,0),yfmt:v=>fmt(100*v,0),xlab:'temperature, 1000 K',ylab:'share of σT⁴, %'});
    panelTitle(ctx,W,H,c,'where the power goes, band by band','the bands');
    const Xc=v=>c.x+c.w*(v-T_MIN/1000)/((T_MAX-T_MIN)/1000), Yc=v=>c.y1-c.h*v;
    let lower=xs.map(()=>0);
    for(let k=0;k<BANDS.length;k++){
      const upper=lower.map((v,i)=>Math.min(1,v+Bg.f[k][i]));
      ctx.beginPath(); ctx.moveTo(Xc(xs[0]),Yc(lower[0]));
      for(let i=0;i<xs.length;i++) ctx.lineTo(Xc(xs[i]),Yc(upper[i]));
      for(let i=xs.length-1;i>=0;i--) ctx.lineTo(Xc(xs[i]),Yc(lower[i]));
      ctx.closePath(); ctx.fillStyle=BAND_FILL[k]; ctx.fill();
      lower=upper;
    }
    /* each band named inside itself, at a temperature where it is thick: the label's height is the
       middle of the band there, from the same fractions the fill is built from */
    for(const [k,Tk,col] of [[3,1500,'#ffffff'],[2,6500,COL.bg],[1,10000,'#ffffff']]){
      let lo=0; for(let j=0;j<k;j++) lo+=bandFrac(BANDS[j].lo,BANDS[j].hi,Tk);
      const th=bandFrac(BANDS[k].lo,BANDS[k].hi,Tk);
      const nm=BANDS[k].name.toLowerCase(), hw=nm.length*11*0.52/2+4;                 /* kept inside the panel */
      if(th>=0.08) lab(ctx,W,H,clamp(Xc(Tk/1000),c.x+hw,c.x1-hw),Yc(lo+th/2),nm,col,'600 11px -apple-system, sans-serif','center','middle');
    }
    line(ctx,Xc(M.T/1000),c.y,Xc(M.T/1000),c.y1,COL.live,1.6);
    const bi=O.bands, vis=bi[2], ir=bi[3], uv=bi[1];
    /* the shares at the current temperature, beside its line and inside the panel (one line if it fits, else two) */
    const xT=Xc(M.T/1000), one='UV '+pct(uv)+' · visible '+pct(vis)+' · IR '+pct(ir), wOne=one.length*10.5*0.52+8;
    const side=(xT+8+wOne<=c.x1)?1:((xT-8-wOne>=c.x)?-1:0);
    if(side) labPad(ctx,W,H,xT+side*8,c.y+12,one,COL.live,SM_FONT,side>0?'left':'right','top');
    else { const a2='UV '+pct(uv)+' · visible '+pct(vis), b2='IR '+pct(ir), sd=(xT-c.x>c.x1-xT)?-1:1, al2=sd>0?'left':'right';
      labPad(ctx,W,H,xT+sd*8,c.y+12,a2,COL.live,SM_FONT,al2,'top'); labPad(ctx,W,H,xT+sd*8,c.y+28,b2,COL.live,SM_FONT,al2,'top'); }
  }
  drawCap(ctx,L);
}

/* ================================================================== *
 *  view: the limits — Rayleigh–Jeans and Wien against Planck          *
 * ================================================================== */
const LIM_X=[-2,3], RAT_X=[-3,Math.log10(30)], RAT_Y=[-3,3];
function limitsCaption(M){
  const L=M.L;
  return ['Left, on log–log axes at '+fmt(M.T,0)+' K: Planck’s law (green), the classical Rayleigh–Jeans law 2πckT/λ⁴ (orange dashes) and Wien’s '
    +'approximation (blue dots). Rayleigh–Jeans climbs as λ⁻⁴ without limit toward short wavelengths, so its area is infinite; it is within 1 % of Planck only beyond '
    +um(L.lamRJ1,3)+'. Wien’s law is within 1 % below '+um(L.lamW1,3)+' and falls away at long wavelengths. Right, each law divided by Planck’s against x = hc/λkT, the same for every temperature: '
    +'(eˣ − 1)/x and 1 − e⁻ˣ; at the peak, x = 4.965, Rayleigh–Jeans is '+sigf(L.rjPeak,3)+' times too high and Wien’s law 0.70 % low.',
    'Planck (green), Rayleigh–Jeans (orange) and Wien (blue) at '+fmt(M.T,0)+' K, log–log; right, each over Planck against hc/λkT.'];
}
function drawLimits(ctx,W,H,M){
  const Lm=M.L, st=M.st, cap=limitsCaption(M), L=twoPanels(ctx,W,H,cap[0],cap[1],0.56), b=L.b1;
  const top=Math.ceil(Math.log10(Lm.Mp))+2, ylo=top-12;
  axesR(ctx,b,LIM_X[0],LIM_X[1],ylo,top,{xticks:decTicks(LIM_X[0],LIM_X[1],6),yticks:decTicks(ylo,top,7).filter(v=>v>ylo),xfmt:plainPow,yfmt:supPow,
    xlab:'wavelength λ, µm (log)',ylab:'M_λ, MW/m²/µm (log)'});
  panelTitle(ctx,W,H,b,'Planck’s law and the two laws it replaced (log–log)','Planck and the limits');
  const lx=a=>a.xs.map(Math.log10), ly=a=>a.ys.map(v=>v>0?Math.log10(v):-Infinity);
  const X=v=>b.x+b.w*(v-LIM_X[0])/(LIM_X[1]-LIM_X[0]);
  if(st.rj) polyline(ctx,b,lx(Lm.rj),ly(Lm.rj),LIM_X[0],LIM_X[1],ylo,top,COL.ref,1.8,[8,5]);
  if(st.wien) polyline(ctx,b,lx(Lm.wi),ly(Lm.wi),LIM_X[0],LIM_X[1],ylo,top,COL.wien,1.8,[2,4]);
  polyline(ctx,b,lx(Lm.pl),ly(Lm.pl),LIM_X[0],LIM_X[1],ylo,top,COL.pos,2.2);
  const xr=X(Math.log10(Lm.lamRJ1/1000)), xw=X(Math.log10(Lm.lamW1/1000));
  if(st.rj&&xr<b.x1){ line(ctx,xr,b.y1,xr,b.y1-26,COL.ref,1.4); lab(ctx,W,H,xr+4,b.y1-22,'RJ within 1 % →',COL.ref,SM_FONT,'left','middle'); }
  if(st.wien&&xw>b.x){ line(ctx,xw,b.y1,xw,b.y1-26,COL.wien,1.4); lab(ctx,W,H,xw-4,b.y1-22,'← Wien within 1 %',COL.wien,SM_FONT,'right','middle'); }
  if(st.rj) lab(ctx,W,H,b.x1-10,b.y+14,'Rayleigh–Jeans ∝ λ⁻⁴: the ultraviolet catastrophe',COL.ref,SM_FONT,'right','middle');
  if(L.b2){
    const c=L.b2, R=Lm.ratios, rx=R.xs.map(Math.log10);
    axesR(ctx,c,RAT_X[0],RAT_X[1],RAT_Y[0],RAT_Y[1],{xticks:decTicks(RAT_X[0],RAT_X[1],5),yticks:decTicks(RAT_Y[0],RAT_Y[1],7).filter(v=>v>RAT_Y[0]),
      xfmt:plainPow,yfmt:v=>v===0?'1':supPow(v),xlab:'x = hc/λkT (log)',ylab:'law / Planck (log)'});
    panelTitle(ctx,W,H,c,'each law over Planck’s, any temperature','over Planck’s');
    const Xc=v=>c.x+c.w*(v-RAT_X[0])/(RAT_X[1]-RAT_X[0]);
    polyline(ctx,c,[RAT_X[0],RAT_X[1]],[0,0],RAT_X[0],RAT_X[1],RAT_Y[0],RAT_Y[1],COL.pos,1.6);
    if(st.rj) polyline(ctx,c,rx,R.r.map(Math.log10),RAT_X[0],RAT_X[1],RAT_Y[0],RAT_Y[1],COL.ref,1.8,[8,5]);
    if(st.wien) polyline(ctx,c,rx,R.w.map(Math.log10),RAT_X[0],RAT_X[1],RAT_Y[0],RAT_Y[1],COL.wien,1.8,[2,4]);
    line(ctx,Xc(Math.log10(X5)),c.y,Xc(Math.log10(X5)),c.y1,COL.dim,1,[3,3]);
    lab(ctx,W,H,Xc(Math.log10(X5))-5,c.y+14,'the peak, x = 4.965',COL.dim,SM_FONT,'right','middle');
    lab(ctx,W,H,Xc(-2.2),c.y1-c.h*(0.5-RAT_Y[0])/(RAT_Y[1]-RAT_Y[0])+14,'Planck = 1',COL.pos,SM_FONT,'left','top');
  }
  drawCap(ctx,L);
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
  if(M.view==='spec') drawSpec(ctx,W,H,M);
  else if(M.view==='star') drawStar(ctx,W,H,M);
  else if(M.view==='peak') drawPeak(ctx,W,H,M);
  else if(M.view==='total') drawTotal(ctx,W,H,M);
  else drawLimits(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* the pointer, on the spectrum only: the Graph Values point (dragged along the curve, clamped to the
     axis as PhET's is) and the thermometer (the pointer's height, snapped to 50 K) */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; if(DRAG.what==='gv') ST.gvCue=false; DRAG.what=null; return had; }
    if(ST.view!=='spec') return false;
    const M=buildModel(), g=specGeo(canvas.getContext('2d'),S.W,S.H,M), b=g.b, Sm=M.S;
    if(type==='down'){
      if(ST.gv&&Sm.gv.inside){
        const gx=b.x+b.w*ST.gvNm/Sm.xmax, gy=Sm.gv.above?b.y:b.y1-b.h*Sm.gv.M/Sm.ymax;
        if(Math.hypot(x-gx,y-gy)<=14||(Math.abs(x-gx)<=6&&y>=gy&&y<=b.y1)){ DRAG.what='gv'; DRAG.off=gx-x; return true; }
      }
      const th=g.th;
      if(th&&x>=th.x-10&&x<=th.x+th.w+20&&y>=th.yTop-10&&y<=th.bulbY+th.bulbR){ DRAG.what='thermo'; setT(tempAtY(th,y)); return true; }
      return false;
    }
    if(DRAG.what==='gv'){ ST.gvNm=clamp((x+DRAG.off-b.x)/b.w*Sm.xmax,0,Sm.xmax); return true; }
    if(DRAG.what==='thermo'){ const T0=ST.T; setT(tempAtY(g.th,y)); return ST.T!==T0; }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{
    tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2));
  });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  function button(lab2,fn){ return h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},lab2); }

  /* the temperature: PhET's thermometer range and snap, and its four presets */
  const gTemp=h('div',{class:'grp'},h('h3',null,'the temperature'));
  gTemp.appendChild(slider('T','T, kelvin',T_MIN,T_MAX,T_SNAP,v=>fmt(v,0)+' K',()=>setT(st.T)));
  const presetRow=h('div',{class:'chips'});
  PRESETS.forEach(p=>presetRow.appendChild(h('button',{class:'chip',onclick:()=>{ setT(p.T); syncPanel(); dirty=true; refresh(); }},p.name)));
  gTemp.appendChild(presetRow);
  const tempTag=h('div',{class:'tag'}); gTemp.appendChild(tempTag);

  /* PhET's three checkboxes, its save and erase buttons, and its zoom buttons */
  const gGraph=h('div',{class:'grp'},h('h3',null,'the graph'));
  gGraph.appendChild(h('div',{class:'checks'},
    checkbox('gv','graph values',()=>setGraphValues(st.gv)),
    checkbox('labels','labels'),
    checkbox('inten','intensity')));
  const saveBtn=button('save curve',saveCurve), eraseBtn=button('erase saved',eraseSaved);
  gGraph.appendChild(h('div',{class:'btnrow'},saveBtn,eraseBtn));
  const graphTag=h('div',{class:'tag'}); gGraph.appendChild(graphTag);

  const gZoom=h('div',{class:'grp'},h('h3',null,'zoom'));
  const zxIn=button('λ: zoom in',()=>zoomX(-1)), zxOut=button('λ: zoom out',()=>zoomX(1));
  const zyIn=button('power: zoom in',()=>zoomY(-1)), zyOut=button('power: zoom out',()=>zoomY(1));
  const fitBtn=button('fit the axes',fitAxes);
  gZoom.appendChild(h('div',{class:'btnrow'},zxIn,zxOut));
  gZoom.appendChild(h('div',{class:'btnrow'},zyIn,zyOut));
  gZoom.appendChild(h('div',{class:'btnrow'},fitBtn));
  const zoomTag=h('div',{class:'tag'}); gZoom.appendChild(zoomTag);

  const gLim=h('div',{class:'grp'},h('h3',null,'the older laws'));
  gLim.appendChild(h('div',{class:'checks'},checkbox('rj','Rayleigh–Jeans (1900–05)'),checkbox('wien','Wien’s approximation (1896)')));

  const gReset=h('div',{class:'grp'},h('div',{class:'btnrow'},button('reset all',resetAll)));
  const keysTag=h('div',{class:'tag'}); gReset.appendChild(keysTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Blackbody Spectrum (University of Colorado Boulder, '
      +'phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. h, c, k exact (SI 2019); the colour-matching functions '
      +'are the CIE&rsquo;s own 1931 table (DOI 10.25039/CIE.DS.xvudnb9b); PhET&rsquo;s values: the 200&ndash;11000 K range, '
      +'the presets, the zoom ladders, the band edges and the photometer. Everything else is derived and pinned in selfTest '
      +'to build/blackbody-spectrum/derive.py.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gTemp,gGraph,gZoom,gLim,gReset,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncPanel(){
    const v=st.view;
    gGraph.hidden=(v!=='spec'); gZoom.hidden=(v!=='spec'); gLim.hidden=(v!=='limits');
    for(const k in rows) rows[k].sync();
    [].forEach.call(presetRow.children,(b,i)=>b.className='chip'+(PRESETS[i].T===st.T?' on':''));
    eraseBtn.disabled=SAVED.length===0;
    zxIn.disabled=st.ix<=0; zxOut.disabled=st.ix>=ZOOM_X.length-1;
    zyIn.disabled=st.iy<=0; zyOut.disabled=st.iy>=ZOOM_Y.length-1;
    const f=fitZoom(st.T); fitBtn.disabled=(f[0]===st.ix&&f[1]===st.iy);
    const p=presetAt(st.T);
    tempTag.innerHTML=p?'PhET&rsquo;s preset: <b>'+p.name+'</b>, '+fmt(p.T,0)+' K':'snaps to 50 K, as PhET&rsquo;s thermometer does';
    graphTag.innerHTML='saved: '+(SAVED.length?SAVED.map(T=>fmt(T,0)+' K').join(', '):'none')+' (PhET keeps two)';
    zoomTag.innerHTML='&lambda; axis 0&ndash;'+axisMax(ZOOM_X[st.ix]/1000)+' &micro;m (&times;2 a click), power 0&ndash;'+axisMax(ZOOM_Y[st.iy])+' MW/m&sup2;/&micro;m (&times;5)';
    keysTag.innerHTML='<b>&uarr;</b>/<b>&darr;</b> change T by 50 K &nbsp; <b>1</b>&ndash;<b>5</b> switch views';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=st.view==='spec'?'drag the thermometer, or the Graph Values point · ↑↓ 50 K · 1–5 views':'↑↓ change T by 50 K · 1–5 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); tagEl.innerHTML=tagHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='ArrowRight'){ e.preventDefault(); setT(st.T+T_SNAP); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){ e.preventDefault(); setT(st.T-T_SNAP); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  /* nothing here animates: a frame is drawn only when something marked the picture dirty */
  function frameLoop(){
    if(dirty){ dirty=false; try{ S.draw(); }catch(e){ fail(e); } }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

      [11000,2.02009900747463,[108,165,254],[108.232225,165.2538189,255],100.954702855,0.606029702242]]){
    close(phRenorm(T),r,1e-13,'PhET ramp r at '+T+' K (derive)');
    const pr=photometerRaw(T), pf=photometer(T);
    for(let c=0;c<3;c++){
      if(raw[c]===0) eq(pr[c],0,'channel '+c+' dark at '+T+' K'); else rel(pr[c],raw[c],2e-9,'channel '+'RGB'[c]+' before the floor at '+T+' K (derive)');
      if(raw[c]===255) ok(pf[c]===254||pf[c]===255,'the brightest channel at '+T+' K floors to 254 or 255 ('+pf[c]+'): 255·v/v is not always 255 in floating point, in PhET too');
      else eq(pf[c],rgb[c],'channel '+'RGB'[c]+' at '+T+' K (derive)');
    }
    rel(haloRadius(T),hr,1e-11,'halo radius at '+T+' K (derive)'); close(haloAlpha(T),ha,1e-12,'halo opacity at '+T+' K (derive)');
  }
  { const p=photometer(5800), c=bbBytes(5800);
    ok(p[2]>p[0]&&c[0]>c[2],'the finding: PhET’s photometer paints the Sun bluish (B > R), colorimetry warm (R > B)');
    const p3=photometer(3000), c3=bbBytes(3000);
    ok(p3[2]<c3[2]&&p3[1]<c3[1],'and a 3000 K filament deeper orange than the eye sees'); }

  /* ---------- H. the classical limits ---------- */
  for(const [x,rj,w] of [[1e-3,1.0005001667083417,0.00099950016662500845],[1e-2,1.0050167084168058,0.0099501662508319471],[0.1,1.0517091807564762,0.095162581964040427],
      [1,1.7182818284590453,0.63212055882855767],[X5,28.664984318811157,0.99302284634885529],[10,2202.5465794806719,0.99995460007023751],[30,356215819384.11542,0.99999999999990641]]){
    rel(rjRatio(x),rj,1e-14,'RJ/Planck at x = '+fmt(x,4)+' (derive)'); rel(wienRatio(x),w,1e-14,'Wien/Planck at x = '+fmt(x,4)+' (derive)'); }
  for(const [L,T] of [[500,5800],[20000,250],[3000,11000],[100000,3000]]){
    const x=xOf(L,T);
    rel(rjExitance(L*NM,T)/exitance(L*NM,T),rjRatio(x),1e-13,'the laws divided = (e^x - 1)/x at '+L+' nm, '+T+' K (two routes)');
    rel(wienExitance(L*NM,T)/exitance(L*NM,T),wienRatio(x),1e-13,'Wien over Planck = 1 - e^-x there (two routes)'); }
  rel(X_RJ1,0.019867767798097204,1e-12,'Rayleigh-Jeans is 1 % high at x = 0.019868 (derive brentq)'); rel(X_W1,4.6051701859880918,1e-15,'Wien 1 % low at x = ln 100');
  { const Lm=withState({view:'limits',T:5800},()=>limitsModel(ST));
    rel(Lm.lamRJ1/1000,124.85800186558778,1e-12,'at 5800 K, RJ within 1 % only beyond 124.9 um (derive)'); rel(Lm.lamW1/1000,0.53866625740512863,1e-12,'Wien within 1 % below 0.539 um (derive)'); }

  /* ---------- I. the state and PhET's controls ---------- */
  eq(snapT(5823),5800,'the thermometer snaps to 50 K'); eq(snapT(5826),5850,'rounding up'); eq(snapT(0),200,'clamped at 200 K'); eq(snapT(1e6),11000,'and 11000 K');
  eq(ZOOM_X.join(','),'750,1500,3000,6000,12000,24000,48000','the wavelength ladder, x2 (PhET)');
  rel(ZOOM_Y[0],1.024e-5,1e-12,'the power ladder starts at 1.024e-5 (PhET)'); eq(ZOOM_Y[IY_DEFAULT],100,'defaults to 100'); eq(ZOOM_Y[12],2500,'ends at 2500');
  for(let i=1;i<ZOOM_Y.length;i++) if(Math.abs(ZOOM_Y[i]/ZOOM_Y[i-1]-5)>1e-12) ok(false,'the power ladder steps x5');
  /* 4500 K separates the factor 5 from 4: 5 lambda_max = 3220 nm needs the 6-um axis, 4 lambda_max would fit 3 um
     (at every preset the two round up to the same ladder value, so the presets alone pin nothing) */
  for(const [T,ix,iy] of [[5800,2,10],[250,6,1],[3000,3,8],[9950,1,12],[200,6,0],[11000,1,12],[4500,3,10]]){
    const f=fitZoom(T); eq(f.join(','),ix+','+iy,'fit the axes at '+T+' K');
    ok(ZOOM_X[f[0]]>=5*peakNm(T)||f[0]===6,'  the fitted wavelength axis shows 5 lambda_max'); ok(ZOOM_Y[f[1]]>=peakPow(T),'  and the fitted power axis the peak'); }
  withState({},()=>{
    setT(3000); rel(ST.gvNm,peakNm(3000),1e-15,'a new temperature sends Graph Values to the peak (PhET)');
    ST.gvNm=2000; setGraphValues(true); rel(ST.gvNm,peakNm(3000),1e-15,'so does switching Graph Values on');
    zoomX(-1); zoomX(-1); zoomX(-1); eq(ST.ix,0,'wavelength zoom-in stops at 750 nm'); for(let i=0;i<9;i++) zoomX(1); eq(ST.ix,6,'zoom-out at 48 um');
    for(let i=0;i<20;i++) zoomY(-1); eq(ST.iy,0,'power zoom-in stops at 1.024e-5'); for(let i=0;i<20;i++) zoomY(1); eq(ST.iy,12,'zoom-out at 2500');
    setT(9950); fitAxes(); eq(ST.ix+','+ST.iy,'1,12','fit the axes on Sirius A');
    saveCurve(); setT(3000); saveCurve(); setT(250); saveCurve(); eq(SAVED.join(','),'3000,250','PhET keeps the two newest saved curves');
    eraseSaved(); eq(SAVED.length,0,'erase clears them');
    /* reset: disturb EVERY kind of state first */
    ST.view='star'; setT(700); ST.ix=5; ST.iy=3; ST.gv=true; ST.labels=true; ST.inten=true; ST.gvCue=false; ST.rj=false; ST.wien=false; ST.gvNm=123; saveCurve();
    resetAll();
    ok(ST.T===5800&&ST.ix===2&&ST.iy===10&&!ST.gv&&!ST.labels&&!ST.inten&&ST.gvCue&&ST.rj&&ST.wien&&SAVED.length===0,'reset all restores T, both zooms, the checkboxes, the cue and the saved curves');
    eq(ST.view,'star','and keeps the view'); rel(ST.gvNm,peakNm(5800),1e-15,'with Graph Values back on the peak');
  });

  /* ---------- J. the models, the readouts ---------- */
  for(const [v] of TABS) for(const over of [{},{T:200},{T:11000},{T:250,gv:true,labels:true,inten:true,ix:0,iy:0},{T:9950,gv:true,gvNm:40000,ix:6,iy:0}])
    withState(Object.assign({view:v},over),()=>{ const M=buildModel(); const html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
      ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0&&html.indexOf('Infinity')<0,'panels clean for '+v+' '+JSON.stringify(over)); },[3000,250]);
  withState({view:'spec'},()=>{ const h2=readoutHTML(buildModel()); ok(h2.indexOf('6.42×10⁷')>=0,'the spectrum readout prints sigma T^4 = 6.42x10^7 W/m^2 off the model'); ok(h2.indexOf('0.4996 µm')>=0,'and lambda_max = 0.4996 um'); });
  withState({view:'spec',gv:true,gvNm:1000},()=>{ ok(readoutHTML(buildModel()).indexOf('34.17')>=0,'Graph Values at 1 um prints M = 34.17'); });
  withState({view:'star'},()=>{ const h2=readoutHTML(buildModel()); ok(h2.indexOf('0.3260, 0.3353')>=0,'the star readout prints the chromaticity'); ok(h2.indexOf('#fff1eb')>=0,'and the sRGB colour'); ok(h2.indexOf('223 255 253')>=0,'and PhET’s channels'); });
  withState({view:'peak'},()=>{ ok(readoutHTML(buildModel()).indexOf('2.897772')>=0,'the peak readout prints b = 2.897772 mm K'); });
  withState({view:'total'},()=>{ ok(readoutHTML(buildModel()).indexOf('46.6 %')>=0,'the total readout prints the Sun’s 46.6 % visible'); });
  withState({view:'limits'},()=>{ ok(readoutHTML(buildModel()).indexOf('28.66')>=0,'the limits readout prints RJ 28.66x too high at the peak'); });
  eq(sci(64168769.43,3),'6.42×10⁷','sci() uses superscript exponents'); eq(sci(9.996e7,3),'1.00×10⁸','and carries 9.996 up to 1.00'); eq(sci(84.45,3),'84.5','plain in the middle');

  /* ---------- K. what the spectrum view draws, measured on the drawing ---------- */
  withState({view:'spec',labels:true,gv:true,gvNm:1000},()=>{
    const shot=makeShot(1400,820), M=buildModel(); drawView(shot,1400,820,M);
    const g=SPEC_LAST.g, b=g.b, X=nm=>b.x+b.w*nm/M.S.xmax, Y=v=>b.y1-b.h*v/M.S.ymax;
    close(SPEC_LAST.band[0],X(380),1e-9,'the rainbow starts at 380 nm on the axis (a unit check on the band)'); close(SPEC_LAST.band[1],X(780),1e-9,'and ends at 780 nm');
    close(SPEC_LAST.peak[0],X(peakNm(5800)),1e-9,'Wien’s diamond sits at lambda_max'); close(SPEC_LAST.peak[1],Y(peakPow(5800)),1e-9,'at the peak height');
    close(SPEC_LAST.curveTop,Y(peakPow(5800)),1e-9,'the drawn curve reaches exactly the peak (the peak sample is inserted)');
    close(SPEC_LAST.gv[0],X(1000),1e-9,'the Graph Values point sits at 1 um'); close(SPEC_LAST.gv[1],Y(specPow(1000,5800)),1e-9,'on the curve');
    eq(SPEC_LAST.bands.join(','),'uv,vis,ir','labels at 3 um: ultraviolet, visible, infrared (the X-ray band is under 20 px)');
  });
  withState({view:'spec',labels:true,ix:0},()=>{ drawView(makeShot(1400,820),1400,820,buildModel()); eq(SPEC_LAST.bands.join(','),'uv,vis','at 750 nm: ultraviolet and visible'); });
  withState({view:'spec',labels:true,ix:6},()=>{ drawView(makeShot(1400,820),1400,820,buildModel()); eq(SPEC_LAST.bands.join(','),'ir','at 48 um only the infrared is 20 px wide'); });
  withState({view:'spec',gv:true,gvNm:800,ix:0},()=>{ drawView(makeShot(1400,820),1400,820,buildModel()); eq(SPEC_LAST.gv,null,'Graph Values just past the 750 nm axis (at 800 nm) is hidden, as PhET’s'); });
  withState({view:'spec',gv:true,gvNm:750,ix:0},()=>{ drawView(makeShot(1400,820),1400,820,buildModel()); ok(SPEC_LAST.gv!==null,'and at the axis end (750 nm) it is drawn'); });
  withState({view:'spec',T:9950,gv:true},()=>{ const M=buildModel(); ok(M.S.over&&M.S.gv.above,'Sirius A overflows the default axis'); drawView(makeShot(1400,820),1400,820,M); eq(SPEC_LAST.gv,null,'and its point, above the axis, is hidden'); });
  withState({view:'spec',T:250},()=>{ const M=buildModel(); ok(M.S.tiny&&!M.S.peakIn,'the Earth at the default zoom: too small and past the axis'); ok(specWarning(M.S).indexOf('beyond this axis')>=0,'the canvas says to zoom out'); });
  withState({view:'spec',T:3000},()=>{ const M=buildModel(); ok(!M.S.tiny&&M.S.peakIn&&!M.S.over,'the light bulb (peak 3.1 of 100) is neither tiny (< 1 %) nor off the axis'); eq(specWarning(M.S),'','so no warning'); });
  withState({view:'spec',T:1500},()=>{ const M=buildModel(); ok(M.S.tiny,'1500 K peaks at '+sigf(M.S.Mp,3)+', under 1 % of 100: tiny'); ok(specWarning(M.S).indexOf('under 1 %')>=0,'and the canvas says so'); });
  withState({view:'spec'},()=>{ ok(readoutHTML(buildModel()).indexOf('97.9 %')>=0,'the readout prints the 97.9 % of sigma T^4 inside 0-3 um'); });
  eq(axisMax(3),'3','axis maxima print as PhET’s ladder values: 3'); eq(axisMax(0.75),'0.75','0.75'); eq(axisMax(ZOOM_Y[1]),'5.12×10⁻⁵','5.12x10^-5'); eq(axisMax(ZOOM_Y[0]),'1.024×10⁻⁵','1.024x10^-5'); eq(axisMax(ZOOM_Y[3]),'0.00128','0.00128');

  /* ---------- L. the scene and the pointer ---------- */
  withState({view:'spec'},()=>{
    const shot=makeShot(1400,820), S=makeScene({getContext:()=>shot}); S.W=1400; S.H=820;
    const g=specGeo(shot,1400,820,buildModel()), th=g.th;
    ok(!!th,'the thermometer is drawn at 1400 x 820');
    ok(S.pointer('down',th.x+6,thermoY(th,3000)),'pointer-down on the thermometer grabs it'); eq(ST.T,3000,'and sets 3000 K'); eq(DRAG.what,'thermo','it is the thermometer');
    S.pointer('move',th.x+6,thermoY(th,9950)); eq(ST.T,9950,'dragging sets 9950 K');
    S.pointer('move',th.x+6,thermoY(th,9971)); eq(ST.T,9950,'and snaps to 50 K');
    S.pointer('move',th.x+6,th.yTop-200); eq(ST.T,11000,'clamped at 11000 K'); S.pointer('move',th.x+6,th.bulbY+300); eq(ST.T,200,'and 200 K');
    ok(S.pointer('up',0,0),'pointer-up releases'); eq(DRAG.what,null,'nothing dragged');
    setT(5800); ST.gv=true; ST.gvNm=peakNm(5800);
    const M=buildModel(), b=specGeo(shot,1400,820,M).b, gx=b.x+b.w*ST.gvNm/M.S.xmax, gy=b.y1-b.h*M.S.gv.M/M.S.ymax;
    ok(S.pointer('down',gx+3,gy-2),'pointer-down on the Graph Values point grabs it'); eq(DRAG.what,'gv','it is the point');
    S.pointer('move',b.x+b.w/3+3,gy); rel(ST.gvNm,1000,1e-9,'dragged to 1 um along the curve');
    S.pointer('move',b.x1+400,gy); eq(ST.gvNm,M.S.xmax,'clamped at the axis end'); S.pointer('move',b.x-400,gy); eq(ST.gvNm,0,'and at 0');
    ok(ST.gvCue,'the cue arrows show until the first drag ends'); S.pointer('up',0,0); ok(!ST.gvCue,'then hide, as PhET’s');
    ok(!S.pointer('down',b.x+b.w*0.9,b.y+20),'a pointer-down on empty plot grabs nothing');
    ST.view='peak'; ok(!S.pointer('down',th.x+6,thermoY(th,3000)),'the other views ignore the pointer');
  });

  /* ---------- M. layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  /* substance floors per configuration, [fills + strokes, curve segments, texts]: 80 % of the least that
     configuration emits at any of the four sizes (set_floors.py from a SUB diagnostic run) — derived,
     not copied; a view that legitimately draws little (a curve off the top of the axis) has a low floor */
  const CONFIGS=[
    ['spec default',{view:'spec'},null,[76,480,12]],['spec all on',{view:'spec',gv:true,labels:true,inten:true,gvNm:1500},[3000,9950],[88,1294,16]],
    ['spec earth',{view:'spec',T:250},null,[73,480,12]],['spec earth fitted',{view:'spec',T:250,ix:6,iy:1,gv:true,labels:true,inten:true},[200],[28,961,16]],
    ['spec sirius 750',{view:'spec',T:9950,ix:0,labels:true,gv:true},null,[213,78,15]],['spec 11000 zoomed in',{view:'spec',T:11000,iy:0,labels:true,inten:true},null,[80,6,16]],
    ['spec 200 max zoom',{view:'spec',T:200,ix:6,iy:0,gv:true,labels:true},[11000],[27,481,15]],['spec gv past',{view:'spec',gv:true,gvNm:2000,ix:0},[5800],[212,961,12]],
    ['star default',{view:'star'},null,[368,0,12]],['star 200',{view:'star',T:200},null,[368,0,12]],['star 800',{view:'star',T:800},null,[368,0,12]],['star 3000',{view:'star',T:3000},null,[368,0,12]],['star 11000',{view:'star',T:11000},null,[368,0,12]],
    ['peak default',{view:'peak'},null,[23,1120,16]],['peak 200',{view:'peak',T:200},null,[23,982,16]],['peak 11000',{view:'peak',T:11000},null,[23,1128,16]],
    ['total default',{view:'total'},null,[22,160,20]],['total 200',{view:'total',T:200},null,[22,160,20]],['total 11000',{view:'total',T:11000},null,[22,160,20]],
    ['limits default',{view:'limits'},null,[15,676,16]],['limits no rj',{view:'limits',rj:false},null,[13,473,14]],['limits none',{view:'limits',rj:false,wien:false},null,[12,251,13]],
    ['limits 200',{view:'limits',T:200},null,[14,504,15]],['limits 11000',{view:'limits',T:11000},null,[15,655,16]]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const SUB_DIAG=(typeof SUB_DIAG_ON!=='undefined');
  for(const [nm,over,saved,minFills] of CONFIGS) for(const [W,H] of SIZES){
    withState(over,()=>{
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) return;
      const texts=c.ops.filter(o=>o.op==='text'), marks=c.ops.filter(o=>o.op==='fill'||o.op==='stroke').length, segs=POLY_SEGS.length/4;
      if(SUB_DIAG) console.log('SUB '+nm+' '+W+'x'+H+' marks '+marks+' segs '+segs+' texts '+texts.length);
      ok(marks>=minFills[0]&&segs>=minFills[1]&&texts.length>=minFills[2],nm+' '+W+'x'+H+' draws substance ('+marks+' marks, '+segs+' curve segments, '+texts.length+' texts; floors '+minFills.join('/')+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    },saved);
  }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
