<title>Blackbody spectrum &mdash; Planck&rsquo;s law, Wien&rsquo;s peak, the Stefan&ndash;Boltzmann area and the colour of heat</title>
<!--
  ===================================================================
  blackbody-spectrum.html — a remake of PhET's Blackbody Spectrum:
  the spectral power density of a blackbody against wavelength
  (Planck's law), where it peaks (Wien), how much it radiates in all
  (Stefan-Boltzmann), what colour it glows, and where the classical
  laws that came before Planck break
  ===================================================================

  Remake of PhET Interactive Simulations' Blackbody Spectrum (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.  Built against PhET's blackbody-spectrum 1.0.26: its
  one screen, every control on it, and its model constants.

  Five views.  THE SPECTRUM is PhET's screen: a thermometer from 200 K to
  11000 K that snaps to 50 K, with PhET's four presets (Earth, Light
  Bulb, Sun, Sirius A); the curve of spectral power density M_lambda =
  pi B_lambda against wavelength on axes that zoom x2 in wavelength
  (0.75 to 48 um) and x5 in power (1.024e-5 to 2500 MW/m^2/um); the
  visible band; the Graph Values marker, dragged along the curve and
  sent back to the peak whenever the temperature changes, as PhET's is;
  the band labels (X-ray, ultraviolet, visible, infrared); the
  intensity, the shaded area sigma T^4; two saved curves; and the glowing
  star with PhET's B, G, R photometer.  THE STAR: the colour of the
  body two ways — PhET's photometer (three samples of the curve) against
  true CIE 1931 colorimetry (the curve integrated against the eye's
  colour-matching functions); the photometer reads the Sun as a cyan
  white and a 3000 K filament as deep orange, colorimetry reads them
  warm white and pale orange.  THE PEAK: Wien's law — the family of
  curves on log-log axes threaded by the locus of peaks (slope -5), and
  every curve collapsing onto one universal shape when scaled by its own
  peak.  THE TOTAL: the Stefan-Boltzmann law, sigma T^4 against T
  (slope 4), and where the power goes band by band.  THE LIMITS: the
  Rayleigh-Jeans law (classical, and infinite in total) and Wien's
  approximation against Planck's law, and the ratio of each to it.

  WHAT IS EXACT HERE
  ------------------
  Planck's law in SI with the exact 2019 defining constants h, c, k;
  sigma, b, c1 = 2 pi h c^2, c2 = hc/k and the frequency-peak constant
  are derived from them and equal scipy.constants (CODATA 2022) to the
  last digit.  The Wien roots x5 = 4.965114231744276 and x3 =
  2.821439372122079 by Newton (checked against Lambert W and 50-digit
  decimal Newton).  Every M_lambda pinned against 50-digit decimal
  arithmetic.  The band fractions by two series — a Bernoulli head
  series whose coefficients come from power-series division, and the
  exponential tail series — joined at x = 2 and pinned against scipy
  quad and exact rationals.  The total pinned against scipy quad and a
  composite Gauss-Legendre rule in ln lambda.  Chromaticities are sums
  over the CIE's own colour-matching table.  Twin:
  build/blackbody-spectrum/derive.py; every reference number is a line
  of build/blackbody-spectrum/refvals.txt.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  The star's colour is PhET's model, reproduced exactly: each channel is
  the curve sampled at 650, 550 and 450 nm, normalised to the brightest
  of the three and dimmed by min(1, 0.02 sqrt(T/K - 798)) (PhET's
  values: 798 K is the Draper point); the halo's radius is 5 + 47.5 r px
  and its opacity 0.3 r, r = 0.02 sqrt(T/K - 798) (PhET's values).  The
  CIE colour is exact colorimetry clipped into the sRGB gamut and
  normalised to its brightest channel; its glow brightness is
  log-compressed, 1 + log10(L/L(6500 K))/12 (display only).  The
  rainbow band fades at its ends by sqrt(min(1, 4 ybar)) (display only).

  NOT MODELLED
  ------------
  Real bodies are not black: no emissivity, no absorption lines (the
  Sun's spectrum is not a Planck curve), no atmosphere.  The presets
  are PhET's round numbers, not measurements.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  h, c, k: the SI (exact).  The CIE 1931 2-degree colour-matching
  functions: the CIE's own table, CIE_xyz_1931_2deg.csv (1 nm, 360-830
  nm, DOI 10.25039/CIE.DS.xvudnb9b, ISO/CIE 11664-1:2019), every fifth
  row embedded verbatim by derive.py; the CIE's Illuminant A table
  (CIE_std_illum_A_1nm.csv) checks the chain: a Planck body at
  2855.496 K reproduces it to its printed precision (4.8e-6) and its
  chromaticity to 4e-8.  sRGB: the IEC 61966-2-1 matrix and transfer
  curve.  683 lm/W: the SI definition of the candela.  PhET's values
  (read from the minified original): the range 200-11000 K and its 50 K
  snap; the presets Earth 250 K, Light Bulb 3000 K, Sun 5800 K,
  Sirius A 9950 K; the zoom ladders; the band edges 10 nm, 380 nm,
  780 nm and 100 um; two saved curves; the photometer.  PhET's own
  constants differ from CODATA by +4.0e-5 (c1), -4.8e-6 (c2), -2.5e-7
  (sigma) and +3.6e-7 (b); this file uses CODATA throughout.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',
            '&prop;':'∝','&radic;':'√','&infin;':'∞','&middot;':'·',
            '&rarr;':'→','&larr;':'←','&ell;':'ℓ','&sup2;':'²',
            '&sup3;':'³','&frac12;':'½','&le;':'≤','&ge;':'≥',
            '&prime;':'′','&Prime;':'″','&rArr;':'⇒','&hArr;':'⇔','&oint;':'∮','&int;':'∫','&perp;':'⊥','&ycirc;':'ŷ'};
/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */

    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));

  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);

function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }

function ticksFor(lo,hi,want){

  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);

    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(b.x,Y); ctx.lineTo(b.x1,Y); ctx.stroke();

  if(o.ylab){ ctx.save(); ctx.translate(b.x-40,b.y+b.h/2); ctx.rotate(-PI/2);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }

function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';

  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;

/* ================================================================== *
 *  physics: Planck's law in SI, Wien, Stefan-Boltzmann, the band      *
 *  fractions, CIE colorimetry, PhET's photometer, the classical laws  *
 *  twin: build/blackbody-spectrum/derive.py                          *
 * ================================================================== */
/* the exact SI 2019 defining constants; everything below is derived from them */
const H_PLANCK=6.62607015e-34, C_LIGHT=299792458, K_BOLTZ=1.380649e-23;
const C1=2*PI*H_PLANCK*C_LIGHT*C_LIGHT;                       /* first radiation constant 2πhc², W m² */
const C2=H_PLANCK*C_LIGHT/K_BOLTZ;                            /* second radiation constant hc/k, m K */
const SIGMA=2*Math.pow(PI,5)*Math.pow(K_BOLTZ,4)/(15*Math.pow(H_PLANCK,3)*C_LIGHT*C_LIGHT);
const PI4_15=Math.pow(PI,4)/15;                               /* ∫₀^∞ t³/(eᵗ−1) dt */
/* x = n (1 − e^−x): the peak of x^n/(eˣ−1).  Newton from x = n converges in five steps. */
function wienRoot(n){
  let x=n;
  for(let i=0;i<40;i++){ const e=Math.exp(-x), dx=(x-n*(1-e))/(1-n*e); x-=dx; if(Math.abs(dx)<1e-15*x) break; }
  return x;
}
const X5=wienRoot(5), X3=wienRoot(3);                         /* the λ-peak and the ν-peak */
const B_WIEN=C2/X5;                                           /* λ_max T, m K */
const NU_PER_T=X3*K_BOLTZ/H_PLANCK;                           /* ν_max / T, Hz/K */
/* the peak height grows as T⁵: M(λ_max) = K_PEAK T⁵, W m⁻³ K⁻⁵ — the second route to peakPow() */
const K_PEAK=2*PI*Math.pow(K_BOLTZ,5)*Math.pow(X5,5)/(Math.pow(H_PLANCK,4)*Math.pow(C_LIGHT,3)*Math.expm1(X5));

/* M_λ = π B_λ = (2πhc²/λ⁵) / (e^{hc/λkT} − 1): the spectral exitance, W m⁻² m⁻¹.
   expm1 keeps the Rayleigh–Jeans end accurate; past x = 700 the value is below 1e-280. */
function exitance(lamM,T){
  const x=C2/(lamM*T);
  if(!(x<700)) return 0;
  return C1/Math.pow(lamM,5)/Math.expm1(x);
}
/* PhET's axis unit, MW m⁻² µm⁻¹, with λ in nm: 1 W m⁻³ = 10⁻⁶ W m⁻² µm⁻¹ = 10⁻¹² MW m⁻² µm⁻¹ */
const NM=1e-9, TO_DISP=1e-12;
function specPow(lamNm,T){ return exitance(lamNm*NM,T)*TO_DISP; }
function peakNm(T){ return B_WIEN/T/NM; }
function peakPow(T){ return specPow(peakNm(T),T); }
function peakPowT5(T){ return K_PEAK*Math.pow(T,5)*TO_DISP; }
function intensity(T){ return SIGMA*T*T*T*T; }                /* σT⁴, W m⁻² */

   the HEAD  ∫₀^x t³/(eᵗ−1) dt = Σ a_k x^{k+3}/(k+3),  a_k = B_k/k!  (radius 2π; at x = 2 the
             40th term is 5e-21 of the first), the coefficients generated by power-series
             division of t/(eᵗ−1) = 1/Σ t^j/(j+1)! — never typed; derive.py pins them to the

  const inv=[1]; for(let j=1;j<=BERN_N+1;j++) inv.push(inv[j-1]/(j+1));      /* inv[j] = 1/(j+1)! */
  const a=[1];
  for(let k=1;k<=BERN_N;k++){ let s=0; for(let j=1;j<=k;j++) s+=a[k-j]*inv[j]; a.push(-s); }
  return a;
})();
function headSeries(x){
  let s=0;
  for(let k=BERN_N;k>=0;k--) s=s*x+BERN_A[k]/(k+3);

/* fraction of σT⁴ at wavelengths below lamNm, and above it — each from the branch that keeps it accurate */
function fracBelow(lamNm,T){
  if(!(lamNm>0)) return 0;
  const x=C2/(lamNm*NM*T);
  return x>=X_JOIN ? tailSeries(x)/PI4_15 : 1-headSeries(x)/PI4_15;
}
function fracAbove(lamNm,T){
  if(!(lamNm>0)) return 1;
  const x=C2/(lamNm*NM*T);
  return x>=X_JOIN ? 1-tailSeries(x)/PI4_15 : headSeries(x)/PI4_15;
}
function bandFrac(loNm,hiNm,T){ return hiNm===Infinity ? fracAbove(loNm,T) : fracBelow(hiNm,T)-fracBelow(loNm,T); }

/* ---- an independent route to the total: composite Gauss–Legendre in u = ln λ --------------------
   ∫₀^∞ M_λ dλ = ∫ M_λ λ du over λ_max/60 … 10⁶ λ_max (what lies outside is below 1e-17 of σT⁴) */
function glRule(n){
  const x=[], w=[];
  for(let i=1;i<=n;i++){
    let z=Math.cos(PI*(i-0.25)/(n+0.5)), dp=0;
    for(let it=0;it<100;it++){
      let p0=1, p1=z;
      for(let k=2;k<=n;k++){ const p2=((2*k-1)*z*p1-(k-1)*p0)/k; p0=p1; p1=p2; }
      dp=n*(z*p1-p0)/(z*z-1);
      const dz=p1/dp; z-=dz; if(Math.abs(dz)<1e-16) break;
    }
    x.push(z); w.push(2/((1-z*z)*dp*dp));
  }
  return {x,w};
}
const GL16=glRule(16);
function quadGL(f,a,b,panels){
  const h2=(b-a)/panels; let s=0;
  for(let p=0;p<panels;p++){
    const m=a+(p+0.5)*h2, r=h2/2;
    for(let i=0;i<GL16.x.length;i++) s+=GL16.w[i]*f(m+r*GL16.x[i]);
  }
  return s*h2/2;
}
function totalByQuadrature(T){
  const lm=B_WIEN/T;
  return quadGL(u=>{ const L=Math.exp(u); return exitance(L,T)*L; },Math.log(lm/60),Math.log(lm*1e6),64);
}

/* ---- the classical laws that came before Planck ---------------------------------------------- */
function rjExitance(lamM,T){ return 2*PI*C_LIGHT*K_BOLTZ*T/Math.pow(lamM,4); }        /* Rayleigh–Jeans */
function wienExitance(lamM,T){ return C1/Math.pow(lamM,5)*Math.exp(-C2/(lamM*T)); }   /* Wien 1896 */
function rjRatio(x){ return Math.expm1(x)/x; }                  /* M_RJ / M_Planck */
function wienRatio(x){ return -Math.expm1(-x); }                /* M_Wien / M_Planck */
function xOf(lamNm,T){ return C2/(lamNm*NM*T); }

/* ---- colorimetry: the CIE 1931 2° observer, the CIE's own table (p2_cie.js) -------------------- */
const CIE_STEP=5;                                            /* nm between the embedded rows */
function bbXYZ(T){
  let X=0,Y=0,Z=0;
  for(const r of CIE1931){ const m=exitance(r[0]*NM,T); X+=m*r[1]; Y+=m*r[2]; Z+=m*r[3]; }
  const d=CIE_STEP*NM;
  return [X*d,Y*d,Z*d];
}
function chroma(T){ const c=bbXYZ(T), s=c[0]+c[1]+c[2]; return [c[0]/s,c[1]/s]; }
/* sRGB (IEC 61966-2-1) primaries, D65 — the matrix and transfer curve of diffraction.html */
const SRGB_M=[[ 3.2406,-1.5372,-0.4986],
              [-0.9689, 1.8758, 0.0415],
              [ 0.0557,-0.2040, 1.0570]];
function srgbGamma(u){
  u=clamp(u,0,1);
  return u<=0.0031308 ? 12.92*u : 1.055*Math.pow(u,1/2.4)-0.055;
}
function xyzToLin(X,Y,Z){
  return [SRGB_M[0][0]*X+SRGB_M[0][1]*Y+SRGB_M[0][2]*Z,
          SRGB_M[1][0]*X+SRGB_M[1][1]*Y+SRGB_M[1][2]*Z,
          SRGB_M[2][0]*X+SRGB_M[2][1]*Y+SRGB_M[2][2]*Z];
}
/* the body's colour: chromaticity only (Y set to 1), negative channels clipped (out of gamut),
   normalised to the brightest channel; linear light */
function bbLinear(T){
  const c=bbXYZ(T);
  if(!(c[1]>0)) return [0,0,0];
  const v=xyzToLin(c[0]/c[1],1,c[2]/c[1]).map(u=>Math.max(u,0)), m=Math.max(v[0],v[1],v[2]);
  return m>0 ? v.map(u=>u/m) : [0,0,0];
}
function bbBytes(T){ return bbLinear(T).map(u=>Math.round(255*srgbGamma(u))); }
/* luminous efficacy of the radiation, 683 lm/W × ∫M ȳ dλ / σT⁴ (683 lm/W: the SI candela) */
const K_CD=683;
function efficacy(T){ return K_CD*bbXYZ(T)[1]/intensity(T); }
/* display only: the glow's brightness, log-compressed luminance relative to 6500 K */
let Y6500=0;
function glowLevel(T){
  if(!Y6500) Y6500=bbXYZ(6500)[1];
  const r=bbXYZ(T)[1]/Y6500;
  return r>0 ? clamp(1+Math.log10(r)/12,0,1) : 0;
}
/* a monochromatic line's colour, interpolated in the 5-nm table, desaturated toward white and
   normalised to its brightest channel.  Takes NANOMETRES; outside 360–830 nm it is black. */
function cmfAt(nm){
  if(!(nm>=360&&nm<=830)) return null;
  const f=(nm-360)/CIE_STEP, i=Math.min(CIE1931.length-2,Math.floor(f)), t=f-i, a=CIE1931[i], b=CIE1931[i+1];
  return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];
}
function monoLinear(nm){
  const c=cmfAt(nm);
  if(!c) return [0,0,0];
  let v=xyzToLin(c[0],c[1],c[2]);
  const lo=Math.min(v[0],v[1],v[2]);
  if(lo<0) v=v.map(u=>u-lo);
  const m=Math.max(v[0],v[1],v[2]);
  return m>0 ? v.map(u=>u/m) : [0,0,0];
}
/* the band fades where the eye does (display only): sqrt(min(1, 4 ȳ)) */
function monoLevel(nm){ const c=cmfAt(nm); return c ? Math.sqrt(Math.min(1,4*c[1])) : 0; }
function cssOfLinear(v,k){ const s=k===undefined?1:k;
  return 'rgb('+Math.round(255*srgbGamma(v[0]*s))+','+Math.round(255*srgbGamma(v[1]*s))+','+Math.round(255*srgbGamma(v[2]*s))+')'; }
function hexOfBytes(b){ return '#'+b.map(u=>('0'+u.toString(16)).slice(-2)).join(''); }

/* ---- PhET's photometer and star (PhET's values, reproduced exactly) --------------------------
   each channel = floor(255 · min(1, r) · M(λ_c)/max(M(650), M(550), M(450))),  r = 0.02 √(T − 798 K);
   the halo: radius 5 + 47.5 r px, opacity 0.3 r.  798 K is the Draper point. */
const PH_LAM=[650,550,450];                                  /* R, G, B sample wavelengths, nm */
const PH_DRAPER=798, PH_RAMP=0.02;
function phRenorm(T){ return PH_RAMP*Math.sqrt(Math.max(T,PH_DRAPER)-PH_DRAPER); }
function photometerRaw(T){
  const s=PH_LAM.map(l=>specPow(l,T)), r=Math.max(s[0],s[1],s[2]), a=Math.min(phRenorm(T),1);
  return s.map(v=>r>0 ? 255*a*v/r : 0);
}
function photometer(T){ return photometerRaw(T).map(Math.floor); }
function haloRadius(T){ return 5+47.5*phRenorm(T); }
function haloAlpha(T){ return 0.3*phRenorm(T); }

/* ---- PhET's ranges, presets, zoom ladders and bands (PhET's values) ---------------------------- */
const T_MIN=200, T_MAX=11000, T_SNAP=50, T_DEFAULT=5800;
const PRESETS=[{id:'earth',name:'Earth',T:250},{id:'bulb',name:'Light Bulb',T:3000},
               {id:'sun',name:'Sun',T:5800},{id:'sirius',name:'Sirius A',T:9950}];
function presetAt(T){ return PRESETS.find(p=>p.T===T)||null; }
function snapT(T){ return clamp(Math.round(T/T_SNAP)*T_SNAP,T_MIN,T_MAX); }
const ZOOM_X=[750,1500,3000,6000,12000,24000,48000];         /* wavelength axis maximum, nm (×2) */
const ZOOM_Y=[]; for(let k=-10;k<=2;k++) ZOOM_Y.push(100*Math.pow(5,k));   /* power axis maximum, MW/m²/µm (×5) */
const IX_DEFAULT=2, IY_DEFAULT=10;                            /* 3 µm and 100 MW/m²/µm */
const BANDS=[{id:'xray',name:'X-Ray',short:'X',lo:0,hi:10},{id:'uv',name:'Ultraviolet',short:'UV',lo:10,hi:380},
             {id:'vis',name:'Visible',short:'vis',lo:380,hi:780},{id:'ir',name:'Infrared',short:'IR',lo:780,hi:1e5},
             {id:'far',name:'beyond 100 µm',short:'>100 µm',lo:1e5,hi:Infinity}];
const MAX_SAVED=2;
/* the smallest axis maxima that frame a curve: λ-axis ≥ 5 λ_max, power axis ≥ the peak */
function fitZoom(T){
  const lx=5*peakNm(T), py=peakPow(T);
  let ix=ZOOM_X.findIndex(z=>z>=lx); if(ix<0) ix=ZOOM_X.length-1;
  let iy=ZOOM_Y.findIndex(z=>z>=py); if(iy<0) iy=ZOOM_Y.length-1;
  return [ix,iy];
}

/* ================================================================== *
 *  state, the per-view model, readout, eqbar, tag                     *
 * ================================================================== */
const TABS=[['spec','the spectrum'],['star','the star'],['peak','the peak'],['total','the total'],['limits','the limits']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0',
           dim:'#8b93a6', off:'#161c2c', edge:'#242a3a', wien:'#7fb3ff', bg:'#070b18'};
const RO_W=300;
/* PhET's defaults: the Sun, 3 µm × 100 MW/m²/µm, all three checkboxes off, no saved curves.
   The Graph Values point sits at the peak (gvNm is reset to it whenever T changes). */
const DEFAULTS={view:'spec', T:T_DEFAULT, ix:IX_DEFAULT, iy:IY_DEFAULT,
                gv:false, labels:false, inten:false, gvNm:peakNm(T_DEFAULT), gvCue:true,
                rj:true, wien:true};
const ST=Object.assign({},DEFAULTS);
const SAVED=[];                                     /* saved temperatures, oldest first, at most MAX_SAVED */
const MEMO={};
function memo(name,key,fn){ const m=MEMO[name]; if(m&&m.key===key) return m.val; const val=fn(); MEMO[name]={key,val}; return val; }

/* ---- the actions every control goes through ---------------------------------------------------- */
function setT(T){ ST.T=snapT(T); ST.gvNm=peakNm(ST.T); }              /* PhET: a new T sends the point to the peak */
function zoomX(dir){ ST.ix=clamp(ST.ix+dir,0,ZOOM_X.length-1); }        /* dir +1 zooms OUT (a longer axis) */
function zoomY(dir){ ST.iy=clamp(ST.iy+dir,0,ZOOM_Y.length-1); }
function fitAxes(){ const f=fitZoom(ST.T); ST.ix=f[0]; ST.iy=f[1]; }
function saveCurve(){ SAVED.push(ST.T); while(SAVED.length>MAX_SAVED) SAVED.shift(); }
function eraseSaved(){ SAVED.length=0; }
function setGraphValues(on){ ST.gv=!!on; ST.gvNm=peakNm(ST.T); }     /* PhET: toggling it also re-centres on the peak */
function resetAll(){ const v=ST.view; Object.assign(ST,DEFAULTS); ST.view=v; ST.gvNm=peakNm(ST.T); SAVED.length=0; }

/* ---- the curves ---------------------------------------------------------------------------------- */
const N_CURVE=600;
/* samples of M_λ on [0, xmaxNm], the exact peak inserted: x in µm, y in MW/m²/µm */
function curveSamples(T,xmaxNm){
  const xs=[], ys=[], lp=peakNm(T); let put=!(lp>0&&lp<xmaxNm);
  for(let i=0;i<=N_CURVE;i++){
    const L=xmaxNm*i/N_CURVE;
    if(!put&&L>lp){ xs.push(lp/1000); ys.push(specPow(lp,T)); put=true; }
    xs.push(L/1000); ys.push(L>0?specPow(L,T):0);
  }
  return {xs,ys};
}
/* log-spaced samples between two wavelengths (nm), for the log–log views */
function logSamples(fn,loNm,hiNm,n){
  const xs=[], ys=[], a=Math.log(loNm), b=Math.log(hiNm);
  for(let i=0;i<=n;i++){ const L=Math.exp(a+(b-a)*i/n); xs.push(L/1000); ys.push(fn(L)); }
  return {xs,ys};
}
function tempLabel(T){ const p=presetAt(T); return fmt(T,0)+' K'+(p?' — '+p.name:''); }

/* ---- the models -------------------------------------------------------------------------------- */
function specModel(st){
  const T=st.T, xmax=ZOOM_X[st.ix], ymax=ZOOM_Y[st.iy], lm=peakNm(T), Mp=peakPow(T);
  const saved=SAVED.map((Ts,i)=>({T:Ts, newest:i===SAVED.length-1, c:curveSamples(Ts,xmax), lm:peakNm(Ts), Mp:peakPow(Ts)}));
  const gvM=specPow(st.gvNm,T);
  return {T,xmax,ymax,lm,Mp,I:intensity(T),c:curveSamples(T,xmax),saved,
          gv:{on:st.gv,nm:st.gvNm,M:gvM,inside:st.gvNm<=xmax,above:gvM>ymax,cue:st.gvCue},
          win:fracBelow(xmax,T),over:Mp>ymax,tiny:Mp<ymax/100,peakIn:lm<=xmax,fit:fitZoom(T),
          ph:photometer(T),halo:[haloRadius(T),haloAlpha(T)],cie:bbBytes(T),glow:glowLevel(T),
          canInX:st.ix>0,canOutX:st.ix<ZOOM_X.length-1,canInY:st.iy>0,canOutY:st.iy<ZOOM_Y.length-1};
}
/* the colour of every temperature on the thermometer, both ways (memoised: it does not depend on T) */
function colourStrips(){
  return memo('strips','all',()=>{
    const Ts=[], ph=[], cie=[], glow=[], phCss=[], cieCss=[];
    for(let T=T_MIN;T<=T_MAX;T+=T_SNAP){
      const p=photometer(T), gl=glowLevel(T);
      Ts.push(T); ph.push(p); cie.push(bbBytes(T)); glow.push(gl);
      phCss.push('rgb('+p.join(',')+')'); cieCss.push(cssOfLinear(bbLinear(T),gl));
    }
    return {Ts,ph,cie,glow,phCss,cieCss};
  });
}
function starModel(st){
  const T=st.T, xy=chroma(T), b=bbBytes(T);
  return {T,ph:photometer(T),phRaw:photometerRaw(T),r:phRenorm(T),halo:[haloRadius(T),haloAlpha(T)],
          xy,cie:b,hex:hexOfBytes(b),glow:glowLevel(T),eff:efficacy(T),strips:colourStrips(),
          lamCh:PH_LAM.map(l=>specPow(l,T))};
}
function peakModel(st){
  const T=st.T, lm=peakNm(T), Mp=peakPow(T);
  const fam=PRESETS.map(p=>({T:p.T,name:p.name,lm:peakNm(p.T),Mp:peakPow(p.T),
    c:logSamples(L=>specPow(L,p.T),50,2e5,320)}));
  const cur={T,lm,Mp,c:logSamples(L=>specPow(L,T),50,2e5,320)};
  /* the universal curve: M/M_peak against λ/λ_max, for the current T and each preset */
  const uni=[T].concat(PRESETS.map(p=>p.T)).map(Tu=>{ const l0=peakNm(Tu), m0=peakPow(Tu), xs=[], ys=[];
    for(let i=1;i<=400;i++){ const u=5*i/400; xs.push(u); ys.push(specPow(u*l0,Tu)/m0); } return {T:Tu,xs,ys}; });
  return {T,lm,Mp,fam,cur,uni,nu:NU_PER_T*T,lamNu:C_LIGHT/(NU_PER_T*T)/NM,kpk:K_PEAK};
}
function totalModel(st){
  const T=st.T, I=intensity(T);
  const curve=memo('sbcurve','all',()=>logSamples(TT=>intensity(TT),T_MIN,T_MAX,200));   /* x = T/1000 */
  const budget=memo('budget','all',()=>{ const Ts=[], f=BANDS.map(()=>[]);
    for(let TT=T_MIN;TT<=T_MAX;TT+=T_SNAP){ Ts.push(TT); BANDS.forEach((bd,i)=>f[i].push(bandFrac(bd.lo,bd.hi,TT))); }
    return {Ts,f}; });
  return {T,I,quad:totalByQuadrature(T),bands:BANDS.map(bd=>bandFrac(bd.lo,bd.hi,T)),curve,budget,
          win:fracBelow(ZOOM_X[st.ix],T),xmax:ZOOM_X[st.ix]};
}
/* x where Rayleigh–Jeans is 1 % high: (eˣ − 1)/x = 1.01, by bisection */
const X_RJ1=(function(){ let lo=1e-6, hi=1; for(let i=0;i<100;i++){ const m=0.5*(lo+hi); if(rjRatio(m)<1.01) lo=m; else hi=m; } return 0.5*(lo+hi); })();
const X_W1=Math.log(100);                                   /* 1 − e^−x = 0.99 */
function limitsModel(st){
  const T=st.T, lo=10, hi=1e6;
  const pl=logSamples(L=>specPow(L,T),lo,hi,420), rj=logSamples(L=>rjExitance(L*NM,T)*TO_DISP,lo,hi,420),
        wi=logSamples(L=>wienExitance(L*NM,T)*TO_DISP,lo,hi,420);
  const ratios=memo('ratios','all',()=>{ const xs=[], r=[], w=[];
    for(let i=0;i<=300;i++){ const x=Math.pow(10,-3+i*(Math.log10(30)+3)/300); xs.push(x); r.push(rjRatio(x)); w.push(wienRatio(x)); }
    return {xs,r,w}; });
  return {T,lm:peakNm(T),Mp:peakPow(T),pl,rj,wi,ratios,lamRJ1:C2/(X_RJ1*T)/NM,lamW1:C2/(X_W1*T)/NM,
          rjPeak:rjRatio(X5),wPeak:wienRatio(X5)};
}
function buildModel(){
  const st=ST, view=st.view;
  const M={view,st,T:st.T};
  if(view==='spec') M.S=specModel(st);
  else if(view==='star') M.C=starModel(st);
  else if(view==='peak') M.P=peakModel(st);
  else if(view==='total') M.O=totalModel(st);
  else M.L=limitsModel(st);
  return M;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
const SUPS={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function supNum(n){ return String(n).split('').map(ch=>SUPS[ch]||ch).join(''); }
/* significant figures, with a ×10ⁿ exponent outside 10⁻³ … 10⁵ */
function sci(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const e=Math.floor(Math.log10(Math.abs(x)));
  if(e>=-3&&e<5) return sigf(x,n);
  let m=x/Math.pow(10,e), ms=m.toFixed(n-1), ee=e;
  if(Math.abs(+ms)>=10){ ms=(m/10).toFixed(n-1); ee=e+1; }
  return ms+'×10'+supNum(ee);
}
function um(nm,n){ return sigf(nm/1000,n||4)+' µm'; }
function pct(f){ return f>=0.9995&&f<1 ? '> 99.9 %' : (f<5e-4&&f>0 ? '< 0.05 %' : sigf(100*f,3)+' %'); }
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function swatch(bytes){ return '<i style="display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);background:rgb('+bytes.join(',')+')"></i>'; }
function readoutHTML(M){
  const st=M.st, T=M.T, p=presetAt(T);
  let s='<div class="rname">'+fmt(T,0)+' K<small>'+(p?p.name+' · ':'')+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  if(M.view==='spec'){
    const S=M.S;
    s+=hd('Wien: the peak')+rrow('&lambda;<sub>max</sub> = b/T',um(S.lm)+' ('+sigf(S.lm,4)+' nm)')+rrow('M<sub>&lambda;</sub> at the peak',sci(S.Mp,4)+' MW/m&sup2;/&micro;m',S.over?'bad':'');
    s+=hd('Stefan&ndash;Boltzmann: the area')+rrow('intensity &sigma;T&#8308;',sci(S.I,3)+' W/m&sup2;',st.inten?'good':'')
      +rrow('inside 0&ndash;'+axisMax(S.xmax/1000)+' &micro;m',pct(S.win));
    if(S.gv.on) s+=hd('graph values')+rrow('wavelength',um(S.gv.nm))+rrow('spectral power density',sci(S.gv.M,4)+' MW/m&sup2;/&micro;m','good')
      +(S.gv.inside?'':rrow('the point','beyond the axis: zoom out','bad'));
    s+=hd('the axes')+rrow('wavelength',' 0&ndash;'+axisMax(S.xmax/1000)+' &micro;m')+rrow('power',' 0&ndash;'+axisMax(S.ymax)+' MW/m&sup2;/&micro;m');
    if(SAVED.length){ s+=hd('saved curves'); S.saved.slice().reverse().forEach((c,i)=>{ s+=rrow((i===0?'newer (solid)':'older (dashed)'),fmt(c.T,0)+' K, peak '+um(c.lm,3)); }); }
    s+=hd('the colour')+rrow('PhET photometer R G B',S.ph.join(' '))+rrow('true colour (CIE 1931)',swatch(S.cie)+' '+hexOfBytes(S.cie));
  }
  else if(M.view==='star'){
    const C=M.C;
    s+=hd('PhET&rsquo;s photometer')+rrow('M at 650, 550, 450 nm',C.lamCh.map(v=>sci(v,3)).join(', '))
      +rrow('r = 0.02&radic;(T &minus; 798 K)',sigf(C.r,4),C.r<1?'bad':'')+rrow('channels R G B',C.ph.join(' '))
      +rrow('star colour',swatch(C.ph)+' '+hexOfBytes(C.ph))+rrow('halo radius, opacity',sigf(C.halo[0],3)+' px, '+sigf(C.halo[1],3));
    s+=hd('CIE 1931 colorimetry')+rrow('chromaticity x, y',fmt(C.xy[0],4)+', '+fmt(C.xy[1],4),'good')+rrow('sRGB',swatch(C.cie)+' '+C.hex,'good')
      +rrow('glow (log luminance)',sigf(C.glow,3))+rrow('luminous efficacy',sigf(C.eff,3)+' lm/W');
  }
  else if(M.view==='peak'){
    const P=M.P;
    s+=hd('Wien&rsquo;s law')+rrow('&lambda;<sub>max</sub>',um(P.lm)+' ('+sigf(P.lm,4)+' nm)','good')+rrow('&lambda;<sub>max</sub> T = b',sigf(B_WIEN*1e3,7)+' mm&middot;K')
      +rrow('x&#8325; = 5(1 &minus; e<sup>&minus;x&#8325;</sup>)',fmt(X5,9))+rrow('peak height M(&lambda;<sub>max</sub>)',sci(P.Mp,4)+' MW/m&sup2;/&micro;m')
      +rrow('&hellip; / T&#8309;',sci(P.kpk*TO_DISP,5)+' MW/m&sup2;/&micro;m/K&#8309;');

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from projects/simulations/build_buoy/p4_views.js by name,   *
 *  unchanged; its world-map and fluid helpers are left behind              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }

function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ---- this sim's own drawing helpers ------------------------------------------------------------- */
const DRAG={what:null,off:0};
const TITLE_FONT='italic 13px Georgia, serif';
/* a label with a dark pad under it, placed by the same shift-or-drop search as lab() */
function labPad(ctx,W,H,x,y,txt,col,font,align,base){
  const f=font||SM_FONT, al=align||'left', bl=base||'middle';
  const t=plain(txt), fs=parseFloat(f.match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){
      LABELS.push(bx);
      ctx.fillStyle='rgba(7,11,24,0.82)'; ctx.fillRect(lx-3,ly-1,w+6,hh+2);
      ctx.fillStyle=col; ctx.font=f; ctx.textAlign=al; ctx.textBaseline=bl; ctx.fillText(t,X,Y);
      return true;
    }
  }
  return false;
}
/* does the segment (x0,y0)-(x1,y1) cross the box [l,t,r,b]?  Liang–Barsky, exact */
function segHitsBox(x0,y0,x1,y1,bx){
  let t0=0,t1=1; const dx=x1-x0, dy=y1-y0;
  for(const [p,q] of [[-dx,x0-bx[0]],[dx,bx[2]-x0],[-dy,y0-bx[1]],[dy,bx[3]-y0]]){
    if(p===0){ if(q<0) return false; continue; }
    const t=q/p;
    if(p<0){ if(t>t1) return false; if(t>t0) t0=t; } else { if(t<t0) return false; if(t<t1) t1=t; }
  }
  return t0<=t1;
}
/* a label at the first candidate [x, y, align, baseline] whose box stays on the canvas, clears every
   registered label AND crosses no recorded curve segment; if none does, lab() at the first.  Call it
   after the curves it must avoid are drawn.  pad: a dark backing box. */
function labAvoid(ctx,W,H,cands,txt,col,font,pad,extra){
  const f=font||SM_FONT, t=plain(txt), fs=parseFloat(f.match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const [x,y,al,bl] of cands){
    const lx=al==='center'?x-w/2:(al==='right'?x-w:x), ly=bl==='top'?y:(bl==='middle'?y-hh/2:(bl==='bottom'?y-hh:y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(bx[0]<2||bx[2]>W-2||bx[1]<0||bx[3]>H||!labFits(bx)) continue;
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4) hit=segHitsBox(POLY_SEGS[i],POLY_SEGS[i+1],POLY_SEGS[i+2],POLY_SEGS[i+3],bx);
    if(extra) for(let i=0;i<extra.length&&!hit;i+=4) hit=segHitsBox(extra[i],extra[i+1],extra[i+2],extra[i+3],bx);
    if(hit) continue;
    LABELS.push(bx);
    if(pad){ ctx.fillStyle='rgba(7,11,24,0.82)'; ctx.fillRect(lx-3,ly-1,w+6,hh+2); }
    ctx.fillStyle=col; ctx.font=f; ctx.textAlign=al; ctx.textBaseline=bl; ctx.fillText(t,x,y);
    return true;
  }
  const c=cands[0];
  return pad ? labPad(ctx,W,H,c[0],c[1],txt,col,f,c[2],c[3]) : lab(ctx,W,H,c[0],c[1],txt,col,f,c[2],c[3]);
}
/* an axis maximum from PhET's ladders, printed as the ladder value: 3, 0.75, 100, 5.12×10⁻⁵ */
function axisMax(v){ return v>=1e-3 ? String(+v.toPrecision(4)) : sci(v,4).replace(/(\.\d*?)0+×/,'$1×').replace('.×','×'); }
function diamond(ctx,x,y,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
}
function line(ctx,x0,y0,x1,y1,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.strokeStyle=col; ctx.lineWidth=lw||1;
  if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
}
function arrowH(ctx,x,y,dir,len,col){          /* a small horizontal arrow from x toward dir */
  const x1=x+dir*len;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x1,y); ctx.moveTo(x1,y); ctx.lineTo(x1-dir*5,y-4); ctx.moveTo(x1,y); ctx.lineTo(x1-dir*5,y+4);
  ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke();
}
/* tick labels whose decimals follow the tick SPACING (Known-bad: a fixed fmt(t,2) crowds a panel) */
function decFor(step){ return Math.max(0,Math.min(8,-Math.floor(Math.log10(step)+1e-9))); }
function linTicks(lo,hi,want){ const t=ticksFor(lo,hi,want); const step=t.length>1?t[1]-t[0]:Math.abs(hi-lo)||1; return {t,dec:decFor(step)}; }
/* the power axis: plain numbers inside 0.01 … 10⁴, otherwise a common ×10ⁿ in the axis title */
function powerAxis(ymax,want){
  const e=(ymax<0.01||ymax>=1e4)?Math.floor(Math.log10(ymax)):0, sc=Math.pow(10,e);
  const tk=linTicks(0,ymax/sc,want);
  return {e,sc,t:tk.t.map(v=>v*sc),fmt:v=>(v/sc).toFixed(tk.dec)};
}
function starPath(ctx,cx,cy,ro,ri,n){
  ctx.beginPath();
  for(let i=0;i<2*n;i++){ const r=i%2?ri:ro, a=-PI/2+i*PI/n, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.closePath();
}
/* PhET's star: a nine-pointed star (outer 35, inner 20 px) in the photometer colour, behind it a flat
   halo disc of radius 5 + 47.5 r and opacity 0.3 r (PhET's values), all scaled by s */
function drawStarGlyph(ctx,cx,cy,s,ph,halo){
  if(halo[1]>0){ ctx.beginPath(); ctx.arc(cx,cy,halo[0]*s,0,TAU); ctx.fillStyle='rgba('+ph.join(',')+','+fmt(halo[1],3)+')'; ctx.fill(); }
  starPath(ctx,cx,cy,35*s,20*s,9);
  ctx.fillStyle='rgb('+ph.join(',')+')'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1; ctx.stroke();      /* so a cold, black star still shows */
}
/* PhET's photometer: three discs, B G R, each lit by one channel */
function drawBGR(ctx,W,H,xs,y,r,ph){
  const fills=['rgb(0,0,'+ph[2]+')','rgb(0,'+ph[1]+',0)','rgb('+ph[0]+',0,0)'], names=['B','G','R'];
  for(let i=0;i<3;i++){ dot(ctx,xs[i],y,r,fills[i],'rgba(255,255,255,0.28)',1); lab(ctx,W,H,xs[i],y+r+9,names[i],COL.dim,SM_FONT,'center','middle'); }
}

/* ================================================================== *
 *  view: the spectrum — PhET's screen                                 *
 * ================================================================== */
const STAR_SCALE=0.45;                          /* the star beside the thermometer, relative to PhET's size */
function specWarning(S){
  if(!S.peakIn) return 'The peak is at '+um(S.lm,3)+', beyond this axis: zoom the wavelength axis out, or fit the axes.';
  if(S.over) return 'The peak, '+sci(S.Mp,3)+' MW/m²/µm, is above this axis: zoom the power axis out, or fit the axes.';
  if(S.tiny) return 'The curve peaks at '+sci(S.Mp,3)+' MW/m²/µm, under 1 % of this axis: zoom the power axis in, or fit the axes.';
  return '';
}
function specCaption(M,W){
  const S=M.S, T=M.T, xs=axisMax(S.xmax/1000), ys=axisMax(S.ymax);
  let full='Planck’s curve for a blackbody at '+fmt(T,0)+' K (green): spectral power density M_λ = πB_λ against wavelength, both axes linear, '
    +'0–'+xs+' µm by 0–'+ys+' MW/m²/µm; the wavelength axis zooms ×2 a click (0.75–48 µm) and the power axis ×5 (1.024×10⁻⁵–2500). '
    +'The orange diamond is Wien’s peak, λ_max = b/T = '+um(S.lm)+'; the rainbow is the visible band, 380–780 nm.';
  if(M.st.inten) full+=' The green shade is the intensity: its whole area is σT⁴, and '+pct(S.win)+' of it lies inside this window.';
  if(SAVED.length) full+=' Orange: the saved curve'+(SAVED.length>1?'s, the newer solid.':'.');
  if(!isNarrow(W)) full+=' Left: drag the thermometer (it snaps to 50 K); the star wears PhET’s photometer colour, drawn at '+STAR_SCALE+' of PhET’s size.';
  const short='Planck’s curve at '+fmt(T,0)+' K, linear axes 0–'+xs+' µm × 0–'+ys+' MW/m²/µm; orange: Wien’s peak.';
  return [full,short];
}
function specGeo(ctx,W,H,M){
  const S=M.S, narrow=isNarrow(W), col=!narrow;
  const right=narrow?W-26:W-RO_W-44, left=col?232:66;
  const capLeft=col?190:56, capW=Math.max(260,Math.min(W-148,right-capLeft));
  const cap=specCaption(M,W), top=stageTop()+50;
  const fit=fitCaption(ctx,W,H,cap[0],cap[1],capW,top+200);
  const warn=specWarning(S);
  const bottom=fit.capY-16-38-(warn?18:0);
  const g={narrow,col,b:box(left,top,right-left,Math.max(60,bottom-top)),capY:fit.capY,capTxt:fit.txt,capW,capLeft,
           warn,warnY:fit.capY-10,star:null,th:null};
  if(col){
    /* the left column: the star and PhET's photometer at the top, the thermometer below.  Its geometry
       depends only on H — never on the caption — so a drag cannot move the scale under the pointer. */
    const st0=stageTop();
    if(H>=520){ g.star={cx:84,cy:st0+62,s:STAR_SCALE}; g.bgr={xs:[58,84,110],y:st0+132,r:8}; g.tlab={x:84,y:st0+170}; }
    const yTop=(g.star?st0+196:st0+34), bulbR=10, bulbY=H-40, yBot=bulbY-bulbR-2;
    if(!g.star) g.tlab={x:84,y:yTop-18};
    if(yBot-yTop>=120) g.th={x:104,w:12,yTop,yBot,bulbY,bulbR};
  }
  return g;
}
function thermoY(th,T){ return th.yBot-(th.yBot-th.yTop)*(T-T_MIN)/(T_MAX-T_MIN); }
function tempAtY(th,y){ return snapT(T_MIN+(th.yBot-y)/(th.yBot-th.yTop)*(T_MAX-T_MIN)); }
function drawThermo(ctx,W,H,g,T){
  const th=g.th, cx=th.x+th.w/2, fillCol=mix(COL.bg,COL.live,0.55), yT=thermoY(th,T);
  ctx.fillStyle=fillCol; ctx.fillRect(th.x+2,yT,th.w-4,th.bulbY-yT);                     /* the column */
  dot(ctx,cx,th.bulbY,th.bulbR,fillCol,rgba(COL.struct,0.75),1.5);                       /* the bulb */
  ctx.strokeStyle=rgba(COL.struct,0.75); ctx.lineWidth=1.5;
  ctx.strokeRect(th.x,th.yTop-6,th.w,th.yBot-th.yTop+6);                                  /* the tube */
  for(let TT=1000;TT<=T_MAX;TT+=1000){ const y=thermoY(th,TT); line(ctx,th.x,y,th.x+4,y,rgba(COL.struct,0.6),1); }
  for(const p of PRESETS){ const y=thermoY(th,p.T);
    line(ctx,th.x-9,y,th.x,y,COL.struct,1.5);
    lab(ctx,W,H,th.x-12,y,p.name,p.T===T?COL.live:COL.dim,SM_FONT,'right','middle'); }
  const tx=th.x+th.w+2;                                                                     /* the thumb */
  ctx.beginPath(); ctx.moveTo(tx,yT); ctx.lineTo(tx+14,yT-7); ctx.lineTo(tx+14,yT+7); ctx.closePath();
  ctx.fillStyle=COL.live; ctx.fill(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=0.8; ctx.stroke();
}
function drawVisibleBand(ctx,b,xmaxNm){
  const lo=380, hi=Math.min(780,xmaxNm);
  if(!(hi>lo)) return null;
  const pxPerNm=b.w/xmaxNm, step=Math.max(1,Math.ceil(1.5/pxPerNm));
  for(let nm=lo;nm<hi;nm+=step){
    const x0=b.x+nm*pxPerNm, w=Math.min(step,hi-nm)*pxPerNm+0.6, c=nm+Math.min(step,hi-nm)/2;
    const css=cssOfLinear(monoLinear(c),monoLevel(c));
    ctx.fillStyle=mix(COL.bg,css,0.3); ctx.fillRect(x0,b.y,w,b.h);       /* the wash, premixed and opaque */
    ctx.fillStyle=css; ctx.fillRect(x0,b.y1-5,w,5);                       /* the strip on the axis */
  }
  return [b.x+lo*pxPerNm,b.x+hi*pxPerNm];
}
function drawSpec(ctx,W,H,M){
  const S=M.S, st=M.st, g=specGeo(ctx,W,H,M), b=g.b, xmx=S.xmax/1000, ymx=S.ymax;
  const X=x=>b.x+b.w*x/xmx, Y=y=>b.y1-b.h*y/ymx;
  /* the visible band, then the axes over it */
  SPEC_LAST.band=drawVisibleBand(ctx,b,S.xmax);
  const xt=linTicks(0,xmx,g.narrow?4:6), pa=powerAxis(ymx,g.narrow?4:5);
  axesR(ctx,b,0,xmx,0,ymx,{xticks:xt.t,yticks:pa.t.filter(v=>v>0),xfmt:v=>v.toFixed(xt.dec),yfmt:pa.fmt,
    xlab:'wavelength λ, µm   (1 µm = 1000 nm)',ylab:'M_λ, '+(pa.e?'×10'+supNum(pa.e)+' ':'')+'MW/m²/µm'});
  lab(ctx,W,H,b.x,b.y-26,g.narrow?'Planck’s law at '+fmt(M.T,0)+' K':'spectral power density of a blackbody at '+fmt(M.T,0)+' K',
      '#aeb6c6',TITLE_FONT,'left','bottom');
  /* PhET's band labels along the top: ticks at 10 nm, 380 nm, 780 nm and 100 µm; a name only where its band
     is ≥ 20 px (PhET's rule).  Drawn first, so they own the row above the frame. */
  SPEC_LAST.bands=[];
  if(st.labels){
    const edges=[10,380,780,1e5].filter(e=>e<=S.xmax), cuts=[0].concat(edges).concat([S.xmax]);
    for(const e of edges) line(ctx,X(e/1000),b.y,X(e/1000),b.y-7,COL.struct,1.2);
    for(let i=0;i<cuts.length-1;i++){
      const x0=X(cuts[i]/1000), x1=X(Math.min(cuts[i+1],S.xmax)/1000), wpx=x1-x0, bd=BANDS[i];
      if(wpx<20) continue;
      const full=bd.name.length*10.5*0.52+8<wpx, nm=full?bd.name:bd.short;
      if(nm.length*10.5*0.52+4<wpx&&lab(ctx,W,H,(x0+x1)/2,b.y-5,nm,COL.struct,SM_FONT,'center','bottom')) SPEC_LAST.bands.push(bd.id);
    }
  }
  /* the intensity: the area under the curve, clamped at the top of the axis */
  if(st.inten){
    ctx.beginPath(); ctx.moveTo(X(0),Y(0));
    for(let i=0;i<S.c.xs.length;i++) ctx.lineTo(X(S.c.xs[i]),Y(Math.min(S.c.ys[i],ymx)));
    ctx.lineTo(X(xmx),Y(0)); ctx.closePath(); ctx.fillStyle=rgba(COL.pos,0.2); ctx.fill();
  }
  /* the saved curves (older dashed), then the live one */
  for(const c of S.saved) polyline(ctx,b,c.c.xs,c.c.ys,0,xmx,0,ymx,COL.ref,1.8,c.newest?null:[7,5]);
  polyline(ctx,b,S.c.xs,S.c.ys,0,xmx,0,ymx,COL.pos,2.4);
  SPEC_LAST.curveTop=Math.min.apply(null,S.c.ys.map((v,i)=>S.c.xs[i]<=xmx?Y(Math.min(v,ymx)):b.y1));
  /* Graph Values: the magenta point on the curve, dashed to both axes; hidden past either axis, as PhET's.
     Drawn before the labels, which avoid its dashed lines (GVSEG) as well as the curves. */
  SPEC_LAST.gv=null; const GVSEG=[]; let gvLab=null;
  if(S.gv.on&&S.gv.inside){
    const gx=X(S.gv.nm/1000), gy=S.gv.above?b.y:Y(S.gv.M);
    line(ctx,gx,b.y1,gx,gy,COL.live,1.2,[4,4]); GVSEG.push(gx,b.y1,gx,gy);
    if(!S.gv.above){
      line(ctx,b.x,gy,gx,gy,COL.live,1.2,[4,4]); GVSEG.push(b.x,gy,gx,gy);
      if(S.gv.cue){ arrowH(ctx,gx+9,gy,1,15,COL.live); arrowH(ctx,gx-9,gy,-1,15,COL.live); }
      dot(ctx,gx,gy,5,COL.live,'#ffffff',1.2);
      SPEC_LAST.gv=[gx,gy];
    }
    const right=gx>b.x+b.w*0.62, al=right?'right':'left', dx=right?-12:12;
    gvLab={txt:um(S.gv.nm)+', '+sci(S.gv.M,3)+' MW/m²/µm',
           cands:S.gv.above?[[gx+dx,b.y+8,al,'top'],[gx+dx,b.y+26,al,'top']]:[[gx+dx,gy-14,al,'bottom'],[gx+dx,gy+12,al,'top'],[gx+dx,gy-30,al,'bottom']]};
    labAvoid(ctx,W,H,gvLab.cands,gvLab.txt,COL.live,SM_FONT,true);
  }
  /* Wien's peak; off the top, it is marked on the frame and labelled just inside it */
  SPEC_LAST.peak=null;
  if(S.peakIn){
    const px=X(S.lm/1000), py=S.over?b.y:Y(S.Mp), txt='λ_max = '+um(S.lm)+(S.over?'  (peak above the axis)':'');
    diamond(ctx,px,py,5,COL.ref,'#ffffff');
    labAvoid(ctx,W,H,S.over?[[px+9,b.y+8,'left','top'],[px-9,b.y+8,'right','top'],[px+9,b.y+26,'left','top']]
                           :[[px+9,py-10,'left','bottom'],[px-9,py-10,'right','bottom'],[px+10,py+8,'left','top'],[px+12,py-28,'left','bottom']],
             txt,COL.ref,SM_FONT,true,GVSEG);
    SPEC_LAST.peak=[px,py];
  }
  /* the saved curves' temperatures: at the peak, where the curve enters the top, or at the right edge */
  for(const c of S.saved){
    const txt=fmt(c.T,0)+' K'; let cands;
    if(c.lm<=S.xmax&&c.Mp<=ymx){ const px=X(c.lm/1000), py=Y(c.Mp); cands=[[px+8,py-6,'left','bottom'],[px-8,py-6,'right','bottom'],[px+8,py+6,'left','top']]; }
    else {
      const k=c.c.ys.findIndex(v=>v>ymx);
      if(k>0){ const px=X(c.c.xs[k]); cands=[[px+8,b.y+8,'left','top'],[px-8,b.y+8,'right','top'],[px+8,b.y+26,'left','top']]; }
      else { const py=Math.min(b.y1-10,Y(c.c.ys[c.c.ys.length-1])); cands=[[b.x1-6,py-6,'right','bottom'],[b.x1-6,py+6,'right','top']]; }
    }
    labAvoid(ctx,W,H,cands,txt,COL.ref,SM_FONT,true,GVSEG);
  }
  /* the intensity's label, inside the shaded area on the curve's right flank */
  if(st.inten){
    const hgt=Math.min(S.Mp,ymx), yy=v=>Math.min(b.y1-14,Y(v)), xx=v=>X(Math.min(v,0.8*S.xmax)/1000);
    const cands=S.peakIn?[[xx(2.2*S.lm),yy(0.25*hgt),'center','middle'],[xx(1.6*S.lm),yy(0.15*hgt),'center','middle'],[xx(3*S.lm),yy(0.1*hgt),'center','middle']]
                        :[[b.x+b.w*0.5,yy(0.2*Math.min(S.c.ys[S.c.ys.length-1],ymx)),'center','middle']];
    cands.push([b.x+b.w*0.5,b.y1-14,'center','middle']);
    labAvoid(ctx,W,H,cands,'area σT⁴ = '+sci(S.I,3)+' W/m²',COL.pos,SM_FONT,true,GVSEG);
  }
  if(g.warn) lab(ctx,W,H,g.capLeft,g.warnY-6,g.warn,COL.ref,SM_FONT,'left','bottom');
  caption(ctx,g.capLeft,g.capY,g.capTxt,g.capW,'#767e92',CAP_FONT);
  /* the left column */
  if(g.star){ drawStarGlyph(ctx,g.star.cx,g.star.cy,g.star.s,S.ph,S.halo); drawBGR(ctx,W,H,g.bgr.xs,g.bgr.y,g.bgr.r,S.ph); }
  if(g.col) lab(ctx,W,H,g.tlab.x,g.tlab.y,fmt(M.T,0)+' K',COL.live,'600 13px -apple-system, sans-serif','center','middle');
  if(g.th) drawThermo(ctx,W,H,g,M.T);
  SPEC_LAST.g=g;
}
/* what the last spectrum drawing put where — read by selfTest, never by the drawing itself */
const SPEC_LAST={};

/* ---- two panels side by side (one, the primary, on a narrow stage) ----------------------------- */
function twoPanels(ctx,W,H,capFull,capShort,frac){
  const narrow=isNarrow(W), left=66, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-56));
  const top=stageTop()+46;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+180);
  const hgt=Math.max(60,fit.capY-16-40-top);
  const out={narrow,capY:fit.capY,capTxt:fit.txt,capW,left:56};
  if(narrow){ out.b1=box(left,top,right-left,hgt); out.b2=null; }
  else { const gap=92, w1=Math.round((right-left-gap)*frac); out.b1=box(left,top,w1,hgt); out.b2=box(left+w1+gap,top,right-left-gap-w1,hgt); }
  return out;
}
function drawCap(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function panelTitle(ctx,W,H,b,longT,shortT){ lab(ctx,W,H,b.x,b.y-9,titleFor(b,longT,shortT),'#aeb6c6',TITLE_FONT,'left','bottom'); }
/* decade ticks on a log10 axis, labelled as plain numbers or as powers of ten */
function decTicks(lo,hi,maxN){
  const out=[]; let step=1; const n=Math.floor(hi)-Math.ceil(lo)+1;
  if(n>maxN) step=Math.ceil(n/maxN);
  for(let e=Math.ceil(lo);e<=Math.floor(hi);e+=step) out.push(e);
  return out;
}
function plainPow(e){ return e>=0?String(Math.round(Math.pow(10,e))):Math.pow(10,e).toFixed(-e); }
function supPow(e){ return '10'+supNum(e); }
const CH_COL=['#ff6b6b','#6bdc6b','#6b9bff'];                  /* the red, green and blue channels */

/* ================================================================== *
 *  view: the star — PhET's photometer against CIE colorimetry         *
 * ================================================================== */
function starCaption(M,small){
  const C=M.C;
  const full='Left, PhET’s star at PhET’s size: its colour is the curve sampled at 650, 550 and 450 nm (the R, G and B discs), '
    +'each divided by the largest of the three and dimmed by min(1, 0.02√(T − 798 K)) — dark below the Draper point, full from 3298 K. '
    +'Right, the colour the CIE 1931 standard observer assigns the same spectrum: X, Y, Z = ∫M_λ(x̄, ȳ, z̄)dλ over the CIE’s own table, '
    +'clipped into the sRGB gamut, its brightness log-compressed (display only). The strips run the whole thermometer, 200–11000 K, both ways; '
    +'below them, the three channels against temperature (solid PhET, dashed CIE, each normalised to its brightest channel above 3298 K).';
  const shortT='PhET’s photometer star (left) against CIE 1931 colorimetry (right); the strips span 200–11000 K.';
  return [small?shortT:full,shortT];
}
function starGeo(ctx,W,H,M){
  const narrow=isNarrow(W), left=66, right=narrow?W-26:W-RO_W-44, small=narrow||H<600;
  const cap=starCaption(M,small), capW=Math.max(260,Math.min(W-148,right-56));
  const fit=fitCaption(ctx,W,H,cap[0],cap[1],capW,stageTop()+260);
  const top=stageTop()+40, s=small?0.55:(H<760?0.8:1), glyphH=small?128:Math.round(236*s);
  const g={narrow,small,left,right,top,s,capY:fit.capY,capTxt:fit.txt,capW,
           gy:top+glyphH/2+(small?4:10), phX:left+(right-left)*(small?0.40:0.40), cieX:left+(right-left)*0.80};
  const sh=small?13:18, y0=top+glyphH+30;
  g.strips={x:left,w:right-left,h:sh,y1:y0,y2:y0+sh+24};
  const pTop=g.strips.y2+sh+60, pBot=fit.capY-16-40;
  g.plot=(!small&&pBot-pTop>=110)?box(left,pTop,right-left,pBot-pTop):null;
  return g;
}
function stripX(g,T){ const n=(T_MAX-T_MIN)/T_SNAP+1; return g.strips.x+g.strips.w*((T-T_MIN)/T_SNAP+0.5)/n; }
function drawStrip(ctx,x0,y0,w,h,css){
  const n=css.length, cw=w/n;
  for(let i=0;i<n;i++){ ctx.fillStyle=css[i]; ctx.fillRect(x0+i*cw,y0,cw+0.6,h); }
  ctx.strokeStyle=COL.edge; ctx.lineWidth=1; ctx.strokeRect(x0,y0,w,h);
}
/* the CIE colour as a disc (radius 35 px, like PhET's star) behind a flat halo in the same style as PhET's:
   radius (35 + 60 L) px, opacity 0.3 L, L the log-compressed luminance (display only) */
function drawCieGlow(ctx,cx,cy,s,lin,level){
  if(level>0){ ctx.beginPath(); ctx.arc(cx,cy,(35+60*level)*s,0,TAU);
    ctx.fillStyle='rgba('+toRgb(cssOfLinear(lin,1)).join(',')+','+fmt(0.3*level,3)+')'; ctx.fill(); }
  dot(ctx,cx,cy,35*s,cssOfLinear(lin,level),'rgba(255,255,255,0.28)',1);
}
function drawStar(ctx,W,H,M){
  const C=M.C, g=starGeo(ctx,W,H,M), s=g.s, T=M.T, Sx=C.strips;
  /* the two glyphs */

  lab(ctx,W,H,cx0,g.top-6,(g.small||cx0+cieT.length*13*0.52>g.right)?'CIE 1931':cieT,'#aeb6c6',TITLE_FONT,'left','bottom');
  drawStarGlyph(ctx,g.phX,g.gy,s,C.ph,C.halo);
  drawBGR(ctx,W,H,[g.phX-200*s,g.phX-150*s,g.phX-100*s],g.gy,15*s,C.ph);
  drawCieGlow(ctx,g.cieX,g.gy,s,bbLinear(T),C.glow);
  const yl=g.gy+(g.small?60:112*s);
  lab(ctx,W,H,g.phX-100*s,yl,'R G B = '+C.ph.join(' ')+'   '+hexOfBytes(C.ph),COL.dim,SM_FONT,'center','middle');
  lab(ctx,W,H,g.cieX,yl,'x '+fmt(C.xy[0],4)+', y '+fmt(C.xy[1],4)+'   '+C.hex,COL.pos,SM_FONT,'center','middle');
  /* the strips over the whole thermometer */
  const st=g.strips;
  lab(ctx,W,H,st.x,st.y1-5,'PhET’s photometer',COL.dim,SM_FONT,'left','bottom');
  drawStrip(ctx,st.x,st.y1,st.w,st.h,Sx.phCss);
  lab(ctx,W,H,st.x,st.y2-5,'CIE 1931 (brightness log-compressed)',COL.dim,SM_FONT,'left','bottom');

  const xd=stripX(g,PH_DRAPER), xT=stripX(g,T);
  line(ctx,xd,st.y1-3,xd,st.y2+st.h+3,COL.ref,1.2,[3,3]);
  line(ctx,xT,st.y1-3,xT,st.y2+st.h+3,COL.live,1.6);
  ctx.beginPath(); ctx.moveTo(xT,st.y1-2); ctx.lineTo(xT-6,st.y1-11); ctx.lineTo(xT+6,st.y1-11); ctx.closePath(); ctx.fillStyle=COL.live; ctx.fill();
  for(const TT of [2000,4000,6000,8000,10000]){ const x=stripX(g,TT); line(ctx,x,st.y2+st.h,x,st.y2+st.h+4,COL.dim,1);
    lab(ctx,W,H,x,st.y2+st.h+12,TT+' K',COL.dim,SM_FONT,'center','middle'); }
  lab(ctx,W,H,xd+4,st.y2+st.h+12,'798 K, the Draper point',COL.ref,SM_FONT,'left','middle');
  /* the channels against temperature */
  if(g.plot){
    const b=g.plot, xs=Sx.Ts.map(v=>v/1000);
    axesR(ctx,b,T_MIN/1000,T_MAX/1000,0,255,{nx:8,ny:5,xfmt:v=>fmt(v,0),yfmt:v=>fmt(v,0),xlab:'temperature, 1000 K',ylab:'channel, 0–255'});
    panelTitle(ctx,W,H,b,'the three channels: PhET’s photometer (solid) and CIE 1931 (dashed)','the channels, PhET solid, CIE dashed');
    for(let c=0;c<3;c++){
      polyline(ctx,b,xs,Sx.ph.map(p=>p[c]),T_MIN/1000,T_MAX/1000,0,255,CH_COL[c],1.8);
      polyline(ctx,b,xs,Sx.cie.map(p=>p[c]),T_MIN/1000,T_MAX/1000,0,255,CH_COL[c],1.2,[6,4]);
    }
    const X=v=>b.x+b.w*(v-T_MIN/1000)/((T_MAX-T_MIN)/1000);
    line(ctx,X(PH_DRAPER/1000),b.y,X(PH_DRAPER/1000),b.y1,COL.ref,1,[3,3]);
    line(ctx,X((PH_DRAPER+2500)/1000),b.y,X((PH_DRAPER+2500)/1000),b.y1,COL.ref,1,[3,3]);
    lab(ctx,W,H,X((PH_DRAPER+2500)/1000)+5,b.y1-12,'3298 K: PhET’s ramp is full',COL.ref,SM_FONT,'left','middle');
    line(ctx,X(T/1000),b.y,X(T/1000),b.y1,COL.live,1.4);

  }
