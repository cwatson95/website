<title>Projectile sampling distributions &mdash; one launcher, many samples, and why the mean of n is narrower by &radic;n</title>
<!--
  ===================================================================
  projectile-sampling-distributions.html — Remake of PhET Interactive
  Simulations' Projectile Sampling Distributions (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.
  ===================================================================

  PhET's Projectile Sampling Distributions is one screen — the
  Sampling screen of Projectile Data Lab, on its own — so this file
  runs the SAME engine as projectile-data-lab.html, trimmed to that
  screen's launchers and controls: six mystery launchers at a fixed
  30° with cannonballs only, sample sizes 2, 5, 15 and 40, bin widths
  0.5, 1, 2 and 5 m (PhET's PSD list, which drops the data lab's 10 m
  and defaults to 0.5 rather than 1), no total-bins strategy, and at
  most 200 samples a field.

  Four views.  THE FIELD is PhET's screen: fire a sample of n and its
  MEAN — one number — joins the histogram below.  THE FOUR SAMPLE
  SIZES is PhET's thumbnail row at full size, all four distributions
  on one axis so the narrowing is a picture.  ONE LAUNCH is the
  parent the samples are drawn from, against the exact density that
  PhET's mechanism implies, because a standard error means nothing
  without the σ it divides.  THE LIMIT THEOREM measures the standard
  error against σ/√n with the error bar it is entitled to.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * σ/√n is exact for every n and every parent, and it is not the
    central limit theorem: var(x̄) = σ²/n follows from independence
    alone.  The theorem is the further claim about SHAPE, and this
    file separates the two — the widths are asserted at n = 2, where
    no theorem applies, and the skewness is asserted to fall as 1/√n.
  * The parent σ comes from the exact law, not from the data: for
    mystery launcher 1 it is 3.18105 m, and the four standard errors
    are then 2.24934, 1.42261, 0.82134 and 0.50297 m.
  * Over 2000 samples the measured standard errors sit inside their
    own sampling spread σ_n√((κ_n+2)/4M) at all four sizes — the
    tolerance is computed from the parent's kurtosis, not chosen.

  WHAT IS EXACT
  -------------
  * The trajectory: PhET's closed form for the range, checked in
    derive.py against v² sin2θ/g and against an independent route.
  * The random stream: mulberry32 seeded per field, Box-Muller with
    one pair of uniforms per value, bit-identical to derive.py, so
    the page and the Python twin generate the SAME sample means, and
    the page's means, standard deviations (ddof 1 and 0), medians and
    every histogram bin count are pinned against numpy's on them.
  * The parent distribution: PhET re-draws the angle while it falls
    outside (0°, 90°) and the speed while it is ≤ 0, so both are
    truncated normals; the moments come from a 96×96 Gauss-Legendre
    product rule over the truncated z-ranges, checked in derive.py
    against scipy's adaptive quadrature (1e-15) and a 6e6-draw Monte
    Carlo of the actual re-draw mechanism.
  * The statistics are PhET's: bins are floor(x/w)·w, the standard
    deviation divides by n − 1 and is null below two values, the
    standard error is s/√n.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * No air resistance, g = 9.81 m/s², a 100 m field, the launcher
    fixed at 30° with a cannonball, and PhET's launcher table:
    spring 23 ± 0.5 m/s, pressure 24 ± 0.2, explosion 25 ± 1.2, with
    angle spreads 2.6°, 5°, 0.2°, 1.4°, 0.2° and 5°.
  * A sample is paced by PhET's own totalSampleTime — 0.75 s at n = 2,
    2 s at 5, 5 s at 15 and 9 s at 40 — with the n launches spread
    evenly over it and their flights overlapping, so a bigger sample
    fires faster per shot, not slower.  Continuous sampling starts the
    next as soon as the last lands, and stops at PhET's 200.

  WHAT IS NOT MODELLED
  --------------------
  * Drag, spin, wind, the projectile's size.  PhET's sound, its
    keyboard help and its PhET-iO instrumentation are absent, and so
    are the orientation, projectile-type and custom-launcher controls,
    which belong to the data lab's other three screens.

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * The histogram's vertical scale opens on an AUTO rung rather than
    on PhET's default.  PhET's ladder starts at 25 samples because its
    fields hold 200; at the two dozen samples the screen opens with,
    its tightest rung still leaves the histogram a sliver along the
    bottom of an empty panel, and a default that hides the data is a
    defect rather than a preference.  Auto picks the tightest ceiling
    that holds the tallest bin, on a finer ladder (4, 6, 8, 10, 15, 20)
    below PhET's own; every rung PhET offers is still there by hand.
  * The field opens with samples already in it, and the barrel can be
    dragged up and down to change launcher (PhET uses radio buttons,
    which are here too).  The two analysis views are new.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from
  docs/phets/projectile-sampling-distributions_en.html (g = 9.81, the
  100 m field, the 0.2–5° angle spreads, the three mechanisms, the
  six mystery launchers, the sample sizes, the bin widths, the zoom
  ladder to 250 and the 200-sample ceiling) and cited as PhET's
  values.  Everything else is derived and pinned in selfTest to
  build/projectile-sampling-distributions/derive.py, whose printed
  output is refvals.txt.
-->

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],

  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;

}

function axes(ctx,b,xlo,xhi,ylo,yhi,opt){

  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }

}

let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);
  });

/* pick the first corner of panel b that no already-recorded curve segment

   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    /* a corner clear of the CURVES can still be full of their LABELS: the bar
       chart's value labels sit where no bar is, which is exactly where this
       used to put the legend.  A legend is a label like any other. */
    for(let i=0;i<LABELS.length&&!hit;i++){
      const L=LABELS[i];
      if(L[2]<=cx||L[0]>=cx+bw||L[3]<=cy||L[1]>=cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }

     caption names the colours */
  return null;
}

function stageTop(){ return 46; }

/* ================================================================== *
 *  the engine: PhET's constants, its launch mechanism, the exact      *
 *  distribution of the landing distance, and the statistics.  This is *
 *  the data lab remake's engine, trimmed by build/projectile-         *
 *  sampling-distributions/make_engine.py to the Sampling screen's own *
 *  controls — PhET ships one bundle for both sims and branches on the *
 *  sim name for exactly these values.  Read from the minified         *
 *  original docs/phets/projectile-sampling-distributions_en.html and  *
 *  cited as PhET's; everything derived is pinned in selfTest.         *
 * ================================================================== */
const PDL={
  G:9.81,                 /* PDLConstants.FREEFALL_ACCELERATION      */
  FIELD:100,              /* PDLConstants.MAX_FIELD_DISTANCE, metres */
  RAISED_H:12,            /* PDLConstants.RAISED_LAUNCHER_HEIGHT     */
  ANG_SD:[0.2,5],         /* ANGLE_STANDARD_DEVIATION_RANGE, degrees */
  LAUNCH_GAP:0.7,         /* MINIMUM_TIME_BETWEEN_LAUNCHES, seconds  */
  MAX_PROJ:500,           /* MAX_PROJECTILES_VSM_FIELD_DEFAULT       */
  MAX_SAMPLES:200,        /* the maxSamples query parameter          */
  SAMPLE_TIME:{2:0.75,5:2,15:5,40:9}, /* SamplingField.totalSampleTime */
  N_FIELDS:6,             /* six fields on the VSM screens           */
  SIZES:[2,5,15,40],      /* the Sampling screen's sample sizes      */
  BINW:[0.5,1,2,5],       /* selectedBinWidthProperty validValues     */
  BINW_DEF:0.5,           /* PSD defaults to 0.5 m; the data lab to 1 */
  ZOOM_MAX:[250,200,150,100,75,50,25], /* the samples-per-bin ladder  */
  SPEED_MEAN_MIN:20,      /* the speed-mean range floor (data lab: 15)*/
  ZCAP:12,                /* beyond 12 sd a normal density is <1e-32 */
  TIME_SPEED_FAST:6,      /* PDLConstants.TIME_SPEED_FAST            */
  NGL:96,                 /* Gauss-Legendre nodes (derive.py's rule) */
  /* panels for the density's theta integral.  The MOMENTS are a product rule
     over a smooth integrand and one panel is exact to 1e-15, but the density
     at a FIXED r is not: only the angles whose v*(r,theta) lands within a few
     sd of the mean speed contribute, so a small speed spread beside a large
     angle spread makes the integrand a narrow spike that one 96-node rule
     rings around (29 % on mystery launcher 2, 292 % raised).  Eight panels
     take every case tested to 0.000 % against a 64-panel reference, and
     selfTest asserts that convergence rather than assuming it. */
  NPANEL:8

/* LauncherMechanism(tandem, speedMean, speedStandardDeviation) */
const MECH={spring:{id:'spring',name:'spring',mean:23,sd:0.5},
            pressure:{id:'pressure',name:'pressure',mean:24,sd:0.2},
            explosion:{id:'explosion',name:'explosion',mean:25,sd:1.2},
            custom:{id:'custom',name:'custom',mean:24,sd:0.5}};
const MECH_LIST=[MECH.spring,MECH.pressure,MECH.explosion];

const PTYPES=[{id:'cannonball',name:'cannonball',mult:1}];

   built with validValues:['angle30']), so its table has one row.  The engine
   below still carries the general launch height h, because the closed forms
   are the general ones and selfTest exercises them. */
const ORIENTS=[{id:'angle30',name:'30°',ang:30,h:0}];

                 {n:3,mech:'explosion',sdAng:PDL.ANG_SD[0]},{n:4,mech:'spring',sdAng:ANG_Q},
                 {n:5,mech:'pressure',sdAng:PDL.ANG_SD[0]},{n:6,mech:'explosion',sdAng:PDL.ANG_SD[1]}];

/* ---- the random stream: mulberry32 + Box-Muller (bit-exact twin in
   derive.py).  One pair of uniforms per normal, never cached: a draw count
   that does not depend on history is what keeps the stream reproducible. */
function pdlRng(seed){
  let a=seed>>>0;
  const R={
    next(){
      a=(a+0x6D2B79F5)>>>0;
      let t=Math.imul(a^(a>>>15),a|1);
      t=((t+Math.imul(t^(t>>>7),t|61))>>>0)^t;
      return ((t^(t>>>14))>>>0)/4294967296;
    },
    gauss(){ const u1=1-R.next(), u2=R.next(); return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2); }
  };
  return R;
}

/* ---- the trajectory --------------------------------------------------------
   y(t) = h + v sinθ t − g t²/2 = 0  ⇒  t = [v s + √(v²s² + 2gh)]/g,
   x(t) = v cosθ t  ⇒  R = (v cosθ/g)(v s + √(v²s² + 2gh)).  PhET's two
   closed forms; derive.py re-derives them and checks both against the root
   of y(t) = 0 and against a marched trajectory. */
function pdlRange(v,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th);
  return v*Math.cos(th)/PDL.G*(v*s+Math.sqrt(v*v*s*s+2*PDL.G*h));

/* the same range, multiplied through by the conjugate.  For a DOWNWARD launch
   (sin θ < 0) PhET's form adds two nearly equal numbers of opposite sign and
   loses digits — at v = 10⁶ m/s from 12 m it loses the answer entirely —
   whereas 2gh/(√(v²s²+2gh) − v s) is a quotient of positives and cannot.
   The two agree to 1e-15 over everything the sliders reach; PhET's form is the
   one the sim and derive.py evaluate, so that the bit-level pins hold. */
function pdlRangeStable(v,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th), Q=Math.sqrt(v*v*s*s+2*PDL.G*h);
  if(h===0) return s<=0?0:v*Math.cos(th)/PDL.G*2*v*s;
  return v*Math.cos(th)/PDL.G*(2*PDL.G*h)/(Q-v*s);

function pdlDRdv(v,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
  const Q=Math.sqrt(v*v*s*s+2*PDL.G*h);

function pdlMaxAngle(v,h){ return 0.5*Math.acos(PDL.G*h/(v*v+PDL.G*h))*180/Math.PI; }
/* the speed that lands at r from angle θ.  R(v) rises monotonically but from
   a height a DOWNWARD launch saturates: as v grows the path straightens and
   the range tends to h/tan|θ|, so beyond that no speed reaches r and the
   answer is null rather than a Newton step that divides by nothing. */
function pdlVStar(r,thDeg,h){
  const th=thDeg*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
  if(!(c>1e-9)||!(r>0)) return null;
  if(h===0) return s<=0?null:Math.sqrt(r*PDL.G/Math.sin(2*th));
  if(s<0&&r>=h*c/(-s)) return null;
  let v=s>1e-4?Math.sqrt(r*PDL.G/Math.sin(2*th)):r*Math.sqrt(PDL.G/(2*h))/c;
  for(let i=0;i<120;i++){
    const d=pdlDRdv(v,thDeg,h);
    if(!(d>1e-12)) return null;
    const step=(pdlRange(v,thDeg,h)-r)/d;
    v=Math.max(1e-9,v-step);
    if(Math.abs(step)<1e-15*Math.max(1,v)) break;
  }
  return Math.abs(pdlRange(v,thDeg,h)-r)<1e-9*Math.max(1,r)?v:null;

/* PhET's angle stabiliser (standardDeviationAngle = linear(1, 0, sdMin,
   sdMax, stability)) belongs to the Sources screen and is NOT here: the
   Sampling screen's six launchers carry their angle spreads directly. */

/* ---- one launch, exactly PhET's createProjectile ---------------------------
   the angle first (re-drawn up to 100 times while it is outside (0°, 90°),
   and not re-drawn at all on the raised launcher, which PhET exempts), then
   the speed (re-drawn while it is ≤ 0).  Both are therefore truncated
   normals; section 4 of derive.py measures how much that truncation moves
   the answer (5.5e-8 m at worst). */
function pdlDraw(rng,cfg){

  if(!cfg.raised){ let k=0; while(k<100&&(a<=0||a>=90)){ a=cfg.meanAng+rng.gauss()*cfg.sdAng; k++; } }
  const mu=cfg.meanSpeed*cfg.mult;

function pdlConfig(mechId,sdAng,orientId,typeId,speedMean,speedSd){
  const M=MECH[mechId], O=ORIENTS.find(o=>o.id===orientId)||ORIENTS[0];

/* ================================================================== *
 *  the exact distribution                                             *
 * ================================================================== */
/* Gauss-Legendre nodes and weights on [-1,1] by Newton on P_n (the standard
   three-term recurrence).  Computed here rather than pasted: selfTest asserts
   them against numpy's leggauss(96), which is a stronger check than a table
   of literals could be. */
function pdlGauleg(n,seed){
  const sd=seed===undefined?0.75:seed;
  const x=new Array(n), w=new Array(n), m=(n+1)>>1;
  for(let i=0;i<m;i++){
    let z=Math.cos(Math.PI*(i+sd)/(n+0.5)), pp=1, z1;
    for(let it=0;it<100;it++){

      for(let j=0;j<n;j++){ const p3=p2; p2=p1; p1=((2*j+1)*z*p2-j*p3)/(j+1); }
      pp=n*(z*p1-p2)/(z*z-1);
      z1=z; z=z1-p1/pp;
      if(Math.abs(z-z1)<=1e-16) break;
    }

    w[i]=2/((1-z*z)*pp*pp); w[n-1-i]=w[i];

const GL=pdlGauleg(PDL.NGL);
const NORM=1/Math.sqrt(2*Math.PI);
function pdlPhi(z){ return NORM*Math.exp(-0.5*z*z); }

function pdlZRule(a,b){
  const n=PDL.NGL, z=new Array(n), w=new Array(n);
  for(let i=0;i<n;i++){ z[i]=0.5*(b-a)*GL.x[i]+0.5*(a+b); w[i]=0.5*(b-a)*GL.w[i]*pdlPhi(z[i]); }
  return {z,w};

/* the z-interval of N(mu, sd) truncated to (lo, hi), capped at 12 sd */
function pdlZRange(mu,sd,lo,hi){
  return [lo===null?-PDL.ZCAP:Math.max(-PDL.ZCAP,(lo-mu)/sd),
          hi===null? PDL.ZCAP:Math.min( PDL.ZCAP,(hi-mu)/sd)];

/* the moments of the landing distance, over the SAME 96×96 product rule
   derive.py uses.  TWO passes: the mean first, then the central moments about
   it.  Assembling mu3 from the raw moments cancels five to seven digits
   (m3 ~ 2e5 against mu3 ~ 0.02) and the two languages round that cancellation
   differently — with the second pass they agree to 1e-15, and selfTest pins
   the difference between the two forms so the shortcut cannot come back. */
function pdlMomentGrid(cfg){
  const mu=cfg.meanSpeed*cfg.mult, sv=cfg.sdSpeed;
  const rv=pdlZRule.apply(null,pdlZRange(mu,sv,0,null));
  const rt=cfg.raised?pdlZRule(-PDL.ZCAP,PDL.ZCAP):pdlZRule.apply(null,pdlZRange(cfg.meanAng,cfg.sdAng,0,90));
  let wsum=0;
  for(let i=0;i<PDL.NGL;i++) for(let j=0;j<PDL.NGL;j++) wsum+=rv.w[i]*rt.w[j];
  const R=new Array(PDL.NGL*PDL.NGL), P=new Array(PDL.NGL*PDL.NGL);
  for(let j=0;j<PDL.NGL;j++){
    const th=(cfg.meanAng+cfg.sdAng*rt.z[j])*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
    for(let i=0;i<PDL.NGL;i++){

      R[k]=v*c/PDL.G*(v*s+Math.sqrt(v*v*s*s+2*PDL.G*cfg.h));
      P[k]=rv.w[i]*rt.w[j]/wsum;

}
function pdlMoments(cfg){
  const {R,P}=pdlMomentGrid(cfg), N=R.length;

  for(let k=0;k<N;k++){ let q=R[k]; m[0]+=P[k]*q; q*=R[k]; m[1]+=P[k]*q; q*=R[k]; m[2]+=P[k]*q; q*=R[k]; m[3]+=P[k]*q; }
  const mean=m[0];
  let c2=0,c3=0,c4=0;
  for(let k=0;k<N;k++){ const d=R[k]-mean, d2=d*d; c2+=P[k]*d2; c3+=P[k]*d2*d; c4+=P[k]*d2*d2; }
  return {m1:m[0],m2:m[1],m3:m[2],m4:m[3],mean,varr:c2,sd:Math.sqrt(c2),mu3:c3,mu4:c4};

/* the same central moments assembled from the RAW ones — kept only so

function pdlMomentsRaw(cfg){
  const M=pdlMoments(cfg), m1=M.m1;

          mu4:M.m4-4*m1*M.m3+6*m1*m1*M.m2-3*Math.pow(m1,4)};
}
/* memoised on the configuration: the readout, the captions and the drawing
   all ask for the same moments many times a frame, and the rule is 9216

const EXACT_CACHE={};
function pdlCfgKey(cfg){
  return [cfg.meanSpeed,cfg.sdSpeed,cfg.mult,cfg.meanAng,cfg.sdAng,cfg.h,cfg.raised?1:0].join('/');
}
function pdlExact(cfg){

/* the UNtruncated model in closed form, h = 0 only: R = v² sin2θ/g, and both
   E[v^2k] and E[sin^k 2θ] are exact for a normal —
   E[e^{iaθ}] = e^{iam − a²w²/2} gives every sine moment. */
function pdlClosed(mu,s,mDeg,wDeg){
  const m=mDeg*Math.PI/180, w=wDeg*Math.PI/180, g=PDL.G;
  const C=a=>Math.cos(a*m)*Math.exp(-0.5*a*a*w*w);
  const S=a=>Math.sin(a*m)*Math.exp(-0.5*a*a*w*w);
  const v2=mu*mu+s*s;
  const v4=Math.pow(mu,4)+6*mu*mu*s*s+3*Math.pow(s,4);
  const v6=Math.pow(mu,6)+15*Math.pow(mu,4)*s*s+45*mu*mu*Math.pow(s,4)+15*Math.pow(s,6);
  const v8=Math.pow(mu,8)+28*Math.pow(mu,6)*s*s+210*Math.pow(mu,4)*Math.pow(s,4)
          +420*mu*mu*Math.pow(s,6)+105*Math.pow(s,8);
  const s1=S(2), s2=0.5*(1-C(4)), s3=0.25*(3*S(2)-S(6)), s4=0.125*(3-4*C(4)+C(8));
  return [v2*s1/g, v4*s2/(g*g), v6*s3/(g*g*g), v8*s4/Math.pow(g,4)];

/* PhET's own spread estimate — SampleSizeThumbnailNode.calculateRangeStdDev,
   which is the first-order (delta-method) propagation through v² sin2θ/g and
   is what sets the Sampling thumbnails' x-range. */
function pdlDeltaSd(v,sdv,thDeg,sdthDeg){
  const s=thDeg*Math.PI/180, r=sdthDeg*Math.PI/180;
  const a=2*v/PDL.G*Math.sin(2*s), b=2*v*v/PDL.G*Math.cos(2*s);
  return Math.sqrt(a*a*sdv*sdv+b*b*r*r);

/* the exact density: f(r) = ∫ f_θ(θ) f_v(v*(r,θ))/|∂R/∂v| dθ over the
   accepted angles, on the same rule */
function pdlPdf(r,cfg,panels){
  const K=panels||PDL.NPANEL;
  const mu=cfg.meanSpeed*cfg.mult, sv=cfg.sdSpeed;
  const zr=cfg.raised?[-PDL.ZCAP,PDL.ZCAP]:pdlZRange(cfg.meanAng,cfg.sdAng,0,90);
  const rv=pdlZRule.apply(null,pdlZRange(mu,sv,0,null));
  let vw=0;
  for(let i=0;i<PDL.NGL;i++) vw+=rv.w[i];
  let tot=0, tw=0;
  for(let k=0;k<K;k++){
    const a=zr[0]+(zr[1]-zr[0])*k/K, b=zr[0]+(zr[1]-zr[0])*(k+1)/K;
    for(let j=0;j<PDL.NGL;j++){
      const z=0.5*(b-a)*GL.x[j]+0.5*(a+b), w=0.5*(b-a)*GL.w[j]*pdlPhi(z);
      tw+=w;
      const th=cfg.meanAng+cfg.sdAng*z, vs=pdlVStar(r,th,cfg.h);
      if(vs===null||!(vs>0)) continue;
      const zz=(vs-mu)/sv;
      tot+=w*(NORM*Math.exp(-0.5*zz*zz)/sv)/pdlDRdv(vs,th,cfg.h);
    }

/* the drawn curve is the same 201 points every frame while the launcher and

const PDF_CACHE={};
function pdlPdfCurve(cfg,lo,hi,n){
  const k=pdlCfgKey(cfg)+'/'+lo+'/'+hi+'/'+n;
  if(PDF_CACHE[k]) return PDF_CACHE[k];
  const xs=[], ys=[];
  for(let i=0;i<=n;i++){ const x=lo+(hi-lo)*i/n; xs.push(x); ys.push(pdlPdf(x,cfg)); }
  PDF_CACHE[k]={xs,ys};
  return PDF_CACHE[k];
}

/* ================================================================== *
 *  the statistics — PhET's conventions, pinned against numpy          *
 * ================================================================== */
/* PhET bins by Math.floor(x/w)*w, so a bin is [k w, (k+1) w) */
function pdlBinIndex(x,w){ return Math.floor(x/w); }
function pdlHistogram(xs,w){
  if(!xs.length) return {lo:0,counts:[],max:0,w};
  let lo=Infinity, hi=-Infinity;
  for(const x of xs){ const k=pdlBinIndex(x,w); if(k<lo) lo=k; if(k>hi) hi=k; }
  const counts=new Array(hi-lo+1).fill(0);
  for(const x of xs) counts[pdlBinIndex(x,w)-lo]++;
  let mx=0; for(const c of counts) if(c>mx) mx=c;
  return {lo,counts,max:mx,w};
}
function pdlMean(xs){ if(!xs.length) return null; let s=0; for(const x of xs) s+=x; return s/xs.length; }
/* PhET's getStandardDeviationDistance: Σ(x−x̄)²/(n−1), null below two

   the two conventions is exactly what a statistics sim is about. */
function pdlSd(xs,ddof){
  const d=ddof===undefined?1:ddof, n=xs.length;
  if(n<=d) return null;
  const m=pdlMean(xs);
  let s=0; for(const x of xs){ const e=x-m; s+=e*e; }
  return Math.sqrt(s/(n-d));
}
function pdlSe(xs){ const s=pdlSd(xs,1); return s===null?null:s/Math.sqrt(xs.length); }

/* the interval tool: PhET counts x >= lo && x <= hi, both ends closed */
function pdlFraction(xs,lo,hi){
  if(!xs.length) return 0;
  const a=Math.min(lo,hi), b=Math.max(lo,hi);
  let k=0; for(const x of xs) if(x>=a&&x<=b) k++;

/* the probability the exact law puts in [a,b] — Simpson on the density */
function pdlProbIn(cfg,a,b,n){

  for(let i=0;i<=N;i++){ const c=(i===0||i===N)?1:(i%2?4:2); s+=c*pdlPdf(a+i*dx,cfg); }

/* ================================================================== *
 *  a field: PhET's Field — one launcher, its projectiles, its stats   *
 * ================================================================== */
function fieldMake(seed,cfg){
  return {rng:pdlRng(seed),seed,cfg,landed:[],air:[],t:0,sinceLaunch:PDL.LAUNCH_GAP,
          n:0,samples:[],sampleN:0,firing:false,pending:0,size:0,lau:0,
          launched:0,tSample:0};
}

  if(F.landed.length+F.air.length>=PDL.MAX_PROJ) return null;
  const d=pdlDraw(F.rng,F.cfg);
  const p={v:d.v,ang:d.ang,x:pdlRange(d.v,d.ang,F.cfg.h),T:pdlFlight(d.v,d.ang,F.cfg.h),
           t:0,id:++F.n,type:F.cfg.type,sample:F.sampleN};

}

  F.t+=dt; F.sinceLaunch+=dt;

    const p=F.air[i]; p.t+=dt;

  F.firing=false; F.pending=0; F.launched=0; F.tSample=0; }

    const d=pdlDraw(F.rng,F.cfg);
    F.landed.push({v:d.v,ang:d.ang,x:pdlRange(d.v,d.ang,F.cfg.h),
                   T:pdlFlight(d.v,d.ang,F.cfg.h),t:pdlFlight(d.v,d.ang,F.cfg.h),
                   id:++F.n,type:F.cfg.type,sample:F.sampleN});

/* starting a sample is ONE operation in ONE place: it was written twice — in

/* the interval between the launches of one sample: PhET spreads them evenly

function sampleStep(size){ return (PDL.SAMPLE_TIME[size]||2)/size; }

function sampleBatch(F,size,count){

  for(let k=0;k<count&&F.samples.length<PDL.MAX_SAMPLES;k++){
    const xs=[], ps=[];
    for(let i=0;i<size;i++){
      const d=pdlDraw(F.rng,F.cfg), T=pdlFlight(d.v,d.ang,F.cfg.h);
      const p={v:d.v,ang:d.ang,x:pdlRange(d.v,d.ang,F.cfg.h),T,t:T,id:++F.n,
               type:F.cfg.type,sample:F.sampleN+1};

       joined the histogram — a field strip with nothing on it is a view that

function sampleMeans(F){ return F.samples.map(s=>s.mean); }

/* ================================================================== *
 *  state: four views — PhET's one screen, its thumbnail row at full   *
 *  size, the parent distribution the samples come from, and the       *
 *  theorem that ties the two together                                 *
 * ================================================================== */
const TABS=[['field','the field'],['sizes','the four sample sizes'],
            ['parent','one launch'],['clt','the limit theorem']];
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', text:'#aeb6c6', sky:'#0a1020', ground:'#141d16', bar:'#6c9cff',
           /* the six mystery launchers keep their own colour slots rather than

const RO_W=300;
const MODES=[{id:'single',name:'single'},{id:'continuous',name:'continuous'}];
const BINW_LIST=PDL.BINW.map(w=>({id:w,name:w+' m'}));

/* PhET's zoom ladder, plus an auto rung at the front: PhET opens at its

const SEEDS={field:5101,sizes:5201,parent:5301,clt:5401};

const DEFAULTS={view:'field', running:true, speedUp:false,

  pLau:1, pN:5, mode:'single', binW:PDL.BINW_DEF, zoom:-1,
  showSe:true, paths:true, blocks:false, showAng:false, showSpd:false,
  /* the four sample sizes */

/* ---- the worlds ------------------------------------------------------------ */
const WORLD={};

function makeWorld(view,st){

function sampFieldOf(view,lau,n,fill){

  if(!w.fields[key]){

    F.size=n; F.lau=lau;

function curField(st){

  if(st.view==='parent') return worldOf('parent').F;

function cltSets(st){

/* ---- the clock ------------------------------------------------------------ */
const FRAME_DT=1/60;
function viewDt(st){ return FRAME_DT*(st.speedUp?PDL.TIME_SPEED_FAST:1); }
function worldStep(st,dt){
  const F=curField(st);
  if(!F) return false;
  let moved=fieldStep(F,dt);
  if(F.firing){
    if(st.view==='parent'){
      if(F.sinceLaunch>=PDL.LAUNCH_GAP){
        fieldLaunch(F); moved=true;
        if(st.mode==='single') F.firing=false;
        if(F.landed.length+F.air.length>=PDL.MAX_PROJ) F.firing=false;
      }
    } else {
      /* PhET's pace: the n launches are spread evenly over totalSampleTime
         and their flights overlap; the sample completes when the last lands */
      F.tSample+=dt;
      const step=sampleStep(F.size);
      while(F.launched<F.size&&F.tSample>=F.launched*step){ fieldLaunch(F); F.launched++; moved=true; }
      if(F.launched>=F.size&&F.air.length===0){
        const xs=F.landed.slice(-F.size).map(p=>p.x);
        F.sampleN++; F.samples.push({n:F.sampleN,xs,mean:pdlMean(xs)});
        F.firing=st.mode==='continuous'&&F.samples.length<PDL.MAX_SAMPLES;
        if(F.firing) sampleStart(F); else { F.launched=0; F.tSample=0; }

  const F=curField(st); if(!F) return;

    if(F.firing&&st.mode==='continuous'){ F.firing=false; return; }
    F.firing=true; F.sinceLaunch=PDL.LAUNCH_GAP; return;
  }
  if(F.firing){ F.firing=false; F.launched=0; F.tSample=0; return; }
  if(F.samples.length>=PDL.MAX_SAMPLES) return;
  F.firing=true; sampleStart(F);

/* ---- the model each view and the readout read ------------------------------ */
function statsOf(xs){
  return {n:xs.length, mean:pdlMean(xs), median:pdlMedian(xs),

          min:xs.length?Math.min.apply(null,xs):null, max:xs.length?Math.max.apply(null,xs):null};

function buildModel(){
  const st=ST, view=st.view;
