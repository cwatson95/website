    M.means=sampleMeans(M.F); M.mstat=statsOf(M.means);
    M.xs=fieldXs(M.F); M.stat=statsOf(M.xs);
  } else if(view==='sizes'){
    M.lau=st.sLau; M.cfg=cfgMystery(st.sLau);
    M.sets=PDL.SIZES.map(n=>{
      const F=sampFieldOf('sizes',st.sLau,n,st.sM);
      const means=sampleMeans(F);
      return {n,F,means,stat:statsOf(means)};
    });
  } else if(view==='parent'){
    M.F=worldOf('parent').F; M.lau=st.xLau; M.cfg=M.F.cfg;
    M.xs=fieldXs(M.F); M.stat=statsOf(M.xs);
  } else {
    M.sets=cltSets(st); M.exact=worldOf('clt').exact; M.lau=st.cLau; M.cfg=cfgMystery(st.cLau);
  }
  M.exact=M.exact||pdlExact(M.cfg);
  M.binW=st.binW;
  if(M.xs) M.hist=pdlHistogram(M.xs,M.binW);
  M.zoomMax=st.zoom>=0?PDL.ZOOM_MAX[st.zoom]
    :autoZoom(M.means?pdlHistogram(M.means,M.binW).max:0);
  return M;
}

/* ================================================================== *
 *  readout / eqbar / tag                                              *
 * ================================================================== */
function hd(t){ return '<tr><td class="hd" colspan="2">'+t+'</td></tr>'; }
function rrow(a,b,cls){ return '<tr><td>'+a+'</td><td class="v'+(cls?' '+cls:'')+'">'+b+'</td></tr>'; }
function mfmt(x,n){ return x===null||x===undefined||!isFinite(x)?'—':fmt(x,n===undefined?2:n)+' m'; }
function launcherLabel(M){ return 'mystery launcher '+M.lau+' ('+MECH[LAUNCHERS[M.lau-1].mech].name+')'; }
function readoutHTML(M){
  const st=M.st, E=M.exact;
  let s='<div class="rname">sampling distributions<small>'+TABS.find(t=>t[0]===M.view)[1]+'</small></div><table>';
  s+=hd(launcherLabel(M))
    +rrow('mean launch speed',fmt(M.cfg.meanSpeed,2)+' &plusmn; '+fmt(M.cfg.sdSpeed,2)+' m/s')
    +rrow('launch angle',fmt(M.cfg.meanAng,0)+'&deg; &plusmn; '+fmt(M.cfg.sdAng,2)+'&deg;');
  s+=hd('one launch, exactly')
    +rrow('mean &mu;',mfmt(E.mean,3),'good')
    +rrow('standard deviation &sigma;',mfmt(E.sd,4),'good')
    +rrow('skewness, excess kurtosis',fmt(E.skew,4)+', '+fmt(E.kurt,4));
  if(M.view==='field'){
    const q=M.mstat, se=E.sd/Math.sqrt(st.pN);
    s+=hd('samples of n = '+st.pN)
      +rrow('samples completed',q.n+' of '+PDL.MAX_SAMPLES)
      +rrow('this sample&rsquo;s mean',M.F.samples.length?mfmt(M.F.samples[M.F.samples.length-1].mean,3):'—','good')
      +rrow('mean of the sample means',mfmt(q.mean,3),'good')
      +rrow('their standard deviation',mfmt(q.sd1,4),'good')
      +rrow('&sigma;/&radic;n, the standard error',mfmt(se,4))
      +rrow('their median',mfmt(q.median,3))
      +rrow('bin width',fmt(M.binW,2)+' m, scale 0&ndash;'+M.zoomMax+(st.zoom<0?' (auto)':''));
    s+='</table><div class="note">A sample contributes ONE point: its mean. '
      +(q.n>2?'At '+q.n+' samples the measured spread is '+fmt(q.sd1/se,3)+' of &sigma;/&radic;n; the sampling sd of that ratio is '+fmt(Math.sqrt(((E.kurt/st.pN)+2)/(4*q.n)),3)+'.'
             :'Two samples are not a distribution &mdash; fire more.')+'</div>';
    return s;
  }
  if(M.view==='sizes'){
    s+=hd(st.sM+' samples at each size');
    M.sets.forEach(S=>{
      const want=E.sd/Math.sqrt(S.n);
      s+=rrow('n = '+S.n+': measured spread',mfmt(S.stat.sd1,4),'good')
        +rrow('&nbsp;&nbsp;&sigma;/&radic;n',mfmt(want,4));
    });
    s+='</table><div class="note">One axis for all four, so the widths can be read against each other: every step up in n narrows the distribution by &radic;(n&#8322;/n&#8321;), and nothing else about it moves.</div>';
    return s;
  }
  if(M.view==='parent'){
    const S=M.stat;
    s+=hd(S.n+' single launches'+(M.F.air.length?' (+'+M.F.air.length+' in flight)':''))
      +rrow('mean x&#772;',mfmt(S.mean,3),'good')
      +rrow('median',mfmt(S.median,3),'good')
      +rrow('standard deviation s (n&minus;1)',mfmt(S.sd1,4),'good')
      +rrow('the n convention, for contrast',mfmt(S.sd0,4))
      +rrow('standard error s/&radic;n',mfmt(S.se,4))
      +rrow('smallest, largest',S.n?fmt(S.min,2)+', '+fmt(S.max,2)+' m':'—')
      +rrow('bin width',fmt(M.binW,2)+' m');
    s+='</table><div class="note">This is the parent the samples are drawn from. Its &sigma; is what every standard error on the other views divides by &radic;n &mdash; and it is known exactly, so nothing here is fitted.</div>';
    return s;
  }
  s+=hd(st.cM+' samples at each size');
  M.sets.forEach(S=>{
    const want=E.sd/Math.sqrt(S.n);
    const tol=want*Math.sqrt((E.kurt/S.n+2)/(4*st.cM));
    s+=rrow('n = '+S.n+': measured SE',mfmt(S.sd,4),'good')
      +rrow('&nbsp;&nbsp;&sigma;/&radic;n',mfmt(want,4))
      +rrow('&nbsp;&nbsp;difference, in its own sd',fmt((S.sd-want)/tol,2));
  });
  s+='</table><div class="note">The sampling sd of a standard error measured over M samples is &sigma;<sub>n</sub>&radic;((&kappa;<sub>n</sub>+2)/4M) with &kappa;<sub>n</sub> = &kappa;/n &mdash; the tolerance, computed rather than chosen.</div>';
  return s;
}
function eqbarHTML(M){
  const E=(eq,sm)=>'<span class="lhs">'+eq+'</span><span class="sm">'+sm+'</span>';
  if(M.view==='field') return E('x&#772; = <span class="hl">(1/n) &Sigma;<sub>i=1</sub><sup>n</sup> x<sub>i</sub></span> &nbsp;&rArr;&nbsp; E[x&#772;] = &mu;, &nbsp; <span class="hl2">sd(x&#772;) = &sigma;/&radic;n</span>',
    'one dot per sample, and the dot is its mean: the sampling distribution of the sample mean');
  if(M.view==='sizes') return E('sd(x&#772;<sub>n&#8322;</sub>)/sd(x&#772;<sub>n&#8321;</sub>) = <span class="hl">&radic;(n&#8321;/n&#8322;)</span> &nbsp;&middot;&nbsp; E[x&#772;<sub>n</sub>] = &mu; <span class="rm">for every n</span>',
    'four sample sizes on one axis: the centre never moves, only the width');
  if(M.view==='parent') return E('x = <span class="hl">(v cos&theta;/g)</span> (v sin&theta; + &radic;(v&sup2;sin&sup2;&theta; + 2gh)) &nbsp;&middot;&nbsp; h = 0: x = v&sup2; sin2&theta;/g',
    'one launch, one distance — and its whole distribution follows from the two Gaussians that made it');
  return E('sd(x&#772;<sub>n</sub>) = <span class="hl">&sigma;/&radic;n</span> <span class="rm">exactly, for every n</span> &nbsp;&middot;&nbsp; skew(x&#772;<sub>n</sub>) = skew(x)/&radic;n',
    'the width is not the theorem — independence alone gives it; the theorem is what happens to the shape');
}
function tagHTML(M){
  const p=t=>'<b>'+t+'</b> — ';
  if(M.view==='field') return p('the field')+'PhET&rsquo;s Sampling screen: samples of n = '+M.st.pN+' from launcher '+M.st.pLau;
  if(M.view==='sizes') return p('the four sample sizes')+'launcher '+M.st.sLau+', '+M.st.sM+' samples at each of n = 2, 5, 15, 40';
  if(M.view==='parent') return p('one launch')+'the parent distribution of launcher '+M.st.xLau+', against its exact density';
  return p('the limit theorem')+'the measured standard error against &sigma;/&radic;n';
}

/* ================================================================== *
 *  drawing helpers shared by the views (y is UP in the world, so the  *
 *  map flips; layouts are built bottom-up from a measured caption)    *
 *  — from build_cycloid via build_buoy/p4_views.js, unchanged              *
 * ================================================================== */
const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
const DRAG={what:null,off:0};

function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
/* a closed polygon: optional fill, optional stroke, every edge recorded */
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function circleW(ctx,map,c,r,col,lw,dash,fill){
  ctx.beginPath(); ctx.arc(map.X(c[0]),map.Y(c[1]),r*map.s,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(col){ ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* ================================================================== *
 *  the shared picture layer — EXTRACTED from                          *
 *  build/projectile-data-lab/p4_views.js by make_views.py, unchanged: *
 *  the stage layout, the field map (true aspect wherever it fits),    *
 *  PhET's 10 m markers, the launcher and its spread fan, the          *
 *  trajectories.                                                      *
 * ================================================================== */
/* the house #hint sits at bottom:11px, on top of the last line of a caption
   anchored at H - 12: every caption here ends HINT_H higher, clear of it */
const HINT_H=18;
/* the room a panel needs below itself: ticks only, and ticks plus an x title */
const AX_PAD=22, AX_PAD_LAB=38;
/* tick labels follow the tick SPACING, not a fixed decimal count (Known-bad:
   fmt(t,2) prints 318.00 whatever the range, and six of those do not fit) */
function tickFmt(ticks){
  let g=Infinity; for(let i=1;i<ticks.length;i++) g=Math.min(g,Math.abs(ticks[i]-ticks[i-1]));
  if(!isFinite(g)||g<=0) return v=>sigf(v,3);
  let d=0; while(d<6&&Math.abs(Math.round(g*Math.pow(10,d))-g*Math.pow(10,d))>1e-6*Math.max(1,g*Math.pow(10,d))) d++;
  return v=>fmt(Math.abs(v)<1e-12?0:v,d);
}
function axesT(ctx,b,xlo,xhi,ylo,yhi,opt){
  const o=Object.assign({},opt||{});
  /* a 10.5 px label is 12 px tall and up to ~48 px wide, so the tick count is
     capped by the panel: a 52 px histogram asked for four y ticks and drew
     them 13 px apart, which the layout sweep caught as an overlap */
  const nyMax=Math.max(2,Math.floor(b.h/26)), nxMax=Math.max(2,Math.floor(b.w/56));
  if(o.xticks===undefined) o.xticks=ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),Math.min(o.nx||6,nxMax));
  if(o.yticks===undefined) o.yticks=ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),Math.min(o.ny||5,nyMax));
  if(!o.xfmt) o.xfmt=tickFmt(o.xticks);
  if(!o.yfmt) o.yfmt=tickFmt(o.yticks);
  axesR(ctx,b,xlo,xhi,ylo,yhi,o);
  const tw=t=>plain(t).length*10.5*0.52, th=12;
  for(const t of o.xticks){
    const X=b.x+b.w*(t-xlo)/(xhi-xlo||1);
    if(X<b.x-0.5||X>b.x1+0.5) continue;
    const w=tw(o.xfmt(t)); LABELS.push([X-w/2,b.y1+5,X+w/2,b.y1+5+th]);
  }
  for(const t of o.yticks){
    const Y=b.y1-b.h*(t-ylo)/(yhi-ylo||1);
    if(Y<b.y-0.5||Y>b.y1+0.5) continue;
    const w=tw(o.yfmt(t)); LABELS.push([b.x-6-w,Y-th/2,b.x-6,Y+th/2]);
  }
  if(o.xlab){ const w=tw(o.xlab); LABELS.push([b.x+b.w/2-w/2,b.y1+21,b.x+b.w/2+w/2,b.y1+21+th]); }
}
function pl(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){ polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash); }
/* legendAuto records its text box in LEGEND_RECTS (for the curve check) but
   NOT in LABELS, so a note drawn afterwards has no idea it is there and lands
   on it.  Register it. */
function legendReg(ctx,b,items){
  const r=legendAuto(ctx,b,items);
  if(r) LABELS.push([r.x,r.y,r.x1,r.y1]);
  return r;
}
/* logTicks() gives whole decades only, and this axis spans 1.1 of them: it
   returned ONE tick and the panel had no scale.  1-2-5 per decade instead. */
function logTicks125(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  for(let e=Math.floor(Math.log10(lo))-1;e<=Math.ceil(Math.log10(hi))+1;e++)
    for(const m of [1,2,5]){ const v=m*Math.pow(10,e); if(v>=lo*0.999&&v<=hi*1.001) out.push(v); }
  return out.sort((a,b)=>a-b);
}

/* ---- the stage split: a field strip on top, a histogram under it ---------- */
function labStage(ctx,W,H,capFull,capShort,opt){
  const o=opt||{};
  const narrow=isNarrow(W), left=54, right=narrow?W-22:W-RO_W-40;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+28;
  const fit=fitCaption(ctx,W,H-HINT_H,capFull,capShort,capW,top+200);
  const avail=Math.max(150,fit.capY-16-top);
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[],top,avail};
  /* axes() puts its x tick labels at b.y1 + 5 and its x axis title at
     b.y1 + 21, so a panel needs AX_PAD below it or the labels land in the
     caption — which is exactly how the first sweep failed */
  /* a narrow stage cannot carry a row of small panels: below 900 px the
     bottom row is dropped to one, or to none where it was a set of four
     (pupil_plane Known-bad — a 32 px panel with a 170 px legend is
     off-canvas by construction).  Every view checks L.bottom.length. */
  const nB=narrow?Math.min(o.nBottomNarrow===undefined?(o.nBottom>1?0:o.nBottom||0):o.nBottomNarrow,o.nBottom||0)
                 :(o.nBottom||0);
  let rowH=0;
  if(nB>0){
    rowH=Math.max(90,Math.floor(avail*0.30));
    const gut=Math.max(30,Math.min(50,(right-left)*0.055)), span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),top+avail-rowH+10,w,rowH-10-AX_PAD));
  }
  const bodyH=avail-(nB>0?rowH+14:0);
  if(o.histFrac===undefined){ out.main=box(left,top,right-left,Math.max(60,bodyH-AX_PAD_LAB)); return out; }
  /* from the bottom up: the x labels first, then the histogram, then whatever
     is left for the field — never the other way round */
  const inner=Math.max(100,bodyH-34-AX_PAD_LAB);
  let histH=Math.max(52,Math.round(inner*o.histFrac));
  let fh=inner-histH;
  /* a 30° trajectory tops out at 10 m over a 100 m field, so at true aspect it
     needs a tenth of the width and no more: giving it half the stage leaves
     two thirds of the picture as empty sky.  The view says how tall it wants
     to be; whatever it does not use goes to the histogram. */
  if(o.fieldWant){
    const want=o.fieldWant(right-left);
    if(want<fh){ histH=Math.min(inner-Math.max(90,want),Math.round(inner*0.62)); fh=inner-histH; }
  }
  if(fh<64){ fh=Math.max(40,Math.min(64,inner-40)); histH=inner-fh; }
  out.field=box(left,top,right-left,fh);
  out.hist=box(left,top+fh+34,right-left,histH);
  return out;
}
/* the field's own map: ONE scale for both axes wherever it fits (the picture
   is a trajectory, and a trajectory's shape is the thing being drawn), with
   the compression printed on the canvas when a narrow stage cannot afford it */
function fieldApex(cfg){
  return cfg.h+Math.pow(cfg.meanSpeed*cfg.mult*Math.sin((cfg.meanAng+2.5*cfg.sdAng)*Math.PI/180),2)/(2*PDL.G);
}
/* the field height that puts the trajectory at true aspect on a stage w wide */
function fieldWantH(M){ return w=>Math.max(4,fieldApex(M.cfg)*1.14)*(w/PDL.FIELD)+32; }
function fieldMap(b,M){
  const sx=b.w/PDL.FIELD;
  const apex=fieldApex(M.cfg);
  const ymax=Math.max(4,apex*1.14);
  const ground=Math.min(26,Math.max(12,b.h*0.14));
  const sy=Math.min(sx,(b.h-ground-6)/ymax);
  const y0=b.y1-ground;
  return {sx,sy,ratio:sy/sx,y0,ymax,ground,X:x=>b.x+sx*x,Y:y=>y0-sy*y,
          wx:X=>(X-b.x)/sx, wy:Y=>(y0-Y)/sy};
}
/* the six field markers PhET paints every 10 m (FIELD_LABEL_INCREMENT) */
function drawGround(ctx,b,map){
  ctx.fillStyle=COL.sky; ctx.fillRect(b.x,b.y,b.w,map.y0-b.y);
  ctx.fillStyle=COL.ground; ctx.fillRect(b.x,map.y0,b.w,b.y1-map.y0);
  ctx.strokeStyle='#2e3a46'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(b.x,map.y0+0.5); ctx.lineTo(b.x1,map.y0+0.5); ctx.stroke();
  ctx.font=SM_FONT; ctx.textAlign='center'; ctx.textBaseline='top';
  /* PhET numbers every 10 m; a narrow stage gets every 20 or 25 instead, so
     the labels never touch */
  const step=map.sx*10>=34?10:(map.sx*20>=34?20:25);
  for(let d=0;d<=PDL.FIELD;d+=10){
    const X=map.X(d);
    ctx.strokeStyle=d%50===0?'#4a5a66':'#2b343e'; ctx.lineWidth=d%50===0?1.4:1;
    ctx.beginPath(); ctx.moveTo(X,map.y0); ctx.lineTo(X,b.y1-11); ctx.stroke();
    if(d%step===0){ ctx.fillStyle='#78838f'; ctx.fillText(''+d,X,b.y1-10);
      /* registered, so a value label placed later dodges the marker rather
         than being shifted on top of it */
      const w=(''+d).length*10.5*0.52; LABELS.push([X-w/2,b.y1-10,X+w/2,b.y1+2]); }
  }
}
/* the launcher: a frame, a barrel at the mean angle, and (on the raised
   orientation) the 12 m tower PhET's model puts it on */
function drawLauncher(ctx,map,M){
  const cfg=M.cfg, X0=map.X(0), Y0=map.Y(cfg.h);
  const col=M.lau?COL.lau[M.lau-1]:COL.struct;
  if(cfg.h>0){
    ctx.fillStyle='#233041'; ctx.fillRect(X0-7,Y0,14,map.y0-Y0);
    ctx.strokeStyle='#3b4a5c'; ctx.lineWidth=1; ctx.strokeRect(X0-7.5,Y0+0.5,15,map.y0-Y0);
  }
  const th=cfg.meanAng*Math.PI/180, L=Math.max(16,Math.min(34,map.sx*3.2));
  ctx.strokeStyle=col; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X0+L*Math.cos(th),Y0-L*Math.sin(th)); ctx.stroke();
  ctx.lineCap='butt';
  /* the spread: the mean angle ± 2 sd, drawn as a fan so an unequal launcher
     announces itself before a single shot is fired */
  ctx.strokeStyle=rgba(col,0.35); ctx.lineWidth=1.2;
  for(const k of [-2,2]){
    const a=(cfg.meanAng+k*cfg.sdAng)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X0+L*1.25*Math.cos(a),Y0-L*1.25*Math.sin(a)); ctx.stroke();
  }
  dot(ctx,X0,Y0,4.5,col,'#0a0c12',1.2);
}
/* one projectile's path, from the launcher to where it is now */
function drawPath(ctx,map,cfg,p,col,alpha,lw){
  const n=26, T=Math.min(p.t,p.T);
  const xs=[], ys=[];
  for(let i=0;i<=n;i++){
    const t=T*i/n;
    xs.push(p.v*Math.cos(p.ang*Math.PI/180)*t);
    ys.push(pdlHeight(p.v,p.ang,cfg.h,t));
  }
  ctx.beginPath();
  for(let i=0;i<=n;i++){ const X=map.X(xs[i]), Y=map.Y(Math.max(0,ys[i])); if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }
  ctx.strokeStyle=rgba(col,alpha); ctx.lineWidth=lw||1.2; ctx.stroke();
}
/* the launch-angle and launch-speed flags: PhET marks each landed projectile
   with the value it flew at; here the marker carries a tick coloured on the
   house scalar ramp, with the range named in the caption */
function flagRange(xs,key){
  let lo=Infinity, hi=-Infinity;
  for(const p of xs){ const v=p[key]; if(v<lo) lo=v; if(v>hi) hi=v; }
  if(!isFinite(lo)) return null;
  if(hi-lo<1e-9){ lo-=0.5; hi+=0.5; }
  return [lo,hi];
}
function drawField(ctx,b,M,opt){
  const o=opt||{}, st=M.st, map=fieldMap(b,M), cfg=M.cfg;
  drawGround(ctx,b,map);
  const col=M.lau?COL.lau[M.lau-1]:COL.struct;
  /* the landed projectiles */
  const key=st.showAng?'ang':(st.showSpd?'v':null);
  const rng=key?flagRange(M.F.landed,key):null;
  const r=Math.max(2,Math.min(4.2,map.sx*0.38));
  for(const p of M.F.landed){
    const X=map.X(p.x), Y=map.y0;
    if(key&&rng){
      const t=clamp((p[key]-rng[0])/(rng[1]-rng[0]),0,1);
      ctx.strokeStyle=neonCss(t); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(X,Y-2); ctx.lineTo(X,Y-2-9*(0.35+0.65*t)); ctx.stroke();
    }
    dot(ctx,X,Y-r*0.6,r,rgba(col,0.5),null);
  }
  /* the paths, then the airborne projectiles */
  if(st.paths) for(const p of M.F.landed.slice(-14)) drawPath(ctx,map,cfg,p,col,0.16,1);
  for(const p of M.F.air){
    if(st.paths) drawPath(ctx,map,cfg,p,COL.live,0.85,1.5);
    const X=map.X(p.v*Math.cos(p.ang*Math.PI/180)*p.t), Y=map.Y(Math.max(0,pdlHeight(p.v,p.ang,cfg.h,p.t)));
    dot(ctx,X,Y,4,COL.live,'#fff',1);
  }
  drawLauncher(ctx,map,M);
  /* the exact mean, drawn on the field itself */
  if(o.showExactMean!==false){
    const X=map.X(M.exact.mean);
    ctx.strokeStyle=rgba(COL.ref,0.8); ctx.lineWidth=1.3; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(X,b.y+6); ctx.lineTo(X,map.y0); ctx.stroke(); ctx.setLineDash([]);
    /* an unlabelled dashed rule in the same family of colours as the shots is
       a question, not an answer */
    lab(ctx,b.x1+2,b.y1+2,X+5,b.y+8,'μ = '+fmt(M.exact.mean,2)+' m, exact',COL.ref,SM_FONT,'left','top');
  }
  return map;
}

/* ================================================================== *
 *  the histogram of sample MEANS, and the four views                  *
 * ================================================================== */
/* the field's aspect sentence — a fixed-width number, so a caption can be
   measured with a placeholder before the map that fills it in exists */
function aspectNote(rTxt){
  return ' The field’s vertical scale is ×'+rTxt+' of its horizontal (1.00 is true aspect, and anything less is the stage being too short for the trajectory).';
}
/* one sample-mean histogram.  `own` fits the panel to this n; without it the
   axis is the parent's, which is what makes the four sizes comparable. */
function drawMeanHist(ctx,b,M,means,size,opt){
  const o=opt||{}, E=M.exact, se=E.sd/Math.sqrt(size), w=o.w||M.binW;
  const half=o.own?Math.max(4.6*se,3*w):4.2*E.sd;
  const lo=E.mean-half, hi=E.mean+half;
  const H=pdlHistogram(means,w);
  const ymax=o.ymax||Math.max(4,Math.ceil(Math.max(4,H.max)*1.2));
  const col=o.col||COL.sizes[PDL.SIZES.indexOf(size)];
  axesT(ctx,b,lo,hi,0,ymax,{title:o.title,xlab:o.xlab,ylab:o.ylab,nx:o.nx||5,ny:3});
  const px=x=>b.x+b.w*(x-lo)/(hi-lo), py=y=>b.y1-b.h*y/ymax;
  const bw=b.w*w/(hi-lo);
  for(let i=0;i<H.counts.length;i++){
    const c=H.counts[i]; if(!c) continue;
    const X0=Math.max(b.x,px((H.lo+i)*w)), X1=Math.min(b.x1,px((H.lo+i+1)*w));
    if(X1<=X0) continue;
    if(M.st.blocks&&bw>=3.5&&c<=ymax&&b.h/ymax>=5){
      const cellH=b.h/ymax, gap=clamp(0.18*cellH,2.2,7), gx=Math.min(gap,(X1-X0)*0.3);
      for(let k=0;k<c;k++){ ctx.fillStyle=rgba(col,0.85);
        ctx.fillRect(X0+gx/2,py(k+1)+gap/2,X1-X0-gx,Math.max(1.5,cellH-gap)); }
    } else { ctx.fillStyle=rgba(col,0.75); ctx.fillRect(X0,py(c),X1-X0,b.y1-py(c)); }
    POLY_SEGS.push(X0,py(c),X1,py(c));
  }
  /* the exact sampling law: a normal of sd σ/√n, scaled to the counts — not
     a fit, and drawn only when there are enough samples for a shape */
  if(o.showNormal!==false&&means.length>2){
    const xs=[], ys=[];
    for(let i=0;i<=180;i++){ const x=lo+(hi-lo)*i/180; xs.push(x);
      ys.push(means.length*w*Math.exp(-0.5*Math.pow((x-E.mean)/se,2))/(se*Math.sqrt(2*Math.PI))); }
    pl(ctx,b,xs,ys,lo,hi,0,ymax,COL.ref,1.6);
  }
  if(o.showSe!==false){
    const a=px(E.mean-se), c=px(E.mean+se), y=b.y+9;
    ctx.strokeStyle=COL.ref; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(a,y); ctx.lineTo(c,y); ctx.moveTo(a,y-4); ctx.lineTo(a,y+4);
    ctx.moveTo(c,y-4); ctx.lineTo(c,y+4); ctx.stroke();
  }
  const mx=px(E.mean);
  ctx.strokeStyle=rgba(COL.ref,0.8); ctx.lineWidth=1.2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(mx,b.y); ctx.lineTo(mx,b.y1); ctx.stroke(); ctx.setLineDash([]);
  /* the measured spread, so the comparison is a number and not an impression */
  if(o.showSe!==false&&means.length>2){
    const s1=pdlSd(means,1);
    const a2=px(E.mean-s1), c2=px(E.mean+s1), y2=b.y+20;
    ctx.strokeStyle=COL.pos; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(a2,y2); ctx.lineTo(c2,y2); ctx.moveTo(a2,y2-4); ctx.lineTo(a2,y2+4);
    ctx.moveTo(c2,y2-4); ctx.lineTo(c2,y2+4); ctx.stroke();
  }
  return {px,py,lo,hi,ymax,se};
}

/* ================================================================== *
 *  view 1: the field — PhET's Sampling screen                         *
 * ================================================================== */
function fieldCaptionS(M,rTxt){
  const se=M.exact.sd/Math.sqrt(M.st.pN);
  return {full:'A sample is '+M.st.pN+' launches, and only one number survives it: the mean. That number joins the histogram below, and the histogram is NOT the histogram of landing distances — it is far narrower. With σ = '
            +fmt(M.exact.sd,3)+' m for one launch, the exact standard error at n = '+M.st.pN+' is σ/√n = '+fmt(se,3)
            +(M.mstat.n>1
              ?' m (the orange bar; the green bar below it is the spread actually measured so far).'
              :' m (the orange bar). The green bar beside it is the spread the samples themselves show, and one sample has no spread — it appears with the second.')+aspectNote(rTxt),
          short:'One dot per sample, and the dot is its mean: σ/√n = '+fmt(se,3)+' m at n = '+M.st.pN+'.'+aspectNote(rTxt)};
}
function drawFieldView(ctx,W,H,M){
  const ph=fieldCaptionS(M,'1.00');
  const L=labStage(ctx,W,H,ph.full,ph.short,{histFrac:0.52,fieldWant:fieldWantH(M)});
  const map=drawField(ctx,L.field,M,{showExactMean:true});
  const F=M.F;
  if(F.landed.length){
    const xs=F.landed.slice(-(F.size||1)).map(p=>p.x), m=pdlMean(xs);
    const X=map.X(m);
    ctx.strokeStyle=COL.live; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(X,map.y0+4); ctx.lineTo(X,map.y0-26); ctx.stroke();
    lab(ctx,W,H,X,map.y0-29,'x̄ = '+fmt(m,2)+' m',COL.live,LAB_FONT,'center','bottom');
  }
  drawMeanHist(ctx,L.hist,M,M.means,M.st.pN,{title:'the sample means, n = '+M.st.pN,
    xlab:'sample mean x̄, m',ylab:'samples',own:true,ymax:M.zoomMax,
    showNormal:M.st.showSe,showSe:M.st.showSe,nx:6});
  lab(ctx,W,H,L.hist.x1-4,L.hist.y+9,M.mstat.n+(M.mstat.n===1?' sample · bin ':' samples · bin ')+fmt(M.binW,2)+' m',COL.dim,SM_FONT,'right','middle');
  const cap=fieldCaptionS(M,fmt(map.ratio,2));
  caption(ctx,L.left,L.capY,L.capTxt===ph.full?cap.full:cap.short,L.capW,'#767e92',CAP_FONT);
  return {map,L};
}

/* ================================================================== *
 *  view 2: the four sample sizes — PhET's thumbnail row, full size    *
 * ================================================================== */
function sizesCaption(M,few){
  const E=M.exact;
  const note=few?' This stage is too narrow for four panels, so it shows the two ends of the range; a wider one shows all four.':'';
  return {full:'The same launcher at every sample size PhET offers, '+M.st.sM+' samples each, all of them on ONE axis. The centre never moves — averaging biases nothing — and the width falls as 1/√n: from σ = '
            +fmt(E.sd,3)+' m for a single launch to '+fmt(E.sd/Math.sqrt(40),3)+' m at n = 40, a factor of √40 = 6.32. The orange bar on each is σ/√n from the exact law; the green bar is the spread these '
            +M.st.sM+' samples actually show.'+note,
          short:'Sample sizes on one axis: the width falls as 1/√n, the centre does not move.'+note};
}
function drawSizesView(ctx,W,H,M){
  /* a narrow stage cannot carry four stacked panels: four 24 px boxes with
     their own titles and tick labels overrun the caption.  Show the two ends
     of the range instead, and say so. */
  const few=isNarrow(W);
  const sets=few?[M.sets[0],M.sets[M.sets.length-1]]:M.sets;
  const ph=sizesCaption(M,few);
  const L=labStage(ctx,W,H,ph.full,ph.short,{nBottom:0});
  const b=L.main, n=sets.length;
  /* each panel needs room for its own title above and its tick labels below,
     or panel i's ticks land in panel i+1's title — which is how the first
     layout sweep failed */
  const gap=10, titleH=24, tickH=20, slot=(b.h-gap*(n-1))/n;
  const boxH=Math.max(28,slot-titleH-tickH);
  sets.forEach((S,i)=>{
    const p=box(b.x,b.y+i*(slot+gap)+titleH,b.w,boxH);
    const k=PDL.SIZES.indexOf(S.n);
    drawMeanHist(ctx,p,M,S.means,S.n,{title:'n = '+S.n+'  ·  σ/√n = '+fmt(M.exact.sd/Math.sqrt(S.n),3)+' m',
      xlab:(i===n-1&&boxH>=46)?'sample mean x̄, m':null,ylab:null,w:M.binW,
      showNormal:M.st.showNormal,showSe:true,nx:7,col:COL.sizes[k]});
    lab(ctx,W,H,p.x1-4,p.y+9,'measured '+fmt(S.stat.sd1,3)+' m',COL.pos,SM_FONT,'right','middle');
  });
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
  return {b,L};
}

/* ================================================================== *
 *  view 3: one launch — the parent the samples come from              *
 * ================================================================== */
function parentCaption(M){
  const E=M.exact;
  return {full:'Before the samples, the parent. These are '+M.stat.n+' single launches'
            +(M.st.showDensity
              ?'; the orange curve is not fitted to them but computed from the two Gaussians PhET launches with, ∫f_θ(θ)f_v(v*(r,θ))/|∂x/∂v| dθ.'
              :', with the exact density switched off, so nothing here is fitted or computed — the bars are the data alone.')
            +' Its standard deviation is σ = '
            +fmt(E.sd,4)+' m, and that is the σ every standard error on the other views divides by √n. '
            +(Math.abs(E.skew)>0.05||Math.abs(E.kurt)>0.05
              ? 'It is also visibly not a normal: its skewness is '+fmt(E.skew,3)+' and its excess kurtosis '+fmt(E.kurt,3)+', which is why the limit theorem has anything to say.'
              : 'This launcher’s parent happens to be very nearly normal already — skewness '+fmt(E.skew,3)+', excess kurtosis '+fmt(E.kurt,3)+' — so there is little for the theorem to do here; launchers 2 and 6 are the ones with a shape to lose.'),
          short:'The parent distribution: σ = '+fmt(E.sd,4)+' m, skewness '+fmt(E.skew,3)+'.'
            +(M.st.showDensity?' The curve is computed, not fitted.':' Its exact density is switched off.')};
}
function drawParentView(ctx,W,H,M){
  const ph=parentCaption(M);
  const L=labStage(ctx,W,H,ph.full,ph.short,{histFrac:0.56,fieldWant:fieldWantH(M)});
  const map=drawField(ctx,L.field,M,{showExactMean:true});
  const b=L.hist, E=M.exact, w=M.binW;
  const lo=Math.max(0,E.mean-5*E.sd), hi=E.mean+5*E.sd;
  const xs=[], ys=[];
  { const C=pdlPdfCurve(M.cfg,lo,hi,200); xs.push.apply(xs,C.xs); ys.push.apply(ys,C.ys); }
  let ymax=0; for(const y of ys) ymax=Math.max(ymax,y);
  const dens=M.hist.counts.map(c=>c/Math.max(1,M.stat.n)/w);
  for(const d of dens) ymax=Math.max(ymax,d);
  ymax=Math.max(1e-6,ymax*1.2);
  axesT(ctx,b,lo,hi,0,ymax,{title:M.stat.n+(M.st.showDensity?' launches against the exact density':' launches'),
    xlab:'landing distance x, m',ylab:'density, 1/m',nx:6,ny:4});
  const px=x=>b.x+b.w*(x-lo)/(hi-lo), py=y=>b.y1-b.h*y/ymax;
  for(let i=0;i<M.hist.counts.length;i++){
    const c=M.hist.counts[i]; if(!c) continue;
    const X0=Math.max(b.x,px((M.hist.lo+i)*w)), X1=Math.min(b.x1,px((M.hist.lo+i+1)*w));
    if(X1<=X0) continue;
    ctx.fillStyle=rgba(COL.pos,0.55); ctx.fillRect(X0,py(dens[i]),X1-X0,b.y1-py(dens[i]));
    POLY_SEGS.push(X0,py(dens[i]),X1,py(dens[i]));
  }
  if(M.st.showDensity) pl(ctx,b,xs,ys,lo,hi,0,ymax,COL.ref,2);
  for(const [v,col,tx] of [[E.mean,COL.ref,'μ = '+fmt(E.mean,3)+' m'],
                           [M.stat.mean,COL.live,'x̄ = '+(M.stat.mean===null?'—':fmt(M.stat.mean,3)+' m')]]){
    if(v===null) continue;
    const X=px(v);
    ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.setLineDash(col===COL.ref?[5,4]:[]);
    ctx.beginPath(); ctx.moveTo(X,b.y); ctx.lineTo(X,b.y1); ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,W,H,X,b.y+6,tx,col,SM_FONT,'center','top');
  }
  /* ±σ, so the number the other views divide is on the picture */
  const y=b.y+24;
  ctx.strokeStyle=COL.ref; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(px(E.mean-E.sd),y); ctx.lineTo(px(E.mean+E.sd),y);
  ctx.moveTo(px(E.mean-E.sd),y-4); ctx.lineTo(px(E.mean-E.sd),y+4);
  ctx.moveTo(px(E.mean+E.sd),y-4); ctx.lineTo(px(E.mean+E.sd),y+4); ctx.stroke();
  lab(ctx,W,H,px(E.mean+E.sd)+6,y,'μ ± σ',COL.ref,SM_FONT,'left','middle');
  legendReg(ctx,b,[[COL.pos,M.stat.n+' launches']].concat(M.st.showDensity?[[COL.ref,'the exact density']]:[]));
  const cap=parentCaption(M);
  caption(ctx,L.left,L.capY,L.capTxt===ph.full?cap.full:cap.short,L.capW,'#767e92',CAP_FONT);
  return {map,b,L};
}

/* ================================================================== *
 *  view 4: the limit theorem                                          *
 * ================================================================== */
function cltCaption(M){
  const E=M.exact;
  return {full:'The theorem, measured. '+M.st.cM+' samples at each of n = 2, 5, 15 and 40, drawn as densities on one axis'
            +(M.st.showNormal
              ?'; the orange curves are normals of standard deviation σ/√n with σ = '+fmt(E.sd,3)+' m from the exact law, nothing fitted.'
              :'. The σ/√n normals are switched off, so the histograms stand alone — σ = '+fmt(E.sd,3)+' m from the exact law is still what the panels below measure against.')
            +' The left panel below puts the measured standard errors against σ/√n on log axes, where the law is a straight line of slope −½. On that axis the error bars are half a pixel long, so the right panel gives the same four residuals in units of their own sampling spread, σ_n√((κ_n+2)/4M). The width half of the theorem is exact at every n and needs no theorem at all; the shape half is the one to watch — a single launch is skewed by '
            +fmt(E.skew,3)+' and the mean of 40 by '+fmt(E.skew/Math.sqrt(40),4)+'.',
          short:M.st.cM+' samples at each n'+(M.st.showNormal?'; the orange curves are σ/√n, not fits.':'; the σ/√n normals are off.')};
}
function drawCltView(ctx,W,H,M){
  const ph=cltCaption(M);
  const L=labStage(ctx,W,H,ph.full,ph.short,{nBottom:2,nBottomNarrow:1});
  const b=L.main, E=M.exact;
  const lo=E.mean-4.4*E.sd, hi=E.mean+4.4*E.sd;
  let ymax=0;
  const built=M.sets.map(S=>{
    const w=Math.max(0.08,E.sd/Math.sqrt(S.n)/3);
    const Hh=pdlHistogram(S.means,w);
    const d=Hh.counts.map(c=>c/S.means.length/w);
    for(const v of d) ymax=Math.max(ymax,v);
    const se=E.sd/Math.sqrt(S.n);
    ymax=Math.max(ymax,1/(se*Math.sqrt(2*Math.PI)));
    return {S,w,Hh,d,se};
  });
  ymax*=1.14;
  axesT(ctx,b,lo,hi,0,ymax,{title:'the sample mean at four sample sizes, as densities',
    xlab:'sample mean x̄, m',ylab:'density, 1/m',nx:6,ny:4});
  built.forEach((B,i)=>{
    const xs=[], ys=[];
    for(let k=0;k<B.Hh.counts.length;k++){
      xs.push((B.Hh.lo+k)*B.w,(B.Hh.lo+k+1)*B.w); ys.push(B.d[k],B.d[k]);
    }
    pl(ctx,b,xs,ys,lo,hi,0,ymax,COL.sizes[i],1.5);
    if(M.st.showNormal){
      const gx=[], gy=[];
      for(let k=0;k<=220;k++){ const x=lo+(hi-lo)*k/220; gx.push(x);
        gy.push(Math.exp(-0.5*Math.pow((x-E.mean)/B.se,2))/(B.se*Math.sqrt(2*Math.PI))); }
      pl(ctx,b,gx,gy,lo,hi,0,ymax,COL.ref,1.2,[5,4]);
    }
  });
  legendReg(ctx,b,PDL.SIZES.map((n,i)=>[COL.sizes[i],'n = '+n+'  (SE '+fmt(built[i].S.sd,3)+' m)'])
    .concat(M.st.showNormal?[[COL.ref,'σ/√n, the theorem']]:[]));
  const p=L.bottom[0];
  if(!p){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); return {b,L}; }
  const nlo=1.4, nhi=60, slo=E.sd/Math.sqrt(nhi)*0.7, shi=E.sd/Math.sqrt(nlo)*1.35;
  axesT(ctx,p,Math.log10(nlo),Math.log10(nhi),Math.log10(slo),Math.log10(shi),
    {title:titleFor(p,'standard error, m, against sample size n (log–log: slope −½)','SE, m, against n (log–log)'),
     ylab:null,xticks:[2,5,15,40].map(Math.log10),xfmt:v=>fmt(Math.pow(10,v),0),
     yticks:logTicks125(slo,shi).map(Math.log10),yfmt:v=>sigf(Math.pow(10,v),2),ny:3});
  const lx=[], ly=[];
  for(let i=0;i<=60;i++){ const n=nlo*Math.pow(nhi/nlo,i/60); lx.push(Math.log10(n)); ly.push(Math.log10(E.sd/Math.sqrt(n))); }
  pl(ctx,p,lx,ly,Math.log10(nlo),Math.log10(nhi),Math.log10(slo),Math.log10(shi),COL.ref,1.8);
  built.forEach((B,i)=>{
    const X=p.x+p.w*(Math.log10(B.S.n)-Math.log10(nlo))/(Math.log10(nhi)-Math.log10(nlo));
    const Y=p.y1-p.h*(Math.log10(B.S.sd)-Math.log10(slo))/(Math.log10(shi)-Math.log10(slo));
    dot(ctx,X,Y,4,COL.sizes[i],'#0a0c12',1);
  });
  /* the residual panel: on the log axis the error bars are shorter than the
     dots, so the agreement is only visible in units of the tolerance itself */
  const q=L.bottom[1];
  if(q){
    let hiz=3;
    const zs=built.map(B=>(B.S.sd-B.se)/(B.se*Math.sqrt((E.kurt/B.S.n+2)/(4*M.st.cM))));
    for(const z of zs) hiz=Math.max(hiz,Math.abs(z)*1.25);
    axesT(ctx,q,0.4,4.6,-hiz,hiz,{title:titleFor(q,'(measured SE − σ/√n) in units of its own sampling sd','the residual, in units of its sd'),
      ylab:null,xticks:[1,2,3,4],xfmt:v=>''+PDL.SIZES[v-1],ny:3});
    const qx=i=>q.x+q.w*(i+1-0.4)/4.2, qy=z=>q.y1-q.h*(z+hiz)/(2*hiz);
    for(const k of [-1,1]){ ctx.strokeStyle='rgba(232,132,58,.35)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(q.x,qy(k)); ctx.lineTo(q.x1,qy(k)); ctx.stroke(); }
    ctx.strokeStyle='#3b4250'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(q.x,qy(0)); ctx.lineTo(q.x1,qy(0)); ctx.stroke();
    zs.forEach((z,i)=>{ const X=qx(i);
      ctx.strokeStyle=COL.sizes[i]; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(X,qy(0)); ctx.lineTo(X,qy(clamp(z,-hiz,hiz))); ctx.stroke();
      dot(ctx,X,qy(clamp(z,-hiz,hiz)),4,COL.sizes[i],'#0a0c12',1);
      POLY_SEGS.push(X,qy(0),X,qy(clamp(z,-hiz,hiz)));
    });
    lab(ctx,q.x1+2,q.y1+2,q.x+4,q.y+6,'the orange rules are ±1 sd',COL.dim,SM_FONT,'left','top');
  }
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
  return {b,L};
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
let LAST_GEO=null;
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.view==='field') LAST_GEO=drawFieldView(ctx,W,H,M);
  else if(M.view==='sizes') LAST_GEO=drawSizesView(ctx,W,H,M);
  else if(M.view==='parent') LAST_GEO=drawParentView(ctx,W,H,M);
  else LAST_GEO=drawCltView(ctx,W,H,M);
  return LAST_GEO;
}
/* the one thing on the canvas you can drag: the launcher's barrel on the two
   field views, which scrubs the launcher through 1..6 (PhET selects them with
   its radio buttons; dragging the barrel is this remake's own shortcut, and
   it is the drag the harness proves moves the picture) */
function launcherHit(S,x,y){
  const M=buildModel();
  if(M.view!=='field'&&M.view!=='parent') return null;
  const ctx=S.measure();
  const ph=M.view==='field'?fieldCaptionS(M,'1.00'):parentCaption(M);
  const L=labStage(ctx,S.W,S.H,ph.full,ph.short,
    {histFrac:M.view==='field'?0.52:0.56,fieldWant:fieldWantH(M)});
  const map=fieldMap(L.field,M);
  const X0=map.X(0), Y0=map.Y(M.cfg.h);
  if(Math.abs(x-X0)>44||y<Y0-44||y>Y0+16) return null;
  return {what:'launcher',X0,Y0};
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.measure=()=>canvas.getContext('2d');
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  S.step=function(){ return ST.running?worldStep(ST,viewDt(ST)):false; };
  S.fire=function(){ fireField(ST); };
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    if(type==='down'){
      const hit=launcherHit(S,x,y);
      if(!hit) return false;
      DRAG.what='launcher'; DRAG.yDown=y; DRAG.key=ST.view==='field'?'pLau':'xLau';
      DRAG.start=ST[DRAG.key];
      return true;
    }
    if(type==='move'&&DRAG.what==='launcher'){
      /* the barrel sweeps upward through the six launchers: 14 px each */
      /* measured from where the pointer went DOWN, not from the pivot: a
         grab eight pixels above the pivot would otherwise jump the launcher
         on before the pointer had moved at all */
      const n=clamp(Math.round(DRAG.start+(DRAG.yDown-y)/14),1,PDL.N_FIELDS);
      if(n===ST[DRAG.key]) return false;
      ST[DRAG.key]=n;
      if(DRAG.key==='xLau') resetWorld('parent');
      return true;
    }
    return false;
  };
  return S;
}

/* ================================================================== *
 *  boot — panel, tabs, handlers, frame loop                           *
 * ================================================================== */
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas), st=S.st;
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    st.view=k; DRAG.what=null;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===st.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:st.view===k?'active':'',onclick:()=>setView(k)},lab2)); });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:st[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=st[key]; val.textContent=fmtf(st[key]); };
    inp.addEventListener('input',()=>{ st[key]=parseFloat(inp.value);
      val.textContent=fmtf(st[key]); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync,inp}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=st[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ st[key]=inp.checked;
      if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=st[key]; }};
    return el;
  }
  const CHIPROWS=[];
  /* every chip row carries a data-key: four of them are labelled 1..6 and a
     match-by-word finder would drive the wrong one (lenses.html Known-bad) */
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips','data-key':key});
    list.forEach(o=>{
      const c=h('button',{class:'chip'+(st[key]===o.id?' on':''),onclick:()=>{
        if(c.disabled) return;
        st[key]=o.id; if(onPick) onPick(o);
        syncChips(); syncPanel(); dirty=true; refresh(); }},o.name);
      wrapEl.appendChild(c);
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function button(lab2,fn){ return h('button',{onclick:()=>{ fn(); syncChips(); syncPanel(); dirty=true; refresh(); }},lab2); }
  const reParent=()=>{ const w=worldOf('parent'); w.F.cfg=cfgMystery(st.xLau);
    fieldClear(w.F); fieldBatch(w.F,st.xN); };

  /* ---- the launcher and the sample size (PhET's Sampling screen) ---- */
  const gSamp=h('div',{class:'grp'},h('h3',null,'the sampling'));
  gSamp.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gSamp.appendChild(chipRow(LAU_LIST,'pLau'));
  gSamp.appendChild(h('div',{class:'tag'},'sample size:'));
  gSamp.appendChild(chipRow(SIZE_LIST,'pN'));
  gSamp.appendChild(h('div',{class:'checks'},checkbox('showSe','σ/√n and the measured spread')));
  gSamp.appendChild(h('div',{class:'btnrow'},
    button('+20 samples',()=>{ const F=curField(st); sampleBatch(F,st.pN,20); }),
    button('clear',()=>{ const F=curField(st); fieldClear(F); })));
  const sampTag=h('div',{class:'tag'}); gSamp.appendChild(sampTag);

  /* ---- the four sample sizes ---- */
  const gSizes=h('div',{class:'grp'},h('h3',null,'the four sample sizes'));
  gSizes.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gSizes.appendChild(chipRow(LAU_LIST,'sLau'));
  gSizes.appendChild(slider('sM','samples at each n',20,200,20,v=>fmt(v,0),
    ()=>{ resetWorld('sizes'); }));
  gSizes.appendChild(h('div',{class:'checks'},checkbox('showNormal','σ/√n, the theorem')));
  const sizesTag=h('div',{class:'tag'}); gSizes.appendChild(sizesTag);

  /* ---- one launch ---- */
  const gParent=h('div',{class:'grp'},h('h3',null,'one launch'));
  gParent.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gParent.appendChild(chipRow(LAU_LIST,'xLau',reParent));
  gParent.appendChild(slider('xN','launches drawn',50,PDL.MAX_PROJ,50,v=>fmt(v,0),reParent));
  gParent.appendChild(h('div',{class:'checks'},checkbox('showDensity','the exact density')));
  const parentTag=h('div',{class:'tag'}); gParent.appendChild(parentTag);

  /* ---- the limit theorem ---- */
  const gClt=h('div',{class:'grp'},h('h3',null,'the limit theorem'));
  gClt.appendChild(h('div',{class:'tag'},'mystery launcher:'));
  gClt.appendChild(chipRow(LAU_LIST,'cLau'));
  gClt.appendChild(slider('cM','samples at each n ',100,2000,100,v=>fmt(v,0)));
  const cltTag=h('div',{class:'tag'}); gClt.appendChild(cltTag);

  /* ---- the histogram ---- */
  const gHist=h('div',{class:'grp'},h('h3',null,'the histogram'));
  gHist.appendChild(h('div',{class:'tag'},'bin width (PhET&rsquo;s list for this sim):'));
  gHist.appendChild(chipRow(BINW_LIST,'binW'));
  gHist.appendChild(h('div',{class:'tag'},'vertical scale, samples:'));
  gHist.appendChild(chipRow(ZOOM_LIST,'zoom'));
  gHist.appendChild(h('div',{class:'checks'},checkbox('blocks','blocks, one per sample'),
    checkbox('paths','paths'),checkbox('showAng','launch angle'),checkbox('showSpd','launch speed')));
  const histTag=h('div',{class:'tag'}); gHist.appendChild(histTag);

  /* ---- firing ---- */
  const gFire=h('div',{class:'grp'},h('h3',null,'firing'));
  gFire.appendChild(chipRow(MODES,'mode'));
  const fireBtn=h('button',{onclick:()=>{ S.fire(); syncPanel(); dirty=true; refresh(); }},'launch');
  gFire.appendChild(h('div',{class:'btnrow'},fireBtn));
  /* +50 at once only means anything on the parent view, where a launch IS the
     datum; on the sampling screen the datum is a whole sample */
  const batchRow=h('div',{class:'btnrow'},
    button('+50 launches',()=>{ const F=curField(st); if(F) fieldBatch(F,50); }));
  gFire.appendChild(batchRow);
  const fireTag=h('div',{class:'tag'}); gFire.appendChild(fireTag);

  /* ---- time ---- */
  const gRun=h('div',{class:'grp'},h('h3',null,'time'));
  gRun.appendChild(h('div',{class:'checks'},checkbox('running','time runs'),
    checkbox('speedUp','×6 (PhET’s fast)')));
  gRun.appendChild(h('div',{class:'btnrow'},button('reset this view',()=>{ resetView(); })));
  const runTag=h('div',{class:'tag'}); gRun.appendChild(runTag);

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),
    h('div',{id:'info'}),
    h('div',{class:'src',html:'Remake of PhET Interactive Simulations&rsquo; Projectile Sampling Distributions (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets. '
      +'PhET&rsquo;s constants (g = 9.81, the 100 m field, the 0.2&ndash;5&deg; angle spreads, the three mechanisms, the six mystery launchers, the sample sizes, the bin widths and the 200-sample ceiling) are read from its published build; '
      +'everything else is derived and pinned in selfTest to build/projectile-sampling-distributions/derive.py (the exact moments by a 96-node Gauss&ndash;Legendre rule against scipy and a Monte Carlo, bit-exact mulberry32, and every sample statistic against numpy).'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the mathematics'),h('div',{id:'phys'}));
  [gSamp,gSizes,gParent,gClt,gHist,gFire,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function resetView(){
    const v=st.view;
    for(const k in DEFAULTS) if(k!=='view') st[k]=DEFAULTS[k];
    st.view=v; resetAllWorlds();
  }
  function syncChips(){
    for(const [cw,list,key] of CHIPROWS)
      [].forEach.call(cw.children,(b,i)=>b.className='chip'+(list[i].id===st[key]?' on':'')+(b.disabled?' off':''));
  }
  function syncPanel(){
    const v=st.view;
    gSamp.hidden=(v!=='field');
    gSizes.hidden=(v!=='sizes');
    gParent.hidden=(v!=='parent');
    gClt.hidden=(v!=='clt');
    gHist.hidden=(v==='clt');
    gFire.hidden=!(v==='field'||v==='parent');
    batchRow.hidden=(v!=='parent');
    gRun.hidden=!(v==='field'||v==='parent');
    /* the vertical-scale chips only mean anything on the screen that uses
       them: a live control that is ignored is worse than no control */
    const zoomLive=(v==='field');
    const zr=CHIPROWS.find(c=>c[2]==='zoom')[0];
    [].forEach.call(zr.children,b=>{ b.disabled=!zoomLive; b.style.opacity=zoomLive?'1':'0.4'; });
    const F=curField(st);
    fireBtn.textContent=F&&F.firing?'stop':(st.mode==='continuous'
      ?(v==='parent'?'launch continuously':'sample continuously'):(v==='parent'?'launch':'take a sample'));
    if(rows.cb_blocks) rows.cb_blocks.row.hidden=(v==='clt');
    for(const k in rows) rows[k].sync();
    const M0=buildModel();
    sampTag.innerHTML='At most '+PDL.MAX_SAMPLES+' samples a field, as PhET allows; each (launcher, n) pair keeps its own.';
    sizesTag.innerHTML='More samples sharpen the four measured spreads; they do not narrow the distributions.';
    parentTag.innerHTML='The orange curve is computed from the two input Gaussians, not fitted to the bars.';
    cltTag.innerHTML='The error bars shrink as 1/&radic;M &mdash; that is the tolerance, not the theorem.';
    histTag.innerHTML='PhET bins by floor(x/w)&middot;w, so a bin is [k w, (k+1) w). This sim&rsquo;s widths are 0.5, 1, 2 and 5 m, and it has no total-bins setting.';
    fireTag.innerHTML=(F&&F.samples&&F.samples.length>=PDL.MAX_SAMPLES)?'this field is full ('+PDL.MAX_SAMPLES+' samples, PhET&rsquo;s limit)'
      :'space launches &middot; <b>c</b> clears &middot; <b>p</b> pauses &middot; 1&ndash;4 switch views';
    runTag.innerHTML='A shot takes '+fmt(pdlFlight(M0.cfg.meanSpeed,M0.cfg.meanAng,M0.cfg.h),2)
      +' s to land; a sample of '+st.pN+' takes about '+fmt(st.pN*Math.max(PDL.LAUNCH_GAP*0.5,pdlFlight(M0.cfg.meanSpeed,M0.cfg.meanAng,M0.cfg.h)),1)+' s.';
  }

  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M);
      eqEl.innerHTML=eqbarHTML(M);
      tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=(st.view==='field'||st.view==='parent')
        ?'drag the launcher up and down to change launcher · space launches · 1–4 switch views'
        :'space launches · c clears · 1–4 switch views';
      infoEl.innerHTML=INFO[st.view]||'';
      physEl.innerHTML=DERIV[st.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncChips(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ syncChips(); syncPanel(); dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); S.fire(); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='p'){ st.running=!st.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='c'){ const F=curField(st); if(F) fieldClear(F); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ resetView(); syncChips(); syncPanel(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    const advanced=S.step();
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%8===0){ const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  field:'PhET&rsquo;s whole sim, in one screen. Pick a launcher and a sample size, fire a sample, and watch what survives it: not the n landing distances, but their single mean. That mean is one dot in the histogram below, and the histogram is far narrower than the landing distances that made it &mdash; averaging cancels. How much narrower is the only question the screen asks, and it has an exact answer: σ/√n, with σ the standard deviation of one launch, known outright from the launcher&rsquo;s own mechanism (see <b>one launch</b>). The orange bar across the top of the histogram is that exact σ/√n; the green bar under it is the spread the samples have actually shown so far, which wanders toward it. Drag the launcher itself to change launchers without leaving the field.',
  sizes:'PhET&rsquo;s thumbnail row, at a size you can read. The same launcher, the same number of samples, four sample sizes, and &mdash; the part that matters &mdash; one axis for all four. Nothing about the centre changes: E[x̄] = μ for every n, exactly, and averaging never biases anything. Only the width moves, and it moves as 1/√n: four times the sample halves the spread. Notice that n = 2 is already narrower than a single launch by √2, with no theorem involved at all.',
  parent:'Where σ comes from. Every standard error on the other views is σ/√n, and σ belongs to the parent: the distribution of one launch. PhET launches with two independent Gaussians &mdash; a speed and an angle &mdash; pushed through x = (v cosθ/g)(v sinθ + √(v²sin²θ + 2gh)), so that distribution is a closed problem, not something to be sampled. The orange curve is it, computed on eight panels of a 96-node quadrature rather than fitted to the bars (at a fixed distance only the angles whose v* lands within a few standard deviations of the mean speed contribute, so the integrand is a spike and one panel of the rule rings around it &mdash; by 29 % at launcher 2); the bars are however many launches the slider asks for. It is not a normal: it is skewed, and its tails are not Gaussian tails. That is exactly what makes the central limit theorem worth stating.',
  clt:'The theorem has two halves and they are usually run together. The width half &mdash; sd(x̄) = σ/√n &mdash; is exact for every n and every parent with a variance, and it follows from independence alone; no theorem is needed and none is used. The shape half is the theorem: whatever the parent looks like, the mean of n of them approaches a normal. For mystery launcher 1 the parent is skewed by −0.098 and the mean of 40 by −0.0155; every launcher has its own pair, and the readout and the caption carry the live ones. The panels below hold the first half to account: the measured standard errors against σ/√n on log axes, and then the same four residuals in units of the spread a measured standard error is entitled to, so that "they agree" comes with an error bar.'
};

/* the 0th, 1st and 2nd moments of f from ONE sampling of it */
function simp3(f,a,b,n){
  const h=(b-a)/n, out=[0,0,0];
  for(let i=0;i<=n;i++){
    const x=a+i*h, c=(i===0||i===n)?1:(i%2?4:2), y=f(x)*c;

  }
  return out.map(s=>s*h/3);
}
function simp(f,a,b,n){
  const N=2*Math.max(1,Math.round(n/2)), dx=(b-a)/N;
  let s=f(a)+f(b);
  for(let i=1;i<N;i++) s+=(i%2?4:2)*f(a+i*dx);
  return s*dx/3;
}
