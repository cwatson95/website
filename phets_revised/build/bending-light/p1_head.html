<title>Bending light &mdash; PhET&rsquo;s laser on a boundary, with Snell and Fresnel solved exactly</title>
<!--
  ===================================================================
  bending-light.html — a laser meets the boundary between two media:
  how far the transmitted ray bends, how much of the power comes
  back, where it stops coming through at all, what the same picture
  looks like as a wave, and what a prism does to white light
  ===================================================================

  Remake of PhET Interactive Simulations' Bending Light (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets. The model, its constants and its controls follow PhET's build 1.2.5
  (docs/phets/bending-light_en.html); every number taken from that build is
  marked "PhET's value" in the code, in the panel and on the canvas.

  SIX VIEWS.  THE BOUNDARY is PhET's Intro screen: a laser you swing about the
  origin onto the interface between two media (air, water, glass, diamond,
  Mystery A, Mystery B or a custom index), with the reflected and the
  transmitted rays drawn in their own spectral colour at their own share of the
  power, the normal, the angle arcs, PhET's protractor and PhET's intensity
  meter, and the critical angle marked where the transmitted ray disappears.
  THE WAVE is PhET's wave view and its More Tools meters: the same two media
  with the field itself painted, the wavelength and the speed inside each
  medium, and the evanescent tail past the critical angle that PhET does not
  draw.  It is also where Snell's law comes from — the crest spacing along the
  boundary has to match, and that single statement is the law.  THE PRISM is
  PhET's Prisms screen: PhET's own five prism prototypes traced by exact
  polygon and circle intersection with vector Snell at every face, total
  internal reflection where it happens, the partial reflections when you ask
  for them, and white light dispersed into a spectrum -- drawn white where the
  thirty wavelengths still share one path and one at a time where they have
  separated, because thirty translucent strokes on one line composite to the
  colour of whichever was painted last, not to white.  THE REFLECTED FRACTION
  is the Fresnel equations drawn: R and T for s and p polarisation against the
  angle of incidence, with Brewster's angle where R_p is exactly zero, the
  critical angle where R becomes exactly one, and R + T = 1 at every angle.
  THE SPECTRUM is the dispersion model made visible: n against wavelength for
  every substance, the true colour of each wavelength from the CIE 1931
  observer, and the angular spread a 60-degree prism gives white light.  THE
  RAINBOW is what all of it is for: Descartes' stationary deviation in a
  spherical drop, the caustic drawn from the rays themselves, the primary bow
  at 42.13 degrees and the secondary at 50.79, Alexander's dark band of 8.65
  degrees between them, and the Fresnel weights that say why a rainbow is faint
  and polarised -- including two identities derived here: the internal
  reflectance at the stationary ray is exactly (k/(k+2))^2 WHATEVER the index,
  so the k-th bow passes exactly (1-R)^2 R^k of s-polarised light, 64/729 for
  the primary and 9/256 for the secondary.

  WHAT IS EXACT HERE
  ------------------
  Snell's law, in both directions, at and past the critical angle: the suite
  asserts theta_2 against derive.py over eight medium pairs and eight angles,
  asserts that the refracted ray grazes at exactly 90 degrees at the critical
  angle, and round-trips every refraction back to 1e-14 rad.  The Fresnel
  equations for both polarisations: R + T = 1 holds to 6.7e-16 over eight pairs
  x 601 angles, R_p is 0 at Brewster's angle (and theta_B + theta_2 = 90
  degrees exactly), R = 1 at and past the critical angle in both
  polarisations, and R at normal incidence agrees with ((n1-n2)/(n1+n2))^2.
  The wave: lambda_medium = lambda_vacuum/n and v = c/n, the frequency is
  the same on both sides, the crest spacing along the boundary matches to
  1.8e-16, and the field is continuous — 1 + r_s = t_s and
  n_1 cos th_1 (1 - r_s) = n_2 cos th_2 t_s both to 4.4e-16.  The world's
  wavenumber is pinned at five wavelengths rather than only at the reference
  one, where it is 2 pi whichever way round the ratio is written; and the
  evanescent decay constant is pinned against derive.py and then RECOVERED by
  measurement from the drawn field, because past the critical angle the
  transmitted phase does not depend on depth, so the ratio of the field at two
  depths is exactly exp(kappa dy).  The prism:
  ray-polygon and ray-circle intersections in closed form, vector Snell at
  every face, and the traced deviation through an equilateral prism agrees
  with the two-surface closed form to 2.5e-14 degrees and with the
  minimum-deviation law n = sin((A+D)/2)/sin(A/2) to 6.4e-15 degrees.  The
  rainbow: the stationary condition cos^2 th = (n^2-1)/(k^2+2k) agrees with
  scipy's bounded minimiser to 1.4e-6 degrees for k = 1, 2 and 3, and the
  emergent ray the view DRAWS -- refracted at the exit face, not turned through
  D by hand -- leaves at exactly that deviation.  The colour path is checked the
  same way: derive.py parses the CIE 1931 table back out of this file and
  re-evaluates it in Python, so the sRGB bytes of eight wavelengths are pinned
  against an independent evaluation of the same published numbers rather than
  against themselves.  Every reference value in selfTest is a printed line of
  build/bending-light/refvals.txt, the output of derive.py, read in full.

  WHAT IS PhET'S, AND WHERE IT CAME FROM
  --------------------------------------
  Read out of the minified build: the substances and their indices at 650 nm
  (air 1.000293, water 1.333, glass 1.5, diamond 2.419, Mystery A 2.419,
  Mystery B 1.4) and the custom substance's default 2.6 (= Mystery B + 1.2);
  the reference wavelength WAVELENGTH_RED = 650 nm and the laser range
  380-700 nm; the index slider's range 1.000293-1.6 with its ticks at air,
  water and glass; the dispersion model — a Sellmeier curve for BK7 glass and
  an Edlen curve for air, blended linearly so that the result passes through
  the substance's stated index at 650 nm; the s-polarised Fresnel powers
  R = ((n1 c1 - n2 c2)/(n1 c1 + n2 c2))^2 and T = 4 n1 n2 c1 c2/(n1 c1 +
  n2 c2)^2, which is the pair PhET uses for its ray brightness and its
  intensity meter; the 0.005 floor below which PhET stops drawing a reflected
  ray and the 0.001 floor at which its prism tracer gives up; maxLightRaySteps
  = 50; the wave view's MAX_ANGLE_IN_WAVE_MODE = 3.0194 rad (7.00 degrees from
  the boundary); the default laser angle 3 pi/4, which is 45 degrees of
  incidence; the Intro screen's air-over-water and the Prisms screen's
  air-around-glass defaults; the model world 62 x 43.4 red wavelengths across;
  the five prism prototypes and their vertices (an equilateral triangle,
  trapezoid and square of side 10 red wavelengths, a circle and a semicircle
  of radius 5); the five-ray fan spaced half a red wavelength apart; and the
  white-light set _.range(400, 700, 10) = 400, 410, ... 690 nm.  One thing of
  PhET's is deliberately NOT reproduced: its prism beam, aimed as PhET aims it,
  takes a left-in, right-reflect, bottom-out path through the triangle, which is
  a CONSTANT-DEVIATION arrangement and disperses white light by 0.037 degrees
  instead of 1.6, so the beam here opens at the minimum-deviation angle instead
  and selfTest pins both spreads.  The Sellmeier coefficients PhET carries are the published SCHOTT N-BK7 set and the air
  coefficients are Edlen's; this file recomputes n_d = 1.51680 and V_d = 64.17
  from them and checks both against SCHOTT's published values, so the numbers
  are verified rather than copied.

  WHAT IS MODELLED, AND WHAT IS NOT MODELLED AT ALL
  -------------------------------------------------
  Nothing here is absorbing: every index is real, so R + T = 1 exactly and a
  medium never dims a beam that passes through it.  Nothing is dispersive in
  TIME — the wave view draws a single frequency, so there is no pulse and no
  group velocity.  PhET's intensity meter reads the s-polarised reflectance;
  this file draws s, p and the unpolarised average and says which one the
  reading is.  Diamond is offered as a medium chip because PhET ships the
  constant (2.419), but PhET's own medium chooser in this build does not list
  it and its custom-index slider stops at 1.6; both facts are printed.  PhET's
  sixth prism prototype, the diverging lens (a rectangle with two circular
  faces cut into it), is NOT implemented — its two arc radii could not be read
  unambiguously out of the minified build, and a guessed shape is not a
  remake.  The rainbow view models a sphere of water with geometric rays: no
  diffraction, so no supernumerary bows, and the drop is a perfect sphere, so
  there is no flattening and no rainbow of the shape a real large raindrop
  makes.  The prism tracer stops at PhET's own limits (50 steps, power 0.001)
  rather than tracing forever.
-->
