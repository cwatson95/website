<title>Gas properties &mdash; hard disks in a box: the ideal gas law, a working wall, Maxwell&ndash;Boltzmann, diffusion, and where pressure comes from</title>
<!--
  ===================================================================
  gas-properties.html — Remake of PhET Interactive Simulations' Gas
  Properties (University of Colorado Boulder, phet.colorado.edu,
  CC-BY 4.0). New code; no PhET code or assets.
  ===================================================================

  Six views.  THE GAS LAW is PhET's Ideal screen: pump heavy or light
  particles into a box, heat or cool them from below, slide the left
  wall (it does no work: the sim pauses and the particles are spread
  over the new width), open the lid and watch them leave, and hold
  nothing, the volume, the temperature, or the pressure (by moving the
  wall, or by changing the temperature), with the thermometer, the
  pressure gauge, the stopwatch, the collision counter and the width
  ruler.  THE MOVING WALL is PhET's Explore screen: the left wall does
  work, at no more than a speed limit (PhET's is 800 m/s), and the gas
  heats as it is squeezed.  THE ENERGY is PhET's Energy screen: the
  speed and kinetic-energy histograms of the heavy, light and all
  particles, the average speeds, the injection temperature and the
  collisions switch.  DIFFUSION is PhET's Diffusion screen: a divided
  box, two species of adjustable number, mass, radius and starting
  temperature, the centres of mass and the particle flow.  THE PRESSURE
  and EQUILIBRIUM are house additions: the momentum the walls actually
  receive against PhET's gauge, and the approach of any start to the
  Maxwell-Boltzmann law, with equipartition between the two species.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * PhET's thermometer and gauge obey PV = NkT by construction.  The
    walls actually feel (3/2) x W/(W - 2r) x Z of the gauge: 3/2 because
    PhET gives (3/2)kT to disks that move in two dimensions, W/(W - 2r)
    because a centre cannot reach the last radius, Z because collisions
    carry momentum across the gas.
  * The simulated disks resolve the third virial coefficient: 90 heavy
    disks in the 10 nm box (area fraction 0.050) give Z - 1 = 0.1102,
    against 0.11024 with B2 and B3 and 0.10176 with B2 alone.
  * A slow push (20 m/s) of 100 heavy disks from 10 to 7 nm ends at
    T w/T0 w0 = 1.0694, on the hard-disk adiabat (1.0691), not on the
    point law T w = const (1.0111).  PhET's 800 m/s limit is Mach 1.55
    in the heavy gas at 300 K (sound: 517 m/s); pushed at it, the gas is
    shocked to about three times the adiabat.
  * Effusion: wall hits arrive with (3/2)kT2 (measured 1.481, 2-D
    theory 3/2).  Through the lid's widest gap, about twenty mean free
    paths, the gas leaves as a jet carrying close to its enthalpy
    2kT2 per particle (measured 1.95), and what stays behind cools.
  * Equipartition: from a 6:1 energy split between heavy and light
    disks, the two species' mean energies meet (D = 0.008 +- 0.040).

  WHAT IS EXACT
  -------------
  * The dynamics.  Inside each substep every collision happens at its
    exact contact time, in time order: the earlier root of the contact
    quadratic for two disks, a linear equation for a (moving) wall.
    Elastic impulses conserve momentum and energy to rounding, and
    selfTest asserts both over 5000 random collisions.  The engine
    reproduces an independent brute-force event-driven run (derive.py:
    no grid, no substeps, every pair scanned) to better than 1e-6 pm
    (7e-8 to 7e-7) after 25-30 ps, with identical collision counts,
    and the moving wall's work to the last digit.  A fifth run puts
    three stale predictions in one substep (events whose disk was
    struck by something else first); all three are skipped.
  * Two ledgers close to rounding: kinetic energy = start + the wall's
    work + the heater + particles added - removed - escaped; and the
    virial, d(sum m r.v)/dt = 2 KE + sum r.F, integrated event by event.
  * The statistics.  A closed box of hard disks has no potential energy,
    so its momenta are uniform on the energy shell: each disk's share of
    the energy is Dirichlet(1,...,1), whatever the masses.  The selfTest
    tolerances are that law's exact sampling moments (and a Monte-Carlo
    chi-square quantile over the same law), not guesses.
  * PhET's model, by its model notes and its minified source: the
    injection (Gaussian temperatures with the mean restored, a pi/2 fan),
    the heater (speeds x (1 + a/800) per 60-fps frame, here as a rate),
    the gauge (P = NkT/V, refreshed every 0.75 ps, with PhET's noise
    law), the lid (it blows off above 20,000 kPa), the hold-constant
    algorithms and their Oops cases, the 1-ps histogram averaging, the
    300-frame flow average.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * Temperature is T = (2/3)<KE>/k: the 3-D equipartition, applied to
    particles that move in two dimensions.  The gauge is P = NkT/V with
    V = width x 8750 pm x 4000 pm.
  * The heater rescales every speed at once; the Ideal wall does no work.
  * Overlapping disks (the pump injects them all at one point) pass
    through each other until they separate, as in PhET.

  WHAT IS NOT MODELLED
  --------------------
  * Attraction (the disks are hard, so there is no van der Waals a, no
    condensation), rotation, internal states, gravity, inelastic or
    quantum effects.  The third dimension is only the nominal depth in V.
  * The virial series drawn in the pressure view stops at B3; past an
    area fraction of about 0.1 the higher terms matter and the curve
    falls below the measurement (B4 is not re-derived here).

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * PhET's moving wall returns v' = u - v (its model notes say so); the
    elastic answer, used here, is v' = 2u - v.  PhET's wall does half the
    work (for points its slow law would be T V^(1/2) = const).
  * PhET's collisions are found after the fact by overlap and fixed up by
    reflecting positions; here they are events at the true contact time.
  * PhET's screens open empty; these open with a gas already in the box,
    because a view that draws nothing is a defect here.  The Explore wall
    has a speed-limit slider (PhET's 800 m/s is the default).
  * Gaps: no stopwatch on the Diffusion view, the heater does not animate
    in Pressure-T mode, an Oops is a banner rather than a dialog, and
    there is no dragging of the tools, no sound and no keyboard help.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from docs/phets/gas-properties_en.html
  (k = 8316 AMU pm^2 ps^-2 K^-1, +1.85e-4 against CODATA's 8314.46;
  1 AMU = 1.66e-27 kg; PhET's 0.00986923 atm per kPa, which is 1 atm =
  101.32503 kPa, -2.7e-7 from the exact 101.325; masses 28 and 4 AMU;
  radii 125 and 87.5 pm; the box, the lid, the limits) and from PhET's
  doc/model.md.  Everything else is derived and pinned in selfTest to
  build/gas-properties/derive.py (exact rational collision algebra, a
  brute-force event-driven MD, bit-exact mulberry32, the Dirichlet
  moments, B2 and B3 of hard disks and the hard-disk adiabat by
  quadrature).  The results above are measured by this file's selfTest.
