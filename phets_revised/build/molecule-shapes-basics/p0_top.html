<title>Molecule shapes: basics &mdash; two to six bonds pushing each other apart on a sphere, and the five shapes they settle into</title>
<!--
  ===================================================================
  molecule-shapes-basics.html -- build a molecule round a central atom
  from single, double and triple bonds and watch it relax into its
  shape; five real molecules with their measured angles; the five
  shapes side by side; and a relaxation from a random start
  ===================================================================

  Remake of PhET Interactive Simulations' Molecule Shapes: Basics
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code;
  no PhET code or assets.  PhET's screens, controls, labels, real-molecule
  table and the numbers marked "PhET's value" are read from its build 1.6.19
  (docs/phets/molecule-shapes-basics_en.html) and its doc/model.md.

  This is the Basics form of molecule-shapes.html, on the same engine: no
  lone pairs anywhere, as in PhET's Basics (no lone-pair button, no Show
  Lone Pairs, no outer lone pairs, no electron-geometry name, and its Real
  Molecules screen carries the five molecules whose central atom has no lone
  pair).  What is left is the part of VSEPR that needs nothing else: equal
  pairs on a sphere, pushing each other as far apart as they can go.

  Four views.  THE MODEL is PhET's Model screen: add single, double and
  triple bonds round the central atom A (six at most), remove the last of a
  kind or all of them, drag an atom round the atom and let go, turn the
  molecule, show the bond angles and the molecule geometry.  REAL MOLECULES
  is PhET's second screen: BeCl2, BF3, CH4, PCl5 and SF6 with their measured
  geometry.  THE SHAPES lays the five side by side.  THE RELAXATION runs
  plain gradient descent from a random start, which for equal pairs always
  ends in the ideal shape.

  THE MODEL
  ---------
  Each bond round A is a point on the unit sphere; every pair of them repels
  with energy 1/d^2, d their 3-D separation, and the shape shown is the
  arrangement of least total energy.  Single, double and triple bonds act
  alike, as in PhET.  With no lone pairs that arrangement is one of five
  ideal geometries, exactly -- which is the whole content of this sim.

  WHAT IS EXACT
  -------------
  Linear 180 deg, trigonal planar 120, tetrahedral arccos(-1/3) =
  109.4712206..., trigonal bipyramidal 90/120/180, octahedral 90/180; the
  energies of 2 to 6 equal pairs, 1/4, 1, 9/4, 17/4, 27/4.  Plain descent
  from random starts (mulberry32, the same seeds in the Python twin) lands on
  each ideal shape to 1e-9 deg, from every start tried: derive.py counts 100
  of 100 for five and for six pairs.  The relaxation is gradient descent with
  a fixed step whose stability margin derive.py checks (eta x lambda_max =
  0.82 < 2); its equilibria agree with scipy's BFGS to 1e-10 deg.  The names
  are PhET's rules.

  WHAT IS MODELLED
  ----------------
  Points on a sphere with a 1/d^2 law is a model, not quantum chemistry.  It
  is enough for these five shapes, and the full sim (molecule-shapes.html)
  shows where it starts to strain: with lone pairs pulled in to PhET's 0.7 it
  bends six of seven measured angles the right way and SF4's equatorial angle
  the wrong way.  The model view's motion is a flow steered onto the
  equilibrium, for looks; only where it ends is physics.

  WHAT IS NOT MODELLED
  --------------------
  Lone pairs (PhET's Basics has none); bond lengths (every bond is drawn at
  one length, as PhET draws them, and PCl5's axial bonds really are longer
  than its equatorial ones); double and triple bonds taking more room than
  single ones; electronegativity; a real molecule's atoms cannot be dragged.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  Real molecules: PhET's RealMoleculeShape table (build 1.6.19), whose notes
  say the data are "pulled from a mix of PubChem and/or reconstructed from
  the best known bond angles".  Stored verbatim as the numbers PhET's
  constructor is given (the bond lengths in angstroms, the tetrahedron's
  elevation -19.471220333 deg); every bond angle shown is computed from them.
  Six pairs at most and the arc-brightness thresholds are PhET's values.
  Every model number is pinned in selfTest to
  build/molecule-shapes/derive.py, the Python twin both sims share.
-->
