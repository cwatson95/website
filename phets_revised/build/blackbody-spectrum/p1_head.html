<title>Blackbody spectrum &mdash; Planck&rsquo;s law, Wien&rsquo;s peak, the Stefan&ndash;Boltzmann area and the colour of heat</title>
<!--
  ===================================================================
  blackbody-spectrum.html — a remake of PhET's Blackbody Spectrum:
  the spectral power density of a blackbody against wavelength
  (Planck's law), where it peaks (Wien), how much it radiates in all
  (Stefan-Boltzmann), what colour it glows, and where the classical
  laws that came before Planck break
  ===================================================================

  Remake of PhET Interactive Simulations' Blackbody Spectrum (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.  Built against PhET's blackbody-spectrum 1.0.26: its
  one screen, every control on it, and its model constants.

  Five views.  THE SPECTRUM is PhET's screen: a thermometer from 200 K to
  11000 K that snaps to 50 K, with PhET's four presets (Earth, Light
  Bulb, Sun, Sirius A); the curve of spectral power density M_lambda =
  pi B_lambda against wavelength on axes that zoom x2 in wavelength
  (0.75 to 48 um) and x5 in power (1.024e-5 to 2500 MW/m^2/um); the
  visible band; the Graph Values marker, dragged along the curve and
  sent back to the peak whenever the temperature changes, as PhET's is;
  the band labels (X-ray, ultraviolet, visible, infrared); the
  intensity, the shaded area sigma T^4; two saved curves; and the glowing
  star with PhET's B, G, R photometer.  THE STAR: the colour of the
  body two ways — PhET's photometer (three samples of the curve) against
  true CIE 1931 colorimetry (the curve integrated against the eye's
  colour-matching functions); the photometer reads the Sun as a cyan
  white and a 3000 K filament as deep orange, colorimetry reads them
  warm white and pale orange.  THE PEAK: Wien's law — the family of
  curves on log-log axes threaded by the locus of peaks (slope -5), and
  every curve collapsing onto one universal shape when scaled by its own
  peak.  THE TOTAL: the Stefan-Boltzmann law, sigma T^4 against T
  (slope 4), and where the power goes band by band.  THE LIMITS: the
  Rayleigh-Jeans law (classical, and infinite in total) and Wien's
  approximation against Planck's law, and the ratio of each to it.

  WHAT IS EXACT HERE
  ------------------
  Planck's law in SI with the exact 2019 defining constants h, c, k;
  sigma, b, c1 = 2 pi h c^2, c2 = hc/k and the frequency-peak constant
  are derived from them and equal scipy.constants (CODATA 2022) to the
  last digit.  The Wien roots x5 = 4.965114231744276 and x3 =
  2.821439372122079 by Newton (checked against Lambert W and 50-digit
  decimal Newton).  Every M_lambda pinned against 50-digit decimal
  arithmetic.  The band fractions by two series — a Bernoulli head
  series whose coefficients come from power-series division, and the
  exponential tail series — joined at x = 2 and pinned against scipy
  quad and exact rationals.  The total pinned against scipy quad and a
  composite Gauss-Legendre rule in ln lambda.  Chromaticities are sums
  over the CIE's own colour-matching table.  Twin:
  build/blackbody-spectrum/derive.py; every reference number is a line
  of build/blackbody-spectrum/refvals.txt.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  The star's colour is PhET's model, reproduced exactly: each channel is
  the curve sampled at 650, 550 and 450 nm, normalised to the brightest
  of the three and dimmed by min(1, 0.02 sqrt(T/K - 798)) (PhET's
  values: 798 K is the Draper point); the halo's radius is 5 + 47.5 r px
  and its opacity 0.3 r, r = 0.02 sqrt(T/K - 798) (PhET's values).  The
  CIE colour is exact colorimetry clipped into the sRGB gamut and
  normalised to its brightest channel; its glow brightness is
  log-compressed, 1 + log10(L/L(6500 K))/12 (display only).  The
  rainbow band fades at its ends by sqrt(min(1, 4 ybar)) (display only).

  NOT MODELLED
  ------------
  Real bodies are not black: no emissivity, no absorption lines (the
  Sun's spectrum is not a Planck curve), no atmosphere.  The presets
  are PhET's round numbers, not measurements.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  h, c, k: the SI (exact).  The CIE 1931 2-degree colour-matching
  functions: the CIE's own table, CIE_xyz_1931_2deg.csv (1 nm, 360-830
  nm, DOI 10.25039/CIE.DS.xvudnb9b, ISO/CIE 11664-1:2019), every fifth
  row embedded verbatim by derive.py; the CIE's Illuminant A table
  (CIE_std_illum_A_1nm.csv) checks the chain: a Planck body at
  2855.496 K reproduces it to its printed precision (4.8e-6) and its
  chromaticity to 4e-8.  sRGB: the IEC 61966-2-1 matrix and transfer
  curve.  683 lm/W: the SI definition of the candela.  PhET's values
  (read from the minified original): the range 200-11000 K and its 50 K
  snap; the presets Earth 250 K, Light Bulb 3000 K, Sun 5800 K,
  Sirius A 9950 K; the zoom ladders; the band edges 10 nm, 380 nm,
  780 nm and 100 um; two saved curves; the photometer.  PhET's own
  constants differ from CODATA by +4.0e-5 (c1), -4.8e-6 (c2), -2.5e-7
  (sigma) and +3.6e-7 (b); this file uses CODATA throughout.
-->

  :root{
    --bg:#070b18; --panel:#0a0c12; --panel2:#10131b; --text:#cfd4de; --dim:#8b93a6;
    --accent:#5ac8e0; --edge:#1e222c; --edge2:#2a2f3d;
    --neon-a:#b8ec4c; --neon-b:#cd35c4;
    /* role colours: green = the computed curve (Planck's law, the area under it),
       orange = the reference (Wien's locus, the saved curves, the classical laws),
       magenta = the live marker (the thermometer thumb, the Graph Values point),
       cyan = structure (the axes, the band edges, the thermometer). */
    --pos:#b8ec4c; --ref:#e8843a; --live:#cd35c4; --wplus:#5ac8e0; --wminus:#e8843a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{background:var(--bg); color:var(--text); display:flex; flex-direction:column;
       font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;}
  header{height:48px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 15px;
         background:var(--panel); border-bottom:1px solid var(--edge);}
  header h1{font-size:15px; font-weight:600; letter-spacing:.2px; white-space:nowrap;}
  header .sub{color:var(--dim); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  nav{margin-left:auto; display:flex; gap:6px; flex-shrink:0;}
  nav button{background:transparent; color:var(--dim); border:1px solid transparent;
             padding:5px 13px; border-radius:15px; font-size:12.5px; cursor:pointer;
             font-family:Georgia, "Times New Roman", serif; letter-spacing:.4px;}
  nav button:hover{color:var(--text);}
  nav button.active{color:#fff; border-color:#556; background:rgba(255,255,255,.06);}

  #wrap{display:flex; flex:1; min-height:0;}
  #stage{position:relative; flex:1; min-width:0;}
  #scene{position:absolute; inset:0; width:100%; height:100%; display:block;
         touch-action:none; cursor:crosshair;}
  #scene.dragging{cursor:grabbing;}

  #readout{position:absolute; top:11px; right:13px; width:280px; pointer-events:none;
           user-select:none; -webkit-user-select:none; text-align:left;
           background:linear-gradient(180deg, rgba(10,12,18,.86), rgba(10,12,18,.66));
           border:1px solid var(--edge2); border-radius:9px; padding:10px 12px 11px;
           text-shadow:0 1px 3px rgba(0,0,0,.8); backdrop-filter:blur(2px);}
  #readout .rname{font:italic 19px Georgia, serif; color:#fff; line-height:1.15;}
  #readout .rname small{font-size:11.5px; color:var(--dim); font-style:normal; display:block;
                        margin-top:2px; letter-spacing:.3px;}
  #readout table{width:100%; border-collapse:collapse; margin-top:8px; font-size:11.5px;}
  #readout td{padding:1.5px 0; color:var(--dim); white-space:nowrap;}
  #readout td.v{color:var(--text); text-align:right; font-variant-numeric:tabular-nums;
                overflow-wrap:anywhere; white-space:normal;}
  #readout td.hd{color:#6f7789; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                 padding-top:8px;}
  #readout .note{margin-top:9px; font-size:10.5px; color:#767e92; line-height:1.5;}
  #readout .note b{color:var(--dim); font-weight:600;}
  #readout .good{color:var(--neon-a);} #readout .bad{color:#e8843a;}
  #readout .legend{margin-top:9px; display:flex; flex-wrap:wrap; gap:3px 10px; font-size:10.5px; color:var(--dim);}
  #readout .legend span{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
  #readout .legend i{width:9px; height:9px; border-radius:2px; display:inline-block;
                     box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);}

  #hint{position:absolute; left:14px; bottom:11px; color:var(--dim); font-size:11px;
        pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9);}
  #tag{position:absolute; left:14px; top:11px; color:var(--dim); font:italic 13px Georgia,serif;
       pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9); max-width:52%;}
  #tag b{color:var(--text); font-style:normal; font-weight:600;
         font-family:-apple-system,sans-serif; font-size:12px;}
  #errbox{position:absolute; left:12px; top:40px; max-width:70%; background:#3a1220; color:#ffb3c0;
          border:1px solid #7c2338; border-radius:6px; padding:8px 12px; font:12px monospace;
          display:none; white-space:pre-wrap; z-index:9;}

  #eqbar{flex-shrink:0; background:var(--panel); border-top:1px solid var(--edge);
         padding:9px 16px 11px; text-align:center; overflow-x:auto; white-space:nowrap;
         font:italic 16px Georgia, "Times New Roman", serif; color:#e9e9f0; line-height:1.55;}
  #eqbar .lhs{color:#fff;}
  #eqbar .hl{color:var(--neon-a); font-style:normal;}
  #eqbar .hl2{color:var(--neon-b); font-style:normal;}
  #eqbar .sm{font:11.5px -apple-system,sans-serif; font-style:normal; color:var(--dim);

  #eqbar sup{font-size:10.5px;} #eqbar sub{font-size:10.5px;}

     derivations for each view below the controls */
  #panel{width:392px; background:var(--panel); border-left:1px solid var(--edge);
         padding:12px 14px 24px; overflow-y:auto; flex-shrink:0;}
  .grp{margin-bottom:14px;}
  .grp h3{font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
          color:#777f90; margin-bottom:7px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:var(--panel2); border:1px solid var(--edge2); color:var(--text);
        border-radius:14px; padding:4px 11px; cursor:pointer; font-size:12.5px;
        font-family:Georgia, serif; font-style:italic; transition:.12s;}
  .chip:hover{border-color:var(--accent);}
  .chip.on{border-color:var(--neon-a); color:var(--neon-a); background:rgba(184,236,76,.09);}
  .sliderrow{display:flex; align-items:center; gap:8px; margin:7px 0;}
  .sliderrow label{font-size:12px; color:var(--dim); width:112px; flex-shrink:0;}
  .sliderrow .val{font:11.5px "SF Mono", Menlo, monospace; color:var(--text); width:76px;
                  text-align:right; flex-shrink:0;}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; min-width:0; height:3px;
                    background:#2a2e38; border-radius:2px; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;

                    border:1px solid #555; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb:hover{background:#fff;}
  .checks{display:flex; flex-direction:column; gap:5px; margin-top:4px;}
  .checks label{font-size:12.5px; color:var(--text); display:flex; align-items:center;
                gap:7px; cursor:pointer;}
  .checks input{accent-color:var(--accent); width:13px; height:13px;}
  .btnrow{display:flex; gap:8px; margin-top:9px;}
  .btnrow button{flex:1; background:var(--panel2); border:1px solid var(--edge2); color:var(--text);
                 border-radius:6px; padding:6px 0; cursor:pointer; font-size:12.5px;}
  .btnrow button:hover{border-color:var(--accent);}
  .tag{font:11px "SF Mono", Menlo, monospace; color:#868e9f; margin-top:5px; line-height:1.55;}
  .tag b{color:var(--text); font-weight:600;} .tag .g{color:var(--neon-a);} .tag .r{color:#e8843a;}
  .src{font:10px "SF Mono", Menlo, monospace; color:#6b7284; margin-top:4px; line-height:1.5;}
  #info{font-size:12px; line-height:1.62; color:var(--dim);}
  #info b{color:var(--text); font-weight:600;}

  /* the mathematics column: numbered equation blocks set in Georgia italic,
     CSS fractions, no network fonts, no MathJax */
  #phys{font-size:12px; line-height:1.62; color:var(--dim);}
  #phys p{margin:6px 0;}
  #phys b{color:var(--text); font-weight:600;}
  #phys i{color:#d8dce6;}
  #phys h4{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
           color:#8a93a8; margin:13px 0 4px;}
  #phys .eq{display:block; margin:7px 0; padding:7px 9px 7px 10px; background:var(--panel2);
            border-left:2px solid var(--accent); border-radius:4px; color:#eceef4;
            font:italic 13.5px/1.75 Georgia, "Times New Roman", serif; overflow-x:auto;
            white-space:nowrap;}
  #phys .eq .n{float:right; color:#6f7789; font:10.5px -apple-system, sans-serif;
               font-style:normal; margin-left:10px; margin-top:2px;}
  #phys .eq .rm{font-style:normal;}
  #phys .eq sup,#phys .eq sub{font-size:9.5px; line-height:0;}
  #phys .frac{display:inline-block; vertical-align:middle; text-align:center; line-height:1.2;
              margin:0 2px; font-size:12.5px;}
  #phys .frac .t{display:block; border-bottom:1px solid #aeb6c6; padding:0 3px 1px;}
  #phys .frac .b{display:block; padding:1px 3px 0;}
  #phys .cite{font:10px "SF Mono", Menlo, monospace; color:#6b7284; line-height:1.5; margin:3px 0 8px;}
  #phys .warn{color:#e8a25a;}
  #phys .ok{color:var(--neon-a);}
  #phys ul{margin:4px 0 4px 16px;}
  #phys li{margin:2px 0;}
  [hidden]{display:none !important;}
</style>
