<title>Quantum coin toss &mdash; a classical coin has a face before you look, a quantum one has amplitudes</title>
<!--
  ===================================================================
  quantum-coin-toss.html — a classical coin against a quantum "coin":
  prepared, flipped or reprepared, hidden, revealed or observed, one at
  a time or 10, 100 or 10 000 at once, against the binomial; and the one
  measurement that tells a hidden face from a superposition
  ===================================================================

  Remake of PhET Interactive Simulations' Quantum Coin Toss (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets.  PhET's Quantum Coin Toss is the Coins screen of its Quantum
  Measurement; this file runs on the same engine as the remake of that sim
  (build/quantum-measurement/: p2_engine.js, p4_coins.js, p5_binom.js, read
  by build/quantum-coin-toss/assemble.py, so the two cannot drift).  The
  screens, controls and constants follow PhET's build 1.0.4
  (docs/phets/quantum-coin-toss_en.html) and quantum-measurement's
  doc/model.md; every number taken from a PhET build is marked "PhET's value"
  in the code.

  Four views.  THE CLASSICAL COIN and THE QUANTUM COIN are PhET's two scenes,
  each with its own state: prepare the coin (heads or tails; up, down or a
  superposition with P(up) = |alpha|^2 in steps of 0.05), send it to be
  measured, then flip, hide and reveal it (classical) or reprepare and
  observe it (quantum), one coin at a time or 10, 100 or 10 000 identical
  coins at once, with the counts against the binomial's Np +- sqrt(Np(1-p)).
  THE BINOMIAL repeats the N-coin experiment and sets the histogram against
  the exact binomial, the spread of the fraction against sqrt(p(1-p)/N), and
  one long run's fraction inside its +-2 sigma funnel.  THE HIDDEN DIFFERENCE
  asks what makes the quantum coin quantum: face-on, a hidden classical face
  and a superposition give exactly the same odds, but turned sideways (a
  measurement along x) the hidden face gives 1/2 and the superposition
  (1 + 2 sqrt(p(1-p)))/2, because one is a mixture and the other is not.

  WHAT IS EXACT HERE
  ------------------
  The Born rule, P(up along n) = (1 + r.n)/2.  The binomial pmf (Stirling
  lnFact against math.lgamma, the pmf against scipy to 1e-10).  The mixture
  and the superposition as density matrices: the same diagonal, and an
  off-diagonal sqrt(p(1-p)) that only the superposition has; purity
  p^2 + (1-p)^2 against 1; P(+x) = 1/2 against (1 + 2 sqrt(p(1-p)))/2.
  Every random draw comes from one seeded PRNG (mulberry32), mirrored bit
  for bit in the Python twins (build/quantum-measurement/derive.py and
  build/quantum-coin-toss/derive.py), so every seeded count in selfTest is an
  integer pinned exactly AND tested against its law with a tolerance taken
  from its own variance (4 sigma, a chi-square below scipy's 99.9 % quantile).

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  PhET's values: a flip takes 1 s; 10, 100 or 10 000 identical coins; bias
  steps of 0.05; classical coins arrive showing the prepared face (or hidden,
  with PhET's "classical coins start hidden" preference); quantum coins
  arrive unobserved.  The coins do not fly across the screen when they are
  sent to be measured (PhET animates them); the test boxes simply fill.  The
  classical and quantum scenes are two tabs rather than a switch.  The
  sideways measurement of the fourth view is not in PhET's screen.

  WHAT IS NOT MODELLED
  --------------------
  Real coins: no physics of the toss (the classical coin is a biased random
  draw, exactly as in PhET), no entanglement between coins, no decoherence;
  measurement is projective and instantaneous; no sounds and no
  screen-reader descriptions.
-->
