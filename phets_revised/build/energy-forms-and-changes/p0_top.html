  ===================================================================
  energy-forms-and-changes.html — iron and brick blocks, beakers of
  water and olive oil, two burners and the room; then a source, a
  converter and a user joined in a chain.  PhET's model, with every
  joule on a ledger that closes to machine precision
  ===================================================================

  Remake of PhET Interactive Simulations' Energy Forms and Changes
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code;
  no PhET code or assets.  The model, its constants and its controls follow
  PhET's build 1.4.24 (docs/phets/energy-forms-and-changes_en.html) and its
  doc/model.md; every number taken from that build is marked "PhET's value"
  in the code.

  Five views.  THE BENCH is PhET's Intro screen: an iron block, a brick, a
  beaker of water and one of olive oil on six spots, two heat/cool burners
  (linkable), four thermometers, energy symbols, play, step and x4.  Drag a
  body to stack it, sit it on a burner or drop it into a beaker.  THE
  SYSTEMS is PhET's Systems screen: a source (the cyclist, who needs
  feeding; a faucet; the sun behind adjustable clouds; a teapot on a
  burner), a converter (a water-wheel generator, a solar panel) and a user
  (a beaker heater, an incandescent bulb, a fluorescent bulb, a fan), with
  energy chunks labelled by form: mechanical, electrical, thermal, light,
  chemical.  THE HEAT LEDGER records the bench: every body's temperature,
  and the first law as three accounts (the bodies, the burners' work, the
  room) whose sum is printed to the last digit.  THE ENERGY FLOW is the
  chain as a Sankey diagram with every store and loss.  EQUILIBRIUM sets
  one pair of bodies in contact and lays PhET's stepped model over the
  exact solution, with PhET's specific heats beside the real ones.

  WHICH SPECIFIC HEATS, AND WHY
  -----------------------------
  The bench runs on PhET's values (below), because the point of a remake is
  PhET's behaviour: its chunk counts, heating times and equilibria.  Two of
  them are far from the real material, and EQUILIBRIUM puts the real values
  one chip away so the difference can be seen rather than described:
                  PhET c, rho            real c, rho (source)
      iron        450, 7800         449.35 J/(kg K) (NIST-JANAF Cp 25.094
                                     J/(mol K) at 298.15 K / 55.845 g/mol),
                                     7874 kg/m^3 (20 C, Arblaster 2018)
      brick       840, 3300         840 (Wikipedia's building-materials
                                     table; Engineering ToolBox: 900 for
                                     common brick), 1400-2400 kg/m^3
                                     (ToolBox); 1900 taken as the middle
      water      3000, 1000         4182.32, 997.577 (NIST Chemistry
                                     WebBook, IAPWS-95, 296 K, 1 atm)
      olive oil  1411,  916         1970 (Engineering ToolBox), 911 (sg at
                                     20 C, USDA grading manual)
  PhET's water has 28 % too little specific heat (3000 against 4182), and
  its brick is 1.7x the middle of the handbook range of densities.  PhET's
  own model notes say that some values were chosen for clarity rather than
  realism (the rate of exchange with the air above all).

  THE MODEL (PhET's values)
  -------------------------
  E = m c T for every body, T = E/(m c); a beaker's T stops at its boiling
  point (373.15 K, 573.15 K) and a block's energy past 620 K goes to the
  room.  Blocks are 4.5 cm cubes; beakers are 8.5 cm across and 1.1x as
  tall, half full, and a block inside raises the level by 120 x its
  submerged area (m^2), capped at full.  Each step (1/60 s, PhET's) is
  PhET's EFACIntroModel.stepModel in PhET's order:
    1. every pair of bodies once, blocks first: dQ = k L (T_b - T_a) dt with
       k = 1000 W/(m K) and L PhET's contact length (the overlap of a
       stacked pair, the perimeter of the wetted part of an immersed block);
    2. each burner: 5000 x level W into whatever sits on it (never below
       273.15 K), or 1500 x level W into the room if nothing does;
    3. the room: every body not immersed trades k_air L (T - 296 K) dt with
       it, k_air = 30 W/(m K) round its whole perimeter, and hands it any
       energy past its cap.  The room is an infinite bath at 296 K, as in
       PhET (its energy never changes).
  The Systems screen runs PhET's rates: 10 kW at most anywhere (PhET's
  MAX_ENERGY_PRODUCTION_RATE); the cyclist's crank up to 3 pi rad/s,
  changing at pi/2 rad/s^2, 21 chunks of food; the faucet's water taking
  0.4 s to fall; the sun's 10 kW dimmed to 0.1 + 0.9(1 - clouds) (none at
  full cloud); the teapot's steam lagging its burner by 10 s; the generator
  lagging its water by 5/3 s; the solar panel at 68 %; the heater's coil
  ramping at 0.5/s and putting 5000 W x its heat into a 7.5 cm beaker; the
  bulbs splitting light and heat 65/35 (incandescent) and 80/20
  (fluorescent); the fan turning at 0.0051 rad/s per watt, not below 4 rad/s.

  WHAT IS EXACT HERE
  ------------------
  The bench's ledger: at every step the change in the bodies' energy plus
  what the room took equals what the burners did, to machine precision
  (asserted per step and over whole runs), and the chunks obey the exact
  identity EPC x (chunks - chunks at start) = (E - E at start) + the energy
  still in transit on each link, with EPC = 5019.022 J, PhET's
  ENERGY_PER_CHUNK.  Equilibria against the exact solution of the linear
  two-body-and-room system (a closed-form 2x2 matrix exponential, checked
  against scipy.linalg.expm); T_eq = (C1 T1 + C2 T2)/(C1 + C2) with the room
  shut out.  On the Systems screen every element's input equals its output
  plus its losses plus the change in its store, per step and over a run,
  and the chunks on every channel number floor(energy/EPC).  Every value is
  pinned in selfTest to build/energy-forms-and-changes/refvals.txt, the
  printed output of derive.py, an independent Python twin.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  PhET's Systems screen does not close its own ledger, and the remake does:
    - the teapot: PhET's steam power settles at 20 kW x heat (to its 10 kW
      cap), twice the burner's power below the cap.  Here the kettle is a
      store: 80 % of the burner's heat goes in (PhET's chunk split), steam
      leaves it with PhET's 10 s time constant, so steam = 0.8 x burner;
    - the cyclist: PhET's output is 10 kW x crank/max, while its chunks send
      one in six to heat.  Here food burns at 10 kW x crank/max with a load
      (2 kW without, PhET's rates), 5/6 of it reaching the pedals;
    - the generator: PhET's water-driven wheel turns at a speed set by the
      energy PER FRAME, so its efficiency depends on the frame rate: 69 %
      at 60 frames/s, while at 30 frames/s it puts out 1.38 times what it
      takes in (below its speed limit).  Here the wheel is a store with
      PhET's 5/3 s lag and its 60-frame efficiency, 13/(6 pi) = 68.97 %;
      belted to the cyclist it is lossless, as in PhET;
    - the heater: PhET heats the water at 5000 W x heat and says nothing of
      the rest; here the rest is the coil's loss to the room;
    - the fan: PhET sends 1 chunk in 14 to heat at full power (fewer when
      slower, by a temperature counter); here 1/14 at every power;
    - chunks are a quantisation of the ledger (each channel emits one per
      EPC of its flow) rather than PhET's random paths and preloading.
  Other choices: one fixed step of 1/60 s (PhET steps once per frame);
  dropped bodies snap to PhET's six spots and stacking rules at once
  (PhET lets them fall); the burners' levers stay where they are left
  (PhET's spring back to off, unless its stickyBurners query parameter is
  set); normal and x4 time on the bench (PhET hides x4 behind its
  showSpeedControls query parameter); one play/pause for both screens; the
  Systems screen opens on the faucet running (PhET opens on the cyclist,
  not pedalling); energy symbols start shown; thermometers print their
  value in degrees beside the column.

  WHAT IS NOT MODELLED
  --------------------
  Freezing and melting (nothing goes below 0 C), boiling as a process
  (energy past the boiling point leaves as steam at once), the heat
  capacities of the beakers' glass, radiation, the room warming up, and
  any kinetic energy in the bicycle or the fan.  No sounds, no keyboard
  dragging and no screen-reader descriptions.
