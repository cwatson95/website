<!--
  ===================================================================
  geometric-optics.html — an object in front of a lens or a mirror:
  where the image goes, how big it is, which way up, and whether it
  is real or virtual — with every ray traced so that it AGREES with
  1/d_o + 1/d_i = 1/f rather than merely looking as though it does
  ===================================================================

  Remake of PhET Interactive Simulations' Geometric Optics (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets. The model, its constants and its controls follow PhET's build 1.3.16
  (docs/phets/geometric-optics_en.html) and that repository's doc/model.md;
  every number taken from the build is marked "PhET's value" in the code, in
  the panel and on the canvas.

  SIX VIEWS.  THE LENS BENCH is PhET's Lens screen: drag the object (a pencil,
  a penguin, a star, an arrow or a point light source) in front of a convex or
  concave lens and watch the image answer.  The rays come in PhET's four modes
  — marginal, principal, many and none — the focal points F and the 2F points
  are marked on both sides, a second point of interest rides on the object, a
  virtual image can be shown or hidden, PhET's "guides" can be switched on, and
  with the light source chosen the projection screen appears with the two light
  spots on it.  THE MIRROR BENCH is PhET's Mirror screen: concave, convex or
  flat, with F and 2F on the side the mirror actually has them.  THE CONJUGATE
  CURVE is the governing law drawn as a curve: d_i against d_o is a rectangular
  hyperbola with asymptotes d_o = f and d_i = f, the magnification is the other
  branch of the same statement, and the pole at d_o = f — the image at infinity
  — is the one place the equation has no answer.  THE LENS MAKER is where f
  comes from: the (n, R) plane with the contours of f = R/(2(n−1)) on it,
  PhET's two focal-length models (set f directly at fixed n = 1.5, or set R and
  n and let f follow), and the fact that the lens PhET DRAWS is not the lens it
  models.  THE GUIDES is PhET's own invention, reproduced exactly and then
  measured: a pair of hinged arms that bend the light by a fixed angle, which
  locate the image to 4.4 % at PhET's own defaults and become exact only when
  every angle in the picture is small.  THE REAL LENS is the same lens made of
  glass: the identical n, R and diameter, two spherical surfaces, exact vector
  Snell at each of them — and a focus that walks 43 cm as the ray height goes
  from the axis to the rim.

  WHAT IS EXACT HERE
  ------------------
  The thin-optic equation and everything that follows from it.  d_i =
  f d_o/(d_o − f) and m = −d_i/d_o are solved, not approximated, and the suite
  asserts the residual 1/d_o + 1/d_i − 1/f against zero and against a scipy
  brentq root of the same equation (3.4e-15 over 15 pairs); Newton's form
  (d_o − f)(d_i − f) = f² holds to 4.5e-16 over 35 pairs.  Ray tracing is not a
  separate drawing: every outgoing ray is built from the one-line paraxial law
  u' = u − h/f, and the suite asserts that a ray leaving the object at ANY
  height h on the optic passes through the image point the equation gives —
  1.8e-13 over 1200 configurations, the residual set by the lever arm, not by
  the algebra — and that the three principal rays meet there pairwise (1.0e-15
  over 360 configurations).  The lens maker's equation reduces to PhET's
  f = R/(2(n−1)) to 1.4e-16 over twenty (n, R) pairs.  The light spot on the
  projection screen is the exact cone from the lens rim through the image,
  D|x_s − d_i|/d_i, agreeing with the two-ray construction to 0.  The real
  lens's ray trace uses a closed-form sphere intersection checked against
  Newton on the sag (1.4e-14 cm over five heights), and its longitudinal
  spherical aberration is shown to be O(h²) by measured ratios (4.0001 per
  halving) rather than asserted to be.  Every reference value in selfTest is a
  line of build/geometric-optics/refvals.txt, the printed output of derive.py.

  WHAT IS PhET'S, AND WHERE IT CAME FROM
  --------------------------------------
  Read out of the minified build: the focal-length range 40–120 cm (default 80)
  and the radius range 40–120 cm for the lens, 75–150 cm (default 90) and
  150–300 cm (default 180) for the mirror, the index range 1.2–1.8 (default
  1.5), the diameter range 60–120 cm (default 80), the fixed n = 1.5 of the
  direct lens model and the n = 2 PhET gives a mirror so that f = R/2 falls out
  of the same formula, the flat mirror's stand-in f = 100 000 cm, the object
  positions (−170, 27) framed / (−160, 60) and (−125, 30) arrows / (−170, 20)
  and (−124, −20) lights on the Lens screen and (−150, 72.5), (−150, 60),
  (−165, 30) on the Mirror screen, the second point's −56.5 cm offset, the
  projection screen at x = 200 cm with its 123 cm height, the 40 cm minimum
  object distance, the 100 cm maximum off-axis distance, the 260 and 160 cm
  rulers, the 120° fan and 20·(⌊d_o/300⌋+1) count of the "many" rays, the
  guides' own arithmetic, and the "hollywooded" lens sag (D/2)²/(2(|R|+100))
  that its artwork uses instead of the true one.  PhET's doc/model.md prints
  the lens maker's equation as f = R/(2(1−n)); its code computes the magnitude
  as |R|/(2(n−1)) and puts the sign on from the surface type, which is what is
  implemented here.

  WHAT IS MODELLED, AND WHAT IS NOT MODELLED AT ALL
  -------------------------------------------------
  PhET's optic is ideal: no spherical aberration, no coma, no chromatic
  dispersion, no thickness.  The first five views keep that model, because it
  is the model the sim is about; THE REAL LENS is the honest counterweight and
  is labelled as a different object on its own canvas.  Nothing here models
  diffraction, so nothing here has a resolution limit; the "light spot" is a
  geometric shadow, and its brightness is PhET's own formula (a lens-diameter
  term times 14/spot-diameter, clamped to [0,1]), not a radiometric
  calculation — the page says so where it is drawn.  The flat mirror is PhET's
  f = 100 000 cm stand-in rather than a true plane, which puts its image
  0.23 cm behind where a plane mirror would and magnifies by 1.0015 instead of
  1; both numbers are printed rather than hidden.  The objects are drawn as
  simple outlines, not PhET's artwork.  The real lens's edge thickness is
  chosen (2 cm), not PhET's — PhET never gives its lens a thickness at all.
