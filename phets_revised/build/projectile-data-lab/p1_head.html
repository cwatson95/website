<title>Projectile data lab &mdash; launchers that scatter: histograms, mean and standard deviation, sampling distributions, and the exact law behind them</title>
<!--
  ===================================================================
  projectile-data-lab.html — Remake of PhET Interactive Simulations'
  Projectile Data Lab (University of Colorado Boulder,
  phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.
  ===================================================================

  Six views.  THE FIELD is PhET's Variability screen: six mystery
  launchers with deliberately unequal spreads, single or continuous
  fire onto a 100 m field, the paths, the landing histogram with its
  bin width, and the six fields you can fill independently.  THE
  SOURCES is PhET's Sources screen: a custom launcher whose mechanism
  (spring, pressure, explosion) sets the speed spread and whose angle
  stabiliser sets the angle spread, three projectiles that scale the
  speed, and four launcher orientations.  THE MEASURES is PhET's
  Measures screen: the mean, the standard deviation (n − 1, as PhET
  computes it), the individual values, and the interval tool, which
  reports the percentage of the data between two draggable edges.
  THE SAMPLING is PhET's Sampling screen: samples of n = 2, 5, 15 or
  40, one mean per sample, and the histogram of those means with its
  standard error.  THE EXACT LAW and THE LIMIT THEOREM are house
  additions: the probability density that PhET's mechanism implies,
  computed rather than drawn, and the central limit theorem measured
  against σ/√n.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * PhET's mechanism is two independent Gaussians — a launch speed and
    a launch angle — pushed through R = (v cos θ/g)(v sin θ +
    √(v² sin²θ + 2gh)).  That makes the landing distance's whole
    distribution a closed problem, not something to be sampled: for
    h = 0, R = v² sin 2θ/g, and since E[v^2k] and E[sin^k 2θ] both have
    exact Gaussian forms, so does every moment of R.
  * The exact mean is (1 + σ_v²/μ_v²)·e^(−2σ_θ²) times the no-jitter
    value v² sin 2θ/g — exactly, at all eighteen launcher × angle
    settings.  The two factors pull opposite ways: the SPEED spread
    lengthens the mean range (E[v²] = μ² + σ²) and the ANGLE spread
    shortens it (E[sin 2θ] = sin 2μ·e^(−2σ²)), and neither wins
    everywhere.  Twelve of the eighteen land short — mystery launcher 2
    averages 50.084 m where the naive value says 50.849, 1.53 % high —
    and six land LONG, launchers 3 and 5, whose speed spread beats
    their angle spread.
  * PhET's own spread estimate is the delta method (it sets the
    Sampling thumbnails' x-range from it).  Against the exact standard
    deviation it is LOW in four of the five flat cases — by 0.68 % for
    launcher 2 and 0.04–0.06 % for the rest — and HIGH by 5×10⁻⁶ at
    45°, where cos 2θ = 0 kills the angle term and only the speed term
    survives.  Small, signed, and derived here rather than guessed.
  * A launcher at 30° and the same launcher at 60° land with exactly
    the SAME distribution of distance (sin 2θ is symmetric about 45°,
    and so is the 0–90° truncation) — the flight times differ, the
    histograms do not.
  * The central limit theorem is asserted, not illustrated: over 4000
    samples the measured standard error of the mean matches σ/√n at
    n = 2, 5, 15 and 40, each within its own sampling spread
    σ_n√((κ_n+2)/4M), which is computed and not chosen.

  WHAT IS EXACT
  -------------
  * The trajectory.  PhET's closed forms for the range and the flight
    time are re-derived in derive.py and checked against the root of
    y(t) = 0 by brentq (1e-16) and against a marched trajectory
    (1e-11, the accumulated rounding of 4e5 steps).  The maximum-range
    angle from a height, cos 2θ* = gh/(v² + gh), is checked against a
    numerical argmax.
  * The random stream.  mulberry32 seeded per field, Box-Muller with
    one pair of uniforms per value, bit-identical to derive.py: the
    page and the Python twin generate the SAME 500 landing distances,
    and the page's mean, median, standard deviation (both conventions)
    and every histogram bin count are pinned against numpy's on that
    sample.
  * The distribution.  PhET re-draws the angle while it falls outside
    (0°, 90°) — unless the launcher is the raised one, where it does
    not — and re-draws the speed while it is ≤ 0, so both are
    truncated normals.  The moments come from a 96×96 Gauss-Legendre
    product rule over the truncated z-ranges, the same nodes and
    weights in the page and in derive.py, checked there against
    scipy's adaptive quadrature (1e-15), against a 8e6-draw Monte
    Carlo of the actual re-draw mechanism, and against the closed form
    of the untruncated model (whose difference, 5.5e-8 m at worst, is
    what "the truncation is negligible" means here).
  * The density.  f_R(r) = ∫ f_θ(θ) f_v(v*(r,θ))/|∂R/∂v| dθ, with
    v*(r,θ) in closed form when h = 0 and by Newton otherwise.  It
    integrates to 1 and to the exact mean to 1e-9, and matches an
    8e6-draw Monte-Carlo histogram at worst |z| = 2.25 over 24 bins —
    compared bin-average to bin-average, because f at the midpoint
    would be 2.6e-3 off and the noise is only 1.1e-3.
  * The statistics.  Binning is PhET's floor(x/w)·w; the standard
    deviation is the n − 1 one PhET uses and is null below two
    projectiles; the standard error is s/√n; the interval tool counts
    x in [lo, hi] inclusive.  All are pinned against numpy.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * No air resistance at all, g = 9.81 m/s², a 100 m field, a 12 m
    raised launcher, and PhET's launcher table: spring 23 ± 0.5 m/s,
    pressure 24 ± 0.2, explosion 25 ± 1.2; angle spreads 0.2°–5°;
    projectile speed multipliers 1, 1.1 and 0.9.
  * Continuous fire every 0.7 s (PhET's minimum), at most 500
    projectiles a field and 200 samples.  A SAMPLE is paced by PhET's
    own totalSampleTime — 0.75 s at n = 2, 2 s at 5, 5 s at 15 and 9 s
    at 40 — with the n launches spread evenly over it and their flights
    overlapping, so a bigger sample fires faster per shot, not slower.

  WHAT IS NOT MODELLED
  --------------------
  * Drag, spin, wind, the projectile's size, the ground's slope: a
    landing distance here depends on nothing but the launch speed and
    angle, which is what makes the exact law available.
  * The launcher's own geometry (PhET's barrel raises the launch point
    slightly); here the launch point is the origin except on the
    raised launcher, where it is 12 m up, as PhET's model says.

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * PhET's sound, its keyboard help, its PhET-iO instrumentation and
    its measuring tape and stopwatch are not here; the interval tool
    is, because it is the one tool that computes a statistic.
  * PhET's histogram can be set by total bins as well as by bin width;
    both are here, and the two analysis views are new.
  * The fields open with data already in them, because a view that
    draws nothing is a defect in this collection.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from docs/phets/projectile-data-lab_en.html
  (g = 9.81, MAX_FIELD_DISTANCE = 100, RAISED_LAUNCHER_HEIGHT = 12,
  ANGLE_STANDARD_DEVIATION_RANGE = 0.2–5°, the three mechanisms, the
  six mystery launchers, the three projectile types, the four
  orientations, the sample sizes 2/5/15/40, the bin widths, the
  interval tool's 40 and 60 m) and are cited as PhET's values.
  Everything else is derived and pinned in selfTest to
  build/projectile-data-lab/derive.py, whose printed output is
  refvals.txt.
-->
