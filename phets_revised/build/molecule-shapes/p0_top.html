<title>Molecule shapes &mdash; electron pairs that repel on a sphere, the AXE table they build, and the measured molecules beside them</title>
<!--
  ===================================================================
  molecule-shapes.html -- build a molecule round a central atom from
  single, double and triple bonds and lone pairs and watch it relax
  into its shape; thirteen real molecules with their measured angles
  beside the model; the whole AXE table; how far the lone pairs bend
  the angles; and a relaxation from a random start
  ===================================================================

  Remake of PhET Interactive Simulations' Molecule Shapes (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets.  PhET's screens, controls, labels, real-molecule table and the
  numbers marked "PhET's value" are read from its build 1.6.19
  (docs/phets/molecule-shapes_en.html) and its doc/model.md.

  Five views.  THE MODEL is PhET's Model screen: add single, double and
  triple bonds and lone pairs round the central atom A (six at most),
  remove the last of a kind or all of them, drag any pair round the atom
  and let go, turn the molecule; show the lone pairs, the bond angles, the
  molecule geometry and the electron geometry.  REAL MOLECULES is PhET's
  second screen: its thirteen molecules with their measured geometry, a
  Real / Model switch, the central and the outer lone pairs.  THE AXE
  TABLE lays out all fifteen classes of steric number 2 to 6 at once.
  THE SQUEEZE plots how far each lone-pair class bends its bond angle as
  the lone pairs are pulled in, with PhET's measured molecules beside the
  curves.  THE RELAXATION runs plain gradient descent from a random start.

  THE MODEL
  ---------
  Each electron pair round A is a point on a sphere: a bond on the unit
  sphere, a lone pair on a smaller one of radius rho (PhET's value 0.7: its
  lone pairs sit at 7 against 10 for its bonds).  Every pair of pairs repels
  with energy 1/d^2, d their 3-D separation, and the shape shown is the
  arrangement of least total energy.  Single, double and triple bonds act
  alike, as in PhET.  A pulled-in lone pair is closer to everything, so it
  pushes harder: that alone produces every VSEPR lone-pair effect the
  measured molecules show but one.  The rho slider runs from PhET's 0.7 to
  1; at 1 a lone pair is a bond.

  PhET's own Model screen steers a Coulomb 1/d repulsion toward the ideal
  slots with an attractor, so it shows the ideal angles.  This file needs
  no attractor: derive.py audits every lone-pair class at every rho from
  0.60 to 1.00 and finds that, for rho >= 0.64, the VSEPR arrangement
  (lone pairs equatorial in the bipyramid, trans in the octahedron) is the
  global minimum over every assignment of the pairs to the slots and 16
  random starts, keeps its shape, and is a true local minimum (Hessian).
  The same audit shows why the law is 1/d^2: with Coulomb's 1/d at rho 0.7
  ClF3 would be trigonal planar, and charge-weighted lone pairs (all on one
  sphere) make XeF4 cis at every exponent tried.

  WHAT IS EXACT
  -------------
  The ideal geometries: linear 180 deg, trigonal planar 120, tetrahedral
  arccos(-1/3) = 109.4712206..., trigonal bipyramidal 90/120/180,
  octahedral 90/180; the equal-pair energies 1/4, 1, 9/4, 17/4, 27/4.
  Plain descent from random starts (mulberry32, the same seeds in the
  Python twin) lands on each ideal shape to 1e-9 deg, and every class at
  rho = 1 is its ideal shape.  The relaxation is gradient descent with a
  fixed step whose stability margin derive.py checks (eta x lambda_max =
  0.82 < 2); its equilibria agree with scipy's BFGS to 1e-10 deg.  The
  AXE names are PhET's rules, all 22 of them.  The directions: with the
  lone pairs pulled in, AX2E bends below 120, AX2E2 and AX3E below
  109.47, the seesaw's axial pair below 180, T-shaped and square-pyramidal
  arms below 90; AX2E3, AX4E2 and AX2E4 stay exactly 180, 90, 180.

  WHAT IS MODELLED, AND WHERE IT FAILS
  ------------------------------------
  Point pairs on two spheres with a 1/d^2 law is a model, not quantum
  chemistry.  It bends the angles the right way for six of the seven
  measured lone-pair angles; SF4's equatorial F-S-F is the exception:
  every point model tried in the build opens it (121.2 deg at rho 0.7)
  where the molecule closes it to 101.6.  Its sizes are also too small in
  places: no rho reaches H2O's 104.5, ClF3's 87.5 or BrF5's 84.8.  Both
  are printed on the canvas of the squeeze view.  The model view's motion
  is a flow steered onto the equilibrium, for looks; only where it ends
  is physics.

  WHAT IS NOT MODELLED
  --------------------
  Bond lengths (every bond is drawn at one length, as PhET draws them);
  double and triple bonds taking more room than single ones; the outer
  atoms' own lone pairs pushing on anything (they are drawn only, as in
  PhET); electronegativity; a real molecule's atoms cannot be dragged.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  Real molecules: PhET's RealMoleculeShape table (build 1.6.19), whose
  notes say the data are "pulled from a mix of PubChem and/or
  reconstructed from the best known bond angles".  Stored verbatim as the
  numbers PhET's constructor is given (104.5 deg for H2O, 119 for SO2,
  87.5 for ClF3, 84.8 for BrF5, 173.1 and 101.6 for SF4, NH3's polar angle
  1.202623030417028 rad = H-N-H 107.8 deg, the tetrahedron's elevation
  -19.471220333 deg, the bond lengths in angstroms); every bond angle shown
  is computed from them.  rho = 0.7, the at-most-six rule, the lone-pair
  slot order and the arc-brightness thresholds are PhET's values.  Every
  model number is pinned in selfTest to build/molecule-shapes/derive.py.
-->
