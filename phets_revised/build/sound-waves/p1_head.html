<title>Sound Waves &mdash; pressure in the air, on a lattice</title>
<!--
  ===================================================================
  sound-waves.html — a remake of PhET's Sound Waves: a loudspeaker in
  a ten-metre room, the pressure you can see, a second speaker, a
  reflecting wall, and what happens to sound when the air is taken
  away
  ===================================================================

  Remake of PhET Interactive Simulations' Sound Waves (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.  Built against PhET's sound-waves 1.1.11: its five
  screens (Intro, Measure, Two Sources, Reflection, Air Pressure),
  their controls, and its model constants, read from the minified
  original in docs/phets/sound-waves_en.html.

  Six views.  THE SPEAKER, THE BENCH, TWO SPEAKERS, THE WALL and THIN
  AIR are PhET's five screens: one hard source on a 2-D lattice, with
  frequency (100-1000 Hz) and amplitude (0-10), PhET's continuous /
  pulse button, a listener you drag, PhET's 5 m ruler and its
  stopwatch, a second speaker whose height you set, a reflecting wall
  with PhET's position and angle sliders, and PhET's "Air Density in
  Box" from 1 atm to nothing.  WAVELENGTH AND SPEED (analysis) is this
  file's own: lambda = v/f across the whole slider with the wavelength
  MEASURED on the running lattice, the error of that measurement
  beside what PhET's single fixed time step does to the same
  wavelengths, and the lattice's own phase speed, group speed and
  anisotropy, which is what sets the size of the lattice.

  WHAT IS EXACT HERE
  ------------------
  The lattice is PhET's scheme: u_tt = v^2 lap u as a 5-point leapfrog
  at Courant number C = 1/2 with Mur's second-order absorbing edge,
  copied from the engine built and pinned for wave-interference.html
  (build/wave-interference/p2_engine.js, API in its ENGINE.md) and
  re-derived from scratch in build/sound-waves/derive.py, which also
  falsifies the stencil independently by putting an exact lattice plane
  wave through it (residual 5e-15).  The time step is SOLVED at every
  frequency from the lattice's own dispersion relation
  sin^2(w dt/2) = C^2 [sin^2(kx dx/2) + sin^2(ky dx/2)], so the
  wavelength v/f and the period 1/f are exact along the lattice axes.
  Measured on the lattice itself, by a least-squares fit against the
  drive's own phase, lambda agrees with v/f to 0.05 % from 325 Hz to
  1000 Hz and to 0.35 % at 100 Hz, where the fit window holds only 1.4
  wavelengths.  PhET's one fixed step instead leaves its wavelengths
  1.3 % short at 100 Hz and 12.8 % short at 1000 Hz.
  The second speaker and the reflecting wall are EXACT superpositions
  of the one lattice field, which is also PhET's construction: the
  equation is linear, so a source one row down contributes u shifted
  one row down, and mirroring is an isometry, so u at the mirror of P
  is precisely the field of the image source at P.  The consequences
  are checked rather than assumed: the angles of incidence and
  reflection agree to 3e-15, the reflected path is Fermat's shortest
  to 5e-15, and the normal derivative of the drawn field vanishes on
  the wall to 5e-13.  The quiet hyperbolae |r1 - r2| = (m + 1/2)lambda
  agree with a brentq scan of the path difference to 6e-13 and their
  asymptotes with asin((m + 1/2)lambda/d) to 1e-16.
  The speed of sound is PhET's 343 m/s, which is the ideal gas
  sqrt(gamma R T / M) at 19.60 C (at 20.00 C it is 343.235 m/s, 0.068 %
  higher); gamma = 7/5, R = 8.314462618 J/mol/K exactly, M = 28.9647
  g/mol for standard dry air.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  Sound is scalar, linear and lossless, and the source is a hard
  (Dirichlet) cell, as PhET's is, so it is a LINE source in two
  dimensions and its waves fade as 1/sqrt(r) rather than 1/r (the
  measured envelope power is -0.46 to -0.51).  PhET drives its source
  with -sin and this engine with +sin: the same solution with the first
  half-period the other way up.  The lattice is 231 x 231 with PhET's
  20-cell pad, not PhET's 151: on PhET's own lattice the top of this
  sim's frequency slider has only 3.81 cells per wavelength.  Even at
  231 the square lattice is not isotropic — at 1000 Hz a wave along the
  diagonal is 2.0 % longer than one along an axis and the group speed
  is 8.8 % below v itself, 6.1 % below the phase speed the lattice
  really carries (0.59 % and 2.6 % at the default 550 Hz), which is drawn and labelled in the analysis view and is why the
  measured quiet lines sit up to 2.5 cells outside the continuum
  hyperbolae.  Air parcels are pushed along grad p (xi = grad p /
  rho omega^2 at one frequency), exaggerated so that a full-contrast
  wave moves a parcel 0.3 of the parcel spacing.  Colour: a plain black
  to white ramp, white for compression, +/-2 in lattice units at full
  contrast; PhET's own mapping is asymmetric (+2 white, -1.5 black).
  Removing the air scales the drive with the density, as PhET does;
  the honest consequence, drawn in the analysis panel of that view, is
  that the SPEED does not change at all (c = sqrt(gamma p / rho) and p
  and rho fall together at fixed temperature) while the loudness falls
  as 20 log10(rho/rho0) decibels.

  NOT MODELLED
  ------------
  Absorption in air and at the wall (the wall is perfectly rigid and
  reflects everything), a finite wall (the image construction is that
  of an infinite plane, and the shadow behind it is drawn as a hard
  edge with no diffraction), the wave leaving through the room's other
  sides other than as PhET's absorbing edge, and the breakdown of the
  continuum in a rarefied gas — the model stays a wave at every
  density, whereas a real gas stops carrying a 1000 Hz sound once the
  mean free path reaches the wavelength, near 2e-7 atm.  PhET's own
  display trick, a linear taper (85 - r)/85 in lattice cells that fades
  its drawn field to nothing 7.66 m from the speaker, is NOT copied:
  what is drawn here is the field the lattice has.  PhET's temporal
  mask (which hides lattice ringing after a source stops), its
  interpolation between lattice frames, and its draggable stopwatch and
  ruler boxes are not reproduced; the ruler and the listener are
  dragged on the picture and the stopwatch is a readout.  One default
  differs from PhET's, so that a view shows something the moment it
  opens: the speaker starts ON (PhET opens every screen waiting for the
  button).

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's values, read from docs/phets/sound-waves_en.html (1.1.11): the
  wave area (1000 model units = 10 m, its ruler being 500 units long
  and labelled 0 to 5 m), the speed 34.3 cm/ms = 343 m/s, the frequency
  range 0.1 to 1 per ms shown as 100 to 1000 Hz with 0.55 initial, the
  amplitude range 0 to 10 with 5 initial, the source calibration 1.2,
  the lattice 151 with a 20-cell pad and the source column 40 (1.80 m
  into the box), 20 x 111/61 lattice steps per second of wall time and
  the time scale 2.4187847116091334 (together, 4.8376 ms of model time
  per second of wall time, so the clock runs 207 times slower than
  real), the wall's position range W/3 to 2W/3 and angle range 18 to 90
  degrees, the air-density range 1 to 0 atm, the listener's default at
  the centre, and the contrast +2 / -1.5.  Physics: gamma = 7/5,
  R = 8.314462618 J/mol/K (exact, SI 2019), M = 28.9647 g/mol (standard
  dry air), k_B = 1.380649e-23 J/K (exact), 1 atm = 101325 Pa (exact),
  and a kinetic-theory collision diameter of 3.7e-10 m for the mean
  free path.  Every reference value the suite asserts is a line of
  build/sound-waves/refvals.txt, the output of derive.py.
-->
