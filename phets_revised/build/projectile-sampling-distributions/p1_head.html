<title>Projectile sampling distributions &mdash; one launcher, many samples, and why the mean of n is narrower by &radic;n</title>
<!--
  ===================================================================
  projectile-sampling-distributions.html — Remake of PhET Interactive
  Simulations' Projectile Sampling Distributions (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.
  ===================================================================

  PhET's Projectile Sampling Distributions is one screen — the
  Sampling screen of Projectile Data Lab, on its own — so this file
  runs the SAME engine as projectile-data-lab.html, trimmed to that
  screen's launchers and controls: six mystery launchers at a fixed
  30° with cannonballs only, sample sizes 2, 5, 15 and 40, bin widths
  0.5, 1, 2 and 5 m (PhET's PSD list, which drops the data lab's 10 m
  and defaults to 0.5 rather than 1), no total-bins strategy, and at
  most 200 samples a field.

  Four views.  THE FIELD is PhET's screen: fire a sample of n and its
  MEAN — one number — joins the histogram below.  THE FOUR SAMPLE
  SIZES is PhET's thumbnail row at full size, all four distributions
  on one axis so the narrowing is a picture.  ONE LAUNCH is the
  parent the samples are drawn from, against the exact density that
  PhET's mechanism implies, because a standard error means nothing
  without the σ it divides.  THE LIMIT THEOREM measures the standard
  error against σ/√n with the error bar it is entitled to.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * σ/√n is exact for every n and every parent, and it is not the
    central limit theorem: var(x̄) = σ²/n follows from independence
    alone.  The theorem is the further claim about SHAPE, and this
    file separates the two — the widths are asserted at n = 2, where
    no theorem applies, and the skewness is asserted to fall as 1/√n.
  * The parent σ comes from the exact law, not from the data: for
    mystery launcher 1 it is 3.18105 m, and the four standard errors
    are then 2.24934, 1.42261, 0.82134 and 0.50297 m.
  * Over 2000 samples the measured standard errors sit inside their
    own sampling spread σ_n√((κ_n+2)/4M) at all four sizes — the
    tolerance is computed from the parent's kurtosis, not chosen.

  WHAT IS EXACT
  -------------
  * The trajectory: PhET's closed form for the range, checked in
    derive.py against v² sin2θ/g and against an independent route.
  * The random stream: mulberry32 seeded per field, Box-Muller with
    one pair of uniforms per value, bit-identical to derive.py, so
    the page and the Python twin generate the SAME sample means, and
    the page's means, standard deviations (ddof 1 and 0), medians and
    every histogram bin count are pinned against numpy's on them.
  * The parent distribution: PhET re-draws the angle while it falls
    outside (0°, 90°) and the speed while it is ≤ 0, so both are
    truncated normals; the moments come from a 96×96 Gauss-Legendre
    product rule over the truncated z-ranges, checked in derive.py
    against scipy's adaptive quadrature (1e-15) and a 6e6-draw Monte
    Carlo of the actual re-draw mechanism.
  * The statistics are PhET's: bins are floor(x/w)·w, the standard
    deviation divides by n − 1 and is null below two values, the
    standard error is s/√n.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * No air resistance, g = 9.81 m/s², a 100 m field, the launcher
    fixed at 30° with a cannonball, and PhET's launcher table:
    spring 23 ± 0.5 m/s, pressure 24 ± 0.2, explosion 25 ± 1.2, with
    angle spreads 2.6°, 5°, 0.2°, 1.4°, 0.2° and 5°.
  * A sample is paced by PhET's own totalSampleTime — 0.75 s at n = 2,
    2 s at 5, 5 s at 15 and 9 s at 40 — with the n launches spread
    evenly over it and their flights overlapping, so a bigger sample
    fires faster per shot, not slower.  Continuous sampling starts the
    next as soon as the last lands, and stops at PhET's 200.

  WHAT IS NOT MODELLED
  --------------------
  * Drag, spin, wind, the projectile's size.  PhET's sound, its
    keyboard help and its PhET-iO instrumentation are absent, and so
    are the orientation, projectile-type and custom-launcher controls,
    which belong to the data lab's other three screens.

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * The histogram's vertical scale opens on an AUTO rung rather than
    on PhET's default.  PhET's ladder starts at 25 samples because its
    fields hold 200; at the two dozen samples the screen opens with,
    its tightest rung still leaves the histogram a sliver along the
    bottom of an empty panel, and a default that hides the data is a
    defect rather than a preference.  Auto picks the tightest ceiling
    that holds the tallest bin, on a finer ladder (4, 6, 8, 10, 15, 20)
    below PhET's own; every rung PhET offers is still there by hand.
  * The field opens with samples already in it, and the barrel can be
    dragged up and down to change launcher (PhET uses radio buttons,
    which are here too).  The two analysis views are new.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from
  docs/phets/projectile-sampling-distributions_en.html (g = 9.81, the
  100 m field, the 0.2–5° angle spreads, the three mechanisms, the
  six mystery launchers, the sample sizes, the bin widths, the zoom
  ladder to 250 and the 200-sample ceiling) and cited as PhET's
  values.  Everything else is derived and pinned in selfTest to
  build/projectile-sampling-distributions/derive.py, whose printed
  output is refvals.txt.
-->
