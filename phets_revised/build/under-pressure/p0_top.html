<!--
  ===================================================================
  under-pressure.html — four pools, two gauges and one law: a
  rectangular pool with a faucet and a drain, a trapezoid pool whose
  two chambers taper opposite ways, a chamber pool with a mass
  platform, and a mystery pool that asks you to name the fluid or the
  planet — with p = p_atm + rho g h solved exactly everywhere
  ===================================================================

  Remake of PhET Interactive Simulations' Under Pressure (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets. The model, its constants, its pool geometry and its controls follow
  PhET's build 1.1.36 (docs/phets/under-pressure_en.html, the
  FLUID_PRESSURE_AND_FLOW repo); every number taken from that build is marked
  "PhET's value" in the code and in the panel.

  Six views.  PhET has one screen with four scenes, and the first four views
  are those scenes.  THE POOL is the square pool: a faucet, a drain, two
  draggable gauges, and the fluid-density, gravity, atmosphere, grid and ruler
  controls.  THE SHAPES is the trapezoid pool, two chambers that taper in
  opposite directions joined at the floor — put one gauge in each at the same
  depth and they read the same number.  THE PRESS is the chamber pool: a mass
  platform over a narrow shaft, a wide shaft beside it, and Pascal's principle
  in metres and newtons.  THE MYSTERY is the mystery pool, where the fluid or
  the gravity is hidden and the gauge is all you have.  The last two views are
  analysis.  THE PARADOX puts four vessels of the same base and the same depth
  side by side, holding 3.1 to 8.4 cubic metres of the same fluid, and shows
  that the force on every base is identical — with the difference tracked down
  to the vertical pressure on the slanted walls, integrated. THE COLUMN draws
  the law as what it is, a straight line of slope rho g and intercept p_atm,
  on all three of PhET's pressure scales at once.

  WHAT IS EXACT HERE
  ------------------
  The hydrostatic law, p = p_air(y_surface) + rho g h, with no approximation
  anywhere: it is asserted in selfTest against build/under-pressure/derive.py
  for every fluid tick x every gravity tick x depth 0, 1.5 and 3 m, with the
  atmosphere on and off, at the surface and at the floor, and swept over 11466
  points of the two continuous sliders.

  The unit conversions are the exact definitions, not rounded factors: 1 atm =
  101325 Pa by definition, 1 psi = (0.45359237 kg x 9.80665 m/s^2) / (0.0254
  m)^2 = 6894.757293168361 Pa, 1 ft = 0.3048 m.  So 1 atm = 14.69594877551345
  psi, and every round trip is exact to 1.4e-16 over the whole reachable
  range.  PhET 1.1.36 stores the rounded 9.8692e-6 atm/Pa and 1.4504e-4
  psi/Pa; this file does not, and the panel says by how much they differ.

  The trapezoid pool's volume-to-level map is exact rather than PhET's linear
  stand-in: the two chambers' widths are equal-and-opposite linear functions of
  height, so they SUM to a constant 3.85 m (asserted), and the cross-section is
  5.145 m wide through the floor channel and 3.85 m above it.  The level is
  therefore piecewise linear in the volume with one kink, inverted exactly and
  round-tripped to 1e-12, and cross-checked against scipy.integrate.quad.

  The chamber pool is solved, not scripted.  Pascal's principle says the
  piston's dp = F/A_left is the same everywhere in the connected fluid;
  matching the pressure at a point by the two routes (down from the loaded left
  surface, down from the free right surface) gives dp = (rho g + lambda) dh,
  where lambda is the air pressure's own lapse with height.  With the
  atmosphere OFF that is exactly the classical dh = M/(rho A_left); with it ON
  the air column between the two surfaces has weight and the answer is
  dh = M/(A_left (rho + lambda/g_earth)) — the air simply subtracts its own
  1.2483 kg/m^3 from the fluid's density, and g cancels either way.  selfTest
  asserts both closed forms and asserts that a gauge in the fluid reads the
  same pressure whichever surface you come down from, to 1e-9 Pa, at every
  mass, fluid and atmosphere setting.  Force multiplication is A_right/A_left
  = 4.6 exactly: 500 kg on the small piston holds 2300 kg on the big one.

  The hydrostatic paradox is computed twice.  The weight of fluid in each
  vessel is the exact integral of its piecewise-linear width profile; the
  vertical component of the pressure on the slanted walls is the separate
  integral int p(y) w'(y) D dy, done term by term; and the two are asserted to
  satisfy F_wall,z = W - F_base without that balance ever being used to get
  either.  The ratio F_base/W is 1, 0.5714, 1.5484 and 0.6738 for the four
  vessels and is independent of the fluid and of the gravity (asserted).

  WHAT IS MEASURED, AND WHOSE NUMBER IT IS
  ----------------------------------------
  Everything physical here is PhET's, read out of its minified build: the
  fluids gasoline 700, water 1000 and honey 1420 kg/m^3 (the slider runs
  between the first and the last); the gravities Mars 3.71, Earth 9.8 and
  Jupiter 24.9 m/s^2 (the slider runs between the first and the last); the air
  pressure 101325 Pa at the ground falling linearly to 99490 Pa at 150 m, and
  scaled by g/g_earth; the pool depth 3 m; the square pool x in [2.3, 6.0]; the
  trapezoid's widths 0.7 and 3.15 m about x = 3.2 with the chambers 3.22 m
  apart; the chamber pool's 0.5 m and 2.3 m shafts, its 1.3 m opening depth and
  its 500, 250 and 250 kg masses; the mystery fluids 1700, 840 and 1100 kg/m^3
  and the mystery planets 20, 14 and 6.5 m/s^2.  The unit definitions are the
  SI and international-yard-and-pound definitions, not PhET's.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  PhET's world is two-dimensional and its pools have no out-of-page depth at
  all, which makes its chamber pool's force balance dimensionally a length
  rather than a pressure.  This file gives every pool an out-of-page depth of
  2 m, printed on the canvas.  That is the one choice that makes A_left exactly
  1 m^2 and so reproduces PhET's own displacement numbers (500 kg moves the
  water 0.5 m) with an honest area, and it turns the faucet into litres per
  second.

  PhET's air pressure is a straight line from 101325 Pa to 99490 Pa over 150 m.
  A real isothermal column falls exponentially with a scale height of 8434.5 m;
  the two differ by at most 49 Pa, 0.048 % of an atmosphere, over that range
  (asserted).  PhET also multiplies the air pressure by g/g_earth, which is a
  statement about a hypothetical atmosphere of the same mass per unit area, not
  about Mars or Jupiter; that is kept, because the mystery-planet scene depends
  on it, and the panel says so.

  The fluid is incompressible, at rest and always flat, and responds instantly.
  The masses go onto and off the platform by a control rather than by being
  dragged, and they settle instantly: this file solves the static problem where
  PhET integrates a damped equation of motion.  When a load would push the
  narrow column below the foot of its shaft the displacement is capped and the
  canvas says the two-column model has stopped applying.

  WHAT IS NOT MODELLED
  --------------------
  Surface tension, viscosity, waves, the meniscus, compressibility and
  temperature.  PhET's animated water jets and its fluid-colour-by-density are
  not reproduced (the fluid is drawn in the house palette and named).  PhET's
  four barometers are two here, which is what the comparisons need.  PhET's
  mass-drop animation, its sound, and its English-units readouts for gravity
  and density (the ruler and grid do switch to feet) are absent.
