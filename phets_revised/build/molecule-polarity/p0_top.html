<title>Molecule polarity &mdash; bond dipoles from electronegativity, the vector sum that makes a molecule polar, the field that turns it, and nineteen real molecules</title>
<!--
  ===================================================================
  molecule-polarity.html -- set the electronegativities of a bonded
  pair and watch the bond dipole, the partial charges and the surface
  follow; drag a bond angle and add two bond dipoles into a molecular
  one that vanishes exactly at 180 deg; switch on a field and let the
  molecule turn until the dipole lines up; and nineteen real
  molecules with their computed and their measured dipole moments
  ===================================================================

  Remake of PhET Interactive Simulations' Molecule Polarity (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets.  PhET's screens, controls, labels, real-molecule data and the
  numbers marked "PhET's value" are read from its build 2.0.2
  (docs/phets/molecule-polarity_en.html) and its doc/model.md.

  Six views.  TWO ATOMS is PhET's first screen: a diatomic A-B whose two
  electronegativities you set, its bond dipole, its partial charges, the
  electron-density or electrostatic-potential surface, the bond-character
  bar, and a field you can switch on that turns the molecule.  THREE ATOMS
  is PhET's second screen: a triatomic A-B-C with two bond angles you drag,
  two bond dipoles and the molecular dipole they add to.  REAL MOLECULES is
  PhET's third screen: its nineteen molecules in 3-D, Basic and Advanced,
  with bond dipoles, the molecular dipole, Hirshfeld partial charges and
  the measured dipole moment beside the computed one.  THE VECTOR SUM
  plots the molecular dipole against the bond angle and against delta EN,
  and marks the exact cancellation.  THE FIELD is the alignment dynamics:
  a damped rotor, its equilibrium, its phase portrait, and PhET's own
  kinematic rule beside it.  THE DIPOLE ATLAS puts all nineteen real
  molecules against measurement.

  THE MODEL (PhET's, exactly)
  ---------------------------
  Electronegativity runs 2.00 to 4.00 (PhET's range; its sliders snap to
  0.2).  For a bond from atom 1 to atom 2, delta EN = EN2 - EN1, and the
  BOND DIPOLE is the vector of magnitude |delta EN| along the bond,
  pointing at the more electronegative atom (PhET's default
  "positive to negative" convention; the preference chip reverses every
  arrow by pi).  PhET's rule is exactly linear in delta EN with
  coefficient 1 in its own units -- read out of its Bond constructor,
  which builds Vector2.createPolar(|delta EN|, bond angle) -- so the
  numbers on the arrows here are delta EN itself, not debye.
  The MOLECULAR DIPOLE is the vector sum of the bond dipoles, exactly, at
  every bond angle.  PARTIAL CHARGES are PhET's: on the diatomic
  q_A = +delta EN and q_B = -delta EN; on the triatomic
  q_A = EN_B - EN_A, q_C = EN_B - EN_C and q_B = -(q_A + q_C), so the
  molecule is neutral identically.  The SURFACE is PhET's two-stop
  (electron density, black = more) or three-stop (electrostatic
  potential, red = negative) linear gradient, whose width is
  linear(1, 0, w, 5w, |delta EN|/2) with w the surface width; both are
  reproduced stop for stop and asserted against the model, never by eye.

  WHAT IS EXACT
  -------------
  The vector sum: for a symmetric triatomic (EN_A = EN_C) the molecular
  dipole is 2 |delta EN| cos(theta/2) with theta the A-B-C angle, and at
  theta = 180 deg it is exactly zero -- the cancellation is an identity of
  the sum, not a numerical coincidence, and selfTest checks it to 1e-15 at
  the angle and by symmetry over the whole EN grid.  The general form
  |mu| = sqrt(a^2 + c^2 + 2 a c cos theta) with a, c the two bond-dipole
  magnitudes is asserted against the componentwise sum over 4200 (EN, EN,
  theta) triples.  The damped rotor's equilibria (aligned, stable;
  anti-aligned, unstable) are exact, its energy is a Lyapunov function
  (dE/dt = -b psi_dot^2 <= 0, asserted along every integrated orbit), and
  its linearisation gives omega_0 = sqrt(mu E / I) and critical damping
  b_c = 2 sqrt(I mu E), both pinned against derive.py's own RK4.

  WHAT IS MODELLED
  ----------------
  The alignment dynamics.  PhET turns the molecule kinematically: each
  animation frame it moves the dipole angle by 0.17 |mu| / 2 radians
  toward alignment (PhET's value, from MoleculePolarityModel.step), which
  is a constant angular speed proportional to |mu| and depends on the
  frame rate.  This file keeps that as a chip ("PhET's rule") and defaults
  to the physical alternative: a rigid rotor of moment of inertia I in the
  plate field, I psi'' = -mu E sin psi - b psi', which has the same
  equilibrium and reaches it with the overshoot or the creep the damping
  says.  Both are drawn; the two are compared in THE FIELD.  A bond dipole
  linear in delta EN is itself a model, as PhET's notes say -- a real bond
  dipole is not a function of electronegativity alone.

  WHAT IS NOT MODELLED
  --------------------
  Bond lengths on the two model screens (PhET draws one length, 150 of its
  units, and so does this file); surfaces on the triatomic (PhET leaves
  them out because a dragged bond angle makes the surface undefinable, and
  so does this); the real molecules' surfaces as meshes (PhET ships a
  solvent-excluded MSMS mesh with per-vertex Psi4 potentials, 400 kB of
  data this file does not carry -- the real-molecule view draws the
  molecule and its dipoles, and the surface colour key is shown as the
  two model screens' 1-D gradient); molecular vibration, polarisability,
  induced dipoles, and any solvent.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's build 2.0.2, read out of the minified file: the EN range (2, 4)
  and its 0.2 tick spacing, ATOM_DIAMETER 100, BOND_LENGTH 150, the
  triatomic's opening bond angles 5pi/6 and pi/6 (a 120 deg A-B-C angle),
  the surface gradient multiplier 5, the dipole reference length 135 px
  for a magnitude of 2, the bond-character bar's 415 px, the six
  bond-character bands (0.05, 0.4, 0.8, 1.2, 1.6), the e-field rotation
  constant 0.17, the RWB and the 35-stop ROYGB ramps, and the plate order
  (negative plate left, positive plate right, so the field points -x and
  the positive-to-negative arrow settles pointing +x).
  Real molecules: PhET's own table -- geometry from PubChem, Hirshfeld
  partial charges from ORCA, molecular dipole from Psi4, and the Pauling
  electronegativities its element table carries (H 2.20, B 2.04, C 2.55,
  N 3.04, O 3.44, F 3.98, Cl 3.16).  Stored verbatim in
  build/molecule-polarity/real_molecules.json, extracted from the build.
  MEASURED dipole moments are NIST's Computational Chemistry Comparison
  and Benchmark Database (CCCBDB), "Experimental Dipole Moments",
  cccbdb.nist.gov/diplistx.asp, retrieved 2026-09-22, to the three
  decimals it prints, each row carrying CCCBDB's own source code
  (NSRDS-NBS10, NISTDiatomic, and the papers it names).  Borane has no
  experimental value there and is marked absent, not zero.
  Every model number is pinned in selfTest to
  build/molecule-polarity/derive.py, the Python twin.
-->
