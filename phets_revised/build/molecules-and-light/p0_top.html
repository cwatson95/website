  symmetry and mass where symmetry determines them, a fitted valence
  force field where it does not, each mode animated at its true

  species and whether it is infrared-active.  THE STATISTICS is the

  bar that shows 99 % of the air doing nothing at all.

  WHAT IS EXACT
  -------------
  Photon energies.  E = hc/lambda with the 2019 SI defining constants
  h = 6.62607015e-34 J s and c = 299792458 m/s, both exact, so
  hc = 1.986445857148929e-25 J m and hc/e = 1239.841984332002 eV nm
  are exact rational numbers, not measurements.  Every energy,
  frequency and wavenumber this file prints is that identity.
  The normal-mode SHAPES that symmetry fixes.  For a linear symmetric
  XY2 the symmetric stretch is (1, 0, -1) with the central atom
  exactly at rest, and the antisymmetric stretch and the bend are both
  (1, -2 m_Y/m_X, 1); none of the three depends on a force constant or
  on a bond length.  For a bent XY2 the B2 antisymmetric stretch is
  fixed by the bond angle and the masses alone: the perpendicular and
  parallel components of the outer atoms' displacement are in the
  ratio cot(theta/2), from zero linear and zero angular momentum.
  Each is derived in build/molecules-and-light/derive.py and asserted
  against an independent numerical diagonalisation of the
  mass-weighted Hessian.
  The selection rule.  A mode is infrared-active when the dipole
  derivative along it is non-zero.  Every mode of N2 and O2, and the
  symmetric stretch of CO2, give EXACTLY zero -- not small, zero, as
  an identity of the symmetry operation that maps the mode to minus
  itself while leaving the molecule alone -- and selfTest asserts both
  the zeros and the non-zeros.
  The stochastic model.  PhET's rules are exact probability
  statements: one absorption trial per photon at p = 1/2, a hold time
  uniform on [1.1, 1.3] s, an emission direction uniform on the
  circle, and a rotation sense that is a fair coin.  The generator
  here is a seeded 32-bit mulberry32, which the Python twin reproduces
  bit for bit rather than merely statistically, so the chamber runs
  are pinned photon for photon; selfTest also measures each rule
  against its intended value with a tolerance taken from the binomial
  or uniform standard error computed in derive.py, and shows the same
  test rejecting a generator DELIBERATELY biased to 0.52.

  WHAT IS MODELLED
  ----------------
  The animation.  PhET's molecules move on hand-picked offsets, not on
  normal modes; this file draws PhET's motion when the "PhET's
  animation" chip is on, and the derived normal mode otherwise, and
  says on the canvas which is which.  The A1 pair of a bent triatomic
  (the symmetric stretch and the bend) mix, and the mixing angle needs
  a force field.  Three measured wavenumbers do not determine the four
  symmetry constants of a bent XY2, so the fit returns the solution of
  SMALLEST stretch-bend interaction that still reproduces all three
  exactly -- a stated choice, not an accident of where the optimiser
  started -- and the resulting A1 shapes are labelled model, not
  measurement, on the canvas.  Ozone needs f_rtheta = 0.087 aJ/A^2;
  water and NO2 come out at zero.
  Which molecule responds to which band is PhET's table, reproduced
  exactly, and PhET's own model notes call it a simplification.

  WHAT IS NOT MODELLED
  --------------------
  Line strengths, line shapes, pressure and Doppler broadening,
  rotational fine structure on a vibrational band, overtones and
  combination bands, Fermi resonance (CO2's nu1 is quoted as its
  deperturbed 1333 cm-1 and the observed dyad at 1285.4 and 1388.2
  cm-1 is named in the caption, not drawn), excited-state products of
  dissociation, collisions, quenching, stimulated emission, and any
  quantum mechanics of the absorption itself.  Nothing here computes
  an absorption cross-section, and the atmosphere view marks band
  POSITIONS, never band strengths.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET, read from the minified build: the four source wavelengths
  (microwave 0.2 m, infrared 850 nm, visible 580 nm, ultraviolet
  100 nm, and the 400 nm "sunlight" its sibling uses); the 50 %
  absorption probability; the photon hold time 1.1 + U(0, 0.2) s; the
  0.2 s absorption hysteresis after an emission; the 100-unit
  absorption radius; the photon speed 3000 units/s from the emitter at
  x = -1350; the 0.8 s continuous emission period; the 5 Hz vibration
  and 1.1 Hz rotation; the half-rate slow motion and the 0.2 s step
  ceiling; the break-apart speeds 990 and 0.67 x 3000; the whole
  molecule/band response table; the drawing offsets and vibration
  amplitudes of all eight molecules; the atom radii and masses
  (including the oxygen mass PhET carries as 12.011, which is
  carbon's); and the seven band edges of its Light Spectrum Diagram,
  taken from its own accessibility descriptions.
  Spectroscopy, all NIST, retrieved 2026-09-22: measured fundamental
  vibrational wavenumbers from the Computational Chemistry Comparison
  and Benchmark Database (cccbdb.nist.gov, "Experimental Vibrational
  Frequencies"), each with the reference CCCBDB prints; experimental
  geometries from the same database ("Experimental Geometries"), all
  but methane from Herzberg 1966; experimental dipole moments from
  CCCBDB "Experimental Dipole Moments"; and the diatomic constants
  omega_e, omega_e x_e, B_e, alpha_e and r_e from the NIST Chemistry
  WebBook, "Constants of Diatomic Molecules" (Huber and Herzberg
  1979).  Isotopic masses are NIST's Atomic Weights and Isotopic
  Compositions.  Bond dissociation energies, and with them the
  photodissociation thresholds, are quoted from Active Thermochemical
  Tables values and labelled QUOTED on the canvas: they were not
  re-derived here.  Atmospheric composition is NASA's Earth Fact Sheet
  and the CO2 mixing ratio is NOAA GML's global monthly mean for June
  2026, 427.62 ppm, which that page itself calls preliminary.
  Every model number is pinned in selfTest to
  build/molecules-and-light/derive.py, the Python twin.
