<title>Quantum measurement &mdash; coins, photons, spins and the Bloch sphere: a state has amplitudes, a measurement has outcomes</title>
<!--
  ===================================================================
  quantum-measurement.html — what it means to measure a two-level
  system: classical coins against quantum "coins", single photons at a
  polarizing beam splitter, spin-1/2 atoms through Stern-Gerlach
  magnets one after another, and a spin on the Bloch sphere that
  precesses in a field and collapses when it is observed
  ===================================================================

  Remake of PhET Interactive Simulations' Quantum Measurement (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code
  or assets.  The screens, controls and constants follow PhET's build 1.0.5
  (docs/phets/quantum-measurement_en.html) and its doc/model.md; every number
  taken from that build is marked "PhET's value" in the code.

  Six views.  THE COINS is PhET's Coins screen: a classical coin and a
  quantum "coin", each prepared (heads or tails; up, down or a superposition
  with P(up) = |alpha|^2 set in steps of 0.05), sent to be measured, and then
  flipped, hidden and revealed (classical) or reprepared and observed
  (quantum), one at a time or 10, 100 or 10 000 identical coins at once, with
  the counts against the binomial's N p +- sqrt(N p (1-p)).  THE PHOTONS is
  PhET's Photons screen: a laser, a polarizing beam splitter that sends
  vertical light up and horizontal light on, a mirror, two detectors at
  equal path length; one photon at a time or a beam of up to 200 a second;
  vertical, horizontal, 45 degrees, unpolarized or a custom angle; which-path
  (classical) or split-and-collapse-at-the-detector (quantum) behaviour; the
  counts, the rates and the average polarization (N_V - N_H)/N.  THE SPINS
  is PhET's Spin screen: a spin-1/2 source (+Z, +X, -Z, or any state in the
  x-z plane), one Stern-Gerlach magnet or two stages, PhET's six experiments
  and a custom one, single particles or a continuous beam, blockers on the
  first magnet's exits and the percentages at every stage.  THE BLOCH SPHERE
  is PhET's Bloch Sphere screen: prepare theta and phi (steps of 15 degrees),
  turn on a field along z, wait a measurement delay while the state precesses,
  and observe one atom or ten along x, y or z; the state written in any of
  the three bases.  THE BORN RULE sets the half-angle of a spin, cos^2(Theta/2),
  against the photon's cos^2(theta), each with seeded counts from the same
  code the other views run, and shows sequential measurement as a product of
  projections: a middle magnet that lets particles through, and a chain of N
  magnets that drags a spin from up to down with probability
  cos^(2N)(pi/2N) -> 1.  THE BINOMIAL repeats the N-coin experiment and sets
  the histogram of heads against the exact binomial, and the spread of the
  fraction against sqrt(p(1-p)/N): why 10 000 coins look deterministic.

  WHAT IS EXACT HERE
  ------------------
  The Born rule, P(up along n) = (1 + r.n)/2 = cos^2(Theta/2) for a spin and
  cos^2(theta) (Malus) for a photon at the beam splitter.  Sequential
  Stern-Gerlach probabilities as products of projections, checked against
  2x2 complex projectors in numpy for all seven experiments and four source
  states.  Larmor precession as an exact rotation about the field, checked
  against scipy's matrix exponential of the Hamiltonian acting on the ket.
  The Bloch vector <-> ket map, round-tripped, and the state written in the
  X, Y and Z bases and rebuilt from what is written.  The binomial pmf
  (Stirling lnFact against math.lgamma to 1e-16, the pmf against scipy to
  1e-10).  Every random draw comes from one seeded PRNG (mulberry32), mirrored
  bit for bit in build/quantum-measurement/derive.py, so every seeded count
  in selfTest is an integer pinned exactly to Python AND tested against the
  law it samples with a tolerance taken from its own variance (4 sigma, a
  chi-square below scipy's 99.9 % quantile), not guessed.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  PhET's values: a flip takes 1 s; 10, 100 or 10 000 coins; the bias steps
  of 0.05; the photon apparatus (laser at x = -0.15, beam 0.04 wide, the
  splitter a 0.07 cube at the origin, mirror at 0.11, detectors 0.2 of path
  beyond the splitter), photons at 0.3 units a second, up to 200 a second,
  the rate averaged over 1 s in 0.5-s samples, counts capped at 999, slow
  motion x0.4; the six Stern-Gerlach experiments and PhET's custom layout,
  the particle amount 0.1 (PhET emits 5 x amount per 60-Hz frame, so 300 x
  amount a second here), the magnets' rates averaged over 3 s; the Bloch
  sphere's 15-degree steps, one or ten atoms, a delay of 0-1 ns (default
  0.75) in which a unit field turns the state once (PhET's pi/2 per second
  at 0.25 ns per second).  The remake gives that field real units: the spin
  is an electron's, B0 = 35.68 mT turns it once a nanosecond (CODATA 2022
  gamma_e/2pi = 28 024.951 3861 MHz/T, as stored in bloch_sphere.html, and
  equal to |g_e| mu_B/h to 1e-12), and the sense of the turn is the
  electron's: counterclockwise about +z, as PhET draws it.  Deliberate
  differences: PhET's custom spin state maps |alpha|^2 linearly onto the
  polar angle, theta = pi(1 - |alpha|^2), so its own equation disagrees with
  its slider except at 0, 1/2 and 1 (P(up) = 0.854 at |alpha|^2 = 0.75); here
  theta = 2 arccos|alpha| and the slider IS P(up).  PhET's Y-basis equation
  prints a relative phase of 1.5 pi for the +X state, which rebuilds -X with
  PhET's own +Y (azimuth pi/2); here it is 0.5 pi and every printed equation
  is rebuilt into the state in selfTest.  PhET turns its spheres a whole
  frame at a time and measures after the frame that reaches the delay, so
  its state can overshoot by up to one frame's turn (1.5 degrees at 60 Hz
  and full field, read from its step order); here the state is rotated to
  exactly the delay.  PhET starts the photon beam at 0 a second; here at 60,
  so the view is not empty.  An unpolarized beam's expectation value is
  shown as 0 (the mixture's), where PhET hides it.  The two photon scenes
  share one set of polarization and behaviour controls (PhET gives each
  scene its own laser); the Stern-Gerlach blocker is one setting (PhET
  remembers one per experiment); the coins are not animated flying from the
  preparation area into the test boxes; PhET's display toggles for the
  average polarization (vector, expectation value, decimal values) and the
  spin disc's projections are always on here; PhET's easter-egg display for
  10 000 quantum coins reprepared eight times in 20 s is not reproduced.
  Added beside PhET's screens: the fringe panel on the Bloch view (P(up)
  against the delay), the products-of-projections table on the spins view,
  the single coin's last outcomes, and the two analysis views.

  WHAT IS NOT MODELLED
  --------------------
  One two-level system at a time: no entanglement, no decoherence, no
  detector inefficiency or dark counts; measurement is projective and
  instantaneous; the Stern-Gerlach magnets are ideal filters (no field
  gradient, no beam spread); photons are point particles on straight rays
  (no interference between the arms, which PhET's geometry does not
  recombine); the field on the Bloch screen is along z only; no sounds and
  no screen-reader descriptions.
-->
