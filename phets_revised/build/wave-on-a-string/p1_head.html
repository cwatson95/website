<title>Wave on a string &mdash; PhET&rsquo;s bead lattice, exactly: reflections, standing waves, and a dispersion relation that is a straight line</title>
<!--
  ===================================================================
  wave-on-a-string.html — a string of 61 beads driven at one end by a
  hand, an oscillator or a pulse generator, and clamped, looped or
  running on at the other: PhET's model exactly, with d'Alembert's
  solution, the standing waves and the lattice's dispersion beside it
  ===================================================================

  Remake of PhET Interactive Simulations' Wave on a String (University of
  Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or
  assets.  The model, its constants and its controls follow PhET's build
  1.2.4 (docs/phets/wave-on-a-string_en.html) and its doc/model.md; every
  number taken from that build is marked "PhET's value" in the code.

  Five views.  THE STRING is PhET's screen: the wrench (manual), the
  oscillator or the pulse generator at bead 0; a fixed end, a loose end or
  no end at bead 60; amplitude, frequency, pulse width, damping and tension;
  the rulers, the stopwatch and the reference line; normal or slow motion,
  play, pause, step and restart.  THE SPACE-TIME is the same string's last
  240 lattice steps as a picture in x and t, where d'Alembert's two sliding
  shapes are stripes whose tilt is set by v.  THE REFLECTIONS sends one pulse at all
  three ends at once, undamped, and lays the image construction over the
  lattice: inverted from the clamp, upright from the ring, nothing from the
  open end.  THE STANDING WAVES drives the string from rest, draws the exact
  steady state it settles into, and sweeps the driving frequency across
  PhET's 0-3 Hz to show the resonances.  THE DISPERSION sets the lattice's
  dispersion relation beside the continuum and a real bead chain: at PhET's
  Courant number it is exactly omega = vk, which is why PhET's pulses never
  spread.

  THE MODEL (PhET's values)
  -------------------------
  61 beads 0.125 cm apart (10 model units at 80 per cm): 7.5 cm of string.
  The update is the leapfrog
      (1+b) y_i^{n+1} = (b-1) y_i^{n-1} + 2(1-a^2) y_i^n + a^2 (y_{i+1}^n + y_{i-1}^n)
  with the Courant number a = v dt/dx held at exactly 1 (the tension sets
  the time step dt = dx/v, never the stencil) and b = 0.1 x damping per step
  (damping slider 0-1, default 0.2).  Ends: fixed y_60 = 0; loose
  y_60 = y_59; no end y_60^{n+1} = y_59^n.  Driver at bead 0: the oscillator
  A sin(2 pi f t), rising first; the pulse, a triangle of height A lasting
  w; the wrench, within +-1.3 cm.  Ranges and defaults: amplitude 0-1.3 cm
  (0.75), frequency 0-3 Hz (1.5), pulse width 0.2-1 s (0.5), slow motion
  x0.25, 50 lattice steps a second at full tension (v = 6.25 cm/s).  Rulers
  of 10 cm and 5 cm, a reference line starting 1.45 cm up, every tenth bead
  marked.

  WHAT IS EXACT HERE
  ------------------
  At a = 1 and no damping the lattice IS d'Alembert's solution sampled at the
  beads: a pulse fed in at bead 0 appears at bead i exactly i steps later,
  unchanged.  Asserted below 1e-13 (the Python twin measures 1e-14) against
  the image series for all three ends over two parameter sets (one
  deliberately incommensurate): fixed returns
  it inverted, loose upright about bead 59.5 (the ring copies its neighbour,
  so the mirror sits half a bead in; putting it at bead 60 is off by 0.06 cm),
  and the open end absorbs it completely.  A damped mode loses exactly
  sqrt((1-b)/(1+b)) = exp(-atanh b) per step; the dispersion relation
  (1+b) z^2 - 2(1 - 2a^2 sin^2(k dx/2)) z + (1-b) = 0 is checked against
  numpy.roots and against lattice runs; the driven steady state is solved in
  closed form, by a tridiagonal solve and by a brute-force run of thousands
  of steps, all three agreeing to within 3e-11; the resonances
  f_n = n v/2L (fixed) and (2n-1) v/4L' (loose, L' = 7.4375 cm) and the
  1/(N b) peak height as b -> 0.  Every number is pinned in selfTest to
  build/wave-on-a-string/refvals.txt, the printed output of derive.py.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  ---------------------------------------------------------
  Tension.  PhET's slider (relative, 0.2-0.8) maps sqrt(T) AFFINELY onto
  10-50 steps a second: 1.25-6.25 cm/s over a 4:1 tension range, where
  v proportional to sqrt(T) gives 2:1.  The remake keeps PhET's speed range
  and makes it the law, v = 6.25 cm/s x sqrt(T/0.8), so its slider runs
  0.032-0.8.  The driver is evaluated at each lattice time (PhET samples it
  on a 0.02-s tick), so a pulse is the triangle sampled exactly.  The
  standing-wave and reflection views run their own lattices from rest.
  Frames advance by the real elapsed time, capped at 50 ms.  Changing the
  tension mid-run changes the lattice's clock, as PhET does: every wave on
  the string simply speeds up or slows down.  The dispersion view's lattice
  at a < 1 keeps the same PHYSICAL damping (b scales with a); its bead chain
  is the same lattice at a = 0.05, within 0.04 % (a^2/6) of the continuous-
  time chain's omega(k).

  WHAT IS NOT MODELLED
  --------------------
  Transverse motion only: no longitudinal motion, no gravity and no sag (as
  PhET's own notes say); small slopes (the wave equation is linear); a
  uniform tension that is set, not computed from the stretch; a massless,
  frictionless ring on the loose end; no air, no sound, no energy readout.
-->
