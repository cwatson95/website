<title>Gravity Force Lab &mdash; Newton&rsquo;s inverse-square law between two spheres</title>
<!--
  ===================================================================
  gravity-force-lab.html — Newton's law of gravitation between two
  spheres on a track: drag them, change their masses, and read the
  equal and opposite pull
  ===================================================================

  Remake of PhET Interactive Simulations' Gravity Force Lab (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.  PhET's build 2.2.25 (docs/phets/gravity-force-lab_en.html)
  was read only for its model constants, each cited below as "PhET's value".
  Its sibling coulombs-law.html runs on the same inverse-square engine.

  Four views.  THE LAB is PhET's screen: two uniform spheres on a 10-m
  track, masses 10-1000 kg, dragged along a 0.1-m grid; a force arrow on
  each (equal and opposite, drawn to one printed scale), the force in
  PhET's decimal or scientific notation, a draggable metre ruler, and the
  switch between mass-scaled spheres (150 kg/m^3) and constant-size ones.
  THE INVERSE SQUARE: the same force against the distance on log-log axes
  (a straight line of slope -2), on linear axes, and as F r^2, which is
  flat at G m1 m2 — with the distances the spheres cannot reach shaded.
  THE MASS PRODUCT: the force over every pair of masses at the current
  distance (hyperbolas m1 m2 = F r^2 / G), the force against one mass
  (a straight line through the origin), and the strongest pull two equal
  masses can ever reach — m^2 for constant-size spheres, about m^(4/3)
  for real ones, because a heavier sphere is also a bigger one.
  LET THEM GO: what the lab's forces would do if the track let the
  spheres move — the radial two-body free fall from rest, in closed form:
  the centre of mass stays put, the lighter sphere covers more ground,
  and two lab-sized masses take about twelve hours to touch.

  WHAT IS EXACT
  -------------
  F = G m1 m2 / r^2 with G = 6.6743e-11 m^3 kg^-1 s^-2 (CODATA 2022, read
  from scipy.constants 1.18 in build/gravity-force-lab/derive.py).  r is the
  distance between centres, which for uniform spheres is exact (Newton's
  shell theorem), not an approximation.  The mass-scaled radius is
  (3m / 4 pi rho)^(1/3).  The free fall is the closed form
  t(r) = sqrt(r0^3 / 2GM) [sqrt(x(1-x)) + asin sqrt(1-x)], x = r/r0,
  inverted by bisection; derive.py checks it against scipy solve_ivp
  integrating both bodies (8e-12), and selfTest against an RK4 of its own.
  Every number is pinned in selfTest to build/gravity-force-lab/refvals.txt.

  WHAT IS MODELLED (PhET's choices, reproduced)
  ---------------------------------------------
  PhET's values: the density 150 kg/m^3, the constant-size radius 0.5 m,
  masses 10-1000 kg in 10-kg steps, centres on a 0.1-m grid within +-5 m,
  and the no-overlap rule — centres at least snap(r1 + r2 + 0.1 m) apart.
  Rounding r1 + r2 + 0.1 to the grid can cut the gap below 0.1 m; derive.py
  enumerates all 10,000 reachable mass pairs and the gap never falls below
  0.05004 m (140 and 940 kg), so the spheres never touch.  When a sphere
  grows into its neighbour, the neighbour is pushed aside, or, if it is
  against the end of the track, the grown sphere moves (PhET's rule;
  switching the size mode counts as m2 growing last, PhET's update order).
  PhET uses G = 6.67408e-11 (CODATA 2014), so its forces read 3.3e-5 lower.

  NOT MODELLED
  ------------
  PhET's cartoon pullers, sounds and screen-reader descriptions.  The
  Earth: the spheres sit in free space on a frictionless track.  In "let
  them go", nothing after the spheres touch.
-->

  :root{
    --bg:#070b18; --panel:#0a0c12; --panel2:#10131b; --text:#cfd4de; --dim:#8b93a6;

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{background:var(--bg); color:var(--text); display:flex; flex-direction:column;

  header{height:48px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 15px;
         background:var(--panel); border-bottom:1px solid var(--edge);}
  header h1{font-size:15px; font-weight:600; letter-spacing:.2px; white-space:nowrap;}
  header .sub{color:var(--dim); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  nav{margin-left:auto; display:flex; gap:6px; flex-shrink:0;}
  nav button{background:transparent; color:var(--dim); border:1px solid transparent;
             padding:5px 13px; border-radius:15px; font-size:12.5px; cursor:pointer;
             font-family:Georgia, "Times New Roman", serif; letter-spacing:.4px;}
  nav button:hover{color:var(--text);}
  nav button.active{color:#fff; border-color:#556; background:rgba(255,255,255,.06);}

  #wrap{display:flex; flex:1; min-height:0;}
  #stage{position:relative; flex:1; min-width:0;}
  #scene{position:absolute; inset:0; width:100%; height:100%; display:block;
         touch-action:none; cursor:grab;}
  #scene.dragging{cursor:grabbing;}

  #readout{position:absolute; top:11px; right:13px; width:280px; pointer-events:none;
           user-select:none; -webkit-user-select:none; text-align:left;
           background:linear-gradient(180deg, rgba(10,12,18,.86), rgba(10,12,18,.66));
           border:1px solid var(--edge2); border-radius:9px; padding:10px 12px 11px;
           text-shadow:0 1px 3px rgba(0,0,0,.8); backdrop-filter:blur(2px);}
  #readout .rname{font:italic 19px Georgia, serif; color:#fff; line-height:1.15;}
  #readout .rname small{font-size:11.5px; color:var(--dim); font-style:normal; display:block;
                        margin-top:2px; letter-spacing:.3px;}
  #readout table{width:100%; border-collapse:collapse; margin-top:8px; font-size:11.5px;}
  #readout td{padding:1.5px 0; color:var(--dim); white-space:nowrap;}
  #readout td.v{color:var(--text); text-align:right; font-variant-numeric:tabular-nums;
                overflow-wrap:anywhere; white-space:normal;}
  #readout td.hd{color:#6f7789; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                 padding-top:8px;}
  #readout .bar{height:7px; border-radius:4px; background:#1b1f29; overflow:hidden; margin-top:4px;
                box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); position:relative;}
  #readout .fill{height:100%; border-radius:4px; background:linear-gradient(90deg,#4a7f3a,#b8ec4c);}
  #readout .fill.r{background:linear-gradient(90deg,#7a2f70,#cd35c4);}
  #readout .tick{position:absolute; top:-2px; bottom:-2px; width:1px; background:#e8e8f0; opacity:.75;}

  #readout .note b{color:var(--dim); font-weight:600;}
  #readout .good{color:var(--neon-a);} #readout .bad{color:#e8843a;}
  #readout .legend{margin-top:9px; display:flex; flex-wrap:wrap; gap:3px 10px; font-size:10.5px; color:var(--dim);}
  #readout .legend span{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
  #readout .legend i{width:9px; height:9px; border-radius:2px; display:inline-block;
                     box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);}

  #hint{position:absolute; left:14px; bottom:11px; color:var(--dim); font-size:11px;

  #tag{position:absolute; left:14px; top:11px; color:var(--dim); font:italic 13px Georgia,serif;

  #eqbar .lhs{color:#fff;}
  #eqbar .hl{color:var(--neon-a); font-style:normal;}
  #eqbar .hl2{color:var(--neon-b); font-style:normal;}
  #eqbar .sm{font:11.5px -apple-system,sans-serif; font-style:normal; color:var(--dim);

  #eqbar sup{font-size:10.5px;} #eqbar sub{font-size:10.5px;}

  #panel{width:300px; background:var(--panel); border-left:1px solid var(--edge);

  .grp h3{font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;

  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
                    width:13px; height:13px; border-radius:50%; background:var(--text);
                    border:1px solid #555; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb:hover{background:#fff;}
  .checks{display:flex; flex-direction:column; gap:5px; margin-top:4px;}
  .checks label{font-size:12.5px; color:var(--text); display:flex; align-items:center;
                gap:7px; cursor:pointer;}
  .checks input{accent-color:var(--accent); width:13px; height:13px;}
  .btnrow{display:flex; gap:8px; margin-top:9px;}
  .btnrow button{flex:1; background:var(--panel2); border:1px solid var(--edge2); color:var(--text);
                 border-radius:6px; padding:6px 0; cursor:pointer; font-size:12.5px;}
  .btnrow button:hover{border-color:var(--accent);}
  .tag{font:11px "SF Mono", Menlo, monospace; color:#868e9f; margin-top:5px; line-height:1.55;}
  .tag b{color:var(--text); font-weight:600;} .tag .g{color:var(--neon-a);} .tag .r{color:#e8843a;}
  .src{font:10px "SF Mono", Menlo, monospace; color:#6b7284; margin-top:4px; line-height:1.5;}
  #info{font-size:12px; line-height:1.62; color:var(--dim);}
  #info b{color:var(--text); font-weight:600;}
  [hidden]{display:none !important;}
