<title>Masses and springs &mdash; Hooke&rsquo;s law you can hang a mass on, and the damped oscillator in closed form</title>
<!--
  ===================================================================
  masses-and-springs-basics.html — hang a mass on a spring and it
  stretches by mg/k; let it go and it bounces at 2π√(m/k), whatever
  the gravity; damp it and the amplitude falls by a fixed factor each
  period. PhET's three screens, with the closed-form solution, its
  three regimes and its energy ledger beside them
  ===================================================================

  Remake of PhET Interactive Simulations' Masses and Springs: Basics
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no
  PhET code or assets.  The model, its constants and its controls follow PhET's
  build 1.0.28 (docs/phets/masses-and-springs-basics_en.html) and the
  masses-and-springs doc/model.md; every number taken from that build is marked
  "PhET's value" in the code and in the panel.

  Six views.  THE STRETCH is PhET's first screen: two springs under a ceiling,
  a rack of masses to hang on them, a spring-strength slider each (PhET's
  3-12 N/m), the unstretched-length and resting-position lines, a movable
  reference line and a ruler.  Hooke's law is all it is: the extension is
  mg/k, so at the same mass a stiff spring stretches less, in exact
  proportion.  THE BOUNCE is PhET's second screen with the damping turned
  off: the same two springs, released and oscillating, each drawing its own
  height against time.  THE LAB is PhET's third: one spring, a mass slider
  (50-300 g), gravity by planet or by slider, a period trace and a stopwatch.
  THE PERIOD LAW puts the measured period of the
  drawn motion on top of T = 2π√(m/k) across every mass and spring the sim
  allows, and shows that changing gravity moves the hanging point and not the
  period.  THE DAMPING draws the three regimes of m u" + b u' + k u = 0 and
  where PhET's own ranges sit in them.  THE ENERGY follows the kinetic,
  elastic, gravitational and thermal shares through a damped swing.

  THE MODEL (PhET's values)
  -------------------------
  y is the downward extension of the spring below its unstretched length:
      m y" = m g - k y - b y',    y_eq = m g / k,   u = y - y_eq
      m u" + b u' + k u = 0                (PhET's doc/model.md: ms² + bs + k = 0)
  Spring constant 3-12 N/m (integers), default 6; natural length 0.5 m;
  ceiling 1.47 m, floor 0, shelf 0.02 m, hook 0.037 m tall with its centre
  0.0185 m down.  Masses: a rack of 250, 250, 100, 100, 50, 50 g plus three
  unlabelled mystery masses of 200, 100 and 75 g; the lab's own mass slider
  runs 50-300 g (default 100) beside mystery masses of 180 and 120 g.
  Gravity: Moon 1.6, Earth 9.8, Planet X 14.2, Jupiter 24.8 m/s², or a slider
  0-30.  Planet X is PhET's invented value — 14.2 m/s² matches no body in the
  solar system (Neptune 11.15 and Saturn 10.44 are the nearest); the sim hides
  it behind "What is the value of gravity?", and you recover it from the
  stretch as g = k y/m.  Damping is PhET's dampingCoefficient b in N s/m,
  range 0-0.7: Basics itself has no damping slider and fixes b at 0.7 on
  Stretch, 0 on Bounce and 0 on Lab, so the slider here is the parent sim's.
  Slow motion ×1/8 (PhET's SLOW_SIM_DT_RATIO).  The drawn mass blocks use
  PhET's own size rule, radius = 4√(m/(80·2.5·π)) m and height 2.5 radius.

  WHAT IS EXACT HERE
  ------------------
  The sim advances the state with the exact propagator of the linear equation
  above — u = e^(-γt)[u₀(C + γS) + v₀S], v = e^(-γt)[-ω₀²u₀S + v₀(C - γS)] with
  C = cos(√s t), S = sin(√s t)/√s and s = ω₀² - γ², continued to cosh/sinh
  below s = 0 and to their series at s = 0 — so the trajectory is the closed
  form to machine precision at any frame rate, in all three regimes, exactly
  as PhET does it.  An RK4 of the same equation runs beside it in selfTest and
  is measured to be fourth order (error ratios 16.03-16.44 per halving), and
  scipy's solve_ivp agrees with the propagator to 2.4e-12 over 80 (m, k, b)
  states.  Undamped, the propagator conserves energy to 5.8e-16 relative over
  2000 steps; damped, E(0) - E(t) equals b∫v²dt to the last bit (scipy quad).
  mg/k is asserted over all 10040 (mass, spring constant, planet) states the
  sim can reach, the period against 2π√(m/k) and against the zero crossings of
  the drawn motion, the damped period against 2π/√(ω₀² - γ²), and the
  logarithmic decrement against the ratio of successive peaks.  Every number
  is pinned in selfTest to build/masses-and-springs-basics/refvals.txt, the
  printed output of derive.py.

  WHICH REGIMES ARE REACHABLE
  ---------------------------
  Critical damping needs b = 2√(km), which over PhET's own box (k 3-12 N/m,
  m 50-300 g) never falls below 0.7745966692 N s/m — above the top of its
  damping range, 0.7.  So EVERY state PhET can reach is underdamped, with
  ζ ≤ 0.9036961141 at the softest spring and lightest mass.  The damping view
  therefore extends b past PhET's range to show the critical and overdamped
  cases, and says so on the canvas.

  WHAT IS MODELLED / CHOSEN (where this differs from PhET)
  --------------------------------------------------------
  PhET's gravities are used as PhET's (Earth 9.8, Moon 1.6, Jupiter 24.8), so
  the extensions match its own; the real surface values (9.81, 1.62, 24.79)
  are printed beside them in the readout.  PhET's Basics offers gravity only on
  its Lab screen and no damping control at all; here both are live on all three
  screens, the damping slider being the parent sim's 0-0.7 N s/m, and switching
  views restores PhET's own per-screen damping the way switching its screens
  does.  The rack is one chip row per spring rather than draggable blocks on a
  shelf, and a mass is released from its unstretched position rather than
  dropped by hand (you can still drag it, and letting go leaves it at rest as
  PhET does).  The bounce and lab views draw a height-against-time strip PhET
  does not have, and the stage sits in a column of its own beside it.  The
  gravitational share of the energy is measured from the BOTTOM of the swing,
  2mg/k down, so that none of the three shares is ever negative and their sum
  is 2(mg)^2/k rather than a line lying on the axis.  Frames advance by real
  elapsed time, capped at 50 ms.  PhET's spring coil is drawn as a helix whose
  pitch follows the length and whose thickness follows the spring constant, as
  PhET's does, but the coil count and line widths are this file's.  At large g
  on a soft spring the mass hangs below the floor; PhET allows that too, and the
  canvas says when it happens.

  WHAT IS NOT MODELLED
  --------------------
  One dimension: the mass moves only up and down, and the spring is massless
  and perfectly linear at every extension (no coil-bind, no yield).  Damping
  is linear in velocity and acts on the mass alone.  No collisions with the
  floor or the shelf, no air, no sound.  PhET's vector arrows for the four
  forces, its energy bar graph on the mass, its adjustable natural length and
  its two-spring "same length / same constant" mode are not here.
