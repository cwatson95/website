<title>Diffusion &mdash; two gases either side of a divider: take it out and watch them mix, and measure the flow against kinetic theory</title>
<!--
  ===================================================================
  diffusion.html — Remake of PhET Interactive Simulations' Diffusion
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0).
  New code; no PhET code or assets.
  ===================================================================

  PhET's Diffusion is one screen: a 16 nm x 8.75 nm container split by
  a 100 pm divider, two species with their own number, mass, radius
  and initial temperature, the divider removable, the centres of mass
  under the box, the particle flow rates over the divider, a scale and
  a stopwatch, and a Data panel giving each side's counts and average
  temperature.

  FOUR VIEWS.  THE DIVIDED BOX is that screen.  THE MIXING is a house
  view: the two species' concentration profiles along the box, and the
  left-right imbalance falling with time against the two limits that
  bracket it.  THE FLOW is a house view: the measured crossing rate
  against the kinetic-theory flux n <vx+> (H - 2r), Graham's law over
  the whole mass range, and the measured pair-collision rate against
  the mixture's collision frequency.  THE SPEEDS is a house view:
  PhET starts every particle at exactly sqrt(3kT/m), a spike, and the
  view watches it relax to Maxwell-Boltzmann and the two species reach
  one temperature.

  THE RESULTS THIS FILE EXISTS FOR
  --------------------------------
  * Each species' centre of mass starts at exactly -(W + d)/4 =
    -4025 pm from the middle, INDEPENDENT of the particle radius (the
    radius shifts both ends of the occupied interval equally), with a
    sampling spread of 222 pm for 100 particles.  Measured and
    asserted both ways.
  * The crossing rate across the divider line is n <vx+> (H - 2r) with
    <vx+> = sqrt(kT2/2 pi m) = <v>/pi exactly.  The height cancels, so
    the rate is N <vx+>/(W/2 - r): 1.852/ps for 100 heavy at 300 K,
    4.878/ps for 100 light.  Their ratio is Graham's sqrt(m1/m2)
    times the excluded-width ratio.
  * The left-right imbalance is NOT a single exponential, and the
    reason is physical.  The two-box effusion model gives
    tau = (W - 2r)/(4 <vx+>) = 27.0 ps, which assumes each side stays
    internally mixed.  With collisions OFF nothing mixes the sides and
    the decay is ballistic — faster at first, then ringing about zero
    (derive.py computes that curve exactly: 0.6437 at 10 ps against
    the effusion model's 0.6905, and 0.0115 at 40 ps against 0.2273).
    With collisions ON the box is 22 mean free paths across and the
    Fickian estimate tau_D = W^2/(pi^2 D), D ~ <v> lambda/2, is 5.8
    times the effusion time.  The view draws both bounds and says the
    measurement sits between them; it does not claim a diffusion
    coefficient it has not derived.
  * The mixture's collision frequency z_k = sum_j n_j 2(r_k + r_j)
    <v_rel,kj>, with <v_rel> = sqrt(pi kT2/2 mu) checked against two
    million Monte-Carlo velocity pairs, predicts 73.4 pair collisions
    per ps in the default box; the simulation counts 74.2.  The 2 is
    the swath width (a disk sweeps a strip of HALF-width r_k + r_j)
    and it was FOUND this way: the first draft of derive.py wrote
    n_j (r_k + r_j) and the simulation counted 2.05 times as many
    collisions as it predicted.  Both are now pinned.
  * PhET's start is a DELTA in speed, so the mean speed must FALL by
    exactly 1 - sqrt(pi/4) = 11.377 % as it relaxes, at constant
    energy, for either species.  Measured.

  WHAT IS EXACT
  -------------
  * The dynamics, unchanged from the gas-properties remake this is
    built on: every collision at its true contact time, in time order;
    elastic impulses conserving momentum and energy to rounding.
    selfTest re-asserts those invariants here (5000 random
    collisions, and disks that never overlap), because this file
    relies on them.  The engine is documented in
    build/gas-properties/ENGINE.md.
  * PhET's Diffusion model, by its minified source: the placement
    (uniform in the species' own half, NO overlap rejection, every
    particle at sqrt(3kT/m) in a random direction), the rule that a
    new mass or starting temperature re-speeds every particle of that
    species, that removing particles re-speeds the rest, that
    resetting the divider regenerates everything, and the 300-frame
    running average behind the flow-rate arrows.
  * The kinetic theory above, by quadrature and Monte Carlo in
    derive.py, never from memory.

  WHAT IS MODELLED (PhET's choices, kept)
  ---------------------------------------
  * T = (2/3)<KE>/k, the 3-D equipartition applied to 2-D motion, so
    kT2 = (3/2)kT is the energy per particle and every law above uses
    it.  The container is fixed at 16 nm and has no lid.
  * Overlapping disks pass through each other until they separate,
    which is how PhET's placement can drop 200 disks into one half
    without rejection.

  WHAT IS NOT MODELLED
  --------------------
  * Attraction, rotation, internal states, gravity.  No pressure
    gauge (PhET's Diffusion screen has none either).  The Fickian
    time constant uses the elementary D = <v> lambda / 2, which is
    an ESTIMATE with an O(1) factor this file does not pin; it is
    drawn as a bound and labelled as one.

  WHERE THIS FILE DIFFERS FROM PHET
  ---------------------------------
  * PhET opens with zero particles of each species; this opens with
    100 heavy on the left and 100 light on the right, because a view
    that draws nothing is a defect here.  PhET's own defaults (both
    species 28 AMU, 125 pm, 300 K, N = 0) are one chip away.
  * The controls are sliders on PhET's own grids (number in tens,
    mass in ones, radius in fives, temperature in fifties) rather
    than spinners.
  * No sound, no keyboard help, no PhET-iO.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's constants are read from docs/phets/diffusion_en.html
  (BOLTZMANN 8316, KG_PER_AMU 1.66e-27, ATM_PER_KPA 0.00986923;
  widthRange 16e3, dividerThickness 100;
  DIFFUSION_NUMBER_OF_PARTICLES_RANGE (0,200,0), MASS (4,32,28),
  RADIUS (50,250,125), INITIAL_TEMPERATURE (50,500,300); DELTAS
  {numberOfParticles:10, mass:1, radius:5, initialTemperature:50}).
  Everything else is derived in build/diffusion/derive.py with scipy
  and pinned in selfTest; the numbers are in refvals.txt.
-->
