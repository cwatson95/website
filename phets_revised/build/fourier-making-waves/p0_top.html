<!--
  ===================================================================
  fourier-making-waves.html — eleven harmonics with amplitudes you set
  by hand, the classic waveforms written as sums of sines or cosines,
  the ringing a truncated series leaves at a jump, a game of matching
  a waveform by ear-free arithmetic, and a wave packet drawn beside
  its own spectrum
  ===================================================================

  Remake of PhET Interactive Simulations' Fourier: Making Waves
  (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New
  code; no PhET code or assets.  The model, its constants and its
  controls follow PhET's build 1.1.5 (docs/phets/fourier-making-waves_en.html);
  every number taken from that build is marked "PhET's value" in the
  code and is READ OUT of it by build/fourier-making-waves/derive.py
  rather than typed from memory.

  Six views.  THE HARMONICS is PhET's Discrete screen: up to eleven
  harmonics whose amplitudes you drag, drawn one per colour, their sum
  below, PhET's five presets (sinusoid, triangle, square, sawtooth,
  wave packet) and custom, sines or cosines, the domain switched
  between space, time and space & time, the waveform the infinite
  series converges to, and PhET's wavelength/period caliper.
  THE CONVERGENCE, THE SPECTRUM and THE TRANSFORM PAIR are this file's
  own analysis views.  THE WAVE GAME is PhET's Wave Game screen: five
  levels, an unknown waveform drawn in magenta, and the amplitudes to
  find.  THE WAVE PACKET is PhET's Wave Packet screen: a Gaussian in k
  with adjustable centre, width and component spacing, its components,
  its sum, and the envelope.

  WHAT IS EXACT HERE
  ------------------
  Almost all of it.  This sim is arithmetic, not a solver, and every
  number it prints has a closed form that derive.py re-derives and
  falsifies independently:

  * The preset coefficients are the textbook Fourier series and are
    CHECKED AGAINST THE WAVEFORMS THEY BELONG TO, not quoted: derive.py
    integrates sgn(sin u), (2/pi) asin(sin u) and u/pi against sin nu
    and cos nu with scipy.integrate.quad broken at every corner, and
    the closed forms 4/(pi n), 8/(pi^2 n^2), 2/(pi n) come back to
    2.5e-13.  The coefficients of the WRONG parity come back zero to
    1e-13 as well, which is what says the sine forms are odd and the
    cosine forms even.
  * PhET's wave-packet preset is a hard-coded table of 66 numbers.
    derive.py shows that table IS exp(-(n-c)^2/2 sigma^2) with centre
    c = (N+1)/2 and width sigma = N/5, to 5e-7 — PhET's own printed
    precision — for 65 of the 66; the one exception is N = 10, n = 2
    (and its mirror n = 9), where PhET's table reads 0.216255 and the
    Gaussian gives 0.216265.  That looks like a transposed digit in
    PhET's table.  This file uses the closed form, and selfTest pins
    both numbers so the difference cannot be lost.
  * Parseval's theorem holds to 4e-14 for every preset and for random
    amplitude sets in both sine and cosine series, checked against
    quadrature of the square of the actual sum — and the complete
    series reproduce the exact mean squares 1, 1/3 and 1/3.
  * The Gibbs overshoot is the Wilbraham-Gibbs constant.  The peak of
    the M-term square-wave partial sum sits at x = L/4M and equals
    (2/pi) Si(pi) = 1.1789797444721668 in the limit, so the overshoot
    is 8.9489872236 % of the jump.  derive.py finds the peak by dense
    sampling plus Brent refinement and confirms the closed form to
    1e-10, and the approach to the limit is O(1/M^2).  The triangle
    wave, being continuous, never exceeds 1 — the falsifier for a
    "series always overshoot" reading.
  * The wave packet's transform pair is exact: the Fourier transform
    of the normalised Gaussian A(k) = exp(-(k-k0)^2/2 sigma_k^2) /
    (sigma_k sqrt(2 pi)) is exp(-sigma_k^2 x^2 / 2) cos(k0 x), so
    sigma_x sigma_k = 1 exactly and the envelope is 1/sqrt(e) at
    x = sigma_x.  The DISCRETE packet is not an approximation to that
    either: by Poisson summation the two-sided sum over k_n = n k1 is
    EXACTLY the continuous packet repeated every lambda1 = 2 pi / k1,
    which derive.py verifies to 1e-13 and selfTest re-verifies in JS.
    What PhET's one-sided truncated sum loses is only the Gaussian
    tail below k = 0 and above k = 24 pi, bounded by erfc and worth
    3.2e-5 at the default.
  * The analysis direction is checked too: projecting a sum back onto
    sin n u and cos n u returns the amplitudes to 1e-15, and the
    radix-2 FFT this file uses for the spectrum view agrees with a
    direct O(N^2) DFT — and with numpy.fft in derive.py — to 1e-15.

  WHAT IS MODELLED RATHER THAN EXACT
  ----------------------------------
  * The drawn curves are sampled: 1000 points across the x-window (the
    same MAX_POINTS_PER_DATA_SET PhET uses).  Every number in the
    readout is computed from the closed forms, never read off a curve,
    with two stated exceptions: the measured peak of a partial sum and
    the measured position of that peak, which are found on a refined
    grid and whose grid error selfTest bounds.
  * The wave game's challenges are random.  The generator follows
    PhET's: pick the level's number of harmonics out of eleven at
    random, give each a non-zero amplitude that is a multiple of 0.1
    in [-1.5, 1.5], and reject a repeat of the previous answer.  A
    guess counts as correct when every amplitude matches exactly, as
    in PhET.
  * "Infinite harmonics" is drawn as the ideal waveform (the function
    the series converges to), which is what PhET draws too.  At a jump
    the series does NOT converge to it pointwise, and the convergence
    view is where that is made visible.

  WHAT IS NOT MODELLED
  --------------------
  * Sound.  PhET's Discrete screen can play the series through the Web
    Audio API; this file is silent, as every sim in this collection is.
  * PhET's per-screen zoom buttons and its "equation form" dropdown
    (which rewrites the equation in terms of lambda, k, T, omega or f).
    The equation bar carries one form per view and the readout carries
    the numbers; the expanded form of the sum is written out under the
    harmonics view instead.
  * PhET's keyboard-only amplitude editing, its info dialogs and its
    PhET-iO instrumentation.

  DATA SOURCES
  ------------
  Every constant: PhET's build 1.1.5, read by derive.py's regexes out
  of docs/phets/fourier-making-waves_en.html (MAX_HARMONICS = 11,
  MAX_AMPLITUDE = 1.5, the 0.05 and 0.1 amplitude steps, five game
  levels, f1 = 440 Hz, L = 1 m, T = 1000/440 ms, the wave-packet
  screen's k range 0..24 pi, its centre 9 pi..15 pi, its width
  pi..4 pi and its four component spacings 0, pi/4, pi/2, pi).
  Every other number: mathematics, re-derived in
  build/fourier-making-waves/derive.py with numpy and scipy and pinned
  into selfTest as (derive).
