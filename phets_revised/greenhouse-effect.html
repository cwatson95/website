<title>Greenhouse Effect &mdash; the layer model, solved exactly</title>
<!--
  ===================================================================
  greenhouse-effect.html — a remake of PhET's Greenhouse Effect: the
  waves, the photons and the layer model, on one exactly-solvable
  radiative-equilibrium engine
  ===================================================================

  Remake of PhET Interactive Simulations' Greenhouse Effect (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.  Built against PhET's greenhouse-effect 1.3.13, whose
  three screens (Waves, Photons, Layer Model) all run on one "layers
  model": a stack of sheets that pass sunlight and absorb infrared.
  Its constants were read out of the minified original in
  docs/phets/greenhouse-effect_en.html and are cited as PhET's values
  wherever they appear.

  Five views.  THE WAVES and THE PHOTONS are PhET's first two screens:
  the same 12-layer atmosphere, greenhouse-gas concentration set either
  by a slider or by a date (ice age, 1750, 1950, 2020), a cloud, a
  surface albedo that turns glacial at the ice age, the thermometer in
  K / °C / °F, the energy-balance meter at the top of the atmosphere
  and the flux meter — drawn once as waves whose brightness is the
  actual transmitted flux, and once as individual photons absorbed and
  re-emitted by a seeded random number generator.  THE LAYERS is PhET's
  Layer Model screen: 0 to 3 explicit sheets, their absorbance, the
  solar intensity from 1/2 to 2 suns, the surface albedo, and each
  sheet's own temperature.  THE LADDER and THE RECORD are this file's
  own analysis: the law the whole sim obeys, drawn; and PhET's four
  dates against the real climate record, with the line between physics
  and fit drawn explicitly.

  WHAT IS EXACT HERE
  ------------------
  The whole model.  For N sheets of infrared absorbance a_i over a
  ground of albedo alpha under an absorbed solar flux F, each sheet
  conserving energy makes the NET upward flux the same at every level,
  so U_i = U_{i-1} - F a_i/(2 - a_i), and with U_N = F at the top,

      sigma T_s^4 = F [ 1 + sum_i a_i/(2 - a_i) ].

  That is derived in build/greenhouse-effect/derive.py, implemented
  twice in this file (the recursion above, and a dense Gaussian solve
  of the full 13-unknown flux system that never uses the invariant),
  and asserted against a forward-Euler march of PhET's own layer ODE.
  Energy balance is asserted at every sheet, at the ground and at the
  top of the atmosphere to 1e-9 W/m^2, and the net flux is asserted
  constant with altitude.  For a_i = 1 it collapses to the textbook
  T_s = (N+1)^(1/4) T_eff, which is asserted at every N from 0 to 12.
  The Stefan-Boltzmann constant is asserted against scipy's CODATA
  value AND against 2 pi^5 k^4 / 15 h^3 c^2 built from CODATA h, c, k;
  the Earth's effective temperature, 254.578 K, comes from the 2015 IAU
  nominal solar irradiance 1361 W/m^2 and a Bond albedo of 0.30.
  The photon picture is tied to the flux solution exactly: the chance
  that an infrared photon leaving the ground escapes to space, under
  "absorbed with probability a_i, then re-emitted up or down with
  probability 1/2", is F/sigma T_s^4 — proved here as a Markov chain,
  as the closed form, and by a seeded Monte Carlo (the sim and derive.py
  share one 32-bit generator whose stream is pinned bit for bit).
  One more exact statement, about PhET's own convention: PhET's sheet
  absorbs a fraction a but emits a FULL blackbody sigma T^4 in each
  direction, which is not Kirchhoff's law.  It makes no difference at
  all to the fluxes or to the surface temperature — the emitted flux
  per direction is a(U+D)/2 either way — and changes every sheet's
  reported temperature by exactly a^(-1/4).  Both are printed.

  WHAT IS PhET'S FIT, NOT PHYSICS
  -------------------------------
  Everything that turns a greenhouse-gas concentration into an
  absorbance.  PhET's concentration screens use twelve sheets at
  i x 50000/13 m with

      a_i = 0.85 c exp(-altitude/8400 m),

  and map its four dates to c = 0.625 (ice age), 0.7147 (1750),
  0.7182 (1950), 0.7446 (2020).  Those five numbers, the sun's
  343.6 W/m^2, the albedos 0.2 / 0.225 / 0.3, the cloud's 12.5 %, and
  the CO2 / CH4 / N2O values printed beside each date are PhET's,
  quoted as PhET's and not adjusted.  They are a teaching fit, not a
  radiative-transfer calculation: no line strengths, no bands, no
  overlap, no water vapour, no lapse rate.  What comes OUT of them is
  this file's exact solve, and the answer is worth stating plainly —
  PhET's 1750 surface temperature is 296.48 K (23.3 °C), about 8.5 K
  above the real Earth's 288 K, while the DIFFERENCES between its dates
  are good: the ice age is 6.29 K colder than 1750 (the Last Glacial
  Maximum was about 6 K colder) and 2020 is 1.32 K warmer than 1750
  (the observed figure is about 1.2 K).  PhET tuned the changes, not
  the absolute level.  The independent check that this really is PhET's
  model: the hottest state its concentration screens can reach is
  309.13 K by this solve, and PhET hard-codes 309 as its thermometer's
  EXPECTED_MAX_TEMPERATURE.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  The temperature is integrated with PhET's own heat capacities (a
  sheet's response is 85000/(85000 x 3e-7 x rho x c_p) K per J/m^2:
  exactly 32/15 for the ground, 1.5873 for a glass sheet), from PhET's
  own starting state (the ground at its 245 K night floor, every sheet
  at 0 K), in four forward-Euler sub-steps of a 1/60 s frame — which is
  well inside the ODE's stability bound of h < 0.0198 s at 520 K, and
  the sim clamps against that bound.  It settles in about 30 s of model
  time; the exact steady state is printed alongside the live value, and
  a button jumps to it.  The waves are drawn, not solved: their
  brightness is the model's own transmitted flux at that height, which
  is more honest than PhET's decorative per-layer attenuators and is
  labelled on the canvas.  The flux meter and its draggable sensor
  likewise read the LIVE model, and the meter draws the exact steady
  profile beside it: settled, the two coincide to 1e-8 W/m^2 (asserted);
  with the sun switched off they part company and the meter follows the
  model.  The photons ARE simulated, with PhET's own
  rules (created at the ground at sigma T^4/7.8 per second, one in five
  drawn unless "more photons"; absorbed with probability a_i on
  crossing a sheet; re-emitted after a fixed hold, up or down at even
  odds), but as in PhET they are a display: the energy that sets the
  temperature is the flux model, not the photon count, and the sim says
  so.  The altitude axis is compressed by a factor printed on the
  canvas.  The clock advances a fixed 1/60 s per frame so the headless
  suites are deterministic.

  NOT MODELLED
  ------------
  Everything that is not radiation: no convection, no lapse rate, no
  latent heat, no water vapour feedback, no ocean, no clouds beyond
  PhET's one 12.5 % reflector, no day and night, no latitude, no
  spectral detail whatever — a real atmosphere's infrared opacity is a
  forest of lines, and "absorbance a" stands in for all of it.  The
  Earth in this model is a single point with one temperature.  Also
  absent from this remake, being PhET's interface rather than its
  physics: the sounds, the voicing and alt-text layers, the animated
  glacier and cloud artwork, the flux meter as a box you drag around
  (its SENSOR is draggable here; the panel is fixed beside the window),
  PhET's "pause / step / speed" trio (here: a time checkbox, one step
  and a jump-to-equilibrium button), and its per-layer wave
  attenuators.  Two things differ from PhET's: the sun starts SHINING,
  so a view shows something the moment it opens (PhET's "start
  sunlight" button is a "cold start" button here), and the twelve
  sheets of the concentration screens are DRAWN, faintly, with an
  opacity that follows each sheet's absorbance -- PhET keeps them
  invisible on those screens, and the captions here point at them.

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's values, read from docs/phets/greenhouse-effect_en.html
  (1.3.13): the sun's 343.6 W/m^2 and its 0.5-2 x range; the albedos
  0.2 (green meadow), 0.225 (partially glaciated) and 0.3 (layer
  model), the slider's 0-0.9; the 50 km top of atmosphere and the
  sheet spacing 50000/(N+1); 12 sheets on the concentration screens
  and 3 on the layer model, absorbance 0.1-1; a_i = 0.85 c
  exp(-z/8400); the four dates' concentrations and their CO2 (180, 277,
  311, 413 ppm), CH4 (380, 694, 1116, 1889 ppb) and N2O (215, 271, 288,
  333 ppb); the cloud's 12.5 % (0.125 x 85000/18000 x 18000/85000
  exactly); the 245 K night floor and the 125 K layer-model floor;
  sigma = 5.670374419e-8; the densities and heat capacities 1250/1250
  (earth) and 2500/840 (glass) with the 3e-7 volume coefficient; the
  photon rules and rates; and the thermometer's 309 K expected maximum.
  Physics, from scipy's CODATA: sigma = 5.670374419184e-8 W/m^2/K^4,
  h, c, k.  Cited scalars: the 2015 IAU nominal total solar irradiance
  1361 W/m^2, Earth's Bond albedo 0.30 (NASA's fact sheet gives 0.306,
  which moves T_eff by 0.55 K), the conventional global mean surface
  temperature 288 K, the Last Glacial Maximum about 6 K below
  pre-industrial, and about 1.2 K of observed warming since 1750.
  Nothing else is measured, and nothing was taken from PhET's code or
  assets.
-->

  <span class="sub" id="sub">A remake of PhET&rsquo;s Greenhouse Effect: sunlight in, infrared out, and a stack of absorbing layers in between &mdash; with the steady state solved in closed form, T<sub>s</sub> = T<sub>eff</sub>[1 + &Sigma; a/(2&minus;a)]<sup>1/4</sup></span>

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],

/* ------------------------------------------------------------------ *
 *  the closed form.  Each sheet conserves energy, so the net upward
 *  flux U_i - D_i is the same at every level and equals F at the top;
 *  substituting D_i = U_i - F into the transfer and balance equations
 *  gives U_i = U_{i-1} - F a_i/(2-a_i), whence
 *      sigma T_s^4 = F [ 1 + sum_i a_i/(2-a_i) ].
 *  (derive.py carries the derivation and the brute-force check.)
 * ------------------------------------------------------------------ */
function solveClosed(a,F){
  const n=a.length, step=new Array(n);
  let sum=0;
  for(let i=0;i<n;i++){ step[i]=a[i]/(2-a[i]); sum+=step[i]; }
  const Eg=F*(1+sum);
  const U=new Array(n+1), D=new Array(n+1), J=new Array(n);
  U[0]=Eg;
  for(let i=0;i<n;i++) U[i+1]=U[i]-F*step[i];
  for(let i=0;i<=n;i++) D[i]=U[i]-F;
  for(let i=0;i<n;i++) J[i]=a[i]*(U[i]+D[i+1])/2;

          Tkirch:J.map((j,i)=>a[i]>0?teff(j/a[i]):0),            /* emissivity = absorptivity */

function gaussSolve(M,b){
  const n=b.length, A=M.map((r,i)=>r.slice().concat([b[i]]));
  for(let k=0;k<n;k++){
    let p=k;
    for(let i=k+1;i<n;i++) if(Math.abs(A[i][k])>Math.abs(A[p][k])) p=i;
    const t=A[k]; A[k]=A[p]; A[p]=t;
    if(Math.abs(A[k][k])<1e-300) throw new Error('gaussSolve: singular');
    for(let i=k+1;i<n;i++){
      const f=A[i][k]/A[k][k];
      for(let j=k;j<=n;j++) A[i][j]-=f*A[k][j];
    }
  }
  const x=new Array(n);
  for(let i=n-1;i>=0;i--){
    let s=A[i][n];
    for(let j=i+1;j<n;j++) s-=A[i][j]*x[j];
    x[i]=s/A[i][i];
  }
  return x;
}
/* The SAME steady state, solved as a dense linear system in (Eg, J_1..J_N) straight from the
   transfer and balance equations, without ever using the net-flux invariant.  Two independent
   routes to one answer — the PLAYBOOK's rule for anything implemented cleverly. */
function solveBrute(a,F){
  const n=a.length;
  const U=[], D=[];
  for(let i=0;i<=n;i++){ U.push(new Array(n+1).fill(0)); D.push(new Array(n+1).fill(0)); }
  U[0][0]=1;
  for(let i=0;i<n;i++){
    for(let j=0;j<=n;j++) U[i+1][j]=(1-a[i])*U[i][j];
    U[i+1][1+i]+=1;
  }
  for(let i=n-1;i>=0;i--){
    for(let j=0;j<=n;j++) D[i][j]=(1-a[i])*D[i+1][j];
    D[i][1+i]+=1;
  }
  const M=[], rhs=[];
  const r0=new Array(n+1).fill(0);
  for(let j=0;j<=n;j++) r0[j]=-D[0][j];
  r0[0]+=1;
  M.push(r0); rhs.push(F);                                    /* Eg - D_0 = F */
  for(let i=0;i<n;i++){
    const r=new Array(n+1).fill(0);
    for(let j=0;j<=n;j++) r[j]=-a[i]*(U[i][j]+D[i+1][j]);
    r[1+i]+=2;
    M.push(r); rhs.push(0);                                   /* 2 J_i = a_i (U_{i-1}+D_i) */
  }
  const x=gaussSolve(M,rhs);
  const Uv=U.map(row=>row.reduce((s,c,j)=>s+c*x[j],0));
  const Dv=D.map(row=>row.reduce((s,c,j)=>s+c*x[j],0));
  return {Eg:x[0],J:x.slice(1),U:Uv,D:Dv,Tg:teff(x[0]),Tlayer:x.slice(1).map(teff)};
}
/* the residuals the suite asserts: every sheet, the ground, the top, and the net flux */
function balanceResiduals(s){
  const a=s.a, n=a.length;
  let lay=0, net=0;
  for(let i=0;i<n;i++) lay=Math.max(lay,Math.abs(a[i]*(s.U[i]+s.D[i+1])-2*s.J[i]));
  for(let i=0;i<=n;i++) net=Math.max(net,Math.abs(s.U[i]-s.D[i]-s.F));
  return {layer:lay, toa:Math.abs(s.U[n]-s.F), ground:Math.abs(s.Eg-s.F-s.D[0]), net};
}

/* ------------------------------------------------------------------ *
 *  PhET's own layer ODE, marched forward.  A sheet's linearised rate
 *  is 8 K_SHEET sigma T^3, so forward Euler needs h < 2/(8 K sigma
 *  T^3) — 0.0198 s at 520 K.  SUBSTEPS keeps the sim's step inside it
 *  and stepModel CLAMPS against the bound rather than trusting it.
 * ------------------------------------------------------------------ */
const FRAME_DT=1/60, SUBSTEPS=4;
function stabilityH(Tmax){ return 2/(8*K_SHEET*GH.SIGMA*Tmax*Tmax*Tmax); }
/* PhET's starting state: the ground at ITS OWN floor (245 K on the concentration screens,
   125 K on the layer model) and every sheet at the 0 K its constructor leaves it at */
function makeThermal(n,T0){ return {Tg:T0, T:new Array(n).fill(0), t:0}; }
/* the instantaneous fluxes for a given set of temperatures (NOT the steady state) */
function fluxesNow(th,a){
  const n=a.length, U=new Array(n+1), D=new Array(n+1);
  const Jg=sbFlux(th.Tg), J=th.T.map(sbFlux);
  U[0]=Jg;
  for(let i=0;i<n;i++) U[i+1]=(1-a[i])*U[i]+J[i];
  D[n]=0;
  for(let i=n-1;i>=0;i--) D[i]=(1-a[i])*D[i+1]+J[i];
  return {U,D,Jg,J};
}
function marchFrame(th,a,F,Tfloor,dt,nsub){
  const n=a.length, h=(dt===undefined?FRAME_DT:dt)/(nsub===undefined?SUBSTEPS:nsub);
  const m=(nsub===undefined?SUBSTEPS:nsub);
  const hmax=stabilityH(Math.max(300,th.Tg+120));
  const steps=h>hmax?Math.ceil(m*h/hmax):m;                   /* clamp against the bound */
  const hh=(dt===undefined?FRAME_DT:dt)/steps;
  for(let k=0;k<steps;k++){
    const f=fluxesNow(th,a);
    let Tg=th.Tg+K_GROUND*(F+f.D[0]-f.Jg)*hh;
    if(Tg<Tfloor) Tg=Tfloor;
    const T=new Array(n);
    for(let i=0;i<n;i++){
      let Ti=th.T[i]+K_SHEET*(a[i]*(f.U[i]+f.D[i+1])-2*f.J[i])*hh;
      if(Ti<0) Ti=0;
      T[i]=Ti;
    }
    th.Tg=Tg; th.T=T;
  }
  th.t+=(dt===undefined?FRAME_DT:dt);
  return th;
}

/* ------------------------------------------------------------------ *
 *  the photon picture
 * ------------------------------------------------------------------ */
/* A 32-bit linear congruential generator.  Every product stays below 2^53, so JavaScript's
   doubles carry it exactly and derive.py's Python twin produces the IDENTICAL stream — which
   is what lets the suite pin the Monte Carlo against the Markov chain. */
function makeRng(seed){
  let s=((seed|0)>>>0)%4294967296;
  return {next(){ s=(1664525*s+1013904223)%4294967296; return s/4294967296; },
          seed(v){ s=((v|0)>>>0)%4294967296; },
          state(){ return s; }};
}
/* The chance that an IR photon leaving the ground upward escapes to space, under "absorbed
   with probability a_i on crossing sheet i, then re-emitted up or down at even odds".
   p_i = escape from moving up about to cross sheet i; q_i = the same moving down.
   p_{n+1} = 1 (space), q_0 = 0 (the ground absorbs all infrared). */
function escapeMarkov(a){
  const n=a.length;
  if(n===0) return 1;
  const N=2*n, M=[], b=new Array(N).fill(0);
  for(let i=0;i<N;i++) M.push(new Array(N).fill(0));
  const pi=i=>i-1, qi=i=>n+i-1;
  for(let i=1;i<=n;i++){
    /* cGo = pass through (1-a) OR be absorbed and sent on the same way (a/2);
       cBack = be absorbed and sent back the other way (a/2). */
    const ai=a[i-1], cGo=(1-ai)+ai/2, cBack=ai/2;
    M[pi(i)][pi(i)]=1;
    if(i+1<=n) M[pi(i)][pi(i+1)]-=cGo; else b[pi(i)]+=cGo;    /* above the top sheet: space */
    if(i-1>=1) M[pi(i)][qi(i-1)]-=cBack;                      /* q_0 = 0: the ground absorbs */
    M[qi(i)][qi(i)]=1;
    if(i-1>=1) M[qi(i)][qi(i-1)]-=cGo;
    if(i+1<=n) M[qi(i)][pi(i+1)]-=cBack; else b[qi(i)]+=cBack;
  }
  return gaussSolve(M,b)[pi(1)];
}
/* the same walk, simulated with the seeded generator — returns the measured statistics */
function escapeMonteCarlo(a,m,seed){
  const n=a.length, r=makeRng(seed===undefined?12345:seed);
  let esc=0, cross=0, absorbed=0, up=0;
  for(let k=0;k<m;k++){
    let i=1, d=1;
    for(;;){
      if(i>n){ esc++; break; }
      if(i<1) break;
      cross++;
      if(r.next()<a[i-1]){
        absorbed++;
        if(r.next()<0.5){ d=1; up++; } else d=-1;
        i+=d;
      } else i+=d;
    }
  }
  return {p:esc/m, esc, cross, absorbed, up, m};
}
/* PhET's photon production rates (a display layer: the temperature comes from the fluxes) */
function irPhotonRate(T,Tfloor){ return T>Tfloor?sbFlux(T)/GH.IR_RATE_DIV:0; }

/* ================================================================== *
 *  state: two atmospheres (PhET's twelve-sheet concentration model    *
 *  and its three-sheet layer model), their thermal clocks, the photon *
 *  population, the per-view model, the readout, the equation bar and  *
 *  the tag                                                            *
 * ================================================================== */
const TABS=[['waves','the waves'],['photons','the photons'],['layers','the layers'],
            ['ladder','the ladder'],['record','the record']];
const SKY_VIEWS={waves:1, photons:1, layers:1};
const COL={pos:'#b8ec4c', ref:'#e8843a', live:'#cd35c4', struct:'#5ac8e0', dim:'#8b93a6',
           edge:'#242a3a', off:'#161c2c',
           sun:'#f6d365', ir:'#e8583a', sky0:'#050a18', sky1:'#0d1b33',
           ground:'#2f6b34', glacier:'#cfe3ef', cloud:'#9fb0c4', sheet:'#5ac8e0'};
const RO_W=300;
/* the house #hint sits at bottom:11px on top of the last line of a caption anchored at
   H - 12, so every caption here ends HINT_H higher (build/wave-on-a-string/, Known-bad) */
const HINT_H=18;

const MODE_LIST=[{id:'value',name:'by concentration'},{id:'date',name:'by date'}];
const UNIT_LIST=[{id:'K',name:'kelvin'},{id:'C',name:'celsius'},{id:'F',name:'fahrenheit'}];
const DATE_LIST=DATES.map(d=>({id:d.id,name:d.name}));

const DEFAULTS={view:'waves',
  mode:'value', conc:0.5, date:'y1750', cloud:false, unit:'C',
  nLayers:1, absorb:1.0, intensity:1.0, albedo:GH.ALB_LM,
  balance:true, flux:false, sheets:true, morePhotons:false,
  sun:true, running:true, kirch:false};
const ST=Object.assign({},DEFAULTS);

/* PhET's flux-meter sensor, draggable up and down the window */
const PROBE={z:20000};
const PROBE0={z:20000};
const DRAG={what:null};

/* the two thermal states, one per PhET screen family */
const TH={conc:makeThermal(GH.N_CONC,GH.TMIN_NIGHT), lm:makeThermal(GH.N_LM,GH.TMIN_LM)};
/* the photon population (the concentration screens and the layer model share the drawing) */
const PH={list:[], rng:makeRng(20260921), acc:{vis:0,ir:0}, nVis:0, nIr:0,
          emitted:0, escaped:0, returned:0, crossings:0, absorbed:0, up:0};
const PHOTON_SPEED=9000;                 /* GreenhouseEffectConstants.SPEED_OF_LIGHT, m/s */
const PHOTON_SEED=20260921;

function resetPhotons(){
  PH.list.length=0; PH.rng.seed(PHOTON_SEED);
  PH.acc.vis=0; PH.acc.ir=0; PH.nVis=0; PH.nIr=0;
  PH.emitted=0; PH.escaped=0; PH.returned=0; PH.crossings=0; PH.absorbed=0; PH.up=0;
}
function resetThermal(){
  TH.conc=makeThermal(GH.N_CONC,GH.TMIN_NIGHT); TH.lm=makeThermal(GH.N_LM,GH.TMIN_LM);
  resetPhotons();
}

/* ---- which atmosphere is on show, and what drives it --------------------- */
function currentDate(){ return DATES.find(d=>d.id===ST.date)||DATES[1]; }
function concNow(){ return ST.mode==='date'?currentDate().c:ST.conc; }
/* PhET switches the ground to its glaciated albedo only for the ice age BY DATE */
function concAlbedo(){ return (ST.mode==='date'&&currentDate().glacier)?GH.ALB_GLACIER:GH.ALB_MEADOW; }
function cloudOn(){ return ST.mode==='date'?true:ST.cloud; }
/* PhET forces the cloud on in by-date mode only as a control-enabling rule; the cloud itself
   is only in the model when the user has asked for it, which here is the checkbox alone. */
/* the number of sheets is a COUNT: the slider's step is 1, but a headless harness can put
   1.5 in it, and new Array(1.5) is a RangeError rather than a rounding error */
function nSheets(){ return Math.max(0,Math.min(GH.N_LM,Math.round(ST.nLayers))); }
function atmosphere(){
  if(ST.view==='layers'){
    const alt=layerAltitudes(GH.N_LM), a=[], nA=nSheets();
    for(let i=0;i<GH.N_LM;i++) a.push(i<nA?ST.absorb:0);
    const F=ST.sun?(1-ST.albedo)*GH.S_SUN*ST.intensity:0;
    return {kind:'lm', a, alt, F, albedo:ST.albedo, floor:GH.TMIN_LM, th:TH.lm,
            n:GH.N_LM, nActive:nA, hold:GH.PHOTON_HOLD_LM,
            Sin:ST.sun?GH.S_SUN*ST.intensity:0, cloud:false};
  }
  const c=concNow(), alb=concAlbedo(), a=concAbsorbance(c,GH.N_CONC);
  const S=ST.sun?GH.S_SUN:0;
  const Safter=S*(ST.cloud?1-CLOUD_REFL:1);
  return {kind:'conc', a, alt:layerAltitudes(GH.N_CONC), F:(1-alb)*Safter, albedo:alb,
          floor:GH.TMIN_NIGHT, th:TH.conc, n:GH.N_CONC, nActive:GH.N_CONC,
          hold:GH.PHOTON_HOLD_CONC, conc:c, Sin:S, Safter, cloud:ST.cloud};
}
/* an atmosphere with the sheets that are actually absorbing, for the solver: an inactive
   layer-model sheet (a = 0) is transparent and radiates nothing, so it simply is not there */
function activeAbs(A){ return A.a.filter(x=>x>0); }

/* ---- the clock ---------------------------------------------------------- */
function stepFrame(){
  if(!ST.running||!SKY_VIEWS[ST.view]) return false;
  const A=atmosphere();
  marchFrame(A.th,A.a,A.F,ST.sun?A.floor:A.floor,FRAME_DT,SUBSTEPS);
  if(ST.view==='photons') stepPhotons(A,FRAME_DT);
  return true;
}
function settle(){
  const A=atmosphere(), s=solveClosed(activeAbs(A),A.F);
  if(!ST.sun){ A.th.Tg=A.floor; A.th.T=A.th.T.map(()=>0); return; }
  A.th.Tg=Math.max(s.Tg,A.floor);
  let k=0;
  A.th.T=A.a.map(x=>x>0?s.Tlayer[k++]:0);
}

/* ---- the photons (PhET's own rules; a display, not the energy model) ----- */
function stepPhotons(A,dt){
  const R=PH.rng, half=GH.SPAN_W/2;
  /* sunlight: PhET creates 10 x intensity per second and draws one in five */
  const visRate=ST.sun?GH.VIS_RATE*(A.kind==='lm'?ST.intensity:1):0;
  PH.acc.vis+=visRate*dt;
  while(PH.acc.vis>=1){
    PH.acc.vis-=1;
    PH.list.push({x:(R.next()-0.5)*GH.SPAN_W, y:GH.TOP, vx:0, vy:-PHOTON_SPEED,
                  ir:false, hold:0, show:(PH.nVis%GH.SHOW_ONE_IN)===0});
    PH.nVis++;
  }
  /* infrared from the ground: PhET's sigma T^4 / 7.8 per second, one in five drawn */
  const irRate=irPhotonRate(A.th.Tg,A.floor);
  PH.acc.ir+=irRate*dt;
  while(PH.acc.ir>=1){
    PH.acc.ir-=1;
    const ang=(R.next()-0.5)*PI/8;
    PH.list.push({x:(R.next()-0.5)*GH.SPAN_W, y:0,
                  vx:PHOTON_SPEED*Math.sin(ang), vy:PHOTON_SPEED*Math.cos(ang),
                  ir:true, hold:0, show:(PH.nIr%GH.SHOW_ONE_IN)===0});
    PH.nIr++; PH.emitted++;
  }
  const keep=[];
  for(const p of PH.list){
    if(p.hold>0){                                   /* held inside a sheet */
      p.hold-=dt;
      if(p.hold<=0){
        /* PhET re-emits up or down at even odds; the lateral jump is its own decoration */
        const up=R.next()<0.5;
        PH.absorbed++; if(up) PH.up++;
        const ang=(R.next()-0.5)*PI/4;
        p.vy=(up?1:-1)*PHOTON_SPEED*Math.cos(ang);
        p.vx=PHOTON_SPEED*Math.sin(ang);
      }
      keep.push(p); continue;
    }
    const y0=p.y;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x>GH.SPAN_W/2) p.x-=GH.SPAN_W;
    if(p.x<-GH.SPAN_W/2) p.x+=GH.SPAN_W;
    if(!p.ir){
      if(A.cloud&&y0>GH.CLOUD_Y&&p.y<=GH.CLOUD_Y&&Math.abs(p.x-GH.CLOUD_X)<GH.CLOUD_W/2
         &&R.next()<CLOUD_REFL*GH.SPAN_W/GH.CLOUD_W){ p.vy=-p.vy; keep.push(p); continue; }
      if(p.y<=0){
        if(R.next()<A.albedo){ p.y=0; p.vy=-p.vy; keep.push(p); }   /* reflected */
        continue;                                                   /* else absorbed */
      }
      if(p.y<GH.TOP+1||p.vy<0) keep.push(p);
      continue;
    }
    /* infrared: a sheet crossed is a chance to be absorbed */
    let gone=false;
    for(let i=0;i<A.a.length;i++){
      const z=A.alt[i];
      if(A.a[i]<=0) continue;
      if((y0<z&&p.y>=z)||(y0>z&&p.y<=z)){
        PH.crossings++;
        if(R.next()<=A.a[i]){ p.y=z; p.hold=A.hold; p.vx=0; p.vy=0; }
        break;
      }
    }
    if(p.y>=GH.TOP&&p.vy>0){ PH.escaped++; gone=true; }
    if(p.y<0){ PH.returned++; gone=true; }
    if(!gone) keep.push(p);
  }
  PH.list=keep.slice(0,1400);
}

/* a big, cached Monte Carlo of the same walk, so the panel can put a measured escape
   fraction beside the exact one (the live population is far too small and far too
   transient to be a statistic) */
const MC_CACHE={};
function mcFor(a,m,seed){
  const key=a.map(x=>x.toFixed(6)).join(',')+'|'+m+'|'+seed;
  if(!MC_CACHE[key]) MC_CACHE[key]=escapeMonteCarlo(a,m,seed);
  return MC_CACHE[key];
}

/* ---- the models --------------------------------------------------------- */
function skyModel(){
  const A=atmosphere(), aa=activeAbs(A), s=solveClosed(aa,A.F);
  const live=fluxesNow(A.th,A.a);
  const M={A, s, live, a:A.a, alt:A.alt, F:A.F, albedo:A.albedo,
           Tg:A.th.Tg, Tlayer:A.th.T.slice(), Tsteady:s.Tg, t:A.th.t,
           Teff:teff(A.F), esc:s.esc, sum:s.sum,
           net:A.F-live.U[A.a.length]+live.D[A.a.length],
           Utop:live.U[A.a.length], Dg:live.D[0],
           res:balanceResiduals(s),
           warming:s.Tg-teff(A.F)};
  /* the steady-state profile on the full sheet list (inactive sheets keep a null) */
  let k=0;
  M.Ssteady=A.a.map(x=>x>0?s.Tlayer[k++]:null);
  k=0;
  M.Skirch=A.a.map(x=>x>0?s.Tkirch[k++]:null);
  /* two flux profiles over the same levels: the LIVE one (what the sheets are radiating
     right now, which is what the meter and its sensor read, as PhET's do) and the exact
     steady one (the reference the panel draws beside it).  They coincide to machine
     precision once the model has settled, which selfTest asserts. */
  M.Ul=live.U.slice(); M.Dl=live.D.slice();
  M.Us=[]; M.Ds=[];
  { let j=0;
    M.Us.push(s.U[0]); M.Ds.push(s.D[0]);
    for(let i=0;i<A.a.length;i++){ if(A.a[i]>0) j++; M.Us.push(s.U[j]); M.Ds.push(s.D[j]); } }
  /* the flux-meter sensor: the exact fluxes at the altitude the probe sits at.  The profiles
     are piecewise constant between sheets, so the index is the number of sheets below it. */
  { let i=0;
    while(i<A.alt.length&&PROBE.z>=A.alt[i]) i++;
    const Safter=A.Safter===undefined?A.Sin:A.Safter;
    const visDown=(A.cloud&&PROBE.z>GH.CLOUD_Y)?A.Sin:Safter;
    M.probe={z:PROBE.z, i, U:M.Ul[i], D:M.Dl[i], net:M.Ul[i]-M.Dl[i],
             Us:M.Us[i], Ds:M.Ds[i], visDown, visUp:Safter*A.albedo}; }
  if(ST.view==='photons'){
    M.mc=mcFor(aa,20000,12345);
    M.pExact=escapeMarkov(aa);
    M.photons=PH.list.filter(p=>ST.morePhotons||p.show);
    M.counts={emitted:PH.emitted, escaped:PH.escaped, returned:PH.returned,
              crossings:PH.crossings, absorbed:PH.absorbed, up:PH.up,
              live:PH.list.length, drawn:M.photons.length};
    M.irRate=irPhotonRate(A.th.Tg,A.floor);
  }
  return M;
}
function ladderModel(){
  const F=(1-GH.ALB_MEADOW)*GH.S_SUN, T0=teff(F);
  const black=[];
  for(let n=0;n<=12;n++) black.push({n, T:solveClosed(new Array(n).fill(1),F).Tg,
                                        law:Math.pow(n+1,0.25)*T0});
  const curves=[];
  for(const n of [1,2,3,12]){
    const pts=[];
    for(let k=0;k<=100;k++){
      const a=k/100;
      pts.push([a,solveClosed(new Array(n).fill(a),F).Tg]);
    }
    curves.push({n,pts});
  }
  /* "the stack you have loaded" is the LAYER MODEL's, not whatever atmosphere() would
     hand back for this view: the ladder's two sliders are the layer model's two sliders,
     and reading the concentration stack here made the absorbance slider do nothing. */
  const aa=new Array(nSheets()).fill(ST.absorb);
  const Fl=(1-ST.albedo)*GH.S_SUN*ST.intensity;
  const here=solveClosed(aa,Fl);
  /* the equivalent uniform absorbance of whatever stack is loaded: the a with the same sum */
  const nEq=Math.max(aa.length,1);
  const aEq=aa.length?2*here.sum/(nEq+here.sum):0;
  /* what the real atmosphere is worth in these terms: sigma Ts^4 / F = 1 + Sigma, so the
     Earth's own Sigma is (288/254.578)^4 - 1, which one sheet reaches at a = 2S/(1+S) */
  const eT0=teff((1-EARTH_ALBEDO)*SOLAR_CONSTANT/4);
  const eSum=Math.pow(EARTH_TSURF/eT0,4)-1;
  /* the marker belongs ON the plotted family, which is drawn at PhET's own F (albedo 0.2,
     one sun); `here` is the same stack at whatever albedo and intensity the layer model is
     set to, and the readout prints that one.  Two different questions, two numbers. */
  const hereCurveT=solveClosed(aa,F).Tg;
  return {F, T0, black, curves, here, hereCurveT, nHere:aa.length, aEq,
          earth:{T0:eT0, Ts:EARTH_TSURF, sum:eSum},
          earthEqA:2*eSum/(1+eSum),
          n:aa.length, a:ST.absorb};
}
function recordModel(){
  const rows=DATES.map(d=>{
    const alb=d.glacier?GH.ALB_GLACIER:GH.ALB_MEADOW;
    const F=(1-alb)*GH.S_SUN, a=concAbsorbance(d.c,GH.N_CONC);
    const s=solveClosed(a,F);
    return {d, alb, F, a, s, Ts:s.Tg};
  });
  const curve=[];
  for(let k=0;k<=120;k++){
    const c=k/120;
    curve.push([c,solveClosed(concAbsorbance(c,GH.N_CONC),(1-GH.ALB_MEADOW)*GH.S_SUN).Tg]);
  }
  const curveCloud=[];
  for(let k=0;k<=120;k++){
    const c=k/120;
    curveCloud.push([c,solveClosed(concAbsorbance(c,GH.N_CONC),
                                   (1-GH.ALB_MEADOW)*GH.S_SUN*(1-CLOUD_REFL)).Tg]);
  }
  const base=rows[1].Ts;
  /* what the ice age WOULD be on the plotted curve, i.e. over a green meadow: the gap is
     the whitening of the ground, and the view draws it as a connector rather than giving
     the point a second colour the legend would have to reuse */
  const iceOnCurve=solveClosed(concAbsorbance(rows[0].d.c,GH.N_CONC),
                               (1-GH.ALB_MEADOW)*GH.S_SUN).Tg;
  return {rows, curve, curveCloud, iceOnCurve,
          dIce:rows[0].Ts-base, d2020:rows[3].Ts-base,
          hottest:solveClosed(concAbsorbance(1,GH.N_CONC),(1-GH.ALB_MEADOW)*GH.S_SUN).Tg,
          coldest:teff((1-GH.ALB_GLACIER)*GH.S_SUN*(1-CLOUD_REFL)),
          earthTs:EARTH_TSURF, earthTeff:teff((1-EARTH_ALBEDO)*SOLAR_CONSTANT/4),
          here:concNow()};
}
function buildModel(){
  const view=ST.view, M={view, unit:ST.unit};
  if(SKY_VIEWS[view]) M.S=skyModel();
  else if(view==='ladder') M.L=ladderModel();
  else M.R=recordModel();
  return M;
}

function roNote(M){
  const v=M.view;
  if(v==='waves') return 'The waves are drawn, not solved: the brightness of each band is the flux the exact solve carries at that height. PhET&rsquo;s twelve sheets sit at multiples of 50/13 km with a = 0.85 c e<sup>&minus;z/8400&nbsp;m</sup> &mdash; PhET&rsquo;s fit, not a radiative-transfer calculation.';
  if(v==='photons') return 'The photons ARE simulated, with PhET&rsquo;s rules and a seeded generator &mdash; but as in PhET they are a display: the temperature comes from the flux model, not from the photon count. The escape chance they measure is the flux ratio F/&sigma;T<sub>s</sub><sup>4</sup>.';
  if(v==='layers') return 'PhET&rsquo;s Layer Model screen. A sheet absorbs a fraction a of the infrared crossing it and radiates a full &sigma;T<sup>4</sup> each way &mdash; PhET&rsquo;s convention, not Kirchhoff&rsquo;s law. It changes no flux at all; it changes every sheet temperature by exactly a<sup>&minus;1/4</sup>, which the tick box shows.';
  if(v==='ladder') return 'Every screen of this sim obeys one line: &sigma;T<sub>s</sub><sup>4</sup> = F[1 + &Sigma; a<sub>i</sub>/(2&minus;a<sub>i</sub>)]. Fully absorbing sheets make it (N+1), and the famous fourth root follows.';
  return 'The concentrations, the 0.85 and the 8400 m are PhET&rsquo;s fit. The temperatures are this file&rsquo;s exact solve of them. PhET tuned the DIFFERENCES between its dates, not the absolute level.';
}

    'sunlight goes straight through the greenhouse gas and warms the ground; the infrared the ground sends back does not, and every sheet that catches it sends half of it down again');

    'one photon at a time: absorbed with probability a on crossing a sheet, then sent up or down at even odds &mdash; the chance it ever reaches space is exactly the flux ratio');
  if(v==='layers') return E('2&sigma;T<sub>i</sub><sup>4</sup> = a<sub>i</sub>(U<sub>i&minus;1</sub> + D<sub>i</sub>) &nbsp;&rArr;&nbsp; <span class="hl">U<sub>i</sub> = U<sub>i&minus;1</sub> &minus; F&thinsp;a<sub>i</sub>/(2 &minus; a<sub>i</sub>)</span>',

    'the whole model in one line: a stack of black sheets multiplies the outgoing flux by N + 1, and the fourth root is why ten sheets are not ten times hotter');
  return E('a<sub>i</sub> = <span class="hl2">0.85</span>&thinsp;c&thinsp;e<sup>&minus;z<sub>i</sub>/8400 m</sup>, &nbsp; c = 0.625 / 0.7147 / 0.7182 / 0.7446 &nbsp;&rarr;&nbsp; <span class="hl">T<sub>s</sub></span>',
    'PhET&rsquo;s fit on the left, this file&rsquo;s exact solve on the right &mdash; the numbers in the middle are a teaching choice, and the page says so');

function tagHTML(M){
  const v=M.view, nm=TABS.find(t=>t[0]===v)[1];

    const S=M.S;

    else bits.push(S.A.nActive+' sheet'+(S.A.nActive===1?'':'s')+', a = '+fmt(ST.absorb,2));

/* ================================================================== *
 *  drawing helpers (y UP in world maps; layouts built bottom-up from *
 *  a measured caption) — from projects/simulations/build_buoy/       *

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;
  if(fill) worldFill(ctx,map,pts,fill);
  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){
  ctx.beginPath(); ctx.moveTo(map.X(a[0]),map.Y(a[1])); ctx.lineTo(map.X(b[0]),map.Y(b[1]));
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
  POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1]));
}
function dot(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){
  axes(ctx,b,xlo,xhi,ylo,yhi,opt);
  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));
  }
  out.main=box(left,top,right-left,Math.max(80,mainH));
  return out;
}
function drawCaption(ctx,L){ caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT); }
function marker(ctx,b,xlo,xhi,ylo,yhi,x,y,col){
  const X=b.x+b.w*(x-xlo)/(xhi-xlo), Y=b.y1-b.h*(y-ylo)/(yhi-ylo);
  dot(ctx,clamp(X,b.x,b.x1),clamp(Y,b.y,b.y1),4.5,col||COL.live,'#fff');
}

/* the stage: the window, a thermometer column, an optional flux panel, a caption */
function skyLayout(ctx,W,H,M,capFull,capShort){

  const availH=Math.max(120,fit.capY-18-top);
