  const thermW=Math.min(150,Math.max(96,span*0.13));
  const fluxW=showFlux?Math.min(280,span*0.26):0;
  const winW=span-thermW-fluxW-(showFlux?26:0)-14;
  const win=box(left,top,Math.max(160,winW),availH);
  const therm=box(win.x1+14,top,thermW,availH);
  const flux=showFlux?box(therm.x1+26,top,fluxW,availH):null;
  const exag=(win.h/GH.TOP)/(win.w/GH.SPAN_W);
  return {narrow,left,right,win,therm,flux,showFlux,
          capY:fit.capY,capTxt:fit.txt,capW,exag,top};
}
/* the ground is a band at the bottom of the window, and altitude zero is its TOP surface:
   mapping z = 0 to win.y1 instead drew every low photon inside the soil */
function groundH(win){ return Math.max(10,win.h*0.045); }
function skyMapOf(win){
  const gh=groundH(win), y0=win.y1-gh, hh=win.h-gh;
  return {gh, y0,
          yOf:z=>y0-hh*clamp(z,0,GH.TOP)/GH.TOP,
          xOf:x=>win.x+win.w*(x+GH.SPAN_W/2)/GH.SPAN_W,
          zOf:Y=>GH.TOP*(y0-Y)/hh};
}

/* a wave line drawn as NBAND constant-alpha sub-paths, so one line is a handful of strokes
   rather than a hundred: the display-list capture stays readable and the browser stays fast */
const NBAND=6;
function waveLine(ctx,x,yA,yB,amp,wl,phase,col,alphaAt,lw){
  const dy=yB-yA, n=48;
  for(let b=0;b<NBAND;b++){
    const t0=b/NBAND, t1=(b+1)/NBAND;
    const al=alphaAt((t0+t1)/2);
    if(al<=0.012) continue;
    ctx.beginPath();
    const i0=Math.floor(t0*n), i1=Math.ceil(t1*n);
    for(let i=i0;i<=i1;i++){
      const t=i/n, y=yA+dy*t, xx=x+amp*Math.sin(TAU*(y/wl)+phase);
      if(i===i0) ctx.moveTo(xx,y); else ctx.lineTo(xx,y);
    }
    ctx.strokeStyle=rgba(col,clamp(al,0,1)); ctx.lineWidth=lw||2; ctx.lineJoin='round';
    ctx.stroke();
  }
}
function arrowV(ctx,x,y,dir,col,size){
  const s=size||6;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-s*0.6,y+dir*s); ctx.lineTo(x+s*0.6,y+dir*s);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}

/* the window itself: sky, ground, cloud, the sheets */
function drawWindow(ctx,W,H,M,L){
  const S=M.S, win=L.win, mp=skyMapOf(win);
  /* the sky, dark above and a little lighter at the ground */
  const NB=10;
  for(let i=0;i<NB;i++){
    const y0=win.y+win.h*i/NB, y1=win.y+win.h*(i+1)/NB;
    ctx.fillStyle=mix(COL.sky0,COL.sky1,(i+0.5)/NB);
    ctx.fillRect(win.x,y0,win.w,y1-y0+0.6);
  }
  /* the ground */
  const gh=mp.gh;
  const glac=S.A.kind==='conc'&&ST.mode==='date'&&currentDate().glacier;
  ctx.fillStyle=glac?COL.glacier:COL.ground;
  ctx.fillRect(win.x,win.y1-gh,win.w,gh);
  ctx.fillStyle=glac?'#eef6fb':'#3f8a44';
  ctx.fillRect(win.x,win.y1-gh,win.w,3);
  /* the sheets */
  for(let i=0;i<S.a.length;i++){
    const y=mp.yOf(S.alt[i]), a=S.a[i];
    if(a<=0){
      if(S.A.kind==='lm'&&ST.sheets){
        ctx.beginPath(); ctx.moveTo(win.x+4,y); ctx.lineTo(win.x1-4,y);
        ctx.strokeStyle=rgba(COL.dim,0.28); ctx.lineWidth=1; ctx.setLineDash([5,5]);
        ctx.stroke(); ctx.setLineDash([]);
      }
      continue;
    }
    const strong=S.A.kind==='lm';
    if(strong||ST.sheets){
      ctx.fillStyle=rgba(COL.sheet,clamp(0.10+0.55*a,0,0.72));
      ctx.fillRect(win.x+4,y-(strong?4:1.6),win.w-8,strong?8:3.2);
    }
  }
  /* the cloud */
  if(S.A.cloud){
    const cx=mp.xOf(GH.CLOUD_X), cy=mp.yOf(GH.CLOUD_Y);
    const rx=win.w*GH.CLOUD_W/GH.SPAN_W/2, ry=win.h*GH.CLOUD_H/GH.TOP/2;
    const pts=[];
    for(let k=0;k<=30;k++){ const th=TAU*k/30; pts.push([cx+rx*Math.cos(th),cy+ry*Math.sin(th)]); }
    ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath(); ctx.fillStyle=rgba(COL.cloud,0.55); ctx.fill();
    ctx.strokeStyle=rgba('#e6eef7',0.5); ctx.lineWidth=1; ctx.stroke();
  }
  /* the sun's disc, in the window's top-left corner */
  if(ST.sun){
    const sx=win.x+win.w*0.09, sy=win.y+win.h*0.055, r=Math.min(16,win.h*0.035);
    dot(ctx,sx,sy,r,COL.sun);
    ctx.strokeStyle=rgba(COL.sun,0.5); ctx.lineWidth=1.4;
    for(let k=0;k<8;k++){ const th=TAU*k/8;
      ctx.beginPath(); ctx.moveTo(sx+r*1.35*Math.cos(th),sy+r*1.35*Math.sin(th));
      ctx.lineTo(sx+r*2.0*Math.cos(th),sy+r*2.0*Math.sin(th)); ctx.stroke(); }
  }
  frame(ctx,win,'#2a3347');
  return {mp,gh};
}

/* the altitude scale down the left edge of the window */
function drawAltAxis(ctx,W,H,L){
  const win=L.win, mp=skyMapOf(win);
  ctx.font=SM_FONT; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle='#6f7789';
  for(let z=0;z<=50;z+=10){
    const y=mp.yOf(z*1000);
    ctx.beginPath(); ctx.moveTo(win.x-5,y); ctx.lineTo(win.x,y);
    ctx.strokeStyle='#2a3347'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillText(z,win.x-8,y);
  }
  ctx.save(); ctx.translate(win.x-38,win.y+win.h/2); ctx.rotate(-PI/2);
  ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#8b93a6'; ctx.font=LAB_FONT;
  ctx.fillText('altitude, km',0,0); ctx.restore();
}

/* the thermometer column: the surface reading, its steady state and the bare-rock value */
function drawThermometer(ctx,W,H,M,L){
  const S=M.S, b=L.therm, u=M.unit;
  const lm=S.A.kind==='lm';
  const lo=lm?120:238, hi=lm?480:316;
  const tubeW=Math.min(26,b.w*0.30), x=b.x+b.w*0.30;
  const top=b.y+28, bot=b.y1-62;
  const yOf=T=>bot-(bot-top)*(clamp(T,lo,hi)-lo)/(hi-lo);
  ctx.fillStyle='#10131b'; ctx.fillRect(x-tubeW/2,top,tubeW,bot-top);
  frame(ctx,box(x-tubeW/2,top,tubeW,bot-top),'#2a3347');
  dot(ctx,x,bot+11,tubeW*0.72,'#1a1f2b','#2a3347',1);
  /* the fill */
  const yT=yOf(S.Tg);
  ctx.fillStyle=COL.pos; ctx.fillRect(x-tubeW/2+3,yT,tubeW-6,bot-yT);
  dot(ctx,x,bot+11,tubeW*0.72-3,COL.pos);
  /* ticks */
  ctx.font=SM_FONT; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#6f7789';
  const step=lm?60:20;
  for(let T=Math.ceil(lo/step)*step;T<=hi;T+=step){
    const y=yOf(T);
    ctx.beginPath(); ctx.moveTo(x+tubeW/2,y); ctx.lineTo(x+tubeW/2+4,y);
    ctx.strokeStyle='#2a3347'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillText(fmt(tempIn(T,u),0),x+tubeW/2+6,y);
  }
  /* the exact steady state, and the bare-rock temperature */
  const marks=[[S.Tsteady,COL.ref,'steady'],[S.Teff,'#8b93a6','no gas']];
  for(const [T,c,nm] of marks){
    if(T<lo||T>hi) continue;
    const y=yOf(T);
    ctx.beginPath(); ctx.moveTo(x-tubeW/2-7,y); ctx.lineTo(x+tubeW/2,y);
    ctx.strokeStyle=c; ctx.lineWidth=1.4; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
    lab(ctx,W,H,x-tubeW/2-9,y,nm,c,SM_FONT,'right');
  }
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font='italic 13px Georgia, serif';
  ctx.fillStyle='#aeb6c6'; ctx.fillText('surface',b.x+b.w/2,b.y+4);
  ctx.font='13px -apple-system, sans-serif'; ctx.fillStyle=COL.pos; ctx.textBaseline='top';
  ctx.fillText(plain(tstr(S.Tg,u,1)),b.x+b.w/2,b.y1-28);
  ctx.font=SM_FONT; ctx.fillStyle='#6f7789';
  ctx.fillText(plain('scale '+fmt(tempIn(lo,u),0)+' to '+fmt(tempIn(hi,u),0)+' '+UNIT_SYM[u]),
               b.x+b.w/2,b.y1-13);
}

/* the energy-balance meter at the top of the atmosphere (PhET's "Energy Balance" panel).
   Its rectangle is registered in LABELS before anything else is labelled, so every later
   lab() dodges it: the box is drawn with ctx.fillText, which the registry cannot see, and
   "redirected down" landed under "top of atmosphere" in every size until it was. */
function balanceBox(L){
  const win=L.win, bw=Math.min(154,win.w*0.30), bh=Math.min(104,win.h*0.30);
  /* below this it cannot hold its own labels: the readout still carries every number */
  if(bw<128||bh<76) return null;
  return box(win.x1-bw-10,win.y+10,bw,bh);
}
function reserveBoxes(L){
  const b=ST.balance?balanceBox(L):null;
  if(b) LABELS.push([b.x,b.y,b.x1,b.y1]);
}
function drawBalance(ctx,W,H,M,L){
  const S=M.S, b=balanceBox(L);
  if(!b) return null;
  ctx.fillStyle='rgba(8,10,18,.80)'; ctx.fillRect(b.x,b.y,b.w,b.h);
  frame(ctx,b,'#2a3347');
  const Sin=S.A.Sin, Safter=S.A.Safter===undefined?Sin:S.A.Safter;
  const out=Sin*(S.A.cloud?CLOUD_REFL:0)+Safter*S.albedo+S.Utop;
  const net=Sin-out;
  const mx=Math.max(1,Sin,out);
  const cols=[COL.sun,COL.ir], vals=[Sin,out], names=['in','out'];
  /* the box, top to bottom: title, bars, the bars' names, the net.  Everything is placed
     from the box's own edges, so a narrow window cannot push a label out of it. */
  const barW=Math.min(24,b.w*0.16), gap=Math.min(20,b.w*0.14), x0=b.x+12;
  const base=b.y1-34, top2=b.y+26;
  ctx.font=SM_FONT; ctx.textAlign='center';
  for(let i=0;i<2;i++){
    const hgt=(base-top2)*vals[i]/mx, x=x0+i*(barW+gap);
    ctx.fillStyle=cols[i]; ctx.fillRect(x,base-hgt,barW,hgt);
    ctx.textBaseline='top'; ctx.fillStyle='#8b93a6'; ctx.fillText(names[i],x+barW/2,base+3);
  }
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#aeb6c6'; ctx.fillText('top of atmosphere',b.x+8,b.y+6);
  ctx.fillStyle=Math.abs(net)<0.5?COL.pos:COL.ref;
  ctx.fillText(plain('net '+(net>=-0.05?'+':'−')+fmt(Math.abs(net),1)+' W/m²'),b.x+8,b.y1-16);
  return {net,out,Sin};
}

/* the flux meter: the exact upward, downward and net infrared flux against altitude */
function drawFluxPanel(ctx,W,H,M,L){
  const S=M.S, b=L.flux;
  if(!b) return;
  const n=S.a.length;
  const zs=[0].concat(S.alt), Us=S.Ul, Ds=S.Dl;
  const hiF=Math.max(1,S.s.Eg*1.06,S.Ul[0]*1.06);
  const pb=box(b.x,b.y+16,b.w,b.h-106);
  axesR(ctx,pb,0,hiF,0,GH.TOP/1000,{nx:4,ny:6,xlab:'infrared flux, W/m²',ylab:'altitude, km',
        title:titleFor(pb,'the flux meter','flux'),
        xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  /* the profiles are piecewise constant between sheets: draw them as staircases */
  const stair=(vals)=>{
    const xs=[], ys=[];
    for(let i=0;i<vals.length;i++){
      const zlo=zs[i]/1000, zhi=(i+1<zs.length?zs[i+1]:GH.TOP)/1000;
      xs.push(vals[i],vals[i]); ys.push(zlo,zhi);
    }
    return [xs,ys];
  };
  const [ux,uy]=stair(Us), [dx,dy]=stair(Ds);
  const netX=Us.map((u,i)=>u-Ds[i]);
  const [nx2,ny2]=stair(netX);
  const [sx2,sy2]=stair(S.Us);
  polyline(ctx,pb,sx2,sy2,0,hiF,0,GH.TOP/1000,rgba(COL.ref,0.55),2.6);
  polyline(ctx,pb,dx,dy,0,hiF,0,GH.TOP/1000,COL.live,1.8);
  polyline(ctx,pb,ux,uy,0,hiF,0,GH.TOP/1000,COL.pos,2);
  polyline(ctx,pb,nx2,ny2,0,hiF,0,GH.TOP/1000,COL.ref,1.6,[5,4]);
  legendAuto(ctx,pb,[[COL.pos,'up, now'],[COL.live,'down, now'],
                     [rgba(COL.ref,0.55),'up, exact'],[COL.ref,'net']]);
  /* capUnder, not caption: the panel is narrow and this wraps to three lines there, which
     ran into the main caption at 1180 x 760 and 760 x 520 until the room was measured */
  capUnder(ctx,b.x,pb.y1+40,'Settled, the net is the same at every height — and the exact profile lies under the live one.',
           b.w,L.capY-6);
}

/* PhET's flux-meter sensor: a draggable bar across the window reading the exact fluxes */
function drawProbe(ctx,W,H,M,L){
  const S=M.S, win=L.win, mp=skyMapOf(win), y=mp.yOf(S.probe.z);
  ctx.beginPath(); ctx.moveTo(win.x,y); ctx.lineTo(win.x1,y);
  ctx.strokeStyle=rgba(COL.live,0.85); ctx.lineWidth=1.6; ctx.setLineDash([7,4]);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=COL.live; ctx.fillRect(win.x-6,y-5,12,10);
  lab(ctx,W,H,win.x1-6,y-12,fmt(S.probe.z/1000,1)+' km · up '+fmt(S.probe.U,1)
      +' · down '+fmt(S.probe.D,1),COL.live,SM_FONT,'right');
}

/* ---- view A: the waves -------------------------------------------------- */
const CAP_WAVES='PhET&rsquo;s Waves screen. Sunlight (yellow) crosses the greenhouse gas untouched and warms the ground; the ground sends infrared (red) back up, and every sheet that catches some of it radiates half of that back down. The brightness of each infrared band is the flux the exact solve carries at that height, not a decoration: it steps down at every sheet, and the step is F&thinsp;a/(2&minus;a) &mdash; a few per cent per sheet at PhET&rsquo;s concentrations, which is what the flux meter is for.';
const CAP_WAVES_S='Sunlight down, infrared up; the infrared brightness is the exact transmitted flux.';
function viewWaves(ctx,W,H,M){
  const L=skyLayout(ctx,W,H,M,CAP_WAVES,CAP_WAVES_S);
  const S=M.S, {mp,gh}=drawWindow(ctx,W,H,M,L), win=L.win;
  reserveBoxes(L);
  const ph=(S.t*3)%1*TAU;
  const yGround=win.y1-gh;
  /* sunlight: four lines down the left half */
  if(ST.sun){
    const amp=Math.min(7,win.w*0.012), wl=Math.max(22,win.h*0.075);
    for(let k=0;k<4;k++){
      const x=win.x+win.w*(0.08+0.09*k);
      waveLine(ctx,x,win.y+4,yGround,amp,wl,ph+k*1.1,COL.sun,
        t=>{ const z=GH.TOP*(1-t);
             if(S.A.cloud&&z<GH.CLOUD_Y&&Math.abs(GH.SPAN_W*(0.08+0.09*k)-GH.SPAN_W/2-GH.CLOUD_X)<GH.CLOUD_W/2)
               return 0.75*(1-CLOUD_REFL);
             return 0.75; });
    }
    /* the part the ground throws back */
    if(S.albedo>0.001){
      const x=win.x+win.w*0.40;
      waveLine(ctx,x,yGround,win.y+4,Math.min(5,win.w*0.009),Math.max(20,win.h*0.07),ph,
               COL.sun,()=>0.22+0.5*S.albedo,1.4);
      arrowV(ctx,x,win.y+8,1,rgba(COL.sun,0.7),5);
      lab(ctx,W,H,x+8,win.y+20,fmt(100*S.albedo,0)+' % reflected',rgba(COL.sun,0.85),SM_FONT,'left');
    }
  }
  /* infrared: upward bands on the right, downward beside them */
  const Eg=Math.max(S.Ul[0],S.s.Eg,1e-9);
  const upAlpha=t=>{ const z=GH.TOP*(1-t); return 0.15+0.72*fluxAt(S,z,true)/Eg; };
  const dnAlpha=t=>{ const z=GH.TOP*(1-t); return 0.10+0.72*fluxAt(S,z,false)/Eg; };
  const amp2=Math.min(7,win.w*0.012), wl2=Math.max(20,win.h*0.062);
  for(let k=0;k<3;k++){
    const x=win.x+win.w*(0.54+0.075*k);
    waveLine(ctx,x,yGround,win.y+4,amp2,wl2,ph+k*0.9,COL.ir,upAlpha,2.2);
    arrowV(ctx,x,win.y+8,1,rgba(COL.ir,0.85),5);
  }
  for(let k=0;k<3;k++){
    const x=win.x+win.w*(0.80+0.06*k);
    waveLine(ctx,x,win.y+4,yGround,amp2,wl2,ph+k*1.3+2,COL.ir,dnAlpha,1.8);
    arrowV(ctx,x,yGround-4,-1,rgba(COL.ir,0.8),5);
  }
  lab(ctx,W,H,win.x+win.w*0.545,yGround-14,'infrared out',rgba(COL.ir,0.95),SM_FONT,'left');
  lab(ctx,W,H,win.x+win.w*0.80,win.y+win.h*0.52,'redirected down',rgba(COL.ir,0.8),SM_FONT,'left');
  if(ST.sun) lab(ctx,W,H,win.x+win.w*0.08,win.y+win.h*0.30,'sunlight',rgba(COL.sun,0.9),SM_FONT,'left');
  drawProbe(ctx,W,H,M,L);
  drawAltAxis(ctx,W,H,L);
  if(ST.balance) drawBalance(ctx,W,H,M,L);
  drawThermometer(ctx,W,H,M,L);
  if(L.showFlux) drawFluxPanel(ctx,W,H,M,L);
  lab(ctx,W,H,win.x+6,mp.y0-5,'vertical scale ×'+fmt(L.exag,2)+' the horizontal',
      '#8b93a6',SM_FONT,'left','bottom');
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
}
/* the exact flux at a height, from the steady solve (piecewise constant between sheets) */
function fluxAt(S,z,up){
  const zs=S.alt;
  let i=0;
  while(i<zs.length&&z>=zs[i]) i++;
  return up?S.Ul[i]:S.Dl[i];
}

/* ---- view B: the photons ------------------------------------------------ */
const CAP_PHOTONS='PhET&rsquo;s Photons screen, one photon at a time. Yellow photons fall from the sun and are absorbed by the ground or bounced off it; red infrared photons leave the ground at &sigma;T&#8308;/7.8 per second and, on crossing a sheet, are absorbed with probability a and later sent off again up or down at even odds. A seeded generator drives all of it, so the picture is the same every run &mdash; and the chance a photon ever reaches space is the flux ratio F/&sigma;T_s&#8308;, which the panel measures.';
const CAP_PHOTONS_S='Photons absorbed with probability a, re-emitted up or down at even odds.';
function viewPhotons(ctx,W,H,M){
  const L=skyLayout(ctx,W,H,M,CAP_PHOTONS,CAP_PHOTONS_S);
  const S=M.S, {mp,gh}=drawWindow(ctx,W,H,M,L), win=L.win;
  reserveBoxes(L);
  const r=Math.max(2,Math.min(3.6,win.w*0.0045));
  for(const p of S.photons){
    const x=mp.xOf(p.x), y=mp.yOf(p.y)-(p.ir?0:0);
    if(y<win.y-2||y>win.y1+2) continue;
    if(p.hold>0){ dot(ctx,x,y,r*1.5,rgba(COL.ir,0.35)); dot(ctx,x,y,r,COL.ir); }
    else dot(ctx,x,y,r,p.ir?COL.ir:COL.sun);
  }
  drawProbe(ctx,W,H,M,L);
  drawAltAxis(ctx,W,H,L);
  /* the measured statistics, on the window */
  const mcb=box(win.x+8,win.y+8,Math.min(216,win.w*0.42),58);
  LABELS.push([mcb.x,mcb.y,mcb.x1,mcb.y1]);
  ctx.fillStyle='rgba(8,10,18,.94)'; ctx.fillRect(mcb.x,mcb.y,mcb.w,mcb.h);
  frame(ctx,mcb,'#2a3347');
  ctx.font=SM_FONT; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#aeb6c6'; ctx.fillText(plain('escape chance of an IR photon'),mcb.x+7,mcb.y+6);
  ctx.fillStyle=COL.ref; ctx.fillText(plain('exact  '+fmt(100*S.pExact,3)+' %'),mcb.x+7,mcb.y+22);
  ctx.fillStyle=COL.pos;
  ctx.fillText(plain('measured  '+fmt(100*S.mc.p,3)+' % ('+S.mc.m+' walks)'),mcb.x+7,mcb.y+38);
  if(ST.balance) drawBalance(ctx,W,H,M,L);
  drawThermometer(ctx,W,H,M,L);
  if(L.showFlux) drawFluxPanel(ctx,W,H,M,L);
  lab(ctx,W,H,win.x+6,mp.y0-5,(ST.morePhotons?'every simulated photon drawn':
      'one photon in '+GH.SHOW_ONE_IN+' drawn (PhET)')
      +' · vertical scale ×'+fmt(L.exag,2),'#8b93a6',SM_FONT,'left','bottom');
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
}

/* ---- view C: the layers ------------------------------------------------- */
const CAP_LAYERS='PhET&rsquo;s Layer Model screen, with the sheets made explicit. Each is a sheet of glass: transparent to sunlight, absorbing a fraction a of the infrared crossing it, and radiating away exactly what it absorbs &mdash; half up and half down. Because each sheet balances, the NET upward flux is the same at every height, so the upward flux simply steps down by F&thinsp;a/(2&minus;a) at each sheet and the surface has to be hotter by the same total.';
const CAP_LAYERS_S='Sheets of glass: each radiates away what it absorbs, half up and half down.';
function viewLayers(ctx,W,H,M){
  const L=skyLayout(ctx,W,H,M,CAP_LAYERS,CAP_LAYERS_S);
  const S=M.S, {mp,gh}=drawWindow(ctx,W,H,M,L), win=L.win;
  reserveBoxes(L);
  const yGround=win.y1-gh, ph=(S.t*3)%1*TAU;
  if(ST.sun){
    const amp=Math.min(6,win.w*0.011), wl=Math.max(22,win.h*0.075);
    for(let k=0;k<3;k++)
      waveLine(ctx,win.x+win.w*(0.09+0.075*k),win.y+4,yGround,amp,wl,ph+k*1.1,COL.sun,()=>0.7);
  }
  /* between each pair of levels, the up and down arrows with their flux written on them */
  const zs=[0].concat(S.alt), n=S.a.length;
  const xu=win.x+win.w*0.52, xd=win.x+win.w*0.70;
  for(let i=0;i<=n;i++){
    const zlo=zs[i], zhi=i<n?zs[i+1]:GH.TOP;
    const y0=mp.yOf(zlo), y1=mp.yOf(zhi), ym=(y0+y1)/2;
    if(y0-y1<16) continue;
    const U=S.Ul[i], D=S.Dl[i], Eg=Math.max(S.Ul[0],S.s.Eg,1e-9);
    ctx.beginPath(); ctx.moveTo(xu,y0-3); ctx.lineTo(xu,y1+7);
    ctx.strokeStyle=rgba(COL.pos,clamp(0.22+0.7*U/Eg,0,1)); ctx.lineWidth=3; ctx.stroke();
    arrowV(ctx,xu,y1+3,1,rgba(COL.pos,clamp(0.3+0.7*U/Eg,0,1)),6);
    lab(ctx,W,H,xu+9,ym,fmt(U,1),COL.pos,SM_FONT,'left');
    if(D>0.05){
      ctx.beginPath(); ctx.moveTo(xd,y1+3); ctx.lineTo(xd,y0-7);
      ctx.strokeStyle=rgba(COL.live,clamp(0.22+0.7*D/Eg,0,1)); ctx.lineWidth=3; ctx.stroke();
      arrowV(ctx,xd,y0-3,-1,rgba(COL.live,clamp(0.3+0.7*D/Eg,0,1)),6);
      lab(ctx,W,H,xd+9,ym,fmt(D,1),COL.live,SM_FONT,'left');
    }
  }
  /* the sheets' own temperatures */
  for(let i=0;i<n;i++){
    if(S.a[i]<=0) continue;
    const y=mp.yOf(S.alt[i]);
    const T=ST.kirch?S.Skirch[i]:S.Ssteady[i];
    const live=ST.kirch&&S.a[i]>0?S.A.th.T[i]*Math.pow(S.a[i],-0.25):S.A.th.T[i];
    lab(ctx,W,H,win.x+10,y-11,'sheet '+(i+1)+'  '+plain(tstr(live,M.unit,1)),
        '#dff3fa',SM_FONT,'left');
    if(Math.abs(live-T)>0.05)
      lab(ctx,W,H,win.x+10,y+11,'steady '+plain(tstr(T,M.unit,1)),rgba(COL.ref,0.95),SM_FONT,'left');
  }
  if(n>0&&S.A.nActive===0) lab(ctx,W,H,win.x+win.w/2,yGround-34,
      'no absorbing sheets: a bare rock','#aeb6c6',LAB_FONT,'center');
  drawProbe(ctx,W,H,M,L);
  drawAltAxis(ctx,W,H,L);
  if(ST.balance) drawBalance(ctx,W,H,M,L);
  drawThermometer(ctx,W,H,M,L);
  if(L.showFlux) drawFluxPanel(ctx,W,H,M,L);
  lab(ctx,W,H,win.x+6,mp.y0-5,'flux in W/m² · vertical scale ×'+fmt(L.exag,2),
      '#8b93a6',SM_FONT,'left','bottom');
  caption(ctx,L.left,L.capY,L.capTxt,L.capW,'#767e92',CAP_FONT);
}

/* ================================================================== *
 *  the two analysis views, the dispatch and the scene                 *
 * ================================================================== */

/* the room an analysis panel keeps below its frame: the axis title (at +21, 12 px tall)
   plus a one- or two-line caption */
const BOTTOM_RESERVE=76;

/* ---- view D: the ladder ------------------------------------------------- */
const CAP_LADDER='The law every screen of this sim obeys. Left: stack N sheets over the ground and the outgoing flux the surface must supply is multiplied by 1 + &Sigma; a/(2&minus;a) &mdash; for perfectly absorbing sheets that is exactly N + 1, so the temperature goes as the fourth root of it. Right: the same law against the absorbance of the sheets, for one, two, three and PhET&rsquo;s twelve. The markers are the stack you have loaded on the other views; the orange line is the real Earth, which is worth about two thirds of one perfect sheet.';
const CAP_LADDER_S='T_s = T_eff[1 + N a/(2 &minus; a)]^(1/4), and (N+1)^(1/4) when a = 1.';
function ladderGeo(ctx,W,H,M){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,CAP_LADDER,CAP_LADDER_S,capW,top+190);
  /* BOTTOM_RESERVE is the axis title (21 + 12 px below the frame) plus the per-panel
     caption; without it the x-axis label sat inside the main caption at every size */
  const availH=Math.max(110,fit.capY-16-top-BOTTOM_RESERVE);
  if(narrow){
    return {narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,
            A:box(left,top,right-left,availH),B:null};
  }
  const gut=76, w=(right-left-gut)/2;
  return {narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,
          A:box(left,top,w,availH),B:box(left+w+gut,top,w,availH)};
}
function viewLadder(ctx,W,H,M){
  const L=M.L, G=ladderGeo(ctx,W,H,M), u=M.unit;
  const TA=L.black.map(r=>r.T), lo=tempIn(TA[0]*0.97,u), hi=tempIn(TA[12]*1.03,u);
  /* panel A: temperature against the number of sheets */
  const A=G.A;
  axesR(ctx,A,0,12,lo,hi,{nx:7,ny:6,xlab:'number of absorbing sheets, N',
    ylab:'surface temperature, '+UNIT_SYM[u],
    title:titleFor(A,'the ladder: T_s = T_eff (N+1)^(1/4)','the ladder'),
    xfmt:t=>fmt(t,0),yfmt:t=>fmt(t,0)});
  /* the closed form as a continuous curve, and the solve as points on it */
  for(const [aval,col,dash] of [[1,COL.ref,null],[0.5,COL.struct,[6,4]],[0.25,COL.live,[3,3]]]){
    const xs=[], ys=[];
    for(let k=0;k<=240;k++){ const n=12*k/240;
      xs.push(n); ys.push(tempIn(L.T0*Math.pow(1+n*aval/(2-aval),0.25),u)); }
    polyline(ctx,A,xs,ys,0,12,lo,hi,col,aval===1?2:1.5,dash);
  }
  for(const r of L.black){
    const X=A.x+A.w*r.n/12, Y=A.y1-A.h*(tempIn(r.T,u)-lo)/(hi-lo);
    dot(ctx,X,Y,3.6,COL.pos,'#0a0c12',1);
  }
  /* the real Earth.  The LABEL waits until after the legend is placed, and the legend's
     own rectangle is registered, so lab() can dodge it — LEGEND_RECTS is a separate
     registry that the label placer does not read. */
  const yE=A.y1-A.h*(tempIn(L.earth.Ts,u)-lo)/(hi-lo);
  if(yE>A.y&&yE<A.y1){
    ctx.beginPath(); ctx.moveTo(A.x,yE); ctx.lineTo(A.x1,yE);
    ctx.strokeStyle=rgba('#e8843a',0.5); ctx.lineWidth=1.2; ctx.setLineDash([2,4]);
    ctx.stroke(); ctx.setLineDash([]); }
  { const lb=legendAuto(ctx,A,[[COL.pos,'the solve'],[COL.ref,'a = 1, closed form'],
                    [COL.struct,'a = 0.5'],[COL.live,'a = 0.25']]);
    if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]); }
  if(yE>A.y&&yE<A.y1) lab(ctx,W,H,A.x+6,yE-9,'the real Earth, 288 K','#e8843a',SM_FONT,'left');
  capUnder(ctx,A.x,A.y1+40,'Points: the flux system solved. Curves: T_eff[1 + Na/(2&minus;a)]^(1/4). They agree to 1 part in 10&#185;&#179;.',
           A.w,G.capY-6);
  /* panel B: temperature against absorbance */
  const B=G.B;
  if(B){
    const tops=L.curves.map(c=>c.pts[c.pts.length-1][1]);
    const hiB=tempIn(Math.max.apply(null,tops)*1.02,u), loB=tempIn(L.T0*0.98,u);
    axesR(ctx,B,0,1,loB,hiB,{nx:6,ny:6,xlab:'absorbance a of each sheet',
      ylab:'surface temperature, '+UNIT_SYM[u],
      title:titleFor(B,'and what a sheet&rsquo;s absorbance is worth','absorbance'),
      xfmt:t=>fmt(t,1),yfmt:t=>fmt(t,0)});
    const cols=[COL.pos,COL.struct,COL.live,COL.ref];
    L.curves.forEach((c,i)=>{
      polyline(ctx,B,c.pts.map(p=>p[0]),c.pts.map(p=>tempIn(p[1],u)),0,1,loB,hiB,cols[i],1.8);
      const last=c.pts[c.pts.length-1];
      lab(ctx,W,H,B.x1-8,B.y1-B.h*(tempIn(last[1],u)-loB)/(hiB-loB),'N = '+c.n,cols[i],SM_FONT,'right');
    });
    /* the marker: the stack loaded on the layer-model view */
    if(L.n>0){
      /* read the marker off the model's own solve, never a second one built here: a
         re-derived stack drifts from the one the model prints (drum_head Known-bad) */
      const Ts=tempIn(L.hereCurveT,u);
      marker(ctx,B,0,1,loB,hiB,L.a,Ts,COL.live);
      /* the label goes on whichever side of the marker has room: at a = 1 the marker is
         on the panel's right edge and a left-aligned label runs off it */
      const mX=B.x+B.w*L.a, mY=B.y1-B.h*(Ts-loB)/(hiB-loB);
      const rightSide=L.a<0.6;
      lab(ctx,W,H,mX+(rightSide?9:-9),mY-12,'you: N = '+L.n+', a = '+fmt(L.a,2),
          COL.live,SM_FONT,rightSide?'left':'right');
    }
    /* the Earth's equivalent sheet */
    { const aE=L.earthEqA;
      if(aE>0&&aE<=1){
        const X=B.x+B.w*aE;
        ctx.beginPath(); ctx.moveTo(X,B.y); ctx.lineTo(X,B.y1);
        ctx.strokeStyle=rgba('#e8843a',0.45); ctx.lineWidth=1.2; ctx.setLineDash([3,4]);
        ctx.stroke(); ctx.setLineDash([]);
        lab(ctx,W,H,X-6,B.y1-14,'Earth &asymp; one sheet at a = '+fmt(aE,3),'#e8843a',SM_FONT,'right'); } }
    capUnder(ctx,B.x,B.y1+40,'a = 0 is a bare rock; a = 1 is a perfect sheet. The rise is steep near a = 1 because a sheet that lets even a tenth through loses a tenth of its grip.',
             B.w,G.capY-6);
  }
  caption(ctx,G.left,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT);
}

/* ---- view E: the record ------------------------------------------------- */
const CAP_RECORD='Where PhET&rsquo;s numbers come from, and what they are worth. The curve is this file&rsquo;s exact solve of PhET&rsquo;s own fit, a_i = 0.85&thinsp;c&thinsp;e^(&minus;z/8400 m) on twelve sheets; the four rings are PhET&rsquo;s dates, and the ice age sits BELOW the curve because PhET whitens its ground as well (albedo 0.225 against 0.2). The fit is a teaching device &mdash; no line strengths, no bands, no water vapour &mdash; and it shows: the absolute level sits about 8.5 K above the real Earth. What PhET did tune is the DIFFERENCES, and those are good: its ice age is 6.3 K below 1750 and its 2020 is 1.3 K above, against about 6 K and 1.2 K observed.';
const CAP_RECORD_S='PhET&rsquo;s concentration fit, solved exactly: the differences are right, the level is 8.5 K high.';
function recordGeo(ctx,W,H,M){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const fit=fitCaption(ctx,W,H-HINT_H,CAP_RECORD,CAP_RECORD_S,capW,top+190);
  const availH=Math.max(110,fit.capY-16-top);
  const tableH=narrow?0:Math.min(148,availH*0.30);
  const A=box(left,top,right-left,Math.max(120,availH-(tableH?tableH+64:BOTTOM_RESERVE)));
  const T=tableH?box(left,A.y1+64,right-left,tableH):null;
  return {narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,A,T};
}
function viewRecord(ctx,W,H,M){
  const R=M.R, G=recordGeo(ctx,W,H,M), u=M.unit, A=G.A;
  const lo=tempIn(R.curve[0][1]*0.985,u), hi=tempIn(R.hottest*1.01,u);
  axesR(ctx,A,0,1,lo,hi,{nx:6,ny:6,xlab:'PhET&rsquo;s greenhouse-gas concentration c',
    ylab:'surface temperature, '+UNIT_SYM[u],
    title:titleFor(A,'PhET&rsquo;s fit, solved exactly','the fit, solved'),
    xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,0)});
  polyline(ctx,A,R.curveCloud.map(p=>p[0]),R.curveCloud.map(p=>tempIn(p[1],u)),0,1,lo,hi,
           COL.struct,1.4,[6,4]);
  polyline(ctx,A,R.curve.map(p=>p[0]),R.curve.map(p=>tempIn(p[1],u)),0,1,lo,hi,COL.pos,2.2);
  /* the real Earth: the line now, its label after the legend has taken its corner */
  const yE=A.y1-A.h*(tempIn(R.earthTs,u)-lo)/(hi-lo);
  if(yE>A.y&&yE<A.y1){
    ctx.beginPath(); ctx.moveTo(A.x,yE); ctx.lineTo(A.x1,yE);
    ctx.strokeStyle=rgba('#e8843a',0.6); ctx.lineWidth=1.4; ctx.setLineDash([3,4]);
    ctx.stroke(); ctx.setLineDash([]); }
  /* PhET's four dates */
  R.rows.forEach((r,k)=>{
    const X=A.x+A.w*r.d.c, Y=A.y1-A.h*(tempIn(r.Ts,u)-lo)/(hi-lo);
    /* the ice age is BELOW the curve because PhET whitens its ground too; draw the gap as
       a connector in the dates' own colour rather than giving it a second colour the
       legend would then share with the cloud curve */
    if(r.d.glacier){
      const Yc=A.y1-A.h*(tempIn(R.iceOnCurve,u)-lo)/(hi-lo);
      ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X,Yc);
      ctx.strokeStyle=rgba(COL.live,0.55); ctx.lineWidth=1.2; ctx.setLineDash([3,3]);
      ctx.stroke(); ctx.setLineDash([]);
      lab(ctx,W,H,X+8,(Y+Yc)/2,'glaciated ground',rgba(COL.live,0.85),SM_FONT,'left');
    }
    dot(ctx,X,Y,5.2,'rgba(0,0,0,0)',COL.live,2);
    /* 1750 and 1950 are 0.0035 apart in c: alternate the labels or they sit on top of
       each other whatever the registry does about it */
    lab(ctx,W,H,X,Y+(k%2?17:-15),r.d.name,COL.live,SM_FONT,'center');
  });
  /* where the controls are set now */
  { const c=R.here, Ts=solveClosed(concAbsorbance(c,GH.N_CONC),
        (1-concAlbedo())*GH.S_SUN*(ST.cloud?1-CLOUD_REFL:1)).Tg;
    marker(ctx,A,0,1,lo,hi,c,tempIn(Ts,u),COL.pos); }
  { const lb=legendAuto(ctx,A,[[COL.pos,'no cloud'],[COL.struct,'with PhET&rsquo;s cloud'],
                    [COL.live,'PhET&rsquo;s dates'],['#e8843a','the real Earth']]);
    if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]); }
  if(yE>A.y&&yE<A.y1)
    lab(ctx,W,H,A.x+6,yE-9,'the real Earth, '+plain(tstr(R.earthTs,u,1)),'#e8843a',SM_FONT,'left');
  /* the table of dates */
  if(G.T){
    const T=G.T, cols=['date','c','CO₂ ppm','CH₄ ppb','N₂O ppb','a₁','T surface','vs 1750'];
    const colX=[], n=cols.length;
    for(let i=0;i<n;i++) colX.push(T.x+8+T.w*(i+0.5)/n);
    ctx.font='italic 12px Georgia, serif'; ctx.fillStyle='#aeb6c6';
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(plain('PhET’s four dates — the left five columns are PhET’s, the right three are this file’s solve of them'),T.x,T.y-8);
    ctx.font=SM_FONT; ctx.textBaseline='top';
    const rowH=Math.min(24,(T.h-22)/4);
    for(let i=0;i<n;i++){
      ctx.textAlign=i?'right':'left'; ctx.fillStyle='#6f7789';
      ctx.fillText(plain(cols[i]),colX[i],T.y+2);
    }
    ctx.beginPath(); ctx.moveTo(T.x,T.y+20); ctx.lineTo(T.x1,T.y+20);
    ctx.strokeStyle='#242a3a'; ctx.lineWidth=1; ctx.stroke();
    R.rows.forEach((r,k)=>{
      const y=T.y+24+k*rowH;
      const vals=[r.d.name,fmt(r.d.c,4),''+r.d.co2,''+r.d.ch4,''+r.d.n2o,fmt(r.a[0],4),
                  plain(tstr(r.Ts,u,2)),
                  (k===1?'—':plain(dK(r.Ts-R.rows[1].Ts,u,2)))];
      for(let i=0;i<n;i++){
        ctx.textAlign=i?'right':'left';
        ctx.fillStyle=i<5?(i===0?'#aeb6c6':'#8b93a6'):(i===7?COL.live:COL.pos);
        ctx.fillText(plain(vals[i]),colX[i],y);
      }
    });
  }
  caption(ctx,G.left,G.capY,G.capTxt,G.capW,'#767e92',CAP_FONT);
}

/* ---- dispatch ----------------------------------------------------------- */
function drawView(rc,W,H,M){
  POLY_SEGS=[]; LEGEND_RECTS=[]; LABELS=[];
  /* The floating readout covers the top-right of the stage — about 336 px wide and up to
     548 tall — and it is HTML, so nothing on the canvas can see it.  Register it as an
     occupied label box so lab() dodges it (Known-bad: text placed at the top right of a
     plot box is text placed underneath the readout).  On a narrow stage the layout
     deliberately runs the panels under it, and tools/audit.py reports that as advisory. */
  if(W>=900) LABELS.push([W-336,0,W,Math.min(548,H)]);
  rc.fillStyle='#070b18'; rc.fillRect(0,0,W,H);
  const m=M||buildModel();
  if(m.view==='waves') viewWaves(rc,W,H,m);
  else if(m.view==='photons') viewPhotons(rc,W,H,m);
  else if(m.view==='layers') viewLayers(rc,W,H,m);
  else if(m.view==='ladder') viewLadder(rc,W,H,m);
  else viewRecord(rc,W,H,m);
}

/* ---- the scene ---------------------------------------------------------- */
function makeScene(canvas){
  const S={W:0,H:0,
    model(){ return buildModel(); },
    draw(){
      /* fetch the context INSIDE the draw: a context cached at boot writes into a recorder
         the DOM-stub harness has already thrown away (Known-bad, polyhedra.html) */
      const rc=canvas.getContext('2d');
      drawView(rc,S.W,S.H,S.model());
    },
    step(){ return stepFrame(); },
    pointer(kind,x,y){
      if(!SKY_VIEWS[ST.view]) return false;
      const rc=canvas.getContext('2d');
      const L=skyLayout(rc,S.W,S.H,S.model(),CAP_WAVES,CAP_WAVES_S);
      const win=L.win, mp=skyMapOf(win);
      if(kind==='down'){
        const yP=mp.yOf(PROBE.z);
        if(x>=win.x-10&&x<=win.x1+10&&Math.abs(y-yP)<=14){ DRAG.what='probe'; return true; }
        return false;
      }
      if(kind==='move'&&DRAG.what==='probe'){
        PROBE.z=clamp(mp.zOf(y),0,GH.TOP);
        return true;
      }
      if(kind==='up'&&DRAG.what){ DRAG.what=null; return true; }
      return false;
    }};
  return S;
}

/* ================================================================== *
 *  boot — the control panel, the tabs, the keys and the frame loop    *
 * ================================================================== */
const CREDIT='Remake of PhET Interactive Simulations&rsquo; Greenhouse Effect (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.';

function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas);
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    ST.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===ST.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab2])=>{ tabsEl.appendChild(h('button',{class:ST.view===k?'active':'',
    onclick:()=>setView(k)},lab2)); });

  const rows={};
  function slider(key,lab2,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:ST[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab2),inp,val);
    const sync=()=>{ inp.value=ST[key]; val.textContent=plain(fmtf(ST[key])); };
    inp.addEventListener('input',()=>{ ST[key]=parseFloat(inp.value);
      val.textContent=plain(fmtf(ST[key])); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab2,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=ST[key];
    const el=h('label',null,inp,lab2);
    inp.addEventListener('change',()=>{ ST[key]=inp.checked; if(onchg) onchg();
      syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=ST[key]; }};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      wrapEl.appendChild(h('button',{class:'chip'+(ST[key]===o.id?' on':''),onclick:()=>{
        ST[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }},o.name));
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function button(lab2,fn){ return h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},lab2); }

  /* the atmosphere (PhET's concentration panel) */
  const gAtm=h('div',{class:'grp'},h('h3',null,'greenhouse gas'));
  const modeChips=chipRow(MODE_LIST,'mode'); gAtm.appendChild(modeChips);
  gAtm.appendChild(slider('conc','concentration c',0,1,0.005,v=>fmt(v,3)));
  const dateChips=chipRow(DATE_LIST,'date'); gAtm.appendChild(dateChips);
  gAtm.appendChild(h('div',{class:'checks'},checkbox('cloud','a cloud (reflects 12.5 %)')));
  const atmTag=h('div',{class:'tag'}); gAtm.appendChild(atmTag);

  /* the layer-model controls */
  const gLay=h('div',{class:'grp'},h('h3',null,'the sheets'));
  gLay.appendChild(slider('nLayers','absorbing sheets',0,GH.N_LM,1,v=>fmt(v,0)));
  gLay.appendChild(slider('absorb','infrared absorbance',GH.ABS_MIN,GH.ABS_MAX,0.05,v=>fmt(v,2)));
  gLay.appendChild(slider('intensity','solar intensity',GH.INT_MIN,GH.INT_MAX,0.25,
    v=>fmt(100*v,0)+' % of our sun'));
  gLay.appendChild(slider('albedo','surface albedo',GH.ALB_MIN,GH.ALB_MAX,0.05,v=>fmt(v,2)));
  const kirchBox=h('div',{class:'checks'},checkbox('kirch','sheet temperatures by Kirchhoff'));
  gLay.appendChild(kirchBox);
  const layTag=h('div',{class:'tag'}); gLay.appendChild(layTag);

  /* what to show */
  const gShow=h('div',{class:'grp'},h('h3',null,'what to show'));
  gShow.appendChild(chipRow(UNIT_LIST,'unit'));
  const showChecks=h('div',{class:'checks'},
    checkbox('balance','energy balance at the top'),
    checkbox('flux','the flux meter'),
    checkbox('sheets','the sheet altitudes'),
    checkbox('morePhotons','more photons'));
  gShow.appendChild(showChecks);
  const showTag=h('div',{class:'tag'}); gShow.appendChild(showTag);

  /* time */
  const gTime=h('div',{class:'grp'},h('h3',null,'the sun and the clock'));
  gTime.appendChild(h('div',{class:'checks'},
    checkbox('sun','the sun shines',()=>{ if(!ST.sun) resetPhotons(); }),
    checkbox('running','time runs')));
  gTime.appendChild(h('div',{class:'btnrow'},
    button('one step',()=>{ const wasRun=ST.running; ST.running=true; stepFrame(); ST.running=wasRun; }),
    button('jump to equilibrium',()=>settle())));
  gTime.appendChild(h('div',{class:'btnrow'},
    button('cold start',()=>{ resetThermal(); })));
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  const gRun=h('div',{class:'grp'},h('div',{class:'btnrow'},
    button('reset all',()=>{ const v=ST.view; Object.assign(ST,DEFAULTS); ST.view=v;
      PROBE.z=PROBE0.z; DRAG.what=null; resetThermal(); syncChips(); })));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:CREDIT+' PhET&rsquo;s constants (the sun&rsquo;s 343.6 W/m&sup2;, the albedos, the twelve sheets, a = 0.85&thinsp;c&thinsp;e<sup>&minus;z/8400&nbsp;m</sup>, the four dates and their CO<sub>2</sub>/CH<sub>4</sub>/N<sub>2</sub>O, the cloud&rsquo;s 12.5 %, the heat capacities) were read from the minified original, docs/phets/greenhouse-effect_en.html 1.3.13, and are cited as PhET&rsquo;s. Physics: &sigma; from scipy&rsquo;s CODATA (and from 2&pi;&#8309;k&#8308;/15h&sup3;c&sup2;), the 2015 IAU solar constant 1361 W/m&sup2;, Earth&rsquo;s Bond albedo 0.30, the conventional 288 K surface. Every reference value is a line of build/greenhouse-effect/refvals.txt, the output of derive.py.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gAtm,gLay,gShow,gTime,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [w,list,key] of CHIPROWS)
      [].forEach.call(w.children,(b,i)=>b.className='chip'+(list[i].id===ST[key]?' on':''));
  }
  function syncPanel(){
    const v=ST.view, conc=(v==='waves'||v==='photons'||v==='record'), lay=(v==='layers'||v==='ladder');
    gAtm.hidden=!conc; gLay.hidden=!lay;
    rows.conc.row.hidden=(ST.mode!=='value');
    dateChips.hidden=(ST.mode!=='date');
    rows.cb_cloud.row.hidden=(ST.mode!=='value');
    rows.cb_morePhotons.row.hidden=(v!=='photons');
    rows.cb_balance.row.hidden=!SKY_VIEWS[v];
    rows.cb_flux.row.hidden=!SKY_VIEWS[v];
    rows.cb_sheets.row.hidden=!SKY_VIEWS[v];
    showChecks.hidden=!SKY_VIEWS[v];
    kirchBox.hidden=(v!=='layers');
    gTime.hidden=!SKY_VIEWS[v];
    for(const k in rows) rows[k].sync();
    atmTag.innerHTML=ST.mode==='date'
      ? 'PhET&rsquo;s four dates set c to 0.625, 0.7147, 0.7182 and 0.7446. Those five numbers are a teaching fit, quoted here as PhET&rsquo;s; the ice age also switches the ground to its glaciated albedo, 0.225.'
      : 'c sets every sheet at once: a<sub>i</sub> = 0.85&thinsp;c&thinsp;e<sup>&minus;z<sub>i</sub>/8400&nbsp;m</sup>, so the lowest sheet does most of the work and the top one is nearly transparent.';
    layTag.innerHTML=(v==='ladder')
      ? 'these two set the magenta marker on the right-hand panel'
      : 'PhET&rsquo;s sheet absorbs a fraction a and radiates a full &sigma;T<sup>4</sup> each way. Kirchhoff&rsquo;s law would have it radiate a&thinsp;&sigma;T<sup>4</sup>; the fluxes are identical either way and the sheet temperatures differ by a<sup>&minus;1/4</sup>.';
    showTag.innerHTML=v==='photons'
      ? 'PhET draws one photon in five; &ldquo;more photons&rdquo; draws them all. The walk is seeded, so the picture repeats exactly.'
      : 'the flux meter&rsquo;s sensor is the magenta bar on the window &mdash; drag it up and down.';
    timeTag.innerHTML='the ground and the sheets are integrated with PhET&rsquo;s own heat capacities from a cold start; it takes about thirty seconds to settle. <b>space</b> runs/pauses &nbsp; <b>s</b> the sun &nbsp; <b>e</b> jumps to equilibrium &nbsp; 1&ndash;5 switch views';
  }
  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=SKY_VIEWS[ST.view]
        ? 'drag the magenta flux sensor · space pauses · s switches the sun · 1–5 switch views'
        : '1–5 switch views';
      infoEl.innerHTML=INFO[ST.view]||''; physEl.innerHTML=DERIV[ST.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); ST.running=!ST.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='s'){ ST.sun=!ST.sun; if(!ST.sun) resetPhotons(); syncPanel(); dirty=true; refresh(); }
    else if(e.key==='e'){ settle(); dirty=true; refresh(); }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    let advanced=false;
    try{ advanced=S.step(); }catch(e){ fail(e); }
    if(advanced||dirty){
      dirty=false;
      try{
        S.draw();
        if(advanced&&frameN%10===0){ const M=S.model();
          roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); }
      }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  waves:'The whole greenhouse effect in one picture. Sunlight arrives as visible light, and the gases that matter here — carbon dioxide, methane, nitrous oxide — are very nearly transparent to it, so it goes straight past them and warms the ground. The ground, being warm rather than hot, radiates back in the infrared, and to that the same gases are not transparent at all. Each sheet in the stack catches a fraction of it, warms, and radiates away exactly what it caught — but half of that goes back down. The ground therefore has to supply more than the sunlight alone would demand, and "more radiated" means "hotter". Set the concentration by hand, or pick one of PhET\'s four dates and watch the thermometer move. Nothing about the picture is a metaphor: the brightness of each infrared band is the flux the exact solution carries at that height, and it steps down by F·a/(2−a) every time it crosses a sheet.',
  photons:'The same physics, one photon at a time, because a flux is only a way of counting photons. Yellow ones fall from the sun; most are absorbed by the ground and a few bounce off it — that fraction is the albedo. Red ones leave the ground at a rate set by its temperature, and each time one crosses a sheet it is absorbed with probability a. It waits there and is then sent off again, up or down at even odds, having entirely forgotten which way it came. Some photons cross the whole stack at the first attempt; some are turned back and swallowed by the ground; the rest wander. The chance that any one of them ever reaches space is not a simulation result but a number you can write down — it is the flux ratio F/σTₛ⁴ — and the panel puts the measured fraction from twenty thousand seeded walks beside it. That is the sense in which the picture and the equation are the same thing.',
  layers:'PhET\'s Layer Model screen, with the metaphor made literal: panes of glass, transparent to sunlight and absorbing to infrared. Add one and the surface warms; add a second and it warms again, but by less. The arrows carry the actual fluxes. The reason the model closes is written along them: every sheet radiates away exactly what it absorbs, so the NET upward flux is the same at every height and must equal what the sun delivers — which leaves the upward flux itself stepping down by F·a/(2−a) at each sheet, and the ground having to supply all those steps at once. Turn the absorbance down and each sheet loses its grip fast: a pane that lets a tenth through is much more than a tenth worse. One honest footnote, which the tick box shows: PhET\'s sheet absorbs a fraction a but radiates a full σT⁴ each way, which is not Kirchhoff\'s law. It makes no difference whatever to the fluxes — only to the temperature you would write on each pane.',
  ladder:'One line runs through every screen of this sim. Because each sheet radiates away what it absorbs, the upward flux steps down by F·a/(2−a) at each of them, so the surface must radiate σTₛ⁴ = F[1 + Σ aᵢ/(2−aᵢ)]. For perfectly absorbing sheets that bracket is exactly N + 1, and the fourth root of it is the famous ladder: one sheet is 2^(1/4) = 1.19 times the bare effective temperature, four sheets 5^(1/4) = 1.50, twelve sheets only 13^(1/4) = 1.90. Radiation is a fourth-power law, and that is why a runaway is hard: doubling the trapping does not double the temperature. The right-hand panel is the other half — how much a sheet is worth when it is not perfect. The real Earth sits at about two thirds of one perfect sheet, or a single pane with a ≈ 0.78, which is a reasonable thing to know about the planet.',
  record:'Where PhET\'s numbers come from, and what they are worth. Everything that turns a greenhouse-gas concentration into an absorbance is a fit: aᵢ = 0.85·c·e^(−z/8400 m) on twelve sheets, with the four dates mapped to c = 0.625, 0.7147, 0.7182 and 0.7446. There is no spectroscopy in it — no line strengths, no bands, no overlap, no water vapour — and the honest way to present it is to say so and then solve it exactly, which is what the curve is. Doing that shows what PhET tuned and what it did not. The absolute level is about 8.5 K above the real Earth: PhET\'s 1750 is 296.5 K against the observed 288 K. The differences, though, are good — the ice age comes out 6.3 K colder than 1750 against about 6 K observed, and 2020 comes out 1.3 K warmer against about 1.2 K observed. That is a defensible teaching choice, and it is the kind of thing a reader should be told rather than left to discover.'
};
function FR2(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }

/* ================================================================== *
 *  makeShot — the selfTest recording context (text boxes through     *
 *  the transform, fill counts), from build_buoy/p7_test.js by name,  *
 *  unchanged (make_helpers.py)                                       *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest — headless verification.  Every reference is a line of     *
 *  build/greenhouse-effect/refvals.txt (derive.py's output, read in    *
 *  full): (scipy) = CODATA through scipy.constants, (python) = numpy   *
 *  or exact arithmetic in the twin, (PhET) = a constant read out of    *
 *  docs/phets/greenhouse-effect_en.html 1.3.13.                        *
 * ================================================================== */
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),
    name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();
  function ref(label,i){
    const v=REF[label];
    if(!v) throw new Error('no reference line "'+label+'"');
    return v[i||0];
  }
  const stSave=Object.assign({},ST), probeSave=PROBE.z;

  /* ---------- A. PhET's constants, read from the minified original ---------- */
  eq(GH.SIGMA,5.670374419e-8,'PhET&rsquo;s Stefan-Boltzmann constant (PhET)');
  eq(GH.S_SUN,343.6,'the sun delivers 343.6 W/m^2 (PhET OUTPUT_ENERGY_RATE)');
  eq(GH.INT_MIN,0.5,'solar intensity from 1/2 (PhET)'); eq(GH.INT_MAX,2,'to 2 suns (PhET)');
  eq(GH.ALB_MEADOW,0.2,'green-meadow albedo 0.2 (PhET)');
  eq(GH.ALB_GLACIER,0.225,'partially-glaciated albedo 0.225 (PhET)');
  eq(GH.ALB_LM,0.3,'the layer model starts at albedo 0.3 (PhET)');
  eq(GH.ALB_MAX,0.9,'the albedo slider stops at 0.9 (PhET)');
  eq(GH.TMIN_NIGHT,245,'Earth-at-night floor 245 K (PhET)');
  eq(GH.TMIN_LM,125,'the layer model"s floor 125 K (PhET)');
  eq(GH.TOP,50000,'the atmosphere is 50 km deep (PhET)');
  eq(GH.N_CONC,12,'twelve sheets on the concentration screens (PhET)');
  eq(GH.N_LM,3,'three on the layer model (PhET)');
  eq(GH.ABS_COEF,0.85,'the 0.85 in PhET"s absorbance fit (PhET)');
  eq(GH.SCALE_H,8400,'and its 8400 m scale height (PhET)');
  eq(GH.ABS_MIN,0.1,'absorbance slider from 0.1 (PhET)');
  eq(GH.SPAN_W,85000,'the sunlight span is 85 km wide (PhET)');
  eq(GH.T_MAX_EXPECTED,309,'PhET"s thermometer expects at most 309 K (PhET)');
  eq(GH.SHOW_ONE_IN,5,'PhET draws one photon in five (PhET)');
  eq(DATES.length,4,'four dates');
  eq(DATES[0].c,0.625,'ice age c = 0.625 (PhET)');
  eq(DATES[1].c,0.7147,'1750 c = 0.7147 (PhET)');
  eq(DATES[2].c,0.7182,'1950 c = 0.7182 (PhET)');
  eq(DATES[3].c,0.7446,'2020 c = 0.7446 (PhET)');
  eq(DATES.map(d=>d.co2).join(),'180,277,311,413','the CO2 values (PhET)');
  eq(DATES.map(d=>d.ch4).join(),'380,694,1116,1889','the CH4 values (PhET)');
  eq(DATES.map(d=>d.n2o).join(),'215,271,288,333','the N2O values (PhET)');
  /* the cloud's two factors cancel exactly */
  close(CLOUD_REFL,ref('CLOUD reflectivity, top value'),1e-15,'the cloud reflects exactly 0.125 (python)');
  close(CLOUD_REFL,0.125,1e-15,'0.125 x 85000/18000 x 18000/85000 = 0.125');
  rel(GH.CLOUD_REFL_TOP,ref('CLOUD reflectivity, top value',1),1e-13,'PhET"s topVisibleLightReflectivity (python)');
  /* PhET's heat capacities */
  rel(K_GROUND,ref('PHET K per J/m2 ground layer',0),1e-13,'the ground warms 32/15 K per J/m^2 (python)');
  rel(K_SHEET,ref('PHET K per J/m2 ground layer',1),1e-13,'a glass sheet 1.5873 K per J/m^2 (python)');
  close(K_GROUND,32/15,1e-15,'and 32/15 exactly');
  rel(stabilityH(520),ref('STABILITY h_max at 520 K, the sim sub-step',0),1e-13,'the Euler stability bound at 520 K (python)');
  ok(FRAME_DT/SUBSTEPS<stabilityH(520),'the sim sub-step is inside that bound');
  eq(FRAME_DT/SUBSTEPS,ref('STABILITY h_max at 520 K, the sim sub-step',1),'the sub-step is 1/240 s');

      close(m2.S.probe.D,0,1e-12,'at the top nothing comes down');
      rel(m2.S.probe.U,m2.S.F,1e-12,'and exactly F goes up'); }
    PROBE.z=probeSave;
    /* the ice age switches the ground to the glaciated albedo, by date only */
    ST.date='iceAge'; { const m2=buildModel(); rel(m2.S.albedo,GH.ALB_GLACIER,1e-15,'the ice age is glaciated (PhET)'); }
    ST.mode='value'; ST.conc=0.625;
    { const m2=buildModel(); rel(m2.S.albedo,GH.ALB_MEADOW,1e-15,
        'but the same concentration set by hand is a green meadow (PhET)'); }
    /* the cloud */
    ST.cloud=true; { const m2=buildModel(); rel(m2.S.F,(1-GH.ALB_MEADOW)*GH.S_SUN*(1-CLOUD_REFL),1e-12,
      'the cloud takes 12.5 % of the sunlight before the ground sees it'); }
    ST.cloud=false;
    /* the sun off */
    ST.sun=false; { const m2=buildModel(); close(m2.S.F,0,1e-15,'the sun off means no absorbed flux'); }
    ST.sun=true;
    /* the layer model */
    ST.view='layers'; ST.nLayers=2; ST.absorb=0.5; ST.intensity=1; ST.albedo=0.3;
    resetThermal(); settle();
    { const m2=buildModel();
      rel(m2.S.Tsteady,ref('LM n=2 a=0.5 i=1 alb=0.3 Ts'),1e-11,'two sheets at a = 0.5 (python)');
      /* the intensity and the albedo have to be read OFF the model, not recomputed beside
         it: every other layer-model assertion here builds its own F and would pass with the
         slider disconnected (the drum_head rule — assert off the built model) */
      rel(m2.S.F,(1-0.3)*GH.S_SUN,1e-12,'and the model"s own F at one sun');
      rel(m2.S.A.Sin,GH.S_SUN,1e-12,'with 343.6 W/m^2 arriving');
      eq(m2.S.a.filter(x=>x>0).length,2,'exactly two sheets absorb');
      eq(m2.S.a[2],0,'and the top one is switched off');
      rel(m2.S.Ssteady[0],ref('LM n=2 a=0.5 i=1 alb=0.3 Tlayers',0),1e-10,'its lowest sheet (python)');
      ok(m2.S.Ssteady[2]===null,'the inactive sheet has no temperature at all'); }
    for(const inten of [0.5,2]){
      ST.intensity=inten; resetThermal(); settle();
      const m3=buildModel();
      rel(m3.S.F,(1-0.3)*GH.S_SUN*inten,1e-12,'the solar-intensity slider reaches the model at '+inten+' suns');
      rel(m3.S.A.Sin,GH.S_SUN*inten,1e-12,'and the sunlight arriving at the top');
      rel(m3.S.Tsteady,ref('LM n=2 a=0.5 i='+inten+' alb=0.3 Ts2'),1e-11,
          'so the surface sits at '+fmt(ref('LM n=2 a=0.5 i='+inten+' alb=0.3 Ts2'),3)+' K (python)');
    }
    ST.intensity=1;
    /* the ladder's "equivalent uniform absorbance", off the model */
    ST.view='ladder'; ST.nLayers=3; ST.absorb=0.4;
    { const L=buildModel().L;
      rel(L.aEq,0.4,1e-13,'three sheets all at 0.4 are equivalent to a uniform 0.4');
      ST.absorb=0.9; const L2=buildModel().L;
      rel(L2.aEq,0.9,1e-13,'and three at 0.9 to a uniform 0.9');
      rel(3*L2.aEq/(2-L2.aEq),L2.here.sum,1e-12,'the equivalence is of Sigma a/(2-a)'); }
    Object.assign(ST,stSave); PROBE.z=probeSave; resetThermal(); }

  /* the ladder's marker sits ON the family it is drawn over, which is at PhET's own F,
     while the readout's "stack you have loaded" is the same sheets at the albedo and
     intensity actually set: assert both, and assert they DIFFER when they should */
  { Object.assign(ST,DEFAULTS); ST.view='ladder'; ST.nLayers=2; ST.absorb=0.5;
    ST.albedo=0.3; ST.intensity=1;
    const L=buildModel().L;
    rel(L.hereCurveT,teff((1-GH.ALB_MEADOW)*GH.S_SUN)*Math.pow(1+2*0.5/1.5,0.25),1e-12,
        'the ladder marker lies on the plotted family');
    rel(L.here.Tg,ref('LM n=2 a=0.5 i=1 alb=0.3 Ts'),1e-11,
        'while the readout carries the layer model"s own stack (python)');
    ok(Math.abs(L.hereCurveT-L.here.Tg)>3,'and at albedo 0.3 against 0.2 they differ by 3 K');
    rel(L.earthEqA,2*L.earth.sum/(1+L.earth.sum),1e-13,'the Earth"s equivalent single sheet');
    close(L.earth.sum,Math.pow(EARTH_TSURF/L.earth.T0,4)-1,1e-13,'from (288/254.578)^4 - 1');
    close(L.earthEqA,0.779,0.002,'which is one sheet at a = 0.779');
    Object.assign(ST,stSave); }

  /* ---------- L. the panels build clean, every view x preset x size ---------- */
  const SIZES=[[1400,820],[1180,760],[980,640],[760,520],[560,380]];
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  const CONFIGS=[
    {view:'waves'},
    {view:'waves',mode:'date',date:'iceAge',flux:true,sheets:true},
    {view:'waves',mode:'date',date:'y2020',balance:false},
    {view:'waves',conc:0,cloud:true,unit:'K'},
    {view:'waves',conc:1,unit:'F',flux:true},
    {view:'waves',sun:false},
    {view:'photons'},
    {view:'photons',morePhotons:true,mode:'date',date:'y2020'},
    {view:'photons',conc:0,flux:true},
    {view:'layers',nLayers:0},
    {view:'layers',nLayers:3,absorb:1,flux:true,sheets:true},
    {view:'layers',nLayers:1,absorb:0.1,intensity:2,albedo:0.9,unit:'K'},
    {view:'layers',nLayers:2,absorb:0.5,intensity:0.5,albedo:0,kirch:true},
    {view:'ladder'},
    {view:'ladder',unit:'K',nLayers:3,absorb:0.6},
    {view:'record'},
    {view:'record',unit:'F',mode:'date',date:'y2020'}
  ];
  for(const base of CONFIGS){
    Object.assign(ST,DEFAULTS,base);
    resetThermal();
    if(SKY_VIEWS[ST.view]){ settle(); if(ST.view==='photons') for(let k=0;k<120;k++) stepPhotons(atmosphere(),FRAME_DT); }
    const nm=JSON.stringify(base);
    for(const [W,H] of SIZES){
      const c=makeShot(W,H);
      let err=null, M=null;
      try{ M=buildModel(); drawView(c,W,H,M); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) continue;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill');
      const rects=fills.reduce((a,o)=>a+(o.n||1),0), strokes=c.ops.filter(o=>o.op==='stroke').length;
      ok(rects>=8&&strokes>=6&&texts.length>=6,
         nm+' '+W+'x'+H+' draws substance ('+rects+' rects, '+strokes+' strokes, '+texts.length+' texts)');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){
          bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const A2=texts[i2].bb,B2=texts[j2].bb;
        const ox=Math.min(A2[2],B2[2])-Math.max(A2[0],B2[0]);
        const oy=Math.min(A2[3],B2[3])-Math.max(A2[1],B2[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      /* the house #hint is HTML at bottom:11px and the canvas capture cannot see it
         (build/wave-on-a-string/, Known-bad): keep the corner clear */
      const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
      ok(!inHint.length,nm+' '+W+'x'+H+' nothing under the #hint line'+
         (inHint.length?' ("'+inHint[0].t.slice(0,30)+'" to y '+fmt(inHint[0].bb[3],0)+')':''));
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||
           Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
      /* the readout, the equation bar and the tag, from the same model */
      const ro=readoutHTML(M), eb=eqbarHTML(M), tg=tagHTML(M);
      ok(ro.indexOf('NaN')<0&&ro.indexOf('undefined')<0&&ro.indexOf('Infinity')<0,nm+' readout clean');
      ok(eb.indexOf('NaN')<0&&tg.indexOf('NaN')<0,nm+' equation bar and tag clean');
      ok(ro.length>400,nm+' readout has substance ('+ro.length+' chars)');
    }
  }
  Object.assign(ST,stSave); PROBE.z=probeSave; resetThermal();

  /* ---------- M. the readout prints the numbers it claims to ---------- */
  { Object.assign(ST,DEFAULTS); ST.mode='date'; ST.date='y1750'; ST.unit='K';
    resetThermal(); settle();
    const M=buildModel(), ro=readoutHTML(M);
    ok(ro.indexOf('296.48 K')>=0,'the readout prints 1750"s 296.48 K off the model');
    ok(ro.indexOf('274.88 W/m&sup2;')>=0,'and the 274.88 W/m^2 it absorbs');
    ok(ro.indexOf('277 ppm')>=0,'and PhET"s 277 ppm of CO2');
    ST.unit='C'; ok(readoutHTML(buildModel()).indexOf('23.33 °C')>=0,'in celsius, 23.33 °C');
    ST.unit='F'; ok(readoutHTML(buildModel()).indexOf('74.00 °F')>=0,'in fahrenheit, 74.00 °F');
    Object.assign(ST,stSave); resetThermal(); }

  /* the record view's ice-age connector: the gap IS the whitening of the ground */
  { Object.assign(ST,DEFAULTS); ST.view='record';
    const R=buildModel().R;
    rel(R.iceOnCurve,solveClosed(concAbsorbance(0.625,GH.N_CONC),(1-GH.ALB_MEADOW)*GH.S_SUN).Tg,
        1e-13,'the ice age on the plotted curve is the same c over a green meadow');
    ok(R.iceOnCurve>R.rows[0].Ts,'which is warmer than PhET"s glaciated ice age');
    close(R.iceOnCurve-R.rows[0].Ts,
          teff((1-GH.ALB_MEADOW)*GH.S_SUN)*Math.pow(1+R.rows[0].s.sum,0.25)
          -teff((1-GH.ALB_GLACIER)*GH.S_SUN)*Math.pow(1+R.rows[0].s.sum,0.25),1e-9,
          'by exactly what the albedo 0.2 -> 0.225 is worth');
    Object.assign(ST,stSave); }

  /* ---------- N. canvas prose carries no markup ---------- */
  /* plain() STRIPS tags, so 10<sup>13</sup> reaches the canvas as "1013" — a wrong number,
     not a cosmetic loss — and nothing downstream can see it: the string is well formed and
     the audits only look for entities that survived.  Guard the constants themselves. */
  { const CANVAS_PROSE=[['CAP_WAVES',CAP_WAVES],['CAP_WAVES_S',CAP_WAVES_S],
      ['CAP_PHOTONS',CAP_PHOTONS],['CAP_PHOTONS_S',CAP_PHOTONS_S],
      ['CAP_LAYERS',CAP_LAYERS],['CAP_LAYERS_S',CAP_LAYERS_S],
      ['CAP_LADDER',CAP_LADDER],['CAP_LADDER_S',CAP_LADDER_S],
      ['CAP_RECORD',CAP_RECORD],['CAP_RECORD_S',CAP_RECORD_S]];
    for(const [nm,t] of CANVAS_PROSE){
      ok(!/<su[bp]>/.test(t),nm+' carries no <sub>/<sup>: plain() strips them silently');
      ok(plain(t).indexOf('&')<0,nm+' decodes to literal glyphs');
      ok(plain(t).indexOf('<')<0,nm+' has no tags left after plain()');
    } }

  /* ---------- O. the formatters and the shared helpers ---------- */
  { eq(plain('&sigma;T&sup2; &minus; x'),'σT² − x','plain() decodes the entities this file uses');
    eq(plain('a<sub>1</sub>'),'a1','and strips tags');
    eq(plain('&#955;'),'λ','and numeric entities');
    eq(fmt(296.48445421,2),'296.48','fmt to two places');
    eq(sigf(0.0024963719,3),'0.00250','sigf keeps three figures');
    eq(plain(tstr(296.48445421,'K',2)),'296.48 K','tstr in kelvin');
    eq(plain(tstr(273.15,'C',2)),'0.00 °C','tstr in celsius');
    ok(/^rgb\(\d+,\d+,\d+\)$/.test(mix(COL.sky0,COL.sky1,0.5)),'mix is well formed');
    { const g=toRgb(mix(COL.sky0,COL.sky1,1)); eq(g.join(),toRgb(COL.sky1).join(),'and reaches its end');
      eq(toRgb(shade(COL.pos,0)).join(),toRgb('#070b18').join(),'shade(col,0) is the page background, not the colour');
      eq(toRgb(shade(COL.pos,1)).join(),toRgb(COL.pos).join(),'and shade(col,1) is the colour itself'); }
    /* ticksFor on an inverted range (standard_candle Known-bad) */
    ok(ticksFor(0,12,6).length>=5,'ticksFor gives a full set on a sane range');
    eq(logTicks(0,10).length,0,'logTicks refuses a non-positive bound rather than looping'); }

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
