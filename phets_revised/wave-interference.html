<title>Wave interference &mdash; ripples, two sources, slits and the far field</title>
<!--
  ===================================================================
  wave-interference.html — a remake of PhET's Wave Interference:
  waves on a 2-D lattice from one source, from two, through one or two
  slits, and the far-field pattern of an aperture as its Fourier
  transform; plus the geometry of the path difference and the lattice's
  own dispersion relation
  ===================================================================

  Remake of PhET Interactive Simulations' Wave Interference (University
  of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET
  code or assets.  Built against PhET's wave-interference 2.0.22: its
  four screens, their controls, and its model constants.

  Six views.  THE RIPPLE TANK is PhET's Waves screen: one source on a
  151 x 151 lattice (111 x 111 visible) in water, sound or light, with
  frequency and amplitude, continuous or pulse, top or side view (water),
  waves / particles / both (sound), the screen and intensity graph
  (light), the graph of the centre line, the tape measure, the stopwatch
  and the two-probe wave meter.  TWO SOURCES is the Interference screen,
  with the nodal hyperbolae r1 - r2 = (m + 1/2) lambda drawn over the
  lattice.  THE SLITS is the Slits screen: a plane wave, no barrier, one
  slit or two, slit width, separation and a draggable barrier, and the
  screen compared with the Rayleigh-Sommerfeld sum and the Fraunhofer
  formula.  THE FAR FIELD is the Diffraction screen: PhET's ellipse,
  rectangle, circle & square, disorder and a waving figure (PhET's is a
  photograph; this one is drawn), plus a Gaussian and N slits, a
  wavelength slider, the |FFT| pattern and its horizontal cut against the
  closed forms.  PATH DIFFERENCE (analysis): the hyperbolae, their
  asymptotes and the screen, near and far.  THE LATTICE (analysis): the
  dispersion relation, phase and group speeds, the edge reflection and the
  calibration against PhET's fixed time step.

  WHAT IS EXACT HERE
  ------------------
  The lattice is PhET's (5-point leapfrog, C = 1/2, 151 cells, 20-cell
  pad) and its dispersion relation sin^2(w dt/2) = C^2 [sin^2(kx dx/2) +
  sin^2(ky dx/2)] is exact for it; the time step is SOLVED from it at
  every frequency, so the wavelength v/f and the period 1/f are exact
  along the lattice axes (PhET keeps one step per medium and is 0.7 % to
  3.2 % short).  The driven plane wave is an exact lattice solution
  (5e-15 over 20 steps, axis and diagonal).  The engine is pinned against
  a numpy twin that repeats every operation (five scenarios, 150 to 400
  steps, 1e-11).  Mur's second-order boundary: its reflection from the
  plane-wave ansatz (<= 3 % to 45 degrees), checked against a packet
  simulation to 2 %.  Two sources: the nodal hyperbolae, their count
  2 ceil(d/lambda - 1/2), exact and far-field screen positions.  At steady
  state (numpy twin) the lattice's own nodal lines sit 0.85 cells outside
  the hyperbolae on average, 1.4 at worst, all outward, where the
  continuum 1/sqrt(r) formula sits within 0.08: the lattice's anisotropy,
  stated on the view rather than hidden.  The far field: |FFT| of the
  drawn aperture against numpy.fft.fft2 (eight apertures, six bins each)
  and against a direct DFT; the pixel-snapped rectangle against the
  Dirichlet kernel (1e-15); the sampled Gaussian against its continuous
  transform (5e-16); the disc against the Airy pattern [2 J1(v)/v]^2
  (1.2e-3 of the peak for k <= 10); J0, J1, sinc^2 and the N-slit factor
  against scipy.  Every reference is a line of
  build/wave-interference/refvals.txt, the output of derive.py.

  WHAT IS MODELLED / CHOSEN
  -------------------------
  Waves are scalar and linear; the source is a hard (Dirichlet) cell, as
  PhET's is; each 2-D source is a line source, so waves fade as 1/sqrt(r).
  The slits' theory curves use the far-zone form of the 2-D kernels
  (kr >> 1; kr >= 30 at the screen).  The lattice follows the
  Rayleigh-Sommerfeld sum on the screen to 6 % (3 % rms) and misses the
  Fraunhofer formula by 26 % at PhET's default (derive.py).  Sound's air
  parcels are pushed along grad p (xi = grad p / rho omega^2 for one
  frequency), exaggerated to at most 0.3 of their spacing.  Colours:
  water and sound ramps are chosen; light's hue is the CIE 1931 colour of
  the wavelength (desaturated into sRGB), its brightness the field.  The
  disorder aperture is a new design (fixed random offsets, Park-Miller
  seed 20260918), not PhET's table; the waving figure is new art.  The
  clock advances a fixed 1/60 s per frame so the headless suites are
  deterministic.

  NOT MODELLED
  ------------
  PhET's falling water drops (here the source starts at once), the
  animated rotation into the side view (here a switch), its interpolation
  between lattice frames (here the picture changes once per step), its
  temporal mask (a display trick hiding lattice ringing after a source
  stops), sound output ("Play Tone") and light sonification, the
  stopwatch and wave meter as draggable boxes (here: a readout box and a
  fixed chart), and PhET's separate lattice per medium (one lattice per
  view; changing the medium clears it).  Defaults differ in one way: the
  sources and the laser start ON (PhET starts them off, which opens every
  screen blank).

  WHERE THE NUMBERS COME FROM
  ---------------------------
  PhET's values, read from docs/phets/wave-interference_en.html: the
  lattice (151, pad 20, C = 1/2, source column 25), 20 x 111/61 steps per
  second, the amplitude calibration 1.2 and plane-wave factor 0.21, the
  colour scale 2.14, the media (widths 10 cm / 500 cm / 5000 nm, speeds
  1.65 cm/s / 34.3 cm/ms / 299.792458 nm/fs, frequency ranges, scale bars,
  source and slit ranges and defaults, time scales), the 90-step screen
  history, the barrier's range, the diffraction grid (256 over 4/3 mm),
  the aperture ranges and defaults, the lambda0/lambda rescaling and the
  log(0.01|F| + 1) display.  Colour: the CIE 1931 2-degree table (DOI
  10.25039/CIE.DS.xvudnb9b) every 5 nm, read from the file the
  blackbody-spectrum build fetched from the CIE; the sRGB matrix.
  Nothing else is measured.
-->

<script>
'use strict';
/* ================================================================== *
 *  small utilities  (extracted from sbs_sims.html)                    *
 * ================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, PI=Math.PI;
const smoothstep=t=>t*t*(3-2*t);

/* Accepts '#rgb', '#rrggbb' AND 'rgb(r,g,b)' — mix() returns the latter, so its
   own output must be a legal input or a two-stage blend silently turns black:
   parseInt('rgb(58,111,142)', 16) is NaN, and NaN & 255 is 0, which yields a
   perfectly well-formed rgb(0,0,0) and no error anywhere.  Unparseable input
   THROWS rather than defaulting.  (Known-bad list, steam_carnot_cycle.html.) */
function toRgb(c){
  const s=''+c;
  const m=s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
  if(m) return [Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];
  let h=s.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('toRgb: cannot parse colour "'+s+'"');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function mix(a,b,t){ const A=toRgb(a),B=toRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','
              +Math.round(A[2]+(B[2]-A[2])*t)+')'; }
function rgba(hex,a){ const c=toRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(col,sh){ return mix('#070b18',col,clamp(sh,0,1)); }
/* Mathematica NeonColors — same table as the other sims in this collection */
const NEON_STOPS=[
  [0.0000,0.7203,0.9238,0.2976],[0.0667,0.7332,0.8250,0.2939],
  [0.1333,0.7462,0.7263,0.2903],[0.2000,0.7591,0.6275,0.2866],
  [0.2667,0.7720,0.5287,0.2830],[0.3333,0.7849,0.4300,0.2793],
  [0.4000,0.8089,0.3632,0.2617],[0.4667,0.8316,0.3178,0.2550],
  [0.5333,0.8515,0.3153,0.2700],[0.6000,0.8580,0.3213,0.3191],
  [0.6667,0.8577,0.3317,0.3854],[0.7333,0.8473,0.3071,0.4623],
  [0.8000,0.8369,0.2825,0.5391],[0.8667,0.8266,0.2578,0.6160],
  [0.9333,0.8162,0.2332,0.6929],[1.0000,0.8058,0.2086,0.7698],
];
function neon(t){
  t=clamp(t,0,1); const S=NEON_STOPS; let i=0;
  while (i<S.length-2 && t>S[i+1][0]) i++;
  const a=S[i], b=S[i+1], f=(t-a[0])/((b[0]-a[0])||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function neonCss(t){ const c=neon(t);
  return 'rgb('+Math.round(255*c[0])+','+Math.round(255*c[1])+','+Math.round(255*c[2])+')'; }

/* tiny DOM helper (only touched when a document exists) */
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){
    const c=arguments[i]; if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
function fmt(x,n){ return isFinite(x)?Number(x).toFixed(n===undefined?3:n):'—'; }
function sigf(x,n){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  n=n||3;
  const a=Math.abs(x);
  if(a>=1e5||a<1e-4) return x.toExponential(n-1).replace('e','×10^');
  const d=Math.max(0,n-1-Math.floor(Math.log10(a)));
  return x.toFixed(Math.min(d,8));
}
const ENTS={'&rsquo;':'’','&lsquo;':'‘','&mdash;':'—','&ndash;':'–',
            '&times;':'×','&deg;':'°','&nbsp;':' ','&minus;':'−',
            '&amp;':'&','&lt;':'<','&gt;':'>','&hellip;':'…',
            '&alpha;':'α','&beta;':'β','&gamma;':'γ','&delta;':'δ',
            '&epsilon;':'ε','&eta;':'η','&kappa;':'κ','&lambda;':'λ',
            '&mu;':'μ','&nu;':'ν','&pi;':'π','&rho;':'ρ',
            '&sigma;':'σ','&tau;':'τ','&phi;':'φ','&omega;':'ω',
            '&theta;':'θ','&Gamma;':'Γ','&Delta;':'Δ','&Lambda;':'Λ',
            '&Pi;':'Π','&Sigma;':'Σ','&Phi;':'Φ','&Omega;':'Ω',
            '&plusmn;':'±','&ne;':'≠','&asymp;':'≈','&equiv;':'≡',

/* plain(): strips tags, decodes numeric + named entities.  The wide regex and
   the numeric decode INSIDE its handler are both load-bearing: the narrow
   /&[a-z]+;/ let &#955; and &Lambda; reach the canvas verbatim (wave_fronts
   Known-bad), and a SEPARATE numeric pass makes narrowing the wide match an
   equivalent mutant the sweep cannot see (sbs_state_surface Known-bad).
   Unknown named entities pass through unchanged so the audits still see them. */
function plain(s){
  return String(s).replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/&#?[a-zA-Z0-9]+;/g,m=>{
      if(ENTS[m]!==undefined) return ENTS[m];
      let d=/^&#([0-9]+);$/.exec(m);
      if(d) return String.fromCodePoint(+d[1]);
      d=/^&#x([0-9a-fA-F]+);$/.exec(m);
      if(d) return String.fromCodePoint(parseInt(d[1],16));
      return m;

function wrapText(ctx,txt,maxW,font){

  for(const w of words){

    if(line&&ctx.measureText(t).width>maxW){ out.push(line); line=w; }
    else line=t;

  return out;
}
function caption(ctx,x,y,txt,maxW,col,font){

  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],x,y+i*14);

}
function box(x,y,w,hh){ return {x,y,w,h:hh,x1:x+w,y1:y+hh}; }

function ticksFor(lo,hi,want){

  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step) out.push(t);

/* log-axis ticks (decades), guarded: a non-positive bound is an infinite loop

function logTicks(lo,hi){
  if(!(lo>0)||!(hi>0)||!isFinite(lo)||!isFinite(hi)) return [];
  const out=[];
  const e0=Math.floor(Math.log10(lo)), e1=Math.ceil(Math.log10(hi));
  const step=(e1-e0)>7?2:1;

  const xt=o.xticks||ticksFor(Math.min(xlo,xhi),Math.max(xlo,xhi),o.nx||6);
  const yt=o.yticks||ticksFor(Math.min(ylo,yhi),Math.max(ylo,yhi),o.ny||5);

/* Polyline, CLIPPED IN DATA SPACE to the y-range AND the x-range (the
   siblings clip y only).  A canvas ctx.clip() would fix the browser but NOT
   the audit — the display-list recorder treats clip() as a no-op, so the
   captured geometry would still lie.  Crossings are interpolated so a clipped
   curve still meets the frame edge exactly.
   Every emitted segment is also recorded in POLY_SEGS (screen coords), which
   is what lets selfTest assert that no data curve crosses a legend box. */
let POLY_SEGS=[];
function polyline(ctx,b,xs,ys,xlo,xhi,ylo,yhi,col,lw,dash){
  ctx.save();
  ctx.beginPath();
  const n=Math.min(xs.length,ys.length);
  const px=x=>b.x+b.w*(x-xlo)/(xhi-xlo||1);
  const py=y=>b.y1-b.h*(y-ylo)/(yhi-ylo||1);
  const xa=Math.min(xlo,xhi), xb=Math.max(xlo,xhi), ya=Math.min(ylo,yhi), yb=Math.max(ylo,yhi);
  let started=false;
  for(let i=0;i<n-1;i++){
    const X0=xs[i], Y0=ys[i], X1=xs[i+1], Y1=ys[i+1];
    if(!isFinite(X0)||!isFinite(Y0)||!isFinite(X1)||!isFinite(Y1)){ started=false; continue; }
    /* Liang-Barsky: the parameter range [t0,t1] of the segment inside the box.
       A segment whose BOTH endpoints lie outside can still cross the box; the
       endpoint-only test the siblings used dropped it. */
    let t0=0,t1=1; const dx=X1-X0, dy=Y1-Y0; let out=false;
    for(const [p,q] of [[-dx,X0-xa],[dx,xb-X0],[-dy,Y0-ya],[dy,yb-Y0]]){
      if(p===0){ if(q<0){ out=true; break; } continue; }
      const t=q/p;
      if(p<0){ if(t>t1){ out=true; break; } if(t>t0) t0=t; }
      else { if(t<t0){ out=true; break; } if(t<t1) t1=t; }
    }
    if(out||t0>t1){ started=false; continue; }
    const x0=X0+t0*dx, y0=Y0+t0*dy, x1=X0+t1*dx, y1=Y0+t1*dy;
    if(t0>0) started=false;                 /* enters the box part-way: new stroke */
    if(!started){ ctx.moveTo(px(x0),py(y0)); started=true; }
    ctx.lineTo(px(x1),py(y1));
    POLY_SEGS.push(px(x0),py(y0),px(x1),py(y1));
    if(t1<1) started=false;                 /* leaves the box: the next stroke restarts */
  }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6;
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

let LEGEND_RECTS=[];
function legendBox(ctx,x,y,items){
  ctx.font='10.5px -apple-system, sans-serif';

  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  ctx.fillStyle='rgba(10,12,18,.78)'; ctx.fillRect(x,y,bw,bh);
  frame(ctx,box(x,y,bw,bh),'#242a3a');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  items.forEach((it,i)=>{
    const yy=y+11+i*15;
    ctx.fillStyle=it[0]; ctx.fillRect(x+7,yy-3.5,10,7);
    ctx.fillStyle='#9aa2b4'; ctx.fillText(plain(it[1]),x+22,yy);

/* pick the first corner of panel b that no already-recorded curve segment
   crosses — call AFTER the panel's polylines are drawn (Known-bad: deciding
   which corner is empty by looking at one configuration keeps being wrong) */
function legendAuto(ctx,b,items){
  ctx.font='10.5px -apple-system, sans-serif';
  let w=0;
  for(const it of items) w=Math.max(w,ctx.measureText(plain(it[1])).width);
  const bw=w+26, bh=items.length*15+8;
  const mx=b.x+(b.w-bw)/2, my=b.y+(b.h-bh)/2;
  const cands=[[b.x1-bw-8,b.y+8],[b.x+8,b.y1-bh-8],[b.x+8,b.y+8],
               [b.x1-bw-8,b.y1-bh-8],[mx,b.y+8],[mx,b.y1-bh-8],
               [b.x+8,my],[b.x1-bw-8,my]];
  for(const [cx,cy] of cands){
    let hit=false;
    for(let i=0;i<POLY_SEGS.length&&!hit;i+=4){
      const x0=POLY_SEGS[i],y0=POLY_SEGS[i+1],x1=POLY_SEGS[i+2],y1=POLY_SEGS[i+3];
      if(Math.max(x0,x1)<cx||Math.min(x0,x1)>cx+bw||
         Math.max(y0,y1)<cy||Math.min(y0,y1)>cy+bh) continue;
      hit=true;
    }
    if(!hit) return legendBox(ctx,cx,cy,items);
  }
  /* every spot is crossed: draw no legend rather than a lying one — the
     caption names the colours */
  return null;
}

/* ================================================================== *
 *  special functions and sRGB, extracted by name and unchanged from   *
 *  projects/simulations/diffraction.html (make_ext.py): Bessel J0/J1  *
 *  (series below 17, Hankel asymptotic above), sinc^2 and the Airy   *
 *  pattern with their small-argument series, the sRGB matrix and     *
 *  transfer curve.  Asserted here against scipy (refvals.txt).        *
 * ================================================================== */
const J_SPLIT=17.0;
function besselAsym(nu,x){
  const mu=4*nu*nu, w=8*x;
  /* t_j = prod_{i<=j} (mu - (2i-1)^2) / (j! w^j); even j build P, odd j build Q,
     each with its own alternating sign. */
  let P=1, Q=0, t=1;
  for(let j=1;j<=8;j++){
    t*=(mu-(2*j-1)*(2*j-1))/(j*w);
    if(j%2===0) P+=(((j/2)%2)?-1:1)*t;
    else        Q+=((((j-1)/2)%2)?-1:1)*t;
  }
  const chi=x-(2*nu+1)*PI/4;
  return Math.sqrt(2/(PI*x))*(P*Math.cos(chi)-Q*Math.sin(chi));
}
function besselJ0(x){
  x=Math.abs(x);
  if(x<J_SPLIT){
    const y=x*x/4; let term=1, s=1;
    for(let k=1;k<80;k++){ term*=-y/(k*k); s+=term;
      if(Math.abs(term)<1e-18*Math.abs(s)) break; }
    return s;
  }
  return besselAsym(0,x);
}
function besselJ1(x){
  const sg=x<0?-1:1; x=Math.abs(x);
  if(x<J_SPLIT){
    const y=x*x/4; let term=1, s=1;
    for(let k=1;k<80;k++){ term*=-y/(k*(k+1)); s+=term;
      if(Math.abs(term)<1e-18*Math.abs(s)) break; }
    return sg*(x/2)*s;
  }
  return sg*besselAsym(1,x);
}
function sinc2(b){
  const ab=Math.abs(b);
  if(ab<1e-4){ const b2=b*b; return 1-b2/3+2*b2*b2/45; }
  const s=Math.sin(b)/b; return s*s;
}
function gratingFactor(g,N){
  if(N<=1) return 1;
  const sg=Math.sin(g);
  if(Math.abs(sg)<1e-5) return 1-(N*N-1)*sg*sg/3;
  const r=Math.sin(N*g)/sg;
  return r*r/(N*N);
}

  const av=Math.abs(v);
  if(av<1e-4){ const v2=v*v; return 1-v2/4+v2*v2/12; }
  const t=2*besselJ1(v)/v; return t*t;

/* ================================================================== *
 *  THE ENGINE — the scalar wave equation on PhET's 2-D lattice, its   *
 *  point and plane sources, the screen and the probes, calibrated to  *
 *  physical units.  No DOM.  API: build/wave-interference/ENGINE.md   *
 *  (waves-intro builds on this part).  Twin: derive.py (numpy), which *
 *  repeats every operation below in the same order.                   *
 * ================================================================== */

/* PhET's lattice (wave-interference 2.0.22, read from the minified original):
   151 x 151 cells with a 20-cell pad on every side, so 111 x 111 are visible;
   Courant number C = c dt/dx = 1/2 (PhET's WAVE_SPEED 0.5); the point source at
   column 25 on the middle row 75; 20*111/61 lattice steps per second of wall
   time (half that on slow); the source cell driven at 1.2 x the amplitude
   setting and the plane wave at 0.21 x it.  VISIT is PhET's 1e-3 "has the
   light reached this cell" threshold. */
const LAT={N:151, PAD:20, VIS:111, C:0.5, SRC_I:25, MID:75,
           AMP_CAL:1.2, PLANE_MAG:0.21, EVENT_RATE:20*111/61, VISIT:1e-3};
LAT.C2=LAT.C*LAT.C;
/* Mur's absorbing boundary (G. Mur, IEEE Trans. EMC 23, 377 (1981)), the
   discretisation of the Engquist-Majda one-way equation at C = 1/2:
   MUR1 = (C-1)/(C+1) = -1/3, MUR2A = 2/(C+1) = 4/3, MUR2B = C^2/(2(C+1)) = 1/12.
   Second order on the edges, first order at the four corners.  PhET uses a
   different one-way formula; this one reflects |R| <= 3 % up to 45 degrees
   (derive.py: the exact plane-wave reflection, against 17 % for first order). */
const MUR1=(LAT.C-1)/(LAT.C+1), MUR2A=2/(LAT.C+1), MUR2B=LAT.C2/(2*(LAT.C+1));

function makeLattice(nx,ny,pad){
  const n=nx*ny;
  return {nx,ny,pad:(pad===undefined?LAT.PAD:pad),
          u:new Float64Array(n), up:new Float64Array(n), un:new Float64Array(n),
          vis:new Uint8Array(n), steps:0};
}
function latClear(L){ L.u.fill(0); L.up.fill(0); L.un.fill(0); L.vis.fill(0); L.steps=0; }
function latIndex(L,i,j){ return j*L.nx+i; }
/* one leapfrog step of u_tt = c^2 lap u on the 5-point stencil:
   u^{n+1} = 2u^n - u^{n-1} + C^2 (u_E + u_W + u_N + u_S - 4u^n)            */
function latStep(L){
  const nx=L.nx, ny=L.ny, u=L.u, up=L.up, un=L.un, vis=L.vis, C2=LAT.C2, V=LAT.VISIT;
  for(let j=1;j<ny-1;j++){
    const r=j*nx;
    for(let i=1;i<nx-1;i++){
      const k=r+i, c=u[k];
      const v=2*c-up[k]+C2*(u[k+1]+u[k-1]+u[k+nx]+u[k-nx]-4*c);
      un[k]=v;
      if(v>V||v<-V) vis[k]=1;
    }
  }
  /* the edges: left and right on rows 1..ny-2 (tangent = y, stride nx), then
     top and bottom on columns 1..nx-2 (tangent = x, stride 1) */
  for(let j=1;j<ny-1;j++){
    const r=j*nx;
    murEdge(un,u,up,r,r+1,nx);
    murEdge(un,u,up,r+nx-1,r+nx-2,nx);
  }
  const b=(ny-1)*nx, b1=(ny-2)*nx;
  for(let i=1;i<nx-1;i++){
    murEdge(un,u,up,i,nx+i,1);
    murEdge(un,u,up,b+i,b1+i,1);
  }
  murCorner(un,u,0,1); murCorner(un,u,nx-1,nx-2); murCorner(un,u,b,b+1); murCorner(un,u,b+nx-1,b+nx-2);
  L.up=u; L.u=un; L.un=up; L.steps++;
}
/* e = the edge cell, i = its inner neighbour, s = the stride along the edge */
function murEdge(un,u,up,e,i,s){
  un[e]=-up[i]+MUR1*(un[i]+up[e])+MUR2A*(u[e]+u[i])
        +MUR2B*(u[e+s]-2*u[e]+u[e-s]+u[i+s]-2*u[i]+u[i-s]);
}
function murCorner(un,u,c,a){ un[c]=u[a]+MUR1*(un[a]-u[c]); }

/* ---- the lattice's dispersion relation (exact for this scheme) ----------
   A mode u ~ exp(i(kx i + ky j - Om n)) solves the update iff
        sin^2(Om/2) = C^2 [ sin^2(kx/2) + sin^2(ky/2) ],
   with Om in radians per step and k in radians per cell.  Stable iff
   2C^2 <= 1 (C <= 1/sqrt 2); PhET's C = 1/2 is inside that. */
function latOmega(kx,ky){
  const s=Math.sin(kx/2), t=Math.sin(ky/2);
  return 2*Math.asin(LAT.C*Math.sqrt(s*s+t*t));
}
/* the wavenumber along direction th that carries the per-step frequency Om:
   bisection on the monotone branch k in (0, pi/max|cos|,|sin|) */
function latK(Om,th){
  const c=Math.cos(th), s=Math.sin(th), want=Math.sin(Om/2);
  let lo=0, hi=PI/Math.max(Math.abs(c),Math.abs(s));
  if(!(latOmega(hi*c,hi*s)>=Om)) return NaN;
  for(let it=0;it<200&&hi-lo>1e-15*hi;it++){
    const m=0.5*(lo+hi), g=LAT.C*Math.sqrt(Math.pow(Math.sin(m*c/2),2)+Math.pow(Math.sin(m*s/2),2));
    if(g<want) lo=m; else hi=m;
  }
  return 0.5*(lo+hi);
}
/* phase and group speed in cells per step; the continuum value is C */
function latPhaseSpeed(k,th){ return latOmega(k*Math.cos(th),k*Math.sin(th))/k; }
function latGroupSpeed(k,th){
  const kx=k*Math.cos(th), ky=k*Math.sin(th), Om=latOmega(kx,ky);
  return LAT.C2*Math.hypot(Math.sin(kx),Math.sin(ky))/Math.sin(Om);
}
/* the exact reflection off the Mur edge for a plane wave (kx, ky) arriving at
   the right-hand edge: a(x) = e^{ikx} + R e^{-ikx}, z = e^{-i Om} per step.
   order 1 or 2.  Complex arithmetic spelled out; returns |R|. */
function murReflection(kx,ky,order){
  const Om=latOmega(kx,ky);
  const zr=Math.cos(Om), zi=-Math.sin(Om);
  const cm=(ar,ai,br,bi)=>[ar*br-ai*bi, ar*bi+ai*br];
  const cd=(ar,ai,br,bi)=>{ const d=br*br+bi*bi; return [(ar*br+ai*bi)/d,(ai*br-ar*bi)/d]; };
  const ekr=Math.cos(kx), eki=Math.sin(kx);                 /* e^{ik}  */
  let P, Q;
  if(order===1){                                           /* a(0)(z+A1) = a(-1)(1+A1 z) */
    P=[zr+MUR1, zi]; Q=[1+MUR1*zr, MUR1*zi];
  } else {                                                 /* a(0)(z - A1/z - B) = a(-1)(-1/z + A1 z + B) */
    const B=MUR2A-MUR2B*(2-2*Math.cos(ky));
    const iz=cd(1,0,zr,zi);
    P=[zr-MUR1*iz[0]-B, zi-MUR1*iz[1]];
    Q=[-iz[0]+MUR1*zr+B, -iz[1]+MUR1*zi];
  }
  /* R = (e^{-ik} Q - P) / (P - e^{ik} Q) */
  const a=cm(ekr,-eki,Q[0],Q[1]), bq=cm(ekr,eki,Q[0],Q[1]);
  const R=cd(a[0]-P[0],a[1]-P[1],P[0]-bq[0],P[1]-bq[1]);
  return Math.hypot(R[0],R[1]);
}

/* ---- the three media, in PhET's units (PhET's values, from the scene
   definitions in the minified original): the visible width W, the wave
   speed v, the frequency range, the scale bar, the initial and allowed
   slit and source geometry, and PhET's own fixed time scale (kept only to
   report how far its calibration is from this one). ---- */
const C_NM_FS=299.792458;
const SCENES={
  water:{id:'water',name:'water',W:10,unit:'cm',tunit:'s',v:1.65,fmin:0.25,fmax:1,scaleLen:1,
         slitW0:1.5,slitD0:3,sepMin:1,sepMax:5,slitWMin:0.5,slitWMax:2.5,slitDMin:1,slitDMax:5,
         phetTimeScale:1,what:'water level',fUnit:'Hz',fMul:1},
  sound:{id:'sound',name:'sound',W:500,unit:'cm',tunit:'ms',v:34.3,fmin:0.22,fmax:0.44,scaleLen:50,
         slitW0:90,slitD0:200,sepMin:100,sepMax:400,slitWMin:20,slitWMax:160,slitDMin:40,slitDMax:320,
         phetTimeScale:2.4187847116091334,what:'pressure',fUnit:'Hz',fMul:1000},
  light:{id:'light',name:'light',W:5000,unit:'nm',tunit:'fs',v:C_NM_FS,fmin:C_NM_FS/780,fmax:C_NM_FS/380,scaleLen:500,
         slitW0:500,slitD0:1500,sepMin:500,sepMax:4000,slitWMin:200,slitWMax:1600,slitDMin:400,slitDMax:3200,
         phetTimeScale:1416.5/511.034,what:'electric field',fUnit:'THz',fMul:1000}
};
const SCENE_IDS=['water','sound','light'];
function sceneF0(S){ return 0.5*(S.fmin+S.fmax); }          /* PhET starts every scene mid-range */
function sceneDx(S){ return S.W/LAT.VIS; }
function waveLen(S,f){ return S.v/f; }
function cellsPerWave(S,f){ return S.v/f/sceneDx(S); }
/* the calibration: the physical time per step is solved from the dispersion
   relation so that the wave along a lattice axis has EXACTLY the wavelength
   v/f and the frequency f:  Om = 2 asin(C sin(pi dx/lambda)),  dt = Om/(2 pi f).
   (PhET keeps one dt per medium; see phetLambda.) */
function omegaStep(Nl){ return 2*Math.asin(LAT.C*Math.sin(PI/Nl)); }
function stepDt(S,f){ return omegaStep(cellsPerWave(S,f))/(TAU*f); }
/* what PhET's fixed step makes of frequency f: the lattice wavelength, in the
   medium's length unit, for dt = timeScale/EVENT_RATE along an axis */
function phetLambda(S,f){
  const dt=S.phetTimeScale/LAT.EVENT_RATE, Om=TAU*f*dt;
  const s=Math.sin(Om/2)/LAT.C; if(!(s<=1)) return NaN;
  return TAU/(2*Math.asin(s))*sceneDx(S);
}

/* ---- a run: one lattice, what drives it and what measures it ------------
   mode 'point': one or two in-phase hard sources on column SRC_I, rows MID and
   MID -/+ round(sep/2dx); 'plane': PhET's slits screen — every cell from the
   pad to the barrier column is set to the analytic plane wave, which is an
   exact solution of the lattice equations (the calibration makes it one),
   and the barrier column is a Dirichlet boundary: zero where it is blocked,
   the plane wave in the openings. */
const SCREEN_HIST=180;
function makeRun(sceneId,mode,nSrc,nx){
  const n=nx||LAT.N;
  const R={lat:makeLattice(n,n,LAT.PAD), mode:mode||'point', nSrc:nSrc||1,
           scene:null, f:0, A:8, Om:0, dt:0, Nl:0, phi:0, t:0, n:0,
           src:[true,true], pulse:{on:false,phi:0}, cont:true, sep:0,
           plane:{on:true,m:0,barrier:'one',bcol:LAT.MID,slitW:0,slitD:0},
           watch:{on:false,t:0}, probes:[], trace:[], screen:null};
  runSetScene(R,sceneId||'water');
  return R;
}
function runSetScene(R,sceneId){
  const S=SCENES[sceneId];
  R.scene=sceneId; R.sep=S.slitD0; R.plane.slitW=S.slitW0; R.plane.slitD=S.slitD0;
  R.t=0; R.n=0; R.watch.t=0;                       /* a new medium has its own clock and units */
  runSetFrequency(R,sceneF0(S),true);
  runClear(R);
}
/* keep the phase continuous across a frequency change (it is accumulated per
   step, so nothing jumps); light and plane waves clear, as in PhET */
function runSetFrequency(R,f,quiet){
  const S=SCENES[R.scene];
  R.f=clamp(f,S.fmin,S.fmax); R.Nl=cellsPerWave(S,R.f); R.Om=omegaStep(R.Nl); R.dt=stepDt(S,R.f);
  if(!quiet&&(R.scene==='light'||R.mode==='plane')) runClear(R);
}
function runClear(R){
  latClear(R.lat); R.phi=0; R.pulse.on=false; R.pulse.phi=0; R.plane.m=0; R.trace=[];
  const rows=R.lat.ny-2*R.lat.pad;
  R.screen={rows, buf:new Float64Array(rows*SCREEN_HIST), head:0, count:0};
}
/* PhET's clearRight: when the barrier moves, everything from its new column
   rightward is wiped; the plane wave to its left keeps its progress */
function runClearRight(R,col){
  const L=R.lat, nx=L.nx;
  for(let j=0;j<L.ny;j++) for(let i=Math.max(0,col);i<nx;i++){ const k=j*nx+i; L.u[k]=0; L.up[k]=0; L.un[k]=0; L.vis[k]=0; }
  const rows=L.ny-2*L.pad;
  R.screen={rows, buf:new Float64Array(rows*SCREEN_HIST), head:0, count:0}; R.trace=[];
}
/* the source column: PhET's 25 on the 151 lattice, i.e. 5 cells into the view */
function srcCol(L){ return L.pad+LAT.SRC_I-LAT.PAD; }
/* switching a source on restarts the phase only if no other source is
   running, so two sources always stay in phase (PhET's rule) */
function runSetSource(R,s,on){
  if(on&&!R.src[s]&&!R.src.some((v,q)=>v&&q!==s&&q<R.nSrc)) R.phi=0;
  R.src[s]=on;
}
/* the source rows: PhET's roundSymmetric(sep/2 in cells) either side of MID */
function runSourceRows(R){
  const S=SCENES[R.scene], h=Math.round(R.sep/(2*sceneDx(S)));
  const mid=(R.lat.ny-1)/2;
  return R.nSrc===2?[mid-h,mid+h]:[mid];
}
/* is row j open in the barrier?  cell centres |y - centre| < half-width, in cells */
function slitOpen(R,j){
  const P=R.plane, S=SCENES[R.scene], dx=sceneDx(S), mid=(R.lat.ny-1)/2, y=j-mid;
  if(P.barrier==='none') return true;
  const a=P.slitW/(2*dx);
  if(P.barrier==='one') return Math.abs(y)<a;
  const c=P.slitD/(2*dx);
  return Math.abs(y-c)<a||Math.abs(y+c)<a;
}
/* the slit geometry the lattice actually has: open cells per slit, and the
   distance between the centres of the two open groups, in cells */
function slitCells(R){
  const ny=R.lat.ny, mid=(ny-1)/2; let lo=[], hi=[];
  for(let j=0;j<ny;j++) if(slitOpen(R,j)){ if(j<mid) lo.push(j); else if(j>mid) hi.push(j); else { lo.push(j); hi.push(j); } }
  if(R.plane.barrier!=='two'){ const all=[]; for(let j=0;j<ny;j++) if(slitOpen(R,j)) all.push(j);
    return {n:all.length, a:all.length, d:0, lo:all.length?all[0]:NaN, hi:all.length?all[all.length-1]:NaN}; }
  const cen=g=>g.length?(g[0]+g[g.length-1])/2:NaN;
  return {n:lo.length+hi.length, a:hi.length, d:cen(hi)-cen(lo), lo:lo.length?lo[0]:NaN, hi:hi.length?hi[hi.length-1]:NaN};
}
function runStep(R){
  const L=R.lat;
  latStep(L);
  R.phi+=R.Om;
  if(R.mode==='point') setPointSources(R); else setPlaneWave(R);
  R.t+=R.dt; R.n++;
  if(R.watch.on) R.watch.t+=R.dt;
  recordScreen(R);
  if(R.probes.length){
    const s=[R.t]; for(const p of R.probes) s.push(probeValue(R,p[0],p[1]));
    R.trace.push(s); if(R.trace.length>900) R.trace.shift();
  }
}
function setPointSources(R){
  const L=R.lat, u=L.u, rows=runSourceRows(R), amp=R.A*LAT.AMP_CAL;
  let val=null;
  if(R.cont) val=amp*Math.sin(R.phi);
  else if(R.pulse.on){
    R.pulse.phi+=R.Om;
    if(R.pulse.phi<TAU) val=amp*Math.sin(R.pulse.phi); else { val=0; R.pulse.on=false; }
  }
  if(val===null) return;
  const ci=srcCol(L);
  for(let s=0;s<rows.length;s++) if(R.src[s]) u[rows[s]*L.nx+ci]=val;
}
function firePulse(R){ if(R.cont) return false; R.pulse.on=true; R.pulse.phi=0; return true; }
/* the plane wave, sin(Om m - k x), x in cells from the edge of the pad: its
   front (phase 0) moves at the phase speed Om/k, so the cut is continuous */
function setPlaneWave(R){
  const L=R.lat, P=R.plane, nx=L.nx, ny=L.ny, u=L.u, up=L.up, pad=L.pad;
  const iR=P.barrier==='none'?nx-pad:P.bcol;
  const k=TAU/R.Nl, amp=LAT.PLANE_MAG*R.A;
  const front=P.on?P.m*R.Om/k:-1;
  for(let i=pad;i<=iR;i++){
    const x=i-pad, val=(P.on&&x<=front)?amp*Math.sin(R.Om*P.m-k*x):0;
    for(let j=0;j<ny;j++){
      const q=j*nx+i, v=(i===iR&&P.barrier!=='none'&&!slitOpen(R,j))?0:val;
      u[q]=v; up[q]=v;
    }
  }
  if(P.on) P.m++;
}
/* the screen: PhET's intensity is the mean square of the last-visible column
   over a history window; here the window is the whole number of periods
   nearest 90 steps (PhET's 90), so the mean of sin^2 carries no phase ripple */
function recordScreen(R){
  const Sc=R.screen, L=R.lat, col=L.nx-L.pad-1, rows=Sc.rows;
  const off=Sc.head*rows;
  for(let r=0;r<rows;r++) Sc.buf[off+r]=L.u[(L.pad+r)*L.nx+col];
  Sc.head=(Sc.head+1)%SCREEN_HIST; if(Sc.count<SCREEN_HIST) Sc.count++;
}
function screenWindow(R){
  const P=TAU/R.Om, m=Math.max(1,Math.round(90/P));
  return Math.max(1,Math.min(SCREEN_HIST,Math.round(m*P)));
}
function screenIntensity(R){
  const Sc=R.screen, rows=Sc.rows, w=Math.min(Sc.count,screenWindow(R)), out=new Float64Array(rows);
  if(w<1) return out;
  for(let s=1;s<=w;s++){
    const off=((Sc.head-s+SCREEN_HIST)%SCREEN_HIST)*rows;
    for(let r=0;r<rows;r++){ const v=Sc.buf[off+r]; out[r]+=v*v; }
  }
  for(let r=0;r<rows;r++) out[r]/=w;
  return out;
}
/* model coordinates (x right, y down, both in the medium's unit, 0..W over the
   visible region): cell (i, j) has its centre at ((i-pad+1/2) dx, (j-pad+1/2) dx) */
function cellOfX(R,x){ return R.lat.pad-0.5+x/sceneDx(SCENES[R.scene]); }
function xOfCell(R,i){ return (i-R.lat.pad+0.5)*sceneDx(SCENES[R.scene]); }
function probeValue(R,x,y){
  const L=R.lat, X=cellOfX(R,x), Y=cellOfX(R,y);
  const i0=clamp(Math.floor(X),0,L.nx-2), j0=clamp(Math.floor(Y),0,L.ny-2);
  const fx=clamp(X-i0,0,1), fy=clamp(Y-j0,0,1), u=L.u, k=j0*L.nx+i0;
  return (1-fy)*((1-fx)*u[k]+fx*u[k+1])+fy*((1-fx)*u[k+L.nx]+fx*u[k+L.nx+1]);
}

/* ================================================================== *
 *  the colour of a wavelength: CIE 1931 (p2_cie.js, the CIE's own     *
 *  table every 5 nm) -> linear sRGB, desaturated into gamut toward    *
 *  white and normalised to its brightest channel (hue, not luminance) *
 * ================================================================== */
function cieAt(nm){
  const T=CIE1931, x=clamp((nm-T[0][0])/5,0,T.length-1), i=Math.min(T.length-2,Math.floor(x)), f=x-i;
  return [T[i][1]+(T[i+1][1]-T[i][1])*f, T[i][2]+(T[i+1][2]-T[i][2])*f, T[i][3]+(T[i+1][3]-T[i][3])*f];
}
function specLinear(nm){
  const c=cieAt(nm);
  if(c[0]+c[1]+c[2]<1e-9) return [0,0,0];
  let r=SRGB_M[0][0]*c[0]+SRGB_M[0][1]*c[1]+SRGB_M[0][2]*c[2];
  let g=SRGB_M[1][0]*c[0]+SRGB_M[1][1]*c[1]+SRGB_M[1][2]*c[2];
  let b=SRGB_M[2][0]*c[0]+SRGB_M[2][1]*c[1]+SRGB_M[2][2]*c[2];
  const lo=Math.min(r,g,b); if(lo<0){ r-=lo; g-=lo; b-=lo; }
  const hi=Math.max(r,g,b,1e-12);
  return [r/hi,g/hi,b/hi];
}
/* intensity applied in LINEAR light, then gamma-encoded (diffraction.html's rule) */
function specCss(nm,I){
  const c=specLinear(nm), t=clamp(I,0,1);
  return 'rgb('+Math.round(255*srgbGamma(c[0]*t))+','+Math.round(255*srgbGamma(c[1]*t))+','+Math.round(255*srgbGamma(c[2]*t))+')';
}

/* ================================================================== *
 *  the far field: PhET's Diffraction screen                           *
 *  A 256 x 256 aperture spans 4/3 mm (PhET's DIFFRACTION_MATRIX_      *
 *  DIMENSION and DIFFRACTION_APERTURE_WIDTH), so a pixel is 1/192 mm. *
 *  The pattern is |FFT| of the aperture, shifted to the centre.  To   *
 *  keep the picture's angular scale fixed as the wavelength changes,  *
 *  PhET redraws the aperture magnified by s = lambda0/lambda (lambda0  *
 *  = 511.03 nm, the harmonic mean of 380 and 780 nm); then one FFT bin *
 *  is  sin(theta) = lambda0 / (N px) = 3.8328e-4  at every wavelength. *
 * ================================================================== */
const DIF={N:256, WIDTH:4/3, LAM0:2/(1/780+1/380), Q:4, LAMMIN:380, LAMMAX:780, SLIT_H:0.3, FIG_SEED:20260918};
/* the first zero of J1 (scipy.special.jn_zeros(1,1)); selfTest asserts J1 vanishes there */
const J11=3.8317059702075125;
DIF.PX=DIF.WIDTH/DIF.N;
DIF.SIN_PER_BIN=DIF.LAM0*1e-6/(DIF.N*DIF.PX);
const APERTURES=[
  {id:'ellipse',name:'ellipse',phet:true},{id:'rect',name:'rectangle',phet:true},
  {id:'cs',name:'circle & square',phet:true},{id:'disorder',name:'disorder',phet:true},
  {id:'figure',name:'a waving figure',phet:true},{id:'gauss',name:'Gaussian',phet:false},
  {id:'slits',name:'slits',phet:false}];
function difScale(lam){ return DIF.LAM0/lam; }
/* the disorder lattice: 4 x 4 circles; each is pushed off its site by
   (level/4) x 0.3 spacing x a fixed random vector in the unit disc (Park-Miller
   minimal-standard generator, seed 20260918 — integer arithmetic, so the
   python twin reproduces it exactly).  A new design: PhET's own table of
   offsets is not used. */
const DISORDER_V=(function(){
  let x=DIF.FIG_SEED%2147483647; const out=[];
  const nxt=()=>{ x=(48271*x)%2147483647; return x/2147483647; };
  for(let q=0;q<16;q++){ const a=TAU*nxt(), r=Math.sqrt(nxt()); out.push([r*Math.cos(a),r*Math.sin(a)]); }
  return out;
})();
/* the waving figure, in units of its height (y down, centred): a head and
   six capsules — new art standing in for PhET's photograph */
const FIGURE={head:[0,-0.38,0.12],
  caps:[[0,-0.25,0,0.1,0.055],[0,0.1,-0.12,0.47,0.035],[0,0.1,0.12,0.47,0.035],
        [0,-0.17,-0.2,0.05,0.03],[0,-0.17,0.17,-0.3,0.03],[0.17,-0.3,0.22,-0.47,0.03]]};
function segDist2(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t=L2>0?((px-ax)*dx+(py-ay)*dy)/L2:0; t=t<0?0:(t>1?1:t);
  const ex=ax+t*dx-px, ey=ay+t*dy-py; return ex*ex+ey*ey;
}
/* the aperture as geometry, in mm, magnified by s: inside(x, y) and a bounding
   box; the Gaussian is a transmission profile instead (grey, sampled at
   pixel centres) and the rectangle is snapped to whole pixels, as PhET's is */
/* the ellipse's semi-axes: D/2 and D/2 sqrt(1 - e^2), magnified by s (one formula for
   the renderer and the drawing both) */
function ellipseAxes(P,s){ const rx=s*P.ellD/2; return [rx,rx*Math.sqrt(1-P.ellE*P.ellE)]; }
function apertureShape(P,s){
  const id=P.ap;
  if(id==='ellipse'){
    const ax=ellipseAxes(P,s), rx=ax[0], ry=ax[1];
    return {bb:[-rx,rx,-ry,ry], inside:(x,y)=>(x/rx)*(x/rx)+(y/ry)*(y/ry)<1};
  }
  if(id==='cs'){
    const c=26*DIF.PX*s, r=s*P.csD/2, h=s*P.csW/2;
    return {bb:[-c-Math.max(r,h),c+Math.max(r,h),-c-Math.max(r,h),c+Math.max(r,h)],
            inside:(x,y)=>((x+c)*(x+c)+(y+c)*(y+c)<r*r)||(Math.abs(x-c)<h&&Math.abs(y-c)<h)};
  }
  if(id==='disorder'){
    const p=P.disP, r=s*P.disD/2, f=P.disL/4*0.3*p, cen=[];
    for(let a=0;a<4;a++) for(let b=0;b<4;b++){ const v=DISORDER_V[4*a+b];
      cen.push([s*((a-1.5)*p+f*v[0]), s*((b-1.5)*p+f*v[1])]); }
    let m=0; for(const c of cen) m=Math.max(m,Math.abs(c[0])+r,Math.abs(c[1])+r);
    return {bb:[-m,m,-m,m], inside:(x,y)=>{ for(const c of cen){ const dx=x-c[0], dy=y-c[1]; if(dx*dx+dy*dy<r*r) return true; } return false; }};
  }
  if(id==='figure'){
    const H=s*P.figH, rot=P.figR*PI/180, co=Math.cos(rot), si=Math.sin(rot), hd=FIGURE.head;
    return {bb:[-0.6*H,0.6*H,-0.6*H,0.6*H], inside:(x,y)=>{
      const u=(x*co+y*si)/H, v=(-x*si+y*co)/H;
      if((u-hd[0])*(u-hd[0])+(v-hd[1])*(v-hd[1])<hd[2]*hd[2]) return true;
      for(const c of FIGURE.caps) if(segDist2(u,v,c[0],c[1],c[2],c[3])<c[4]*c[4]) return true;
      return false; }};
  }
  if(id==='slits'){
    const n=Math.round(P.sltN), a=s*P.sltW/2, d=s*P.sltD, hh=s*DIF.SLIT_H/2, x0=-(n-1)/2*d;
    return {bb:[x0-a,-x0+a,-hh,hh], inside:(x,y)=>{
      if(Math.abs(y)>=hh) return false;
      for(let q=0;q<n;q++) if(Math.abs(x-(x0+q*d))<a) return true;
      return false; }};
  }
  return null;
}
/* render the aperture into an N x N transmission map (row j, column i; the
   aperture's centre sits on the corner between pixels 127 and 128, as in
   PhET's canvas).  Shapes are covered by Q x Q sub-samples per pixel. */
function renderAperture(P,lam){
  const N=DIF.N, px=DIF.PX, s=difScale(lam), t=new Float64Array(N*N), h=N/2;
  if(P.ap==='rect'){
    const iw=Math.round(P.recW*s/(2*px)), ih=Math.round(P.recH*s/(2*px));
    for(let j=h-ih;j<h+ih;j++) for(let i=h-iw;i<h+iw;i++) if(i>=0&&i<N&&j>=0&&j<N) t[j*N+i]=1;
    return {t,s,iw,ih};
  }
  if(P.ap==='gauss'){
    const sx=s*P.gauSx, sy=s*P.gauSy;
    for(let j=0;j<N;j++){ const y=(j-h+0.5)*px;
      for(let i=0;i<N;i++){ const x=(i-h+0.5)*px;
        t[j*N+i]=Math.exp(-(x*x/(2*sx*sx)+y*y/(2*sy*sy))); } }
    return {t,s};
  }
  const G=apertureShape(P,s), Q=DIF.Q;
  const i0=Math.max(0,Math.floor(G.bb[0]/px+h)-1), i1=Math.min(N-1,Math.ceil(G.bb[1]/px+h)+1);
  const j0=Math.max(0,Math.floor(G.bb[2]/px+h)-1), j1=Math.min(N-1,Math.ceil(G.bb[3]/px+h)+1);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    let c=0;
    for(let qy=0;qy<Q;qy++){ const y=(j-h+(qy+0.5)/Q)*px;
      for(let qx=0;qx<Q;qx++){ const x=(i-h+(qx+0.5)/Q)*px; if(G.inside(x,y)) c++; } }
    t[j*N+i]=c/(Q*Q);
  }
  return {t,s};
}
/* ---- the FFT: radix-2 decimation in time with a twiddle table (the
   structure of fourier.html's, tabled rather than recurred) ---- */
const FFT_TABLES={};
function fftTables(n){
  if(FFT_TABLES[n]) return FFT_TABLES[n];
  const bits=Math.round(Math.log2(n)), rev=new Uint32Array(n), c=new Float64Array(n/2), s=new Float64Array(n/2);
  for(let i=0;i<n;i++){ let r=0; for(let b=0;b<bits;b++) if(i&(1<<b)) r|=1<<(bits-1-b); rev[i]=r; }
  for(let k=0;k<n/2;k++){ c[k]=Math.cos(-TAU*k/n); s[k]=Math.sin(-TAU*k/n); }
  return FFT_TABLES[n]={rev,c,s};
}
function fftInPlace(re,im){
  const n=re.length, T=fftTables(n);
  for(let i=0;i<n;i++){ const r=T.rev[i]; if(r>i){ let t=re[i]; re[i]=re[r]; re[r]=t; t=im[i]; im[i]=im[r]; im[r]=t; } }
  for(let len=2;len<=n;len<<=1){
    const half=len>>1, step=n/len;
    for(let i=0;i<n;i+=len) for(let k=0;k<half;k++){
      const wr=T.c[k*step], wi=T.s[k*step], a=i+k, b=a+half;
      const vr=re[b]*wr-im[b]*wi, vi=re[b]*wi+im[b]*wr;
      re[b]=re[a]-vr; im[b]=im[a]-vi; re[a]+=vr; im[a]+=vi;
    }
  }
}
function fft2(re,im,n){
  const rr=new Float64Array(n), ri=new Float64Array(n);
  for(let j=0;j<n;j++){ for(let i=0;i<n;i++){ rr[i]=re[j*n+i]; ri[i]=im[j*n+i]; }
    fftInPlace(rr,ri); for(let i=0;i<n;i++){ re[j*n+i]=rr[i]; im[j*n+i]=ri[i]; } }
  for(let i=0;i<n;i++){ for(let j=0;j<n;j++){ rr[j]=re[j*n+i]; ri[j]=im[j*n+i]; }
    fftInPlace(rr,ri); for(let j=0;j<n;j++){ re[j*n+i]=rr[j]; im[j*n+i]=ri[j]; } }
}
/* the O(N^2)-per-bin direct sum, for the cross-check */
function dft2At(t,n,k1,k2){
  let sr=0, si=0;
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){ const v=t[j*n+i]; if(v===0) continue;
    const a=-TAU*((k1*i+k2*j)%n)/n; sr+=v*Math.cos(a); si+=v*Math.sin(a); }
  return [sr,si];
}
/* the pattern: |F| shifted so bin (0,0) sits at pixel (128,128); PhET's
   display value log(0.01|F| + 1)/log(0.01 max + 1); the intensity |F|^2/max^2 */
function diffract(t){
  const n=DIF.N, re=Float64Array.from(t), im=new Float64Array(n*n), mag=new Float64Array(n*n), h=n/2;
  fft2(re,im,n);
  let mx=0;
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const v=Math.sqrt(re[j*n+i]*re[j*n+i]+im[j*n+i]*im[j*n+i]);
    mag[((j+h)%n)*n+(i+h)%n]=v; if(v>mx) mx=v; }
  return {mag,max:mx,dc:mag[h*n+h]};
}
function phetDisplay(m,max){ return max>0?Math.log(0.01*m+1)/Math.log(0.01*max+1):0; }
/* the analytic far field along the horizontal cut (ky = 0), I/I0 at sin(theta),
   for the apertures that have one; null for the rest */
function fraunhoferCut(P,lam,sinT,rendered){
  const lm=lam*1e-6;
  if(P.ap==='ellipse') return airyI(PI*P.ellD*sinT/lm);
  if(P.ap==='rect'){ const w=rendered?2*rendered.iw*DIF.PX/rendered.s:P.recW; return sinc2(PI*w*sinT/lm); }
  if(P.ap==='gauss'){ const q=TAU*P.gauSx*sinT/lm; return Math.exp(-q*q); }
  if(P.ap==='slits') return sinc2(PI*P.sltW*sinT/lm)*gratingFactor(PI*P.sltD*sinT/lm,Math.round(P.sltN));
  return null;
}
/* the exact discrete answer for the pixel-snapped rectangle: a box of M ones
   transforms to the Dirichlet kernel sin(pi k M/N)/sin(pi k/N) */
function dirichlet(k,M,N){
  if(k%N===0) return M;
  return Math.sin(PI*k*M/N)/Math.sin(PI*k/N);
}

/* ================================================================== *
 *  two sources: the geometry of the path difference                   *
 *  Sources at (0, -d/2) and (0, +d/2); a point (x, y) has r1, r2 and   *
 *  path difference r1 - r2 = Delta.  Delta = const is a hyperbola with *
 *  foci at the sources: y^2/a^2 - x^2/b^2 = 1, a = Delta/2,            *
 *  b^2 = d^2/4 - a^2, asymptotic to sin(theta) = Delta/d.  The nodal   *
 *  lines are Delta = (m + 1/2) lambda with |Delta| < d.                *
 * ================================================================== */
function nodalCount(dOverLam){ return 2*Math.max(0,Math.ceil(dOverLam-0.5)); }
function hyperY(d,Del,L){ const a=Del/2, b2=d*d/4-a*a; return a*Math.sqrt(1+L*L/b2); }
function farY(d,Del,L){ const a=Del/2; return L*a/Math.sqrt(d*d/4-a*a); }
/* each source a 2-D cylindrical wave e^{ikr}/sqrt(r) (the far form of the 2-D
   Green's function, kr >> 1): the time-averaged intensity at (x, y) */
function twoSourceI(x,y,d,k){
  const r1=Math.hypot(x,y+d/2), r2=Math.hypot(x,y-d/2);
  return 1/r1+1/r2+2*Math.cos(k*(r1-r2))/Math.sqrt(r1*r2);
}
/* the interference factor: I divided by the two waves' own intensities,
   1 + 2 cos k(r1 - r2) sqrt(r1 r2)/(r1 + r2), in [0, 2] */
function fringeFactor(x,y,d,k){ const r1=Math.hypot(x,y+d/2), r2=Math.hypot(x,y-d/2); return twoSourceI(x,y,d,k)/(1/r1+1/r2); }
/* Fraunhofer: cos^2(pi d sin(theta)/lambda), theta seen from the midpoint */
function twoSourceFar(x,y,d,k){ const c=Math.cos(k*d*y/(2*Math.hypot(x,y))); return c*c; }

/* ---- the theory curves for the lattice's own screen ------------------
   Slits: the 2-D Rayleigh-Sommerfeld integral for Dirichlet data on the
   barrier column (exactly what the lattice imposes), in its far-zone form
   E(P) ~ sum over open cells of (X/r) e^{ikr}/sqrt(r), X the barrier-to-screen
   distance; and the Fraunhofer sinc^2 cos^2 seen from the barrier's centre.
   Two sources: twoSourceI at the screen.  All normalised to their peak. */
function screenTheory(R){
  const S=SCENES[R.scene], dx=sceneDx(S), L=R.lat, mid=(L.ny-1)/2, col=L.nx-L.pad-1;
  const rows=L.ny-2*L.pad, k=TAU/waveLen(S,R.f), exact=new Float64Array(rows), far=new Float64Array(rows);
  if(R.mode==='plane'){
    if(R.plane.barrier==='none') { exact.fill(1); far.fill(1); return {exact,far}; }
    const X=(col-R.plane.bcol)*dx, open=[];
    for(let j=0;j<L.ny;j++) if(slitOpen(R,j)) open.push((j-mid)*dx);
    const g=slitCells(R), a=g.a*dx, dd=g.d*dx;
    for(let r=0;r<rows;r++){
      const ys=(L.pad+r-mid)*dx; let er=0, ei=0;
      for(const yj of open){ const rr=Math.hypot(X,ys-yj), w=X/(rr*Math.sqrt(rr)); er+=w*Math.cos(k*rr); ei+=w*Math.sin(k*rr); }
      exact[r]=er*er+ei*ei;
      const sn=ys/Math.hypot(X,ys);
      far[r]=sinc2(k*a*sn/2)*(R.plane.barrier==='two'?Math.pow(Math.cos(k*dd*sn/2),2):1);
    }
  } else {
    const rs=runSourceRows(R), X=(col-srcCol(L))*dx;
    if(rs.length===2&&R.src[0]&&R.src[1]){
      const d=(rs[1]-rs[0])*dx;
      for(let r=0;r<rows;r++){ const ys=(L.pad+r-mid)*dx; exact[r]=twoSourceI(X,ys,d,k); far[r]=twoSourceFar(X,ys,d,k); }
    } else {
      const on=rs.filter((_,q)=>R.src[q]), y0=on.length?(on[0]-mid)*dx:0;
      for(let r=0;r<rows;r++){ const ys=(L.pad+r-mid)*dx, rr=Math.hypot(X,ys-y0); exact[r]=on.length?1/rr:0; far[r]=on.length?1:0; }
    }
  }
  const nm=a=>{ let m=0; for(const v of a) m=Math.max(m,v); if(m>0) for(let q=0;q<a.length;q++) a[q]/=m; };
  nm(exact); nm(far);
  return {exact,far};
}

function stKey(base){ return base+'_'+ST.scene; }

/* ---- the three lattice runs and their clock ------------------------------ */
const RUNS={tank:makeRun('water','point',1), two:makeRun('water','point',2), slits:makeRun('water','plane',1)};
const CLOCK={acc:0, steps:0};
/* bring a run in line with the panel: medium (clears), frequency (keeps the
   waves unless light or plane), amplitude, sources, barrier, tools */
function syncRun(v){
  const R=RUNS[v]; if(!R) return null;
  if(R.scene!==ST.scene){ runSetScene(R,ST.scene); }
  if(R.f!==stF()) runSetFrequency(R,stF());
  R.A=ST[ampKey(v)];
  R.cont=(ST.wave==='cont');
  const S=SCENES[R.scene];
  if(v==='two'){ R.sep=ST[stKey('sep')];
    if(R.src[0]!==ST.src1) runSetSource(R,0,ST.src1);
    if(R.src[1]!==ST.src2) runSetSource(R,1,ST.src2); }
  if(v==='slits'){
    const P=R.plane, w=ST[stKey('slitW')], d=ST[stKey('slitD')];
    if(P.barrier!==ST.barrier||P.slitW!==w||P.slitD!==d){
      P.barrier=ST.barrier; P.bcol=ST.bcol; P.slitW=w; P.slitD=d; runClear(R); }
    else if(P.bcol!==ST.bcol){ P.bcol=ST.bcol; runClearRight(R,P.bcol); }
    if(P.on!==ST.planeOn){ P.on=ST.planeOn; runClear(R); }
  }
  R.probes=ST.meter?TOOLS.probes.map(p=>[p[0]*S.W,p[1]*S.W]):[];
  return R;
}
function curRun(){ return LATTICE_VIEWS[ST.view]?syncRun(ST.view):null; }
function stepsPerSecond(){ return LAT.EVENT_RATE*(ST.speed==='slow'?0.5:1); }
/* one frame of wall time: PhET's event timer, deterministic (FRAME_DT) */
function clockFrame(){
  const R=curRun(); if(!R||!ST.running) return 0;
  CLOCK.acc+=FRAME_DT; const per=1/stepsPerSecond(); let n=0;
  while(CLOCK.acc>=per&&n<3){ runStep(R); CLOCK.acc-=per; n++; CLOCK.steps++; }
  if(n===3) CLOCK.acc=0;
  return n;
}
function runFor(v,steps){ const R=syncRun(v); for(let k=0;k<steps;k++) runStep(R); return R; }
function resetRuns(){ for(const v in RUNS){ const R=RUNS[v]; runSetScene(R,ST.scene); R.watch.on=false; R.watch.t=0; } CLOCK.acc=0; }

/* ---- the far field: a render + FFT only when a parameter moves; the eight
   most recent results are kept, so flipping between apertures is free ---- */
const FAR_CACHE=[];
/* the aperture sliders' ranges, one table for the panel and the tests (PhET's values
   for its five apertures, mm and degrees; the Gaussian and the slits are this file's) */
const SLIDER_RANGE={ellD:[0.04,0.4],ellE:[0,0.99],recW:[0.04,0.4],recH:[0.04,0.4],csD:[0.04,0.15],csW:[0.04,0.15],
  disD:[0.01,0.1],disP:[0.05,0.2],disL:[0,4],figH:[0.04,0.4],figR:[0,360],gauSx:[0.01,0.08],gauSy:[0.01,0.08],
  sltN:[1,5],sltW:[0.01,0.1],sltD:[0.04,0.2]};
/* only the chosen aperture's own parameters: a hidden slider cannot trigger a transform */
const AP_KEYS={ellipse:['ellD','ellE'],rect:['recW','recH'],cs:['csD','csW'],disorder:['disD','disP','disL'],
               figure:['figH','figR'],gauss:['gauSx','gauSy'],slits:['sltN','sltW','sltD']};
function farParams(){ const P={ap:ST.ap}; for(const k of AP_KEYS[ST.ap]) P[k]=ST[k]; return P; }
function farModel(){
  const P=farParams(), key=JSON.stringify(P)+'|'+ST.lam;
  for(const e of FAR_CACHE) if(e.key===key) return e.val;
  const val=farCompute(P);
  FAR_CACHE.unshift({key,val}); if(FAR_CACHE.length>8) FAR_CACHE.pop();
  return val;
}
function farCompute(P){
  const rend=renderAperture(P,ST.lam), D=diffract(rend.t), n=DIF.N, h=n/2;
  const cut=[], ana=[], ks=[];
  for(let k=-h;k<h;k++){ const m=D.mag[h*n+k+h]; ks.push(k); cut.push(D.dc>0?(m/D.dc)*(m/D.dc):0);
    const a=fraunhoferCut(P,ST.lam,k*DIF.SIN_PER_BIN,rend); ana.push(a===null?NaN:a); }
  return {P,rend,D,ks,cut,ana,hasAna:!isNaN(ana[h+1]),zero:firstZero(P,ST.lam,rend),s:rend.s,
          open:rend.t.reduce((a,b)=>a+b,0)};
}
/* sin(theta) of the first dark fringe along the cut, where a closed form gives one:
   the disc j11 lambda/(pi D), the snapped rectangle lambda/w, N slits lambda/(N d), one slit lambda/a */
function firstZero(P,lam,rend){
  const lm=lam*1e-6;
  if(P.ap==='ellipse') return J11*lm/(PI*P.ellD);
  if(P.ap==='rect') return lm/(2*rend.iw*DIF.PX/rend.s);
  if(P.ap==='slits'){ const n=Math.round(P.sltN); return n>1?lm/(n*P.sltD):lm/P.sltW; }
  return null;
}

/* ---- the models ---------------------------------------------------------- */
function latModel(v){
  const R=syncRun(v), S=SCENES[R.scene], dx=sceneDx(S), lam=waveLen(S,R.f);
  const M={R,S,dx,lam,Nl:R.Nl,Om:R.Om,dt:R.dt,T:1/R.f,phetErr:phetLambda(S,R.f)/lam-1,
           steps:R.n,t:R.t,watch:R.watch};
  if(v==='two'){ const rs=runSourceRows(R); M.dEff=(rs[1]-rs[0])*dx; M.nodal=nodalCount(M.dEff/lam); }
  if(v==='slits'){ M.g=slitCells(R); M.X=(R.lat.nx-R.lat.pad-1-R.plane.bcol)*dx;
    M.aEff=M.g.a*dx; M.dEff=M.g.d*dx; M.fresnel=(R.plane.barrier==='two'?M.dEff:M.aEff)*(R.plane.barrier==='two'?M.dEff:M.aEff)/(lam*M.X); }
  if((ST.screen||ST.inten)&&R.scene==='light'){ M.I=screenIntensity(R); M.Imax=M.I.reduce((a,b)=>Math.max(a,b),0);
    M.th=(ST.theory&&(v==='two'||v==='slits'))?screenTheory(R):null; }
  if(ST.tape){ const a=TOOLS.tape[0], b=TOOLS.tape[1]; M.tapeLen=Math.hypot(b[0]-a[0],b[1]-a[1])*S.W; }
  if(ST.meter) M.probes=TOOLS.probes.map(p=>probeValue(R,p[0]*S.W,p[1]*S.W));

}
function pathModel(){
  const d=ST.pd, L=ST.pL, lam=1, k=TAU;
  const mins=[];
  for(let m=0;(m+0.5)<d;m++){ const D=(m+0.5)*lam; mins.push({m,D,y:hyperY(d,D,L),yf:farY(d,D,L)}); }
  return {d,L,lam,k,n:nodalCount(d),mins,fraun:d*d/lam,I0:twoSourceI(L,0,d,k)};
}
function latticeModel(){
  const S=SCENES[ST.scene], f=stF(), Nl=cellsPerWave(S,f), Om=omegaStep(Nl), k=TAU/Nl, th=ST.latTh*DEG;
  const kth=latK(Om,th);
  return {S,f,Nl,Om,k,th,vp0:latPhaseSpeed(k,0)/LAT.C,vg0:latGroupSpeed(k,0)/LAT.C,
          vpd:latPhaseSpeed(latK(Om,PI/4),PI/4)/LAT.C,vgd:latGroupSpeed(latK(Om,PI/4),PI/4)/LAT.C,
          vpth:Om/kth/LAT.C,lamDiag:(TAU/latK(Om,PI/4))/Nl,
          R1:[0,30,45,60].map(a=>murReflection(k*Math.cos(a*DEG),k*Math.sin(a*DEG),1)),
          R2:[0,30,45,60].map(a=>murReflection(k*Math.cos(a*DEG),k*Math.sin(a*DEG),2)),
          phetErr:phetLambda(S,f)/waveLen(S,f)-1, dt:stepDt(S,f)};
}
function buildModel(){
  const view=ST.view, M={view};
  if(LATTICE_VIEWS[view]) M.L=latModel(view);
  if(view==='far') M.F=farModel();
  if(view==='path') M.P=pathModel();
  if(view==='lattice') M.K=latticeModel();
  return M;
}

const CAP_FONT='11.5px -apple-system, sans-serif';
const LAB_FONT='11px -apple-system, sans-serif';
const SM_FONT='10.5px -apple-system, sans-serif';
function isNarrow(W){ return W<900; }
function worldFitUp(b,ext,pad){
  const dx=ext.xmax-ext.xmin+2*pad, dy=ext.ymax-ext.ymin+2*pad;
  const s=Math.min(b.w/dx,b.h/dy);
  const ox=b.x+(b.w-s*dx)/2-(ext.xmin-pad)*s, oy=b.y+(b.h-s*dy)/2+(ext.ymax+pad)*s;
  return {s,ox,oy,X:x=>ox+s*x,Y:y=>oy-s*y,wx:X=>(X-ox)/s,wy:Y=>(oy-Y)/s};
}
function worldCurve(ctx,map,fn,t0,t1,n,col,lw,dash){
  ctx.beginPath(); let px=0,py=0;
  for(let i=0;i<=n;i++){ const p=fn(t0+(t1-t0)*i/n), X=map.X(p[0]), Y=map.Y(p[1]);
    if(i===0) ctx.moveTo(X,Y); else { ctx.lineTo(X,Y); POLY_SEGS.push(px,py,X,Y); }
    px=X; py=Y; }
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function worldFill(ctx,map,pts,col){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function worldPoly(ctx,map,pts,fill,stroke,lw,dash){
  if(pts.length<2) return;

  if(stroke){ ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(map.X(p[0]),map.Y(p[1])); else ctx.lineTo(map.X(p[0]),map.Y(p[1])); });
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; POLY_SEGS.push(map.X(a[0]),map.Y(a[1]),map.X(b[0]),map.Y(b[1])); } }
}
function seg(ctx,map,a,b,col,lw,dash){

  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);

function arrowW(ctx,map,a,v,col,lw){
  const X0=map.X(a[0]),Y0=map.Y(a[1]),X1=map.X(a[0]+v[0]),Y1=map.Y(a[1]+v[1]);
  const L=Math.hypot(X1-X0,Y1-Y0); if(L<2) return;
  const ux=(X1-X0)/L, uy=(Y1-Y0)/L, hh=Math.min(9,L*0.4);
  ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y1);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux+0.5*hh*uy,Y1-hh*uy-0.5*hh*ux);
  ctx.moveTo(X1,Y1); ctx.lineTo(X1-hh*ux-0.5*hh*uy,Y1-hh*uy+0.5*hh*ux);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.6; ctx.stroke();
}
/* the label registry: the audit's half-pixel overlap rule, shift or drop */
let LABELS=[];
function labFits(bx){
  for(const o of LABELS) if(bx[0]<o[2]-0.5&&bx[2]>o[0]+0.5&&bx[1]<o[3]-0.5&&bx[3]>o[1]+0.5) return false;
  return true;
}
function lab(ctx,W,H,x,y,txt,col,font,align,base){
  ctx.fillStyle=col||'#aeb6c6'; ctx.font=font||LAB_FONT;
  const al=align||'left', bl=base||'middle';
  ctx.textAlign=al; ctx.textBaseline=bl;
  const t=plain(txt), fs=parseFloat((font||LAB_FONT).match(/([\d.]+)px/)[1]), w=t.length*fs*0.52, hh=fs*1.15;
  for(const dy of [0,16,-16,32,-32]){
    let X=x, Y=y+dy;
    if(al==='left') X=clamp(X,2,W-w-2); else if(al==='right') X=clamp(X,w+2,W-2); else X=clamp(X,w/2+2,W-w/2-2);
    Y=clamp(Y,hh,H-hh);
    const lx=al==='center'?X-w/2:(al==='right'?X-w:X);
    const ly=bl==='top'?Y:(bl==='middle'?Y-hh/2:(bl==='bottom'?Y-hh:Y-hh*0.8));
    const bx=[lx,ly,lx+w,ly+hh];
    if(labFits(bx)){ LABELS.push(bx); ctx.fillText(t,X,Y); return true; }
  }
  return false;
}
function titleFor(b,longT,shortT){ return (b.w<330||plain(longT).length*13*0.52+10>b.w)?shortT:longT; }
function axesR(ctx,b,xlo,xhi,ylo,yhi,opt){

  if(opt&&opt.title){ const t=plain(opt.title), w=t.length*13*0.52; LABELS.push([b.x,b.y-9-13*1.15,b.x+w,b.y-9]); }
}
function stageLayout(ctx,W,H,capFull,capShort,nBottom,bottomFrac,nBottomNarrow){
  const narrow=isNarrow(W);
  const left=56, right=narrow?W-26:W-RO_W-44;
  const capW=Math.max(260,Math.min(W-148,right-left));
  const top=stageTop()+30;
  const fit=fitCaption(ctx,W,H,capFull,capShort,capW,top+220);
  const avail=fit.capY-16-top;
  const nB=narrow?(nBottomNarrow===undefined?1:nBottomNarrow):nBottom;
  const out={narrow,left,right,capY:fit.capY,capTxt:fit.txt,capW,bottom:[]};
  let mainH=avail;
  if(nB>0){
    const rowH=Math.max(90,Math.floor(avail*bottomFrac));
    mainH=avail-rowH-56;
    const gut=52, span=right-left, w=(span-gut*nB)/nB;
    for(let i=0;i<nB;i++) out.bottom.push(box(left+gut+i*(w+gut),fit.capY-16-rowH+10,w,rowH-34));

  out.main=box(left,top,right-left,Math.max(80,mainH));

/* ================================================================== *
 *  the lattice views: the field, the side view, the sound parcels,    *
 *  the sources and the barrier, the tools, the charts                 *
 * ================================================================== */
const NLEV=49, HALF=24;                                  /* 49 colour classes, zero on the middle one */
function levelOf(v){ const t=v/U_FULL; return Math.round(((t<-1?-1:(t>1?1:t))+1)*HALF); }
const LEVEL_CACHE={};
function levelCols(scene,lam){
  const key=scene+'|'+(scene==='light'?fmt(lam,2):'');
  if(LEVEL_CACHE[key]) return LEVEL_CACHE[key];
  const out=[], top=scene==='light'?specCss(lam,1):null;
  for(let q=0;q<NLEV;q++){ const f=q/(NLEV-1);
    out.push(scene==='water'?mix(COL.water0,COL.water1,f):(scene==='sound'?mix('#000000','#f2f2f2',f):mix('#000000',top,f))); }
  return LEVEL_CACHE[key]=out;
}
/* the field as colour classes: one fill per class, horizontal runs merged,
   edges snapped to whole pixels so abutting runs leave no seams; light's
   cells the wave has not reached are black (PhET's visited mask) */
function drawField(ctx,sq,R){
  const L=R.lat, pad=L.pad, nx=L.nx, u=L.u, vis=L.vis, light=R.scene==='light';
  const lam=waveLen(SCENES[R.scene],R.f), cols=levelCols(R.scene,lam), cs=sq.w/LAT.VIS;
  ctx.fillStyle=light?'#000000':cols[HALF]; ctx.fillRect(sq.x,sq.y,sq.w,sq.h);
  const rects=[]; for(let q=0;q<NLEV;q++) rects.push([]);
  let nCells=0;
  for(let j=0;j<LAT.VIS;j++){
    const row=(pad+j)*nx+pad, y0=Math.round(sq.y+j*cs), y1=Math.round(sq.y+(j+1)*cs);
    let i=0;
    while(i<LAT.VIS){
      const q=(light&&!vis[row+i])?-1:levelOf(u[row+i]);
      let e=i+1;
      while(e<LAT.VIS&&((light&&!vis[row+e])?-1:levelOf(u[row+e]))===q) e++;
      if(q>=0&&(light||q!==HALF)){ rects[q].push(Math.round(sq.x+i*cs),y0,Math.round(sq.x+e*cs),y1); nCells+=e-i; }
      i=e;
    }
  }
  for(let q=0;q<NLEV;q++){ const r=rects[q]; if(!r.length) continue;
    ctx.beginPath(); for(let k=0;k<r.length;k+=4) ctx.rect(r[k],r[k+1],r[k+2]-r[k],r[k+3]-r[k+1]);
    ctx.fillStyle=cols[q]; ctx.fill(); }
  return nCells;
}
/* PhET's side view (water): the surface along the centre row, the water below */
function drawSide(ctx,sq,R){
  const L=R.lat, pad=L.pad, nx=L.nx, mid=(L.ny-1)/2, cs=sq.w/LAT.VIS;
  const yb=sq.y+0.52*sq.h, hs=0.16*sq.h/U_FULL;
  ctx.fillStyle='#03060d'; ctx.fillRect(sq.x,sq.y,sq.w,sq.h);
  const pts=[[sq.x,sq.y1]];
  for(let i=0;i<LAT.VIS;i++){ const v=clamp(L.u[mid*nx+pad+i],-2.5*U_FULL,2.5*U_FULL); pts.push([sq.x+(i+0.5)*cs,yb-hs*v]); }
  pts.push([sq.x1,sq.y1]);
  ctx.beginPath(); pts.forEach((p,k)=>{ if(k===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); ctx.closePath();
  ctx.fillStyle=mix(COL.water0,'#1d5f96',0.55); ctx.fill();
  ctx.beginPath(); for(let k=1;k<pts.length-1;k++){ if(k===1) ctx.moveTo(pts[k][0],pts[k][1]); else ctx.lineTo(pts[k][0],pts[k][1]); }
  ctx.strokeStyle=COL.water1; ctx.lineWidth=1.6; ctx.stroke();
  /* the dripper over the source and a drop that lands at each crest of the drive */
  const xs=sq.x+(srcCol(L)-pad+0.5)*cs;
  ctx.fillStyle='#6b7285'; ctx.fillRect(xs-9,sq.y+6,18,14); ctx.fillRect(xs-3,sq.y+20,6,8);
  if(R.cont||R.pulse.on){ const ph=((R.phi/TAU)%1+1)%1, yd=sq.y+32+ph*(yb-sq.y-40);
    ctx.beginPath(); ctx.arc(xs,yd,3.2,0,TAU); ctx.fillStyle=COL.water1; ctx.fill(); }
}
/* air parcels on PhET's 21 x 21 grid, pushed along grad p: for one frequency the
   displacement is xi = grad p / (rho omega^2), so parcels crowd where p is high.
   Scaled so the largest push is 0.3 of their spacing. */
function parcelPositions(R){
  const S=SCENES[R.scene], L=R.lat, nx=L.nx, k=TAU/R.Nl, KD=0.3*(LAT.VIS/20)/(k*U_FULL), out=[];
  for(let a=0;a<=20;a++) for(let b=0;b<=20;b++){
    const x=a*S.W/20, y=b*S.W/20, X=cellOfX(R,x), Y=cellOfX(R,y);
    const i=clamp(Math.round(X),1,nx-2), j=clamp(Math.round(Y),1,L.ny-2), q=j*nx+i;
    const gx=(L.u[q+1]-L.u[q-1])/2, gy=(L.u[q+nx]-L.u[q-nx])/2;
    out.push([X+KD*gx,Y+KD*gy]);
  }
  return out;
}
function drawParcels(ctx,sq,R){
  const P=parcelPositions(R), cs=sq.w/LAT.VIS, pad=R.lat.pad;
  ctx.beginPath();
  for(let q=0;q<P.length;q++){ if(q===220) continue;
    const x=sq.x+(P[q][0]-pad+0.5)*cs, y=sq.y+(P[q][1]-pad+0.5)*cs;
    if(x<sq.x||x>sq.x1||y<sq.y||y>sq.y1) continue;
    ctx.moveTo(x+2.1,y); ctx.arc(x,y,2.1,0,TAU); }
  ctx.fillStyle='#d6dae4'; ctx.fill();
  const c=P[220]; dot(ctx,sq.x+(c[0]-pad+0.5)*cs,sq.y+(c[1]-pad+0.5)*cs,3.4,COL.live);
}
function cellX(sq,R,i){ return sq.x+(i-R.lat.pad+0.5)*sq.w/LAT.VIS; }
function modelToPx(sq,S,x,y){ return [sq.x+x/S.W*sq.w, sq.y+y/S.W*sq.h]; }
function drawSources(ctx,sq,R){
  if(R.mode==='plane'){
    ctx.fillStyle=R.plane.on?COL.struct:'#3a4254'; ctx.fillRect(sq.x-9,sq.y,6,sq.h);
    return;
  }
  const rows=runSourceRows(R), cs=sq.w/LAT.VIS;
  rows.forEach((j,s)=>{ const x=cellX(sq,R,srcCol(R.lat)), y=sq.y+(j-R.lat.pad+0.5)*cs, on=R.src[s];
    dot(ctx,x,y,5,on?COL.live:'#3a4254','#ffffff',1.2); });
}
function drawBarrier(ctx,sq,R){
  const P=R.plane; if(P.barrier==='none') return;
  const cs=sq.w/LAT.VIS, x=cellX(sq,R,P.bcol), w=Math.max(4,cs), pad=R.lat.pad;
  let j=pad; ctx.fillStyle=COL.barrier;
  while(j<pad+LAT.VIS){
    if(slitOpen(R,j)){ j++; continue; }
    let e=j+1; while(e<pad+LAT.VIS&&!slitOpen(R,e)) e++;
    ctx.fillRect(x-w/2,sq.y+(j-pad)*cs,w,(e-j)*cs); j=e;
  }
  /* the handle (PhET's green double arrow): drag it to move the barrier */
  const yh=sq.y1+13;
  ctx.beginPath(); ctx.moveTo(x-16,yh); ctx.lineTo(x+16,yh);
  ctx.moveTo(x-16,yh); ctx.lineTo(x-10,yh-4); ctx.moveTo(x-16,yh); ctx.lineTo(x-10,yh+4);
  ctx.moveTo(x+16,yh); ctx.lineTo(x+10,yh-4); ctx.moveTo(x+16,yh); ctx.lineTo(x+10,yh+4);
  ctx.strokeStyle=COL.live; ctx.lineWidth=2; ctx.stroke();
}
function drawTape(ctx,W,H,sq,S,M){
  const a=TOOLS.tape[0], b=TOOLS.tape[1];
  const A=[sq.x+a[0]*sq.w,sq.y+a[1]*sq.h], B=[sq.x+b[0]*sq.w,sq.y+b[1]*sq.h];
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.strokeStyle='#f1e7b0'; ctx.lineWidth=2; ctx.stroke();
  dot(ctx,A[0],A[1],5,COL.live,'#ffffff',1); dot(ctx,B[0],B[1],5,COL.live,'#ffffff',1);
  lab(ctx,W,H,(A[0]+B[0])/2,Math.min(A[1],B[1])-12,lenU(M.tapeLen,S),'#f1e7b0',LAB_FONT,'center');
}
function drawProbes(ctx,sq){
  TOOLS.probes.forEach((p,q)=>{ const x=sq.x+p[0]*sq.w, y=sq.y+p[1]*sq.h, c=q===0?COL.pos:COL.live;
    ctx.beginPath(); ctx.arc(x,y,7,0,TAU); ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke(); dot(ctx,x,y,2,c); });
}
function nodalOverlay(ctx,sq,R,S){
  const rows=runSourceRows(R), dx=sceneDx(S), d=(rows[1]-rows[0])*dx, lam=waveLen(S,R.f);
  const xs0=xOfCell(R,srcCol(R.lat)), yc=S.W/2, n=48;
  let drawn=0;
  /* hyperY is the pinned formula; the drawing never re-derives it */
  for(let m=0;(m+0.5)*lam<d;m++){
    const D=(m+0.5)*lam;
    for(const sg of [1,-1]){
      const xs=[], ys=[];
      for(let q=0;q<=n;q++){ const x=S.W*q/n; xs.push(x); ys.push(yc+sg*hyperY(d,D,x-xs0)); }
      polyline(ctx,sq,xs,ys,0,S.W,S.W,0,COL.ref,1.3,[5,4]); drawn++;
    }
  }
  return drawn;
}
function slitRays(ctx,sq,R,S){
  const P=R.plane; if(P.barrier!=='two') return 0;
  const g=slitCells(R), dx=sceneDx(S), d=g.d*dx, lam=waveLen(S,R.f), xb=xOfCell(R,P.bcol), yc=S.W/2;
  let n=0;
  for(let m=-6;m<=6;m++){ const s=m*lam/d; if(Math.abs(s)>=1) continue;
    const th=Math.asin(s), L=2*S.W; polyline(ctx,sq,[xb,xb+L*Math.cos(th)],[yc,yc+L*Math.sin(th)],0,S.W,S.W,0,COL.ref,1,[3,5]); n++; }
  return n;
}

/* ---- layout for the three lattice views ---- */
function latGeo(ctx,W,H,M){
  const R=M.L.R, light=R.scene==='light', narrow=isNarrow(W), top=stageTop()+30, v=M.view;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-RO_W-44)-56));
  const fit=fitCaption(ctx,W,H-HINT_H,latCaption(M,true),latCaption(M,false),capW,top+220);
  const avail=fit.capY-18-top;
  const showScr=light&&ST.screen, showI=light&&ST.inten;
  let gH=ST.graph?Math.max(64,Math.min(130,Math.round(avail*0.2))):0;
  const gGap=(v==='slits'?50:38);
  /* below the square: the graph and its axis labels, else the intensity graph's
     labels or the barrier's handle — measured, so nothing lands on the caption */
  const below=()=>Math.max(gH?gH+gGap+36:0, showI?38:0, v==='slits'?24:0);
  if(gH&&avail-below()<150) gH=0;               /* no room for the graph at this size: a note says so */
  const rightNeed=(showScr?40:0)+(showI?(narrow?120:190):0);
  const side=Math.max(100,Math.floor(Math.min(avail-below(), W-56-30-rightNeed, narrow?W:W*0.6)));
  const sq=box(56,top,side,side);
  const G={sq,capY:fit.capY,capTxt:fit.txt,capW:fit.capW,narrow};
  let xr=sq.x1+14;
  if(showScr){ G.scr=box(xr,sq.y,22,sq.h); xr+=34; }
  if(showI){ G.ib=box(xr,sq.y,(narrow?100:160),sq.h); xr=G.ib.x1+16; }
  if(ST.graph&&gH) G.gb=box(sq.x,sq.y1+gGap,sq.w,gH);
  G.graphDropped=ST.graph&&!gH;
  /* the wave meter's chart goes below the floating readout (which reaches ~480 px) */
  if(ST.meter&&!narrow){
    const x0=Math.max(xr+44,sq.x1+60), y0=486+24, y1=fit.capY-40;
    if(W-24-x0>=150&&y1-y0>=60) G.mb=box(x0,y0,W-24-x0,y1-y0);
  }
  return G;
}
function latCaption(M,full){
  const L=M.L, R=L.R, S=L.S, v=M.view;
  const what={water:'water level',sound:'pressure',light:'electric field'}[R.scene];
  const base=S.name+': '+fmt(S.W,0)+' '+S.unit+' across, 111 lattice cells of '+sigf(L.dx,3)+' '+S.unit+'; colour is the '+what
    +' (±2.14 in lattice units is full colour, PhET’s scale).';
  if(!full) return base;
  let s=base;
  if(v==='tank') s+=' One source five cells in from the left edge; the waves leave through Mur’s absorbing boundary 20 cells beyond the frame.';
  if(v==='two') s+=' Two in-phase sources '+lenU(L.dEff,S)+' apart on the lattice'+(ST.nodal?'; the dashed orange lines are where r₁ − r₂ = (m + ½)λ':'')+'.';
  if(v==='slits') s+=' A plane wave from the left meets the barrier (drag its arrow)'+(ST.theory&&R.plane.barrier==='two'?'; orange rays are d sin θ = mλ from the midpoint':'')+'.';
  if(R.scene==='light'&&(ST.screen||ST.inten)) s+=' The screen is the last visible column; intensity is its mean square over whole periods'+(ST.theory&&v!=='tank'?', against the Rayleigh–Sommerfeld sum (orange) and the Fraunhofer formula (dashed)':'')+'.';
  if(R.scene==='sound'&&ST.soundView!=='waves') s+=' Air parcels are pushed along ∇p, exaggerated to ≤ 0.3 of their spacing.';
  if(ST.look==='side'&&R.scene==='water') s+=' Side view along the centre row: the height is the water level in lattice units, not to scale with the tank.';
  return s;
}
function drawLatticeView(ctx,W,H,M){
  const G=latGeo(ctx,W,H,M), sq=G.sq, R=M.L.R, S=M.L.S, v=M.view;
  if(R.scene==='water'&&ST.look==='side') drawSide(ctx,sq,R);
  else {
    const showWaves=!(R.scene==='sound'&&ST.soundView==='particles');
    if(showWaves) drawField(ctx,sq,R); else { ctx.fillStyle='#05070c'; ctx.fillRect(sq.x,sq.y,sq.w,sq.h); }
    if(R.scene==='sound'&&ST.soundView!=='waves') drawParcels(ctx,sq,R);
  }
  frame(ctx,sq,'#2a3040');
  if(v==='two'&&ST.nodal&&!(R.scene==='water'&&ST.look==='side')) nodalOverlay(ctx,sq,R,S);
  if(v==='slits'){ drawBarrier(ctx,sq,R); if(ST.theory&&!(R.scene==='water'&&ST.look==='side')) slitRays(ctx,sq,R,S); }
  drawSources(ctx,sq,R);
  /* PhET's scale bar and its time line */
  const sb=S.scaleLen/S.W*sq.w, yb=sq.y-10;
  ctx.fillStyle='#cfd4de'; ctx.fillRect(sq.x,yb-2,sb,3);
  lab(ctx,W,H,sq.x+sb+6,yb,S.scaleLen+' '+S.unit,'#cfd4de',SM_FONT,'left');
  const conv=sq.w<380?'':(S.tunit==='ms'?'  (1 ms = 10⁻³ s)':S.tunit==='fs'?'  (1 fs = 10⁻¹⁵ s)':'');
  lab(ctx,W,H,sq.x1,yb,(ST.running?'':'paused · ')+'t = '+sigf(R.t,3)+' '+S.tunit+conv,'#8b93a6',SM_FONT,'right');
  if(ST.tape) drawTape(ctx,W,H,sq,S,M.L);
  if(ST.meter) drawProbes(ctx,sq);
  if(ST.watch){ const t='stopwatch '+sigf(R.watch.t,4)+' '+S.tunit, tw=t.length*11*0.52+14;
    ctx.fillStyle='rgba(10,12,18,.8)'; ctx.fillRect(sq.x1-tw-6,sq.y+6,tw,20);
    lab(ctx,W,H,sq.x1-tw+1,sq.y+16,t,R.watch.on?COL.pos:'#cfd4de',LAB_FONT,'left'); }
  if(G.scr) drawScreenStrip(ctx,G.scr,M);
  if(G.ib) drawIntensity(ctx,W,H,G.ib,M);
  if(G.gb) drawCentreGraph(ctx,W,H,G.gb,M);
  if(G.mb) drawMeter(ctx,W,H,G.mb,M);
  /* notes on a translucent pad, legible over the field */
  const note=(y,t)=>{ ctx.fillStyle='rgba(7,11,24,.78)'; ctx.fillRect(sq.x+4,y-8,t.length*10.5*0.52+10,16); lab(ctx,W,H,sq.x+8,y,t,'#aeb6c6',SM_FONT,'left'); };
  /* short forms where the tank is narrow, so a note cannot run out past its right edge */
  const tight=sq.w<300;
  if(!G.mb&&ST.meter) note(sq.y1-12,tight?'meter: wider window':'wave meter: widen the window to see its chart');
  if(G.graphDropped) note(sq.y1-(ST.meter&&!G.mb?30:12),tight?'graph: taller window':'centre-line graph: needs a taller window');
  drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW});
  return G;
}
function drawScreenStrip(ctx,b,M){
  const L=M.L, I=L.I, lam=L.lam, rows=I.length, mx=L.Imax>0?L.Imax:1;
  ctx.fillStyle='#000000'; ctx.fillRect(b.x,b.y,b.w,b.h);
  const cs=b.h/rows, groups={};
  for(let r=0;r<rows;r++){ const q=Math.round(20*clamp(I[r]/mx,0,1)); if(q===0) continue; (groups[q]=groups[q]||[]).push(r); }
  for(const q in groups){ ctx.beginPath(); for(const r of groups[q]) ctx.rect(b.x,Math.round(b.y+r*cs),b.w,Math.round(b.y+(r+1)*cs)-Math.round(b.y+r*cs));
    ctx.fillStyle=specCss(lam,q/20); ctx.fill(); }
  frame(ctx,b,'#2a3040');
}
function drawIntensity(ctx,W,H,b,M){
  const L=M.L, I=L.I, S=L.S, rows=I.length, mx=L.Imax>0?L.Imax:1, ys=[], xs=[];
  for(let r=0;r<rows;r++){ ys.push((r+0.5)*S.W/rows); xs.push(I[r]/mx); }
  /* no y ticks: the vertical axis is the lattice's own, row for row */
  axesR(ctx,b,0,1.05,S.W,0,{xticks:[0,0.5,1],yticks:[],xfmt:t=>fmt(t,1),title:'intensity',xlab:'I / its peak'});
  if(L.th){ polyline(ctx,b,Array.from(L.th.far),ys,0,1.05,S.W,0,COL.ref,1.2,[4,3]); polyline(ctx,b,Array.from(L.th.exact),ys,0,1.05,S.W,0,COL.ref,1.4); }
  polyline(ctx,b,xs,ys,0,1.05,S.W,0,COL.pos,1.8);
}
function drawCentreGraph(ctx,W,H,b,M){
  const R=M.L.R, S=M.L.S, Lt=R.lat, mid=(Lt.ny-1)/2, xs=[], ys=[];
  for(let i=0;i<LAT.VIS;i++){ xs.push(xOfCell(R,Lt.pad+i)); ys.push(Lt.u[mid*Lt.nx+Lt.pad+i]); }
  const Y=1.5*U_FULL;
  axesR(ctx,b,0,S.W,-Y,Y,{nx:6,ny:3,xfmt:t=>sigf(t,3),yfmt:t=>fmt(t,1),title:titleFor(b,'the centre line: '+S.what+' along the middle row','the centre line'),xlab:'position, '+S.unit});
  polyline(ctx,b,xs,ys,0,S.W,-Y,Y,COL.pos,1.6);
}
function drawMeter(ctx,W,H,b,M){
  const R=M.L.R, S=M.L.S, tr=R.trace, win=2.5/S.fmin, t1=R.t, t0=Math.max(0,t1-win), Y=1.5*U_FULL;
  axesR(ctx,b,t0,t0+win,-Y,Y,{nx:5,ny:3,xfmt:t=>sigf(t,3),yfmt:t=>fmt(t,1),title:titleFor(b,'wave meter: the two probes against time','wave meter'),xlab:'time, '+S.tunit});
  for(let p=0;p<2;p++){ const xs=[], ys=[];
    for(const s of tr) if(s[0]>=t0&&s.length>p+1){ xs.push(s[0]); ys.push(s[p+1]); }
    polyline(ctx,b,xs,ys,t0,t0+win,-Y,Y,p===0?COL.pos:COL.live,1.5); }
}

/* ================================================================== *
 *  the far field, path difference, the lattice; dispatch; the scene   *
 * ================================================================== */
const AP_HALF=0.5;                                      /* the aperture panel spans +-0.5 mm */
function capsulePoly(ax,ay,bx,by,r,n){
  const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1e-12, a=Math.atan2(dy,dx), pts=[];
  for(let q=0;q<=n;q++){ const t=a-PI/2+PI*q/n; pts.push([bx+r*Math.cos(t),by+r*Math.sin(t)]); }
  for(let q=0;q<=n;q++){ const t=a+PI/2+PI*q/n; pts.push([ax+r*Math.cos(t),ay+r*Math.sin(t)]); }
  return pts;
}
function ellipsePoly(cx,cy,rx,ry,n){ const pts=[]; for(let q=0;q<n;q++){ const t=TAU*q/n; pts.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)]); } return pts; }
function fillPolyPx(ctx,pts,col){ ctx.beginPath(); pts.forEach((p,k)=>{ if(k===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
/* the aperture at its true size (s = 1), as geometry: what the FFT sees, unmagnified */
function drawAperture(ctx,b,P){
  const X=x=>b.x+(x+AP_HALF)/(2*AP_HALF)*b.w, Y=y=>b.y+(y+AP_HALF)/(2*AP_HALF)*b.h, sc=b.w/(2*AP_HALF), open='#eef1f6';
  ctx.fillStyle='#000000'; ctx.fillRect(b.x,b.y,b.w,b.h);
  const id=P.ap;
  if(id==='ellipse'){ const ax=ellipseAxes(P,1); fillPolyPx(ctx,ellipsePoly(X(0),Y(0),ax[0]*sc,ax[1]*sc,72),open); }
  else if(id==='rect'){ ctx.fillStyle=open; ctx.fillRect(X(-P.recW/2),Y(-P.recH/2),P.recW*sc,P.recH*sc); }
  else if(id==='cs'){ const c=26*DIF.PX; fillPolyPx(ctx,ellipsePoly(X(-c),Y(-c),P.csD/2*sc,P.csD/2*sc,60),open);
    ctx.fillStyle=open; ctx.fillRect(X(c-P.csW/2),Y(c-P.csW/2),P.csW*sc,P.csW*sc); }
  else if(id==='disorder'){ const p=P.disP, f=P.disL/4*0.3*p;
    for(let a=0;a<4;a++) for(let q=0;q<4;q++){ const v=DISORDER_V[4*a+q];
      fillPolyPx(ctx,ellipsePoly(X((a-1.5)*p+f*v[0]),Y((q-1.5)*p+f*v[1]),P.disD/2*sc,P.disD/2*sc,36),open); } }
  else if(id==='figure'){ const H=P.figH, rot=P.figR*DEG, co=Math.cos(rot), si=Math.sin(rot);
    const tw=(u,v)=>[X(H*(u*co-v*si)),Y(H*(u*si+v*co))], hd=FIGURE.head;
    const hc=tw(hd[0],hd[1]); fillPolyPx(ctx,ellipsePoly(hc[0],hc[1],hd[2]*H*sc,hd[2]*H*sc,40),open);
    for(const c of FIGURE.caps){ const A=tw(c[0],c[1]), B=tw(c[2],c[3]); fillPolyPx(ctx,capsulePoly(A[0],A[1],B[0],B[1],c[4]*H*sc,10),open); } }
  else if(id==='gauss'){ for(const t of [0.1,0.3,0.5,0.7,0.9]){ const k=Math.sqrt(-2*Math.log(t));
    fillPolyPx(ctx,ellipsePoly(X(0),Y(0),k*P.gauSx*sc,k*P.gauSy*sc,64),mix('#000000',open,t)); } }
  else if(id==='slits'){ const n=Math.round(P.sltN), x0=-(n-1)/2*P.sltD; ctx.fillStyle=open;
    for(let q=0;q<n;q++) ctx.fillRect(X(x0+q*P.sltD-P.sltW/2),Y(-DIF.SLIT_H/2),P.sltW*sc,DIF.SLIT_H*sc); }
  frame(ctx,b,'#2a3040');
}
function patternLevel(F,m){ return ST.farMode==='phet'?phetDisplay(m,F.D.max):(F.D.max>0?(m/F.D.max)*(m/F.D.max):0); }
function drawPattern(ctx,b,F){
  ctx.fillStyle='#000000'; ctx.fillRect(b.x,b.y,b.w,b.h);
  if(!ST.laser){ frame(ctx,b,'#2a3040'); return 0; }
  const n=DIF.N, cs=b.w/n, K=32, top=specCss(ST.lam,1), rects=[]; for(let q=0;q<=K;q++) rects.push([]);
  let cells=0;
  for(let j=0;j<n;j++){ const y0=Math.round(b.y+j*cs), y1=Math.round(b.y+(j+1)*cs); let i=0;
    while(i<n){ const q=Math.round(K*clamp(patternLevel(F,F.D.mag[j*n+i]),0,1)); let e=i+1;
      while(e<n&&Math.round(K*clamp(patternLevel(F,F.D.mag[j*n+e]),0,1))===q) e++;
      if(q>0){ rects[q].push(Math.round(b.x+i*cs),y0,Math.round(b.x+e*cs),y1); cells+=e-i; }
      i=e; } }
  for(let q=1;q<=K;q++){ const r=rects[q]; if(!r.length) continue; ctx.beginPath();
    for(let k=0;k<r.length;k+=4) ctx.rect(r[k],r[k+1],r[k+2]-r[k],r[k+3]-r[k+1]); ctx.fillStyle=mix('#000000',top,q/K); ctx.fill(); }
  frame(ctx,b,'#2a3040');
  return cells;
}
function farGeo(ctx,W,H,M){
  const narrow=isNarrow(W), top=stageTop()+30;

  const fit=fitCaption(ctx,W,H-HINT_H,farCaption(M,true),farCaption(M,false),capW,top+220);
  const avail=fit.capY-18-top, cutH=Math.max(80,Math.min(190,Math.round(avail*0.28)));
  const usable=(narrow?W-26:W-RO_W-44)-56;
  /* the cut plot needs 70 px of its own plus its labels; where the stage is too short for that,
     it is dropped with a note and the two squares take the height instead (narrow-stage mode) */
  const withCut=avail-cutH-78>=90;
  const side=Math.floor(Math.max(90,Math.min(withCut?avail-cutH-78:avail-24,(usable-34)/2)));
  const ap=box(56,top+14,side,side), pat=box(56+side+34,top+14,side,side);

}
function farCaption(M,full){

    +(F.hasAna?'the closed form (orange)':'no closed form for this aperture')+', on a log scale.';
}
