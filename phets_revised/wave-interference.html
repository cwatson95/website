/* ---- path difference ---- */
function pathGeo(ctx,W,H,M){
  const narrow=isNarrow(W), top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-RO_W-44)-56));
  const fit=fitCaption(ctx,W,H-HINT_H,pathCaption(M,true),pathCaption(M,false),capW,top+200);
  const avail=fit.capY-24-top, plotW=narrow?110:170;
  /* 38 px under the map and the plot for the plot's axis labels */
  const mapW=Math.max(140,(narrow?W-26:W-RO_W-44)-56-plotW-40), mapH=Math.max(100,avail-38);
  const mb=box(56,top,mapW,mapH), pb=box(mb.x1+26,top,plotW,mapH);
  /* equal aspect: this is a shape (a family of hyperbolae) */
  const P=M.P, span=Math.max(1.2*P.L, 1.4*P.d*mapW/mapH);
  const x0=-0.1*span, x1=x0+span, halfY=span*mapH/mapW/2;
  return {mb,pb,x0,x1,y0:-halfY,y1:halfY,capY:fit.capY,capTxt:fit.txt,capW:fit.capW};
}
function pathCaption(M,full){
  const P=M.P;
  const base='Two in-phase sources '+fmt(P.d,2)+' λ apart; the screen (magenta) at '+fmt(P.L,1)+' λ. Equal scales on both axes.';
  if(!full) return base;
  return base+' Brightness: the interference factor I/(1/r₁ + 1/r₂) = 1 + 2 cos k(r₁ − r₂) √(r₁r₂)/(r₁ + r₂) of two 2-D cylindrical waves e^(ikr)/√r, so the fading with distance is divided out. '
    +'Orange: the nodal hyperbolae r₁ − r₂ = (m + ½)λ'+(ST.asym?'; dotted: their asymptotes d sin θ = (m + ½)λ':'')+'. Right: the intensity along the screen, exact (green) and Fraunhofer cos²(πd sin θ/λ) (dashed).';
}
function drawPath(ctx,W,H,M){
  const G=pathGeo(ctx,W,H,M), P=M.P, b=G.mb, k=P.k;
  const X=x=>b.x+(x-G.x0)/(G.x1-G.x0)*b.w, Y=y=>b.y+(y-G.y0)/(G.y1-G.y0)*b.h;
  ctx.fillStyle='#05070c'; ctx.fillRect(b.x,b.y,b.w,b.h);
  /* the intensity map, 24 classes, runs merged */
  const nx=Math.min(160,Math.max(40,Math.round(b.w/5))), ny=Math.max(20,Math.round(nx*b.h/b.w)), K=24, rects=[];
  for(let q=0;q<=K;q++) rects.push([]);
  for(let j=0;j<ny;j++){ const y=G.y0+(j+0.5)*(G.y1-G.y0)/ny, py0=Math.round(b.y+j*b.h/ny), py1=Math.round(b.y+(j+1)*b.h/ny);
    let i=0;
    const lev=ii=>{ const x=G.x0+(ii+0.5)*(G.x1-G.x0)/nx; return Math.round(K*clamp(fringeFactor(x,y,P.d,k)/2,0,1)); };
    let q=lev(0);
    while(i<nx){ let e=i+1, q2=0; while(e<nx&&(q2=lev(e))===q) e++;
      if(q>0) rects[q].push(Math.round(b.x+i*b.w/nx),py0,Math.round(b.x+e*b.w/nx),py1);
      i=e; if(i<nx) q=q2; } }
  for(let q=1;q<=K;q++){ const r=rects[q]; if(!r.length) continue; ctx.beginPath();
    for(let t=0;t<r.length;t+=4) ctx.rect(r[t],r[t+1],r[t+2]-r[t],r[t+3]-r[t+1]); ctx.fillStyle=shade(COL.pos,q/K); ctx.fill(); }
  /* hyperbolae and asymptotes */
  const xs=[]; for(let q=0;q<=120;q++) xs.push(G.x0+(G.x1-G.x0)*q/120);
  /* hyperY and farY are the pinned formulas (farY(d, D, x) is the asymptote x tan(theta)) */
  if(ST.hyp) for(const mn of P.mins) for(const sg of [1,-1])
    polyline(ctx,b,xs,xs.map(x=>sg*hyperY(P.d,mn.D,x)),G.x0,G.x1,G.y1,G.y0,COL.ref,1.3,[5,4]);
  if(ST.asym) for(const mn of P.mins) for(const sg of [1,-1])
    polyline(ctx,b,[0,G.x1],[0,sg*farY(P.d,mn.D,G.x1)],G.x0,G.x1,G.y1,G.y0,COL.struct,1,[2,4]);
  /* the screen and the sources */
  polyline(ctx,b,[P.L,P.L],[G.y0,G.y1],G.x0,G.x1,G.y1,G.y0,COL.live,2);
  for(const sg of [-1,1]) dot(ctx,X(0),Y(sg*P.d/2),4.5,'#ffffff');
  lab(ctx,W,H,X(0)+8,Y(-P.d/2)-10,'S₁','#ffffff',LAB_FONT,'left'); lab(ctx,W,H,X(0)+8,Y(P.d/2)+10,'S₂','#ffffff',LAB_FONT,'left');
  frame(ctx,b,'#2a3040');
  /* the screen plot, sharing the map's vertical axis */
  const c=G.pb, ys=[], ex=[], ff=[];
  for(let q=0;q<=300;q++){ const y=G.y0+(G.y1-G.y0)*q/300; ys.push(y); ex.push(twoSourceI(P.L,y,P.d,k)/P.I0); ff.push(twoSourceFar(P.L,y,P.d,k)); }
  axesR(ctx,c,0,1.1,G.y1,G.y0,{xticks:[0,0.5,1],yticks:[],xfmt:t=>fmt(t,1),title:'on the screen',xlab:'I / I(0)'});
  polyline(ctx,c,ff,ys,0,1.1,G.y1,G.y0,COL.ref,1.2,[4,3]);
  polyline(ctx,c,ex,ys,0,1.1,G.y1,G.y0,COL.pos,1.7);
  for(const mn of P.mins) for(const sg of [1,-1]){
    const yy=c.y+(sg*mn.y-G.y0)/(G.y1-G.y0)*c.h, yf=c.y+(sg*mn.yf-G.y0)/(G.y1-G.y0)*c.h;
    if(yy>c.y&&yy<c.y1){ ctx.beginPath(); ctx.moveTo(c.x,yy); ctx.lineTo(c.x+10,yy); ctx.strokeStyle=COL.ref; ctx.lineWidth=2; ctx.stroke(); }
    if(yf>c.y&&yf<c.y1){ ctx.beginPath(); ctx.moveTo(c.x1-10,yf); ctx.lineTo(c.x1,yf); ctx.strokeStyle=COL.struct; ctx.lineWidth=2; ctx.stroke(); } }
  drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW});
  return G;
}

/* ---- the lattice (analysis) ---- */
function latticeGeo(ctx,W,H,M){
  const narrow=isNarrow(W), top=stageTop()+30;
  const capW=Math.max(260,Math.min(W-148,(narrow?W-26:W-RO_W-44)-56));
  const fit=fitCaption(ctx,W,H-HINT_H,narrow?latAnCaption(false):latAnCaption(true),latAnCaption(false),capW,top+220);
  const right=(narrow?W-26:W-RO_W-44), gut=70;
  if(narrow) return {panels:[box(64,top+10,Math.max(120,right-80),Math.max(80,fit.capY-60-top))],capY:fit.capY,capTxt:fit.txt,capW:fit.capW};
  const w1=(right-64-gut)/2, h1=Math.max(90,Math.min(0.42*(fit.capY-top),486-60-top));
  const y2=Math.max(top+h1+74,506), h2=Math.max(80,fit.capY-44-y2), w2=(W-24-64-gut)/2;
  return {panels:[box(64,top+10,w1,h1),box(64+w1+gut,top+10,w1,h1),box(64,y2,w2,h2),box(64+w2+gut,y2,w2,h2)],
          capY:fit.capY,capTxt:fit.txt,capW:fit.capW};
}
function latAnCaption(full){
  const base='PhET’s scheme at C = ½: the dispersion relation (top left), its phase and group speeds (top right)';
  if(!full) return 'The lattice’s dispersion relation at C = ½; the operating point of the chosen medium in magenta.';
  return base+', the reflection off the absorbing edge (bottom left) and the calibration against PhET’s fixed time step (bottom right). The magenta marks are the chosen medium and frequency; shaded bands are the three media’s ranges.';
}
function drawLatticeAnalysis(ctx,W,H,M){
  const G=latticeGeo(ctx,W,H,M), K=M.K, pn=G.panels;
  /* (a) the dispersion relation */
  { const b=pn[0], ks=[], ax=[], dg=[], co=[];
    for(let q=0;q<=160;q++){ const k=PI*q/160; ks.push(k); ax.push(latOmega(k,0)); dg.push(latOmega(k/Math.SQRT2,k/Math.SQRT2)); co.push(LAT.C*k); }
    axesR(ctx,b,0,PI,0,1.2,{nx:5,yticks:[0.3,0.6,0.9,1.2],xfmt:t=>fmt(t,2),yfmt:t=>fmt(t,1),title:titleFor(b,'the dispersion relation, ωΔt against kΔx','ωΔt against kΔx'),xlab:'kΔx (radians per cell)',ylab:'ωΔt'});
    const kmin=TAU/cellsPerWave(K.S,K.S.fmin), kmax=TAU/cellsPerWave(K.S,K.S.fmax);
    ctx.fillStyle=rgba(COL.struct,0.12); ctx.fillRect(b.x+b.w*kmin/PI,b.y,b.w*(kmax-kmin)/PI,b.h);
    polyline(ctx,b,ks,co,0,PI,0,1.2,COL.ref,1.3,[5,4]);
    polyline(ctx,b,ks,dg,0,PI,0,1.2,COL.pos,1.4,[3,3]);
    polyline(ctx,b,ks,ax,0,PI,0,1.2,COL.pos,1.8);
    marker(ctx,b,0,PI,0,1.2,K.k,K.Om,COL.live);
    if(!G.panels[1]) { drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW}); return G; }
    legendAuto(ctx,b,[[COL.pos,'along an axis'],[COL.pos,'diagonal (dashed)'],[COL.ref,'continuum ω = ck']]); }
  /* (b) the speeds against cells per wavelength */
  { const b=pn[1], Ns=[], vp=[], vpd=[], vg=[], vgd=[];
    for(let q=0;q<=120;q++){ const N=Math.pow(10,Math.log10(4)+(Math.log10(100)-Math.log10(4))*q/120), k=TAU/N, Om=omegaStep(N), kd=latK(Om,PI/4);
      Ns.push(Math.log10(N)); vp.push(latPhaseSpeed(k,0)/LAT.C); vg.push(latGroupSpeed(k,0)/LAT.C); vpd.push(latPhaseSpeed(kd,PI/4)/LAT.C); vgd.push(latGroupSpeed(kd,PI/4)/LAT.C); }
    const lx=[Math.log10(4),2];
    axesR(ctx,b,lx[0],lx[1],0.8,1.04,{xticks:[Math.log10(5),1,Math.log10(20),Math.log10(50),2],xfmt:t=>sigf(Math.pow(10,t),2),yticks:[0.8,0.85,0.9,0.95,1],yfmt:t=>fmt(t,2),
      title:titleFor(b,'phase and group speed / c, against cells per wavelength','speeds / c'),xlab:'cells per wavelength (log)'});
    const bands=[];
    for(const id of SCENE_IDS){ const S=SCENES[id], a=Math.log10(cellsPerWave(S,S.fmax)), c=Math.log10(cellsPerWave(S,S.fmin));
      ctx.fillStyle=rgba(COL.struct,id===K.S.id?0.2:0.07); ctx.fillRect(b.x+b.w*(a-lx[0])/(lx[1]-lx[0]),b.y,b.w*(c-a)/(lx[1]-lx[0]),b.h);
      bands.push([b.x+b.w*((a+c)/2-lx[0])/(lx[1]-lx[0]),S.name]); }
    polyline(ctx,b,[lx[0],lx[1]],[1,1],lx[0],lx[1],0.8,1.04,COL.ref,1.2,[5,4]);
    polyline(ctx,b,Ns,vpd,lx[0],lx[1],0.8,1.04,COL.pos,1.3,[3,3]); polyline(ctx,b,Ns,vp,lx[0],lx[1],0.8,1.04,COL.pos,1.8);
    polyline(ctx,b,Ns,vgd,lx[0],lx[1],0.8,1.04,COL.live,1.2,[3,3]); polyline(ctx,b,Ns,vg,lx[0],lx[1],0.8,1.04,COL.live,1.6);
    polyline(ctx,b,[Math.log10(K.Nl),Math.log10(K.Nl)],[0.8,1.04],lx[0],lx[1],0.8,1.04,COL.live,1,[2,3]);
    /* the legend first, registered, so the band names dodge it (legendAuto avoids curves, not labels) */
    const lb=legendAuto(ctx,b,[[COL.pos,'phase (dashed: diagonal)'],[COL.live,'group (dashed: diagonal)']]);
    if(lb) LABELS.push([lb.x,lb.y,lb.x1,lb.y1]);
    for(const [x,t] of bands) if(!lab(ctx,W,H,x,b.y+11,t,'#6f8fa0',SM_FONT,'center')) lab(ctx,W,H,x,b.y1-12,t,'#6f8fa0',SM_FONT,'center'); }
  /* (c) the edge */
  { const b=pn[2], th=[], r1=[], r2=[], rc=[];
    for(let q=0;q<=80;q++){ const a=q*DEG; th.push(q); r1.push(Math.log10(Math.max(1e-6,murReflection(K.k*Math.cos(a),K.k*Math.sin(a),1))));
      r2.push(Math.log10(Math.max(1e-6,murReflection(K.k*Math.cos(a),K.k*Math.sin(a),2)))); rc.push(Math.log10(Math.max(1e-6,(1-Math.cos(a))/(1+Math.cos(a))))); }
    axesR(ctx,b,0,80,-4,0,{nx:8,yticks:[-4,-3,-2,-1,0],yfmt:t=>t===0?'1':'10'+['⁰','⁻¹','⁻²','⁻³','⁻⁴'][-t],xfmt:t=>fmt(t,0)+'°',
      title:titleFor(b,'reflection |R| off the absorbing edge, at '+sigf(K.Nl,3)+' cells per wavelength','edge reflection |R|'),xlab:'angle of incidence'});
    polyline(ctx,b,th,rc,0,80,-4,0,COL.ref,1,[2,4]); polyline(ctx,b,th,r1,0,80,-4,0,COL.ref,1.4,[5,4]); polyline(ctx,b,th,r2,0,80,-4,0,COL.pos,1.8);
    legendAuto(ctx,b,[[COL.pos,'Mur, 2nd order (this engine)'],[COL.ref,'Mur, 1st order (dashed)']]); }
  /* (d) the calibration against PhET's fixed step */
  { const b=pn[3], S=K.S, fs=[], er=[];
    for(let q=0;q<=80;q++){ const f=S.fmin+(S.fmax-S.fmin)*q/80; fs.push(f*S.fMul); er.push(100*(phetLambda(S,f)/waveLen(S,f)-1)); }
    const lo=Math.min(-4,Math.floor(Math.min.apply(null,er))-0.5);
    axesR(ctx,b,S.fmin*S.fMul,S.fmax*S.fMul,lo,1,{nx:5,ny:4,xfmt:t=>sigf(t,3),yfmt:t=>fmt(t,1),
      title:titleFor(b,'wavelength error on the lattice, % ('+S.name+')','λ error, %'),xlab:'frequency, '+S.fUnit});
    polyline(ctx,b,[S.fmin*S.fMul,S.fmax*S.fMul],[0,0],S.fmin*S.fMul,S.fmax*S.fMul,lo,1,COL.pos,1.8);
    polyline(ctx,b,fs,er,S.fmin*S.fMul,S.fmax*S.fMul,lo,1,COL.ref,1.6);
    marker(ctx,b,S.fmin*S.fMul,S.fmax*S.fMul,lo,1,K.f*S.fMul,100*K.phetErr,COL.live);
    legendAuto(ctx,b,[[COL.pos,'this file: step solved per frequency'],[COL.ref,'PhET: one step per medium']]); }
  drawCaption(ctx,{left:56,capY:G.capY,capTxt:G.capTxt,capW:G.capW});
  return G;
}

/* ================================================================== *
 *  dispatch, scene object                                             *
 * ================================================================== */
function drawView(ctx,W,H,M){
  LEGEND_RECTS=[]; POLY_SEGS=[]; LABELS=[];
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  if(M.L) return drawLatticeView(ctx,W,H,M);
  if(M.view==='far') return drawFar(ctx,W,H,M);
  if(M.view==='path') return drawPath(ctx,W,H,M);
  return drawLatticeAnalysis(ctx,W,H,M);
}
function makeScene(canvas){
  const S={st:ST,W:1100,H:712};
  S.model=buildModel;
  S.draw=function(){ const ctx=canvas.getContext('2d'); drawView(ctx,S.W,S.H,buildModel()); };
  /* one frame: only the three lattice views have a clock */
  S.step=function(){ return LATTICE_VIEWS[ST.view]?clockFrame()>0:false; };
  /* the pointer: the tape ends, the probes and the barrier on the lattice views.
     (Path difference has no drag: its map is fitted to L, so a dragged screen
     line would stay put while the map rescaled under it — the slider sets L.) */
  S.pointer=function(type,x,y){
    if(type==='up'){ const had=DRAG.what!==null; DRAG.what=null; return had; }
    const ctx=canvas.getContext('2d');
    if(LATTICE_VIEWS[ST.view]){
      const M=buildModel(), G=latGeo(ctx,S.W,S.H,M), sq=G.sq, R=M.L.R;
      const fx=(x-sq.x)/sq.w, fy=(y-sq.y)/sq.h;
      if(type==='down'){
        const hits=[];
        if(ST.tape) TOOLS.tape.forEach((p,q)=>hits.push(['tape'+q,sq.x+p[0]*sq.w,sq.y+p[1]*sq.h]));
        if(ST.meter) TOOLS.probes.forEach((p,q)=>hits.push(['probe'+q,sq.x+p[0]*sq.w,sq.y+p[1]*sq.h]));
        for(const h2 of hits) if(Math.hypot(x-h2[1],y-h2[2])<10){ DRAG.what=h2[0]; return true; }
        if(ST.view==='slits'&&R.plane.barrier!=='none'){ const xb=cellX(sq,R,R.plane.bcol);
          if(Math.abs(x-xb)<10&&y>=sq.y&&y<=sq.y1+22){ DRAG.what='barrier'; return true; } }
        return false;
      }
      if(type==='move'){
        if(!DRAG.what) return false;
        if(DRAG.what==='barrier'){ const c=clamp(Math.round(R.lat.pad-0.5+fx*LAT.VIS),BCOL_MIN,BCOL_MAX); if(c===ST.bcol) return false; ST.bcol=c; return true; }
        const q=+DRAG.what.slice(-1), arr=DRAG.what.indexOf('tape')===0?TOOLS.tape:TOOLS.probes;
        arr[q]=[clamp(fx,0,1),clamp(fy,0,1)]; return true;
      }
      return false;
    }
    return false;
  };
  return S;
}

const CREDIT='Remake of PhET Interactive Simulations&rsquo; Wave Interference (University of Colorado Boulder, phet.colorado.edu, CC-BY 4.0). New code; no PhET code or assets.';
const DISORDER_NAMES=['none','a little','some','more','lots'];
function boot(){
  const canvas=document.getElementById('scene');
  const panel=document.getElementById('panel');
  const tabsEl=document.getElementById('tabs');
  const roEl=document.getElementById('readout');
  const eqEl=document.getElementById('eqbar');
  const tagEl=document.getElementById('tag');
  const hintEl=document.getElementById('hint');
  const errEl=document.getElementById('errbox');
  const S=makeScene(canvas);
  let dirty=false;

  function fail(e){ errEl.style.display='block'; errEl.textContent=String(e&&e.stack||e); }
  window.addEventListener('error',ev=>fail(ev.error||ev.message));

  function setView(k){
    ST.view=k;
    [].forEach.call(tabsEl.children,(b,i)=>b.className=TABS[i][0]===ST.view?'active':'');
    syncChips(); syncPanel(); dirty=true; refresh();
  }
  TABS.forEach(([k,lab])=>{ tabsEl.appendChild(h('button',{class:ST.view===k?'active':'',onclick:()=>setView(k)},lab)); });

  const rows={};
  function slider(key,lab,lo,hi,step2,fmtf,onchg){
    const inp=h('input',{type:'range',min:lo,max:hi,step:step2,value:ST[key]});
    const val=h('span',{class:'val'});
    const rowEl=h('div',{class:'sliderrow'},h('label',null,lab),inp,val);
    const sync=()=>{ inp.value=ST[key]; val.textContent=plain(fmtf(ST[key])); };
    inp.addEventListener('input',()=>{ ST[key]=parseFloat(inp.value);
      val.textContent=plain(fmtf(ST[key])); if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows[key]={row:rowEl,sync}; sync(); return rowEl;
  }
  function checkbox(key,lab,onchg){
    const inp=h('input',{type:'checkbox'}); inp.checked=ST[key];
    const el=h('label',null,inp,lab);
    inp.addEventListener('change',()=>{ ST[key]=inp.checked; if(onchg) onchg(); syncPanel(); dirty=true; refresh(); });
    rows['cb_'+key]={row:el,sync:()=>{ inp.checked=ST[key]; }};
    return el;
  }
  const CHIPROWS=[];
  function chipRow(list,key,onPick){
    const wrapEl=h('div',{class:'chips'});
    list.forEach(o=>{
      wrapEl.appendChild(h('button',{class:'chip'+(ST[key]===o.id?' on':''),onclick:()=>{
        ST[key]=o.id; if(onPick) onPick(o); syncChips(); syncPanel(); dirty=true; refresh(); }},o.name));
    });
    CHIPROWS.push([wrapEl,list,key]);
    return wrapEl;
  }
  function button(lab,fn){ return h('button',{onclick:()=>{ fn(); syncPanel(); dirty=true; refresh(); }},lab); }
  const cur=()=>RUNS[ST.view]||null;

  /* the medium and the source */
  const gScene=h('div',{class:'grp'},h('h3',null,'the medium'));
  gScene.appendChild(chipRow(SCENE_LIST,'scene'));
  const gSrc=h('div',{class:'grp'},h('h3',null,'the source'));
  const FR={water:[0.005,'drip rate, Hz'],sound:[0.001,'tone, Hz'],light:[0.0005,'frequency, THz']};
  for(const id of SCENE_IDS){ const Sc=SCENES[id];
    gSrc.appendChild(slider('f_'+id,FR[id][1],Sc.fmin,Sc.fmax,FR[id][0],v=>sigf(v*Sc.fMul,4)+(id==='light'?' ('+fmt(Sc.v/v,0)+' nm)':''))); }
  gSrc.appendChild(slider('amp_tank','amplitude',0,10,0.1,v=>fmt(v,1)));
  gSrc.appendChild(slider('amp_two','amplitude, both sources',0,10,0.1,v=>fmt(v,1)));
  gSrc.appendChild(slider('amp_slits','amplitude, plane wave',0,10,0.1,v=>fmt(v,1)));
  const waveChips=chipRow(WAVE_LIST,'wave'); gSrc.appendChild(waveChips);
  const pulseBtn=h('div',{class:'btnrow'},button('fire a pulse',()=>{ const R=syncRun(ST.view); if(R) firePulse(R); }));
  gSrc.appendChild(pulseBtn);
  const srcChecks=h('div',{class:'checks'},checkbox('src1','top source on'),checkbox('src2','bottom source on'));
  gSrc.appendChild(srcChecks);
  const planeCheck=h('div',{class:'checks'},checkbox('planeOn','plane-wave generator on'));
  gSrc.appendChild(planeCheck);
  const srcTag=h('div',{class:'tag'}); gSrc.appendChild(srcTag);

  /* the geometry: the two sources, the barrier */
  const gGeo=h('div',{class:'grp'},h('h3',null,'the geometry'));
  const SEPR={water:[0.05,'separation, cm (water)'],sound:[1,'separation, cm (sound)'],light:[10,'separation, nm']};
  for(const id of SCENE_IDS){ const Sc=SCENES[id];
    gGeo.appendChild(slider('sep_'+id,SEPR[id][1],Sc.sepMin,Sc.sepMax,SEPR[id][0],v=>sigf(v,3)+' '+Sc.unit)); }
  const barrierChips=chipRow(BARRIER_LIST,'barrier'); gGeo.appendChild(barrierChips);
  const WR={water:[0.05,'slit width, cm (water)'],sound:[1,'slit width, cm (sound)'],light:[10,'slit width, nm']};
  const DR={water:[0.05,'slit separation, cm (water)'],sound:[1,'slit separation, cm (sound)'],light:[10,'slit separation, nm']};
  for(const id of SCENE_IDS){ const Sc=SCENES[id];
    gGeo.appendChild(slider('slitW_'+id,WR[id][1],Sc.slitWMin,Sc.slitWMax,WR[id][0],v=>sigf(v,3)+' '+Sc.unit));
    gGeo.appendChild(slider('slitD_'+id,DR[id][1],Sc.slitDMin,Sc.slitDMax,DR[id][0],v=>sigf(v,3)+' '+Sc.unit)); }
  gGeo.appendChild(slider('bcol','barrier position',BCOL_MIN,BCOL_MAX,1,v=>{ const Sc=SCENES[ST.scene]; return sigf((v-LAT.PAD+0.5)*sceneDx(Sc),3)+' '+Sc.unit; }));
  const geoTag=h('div',{class:'tag'}); gGeo.appendChild(geoTag);

  /* what to show */
  const gShow=h('div',{class:'grp'},h('h3',null,'what to show'));
  const lookChips=chipRow(SIDE_LIST,'look'); gShow.appendChild(lookChips);
  const soundChips=chipRow(SOUNDVIEW_LIST,'soundView'); gShow.appendChild(soundChips);
  const lightChecks=h('div',{class:'checks'},checkbox('screen','screen'),checkbox('inten','intensity graph'));
  gShow.appendChild(lightChecks);
  const showChecks=h('div',{class:'checks'},checkbox('graph','graph of the centre line'),checkbox('nodal','nodal lines (r₁ − r₂ = (m + ½)λ)'),
    checkbox('theory','theory: Rayleigh–Sommerfeld and Fraunhofer'));
  gShow.appendChild(showChecks);

  /* the tools */
  const gTools=h('div',{class:'grp'},h('h3',null,'tools'));
  gTools.appendChild(h('div',{class:'checks'},checkbox('tape','tape measure'),checkbox('watch','stopwatch'),checkbox('meter','wave meter')));
  const watchBtns=h('div',{class:'btnrow'},
    button('start / stop the stopwatch',()=>{ const R=cur(); if(R) R.watch.on=!R.watch.on; }),
    button('zero the stopwatch',()=>{ const R=cur(); if(R){ R.watch.t=0; } }));
  gTools.appendChild(watchBtns);
  const toolTag=h('div',{class:'tag'}); gTools.appendChild(toolTag);

  /* time */
  const gTime=h('div',{class:'grp'},h('h3',null,'time'));
  gTime.appendChild(chipRow(SPEED_LIST,'speed'));
  gTime.appendChild(h('div',{class:'checks'},checkbox('running','time runs')));
  gTime.appendChild(h('div',{class:'btnrow'},
    button('one step',()=>{ const R=syncRun(ST.view); if(R) runStep(R); }),
    button('clear the waves',()=>{ const R=syncRun(ST.view); if(R) runClear(R); })));
  const timeTag=h('div',{class:'tag'}); gTime.appendChild(timeTag);

  /* the far field */
  const gFar=h('div',{class:'grp'},h('h3',null,'the aperture and the laser'));
  gFar.appendChild(h('div',{class:'checks'},checkbox('laser','laser on')));
  gFar.appendChild(slider('lam','wavelength, nm',DIF.LAMMIN,DIF.LAMMAX,1,v=>fmt(v,0)+' nm'));
  gFar.appendChild(chipRow(AP_LIST,'ap'));
  const mm=v=>fmt(v,3)+' mm', R2=SLIDER_RANGE;
  const fsl=(k,lab,step2,f)=>gFar.appendChild(slider(k,lab,R2[k][0],R2[k][1],step2,f));
  fsl('ellD','diameter',0.005,mm); fsl('ellE','eccentricity',0.01,v=>fmt(v,2));
  fsl('recW','width',0.005,mm); fsl('recH','height',0.005,mm);
  fsl('csD','circle diameter',0.005,mm); fsl('csW','square width',0.005,mm);
  fsl('disD','circle diameter, disorder',0.005,mm); fsl('disP','lattice spacing',0.005,mm);
  fsl('disL','disorder',1,v=>DISORDER_NAMES[Math.round(v)]);
  fsl('figH','figure height',0.005,mm); fsl('figR','rotation',1,v=>fmt(v,0)+'°');
  fsl('gauSx','σ across',0.001,mm); fsl('gauSy','σ up',0.001,mm);
  fsl('sltN','number of slits',1,v=>fmt(v,0));
  fsl('sltW','slit width, far field',0.005,mm); fsl('sltD','slit separation, far field',0.005,mm);
  gFar.appendChild(chipRow(FARMODE_LIST,'farMode'));
  const farTag=h('div',{class:'tag'}); gFar.appendChild(farTag);

  /* path difference */
  const gPath=h('div',{class:'grp'},h('h3',null,'two sources, in wavelengths'));
  gPath.appendChild(slider('pd','separation d / λ',0.3,8,0.05,v=>fmt(v,2)));
  gPath.appendChild(slider('pL','screen distance L / λ',1,60,0.5,v=>fmt(v,1)));
  gPath.appendChild(h('div',{class:'checks'},checkbox('hyp','nodal hyperbolae'),checkbox('asym','their asymptotes')));

  /* the lattice */
  const gLat=h('div',{class:'grp'},h('h3',null,'the lattice'));
  gLat.appendChild(slider('latTh','direction θ for the readout',0,45,1,v=>fmt(v,0)+'°'));

  const gRun=h('div',{class:'grp'},h('div',{class:'btnrow'},
    button('reset all',()=>{ const v=ST.view; Object.assign(ST,DEFAULTS); ST.view=v;
      TOOLS.tape=JSON.parse(JSON.stringify(TOOLS0.tape)); TOOLS.probes=JSON.parse(JSON.stringify(TOOLS0.probes));
      resetRuns(); syncChips(); })));

  const gInfo=h('div',{class:'grp'},h('h3',null,'what you are looking at'),h('div',{id:'info'}),
    h('div',{class:'src',html:CREDIT+' Measured: nothing — every number is PhET&rsquo;s (read from the minified original, cited as PhET&rsquo;s values in the header) or exact and pinned to build/wave-interference/derive.py (numpy twin, scipy). Colour: the CIE 1931 table.'}));
  const gPhys=h('div',{class:'grp'},h('h3',null,'the physics'),h('div',{id:'phys'}));
  [gScene,gSrc,gGeo,gShow,gTools,gTime,gFar,gPath,gLat,gRun,gInfo,gPhys].forEach(g=>panel.appendChild(g));
  const infoEl=gInfo.querySelector('#info'), physEl=gPhys.querySelector('#phys');

  function syncChips(){
    for(const [w,list,key] of CHIPROWS) [].forEach.call(w.children,(b,i)=>b.className='chip'+(list[i].id===ST[key]?' on':''));
  }
  function syncPanel(){
    const v=ST.view, lat=!!LATTICE_VIEWS[v], sc=ST.scene;
    gScene.hidden=!(lat||v==='lattice');
    gSrc.hidden=!(lat||v==='lattice');
    for(const id of SCENE_IDS) rows['f_'+id].row.hidden=(id!==sc);
    for(const w of ['tank','two','slits']) rows['amp_'+w].row.hidden=(w!==v);
    waveChips.hidden=!(v==='tank'||v==='two');
    pulseBtn.hidden=!((v==='tank'||v==='two')&&ST.wave==='pulse');
    srcChecks.hidden=(v!=='two'); planeCheck.hidden=(v!=='slits'); srcTag.hidden=(v==='lattice');
    gGeo.hidden=!(v==='two'||v==='slits');
    for(const id of SCENE_IDS){ rows['sep_'+id].row.hidden=!(v==='two'&&id===sc);
      rows['slitW_'+id].row.hidden=!(v==='slits'&&id===sc&&ST.barrier!=='none');
      rows['slitD_'+id].row.hidden=!(v==='slits'&&id===sc&&ST.barrier==='two'); }
    barrierChips.hidden=(v!=='slits'); rows.bcol.row.hidden=!(v==='slits'&&ST.barrier!=='none');
    gShow.hidden=!lat;
    lookChips.hidden=!(lat&&sc==='water'); soundChips.hidden=!(lat&&sc==='sound'); lightChecks.hidden=!(lat&&sc==='light');
    rows.cb_nodal.row.hidden=(v!=='two'); rows.cb_theory.row.hidden=!(v==='two'||v==='slits');
    gTools.hidden=!lat; gTime.hidden=!lat;
    gFar.hidden=(v!=='far');
    const ap=ST.ap, show=(k,on)=>{ rows[k].row.hidden=!on; };
    show('ellD',ap==='ellipse'); show('ellE',ap==='ellipse'); show('recW',ap==='rect'); show('recH',ap==='rect');
    show('csD',ap==='cs'); show('csW',ap==='cs'); show('disD',ap==='disorder'); show('disP',ap==='disorder'); show('disL',ap==='disorder');
    show('figH',ap==='figure'); show('figR',ap==='figure'); show('gauSx',ap==='gauss'); show('gauSy',ap==='gauss');
    show('sltN',ap==='slits'); show('sltW',ap==='slits'); show('sltD',ap==='slits');
    gPath.hidden=(v!=='path'); gLat.hidden=(v!=='lattice');
    for(const k in rows) rows[k].sync();
    const R=cur();
    srcTag.innerHTML=v==='slits'?'PhET&rsquo;s plane wave: 0.21 &times; the amplitude, set on every cell left of the barrier'
      :(ST.wave==='pulse'?'a pulse is one period of the drive, then the source lets go':'the source cell is driven at 1.2 &times; the amplitude (PhET&rsquo;s values)');
    geoTag.innerHTML=v==='two'?'the sources sit on whole cells: the separation used is the nearest even number of cells'
      :'drag the barrier by its arrow; slits are the cells whose centres lie inside them';
    toolTag.innerHTML='drag the tape&rsquo;s ends and the probes on the picture'+(R&&ST.watch?(R.watch.on?' &middot; the stopwatch is running':' &middot; the stopwatch is stopped'):'');
    timeTag.innerHTML='space runs/pauses &nbsp; <b>r</b> clears the waves &nbsp; <b>p</b> fires a pulse &nbsp; 1&ndash;6 switch views';
    farTag.innerHTML=APERTURES.find(a=>a.id===ap).phet?(ap==='figure'?'PhET&rsquo;s waving girl is a photograph; this is a drawn figure':'one of PhET&rsquo;s five apertures')
      :'not in PhET: added for the closed-form check';
  }
  function refresh(){
    try{
      const M=S.model();
      roEl.innerHTML=readoutHTML(M); eqEl.innerHTML=eqbarHTML(M); tagEl.innerHTML=tagHTML(M);
      hintEl.textContent=LATTICE_VIEWS[ST.view]?'space pauses · r clears · drag the tools · 1–6 switch views':'1–6 switch views';
      infoEl.innerHTML=INFO[ST.view]||''; physEl.innerHTML=DERIV[ST.view]||'';
      S.draw();
    }catch(e){ fail(e); }
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    if(S.pointer('down',e.clientX-r.left,e.clientY-r.top)){ canvas.classList.add('dragging'); dirty=true; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!canvas.classList.contains('dragging')&&e.buttons===0) return;
    const r=canvas.getBoundingClientRect();
    if(S.pointer('move',e.clientX-r.left,e.clientY-r.top)){ dirty=true; syncPanel(); roEl.innerHTML=readoutHTML(S.model()); }
  });
  const up=()=>{ canvas.classList.remove('dragging'); if(S.pointer('up',0,0)){ dirty=true; refresh(); } };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  window.addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); ST.running=!ST.running; syncPanel(); dirty=true; refresh(); }
    else if(e.key==='r'){ const R=syncRun(ST.view); if(R){ runClear(R); dirty=true; refresh(); } }
    else if(e.key==='p'){ const R=syncRun(ST.view); if(R&&firePulse(R)){ dirty=true; refresh(); } }
    else if(e.key>='1'&&e.key<=String(TABS.length)) setView(TABS[+e.key-1][0]);
  });

  function resize(){
    const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    S.W=r.width; S.H=r.height;
  }
  window.addEventListener('resize',()=>{ resize(); dirty=true; refresh(); });

  let frameN=0;
  function frameLoop(){
    frameN++;
    let advanced=false;
    try{ advanced=S.step(); }catch(e){ fail(e); }
    if(advanced||dirty){
      dirty=false;
      try{ S.draw(); if(advanced&&frameN%10===0){ const M=S.model(); roEl.innerHTML=readoutHTML(M); tagEl.innerHTML=tagHTML(M); } }catch(e){ fail(e); }
    }
    requestAnimationFrame(frameLoop);
  }
  resize(); syncChips(); syncPanel(); refresh(); requestAnimationFrame(frameLoop);
  return S;
}

const INFO={
  tank:'A ripple tank seen from above. A single source moves one cell of a 151 × 151 lattice up and down, and every other cell obeys the wave equation in its simplest discrete form: each step it accelerates toward the average of its four neighbours. That rule alone makes circular ripples spread from the source at a fixed speed, fading as 1/√r because their energy spreads round a growing circle. Choose water, sound or light: the lattice is the same, only the ruler and the clock change — 10 cm and seconds, 5 m and milliseconds, 5 µm and femtoseconds. Raise the frequency and the rings crowd together, because the speed is fixed and v = fλ. The tape measure, stopwatch and wave meter are there to check exactly that: measure a wavelength, time a period, multiply. For water, the side view shows the surface along the middle row; for sound, the air parcels crowd where the pressure is high; for light, the screen at the right edge collects the brightness.',
  two:'Two sources driven in step. Wherever the waves arrive together they add; wherever one arrives half a wavelength behind the other they cancel. The cancellation lines are the nodal lines, and each is a curve along which the path difference r₁ − r₂ is fixed at (m + ½)λ — a hyperbola with the two sources as its foci (dashed orange, drawn from the formula, not found in the picture). The lattice’s own nodal lines sit up to a cell or so outside them: a wave crossing the lattice obliquely has a slightly longer wavelength than one along an axis, and the two sources see each point at slightly different angles. Far away every hyperbola straightens into its asymptote, d sin θ = (m + ½)λ, which is the formula in the textbooks. Move the sources apart or raise the frequency and more nodal lines appear: one pair for every wavelength that fits into the separation. With light, the screen shows the fringes and the intensity graph compares them with the exact two-source formula.',
  slits:'A plane wave arrives from the left and meets a barrier. Only what passes the slits goes on, and — as Huygens said — every open cell of a slit acts as a new source. One slit spreads the light into a central band with dark bands at a sin θ = mλ; two slits add the two-source fringes inside that envelope, bright at d sin θ = mλ. The textbook formulas are far-field results and need the screen to be far compared with d²/λ. PhET’s light screen is not: at the default settings it sits about 2.5 µm behind slits 1.5 µm apart, where d²/λ is 4.4 µm. The intensity graph therefore compares the lattice with two predictions — the full Rayleigh–Sommerfeld sum over the open cells (solid orange), which the lattice follows to a few per cent, and the Fraunhofer formula (dashed), which it does not.',
  far:'The Fraunhofer, or far-field, pattern of an aperture is its two-dimensional Fourier transform, and that is how PhET computes it: a 256 × 256 picture of the aperture, a fast Fourier transform, the magnitude. Everything about diffraction is in that one sentence. A small hole makes a wide pattern; a circle makes the Airy rings, with the first dark ring at 1.22 λ/D; a rectangle makes a cross of sinc² fringes, wider along its narrow side; rotating the aperture rotates the pattern; a lattice of holes makes sharp spots, and disordering the lattice washes them into a halo whose shape is the pattern of a single hole. To keep one angular scale for every colour, PhET redraws the aperture magnified by λ₀/λ before the transform; the cut below the pictures is checked against the closed forms — Airy for the disc, sinc² for the rectangle, the Gaussian’s own transform — and the transform against a direct sum.',
  path:'The geometry behind the two-source pattern, with the wave equation taken out. A point in the plane is r₁ from one source and r₂ from the other; the waves arrive in antiphase where r₁ − r₂ is an odd number of half-wavelengths. A curve of constant difference in distance from two points is a hyperbola with those points as foci, so every nodal line is a hyperbola. Close to the sources the hyperbolae bend round them; far away each runs straight out along its asymptote, sin θ = Δ/d. That is why the far-field formula d sin θ = (m + ½)λ is only true far away: on a screen at distance L, the exact minima sit further out than the far-field ones by about ab/2L, and the difference matters when L is not large compared with d²/λ.',
  lattice:'Everything the first three views show rests on one rule — each cell moves toward the average of its neighbours — and this view shows what that rule does to a wave. On a lattice a wave with k cells per radian does not travel at exactly c: short waves lag, and they lag differently along the axes and along the diagonals. The dispersion relation sin²(ωΔt/2) = C²[sin²(kₓΔx/2) + sin²(k_yΔx/2)] says exactly how. PhET fixes one time step per medium, so its wavelengths come out 0.7 % to 3.2 % short; here the time step is solved from this relation at every frequency, so the wavelength and the period are exact along the lattice axes, and the residual error along the diagonals is the number printed in the readout. The edge of the lattice has to swallow waves rather than reflect them: Mur’s second-order boundary does it to 3 % up to 45°.'
};
function FR(t,b){ return '<span class="frac"><span class="t">'+t+'</span><span class="b">'+b+'</span></span>'; }
function EQ(n,body){ return '<div class="eq"><span class="n">['+n+']</span>'+body+'</div>'; }
const DERIV={
  tank:'<h4>the lattice and its clock</h4>'

/* ================================================================== *
 *  makeShot — the selfTest recording context (text boxes through     *
 *  the transform, fill counts), from build_buoy/p7_test.js by name,  *
 *  unchanged (make_helpers.py)                                       *
 * ================================================================== */
function makeShot(W,H){
  const ops=[]; let Mx=[1,0,0,1,0,0]; const stack=[];
  const st2={font:'10px x',align:'left',base:'alphabetic'};
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
                    A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  const app=(x,y)=>[Mx[0]*x+Mx[2]*y+Mx[4],Mx[1]*x+Mx[3]*y+Mx[5]];
  const fsz=()=>{ const m=/([\d.]+)px/.exec(st2.font); return m?parseFloat(m[1]):10; };
  let pend=null;
  const ctx={ops,
    save(){ stack.push({M:Mx.slice(),f:st2.font,a:st2.align,b:st2.base}); },
    restore(){ const s=stack.pop(); if(s){ Mx=s.M; st2.font=s.f; st2.align=s.a; st2.base=s.b; } },
    translate(x,y){ Mx=mul(Mx,[1,0,0,1,x,y]); },
    rotate(r){ const c=Math.cos(r),s3=Math.sin(r); Mx=mul(Mx,[c,s3,-s3,c,0,0]); },
    scale(x,y){ Mx=mul(Mx,[x,0,0,y,0,0]); }, setTransform(){ Mx=[1,0,0,1,0,0]; },
    beginPath(){ pend=null; }, moveTo(){}, lineTo(){ if(!pend) pend={n:0}; }, closePath(){},
    rect(){ if(!pend) pend={n:0}; pend.n++; }, arc(){ if(!pend) pend={n:0}; pend.n++; },
    fill(){ if(pend) ops.push({op:'fill',n:pend.n||1}); },
    stroke(){ ops.push({op:'stroke'}); }, clip(){},
    fillRect(x,y,w,hh){ ops.push({op:'fill',n:1,bb:[x,y,x+w,y+hh],style:ctx.fillStyle}); },
    strokeRect(){ ops.push({op:'stroke'}); }, clearRect(){},
    fillText(t,x,y){
      const w=(''+t).length*fsz()*0.52, fh=fsz()*1.15;
      const lx=st2.align==='center'?x-w/2:(st2.align==='right'?x-w:x);
      const ly=st2.base==='top'?y:(st2.base==='middle'?y-fh/2:(st2.base==='bottom'?y-fh:y-fh*0.8));
      const cs=[[lx,ly],[lx+w,ly],[lx,ly+fh],[lx+w,ly+fh]].map(c2=>app(c2[0],c2[1]));
      const xs=cs.map(c2=>c2[0]), ys=cs.map(c2=>c2[1]);
      ops.push({op:'text',t:''+t,bb:[Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)]});
    },
    strokeText(){}, setLineDash(){},
    measureText(t){ return {width:(''+t).length*fsz()*0.52}; },
    createLinearGradient(){ return {addColorStop(){}}; },
  };
  let _fill='#000';
  Object.defineProperty(ctx,'fillStyle',{get:()=>_fill,set:v=>_fill=''+v});
  for(const kk of ['strokeStyle','lineWidth','globalAlpha','lineJoin','lineCap']){ let v2; Object.defineProperty(ctx,kk,{get:()=>v2,set:x=>v2=x}); }
  Object.defineProperty(ctx,'font',{get:()=>st2.font,set:v=>st2.font=''+v});
  Object.defineProperty(ctx,'textAlign',{get:()=>st2.align,set:v=>st2.align=''+v});
  Object.defineProperty(ctx,'textBaseline',{get:()=>st2.base,set:v=>st2.base=''+v});
  return ctx;
}

/* ================================================================== *
 *  selfTest — headless verification.  Every reference is a line of    *
 *  build/wave-interference/refvals.txt (derive.py's output, read in   *
 *  full), carried here in REF under its printed label: (twin) = the   *
 *  numpy repeat of the engine, (scipy)/(python) = computed outside.   *
 * ================================================================== */
const TEST_APS={ellipse_default:['ellipse',DIF.LAM0,{ellD:0.1,ellE:0}], ellipse_e08_650:['ellipse',650,{ellD:0.2,ellE:0.8}],
  rect_450:['rect',450,{recW:0.1,recH:0.2}], cs_default:['cs',DIF.LAM0,{csD:0.05,csW:0.05}],
  disorder_L2:['disorder',DIF.LAM0,{disD:0.05,disP:0.1,disL:2}], figure_600:['figure',600,{figH:0.2,figR:30}],
  gauss_default:['gauss',DIF.LAM0,{gauSx:0.03,gauSy:0.02}], slits_2:['slits',DIF.LAM0,{sltN:2,sltW:0.03,sltD:0.1}]};
function selfTest(){
  let pass=0,fail=0;
  const ok=(c,name)=>{ if(c) pass++; else { fail++; console.log('FAIL — '+name); } };
  const eq=(a,b,name)=>ok(a===b,name+' ['+a+' vs '+b+']');
  const close=(a,b,tol,name)=>ok(Math.abs(a-b)<=tol,name+' ['+a+' vs '+b+']');
  const rel=(a,b,t,name)=>ok(Math.abs(a-b)<=t*Math.abs(b||1),name+' ['+a+' vs '+b+', rel '+(Math.abs(a-b)/Math.abs(b||1)).toExponential(2)+']');
  const T0=Date.now();
  const refs=pre=>Object.keys(REF).filter(k=>k.indexOf(pre)===0);
  const num=(k,re)=>{ const m=re.exec(k); if(!m) throw new Error('label '+k); return m.slice(1).map(Number); };
  function ref(label,i){ const v=REF[label]; if(!v) throw new Error('no reference line "'+label+'"'); return v[i||0]; }
  const stSave=Object.assign({},ST);

  /* ---------- A. PhET's constants and the calibration (python) ---------- */
  rel(LAT.EVENT_RATE,ref('EVENT_RATE'),1e-15,'PhET event rate 20*111/61 (python)');
  rel(MUR1,ref('MUR1 MUR2A MUR2B',0),1e-15,'Mur 1st-order coefficient -1/3'); rel(MUR2A,ref('MUR1 MUR2A MUR2B',1),1e-15,'Mur 2/(C+1)'); rel(MUR2B,ref('MUR1 MUR2A MUR2B',2),1e-15,'Mur C^2/2(C+1)');
  eq(LAT.VIS,LAT.N-2*LAT.PAD,'111 visible cells = 151 - 2 x 20');
  let nCal=0;
  for(const id of SCENE_IDS){ const S=SCENES[id];
    rel(sceneDx(S),ref(id+' dx f0 lambda0',0),1e-15,id+' dx (python)'); rel(sceneF0(S),ref(id+' dx f0 lambda0',1),1e-15,id+' default f, mid-range (python)');
    rel(waveLen(S,sceneF0(S)),ref(id+' dx f0 lambda0',2),1e-14,id+' default wavelength (python)');
    for(const tag of ['fmin','f0','fmax']){ const k='  '+id+' '+tag+' f Nl Om dt period_steps', f=ref(k,0);
      rel(cellsPerWave(S,f),ref(k,1),1e-14,id+' '+tag+' cells per wavelength (python)'); rel(omegaStep(cellsPerWave(S,f)),ref(k,2),1e-14,id+' '+tag+' radians per step (python)');
      rel(stepDt(S,f),ref(k,3),1e-14,id+' '+tag+' time per step (python)'); rel(TAU/omegaStep(cellsPerWave(S,f)),ref(k,4),1e-14,id+' '+tag+' steps per period (python)');
      const kp='  '+id+' '+tag+' PhET lambda, PhET/true - 1';
      rel(phetLambda(S,f),ref(kp,0),1e-12,id+' '+tag+': PhET’s fixed step gives this wavelength (python)'); close(phetLambda(S,f)/waveLen(S,f)-1,ref(kp,1),1e-12,id+' '+tag+' PhET’s wavelength error'); nCal++; } }
  eq(nCal,9,'all nine calibration points checked');
  rel(SCENES.light.v/sceneF0(SCENES.light),DIF.LAM0,1e-14,'the light scene’s default wavelength IS the diffraction screen’s lambda0 = 511.034 nm');
  /* the calibration's claim, directly: sin(Om/2) = C sin(pi/Nl) is the axial dispersion relation */
  for(const id of SCENE_IDS){ const S=SCENES[id], f=0.37*S.fmin+0.63*S.fmax, Nl=cellsPerWave(S,f);
    close(latOmega(TAU/Nl,0),omegaStep(Nl),1e-15,id+': the solved step lies on the dispersion relation');
    rel(latK(omegaStep(Nl),0)*Nl,TAU,1e-12,id+': and inverts to exactly Nl cells per wavelength'); }

  /* ---------- B. the dispersion relation (python) ---------- */
  for(const k of refs('latOmega ')){ const a=num(k,/^latOmega (\S+) (\S+)$/); rel(latOmega(a[0],a[1]),ref(k),1e-14,k+' (python)'); }
  close(latOmega(PI,PI),PI/2,1e-15,'the highest frequency 2 asin(C sqrt 2) = pi/2 at C = 1/2, inside stability (2C^2 = 1/2 <= 1)');

  { /* the far-field cache follows the chosen aperture's own parameters */
    Object.assign(ST,DEFAULTS,{view:'far'}); const a0=farModel().open; ST.ellE=0.9; const a1=farModel().open;
    ok(a1<0.5*a0,'eccentricity 0.9 re-renders a thinner ellipse ('+fmt(a0,1)+' -> '+fmt(a1,1)+' px)');
    ST.recW=0.3; ok(farModel().open===a1,'a hidden rectangle slider does not re-render the ellipse'); Object.assign(ST,stSave); }

  /* ---------- I. colour (python, the CIE table) ---------- */
  eq(CIE1931.length,ref('CIE rows written'),'81 CIE rows, 380..780 nm every 5 (the CIE file)');
  for(const k of refs('specLinear(')){ const nm=num(k,/^specLinear\((\S+)\)$/)[0], c=specLinear(nm);
    for(let q=0;q<3;q++) close(c[q],ref(k,q),1e-12,k+' channel '+q+' (python)'); }
  { const w=[0.95047,1,1.08883], r=SRGB_M.map(row=>row[0]*w[0]+row[1]*w[1]+row[2]*w[2]);
    for(const v of r) close(v,1,2e-4,'the sRGB matrix takes D65 white to (1,1,1)'); }
  ok(/^rgb\(\d+,\d+,\d+\)$/.test(specCss(550,0.5)),'specCss is well formed');
  { const g=specCss(550,1).match(/\d+/g).map(Number); ok(g[1]>=250&&g[0]<100,'550 nm is green (brightness checked, not just syntax)');
    const r=specCss(650,1).match(/\d+/g).map(Number); ok(r[0]>=250&&r[1]<60,'650 nm is red');
    const z=specCss(650,0).match(/\d+/g).map(Number); ok(z[0]+z[1]+z[2]===0,'zero intensity is black'); }

  /* ---------- J. the runs, the clock, the controls' effect on the engine ---------- */
  { Object.assign(ST,DEFAULTS); resetRuns();
    ST.view='tank'; runFor('tank',100); const R=RUNS.tank; const e1=R.lat.u.reduce((a,v)=>a+v*v,0); ok(e1>1,'the tank has waves after 100 steps');
    ST.f_water=0.8; syncRun('tank'); ok(R.lat.u.reduce((a,v)=>a+v*v,0)===e1,'a new water frequency keeps the waves (PhET)'); close(R.f,0.8,0,'and takes the frequency');
    ST.scene='light'; syncRun('tank'); ok(R.scene==='light'&&R.lat.u.every(v=>v===0),'a new medium clears the lattice'); ok(R.t===0&&R.n===0,'and restarts its clock (new units)');
    runFor('tank',30); ST.f_light=0.5; syncRun('tank'); ok(R.lat.u.every(v=>v===0),'a new light frequency clears (PhET)');
    ST.scene='light'; ST.view='slits'; ST.barrier='two'; runFor('slits',120); const Rs=RUNS.slits, m0=Rs.plane.m;
    const left=Rs.lat.u[75*Rs.lat.nx+40]; ok(left!==0,'the plane wave is on the left of the barrier');
    ST.bcol=90; syncRun('slits'); ok(Rs.plane.m===m0&&Rs.lat.u[75*Rs.lat.nx+40]===left,'moving the barrier keeps the plane wave’s progress (PhET clearRight)');
    let right=0; for(let j=0;j<Rs.lat.ny;j++) for(let i=90;i<Rs.lat.nx;i++) right+=Math.abs(Rs.lat.u[j*Rs.lat.nx+i]); ok(right===0,'and wipes everything from the new barrier rightward');
    ST.slitW_light=800; syncRun('slits'); ok(Rs.plane.m===0,'a new slit width clears and restarts the plane wave');
    /* two sources stay in phase */
    ST.view='two'; ST.scene='water'; const R2=syncRun('two'); runFor('two',10); ST.src1=false; syncRun('two'); ST.src1=true; syncRun('two');
    ok(R2.phi>0,'switching one source back on while the other runs keeps the phase'); ST.src1=false; ST.src2=false; syncRun('two'); ST.src2=true; syncRun('two');
    close(R2.phi,0,0,'switching a source on alone restarts the phase at zero');
    /* the clock: PhET's 20 x 111/61 steps per second of wall time */
    Object.assign(ST,DEFAULTS); resetRuns(); ST.view='tank'; CLOCK.acc=0; let n1=0; for(let f=0;f<600;f++) n1+=clockFrame();
    ok(Math.abs(n1-600*FRAME_DT*LAT.EVENT_RATE)<1,'ten seconds at normal speed take 364 steps ('+n1+')');
    ST.speed='slow'; CLOCK.acc=0; let n2=0; for(let f=0;f<600;f++) n2+=clockFrame(); ok(Math.abs(n2-300*FRAME_DT*LAT.EVENT_RATE)<1,'slow takes half ('+n2+')');
    ST.running=false; eq(clockFrame(),0,'paused: no steps'); ST.view='far'; ST.running=true; eq(clockFrame(),0,'the far field has no clock');
    Object.assign(ST,stSave); resetRuns(); }
  { /* the stopwatch and the probes ride the run */
    Object.assign(ST,DEFAULTS); resetRuns(); ST.view='tank'; ST.meter=true; const R=syncRun('tank'); R.watch.on=true; runFor('tank',50);
    rel(R.watch.t,50*R.dt,1e-12,'the stopwatch counts physical time: 50 steps x dt'); eq(R.trace.length,50,'the wave meter recorded 50 samples');
    const p=TOOLS.probes[0], S=SCENES.water; close(R.trace[49][1],probeValue(R,p[0]*S.W,p[1]*S.W),1e-15,'its last sample is the probe’s current value');
    { const L=R.lat, i=40, j=70, x=xOfCell(R,i), y=xOfCell(R,j); close(probeValue(R,x,y),L.u[j*L.nx+i],1e-12,'a probe on a cell centre reads that cell'); }
    { /* off the cell centres, on a linear field, bilinear interpolation is exact */
      const R2=makeRun('water','point',1), L=R2.lat; for(let j=0;j<L.ny;j++) for(let i=0;i<L.nx;i++) L.u[j*L.nx+i]=0.3*i-0.7*j+2;
      const X=48.37, Y=91.81; close(probeValue(R2,xOfCell(R2,X),xOfCell(R2,Y)),0.3*X-0.7*Y+2,1e-10,'a probe between cells reads the linear field exactly (bilinear)'); }
    Object.assign(ST,stSave); resetRuns(); }
  { /* the parcels: displacement along +grad p, largest push 0.3 of their spacing on a plane wave */
    const R=makeRun('sound','plane',1); R.plane.barrier='none'; R.A=10; for(let s=0;s<260;s++) runStep(R);
    const P=parcelPositions(R); let mx=0; for(let q=0;q<P.length;q++){ const a=Math.floor(q/21), b=q%21, X0=cellOfX(R,a*SCENES.sound.W/20); mx=Math.max(mx,Math.abs(P[q][0]-X0)); }
    ok(mx<=0.3*LAT.VIS/20*1.001&&mx>0.2*LAT.VIS/20,'parcels move at most 0.3 of their spacing, and visibly ('+fmt(mx,3)+' cells)');
    const q=10*21+10, X=P[q][0], i0=Math.round(cellOfX(R,10*SCENES.sound.W/20)), g=(R.lat.u[75*R.lat.nx+i0+1]-R.lat.u[75*R.lat.nx+i0-1])/2;
    ok((X-cellOfX(R,10*SCENES.sound.W/20))*g>0,'a parcel moves UP the pressure gradient (crowding where p is high)'); }

  /* ---------- K. the readouts ---------- */
  const panelCases=[];
  for(const v of ['tank','two','slits']) for(const sc of SCENE_IDS) panelCases.push({view:v,scene:sc,tape:true,watch:true,meter:true,graph:true});
  panelCases.push({view:'slits',scene:'light',barrier:'none'},{view:'slits',scene:'water',barrier:'one'},{view:'two',scene:'light',src2:false});
  for(const a of AP_LIST) panelCases.push({view:'far',ap:a.id});
  panelCases.push({view:'far',laser:false},{view:'path'},{view:'path',pd:0.4},{view:'lattice'},{view:'lattice',scene:'light'});
  for(const c of panelCases){ Object.assign(ST,DEFAULTS,c); resetRuns(); if(LATTICE_VIEWS[c.view]) runFor(c.view,40);
    const M=buildModel(), html=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
    ok(html.indexOf('NaN')<0&&html.indexOf('undefined')<0&&html.indexOf('Infinity')<0,'panels clean for '+JSON.stringify(c)); }
  { Object.assign(ST,DEFAULTS); resetRuns(); const M=buildModel(); ok(readoutHTML(M).indexOf('2.64 cm')>=0,'the tank readout prints the water wavelength 2.64 cm off the model');
    ok(readoutHTML(M).indexOf('&minus;0.79 %')>=0,'and PhET’s −0.79 % wavelength error there (python)'); }
  { Object.assign(ST,DEFAULTS,{view:'lattice'}); const h2=readoutHTML(buildModel()); ok(h2.indexOf('0.22, 0.37, 2.9, 11 %')>=0,'the lattice readout prints Mur-2 |R| 0.22, 0.37, 2.9, 11 % for water (python)'); }
  { Object.assign(ST,DEFAULTS,{view:'far'}); const h2=readoutHTML(buildModel()); ok(h2.indexOf('0.357&deg;')>=0,'the far-field readout prints the Airy ring at 0.357°'); }
  { Object.assign(ST,DEFAULTS,{view:'slits',scene:'light',barrier:'two'}); resetRuns(); const h2=readoutHTML(buildModel()); const want=sigf(34*sceneDx(SCENES.light),3)+' nm'; ok(want==='1532 nm'&&h2.indexOf(want)>=0,'the slits readout prints the lattice’s 34-cell separation, 1532 nm, not the 1500 asked for'); }
  /* every slider at its ends: the models stay finite and the panels clean */
  { let nBad=0, nCase=0; const chk=(c,what)=>{ nCase++; if(!c){ nBad++; console.log('  non-finite or unclean: '+what); } };
    for(const sc of SCENE_IDS){ const S=SCENES[sc];
      for(const f of [S.fmin,S.fmax]) for(const v of ['tank','two','slits']){
        const over={view:v,scene:sc,A:10,barrier:'two',tape:true,meter:true,watch:true,graph:true}; over['f_'+sc]=f;
        over['sep_'+sc]=f===S.fmin?S.sepMin:S.sepMax; over['slitW_'+sc]=f===S.fmin?S.slitWMax:S.slitWMin; over['slitD_'+sc]=f===S.fmin?S.slitDMin:S.slitDMax;
        over.bcol=f===S.fmin?BCOL_MIN:BCOL_MAX; Object.assign(ST,DEFAULTS,over); resetRuns(); runFor(v,12);
        const M=buildModel(), h2=readoutHTML(M)+eqbarHTML(M)+tagHTML(M);
        chk(h2.indexOf('NaN')<0&&h2.indexOf('undefined')<0&&h2.indexOf('Infinity')<0&&RUNS[v].lat.u.every(isFinite)&&isFinite(M.L.dt)&&isFinite(M.L.phetErr),v+' '+sc+' f='+f); } }
    for(const a of AP_LIST){ const keys=AP_KEYS[a.id];
      for(const lam of [DIF.LAMMIN,DIF.LAMMAX]) for(const end of [0,1]){
        Object.assign(ST,DEFAULTS,{view:'far',ap:a.id,lam});
        for(const k of keys){ const r=SLIDER_RANGE[k]; ST[k]=end?r[1]:r[0]; }
        const M=buildModel(), F=M.F, h2=readoutHTML(M);
        chk(isFinite(F.D.max)&&F.D.max>0&&F.cut.every(isFinite)&&h2.indexOf('NaN')<0&&h2.indexOf('undefined')<0,a.id+' at '+(end?'max':'min')+', '+lam+' nm'); } }
    for(const [pd,pL] of [[0.3,1],[8,1],[0.3,60],[8,60]]){ Object.assign(ST,DEFAULTS,{view:'path',pd,pL}); const M=buildModel(), h2=readoutHTML(M);
      chk(M.P.mins.every(q=>isFinite(q.y)&&isFinite(q.yf))&&h2.indexOf('NaN')<0,'path d='+pd+' L='+pL); }
    ok(nBad===0,'every medium, frequency end, separation, slit and barrier end, every aperture at its parameter and wavelength ends, and path difference at its corners: finite and clean ('+nCase+' cases)'); }
  Object.assign(ST,stSave); resetRuns();

  /* ---------- L. the scene object ---------- */
  { const shot=makeShot(1100,712); const S=makeScene({getContext:()=>shot});
    Object.assign(ST,DEFAULTS); resetRuns(); CLOCK.acc=0;
    let adv=0; for(let f=0;f<5;f++) if(S.step()) adv++; ok(adv>=2,'the tank advances in the frame loop');
    ST.view='far'; ok(!S.step(),'the far field is static'); ST.view='path'; ok(!S.step(),'so is path difference'); ST.view='lattice'; ok(!S.step(),'and the lattice view');
    /* the pointer: a tape end, a probe, the barrier */
    ST.view='tank'; ST.tape=true; ST.meter=true;
    let G=latGeo(shot,S.W,S.H,buildModel()); const t0=TOOLS.tape[0];
    ok(S.pointer('down',G.sq.x+t0[0]*G.sq.w,G.sq.y+t0[1]*G.sq.h),'pointer-down on a tape end grabs it'); eq(DRAG.what,'tape0','the first end');
    S.pointer('move',G.sq.x+0.1*G.sq.w,G.sq.y+0.2*G.sq.h); close(TOOLS.tape[0][0],0.1,1e-12,'the end follows the pointer'); ok(S.pointer('up',0,0),'released');
    S.pointer('down',G.sq.x+TOOLS.probes[1][0]*G.sq.w,G.sq.y+TOOLS.probes[1][1]*G.sq.h); eq(DRAG.what,'probe1','a probe grabs'); S.pointer('move',G.sq.x+2*G.sq.w,G.sq.y-50);
    close(TOOLS.probes[1][0],1,0,'clamped to the tank'); close(TOOLS.probes[1][1],0,0,'at the top'); S.pointer('up',0,0);
    ok(!S.pointer('down',G.sq.x+0.93*G.sq.w,G.sq.y+0.07*G.sq.h),'empty water grabs nothing');
    ST.view='slits'; ST.barrier='one'; G=latGeo(shot,S.W,S.H,buildModel()); const R=RUNS.slits;
    ok(S.pointer('down',cellX(G.sq,R,ST.bcol),G.sq.y1+12),'pointer-down on the barrier handle grabs it');
    S.pointer('move',G.sq.x+0.25*G.sq.w,G.sq.y1+12); eq(ST.bcol,Math.round(LAT.PAD-0.5+0.25*LAT.VIS),'the barrier follows to a quarter of the way');
    S.pointer('move',G.sq.x-500,0); eq(ST.bcol,BCOL_MIN,'and stops at PhET’s tenth'); S.pointer('up',0,0);
    ST.view='far'; ok(!S.pointer('down',300,300),'the far field ignores the pointer'); ST.view='path'; ok(!S.pointer('down',300,300),'so does path difference');
    Object.assign(TOOLS,JSON.parse(JSON.stringify(TOOLS0))); Object.assign(ST,stSave); resetRuns(); }

  /* ---------- M. the layout sweep ---------- */
  const SIZES=[[1400,820],[1100,700],[820,520],[560,380]];
  const GROUPS=[
    [{view:'tank',scene:'water'},160,[{},{look:'side',graph:true},{tape:true,watch:true,meter:true,graph:true}]],
    [{view:'tank',scene:'sound'},160,[{soundView:'particles'},{soundView:'both',graph:true,meter:true}]],
    [{view:'tank',scene:'light'},160,[{},{tape:true,watch:true,meter:true,graph:true},{screen:false},{inten:false}]],
    [{view:'tank',scene:'water',wave:'pulse'},90,[{}]],
    [{view:'two',scene:'water'},160,[{},{nodal:false,look:'side'}]],
    [{view:'two',scene:'light'},200,[{},{graph:true,meter:true},{src2:false}]],
    [{view:'slits',scene:'light',barrier:'two'},260,[{},{graph:true,meter:true,tape:true}]],
    [{view:'slits',scene:'light',barrier:'none'},160,[{}]],
    [{view:'slits',scene:'sound',barrier:'one',bcol:40},200,[{},{graph:true}]],
    [{view:'slits',scene:'water',barrier:'two'},200,[{}]],
  ];
  const FAR=[{},{ap:'rect',recW:0.4,recH:0.04},{ap:'cs'},{ap:'disorder',disL:4},{ap:'figure',figR:45},{ap:'gauss'},{ap:'slits',sltN:5},{laser:false},{farMode:'lin',ap:'ellipse',ellE:0.9}];
  const OTHER=[{view:'path'},{view:'path',pd:0.4},{view:'path',pd:8,pL:3},{view:'path',pL:60,asym:false},{view:'lattice'},{view:'lattice',scene:'light'},{view:'lattice',scene:'sound'}];
  const CONFIGS=[];
  for(const [base,steps,vars] of GROUPS) vars.forEach((v,i)=>CONFIGS.push([base,steps,v,i===0]));
  for(const v of FAR) CONFIGS.push([Object.assign({view:'far'},v),0,{},true]);
  for(const v of OTHER) CONFIGS.push([v,0,{},true]);
  const entRe=/&#?[a-zA-Z0-9]+;|<[a-zA-Z][^>]*>/;
  for(const [base,steps,over,fresh] of CONFIGS){
    Object.assign(ST,DEFAULTS,base,over);
    if(fresh&&LATTICE_VIEWS[base.view]){ resetRuns(); if(base.wave==='pulse'){ const R=syncRun(base.view); firePulse(R); } runFor(base.view,steps); }
    const nm=JSON.stringify(Object.assign({},base,over));
    for(const [W,H] of SIZES){
      const c=makeShot(W,H); let err=null;
      try{ drawView(c,W,H,buildModel()); }catch(e){ err=e; }
      ok(!err,nm+' '+W+'x'+H+' draws without throwing'+(err?': '+(err.stack||err):''));
      if(err) continue;
      const texts=c.ops.filter(o=>o.op==='text'), fills=c.ops.filter(o=>o.op==='fill'), rects=fills.reduce((a,o)=>a+(o.n||1),0);
      const strokes=c.ops.filter(o=>o.op==='stroke').length;
      /* floors on what the ops CARRY (rect sub-paths), per kind of view: the fields batch
         thousands of cells into a few fills; the lattice analysis is curves */
      const side=ST.look==='side'&&ST.scene==='water';
      const floor=base.view==='far'?(base.laser===false?4:30):(LATTICE_VIEWS[base.view]?(side?4:60):(base.view==='path'?20:0));
      ok(rects>=floor&&texts.length>=2&&(base.view!=='lattice'||strokes>=12),nm+' '+W+'x'+H+' draws substance ('+rects+' rects, '+strokes+' strokes, floor '+floor+')');
      let bad=null;
      for(const t of texts){
        if(entRe.test(t.t)){ bad='entity/tag: "'+t.t.slice(0,40)+'"'; break; }
        if(/undefined|NaN|Infinity/.test(t.t)){ bad='NaN/undefined: "'+t.t.slice(0,40)+'"'; break; }
        if(t.bb[0]<-1||t.bb[2]>W+1||t.bb[1]<-1||t.bb[3]>H+1){ bad='off-canvas: "'+t.t.slice(0,30)+'" ['+t.bb.map(v=>fmt(v,0))+']'; break; } }
      ok(!bad,nm+' '+W+'x'+H+' text clean ('+(bad||'ok')+')');
      let hit=null;
      for(let i2=0;i2<texts.length&&!hit;i2++) for(let j2=i2+1;j2<texts.length;j2++){
        const a=texts[i2].bb,b=texts[j2].bb; const ox=Math.min(a[2],b[2])-Math.max(a[0],b[0]), oy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);
        if(ox>0.5&&oy>0.5){ hit='"'+texts[i2].t.slice(0,22)+'" vs "'+texts[j2].t.slice(0,22)+'"'; break; } }
      ok(!hit,nm+' '+W+'x'+H+' no text collisions ('+(hit||'ok')+')');
      /* the house #hint (HTML, bottom:11px, 11px type) owns the bottom-left corner, and the
         display-list capture cannot see it because it is not canvas (wave-on-a-string) */
      const inHint=texts.filter(t=>t.bb[0]<340&&t.bb[3]>H-27);
      ok(!inHint.length,nm+' '+W+'x'+H+' nothing under the #hint line'+(inHint.length?' ("'+inHint[0].t.slice(0,30)+'" to y '+fmt(inHint[0].bb[3],0)+')':''));
      let leg=null;
      for(const r of LEGEND_RECTS) for(let i2=0;i2<POLY_SEGS.length;i2+=4){
        const x0=POLY_SEGS[i2],y0=POLY_SEGS[i2+1],x1=POLY_SEGS[i2+2],y1=POLY_SEGS[i2+3];
        if(Math.max(x0,x1)<r.x||Math.min(x0,x1)>r.x+r.w||Math.max(y0,y1)<r.y||Math.min(y0,y1)>r.y+r.h) continue;
        leg='a curve crosses the legend'; break; }
      ok(!leg,nm+' '+W+'x'+H+' legend clear');
    }
  }
  Object.assign(ST,stSave); resetRuns(); Object.assign(TOOLS,JSON.parse(JSON.stringify(TOOLS0)));

  const dt=(Date.now()-T0)/1000;
  console.log(pass+' passed, '+fail+' failed  ('+fmt(dt,1)+' s)');
  if(fail>0) throw new Error(fail+' self-test failure(s)');
  return fail;
}

/* ============================== entry ============================= */
if(typeof document==='undefined'){
  selfTest();
} else {
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
</body>
